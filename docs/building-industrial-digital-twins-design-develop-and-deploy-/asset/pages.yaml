  md: '# # Creating an application to update the Digital Twin prototype in no/low
    code


    In the previous section, we described the process of creating your first Digital
    Twin of a wind farm by coding the solution in an IDE if you have the necessary
    programming background and skills. This approach gives you the full flexibility
    of a custom application that is developed to address the unique requirements of
    your use case, but it does require programming skills.


    A no-/low-code approach may be more suited to subject-matter experts with limited
    coding skills and who prefer to compose applications using a visual programming
    approach. Recently, low-code development technologies have been the center of
    attention as a means to accelerate digital transformation. The analyst firm Gartner
    recently predicted that **low-code application platforms (LCAPs)** will grow by
    23% during 2021 (see `https://www.gartner.com/en/newsroom/press-releases/2021-
    02-15-gartner-forecasts-worldwide-low-code-development- technologies-market-to-grow-23-percent-in-2021`).
    The industrial giant Siemens purchased Mendix for $700 million in 2018 for such
    LCAP capabilities. Oracle APEX is another example of an LCAP; see `https://apex.oracle.com/en/
    platform/low-code/` for more information.


    There are several no-/low-code solutions to choose from. Here, we will use XMPRO
    to demonstrate the configuration process using a no-/low-code platform that has
    native support for Azure Digital Twins. We will recreate the wind turbine Digital
    Twin solution in XMPRO to demonstrate how the two approaches differ for the maintenance
    and field service use case. XMPRO provides a free 120 days trial license for readers
    of this book at `https://xmpro.com/idtbooktrial`.


    The challenge with this approach is that subject-matter experts and operational
    Digital Twin users who are not skilled developers cannot use the ADT service without
    the assistance of a developer. No-/low-code application development tools that
    are aimed at these subject-matter experts address the challenge, but it reduces
    the flexibility of the applications developed on these platforms. Applications
    on no-/low-code platforms need to stay within the boundaries of the platform.
    There are multiple no-/low-code applications on the market that can be used, but
    XMPro is a Microsoft .NET Core-based no-code platform with native support for
    Azure Digital Twins.


    In the next section, we will provide a brief overview of creating a similar application
    to the coded solution described in this chapter in the XMPro no-code environment.'
  merge: -1
  img_proc: true
