    \ will deliver the key capabilities of the Digital Twin (AI, real time, decision\
    \ support, and so on)?\n+   \n+   5. **External Challenges**: What are the external\
    \ red flags for the Digital Twin (security, data access, connectivity, and so\
    \ on)?\n+   \n+   6. **ROI Business Case**: How will this Digital Twin deliver\
    \ the planned _value at stake_, as described in _Chapter 1, Introduction to Digital\
    \ Twin_?\n+   \n+   7. **Key Metrics**: How will the Digital Twin be measured\
    \ quantitatively?\n+   \n+   8. **Integration**: What are the critical integrations\
    \ required to make it work?\n+   \n+   9. **Costing**: What is the projected cost\
    \ of developing and operating the Digital Twin?\n\nThe preceding diagram shows\
    \ a complete canvas for a slurry pump as part of a predictive maintenance Digital\
    \ Twin in an industrial mining company. One of this approach’s main benefits is\
    \ that the canvas provides a single-page view of all the critical aspects of interest\
    \ to executive decision-makers. The template for the canvas is available to download\
    \ at `https://bit.ly/idt-ldtc`.\n\nThe Lean Digital Twin canvas is ideal as a\
    \ solution planning framework for your first Digital Twin, since it ensures that\
    \ you have documented the problem statement and visibly clarified the expected\
    \ outcomes."
