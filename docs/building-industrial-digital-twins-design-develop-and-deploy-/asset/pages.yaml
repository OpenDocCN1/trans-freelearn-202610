    The first step is to set up an Azure account. Microsoft provides a free account
    option at the

    time of writing the book. The second step is to create an ADT resource or service
    in the

    Azure account that you’ve created. The third step is to give yourself user and
    data access

    to the ADT resource you created. You can also give others access to your ADT service

    during this step. The ADT resource that you created requires an Azure app resource
    to

    be able to code against the ADT service. We configure the app resource during
    the fourth

    step. Finally, in the fifth step, we give the app resource access and permissions
    to the

    ADT service.


    You can see an overview of this in the following screenshot:


