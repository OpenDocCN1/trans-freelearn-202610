- pgno: 265
  md: "# # Interview on Digital Twins with William (Bill) Ruh, CEO of Lendlease Digital\n\
    \n# ## Biography:\n\nA 35-year veteran of the software and internet industries,\
    \ Mr. William (Bill) Ruh is the Chief Executive Officer for Lendlease Digital.\
    \ In this role, he is building a new business to help transform the real estate\
    \ industry. Lendlease Digital is developing the world’s first set of autonomous\
    \ building products to automate design, supply chain, construction, and operations.\
    \ He also serves on the Board of Directors of Magna International and CADMakers.\n\
    \nPrior to joining Lendlease, Mr. Ruh was the CEO of GE Digital and the Chief\
    \ Digital Officer for GE. During his tenure, Mr. Ruh led the charge to develop\
    \ the first cloud-based platform for the industrial world and established the\
    \ GE Digital business unit. A recognized expert in the emerging Industrial Internet\
    \ of Things, he helped establish the Industrial Internet Consortium and was a\
    \ member of the US Dept of Commerce Digital Economy Board of Advisors.\n\nMr.\
    \ Ruh is an accomplished author of four books and a frequent speaker on such topics\
    \ as industrial internet, IoT, industrial AI and ML, and digital industrial strategy:\n\
    \nhttps://www.lendlease.com/us/company/leadership/william-ruh/\n\n+   1. **Please\
    \ share one aspect of you that your formal biography does not cover.**\n+   \n\
    +   I was the lead founder of the Digital Twin Consortium. This has been a true\
    \ labor of love to create an organization that can help lead the world in the\
    \ development of a technology I believe holds the key to building a world that\
    \ is greener, more efficient, and enables better business outcomes. Digital twins\
    \ are the equivalent of a crystal ball allowing us to see the future or evaluate\
    \ alternative outcomes. This is a technology that the world needs to deal with\
    \ the complexity that we face in society, business, and government.\n\n+   2.\
    \ **Please share the major focus of your company over the last 1-2 years.**\n\
    +   \n+   The property and construction industries haven’t harnessed the power\
    \ of digital technology. Lendlease is leading the industry advances in cloud,\
    \ AI/ML, and analytics to automate the design, operations, and experiences in\
    \ residential, commercial, and retail spaces. The opportunity is large for those\
    \ that embrace this change – 20%+ reduction in development costs and the ability\
    \ to create experiences in the workplace and retail settings that make people\
    \ safer, more efficient, and happier. We are in the early days of the transformation\
    \ of our industry. Lendlease is leading the way into the future through the development\
    \ of our Podium Platform."
  merge: -1
  img_proc: true
- pgno: 266
  md: '# 3. What is your definition of Digital Twin or one of your unique perspectives
    on Digital Twin?


    What is a Digital Twin? I like to think about it as an exact representation in
    software of a physical object, whether that is a wind turbine, a building, or
    even a human being. The software can use real-time data to create a model of that
    object but more importantly allows for a what-if analysis to see all alternative
    outcomes given a variety of scenarios. Imagine a world where a part never breaks
    because it’s predicted when it will fail and is fixed during standard maintenance.
    Or a world where you can automate the design of a building down to the nuts and
    bolts, allowing for optimization of cost, quality, and sustainability. What I
    think the future holds is that every human will have a Digital Twin that consumes
    all the data about our lives and is able to guide us to a healthier life or predict
    significant health issues early enough to enable better outcomes.


    # 4. How is your company contributing to or embracing the Digital Twin?


    When I joined Lendlease is early 2019, there was already experimentation with
    Digital Twin technologies to automate the design of large-scale property development.
    Over the course of time, we have helped to found the Digital Twin Consortium,
    created more than a dozen Digital Twins of projects we are developing, and most
    importantly, have created the Podium Platform, allowing our company to automate
    the design and operations of buildings. We continue to be at the leading edge
    of technology working on the Building 4.0 CRC – a research program in Australia
    aimed at disrupting the development and construction industry. Digital twins are
    at the center point of our digital activities.


    # 5. Are Digital Twins ready for production use, pilot use, a bleeding-edge concept,
    or just hype today?


    Digital twins have been around for the last 20 years. They have been used primarily
    in military and space industries. However, in the last decade, they have started
    to move into high-tech manufacturing industries both in product design but also
    in maintenance activities. We have reached a point where the technology is moving
    into the mainstream. The Digital Twin Consortium has hundreds of member companies
    from all industries who are engaged. All of the major cloud providers are building
    services related to Digital Twins. We are in the early stages, but Digital Twins
    are becoming mainstream. The next 20 years are going to be exciting as we push
    the state of the industry forward.'
  merge: -1
  img_proc: true
- pgno: 267
  md: '# 6. Any words of advice for those exploring emerging technologies to adopt
    in their businesses?


    Digital twins hold tremendous promise from automated design to predictive maintenance.
    My recommendation for any business is a three-pronged approach. First is to ensure
    the organization is exploring and experimenting with the technology to be able
    to understand the possibilities. I was fortunate when I joined Lendlease that
    they were already experimenting and developing talent. The second is to look at
    the business outcomes that are possible with Digital Twins. At GE we focused on
    predictive maintenance since unplanned downtime in our industries was a significant
    problem. Digital twins were a perfect solution to reducing downtime. Finally,
    focus on using the technology on a few problems. Be careful of boiling the ocean.
    The technology is very powerful and you need to make sure the excitement of the
    technology doesn’t lead to doing too many things simultaneously. It’s a marathon,
    not a sprint.


    Further key links from Lendlease:


    +   - www.Lendleasepodium.com

    +   - https://www.prnewswire.com/news-releases/digital-and-sustainable-lendlease-and-google-cloud-partner-to-digitally-transform-the-built-world-301370423.html'
  merge: -1
  img_proc: true
- pgno: 268
  md: "# # Interview on Digital Twins with Anwar Ahmed, CTO - Digital Services at\
    \ GE Renewable Energy\n\n# ## Biography:\n\nAnwar Ahmed is a seasoned engineering\
    \ and technology leader leading software product and Digital platform development\
    \ with extensive experience with Industrial IoT Platforms, Data, Analytics, and\
    \ Digital Twins focused on the energy domain. He holds a Master’s degree in Engineering\
    \ Physics from Kakatiya University and a second Master’s degree in Instrumentation\
    \ and Control systems from Devi Ahilya University, India.\n\n+   1. Please share\
    \ one aspect of you that your formal biography does not cover.\n+   \n+   I have\
    \ two patents in the related area.\n+   \n+   * Digital Twin Interface for Operating\
    \ Wind Farms (US9995278B2)\n+   * Digital system and method for managing a wind\
    \ farm having plurality of wind turbines coupled to power grid (US10132295B2)\n\
    \n+   2. Please share the major focus of your company in the last 1-2 years.\n\
    +   \n+   At GE Renewable Energy, our focus is to design wind turbines that are\
    \ efficient and reliable, and to achieve this we heavily leverage software technology\
    \ all the way from designing and building powerful turbines to operating them\
    \ efficiently over its life. The Digital Wind Farm software we built starts at\
    \ the point of sensors generating data that is collected at the edge and streamed\
    \ to the cloud for storage and analysis. This allows us to monitor the turbines\
    \ in real-time and maintain uptime, taking quick actions from an electrically\
    \ secure perimeter. The historical data is analyzed to detect issues with the\
    \ turbine and also to predict possible component failures allowing us to move\
    \ out of unplanned to planned downtimes increasing overall turbine availability.\
    \ Our focus in the last few years has been to refine our analytics capabilities\
    \ through machine learning on data we have collected over years of turbine operations\
    \ and also leveraging the understanding of the physics of our turbine components\
    \ that we manufacture to drive direct outcomes for our customers."
  merge: -1
  img_proc: true
- pgno: 269
  md: '# 3. What is your definition of digital twin or one of your unique perspectives
    on Digital Twin?


    A Digital Twin is a software replica of the physical asset. It''s a mathematical
    model in the cloud of the turbine that continuously learns about its physical
    pair through machine learning. As more and more data flows over a period of time
    from the real asset, the model becomes smarter and intelligent allowing us to
    more easily simulate harsh conditions or situations that could potentially cause
    component failures. The learnings now can be transferred to the physical asset
    either as optimized control algorithms or just by manually taking actions like
    replacing components that are identified by the model that is about to fail. Each
    asset is unique in its own sense as it may see different physical conditions in
    its operation so modeling every asset separately is critical.


    # 4. How is your company contributing to or embracing the Digital Twin?


    The concept of Digital Twin is not new, but the term "Digital Twin" is. We have
    been doing Model-based control for a long time now where a learned model helps
    drive the control algorithm. Digital Twin is an advancement that takes modeling
    to a new level where instead of modeling a particular control loop you model the
    whole asset and continuously keep training this model. We create software models
    of our new design turbines and simulate wind conditions and various physical conditions
    our actual turbines see while in operation to see how the model behaves and tune
    the designs, helping us build better turbines that are more reliable and are built
    to last its lifetime. We are also using Digital Twins to calculate the remaining
    component life and perform life-based maintenance instead of fixed schedule maintenance.


    # 5. Are Digital Twins ready for production use, pilot use, a bleeding-edge concept,
    or just a hype today?


    The availability of the underlying technology is helping make Digital Twin a reality.
    Powerful CPUs to multi-core GPUs that can perform 15 TeraFLOPS per second have
    become mainstream. Both Microsoft Azure and AWS offer GPU-based VMs or containers
    that can run compute intensive mathematical models with ease and also offer all
    the software and pre-canned algorithms needed to do machine learning and AI. Today
    IoT hardware is available to even run heavy compute at the edge making it possible
    to build twins that help turn a new page in how we optimize and run our assets.'
  merge: -1
  img_proc: true
- pgno: 270
  md: 'I still think it is expensive to build machine learning models of the complete
    and large physical assets. The key today is to identify a high-value part of the
    problem and try to solve that specific problem via digital twin such as focusing
    on reducing unplanned downtime by detecting potential component failures in advance
    or build a Digital Twin to optimize the power generation of the wind turbine or
    to increase the overall availability of a wind turbine.


    +   6. Any words of advice for those exploring emerging technologies to adopt
    in their businesses?


    Technology is there and a lot of things are possible! But "Focus", Identify the
    problem you want to solve that drives a particular outcome for the customers.
    You don''t want to build a solution looking for a problem but rather identify
    a problem you want to solve and then build your solution.


    Any other relevant links:


    +   • Digital twin interface for operating wind farms: https://patents.google.com/patent/US9995278B2/


    +   • Digital system and method for managing a wind farm having plurality of wind
    turbines coupled to power grid: https://patents.google.com/patent/US10132295B2/'
  merge: -1
  img_proc: true
