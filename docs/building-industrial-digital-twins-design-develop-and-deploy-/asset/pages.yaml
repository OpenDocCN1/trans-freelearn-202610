- pgno: 60
  md: 'When a robot is used in the assembly line process of discrete manufacturing,
    such as a car

    in an automobile factory, a specific stage of the process can be digitized to
    optimize that

    stage. In this case, a Digital Twin of the robot, provided by its manufacturer
    (such as Kuka

    in Figure 2.6), can be used to map out the assembly process digitally, leading
    to simulation

    models to optimize the performance, including throughput and quality. This scenario

    allows Kuka to sell digital services powered by the Digital Twin of the robot
    to the factory

    operator. In turn, the factory operator can operationalize it for smart manufacturing

    and improve its throughput and the quality of the physical assets it is manufacturing.

    Finally, this digital data helps us to capture the birth record of the manufacturing
    process,

    contributing to the digital thread of the asset. Such service leads to the possibility
    of

    **Robots as a Service (RaaS)** for providers such as ABB or Kuka.


    A Digital Twin of the human heart and the smart pacemaker is a similar application
    if

    you think of the human body as a biological factory. Just like a smart robot can
    augment

    and improve factory operations, a pacemaker can improve the human body when the

    heart weakens. The pacemaker tries to replicate the human heart both mechanically
    and

    electrically. A Digital Twin of the pacemaker helps to personalize the physical
    asset – in

    this case, the pacemaker – to the human’s heart, who is using this specific pacemaker.

    The signals from the pacemaker, which have been digitally captured and modeled,
    help

    improve the delivery of care to the patient. (Please refer to https://www.reuters.

    com/article/us-healthcare-medical-technology-ai-insi/medtech-

    firms-get-personal-with-digital-twins-idUSKCN1LG0S0.)


    In this scenario, the Digital Twin provides the following possible outcomes:


    +   - The manufacturer of the pacemaker can gain insights into their product to
    improve

    +   its design over time.


    +   - The manufacturer can provide additional data and analytics services around
    the

    +   product to the physicians or the patient, as the understanding of the data
    and its

    +   patterns increase over time.


    +   - This allows care providers, such as physicians, to improve the monitoring
    and care

    +   of the patient including when to replace the battery in the pacemaker, which
    is an

    +   invasive process.


    +   - This allows the patient to self-monitor their own heart-related activities
    with the

    +   help of a smartphone- or tablet-based application.


    In the previous sections, we explored various scenarios, such as optimizing the
    assets in

    discrete manufacturing, the optimization of process manufacturing, and the smart
    factory.

    All of these areas can drive additional business outcomes by embracing the industrial

    Digital Twin. Figure 2.6 summarizes, in a simple visualization, how the Digital
    Twin adds

    value by providing insights into the intervention of the physical asset.'
  merge: -1
  img_proc: true
- pgno: 61
  md: 'This invention of the real-world object does not need to be automatic and can
    include

    a human in the loop in the early generations of the solution:


    ![](img/f445915fceb4649a77b6797f1425850b_61_0.png)


    Figure 2.6 – A feedback loop of the physical asset and Digital Twin


    The information regarding the physical object is a combination of the real-time
    sensor

    data and the historical knowledge of the asset. In a more advanced scenario, other
    sources

    of information might include third-party data, such as weather data or macroeconomics

    data, along with enterprise data from the IT systems at the enterprise.


    Next, let’s take a look at the industrial Digital Twin of systems, that is, **Supply
    Chain

    Management (SCM)**.


    # # Supply chain management


    SCM connects raw material providers to manufacturers. Then, on the distribution
    side, it

    connects the manufacturers to the business (B2B) or end user consumers (B2C).
    _Figure_

    2.7 shows the relationships between these different entities in a supply chain
    process:


    ![](img/f445915fceb4649a77b6797f1425850b_61_1.png)


    Figure 2.7 – The supply chain process'
