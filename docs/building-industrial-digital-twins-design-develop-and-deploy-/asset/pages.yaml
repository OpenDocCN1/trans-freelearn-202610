    "schema": "double"

    },

    {

    "@type": "Property",

    "name": "GPSLatitude",

    "schema": "double"

    }

    ]

    }

    ```


    This is an example of an interface file that does not have any telemetry or relationship

    data. The typical structure of an interface file is described in Figure 6.7 and
    is fully

    documented at http://bit.ly/idt-dtdl2.


    | Property | Required | Data type | Limits | Description |

    |---|---|---|---|---|

    | @id | required | DTMI | max 128 chars | A digital twin model identifier for
    the interface |

    | @type | required | IRI | | This must be "Interface" |

    | @context | required

    (at least

    once in the

    doc) | IRI | | The context to use when processing this

    interface. For this version, it must be set to

    "dtmi:dtdl:context;2" |

    | comment | optional | string | 1-512 chars | A comment for model authors |

    | contents | optional | set of Telemetry,

    Properties, Commands,

    Relationships,

    Components | max 300 contents | A set of objects that define the contents

    (Telemetry, Properties, Commands, Relationships,

    and/or Components) of this interface |

    | description | optional | string | 1-512 chars | A localizable description for
    display |

    | displayName | optional | string | 1-64 chars | A localizable name for display
    |

    | extends | optional | set of Interfaces | up to 2 interfaces

    per extends; max

    depth of 10 levels | A set of DTMLs that refer to interfaces this

    interface inherits from. Interfaces can inherit from

    multiple interfaces. |

    | schemas | optional | set of interface schemas | | A set of IRIs or objects that
    refer to the reusable

    schemas within this interface. |


    Figure 6.7 – Structure of an interface file'
  merge: -1
  img_proc: true
- pgno: 177
  md: 'Microsoft provides a DTDL extension for Visual Studio and the free version
