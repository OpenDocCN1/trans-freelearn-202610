- pgno: 115
  md: '# # Validating the problem statement and outcomes


    Reviewing the problem statement and expected outcomes is part of the initial phases''
    validated learning focus, as shown in _Figure 4.4_. It provides us with the opportunity
    to iterate and pivot toward a successful project continuously.


    It is essential to validate the problem that you are solving and the expectation
    of the business outcomes during each phase of the development life cycle (_Figure
    4.1_) of your Digital Twin prototype. The easiest way to do this is to use the
    lean Digital Twin canvas in a formal review workshop at the end of each phase.
    You can use this as a checkpoint to ensure that all the stakeholders are still
    aligned with both the problem and the expected business outcomes.


    You should update the canvas with a new version for each phase to provide valuable
    insights at the end of the project. By doing this, you will be able to evaluate
    the evolution of the problem statement on the expected business outcomes over
    the development life cycle. It is a handy tool to present to executives to show
    the Digital Twin’s evolution and development – not just of the technical aspects,
    but also the business considerations.


    Validating your problem statement and assumptions about your first Digital Twin
    outcomes is a crucial step that should not be overlooked. The first project often
    creates the lasting perception of a new approach such as Digital Twins in your
    organization. The second block in _Figure 4.4_ describes the approach, similar
    to the Product/Market validation in the Lean Startup approach. The adapted version
    of the Lean Digital Twin refers to the Digital Twin/Business Fit, which is used
    to validate the problem statement and check the expected outcomes.


    In this section, we proposed the Lean Digital Twin Canvas as a solution framework
    for planning the business validation and impact of your first Digital Twin. It
    is based on the Lean Startup approach, which emphasizes validated learning, and
    a key aspect of that is validating that we are solving the right problem to deliver
    the right outcome. We will cover how to validate the problem statement and expected
    outcomes next.'
  merge: -1
  img_proc: true
- pgno: 116
  md: '# # Exploring the business process for Digital Twin development


    It is essential to define the changes to the business processes and ensure that
    end users

    are trained to maximize these new insights from the Digital Twins. We mentioned
    this in

    the Phase 2 – the project design and development phase section, but this impact
    must be

    considered early on during the Digital Twin project’s life cycle:


    ![](img/f445915fceb4649a77b6797f1425850b_116_0.png)


    Figure 4.6 – Example of business process changes based on Digital Twin inputs


    The preceding diagram describes the business process impact of a Digital Twin
    in the

    predictive maintenance example for slurry pumps in a mine. This example demonstrates

    the interaction between the Digital Twin, reliability engineering teams, maintenance

    planning teams, and the maintenance crews.


    It is the responsibility of the Digital Twin delivery team to ensure that existing
    processes

    are changed to include new ways of working, especially when it impacts operations
    and

    business users that are not working with digital technology solutions regularly.


    This may require a formal business process review for a larger-scale project,
    but we

    suggest that you map out simple process diagrams for your first Digital Twin,
    similar

    to the example shown in the preceding diagram. This will improve the collaboration

    and communication between various stakeholders and make the changes visible to
    all

    the process participants. It is important to review these changes during each
    phase, but

    specifically during the validation phase to ensure that the proposed new process
    improves

    the overall experience:'
  merge: -1
  img_proc: true
- pgno: 117
  md: '![](img/f445915fceb4649a77b6797f1425850b_117_0.png)


    Figure 4.7 – End-to-end business process initiated by a Digital Twin of a pump


    The preceding diagram shows a simple, end-to-end business process for a pump where
    the Digital Twin is receiving real-time data from the physical pump. When the
    Digital Twin predicts a potential failure, it sends a message to a service technician
    to initiate the repair. The Digital Twin can create the corresponding work order
    in the business system, such as an ERP.


    Changes to business processes are not the only consideration for your first Digital
    Twin. Technology decisions that you make at this point may influence the outcome
    and scale at which you can deploy future projects. Let’s address some of those
    technological considerations.


    # # Factoring in technology considerations


    Now that we have a clear understanding of the problem that we want to address
    with our first Digital Twin, the expected outcomes, the different project phases
    in a lean and agile development cycle, and the business processes required to
    support it, we need to address the technical considerations for the first Digital
    Twin.


    To standardize on Digital Twin definitions, interoperability, and how to interact
    with these Digital Twins, various organizations are working on technology standards
    to address these challenges. Two notable projects in this area are the Asset Administration
    Shell (AAS), developed by Plattform Industrie 4.0 (https://bit.ly/idt-aas), and
    the Digital Twin Definition Language (DTDL), which is sponsored as an open source
    initiative by Microsoft (https://bit.ly/idt-dtdl). In addition to these, there
    are also standards frameworks for Digital Twins in manufacturing in current development,
    such as "The Digital Twin Manufacturing Framework," which will be published as
    ISO 23247.'
  merge: -1
  img_proc: true
- pgno: 118
  md: 'Both the AAS and DTDL initiatives focus on technically describing and instantiating
    Digital Twins and have a significant technological impact. At the time of writing,
    both of these are still developing standards, without sufficient details to help
    us create fully operational, standalone Digital Twins. Deciding on either of these,
    or perhaps even your own proprietary approach, is a crucial architectural decision
    that’s influenced by the technology stack in your organization and the level of
    sophistication that you require in the short and medium term. The benefit of creating
    your first Digital Twin as a minimum viable product also allows you to test these
    approaches before deciding on a standard for your business.


    To decide on which standard you should use for your first industrial Digital Twin,
    we will look at the two emerging standards we mentioned previously (AAS and DTDL)
    at a high level.


    # # Asset Administration Shell


    The **Asset Administration Shell (AAS)** is the implementation of the Digital
    Twin for Platform Industry 4.0, a network of companies, associations, trade unions,
    scientific organizations, and governmental entities in Germany. It is developed
    by the working group for “Reference Architectures, Standards, and Norms” (**WG1**)
    of Plattform Industrie 4.0 (`https://bit.ly/idt-wgI40`):


    ![](img/f445915fceb4649a77b6797f1425850b_118_0.png)


    Figure 4.8 – High-level metamodel of AAS: `https://bit.ly/idt-zvei-aas`'
  merge: -1
  img_proc: true
- pgno: 119
  md: 'One of the reasons for considering AAS for your Digital Twin architecture is
    the potential library of Digital Twins from product manufacturers that can be
    used in assembling a composite Digital Twin.


    AAS is predominantly associated with the Industrie 4.0 movement, with most activity
    from European manufacturers and their customers. The technology consideration
    is primarily around the interoperability with other AAS-based asset Digital Twins.


    It is not in this book’s scope to provide a full technical evaluation of AAS,
    but it is a critical technical consideration for standardizing your Digital Twin
    development in the future. The official technical information is available at
    https://bit.ly/idt-zvei-aas, but we will cover some of the essential decisions
    for your first Digital Twin here.


    One of the technical considerations for Digital Twin development is the format
    you use to define, create, store, and operate the Digital Twin information models.
    Standardizing on these efforts will help with interoperability among Digital Twins.
    It will also reduce the integration effort and make the reuse of models easier
    to achieve.


    Physical assets are central to AAS. The framework is designed to cater to assets,
    components, information, and sub-models that establish a product hierarchy, somewhat
    similar to a bill of materials. This is a useful construct for a Digital Twin
    information model since it needs to operate in the broader Industrie 4.0 ecosystem
    of suppliers and consumers. It provides a shared understanding of an asset in
    a machine-readable format, and AAS is a metamodel description of assets and their
    related data. There are data specification templates for defining concept descriptions
    for properties and physical units in the AAS framework.


    The following AAS serializations and mappings are currently offered. We have also
    specified their typical use cases:


    +   - XML and JSON for exchange between partners via the .aasx exchange format

    +   - **Resource Description Framework (RDF)** for reasoning

    +   - AutomationML for the engineering phase

    +   - The **OPC unified architecture (OPC UA)** for the operation phase'
  merge: -1
  img_proc: true
