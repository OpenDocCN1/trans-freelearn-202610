- pgno: 198
  md: '# # Technical evaluation considerations


    Our Digital Twin is expected to reflect the current condition of our physical
    asset, which is a wind turbine in a wind farm. In our case, we ensured that the
    DTDL of the different sub-assemblies of the wind turbine contained the data elements
    necessary for our goal, which is predictive maintenance of the wind turbine when
    operating in the farm. Referring to Figure 6.25, we can see attributes such as
    the gearbox oil level, the oil temperature, and the bearing temperature are captured
    in the DTDL elements for the gearbox.


    ```

    {

    "@type": "Property",

    "name": "Manufacturer",

    "schema": "string"

    },

    {

    "@type": "Telemetry",

    "name": "GearboxOilLevel",

    "schema": "double"

    },

    {

    "@type": "Telemetry",

    "name": "GearboxOilTemp",

    "schema": "double"

    },

    {

    "@type": "Telemetry",

    "name": "BearingTemp",

    "schema": "double"

    },

    ```


    Figure 6.25 – Example data elements of the wind turbine’s gearbox


    Figure 6.24 shows the ability to visually display attributes such as the gearbox
    oil viscosity via the visualization application of the Digital Twin over a specific
    time interval. Since gearbox oil condition monitoring is a common practice in
    the industry for wind turbines, this helps to connect the dots between the Digital
    Twin application and a meaningful parameter for the business user.


    The Digital Twin application can provide a view of the wind turbine at a point
    in time in a monitoring and diagnostic (M&D) center such as the one shown in Figure
    6.26. Such M&D centers are generally used by the service organization of the manufacturer
    to maintain the entire fleet of its wind turbines, which are under warranty or
    service contracts.'
