- pgno: 222
  md: 'In our experience, before-and-after _snapshots_ work well to demonstrate the
    impact to busy executives who need to decide to sponsor your Digital Twin project
    from pilot to full-scale deployment.


    The scope of this book focuses on the development of your first Digital Twin prototype,
    and piloting this solution is the first significant proof point for the actual
    value of your Digital Twin solution. For that reason, we provided an expanded
    explanation of the process and the steps to take during a pilot rollout.


    When your pilot implementation proves that the technology works, it delivers value,
    the business users will use it, and it will secure sponsorship for operationalizing
    it at scale, then the next phase in _Figure 7.10_ is to do a full-scale deployment
    of your Digital Twin solution.


    # # Full deployment


    Now that we''ve completed both prototype development and a pilot installation
    of our Digital Twin solution, we are ready to move to full-scale deployment.


    We often hear the term _pilot purgatory_, which is associated with pilots that
    do not move to production. The **IoT World Forum (IoTWF)** reported in 2017 that
    60% of IoT initiatives stall at the POC and pilot phases (`http://bit.ly/idt-IoTWF`).


    This may sound like an alarming statistic, but in reality, it shows that the phased
    development approach of _Figure 7.10_ works as it filters out projects that are
    likely to be unsuccessful at scale. This means that these projects could not satisfy
    the criteria of the technology at work, the business value, or the user acceptance.
    It is better to have projects fail at the early stages when the financial and
    business impact is limited, rather than end up with expensive failed projects
    that also damage personal and organizational reputations.


    However, the next stage is a full-scale rollout across the new project scope for
    those projects that pass all the gates. The scope of a full-scale project covers
    all the scope elements in _Figure 7.11_ but will now include the full scope for
    deploying the Digital Twin solution at scale. Many of the items that were shown
    as _out of scope_ for the pilot will be _in scope_ for the full-scale rollout.


    This new scope will also define the best approach for deploying your Digital Twin
    solutions to multiple assets in multiple locations, such as the scenario we have
    in the wind-farm example.


    Next, we deep dive into implementation approaches.'
  merge: -1
  img_proc: true
- pgno: 223
  md: '# # Full-scale implementation approaches


    Large-scale distributed software projects typically follow one of two types of
    scaling deployment approaches. These approaches became popular in deploying complex
    **enterprise resource planning** (ERP) solutions, but provide excellent guidance
    built on experiences in large-scale software-based solution deployment. Here are
    these two commonly used approaches:


    +   - Big-bang approach

    +   - Phased approach


    Let''s now look at the details of each of these approaches.


    # ## Big-bang approach


    A **big-bang** approach describes a scenario where all the functionality of your
    Digital Twin solution is deployed across all assets in all locations. This approach
    means that all the Digital Twin instances go live simultaneously, and it is effective
    under the following conditions:


    +   - Basic Digital Twin functionality that passed the pilot implementation without
    any technical challenges

    +   - Limited geographical scope

    +   - A limited number of installations


    Complex Digital Twins with extensive integration are not ideal candidates for
    big-bang implementations. The geographical scope should be limited to close proximity
    for the different sites—for example, a smaller company with a limited number of
    wind farms in a county or state may benefit from a single implementation cycle.
    We would also not recommend a big-bang approach to projects with more than two
    or three implementation sites for Digital Twins.


    A big-bang approach is a higher risk than a phased approach. Still, one of the
    significant benefits is that an organization can enjoy quicker business value
    and results from their Digital Twins.'
  merge: -1
  img_proc: true
- pgno: 224
  md: 'A final point to consider while choosing between a big-bang or phased implementation
    approach is the impact on the organization. A big-bang approach typically has
    a more significant effect on resource availability and time that business users
    need to spend on the Digital Twin system and changing their business processes
    as a result of implementing Digital Twins.


    A big-bang approach may suit smaller-scale, limited-scope projects, but the preferred
    method is to deploy full-scale Digital Twin projects in a phased rollout to reduce
    risk and impact on the organization.


    # ## Phased approach


    A phased implementation approach is precisely as the name indicates. Based on
    the scope elements, we decide whether to roll out all the functionality on a site-by-site
    basis or even break it into sub-phases for different use cases.


    The complexity of your solution will determine whether you can implement the complete
    Digital Twin solution in a site-based phased approach. One of the benefits of
    a phased approach is that you can set milestones based on different scenarios
    or variables, such as the following:


    +   - Digital-twin use case

    +   - Business unit or plant/factory/site

    +   - Geographic location


    The only major drawback of this approach is that it typically takes much longer
    than a big-bang approach, which means it will take longer to realize the business
    impact of your Digital Twin project.


    One of the most significant benefits of this approach, however, is improved usability
    and adoption. Employees incrementally build their capability, especially when
    the phased approach is done not just by site but also by Digital Twin use case.'
  merge: -1
  img_proc: true
- pgno: 225
  md: 'The following screenshot shows an example of a global mining company that phased
