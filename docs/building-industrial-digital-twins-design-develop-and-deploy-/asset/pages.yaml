    (CAD)**.


    At the time of writing the book, ThingWorx consists of three main components to
    create Digital Twins (`http://bit.ly/idt-3thingworx`), outlined as follows:


    +   - **ThingModel**—A data model that serves as the foundation for a ThingWorx
    Digital Twin


    +   - **ThingWorx Composer**—An application development environment to configure
    models, compose services and logic rules, and manage the system configuration
    of the ThingModel


    +   - **ThingWorx Mashup Builder**—A UI authoring environment for visualization
    elements


    ThingWorx is a Java-based platform that can be installed locally or deployed on
    Microsoft Azure or Amazon AWS cloud infrastructure. ThingWorx can run on Microsoft
    Windows or Linux, based on the requirements of the customer organization. PTC
    ThingWorx is also available as a hosted PaaS as well as a SaaS solution for customers
    that do not want to manage the underlying compute infrastructure. The following
    screenshot shows a sample Digital Twin using PTC ThingWorx:'
