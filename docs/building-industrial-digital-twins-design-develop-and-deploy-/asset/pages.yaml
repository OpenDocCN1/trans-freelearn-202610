    # ## Configuring Digital Twin instances for the wind farms and turbines


    A wind farm can contain hundreds and even thousands of wind turbines. The Jiuquan
    Wind Power Base in China has about 7,000 wind turbines (see `https://www.power-
    technology.com/features/feature-biggest-wind-farms-in-the- world-texas`).'
  merge: -1
  img_proc: true
- pgno: 183
  md: 'One of the primary benefits of the Digital Twin software design approach is
    the ability

    to have a single Digital Twin model and several thousand Digital Twin instances.
    A

    change to the attributes in the model will make the attribute available to all
    the thousands

    of applicable instances. Digital twin applications can be developed to address
    specific

    business needs based on the information architecture in the Digital Twin model.


    To create the first wind farm Digital Twin instance, select the + button next
    to the **WT

    Farm** model (see _Figure 6.11_) and proceed to give the instance a unique name.
    This name

    will be the unique identifier or ID for the instance of the physical twin and
    cannot be

    changed later. This can be a serial number, an asset number, or any unique descriptor.

    For the purpose of the book, we will use windfarm1 as the unique name.


    ![](img/f445915fceb4649a77b6797f1425850b_183_0.png)


    Figure 6.11 – Create a unique instance for a specific wind farm'
  merge: -1
  img_proc: true
- pgno: 184
  md: 'Save the twin name, and the first instance of a wind farm will be created based
    on the wind farm DTDL model and the unique `windfarm1` ID.


    ![](img/f445915fceb4649a77b6797f1425850b_184_0.png)


    Figure 6.12 – Update instance-specific Digital Twin values


    You can edit the properties and edit the information for this instance in the
    right-hand property explorer pane, as shown in Figure 6.12. This will update the
    instance with that value in the field. We can update the name of `windfarm1` to
    `San Jose South Wind Farm`. The `$dtid` ID will remain unique and cannot be edited,
    but the values of the properties can be changed through ADT Explorer. `$dtid`
    is the instance ID, like the primary key in a relational database table.'
  merge: -1
