- pgno: 162
  md: '# # Data considerations for your Azure Digital Twin


    In the previous section, _Configuration and setup_, we described the process of
    setting up

    the ADT environment that we will use to create our first Digital Twin. ADT provides
    all

    the essential services to deploy, configure, and use a Digital Twin, but there
    are additional

    considerations around data and processes that require additional capabilities.


    The main capabilities of ADT are outlined here:


    +   • An open modeling language to describe all the characteristics and relationships
    of

    +   things or entities


    +   • A live execution environment to deploy this on


    The hostname for ADT will be required by ADT Explorer during the configuration
    to

    ensure that it is connecting to and visualizing the correct digital-twin service.
    You will

    find the **Uniform Resource Locator (URL)** in the properties of your ADT service
    in

    the Azure portal, as shown in the following screenshot:


    ![](img/f445915fceb4649a77b6797f1425850b_162_0.png)


    Figure 5.24 – ADT host URL


    Configuring Azure TSI is not required at this stage, but it will be used later
    to store

    temporal data for our first digital-twin prototype. Installation instructions
    are available

    at `http://bit.ly/idt-azuretsi`.


    The reasons for using Azure TSI is one of the topics discussed in the next section.'
  merge: -1
  img_proc: true
- pgno: 163
  md: 'ADT collects and stores this data for each instance of an entity and can be
    depicted as a

    graph node. It is a snapshot of the data at that point when the ADT entity is
    created or

    updated. ADT does not retain any of the historical data for that node on the graph.


    Retaining these values for reporting and analysis purposes requires additional
    storage

    processes. This can be done through additional Azure services to update Azure
    SQL, Azure

    Data Lake, and Azure TSI. These services are not required for the basic configuration

    of ADT but are practical considerations for deploying and using a Digital Twin
    in

    operational use cases.


    The nature of the asset and set of problems we want to solve with the Digital
    Twin will

    dictate the data elements we would need for building and maintaining the Digital
    Twin.

    Let’s take the case of a wind turbine. A Digital Twin of a wind turbine can be
    used to

    forecast the power generation for certain levels of wind conditions. Likewise,
    it can also

    be used to access the physical condition of the wind turbine if it encounters
    wind blowing

    harder than expected for a sustained period. For such scenarios, the wind speed,
    wind

    gust, temperature, humidity, and related data elements would have to be recorded
    and

    used for the Digital Twin. The granularity or how often these data elements are
    captured

    would depend on the nature of the parameter—for instance, the wind speed would
    have

    to be recorded more frequently than the temperature or humidity in the atmosphere.

    The previous readings were external to the wind turbine. However, for health monitoring

    and predictive maintenance of the wind turbine, we will have to collect internal
    motor

    temperature, as well as parameters such as viscosity and particulate levels of
    the oil in

    the gearbox.


    We may often have to deal with the availability and quality of required data for
    building

    and maintaining a Digital Twin. The security and compliance requirements at the

    enterprise might make the data inaccessible, in some cases. This is also tied
    to the

    ownership of the data. For instance, in the case of the wind turbine, the company
    that

    manufactures the wind turbine has access to the data during the assembly of the
    wind

    turbines and any "lab testing" such as physical inspection or non-destructive
    (NDT)

    testing. However, it may not have full access to the supplier parts. Likewise,
    once the wind

    turbine is shipped to the owner or the wind farm operator and is in use, the manufacturer

    may not have any or full rights to the data generated by the operations of the
    wind turbine.


    The analytics system of the digital-twin platform must account for the variability
    of the

    data elements available, once the wind turbine is operating in the field. The
    analytics

    orchestrations used with the digital-twin data can have rules to handle such scenarios—

    for instance, if wind turbine data is taken from model A, then substitute vibration
    by 5

    hertz (Hz) to account for no vibration sensors in model A. In some cases, the
    operator

    of the wind turbine may decide not to share certain data elements for privacy
    or local

    compliance reasons.'
  merge: -1
