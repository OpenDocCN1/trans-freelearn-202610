- pgno: 102
  md: '# # Demo and user acceptance


    At the end of each Sprint, the whole team meets in a conference, wherever possible,
    and

    the development team responsible for the story demonstrates progress to the stakeholders.

    The use of vertically sliced stories helps to make these demos tangible in nature
    to the

    business users. For instance, during the demo for the story, the twin of ARV movement

    on the second floor of the semiconductor fabrication plant (fab) of Shanghai,
    China, the

    team may show the 2D plot of the movement of a single ARV, in one small part of
    the fab.

    This would be meaningful to the business SME and they can provide the acceptance
    or

    rejection easily.


    # # Iterations


    The Agile development process is iterative in nature. As discussed previously,
    the

    stakeholder may accept or reject the outcome of the Sprint, the story, or the
    whole epic at

    the end of the cycle. Based on such feedback from the stakeholders, the team decides
    to

    persevere or pivot as the next step. In the WDC scenario, the team decided to
    persevere

    or take it forward for improvements. Their overall business objective was to improve
    the

    overall service time at the fab. This in turn would help WDC to improve the throughput

    and efficiency at the second floor of the fab. Once achieved, this success can
    be replicated

    in the entire fab and then in the other WDC locations.


    More details about these artifacts and Agile rituals can be found here: `https://www.

    atlassian.com/agile/scrum/artifacts`.


    In this section, we learned about the value of experimentation and iterations,
    for Digital

    Twin-related initiatives. The use of established software mythologies such as
    the Agile

    Manifesto helps to adopt practices that are likely to provide incremental value
    and reduce

    risks. While we used the example in the context of a software application, a similar
    process

    can be applied for the convergence of the physical and the digital world where
    the final

    solution involves hardware such as sensors and an IoT gateway as well as the software
    pieces.


    In the next section, we will look at ways to arrive at the finalist candidate
    for the Digital

    Twin initiatives.'
  merge: -1
