- pgno: 3
  md: '# # Foreword


    Shyam and Pieter are both recognized professionals in the industrial internet,
    IoT, and Digital Twins community. They converted the OT/IT task group to the Digital
    Twins Interoperability task group at the Industry IoT Consortium (formerly known
    as the Industrial Internet Consortium). They also led the task group in the development
    of the "Digital Twins for Industrial Applications" whitepaper.


    Shyam is the author of a book on industrial digital transformation, published
    by Packt. Pieter is currently the chair for the Natural Resources working group
    in the Digital Twin Consortium. He is actively developing a Digital Twin capability
    framework and a composable Digital Twin development methodology.


    In this book, Shyam and Pieter walk you step-by-step through creating your first
    Digital Twin prototype. It explores the "what, why, and how" of Digital Twin through
    an example project, which covers the entire lifecycle of a Digital Twin prototype
    development on the Azure Digital Twins platform.


    The authors'' extensive knowledge and experience in developing and deploying real-world
    industrial Digital Twins project are evident in the practical guidance and rich
    repository of tools, like the Lean Digital Twin Canvas, that they provide in every
    chapter. Their easy-to-follow advice on setting up the Azure Digital Twins services
    and their step-by-step approach to creating Digital Twin models and instances
    on the service will get you started on your first Digital Twin prototype in a
    few hours.


    This book is a valuable resource to anyone starting their first industrial Digital
    Twin project, not just for the technical content, but also for the clear guidance
    on using Digital Twins to solve real-world business problems.


    _Dan Isaacs_


    _CTO – Digital Twin Consortium_'
  merge: -1
  img_proc: true
