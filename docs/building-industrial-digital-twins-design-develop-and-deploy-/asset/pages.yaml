  md: 'The ADT service also differs from traditional relational databases in the sense
    that it

    does not create a new transactional row of data every time it is updated. It overwrites
    the

    previous instance state values with new state values. The instance is always a
    snapshot

    at a specific point in time of the state of the Digital Twin instance. It requires
    additional

    programming to persist data, such as telemetry time series data in a **time series
    database**

    **(TSDB)** such as Microsoft Time series Insights or InfluxDB.


