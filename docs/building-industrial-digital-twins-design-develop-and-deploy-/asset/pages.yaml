- pgno: 130
  md: '# # Application platforms


    Application platforms are the final category of Digital Twin-enabling technologies
    that you need to consider when developing and using Digital Twins in your organization.
    Application platforms are used to create vertically focused Digital Twin solutions
    in support of existing applications such as **Asset Performance Management (APM)**,
    **Enterprise Asset Management (EAM)**, and **Operations Performance Management
    (OPM)**. Digital Twins bring new capabilities to these business applications,
    and the configuration of Digital Twins is part of the broader application suite
    of the vendor itself.


    Some of the representative vendors for application platforms include the following:


    +   - AVEVA (aveva.com)

    +   - Bentley (bentley.com)

    +   - GE Digital (ge.com)

    +   - IBM (ibm.com)

    +   - Oracle (oracle.com)

    +   - SAP (sap.com)

    +   - Siemens (siemens.com)


    > > **Important Note**

    > > Please note that this is representative and not an exhaustive list. This has
    been provided as a reference.


    The application and use case of your Digital Twin will determine the digital platform
    capabilities that you require. Validating the business problem of the required
    outcomes, as discussed earlier in this chapter, is crucial in considering the
    right digital technology and infrastructure.


    This will become more obvious in the next chapter as we start setting up our first
    Digital Twin prototype.'
