- pgno: 181
  md: 'Log in to your free Azure service that you configured in _Chapter 5, Setting
    Up a Digital Twin Prototype_, before starting the ADT Explorer application.


    ![](img/f445915fceb4649a77b6797f1425850b_181_0.png)


