- pgno: 42
  md: '# Other


    The Digital Twin concept is increasingly used to model and manage less tangible
    entities.

    Some of these include the following:


    +   - Digital Twin of the Earth

    +   - Digital Twin of organizations

    +   - Digital Twin of bushfires


    These different examples show a diverse range of Digital Twin applications. There
    are

    many more that have not been included in this list. The range of potential applications
    is

    only limited by the imagination of those who are actively building these Digital
    Twins.


    A key element of all these examples is that they have clear and measurable value
    to the

    stakeholders of the Physical Twin or entity.


    # The value proposition of Digital Twins


    Digital Twin systems transform businesses by accelerating holistic understanding,
    optimal

    decision-making, and effective action.


    # Reduce complexity to improve understanding


    Grieves and Vickers'' initial objective was to manage assets and systems that
    were

    becoming increasingly complex with simpler, but representative, virtual instances.
    Digital

    Twins that are synchronized with physical entities provide situational awareness
    and other

    operational insights tailored to specific problems you are trying to address.


    Better insights into real-time and simulated behavior support making better decisions

    faster. Insights from Digital Twins are often more reliable than traditional approaches

    of searching for data in multiple enterprise systems. The consolidated data integration

    approach of a Digital Twin provides more reliable, comprehensive insights that
    improve

    the quality of the decisions that are made on that data. The structured information

    approach of a Digital Twin also lends itself to decision automation rather than
    just

    decision support.


    Having this improved understanding and better insights provides value in two key

    operational perspectives. We will look at these in the following subsections.'
  merge: -1
  img_proc: true
- pgno: 43
  md: '# # Improved situational awareness


    Businesses are increasingly forced to work in real time or near real time. Every
    day,

    companies are exposed to more and more internal and external events that need
    to be

    responded to in real time. These events can come from a multitude of sources:


    +   • The actions of people in a business


    +   • The actions of competitors, customers, legislators, or suppliers and supply
    chains.


    +   • Equipment breakdowns, process failures, and weather events


    +   • Real-time intelligence from business applications, and near real-time data
    from

    +   web services


    +   • More recently, the influx of information from IoT with sensor-based or smart
    device

    +   machine-borne data in IoT platforms


    Real-time situational awareness is a concept that came from the US Air Force when

    training fighter pilots to anticipate the actions of an enemy fighter. It is based
    on gathering

    information on the current state and environment of the situation, determining
    what the

    information means, and projecting the future state to create a corresponding action.
    It was

    described in military terms as the **Observe – Orient – Decide – Act (OODA)**
    loop.


    Digital Twins might not require the same millisecond response times as a military
    jet

    fighter, but the real-time synchronization of a Digital Twin representing a physical
    asset

    provides critical situational awareness that drives critical decisions. The supporting

    information for decisions can be augmented with predictive models, physics, and/

    or analytics-based data to provide operators with comprehensive decision support.

    Combining rules with decision information creates an opportunity for Digital Twins

    to become prescriptive and take autonomous action through decision automation.


    Both decision support and decision automation focus on delivering better business

    outcomes based on the situational awareness that''s gained through the Digital
    Twin.


    # # Improved business outcomes


    Digital Twins improve business outcomes in various ways, but we will focus on
    the impact

    of an industrial Digital Twin that represents a physical asset or entity such
    as a motor

    drive, a production plant, or a factory.'
  merge: -1
  img_proc: true
- pgno: 44
  md: 'The business impact of Digital Twins can be measured based on four major impact
    categories, as shown in the following table:


    | Category | Impact |

    |---|---|

    | Increase Revenue | • Improved Productivity • Increased machine uptime • Monetizing
    digital information and services (business model innovation) |

    | Reduce Cost | • Reduced machine or equipment failures • Optimized inventory
    and better supply chain management • Reduce rework and improved quality |

    | Improve Customer and Employee Experience | • Provide real-time situational awareness
    to customers and business users • Provide decision support through simulation,
    analytics augmented and virtual reality, and business rules embedded in the Digital
    Twin • Provide holistic or 360-degree visualization of an asset and its operating
    environment |

    | Improve Compliance and Reduce Risk | • Monitor real-time compliance on Health,
    Safety, and Environment • Improve transparency on operational use and maintenance
    of assets, specifically for classified equipment such as pressure vessels and
    pressure relief valves. (Insurance and asset integrity inspection services) •
    Automate compliance with Operational Excellence for business KPIs and balanced
    scorecards. |


    Figure 1.10 – The business impact of Digital Twins


    Each category represents a business value driver where a Digital Twin can act
    as a lever to influence overall business outcomes.'
  merge: -1
  img_proc: true
- pgno: 45
  md: '# # Transformational value


    The transformational value of Digital Twins in industrial applications focuses
    primarily on the impact on digital business transformation, as well as the development
    of new or improved products based on the transformation of Digital Twins.


    # ## Business transformation through digital transformation


    A Digital Twin is a change agent for formal digital transformation. A Digital
    Twin typically represents a specific initiative or use case around a business
    goal. Due to the digital nature of a Digital Twin, the particular use case or
    initiative is generally the project that drives specific digital transformation
    toward the business goal or outcome:


    ![](img/f445915fceb4649a77b6797f1425850b_45_0.png)


    Figure 1.11 – Digital transformation versus digitalization


    Digital Twins can affect business transformation by either improving efficiency
    through digitalization or providing added value by enabling new business models.
    The four quadrants in the preceding diagram show the impact of different Digital
    Twin initiatives that improve business process efficiency with digitalization
    and real-time data. Alternatively, it can monetize and leverage real-time data
    to change an organization’s operating business model. The top right-hand quadrant
    represents opportunities where businesses can, for example, sell new services
    based on their equipment, such as support contracts and consumable replenishment,
    based on the real-time data from their products and customers.'
  merge: -1
  img_proc: true
- pgno: 46
  md: 'Many organizations start with digitalization projects that improve efficiency.
    As they gain maturity when using Digital Twins, they move to the top right quadrant
    and look for ways to monetize these new digital assets.


    # ## New or improved products


    There are different ways to monetize these new digital assets, including selling
    operational and maintenance intelligence to operators and users. Equipment manufacturers
    can also use this information to provide ongoing services based on conditions
    or predictions gathered from real-time data.


    **Original Equipment Manufacturers (OEMs)** can also use information about the
    use and performance of their equipment in the field to provide feedback to help
    improve the design of their products and services. The actual use of assets in
    an industrial environment provides a wealth of information for Design Digital
    Twins, which can now use this information for better simulation, specifically
    in physics-based models.


    # ## Value at stake


    The World Economic Forum value at stake framework provides an alternative perspective
    on assessing the impact of digital transformation with technology-based approaches
    such as Digital Twins.


    The "value at stake" framework assesses the value in terms of the economics for
    the industry or the business and the impact on society. It has a simple representation,
    especially when communicating value to business executives and other stakeholders,
    who have a limited interest in the technical aspects of the Digital Twin but need
    to make the decisions to invest in Digital Twin technology.


    The digital value to the industry is based on two elements:


    +   - Value migration, which represents how revenue can shift between stakeholders
    such as competitors, customers, and other industry players. This aligns with the
    business model innovation opportunity described earlier in this chapter.


    +   - Value addition, which represents the regular business operational opportunities,
    such as increased revenue and reduced cost.'
  merge: -1
  img_proc: true
- pgno: 47
  md: 'The digital value to society focuses on three impact points:


    +   - The traditional economic measures for customers and employees in terms of
    cost, time saving, and efficiency improvements.


    +   - The societal impact in terms of job creation, new skills development, reduced
    traffic congestion, and safer working environments.


    +   - The environmental impact can be described by reducing CO₂ emissions or improving
    the management of tailings in mining:


    ![](img/f445915fceb4649a77b6797f1425850b_47_0.png)


    Figure 1.12 – Example of a value at stake analysis for a Digital Twin


    > Note

    > The preceding diagram has been adapted from https://reports.weforum.org/digital-transformation/introducing-value-at-stake-a-new-analytical-tool-for-understanding-digitalization/.


    The single-page view of the value at stake for a Digital Twin, shown in the preceding
    diagram, provides a simple yet powerful way to describe a Digital Twin’s value
    proposition.


    Now that we can describe the value of a Digital Twin, the next key step is identifying
    ideal candidates for Digital Twins in your business.'
  merge: -1
  img_proc: true
- pgno: 48
  md: '# # Identifying opportunities


    Digital Twins focus on addressing specific business challenges or exploiting new
    opportunities, as we saw in the value at stake description of Digital Twin applications.
    These challenges and opportunities provide guidance for identifying opportunities
    for Digital Twins in industrial applications. This will be covered in more detail
    in _Chapter 4, Getting Started with Our First Digital Twin_.


    The remainder of this book will focus on selecting and building your first Digital
    Twin, but let’s provide a summary of the high-level guiding principles that can
    be used to identify a potential pilot from a pool of candidates.


    For Digital Twins that focus on improving asset performance, reducing downtime,
    and increasing production or throughput, the ideal starting point is to identify
    current "bad actors." This approach is based on using current failure data, production
    loss information, or failure mode analysis on previous downtime incidents. Applying
    the 80/20 Pareto principle will help you identify the initial shortlist of entities
    that cause the bulk of the downtime.


    > > **Important Note**

    > > The Pareto principle states that for many outcomes, roughly 80% of consequences
    come from 20% of the causes (the "vital few"). Other names for this principle
    are the 80/20 rule, the law of the vital few, and the principle of factor sparsity:
    `https://bit.ly/DTPareto8020`.


    Digital Twins that focus on exploiting new revenue opportunities are generally
    more strategic and have well-described business cases. The technical feasibility
    of these opportunities is typically also a factor when designing the new service.
    Real-time data access, sensor information, and other functions of the Digital
    Twin are built from the start.


    The next step for both scenarios is to rank the business impact against the Digital
    Twin’s technical feasibility. Technical feasibility is generally a factor of infrastructure,
    connectivity, data access, appetite for change, and organizational maturity.'
  merge: -1
  img_proc: true
