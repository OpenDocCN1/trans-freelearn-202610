- pgno: 146
  md: 'XMPro is primarily targeted at engineers, scientists, geologists, and other
    **subject-matter experts (SMEs)** who prefer a low-code application development
    environment versus a traditional **integrated development environment (IDE)**
    such as Microsoft Visual Studio. XMPro consists of the following modules at the
    time of writing the book:


    +   - **XMPro Data Stream Designer**—This is a low-code integration and orchestration
    environment to connect real-time IoT data with analytics and actions. A Data Stream
