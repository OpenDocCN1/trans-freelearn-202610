- pgno: 13
  md: '# # Preface


    Digital twins are increasingly being used to improve the life cycle of complex
    products. This applies to improving both the product’s manufacturing process as
    well as its operations throughout its lifetime. As a result, both **information
    technology** (IT) and operations professionals are becoming interested in learning
    about Digital Twins. This book will apply the concept of Digital Twins by building
    a prototype for a wind turbine as an industrial asset for the field of renewable
    energy.


    You will understand how the technology selection is done for a Digital Twin. Then,
    you will learn how to evaluate the possible business outcomes from a Digital Twin,
    leading to analysis of the return on investment. The tutorial approach to building
    a Digital Twin using Azure Digital Twins will provide hands-on experience. Finally,
    you will see how this first industrial Digital Twin fits into the entire renewable
    energy generation ecosystem.


    # ## Who this book is for


    The audience for this book will be a mix of IT leaders, operational **line of
    business** (LOB) leaders, and **subject-matter experts** (SMEs) looking for guidance
    on the use of Digital Twins to drive digital transformation that delivers quantifiable
    value for industrial operations. This book is aimed at mid-career subject experts
    or business technologists such as engineers and operations managers, building
    the first prototype of a Digital Twin of a wind turbine as part of this book.
    It will enable these business technologists to assess the resource requirements
    and capabilities of Digital Twins across the complete design, development, and
    deployment life cycle of real-world Digital Twins.


    # ## What this book covers


    _Chapter 1, Introduction to Digital Twin_, describes the concept of Digital Twins
    and provides a brief history of its origins, and a definition for a common understanding
    of the Digital Twin concept. It provides an understanding of the use and application
    of Digital Twins with some industry examples.'
  merge: -1
  img_proc: true
- pgno: 14
  md: 'Chapter 2, Planning Your Digital Twin, identifies the key criteria to assess
    the use of a Digital Twin for your specific industrial challenge or opportunity.
    The chapter addresses prerequisites for Digital Twins and organizational factors
    to consider.


    Chapter 3, Identifying the First Digital Twin, covers the selection of Digital
    Twin candidates for a prototype, each from the perspective of the type of organization
    that is evaluating Digital Twins for their use cases.


    Chapter 4, Getting Started with Our First Digital Twin, explains the planning
    framework, how to validate the problem statement and expected outcomes, and the
    proposed business process for developing your Digital Twin. It identifies the
    different types of technology platforms that can be used to create the first Digital
    Twin prototype of a wind turbine.


    Chapter 5, Setting Up a Digital Twin Prototype, provides practical step-by-step
    guidance for selecting and setting up the infrastructure on a cloud platform in
    preparation for building the Digital Twin prototype in the next chapter.


    Chapter 6, Building the Digital Twin Prototype, describes the end-to-end process
    of building a real-world Digital Twin prototype on the Microsoft Azure Digital
    Twins platform. The chapter covers the complete development process, including
    testing, technical evaluation, and business validation steps.


    Chapter 7, Deployment and Value Tracking, guides you through the functional testing
    of the Digital Twin prototype and evaluates different deployment models for scaling
    the prototype to an operational production solution. The chapter further suggests
    value tracking approaches that demonstrate the value of the Digital Twin solution
    to the different stakeholders in an industrial enterprise.


    Chapter 8, Enhancing the Digital Twin, describes the possibilities beyond the
    first Digital Twin prototype. The chapter looks at the "art of possible" with
    Digital Twins and some of the emerging opportunities for Digital Twins to provide
    safer, greener, more responsible industrial operations with positive returns on
    the value at stake for all stakeholders. This chapter goes in depth into the application
    of Digital Twins for renewable energy generation.


    # To get the most out of this book


    You will get the most out of this book if you have basic technical proficiency
    in programming concepts such as JSON and Azure Functions. These skills are not
    prerequisites.'
  merge: -1
  img_proc: true
