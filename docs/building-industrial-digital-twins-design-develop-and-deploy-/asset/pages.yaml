    # # Testing the Digital Twin applications


    Let''s next look at the details for testing the Digital Twin application of the
    wind turbine.


    # ## Testing a coded solution developed in Visual Studio


    Functional testing for Digital Twin applications follows a more traditional software
    development testing approach, especially if the application is a coded solution
    designed in an IDE such as Visual Studio. The functional testing requirements
    will be dictated by the Digital Twin use case characteristics, such as the following:


    +   - Criticality of the Digital Twin application


    +   - Security and safety requirements


    +   - The complexity of integration to other systems and Digital Twins'
  merge: -1
  img_proc: true
- pgno: 208
  md: '+   - Level of autonomy and automation of control in the Digital Twin

    +   - Accuracy of data and recommendations


    The application functional tests for a coded Digital Twin application are based
    on best practices for complex system development. The objective of functional
    testing of software is to validate the application to the initial functional specification
    of the Digital Twin. Functional testing tests each stated function by providing
    input and verifying the output against the functional specification of the Digital
    Twin application. The most common functional tests are outlined here:


    +   - **Unit testing**—A software testing method whereby individual units of source
    code are tested by the developer to confirm the unit of code performs as expected.

    +   - **Smoke testing**—Initial or preliminary testing to determine if a software
    build is stable enough for further **quality assurance (QA)** testing.

    +   - **Sanity testing**—A surface-level testing method when new modules or code
    are added to decide if the application is stable enough for further development
    cycles before full functional testing.

    +   - **Integration testing**—Individual modules or components are combined and
    tested as a group. This method is highly recommended for composite Digital Twins
    where modules from different discrete Digital Twins need to interoperate to deliver
    the required function of the Digital Twin.

    +   - **White-box testing**—A method for testing the Digital Twin application
    whereby the tester has full knowledge of the internal structure and code of the
    digital twin solution.

    +   - **Black-box testing**—A method for testing the Digital Twin application
    whereby the tester has no knowledge of the internal structure or code of the Digital
    Twin solution.

    +   - **User acceptance testing (UAT)**—This is a method for testing whereby the
    end user of the Digital Twin application tests the solution to determine if it
    can be accepted or not.

    +   - **Regression testing**—This is a software testing method to verify that
    code changes have not adversely affected existing functionality. Partial or full
    re-execution of previous test cases identifies code that regressed.


    It is not in the scope of this book to explain each of these testing methods in
    detail, as this is a well-defined software discipline with many great resources
    available.'
  merge: -1
  img_proc: true
