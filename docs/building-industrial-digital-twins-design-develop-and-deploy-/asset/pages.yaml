- pgno: 235
  md: '# # 8 Enhancing the Digital Twin


    In Chapter 7, Deployment and Value Tracking, we discussed how to perform functional
    testing and then planned the deployment and rollout of the pilot for the Digital
    Twin. We looked at the ways to track the **Key Performance Indicators (KPIs)**
    and the overall value of the Digital Twin of the wind turbines. A successful pilot
    deployment of a Digital Twin often leads to rollout at scale to achieve the targeted
    business goals.


    In this chapter, we will look at ways to enhance the Digital Twin beyond the pilot
    phase. We will consider the perspective of different organizations to drive economic
    outcomes. We will cover the following topics in this chapter:


    +   - Defining the Twin of Twins

    +   - Evaluating the First Digital Twin in the Full System

    +   - Identifying related Twins

    +   - Planning Composite Twins

    +   - Enhancements and next steps


    Let''s start with the digital "twin of twins" concept.'
  merge: -1
  img_proc: true
- pgno: 236
  md: '# # Defining the Twin of Twins


    In this context, terms such as composite twins, twin of twins, and system of systems
    are often used. Let''s use the example of the energy ecosystem to understand this
    concept. In the energy ecosystem, we look at the hierarchy as follows:


    +   • An energy value chain that will consist of a) generation, b) transmission,
    c) distribution, and d) consumption, as shown in Figure 8.1. The grid can have
    one or many generation sources.


    +   • Energy generation can be broadly divided into a) fossil fuel or non-renewable
    sources and b) renewable sources.


    +   • With renewable sources, we can look at a) wind, b) solar, and c) hydro.


    +   • Wind farms can be a) onshore (land) or b) offshore (water).


    +   • Each wind farm will often consist of several turbines.


    +   • Each wind turbine has several sub-systems or sub-assemblies and components.


    ![](img/f445915fceb4649a77b6797f1425850b_236_0.png)


    Figure 8.1 – The energy value chain, including generation, transmission, and distribution


    > > **Note**

    > > Image source: https://www.flickr.com/photos/121935927@N06/13580677703'
  merge: -1
  img_proc: true
- pgno: 237
  md: 'A common example of the sub-systems of a wind turbine would be the rotor system,

    gearbox, blades, nacelle, generator, hydraulics, brakes, and the yaw system. We
    covered

    this in Figure 6.3 in Chapter 6, Building the Digital Twin Prototype. The overall
    reliability

    or the uptime of the wind turbine will depend on the reliability and uptime of
    the

    sub-systems.


    For more information, refer to the following:

    https://www.researchgate.net/publication/271973476_

    Reliability_Analysis_of_Sub_Assemblies_for_Wind_Turbine_at_

    High_Uncertain_Wind


    Based on this hierarchy view of the ecosystem, we can visualize the twin of twins
    shown in

    Figure 8.2 at a very high level:


    ![](img/f445915fceb4649a77b6797f1425850b_237_0.png)


    Figure 8.2 – The concept of the Digital Twin of twins for the energy ecosystem


    While the prior chapters of this book are limited to the Digital Twin of the Wind
    Turbine,

    it is important to understand the concept of the Twin of Twins as shown in Figure
    8.2 to

    plan for the deployment of the Digital Twin of the Wind Turbine at scale. If we
    look at

    the energy ecosystem from the perspective of an energy utility company that uses
    a wind

    farm(s) as one of the means of renewable energy, they will look to plan for other
    forms of

    generation as well. The other forms of generation, whether a solar farm(s) or
    gas-turbine

    power plant(s), may also have an associated Digital Twin of Twins. Hence, it is
    important

    to look at this problem statement as a system of systems. In theory, this may
    seem like

    a recursive relation, but different other engineering manufacturers of the different

    equipment could lead to different Digital Twin systems. This leads to the challenge

    of the interoperability of the Digital Twins in the composite solution.'
  merge: -1
  img_proc: true
- pgno: 238
  md: '# # The role of standards


    There are a few efforts to introduce standards, to make interoperability of twins
    easier. In _Chapter 7, Deployment and Value Tracking_, Figure 7.23 shows IEC 61400-25,
    which describes the standard data model for the interchange of information in
    the context of wind farms.


    Another such body is the SC 41, which is a subcommittee under JTC 1. JTC 1 is
    the joint **International Organization for Standardization (ISO)** and **International
    Electrotechnical Commission (IEC)**. SC 41 is working on **Internet of Things
    (IoT)** and Digital Twin-related standards. For more information, refer to the
    following:


    `https://www.iso.org/committee/6483279.html` and `https://www.iec.ch/blog/moving-ahead-standardization-digital-twin`


    _Figure 8.3_ shows the scope of the work of SC 41 in this context:


    ![](img/f445915fceb4649a77b6797f1425850b_238_0.png)


    Figure 8.3 – Scope of SC 41 and its activities


    **Note**

    Image recreated from source: `https://www.itu.int/en/ITU-T/ Workshops-and-Seminars/20180604/Documents/
    Francois_Coallier_P_V2.pdf`]'
  merge: -1
  img_proc: true
- pgno: 239
  md: 'In this context of the scope of activities of the SC 41 group, we should consider
    the term IoT in its broader sense, which would include technologies such as a
    Digital Twin.


    Some of the standards-related work by the SC 41 group includes the following:


    +   - ISO/IEC 21823-2, which describes a framework and requirements for the information
    exchange of IoT systems. It covers communication between IoT systems and within
    an IoT system.


    +   - ISO/IEC TR 30164, which describes the general concepts for edge computing
    for IoT system applications. Our scenario, computing a wind turbine, could be
    considered edge computing of an IoT system.


    +   - ISO/IEC TR 30166, which covers **Industrial IoT (IIoT)** systems and landscapes.
    It covers functional as well as non-functional aspects of IIoT. For more information,
    refer to `https://www.iso.org/news/ref2529.html`.


    We can see that the IoT- and Digital Twin-related standards are still evolving.
    We recommend that stakeholders of the Digital Twin initiative keep an eye on such
    evolving standards as project PWI JTC1-SC41-5 for the Digital Twin reference architecture.
    The stakeholders can incorporate them in their planning, to allow for interoperability
    with other systems. Some of the related documentation can be found here: `https://www.iec.ch/dyn/www/f?p=103:23:0::::FSP_ORG_ID:20486`.


    The **National Institute of Standards and Technology (NIST)** is also working
    on NISTIR 8356 considerations for Digital Twin Technology and emerging standards.
    For more information, refer to `https://csrc.nist.gov/News/2021/draft-nistir-8356-digital-twin-technology`.
    This draft document under the "trust considerations" of the Digital Twin talks
    about a "system of systems" that applies to the twin of twins. When a Digital
    Twin is composed of twins of different physical objects, the errors and corruption
    in data originating from the underlying twins can propagate and adversely impact
    the twin of twins. As a result, this document suggests that the underlying "twins
    should be wrapped with pre-conditions and post-conditions to determine if the
    output from one twin will be acceptable as input to another twin."


    This section about the emerging standards and guidelines for Digital Twins provides
    considerations and best practices for twin of twins systems. We recommend that
    the stakeholders of Digital Twin solutions keep a close eye on such emerging standards
    and guidelines to make their solutions robust and interoperable.


    Let''s next look at how to set the vision for the twin of twins.'
  merge: -1
  img_proc: true
- pgno: 240
  md: '# # Setting the vision


