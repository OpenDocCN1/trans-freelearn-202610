- pgno: 185
  md: 'Next, we proceed to create a wind turbine instance in a similar process for
    the WT Turbine model and update the specific instance data. When we have the instances
    for both the wind farm and the first turbine, we can proceed to link these instances
    with the relationship option in the top bar.


    ![](img/f445915fceb4649a77b6797f1425850b_185_0.png)


    Figure 6.13 – Set the relationship between two instances


