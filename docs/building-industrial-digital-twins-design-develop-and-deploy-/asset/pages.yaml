- pgno: 122
  md: 'Another technical consideration is around a standardized data model being deployed
    and managed in a single-technology environment. This approach makes sense when
    you are standardizing on a technology stack from a cloud solutions provider. The
    Microsoft DTDL open source initiative is an approach that supports this technical
    consideration.


    # # Digital Twins Definition Language (DTDL)


    Through its open source initiative, Microsoft developed the **Digital Twins Definition
    Language (DTDL)** as a language for describing models that include IoT devices,
    device Digital Twins, and asset Digital Twins. Device Digital Twins is the digital
    representation of a sensor device and includes device information such as battery
    level and connection quality, which is not normally associated with asset Digital
    Twins. DTDL uses a variation of JSON, namely **JSON-LD**, which is designed to
    be used as JSON or in **Resource Description Framework (RDF)** systems.


    DTDL consists of a set of metamodel classes in a similar approach to AAS. Six
    metamodel classes are used to define the behavior of DTDL-based Digital Twins:


    +   - Interface

    +   - Telemetry

    +   - Property

    +   - Command

    +   - Relationship

    +   - Component


    These metamodel classes can be implemented using a **Software Development Kit
    (SDK)**. More technical information on the open source implementation of DTDL
    and these six classes is available at `https://bit.ly/idt-dtdlv2`.


    Note that DTDL can only be deployed on the **Azure Digital Twins** service, which
    is available in the Microsoft Azure Cloud at the time of writing this book. Organizations
    that standardize their technology stack on Azure and Azure Services may prefer
    to use DTDL for their Digital Twin solution deployment. Visit `https://bit.ly/idt-adts`
    for more information on Azure Digital Twins.


    DTDL defines semantic relationships between entities to connect Digital Twins
    to a knowledge graph that reflects their interactions. It supports model inheritance
    to create specialized Digital Twins.'
