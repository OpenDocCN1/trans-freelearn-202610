    # # Evaluating public cloud, IoT, and specialty platforms for a Digital Twin


    Let’s look at the considerations for building a Digital Twin solution for a wind
    turbine. Enterprise computing has been shifting to the public cloud over the last
    decade, with the industry seeing the emergence of large-scale public cloud providers
    over this period. According to the _Magic Quadrant for Cloud Infrastructure and
    Platform Services_, published in September 2020, these are the major providers:


    +   - Microsoft Azure

    +   - Amazon Web Services (AWS)

    +   - Google Cloud Platform (GCP)

    +   - Alibaba Cloud

    +   - Oracle Cloud Infrastructure (OCI)

    +   - IBM Cloud

    +   - Tencent Cloud'
