- pgno: 50
  md: '# # Summary


    In this chapter, we started by taking a brief look at the history of Digital Twins
    and the original intent behind the concept. We discussed the difference between
    discrete and composite Digital Twins, and then we identified the elements required
    for something to qualify as a Digital Twin. We introduced several typical use
    cases across the life cycle of a Digital Twin, discussed the difference between
    a Digital Twin and a Digital Thread, and provided guidance on describing the value
    proposition of a Digital Twin. Our Digital Twin prioritization matrix provides
    a framework to perform a high-level assessment of the use cases for your first
    DTP.


    You now have an understanding of what a Digital Twin is, its key characteristics,
    the value of a Digital Twin, and assessing where a Digital Twin may apply in your
    business.


    The remaining chapters will guide you through building your first Digital Twin,
    beginning with planning your Digital Twin, identifying the right candidate for
    your first Digital Twin, and then providing guidance on setting up, building,
    deploying, and validating the outcomes of your DTP.


    This order of magnitude is visually represented in a bubble chart, with the business
    impact and technical readiness scores as the two significant measures. The weighted
    average values of each of these measures are placed on the graph, which is divided
    into four quadrants. The value of the economic impact determines the size of the
    bubble. The four quadrants represent the business readiness for each of the Digital
    Twin scenarios. The **Do Minimum Viable Product (MVP)** quadrant represents a
    high business impact and a high level of technical readiness.


    The opportunities on the quadrant’s far right-hand side, with the biggest bubble
    size, often represent Digital Twin projects with the highest likelihood of success
    for all stakeholders.


    This is a very simple approach to ranking possible candidates for your first Digital
    Twin; the next chapter will provide more guidance on planning your Digital Twin
    project.'
  merge: -1
  img_proc: true
- pgno: 51
  md: '# # 2 Planning Your Digital Twin


    In the previous chapter, we learned why we need Digital Twins and how to use them
    to drive specific business outcomes. We explored the history of the Digital Twin
    and the various industries in which it presents opportunities.


    Now, let’s examine how to plan for an industrial Digital Twin in an enterprise
    setting. We will identify the key criteria that can be used to determine whether
    the industrial Digital Twin is applicable to the business scenarios. Additionally,
    we will explore how to develop the business case for investments in the Digital
    Twin. Following this, we will explore the prerequisites for the Digital Twin in
    an enterprise, including the functional and non-functional requirements. This
    will allow us to identify the underlying digital technologies required for the
    Digital Twin. Note that we will not lose sight of the organizational factors that
    are in play for the success of the industrial Digital Twin initiatives.


    In this chapter, we will learn about the following topics:


    +   • Key criteria

    +   • Expected business outcomes

    +   • Prerequisites for the Digital Twin

    +   • Organizational factors

    +   • Technological needs'
  merge: -1
  img_proc: true
- pgno: 52
  md: '# # Key criteria


    Here, we will identify the key criteria to help an enterprise decide when the
    introduction

    of an industrial Digital Twin makes sense. The Digital Twin can be for a physical
    asset

    system or a process such as a manufacturing process in a plant. Depending on the
    target

    of the Digital Twin, objective criteria have to be established to ensure that
    the Digital Twin

    will add business value. Here, business values and outcomes are used in a broader
    sense,

    and they could include the following:


    +   - Improved life of the asset

    +   - Process efficiency gains

    +   - Operational optimization or lower operating costs

    +   - New digital revenues

    +   - Competitive advantage

    +   - Improved end customer satisfaction

    +   - Improved safety

    +   - A social good such as the reduction of the carbon footprint


    As a result, once the key criteria have been established, it is easier to evaluate
    the direct

    and indirect investments and opportunity costs versus the broader business value

    generated. Figure 2.1 shows this visually:


    ![](img/f445915fceb4649a77b6797f1425850b_52_0.png)


    Figure 2.1 – Evaluation of the business benefits of the Industrial Digital Twin'
  merge: -1
  img_proc: true
- pgno: 53
  md: 'In Chapter 1, Introduction to Digital Twin, we discussed the business value
    and transformational value as a result of the deployment of Digital Twins in the
    industry. The transformation value that is added can, often, be in form of new
    digital revenues. The monetization of Digital Twins can be based on a single Digital
    Twin or an ecosystem of twins, such as the concept of the **Twin2Twin (T2T) ecosystem**.
    (Please refer to https:// www.hcltech.com/blogs/twin2twin-new-paradigm-enterprise-
    digital-transformation). The concept of T2T is similar to **Digital Twin Aggregate
    (DTA)**. However, T2T can also include disparate twins, such as twins of buildings
    and spaces along with twins of **heating, ventilation, and air conditioning (HVAC)**
    and security systems to efficiently operate a commercial building. These T2T twins
    are not hierarchical in nature.


    A single Digital Twin can be monetized by the **original equipment manufacturer
    (OEMs)**, that is, by charging the customer for the use of the Digital Twin of
    the physical product. Such a Digital Twin can be sold as an add-on to the physical
    product and have a specific purpose, such as the predictive maintenance of the
    asset. The article on T2T, as referenced earlier, states that Digital Twins from
    different stakeholders in a value chain can help "to create a vibrant TWIN2TWIN
    economy." This will provide monetization opportunities to the different providers
    in the industry value chain. Today, marketplaces are common in the cloud computing
    world. One such example is Oracle’s Cloud marketplace, which allows various stakeholders
    to create a vibrant ecosystem of cloud computing services that they can monetize
    jointly. (Please refer to https:// cloudmarketplace.oracle.com/marketplace/oci.)


    We believe similar ecosystems of the Digital Twin will arise in which the different
    participants of the ecosystem will contribute to the interdependent parts of the
    Digital Twin of the system or Digital Twin aggregate.


    The commercial sector is often driven by profitability, so the Digital Twins should
    drive business value in general. However, in the public sector, the driver might
    be a social good, offering sustainability or an improved citizen experience. Singapore
    is experimenting with its own Digital Twin of a city. The government agency National
    Research Foundation has created Virtual Singapore, which is useful for simulating
    traffic or emergencies. (Please refer to https://www.youtube.com/ watch?v=QnLyy0owGL0&feature=youtu.be.)
    Therefore, it is clear that the key criteria for a Digital Twin would vary based
    on the stakeholders.


    In the next section, we will take a deeper look at the expected business outcomes
    for a specific industry in the commercial sector along with public sector scenarios.'
  merge: -1
  img_proc: true
- pgno: 54
  md: '# # Expected business outcomes


    In the Industry use of Digital Twins section of Chapter 1, Introduction to Digital
    Twin, we discussed the applicable industry segments for the industrial Digital
    Twin. Now,let’s take a look at the more specific business outcomes that are expected,
    or are possible, in some of these scenarios.


    # ## The manufacturing industry


    When dealing with physical products, the manufacturer is responsible for the following:


    +   - Product design and development

    +   - Manufacturing/assembly

    +   - Supply chain and distribution

    +   - Product warranty and reputation

    +   - Optional service contracts


    Let’s take a further look at discrete and process manufacturing within this context.


    # ### Discrete manufacturing


    Let’s take the example of aircraft manufacturing. A commercial aircraft is a fairly
    complex product and consists of assemblies such as the body or the fuselage, wings,
    two or four engines, landing gears, and the stabilizer. To build the Digital Twin
    of the aircraft as a composite asset, the prerequisite would be the Digital Twins
    of the major parts of the aircraft. These parts can be manufactured with different
    OEMs; for instance, the aircraft could be manufactured by Boeing but the engine
    could come from General Electric (GE). The Boeing-designed landing gear might
    be manufactured by United Technologies, which is now called Raytheon Technologies
    Corporation. Figure 2.2 depicts an aircraft and its major parts:'
  merge: -1
  img_proc: true
- pgno: 55
  md: '![](img/f445915fceb4649a77b6797f1425850b_55_0.png)


    Figure 2.2 – The major parts of an aircraft


    When the composite asset, such as an aircraft, is an assembly of supplier-provided
    assemblies, the composite Digital Twin would depend on the collaboration of the
    entire supply chain. In turn, each of the major OEMs, such as GE and United Technologies
    (now Raytheon), depends on several supplies for the smaller components.


    Since we are looking at a commercial aircraft, which is used by airlines to fly
    passengers and cargo, we can list the high-level business outcomes as follows:


    +   • **Aircraft manufacturer**: They provide reliable aircraft to the airlines.


    +   • **Aircraft services provider**: The manufacturer might also be the provider
    of the maintenance services, and responsible for ensuring reliability, uptime,
    and safety in operations.


    +   • **Aircraft owner or operator**: The airline that operates the aircraft is
    responsible for the safe and on-time operations of flights offered to its passengers.


    +   • **The airline’s passenger**: The end customer expects timely and safe flights
    at air travel costs that are on par or better than other airlines.'
  merge: -1
  img_proc: true
- pgno: 56
  md: 'The preceding list consists of easy-to-understand business outcomes in the
    context of a discrete manufacturing industry where the product is the aircraft.
    This is a good example of a **business-to-business-to-consumer (B2B2C)** business
    model where a business such as Boeing or Airbus is selling to another business
    such as American Airlines or British Airways and, in turn, offering services to
    an individual end consumer who is an airline passenger.


    Now that we understand the simplified value chain of the commercial airline industry,
    we can evaluate how an industrial Digital Twin of an aircraft would fit here.
    If the Digital Twin of the aircraft helps the manufacturer to build better aircraft
    or provide better service offerings to the airlines, then it delivers in terms
    of the business outcomes. Likewise, if the Digital Twin helps to reduce downtime
    – especially any unscheduled downtime for the aircraft – and improve the safety
    and efficiency of flights, then it delivers the business value.


    While the airline passenger is not directly making a decision about the adoption
    or use of the Digital Twin of the aircraft, their customer satisfaction will provide
    direct inputs to the business outcomes of the airlines. Likewise, if the Digital
    Twin of the aircraft, and the jet engine as part of it, helps to improve fuel
    efficiency or carbon emissions, then it improves regulatory compliance and promotes
    social good. In our over-simplified model of the aircraft value chain, we have
    not looked at several other non-aeronautical stakeholders such as the airports
    and the ground services providers. However, every stakeholder benefits from efficiency
    in the basic aeronautical value chain. If the use of a Digital Twin of an aircraft
    leads to less unscheduled disruption of flights, airport operations run smoothly.


    In order to provide the required business outcomes that were discussed in the
    preceding section, let’s summarize the key business outcomes that are expected
    from the industrial Digital Twin of a commercial aircraft:


    +   - It will help improve the current and future models of the aircraft.


    +   - It will reduce the unscheduled downtime of the aircraft – this is often
    measured as **Aircraft on Ground (AOG)**. (Please refer to `https://www.proponent.com/
    causes-costs-behind-grounded-aircraft/`.)


    +   - It will improve fuel efficiency and the carbon footprint.


    +   - It will improve safety and reliability and reduce the variability within
    operations.


    In the next section, we will take a look at an example from process manufacturing.'
  merge: -1
  img_proc: true
- pgno: 57
  md: '# # Process manufacturing


    In the *Discrete manufacturing* section, we looked at the example of commercial
    aircraft. The aviation industry is heavily dependent on fuel, which is one of
    its largest operating costs. Hence, a natural segue would be the oil and gas industry
    where process manufacturing is critical.


    Process manufacturing is often used in the oil and gas, chemical, semiconductor,
    plastics, metal, pharmaceutical, and biotechnology industries along with consumer
    packaged goods, including the food and beverage industry. Process manufacturing
    uses liquid and other forms of ingredients that are often mixed according to established
    recipes. Propane gas is an outcome of process manufacturing, although the final
    packaged product sold might be measured in discrete number of cylinders.


    The petroleum industry consists of three major segments. They include the following:


    +   1. **Upstream industry**: This is involved in the exploration, drilling, and
    production of crude oil or natural gas via oil wells.


    +   2. **Midstream industry**: This is involved in the storage and transportation
    of petroleum products.


    +   3. **Downstream industry**: This is involved in the refining and distribution
    of petroleum products so that they reach end consumers via gas stations.


    *Figure 2.3* shows these three segments of the industry:


    ![](img/f445915fceb4649a77b6797f1425850b_57_0.png)


    Figure 2.3 – The three segments of the oil and gas industry'
  merge: -1
  img_proc: true
- pgno: 58
  md: 'Now,let’s take a look at the applicability of the Digital Twins in the different
    parts of the oil and gas industry. Oil wells use a critical piece of equipment,
    called a **blowout preventer** (BOP). BOP is used to monitor, seal and control
    the oil and gas wells, to prevent a blowout. However, a BOP is manufactured via
    discrete manufacturing. In the downstream industry, the refinery is a part of
    process manufacturing. A petrochemical refinery, as shown in Figure 2.4, is an
    important part of the production of fuel for the transportation industry, including
    aircraft:


    ![](img/f445915fceb4649a77b6797f1425850b_58_0.png)


    Figure 2.4 – A petroleum refinery


    Now,let’s examine how a Digital Twin can add value to a petroleum refinery. In
    this context, a commonly used term is a digital refinery, which refers to the
    digitization of refinery operations to provide an end-to-end view of the operations.
    A few initiatives will be listed here, such as the Digital Twin of the **crude
    distillation unit** (**CDU**). In 2018, TANECO and ChemTech partnered to create
    a Digital Twin of the CDU, where the business objective was to optimize the oil
    fractionation process. This Digital Twin used the thermodynamic model of the production
    process. (Please refer to `https` : //`www` .`hydrocarbonprocessing` .`com` /`news`
    /`2018` /`06` /`taneoco-and-chemtech`-`create-digital-twin-of-refinery` .) AspenTech
    has also focused on the Digital Twin of the CDU to reduce the operational risk
    within a plant.'
  merge: -1
