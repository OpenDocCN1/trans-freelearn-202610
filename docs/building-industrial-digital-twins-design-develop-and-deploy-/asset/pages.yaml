- pgno: 241
  md: 'These scenarios regarding the utility of the Digital Twin help us position
    the wind turbine and the wind farm in the context of the energy generation grid.
    In Figure 8.1, we showed the whole electricity value chain, which sets the broader
    context. Figure 8.4 further depicts how a utility company can plan the future
    rollout of the Digital Twins of the different modes of energy generation, both
    renewable and non-renewable sources. Likewise, they can then look at the Digital
    Twins of the transmission and distribution networks. This is a perfect way to
    look at the system of systems for Digital Twins.


    The **Digital Twins Definition Language (DTDL)** ontology for the energy grid,
    as shown in Figure 8.8, would help to build out a Digital Twin application in
    a standardized manner.


    An industrial manufacturing company that operates in multiple industry sectors,
    such as energy generation, transportation, and aviation, could next look at Digital
    Twins in the transportation and aviation sector. Examples of such industrial conglomerates
    include companies such as General Electric (GE), Honeywell, and Siemens.


    Now that we have set the larger context of the Digital Twin as a system of systems,
    let’s look at the evaluation of our first Digital Twin of the wind turbine.


    # # Evaluating the first Digital Twin in the full system


    In _Chapter 7, Deployment and Value Tracking_, we discussed functional testing
    of the Digital Twin of the wind turbine. This included testing the Digital Twin
    infrastructure as well as testing the Digital Twin application. Such testing precedes
    the pilot rollout of the Digital Twin. In Figure 7.12, we showed the success criteria
    for the pilot of the Digital Twin. Furthermore, Figure 7.17 to Figure 7.19 showed
    how to capture and present the KPIs in this context. Finally, we discussed the
    two rollout approaches:


    +   • The big bang approach


    +   • The phased approach


    The big bang approach works well for mature technologies such as the rollout of
    **Enterprise Resource Planning (ERP)** software, where technology and functionality
    are very well understood by the stakeholders. The big bang approach for emerging
    technology adds more risk from technology, adoption, and economic perspectives.
    We will look at a phased approach here for the purposes of evaluating the first
    Digital Twin in the full system.'
  merge: -1
  img_proc: true
- pgno: 242
  md: 'Let’s see how a full system may look from a high-level perspective. Figure
    8.5 shows a phased approach rollout of the Digital Twin solution to a wind farm:


    ![](img/f445915fceb4649a77b6797f1425850b_242_0.png)


    Figure 8.5 – Digital Twin rollout view at a high level


    In a phased approach, the Digital Twin is rolled out to one-third of the wind
    turbines in a single farm. This way, the performance of the Digital Twin and the
    outcomes can be evaluated against the other wind turbines in the same farm. This
    provides a good baseline and, generally, the age and the model of the wind turbines
    in the same wind farm are expected to be similar. They are all subjected to the
    same environment, such as similar wind speeds and temperatures.


    Next, let’s look at why we are recommending a phased approach for the rollout
    of the Digital Twin solution.


    # Justification for the phased approach


    Let’s look at our justification for the phased approach using Figure 8.6.


    For more information, refer to the following:


    https://blogs.gartner.com/tuong-nguyen/2020/12/07/gartner- launches-emerging-technologies-radar-2021/'
  merge: -1
  img_proc: true
- pgno: 243
  md: '![](img/f445915fceb4649a77b6797f1425850b_243_0.png)


    Figure 8.6 – Impact radar for emerging technologies and trends


    According to this figure, technologies such as Digital Twin and IoT platforms
    will fully mature in about 3-6 years. On the other hand, Low-Code Application
    development is quite mature. This implies that a big bang rollout approach using
    only low-code application development has a much lower risk and is well understood.
    On the other hand, a big bang approach using IoT platforms and Digital Twin technology
    is not very well understood and carries much higher levels of risk. Hence, for
    an enterprise-wide solution involving the Digital Twin, it is advisable to use
    a phased approach. In such a plan, the solution can be tweaked along the way as
    the industry matures.


    In the next section, let’s quantify the benefits of the Digital Twin solution.


    # ## Quantification of the benefits


    To quantitatively evaluate the benefits of the phased rollout of the Digital Twin
    solution for the wind farm, we will assume this wind farm has 150 wind turbines,
    which is close to the industry average. Let’s use the average power generation
    of 1 megawatt per wind turbine and the average **Operations and Maintenance (O&M)**
    cost of about $45,000 per year. We will compare the cost for one-third, or 50
    turbines, in the **Return on Investment (RoI)** model, as the phased rollout of
    the Digital Twin is for 50 wind turbines. We show the calculations in _Table 8.1_.'
  merge: -1
  img_proc: true
- pgno: 244
  md: 'Let’s look at the justification of the benefits from the deployment of the
    Digital Twin solution. A 1-megawatt wind turbine produces about $61,300 worth
    of electricity at 35% capacity and $87,600 worth of electricity at 50% capacity.
    For more information, refer to http://anemoiservices.com/industry-news/how-much-money-does-a-wind-turbine-produce-from-electricity-it-generates/.


    We will target an uplift of about $12,000 of electricity per wind turbine per
    year, due to the Digital Twin deployment for operational efficiency. For renewable
    energy, the cost of generation does not have the variable fuel costs. Being able
    to operate the wind turbine more efficiently and reduce the downtime leads to
    an increase in energy generation. We expect another $3,000 worth of reduction
    in predictive maintenance costs per year. This will amount to a $15,000 net benefit
    per wind turbine on an annual basis.


    | Item | Baseline Cost | Twin Cost | Benefit | RoI |

    |---|---|---|---|---|

    | Current O\&M system cost | 50 x $45,000 a year | 50 x $5,000 a year | $15,000
    | 50 x $10,000 a year |

    | Overhead costs due to Digital Twin / cloud computing | 0 | $50,000 a year |
    | -$50,000 |

    | Human costs | 0 | $50K/year | | -$50K |

    | | | | Net > | $400K/year |


    Table 8.1 – Quantifying the benefits of the Digital Twin phased rollout


    We have used variable costs instead of fixed costs for our calculations. While
    the cost of constructing a 1-megawatt wind turbine may be in the range of $1.5
    million, this is a sunk cost from our perspective when we are dealing with an
    existing wind farm, often referred to as a brownfield project. Since we have proposed
    the use of cloud computing such as the Azure Digital Twins service as the main
    enabling service, along with other Azure services, it is easy to look at subscription
    models of the cost rather than at the capital costs for the purposes of this ROI
    calculation. Likewise, we have estimated the overheads, such as integration costs,
    enterprise software, and human costs, on a per wind turbine per year basis. This
    keeps the model simple and reusable for other phased rollout scenarios, say at
    25% of the wind farm or 50% of the wind farm, for Digital Twin coverage.'
  merge: -1
  img_proc: true
- pgno: 245
  md: 'Let’s further look at what kind of real-world metrics can be measured and influenced
    by

    the Digital Twin as we derive the business benefits after the rollout. A GE Renewables

    article discussed these in the context of their Haliade 150-6MW wind turbine,
    which is

    one of the most powerful offshore wind turbines. The temperature of the yaw motors

    of the wind turbine is key to improving its performance. The yaw motor controls
    the

    horizontal orientation via the wind turbine’s yaw system. To see a detailed view
    of the

    cross-section of a wind turbine, including the yaw system, visit this page: https://www.

    windpowerengineering.com/wp-content/uploads/2016/04/Haliade_

    cutaway.png.


    To maximize the generation of electricity, the yaw system keeps the rotor facing
    into the

    wind, which is important because the wind direction changes often. This is very
    important

    because, in our ROI model, we assume the Digital Twin system deployment will help
    to

    increase the energy generation and increase its efficiency from 35% to a higher
    level,

    and we can measure the economic impact of the increased energy generation.


    The monitoring of the temperature, using the Digital Twin, will allow the development

    of the application that can decide whether to allow the full power generation
    and risk a

    higher operating temperature, which reduces material life, or slightly lessen
    the power

    generation. This is done by using the yaw motor to align the turbine based on
    the direction

    of the wind. Overall, this would help to increase the power generation without
    risking

    the breakdown of the wind turbine. This helps to achieve both higher operating
    efficiency

    of the asset as well as reduced cost of the maintenance by operating the wind
    turbine in

    the safe zone. These were the two major assumptions in our ROI calculation in
    Table 8.1.

    For more information, refer to https://www.ge.com/news/reports/french-

    connection-digital-twins-paris-will-protect-wind-turbines-

    battering-north-atlantic-gales.


    In the preceding section, we looked at the business outcomes delivered by the
    Digital

    Twin of the wind turbine. We see that as the technology for the Digital Twin for
    the

    wind turbine is being proven out, there is investment from the US government such

    as the Department of Energy (DOE) in this direction. A $3.6 million research grant,

    DIGIFLOAT, was awarded to a consortium by the DOE’s Advanced Research Project

    Agency-Energy (ARPA-E) in September 2019. The goal of DIGIFLOAT is to innovate
    in

    Digital Twin technology for floating or offshore wind turbines. Floating Offshore
    Wind

    Turbines (FOWT) are wind turbines in seas and oceans as opposed to land-based
    wind

    turbines. For more information, refer to the following:

    https://www.principlepowerinc.com/en/news-press/press-

    archive/2019/09/26/principle-power-led-consortium-awarded-36-

    million-for-digifloat-an-innovative-digital-twin-project-for-

    floating-wind-applications


    In the next section, we look at the identification of related Digital Twins.'
  merge: -1
  img_proc: true
- pgno: 246
  md: '# # Identifying related Digital Twins


    In _Figure 8.1_, we looked into the energy ecosystem. The key parts of the electricity
    system are as follows:


    +   - The generation of electricity – renewable and nonrenewable sources


    +   - The transmission of electricity


    +   - The distribution of electricity


    +   - The consumption of electricity by residential and commercial consumers


    This helps us to understand the electricity value chain and to identify future
    Digital Twins after the initial Digital Twin solution for the wind turbine is
    rolled out.


    Let’s look at _Figure 8.7_, the **Digital Twins Definition Language** (DTDL) ontology
    for the energy grid. Here, the ontology helps to describe the set of concepts
    and categories in an energy value chain. Furthermore, it helps to visualize the
    properties and the relations between the major components of the energy grid.


    ![](img/f445915fceb4649a77b6797f1425850b_246_0.png)


    Figure 8.7 – Digital Twin ontology for the energy grid'
  merge: -1
  img_proc: true
- pgno: 247
  md: "![](img/f445915fceb4649a77b6797f1425850b_247_0.png)\n\nOur focus in this book\
    \ has been on the Digital Twin of the wind turbine, which belongs  \nto the generation\
    \ part of the energy ecosystem. As a result, the related Digital Twins in the\
    \  \nrenewable sources of power generation will be as follows:\n\n+   - Digital\
    \ Twins of Offshore Wind Farms\n+   - Digital Twin of Solar Plants\n+   - Digital\
    \ Twin of Hydro Power Plant\n\nConsidering the increased focus on renewable sources\
    \ of energy, we recommend  \nexploring these Digital Twins further. Let's look\
    \ from the perspective of a utility company.  \nTo maximize the energy generation\
    \ and to meet peak demands, it will have to optimize  \nthe generation reliably\
    \ from all its generation assets. We assume the utility company uses  \nrenewable\
    \ and nonrenewable sources of energy. We will focus on renewable sources of  \n\
    energy here. Let's assume the utility company has wind, solar, and hydro power\
    \ plants.  \nThis is not an unrealistic scenario. One of the largest utility companies\
    \ in the US, Exelon,  \nhas a \"balanced portfolio of natural gas, hydro, wind,\
    \ and solar\" power generation.  \nFor more information, refer to https://www.exeloncorp.com/companies/\
    \  \nexelon-generation.\n\nIn the summer of 2020, northern California faced a\
    \ power shortage during hot days. One  \nof the reasons was that some of the power\
    \ plants were operating below capacity. For more  \ninformation, refer to https://www.nytimes.com/2020/08/20/business/\
    \  \nenergy-environment/california-blackout-electric-grid.html.\n\nDeploying Digital\
    \ Twins for these power plants, such as wind, solar and hydro, can ensure  \n\
    that these assets are maintained properly and are capable of delivering the energy\
    \ at their  \npeak level on days of higher demand, such as hot summer days, where\
    \ a large part of  \nnorthern California has a temperature of over 100°F/38°C.\
    \ In some places, it can exceed  \n110°F/43°C. The ability to improve the efficiency\
    \ of the existing power generation assets  \nwill be a productive use of the Digital\
    \ Twin solution.\n\nIn the prior section, we identified the Digital Twins related\
    \ to the first Digital Twin of the  \nwind turbine. Together, these Digital Twins\
    \ will be transformative to a utility company in  \nimproving the productivity\
    \ of their generation assets, as well as reducing their operation  \ncosts by\
    \ improving the efficiency of predictive maintenance.\n\nNext, let's look at planning\
    \ for composite twins."
