    Figure 4.1 – Project planning framework for a predictive maintenance Digital Twin


    We distinguish between the **line of business (LoB)** and **information technology**

    (IT) roles during these phases while focusing on a key aspect of the Digital Twin’s

    development. The LoB function focuses on the business challenge and engineering

    analytics to address it. It is also concerned with the operational business process
    that

    needs to adapt to support the Digital Twin technology. The IT function focuses
    on the

    digital enabling technology that’s used to create and operate the Digital Twin
    throughout

    its life cycle.


    # ## Phase 0 – the pre-project phase


    The pre-project phase, as shown in the preceding table, refers to the preparation
    work

    that needs to be done, though this is not necessarily part of a Digital Twin project.

    Reliability engineers, operations managers, and other LoB users often conduct
    business

    performance analyses to determine areas to focus on for future efficiency and
    effectiveness

    improvements. A bad actor analysis using lean first principles is a typical approach
    that’s

    used by reliability engineers, as shown in this predictive maintenance example.
    Bad

    actor analysis is the formal review process of a plant or factory’s operating
    assets. It uses

    the **Pareto principle** where, in the case of equipment failures, 20% of the
    equipment is

    typically responsible for 80% of failures. The Pareto principle is often referred
    to as the

    **80/20 rule** and is used in many industries and applications. The objective
    of bad actor

    analysis is to find the 20% of the equipment that causes the most downtime or
    loss of

    production and rank them. One ranking mechanism that’s used in bad actor analysis
    is to

    apply the same Pareto principle to the 20%. It finds the 20% that is responsible
    for 80% of

    the original 80% of failures. This means that we now have 4% of the original assessment,

    which is responsible for 64% percent of failures or downtime.'
  merge: -1
  img_proc: true
- pgno: 108
  md: 'The LoB function analyzes the overall production value chain and identifies
    potential system bottlenecks and specific assets or systems, which are referred
    to as _bad actors_. As mentioned previously, these bad actors often produce the
    majority of equipment failure incidents. It is a common practice to rank the bad
    actors in terms of key performance metrics such as throughput or production losses,
    downtime hours, repair cost, and safety. For a manufacturing line, the main bad
    actor may be the conveyor system, the second- ranking bad actor may be the robotic
    assembly arm, and the third may be the wrapping station at the end of the line.


    The next step, as shown in the following diagram, is to determine the main failure
    modes of these top-ranking bad actors. **Formal Failure Mode Effect and Criticality
    Analysis (FMECA)** is a well-established practice in reliability engineering.
    For our first Digital Twin, however, we do not require a full-scale FMECA. It
    is still essential to identify key failure modes based on historical maintenance
    and operational data, as this ensures that the prototype Digital Twin will demonstrate
    value during a short duration project validation phase:


    ![](img/f445915fceb4649a77b6797f1425850b_108_0.png)


    Figure 4.2 – Project planning framework for the predictive maintenance Digital
    Twin


    Once we understand the primary failure modes, we can identify the root causes
    of these failure modes. This is also a well-established practice in reliability
    engineering. Still, we will simply identify the leading root causes for the most
    predominant failure modes for this book. Due to the cause-and-effect relationship
    that we often see with physical equipment, some root causes may result in multiple
    failure modes.'
  merge: -1
  img_proc: true
- pgno: 109
  md: 'The following diagram shows that **Root Cause 2** can create **Failure mode
    1** and **Failure Mode 3**. The business impact and nature of the bad actor failure
    modes will determine the level of analysis, but for this example, we will assume
    that the LoB function will provide the necessary input for this:


    ![](img/f445915fceb4649a77b6797f1425850b_109_0.png)


    Figure 4.3 – Relationship of root causes and failure modes


    The objective of understanding the root causes is to determine if we can identify
    any leading indicators that could be supported in a Digital Twin, through real-time
    data and analytics from IoT and sensor devices. These leading indicators can be
    based on raw sensor data, physics models, and mathematical or statistical models,
    as described in _Chapter 1, Introduction to Digital Twin_.


    These real-time indicators can be established from the **Internet of Things (IoT)**,
    **Operational Technology (OT)**, and enterprise business systems such as **Enterprise
    Asset Management (EAM)**, **Enterprise Resource Planning (ERP)**, and **Manufacturing
    Execution System (MES)** solutions.


    This integration requirement to multiple different systems introduces the role
    of the IT and development responsibilities given in _Figure 4.1_. This is the
    ideal opportunity to establish a high-level reference architecture that can be
    used for the first Digital Twin, and then adapted in the future based on the outcomes
    and learning from this initial project.'
  merge: -1
  img_proc: true
- pgno: 110
  md: 'It is also recommended to start the governance processes around security and

    trustworthiness at these early stages and install the discipline for future projects.
    Digital

    Twins introduce several new security vulnerabilities and potential attack surfaces.
    The

    IT function can use the initial Digital Twin project to assess the impact and
    identify risk

    mitigation strategies.


    # Phase 1 – the project scoping phase


    During the project scoping phase, the business and operations team identify and
    confirm

    that the lead indicators for the high-priority bad actor assets have associated
    data sources.

    It is still important to start with the failure modes and root causes and not
    with the

    available data sources. Your first Digital Twin solution should focus on delivering
    value

    quickly and, as such, be problem-oriented.


    Business and operations teams should complete a business readiness assessment,
    as

    outlined in Figure 1.10 of Chapter 1, Introduction to Digital Twin. Prioritize
    use cases

    based on technical readiness and business impact to identify the first Digital
    Twin. The

    business impact measures also relate to the value at stake metrics, which we identified

    in Figure 1.9 of Chapter 1, Introduction to Digital Twin. The potential business
    impact

    measures from the assessment we provided in Figure 1.10 of Chapter 1, Introduction

    to Digital Twin, include safety, downtime, throughput, quality, and cost. The
    technical

    readiness assessment covers the availability of data, the maturity of automation
    and IT

    systems, analytics, the proposed deployment environment, and the project management

    maturity level.


    This phase also includes defining the value at stake and the key success criteria
    for the first

    Digital Twin. It answers the question, what does success look like for the first
    Digital Twin?


    For IT teams, this phase provides the opportunity to assess the data availability
    and data

    quality for the lead indicators that the business team identified. Data integration,
    access,

    cleanup, and data wrangling can consume more than 50% of project resources and
    costs

    for IoT-based projects, based on research by leading analyst firms. The project
    scoping

    phase provides the IT team with the opportunity to assess the impact data integration

    has on the key success metrics of the Digital Twin project.


    This is also the phase where we prepare the Digital Twin platform and configure
    the

    required data integration connectors within the necessary governance guardrails.

    Preparing this in advance reduces the risk of creating a Digital Twin that is
    dependent

    on data access and may not be available for integration due to technical reasons.'
  merge: -1
  img_proc: true
- pgno: 111
  md: 'During this phase, a final key point is to ensure that business users and IT
    are aligned on

    the **Critical Success Factors (CSFs)** for the first Digital Twin project. A
    common and

    shared vision around the specific measurable outcomes or CSFs for the first Digital
    Twin

    will ensure a results-based focus for the project.


    The next phase focuses on developing and delivering the Digital Twin while preparing

    the organization to adapt to operational business processes and the way people
    work.


    # ## Phase 2 – the project design and development phase


    Digitally enabled projects typically require a change in how people go about routine
    tasks.

    Digital Twins, as well as the operational, situational awareness, and decision
    support that

    they provide, change the business processes that people traditionally follow.
    We will cover

    this topic in more depth later in this chapter.


    To ensure that the first Digital Twin is a success, it is essential to identify
    the team among

    business users that''s willing to embrace technology-based solutions to address
    business

    challenges. Operational users in industrial organizations are typically more conservative

    and skeptical of new or emerging technologies. This is also the phase during the
    project

    where a decision is made on what kind of Digital Twin will be built and how it
    will

    integrate with design, manufacturing, maintenance, and operational models. Furthermore,

    the design and development phase provides the engineering team with the opportunity
    to

    add additional sensors and data collection points for testing and certification.
    Substantial

    planning is involved in the placement and data collection plans for sensor data.
    Business

    users bring about the required engineering knowledge and expertise to help plan
    how to

    sustain the business value of twins. Selecting the right team will improve your
    chances

    of a successful first Digital Twin project.


    The IT team will develop or configure the Digital Twin during the design and

    development phase. This includes integrating real-time input and other metadata
    and

    integration to backend business systems. We recommend an agile development approach,

    as described in _Chapter 3, Identifying the First Digital Twin_, using all the
    artifacts and

    processes shown in Figure 3.8.


    The verification steps during the design and development phase provide the necessary

    governance to ensure the Digital Twin is designed and engineered correctly.


    We also recommend that the Digital Twin is configured so that it can automatically

    track use case results continuously. The initial Digital Twin project is typically
    used to

    demonstrate the value based on the CSFs. Automating the reporting on these assists

    with value tracking during the project validation phase.'
  merge: -1
  img_proc: true
- pgno: 112
  md: '# Phase 3 – the project validation phase


    The project validation phase focuses on measuring the key success criteria set
    out during

    the project scope and validating the result of using the Digital Twin. The business
    team

    users need to ensure that the business process changes, as described in phase
    2, are

    implemented during the validation phase.


    During the business validation process, both the business and IT teams can use
    continuous

    CSF monitoring results to improve and fine-tune the Digital Twin''s capabilities.
    This phase

    will also allow you to understand the support requirements and other business
    capabilities

    required to maintain and scale out Digital Twins in the organization.


    This phase''s outcome is to decide if the Digital Twin has delivered on the initial
    CSFs and

    if it is to be continued in production, or if it is the end of the initial assessment.
    If we have

    followed the preceding steps, the likelihood of success is exceptionally high,
    and this will

    often lead to scaling out the Digital Twin in full-scale production applications.


    # Phase 4 – the project scaling phase


    New requirements and opportunities often emerge during the project validation
    phase

    as business users see the benefit of the improved decision support capability.
    Scaling out

    could mean providing access to additional users or adding other capabilities and
    features

    to address these additional requirements.


    The project planning framework used in this example is specific to a predictive
    maintenance

    case. Still, the principle applies to any Digital Twin product, and we recommend
    that you

    outline the planning framework for your project in a similar way. The single-page
    summary

    improves internal communication and provides a clear understanding of the expectations

    of the different phases.


    The project planning framework is supported by a solution framework that explains
    the

    business value and scope to business executives who sponsor the Digital Twin project.


    # Solution planning framework


    The proposed solution planning framework has its roots in the **Lean Startup**
    approach,

    which was introduced by **Steve Blank** and popularized by **Eric Ries** (`https://hbr.

    org/2013/05/why-the-lean-start-up-changes-everything`). The Lean

    Digital Twin is a methodology developed by **XMPro** (`https://bit.ly/idt-ldt`)

    and is based on the Lean Startup framework, which focuses on achieving the product/

    market fit of a new product before scaling out.'
  merge: -1
  img_proc: true
- pgno: 113
  md: 'The **Lean Digital Twin** is an ideal approach when developing your first Digital
    Twin since the application and use of Digital Twins in organizations is not well
    defined or understood yet:


    Figure 4.4 – Moving from the Problem/Solution to the Digital Twin/Business Fit


    The first part of the lean Digital Twin approach focuses on the Problem/Solution
    Fit, and the best way to describe this in a simple and easy-to-understand way
    is by using the **Lean Digital Twin Canvas**.


    This is based on the lean canvas that’s used in the Lean Startup approach, which
    describes the business problem, solution integration points, and the business
    case on a single page that is easy to communicate to a project team and executive
    sponsors:


    Figure 4.5 – The lean Digital Twin canvas for the slurry pump predictive maintenance
    Digital Twin


    ![](img/f445915fceb4649a77b6797f1425850b_113_0.png)


    ![](img/f445915fceb4649a77b6797f1425850b_113_1.png)'
