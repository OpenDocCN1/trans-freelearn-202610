  img_proc: true
- pgno: 139
  md: 'Alibaba and Tencent are primarily popular in China, hence, we will not discuss
    these two platforms here. We will look at the capabilities of commonly available
    options in the industry today, in the context of a Digital Twin.


    # Microsoft Azure Digital Twins


    Microsoft **Azure Digital Twins** (**ADT**) is part of Azure IoT, an IoT-based
    Digital Twin platform, as described in _Chapter 4, Getting Started with Our First
    Digital Twin_. Azure IoT consists of a number of platform services that can be
    accessed on the edge and in the cloud. Some of these services used to provide
    the IoT platform include the following ones:


    +   - **Azure IoT Hub**—This is a cloud-hosted, secure bidirectional communications
    service between IoT devices and an application backend.


    +   - **Azure IoT Central**—This is a **user interface (UI)** application to manage
    devices on Azure IoT Hub.


    +   - **Azure IoT Edge**—This runs IoT edge devices through the containerization
    of Azure services.


    +   - **Azure RTOS**—This is an operating system for resource-constrained IoT
    devices and includes an embedded development suite.


    +   - **Azure Time Series Insights (TSI)**—Use this to store, visualize, and query
    large datasets of temporal or time series data.


    +   - **ADT**—This is a **platform-as-a-service (PaaS)** capability to create
    graph-based relationships for entities that describe a model for the entities
    or things, and their relationships to other entities.


    These services are combined in different configurations, based on business and
    technical requirements, to provide the Azure IoT platform. IoT and Digital Twin
    applications are developed on the ADT platform through Microsoft developer tools
    such as Visual Studio and **Visual Studio Code (VS Code)**.


    The knowledge graph in ADT stores entity, relationship, and state information
    in a single model. _Figure 5.4_ shows a high-level perspective of an Azure IoT
    platform and its services, and where ADT fits in the architecture.


    ADT uses **Digital Twin Definition Language (DTDL)**, which we covered in _Chapter
    4, Getting Started with Our First Digital Twin_. DTDL is an open source modeling
    language, aimed at improving interoperability and reuse of ADT models in different
    applications and use cases.'
  merge: -1
  img_proc: true
- pgno: 140
  md: 'You can see an overview of the architecture here:


    ![](img/f445915fceb4649a77b6797f1425850b_140_0.png)


    Figure 5.4 – Microsoft ADT in an Azure IoT platform


    Microsoft has a broad industry focus with Azure IoT and ADT. This includes verticals
    such as infrastructure, manufacturing, energy and utilities, oil and gas, and
    mining at the time of writing this book.


    We''ll next look at the capabilities of AWS.


    # ## AWS IoT platforms


    Let’s look at the AWS capabilities. AWS started its public cloud offerings as
    early as 2006. Today, it has a very large share of the market for **infrastructure-as-a-service
    (IaaS)** and PaaS. In late 2015, Amazon announced its AWS IoT offering, starting
    with AWS IoT Core or Cloud Services for Connected Devices. Other AWS services,
    such as Amazon **Simple Storage Service (S3)**, Amazon Kinesis, and so on, could
    be used along with IoT Core to build IoT applications. AWS IoT platforms provide
    support for commonly used IoT protocols such as **Message Queuing and Telemetry
    Transport (MQTT)**, **HyperText Transfer Protocol Secure (HTTPS)**, and **low-power
    long-range wide-area network (LoRaWAN)**. Enterprises that were already using
    AWS for IaaS and PaaS and had their enterprise data and applications on AWS started
    looking at AWS IoT platforms for applications that needed device connectivity
    and sensor data.'
  merge: -1
  img_proc: true
- pgno: 141
  md: 'For enterprises that are standardized on a certain cloud platform, it is often
    the starting

    point for new cloud capabilities such as IoT and Digital Twins in this case. In
    some cases,

    the CIO prefers to have a smaller number of moving parts in the IT and cloud landscape.

    Often, the process of security and compliance approval for a public cloud provider
    is a

    long one, and enterprises try to reduce the number of public cloud platforms in
    use unless

    they are open to best-of-breed solutions or have multi-cloud as part of their
    business

    continuity strategy. Often, the movement in and out of a public cloud platform
    incurs

    data charges and introduces latency between applications.


    Amazon’s offering for IoT is limited to its IoT platform. Amazon has not built
    any IoT

    applications on top of the platform that can be offered as software-as-a-service
    (SaaS).

    SaaS offerings or IoT applications are easier to consume by business users, whereas
    the

    platform capabilities typically require software professionals and application
    developers to

    consume the services via usable IoT applications. Amazon Sumerian provides capabilities

    around three-dimensional (3D) modeling, augmented reality (AR), and virtual reality

    (VR), which can be used along with the IoT platform to build applications along
    the lines

    of a Digital Twin. One such example would be a twin of a manufacturing plant with
    a 3D

    view of the equipment and floor plan, for providing training to employees.


    Amazon provides a Device Shadow service (see https://docs.aws.amazon.com/

    iot/latest/developerguide/iot-device-shadows.html). This service

    allows you to create a shadow of a physical device and, for instance, provide
    the state

    of the physical device to the applications. However, a shadow is not a dynamic
    Digital

    Twin of a physical asset. A device shadow can be stored in a JavaScript Object
    Notation

    (JSON) file. The information in such a JSON file would be the device metadata,
    state or

    version, and any security tokens associated with the device. The applications
    can interact

    with the device shadow using REpresentational State Transfer (REST) application

    programming interfaces (APIs), namely for GET, UPDATE, or DELETE requests or via

    MQTT messages.


    To the best of our knowledge, at the time of writing this book in early 2021,
    there are no

    complete Digital Twin services in the AWS platform. However, there are independent

    software vendors (ISVs) who make such capabilities available on top of AWS. One

    such example is the Hexagon Digital Reality (HxDR) platform (see https://aws.

    amazon.com/blogs/industries/hxdr-transforming-geospatial-data-

    in-the-cloud-with-aws-and-hexagon-leica-geosystems/).'
  merge: -1
  img_proc: true
- pgno: 142
  md: 'HxDR provides Digital Twin capabilities for building structures on top of AWS.
    Some of

    the characteristics of such a Digital Twin solution are outlined here:


    +   - High computational complexity to mix spatial data from physical structures
    to

    +   create a Digital Twin. The ability to grow the computational capacity elastically
    as

    +   the scale and precision of the model grows makes the public cloud suitable
    for it.


    +   - A high-fidelity Digital Twin requires a lot of data about its physical structures.

    +   Storing and making this data available is demanding due to the amount of data.

    +   Growth in storage can be on-demand or on the public cloud. HxDR uses AWS S3

    +   for such elastic storage.


    +   - The data may be collected globally, depending upon the problem domain of
    the

    +   Digital Twin. Usually, a public cloud platform has points of presence in multiple

    +   locations as well as edge locations.


    +   - The security and sensitivity of the data collected for Digital Twins may
    require

    +   additional security services from the underlying cloud platform.


    Vertex is another provider of capabilities for Digital Twins, on top of the AWS
    platform

    (see `https://aws.amazon.com/iot/solutions/VertexDigitalTwin/`). Bosch

    IoT Things on AWS can connect to devices using MQTT and **Advanced Message Queuing**

    **Protocol (AMQP)** and help to manage Digital Twins (see `https://aws.amazon.com/`

    `marketplace/pp/BoschIO-GmbH-Bosch-IoT-Things/B07DTJK8MV`).


    In summary, we see that a public cloud provider such as AWS can be used to build

    Digital Twin capabilities from the ground up using a combination of IoT Core and
    other

    services or specialized offerings from ISVs’ partners, which can be leveraged
    to get started.

    However, Amazon lacks a complete Digital Twin solution of its own.


    Let’s next explore the capabilities provided by Oracle in this space.


    # # Oracle IoT applications


    Let’s now look at Oracle’s capabilities. Oracle is known for **enterprise resource
    planning**

    (ERP) and technology solutions that are used by several mid-to-large-sized enterprises

    globally. When a company is looking for IoT and Digital Twin solutions, the current

    provider of the ERP and manufacturing applications may influence that decision.
    Oracle

    and SAP are the two main global providers of business applications such as ERP,
    **customer**

    **relationship management (CRM)**, or **human capital management (HCM)**. Other

    providers in this space are `Salesforce.com`, Workday, Infor, and so on. Some
    large and

    global companies may have a combination of Oracle, SAP, and `Salesforce.com`,
    either

    in different lines of business or due to merger and acquisition activities. Oracle’s
    business

    applications are available via the cloud as SaaS offerings since 2012. Oracle
    launched its

    public cloud platform later, and its current offering is called OCI.'
  merge: -1
  img_proc: true
- pgno: 143
  md: 'Oracle started offering an IoT platform on top of its public cloud a few years
    ago and further enriched it with IoT applications, which are SaaS offerings (see
    https://www.oracle.com/internet-of-things/). Oracle’s IoT Intelligent offerings
    include the following:


    +   - **Smart Manufacturing/Production Monitoring** —Work in progressing monitoring,
    maximizing product quality, and preventing unplanned downtime

    +   - **Predictive Maintenance/Asset Monitoring**—Connected assets and connected
    products

    +   - **Connected Logistics/Fleet and Shipment Monitoring**—Monitoring shipment
    and warehouse automation

    +   - **Connected Worker**—Worker safety monitoring


    Next, let’s look at the Digital Twin-related capabilities provided by Oracle.
    The focus of the Digital Twins is for industrial assets here. The functionality
    provided by Oracle caters to three different scenarios, outlined as follows:


    +   - **Virtual twin**: This twin is the software equivalent of a physical asset
    to help simulate the asset for capabilities such as testing and virtual provisioning
    before connecting physical devices.

    +   - **Predictive twin**: This twin is used to capture the expected behavior
    of the physical asset and is useful to predict its future state, including the
    remaining useful life of a machine or its impact on the environment.

    +   - **Twin projections**: This twin is useful for scenario analysis and planning
    in industrial settings such as smart factories, logistics, **supply chain management**
    (SCM), warehousing, maintenance and repair, and delivery-of-field services in
    asset-intensive industries.


    For more details on Oracle Digital Twin implementation, see https://docs.oracle.com/en/cloud/paas/iot-cloud/iotgs/oracle-iot-digital-twin-implementation.html.


    Oracle provides an IoT digital-twin simulator that allows the simulation of data,
    alerts, and events from physical assets without connecting to them. Apart from
    IoT and digital-twin capabilities, Oracle also provides blockchain applications
    for Intelligent Track and Trace or Intelligent Cold Chain solutions. Such capabilities
    are very useful in COVID-19-related vaccine distribution to the point of consumption.
    Oracle allows the creation of a digital thread that can be used to track a product
    from its design idea all the way to the production use of the asset over its lifetime.'
  merge: -1
  img_proc: true
- pgno: 144
  md: 'Oracle IoT digital-twin implementation may be suitable for a company using
    Oracle Cloud ERP applications or OCI for other purposes. In this case, the data
    and applications will stay on the Oracle cloud. Companies who are running their
    business applications on other cloud platforms may evaluate the Oracle IoT applications
    and digital-twin capabilities for their functional requirements.


    After looking at offerings from Microsoft Azure, Amazon AWS, and Oracle Cloud,
    we''ll next move to more specialized offerings such as **PTC (formerly Parametric
    Technology Corporation)**.


    # ## PTC ThingWorx


    PTC ThingWorx is an IoT-based digital-twin platform, as described in _Chapter
    4_, _Getting Started with Our First Digital Twin_. ThingWorx is part of the PTC
    engineering solutions suite of products that includes Vuforia for AR, Windchill
