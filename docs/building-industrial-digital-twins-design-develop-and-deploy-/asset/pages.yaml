    # ## Test cases


    Test cases are the scenarios that are used to validate that Sprints are producing
    work on the stories and epics in a manner that will meet the stakeholder requirements.
    These test cases can be used by the **Quality Assurance (QA)** team of the users
    to check and accept the work along the way. The set of conditions or variables
    used to determine whether a system under test satisfies requirements is created
    manually from specifications, which are later used to create tests used by the
    QA team. In the WDC scenario, the test cases will help the stakeholders to validate
    the progress toward the ARV pilot using the Digital Twin over the Sprints.'
