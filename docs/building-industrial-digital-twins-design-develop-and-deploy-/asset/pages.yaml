- pgno: 213
  md: 'The following screenshot shows the evolution from concepts to full deployment
    and how the scope evolves along the journey:


    ![](img/f445915fceb4649a77b6797f1425850b_213_0.png)


    Figure 7.10 – Evolution from concept to full deployment


    During the initial **proof-of-concept (POC)** phase, the objective is to demonstrate
    the viability of specific technological or design components. This phase verifies
    the suitability of using these concepts in developing a production system and
    serves as a decision point or gate to determine if a specific solution can move
    to the prototyping phase. In the case of our wind turbine example, we may use
    a POC to determine if the data that we receive from our sensors is sufficient
    to create a **machine learning (ML)** model for predictive maintenance.


    _Chapter 6, Building the Digital Twin Prototype_, focused on configuring the Digital
    Twin prototype of a wind farm that supports several wind turbines. The prototype
    is a complete model of the overall solution, using simulation data to demonstrate
    critical capabilities. It brings together several POC elements into the configuration
    of the Digital Twin.


    Once we have successfully created and tested the prototype, we can move to a pilot
    implementation of a Digital Twin application. The scope of a pilot rollout will
    be determined by the availability of a pilot environment such as a wind farm,
    a factory, or a physical asset to create a Digital Twin application.'
  merge: -1
  img_proc: true
- pgno: 214
  md: '# # Scope of a pilot implementation


    In a large-scale wind-farm environment, we may use one wind farm as a pilot, or
    in other instances, it might be limited to a single turbine. The initial problem
    statement will also drive the requirements for the pilot implementation. If we
    assess the predicted failure on a single turbine, we need a single instance of
    a wind turbine for the pilot. If we optimize the power generation from a collection
    of turbines on a wind farm, we need access to a wind farm for the pilot rollout.


    Another factor that will determine the scope of the pilot is the perspective that
    we have for the Digital Twin. In Chapter 3, Identifying the First Digital Twin,
    we described the different perspectives that Digital Twin users have and how their
    respective use cases will differ. The perspective that we chose for the prototype
    implementation of our first Digital Twin is that of an original equipment manufacturer
    (OEM), which also provides maintenance services.


    Getting an agreement on the scope of a pilot is a crucial aspect in terms of delivering
    a successful outcome. The agreement should be with both internal and external
    stakeholders, and should cover the following scope dimensions:


    +   • **Geographic**—In which specific geographical area will the pilot be conducted?


    +   • **Organizational**—Which departments or functions of the business will be
    involved in the pilot?


    +   • **Solution**—The solution scope should match the solution requirement documented
    in the Lean Digital Twin canvas in Chapter 4, Getting Started with Our First Digital
    Twin.


    +   • **Integration**—Which systems do we need to integrate with?


    +   • **Information technology (IT)**—What IT and infrastructure are required
    for our Digital Twin pilot deployment, such as a public cloud service and other
    licensed software?


    +   • **Training and documentation**—What training and documentation do we provide
    for the pilot phase?


    +   • **Change leadership**—What responsibility do we have for change management?'
  merge: -1
  img_proc: true
