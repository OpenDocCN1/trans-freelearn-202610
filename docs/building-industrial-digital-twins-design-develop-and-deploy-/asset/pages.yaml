    # # Exploring digital platforms for Digital Twins


    Digital Twins require a digital environment to help build and deploy their applications.
    Digital platforms for Digital Twins often consist of several components that are
    orchestrated together to provide a Digital Twin-enabling technology stack.


    These digital components include the following:


    +   • IoT platforms


    +   • Business Process Management platforms'
  merge: -1
  img_proc: true
- pgno: 127
  md: '+   • Analytics and data platforms

    +   • Application platforms


    Let’s see how these digital components can be used to create a digital environment
    for building and deploying these applications.


    # # IoT platforms


    IoT platforms typically consist of several capabilities that connect IoT devices
    to analytics and business applications. Traditional **Operational Technology (OT)**
    platforms connect to proprietary devices and control systems. In contrast, IoT
    platforms connect to a broad range of IoT devices through open protocols and make
    the information available to operational and business applications.


    IoT platforms support the development of Digital Twins by doing the following:


    +   • Monitoring IoT endpoints and real-time data streams

    +   • Supporting both proprietary and open industry connectivity protocols for
    connectivity and data transfer

    +   • Enabling physics- and math-based analytics on the IoT data

    +   • Providing edge, distributed, and cloud compute options

    +   • Providing integration through APIs for application development

    +   • Contextualizing IoT data with information from business and operational
    systems


    Some of the key capabilities of advanced IoT platforms include the following:


    +   • Device management

    +   • Data integration

    +   • Data storage and management

    +   • Analytics

    +   • Application development support

    +   • Security and privacy


    Combining these capabilities provides the ideal technology foundation for a Digital
    Twin development project. The objective of a Digital Twin, however, is not just
    around the real-time sensor or IoT information, but rather around the business
    outcomes that the Digital Twin drives.'
  merge: -1
  img_proc: true
