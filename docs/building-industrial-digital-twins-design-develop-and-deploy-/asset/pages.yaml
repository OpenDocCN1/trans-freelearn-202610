- pgno: 166
  md: '# # Summary


    In this chapter, we considered the perspective of a global industrial manufacturer
    of wind turbines. We then described considerations for evaluating and selecting
    the right platform for setting up and building a Digital Twin. We narrowed it
    down to Microsoft ADT as the selected platform for the purposes of this book.
    This got us started to set up the configurations on ADT for our first Digital
    Twin.


    In Chapter 6, Building the Digital Twin Prototype, we will start implementing
    the digital-twin prototype in our selected digital-twin platform for wind turbines
    using ADT. We will further consider practical constraints during the implementation
    process of the Digital Twin.


    # # Questions


    +   1. What is the importance of a predictive twin? How can it be applied to wind
    turbines?


    +   2. Why do many IoT platforms use the public cloud?


    +   3. What are the primary business outcomes expected from a digital-twin solution
    for wind turbines?


    +   4. What is the use of a time series data store?


    +   5. How do analytic orchestrations handle missing data elements from certain
    assets such as a wind turbine?


    > > **Note**

    > > Image source: `https://schwabencode.com/blog/2020/03/10/ Device-Twins-vs-Digital-Twins-Azure-IoT`


    In the next few chapters, we will continue to refine the solution architecture
    to our specific scenario. Such solution architectures are key to maintain and
    evolve a full digital-twin solution over its lifetime as it is handed over to
