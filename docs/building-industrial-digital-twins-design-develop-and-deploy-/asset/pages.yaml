- pgno: 147
  md: 'In the previous section, we looked at the capabilities of different cloud-based
    solutions

    for IoT and Digital Twins. Such comparative study helps us in the decision process
    of an

    enterprise going through its digital-twin journey. In the context of this book,
    we will use

    Microsoft ADT for details of the process. This decision is based on a couple of
    factors,

    outlined as follows:


    +   - ADT was made publicly available by Microsoft Azure in November 2020, thus

    +   making it easy for making use of it for development, testing, or production

    +   deployment.


    +   - In our context of the global conglomerate that is building the wind turbine’s
    Digital

    +   Twin, the CIO has already selected Microsoft Azure for its enterprise applications.


    +   - The company decided to explore all available options for Digital Twins on
    Azure first.


    +   - The company also plans to offer the wind turbine’s digital-twin capabilities
    to its

    +   customers, such as the owners and operators of wind farms. Based on its market

    +   survey, the energy sector did not have any preferred public cloud platform.


    In the next section, we will look at the use of Microsoft ADT for building the
    wind

    turbine’s Digital Twin.


    # # Configuration and setup


    Before we can configure our first Digital Twin in Microsoft ADT, we must set up
    the

    cloud infrastructure and account on Microsoft Azure. Microsoft provides detailed

    setup instructions for Azure administrators, but we will start from the perspective
    of

    a non-corporate user that wants to set up a free account to build a first digital-twin

    prototype. The ADT documentation is at `http://bit.ly/1dt-azuredocs`.'
  merge: -1
  img_proc: true
- pgno: 148
  md: 'The first step is to create a free Azure account that will host your ADT service
    and any other IoT and analytics services that you will need for your first Digital
    Twin. See the following screenshot for an overview of how to do this:


    ![](img/f445915fceb4649a77b6797f1425850b_148_0.png)


    ![](img/f445915fceb4649a77b6797f1425850b_148_1.png)


    Figure 5.7 – Microsoft Azure portal UI


    Once you’ve created an account, you will be directed to the Azure service portal.
    This is the central management environment for all Azure services, including ADT,
    Azure databases, IoT services, and all the other products that Microsoft provides
    in its Azure product range.


    ADT is a PaaS solution that provides the infrastructure to create and use Digital
    Twins. It is a development environment for Digital Twins that is focused on developers
    to code Digital Twins. It is not an end user-focused application with a UI for
    business users to configure Digital Twins. It will require other Azure services
    in your Azure account to perform these actions.'
  merge: -1
  img_proc: true
- pgno: 149
  md: 'ADT can be configured through the web-based Azure Portal or in a command

    line through the **Azure command-line interface (Azure CLI)**. Both approaches

    are documented in the official Microsoft documentation at `http://bit.ly/`

    `idt-azuredocs`. We will describe the portal configuration approach at a high

    level for the purpose of the book.


    The configuration and setup of ADT and the supporting app service to code against
    is

    done in five main steps, as illustrated in the following diagram:


    ![](img/f445915fceb4649a77b6797f1425850b_149_0.png)


