- pgno: 169
  md: '# # Technical requirements


    In this chapter, we will configure your first Digital Twin prototype. There are
    sample JSON-based DTDL files for the wind farm example that we use. You can find
    the code files for this chapter on GitHub at `https://github.com/PacktPublishing/
    Building-Industrial-Digital-Twin`.


    # # Development process of our Digital Twin


    Let''s explore the development process of the Digital Twin. This will ensure that
    we have the skills to undertake such development.


    # # Wind turbine as our Digital Twin prototype


    We will use a wind farm as the example of our first Digital Twin prototype. We
    will focus on a simple model of a wind farm here. Our primary goal is to show
    how to create the first Digital Twin of the wind turbine in the book, rather than
    help build expertise on wind turbines or the renewables industry. We will create
    Digital Twin models and instances for each physical turbine in the wind farm.
    The Digital Twin models represent the basic elements of a wind turbine, and it
    is sufficient to address different use cases from a business value point of view.


    The perspective for the wind farm and wind turbine Digital Twin is that of a wind
    turbine manufacturer who is also contracted by the operator to maintain the wind
    turbines to agreed service levels. Our use case for the Digital Twin in this chapter
    is limited to the maintenance and operations phases of the wind turbines, as described
    in _Chapter 1_, _Introduction to Digital Twin_. In practice, the models will cover
    the overall life cycle, which includes the design, manufacturing, and commissioning
    phases of the wind farm and the wind turbines.


    The primary use case for the wind turbine Digital Twin in this chapter is a manufacturer
    that performs predictive maintenance services on its wind turbines while they
    are with the owner/operator of the asset. The manufacturers have a field service
    crew that proactively needs to go to the right wind turbine at the right wind
    farm and perform the right maintenance to prevent the wind turbine from failing,
    leading to unscheduled downtime or operating at a reduced level of efficiency.'
  merge: -1
  img_proc: true
- pgno: 170
  md: 'The manufacturer wants to ensure a high first-time fix rate, reduce the number
    of truck rolls, and limit the field spares that are carried on the service vehicles.
    In this context, "truck roll" refers to the scenarios where a field service technician
    for the wind turbine has to be dispatched in their service vehicle, which is often
    a truck, to a wind farm to carry out services such as installation, reconfiguration,
    troubleshooting, repairs, or any other form of scheduled maintenance activity.
    The focus of the Digital Twin prototype in this chapter is an onshore wind farm,
    as it is more complex and expensive to do this for an offshore installation.


    Better management of the wind turbine service activities will improve the yield
    of the wind farm, leading to a higher level of power generation with increased
    reliability. It will improve customer satisfaction and reduce the cost of maintenance,
    with fewer truck rolls. It will further reduce the working capital that is tied
    up in inventory on the service trucks. These are all key **Value at Stake** measures
    for a manufacturer who also maintains the assets in operation.


    Before we start configuring the wind farm and wind turbines in the Azure Digital
    Twins instance that we set up in _Chapter 5, Setting up a Digital Twin Prototype_,
    we will look at wind turbines, their components, and the data that we want to
    collect to address the needs of our maintenance and operations use cases.


    # ## Basics of a wind turbine and a high-level data model


    Wind turbines are low-cost producers of renewable electrical energy that convert
    the wind’s kinetic power to electricity. It is regarded as a "clean" energy resource
    as it uses very little water, it emits no greenhouse gases, and there are no waste
    products from the generation process.


    ![](img/f445915fceb4649a77b6797f1425850b_170_0.png)


    Figure 6-2 – Wind turbines in southern California, USA'
  merge: -1
  img_proc: true
- pgno: 171
  md: '# Note


    Image source: https://commons.wikimedia.org/wiki/

    File:Wind_turbines_in_southern_California_2016.jpg


    Wind turbines are relatively simple to construct, but wind farms can contain many

    turbines. This makes it an ideal candidate for our first Digital Twin prototype.


    The most common type of wind turbine is configured with a horizontal axis, but
    turbines

    can also have a vertical access configuration. Wind turbines are further classified
    based

    on their installation. Land-based turbines are classified as onshore, while offshore
    wind

    turbines can be deployed miles away in the ocean. Offshore wind turbines have
    the

    added complexity of remote access both from a connectivity and a physical access
    of

    the field service crew perspective. The offshore wind turbines have to additionally
    deal

    with corrosion due to seawater. (See https://www.materialsperformance.

    com/articles/material-selection-design/2016/03/corrosion-

    risks-and-mitigation-strategies-for-offshore-wind-turbine-

    foundations.)


    We will use an onshore, horizontal-axis wind turbine with a typical three-blade

    configuration to simplify our first Digital Twin. Figure 6.3 shows the high-level

    components of a horizontal-axis wind turbine. We will primarily focus on the overall
    wind

    turbine performance, as well as the motor, gearbox, and generator units of the
    asset. To

    detect or prevent equipment failure, our maintenance Digital Twin will monitor
    real-time

    data from these components. You can extend the Digital Twin with additional models
    at a

    later stage to include other components, such as the pitch system, controller,
    and nacelle.


    ![](img/f445915fceb4649a77b6797f1425850b_171_0.png)


    Figure 6.3 – Inside a typical wind turbine'
  merge: -1
  img_proc: true
- pgno: 172
  md: '> > **Note**

    > > Image source: US Department of Energy: `https://www.energy.gov/eere/wind/inside-wind-turbine`


    The Digital Twin model will represent the data elements that we want to store
    for each instance of a wind turbine in the wind farm. The wind turbine model will
    also include sub-models that describe the data for the motor, gearbox, and generator.
    We need to distinguish between the different data types as properties, and the
    telemetry data that we will receive from the sensors on the wind turbines.


    The data model that we use for our first Digital Twin contains all the basic elements
    to describe the wind farm, wind turbines, and telemetry data.


    ![](img/f445915fceb4649a77b6797f1425850b_172_0.png)


    This data model in Figure 6.4 will be enough for the maintenance use cases in
    our first Digital Twin of the wind turbine. The next step is to configure the
    models and sub-models as **Digital Twins Definition Language (DTDL)** JSON files
    before they can be uploaded to Azure Digital Twins. The data model that we described
    in Figure 6.4 contains all the data elements but not any of the relationships
    between the different models. One of the main reasons for using graph-based Digital
    Twin services such as Azure Digital Twins is to capture non-hierarchical relationships
    that may exist between assets.'
  merge: -1
  img_proc: true
- pgno: 173
  md: 'An example of a hierarchical relationship is that of the wind turbine, which
    is located at a specific wind farm, and the turbine, which consists of a gearbox,
    rotor, and generator. There are, however, other non-hierarchical relationships
    between Digital Twins. An example of this is the proximity of different wind turbines
    to each other. One of the relationships may be NextTo, which can capture that
    wind turbine #789 is located next to wind turbine #248.


    These relationships and specific characteristics are described in ontologies.
    The ontology provides the structure for describing categories, properties, and
    relationships.


    In the next section, we will describe how to set up an ontology for our first
    wind turbine Digital Twin with the corresponding DTDL.


    # # Using an ontology to define Digital Twin models


    _Figure 6.5_ describes the basic steps to create an Azure Digital Twins-based
    example for the wind turbine prototype.


    ![](img/f445915fceb4649a77b6797f1425850b_173_0.png)


    Figure 6.5 – Process to create and use a Digital Twin


    The first step is to create the DTDL models in JSON format that also describe
    the relationships that are available between the different models and sub-models.
    The use of DTDL will allow the developers of Digital Twins to describe them in
    terms of the telemetry or data elements generated by the asset twin, their properties,
    and the commands they respond to. Overall, DTDL will facilitate the description
    of the relationship between the twins. This will lead to interoperability of twins
    from different domains. For instance, a wind farm will interact with energy grids,
    in the big picture.


    These models will then be uploaded to our Azure Digital Twins instance using the
    **Azure Digital Twins (ADT)** Explorer application. In the third step, we will
    also use the ADT Explorer to create instances of physical assets based on the
    models that are now available on the Azure Digital Twins platform. This can be
    quite a cumbersome and manual process and is not ideal for large-scale deployments.
    In a production environment, the automation of these activities will be done in
    your custom digital application or in a third-party solution. In the fourth step,
    we will demonstrate how to upload information for additional turbine instances
    in a custom application. In the final step, we will look at how to retrieve the
    Azure Digital Twins information for our maintenance use case.'
  merge: -1
  img_proc: true
- pgno: 174
  md: 'The first step is to create our DTDL models based on an ontology and the specific
    structure of the model file in DTDL, which in turn is based on the **Resource
    Description Framework (RDF)**. The RDF nature of DTDL was covered in _Chapter
    4, Getting Started with Our First Digital Twin_. There are no specific requirements
    for the structure of the ontology, but it is recommended that you follow the guidance
    of _Digital Twins Definition Language-based RealEstateCore ontology for smart
    buildings_ (`http://bit. ly/idt-buildingontology`), an open source initiative
    by Microsoft for creating Digital Twins. It provides a very comprehensive description
    of the ontology and is highly recommended if you want to create more advanced
    Digital Twin ontologies.


    _Figure 6.6_ provides the proposed simple ontology that we will use for our first
    wind turbine Digital Twin.


    ![](img/f445915fceb4649a77b6797f1425850b_174_0.png)


    This shows that the wind turbines are "members of" the wind farm. The rotors,
    gearboxes, generators, and towers are, in turn, "part of" the wind turbine. This
    is a very basic structure and there are alternative ways of representing this.
    We will, however, keep it simple for the purpose of configuring our first Digital
    Twin.'
  merge: -1
  img_proc: true
- pgno: 175
  md: 'Now that we understand the different relationships between the various models,
    we can proceed to create those models in DTDL format. Microsoft provides extensive
    open source DTDL documentation (https://bit.ly/idt-azuredocs) for the six metamodel
    classes that describe the following Digital Twin behaviors:


    +   - **Interface**: Describes the contents (properties, telemetries, commands,
    relationships, or components)

    +   - **Telemetry**: Describes the data emitted by any Digital Twin that is typically
    from sensors and synchronized at regular, short intervals

    +   - **Property**: Describes the read-only and read/write state of any Digital
    Twin, such as the serial number of a component

    +   - **Command**: Describes a function or operation that can be performed on
    any Digital Twin

    +   - **Relationship**: Describes a link to another Digital Twin and enables graphs
    of Digital Twins to be created

    +   - **Component**: Enables interfaces to be composed of other interfaces


    An example for DTDL for the wind farm is as follows:


    ```

    {

    "@id": "dtmi:com:idtbook:wt:farm;1",

    "@type": "Interface",

    "@context": [

    "dtmi:dtdl:context;2"

    ],

    "displayName": "WT Farm",

    "description": "Wind farm with wind turbines",

    "contents": [

    {

    "@type": "Property",

    "name": "Name",

    "schema": "string"

    },

    {

    "@type": "Property",


    ```'
  merge: -1
  img_proc: true
