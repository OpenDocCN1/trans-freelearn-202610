- pgno: 92
  md: 'While the concept of the Digital Twin has now been around for almost two decades,
    mainstream adoption is still an emerging area. It is an important question as
    to whether innovation and reinvention can be done by professionals who have been
    working for a long time in that area or by those who have come from different
    fields. Professionals working for decades in the same field understand the area
    very well and have built products and solutions that work a certain way today.
    Sometimes asking them to reinvent and think in different ways is a very difficult
    proposition. Let’s take an example of an aircraft on the runway during landing.
    A commercial aircraft with two or four jet engines only needs one engine for the
    purpose of taxiing, whereas most pilots in different airlines do not switch off
    the other engines right after landing, as that is how it has been done for years.
    The **Federal Aviation Administration (FAA)** handbook does not address that (see
    `https://www.faa.gov/regulations_policies/handbooks_manuals/ aviation/airplane_handbook/media/10_afh_ch8.pdf`).
    However, the airline Air Asia was able to save about 9 liters of fuel per flight
    by adopting this process (see `https://climatechange.thenewweconomy.com/aviation-airasia`).
    This reduced the CO<sub>2</sub> footprint by 28 kilograms per flight. In this
    case, GE had provided this innovative, fuel-saving tip to Air Asia.


    The preceding example shows that when we look at the roles and responsibilities
    for any Digital Twin initiative, it is important to form a team that consists
    of insiders and outsiders. Outsider could simply mean individuals who are not
    from the same domain and does not necessarily mean those who are from outside
    the company.


