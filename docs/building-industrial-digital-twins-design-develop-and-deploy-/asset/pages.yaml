- pgno: 77
  md: '# # 3 Identifying the First Digital Twin


    In Chapter 2, Planning Your Digital Twin, we discussed the key criteria for Digital
    Twins in enterprises and their expected business outcomes. We looked at this from
    the perspective of different industry sectors and their ecosystems. We analyzed
    the prerequisites for Digital Twins, including the organizational and cultural
    factors. Finally, we went over the technology requirements for Digital Twins.


    In this chapter, we will discuss the evaluation process for a Digital Twin in
    the context of a wide range of companies. This will provide you with wide exposure
    to the relevance of Digital Twins both for internal and external opportunities.
    We will tie this to the actual roles and responsibilities being created and advertised
    by companies today. We will cover these topics:


    +   - Evaluating Digital Twin candidates

    +   - Roles and responsibilities

    +   - Experimentation and interactions

    +   - The finalist


    In a nutshell, this chapter will cover the process of arriving at the first Digital
    Twin to build, in alignment with the nature of the business and achievable outcomes.
    This makes the identification and evaluation of the first Digital Twin crucial.
    This process will be covered comprehensively here.'
  merge: -1
  img_proc: true
- pgno: 78
  md: '# # Evaluating Digital Twin candidates


    In this section, we will identify the prospects for industrial Digital Twins and
    then evaluate

    the one we want to move forward with. This evaluation has to be done in the context
    of

    your company or initiative, to be relevant to you. We will do the evaluation for
    multiple

    scenarios here and that should help for a wide range of cases.


    Here are a few settings where a Digital Twin may be evaluated:


    +   - An industrial conglomerate

    +   - A large enterprise in a single industry sector

    +   - A public sector entity

    +   - A large software company or public cloud provider

    +   - An Independent Software Vendor (ISV)

    +   - A large System Integrator (SI) or management consulting firm

    +   - A small/niche service company


    Let’s now look at each of these scenarios.


    # # Industrial conglomerates


    Companies that would fit in this category are General Electric (GE), Siemens,
    ABB,

    Hitachi, Honeywell, Johnson Controls, Schneider Electric, Bosch, and Emerson Electric.

    Such industrial global companies have in recent years created a digital competency
    center

    within their company, with the goal of accelerating the industrial digital transformation.

    Some examples are GE Digital and Honeywell Connected Enterprise. We will look
    at both

    scenarios where the digital organization is evaluating the Digital Twin candidate
    or the

    Line of Business (LOB). Let’s look at the digital organization first.


    # # Digital twin at digital competency


    The digital competency is usually a horizontal LOB with the goal of servicing
    different

    LOBs as well as, in some cases, external customers directly, with the goal of
    developing

    new markets or new digital revenue streams. When the digital group evaluates the

    candidates for a Digital Twin, it will look at considerations such as the following:


    +   - Which LOB has identified one or more business use cases for the Digital
    Twin?

    +   - Is the Digital Twin going to drive internal efficiency in the LOB or is
    it going to be

    +     adopted by its customers?'
  merge: -1
  img_proc: true
- pgno: 79
  md: '+   - Is the LOB willing to commit its Subject Matter Experts (SMEs) to work
    with the digital group?

    +   - Will the Digital Twin framework be reusable for another LOB?

    +   - What is the current status of the data from the physical asset, such as
    availability and ownership of the data?

    +   - What is the current status of the physics- or math-based models and do these
    need to be developed from scratch for the Digital Twin of the physical asset or
    the process?


    Now that we have listed the key considerations for the Digital Twin, we are ready
    to identify the candidates. Let’s take a scenario where the digital group is working
    with an aviation and power generation business. The aviation business builds jet
    engines for aircraft and provides services to airline customers. The power business
    builds generators that are used by electric utility companies. The utility company
    also buys long-term service contracts from the manufacturer. Based on these, the
    digital group is evaluating three candidates for its first Digital Twin. These
    are the following:


    +   - Work with the aviation LOB to build the Digital Twin of the engine, E, that
    it manufactures.

    +   - Work with the power LOB to build the Digital Twin of the gas generator,
    G, that it manufactures.

    +   - Build a generic Digital Twin of a generator that is agnostic of the manufacturer.
    Since there are only a few engine providers for commercial aircraft, a generic
    jet engine model will not be very useful.


    Now, let’s compare each of the three scenarios in the following table:


    | Criteria | Twin of Engine, E | Twin of Gas Generator, G | Twin of Generic Gas
    Generator |

    |---|---|---|---|

    | First customer/user | Yes | Yes | Not yet |

    | Reusability of twin | Low | Possible for other generators | High |

    | Productivity/efficiency use case | Yes | Yes | No – external only |

    | New digital revenues | Possible | Possible | Yes |

    | Investment | Moderate | Moderate | High |'
  merge: -1
  img_proc: true
- pgno: 80
  md: 'The preceding table shows how the digital group may list the objective criteria
    to help decide the pecking order for the Digital Twin identification for the starting
    point. The table shows that the twin of the engine, E, and gas generator, G, would
    primarily be internal use cases driven by the LOB. The investments can be justified
    by productivity gains obtained by the business by the use of the twins. However,
    when the use case for the twin involves only external customers, it may require
    a higher initial investment.


    In the next section, let’s look at similar scenarios from the viewpoint of the
    LOB.


    # # Digital twin at the LOB


    The LOB of an industrial conglomerate may look at the same scenario through their
    own lens before deciding to invest in the Digital Twin initiative. In this case,
    the LOB may look at three different criteria:


    +   - The LOB’s own readiness for the Digital Twin initiative, whether is it complementary
    to its own business strategy or could be a possible distraction


    +   - The ability to quantify productivity or efficiency delivered by the twin


    +   - Technology direction


    The LOB would look at its current business strategy and then see where the Digital
    Twin would be a good fit. For instance, aviation and power generation businesses
    would normally sell the physical asset once and then sell long-term services to
    their customers. In such cases, the LOB would invest in the Digital Twin, to help
    improve the predictive maintenance services. Since these contracts are long-term,
    the top-line revenue is not likely to change due to the introduction of the use
    of a Digital Twin for predictive maintenance. However, the delivery of the services
    and margin on them could be substantially improved by the use of a Digital Twin.
    Hence, it will go well with the business strategy for the LOB. A similar case
    study of the Digital Twin of an aircraft’s landing gear is available here: https://www.ge.com/digital/customers/predictive-
    insights-aid-aircraft-landing-gear-performance. This prototype of the Digital
    Twin was built by GE and Infosys and one of the authors of this book (Nath) was
    involved in it.'
  merge: -1
  img_proc: true
- pgno: 81
  md: 'While we see that qualitatively speaking, the investment in the Digital Twin
    makes sense for

    the aviation LOB, it may further have to build the business case quantitatively.
    In order to

    do so, the LOB would have to estimate with sufficient confidence the improvement
    in the

    service contract margins due to proper use of the Digital Twin versus additional
    investments.

    This business case has to make sense in the long term, but should be measurable
    in the short

    to mid-term as well, to ensure they are moving in the right direction.


    Finally, the LOB has to look at the technology considerations. This may include
    the

    software platform as well as the infrastructure for data and connectivity of the
    physical

    asset. The LOB would have to work with the asset owner or operator to obtain the
    data for

    the purposes of the Digital Twin. If the LOB decides to work with the digital
    group, or its

    conglomerate, then they need to make sure the digital platform can handle the
    data and

    modeling needs of their asset. For instance, while the gas generators, as shown
    in

    Figure 3.1, work in a fixed location, such as in a power plant, it is easy to
    connect them

    to a high-speed network for data collection, as long as the utility customer is
    on board

    with that:


    ![](img/f445915fceb4649a77b6797f1425850b_81_0.png)


    **Note**

    Image source: http://commons.wikimedia.org/wiki/

    File:Turboprop_T-53.jpg'
  merge: -1
  img_proc: true
- pgno: 82
  md: 'Power plants such as the one shown in Figure 3.2 house the gas generators.
    Often, the utility company buys a long-term service contract from the manufacturer,
    to transfer the risk of maintenance and downtime to them. In turn, the utility
    company would often agree to allow the collection and sharing of the data from
    the generator and its operation with the manufacturer, for the perceived value
    of better services and lower downtime:


    ![](img/f445915fceb4649a77b6797f1425850b_82_0.png)


    Figure 3.2 – Electric power plant


    > > **Note**

    > > Image source: `https://commons.wikimedia.org/wiki/File:Turboprop_T-53.jpg`


    Aircraft are typically only connected with very low-bandwidth satellite connections
    that are used for critical data transmission only. As a result, the collection
    of detailed data from jet engines would need an offline mechanism to collect massive
    amounts of data from the prior flight(s). The LOB would have to make sure that
    the digital group can provide the digital platform to facilitate such data collection
    for the Digital Twin of the engine, E, such as the one shown in Figure 3.3:'
  merge: -1
  img_proc: true
- pgno: 83
  md: '![](img/f445915fceb4649a77b6797f1425850b_83_0.png)


    Figure 3.3 – Rolls-Royce aircraft engine and landing gear


    > > **Note**

    > > Image source: https://www.aeronef.net/2011/12/boeing-

    > > 777-300-with-rolls-royces-jet.html


    Here, we looked at the key considerations in industrial conglomerate companies
    about

    the adoption and investment of a Digital Twin. We looked at the decision process
    for the

    central digital group as well as from the viewpoint of the LOBs.


    # # Large enterprises in a single industry sector


    Continuing the theme of aviation and power, let’s look at some large enterprises
    that

    primarily operate in a single industry. Some examples of such companies are Boeing
    and

    Airbus, which are the two largest aircraft manufacturers, as well as Exelon, which
    is

    a large energy company. Such companies would be comparable to our LOB assessment

    in a conglomerate.


    Let’s take the example of Boeing or Airbus. They manufacture aircraft that are
    primarily sold

    to airlines or, in some cases, to the defense sector. However, the definition
    of "airlines" has

    changed over time and companies such as FedEx, UPS, DHL, and Amazon operate like
    an

    "airline" as well. FedEx, UPS, and DHL each have over 250 aircraft. According
    to an article

    from September 2018 (see https://www.aviationtoday.com/2018/09/14/

    boeing-ceo-talks-digital-twin-era-aviation/), the CEO of Boeing

    claimed that they were able to improve their first-time quality of the sub-systems
    and

    parts of aircraft by 40% by leveraging Digital Twin asset development models.'
  merge: -1
  img_proc: true
- pgno: 84
  md: 'The aircraft manufacturers will have to evaluate how they will monetize the
    Digital Twin before making investment decisions. They would likely consider the
    following:


    +   - Improvement of the product quality during manufacturing by using a Digital
    Twin for simulations and as part of the digital thread


    +   - Improvement in the **Maintenance, Repair, and Overhaul (MRO)** services
    provided to the commercial airlines and cargo handlers while considering the relationships
    with large parts providers such as GE, Rolls-Royce, and Honeywell


    +   - Digital twin-based offerings sold as new revenues including to defense customers
    (see https://www.machinedesign.com/automation-iiot/article/21139448/full-throttle-digital-twins-boost-airworthiness-in-legacy-airplanes)


    Such considerations will help decide which type of Digital Twin to prioritize
    in the aviation industry. Dassault Systèmes, which is a company with about 20,000
    employees, has built Digital Twin capabilities as well (see https://www.3ds.com/3dexperience/cloud/digital-transformation/digital-twin-technology).
    It had a big presence in the aviation industry but is not limited to that industry.


    Energy sector companies such as Exelon operate in power generation, transmission,
    and distribution. Power generation would be from renewable and non-renewable sources.
    A company such as Exelon would typically purchase the majority of its equipment
    (including generators) from other manufacturers. As a result, they would have
    to decide whether to go to the manufacturer to obtain the Digital Twin of their
    equipment such as GE’s power generator or to build a generic model that can be
    used across different manufacturers’ generation equipment. Likewise, Exelon would
    have to look at internally prioritizing whether generation efficiency is more
    important than reducing any outages caused by the transmission and distribution
    capabilities. Exelon could focus on working with Siemens and Bentley Systems for
    their digital services for brownfield transmission and distribution (see https://www.bentley.com/en/about-us/news/2019/october/22/bentley-systems-introduces-assetwise-digital-twin-services).
    In this case, Exelon would adopt and build upon the OpenUtilities Digital Twin
    services for asset and network performance for its own use.


    If renewable power generation is a priority for Exelon, they may start with the
    Digital Twin of a wind turbine or the wind farm as a whole. Often, wind farms
    are in the middle of a desert or on top of a mountain and connectivity is a key
    consideration. The alternative can be the deployment of the Digital Twin of the
    asset and the fleet at the wind farm level.'
  merge: -1
  img_proc: true
- pgno: 85
  md: 'Finally,let''s look at a large medical device manufacturing company for the
    use of a Digital Twin. In 2020, due to the pandemic (Covid-19), there has been
    a renewed focus on medical devices and life sciences companies. Some large medical
    device companies include Medtronic, Thermofisher, **Johnson & Johnson (J&J)**,
    and Abbott. Medtronic makes medical devices such as pacemakers, and while the
    Digital Twin for a complex device such as a pacemaker would seem like a good starting
    point, Medtronic has talked about the Digital Twin of its supply chain in 2020
    (see `https://www.forbes.com/sites/stevebanker/2020/06/19/medtronics-digital-twin-supports-their-ability-to-respond-in-the-pandemic/?sh=d4819b6857ee`).
    The Digital Twin of the supply chain helps to make the operations and decision
    processes more agile, which is definitely needed in 2020, as part of industrial
    digital transformation.


    # # Public sector


    The public sector is usually not driven by profitability or competitive advantage,
    but rather by the focus on citizen experience. As a result, leaders in the public
    sector may look at the use of Digital Twins to improve the public health, safety,
    and convenience of their constituencies. In the context of public health, the
    concept of a human Digital Twin is gaining popularity. _"Over time, my medical
    record could be a Digital Twin of me"_ (see `https://www.challenge.org/insights/the-next-era-of-public-sector-digital-transformation/`).
    This is a concept different from the Digital Twin of an industrial physical asset,
    but here the human being is the "asset."


    Digital twins of cities have been considered in Europe (see `https://www. digitalurbanwins.com/post/why-the-public-sector-should-look-
    to-digital-twins-for-better-policy-making`). Such twins of cities can be used
    for the analysis of public policy changes, traffic analysis, and air quality analysis.
    The **China Academy of Information and Communications Technology (CAICT)** has
    also done some work on the architecture for Digital Twins of cities.


    The public sector may have to prioritize its Digital Twin-related initiatives
    based on funding and grants from higher levels of governmental bodies, as well
    as other non-technical considerations. However, it does not limit cities and counties
    from seeking public-private partnerships and being creative in the initial stages
    to pilot the Digital Twin.'
  merge: -1
  img_proc: true
- pgno: 86
  md: 'Federal and defense agencies such as the US Navy are also exploring the use
    of Digital Twins, such as for naval ships (see https://federalnewsnetwork.com/federal-insights/2020/05/navy-using-digital-twins-to-speed-innovation-to-the-fleet/):


    ![](img/f445915fceb4649a77b6797f1425850b_86_0.png)


    Figure 3.4 – Digital twin of a navy ship


    We looked at a few examples of the use of Digital Twins in the public sector.
    Next, let’s look at software and public cloud providers and their adoption of
    Digital Twins and related capabilities.


    # # Software and public cloud providers


    We will cover two main categories of software providers here. These are the following:


    +   - Business application software providers such as Oracle, SAP, and Salesforce.com

    +   - Public cloud providers such as Amazon – AWS, Microsoft – Azure, Google –
    GCP, Oracle – OCI, IBM, and Alibaba'
  merge: -1
  img_proc: true
- pgno: 87
  md: 'Business applications providers such as Oracle and SAP have a large customer
    base of enterprises who use **Enterprise Resource Planning (ERP), Human Capital
    Management (HCM), Customer Relationship Management (CRM)**, and related software.
    These enterprises often look to their business application providers for emerging
    technology solutions as well. So, when they are considering a Digital Twin, they
    may often look at these providers to see whether they have Digital Twin offerings
    and how well these are integrated into their current business application offerings.
    As a result, companies such as Oracle and SAP have invested in the **Internet
    of Things (IoT)** platforms and built capabilities for a Digital Twin around that.
    Companies such as Oracle and SAP are less likely to use a Digital Twin for their
    internal use; they are mainly concerned about providing a framework to allow their
    customers to build an industrial Digital Twin. They may provide a sample of Digital
    Twins, to help accelerate the customer’s own journey. Such business software companies
    may provide use cases for integration of the Digital Twin with enterprise software
    such as ERP with a focus on manufacturing and **Supply Chain Management (SCM)**
    modules.


    > > **Note**

    > > SAP has talked about its customers Kaeser Kompressoren and Netzsch using a
    Digital Twin here: `https://www.sap.com/products/supply-chain-management/digital-twin.html`.


    Now, let’s look at public cloud providers. You would have noticed that Oracle
    appears in both categories – namely business applications and public cloud providers.
    Public cloud providers have focused on cloud infrastructure, namely **Infrastructure
    as a Service (IaaS), Platform as a Service (PaaS)**, and in some cases **Software
    as a Service (SaaS)**. Most large enterprises run their software systems on the
    public cloud, to a varying degree. As a result, these enterprises often look at
    the available IoT and digital capabilities in the public cloud of their choice.
    They try to minimize the number of cloud providers for their IT and **Operation
    Technology (OT)** solutions. As a result, public cloud providers have started
    to add IoT and Digital Twin capabilities to their public cloud platforms. Microsoft
    Azure Digital Twins and the Oracle Digital Twin framework are such examples. The
    public cloud providers are again focused on providing the tools and capabilities
    to their customers for building Digital Twins and are not the primary consumers
    of Digital Twins for their own operations. The public cloud providers may, however,
    provide a security framework as data flows from the edge to the cloud.'
  merge: -1
  img_proc: true
- pgno: 88
  md: '# # ISVs


    ISVs include companies such as AspenTech, AVEVA, and Bentley. However, Schneider
    Electric acquired AVEVA in 2018. Companies in this category would work with other
    larger software providers, whether it is a public cloud provider or a similar
    company, to provide a Digital Twin solution to the end user or operating companies.
    Earlier in this chapter, we read that Bentley was working with SAP to provide
    a Digital Twin solution for Exelon. Likewise, AspenTech is working with their
    partner Equinox, helping to implement a Digital Twin for **Abu Dhabi National
    Oil Company (ADNOC)**, for the Shah gas plant (see `https://www.aspentech.com/en/blog/blog/GLOBal_Threads_of_
    Sustainability_From_Digital_Transformation`).


    We can see that ISVs maintain a symbiotic relationship with other software and
    service providers to bring Digital Twin offerings to operating enterprises. ISVs
    tend to build reusable software offerings around the Digital Twin and usually
    try to stay focused on a narrow range of industries. They often rely on the first
    few pilot customers to help enrich their offering.


    # # SIs


    SIs and management consulting companies such as Accenture, Deloitte, **Tata Consultancy
    Services (TCS)**, Infosys, and Capgemini focus on consulting services around strategy
    and implementation, for industry 4.0-related solutions. Typically, their customer
    bases are large enterprises. Generally, SIs do not build any reusable software
    products and instead partner with the technology provider of the IoT platform
    and Digital Twin systems. They may, however, decide to invest in the education
    and training of their consulting workforce, as well as building prototypes of
    the Digital Twin, to help evangelize their services. The Digital Twin of an aircraft’s
    landing gear was built by Infosys with the help of GE. In this case, Infosys was
    the SI partner to GE, who provided the domain knowledge and the **Industrial IoT
    (IIoT)** platform.'
  merge: -1
  img_proc: true
- pgno: 89
  md: '# # Niche companies


    As Digital Twins are still an emerging technology, many specialized and niche
    providers are in this space. To name a few companies, we have C3.ai, Uptake, and
    XMPro (see https://xmpro.com/digital-twins-the-ultimate-guide/). We will increasingly
    see specialized offerings from such niche providers, often via the marketplace
    of public cloud providers, such as the following:


    +   • iGeneration – Digital Twin on Azure (see https://azuremarketplace.microsoft.com/en-us/marketplace/apps/adfolks.igenerations-implement?tab=Overview)

    +   • Asset Performance Management – L&T Technology Services (see https://azuremarketplace.microsoft.com/en-us/marketplace/apps/ltts.rapm_asset_performance_management?tab=overview)


    These are primarily offerings for use by operating companies in their Digital
    Twin journey. We will increasingly see start-ups entering this space, to build
    a new business around Digital Twin technology. Different kinds of Digital Twins
    have a prominent place in Gartner''s Hype Curve of Emerging Technology, 2020.


    In this section, we looked at different ways to evaluate the value of Digital
    Twins in different business settings. Now,let''s look at the people and roles
    that are often responsible for the Digital Twin in different organizations.


    # # Roles and responsibilities


    In this section, we will identify the different personas and roles that would
    be part of the Digital Twin initiatives. One of the standard ways to represent
    roles and responsibilities is with a RACI matrix. The origin of the acronym RACI
    is from the four major responsibilities:


    +   • Responsible

    +   • Accountable

    +   • Consulted

    +   • Informed'
