- pgno: 248
  md: '# # Planning Composite Twins


    Let’s first understand a simple composite asset before we get into planning composite
    twins. We are all familiar with commercial aircraft. Companies such as Boeing
    and Airbus are major manufacturers of commercial aircraft. However, a commercial
    aircraft such as the Boeing 747-8 (see `https://www.boeing.com/commercial/747/`),
    which can seat up to 410 people and uses a GEnx-2B engine from General Electric
    Aviation, consists of as many as 6 million parts, manufactured by about 550 suppliers
    in as many as 30 countries. For more information, refer to `https://boeing.mediaroom.com/2013-
    05-29-Boeing-Celebrates-Delivery-of-50th-747-8`.


    _Figure 8.8_ shows a simplified view of a composite asset such as a commercial
    aircraft. In turn, each major part of the aircraft consists of many sub-assemblies
    and individual parts. _Figure 8.9_ shows the jet engine of the aircraft. A single
    aircraft such as a Boeing 747-8 would have four jet engines on the wings at any
    time. Note that aircraft engines can also be taken off the aircraft for inspection
    and maintenance and replaced with spare engines. To make it more complex, some
    aircraft allow engines from different manufacturers. An oversimplified analogy
    would be that you can use tires or batteries from different approved manufacturers
    for your car.


    ![](img/f445915fceb4649a77b6797f1425850b_248_0.png)


    Figure 8.8 – A simplified view of the major components of a commercial aircraft'
  merge: -1
  img_proc: true
- pgno: 249
  md: '# Planning Composite Twins 231


    Note

    Image source: https://it.wikipedia.org/wiki/

    File:Aircraft_Parts_eng.jpg


    The jet engine is the most critical and expensive part of the aircraft. A wide-body
    aircraft

    such as the Boeing 747-8 uses four jet engines. Some other commercial aircraft,
    such as

    the Boeing 777, use two jet engines. An average jet engine can have 25,000 parts
    from

    multiple suppliers.


    ![](img/f445915fceb4649a77b6797f1425850b_249_0.png)


    Figure 8.9 – Cross-section view of the engine of a commercial aircraft


    Note

    Image source: https://en.wikipedia.org/wiki/Components_

    of_jet_engines


    Overall, we notice that real-world assets such as aircraft are very complex in
    nature and

    consist of small parts. Likewise, if we look at the other end of the spectrum,
    such as a fleet

    of aircraft for an airline, it could consist of not only different aircraft but
    different models

    and manufacturers. In addition, the airline may not only own aircraft but other
    assets,

    such as de-icing machines, baggage trolleys, ground power units, jet bridges,
    and so on.

    The whole network from the airline perspective is the composite of such a variety
    of assets.


    From an airline perspective, the Digital Twin of its entire airline network would
    be a

    composite Digital Twin consisting of the operations of its major hubs, major routes,
    the

    fleet of aircraft, and other critical assets.'
  merge: -1
  img_proc: true
- pgno: 250
  md: 'Now, back to the power generation example, where we started with the Digital
    Twin of

    the wind turbine and the wind farm. Next, we look at extending it to the different
    Digital

    Twins for renewable sources of power generation. To continue, the composite of
    the

    entire power generation for a major utility company would include the Digital
    Twins of

    renewable and nonrenewable sources. Next, the utility company would have to look
    at

    the Digital Twins of the transmission, distribution, and consumer-level assets
    such as

    smart meters.


    Next, let''s look at Digital Twins for hydropower.


    # # Digital twins for hydropower


    The US **Department of Energy** (DOE) has an office focused on water power technologies.

    This DOE office is working on a framework for Digital Twins for hydropower with
    the

    goal of accelerating innovation by leveraging a virtual platform. For more information,

    refer to `https://www.pnnl.gov/projects/digital-twins-hydropower`.


    The average life expectancy of a hydropower plant is around 50 years. Digital
    twins of

    hydropower simulate the generation, transmission, and distribution systems. The
    main

    applications of Digital Twins for hydropower include the following:


    +   - Operations and maintenance – optimizing the maintenance of the hydropower

    +     plant with the goal of increasing the uptime, leading to increased power
    generation.


    +   - Cybersecurity – detecting any intrusions and safeguarding the infrastructure.
    The

    +     Colonial Pipeline ransomware attack on the East Coast of the US in June
    2021

    +     created an increased awareness of protecting energy infrastructures. For
    more

    +     information, refer to `https://www.cnn.com/2021/06/07/politics/

    +     colonial-pipeline-ransomware-recovered/index.html`.


    +   - Investment and market planning – helping to make the initial investment
    decisions,

    +     expansion decisions, and **ROI** calculations.


    According to an article by **General Electric** (GE), in 2017, hydropower (see
    **Figure 8.10**)

    is a renewable source of large amounts of power on demand as we lack the technology
    for

    grid-scale batteries for the storage of energy. Hydropower Digital Twins can help
    to bridge

    the gap when wind turbines are impacted by low wind speeds or cloudy weather,
    and the

    time of day impacts solar energy. For more information, refer to `https://www.ge.com/

    news/reports/dam-powerful-ge-connected-hydropower-internet`.'
  merge: -1
  img_proc: true
- pgno: 251
  md: '![](img/f445915fceb4649a77b6797f1425850b_251_0.png)


    Figure 8.10 – Renewable energy from hydropower


    Note

    Image source: https://no.wikipedia.org/wiki/Energi_i_Afghanistan


    Hydropower Digital Twins can help with similar scenario planning that can impact
    power

    generation, such as the amount of rainfall and water levels in dams and reservoirs.


    To understand the scale of potential power generation using hydropower, let''s
    look at

    Quebec, Canada. Due to the abundance of lakes and rivers in this province, hydropower

    could meet as much as 95% of the electricity needs of the 7 million Quebecois.
    The

    installed capacity for hydropower is around 46 gigawatts. For more information,
    refer

    to https://www.cer-rec.gc.ca/en/data-analysis/energy-markets/

    provincial-territorial-energy-profiles/provincial-territorial-

    energy-profiles-quebec.html. Deb Frodl, a former global executive director of

    GE Ecomagination, stated that digital hydropower plants are experiencing 1% or
    higher

    reliability improvements in their operations due to reduced downtime. This amounts
    to

    about 413 gigawatts an hour of incremental hydro generation when scaled globally.
    To

    compare it to wind power, it is equivalent to the power generated by a wind farm
    with

    about 700 turbines.'
  merge: -1
  img_proc: true
- pgno: 252
  md: 'Hydropower plants often use a Francis turbine, which is a reaction turbine.
    As water moves through the turbine, it changes pressure, giving up its energy.
    For more information, refer to https://www.sciencedirect.com/topics/ engineering/francis-turbines.A
    simplified view of such a hydropower turbine is shown in Figure 8.11.


    The turbine is located between the high-pressure water source and the low-pressure
    water exit, usually at the base of a dam. This allows us to use water-system dynamics
    and mechanical torque to turbine shaft equations to create the initial physics-based
    Digital Twin of hydropower. To learn more about such physics-based computations,
    see the research paper here: https://www.researchgate.net/publication/226204151_
    Torque_model_of_hydro_turbine_with_inner_energy_loss_ characteristics.


    ![](img/f445915fceb4649a77b6797f1425850b_252_0.png)


    Figure 8.11 - A simplified view of a hydropower turbine


    > > **Note**

    > > Image source: https://en.wikipedia.org/wiki/Water_ turbine'
  merge: -1
  img_proc: true
- pgno: 253
  md: 'In prior sections, we have provided a functional and technical foundation to
    get started on the Digital Twin of the hydropower. In the next section, we will
    focus on the Digital Twin of a solar farm.


    # # The Digital Twin of a solar farm


    We often see rooftop solar panels on homes, as shown in Figure 8.12. The state
    of California in the US has introduced the California solar mandate, which requires
    solar panels on all single-family and multi-family residences that are less than
    four stories high from January 1, 2020. This mandate intends to reduce greenhouse
    gas emissions by the equivalent of 115,000 gas-powered cars being taken off the
    road. This mandate was later relaxed and allowed building developers to augment
    rooftop solar panels with off-site solar power plants.


    ![](img/f445915fceb4649a77b6797f1425850b_253_0.png)


    In this section, we will mainly focus on commercial solar plants. In 2020, solar
    energy accounted for 15.4% of the energy needs of the state of California in the
    US. It produced about 30 **gigawatt-hours (GWh)** of energy through the solar
    **photovoltaic (PV)** and solar thermal power plants, according to the California
    Energy Commission. Figure 8.13 shows a typical solar PV plant. In the next section,
    we will look at the considerations for building the Digital Twin of a solar plant.'
  merge: -1
  img_proc: true
- pgno: 254
  md: 'The Gemini Solar Project, with a capacity of 690 megawatts of integrated solar
    PV and battery storage facility, will be the largest in the US and one of the
    largest globally. It will be in the US federal government lands near Las Vegas,
    Nevada. For more information, refer to https://www.nsenergybusiness.com/projects/gemini-solar-project/.
    It will cost about $1 billion and is expected to complete by 2023.


    ![](img/f445915fceb4649a77b6797f1425850b_254_0.png)


    Figure 8.13 – A solar photovoltaic plant


    A solar plant, such as the one shown in Figure 8.13, connects to the electric
    grid via the inverter and the transformer, as shown in Figure 8.14. The same is
    true for the wind farm and the hydropower plant, all of which would provide renewable
    energy for the electric grid, minimizing the need for the use of fossil fuel for
    power generation.


    ![](img/f445915fceb4649a77b6797f1425850b_254_1.png)


    Figure 8.14 – A solar plant connection to the power grid'
  merge: -1
  img_proc: true
- pgno: 255
  md: 'One of the authors of this book, Nath, was personally involved in one of the
    early initiatives for building the Digital Twin of a solar plant as a testbed
    under the Industrial Internet Consortium (IIC). For more information, refer to
    https://www.iiconsortium.org/press-room/11-08-17.htm.


    To decide the ideal location of a solar plant, solar irradiance information can
    be used. For more information, refer to https://www.nrel.gov/gis/assets/images/nsrdb-v3-ghi-2018-01.jpg.


    Irradiance is a measure of the solar radiant energy that arrives at a specific
    area during a given time interval. It is typically measured in watts/meters squared
    (W/m²). The Digital Twin is also considered for feasibility studies of the infrastructure
    buildout, such as this smart grid Digital Twin project being undertaken by four
    electrical engineering students. For more information, refer to https://www.unb.ca/alumni/magazine/2021-spring-summer/solar-energy.html.


    The Digital Twin of the solar plant with a focus on predictive maintenance and
    operations optimization will include major components (see Figure 8.15) such as
    the following:


    +   - Solar PV panels – commercial-grade solar PV panels are about 78 inches by
    39 inches (about 2 m x 1 m) in size with about 72 solar cells. They could weigh
    about 40 pounds (18 kg) and cost about $250,000.


    +   - Panel strings – a 200 MW solar plant will have about 100,000 panels arranged
    into 2,000 strings. Ideally, the Digital Twin of each panel and string needs to
    be maintained as a twin of twins.


    +   - String Combiner Box (SCB) – these are used to combine several solar panels
    or strings of panels.


    +   - Inverters – converts the solar panel-generated Direct Current (DC) to Alternating
    Current (AC) before connecting to the grid.'
  merge: -1
  img_proc: true
- pgno: 256
  md: 'A Digital Twin that considers the major functional blocks of the solar plant
    can make up

    to a 4% difference in the operating costs of the solar power plant. We recommend
    reading

    the research paper titled _Performance evaluation of 10 MW grid connected solar
    photovoltaic_

    to understand the underlying principles of the operating efficiency and the underlying

    power-conversation factors. This research paper can be found here: https://www.

    sciencedirect.com/science/article/pii/S2352484715000311


    ![](img/f445915fceb4649a77b6797f1425850b_256_0.png)


    Figure 8.15 – The solar plant block diagram


    The Digital Twin of the solar plant can help decide when to replace the solar
    PV panels to

    increase the energy output. Likewise, one pilot deployment of the Digital Twin
    was able to

    detect up to 83% of inverter failures, a week ahead of the incident. Such increased
    coverage

    of failure modes and the increase of lead times are the key overall performance
    metrics of

    the Digital Twin solution. The use of Digital Twin solutions for solar plants
    is driving the

    industry from the behavior of _install and forget_ to more active management of
    the energy

    infrastructure. Inefficiencies can be due to several reasons, such as the following:


    +   - The design and installation of the solar PV are flawed.

    +   - There is a mismatch in PV modules connected in series with string modules

    +   connected in parallel, leading to lower system performance.

    +   - There is an accumulation of dirt on the solar PV panels over time coupled
    with the

    +   lack of rainfall, especially when the mounting angle is not correct.

    +   - The mismatch is replacement cycles due to different life expectancies, such
    as

    +   5-10 years for the inverters and 20-25 years for the solar PV panels.'
  merge: -1
  img_proc: true
- pgno: 257
  md: 'We have highlighted some of the practical issues to monitor and fix with the
    help of the Digital Twin of the solar power plant. For more information, refer
    to https://www.mdpi.com/1996-1073/13/6/1398/htm.


    # # A solar PV and wind turbine hybrid


    The power generation level of a solar plant is dependent on the duration of sunlight,
    being much shorter on winter days. Likewise, a wind farm may experience lower
    wind speeds in the summer months than the winter months, based on its location.
    This provides opportunities to develop hybrid power plants. For more information,
    refer to https://www.energy.gov/energysaver/hybrid-wind-and-solar-electric-systems.
    Figure 8.16 shows such a hybrid of solar PV and a wind turbine. Such hybrid power
    systems are emerging on a small scale today but may appear on a commercial scale
    in the future. The Digital Twin of a hybrid power plant will require new levels
    of cross-domain expertise.


    ![](img/f445915fceb4649a77b6797f1425850b_257_0.png)


    Figure 8.16 – Hybrid power plant


    > > **Note**

    > > Image source: https://www.energy.gov/energysaver/hybrid-wind-and-solar-electric-systems'
  merge: -1
  img_proc: true
- pgno: 258
  md: 'In the preceding sections, we have looked at the major sources of renewable
    energy.

    We looked at the considerations for the Digital Twin of each of these renewable
    sources

    of energy. This information will help plan composite Digital Twins from the viewpoint

    of the following:


    +   - A large utility company that has generation based on renewable and nonrenewable

    +     sources and/or

    +   - An industrial manufacturing company in the energy sector that manufactures

    +     energy generation equipment for a variety of these sources


    Next, we look at the role of the Digital Twin, due to new innovations related
    to wind

    turbine and solar plants.


    # # New innovations in renewable power generation


    Let’s discuss wind-catching technology in the context of wind energy. Wind catching
    has

    great potential to reduce the **Levelized Cost of Energy (LCOE)**, which is a
    measure of

    the lifetime costs of an energy generation facility divided by the total amount
    of energy

    produced. Figure 8.17 shows the wind-catching design for offshore wind energy.
    It is a

    floating installation. This technology takes up less space and can produce up
    to five times

    more energy than traditional offshore wind turbines. For more information,

    refer to https://windcatching.com/.


    ![](img/f445915fceb4649a77b6797f1425850b_258_0.png)


    Figure 8.17 – Wind-catching design for offshore installation'
  merge: -1
  img_proc: true
- pgno: 259
  md: 'In wind catching, the energy generation is expected to increase exponentially
    with the wind speed. Traditional wind turbines tend to limit the energy output
    when wind speed exceeds about 12 meters a second by altering the pitch of the
    blades to reduce wear and tear. Hence, a windcatcher can generate a few times
    more energy from the same area of coverage. The role of the Digital Twin increases
    when such new technology is rolled out, as we do not have extensive amounts of
    historical data for predictive maintenance and optimizing energy generation. The
    physics-based model, based on the product design and data from lab testing of
    the windcatcher, can help to deploy the Digital Twins of the windcatcher from
    day one. These Digital Twins will provide key information to help enhance the
    understanding of the windcatchers as the fleet matures over time. Their expected
    life is 50 years, which is much longer than traditional wind turbines.


    Similarly, in July 2021, Singapore launched a massive floating solar farm. For
    more information, refer to https://www.scmp.com/video/asia/3141298/ singapore-unveils-one-worlds-biggest-floating-solar-panel-farms.
    It has 122,000 solar panels and is about 45 football fields in size. This floating
    solar plant will power five water treatment plants. Figure 8.18 shows the concept
    of the floating solar plant. Due to cooling by water and no shadows from nearby
    buildings, such a floating solar plant has high efficiency. Again, the Digital
    Twins of such new generation assets will play an important role in efficient management
    as we start to fully understand these new assets.


    ![](img/f445915fceb4649a77b6797f1425850b_259_0.png)


    This photo by KYOCERA CORP is licensed under CC BY.'
  merge: -1
  img_proc: true
- pgno: 260
  md: '# # Enhancements and next steps


    Here, we will take a holistic look at the Digital Twin program from the perspective
    of

    a company that is adopting and rolling out such a program. We saw in Figure 8.5
    a

    high-level rollout of the Digital Twin solution for the wind farm. Next, let’s
    look at an

    enhanced and more detailed view in Figure 8.19. The major blocks from the left
    to the

    right are as follows:


    +   - Supply chain networks – these are external networks of the supply chain
    ecosystem

    +   consisting of vendors, distributors, and logistics providers. Considering
    the

    +   disruption in the global supply chain during the COVID-19 pandemic, this

    +   area is ripe for supply chain and logistics Digital Twins in the near future.


    +   - Enterprise systems – these consist of the Information Technology (IT) systems
    in

    +   the enterprise, such as Oracle Enterprise Resource Planning (ERP), Salesforce.com

    +   as Customer Relationship Management (CRM), or the Manufacturing Execution

    +   System (MES).


    +   - External systems for economic, weather, and market data – these are external

    +   sources of reliable data that can be subscribed to and consumed by the other

    +   systems to make decisions.


    +   - Business applications – these are often the emerging group of industry-centric

    +   applications and digital platforms that will help to drive the next wave of
    industrial

    +   digital transformation. Such applications will often sit on top of the Digital
    Twin

    +   and the IoT platforms and provide business insights. They may or may not reside

    +   in the same public cloud or same vendor technology. For instance, IoT Intelligent

    +   Applications from Oracle (https://www.oracle.com/internet-of-

    +   things/) can connect to an Azure Digital Twin-based solution. Other examples

    +   include GE’s Asset Performance Management (APM) or more specialized energy

    +   trading advisory solutions.


    +   - Digital twin and IoT platforms – these are the building blocks of Digital
    Twin

    +   solutions and provide connectivity to power generation sources, such as wind

    +   turbines in a wind farm. Composite Digital Twins are deployed here as more

    +   sources of energy generation are introduced.'
  merge: -1
  img_proc: true
- pgno: 261
  md: '+   • **Field Service Management (FSM)** – the industrial asset-intensive industry,
    such as

    +   a utility company or the manufacturer of wind turbines, often manages an extensive

    +   field service workforce. FSM applications provide an efficient means of managing

    +   the operation and maintenance activities of such a workforce. Digital twins
    of the

    +   FSM workforce is a future area of opportunity.

    +   • Generation sources – this is the collection of the actual generation assets
    in the

    +   power plants and systems that facilitate the connectivity and data gathering,

    +   including the edge systems, supervisory control, and data access systems.

    +   • Electricity grid – all commercial-grade generation assets connect to the
    electricity

    +   grid, which manages the transmission and the distribution of electricity.


    With this, we have summarized the major systems involved in an enterprise-grade
    Digital

    Twin solution rollout:


    ![](img/f445915fceb4649a77b6797f1425850b_261_0.png)


    Figure 8.19 – The enterprise landscape for the Digital Twin solution deployment


    In this final section, we will look at our recommended organization structure
    for ensuring

    the success of such Digital Twin-related programs in a large enterprise.'
  merge: -1
  img_proc: true
- pgno: 262
  md: '# # Center of Excellence for Digital Twins


    A **Center of Excellence (CoE)** is often a shared facility with a specialized
    team dedicated to developing, harvesting, and promoting best practices in a business
    priority area. General Electric (GE) created a software CoE to focus on the industrial
    internet in 2012. For more information, refer to `https://hbr.org/2015/01/building-a-software-start-up-inside-ge`.
    This software CoE later became GE Digital. One of the authors of this book, Nath,
    was an employee of this GE software CoE and GE Digital from 2013 to 2018. GE Digital
    has become one of the pioneers in IIoT and Digital Twin technologies. GE Digital
    supports GE Renewables as one of the lines of business. GE Renewables is one of
    the largest manufacturers of wind turbines in the world.


    CoEs have started to become popular both in the private sector, such as in large
    global enterprises, and the public sector, such as the Minnesota State Energy
    CoE. For more information, refer to `https://www.energycareersminnesota.org/`.
    Another example is Equinor''s digital CoE, which includes the Digital Twin in
    its scope of activities as well. For more information, refer to `https://www.equinor.com/en/magazine/
    statoil-2030---putting-on-digital-bionic-boots.html`. Some strategies to build
    a CoE with the goal of driving digital transformation are described here: `https://techbeacon.com/enterprise-it/why-you-need-digital-transformation-center-excellence`.


    We summarize these strategies here:


    +   - Assemble the right team with techno-functional knowledge under an appropriate
    digital leader.

    +   - Provide a clear top-down charter and operating guidelines.

    +   - Provide the right technical and business training alongside a strong focus
    on a culture of innovation.

    +   - Set governance and put measurements in place, keeping in mind the startup-like
    freedom for innovation and execution.


    We further recommend reading the book _Industrial Digital Transformation_, from
    Packt, published in 2020. Please check the recommended reading list for this chapter
    as well. Since Digital Twins are an emerging technology, it is recommended to
    strongly consider a CoE that can evangelize the Digital Twin program and ensure
    the delivery of the business benefits from the investment. In the case of a utility
    company, Digital Twin solutions will improve overall productivity and efficiency,
    while in the case of an industrial manufacturing company, Digital Twin solutions
    can drive internal productivity and efficiency as well as new streams of digital
    revenue by commercially selling this solution to utilities and other companies.'
  merge: -1
  img_proc: true
- pgno: 263
  md: "# # Summary\n\nIn this final chapter of this book, we looked at the benefits\
    \ of deploying a Digital Twin solution from the perspective of an enterprise that\
    \ would potentially roll out such a program. We looked at how to scale from a\
    \ Digital Twin of one wind turbine to the wind farm to different sources of renewable\
    \ sources of energy. We looked at the twin of twins and how to plan and deploy\
    \ composite Digital Twins. Overall, we looked at how to enhance a Digital Twin\
    \ solution from its initial pilot deployment phase.\n\nWe strongly believe this\
    \ book provides a strong technical and functional foundation for you to start\
    \ building their first Digital Twin of an industrial asset and make it production-ready.\
    \ Such a skill will be a game-changer in industrial digital transformation in\
    \ the coming years. We thank you for joining us on this journey to build your\
