    # # Analytics and data platforms


    Analytics and data platforms are digital tools that provide advanced analytics
    capabilities.

    These capabilities include machine learning, artificial intelligence, and high-fidelity

    physics capabilities.


    These analytics platforms generally rely on IoT platforms for data ingestion from
    sensors

    and control systems sources. Additional data management capabilities include historian

    services, data lakes, and prebuilt analytics libraries for specific equipment
    types.


    Analytics and data platforms are often used in conjunction with BPM or application

    platforms to visualize and action the outcomes from the analytical insights.


    Some of the representative vendors for analytics and data platforms include the
    following:


    +   - ANSYS (ansys.com)

    +   - C3.ai (c3.ai)

    +   - OSIsoft (osisoft.com)

