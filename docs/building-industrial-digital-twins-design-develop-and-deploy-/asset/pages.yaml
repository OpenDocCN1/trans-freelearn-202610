- pgno: 103
  md: '# # The finalist


    After going through the evaluation process of the candidates for building the
    first Digital Twin, we selected a wind turbine as the asset. Let''s look at some
    of the reasons for the choice of building the Digital Twin of a wind turbine:


    +   - Overall, there is increased focus on renewable sources of energy, to help
    control the carbon footprint. A wind turbine uses air speed or the wind as fuel
    for generating electricity.


    +   - A wind turbine is a relatively less complex physical asset compared to a
    gas generator-powered power plant or a nuclear reactor. Hence, a wind turbine
    is a better candidate for the first Digital Twin, to keep the complexity lower.


    +   - The Digital Twin of the wind turbine would benefit both the manufacturer/service
    provider of the turbine as well as the owner/operator, which would often be the
    utility company. Additionally, the SIs and cloud platform and business software
    providers will be interested in providing the implementation and technology capabilities.
    Given renewable energy is commercially feasible, driving efficiency via the Digital
    Twin of the wind turbine and the wind farm would provide immediate value to its
    stakeholders.


    With the selected asset in mind, for building an industrial-grade Digital Twin,
    we will look at the planning and prerequisites in the next chapter. In the remainder
    of this book, we will build the first Digital Twin for the wind turbine, and evaluate
    it both technically and economically to calculate the ROI. Finally, in Chapter
    8, Enhancing the Digital Twin, we will extend this to other assets for renewable
    energy such as a hydroelectric power plant as well as a solar power plant, to
    provide wider coverage, from a utility perspective, of who may own all such power
    generation assets.


    # # Summary


    In this chapter, we looked at the evaluation process for Digital Twins, from the
    perspective of different organizations and stakeholders. This provides a framework
    to analyze the opportunities provided by the Digital Twin and make an informed
    decision. We looked at the different roles and responsibilities in enterprises
    around Digital Twin initiatives, including how these roles are being fulfilled.
    We then looked at the process of experimentation and iterations associated with
    the development of Digital Twins and related initiatives.'
  merge: -1
  img_proc: true
