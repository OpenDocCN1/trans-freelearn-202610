- pgno: 216
  md: '# # Success criteria for a pilot phase


    We suggest that you divide the success criteria for the pilot rollout into the
    three simple categories shown in the following diagram:


    ![](img/f445915fceb4649a77b6797f1425850b_216_0.png)


    The first success measure is to determine if the technology and tools are working
    as expected. In the wind-farm example, we can measure the number of predicted
    failures, exception events, and alerts that the Digital Twin provided during the
    evaluation. If we are confident that the technology and application are working,
    we can move to the next decision gate and success measure.


    Measuring the value of the solution ties back to the expected business outcomes
    that we defined in Chapter 4, Getting Started with Our First Digital Twin.


    This success measure is critical in the pilot phase as it will indicate the expected
    **return on investment (ROI)** when this is deployed at scale on completion of
    the pilot phase. While the first gate tests the technical success, the question
    of value is an important consideration for a project sponsor to give the green
    light for a full rollout of the solution.'
