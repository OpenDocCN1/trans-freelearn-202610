    Information from a Digital Twin can either provide decision support for an operational

    user or be used for process automation to remove the human from the loop. Business

    process management platforms can address both.


    # # Business Process Management platforms


    **Business Process Management (BPM)** platforms for Digital Twins may significantly

    overlap with IoT platform capabilities, but the focus of BPM platforms is more
    toward

    driving the business process or workflow resulting from IoT data. BPM focuses
    less on

    IoT device management, connectivity, and communication protocols.


    Advanced BPM solutions also provide low-code configuration environments aimed

    at subject matter experts to help configure workflows, processes, and business
    rules to

    actuate or automate actions. This process not only features data from IoT sources
    but also

    embeds advanced analytics into running processes to generate insights and situational

    awareness from the Digital Twin applications.


    Some of the representative vendors for BPM platforms include the following:


    +   - Avolution (avolutionsoftware.com)

    +   - Boxarr (boxarr.com)

    +   - iGrafx (igrafx.com)'
