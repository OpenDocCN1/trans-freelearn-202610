- pgno: 134
  md: 'Let’s start with a discussion on the considerations around a Digital Twin platform,
    to build

    on the discussions from the previous chapter.


    # # Identifying a Digital Twin platform


    In Chapter 3, Identifying the First Digital Twin, we looked at the evaluation
    of a Digital

    Twin from the perspective of various kinds of companies. The first and second
    types were

    large industrial companies, who could be a manufacturer of an industrial asset.
    Here, we

    will expand into such considerations from those such as an industrial manufacturer
    who

    would be interested in improving a product and providing good maintenance services,

    over the life of an asset, to its customers or operators of the asset.


    # # The perspective of the asset owner


    Let’s narrow things down to the energy sector and the manufacturer of wind turbines.

    Global warming and the use of renewable sources of energy are on the rise. Hence,
    we

    believe wind turbines will continue to become an important industrial asset in
    the energy

    sector. A **horizontal-axis wind turbine (HAWT)**, such as the one shown in the
    following

    figure, is the most commonly used type of wind turbine. Such a wind turbine can
    be used

    as a single asset or as part of a wind farm. An industrial-grade wind turbine
    could last

    about 20 years. The wind turbine requires no fossil fuels for the generation of
    energy as

    it uses the wind in motion as a source of energy. The wind is the only input to
    the wind

    turbine for generating energy, as the sunlight is a source of energy for solar
    farms. Today,

    the larger wind turbines can generate 10-20 **megawatts (MW)** of energy (see
    https ://

    reneweconomy .com .au/germany-gears-up-to-test-20mw-wind-

    turbines-79007). Such wind turbines can have a wingspan of 200 meters:


    ![](img/f445915fceb4649a77b6797f1425850b_134_0.png)


    Figure 5.1 – HAWT'
  merge: -1
  img_proc: true
- pgno: 135
  md: 'A wind farm can contain a small number of turbines to several hundred turbines.
    Such wind farms can be on land (onshore) or offshore. The following figure shows
    an offshore wind farm. Such a location generally has winds at the speed of 5-10
    **meters/second (m/s)** for effective power generation. The relative position
    and distance of wind turbines are important to improve the overall energy generation
    from the wind farm. Likewise, a wind farm is usually located in areas of a sustained
    flow of wind for the major part of the year or the major part of the day:


    ![](img/f445915fceb4649a77b6797f1425850b_135_0.png)


    Figure 5.2 – Offshore wind farm


    As we get ready to understand the requirements for building a Digital Twin of
    a wind turbine and a wind farm, it is important to understand how the physical
    layout of wind turbines is done in the wind farm to maximize overall energy generation.
    The distance between the base of the next turbine and the directional orientation
    is determined such that one turbine interferes minimally with the flow of wind
    for the rest of the turbines. Such an effect on wind is called a wake effect.
    The wake effect can be from different turbines in the same wind farm (wake effect
    internal) or from neighboring wind farms (wake effect external) (see `https://www.wind-energy-the-facts.org/wake-effect.
    html#`). The wake effect is a consideration for future wind farms to be constructed
    nearby. This is important due to the long life of wind turbines and wind farms.
    The growth of trees in nearby forests could also impact the nature of wind, over
    time.


    Next, let’s look at what kind of fundamental capabilities are needed for the foundation
    of a Digital Twin solution, such as for wind turbines and wind farms.'
  merge: -1
  img_proc: true
- pgno: 136
  md: '# # Required IoT capabilities


    A Digital Twin requires data from an asset to keep the twin current. This helps
    to build and maintain more accurate twins, which in turn assures better outcomes.
    These outcomes can be decision-supported for predictive maintenance or can simply
    arise through better asset utilization. In the last decade, we have seen the growth
    of several IoT platforms and some of them are geared toward industrial assets.
    A generic IoT technology stack is shown in the following figure, which depicts
    the device connectivity to capture and convert the data into a form that can then
    be communicated to the IoT core platform. Such core IoT often resides in a public
    cloud platform. Applications, including those for Digital Twins, are often built
    on top of the IoT platform:


    ![](img/f445915fceb4649a77b6797f1425850b_136_0.png)


    Figure 5.3 – The IoT technology stack


    > > **Note**

    > > Image citation: Abunahla, H., Gadhafi, R., Mohammad, B. et al. *Integrated
    graphene oxide resistive element in tunable RF filters*. Sci Rep 10, 13128 (2020).

    > > https://doi.org/10.1038/s41598-020-70041-x


    Let''s next look at some of the fundamental capabilities of an IoT platform—namely,
    the following:


    +   - Ability to gather data from assets, sensors, gateway devices, or third-party
    sources such as environmental data.

    +   - Ability to securely and reliably transfer data to the data store layer.
    This activity may require protocol translations and/or encryption of data.

    +   - Handle different types of communication mediums such as wired, wireless,
    or even satellite communication for remote locations.

    +   - Ability to understand the asset and fleet of assets structure so that data
    can be mapped to meaningful constructs.'
  merge: -1
  img_proc: true
- pgno: 137
  md: "+   - Ability to analyze the data from the different types of data stores (for\
    \ example,\n+   time series, relational, or unstructured), and apply models and\
    \ algorithms to\n+   generate insights.\n+   \n+   - Allow applications for specific\
    \ purposes to be built on top of the platform capabilities.\n\nNow, when we look\
    \ at the foundational capabilities required by the IoT platform, we find\nthese\
    \ are the following:\n\n+   - Compute\n+   \n+   - Storage\n+   \n+   - Network\n\
    \nIn order to obtain these foundational capabilities in an elastic and agile way,\
    \ IoT platforms\nuse the public cloud. Due to the distributed nature of the assets\
    \ in IoT, the compute,\nstorage, network, and connectivity capabilities may be\
    \ needed in multiple places. Public\ncloud platforms usually have the concept\
    \ of regions and **availability zones (AZs)** to help\nmeet such requirements.\
    \ Cybersecurity is taken care of by following secure practices, such\nas a) limiting\
    \ remote actuation of a device without going through the control systems in\n\
    place already and b) by use of data encryption between the edge and cloud, to\
    \ reduce the\nchances of tampering with data in motion.\n\n# Build versus buy\
    \ of the capabilities\n\nWe looked at the foundational capabilities required for\
    \ an IoT platform in the prior\nsection. Given that these capabilities exist in\
    \ any public cloud platform, it could be an\neasy decision to \"buy\" this capability\
    \ from the public cloud rather than \"build\" it. If we\ngo back about a decade,\
    \ many large enterprises used to build their own data centers\nto meet their computing\
    \ needs and keep their data and **information technology (IT)**\napplications\
    \ within the company firewall. As public cloud technologies started to mature\n\
    and strengthened security and compliance, enterprises started to move toward \"\
    buying\"\nvirtual data center-like capabilities in the public cloud.\n\nWhen it\
    \ comes to building a Digital Twin solution (such as a Digital Twin for wind\n\
    turbines, in our case), a manufacturing company would face a similar build-versus-buy\n\
    decision. We will break down this decision process by providing details of the\
    \ current\ntechnology landscape at this company, as follows:\n\n+   - Being a\
    \ global conglomerate, this company has many applications and databases.\n+  \
    \ These applications have been categorized as a) mission-critical and b) non-mission-\n\
    +   critical. Likewise, the databases have been categorized to a) export-controlled/\n\
    +   restricted; b) private; and c) public data."
