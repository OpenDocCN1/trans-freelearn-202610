- pgno: 90
  md: '# # RACI Matrix Definitions


    |   | Who is Responsible | Team or person assigned to do the work |

    |---|---|---|

    | R | Who is Responsible | Team or person assigned to do the work |

    | A | Who is Accountable | Team or person who makes the final decision and

    has the ultimate ownership |

    | C | Who is Consulted | Team or person who must be consulted before a

    decision or action |

    | I | Who is Informed | Team or person who must be informed about a

    decision or action |


    Figure 3.5 – Description of the RACI matrix


    Let’s construct a sample RACI matrix for the industrial conglomerate example:


    | | CDO/CTO | LOB Leader | Architect | Developer |

    |---|---|---|---|---|

    | Digital Twin Ideas | RA | C | I | |

    | Validating the Idea | A | RA | C | |

    | Prototype | R | | RA | C |

    | Test/Validate | I | | A | R |

    | Production/Market

    Readiness | R | A | C | I |


    This sample RACI matrix provides pointers to roles that will be part of the Digital
    Twin

    initiative according to the specific situation in the company. Often, once the
    business

    leaders decide to transition from selling products to bundles of products and
    services,

    they will start focusing on the Digital Twin as an enabler. This stage is often
    called the

