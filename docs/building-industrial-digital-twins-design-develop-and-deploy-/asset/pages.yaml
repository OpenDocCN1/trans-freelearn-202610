- pgno: 182
  md: 'The models are now available in the model repository on the left, as shown
    in _Figure 6.10_.


    ![](img/f445915fceb4649a77b6797f1425850b_182_0.png)


    Figure 6.10 – DTDL models available for use in Azure Digital Twins


    The next step in the configuration of our first Digital Twin, as shown in _Figure
    6.11_, is to create Digital Twin instances for our physical wind turbines. These
    instances will each be based on the Digital Twin models that we now have in the
