    using the Azure Digital Twins Explorer application.


    # # Uploading models to the Azure Digital Twins instance


    In Chapter 5, Setting Up a Digital Twin Prototype, we configured the Azure Digital
    Twins

    service and suggested that you set up Azure Digital Twins Explorer. ADT Explorer
    is

    an application that enables you to view your Digital Twin in a graph visualization.
    ADT

    Explorer is not an officially supported product by Microsoft at the time of writing,
    even

    though it is supported by Microsoft as open source. It is not recommended for
    large-

    scale deployments but provides the basic capabilities that we require to build
    our first

    Digital Twin. The sample application, source code, and installation instructions
    can be

    downloaded from GitHub (`http://bit.ly/idt-adtexplorergit`).'
