    # # Planning framework


    Chapter 3, Identifying the First Digital Twin, described an agile development
    process, which is the approach we suggest when building your first Digital Twin.
    Agile methods allow you to make quick course corrections as Digital Twins may
    be new to you and your organization. You probably won’t have precise design specifications.


    However, it remains essential to follow a structured planning process, even if
    you are using an agile development methodology. This section will describe different
    planning perspectives that are important to consider when getting starting with
    your first Digital Twin.


    A project planning framework provides guidance on the different project phases
    for developing your first Digital Twin. The planning framework for our first Digital
    Twin has been tailored to be agile as the technical and business impact of Digital
    Twins is unknown here.


    # # Project planning framework


