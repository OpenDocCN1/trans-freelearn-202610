  **Note**

  Image source: http://commons.wikimedia.org/wiki/File:Turboprop_T-53.jpg


  Power plants such as the one shown in Figure 3.2 house the gas generators. Often,
  the utility company buys a long-term service contract from the manufacturer, to
  transfer the risk of maintenance and downtime to them. In turn, the utility company
  would often agree to allow the collection and sharing of the data from the generator
  and its operation with the manufacturer, for the perceived value of better services
  and lower downtime:


  ![](img/f445915fceb4649a77b6797f1425850b_82_0.png)


  Figure 3.2 – Electric power plant


  **Note**

  Image source: https://commons.wikimedia.org/wiki/File:Turboprop_T-53.jpg


  Aircraft are typically only connected with very low-bandwidth satellite connections
  that are used for critical data transmission only. As a result, the collection of
  detailed data from jet engines would need an offline mechanism to collect massive
  amounts of data from the prior flight(s). The LOB would have to make sure that the
  digital group can provide the digital platform to facilitate such data collection
  for the Digital Twin of the engine, E, such as the one shown in Figure 3.3:


  ![](img/f445915fceb4649a77b6797f1425850b_83_0.png)


  Figure 3.3 – Rolls-Royce aircraft engine and landing gear


