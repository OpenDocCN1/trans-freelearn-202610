  '
- '### 8 增强数字孪生


  在第 7 章“部署和价值跟踪”中，我们讨论了如何执行功能测试，然后规划了数字孪生试点的部署和推广。我们探讨了跟踪**关键绩效指标（KPIs）**以及风力涡轮机数字孪生整体价值的方法。数字孪生的成功试点部署通常会导致大规模推广，以实现既定的业务目标。


  在本章中，我们将探讨超越试点阶段增强数字孪生的方法。我们将考虑不同组织的视角，以推动经济成果。本章将涵盖以下主题：


  - 定义孪生体的孪生体

  - 在完整系统中评估第一个数字孪生

  - 识别相关孪生体

  - 规划复合孪生体

  - 增强和下一步


  让我们从数字“孪生体的孪生体”概念开始。


  ### 定义孪生体的孪生体


  在此背景下，复合孪生体、孪生体的孪生体和系统的系统等术语经常被使用。让我们以能源生态系统为例来理解这一概念。在能源生态系统中，我们按以下层次结构来看：


  - 能源价值链将包括 a) 发电、b) 输电、c) 配电和 d) 用电，如图 8.1 所示。电网可以有一个或多个发电源。

  - 能源发电大致可分为 a) 化石燃料或非可再生能源和 b) 可再生能源。

  - 对于可再生能源，我们可以看 a) 风能、b) 太阳能和 c) 水能。

  - 风电场可以是 a) 陆上风电场或 b) 海上风电场。

  - 每个风电场通常由多台风力涡轮机组成。

  - 每台风力涡轮机有几个子系统或子组件及部件。


  ![](img/f445915fceb4649a77b6797f1425850b_236_0.png)


  图 8.1 – 能源价值链，包括发电、输电和配电


  > **注意**

  > 图片来源：https://www.flickr.com/photos/121935927@N06/13580677703


  风力涡轮机子系统的常见示例包括转子系统、齿轮箱、叶片、机舱、发电机、液压系统、制动器和偏航系统。我们在第 6 章“构建数字孪生原型”的图 6.3 中介绍了这一点。风力涡轮机的整体可靠性或正常运行时间将取决于子系统的可靠性和正常运行时间。


  有关更多信息，请参阅以下内容：

  https://www.researchgate.net/publication/271973476_Reliability_Analysis_of_Sub_Assemblies_for_Wind_Turbine_at_High_Uncertain_Wind


  基于生态系统的这一层次结构视图，我们可以非常高层次地可视化图 8.2 中所示的孪生体的孪生体：


  ![](img/f445915fceb4649a77b6797f1425850b_237_0.png)


  图 8.2 – 能源生态系统的数字孪生体的孪生体概念


  虽然本书前几章仅限于风力涡轮机的数字孪生，但理解图 8.2 中所示的孪生体的孪生体概念对于规划风力涡轮机数字孪生的大规模部署至关重要。如果我们从使用风电场作为可再生能源手段之一的能源公用事业公司的角度来看待能源生态系统，他们还将计划其他形式的发电。其他形式的发电，无论是太阳能电站还是燃气轮机发电厂，也可能有相关的孪生体的孪生体。因此，将此问题陈述视为系统的系统非常重要。在理论上，这可能看起来像是一种递归关系，但不同设备的其他工程制造商可能会导致不同的数字孪生系统。这导致了复合解决方案中数字孪生互操作性的挑战。


  ### 标准的作用


  有几项努力旨在引入标准，以使孪生体的互操作性更容易。在第 7 章“部署和价值跟踪”中，图 7.23 显示了 IEC 61400-25，它描述了在风电场背景下交换信息的标准数据模型。


  另一个这样的机构是 SC 41，它是 JTC 1 下属的一个分委员会。JTC 1 是**国际标准化组织（ISO）**和**国际电工委员会（IEC）**的联合机构。SC
  41 正在致力于**物联网（IoT）**和数字孪生相关标准。有关更多信息，请参阅以下内容：


  `https://www.iso.org/committee/6483279.html` 和 `https://www.iec.ch/blog/moving-ahead-standardization-digital-twin`


  _图 8.3_ 显示了在此背景下 SC 41 的工作范围：


  ![](img/f445915fceb4649a77b6797f1425850b_238_0.png)


  图 8.3 – SC 41 的范围及其活动


  **注意**

  图片重新绘制自来源：`https://www.itu.int/en/ITU-T/ Workshops-and-Seminars/20180604/Documents/
  Francois_Coallier_P_V2.pdf`


  在此背景下，关于 SC 41 小组的活动范围，我们应该将 IoT 术语视为更广泛的含义，其中将包括数字孪生等技术。


  SC 41 小组的一些标准相关工作包括以下内容：


  - ISO/IEC 21823-2，描述了 IoT 系统信息交换的框架和要求。它涵盖了 IoT 系统之间以及 IoT 系统内部的通信。

  - ISO/IEC TR 30164，描述了 IoT 系统应用边缘计算的一般概念。我们的场景，计算风力涡轮机，可以被视为 IoT 系统的边缘计算。

  - ISO/IEC TR 30166，涵盖**工业物联网（IIoT）**系统和环境。它涵盖了 IIoT 的功能和非功能方面。有关更多信息，请参阅 `https://www.iso.org/news/ref2529.html`。


  我们可以看到，IoT 和数字孪生相关标准仍在不断发展。我们建议数字孪生计划的利益相关者关注此类不断发展的标准，例如数字孪生参考架构的项目 PWI JTC1-SC41-5。利益相关者可以将其纳入规划中，以便与其他系统实现互操作性。一些相关文档可以在此处找到：`https://www.iec.ch/dyn/www/f?p=103:23:0::::FSP_ORG_ID:20486`。


  **美国国家标准与技术研究院（NIST）**也在致力于 NISTIR 8356 数字孪生技术和新兴标准的考虑事项。有关更多信息，请参阅 `https://csrc.nist.gov/News/2021/draft-nistir-8356-digital-twin-technology`。这份草案文档在数字孪生的“信任考虑”下，讨论了适用于孪生体的孪生体的“系统的系统”。当数字孪生由不同物理对象的孪生体组成时，源自底层孪生体的数据错误和损坏可能会传播并对孪生体的孪生体产生不利影响。因此，该文档建议，底层“孪生体应包装前置条件和后置条件，以确定来自一个孪生体的输出是否可作为另一个孪生体的输入。”


  本节关于数字孪生的新兴标准和指南，为孪生体的孪生体系统提供了考虑事项和最佳实践。我们建议数字孪生解决方案的利益相关者密切关注此类新兴标准和指南，以使其解决方案更加强健和互操作。


  接下来，让我们看看如何为孪生体的孪生体设定愿景。


  ### 设定愿景


  在上一节中，我们了解了孪生体的孪生体。_图 8.4_ 显示了我们第一个数字孪生（即风力涡轮机的数字孪生）在系统的系统中如何契合的高层次视图。该图显示了利用数字孪生推动能源领域效率和数字收入流的整体历程。


  ![](img/f445915fceb4649a77b6797f1425850b_240_0.png)


  图 8.4 – 设定跨行业细分市场的数字孪生愿景


  风力涡轮机的数字孪生有助于建模以下场景：


  - 如果风力超过正常水平（例如飓风或龙卷风），风力涡轮机可能受到的损坏

  - 如果风速持续一段时间达到每小时 25 至 30 英里，对能源发电的影响

  - 如果风速长时间低于每小时 5 英里，对能源发电的影响






  这些关于数字孪生实用性的场景有助于我们将风力涡轮机和风电场置于能源发电电网的背景下。在图 8.1 中，我们展示了整个电力价值链，这设定了更广泛的背景。图 8.4
  进一步描绘了公用事业公司如何规划不同能源发电模式（包括可再生能源和非可再生能源）的数字孪生未来推广。同样，他们随后可以查看传输和分布网络的数字孪生。这是审视数字孪生系统的系统的完美方式。


  能源电网的 **数字孪生定义语言（DTDL）** 本体，如图 8.8 所示，将有助于以标准化方式构建数字孪生应用程序。


  一家在多个行业领域运营的工业制造公司，例如能源发电、交通运输和航空，接下来可以查看交通运输和航空领域的数字孪生。此类工业集团的例子包括通用电气（GE）、霍尼韦尔和西门斯等公司。


  既然我们已经设定了数字孪生作为系统的系统的更大背景，让我们来看看我们第一个风力涡轮机数字孪生的评估。


  ### 在完整系统中评估第一个数字孪生


  在 _第 7 章，部署与价值跟踪_ 中，我们讨论了风力涡轮机数字孪生的功能测试。这包括测试数字孪生基础设施以及测试数字孪生应用程序。此类测试先于数字孪生的试点推广。在图
  7.12 中，我们展示了数字孪生试点的成功标准。此外，图 7.17 至图 7.19 展示了如何在此背景下捕获和展示关键绩效指标（KPI）。最后，我们讨论了两种推广方法：


  - 大爆炸方法

  - 分阶段方法


  大爆炸方法适用于成熟技术，例如 **企业资源计划（ERP）** 软件的推广，其中技术和功能被利益相关者非常清楚地理解。对于新兴技术，大爆炸方法会从技术、采用和经济角度增加更多风险。我们将在此处采用分阶段方法，以评估完整系统中的第一个数字孪生。


  让我们看看从高级别角度看，完整系统可能是什么样子。图 8.5 展示了数字孪生解决方案向风电场推广的分阶段方法：


  ![](img/f445915fceb4649a77b6797f1425850b_242_0.png)


  图 8.5 – 数字孪生推广的高级别视图


  在分阶段方法中，数字孪生被推广到单个风电场中三分之一的风力涡轮机。这样，可以将数字孪生的性能和结果与同一风电场中的其他风力涡轮机进行评估。这提供了一个良好的基准，并且，通常，同一风电场中风力涡轮机的年龄和型号预计会相似。它们都受到相同环境的影响，例如相似的风速和温度。


  接下来，让我们看看为什么我们推荐为数字孪生解决方案的推广采用分阶段方法。


  ### 分阶段方法的理由


  让我们使用图 8.6 来看看我们对分阶段方法的理由。


  有关更多信息，请参阅以下内容：


  https://blogs.gartner.com/tuong-nguyen/2020/12/07/gartner- launches-emerging-technologies-radar-2021/


  ![](img/f445915fceb4649a77b6797f1425850b_243_0.png)


  图 8.6 – 新兴技术和趋势的影响雷达图


  根据此图，数字孪生和物联网平台等技术将在大约 3-6 年内完全成熟。另一方面，低代码应用程序开发已经相当成熟。这意味着仅使用低代码应用程序开发的大爆炸推广方法风险要低得多，并且被很好地理解。另一方面，使用物联网平台和数字孪生技术的大爆炸方法并不被很好地理解，并且承载着更高水平的风险。因此，对于涉及数字孪生的企业级解决方案，建议使用分阶段方法。在这样的计划中，随着行业的成熟，解决方案可以在过程中进行调整。


  在下一节中，让我们量化数字孪生解决方案的效益。


  ### 效益量化


  为了定量评估风电场数字孪生解决方案分阶段推广的效益，我们将假设该风电场拥有 150 台风力涡轮机，这接近行业平均水平。让我们使用每台风力涡轮机平均 1 兆瓦的发电量和每年约
  45,000 美元的平均 **运营与维护（O&M）** 成本。我们将在 **投资回报率（RoI）** 模型中比较三分之一（即 50 台涡轮机）的成本，因为数字孪生的分阶段推广是针对
  50 台风力涡轮机的。我们在 _表 8.1_ 中展示了计算过程。


  让我们来看看部署数字孪生解决方案的效益理由。一台 1 兆瓦的风力涡轮机在 35% 的容量下产生约 61,300 美元的电力，在 50% 的容量下产生约 87,600
  美元的电力。有关更多信息，请参阅 http://anemoiservices.com/industry-news/how-much-money-does-a-wind-turbine-produce-from-electricity-it-generates/。


  我们将针对每台风力涡轮机每年约 12,000 美元的电力提升目标，这是由于数字孪生部署带来的运营效率。对于可再生能源，发电成本没有可变燃料成本。能够更高效地运行风力涡轮机并减少停机时间会导致发电量增加。我们预计每年还会减少
  3,000 美元的预测性维护成本。这将使每台风力涡轮机每年的净效益达到 15,000 美元。


  | 项目 | 基准成本 | 数字孪生成本 | 效益 | RoI |

  |---|---|---|---|---|

  | 当前 O&M 系统成本 | 每年 50 x 45,000 美元 | 每年 50 x 5,000 美元 | 15,000 美元 | 每年 50 x 10,000
  美元 |

  | 由于数字孪生/云计算产生的间接成本 | 0 | 每年 50,000 美元 | | -50,000 美元 |

  | 人力成本 | 0 | 每年 50K 美元 | | -50K 美元 |

  | | | | 净效益 > | 每年 400K 美元 |


  表 8.1 – 量化数字孪生分阶段推广的效益


  我们在计算中使用了可变成本而不是固定成本。虽然建造一台 1 兆瓦风力涡轮机的成本可能在 150 万美元左右，但从我们处理现有风电场（通常被称为棕地项目）的角度来看，这是一项沉没成本。由于我们提议使用云计算（例如
  Azure 数字孪生服务）作为主要支持服务，以及其他 Azure 服务，因此为了此 ROI 计算的目的，查看订阅模式的成本而不是资本成本很容易。同样，我们按每台风力涡轮机每年的基础估算了间接成本，例如集成成本、企业软件和人力成本。这使得模型保持简单，并可重复用于其他分阶段推广场景，例如数字孪生覆盖率为风电场的
  25% 或 50%。


  让我们进一步看看，在推广后得出业务效益时，数字孪生可以测量和影响哪些现实世界的指标。一篇 GE 可再生能源文章在其 Haliade 150-6MW 风力涡轮机的背景下讨论了这些问题，这是最强大的离岸风力涡轮机之一。风力涡轮机偏航电机的温度对于提高其性能至关重要。偏航电机通过风力涡轮机的偏航系统控制水平方向。要查看风力涡轮机横截面的详细视图（包括偏航系统），请访问此页面：https://www.windpowerengineering.com/wp-content/uploads/2016/04/Haliade_cutaway.png。


  为了最大限度地发电，偏航系统使转子迎风，这一点很重要，因为风向经常变化。这一点非常重要，因为在我们的 ROI 模型中，我们假设数字孪生系统的部署将有助于增加发电量，并将其效率从
  35% 提高到更高水平，我们可以衡量发电量增加的经济影响。


  使用数字孪生监控温度，将允许开发应用程序，该程序可以决定是允许全功率发电并承担更高的运行温度风险（这会降低材料寿命），还是略微减少发电量。这是通过使用偏航电机根据风向对齐涡轮机来完成的。总体而言，这将有助于在不冒风力涡轮机故障风险的情况下增加发电量。这有助于通过在安全区域运行风力涡轮机来实现资产更高的运行效率以及降低维护成本。这些是我们在表
  8.1 中的 ROI 计算中的两个主要假设。有关更多信息，请参阅 https://www.ge.com/news/reports/french-connection-digital-twins-paris-will-protect-wind-turbines-battering-north-atlantic-gales。


  在前一节中，我们研究了风力涡轮机数字孪生提供的业务成果。我们看到，随着风力涡轮机数字孪生技术的证明，美国政府（例如能源部（DOE））在这方面进行了投资。2019
  年 9 月，DOE 的高级研究计划署-能源（ARPA-E）向一个联盟颁发了 360 万美元的研究补助金 DIGIFLOAT。DIGIFLOAT 的目标是为浮动或离岸风力涡轮机创新数字孪生技术。浮动离岸风力涡轮机（FOWT）是海洋中的风力涡轮机，与陆地风力涡轮机相对。有关更多信息，请参阅以下内容：

  https://www.principlepowerinc.com/en/news-press/press-archive/2019/09/26/principle-power-led-consortium-awarded-36-million-for-digifloat-an-innovative-digital-twin-project-for-floating-wind-applications


  在下一节中，我们将研究相关数字孪生的识别。






  ### 识别相关数字孪生体


  在图 8.1 中，我们探讨了能源生态系统。电力系统的关键部分如下：


  - 发电 – 可再生能源和非可再生能源

  - 电力传输

  - 电力分配

  - 居民和商业消费者的电力消耗


  这有助于我们了解电力价值链，并在风力涡轮机的初始数字孪生体解决方案推出后，识别未来的数字孪生体。


  让我们来看图 8.7，即能源电网的数字孪生体定义语言（DTDL）本体论。在这里，本体论有助于描述能源价值链中的概念和类别集合。此外，它还有助于可视化能源电网主要组件之间的属性和关系。


  ![](img/f445915fceb4649a77b6797f1425850b_246_0.png)


  图 8.7 – 能源电网的数字孪生体本体论


  ![](img/f445915fceb4649a77b6797f1425850b_247_0.png)


  本书的重点一直放在风力涡轮机的数字孪生体上，它属于能源生态系统中的发电部分。因此，可再生能源发电中的相关数字孪生体将如下所示：


  - 离岸风电场数字孪生体

  - 太阳能电站数字孪生体

  - 水力发电厂数字孪生体


  考虑到对可再生能源的关注度不断提高，我们建议进一步探索这些数字孪生体。让我们从公用事业公司的角度来看。为了最大限度地提高发电量并满足峰值需求，它将需要可靠地优化所有发电资产的发电。我们假设公用事业公司使用可再生能源和非可再生能源。这里我们将关注可再生能源。假设公用事业公司拥有风力、太阳能和水力发电厂。这并非不切实际的场景。美国最大的公用事业公司之一
  Exelon 拥有“天然气、水电、风能和太阳能”的平衡发电组合。有关更多信息，请参阅 https://www.exeloncorp.com/companies/exelon-generation。


  2020 年夏天，加利福尼亚州北部在炎热的日子里面临电力短缺。原因之一是一些发电厂的运行产能不足。有关更多信息，请参阅 https://www.nytimes.com/2020/08/20/business/energy-environment/california-blackout-electric-grid.html。


  为这些发电厂（如风力、太阳能和水力发电厂）部署数字孪生体，可以确保这些资产得到妥善维护，并在需求较高的日子里（例如炎热的夏天，加利福尼亚州北部大部分地区气温超过
  100°F/38°C）能够以峰值水平提供能源。在某些地方，气温可超过 110°F/43°C。提高现有发电资产效率的能力将是数字孪生体解决方案的高效应用。


  在前一节中，我们确定了与第一个风力涡轮机数字孪生体相关的数字孪生体。这些数字孪生体将共同改变公用事业公司提高发电资产生产率以及通过改进预测性维护效率来降低运营成本的方式。


  接下来，让我们看看复合孪生体的规划。


  ### 规划复合孪生体


  在深入规划复合孪生体之前，让我们先了解一个简单的复合资产。我们都熟悉商用飞机。波音和空客等公司是商用飞机的主要制造商。然而，像波音 747-8（见 https://www.boeing.com/commercial/747/）这样的商用飞机，可容纳多达
  410 人，并使用通用电气航空的 GEnx-2B 发动机，由多达 550 家供应商在多达 30 个国家制造的多达 600 万个零件组成。有关更多信息，请参阅 https://boeing.mediaroom.com/2013-05-29-Boeing-Celebrates-Delivery-of-50th-747-8。


  图 8.8 显示了商用飞机等复合资产的简化视图。同样，飞机的每个主要部分都由许多子组件和单个零件组成。图 8.9 显示了飞机的喷气发动机。像波音 747-8 这样的单架飞机，机翼上任何时候都有四台喷气发动机。请注意，飞机发动机也可以从飞机上拆下进行检查和维护，并更换为备用发动机。为了使情况更加复杂，有些飞机允许使用不同制造商的发动机。一个过度简化的类比是，你可以为你的汽车使用不同批准制造商的轮胎或电池。


  ![](img/f445915fceb4649a77b6797f1425850b_248_0.png)


