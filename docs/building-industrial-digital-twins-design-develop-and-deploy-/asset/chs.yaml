  \ Podium 平台，使我们的公司能够自动化建筑的设计和运营。我们继续处于技术的前沿，致力于 Building 4.0 CRC——一项旨在颠覆开发和建筑行业的澳大利亚研究计划。数字孪生是我们数字活动的中心点。\n\
  \n### 5. 今天，数字孪生是准备好用于生产使用、试点使用、前沿概念，还是仅仅是炒作？\n\n数字孪生在过去 20 年里一直存在。它们主要被用于军事和航天行业。然而，在过去十年中，它们开始进入高科技制造行业，无论是产品设计还是维护活动。我们已经到了一个技术正在进入主流的阶段。数字孪生联盟拥有来自各行业的数百家参与公司。所有主要云服务提供商都在构建与数字孪生相关的服务。我们正处于早期阶段，但数字孪生正在变得主流。未来\
  \ 20 年将会令人兴奋，因为我们将推动行业向前发展。\n\n### 6. 对那些正在探索要在业务中采用的新兴技术的人有什么建议？\n\n数字孪生从自动化设计到预测性维护都充满了巨大的希望。我对任何企业的建议是采取三管齐下的方法。首先是确保组织正在探索和实验该技术，以便能够了解可能性。我加入\
  \ Lendlease 时很幸运，他们已经在进行实验和培养人才。第二是看看数字孪生能带来哪些可能的业务成果。在 GE，我们专注于预测性维护，因为我们行业中的非计划停机是一个重大问题。数字孪生是减少停机时间的完美解决方案。最后，专注于在少数几个问题上使用该技术。要小心不要贪多嚼不烂。该技术非常强大，你需要确保对技术的兴奋不会导致同时做太多事情。这是一场马拉松，而不是短跑。\n\
