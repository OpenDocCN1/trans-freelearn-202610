  \n### 技术评估注意事项\n\n我们的数字孪生预计将反映我们物理资产（即风电场中的风力涡轮机）的当前状况。在我们的案例中，我们确保风力涡轮机不同子组件的 DTDL\
  \ 包含实现我们目标所需的数据元素，该目标是在风力涡轮机在风电场运行时进行预测性维护。参考图 6.25，我们可以看到齿轮箱油位、油温和轴承温度等属性已在齿轮箱的\
  \ DTDL 元素中捕获。\n\n```\n{\n\"@type\": \"Property\",\n\"name\": \"Manufacturer\",\n\
  \"schema\": \"string\"\n},\n{\n\"@type\": \"Telemetry\",\n\"name\": \"GearboxOilLevel\"\
  ,\n\"schema\": \"double\"\n},\n{\n\"@type\": \"Telemetry\",\n\"name\": \"GearboxOilTemp\"\
  ,\n\"schema\": \"double\"\n},\n{\n\"@type\": \"Telemetry\",\n\"name\": \"BearingTemp\"\
  ,\n\"schema\": \"double\"\n},\n```\n\n图 6.25 – 风力涡轮机齿轮箱的数据元素示例\n\n图 6.24 显示了通过数字孪生的可视化应用程序在特定时间间隔内以可视方式显示齿轮箱油粘度等属性的能力。由于齿轮箱油状况监测是风力涡轮机行业的常见做法，这有助于将数字孪生应用程序与对业务用户有意义的参数联系起来。\n\
  \n数字孪生应用程序可以提供风力涡轮机在特定时间点的视图，例如图 6.26 所示的监控和诊断（M&D）中心。此类 M&D 中心通常由制造商的服务组织用于维护其整个机队中的风力涡轮机，这些涡轮机处于保修期或服务合同期内。\n\
  \n![](img/f445915fceb4649a77b6797f1425850b_199_0.png)\n\n图 6.26 – 工业 M&D/指挥中心\n\n\
  > **Note**\n> 图片来源：https://commons.wikimedia.org/wiki/File:Elite_ISI_Command_Center.png\n\
  \nM&D 中心通常结合来自数字孪生以及其他企业和第三方数据源的信息，如图 6.27 所示。组合后的信息以分析师易于消费的方式显示。通常，M&D 中心由工业设备制造商运营，并为风电场运营商提供监控服务。\n\
  \n![](img/f445915fceb4649a77b6797f1425850b_199_1.png)\n\n图 6.27 – 工业 M&D/指挥中心\n\n\
  \n\n\n\n当我们对数字孪生进行技术评估时，必须考虑其与 M&D 中心系统的集成。不同系统的数据可能具有不同的粒度；例如，天气预报（如风速和温度）可能是每小时一次，但风力涡轮机的遥测数据可能每秒记录一次。M&D\
  \ 中心的数据集成需要处理此类复杂性。\n\n接下来，让我们看看风力涡轮机数字孪生的业务验证注意事项。\n\n### 业务验证与理解\n\n根据 2013 年\
  \ 7 月的一篇风能出版物《监测风力涡轮机齿轮箱》，观察到齿轮箱的故障比风力涡轮机中的其他子组件更多。根据美国 **能源信息管理局 (EIA)**，风力涡轮机的预期寿命约为\
  \ 20-25 年。齿轮箱设计寿命约为 20 年，但大多数齿轮箱的实际寿命更短。齿轮箱也是风力涡轮机中最昂贵的子组件之一，其成本可高达风力涡轮机成本的 13%。齿轮箱的维修和更换过程很复杂，因为它位于很高的位置，并会导致长时间停机。图\
  \ 6.28 显示了风力涡轮机中齿轮箱的视图。齿轮箱中的油可保护变距齿轮、开式齿轮和偏航齿轮。\n\n![](img/f445915fceb4649a77b6797f1425850b_200_0.png)\n\
  \n图 6.28 – 风力涡轮机子组件\n\n![](img/f445915fceb4649a77b6797f1425850b_201_0.png)\n\n风力涡轮机轴承故障的常见原因之一是\
  \ **白蚀裂纹 (WEC)**，因为这些轴承承受着高度的力和扭矩。WEC 是风力涡轮机轴承可靠性问题的主要原因之一。WEC 会导致轴承材料表面下发生结构变化。当轴承受力时，产生的裂纹最终会延伸到轴承表面，从而导致轴承故障。通过监测齿轮箱油的状况来保持适当的润滑，可以帮助减少风力涡轮机轴承中\
  \ WEC 的发生。油的状况在降低齿轮箱运动部件的整体摩擦和磨损方面起着关键作用。根据埃克森美孚的一份出版物，2020 年风力发电场的平均年龄为 7 年。基于风力涡轮机平均\
  \ 5 至 10 年的制造商保修期，从商业角度来看，现场维护这一话题非常及时且相关。\n\n历史上，齿轮箱油的监测是通过离线方式进行的，即取样齿轮箱油。从风力涡轮机中取出的油样被送到实验室进行分析，检查粘度以及铁质和非铁质颗粒水平等特性。风力涡轮机的数字孪生，连同遥测数据，可以促进对油状况的在线监测。传感器可以持续记录温度并推导油的粘度。\n\
  \n在业务验证阶段，**主题专家**会查看数字孪生对风力涡轮机或整个风力发电场 **运营和维护 (O&M)** 成本的经济影响的初步估计。主题专家还会查看数字孪生的可信度，以便能够随时间做出此类\
  \ O&M 预算决策。\n\n接下来，让我们看看此背景下的一些实际数字。根据壳牌公司的数据，全球风力发电场维护每年花费约 80 亿美元（参见 `https://www.shell.com/business-customers/lubricants-for-business/sector-expertise/power-industry/wind-power/true-cost-of-wind-turbine-maintenance.html`）。每次齿轮箱故障事件给运营商造成的成本在\
  \ 30 万至 50 万美元之间。根据我们的研究，平均风力涡轮机更换齿轮箱油的成本约为 8,000 美元。齿轮箱可能容纳 200 至 800 升油。平均而言，基于计划维护，风力涡轮机的齿轮箱油更换每\
  \ 36 个月进行一次。\n\n在风力涡轮机平均 20 年的使用寿命内，需要 6-7 次换油。如果使用数字孪生进行基于状态的维护将其减少 1 次，即在风力涡轮机的可用寿命内进行\
  \ 5-6 次换油，这将仅在这一费用项目上每台风力涡轮机降低 8,000 美元的维护成本。此外，它还可以减少因齿轮箱故障导致的停机事件。除了健康监测和预测性维护外，数字孪生还可以有助于优化风力涡轮机，从而提高整个风力发电场的发电量。\n\
  \n在本节中，我们探讨了风力涡轮机数字孪生的业务验证。\n\n### 摘要\n\n在本章中，我们演示了如何构建工业资产的数字孪生，在此案例中为风力涡轮机。我们使用\
  \ DTDL 和 Microsoft Azure 数字孪生来构建数字孪生。我们讨论了开发人员如何利用通过 ADT 暴露的 PaaS 功能。我们进一步展示了需要在\
  \ ADT 之上为业务人员构建应用程序。我们使用 Power BI 和 XMPRO Data Stream Designer 来展示这些场景。然后，我们探讨了风力涡轮机数字孪生的技术和业务验证。\n\
