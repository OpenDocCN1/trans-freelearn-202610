  虽然每日站会已以通用方式描述，但这里也将应用于 WDC 场景。


  ### 测试用例


  测试用例是用于验证冲刺正在以满足利益相关者要求的方式生成用户故事和史诗工作的场景。这些测试用例可以由用户的**质量保证（QA）**团队用于在过程中检查和接受工作。用于确定被测系统是否满足要求的一组条件或变量是根据规范手动创建的，这些规范随后用于创建
  QA 团队使用的测试。在 WDC 场景中，测试用例将帮助利益相关者验证在冲刺期间使用数字孪生推进 ARV 试点的进度。






  ### Demo and user acceptance


  在每个 Sprint 结束时，整个团队会尽可能在会议室聚会，负责该用户故事的开发团队向利益相关方演示进展。使用垂直切片的用户故事有助于使这些演示对业务用户而言具有具体性。例如，在关于中国上海半导体制造厂（fab）二楼
  ARV 移动数字孪生的用户故事演示中，团队可能会展示 fab 小部分区域内单个 ARV 移动的 2D 图表。这对业务 SME 来说是有意义的，他们可以轻松地给予接受或拒绝。


  ### Iterations


  敏捷开发过程本质上是迭代的。如前所述，利益相关方可以在周期结束时接受或拒绝 Sprint、用户故事或整个史诗的结果。基于利益相关方的此类反馈，团队决定下一步是坚持还是转向。在
  WDC 场景中，团队决定坚持或继续推进改进。他们的总体业务目标是提高 fab 的整体服务时间。这反过来将帮助 WDC 提高 fab 二楼的吞吐量和效率。一旦实现，这一成功可以在整个
  fab 复制，然后复制到其他 WDC 地点。


  有关这些工件和敏捷仪式的更多详细信息，请参阅：`https://www.atlassian.com/agile/scrum/artifacts`。


  在本节中，我们了解了实验和迭代对于数字孪生相关举措的价值。使用诸如敏捷宣言等既定的软件方法论有助于采用可能提供增量价值并降低风险的实践。虽然我们在软件应用程序的背景下使用了示例，但类似的过程可以应用于物理世界和数字世界的融合，其中最终解决方案涉及传感器和
  IoT 网关等硬件以及软件组件。


  在下一节中，我们将探讨如何确定数字孪生举措的最终候选方案。


  ### The finalist


  在完成构建第一个数字孪生的候选方案评估过程后，我们选择了风力涡轮机作为资产。让我们看看选择构建风力涡轮机数字孪生的一些原因：


  - 总体而言，对可再生能源的关注度日益增加，以帮助控制碳足迹。风力涡轮机使用空气速度或风作为发电燃料。

  - 与燃气发电机驱动的发电厂或核反应堆相比，风力涡轮机是一个相对不太复杂的物理资产。因此，风力涡轮机是第一个数字孪生的更好候选方案，以保持较低的复杂性。

  - 风力涡轮机的数字孪生将同时惠及涡轮机制造商/服务提供商以及所有者/运营商（通常是公用事业公司）。此外，系统集成商、云平台和业务软件提供商将有兴趣提供实施和技术能力。鉴于可再生能源在商业上是可行的，通过风力涡轮机和风电场的数字孪生提高效率将为其利益相关方提供即时价值。


  在考虑所选资产的前提下，为了构建工业级数字孪生，我们将在下一章中探讨规划和先决条件。在本书的其余部分，我们将为风力涡轮机构建第一个数字孪生，并从技术和经济角度对其进行评估以计算
  ROI。最后，在第 8 章《增强数字孪生》中，我们将扩展到其他可再生能源资产，例如水力发电厂和太阳能发电厂，以提供更广泛的覆盖范围，从公用事业角度来看，这些资产可能由同一所有者拥有。


  ### Summary


  在本章中，我们从不同组织和利益相关方的角度探讨了数字孪生的评估过程。这为分析数字孪生提供的机会并做出明智决策提供了一个框架。我们探讨了企业中围绕数字孪生举措的不同角色和职责，包括这些角色是如何履行的。然后，我们探讨了与数字孪生及相关举措的开发相关的实验和迭代过程。


  在第 4 章《开始构建我们的第一个数字孪生》中，我们将探讨开始构建数字孪生。它将涉及规划框架、围绕数字孪生的业务流程，以及一些技术和数字平台考虑因素。


