  AnDOUC（原名 BIWA）的分析用户组的创始人。他拥有印度 IIT Kanpur 的本科学位，以及来自美国佛罗里达州博卡拉顿 FAU 的计算机科学硕士学位和
  MBA 学位。Shyam 是 IoTSWC 的项目委员会成员，也是大型技术活动的常客。可以通过 ShyamVaran@gmail.com 联系他。


  我要感谢我曾就职的公司的所有专业同事，感谢他们在那段时间里为我提供的宝贵经验，同时也感谢所有那些在 AI、物联网、数字孪生和云计算领域的行业专业人士，我与他们经常互动并在技术活动中相遇。我感谢工业互联网联盟（IIC）和数字孪生联盟（DTC）的各种活动和出版物，它们帮助我保持最新状态。最后，非常感谢我的合著者兼朋友
  Pieter，以及 Packt 的编辑团队，使本书得以出版。


