  Image source: https://www.aeronef.net/2011/12/boeing-777-300-with-rolls-royces-jet.html


  Here, we looked at the key considerations in industrial conglomerate companies about
  the adoption and investment of a Digital Twin. We looked at the decision process
  for the central digital group as well as from the viewpoint of the LOBs.


  ### 大型单一行业企业


  延续航空和电力主题，让我们来看看一些主要在单一行业运营的大型企业。此类公司的例子有波音和空客，它们是两家最大的飞机制造商，还有康卡斯特，一家大型能源公司。此类公司与我们在集团中对
  LOB 的评估可相比。


  让我们以波音或空客为例。他们制造的飞机主要销售给航空公司，或者在某些情况下销售给国防领域。然而，“航空公司”的定义随时间发生了变化，联邦快递、联合包裹、DHL
  和亚马逊等公司也像“航空公司”一样运营。联邦快递、联合包裹和 DHL 各自拥有超过 250 架飞机。根据 2018 年 9 月的一篇文章（见 https://www.aviationtoday.com/2018/09/14/boeing-ceo-talks-digital-twin-era-aviation/），波音
  CEO 声称，通过利用数字孪生资产开发模型，他们能够将飞机子系统和部件的首次合格率提高 40%。


  飞机制造商在做出投资决策之前，将不得不评估如何将数字孪生货币化。他们可能会考虑以下几点：


  - 使用数字孪生进行模拟并作为数字线程的一部分，在制造过程中提高产品质量

  - 改进为商业航空公司和货运处理商提供的**维修、修理和大修（MRO）**服务，同时考虑与 GE、罗罗和霍尼韦尔等大型零部件提供商的关系

  - 作为新收入来源销售的基于数字孪生的产品，包括面向国防客户（见 https://www.machinedesign.com/automation-iiot/article/21139448/full-throttle-digital-twins-boost-airworthiness-in-legacy-airplanes）


  此类考虑将有助于决定在航空业中优先采用哪种类型的数字孪生。达索系统是一家拥有约 20,000 名员工的公司，也构建了数字孪生能力（见 https://www.3ds.com/3dexperience/cloud/digital-transformation/digital-twin-technology）。它在航空业有很大影响力，但并不局限于该行业。


  康卡斯特等能源公司运营于发电、输电和配电领域。发电将来自可再生能源和非可再生能源。像康卡斯特这样的公司通常会从其他制造商处购买其大部分设备（包括发电机）。因此，他们将不得不决定是去制造商处获取其设备（如
  GE 的发电机）的数字孪生，还是构建一个可用于不同制造商发电设备的通用模型。同样，康卡斯特将不得不在内部确定发电效率是否比减少由输电和配电能力引起的任何停电更重要。康卡斯特可以专注于与西门子和本特利系统合作，为其棕地输电和配电提供数字服务（见
  https://www.bentley.com/en/about-us/news/2019/october/22/bentley-systems-introduces-assetwise-digital-twin-services）。在此情况下，康卡斯特将采用并基于
  OpenUtilities 数字孪生服务，用于其自身的资产和网络性能。


  如果可再生能源发电对康卡斯特来说是优先事项，他们可以从风力涡轮机或整个风电场的数字孪生入手。通常，风电场位于沙漠中或山顶，连接性是一个关键考虑因素。替代方案可以是在风电场层面部署资产和机队的数字孪生。


  最后，让我们看看一家大型医疗器械制造公司如何使用数字孪生。2020 年，由于疫情（Covid-19），医疗器械和生命科学公司再次受到关注。一些大型医疗器械公司包括美敦力、赛默飞、**强生（J&J）**和雅培。美敦力制造起搏器等医疗器械，虽然对于起搏器等复杂设备的数字孪生似乎是一个很好的起点，但美敦力在
  2020 年谈到了其供应链的数字孪生（见 `https://www.forbes.com/sites/stevebanker/2020/06/19/medtronics-digital-twin-supports-their-ability-to-respond-in-the-pandemic/?sh=d4819b6857ee`）。供应链的数字孪生有助于使运营和决策过程更加敏捷，这在
  2020 年作为工业数字化转型的一部分绝对是需要的。


  ### 公共部门


  公共部门通常不是由盈利或竞争优势驱动，而是由对公民体验的关注驱动。因此，公共部门的领导者可能会考虑使用数字孪生来改善其选民的公共健康、安全和便利。在公共健康背景下，人体数字孪生的概念正在变得流行。_"随着时间的推移，我的病历可能会成为我的数字孪生"_（见
  `https://www.challenge.org/insights/the-next-era-of-public-sector-digital-transformation/`）。这是一个与工业物理资产的数字孪生不同的概念，但在这里，人类是“资产”。


  欧洲已考虑城市的数字孪生（见 `https://www.digitalurbanwins.com/post/why-the-public-sector-should-look-to-digital-twins-for-better-policy-making`）。此类城市孪生可用于公共政策变化分析、交通分析和空气质量分析。**中国信息通信研究院（CAICT）**也对城市数字孪生的架构进行了一些工作。


  公共部门可能需要根据高级别政府机构的资助和拨款，以及其他非技术考虑因素来优先安排其数字孪生相关计划。然而，这并不限制城市和县寻求公私合作伙伴关系，并在初始阶段发挥创造力以试点数字孪生。






  ### 软件和公有云提供商


  我们将在此介绍两大类软件提供商。具体如下：


  - 业务应用软件提供商，例如 Oracle、SAP 和 Salesforce.com

  - 公有云提供商，例如 Amazon – AWS、Microsoft – Azure、Google – GCP、Oracle – OCI、IBM 和 Alibaba


  Oracle 和 SAP 等业务应用提供商拥有大量使用 **企业资源计划 (ERP)、人力资源管理 (HCM)、客户关系管理 (CRM)** 及相关软件的企业客户。这些企业通常也会向其业务应用提供商寻求新兴技术解决方案。因此，在考虑数字孪生时，他们常会查看这些提供商是否提供数字孪生产品，以及这些产品与其现有业务应用的集成程度如何。因此，Oracle
  和 SAP 等公司已投资于 **物联网 (IoT)** 平台，并围绕该平台构建了数字孪生能力。Oracle 和 SAP 等公司不太可能将数字孪生用于内部使用；他们主要关注为客户提供构建工业数字孪生的框架。他们可能会提供数字孪生示例，以帮助加速客户自身的进程。此类业务软件公司可能会提供数字孪生与企业软件（例如侧重制造和
  **供应链管理 (SCM)** 模块的 ERP）集成的用例。


  > **Note**

  > SAP 已讨论其客户 Kaeser Kompressoren 和 Netzsch 使用数字孪生的情况：`https://www.sap.com/products/supply-chain-management/digital-twin.html`。


  现在，让我们来看看公有云提供商。你可能已经注意到，Oracle 出现在两个类别中——即业务应用和公有云提供商。公有云提供商专注于云基础设施，即 **基础设施即服务
  (IaaS)、平台即服务 (PaaS)**，在某些情况下还包括 **软件即服务 (SaaS)**。大多数大型企业在不同程度上将其软件系统运行在公有云上。因此，这些企业通常会查看其选择的公有云中可用的
  IoT 和数字化能力。他们试图尽量减少其 IT 和 **运营技术 (OT)** 解决方案的云提供商数量。因此，公有云提供商已开始向其公有云平台添加 IoT 和数字孪生能力。Microsoft
  Azure Digital Twins 和 Oracle 数字孪生框架就是此类示例。公有云提供商再次专注于为客户提供构建数字孪生的工具和能力，而不是数字孪生的主要消费者，用于其自身运营。然而，公有云提供商可能会提供安全框架，因为数据从边缘流向云。


  ### ISV


  ISV 包括 AspenTech、AVEVA 和 Bentley 等公司。不过，施耐德电气于 2018 年收购了 AVEVA。此类公司会与其他较大的软件提供商合作，无论是公有云提供商还是类似公司，为最终用户或运营公司提供数字孪生解决方案。在本章前面，我们了解到
  Bentley 正与 SAP 合作为 Exelon 提供数字孪生解决方案。同样，AspenTech 正在与其合作伙伴 Equinox 合作，帮助为 **阿布扎比国家石油公司
  (ADNOC)** 实施数字孪生，用于 Shah 气体厂（见 `https://www.aspentech.com/en/blog/blog/GLOBal_Threads_of_
  Sustainability_From_Digital_Transformation`）。


  我们可以看到，ISV 与其他软件和服务提供商保持共生关系，以向运营企业提供数字孪生产品。ISV 倾向于围绕数字孪生构建可重用的软件产品，并通常试图专注于狭窄的行业范围。他们通常依赖最初的几个试点客户来帮助丰富其产品。


  ### SI


  Accenture、Deloitte、**塔塔咨询服务 (TCS)**、Infosys 和 Capgemini 等 SI 和管理咨询公司专注于围绕战略和实施的咨询服务，用于工业
  4.0 相关解决方案。通常，其客户群为大型企业。一般来说，SI 不构建任何可重用的软件产品，而是与 IoT 平台和数字孪生系统的技术提供商合作。然而，他们可能会决定投资于其咨询团队的教育和培训，以及构建数字孪生原型，以帮助宣传其服务。飞机起落架的数字孪生由
  Infosys 在 GE 的帮助下构建。在此案例中，Infosys 是 GE 的 SI 合作伙伴，GE 提供了领域知识和 **工业物联网 (IIoT)** 平台。


  ### 利基公司


  由于数字孪生仍是一项新兴技术，许多专业和利基提供商正在涉足此领域。举几个公司的例子，我们有 C3.ai、Uptake 和 XMPro（见 https://xmpro.com/digital-twins-the-ultimate-guide/）。我们将越来越多地看到此类利基提供商的专业产品，通常通过公有云提供商的市场，例如以下：


  - iGeneration – Azure 上的数字孪生（见 https://azuremarketplace.microsoft.com/en-us/marketplace/apps/adfolks.igenerations-implement?tab=Overview）

  - 资产性能管理 – L&T Technology Services（见 https://azuremarketplace.microsoft.com/en-us/marketplace/apps/ltts.rapm_asset_performance_management?tab=overview）


  这些主要是供运营公司在其数字孪生之旅中使用的产品。我们将越来越多地看到初创公司进入此领域，围绕数字孪生技术构建新业务。不同类型的数字孪生在 Gartner 2020
  年新兴技术炒作曲线中占据重要位置。


  在本节中，我们探讨了在不同业务环境中评估数字孪生价值的不同方式。现在，让我们来看看通常负责不同组织中数字孪生的人员和角色。


  ### 角色和职责


  在本节中，我们将识别将参与数字孪生计划的不同角色和人员。表示角色和职责的标准方式之一是使用 RACI 矩阵。缩写 RACI 源自四项主要职责：


  - 负责人 (Responsible)

  - 问责人 (Accountable)

  - 咨询对象 (Consulted)

  - 知会对象 (Informed)


  ### RACI 矩阵定义


  | | 谁是负责人 | 分配到执行工作的团队或人员 |

  |---|---|---|

  | R | 谁是负责人 | 分配到执行工作的团队或人员 |

  | A | 谁是问责人 | 作出最终决定并拥有最终所有权的团队或人员 |

  | C | 谁是咨询对象 | 在做出决定或采取行动前必须咨询的团队或人员 |

  | I | 谁是知会对象 | 必须被告知决定或行动的团队或人员 |


  图 3.5 – RACI 矩阵描述


  让我们为工业集团示例构建一个示例 RACI 矩阵：


  | | CDO/CTO | LOB 领导者 | 架构师 | 开发人员 |

  |---|---|---|---|---|

  | 数字孪生构思 | RA | C | I | |

  | 验证构思 | A | RA | C | |

  | 原型 | R | | RA | C |

  | 测试/验证 | I | | A | R |

  | 生产/市场就绪 | R | A | C | I |


  此示例 RACI 矩阵提供了根据公司具体情况将参与数字孪生计划的角色指引。通常，一旦业务领导者决定从销售产品转向销售产品和服务捆绑包，他们就会开始将数字孪生视为推动者。此阶段通常称为产品的服务化。公司的
  CEO 和董事会可能会为服务化设定公司方向，或将其委派给 **首席数字官 (CDO)** 等角色。在某些组织中，而不是 CDO，**首席技术官 (CTO)**
  角色可能会牵头与 LOB 领导者合作进行数字孪生构思。根据最近一篇《华尔街日报》文章，数字孪生市场在 2019 年价值 38 亿美元，预计到 2025 年将达到
  358 亿美元（见 `https://deloitte.wsj.com/cio/2020/06/23/digital-twins-bridging-the-physical-and-digital`）。






  通常，技术举措由 CIO 推动；然而，根据我们的经验，大型企业的数字孪生举措主要由其他技术角色牵头，他们与 LOB 领导者密切合作。CIO 的团队通常会在做出技术、平台和基础设施决策时介入。在一篇关于
  CIO 在数字孪生领域可能角色的有趣文章中，引入了**工程技术（ET）**的概念（参见 https://thansyn.com/why-cios-must-better-engage-with-engineering-technologists-to-leverage-digital-twins/）。下表总结了文章中的信息：


  |   | 数字孪生的性质 | 所有者/用户 | 用例 | CIO 的角色 |

  |---|---|---|---|---|

  | 1 | 物理属性模型 | 工厂工程师，产品设计师 | 工厂维护 新产品快速原型设计 | 提供高性能计算（HPC）和产品生命周期管理（PLM）功能 |

  | 2 | 电气属性模型 | 设施负责人，电气工程师 | 降低功耗 | 数据中心战略 |

  | 3 | 化学或热力学属性模型 | 工厂工程师，工艺工程师 | 替代产品和工艺 | 模拟与生产系统的集成 |

  | 4 | 工艺操作模型 | 工艺操作工程师 | 更快地解决运营问题并提高效率 | 将不同系统连接在一起，例如 ERP、MES 和工厂运营 |

  | 5 | 可靠性模型 | 维护工程师 | 降低维护成本并提高正常运行时间 | 将维护系统和时间序列数据连接在一起 |

  | 6 | 经济模型 | CFO/财务团队 | 更好的经济表现 | 集成财务规划和盈利能力系统 |


  虽然数字孪生的概念已经存在近二十年，但主流采用仍是一个新兴领域。创新和重塑是否可以由在该领域工作多年的专业人士完成，还是由来自不同领域的人士完成，这是一个重要问题。在同一领域工作数十年的专业人士非常了解该领域，并且已经构建了当今以某种方式运行的产品和解决方案。有时要求他们重塑并以不同方式思考是一个非常困难的命题。让我们举一个飞机在跑道上着陆的例子。一架拥有两个或四个喷气发动机的商用飞机只需要一个发动机来滑行，而不同航空公司的大多数飞行员在着陆后并不会立即关闭其他发动机，因为多年来一直是这么做的。**联邦航空管理局（FAA）**手册并未涉及此问题（参见
  https://www.faa.gov/regulations_policies/handbooks_manuals/aviation/airplane_handbook/media/10_afh_ch8.pdf）。然而，亚洲航空通过采用这一流程，每架航班可节省约
  9 升燃油（参见 https://climatechange.thenewweconomy.com/aviation-airasia）。这使得每架航班的 CO<sub>2</sub>
  足迹减少了 28 千克。在此案例中，GE 向亚洲航空提供了这一创新的省油建议。


  前面的示例表明，当我们审视任何数字孪生举措的角色和职责时，组建一个由内部人员和外部人员组成的团队非常重要。外部人员可能仅指来自不同领域的个人，并不一定指来自公司外部的人员。


  我们对明确提及数字孪生相关技能的职位描述进行了简要调查。下表列出了截至 2020 年 12 月的几个示例：


  | 公司 | 规模 | 角色 | 职位描述 |

  |---|---|---|---|

  | Tesla | 4,800 | 高级虚拟调试工程师 | 特斯拉正在寻找一位积极进取的工程师担任高级虚拟调试工程师，重点在于开发代码以及针对数字制造设备及其子组件进行测试和模拟。该职位专注于工业虚拟调试、数字孪生集成、工业
  PC/PLC 软件模拟/仿真、使用结构化文本/面向对象编程进行代码开发以及自动化测试。 |

  | Nokia | 98,000 | Mirror X 贝尔实验室实习生 | 机器人、混合现实设备、基础设施和其他传感器将提供创建物理世界镜像世界/数字孪生所需的近距离感知，并实现实时。这样的数字孪生将成为企业数字化的关键要素。
  |

