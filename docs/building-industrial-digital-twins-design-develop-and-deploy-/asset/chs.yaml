- '# Azure Digital Twins 工业数字孪生构建指南：使用 Azure Digital Twins 设计、开发和部署面向现实行业的数字孪生解决方案





  '
- '## 前言


  Shyam 和 Pieter 都是工业互联网、物联网和数字孪生社区的公认专业人士。他们在工业物联网联盟（原名工业互联网联盟）中将 OT/IT 任务组转变为数字孪生互操作性任务组。他们还领导该任务组开发了《工业应用数字孪生》白皮书。


  Shyam 是一本关于工业数字化转型的书的作者，该书由 Packt 出版。Pieter 目前是数字孪生联盟自然资源工作组的主席。他正在积极开发数字孪生能力框架和可组合的数字孪生开发方法论。


  在本书中，Shyam 和 Pieter 将逐步引导你创建第一个数字孪生原型。它通过一个示例项目探讨了数字孪生的“什么、为什么和如何”，该示例项目涵盖了在 Azure
  Digital Twins 平台上数字孪生原型开发的整个生命周期。


  作者在开发和部署现实世界工业数字孪生项目方面的丰富知识和经验，体现在他们在每一章中提供的实用指导和丰富的工具存储库中，例如精益数字孪生画布。他们关于设置 Azure
  Digital Twins 服务的易于遵循的建议，以及在服务上创建数字孪生模型和实例的逐步方法，将使你在几小时内开始你的第一个数字孪生原型。


  本书对于任何开始其第一个工业数字孪生项目的人来说都是宝贵的资源，不仅在于技术内容，还在于关于使用数字孪生解决现实世界业务问题的清晰指导。


  _Dan Isaacs_


  _CTO – 数字孪生联盟_


  ## 贡献者


