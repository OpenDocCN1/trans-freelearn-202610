  在每日站会期间以及 Scrum 团队工作的区域使用信息辐射器，可以对冲刺和发布的整体进度提供高度可见性。在大部分团队不在同一个屋檐下工作的场景中，会使用此类信息辐射器和
  Scrum 板的电子版本，每日站会可能通过视频会议系统进行。图 3.10 显示了这样一个电子 Scrum 板：


