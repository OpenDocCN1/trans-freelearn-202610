  图片来源：https://it.wikipedia.org/wiki/File:Aircraft_Parts_eng.jpg


  喷气发动机是飞机最关键、最昂贵的部分。像波音 747-8 这样的宽体飞机使用四台喷气发动机。其他一些商用飞机，如波音 777，使用两台喷气发动机。一台普通喷气发动机可来自多个供应商的
  25,000 个零件。


  ![](img/f445915fceb4649a77b6797f1425850b_249_0.png)


