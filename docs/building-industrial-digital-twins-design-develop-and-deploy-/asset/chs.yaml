- "### 6 构建数字孪生原型\n\n在第 5 章《设置数字孪生原型》中，我们讨论了构建数字孪生原型的推动因素。我们研究了数字孪生的所需功能，这些功能可以由公共云和\
  \ IoT 平台作为底层技术来满足。我们进一步调查了数字孪生平台，并研究了配置和设置细节。我们讨论了数据注意事项以及数字孪生的整体解决方案架构。\n\n在本章中，我们将调查已识别工业资产（即风力涡轮机和风电场的一组涡轮机）的数字孪生原型的开发过程。\n\
  \nFigure 6.1 显示了风力涡轮机数字孪生的概念视图，从工业用户的角度来看，该用户将是孪生的受益者。\n\n![](img/f445915fceb4649a77b6797f1425850b_168_0.png)\n\
  \n> **Note**\n> 图片来源：Digitalisation in power generation driving performance.\n>\
  \ Available at: https://www.powerengineeringint.com/\n> digitalization/digitalisation-in-power-generation-\n\
  > driving-performance/\n\n本章将涵盖以下主题：\n\n- 我们数字孪生的开发过程\n- 测试框架\n- 技术评估注意事项\n- 业务验证和理解\n\
  \n让我们开始详细讨论数字孪生原型的开发过程。\n\n### Technical requirements\n\n在本章中，我们将配置您的第一个数字孪生原型。我们使用的风电场示例有基于\
  \ JSON 的 DTDL 文件示例。您可以在 GitHub 上找到本章的代码文件，网址为 `https://github.com/PacktPublishing/\
  \ Building-Industrial-Digital-Twin`。\n\n### Development process of our Digital Twin\n\
  \n让我们探索数字孪生的开发过程。这将确保我们具备进行此类开发所需的技能。\n\n### Wind turbine as our Digital Twin prototype\n\
  \n我们将使用风电场作为我们第一个数字孪生原型的示例。我们将在此处专注于风电场的简单模型。我们的主要目标是展示如何在本书中创建风力涡轮机的第一个数字孪生，而不是帮助建立对风力涡轮机或可再生能源行业的专业知识。我们将为风电场中的每个物理涡轮机创建数字孪生模型和实例。数字孪生模型代表风力涡轮机的基本元素，从业务价值角度来看，足以应对不同的用例。\n\
  \n风电场和风力涡轮机数字孪生的视角是风力涡轮机制造商的视角，该制造商还受运营商合同，负责维护风力涡轮机以达到商定的服务级别。本章中数字孪生的用例仅限于风力涡轮机的维护和运营阶段，如在\
  \ _Chapter 1_、《数字孪生简介》中所述。在实践中，模型将涵盖整个生命周期，包括风电场和风力涡轮机的设计、制造和调试阶段。\n\n本章中风力涡轮机数字孪生的主要用例是制造商，该制造商在资产所有者/运营商持有资产期间对其风力涡轮机进行预测性维护服务。制造商拥有一支现场服务团队，需要主动前往正确的风电场的正确风力涡轮机，执行正确的维护，以防止风力涡轮机故障，从而导致非计划停机或以较低效率运行。\n\
  \n制造商希望确保高首次修复率，减少卡车出勤次数，并限制服务车辆上携带的现场备件。在此语境下，“卡车出勤”是指风力涡轮机现场服务技术人员必须乘坐服务车辆（通常是卡车）前往风电场执行安装、重新配置、故障排除、维修或任何其他形式的计划维护活动的场景。本章中数字孪生原型的重点是陆上风电场，因为对于离岸安装来说，这样做更复杂且更昂贵。\n\
  \n更好地管理风力涡轮机服务活动将提高风电场的产出，从而提高发电量并提高可靠性。它将提高客户满意度并降低维护成本，减少卡车出勤次数。它还将减少服务卡车上库存占用的营运资金。这些都是同时维护运营中资产的制造商的关键\
  \ **Value at Stake** 指标。\n\n在我们开始配置在第 5 章《设置数字孪生原型》中设置的 Azure 数字孪生实例中的风电场和风力涡轮机之前，我们将研究风力涡轮机、其组件以及我们想要收集以满足维护和运营用例需求的数据。\n\
  \n### Basics of a wind turbine and a high-level data model\n\n风力涡轮机是低成本的可再生电能生产商，将风的动能转换为电能。它被视为“清洁”能源资源，因为它使用很少的水，不排放温室气体，且发电过程没有废弃物产生。\n\
  \n![](img/f445915fceb4649a77b6797f1425850b_170_0.png)\n\nFigure 6-2 – 美国南加州的风力涡轮机\n\
  \n> Note\n> 图片来源：https://commons.wikimedia.org/wiki/\n> File:Wind_turbines_in_southern_California_2016.jpg\n\
  \n风力涡轮机相对容易构建，但风电场可以包含许多涡轮机。这使其成为我们第一个数字孪生原型的理想候选者。\n\n最常见的风力涡轮机类型配置为水平轴，但涡轮机也可以具有垂直轴配置。风力涡轮机还根据其安装方式进一步分类。陆上涡轮机被归类为陆上，而离岸风力涡轮机可以部署在海洋数英里外。离岸风力涡轮机具有额外的复杂性，既包括连接性方面的远程访问，也包括现场服务团队的物理访问。离岸风力涡轮机还必须应对海水引起的腐蚀问题。（参见\
  \ https://www.materialsperformance.com/articles/material-selection-design/2016/03/corrosion-risks-and-mitigation-strategies-for-offshore-wind-turbine-foundations。）\n\
  \n我们将使用典型的三叶片配置的陆上水平轴风力涡轮机来简化我们的第一个数字孪生。Figure 6.3 显示了水平轴风力涡轮机的高级组件。我们将主要关注整体风力涡轮机性能，以及资产的电机、齿轮箱和发电机组件。为了检测或防止设备故障，我们的维护数字孪生将监控这些组件的实时数据。您可以在后续阶段用额外模型扩展数字孪生，以包含其他组件，例如促距系统、控制器和机舱。\n\
  \n![](img/f445915fceb4649a77b6797f1425850b_171_0.png)\n\nFigure 6.3 – 典型风力涡轮机内部\n\
  \n\n\n\n\n\n> **Note**\n> Image source: US Department of Energy: `https://www.energy.gov/eere/wind/inside-wind-turbine`\n\
  \n数字孪生模型将表示我们希望为风电场中每个风力涡轮机实例存储的数据元素。风力涡轮机模型还将包括描述电机、齿轮箱和发电机数据的子模型。我们需要区分作为属性的不同数据类型，以及我们将从风力涡轮机上的传感器接收到的遥测数据。\n\
  \n我们为第一个数字孪生所使用的数据模型包含描述风电场、风力涡轮机和遥测数据所需的所有基本元素。\n\n![](img/f445915fceb4649a77b6797f1425850b_172_0.png)\n\
  \n图 6.4 中的这个数据模型足以满足我们风力涡轮机第一个数字孪生中的维护用例。下一步是在将模型和子模型上传到 Azure 数字孪生之前，将其配置为 **数字孪生定义语言\
  \ (DTDL)** JSON 文件。我们在图 6.4 中描述的数据模型包含所有数据元素，但不包含不同模型之间的任何关系。使用基于图的数字孪生服务（例如 Azure\
  \ 数字孪生）的主要原因之一，是为了捕捉资产之间可能存在的非层次关系。\n\n层次关系的一个示例是：风力涡轮机位于特定的风电场，而涡轮机由齿轮箱、转子和发电机组成。然而，数字孪生之间还存在其他非层次关系。一个示例是不同风力涡轮机之间的接近关系。其中一种关系可能是\
  \ NextTo，它可以捕捉风力涡轮机 #789 位于风力涡轮机 #248 旁边。\n\n这些关系和特定特征在本体学中进行描述。本体学提供了描述类别、属性和关系的结构。\n\
  \n在下一节中，我们将描述如何为我们的第一个风力涡轮机数字孪生设置相应的 DTDL 本体学。\n\n### 使用本体学定义数字孪生模型\n\n_图 6.5_ 描述了为风力涡轮机原型创建基于\
  \ Azure 数字孪生示例的基本步骤。\n\n![](img/f445915fceb4649a77b6797f1425850b_173_0.png)\n\n\
  图 6.5 – 创建和使用数字孪生的流程\n\n第一步是创建 JSON 格式的 DTDL 模型，这些模型还描述了不同模型和子模型之间可用的关系。使用 DTDL\
  \ 将允许数字孪生开发人员根据资产孪生生成的遥测或数据元素、其属性以及它们响应的命令来描述数字孪生。总体而言，DTDL 将促进孪生之间关系的描述。这将导致不同领域的孪生之间的互操作性。例如，在宏观层面上，风电场将与电网进行交互。\n\
  \n然后，这些模型将使用 **Azure 数字孪生 (ADT)** Explorer 应用程序上传到我们的 Azure 数字孪生实例中。在第三步中，我们还将使用\
  \ ADT Explorer 根据现在在 Azure 数字孪生平台上可用的模型创建物理资产的实例。这可能是一个相当繁琐且手动的过程，不适合大规模部署。在生产环境中，这些活动的自动化将在您的自定义数字应用程序或第三方解决方案中完成。在第四步中，我们将演示如何在自定义应用程序中上传其他涡轮机实例的信息。在最后一步中，我们将了解如何为我们的维护用例检索\
  \ Azure 数字孪生信息。\n\n第一步是根据本体学和 DTDL 中模型文件的特定结构创建我们的 DTDL 模型，而 DTDL 本身又基于 **资源描述框架\
  \ (RDF)**。DTDL 的 RDF 特性在 _第 4 章，开始使用我们的第一个数字孪生_ 中已介绍。本体学结构没有特定要求，但建议您遵循 _基于数字孪生定义语言的\
  \ RealEstateCore 智能建筑本体学_ (`http://bit.ly/idt-buildingontology`) 的指导，这是微软的一项开源倡议，用于创建数字孪生。它提供了非常全面的本体学描述，如果您想要创建更高级的数字孪生本体学，强烈推荐使用。\n\
  \n_图 6.6_ 提供了我们将用于第一个风力涡轮机数字孪生的拟议简单本体学。\n\n![](img/f445915fceb4649a77b6797f1425850b_174_0.png)\n\
  \n这表明风力涡轮机是风电场的“成员”。转子、齿轮箱、发电机和塔筒反过来是风力涡轮机的“组成部分”。这是一个非常基本的结构，并且有其他表示方式。然而，为了配置我们的第一个数字孪生的目的，我们将保持简单。\n\
  \n现在我们了解了各种模型之间的不同关系，可以继续以 DTDL 格式创建这些模型。微软为描述以下数字孪生行为的六个元模型类提供了广泛的开源 DTDL 文档 (https://bit.ly/idt-azuredocs)：\n\
  \n- **Interface**：描述内容（属性、遥测、命令、关系或组件）\n- **Telemetry**：描述任何数字孪生发出的数据，通常来自传感器并在定期的短间隔内同步\n\
  - **Property**：描述任何数字孪生的只读和读/写状态，例如组件的序列号\n- **Command**：描述可以在任何数字孪生上执行的函数或操作\n\
  - **Relationship**：描述到另一个数字孪生的链接，并使数字孪生图得以创建\n- **Component**：使接口能够由其他接口组成\n\n风电场的\
  \ DTDL 示例如下：\n\n```json\n{\n\"@id\": \"dtmi:com:idtbook:wt:farm;1\",\n\"@type\"\
  : \"Interface\",\n\"@context\": [\n\"dtmi:dtdl:context;2\"\n],\n\"displayName\"\
  : \"WT Farm\",\n\"description\": \"Wind farm with wind turbines\",\n\"contents\"\
  : [\n{\n\"@type\": \"Property\",\n\"name\": \"Name\",\n\"schema\": \"string\"\n\
  },\n{\n\"@type\": \"Property\",\n\"name\": \"GPSLongitude\",\n\"schema\": \"double\"\
  \n},\n{\n\"@type\": \"Property\",\n\"name\": \"GPSLatitude\",\n\"schema\": \"double\"\
  \n}\n]\n}\n```\n\n这是一个没有任何遥测或关系数据的接口文件示例。接口文件的典型结构在图 6.7 中描述，并在 http://bit.ly/idt-dtdl2\
  \ 上有完整文档。\n\n| 属性 | 是否必需 | 数据类型 | 限制 | 描述 |\n|---|---|---|---|---|\n| @id | 必需 |\
  \ DTMI | 最多 128 个字符 | 接口的数字孪生模型标识符 |\n| @type | 必需 | IRI | | 这必须是 \"Interface\"\
  \ |\n| @context | 必需（文档中至少一次） | IRI | | 处理此接口时使用的上下文。对于此版本，必须设置为 \"dtmi:dtdl:context;2\"\
  \ |\n| comment | 可选 | string | 1-512 个字符 | 给模型作者的注释 |\n| contents | 可选 | 遥测、属性、命令、关系、组件的集合\
  \ | 最多 300 个内容 | 定义此接口内容（遥测、属性、命令、关系和/或组件）的一组对象 |\n| description | 可选 | string |\
  \ 1-512 个字符 | 用于显示的可本地化描述 |\n| displayName | 可选 | string | 1-64 个字符 | 用于显示的可本地化名称\
  \ |\n| extends | 可选 | 接口集合 | 每个 extends 最多 2 个接口；最大深度 10 级 | 一组引用此接口继承的接口的 DTML。接口可以从多个接口继承。\
  \ |\n| schemas | 可选 | 接口架构集合 | | 引用此接口中可重用架构的一组 IRI 或对象。 |\n\n图 6.7 – 接口文件的结构\n\n\
  微软为 Visual Studio 和免费版的 Visual Studio Code (http://bit.ly/idt-vscodedtdl) 提供了 DTDL\
  \ 扩展。\n\n![](img/f445915fceb4649a77b6797f1425850b_177_0.png)\n\n图 6.8 – 带有 IntelliSense\
  \ 的 Visual Studio Code DTDL 扩展\n\n该扩展提供了从模板创建 DTDL 接口的功能。它支持 IntelliSense 和自动完成功能，并将验证\
  \ DTDL 文件的语法。_图 6.8_ 显示了带有 IntelliSense 和语法检查的风力涡轮机 DDL 文件。\n\n\n\n\n\nDTDL 模型（JSON\
  \ 格式）中的风力涡轮机包含用于遥测和关系的额外元模型类。它还描述了我们在 *风力涡轮机基础及高级数据模型* 章节中定义的涡轮机的所有数据模型元素：\n\n```json\n\
  {\n \"@id\": \"dtmi:com:idtbook:wt:turbine;1\",\n \"@type\": \"Interface\",\n \"\
  @context\": [\n \"dtmi:dtdl:context;2\"\n ],\n \"displayName\": \"WT Turbine\",\n\
  \ \"description\": \"--\",\n \"contents\": [\n {\n \"@type\": \"Property\",\n \"\
  name\": \"SerialNo\",\n \"schema\": \"string\"\n },\n {\n \"@type\": \"Property\"\
  ,\n \"name\": \"RatedPower\",\n \"schema\": \"double\"\n },\n . . . (See Github\
  \ for full json files)\n {\n \"@type\": \"Telemetry\",\n \"name\": \"Windspeed\"\
  ,\n \"schema\": \"double\"\n },\n {\n \"@type\": \"Telemetry\",\n \"name\": \"NacelleAngle\"\
  ,\n \"schema\": \"double\"\n },\n {\n \"@type\": \"Telemetry\",\n \"name\": \"State\"\
  ,\n \"schema\": \"string\"\n },\n {\n \"@type\": \"Relationship\",\n \"name\": \"\
  isMemberOf\",\n \"displayName\": \"MemberOf\",\n \"minMultiplicity\": 0,\n \"maxMultiplicity\"\
  : 1,\n \"target\": \"dtmi:com:idtbook:wt:farm;1\"\n }\n ]\n}\n```\n\n发电机的子模型同样包含与涡轮机模型的关系，如图\
  \ 6.4 所示：\n\n```json\n{\n \"@id\": \"dtmi:com:idtbook:wt:gearbox;1\",\n \"@type\"\
  : \"Interface\",\n \"@context\": [\n \"dtmi:dtdl:context;2\"\n ],\n \"displayName\"\
  : \"WT Gearbox\",\n \"description\": \"--\",\n \"contents\": [\n {\n \"@type\":\
  \ \"Property\",\n \"name\": \"GearboxSerial\",\n \"schema\": \"string\"\n },\n ...\
  \ (See Github for full json files)\n {\n \"@type\": \"Relationship\",\n \"name\"\
  : \"isPartOf\",\n \"displayName\": \"PartOf\",\n \"minMultiplicity\": 0,\n \"maxMultiplicity\"\
  : 1,\n \"target\": \"dtmi:com:idtbook:wt:turbine;1\"\n }\n ]\n}\n```\n\n风力发电场、涡轮机及其组件的\
  \ DTDL JSON 文件可在本书的 GitHub 仓库中下载，地址为 `https://github.com/PacktPublishing/Building-Industrial-Digital-Twin`。\n\
  \n它包括以下文件：\n\n- `Farm.json`\n- `Turbine.json`\n- `Rotor.json`\n- `Gearbox.json`\n\
  - `Generator.json`\n- `Tower.json`\n\n在下一节中，我们将使用 Azure Digital Twins Explorer 应用程序将模型文件上传到\
  \ Azure Digital Twins 实例。\n\n### 将模型上传到 Azure Digital Twins 实例\n\n在第 5 章“设置数字孪生原型”中，我们配置了\
  \ Azure Digital Twins 服务，并建议你设置 Azure Digital Twins Explorer。ADT Explorer 是一款应用程序，可让你以图形可视化方式查看数字孪生。在撰写本文时，ADT\
  \ Explorer 并非微软官方支持的产品，尽管微软将其作为开源项目支持。它不适用于大规模部署，但提供了构建我们第一个数字孪生所需的基本功能。示例应用程序、源代码和安装说明可从\
  \ GitHub 下载（`http://bit.ly/idt-adtexplorergit`）。\n\n在启动 ADT Explorer 应用程序之前，请先登录在第\
  \ 5 章“设置数字孪生原型”中配置的免费 Azure 服务。\n\n![](img/f445915fceb4649a77b6797f1425850b_181_0.png)\n\
  \n图 6.9 – 使用 Azure Digital Twins Explorer 上传 DTDL JSON 文件\n\n选择所有风力发电场和风力涡轮机模型及子模型，并将其上传到\
  \ ADT Explorer，如 *图 6.9* 所示。这将在你在第 5 章“设置数字孪生原型”中配置的 Azure Digital Twins 服务中创建模型文件。\n\
  \n模型现在已在左侧的模型存储库中可用，如 *图 6.10* 所示。\n\n![](img/f445915fceb4649a77b6797f1425850b_182_0.png)\n\
  \n图 6.10 – Azure Digital Twins 中可用的 DTDL 模型\n\n配置第一个数字孪生的下一步，如 *图 6.11* 所示，是为我们的物理风力涡轮机创建数字孪生实例。这些实例将基于我们现在在\
  \ Azure Digital Twins 服务中拥有的数字孪生模型。\n\n### 为风力发电场和涡轮机配置数字孪生实例\n\n一个风力发电场可以包含数百甚至数千台风力涡轮机。中国的酒泉风电基地拥有约\
  \ 7,000 台风力涡轮机（参见 `https://www.power-technology.com/features/feature-biggest-wind-farms-in-the-world-texas`）。\n\
  \n数字孪生软件设计方法的主要优势之一是能够拥有一个数字孪生模型和数千个数字孪生实例。对模型中属性的更改将使该属性可用于所有成千上万的适用实例。可以根据数字孪生模型中的信息架构，开发数字孪生应用程序以满足特定业务需求。\n\
  \n要创建第一个风力发电场数字孪生实例，请选择 **WT Farm** 模型旁边的 + 按钮（参见 *图 6.11*），然后为实例指定一个唯一名称。此名称将是物理孪生实例的唯一标识符或\
  \ ID，以后无法更改。这可以是序列号、资产编号或任何唯一描述符。为了本书的目的，我们将使用 windfarm1 作为唯一名称。\n\n![](img/f445915fceb4649a77b6797f1425850b_183_0.png)\n\
  \n图 6.11 – 为特定风力发电场创建唯一实例\n\n保存孪生名称后，将根据风力发电场 DTDL 模型和唯一的 `windfarm1` ID 创建第一个风力发电场实例。\n\
  \n![](img/f445915fceb4649a77b6797f1425850b_184_0.png)\n\n图 6.12 – 更新实例特定的数字孪生值\n\
  \n你可以在右侧属性资源管理器窗格中编辑此实例的属性和信息，如图 6.12 所示。这将使用该字段中的值更新实例。我们可以将 `windfarm1` 的名称更新为\
  \ `San Jose South Wind Farm`。`$dtid` ID 将保持唯一且不可编辑，但属性值可以通过 ADT Explorer 更改。`$dtid`\
  \ 是实例 ID，类似于关系数据库表中的主键。\n\n接下来，我们将为 WT 涡轮机模型创建风力涡轮机实例，过程类似，并更新特定实例数据。当我们拥有风力发电场和第一台涡轮机的实例后，可以继续使用顶部栏中的关系选项将这些实例链接起来。\n\
  \n![](img/f445915fceb4649a77b6797f1425850b_185_0.png)\n\n图 6.13 – 设置两个实例之间的关系\n\n\
  首先，选择涡轮机，然后选择风力发电场，并单击顶部栏上的关系图标，如图 6.13 所示。这将打开一个对话框，其中包含在 DTDL 模型中定义的所有关系类型的下拉列表。在此实例中，我们只有\
