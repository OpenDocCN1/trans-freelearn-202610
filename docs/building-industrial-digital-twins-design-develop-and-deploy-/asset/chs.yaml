- "## 前言\n\n数字孪生越来越多地被用于改进复杂产品的生命周期。这既适用于改进产品的制造过程，也适用于其整个生命周期内的运营。因此，信息技术（IT）专业人员和运营专业人员都对学习数字孪生产生了浓厚兴趣。本书将通过为可再生能源领域的风力涡轮机构建原型，来应用数字孪生的概念，风力涡轮机作为一种工业资产。\n\
  \n你将了解如何为数字孪生进行技术选择。然后，你将学习如何评估数字孪生可能带来的业务成果，进而分析投资回报率。使用 Azure Digital Twins 构建数字孪生的教程式方法将提供实践经验。最后，你将看到这个第一个工业数字孪生如何融入整个可再生能源生成生态系统。\n\
  \n### 本书适用人群\n\n本书的读者群将包括 IT 领导者、运营业务线（LOB）领导者以及寻求关于使用数字孪生推动数字化转型的指导的主题专家（SME），旨在为工业运营提供可量化的价值。本书面向中级专家或业务技术人员，例如工程师和运营经理，他们将作为本书的一部分构建风力涡轮机数字孪生的第一个原型。这将使这些业务技术人员能够评估数字孪生在真实世界数字孪生的完整设计、开发和部署生命周期中的资源需求和能力。\n\
  \n### 本书内容\n\n_第 1 章，数字孪生简介_，描述了数字孪生的概念，并简要介绍了其起源历史，以及对数字孪生概念的共同理解定义。它通过一些行业示例，提供了对数字孪生的使用和应用的理解。\n\
  \n**Dan Isaacs** 是 **数字孪生联盟（DTC）** 的首席技术官，负责技术方向、联络伙伴关系以及新会员的业务开发支持。Dan 曾任 Xilinx\
  \ 战略营销和业务开发总监，负责汽车业务开发 - 自动驾驶和 ADAS 系统，并负责新兴技术：AI/ML，以及 IIoT 的生态系统战略。\n\nDan 在福特、NEC、LSI\
  \ Logic 和 Hughes Aircraft 等汽车、军事/航空航天和消费类公司工作了 25 年。Dan 在世界论坛和全球会议上发表过主题演讲、举办过研讨会，并担任过小组成员和主持人。Dan\
  \ 是国际咨询委员会成员，拥有加州州立大学计算机工程：EE 学位和亚利桑那州立大学地球物理学 B.S. 学位。\n\n**Dr. Zoya Alexeeva**\
  \ 是一位经验丰富的数字化转型和战略高管，曾在制造、流程自动化、汽车和智能电网领域工作。她的专业知识包括 IIoT 业务案例、战略定义、IT 和 OT 系统及其集成、复杂解决方案交付以及市场和技术分析。她曾担任过多种职务，包括数字和\
  \ IT 战略总监、数字解决方案组合经理和解决方案架构师。\n\n\n\n\n\n第 2 章，规划你的数字孪生，识别评估针对特定工业挑战或机遇使用数字孪生的关键标准。本章涉及数字孪生的先决条件以及需要考虑的组织因素。\n\
  \n第 3 章，识别第一个数字孪生，涵盖为原型选择数字孪生候选项，每个候选项均从评估数字孪生以用于其用例的组织类型的角度出发。\n\n第 4 章，开始使用我们的第一个数字孪生，解释规划框架、如何验证问题陈述和预期结果，以及开发数字孪生的拟议业务流程。它识别可用于创建风力涡轮机第一个数字孪生原型的不同类型的技术平台。\n\
  \n第 5 章，设置数字孪生原型，为在下一章中构建数字孪生原型做准备，提供在云平台上选择和设置基础设施的实用分步指导。\n\n第 6 章，构建数字孪生原型，描述在\
  \ Microsoft Azure Digital Twins 平台上构建现实世界数字孪生原型的端到端过程。本章涵盖完整的开发过程，包括测试、技术评估和业务验证步骤。\n\
  \n第 7 章，部署和价值跟踪，指导你对数字孪生原型进行功能测试，并评估不同的部署模型，以将原型扩展为运营生产解决方案。本章进一步建议价值跟踪方法，以向工业企业中的不同利益相关方展示数字孪生解决方案的价值。\n\
  \n第 8 章，增强数字孪生，描述超越第一个数字孪生原型的可能性。本章探讨数字孪生的“可能艺术”以及数字孪生的一些新兴机遇，以提供更安全、更环保、更负责任的工业运营，并为所有利益相关方带来正回报。本章深入探讨数字孪生在可再生能源发电中的应用。\n\
  \n## 如何充分利用本书\n\n如果你对 JSON 和 Azure Functions 等编程概念具有基本技术熟练度，将能充分利用本书。这些技能不是先决条件。\n\
