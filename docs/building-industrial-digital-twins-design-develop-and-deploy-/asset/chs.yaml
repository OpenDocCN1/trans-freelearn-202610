- '## 第 1 部分：定义数字孪生


  本书的这一部分将向初学者介绍数字孪生的概念以及为什么需要数字孪生。你还将了解数字孪生的目的和优势。


  本部分包含以下章节：


  - 第 1 章，数字孪生简介

  - 第 2 章，规划你的数字孪生

