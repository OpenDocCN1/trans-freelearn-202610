  The model and subsequent **data definition language (DDL)** models are more advanced
  than the example we used in the initial Digital Twin configuration. Our focus for
  the book is on the technology aspect of the Digital Twin configuration rather than
  an IEC 61400-25-compliant wind turbine Digital Twin. However, for a production system,
  we would recommend a standards-based approach to ensure interoperability into microgrids
  and distribution grids.


  This section described the entire evolution of the deployment process shown in Figure
  7.10, starting with the POC ideation, prototype, pilot implementation, and full-scale
  rollout guidance. The final step in the evolution is not a distinct phase but instead
  makes sure that we track the value of the Digital Twin solution as it goes from
  concept to an operational system.


  We defined the problem statement and outcomes in Chapter 4, Getting Started with
  Our First Digital Twin. Closing the loop on this initial work is the final task
  for a project team before handing it to a support organization to maintain and operate
  going forward.


  ### Value proposition and tracking


  In Chapter 1, Introduction to Digital Twin, we described the value proposition of
  a Digital Twin based in terms of the following abilities:


  - Reduce complexity to improve understanding. This can lead to a) improved situational
  awareness and b) improved business outcomes. The improved business outcomes would
  be reflected in 1) increased revenue, 2) reduced cost, 3) improved customer and
  employee experience, and 4) improved compliance and reduced risk.

  - Transformational value—namely, a) business transformation through digital transformation
  and b) new or improved products.

  - Value at stake, which can be looked at as a) value to industry and b) value to
  society. The value to industry can be value migration or value addition. The value
  to society can be economic, societal benefits such as improved skills and/or a safer
  work environment, and—finally—environmental.


  The key elements of all of these value metrics were captured in a lean Digital Twin
  canvas in Chapter 4, Getting Started with Our First Digital Twin, and presented
  to project teams, executive sponsors, and other stakeholders. It is essential to
  track these metrics and values during each phase of your Digital Twin project. It
  is a **continuous monitoring (CM)** process that runs in parallel to all the other
  activities throughout the development and operations life cycle.


  Project sponsors are interested in the financial ROI, but they are increasingly
  interested in **environmental, social, and governance (ESG)** KPIs due to the increased
  awareness and legislation on sustainability. Senior executives in organizations
  are making public statements on sustainability targets, and the continuous tracking
  and forecasting toward the achievement of those goals are areas of high importance
  for the executive of an organization.


  We recommend building value-tracking metrics into the capabilities and reporting
  of a Digital Twin—a real-time, self-validating Digital Twin that provides continuous
  insights into the operations and reduces the continuous effort to track value metrics
  through manual effort. You have a unique opportunity with a Digital Twin to not
  only provide value but also quantify the value from a Digital Twin continuously.


  ### Summary


  In this chapter, we covered the deployment and scaling of a solution in an operational
  environment. We addressed four key aspects of turning a Digital Twin prototype into
  a fully operational Digital Twin solution.


  The first key aspect in turning a prototype into a production system is to address
  the functional testing of the Digital Twin solution. The testing process is to ensure
  that the Digital Twin solution performs the functions as specified at the requirements
  at the start of the prototype. In this chapter, we addressed various functional
  testing processes such as unit testing and black-box testing to illustrate how to
  test Digital Twins for full-scale deployment.


  We described the process of creating a pilot implementation as the second aspect
  of turning a prototype into a production system. This reduces the risk of a project
  while proving the capabilities and value in a real-world application.


  The third aspect in turning a prototype into a production system is planning and
  executing a full-scale deployment that builds on the learnings of the pilot phases.
  We assessed the pros and cons of big-bang and phased approaches and presented a
  bowling-alley model for a phased approach as our preferred method of scaling out
  from a pilot.


  Finally, we evaluated the success of the solution based on its ability to demonstrate
  the value it was designed to deliver and we described the process to track the value
  in a value-at-stake model first introduced in _Chapter 1, Introduction to Digital
  Twin_.


  In the following chapter, we will focus on enhancing the Digital Twin in its ecosystem,
  describing a system-of-systems Digital Twin approach, and providing some guidance
  on planning these composite twins.


  ### Questions


  1. What are the different functional testing methods that you should consider for
  your Digital Twin project?


  2. Which scope elements will you include in your Digital Twin project?


  3. What are the success criteria for your Digital Twin pilot project and how will
  you present the criteria to the project stakeholders?


  4. What approach will you need for a full-scale rollout to take the project beyond
  the initial pilot?


  5. How will you track and present the value of your Digital Twin prototype to create
  a case to move it beyond a pilot?





