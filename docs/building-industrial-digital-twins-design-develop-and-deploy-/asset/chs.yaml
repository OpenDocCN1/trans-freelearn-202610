  INL 探索数字孪生研究科学家的技术职业生涯。 |

  | Johnson & Johnson | 1,30,000 | 博士后科学家 | 博士后科学家将负责领导一个协作项目，构建强生上游平台工艺的数字孪生模型。该项目的目标是创建一个基于基因组的准确模型，作为大规模生产反应堆的数字表示，并利用该模型指导从细胞系选择到生产生物反应器的上游工艺开发。
  |

  | PTC | 6,000 | IoT 和 AR 销售区域总监 | PTC 技术帮助公司通过 IoT、AR、3D 打印、数字孪生和工业 4.0 快速释放物理世界与数字世界融合处所创造的价值。
  |

  | Autodesk | 10,000 | 支持计划经理 | 欢迎加入 Autodesk Tandem™ 团队！我们的使命是创建数字孪生技术和解决方案，改变建筑的设计、建造和运营方式。
  |

  | Principal Power | 2,600 | 高级海军建筑师 | 与数字孪生相关的全球性能工程和分析工作，例如：缩比模型测试设计与规划、数字孪生软件与数值模型的验证与确认以及资产性能分析。
