  C 级客户高管展示 IBM 的数字孪生观点，为售前和提案团队提供技术领导力，开发数字孪生和 IoT 领域的 IBM 知识产权和技术卓越性。 |


  前面的职位涵盖了从公共部门到私营部门以及 IBM 等咨询服务公司的大型和中型公司。因此，不同公司正在通过招聘此类技能以及内部培养来应对与数字孪生相关的角色和职责。对于那些可能希望在职业生涯中探索新方向的人来说，这是个好消息。需要知道的是，有时数字孪生相关产品可能会蚕食现有业务和服务，认识到这一点并围绕它规划颠覆非常重要。


  在下一节中，让我们看看可以用来围绕数字孪生构思、开发和验证想法的方法论，目标是加速决策周期和上市时间。


  ### 实验与交互


  新兴技术通常需要大量实验以及从之前迭代中学习的能力。图 3.6 展示了快速实验和迭代的过程，最终形成一组较小的成功案例：


  ![](img/f445915fceb4649a77b6797f1425850b_95_0.png)


  图 3.6 – 数字孪生候选项的快速探索与发现






  ### 敏捷宣言


  敏捷宣言是一份解释敏捷软件开发价值观和原则的文档。它在图 3.7 中以可视化方式展示，首次发布于 2001 年。这些价值观和原则在此处描述：`https://www.visual-paradigm.com/scrum/agile-manifesto-and-agile-principles/`。敏捷方法论为传统的重型瀑布式软件开发方法提供了一种替代方案。敏捷方法论适合数字孪生计划通常需要的快速实验。西门子和埃森哲在数字孪生背景下使用敏捷方法论的情况在此处描述：`https://blogs.sw.siemens.com/thought-leadership/2018/01/26/using-agile-processes-and-digital-twin-technology`。我们建议您观看此西门子博客页面上分享的视频，来自数字孪生峰会（参见
  `https://youtu.be/ETTlTq88oHU`）。


  ![](img/f445915fceb4649a77b6797f1425850b_96_0.png)


  图 3.7 – 敏捷宣言


  图 3.7 总结了敏捷方法论的精神，即较小的迭代带来更大的成果，同时降低风险。开发工作通常分为以下几项：


  - 发布

  - 史诗

  - 用户故事

  - 冲刺

  - 每日站会

  - 测试用例

  - 演示和用户验收

  - 迭代（转向或坚持）


  另一种观察敏捷方法论运作的方式在图 3.8 中以可视化方式展示，按其自然顺序排列：


  ![](img/f445915fceb4649a77b6797f1425850b_97_0.png)


  图 3.8 – Scrum 方法论


  产品待办列表按发布、史史和用户故事来定义。用户故事和史诗在冲刺期间进行处理，冲刺通常可以短至 1-2 周。冲刺涉及其自身的规划，以便将用户故事映射到冲刺待办列表。一旦开发人员完成按故事点计量的分配任务，其工作将接受评审或可能向业务用户进行演示。这导致冲刺的结束，并迭代地处理产品待办列表。


  在我们进一步解释这些术语时，让我们使用一个现实的例子。**西部数据公司（WDC）**在此处描述了他们为期 12 周的数字孪生实验：`https://blog.westerndigital.com/digital-twins-optimize-robot-manufacturing-ops/`。他们称其为快速学习周期，目标是创建**自主机器人车辆（ARV）**。让我们尝试为此计划创建高级别的
  Scrum 产物。


  ### 发布


  发布被定义为可以分发给业务用户或控制组的应用程序。这可以是测试版软件或试点产品，也可以是软件产品的普遍可用版本。在 WDC 案例中，发布将由 ARV 应用程序的某个版本组成，该版本在数字孪生流程的帮助下开发。发布通常按产品路线图上的功能来定义。这些功能可以描述为史诗。


  ### 史诗


  史诗是开发的一个工作单元，逻辑上对应用程序用户社区的相关请求或需求进行分组。史诗帮助团队估算逻辑工作分组所需的时间和精力。史诗应以业务用户能够轻松理解并在周期结束时验证的方式编写。在
  WDC 案例中，史诗可以表述为“使用数字孪生的 ARV 试点”。史诗被分解为用户故事，这些故事随后可以更精确地估算并分配给开发团队成员。


  ### 用户故事


  用户故事，也称为用户故事，是从不同利益相关者的角度描述软件应用程序特性的描述。用户故事旨在成为小的工作单元，但具有具体性。这些利益相关者可能是最终用户、维护最终解决方案的
  IT 人员或项目的业务赞助人。用户故事应具有以下特征：


  - 阐明应用程序的特性对利益相关者的价值。

  - 描述这些特性如何被演示、测试并验证以供验收。

  - 关注“什么”而非特别关注“如何”。这使技术团队能够找出构建应用程序的最佳方式。

  - 易于估算 Scrum 团队所需的工作量，同时降低风险。


  最佳实践是垂直切分用户故事。举个简单的类比，披萨由面团、披萨酱、奶酪和配料组成。如果用户故事只包含面团，用户或测试人员只能单独品尝面团，无法对最终披萨的“验收”提供良好反馈。另一方面，根据“垂直切分”原则，如果用户故事是制作一小片披萨，那么用户可以提供更多有意义的反馈，最终披萨验收的风险将大大降低。虽然这种“垂直切分的用户故事”非常理想，但可能并不总是可行。


  要查看 WDC 史诗的可能用户故事，以下是一些可能的用户故事：


  - 中国上海半导体制造厂（fab）二楼 ARV 移动的数字孪生

  - 半导体制造厂（fab）中**待测设备（DUT）**的等待时间和服务时间分布历史


  这可以作为 WDC 史诗的两个用户故事的起点。这些用户故事可以在一个或多个冲刺中完成。然而，目标是在每个冲刺结束时向利益相关者演示进度。


  ### 冲刺


  冲刺是一个短时间间隔，通常为 1-2 周。冲刺用于完成诸如用户故事等工作。发布通常被分解为多个冲刺。在 WDC 示例中，例如，为期 12 周的练习可以分解为 6
  个为期 2 周的冲刺。随着这些冲刺的进展，可衡量的工作单元根据通常记录的测试用例完成并进行测试。


  ### 每日站会


  每日站会是一种用于跟踪每日进度的敏捷仪式。它可以每天举行一次或两次。如果每天两次，则在工作日的开始和结束时举行。良好的沟通是敏捷方法论成功的关键，而每日站会是同步整个团队的关键部分。通常，每个成员可以讨论以下三项内容：


  - 你昨天或今天做了什么工作（如果站会在一天结束时举行）？

  - 你今天或明天将做什么工作？

  - 你的工作是否有任何障碍？


  当整个团队或大部分团队在同一个办公室工作时，团队在每日站会期间围绕信息辐射器或 Scrum 板聚集。图 3.9 显示了这样的信息辐射器：


