- '## 3 识别第一个数字孪生


  在第 2 章“规划您的数字孪生”中，我们讨论了企业中数字孪生的关键标准及其预期业务成果。我们从不同行业及其生态系统的角度探讨了这一点。我们分析了数字孪生的前提条件，包括组织和文化因素。最后，我们回顾了数字孪生的技术要求。


  在本章中，我们将讨论在广泛公司背景下数字孪生的评估流程。这将使您广泛了解数字孪生对内部和外部机会的相关性。我们将把这与当今公司创建和发布的实际角色和职责联系起来。我们将涵盖以下主题：


  - 评估数字孪生候选项

  - 角色和职责

  - 实验与交互

  - 最终入围者


  简而言之，本章将涵盖确定要构建的第一个数字孪生的过程，以与业务性质和可实现的成果保持一致。这使得第一个数字孪生的识别和评估至关重要。此过程将在此处全面介绍。


  ### 评估数字孪生候选项


  在本节中，我们将识别工业数字孪生的前景，然后评估我们希望推进的那个。此评估必须在您的公司或计划的背景下进行，才能与您相关。我们将在此处针对多种场景进行评估，这应该有助于处理广泛的案例。


  以下是可能评估数字孪生的几种场景：


  - 工业集团

  - 单一行业领域的大型企业

  - 公共部门实体

  - 大型软件公司或公共云提供商

  - 独立软件供应商（ISV）

  - 大型系统集成商（SI）或管理咨询公司

  - 小型/利基服务公司


  让我们现在逐一查看这些场景。


  #### 工业集团


  符合此类别的公司包括通用电气（GE）、西门子、ABB、日立、霍尼韦尔、强生控制、施耐德电气、博世和爱默生电气。这些工业全球公司近年来在公司内部创建了数字能力中心，目标是加速工业数字化转型。一些示例是
  GE Digital 和霍尼韦尔互联企业。我们将查看两种场景：数字组织评估数字孪生候选项，或业务线（LOB）评估。让我们先看看数字组织。


  #### 数字能力中心的数字孪生


  数字能力通常是一个横向 LOB，其目标是为不同的 LOB 以及在某些情况下直接为外部客户服务，目标是开发新市场或新的数字收入流。当数字组织评估数字孪生候选项时，它将考虑以下事项：


  - 哪个 LOB 已为数字孪生识别了一个或多个业务用例？

  - 数字孪生将推动 LOB 的内部效率，还是将由其客户采用？

  - LOB 是否愿意承诺其主题专家（SMEs）与数字组织合作？

  - 数字孪生框架是否可供另一个 LOB 重复使用？

  - 物理资产的数据当前状态如何，例如数据的可用性和所有权？

  - 基于物理或数学的模型当前状态如何，以及这些模型是否需要为物理资产或流程的数字孪生从头开始开发？


  现在我们已列出数字孪生的关键考虑事项，准备好识别候选项了。让我们考虑一个场景，即数字组织正在与航空和电力发电业务合作。航空业务为飞机制造喷气发动机，并为航空公司客户提供服务。电力业务为电力公用事业公司制造发电机。公用事业公司还从制造商处购买长期服务合同。基于这些，数字组织正在评估其第一个数字孪生的三个候选项。这些如下：


  - 与航空 LOB 合作，构建其制造的发动机 E 的数字孪生。

  - 与电力 LOB 合作，构建其制造的燃气发电机 G 的数字孪生。

  - 构建一个与制造商无关的通用发电机数字孪生。由于商用飞机的发动机提供商只有少数几家，通用喷气发动机模型将不太有用。


  现在，让我们在以下表格中比较这三种场景：


  | 标准 | 发动机 E 的数字孪生 | 燃气发电机 G 的数字孪生 | 通用燃气发电机数字孪生 |

  |---|---|---|---|

  | 首个客户/用户 | 是 | 是 | 尚未 |

  | 数字孪生的可重用性 | 低 | 可用于其他发电机 | 高 |

  | 生产力/效率用例 | 是 | 是 | 否 – 仅限外部 |

  | 新的数字收入 | 可能 | 可能 | 是 |

  | 投资 | 中等 | 中等 | 高 |


  前面的表格显示了数字组织如何列出客观标准，以帮助确定数字孪生识别的起点顺序。表格显示，发动机 E 和燃气发电机 G 的数字孪生主要将由 LOB 驱动的内部用例。投资可以通过业务使用数字孪生获得的生产力收益来证明其合理性。但是，当数字孪生的用例仅涉及外部客户时，可能需要更高的初始投资。


  在下一节中，让我们从 LOB 的角度看看类似的场景。


  #### LOB 的数字孪生


  工业集团的 LOB 可能在决定投资数字孪生计划之前，先从自己的视角审视同一场景。在这种情况下，LOB 可能会考虑三个不同的标准：


  - LOB 对数字孪生计划自身的准备情况，它是否与其自身业务战略相辅相成，还是可能成为一种干扰

  - 量化数字孪生所提供的生产力或效率的能力

  - 技术方向


  LOB 将审视其当前业务战略，然后查看数字孪生在哪里是一个良好的匹配。例如，航空和电力发电业务通常会一次性出售物理资产，然后向客户销售长期服务。在这种情况下，LOB
  将投资数字孪生，以帮助改进预测性维护服务。由于这些合同是长期的，引入数字孪生用于预测性维护不太可能改变顶线收入。但是，服务的交付及其利润率可以通过使用数字孪生得到大幅改善。因此，这将与
  LOB 的业务战略非常契合。关于飞机起落架数字孪生的类似案例研究可在此处查看：https://www.ge.com/digital/customers/predictive-
  insights-aid-aircraft-landing-gear-performance。该数字孪生原型由 GE 和 Infosys 构建，本书的一位作者（Nath）参与了该项目。






  While we see that qualitatively speaking, the investment in the Digital Twin makes
  sense for the aviation LOB, it may further have to build the business case quantitatively.
  In order to do so, the LOB would have to estimate with sufficient confidence the
  improvement in the service contract margins due to proper use of the Digital Twin
  versus additional investments. This business case has to make sense in the long
  term, but should be measurable in the short to mid-term as well, to ensure they
  are moving in the right direction.


  Finally, the LOB has to look at the technology considerations. This may include
  the software platform as well as the infrastructure for data and connectivity of
  the physical asset. The LOB would have to work with the asset owner or operator
  to obtain the data for the purposes of the Digital Twin. If the LOB decides to work
  with the digital group, or its conglomerate, then they need to make sure the digital
  platform can handle the data and modeling needs of their asset. For instance, while
  the gas generators, as shown in Figure 3.1, work in a fixed location, such as in
  a power plant, it is easy to connect them to a high-speed network for data collection,
  as long as the utility customer is on board with that:


