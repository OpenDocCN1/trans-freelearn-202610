  \n### 创建应用程序以在代码中更新数字孪生原型\n\n**Azure Digital Twins (ADT)** 是一个面向开发人员的 **平台即服务 (PaaS)**\
  \ 解决方案，旨在创建数字孪生解决方案。为了本书的目的，我们将介绍两种典型的开发角色。第一种是软件开发人员，他具备必要的编码技能，可以使用 ADT 的 API\
  \ 和 SDK 开发解决方案。在撰写本书时，ADT API 和 SDK 可以在 .NET、Java、JavaScript、Python 和 Go 中访问。\n\n\
  第二种角色是主题专家，例如风电场的可靠性和维护工程师。主题专家具备技术技能，但通常不具备从头开始创建应用程序的正式软件开发技能。\n\n本节的其余部分将重点介绍创建应用程序以更新风力涡轮机模型的正式软件开发方法。\n\
