  您可以在此处查看 XMPro 平台的示例视图：


  ![](img/f445915fceb4649a77b6797f1425850b_146_0.png)


  图 5.6 – XMPro 示例数字孪生（来源：XMPro Inc.）


  XMPro 专注于使资产密集型行业（如采矿、石油和天然气、石化和制造业）中的非程序员能够使用，也用于供应链解决方案。


  在上一节中，我们研究了不同基于云的 IoT 和数字孪生解决方案的功能。这种比较研究有助于企业在进行数字孪生之旅时的决策过程。在本书的背景下，我们将使用 Microsoft
  ADT 来详细介绍该过程。此决定基于几个因素，概述如下：


  - ADT 于 2020 年 11 月由 Microsoft Azure 公开发布，因此可以轻松用于开发、测试或生产部署。

  - 在我们构建风力涡轮机数字孪生的全球集团背景下，CIO 已经为其企业应用程序选择了 Microsoft Azure。

  - 该公司决定首先探索 Azure 上所有可用的数字孪生选项。

  - 该公司还计划将风力涡轮机的数字孪生功能提供给其客户，例如风电场的所有者和运营商。根据其市场调研，能源行业没有首选的公有云平台。


  在下一节中，我们将介绍使用 Microsoft ADT 构建风力涡轮机数字孪生的方法。


  # 配置和设置


  在我们可以在 Microsoft ADT 中配置第一个数字孪生之前，必须在 Microsoft Azure 上设置云基础架构和帐户。Microsoft 为 Azure
  管理员提供了详细的设置说明，但我们将从希望设置免费帐户以构建第一个数字孪生原型的非企业用户的角度出发。ADT 文档位于 `http://bit.ly/1dt-azuredocs`。






  第一步是创建一个免费的 Azure 帐户，该帐户将托管你的 ADT 服务以及为你的第一个数字孪生所需的任何其他 IoT 和分析服务。请参阅以下屏幕截图，了解如何执行此操作的概述：


  ![](img/f445915fceb4649a77b6797f1425850b_148_0.png)


  ![](img/f445915fceb4649a77b6797f1425850b_148_1.png)


  图 5.7 – Microsoft Azure 门户 UI


  创建帐户后，你将被引导至 Azure 服务门户。这是所有 Azure 服务（包括 ADT、Azure 数据库、IoT 服务以及 Microsoft 在其 Azure
  产品系列中提供的所有其他产品）的中央管理环境。


  ADT 是一种 PaaS 解决方案，提供创建和使用数字孪生所需的基础设施。它是面向开发人员编写数字孪生代码的开发环境。它不是面向最终用户的应用程序，也没有供业务用户配置数字孪生的
  UI。执行这些操作需要你的 Azure 帐户中的其他 Azure 服务。


  ADT 可以通过基于 Web 的 Azure 门户或通过 **Azure 命令行界面 (Azure CLI)** 在命令行中进行配置。这两种方法均在官方 Microsoft
