  总的来说，我们注意到飞机等现实世界资产本质上非常复杂，并由小零件组成。同样，如果我们看光谱的另一端，例如航空公司的机队，它可能不仅包含不同的飞机，还包含不同的型号和制造商。此外，航空公司可能不仅拥有飞机，还拥有其他资产，例如除冰机、行李车、地面电源装置、登机桥等。从航空公司的角度来看，整个网络是如此多样资产的复合体。


  从航空公司的角度来看，其整个航空公司网络的数字孪生体将是一个复合数字孪生体，由其主要枢纽、主要航线、机队和其他关键资产的运营组成。


  现在，回到发电示例，我们最初从风力涡轮机和风电场的数字孪生体开始。接下来，我们将其扩展到可再生能源发电的不同数字孪生体。要继续，一家主要公用事业公司的整个发电复合体将包括可再生能源和非可再生能源的数字孪生体。接下来，公用事业公司将需要查看传输、分配以及消费者级资产（如智能电表）的数字孪生体。


  接下来，让我们看看水力发电的数字孪生体。


  ### 水力发电的数字孪生体


  美国能源部（DOE）有一个专注于水力发电技术的办公室。该 DOE 办公室正在致力于水力发电数字孪生体框架，目标是利用虚拟平台加速创新。有关更多信息，请参阅 https://www.pnnl.gov/projects/digital-twins-hydropower。


  水力发电厂的平均使用寿命约为 50 年。水力发电数字孪生体模拟发电、传输和分配系统。水力发电数字孪生体的主要应用包括以下内容：


  - 运营和维护 – 优化水力发电厂的维护，目标是提高运行时间，从而增加发电量。

  - 网络安全 – 检测任何入侵并保护基础设施。2021 年 6 月，美国东海岸的殖民管道勒索软件攻击提高了人们对保护能源基础设施的意识。有关更多信息，请参阅 https://www.cnn.com/2021/06/07/politics/colonial-pipeline-ransomware-recovered/index.html。

  - 投资和市场规划 – 帮助做出初始投资决策、扩张决策和 ROI 计算。


  根据通用电气（GE）的一篇文章，2017 年，水力发电（见图 8.10）是一种可再生能源，可按需提供大量电力，因为我们缺乏用于能源存储的电网级电池技术。当风力涡轮机受低风速或多云天气影响，以及一天中的时间影响太阳能时，水力发电数字孪生体可以帮助弥补差距。有关更多信息，请参阅
  https://www.ge.com/news/reports/dam-powerful-ge-connected-hydropower-internet。






  Figure 8.10 – 水力发电所产生的可再生能源


  Note

  图片来源：https://no.wikipedia.org/wiki/Energi_i_Afghanistan


  水力发电数字孪生可帮助进行类似的情景规划，这些规划可能影响发电量，例如降雨量以及水坝和水库中的水位。


  为了了解利用水力发电的潜在发电规模，让我们来看看加拿大魁北克省。由于该省湖泊和河流资源丰富，水力发电可以满足魁北克省700万人口高达95%的电力需求。水力发电的装机容量约为46吉瓦。有关更多信息，请参阅
  https://www.cer-rec.gc.ca/en/data-analysis/energy-markets/provincial-territorial-energy-profiles/provincial-territorial-energy-profiles-quebec.html。GE
  Ecomagination前全球执行董事Deb Frodl表示，由于停机时间减少，数字化水电站的运营可靠性提高了1%或更多。在全球范围内推广，这相当于每小时约413吉瓦的增量水力发电量。与风力发电相比，这相当于约700台风力涡轮机的风电场所产生的电力。


  水电站通常使用Francis水轮机，这是一种反应式水轮机。当水流经水轮机时，其压力会发生变化，从而释放能量。有关更多信息，请参阅 https://www.sciencedirect.com/topics/engineering/francis-turbines。此类水力发电水轮机的简化视图如图8.11所示。


  水轮机位于高压水源和低压水出口之间，通常位于水坝底部。这使我们能够利用水系统动力学和机械扭矩到水轮机轴的方程，创建水力发电的基于物理的初始数字孪生。要了解此类基于物理的计算的更多信息，请参阅此处的研究论文：https://www.researchgate.net/publication/226204151_Torque_model_of_hydro_turbine_with_inner_energy_loss_characteristics。


  Figure 8.11 – 水力发电水轮机的简化视图


  Note

  图片来源：https://en.wikipedia.org/wiki/Water_turbine


  在前面的章节中，我们为着手开展水力发电数字孪生提供了功能和技术基础。在下一节中，我们将重点介绍太阳能农场的数字孪生。


  ### 太阳能农场的数字孪生


  我们经常在家庭屋顶上看到太阳能电池板，如图8.12所示。美国加利福尼亚州已推出加州太阳能强制令，要求从2020年1月1日起，所有不超过四层的独户和多户住宅都必须安装太阳能电池板。该强制令旨在将温室气体排放量减少相当于让115,000辆燃油汽车停驶的水平。该强制令后来有所放宽，允许建筑开发商将屋顶太阳能电池板与场外太阳能发电厂相结合。


  在本节中，我们将主要关注商业太阳能发电厂。2020年，太阳能占美国加利福尼亚州能源需求的15.4%。根据加州能源委员会的数据，它通过太阳能光伏（PV）和太阳能热能发电厂产生了约30吉瓦时（GWh）的能源。图8.13展示了一个典型的太阳能光伏电站。在下一节中，我们将探讨构建太阳能发电厂数字孪生的注意事项。


  Gemini太阳能项目，拥有690兆瓦的集成太阳能光伏和电池储能设施，将成为美国最大且全球最大的项目之一。它将位于美国内华达州拉斯维加斯附近的美国联邦政府土地上。有关更多信息，请参阅
  https://www.nsenergybusiness.com/projects/gemini-solar-project/。它将耗资约10亿美元，预计将于2023年完工。


  Figure 8.13 – 太阳能光伏电站


  太阳能发电厂（如图8.13所示）通过逆变器和变压器连接到电网，如图8.14所示。风力发电场和水电站也是如此，它们都将为电网提供可再生能源，最大限度地减少使用化石燃料发电的需求。


  Figure 8.14 – 太阳能发电厂与电网的连接


  本书作者之一Nath曾亲身参与工业互联网联盟（IIC）下的一项早期倡议，构建太阳能发电厂数字孪生作为测试平台。有关更多信息，请参阅 https://www.iiconsortium.org/press-room/11-08-17.htm。


  为了确定太阳能发电厂的理想位置，可以使用太阳辐照度信息。有关更多信息，请参阅 https://www.nrel.gov/gis/assets/images/nsrdb-v3-ghi-2018-01.jpg。


  辐照度是衡量在给定时间间隔内到达特定区域的太阳辐射能量的指标。它通常以瓦特/平方米（W/m²）为单位进行测量。数字孪生也用于基础设施建设的可行性研究，例如四名电气工程专业学生正在进行的这项智能电网数字孪生项目。有关更多信息，请参阅
  https://www.unb.ca/alumni/magazine/2021-spring-summer/solar-energy.html。


  太阳能发电厂的数字孪生（重点关注预测性维护和运营优化）将包括主要组件（见图8.15），如下所示：


  - 太阳能光伏电池板 – 商用级太阳能光伏电池板的尺寸约为78英寸乘39英寸（约2米×1米），约有72个太阳能电池。重量约为40磅（18千克），成本约为250,000美元。

  - 电池板串 – 一个200兆瓦的太阳能发电厂将拥有约100,000块电池板，排列成2,000串。理想情况下，每块电池板和每串电池板的数字孪生都需要作为“孪生体的孪生体”进行维护。

  - 串式汇流箱（SCB） – 这些用于将多个太阳能电池板或电池板串组合在一起。

  - 逆变器 – 在连接到电网之前，将太阳能电池板产生的直流电（DC）转换为交流电（AC）。


  考虑太阳能发电厂主要功能模块的数字孪生，可使太阳能发电厂的运营成本降低多达4%。我们建议阅读题为《Performance evaluation of 10 MW
  grid connected solar photovoltaic》的研究论文，以了解运营效率的基本原理和基本功率转换因素。该研究论文可在此处找到：https://www.sciencedirect.com/science/article/pii/S2352484715000311


  Figure 8.15 – 太阳能发电厂框图


  太阳能发电厂的数字孪生可以帮助决定何时更换太阳能光伏电池板以增加能源产出。同样，一次数字孪生的试点部署能够提前一周检测出高达83%的逆变器故障。这种故障模式覆盖率的提高和提前量的增加是数字孪生解决方案的关键整体性能指标。太阳能发电厂数字孪生解决方案的使用正在推动行业从“安装后不管”的行为转向对能源基础设施的更积极管理。低效可能由多种原因造成，例如：


  - 太阳能光伏的设计和安装存在缺陷。

  - 串联的光伏组件与并联的串式模块不匹配，导致系统性能降低。

  - 随着时间的推移，太阳能光伏电池板上会积聚污垢，加上缺乏降雨，尤其是安装角度不正确时。

  - 更换周期不匹配，因为不同组件的预期寿命不同，例如逆变器为5-10年，太阳能光伏电池板为20-25年。






  ### 太阳能光伏与风力发电混合系统


  我们已借助太阳能发电厂的数字孪生体，重点介绍了一些需要监控和修复的实际问题。更多信息，请参阅 https://www.mdpi.com/1996-1073/13/6/1398/htm。


  太阳能发电厂的发电水平取决于日照时长，冬季日照时间会大幅缩短。同样，风电场在夏季可能会经历比冬季更低的风速，具体取决于其地理位置。这为开发混合发电厂提供了机遇。更多信息，请参阅
  https://www.energy.gov/energysaver/hybrid-wind-and-solar-electric-systems。图 8.16
  展示了太阳能光伏与风力发电机的此类混合系统。此类混合动力系统目前正在小规模出现，未来可能会出现在商业规模上。混合发电厂的数字孪生体将需要新的跨领域专业水平。


  ![](img/f445915fceb4649a77b6797f1425850b_257_0.png)


  图 8.16 – 混合发电厂


  > **注意**

  > 图片来源：https://www.energy.gov/energysaver/hybrid-wind-and-solar-electric-systems


  在前面的章节中，我们探讨了主要的可再生能源。我们研究了每种可再生能源的数字孪生体的注意事项。这些信息将有助于从以下角度规划复合数字孪生体：


  - 拥有基于可再生能源和非可再生能源发电的大型公用事业公司，以及/或

  - 能源行业的工业制造公司，为多种这些能源制造发电设备


  接下来，我们将探讨数字孪生体的作用，这是由于与风力发电机和太阳能发电厂相关的新创新。


  ### 可再生能源发电的新创新


  让我们在风能背景下讨论风能捕获技术。风能捕获具有降低**平准化度电成本（LCOE）**的巨大潜力，LCOE 是衡量能源发电设施全生命周期成本除以总发电量的指标。图
  8.17 展示了海上风能的风能捕获设计。它是一种浮动安装。这项技术占用空间更小，产生的能量可比传统海上风力涡轮机多出五倍。更多信息，请参阅 https://windcatching.com/。


  ![](img/f445915fceb4649a77b6797f1425850b_258_0.png)


  图 8.17 – 海上安装的风能捕获设计


  在风能捕获中，预计发电量将随风速呈指数增长。传统风力涡轮机在风速超过每秒约 12 米时，会通过改变叶片桨距来限制能量输出，以减少磨损。因此，风能捕获装置可以从相同的覆盖面积中产生几倍的能量。当此类新技术推广时，数字孪生体的作用会增加，因为我们缺乏大量历史数据来进行预测性维护和优化能源发电。基于风能捕获装置的产品设计和实验室测试数据的物理模型，可以帮助从第一天起部署风能捕获装置的数字孪生体。这些数字孪生体将提供关键信息，帮助随着风能捕获装置群随时间成熟而增强对其的理解。其预期寿命为
  50 年，远长于传统风力涡轮机。


  同样，2021 年 7 月，新加坡启动了一个大型浮动太阳能农场。更多信息，请参阅 https://www.scmp.com/video/asia/3141298/singapore-unveils-one-worlds-biggest-floating-solar-panel-farms。它拥有
  122,000 块太阳能电池板，面积约为 45 个足球场。这个浮动太阳能发电厂将为五个水处理厂供电。图 8.18 展示了浮动太阳能发电厂的概念。由于水体冷却以及附近建筑物没有阴影，此类浮动太阳能发电厂效率很高。同样，此类新一代资产的数字孪生体将在高效管理中发挥重要作用，因为我们开始充分了解这些新资产。


  ![](img/f445915fceb4649a77b6797f1425850b_259_0.png)


  此照片由 KYOCERA CORP 提供，根据 CC BY 授权。


  ### 改进与后续步骤


  在此，我们将从采用并推出此类计划的公司角度，对数字孪生体计划进行整体审视。我们在图 8.5 中看到了风电场数字孪生体解决方案的高级别推出。接下来，让我们在图 8.19
  中查看增强且更详细的视图。从左到右的主要模块如下：


  - 供应链网络 – 这些是供应链生态系统的外部网络，由供应商、分销商和物流提供商组成。考虑到 COVID-19 大流行期间全球供应链的中断，近期该领域非常适合供应链和物流数字孪生体。

  - 企业系统 – 这些包括企业中的信息技术（IT）系统，例如 Oracle Enterprise Resource Planning (ERP)、Salesforce.com
  作为客户关系管理 (CRM)，或制造执行系统 (MES)。

  - 用于经济、天气和市场数据的外部系统 – 这些是可靠的外部数据源，可由其他系统订阅和消费以做出决策。

  - 业务应用程序 – 这些通常是新兴的行业导向型应用程序和数字平台群组，将帮助推动下一波工业数字化转型。此类应用程序通常位于数字孪生体和 IoT 平台之上，提供业务洞察。它们可能位于同一公有云或同一供应商技术中，也可能不位于其中。例如，Oracle
  的 IoT Intelligent Applications（https://www.oracle.com/internet-of-things/）可以连接到基于
  Azure 数字孪生体的解决方案。其他示例包括 GE 的资产性能管理 (APM) 或更专业的能源交易咨询解决方案。

  - 数字孪生体和 IoT 平台 – 这些是数字孪生体解决方案的构建模块，并提供与发电源（例如风电场中的风力涡轮机）的连接。随着更多发电源的引入，复合数字孪生体将在此部署。

  - 现场服务管理 (FSM) – 工业资产密集型行业，如公用事业公司或风力涡轮机制造商，通常管理着庞大的现场服务人员队伍。FSM 应用程序提供了一种高效的方式来管理此类人员的运营和维护活动。FSM
  人员的数字孪生体是未来的机遇领域。

  - 发电源 – 这是发电厂和系统中实际发电资产的集合，包括便于连接和数据采集的边缘系统、监控控制和数据访问系统。

  - 电网 – 所有商业级发电资产都连接到电网，电网管理电力的传输和分配。


  至此，我们已总结了企业级数字孪生体解决方案推出中涉及的主要系统：


  ![](img/f445915fceb4649a77b6797f1425850b_261_0.png)


  图 8.19 – 数字孪生体解决方案部署的企业版图


  在本最后一节中，我们将探讨我们推荐的组织结构，以确保此类数字孪生体相关计划在大型企业中取得成功。


  ### 数字孪生体卓越中心


  **卓越中心（CoE）**通常是一个共享设施，拥有一支专门团队，致力于在业务优先领域开发、收集和推广最佳实践。通用电气（GE）于 2012 年创建了一个软件 CoE，专注于工业互联网。更多信息，请参阅
  https://hbr.org/2015/01/building-a-software-start-up-inside-ge。此软件 CoE 后来成为 GE Digital。本书的作者之一
  Nath，曾于 2013 年至 2018 年期间在该 GE 软件 CoE 和 GE Digital 担任员工。GE Digital 已成为 IIoT 和数字孪生体技术的先驱之一。GE
  Digital 支持 GE Renewables 作为其业务线之一。GE Renewables 是世界上最大的风力涡轮机制造商之一。


  CoE 在私营部门（如大型全球企业）和公共部门（如明尼苏达州能源 CoE）中开始变得流行。更多信息，请参阅 https://www.energycareersminnesota.org/。另一个示例是
  Equinor 的数字 CoE，其活动范围也包括数字孪生体。更多信息，请参阅 https://www.equinor.com/en/magazine/statoil-2030---putting-on-digital-bionic-boots.html。这里描述了一些构建旨在推动数字化转型的
  CoE 的策略：https://techbeacon.com/enterprise-it/why-you-need-digital-transformation-center-excellence。


  我们在此总结这些策略：


  - 在合适的数字领导者下，组建具备技术与业务知识的正确团队。

  - 提供清晰的自上而下章程和运营指南。

  - 提供适当的技术和业务培训，同时强力关注创新文化。

  - 设立治理并建立衡量机制，同时牢记初创公司式的创新和执行自由。


  我们还推荐阅读 Packt 出版于 2020 年的书籍《工业数字化转型》。请查看本章的推荐阅读清单。由于数字孪生体是一项新兴技术，强烈建议考虑建立一个能够宣传数字孪生体计划并确保投资带来业务效益的
  CoE。对于公用事业公司，数字孪生体解决方案将提升整体生产力和效率；而对于工业制造公司，数字孪生体解决方案不仅可以推动内部生产力和效率，还可以通过向公用事业公司和其他公司商业销售此解决方案来创造新的数字收入来源。






  ### 摘要


  在本书的最后一章中，我们从可能推出此类计划的企业角度，探讨了部署数字孪生解决方案的优势。我们探讨了如何从单个风力涡轮机的数字孪生扩展到风电场，再扩展到不同的可再生能源。我们探讨了孪生体的孪生体，以及如何规划和部署复合数字孪生。总体而言，我们探讨了如何从初始试点部署阶段增强数字孪生解决方案。


  我们坚信，本书为您构建第一个工业资产的数字孪生并使其投入生产提供了坚实的技术和功能基础。这项技能将在未来几年成为工业数字化转型的游戏规则改变者。感谢您与我们一起踏上构建第一个数字孪生的旅程，祝您事业成功。


  ### 问题


  - 1. 什么是孪生体的孪生体？

  - 2. 数字孪生解决方案的大爆炸式推出与分阶段推出有什么区别？

