  \ 中创建数字孪生用例 UI\n\n图 6.24 显示了一个带有用于状态监测的实时遥测的风力涡轮机数字孪生示例。该平台还允许根据实时遥测数据创建基于分析的建议。建议的分析可以基于状态监测遥测的工程计算、接收实时遥测输入的机器学习模型，或为特定应用程序配置的业务规则。\n\
