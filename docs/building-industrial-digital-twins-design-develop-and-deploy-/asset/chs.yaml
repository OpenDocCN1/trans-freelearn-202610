  ### XMPro


  XMPro 是一个基于 **业务流程管理 (BPM)** 的数字孪生平台，如 _Chapter 4, Getting Started with Our First
  Digital Twin_ 中所述。XMPro 构建于 Microsoft .NET Core 平台之上，可以部署在边缘、云端，或两者的混合组合中。请参见图 5.6，了解使用
  XMPro 平台的示例。


  XMPro 主要面向工程师、科学家、地质学家和其他更喜欢低代码应用程序开发环境而非传统 **集成开发环境 (IDE)**（例如 Microsoft Visual
  Studio）的 **主题专家 (SMEs)**。在撰写本书时，XMPro 包含以下模块：


  - **XMPro Data Stream Designer** — 这是一个低代码集成和编排环境，用于将实时 IoT 数据与分析和操作相连接。数据流是集成和服务代理的集合，例如监听器、上下文提供程序、转换、函数、**人工智能
  (AI)** 和 **机器学习 (ML)** 服务以及操作代理。

  - **XMPro App Designer** — 这是一个低代码可视化编程 UI，用于创建数字孪生应用程序。App Designer 还用于配置 XMPro
