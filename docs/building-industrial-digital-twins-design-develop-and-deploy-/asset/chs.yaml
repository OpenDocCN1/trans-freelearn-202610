  \n![](img/f445915fceb4649a77b6797f1425850b_190_0.png)\n\n图 6.17 – 创建 Power BI 仪表板以查看您的数字孪生\n\
  \n图 6.17 显示了一种在 Power BI 仪表板上显示 ADT 信息的可能方法。它遵循与本 Microsoft 教程中描述的类似开发方法，该教程介绍如何从\
  \ Azure Digital Twins 更新地图服务：http://bit.ly/idt-connectmaps。本书 GitHub 存储库中提供的示例代码包括一个\
  \ Azure 函数，用于从事件网格获取 ADT 并更新 Power BI 仪表板文件，如图 6.18 所示。\n\n数字孪生应用程序与 IoT 应用程序的区别在于，Power\
  \ BI 应用程序将从数字孪生实例接收更新，而不是从不同遥测点的单个传感器接收更新。它在状态和遥测更新与业务应用程序之间充当代理。您可以从单个事件更新服务创建不同的\
  \ Power BI 仪表板。您还可以创建多个应用程序，这些应用程序从 ADT 服务接收更新，而无需每次都从单个传感器读取。\n\nADT 服务也与传统关系数据库不同，因为它在每次更新时不会创建新的事务数据行。它会用新的状态值覆盖先前的实例状态值。实例始终是特定时间点的数字孪生实例状态的快照。它需要额外的编程来持久化数据，例如在\
  \ **时间序列数据库 (TSDB)**（如 Microsoft Time Series Insights 或 InfluxDB）中持久化遥测时间序列数据。\n\
  \n_图 6.18_ 中显示的 Power BI 仪表板用于监控风电场涡轮机的运行。它还用于根据遥测读数中的涡轮机状况规划维护服务。\n\n![](img/f445915fceb4649a77b6797f1425850b_191_0.png)\n\
  \n图 6.18 – 我们风电场的 Power BI 仪表板示例\n\n我们现在已创建一个基于 Azure 的数字孪生作为我们的第一个数字孪生原型应用程序。它是一个自定义编码的应用程序，可以创建新的\
