  \n### 阶段 0 – 前期项目阶段\n\n如前表所示，前期项目阶段指的是需要完成的准备工作，尽管这不一定属于数字孪生体项目的一部分。可靠性工程师、运营经理和其他\
  \ LoB 用户通常会进行业务绩效分析，以确定未来效率和效果改进的关注领域。使用精益第一性原理的不良资产分析是可靠性工程师常用的典型方法，如本预测性维护示例所示。不良资产分析是对工厂或车间运营资产的正式审查流程。它使用\
  \ **帕累托原则**，在设备故障的情况下，通常 20% 的设备导致 80% 的故障。帕累托原则通常被称为 **80/20 法则**，并广泛应用于许多行业和应用中。不良资产分析的目标是找出导致最多停机时间或生产损失的\
  \ 20% 设备并对其进行排名。不良资产分析中使用的一种排名机制是将相同的帕累托原则应用于这 20%。它找出导致原始 80% 故障中 80% 的 20%。这意味着我们现在有原始评估的\
  \ 4%，它导致了 64% 的故障或停机时间。\n\nLoB 职能分析整个生产价值链，并识别潜在的系统瓶颈和特定资产或系统，这些资产或系统被称为 _不良资产_。如前所述，这些不良资产通常导致大部分设备故障事件。按吞吐量或生产损失、停机时间、维修成本和安全性等关键绩效指标对不良资产进行排名是常见的做法。对于制造生产线，主要的不良资产可能是输送系统，排名第二的不良资产可能是机器人装配臂，第三可能是生产线末端的包装站。\n\
  \n下一步，如下图所示，是确定这些排名靠前的不良资产的主要故障模式。**正式失效模式与影响关键性分析（FMECA）** 是可靠性工程中一项成熟的实践。然而，对于我们的首个数字孪生体，我们不需要进行全面的\
  \ FMECA。基于历史维护和运营数据识别关键故障模式仍然至关重要，因为这确保了原型数字孪生体将在短期项目验证阶段展示价值：\n\n![](img/f445915fceb4649a77b6797f1425850b_108_0.png)\n\
  \n图 4.2 – 预测性维护数字孪生体的项目规划框架\n\n一旦我们了解主要故障模式，就可以识别这些故障模式的根本原因。这也是可靠性工程中一项成熟的实践。然而，为了本书，我们将简单地识别最主要故障模式的主要根本原因。由于我们经常看到物理设备之间存在因果关系，一些根本原因可能导致多个故障模式。\n\
  \n下图显示，**根本原因 2** 可能导致 **故障模式 1** 和 **故障模式 3**。业务影响和不良资产故障模式的性质将决定分析的级别，但就本示例而言，我们将假设\
  \ LoB 职能将为此提供必要的输入：\n\n![](img/f445915fceb4649a77b6797f1425850b_109_0.png)\n\n图\
  \ 4.3 – 根本原因和故障模式的关系\n\n理解根本原因的目标是确定我们是否可以识别任何领先指标，这些指标可以通过 IoT 和传感器设备的实时数据和分析在数字孪生体中得到支持。这些领先指标可以基于原始传感器数据、物理模型以及数学或统计模型，如《第\
  \ 1 章，数字孪生体简介》中所述。\n\n这些实时指标可以从 **物联网（IoT）**、**运营技术（OT）** 和企业业务系统（如 **企业资产管理（EAM）**、**企业资源计划（ERP）**\
  \ 和 **制造执行系统（MES）** 解决方案）中建立。\n\n这种对多个不同系统的集成要求引入了 _图 4.1_ 中给出的 IT 和开发职责。这是建立可用于首个数字孪生体，并可根据此初始项目的结果和经验在未来进行调整的高级参考架构的理想机会。\n\
  \n还建议在这些早期阶段启动围绕安全和可信度的治理流程，并为未来项目建立纪律。数字孪生体引入了几种新的安全漏洞和潜在攻击面。IT 职能可以利用初始数字孪生体项目来评估影响并识别风险缓解策略。\n\
  \n### 阶段 1 – 项目范围界定阶段\n\n在项目范围界定阶段，业务和运营团队识别并确认高优先级不良资产资产的领先指标是否有关联的数据源。仍然重要的是从故障模式和根本原因开始，而不是从可用的数据源开始。您的首个数字孪生体解决方案应专注于快速交付价值，因此应以问题为导向。\n\
  \n业务和运营团队应完成业务就绪度评估，如《第 1 章，数字孪生体简介》中图 1.10 所述。根据技术就绪度和业务影响优先排序用例，以识别首个数字孪生体。业务影响措施也与我们在《第\
  \ 1 章，数字孪生体简介》中图 1.9 识别的风险价值指标相关。我们在《第 1 章，数字孪生体简介》中图 1.10 提供的评估中的潜在业务影响措施包括安全性、停机时间、吞吐量、质量和成本。技术就绪度评估涵盖数据可用性、自动化和\
  \ IT 系统的成熟度、分析、拟议的部署环境以及项目管理成熟度水平。\n\n此阶段还包括定义首个数字孪生体的风险价值和关键成功标准。它回答了一个问题：首个数字孪生体的成功是什么样子？\n\
  \n对于 IT 团队，此阶段提供了评估业务团队识别的领先指标的数据可用性和数据质量的机会。根据领先分析公司的研究，基于 IoT 的项目中，数据集成、访问、清理和数据处理可能会消耗超过\
  \ 50% 的项目资源和成本。项目范围界定阶段为 IT 团队提供了评估数据集成对数字孪生体项目关键成功指标影响的机会。\n\n这也是我们准备数字孪生体平台并在必要的治理护栏内配置所需数据集成连接器的阶段。提前准备这些内容可以降低创建依赖于数据访问且可能因技术原因无法集成的数字孪生体的风险。\n\
  \n\n\n\n\nDuring this phase, a final key point is to ensure that business users\
  \ and IT are aligned on\nthe **Critical Success Factors (CSFs)** for the first Digital\
  \ Twin project. A common and\nshared vision around the specific measurable outcomes\
  \ or CSFs for the first Digital Twin\nwill ensure a results-based focus for the\
  \ project.\n\nThe next phase focuses on developing and delivering the Digital Twin\
  \ while preparing\nthe organization to adapt to operational business processes and\
  \ the way people work.\n\n### Phase 2 – the project design and development phase\n\
  \nDigitally enabled projects typically require a change in how people go about routine\
  \ tasks.\nDigital Twins, as well as the operational, situational awareness, and\
  \ decision support that\nthey provide, change the business processes that people\
  \ traditionally follow. We will cover\nthis topic in more depth later in this chapter.\n\
  \nTo ensure that the first Digital Twin is a success, it is essential to identify\
  \ the team among\nbusiness users that's willing to embrace technology-based solutions\
  \ to address business\nchallenges. Operational users in industrial organizations\
  \ are typically more conservative\nand skeptical of new or emerging technologies.\
  \ This is also the phase during the project\nwhere a decision is made on what kind\
  \ of Digital Twin will be built and how it will\nintegrate with design, manufacturing,\
  \ maintenance, and operational models. Furthermore,\nthe design and development\
  \ phase provides the engineering team with the opportunity to\nadd additional sensors\
  \ and data collection points for testing and certification. Substantial\nplanning\
  \ is involved in the placement and data collection plans for sensor data. Business\n\
  users bring about the required engineering knowledge and expertise to help plan\
  \ how to\nsustain the business value of twins. Selecting the right team will improve\
  \ your chances\nof a successful first Digital Twin project.\n\nThe IT team will\
  \ develop or configure the Digital Twin during the design and\ndevelopment phase.\
  \ This includes integrating real-time input and other metadata and\nintegration\
  \ to backend business systems. We recommend an agile development approach,\nas described\
  \ in _Chapter 3, Identifying the First Digital Twin_, using all the artifacts and\n\
  processes shown in Figure 3.8.\n\nThe verification steps during the design and development\
  \ phase provide the necessary\ngovernance to ensure the Digital Twin is designed\
  \ and engineered correctly.\n\nWe also recommend that the Digital Twin is configured\
  \ so that it can automatically\ntrack use case results continuously. The initial\
  \ Digital Twin project is typically used to\ndemonstrate the value based on the\
  \ CSFs. Automating the reporting on these assists\nwith value tracking during the\
  \ project validation phase.\n\n### Phase 3 – the project validation phase\n\nThe\
  \ project validation phase focuses on measuring the key success criteria set out\
  \ during\nthe project scope and validating the result of using the Digital Twin.\
  \ The business team\nusers need to ensure that the business process changes, as\
  \ described in phase 2, are\nimplemented during the validation phase.\n\nDuring\
  \ the business validation process, both the business and IT teams can use continuous\n\
  CSF monitoring results to improve and fine-tune the Digital Twin's capabilities.\
  \ This phase\nwill also allow you to understand the support requirements and other\
  \ business capabilities\nrequired to maintain and scale out Digital Twins in the\
  \ organization.\n\nThis phase's outcome is to decide if the Digital Twin has delivered\
  \ on the initial CSFs and\nif it is to be continued in production, or if it is the\
  \ end of the initial assessment. If we have\nfollowed the preceding steps, the likelihood\
  \ of success is exceptionally high, and this will\noften lead to scaling out the\
  \ Digital Twin in full-scale production applications.\n\n### Phase 4 – the project\
  \ scaling phase\n\nNew requirements and opportunities often emerge during the project\
  \ validation phase\nas business users see the benefit of the improved decision support\
  \ capability. Scaling out\ncould mean providing access to additional users or adding\
  \ other capabilities and features\nto address these additional requirements.\n\n\
  The project planning framework used in this example is specific to a predictive\
  \ maintenance\ncase. Still, the principle applies to any Digital Twin product, and\
  \ we recommend that you\noutline the planning framework for your project in a similar\
  \ way. The single-page summary\nimproves internal communication and provides a clear\
  \ understanding of the expectations\nof the different phases.\n\nThe project planning\
  \ framework is supported by a solution framework that explains the\nbusiness value\
  \ and scope to business executives who sponsor the Digital Twin project.\n\n###\
  \ Solution planning framework\n\nThe proposed solution planning framework has its\
  \ roots in the **Lean Startup** approach,\nwhich was introduced by **Steve Blank**\
  \ and popularized by **Eric Ries** (`https://hbr.\norg/2013/05/why-the-lean-start-up-changes-everything`).\
  \ The Lean\nDigital Twin is a methodology developed by **XMPro** (`https://bit.ly/idt-ldt`)\n\
  and is based on the Lean Startup framework, which focuses on achieving the product/\n\
  market fit of a new product before scaling out.\n\nThe **Lean Digital Twin** is\
  \ an ideal approach when developing your first Digital Twin since the application\
  \ and use of Digital Twins in organizations is not well defined or understood yet:\n\
  \nFigure 4.4 – Moving from the Problem/Solution to the Digital Twin/Business Fit\n\
  \nThe first part of the lean Digital Twin approach focuses on the Problem/Solution\
  \ Fit, and the best way to describe this in a simple and easy-to-understand way\
  \ is by using the **Lean Digital Twin Canvas**.\n\nThis is based on the lean canvas\
  \ that’s used in the Lean Startup approach, which describes the business problem,\
  \ solution integration points, and the business case on a single page that is easy\
  \ to communicate to a project team and executive sponsors:\n\nFigure 4.5 – The lean\
  \ Digital Twin canvas for the slurry pump predictive maintenance Digital Twin\n\n\
  ![](img/f445915fceb4649a77b6797f1425850b_113_0.png)\n\n![](img/f445915fceb4649a77b6797f1425850b_113_1.png)\n\
  \nThe numbers in the preceding diagram indicate the sequence for completing the\
  \ canvas during a workshop with the business and IT teams:\n\n- **Problem**: Describe\
  \ the top three problems that the first Digital Twin will address based on the prioritization\
  \ matrix described in _Chapter 1, Introduction to Digital Twin_.\n- **Customer Segments**:\
  \ Who are the stakeholders and business users that will benefit from the first Digital\
  \ Twin solution?\n- **Digital Twin UVP**: What makes this Digital Twin different\
  \ from what you are already doing?\n- **Solution**: What are the top three features\
  \ that will deliver the key capabilities of the Digital Twin (AI, real time, decision\
  \ support, and so on)?\n- **External Challenges**: What are the external red flags\
  \ for the Digital Twin (security, data access, connectivity, and so on)?\n- **ROI\
  \ Business Case**: How will this Digital Twin deliver the planned _value at stake_,\
  \ as described in _Chapter 1, Introduction to Digital Twin_?\n- **Key Metrics**:\
  \ How will the Digital Twin be measured quantitatively?\n- **Integration**: What\
  \ are the critical integrations required to make it work?\n- **Costing**: What is\
  \ the projected cost of developing and operating the Digital Twin?\n\nThe preceding\
  \ diagram shows a complete canvas for a slurry pump as part of a predictive maintenance\
  \ Digital Twin in an industrial mining company. One of this approach’s main benefits\
  \ is that the canvas provides a single-page view of all the critical aspects of\
  \ interest to executive decision-makers. The template for the canvas is available\
  \ to download at `https://bit.ly/idt-ldtc`.\n\nThe Lean Digital Twin canvas is ideal\
  \ as a solution planning framework for your first Digital Twin, since it ensures\
  \ that you have documented the problem statement and visibly clarified the expected\
  \ outcomes.\n\n\n\n\n\n\n### 验证问题陈述和预期结果\n\n审查问题陈述和预期结果是初始阶段经过验证的学习重点的一部分，如图 4.4\
  \ 所示。它为我们提供了持续迭代并朝着成功项目转向的机会。\n\n在数字孪生原型的开发生命周期（图 4.1）的每个阶段，验证您正在解决的问题以及对业务结果的期望至关重要。最简单的方法是在每个阶段结束时的正式评审研讨会上使用精益数字孪生画布。您可以将其作为检查点，以确保所有利益相关者仍然与问题和预期的业务结果保持一致。\n\
  \n您应该为每个阶段更新画布的新版本，以便在项目结束时提供有价值的洞察。通过这样做，您将能够评估问题陈述在开发生命周期中对预期业务结果的演变。这是一个向高管展示数字孪生演进和开发的便捷工具，不仅展示技术方面，还展示业务考量。\n\
  \n验证您的问题陈述以及关于首个数字孪生结果的假设是一个不应被忽视的关键步骤。首个项目往往会在您的组织中形成对数字孪生等新方法的持久印象。图 4.4 中的第二个块描述了该方法，类似于精益创业方法中的产品/市场验证。经过调整的精益数字孪生指的是数字孪生/业务匹配，用于验证问题陈述并检查预期结果。\n\
  \n在本节中，我们提出了精益数字孪生画布作为规划首个数字孪生的业务验证和影响的解决方案框架。它基于精益创业方法，该方法强调经过验证的学习，而其中一个关键方面是验证我们是否在解决正确的问题以交付正确的结果。我们将在下一节介绍如何验证问题陈述和预期结果。\n\
  \n### 探索数字孪生开发的业务流程\n\n定义业务流程的变化并确保最终用户接受培训以最大限度地利用数字孪生提供的新洞察至关重要。我们在“阶段 2 – 项目设计和开发阶段”部分中提到过这一点，但在数字孪生项目的生命周期早期就必须考虑这一影响：\n\
  \n![Figure 4.6 – Example of business process changes based on Digital Twin inputs](img/f445915fceb4649a77b6797f1425850b_116_0.png)\n\
  \n前面的图表描述了数字孪生在矿山浆液泵预测性维护示例中的业务流程影响。此示例展示了数字孪生、可靠性工程团队、维护规划团队和维护班组之间的交互。\n\n数字孪生交付团队有责任确保现有流程已更改以包含新的工作方式，尤其是当它影响不经常使用数字技术解决方案的运营和业务用户时。\n\
  \n对于大规模项目，这可能需要进行正式的业务流程审查，但我们建议您为首个数字孪生绘制简单的流程图，类似于前面图表中所示的示例。这将改善各利益相关者之间的协作和沟通，并使所有流程参与者都能看到这些变化。在每个阶段审查这些变化很重要，但特别是在验证阶段，以确保拟议的新流程改善整体体验：\n\
  \n![Figure 4.7 – End-to-end business process initiated by a Digital Twin of a pump](img/f445915fceb4649a77b6797f1425850b_117_0.png)\n\
  \n前面的图表展示了一个泵的简单端到端业务流程，其中数字孪生正在从物理泵接收实时数据。当数字孪生预测到潜在故障时，它会向服务技术人员发送消息以启动维修。数字孪生可以在业务系统（例如\
  \ ERP）中创建相应的工单。\n\n对业务流程的更改不是首个数字孪生的唯一考虑因素。您此时做出的技术决策可能会影响您未来部署项目的结果和规模。让我们来探讨其中一些技术考量。\n\
  \n### 考虑技术因素\n\n现在，我们已清楚了解希望通过首个数字孪生解决的问题、预期结果、精益敏捷开发周期中的不同项目阶段以及支持其所需的业务流程，我们需要解决首个数字孪生的技术考量。\n\
  \n为了标准化数字孪生定义、互操作性以及如何与这些数字孪生进行交互，各个组织正在致力于技术标准以应对这些挑战。该领域的两个著名项目是由 Plattform Industrie\
  \ 4.0 开发的资产管理外壳（AAS）（https://bit.ly/idt-aas），以及由微软赞助的开源项目数字孪生定义语言（DTDL）（https://bit.ly/idt-dtdl）。除此之外，目前还在开发制造领域的数字孪生标准框架，例如“数字孪生制造框架”，该框架将作为\
  \ ISO 23247 发布。\n\nAAS 和 DTDL 两项倡议都专注于技术上描述和实例化数字孪生，并具有重大的技术影响。在撰写本文时，这两项标准仍在制定中，缺乏足够的细节来帮助我们创建完全可操作的独立数字孪生。决定使用其中任何一项，或者甚至使用您自己的专有方法，是一项关键的架构决策，该决策受到您组织的技术栈以及您在短期和中期所需的复杂程度的影响。将您的首个数字孪生作为最小可行产品来创建的好处是，它可以让您在为业务决定标准之前测试这些方法。\n\
  \n为了决定为首个工业数字孪生使用哪种标准，我们将从高层次上探讨我们之前提到的两种新兴标准（AAS 和 DTDL）。\n\n### 资产管理外壳\n\n**资产管理外壳（AAS）**\
  \ 是平台工业 4.0 的数字孪生实现，这是一个由德国的公司、协会、工会、科学组织和政府实体组成的网络。它由 Plattform Industrie 4.0 的“参考架构、标准和规范”工作组（**WG1**）开发（`https://bit.ly/idt-wgI40`）：\n\
  \n![Figure 4.8 – High-level metamodel of AAS: `https://bit.ly/idt-zvei-aas`](img/f445915fceb4649a77b6797f1425850b_118_0.png)\n\
  \n考虑将 AAS 用于您的数字孪生架构的原因之一，是产品制造商可能提供的数字孪生库，可用于组装复合数字孪生。\n\nAAS 主要与工业 4.0 运动相关联，大部分活动来自欧洲制造商及其客户。技术考量主要围绕与其他基于\
  \ AAS 的资产数字孪生的互操作性。\n\n本书不打算提供 AAS 的完整技术评估，但它是未来标准化数字孪生开发的关键技术考量。官方技术信息可在 https://bit.ly/idt-zvei-aas\
  \ 上查阅，但我们将在此处介绍首个数字孪生的一些关键决策。\n\n数字孪生开发的一项技术考量是您用于定义、创建、存储和操作数字孪生信息模型的格式。标准化这些工作将有助于数字孪生之间的互操作性，同时也将减少集成工作量，并使模型的重用更容易实现。\n\
  \n物理资产是 AAS 的核心。该框架旨在适应资产、组件、信息和子模型，这些要素建立产品层次结构，有点类似于物料清单。这是数字孪生信息模型的一个有用结构，因为它需要在更广泛的工业\
  \ 4.0 供应商和消费者生态系统中运行。它以机器可读的格式提供对资产的共同理解，而 AAS 是资产及其相关数据的元模型描述。AAS 框架中有用于定义属性和物理单位概念描述的数据规范模板。\n\
  \n目前提供以下 AAS 序列化和映射。我们还指定了它们的典型用例：\n\n- XML 和 JSON 用于通过 .aasx 交换格式在合作伙伴之间交换\n- 资源描述框架（RDF）用于推理\n\
  - AutomationML 用于工程阶段\n- OPC 统一架构（OPC UA）用于操作阶段\n\n\n\n\n\n序列化遵循标准化结构，有助于改善协作和互操作性。下图显示了\
  \ AAS 结构化方法中资产的元模型：\n\n![](img/f445915fceb4649a77b6797f1425850b_120_0.png)\n\n图\
  \ 4-9 – AAS 结构中资产的元模型\n\n以下 XML 代码片段展示了以机器可读格式定义资产及其组件或子模型层次结构的结构：\n\n```\n<aas:assetAdministrationShells>\n\
  \    <aas:assetAdministrationShell>\n        <aas:idShort>ExampleMotor</aas:idShort>\n\
  \        <aas:category>CONSTANT</aas:category>\n        <aas:identification idType=\"\
  URI\">http://customer.com/aas/9175_7013_7091_9168</aas:identification>\n       \
  \ <aas:assetRef>\n            <aas:keys>\n                <aas:key type=\"Asset\"\
  \ local=\"true\" idType=\"URI\">http://customer.com/assets/KHBVZJSQKIY</aas:key>\n\
  \            </aas:keys>\n        </aas:assetRef>\n        <aas:submodelRefs>\n\
  \            <aas:submodelRef>\n                <aas:keys>\n                   \
  \ <aas:key type=\"Submodel\" local=\"true\" idType=\"URI\">http://i40.customer.com/type/1/1/1A7B62B529F19152</aas:key>\n\
  \                </aas:keys>\n            </aas:submodelRef>\n        </aas:submodelRefs>\n\
  \        <aas:conceptDictionaries />\n    </aas:assetAdministrationShell>\n</aas:assetAdministrationShells>\n\
  ```\n\n这种序列化反过来可用于在集成层面与数字孪生进行交互，以及基于数字孪生用例要求，对资产进行可视化用户表示。工业 4.0 社区已提供开源开发者工具，AAS\
  \ Explorer 是当前项目，其源代码可在 https://bit.ly/idt-aasx 获取。\n\n部分数字孪生赋能技术供应商提供开箱即用的 AAS\
  \ 支持，具备可视化和数据集成能力。以下截图展示了商业应用中智能工厂机器人的数字孪生在 AAS 定义中的实现：\n\n![](img/f445915fceb4649a77b6797f1425850b_121_0.png)\n\
  \n图 4.10 – 智能工厂 AAS 定义中机械臂数字孪生示例\n\n其他供应商示例可在 http://www.i40-aas.de 找到。\n\n另一个技术考量是，在单一技术环境中部署和管理标准化数据模型。当您正在标准化云解决方案提供商的技术栈时，这种方法很有意义。微软\
  \ DTDL 开源计划是支持这一技术考量的方法。\n\n### 数字孪生定义语言 (DTDL)\n\n通过其开源计划，微软开发了 **数字孪生定义语言 (DTDL)**，作为一种用于描述包含\
  \ IoT 设备、设备数字孪生和资产数字孪生的模型的语言。设备数字孪生是传感器设备的数字表示，包括电池电量和连接质量等设备信息，这些信息通常不与资产数字孪生相关联。DTDL\
  \ 使用 JSON 的一种变体，即 **JSON-LD**，旨在作为 JSON 或 **资源描述框架 (RDF)** 系统使用。\n\nDTDL 由一组元模型类组成，其方法与\
  \ AAS 类似。六个元模型类用于定义基于 DTDL 的数字孪生的行为：\n\n- Interface\n- Telemetry\n- Property\n-\
  \ Command\n- Relationship\n- Component\n\n这些元模型类可以使用 **软件开发工具包 (SDK)** 实现。有关 DTDL\
  \ 及这六个类的开源实现的更多技术信息，可在 `https://bit.ly/idt-dtdlv2` 获取。\n\n请注意，DTDL 只能部署在 **Azure\
  \ 数字孪生** 服务上，该服务在撰写本书时可在 Microsoft Azure 云中使用。将其技术栈标准化为 Azure 和 Azure 服务的组织可能更倾向于使用\
  \ DTDL 进行数字孪生解决方案部署。有关 Azure 数字孪生的更多信息，请访问 `https://bit.ly/idt-adts`。\n\nDTDL 定义实体之间的语义关系，以将数字孪生连接到反映其交互的知识图。它支持模型继承，以创建专用数字孪生。\n\
  \nAzure 数字孪生中的数字孪生知识图可以通过 Azure 数字孪生资源管理器 (https://bit.ly/idt-dtdlx) 进行可视化，该资源管理器显示不同数字孪生模型之间的关系。它是一个示例应用程序，演示了如何执行以下操作：\n\
  \n- 上传并探索基于 DTDL 的数字孪生的模型和图。\n- 使用多种布局可视化数字孪生图。\n- 编辑 DTDL 数字孪生的属性，并针对图运行查询。\n\n\
  以下截图显示了基于复合数字孪生 DTDL 模型的知识图示例。此示例的描述可在 https://bit.ly/idt-dtdlx 获取：\n\n![](img/f445915fceb4649a77b6797f1425850b_123_0.png)\n\
  \n图 4.11 – Azure 数字孪生服务中的基于 DTDL 的数字孪生图\n\nDTDL 目前比 AAS 简单，但其范围和功能也有限。它不存储数字孪生的历史数据，因为它只记录当前状态。如果传感器的温度输入发生变化，当前值会被新值覆盖。\n\
  \n使用 DTDL 的 Azure 数字孪生服务用户通常将时间序列数据存储在时间序列数据库中，然后使用 DTDL 资产标识符和属性创建用于分析目的的历史参考。这可以由\
  \ Microsoft Visual Studio 中的开发人员完成，也可以由工程师等领域专家在具有集成连接器的低代码数字孪生平台上完成，该平台提供对 Azure\
  \ 数字孪生和时间序列数据库的访问。集成连接器的示例可见于图 4.12。\n\n在决定将支持您首个数字孪生开发的数字孪生赋能技术时，这些是重要的技术考量。数字孪生主要是由软件开发人员开发和使用，还是面向业务用户以便在您的组织中创建和维护数字孪生？这两种在技术上都是可行的选项，但需要不同的技术能力来支持数字孪生项目的目标。\n\
  \n以下是描述离心浆泵某些属性的 DTDL JSON 示例：\n\n```json\n{\n \"@id\": \"dtmi:com:XMPro:PumpAssembly;1\"\
  ,\n \"@type\": \"Interface\",\n \"@context\": \"dtmi:dtdl:context;2\",\n \"displayName\"\
  : \"Pump Assembly\",\n \"contents\":[\n {\n \"@type\": \"Property\",\n \"name\"\
  : \"Description\",\n \"schema\": \"string\"\n },\n {\n \"@type\": \"Property\",\n\
  \ \"name\": \"PumpType\",\n \"schema\": \"string\"\n },\n {\n \"@type\": \"Property\"\
  ,\n \"name\": \"MotorRatedPower\",\n \"schema\": \"double\"\n },\n {\n \"@type\"\
  : \"more types and properties here\"\n }\n ]\n}\n```\n\n以下截图显示了一个低代码应用程序开发平台示例，其中遥测数据正在发送到\
  \ Azure 数字孪生和时间序列洞察：\n\n![](img/f445915fceb4649a77b6797f1425850b_125_0.png)\n\n\
  图 4.12 – Azure 数字孪生服务中的基于 DTDL 的数字孪生图\n\n以下截图展示了前一张截图中的泵遥测数据（使用 DTDL 建模）如何在最终用户界面中呈现：\n\
  \n![](img/f445915fceb4649a77b6797f1425850b_126_0.png)\n\n图 4.13 – Azure 数字孪生服务中的基于\
  \ DTDL 的数字孪生图\n\nAAS 和 DTDL 凸显了在决定用于开发数字孪生的底层赋能技术时需要解决的一些技术考量。还有许多其他技术方面，例如安全性、可信性、远程访问、通信要求和用户界面，我们将在本书后面开发首个数字孪生时进行高层次介绍。接下来，我们将探讨支持数字孪生开发过程的数字平台。\n\
  \n### 探索数字孪生的数字平台\n\n数字孪生需要一个数字环境来帮助构建和部署其应用程序。数字孪生的数字平台通常由多个组件组成，这些组件协同编排以提供数字孪生赋能技术栈。\n\
  \n这些数字组件包括以下内容：\n\n- IoT 平台\n- 业务流程管理平台\n\n\n\n\n\n### IoT 平台\n\nIoT 平台通常包含多种功能，用于将\
  \ IoT 设备连接到分析和业务应用程序。传统的 **操作技术 (OT)** 平台连接专有设备和控制系统。相比之下，IoT 平台通过开放协议连接到广泛的 IoT\
  \ 设备，并将信息提供给运营和业务应用程序。\n\nIoT 平台通过以下方式支持数字孪生的开发：\n\n- 监控 IoT 端点和实时数据流\n- 支持专有和开放行业连接协议，用于连接和数据传输\n\
  - 在 IoT 数据上实现基于物理和数学的分析\n- 提供边缘、分布式和云计算选项\n- 通过 API 提供集成，用于应用程序开发\n- 将 IoT 数据与业务和运营系统中的信息进行上下文化\n\
  \n高级 IoT 平台的一些关键功能包括以下内容：\n\n- 设备管理\n- 数据集成\n- 数据存储和管理\n- 分析\n- 应用程序开发支持\n- 安全性和隐私性\n\
  \n结合这些功能，为数字孪生开发项目提供了理想的技术基础。然而，数字孪生的目标不仅仅是围绕实时传感器或 IoT 信息，而是围绕数字孪生所推动的业务成果。\n\n\
  这些业务成果受到基于数字孪生所获得的洞察所采取的行动的影响。如前一章所述，更改或调整业务流程是数字孪生长期价值的关键成功因素。\n\nIoT 平台的一些代表性供应商包括以下内容：\n\
  \n- Alleantia (alleantia.com)\n- Particle (particle.io)\n- Microsoft (microsoft.com)\n\
  - Relayr (relayr.io)\n- Thingworx (ptc.com)\n\n> 重要说明\n> 请注意，这只是代表性列表，而不是详尽列表。此列表仅供参考。\n\
  \n来自数字孪生的信息可以为运营用户提供决策支持，也可用于流程自动化，以将人从循环中移除。业务流程管理平台可以同时解决这两个问题。\n\n### 业务流程管理平台\n\
  \n用于数字孪生的 **业务流程管理 (BPM)** 平台可能与 IoT 平台功能有重大重叠，但 BPM 平台的重点更多在于推动由 IoT 数据产生的业务流程或工作流。BPM\
  \ 对 IoT 设备管理、连接性和通信协议的关注较少。\n\n高级 BPM 解决方案还提供面向主题专家的低代码配置环境，以帮助配置工作流、流程和业务规则，从而触发或自动执行操作。此过程不仅包含来自\
  \ IoT 来源的数据，还将高级分析嵌入到运行中的流程中，以从数字孪生应用程序生成洞察和情境意识。\n\nBPM 平台的一些代表性供应商包括以下内容：\n\n\
  - Avolution (avolutionsoftware.com)\n- Boxarr (boxarr.com)\n- iGrafx (igrafx.com)\n\
  - QPR (qpr.com)\n- XMPro (xmpro.com)\n\n> **重要说明**\n> 请注意，这只是代表性列表，而不是详尽列表。此列表仅供参考。\n\
  \nBPM 平台交付来自数字孪生的操作，但该解决方案可能需要更多关注数据和分析，以确定行动方案。\n\n### 分析和数据平台\n\n分析和数据平台是提供高级分析功能的数字工具。这些功能包括机器学习、人工智能和高保真物理功能。\n\
  \n这些分析平台通常依赖 IoT 平台从传感器和控制系统来源摄取数据。其他数据管理功能包括历史服务、数据湖和针对特定设备类型的预构建分析库。\n\n分析和数据平台通常与\
  \ BPM 或应用程序平台结合使用，以可视化并采取分析洞察所产生的结果的行动。\n\n分析和数据平台的一些代表性供应商包括以下内容：\n\n- ANSYS (ansys.com)\n\
  - C3.ai (c3.ai)\n- OSIsoft (osisoft.com)\n- Sight Machine (sightmachine.com)\n-\
  \ Uptake (uptake.com)\n\n> **重要说明**\n> 请注意，这只是代表性列表，而不是详尽列表。此列表仅供参考。\n\n### 应用程序平台\n\
  \n应用程序平台是您在组织中开发和使用数字孪生时需要考虑的最后一类数字孪生赋能技术。应用程序平台用于创建垂直聚焦的数字孪生解决方案，以支持现有应用程序，例如 **资产性能管理\
  \ (APM)**、**企业资产管理 (EAM)** 和 **运营性能管理 (OPM)**。数字孪生为这些业务应用程序带来了新功能，而数字孪生的配置是供应商自身更广泛应用程序套件的一部分。\n\
  \n应用程序平台的一些代表性供应商包括以下内容：\n\n- AVEVA (aveva.com)\n- Bentley (bentley.com)\n- GE Digital\
  \ (ge.com)\n- IBM (ibm.com)\n- Oracle (oracle.com)\n- SAP (sap.com)\n- Siemens (siemens.com)\n\
  \n> **重要说明**\n> 请注意，这只是代表性列表，而不是详尽列表。此列表仅供参考。\n\n您的数字孪生的应用程序和用例将决定您所需的数字平台功能。如前一章所述，验证所需结果的业务问题对于考虑正确的数字技术和基础设施至关重要。\n\
  \n在下一章中，当我们开始设置第一个数字孪生原型时，这将变得更加明显。\n\n### 摘要\n\n在本章中，我们考虑了在开始第一个数字孪生项目之前需要的规划框架。我们研究了项目规划框架，该框架描述了涉及的阶段，以及解决方案规划框架，该框架定义了我们正在解决的问题、关注的用户以及预期的结果。\n\
  \n然后，我们回顾了如何验证问题陈述和预期结果，以及这将如何影响现有和未来的业务流程。我们还考虑了技术决策的影响。最后，我们提供了赋能技术的高级概述，以及我们可以用于在下一章设置第一个数字孪生的不同类型的数字平台。\n\
  \n在 _第 5 章，设置数字孪生原型_ 中，我们将开始设置第一个数字孪生原型，方法是选择数字孪生平台、决定云基础设施，并启动配置和设置。我们还将考虑数据的影响，并为我们的第一个数字孪生创建解决方案架构。\n\
  \n### 问题\n\n1. 描述您的数字孪生原型的项目阶段。\n2. 您能否创建精益数字孪生画布来描述您的解决方案？\n3. 您的数字孪生解决方案的主要技术考虑因素是什么？\n\
  4. 您认为数字孪生在您的组织中将带来哪些好处？\n"
- '### 5 设置数字孪生原型


  在第 4 章，开始使用我们的第一个数字孪生中，我们评估了数字孪生之旅的规划阶段和框架。我们涵盖了数字孪生预期的业务成果以及达到所需状态的过程。我们讨论了在企业中创建和管理数字孪生的技术要求。


  本章将介绍构建数字孪生原型所需的步骤。我们将首先评估公共云和 **物联网 (IoT)** 平台注意事项，以及构建数字孪生所需的功能。


  本章将涵盖以下主题：


  - 确定数字孪生平台

  - 评估用于数字孪生的公共云、IoT 和专业平台

  - 配置和设置

  - 您的 Azure 数字孪生的数据注意事项

  - 解决方案架构






  ### 识别数字孪生平台


  在第 3 章“识别第一个数字孪生”中，我们从各种公司的角度探讨了数字孪生的评估。第一种和第二种类型是大型工业公司，它们可能是工业资产的制造商。在这里，我们将扩展到此类考虑，例如工业制造商有兴趣在资产的整个生命周期内改进产品并提供良好的维护服务，以服务于其客户或资产的操作员。


  ### 资产所有者的视角


  让我们将范围缩小到能源领域和风力涡轮机制造商。全球变暖和可再生能源的使用正在增加。因此，我们相信风力涡轮机将继续成为能源领域的重要工业资产。**水平轴风力涡轮机（HAWT）**，如下图所示，是最常用的风力涡轮机类型。这种风力涡轮机可以作为单个资产或作为风电场的一部分使用。工业级风力涡轮机可使用约
  20 年。风力涡轮机产生能量不需要化石燃料，因为它利用运动的风作为能源。风是风力涡轮机产生能量的唯一输入，就像阳光是太阳能农场的能源一样。如今，更大的风力涡轮机可以产生
  10-20 **兆瓦（MW）** 的能量（参见 https://reneweconomy.com.au/germany-gears-up-to-test-20mw-wind-turbines-79007）。这种风力涡轮机的翼展可达
  200 米：


  ![](img/f445915fceb4649a77b6797f1425850b_134_0.png)


  图 5.1 – HAWT


  风电场可以包含少量涡轮机到数百台涡轮机。此类风电场可以位于陆地（陆上）或海上。下图显示了一个海上风电场。此类位置通常具有 5-10 **米/秒（m/s）** 的风速，以实现有效的发电。风力涡轮机的相对位置和距离对于提高风电场的整体发电量非常重要。同样，风电场通常位于一年中大部分时间或一天中大部分时间有持续风流的地区：


  ![](img/f445915fceb4649a77b6797f1425850b_135_0.png)


  图 5.2 – 海上风电场


  当我们准备了解构建风力涡轮机和风电场数字孪生的要求时，了解风力涡轮机在风电场中的物理布局是如何进行以最大化整体发电量非常重要。下一台涡轮机底座之间的距离和方向定向是确定的，使得一台涡轮机对其余涡轮机的风流干扰最小。这种对风的影响称为尾流效应。尾流效应可以来自同一风电场中的不同涡轮机（内部尾流效应）或来自邻近的风电场（外部尾流效应）（参见
  `https://www.wind-energy-the-facts.org/wake-effect.html#`）。尾流效应是附近未来风电场建设需要考虑的因素。这很重要，因为风力涡轮机和风电场的寿命很长。附近森林中树木的生长也可能随时间影响风的性质。


  接下来，让我们看看构建数字孪生解决方案基础所需的哪些基本能力，例如用于风力涡轮机和风电场。


  ### 所需的 IoT 能力


  数字孪生需要来自资产的数据以保持孪生体的最新状态。这有助于构建和维护更准确的孪生体，从而确保更好的结果。这些结果可以支持预测性维护的决策，也可以简单地通过更好的资产利用率产生。在过去十年中，我们看到了几个
  IoT 平台的增长，其中一些面向工业资产。通用 IoT 技术栈如下图所示，该图描绘了设备连接以捕获和转换数据，然后将其传递到 IoT 核心平台。此类核心 IoT
  通常位于公有云平台上。包括数字孪生在内的应用程序通常构建在 IoT 平台之上：


  ![](img/f445915fceb4649a77b6797f1425850b_136_0.png)


  图 5.3 – IoT 技术栈


  > **注意**

  > 图片引用：Abunahla, H., Gadhafi, R., Mohammad, B. et al. *Integrated graphene oxide
  resistive element in tunable RF filters*. Sci Rep 10, 13128 (2020)。

  > https://doi.org/10.1038/s41598-020-70041-x


  接下来，让我们看看 IoT 平台的一些基本能力，即以下内容：


  - 从资产、传感器、网关设备或第三方来源（例如环境数据）收集数据的能力。

  - 安全可靠地将数据传输到数据存储层的能力。此活动可能需要协议转换和/或数据加密。

  - 处理不同类型的通信介质，例如有线、无线，甚至用于偏远地区的卫星通信。

  - 了解资产和资产群结构的能力，以便数据可以映射到有意义的构造中。

  - 分析来自不同类型数据存储（例如时间序列、关系型或非结构化）的数据的能力，并应用模型和算法生成洞察。

  - 允许为特定目的构建的应用程序基于平台功能构建。


  现在，当我们查看 IoT 平台所需的基础能力时，我们发现这些是以下内容：


  - 计算

  - 存储

  - 网络


  为了以弹性和敏捷的方式获得这些基础能力，IoT 平台使用公有云。由于 IoT 中资产的分布式特性，计算、存储、网络和连接能力可能需要在多个位置。公有云平台通常具有区域和**可用性区域（AZs）**的概念，以帮助满足此类要求。网络安全通过遵循安全实践来处理，例如
  a) 限制在不经过现有控制系统的情况下远程驱动设备，以及 b) 在边缘和云之间使用数据加密，以减少数据在传输过程中被篡改的可能性。


  ### 构建与购买能力


  我们在前一节中查看了 IoT 平台所需的基础能力。鉴于这些能力在任何公有云平台上都存在，从公有云“购买”此能力而不是“构建”它可能是一个容易的决定。如果我们回到大约十年前，许多大型企业过去曾构建自己的数据中心以满足其计算需求，并将其数据和**信息技术（IT）**应用程序保存在公司防火墙内。随着公有云技术开始成熟并加强安全性和合规性，企业开始转向在公有云中“购买”类似虚拟数据中心的能力。


  在构建数字孪生解决方案（例如，在我们的案例中，风力涡轮机的数字孪生）时，制造公司将面临类似的构建与购买决策。我们将通过提供该公司当前技术环境的详细信息来分解此决策过程，如下：


  - 作为一家全球性集团，该公司拥有许多应用程序和数据库。这些应用程序已被分类为 a) 关键任务和 b) 非关键任务。同样，数据库已被分类为 a) 出口管制/受限；b)
  私有；和 c) 公共数据。

  - 首席信息官（CIO）已获得批准，将非关键任务类别中的应用程序存储在公有云平台上，并使用私有或公共数据。然而，这要求公有云提供商证明其满足一定水平的行业标准和合规性要求。

  - 基于公司已批准的公有云平台，云平台上提供了 IoT 平台选项。IoT 平台与用于 IT 应用程序和数据库的选定公有云平台的接近性，确保了进出选定云平台的数据移动量减少。

  - 在选定公有云平台上运行的 IoT 平台子集面向工业资产，并不仅限于消费级 IoT 场景。

  - 该公司正在减少其数据中心的足迹，除了其高度受限或出口管制的关键任务应用程序和数据。然而，该公司正在评估公有云提供商的路线图，以满足其性能和合规性要求，无论是通过公有云还是混合云/边缘云产品，在未来
  2 年内。


  基于此处的考虑，该公司决定在此案例中采取“购买”路线，而不是“构建”路线。


  ### 评估数字孪生的公有云、IoT 和专业平台


  让我们看看构建风力涡轮机数字孪生解决方案的考虑因素。在过去十年中，企业计算一直在向公有云转移，在此期间，行业出现了大规模公有云提供商。根据 2020 年 9 月发布的《云基础设施和平台服务魔力象限》，这些是主要提供商：


  - Microsoft Azure

  - Amazon Web Services (AWS)

  - Google Cloud Platform (GCP)

  - Alibaba Cloud

  - Oracle Cloud Infrastructure (OCI)

  - IBM Cloud

  - Tencent Cloud







  阿里巴巴和腾讯主要在中国流行，因此，我们不会在此讨论这两个平台。我们将从数字孪生的角度，探讨当今行业中常见选项的功能。


  # Microsoft Azure Digital Twins


  Microsoft **Azure Digital Twins** (**ADT**) 是 Azure IoT 的一部分，是一个基于 IoT 的数字孪生平台，如在
  _第 4 章，着手构建我们的第一个数字孪生_ 中所述。Azure IoT 包含多个平台服务，这些服务可以在边缘和云端访问。用于提供 IoT 平台的一些服务包括以下几项：


  - **Azure IoT Hub**—这是一个云托管的、安全的双向通信服务，用于 IoT 设备与应用程序后端之间的通信。

  - **Azure IoT Central**—这是一个 **用户界面 (UI)** 应用程序，用于管理 Azure IoT Hub 上的设备。

  - **Azure IoT Edge**—这通过 Azure 服务的容器化运行 IoT 边缘设备。

  - **Azure RTOS**—这是一个面向资源受限 IoT 设备的操作系统，包含嵌入式开发套件。

  - **Azure Time Series Insights (TSI)**—使用此服务来存储、可视化和查询大量时间序列数据集。

  - **ADT**—这是一个 **平台即服务 (PaaS)** 功能，用于为描述实体或事物模型及其与其他实体关系的实体创建基于图的关系。


  这些服务根据业务和技术要求以不同配置组合，以提供 Azure IoT 平台。IoT 和数字孪生应用程序通过微软开发者工具（如 Visual Studio 和 **Visual
  Studio Code (VS Code)**）在 ADT 平台上开发。


  ADT 中的知识图在单一模型中存储实体、关系和状态信息。_图 5.4_ 展示了 Azure IoT 平台及其服务的高级视图，以及 ADT 在架构中的位置。


  ADT 使用 **数字孪生定义语言 (DTDL)**，我们在 _第 4 章，着手构建我们的第一个数字孪生_ 中已介绍过。DTDL 是一种开源建模语言，旨在提高
  ADT 模型在不同应用程序和用例中的互操作性和可重用性。


  您可以在此处查看架构概览：


  ![](img/f445915fceb4649a77b6797f1425850b_140_0.png)


  图 5.4 – Azure IoT 平台中的 Microsoft ADT


  微软在 Azure IoT 和 ADT 方面拥有广泛的行业关注度。这包括基础设施、制造、能源与公用事业、石油与天然气以及采矿等垂直领域（在撰写本书时）。


  接下来我们将探讨 AWS 的功能。


  # AWS IoT 平台


  让我们来看看 AWS 的功能。AWS 早在 2006 年就开始提供公有云服务。如今，它在 **基础设施即服务 (IaaS)** 和 PaaS 市场中占有很大份额。2015
  年底，Amazon 宣布了其 AWS IoT 产品，最初是 AWS IoT Core 或面向连接设备的云服务。其他 AWS 服务，例如 Amazon **简单存储服务
  (S3)**、Amazon Kinesis 等，可以与 IoT Core 一起用于构建 IoT 应用程序。AWS IoT 平台支持常用的 IoT 协议，例如 **消息队列遥测传输
  (MQTT)**、**超文本传输安全协议 (HTTPS)** 和 **低功耗广域网 (LoRaWAN)**。那些已经使用 AWS 进行 IaaS 和 PaaS
  并将其企业数据和应用程序部署在 AWS 上的企业，开始考虑使用 AWS IoT 平台来开发需要设备连接和传感器数据的应用程序。


  对于标准化于某个云平台的企业来说，它通常是新云功能（在此案例中为 IoT 和数字孪生）的起点。在某些情况下，CIO 希望在 IT 和云环境中拥有较少的组件。通常，公有云提供商的安全和合规审批过程很漫长，企业会尽量减少使用的公有云平台数量，除非他们愿意采用最佳方案解决方案，或将多云作为其业务连续性策略的一部分。通常，进出公有云平台会产生数据费用，并在应用程序之间引入延迟。


  Amazon 的 IoT 产品仅限于其 IoT 平台。Amazon 未在平台之上构建任何可以作为软件即服务 (SaaS) 提供的 IoT 应用程序。SaaS 产品或
  IoT 应用程序更易于业务用户使用，而平台功能通常需要软件专业人员和应用程序开发人员通过可用的 IoT 应用程序来使用这些服务。Amazon Sumerian
  提供围绕三维 (3D) 建模、增强现实 (AR) 和虚拟现实 (VR) 的功能，可以与 IoT 平台一起用于构建类似数字孪生的应用程序。一个示例是制造工厂的数字孪生，带有设备和平面图的
  3D 视图，用于为员工提供培训。


  Amazon 提供设备影子服务（参见 https://docs.aws.amazon.com/iot/latest/developerguide/iot-device-shadows.html）。该服务允许您创建物理设备的影子，并例如将物理设备的状态提供给应用程序。但是，影子并不是物理资产的动态数字孪生。设备影子可以存储在
  JavaScript 对象表示法 (JSON) 文件中。此类 JSON 文件中的信息将是设备元数据、状态或版本，以及与设备关联的任何安全令牌。应用程序可以使用表述性状态转移
  (REST) 应用程序编程接口 (API)（即用于 GET、UPDATE 或 DELETE 请求）或通过 MQTT 消息与设备影子进行交互。


  据我们所知，在 2021 年初撰写本书时，AWS 平台上没有完整的数字孪生服务。但是，有独立软件供应商 (ISV) 在 AWS 之上提供此类功能。一个示例是 Hexagon
  Digital Reality (HxDR) 平台（参见 https://aws.amazon.com/blogs/industries/hxdr-transforming-geospatial-data-in-the-cloud-with-aws-and-hexagon-leica-geosystems/）。


  HxDR 提供用于在 AWS 之上构建结构的数字孪生功能。此类数字孪生解决方案的一些特征概述如下：


  - 高计算复杂度，用于从物理结构中混合空间数据以创建数字孪生。随着模型规模和精度的增长，能够弹性增长计算能力的特点使公有云适合此用途。

  - 高保真数字孪生需要大量关于其物理结构的数据。由于数据量大，存储并使这些数据可用是一项挑战性的任务。存储增长可以是按需或在公有云上进行。HxDR 使用 AWS
  S3 进行此类弹性存储。

  - 数据可能会在全球范围内收集，具体取决于数字孪生的问题领域。通常，公有云平台在多个位置以及边缘位置都有接入点。

  - 为数字孪生收集的数据的安全性和敏感性可能需要底层云平台提供额外的安全服务。


  Vertex 是 AWS 平台上另一家提供数字孪生功能的供应商（参见 `https://aws.amazon.com/iot/solutions/VertexDigitalTwin/`）。Bosch
  IoT Things on AWS 可以使用 MQTT 和 **高级消息队列协议 (AMQP)** 连接到设备，并帮助管理数字孪生（参见 `https://aws.amazon.com/marketplace/pp/BoschIO-GmbH-Bosch-IoT-Things/B07DTJK8MV`）。


  总结，我们看到像 AWS 这样的公有云提供商可以通过 IoT Core 和其他服务的组合，或来自 ISV 合作伙伴的专门产品，从零开始构建数字孪生功能，这些功能可以用于快速入门。但是，Amazon
  缺乏其自身的完整数字孪生解决方案。


  接下来让我们探讨 Oracle 在这一领域提供的功能。


  # Oracle IoT 应用程序


  让我们现在来看看 Oracle 的功能。Oracle 以 **企业资源计划 (ERP)** 和被全球多家中大型企业使用的技术解决方案而闻名。当一家公司寻找 IoT
  和数字孪生解决方案时，当前的 ERP 和制造应用程序提供商可能会影响该决策。Oracle 和 SAP 是提供 ERP、**客户关系管理 (CRM)** 或 **人力资本管理
  (HCM)** 等业务应用程序的两家主要全球供应商。该领域的其他供应商包括 `Salesforce.com`、Workday、Infor 等。一些大型全球公司可能拥有
  Oracle、SAP 和 `Salesforce.com` 的组合，无论是由于不同的业务线还是并购活动。Oracle 的业务应用程序自 2012 年起通过云作为
  SaaS 产品提供。Oracle 后来推出了其公有云平台，其当前产品称为 OCI。






  Oracle 几年前开始在其公有云上提供 IoT 平台，并进一步通过 IoT 应用程序对其进行了丰富，这些应用程序是 SaaS 产品（请参阅 https://www.oracle.com/internet-of-things/）。Oracle
  的 IoT 智能产品包括以下内容：


  - **Smart Manufacturing/Production Monitoring** — 在制品监控，最大限度地提高产品质量，并防止非计划停机

  - **Predictive Maintenance/Asset Monitoring** — 连接资产和连接产品

  - **Connected Logistics/Fleet and Shipment Monitoring** — 监控货运和仓库自动化

  - **Connected Worker** — 工人安全监控


  接下来，让我们看看 Oracle 提供的数字孪生相关功能。这里的数字孪生重点关注工业资产。Oracle 提供的功能适用于三种不同的场景，概述如下：


  - **Virtual twin**: 该孪生体是物理资产的软件等效体，可帮助模拟资产，以便在连接物理设备之前进行测试和虚拟配置等功能。

  - **Predictive twin**: 该孪生体用于捕获物理资产的预期行为，并有助于预测其未来状态，包括机器的剩余使用寿命或其对环境的影响。

  - **Twin projections**: 该孪生体适用于智能工厂、物流、**供应链管理 (SCM)**、仓储、维护和修理以及资产密集型行业中的现场服务交付等工业环境中的场景分析和规划。


  有关 Oracle 数字孪生实现的更多详细信息，请参阅 https://docs.oracle.com/en/cloud/paas/iot-cloud/iotgs/oracle-iot-digital-twin-implementation.html。


  Oracle 提供了一个 IoT 数字孪生模拟器，允许模拟来自物理资产的数据、警报和事件，而无需连接到它们。除了 IoT 和数字孪生功能外，Oracle 还为智能追踪与追溯或智能冷链解决方案提供区块链应用程序。此类功能在
  COVID-19 相关疫苗分销至消费点方面非常有用。Oracle 允许创建数字线程，可用于从产品的设计构思一直到资产整个生命周期的生产使用来追踪产品。


  Oracle IoT 数字孪生实现可能适合使用 Oracle Cloud ERP 应用程序或 OCI 用于其他目的的公司。在这种情况下，数据和应用程序将保留在
  Oracle 云上。在其他云平台上运行其业务应用程序的公司可以评估 Oracle IoT 应用程序和数字孪生功能，以满足其功能需求。


  在查看了 Microsoft Azure、Amazon AWS 和 Oracle Cloud 的产品后，我们将接下来转向更专业的产品，例如 **PTC (formerly
  Parametric Technology Corporation)**。


