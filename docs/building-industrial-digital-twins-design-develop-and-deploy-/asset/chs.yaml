  PTC ThingWorx 是一个基于 IoT 的数字孪生平台，如 _Chapter 4_、_Getting Started with Our First Digital
  Twin_ 中所述。ThingWorx 是 PTC 工程解决方案套件产品的一部分，该套件包括用于 AR 的 Vuforia、用于 **产品生命周期管理 (PLM)**
  的 Windchill 以及用于 **计算机辅助设计 (CAD)** 的 Creo。


