  在对 `George` 类进行最终更改之前，让我们创建一个数学工具类来存储一个函数，用于获取 George 位置与玩家触摸屏幕位置之间的角度。\n\n- 7.\
  \ 在 `lib` 文件夹中，创建一个名为 `utils` 的新文件夹，并在该文件夹中创建一个名为 `math_utils.dart` 的新文件。\n\n- 8.\
  \ 打开新的 `math_utils.dart` 文件并为 `getAngle` 函数添加以下代码：\n\n```\nimport 'dart:math';\n\
  import 'package:flame/components.dart';\n\ndouble getAngle(Vector2 origin, Vector2\
  \ target) {\n  double dx = target.x - origin.x;\n  double dy = -(target.y - origin.y);\n\
  \  double angleInRadians = atan2(dy, dx);\n  if (angleInRadians < 0) {\n    angleInRadians\
  \ = angleInRadians.abs();\n  } else {\n    angleInRadians = 2 * pi - angleInRadians;\n\
  \  }\n  return angleInRadians * radians2Degrees;\n}\n```\n\n我们不会详细介绍 `getAngle`\
  \ 函数的工作原理，但它使用了大多数高中数学课中涵盖的基本三角学。`getAngle` 函数将返回 0 到 360 之间的角度，0 度朝向右侧，90 度朝向下方，180\
  \ 度朝向左侧，270 度朝向上方。\n\n- 9. 打开 `george.dart` 文件并为数学工具类添加以下 imports：\n\n```\nimport\
  \ 'package:goldrush/utils/math_utils.dart';\n```\n\n- 10. 在 `George` 类中，在构造函数之后，让我们添加几个用于\
