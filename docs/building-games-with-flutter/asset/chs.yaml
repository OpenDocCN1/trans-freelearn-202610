- '## 前言'
- ''
- 凭借其强大的工具和快速实现能力，Flutter 提供了一种构建可扩展跨平台应用的新方式。在本书中，您将学习如何在现有知识基础上构建，并使用 Flutter 作为创建游戏的基础。
- ''
- "本游戏开发书籍采用从零开始构建完整游戏的实践方法。您将了解如何使用 Flame 库入门并构建一个简单的动画示例来测试 Flame。然后，您将发现如何在 Flutter\
  \ 游戏中组织和加载图片和音频。随着深入，您将了解游戏循环并将其设置为快速高效的处理。本书还指导您使用 Tiled 创建地图，向玩家可以与之交互的地图中添加精灵，并了解如何使用瓦片地图碰撞为玩家创建可行走的路径。最后，您将学习如何使用人工智能\
  \ (AI) 使敌人更加智能。\n\n读完本书，您将有信心使用 Flutter 构建有趣的跨平台游戏。\n\n## 本书适合谁阅读\n\n如果您是一名希望将 Flutter\
  \ 编程技能应用于游戏开发的 Flutter 开发人员，那么本书适合您。具备基本的 Dart 知识将有助于理解所涵盖的概念。\n\n## 本书内容概要\n\n\
  第 1 章，Flutter 游戏入门，解释了为何使用 Flutter/Dart 进行游戏编程。您将了解 Flutter 和 Dart 为何能实现跨平台游戏的快速开发，并掌握游戏编程涉及的关键概念。\n\
  \n第 2 章，使用 Flame 引擎，概述了本书中用于构建游戏的 Flame 引擎。\n\n第 3 章，构建游戏设计，介绍了我们将要构建的游戏及其设计。我们将在整本书中构建的游戏是“淘金热”，我们将了解如何规划游戏的内容和屏幕以制定游戏计划。\n\
  \n第 4 章，绘制和动画化图形，详细介绍了如何在屏幕上绘制和动画化图形。您将了解什么是精灵，如何在屏幕上移动它们，学习如何为精灵制作逼真的动画，并了解如何检测屏幕上的精灵何时相互碰撞。\n\
  \n第 5 章，使用输入移动图形，详细介绍了如何使用触摸事件和屏幕按钮移动图形。通过绘制屏幕摇杆，我们展示了如何根据用户对摇杆的控制在屏幕上移动精灵，并了解如何使用触摸屏移动精灵。\n\
  \n第 6 章，播放音效和音乐，详细介绍了如何响应游戏事件播放音乐和声音。\n\n第 7 章，设计自己的关卡，解释了如何创建游戏关卡并在它们之间导航。\n\n\
  第 8 章，为 Web 和桌面缩放游戏，详细介绍了如何通过为不同屏幕分辨率缩放图形，使同一游戏在不同平台上运行，以及由于手机缺乏物理按键，计算机与手机之间的导航可能有何不同。\n\
  \n第 9 章，实现高级图形效果，解释了如何使用强大的粒子和图层效果增强游戏图形。\n\n第 10 章，使用 AI 制作智能敌人，介绍了使用 AI 为游戏添加智能。您将了解如何使用\
  \ AI 让敌人在玩家靠近时追击玩家，从而表现得更加智能，以及如何让玩家在导航地图时避开障碍物。\n\n第 11 章，完成游戏，向您展示了如何向游戏添加额外屏幕并在它们之间导航。它还解释了您还可以学习什么以及在哪里寻求帮助。\n\
  \n## 如何充分利用本书\n\n您需要具备一些 Flutter 和 Dart 知识，但无需游戏开发知识。本书不教授 Flutter 或 Dart。\n\n假设您对自己选择的开发工具（例如\
  \ Visual Studio Code）有良好的了解。\n\n| 涵盖的软件/硬件 | 操作系统要求 |\n|---|---|\n| Flutter v3.0.0\
  \ | Windows、macOS 或 Linux |\n| Flame v1.0.0 | |\n| Dart v2.17.0 | |\n\n如果您使用的是本书的数字版，我们建议您亲自输入代码或从本书的\
  \ GitHub 仓库中获取代码（下一节中提供了链接）。这样做可以帮助您避免与复制和粘贴代码相关的潜在错误。\n\n本书的代码是使用 Visual Studio\
  \ Code 开发的，但同样适用于 Android Studio 和其他编辑器。\n\n## 下载示例代码文件\n\n您可以从 GitHub 下载本书的示例代码文件：https://github.com/PacktPublishing/Building-Games-with-Flutter。如果代码有更新，将在\
  \ GitHub 仓库中更新。\n\n我们还提供来自丰富图书和视频目录的其他代码包，可在 https://github.com/PacktPublishing/\
  \ 上查看。请查看！\n\n## 下载彩色图片\n\n我们还提供一个包含本书中使用的截图和图表彩色图像的 PDF 文件。您可以在此处下载：https://static.packt-cdn.com/downloads/9781801816984_ColorImages.pdf\n\
  \n## 本书使用的约定\n\n本书中使用了多种文本约定。\n\n### 文本中的代码\n\n表示文本中的代码词、数据库表名、文件夹名、文件名、文件扩展名、路径名、虚拟\
  \ URL、用户输入和 Twitter 账号。示例：“现在，您已完成 pubspec.yaml 文件的更新，请保存更改。”\n\n代码块设置如下：\n\n```\n\
  void main() async {\nfinal goldRush = GoldRush();\nWidgetsFlutterBinding.ensureInitialized();\n\
  await Flame.device.fullScreen();\nawait Flame.device.setPortrait();\nrunApp(\nGameWidget(game:\
  \ goldRush)\n);\n}\n```\n\n当我们希望引起您对代码块特定部分的注意时，相关行或项目将以粗体显示：\n\n```\ncd build/web/\n\
  python3 -m http.server 8000 &\n```\n\n任何命令行输入或输出均按以下方式编写：\n\n```\nflutter pub get\n\
  ```\n\n### 粗体\n\n表示新术语、重要单词或屏幕上可见的单词。例如，菜单或对话框中的单词以 **粗体** 显示。示例：当游戏中的玩家死亡并返回游戏菜单时，将显示\
  \ **“游戏结束!!”** 屏幕。\n\n### 提示或重要说明\n\n显示如下。\n\n## 联系我们\n\n我们始终欢迎读者的反馈。\n\n### 一般反馈\n\
