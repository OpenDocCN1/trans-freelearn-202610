  \ `update` 函数中，查找包含以下代码的 `else` 块：\n\n```\nif (playing) {\nstopAnimations();\n}\n\
  ```\n\n将其替换为以下代码块：\n\n```\nif (movingToTouchedLocation) {\n} else {\nif (playing)\
  \ {\nstopAnimations();\n}\n}\n```\n\n- 14. 在 `if` 代码块内部，添加以下代码以设置新的锚点位置：\n\n```\n\
  position += (targetLocation - position).normalized()\n* (speed * dt);\n```\n\n此代码根据\
  \ `targetLocation` 与当前 `position` 之间的差异更新 George 的位置，同时考虑当前 `speed` 和自上次调用更新以来的时间，以确保移动平滑。\n\
  \n- 15. 当我们到达触摸位置时，我们希望停止任何正在播放的动画并将 `movingToTouchedLocation` 设置为 `false`。\n\n\
  因为我们基于可能存在舍入误差的分数来移动角色，所以我们允许一个小阈值来决定 George 是否足够接近触摸位置，如果是，我们停止动画。所以，让我们继续在这个代码块内部并添加阈值检查：\n\
  \n```\ndouble threshold = 1.0;\nvar difference = targetLocation - position;\nif\
  \ (difference.x.abs() < threshold &&\n    difference.y.abs() < threshold) {\n  \
  \  stopAnimations();\n    movingToTouchedLocation = false;\n    return;\n}\n```\n\
  \n- 16. 最后，我们将使用之前创建的 getAngle 函数，并使用角度来决定 George 正在朝哪个方向移动以及哪个动画最接近。例如，我们只有四个动画\
  \ – 上、下、左、右 – 因此我们将通过将方向分成四个 90 度象限来近似方向，如下图所示：\n\n![](img/a63c3fccbe888cd4d04006b5e1b6c273_98_0.png)\n\
  \n图 5.2 – 移动方向的象限映射\n\n根据我们的图表，如果我们在 45 度到 135 度之间移动，我们大约在向下移动，因此可以将方向设置为下并使用 downAnimation\
  \ 正确地为精灵设置动画。请记住，0 度指向东，我们需要两个检查来向右移动，即 315 到 360 度和 0 到 45 度之间。所以，让我们为这个逻辑添加代码，继续在同一代码块中：\n\
  \n```\nplaying = true;\nvar angle = getAngle(position, targetLocation);\nif ((angle\
  \ > 315 && angle < 360) || (angle > 0 && angle < 45)) { // Moving right\nanimation\
  \ = rightAnimation;\ncurrentDirection = Character.right;\n}\n// Moving down\nelse\
  \ if (angle > 45 && angle < 135) {\nanimation = downAnimation;\ncurrentDirection\
  \ = Character.down;\n}\n// Moving left\nelse if (angle > 135 && angle < 225) {\n\
  animation = leftAnimation;\ncurrentDirection = Character.left;\n}\n// Moving up\n\
  else if (angle > 225 && angle < 315) {\nanimation = upAnimation;\ncurrentDirection\
  \ = Character.up;\n}\n```\n\n现在，如果你运行代码，可以通过触摸屏幕上的任何位置来控制 George，他会移动到那里。如果你愿意，也可以使用操纵杆。无论你更喜欢哪种移动方式，按住运行按钮仍然会让\
  \ George 跑得更快。还要注意，如果你使用触摸来移动角色，然后切换到操纵杆控制，它将中断由触摸引起的移动，允许你手动控制 George 的移动。\n\n\
  ### 摘要\n\n本章涵盖了大量内容，游戏真的开始成形了。我们学习了如何使用操纵杆和运行按钮为游戏创建屏幕控件，以及如何在屏幕上添加分数文本。然后，我们学习了一种替代方法来控制\
  \ George，即允许你触摸屏幕将他移动到触摸位置。\n\n不过，游戏目前有点安静。在大多数游戏中，音乐配乐和音效用于营造氛围并使游戏生动起来。在下一章中，我们将为游戏添加一些音乐和声音以进一步增强它。\n\
