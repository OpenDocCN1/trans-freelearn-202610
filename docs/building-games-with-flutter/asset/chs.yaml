  \ 位置。\n\n因为我们需要知道 `George` 类内部的这个坐标，所以需要将 `George` 类的引用传入 `Background` 类，以便在玩家触摸屏幕时传递点击事件。\n\
  \n要开始，让我们修改 `Background` 类：\n\n- 1. 打开 `background.dart` 文件。在类顶部添加以下构造函数和变量，用于保存对\
