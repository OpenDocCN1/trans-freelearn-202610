  \ speed: 60.0));\n} else {\n    add(Zombie(position: Vector2(position.x +\n    \
  \    gameScreenBounds.left, position.y +\n        gameScreenBounds.top), size: Vector2(32.0,\n\
  \        64.0), speed: 20.0));\n}\n```\n\n- 14. 接下来，让我们使用新的 `position` 修复 `Coin`\
