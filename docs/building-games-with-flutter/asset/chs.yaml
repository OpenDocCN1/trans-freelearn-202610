  \        gameScreenBounds.top);\n    }\n    size = Vector2(1600, 1600);\n  }\n}\n\
  ```\n\n\n\n\n在这个新类中，我们通过构造函数获取 `TiledComponent` 并将其添加为子组件，因此它将与本类位于相同的位置。然后，在 `onGameResize`\
  \ 函数中，我们正在调整该组件的位置，并将其大小固定为地图大小 1600 x 1600。\n\n接下来是 `Background` 类，在这个类中，我们想要删除\
  \ `position` 和 `size` 设置——目前这些设置发生在 `onLoad` 函数中——通过删除此函数，然后在 `onGameResize` 函数中设置\
