  bool movingToTouchedLocation = false;\n```\n\n- 11. 现在，让我们在 `Background` 组件中添加前面引用的\
  \ `moveToLocation` 函数，将 `targetLocation` 设置为传递的触摸事件，并将 `movingToTouchedLocation`\
  \ 设置为 true：\n\n```\nvoid moveToLocation(TapUpInfo info) {\n    targetLocation =\
  \ info.eventPosition.game;\n    movingToTouchedLocation = true;\n}\n```\n\n精灵具有一个默认在\
  \ Flame 中位于精灵左上角的锚点，因此如果我们在屏幕上触摸，精灵将被移动，并且精灵的左上角将与屏幕上的触摸点对齐。将精灵围绕其中心而不是左上角居中会更自然，因此让我们将锚点更新为中心。\n\
  \n- 12. 在 `onLoad` 函数底部且在添加命中框之前，添加以下代码以将锚点设置在精灵中心。\n\n```\nanchor = Anchor.center;\n\
