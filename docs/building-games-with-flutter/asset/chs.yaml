  \n### 如果您有兴趣成为作者\n\n如果您在某个主题上有专业知识，并有兴趣编写或参与编写图书，请访问 [authors.packtpub.com](authors.packtpub.com)。\n\
  \n\n\n\n\n## 第 1 部分：游戏基础\n\n本部分将向您介绍 Flutter 和 Flame 游戏引擎，以及本书中将构建的游戏（通过描述游戏设计来介绍）。\n\
  \n本部分包含以下章节：\n\n- 第 1 章，Flutter 游戏入门\n- 第 2 章，使用 Flame 引擎\n- 第 3 章，构建游戏设计\n\n##\
  \ 第 1 章：Flutter 游戏入门\n\n欢迎阅读《使用 Flutter 构建游戏》！\n\n我们将向您展示如何使用 Google 的 **Flutter**\
  \ 框架来构建可在移动端和 Web 平台上运行的可扩展游戏。Flutter 最初看起来可能是构建游戏的一个奇怪选择，因为存在更成熟的游戏开发框架，例如 Unity\
  \ 或 Unreal Engine，但其中许多工具非常复杂，难以学习，并且需要很长时间才能开始使用它们制作游戏。\n\n在您现有的 Flutter 和 **Dart**\
  \ 知识基础上，我们将带您完成构建可在所有支持平台上运行的 2D 游戏所需的步骤。从基础开始，我们将在此知识基础上逐步深入更高级的游戏主题。读完本书后，您将能够制作包含以下内容的\
  \ 2D 游戏：\n\n- 在屏幕上动画化图形\n- 播放音效和音乐\n- 使用键盘、摇杆或手势控制玩家\n- 检测图形碰撞\n- 创建游戏关卡地图并在其中导航\n\
  - 设计游戏\n- 在不同平台上缩放游戏\n- 高级图形效果\n- 智能敌人\n\n我们将通过示例介绍核心概念，并在此基础上逐章构建，最终打造一个可在不同设备上运行的完整游戏。每一章都将包含代码示例，帮助您学习游戏开发的基础模块，并提供代码、图像和声音资源来构建我们的完整游戏。该游戏涉及玩家在地图上导航，躲避敌人，同时尽可能多地收集金币。\n\
  \n在本章中，我们希望深入了解 Flutter 和 Dart 以及它们具有哪些特性，使其成为游戏开发的绝佳选择。这将让您了解为什么 Flutter 和 Dart\
  \ 可以用于在许多平台上运行快速、流畅的游戏。\n\n在本章中，我们将介绍以下主题：\n\n- 使用 Flutter\n- 使用 Dart\n- 总结本书\n\
  - 创建简单示例动画\n\n我们有很多内容要讲，那就开始吧！\n\n### 技术要求\n\n在本章中，您应该已设置好代码编辑器，并安装了最新版本的 Flutter\
  \ 和 Dart。本书基于 Flutter v3.0.0、Dart 2.17.0 和 Flame v1.0.0。\n\n本书的所有源代码均可从 Git 仓库下载：https://github.com/PacktPublishing/Building-Games-with-Flutter.git。\n\
  \n本章特有的源代码可在此处找到：https://github.com/PacktPublishing/Building-Games-with-Flutter/tree/main/chapter01。\n\
  \n### 使用 Flutter\n\n您可能之前使用过 Flutter 来构建应用程序或网站，并可能在疑惑 Flutter 是否足够好用于制作出色的游戏。Flutter\
  \ 是游戏编程的绝佳选择，原因如下：\n\n- Flutter 具有非常快的渲染时间，且可在多个平台上扩展。\n- Flutter 游戏旨在以每秒 60 帧 (FPS)\
  \ 的速度绘制以实现流畅动画，或者在支持更高刷新率的设备上以 120 FPS 绘制。\n- Flutter 代码使用单一代码库来简化维护，并使代码能够在许多设备上运行。\n\
  - Flutter 核心使用 C++ 编写，这使游戏以原生速度运行。\n- Flutter 是开源的，因此成本效益高（企业喜欢 Flutter，因为他们不必像使用某些其他框架那样为昂贵的许可证付费）。\n\
  \n与其他框架不同，Flutter 不使用原生组件，而是绘制自己的组件，所有组件均使用闪电般快速的 Skia 图形引擎绘制。Skia 是一个开源图形库，可在各种硬件和软件平台上运行，它抽象掉了每个平台上不同的特定于平台的图形\
  \ API。这些 API 提供绘制形状、文本和图像的功能。\n\n现在我们已经解释了 Flutter，让我们深入了解 Flutter 使用的语言 Dart。\n\
  \n### 使用 Dart\n\n在本节中，我们将讨论 Dart 及其使其非常适合游戏开发的语言特性。我们将讨论 Dart 如何编译，以及它如何使用线程和垃圾回收。我们还将讨论一些出色的特性，例如热重载如何帮助我们快速开发代码。\n\
  \n### 编译类型\n\n计算机编程语言可以是静态或动态的。静态语言会在运行前编译为机器码，例如 C++。动态语言由解释器执行，因此在运行前不需要编译（例如\
  \ JavaScript）。\n\n随着编程语言的发展，虚拟机被发明出来，这使得将语言移植到新硬件平台变得更加容易。代码被转换为字节码，然后在虚拟机上运行。Java\
  \ 是一种使用字节码的语言示例。\n\n虚拟机在软件中模拟硬件，并可以移植到不同的硬件平台上运行，从而使代码可移植。\n\n随着编译器技术的发展，**即时编译器**（**JIT**）被发明出来，通过即时编译代码来提高在虚拟机上运行的代码的性能。\n\
  \n将程序在运行前编译为机器码被称为**预编译**（**AOT**）编译。Dart 的独特之处在于它同时支持 JIT 和 AOT 编译类型，这为开发人员提供了巨大的优势。开发人员可以分发使用\
  \ AOT 编译的应用程序以获得最大速度和性能，这有助于游戏流畅运行。\n\n当以 JIT 编译模式运行时，Flutter 和 Dart 有一个称为**有状态热重载**（stateful\
  \ hot reload）的惊人功能，可以缩短开发时间。\n\n### 热重载\n\nFlutter 使用 JIT 编译器，让您在不到一秒钟的时间内重新加载并运行代码。这样您可以更改代码并立即在模拟器或\
  \ Web 浏览器中看到更改，同时保留游戏的内部状态。\n\n这对游戏开发非常有帮助，因为您可以修改代码并立即看到更改效果，极大地加快了开发速度。这就像用代码作画！\n\
  \n例如，您可能将图形重新定位几个像素或更改颜色。在传统开发中，您需要重新构建代码（可能需要很多分钟）才能看到更改，但在 Flutter 中，这是即时的。\n\n\
  ### 原生桥接\n\n例如 JavaScript 这样的动态语言通过桥与平台上的原生代码通信，这非常缓慢。它们这样做是为了绘制其运行平台的原生组件等操作。\n\
  \n**原生桥接**用于为所有代码提供动态代码和原生代码之间的接口，发送**用户界面（UI）**组件的状态信息。\n\n在 Flutter 中，情况并非如此，Skia\
  \ 在画布上绘制所有组件（并使它们看起来和感觉像原生组件），因此它绕过了对原生桥接的需求。\n\n这一点非常重要，因为如果使用原生桥接，您还需要在绘制之前传递\
  \ UI 组件的状态，这会减慢一切速度，并可能导致 UI 跳过帧，而不是保持动画流畅。\n\n### 垃圾回收\n\nDart 使用先进的垃圾回收系统，可以快速处理内存中的短生命周期对象。\n\
  \n由于 Flutter 每帧都会重新构建 widget 树，因此它会丢弃旧对象并重新创建新对象。在 Java 等语言中，这会引起问题，但 Dart 针对此进行了优化，可以非常快速地处理。\n\
  \n大多数语言都需要使用锁来访问共享内存，但 Dart 大多数时候可以在不使用锁的情况下执行垃圾回收。这种快速的垃圾回收带来了非常流畅的图形性能，极大地增强了我们的游戏。\n\
  \n### 线程控制\n\n由于线程的实现方式，开发人员在 Dart 中对代码执行有更多控制权。因为 Dart 通常不需要像大多数其他语言那样使用锁来访问共享内存，所以我们对代码执行有更多控制权。\n\
  \n没有锁，我们就避免了一种称为竞态条件的调用，当单独的线程想要访问共享资源（在此例中为内存）但无法访问时会发生这种情况，因为另一个线程已锁定访问权限，必须先释放锁，其他线程才能访问它。\n\
  \n在本节中，我们讨论了 Dart 语言的特性如何帮助我们编写快速游戏。在下一节中，我们将总结您在本书中将学到的内容。\n\n### 总结本书\n\n在以下小节中，让我们开始看看每一章将探讨什么。\n\
  \n### Flame\n\n在下一章（第 2 章，使用 Flame 引擎）中，我们将介绍如何使用 Flame 引擎库设置游戏循环的基础知识，以及如何组织资源以实现高效加载。\n\
  \n### 设计游戏\n\n\n\n\n\n提前规划非常重要，这样在游戏开发过程中，你就有蓝图可供参考。\n\n在 *第3章，构建游戏设计* 中，我们将讨论如何规划和设计游戏，我会在全书中持续引用这个示例。\n\
  \n### 图形\n\n除了文本游戏，所有游戏都有图形。在决定是否购买或游玩你的游戏时，图形是人们首先看到的内容，因此如果你想出售游戏，让图形看起来漂亮至关重要。\n\
  \n在 *第4章，绘制和动画化图形* 中，我们将向你展示如何在屏幕上绘制图形，以及如何为其添加动画使其看起来真实。我们还会展示如何检测图形之间的碰撞，例如子弹击中敌人，这可用于触发另一个动画，例如敌人爆炸。\n\
  \n### 输入\n\n所有游戏都需要某种输入，无论是触摸屏幕、按键还是移动虚拟摇杆来控制角色。\n\n在 *第5章，使用输入移动图形* 中，我们将解释控制角色的多种方法，使输入和动画同步，并感觉流畅且响应迅速。\n\
  \n### 声音\n\n音效和音乐在游戏中扮演着重要角色，以增强玩家的体验。背景音乐在任何游戏中也起着重要作用；在游戏过程中，音乐可以改变以突出游戏中的重要内容，或改变游戏的氛围。\n\
  \n在 *第6章，播放音效和音乐* 中，我们将讨论如何响应游戏事件同步播放音效，例如当子弹与敌人碰撞时播放爆炸音效。\n\n### 关卡设计\n\n大多数游戏并非在单屏上进行，需要精心考虑每个关卡的设计方式。\n\
  \n在第7章，设计你自己的关卡中，我们将解释如何加载当前关卡所需的图形、声音和关卡数据，以确保不会遇到内存或性能问题，这在为移动电话等低端设备开发游戏时可能是一个真正的问题。\n\
  \n我们还将解释如何制作大于物理屏幕的地图，以及如何在屏幕上导航你的玩家，并在玩家移动时滚动地图。\n\n### 跨平台游戏\n\n使用 Flutter 和 Dart\
  \ 的关键优势之一是其跨平台功能，可使游戏在多种设备上运行。我们将在第8章，为 Web 和桌面端缩放游戏中更详细地讨论此主题。\n\n### 高级图形效果\n\n\
  如前所述，图形是用户首先看到的内容，因此必须看起来令人印象深刻。\n\n在第9章，实现高级图形效果中，我们讨论高级图形效果以及可以采取什么措施让你的游戏看起来惊艳。\n\
  \n我们将使用粒子效果来增强现有图形，使游戏真正脱颖而出。\n\n我们还将讨论如何利用图形层在屏幕上有大量动画时更高效地绘制图形。\n\n### 游戏 AI\n\
  \n当游戏更加逼真时会更有趣，我们可以通过 **人工智能（AI）** 来实现这一点。\n\n在第10章，使用 AI 制作智能敌人中，我们将向你展示如何制作能够从一个位置移动到另一个位置、避开障碍物，并在看到你时追赶你的敌人。\n\
  \n### 完成游戏\n\n在第11章，完成游戏中，我们将讨论完成游戏所需的一些内容。这将包括大多数游戏都有的其他屏幕，例如用于品牌展示的启动屏幕和用于游戏选项（例如控制音乐音量）的设置屏幕。\n\
  \n我们将讨论如何在应用商店出售你的游戏，以及如何通过应用内购买增加游戏销量。\n\n最后，到本书这里为止，我们将教你游戏编程的基础知识，但你还有更多可以学习的内容。我们将讨论如果你想制作更高级的游戏，还应该学习什么，以及在制作游戏时遇到困难可以去哪里寻求帮助。\n\
  \n现在我们已对全书将要涵盖的章节做了概述，在下一节中，我们将通过一个简单的动画示例，向你展示在 Flutter 中开始游戏编程是多么容易。\n\n### 创建一个简单的示例动画\n\
  \n下面是一个你可以运行的代码示例，展示如何轻松地绘制和动画化一个简单的形状。\n\n要运行此示例，请执行以下步骤：\n\n- 1. 首先，通过运行以下命令在命令行中创建一个新项目：\n\
  \n```\nflutter create goldrush\n```\n\n- 2. 在代码编辑器中打开 Flutter 创建的 `goldrush` 文件夹，然后打开\
  \ `pubspec.yaml` 文件。\n\n- 3. 将 description 更新为以下内容：\n\n```\ndescription: Flutter\
  \ game from Building Games with Flutter\n```\n\n- 4. 将环境 SDK 更新为以下内容：\n\n```\nsdk:\
  \ \">=2.17.0 <3.0.0\"\n```\n\n这是撰写本书时的最新 SDK 版本，支持 Flutter 和 Dart 的最新功能。\n\n- 5.\
  \ 在 dependencies 部分，我们需要添加一个名为 Flame 的库（我们将在下一章中详细介绍）：\n\n```\ncupertino_icons:\
  \ ^1.0.2\nflame: 1.0.0\n```\n\nFlame 是一个很棒的库，为我们提供了使用 Flutter 和 Dart 构建游戏所需的大量功能。\n\
  \n- 6. 现在我们已完成对 `pubspec.yaml` 文件的更新，请保存更改。\n\n- 7. 保存更改后，你的代码编辑器应该会下载新的依赖项。如果没有更新，你可以在项目所在目录的命令行中手动运行以下命令：\n\
  \n```\nflutter pub get\n```\n\n- 8. 接下来，打开 lib/main.dart 文件并删除所有样板代码。\n\n- 9. 然后，我们需要设置此示例所需的导入：\n\
  \n```\nimport 'dart:ui';\nimport 'package:flame/flame.dart';\nimport 'package:flame/palette.dart';\n\
  import 'package:flutter/material.dart';\nimport 'package:flame/game.dart';\n```\n\
  \n- 10. 在这之下，我们需要添加 main 函数来初始化游戏和屏幕：\n\n```\nvoid main() async {\nfinal goldRush\
  \ = GoldRush();\nWidgetsFlutterBinding.ensureInitialized();\nawait Flame.device.fullScreen();\n\
  await Flame.device.setPortrait();\nrunApp(\nGameWidget(game: goldRush)\n);\n}\n\
  ```\n\n在这里，我们设置了 `GoldRush` 游戏对象（我们将在下一节定义），并告诉 Flame 我们希望以全屏和竖屏模式运行游戏。\n我们还运行了应用，传递了\
  \ `GameWidget`。\n\n- 11. 接下来，让我们设置游戏小部件以及游戏中将使用的一些变量：\n\n```\nclass GoldRush with\
  \ Loadable, Game {\nstatic const int squareSpeed = 250;\nstatic final squarePaint\
  \ =\nBasicPalette.green.paint();\nstatic final squareWidth = 100.0, squareHeight\
  \ =\n100.0;\nlate Rect squarePos;\nint squareDirection = 1;\nlate double screenWidth,\
  \ screenHeight, centerX,\ncenterY;\n}\n```\n\n### 让我们分解一下这里所做的操作：\n\n- 在这里，我们将正方形的动画速度设置为\
  \ 250；你可以将其调整为更高的数字来加快动画速度，或调整为更低的数字来减慢动画速度。\n- 我们将方框的颜色设置为绿色。\n- 方框的宽度和高度设置为固定的\
  \ 100 像素大小。\n- 因为我们将调整方框的位置，所以我们使用 `Rect` 表示正方形位置，它将在 `onLoad` 中初始化，一旦我们计算出屏幕中心作为起始位置。\n\
  - 我们将方向设置为正值，这将增加 `x` 值并将方框向右移动。\n- 最后，我们设置了屏幕宽度和高度以及屏幕中心的变量。\n\n- 12. 在 `onLoad`\
  \ 函数中，我们将根据屏幕尺寸计算方框的中心起始位置：\n\n```\n@override\nFuture<void> onLoad() async {\n \
  \ super.onLoad();\n  screenWidth =\n      MediaQueryData.fromWindow(window).size.width;\n\
  \  screenHeight =\n      MediaQueryData.fromWindow(window).size.height;\n  centerX\
  \ = (screenWidth / 2) - (squareWidth / 2);\n  centerY = (screenHeight / 2) - (squareHeight\
  \ / 2);\n  squarePos = Rect.fromLTWH(centerX, centerY,\n      squareWidth, squareHeight);\n\
  }\n```\n\n- 13. 接下来，我们将定义 render 函数，它在屏幕上方框当前位置绘制方框：\n\n\n\n```\n@override\nvoid\
  \ render(Canvas canvas) {\n  canvas.drawRect(squarePos, squarePaint);\n}\n```\n\n\
  - 14. 接下来，根据正方形的速度和方向，再加上自上一帧以来经过的时间，每帧更新正方形的位置。\n\n然后，如果正方形的位置已到达屏幕边缘，我们可以翻转正方形的方向：\n\
  \n```\n@override\nvoid update(double deltaTime) {\n  squarePos = squarePos.translate(squareSpeed\
  \ * squareDirection * deltaTime, 0);\n  if (squareDirection == 1 && squarePos.right\
  \ > screenWidth) {\n    squareDirection = -1;\n  } else if (squareDirection == -1\
  \ && squarePos.left < 0) {\n    squareDirection = 1;\n  }\n}\n```\n\n- 15. 现在，我们可以运行示例，看到我们简单的绿色正方形从左向右动画，当碰到屏幕边缘时反转方向。\n\
  \n现在，我们已经完成了一个简单的动画示例，展示入门有多么容易，并让你体会使用Flutter进行游戏编程的感觉。\n\n请随意修改代码，比如更改正方形的颜色或在不同位置添加更多正方形。在下一章中，我们将深入研究这段代码。\n\
  \n### 摘要\n\n本章解释了为什么Flutter和Dart非常适合多平台游戏开发。我们解释了书中各部分将重点关注的游戏构建块。最后，我们向你展示了一个可供尝试的简单代码示例。\n\
  \n在下一章中，我们将开始使用Flame，这是与Flutter配合使用以添加与游戏编程相关功能的游戏引擎库。\n\n### 问题\n\n- 1. Flutter绘制的最小恒定帧率是多少？\n\
  - 2. Flutter使用的图形引擎名称是什么？\n- 3. 我们可以用Flutter支持哪些平台？\n- 4. 什么是Skia，它用于什么？\n- 5. Dart支持哪些类型的编译，为什么它们有好处？\n\
  - 6. 为什么有状态热重载对快速游戏开发有好处？\n- 7. Dart的垃圾回收为什么对游戏中使用的平滑动画有好处？\n\n## 第2章：使用Flame引擎\n\
  \n**Flame**是一个作为库添加到你的Flutter项目中的游戏引擎。它为我们提供模块，允许构建游戏。这些包括对图像和精灵、动画、音频、碰撞检测的支持，以及更高级的2D物理和瓦片地图模块。\n\
  \n在本章中，我们将重点介绍如何开始使用Flame并了解游戏引擎的基础知识，包括其资源、游戏循环和组件。了解所有这些很重要，这样你才能很好地理解该库以及所有内容如何组合在一起以使用Flame制作游戏。\n\
  \n一旦你熟悉Flame的基础知识，就可以在本书后面学习更高级的主题。\n\n在本章中，我们将涵盖以下主题：\n\n- 组织游戏中的资源\n- 添加游戏循环\n\
  - 使用组件\n\n### 技术要求\n\n要查看本章中提到的源代码，可以在 https://github.com/PacktPublishing/Building-Games-with-Flutter/tree/main/chapter02\
  \ 下载。\n\nFlame项目发展非常迅速，因此有关任何更改或新功能，请参阅 https://flame-engine.org/docs/#/ 上的最新文档。撰写本文时，最新版本为1.0.0，已与Flutter\
  \ v3.0.0及更高版本集成。\n\n要将最新版本安装到你的项目中，请将以下内容添加到你的 `pubspec.yaml` 文件中：\n\n```\ndependencies:\n\
  flame: 1.0.0\n```\n\n保存文件后，依赖项将被下载，Flame模块将变得可用。如果你遵循了上一章末尾的示例，那么你已经完成了此设置，请确保已这样做。\n\
  \nFlame的最新版本始终可以在 https://pub.dev/packages/flame/install 的 `pub` 存储库中找到。\n\n###\
  \ 组织游戏中的资源\n\n你的游戏将包含许多资源，例如图像、音频、字体、地图和游戏数据。\n\n与Flutter一样，Flame支持资源的异步加载和缓存。但是，它还在此功能基础上构建了针对图像和音频的有用功能，以帮助有效地使用和管理这些资源。例如，如果你有一个包含许多动画帧的精灵表，你可以非常轻松地加载它们并将其拆分为单独的精灵。这在第4章“绘制和动画化图形”中有更深入的介绍。\n\
  \n你的所有资源都放在Flutter的 `assets` 文件夹下。我推荐以下文件夹结构来保持一切井井有条：\n\n```\nassets\n--- audio\n\
  -------- music\n----------- music_menu.mp3\n-------- sounds\n------------- sound_shoot.mp3\n\
  -- images\n-------- sprites\n----------- sprite_player.png\n----------- sprite_enemy.png\n\
  -- fonts\n-------- font_highscore.ttf\n-- maps\n-------- map_level.tmx\n```\n\n\
  如果存储在 `assets` 文件夹内，Flutter和Flame允许你按喜好组织资源。\n\n在你的 `pubspec.yaml` 文件中，前面的资源应该如下所示：\n\
  \n```\nflutter:\n- assets/audio/music/music_menu.mp3\n- assets/audio/sound/sound_shoot.mp3\n\
  - assets/images/sprites/player.png\n- assets/images/sprites/enemy.png\n- assets/fonts/font_highscore.ttf\n\
  - assets/maps/map_level.tmx\n```\n\n我建议在资源类型前加前缀，以便非常清楚地知道资源是什么。例如，你可能有一个播放器声音和一个播放器精灵，所以将它们命名为\
  \ `sound_player.mp3` 和 `sprite_player.png` 可以更清楚地表明它们代表的内容。\n\n此外，你应该在游戏或关卡开始时预先加载当前屏幕或关卡的任何游戏资源。Flame有一个\
  \ `onLoad()` 函数可用于覆盖此操作，我们将在下一节中进一步讨论。\n\nFlame有一些辅助函数来加载不同的资源类型：\n\n```\nawait\
  \ Flame.images.load('player.png');\nawait FlameAudio.audioCache.load('explosion.mp3');\n\
  ```\n\n这里，`load` 函数将资源加载到Flutter的内部内存缓存中以便更快地访问。另外，使用async/await很重要，因为资源是异步加载的，因此我们需要等待资源加载完成后再继续。\n\
  \n现在我们了解了如何将资源添加到游戏中，让我们来谈谈Flame如何根据当前游戏状态不断重绘屏幕。\n\n### 添加游戏循环\n\n**游戏循环**控制游戏状态的任何更新，然后在屏幕上绘制图形以反映当前游戏状态。\n\
  \n例如，玩家可能会将他们控制的角色向右移动，这将在游戏状态更新期间增加玩家精灵的 _x_ 位置。既然游戏状态已更改，玩家将在新位置绘制。\n\n在更复杂的游戏中，数百个敌方精灵也可能在移动。因此，这些精灵的状态也需要计算。\n\
  \n这在一个循环中继续，当前屏幕上的任何内容都会被更新并重绘。每次重绘称为 **游戏帧**。\n\n每秒绘制的帧数反映了游戏的流畅程度。在Flutter中，应用和游戏以每秒60\
  \ **帧（FPS）** 重绘，以允许非常流畅的重绘。\n\n在Flame中，有两个我们可以重写的函数来控制游戏状态的更新和绘制：\n\n```\nvoid update\
  \ (double deltaTime)\nvoid render (Canvas canvas)\n```\n\n让我们更详细地看看这些函数。\n\n###\
  \ 更新\n\n在 `update` 函数中，传递了一个名为 `deltaTime` 的参数，它告诉我们自上一帧绘制以来经过的时间。我们需要这个值来确保我们的精灵在不同设备上以一致的速度运行。设备的运行速度取决于处理能力，因此如果我们忽略delta值并仅以最大速度运行所有内容\n\
  \n\n\n### 渲染\n\n`render` 函数具有一个 Canvas 对象参数，它是一个我们绘图的空白画布。`canvas` 类具有许多函数，可直接在画布上绘制形状和图像，如下所示：\n\
  \n```\ncanvas.drawRect(squarePos, squarePaint);\n```\n\n在此，我们使用精灵的位置和绘制对象的颜色来在画布上绘制矩形，以应用绘图样式。绘制对象代表类似于\
  \ Web 中 CSS 的样式，通过将样式应用于正方形。在此示例中，位置是通过固定量手动更新的；但是，在 [第 5 章，使用输入移动图形] 中，我们将详细介绍如何根据用户输入来控制位置。\n\
  \n在 Flame 中，我们通过扩展某个基类来实现游戏循环，该基类会自动持续调用我们的 `update` 和 `render` 函数。在来自 [第 1 章，Flutter\
  \ 游戏入门] 的第一个示例中，我们使用了 `Game` 混入。这使我们能够覆盖 `update` 和 `render` 函数。这让我们对整个过程有很多控制权，但一旦开始绘制和更新大量精灵，就会变得非常繁琐。然后，当你开始添加输入控件和碰撞检测时，一切都会很快变得难以维护和跟踪。\n\
  \n幸运的是，Flame 提供了类来帮助处理这些问题，随着游戏的增长，我们将在下一节中进一步讨论。\n\n### 使用组件\n\n与任何不断增长的代码库一样，拥有一个结构很重要。这样，随着我们为游戏添加更多功能，代码就易于维护。\n\
  \n目前，我们的代码包含一个在屏幕上呈现和更新正方形的简单示例，使用 `Game` 混入来覆盖这些函数。使用 `Game` 混入让我们对代码有很大的控制权，但随着游戏的增长，我们将不得不编写大量额外代码来支持游戏。当你对\
  \ Flame 和游戏编程更加熟悉并需要这种控制级别时，这很好。但是，开始时，最好从 `FlameGame` 类扩展。\n\n组件为我们提供了一种结构化的方式来组织游戏，随着游戏复杂性的增加。\n\
  \n### FlameGame\n\n`FlameGame` 类基于 `Game` 混入，并添加了许多有用功能，以帮助我们管理随着游戏增长而增加的复杂性。这包括以下内容：\n\
  \n- Flame 组件系统\n- 碰撞检测跟踪\n- `render` 和 `update` 的默认实现\n\nFlame 组件系统允许我们将游戏的一部分拆分为组件（类），这些组件表示游戏中的实体，例如玩家。例如，我们可以拥有一个\
  \ `SpriteComponent` 组件来封装与玩家精灵相关的所有内容，以管理玩家碰撞到的任何对象的绘制和更新，或任何其他专门与玩家相关的状态。\n\n`FlameGame`\
  \ 类维护游戏中所有组件的列表，并且可以根据需要动态地将这些组件添加到游戏中；例如，我们可能会将多个敌人 `SpriteComponent` 组件添加到游戏中，然后在玩家消灭敌人时将它们从游戏中移除。然后，`FlameGame`\
  \ 类将遍历这些组件，指示每个组件更新并呈现自身。\n\nFlame 组件系统有多种不同类型的组件，可帮助管理游戏的不同部分。以下是一些最常见组件的列表：\n\n\
  - `SpriteComponent`: 用于管理游戏中的任何精灵\n- `JoystickComponent`: 用于管理输入的虚拟摇杆\n- `TextComponent`:\
  \ 我们在屏幕上绘制的文本，例如得分\n- `ParticleComponent`: 粒子图形效果\n\n组件系统的完整层次结构可在 https://docs.flame-engine.org/1.0.0/components.html\
  \ 查看。\n\n正如你从 Flame 网站顶部的组件图中所见，有许多组件用于处理不同的事情，但大多数有趣的组件都继承自 `PositionComponent`。\n\
  \n`PositionComponent` 组件代表屏幕上的一个对象，该对象具有用于跟踪组件位置、大小和角度方向的变量。\n\n`SpriteComponent`\
  \ 继承自 `PositionComponent`，因此它默认获得这些变量，因为我们将需要定位和设置精灵的大小。\n\n然后它添加了一些更特定于精灵的额外变量，例如\
  \ `renderFlipX` 和 `renderFlipY` 变量，用于反转绘制到画布上的任何内容。如果你有一个角色从左向右行走的图像，这很有用；通过将 `renderFlipX`\
  \ 设置为 `true`，它将反向绘制精灵图像，使其看起来像是从右向左行走。\n\n添加到 `FlameGame` 类中的任何组件也可以进行碰撞检测跟踪，一旦我们设置了组件的边界框。设置好此功能后，我们将在我们覆盖的\
  \ `onCollision` 函数中获得一个回调。这告诉我们我们的组件与哪些组件发生了碰撞。这使得原本相当难以跟踪的事情变得简单得多。我们将稍后更深入地讨论碰撞检测。\n\
  \n### 将我们的代码转换为使用组件\n\n在本节中，我们将把之前的代码转换为使用组件，以提高代码的可读性和可维护性。为此，请执行以下步骤：\n\n- 在我们的\
  \ `lib` 目录下创建一个名为 `components` 的新目录来存储组件。你可以在 Visual Studio Code 中通过右键单击 `lib` 文件夹并选择\
  \ **新建文件夹** 来执行此操作。或者，你可以在 `lib` 目录的命令行中执行此操作：\n\n```\nmkdir components\n```\n\n\
  - 在新的 `components` 目录中，创建一个名为 `player.dart` 的新文件，我们将在其中添加新的玩家组件代码。\n\n- 打开文件，让我们开始定义我们的玩家\
  \ `PositionComponent`。在文件顶部，从 Flame 库导入组件包：\n\n```\nimport 'dart:ui';\nimport 'package:flame/components.dart';\n\
  import 'package:flame/geometry.dart';\nimport 'package:flame/palette.dart';\nimport\
  \ 'package:flutter/material.dart';\n```\n\n- 接下来，我们通过覆盖 `update` 和 `render` 函数来定义\
  \ `Player` 类的轮廓：\n\n```\nclass Player extends PositionComponent {\n  @override\n\
  \  void update(double deltaTime) {\n```\n\n\n\n\n\n```\nsuper.update(deltaTime);\n\
  }\n@override\nvoid render(Canvas canvas) {\n    super.render(canvas);\n}\n}\n```\n\
  \n- 5. 重写组件的一个要求是，我们必须为 update 和 render 函数都使用 super 调用基类。\n\n在 update 和 render 函数中，让我们将\
  \ GoldRush 游戏类中的代码复制到 Player 类中，放在对基类的 super 调用之后：\n\n```\n@override\nvoid update(double\
  \ deltaTime) {\n  super.update(deltaTime);\n  squarePos = squarePos.translate(squareSpeed\
  \ *\n      squareDirection * deltaTime, 0);\n  if (squareDirection == 1 &&\n   \
  \   squarePos.right > screenWidth) {\n    squareDirection = -1;\n  } else if (squareDirection\
  \ == -1 &&\n      squarePos.left < 0) {\n    squareDirection = 1;\n  }\n}\n@override\n\
  void render(Canvas canvas) {\n  super.render(canvas);\n  canvas.drawRect(squarePos,\
  \ squarePaint);\n}\n```\n\n- 6. 在你的代码编辑器中，square 变量现在可能会被高亮显示为红色；这是因为我们尚未在这个类中定义这些变量。因此，要做到这一点，让我们从\
  \ GoldRush 类中移动它们，并将以下内容添加到 Player 类的顶部：\n\n```\nstatic const int squareSpeed =\
  \ 250;\nstatic final squarePaint =\n    BasicPalette.green.paint();\nstatic final\
  \ squareWidth = 100.0,\n    squareHeight = 100.0;\nlate Rect squarePos;\nint squareDirection\
  \ = 1;\nlate double screenWidth, screenHeight, centerX,\n    centerY;\n```\n\n-\
  \ 7. 要计算初始 square 位置、屏幕尺寸和屏幕中心，让我们将 `onLoad` 函数从 `GoldRush` 类移动到我们的 `Player` 组件内部，放在定义变量的位置下方：\n\
  \n```\n@override\nFuture<void> onLoad() async {\n  super.onLoad();\n\n  screenWidth\
  \ =\n      MediaQueryData.fromWindow(window).size.width;\n  screenHeight =\n   \
  \   MediaQueryData.fromWindow(window).size.height;\n  centerX = (screenWidth / 2)\
  \ - (squareWidth / 2);\n  centerY = (screenHeight / 2) - (squareHeight / 2);\n \
  \ squarePos = Rect.fromLTWH(centerX, centerY,\n      squareWidth, squareHeight);\n\
  }\n```\n\n- 8. 现在，在 `GoldRush` 类中，你可以移除已移动到 `Player` 类的变量以及 `render`、`update` 和\
  \ `onLoad` 函数。\n\n- 9. 接下来，让我们修改类定义，使用 `FlameGame` 类而不是 `Game` mixin：\n\n```\nclass\
  \ GoldRush extends FlameGame {\n```\n\n- 10. 在 `GoldRush` 类的导入中，你可以清理此类中不再需要的用于\
  \ `palette` 和 UI 的任何导入。\n\n现在我们将把 `Player` 组件添加到我们的 `FlameGame` 类中，以便它可以跟踪此组件用于绘制和更新目的。让我们将\
  \ `Player` 组件添加到 `GoldRush` 的 `onLoad` 函数中：\n\n```\n@override\nFuture<void> onLoad()\
  \ async {\n  super.onLoad();\n  add(Player());\n}\n```\n\n- 11. 然后，更新导入以添加 `Player`\
  \ 组件：\n\n```\nimport 'components/player.dart';\n```\n\n- 12. 现在，如果你运行游戏，你会看到一切如常运行，绿色正方形从左向右动画并弹回两侧。\n\
  \n因为我们将 `Player` 组件添加到了 `onLoad` 函数中，`FlameGame` 类现在正在跟踪该组件并调用其自身的 `onLoad` 函数来初始化精灵。然后，它会持续调用精灵的\
  \ `update` 和 `render` 函数来为正方形制作动画。\n\n如前所述，使用 `FlameGame` 类的另一个绝佳功能是，一旦我们初始化了组件的边界框，就会为每个已注册组件提供碰撞检测跟踪。那么，让我们接下来做这件事。\n\
  \n- 13. 在 `GoldRush` 类中，首先，我们按如下方式添加 `HasCollidables` mixin：\n\n```\nclass GoldRush\
  \ extends FlameGame with HasCollidables {\n```\n\n这告诉 `FlameGame` 类开始跟踪我们想要跟踪的任何可碰撞对象。\n\
  \n- 14. 在 `onLoad` 函数中，我们现在要添加一种特殊的可碰撞对象类型，叫做 `ScreenCollidable`，我们想要检查它。如果我们将 `ScreenCollidable`\
  \ 添加到要跟踪的可碰撞组件列表中，每当我们的弹跳正方形碰到屏幕边缘时，都会收到通知：\n\n```\n@override\nFuture<void> onLoad()\
  \ async {\n  super.onLoad();\n  add(Player());\n  add(ScreenCollidable());\n}\n\
  ```\n\n- 15. 此外，让我们导入 `package:flame/components.dart`，`ScreenCollidable` 就在那里，如下所示：\n\
  \n```\nimport 'package:flame/components.dart';\n```\n\n- 16. 现在，在我们的 `Player` 类中，在定义类的那一行，我们需要添加\
  \ `HasHitboxes` 和 `Collidable` mixins：\n\n```\nclass Player extends PositionComponent\
  \ with\n    HasHitboxes, Collidable {\n```\n\n这将允许我们在与屏幕边缘发生碰撞时，在 `onCollision`\
  \ 函数中接收回调，我们将在下一步实现该函数。\n\n- 17. 通过添加以下内容来实现 `onCollision` 函数：\n\n```\n@override\n\
  void onCollision(Set<Vector2> points,\n    Collidable other) {\n  if (other is ScreenCollidable)\
  \ {\n    if (squareDirection == 1) {\n      squareDirection = -1;\n    } else {\n\
  \      squareDirection = 1;\n    }\n  }\n}\n```\n\n在这里，当我们收到 `onCollision` 回调以告知我们与哪个组件发生了碰撞时，我们检查是否与\
  \ `ScreenCollidable` 发生了碰撞，如果是，我们只需翻转正方形正在移动的方向。\n\n- 18. 既然我们现在使用内置的碰撞跟踪系统，就必须正确设置精灵的位置以便设置边界框，因此我们将使用从\
  \ `PositionComponent` 组件继承的内置 position 变量。\n\n首先，你可以删除或注释掉 `squarePos` 矩形，因为我们不再需要它：\n\
  \n```\n// late Rect squarePos;\n```\n\n- 19. 然后，在 onLoad 函数中，删除或注释掉以下行：\n\n```\n\
  // squarePos = Rect.fromLTWH(centerX, centerY,\n//     squareWidth, squareHeight);\n\
  ```\n\n- 20. 在此下方，我们将设置内部变量 `position` 和 `size`：\n\n```\nposition = Vector2(centerX,\
  \ centerY);\nsize = Vector2(squareWidth, squareHeight);\n```\n\n在这里，我们基于现有变量设置位置和大小，这些变量用于计算屏幕中心，并为宽度和高度提供固定值。\n\
  \n- 21. 接下来，我们需要为 `Hitbox` mixin 添加一个形状，否则它将无法检测到与任何东西的碰撞。根据你的精灵形状以及你希望用于碰撞检测的精灵点，你可以使用几种内置形状。最常见的是，你的精灵将是矩形/正方形，因此你可以使用\
  \ `HitboxRectangle` 作为形状。但是，如果你的精灵是一个球，你会改用 `HitboxCircle`。你也可以创建自定义形状，但在大多数情况下，这是不必要的。\n\
  \n我们的形状是一个正方形，所以让我们在刚刚设置好位置和大小的地方添加用于碰撞跟踪的形状，如下所示：\n\n```\naddHitbox(HitboxRectangle());\n\
  ```\n\n- 22. 我们的 `onLoad` 函数现在应该如下所示：\n\n```\n@override\nFuture<void> onLoad() async\
  \ {\n  super.onLoad();\n\n  screenWidth =\n      MediaQueryData.fromWindow(window).size.width;\n\
  \  screenHeight =\n      MediaQueryData.fromWindow(window).size.height;\n  centerX\
  \ = (screenWidth / 2) - (squareWidth / 2);\n  centerY = (screenHeight / 2) - (squareHeight\
  \ / 2);\n  position = Vector2(centerX, centerY);\n  size = Vector2(squareWidth,\
  \ squareHeight);\n  addHitbox(HitboxRectangle());\n}\n```\n\n- 23. 既然我们已移除了 squarePos\
  \ 矩形，就需要更新 render 和 update 函数以使用内部 position 值：\n\n```\n@override\nvoid render(Canvas\
  \ canvas) {\n  super.render(canvas);\n  renderHitboxes(canvas, paint: squarePaint);\n\
  }\n```\n\n因为我们已经设置了一个形状相同并使用 PositionComponent 组件的位置和大小的 HitBox mixin，所以可以使用名为 renderHitboxes\
  \ 的内置函数来绘制我们的形状。请注意，我们传入了 squarePaint 对象以保持外观一致。\n\n在 update 函数中，我们可以移除大量代码，因为更新位置现在变得简单得多，而方向变化已经由碰撞跟踪处理：\n\
  \n```\n@override\nvoid update(double deltaTime) {\n  super.update(deltaTime);\n\
  \  position.x +=\n      squareSpeed * squareDirection * deltaTime;\n}\n```\n\n现在我们的代码看起来更好了，Player\
  \ 类正在处理更新其位置和渲染，以及处理任何碰撞。\n\n\n\n\n\n### 摘要\n\n在本章中，您了解了 Flame，这是一个用于使用 Flutter\
  \ 构建游戏的出色库。此外，您还学习了如何设置 Flame 并组织资源。我们介绍了游戏循环，以及 `render` 和 `update` 函数为什么重要。最后，我们介绍了组件，并将现有代码转换为使用组件，以便随着游戏扩展而获得更有序的结构。\n\
  \n在下一章中，我们将讨论如何使用设计模板来设计游戏，我们将为自己的游戏：金矿热！使用该模板。\n\n### 问题\n\n- 1. 传递给 `update` 函数的\
  \ `deltaTime` 值代表什么？\n- 2. Flame 组件系统如何有益于您的代码？\n- 3. 检测与方形精灵碰撞时应使用什么形状？\n\n## 第\
  \ 3 章：构建游戏设计\n\n现在我们已经讨论了 Flame 并展示了一些基本动画，我们想讨论一下在本书剩余部分中将要构建的游戏。\n\n该游戏将命名为 Gold\
  \ Rush，并具有以下目标：\n\n- 避免受到僵尸和骷髅的攻击。\n- 探索地图，在死亡前收集尽可能多的金币。\n\n这将是一个简单的游戏，但通过添加大多数游戏中包含的许多常见功能，它将教您很多技能，包括以下内容：\n\
  \n- 绘制精灵图形\n- 检测精灵之间的碰撞\n- 使用虚拟摇杆、触摸或键盘控制玩家\n- 播放音乐和音效\n- 绘制并移动比屏幕更大的地图\n- 绘制粒子和阴影等高级图形效果\n\
  - 创建智能敌人\n- 在障碍物周围导航\n- 在游戏画面之间导航\n\n我们将逐一介绍这些主题，逐步构建出一个完整的游戏。在本章中，我们将介绍以下主题：\n\n\
  - 规划游戏\n\n### 规划游戏\n\n让我们首先为我们的游戏定义一个概要，我们可以使用它来推广游戏，并向玩家简要说明他们为什么可能想玩这个游戏。以下是概要：\n\
  \n_In Gold Rush, you play as an explorer who must travel across the land in search\
  \ of wealth by collecting any gold coins you can find. Beware, though: the path\
  \ ahead won't be easy. You must avoid the zombies and skeletons that roam the land\
  \ in search of your blood!_\n\n一个简洁明了的摘要，告诉玩家游戏的目标是什么，以及他们必须做什么才能成功（收集尽可能多的金币），同时避免输掉游戏（通过避免被僵尸和骷髅攻击）。\n\
  \n在大多数游戏中，您有一个代表您自己的主角。在我们的游戏中，这是 George。\n\n![](img/a63c3fccbe888cd4d04006b5e1b6c273_43_0.png)\n\
  \n图 3.1 – 我们的主角，George\n\nGeorge 将由玩家通过触摸屏幕上的位置、控制屏幕上的摇杆或使用物理键盘上的按键来控制，在游戏地图中移动。\n\
  \nGeorge 可以奔跑以试图逃离追逐他的敌人。他的健康值以百分比计算，初始为 100%，每次被僵尸或骷髅抓住时减少 25%。一旦 George 的健康值达到\
  \ 0，游戏就结束了。\n\n游戏中有两种类型的敌人——僵尸和骷髅。\n\n![](img/a63c3fccbe888cd4d04006b5e1b6c273_44_0.png)\n\
  \n图 3.2 – 我们的游戏敌人，僵尸和骷髅\n\n当 George 附近且在敌人的视线范围内时，敌人会追逐他。当他们抓住 George 时，他们会在撞击时爆炸并死亡，使\
  \ George 的健康值减少 25%。\n\nGeorge 将冒被僵尸和骷髅杀死的风险，因为他可以通过避开敌人并收集散布在地图周围的金币而变得非常富有。\n\n\
  ![](img/a63c3fccbe888cd4d04006b5e1b6c273_44_1.png)\n\n图 3.3 – George 收集以变得更富有的金币\n\
  \n每次 George 收集一个旋转的金币时，他的得分增加 20 分。\n\nGeorge 有一个广阔的游戏世界可供探索，随着他的探索，游戏世界将在屏幕上滚动。\n\
  \n![](img/a63c3fccbe888cd4d04006b5e1b6c273_44_2.png)\n\n图 3.4 – George 可以探索的游戏世界\n\
  \n游戏世界大部分是草地，但有 George 可以遵循的路径。地图被水包围，George 无法越过水域。有一个中央钻石区域，是地图的焦点，并作为装饰被水包围。\n\
  \n游戏世界由使用 **Tiled** 应用程序制作的地图块组成，这使我们能够有效地重复使用较小的地图块来制作较大的地图。以下图像用于创建我们的游戏世界地图（可在\
  \ https://opengameart.org 获得），最初由 Luis Zuno 创建：\n\n![](img/a63c3fccbe888cd4d04006b5e1b6c273_45_0.png)\n\
  \n图 3.5 – 用于创建我们游戏世界地图的地图块图\n\n游戏将使用音乐和音效来增强游戏体验。游戏进行时会播放背景音乐，其音量可以在游戏设置中更改。\n\n\
  游戏过程中将使用三种音效：\n\n- George 移动 – George 移动时会持续播放的奔跑声。\n- 敌人死亡 – 每次敌人攻击 George 时，它会死亡并发出此声音。\n\
  - 金币 – 每次 George 收集一枚金币时，此声音将播放。\n\n如果游戏在移动设备上被放入后台，声音将停止播放。\n\n现在我们已经讨论了游戏内容，让我们讨论一下游戏画面的设计以及如何在它们之间导航。\n\
  \n### 设计游戏画面\n\n现在我们已经讨论了游戏的元素，让我们讨论一下游戏中将使用的画面以及玩家将如何在它们之间导航。\n\n以下是一个基本大纲，用于说明游戏画面的流程：\n\
  \n![](img/a63c3fccbe888cd4d04006b5e1b6c273_46_0.png)\n\n图 3.6 – Gold Rush 游戏画面流程\n\
  \n在这里，我们可以看到玩家在开始时会看到游戏菜单，他们可以在其中开始游戏、进入设置画面或退出游戏。\n\n如果他们选择 **开始游戏**，游戏将加载并开始运行。\n\
  \n如果他们选择 **设置**，他们可以调整音乐，然后返回游戏菜单。\n\n当玩家在游戏中死亡时，将显示 **游戏结束!!** 画面，然后他们可以返回游戏菜单。\n\
  \n让我们来看看这些画面的最终设计和外观。\n\n以下屏幕截图显示了游戏菜单画面：\n\n![](img/a63c3fccbe888cd4d04006b5e1b6c273_47_0.png)\n\
  \n图 3.7 – Gold Rush 的游戏菜单画面\n\n以下是 **设置** 画面的外观：\n\n![](img/a63c3fccbe888cd4d04006b5e1b6c273_48_0.png)\n\
  \n图 3.8 – Gold Rush 的设置画面\n\n图 3.9 显示了游戏结束时的画面：\n\n![](img/a63c3fccbe888cd4d04006b5e1b6c273_48_1.png)\n\
  \n图 3.9 – Gold Rush 的 **游戏结束!!** 画面\n\n以下屏幕截图显示了 Gold Rush 中的 George、敌人、地图和虚拟控件：\n\
  \n![](img/a63c3fccbe888cd4d04006b5e1b6c273_49_0.png)\n\n图 3.10 – 显示 George、敌人、地图和虚拟控件的游戏画面\n\
  \n在本节中，我们介绍了游戏画面的外观以及如何在它们之间导航。\n\n### 摘要\n\n在本章中，我们讨论了游戏的目标以及精灵和画面的外观。\n\n在规划游戏时，尝试像本章中讨论的那样制定一份游戏设计文档，因为它将是您打算构建的游戏的有用蓝图，可在游戏开发过程中参考。\n\
  \n尝试思考您想要添加的内容，即使您还不知道它最终的样子。如果您还没有决定使用哪些精灵，甚至可以画简单的火柴人来表示精灵。\n\n在下一章中，我们将开始构建游戏，从绘制和动画制作精灵开始。\n\
  \n### 问题\n\n- 1. 为您的游戏编写概要是个好主意吗？\n- 2. 当敌人攻击 George 时，他会损失多少生命值？\n- 3. George 收集一枚金币能获得多少分？\n\
  - 4. 地图上的水有什么用途？\n\n\n\n\n\n## 第2部分：图形与声音\n\n在本书的这一部分中，我们将演示如何使用Flame库的媒体功能来动画化图形并播放声音。我们还将讨论如何根据玩家输入来动画化图形。最后，我们将讨论关卡设计以及如何将游戏扩展到多个平台。\n\
  \n本部分包含以下章节：\n\n- 第4章，绘制和动画化图形\n- 第5章，使用输入移动图形\n- 第6章，播放音效和音乐\n- 第7章，设计您自己的关卡\n\
  - 第8章，为Web和桌面扩展游戏\n\n## 第4章：绘制和动画化图形\n\n在本章中，我们将超越绘制简单形状，讨论如何绘制和动画化大多数游戏中常见的像素图形。这将使我们的游戏看起来好得多，并随着角色在屏幕周围动画化而让游戏栩栩如生。\n\
  \n在游戏编程中，绘制到屏幕上的图形或图像称为精灵，它可以是从单个非动画图像、带有多个动画帧的玩家角色，甚至是绘制在屏幕上其他图形后面的背景图像等任何东西。\n\
  \n我们将首先展示如何加载和绘制一个简单的精灵来代替我们的方形，然后动画化精灵以显示移动。接下来，我们将在屏幕上移动精灵，动画将根据精灵当前移动的方向而变化。\n\
  \n最后，我们将创建一个敌人精灵，让玩家精灵与其碰撞，在此基础上扩展我们的碰撞检测知识。\n\n因此，我们将涵盖以下主题：\n\n- 在屏幕上绘制\n- 使用精灵动画\n\
  - 在屏幕上移动精灵\n- 与其他精灵碰撞\n\n让我们通过设置本章将使用的资源来开始。\n\n### 技术要求\n\n要查看本章的源代码，可以从 https://github.com/PacktPublishing/Building-Games-with-Flutter/tree/main/chapter04\
  \ 下载。\n\n本章还需要下载一些图片用于动画。\n\n另外，我使用了从以下链接下载的精灵表：\n\n- 对于我们的玩家角色，我们将使用位于 https://github.com/PacktPublishing/Building-Games-with-Flutter/blob/main/chapter04/assets/images/george.png\
  \ 的精灵表图片。\n- 对于敌人，我们将使用位于 https://github.com/PacktPublishing/Building-Games-with-Flutter/blob/main/chapter04/assets/images/zombie_n_skeleton.png\
  \ 的精灵表图片。\n\n现在，我们将按照以下步骤将图片添加到游戏中：\n\n1. 打开文件管理器，进入项目的 `goldrush` 文件夹。\n2. 在 `goldrush`\
  \ 文件夹中创建一个名为 `assets` 的文件夹。\n3. 进入 `assets` 文件夹，再创建一个名为 `images` 的文件夹。\n4. 将我们下载的两张图片移动到\
  \ `images` 文件夹中。\n\n如果一切设置正确，您的目录结构将如下所示：\n\n```\ngoldrush\n--- assets\n----- images\n\
  --------- george.png\n--------- zombie_n_skeleton.png\n```\n\n5. 接下来，打开项目文件夹中的 `pubspec.yaml`\
  \ 文件。\n6. 通过删除此行开头的 `#` 符号来取消 `assets` 行的注释：\n\n```\n### assets:\n```\n\n7. 接下来，在\
  \ `asset` 行下方添加以下几行（注意缺少 #）：\n\n```\nassets:\n  - assets/images/george.png\n  -\
  \ assets/images/zombie_n_skeleton.png\n```\n\n8. 如果您现在保存 `pubspec.yaml` 文件，它将检查文件中的更改以确认设置正确。如果没有发生这种情况，您可以从终端手动运行以下命令：\n\
  \n```\nflutter pub get\n```\n\n在本节中，我们下载并设置了本章将使用的精灵。\n\n在下一节中，我们将看到如何加载包含多个动画帧的精灵表并将精灵绘制到屏幕上。\n\
  \n### 在屏幕上绘制\n\n既然我们已经熟悉在上一章中介绍的在屏幕上绘制基本形状，我们将扩展知识并开始绘制在游戏中更常见的精灵。\n\n让我们为我们的角色George创建一个新的\
  \ `SpriteComponent` 并加载精灵表：\n\n1. 在 `components` 文件夹中，创建一个名为 `george.dart` 的新文件。\n\
  2. 打开文件，在文件顶部添加以下导入：\n\n```\nimport 'package:flame/components.dart';\nimport 'package:flame/flame.dart';\n\
  import 'package:flame/sprite.dart';\nimport 'package:flutter/material.dart';\nimport\
  \ 'dart:ui';\n```\n\n3. 创建一个名为 George 的类，它扩展 `SpriteComponent`：\n\n```\nclass George\
  \ extends SpriteComponent {\n}\n```\n\n4. 在类顶部，让我们为精灵、屏幕尺寸和精灵大小定义一些变量：\n\n```\n\
  late double screenWidth, screenHeight, centerX,\ncenterY;\nlate double georgeSizeWidth\
  \ = 48.0, georgeSizeHeight\n= 48.0;\n```\n\n由于精灵表的大小为 192 x 192 像素，包含四行和四列，这意味着每个单独的帧宽度和高度为\
  \ `192 / 4 = 48` 像素，这正是我们将 `georgeSizeWidth` 和 `georgeSizeHeight` 的值设置为的内容。\n\n\
  5. 接下来，我们将重写 `onLoad` 函数，设置屏幕变量，加载精灵表，并设置精灵的位置和大小：\n\n```\n@override\nFuture<void>\
  \ onLoad() async {\nsuper.onLoad();\nscreenWidth =\nMediaQueryData.fromWindow(window).size.width;\n\
  screenHeight =\nMediaQueryData.fromWindow(window).size.height;\ncenterX =\n(screenWidth\
  \ / 2) - (georgeSizeWidth / 2);\ncenterY =\n(screenHeight / 2) - (georgeSizeHeight\
  \ / 2);\nvar spriteImages =\nawait Flame.images.load('george.png');\nfinal spriteSheet\
  \ = SpriteSheet(image:\n```\n\n```\nspriteImages, srcSize: Vector2(georgeSizeWidth,\n\
  georgeSizeHeight));\nsprite = spriteSheet.getSprite(0, 0);\nposition = Vector2(centerX,\
  \ centerY);\nsize = Vector2(georgeSizeWidth, georgeSizeHeight);\n}\n```\n\n在这里，我们使用\
  \ Flame 辅助类来加载精灵表图片并设置精灵。\n\n目前，我们将获取第一个精灵帧并只显示该帧。我们获取的第一帧在精灵表中的位置是 0, 0：\n\n![](img/a63c3fccbe888cd4d04006b5e1b6c273_56_0.png)\n\
  \n图 4.1 – 位于 0, 0 的精灵\n\n6. 现在，让我们切换到 `main.dart` 文件，以便可以添加 George 组件并在屏幕上看到它。在\
  \ `onLoad` 函数中，我们可以删除添加 `Player` 和 `ScreenCollidable` 组件的行，并添加 `George` 组件，如下所示：\n\
  \n```\n@override\nFuture<void> onLoad() async {\nsuper.onLoad();\nadd(George());\n\
  }\n```\n\n7. 我们现在可以删除用于显示绿色方块的 `Player` 和 `ScreenCollidable` 组件的以下导入，我们在第2章“使用Flame引擎”中使用过它：\n\
  \n```\nimport 'components/player.dart';\nimport 'package:flame/components.dart';\n\
  ```\n\n8. 并且，由于我们不再使用 `Player` 组件，我们还可以删除包含 `Player` 组件的 `player.dart` 文件，该文件已不再需要。\n\
  \n9. 由于我们已添加 `George` 组件，需要在文件顶部与其他导入一起添加该类的导入：\n\n```\nimport 'package:goldrush/components/george.dart';\n\
  ```\n\n如果您现在运行游戏，将看到一个显示George在黑色背景上的单帧。\n\n然而，在黑色背景上很难看清，因此让我们创建一个 `Background`\
  \ 组件并更改背景颜色，它将在George之前绘制，以便我们可以更清楚地看到精灵。\n\n10. 在 `components` 文件夹中，创建一个名为 `background.dart`\
  \ 的新文件。打开文件并输入以下导入和代码：\n\n```\nimport 'package:flame/components.dart';\nimport 'package:flame/palette.dart';\n\
  import 'package:flutter/material.dart';\nimport 'dart:ui';\nclass Background extends\
  \ PositionComponent {\n static final backgroundPaint =\n BasicPalette.white.paint();\n\
  \ late double screenWidth, screenHeight;\n @override\n Future<void> onLoad() async\
  \ {\n super.onLoad();\n screenWidth = MediaQueryData.fromWindow(window).size.width;\n\
  \ screenHeight =\n MediaQueryData.fromWindow(window).size.height;\n position = Vector2(0,\
  \ 0);\n size = Vector2(screenWidth, screenHeight);\n }\n @override\n void render(Canvas\
  \ canvas) {\n```\n\n\n\n```\nsuper.render(canvas);\ncanvas.drawRect(Rect.fromPoints(position.toOffset(),\n\
  size.toOffset()), backgroundPaint);\n}\n}\n```\n\n在 `onLoad` 函数中，我们将 `backgroundPaint`\
  \ 设置为白色，以使 George 精灵更加可见。我们还将位置设置为 0, 0，将大小设置为屏幕的完整宽度和高度，因此当我们在 render 函数中绘制白色时，它将覆盖整个屏幕。\n\
  \n### 11. 回到 `main.dart` 文件，让我们在文件顶部添加 `import`，并将 `Background` 组件添加到 `onLoad` 函数中：\n\
  \n```\nimport 'components/background.dart';\n\n@override\nFuture<void> onLoad()\
  \ async {\n  super.onLoad();\n  add(Background());\n  add(George());\n}\n```\n\n\
  请注意，我们在 `George` 组件之前添加 `Background` 组件，以便它先被绘制。\n\n如果运行此代码，您现在将看到 George 在白色背景上绘制，这更容易看到：\n\
  \n![](img/a63c3fccbe888cd4d04006b5e1b6c273_59_0.png)\n\n图 4.2 – 白色背景上的 George\n\n\
  在下一节中，我们将讨论如何为 George 制作动画，而不是仅显示单帧。\n\n### 使用精灵动画\n\n让我们修改 `George` 类，使其播放动画序列而不是仅显示单帧，具体操作是更改类：\n\
  \n- 1. 首先，将类定义更改为继承自 `SpriteAnimationComponent`，而不是 `SpriteComponent`：\n\n```\n\
  class George extends SpriteAnimationComponent {\n```\n\n- 2. 因为我们将在 SpriteAnimationComponent\
  \ 中设置动画，可以删除对 georgeSprite 的引用，因为这将由类管理。因此，让我们删除或注释掉以下行：\n\n```\n// late Sprite\
  \ georgeSprite;\n// georgeSprite = spriteSheet.getSprite(0, 0);\n```\n\n现在您也可以删除或注释\
  \ render 函数，因为绘制将由类管理：\n\n```\n// @override\n// void render(Canvas canvas) {\n//\
  \   super.render(canvas);\n//   georgeSprite.render(canvas);\n// }\n```\n\n- 3.\
  \ 要从我们设置的精灵表中创建动画，SpriteSheet 类有一个 createAnimation 辅助函数，允许我们设置动画应从哪一行创建。如果您仔细查看我们的\
  \ george.png 文件，会发现我们的动画位于列中，而不是行中。在撰写本文时，Flame createAnimation 库的当前版本适用于行而非列，因此我们将使用\
  \ Dart 扩展向 SpriteSheet 类添加一个也适用于列的 createAnimation 变体。在 george.dart 中 SpriteAnimationComponent\
  \ 的类定义之后，添加以下内容：\n\n```\nextension CreateAnimationByColumn on SpriteSheet {\n  SpriteAnimation\
  \ createAnimationByColumn({\n    required int column,\n    required double stepTime,\n\
  \    bool loop = true,\n    int from = 0,\n    int? to,\n  }) {\n    to ??= columns;\n\
  \    final spriteList = List<int>.generate(to - from,\n    (i) => from + i)\n  \
  \          .map((e => getSprite(e, column))\n            .toList();\n        return\
  \ SpriteAnimation.spriteList(\n        spriteList,\n        stepTime: stepTime,\n\
  \        loop: loop,\n        );\n        }\n        }\n```\n\n此扩展将基于列创建精灵列表，然后从精灵列表创建\
  \ `SpriteAnimation`。\n\n- 4. 现在，我们可以使用精灵列表创建动画，并将其分配给我们的 `SpriteAnimationComponent`\
  \ animation 字段。在 `onLoad` 函数的末尾，添加以下代码：\n\n```\nanimation = spriteSheet.createAnimationByColumn(\n\
  \ column: 0, stepTime: 0.2);\n```\n\n在这里，我们调用新的 `createAnimationByColumn` 扩展函数，为第一列动画传递\
  \ `0`，并将 `stepTime` 动画速度设置为 `0.2`，这使动画看起来像正常的步行速度。\n\n现在，我们通过绘制多个帧来扩展精灵，以创建动画。\n\
  \n在下一节中，我们将为 George 的每个方向设置动画，并在屏幕上移动他，每隔几秒钟更改方向，并更改动画以匹配他移动的方向。\n\n### 在屏幕上移动精灵\n\
  \n既然 George 精灵已经可以动画，我们将在此基础上继续，根据行进方向更改动画：\n\n- 1. 让我们在 `George` 类顶部添加一些变量，以存储动画和方向信息：\n\
  \n```\nlate SpriteAnimation georgeDownAnimation,\n georgeLeftAnimation, georgeUpAnimation,\n\
  \ georgeRightAnimation;\n double elapsedTime = 0.0;\n double georgeSpeed = 40.0;\n\
  \ int currentDirection = down;\n static const int down = 0, left = 1, up = 2,\n\
  \ right = 3;\n```\n\n- 2. 在 `onLoad` 函数下方，定义一个名为 `changeDirection` 的新函数，我们将每 3 秒调用一次，以随机更改\
  \ George 的方向：\n\n```\nvoid changeDirection() {\n Random random = Random();\n int\
  \ newDirection = random.nextInt(4);\n switch (newDirection) {\n case down:\n animation\
  \ = georgeDownAnimation;\n break;\n case left:\n animation = georgeLeftAnimation;\n\
  \ break;\n case up:\n animation = georgeUpAnimation;\n break;\n case right:\n animation\
  \ = georgeRightAnimation;\n break;\n }\n currentDirection = newDirection;\n}\n```\n\
  \n在这里，我们生成 0 到 3 之间的随机数，映射到我们的列。然后，我们将 `animation` 类字段设置为使用动画，我们将稍后初始化这些动画。最后，我们将当前方向设置为新方向，以后可以用它来移动精灵。\n\
  \n- 3. 在 `onLoad` 函数底部，删除设置类字段 animation 的行，因为我们现在在 `changeDirection` 函数中执行此操作，并用以下行替换它以初始化动画：\n\
  \n```\ngeorgeDownAnimation =\nspriteSheet.createAnimationByColumn(column: 0,\nstepTime:\
  \ 0.2);\ngeorgeLeftAnimation =\nspriteSheet.createAnimationByColumn(column: 1,\n\
  stepTime: 0.2);\ngeorgeUpAnimation =\nspriteSheet.createAnimationByColumn(column:\
  \ 2,\nstepTime: 0.2);\ngeorgeRightAnimation =\nspriteSheet.createAnimationByColumn(column:\
  \ 3,\nstepTime: 0.2);\nchangeDirection();\n```\n\n- 4. 现在我们已经设置好动画，让我们添加一个 `update`\
  \ 函数，每 3 秒更改一次方向，并使精灵沿动画面向的相同方向移动。在 `changeDirection` 函数下方，添加以下 `update` 函数代码：\n\
  \n```\n@override\nvoid update(double deltaTime) {\n super.update(deltaTime);\n elapsedTime\
  \ += deltaTime;\n if (elapsedTime > 3.0) {\n changeDirection();\n elapsedTime =\
  \ 0.0;\n }\n switch (currentDirection) {\n case down:\n position.y += georgeSpeed\
  \ * deltaTime;\n break;\n case left:\n position.x -= georgeSpeed * deltaTime;\n\
  \ break;\n case up:\n position.y -= georgeSpeed * deltaTime;\n break;\n case right:\n\
  \ position.x += georgeSpeed * deltaTime;\n break;\n }\n}\n```\n\n- 5. 最后，让我们通过在文件顶部添加以下行来修复\
  \ `Random` 类的 import：\n\n```\nimport 'dart:math';\n```\n\n如果您现在运行代码，将看到 George 移动\
  \ 3 秒钟，然后随机更改方向，如果随机数与前 3 秒相同，则偶尔会继续沿同一方向移动。如果运行一段时间，您可能会看到 George 从屏幕一侧消失，因为我们目前没有检测他是否与屏幕边缘发生碰撞。\n\
  \n在下一节中，我们将让 George 在碰到屏幕边缘时反转方向，并添加在屏幕上移动的僵尸和骷髅，如果 George 与它们碰撞，它们就会死亡。\n\n###\
  \ 与其他精灵碰撞\n\n让我们修复上一节末尾看到的 George 离开屏幕边缘的问题，如果他碰到屏幕边缘则反转方向。为此，请执行以下步骤：\n\n- 1. 在\
  \ `main.dart` 的 `onLoad` 函数中，让我们在函数底部添加 `ScreenCollidable` 组件，以便我们可以检测 George 与屏幕边缘之间的碰撞：\n\
  \n```\nadd(ScreenCollidable());\n```\n\n- 2. 在 `george.dart` 文件中，更改类定义以添加 `HasHitBoxes`\
  \ 和 `Collidable` 混入：\n\n```\nclass George extends SpriteAnimationComponent with\n\
  HasHitBoxes, Collidable {\n```\n\n- 3. 在 `onLoad` 函数底部，添加 `HitboxRectangle` 形状用于碰撞检测：\n\
  \n\n\n```\naddHitbox(HitboxRectangle());\n```\n\n- 4. 在文件顶部添加以下 import 以解析对 HitboxRectangle\
  \ 的引用：\n\n```dart\nimport 'package:flame/geometry.dart';\n```\n\n- 5. 在此类文件底部，在\
  \ update 函数定义之后，添加以下 onCollision 函数定义：\n\n```dart\n@override\nvoid onCollision(Set<Vector2>\
  \ points,\n    Collidable other) {\n  if (other is ScreenCollidable) {\n    switch\
  \ (currentDirection) {\n      case down:\n        currentDirection = up;\n     \
  \   animation = georgeUpAnimation;\n        break;\n      case left:\n        currentDirection\
  \ = right;\n        animation = georgeRightAnimation;\n        break;\n      case\
  \ up:\n        currentDirection = down;\n        animation = georgeDownAnimation;\n\
  \        break;\n      case right:\n        currentDirection = left;\n        animation\
  \ = georgeLeftAnimation;\n        break;\n    }\n    elapsedTime = 0.0;\n  }\n}\n\
  ```\n\n在这里，如果 George 与屏幕边缘发生碰撞，我们会翻转 currentDirection 和 animation；例如，如果 George 正在向右移动，他现在将向左移动，动画将变为\
  \ georgeLeftAnimation。我们还将 elapsedTime 重置为 0.0，以便我们的 3 秒计数器重新开始。\n\n如果你现在运行游戏，你会看到过一段时间后，当\
  \ George 碰到屏幕侧边时，他会翻转方向并且动画会更新。\n你可以更改 `georgeSpeed` 变量的值来加快此过程（如果你喜欢）。\n\n接下来，让我们向游戏中添加僵尸和骷髅！\n\
  \n如果你查看僵尸和骷髅的精灵图表，你会注意到两者都在同一个精灵图表中，两者都按行和列组织，并且每行都有一个僵尸和一个骷髅。因此，在构建动画时，我们必须指定 `from`\
  \ 和 `to` 字段，以指示精灵图表的哪部分构成动画。\n\n例如，对于使僵尸向左行走的动画，它位于第 1 行，从第 0 列到第 2 列。精灵图像宽 192\
  \ 像素，高 256 像素，水平方向包含六帧，垂直方向包含四帧，因此计算精灵大小的方法如下：\n\n```\n192 / 6 = 32\n256 / 4 = 64\n\
  ```\n\n因此，我们的精灵大小为宽 32 像素，高 64 像素：\n\n![](img/a63c3fccbe888cd4d04006b5e1b6c273_66_0.png)\n\
  \n图 4.3 – 敌人精灵，显示每帧的大小\n\n如果我们为僵尸和骷髅创建一个类，代码将非常类似于 `George` 类，因为我们需要加载精灵、将它们组织成动画、根据方向更新动画，并且如果碰到屏幕边缘则翻转方向。\n\
  \n为了避免大量不必要的代码重复，我们将为所有精灵创建一个基类来实现此通用功能。然后，单独的类将更小，以保持代码简洁且易于阅读。\n\n首先，我们将 `George`\
  \ 类中的大量代码移动到一个新的基类中，我们将其命名为 `Character`。在此过程中，我们将使变量名更具通用性，例如将 `georgeSpeed` 重命名为\
  \ `speed`，并添加一个构造函数来传递位置、大小和速度等值，以使其更具灵活性。\n\n- 6. 在 `components` 文件夹中，创建一个名为 `character.dart`\
  \ 的新文件，并添加以下类定义：\n\n```dart\nimport 'dart:math';\nimport 'package:flame/components.dart';\n\
  import 'package:flame/sprite.dart';\nclass Character extends SpriteAnimationComponent\
  \ with\nHasHitboxes, Collidable {\n}\n```\n\n- 7. 接下来，我们添加一个构造函数来传递位置、大小和速度，以及一些用于动画和方向信息的变量：\n\
  \n```dart\nCharacter({required Vector2 position,\nrequired Vector2 size, required\
  \ double speed}) {\nthis.position = position;\nthis.size = size;\nthis.speed = speed;\n\
  }\n\nlate SpriteAnimation downAnimation, leftAnimation,\nupAnimation, rightAnimation;\n\
  late double speed;\ndouble elapsedTime = 0.0;\nint currentDirection = down;\nstatic\
  \ const int down = 0, left = 1, up = 2,\nright = 3;\n```\n\n如你所见，此基类中的变量命名现在更具通用性。\n\
  \n- 8. 接下来，我们将三个函数（changeDirection、update 和 onCollision）从 George 类迁移到 Character\
  \ 类中。\n\n首先，我们将添加 changeDirection 函数：\n\n```dart\nvoid changeDirection() {\nRandom\
  \ random = new Random();\nint newDirection = random.nextInt(4);\nswitch (newDirection)\
  \ {\ncase down:\n    animation = downAnimation;\n    break;\ncase left:\n    animation\
  \ = leftAnimation;\n    break;\ncase up:\n    animation = upAnimation;\n    break;\n\
  case right:\n    animation = rightAnimation;\n    break;\n}\ncurrentDirection =\
  \ newDirection;\n}\n```\n\n现在我们已经添加了 changeDirection，让我们添加 update 函数：\n\n```dart\n\
  @override\nvoid update(double deltaTime) {\nsuper.update(deltaTime);\nelapsedTime\
  \ += deltaTime;\nif (elapsedTime > 3.0) {\n    changeDirection();\n    elapsedTime\
  \ = 0.0;\n}\nswitch (currentDirection) {\ncase down:\n    position.y += speed *\
  \ deltaTime;\n    break;\ncase left:\n    position.x -= speed * deltaTime;\n   \
  \ break;\ncase up:\n    position.y -= speed * deltaTime;\n    break;\ncase right:\n\
  \    position.x += speed * deltaTime;\n    break;\n}\n}\n```\n\n接下来，让我们添加 onCollision\
  \ 函数：\n\n```dart\n@override\nvoid onCollision(Set<Vector2> points,\n    Collidable\
  \ other) {\n    if (other is ScreenCollidable) {\n    switch (currentDirection)\
  \ {\n    case down:\n    currentDirection = up;\n    animation = upAnimation;\n\
  \    break;\n    case left:\n    currentDirection = right;\n    animation = rightAnimation;\n\
  \    break;\n    case up:\n    currentDirection = down;\n    animation = downAnimation;\n\
  \    break;\n    case right:\n    currentDirection = left;\n    animation = leftAnimation;\n\
  \    break;\n    }\n    elapsedTime = 0.0;\n    }\n}\n}\n```\n\n从这三个函数可以看出，它们与 `George`\
  \ 类中的功能相同，但我们现在将变量命名得更具通用性，这对于基类来说更好。\n\n因为我们为 `George` 类创建了一个按列创建动画的扩展函数，我们也将其带到\
  \ `character.dart` 文件中。该函数将可供我们所有精灵使用，以便我们可以按列或按行创建动画。\n\n在 `Character` 基类的类定义之后，以及\
  \ `character.dart` 文件的底部，添加 `createAnimationByColumn` 的扩展代码：\n\n```dart\nextension\
  \ CreateAnimationByColumn on SpriteSheet {\n  SpriteAnimation createAnimationByColumn({\n\
  \    required int column,\n    required double stepTime,\n    bool loop = true,\n\
  \    int from = 0,\n    int? to,\n  }) {\n    to ??= columns;\n    final spriteList\
  \ =\n        List<int>.generate(to - from, (i) => from + i)\n        .map((e) =>\
  \ getSprite(e, column))\n        .toList();\n    return SpriteAnimation.spriteList(\n\
  \      spriteList,\n      stepTime: stepTime,\n      loop: loop,\n    );\n  }\n\
  }\n```\n\n现在我们已设置好 `Character` 基础组件，这使得 `George` 类简单得多。\n\n- 9. 在 `George` 类中，删除所有代码并替换为以下内容：\n\
  \n```dart\nimport 'package:flame/components.dart';\nimport 'package:flame/flame.dart';\n\
  import 'package:flame/geometry.dart';\nimport 'package:flame/sprite.dart';\nimport\
  \ 'package:goldrush/components/character.dart';\nclass George extends Character\
  \ {\n  George({\n    required Vector2 position,\n    required Vector2 size, required\
  \ double speed}):\n      super(position: position, size: size,\n      speed: speed);\n\
  \  @override\n  Future<void> onLoad() async {\n    super.onLoad();\n    var spriteImages\
  \ =\n    await Flame.images.load('george.png');\n    final spriteSheet = SpriteSheet(image:\n\
  \    spriteImages, srcSize: Vector2(width, height));\n    downAnimation =\n    spriteSheet.createAnimationByColumn(column:\
  \ 0,\n    stepTime: 0.2);\n    leftAnimation =\n    spriteSheet.createAnimationByColumn(column:\
  \ 1,\n    stepTime: 0.2);\n    upAnimation =\n    spriteSheet.createAnimationByColumn(column:\
  \ 2,\n    stepTime: 0.2);\n    rightAnimation =\n    spriteSheet.createAnimationByColumn(column:\
  \ 3,\n    stepTime: 0.2);\n    changeDirection();\n    addHitbox(HitboxRectangle());\n\
  \  }\n}\n```\n\n如你所见，我们只需要加载精灵图表并设置动画即可。代码量大大减少，现在它从基类继承了方向、移动和碰撞代码，因此更加简洁。\n\n\
  - 10. 现在，让我们为僵尸设置一个类。在 `components` 文件夹中，创建一个名为 `zombie.dart` 的新文件并添加以下代码：\n\n```dart\n\
  import 'package:flame/components.dart';\nimport 'package:flame/flame.dart';\nimport\
  \ 'package:flame/geometry.dart';\nimport 'package:flame/sprite.dart';\nimport 'package:goldrush/components/character.dart';\n\
  class Zombie extends Character {\n  Zombie({required Vector2 position, required\
  \ Vector2 size, required double speed}) : super(position: position, size: size,\
  \ speed: speed);\n\n  @override\n  Future<void> onLoad() async {\n    super.onLoad();\n\
  \    var spriteImages = await\n```\n\n\n\n\n\n```\nFlame.images.load('zombie_n_skeleton.png');\n\
  final spriteSheet = SpriteSheet(image:\nspriteImages, srcSize: size);\ndownAnimation\
  \ = spriteSheet.createAnimation(\nrow: 0, stepTime: 0.2, from: 0, to: 2);\nleftAnimation\
  \ = spriteSheet.createAnimation(\nrow: 1, stepTime: 0.2, from: 0, to: 2);\nupAnimation\
  \ = spriteSheet.createAnimation(\nrow: 3, stepTime: 0.2, from: 0, to: 2);\nrightAnimation\
  \ = spriteSheet.createAnimation(\nrow: 2, stepTime: 0.2, from: 0, to: 2);\nchangeDirection();\n\
  \naddHitbox(HitboxRectangle());\n}\n}\n```\n\n同样，代码量很小，只是在 onLoad 函数中设置动画。由于它继承自\
  \ Character 类，因此获得了与 George 相同的所有代码。\n\n这里的主要区别在于，我们使用精灵表自带的 createAnimation 函数，而不是我们的扩展函数，因为这个精灵表是按行排列而不是按列。对于僵尸，动画帧位于第\
  \ 0 列到第 2 列，因此我们在 createAnimation 调用中也添加了这些参数。\n\n- 11. 现在，让我们设置骷髅敌人。在 components\
  \ 文件夹中，创建一个名为 skeleton.dart 的新文件，并添加以下代码：\n\n```\nimport 'package:flame/components.dart';\n\
  import 'package:flame/flame.dart';\nimport 'package:flame/geometry.dart';\nimport\
  \ 'package:flame/sprite.dart';\nimport 'package:goldrush/components/character.dart';\n\
  class Skeleton extends Character {\nSkeleton({required Vector2 position, required\n\
  Vector2 size, required double speed}) : super(\nposition: position, size: size,\
  \ speed: speed);\n@override\nFuture<void> onLoad() async {\nsuper.onLoad();\nvar\
  \ spriteImages = await\nFlame.images.load('zombie_n_skeleton.png');\nfinal spriteSheet\
  \ = SpriteSheet(\n image: spriteImages, srcSize: size);\n downAnimation = spriteSheet.createAnimation(\n\
  \ row: 0, stepTime: 0.2, from: 3, to: 5);\n leftAnimation = spriteSheet.createAnimation(\n\
  \ row: 1, stepTime: 0.2, from: 3, to: 5);\n upAnimation = spriteSheet.createAnimation(\n\
  \ row: 3, stepTime: 0.2, from: 3, to: 5);\n rightAnimation = spriteSheet.createAnimation(\n\
  \ row: 2, stepTime: 0.2, from: 3, to: 5);\n changeDirection();\n\n addHitbox(HitboxRectangle());\n\
  \ }\n}\n```\n\n与僵尸代码一样，它简洁且从 `Character` 组件继承了大部分功能。由于精灵表图像的设置方式，我们将 `from` 和 `to`\
  \ 字段分别设置为 3 到 5，以获取骷髅的正确动画帧。\n\n现在我们已经设置好了僵尸和骷髅，让我们向 `George` 类添加一些额外的碰撞代码，以便每当\
  \ `George` 精灵与僵尸或骷髅碰撞时，就会从屏幕上删除敌人，就像敌人被消灭了一样。\n\n- 12. 在 `George` 类的底部，添加以下 `onCollision`\
  \ 函数：\n\n```\n@Override\nvoid onCollision(Set<Vector2> points,\nCollidable other)\
  \ {\nsuper.onCollision(points, other);\nif (other is Zombie || other is Skeleton)\
  \ {\nother.removeFromParent();\n}\n}\n```\n\n- 13. 接下来，在 `George` 文件顶部添加 `Zombie`\
  \ 和 `Skeleton` 类的导入语句：\n\n```\nimport 'package:goldrush/components/skeleton.dart';\n\
  import 'package:goldrush/components/zombie.dart';\n```\n\n- 14. 最后，让我们将刚才添加到 George\
  \ 文件中的相同导入语句添加到 main.dart 文件中。然后，在 onLoad 函数中，让我们添加以下代码来添加一些僵尸和骷髅，并更新 George 以传递位置、大小和速度：\n\
  \n```\nadd(George(position: Vector2(200, 400),\nsize: Vector2(48.0, 48.0), speed:\
  \ 40.0));\nadd(Zombie(position: Vector2(100, 200), size:\nVector2(32.0, 64.0), speed:\
  \ 20.0));\nadd(Zombie(position: Vector2(300, 200), size:\nVector2(32.0, 64.0), speed:\
  \ 20.0));\nadd(Skeleton(position: Vector2(100, 600), size:\nVector2(32.0, 64.0),\
  \ speed: 60.0));\nadd(Skeleton(position: Vector2(300, 600), size:\nVector2(32.0,\
  \ 64.0), speed: 60.0));\n```\n\n如果现在运行代码，你会看到一些僵尸、骷髅和 George 在四处游荡，每隔几秒钟随机改变方向，并且在碰到边缘时也会改变方向。如果\
  \ George 与敌人碰撞，敌人将从屏幕上移除。\n\n以下是游戏目前的样子：\n\n![](img/a63c3fccbe888cd4d04006b5e1b6c273_75_0.png)\n\
  \n图 4.4 – George 和敌人精灵\n\n在本节中，我们向游戏添加了敌人精灵和碰撞代码，以检测 George 何时与敌人碰撞。我们将移动和动画更改的通用代码提取到名为\
  \ `Character` 的基类中，然后使用它构建了精灵类。\n\n### 总结\n\n在本章中，我们向你展示了如何从精灵表加载图形并提取和播放动画。然后，我们向你展示了如何移动精灵并更改动画以匹配移动方向。最后，我们向你展示了如何独立动画多个精灵，并检测它们何时相互碰撞或与屏幕边缘碰撞。\n\
  \n在下一章中，我们将通过学习如何使用虚拟摇杆和按钮控制玩家角色来增加更多交互性。我们还将探讨其他输入控制方法，包括检测屏幕上的触摸事件并使用它们来控制玩家角色。\n\
  \n### 问题\n\n- 1. 什么是精灵？\n- 2. 初始化动画的代码应该使用哪些函数？\n- 3. 使用 `SpriteAnimationComponent`\
  \ 有哪些好处？\n- 4. 应该在 `createAnimation` 函数中设置哪些参数来指定精灵表中的范围？\n- 5. 为所有精灵创建基类有什么好处？\n\
  \n## 第 5 章：使用输入移动图形\n\n在本章中，我们将控制自己的角色，并使用虚拟摇杆和触摸事件在屏幕上移动他们，以便玩家可以选择将角色移动到哪里。\n\n\
  我们将首先探讨如何绘制屏幕上的控件，使其表现得像 PlayStation 控制器上的摇杆，并带有用于攻击和跳跃等操作的动作按钮。接下来，我们将虚拟控件与我们的\
  \ George 精灵连接，并让他在屏幕上移动。最后，我们将讨论虚拟控件的替代方案或补充方案，即通过触摸事件（例如点击屏幕并将 George 移动到点击位置）来控制\
  \ George。\n\n因此，我们将涵盖以下主题：\n\n- 绘制屏幕上的控件\n- 使用屏幕上的控件移动我们的角色\n- 使用触摸移动我们的角色\n\n###\
  \ 技术要求\n\n要查看本章的源代码，可以从 https://github.com/PacktPublishing/Building-Games-with-Flutter/tree/main/chapter05\
  \ 下载。\n\n你可以在在线文档 https://docs.flame-engine.org/1.0.0/gesture-input.html 和 https://docs.flame-engine.org/1.0.0/other-inputs.html\
  \ 中找到关于 Flame 输入的更多信息。\n\n在下一节中，我们将首先添加屏幕上的控件并将它们绘制在屏幕上。\n\n### 绘制屏幕上的控件\n\n在本节中，我们将向屏幕添加一个摇杆和一个按钮，以便控制角色，并添加一些文本来显示玩家的得分。这三个组件将构成我们的\
  \ **抬头显示器** (**HUD**)，它是用户界面的一部分，显示绘制在游戏其他图形之上并保持固定位置的游戏信息。此类信息可能是玩家的生命值、剩余生命数量，或者在我们的例子中，就是游戏得分。\n\
  \n我们将把 HUD 封装为一个单一组件，这使得显示或隐藏它更加容易。HUD 组件将包含 `JoyStickComponent`，用于控制 George 移动的方向；摇杆的工作原理是在你想要移动的方向拖动屏幕上的圆圈，使其在较大的圆圈内移动。HUD\
  \ 还将包含 `HudButtonComponent`，这是一个屏幕上的按钮，玩家可以按下它来加倍 George 的行走速度，使他奔跑。\n\n我们将在下一节中连接\
  \ HUD 组件，但现在，让我们先将它们绘制在屏幕上：\n\n- 1. 首先，在 components 文件夹内创建一个名为 `hud` 的文件夹来保存我们的组件。\n\
  - 2. 在 `hud` 文件夹内，创建四个名为 `hud.dart`、`joystick.dart`、`run_button.dart` 和 `score_text.dart`\
  \ 的文件。\n- 3. 在 `run_button.dart` 文件中，添加以下导入语句和类定义：\n\n```\nimport 'package:flame/components.dart';\n\
  import 'package:flame/input.dart';\nimport 'package:flutter/material.dart';\nclass\
  \ RunButton extends HudButtonComponent {\n}\n```\n\n\n\n\n\n- 4. 接下来，我们将在类定义中添加构造函数；这将包括我们需要通过调用\
  \ `super` 传递给 `HudButtonComponent` 基类的值：\n\n```dart\nRunButton({\n  required button,\n\
  \  buttonDown,\n  EdgeInsets? margin,\n  Vector2? position,\n  Vector2? size,\n\
  \  Anchor anchor = Anchor.center,\n  onPressed,\n}) : super(\n  button: button,\n\
  \  buttonDown: buttonDown,\n  margin: margin,\n  position: position,\n  size: size\
  \ ?? button.size,\n  anchor: anchor,\n  onPressed: onPressed\n);\n```\n\n- 5. 在此构造函数下方，让我们添加一个布尔变量来跟踪该按钮是否被按下，默认值为\
  \ `false`：\n\n```dart\nbool buttonPressed = false;\n```\n\n- 6. `HudButtonComponent`\
  \ 有一个名为 `Tappable` 的 mixin，它允许我们检测屏幕上何时按下此按钮，并重写 `onTapUp`、`onTapDown` 和 `onTapCancel`\
  \ 回调，我们将使用这些回调来更新 `buttonPressed` 布尔值。让我们在 `buttonPressed` 定义之后添加这些函数：\n\n```dart\n\
  @override\nbool onTapDown(TapDownInfo info) {\n  super.onTapDown(info);\n  buttonPressed\
  \ = true;\n  return true;\n}\n\n@override\nbool onTapUp(TapUpInfo info) {\n  super.onTapUp(info);\n\
  \  buttonPressed = false;\n  return false;\n}\n\n@override\nbool onTapCancel() {\n\
  \  super.onTapCancel();\n  buttonPressed = false;\n  return true;\n}\n```\n\n我们将在\
  \ hud.dart 文件的 HUD 组件中使用 RunButton，但目前，让我们继续为我们的分数定义 TextComponent。\n\n- 7. 打开 score_text.dart\
  \ 文件并添加以下导入和类定义：\n\n```dart\nimport 'package:flame/components.dart';\nimport 'package:flame/input.dart';\n\
  import 'package:flame/palette.dart';\nimport 'package:flutter/cupertino.dart';\n\
  class ScoreText extends HudMarginComponent {\n}\n```\n\n请注意，ScoreText 类继承自 HudMarginComponent\
  \ 而非 TextComponent。这是因为我们希望在 TextComponent 周围放置带有边距的组件。我们将在此类内部创建 TextComponent，将其作为\
  \ HudMarginComponent 的子组件添加，并通过构造函数将边距传递到该类中，我们将在下一步添加该构造函数。\n\n- 8. 在类中添加以下构造函数以将边距传递到该类：\n\
  \n```dart\nScoreText({EdgeInsets? margin}) : super(margin: margin);\n```\n\n- 9.\
  \ 在构造函数下方，添加用于分数和 TextComponent 子组件的以下变量：\n\n```dart\nint score = 0;\nString scoreText\
  \ = \"Score: \";\nlate TextPaint _regularPaint;\nlate TextComponent scoreTextComponent;\n\
  ```\n\n- 10. 在这些变量下方，让我们添加 `onLoad` 函数，该函数在组件首次使用时调用，用于设置 `TextComponent`：\n\n```dart\n\
  @override\nFuture<void> onLoad() async {\n  super.onLoad();\n  TextStyle textStyle\
  \ = TextStyle(color: BasicPalette.blue.color, fontSize: 30.0);\n  _regularPaint\
  \ = TextPaint(style: textStyle);\n  scoreTextComponent = TextComponent(text: scoreText\
  \ + score.toString(), textRenderer: _regularPaint);\n  add(scoreTextComponent);\n\
  }\n```\n\n在此，我们将文本颜色设置为蓝色，并将 `scoreTextComponent` 作为子组件添加到 `ScoreText`。\n\n- 11.\
  \ 最后，对于 `TextComponent`，我们希望公开一个用于更新分数的函数，每当 George 与某个敌方精灵碰撞时都会更新该分数。因此，让我们在 `onLoad`\
  \ 函数下方添加 `setScore` 函数：\n\n```dart\nsetScore(int score) {\n  this.score += score;\n\
  \  scoreTextComponent.text = scoreText + this.score.toString();\n}\n```\n\n- 12.\
  \ 接下来，我们将添加一个简单的 `JoystickComponent` 用于控制 George 的移动。为此，打开 `joystick.dart` 文件并添加以下代码：\n\
  \n```dart\nimport 'package:flame/components.dart';\nimport 'package:flutter/material.dart';\n\
  class Joystick extends JoystickComponent {\n  Joystick({required PositionComponent\
  \ knob, PositionComponent? background, EdgeInsets? margin}) : super(knob: knob,\
  \ background: background, margin: margin);\n}\n```\n\n目前我们将保持简单，但值得将 JoystickComponent\
  \ 放在其自己的文件中，以防您以后想要使用自定义图像而不是颜色来为摇杆设置更多样式。\n\n- 13. 现在我们有了摇杆、运行按钮和分数文本组件，让我们创建一个\
  \ HUD 组件来处理这些组件的初始化。首先，打开 `hud.dart` 文件并添加以下导入和类定义：\n\n```dart\nimport 'package:flame/components.dart';\n\
  import 'package:goldrush/components/hud/run_button.dart';\nimport 'package:goldrush/components/hud/score_text.dart';\n\
  import 'package:goldrush/components/hud/joystick.dart';\nimport 'package:flame/palette.dart';\n\
  import 'package:flutter/material.dart';\nclass HudComponent extends PositionComponent\
  \ {\n}\n```\n\n在此，我们从 PositionComponent 继承，从而可以控制如何使用边距排列子组件。PositionComponent 是一个允许在其中定位组件的基类。\n\
  \n- 14. 在 HudComponent 类顶部，让我们添加一个将 priority 设置为 20 的构造函数：\n\n```dart\nHudComponent()\
  \ : super(priority: 20);\n```\n\npriority 用于指示组件绘制的顺序，默认值为 0。因此，将此设置为高于 0 将确保 HUD\
  \ 绘制在其他所有内容之上。\n\n稍后，当我们开始使用比物理屏幕更大的地图时，角色和敌人将在地图上移动，但我们希望分数停留在屏幕左上角，而地图在周围滚动。\n\
  \n- 15. 在此下方，我们现在定义用于保存子组件的变量：\n\n```dart\nlate Joystick joystick;\nlate RunButton\
  \ runButton;\nlate ScoreText scoreText;\n```\n\n- 16. 现在，在 onLoad 函数中设置这些子组件：\n\n\
  ```dart\n@override\nFuture<void> onLoad() async {\n  super.onLoad();\n  final joystickKnobPaint\
  \ = BasicPalette.blue.withAlpha(200).paint();\n  final joystickBackgroundPaint =\
  \ BasicPalette.blue.withAlpha(100).paint();\n  final buttonRunPaint = BasicPalette.red.withAlpha(200).paint();\n\
  \  final buttonDownRunPaint = BasicPalette.red.withAlpha(100).paint();\n  joystick\
  \ = Joystick(\n    knob: CircleComponent(radius: 20.0, paint: joystickKnobPaint),\n\
  \    background: CircleComponent(radius: 40.0, paint: joystickBackgroundPaint),\n\
  \    margin: const EdgeInsets.only(left: 40, bottom: 40),\n  );\n  runButton = RunButton(\n\
  \    button: CircleComponent(radius: 25.0, paint: buttonRunPaint),\n    buttonDown:\
  \ CircleComponent(radius: 25.0, paint: buttonDownRunPaint),\n    margin: const EdgeInsets.only(right:\
  \ 20, bottom: 50),\n    onPressed: () => {}\n  );\n  scoreText = ScoreText(margin:\
  \ const EdgeInsets.only(left: 40, top: 60));\n  add(joystick);\n  add(runButton);\n\
  \  add(scoreText);\n  positionType = PositionType.viewport;\n}\n```\n\n在此，我们为组件的颜色设置了一些\
  \ Paint 对象。\n\n接下来，我们设置摇杆，使用圆形作为旋钮和背景，并将边距设置在屏幕左下角，即摇杆将位于的位置。\n\n然后，我们以类似的方式设置运行按钮，其边距位于屏幕右下角，以便在摇杆的对面绘制它。\n\
  \n然后，我们在屏幕左上角设置带有边距的分数文本。\n\n之后，我们添加 HUD 组件并将 `positionType` 设置为 `PositionType.viewport`。\n\
  \n`PositionType` 确保此组件绘制在所有内容之上，即使游戏相机移动也是如此。\n\n请注意，对于运行按钮，它接受一个在按钮按下时调用的函数回调，但因为我们在运行按钮类中自行管理轻触处理，我们可以忽略此项并传递\
  \ {} 代替。\n\n- 17. 让我们将我们的 `HudComponent` 添加到游戏中，以便可以看到我们的新组件。打开 `main.dart` 文件并将以下导入添加到文件顶部：\n\
