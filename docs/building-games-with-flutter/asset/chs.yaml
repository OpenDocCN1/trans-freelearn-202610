  \n### 图 10.1 – 被敌人击中时健康分数降低\n\n在下一节中，我们将在地图上添加一些水障碍物，并讨论如何绕过它们。我们还将讨论如何增强敌人的 AI，这意味着如果它们被水障碍物挡住而看不到您，则不会追赶您。\n\
  \n### 使用路径查找绕过障碍物\n\n在本节中，我们将讨论当道路上有障碍物时如何将角色从 A 点移动到 B 点。解决这个问题的方法有很多种，但在游戏开发中我们将使用的一种常见方法称为\
  \ A* 算法。\n\n该算法是在 2D 网格上计算路线的一种高效方式。请记住，瓦片图是一个 2D 网格，它使用地块 ID 来表示地图上绘制的内容。我们向算法提供起始位置（George\
  \ 的当前位置）和结束位置（我们在屏幕上点击的位置）的网格坐标，以及沿途任何障碍物的网格坐标列表。然后，算法将返回一个表示路径的网格偏移量列表，我们可以遵循该路径导航到触摸位置，同时避开所有障碍物！\n\
  \n我们面临的初始挑战是，当我们移动 George 时，使用像素来表示位置，但该算法使用网格坐标。例如，如果 George 在地图的左上角（忽略水），他的像素坐标可能是\
  \ 48, 48，但他的网格坐标将是 1, 1。\n\n让我们首先创建一个新文件，其中包含一些辅助函数，允许我们在 George 的世界坐标（像素）和网格坐标之间进行转换：\n\
  \n- 1. 首先，在 utils 文件夹中创建并打开一个名为 map_utils.dart 的新文件，然后添加以下代码：\n\n```\nimport 'package:flame/components.dart';\n\
  import 'package:flutter/material.dart';\nconst int TILE_SIZE = 32;\nOffset worldToGridOffset(Vector2\
  \ mapLocation) {\n    double x =\n    (mapLocation.x / TILE_SIZE).floor().toDouble();\n\
  \    double y =\n    (mapLocation.y / TILE_SIZE).floor().toDouble();\n    return\
  \ Offset(x, y);\n}\n```\n\n\n\n\n\n```dart\nVector2 gridOffsetToWorld(Offset gridOffset)\
  \ {\n    double x = (gridOffset.dx * TILE_SIZE);\n    double y = (gridOffset.dy\
  \ * TILE_SIZE);\n    return Vector2(x, y);\n}\n```\n\n这里，我们有两个用于在世界坐标和网格坐标之间进行转换的函数，同时考虑到我们的瓦片大小为\
  \ 32 x 32。\n\n接下来，我们将更新 `George` 类，以便在移动到触摸位置时更新我们的代码，首先使用 A* 算法计算路径，然后沿路径导航，并在导航过程中改变面朝方向。\n\
  \n- 2. 打开 `george.dart` 文件并向文件中添加以下导入：\n\n```\nimport 'package:goldrush/utils/map_utils.dart';\n\
  import 'package:a_star_algorithm/a_star_algorithm.dart';\n```\n\n- 3. 接下来，在类顶部添加以下变量，以跟踪障碍物偏移位置、到目标的路径以及当前路径步骤：\n\
  \n```\nList<Offset> barrierOffsets;\nList<Offset> pathToTargetLocation = [];\nint\
  \ currentPathStep = -1;\n```\n\n- 4. 现在，让我们更新构造函数以传入 `barrierOffsets`：\n\n```\n\
  George({required this.barrierOffsets, required this.hud, required Vector2 position,\
  \ required Vector2 size, required double speed}) : super(\n    position: position,\
  \ size: size, speed: speed) {\n```\n\n- 5. 接下来，让我们更新 `moveToLocation` 函数以设置新变量：\n\
  \n```\nvoid moveToLocation(TapUpInfo info) {\n    pathToTargetLocation = AStar(\n\
  \    rows: 50,\n    columns: 50,\n    start: worldToGridOffset(position),\n    end:\
  \ worldToGridOffset(info.eventPosition.game),\n    withDiagonal: true,\n    barriers:\
  \ barrierOffsets\n).findThePath().toList();\ntargetLocation = info.eventPosition.game;\n\
  faceCorrectDirection();\n```\n\n由于 `pathToTargetLocation[0]` 与当前位置相同，我们将 `currentPathStep`\
  \ 设置为下一步，即 1：\n\n```\ncurrentPathStep = 1;\ntargetLocation = gridOffsetToWorld(\n\
  \    pathToTargetLocation[currentPathStep]);\ntargetLocation.add(Vector2(16, 16));\n\
  movingToTouchedLocation = true;\n}\n```\n\n这里，我们将 A* 算法的结果存储在 `pathToTargetLocation`\
  \ 变量中。\n\n我们传入行数和列数，与我们的地图大小相同，即 `50 x 50`。我们将 `withDiagonal` 值设置为允许路径走捷径，这样看起来更自然。你可以在运行此代码时尝试将此值设置为\
  \ `false`，以查看差异并决定你的偏好。我们传入 `barrierOffsets`，它将通过构造函数传入。最后，我们将乔治的位置和触摸位置转换为网格偏移坐标。结果将是一条避开水障碍物到达该位置的路径。\n\
  \n如果你将我们在本章“_技术要求_”部分下载的更新地图加载到 Tiled 应用程序中，你会发现我们在地图中心放置了水障碍物，可以用来测试路径导航是否正常工作。\n\
  \n在获取 A* 结果后，我们将 `targetLocation` 设置为触摸位置，然后调用一个我们即将定义的新函数，名为 `faceCorrectDirection`。这个新函数确保当乔治开始导航到目标位置的路径时，面朝方向正确。\n\
  \n接下来，我们将 currentPathStep 设置为从 1 开始，而不是从列表的位置 0 开始。这是因为，当我们得到算法结果时，它会将我们当前位置插入位置\
  \ 0，而由于我们已经在该位置，因此不需要移动过去！\n\n然后，我们根据 currentPathStep 处的偏移量设置 targetLocation，并将其转换回世界坐标以供我们移动。请记住，我们需要使用网格坐标才能让算法工作，但我们需要世界坐标来以实际像素进行移动。最后，我们向\
  \ targetLocation 添加一个向量 16, 16。\n\n这是因为，当转换为世界坐标时，我们是基于瓦片的左上角，但我们希望根据瓦片中心来移动乔治，因此我们向向量的\
  \ x 和 y 值添加 16, 16，即瓦片大小 32 的一半。\n\n最后，在此函数中，我们将 movingToTouchedLocation 设置为 true，这将使乔治在\
  \ update 函数中开始向 targetLocation 移动。\n\n- 6. 接下来，我们需要更改 update 函数以沿路径行走。此函数允许我们通过在每个路径步骤之间行走来更改下一个路径步骤，直到到达路径的最终点。\n\
  \n在上一步中，我们引用了一个名为 faceCorrectDirection 的新函数，当我们更改 update 函数时也会再次使用它，所以让我们先创建它。\n\
  \n在 update 函数下方，创建一个名为 faceCorrectDirection 的新函数并添加以下代码：\n\n```\nvoid faceCorrectDirection()\
  \ {\n    var angle = getAngle(position, targetLocation);\n    if ((angle > 315 &&\
  \ angle < 360) || (angle > 0 &&\n    angle < 45) ) { // Facing right\n    animation\
  \ = rightAnimation;\n    currentDirection = Character.right;\n}\nelse if (angle\
  \ > 45 && angle < 135) {\n    // Facing down\n    animation = downAnimation;\n \
  \   currentDirection = Character.down;\n    }\n    else if (angle > 135 && angle\
  \ < 225) {\n        // Facing left\n        animation = leftAnimation;\n       \
  \ currentDirection = Character.left;\n    }\n    else if (angle > 225 && angle <\
  \ 315) {\n        // Facing up\n        animation = upAnimation;\n        currentDirection\
  \ = Character.up;\n    }\n}\n```\n\n- 7. 最后在此步骤中，我们将更改 `update` 函数，以便在每个路径步骤采取后更改\
  \ `targetLocation`，直到到达我们的触摸位置。\n\n由于 `update` 函数现在相当大，我们将完全重构此函数，以便更轻松地管理代码。\n\n\
  我们将为每种移动类型创建三个新函数，`moveByJoystick`、`moveByKeyboard` 和 `moveByTouch`。我们将 `update`\
  \ 函数的相关部分移入前两个函数，但对于第三个函数，我们将进行重写，因为我们现在正在绕过障碍物使用路径。\n\n在 `update` 函数下方，添加以下三个空函数存根以开始：\n\
  \n```\nvoid moveByJoystick(double dt) async {}\nvoid moveByKeyboard(double dt) async\
  \ {}\nvoid moveByTouch(double dt) async {}\n```\n\n- 8. 接下来，将代码（可从 https://github.com/PacktPublishing/Building-Games-with-Flutter/blob/main/chapter10/lib/components/george.dart\
  \ 获取）从 `update` 函数添加到 `moveByJoystick` 函数。\n\n- 9. 接下来，将以下代码从 `update` 函数添加到 `moveByKeyboard`\
  \ 函数：\n\n```\nmovePlayer(dt);\nplaying = true;\nmovingToTouchedLocation = false;\n\
  if (!isMoving) {\nisMoving = true;\naudioPlayerRunning = await FlameAudio.loopLongAudio(\n\
  'sounds/running.wav', volume: 1.0);\n}\nif (keyUpPressed && (keyLeftPressed ||\n\
  keyRightPressed)) {\nanimation = upAnimation;\ncurrentDirection = Character.up;\n\
  } else if (keyDownPressed && (keyLeftPressed ||\nkeyRightPressed)) {\nanimation\
  \ = downAnimation;\ncurrentDirection = Character.down;\n} else if (keyLeftPressed)\
  \ {\nanimation = leftAnimation;\ncurrentDirection = Character.left;\n} else if (keyRightPressed)\
  \ {\nanimation = rightAnimation;\ncurrentDirection = Character.right;\n} else if\
  \ (keyUpPressed) {\nanimation = upAnimation;\ncurrentDirection = Character.up;\n\
  } else if (keyDownPressed) {\nanimation = downAnimation;\ncurrentDirection = Character.down;\n\
  } else {\nanimation = null;\n}\n```\n\n- 10. 接下来，将以下代码从 update 函数添加到 moveByTouch\
  \ 函数：\n\n```\nif (!isMoving) {\nisMoving = true;\naudioPlayerRunning = await FlameAudio.loopLongAudio(\n\
  'sounds/running.wav', volume: 1.0);\n}\nmovePlayer(dt);\ndouble threshold = 2.0;\n\
  var difference = targetLocation - position;\nif (difference.x.abs() < threshold\
  \ &&\ndifference.y.abs() < threshold) {\nif (currentPathStep < pathToTargetLocation.length\
  \ - 1) {\n    currentPathStep++;\n    targetLocation = gridOffsetToWorld(\n    \
  \    pathToTargetLocation[currentPathStep]);\n    targetLocation.add(Vector2(16,\
  \ 16));\n} else {\n    stopAnimations();\n    audioPlayerRunning.stop();\n    isMoving\
  \ = false;\n    movingToTouchedLocation = false;\n    return;\n}\n}\nplaying = true;\n\
  if (currentPathStep <= pathToTargetLocation.length) {\n    faceCorrectDirection();\n\
  }\n}\n```\n\n在 `moveByTouch` 函数中，我们更改了一些内容——所以让我们逐一了解与前面章节讨论过的之前触摸代码不同的部分。\n\n我们仍然检查移动玩家后的位置是否在阈值内，但我们将\
  \ `threshold` 增加到了 `2.0`，这有助于触摸移动，尤其是在角色奔跑时。如果我们到达了 `targetLocation`，我们会检查是否有更多步骤，如果还有更多步骤，则增加\
  \ `currentPathStep`，然后将 `targetLocation` 更新为新的路径位置。再次，由于路径中的每个偏移量都与网格单元的左上角相关，我们向目标位置添加\
  \ `16,16` 以使其居中。如果没有更多步骤，我们停止动画和声音。\n\n在每个步骤更改时，我们调整角色面朝的方向，以确保角色面朝前往下一个路径步骤的方向。\n\
  \n- 11. 现在我们已经定义了三个移动函数，让我们重写简化的 `update` 函数。用以下使用我们新移动函数的新代码完全替换当前的 `update` 函数：\n\
  \n\n\n@override\nvoid update(double dt) async {\n    super.update(dt);\n    speed\
  \ = (hud.runButton.buttonPressed ||\n    keyRunningPressed ? runningSpeed : walkingSpeed);\n\
  \    final bool isMovingByKeys = keyLeftPressed ||\n    keyRightPressed || keyUpPressed\
  \ || keyDownPressed;\n    if (!hud.joystick.delta.isZero()) {\n    moveByJoystick(dt);\n\
  \    } else if (isMovingByKeys) {\n    moveByKeyboard(dt);\n    } else {\n    if\
  \ (movingToTouchedLocation) {\n    moveByTouch(dt);\n    } else {\n    if (playing)\
  \ {\n    stopAnimations();\n    }\n    if (isMoving) {\n    isMoving = false;\n\
  \    audioPlayerRunning.stop();\n    }\n    }\n}\n}\n\n现在我们已经完成了对 `George` 类的更新，让我们进入主类以连接所有内容。\n\
  \n- 12. 打开 `main.dart` 文件，添加地图工具函数的以下导入：\n\n```\nimport 'package:goldrush/utils/map_utils.dart';\n\
  ```\n\n- 13. 在 `onLoad` 函数中，在加载并播放背景音乐下方，添加以下代码以初始化水屏障，然后通过构造函数将这些内容传递给 `George`\
  \ 类，以便用于路径查找：\n\n```\nFlameAudio.bgm.initialize();\nawait FlameAudio.bgm.load('music/music.mp3');\n\
  await FlameAudio.bgm.play('music/music.mp3', volume: 0.1);\n\nfinal tiledMap = await\
  \ TiledComponent.load(\n'tiles.tmx', Vector2.all(32));\nadd(TileMapComponent(tiledMap));\n\
  List<Offset> barrierOffsets = [];\nfinal water =\n    tiledMap.tileMap.getObjectGroupFromLayer('Water');\n\
  water.objects.forEach((rect) {\nif (rect.width == 32 && rect.height == 32) {\nbarrierOffsets.add(worldToGridOffset(Vector2(\n\
  rect.x, rect.y)));\n}\nadd(Water(position: Vector2(rect.x +\ngameScreenBounds.left,\
  \ rect.y +\ngameScreenBounds.top), size: Vector2(rect.width,\nrect.height), id:\
  \ rect.id));\n});\nvar hud = HudComponent();\nvar george = George(barrierOffsets:\
  \ barrierOffsets,\nhud: hud, position: Vector2(gameScreenBounds.left +\n300, gameScreenBounds.top\
  \ + 300), size:\nVector2(32.0, 32.0), speed: 40.0);\nadd(george);\nchildren.changePriority(george,\
  \ 15);\n```\n\n请注意，我们已移动了初始化瓦片地图和水对象的代码，这意味着您可以在此函数中删除对此的其他引用。\n\n如果您现在运行游戏，并使用触摸在水屏障内移动到地图中心，您将看到乔治绕着水屏障走向他的位置！\n\
  \n### 摘要\n\n在本章中，我们通过让角色和敌人看起来更聪明来改进它们。敌人现在会在靠近玩家且在视线范围内时追击乔治，而乔治现在可以在避开障碍物的同时在地图上移动。\n\
  \n在最后一章中，我们将向游戏添加一些新屏幕，以将所有内容连接在一起。\n\n### 问题\n\n- 1. 我们可以调用什么函数来测量两个位置之间的距离，以检测敌人是否靠近玩家？\n\
  - 2. 我们在游戏中用于路径查找的算法名称是什么？\n- 3. 如何在世界坐标和网格坐标之间转换？\n- 4. 为什么要在路径查找算法中将 `withDiagonal`\
  \ 设置为 `true`？\n- 5. 为什么在路径查找的每个步骤中都必须调整我们面对的方向？\n"
- "## 第 11 章：完成游戏\n\n游戏看起来很棒，几乎完成了，但我们希望在本章中解决一些悬而未决的问题，以完成它。目前，我们只有主游戏屏幕；然而，游戏通常包含许多屏幕，例如菜单屏幕或设置屏幕。\n\
  \n在本章中，我们将添加更多屏幕，并向您展示如何在它们之间导航。我们将使用标准 Flutter 小部件创建这些屏幕，并向您展示如何将 Flutter 和 Flame\
  \ 混合使用。具体来说，在我们的设置屏幕中，我们将添加一个控制音乐音量的选项，并持久保存用户的音乐音量偏好，然后在游戏中使用此设置。\n\n在完成游戏代码后，我们将讨论开发游戏时需要考虑的其他一些事项，例如如何从游戏中赚钱，在继续学习游戏开发时还有什么值得学习，以及在开发游戏时遇到困难去哪里寻求帮助。\n\
  \n本章将涵盖以下主题：\n\n- 完成游戏\n- 游戏变现\n- 我还应该学什么？\n- 在哪里寻求帮助？\n\n### 技术要求\n\n要查看本章的源代码，可以从\
  \ https://github.com/PacktPublishing/Building-Games-with-Flutter/tree/main/chapter11\
  \ 下载。\n\n在本章中，我们将保存用户的音乐音量偏好，因此让我们在游戏中添加用于持久保存此值的库：\n\n- 1. 打开 `pubspec.yaml` 文件，添加以下依赖项：\n\
  \n```\nshared_preferences: ^2.0.15\n```\n\n- 2. 保存文件，并允许 `pub get` 下载此依赖项并验证资产：\n\
  \n```\nflutter pub get\n```\n\n在下一节中，我们将讨论需要添加到游戏中的最终代码，以完成所有工作，包括游戏屏幕和导航。\n\n###\
  \ 完成游戏\n\n在本节中，我们将添加三个新屏幕，并在它们之间进行导航。\n\n这些屏幕如下：\n\n- **菜单屏幕**：玩家将看到的第一个屏幕，包含玩游戏、查看设置或退出游戏的选项。\n\
  - **设置屏幕**：设置允许我们通过 `Slider` 小部件更改音乐音量，或返回菜单屏幕。\n- **游戏结束屏幕**：当玩家的生命值为 0 时，我们将显示此屏幕，并允许他们返回菜单屏幕重新开始游戏。\n\
  \n这三个屏幕将使用标准 Flutter 小部件；我们将使用 Flutter 导航路由在这些屏幕之间导航，并使用我们的游戏小部件来运行游戏。\n\n让我们通过添加每个屏幕来开始吧。\n\
  \n### 添加菜单屏幕\n\n在本节中，我们将添加一个菜单屏幕，以帮助我们在游戏的各个屏幕之间导航，步骤如下：\n\n- 1. 在项目的 `lib` 目录中，创建一个名为\
  \ `widgets` 的新文件夹，用于存放我们的新小部件屏幕。\n- 2. 在 `widgets` 文件夹中创建三个新文件，分别名为 `screen_menu.dart`、`screen_settings.dart`\
  \ 和 `screen_gameover.dart`。\n- 3. 打开 `screen_menu.dart` 文件，添加以下代码：\n\n```\nimport\
  \ 'package:flutter/material.dart';\nimport 'package:flutter/services.dart';\nclass\
  \ MenuScreen extends StatelessWidget {\n  const MenuScreen({Key? key}) : super(key:\
  \ key);\n  @override\n  Widget build(BuildContext context) {\n    return Scaffold(\n\
  \      backgroundColor: Colors.black,\n      body: Center(\n        child: Column(\n\
  \          mainAxisAlignment: MainAxisAlignment.center,\n          crossAxisAlignment:\n\
  \          CrossAxisAlignment.center,\n          children: [\n            getGameTitle(),\n\
  \            getGameMenu(context)\n          ]\n        )\n      ),\n    );\n  }\n\
  }\nWidget getGameTitle() {}\nWidget getGameMenu(BuildContext context) {}\n```\n\n\
  在这里，我们添加一个名为 `MenuScreen` 的类，它是 `StatelessWidget`，并设置布局的基本结构，在顶部有一个标题，以及菜单中可以点击的几个菜单项。\n\
  \n- 4. 让我们扩展 `getGameTitle` 函数，以返回标题的 `Text` 小部件：\n\n```\nWidget getGameTitle()\
  \ {\n  return Text('Gold Rush', style: TextStyle(color:\n  Colors.yellow, fontSize:\
  \ 64.0));\n}\n```\n\n- 5. 接下来，我们将扩展 `getGameMenu` 函数，添加 **开始游戏**、**设置** 和 **退出游戏**\
  \ 菜单选项；它们将是包装在 `GestureDetector` 小部件中的 `Text` 小部件，以便可以点击。\n\n对于前两个选项，我们将使用导航路由移动到新屏幕，并将使用\
  \ `SystemNavigator` 函数退出游戏：\n\n```\nWidget getGameMenu(BuildContext context) {\n\
  \  return Padding(\n    padding: const EdgeInsets.all(40.0),\n    child: Column(children:\
  \ [\n    Padding(\n      padding: const EdgeInsets.all(8.0),\n      child: GestureDetector(\n\
  \        onTap: () {\n          Navigator.pushNamedAndRemoveUntil(context,\n   \
  \       \"/game\", (r) => false);\n        },\n        child: Text('Play Game',\
  \ style: TextStyle(\n            color: Colors.blue, fontSize: 32.0))),\n      ),\n\
  \      Padding(\n        padding: const EdgeInsets.all(8.0),\n        child: GestureDetector(\n\
  \          onTap: () {\n            Navigator.pushNamedAndRemoveUntil(context,\n\
  \            \"/settings\", (r) => false);\n          },\n          child: Text('Settings',\
  \ style: TextStyle(\n              color: Colors.blue, fontSize: 32.0))),\n    \
  \  ),\n      Padding(\n        padding: const EdgeInsets.all(8.0),\n        child:\
  \ GestureDetector(\n          onTap: () { SystemNavigator.pop(); },\n          child:\
  \ Text('Exit Game', style: TextStyle(\n```\n\n\n\ncolor: Colors.red, fontSize: 32.0))),\n\
  \                ),\n            )),\n        );\n    }\n```\n\nHere, we have a\
  \ simple widget that draws the menu, which is a simple column of menu items in the\
  \ middle, with a title at the top and an exit option below the menu items. Clicking\
  \ on these options tells the navigator to change to a different page.\n\nHere, you\
  \ can see how the menu screen should look:\n\n![](img/a63c3fccbe888cd4d04006b5e1b6c273_196_0.png)\n\
  \nFigure 11.1 – The game menu screen, allowing you to play the game or view the\
  \ settings\n\nNext, let's continue for now with the settings screen.\n\n### 添加设置屏幕\n\
  \nIn this section, we will add a settings screen to allow us to choose the volume\
  \ of the background music by following these steps:\n\n- 1. Open the `screen_settings.dart`\
  \ file and add the code from here: https://github.com/PacktPublishing/Building-Games-with-Flutter/blob/main/chapter11/lib/widgets/screen_settings.dart.\n\
  \nIn this code block, we will set up `StatefulWidget` this time, as we want to keep\
  \ track of the music volume value and persist this for using the `SharedPreferences`\
  \ library we added earlier in the _Technical requirements_ section.\n\nWe store\
  \ the current music volume in a variable called `musicVolume`. In the `initState`\
  \ function, we try and read this value from the shared preferences and set it to\
  \ 25% as a default if this has not been previously set.\n\nLet's continue and build\
  \ the UI for the settings screen by completing the empty functions.\n\n- 2. Here\
  \ is the code for the `getSettingsTitle` function:\n\n```\nWidget getSettingsTitle()\
  \ {\n  return Padding(\n    padding: const EdgeInsets.fromLTRB(0, 0, 0, 20),\n \
  \   child: Text('Settings', style: TextStyle(color:\n      Colors.yellow, fontSize:\
  \ 64.0)),\n  );\n}\n```\n\nHere, we return a `Text` widget for our title, which\
  \ is styled in yellow and has a font size of 64.\n\n- 3. The following is the code\
  \ for the `getMusicVolumeLabel` function:\n\n```\nWidget getMusicVolumeLabel() {\n\
  \  return Text('Music Volume', style: TextStyle(color:\n    Colors.blue, fontSize:\
  \ 32.0));\n}\n```\n\nHere, we return a `Text` widget for our volume label, which\
  \ is styled in blue and has a font size of 32.\n\nThe following is the code for\
  \ the `getVolumeSlider` function:\n\n```\nWidget getVolumeSlider() {\n  return SizedBox(\n\
  \    width: 250.0,\n    child: Slider(\n      value: musicVolume,\n      min: 0.0,\n\
  \      max: 100.0,\n      label: '${musicVolume.round()}',\n      divisions: 4,\n\
  \      onChanged: (double newMusicVolume) {\n        SharedPreferences.getInstance().then((prefs)\n\
  \          => prefs.setDouble('musicVolume',\n          newMusicVolume));\n    \
  \    setState(() => musicVolume = newMusicVolume);\n      }),\n  );\n}\n```\n\n\
  Here, we return a Slider widget wrapped around a fixed SizedBox widget that has\
  \ values for the music volume between 0 and 100. Whenever the slider value is changed,\
  \ we set the musicVolume value in the widget and save this to the shared preferences.\n\
  \n- 4. The following is the code for the getBackLabel function:\n\n```\nWidget getBackLabel()\
  \ {\n  return GestureDetector(\n    onTap: () { Navigator.pushNamedAndRemoveUntil(\n\
  \      context, \"/\", (r) => false); },\n    child: Text('Back', style: TextStyle(color:\n\
  \      Colors.red, fontSize: 32.0))\n  );\n}\n```\n\nHere, we return a Text label\
  \ to go back to the main menu and use Navigator to return the player to the top-level\
  \ route if this is clicked.\n\nThe following screenshot shows our settings screen\
  \ along with a slider to set the music volume:\n\n![](img/a63c3fccbe888cd4d04006b5e1b6c273_199_0.png)\n\
  \nFigure 11.2 – The Settings screen with the adjustable music volume\n\nNow that\
  \ the settings screen is complete, let's work on our final screen, which is the\
  \ game over screen.\n\n### 添加游戏结束屏幕\n\nIn this section, we will add a game over\
  \ screen to let the user know the game has ended. To do this, open the `screen_gameover.dart`\
  \ file and add the code from here: https://github.com/PacktPublishing/Building-Games-with-Flutter/blob/main/chapter11/lib/widgets/screen_gameover.dart.\n\
  \nIn this code block, we show a simple screen to indicate that the game is over\
  \ and a link to go back to the menu, where the user can play again, change the settings,\
  \ or quit the game.\n\nHere is the game over screen that is shown when George dies:\n\
  \n![](img/a63c3fccbe888cd4d04006b5e1b6c273_200_0.png)\n\nFigure 11.3 – The game\
  \ over screen when George dies\n\nNow that we have our three extra screens, let's\
  \ tie these together with navigation routes and music volume.\n\n### 使用导航路由和音乐音量编译所有屏幕\n\
  \nIn this section, we will tie all the navigation together and also adjust the music\
  \ volume, based on the settings menu choice. To do this, we will follow these steps:\n\
  \n- 1. Open the main.dart file and import the screens and shared preference library:\n\
  \n```\nimport 'package:goldrush/widgets/screen_gameover.dart';\nimport 'package:goldrush/widgets/screen_menu.dart';\n\
  import 'package:goldrush/widgets/screen_settings.dart';\nimport 'package:shared_preferences/shared_preferences.dart';\n\
  ```\n\n- 2. Let's rewrite the main function to use routes. Replace the existing\
  \ main function with the following:\n\n```\nvoid main() async {\n  WidgetsFlutterBinding.ensureInitialized();\n\
  \  await Flame.device.fullScreen();\n  await Flame.device.setLandscape();\n  runApp(\n\
  \    MaterialApp(\n      debugShowCheckedModeBanner: false,\n      title: 'Gold\
  \ Rush',\n      initialRoute: '/',\n      routes: {\n        '/': (context) => MenuScreen(),\n\
  \        '/settings': (context) => SettingsScreen(),\n        '/gameover': (context)\
  \ => GameOverScreen(),\n        '/game': (context) => GameWidget(game: GoldRush()),\n\
  \      },\n    ),\n  );\n}\n```\n\nHere, we set the screen up as full-screen landscape\
  \ as we did before in Chapter 7, Designing Your Own Levels, but now we have four\
  \ navigation routes defaulting, with the initial route pointing to the menu screen.\n\
  \n- 3. In the onLoad function of the GoldRush class, let's read the musicVolume\
  \ value from shared preferences and set up the playback of the music with this value.\
  \ Note that if the player has not gone into the settings and changed this value,\
  \ the volume will default to 25%.\n\nReturning to where the background audio is\
  \ initialized, add the following code:\n\n```\nvar musicVolume;\nawait SharedPreferences.getInstance()\n\
  \  .then((prefs) => prefs.getDouble('musicVolume') ?? 25.0)\n  .then((savedMusicVolume)\
  \ => musicVolume = savedMusicVolume);\n```\n\n- 4. Next, change the line that starts\
  \ playing the music to the following:\n\n```\nawait FlameAudio.bgm.play('music/music.mp3',\
  \ volume: (musicVolume / 100));\n```\n\n- 5. During the testing of the navigation,\
  \ a bug was found where the enemies and coins were invisible when playing the game\
  \ for the first time. This is due to the z-order priority being incorrect, which\
  \ makes the map draw on top of the sprites. So, let's fix that now by setting the\
  \ priority higher.\n\nIn the same `onLoad` function, change the initialization of\
  \ the `Skeleton`, like this:\n\n```\nvar skeleton = Skeleton(player: george, position:\n\
  \  Vector2(position.x + gameScreenBounds.left,\n  position.y + gameScreenBounds.top),\
  \ size:\n  Vector2(32.0, 64.0), speed: 20.0);\nchildren.changePriority(skeleton,\
  \ 15);\nadd(skeleton);\n```\n\n- 6. Next, update the `Zombie` initialization, like\
  \ this:\n\n```\nvar zombie = Zombie(player: george, position:\n  Vector2(position.x\
  \ + gameScreenBounds.left,\n  position.y + gameScreenBounds.top), size:\n  Vector2(32.0,\
  \ 64.0), speed: 20.0);\nchildren.changePriority(zombie, 15);\nadd(zombie);\n```\n\
  \n- 7. And finally, for the sprites, update the `Coin` initialization, like this:\n\
  \n```\nvar coin = Coin(position: Vector2(posCoinX, posCoinY),\n  size: Vector2(20,\
  \ 20));\nchildren.changePriority(coin, 15);\nadd(coin);\n```\n\n- 8. Now that we\
  \ are done updating the navigation and music playback, let's fix one last thing.\n\
  \nWhen George's health gets to 0, we want to trigger the navigation to show the\
  \ game over screen. Open the `george.dart` file and, in the `onCollision` function,\
  \ change the health check code block to the following:\n\n```\nif (health > 0) {\n\
  \  health -= 25;\n  hud.healthText.setHealth(health);\n}\nif (health == 0) {\n \
  \ Navigator.pushNamedAndRemoveUntil(gameRef.buildContext, \"/gameover\", (r) =>\
  \ false);\n}\n```\n\nThis will replace the previous else clause, where we had a\
  \ to-do action to show the game over screen.\n\nWe have now the complete code for\
  \ the game! If you run the game now, you can see the simple screens and navigate\
  \ around them, and you can adjust the music volume from off to full volume.\n\n\
  When you have built your own game, it would be great to sell the game, and who knows\
  \ – you may make the next successful blockbuster game, such as Angry Birds, and\
  \ become very rich! In the next section, we will discuss exactly that – how to make\
  \ money from your game.\n\n### 游戏变现\n\nOnce you have developed your own game, you\
  \ may want to try to make some money from the game. There are a few ways to do this,\
  \ depending on the platforms you wish to support. But in this section, we will focus\
  \ on the three most common ways so that you can decide what is best for you, as\
  \ there are pros and cons to each way.\n\nThe three main ways to monetize your game\
  \ are as follows:\n\n- Adverts\n- In-app purchases\n- Purchase\n\nIn the following\
  \ subsections, we will discuss each of these options.\n\n\n\n\n\n### 广告\n\n有众多广告提供商，每个都为\
  \ Flutter 提供自己的库。移动端推荐使用 Google 自家的 Mobile Ads SDK，Google 为此提供了官方库。这很容易集成，你可以通过在游戏中向玩家展示广告来赚钱。\n\
  \n请注意，过度使用广告会惹恼玩家，因此请尽量考虑用户在游戏中的体验，以便在两者之间取得平衡。\n\n让我们来看看在游戏中使用广告的优缺点：\n\n#### 优点：\n\
  \n- 易于集成。\n- 来自持续收入流的重复收入。\n\n#### 缺点：\n\n- 对用户来说可能很烦人。\n- 广告带来的收入相当低。\n\n现在，让我们来看看另一种变现选项：应用内购买。\n\
  \n### 应用内购买\n\n应用内购买可以是从游戏中赚钱的好方法。通常，对于这类游戏，你会将其免费提供，然后在游戏中收取小额微支付，这些支付通过 Google\
  \ Play 或 Apple 的 App Store 进行。你购买的虚拟物品仅存在于该游戏中。例如，在我们的游戏中，你可以购买额外生命值或更好的武器，以换取真实货币。\n\
  \n请注意，一些使用应用内购买的现有游戏以“付费获胜”而闻名，即愿意付费购买游戏中最佳物品的用户可以轻松获胜。这具有争议性，尤其是在多人游戏中，你可以购买游戏中的成功。\n\
  \n从开发者的角度来看，虚拟物品提供了一种有趣的变现方式。这是因为游戏资产是虚拟的，可以多次出售给不同的玩家，并提供可靠的、可重复的收入流。\n\n让我们来看看在游戏中使用应用内购买的优缺点：\n\
  \n#### 优点：\n\n- 你可以将同一虚拟物品出售给许多不同的用户。\n\n#### 缺点：\n\n- 在移动开发者门户中设置可能比较繁琐。\n- 如果过度使用，会让用户感到烦躁。\n\
  \n现在我们已经讨论了应用内购买的优缺点，让我们来看看最后一种选项：一次性购买。\n\n### 一次性购买\n\n一次性购买也是变现应用的另一个有效选项。你可以为游戏设定一个固定价格，用户只需支付一次。\n\
  \n请注意，玩家倾向于希望在游戏中看到更新的内容，例如新关卡。因此，如果你仅从固定价格中获利，那么除了更新内容可能带来的新销售外，你将免费维护游戏。\n\n让我们来看看在游戏中使用购买的优缺点。\n\
  \n#### 优点：\n\n- 无需麻烦，你只需设置一次价格。\n\n#### 缺点：\n\n- 没有来自现有客户的重复收入。\n\n如果你想进一步了解变现游戏的方法，请查看\
  \ https://flutter.dev/monetization，其中有更详细的说明。\n\n在本节中，我们讨论了变现游戏的方法。在下一节中，我们将讨论还有什么值得学习，以扩展你的游戏开发知识。\n\
  \n### 我还应该学什么？\n\n现在你已经掌握了使用 Flame 进行游戏开发的基础知识，让我们来看看你还可以学习哪些更高级但非常有用的主题，以扩展你的游戏开发知识。\n\
  \n### Forge2d\n\n许多游戏使用高级物理来使游戏更加逼真，例如使用重力来影响精灵的跳跃和下落，或者计算《愤怒的小鸟》中下落的鸟的轨迹。\n\n有一个名为\
  \ Forge2d 的非常好的物理引擎可用，它基于著名的 Box2d 引擎，如果你想让游戏更加逼真，值得研究。\n\n你可以在 https://docs.flame-engine.org/1.0.0/forge2d.html\
  \ 上找到开始所需的一切。\n\n### Nakama\n\n单人游戏可以很有趣，但当你和朋友一起玩时，游戏会上升到一个全新的水平。多人游戏开发是一个从零开始非常复杂的主题，但它是一个值得学习的有用主题，可以大大改善你的游戏。幸运的是，Flutter\
  \ 有一个好的库来处理构建多人游戏所需的所有复杂内容，并且与 Flame 配合良好。\n\n该库称为 **Nakama**，在 https://heroic-labs.com/docs/nakama/getting-started/\
  \ 中讨论，而针对该库的 Flutter 库位于 https://github.com/obrunsmann/flutter_nakama。\n\nNakama\
  \ 有许多功能。以下是它可以做的一些事情：\n\n- 不同玩家之间的多人游戏\n- 玩家之间的实时聊天\n- 用于跟踪谁分数最高的排行榜\n- 带有登录的用户账户\n\
  \nNakama 覆盖了比我们在此讨论的更多多人游戏功能，因此建议你查看他们的网站（https://heroic-labs.com/docs/nakama/getting-started/）以获取更多信息。\n\
  \n### Rive\n\n**Rive** 是一个跨平台动画工具，允许你导出动画并使用特定于每个平台的库进行播放。如果你熟悉旧的 Flash 动画，这很相似。\n\
  \n你可以在 https://rive.app/ 上阅读更多关于 Rive 的信息。针对 Rive 的 Flame 库可以在 https://pub.dev/packages/flame_rive\
  \ 上找到。\n\n### 我应该做什么游戏？\n\nFlame 适合所有类型的 2D 游戏，所以你可以做任何你喜欢的游戏。困难在于，有些类型的游戏比其他类型更难编码。\n\
  \n如果你计划制作角色扮演游戏，这些游戏非常流行，请注意，这些是非常复杂的游戏，因为它们通常模拟现实世界的机制，并要求你为游戏构建大量内容。\n\n从简单的游戏开始，例如井字棋，然后逐步过渡到推箱子或打破砖块等游戏，再过渡到玛丽奥等平台游戏。\n\
  \n有一篇很棒的文章在 https://gamefromscratch.com/just-starting-out-what-games-should-i-make/，可以给你更多关于做什么游戏以及按什么顺序制作它们的想法。\n\
  \n在下一节中，我们将讨论当你在使用 Flutter/Flame 时卡住了去哪里寻求帮助。\n\n### 去哪里寻求帮助？\n\n在制作游戏的过程中，有时你会卡住。你可能不知道如何实现某个功能，或者\
  \ Flame 库或 Flutter SDK 可能存在错误。\n\n我在此整理了一份优秀资源列表，如果你卡住了可以寻求帮助：\n\n- Flame Discord\
  \ (https://discord.gg/5unKpdQD78)：在这里，你可以向 Flame 开发团队提问，并获得关于如何使用 Flame 的出色建议。\n\
  \n我们特别想感谢 Flame Discord 服务器上的 Spydon、Erick 和 Wolfen，在我编写本书期间他们提供的所有帮助。\n\n- Stack\
  \ Overflow：监控 Flame Discord 的同样的人也监控 Stack Overflow，你也可以在那里发帖提问。请确保为你的问题添加 #flame\
  \ 标签。\n- Flame 文档：Flame 文档可以在 https://pub.dev/documentation/flame/latest/ 上找到，你可以在\
  \ https://github.com/flame-engine/flame/tree/main/examples 和 https://github.com/flame-engine/awesome-flame#articles--tutorials\
  \ 上找到许多 Flame 的示例和教程。\n- Flutter 社区页面：如需更一般的 Flutter 帮助，请查看 https://flutter.dev/community\
  \ 上的 Flutter 社区页面，你可以在那里找到 Flutter Discord 和 Slack 频道的链接。\n\n在本节中，我们讨论了当你在使用 Flame\
  \ 或 Flutter 时卡住了去哪里寻求帮助。\n\n### 总结\n\n在本章中，我们学习了如何将游戏小部件与其他 Flutter 小部件混合，并在屏幕之间导航以完成我们的游戏。我们还给了玩家在设置屏幕上更改音乐音量的选项。\n\
  \n我们讨论了变现游戏的选项以及接下来学习什么来改善你的游戏开发知识。最后，我们回顾了如果你在游戏中卡住了去哪里寻求帮助。\n\n本书涵盖了很多内容，你现在拥有了使用\
  \ Flutter 和 Flame 构建各种 2D 游戏的知识。祝你的游戏开发之旅好运。我期待看到你创作的游戏。\n\n### 问题\n\n\n\n\n- 1.\
