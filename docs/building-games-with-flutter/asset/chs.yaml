  double posCoinY = (randomY * 32) + 5 +\n    gameScreenBounds.top;\n```\n\n- 15.\
  \ 接下来，让我们修复 `Water` 类的 `position`：\n\n\nadd(Water(position: Vector2(rect.x +\ngameScreenBounds.left,\
