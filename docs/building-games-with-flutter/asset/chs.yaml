- "## 第 10 章：使用 AI 制作智能敌人\n\n游戏现在进展得很顺利，但还没有真正的挑战。我们收集硬币或杀死敌人，但这一切都非常可预测且容易。\n\n在本章中，我们将通过为玩家乔治添加生命值，并让敌人追击我们（每被一个敌人撞到就减少我们的生命值）来使游戏更具挑战性。如果生命值降至零，我们就输掉游戏。因此，目标是在躲避敌人的同时收集硬币。\n\
