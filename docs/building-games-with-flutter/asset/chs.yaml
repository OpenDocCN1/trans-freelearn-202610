  \ rect.id));\n\n- 16. 最后，针对用户界面问题，让我们更新摄像机，使其在跟随乔治时考虑新的游戏屏幕边界：\n\n```\ncamera.followComponent(george,\
  \ worldBounds:\nRect.fromLTWH(gameScreenBounds.left,\ngameScreenBounds.top, 1600,\
  \ 1600));\n```\n\n如果您之前未为 Web 设置过应用，可能需要在项目文件夹中运行以下命令以为项目创建 Web 文件夹：`flutter create`。\n\
  \n**注意**\n\n所有这些更改将原地修改现有行，并在需要时使用新的游戏屏幕边界及初始位置。\n\n既然我们已经修复了用户界面问题，让我们来看看为什么音乐无法在后台播放。\n\
  \n### 设置背景音乐\n\nChrome、Safari 和 Firefox 等现代浏览器会阻止网站在后台播放音频，直到用户与页面交互，以确保这确实是用户想要的。网站经常打开弹出式网站，用广告烦扰用户。因此，开发这些浏览器的公司添加了诸如阻止后台音频等措施，以便用户对这些烦人的弹出窗口有更多控制权。\n\
  \n浏览器特别不希望在首次加载页面时尝试播放背景音乐，而我们正是试图在游戏的 `onLoad` 函数中启动音乐来实现这一点。为了临时修复我们的游戏，我们可以点击网站地址左侧的锁图标，并在\
  \ Chrome 中启用任何声音权限。然后刷新页面，您将再次听到背景音乐。\n\n![](img/a63c3fccbe888cd4d04006b5e1b6c273_152_0.png)\n\
  \n图 8.2 – Chrome 浏览器中的音频权限\n\n这对开发来说没问题，但对于可能访问您网站的玩家来说显然不太理想。在最后一章，*第 11 章，完成游戏*中，我们将向游戏添加一些设置屏幕，并允许玩家基于用户界面交互来打开背景音乐。这将允许用户根据玩家的偏好打开或关闭音乐。\n\
  \n在下一节中，我们将讨论可用于提升 Flutter Web 性能的构建参数。\n\n### 设置 Flutter Web 构建参数\n\n如果您现在使用 Chrome\
  \ 作为设备运行游戏，您会发现可以调整浏览器窗口大小，页面会随之调整大小，组件也会根据此进行更新，尽管在运行游戏时性能不佳。那么，让我们讨论如何为发布编译代码，并通过\
  \ Web 服务器部署以获得更好的性能。\n\n构建 Web 发布版本时，我们必须向 `flutter build web` 命令传递一个参数，以指示我们要从以下两个选项中选择的\
  \ Web 渲染器：\n\n- html：如果您优先考虑下载大小而非性能，请选择此 Web 渲染器。\n- canvasKit：如果您优先考虑性能和跨平台的像素级一致性，请选择此\
  \ Web 渲染器。\n\n我们将使用 `canvaskit`，因为如今性能比下载大小更重要，但请注意，`html` 作为一个选项始终可用，以防您需要它：\n\n\
  - 1. 让我们运行将创建我们发布构建的命令。\n\n在项目文件夹中打开命令行终端并键入以下内容：\n\n```\nflutter build web --release\
  \ --web-renderer canvaskit\n```\n\n编译完成后，它将把 Web 代码保存在 `build/web` 文件夹中。\n\n- 2.\
  \ 接下来，让我们从 `build/web` 文件夹运行 Web 服务器：\n\n```\ncd build/web/\npython3 -m http.server\
  \ 8000 &\n```\n\n在此，我们移动到 Web 代码所在的文件夹并运行 Web 服务器。\n\n我们使用的是 Python 语言免费提供的内置 Web\
  \ 服务器。\n\n如果您未安装 Python，请在运行此命令前上网从 https://www.python.org/downloads/ 安装它。\n\n如果您有自己的\
  \ Web 主机，也可以将 build/web 文件夹的内容上传到您的 Web 主机。\n\n- 3. 在 Web 服务器运行我们的游戏时，打开任何浏览器，并在浏览器地址栏中输入\
  \ http://localhost:8000/。\n\n游戏将加载，您将看到它在浏览器中运行。您还会注意到，它加载和运行的速度比通过 Chrome 设备运行要快得多。\n\
  \n在 Web 上玩完游戏后，您应该关闭 Web 服务器。因为 Web 服务器在后台运行，我们需要先将其带到前台才能将其关闭。\n\n- 4. 在终端中，按 Enter\
  \ 键开始新行，然后键入以下内容以将 Web 服务器带到前台：\n\n```\nfg\n```\n\n- 5. 接下来，按 Ctrl + C 键停止 Web 服务器。\n\
  \n如果您在添加要测试的新代码片段时需要启动和停止 Web 服务器，请注意以下几点：\n\n- 您应始终从项目文件夹编译发布构建。\n- 您应始终从 build/web\
  \ 文件夹运行 Web 服务器。\n\n在本节中，我们解决了动态大小用户界面的问题，并讨论了后台音频问题的替代方案。我们还讨论了如何为 Web 创建发布构建，并在\
  \ Web 服务器上对其进行了测试。\n\n在下一节中，我们将讨论如何使用物理按键进行导航。\n\n### 使用按键事件导航\n\n我们的游戏已经允许玩家角色通过摇杆或触摸事件来控制，但对于网站来说，使用键盘控制角色是更常见的方法。\n\
  \n在本节中，我们将添加键盘控制作为另一种选项，那么让我们开始吧。\n\n要在游戏中监听键盘事件，我们首先必须告诉游戏，我们的一些组件将监听键盘事件：\n\n\
  - 1. 打开 `main.dart` 文件并修改类定义，以包含 `HasKeyboardHandlerComponents` 混入：\n\n```\nclass\
  \ GoldRush extends FlameGame with HasCollidables, HasDraggables, HasTappables, HasKeyboardHandlerComponents\
  \ {\n```\n\n- 2. 在同一文件顶部添加以下输入导入：\n\n```\nimport 'package:flame/input.dart';\n```\n\
  \n- 3. 打开 `george.dart` 文件（我们将在其中监听键盘事件）并修改类定义以添加 `KeyboardHandler` 混入：\n\n```\n\
  class George extends Character with KeyboardHandler {\n```\n\n- 4. 在同一文件顶部添加以下导入：\n\
  \n```\nimport 'package:flutter/services.dart';\n```\n\n- 5. 接下来，让我们添加一些变量来存储按键状态：\n\
  \n```\nbool keyLeftPressed = false, keyRightPressed = false, keyUpPressed = false,\
  \ keyDownPressed = false, keyRunningPressed = false;\n```\n\n在我们的游戏中，我们将使用以下按键映射：\n\
  \n- a. 左 = A 键\n- b. 右 = D 键\n- c. 上 = W 键\n- d. 下 = S 键\n- e. 奔跑 = R 键\n\n- 6.\
  \ 将以下函数覆盖到 George 类中，以监听按键事件，并在按下任何按键时正确设置步骤 5 中设置的变量：\n\n```\n@override\nbool onKeyEvent(RawKeyEvent\
  \ event, Set<LogicalKeyboardKey> keysPressed) {\n  if (event.data.keyLabel.toLowerCase().contains('a'))\
  \ {\n    keyLeftPressed = (event is RawKeyDownEvent);\n  }\n  if (event.data.keyLabel.toLowerCase().contains('d'))\
  \ {\n    keyRightPressed = (event is RawKeyDownEvent);\n  }\n  if (event.data.keyLabel.toLowerCase().contains('w'))\
  \ {\n    keyUpPressed = (event is RawKeyDownEvent);\n  }\n  if (event.data.keyLabel.toLowerCase().contains('s'))\
  \ {\n    keyDownPressed = (event is RawKeyDownEvent);\n  }\n  if (event.data.keyLabel.toLowerCase().contains('r'))\
  \ {\n    keyRunningPressed = (event is RawKeyDownEvent);\n  }\n  return true;\n\
  }\n```\n\n在此，我们检查按键事件数据的键标签是否等于我们映射的字母，然后在按下按键时设置相应的变量。\n\n请注意，我们将数据转换为小写，以防玩家按下了键盘上的大写锁定键，这将生成一个按键事件\
  \ S 而不是 s。\n\n- 7. 添加以下导入以解析按键类：\n\n\n\n```\nImport 'package:flutter/services.dart';\n\
  ```\n\n- 8. 在 update 函数的顶部，位于对 `super.update(dt);` 的调用下方，让我们根据运行按钮是否被按下或 r 键是否被按下来更改速度值。此外，如果步骤\
  \ 5 中的任何变量设置为 true，我们将创建一个布尔值来跟踪我们是否正在使用按键移动：\n\n```\nspeed = (hud.runButton.buttonPressed\
  \ ||\nkeyRunningPressed) ? runningSpeed : walkingSpeed;\nfinal bool isMovingByKeys\
  \ = keyLeftPressed ||\nkeyRightPressed || keyUpPressed || keyDownPressed;\n```\n\
  \n- 9. 在此下方，在 update 函数中，我们有一个检查——如果摇杆不为零，意味着它正在被使用。此检查如下：\n\n```\nif (!hud.joystick.delta.isZero())\
  \ {\n```\n\n让我们在该 if 块末尾为按键移动添加一个 else if 子句，并添加以下代码，该代码将位于 if 块和 else 块之间：\n\n\
  ```\n} else if (isMovingByKeys) {\nmovePlayer(dt);\nplaying = true;\nmovingToTouchedLocation\
  \ = false;\nif (!isMoving) {\nisMoving = true;\naudioPlayerRunning = await FlameAudio.loopLongAudio('sounds/running.wav',\
  \ volume: 1.0);\n}\n\nif (keyUpPressed && (keyLeftPressed || keyRightPressed)) {\n\
  animation = upAnimation;\ncurrentDirection = Character.up;\n} else if (keyDownPressed\
  \ && (keyLeftPressed || keyRightPressed)) {\nanimation = downAnimation;\ncurrentDirection\
  \ = Character.down;\n} else if (keyLeftPressed) {\nanimation = leftAnimation;\n\
  currentDirection = Character.left;\n} else if (keyRightPressed) {\nanimation = rightAnimation;\n\
  currentDirection = Character.right;\n} else if (keyUpPressed) {\nanimation = upAnimation;\n\
  currentDirection = Character.up;\n} else if (keyDownPressed) {\nanimation = downAnimation;\n\
  currentDirection = Character.down;\n} else {\nanimation = null;\n}\n```\n\n这段代码的工作方式与摇杆处理移动的方式相同，即尝试移动我们的玩家，前提是它不与水发生碰撞，并播放行走脚步声。\n\
  \n然后根据按下的键正确设置 `animation` 和 `currentDirection` 变量。\n\n- 10. 在 `stopAnimations`\
  \ 函数中，当动画停止时，让我们重置移动键：\n\n```\nvoid stopAnimations() {\nanimation?.currentIndex\
  \ = 0;\nplaying = false;\nkeyLeftPressed = false;\nkeyRightPressed = false;\nkeyUpPressed\
  \ = false;\nkeyDownPressed = false;\n}\n```\n\n如果您现在在 Chrome 设备上运行游戏，就可以使用键盘上的按键控制\
  \ George 了。\n\n### 摘要\n\n在本章中，我们通过修复调整浏览器窗口大小时的用户界面问题，并允许通过键盘控制移动，将游戏转换为可在网页上运行。\n\
  \n在接下来的几章中，我们将开始着手游戏开发中更高级的主题，从下一章开始实现高级图形效果。\n\n我们将使用粒子效果在杀死敌人时让它们爆炸，并使用图层为我们的精灵创建酷炫的阴影效果。\n\
  \n### 问题\n\n- 1. 网页首次加载时，为什么音乐不会在后台播放？\n\n- 2. 调整游戏窗口大小为什么会导致我们的图形绘制错误？\n\n- 3.\
  \ 为什么我们需要将 `TiledComponent` 包装在另一个类中来修复其用户界面问题？\n\n- 4. 构建网页发布版本时有哪些 Web 渲染器可用？\n\
  \n- 5. 我们需要使用哪个 mixin 来监听键盘事件？\n"
- '## 第 3 部分：高级游戏编程


  本部分介绍高级游戏编程技术，以使您的游戏更具精致感和真实感。


  我们将讨论高级图形效果，使您的游戏脱颖而出，同时还将介绍如何为游戏构建不同的屏幕。我们还将讨论如何让敌人通过追逐玩家和绕过障碍物来表现得智能。


  本部分包含以下章节：


  - 第 9 章，实现高级图形效果

  - 第 10 章，使用 AI 制作智能敌人

  - 第 11 章，完善游戏

  '
- "## 第 9 章：实现高级图形效果\n\n到目前为止，在本书中，我们已使用图形来为精灵组件制作动画并绘制瓦片地图，但我们可以做更多工作来改进游戏的视觉效果。\n\
  \n在本章中，我们将讨论如何使用粒子和阴影来改进我们的游戏。我们将使用粒子效果，使硬币和敌人在碰撞时爆炸，并使用图层为我们的精灵添加阴影效果。这些是改进游戏视觉效果的简单而高效的方法，运行速度非常快，不会过度影响帧率，因此值得用来改进我们的游戏。\n\
  \n本章将涵盖以下主题：\n\n- 什么是粒子效果？\n- 使用粒子制作动画\n- 使用图层创建阴影\n\n### 技术要求\n\n要查看本章的源代码，您可以从\
  \ https://github.com/PacktPublishing/Building-Games-with-Flutter/tree/main/chapter09\
  \ 下载。\n\n### 什么是粒子效果？\n\n粒子效果是为我们的游戏创建火焰、烟雾、爆炸和魔法效果等动态效果的简便方法。粒子具有多种可更改的属性，包括以下内容：\n\
  \n- 粒子存活多长时间\n- 新粒子创建的频率\n- 创建粒子的位置\n- 行进的角度、距离和速度\n- 粒子应具有的颜色\n- 物理学如何影响粒子\n\n\
  粒子效果的一个好例子是烟花。烟花会爆炸出各种颜色，并以不同的速度和角度行进，短时间后在天空中消失。\n\nFlame 支持多种类型的粒子效果，您可以在 https://examples.flame-engine.org/#/Rendering_Particles\
  \ 中查看示例。这些内容在 Flame 文档 https://docs.flame-engine.org/1.0.0/particles.html 中有更详细的讨论，但这里我们先总结一些不同的粒子类型供您参考：\n\
  \n- `MovingParticle` – 在粒子生命周期内在两点之间移动子粒子\n- `AcceleratedParticle` – 对粒子应用基于物理的基本效果，例如重力或速度阻尼\n\
  - `CircleParticle` – 绘制不同大小的圆\n- `SpriteParticle` – 在粒子中使用精灵图像\n- `ComputedParticle`\
  \ – 用于对粒子进行更高级的控制，可能需要计算值来影响粒子\n\n在我们的游戏中，我们希望硬币向外爆炸的同时逐渐淡出 alpha 值。我们将这些粒子设为黄色，以匹配硬币颜色。对于敌人，我们将重复使用爆炸效果，但将粒子设为红色，使其看起来像血。\n\
  \n我们将使用前面不同粒子类型列表中的 `ComputedParticle`，因为我们希望将爆炸粒子分成 12 片。这些片段将从中心以递增的 30 度角向外移动，我们将使用基本三角函数进行计算。粒子将根据这些值生成和计算，并在基于粒子进度逐渐淡出时调整不透明度。\n\
  \n请记住，粒子具有我们可以设置的生命周期。因此，当粒子接近其生命周期末尾时，我们将使其淡出。\n\n实际绘制将是一个简单的圆形，其位置、角度和不透明度均已计算。\n\
  \n让我们在下一节中开始编写粒子代码。\n\n### 使用粒子制作动画\n\n在本节中，我们将向您展示如何创建出色的粒子效果并为其制作动画。首先，我们将在 `utils`\
  \ 文件夹中创建一个新文件来存储我们的效果，以便从任何位置使用：\n\n- 1. 在 `utils` 文件夹中，创建一个名为 `effects.dart` 的新文件并打开该文件。\n\
  \n- 2. 添加以下代码以创建爆炸粒子：\n\n```\nParticle explodingParticle(Vector2 origin,\nMaterialColor\
  \ color) {\ndouble distanceToMove = 15.0;\nreturn Particle.generate(\nlifespan:\
  \ 0.8,\ncount: 12,\ngenerator: (i) {\ndouble angle = i * 30;\ndouble xx =\norigin.x\
  \ + (distanceToMove * cos(angle));\ndouble yy =\norigin.x + (distanceToMove * sin(angle));\n\
  Vector2 destination = Vector2(xx, yy);\nreturn ComputedParticle(renderer: (Canvas\
  \ canvas, Particle particle) {\n```\n\n\n\n```dart\nPaint paint = Paint()..color\
  \ = color.withOpacity(1.0 - particle.progress);\ncanvas.drawCircle(Offset.zero,\
  \ 1.5, paint);\n})).moving(from: origin, to: destination);\n});\n}\n```\n\n这里，我们有\
  \ `explodingParticle` 函数，它返回 `ComputedParticle`。该函数接受一个原点位置，用于指定粒子效果应从哪里开始，以及应用于粒子的颜色。\n\
  \n我们希望粒子移动短距离 `15.0`，我们使用这个距离基于从原点出发的行进角度计算其目标位置。粒子在其生命周期内将到达的最终目标是通过三角函数计算得出的。\n\
  \n我们以 30 度角度生成 12 个粒子，总共 `12 * 30 = 360` 度，以覆盖所有向外的方向。生命周期设置为略低于一秒，即 `0.8`，因此爆炸发生迅速并逐渐消失。\n\
  \n最后，这被包装在 `MovingParticle` 中，它在粒子的生命周期内将粒子在原点和目标之间移动。\n\n在 `lifespan` 时间到期后，粒子将从游戏中移除，因此我们不需要手动监控这一点，Flame\
  \ 会通过从游戏中移除过期粒子来为我们处理此事。\n\n- 3. 在 `effects.dart` 文件顶部，为粒子效果添加以下导入：\n\n```dart\n\
  import 'package:flame/game.dart';\nimport 'package:flame/particles.dart';\nimport\
  \ 'package:flutter/material.dart';\nimport 'dart:math';\n```\n\n让我们继续在 `George`\
  \ 类中创建粒子效果，当我们的玩家与硬币或敌人碰撞时。\n\n- 4. 打开 `george.dart` 文件并添加以下导入：\n\n```dart\nimport\
  \ 'package:goldrush/utils/effects.dart';\nimport 'package:goldrush/main.dart';\n\
  import 'package:flutter/material.dart';\n```\n\n- 5. 在 `George` 类定义中，我们需要获取 `GoldRush`\
  \ 类的引用。之所以需要，是因为当我们创建粒子时，我们需要基于世界坐标设置原点位置。那么，让我们更新该代码：\n\n```dart\nclass George\
  \ extends Character with KeyboardHandler, HasGameRef<GoldRush> {\n```\n\n- 6. 在\
  \ `onCollision` 函数中，让我们通过我们在上一个代码块中刚刚添加的 `gameRef` 引用将粒子添加到游戏中，在这里我们检查碰撞对象是 `Zombie`\
  \ 还是 `Skeleton`：\n\n```dart\nif (other is Zombie || other is Skeleton) {\n  gameRef.add(ParticleComponent(explodingParticle(other.position,\
  \ Colors.red)));\n}\n```\n\n- 7. 接下来，让我们在检查是否与 `Coin` 对象碰撞时执行相同操作：\n\n```dart\n\
  if (other is Coin) {\n  gameRef.add(ParticleComponent(explodingParticle(other.position,\
  \ Colors.yellow)));\n}\n```\n\n如果你现在运行游戏，你会看到当我们与硬币碰撞时，硬币会爆炸成黄色粒子，当我们与敌人碰撞时，敌人会爆炸成红色粒子。\n\
  \n现在游戏中有一些漂亮的粒子效果了，让我们继续在下一节中使用层添加一些阴影。\n\n### 使用层创建阴影\n\n层是 Flame 的一项功能，允许我们将想要一起绘制的内容分组，或者绘制一个不怎么变化的预渲染图形。在你的游戏中，你可能有一个背景，它是由一组精灵或图像绘制一次的，然后它被用作静态图像作为背景，并在其上绘制其他移动的精灵。\n\
  \n如果背景不变化，不断重新创建它是低效的。因此，你可以创建一次并将其存储为层，然后在渲染其他游戏图形之前绘制该层。\n\n在 Flame 中，有两种类型的层：\n\
  \n- PreRenderedLayer – 用于静态图像\n\n- DynamicLayer – 用于移动的内容\n\n`PreRenderedLayer`\
  \ 由于其静态性质，适合用于背景。\n\n你也可能想在层中更改某些内容并重新生成层，然后将生成的图像缓存在层中。例如，你可能希望在游戏中创建一个天气效果，其中雨滴在层上更新并重新绘制，然后将此层绘制在游戏世界之上，以营造下雨或下雪的印象。对于此类效果，`DynamicLayer`\
  \ 更合适。\n\nFlame 还提供了一种称为层处理器的东西，允许我们为整个层添加效果。当前唯一支持的层处理器称为 `ShadowProcessor`，它为整个层应用阴影。当然，你也可以通过扩展\
  \ `LayerProcessor` 类来创建自己的处理器，如果你想创建其他处理器的话。\n\n我们可以将 `ShadowProcessor` 与我们的精灵结合使用，在每个精灵后面创建阴影，使它们在游戏中真正突出。这是通过在应用阴影处理器后将我们的精灵绘制到一个层中来实现的。\n\
  \n让我们通过创建我们的层类来开始：\n\n- 1. 打开 `effects.dart` 文件，在 `Animating with particles` 部分的\
  \ `Step 2` 中我们之前添加的 `explodingParticle` 函数下方，为我们的层添加以下类定义：\n\n```dart\nclass ShadowLayer\
  \ extends DynamicLayer {\n  final Function renderFunction;\n  ShadowLayer(this.renderFunction)\
  \ {\n    preProcessors.add(ShadowProcessor(color: Colors.black, offset: const Offset(4,\
  \ 4)));\n  }\n\n  @override\n  void drawLayer() {\n    renderFunction(canvas);\n\
  \  }\n}\n```\n\n这里，我们创建一个名为 `ShadowLayer` 的类，它是一个 `DynamicLayer`。在构造函数中，我们将阴影处理器添加到预处理器列表中，以便在绘制精灵之前应用阴影效果。请注意，这是预处理器列表，因此如果你创建自己的处理器，可以将多个效果添加到你的层中。此外，还有一个后处理器列表可用，如果你需要，它会在绘制精灵之后添加效果。\n\
  \n我们将阴影设置为黑色，并在精灵绘制位置偏移 4, 4 像素处绘制，以营造精灵后面的阴影效果。\n\n在构造函数中，我们传递一个函数引用，然后在调用 `drawLayer()`\
  \ 时使用它。我们这样做是因为我们想要保持对超类渲染函数的引用，以便将绘制委托给层。因此，我们的精灵会绘制到层上，阴影会应用到上面，然后我们调用超类将层绘制到游戏中，基于我们当前正在渲染的动画帧。\n\
  \n正因为如此，当我们在渲染函数中渲染精灵时，我们将渲染到 `ShadowLayer` 中，而不会在那里调用超类，否则会绘制两次，这既低效也不必要。\n\n-\
  \ 2. 现在，在文件顶部，让我们添加层包的导入：\n\n```dart\nimport 'package:flame/layers.dart';\n```\n\
  \n接下来，让我们先设置 `Coin` 类，并为所有硬币添加阴影，这样我们就可以在实践中看到这种委托渲染是如何工作的。\n\n- 3. 打开 `coin.dart`\
  \ 文件并在文件顶部添加以下导入：\n\n```dart\nimport 'package:goldrush/utils/effects.dart';\n```\n\
  \n- 4. 在 `Coin` 类中，在存储 `originalPosition` 的位置下方添加一个变量来存储 `ShadowLayer`：\n\n```dart\n\
  late Vector2 originalPosition;\nlate ShadowLayer shadowLayer;\n```\n\n- 5. 为 `ShadowLayer`\
  \ 添加以下导入：\n\n```dart\nimport 'package:goldrush/utils/effects.dart';\n```\n\n- 6.\
  \ 在 `onLoad` 函数底部，添加以下行以初始化阴影层：\n\n```dart\nshadowLayer = ShadowLayer(super.render);\n\
  ```\n\n在这里，我们可以看到我们正在将函数引用传递给超类渲染函数。\n\n- 7. 在 `Coin` 类底部，添加以下 render 函数重写，它将绘制委托给\
  \ `shadowLayer`：\n\n```dart\n@override\nvoid render(Canvas canvas) {\n  shadowLayer.render(canvas);\n\
  }\n```\n\n如果你现在运行游戏，你会看到游戏中所有硬币后面都有我们的阴影效果。\n\n![](img/a63c3fccbe888cd4d04006b5e1b6c273_169_0.png)\n\
  \n### 图 9.1 – 精灵上的阴影效果\n\n让我们继续，将相同的效果应用到我们的敌人精灵和玩家精灵 George 上。\n\n我们将此添加到 `Character`\
  \ 类，它是 George 和敌人的基类，以减少重复代码。\n\n- 8. 打开 `character.dart` 文件并添加层包的以下导入：\n\n```dart\n\
  import 'package:goldrush/utils/effects.dart';\n```\n\n- 9. 在 `Character` 类中，在存储\
  \ `originalPosition` 的位置下方添加一个变量来存储 `ShadowLayer`：\n\n```dart\nlate Vector2 originalPosition;\n\
  late ShadowLayer shadowLayer;\n```\n\n- 10. 将以下 `onLoad` 函数添加到 `Character` 类以初始化阴影层：\n\
  \n\n\n```\n@override\nFuture<void> onLoad() async {\n super.onLoad();\n shadowLayer\
  \ = ShadowLayer(super.render);\n}\n```\n\n- 11. 最后，将 render 函数添加到 Character 类中，以将绘制委托给\
  \ shadowLayer：\n\n```\n@override\nvoid render(Canvas canvas) {\n shadowLayer.render(canvas);\n\
  }\n```\n\n请注意，您可能会看到关于调用超类 render 函数的消息，但我们希望避免这种情况，因为它将从我们的阴影层内部调用，因此此处省略了。\n\n\
  如果您现在运行游戏，会发现我们的玩家和敌人身后都有可爱的阴影效果，这真的让它们在背景中显得格外突出！\n\n### 摘要\n\n在本章中，我们学习了如何将高级图形效果应用到游戏中，使游戏看起来好得多。我们添加了粒子效果，使硬币和敌人在碰撞时爆炸，并在玩家、敌人和硬币身后添加了一些漂亮的阴影效果。\n\
  \n在下一章中，我们将讨论如何通过为玩家和敌人添加游戏人工智能（AI），使它们看起来更智能。\n\n我们将改变敌人的行为——不再是我们攻击他们，而是他们攻击我们！当乔治靠近他们时，敌人会追击他，并且当他们撞到我们时仍然会爆炸，但我们将为乔治添加一个生命值，如果我们与爆炸的敌人碰撞，该值会减少。此外，敌人只有在面朝乔治、能看见乔治且在一定距离内时才会追击。\n\
