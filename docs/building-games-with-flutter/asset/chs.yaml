  \ 移动到该位置。\n\n### 使用触摸移动我们的角色\n\n既然我们已让 George 使用摇杆移动，让我们来看看通过屏幕触摸事件移动角色的替代方法，这在游戏中非常流行。随着现代移动设备拥有非常灵敏的高分辨率屏幕，我们可以使用触摸事件或手势将角色从当前位置移动到屏幕上被点击的位置。使用三角函数，我们可以计算原点和目标位置之间的角度，并使用该角度沿正确方向移动\
