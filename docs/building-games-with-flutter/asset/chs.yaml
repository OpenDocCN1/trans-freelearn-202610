  \ 组件。\n\n### 修复 HUD 组件\n\n现在让我们继续修复 HUD 组件。\n\n目前，在我们的 HUD 中，我们使用边距根据屏幕角落调整摇杆、运行按钮和分数文本的位置。目前\
