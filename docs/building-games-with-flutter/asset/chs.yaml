  \ `TiledComponent`，它本身扩展自 `Component` 类。这是所有其他组件的基类，而这个类本身没有位置。这对跟踪瓦片地图的游戏边界来说是个问题。因此，解决方法是将我们的\
  \ `TiledComponent` 包装在另一个类中，我们将其命名为 `TileMapComponent`。\n\n`TileMapComponent` 本身是一个位置组件，我们将使\
