    \ JSON 是最常见的。\n\nTiled 是一个易于上手的工具，但也具有超出本书范围的高级功能，因此我们不会在此深入探讨它。相反，我们将提供现成的图块地图供我们的游戏使用，以便你可以直接使用它们，但我确实建议在你想为自己的游戏创建图块地图时花一些时间使用\
