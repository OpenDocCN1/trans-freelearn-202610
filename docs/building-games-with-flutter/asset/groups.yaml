    \ 64.0), speed: 20.0));\nadd (Skeleton(position: Vector2(100, 600),\nsize: Vector2(32.0,\
    \ 64.0), speed: 60.0));\nadd (Skeleton(position: Vector2(300, 600),\nsize: Vector2(32.0,\
    \ 64.0), speed: 60.0));\nadd(ScreenCollidable ());\nadd(hud);\n}\n```\n\n如果您现在运行应用，将能够用摇杆控制\
