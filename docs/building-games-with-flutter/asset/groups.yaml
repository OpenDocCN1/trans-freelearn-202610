    the map and reposition all our components based on our new screen size. Some screens
    are very high resolution and larger than our physical map size of 1,600 x 1,600,
    which means we will need to ensure our game still looks great on these larger
    screens.


    In this chapter, we will cover the following topics:


    +   - Building the game for the web and desktop

