  mdcn: "\n\n如果您现在运行游戏，将看到新组件与现有游戏精灵一起显示：\n\n得分：0\n\n![](img/a63c3fccbe888cd4d04006b5e1b6c273_86_0.png)\n\
    \n图 5.1 – 带 HUD 控件的游戏\n\n在本节中，我们学习了如何将摇杆、按钮和分数添加到游戏中，并将它们定位在屏幕上。\n\n在下一节中，我们将把摇杆与乔治的移动连接起来，并在按下运行按钮时让他跑得更快。当乔治与敌人碰撞时，我们还会将分数增加\
