    }\nFlameAudio.play('sounds/coin.wav', volume: 1.0);\n}\n```\n\n如果您现在运行游戏，将看到地图上的旋转硬币，并可以稍微移动\
    \ George 来收集硬币。但是，您会注意到我们仍然局限于地图的左上角，即使尝试超出这个左上角移动也是如此。\n\n在下一节中，我们将摆脱 George\
    \ 和敌人的这一限制，允许他们通过向游戏地图添加导航来在地图上移动！\n\n## 了解地图导航\n\n既然我们已加载瓦片地图，并动态将敌人和硬币添加到地图中，我们可以修复导航，以便在地图上四处走动。但在此之前，让我们谈谈相机以及我们如何在游戏中使用它们。\n\
    \n相机允许我们改变屏幕上看到的内容，当地图大于物理屏幕时这非常有用。我们可以利用此功能执行以下操作：\n\n  - 缩放相机以显示更多或更少的地图。\n\
    \  - 显示与 George 当前在地图上的位置不同的地图部分。\n  - 使用动画移动到地图的不同部分，以实现平滑过渡。\n  - 将相机位置链接到跟随\
    \ George，这样当 George 在地图上移动时，相机会更新并使 George 保持可见，而地图会围绕他的位置移动。\n\n大多数游戏使用这些方法的组合，但我们最感兴趣的是最后一点，因为我们希望相机在\
    \ George 移动时跟随他。\n\n## 重要提示\n\n如果您有兴趣了解其他要点，请在 Flame 文档中查找相机内容。相机文档可在 https://docs.flame-engine.org/main/camera_and_viewport.html\
    \ 中找到。\n\n让我们开始修复导航：\n\n- 1. 打开 `main.dart` 文件，并在 `onLoad` 函数的底部添加以下代码：\n\n```\n\
    camera.speed = 1;\ncamera.followComponent(george, worldBounds:\n  Rect.fromLTWH(0,\
    \ 0, 1600, 1600));\n```\n\n在此，我们设置相机速度，将相机设置为跟随 George，并将世界边界设置为 1,600 x 1,600，即\
    \ 50 个瓦片的宽度和高度乘以每个瓦片的像素大小（32）。\n\n如果您现在运行此代码并在地图上导航，可能会注意到几个问题：\n\n- a. 敌人不会移动超过原始屏幕尺寸。\n\
    - b. 您只能在原始屏幕尺寸内触摸移动。\n\n让我们逐个修复这些问题。\n\n- 2. 敌人无法在地图上移动的原因是它们与在屏幕为固定大小时添加的 `ScreenCollidable`\
    \ 发生碰撞。由于我们将在下一节中处理此碰撞，我们可以只删除 `onLoad` 函数底部添加 `ScreenCollidable` 文件的那一行：\n\n\
    ```\nadd(ScreenCollidable());\n```\n\n- 3. 您只能在物理屏幕边界内触摸的原因是触摸事件在 `Background`\
    \ 类中捕获，且 `Background` 类的大小目前基于屏幕的物理尺寸。\n\n另外，现在我们正在绘制地图，背景仅用于检测并将触摸事件传递给 George，因此我们可以从\
    \ Background 类中删除大部分绘制代码。打开 background.dart 文件，更改类中的所有代码并添加精简后的代码，如下所示：\n\n```\n\
    import 'package:flame/components.dart';\nimport 'package:flame/input.dart';\n\
    import 'george.dart';\nclass Background extends PositionComponent with\n  Tappable\
    \ {\n  Background(this.george);\n  final George george;\n  @override\n  Future<void>\
    \ onLoad() async {\n    super.onLoad();\n    position = Vector2(0, 0);\n    size\
    \ = Vector2(1600, 1600);\n  }\n  @override\n  bool onTapUp(TapUpInfo info) {\n\
    \    george.moveToLocation(info);\n    return true;\n  }\n}\n```\n\n除了精简此类中的代码外，主要更改是在\
    \ onLoad 函数底部，我们将大小设置为 1,600 x 1,600，即地图大小，而不是我们之前在第 5 章“使用输入移动图形”的“绘制屏幕控件”部分中使用的屏幕大小。\n\
    \n如果您现在运行游戏，将看到这些问题已修复，我们可以四处导航并收集硬币。不幸的是，现在我们已移除 ScreenCollidable，George 和敌人可以走出屏幕边缘。\n\
    \n在下一节中，我们将通过将地图周围的水设为可碰撞对象来修复此问题，以便在移动时进行检查，\n\n"
