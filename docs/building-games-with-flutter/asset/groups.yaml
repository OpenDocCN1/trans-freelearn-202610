    ## Chapter 1: Getting Started with Flutter Games


    Welcome to *Building Games with Flutter*!


    We will show you how to use Google''s **Flutter** framework to build scalable
    games that work across mobile and web platforms. Flutter may seem a strange choice
    at first for building games because there are more established frameworks for
    making games, such as Unity or Unreal Engine, but a lot of these tools are very
    complex to learn and it takes a long time to start producing games with them.


    Building on your existing knowledge of Flutter and **Dart**, we will take you
    through the steps needed to build a 2D game that will work across all supported
    platforms. Starting with the basics, we will build on this knowledge and gradually
    get on to more advanced game topics. By the end of the book, you will be able
    to make your own 2D games containing the following:


    - Animating graphics around the screen

    - Playing sound effects and music

    - Controlling your player with keys, joystick, or gestures

    - Detecting when graphics collide

    - Creating game level maps and navigating around them

    - Designing games

    - Scaling the game across different platforms

    - Advanced graphical effects

    - Intelligent enemies


    We will cover the core concepts with examples and then build on this, chapter
    by chapter, gradually building up a full game that works across different devices.
    Each chapter will contain code samples to help learn the building blocks of game
    development, along with the code, image, and sound resources to build our complete
    game. The game involves the player navigating around a map and avoiding the enemies
    while collecting as much gold as they can.


    In this chapter, we want to delve a bit deeper into Flutter and Dart and what
    features they have that make them a great choice for game development. This will
    give you an understanding of why Flutter and Dart can be used for fast, smooth
    games across many platforms.


    In this chapter, we will cover the following topics:


    - Working with Flutter

    - Using Dart

    - Summarizing the book

    - Creating a simple example animation


    We have a lot to cover, so let''s get started!


    ### Technical requirements


    In this chapter, you should have your code editor set up along with the latest
    versions of Flutter and Dart installed. The book is based on Flutter v3.0.0, Dart
    2.17.0, and Flame v1.0.0.


    All the source code for this book can be downloaded from the Git repository at
    https://github.com/PacktPublishing/Building-Games-with-Flutter.git.


    The source code for this chapter specifically can be found here: https://github.com/PacktPublishing/Building-Games-with-Flutter/tree/main/chapter01.


    ### Working with Flutter


    You will have used Flutter to build apps or websites before and may be wondering
    whether Flutter is good enough to make great games. Flutter is a great choice
    for game programming for the following reasons:


    - Flutter has very fast rendering times and is scalable across many platforms.

    - Flutter games aim to draw at 60 frames per second (FPS) for smooth animation,
    or 120 FPS on devices capable of supporting higher refresh rates.

    - Flutter code uses a single code base to make maintenance easier and enables
    the code to run on many devices.

    - The Flutter core is written in C++, which makes games run at native speeds.

    - Flutter is cost-effective due to being open source (businesses like Flutter
    because they don''t have to pay for expensive licenses as they have to with some
    other frameworks).


    Unlike other frameworks, Flutter does not use native components and instead draws
    its own, all drawn with the lightning-fast Skia Graphics Engine. Skia is an open
    source graphics library that works on a variety of hardware and software platforms,
    which abstracts away platform-specific graphics APIs that are different on each
    platform. The APIs provide functionality for drawing shapes, text, and images.


    Now that we have explained Flutter, let''s delve deeper into the language that
    Flutter uses, Dart.


    ### Using Dart


    In this section, we will discuss Dart and the language features that make it a
    great fit for game development. We will discuss how Dart is compiled, and how
    it uses threads and garbage collection. We will also discuss great features such
    as how hot reload aids us in developing code fast.


    ### Compilation types


    Computer programming languages can be either static or dynamic. A static language
    will be compiled into machine code before it runs, such as C++. A dynamic language
    is executed by an interpreter, so it does not need to be compiled before running
    (such as JavaScript).


    As programming languages evolved, virtual machines were invented, which made it
    easier to port a language to a new hardware platform. The code is converted to
    bytecode, which is then run on the virtual machine. Java is an example of a language
    that uses bytecode.


    The virtual machine imitates hardware in software and can be ported to run on
    different hardware platforms, making the code portable.


    As compiler technology evolved, **just-in-time** (**JIT**) compilers were invented,
    which improved the performance of code running on virtual machines by compiling
    the code on the fly.


    Compiling a program into machine code before running became known as **ahead-of-time**
    (**AOT**) compilation. Dart is unique in that it supports both JIT and AOT compilation
    types, which provides a massive advantage for developers. Developers can distribute
    the app compiled with AOT for maximum speed and performance, which helps games
    run smoothly.


    When running in JIT compilation mode, Flutter and Dart have an amazing feature
    called **stateful hot reload** that cuts down development time.


    ### Hot reload


    Flutter uses the JIT compiler to allow you to reload and run code in less than
    a second. This allows you to change code and see the changes reflected on the
    emulator or web browser instantly, while retaining the internal state of the game.


    This is great for game development as you can modify code and see the effect of
    the change, which speeds up development massively. It feels like painting with
    code!


    For instance, you might reposition a graphic by a few pixels or change a color.
    In traditional development, you would have to rebuild the code (which could take
    many minutes) to see the change, but in Flutter, this is instant.


    ### Native bridge


    Dynamic languages such as JavaScript communicate with the native code on the platform
    over a bridge, which is very slow. They do this for things such as drawing the
    native components of the platform they are running on.


    The **native bridge** is used to provide an interface between dynamic code and
    native code for all code, sending state information for **user interface (UI)**
    components.


    In Flutter, instead of this, Skia draws all the components on a canvas (and makes
    them look and feel like native components), so it bypasses the need for a native
    bridge.


    This is massive because with a native bridge you also need to pass the state of
    the UI components before they can be drawn, which slows everything down and can
    cause your UI to skip frames instead of keeping the animation smooth.


    ### Garbage collection


    Dart uses an advanced garbage collection system that quickly handles short-lived
    objects in memory.


    As Flutter rebuilds the widget tree every frame, it throws away the old objects
    and recreates new objects. In a language such as Java, this would cause issues,
    but Dart is optimized to handle this very quickly.


    Most languages require the use of locks to access shared memory, but Dart can
    perform its garbage collection most of the time without using locks. This fast
    garbage collection results in very smooth graphics performance, which greatly
    enhances our game.


    ### Thread control


    The developer has more control over code execution in Dart due to the way threads
    are implemented. Because Dart doesn''t usually require locks for accessing shared
    memory, unlike most other languages, we have more control over the execution of
    the code.


    Without locks, we avoid a type of call called a race condition, which can happen
    when separate threads want access to the shared resource (in this case, memory)
    and it can''t be accessed because some other thread has locked access and the
    lock has to be released before other threads can access it.


    In this section, we have discussed how the features of the Dart language help
    us to write fast games. In the next section, we will summarize what you will learn
    throughout the book.


    ### Summarizing the book


    In the following subsections, let''s start to take a look at what each chapter
    will explore.


    ### Flame


    In the next chapter, Chapter 2, Working with the Flame Engine, we will cover the
    basics of how to use the Flame engine library to set up a game loop, and how to
    organize your assets for efficient loading.


    ### Designing a game

