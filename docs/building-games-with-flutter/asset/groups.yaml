    ![](img/a63c3fccbe888cd4d04006b5e1b6c273_114_0.png)


    # Figure 7.1 – Editing a map with the Tiled map editor


    The levels we create with Tiled are known as tile maps. Tile maps are very common
    in 2D game development as they allow us to create large maps or levels out of
    fixed-size tiles.


    A tile map is like a sprite sheet, which we have used before in Chapter 4, Drawing
    and Animating Graphics. The data is stored in one large image, and we extract
    what we need into smaller components.


    This is a very performant and memory-efficient way of creating maps larger than
    the physical screen size. If you were to try and make this with a very large image,
    the image would need to be loaded into memory, which may cause the game to crash
    or run very slowly.


    Let''s look at an example of some graphics from a tile map and how they might
    be used. The following example is from the website https://opengameart.org/content/tilecraft-tile-set-ground#,
    which was made by user GrumpyDiamond.'
  - '[PAGE 115]


    As you can see in the following screenshot, it has different types of terrain
    that we can use to create a larger map:


    ![](img/a63c3fccbe888cd4d04006b5e1b6c273_115_0.png)


    Figure 7.2 – An image containing various terrains


    Sometimes, tile map images also contain buildings or trees that you can use on
    the maps too, but in this example, we see tiles for making water, grass, paths,
    and a few plants.


    We can then load this image and break each image part into its smaller tiles,
    which can then be used to create a larger map, as in the following screenshot:


    ![](img/a63c3fccbe888cd4d04006b5e1b6c273_115_1.png)


    Figure 7.3 – Using the terrain images to make a larger map


    Notice in Figure 7.3 that a much larger water area was created by reusing the
    smaller tile images to build something much bigger.


    The Tiled tool makes creating tile maps very easy, including tools such as image
    editing, which allow you to draw with tiles onto the map however you'
