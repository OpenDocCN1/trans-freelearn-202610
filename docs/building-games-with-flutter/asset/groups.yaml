    In Flame, we implement the game loop by extending one of the base classes, which
    automatically calls our `update` and `render` functions continuously. In the first
    example from [Chapter 1, Getting Started with Flutter Games], we used the `Game`
    mixin. This allowed us to override the `update` and `render` functions. This allowed
    us a lot of control over the process, but it can be very cumbersome once you start
    drawing and updating a lot of sprites. Then, when you start adding input controls
    and collision detection, it can quickly become difficult to maintain and keep
    track of everything.


    Fortunately, Flame has classes to help with all this as your game grows, which
    we will discuss further in the next section.


    # Working with components


    As with any growing code base, it''s important to have a structure. This is so
    that the code is easy to maintain as we add more features to the game.


    Currently, our code contains a simple example of how to render and update a square
