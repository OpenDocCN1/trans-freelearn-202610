    ```


    This translates the x value of the square position by multiplying the speed, direction,
    and `deltaTime` parameters together. The y value is 0, which means we are not
    translating the y value. This is because, in this example, we are not moving in
    the y direction. However, you can update them at the same time to travel diagonally
