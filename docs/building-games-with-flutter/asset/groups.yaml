  mdcn: "\n\n## 第2部分：图形与声音\n\n在本书的这一部分中，我们将演示如何使用Flame库的媒体功能来动画化图形并播放声音。我们还将讨论如何根据玩家输入来动画化图形。最后，我们将讨论关卡设计以及如何将游戏扩展到多个平台。\n\
    \n本部分包含以下章节：\n\n- 第4章，绘制和动画化图形\n- 第5章，使用输入移动图形\n- 第6章，播放音效和音乐\n- 第7章，设计您自己的关卡\n\
    - 第8章，为Web和桌面扩展游戏\n\n### 第4章：绘制和动画化图形\n\n在本章中，我们将超越绘制简单形状，讨论如何绘制和动画化大多数游戏中常见的像素图形。这将使我们的游戏看起来好得多，并随着角色在屏幕周围动画化而让游戏栩栩如生。\n\
