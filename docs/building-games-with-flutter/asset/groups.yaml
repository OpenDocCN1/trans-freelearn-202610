    \ posCoinY = (randomY * 32) + 5;\n    add(Coin(position: Vector2(posCoinX, posCoinY),\n\
    \        size: Vector2(20, 20)));\n}\n```\n\n该代码使用当前时钟时间作为种子创建随机数生成器以初始化随机数，这将使数字真正随机。\n\
    \n如果您想要生成更可预测的数字序列，可以每次传递相同的固定整数。在希望创建一组始终相同但看似随机的关卡数据的游戏中，这可能很有用。\n\n接下来，我们生成\
