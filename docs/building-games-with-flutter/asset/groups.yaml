  mdcn: "\n\ndetecting whether we collide with the water and preventing George or\
    \ the enemies from moving over it.\n\n## 检测方块碰撞\n\n到目前为止，在我们的游戏中，我们使用组件级碰撞检测来检测\
    \ George 与金币和敌人之间的碰撞。当你使用地图关卡时，通常会在地图上添加其他作为障碍物的对象，例如水、建筑物或树木。当玩家在包含这些物品的地图上导航时，我们要确保\
    \ George 和敌人都不会穿过这些物体。\n\n在 *了解地图导航* 部分，我们删除了 `ScreenCollidable` 组件以允许敌人在地图上自由移动，但现在敌人和\
    \ George 都可能走出地图。\n\n在本节中，我们将添加一个围绕地图的水障碍。我们将检查碰撞，以防止 George 和敌人离开地图。我们将从对象层读取水在地图上的位置，并创建新的\
    \ `Water` 组件。我们将使这些组件可碰撞并将它们添加到游戏中，这样 Flame 就会检查与水的碰撞，我们就可以阻止 George 或敌人在水面上移动。\n\
    \n这带来了一些有趣的挑战，因为在我们之前的碰撞检查中，当 George 与敌人或金币碰撞时，我们只需将其移除，而 George 可以继续向他旅行的方向移动，但现在我们必须在碰撞水时阻止移动。在深入探讨之前，我们先多谈谈\
    \ Flame 检查碰撞时发生了什么。\n\n## 了解碰撞\n\n当我们将组件设置为可碰撞时，我们在对象周围添加了一个形状。然后，Flame 可以使用这些形状来计算一个形状是否与另一个形状相交，如果发生这种情况，则触发碰撞检测。\n\
    \n随着游戏的发展，我们不断添加更多可碰撞的物品，此过程的问题是每在游戏中添加一个可碰撞物品，就需要进行一次碰撞检查。碰撞检查越多，处理器处理背后所有数学所需的努力就越大。最终，如果碰撞检查太多，游戏性能会下降，你会注意到游戏开始变慢。\n\
    \n让我们来看看迄今为止游戏中的一些数学，以便了解这一点：\n\n- 游戏中有 12 个敌人，6 个僵尸和 6 个骷髅。\n- 游戏中有 50 枚金币。\n\
    - 我们将在地图边缘添加边界，由于每条边都有 50 个方块，地图周围有 4 条边，因此可能会有大约 200 个水组件。\n- 我们还有我们的玩家 George。\n\
    \n游戏中共有 263 个可碰撞对象。目前，这些可碰撞对象中的每一个都需要与游戏中其他所有可碰撞对象进行碰撞检查。因此，那就是 263 * 263 = 69,169\
    \ 次碰撞检查。这将近 70,000 次碰撞检查，而且每帧都在发生！\n\n这是一个令人生畏的碰撞检查数量，我们的游戏竟然还能运行，真是令人惊讶！\n\n\
    想看看，这些检查中大部分完全是浪费，因为金币彼此之间无法碰撞，它们都分布在地图各处，并且不会移动。我们将要添加的水对象也是如此。此外，水对象也不能与金币碰撞，因为它们位于不同的位置。\n\
