  mdcn: "\n\n通过引入新的动画硬币精灵，并将它们随机放置在地图上的各个位置。当然，如果我们想要，可以将这些作为对象层添加到瓦片地图中，但既然我们已经了解了如何使用敌人添加固定对象，让我们使硬币的位置随机化，以使游戏更有趣。\n\
    \n- 3. 从 https://github.com/PacktPublishing/Building-Games-with-Flutter/tree/main/chapter07/assets/images/coins.png\
