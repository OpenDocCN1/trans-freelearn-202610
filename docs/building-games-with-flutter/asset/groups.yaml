    \n这在游戏中非常常见，因为你可能希望某些宝藏或敌人在地图上的特定位置生成。Tiled 有一个称为“层”的功能，可以很好地帮助我们实现这一点。最常见的两种层是图块层和对象层。我们在之前的章节\
