    # Chapter 5: Moving the Graphics

    with Input


    In this chapter, we will take control of our own character and move them

    around the screen with virtual joysticks and touch events, so the player can

    choose where they want to move their character.


    We will start by looking at how to draw onscreen controls that behave like a

    thumb-stick on a PlayStation controller, with action buttons for things such as

    attacking and jumping. Next, we will connect the virtual controls with our

    George sprite and get him moving around the screen. And finally, we will

    discuss an alternative or addition to virtual controls, by controlling George

    with touch events, such as tapping on the screen and moving George to a

    tapped location.


    So, we will cover the following topics:


    +   - Drawing onscreen controls

    +   - Moving our character with onscreen controls

    +   - Moving our character with touch


    # Technical requirements


    To examine the source from this chapter, you can download it from

