    This is fine for development, but obviously not great for your players who may
    visit your website. In the final chapter, *Chapter 11, Finishing the Game*, we
    will add some setting screens to the game and allow the player to turn on background
    music based on a user interface interaction. This will allow the user to turn
    the music on or off, based on the player''s preferences.


