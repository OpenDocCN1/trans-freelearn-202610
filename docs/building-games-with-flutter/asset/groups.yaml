    In this section, we added sound effects for George running and colliding with
    an enemy. We also added the correct handling for stopping the long-looped running
    sound when George stops moving or when the game is moved to the background.


    If you run the game now, you will hear the background music playing but the sound
    effects may be difficult to hear at the same time because of the music playing
    too. This is because both the sound effects and music have the same default volume,
    making it difficult to hear them both clearly.


    In the next section, we will adjust the volume of the sound effects and music
    to fix this issue and make it easier to hear the sound effects.


    # Controlling the volume


    Fixing the volume of the music and sound effects is very easy and only requires
    a few small changes. Let''s take a look:


    +   1. Open the main.dart file. In the onLoad function, where we added the call
    to play the background music, change this line to pass the volume parameter:


    ```

    await FlameAudio.bgm.play(''music/music.mp3'',

    volume: 0.1);

    ```


    Here we set the music volume to 0.1, keeping it low so we can hear the sound effects
    better. The volume parameter can be any value between 0.0 and 1.0 (0.0 mutes the
    sound of the music or sound effect completely, whereas 1.0 plays the sound at
    full volume).


    +   2. Open the george.dart file and let''s update the calls to play each sound
    effect to use the volume parameter. In the onCollision function, update the enemy
    dying sound effect like this:'
  - '[PAGE 111]


    ```

    FlameAudio.play(''sounds/enemy_dies.wav'', volume: 1.0);

    ```


    +   3. In the update function, change the two calls to play the running sound
    effect, and add the volume parameter in both places:


    ```

    audioPlayerRunning = await FlameAudio.loopLongAudio(

    ''sounds/running.wav'', volume: 1.0);

    ```


    If you run the game now, you will be able to hear the sound effects over the music.


    # Summary


    In this chapter, we introduced music and sound effects to make the game better.
    We handled the playback and paused the sound when the app is in the background,
    and resumed it when the player returns to the game, by handling the life cycle
    events.


    In the next chapter, we will go beyond the limits of the physical screen and learn
    how to make game levels that use maps that we can scroll around as we move around
    the map.


    # Questions


    +   1. Which library do we use to add audio to our games?

    +   2. Why is it beneficial to load the audio into the audio cache?

    +   3. Why do we need to clear the audio buffer after the components are removed
    from the game?

    +   4. Which life cycle change states do we need to handle when the game is backgrounded?

    +   5. What class do we use to keep a reference to a longer sound effect?

    +   6. How do we change the default volume for music or sound effects?'
