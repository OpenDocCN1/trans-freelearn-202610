    detecting whether we collide with the water and preventing George or the enemies
    from moving over it.


    # Detecting tile collisions


    So far in our game, we have used component-level collision detection to detect
    collisions between George and the coins and enemies. When you are working with
    map levels, you will generally add other objects on the map that act as barriers,
    such as water, buildings, or trees. As the player navigates around maps with these
    types of items, we want to ensure that neither George nor enemies walk through
    these objects.


    In the *Understanding map navigation* section, we removed the `ScreenCollidable`
    component to allow the enemies to freely move around the map, but now the enemies
    and George can wander off the map.


    In this section, we are going to add a water barrier that will go around the map.
    We will check for collisions to prevent both George and the enemies from being
    able to leave the map. We will read the map locations of the water from an object
    layer and create new `Water` components. We will make these components collidable
    and add these to the game so that Flame will check for collisions with the water
    and we can prevent George or the enemies from moving over the water.


    This presents some interesting challenges because with our previous collision
    checks, we just remove the enemy or coin when George collides with them, and George
    can continue to move in the direction he is traveling in, but now we will have
    to prevent movement when we collide with the water. Before we get into that, let''s
    first talk a little bit more about what is happening when Flame checks for collisions.


    # Understanding collisions


    When we set up a component to be collidable, we are adding a shape around the
    object. Then, Flame can use these shapes to calculate if one shape intersects
    with another shape and trigger a collision detection if that happens.'
  - '[PAGE 128]


    As the game grows, we keep adding more items that can be collided with, and the
    problem with this process is that for every collidable item we add to the game,
    there needs to be a collision check. The more collision checks we have, the more
    effort is required by the processor to handle all the math behind that. Eventually,
    if you have too many collision checks, the performance of the game will degrade,
    and you will notice that the game starts to slow down.


    Let''s look at some of the math that we have in the game so far, to put this in
    context:


    +   - We have 12 enemies in the game, 6 zombies and 6 skeletons.

    +   - We have 50 coins in the game.

    +   - We are going to add borders around the edges of the map, so that could be
    around 200 water components due to each edge having 50 tiles with 4 edges around
    the map.

    +   - We also have our player, George.


    This is 263 collidable objects in the game. At the moment, every one of these
    collidable objects has a collision check with every other collidable object in
    the game. So, that is 263 * 263 = 69,169 collision checks. That''s nearly 70,000
    collision checks, and that''s happening every frame!


    That''s a scary number of collision checks and it''s surprising our game is still
    running!


    If you think about it, most of those checks are a complete waste, because a coin
    cannot collide with other coins as they are all spread out around the map, and
    they don''t move. This is the same for the water objects that we will add too.
    Also, the water objects can''t collide with the coins either as they are in different
    locations.


    Fortunately, Flame provides a great solution to this issue by allowing us to set
    `collidableType` on the collidable component to let us tell Flame whether we should
    do a check or not for this object.'
