    \    break;\n  case Character.left:\n    animation = leftAnimation;\n    break;\n\
    \  case Character.up:\n    animation = upAnimation;\n    break;\n  case Character.right:\n\
    \    animation = rightAnimation;\n    break;\n}\n```\n\n- 4. 打开 zombie.dart 和\
    \ skeleton.dart 文件，在两者中，不再从 Character 继承，而是将类定义更改为从 EnemyCharacter 继承。\n- 5. 删除之前对\
