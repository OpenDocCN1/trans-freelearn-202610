    \ `ScreenCollidable` 添加到要跟踪的可碰撞组件列表中，每当我们的弹跳正方形碰到屏幕边缘时，都会收到通知：\n\n```\n@override\n\
    Future<void> onLoad() async {\n  super.onLoad();\n  add(Player());\n  add(ScreenCollidable());\n\
    }\n```\n\n- 15. 此外，让我们导入 `package:flame/components.dart`，`ScreenCollidable` 就在那里，如下所示：\n\
    \n```\nimport 'package:flame/components.dart';\n```\n\n- 16. 现在，在我们的 `Player`\
    \ 类中，在定义类的那一行，我们需要添加 `HasHitboxes` 和 `Collidable` mixins：\n\n```\nclass Player\
    \ extends PositionComponent with\n    HasHitboxes, Collidable {\n```\n\n这将允许我们在与屏幕边缘发生碰撞时，在\
    \ `onCollision` 函数中接收回调，我们将在下一步实现该函数。\n\n- 17. 通过添加以下内容来实现 `onCollision` 函数：\n\
    \n```\n@override\nvoid onCollision(Set<Vector2> points,\n    Collidable other)\
    \ {\n  if (other is ScreenCollidable) {\n    if (squareDirection == 1) {\n   \
    \   squareDirection = -1;\n    } else {\n      squareDirection = 1;\n    }\n \
    \ }\n}\n```\n\n在这里，当我们收到 `onCollision` 回调以告知我们与哪个组件发生了碰撞时，我们检查是否与 `ScreenCollidable`\
    \ 发生了碰撞，如果是，我们只需翻转正方形正在移动的方向。\n\n- 18. 既然我们现在使用内置的碰撞跟踪系统，就必须正确设置精灵的位置以便设置边界框，因此我们将使用从\
    \ `PositionComponent` 组件继承的内置 position 变量。\n\n首先，你可以删除或注释掉 `squarePos` 矩形，因为我们不再需要它：\n\
    \n```\n// late Rect squarePos;\n```\n\n- 19. 然后，在 onLoad 函数中，删除或注释掉以下行：\n\n```\n\
    // squarePos = Rect.fromLTWH(centerX, centerY,\n//     squareWidth, squareHeight);\n\
    ```\n\n- 20. 在此下方，我们将设置内部变量 `position` 和 `size`：\n\n```\nposition = Vector2(centerX,\
    \ centerY);\nsize = Vector2(squareWidth, squareHeight);\n```\n\n在这里，我们基于现有变量设置位置和大小，这些变量用于计算屏幕中心，并为宽度和高度提供固定值。\n\
    \n- 21. 接下来，我们需要为 `Hitbox` mixin 添加一个形状，否则它将无法检测到与任何东西的碰撞。根据你的精灵形状以及你希望用于碰撞检测的精灵点，你可以使用几种内置形状。最常见的是，你的精灵将是矩形/正方形，因此你可以使用\
    \ `HitboxRectangle` 作为形状。但是，如果你的精灵是一个球，你会改用 `HitboxCircle`。你也可以创建自定义形状，但在大多数情况下，这是不必要的。\n\
    \n我们的形状是一个正方形，所以让我们在刚刚设置好位置和大小的地方添加用于碰撞跟踪的形状，如下所示：\n\n```\naddHitbox(HitboxRectangle());\n\
    ```\n\n- 22. 我们的 `onLoad` 函数现在应该如下所示：\n\n```\n@override\nFuture<void> onLoad()\
    \ async {\n  super.onLoad();\n\n  screenWidth =\n      MediaQueryData.fromWindow(window).size.width;\n\
    \  screenHeight =\n      MediaQueryData.fromWindow(window).size.height;\n  centerX\
    \ = (screenWidth / 2) - (squareWidth / 2);\n  centerY = (screenHeight / 2) - (squareHeight\
    \ / 2);\n  position = Vector2(centerX, centerY);\n  size = Vector2(squareWidth,\
    \ squareHeight);\n  addHitbox(HitboxRectangle());\n}\n```\n\n- 23. 既然我们已移除了 squarePos\
    \ 矩形，就需要更新 render 和 update 函数以使用内部 position 值：\n\n```\n@override\nvoid render(Canvas\
    \ canvas) {\n  super.render(canvas);\n  renderHitboxes(canvas, paint: squarePaint);\n\
    }\n```\n\n因为我们已经设置了一个形状相同并使用 PositionComponent 组件的位置和大小的 HitBox mixin，所以可以使用名为\
    \ renderHitboxes 的内置函数来绘制我们的形状。请注意，我们传入了 squarePaint 对象以保持外观一致。\n\n在 update 函数中，我们可以移除大量代码，因为更新位置现在变得简单得多，而方向变化已经由碰撞跟踪处理：\n\
    \n```\n@override\nvoid update(double deltaTime) {\n  super.update(deltaTime);\n\
    \  position.x +=\n      squareSpeed * squareDirection * deltaTime;\n}\n```\n\n\
    现在我们的代码看起来更好了，Player 类正在处理更新其位置和渲染，以及处理任何碰撞。\n\n"
