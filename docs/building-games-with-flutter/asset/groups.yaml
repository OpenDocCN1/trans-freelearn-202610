    a sprite by 1, it will move to the right, whereas if you reduce it by -1, it will
    move left. For the y position, increasing by 1 will move the sprite down, while
    decreasing it will move the sprite up.


    We can keep track of the position using a Rect, which represents a rectangle containing
    the x and y positions, along with the width and height of the rectangle.


