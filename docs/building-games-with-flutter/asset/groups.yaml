    # # Chapter 8: Scaling the Game for Web and Desktop


    So far in this book, we have focused on building games for mobile devices that
    have small fixed-size screens. One of the benefits of Flutter, of course, is that
    it is a cross-platform framework that works on mobile, the web, and desktop.


    However, when building a game that will run on a website, there are issues that
