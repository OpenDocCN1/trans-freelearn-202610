    \ 文件并导入 Flame 音频库：\n\n```dart\nimport 'package:flame_audio/flame_audio.dart';\n\
    ```\n\n- 2. 在 `onLoad` 函数的顶部，添加以下代码以初始化库、将音乐加载到音频缓存中并播放背景音乐：\n\n```dart\nFlameAudio.bgm.initialize();\n\
    await FlameAudio.bgm.load('music/music.mp3');\nawait FlameAudio.bgm.play('music/music.mp3');\n\
    ```\n\n- 3. 在 `MyGame` 类中，在 `onLoad` 函数下方添加以下代码，该代码在游戏关闭时停止播放音乐并清除音频缓存：\n\n```dart\n\
    @override\nvoid onRemove() {\n  FlameAudio.bgm.stop();\n  FlameAudio.bgm.clearAll();\n\
    \  super.onRemove();\n}\n```\n\n如果您现在运行游戏，将能听到我们的音乐在播放。如果在移动设备上将应用放入后台，您会注意到音乐停止播放，并且当您将游戏带回前台时，音乐会恢复播放。如果您通过关闭应用来完全退出游戏，也会注意到音乐停止。\n\
    \n在 `onRemove` 函数中执行这些步骤很重要，以便避免内存泄漏。在下一节中，当我们移动 George 以及敌人死亡时，我们将向游戏添加音效。\n\n\
    ## 播放音效\n\n如前一节所述，播放音效时，我们需要处理音效的暂停和恢复，如果应用被放入后台（例如查看手机上的其他内容）时音效仍在播放，因为库目前不处理这种情况。\n\
    \n我们将首先更新 `Character` 类，它是我们所有精灵的顶级基类，以添加 `onPaused` 和 `onResumed` 回调，所有精灵都可以使用这些回调。\n\
    \n然后，我们将监听游戏中的生命周期变化事件，如果调用这些事件，我们将遍历所有精灵并传递这些事件。\n\n最后，由于音效与 George 相关，我们将更新\
    \ `George` 类来播放声音，并在需要时暂停和恢复这些音效。让我们开始吧：\n\n- 1. 打开 `character.dart` 文件。在 `Character`\
    \ 类的底部，添加以下函数定义：\n\n```dart\nvoid onPaused() {}\nvoid onResumed() {}\n```\n\n\
    请注意，我们将保留这些函数为空，因为我们将在 `George` 类中重写它们。\n\n- 2. 打开 `main.dart` 文件，在我们最近添加的 `onRemove`\
    \ 函数下方，添加以下代码以监听和处理生命周期事件：\n\n```dart\n@override\nvoid lifecycleStateChange(AppLifecycleState\
    \ state) {\n    switch(state) {\n        case AppLifecycleState.paused:\n    \
    \        children.forEach((component) {\n                if (component is Character)\
    \ {\n                    component.onPaused();\n                }\n          \
    \  });\n            break;\n        case AppLifecycleState.resumed:\n        \
    \    children.forEach((component) {\n                if (component is Character)\
    \ {\n                    component.onResumed();\n                }\n         \
    \   });\n            break;\n        case AppLifecycleState.inactive:\n      \
    \  case AppLifecycleState.detached:\n            break;\n    }\n}\n```\n\n在我们重写的\
    \ `lifecycleStateChange` 函数中，我们传递一个 `AppLifecycleState` 事件，它可以是 `paused`、`resumed`、`inactive`\
    \ 或 `detached` 事件。由于我们只关心暂停和恢复状态，因此这些是我们在此函数中处理的唯一事件。\n\nFlame 在名为 `children`\
    \ 的变量中跟踪我们添加到游戏中的所有子组件，这是一个我们可以遍历的数据集。请不要忘记，`HudComponent` 和 `ScreenCollidable`\
    \ 也是将包含在此数据集中的组件，因此在遍历数据时，我们必须检查类是否为 `Character` 类型，并忽略其他组件类型。\n\n然后，我们可以通过 `onPaused`\
    \ 和 `onResumed` 回调安全地传递暂停和恢复事件，因为我们知道这些回调可供任何使用 `Character` 作为基类的类使用，例如我们的敌人精灵或\
    \ George 精灵。\n\n- 3. 为 `Character` 类添加以下导入：\n\n```dart\nimport 'package:goldrush/components/character.dart';\n\
    ```\n\n- 4. 打开 `george.dart` 文件并添加以下导入：\n\n```dart\nimport 'package:flame_audio/flame_audio.dart';\n\
    import 'package:audioplayers/audioplayers.dart';\n```\n\n"
