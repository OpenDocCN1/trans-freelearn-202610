    - 9. 保存此文件，`pub get` 将更新以验证新资源并下载 Flame 音频库。\n\n现在我们已将音频文件设置为资源，让我们将它们添加到游戏中。\n\
    \n## 播放背景音乐\n\n在本节中，我们将添加音乐播放功能，该功能将在游戏开始时加载，并在我们玩游戏时继续播放。Flame 音频库有一个名为 `Bgm`（背景音乐）的静态类，它将音乐添加到音频缓存中，并在应用程序进入后台或返回前台时暂停和恢复音乐。我们可以直接在\
