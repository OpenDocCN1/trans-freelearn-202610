    # # Compilation types


    Computer programming languages can be either static or dynamic. A static language
    will be compiled into machine code before it runs, such as C++. A dynamic language
    is executed by an interpreter, so it does not need to be compiled before running
    (such as JavaScript).


    As programming languages evolved, virtual machines were invented, which made it
    easier to port a language to a new hardware platform. The code is converted to
    bytecode, which is then run on the virtual machine. Java is an example of a language
    that uses bytecode.


    The virtual machine imitates hardware in software and can be ported to run on
    different hardware platforms, making the code portable.


    As compiler technology evolved, **just-in-time** (**JIT**) compilers were invented,
    which improved the performance of code running on virtual machines by compiling
    the code on the fly.


    Compiling a program into machine code before running became known as **ahead-of-time**
    (**AOT**) compilation. Dart is unique in that it supports both JIT and AOT compilation
    types, which provides a massive advantage for developers. Developers can distribute
    the app compiled with AOT for maximum speed and performance, which helps games
    run smoothly.


    When running in JIT compilation mode, Flutter and Dart have an amazing feature
    called **stateful hot reload** that cuts down development time.


    # # Hot reload


    Flutter uses the JIT compiler to allow you to reload and run code in less than
    a second. This allows you to change code and see the changes reflected on'
  - '[PAGE 15]


    the emulator or web browser instantly, while retaining the internal state of the
    game.


    This is great for game development as you can modify code and see the effect of
    the change, which speeds up development massively. It feels like painting with
    code!


    For instance, you might reposition a graphic by a few pixels or change a color.
    In traditional development, you would have to rebuild the code (which could take
    many minutes) to see the change, but in Flutter, this is instant.


    # Native bridge


    Dynamic languages such as JavaScript communicate with the native code on the platform
    over a bridge, which is very slow. They do this for things such as drawing the
    native components of the platform they are running on.


    The **native bridge** is used to provide an interface between dynamic code and
    native code for all code, sending state information for **user interface (UI)**
    components.


    In Flutter, instead of this, Skia draws all the components on a canvas (and makes
    them look and feel like native components), so it bypasses the need for a native
    bridge.


    This is massive because with a native bridge you also need to pass the state of
    the UI components before they can be drawn, which slows everything down and can
    cause your UI to skip frames instead of keeping the animation smooth.


    # Garbage collection


    Dart uses an advanced garbage collection system that quickly handles short-lived
    objects in memory.


    As Flutter rebuilds the widget tree every frame, it throws away the old objects
    and recreates new objects. In a language such as Java, this would'
