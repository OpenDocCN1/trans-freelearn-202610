    \n调整屏幕大小时不断变化的较大屏幕尺寸会使我们的游戏困惑，游戏当前认为尺寸是固定的，并且组件的初始位置是相对于我们固定的屏幕尺寸设置的。由于这种困惑，图形可能看起来奇怪，我们先前正常工作的触摸事件现在也可能因为这个新的屏幕尺寸而混乱。\n\
