  md: '# Chapter 10


    +   1. We can use the `distanceTo` function to measure the distance between two
    position vectors.


    +   2. The algorithm we used in Gold Rush for pathfinding is known as `A*` (`A
    Star`).


    +   3. We can multiply or divide the `x` or `y` position by the tile size to convert
    between world and grid coordinates.


    +   4. Turning `withDiagonal` to true provides more natural movement to our characters,
    otherwise the characters will move at right angles which look robotic!


    +   5. Every time we change direction, we must match the correct animation, or
