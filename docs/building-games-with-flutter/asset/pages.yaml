- pgno: 161
  md: '# Chapter 9: Implementing Advanced Graphics Effects


    So far in the book, we have used graphics for animating sprite components and
    drawing tile maps, but there is a lot more that we can do to improve the visual
    aspect of the game.


    In this chapter, we are going to discuss how to use particles and shadows to improve
    our game. We will use particle effects to make the coins and enemies explode when
    they are collided with and we will use layers to add a shadow effect to our sprites.
    These are simple yet efficient ways to improve our game visuals that run very
    quickly and don''t affect the frame rate too much, so they are worth using to
    improve our game.


    We will cover the following topics in this chapter:


    +   - What are particle effects?

    +   - Animating with particles

    +   - Creating shadows with layers


    # Technical requirements


    To examine the source from this chapter, you can download it from https://github.com/PacktPublishing/Building-Games-with-Flutter/tree/main/chapter09.


    # What are particle effects?


    Particle effects are an easy way to create dynamic effects such as fire, smoke,
    explosions, and magical effects for our games. Particles have various properties
    that can be changed, which include the following:'
  merge: -1
  img_proc: true
- pgno: 162
  md: '+   - How long a particle lives

    +   - How often a new particle is created

    +   - The position where the particle is created

    +   - The angle, distance, and speed of travel

    +   - What colors the particles should be

    +   - How physics affects the particles


    A good example of a particle effect is fireworks. Fireworks explode in a variety
    of colors and travel at different speeds and angles as they vanish into nothing
    in the sky after a short time.


    Flame supports many types of particle effects, which you can see examples of at
    https://examples.flame-engine.org/#/Rendering_Particles. These are discussed in
    more detail in the Flame documentation at https://docs.flame-engine.org/1.0.0/particles.html,
    but let''s summarize some of the different types of particles here for your reference:


    +   - `MovingParticle` – Moves the child particle between two points during its
    lifetime

    +   - `AcceleratedParticle` – Applies basic physics-based effects to the particle,
    such as gravity or speed dampening

    +   - `CircleParticle` – Draws circles in different sizes

    +   - `SpriteParticle` – Uses sprite images in your particle

    +   - `ComputedParticle` – For more advanced control of the particle, which may
    need computed values to affect the particle


    In our game, we want to make the coins explode outward while fading out the alpha
    value. We will make these particles yellow to match the coin color. For our enemies,
    we will reuse the exploding effect but instead make the particles red to look
    like blood.'
  merge: -1
  img_proc: true
- pgno: 163
  md: 'We will use `ComputedParticle` from the previous list of different types of
    particles, as we want to split the exploding particles into 12 pieces. Each of
    these pieces will be moving outward from the center at increasing 30-degree angles,
    which we will calculate with basic trigonometry. The particle will be generated
    and calculated from these values, and the opacity will be adjusted as it fades
    out based on the particle''s progress.


    Remember, particles have a lifespan that we can set. So, we will fade out the
    particle when it gets nearer to the end of its lifespan.


    The actual drawing will be a simple circle with the position, angle, and opacity
    calculated.


    Let''s get started with the code for the particles in the next section.


    # Animating with particles


    In this section, we will show you how to create great particle effects and animate
    them. First, we will create a new file for storing our effects in the `utils`
    folder, which we can use from anywhere:


    +   1. In the `utils` folder, create a new file called `effects.dart` and open
    the file.


    +   2. Add the following code for creating the exploding particle:


    ```

    Particle explodingParticle(Vector2 origin,

    MaterialColor color) {

    double distanceToMove = 15.0;

    return Particle.generate(

    lifespan: 0.8,

    count: 12,

    generator: (i) {

    double angle = i * 30;

    double xx =

    origin.x + (distanceToMove * cos(angle));

    double yy =

    origin.x + (distanceToMove * sin(angle));

    Vector2 destination = Vector2(xx, yy);

    return ComputedParticle(renderer: (Canvas

    canvas, Particle particle) {

    ```'
  merge: -1
  img_proc: true
- pgno: 164
  md: "```\n```\nPaint paint = Paint()..color = \n    color.withOpacity(1.0 - particle.progress);\n\
    canvas.drawCircle(Offset.zero, 1.5, paint);\n})).moving(from: origin, to: destination);\n\
    });\n}\n```\n```\n\nHere, we have the `explodingParticle` function, which returns\
    \ `ComputedParticle`. The function takes an origin position for where the particle\
    \ effect should start along with a color that we should use for the particle.\n\
    \nWe want the particle to move a short distance of `15.0`, which we use to calculate\
    \ its destination position based on the angle of travel from the origin. The final\
    \ destination where the particle will travel to over its lifespan is calculated\
    \ using trigonometry.\n\nWe generate 12 particles at 30-degree angles, which is\
    \ `12 * 30 = 360` degrees, to cover all directions outward. The lifespan is set\
    \ to just under a second at `0.8`, so the explosion happens rapidly and fades\
    \ away.\n\nFinally, this is wrapped with `MovingParticle`, which moves the particle\
    \ between the origin and the destination over its lifespan.\n\nAfter the `lifespan`\
    \ time has expired, the particle is removed from the game, so we don't need to\
    \ manually monitor this as Flame does this for us by removing expiring particles\
    \ from the game.\n\n+   3. At the top of the `effects.dart` file, add the following\
