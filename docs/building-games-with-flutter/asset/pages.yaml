- pgno: 25
  md: '# Chapter 2: Working with the Flame Engine


    **Flame** is a game engine that is added, as a library, to your Flutter project.
    It provides us with modules that allow us to build our game. These include support
    for images and sprites, animations, audio, collision detection, and more advanced
    modules for 2D physics and tile maps.


    In this chapter, we will focus on how to get started with Flame and gain an understanding
    of the basics of the game engine, including its assets, game loops, and components.
    It''s important to know all of this so that you have a good understanding of the
    library and how everything fits together to make games with Flame.


    Once you are familiar with the basics of Flame, you will be able to progress to
    the more advanced topics later in the book.


    In this chapter, we will cover the following topics:


    +   - Organizing the assets in your game

    +   - Adding the game loop

    +   - Working with components


    # Technical requirements


    To examine the sources mentioned in this chapter, you can download them at https://github.com/PacktPublishing/Building-Games-with-Flutter/tree/main/chapter02.


    The Flame project is evolving very quickly, so please refer to the very latest
    documentation for any changes or new features at https://flame-'
  merge: -1
  img_proc: true
