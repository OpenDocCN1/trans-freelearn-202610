- pgno: 29
  md: '# # Adding the game loop


    The **game loop** controls any updates to the game state and then draws any graphics
    on the screen to reflect the current game state.


    For instance, the player might move the character they are controlling to the
    right, which will then increase the _x_ position of the player''s sprite during
    the game state update. Now that the game state has changed, the player will be
    drawn at the new position.


    In a more complex game, hundreds of enemy sprites could also be moving around.
    Therefore, the state of these sprites also needs to be calculated.


    This continues in a loop, where anything that is currently on the screen is updated
    and then redrawn. Each redraw is known as a **game frame**.


    The number of frames drawn per second reflects how smooth the game is. In Flutter,
    apps and games redraw at 60 **frames per second (FPS)** to allow for very smooth
    redrawing.


    In Flame, there are two functions that we can override to control the updating
    of the game state and drawing:


    ```

    void update (double deltaTime)

    ```


    ```

    void render (Canvas canvas)

    ```


    Let''s look at these functions in more detail.


    # # Update


    In the `update` function, a parameter is passed called `deltaTime`, which tells
    us the time that has elapsed since the previous frame was drawn. We need this
    value to ensure our sprites run at consistent speeds across different devices.
    Devices run at different speeds depending on the processing power, so if we ignore
    the delta value and just run everything at the maximum speed'
  merge: -1
  img_proc: true
- pgno: 30
  md: 'the processor can run, the player might have trouble controlling their character
    properly as it would be too fast. By using the `deltaTime` parameter in our movement
    calculation, we can guarantee our sprites will move at the speed that we want
    on devices with different processor speeds, ensuring a consistent speed on all
    devices.


    To see this in practice, let''s break down the example in *Chapter 1, Getting
    Started with Flutter Games*, to understand what is going on:


    ```

    static const int squareSpeed = 250;

    ```


    ```

    int squareDirection = 1;

    ```


    Here, we want to set the speed of our square to the consistent value of 250. Our
    direction will be set to a positive value of 1. If you increase the x value of
    a sprite by 1, it will move to the right, whereas if you reduce it by -1, it will
    move left. For the y position, increasing by 1 will move the sprite down, while
    decreasing it will move the sprite up.


    We can keep track of the position using a Rect, which represents a rectangle containing
    the x and y positions, along with the width and height of the rectangle.


    In the update function, we then translate the x position by considering the speed
    and current direction using the `deltaTime` parameter, as follows:


    ```

    squarePos = squarePos.translate(squareSpeed *

    ```


    ```

    squareDirection * deltaTime, 0));

    ```


    This translates the x value of the square position by multiplying the speed, direction,
    and `deltaTime` parameters together. The y value is 0, which means we are not
    translating the y value. This is because, in this example, we are not moving in
    the y direction. However, you can update them at the same time to travel diagonally
    if you ever need to.'
  merge: -1
  img_proc: true
- pgno: 31
  md: '# Render


    The `render` function has a Canvas object parameter, which is a blank canvas that
    we draw onto. The `canvas` class has many functions for drawing shapes and images
    directly onto the canvas, as follows:


    ```

    canvas.drawRect(squarePos, squarePaint);

    ```


    Here, we draw a rectangle on the canvas using the position of our sprite and using
    the color of the paint object to apply the paint styling. The paint object represents
    styling similar to CSS for the web by applying the styling to the square. In this
    example, the position is being updated manually by a fixed amount; however, in
    [Chapter 5, Moving the Graphics with Input], we will go into greater detail about
    how to control the position based on the user''s input.


    In Flame, we implement the game loop by extending one of the base classes, which
    automatically calls our `update` and `render` functions continuously. In the first
    example from [Chapter 1, Getting Started with Flutter Games], we used the `Game`
    mixin. This allowed us to override the `update` and `render` functions. This allowed
    us a lot of control over the process, but it can be very cumbersome once you start
    drawing and updating a lot of sprites. Then, when you start adding input controls
    and collision detection, it can quickly become difficult to maintain and keep
    track of everything.


    Fortunately, Flame has classes to help with all this as your game grows, which
    we will discuss further in the next section.


    # Working with components


    As with any growing code base, it''s important to have a structure. This is so
    that the code is easy to maintain as we add more features to the game.


    Currently, our code contains a simple example of how to render and update a square
    on the screen, using the `Game` mixin to override these functions.'
  merge: -1
  img_proc: true
- pgno: 32
  md: 'Using the `Game` mixin gives us a lot of control over our code, but we would
    have to write a lot of extra code to support the game as the game grows. This
    is great once you become more familiar with Flame and games programming and want
    that level of control. However, to begin, it''s better to extend from the `FlameGame`
    class.


    Components provide us with a structured way to organize our game as our game increases
    in complexity.


    # # FlameGame


    The `FlameGame` class builds on the `Game` mixin and adds a lot of useful functionality
    to help us manage the complexity of our game as it grows. This includes the following:


    +   - Flame Component System

    +   - Collision detection tracking

    +   - Default implementations for `render` and `update`


    Flame Component System allows us to split parts of our game up into components
    (classes) that represent an entity in our game, such as the player. For instance,
    we can have a `SpriteComponent` component to encapsulate everything related to
    our player sprite to manage drawing and updating any objects the player has collided
    with, or any other state that is specifically related to the player.


    The `FlameGame` class maintains a list of all components for the game, and these
    can be added dynamically to the game as needed; for instance, we might add several
    enemy `SpriteComponent` components to the game and then remove them from the game
    as the player kills the enemies. Then, the `FlameGame` class will iterate over
    these components by telling each component to update and render itself.


    Flame Component System has a lot of different types of components to help with
    managing different parts of our game. Here is a list of some of the most'
  merge: -1
  img_proc: true
- pgno: 33
  md: '# common components:


    +   - `SpriteComponent`: For managing any sprites our game has

    +   - `JoystickComponent`: A virtual joystick for managing input

    +   - `TextComponent`: Text that we draw on the screen, such as the score

    +   - `ParticleComponent`: Particle graphic effects


    The complete hierarchy for the component system can be seen at https://docs.flame-engine.org/1.0.0/components.html.


    As you can see from the component diagram at the top of Flame''s website, there
    are a lot of components in which to handle different things, but most of the interesting
    ones extend from `PositionComponent`.


    The `PositionComponent` component represents an object on the screen that has
    variables to keep track of the position, the size, and the angle direction of
    the component.


    `SpriteComponent` extends from `PositionComponent`, so it gains these variables
    by default because we are going to need to position and size our sprites.


    It then adds extra variables that are more specific to sprites, such as the `renderFlipX`
    and `renderFlipY` variables, to reverse anything drawn to the canvas. This can
    be useful if you have an image of a character walking from left to right; by setting
    `renderFlipX` to `true`, it will then draw the sprite images in reverse so that
    it appears to be walking from right to left.


    Any components that are added to the `FlameGame` class can also be tracked for
    collision detection once we have set up the component''s bounding boxes. After
    setting this up, we will get a callback in an `onCollision` function that we override.
    This tells us which components our component has collided with. This makes something
    that is quite difficult to keep track of much simpler. We will discuss collision
    detection, in more depth, later.'
  merge: -1
  img_proc: true
