    \ so it is omitted here.\n\nIf you run the game now, you will see that our player\
    \ and enemies now have lovely shadow effects behind them, which really makes them\
    \ stand out nicely against the background!\n\n# Summary\n\nIn this chapter, we\
    \ learned how to apply advanced graphical effects to our game to make the game\
