    +   3. With the web server running our game, open any browser and enter http://localhost:8000/
    in the browser''s address bar.


    The game will load, and you will see it running in your browser. You will also
    notice it loads and runs a lot faster than running it via the Chrome device.


    When you have finished playing the game on the web, you should shut down the web
    server. Because the web server is running in the background, we need to bring
    it to the foreground first to shut it down.


    +   4. In your terminal, press the Enter key to start a new line and then type
    the following to bring the web server to the foreground:


    ```

    fg

    ```


    +   5. Next, hit the keys Ctrl + C to stop the web server.


    If you need to start and stop the web server as you add new pieces of code that
    you want to test, please be aware of a couple of things:


    +   - You should always compile a release build from the project folder.

    +   - You should always run the web server from the build/web folder.


    In this section, we addressed the issues with dynamically sized user interfaces
    and discussed a workaround for the background audio issue. We also discussed how
    to create a release build for the web and tested this on a web server.


    In the next section, we will discuss how to navigate with physical keys.'
