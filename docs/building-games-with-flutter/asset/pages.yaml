- pgno: 172
  md: '# Chapter 10: Making Intelligent Enemies with AI


    The game is coming along nicely now, but there isn''t really any challenge to
    it yet. We collect the coins or kill our enemies, but that''s all very predictable
    and easy.


    In this chapter, we are going to change the game to make it more challenging by
    adding a health value to our player, George, and making the enemies chase us instead,
    reducing our health for each enemy that hits us. If our health gets to zero, we
    lose the game. So, the objective will be to collect the coins while avoiding the
    enemies.


    To make the enemies appear more intelligent, we will use very simple **Artificial
    Intelligence (AI)** algorithms for the enemies to detect when George is nearby
    and, when they can see him, their movement will change from random movements to
    moving in George''s direction to attack him.


    We will then add some extra water to the map as obstacles and discuss how to move
    from your origin to the destination while avoiding the water and walking around
    it to reach your destination.


    We will cover the following topics in this chapter:


    +   - Making enemies chase the player

    +   - Navigating obstacles with pathfinding


    # Technical requirements


    To examine the source from this chapter, you can download it from https://github.com/PacktPublishing/Building-Games-with-Flutter/tree/main/chapter10.'
  merge: -1
  img_proc: true
- pgno: 173
  md: 'The following steps will add a library to the `pubspec` file to assist with
    pathfinding, along with some new and updated assets:


    +   1. In this chapter, we will use updated versions of the tile map files, so
    please download these updated tile map files and place them in the `assets/tiles`
    folder, overriding the existing files:

    +   https://github.com/PacktPublishing/Building-Games-with-Flutter/blob/main/chapter10/assets/tiles/tiles.tmx

    +   https://github.com/PacktPublishing/Building-Games-with-Flutter/blob/main/chapter10/assets/tiles/tiles.tsx


    +   2. Open the `pubspec.yaml` file and add the following dependency:


    ```

