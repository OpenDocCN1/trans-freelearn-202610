  md: 'If you run the game now, you will see that after some time, when George hits
    the side of the screen, he will flip direction and the animation will update.

    You can change the `georgeSpeed` variable value to speed this up if you like.


    Next, let''s add the zombies and skeletons to the game!


    If you look at the sprite sheet for the zombies and skeletons, you will notice

    both are in the same sprite sheet, both are organized by rows and now

    columns, and both have a zombie and a skeleton on each row. So, while we

    are building the animations, we must specify a `from` and `to` field to indicate

    which part of the sprite sheet makes up the animation.


    For example, for the animation that makes the zombie''s direction walk to the

    left, it would be on row 1, from column 0 to 2. The sprite image is 192 pixels

    wide by 256 pixels high containing six frames horizontally and four frames

    down, so to calculate the size of a sprite, it would be as follows:


    ```

    192 / 6 = 32

    256 / 4 = 64

    ```


    So, our sprite size is 32 pixels in width and 64 pixels high:


    ![](img/a63c3fccbe888cd4d04006b5e1b6c273_66_0.png)


    Figure 4.3 – Enemy sprites, showing the size of each frame'
