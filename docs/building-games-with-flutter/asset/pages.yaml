  md: '# Figure 3.4 – The game world George can explore


    The game world is mostly grass but has paths that George can follow. The map is
    surrounded by water, which George cannot cross. There is a central diamond area,
    which is the focal point of the map and is surrounded by water for decoration.


    The game world is made up of a tile map using the **Tiled** application, which
    allows us to reuse smaller tiles to make larger maps efficiently. The following
    image is used to create our game world map (available at https://opengameart.org)
    and is originally created by Luis Zuno:


