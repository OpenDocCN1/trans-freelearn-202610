    +   13. Now that we have our joystick, run button, and score text components,
    let''s create a HUD component that will handle the initialization of these components.
    First, open the hud.dart file and add the following imports and class definition:


    ```

    import ''package:flame/components.dart'';

    import

    ''package:goldrush/components/hud/run_button.dart'';

