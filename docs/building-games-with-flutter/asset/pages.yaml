- pgno: 42
  md: '# # Chapter 3: Building a Game Design


    Now that we have discussed Flame and shown you some basic animation, we want to
    discuss the game we are going to build throughout the rest of the book.


    The game will be called Gold Rush, and has the following objectives:


    +   - Avoid being attacked by zombies and skeletons.

    +   - Explore the map, collecting as many gold coins as you can before you die.


    It will be a simple game but will teach you a lot of skills by adding a lot of
    common features included in most games, including the following:


    +   - Drawing sprite graphics

    +   - Detecting collisions between sprites

    +   - Controlling a player with virtual joysticks, touch, or keys

    +   - Playing music and sounds

