    ''package:goldrush/components/hud/joystick.dart'';

    import ''package:flame/palette.dart'';

    import ''package:flutter/material.dart'';

    class HudComponent extends PositionComponent {

    }

    ```


    Here, we extend from PositionComponent, giving us control over how we arrange
    our child components with margins. PositionComponent is a base class that allows
    the positioning of components within it.


    +   14. At the top of the HudComponent class, let''s add a constructor that sets
    priority to 20:


    ```

    HudComponent() : super(priority: 20);

    ```


    priority is used to indicate the order components are drawn, with the default
    being 0. So, setting this higher than 0 will ensure that the HUD is drawn on top
    of everything else.


    Later, when we start using a map that is larger than the physical screen, the
