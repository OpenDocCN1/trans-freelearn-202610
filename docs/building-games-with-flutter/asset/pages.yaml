- pgno: 43
  md: '# Planning a game


    Let''s start by defining a synopsis for our game that we could use to market the
    game and give a brief reason to the player why they might want to play the game.
    Here is the synopsis:


    _In Gold Rush, you play as an explorer who must travel across the land in search
    of wealth by collecting any gold coins you can find. Beware, though: the path
    ahead won''t be easy. You must avoid the zombies and skeletons that roam the land
    in search of your blood!_


    A nice, simple summary that tells the player what the goal of the game is and
    what they must do to succeed (collect as much gold as possible) while avoiding
    losing the game (by being attacked by zombies and skeletons).


    In most games, you have a main character who is the game representation of yourself.
    In our game, this is George.


    ![](img/a63c3fccbe888cd4d04006b5e1b6c273_43_0.png)


    Figure 3.1 – Our protagonist, George


    George will move around the game map controlled by the player either by the touch
    on a location on the screen, by controlling the on-screen joystick, or with the
    keys on a physical keyboard.


    George can run to try to escape the enemies that are chasing him. His health is
    measured as a percentage that starts at 100% and decreases by 25% each time he
    is caught by a zombie or skeleton. Once George''s health reaches 0, it''s game
    over.


    There are two types of enemies in the game – zombies and skeletons.'
  merge: -1
  img_proc: true
- pgno: 44
  md: '![](img/a63c3fccbe888cd4d04006b5e1b6c273_44_0.png)


    Figure 3.2 – Our game enemies, zombies and skeletons


    The enemies will chase George when he is nearby and within their line of sight.
    When they catch George, they will explode on impact and die, reducing George''s
    health by 25%.


    George will take the risk of being killed by zombies and skeletons because he
    can become very rich by avoiding the enemies and collecting the gold coins that
    are scattered around the map.


    ![](img/a63c3fccbe888cd4d04006b5e1b6c273_44_1.png)


    Figure 3.3 – The gold coins George collects to become richer


    Every time George collects a spinning gold coin, his score increases by 20.


    George has a large game world to explore, which will scroll around the screen
    as he explores.


    ![](img/a63c3fccbe888cd4d04006b5e1b6c273_44_2.png)'
