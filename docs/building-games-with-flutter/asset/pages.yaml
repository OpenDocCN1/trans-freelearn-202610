    The newest versions of Flame can always be found in the `pub` repository at https://pub.dev/packages/flame/install.


    # # Organizing the assets in your game


    Your game will include many assets, such as images, audio, fonts, maps, and game
    data.


    As with Flutter, Flame supports the asynchronous loading of assets and caching.
    However, it also builds on top of that functionality to add features that are
    useful for images and audio, to help use and manage those assets effectively.
    For example, if you have a sprite sheet containing many frames of animation, you
    can load them and split them into their individual sprites very easily. This is
    covered, in more depth, in Chapter 4, Drawing and Animating Graphics.


    All of your assets go under the `assets` folder in Flutter. I recommend the following
    folder structure to keep everything well organized:


    ```

    assets

    ```'
