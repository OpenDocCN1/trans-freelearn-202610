- pgno: 192
  md: '# # Chapter 11: Finishing the Game


    The game is looking great and is nearly complete, but we want to tie up some loose
    ends in this chapter to finish it off. At the moment, we only have the main game
    screen; however, games often have many screens in them, such as a menu screen
    or settings screen.


    In this chapter, we will add a few more screens and show you how to navigate between
    them. We will create these screens with standard Flutter widgets and show you
    how you can mix Flutter and Flame together. Specifically, in our settings screen,
    we will add an option for controlling the music volume and persist the user''s
    music volume preference, and then use this when playing the game.


    After wrapping up the game code, we will discuss a few other things to consider
    when developing a game, such as how to make money from it, what else is worth
    learning as you continue to learn more about game development, and where to get
    help when you get stuck developing your games.


    We will cover the following topics in this chapter:


    +   - Wrapping up the game

    +   - Monetizing your game

    +   - What else should I learn?

    +   - Where to get help?


    # ## Technical requirements


    To examine the source from this chapter, you can download it from https://github.com/PacktPublishing/Building-Games-with-Flutter/tree/main/chapter11.'
