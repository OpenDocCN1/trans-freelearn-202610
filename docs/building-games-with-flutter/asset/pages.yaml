    # Setting background music


    Modern browsers such as Chrome, Safari, and Firefox block websites from

    playing audio in the background until the user has interacted with the page to

    ensure that this is what the user really wants. Websites often open pop up

    sites that annoy users with advertisements. So, the companies that make these

    browsers added measures such as preventing background audio to give the

    user more control over these annoying popups.


    The browsers specifically don''t want background music attempting to play

    when a page is first loaded, which we are trying to do by starting the music

    in our game''s `onLoad` function. To fix this for our game temporarily, we can

    click on the padlock icon that is to the left of the website address and enable'
  merge: -1
  img_proc: true
