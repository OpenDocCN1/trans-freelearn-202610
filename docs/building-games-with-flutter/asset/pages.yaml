  md: "# # Navigating obstacles with pathfinding\n\nIn this section, we will discuss\
    \ how to move our character from A to B when there are obstacles in the way. There\
    \ are many solutions to this problem, but a common solution in games development\
    \ that we are going to use is called the A Star algorithm.\n\nThe algorithm is\
    \ an efficient way to calculate a route on a 2D grid.\nRemember, a tile map is\
    \ a 2D grid that uses tile IDs to represent what is\ndrawn on the map. We provide\
    \ the algorithm with our grid coordinates for\nour start location (the current\
    \ location of George) and our end location\n(where we tap on the screen), along\
    \ with a list of grid coordinates for any\nobstacles that are in the way. The\
    \ algorithm then returns a list of grid offsets\nthat represent a path, which\
    \ we can follow to navigate to our touched\nlocation while avoiding all obstacles!\n\
    \nOur initial challenge is that when we move George around, we are using\npixels\
    \ to represent the location, but the algorithm works in grid coordinates.\nFor\
    \ instance, if George was at the top left of the map (ignoring the water), his\n\
    pixel coordinate might be 48, 48, but his grid coordinate will be 1, 1.\n\nLet's\
    \ start by creating a new file with some helper functions that let us\nconvert\
