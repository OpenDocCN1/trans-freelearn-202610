  md: 'If you run the game now using Chrome as the device, you will see you can resize
    the browser window and the page will resize, and components will be updated based
    on this, although when running the game, the performance isn''t great. So, let''s
    discuss how we compile the code for a release and deploy it via a web server for
    better performance.


    When building a web release, we must pass a parameter to the `flutter build web`
    command to indicate the web renderer we want to choose from these two options:


    +   - html: Choose this web renderer if you are optimizing download size over
    performance.

    +   - canvasKit: Choose this web renderer if you are prioritizing performance
    and pixel-perfect consistency across platforms.


    We will use `canvaskit` as performance is more important than download size nowadays,
    but just be aware that `html` is there as an option if you ever need it:


    +   1. Let''s run the command that will create our release build.


    Open a command-line terminal in the project folder and type the following:


    ```

    flutter build web --release --web-renderer canvaskit

    ```


    When this has finished compiling, it will save the web code in the `build/web`
    folder.


    +   2. Next, let''s run the web server from the `build/web` folder:


    ```

    cd build/web/

    python3 -m http.server 8000 &

    ```


    Here, we move to the folder where the web code is and run the web server.


    We are using the build in web server that the Python language provides for free.'
