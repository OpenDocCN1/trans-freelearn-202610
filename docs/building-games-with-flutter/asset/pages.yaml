- pgno: 166
  md: 'Layers are a feature of Flame that allow us to group things we want to draw
    together or draw a prerendered graphic that doesn''t change much. In your game,
    you may have a background that you draw once from a combination of sprites or
    images, but then it is used as a static image that you use as a background and
    draw the other moving sprites on top.


    It would be inefficient to keep creating this background if it isn''t changing.
    So, you can create it once and store it as a layer, which you can draw before
    you render the other game graphics.


    In Flame, there are two types of layers:


    +   - PreRenderedLayer – For static images

    +   - DynamicLayer – For things that are moving


    `PreRenderedLayer` would be suitable for backgrounds due to its static nature.


    You may also want to change something in the layer and regenerate the layer, and
    then cache the resulting image in the layer. For example, you may want to create
    a weather effect in the game where the raindrops are updated and redrawn on the
    layer, and then this layer is drawn on top of your game world to give the impression
    it is raining or snowing. For this type of effect, `DynamicLayer` would be more
    suitable.


    Flame also provides something called layer processors, which allow us to add effects
    to the entire layer. Currently, the only supported layer processor is called `ShadowProcessor`,
    which applies a shadow to the entire layer. It is possible to make your own processors
    though by extending the `LayerProcessor` class if you want to create other processors.


    We can use `ShadowProcessor` in combination with our sprites to create a shadow
    behind each sprite to make them really stand out in the game. This is done by
    drawing our sprites into a layer after applying the shadow processor.


    Let''s get started by creating our layer class:'
  merge: -1
  img_proc: true
- pgno: 167
  md: "1. Open the `effects.dart` file and below the `explodingParticle` function\
    \ we added earlier in `Step 2` of the `Animating with particles` section, add\
    \ the following class definition for our layer:\n\n```\nclass ShadowLayer extends\
    \ DynamicLayer {\n  final Function renderFunction;\n  ShadowLayer(this.renderFunction)\
    \ {\n    preProcessors.add(ShadowProcessor(color:\n      Colors.black, offset:\
    \ const Offset(4, 4)));\n  }\n\n  @override\n  void drawLayer() {\n    renderFunction(canvas);\n\
    \  }\n}\n```\n\nHere, we create a class called `ShadowLayer`, which is a `DynamicLayer`.\
    \ In the constructor, we add the shadow processor to the list of preprocessors\
    \ so that the shadow effect gets applied before drawing the sprites. Note that\
    \ this is a list of preprocessors, so if you do create your own, you can add multiple\
    \ effects to your layers. Also, there is a postprocessors list available too,\
    \ which adds effects after your sprites are drawn if you need it.\n\nWe set the\
    \ shadow to be black and drawn at an offset 4 , 4 pixels away from where the sprite\
    \ is drawn to give the effect of a shadow behind the sprite.\n\nIn the constructor,\
    \ we pass a function reference that is then used when we call `drawLayer()`. We\
    \ do this because we want to hold a reference to the super class render function,\
    \ so that we delegate the drawing to the layer. So, our sprites will draw onto\
    \ the layer where they will have their shadow applied, and then we call on the\
    \ super class to draw the layer to the game, based on whatever animation frame\
    \ we are currently rendering.\n\nBecause of this, when we render our sprites in\
    \ the render function, we will render into `ShadowLayer` and not make a call to\
    \ the super class there, or we will be drawing twice, which is inefficient and\
    \ not needed.\n\n2. Now, at the top of the file, let's add an import for the layer\
    \ package:\n\n```\nimport 'package:flame/layers.dart';\n```"
  merge: -1
  img_proc: true
- pgno: 168
  md: "Next, let's set up the `Coin` class first and add a shadow to all our coins,\
    \ so we can see how this delegated rendering works in practice.\n\n+   3. Open\
    \ the `coin.dart` file and add the following import at the top of the file:\n\n\
    ```\nimport 'package:goldrush/utils/effects.dart';\n```\n\n+   4. In the `Coin`\
    \ class, add a variable to store `ShadowLayer` below where we store `originalPosition`:\n\
    \n```\nlate Vector2 originalPosition;\nlate ShadowLayer shadowLayer;\n```\n\n\
    +   5. Add the following import for `ShadowLayer`:\n\n```\nimport 'package:goldrush/utils/effects.dart';\n\
    ```\n\n+   6. At the bottom of the `onLoad` function, add the following line to\
    \ initialize the shadow layer:\n\n```\nshadowLayer = ShadowLayer(super.render);\n\
    ```\n\nHere, we can see we are passing the function reference to the super class\
    \ render function.\n\n+   7. At the bottom of the `Coin` class, add the following\
    \ override for the render function, which delegates the drawing to `shadowLayer`:\n\
    \n```\n@override\nvoid render(Canvas canvas) {\n    shadowLayer.render(canvas);\n\
    }\n```\n\nIf you run the game now, you will see our shadow effect behind all the\
    \ coins in the game."
