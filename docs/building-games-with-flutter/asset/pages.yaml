- pgno: 101
  md: '# # Chapter 6: Playing Sound Effects and Music


    In this chapter, we will bring our game to life by adding sound effects and music
    that will enhance the game. Audio is a very important part of any game; it can
    alert you to key events happening in a game or create atmosphere. Imagine walking
    through a forest in a game and hearing a nearby river or the birds singing in
    the trees. It makes the whole game more immersive if the sound matches what you
    would expect to hear if you were in that forest.


    It is important though that if the player puts the game in the background to,
    for example, check their email, that we stop the music or sound from playing,
    and that the sound resumes when they return to the game, otherwise the ongoing
    sound could be annoying for the player. To handle this, we will cover how to listen
    for these life cycle events so that we ensure the audio is paused and resumed
    correctly.


    Audio also takes up memory and we will discuss how Flame uses an audio cache to
    help load and keep these audio resources so we can play them whenever we need
    them in a game. Often, sound effects are played multiple times, so we need to
    be able to access these easily and play them repeatedly when needed.


    So, in this chapter, we will cover the following topics:


    +   - Playing background music

    +   - Playing sound effects

    +   - Controlling the volume


    # ## Technical requirements'
  merge: -1
  img_proc: true
