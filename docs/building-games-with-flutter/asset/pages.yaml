- pgno: 221
  md: '# Chapter 7


    +   1. The Tiled application allows us to create tile maps that are much larger
    than the physical screen of our game, by using tile sets made up of small tiles
    to represent things like grass or water.


    +   2. Tile maps reuse each tile, meaning that they take up much less memory than
    storing a larger image.


    +   3. Tile map data is stored in a 2D array to represent the width and height
    of the map.


    +   4. We can use tile layers for representing the tiles and object layers for
    objects we want to draw on top of the map.


    +   5. To adjust the map as a sprite moves around, we use a camera and set up
    the `followComponent` function with the component that we want to focus on while
    it moves.


    +   6. We can add collidable objects as an object layer in our tile map and then
    create components from these by reading the object with the tile map `getObjectGroupFromLayer`
    function.


    +   7. A collidable object can be active, passive, or inactive. We use these to
    reduce the amount of collision checks between collidable objects, which helps
    the game''s performance.'
  merge: -1
  img_proc: true
- pgno: 222
  md: '# Chapter 8


    +   1. Web browsers require audio permissions to be enabled when first loaded
    to prevent web sites irritating the user with annoying noises.

    +   2. Our game is set up with an initial size based on the dimensions of the
    screen. If this changes, everything now needs to be recalculated, otherwise things
    like the joysticks won''t be positioned correctly.

    +   3. The default `TiledComponent` doesn''t need a position and size. but to
    fix issues when resizing, we need to be able to recalculate these values. So,
    we wrap the component in a `PositionComponent` to give us the position and size
    values.

    +   4. We can use `cavaskit` for prioritizing performance or `html` for prioritizing
    download size.

    +   5. We use the `KeyboardHandler` mixin to listen for key events.'
  merge: -1
  img_proc: true
- pgno: 223
  md: '# Chapter 9


    +   1. `lifespan` and `count` are common properties to set when using particles.
    They represent how long the particle should be shown for and how many should be
    shown, respectively.


    +   2. Particles created a lot of objects very quickly and can use up a lot of
    memory, so we need to free up the memory once the particle is no longer in use.


    +   3. `MovingParticle`, `CircleParticle`, and `ComputedParticle` are examples
    of particles that Flame supports.


    +   4. Flame supports the `PreRenderedLayer` for static images and the `DynamicLayer`
    for animated images.


    +   5. We need to delegate the rendering of the super class to the layer class
    so that the layer processor can do its work of generating the shadow image.'
  merge: -1
