  md: '# # Chapter 8: Scaling the Game for Web and Desktop


    So far in this book, we have focused on building games for mobile devices that
    have small fixed-size screens. One of the benefits of Flutter, of course, is that
    it is a cross-platform framework that works on mobile, the web, and desktop.


    However, when building a game that will run on a website, there are issues that
    we don''t face on mobile. If, instead of launching one of the mobile emulators,
    you choose the Chrome browser as the target platform in Visual Studio Code and
    then run the game, you would notice that the map and UI are drawn incorrectly,
    that there is no background music, and touch events don''t work properly.


    In this chapter, we will convert the game so that it works on the web and desktop,
    making sure to fix these issues. When dealing with resizing, we will need to redraw
    the map and reposition all our components based on our new screen size. Some screens
    are very high resolution and larger than our physical map size of 1,600 x 1,600,
    which means we will need to ensure our game still looks great on these larger
    screens.


    In this chapter, we will cover the following topics:


    +   - Building the game for the web and desktop

    +   - Setting background music

    +   - Setting Flutter Web build parameters

    +   - Navigating with key events


    # ## Technical requirements'
  merge: -1
  img_proc: true
