  md: "+   - The first is that the player is near enough to the enemy so that the\
    \ enemy may see or hear them. You don't want enemies to start chasing players\
    \ when they are on the other side of the map, otherwise, the effect is lost and\
    \ isn't believable.\n+   - The second is that the enemy is facing the player when\
    \ they start chasing. If the enemy is walking in the opposite direction, the player\
    \ might be able to sneak past them without the enemy noticing. So we won't make\
    \ them chase when they are not even facing the player.\n\nTo overcome these challenges,\
    \ we will track the distance between the player and enemy at every update, which\
    \ happens 60 times per second. If the distance between them is below a certain\
    \ value, and if the angle between the player and enemy indicates that the enemy\
    \ is facing the player, then we will start the enemy chasing the player. If the\
    \ player can run away from the enemy, then the enemy will return to its normal\
    \ movement pattern. We will also change the enemies' speed so that the normal\
    \ movement speed is trebled when they are chasing.\n\nLet's get started by making\
