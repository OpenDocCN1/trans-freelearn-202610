  \n\n## 索引\n\n## 前言\n创建一个实时应用程序来处理成千上万个实时数据源听起来很难吗？不再如此。学习一些响应式编程，你将能够扩展你的边界，创建利用实时数据的应用程序，而不会影响性能。\n\
  \n## 本书涵盖的内容\n第 1 章，《什么是响应式？》，解释了响应式编程的基础知识以及它与命令式编程的比较，并展示了一些示例用法。\n\n第 2 章，《第一次响应》，使用\
  \ bacon.js 介绍了事件流和操作符的基础知识。\n\n第 3 章，《充满变化的世界 - 响应式扩展来救援》，本章我们探讨观察者和可观察对象的定义和类型。\n\
  \n第 4 章，《转换数据 - Map、Filter 和 Reduce》，涵盖了函数式响应式编程中最基本和最重要的操作符。\n\n第 5 章，《世界变化太快 -\
  \ 处理背压的操作符》，解释了不同技术来缓解接收数据速度快于处理速度的问题。\n\n第 6 章，《源太多？ - 合并可观察对象》，教你如何组合不同的数据源以创建新的数据源。\n\
  \n第 7 章，《出了问题 - 测试和处理错误》，解释了如何在可观察对象中处理错误以及如何使用函数式响应式编程测试程序。\n\n第 8 章，《关于操作符的更多内容》，展示了一些未纳入前几章的重要操作符。\n\
  \n第 9 章，《组合》，解释了什么是转导器以及为什么应该使用它。\n\n第 10 章，《实时服务器》，构建了作为函数式响应式编程示例的 Web 聊天应用程序的后端部分。\n\
  \n第 11 章，《实时客户端》，构建了作为函数式响应式编程示例的 Web 聊天应用程序的前端部分。\n\n## 阅读本书所需\n跟随本书所需的一切，只需一台安装了版本大于\
  \ 6 的 Node 的计算机。本书中提到的所有软件都是免费的，可以从互联网下载。\n\n## 本书适合谁\n本书面向具有基本 JavaScript 知识的开发者。我们将使用\
  \ ES6 和函数式响应式编程来创建美观且可读的应用程序。在这里，你将学习如何处理无限数据流（例如使用推文、股票信息，甚至聊天消息）而不会影响系统性能。\n\n\
