  connection.listen('message')\n    .map(function(message){\n        var li = document.createElement(\"\
  li\");\n        li.innerText = message.from + ' says to '+\n        (message.to\
  \ || 'everybody')+' : '+message.content;\n        return li;\n    }).subscribe(function(node){\n\
  \        document.getElementById(\"messages\").appendChild(node);\n    });\n```\n\
  \n在这里，我们开始监听来自服务器的所有传入消息；然后我们使用 `map()` 运算符将这些消息映射为 li DOM 元素，最后，我们 `subscribe`\
  \ 到 observable 以在屏幕上显示消息。\n\n如果你一直按照说明操作到此，你将在 `client` 文件夹中得到一个 `index.js` 文件，内容如下：\n\
  \n```\nvar Rx = require('rx');\nvar connection = require('./connection');\nvar events\
  \ = require('./events');\n\nvar logged = prompt(\"Please enter your name\", \"\"\
  );\n\nvar messagesObservable = events.map(function(value){\n    var userName, splittedUserInput,\
  \ action, content;\n    if(value.indexOf('!')===0){\n        userName = value.substring(1);\n\
  \        return {service:'blockUser',blocked:userName,from:logged};\n}\nif(value.indexOf('/')===0){\n\
  \    splittedUserInput = value.split(' ');\n    action = splittedUserInput[0].substring(1);\n\
  \    content = splittedUserInput.slice(1).join(' ');\n    return {\n        service:'command',\n\
  \        action:action,\n        content:content,\n        from:logged\n    };\n\
  }\nif(value.indexOf('@')===0){\n    splittedUserInput = value.split(' ');\n    userName\
  \ = splittedUserInput[0].substring(1);\n    content = splittedUserInput.slice(1).join('\
  \ ');\n    return {\n        service:'sendMessage',\n        to:userName,\n    \
  \    content:content,\n        from:logged\n    };\n}\nreturn {service:'sendMessage',content:value,from:logged};\n\
  }).merge(\n    Rx.Observable.of({service:'listenToMessages',me:logged})\n);\n\n\
  connection.addSender(messagesObservable);\n\nconnection.listen('message')\n.map(function(message){\n\
  \    var li = document.createElement(\"li\");\n    li.innerText = message.from +\
  \ ' says to '+\n    (message.to || 'everybody')+' : '+message.content;\n    return\
  \ li;\n})\n.subscribe(function(node){\n    document.getElementById(\"messages\"\
  ).appendChild(node);\n});\n```\n\n恭喜！这意味着你已经拥有了第一个使用 RxJS 进行函数式响应式编程的应用。你已经可以使用它发送和接收消息了。\n\
  \n如果你运行应用程序并在浏览器中打开它，你就可以开始使用它，其工作方式如下：\n\n![](img/8a5c36d94dc308a2a0fcf45ffa9cc27f_290_0.png)\n\
  \n你甚至可以打开两个浏览器来查看其运行情况：\n\n![](img/8a5c36d94dc308a2a0fcf45ffa9cc27f_290_1.png)\n\
  \n现在我们已经完成了网页聊天的基础，我们将看到在使用 RxJS 的客户端应用中可以做的两个新的有趣技巧。第一个是监听开箱即用的事件，如三连击，并了解如果没有函数式响应式编程，实现起来会困难得多，以及我们如何通过批处理对\
  \ DOM 的更改来获得性能提升。\n\n## 使用 RxJS 改进交互\n\n使用函数式响应式编程的一个优势是，它使创建丰富的用户界面变得更容易，为用户与网站交互创造新的方式。有几种方法可以做到这一点。\n\
  \n在本节中，我们将为我们的网页聊天应用创建一个彩蛋。彩蛋是可以按照一个或多个步骤访问的隐藏功能。\n\n我们的彩蛋将通过在消息框中进行三连击来访问。每当某个用户在消息框中进行三连击时，我们都会用\
  \ /roll_a_dice 命令填充消息框。\n\n![](img/8a5c36d94dc308a2a0fcf45ffa9cc27f_291_0.png)\n\
  \n在本节中，我想向你展示如何使用函数式响应式编程轻松地为用户创建新的交互方式。我选择使用三连击，因为它不是标准交互，我将比较使用和不使用函数式响应式编程实现它所需的代码。\n\
  \n首先让我们看看如何使用 RxJS 实现它。\n\n要实现它，让我们更改 client 文件夹中的 events.js 文件，并在文件末尾创建一个 Observable\
  \ 来监听消息框中的点击；我们可以用以下代码来做到这一点：\n\n```\nRx.Observable\n.fromEvent(document.getElementById('message_input'),'click')\n\
  ```\n\n现在我们需要在特定时间范围内检测消息框中的连续点击；假设三连击必须在最多 800 毫秒内发生。要实现这一点，我们可以使用 bufferWithTime()\
  \ 运算符，但如果用户点击非常快怎么办。用户已经完成了三次点击后，应用程序没有理由等待所有时间；因此，我们将使用 bufferWithTimeOrCount()\
  \ 运算符。\n\n然后我们需要在 Observable 上应用该运算符：\n\n```\nRx.Observable\n.fromEvent(document.getElementById('message_input'),'click')\n\
  .bufferWithTimeOrCount(800,3)\n```\n\n使用此运算符，将在用户进行三次点击或在第一次点击后给定的时间框架过去时触发事件，因此我们还需要添加一个\
  \ filter() 来确保用户完成了三次点击。\n\n可以用以下代码完成：\n\n```\nRx.Observable\n.fromEvent(document.getElementById('message_input'),'click')\n\
  .bufferWithTimeOrCount(800,3)\n.filter(function(events){\n  return events.length\
  \ === 3;\n})\n```\n\n就这样；此 observable 在用户在消息框中执行三连击操作时触发事件。\n\n现在我们需要将消息框的值更改为 /roll_a_dice\
  \ 命令，我们可以通过在此 Observable 中订阅来实现：\n\n```\nRx.Observable\n.fromEvent(document.getElementById('message_input'),'click')\n\
  .bufferWithTimeOrCount(800,3)\n.filter(function(events){\n  return events.length\
  \ === 3;\n}).subscribe(function(){\n  document.getElementById('message_input').value='/roll_a_dice';\n\
  });\n```\n\n如果你运行此代码并在浏览器中测试它，你会看到每当你在其中进行三连击时，消息框就会被填充为 /roll_a_dice 命令：\n\n![](img/8a5c36d94dc308a2a0fcf45ffa9cc27f_292_0.png)\n\
  \n现在让我们看看如何在不使用函数式响应式编程的情况下实现相同的行为。相同的行为可以用以下代码实现：\n\n```\nvar count=0;\nvar timer;\n\
  document.getElementById('message_input').addEventListener(\"click\", function()\
  \ {\n    count++;\n    if(!timer){\n        timer = setTimeout(function() {\n  \
  \          count=0;\n            timer=null;\n        },800);\n    }\n    if(count===3){\n\
  \        count=0;\n        clearTimeout(timer);\n        timer=null;\n        document.getElementById('message_input').value='/roll_a_dice';\n\
  \    }\n});\n```\n\n正如你所见，它更难阅读。我们需要在另一个作用域中创建两个变量，一个用于计算点击次数并检查是否等于三，另一个用于在间隔后重置计数器。\n\
  \n使用这种方法时，我们还需要手动启动和清除超时。\n\n不用说，现在它更难理解、阅读、重用、维护和测试。\n\n## 批处理对 DOM 的更改\n\n在开发前端应用程序时，性能的最大问题之一是对\
  \ DOM 的访问。\n\n在 DOM 中更改或添加节点会对应用程序的性能产生严重影响。\n\n使用 RxJS，我们可以使用缓冲区在应用到 DOM 之前聚合更改，从而轻松缓解此问题。在我们的网页聊天应用中，每当用户发送消息或你发送消息时，我们都需要向\
  \ DOM 中添加一个新节点。鉴于我们应用程序的性质，我们不期望每秒接收多条消息（否则用户将无法阅读消息），但如果你正在实现一个具有实时数据的图表，这种行为很快就会成为你的瓶颈。\n\
  \n\n\n在本节中，我们将对应用程序做一个小的改动，以便所有对 DOM 的更改在应用前先进行缓冲。我将展示这种技术，因为它可以在其他多个应用中使用。\n\n\
  在 index.js 文件中我们有以下代码；我们用它来监听来自服务器的传入数据：\n\n```javascript\nconnection.listen('message')\n\
  .subscribe(function(message){\n  var node = document.createElement(\"li\");\n  var\
  \ textnode = document.createTextNode(message.from + ' says to '+(message.to || 'everybody')+'\
  \ : '+message.content);\n  node.appendChild(textnode);\n  document.getElementById(\"\
  messages\").appendChild(node);\n});\n```\n\n在这段代码中，每当服务器收到一条新消息时，我们会立即在 DOM 中显示它；为了最小化对\
  \ DOM 的访问，我们可以轻松地将来自服务器的传入消息缓冲几毫秒。\n\n要实现这种行为，我们可以使用 bufferWithTime() 操作符在 500 毫秒的时间范围内缓冲消息。如前所述，鉴于我们应用程序的性质，使用它无法期望获得巨大的性能提升，但是，对于其他应用程序，我们可以缓冲更长时间并获得更多好处。\n\
  \n所以第一步是添加该操作符：\n\n```javascript\nconnection.listen('message')\n.bufferWithTime(500)\n\
  //keeps with the other operators and subscription\n```\n\nbufferWithTime() 操作符如果在给定时间范围内没有传播消息，将会传播空数组，因为我们不想运行订阅。如果我们没有收到任何消息，我们必须在此之后添加一个\
  \ filter() 来检查是否收到了消息。我们可以通过检查数组的长度是否大于 0 来做到这一点，如以下代码所示：\n\n```javascript\nconnection.listen('message')\n\
  .bufferWithTime(500)\n.filter(function(messages){\n  return messages.length > 0;\n\
  })\n//keeps with the other operators and subscription\n```\n\n现在我们必须更改 map() 操作符使用的函数，使其返回包含所有消息的新\
  \ DOM 元素：\n\n```javascript\n.map(function(messages){\n    var li;\n    var i=0;\n\
  \    var fragment = document.createDocumentFragment();\n    for(;i<messages.length;i++){\n\
  \        li = document.createElement(\"li\");\n        li.innerText = messages[i].from\
  \ + ' says to '+(messages[i].to || 'everybody')+' : '+messages[i].content;\n   \
  \     fragment.appendChild(li);\n    }\n    return fragment;\n})\n//keeps with subscription\n\
  ```\n\n在我们新的 map() 函数中，我们创建一个文档片段用作包含消息的所有 li 元素的容器，并返回该片段。\n\n采用这种新方法，浏览器不会为每条新消息不断计算样式和布局，而会将更改批量处理在\
  \ 500 毫秒的时间范围内。\n\n我们需要做的最后一件事是订阅最终的 observable，以便最终将更改应用到 DOM 并显示消息。我们的最终代码如下所示：\n\
  \n```javascript\nconnection.listen('message')\n    .bufferWithTime(500)\n    .filter(function(messages){\n\
  \        return messages.length > 0;\n    })\n    .map(function(messages){\n   \
  \     var li;\n        var i=0;\n        var fragment = document.createDocumentFragment();\n\
  \        for(;i<messages.length;i++){\n            li = document.createElement(\"\
  li\");\n            li.innerText = messages[i].from + ' says to '+(messages[i].to\
  \ || 'everybody')+' : '+messages[i].content;\n            fragment.appendChild(li);\n\
  \        }\n        return fragment;\n    })\n    .subscribe(function(node){\n \
  \       document.getElementById(\"messages\").appendChild(node);\n    });\n```\n\
  \n如果您运行应用程序并尝试发送一些消息，您将看到应用程序按预期运行：\n\n![](img/8a5c36d94dc308a2a0fcf45ffa9cc27f_296_0.png)\n\
  \n![](img/8a5c36d94dc308a2a0fcf45ffa9cc27f_296_1.png)\n\n如今许多框架使用不同的策略来避免对 DOM 应用更改，因为这可以带来很大的性能提升。在这里，您可以看到如何使用\
  \ RxJS 中提供的几个函数式响应式编程操作符轻松实现这种策略，以避免对 DOM 的更改。\n\n现在您的 index.js 文件应如下所示：\n\n```js\n\
  var Rx = require('rx');\nvar connection = require('./connection');\nvar events =\
  \ require('./events');\n\nvar logged = prompt(\"Please enter your name\", \"\");\n\
  \nvar messagesObservable = events.map(function(value){\n    var userName, splittedUserInput,\
  \ action, content;\n    if(value.indexOf('!')===0){\n        userName = value.substring(1);\n\
  \        return {service:'blockUser',blocked:userName,from:logged};\n    }\n   \
  \ if(value.indexOf('/')===0){\n        splittedUserInput = value.split(' ');\n \
  \       action = splittedUserInput[0].substring(1);\n        content = splittedUserInput.slice(1).join('\
  \ ');\n        return {\n            service:'command',\n            action:action,\n\
  \            content:content,\n            from:logged\n        };\n    }\n}\nif(value.indexOf('@')===0){\n\
  \    splittedUserInput = value.split(' ');\n    userName = splittedUserInput[0].substring(1);\n\
  \    content = splittedUserInput.slice(1).join(' ');\n    return {\n        service:'sendMessage',\n\
  \        to:userName,\n        content:content,\n        from:logged\n    };\n}\n\
  \    return {service:'sendMessage',content:value,from:logged};\n}).merge(\n    Rx.Observable.of({service:'listenToMessages',me:logged})\n\
  );\n\nconnection.addSender(messagesObservable);\n\nconnection.listen('message')\n\
  \    .bufferWithTime(500)\n    .filter(function(messages){\n        return messages.length\
  \ > 0;\n    })\n    .map(function(messages){\n        var li;\n        var i=0;\n\
  \        var fragment = document.createDocumentFragment();\n        for(;i<messages.length;i++){\n\
  \            li = document.createElement(\"li\");\n            li.innerText = messages[i].from\
  \ + ' says to '+\n                (messages[i].to || 'everybody')+' : '+messages[i].content;\n\
  \            fragment.appendChild(li);\n        }\n        return fragment;\n  \
  \  })\n    .subscribe(function(node){\n        document.getElementById(\"messages\"\
  ).appendChild(node);\n    });\n```\n\n## 测试应用程序\n\n您可以创建多种方式来为应用程序创建测试；其中一个可能的选项是为应用程序创建单元测试。\n\
  \n如果我们决定为客户端应用程序创建单元测试，我们需要一种方法来模拟与服务器的连接；这将涉及为测试创建新的（且略复杂）构建。\n\n我们也可以创建端到端测试，以测试用户的整个流程。这样做可能需要使用一些外部工具在浏览器上下文中运行测试并自动化用户输入。这还涉及额外运行\
  \ Selenium 或 CasperJS 等工具的步骤。\n\n关于如何测试前端应用程序的不同方式，有几本书。在这里，我选择实现最简单的解决方案，即使用 mocha\
  \ 创建测试页面，如第 7 章《Something is Wrong - Testing and Dealing with Errors》中所述。\n\n为此，让我们在\
  \ static 文件夹内创建一个名为 index_test.html 的页面；该页面将是 index.html 页面的副本，但它将包含我们应用程序的测试。它将基于第\
  \ 7 章《Something is Wrong - Testing and Dealing with Errors》中的测试 HTML 文件。\n\n将以下内容粘贴到该页面中：\n\
  \n```html\n<html>\n<head>\n<meta charset=\"utf-8\">\n<title>Tests</title>\n<link\
  \ href=\"https://cdn.rawgit.com/mochajs/mocha/2.2.5/mocha.css\" rel=\"stylesheet\"\
  \ />\n</head>\n<body>\n<div id=\"mocha\"></div>\n<div style=\"display:none\">\n\
  <ul id=\"messages\"></ul>\n<div class=\"message_container\">\n<input id=\"message_input\"\
  /><button id=\"send_message\">Send message</button>\n</div>\n</div>\n<script src=\"\
  https://cdn.rawgit.com/mochajs/mocha/2.2.5/mocha.js\"></script>\n<script src=\"\
  https://cdnjs.cloudflare.com/ajax/libs/chai/3.5.0/chai.min.js\"></script>\n<script>\n\
  window.prompt=function () {\nreturn \"Erich\";\n};\n</script>\n<script src=\"/bundle.js\"\
  ></script>\n<script>\n    mocha.setup('bdd');\n    var assert = chai.assert;\n \
  \   describe('Web chat test', function() {\n        // Your test goes here\n   \
  \ });\n    mocha.run();\n</script>\n</body>\n</html>\n```\n\n此页面包含 mocha 和 chai\
  \ 库以及用于运行测试的 mocha div。由于我们决定尽可能保持代码简单并测试整个用户流程，我们需要用于为应用程序创建 observable 的 HTML\
  \ 元素（消息框、发送按钮以及所有消息的容器）；我们将它们放在一个隐藏的 div 中，因此不会在屏幕上显示。\n\n由于我们不想弹出一个询问用户名的屏幕，我们还重写了默认的\
  \ prompt 函数，使其始终返回相同的名称；该名称将由已登录用户使用。\n\n最后，我们有一个包含 mocha 运行的所有测试的脚本块。\n\n我们要实现的第一个测试是用于公共消息；给定用户必须能够发送公共消息，并且它必须放在\
  \ ul 元素内。\n\n这将是我们第一个测试：\n\n```javascript\nit('should send and receive public messages',\
  \ function(done) {\n    setTimeout(function() {\n        document.getElementById(\"\
  message_input\").value = \"hello\";\n        document.getElementById(\"send_message\"\
  ).click();\n        setTimeout(function() {\n            assert.equal(document\n\
  \                .getElementById(\"messages\").children.length,1);\n           \
  \ assert.equal(document\n                .getElementById(\"messages\").children[0].innerText,\n\
  \                \"Erich says to everybody : hello\"\n            );\n         \
  \   done();\n        },500);\n    },100);\n});\n```\n\n\n\n在本测试中，我们首先运行一个 setTimeout()\
  \ 来等待连接可用（我们等待 100 毫秒，这应该足够了），然后我们用一条消息填充消息框以强制点击发送按钮。我们再次等待几毫秒以便消息被送达，并检查 <ul>\
  \ 元素的内容，以查看是否包含该消息。我们最后结束测试，调用 done() 函数。\n\n为了测试我们的应用程序，我们需要一切都在运行，因此，在保存此文件后，启动你的应用程序并在浏览器中打开以下地址：\n\
  http://localhost:3000/index_test.html.\n\n你可以在此屏幕中看到你的测试通过：\n\n![](img/8a5c36d94dc308a2a0fcf45ffa9cc27f_300_0.png)\n\
  \n我们希望使测试相互独立，因此，我们将添加一个 beforeEach 钩子，在每次测试前清理 HTML 元素：\n\n```\nbeforeEach(function()\
  \ {\n    document.getElementById(\"message_input\").value = \"\";\n    document.getElementById(\"\
  messages\").innerHTML = \"\";\n});\n```\n\n所有其他测试都遵循与第一个测试相同的模式。\n\n在第二个测试中，我们将检查私有消息：\n\
  \n```\nit('should send and receive private messages', function(done) {\n    setTimeout(function(){\n\
  \        document.getElementById(\"message_input\").value = \"@Erich hello\";\n\
  \        document.getElementById(\"send_message\").click();\n```\n\n```\nsetTimeout(function(){\n\
  assert.equal(document.getElementById(\"messages\").children.length,1);\nassert.equal(\n\
  document.getElementById(\"messages\").children[0].innerText,\n\"Erich says to Erich\
  \ : hello\"\n);\ndone();\n},500);\n},100);\n});\n```\n\n此测试与第一个测试的唯一区别是发送和接收的消息。\n\
  \n在第三个测试中，我们将查看 roll_a_dice 命令是否有效：\n\n```\nit('should support roll_a_dice command',\
  \ function(done) {\n    setTimeout(function(){\n        document.getElementById(\"\
  message_input\").value = \"/roll_a_dice\";\n        document.getElementById(\"send_message\"\
  ).click();\n        setTimeout(function(){\n            assert.equal(document\n\
  \                .getElementById(\"messages\").children.length,1);\n           \
  \ assert.equal(\n                /server says to Erich : Result is [1-6]/ .test(\n\
  \                document.getElementById(\"messages\")\n                .children[0].innerText\
  \ ),true );\n            done();\n        },500);\n    },100);\n});\n```\n\n这里我们使用正则表达式来检查文件的内容，因为服务返回的数字可以在\
  \ 1 到 6 之间任意取值。\n\n最后一个测试检查 echo 命令是否按预期工作：\n\n```\nit('should support echo command',\
  \ function(done) {\n    setTimeout(function(){\n        document.getElementById(\"\
  message_input\").value = \"/echo hello\";\n        document.getElementById(\"send_message\"\
  ).click();\n        setTimeout(function(){\n            assert.equal(document\n\
  \                .getElementById(\"messages\").children.length,1);\n           \
  \ assert.equal(document\n                .getElementById(\"messages\").children[0].innerText,\n\
