  md: 'The following code can be described by the following diagram:


    ![](img/8a5c36d94dc308a2a0fcf45ffa9cc27f_227_0.png)


    As you can see in the diagram, no intermediate observable is created; the same
    code can be implemented using the map() and filter() operators of observables,
    but it would add the creation of an extra observable, decreasing your code performance.


    If we decided to implement the same code using the operators map() and filter()
    instead of a transducer, we could use the following code:


