  md: 'The output of this code would be the same, but under the hood it creates intermediate
    observables, as can be seen in this diagram:


    ![](img/8a5c36d94dc308a2a0fcf45ffa9cc27f_228_0.png)


    # Testing transducers


    When using transducers you can decouple the logic to transform your data from
    the source of your data; this way you can create tests for each one of your transducers
    without having to add an observable.


    To test transducers we will use the exact same tools we used to test observables
    so far; the difference is that we can test the logic of the transducers using
    any iterable source of data such as an array or an observable.


    Since observables are asynchronous data structure by nature, every time we want
    to test an observable, or to test the transformations applied to an observable,
    we need to create asynchronous tests. As transducers work independently of the
    current source of data we can use arrays to its behavior; using arrays we can
    create synchronous tests, which usually make them faster and easier to write and
    read.'
  merge: -1
  img_proc: true
- pgno: 229
  md: "Let's see how we can use an observable to test a transducer. To do so, let's\
    \ first create a transducer to map a number to it plus 1 and then filter to keep\
    \ only even numbers; this is the same transducer we already use in previous examples,\
    \ so there is no need to explain each step:\n\n```\nvar mapAndFilter = t.comp(\n\
    \    t.map((i)=>i+1),\n    t.filter((i)=>i%2===0)\n);\n```\n\nNow we can create\
    \ a unit test for it using an observable:\n\n```\nvar assert = require('assert');\n\
    \ndescribe('Transducer test', function() {\n    it('should return empty when running\
    \ for empty observables',\n    function(done) {\n        var found = false;\n\
    \        Rx.Observable.empty()\n            .transduce(mapAndFilter)\n       \
    \     .subscribe(\n                function(){\n                    found = true;\n\
    \                },\n                function noop(){},\n                function(){\n\
    \                    assert.equal(false,found);\n                    done();\n\
    \                }\n            );\n        });\n    });\n```\n\nSo far, we have\
    \ only one test; this test checks if the transducer returns empty if the source\
    \ of data is empty. To implement this, we first create a flag variable called\
    \ found; this flag will be turned to true is we propagate any content in this\
    \ observable. We add an empty() function to our error listener, and we check if\
    \ our flag is still false and then finish the test when we complete the observable."
  merge: -1
  img_proc: true
- pgno: 230
  md: "If the `found` flag still has the value `false`, this means that no element\
    \ was propagated. If we run this test we will see the following message in the\
    \ console, showing that our test passed:\n\n![](img/8a5c36d94dc308a2a0fcf45ffa9cc27f_230_0.png)\n\
    \nLet's add one more test using an observable containing some values:\n\n```\n\
    ```js\nit('should return propagates 2,4 when running for an observable containing\
    \ 1,2,3,4', function(done) {\n  Rx.Observable.of(1,2,3,4)\n  .transduce(mapAndFilter)\n\
    \  .toArray()\n  .subscribe(\n    function(value){\n      assert.equal(2,value.length);\n\
    \      assert.equal(2,value[0]);\n      assert.equal(4,value[1]);\n    },\n  \
    \  function noop(){},\n    function(){\n      done();\n    }\n  );\n});\n```\n\
    ```\n\nIn this new test we add a test case using an observable containing the\
    \ values 1, 2, 3, and 4, we then apply the transducer to it and the operator `toArray()`\
    \ on the result observable to create a new observable that propagates only one\
    \ array containing all the values from this observable. We know the propagated\
    \ value must be the array [ 2, 4 ], and to check this we must add three assertions;\
    \ the first ensures that we have an array with two elements, the second ensures\
    \ that the first element is 2, and the third ensures that the second element is\
    \ 4. We finally finish the test when the observable completes."
  merge: -1
  img_proc: true
- pgno: 231
  md: "If we run this test we will see the following message in the console, showing\
