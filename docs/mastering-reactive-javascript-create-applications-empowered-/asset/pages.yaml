    # Handling WebSocket connections


    We will handle WebSocket connections using the socket.io library. This is the
    most used WebSocket library for the Node.js community.


    Now, let''s start our WebSocket implementation. Open your index.js file and put
    this code inside it:


    ```

    let Rx = require(''rx'');

    let dataSource = require(''./data_source'');

    let services = require(''./services'')(dataSource);

    ```'
