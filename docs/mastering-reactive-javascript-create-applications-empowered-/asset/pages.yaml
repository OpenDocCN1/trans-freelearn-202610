- pgno: 206
  md: '# Dealing with backpressure


    Backpressure happens every time you receive data faster than you are able to process
    for a given time.


    Before even starting to code your solution for back pressure you must decide if
    you are willing to spend memory or lose data.


    When you can lose data you can use a lossy strategy; the advantage of this strategy
    is it has a low consumption of memory, and lets you mitigate the problem using
    constant memory. The lossy operators that we learned are as follows:


    +   - `throttle()`

    +   - `sample()`

    +   - `debounce()`

    +   - `pausable()`


    If you cannot lose data, you can use memory to store data while processing it;
    the strategy you will use to deal with backpressure is the loss-less strategy.
    We learned the following operators to loss-less operators to deal with backpressure:


    +   - `bufferWithCount()`

    +   - `bufferWithTime()`

    +   - `bufferWithTimeOrCount()`

    +   - `pausableBuffered()`

    +   - `controlled()`


    Knowing the limits of your program (memory or data) will help you to decide what
    operators to use.


    # Combining observables


    The most important thing is to remember that you can even combine observables
    to create a new one using data from both.'
  merge: -1
  img_proc: true
- pgno: 207
  md: 'There are three really important operators for this:


    +   - `merge()`

    +   - `concat()`

    +   - `zip()`


    The `concat()` operator generates a new observable containing the data from all
    provided observables; the data is propagated on the new observable following the
    order of the observables, so it first propagates all the data from the first observable,
    and only after it finishes does it go to the next and so on. One important thing
    is that, if one observable is infinite (and for this reason never finishes), it
    never goes to the next.


    The `merge()` operator is similar to the `concat()` operator, but it follows the
    order of the values, so it listens for data in all observables and propagates
    it to the created observable as soon as it occurs. When using this operator even
    if one of the observables is infinite it propagates the data from all.


    The `zip()` operator is a little bit different from the other two, as it creates
    a new observable from a combination of the other observables; by default it propagates
    an array containing the values from each of them, but you can also provide a function
    to combine them as you want.


    ![](img/8a5c36d94dc308a2a0fcf45ffa9cc27f_207_0.png)


    > So that is our quick review summarizing some of the most important lessons from
    this book up to this point; feel free to review your weaknesses. In this chapter,
    we will learn some other advanced operators.


    # Other important operators


    Some important operators from RxJS don''t have a perfect match with the groups
    of operators we learned so far, but they can easily solve some complex and specific
    problems with a few lines of code, making you feel like a magician when using
    them. Now we are going to learn them.


    # The flatMapLatest() operator


    This operator is similar to the `flatMap()` operator, but it only propagates items
    from the most recently transformed observable.'
  merge: -1
  img_proc: true
- pgno: 208
  md: "Imagine a search as you type feature. In this feature, for every key stroke\
    \ you will do a search and present the current result in the screen; if you are\
    \ accessing external resources such as a database or an API, some searches can\
    \ take more time than others, and the naive implementation of this search (using\
    \ flatMap() for instance) might show wrong results. Look at this example:\n\n\
    +   1. A search box to search names in a database.\n+   2. The user types the\
    \ letter J and starts a search for all available names starting with the letter\
    \ J.\n+   3. The user types the letter O and starts a search for all available\
    \ names starting with JO.\n+   4. The search for names starting with JO finishes\
    \ and presents the results (John and Joe, for instance).\n+   5. The first search\
    \ (names starting with J) finally finishes (it took more time than the search\
    \ for JO), and changes the presented results using names starting with J (Jean,\
    \ June, John, for instance).\n+   6. The presented results are wrong, because\
    \ the user search box shows JO, and some of the presented results do not start\
    \ with JO (Jean and June).\n\nThe flatMapLatest() operator is perfect for this\
    \ case, as in the presented example the results for J would be discarded in case\
    \ it took more time to finish.\n\nThe flatMapLatest() operator has the following\
    \ signature:\n\n```\nobservable.flatMapLatest(selectorFunction, [selectorContext]);\n\
    ```\n\nIt receives up to two parameters; the first is mandatory and the second\
    \ is optional:\n\n+   - selectorFunction: It is a function that maps a value to\
    \ an observable sequence\n+   - selectorContext: In the this parameter (context)\
    \ used in the selectorFunction\n\nAn example usage of this operator can be seen\
    \ in the following code:\n\n```\nRx.Observable\n.of(1,2,3)\n.flatMapLatest(\n\
    \  (i)=>Rx.Observable.just(i+1)\n).subscribe((k)=>console.log(k));\n```"
