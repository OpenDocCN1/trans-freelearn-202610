- pgno: 58
  md: "# Reusing observables\n\nIn the previous section, we saw how we can use operators\
    \ to create new observables, but until this moment, we have never tried reusing\
    \ an observable. To do this, I propose a change in the program we created in the\
    \ previous section. We still want to print the string for every date where the\
    \ seconds part is an even number. But now, let's also print the string a second\
    \ has passed every second. To do this, we can use another Bacon.interval call\
    \ to generate a new observable that emits an empty object every second. Once this\
    \ is done, we can map each object in the observable to the string we want and\
    \ finally subscribe to print, as you can see in the following code:\n\n```\nBacon\n\
    \    .interval(1000)\n    .map(\n        ()=> 'a second has passed'\n    )\n \
    \   .onValue((str)=> console.log(str));\n```\n\nIf you add the preceding code\
    \ to the last program, you will see the following output:\n\n```\na second has\
    \ passed\nThe number in the second part of the date 2016-11-23T22:42:18.683Z\n\
    \    is 18 which is as even number\na second has passed\na second has passed\n\
    The number in the second part of the date 2016-11-23T22:42:20.696Z\n    is 20\
    \ which is as even number\na second has passed\na second has passed\nThe number\
    \ in the second part of the date 2016-11-23T22:42:22.702Z\n    is 22 which is\
    \ as even number\n```\n\nThis solution is okay, but we can reuse the first Bacon.interval(),\
    \ storing it in a variable. This way, we don't have to keep repeating this code\
    \ every time we want a source of events emitting every second, using a variable\
    \ as follows:\n\n```\nvar emitsEverySecondStream = Bacon.interval(1000);\n```\n\
    \nWe can create better code by reusing this variable as follows:\n\n```\nvar emitsEverySecondStream\
    \ = Bacon.interval(1000);\nemitsEverySecondStream.map(\n    (i)=> new Date()\n\
    )\n.filter(\n    (date)=>date.getSeconds() % 2 == 0\n)\n```"
  merge: -1
  img_proc: true
