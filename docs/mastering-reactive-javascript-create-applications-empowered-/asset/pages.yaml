  md: '![](img/8a5c36d94dc308a2a0fcf45ffa9cc27f_43_0.png)


    As you can see, it never prints Now the stream will finish because the error happened
    before it.


    # Properties


    Now you know what an EventStream is and how to create it; as discussed, it is
    an observable. However, bacon.js has another special form of observable called
    Property. A Property is an EventStream with the concept of current value. You
    can create a Property from any EventStream using the toProperty() or scan() method;
    it is especially useful to represent DOM data binding.


    To create a Property from an EventStream, you can use the toProperty() method
    that has the following signature:


    ```

    eventStream.toProperty(initialValue);

    ```


    The initialValue parameter is optional. If you decide to omit it, you will have
    a Property without an initial value. If you pass it, it will be used as the current
    value of this Property until the first value is emitted from the stream.


    The other way to create a Property is using the scan() method. This method is
    similar to the reduce() method from the Javascript array object. Given a seed
    object and accumulator function, the scan() method will iterate over your EventStream
    to create a Property from the result:


    ```

    Bacon

    .sequentially(100, [''a'',''b'',''c'',''d''])

    .scan(''=> '', (acc,b)=> acc+b)

    .onValue((value)=>console.log(value));

    ```


    In this example, we first create an EventStream from an array of strings, then
    we call the scan() method to create a Property with a seed value of => , and using
    a function to concatenate these value, we print the result to the console for
    each scan iteration. So running this code will give the following output:


    ```

    =>

    => a

    => ab

    => abc

    => abcd

    ```'
  merge: -1
  img_proc: true
- pgno: 44
  md: "# Changes in an observable\n\nIn the last section, we saw how to use the `scan()`\
    \ method to create a Property from an EventStream. When we use this method (actually,\
    \ when we use any operator), we do not change the original observable; we always\
    \ create a new observable. So, it never interferes with the other subscriptions\
    \ (and transformations) of the observable. We can change the previous code to\
    \ listen to events on both the EventStream and the Property; now we will see that\
    \ making changes in one of these two doesn't affect the other:\n\n```\nvar eventStream\
    \ = Bacon\n    .sequentially(100,['a','b','c','d']);\n\neventStream.onValue((value)=>{\n\
    \    console.log('From the eventStream :'+value);\n});\n\nvar property = eventStream.scan('=>\
    \ ',(acc,b)=> acc+b);\n\nproperty.onValue((value)=>{\n    console.log('From the\
    \ property :'+value);\n});\n```\n\nIt gives the following output:\n\n```\nFrom\
    \ the property :=>\nFrom the eventStream :a\nFrom the property :=> a\nFrom the\
    \ eventStream :b\nFrom the property :=> ab\nFrom the eventStream :c\nFrom the\
    \ property :=> abc\nFrom the eventStream :d\nFrom the property :=> abcd\n```\n\
    \nThis shows that the usage of the `scan()` method to concatenate the array in\
    \ the Property does not change the behavior of the original `eventStream`."
  merge: -1
  img_proc: true
- pgno: 45
  md: '# Reacting to changes


    As discussed earlier, an observable is an object where you can listen to events.
    The act of listening to events in this object is called **subscription**. Here,
    we will see the different ways in which we can subscribe to an observable and
    also how we can stop listening to events in this observable (unsubscribe).


    # Subscribing


    We call subscribing to an observable an act of adding a function to be called
    when an event happens. Using bacon.js, we can be notified when a value is emitted
    (the `onValue()`, `log()`, and `assign()` methods), when an error has occurred
    (the `onError()` method), or when our observable is closed (at the end).


    # Subscribing using the onValue() method


    The most common way of subscribing to an observable is using the `onValue()` method.


    This method has the following signature:


    ```

    observable.onValue(functionToBeCalledWhenAnEventOccurs);

    ```


    So let''s subscribe to `eventStream` to log every event on this stream, as follows:


    ```

    Bacon

    .fromArray([1,2,3,4,5])

    .onValue((number)=>console.log(number));

    ```


    This code gives you the following output to the console:


    1

    2

    3

    4

    5'
  merge: -1
  img_proc: true
- pgno: 46
  md: "This function can be used for any type of observable (EventStream and Property).\
    \ The only difference is that in Properties, if the initial value of the Property\
    \ exists, then it triggers the onValue() function. Check out the following code:\n\
    \n```\nvar initialValue =0;\nBacon\n    .fromArray([1,2,3,4,5])\n    .toProperty(initialValue)\n\
    \    .onValue((number)=>console.log(number));\n```\n\nThis will give you the following\
    \ output:\n\n```\n0\n1\n2\n3\n4\n5\n```\n\nWhen subscribing to an observable,\
    \ it's important you know a way to unsubscribe it as well. The onValue() method\
    \ returns a function; this function when called will unsubscribe your function\
    \ from this observable. So we can create an observable from an interval and print\
    \ a message every time an event is propagated, as follows:\n\n```\nBacon\n   \
    \ .interval(1000)\n    .onValue(()=>console.log(\"event happened\"));\n```\n\n\
    It will print the message event happened every second until we kill the process.\
    \ But if we want, we can use the return of onValue() to unsubscribe from our observable\
    \ after a certain amount of time, as follows:\n\n```\nvar unsubscribe = Bacon\n\
    \    .interval(1000)\n    .onValue(()=>console.log(\"event happened\"));\n\nsetTimeout(function(){\n\
    \    console.log(\"unsubscribing\")\n    unsubscribe();\n},4000);\n```"
