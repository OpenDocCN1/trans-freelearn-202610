    \ satisfies the condition:\n\n```\nvar defaultValue = 'no even numbers';\nRx.Observable\n\
    \  .of(1,3,5)\n  .first((i)=>i%2===0,null,defaultValue)\n  .subscribe((i)=>console.log(i));\n\
    ```\n\nNotice that we removed all even numbers from the observable, so when you\
