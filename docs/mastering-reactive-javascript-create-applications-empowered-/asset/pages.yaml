- pgno: 153
  md: 'In this example, the final Observable will emit the value of the first one
    (value 1), and as it finishes it goes to the next. As the Observable created from
    the interval() method is infinite, it will never emit the Hello World!!! string
    from the last Observable. So running this code will give us the following output,
