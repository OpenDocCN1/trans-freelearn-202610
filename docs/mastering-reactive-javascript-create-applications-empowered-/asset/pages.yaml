- pgno: 50
  md: "# Reading how an operator works\n\nThroughout this book, you will see a lot\
    \ of diagrams explaining how an operator works. These diagrams are a graphical\
    \ representation of observables and operations in those observables. Usually,\
    \ the diagrams consist of three parts. On the top they shows a line with balls\
    \ representing the initial state of an observable. The line itself represents\
    \ an observable. The circles are events that happened in this observable and they\
    \ are pushed from left to right; therefore, the leftmost ball is the first event,\
    \ the second one is the second, and so on. This is illustrated in the following\
    \ diagram:\n\n![](img/8a5c36d94dc308a2a0fcf45ffa9cc27f_50_0.png)\n\nSo, the preceding\
    \ line represents an observable with three emitted events. The string at the center\
    \ of each circle is the value emitted by that event. The short vertical line on\
    \ the right-hand side of the diagram represents the end of this observable. This\
    \ diagram is a graphical representation of the following observable:\n\n```\n\
    Bacon\n.fromArray([\n    'First Event',\n    'Second Event',\n    'Third Event'\n\
    ]);\n```\n\nAs we know, an observable can exist forever (the ones created using\
    \ the Bacon.interval() method). To represent this kind of observable, we remove\
    \ the short line on the right-hand side. This way, we show that other events might\
    \ happen in this observable in the future, but we are not interested in them,\
    \ , as shown in the following diagram:\n\n![](img/8a5c36d94dc308a2a0fcf45ffa9cc27f_50_1.png)"
  merge: -1
  img_proc: true
- pgno: 51
  md: "This diagram is a possible representation of the following observable:\n\n\
    ```\nBacon\n    .interval(1000);\n```\n\nKeep in mind, the time between events\
    \ is irrelevant in this case, so we decided to omit it from the graphical representation\
    \ (we usually omit this information, as this is an implementation detail). The\
    \ Bacon.interval() method always emits an empty object, and for this reason, we\
    \ draw brackets at the center of each circle.\n\nThe main reason for using this\
    \ graphical representation is to show how an operator transforms an observable.\
    \ So to show which operator is being used, we add an arrow pointing downward with\
    \ the name of the operator and the content of the operator if needed. So if we\
    \ want to represent the use of the map() operator, we can use the following diagram:\n\
    \n![](img/8a5c36d94dc308a2a0fcf45ffa9cc27f_51_0.png)\n\nAs discussed before, when\
    \ an operator is applied to an observable, it creates a new observable (it does\
    \ not change the original observable). For this reason, we add a new line that\
    \ represents the new observable created after the operation. On this new line,\
    \ I decided to omit the value at the center of the circle (adding only three dots),\
    \ because the way the map() operator works is out of the scope of this discussion."
  merge: -1
  img_proc: true
- pgno: 52
  md: "![](img/8a5c36d94dc308a2a0fcf45ffa9cc27f_52_0.png)\n\nSometimes we want to\
    \ represent multiple operators. In such cases, we just keep chaining more lines.\
    \ Some operators let you work with multiple observables, which makes the diagram\
    \ more complex. But don't worry, we will explain the changes the first time they\
    \ happen.\n\n# Transforming events using bacon.js\n\nOne important thing when\
    \ learning functional reactive programming is how you can transform the events\
    \ emitted by an observable. This way, you can use successive function calls to\
    \ create new objects from the original input. This also improves the reuse of\
    \ your code; every transformation of an observable creates a new observable, and\
    \ each observable can have several listeners subscribed to it.\n\nBefore applying\
    \ any transformations to our observables, let's implement an observable to generate\
    \ and print the current date. To do this, let's use the Bacon.interval() method.\
    \ So, the following code will emit an empty object every second:\n\n```\nvar eventSource\
    \ = Bacon\n    .interval(1000);\n```\n\n![](img/8a5c36d94dc308a2a0fcf45ffa9cc27f_52_1.png)\n\
    \nRemember, Bacon.interval() emits an empty object every x milliseconds, where\
    \ x is the argument passed to the function–in our example, every 1000 milliseconds,\
    \ which is the same as every second.\n\nNow we can just subscribe a function to\
    \ print the current date to the console. We can do this using the onValue() function\
    \ by adding the following line:\n\n```\neventSource\n    .onValue(() => {\n  \
    \      console.log(new Date());\n    });\n```\n\nThis will keep printing an output\
    \ as follows:\n\n```\n2016-11-23T21:21:43.291Z\n2016-11-23T21:21:44.315Z\n2016-11-23T21:21:45.319Z\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 53
  md: 'It works fine and solves our problem, but remember the problem–We wanted an
    observable to generate and print the current date to the console. Unfortunately,
    bacon.js doesn’t have any observable that could generate the current date every
    given second, but we can use an operator to change the empty object to the current
    date. The return of this operator will be a new observable that will emit the
    current date every second, which is exactly what we wanted from the beginning.
    Then, we can use the onValue() method to subscribe to this operator in order to
    print the current date.


    Luckily, such an operator exists and it is one of the most commonly used operators
    as well. It’s called the map() operator. It lets you add a function to map an
    event emitted in another object. It has the following signature:


    ```

    eventStream.map(handler);

    ```


    The handler in the signature is a function that receives the emitted event and
    returns a new object to substitute the original event (so basically, we map an
    input to an output). You can see this illustrated in the following diagram:


    ![](img/8a5c36d94dc308a2a0fcf45ffa9cc27f_53_0.png)


    This diagram describes exactly how we want our observable to work. We use the
    Bacon.interval() method to generate a new observable that will emit the current
    date using the map() function. This function is executed every time an object
    is emitted.'
  merge: -1
  img_proc: true
- pgno: 54
  md: "Looking at this diagram makes it a lot easier to understand how we can use\
    \ the map () function to implement the desired behavior. We will need to do some\
    \ minor changes in our original code to create a new EventStream using the map\
    \ () operator, and change our subscription to only log the emitted event. So,\
    \ the final implementation of the described diagram using the map () operator\
    \ is as follows:\n\n```\nBacon\n    .interval(1000)\n    .map(\n        (i)=>\
    \ new Date()\n    )\n    .onValue((date)=>console.log(date));\n```\n\nThis gives\
    \ you the same kind of output as from the previous code:\n\n```\n2016-11-23T21:21:43.291Z\n\
    2016-11-23T21:21:44.315Z\n2016-11-23T21:21:45.319Z\n```\n\nIn this section, I\
    \ want to show you an example of reusing an eventStream. To do this, we will slightly\
    \ change our original problem. Now, we want to print only those dates where the\
    \ seconds are even. To do this, we will need a new operator: the filter() operator.\
    \ This operator lets you create a new observable by omitting some events that\
    \ you are not interested in. It has the following signature:\n\n```\neventStream.filter(handler);\n\
    ```\n\nHere, handler is a function that receives the emitted event as an input\
    \ and returns true or false (actually, any truthy or falsy value). So, because\
    \ we want to print only the dates where the seconds are even, we will pass the\
    \ following handler as an argument to the filter operator:\n\n```\n(date)=>date.getSeconds()\
    \ % 2 == 0\n```\n\nAs you can see, this function receives the current date as\
    \ an argument and gets the seconds part of this date. Also, it uses the mod operator\
    \ to decide whether it is an even number or not.\n\n![](img/8a5c36d94dc308a2a0fcf45ffa9cc27f_54_0.png)\n\
    \nNotice that one of the advantages of this approach is the creation of small\
    \ functions to implement each part of our code. This makes our code more testable,\
    \ as we can easily create unit tests for each of these functions."
  merge: -1
  img_proc: true
- pgno: 55
  md: "Now, to implement this new observable that emits only even dates, all we need\
    \ to do is chain the `filter()` function to our previous observable in order to\
    \ create a new observable that we can subscribe to finally print what we want.\
    \ You can see the use of this `filter()` operator in the following diagram:\n\n\
    ![](img/8a5c36d94dc308a2a0fcf45ffa9cc27f_55_0.png)\n\nAs you can see in this diagram,\
    \ on the created observable, we don't emit the dates where the seconds are odd\
    \ numbers. For this reason, we don't have their circles. Now, let's change our\
    \ code using the `map()` function to use the `filter()` operator as well. This\
    \ can be easily done with the following code:\n\n```\nBacon\n    .interval(1000)\n\
    \    .map(\n        (i)=> new Date()\n    )\n    .filter(\n        (date)=>date.getSeconds()\
    \ % 2 == 0\n    )\n    .onValue((date)=>console.log(date));\n```"
  merge: -1
  img_proc: true
