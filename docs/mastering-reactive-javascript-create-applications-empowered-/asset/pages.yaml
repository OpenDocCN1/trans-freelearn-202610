    \ subscribers to the same observable. You can see this happening in the following\
    \ code:\n\n```\nvar eventStream = Bacon\n    .interval(1000)\n    .map(\n    ()=>\
    \ 'a second has passed'\n    );\neventStream\n    .onValue((str)=>console.log('Subscriber\
    \ 1 prints => ' + str));\neventStream\n    .onValue((str)=>console.log('Subscriber\
    \ 2 prints => ' + str));\neventStream\n    .onValue((str)=>console.log('Subscriber\
    \ 3 prints => ' + str));\n```\n\nIn this code, we added three subscriptions to\
    \ the same EventStream. This will give us the following output:\n\n```\nSubscriber\
    \ 1 prints => a second has passed\nSubscriber 2 prints => a second has passed\n\
    Subscriber 3 prints => a second has passed\nSubscriber 1 prints => a second has\
    \ passed\nSubscriber 2 prints => a second has passed\nSubscriber 3 prints => a\
    \ second has passed\n```\n\n![](img/8a5c36d94dc308a2a0fcf45ffa9cc27f_59_0.png)\n\
    \nRemember that the onValue() function returns a function to unsubscribe that\
    \ function from the observable. So if you want, you can unsubscribe from each\
    \ subscription individually without affecting other subscriptions."
