  md: "+   - `takeLast()`\n+   - `takeWhile()`\n+   - `skip()`\n+   - `skipWhile()`\n\
    \nWe can use these operators when we are interested only in a subset of data from\
    \ an observable.\n\n![](img/8a5c36d94dc308a2a0fcf45ffa9cc27f_138_0.png)\n\nThere\
    \ are other operators to filter data on RxJS but these are the most common ones.\n\
    \n# The first() operator\n\nThe first() operator returns a new observable containing\
    \ only the first element in an observable which satisfies a given condition. This\
    \ operator has the following signature:\n\n```\nobservable.first([condition],\
    \ [context], [defaultValue]);\n```\n\nAll parameters are optional:\n\n+   - `condition`:\
    \ This is the function which the value must satisfy to be retrieved\n+   - `context`:\
    \ This is an argument used in the given conditional function\n+   - `defaultValue`:\
    \ This is a value used as the default if the observable is exhausted and no item\
    \ satisfies the given condition\n\nIf no condition is supplied, this operator\
    \ returns the first element in the Observable. This is shown in the following\
    \ example:\n\n```\nRx.Observable\n  .of(1,2,3)\n  .first()\n  .subscribe((i)=>console.log(i));\n\
    ```\n\nIf you run this code, you will see the following output:\n\n1"
