- pgno: 271
  md: '# 11


    # A Real-Time Client


    In the last chapter, we implemented our first application using functional reactive
    programming; we decided to implement a real-time web chat using WebSockets because
    of its inherit nature of interactivity, making it a perfect candidate for functional
    reactive programming.


    We decided to use RxJS in all levels of the application; we used it to:


    +   - Model servers and incoming WebSocket connections

    +   - Implement the business rule for some services

    +   - Implement the DataSource of our application

    +   - Implement the tests of our application


    In our server implementation, we had the opportunity to implement observables
    from different sources and even implement a subject to push data.


    From the tests perspective, we decided to implement some basic tests only for
    our services; we did not want to have full coverage of our code, but the constructs
    and architecture of these tests can be easily replicated to create more tests
    for our services or even to implement new tests for the other layers of our application.


    Lastly, we learned how we can leverage Redis to communicate our servers application
    and we implemented a simple architecture to improve the scalability of our web
    chat. One important thing to notice, is how easy it was to introduce Redis to
    our application given the modular and decoupled architecture we used on our code.'
  merge: -1
  img_proc: true
- pgno: 272
  md: 'This is the last chapter, and in this chapter, we will implement the client
    application for our real-time web chat; in this chapter you will learn:


    +   - How to use RxJS in a client application

    +   - How to model the messages received from the server through the WebSocket
    connection

    +   - How to model inputs and the interactivity of users using functional reactive
    programming

    +   - How to implement tests for client applications using RxJS

    +   - Batch changes in the DOM to improve performance

    +   - Package and build our application


    For our web chat client we will not be using any **Single-Page Application (SPA)**
    framework; we will try to use the minimum number of libraries to implement our
    project. If you are using any specific framework, you can easily use the same
    constructs from this chapter in your personal projects.


    # Installing dependencies


    To implement the client application for our web chat application, we will try
    to keep the dependencies to the minimum required; we are doing so to encourage
    you to avoid abusing the use of the library on your application and also to show
    how powerful a well structured application using RxJS for functional reactive
    programming can be.


    To keep the code simple and avoid adding too many configurations, we are going
    to use **browserify** to bundle our client.


    The browserify is a bundler that lets us use commonJS when implementing client-side
    applications. This means we can import data from different files/modules using
    require in the same way you do on Node.js applications.


    To use browserify we must install it as a dependency in our application; to do
    this, we must run the following command on the folder of our application:


    ```

    npm i browserify@14.1.0 --save-dev

    ```


    With browserify, we can already bundle our application in a single JavaScript
    file.'
  merge: -1
  img_proc: true
- pgno: 273
  md: 'We will not add a minifier for our JavaScript file, because this is just a
    sample application, but, when creating a real-life application, always minify
    your JavaScript file before sending it to your users.


    To keep our application simple, we will also avoid using any CSS pre processor,
    and keep the style of the page to a minimum.


    ![](img/8a5c36d94dc308a2a0fcf45ffa9cc27f_273_0.png)


    You can use webpack or any other bundler on this application, and it is a good
    exercise for you to improve it at the end, making it as production-ready as it
    can be.


    We will be using the same code base from the server application, so we do not
    need to install RxJS again as it was installed in the previous chapter. To implement
    our code, we will need only one more library, which is the socket.io-client.


    We will use this client to connect using WebSocket and also send and receive messages
    from our server.


    To install socket.io-client we must run the following code on the folder containing
    our application:


    ```

    npm i socket.io-client@1.7.3 -save

    ```


    Now that we have what we need to implement our application, we must install the
    dependencies that we will use to test our application.


    # The structure of our client


    To implement our client application, we will create two folders in our project;
    the first is called static and it will contain the HTML page of our client and
    the built JavaScript file, the second will be called client and it will contain
    the JavaScript source code for our client application.


    In the static folder, create a file called index.html, which will be the base
    HTML of our client, and paste the following code:


    ```

    <!doctype html>

    <html>

    <head>

    <title>Reactive chat</title>

    <style>

    * { margin: 0; padding: 0; box-sizing: border-box; }

    ```'
