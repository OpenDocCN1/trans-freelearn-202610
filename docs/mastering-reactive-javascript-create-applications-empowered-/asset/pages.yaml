    # The skip() operator


    The skip() operator returns an Observable which bypasses a given number of elements
    from the beginning and propagates the others until the completion of the Observable.
    It has the following signature:


    ```

    observable.skip(count);

    ```


    The only parameter is mandatory:


    +   - count: This is the number of elements to bypass'
