    ![](img/8a5c36d94dc308a2a0fcf45ffa9cc27f_48_0.png)\n\nThe log() method is especially\
    \ useful for debug purposes and to test and see how an operator works. It is the\
    \ fastest way to see an operator in action.\n\n# Subscribing using the assign\
    \ method\n\nThe assign() method lets you call a function on an object every time\
    \ an event occurs. It is especially useful to set the content of DOM elements.\
    \ You can use it to set the value of a DOM object class using jQuery:\n\n```\n\
    ```\nobservable\n    .assign($(\"#myElement\"), \"class\");\n```\n```"
