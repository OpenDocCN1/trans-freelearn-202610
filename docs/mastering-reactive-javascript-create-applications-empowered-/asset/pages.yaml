  md: '# Summary


    In this chapter, you learned the basics of functional reactive programming using
    the `bacon.js` library. We wanted to give you the taste of functional reactive
    programming and also get your hands dirty with a lot of different examples.


    You learned about observables and the different types of observables that bacon.js
    has implemented. You also learned about some of the built-in methods that help
    you create observables in bacon.js and also how you can create your own observable
    using the `fromBinder()` method.


    Apart from this, you also learned how to subscribe and unsubscribe from an observable,
    how to use operators to transform an observable, and the importance of reuse in
    this context.


    In the next chapter, we will start using RxJS as it gives us more tools for functional
    reactive programming. We will see how it compares with bacon.js and understand
    the basics of this new tool.'
