    \nNotice that the transducer passed as an argument to the transduce operator is\
    \ the same transducer used to apply transformations in an array in the previous\
    \ section; we can even use the same transducer in two different objects, as can\
    \ be seen in the following code:\n\n```\nvar mapTransducer = t.map((i)=>i+1);\n\
    \nRx.Observable\n.of(1,2,3,4)\n.transduce(mapTransducer)\n.subscribe((i)=>console.log(i));\n\
    \nvar resultArray = t.into(\n  [],\n  mapTransducer,\n  [1,2,3,4]\n);\nconsole.log(resultArray);\n\
    ```"
