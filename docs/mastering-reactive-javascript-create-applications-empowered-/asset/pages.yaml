- pgno: 124
  md: "All methods for buffering data start with buffer in the name (here we will\
    \ learn bufferWithCount(), bufferWithTime(), and bufferWithTimeOrCount()), and\
    \ basically they will store data in memory until the buffer is fulfilled and propagates\
    \ an array containing the data.\n\n![](img/8a5c36d94dc308a2a0fcf45ffa9cc27f_124_0.png)\n\
    \nIf an error message is propagated by the observable, this message will be sent\
    \ immediately without first emitting the buffer, even if the buffer contains data.\n\
    \n# The bufferWithCount() operator\n\nThe first method to buffer data is bufferWithCount().\
    \ The bufferWithCount() method lets you specify the size of the buffer. With this\
    \ method, the data will be stored in an array until the size of this array reaches\
    \ the given count, upon which this array is propagated.\n\nThe bufferWithCount()\
    \ method has the following signature:\n\n```\nobservable.bufferWithCount(size,\
    \ [skip]);\n```\n\nThe first parameter is mandatory and the second is optional:\n\
    \n+   - size: This is a number specifying the size of the buffer.\n+   - skip:\
    \ This is a number specifying how many items we should skip to create the next\
    \ buffer. If not provided, it defaults to the size (this way the next buffer will\
    \ contain only new elements).\n\nNow let's see an example of this method:\n\n\
    ```\nRx.Observable\n  .interval(50)\n  .bufferWithCount(2)\n  .subscribe((arr)=>console.log(arr));\n\
    ```\n\nIn this example, we first create an Observable from an interval of 50 milliseconds.\
    \ We then use the bufferWithCount() method to buffer it in chunks of 10, and finally\
    \ we print it to the console.\n\nIf you run this code, you will see the following\
    \ output:\n\n```\n[ 0, 1]\n[2, 3]\n//continues printing until you stop the program\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 125
  md: "This operation is illustrated in the following diagram:\n\n![](img/8a5c36d94dc308a2a0fcf45ffa9cc27f_125_0.png)\n\
    \nNow let's see what happens if an error is propagated in our `buffer`. For this,\
    \ let's create a `subject`:\n\n```\nvar subject = new Rx.Subject();\n\nvar bufferedObservable\
    \ = subject.bufferWithCount(2);\n\nbufferedObservable.subscribe(\n  (i)=>console.log(i),\n\
    \  (err)=>console.log('An error happened ' + err.message),\n  ()=>console.log('Finished')\n\
    );\n\nsubject.onNext(0);\nsubject.onNext(1);\nsubject.onNext(2);\n\nsubject.onError(new\
    \ Error(':('));\n\nsubject.onNext(3);\nsubject.onCompleted();\n```\n\nIn this\
    \ example, we first create a `subject` and use the `bufferWithCount()` to create\
    \ chunks of two items and subscribe to it. We then push three values (0, 1, and\
    \ 2). The first two (0 and 1) will be propagated and printed in the console, the\
    \ third is buffered, until an error is pushed into the `subject`. This makes the\
    \ error go directly through the observable."
  merge: -1
  img_proc: true
- pgno: 126
  md: "If you run this code, you will see the following output:\n\n```\n[ 0, 1 ]\n\
    An error happened :(\n```\n\nNow, you might be wondering what happens if an observable\
    \ finish and the count doesn't reach the desired count. To test it, we can use\
    \ a simple program:\n\n```\nRx.Observable\n  .of(0,1,2,3,4)\n  .bufferWithCount(2)\n\
    \  .subscribe((i)=> console.log(i));\n```\n\nIf you run this code, you will see\
    \ the following output:\n\n```\n[ 0, 1 ]\n[ 2, 3 ]\n[ 4 ]\n```\n\nSo, as you can\
    \ see, if the original observable finishes, RxJS will flush the current buffer.\n\
    \nLet's see now how the second parameter works, comparing the two subscriptions:\n\
    \n```\nvar observable = Rx.Observable.interval(1000);\n\nvar observableWithDefaultSkip\
    \ = observable.bufferWithCount(4);\nvar observableWithSkipOne = observable.bufferWithCount(4,1);\n\
    \nobservableWithDefaultSkip.subscribe((arr)=>console.log('with default skip :'+arr));\n\
    observableWithSkipOne.subscribe(\n  (arr)=>console.log('with default skip equals\
    \ to one:'+arr)\n);\n```\n\nIf you run this code (and wait a little bit), you\
    \ will see an output as follows:\n\n```\nwith default skip :0,1,2,3\nwith default\
    \ skip equals to one:0,1,2,3\nwith default skip equals to one:1,2,3,4\nwith default\
    \ skip equals to one:2,3,4,5\nwith default skip equals to one:3,4,5,6\nwith default\
    \ skip :4,5,6,7\nwith default skip equals to one:4,5,6,7\n//continues printing\
    \ until you stop the program\n```"
  merge: -1
  img_proc: true
- pgno: 127
  md: "As you can see by the output, if you don't provide the skip value, the buffer\
    \ is basically erased after being propagated. This way it runs only every 4 seconds\
    \ (as our original observable pushes the value every second, it takes 4 seconds\
    \ to fill four items in the array), but if you provide a skip value, it will remove\
    \ this amount of items (from left to right) and always push new values in the\
    \ end of the array. This way it runs every second (because our buffer always keeps\
    \ three items from the last buffer, it takes only 1 second to fill the array).\n\
    \nAnd finally, one useful application of the bufferWithCount() method is to calculate\
    \ the average of the last X numbers in the sequence. To show this application,\
    \ let's first create an Observable to generate random numbers:\n\n```\n```javascript\n\
    var randomNumbersGenerator = Rx.Observable\n    .interval(100)\n    .map((i)=>Math.floor(Math.random()*100));\n\
    ```\n```\n\nHere we create an Observable to generate items every 100 milliseconds.\
    \ We then map it to an integer value between 0 and 99.\n\nNow let's calculate\
    \ the average of the last five items. To do this, we call the bufferWithCount()\
    \ method with a size of 5 and skip 1. Then we calculate the average and print\
    \ in the console.\n\nThe full code is as follows:\n\n```\n```javascript\nvar randomNumbersObservable\
    \ = Rx.Observable\n    .interval(100)\n    .map((i)=>Math.floor(Math.random()*100));\n\
    \nrandomNumbersObservable\n    .bufferWithCount(5,1)\n    .map((arr)=>{\n    \
    \    var sum = arr.reduce((acc,b)=>acc+b);\n        return sum/arr.length;\n \
    \   })\n    .subscribe((i)=>console.log('The average of the last five items is:\
    \ '+i));\n```\n```"
  merge: -1
  img_proc: true
- pgno: 128
  md: "If you run this code, you will see an output as follows (the value may vary\
