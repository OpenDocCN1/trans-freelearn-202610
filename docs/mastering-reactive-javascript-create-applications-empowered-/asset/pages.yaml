- pgno: 157
  md: '# Using the concatAll() operator


    This operator is analogous to the concat() operator, but it concatenates all observables
    inside an observable. This operator has the following signature:


    ```

    observable.concatAll();

    ```


    As you can see, it does not receive any parameter as it will concatenate all observable
    within an observable. This behavior can be seen in the following example:


    ```

    Rx.Observable.of(

    Rx.Observable.just(1),

    Rx.Observable.fromPromise(Promise.resolve(2)),

    Rx.Observable.of(3,4)

    ).concatAll()

    .subscribe((k)=>console.log(k));

    ```


    In this example, we create an Observable using the of() method, containing three
    observables. The first only emits the value 1, the second only emits the value
    2 (using a Promise), and the third emits two values 3 and 4. We then use the method
    concatAll() to generate a single Observable that emits four values. So, if we
    run this code we will see the following output in your console:


    +   1

    +   2

    +   3

    +   4


    ![](img/8a5c36d94dc308a2a0fcf45ffa9cc27f_157_0.png)


    This method follows the same rules from the concat() method, so it will follow
    the observables order and if you have an infinite observable in your sequence,
    the next observable will never be executed.


    # Using the mergeAll() operator


    This method is analogous to the concatAll() operator following the merge() operator
    rules. So it merges all observables within an observable. It has the following
    signature:


    ```

    observable.mergeAll();

    ```'
  merge: -1
  img_proc: true
- pgno: 158
  md: "As you can see, it does not receive any parameter as it will merge all observables\
    \ within an observable. This behavior can be seen in the following example:\n\n\
    ```\nRx.Observable.of(\n  Rx.Observable.just(1),\n  Rx.Observable.fromPromise(Promise.resolve(2)),\n\
    \  Rx.Observable.of(3,4)\n).mergeAll()\n.subscribe((k)=>console.log(k));\n```\n\
    \nNow that we are using the mergeAll() operator instead of the concatAll() operator,\
    \ it will follow the order of the propagated data, and as we have an Observable\
    \ from a Promise, its value will be delayed (because the promise is asynchronous)\
    \ and the other values will be propagated first, so it will print the following\
    \ output in your console:\n\n1\n3\n4\n2\n\n# Combining observables\n\nWe already\
    \ learned how we can create an observable containing all data from the other observables,\
    \ but we can also use some other operators to combine this data or choose between\
    \ them instead of just propagating everything.\n\n# Using the forkJoin() operator\n\
    \nThis operator lets you run multiple observables in parallel and propagates the\
    \ last elements of each one, so this operator is perfect for implementing flow\
    \ control for promises or callback operations in JavaScript, as we already discussed\
    \ in this chapter.\n\nThis operator has the following signature:\n\n```\nRx.Observable.forkJoin(observables);\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 159
  md: "This is a class() method instead of an instance() method, and it receives an\
    \ arbitrary number of arguments and the last is optional:\n\n+   - observables:\
    \ An arbitrary number of observable sequences to be executed\n\n![](img/8a5c36d94dc308a2a0fcf45ffa9cc27f_159_0.png)\n\
    \nIt can also accept a last argument to concatenate the items of the produced\
    \ array, but this is not a common use case as you can easily do it using the map()\
    \ operator over the array.\n\nThe forkJoin() operator preserves the order of the\
    \ observables and an example of this usage can be seen in the following code:\n\
    \n```\nRx.Observable\n  .forkJoin(\n    Rx.Observable.fromPromise(Promise.resolve(1)),\n\
    \    Rx.Observable.just(2)\n  ).subscribe((k)=>console.log(k));\n```\n\nIf you\
    \ run this code, you will see the following output:\n\n[ 1, 2 ]\n\nAs we discussed\
    \ previously, this operator propagates only the last value of each observable\
    \ sequence, which makes it perfect for promises and callbacks (which emit only\
    \ one value), but we can use it with any Observable.\n\nWe can change our code\
    \ to use an infinite Observable and see what happens:\n\n```\nRx.Observable\n\
    \  .forkJoin(\n    Rx.Observable.fromPromise(Promise.resolve(1)),\n    Rx.Observable.interval(100)\n\
    \  ).subscribe((k)=>console.log(k));\n```\n\nIf you run this code, you will see\
    \ nothing printed in the console and your program also never ends. This happens\
    \ because the second parameter is an infinite observable, so the forkJoin() operator\
    \ will wait for it to finish to propagate all values."
  merge: -1
  img_proc: true
- pgno: 160
  md: "We can change this code to take only a few elements from the infinite Observable.\
    \ This way it will finish:\n\n```\nRx.Observable\n  .forkJoin(\n    Rx.Observable.fromPromise(Promise.resolve(1)),\n\
    \    Rx.Observable.interval(100).take(5)\n  ).subscribe((k)=>console.log(k));\n\
    ```\n\nNow if you run this code, you will see the following output:\n\n[ 1, 4\
    \ ]\n\nThis contains the value 1 propagated by the first Observable and the value\
    \ 4, which is the last element (as we took 5 from the interval()) propagated by\
    \ the second Observable.\n\nThis operation can be described by the following diagram:\n\
    \n![](img/8a5c36d94dc308a2a0fcf45ffa9cc27f_160_0.png)"
  merge: -1
