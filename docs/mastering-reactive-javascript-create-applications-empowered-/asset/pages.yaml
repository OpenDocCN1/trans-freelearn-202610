- pgno: 167
  md: '# 7


    # Something is Wrong - Testing and Dealing with Errors


    In the last chapter we learned about a powerful tool to increase the reuse and
    readability of our code. This tool is a combination of observables to create new
    sources of data. We also learned how we can run multiple asynchronous observables
    in parallel.


    The most important operators we learned in the previous chapter are:


    +   - `concat()`

    +   - `merge()`

    +   - `forkJoin()`

    +   - `zip()`


    The use of this operators can help us to avoid code repetition, giving us one
    very important mantra for readable code: **Don''t Repeat Yourself (DRY)**.


    In this chapter, we will focus on two very important issues, not only for programs
    implemented using functional reactive programming, but for all programs:


    +   - Dealing with errors

    +   - Testing our code

    +     - We will see what happens to an observable when an error occurs and what
    we can do to treat this error and ensure our code keeps running as expected.'
  merge: -1
  img_proc: true
- pgno: 168
  md: "+   - On the other hand, one of the coolest things about functional reactive\
    \ programming is the ability to decouple the source of your data from the action\
    \ to be executed This makes our code more testable, as we can mock any part of\
    \ it.\n+   - In this chapter we will learn how to test programs on the browser\
    \ and in Node.js. For those without any familiarity with testing JavaScript code,\
    \ we will have a quick look at some frameworks for doing so.\n+   - As we advance\
    \ in this book the main idea is to make our examples more complex. We will see\
    \ this development in the test section, so take time to review the previous chapters\
    \ now, or anytime you see an operator you are not familiar with yet.\n\n# Dealing\
    \ with errors\n\nDetecting and treating errors in asynchronous code are hard tasks.\
    \ For synchronous code, we can use the famous try/catch/finally block. Treating\
    \ an exception with this block is easy, as can be seen in the following code:\n\
    \n```\ntry{\n    throw new Error('An error occurred');\n} catch(err) {\n    console.log('Treating\
    \ the error');\n} finally{\n    console.log('Last computation');\n}\n```\n\nUnfortunately,\
    \ we can't use the try/catch/finally on asynchronous code. In JavaScript we run\
    \ asynchronous code most of the time, so the language and the community elaborated\
    \ a couple of strategies.\n\nInitially, the only strategy we had available to\
    \ deal with asynchronous code was the use of callback functions, so most libraries\
    \ in JavaScript added the onSuccess() and onError() methods, which accepted a\
    \ callback function to be executed when an error happened or when data is available.\
    \ Different frameworks used different methods for doing so, for example, in jQuery\
    \ it was ajaxError() and ajaxSuccess(). The Node.js community saw the necessity\
    \ for standardizing this behavior (as this is really common in JavaScript), and\
    \ so the Node.js callback standard was created."
  merge: -1
  img_proc: true
- pgno: 169
  md: "This standard enforces the use of a single function, which receives two parameters\
    \ for asynchronous computation: the first is an error object (if an error happened)\
    \ and the second is the successful result (if it was a success). The callback\
    \ standard from node can still be seen in the core functions and in several libraries.\
    \ An example of this standard is available in the fs module, which is the module\
    \ from node that interacts with the file system:\n\n```\nvar fs = require('fs');\n\
    \nfs.readFile('this_file_doesnt_exist.txt',function(e,data){\n  if(e){\n    console.log('An\
    \ error happened');\n    return;\n  }\n  console.log(data);\n});\n```\n\n![](img/8a5c36d94dc308a2a0fcf45ffa9cc27f_169_0.png)\n\
    \nIf you have any prior experience with Node.js you are already be familiar with\
    \ this pattern.\n\nAs you probably know, using callbacks can lead to a problem\
    \ called callback hell, which happens when you have several callbacks running\
    \ inside each other, and which makes your code hard to understand. So, the Promise\
    \ object was created and this includes a catch() method to treat errors:\n\n```\n\
    new Promise(function(resolve,reject){\n  reject(new Error('An error occurred'));\n\
    }).catch(function(err){\n  console.log('Treating the error');\n});\n```\n\nIn\
    \ this code we have a failed Promise where the error is treated using the catch()\
    \ method. As you can see, none of these options are as easy as the standard try/catch/finally,\
    \ but such a solution is not yet available for asynchronous code, so we have to\
    \ use one of the available strategies.\n\n![](img/8a5c36d94dc308a2a0fcf45ffa9cc27f_169_1.png)\n\
    \nIn upcoming versions of JavaScript, we will have the async/await feature, which\
    \ will let us use the try/catch/finally block again."
