- pgno: 240
  md: '+   - How can we test programs using RxJS?

    +   - What is a transducer?


    With all this knowledge, you should feel capable of implementing your own application
    using functional reactive programming, but before you start a new application,
    I wanted to give you an example application using extensively functional reactive
    programming on both server and client.


    Our example application will consist of a client application to run in the browser
    and a server application to run on the node. On both I will show you the architecture
    of the application and the reasons to choose this architecture, along with code
    and tests for this code.


    A `web chat` is the perfect application to show the use of observables and RxJS
    as this is a highly interactive application. To create it we will use a **WebSocket
    server** to receive and deliver user messages.


    In this chapter, we will explore the following topics:


    +   - Implement a WebSocket-based server in JavaScript

    +   - Use observables to listen and deliver data to the `web chat` application
    clients

    +   - Create tests for our application

    +   - See how we could scale our application if needed, making it support a publish/subscriber
    server as Redis, to receive and deliver message to other servers


    # The web chat server


    To show the use of functional reactive programming and RxJS in JavaScript projects
    we will implement a web chat server. This is a perfect choice, because of the
    nature of this application.


    In web chats users are constantly sending and receiving message; on some implementations
    of chat servers you can even send commands to remove or block a user, set reminders,
    and other things right from the text box. So, it is really easy to see how messages
    can be modeled as data being propagated through an observable sequence and how
    it is important to distinguish messages coming from this channel (commands from
    user messages).


    There is also the possibility of implementing this server using WebSocket, which
    will also show us how RxJS is a perfect fit for any application using WebSockets.'
  merge: -1
  img_proc: true
- pgno: 241
  md: 'Last but not least, it is important to notice that a `web chat` application
    can be easy to implement, but it can become arbitrarily complex as you decide
    to create new features for it.


    For our web chat application, the idea is to keep it simple, but show you how
    you could implement more complex features. Our `web chat` application will have:


    +   - Broadcast messages

    +   - Private messages

    +   - Some commands

    +   - Tests


    ![](img/8a5c36d94dc308a2a0fcf45ffa9cc27f_241_0.png)


    Some features are common on chat applications, such as channels/rooms, but we
    will not implement these as you can implement them easily just deriving each from
    the implemented features. We also will not implement logins and passwords for
    users as it is completely beyond the scope of this book and would not give you
    any additional knowledge.


    # Creating the project


    We will implement the backend of our `web chat` application in the node, so the
    first thing is to create a folder to store our project and, inside this folder,
    start the project using the following command:


    ```

    npm init

    ```


    This command will ask you for a lot of metadata for the project. You can leave
    all the defaults in force, just hitting *Enter* until the end. After this we need
    to install some libraries we will use to implement our project; the first one
    is RxJS, and to install it you must type the following command:


    ```

    npm install rx@4.1.0 --save

    ```


    We also need a library to implement our WebSocket server: we will use the most
    famous library to implement WebSocket in JavaScript `socket.io` with the following
    command:


    ```

    npm install socket.io@1.7.3 --save

    ```


    We will use `express` to serve the HTML page of our client, so we need to install
    it:


    ```

    npm install --save express@4.15.2

    ```'
  merge: -1
  img_proc: true
- pgno: 242
  md: 'Lastly, we need a runner to execute the tests of our application, and for this
    we will install `mocha` with the following command:


    ```

    npm install mocha@3.2.0 --save-dev

    ```


    Inside your project folder, you should create two new folders: one called `src`
    where we will place the source code of our application, and the other called `tests`
    where we will place all the tests of our application.


    After this initial step, you should have your project folder containing a file
    called `package.json`, and three folders named `node_modules`, `src`, and `tests`.


    ![](img/8a5c36d94dc308a2a0fcf45ffa9cc27f_242_0.png)


    You can choose different names for your folders containing the source and tests,
    but this will be the name used in this book so, if you do change them, remember
    to change names when executing certain commands.


    # The architecture of the server


    To implement the features we described before, we will use a simple architecture,
    and we will need only three files on our source code.


    The first one is the `index.js` file containing the initialization of our WebSocket
    server and receiving the messages from the chat users; the data from each user
    will be implemented as an observable. All data passed through this observable
    will call the service responsible for that message, and the attribute `service`
    of each message will contain the name of the service.


    All services are going to be implemented in a single file, called `services.js`;
    each service in this file might return an observable and, in the case of an observable
    being returned, our client will start to listen to messages from that observable.
    Initially we will have only four services:


    +   - `sendMessage()`: This service sends message to the connected clients; it
    can be a private message or a broadcast message. The attribute of the message
    will contain the receiver of that message.

    +   - `listenToMessages()`: This service returns an observable containing all
    messages directed to that client.

    +   - `blockUser()`: This service returns an observable without the messages from
    the blocked user.'
  merge: -1
  img_proc: true
- pgno: 243
  md: '+   - `command()`: This service can be used to implement some commands. We
    will initially implement only two commands, one to show the current time to all
    users, and the other to echo your own messages. Using this method you can easily
    create new commands.


    Finally, the last part of your project is our data source, called data_source.js.
    For our first implementation, there is no reason to save or retrieve data to a
    database, as this is just a sample application and we do not want to keep a history
    of messages or any other features that need a database. So, our data source will
    consist of only one observable (actually a subject) where we can push and listen
    to data.


    If we needed to keep a history we could easily add a MongoDB, or any other database,
    to our application to retrieve this message history.


    After our initial implementation, we will add a Redis server to use it to communicate
    messages through our servers.


    This diagram describes how communication works on our server:


    ![](img/8a5c36d94dc308a2a0fcf45ffa9cc27f_243_0.png)'
