    As expected, the values of the observable sequence are printed one by one, containing
    the original values plus 1 and the array sequence is also printed containing the
    original values of the array plus 1, without any error. This shows the versatility
    of transducers as they can be used in different data structures without any change.


    We can also use composition with transducers in RxJS, using the following code:


    ```

    var mapTransducer = t.map((i)=>i+1);

    var filterTransducer = t.filter((i)=>i%2===0);

    var composedTransducer = t.comp(mapTransducer,filterTransducer);


    Rx.Observable

    .of(1,2,3,4)

    .transduce(composedTransducer)

    .subscribe((i)=>console.log(i));

    ```


    As you can see, the transducer is composed in exactly the same way as it was in
    the array examples, and we use the composedTransducer on the transduce() operator
    to run it over the observable.


    The execution of this code gives us the following output:


    ```

    2

    4

    ```'
