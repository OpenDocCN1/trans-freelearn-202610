- pgno: 192
  md: 'We will start reviewing what we have learned so far, since some of the next
    operators are a little bit harder to understand and some are basically a derivation
    of other operators; after that we will delve into some new operators.


    This chapter will prepare you to be an advanced user of functional reactive programming,
    after this chapter you will learn how to compose operators and create a client-server
    chat application using the tools that we have gathered from this book.


    So it''s really important that you have a good knowledge of what we have learned
    so far.


    # The road so far


    In previous chapters we learned a lot about functional reactive programming and
    how we can use it to improve the readability and maintainability of our code;
    we used two different libraries so:


    +   - bacon.js

    +   - RxJS


    We started with bacon.js because it is simpler to learn and to start creating
    reactive codes, but after this introduction we explored RxJS as it implements
    other concepts that we can use to improve our applications.


    These two libraries are not the only available libraries for functional reactive
    programming in JavaScript, but by understanding them, you can probably learn some
    of the others libraries available with ease.


    Another advantage of RxJS over the other libraries for functional reactive programming
    in JavaScript is its being an implementation of the Rx specification. You can
    find this implementation for several other languages and platforms such as RxJava
    and RxSwift for instance, so a good understanding of functional reactive programming
    and RxJS can improve your code skills in other platforms.


    Now, before we go even further into more advanced concepts and examples of RxJS,
    it''s important to make sure that the concepts from the previous chapters created
    a solid foundation in your mind so we can keep going. Feel free to read some of
    the chapters or sections again if you do not feel comfortable, and stay alert
    for the next section as it will contain the most basic information that you must
    have to create your own programs with functional reactive programming.'
