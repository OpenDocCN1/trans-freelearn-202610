    # Summary


    In this chapter, we learned how to deal with massive amounts of data. We called
    this the problem of backpressure. We can use two different approaches to deal
    with backpressure: lossy strategies and loss-less strategies.


    We also learned about the advantages and disadvantages of each approach, and also
    which operators we can use to mitigate them.


    At the end of the chapter, we also received more tools to query for data in our
    observables, such as the `first()` operator, some `take()` operators, and some
