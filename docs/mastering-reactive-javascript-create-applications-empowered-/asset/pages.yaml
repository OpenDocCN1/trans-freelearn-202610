- pgno: 63
  md: '# 3


    # A World Full of Changes - Reactive Extensions to the Rescue


    In the previous chapter, you learned the very basics of functional reactive programming,
    using the `bacon.js` library. We discussed what is an observable and saw two different
    flavors of it in the `bacon.js` library (EventStream and Property). We also looked
    at how to create observables from common event sources (interval, array, or user
    input) and even from any other possible source ( using the `fromBinder()` method).


    After an introduction to observables, we looked at how to subscribe to it. You
    can react to events, errors, or even detect the end of an observable when you
    subscribe to it. So, you learned how to create an observer for your observables.


    One of the really important lessons from the previous chapter was the usage of
    diagrams to explain how observables and operators occur, along with text explanations
    and example code. Understanding diagrams is the key to understanding the behavior
    of operators and observables; you will see a lot of diagrams throughout the book.
    Read this section with special attention. Read it again in case you''re not comfortable
    with it yet, but don''t be afraid if it seems complicated (it seemed that way
    to me the first time I saw it). You will keep seeing it with text explanations
    and will eventually learn how it works.'
  merge: -1
  img_proc: true
- pgno: 64
  md: 'The previous chapter added a lot of new concepts to your toolbox, and one of
    these was operators. The usage of operators to transform your events into something
    completely new gives you the taste of functional reactive programming and lets
    you see how powerful and composable it is. If you liked the initial operators
    you used, then be happy; we will see a lot more operators in the upcoming chapters.
    Operators are the backbone of functional reactive programming and they help you
    write cleaner, concise, and testable code with ease.


    Finally, we saw the laziness of observables in the bacon.js library. We will talk
    about the behavior of observables in RxJS in this chapter, so don''t worry.


    This chapter will introduce you to the world of Reactive Extensions. In this book,
    we will base our implementation on RxJS. However, Reactive Extensions is an agnostic
    framework (this means it has implementations for several languages), so a lot
    of the concepts described here can be used in other platforms (such as RxJava,
    RxSwift, and so on). This makes learning Reactive Extensions (and functional reactive
    programming) really useful, as you can use it to improve your code in different
    platforms.


    The focus in this chapter is to teach you the different types of observables possible
    in the RxJS world. You will see that they differ a little bit from the observables
    of bacon.js but are easy to use. You will also learn how to react to events in
    our observables using observers and how to finish your observers.


    This chapter will cover the following points:


    +   - The different types of observables in the context of Reactive Extensions
    and the difference between them

    +   - Using the RxJS API to create observables

    +   - Reacting to events in our observables

    +   - Reacting to errors in our observables


    # RxJS observables


    RxJS lets you have even more control over the source of your data. In this section,
    we will learn the differences between RxJS Observables and bacon.js EventStreams
    and Properties. We will also learn some different flavors of Observables and how
    we can better control their life cycle.'
  merge: -1
  img_proc: true
- pgno: 65
  md: '# Difference between bacon.js and RxJS observables


    In Chapter 2, *Reacting for the First Time*, you learned that an observable is
    basically an abstraction over possible asynchronous data. The observable gives
    you the power to transform data using different operators and take an action when
    a piece of new data becomes available, using a subscriber. The `bacon.js` library
    uses the term **subscriber** to the object listening to incoming data, but on
    Reactive Extensions, we will use a different term; we will call it Observer.


    Conceptually, there is no difference between the two. Basically, it was just names
    chosen by the developers of both libraries; however, it is important that you''re
    aware of both the names as you will see both being used in the documentation of
    the libraries.


    In bacon.js, we saw two different flavors of observables:


    +   - EventStreams

    +   - Properties


    In RxJS, we will always talk about:


    +   - Observables

    +   - Observers


    ![](img/8a5c36d94dc308a2a0fcf45ffa9cc27f_65_0.png)


    In this chapter, you will also learn more about three special objects in RxJS.
    They are called Subject, Disposable, and Scheduler.


    # Hot and cold observables


    In bacon.js, an observable only emits a value when a subscriber subscribes to
    it; therefore, we will call it a cold observables. In Reactive Extensions, things
    can become a little trickier: we have both hot and cold observables.


    A hot observable is an observable that propagates the data independently, irrespective
    of whether we have some Observer attached to it or not. An example of a hot observable
    is an observable created from mouse movements.


    A cold observable, on the other hand, is an observable that fires the same sequence
    for all the subscribers. An example of a cold observable is an observable created
    from an array.'
  merge: -1
  img_proc: true
- pgno: 66
  md: 'This behavior is important to understand, and RxJS has special methods to replay
    events in a hot observable or turn a cold observable into a hot observable.


    # Installing RxJS


    RxJS is divided into modules. This way, you can create your own bundle with only
    the modules you''re interested in. In this book, we will always use the official
    bundle with all the contents from RxJS; by doing so, we''ll not have to worry
    about whether a certain module exists in our bundle or not. So, let''s follow
    the steps described here to install RxJS.


    To install it on your server, just run the following command inside a node project:


    ```

    npm i rx@4.1.0 -save

    ```


    To add it to a HTML page, just paste the following code snippet inside your HTML:


    ```

    <script src="https://cdnjs.cloudflare.com/ajax/libs/rxjs/4.1.0/rx.all.js">

    </script>

    ```


    ![](img/8a5c36d94dc308a2a0fcf45ffa9cc27f_66_0.png)


    For those using other package managers, you can install RxJS from Bower or NuGet.


    If you''re running inside a node program, you need to have the RxJS library in
    each JavaScript file that you want to use. To do this, add the following line
    to the beginning of your JavaScript file:


    ```

    var Rx = require(''rx'');

    ```


    The preceding line will be omitted in all examples, as we expect you to have added
    it before testing the sample code.


    # Creating an observable


    Here we will see a list of methods to create an observable from common event sources.
    This is not an exhaustive list, but it contains the most important ones.'
  merge: -1
  img_proc: true
- pgno: 67
  md: "# Creating an observable from iterable objects\n\nYou can see all the available\
    \ methods on the RxJS GitHub page (https://github.com/Reactive-Extensions/RxJS).\n\
    \nWe can create an observable from iterable objects using the from() method. An\
    \ iterable in JavaScript can be an array (or an array-like object) or other iterates\
    \ added in ES6 (such as Set() and map()). The from() method has the following\
    \ signature:\n\n```\nRx.Observable.from(iterable, [mapFunction], [context], [scheduler]);\n\
    ```\n\nUsually, you will pass only the first argument. Others arguments are optional;\
    \ you can see them here:\n\n+   - iterable: This is the iterable object to be\
    \ converted into an observable (can be an array, set, map, and so on)\n+   - mapFunction:\
    \ This is a function to be called for every element in the array to map it to\
    \ a different value\n+   - context: This object is to be used when mapFunction\
    \ is provided\n+   - scheduler: This is used to iterate the input sequence\n\n\
    Don't worry if you don't know what a scheduler is. We will see how it changes\
    \ our observables, but we will discuss it later in this chapter. For now, focus\
    \ only on the other arguments of this function.\n\nNow let's see some examples\
    \ on how we can create observables from iterables.\n\nTo create an observable\
    \ from an array, you can use the following code:\n\n```\nRx.Observable\n  .from([0,1,2])\n\
    \  .subscribe((a)=>console.log(a));\n```\n\nThis code prints the following output:\n\
    \n0\n1\n2"
  merge: -1
  img_proc: true
- pgno: 68
  md: "Now let's introduce a minor change in our code, to add the mapFunction argument\
    \ to it, instead of creating an observable to propagate the elements of this array.\
    \ Let's use mapFunction to propagate the double of each element of the following\
    \ array:\n\n```\nRx.Observable\n  .from([0,1,2],  (a) => a*2)\n  .subscribe((a)=>console.log(a));\n\
    ```\n\nThis prints the following output:\n\n```\n0\n2\n4\n```\n\nWe can also use\
    \ this method to create an observable from an arguments object. To do this, we\
    \ need to run from() in a function. This way, we can access the arguments object\
    \ of the function. We can implement it with the following code:\n\n```\nvar observableFromArgumentsFactory\
    \ = function(){\n  return Rx.Observable.from(arguments);\n};\nobservableFromArgumentsFactory(0,1,2)\n\
    \  .subscribe((a)=>console.log(a));\n```\n\nIf we run this code, we will see the\
    \ following output:\n\n```\n0\n1\n2\n```\n\nOne last usage of this method is to\
    \ create an observable from either Set() or Map(). These data structures were\
    \ added to ES6. We can implement it for a set as follows:\n\n```\nvar set = new\
    \ Set([0,1,2]);\nRx.Observable\n  .from(set)\n  .subscribe((a)=>console.log(a));\n\
    ```\n\nThis code prints the following output:\n\n```\n0\n1\n2\n```"
  merge: -1
  img_proc: true
- pgno: 69
  md: "We can also use a map as an argument for the from() method, as follows:\n\n\
    ```\nvar map = new Map([['key0',0],['key1',1],['key2',2]]);\nRx.Observable\n \
    \ .from(map)\n  .subscribe((a)=>console.log(a));\n```\n\nThis prints all the key-value\
    \ tuples on this map:\n\n```\n[ 'key0', 0 ]\n[ 'key1', 1 ]\n[ 'key2', 2 ]\n```\n\
    \nAll observables created from this method are cold observables. As discussed\
    \ before, this means it fires the same sequence for all the observers. To test\
    \ this behavior, create an observable and add an Observer to it; add another observer\
    \ to it after a second:\n\n```\nvar observable = Rx.Observable.from([0,1,2]);\n\
    \nobservable.subscribe((a)=>console.log('first subscriber receives => '+a));\n\
    \nsetTimeout(()=>{\n    observable.subscribe((a)=>console.log('second subscriber\
    \ receives => '+a));\n},1000);\n```\n\nIf you run this code, you will see the\
    \ following output in your console, showing both the subscribers receiving the\
    \ same data as expected:\n\n```\nfirst subscriber receives => 0\nfirst subscriber\
    \ receives => 1\nfirst subscriber receives => 2\nsecond subscriber receives =>\
    \ 0\nsecond subscriber receives => 1\nsecond subscriber receives => 2\n```\n\n\
    # Creating an observable from a sequence factory\n\nNow that we have discussed\
    \ how to create an observable from a sequence, let's see how we can create an\
    \ observable from a sequence factory. RxJS has a built-in method called generate()\
    \ that lets you create an observable from an iteration (such as a for() loop).\
    \ This method has the following signature:\n\n```\nRx.Observable.generate(initialState,\
    \ conditionFunction, iterationFunction, resultFactory, [scheduler]);\n```"
  merge: -1
  img_proc: true
- pgno: 70
  md: "In this method, the only optional parameter is the last one. A brief description\
    \ of all the parameters is as follows:\n\n+   - `initialState`: This can be any\
    \ object, it is the first object used in the iteration\n+   - `conditionFunction`:\
    \ This is a function with the condition to stop the iteration\n+   - `iterationFunction`:\
    \ This is a function to be used on each element to iterate\n+   - `resultFactory`:\
    \ This is a function whose return is passed to the sequence\n+   - `scheduler`:\
    \ This is an optional scheduler\n\nBefore checking out an example code for this\
    \ method, let's see some code that implements one of the most basic constructs\
    \ in a program: a `for()` loop. This is used to generate an array from an initial\
    \ value to a final value. We can produce this array with the following code:\n\
    \n```\nvar resultArray=[];\nfor(var i=0;i < 3;i++){\n    resultArray.push(i)\n\
    }\nconsole.log(resultArray);\n```\n\nThis code prints the following output:\n\n\
    ```\n[0,1,2]\n```\n\nWhen you create a `for()` loop, you basically give to it\
    \ the following: an initial state (the first argument), the condition to stop\
    \ the iteration (the second argument), how to iterate over the value (the third\
    \ argument), and what to do with the value (block). Its usage is very similar\
    \ to the `generate()` method. Let's do the same thing, but using the `generate()`\
    \ method and creating an observable instead of an array:\n\n```\nRx.Observable.generate(\n\
    \    0,\n    (i) => i<3,\n    (i) => i+1,\n    (i) => i\n).subscribe((i) => console.log(i));\n\
    ```\n\nThis code will print the following output:\n\n```\n0\n1\n2\n```"
  merge: -1
  img_proc: true
- pgno: 71
  md: "# Creating an observable using range ()\n\nAnother common source of data for\
    \ observables are ranges. With the range() method, we can easily create an observable\
    \ for a sequence of values in a range. The range() method has the following signature:\n\
    \n```\nRx.Observable.range(first, count, [scheduler]);\n```\n\nThe last parameter\
    \ in the following list is the only optional parameter in this method:\n\n+  \
    \ - `first`: This is the initial integer value in the sequence\n+   - `count`:\
    \ This is the number of sequential integers to be iterated from the beginning\
    \ of the sequence\n+   - `scheduler`: This is used to generate the values\n\n\
    We can create an observable using a range with the following code:\n\n```\nRx.Observable\n\
    \  .range(0, 4)\n  .subscribe((i)=>console.log(i));\n```\n\nThis prints the following\
    \ output:\n\n```\n0\n1\n2\n3\n```\n\n# Creating an observable using period of\
    \ time\n\nIn the previous chapter, we discussed how to create timed sequences\
    \ in bacon.js. In RxJS, we have two different methods to implement observables\
    \ emitting values with a given interval. The first method is interval(). This\
    \ method emits an infinite sequence of integers starting from one every x milliseconds;\
    \ it has the following signature:\n\n```\nRx.Observable.interval(interval, [scheduler]);\n\
    ```\n\nThe interval parameter is mandatory, and the second argument is optional:\n\
    \n+   - `interval`: This is an integer number to be used as the interval between\
    \ the values of this sequence\n+   - `scheduler`: This is used to generate the\
    \ values"
  merge: -1
  img_proc: true
- pgno: 72
  md: "Run the following code:\n\n```\nRx.Observable\n  .interval(1000)\n  .subscribe((i)=>\
    \ console.log(i));\n```\n\nYou will see an output as follows; you will have to\
    \ stop your program (hitting Ctrl+C) or it will keep sending events:\n\n0\n1\n\
    2\n\nThe interval() method sends the first value of the sequence after the given\
    \ period of interval and keeps sending values after each interval.\n\nRxJS also\
    \ has a method called timer(). This method lets you specify a due time to start\
    \ the sequence or even generate an observable of only one value emitted after\
    \ the due time has elapsed. It has the following signature:\n\n```\nRx.Observable.timer(dueTime,\
    \ [interval], [scheduler]);\n```\n\nHere are the parameters:\n\n+   - dueTime:\
    \ This can be a date object or an integer. If it is a date object, then it means\
    \ it is the absolute time to start the sequence; if it is an integer, then it\
    \ specifies the number of milliseconds to wait for before you could send the first\
    \ element of the sequence.\n+   - interval: This is an integer denoting the time\
    \ between the elements. If it is not specified, it generates only one event.\n\
    +   - scheduler: This is used to produce the values.\n\nWe can create an observable\
    \ from the timer() method with the following code:\n\n```\nRx.Observable\n  .timer(1000,500)\n\
    \  .subscribe((i)=> console.log(i));\n```\n\nYou will see an output that will\
    \ be similar to the following; you will have to stop your program or it will keep\
    \ sending events:\n\n0\n1\n2"
  merge: -1
  img_proc: true
- pgno: 73
  md: "We can also use this method to generate only one value and finish the sequence.\
    \ We can do this omitting the interval parameter, as shown in the following code:\n\
    \n```\nRx.Observable\n.timer(1000)\n.subscribe((i)=> console.log(i));\n```\n\n\
    If you run this code, it will only print 0 in your console and finish.\n\n# Creating\
    \ an observable from callbacks\n\nIn JavaScript, we have a lot of APIs that use\
    \ callbacks to let you control the flow of the application. We can use functional\
    \ reactive programming to have better control of it. We can use observables to\
    \ wrap callbacks (following the Node.js callback pattern). This way, we can reuse\
    \ and compose these callbacks.\n\nTo do so, we can use the fromCallback() method.\
    \ It has the following signature:\n\n```\nRx.Observable.fromCallback(func,[context],[selector]);\n\
    ```\n\nThe first argument is mandatory and the next two are optional. They are\
    \ as follows:\n\n+   - func: This is the function that usually receives a callback\
    \ when it finishes\n+   - context: This is the context to be used in the callback\n\
    +   - selector: This is a function that takes the arguments from the callback\
    \ to produce a single item to be propagated by this observable\n\nBefore showing\
    \ examples of the usage of this method, let's create our own function accepting\
    \ a callback function, as follows:\n\n```\nvar myAsyncComputation = function(name,callback){\n\
    \  setTimeout(()=>{\n    callback(null,'Finished computation for '+name);\n  },100);\n\
    };\n```\n\nThe myAsyncComputation variable holds a function that accepts a callback\
    \ function. It calls this callback function after 100 milliseconds with a success\
    \ message: Finished computation for SOME_NAME. To test our function, we can just\
    \ call it in the following way:\n\n```\nmyAsyncComputation('John Doe',(err,result)=>console.log(result));\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 74
  md: "This will print the `Finished computation for John Doe` message.\n\n![](img/8a5c36d94dc308a2a0fcf45ffa9cc27f_74_0.png)\n\
    \nRemember, callbacks can receive two parameters: the first is `error` (if any\
    \ error has occurred) and the second is `result`, representing the result of the\
    \ asynchronous computation made by the function.\n\nNow let's create an observable\
    \ for our asynchronous function, as follows:\n\n```\n```\nvar observableFromCallback\
    \ =\nRx.Observable.fromCallback(myAsyncComputation);\n\nobservableFromCallback('John\
    \ Doe')\n    .subscribe((result)=> console.log(result));\n```\n```\n\nIf you run\
    \ this code, you will see the following message printed on the console:\n\n```\n\
    ```\n[ null, 'Finished computation for John Doe' ]\n```\n```\n\nThis happens because\
    \ as we discussed, a callback receives two arguments: the first is the error (if\
    \ any) and the second is the successful result. If we don't want to propagate\
    \ both the values, we can use the selector parameter from the `fromCallback()`\
    \ method to map the response in a different way:\n\n```\n```\nvar observableFromCallback\
    \ = Rx.Observable.\n    fromCallback(myAsyncComputation, null, (error,result)=>result);\n\
    observableFromCallback('John Doe')\n    .subscribe((result)=> console.log(result));\n\
    ```\n```\n\nNow we added an argument to omit the error, so when we run this code,\
    \ we will see the following output:\n\n```\n```\nFinished computation for John\
    \ Doe\n```\n```\n\n# Creating an observable from a promise\n\nThe promises are\
    \ objects that hold the result of an asynchronous computation. They are becoming\
    \ more common now. One of the cool things about promises is that you can compose\
    \ them with other promises or synchronous values, giving you an extra layer of\
    \ abstraction over asynchronous computations. We can wrap a promise into an observable.\
    \ This provides us a lot more power to handle the result of our computation using\
    \ the operators from RxJS."
  merge: -1
  img_proc: true
- pgno: 75
  md: 'To do this, we can use the `fromPromise()` built-in method. This method can
    turn any A+ Promise into an observable.


    ![](img/8a5c36d94dc308a2a0fcf45ffa9cc27f_75_0.png)


    Promises/A+ is a specification of promises. All the famous promises libraries
    in JavaScript follow this pattern; it is the same pattern followed by the standard
    ES6 promise.


    This method has the following signature:


    ```

    Rx.Observable.fromPromise(promise);

    ```


    It receives only one parameter:


    +   - `promise`: This is a Promises/A+ object or a factory function that returns
    an A+ Promise object.


    To create an observable from a promise, use the following code:


    ```

    Rx.Observable

    .fromPromise(Promise.resolve(''Hello World''))

    .subscribe((result)=> console.log(result));

    ```


    This prints the following output:


    ```

    Hello World

    ```


    We can also use this method to create an observable from a factory function returning
    a promise, as you can see in the following code:


    ```

    var promiseFactory = () => Promise.resolve(''Hello World'')

    Rx.Observable

    .fromPromise(promiseFactory)

    .subscribe((result)=> console.log(result));

    ```


    When you run this code, you will see the following output:


    ```

    Hello World

    ```


    # Creating empty observables


    Sometimes, when composing multiple observables, you might need to create an empty
    observable. You can do this in RxJS using two different methods. The first one
    is the `empty()` method; this method will only fire an `onComplete` event.'
  merge: -1
  img_proc: true
- pgno: 76
  md: "The following code creates an observable that finishes and doesn't propagate\
    \ any value:\n\n```\nRx.Observable.empty();\n```\n\nSometimes you might need an\
    \ observable that wouldn't emit any value and would never terminate. To create\
    \ this kind of observable, you can use the never() method:\n\n```\nRx.Observable.never();\n\
    ```\n\n![](img/8a5c36d94dc308a2a0fcf45ffa9cc27f_76_0.png)\n\nThese two methods\
    \ are used more for composition or as a fallback to prevent the absence of an\
    \ observable. The only difference between the two is that only the first one terminates.\n\
    \n# Creating an observable from a single value\n\nWhen composing multiple observables\
    \ or mocking observables for testing purposes, you might need to create an observable\
    \ that would emit only one value and then terminate itself. RxJS has two methods\
    \ to implement this behavior: the return() method and the just() method. They\
    \ work exactly in the same way and have the following signature:\n\n```\nRx.Observable.return(value,\
    \ [scheduler]);\nRx.Observable.just(value, [scheduler]);\n```\n\nThe first argument\
    \ is mandatory and the second is optional:\n\n+   - value: This can be any object;\
    \ it is the value to be emitted on the sequence\n+   - scheduler: This is used\
    \ to emit the value\n\nThe following code illustrates an example of this method:\n\
    \n```\nRx.Observable\n  .just('Hello World')\n  .subscribe((i)=> console.log(i));\n\
    ```\n\nThis code uses the just() method, but we can also use the return() method\
    \ with a simple change in it:\n\n```\nRx.Observable\n  .return('Hello World')\n\
    \  .subscribe((i)=> console.log(i));\n```"
  merge: -1
  img_proc: true
- pgno: 77
  md: "If you run any of these code lines, you will see the Hello World message printed\
    \ in your console.\n\n# Creating an observable from a factory function\n\nThere\
    \ is a method in RxJS where you can create an observable from a function that\
    \ returns an observable or an observable factory function; it is called defer().\
    \ The signature of this method is as follows:\n\n```\nRx.Observable.defer(factoryFunction);\n\
    ```\n\nIt receives only one parameter, and this parameter is mandatory:\n\n+ \
    \  - factoryFunction: This is a function that returns an observable\n\nThe following\
    \ code shows an implementation of this method:\n\n```\nRx.Observable\n  .defer(function(){\n\
    \    return Rx.Observable.just('Hello World');\n  })\n  .subscribe((data)=>console.log(data));\n\
    ```\n\nIf you run this code, you will see the following output:\n\n```\nHello\
    \ World\n```\n\n![](img/8a5c36d94dc308a2a0fcf45ffa9cc27f_77_0.png)\n\nAs the name\
    \ implies, the defer() method only calls the factory function when an Observer\
    \ subscribes to it.\n\n# Creating an observable from arbitrary arguments\n\nYou\
    \ have already learned how to create an observable from a sequence using the from()\
    \ method, but there is a way to create an observable from an arbitrary sequence\
    \ of arguments. We can do this using the of() method.\n\nThis method creates an\
    \ observable that emits each argument passed to it.\n\nThe of() method has the\
    \ following signature:\n\n```\nRx.Observable.of(...args);\n```"
  merge: -1
  img_proc: true
- pgno: 78
  md: "The three dots before args illustrate an arbitrary number of arguments.\n\n\
    +   - …args: This refers to any number of objects\n\nThe following code shows\
    \ an implementation of the of() method:\n\n```\nRx.Observable\n  .of(0,1,2)\n\
    \  .subscribe((i)=>console.log(i));\n```\n\nIf you run this code, you will see\
    \ the following output:\n\n```\n0\n1\n2\n```\n\nNow let's see what happens if\
    \ we use the of() method with only one parameter on it.\n\nSay you run the following\
    \ code:\n\n```\nRx.Observable\n  .of('Hello World')\n  .subscribe((i)=>console.log(i));\n\
    ```\n\nWhen you do this, you will see the following output:\n\n```\nHello World\n\
    ```\n\n![](img/8a5c36d94dc308a2a0fcf45ffa9cc27f_78_0.png)\n\nAs you can see, if\
    \ you run the of() method with only one argument, it works the same way as the\
    \ just() method.\n\nNow you might be wondering what happens if you run the of()\
    \ method without any argument. To check this, let's run the following code:\n\n\
    ```\nRx.Observable\n  .of()\n  .subscribe((i)=>console.log(i));\n```\n\nIf you\
    \ run the preceding code, your program will finish without any output in the console.\
    \ So if you run the of() method without any argument, it will have the same behavior\
    \ as the empty() method."
  merge: -1
  img_proc: true
- pgno: 79
  md: "![](img/8a5c36d94dc308a2a0fcf45ffa9cc27f_79_0.png)\n\nRemember that the empty()\
    \ method creates an observable without any element and ends it, while the never()\
    \ method creates an empty observable that never ends. So creating an observable\
    \ using the of() method without any argument is the same as creating an observable\
    \ using the empty() method.\n\n# Creating an observable from an error\n\nWe can\
    \ use an observable to wrap an error; this way, we will have all the operators\
    \ and compositions of the concerned observable.\n\nRxJS gives us two methods to\
    \ wrap an error. Both work in exactly the same way and are basically aliases of\
    \ each other.\n\nThe methods to wrap an error to an observable are throw() and\
    \ throwError(). We also have a method called throwException(), but this method\
    \ is deprecated and should not be used anymore.\n\nBoth methods have the same\
    \ signature, as follows:\n\n```\nRx.Observable.throw(err, [scheduler]);\nRx.Observable.throwError(err,\
    \ [scheduler]);\n```\n\nThe first method is the error you want to wrap around\
    \ the observable and it is mandatory; the second is optional:\n\n+   - err: This\
    \ is any object representing an error\n+   - scheduler: This is used to generate\
    \ the sequence of the observable\n\nLets see a code snippet that uses the throw()\
    \ method:\n\n```\nRx.Observable\n    .throw(new Error('AN ERROR HAPPENED'))\n\
    \    .subscribe((data)=>console.log(data));\n```\n\nIf you run the preceding code,\
    \ you will see an error stack trace on your console and your program will finish.\n\
    \nNow let's introduce a minor change in our code."
  merge: -1
  img_proc: true
- pgno: 80
  md: "The subscribe() method from RxJS can receive a second function to react to\
    \ errors, so let's add another function to print the message of the error:\n\n\
    ```\nRx.Observable\n    .throw(new Error('AN ERROR HAPPENED'))\n    .subscribe(\n\
    \    (data)=>console.log(data),\n    (err)=>{\n        console.log('Running the\
    \ subscription function for error');\n        console.log(err.message)\n    }\n\
    );\n```\n\nIf you run the code, you will see the following error message in your\
    \ console:\n\n```\nRunning the subscription function for error\nAN ERROR HAPPENED\n\
    ```\n\n![](img/8a5c36d94dc308a2a0fcf45ffa9cc27f_80_0.png)\n\nLater in this chapter,\
    \ we'll see the possible parameter for the subscribe() method.\n\nIn our example,\
    \ we passed an Error object for the throw() method, but what happens when we pass\
    \ another type of object, such as a number? To answer this question, let's introduce\
    \ a minor change in our code:\n\n```\nRx.Observable\n    .throw(1)\n    .subscribe(\n\
    \    (data)=>console.log(data),\n    (err)=>{\n        console.log('Running the\
    \ subscription function for error');\n        console.log(err.message)\n    }\n\
    );\n```\n\nIf you run the preceding code, you will see the following output:\n\
    \n```\nRunning the subscription function for error\nundefined\n```\n\nSo as you\
    \ can see, it doesn't matter what is the object. You can use the throw() method\
    \ to wrap any object as an error. Using another object to represent an error is\
    \ an anti-pattern, so be careful and always wrap your errors inside an Error object."
  merge: -1
  img_proc: true
- pgno: 81
  md: '![](img/8a5c36d94dc308a2a0fcf45ffa9cc27f_81_0.png)


    Never throw a string (or any object) without wrapping it in an Error object.


    # Creating observables from DOM events (or EventEmitter)


    One of the most important usages of RxJS in frontend applications is to create
    observables from user input such as mouse clicks, mouse moves, or keystrokes.


    RxJS can bind to DOM elements, jQuery (or Zepto.js) elements, Ember elements,
    or Angular elements, if any of these libraries are present. RxJS will attempt
    to detect the libraries automatically.


    This method can also be used to bind to a Node.js EventEmitter.


    The method fromEvent() is used to create observables from DOM elements. This method
    has the following signature:


    ```

    Rx.Observable.fromEvent(element, eventName, [mapFunction]);

    ```


    The first two parameters are mandatory, and the last one is optional:


    +   - `element`: This represents either the DOM element, jQuery element, Angular
    element, Ember element, NodeList, or EventEmitter to attach the event

    +   - `eventName`: This is a string representing the event

    +   - `mapFunction`: This is a function that takes arguments from EventEmitter
    and maps it to a single value


    To use the fromEvent() method, create an HTML page with a single element, as follows:


    ```

    <html>

    <head></head>

    <body>

    <div id="myDiv">Foo</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/rxjs/4.1.0/rx.all.js"></script>

    </body>

    </html>

    ```'
  merge: -1
  img_proc: true
- pgno: 82
  md: "Now let's show an alert every time the user clicks on the word Foo. In the\
    \ first example, let's create an observable from a DOM element.\n\nAdd a script\
    \ tag to your HTML file to listen to the click on <div>:\n\n```\nRx.Observable\n\
    \  .fromEvent(document.getElementById('myDiv'),'click')\n  .subscribe(function(e){\n\
    \    alert('Clicked');\n  });\n```\n\nOpen this file in your browser and click\
    \ on the word Foo; once you click on it, an alert will pop up on your screen.\n\
    \n![](img/8a5c36d94dc308a2a0fcf45ffa9cc27f_82_0.png)\n\nRemember, before adding\
    \ this code to your HTML file, you have to add RxJS as a script to your page.\n\
    \nNow let's use a jQuery element instead of a DOM element. Change your <script>\
    \ tag to use the following code:\n\n```\nRx.Observable\n  .fromEvent($('#myDiv'),'click')\n\
    \  .subscribe(function(e){\n    alert('Clicked');\n  });\n```\n\nOpen this HTML\
    \ file in your browser and click on the word Foo; once you click on it, an alert\
    \ will pop up on your screen.\n\n![](img/8a5c36d94dc308a2a0fcf45ffa9cc27f_82_1.png)\n\
    \nRemember, before adding this code to your HTML file, you have to add jQuery\
    \ as a script to your page.\n\nAs you can see, you don't need any changes to make\
    \ RxJS support the jQuery element; it just works out of the box."
  merge: -1
  img_proc: true
- pgno: 83
  md: "We can also use the fromEvent() method on Node.js EventEmitters. To illustrate\
    \ this usage, let's read a file and print its content to the console using RxJS:\n\
    \n```\nvar fs = require('fs');\nvar Rx = require('rx');\nvar readStream = fs.createReadStream(__filename,'utf8');\n\
    Rx.Observable\n    .fromEvent(readStream,'data')\n    .subscribe((i)=> console.log(i));\n\
    ```\n\nIn this example, we first imported the fs module to read files and the\
    \ RxJS module. Then, we created readStream from our own file (the __filename variable\
    \ holds the location of the current file) and we added the string utf8 to read\
    \ our file as a string (if we omit this, it will read the file as bytes). And\
    \ finally, we used the fromEvent() method to create an observable from this stream,\
    \ listening to all the events of the type data. We need to subscribe to the observable\
    \ in order to print the content in the console.\n\nIf you run the preceding code,\
    \ you will see your own program printed in the console.\n\nNow lets make a minor\
    \ change in our code. If we remove the utf8 string in the createReadStream() method\
    \ and re-execute the program, we will see an output as follows:\n\n```\n<Buffer\
    \ 76 61 72 20 66 73 20 3d 20 72 65 71 75 69 72 65 28 27 66 73\n27 29 3b 0a 76\
    \ 61 72 20 52 78 20 3d 20 72 65 71 75 69 72 65 28 27\n72 78 27 29 3b 0a 0a 76\
    \ ... >\n```\n\nWe already know we can add the utf8 string as a parameter to make\
    \ the createReadStream() method convert it into a string.\n\nIf we haven't, we\
    \ could use RxJS.\n\nIn JavaScript, the buffer object has a method called toString()\
    \ to convert it into a string using the given character encoding. So if I want\
    \ to convert a buffer into an utf8 string, all I have to do is write it as follows:\n\
    \n```\nvar myString = myBuffer.toString('utf8');\n```\n\nThe fromEvent() method\
    \ can receive a third parameter to map the input from the EventEmitter to another\
    \ value before propagating it to the listeners."
  merge: -1
  img_proc: true
- pgno: 84
  md: "We can use this method to avoid marking readStream as an utf8 string, and we\
    \ can do this only in the observable. To do this, use the following code:\n\n\
    ```\nvar fs = require('fs');\nvar Rx = require('rx');\n\nvar readStream = fs.createReadStream(__filename);\n\
    Rx.Observable\n    .fromEvent(readStream,'data',(chunk)=>chunk.toString('utf8'))\n\
    \    .subscribe((i)=> console.log(i));\n```\n\n# Creating an observable from an\
    \ arbitrary source\n\nIn the previous chapter, we discussed how to implement an\
    \ observable from an arbitrary source in bacon.js, using the fromBinder event.\
    \ On RxJS, we can also create an observable from any source that we want using\
    \ the create() method. There is also an alias for this method, called createWithDisposable.\n\
    \nThe create() method has the following signature:\n\n```\nRx.Observable.create(sourceFunction);\n\
    ```\n\nThis method accepts only one parameter and it is mandatory:\n\n+   - sourceFunction:\
    \ This is a function that receives an object capable of pushing data into an observable\n\
    \nWe can create an observable with the create() method using the following code:\n\
    \n```\nRx.Observable.create(function(source){\n    source.onNext(0);\n    source.onNext(1);\n\
    \    source.onNext(2);\n    source.onCompleted();\n}).subscribe((i)=> console.log(i));\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 85
  md: "If you run this code, you will see the following output:\n\n0\n1\n2\n\nWe can\
    \ also use it to send errors to the observable, as you can see in this code:\n\
    \n```\nRx.Observable.create(function(source){\n  source.onNext(0);\n  source.onNext(1);\n\
    \  source.onError(new Error('ops'));\n  source.onNext(2);\n  source.onCompleted();\n\
    }).subscribe(\n  (i)=> console.log(i),\n  (err)=> console.log('An error happened:\
    \ '+err.message )\n);\n```\n\nIf you run this code, you will see the following\
    \ output:\n\n0\n1\nAn error happened: ops\n\n![](img/8a5c36d94dc308a2a0fcf45ffa9cc27f_85_0.png)\n\
    \nAs you can see, the observable stops sending data in case there are errors.\
    \ In later chapters, we will see how we can recover from errors.\n\nSometimes\
    \ when creating an observable, you might need to release some allocated resources\
    \ (such as database connections or file handlers). To do this, RxJS has a special\
    \ type of object called Disposable.\n\nThe create() method lets you define a function\
    \ (or a Disposable object) to be fired when you no longer want to hold the resources\
    \ you just allocated.\n\nTo do this, all you have to do is return a function (or\
    \ a Disposable object) and call the dispose() method of the subscription, as seen\
    \ in the following code:\n\n```\nvar observable = Rx.Observable.create(function(source){\n\
    \  source.onNext(0);\n  source.onNext(1);\n  source.onNext(2);\n  source.onCompleted();\n\
    \  return function(){\n    console.log('dispose called: releasing connections\
    \ or other\n```"
