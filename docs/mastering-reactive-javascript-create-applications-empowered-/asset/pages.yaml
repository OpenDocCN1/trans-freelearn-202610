- pgno: 220
  md: '# The transducers-js API


    Before we learn how we can use transducers-js with RxJS, it is important to know
    which transformations we have available in this library. As we have already learned
    most of these transformations in RxJS, here is a quick overview of some of the
    transformations available in the `transducers-js` library API and what each one
    does:


    +   - transducers.complement (function): It takes a function and returns its complements
    (negates the result of the function call).

    +   - transducers.filter (function): It takes a function and filters the data
    based on the result of calling this function over it.

    +   - transducers.first(): It returns the first input.

    +   - transducers.map (function): It uses the given function to map each value
    into another.

    +   - transducers.partitionAll (integer): It maps the inputs into arrays of a
    given size.

    +   - transducers.reduce (function, initialObject, iterable): It receives as a
    parameter a function, an initial value, and the iterable object to be reduced.
    It returns the reduction of the given iterable object starting with the initial
    value and applying the given function.

    +   - transducers.remove (function): It is similar to the `filter()` operation,
    but it removes the value when the given function returns a truthy value.

    +   - transducers.take (integer): It returns an iterable object containing the
    first n items where n is the integer passed as a parameter to the `take()` function.

    +   - transducers.takeWhile (function) : It returns all elements while the given
    function returns true.


    ![](img/8a5c36d94dc308a2a0fcf45ffa9cc27f_220_0.png)


    This is not an exhaustive list of the available methods, but it contains a good
    portion of them, just enough to get us started with transducers. All available
    methods can be found in the link http://cognitect-labs.github.io/transducers-js/classes/transducers.html.


    # Using transducers


    As we discussed in previous sections, transducers are a way to compose algorithmic
    transformations over iterable objects; to see this in action, let''s first use
    a transducer in the most simple iterable object, an array.'
  merge: -1
  img_proc: true
- pgno: 221
  md: "To run a transducer over an array we first need a method to run a given transformation\
    \ in a given iterable object.\n\nFor this we use the into() method, which has\
    \ the following signature:\n\n```\ntransducers.into(emptyIterable,transformation,iterable)\n\
    ```\n\nIt receives three parameters and they are all mandatory:\n\n+   - emptyIterable:\
    \ It is an empty iterable used to store the result of the application of the transformation\
    \ over the iterable object\n+   - transformation: It is the function or transducers\
    \ to be applied over the iterable object\n+   - iterable: It is the iterable object\
    \ to be transformed\n\nWith the usage of this function we can implement transformations\
    \ over an array, let's see how we can implement a simple map with it:\n\n```\n\
    var t = require('transducers-js');\n\nvar iterableObject = [1,2,3,4];\nvar mapTransducer\
    \ = t.map((i)=>i+1);\n\nvar result = t.into(\n  [],\n  mapTransducer,\n  iterableObject\n\
    );\n\nconsole.log(result);\n```\n\nThis example does the following:\n\n+   1.\
    \ Imports the transducers-js library and stores it in the t variable.\n+   2.\
    \ Creates an array called iterableObject, where the transformation will be applied;\
    \ the array contains the value [1,2,3,4].\n+   3. Creates a transducer to map\
    \ the values of an iterable object in it plus one, called mapTransducer.\n+  \
    \ 4. Calls the into method to iterate the iterableObject using the mapTransducer\
    \ into an empty array passed as the first argument of the method; the result of\
    \ this is stored in the result variable."
  merge: -1
  img_proc: true
- pgno: 222
  md: "5. Logs to the console the result variable; this step prints the value [ 2,\
    \ 3, 4, 5 ] in the console, as we expect.\n\nThis is a simple example, showing\
    \ a simple transformation over an array, but with transducers we can compose several\
    \ transformations to be applied over an iterable object. The composition itself\
    \ is done using the comp() method; this method has the following signature:\n\n\
    ```\ntransducers.comp(...transformations)\n```\n\nIt receives an arbitrary number\
    \ of arguments, each one being a transformation to be applied on the iterable\
    \ object.\n\nTo see this method in action, let's implement a transducer using\
    \ the map and filter transformations to calculate sum one to each number in an\
    \ iterable object and filter to keep only the even numbers:\n\n```\nvar t = require('transducers-js');\n\
    var iterableObject = [1,2,3,4];\n\nvar mapTransducer = t.map((i)=>i+1);\nvar filterTransducer\
    \ = t.filter((i)=>i%2===0);\n\nvar composedTransducer = t.comp(mapTransducer,filterTransducer);\n\
    \nvar result = t.into(\n    [],\n    composedTransducer,\n    iterableObject\n\
    );\n\nconsole.log(result);\n```\n\nThis new code creates our first composition\
    \ of transformations, with the following steps:\n\n+   1. Imports the `transducers-js`\
    \ library and stores it in the `t` variable.\n+   2. Creates an array called `iterableObject`,\
    \ where the transformation will be applied, the array contains the value `[1,\
    \ 2, 3, 4]`.\n+   3. Creates a transducer to map the values of an `iterable` object\
    \ in it plus one, called `mapTransducer`.\n+   4. Creates a transducer to filter\
    \ the values of an `iterable` object keeping only the even numbers, called `filterTransducer`."
  merge: -1
  img_proc: true
- pgno: 223
  md: '+   5. Creates a composition of transformations, respecting order of the parameters
    from left to right, so the first applies the `map()` transformation and then the
    `filter()` transformation, called `composedTransducer`.

    +   6. Calls the `into()` method to iterate the `iterableObject` using the `composedTransducer`
    into an empty array passed as the first argument of the method; the result of
    this is stored in the `result` variable.

    +   7. Logs to the console the `result` variable; this step prints the value `[
    2, 4 ]` in the console, as we expect.


    ![](img/8a5c36d94dc308a2a0fcf45ffa9cc27f_223_0.png)


    Remember that the order is important, so when we run the map transformation over
    the `iterable` object `[1, 2, 3, 4]` the result is the sum of each number with
    one `[2, 3, 4, 5]` and then we filter to keep only the even numbers `[2, 4]`,
    as seen in the output.


    If we switch the orders of the parameters passed to `t.comp` we first apply `filter`
    and the `map`, so we would first filter only the even numbers; then, applying
    the `map` transformation that sums 1 to each value, on the previous code we changed
    the order of this line:


    ```

    var composedTransducer = t.comp(filterTransducer,mapTransducer);

    ```


    Running the code with this change gives us a different output:


    [ 3, 5 ]


    When we run with this small change we must first filter the array ([ 1, 2, 3,
    4]) to keep only the even numbers ([ 2, 4 ]), and then map it to its value plus
    1, which gives use the output [ 3, 5 ].


    # Using transducers with RxJS


    In the last section, we learned how we can apply a transducer to the most simple
    `iterable` object in JavaScript, an array. But we are more interested in how we
    can use this tool in functional reactive programming using RxJS.


    Using transducers with RxJS we can see performance improvements, as we will avoid
    the creation of intermediate observable sequences and can improve the overall
    quality of our code with the composition of transformations.'
  merge: -1
  img_proc: true
- pgno: 224
  md: 'To use a transducer in RxJS we need to use the transduce operator of the RxJS
    library; this operator has the following signature:


    ```

    observable.transduce(transducer)

    ```


    It receives only one mandatory argument:


    +   - transducer: It is the transducer transformation to be applied on the observable
    sequence


    The transduce operator, like any other observable operator, returns a new operator,
    but as we can compose several transformations inside a single transducer we will
    create only one new observable.


    ![](img/8a5c36d94dc308a2a0fcf45ffa9cc27f_224_0.png)


    Imagine an observable where we apply two operators, the filter() operator and
    the map() operator, for each operator applied. RxJS creates a new intermediate
    observable, creating two new observables. If we decide to create a transducer
    composing both transformations instead, RxJS would create only one extra observable,
    and this leads to a performance improvement; we will see in the benchmark section
    of this chapter the performance improvement of the transducers approach.


    Now let''s see an example usage of transducers with observable sequences. First
    let''s implement a simple map using transducers:


    ```

    var t = require(''transducers-js'');

    var Rx = require(''rx'');


    var mapTransducer = t.map((i)=>i+1);

    Rx.Observable

    .of(1,2,3,4)

    .transduce(mapTransducer)

    .subscribe((i)=>console.log(i));

    ```


    Here we simply create a mapTransducer to sum one to each value of an iterable
    object, we then create an Observable containing four values, apply the transduce
    operator using the mapTransducer over it, and finally subscribe to log the content
    of this observable sequence.


    The execution of this code gives us the following output:


    2

    3

    4

    5'
  merge: -1
  img_proc: true
