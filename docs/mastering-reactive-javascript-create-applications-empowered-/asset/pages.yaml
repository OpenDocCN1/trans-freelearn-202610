- pgno: 116
  md: "In the preceding code, we first create a `subject`. We then call the `throttle()`\
    \ operator, to receive the data on the given maximum rate of one every 50 milliseconds,\
    \ and we `subscribe` to it (for data, error, and completion). Then we push the\
    \ data into our `subject`. If we run this code, we will see the following output:\n\
    \n```\n0\n2\nFinished\n```\n\nThe `throttle()` method will first propagate the\
    \ first element in the observable (the number 0) and the second element (the number\
    \ 1) will be discarded (as we did not elapse the 50 milliseconds interval). We\
    \ only have new data available after 200 milliseconds and we will propagate it\
    \ (the number 2) because we already waited for more than 50 milliseconds since\
    \ our last data propagated (the number 0). We will then push the last element\
    \ in the `subject` (the number 3), which is discarded (less than 50 milliseconds\
    \ since our last emission, the number 2) and we finally finish the `subject`.\n\
    \n# The sample() operator\n\nThe `sample()` operator can also be used to mitigate\
    \ the problem of backpressure in a lossy way. It lets you receive data from the\
    \ observable at every given interval.\n\nThe `sample()` operator has the following\
    \ signature:\n\n```\nobservable.sample(interval, [scheduler]);\n```\n\nThe first\
    \ parameter is mandatory and the second is optional:\n\n+   - `interval`: This\
    \ is the time interval, in milliseconds, between the emission of data. This parameter\
    \ can also be an `observable`. In this case, this `observable` will be used to\
    \ sample the data.\n+   - `scheduler`: This is used to propagate the data\n\n\
    Let's use the same example from the `throttle()` method (using the `interval()`\
    \ method to create an `Observable`) and change it to use the `sample()` method:\n\
    \n```\nRx.Observable\n  .interval(50)\n  .sample(1000)\n  .subscribe((i)=>console.log(i));\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 117
