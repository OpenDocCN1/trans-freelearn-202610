    # Using the merge() operator


    In the last section, we learned to use the concat() operator to concatenate observables
    keeping the order of each observable from left to right. We also saw that if one
    of the observables is infinite, the other observables after this will never propagate
    this data. When we want to concatenate observables preserving the order of the
    data instead of the order of the observable, we use the merge() operator.


    This operator has the following signature:


    ```

    observable.merge(observable);

    ```


    It accepts any number of arguments, but they all must be observables:


    +   - observable: This is the other observable to be merged


    ![](img/8a5c36d94dc308a2a0fcf45ffa9cc27f_153_0.png)


    There is another signature for this method where you can set the maximum number
    of observables being subscribed to concurrently, but this is uncommon to use in
    RxJS and we will avoid it in this book, to make the concept easier to understand.


    We can change the first example of the concat() operator and use the merge() operator
    to combine two observables:


    ```

    Rx.Observable

    .just(1)

    .merge(Rx.Observable.just(2))

    .subscribe((k)=>console.log(k));

    ```'
  merge: -1
  img_proc: true
- pgno: 154
  md: 'In this example, we just changed the concat() operator for the merge() operator,
