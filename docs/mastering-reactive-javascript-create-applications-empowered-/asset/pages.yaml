- pgno: 248
  md: "Here we created our test suite to test the sendMessage service. We also added\
    \ a test to our suite using the it() function. This test will check if our service\
    \ can send data to a user. On the service implementation we first create a DataSource\
    \ (mockDataSource); on the next line we create services using this DataSource\
    \ and store them in the services variable (we will do it in every test); then\
    \ we create a sender for our message (from), the receiver (to) and the content\
    \ (content); and, finally, we create our message (message). The next thing to\
    \ do is to listen to our mock DataSource to see if the message was sent. We add\
    \ a subscription to it and, in this subscription, we verify the message properties\
    \ (from, to, and content). Then we finish our subscription and call the done()\
    \ method to finish our test. The last step is to send the message.\n\nWith this\
    \ test done, we can implement the next test to verify whether our service can\
    \ send messages to all users, so add the following test to our test suite:\n\n\
    ```\nit('Must support broadcast message', function(done) {\n    let mockDataSource\
    \ = mockDataSourceFactory();\n    let services = servicesFactory(mockDataSource);\n\
    \    let from = 'Jim';\n    let content = 'foobar';\n    let message = {content:content,\
    \ from:from};\n    let subscription = mockDataSource\n        .get()\n       \
    \ .subscribe(function(message){\n            assert.equal(message.from,from);\n\
    \            assert.equal(message.content,content);\n            subscription.dispose();\n\
    \            done();\n        });\n    services.sendMessage(message);\n});\n```\n\
    \nThe test is similar to the test for private messages. We only omitted the property\
    \ to from the message, as messages without a receiver must be sent to all users.\n\
    \nNow we can run our test suite against our services. To do this run the following\
    \ command inside your projects folder:\n\n```\nmocha tests/send_message_test.js\n\
    ```"
