- pgno: 233
  md: "Before we start to use the library to benchmark transducers, let's see how\
    \ we can use it through an example. Let's compare the difference between calling\
    \ a function to sum two numbers using call or apply:\n\n```\nvar Benchmark = require('benchmark')\n\
    var suite = new Benchmark.Suite;\n\nvar sum = (a,b)=>a+b;\n\nsuite.add('Sum using\
    \ call', function() {\n  sum.call(this,1,2);\n})\n.add('Sum using apply', function()\
    \ {\n  sum.apply(this,[1,2]);\n})\n.on('cycle', function(event) {\n  console.log(event.target.toString());\n\
    })\n.on('complete', function() {\n  console.log('Fastest is ' + this.filter('fastest').map('name'));\n\
    })\n.run();\n```\n\nIn our example, we do the following steps:\n\n+   1. Require\
    \ the benchmark module.\n+   2. Create a new `suite` of tests and store it in\
    \ the `suite` variable.\n+   3. Create the function we want to benchmark.\n+ \
    \  4. We must add functions to be tested in our `suite`; to do this we call the\
    \ `add()` method, passing a string to identify this test, and the function to\
    \ be tested. In the first test we want to see the performance of calling the `sum()`\
    \ function using `call`.\n+   5. The next test added to the `suite` runs the same\
    \ function using `apply`.\n+   6. We add a listener to the `cycle` event, which\
    \ is called every time one cycle of benchmarks is finalized; we add a console\
    \ log to show the performance results of this test.\n+   7. We add a listener\
    \ to the `complete` event, which is called when our test `suite` finishes; here\
    \ we log the `fastest` test.\n+   8. We run our performance test."
  merge: -1
  img_proc: true
