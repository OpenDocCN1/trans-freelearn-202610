- pgno: 102
  md: "![](img/8a5c36d94dc308a2a0fcf45ffa9cc27f_102_0.png)\n\nThere is an alias for\
    \ this operator called `select`.\n\n# The flatMap() operator\n\nIn the previous\
    \ section, we saw the `map()` operator and how we can use it to map an object\
    \ into another object in an observable. The `flatMap()` operator works similarly.\
    \ It receives a function as a parameter. The function provided as argument must\
    \ returns an Observable, and the elements of this Observable is propagated instead.\n\
    \nThis operator may seen a little bit confusing, but there is another way to understand\
    \ it. The `flatMap()` operator runs the given function for each element in the\
    \ original array. It creates an Observable that will emit each piece of data coming\
    \ out from other Observables keeping the order.\n\nThe `flatMap()` operator is\
    \ illustrated in the following signature:\n\n```\nobservable.flatMap(flatMapFunction,\
    \ [thisContext]);\n```\n\nThe first parameter is mandatory and the second is optional:\n\
    \n+   - `flatMapFunction`: This is a function that takes an element of the observable\
    \ as input and returns another observable whose elements are going to be propagated\
    \ instead\n+   - `thisContext`: This is any object to be used as the `this` (JavaScript\
    \ context) of `flatMapFunction`\n\nYou can see an example usage of this operator\
    \ in the following code:\n\n```\nRx.Observable\n  .of(1,2,3)\n  .flatMap((i)=>Rx.Observable.of(i,i*2))\n\
    \  .subscribe((i)=>console.log(i));\n```\n\nIn the preceding example, we first\
    \ create an Observable that will propagate three numbers (1, 2, and 3). Then,\
    \ we apply the `flatMap()` operator over this Observable; this will create a new\
    \ Observable that will emit each value emitted by each Observable, and it will\
    \ be returned by the `flatMapFunction`. The `flatMapFunction` returns an Observable\
    \ containing the value and its double. So in the value 1 example, we create an\
    \ Observable emitting the values 1 and 2; for value 2, we emit 2 and 4; and for\
    \ value 3, we emit 3 and 6."
  merge: -1
  img_proc: true
- pgno: 103
  md: "If we run the preceding code, it will display this output:\n\n1\n2\n2\n4\n\
    3\n6\n\nThis operation can be represented by the following diagram:\n\n![](img/8a5c36d94dc308a2a0fcf45ffa9cc27f_103_0.png)\n\
    \nWe can chain different operators easily, as follows:\n\n```\nRx.Observable\n\
    \    .of(1,2,3)\n    .map((i)=>i+1)\n    .flatMap((i)=>Rx.Observable.of(i,i*2))\n\
    \    .subscribe((i)=>console.log(i));\n```\n\nIn the preceding example, we chained\
    \ the map() and flatMap() operators. First we create an Observable for 1, 2, and\
    \ 3, then we use the map() operator to add 1 to each value (now we have an Observable\
    \ with values 2, 3, and 4). Then, we use the flatMap() operator to emit a new\
    \ sequence containing the value and its double."
