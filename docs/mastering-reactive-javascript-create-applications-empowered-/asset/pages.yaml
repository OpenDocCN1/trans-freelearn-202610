    \ user, and the exclamation mark must be followed by the username; we handle this\
    \ type of message on the first if() clause in the function\n+   - If the message\
    \ starts with a slash (/), it is a command message and must be followed by the\
    \ command; on our server we support two different commands, echo and roll_a_dice;\
    \ this is handled by the second if() clause"
