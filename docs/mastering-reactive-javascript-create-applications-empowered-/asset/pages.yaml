    ```

    running for: 0 flatMapFirst: 0

    running for: 0 flatMapFirst: 1

    running for: 0 flatMapFirst: 2

    running for: 3 flatMapFirst: 0

    running for: 3 flatMapFirst: 1

    running for: 3 flatMapFirst: 2

    running for: 5 flatMapFirst: 0

    running for: 5 flatMapFirst: 1

    //keeps printing until we stop the program

    ```

    ```


    By looking at the output it is easier to understand how this operator works; it
    started to run for the value 0 (the first value propagated from the original observable),
    and propagates all elements from the flatMapped observable (the first three strings
    in the format running for: 0 flatMapFirst: X). It drops all values propagated
    while the observable from the flatMapFirst() is running; for this reason the values
    1 and 2 are discarded and it goes to the next value, the value 3, and the execution
    repeats.


    ![](img/8a5c36d94dc308a2a0fcf45ffa9cc27f_211_0.png)


    There is an alias for this operator called selectSwitchFirst.


    # The finally() operator


    This operator is simple and useful, and works similarly to the finally from the
    try/catch/finally block. It executes a specified function after the original observable
    finishes (even in the case of failure).


    It has the following signature:


    ```

    ```

    observable.finally(action);

    ```

    ```'
