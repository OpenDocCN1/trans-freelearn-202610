- pgno: 268
  md: "# Using Redis as the DataSource for messages\n\nNow we must change our DataSource\
    \ to use Redis instead of the basic subject from our original implementation.\
    \ To do so, just change the file data_source.js, to use this implementation instead:\n\
    \n```\nlet Rx = require('rx');\nlet Redis = require('ioredis');\n\nlet subscriber\
    \ = new Redis();\nlet publisher = new Redis();\nconst TOPIC = 'web_chat';\nsubscriber.subscribe(TOPIC);\n\
    let messagesObservable =\nRx.Observable.fromEvent(subscriber,'message',(channel,message)=>JSON.parse(\n\
    message));\nmodule.exports = {\n  push(data){\n    publisher.publish(TOPIC,JSON.stringify(data));\n\
    \  },\n  get(){\n    return messagesObservable;\n  }\n};\n```\n\nIn this code\
    \ we first import the RxJS and ioredis libraries; we then start two connections\
    \ with the Redis server, one to publish and the other to listen to messages. As\
    \ we are running Redis in a local machine, we do not need to pass any argument\
    \ to the constructor. On the next line, we create a name for the TOPIC where the\
    \ messages are going to be published. This name can be anything, but all servers\
    \ must use the same TOPIC. You also don't need to manually create this TOPIC as\
    \ Redis will create it for you automatically. We finally subscribe to this TOPIC\
    \ and create an Observable to listen to messages from that subscription. The last\
    \ thing we need to do is to implement the exported methods (push() and get()):\
    \ on push() we only have to publish it to Redis and on get() we only have to return\
    \ the created Observable.\n\nThis is all we need to do if we want to distribute\
    \ our application across several servers using Redis to communicate between them."
  merge: -1
  img_proc: true
- pgno: 269
  md: '# Summary


    In this chapter, we created our first application using RxJS. The web chat application
    is a perfect fit to use functional reactive programming given its interactive
    nature. In this chapter we learned to model a WebSocket server as an observable
    for connections using RxJS. We also learned to model our DataSource as an observable
    of messages, in two different flavors: firstly, keeping messages only on one local
    server and, secondly, sending messages to other servers using Redis as a publish/subscriber
    broker. We also looked at the use of operators to implement some of our services.


    With this application, we saw how we can create observables from different event
    sources, and how we can use operators to implement some of our business rules.


    Another important lesson from this chapter was the implementation of tests for
    our system. In our tests, we learned how to create a fake data source from a simple
    observable, and use a different one in each test to keep them independent from
    each other.


    In the next chapter, we will implement the client side of our application. With
    this part of our application, we will see how we can model user interaction using
    functional reactive programming and an approach to implementing tests for functional
    reactive applications running inside the browser.


    The next chapter will put to the test your ability to implement all the concepts
    you learned so far.'
  merge: -1
  img_proc: true
