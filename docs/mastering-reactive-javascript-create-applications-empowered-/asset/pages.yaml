- pgno: 142
  md: "This operator keeps a buffer with the size needed to store the requested count\
    \ of elements.\n\n# The takeWhile() operator\n\nThis is the last operator from\
    \ the take() family we will see in this chapter. This operator lets you create\
    \ an observable from the first contiguous sequence of elements in an observable\
    \ satisfying a given conditional function. It has the following signature:\n\n\
    ```\nobservable.takeWhile(condition,[context]);\n```\n\nThe first parameter is\
    \ mandatory and the last is optional:\n\n+   - condition: This is a given function\
    \ which the elements must satisfy\n+   - context: This argument is used in the\
    \ conditional function\n\nWe can use this operator to take the first contiguous\
    \ sequence of even numbers, as can be seen in the following example:\n\n```\n\
    Rx.Observable\n    .of(2,4,5,6)\n    .takeWhile((i)=>i%2===0)\n    .subscribe((i)=>console.log(i));\n\
    ```\n\nIn this code, we will test for even numbers. It will test from the beginning\
    \ and stop when the first element doesn't satisfy the given condition. So, as\
    \ the condition satisfies the first two numbers (2 and 4), but not the third number\
    \ (5), it will print only the first two:\n\n2\n4"
