- pgno: 193
  md: '# The fundamentals of RxJS


    In Chapter 3, A World Full of Change - Reactive Extentions to the Rescue, we learned
    about observables and observers; these two objects are the most important part
    of functional reactive programming. Observables are objects with the capacity
    to listen to events occurring in an environment and they notify other objects
    of these events; the objects being notified are called observers and they have
    the capacity to react to the events propagated by an observable. They can listen
    for up to three events:


    +   - `onNext()`: Triggers when new data is propagated by an observable to this
    observer

    +   - `onError()`: Triggers when an error is propagated by an observable to this
    observer

    +   - `onCompleted()`: Triggers when the observable finishes without any error


    RxJS gives us the opportunity to create observables from different sources of
    data using some built-in functions, but it also lets you create custom observables
    for any source of data you might need.


    Subjects are a special class of objects that let you create pushable observables,
    which means you can add data, errors of finish it at any time.


    Another important lesson in this chapter was our first subscription. The observers
    must subscribe to an observable to listen to the events from this observable creating
    a subscription; observers can also unsubscribe from an observable at any time
    if they are no longer interested in events of this observable.


    A lot of the power of functional reactive programming comes from the usage of
    operators. Operators let you interact and modify the data being propagated by
    an observable before it reaches an observer. Actually, under the hood, every time
    you call an operator over an observable it does not modify that observable, but
    creates a new observable instead, which will propagate the modified data. This
    is really important, as with this behavior, we know that adding an operator to
    an observable will not change the data propagated by other subscriptions of this
    observable.'
