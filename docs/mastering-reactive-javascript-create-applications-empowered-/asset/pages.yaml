- pgno: 30
  md: "Now that we have added Bacon to our code, we can use it to create a timer that\
    \ prints the current time every second.\n\nBefore showing you the code that does\
    \ this, it's important to understand how we model this problem using functional\
    \ reactive programming. As we described before, bacon.js implements the concept\
    \ of event streams, which are an observable stream of events. To create a timer,\
    \ we need a special type of stream, capable of emitting events every x seconds,\
    \ so we can listen to this stream to print the current date.\n\nThe bacon.js has\
    \ a lot of built-in functions to create EventStreams from different sources. We\
    \ will discuss the available functions later, but at this time we need to know\
    \ the Bacon.interval() function that lets us create an EventStreams that emits\
    \ an event every x seconds, where x is the time between the events in milliseconds.\
    \ So, if we want to send an event every second, we must use it as follows:\n\n\
    ```\nBacon.interval(1000);\n```\n\nThis code creates an EventStream that emits\
    \ an event every second. Now we need a way to be notified of the events in this\
    \ stream so we can print the current date on the console. We can do this using\
    \ the onValue() function–this function lets us subscribe to listen to events on\
    \ this stream, and it receives the function to be executed as a parameter, so\
    \ it lets us change our code to use it. The full code is as follows:\n\n```\n\
    var Bacon = require(\"baconjs\");\nBacon\n    .interval(1000)\n    .onValue(\n\
    \        ()=> console.log(new Date())\n    );\n```\n\nIf you run this code, you\
    \ will see an output like this:\n\n```\n2016-10-30T20:28:22.778Z\n2016-10-30T20:28:23.796Z\n\
    2016-10-30T20:28:24.803Z\n2016-10-30T20:28:25.808Z\n2016-10-30T20:28:26.809Z\n\
    2016-10-30T20:28:27.815Z\n2016-10-30T20:28:28.820Z\n```\n\nYou still have to hit\
    \ Ctrl + C to stop your program."
  merge: -1
  img_proc: true
- pgno: 31
  md: "![](img/8a5c36d94dc308a2a0fcf45ffa9cc27f_31_0.png)\n\nHere we are creating\
    \ an EventStream from an interval. bacon.js has a lot of built-in methods to create\
    \ event streams; we will see these methods in more detail in Chapter 2, Reacting\
    \ for the First Time.\n\nCongratulations, you have just created your first program\
    \ using functional reactive programming Now, let's change it a little.\n\nWe are\
    \ going to implement the same code, but using a frp operator. To do this we will\
    \ use the map () operator–this operator receives a mapping function as a parameter.\
    \ This function takes an input value and transforms it in another value. Instead\
    \ of listening to events on the stream and printing the current date on the console,\
    \ we will listen to events in the stream, map those events to the current date,\
    \ and then print the result. Create a file called baconIntervalMap.js and paste\
    \ the following code:\n\n```\n```javascript\nvar Bacon = require(\"baconjs\");\n\
    Bacon\n    .interval(1000)\n    .map(()=>new Date())\n    .onValue((currentDate)=>console.log(currentDate));\n\
    ```\n```\n\n![](img/8a5c36d94dc308a2a0fcf45ffa9cc27f_31_1.png)\n\nUsing the map\
    \ () operator we can write a more descriptive code. This also enables us to decouple\
    \ our code and test each function, instead of the whole code. We will see the\
    \ map () operator in more detail in Chapter 4, Transforming data - Map, Filter,\
    \ and Reduce.\n\nIf you run this code, you will see the same kind of output as\
    \ from the previous code.\n\nIn the first example (without bacon.js) we have a\
    \ hard code to test, because all logic of the code is tied together. In the next\
    \ example, we improved our code testability, as we detached the source of the\
    \ events from the action, so we can test our onValue() function mocking our EventStream,\
    \ but the logic of getting the current date is still tied to the action (printing\
    \ on the console). The last example (using map()) is a lot more testable, as we\
    \ can test every single piece of code separately.\n\nLet's see the last version\
    \ of our problem. Instead of printing the current date every second forever, we\
    \ will print the current date only five times, every second. We can implement\
    \ it without using frp; create a file called traditionalInterval5times.js and\
    \ paste the following code:\n\n```\n```javascript\nvar count = 0;\n\nvar intervalId\
    \ = setInterval(()=>{\n    console.log(new Date());\n```\n```"
  merge: -1
  img_proc: true
- pgno: 32
  md: "```\ncount++;\nif(count===5){\n    clearInterval(intervalId);\n}\n},1000);\n\
    ```\n\nNow our code has become a lot more complicated. To implement the new version\
    \ of the proposed code we need an external counter (to make sure we run the code\
    \ only five times), and we need a reference for the interval scheduler so we can\
    \ stop it later. By looking at this code it is not easy to understand what it\
    \ is trying to do, and as you probably already noted, it is really hard to test.\n\
    \nYou might be wondering how we can change our last frp code to implement; it\
    \ would be amazing if we had a way to only listen to five events on our Bacons\
    \ EventStream, so I present to you the take() method. This method lets you listen\
    \ to only a given number of events on an EventStream. So, changing our previous\
    \ code to run only five times is really straightforward; create a file named baconIntervalMap5times.js\
    \ and paste the following code:\n\n```\nvar Bacon = require(\"baconjs\");\n\n\
    Bacon\n    .interval(1000)\n    .take(5)\n    .map(()=>new Date())\n    .onValue((currentDate)=>console.log(currentDate));\n\
    ```\n\n![](img/8a5c36d94dc308a2a0fcf45ffa9cc27f_32_0.png)\n\nThe take() operator\
    \ lets us listen to only the first x events on the EventStream. We will see this\
    \ operator in more detail in Chapter 8, What Else? - More Operators.\n\nOur new\
    \ code is that simple. We don't need to change the stream source, the mapping\
    \ function, nor the subscription function; we just need to take only five events\
    \ from the stream.\n\nIn this final example, we can see how functional reactive\
    \ programming can improve our code readability. In the code using setInterval(),\
    \ we had to add a counter variable to make sure we ran the log function the right\
    \ number of times. We also had to remember to clear the interval so we didn't\
    \ run this code forever. On the other hand, on the code using frp all we had to\
    \ do was describe the transformations using take() to show how many items we wanted,\
    \ map() to get the current date, and finally subscribed to react to the events\
    \ of this stream."
