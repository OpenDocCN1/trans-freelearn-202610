- pgno: 251
  md: "# Test implementation\n\nWe are going to create three tests for this service:\
    \ the first checks if the observable returned by this service contains data sent\
    \ to the given user; the second checks if it contains broadcast messages; and\
    \ the third checks that it does not contain private messages to other users.\n\
    \nCreate a file called listen_to_messages_test.js and paste in the following code\
    \ to create our test suite:\n\n```\nlet assert = require('assert');\nlet mockDataSourceFactory\
    \ = require('./mock_datasource_factory');\nlet servicesFactory = require('../src/services');\n\
    \ndescribe('Listen to message Test',function(){\n    it('Must listen to messages\
    \ sent to me',function(done){\n        let mockDataSource = mockDataSourceFactory();\n\
    \        let services = servicesFactory(mockDataSource);\n        let me = 'John\
    \ Doe';\n        let content = 'foobar';\n        let message = {to:me,content:content};\n\
    \        let subscription = services\n            .listenToMessages({me:me})\n\
    \            .subscribe(function(message){\n                assert.equal(message.to,me);\n\
    \                assert.equal(message.content,content);\n                subscription.dispose();\n\
    \                done();\n            });\n        mockDataSource.push(message);\n\
    \    });\n});\n```\n\nThe first test checks if the observable returned by the\
    \ sendMessage service contains messages for the given user. This test is similar\
    \ to the test for the sendMessage service, but here we are doing the opposite.\
    \ We subscribe to the observable returned by the listenToMessages() service and\
    \ directly push data to our mock DataSource on the last line of our test.\n\n\
    The next test will check if it contains a broadcast message:\n\n```\nit('Must\
    \ listen to messages sent to all',function(done){\n    let mockDataSource = mockDataSourceFactory();\n\
    \    let services = servicesFactory(mockDataSource);\n    let me = 'John Doe';\n\
    \    let content = 'foobar';\n    let message = {content:content};\n```"
