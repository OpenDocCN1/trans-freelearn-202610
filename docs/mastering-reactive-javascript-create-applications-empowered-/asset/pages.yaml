- pgno: 130
  md: "So, looking at the output in the console, it is easy to see the right answer:\
    \ an empty array is propagated.\n\nWe can also change the last example from the\
    \ `bufferWithCount()` operator, to calculate the average from the numbers in the\
    \ last 5 seconds every second. To do this, all we have to do is to use the operator\
    \ `bufferWithTime()` and adjust the time and `skipTime` parameters:\n\n```\nvar\
    \ randomNumbersObservable = Rx.Observable\n    .interval(100)\n    .map((i)=>Math.floor(Math.random()*100));\n\
    \nrandomNumbersObservable\n    .bufferWithTime(5000,1000)\n    .map((arr)=>{\n\
    \    var sum = arr.reduce((acc,b)=>acc+b);\n    return sum/arr.length;\n    })\n\
