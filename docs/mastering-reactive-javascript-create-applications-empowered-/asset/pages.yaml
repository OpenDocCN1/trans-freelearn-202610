- pgno: 121
  md: "This is illustrated in the following screenshot:\n\n![](img/8a5c36d94dc308a2a0fcf45ffa9cc27f_121_0.png)\n\
    \n# The pausable() observables\n\nThe last operator to implement the lossy technique\
    \ to deal with backpressure is the pausable() operator. This operator returns\
    \ a pausable() observable so we can pause it (and discard all the data while paused)\
    \ and resume it when we are ready to accept more data.\n\nThe pausable() method\
    \ has the following signature:\n\n```\nobservable.pausable();\n```\n\nAs you can\
    \ see, it doesn't accept any parameter.\n\nWe can see an example of the usage\
    \ of this operator in the following code:\n\n```\nvar pausableObservable = Rx.Observable\n\
    \    .interval(50)\n    .pausable();\npausableObservable.subscribe((i)=>console.log(i));\n\
    \npausableObservable.pause();\n\nsetTimeout(()=>{\n    pausableObservable.resume();\n\
    },2000);\n```"
  merge: -1
  img_proc: true
- pgno: 122
  md: "If you run this code, you will see the following output in your console:\n\n\
    ```\n0\n1\n2\n3\n//continues printing until you stop the program\n```\n\nIn this\
    \ example, we create an Observable which emits data every 50 milliseconds, but\
    \ we pause it right after the subscription, so no data is emitted. Then after\
    \ 2000 milliseconds, a function is called and we resume the observable, so it\
    \ starts to print the data.\n\n![](img/8a5c36d94dc308a2a0fcf45ffa9cc27f_122_0.png)\n\
    \nThis method works only with a hot observable. The observables created with the\
    \ interval() method are cold observables and for this reason no data was discarded.\n\
    \nNow let's check this method in a subject:\n\n```\nvar subject = new Rx.Subject();\n\
    var pausableObservable = subject.pausable();\n\npausableObservable.subscribe(\n\
    \  (i)=>console.log(i),\n  (err)=>console.log(err),\n  ()=>console.log('Finished')\n\
    );\n\npausableObservable.pause();\n\nsubject.onNext(0);\nsubject.onNext(1);\n\n\
    setTimeout(()=>{\n  subject.onNext(2);\n  subject.onNext(3);\n  subject.onCompleted();\n\
    },200);\nsetTimeout(()=>{\n  pausableObservable.resume();\n},2000);\n```"
  merge: -1
  img_proc: true
- pgno: 123
  md: 'We are using the same subject we used in all the examples in this session.
    The only change is that we pause it before we push any data and only resume it
    after all the data has been pushed, so if we run this code we will see this printed
    in the console:


    ```

    Finished

    ```


    All the data is discarded because the data was pushed while the observable was
    paused. This operation is illustrated in the following diagram:


    ![](img/8a5c36d94dc308a2a0fcf45ffa9cc27f_123_0.png)


    # Loss-less operators to deal with backpressure


    Loss-less strategies to deal with backpressure are the ones we must use when we
    can''t afford losing data. If you are using them to show messages in a web chat,
    you might want to buffer them.


    ![](img/8a5c36d94dc308a2a0fcf45ffa9cc27f_123_1.png)


    Be careful when using loss-less strategies to mitigate the problem of backpressure
    as this increases the memory your program will need.


    # Buffering


    The first loss-less technique to deal with backpressure is using a buffer to store
    the data, so we can process it in a batch.'
