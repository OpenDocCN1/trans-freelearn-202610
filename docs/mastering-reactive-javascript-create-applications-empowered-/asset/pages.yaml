- pgno: 97
  md: '# 4


    # Transforming Data - Map, Filter,

    and Reduce


    In the previous chapter, we started discussing the use of RxJS in our programs.
    To start using it, we compared Observables in Reactive Extensions with EventStreams
    and Properties in bacon.js. Then we looked at some of the most common sources
    of data we can use to create Observables, as follows:


    +   - Arrays

    +   - Range

    +   - Interval

    +   - Promises and callbacks

    +   - DOM events

    +   - Any arbitrary source


    After this initial overview of the RxJS API on how to create Observables, we learned
    how to subscribe to them so we are able to take action whenever new data is made
    available in the Observable. Subscribing to an Observable means being able to
    not only react to new incoming data, but also to take some action when an error
    occurs or an Observable finishes. To do this, we learned how to use the `subscribe()`
    method, using functions or by creating an Observer.


    We also learned how to use Subjects. Subjects allow us to create new Observables
    and keep pushing data to them.'
  merge: -1
  img_proc: true
- pgno: 98
  md: "RxJS gives us a lot more control of the life cycle of our Observables and even\
    \ our application. Also, in the previous chapter, we used Disposables and Schedulers.\
    \ They let us perform a teardown of our objects and control how we publish items\
    \ in our Observable sequences.\n\nWith all of the knowledge we have gathered,\
    \ so far we are now ready to add operators to our observables and make them more\
    \ reusable and testable.\n\nIn this chapter, we will have a look at the four operators\
    \ that are the backbone of any functional reactive program. They are as follows:\n\
    \n+   - map()\n+   - flatMap()\n+   - filter()\n+   - reduce()\n\nThese are the\
    \ most widely used/important operators. This chapter will be filled with lots\
    \ of examples that will help you understand the usage of these operators. If you\
    \ learn them well, they will make your road through functional reactive programming\
    \ a lot easier, enabling you to learn about more specific operators and also how\
    \ you can combine operators.\n\nIn this chapter, you will learn the following\
    \ topics:\n\n+   - Adding operators to Observables\n+   - Using the map() and\
    \ flatMap() operators\n+   - Using the filter() operator\n+   - Using the reduce()\
    \ operator\n\n# Adding operators to observables\n\nIn Chapter 2, Reacting for\
    \ the First Time, we used operators using bacon.js. They let us transform our\
    \ data before it reaches the subscribers of the given Observable. The operators\
    \ in RxJS work similar to the ones in bacon.js; some even have the same name.\
    \ They are just methods called from Observable objects, as you can see in the\
    \ following example:\n\n```\nRx.Observable\n  .just('Hello ')\n  .map((msg)=>msg+'World')\n\
    \  .subscribe((msg)=> console.log(msg));\n```"
  merge: -1
  img_proc: true
- pgno: 99
  md: "In this example, we created an Observable, which emits only one string, and\
    \ called the map() operator over this Observable and subscribed to it to show\
    \ the result in the console:\n\n```\nHello World\n```\n\n![](img/8a5c36d94dc308a2a0fcf45ffa9cc27f_99_0.png)\n\
    \nIf you can't recall the map() operator from Chapter 2, Reacting for the First\
    \ Time, don't worry! We will see more of it and what it does later in this chapter.\n\
    \nEvery time you call an operator over an observable, it returns a new observable\
    \ with the transformation applied. This way, we can chain multiples operators\
    \ easily, as follows:\n\n```\nRx.Observable\n.of(1,2,3)\n.map((num)=>num*2)\n\
    .filter((num)=> num>2)\n.subscribe((num)=>console.log(num));\n```\n\nIn the preceding\
    \ example, we created an Observable that emits three numbers. Then we called the\
    \ map() operator over this Observable to first transform data and then apply the\
    \ filter() operator to generate a new Observable. This code can also be written\
    \ in the following way:\n\n```\nvar initialObservable = Rx.Observable.of(1,2,3);\n\
    var initialMappedObservable = initialObservable\n    .map((num)=>num*2);\nvar\
    \ initialMappedAndFilteredObservable = initialMappedObservable\n    .filter((num)=>\
    \ num>2);\ninitialMappedAndFilteredObservable.subscribe((num)=>console.log(num));\n\
    ```\n\nBoth provide the same output when executed:\n\n```\n4\n6\n```\n\nEach of\
    \ the Observables that is created after you apply an operator can be subscribed\
    \ to, increasing the reuse of your code. Using operators, we can write cleaner\
    \ and more testable code as it lets us detach the origin of our data from what\
    \ to do with the data."
  merge: -1
  img_proc: true
- pgno: 100
  md: "# The map() operator\n\nThe map() operator is common when working with arrays\
    \ or any other kinds of sequences in functional languages and frameworks. In JavaScript,\
    \ array objects have a method called map(). This method is available in all modern\
    \ browsers now.\n\nThe map() operator calls the provided function once for each\
    \ element in the Observable. This function takes the object in the Observable\
    \ as input and returns another object. So the Observable returned by the map()\
    \ operator will propagate the result of calling the map function for each element\
    \ of the original Observable.\n\nThe provided function is called as soon as the\
    \ object is propagated by the original Observable; it is called in the same order.\n\
    \nSo the map() operator has the following signature:\n\n```\nobservable.map(mapFunction,\
    \ [thisContext]);\n```\n\nThe first parameter is mandatory and the second is optional:\n\
    \n+   - mapFunction: This is a function that takes an element of the observable\
    \ as input and returns another object to be propagated instead\n+   - thisContext:\
    \ This is any object to be used as the this (JavaScript context) of mapFunction\n\
    \nIf we have an Observable of numbers and want to create a new Observable by doubling\
    \ these numbers, we can use the map() operator, as follows:\n\n```\nRx.Observable\n\
    \  .of(1,2,3)\n  .map((i)=>i*2)\n  .subscribe((i)=>console.log(i));\n```\n\nIn\
    \ this code, first we created an Observable that propagated three numbers (1,\
    \ 2, and 3). Then, we applied the map() operator over this Observable; this created\
    \ a new Observable with the mapped objects. Then we subscribed to this Observable\
    \ to log all the elements. If you run the preceding code, you will see this output\
    \ in your console:\n\n```\n2\n4\n6\n```"
  merge: -1
  img_proc: true
- pgno: 101
  md: 'This operation can be represented by the following diagram:


