    As we discussed, your function can return any type; in our previous example we
    mapped a number to another number, but let''s see what happens if we map a number
    to a string:


    ```

    Rx.Observable

    .of(1,2,3)

    .map((i)=>''received number => ''+i)

    .subscribe((i)=>console.log(i));

    ```


    This code is also really simple and it has no margins for errors, so you probably
    already know that the output of the execution of this code is as follows:


    received number => 1

    received number => 2

    received number => 3


    Yes, really simple, just a string, but what happens if the function I have provided
    to my map() operator returns an Observable instead:


    ```

    Rx.Observable

    .of(1,2,3)

    .map((i)=>Rx.Observable.just(i+1))

    .subscribe((i)=>console.log(i));

    ```'
