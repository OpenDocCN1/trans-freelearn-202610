    # The map() operator versus the flatMap() operator


    These two operators are probably the most important and most used operators from
    functional reactive programming, and for this reason it is really important to
    know how to differentiate them.


    The map() operator lets you pass as a parameter a function that receives as input
    the data from the observable and returns new data that will be propagated instead.
    This new data can be of any type. You can see the map() operator in the following
    example:


    ```

    Rx.Observable

    .of(1,2,3)

    .map((i)=>i+1)

    .subscribe((i)=>console.log(i));

    ```'
