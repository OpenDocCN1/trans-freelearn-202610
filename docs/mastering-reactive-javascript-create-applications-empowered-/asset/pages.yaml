- pgno: 23
  md: '# 1

    What Does Being Reactive Mean?


    If you have bought this book, you have probably already heard about reactive programming
    (or even functional reactive programming). Nowadays, a lot of developers claim
    to use it in their own project; it is also easy to find posts on the Internet
    saying how amazing it is when compared with older paradigms. But, know you are
    doing a great job with the tools you have in your hands.


    Learning a new programming paradigm is really hard. Most of the time you don''t
    even know you needed it before you already mastered it, and you always have to
    ask yourself if this is really something that is worth the hours of studying or
    if it is just a new buzzword that all the cool kids are talking about, without
    adding real value to your programming skills.


    Maybe you have tried reactive programming before, even used it in a small project
    or, like me, you just thought it wasn''t worth a try, but for some reason you
    decided to give the paradigm an opportunity, (you are always thirsty for knowledge,
    I know, I was in your shoes a couple of years ago). It took me a lot of time to
    understand why I needed reactive programming and how to master it. I want to make
    sure that you have an easier path than I had.


    This book will guide you through the reactive programming principles, and using
    a lot of examples, I will show you how to process and combine different sources
    of data or events to create astonishing live applications. In this first chapter,
    we are going to use the `bacon.js` library just to understand the basics and then
    we will go deeper with **Reactive Extensions (RxJS)**.'
  merge: -1
  img_proc: true
- pgno: 24
  md: 'Before we dive into programming, you need to understand what reactive programming
    is and the problems it is designed to solve.


    This chapter will cover the following points:


    +   - Understanding what reactive programming is

    +   - Comparison between reactive programming and imperative programming

    +   - Knowing what problems reactive programming solves

    +   - Installation of the tools needed throughout this book

    +   - The first example of functional reactive programming will use a JavaScript
    library


    # The reactive paradigm


    Reactive programming is a paradigm where the main focus is working with an asynchronous
    data flow. You may read many books and see throughout the Internet that the reactive
    paradigm is about propagation of changes or some technical explanation that only
    makes it harder to understand.


    Imperative programming makes you describe the steps a computer must do to execute
    a task. In comparison, functional reactive programming gives you the constructs
    to propagate the changes so you can focus on what to do instead of how to do it.


    This can be illustrated in a simple sum of two numbers. In imperative programming
    a = b + c is evaluated only in that line of code, so if you change the value of
    b or c, it doesn''t change the value of a. But in a reactive programming world,
    you can listen for the changes. Imagine the same sum in a Microsoft Excel spreadsheet,
    and every time you change the value of the column b (or c), it recalculates the
    value of a, so you are always propagating the change for the ones interested in
    those changes.


    The truth is that you probably already use an asynchronous data flow every time
    you add a listener to a mouse click or a keystroke in a web page you pass as an
    argument to a function to react to that user input. So, a mouse click can be seen
    as a stream of events that you can observe and execute a function on when it happens.
    But this is only one usage of event streams.'
  merge: -1
  img_proc: true
- pgno: 25
  md: 'Reactive programming takes this to the next level–using it you can listen and
    react to changes in anything creating a stream of events from it, so you can react
    to changes in a variable or property, database, user inputs, external sources,
    and so on. For example, you can see the changes of value in a stock as an event
    stream and use it to show your user when to buy or sell in real time. Another
    common example for external sources streams is your Twitter feed or your Facebook
    timeline. Also, functional reactive programming gives you the possibility to filter,
    map, combine, buffer, and do a lot more with your streams of data or events. So
    using the stock example, you can easily listen to different stocks using a **filter
    function** to get the ones worth buying and show to the user a real time list
    of them, as shown in the following diagram:


    ![](img/8a5c36d94dc308a2a0fcf45ffa9cc27f_25_0.png)


    # Why do I need it?


    Functional reactive programming is especially useful when implementing one of
    these scenarios:


    +   - Graphical user interface

    +   - Animation

    +   - Robotics

    +   - Simulation

    +   - Computer vision'
  merge: -1
  img_proc: true
- pgno: 26
  md: 'A few years ago, all a user could do in a web app was fill a form with some
    data and post it to a server. Nowadays our web apps and mobile apps present to
    the user a richer interface, empowering them with real-time information and giving
    a lot more interaction possibilities. So, as the applications evolved, we needed
    more tools to achieve the new requirements.


    Using it you can abstract the source of your data to the business logic of your
    application–this lets you write more concise and decoupled code, improves the
    reuse, and leads to a more testable code as you can easily mock your streams to
    test your business logic.


    In this book we will use Reactive Extensions to explain and implement an example
    reactive application. Reactive Extensions are widely used in the industry and
    they have implementations for different languages (.Net, Scala, JavaScript, Ruby,
    Java, and so on) so you can easily translate the things you learn in this book
    to other languages.


    In my personal opinion, Reactive Extensions have some concepts which are hard
    to understand for those unfamiliar with reactive programming. For this reason,
    we will learn the basics using a more simple library (bacon.js), and as soon as
    you understand the basics and the concepts, I will give you more tools using RxJS.


    # Installation of tools


    Before we start to use reactive programming, we need to install the tools we will
    be using throughout this book.


    # Node.js


    We will be using node version 6.9.1, the most recent LTS version of nodes at the
    time of writing. You can find versions of it for Windows, Mac, and Linux at the
    following link:


    ```

    https://nodejs.org/en/download/releases/.

    ```


    ![](img/8a5c36d94dc308a2a0fcf45ffa9cc27f_26_0.png)


    We are going to use a lot of arrow functions throughout this book, so we expect
    you to have familiarity with this ES6 feature. You can run the codes described
    here in any node version above 4.x.'
  merge: -1
  img_proc: true
- pgno: 27
  md: '# bacon.js


    In this first chapter of this book we will be using bacon.js, which is a library
    for functional reactive programming in JavaScript. This library works in both
    server and client. We will use it to introduce you to some concepts of functional
    reactive programming as it is easier to get started. We will be using version
    0.7.88.


    To install it on your server, just run the following command inside a node project:


    ```

    npm i baconjs@0.7.88 -save

    ```


    To add it to an HTML page, just paste the following code snippet inside it:


    ```

    <script

    src="https://cdnjs.cloudflare.com/ajax/libs/bacon.js/0.7.88/Bacon.min.js">

    </script>

    ```


    ![](img/8a5c36d94dc308a2a0fcf45ffa9cc27f_27_0.png)


    Don''t worry with the version not being above 1.x; bacon.js is stable.


    # RxJS


    The last tool we need to follow in this book is RxJS; we will use this library
    in later chapters. This library also runs in both client and server and we will
    be using version 4.1.0.


    To install it on your server, just run the following command inside a node project:


    ```

    npm i rx@4.1.0 -save

    ```


    To add it to an HTML page, just paste the following code snippet inside it:


    ```

    <script src="https://cdnjs.cloudflare.com/ajax/libs/rxjs/4.1.0/rx.all.js">

    </script>

    ```


    ![](img/8a5c36d94dc308a2a0fcf45ffa9cc27f_27_1.png)


    For those using other package managers, you can also install bacon.js and RxJS
    from Bower and NuGet.'
  merge: -1
