  md: "# The groupBy() operator\n\nThis operator lets you group the values of an observable\
    \ sequence. It will generate an observable containing an observable for each group.\n\
    \nIt has the following signature:\n\n```\nobservable.groupBy(groupFunction,[valueSelector]);\n\
    ```\n\nIt receives two parameters, the first mandatory and the second optional:\n\
    \n+   - `groupFunction`: It is the function to decide which group a value belongs\
    \ to\n+   - `valueSelector`: It is a function to select the value to be propagated;\
    \ if none is specified, it propagates its own value\n\nA simple example usage\
    \ of this operator would be two odd and even numbers apart in an observable sequence:\n\
    \n```\nRx.Observable\n.of(0,1,2,3,4,5)\n.groupBy((i)=>i%2)\n.subscribe((obs)=>{\n\
    \  obs.toArray().subscribe((arr)=>console.log(arr))\n});\n```\n\nIn this example,\
    \ we use the groupBy() operator to take even and odd numbers apart, as it generates\
    \ an observable for each group, the parameter received by the subscription function\
    \ is an observable, we then turn it into an observable containing only an array\
    \ and log it; so if we run this code, we will see printed in the console an array\
    \ of even numbers and an array of odd numbers:\n\n```\n[ 0, 2, 4 ]\n[ 1, 3, 5\
    \ ]\n```\n\nAnother example usage of this operator using that second parameter\
    \ would be to group names by the first letter:\n\n```\nRx.Observable\n.of(\n \
    \ {name:'Mary',lastName:'Jane'},\n  {name:'John',lastName:'Doe'},\n  {name:'Jean',lastName:'Carter'},\n\
    \  {name:'Erich',lastName:'Oliveira'})\n.groupBy(\n  (person)=>person.name[0],\n\
    \  (person)=>person.name+' '+person.lastName\n```"
  merge: -1
