- pgno: 277
  md: 'If you can see this screen, congratulations! We are one step closer to implementing
    our web chat application. Now that we are able to serve the static file for our
    application, we must find a way to build the JavaScript file; to do this we will
    need to use browserify.


    The browserify receive as parameter a single file and will follow and add all
    the dependencies (require) of this file until it bundles everything in a single
    file. This file will contain all the code to run our web chat application. As
    we already installed browserify, all we have to do, is generate the file with
    the following command:


    ```

    browserify client/index.js -o static/bundle.js

    ```


    This command tells browserify to start with the index.js file in the client folder,
    and gather all dependencies to generate a file named bundle.js inside the static
    folder.


    After running this code, you should see the generated bundle.js file inside the
    static folder.


    ![](img/8a5c36d94dc308a2a0fcf45ffa9cc27f_277_0.png)


    Now we are going to prepare our package.json file, so we will always test and
    build our application before starting it. Do not worry if you do not know exactly
    how to change the package.json file as I will paste the final result of it.


    Let’s modify our package.json file on the root of our project, to use it to build
    our application. First, let’s add the tests for our server. As you probably remember–to
    test our server application, we must run the following command:


    ```

    mocha tests/*test.js

    ```


    So we must add this command to the test property, inside the scripts property
    in our package.json; now we can run our tests using the following command:


    ```

    npm test

    ```


    To run our project, we use the following command:


    ```

    node src/index.js

    ```


    So. we can add this command to the start property, inside the scripts property
    in the package.json file; now we can start our application using the following
    command:


    ```

    npm start

    ```'
