- pgno: 28
  md: '# Your first code using reactive programming


    Now that you have installed all the tools we need to create our first program
    using functional reactive programming, we can start. For this first program we
    will be using bacon.js.


    The bacon.js lets you work with events (which it calls EventStream) and dynamic
    values (which it calls Property). An EventStream represents a stream of events
    (or data), and it is an observable object where you can subscribe to be notified
    of new events on this stream. Bacon comes with a lot of built-in functions to
    create event streams from different sources such as button clicks, key strokes,
    interval, arrays, promises, and so on (and you can also create your own sources).
    A Property is an observable. Like an EventStream, the difference between both
    is that a Property has a current value. So every time you need to know of the
    changes and the current state of something, you will be using a Property; if you
    just want to be notified of the events and you don''t need to know the current
    state of something, then you use an EventStream. A Property can be created from
    an EventStream using the toProperty() or scan() methods from the bacon.js API.


    Like any other functional reactive programming, Bacon has a set of operators to
    let you work with your events, so you can map an event to something else, you
    can filter some events, you can buffer your events, you can merge different event
    sources, and a whole lot more.


    We will be running our first example on Node.js, so let''s get started:


    +   1. Open your terminal and create a folder for this first project.

    +   2. Now create a project:

    +      1. Navigate to the folder you have created.

    +      2. Type the following command:

    +   3. Keep hitting Enter to accept the default configuration.

    +   4. If you did it right, you should see a message like this printed in your
    console:


    ```

    npm init

    ```


    ```

    {

    "name": "example1",

    "version": "1.0.0",

    "description": "",

    "main": "index.js",

    "scripts": {

    "test": "echo \"Error: no test specified\" && exit 1"

    },

    }

    ```'
