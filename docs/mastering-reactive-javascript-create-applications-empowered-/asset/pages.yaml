  md: 'The easiest possible example is to use it to combine two observables:


    ```

    Rx.Observable

    .just(1)

    .concat(Rx.Observable.just(2))

    .subscribe((k)=>console.log(k));

    ```


    In this code we create an Observable sequence that contains only the element 1.
    We then use the concat() operator to concatenate it with an Observable sequence,
    which contains only the element 2, and we finally subscribe to log all elements
    in the final Observable. So if we run this code we will see the following output:


    1

    2


    This code can be explained by the following diagram:


