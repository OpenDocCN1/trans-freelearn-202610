- pgno: 202
  md: "Two tests passed: the test that checks if no data is propagated when the observable\
    \ is empty and the one that checks if all data is propagated when the filter()\
    \ function returns true; as we are returning the own observable it makes sense\
    \ that both of these tests were accepted, but two of our tests failed, as can\
    \ be seen in the previous screenshot.\n\nNow let's try to implement our function\
    \ using only the flatMap() operator. The filter() function must propagate the\
    \ data when the filter() returns true, and it must omit when it returns false;\
    \ we can easily propagate the data using flatMap() if we return an observable\
    \ using the just() method:\n\n```\nvar Rx = require('rx');\nmodule.exports = function(observable,filter){\n\
    \    return observable.flatMap(\n        (data)=>Rx.Observable.just(data)\n  \
    \  );\n};\n```\n\nWe do not even need to test it, as we know it will fail; we\
    \ need to find a way to omit the data based on the given filter.\n\nHow can we\
    \ omit data using flatMap()?\n\nThe answer is simple. We can return an observable\
    \ created with the method empty. Observables created with this method are empty\
    \ so they are going to omit the data in the results. The final part is to execute\
    \ the filter() function to decide if we must propagate the data.\n\nThe final\
    \ code for the function using only the flatMap() operator is as follows:\n\n```\n\
    var Rx = require('rx');\nmodule.exports = function(observable,filter){\n    return\
    \ observable.flatMap(\n        (data)=>{\n            if(filter(data)){\n    \
    \            return Rx.Observable.just(data);\n            }else{\n          \
    \      return Rx.Observable.empty();\n            }\n        }\n    );\n};\n```"
