- pgno: 93
  md: "In this section, we will use the dispose() method to unsubscribe from an observable.\n\
    \nTo create a Disposable, we can use the create() function from Rx.Disposable:\n\
    \n```\nvar disposable = Rx.Disposable\n    .create(()=>console.log('Releasing\
    \ allocated resources'));\n\ndisposable.dispose();\n```\n\nIf you run this code,\
    \ it will print the following message in your console:\n\n**Releasing allocated\
    \ resources**\n\nAs discussed earlier in this chapter, we can call the dispose()\
    \ method to unsubscribe from an observable. In some cases, we can even define\
    \ a Disposable to be used when someone calls the dispose() method from this observable\
    \ (remember the create() and createWithDisposable() functions to create an observable).\n\
    \nThe Disposable class also gives us functions to control groups of Disposable\
    \ objects. The two most important types of Disposable are CompositeDisposable\
    \ and RefCountDisposable.\n\nA CompositeDisposable() object wraps other Disposables.\
    \ So when you call the dispose() method of the parent object, it will call dispose\
    \ for all children. You can see this behavior in this example:\n\n```\nvar firstDisposable\
    \ = Rx.Disposable\n    .create(()=>console.log('disposing first'));\nvar secondDisposable\
    \ = Rx.Disposable\n    .create(()=>console.log('disposing second'));\n\nvar composite\
    \ = new\nRx.CompositeDisposable(firstDisposable,secondDisposable);\n\ncomposite.dispose();\n\
    ```\n\nIn this example, we create two Disposable objects (firstDisposable and\
    \ secondDisposable) and wrap them under CompositeDisposable() (composite). So\
    \ when we call the dispose() method of the CompositeDisposable() object (composite),\
    \ it will call the dispose() method of the two children as well (firstDisposable\
    \ and secondDisposable)."
  merge: -1
  img_proc: true
- pgno: 94
  md: "If you run this code, you will see the following output:\n\n```\n```\ndisposing\
    \ first\ndisposing second\n```\n```\n\nThe RefCountDisposable object does the\
    \ opposite. It takes a Disposable object and lets you distribute references to\
    \ this Disposable (using the getDisposable() method) but protects it from being\
    \ disposed unless all the references already have been disposed. This is really\
    \ useful to manage resources being used by multiple Observables/Observers.\n\n\
    This code shows a RefCountDisposable usage:\n\n```\n```\nvar disposable = Rx.Disposable.create(function\
    \ () {\n    console.log('releasing connection');\n});\n\nvar refCountDisposable\
    \ = new Rx.RefCountDisposable(disposable);\n\nvar firstDisposable = refCountDisposable.getDisposable();\n\
    var secondDisposable = refCountDisposable.getDisposable();\n\nfirstDisposable.dispose();\n\
    secondDisposable.dispose();\n\nconsole.log('first and second disposed. Disposing\
    \ refCount');\n\nrefCountDisposable.dispose();\n```\n```\n\nIf you run this code,\
    \ you will see the following output:\n\n```\n```\nfirst and second disposed. Disposing\
    \ refCount\nreleasing connection\n```\n```\n\nThe output shows that we need to\
    \ dispose everything to dispose the RefCountDisposable children.\n\n![](img/8a5c36d94dc308a2a0fcf45ffa9cc27f_94_0.png)\n\
    \nDisposables are an important feature to enhance the control of the life cycle\
    \ of your resources."
