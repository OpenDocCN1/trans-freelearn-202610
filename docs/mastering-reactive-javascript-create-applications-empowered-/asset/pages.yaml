    \ splittedUserInput.slice(1).join(' ');\n        return {\n            service:'command',\n\
    \            action:action,\n            content:content,\n            from:logged\n\
    \        };\n    }\n    if(value.indexOf('@')===0){\n        splittedUserInput\
    \ = value.split(' ');\n        userName = splittedUserInput[0].substring(1);\n\
    \        content = splittedUserInput.slice(1).join(' ');\n        return {\n \
    \           service:'sendMessage',\n            to:userName,\n            content:content,\n\
    \            from:logged\n        };\n    }\n    return {service:'sendMessage',content:value,from:logged};\n\
    }).merge(\n    Rx.Observable.of({service:'listenToMessages',me:logged})\n);\n\
    ```\n```\n\nHere we need to map the user input to the format of messages expected\
    \ by the server, and we will do this using the map() operator; the message can\
    \ follow one of four different patterns to call different services:\n\n+   - If\
