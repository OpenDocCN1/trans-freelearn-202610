  md: "Now let's slightly change our code to concatenate another Observable:\n\n```\n\
    Rx.Observable\n  .just(1)\n  .concat(\n    Rx.Observable.just(2),\n    Rx.Observable.just('Hello\
    \ World!!!')\n  ).subscribe((k)=>console.log(k));\n```\n\nAs we only added another\
    \ observable that emits the value 3, it is easy to understand the output of this\
    \ program, as follows:\n\n```\n1\n2\nHello World!!!\n```\n\nThis implementation\
    \ is possible because the concat() operator accepts multiple observables as parameters,\
    \ but the same program can also be written as follows:\n\n```\nRx.Observable\n\
    \  .just(1)\n  .concat(Rx.Observable.just(2))\n  .concat(Rx.Observable.just('Hello\
    \ World!!!'))\n  .subscribe((k)=>console.log(k));\n```\n\nIf we use the concat()\
    \ operator twice instead of calling it with two parameters, the result is the\
    \ same.\n\nAs we discussed before, the concat() operator keeps the order of the\
    \ input when generating the new Observable, and only emits data from the next\
    \ Observable when the current finishes. We can see this behavior doing a minor\
    \ change on our example, as follows:\n\n```\nRx.Observable\n  .just(1)\n  .concat(\n\
    \    Rx.Observable.interval(1000),\n    Rx.Observable.just('Hello World!!!')\n\
    \  ).subscribe((k)=>console.log(k));\n```"
