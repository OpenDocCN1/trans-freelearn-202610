    \ the last five items is: 62.6\n//... continues printing until you stop the program\n\
    ```\n\n# The bufferWithTime() operator\n\nThe next operator to buffer data lets\
    \ you buffer data for a certain amount of time. It's called bufferWithTime().\
    \ This operator will store data in an array until a given time is elapsed.\n\n\
    The bufferWithTime() method has the following signature:\n\n```\nobservable.bufferWithTime(time,\
    \ [skipTime], [scheduler]);\n```\n\nThe first parameter is mandatory and the other\
