- pgno: 161
  md: "# Using the zip() operator\n\nThis operator lets you merge the values of given\
    \ observables. It will run a given function for each element of each observable\
    \ of the same index. So if you have two observables and you zip them, it will\
    \ run your given function for the first element of the first observable and the\
    \ first element of the second observable. If more elements are available, it will\
    \ run the function for the second element of the first observable, the second\
    \ element of the second observable, and so on.\n\n![](img/8a5c36d94dc308a2a0fcf45ffa9cc27f_161_0.png)\n\
    \nThis operator is analogous to the zip() function of libraries such as underscore\
    \ and lodash.\n\nThis operator has the following signature:\n\n```\nRx.Observable.zip(observables,\
    \ [reduceFunction]);\n```\n\nIt receives an arbitrary number of arguments, and\
    \ the last is optional. In case of absence of the last parameter, it will only\
    \ generate an array with the values of each observable:\n\n+   - observables:\
    \ This is any number of observables to be zipped\n+   - reduceFunction: This is\
    \ a function used to combine the elements in a single value; if this function\
    \ is not provided, it will generate an array with the values\n\nA simple example\
    \ of zip() operator usage would be zipping two observables, each one containing\
    \ two values omitting the reduceFunction parameter, like you can see in the following\
    \ code:\n\n```\nvar namesObservable = Rx.Observable.of('John', 'Mary');\n\nvar\
    \ lastNamesObservable = Rx.Observable.of('Doe', 'Jane');\n\nRx.Observable.zip(\n\
    \    namesObservable,\n    lastNamesObservable\n).subscribe((k)=>console.log(k));\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 162
  md: "If you run this code you will see the following output in your console:\n\n\
    ```\n[ 'John', 'Doe' ]\n[ 'Mary', 'Jane' ]\n```\n\nThis code can be described\
    \ by this diagram:\n\n![](img/8a5c36d94dc308a2a0fcf45ffa9cc27f_162_0.png)\n\n\
    We can pass `reduceFunction` to make the output more interesting:\n\n```\nvar\
    \ namesObservable = Rx.Observable.of('John', 'Mary');\n\nvar lastNamesObservable\
    \ = Rx.Observable.of('Doe', 'Jane');\n\nRx.Observable.zip(\n    namesObservable,\n\
    \    lastNamesObservable,\n    (name,lastName) => name + ' ' + lastName\n).subscribe((k)=>console.log(k));\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 163
  md: "In this example, the given function will be executed for each pair, as the\
    \ function basically concatenates name and lastName. The Observable generated\
    \ by the zip() operator in this example contains the full name of John and Mary,\
    \ so when we subscribe() to it and log the result to the console we can see output\
    \ as follows:\n\n```\nJohn Doe\nMary Jane\n```\n\nThis operator can also be called\
    \ for more observables. In the following example we will zip three Observables:\n\
    \n```\nRx.Observable\n    .zip(\n        Rx.Observable.just(1),\n        Rx.Observable.fromPromise(Promise.resolve(2)),\n\
    \        Rx.Observable.just(3)\n    ).subscribe((k)=>console.log(k));\n```\n\n\
    When you run this code, you can see the following output:\n\n```\n[ 1, 2, 3 ]\n\
    ```\n\n![](img/8a5c36d94dc308a2a0fcf45ffa9cc27f_163_0.png)\n\nLooking at the output\
    \ from this last example is easy to see that the zip() operator gives the results\
    \ using the same order from the observables waiting for each element of the current\
    \ iteration to be available before propagating it.\n\nNow you might be wondering\
    \ what happens when one of the Observable finishes before the others. Let's check\
    \ this in the following example:\n\n```\nRx.Observable\n    .zip(\n        Rx.Observable.interval(100),\n\
    \        Rx.Observable.just('second'),\n        Rx.Observable.of('third', 'more\
    \ on third observable')\n    ).subscribe((k)=>console.log(k));\n```\n\nWhen we\
    \ run this code we see the following output in the console and the program exits:\n\
    \n```\n[ 0, 'second', 'third' ]\n```\n\n![](img/8a5c36d94dc308a2a0fcf45ffa9cc27f_163_1.png)\n\
    \nLooking at the output, it is easy to see that the Observable generated by the\
    \ zip() operator finishes when the first Observable being zipped finishes."
  merge: -1
  img_proc: true
- pgno: 164
  md: "# Using the zipIterable() operator\n\nThe zipIterable() operator works similarly\
    \ to the zip() operator. The only difference is it lets you zip observables with\
    \ JavaScript iterables objects such as arrays, sets, and maps.\n\nThis operator\
    \ has the following signature:\n\n```\nobservable.zipIterable(iterables,[reduceFunction]);\n\
    ```\n\nIt receives an arbitrary number of arguments, and the last is optional.\
    \ In case of absence of the last parameter, it will only generate an array with\
    \ the values:\n\n+   - `iterables`: This is any number of `iterables` to be zipped\
    \ with the observable\n+   - `reduceFunction`: This is a function used to combine\
    \ the elements in a single value; if this function is not provided, it will generate\
    \ an array with the values\n\nWe can do a minor change in our first example using\
    \ the zip() operator to use the zipIterable() operator over an iterables object:\n\
    \n```\nvar namesObservable = Rx.Observable.of('John', 'Mary');\n\nvar lastNamesArray\
    \ = ['Doe', 'Jane'];\n\nnamesObservable\n.zipIterable(lastNamesArray)\n.subscribe((k)=>console.log(k));\n\
    ```\n\nIf you run this code, you will see an output as follows:\n\n```\n[ 'John',\
    \ 'Doe' ]\n[ 'Mary', 'Jane' ]\n```\n\nWe can also change it to use a reduceFunction,\
    \ as we did with the zip() operator:\n\n```\nvar namesObservable = Rx.Observable.of('John',\
    \ 'Mary');\n\nvar lastNamesArray = ['Doe', 'Jane'];\n\nnamesObservable\n.zipIterable(\n\
    \  lastNamesArray,\n  (name,lastName) => name + ' ' + lastName\n).subscribe((k)=>console.log(k));\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 165
  md: "As we expect, the output is as follows:\n\n```\nJohn Doe\nMary Jane\n```\n\n\
    And for the last, we can use the same code with other forms of iterables such\
    \ as Set ():\n\n```\nvar namesObservable = Rx.Observable.of('John', 'Mary');\n\
    \nvar lastNamesArray = new Set(['Doe', 'Jane']);\n\nnamesObservable\n.zipIterable(\n\
    \  lastNamesArray,\n  (name,lastName) => name + ' ' + lastName\n).subscribe((k)=>console.log(k));\n\
    ```\n\n![](img/8a5c36d94dc308a2a0fcf45ffa9cc27f_165_0.png)\n\nThe zipIterable()\
    \ operator is similar to the zip() operator. It only makes it easier to interoperate\
    \ observables and regular iterables.\n\n# Summary\n\nIn this chapter, we focused\
    \ on the benefits of combining observables; we learned that we can use them to\
    \ run asynchronous tasks in parallel, avoid code repetition when listening to\
    \ multiple sources, and improve code reuse and readability.\n\nWe also learned\
    \ different operators to combine and unify observables. The most common and most\
    \ used observables for doing so are concat(), merge(), and zip().\n\nBut we also\
    \ learned about some other operators to combine observables as they give us more\
    \ tools to interoperate our code.\n\nUpto now we have just ignored possible errors\
    \ propagated by an observable. In the next chapter, the focus will be handling\
    \ these errors and creating tests for our functional reactive applications. So,\
    \ we will learn detecting errors in observables, handling errors in observables,\
    \ mocking observables, and testing functional reactive programs."
  merge: -1
