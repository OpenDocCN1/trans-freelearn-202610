  md: '# 5


    # The World Changes Too Fast - Operators to Deal with Backpressure


    In the last chapter, we learned how we can use an operator to transform the data
    emitted by an observable, and also how we can chain this operator, making it reusable
    as each operator creates a new observable which can be used by multiple observers.


    We learned how we can use the following four different operators:


    +   - `map()`

    +   - `flatMap()`

    +   - `filter()`

    +   - `reduce()`


    These operators are the most important and most used in functional reactive programming.
    We saw examples and diagrams to make sure we understood how we can use these operators.


    The usage of these operators goes beyond the last chapter. We will keep using
    them through the whole book, and we will use them heavily in the last two chapters,
    since we will create a client and server for a real-time web chat using functional
    reactive programming (with the `RxJS` library)


    In this chapter, we will cover a common problem in programs and how we can mitigate
    it using functional reactive programming operators. This problem is called **backpressure**.
    We will also cover more operators to filter data from our observables.'
