  md: "With this code, the program will unsubscribe from your observable. This way,\
    \ it exits normally and prints the following output:\n\n```\nevent happened\n\
    event happened\nevent happened\nunsubscribing\n```\n\n# Subscribing using the\
    \ log method\n\nSo far, every time we created an observable, we used the onValue()\
    \ method to listen to events in the observable. In our examples, we usually just\
    \ printed the value to the console,as this is common usage when testing observables\
    \ and operators bacon.js has a special method through which you can print all\
    \ the events to the console. All observables have the log() method. This method\
    \ prints every event to the console and prints the <end> string when the event\
    \ stream finishes. We can use it with EventStreams:\n\n```\nBacon\n  .fromArray([1,2,3,4,5])\n\
    \  .log();\n```\n\nThis code gives you the following output to the console:\n\n\
    ```\n1\n2\n3\n4\n5\n<end>\n```\n\nAs you can see, after all the events, it will\
    \ print the <end> string to indicate the end of the EventStream. If we decide\
    \ to use it with an infinite stream (a stream created with the interval() method),\
    \ it will never print the <end> string (as you should expect). Refer to the following\
    \ code:\n\n```\nBacon\n  .interval(100)\n  .log()\n```"
