- pgno: 60
  md: "# Observables' lazy evaluation\n\nIn bacon.js, an observable doesn't emit any\
    \ event unless someone is subscribed to listen to it. We can easily check this\
    \ behavior using doAction(). This operator lets us run an arbitrary function every\
    \ time an event is emitted from an observable.\n\nIf you create an observable\
    \ from an array and add a doAction() operator to log your events then, without\
    \ a subscription, it will print nothing to the console. So if you run the following\
    \ code, you will see your program doesn't give you any output:\n\n```\nBacon\n\
    .fromArray([1,2,3])\n.doAction((value)=>\n    console.log('running doAction')\n\
    );\n```\n\nAs you can see in this code, we have no subscriber for the EventStream.\
    \ This is why no event is emitted. However, if we add a subscriber to this EventStream,\
    \ we will see the program print running doAction for each value:\n\n```\nBacon\n\
    .fromArray([1,2,3])\n.doAction((value)=>\n    console.log('running doAction')\n\
    )\n.log();\n```\n\nThe preceding code gives you the following output:\n\n```\n\
    running doAction\n1\nrunning doAction\n2\nrunning doAction\n3\n<end>\n```\n\n\
    ![](img/8a5c36d94dc308a2a0fcf45ffa9cc27f_60_0.png)\n\nIt is really important to\
    \ keep this behavior in mind because ignoring this can lead to bugs that are really\
    \ hard to identify."
  merge: -1
  img_proc: true
