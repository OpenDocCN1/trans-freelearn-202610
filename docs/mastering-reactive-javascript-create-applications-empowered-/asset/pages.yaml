- pgno: 284
  md: "Now we must merge both observables to create an observable that propagates\
    \ when the Enter key is pressed or when the user hits the **Send message** button.\n\
    \nWe can do this with this code:\n\n```\nvar messageSubmitObservable = sendPressedObservable\n\
    .merge(enterPressedObservable)\n```\n\nWhen the user hits this button, he wants\
    \ to propagate the content of the message box, and we can implement this with\
    \ the map() operator:\n\n```\n.map(function() {\n  return document.getElementById('message_input').value;\n\
    })\n```\n\nThere is no reason to propagate data if the value is empty, so we also\
    \ add a filter to check if it has something to send:\n\n```\n.filter(function(message)\
    \ {\n  return message != \"\";\n})\n```\n\nAnd for the last, we want to erase\
    \ the content of the message box when the user sends the message, so we need to\
    \ add a side effect with the do() operator:\n\n```\n.do(function() {\n  document.getElementById('message_input').value='';\n\
    })\n```\n\nNow we have an observable that emits data every time a user wants to\
    \ send a message; this observable has the following code:\n\n```\nvar messageSubmitObservable\
    \ = sendPressedObservable\n  .merge(enterPressedObservable)\n  .map(function()\
    \ {\n    return document.getElementById('message_input').value;\n  }).filter(function(message)\
    \ {\n    return message != \"\";\n  }).do(function() {\n    document.getElementById('message_input').value='';\n\
    \  });\n```\n\nIn this file we wanted to map all possible user inputs, so the\
    \ last thing we need to do is to export this observable, so another file can map\
    \ the messages and send it to the server:\n\n```\nmodule.exports=messageSubmitObservable;\n\
    ```"
