- pgno: 244
  md: "# Implementing the server\n\nTo implement our server, we need to implement\
    \ the three parts of our system described in the previous example. We will first\
    \ create our data source, then our WebSocket server, and finally our services\
    \ and their tests.\n\n# DataSource\n\nAs we have no interest in keep the history\
    \ of messages nor in implementing a login for our server (the users are going\
    \ to just type a name and this name will be used), we can use a simple observable\
    \ to implement our DataSource; this DataSource will contain only the messages\
    \ sent from user to user and broadcast messages.\n\nOur DataSource must have two\
    \ methods: the first to push new messages, and the second to listen to incoming\
    \ messages. We can use a RxJS Subject to implement this behavior as it lets us\
    \ push data to our observable. We could also user an observable using the create()\
    \ method to create it from an arbitrary source, but the code with a Subject will\
    \ be a lot easier to read and to understand:\n\n```\nlet Rx = require('rx');\n\
    let messagesSubject = new Rx.Subject();\nmodule.exports = {\n  push(data){\n \
    \   messagesSubject.onNext(data);\n  },\n  get(){\n    return messagesSubject;\n\
    \  }\n};\n```\n\nIn this code, we executed the following steps:\n\n+   1. Created\
    \ a Subject and stored it in the messagesSubject variable.\n+   2. Exported an\
    \ object containing two methods:\n+      - The first method is the push() method,\
    \ which only calls the onNext() method of this Subject with the provided data\
    \ to push it through the Subject\n+      - The second method is the get() method,\
    \ which only returns our Subject so others can listen to data"
  merge: -1
  img_proc: true
- pgno: 245
  md: 'On our data source we could have just instantiated our Subject and exported
    it, but it would couple our data source to an RxJS implementation, and every file
    requiring it would have to know it needed to use the method onNext () to push
    data. This is not a problem now, as this is just an example application, but it
    will be a problem as soon as we add Redis (or any other database), and for this
    reason I decided to create this object instead of just exporting the Subject object.


    ![](img/8a5c36d94dc308a2a0fcf45ffa9cc27f_245_0.png)


    I will not create tests for our data source for the same reason: we can easily
    create tests for it now, but as soon as we add any database to it, you would probably
    have to find a way to mock that database if you wanted to continue to test your
    data source, and this goes beyond the scope of this book.


    # Service to send messages


    The first service we will create is the service to send messages. This message
    can be sent to a single user (private) or to all users (broadcast).


    Our service will have the following signature:


    ```

    sendMessage (payload);

    ```


    This service does not have a return, and it receives only one parameter which
    is mandatory:


    +   - `payload`: This is an object containing the message to be sent; it must
    have up to three properties:

    +     - `from`: This property is mandatory, it is a string representing the user
    sending the message

    +     - `content`: This property is mandatory, it is a string representing the
    content of the message

    +     - `to`: This property is optional, it is a string representing the receiver
    of the message; if it is omitted, the message is sent to all users


    Our service must implement the following rules:


    +   - Must support sending a message to all users (broadcast)

    +   - Must support sending a message to a single user (private)

    +   - Cannot send a message if the payload is not provided

    +   - Cannot send a message without content (content property) or without a sender
    (from property)'
  merge: -1
  img_proc: true
- pgno: 246
  md: "Before we implement our service, we need to create a test for it.\n\n# Test\
    \ implementation\n\nIn the previous section we created our DataSource and, so\
    \ far, our DataSource consists of just an RxJS subject where we can push and listen\
    \ to data. However, our data source could be a database, and for this reason for\
    \ our tests we will always use a mock DataSource. So, let's implement our mock\
    \ DataSource; inside the tests folder create a file called mock_datasource_factory.js,\
    \ and paste in the following code:\n\n```\nlet Rx = require('rx');\nmodule.exports\
    \ = function () {\n    let messagesSubjectMock = new Rx.Subject();\n    return{\n\
    \        push(data){\n            messagesSubjectMock.onNext(data);\n        },\n\
    \        get(){\n            return messagesSubjectMock;\n        }\n    };\n\
    };\n```\n\nIn this code we export a function that, when executed, creates a Subject\
    \ and returns an object containing the methods push() and get() to send data and\
    \ to listen to data. Our implementation looks a lot like the original DataSource\
    \ implementation, but as we create a new Subject on every function call, we can\
    \ execute it in each test so each one has its own DataSource. This way a test\
    \ cannot impact on another test.\n\nNow, let's implement our tests; for this service\
    \ we need to implement only two tests: one to check if the method can send private\
    \ messages, and the other to check if it can send broadcast messages. A more complete\
    \ suite would also implement checks to see if the service enforces the payload\
    \ not to be null, and if it contains the from and content property, but it would\
    \ make our code bigger and harder to keep within the confines of a book, so let's\
    \ just keep our test simple.\n\nBefore we implement our tests, we must create\
    \ at least a dummy implementation of our services so we can test it: in the src\
    \ folder create a file called services.js and paste in the following code:\n\n\
    ```\nmodule.exports = function(dataSource){\n    return{\n        sendMessage(){},\n\
    \        command(){},\n    }\n}\n```"
