  md: "![](img/8a5c36d94dc308a2a0fcf45ffa9cc27f_49_0.png)\n\nThe assign() method is\
    \ just a synonym for the onValue() method.\n\n# Acting when an error occurs\n\n\
    In the previous sections, we saw how to encapsulate an error on bacon.js. Now,\
    \ we will use the onError() method to take an action whenever this happens. This\
    \ method has the same signature as that of the onValue() method and works similarly,\
    \ but only for bacon errors. Now with this method, we can change the code we used\
    \ in the previous section to print an error when it occurs. This is shown as follows:\n\
    \n```\nvar myCustomEventStream = Bacon.fromBinder(function(push){\n    push('some\
    \ value');\n    push('other value');\n    push(new Bacon.Error('NOW AN ERROR HAPPENED'));\n\
    \    push('Now the stream will finish');\n    push(new Bacon.End());\n});\nmyCustomEventStream\n\
    .onError((value)=>\n    console.log(value)\n);\n```\n\nIt will print the following:\n\
    \n**NOW AN ERROR HAPPENED**\n\n![](img/8a5c36d94dc308a2a0fcf45ffa9cc27f_49_1.png)\n\
    \nAs you might expect, the onError() method also returns a function to unsubscribe."
