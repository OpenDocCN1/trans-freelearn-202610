- pgno: 112
  md: 'In this chapter, we will cover the following topics:


    +   - What is backpressure?

    +   - How can we mitigate backpressure using RxJS?

    +   - Lossy strategies to deal with backpressure

    +   - Loss-less strategies to deal with backpressure

    +   - Buffering observables

    +   - Pausing observables

    +   - Operators to deal with backpressure

    +   - Operators to filter data


    # What is backpressure?


    When using functional reactive programming, we model our problems using streams
    of data or events (called observables), which can be transformed (using operators)
    and eventually will cause some effect (through an observer). Now imagine that
    we have an observable which emits data faster than our observer can process; this
    will lead to a problem called backpressure.


    This problem can also happen when we want to keep an observable running at a certain
    pace. Imagine that you want to log in to the console all the tweets from a certain
    hashtag, but you want to log at most one each for a few seconds to make sure the
    user can read the tweets. This also can lead to backpressure if the hashtags have
    more tweets per second than a human is capable of reading.


    Using RxJS, we have two possible strategies to deal with this problem.


    We can discard some data. You might not be interested in all the movements of
    your user mouse or all the tweets from a certain hashtag. You are only interested
    in the big picture.


    You can keep queuing the data until you are capable of process it or process it
    in a batch.'
  merge: -1
  img_proc: true
- pgno: 113
  md: '# Common strategies to deal with backpressure


    In RxJS we have several operators which can be used to mitigate the backpressure
    problem, they belong to two different family of strategies the lossy and the loss-less
    strategies. We will see each one in detail in this chapter.


    # Lossy strategies to deal with backpressure


    Lossy strategies to deal with backpressure are the ones we must use when we want
    to discard some data. As we discussed, you might not be interested in all the
    movements from your user mouse.


    ![](img/8a5c36d94dc308a2a0fcf45ffa9cc27f_113_0.png)


    Lossy strategies let you mitigate the problem of backpressure using constant memory,
    as we don''t keep any buffers.


    # The throttle() operator


    The first lossy technique to deal with backpressure is the throttle() operator.
    This operator lets you propagate the elements emitted by the observable at a certain
    interval.


    This operator is perfect for implementing rate limiting, such as the problem of
    showing tweets as fast as a human can read.


    The throttle() operator has the following signature:


    ```

    observable.throttle(interval, [scheduler]);

    ```


    The first parameter is mandatory and the second is optional:


    +   - interval: This is the time interval, in milliseconds, between the emission
    of data

    +   - scheduler: This is used to propagate the data'
  merge: -1
  img_proc: true
- pgno: 114
  md: 'The easiest way to show the usage of this operator is to apply it on an observable
    that already emits elements at a certain rate. We can use the throttle() method
    to further limit this rate and verify the response. We can do this by creating
    an Observable with the interval() method, as shown in the following example:


    ```

    Rx.Observable

    .interval(50)

    .subscribe((i)=>console.log(i));

    ```


    If you run this example, you will see a lot of number being printed really fast
    in your console:


    ```

    0

    1

    2

    3

    //continues printing until you stop the program

    ```


    But we can use the throttle() operator to control the rate of the output. Using
    this method, we will also discard some of our data, and for this reason, we won''t
    see the output in all the numbers being printed:


    ```

    Rx.Observable

    .interval(50)

    .throttle(1000)

    .subscribe((i)=>console.log(i));

    ```


    If you run this code, you will see an output as follows:


    ```

    0

    18

    37

    //continues printing until you stop the program

    ```


    ![](img/8a5c36d94dc308a2a0fcf45ffa9cc27f_114_0.png)


    The numbers printed in the console may vary in different executions.'
  merge: -1
  img_proc: true
- pgno: 115
  md: "This operation is illustrated in the following diagram:\n\n![](img/8a5c36d94dc308a2a0fcf45ffa9cc27f_115_0.png)\n\
    \nIn this example, we are using an infinite sequence. Now let's test this operator\
    \ in a finite observable and also apply it to a subject (so we don't forget how\
    \ we use subjects):\n\n```\nvar subject = new Rx.Subject();\n\nvar throttledObserver\
    \ = subject.throttle(50);\n\nthrottledObserver.subscribe(\n    (i)=>console.log(i),\n\
    \    (err)=>console.log(err),\n    ()=>console.log('Finished')\n);\n\nsubject.onNext(0);\n\
    subject.onNext(1);\n\nsetTimeout(()=>{\n    subject.onNext(2);\n    subject.onNext(3);\n\
    \    subject.onCompleted();\n},200);\n```"
