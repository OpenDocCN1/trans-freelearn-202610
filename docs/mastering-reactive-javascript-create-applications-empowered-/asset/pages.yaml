- pgno: 86
  md: "```\nresources');\n    };\n});\nvar subscription = observable.subscribe(\n\
    \    (i)=> console.log(i)\n);\nsubscription.dispose();\n```\n\nIf you run this\
    \ code, you will see the following output:\n\n```\n0\n1\n2\ndispose called: releasing\
    \ connections or other resources\n```\n\nAs can be seen, the function returned\
    \ by the parameter passed to the create() method is called when you call the dispose()\
    \ method on the subscription of the observable. We could also return a Disposable\
    \ object instead of a function to be executed when the dispose() method of the\
    \ subscription is called.\n\n![](img/8a5c36d94dc308a2a0fcf45ffa9cc27f_86_0.png)\n\
    \nWe will learn more about Disposable objects later in this chapter.\n\n# Subscribing\
    \ to changes (Observer)\n\nTo listen to data on an observable, we must call the\
    \ subscribe() method. This method returns a subscription, which we can use later\
    \ to stop reacting to the incoming data if we are no longer interested in it.\n\
    \nThe subscribe() method of observables has the following signature:\n\n```\n\
    observable.subscribe(onNext,onError,onCompleted);\n```\n\nAll parameters are optional\
    \ and can be omitted if we are not interested in this type of event:\n\n+   -\
    \ onNext: This is a function to be called every time new data is propagated through\
    \ the observable\n+   - onError: This is a function to be called every time an\
    \ error occurs in the observable\n+   - onCompleted: This is a function to be\
    \ called when the observable is completed"
  merge: -1
  img_proc: true
- pgno: 87
  md: "The easiest way to subscribe to an observable is to just pass the onNext parameter\
    \ (as we have been doing in most of our code snippets in this chapter):\n\n```\n\
    Rx.Observable\n.just('Hello World!!!')\n.subscribe((message)=>console.log(message));\n\
    ```\n\nIf you run the preceding code, it will print the Hello World!!! message\
    \ in your console.\n\nWe can also add an onError function to be called when an\
    \ error happens:\n\n```\nRx.Observable\n.throw(new Error('ops'))\n.subscribe(\n\
    \    (message)=>console.log(message),\n    (err)=>console.log('An error happened:\
    \ '+err.message)\n);\n```\n\nIf you run this code, you will see the following\
    \ output in your console:\n\n```\nAn error happened: ops\n```\n\nLastly, we can\
    \ also add the onCompleted() function to take an action when the observable is\
    \ completed:\n\n```\nRx.Observable\n.just('Hello World!!!')\n.subscribe(\n   \
    \ (message)=>console.log(message),\n    (err)=>console.log('An error happened:\
    \ '+err.message),\n    ()=>console.log('END')\n);\n```\n\nIf you run this code,\
    \ you will see the following output:\n\n```\nHello World!!!\nEND\n```\n\nAll subscriptions\
    \ have a method called dispose(). This method can be used to stop listening to\
    \ incoming data in the observable. We can test it in the following code:\n\n```\n\
    var subscription = Rx.Observable\n    .interval(100)\n    .subscribe(\n      \
    \  (message)=>console.log(message),\n        (err)=>console.log('An error happened:\
    \ '+err.message),\n        ()=>console.log('END')\n    )\n```"
  merge: -1
  img_proc: true
- pgno: 88
  md: "```\n) ;\n\nsetTimeout( () => subscription.dispose(), 290 );\n```\n\nAs illustrated\
    \ in the code, we first create an observable that would emit data every 100 milliseconds\
    \ and we subscribe to it. Then we use the `setTimeout()` function to call the\
    \ `dispose()` method of this subscription and stop listening to data from the\
    \ original observable.\n\nIf you run this code, you will see the following output\
    \ in your console:\n\n```\n0\n1\n```\n\n![](img/8a5c36d94dc308a2a0fcf45ffa9cc27f_88_0.png)\n\
    \nRemember, the `interval()` method will wait for 100 milliseconds before sending\
    \ the number 0. Then, it will wait for 100 milliseconds more to send the number\
    \ 1.\n\nIn RxJS, we also have a special class of objects called Observer. Basically,\
    \ this object wraps the functions `onNext()`, `onError()`, and `onCompleted()`\
    \ that you use to subscribe to an observable, giving you an extra layer of abstraction.\n\
    \nTo create an observer, we can use the `create()` method and then use this observer\
    \ to subscribe to an observable, as you can see in following code:\n\n```\nvar\
    \ observer = Rx.Observer.create(\n    (message) => console.log(message),\n   \
    \ (err) => console.log('An error happened: ' + err.message),\n    () => console.log('END')\n\
    );\n\nRx.Observable\n    .just('Hello World!!!')\n    .subscribe(observer);\n\
    ```\n\nIf you run this code, you will see the following output:\n\n```\nHello\
    \ World!!!\nEND\n```\n\n![](img/8a5c36d94dc308a2a0fcf45ffa9cc27f_88_1.png)\n\n\
    Observer is the object responsible for reacting to data sent by an Observable."
  merge: -1
  img_proc: true
- pgno: 89
  md: "# RxJS Subjects\n\nSubjects could be both an Observable and an Observer. They\
    \ can be seen as a pushable Observable; they let you add more data to be propagated\
    \ through them.\n\nSubjects expose three important methods: onNext(), onError(),\
    \ and onCompleted(). These methods can be used to send events through the observable\
    \ sequence. You can see their usage in the following example:\n\n```\n```js\n\
    var subject = new Rx.Subject();\n\nsubject.subscribe(\n    (message)=> console.log(message),\n\
    \    (err)=>console.log('An error happened: '+err.message),\n    ()=>console.log('END')\n\
    );\n\nsubject.onNext('Hello World!!!');\nsubject.onCompleted();\n```\n```\n\n\
    In this example, we created a new subject and subscribed to it, using the subscribe()\
    \ method. Then, we pushed data on this subject using the onNext() method, and\
    \ we finally finished it calling the onCompleted() method.\n\nIf you run this\
    \ code, you will see the following output:\n\n```\n```\nHello World!!!\nEND\n\
    ```\n```\n\nWe can also propagate an error through a subject using its onError()\
    \ method:\n\n```\n```js\nvar subject = new Rx.Subject();\n\nsubject.subscribe(\n\
    \    (message)=> console.log(message),\n    (err)=>console.log('An error happened:\
    \ '+err.message),\n    ()=>console.log('END')\n);\n\nsubject.onNext('Hello World!!!');\n\
    subject.onError(new Error('ops'));\n```\n```"
  merge: -1
  img_proc: true
- pgno: 90
  md: "First, we propagate the value Hello World, which will be printed in the console.\
    \ Then, we propagate an error. If you run the preceding code, you will see the\
    \ following output in your console:\n\n```\nHello World!!!\nAn error happened:\
    \ ops\n```\n\nThere is another type of subject called AsyncSubject (). It can\
    \ be used to represent the result of an asynchronous operation. An AsyncSubject\
    \ () can receive only one value, and this value is then cached for all future\
    \ subscriptions of this subject.\n\nAn example of AsyncSubject () creation can\
    \ be seen in the following code:\n\n```\nvar subject = new Rx.AsyncSubject();\n\
    \nsubject.subscribe(\n  (message)=> console.log(message),\n  (err)=>console.log('An\
    \ error happened: '+err.message),\n  ()=>console.log('END')\n);\n\nsubject.onNext('Hello\
    \ World!!!');\nsubject.onCompleted();\n```\n\nAs you can see, the only difference\
    \ to create it–when compared to a Subject–appears on the first line of code, where\
    \ we use new Rx.AsyncSubject () instead of new Rx.Subject (). If you run this\
    \ code, you will see the following output in your console:\n\n```\nHello World!!!\n\
    END\n```\n\nAs discussed earlier, an AsyncSubject () must be used to propagate\
    \ only one piece of data. So let's compare it with a regular Subject.\n\nFirst,\
    \ let's see what the output of a Subject would be when we call the onNext () method\
    \ multiple times:\n\n```\nvar subject = new Rx.Subject();\n\nsubject.subscribe(\n\
    \  (message)=> console.log(message),\n  (err)=>console.log('An error happened:\
    \ '+err.message),\n  ()=>console.log('END')\n);\n\nsubject.onNext(0);\nsubject.onNext(1);\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 91
  md: "```\n```\nsubject.onNext(2);\nsubject.onCompleted();\n```\n```\n\nIf you run\
    \ this code, you will have the following content printed in the console:\n\n```\n\
    ```\n0\n1\n2\nEND\n```\n```\n\nThis shows us that the Observer was fired three\
    \ times (for elements 0, 1, and 2). Now let's change our code to use an AsyncSubject():\n\
    \n```\n```\nvar subject = new Rx.AsyncSubject();\n\nsubject.subscribe(\n    (message)=>\
    \ console.log(message),\n    (err)=>console.log('An error happened: '+err.message),\n\
