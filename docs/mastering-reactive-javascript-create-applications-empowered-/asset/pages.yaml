- pgno: 239
  md: '# 10


    # A Real-Time Server


    In the last chapter, we covered an advanced topic in functional reactive programming,
    called the transducer. Transducers enable us to create a composition of transformations
    of data. One of the main advantages of transducers is the possibility of making
    your data transformations independent from the source of your data; with the `transducers-js`
    library we can use transducers on observables and in any iterable object.


    With transducers, we can:


    +   - Write better tests as it make it easy to decouple the source of the data
    to the transformations applied to it

    +   - Improve the performance of our code; as it skips the need for any intermediate
    iterable

    +   - Improve the maintainability of your code, when we compose transformations
    to create new transformations we can reuse them throughout our codebase, and avoiding
    code repetition is a good idea


    Throughout this book, we have learned:


    +   - What are observables?

    +   - What is an operator?

    +   - How can we listen to incoming data?

    +   - How can we transform incoming data?

    +   - How can we compose different sources of data?

    +   - How can we reuse sources of data?

    +   - How can we mitigate the problem of receiving data faster than we can process?

    +   - Two different frameworks to implement functional reactive programming in
    JavaScript'
