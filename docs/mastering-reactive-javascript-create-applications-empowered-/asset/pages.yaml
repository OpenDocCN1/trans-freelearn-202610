- pgno: 253
  md: "The results are in the console:\n\n![](img/8a5c36d94dc308a2a0fcf45ffa9cc27f_253_0.png)\n\
    \nThis shows all our tests failed, as expected.\n\n# Service implementation\n\n\
    All we have to do now is to implement our service. To do this, change the listenToMessages()\
    \ service in the file services.js to use this implementation:\n\n```\nlistenToMessages(payload,observable){\n\
    \    let me = payload.me;\n    observable = observable || dataSource.get();\n\
    \    return observable.filter(function(message){\n        return !message.to ||\
    \ message.to === me || message.from === me;\n    });\n}\n```\n\nOur service is\
    \ simple: on the first line we store the user, on the next line we store the observable\
    \ we will listen to; if no observable is provided we get the observable from the\
    \ DataSource containing all messages;, we then return the observable resulting\
    \ from applying a filter to check that the message does not have a to property\
    \ (broadcast), or if the to property is equal to the user (private), or if the\
    \ from property is equal to the user (the message sent by the user)."
