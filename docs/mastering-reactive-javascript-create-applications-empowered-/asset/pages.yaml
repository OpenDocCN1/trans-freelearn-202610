    # Summary


    In this chapter, we learned what functional reactive programming is and how it
    compares with imperative programming. We also learned where it comes from and
    modeled and implemented our first functional reactive program using the `bacon.js`
    library. We compared it with a program with and without `frp` and saw how it can
    improve our code maintainability and testability by separating the source of the
    events from the actions caused by them.


    In the next chapter, we will take a more in-depth look into the `bacon.js` library,
    and what we can do with event streams, and we will also start to model and implement
    more complex examples using new operators.'
