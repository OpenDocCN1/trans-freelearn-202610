    While this is not wrong and can be done, most of the time we are interested in
    the values of the observables, and at this moment the flatMap() operator comes
    to the rescue. This operator receives as a parameter a function that maps a given
    value to an observable, so the return of this function must always be an observable,
    and this operator will generate a new observable that propagates all values from
    all observables; it basically maps the values and then flattens your observable
    of observables.


    Here is the same code using flatMap():


    ```

    Rx.Observable

    .of(1,2,3)

    .flatMap((i)=>Rx.Observable.just(i+1))

