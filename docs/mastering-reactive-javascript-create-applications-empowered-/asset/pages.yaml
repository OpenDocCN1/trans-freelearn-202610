- pgno: 118
  md: "This code is slightly changed from another example from the throttle() method:\n\
    \n```\nvar subject = new Rx.Subject();\nvar sampledObserver = subject.sample(50);\n\
    \nsampledObserver.subscribe(\n    (i)=>console.log(i),\n    (err)=>console.log(err),\n\
    \    ()=>console.log('Finished')\n);\nsubject.onNext(0);\nsubject.onNext(1);\n\
    \nsetTimeout(()=>{\n    subject.onNext(2);\n    subject.onNext(3);\n    subject.onCompleted();\n\
    },200);\n```\n\nIf you run this code, you will see the following output:\n\n```\n\
    1\n3\nFinished\n```\n\nThis happens because the sample() operator will wait 50\
    \ milliseconds and send the last emitted data (the number 1). After more than\
    \ 50 milliseconds have elapsed, no data is emitted, so it doesn't propagate any\
    \ data. After 200 milliseconds, we push two numbers in the subject (2 and 3) and\
    \ complete it, so the sample() method will propagate the last (the number 3) and\
    \ finishes.\n\n# The debounce() operator\n\nThe next lossy technique for backpressure\
    \ is the usage of the debounce() operator. This operator emits data from the observable\
    \ only after a certain interval when the last emission from this observable has\
    \ passed.\n\nThis method is really useful to implement features such as search-as-you-type,\
    \ as we might not want to call our server for every keystroke from the user. Using\
    \ this method, we can let the user keep typing and search only when the user stays\
    \ a few milliseconds without typing anything.\n\nThe debounce() operator has the\
    \ following signature:\n\n```\nobservable.debounce(interval, [scheduler]);\n```"
  merge: -1
  img_proc: true
- pgno: 119
  md: "The first parameter is mandatory and the second is optional:\n\n+   - `interval`:\
    \ This is the time to wait in milliseconds\n+   - `scheduler`: This is used to\
    \ propagate the data\n\nThe first example for the `throttle()` operator uses an\
    \ `Observable` created from an `interval()`. Now let's change that example to\
    \ use the `debounce()` operator instead:\n\n```\nRx.Observable\n  .interval(50)\n\
    \  .debounce(1000)\n  .subscribe((i)=>console.log(i));\n```\n\nIf you run this\
    \ code, you will see nothing printed in the console because the `Observable` never\
    \ stays 1000 milliseconds without emitting a value, but let's assume we can debounce\
    \ 10 instead of 1000 as follows:\n\n```\nRx.Observable\n  .interval(50)\n  .debounce(10)\n\
    \  .subscribe((i)=>console.log(i));\n```\n\nIn this case, you will see this printed\
    \ in your console:\n\n```\n0\n1\n2\n3\n//continues printing until you stop the\
    \ program.\n```\n\nThis operation is illustrated in the following diagram:\n\n\
    ![](img/8a5c36d94dc308a2a0fcf45ffa9cc27f_119_0.png)"
  merge: -1
  img_proc: true
- pgno: 120
  md: "Now let's see the example we discussed about a user typing too fast. Let's\
    \ check the following example:\n\n```\n<html>\n<head></head>\n<body>\n\n<input\
    \ type=\"text\" id=\"my_input\" />\n\n<ul id=\"my_ul\"></ul>\n\n<script\nsrc=\"\
    https://cdnjs.cloudflare.com/ajax/libs/rxjs/4.1.0/rx.all.js\"></script>\n\n<script>\n\
    Rx.Observable\n    .fromEvent(document.getElementById(\"my_input\"),\"keyup\"\
    )\n    .map(function(e){return e.target.value;})\n    .debounce(200)\n    .subscribe(function(text){\n\
    \        var node = document.createElement(\"li\");\n        var textnode=document.createTextNode(\"\
    CALLING THE SERVER WITH ==> \"+text);\n        node.appendChild(textnode);\n \
    \       document.getElementById('my_ul').appendChild(node);\n    });\n</script>\n\
    </body>\n</html>\n```\n\nIn this example, we create an HTML page with a text input,\
    \ a ul, to show the moments we are running our subscribe() function, and add the\
    \ RxJS library as a dependency. Then we have a script block with our script.\n\
    \nIn this script, we first create an Observable for every keyup event in the input\
    \ text, We map this event to the value of the input text (the text we typed),\
    \ as we don't want to run the subscription for every keystroke. We will debounce\
    \ it for 200 milliseconds, so we only call the observer if we stay more than 200\
    \ milliseconds without typing in the input text. Our observer creates a li with\
    \ the text to be used in the search. As we don't have any API to call, we will\
    \ only add this to the page."
