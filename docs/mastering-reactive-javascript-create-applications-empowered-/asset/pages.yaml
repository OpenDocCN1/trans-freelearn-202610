- pgno: 191
  md: '# 8


    # More about Operators


    In the last chapter, we learned how to handle errors in our reactive applications;
    we saw that, if we do nothing to handle errors on our observables, that they will
    be propagated, notifying all the observers of that observable and stopping the
    observable without ever calling the onCompleted() method of the observers. Besides
    that we learned a set of operators to change this behavior and have more control
    over errors, as follows:


    +   - `catch()`

    +   - `onErrorResumeNext()`

    +   - `retry()`

    +   - `mergeDelayError()`


    These operators give us more control over when to propagate the error and what
    to do in the event of an error.


    Another really important lesson from the last chapter was the implementation of
    tests for programs using functional reactive programming, as on this paradigm
    we are always using asynchronous computation and our test needs to be ready to
    support this behavior.


    The nature of functional reactive programming lets us decouple the source of our
    data from the effects of the occurrence of that data (observables and observers)
    and we learned how this helps us better architec of our tests, giving us more
    tools to test smaller chunks of code.


    In this chapter, we have the following two main objectives:


    +   - Review some of the lessons of this book using more advanced examples

    +   - Learn more advanced and important operators'
