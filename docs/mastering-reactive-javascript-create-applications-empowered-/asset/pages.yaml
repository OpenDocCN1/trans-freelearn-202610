  img_proc: true
- pgno: 264
  md: "For now, we've just imported reactive extensions, our DataSource, and created\
    \ our services. Now we need to start the server:\n\n```\nlet app = require('express')();\n\
    let http = require('http').Server(app);\nlet io = require('socket.io')(http);\n\
    http.listen(3000, ()=>console.log('Server listening on port 3000'));\n```\n\n\
    Here, we create an HTTP server, pass it to the socket.io library, and start it\
    \ to listen on the port 3000. Now we have to wait for connections: to do this\
    \ we create an Observable to listen to connection events:\n\n```\nRx.Observable.fromEvent(io,'connection')\n\
    ```\n\nWe create a subscription for it:\n\n```\nRx.Observable.fromEvent(io,'connection')\n\
    .subscribe(function(client) {\n});\n```\n\nNow we must implement the subscription,\
    \ and on the subscription we must listen to events from that client. The client\
    \ will send JSON as strings, so we need to parse it back to JSON. We also need\
    \ to call the right service; every time our service returns a new Observable,\
    \ we must switch to that Observable. Finally, we must stop our Observable when\
    \ the client disconnects:\n\n```\nfunction(client) {\n    let currentObservable\
    \ = null;\n    Rx.Observable.fromEvent(client, 'request')\n        .map((payload)=>JSON.parse(payload))\n\
    \        .flatMapLatest((payload)=> {\n            let serviceObservable = services[payload.service](payload,\n\
    currentObservable);\n            if(serviceObservable){\n                currentObservable\
    \ = serviceObservable;\n            }\n            return currentObservable;\n\
    \        })\n        .takeUntil(Rx.Observable.fromEvent(client,'disconnect'))\n\
    \        .subscribe(data => client.emit('message',data));\n}\n```\n\nThe first\
    \ thing we need to do is to create a variable to store our current Observable\
    \ being listened to; we need it because the blockUser() service must receive it\
    \ as a parameter. Then we create an Observable for all events of the type request\
    \ from our client, and map our payload into a JSON object using the map() operator."
  merge: -1
  img_proc: true
- pgno: 265
  md: "Now we have an Observable which emits the JSON object sent by the client. The\
    \ next step is to call the respective service. As we know our services might return\
    \ an Observable, and in this case we must use it, we need to store it in the currentObservable\
    \ variable; we use flatMapLatest instead of flatMap, because we want to keep only\
    \ the last Observable returned.\n\nWe also must finish our Observable when the\
    \ client disconnects, and we do this using the takeUntil() operator to finish\
    \ the Observable if a client sends a disconnect event.\n\nFinally, all we have\
    \ to do is send the message back to our user, and we do this by adding a subscription\
    \ in our observable.\n\nSo the following is the final code for our index.js file:\n\
    \n```\nlet Rx = require('rx');\nlet dataSource = require('./data_source');\nlet\
    \ services = require('./services')(dataSource);\nlet app = require('express')();\n\
    let http = require('http').Server(app);\nlet io = require('socket.io')(http);\n\
    http.listen(3000, ()=>console.log('Server listening on port 3000'));\n\nRx.Observable.fromEvent(io,'connection')\n\
    .subscribe(function(client) {\n  let observable = null;\n  Rx.Observable.fromEvent(client,\
    \ 'request')\n    .map((payload)=>JSON.parse(payload))\n    .flatMapLatest((payload)=>\
    \ {\n      let serviceObservable =\n        services[payload.service](payload,observable);\n\
    \      if(serviceObservable){\n        observable = serviceObservable;\n     \
    \ }\n      return observable;\n    })\n    .takeUntil(Rx.Observable.fromEvent(client,'disconnect'))\n\
    \    .subscribe(data => client.emit('message',data));\n});\n```\n\nThat is all\
    \ we need to implement a web chat using functional reactive programming with the\
    \ RxJS library. In our implementation, everything is happening on the same server.\
    \ Let's see how we can add more servers and make them communicate."
  merge: -1
  img_proc: true
- pgno: 266
  md: '# Scaling the server


    Currently our implementation cannot be used if we decide to deploy several servers.

    Imagine the scenario where user A connects to server A, and user B connects to
    server B; user A and user B cannot chat, because they are on different servers.


    To make users connected from different servers communicate, we need to find a
    way to make our server communicate, and we can do this using the Redis database.
    Among other amazing features, Redis supports what is called a publish/subscriber
    pattern. With this pattern, a server can publish a message, and all servers subscribed
    to listen to that message will receive it.


    With this feature Redis is the perfect database to solve our problem of server
    communication, so let''s see how we can connect to it to receive messages and
    also how we can change our data store to support it.


    # Connecting to Redis


    To use Redis database we need a library to connect to it, the most common library
    for node is called ioredis. This library is available on npm and have support
    to all features of Redis.


    To install ioredis just execute the following command in your project:


    ```

    npm install ioredis@2.5.0 --save

    ```


    As we discussed in the previous session, we will use Redis as a publish/subscriber
    broker for all messages in our web chat implementation.


    Before start using Redis, you need to install it in your machine, you can follow
    the instructions in the official website on how to install it.'
  merge: -1
  img_proc: true
- pgno: 267
  md: 'This diagram show what happens when a user send a message on an environment
    with multiple Node.js servers:


    ![](img/8a5c36d94dc308a2a0fcf45ffa9cc27f_267_0.png)


    This diagram shows an user (named User A) which is connected to a server (named
    Server A), this user then sends a message to Server A , this server then publishes
    this message in Redis, all servers are subscribed to listen to messages on Redis
    Server, then Redis send the message to all servers each of them, finally sent
    back the message to all connected users.


    This architecture is a simple implementation of how we could make several servers
    communicate, this is not intended to be the best architecture to solve this problem.'
