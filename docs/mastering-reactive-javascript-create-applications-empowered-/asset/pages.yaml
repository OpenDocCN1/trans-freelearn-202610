    In this example, we are always returning true or false, but we can also return
    any truthy or falsy value.


    ![](img/8a5c36d94dc308a2a0fcf45ffa9cc27f_105_1.png)


    A truthy value is any object that acts true when evaluated as a Boolean. Falsy
    values are those that act false when evaluated as a Boolean.'
