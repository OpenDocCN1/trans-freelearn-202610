- pgno: 35
  md: '# 2


    # Reacting for the First Time


    In the previous chapter, you started understanding the motivations behind using
    functional reactive programming in your systems; you also saw how a program using
    this paradigm fared against a program without it. You learned how reactive programming
    can improve code readability and testability by decoupling your event sources
    from the action you take when the action occurs.


    We started with some basic examples using `bacon.js` as the reactive programming
    library for JavaScript. In the examples, we began with creating our first EventStream
    from an interval. Then we started using some operators (`map()` and `take()`).
    Finally, we subscribed to this event source to take actions in the case of an
    event occurrence. This was just a kind introduction to functional reactive programming.


    When reading most of the functional reactive programming libraries (for any language),
    you will see a lot of diagrams explaining how the operator works. In the previous
    chapter, I presented the following diagram to illustrate a **filter function**:


    ![](img/8a5c36d94dc308a2a0fcf45ffa9cc27f_35_0.png)'
  merge: -1
  img_proc: true
- pgno: 36
  md: "We will cover what this illustration means in detail in this chapter. Learning\
    \ how to read this will make reading documentation on libraries a lot easier.\n\
    \nFunctional reactive programming is a paradigm which is hard to master, so after\
    \ the quick introduction, you'll now move on to learning how to implement more\
    \ complex programs using the bacon.js library.\n\nThis chapter will cover the\
    \ following points:\n\n+   - Understanding bacon.js observable objects (EventStream\
    \ and Property) and their differences\n+   - Modeling a functional reactive program\n\
    +   - Subscribing to an observable\n+   - Unsubscribing from an observable\n+\
    \   - Reading a reactive programming operator diagram\n+   - Using operators to\
    \ transform an observable\n\n# The bacon.js observables\n\nIn functional reactive\
    \ programming, an observable is an object where you can listen for events. This\
    \ way, you can, for instance, create an observable for a button and then listen\
    \ and act when a click happens.\n\nThe bacon.js gives you two flavors of an observable:\
    \ the first one is EventStream and the other is Property. We will see the difference\
    \ between the two objects later. To listen to events in an observable (or subscribe\
    \ to an observable), you can use the onValue() method with a callback. So if you\
    \ want to log every event in an EventStream, you can use the following code:\n\
    \n```\nmyEventStream.onValue(function(event){\n  console.log(event);\n});\n```\n\
    \n![](img/8a5c36d94dc308a2a0fcf45ffa9cc27f_36_0.png)\n\nWe will see how to create\
    \ an EventStream in more detail later."
  merge: -1
  img_proc: true
- pgno: 37
  md: "As we saw in the example in the last chapter, we can transform our observable\
    \ using bacon.js operators. These operators let us filter, combine, map, buffer,\
    \ and do a lot of other interesting things with our EventStream.\n\nAn observable\
    \ can either finish or stay open to propagate events forever; it can also contain\
    \ (and propagate) errors. We will see this in more detail later.\n\n# Creating\
    \ our first observable\n\nThe bacon.js gives us a multitude of methods to create\
    \ observables. We can create them from DOM events, promises, interval, and so\
    \ on. Sometimes we might need to create an observable from our own source, so\
    \ let's learn how to create our own event streams.\n\n# Observables from DOM events\
    \ (asEventStream)\n\nTo create an EventStream from DOM events (a mouse click for\
    \ instance), we will need an HTML page with jQuery (or Zepto.js); bacon.js adds\
    \ the asEventStream() method for all jQuery objects. So if we want to create an\
    \ EventStream from a button click, we can use the following code:\n\n```\nvar\
    \ clickEventStream = $('#myButton').asEventStream('click');\n```\n\nThis line\
    \ creates an EventStream from button clicks on a DOM object with the ID myButton.\
    \ If we want to execute an action every time this button is clicked, we will need\
    \ to use the onValue() method from this event stream. The following code shows\
    \ an alert on the screen every time the user clicks on the button:\n\n```\nclickEventStream.onValue(function(){\n\
    \  alert('Button clicked');\n});\n```\n\nThis code adds a function to be called\
    \ every time an event happens in this EventStream object, as it emits an event\
    \ every time myButton is clicked. The following code will show an alert every\
    \ time this button is clicked."
  merge: -1
  img_proc: true
- pgno: 38
  md: "As this is your first HTML code, I will paste the full HTML here so you can\
    \ create a file with it and test it in your own browser:\n\n```\n<html>\n    <head></head>\n\
    \    <body>\n        <button id=\"myButton\">CLICK</button>\n        <script src=\"\
    https://cdnjs.cloudflare.com/ajax/libs/jquery/3.1.1/jquery.min.js\"></script>\n\
    \        <script src=\"https://cdnjs.cloudflare.com/ajax/libs/bacon.js/0.7.88/Bacon.min.js\"\
    ></script>\n        <script>\n            var clickEventStream = $('#myButton').asEventStream('click');\n\
    \            clickEventStream.onValue(function(){\n                alert('Button\
    \ clicked');\n            });\n        </script>\n    </body>\n</html>\n```\n\n\
    # Observables from promises (fromPromise)\n\nYou can also create EventStreams\
    \ from ES6 promises or jQuery AJAX. These streams will contain only a single value\
    \ (or an error in case of failure), and finish. We will need a promise to test\
    \ this method:\n\n```\nvar promiseObject = Promise.resolve(10);\n```\n\nHere,\
    \ we are creating a successful promise that will return the value 10. To transform\
    \ this promise into an EventStream, we use the following code:\n\n```\nBacon\n\
    \    .fromPromise(promiseObject);\n```\n\n![](img/8a5c36d94dc308a2a0fcf45ffa9cc27f_38_0.png)\n\
    \nKeep in mind you will need Node.js version 4 or above, or a modern browser to\
    \ test this code (old browsers don't have promises implemented)."
  merge: -1
  img_proc: true
- pgno: 39
  md: "# Observable node event emitter (fromEvent)\n\nLots of Node.js modules implement\
    \ an event emitter, which is basically an object with the on () method that is\
    \ called every time an event happens. We can transform these objects into EventStreams\
    \ of bacon.js to take advantage of all the transformations. The method fromEvent\
    \ () has the following signature:\n\n```\nBacon\n    .fromEvent(eventEmitter,eventName);\n\
    ```\n\nThe parameters are eventEmitter; the node eventEmitter object; and eventName,\
    \ the name of the event. We can use the fs module to show the usage of this method.\n\
    \nTo read a file using the fs node module that uses an event emitter, we need\
    \ to create a readStream for the file using the following code:\n\n```\nvar fs\
    \ = require('fs');\nvar FILE_PATH = 'SOME FILE';\nvar readStream = fs.createReadStream(FILE_PATH,'utf8');\n\
    ```\n\nThen, subscribe to the events on this emitter using the on () method, as\
    \ follows:\n\n```\nreadStream.on('data',(content)=>console.log(content));\n```\n\
    \nTo transform this code into a code using a bacon.js EventStream, we need to\
    \ change the last line of the following code:\n\n```\nvar eventStream = Bacon.fromEvent(readStream,'data');\n\
    eventStream\n    .onValue((content)=> console.log(content));\n```\n\nSo comparing\
    \ with the method signature, our eventEmitter parameter is the readStream object\
    \ and eventName is data.\n\nThe fromEvent () method can also be used to listen\
    \ to DOM events (similar to the asEventStream() method), as you can see in the\
    \ following code:\n\n```\nvar clickEventStream =\nBacon.fromEvent(document.getElementById('#myButton'),\
    \ 'click');\n```"
  merge: -1
  img_proc: true
- pgno: 40
  md: "# Observables from an array (fromArray)\n\nTo create an observable from an\
    \ array, you can use the fromArray() method, as shown in the following code:\n\
    \n```\nvar myArray = [1,2,3];\nBacon\n  .fromArray(myArray);\n```\n\n# Observables\
    \ from an array (sequentially)\n\nTo create an observable from an array with a\
    \ given interval to deliver each item from the array, we can use the sequentially()\
    \ method, as follows:\n\n```\nvar myArray = [1,2,3];\nvar intervalBetweenItens\
    \ = 100;\nBacon\n  .sequentially(intervalBetweenItens ,myArray);\n```\n\nThis\
    \ code emits the itens of the array with 100 milliseconds of interval between\
    \ each emission.\n\n# Observables from an interval (interval)\n\nWe can create\
    \ an observable from an interval; this is especially useful if you wish to execute\
    \ repetitive tasks, and it can be used as a substitution for the setInterval()\
    \ method. An EventStream created by the interval() method will never end; this\
    \ method has the following signature:\n\n```\nBacon.interval(intervalInMilliseconds);\n\
    ```\n\nIt receives only one parameter, that is the interval between the events\
    \ in milliseconds, and it will emit an empty object as the event. Let's say you\
    \ have run the following code:\n\n```\nBacon\n  .interval(100)\n  .onValue((event)=>{\n\
    \    console.log(event);\n  });\n```"
  merge: -1
  img_proc: true
- pgno: 41
  md: "If so, you will see the following output:\n\n```\n{}\n{}\n{}\n{}\n```\n\nIt\
    \ will keep printing an empty object until you kill the program.\n\n# Observables\
    \ from other sources\n\nThe bacon.js has other built-in methods to create observables\
    \ from common EventStream sources. The objective of this chapter is not to explain\
    \ all the functions of the bacon.js API. You can check out other possible EventStream\
    \ sources by referring to bacon.js documentation. The last important method to\
    \ create an EventStream is the method that lets you create an EventStream from\
    \ any arbitrary source. This is the fromBinder() method.\n\nThe fromBinder() method\
    \ has the following signature:\n\n```\nBacon.fromBinder(publisher);\n```\n\nIt\
    \ receives a publisher function as a parameter; this is a function with only one\
    \ parameter that lets you push events for your EventStream, as illustrated in\
    \ the following example:\n\n```\nvar myCustomEventStream = Bacon.fromBinder(function(push){\n\
    \    push('some value');\n    push(new Bacon.End());\n});\n```\n\nThe following\
    \ code creates an EventStream that emits a string and then finishes the EventStream.\
    \ As you can see, Bacon.End() is a special object that tells bacon.js when to\
    \ close the EventStream.\n\nThe following example sends more events to the EventStream\
    \ and prints them to the console:\n\n```\nvar myCustomEventStream = Bacon.fromBinder(function(push){\n\
    \    push('some value');\n    push('other value');\n    push('Now the stream will\
    \ finish');\n    push(new Bacon.End());\n});\nmyCustomEventStream\n.onValue((value)=>\n\
    \    console.log(value)\n);\n```"
  merge: -1
  img_proc: true
- pgno: 42
  md: "If you run this code, you should see the following output:\n\n```\nsome value\n\
    other value\nNow the stream will finish\n```\n\nWhen we want to propagate an error\
    \ on our observable, we need to use the Bacon.Error() type to wrap the error.\
    \ The bacon.js is not capable of automatically encapsulating a thrown exception;\
    \ you always need to encapsulate it manually. It is also important to notice that\
    \ when an error occurs, bacon.js doesn't end your observable (but you can configure\
    \ it). Let's change the previous code to add an error as follows:\n\n```\nvar\
    \ myCustomEventStream = Bacon.fromBinder(function(push){\n    push('some value');\n\
    \    push('other value');\n    push(new Bacon.Error('NOW AN ERROR HAPPENED'));\n\
    \    push('Now the stream will finish');\n    push(new Bacon.End());\n});\nmyCustomEventStream\n\
    \    .onValue((value)=>\n        console.log(value)\n    );\n```\n\nIt will give\
    \ you the same output and ignore your error, as you haven't added a handler for\
    \ errors in this observable (we will see later how to add a handler using the\
    \ onError() method). But if we want to finish the observable as soon as an error\
    \ happens, we can call the endOnError() method to our observable, as you can see\
    \ in this code:\n\n```\nvar myCustomEventStream = Bacon.fromBinder(function(push){\n\
    \    push('some value');\n    push('other value');\n    push(new Bacon.Error('NOW\
    \ AN ERROR HAPPENED'));\n    push('Now the stream will finish');\n    push(new\
    \ Bacon.End());\n}).endOnError();\nmyCustomEventStream\n    .onValue((value)=>\n\
    \        console.log(value)\n    );\n```\n\nIt will give you the following output:\n\
    \n```\nsome value\nother value\n```"
