- pgno: 95
  md: '# RxJS Schedulers


    Schedulers are used to determine where a task is going to be executed (current
    thread, thread pool, and so on).


    You can use them to run any type of task that you want, but RxJS Observables use
    schedulers to propagate data. For this reason, you can optionally define a Scheduler
    when creating a new Observable.


    As you might expect, having control of which execution context you task should
    run in (or your Observable should process elements in) is specially useful when
    you are running in a multithread environment.


    ![](img/8a5c36d94dc308a2a0fcf45ffa9cc27f_95_0.png)


    As RxJS runs in a single-thread environment, other than the default settings,
    you should be really cautious when using a scheduler to propagate data from an
    Observable. Incorrect use can block your thread.


    # Summary


    In this chapter, you learned the basics of functional reactive programming using
    RxJS, and it became clear that it is a more extensive framework.


    We started to use different objects such as Observables, Observers, Subjects,
    Disposables, and Schedulers.


    Some of these concepts don''t even exist in the bacon.js world, and they give
    us more power over our code.


    With Subjects, you learned how to create an Observable using a push style.


    With Disposable, you gained more control over the life cycle of your code, as
    it lets you tear down your resources gracefully.


    With Schedulers, you learned that if you want, you can control in which context
    your code will be executed, giving you more power over how Observables would propagate
    data. You also learned the importance of avoiding schedulers, other than the default
    ones, when using RxJS.'
  merge: -1
  img_proc: true
