- pgno: 106
  md: 'Falsy values are as follows:


    +   - False

    +   - 0

    +   - ""(empty string)

    +   - Null

    +   - Undefined

    +   - NaN


    All other values available in JavaScript are truthy values.


    The following is an example that filters an Observable for only truthy values:


    ```

    Rx.Observable

    .of(0,1,"hello",null,"")

    .filter((i)=> i )

    .subscribe((i)=>console.log(i));

    ```


    If you run the preceding code, you will see this output:


    ```

    1

    hello

    ```


    ![](img/8a5c36d94dc308a2a0fcf45ffa9cc27f_106_0.png)


    There is an alias for this operator called where.


    # The reduce() operator


    The reduce() operator lets you run a function to accumulate all the values of
    an Observable to generate a new Observable containing only one value (the accumulated
    value).


    This operator has the following signature:


    ```

    observable.reduce(accumulatorFunction,[initialValue]);

    ```'
  merge: -1
  img_proc: true
- pgno: 107
  md: 'The first parameter is optional and the second one is mandatory:


    +   - `accumulatorFunction`: This is a function that is used to accumulate values
    from an observable. This function can receive up to four parameters:

    +     - `acc`: This is an accumulated value

    +     - `currentValue`: This is the value used in this iteration

    +     - `currentIndex`: This is a zero-based index of this iteration

    +     - `source`: This is the observable used

    +   - `initialValue`: This is the initial accumulator


    We can use this function to sum up all the values in an Observable containing
    numbers, as follows:


    ```

    Rx.Observable

    .of(1,2,3)

    .reduce((acc,current)=>acc+current)

    .subscribe((i)=>console.log(i));

    ```


    In this example, we first create an Observable that will propagate three numbers
    (1, 2, and 3). Then, we apply the reduce() operator over this Observable; this
    will create a new Observable with only one value, and the value will be the sum
    of each element in this sequence.


    This method runs in the following iteration:


    +   1. If an initial value is supplied, we use it as the accumulator and the first
    element in the sequence as the current value; if not, we use the first element
    in the sequence as the accumulator and the second as the current value.

    +   2. Run `accumulatorFunction` for the accumulator and the current value.

    +   3. Set the current value as the next element in the sequence.

    +   4. Go back to step 2 until you process the whole list.


    So if you run the preceding code, you will see following output:'
  merge: -1
  img_proc: true
