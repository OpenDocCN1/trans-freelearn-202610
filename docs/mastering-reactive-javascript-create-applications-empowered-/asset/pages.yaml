- pgno: 170
  md: 'In functional reactive programming, we have different strategies to deal with
    errors, which we will see in this section.


    # Acting when an error occurs


    When an error occurs, the observable stops sending new data. We can use different
    strategies, such as switching to another observable or retry, but these are more
    advanced so first we will see how an observer can be notified by an error. As
    you probably remember, the subscribe() method from the observable object lets
    you pass up to three functions or allows an observer to be notified when an error
    occurs.


    Take a look at the following signature:


    ```

    observable.subscribe([onNext], [onError], [onCompleted]);

    ```


    The parameters are optional:


    +   - onNext: This function is to be called when new data is available in this
    observable. The function receives the data itself as a parameter.

    +   - onError: This function is to be called when an error is propagated through
    this observable. This function received the Error as a parameter.

    +   - onCompleted: This function is to be called when the observable is exhausted
    and all the data has already been propagated.


    This method also has an overloaded implementation with the following signature:


    ```

    observable.subscribe(observer);

    ```


    It accepts this single parameter:


    +   - observer: The observer object is to be notified when some data is available,
    an error happens, or the observable is exhausted. The observer has specific methods
    for each of these possible events.'
  merge: -1
  img_proc: true
- pgno: 171
  md: "So, we have two possible ways to be notified of an error in an observable;\
    \ the first is as follows:\n\n```\nRx.Observable\n.throw(new Error('An error occurred'))\n\
    .subscribe(\n  (data)=> console.log(data),\n  (e)=> console.log('ERROR'),\n  ()=>console.log('finished')\n\
    );\n```\n\nThe second, is an implementation explicitly using an observer object:\n\
    \n```\nvar observer = Rx.Observer\n.create(\n  (data)=> console.log(data),\n \
    \ (e)=> console.log('ERROR'),\n  ()=>console.log('finished')\n);\nRx.Observable\n\
    .throw(new Error('An error occurred'))\n.subscribe(observer);\n```\n\nThe two\
    \ implementations are equivalent, and if you run either of these codes, you will\
    \ see the following output:\n\n```\nERROR\n```\n\nAs you can see the onCompleted()\
    \ function is not called when an error is propagated to the observer.\n\nAs we\
    \ have already discussed, when an error occurs the observable stops. We can see\
    \ this behavior in the following code:\n\n```\nvar observable = Rx.Observable.create(function(source){\n\
    \  source.onNext(1);\n\n  source.onError(new Error('An error occurred'));\n\n\
    \  source.onNext(2);\n  source.onCompleted();\n});\n\nobservable.subscribe(\n\
    \  (data)=> console.log(data),\n  (e)=> console.log('ERROR'),\n  ()=>console.log('finished')\n\
    );\n```"
  merge: -1
  img_proc: true
- pgno: 172
  md: 'In this code, we create an `observable` that will call first the `onNext()`
    with the 1, then the `onError()` with an `Error` object, then again the `onNext()`
    with 2, and finally the `onCompleted()` method. If you run this code, you will
    see the following output:


    ```

    1

    ERROR

    ```


    As we expected, it stopped propagating any data or event after the error. This
    is the default behavior but sometimes we might need other tools to treat our errors
    before it gets to the observer, and we will see these strategies in the next section.


    # Treating an error


    In the last section, we learned to react to errors on our observer, but we have
    other strategies to deal with errors before propagating them to our observers.
    These strategies include the following points:


    +   - Fallback to a different observable

    +   - Retry the computation of this observable

    +   - Delay the delivery of the error


    These strategies can be implemented using operators that we will explore in the
    chapter.


    # The catch() operator


    The `catch()` operator lets you try another observable. When an error occurs it
    can be used at the class or instance level.


    At the class level, the `catch()` operator has the following signature:


    ```

    Rx.Observable.catch(observables);

    ```


    As you can see, it receives an arbitrary number of arguments:


    +   - `observables`: It is an arbitrary number of observables to be used as fallback
    in the first failure. They are attempted from left to right until an `Observable`
    succeeds.'
  merge: -1
  img_proc: true
- pgno: 173
  md: "The simplest way to see this operator in action is with the following example:\n\
    \n```\nRx.Observable.catch(\n    Rx.Observable.throw(new Error('An error occurred')),\n\
    \    Rx.Observable.just('Hello')\n).subscribe(\n    (m)=> console.log(m),\n  \
    \  (e)=> console.log('Error found')\n);\n```\n\nIn this example, we call catch()\
    \ from the Observable class, so it will try the first Observable. As this Observable\
    \ fails (it was created using throw()), it will try the next one, which succeeds.\
    \ Then this Observable is propagated, notifying the observer of the data, so when\
    \ you run this code you will see the Hello message printed in your console.\n\n\
    Now, let's see what happens if the first observable emits some data, before propagating\
    \ any error:\n\n```\nvar observableWithError = Rx.Observable.create(function(source){\n\
    \    source.onNext(1);\n\n    source.onError(new Error('An error occurred'));\n\
    \n    source.onNext(2);\n    source.onCompleted();\n});\n\nRx.Observable.catch(\n\
    \    observableWithError,\n    Rx.Observable.just('Hello')\n).subscribe(\n   \
    \ (m)=> console.log(m),\n    (e)=> console.log('Error found')\n);\n```\n\nIf you\
    \ run this code you will see the following output:\n\n```\n1\nHello\n```\n\nSo,\
    \ it will propagate all the data before the error to the observer and, when the\
    \ error happens, it will go to the next Observable."
  merge: -1
  img_proc: true
- pgno: 174
  md: "Now let's see what happens if the second Observable also fails, but we have\
    \ a third Observable:\n\n```\nRx.Observable.catch(\n  Rx.Observable.throw(new\
    \ Error('An error occurred')),\n  Rx.Observable.throw(new Error('Another error\
    \ occurred')),\n  Rx.Observable.just('Hello')\n).subscribe(\n  (m)=> console.log(m),\n\
    \  (e)=> console.log('Error found')\n);\n```\n\nIn this case, it will attempt\
    \ the first Observable, but as it fails it will attempt the second Observable.\
    \ As this also fails, it will attempt the third observable, which succeeds. If\
    \ you run this code you will see the Hello message printed in your console.\n\n\
    For the last example, let's see what happens when the first Observable succeeds:\n\
    \n```\nRx.Observable.catch(\n  Rx.Observable.just('Hello'),\n  Rx.Observable.just('Hello\
    \ again')\n).subscribe(\n  (m)=> console.log(m),\n  (e)=> console.log('Error found')\n\
    );\n```\n\nThe catch() operator works exactly like the try/catch block, so if\
    \ the attempted observable runs without any error, it will never pass the execution\
    \ for the following. This way, when you run this code you see the following output\
    \ in your console:\n\nHello\n\nThe catch() operator when used in an instance of\
    \ an Observable works the same way, using that Observable as the first attempt,\
    \ but it only accepts one parameter, as you can see in the following example:\n\
    \n```\nRx.Observable\n  .throw(new Error('An error occurred'))\n  .catch(Rx.Observable.just('Hello'))\n\
    \  .subscribe(\n    (m)=> console.log(m),\n    (e)=> console.log('Error found')\n\
    \  );\n```"
  merge: -1
  img_proc: true
- pgno: 175
  md: "This code works exactly like the previous one; as you expected, it will print\
    \ the Hello message in your console.\n\nIf you want multiple catch() in an Observable\
    \ instance, you will have to call the catch() operator multiple times:\n\n```\n\
    ```\nRx.Observable\n    .throw(new Error('An error occurred'))\n    .catch(Rx.Observable.throw(new\
    \ Error('Another error occurred')))\n    .catch(Rx.Observable.just('Hello'))\n\
    \    .subscribe(\n      (m)=> console.log(m),\n      (e)=> console.log('Error\
    \ found')\n    );\n```\n```\n\n# The onErrorResumeNext() operator\n\nThe operator\
    \ onErrorResumeNext() runs a list of observables from left to right, passing to\
    \ the next observable either when the current observable finishes, or when an\
    \ error occurs. This method is available in the Observable class and has the following\
    \ signature:\n\n```\n```\nRx.Observable.onErrorResumeNext(observables);\n```\n\
    ```\n\nAs you can see it receives an arbitrary number of arguments:\n\n+   - observables:\
    \ It is an arbitrary number of observables to be executed from left to right;\
    \ the next observable starts when the current finishes or fails.\n\nWe can use\
    \ some of the examples from the previous section, changing only the operator to\
    \ illustrate how the onErrorResumeNext() operator works:\n\n```\n```\nRx.Observable.onErrorResumeNext(\n\
    \  Rx.Observable.throw(new Error('An error occurred')),\n  Rx.Observable.just('Hello')\n\
    ).subscribe(\n  (m)=> console.log(m),\n  (e)=> console.log('Error found')\n);\n\
    ```\n```"
  merge: -1
  img_proc: true
- pgno: 176
  md: "In this code, the onErrorResumeNext () operator will create an Observable that\
    \ executes the first Observable and the second when the first fails; thus, when\
    \ you run this code you will see the Hello message printed in your console. However,\
    \ with this example we can not really distinguish it from the catch () operator,\
    \ so let's try a different example: we'll create three Observable, one of these\
    \ Observables will propagate a value and then fail, and the other two will propagate\
    \ a value each and completes with success. All three Observable can be seen in\
    \ the following code:\n\n```\nvar observableWithError = Rx.Observable.create(function(source)\
    \ {\n    source.onNext(1);\n\n    source.onError(new Error('An error occurred'));\n\
    \n    source.onNext(2);\n    source.onCompleted();\n});\nvar helloObservable =\
    \ Rx.Observable.just('Hello');\nvar helloAgainObservable = Rx.Observable.just('Hello\
    \ again');\n```\n\nNow, in the same program, let's use the onErrorResumeNext ()\
    \ operator and the catch () operator with the three Observable to compare the\
    \ output:\n\n```\nRx.Observable.onErrorResumeNext(\n    observableWithError,\n\
    \    helloObservable,\n    helloAgainObservable\n).subscribe(\n    (m)=> console.log('onErrorResumeNext\
    \ operator propagated ===> ' + m),\n    (e)=> console.log('Error found')\n);\n\
    ```\n\n```\nRx.Observable.catch(\n    observableWithError,\n    helloObservable,\n\
    \    helloAgainObservable\n).subscribe(\n    (m)=> console.log('catch operator\
    \ propagated===> '+m),\n    (e)=> console.log('Error found')\n);\n```"
  merge: -1
  img_proc: true
- pgno: 177
  md: 'The use of these operators in this example is simple. We only call each operator
    for the three observables and `subscribe()` to listen to data (or an error) in
    each of them so that we can compare the outputs. When you execute this program,
    you will see the following output in your console:


    ```

    onErrorResumeNext operator propagated ===> 1

    onErrorResumeNext operator propagated ===> Hello

    onErrorResumeNext operator propagated ===> Hello again

    catch operator propagated===> 1

    catch operator propagated===> Hello

    ```


    Looking at this output it''s easy to see that the `catch()` operator has the same
    behavior as the `try/catch` block from synchronous computation, while the `onErrorResumeNext()`
    attempts to execute all observables.


    ![](img/8a5c36d94dc308a2a0fcf45ffa9cc27f_177_0.png)


    The `catch()` operator tries an observable and handles the execution to the next
    only when it fails, while the `onErrorResumeNext()` executes all observables from
    left to right, passing to the next when the current one completes or fails.


    # The retry() operator


    This operator again lets you execute an `observable` a given number of times in
    the presence of an error. The most common use case is to do an HTTP call to a
    resource and retry a couple of times if an error happens. The `retry()` operator
    has the following signature:


    ```

    observable.retry(retryAttempts);

    ```


    It receives only one parameter:


    +   - `retryAttempts`: This is a number indicating the number of times this `observable`
    must be retried.


    To test this operator we will try to fetch the Google search page and retry it
    three times before propagating the error (you can change the Google page for any
    other URL). To do so, we will use the `request-promise` library, which fetches
    a URL using `promise()`, and then use the `fromPromise()` method to create an
    `Observable` from that `promise()`. First, we need to install the `request-promise`
    and the `request` library for node:


    ```

    npm i request@2.79.0 --save

    npm i request-promise@4.1.1 --save

    ```'
  merge: -1
  img_proc: true
- pgno: 178
  md: "Then we can use the following code to implement the described behavior:\n\n\
    ```\nvar Rx = require('rx');\nvar request = require('request-promise');\n\nRx.Observable.fromPromise(\n\
    \  request('http://www.google.com')\n).retry(3)\n.subscribe(\n  (htmlPage)=>console.log(htmlPage)\n\
    );\n```\n\nIf you execute this code you will see the Google page printed in your\
    \ console.\n\n![](img/8a5c36d94dc308a2a0fcf45ffa9cc27f_178_0.png)\n\nYou can try\
    \ this operator for any intermittent resource you have available to see exactly\
    \ how it works.\n\n# The mergeDelayError() operator\n\nThe last operator that\
    \ deals with errors in this chapter is the mergeDelayError() operator. When you\
    \ merge two or more observables (using the merge() operator), if an error is propagated\
    \ from one of the observables, it will be propagated to the generated observable\
    \ stopping it, as you can see in the following example:\n\n```\nvar observableWithError\
    \ = Rx.Observable.create(function(source){\n  source.onNext('hello');\n\n  source.onError(new\
    \ Error('An error occurred'));\n\n  source.onNext('hello again');\n  source.onCompleted();\n\
    });\n\nRx.Observable.merge(\n  observableWithError,\n  Rx.Observable.interval(100).take(4)\n\
    ).subscribe(\n  (m)=>console.log(m),\n  (e)=>console.log('Error')\n);\n```"
  merge: -1
  img_proc: true
- pgno: 179
  md: "In this example, we create an Observable that emits a value (1) and then an\
    \ error. We use the merge() operator to merge it with an Observable generated\
    \ from an interval() (where we take only four values). When you execute this you\
    \ will see the following output:\n\n```\nhello\nError\n```\n\nLooking at the output\
    \ we can see that the generated Observable only propagated the first element from\
    \ the first Observable. It didn't have the chance to propagate the Observable\
    \ created from the interval().\n\nNow, let's change this code to use the mergeDelayError()\
    \ operator instead:\n\n```\nvar observableWithError = Rx.Observable.create(function(source){\n\
    \  source.onNext('hello');\n\n  source.onError(new Error('An error occurred'));\n\
    \n  source.onNext('hello again');\n  source.onCompleted();\n});\n\nRx.Observable.mergeDelayError(\n\
    \  observableWithError,\n  Rx.Observable.interval(100).take(4)\n).subscribe(\n\
    \  (m)=>console.log(m),\n  (e)=>console.log('Error')\n);\n```\n\nIf you run this\
    \ code you will see the following output:\n\n```\nhello\n0\n1\n2\n3\nError\n```\n\
    \nNow the output has changed; the use of the mergeDelayError() was delayed (until\
    \ all the other observables had finished) to propagate the error.\n\nThe mergeDelayError()\
    \ has the following signature:\n\n```\nRx.Observable.mergeDelayError(...observables);\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 180
  md: 'It accepts any number of arguments, but they all must be observables:


    +   - `observables`: It is the `observables` to be merged


    This is enough information for now on how to deal with errors in RxJS.


    # Testing our application


    Testing an application is one of the main concerns for programmers. It does not
    matter what paradigms, languages, or frameworks you are using to develop your
    program, you must always be careful with your tests.


    A good test suite ensures better quality for your code and for your application.
    It can also be used by other programmers to help them read and understand your
    code, and it helps you decouple and improve the architecture for your program.


    This book is not about tests, so I will not try to evangelize them but I advise
    you to always test your code, and it''s vital. I will give you some advice and
    show how functional reactive programming can help you to decouple your code, increasing
    its testability.


    Before jumping in to any explanation or code, let''s learn the basics of unit
    testing in JavaScript. If you already test your JavaScript code, you can jump
    to the Testing applications using RxJS section.


    # Testing in the server


    The first thing you need when testing JavaScript applications is a test-runner.


    The test-runner is the program that gives you the tools to create your tests,
    executes them, and provide the test results. One very famous test-runner for Node.js
    is called mocha, and this is the runner we will be using in this book when doing
    tests on the server.


    First, we need to install it using the following command:


    ```

    npm install mocha@3.2.0 -save-dev

    ```'
