    \nFeel free to implement more tests to it as an exercise.\n\n# Filtering data\n\
    \nWe learned about some different operators to filter data from an observable;\
    \ the `filter()` operator is probably the most common and useful. When using this\
    \ operator you must provide a function to be used as a filter for each element\
    \ propagated by the observable; the return of this function will be used to decide\
    \ if the data should be propagated or not, and this is what happens when the result\
    \ of the function is evaluated, if the result is:\n\n+   - A truthy value: the\
    \ object is propagated\n+   - A falsy value: the object is omitted\n+   - The\
    \ falsy values are:\n+     - False\n+     - Null\n+     - Undefined"
  merge: -1
  img_proc: true
- pgno: 204
  md: "+   - 0\n+   - NaN (not a number)\n+   - \"\" (empty string)\n+   - The truthy\
    \ values are:\n+     - Any non-falsy value\n\nSo when you see the following code:\n\
    \n```\nRx.Observable\n  .interval(100)\n  .filter(\n    (i)=> i%3\n  )\n  .take(4)\n\
    \  .subscribe((i)=>console.log(i));\n```\n\nWhat values will be printed in the\
    \ console?\n\n+   1. 3,6,9,12\n+   2. 1,2,4,5\n+   3. 1,2,4\n+   4. 3\n\nThe correct\
    \ answer is option 2, that is:\n\n1\n2\n4\n5\n\nThis happens because we first\
    \ created an observable that generates consecutive numbers with the interval()\
    \ function; we then created a new observable containing filtered data from this\
    \ observable. The filter() function uses the % operator over the value, this operator\
    \ returns the rest of the division by the given number, so in our example the\
    \ filter() function returns the rest of the division between the number and three,\
    \ this function will return 0 for multiples of 3 and 1 or 2 otherwise, 0 is a\
    \ falsy value and 1 and 2 are truthy values, so the multiples of 3 are omitted;\
    \ we then create an observable from this containing only four elements with the\
    \ take() operator."
  merge: -1
  img_proc: true
- pgno: 205
  md: "All these operators create an observable containing the first four natural\
    \ numbers that are not multiples of 3, for this reason, option 2 (1,2,4, and 5),\
    \ is the correct answer.\n\n# Aggregating data\n\nThe most important operator\
    \ to aggregate data is the reduce() operator, as the other operators the reduce()\
    \ operator returns a new observable; in this case the observable returned contains\
    \ a single value that is the result of the execution of a function over all the\
    \ elements of the original observable.\n\nWe can use the reduce() operator to\
    \ find the lower numeric value in an observable:\n\n```\n```js\nRx.Observable\n\
    .of(1,5,0,9,56,-2,13)\n.reduce(function(a,b){\n  if(a<b){\n    return a;\n  }else{\n\
    \    return b;\n  }\n})\n.subscribe((i)=>console.log(i));\n```\n```\n\nIn this\
    \ example, the values from the observable are going to be scanned from left to\
    \ right, and the reduce() function is used to check which one is lower (the if/else\
    \ block), and then we log the result. Thus, as expected the result is:\n\n-2\n\
    \n![](img/8a5c36d94dc308a2a0fcf45ffa9cc27f_205_0.png)\n\nThe reduce() operator\
    \ can be used for mathematical operations; actually, RxJS contains some mathematical\
    \ operators such as min, max, and sum and each one can be easily implemented using\
    \ the reduce() operator. You can also use the reduce() operator for other operations\
    \ such as creating an array, a new object, concatenating strings, and so on; every\
    \ time you need to aggregate data the reduce() operator can be your ally.\n\n\
    # Going beyond the basics\n\nRxJS supplies a lot more than just operators to do\
    \ simple transformation in your data, we learned some more complex usages for\
    \ it and we will review the most important of it."
