- pgno: 291
  md: '# Improving interaction with RxJS


    One of the advantages of using functional reactive programming, is that it makes
    it easier to create rich user interfaces, creating new ways for the users to interact
    with your website. There are several ways to do this.


    In this section, we are going to create an Easter egg for our web chat application.
    Easter eggs are hidden functionalities that can be accessed following one or more
    steps.


    Our Easter egg will be accessed using a triple click in the message box. Every
    time a given user does a triple click in the message box we are going to fill
    the message box with the /roll_a_dice command.


    ![](img/8a5c36d94dc308a2a0fcf45ffa9cc27f_291_0.png)


    In this section, I want to show you how you can easily create new ways for your
    user to interact with your application using functional reactive programming.
    I''ve chosen to use a triple click, because it is not a standard interaction,
    and I will compare the code needed to implement it, with and without functional
    reactive programming.


    First let''s see how we can implement it using RxJS.


    To implement it, let''s change the events.js file inside the client folder, and,
    in the end of the file, let''s create an Observable to listen to clicks in the
    message box; we can do this with the following code:


    ```

    Rx.Observable

    .fromEvent(document.getElementById(''message_input''),''click'')

    ```


    Now we need to detect consecutive clicks in the message box in a certain timeframe;
    let''s say a triple click must occur in at most 800 milliseconds. To implement
    this, we could use the bufferWithTime() operator, but what if our user clicks
    really fast. There is no reason for the application to wait all the time if the
    user already did three clicks; for this reason, we are going to use the bufferWithTimeOrCount()
    operator.


    Then we need to apply the operator on the Observable:


    ```

    Rx.Observable

    .fromEvent(document.getElementById(''message_input''),''click'')

    .bufferWithTimeOrCount(800,3)

    ```


    Using this operator, will trigger an event every time a user does three clicks
    or the given time frame is elapsed after the first click, so we also need to add
    a filter() to make sure the user completed the three clicks.'
  merge: -1
  img_proc: true
- pgno: 292
  md: "It can be done with the following code:\n\n```\nRx.Observable\n.fromEvent(document.getElementById('message_input'),'click')\n\
    .bufferWithTimeOrCount(800,3)\n.filter(function(events){\n  return events.length\
    \ === 3;\n})\n```\n\nThat's it; this observable triggers an event every time a\
    \ user does a triple click action in the message box.\n\nNow we need to change\
    \ the value of the message box with the /roll_a_dice command, and we can do this\
    \ with a subscription in this Observable:\n\n```\nRx.Observable\n.fromEvent(document.getElementById('message_input'),'click')\n\
    .bufferWithTimeOrCount(800,3)\n.filter(function(events){\n  return events.length\
    \ === 3;\n}).subscribe(function(){\n  document.getElementById('message_input').value='/roll_a_dice';\n\
    });\n```\n\nIf you run this code and test it in your browser, you will see the\
    \ message box being filled with the /roll_a_dice command every time you do a triple\
    \ click in it:\n\n![](img/8a5c36d94dc308a2a0fcf45ffa9cc27f_292_0.png)"
  merge: -1
  img_proc: true
- pgno: 293
  md: "Now let's see how we can implement the same behavior without functional reactive\
    \ programming. The same behavior can be implemented using the following code:\n\
    \n```\nvar count=0;\nvar timer;\ndocument.getElementById('message_input').addEventListener(\"\
    click\", function() {\n    count++;\n    if(!timer){\n        timer = setTimeout(function()\
    \ {\n            count=0;\n            timer=null;\n        },800);\n    }\n \
    \   if(count===3){\n        count=0;\n        clearTimeout(timer);\n        timer=null;\n\
    \        document.getElementById('message_input').value='/roll_a_dice';\n    }\n\
    });\n```\n\nAs you can see, it is a lot harder to read. We need to create two\
    \ variables in another scope, the first to count the number of clicks and check\
    \ if it is equal to three, and the other to reset the counter after the interval.\n\
    \nWe also need to manually start and clear timeouts when using this approach.\n\
    \nNeedless to say, it is now a lot harder to understand, read, reuse, maintain,\
    \ and test.\n\n# Batching changes to the DOM\n\nWhen developing a frontend application,\
    \ one of the greatest problems for performance is the access to DOM.\n\nChanging\
    \ or adding nodes in the DOM can have a serious impact on your application's performance.\n\
    \nUsing RxJS, we can easily mitigate this problem using buffers to aggregate changes\
    \ before applying it to the DOM. In our web chat application, every time a user\
    \ sends a message or you send a message, we need to add a new node in the DOM.\
    \ Given the nature of our application, we do not expect to receive several messages\
    \ per second (or the user will not be able to read the messages), but if you were\
    \ implementing a chart with real-time data, this behavior can quickly become a\
    \ bottleneck for you."
  merge: -1
  img_proc: true
- pgno: 294
  md: "Here, in this section, we are going to do a minor change to our application\
    \ so all changes in the DOM are buffered before being applied. I will show this\
    \ technique as it can be used in several other applications.\n\nIn the index.js\
    \ file we have the following code; we use it to listen to incoming data from the\
    \ server:\n\n```\n```javascript\nconnection.listen('message')\n.subscribe(function(message){\n\
    \  var node = document.createElement(\"li\");\n  var textnode = document.createTextNode(message.from\
    \ + ' says to '+(message.to || 'everybody')+' : '+message.content);\n  node.appendChild(textnode);\n\
    \  document.getElementById(\"messages\").appendChild(node);\n});\n```\n```\n\n\
    In this code, every time a new message arrives from the server we immediately\
    \ show it in the DOM; to minimize the access to the DOM we could easily buffer\
    \ the incoming messages from the server for a few milliseconds.\n\nTo implement\
    \ this behavior, we can use the bufferWithTime() operator to buffer messages in\
    \ a 500 milliseconds timeframe. As discussed earlier, given the nature of our\
    \ application we cannot expect a huge performance gain using it, but, for other\
    \ applications, we could buffer longer and get more benefits from it.\n\nSo the\
    \ first step is to add the operator:\n\n```\n```javascript\nconnection.listen('message')\n\
    .bufferWithTime(500)\n//keeps with the other operators and subscription\n```\n\
    ```\n\nThe bufferWithTime() operator will propagate empty arrays if no message\
    \ is propagated in the given timeframe, as we do not want to run the subscription.\
    \ If we did not receive any message we must add a filter() after this to check\
    \ if we received a message. We can do this checking if the length of the array\
    \ is bigger than 0, as you can see in the following code:\n\n```\n```javascript\n\
    connection.listen('message')\n.bufferWithTime(500)\n.filter(function(messages){\n\
    \  return messages.length > 0;\n})\n//keeps with the other operators and subscription\n\
    ```\n```"
  merge: -1
  img_proc: true
- pgno: 295
  md: "Now we must change the function used by the map() operator to return a new\
    \ DOM element containing all messages:\n\n```\n.map(function(messages){\n    var\
    \ li;\n    var i=0;\n    var fragment = document.createDocumentFragment();\n \
    \   for(;i<messages.length;i++){\n        li = document.createElement(\"li\");\n\
    \        li.innerText = messages[i].from + ' says to '+(messages[i].to || 'everybody')+'\
    \ : '+messages[i].content;\n        fragment.appendChild(li);\n    }\n    return\
    \ fragment;\n})\n//keeps with subscription\n```\n\nIn our new map() function,\
    \ we create a document fragment to use as the container for all li elements containing\
    \ the messages, and return this fragment.\n\nWith this new approach, the browser\
    \ will not keep calculating styles and layout for every new message, and will\
    \ batch the changes in a 500 milliseconds timeframe.\n\nThe last thing we need\
    \ to do is to subscribe to the final observable, so we can finally apply the changes\
    \ to the DOM and show the messages. Our final code will look as follows:\n\n```\n\
    connection.listen('message')\n    .bufferWithTime(500)\n    .filter(function(messages){\n\
    \        return messages.length > 0;\n    })\n    .map(function(messages){\n \
    \       var li;\n        var i=0;\n        var fragment = document.createDocumentFragment();\n\
    \        for(;i<messages.length;i++){\n            li = document.createElement(\"\
    li\");\n            li.innerText = messages[i].from + ' says to '+(messages[i].to\
    \ || 'everybody')+' : '+messages[i].content;\n            fragment.appendChild(li);\n\
    \        }\n        return fragment;\n    })\n    .subscribe(function(node){\n\
    \        document.getElementById(\"messages\").appendChild(node);\n    });\n```"
  merge: -1
  img_proc: true
- pgno: 296
  md: "If you run the application and try to send some messages, you will see the\
    \ application running as expected:\n\n![](img/8a5c36d94dc308a2a0fcf45ffa9cc27f_296_0.png)\n\
    \n![](img/8a5c36d94dc308a2a0fcf45ffa9cc27f_296_1.png)\n\nNowadays a lot of frameworks\
    \ use different strategies to avoid applying changes to the DOM, as this can lead\
    \ to a big performance improvement. Here you can see how you can easily implement\
    \ this strategy to avoid changes in the DOM with the usage of a few functional\
    \ reactive programming operators available in RxJS.\n\nNow your index.js file\
    \ should look as follows:\n\n```\n```js\nvar Rx = require('rx');\nvar connection\
    \ = require('./connection');\nvar events = require('./events');\n\nvar logged\
    \ = prompt(\"Please enter your name\", \"\");\n\nvar messagesObservable = events.map(function(value){\n\
    \    var userName, splittedUserInput, action, content;\n    if(value.indexOf('!')===0){\n\
    \        userName = value.substring(1);\n        return {service:'blockUser',blocked:userName,from:logged};\n\
    \    }\n    if(value.indexOf('/')===0){\n        splittedUserInput = value.split('\
    \ ');\n        action = splittedUserInput[0].substring(1);\n        content =\
    \ splittedUserInput.slice(1).join(' ');\n        return {\n            service:'command',\n\
    \            action:action,\n            content:content,\n            from:logged\n\
    \        };\n    }\n```\n```"
