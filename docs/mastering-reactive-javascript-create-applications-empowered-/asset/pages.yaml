- pgno: 1
  md: '# Mastering Reactive JavaScript


    If you''re struggling to handle a large amount of data and don''t know how to
    improve your code readability, then reactive programming is the right solution
    for you. It lets you describe how your code behaves when changes happen and makes
    it easier to deal with real-time data. This book will teach you what reactive
    programming is, and how you can use it to write better applications.


    The book starts with the basics of reactive programming, what Reactive Extensions
    is, and how can you use it in JavaScript along with some reactive code using Bacon.
    Next, you''ll discover what an Observable and an Observer are, and when to use
    them.


    Moving on, you''ll explore the RxJS API, be introduced to the problem of data
    traffic, and see how you can mitigate it. You''ll also learn about other important
    operators that can help improve your code readability, and you''ll see how to
    use transducers to compose operators.


    At the end of the book, you''ll get hands-on experience of using RxJS, and will
    create a real-time web chat using RxJS on the client and server, providing you
    with the complete package to master RxJS.


    # Things you will learn:


    +   - Get to know the basics of functional reactive programming using RxJS

    +   - Process a continuous flow of data with linear memory consumption

    +   - Filter, group, and react to changes in your system

    +   - Discover how to deal with data traffic

    +   - Compose operators to create new operators, and use them in multiple Observables
    to avoid code repetition

    +   - Explore transducers and see how they can improve your code readability

    +   - Detect and recover from errors in Observables using the Retry and Catch
    operators

    +   - Create your own reactive application: a real-time web chat'
  merge: -1
