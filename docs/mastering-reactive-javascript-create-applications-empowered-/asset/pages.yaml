    \n```\nbash-3.2$ mocha tests/send_message_test.js\n\nSend Message Test\n  ✓ Must\
    \ support sending a message\n  ✓ Must support broadcast message\n\n2 passing (11ms)\n\
    ```\n\nNow our services are passing as expected, so we can go to the next service.\n\
    \n# Service to listen to new messages\n\nOur next service will be used to listen\
    \ to new messages. It must return an observable containing the data, the destination\
    \ of which is the given user.\n\nOur service will have the following signature:\n\
    \n```\nlistenToMessages (payload, [observable]) ;\n```\n\nIt receives two parameters,\
    \ but only the first is mandatory:\n\n+   - `payload`: It is an object containing\
    \ information about the user, and it must have one property:\n+     - `me`: This\
    \ property is mandatory - it is a string representing the user listening to messages\n\
    +   - `observable`: It is the observable where messages are pushed\n\nOur service\
    \ must implement the following rules:\n\n+   - Must return an observable containing\
    \ only data for the given user, which means messages sent by the given user, private\
    \ messages for that user, and broadcast messages\n+   - If an observable is provided,\
    \ we must change this observable to follow the first rule, and must apply the\
    \ first rule to the DataSource (which contains all messages)\n\nNow we know the\
    \ rules, we can implement tests for them."
