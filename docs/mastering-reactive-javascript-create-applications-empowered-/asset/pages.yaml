- pgno: 298
  md: 'If we decided to create unit tests for our client application, we would need
    a way to mock the connection with our servers; this would involve creating a new
    (and slightly complex) build for our tests.


    We could also create end to end tests, to test the whole flow of a user. Doing
    this would probably involve using some external tool to run our tests in the context
    of a browser and automatize the user input. This would also involve an extra step
    of running a tool such as Selenium or CasperJS.


    There are several books on the different ways you can test a frontend application.
    Here I''m choosing to implement the simplest solution, which involves creating
    a page for the test using mocha as explained in Chapter 7, Something is Wrong
    - Testing and Dealing with Errors.


    To do this, let''s create a page called index_test.html inside the static folder;
    this page will be a copy of the index.html page, but it will contain the tests
    of our application. It is going to be based on the test HTML file from Chapter
    7, Something is Wrong - Testing and Dealing with Errors.


    Paste this content into the page:


    ```

    <html>

    <head>

    <meta charset="utf-8">

    <title>Tests</title>

    <link href="https://cdn.rawgit.com/mochajs/mocha/2.2.5/mocha.css" rel="stylesheet"
    />

    </head>

    <body>

    <div id="mocha"></div>

    <div style="display:none">

    <ul id="messages"></ul>

    <div class="message_container">

    <input id="message_input"/><button id="send_message">Send message</button>

    </div>

    </div>

    <script src="https://cdn.rawgit.com/mochajs/mocha/2.2.5/mocha.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/chai/3.5.0/chai.min.js"></script>

    <script>

    window.prompt=function () {

    return "Erich";

    };

    </script>

    <script src="/bundle.js"></script>

    ```'
