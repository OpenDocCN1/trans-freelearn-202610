- pgno: 132
  md: 'Implementing this kind of behavior in Vanilla JS can be really messy, but it''s
    really simple using RxJS:


    ```

    <html>

    <head>

    </head>

    <body>

    <span id="my_span">TRIPLE CLICK</span>

    <ul id="my_ul"></ul>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/rxjs/4.1.0/rx.all.js"></script>

    <script>

    Rx.Observable

    .fromEvent(document.getElementById("my_span"),"click")

    .bufferWithTimeOrCount(1000,3)

    .filter(function(arr){

    return arr.length===3;

    })

    .subscribe(function(){

    var node = document.createElement("li");

    var textnode = document.createTextNode("TRIPLE CLICK DETECTED");

    node.appendChild(textnode);

    document.getElementById(''my_ul'').appendChild(node);

    });

    </script>

    </body>

    </html>

    ```


    In this HTML page, we have a span where we will listen for triple clicks. For
    doing so, we create an Observable from the click events from it using the fromEvent()
    method, then we buffer the clicks for a second or three clicks (whatever happens
    first), as we want to detect triple clicks. We now filter the Observable to propagate
    only when the array size is equal to 3 (that''s the case when we have a triple
    click), and finally we subscribe to add a li on the HTML page showing the span
    was clicked three times (now, try to implement the same behavior without functional
    reactive programming).'
  merge: -1
  img_proc: true
