- pgno: 280
  md: '# Connecting to the server application


    We are going to use WebSockets to connect with the server through the socket.io-client.
    On the server we modeled, connections and requests as observable objects and we
    will do the same on the client, To do so, open the connection.js file inside the
    client folder, and import the modules that we are going to use:


    ```

    var Rx = require(''rx'');

    var io = require(''socket.io-client'');

    ```


    So far we have only imported the rx module, which we will use to create the observables,
    and the socket.io-client, which we will use to start the connection.


    ![](img/8a5c36d94dc308a2a0fcf45ffa9cc27f_280_0.png)


    We will not use ES6 on the client, to avoid the extra step of transpiling it to
    ES5 and making it work on all major browsers.


    Now we need to connect to the server. As we are running on port 3000, we can do
    this with this code:


    ```

    var socket = io(''http://localhost:3000'');

    ```


    We only can start to send messages after the connection is established; for this
    reason, we need observables to listen to connect and disconnect events:


    ```

    var connectionObservable = Rx.Observable.fromEvent(socket,''connect'');

    var disconnectObservable = Rx.Observable.fromEvent(socket,''disconnect'');

    ```


    In this file we need a way to send data to the server and to listen to data from
    the server; for this reason we are going to export two functions.


    The first exposed function is to send data to the server, and we are going to
    call it addSender; it has the following signature:


    ```

    addSender(observable);

    ```'
  merge: -1
  img_proc: true
- pgno: 281
  md: "It receives only one mandatory parameter:\n\n+   - **observable**: An `observable`\
    \ object whose events are going to be propagated to the server\n\nIt will have\
    \ the following implementation:\n\n```\nfunction(observable){\n    connectionObservable\n\
    \        .flatMap(observable)\n        .takeUntil(disconnectObservable)\n    \
    \    .map(function(data){\n            return JSON.stringify(data);\n        })\n\
    \        .subscribe(function(data){\n            socket.emit('request',data);\n\
    \        });\n}\n```\n\nThe implementation is pretty straightforward; as we can\
    \ only send messages after the connection is established, we are going to start\
    \ with the `connectionObservable`, and use the `flatMap()` operator, so, after\
    \ the connection is established it will start to propagate the data that we want\
    \ to send to the server.\n\nWe also need to stop sending messages to the server\
    \ if the socket disconnects, and, for this reason, we add the `takeUntil()` operator\
    \ to stop the observable if a disconnection happens.\n\nWe are going to send data\
    \ to the server as JSON strings; for this reason we need to map each data to a\
    \ JSON string using the `JSON.stringify` function.\n\nIn the final step, we subscribe\
    \ to the created observable and use `socket.emit` to send data to the server.\n\
    \n![](img/8a5c36d94dc308a2a0fcf45ffa9cc27f_281_0.png)\n\nTo keep the code and\
    \ example simple, we will not handle reconnection in our application.\n\nThe other\
    \ method we need to expose must be used to listen to incoming messages from our\
    \ server; we are going to call it `listen`, and it will have the following signature:\n\
    \n```\nlisten(event);\n```"
  merge: -1
  img_proc: true
- pgno: 282
  md: "It receives only one mandatory parameter:\n\n+   - event: It is a string containing\
    \ the event name of incoming messages from the server\n\nIt will have the following\
    \ implementation:\n\n```\nfunction(event){\n    var eventObservable = Rx.Observable.fromEvent(socket,event);\n\
    \    return connectionObservable\n        .flatMap(eventObservable)\n        .takeUntil(disconnectObservable);\n\
    }\n```\n\nIn this function, we first create an Observable from the given event\
    \ name in the socket, and we apply the same trick that we used in the previous\
    \ method to listen to data only while we are connected, starting with the connectionObservable\
    \ and stopping with the disconnectObservable.\n\nThese two methods are the only\
    \ thing we need to start sending and receiving WebSocket messages.\n\nIf you followed\
    \ the instructions correctly, you will end up with a file as follows:\n\n```\n\
    var Rx = require('rx');\nvar io = require('socket.io-client');\nvar socket = io('http://localhost:3000');\n\
    \nvar connectionObservable = Rx.Observable.fromEvent(socket,'connect');\nvar disconnectObservable\
    \ = Rx.Observable.fromEvent(socket,'disconnect');\n\nmodule.exports = {\n    addSender:function(observable){\n\
    \        connectionObservable\n            .flatMap(observable)\n            .takeUntil(disconnectObservable)\n\
    \            .map(function(data){\n                return JSON.stringify(data);\n\
    \            })\n            .subscribe(function(data){\n                socket.emit('request',data);\n\
    \            });\n    },\n    listen:function(event){\n        var eventObservable\
    \ = Rx.Observable.fromEvent(socket,event);\n        return connectionObservable\n\
    \            .flatMap(eventObservable)\n```"
  merge: -1
  img_proc: true
- pgno: 283
  md: "```\n.takeUntil(disconnectObservable);\n}\n};\n```\n\n# Using RxJS to manage\
    \ user input\n\nNow we must implement the observables to listen to user input;\
    \ they are going to be used to send messages to the server.\n\nLet's implement\
    \ the events.js file inside the client folder.\n\nThe first thing to do is to\
    \ use the RxJS module:\n\n```\nvar Rx = require('rx');\n```\n\nWe want to send\
    \ the user messages every time the user hits the Send message button or when the\
    \ user hits enter in the message box.\n\nFor this reason, we need two observables,\
    \ the first to trigger when the user clicks on the Send message button:\n\n```\n\
    var sendPressedObservable = Rx.Observable\n.fromEvent(document.getElementById('send_message'),'click');\n\
    ```\n\nThis observable is simple and just propagates the event whenever the user\
    \ clicks on the button.\n\nThe second observable will propagate the event whenever\
    \ the user hits the Enter key in the message box:\n\n```\nvar enterPressedObservable\
    \ = Rx.Observable\n.fromEvent(document.getElementById('message_input'),'keypress')\n\
    .filter(function(event){\n    var ENTER_KEY_CODE=13;\n    return event.keyCode===ENTER_KEY_CODE\
    \ ||\n    event.which===ENTER_KEY_CODE;\n});\n```\n\nThis observable listens to\
    \ all events of keys being pressed in the message box; we then filter to propagate\
    \ only when the key pressed is the Enter key.\n\n![](img/8a5c36d94dc308a2a0fcf45ffa9cc27f_283_0.png)\n\
    \nThe number 13 represents the code for the Enter key; we compare it with the\
    \ properties keyCode and which from the variable event for browser compatibility."
