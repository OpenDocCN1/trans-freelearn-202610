- pgno: 57
  md: "The handler function will be used to generate the final string from the date.\
    \ As the result string is big, I decided to omit it in the result circle, but\
    \ it will follow the pattern I've described. So, first our handler function on\
    \ the map() function should be as follows:\n\n```\n(date)=> 'The number in the\
    \ second part of the date ' +\n    date.toISOString() + ' is ' + date.getSeconds()\
    \ +\n    ' which is as even number'\n```\n\nNow, all we have to do is change our\
    \ last observable with the map() operator. We can do this as follows:\n\n```\n\
    Bacon\n    .interval(1000)\n    .map(\n        (i)=> new Date()\n    )\n    .filter(\n\
    \        (date)=>date.getSeconds() % 2 == 0\n    )\n    .map(\n        (date)=>\
    \ 'The number in the second part of the date ' +\n        date.toISOString() +\
    \ ' is ' + date.getSeconds() +\n        ' which is as even number'\n    )\n  \
    \  .onValue((date)=>console.log(date));\n```\n\nRunning this code will display\
    \ the following output, which accentuates the seconds part, making it easier for\
    \ us to see that it really is an an even number:\n\n```\nThe number in the second\
    \ part of the date 2016-11-23T22:29:42.694Z\n    is 42 which is as even number\n\
    The number in the second part of the date 2016-11-23T22:29:44.749Z\n    is 44\
    \ which is as even number\nThe number in the second part of the date 2016-11-23T22:29:46.757Z\n\
    \    is 46 which is as even number\n```\n\n![](img/8a5c36d94dc308a2a0fcf45ffa9cc27f_57_0.png)\n\
    \nThe bacon.js has a lot of built-in operators. You can see their descriptions\
    \ in their APIs. In this section, we only wanted to show how you can use operators\
    \ to create new observables. We will see a few more operators in depth in the\
    \ chapters which follows, using RxJS."
