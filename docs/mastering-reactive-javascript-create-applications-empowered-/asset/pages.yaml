    Composition


    In the last chapter, we reviewed some of the key concepts from functional reactive
    programming using RxJS, including:


    +   - Which events an observable propagates

    +   - What are observables?

    +   - Review of some important operators:

    +     - Differences between the map() and flatMap() operators

    +     - A challenge to emulate an operator from another

    +     - Filter data

    +     - Aggregate data

    +   - Tests for an RxJS program

    +   - Mitigating the problem of backpressure

    +   - Combining observables


    Paying attention to this review is crucial to have a better and clearer understanding
    of functional reactive programming, and with this knowledge we are more prepared
