    \nThe numbers printed in the console may vary in different executions.\n\nThis\
    \ operation is illustrated in the following diagram:\n\n![](img/8a5c36d94dc308a2a0fcf45ffa9cc27f_117_1.png)\n\
    \nWe can also modify this code to use a sample() observable instead of a number:\n\
    \n```\nRx.Observable\n  .interval(50)\n  .sample(Rx.Observable.interval(1000))\n\
    \  .subscribe((i)=>console.log(i));\n```\n\nRunning this code will print the same\
    \ output as the previous one."
