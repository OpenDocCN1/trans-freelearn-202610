- pgno: 218
  md: 'In this chapter, we will learn a final topic before we move on to our final
    project. Using all the knowledge from this book, we already learned how we can
    combine observables, and now we will learn how we can compose transformations
    independently using a new concept called a transducer.


    # What is a transducer?


    Transducers are composable algorithmic transformations; they provide a way to
    compose your operators to create a new one. They are independent of the input
    source and the output, and for this reason they can be applied not only to observables,
    but also to arrays, streams, and collections.


    The transducers let you describe the operations you want to apply to an input
    source, this way you can create a pipeline of operations to be applied to them,
    without ever creating any intermediate aggregation.


    You probably remember from previous chapters that, every time we apply an operator
    to an observable we create a new observable, so if we apply two operators to an
    observable we will create two extra observables, if we apply three operators to
    an observable we will create three extra observables, and so on. This does not
    happen with transducers, because you first describe all the transformations you
    want to apply to a source of data, so there is no need to create any intermediate
    observable and this leads to a performance improvement in your code.


    Another advantage of using a transducer is the additional layer of abstraction
    it adds to your code, letting you describe how you can transform your data before
    even knowing which type of data you are going to use. This extra layer of abstraction
    lets you reuse more code and also test your transformations independently.


    So the main advantages of using transducers are as follows:


    +   - Performance improvements as it avoids the creation of intermediary forms
    of observable (or any other object being iterated)

    +   - Improves your code maintainability with:

    +     - Improved testability as it lets you test your transformation independently

    +     - Improved reuse as it lets you describe the transformation you want to
    apply to the source of your data and lets you reuse it in other sources'
  merge: -1
  img_proc: true
- pgno: 219
  md: '+   - Improved readability as it lets you describe your transformation, adding
    more semantic to your code


    To use transducers in your code you will need to add another dependency, a library
    that implements the transducer; currently there are two important libraries supported
    by RxJS, and they are as follows:


    +   - transducers-js: https://github.com/cognitect-labs/transducers-js

    +   - transducers.js: https://github.com/jlongster/transducers.js


    Another important thing to notice is, as transducers are input source-agnostic
    they do not have available all the operators we learned in RxJS. Actually, whichever
    implementation you choose, contains only a few of them.


    ![](img/8a5c36d94dc308a2a0fcf45ffa9cc27f_219_0.png)


    The word transducer comes from the combination of the words transform and reduce.


    # Available transducer implementations for JavaScript


    As we seen in the last section, there are two important implementations available,
    and as transducers libraries implement a protocol, it should be easy to switch
    implementations. To show example usages of transducers we need to choose one of
    them, and I will choose to use transducers-js; as both are more or less equally
    popular, but transducers-js has more transformations available, so it should be
    more easy for you to try, test, and play with a little bit.


    Both implementations can be used in both node and browser. In this chapter, we
    will use it only in node, and to use it all we have to do is to install it using
    npm:


    ```

