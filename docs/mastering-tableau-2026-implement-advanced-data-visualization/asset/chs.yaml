  - 4. 如果参考线相互重叠，请编辑格式并将对齐方式设置为“顶部”。要访问格式，请单击视图中的参考线：\n\n![](img/66cf6b89349fda3581a4f196cb3c98a4_310_1.png)\n\
  \n图 7.34：格式设置参考线\n\n- 5. 现在，如下所示设置参数：\n\n\n\n![](img/66cf6b89349fda3581a4f196cb3c98a4_311_0.png)\n\
  \n图 7.35: 参考线格式\n\n6. 在 Tableau Desktop 中，您现在应看到以下内容。与之前一样，两个 **参考线** 相等：\n\n![](img/66cf6b89349fda3581a4f196cb3c98a4_311_1.png)\n\
  \n图 7.36: 参考线\n\n7. 将 **Choose Included Dims** 参数更改为 **类别、运输方式和客户细分**\n\n8. 请注意，针对这些设置，\
  \ **参考线** 彼此相等。这是因为 **Choose Included Dims** 仅引入视图中已表示的维度。\n\n9. 将 **Choose Included\
  \ Dims** 参数更改为 **子类别**，以便在预期位置查看附加参考线：\n\n![](img/66cf6b89349fda3581a4f196cb3c98a4_312_0.png)\n\
  \n图 7.37: 显示附加参考线\n\n**包含维度平均值** 参考线现在在平均值中包含了 **子类别**，因此与 **整体平均值** 参考线不同。平均值较小，是因为总\
  \ **销售额** 正在被除以视图中可见点之外的更多点。将 **子类别** 添加到 LOD 会导致更多行，从而导致每行的平均值变小。此外，请注意，**子类别**\
  \ 维度未在视图中使用。LOD 不要求计算驻留在视图中。\n\n总结而言，**INCLUDE** LOD 可以以这种方式操作可视化：添加视图本身未使用的分区。此外，所有三个\
  \ LOD 的命名约定将是理解它们的最佳助记符：Fixed 用于固定所用字段，Include 用于添加“缺失”字段，Exclude 用于从已存在的计算中删除不需要的字段。\n\
  \n如需获得更多实操培训，我们将继续介绍几个实际应用。\n\n## 使用 LOD 构建实际应用\n\n本章的第一部分旨在演示 LOD 的工作原理。剩余部分将专门用于实际应用。具体来说，我们将考虑三个典型挑战，这些挑战之前是使用其他\
  \ Tableau 功能（如表计算和数据混合）解决的。\n\n本练习将探讨将计算总计百分比的表计算与维度筛选器混合时出现的问题。我们将考虑该问题、使用 LOD\
  \ 计算的解决方案，最后以关于解决方案相关要点的评论部分结束。\n\n### 使用 LOD FIXED 计算\n\n您是否曾遇到过这种情况：希望计算总计百分比，但在视图中仅显示总计维度的子集？好吧，您并非孤单。但多亏了\
  \ LOD，您很快就会知道如何解决此问题。以下步骤将指导您完成练习：\n\n- 1. 打开与此章关联的工作簿，导航到名为 The Problem 的工作表\n\
  - 2. 选择 2012_World_Pop 数据集\n\n- 3. 创建名为 Percent of Total 的计算字段，使用以下代码：\n\n```\n\
  SUM([Population]) / TOTAL(SUM([Population]))\n```\n\n- 4. 右键单击 Percent of Total，选择\
  \ **默认属性 | 数字格式 | 百分比**\n- 5. 将 Country 放在列架上，Measure Names 放在行架上，Measure Values\
  \ 放在文本架上\n- 6. 从 Measure Values 架中删除 Number of Records\n- 7. 右键单击 Percent of Total\
  \ 并将其设置为 **使用 | Country 计算**\n\n- 8. 在 Country 上创建筛选器，使仅显示 Afghanistan：\n\n![](img/66cf6b89349fda3581a4f196cb3c98a4_313_0.png)\n\
  \n图 7.38: 阿富汗的人口\n\nAfghanistan 显示的总计百分比为 100%。显然，这并不代表阿富汗占世界总人口的百分比。让我们探讨一个可能的解决方案——要使用\
  \ LOD 解决此问题，请按照练习步骤操作：\n\n- 9. 复制名为 The Problem 的工作表并将其重命名为 Solution LOD\n\n- 10.\
  \ 创建名为 Percent of Total LOD 的计算字段，使用以下代码：\n\n```\nSUM([Population])/SUM({ FIXED\
  \ : SUM([Population])})\n```\n\n- 11. 将 Percent of Total LOD 放在 Measure Values 架上，并注意显示的百分比等于\
  \ 0.43%。如果显示 0，请更改数字格式为百分比：\n\n![](img/66cf6b89349fda3581a4f196cb3c98a4_314_0.png)\n\
  \n图 7.39: 总计百分比\n\n- 12. 从 Measure Values 架中删除先前创建的 Percent of Total 表计算：\n\n| 国家\
  \ | Afghanistan |\n| :--- | :--- |\n| 人口 | 29,824,536 |\n| 总计百分比 LOD | 0.43% |\n\
  \n图 7.40: 总计百分比 LOD\n\n由此可见，问题已解决！为了更好地了解后台发生的情况，让我们来看看 Tableau 为名为 The Problem\
  \ 的工作表生成的查询。生成的查询可以通过单击 **帮助 | 设置和性能 | 开始性能记录** 来查看。（有关查看 Tableau 生成的查询的更多信息，请参见第\
  \ 11 章，设计仪表板和可视化最佳实践。）\n\nSQL 语句如下：\n\n```\nSELECT\n['2012_World_Pop$'].[Country]\
  \ AS [Country],\nSUM(['2012_World_Pop$'].[Population]) AS [SUM:Population:ok]\n\
  FROM\n[dbo].['2012_World_Pop$'] ['2012_World_Pop$']\nWHERE\n(['2012_World_Pop$'].[Country]\
  \ = 'Afghanistan')\nGROUP BY\n['2012_World_Pop$'].[Country]]\n```\n\n请注意，查询中的 WHERE\
  \ 子句将返回的数据集限制为仅包含 **Country** 为 Afghanistan 的行。此 WHERE 子句是因为将 **Country** 放在 **筛选器**\
  \ 架上而生成的。通过限制返回的数据，处理要求从 Tableau 转移到基础数据源引擎。换句话说，数据源引擎执行查询的工作，因此 Tableau 使用较小的数据集。这种设计背后的理由是，数据源引擎专门用于高效查询大型数据集，并通常具有支持此类活动的底层硬件。此外，限制返回到\
  \ Tableau 的数据行可以减少由于延迟导致的低效。\n\n由于 Tableau 尽可能使用缓存，因此低效率会进一步降低。通常，用户可以执行各种操作而无需向基础数据源发出调用。但是，在前面的案例中，如果用户从筛选器中选择不同的\
  \ **Country**，Tableau 将向数据源生成新查询。例如，如果用户与筛选器交互并取消选择 Afghanistan 并选择 Albania，则会生成带有相应\
  \ WHERE 子句的新查询。尽管 Tableau 依赖数据源引擎的逻辑是有据可查的，但前面示例中提出的问题仍然存在。Tableau 作者可以做什么来计算整体百分比，而不受筛选影响？\n\
  \n一个解决方案是创建一个也可用作筛选器的表计算。区别在于，与工作表 The Problem 不同，Tableau 生成的用作数据源的查询返回整个数据集。当表计算用于筛选器时，筛选操作不会在基础数据返回之前进行。换句话说，Tableau\
  \ 执行筛选操作。这样，无论用户选择查看哪个国家的人口总数，都可以保留总计百分比。但是，表计算的一个潜在问题是，返回的数据集可能非常大，这可能会导致性能挑战。由于返回大型数据集所需的时间增加，可能会出现延迟，Tableau\
  \ 可能会因为额外的筛选数据集处理责任而运行得更慢。\n\n我们提出的解决方案是 LOD 计算，可以解决这些挑战。让我们来看看 Solution LOD 工作表中\
  \ Percent of Total LOD 计算字段生成的 SQL 查询：\n\n```\nSELECT\n[t0].[Country] AS [Country],\n\
  [t1].[ measure 0] AS\n[TEMP(Calculation_418553293854285824)(2417030171)(0)],\n[t0].[TEMP(Calculation_418553293854285824)(616435453)(0)]\
  \ AS\n[TEMP(Calculation_418553293854285824)(616435453)(0)]\nFROM\n( SELECT\n['2012_World_Pop$'].[Country]\
  \ AS [Country], SUM(['2012_World_Pop$'].[Population])\nAS [TEMP(Calculation_418553293854285824)(616435453)(0)]\n\
  FROM\n[dbo].['2012_World_Pop$'] ['2012_World_Pop$']\nWHERE\n(['2012_World_Pop$'].[Country]=\
  \ 'Afghanistan')\nGROUP BY\n['2012_World_Pop$'].[Country] ) [t0]\nCROSS JOIN\n(\
  \ SELECT SUM(['2012_World_Pop$'].[Population]) AS [ measure 0] FROM\n[dbo].['2012_World_Pop$']\
  \ ['2012_World_Pop$']\nGROUP BY () ) [t1]\n```\n\n请注意 CROSS JOIN 术语；LOD 计算生成一个查询，指示基础数据源引擎以这种方式返回数据，从而允许\
  \ Tableau 将一个或多个国家的人口值除以世界人口总计，从而返回正确的总计百分比。\n\n### 使用 LOD INCLUDE 计算\n\n接下来，我们将练习\
  \ INCLUDE LOD 计算。在此练习中，我们将创建一个显示以下内容的工作表：\n\n- 每个地区的总销售额\n- 所有地区的总销售额平均值\n- 每个地区内所有州的总销售额平均值\n\
  \n\n\n\n\n使用 LOD 计算来显示这些值非常简单。让我们探索一下。按照练习步骤操作：\n\n- 1. 选择 Practical Include 工作表\n\
  - 2. 选择 Superstore 数据集\n\n- 3. 创建一个名为 Per State INCLUDE 的计算字段，使用以下代码：\n\n```\n{INCLUDE\
  \ [State]:SUM([Sales])}\n```\n\n- 4. 将 Region 拖到 Columns 栏，SUM(Sales) 拖到 Rows 栏，AVG(Per\
  \ State INCLUDE) 拖到 Details 栏。请务必将 Per State INCLUDE 更改为平均聚合。\n\n- 5. 右键单击 Sales\
  \ 轴并选择 Add Reference Line，添加两条参考线。使用以下设置：\n\n![](img/66cf6b89349fda3581a4f196cb3c98a4_317_0.png)\n\
  \n### 图 7.41：参考线\n\n- 6. 按需格式化工作表以完成它：\n\n![](img/66cf6b89349fda3581a4f196cb3c98a4_318_0.png)\n\
  \n### 图 7.42：按区域和州计算的平均值\n\n由此可见，得益于 LOD，我们可以为每个 **区域** 显示一条折线图，同时还可以为整个数据集显示一条。之所以可行，是因为我们在\
  \ **Per State INCLUDE** 计算中包含了 **州** 维度。使用此计算字段创建参考线，使 Tableau 不仅能显示每个（可见） **区域**\
  \ 的平均值，还能显示每个 **区域** 下每个（不可见） **州** 的平均值。\n\n## 使用 LOD EXCLUDE 计算\n\n在本练习中，我们将使用\
  \ Superstore 数据集创建一个工作表，用于计算区域内每个城市产生的销售额百分比。\n\n按照练习步骤操作：\n\n- 1. 选择 Practical\
  \ Exclude 工作表\n- 2. 选择 Superstore 数据集\n- 3. 创建以下计算字段：\n\n```\nRegion Values\n{ EXCLUDE\
  \ [City],[State] :ZN( SUM([Sales]) ) }\n```\n\n```\n% Per Region LOD\nSUM([Sales])/SUM(\
  \ [Region Values] )\n```\n\n### 图 7.43：区域值和按区域计算的 LOD 百分比\n\n- 4. 将 Region 和 City\
  \ 放在 Rows 栏上\n\n- 5. 将 Measure Names 放在 Columns 栏上，Measure Values 放在 Text 栏上\n\n\
  - 6. 从 Measure Values 栏中删除所有度量实例，只保留 Sales、Region Values 和 % Per Region LOD\n\n\
  - 7. 为了让 % Per Region LOD 显示为百分比，必须调整数字格式。只需在“数据”窗格中右键单击该计算，然后选择“默认属性 | 数字格式 | 百分比”：\n\
  \n![](img/66cf6b89349fda3581a4f196cb3c98a4_319_0.png)\n\n### 图 7.44：更改数字格式\n\n-\
  \ 8. 将 AGG(% Per Region LOD) 的一个实例放在 Filter 栏上，并调整以显示至少 0.1（即 10%）：\n\n![](img/66cf6b89349fda3581a4f196cb3c98a4_320_0.png)\n\
  \n### 图 7.45：% 筛选器\n\n- 9. 观察当前视图，Region 和 City 在 Rows 栏上：\n\n![](img/66cf6b89349fda3581a4f196cb3c98a4_320_1.png)\n\
  \n### 图 7.46：Jacksonville 仍然可见\n\n- 10. 现在，将 State 放在 Rows 栏的 Region 和 City 之间。请注意\
  \ Jacksonville 消失了：\n\n![](img/66cf6b89349fda3581a4f196cb3c98a4_321_0.png)\n\n###\
  \ 图 7.47：将 Region 添加到 Rows 时 Jacksonville 消失\n\n之所以会这样，是因为 Jacksonville 位于南区域的两个州，即佛罗里达州和北卡罗来纳州。您可以通过将\
  \ % Per Region LOD 筛选器替换为 City: Jacksonville 来查看这一点：\n\n![](img/66cf6b89349fda3581a4f196cb3c98a4_321_1.png)\n\
  \n### 图 7.48：Jacksonville 存在于两个州中\n\n我们的 Region Values 计算排除了 City 和 State，因此 % Per\
  \ Region LOD 将考虑视图中可见内容的 SUM(Sales)，除以 Region Values。当视图中仅包含 Region 和 City 时，Jacksonville\
  \ 的 SUM(Sales) 为 44,713（见图 7.48）。该数字除以 Region Values 的 391,722（见图 7.46）大于 10%。但随后我们将\
  \ State 添加到视图中，使得佛罗里达州 Jacksonville 的 SUM(Sales) 变为 39,133，北卡罗来纳州 Jacksonville 变为\
  \ 5,580（见图 7.50）。这两个数字除以 391,722 的 Region Values 都不超过 10%，因此会因我们的筛选器而从视图中删除。\n\n\
  在使用 Tableau 时，LOD 是较为高级的主题之一，但它们非常强大，值得花时间去理解。如需更多实际示例，我建议您查看以下网站：https://www.tableau.com/about/blog/LOD-expressions。我记得刚开始使用\
  \ Tableau 时，我从未想过自己会想要显示基于视图中不存在的维度的数据，或者想要排除维度。但我曾多次需要这样做，例如，在将“到总行平均值的距离”的计算添加到仪表板时，或者当一个维度有多个最大日期且您只想显示每个单独最大日期的度量时。我回顾\
  \ LOD 文档的次数比您想象的还要多，我只能鼓励您也这样做；您对 LOD 越了解，就越容易掌握该概念并自然地使用它们。LOD 为您的仪表板带来的额外灵活性令人难以置信。\n\
  \n## 跟随练习的仪表板\n\n在本章的跟随练习仪表板中，我们有一个非常酷的数据集可供使用。它是来自美国运输部/美国交通统计局（BTS）的美国航空公司准点率数据。让我们开始吧！\n\
