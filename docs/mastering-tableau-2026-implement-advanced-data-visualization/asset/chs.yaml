  \ _arg2, _arg3, _arg4, _arg5, _arg6,\n_arg7)[\"response \"],\n[Pregnancies], [Glucose],\
  \ [BloodPressure], [SkinThickness], [Insulin],\n[BMI], [Age]\n)\n```\n\n由此可见，由于我们所有的编码工作都在\
  \ Python 中完成，因此只需告诉 Tableau 返回一个名为 diabetes_predictor 的 TabPy 查询，然后添加函数所需的所有变量引用，最后在末尾添加\
  \ ['response ']。\n\n或者，由于 TabPy 上的已部署模型还支持 MODEL_EXTENSION_BOOL、MODEL_EXTENSION_INT、MODEL_EXTENSION_REAL\
  \ 和 MODEL_EXTENSION_STR 函数，你也可以使用以下代码：\n\n```\nMODEL_EXTENSION_REAL(\"diabetes_predictor\"\
  , \"_arg1, _arg2, _arg3, _arg4, _arg5,\n_arg6, _arg7\",\n[Pregnancies], [Glucose],\
  \ [BloodPressure], [SkinThickness], [Insulin], [BMI],\n[Age]\n)\n```\n\n第二段代码更简短、更直观；不过，两种方法都有效！\n\
