  \n图 8.45: 最终飞镖板多边形\n\n最终仪表板显示一个带有不同颜色的飞镖板。灰色表示该区域在游戏中未被击中，而场地颜色越红，表示被击中的次数越多。通过使用参数，您可以将马修的得分与大卫的得分进行比较，或者显示总命中次数，如上一张截图所示。\n\
  \n您可能已经注意到，本练习中多边形的曲线部分并不十分完美。例如，请看靶心周围的三环区和双环区；您可以看到该区域并非 100% 均匀。这仅仅是在 Tableau\
  \ 中使用笛卡尔网格上的点的特性。这意味着 Tableau 基于网格结构，因此我们绘制的每条曲线仍将是连接网格布局上点的许多小线段。点越多，点之间的线段越短，绘制均匀曲线的可能性就越大。但是，如果您跟随本书架练习操作过，您可以看出，这样一个背景图片需要投入大量精力。尽管如此，我认为多边形绝对值得。在这里，我们使用了一些可能无法为日常工作增加价值的有趣练习，但请考虑一下您在其他程序中设计的完美着陆页面。通过使用多边形，您可以使设计元素可点击且可交互。\n\
  \n下一个主题与本章其余部分略有不同。您听说过 Tableau Exchange 吗？Tableau Exchange 结合了三种产品：扩展、加速器和连接器。感兴趣吗？继续阅读下一部分！\n\
  \n## Tableau Exchange\n\n要访问 Tableau Exchange，请访问此网站：https://exchange.tableau.com。\n\
  \n![](img/66cf6b89349fda3581a4f196cb3c98a4_363_0.png)\n\n图 8.46: Tableau Exchange\n\
  \n加速器和扩展也可以从 Tableau Server 和/或 Tableau Desktop 内部访问。让我们直接深入了解 Tableau Exchange，看看它有什么可提供的！\n\
  \n## Tableau 扩展\n\n扩展是最古老的产品，可从 Tableau 仪表板的“对象”窗格中访问。基本上，扩展允许您直接在 Tableau 中使用第三方工具。部分选定的扩展可在\
  \ https://extensiongallery.tableau.com 上获取，且列表在不断增长。\n\n请注意，Tableau 不为扩展提供支持或保证/安全措施。这些\
  \ API 是由外部方构建的，应当如此对待。如果您想在工作中使用它们，请先咨询您的 IT 安全团队。\n\n让我们看看 Infotopics 的一个示例——Sankey\
  \ 图扩展。\n\n## 使用扩展（仪表板或可视化）\n\n在关联的工作簿中，创建一个名为“显示更多”的新工作表，并选择 Coffee Chain 数据集。现在，通过将“Type”添加到列、“Product\
  \ Type”添加到行、“Profit”添加到文本架，来复制以下工作表布局：\n\n![](img/66cf6b89349fda3581a4f196cb3c98a4_364_0.png)\n\
  \n图 8.47: Show me More\n\n我们希望为本工作表使用 Sankey 图，这是一种流程图，根据流线的大小显示给定度量和给定维度有多少流入第二个给定维度。在此示例中，我们想知道\
  \ Regular 类型产品的 Profit 有多少来自 Coffee、Espresso、Herbal Tea 或 Tea，以及有多少 Profit 可以与 Decaf\
  \ 类型关联。\n\n假设您知道如何使用计算字段构建 Sankey 图，但这很耗时。相反，有一个扩展可以实现此目的。以下是使用扩展并最终在构建 Sankey 图时节省时间的步骤：\n\
  \n- 1. 在关联的工作簿中，打开一个 Dashboard 选项卡，并将其命名为 Show me More DB\n- 2. 将 Show me More DB\
  \ 工作表拖动到仪表板上。现在还将扩展对象拖动到仪表板上\n\n![](img/66cf6b89349fda3581a4f196cb3c98a4_365_0.png)\n\
  \n图 8.48: 扩展\n\n- 3. 从 Tableau 2021.1 开始，您将看到以下弹出窗口\n\n## Viz 扩展\n\n在工作表中使用自定义可视化。了解更多\n\
  \n- 排序方式\n- 下载量\n\n- 功能\n- 由 Tableau + Salesforce 构建\n- 免费\n- 沙箱\n- 适用于 Tableau\
  \ Public\n- Tableau 可信合作伙伴构建\n\n## 所有 Viz 扩展\n\n- Sankey (by Tableau): Sankey 图用于显示多个类别之间的数据流。\n\
  - Tableau Table (by Tableau): 直接在 Tableau 中创建带有条件格式的丰富表格体验。\n- Radial (by Tableau):\
  \ 以圆形格式显示数据，其中所有段值的总和加起来等于 100%。\n- Donut (by LaDataViz): 创建 Donut 图表而不\n- Tree\
  \ Diagram (by LaDataViz): 创建美丽的径向图。\n- Gauge (by LaDataViz): 创建完全可自定义的\n\n图 8.49:\
  \ 扩展库\n\n> 注意\n> Tableau 区分仪表板扩展和可视化扩展；两者都适用于本节中解释的步骤。\n\n- 4. 在扩展库中搜索 **显示更多 2.0**\
  \ 扩展。单击它，并在下一屏幕上选择 **添加到仪表板**\n\n![](img/66cf6b89349fda3581a4f196cb3c98a4_367_0.png)\n\
