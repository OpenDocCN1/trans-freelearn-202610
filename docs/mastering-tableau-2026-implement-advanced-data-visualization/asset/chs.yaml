  6. 接下来，在销售与配额 选项卡上，按住键盘上的 Ctrl (Windows) 或 Command (macOS) 键，同时将 Quota Met? 字段拖动到
  Rows 书架：


  ![](img/66cf6b89349fda3581a4f196cb3c98a4_590_1.png)


  图 13.12：Web 创作 II


  7. 您会看到视图中出现叉号和对勾。这表明我们不仅可以使用颜色来指示是否达成配额，还可以使用这个简单的计算字段在视图中添加标记：IF SUM([Sales])
  >= [Quota] THEN "" ELSE "" END。随意尝试您在 Tableau Desktop 中习惯轻松处理的其他操作，包括以下内容：


  - 创建计算字段

  - 添加筛选器

  - 调整提示信息

  - 创建新工作表

  - 创建仪表板


  编辑完成后，尝试单击右上角的叉号。您会发现更改在仪表板中不可见。再次单击“编辑”以返回 Web 创作模式，瞧！Quota Met? 仍然可见于 Rows 书架。根据您的
  Server 设置，Tableau 会自动保存，但您必须使用“发布”按钮才能使更改对 Server 上的查看者可见。


  ## Web 创作增强功能


  2026.1 版本为 Web 创作体验带来了多项激动人心的增强功能，进一步缩小了 Tableau Desktop 与 Tableau Server 之间的差距。


  - **圆角：** 您现在可以直接在 Web 创作中为仪表板对象设置圆角半径。告别使用注释或图片进行繁琐操作的日子。只需设置半径值即可创建简单的圆角，或设置更极端的圆角半径以创建不同形状。此功能在
  Tableau Cloud、Tableau Desktop 和 Tableau Public 中均可用，让您可以直接在浏览器中轻松创建现代、精美的仪表板设计。

  - **无障碍可视化创作：** Tableau 致力于提高可访问性，让每个人都能成为数据可视化的创建者。在 Web 创作中，您现在可以导航到一个药丸（pill），并使用键盘和辅助技术选择上下文菜单选项，将该药丸放入放置区，包括列和行书架、显示我、页面、筛选器或标记卡。此功能使无需鼠标即可构建可视化成为可能，将数据创建面向更广泛的受众。

  - **查看数据模型增强：** 了解 Tableau 数据模型在可视化或工作表中的使用方式，以及哪些表为可视化中的哪些药丸提供数据。如果在药丸中使用了复杂计算，悬停在药丸上现在会在查看数据模型中高亮显示参与的表，以确认逻辑的正确性。这使您可以直接在工作流中诊断和评估分析，避免在工作表和数据源选项卡之间来回切换。

  - **表名称智能筛选：** 通过允许用户按精确名称筛选表，提高大型数据模型中的分析效率。使用相同的表智能筛选 "T:"，后跟精确表名称的双引号，以绕过子字符串搜索。这项虽小却强大的增强功能在处理复杂数据模型时可节省时间。


  我们已经讨论过仪表板编辑选项和自动保存，但尚未讨论如何跟踪更改，并确保在生成新信息的过程中不会丢失重要信息。下一部分将介绍如何在 Tableau Server
  上维护工作簿，首先从修订历史记录开始。


  ## 在 Tableau Server 上维护工作簿


  一旦您开始在 Tableau Server 上共享工作，就会很快意识到，创建仪表板只是战斗的一半。另一半是长期维护它。编辑后意外损坏仪表板会发生什么？如何保护您的工作不被同事覆盖？如何确保每个用户只能看到他们应该看到的数据，而无需为每个人创建单独的工作簿？


  在本节中，我们将探讨每个 Tableau 作者都应该了解的三项基本工作簿维护功能。


  ## 修订历史记录


  作为 Tableau 仪表板开发人员甚至 Tableau Server 管理员，您希望确保用户始终查看正确的数据。但事情是这样的：您编辑了仪表板，编辑后仪表板显示错误信息。有个用户给您打电话，要求立即恢复旧仪表板。您该怎么办？使用修订历史记录！


  Tableau Server 自带修订历史记录，确保每个工作簿和数据源的过去 25 个版本可检索。此设置可由 Tableau Server 管理员启用或禁用。在
  Tableau Desktop 中，如果您尝试上传与先前上传的文件同名的工作簿或数据源，Tableau Desktop 将显示诸如 **工作簿名称已被使用**
  的警告。


  发布将覆盖现有数据源。如果您继续上传，将激活修订控制，文件的先前版本将作为修订版保持可访问。要访问 Tableau Server 中单个工作簿和数据源的修订历史记录，只需选择您上传的任何数据源或工作簿，然后单击右下角的三个点。在弹出窗口中，选择
  **修订历史记录...**：


  ![](img/66cf6b89349fda3581a4f196cb3c98a4_593_0.png)


  图 13.13：修订历史记录...


  这将打开一个对话框，您可以在其中选择要恢复的先前版本：


  ### 修订历史记录


  选择工作簿 "Sales & Quota" 的修订版。


  | 修订版本号 | 发布者 | 发布日期 | 操作 |

  |---|---|---|---|

  | 修订版本 2 (当前) | Marleen Meier | 2023 年 5 月 6 日 下午 3:23 | |

  | 修订版本 1 | Marleen Meier | 2023 年 5 月 6 日 下午 3:09 | ... |


  取消 恢复


  图 13.14：修订历史记录 II


  ## 禁用重复的自定义视图名称


  说到版本控制，2026.1 版本引入了一项新功能，以增强产品可靠性并创建更直观的自定义视图体验。管理员现在可以阻止创建重复的自定义视图名称，并在保存将覆盖现有视图时提供清晰的内联警报。这消除了静默失败，并防止混淆，尤其是在许多用户可能在同一仪表板上创建视图的大型企业环境中。


  修订历史记录和自定义视图管理非常有用！我希望您不需要经常使用它们，但始终有选择是件好事。许多组织面临的下一个问题是：如何确保用户只能看到他们应该看到的数据，而不是
  Tableau Server 上发布的所有内容？一个解决方案是用户筛选器。我们将在下一节讨论这个话题！


  ## 用户筛选器


  学生经常问我类似这样的问题：我负责多个地区的销售经理。重要的是，销售经理只能看到他们的指标，即其他销售经理的指标对他们不可见。为了实现这一点，我是否需要为每个销售经理创建单独的工作簿？


  幸运的是，答案是否定的。Tableau 提供了用户筛选器，允许 Tableau 作者确保每位销售经理只能看到他们有权查看的信息。为了演示这一点，请执行以下步骤：


  1. 此练习需要 Tableau Server 上有多个用户。因此，请通过单击“用户 | 添加用户”在 Tableau Server 上创建至少一个其他用户。我使用了我拥有的第二个电子邮件地址来完成此操作：




  ![](img/66cf6b89349fda3581a4f196cb3c98a4_595_0.png)


  图 13.15: 添加用户


  - 2. 作为可选步骤，您可以更改帐户的显示名称。要更改帐户的显示名称，请登录 https://www.tableau.com/，单击用户 | 编辑帐户，然后对名和姓条目进行所需更改。


  - 3. 作为第二个可选步骤，您不仅可以将单个用户分配给筛选器，还可以分配用户组。为此，您可以创建不同的组，方法如下：


  ![](img/66cf6b89349fda3581a4f196cb3c98a4_596_0.png)


  图 13.16: 添加组


  - 4. 随后，您可以通过选择用户，然后在 **操作** 下选择 **组成员资格...**，将 Tableau Server 实例中的用户划分为中央、东部、南部和西部区域：


  ![](img/66cf6b89349fda3581a4f196cb3c98a4_596_1.png)


  图 13.17: 添加组 II


  - 5. 现在，访问与本章关联的工作簿，并导航到视图级用户筛选器工作表。请注意，该视图是美国的字段地图，其中 State 在“详细信息”货架上，Region 在“颜色”货架上，Sales
  在“标签”货架上。


  - 6. 通过 Tableau Desktop 中的服务器 | 登录 登录到 Tableau Server 实例。


  - 7. 选择服务器 | 创建用户筛选器 | 区域...（仅可从 Tableau Desktop 访问）。在显示的用户筛选器对话框中，您现在可以将单个用户或用户组分配给某个区域。将用户筛选器命名为销售区域，然后单击确定：


  ![](img/66cf6b89349fda3581a4f196cb3c98a4_597_0.png)


  图 13.18: 用户筛选器


  - 8. 请注意，销售区域现已实际添加到数据窗格的集合部分：


  ![](img/66cf6b89349fda3581a4f196cb3c98a4_597_1.png)


  图 13.19: 已添加集


  - 9. 将 **销售区域** 放在 **筛选器** 货架上


  - 10. 在状态栏右侧，单击下拉列表以访问用户筛选器：


  ![](img/66cf6b89349fda3581a4f196cb3c98a4_598_0.png)


  图 13.20: 切换筛选器


  - 11. 选择不同的组或用户，并请注意，显示的结果会根据图 13.19 中的设置发生变化。


  - 12. 工作簿发布到 Tableau Server 后，访问工作簿的用户只能查看筛选器允许的信息。这也可以应用于数据源级别的已保存数据源。


  需要注意的是，与仅将维度筛选器添加到筛选器货架不同，您或许应考虑将销售区域添加到数据源筛选器。这一点非常重要，因为任何拥有 Web 创作权限的用户都可以直接从筛选器货架中移除筛选器。在此练习中，用户随后便能查看所有区域的指标。然而，数据源筛选器无法通过
  Web 创作环境移除，因此更安全。此外，数据源筛选器适用于整个工作簿，从而进一步保障数据安全。但是，如果您未启用 Web 创作，筛选器货架即可满足需求。


  ## Tableau Server 设置和功能


  发布仪表板后，用户可以根据其权限设置警报、认证数据源、订阅、向仪表板添加评论等。本节将在两个不同位置介绍不同的功能：工作表和视图。除此之外，Tableau Server
  还拥有更多功能，尤其是针对网站管理员的设置，但遗憾的是，这些内容已超出本书的范围。


  ## 工作表级别的功能


  这里所说的工作表级别功能，是指您在选择某个项目和特定工作表后可用的设置，如下所示：


  ![](img/66cf6b89349fda3581a4f196cb3c98a4_599_0.png)


  图 13.21: Tableau Server


  在此级别，我们可以看到八个不同的选项卡，将在接下来的几页中讨论它们。


  - 视图：视图显示在一个工作簿内已发布的所有工作表或仪表板的缩略图。将工作簿上传到 Tableau Server 时，您可以选择此处应显示的所有视图：


  ![](img/66cf6b89349fda3581a4f196cb3c98a4_600_0.png)


  图 13.22: 发布工作簿


  单击视图旁边的三个点，将出现更多选项，如下图所示：


  ![](img/66cf6b89349fda3581a4f196cb3c98a4_601_0.png)


  图 13.23: 选项


  这些选项不言自明：您可以编辑视图（也称为 Web 创作，本章前面已讨论过），也可以将视图共享给其他用户，Tableau 会向与您共享视图的用户发送一封带有图片和超链接的电子邮件。您还可以添加标签，帮助其他用户找到该视图；可以查看哪个用户或组拥有打开该视图的权限，以及谁查看过该视图；最后，您可以删除该视图。显示哪些选项取决于
  Tableau Server 的配置，因此您的管理员可以启用或禁用不同的功能以显示或隐藏它们，否则这些功能可能会显示为置灰状态。


  - 数据源：下一个选项卡是数据源。它将向您展示创建此工作簿所用的数据源概览：


  ![](img/66cf6b89349fda3581a4f196cb3c98a4_602_0.png)


  图 13.24: 数据源


  您将能够查看使用了哪种类型的数据源；例如，通过单击每个数据源旁的三个点，您将能够再次查看更多设置，具体取决于您的 Tableau Server 配置：


  ![](img/66cf6b89349fda3581a4f196cb3c98a4_602_1.png)


  图 13.25: 数据源 II


  - **Tableau Pulse 中的指标**：Tableau Pulse 推出了一个现代化指标层，可提供集中式、受控管的关键绩效指标（KPI）定义。与旧版指标（源自单个仪表板）不同，Pulse
  指标来自单一可信数据源，并附带 AI 生成的见解，用于解释发生了什么以及原因。例如，如果您有一个显示过去一年每日利润的仪表板，但指标应仅显示最后一个利润数据点，则您需要创建一个新视图，以便在指标中使用明确的最后利润值，尽管数据已是初始视图的一部分。然而，一大优势是您无需连接到不同的数据源，因为各工作簿中已设置的连接将被复用。


  有关指标的更多详细信息，请访问：https://www.tableau.com/about/blog/2020/5/introducing-metrics-headlines-your-data.


  - **提取刷新**：使用提取作为数据源时，您可以在将工作簿上传到 Tableau Server 或发布工作簿后，定义刷新计划。不同的计划可由您的服务器管理员设置。例如，如果您将提取刷新设置为每天上午
  7 点运行，Tableau Server 将在上午 7 点访问数据源（可能是 SQL 数据库），加载数据，随后您将在 Tableau 仪表板中看到最新数据。使用提取的性能通常优于实时连接，具体取决于数据量和数据源类型，但请注意，仪表板中的数据始终与您最新的提取一样旧。


  - **订阅**：订阅可在视图级别设置；我们将在下一节介绍此内容。但在工作簿级别，您可以查看特定工作簿的所有活动订阅。


  - **数据血缘**：血缘是 Tableau Server 上另一个较新的功能。它仅通过数据管理加载项提供，需额外付费，并会向您展示数据源的依赖关系。有关血缘的更多信息，请访问
  https://help.tableau.com/current/server/en-us/dm_lineage.htm。


  - **使用情况**：使用情况选项卡可让您了解有多少人查看了您的仪表板，以及有多少其他用户将您的仪表板添加到了收藏夹。


  **注意**

  使用情况数据也可从 Tableau 数据库访问，因此可用于进一步分析。


  最后，请注意工作簿页面上的三个点，其中还包含其他选项以及我们之前看到的选项：


  ![](img/66cf6b89349fda3581a4f196cb3c98a4_604_0.png)


  同样，您能使用哪些选项取决于 Tableau Server 管理员授予您的权限。


  当选择基于已发布数据源（例如我们在本章开头发布到 Tableau Server 的 My Superstore 数据源）时，可用选项会略有不同：




  ![](img/66cf6b89349fda3581a4f196cb3c98a4_605_0.png)


  图 13.27: 选项 II


