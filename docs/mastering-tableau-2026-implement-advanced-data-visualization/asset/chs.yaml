- "# 使用地图\n\n当我为初次使用 Tableau 的人士讲授 Tableau 课程和研讨会时，我发现演示 **地图制作** 总是非常受欢迎，有时还会引起赞赏和惊讶的低语。多次有人告诉我，Tableau\
  \ 的地图功能是让他们注意并更认真地考虑 Tableau 产品的关键特性。Tableau 开箱即用的地图功能功能强大且灵活。你可能会惊讶于在不离开用户界面的情况下能完成多少工作。但这些开箱即用的功能只是冰山一角。在适当的指导下（我将在本章中尝试提供），你可以超越原生地图功能，探索能够大大增强工作簿功能和美观度的技术。\n\
  \n在本章中，我们将讨论以下主题：\n\n- 在不离开 Tableau 的情况下扩展 Tableau 的地图功能\n- 创建自定义多边形\n- 热力图\n- 双轴与地图图层\n\
  - 利用另一种技术扩展 Tableau 地图功能\n- 切换地图\n- 自定义地理编码\n\nTableau 的默认地图功能是一个重要的卖点。选取任何城市、区域、国家或其他地理位置，将其放置在\
  \ Tableau 工作表上，你就会得到一张漂亮的地图；将诸如 **Sales** 之类的度量值添加到 **Color** 书架，你的地图颜色将根据销售数据发生变化。在以下部分中，我们将进一步深入，利用\
  \ Tableau 提供的那些不太明显的功能来增强此功能，例如在地图上测量距离以及在后台绘制其他数据（例如天气数据）。\n\n> 你的购买包含一本免费的 PDF\
  \ 副本和独家额外内容\n\n你的购买包含本书的 DRM-free PDF 副本、Packt+ 书库的 7 天试用（无需信用卡）以及其他独家额外内容。请参阅前言中的“随书附赠的免费权益”部分，立即解锁这些内容，最大化你的学习效果。\n\
  \n## 在不离开 Tableau 的情况下扩展 Tableau 的地图功能\n\n在日常生活中，地图可以帮助我们更好地了解周围的世界。例如，地图经常被用于网站、电视或印刷媒体中，以呈现人口统计信息。在这种情况下，地图需求是静态的，因为当前目标不需要移动。有些企业只有静态地图需求——例如，一家零售连锁店可能会创建包含地图的可视化效果，以便更好地了解特定区域的销售业绩。在这种情况下，地点之间的移动并不是直接需求。\n\
  \n然而，通常还需要地图来从 A 点导航到 B 点。这种地图需求更为复杂，因为它既包含静态需求（附近有什么餐厅？），又必须提供额外信息，例如路线和距离（如何到达那家餐厅？）。这些动态地图需求假设需要移动才能满足需求。许多企业需要了解路线和里程，即如何从\
  \ A 点到达 B 点以及涉及的距离。这些动态地图要求可能差异很大，但大多数需求至少有两个共同点：路线和距离。\n\n在以下练习中，我们将考察澳大利亚的航班路线及其相关距离。具体来说，我们将介绍如何从\
  \ Tableau 中提取经纬度数值，并利用该信息结合三角学来计算各点之间的里程。在此过程中，我们将使用数据混合、表计算、地图以及详细程度 (LOD) 计算，进行一个涵盖许多高级功能的稳健练习。\n\
  \n请执行以下步骤：\n\n- 1. 导航至 https://github.com/PacktPublishing/Mastering-Tableau-2026/tree/main/Chapter09\
  \ 以查找并下载与本章关联的工作簿。\n- 2. 打开工作簿并导航至 Map 工作表。\n- 3. 在 **数据** 窗格中选择 **Transit Data**，双击\
  \ **City**，然后在 **标记** 卡中将 **City** 从 **详细信息** 更改为 **标签**。\n- 4. 在以下截图中，请注意目前尚未显示任何内容。此问题取决于你的国家/地区设置。单击右下角的\
  \ **16 unknown**：\n\n![](img/66cf6b89349fda3581a4f196cb3c98a4_383_0.png)\n\n###\
  \ 图 9.1：未知\n\n- 5. 选择 **编辑位置...**\n\n## [City] 的特殊值\n\n有 14 个值的地理位置未知。你想要如何处理？\n\
  \n**编辑位置...**\n\n更正未知位置。\n\n### 筛选数据\n\n从视图和计算中排除特殊值。\n\n### 在默认位置显示数据\n\n在轴的默认位置显示特殊值。例如，Null\
  \ 值将显示在 0 处。\n\n### 图 9.2：编辑位置...\n\n- 6. 将国家/地区更改为 固定 | Australia\n\n## 编辑位置\n\n\
  地理角色\n国家/地区：Australia\n州/省：\n城市：\n将值匹配到位置字段\n- 无\n- 固定：Australia\n- 从字段：Australia\n\
  2 字符代码：两者 (ISO 和 FIPS)\nADELAIDE\nALBURY\nALICE SPRINGS\nBRISBANE\nCANBERRA\nDARWIN\n\
  Dubbo\nKALGOORLIE\nMACKAY\n重置匹配 取消 确定\n\n### 图 9.3：选择 Australia\n\nAustralia 现在在地图上显示。\n\
  \n![](img/66cf6b89349fda3581a4f196cb3c98a4_385_0.png)\n\n### 图 9.4：Australia\n\n\
  - 7. 导航至 Miles 工作表，将 Trip ID 和 City 字段放置在行书架上，将 Latitude (generated) 和 Longitude\
  \ (generated) 放置在文本书架上，如下面的截图所示：\n\n![](img/66cf6b89349fda3581a4f196cb3c98a4_386_0.png)\n\
  \n### 图 9.5：距离\n\n你的屏幕应与上一张截图类似。请注意，交叉表看起来相当杂乱。理想情况下，**Latitude** 和 **Longitude**\
  \ 应该显示在单独的列中。不幸的是，我们无法对生成的纬度和经度执行此操作，因为尽管它们列在 **数据** 窗格的 **度量值** 部分下，但 Tableau 不将它们视为度量值。为了完成练习，我们需要能够从单独的数据源中访问纬度和经度坐标。\n\
  \n- 8. 为此，首先单击 Map 工作表选项卡。\n- 9. 右键单击可视化效果并选择 **查看数据**。通过选择每个单元格并单击 **复制**，复制随即出现的对话框中\
  \ **摘要** 选项卡的所有数据。\n\n\n\n\n- 10. 关闭对话框并按 Ctrl + V（Mac 上为 Command + V）在 Tableau\
  \ 中创建新数据集。将生成的数据集（现名为 Clipboard_[timestamp]）重命名为 Lat Long。同时将工作表命名为 Lat Long。\n\n\
  - 11. 在 Lat Long 工作表中，将 Latitude (generated) 和 Longitude (generated) 重命名为 Lat 和\
  \ Long。\n\n- 12. 返回 Miles 工作表，在 Transit Data 数据源中创建两个计算字段：一个名为 LAT，包含代码 AVG([Lat\
  \ Long].[Lat])，另一个名为 LONG，包含代码 AVG([Lat Long].[Long])。\n\n- 13. 从标记卡的 Text 中移除 Latitude\
  \ (generated) 和 Longitude (generated)。\n\n- 14. 将 Measure Names 放置到 列 和 筛选器 卡，并选择\
  \ Lat 和 Long。同时，将 Measure Values 放置到 文本 卡。现在，我们能够将纬度和经度视为真正的度量值。\n\n- 15. 再创建两个计算字段：一个名为\
  \ Lookup Lat，包含代码 Lookup(Lat, -1)，另一个名为 Lookup Long，包含代码 Lookup(Long, -1)。将这两个新创建的计算字段放置到\
  \ Measure Values 卡。\n\n- 16. 创建名为 Great Circle Distance Formula 的计算字段，代码如下：\n\n\
  ```\n3959 * ACOS (\nSIN(RADIANS([Lat])) * SIN(RADIANS([Lookup Lat]))+ COS(RADIANS([Lat]))\
  \ *\nCOS(RADIANS([Lookup Lat])) * COS(RADIANS([Lookup Long]) - RADIANS([Long]))\n\
  )\n```\n\n对于千米，将 3959 改为 6378。该数字代表地球半径，需要从英里更新为千米。\n\n- 17. 将新创建的计算字段 Great Circle\
  \ Distance Formula 放置到 Measure Values 卡。\n\n- 18. 更改 Great Circle Distance Formula\
  \ 的计算方式，使其按 City 计算：点击该字段本身并选择 使用方式：City\n\n- 19. 相应调整以下计算\n\n- Lookup Lat: IFNULL(LOOKUP(Lat,-1),\
  \ LOOKUP(Lat,1))\n\n- Lookup Long: IFNULL(LOOKUP(Long,-1), LOOKUP(Long,1))\n\n-\
  \ 20. 选择 Map 工作表，将标记类型设置为 Line。\n\n- 21. 将 Trip ID 放置到 详细信息 卡。\n\n- 22. 将 City 拖动到标记卡的底部。\n\
  \n- 23. 将 Great Circle Distance Formula 字段放置到 提示 卡。再次确认其仍设置为 使用方式：City。\n\n![](img/66cf6b89349fda3581a4f196cb3c98a4_388_0.png)\n\
  \n图 9.6：澳大利亚距离\n\n- 24. 再创建两个计算字段，一个名为 Source City，包含以下代码：\n\n```\n{ FIXED [Trip\
  \ ID]:MIN(IF [Dest/Orig]='Source' THEN City END)}\n```\n\n第二个计算字段应命名为 Destination\
  \ City，并包含以下代码：\n\n```\n{ FIXED [Trip ID]:MIN(IF [Dest/Orig]='Destination' THEN\
  \ City END)}\n```\n\n- 25. 使用新创建的计算字段按需进行格式设置。特别是，请注意在以下截图中，**Source City** 位于 **颜色**\
  \ 卡，而 **Destination City** 用于 **提示** 卡：\n\n![](img/66cf6b89349fda3581a4f196cb3c98a4_389_0.png)\n\
  \n图 9.7：航班\n\n总之，我们在此所做的工作如下：最初，我们向 Tableau 添加了一个数据集。随后，我们需要从工作簿中复制每个城市的纬度和经度，以创建第二个数据源，然后将其作为混合数据源用于查找纬度和经度值。借助\
  \ LOD 计算，我们可以识别出发城市和目的地城市，最后，我们能够使用所谓的大圆公式来测量城市之间的距离。可视化中的每种颜色代表一个出发城市；例如，所有绿色线条都测量从珀斯到其他城市的距离。将鼠标悬停在线条上方时，会显示出发城市和目的地城市，以及以英里（或千米）为单位的测量距离。\n\
  \n如果您想分析货运路线或两点之间的任何其他距离，那么您现在知道如何在 Tableau 中可视化此类数据。\n\n![](img/66cf6b89349fda3581a4f196cb3c98a4_390_0.png)\n\
  \n图 9.8：美国航班出发延误\n\n在图 9.8 中，您可以看到另一个类似的可视化，这绝对值得查看（尝试复制它）：[Tableau 解决方案工作簿：大数据比以往任何时候都更常见](https://www.tableau.com/solutions/workbook/big-data-more-common-now-ever)。\n\
  \n在下一节中，我们将讨论如何利用地图和多边形的组合来进一步扩展我们的 Tableau 工具箱。\n\n## 创建自定义多边形\n\nTableau 原生提供多边形的地理区域包括全球机场代码、城市、国家/地区、区域、领土、州、省份，以及某些邮政编码和二级行政区（县级区域）：美国区号、核心统计区\
  \ (CBSAs)、大都市统计区 (MSAs)、国会选区和 ZIP 代码。这意味着，例如，可以轻松为世界各国创建填充地图。只需复制世界各国列表（Ctrl + C），然后在\
  \ Tableau Desktop 的空白工作表上将鼠标定位并按 Ctrl + V 将该列表粘贴到 Tableau 中。新数据源将添加到数据区域的右上角。接下来，将\
  \ Tableau 的视图类型设置为 填充地图，并将国家列表放置到 详细信息 卡。Tableau 将自动为每个数据点绘制多边形。有一些地理类型，Tableau\
  \ 不会自动提供多边形。这些包括电话区号。对于这些地理类型，Tableau 会绘制符号地图，但不会绘制填充地图，如下所示：\n\n![](img/66cf6b89349fda3581a4f196cb3c98a4_391_0.png)\n\
  \n图 9.9：填充地图失败\n\n尽管选择了填充地图 **标记** 类型，Tableau 仍无法填充地图，因为这些区域的轮廓对 Tableau 来说是未知的。此外，可能会出现特殊的映射需求，需要为地图上通常不包含的区域绘制多边形。例如，组织可以定义不遵循常规地图边界的销售区域。或者，Tableau\
  \ 作者可以将篮球场或足球场的图片导入 Tableau，并绘制多边形来表示比赛区域的特定部分。另一种替代方案（我们在 _第 8 章，超越基础_ 中详细讨论过）是映射商店中的书架。\n\
  \n除了自行绘制多边形外，还有一些文件类型支持绘制多边形。其中一种文件类型是 .shp。在下一个练习中，我们将使用此类文件并为德克萨斯州创建多边形。\n\n通过处理上述\
  \ .shp 文件类型的示例，Tableau 可以创建多边形。让我们尝试一下，并将德克萨斯州的人口显示为德克萨斯州地图上的多边形：\n\n- 1. 打开 **德克萨斯州交通部**\
  \ 页面：https://gis-txdot.opendata.arcgis.com/datasets/txdot-city-boundaries/explore?location=30.990445%2C-100.168292%2C6.68\n\
  \n- 2. 使用 **下载** 下拉菜单并下载 **Shapefile**\n\n![](img/66cf6b89349fda3581a4f196cb3c98a4_392_0.png)\n\
