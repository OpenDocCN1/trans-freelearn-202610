  \ | 2022 | 12 | 4323 |\n| | | | | | | 2022 | 11 | 5757 |\n| | | | | | | 2022 | 10\
  \ | 4444 |\n| | | | | | | 2022 | 9 | 625 |\n| | | | | | | 2022 | 8 | 191 |\n| |\
  \ | | | | | 2022 | 7 | 6480 |\n| | | | | | | 2022 | 6 | 4231 |\n| | | | | | | 2022\
  \ | 5 | 2696 |\n| | | | | | | 2022 | 4 | 4600 |\n| | | | | | | 2022 | 3 | 6999 |\n\
  | | | | | | | 2022 | 2 | 8123 |\n| | | | | | | 2022 | 1 | 9602 |\n\nFigure 4.14:\
  \ 联合\n\n让我们来看看需要记住的要点：\n\n- • 联合通过创建额外行来追加数据。\n- • 联合应包含具有许多共同列的数据集。\n- • 联合仅应用于存储在多个数据源中且结构相同的数据。\n\
  - • 使用联合时要留意性能。联合中的每个额外数据集都会增加 Tableau VizQL 查询语言的复杂度。\n\n既然您刚刚成为联合专家，是时候继续了解 Tableau\
  \ 提供的下一个功能：**混合**了！混合可帮助您合并粒度不同的数据集。请考虑数据集之间的*一对多*关系。一个数据集每行有一个唯一键；另一个数据集每个键有多行。为了避免在前者数据集中复制行，Tableau\
  \ 在关系成为软件包的一部分之前很久就部署了混合功能。\n\n## 我们还需要混合吗？\n\n关系使数据混合的需求稍微少一些，它可以被视为旧版功能。但是，为了完整性以及针对较旧的\
  \ Tableau 版本（2020.2 以下），让我们在以下各节中考虑数据混合的摘要。简而言之，数据混合允许您将多个不同的数据源合并到单个视图中。理解以下四点将使您掌握有关数据混合的要点：\n\
  \n- • 数据混合通常用于合并来自多个数据源的数据。虽然从 Tableau 10 开始，多个数据源之间可以进行连接，但在某些情况下，数据混合仍然是合并两个或更多数据源数据的唯一可行选项。在以下各节中，我们将看到一个演示此类情况的实际示例。\n\
  \n- - 数据混合需要一个共享维度。日期维度通常是混合多个数据源的可行候选项。\n- - 数据混合先聚合再匹配。另一方面，连接先匹配再聚合。\n- - 数据混合不支持来自次要数据源的维度。尝试使用次要数据源的维度会导致视图中出现\
  \ * 实例或空值。此规则有个例外，我们将在“添加次要维度”部分稍后讨论。\n\n既然我们已介绍关系、连接和联合，我希望将您的注意力稍微转移到工作簿中的数据结构上。您可能已设置完美的连接或联合，开始将字段拖放到工作簿画布上，使用了筛选器，使用了计算字段，然后得到了一些意外结果。Tableau\
  \ 表现正常，只是不符合您的期望。这是为什么呢？！在这里，操作顺序至关重要。了解何时应用哪个筛选器以及这如何影响您的数据是必不可少的。因此，接下来是操作顺序。\n\
  \n## 探索操作顺序\n\n数据混合难道不等同于左连接吗？这是新 Tableau 作者经常提出的问题。答案当然是否定的，但让我们来探讨一下区别。以下示例很简单，甚至有些轻松愉快，但它确实展示了因错误连接导致的错误聚合可能带来的深远后果。\n\
  \n我们将探讨 Tableau 中聚合发生的顺序。这将帮助您更有效地使用混合和连接。\n\n本示例中，我们将使用以下数据：\n\n| 裤子 | | 衬衫 | |\n\
  |---|---|---|---|\n| 销售人员 | 裤子销售额 | 销售助理 | 衬衫销售额 |\n| Tanya | 100 | Tanya | 50 |\n\
  | Tanya | 100 | Tanya | 50 |\n| Zhang | 100 | Zhang | 50 |\n| Zhang | 100 | Zhang\
  \ | 50 |\n\nFigure 4.15: 裤子和衬衫销售\n\n\n\n\n\n在这些表格中，列出了两个人：**塔尼亚** 和 **张**。在一个表格中，这些人是\
  \ **销售人员** 维度的成员，在另一个表格中，他们是 **销售助理** 维度的成员。此外，**塔尼亚** 和 **张** 均销售了价值 $200 的裤子和\
  \ $100 的衬衫。让我们探索 Tableau 连接这些数据的新方式，以更好地理解连接和数据混合。\n\n查看与此练习相关的电子表格时，您会注意到有其他列。这些列将在后续练习中使用。\n\
  \n请执行以下步骤：\n\n- 1. 在与此章节相关的工作簿中，右键单击 **裤子** 数据源，并单击 **查看数据** 查看数据。对 **衬衫** 数据源也执行相同操作。\n\
  \n- 2. 通过右键单击并选择 **编辑数据源** 打开 **连接** 数据源，并观察 **裤子** 和 **衬衫** 表之间的连接，使用 **销售人员/销售助理**\
  \ 作为公共键：\n\n### 连接\n\n![](img/66cf6b89349fda3581a4f196cb3c98a4_155_0.png)\n\n###\
  \ 图 4.16：连接\n\n- 3. 在 **裤子** 工作表中，选择 **裤子** 数据源，并将 **销售人员** 放置于 **行** 书架，将 **裤子金额**\
  \ 放置于 **文本** 书架：\n\n![](img/66cf6b89349fda3581a4f196cb3c98a4_156_0.png)\n\n### 图\
  \ 4.17：设置工作表\n\n- 4. 在 **衬衫** 工作表中，选择 **衬衫** 数据源，并将 **销售助理** 放置于 **行** 书架，将 **衬衫金额**\
  \ 放置于 **文本** 书架：\n\n![](img/66cf6b89349fda3581a4f196cb3c98a4_156_1.png)\n\n### 图\
  \ 4.18：衬衫\n\n- **5.** 在 **连接** 工作表中，选择 **连接** 数据源，并将 **销售人员** 放置于 **行** 书架。接下来，双击\
  \ **裤子金额** 和 **衬衫金额** 将两者都放置于视图中：\n\n![](img/66cf6b89349fda3581a4f196cb3c98a4_157_0.png)\n\
  \n### 图 4.19：连接\n\n- **6.** 在 **混合裤子—主要** 工作表中，选择 **裤子** 数据源，并将 **销售人员** 放置于 **行**\
  \ 书架，将 **裤子金额** 放置于 **文本** 书架：\n\n![](img/66cf6b89349fda3581a4f196cb3c98a4_158_0.png)\n\
  \n### 图 4.20：混合裤子\n\n- 7. 留在同一工作表中，从左侧的数据源窗格中选择 Shirts 数据源，并双击 Shirt Amount。如果弹出错误消息，请单击确定。\n\
  \n- 8. 从菜单栏选择 Data，然后选择 Edit Blend Relationships...\n\n![](img/66cf6b89349fda3581a4f196cb3c98a4_158_1.png)\n\
  \n### 图 4.21：编辑混合关系...\n\n- 9. 在生成的对话框中，将 **裤子** 选择为 **主数据源** 值，将 **衬衫** 选择为 **次要数据源**\
  \ 值，然后单击 **自定义** 单选按钮，如 **图 4.22** 所示，然后单击 **添加**...\n\n- 10. 在左列中选择 **销售人员**，在右列中选择\
  \ **销售助理**。左列表示来自 **主数据源** 选择的数据，右列表示 **次要数据源** 选择中可用的所有数据。\n\n- 11. 删除所有其他链接（如果有），然后单击\
  \ **确定**。对话框中的结果应与以下屏幕截图中显示的内容一致：\n\n![](img/66cf6b89349fda3581a4f196cb3c98a4_159_0.png)\n\
  \n### 图 4.22：混合关系\n\n> 注意\n> 迄今为止我们所做工作的小结：我们正在使用三个数据源：**裤子**、**衬衫** 和 **连接**，其中\
  \ **连接** 由 **裤子** 和 **衬衫** 组成。我们还创建了一个以 **裤子** 为主数据源的混合，并使用 **销售人员** 和 **销售助理**\
  \ 作为键将它们连接起来。\n>\n> 请勿因名称 **混合关系** 而混淆。这与逻辑层关系无关。它只是弹出窗口的名称。\n\n回到练习，继续执行以下步骤：\n\
  \n- **12.** 在 **混合衬衫—主要** 工作表中，选择 **衬衫** 数据源，并将 **销售助理** 放置于 **行** 书架，将 **衬衫金额**\
  \ 放置于 **文本** 书架：\n\n![](img/66cf6b89349fda3581a4f196cb3c98a4_160_0.png)\n\n### 图\
  \ 4.23：混合衬衫—主要\n\n- 13. 在同一工作簿中，选择 Pants 数据源，确保 Salesperson 旁边的链接图标已连接/为红色，并双击 Pants\
  \ Amount 将其添加到视图：\n\n![](img/66cf6b89349fda3581a4f196cb3c98a4_160_1.png)\n\n###\
  \ 图 4.24：完成工作表\n\n- 14. 将所有五个工作表放置在一个仪表板上。按需格式化和排列。现在，让我们比较以下屏幕截图中五个工作表的结果：\n\n\
  裤子\n销售人员\n塔尼亚 200\n张 200\n\n衬衫\n销售助理\n塔尼亚 100\n张 100\n\n连接\n销售人员 裤子金额 衬衫金额\n塔尼亚\
  \ 400.0 200.0\n张 400.0 200.0\n\n混合裤子 — 主要\n销售人员\n塔尼亚 200\n张 200\n\n混合衬衫 — 主要\n销售助理\
  \ 裤子金额 衬衫金额\n塔尼亚 200.0 100.0\n张 200.0 100.0\n\n### 图 4.25：比较\n\n在上述屏幕截图中，连接工作表的结果是预期结果的两倍。为什么？因为连接首先匹配公共键（在本例中为\
  \ 销售人员/销售助理），然后聚合结果。在公共键上找到的匹配越多，问题就越严重。如果在公共键上找到多个匹配，结果将呈指数级增长。两个匹配会产生平方结果，三个匹配会产生立方结果，依此类推。这种指数效应在以下屏幕截图中以图形形式表示：\n\
  \n| 销售人员 | 销售助理 | 连接 | 裤子金额 | 衬衫金额 |\n|---|---|---|---|---|\n| 塔尼亚 | 塔尼亚 | 塔尼亚 |\
  \ 100 | 50 |\n| 塔尼亚 | 塔尼亚 | 塔尼亚 | 100 | 50 |\n| 塔尼亚 | 塔尼亚 | 塔尼亚 | 100 | 50 |\n|\
  \ | | 塔尼亚 | 100 | 50 |\n| 张 | 张 | 张 | 100 | 50 |\n| | | 张 | 100 | 50 |\n| 张 | 张\
  \ | 张 | 100 | 50 |\n| | | 张 | 100 | 50 |\n\n### 图 4.26：连接\n\n另一方面，混合功能更高效，但在混合能够正常工作之前，我们必须编辑数据关系，以便\
  \ Tableau 能够使用 **销售人员** 和 **销售助理** 字段连接两个数据源。如果这两个字段名称相同（例如，**销售人员**），Tableau 将自动提供一个选项，以使用这些字段在数据源之间进行混合。\n\
  \n混合裤子—主要和混合衬衫—主要工作表的结果是正确的。没有指数效应。为什么？因为数据混合首先聚合两个数据源的结果，然后在公共维度上匹配结果。\n\n在此例中，它是\
  \ 销售人员/销售助理，如以下屏幕截图所示：\n\n| 销售人员 | SUM(裤子金额) | 销售助理 | SUM(衬衫金额) | 混合 | 裤子金额 | 衬衫金额\
  \ |\n|---|---|---|---|---|---|---|\n| 塔尼亚 | 200 | 塔尼亚 | 100 | 塔尼亚 | 200 | 100 |\n\
  | 张 | 200 | 张 | 100 | 张 | 200 | 100 |\n\n### 图 4.27：混合结果\n\n本练习让我们看到，连接可以改变数据结构，因此使用时要小心，并非常清楚哪些列适合作为键。此外，在连接数据之前和之后都要进行检查，这可以简单到行数计数并验证是否为预期结果。\n\
  \n混合有优点也有缺点；例如，添加维度并不那么简单。我们将在下一节中探讨有关次要维度的更多细节。\n\n## 添加次要维度\n\n数据混合虽然特别适用于连接不同的数据源，但也有局限性。最需要了解的重要局限性是，数据混合无法启用来自次要数据源的维度。此限制有一个例外；也就是说，有一种方法可以添加来自次要数据源的维度。让我们进一步探讨这一点。\n\
  \n数据源中除了 **销售人员**/**销售助理** 和 Shirt Amount/**裤子金额** 之外还有其他字段。我们将在本练习中引用这些字段：\n\n\
  - 1. 在与此章节相关的工作簿中，选择 **添加次要维度** 工作表。\n- 2. 选择 **衬衫** 数据源。\n\n\n\n\n\n- 3. 为 **衬衫**\
  \ 和 **裤子** 数据源添加 **材料类型** 之间的关系，执行以下步骤:\n\n- 1. 选择 **数据**，然后选择 **编辑关系**。\n- 2. 确保\
  \ **衬衫** 是主数据源，**裤子** 是辅助数据源。\n- 3. 选择 **自定义** 单选按钮。\n- 4. 单击 **添加...**\n- 5. 在左右两列中选择\
  \ **材料类型**:\n\n![](img/66cf6b89349fda3581a4f196cb3c98a4_163_0.png)\n\n图 4.28: 自定义混合关系\n\
  \n- 6. 单击 **确定** 返回视图。\n- 4. 将 **材料类型** 放置在 **行** 卡上。\n- 5. 选择 **裤子** 数据源，并确保 **数据**\
  \ 窗格中 **材料类型** 旁边的链接图标已激活，且 **销售人员** 旁边的链接图标已停用。如果图标是灰色的断开链接，则表示未激活。如果它是橙色的连接链接，则表示已激活:\n\
  \n![](img/66cf6b89349fda3581a4f196cb3c98a4_164_0.png)\n\n图 4.29: 衬衫和裤子\n\n- 6. 如下所示，在行卡上将\
  \ **材料类别** 放置在 **材料类型** 之前，将 **紧固件** 放置在 **材料类型** 之后:\n\n![](img/66cf6b89349fda3581a4f196cb3c98a4_164_1.png)\n\
  \n### 添加辅助维度\n\n| 材料类别 | 材料类型 | 紧固件 | |\n|---|---|---|---|\n| 技术 | 聚丙烯腈 | 按钮 | Abc\
  \ |\n| | 聚酯 | 触扣 | Abc |\n| 传统 | 羊毛 | * | Abc |\n\n图 4.30: 辅助维度\n\n材料类别是来自辅助数据源的维度。数据混合不支持启用来自辅助数据源的维度。为什么在这种情况下它有效？原因有几个：\n\
  \n- **材料类别** 和 **材料类型** 之间存在一对多关系；也就是说，**材料类型** 维度的每个成员与 **材料类别** 维度的一个且仅一个成员匹配。\n\
  - 视图基于 **材料类型** 而非 **材料类别** 进行混合。这一点很重要，因为 **材料类型** 的粒度低于 **材料类别**。尝试基于 **材料类别**\
  \ 对视图进行混合，不会将 **材料类型** 启用为辅助维度。\n- 主数据源中 **材料类型** 维度的每个成员在辅助数据源中也存在。\n\n**紧固件**\
  \ 也是来自辅助数据源的维度。图 4.35 在某个单元格中显示 *，从而表明 **紧固件** 未按维度应有方式工作；也就是说，它未对数据进行切片，如第 1 章\
  \ 回顾基础 中所述。显示星号的原因是 **羊毛** 关联了多个 **紧固件** 类型。**按钮** 和 **触扣** 显示是因为 **聚丙烯腈** 和 **聚酯**\
  \ 在底层数据中各只有一种 **紧固件** 类型。\n\n如果使用混合，请确保您的主要目的是合并度量值，并且不需要详细级别的维度。在创建仪表板之前了解这一点尤其有用，以便相应地做好准备。您的数据需要额外的准备工作（请参阅第\
  \ 3 章 使用 Tableau Prep Builder），因为连接和混合都无法为您带来预期的数据结构。或者，您可以利用支架，这是一种使用辅助数据源的技术——我们将在下一节中讨论此方法。\n\
  \n## 介绍支架\n\n**支架** 是一种通过混合引入第二个数据源来重塑和/或扩展初始数据源的技术。支架可以扩展 Tableau 的功能，以满足原本可能极其困难或完全不可能的可视化和分析需求。在\
  \ Tableau 中率先使用支架的 Joe Mako 讲述了一个故事，他使用该技术使用四个工作表重新创建了一个仪表板。原始仪表板未使用支架，需要精心像素对齐的\
  \ 80 个工作表。\n\n支架支持的众多可能性之一是扩展 Tableau 的预测功能。Tableau 的原生预测功能有时因缺乏高级性而受到批评。可以使用支架来解决这一批评。\n\
  \n步骤如下：\n\n- 1. 在与本章相关的工作簿中，选择 **支架** 工作表并连接到 **世界指标** 数据源。\n- 2. 使用 Excel 或文本编辑器，创建\
  \ **记录** 数据集。以下两行表格完整表示了 **记录** 数据集：\n\n| | A | B |\n|---|---|---|\n| 1 | 记录 | |\n\
  | 2 | | 1 |\n| 3 | | 2 |\n| 4 | | |\n| 5 | | |\n\n图 4.31: Excel 文件\n\n- 3. 将 Tableau\
  \ 连接到数据集。\n- 4. 为加快速度，请考虑使用 Ctrl + C 直接从 Excel 复制数据集，并使用 Ctrl + V 将其直接粘贴到 Tableau\
  \ 中。\n- 5. 在 Tableau 中创建一个名为 **开始日期** 的参数，设置如下图所示。注意截图中的高亮部分，您可以通过这些部分设置所需的显示格式:\n\
  \n![](img/66cf6b89349fda3581a4f196cb3c98a4_166_0.png)\n\n图 4.32: 显示格式\n\n- 6. 创建另一个名为\
  \ **结束日期** 的参数，设置相同。\n- 7. 在 **数据** 窗格中，右键单击刚刚创建的 **开始日期** 和 **结束日期** 参数，并选择 **显示参数**:\n\
  \n![](img/66cf6b89349fda3581a4f196cb3c98a4_167_0.png)\n\n图 4.33: 显示参数\n\n- 8. 根据需要设置开始日期和结束日期；例如，2000-2027:\n\
  \n![](img/66cf6b89349fda3581a4f196cb3c98a4_167_1.png)\n\n图 4.34: 开始日期和结束日期\n\n-\
  \ 9. 选择 **记录** 数据源并创建名为 **日期** 的计算字段，使用以下代码:\n\n```\nIIF([Records]=1,[Start Date],[End\
  \ Date])\n```\n\n- 10. 将 **日期** 字段放置在 **行** 卡上。\n- 11. 右键单击 **行** 卡上的 **日期** 字段，并选择\
  \ **显示缺失值**。请注意，开始日期和结束日期设置之间的所有日期现在都显示:\n\n![](img/66cf6b89349fda3581a4f196cb3c98a4_168_0.png)\n\
  \n图 4.35: 显示缺失值\n\n- 12. 创建名为 **选择国家 A** 的参数，设置如下图所示。请注意，国家列表是通过 **从字段添加值** 按钮添加的:\n\
