  \ 详细信息 卡上来完成前一步。\n\n![](img/66cf6b89349fda3581a4f196cb3c98a4_410_0.png)\n\n图 9.34:\
  \ 起点城市\n\n- 11. 由于我们的目标之一是在 **起点** 和 **目的地** 城市之间绘制线条，那么添加 **目的地** 也是合理的，对吗？双击 **目的地**\
  \ 将其添加到可视化中。\n\n- 12. 我们现在在视图中拥有所有 **起点** 和 **目的地** 城市，但我们无法区分它们，因为它们都在同一图层上。因此，将刚刚添加的\
  \ **目的地** 字段从 **详细信息** 卡拖动到视图的左上角，直到出现 **添加标记图层** 标志：\n\n![](img/66cf6b89349fda3581a4f196cb3c98a4_411_0.png)\n\
  \n图 9.35: 货运 II\n\n- 13. 你现在将看到 **标记** 卡显示两个图层\n\n![](img/66cf6b89349fda3581a4f196cb3c98a4_412_0.png)\n\
  \n图 9.36: 标记\n\n- 14. 通过双击名称将 目的地 图层重命名为 目的地国家。\n\n- 15. 将 Line 拖动到 添加标记图层 来添加另一个图层，并将\
  \ 送达天数 添加到 颜色。将此图层命名为 Line，并从 标记 卡下拉菜单中选择 自动 类型。\n\n![](img/66cf6b89349fda3581a4f196cb3c98a4_412_1.png)\n\
  \n图 9.37: 标记图层\n\n- 16. 将 City 拖动到 添加标记图层 来添加另一个图层，并将其命名为 City (2)。将 目的地国家 添加到 详细信息。从\
  \ 标记 卡下拉菜单中选择 自动 类型。\n\n![](img/66cf6b89349fda3581a4f196cb3c98a4_413_0.png)\n\n\
  图 9.38: 标记图层\n\n- 17. 最后，返回 目的地国家 图层，将 目的地国家 更改为 详细信息，并将 重量 放在 颜色 上。从 标记 卡下拉菜单中选择\
  \ 地图。\n\n![](img/66cf6b89349fda3581a4f196cb3c98a4_413_1.png)\n\n图 9.39: 标记图层\n\n\
  - 18. 通过拖放图层按以下顺序排序：Line、City、City (2) 和 目的地国家。你的工作表现在应如下所示：\n\n![](img/66cf6b89349fda3581a4f196cb3c98a4_414_0.png)\n\
  \n图 9.40: 地图\n\n- 19. 为了使可视化稍微易于解读，将 起点 放在 筛选器 卡上，并仅选择几个你喜欢的起点。\n\n- 20. 为了区分 起点\
  \ 和 目的地，打开 City 和 City (2) 地图图层，分别将 City 和 City (Destination) 从 详细信息 更改为 形状。为 起点\
  \ 选择一种形状，为 目的地 选择另一种形状，例如，起点 使用实心圆，目的地 使用十字。你也可以通过单击 颜色 卡为形状着色：\n\n![](img/66cf6b89349fda3581a4f196cb3c98a4_415_0.png)\n\
  \n图 9.41: 最终分层地图\n\n现在，让我们看看我们创建了什么。我们可以看到货物正从每个圆圈运输到十字城市。两座城市都由黄色到红色范围着色的线条连接。黄色调越多，表示送货越快；红色调越多，表示送货时间越长。目的地国家以青绿色到深蓝色范围着色。颜色越深，运送到那里的重量越大。我们可以轻松发现，意大利接收了最重的运输，来自伊斯坦布尔并在\
  \ 6 天内送达。最慢的运输是从布达佩斯到华沙，花费了 26 天。\n\n希望这个练习向你展示了分层地图的优势。每个图层允许你以其独特的方式使用 颜色、形状、大小、标签\
  \ 和其他 标记，为你的分析开辟新路径。在下一节中，我们将进一步探讨，并将在 Tableau 中将外部技术用于地图。\n\n## 使用另一项技术扩展 Tableau\
  \ 映射\n\n接下来，我们将考虑如何使用其他工具扩展 Tableau 的映射功能。Tableau 的开发者在创建一个易于扩展的映射接口时非常谨慎。这种可扩展性的某些领域，例如连接到\
  \ Web 地图服务 (WMS) 服务器，可直接从界面使用；我们将在下一部分探讨。\n\n### 将自定义地图与 WMS 一起使用\n\n将自定义地图引入 Tableau\
  \ 的最简单方法是直接从 桌面版。我们需要一个指向 WMS 服务器的格式正确的 URL。Tableau Desktop 可以连接到任何支持 WMS 1.0.0、1.1.0\
  \ 或 1.1.1 标准的 WMS 服务器。\n\n查找此类 URL 列表的好地方是在线目录，它们提供来自世界各地数百种不同地图服务的信息。许多政府机构、航天机构和环境组织提供免费\
  \ WMS 服务。\n\n你为什么想要使用 WMS 地图？\n\n假设你拥有一家在线商店。你可以查看特定产品的销售额在某些地区是否更高——例如，雨天地区的雨伞或炎热地区的防晒产品。通过添加天气\
  \ WMS 图层，你可以查看当地条件与销售额之间是否存在相关性。或者，也许你需要监控仓库附近的山火风险，或追踪航运路线上的海冰。WMS 地图将这种上下文相关的现实世界数据直接带入你的\
  \ Tableau 仪表板。\n\n### 选择 WMS URL 时应关注什么：\n\n- **可靠性**：该服务是否由稳定的组织（政府、大学、航天机构）托管？\n\
  - **更新频率**：数据是实时更新、每日更新，还是静态历史图层？\n- **地理覆盖范围**：该服务是否覆盖你感兴趣的区域（全球、区域、本地）？\n- **图像格式**：服务器是否返回\
  \ PNG 或 JPEG 等标准格式？\n- **许可证**：该服务是否免费用于商业用途，或仅用于教育/个人用途？\n\n以下练习灵感来自 Jeffrey A.\
  \ Shaffer 的文章《在不到 1 分钟内在 Tableau 中构建天气雷达》，可在此处访问：https://www.dataplusscience.com/TableauWeatherRadar.html。但是，我们将包含一个不同的地图，我们的来源是\
  \ NASA Earth Observation 数据（https://neo.gsfc.nasa.gov/）。在此练习中，我们将看到，通过绘制额外数据（以背景图像形式）放在数据集下方，你将能够为业务做出更好的决策。例如，如果你的销售额取决于良好（或不良）天气，或者你的生产面临附近山火风险，你将能够在一个\
  \ Tableau 仪表板中查看所有这些情况：\n\n### 一般连接步骤：\n\n- 1. 从选定的提供商处复制 WMS URL\n- 2. 在 Tableau\
  \ 中，导航到 Map | Background Maps | Add WMS Map（或较新版本中的 Map Services）\n- 3. 粘贴 URL 并单击\
  \ OK\n\n\n\n\n\n+   4. 连接后，您可能需要从可用选项中选择要显示的图层\n+   5. 使用“地图 | 背景图层”菜单调整地图不透明度，以便您的数据可视化始终清晰显示在上方\n\
  \n> **注意**\n> 在继续之前，关于瓦片和缩放，有个说明。由于高分辨率地图可能有许多千兆字节，要求您下载整个地图只是为了放大某个小区域是不切实际的。瓦片通过启用多个缩放级别来解决这个问题。缩放级别\
  \ 0 会生成一个单个瓦片（通常是 256 x 256 像素的 PNG 图像），显示整个地图。随着缩放级别的增加，地图瓦片的数量会呈指数增长。同样，显示的地图部分会按比例缩小；也就是说，随着缩放级别的增加，显示的整个地图区域会减少，而填充显示所需的瓦片总数保持不变。这有助于控制任何给定时间下载的数据量。\n\
  \n接下来，我们将探索 Mapbox。\n\n## 探索 Mapbox\n\nMapbox 提供自定义地图，并与 Tableau 原生集成。要了解如何构建自己的自定义地图，可以访问其网站：https://www.mapbox.com/。从\
  \ Tableau 2019.3 开始，多种 Mapbox 样式甚至默认可用。\n\n![](img/66cf6b89349fda3581a4f196cb3c98a4_417_0.png)\n\
  \n图 9.4.2：背景地图\n\n除此之外，Mapbox 本身提供一项扩展映射服务，配有配套 Web 应用程序，使用户能够自定义地图。这种可定制性涵盖字体、颜色、背景图片等。Mapbox\
  \ 提供基本免费服务，但当然，更多地图和更大带宽需求将需要支付相应费用的升级。\n\n本练习将向您展示如何连接到 Mapbox：\n\n+   1. 导航至 https://www.mapbox.com\
  \ 并创建帐户。\n\n+   2. 完成注册并登录 Mapbox 后，单击 Studio 链接。\n\n+   3. 单击“新建样式”开始创建地图。我选择了“单色\
  \ | 深色 | 自定义单色”。\n\n+   4. Mapbox 编辑器应会打开。根据您的需求调整地图。\n\n+   5. 完成后，单击右上角的“共享”。选择“第三方\
  \ | Tableau”并复制 URL。\n\n![](img/66cf6b89349fda3581a4f196cb3c98a4_418_0.png)\n\n\
  图 9.4.3：Mapbox 集成\n\n+   6. 在本章关联的工作簿中，导航至 Mapbox Classic 工作表，并选择“地图 | 背景地图 | 添加\
  \ Mapbox 地图”。\n\n+   7. 添加样式名称（我使用了 MasteringTableau）并复制 URL。单击确定。\n\n+   8. 选择\
  \ Superstore 数据源，双击“州”，并通过“地图 | 背景地图 | MasteringTableau”路径选择 MasteringTableau 地图样式。\n\
  \n![](img/66cf6b89349fda3581a4f196cb3c98a4_419_0.png)\n\n图 9.4.4：背景地图\n\n由此可见，Tableau\
  \ 使用了我们之前在 Mapbox 中创建的地图。太棒了！这意味着您可以按照喜好自定义地图。\n\n有关如何创建自定义地图以及您需要知道的关于 Mapbox 的所有内容的手册，可以在此处找到：https://docs.mapbox.com/studio-manual/guides/。\n\
  \n## 交换地图\n\n我们将创建一个仪表板，允许最终用户在我们刚刚讨论的各种地图之间进行选择。本练习使用的技术称为工作表交换。不过，对该技术的深入探讨将在第\
  \ 11 章“设计仪表板和可视化最佳实践”中介绍。\n\n让我们来看看必要的步骤：\n\n+   1. 导航到本章关联的工作簿中的 MapSwap 工作表。双击“州”。将“标记”卡视图设置为地图，单击“颜色”，将不透明度设置为\
  \ 0%，最后，将边框设置为“自动”。\n+   2. 复制 MapSwap 工作表两次。\n+   3. 选择 MapSwap 工作表，导航至“地图 | 背景地图\
  \ | 正常”。\n+   4. 选择 MapSwap (2) 工作表，导航至“地图 | 背景地图 | 深色”。\n+   5. 选择 MapSwap (3)\
  \ 工作表，导航至“地图 | 背景地图 | 卫星”。\n\n+   6. 创建一个名为 Show Sheet 的参数，如下所示：\n\n![](img/66cf6b89349fda3581a4f196cb3c98a4_420_0.png)\n\
  \n图 9.4.5：参数\n\n+   7. 在 **数据** 窗格中右键单击该参数，并选择 **显示参数控件**。\n\n+   8. 创建一个名为 Show\
  \ Sheet Filter 的计算字段，如下所示：\n\n```\n[Show Sheet]\n```\n\n+   9. 选择 MapSwap 工作表，并将\
  \ **Show Sheet Filter** 放置在 **筛选器** 书架上。选择 **从列表中选择** 和 **正常**。\n\n![](img/66cf6b89349fda3581a4f196cb3c98a4_421_0.png)\n\
  \n图 9.4.6：工作表筛选器\n\n+   10. 选择 **MapSwap (2)** 工作表，并将 **Show Sheet Filter** 放置在\
  \ **筛选器** 书架上。这次，选择 **自定义值列表** 并键入 Dark。\n\n+   11. 在 **MapSwap (3)** 工作表上重复上一步，并键入\
  \ **Satellite** 代替 Dark。\n\n+   12. 创建一个仪表板并将其命名为 **db_MapSwap**。在仪表板上放置一个垂直容器。\n\
  \n+   13. 将所有三个 **MapSwap** 工作表放置在垂直容器中并隐藏其标题。\n\n+   14. 选择不同的地图样式，看看您的地图如何变化。\n\
  \n您可能在自己的计算机上见过深色/浅色或日/夜背景功能，或者在 **YouTube** 等网站或 **PyCharm** 等 IDE 上见过。通过 **MapSwap**\
  \ 功能，您现在可以在 Tableau 仪表板上为用户提供同样的便利。\n\n## 自定义地理编码\n\n在结束本章之前，我想分享几周前在 LinkedIn 上看到的一个快速技巧。描述以下练习的帖子来自\
  \ Klaus Schulte，一位德国教授和 2018 年 Iron Viz 冠军。\n\n他分享说，他使用自定义地理编码构建了一个网格地图。让我们尝试复制它！\n\
  \n从某处下载六边形地图数据，或自行创建。对于本练习，您可以使用我 Tableau Public 或 GitHub 上的六边形地图数据：https://github.com/PacktPublishing/Mastering-Tableau-2026/tree/main/Chapter09。如果您想自行创建，请回顾第\
  \ 8 章“超越基础”中的多边形练习。您可以以我们创建书籍多边形的同样方式创建该文件：\n\n+   1. 将 hexmap 文件放在 Tableau 存储库的\
  \ Mapsources 文件夹中。\n\n+   2. 将 Tableau Desktop 连接到默认的 Superstore 数据。\n\n+   3. 双击“州/省”。\n\
  \n+   4. 在 **数据** 窗格中单击“州/省”，并选择“地理角色 | Hexmap.xlsx”。\n\n+   5. 单击“地图 | 背景图层”，并将“淡化\
  \ (%)”设置为 100%。\n\n为什么要这么做？因为网格地图会均匀分布州。如果没有它，您将无法区分近距离的州，并且会漏掉一些遥远的州。\n\n谢谢 Klaus\
  \ 提供这个绝妙技巧！顺便说一句，六边形地图不仅适用于美国。也可以尝试欧洲、非洲、南美洲或亚太地区（APAC）！每当您处理大小差异时，网格地图都非常有用。\n\n\
  ## 跟随练习仪表板\n\n在本跟随练习中，我们将使用来自 opentransportdata.swiss 的官方瑞士 GTFS 时间表数据。\n\n废话不多说，让我们按照步骤开始吧：\n\
  \n+   1. 转到“数据”，并搜索 Timetable 2026 (GTFS2020)。\n\n+   2. 下载任意日期的 ZIP 文件；我使用的是 2026\
  \ 年 3 月 18 日的文件。\n\n![](img/66cf6b89349fda3581a4f196cb3c98a4_422_0.png)\n\n图 9.4.7：OpenTransport\
  \ 数据\n\nZIP 包含多个 CSV 文件。每个文件的用途如下：\n\n| 文件 | 用途 | 关键字段 |\n|---|---|---|\n| stops.txt\
