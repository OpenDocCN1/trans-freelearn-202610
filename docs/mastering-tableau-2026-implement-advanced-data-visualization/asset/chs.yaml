  \n## 加速器\n\n此功能在更基本的层面上工作：如何设计、构建和组合仪表板。加速器是来自不同部门、具有不同侧重点的预定义仪表板。目前，有超过 100 个可用，支持多种语言，面向不同部门、行业和企业应用。与其从头开始，不如通过\
  \ Tableau Desktop 登录页面或 Tableau Server 上的链接单击 **加速器** 仪表板：\n\n![](img/66cf6b89349fda3581a4f196cb3c98a4_369_1.png)\n\
  \n图 8.54: Tableau 登录页面\n\n在图 8.54 中，左侧的两个仪表板始终显示在 Tableau Desktop 登录页面上，您对此已很熟悉：即\
  \ Superstore 和 World Indicators 数据集。在它们旁边，您可以看到一个戴耳机的两个人的图标。这是我加载的第三个加速器仪表板。但是，查看右上角的红色框，您可以看到一个名为\
  \ **更多加速器** 的超链接；单击它。\n\n想象一下，您想使用金融交易数据和加速器仪表板来启动您的项目。搜索 trading：\n\n## 加速器\n\n\
  快速构建针对行业或企业应用定制的强大仪表板，全部使用您的数据。\n\n- 了解更多\n\n![](img/66cf6b89349fda3581a4f196cb3c98a4_370_0.png)\n\
  \n- 排序方式\n- 下载量\n- 连接类型\n- 全部\n- 语言\n- 全部\n- 功能\n- 由 Tableau + Salesforce 构建\n-\
  \ 启用数据映射\n- 类别\n- 全部\n- 企业财务\n- 客户服务\n- 数字与社交媒体\n- 数字机构\n\n## 所有加速器\n\n- Salesforce\
  \ Sales Cloud - 加权销售管道\n- 由 Tableau 提供\n- 销售云：进行整体销售管道审查（具有...的机会）\n- 预算控制\n- 由\
  \ Tableau 提供\n- 监控、跟踪和管理财务表现与支出（相对于预算）\n- 零售销售\n- 由 Tableau 提供\n- 评估您的网络表现并增长您的销售\n\
  - keyrus\n- 客户洞察与 Data Cloud\n- 呼叫中心代理分析\n- 立即\n- 管理仪表板\n\n图 8.55: 搜索加速器\n\n单击 Tableau\
  \ 的 Trading 仪表板后，将打开一个新的 Tableau 工作簿——内置了完全构建好的交易仪表板，更棒的是，具有数据映射功能，这意味着您可以用不同的数据替换当前数据，而不会破坏仪表板布局和预构建功能。每个加速器仪表板中的描述包含可能或不可能的数据映射信息。\n\
  \n\n\n\n\n当您打开新仪表板时，将看到以下弹出窗口：\n\n![](img/66cf6b89349fda3581a4f196cb3c98a4_371_0.png)\n\
  \n## 添加您的数据\n\n您可以使用自己的数据替换此加速器中的示例数据。数据映射器可帮助您添加数据，并将您的字段分配给加速器使用的字段。\n\n暂不 开始使用\n\
  \n图 8.56: 数据映射器\n\n单击“开始使用”，将所需数据集连接到加速器仪表板。\n\n> **注意**\n> 您可以使用此数据集进行测试：https://www.kaggle.com/datasets/georgezakharov/historical-data-on-the-trading-of-cryptocurrencies.\n\
  \n![](img/66cf6b89349fda3581a4f196cb3c98a4_372_0.png)\n\n图 8.57: 数据映射器 II\n\n加载后，您可以开始逐个字段进行映射：\n\
  \n![](img/66cf6b89349fda3581a4f196cb3c98a4_372_1.png)\n\n图 8.58: 映射数据\n\n重要说明：您无需映射所有字段；但是，如果工作簿中的可视化使用了未映射的列，这些实例将显示为\
  \ null。\n\n映射完成后，您的仪表板即可使用！抽样检查一切是否符合预期，您的工作就完成了！\n\n太棒了，不是吗？真是个省时工具；我真的很喜欢 Tableau\
  \ 中的这个新功能。\n\n## 连接器\n\nTableau Exchange 提供的最后一部分是 **连接器**。在这里，您可以找到连接到未在 Tableau\
  \ Desktop 的 **连接** 窗格中列出的数据库的连接器。\n\n总而言之，Tableau Exchange 是一个平台，您可以在其中找到各种工具以快速获得有意义的洞察。它提供\
  \ Tableau 加速器（由专家预先构建的仪表板）、提供 Tableau 原生功能之外功能的扩展，以及允许您连接到默认窗格中未列出的数据库的连接器。这是一个真正免费的市场，可帮助您开启\
  \ Tableau 之旅。\n\n## Einstein Discovery\n\n在前一节中，我们讨论了 Tableau Exchange；但是，另一个同样超越基础的功能也值得关注。但在继续之前，先简单介绍一下背景。2019\
  \ 年 8 月，Tableau 被 Salesforce 收购。您中的大多数人可能都知道 Salesforce，甚至使用过它，但对于其他所有读者，Salesforce\
  \ 是一款云原生的 **客户关系管理（CRM）** 工具。除此之外，该公司还开发了一个分析部分，允许 Salesforce 用户分析来自 CRM 系统和其他数据源的数据。\n\
  \n在收购之前，将 Salesforce 连接到 Tableau 就已可行，但 Tableau 2021.1 中的新功能是 Salesforce 的分析部分可作为扩展和在计算字段中集成到\
  \ Tableau 中。Tableau 社区对这一功能非常兴奋，因为它具有内置的机器学习功能和实时预测能力。这款软件称为 Einstein Discovery。\n\
  \n> **注意**\n> 要使用 Einstein Discovery，您需要 Salesforce 许可证，更具体地说，需要 Salesforce 的分析许可证。许可详情请参阅：https://www.salesforce.com/editions-pricing/crm-analytics/。\n\
  \n现在，为了让您了解 Einstein Discovery 可以为您做什么，我将带您了解一个虚构的用例。在供应链数据仪表板上，您发现可以改善运输时间，但不知道哪些因素导致了延误。在这种情况下，您可能会决定使用\
  \ Einstein Discovery 进行分析功能。\n\n首先，将 **扩展** 对象拖到仪表板上，就像我们使用 **显示更多** 扩展所做的那样。然后选择\
  \ **Einstein Discovery** 项目，此时会打开一个浏览器窗口，要求您登录 Salesforce。登录后，您可以选择要在 Tableau 仪表板上使用的模型。该模型（例如机器学习模型）必须事先在\
  \ Salesforce 中准备好。然后，Einstein Discovery 将成为您仪表板的一部分，您的工作表将显示 Salesforce 后台运行模型的输出。在我们的示例中，该模型将更容易找到仪表板上最适合预测交货时间的相关变量，并将推荐您可以采取的措施以改善运输时间。\n\
  \n**注意**\n所述用例及另一个用例的视频可在以下网址观看：https://youtu.be/dMluy6mVE_o。\n\n或者，您可以直接在计算字段中调用\
  \ Salesforce 模型。其工作原理请参阅：https://help.tableau.com/current/pro/desktop/en-us/einstein_discovery_predictions.htm。\n\
  \n如果您想尝试这些新功能，即使没有 Salesforce 许可证，也有办法测试新的 Einstein 功能。设置过程较长，但对于确实想要尝试的人来说，请查看此视频以获得帮助：https://youtu.be/ZReSwXk0reo。\n\
  \n这些是 Tableau 2021.1 中定制的新 Einstein 功能的基石。不幸的是，详细介绍 Salesforce 平台的功能超出了本书的范围，但如果您已部署\
  \ Salesforce，我肯定会建议您设置连接并测试运行一些模型。即使您不使用 Salesforce，许可情况也可能随时间而变化，因此希望我们都能很快运行这些模型。目前，不用担心，因为我们将在第\
  \ 15 章\"集成编程语言\"中讨论机器学习模型集成。\n\n## 跟随练习仪表板\n\n本章的跟随练习将使用第 7 章相同的数据集。希望熟悉数据集会带来一种与应用\
  \ LOD 不同的有趣方法。\n\n- 1. 如果您还没有这样做：下载此文件：https://www.kaggle.com/datasets/mexwell/carrier-on-time-performance-dataset\n\
  - 2. 在 Tableau 中打开工作表，并将 Arr Delay 放到\"列\"。将度量值更改为平均值。\n- 3. 将 Origin State 拖到\"\
  行\"\n- 4. 将 Origin State 拖到标记卡的\"标签\"\n- 5. 将 AVG(Arr Delay) 拖到标记卡的\"颜色\"\n- 6.\
  \ 将工作表重命名为 Bar – Avg Delay by State\n\n![](img/66cf6b89349fda3581a4f196cb3c98a4_375_0.png)\n\
  \n图 8.59: Bar – Avg Delay by State 工作表\n\n这时就用到多边形了：每个州将被绘制为填充多边形。\n\n- 7. 打开新工作表\n\
  - 8. 通过右键单击 | 地理角色 | 州/省 更改 Origin State Name 的数据类型\n- 9. 双击 Origin State Name\n\
  - 10. Tableau 将识别地理角色并创建地图。如果右下角看到未知值，请单击它 | 编辑位置，并将国家/地区选择为美国。如果标记卡设置为点，请更改为地图。现在每个州都是一个填充多边形。让我们应用一些最后的美化更改。\n\
  - 11. 将 Avg(Arr Delay) 拖到标记卡的颜色\n- 12. 将颜色编辑为较高延迟的红色调色板\n- 13. 将 Origin State 拖到标签以在地图上显示州缩写\n\
  - 14. 将此工作表重命名为：Map – State Delay\n\n![](img/66cf6b89349fda3581a4f196cb3c98a4_376_0.png)\n\
  \n图 8.60: Map – State Delay 工作表\n\n最后，创建航空公司延误的条形图。\n\n- 1. 打开新工作表\n- 2. 将 **报告航空公司**\
  \ 拖到\"行\"\n- 3. 将 **Avg(到达延迟)** 拖到\"**列**\"\n- 4. 按延误降序排序\n- 5. 也将 **到达延迟** 拖到\"\
  **颜色**\"并将度量值更改为\"**平均值**\"。选择您喜欢的颜色调色板。\n- 6. 将工作表重命名为：**条形图 – 航空公司延误**\n\n![](img/66cf6b89349fda3581a4f196cb3c98a4_377_0.png)\n\
  \n图 8.61: Bar - Airline Delay 工作表\n\n接下来，我们将构建仪表板。\n\n- 1. 单击 **新建仪表板**\n- 2. 将工作表拖放到仪表板上：\n\
  - 3. 顶部：**Map – 州延误**（多边形地图）\n- 4. 左下角：**条形图 – 按州平均延误**\n- 5. 右下角：**条形图 – 航空公司延误**\n\
  \n**注意** 如果您希望布局更简洁，请使用水平/垂直容器，但这不是必需的。\n\n为了获得更好的用户体验，请执行以下步骤：\n\n- 6. 在仪表板上单击条形图\
  \ – 按州平均延误工作表\n- 7. 选择筛选器 | 航班日期\n- 8. 然后单击筛选器，并选择应用于工作表 | 所有使用此数据源的工作表\n\n现在，当您在地图上单击一个州多边形时，州条形图和航空公司条形图都将筛选该州。\n\
