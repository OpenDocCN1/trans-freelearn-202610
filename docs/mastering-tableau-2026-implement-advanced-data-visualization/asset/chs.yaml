  根据设置，Tableau Server 将显示各种类型的警告，例如 **已弃用**、**数据已过时**、**维护中** 和 **敏感数据**，这些警告可从下拉菜单中选择。


  您还可以决定是仅在数据源上显示类型，也在相关工作簿上显示。以下是在数据源上显示的示例：


  ![](img/66cf6b89349fda3581a4f196cb3c98a4_606_0.png)


