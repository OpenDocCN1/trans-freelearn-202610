  \n### 图 10.26: 筛选操作参数\n\n- 6. 如果您现在单击“按州划分的数量”工作表（源工作表）上的某个州，Tableau 将在目标工作表中查找相同的\
  \ **州**，并相应地进行筛选。以下是在单击 **德克萨斯州** 后的示例：\n\n![](img/66cf6b89349fda3581a4f196cb3c98a4_465_0.png)\n\
  \n### 图 10.27: 已筛选的表格\n\n本节讨论的筛选操作可用于清理仪表板。遵循设计原则通常意味着少即是多，如果您有许多数据点要共享，钻取操作或筛选操作可以帮助您实现此目标。首先呈现高级别数据，然后在筛选操作背后呈现更详细的数据层。您还可以在标题下方为用户添加一句话，例如：单击某个州以查看更多详细信息。\n\
  \n## 高亮操作\n\n其他选项例如高亮操作。对于同一页面上的工作表更有用，因为它只会高亮显示适用字段。您可以在同一仪表板上显示所有数据，但高亮操作使用户更容易找到相关数据点。请执行以下步骤：\n\
