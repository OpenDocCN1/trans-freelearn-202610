  现在，让我们更详细地考虑前一个练习中的一些具体内容。


  考虑以下代码块：


  ```

  REGEXP_EXTRACT([String of Data], ''()'')

  ```


  此处故意排除了表达式模式，因为将在稍后详细介绍。'' ( '' ) 代码充当表达式模式的占位符。本示例中使用的 REGEXP_EXTRACT 函数在 Tableau
  帮助文档中的描述如下：


  Returns a substring of the given string that matches the capturing group within
  the regular expression pattern.


  使用此函数时，请牢记以下几点重要注意事项：


  - 请注意，截至撰写本文时，Tableau 文档未说明如何确保函数的模式输入部分正确分隔。对于本示例，请务必在模式输入部分周围包含 '' ( '' )，以避免输出为
  null。

  - 在本身嵌套在 VizQL 查询中的计算字段内嵌套可能会影响性能（如果嵌套/聚合层级过多）。

  - 有许多正则表达式网站允许您输入自己的代码，并根据您提供的示例数据即时反馈来帮助您。http://regexpal.com/ 只是其中一个网站，请按需搜索以找到满足您需求的网站！


  现在，请考虑以下表达式：


  ```

  \(([0-9]{3}))[0-9]{3}-[0-9]{4}

  ```


  在此上下文中，\ 表示下一个字符不应被视为特殊字符，而应被视为普通字符。在我们的示例中，我们实际上是在查找左括号。[0-9] 实例仅声明我们正在查找一位或多位数字。或者，请考虑使用
  \d 以实现相同的结果。{3} 实例表示我们正在查找三个连续数字。


  与模式开头的左括号一样，\ 字符将右括号指定为普通字符。– 字符是专门查找连字符的普通字符。表达式模式的其余部分应根据前面的信息可以解读。


  回顾本练习后，您可能好奇如何仅返回电子邮件地址。根据 http://www.regular-expressions.info/email.html，符合 RFC
  5322 标准的电子邮件地址的正则表达式如下：


  ```

  (?:[a-z0-9!#$%&''*+/=?^_`{|}~-]+(?:\.[a-z0-9!#$%&''*+/=?^_`{|}~-]+)*|"(?:[\x01-\x08\x0b\x0c\x0e-\x1f\x21\x23-\x5b\x5d-\x7f]|\\[\x01-\x09\x0b\x0c\x0e-\x7f])*")@(?:(?:[a-z0-9](?:[a-z0-9-]*[a-z0-9])?\.)+[a-z0-9](?:[a-z0-9-]*[a-z0-9])?|\[(?:(?:(2(5[0-5]|[0-4][0-9])|1[0-9][0-9]|[1-9]?[0-9]))\.){3}(?:(2(5[0-5]|[0-4][0-9])|1[0-9][0-9]|[1-9]?[0-9])|[a-z0-9-]*[a-z0-9]:(?:[\x01-\x08\x0b\x0c\x0e-\x1f\x21-\x5a\x53-\x7f]|\\[\x01-\x09\x0b\x0c\x0e-\x7f])+)\])

  ```



  > **注意**

  >

  > 电子邮件并不总是符合 RFC 5322 标准，因此可能需要额外工作才能真正清理电子邮件地址数据。


  虽然我不会尝试详细解释这段代码，但你可以在 http://www.regular-expressions.info/email.html 上阅读所有相关内容，这是了解正则表达式更多知识的绝佳资源。另外，YouTube
  上有几个有用的正则表达式教程。


