  \n- 6. 为最终润色，添加以下标题：\n  - 仪表板：航班延误（LOD 仪表板）\n  - 根据喜好编辑颜色和字体；\n\n![](img/66cf6b89349fda3581a4f196cb3c98a4_325_0.png)\n\
  \n### 图 7.52：最终仪表板\n\n现在，您已经拥有了自己的 LOD 驱动的 Tableau 仪表板\n\n## 摘要\n\n本章首先探讨了 LOD 为何如此有影响力，以及其加入\
  \ Tableau 为何备受赞誉。接着，我们构建了两个游乐场来探索三种 LOD——FIXED、EXCLUDE 和 INCLUDE——的工作原理。Tableau\
  \ 的默认行为是基于视图中可见的维度进行计算。例如，如果视图中有州，销售额将按州显示。如果添加城市，销售额将按州、按城市进行调整。但是，如果您想操纵此默认逻辑，可以使用\
  \ LOD。它们允许您基于任何维度计算度量，无论该维度是否在视图中表示。我们还看到，FIXED LOD 在 Tableau 的操作顺序中高于 EXCLUDE 和\
