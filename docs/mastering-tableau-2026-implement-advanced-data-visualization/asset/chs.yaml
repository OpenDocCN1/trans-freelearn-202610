  \ 1、4 和 8，它们的最终结果都相同。这是否意味着每个选项都真正相同？选项 1 和 4 相同。然而，选项 8 略有不同。要理解这一点，请注意选项 8 在表计算对话框中的描述：\n\
  \n\n\n![](img/66cf6b89349fda3581a4f196cb3c98a4_228_0.png)\n\n### 图 5.29: 索引\n\n\
  示例 8 中的描述为 **结果沿运输方式、类别计算**（参见 *图 5.29*）。示例 1 描述框中的文本与示例 4 相同：**沿运输方式按类别计算结果**，这可以理解为将**类别**分区并寻址**运输方式**。这种翻译与示例\
  \ 1 中实际完成的分区/寻址设置相同。因此，示例 1 和示例 4 是相同的。但是，与示例 8 的微小差异是否意味着存在实际差异？不！\n\n示例 6 乍看之下可能令人困惑。为什么会出现奇怪的编号序列？因为寻址维度的顺序与\
  \ **行** 货架上维度的顺序不同。寻址顺序是 **运输方式**、**类别**。 **行** 货架上的顺序是 **类别**、**运输方式**。只需在 **行**\
  \ 货架上互换 **类别** 和 **运输方式** 的位置，并注意编号序列的变化，就有助于消除任何混淆：\n\n![](img/66cf6b89349fda3581a4f196cb3c98a4_229_0.png)\n\
  \n### 图 5.30: 切换维度\n\n示例 6 有任何实际用途吗？有。不时可能需要以货架上列出的不同顺序来寻址维度。但这通常不是情况。这引出了我们的下一条准则：\n\
  \n> *对表计算寻址多个维度时，寻址顺序通常反映行和/或列货架上的维度顺序。*\n\n## 三个维度的分区与寻址\n\n让我们在我们的操场中添加另一个维度，并稍微重新排序。将\
  \ **类别** 和 **地区** 放在 **行** 货架上，将 **运输方式** 放在 **列** 货架上。索引应保留在 **标记** 卡上的 **文本**\
