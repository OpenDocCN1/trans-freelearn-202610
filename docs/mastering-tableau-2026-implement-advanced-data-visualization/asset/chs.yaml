  \ LOD 交互。 |\n\n这个练习环境允许你最多选取四个维度在表格中显示，然后比较三种不同的计算：\n\n- Sales = 视图层级上的常规 SUM(Sales)\n\
  - Case Fixed = 在所选维度上固定的 SUM(Sales)（忽略其他行/列）\n- Case Exclude 1 & 2 = 从聚合中排除特定维度的\
  \ SUM(Sales)\n\n你可以通过更改参数并观察数字如何变化来进行实验。这是真正理解 LOD 的最佳方式。\n\n## 设置工作簿\n\n本练习的大部分基础工作已在本章关联的工作簿中完成。以下步骤只需打开不同的计算和参数，以查看其设置方式及为何如此工作。沿途会给出解释。如果你无法随时访问该工作簿，应可通过参考以下步骤构建一个类似的工作簿。\n\
  \n要完成工作表的初始设置，请执行以下步骤：\n\n- 1. 导航至 https://github.com/PacktPublishing/Mastering-Tableau-2026/tree/main/Chapter07\
