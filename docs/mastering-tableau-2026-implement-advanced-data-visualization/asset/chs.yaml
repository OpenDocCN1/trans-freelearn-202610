  \ _《精通 Tableau》_ 系列的更新，本书涵盖了 Tableau 的基本概念、数据准备以及使用 Tableau 进行计算，一直到 **机器学习（ML）**\
  \ 用例、数据治理以及 Tableau 2026 中的 AI 功能。\n\n本版本附带新数据集，用于学习 Tableau 2026 最新功能的所有内容。我们将探讨\
  \ AI 驱动的分析，并探索数据治理功能，以保证您工作簿的出色数据质量。读完本书后，您将掌握 Tableau 的高级产品及其最新更新，直至 Tableau 2026\
  \ 版本。\n\n对于 Tableau 初学者来说，本章应该能帮助他们快速上手；不过，由于本书面向高级主题，因此花在基础知识上的时间相对较少。如需更全面地了解基础主题，请参阅\
  \ _《学习 Tableau》*，由 约书亚·米利根 编著，Packt 出版社出版。\n\n如果您想要在 Tableau 的界面和核心功能方面打下坚实基础——具体来说，如果您想学习如何在\
  \ Tableau 中导航、连接数据以及设计您的第一个工作表和仪表板，请继续阅读。这些技能是本书后面更高级主题的垫脚石。本章的目标是让您熟悉 Tableau 的环境，以便开始构建基本而有效的可视化。读完之后，您将有信心开始探索更高级的功能和工作流。\n\
  \n在本章中，我们将讨论以下主题：\n\n- 创建工作表和仪表板\n- 将 Tableau 连接到您的数据\n- **度量名称**和**度量值**\n- 三个基本的\
  \ Tableau 概念\n- 将数据导出到其他设备\n\n现在，让我们通过探索 Tableau 中的工作表和仪表板创建来开始。\n\n> > **注意**\n\
