  \n![](img/66cf6b89349fda3581a4f196cb3c98a4_686_0.png)\n\n## 15\n\n# Tableau AI、Pulse\
  \ 和 Next 的智能时代\n\n数据分析工具始终决定着我们能提出的问题。几十年来，我们一直生活在仪表板时代：这些强大且交互式的画布让我们掌控着探索过程。但随着数据量和速度的增长，手动寻找洞察的行为已成为瓶颈。2026.1\
  \ 版本标志着 Tableau 智能时代的开始。这不再仅仅关乎你能发现什么，而是关乎数据能主动、智能地告诉你什么。\n\n在本章中，我们将超越传统 **商业智能\
  \ (BI)**，探索 **智能体分析** 的前沿。我们将剖析正在重新定义 Tableau 体验的 AI 驱动功能套件：从 **Tableau Pulse**\
  \ 的个性化洞察传递，到新 **Tableau Next** 平台的自主能力。我们将探讨可信语义层如何为这些功能提供支持，以及身为 Tableau 大师的你如何利用这个全新的智能世界。\n\
  \n我们将讨论以下主题：\n\n- 范式转变\n- 支持 AI 创新\n\n让我们开始吧！\n\n> **注意**\n>\n> 你的购买包含一份免费 PDF 副本和独家额外内容。\n\
  >\n> 你的购买包含本书的无 DRM PDF 副本、Packt+ 库 7 天试用（无需信用卡）以及其他独家额外内容。请参见 *前言* 中的 *随书免费福利*\
  \ 部分，立即解锁它们并最大化你的学习效果。\n\n## 范式转变\n\n要掌握 Tableau 的新功能，我们首先必须理解它们所代表的哲学转变。传统 BI，即使拥有精美的仪表板，本质上也是被动的。用户必须登录、导航到仪表板、应用筛选器，并直观地搜索异常值或趋势。它依赖于用户知道要寻找什么。\n\
  \n智能体分析颠覆了这一模式。它是主动的、个性化的和自主的。智能体分析充当持续监控系统，检测重大变化并调查根本原因，无需人工干预。它们检测重大变化，通过分段数据调查根本原因，并将包含解释的调查结果通俗语言摘要直接发送到你的收件箱、Slack\
  \ 频道或 Salesforce 控制台。这至少是 Tableau AI 演进的承诺。\n\n这种转变建立在三个核心支柱之上，我们将在后文详细探讨：\n\n1.\
  \ 统一的可信数据层（Tableau Semantics）\n2. 大规模交付主动、个性化的洞察（Tableau Pulse）\n3. 可分析、推理并触发操作的自主智能体（Tableau\
  \ Next）\n\n## 理解 Tableau 和 Salesforce 生态系统\n\n当我们深入 Tableau 的 AI 驱动功能时，你可能会对哪些产品属于哪里感到困惑。Tableau\
  \ Pulse 是 Tableau 的一部分还是 Salesforce 的一部分？Tableau Next 呢？为什么某些功能需要 Salesforce 许可证？让我来解释。\n\
  \n要了解当前的产品格局，我们需要回到 2019 年 6 月，当时 Salesforce 以 157 亿美元收购了 Tableau。当时，这是 Salesforce\
  \ 历史上最大的收购之一，并传达了明确的战略方向：Tableau 将成为整个 Salesforce 生态系统的分析品牌。\n\n这次集成背后的愿景是雄心勃勃的：将\
  \ Tableau 顶级的可视化能力与 Salesforce 的 AI 能力（Einstein）和客户数据相结合。这一愿景已逐步实现，如今 Tableau 产品分布在两个互连的生态系统中。了解这一区别对于知晓你可以访问哪些功能以及需要哪些许可证至关重要。\n\
  \n一方面，Tableau 生态系统中有原始的 Tableau Desktop、Tableau Prep 和 Tableau Server（还包括 Tableau\
  \ Cloud 和 Tableau Public）产品，而 Salesforce 生态系统中有 Tableau Next、Tableau Semantics 和\
  \ Agentforce。Tableau Next 代表了重大演进。与通常需要根据任务在 Desktop、Prep 和 Server 之间切换的 Tableau\
  \ Core 不同，Tableau Next 旨在提供统一的基于浏览器的体验，你可以在一个地方完成所有分析任务。\n\n它完全构建在 Salesforce 平台上，包括带有\
  \ Concierge 和 Inspector 等 AI 智能体的 Agentforce Tableau、Tableau Semantics 和 Data 360（Salesforce\
  \ 的统一数据平台，原名 Data Cloud）\n\n广泛预计 Tableau Next 最终将取代 Tableau Core（Desktop、Prep 和\
  \ Server），尽管 Tableau 表示，经典产品在可预见的未来仍将是核心投资。\n\nTableau Pulse 独具特色；它同时出现在两个生态系统中。Tableau\
  \ Cloud 版本（在 Tableau Core 中）会提供关于你指标的 AI 生成洞察。Salesforce 版本称为 Pulse for Salesforce，将相同的洞察直接带入你的\
  \ Sales Cloud 工作流。\n\nTableau Agent 可在 Tableau Core 中访问（帮助你进行计算、可视化和文档编写），但它需要 Salesforce\
  \ AI 功能才能运行。因此，虽然你通过 Tableau 访问它，但智能来自 Salesforce 的 Einstein 平台。\n\n取决于功能，你可能需要\
  \ Tableau 许可证、Salesforce 许可证、Tableau+ 订阅或专用的 Einstein 许可证。与其在此深入探讨复杂的许可细节，不如我专注于解释每个功能的作用。如果任何功能引起你的兴趣，请联系你的\
  \ Tableau 客户代表，了解为你的组织使其运行所需的条件。\n\n由于此处讨论的许多功能都需要高级许可证或特定的云环境，本章的结构是信息概述，而非动手实践章节。我的目标是帮助你了解什么是可能的，以便你可以决定哪些功能值得为自己的工作追求。\n\
  \n## 指标层和 Tableau Semantics\n\n在任何 AI 生成洞察之前，它需要对你的业务数据有可信的理解。正因如此，正在演进为 Tableau\
  \ Semantics 的指标层变得至关重要。将其视为你关键绩效指标 (KPI) 的单一事实来源。与其让每个仪表板以略有不同的方式定义每月经常性收入 (MRR)，指标层提供了一个单一的、受治理的定义，可在任何地方重复使用。\n\
  \nTableau Semantics 通过创建 AI 注入的语义层来修改这一概念。它不仅定义类似销售额（Sales）的指标，还添加业务上下文、定义和关系。例如，它理解销售额（Sales）与区域（Region）、产品类别（Product\
  \ Category）和销售代表（Sales Rep）等维度相关。这种上下文知识使 AI 智能体能够提供准确且相关的答案。Tableau 开发人员的角色正在从可视化设计转向语义层策划。借助工作区中自动生成语义模型（Auto-Generate\
  \ Semantic Models from Workspaces）这一新功能（目前为 Tableau Next 的 Beta 版），系统本身可以创建语义模型。只需直接从\
  \ Tableau Next 工作区用自然语言描述你的目标，平台即可映射对象和关系（包括零拷贝数据源），生成包含度量、维度和预定义逻辑的即用型模型。这使团队能够完全绕过手动配置，立即开始构建可视化或使用自然语言查询数据，从而加速洞察产生时间。\n\
  \n要将此付诸实践，你可以使用 Tableau Cloud 的界面创建带有清晰名称、定义和数据源的指标。Tableau Semantics 帮助你添加描述并建立字段之间的关系，Tableau\
  \ Agent for Catalog 可以自动完成大部分文档工作。新的 Auto-Generate Semantic Models Beta 版对于快速原型设计尤其有价值，允许你直接从原始数据和业务目标构建语义层。为确保这些\
  \ AI 模型在可信的基础上运行，开发人员必须利用 Tableau Catalog 应用数据质量警告和认证徽章，为人类用户和自主智能体提供至关重要的“信任信号”。\n\
  \n\n\n\n\n## Tableau Pulse\n\n打好基础后，我们现在可以开启洞察分发引擎：Tableau Pulse。Tableau Pulse 提供高层监控，而非深度探索。它是一款用于保持信息灵通的工具。\n\
  \nPulse 监控您从各种仪表板中定义或选择关注的指标。它会持续分析这些指标，寻找具有统计显著性的变化、趋势、异常值和关键驱动因素。当发生值得注意的事情时，它会生成一个洞察。以下是\
  \ Tableau Pulse 演示（https://www.youtube.com/watch?v=Cnbdkye0X_8_）中的示例。\n\n**Total\
  \ Sales** 本月于 2024 年 1 月 30 日达到 **$494.2k**。意外的小幅增长使 Total Sales **低于预期范围**，即 **$499.4k\
  \ 到 $549.3k**。**Total Sales** 的趋势在 8 天前发生变化，目前正以 **较慢的速度增长**。\n\n![](img/66cf6b89349fda3581a4f196cb3c98a4_690_0.png)\n\
  \n图 15.1：Tableau Pulse\n\n在 Tableau Pulse 中创建指标时，重要步骤是定义相关维度，例如 Region 或 Category。它们提供了\
  \ Pulse AI 用来自动评估绩效驱动因素并解释变化 *背后原因* 的上下文。\n\n创建指标后，Pulse 通过多种渠道分发洞察：\n\n- **For\
  \ You 页面**：您在 Tableau Cloud 中的个性化主页，汇总您关注的所有指标的洞察\n- 电子邮件和 Slack 摘要：每日、每周或每月直接在您的收件箱或\
  \ Slack 频道中接收关键指标变化摘要。这些摘要现在包含迷你趋势图，以便快速识别趋势\n- Tableau Mobile：随时随地获取相同的个性化洞察，并带有深度链接以供进一步探索\n\
  \n### Pulse 中的生成式 AI\n\nPulse 最具变革性的部分是其使用生成式 AI 创建洞察摘要。当 Pulse 检测到您指标中的变化时，它不仅向您展示图表，还会用通俗易懂的语言向您说明情况。例如，您可能会收到如下通知：\n\
  \n本周销售额增长 12%，主要由西部地区的强劲表现（增长 22%）和“Electronics”类别的激增推动。这延续了上个月观察到的上升趋势。然后您可以就此发生的原因提出更多问题。\n\
  \n![](img/66cf6b89349fda3581a4f196cb3c98a4_691_0.png)\n\n图 15.2：演示视频中的 Tableau Pulse\n\
  \n此摘要由 LLM 驱动。您的底层数据保持私密，且未用于训练公共模型。AI 仅将 Pulse 的分析结果转化为连贯、易于人类阅读的故事。\n\n## 增强型问答和相关性洞察\n\
  \nTableau 2026.1 通过仅在 Tableau+ 版本中提供的增强型问答更新，显著扩展了 Pulse 的对话能力。\n\n- 主页上的 AI 分析：用户现在可以直接在\
  \ Tableau Pulse 主页上通过新的“AI 分析”入口更快地从好奇心转向洞察。这使业务用户可以先提出自己的自定义查询，无需再从预定义的建议问题开始。\n\
  - 相关性洞察：也许是最强大的新增功能，增强型问答现在会在指标之间呈现有意义的相关性洞察。Pulse 会报告不同指标之间的关系强度、方向和显著性，并附带支持性可视化。即使指标来自不同的数据来源，这也能让您可靠地在业务中连接各个点。\n\
  \nPulse 还会从您的反馈中学习。通过对洞察使用点赞/点踩反馈，您训练系统优先处理您认为最有价值的洞察类型，进一步个性化您的信息流。\n\n## Tableau\
  \ Next\n\n如果 Pulse 是智能通知系统，那么 Tableau Next 就是能够针对这些通知采取行动的自主分析师。作为世界上第一个代理分析平台推出，Tableau\
  \ Next 代表了根本性的飞跃。它将 Tableau 的分析能力与 Agentforce 平台的自主能力相结合。\n\n![](img/66cf6b89349fda3581a4f196cb3c98a4_692_0.png)\n\
  \n图 15.3：来自 https://www.youtube.com/watch?v=pNSb-hIFNrF8 的 Tableau Next GUI\n\n\
  Tableau Next 是 API-first、可组合的平台。这意味着其功能可以随时随地访问和嵌入，例如在自定义 Web 应用程序、Salesforce 记录页面或\
  \ Slack 对话中。它由 Hyperforce 提供企业级可扩展性和安全性，并依赖 Tableau Semantics 来获得对您业务的可信理解。\n\n\
  - Agentforce Tableau：这是代理分析最具体的体现。假设您是一名销售经理，正在查看团队机会仪表板。在 Tableau Next 仪表板中，您现在可以与\
  \ **Concierge** 交互，它是一个嵌入式 AI 代理。Concierge 是一个预构建的 Agentforce 技能，充当与 Tableau 语义层紧密集成的基于\
  \ LLM 的推理引擎。当用户提交自然语言查询时，Concierge 首先继承仪表板的当前上下文，包括活动筛选器、字段选择、用户角色和行级安全权限。然后它查询\
  \ Tableau Semantics 层，该层充当受管的业务术语表，将技术字段名称映射为人类可读的概念，并使用 Einstein Trust Layer 生成优化的查询，以确保数据隐私和治理策略得到执行。查询在\
  \ Hyper 数据引擎上执行，结果以可视化或自然语言摘要形式返回，并带有指向底层数据源的引用。您可以用对话方式提出复杂问题：\n  - 哪些超过 5 万美元的交易在谈判阶段延误？\n\
  \  - 根据当前销售管道，显示下一季度的预测\n  - 该地区的历史胜率是多少？\n\nConcierge 理解问题，查询语义层，并返回准确答案，通常以图表或书面摘要形式呈现，而无需您离开工作流。\n\
  \n- 可操作的洞察和嵌入式工作流：获得洞察是一回事，采取行动是另一回事。Tableau Next 通过直接将动作嵌入到分析体验中来弥补这一差距。从仪表板或代理响应中，用户可以触发工作流。例如，如果\
  \ Concierge 代理标记潜在的供应链中断，可能会出现一个按钮，用于创建 Jira 工单或向采购团队发送 Slack 通知。这将分析从被动的信息来源转变为主动的决策引擎。\n\
  \n- API-first、可组合架构：对于企业架构师，Tableau Next 提供了前所未有的灵活性。您可以使用 **外部嵌入 SDK** 将代理分析组件、单个指标、可视化或整个仪表板直接嵌入到任何\
  \ Web 应用程序中。新的 **MCP 服务器**（模型上下文协议）允许您自己的自定义 AI 代理安全地连接到 Tableau 的语义层。这意味着您的内部 AI\
  \ 工具可以按需执行复杂的分析任务并检索受管、可信的数据，为整个技术栈的自动化和决策提供支持。\n\n### 仪表板摘要、个人组织和管理员洞察\n\n2026.1\
  \ 版引入了 Tableau Next 中几种强大的新功能，目前均处于 Beta 阶段，进一步增强了代理体验。\n\n- **仪表板摘要 (Beta)**：此功能允许您通过配置动态文本组件快速了解发生了什么以及原因，该组件提供仪表板中指标的\
  \ AI 生成文本摘要。这由 Tableau Agent 提供支持，无需手动解释即可突出显示有意义的趋势和关键驱动因素。\n- **个人组织 (Beta)**：为了在保持治理的同时扩展创新，**个人组织**为分析师提供了一个安全且灵活的环境来构建和测试新分析。团队可以通过扩展受管资产并添加新数据来自助服务，在将批准的资产移入生产之前自由实验。这在创造力需求与集中控制之间取得了平衡。\n\
  - **管理员洞察 (Beta)**：此功能使管理员能够从被动分析采用转向主动分析采用。它提供一个统一仪表板，汇总内容使用情况、用户参与度和消耗洞察。作为分析师，您可能不会直接使用此功能，但知道您的管理员拥有这些洞察意味着他们可以更好地支持您的工作，识别未充分利用的资产或低效问题。\n\
  \n以下是一个类似案例研究，用于构思工作流程。\n\n- 1. **从 Slack 开始**：您收到 Tableau Next Slack 摘要中的主动警报：产品\
  \ X 的库存已低于目标水平 15%\n- 2. **调查**：您单击链接，该链接会直接在 Slack 中打开嵌入式 Tableau Next 可视化。您看到趋势以及\
  \ Concierge 代理生成的仪表板摘要：这是由上周东海岸订单增长 40% 驱动的。\n- 3. **询问并采取行动**：在 Slack 线程中 @Concierge：产品\
  \ X 预计缺货日期是什么时候？代理立即回复：按当前消耗率，产品 X 的库存将在 4 天内耗尽。\n- 4. **触发工作流**：会出现一个建议面板，建议创建紧急补货订单。您单击它，来自\
  \ ERP 系统的预填采购订单表格打开，等待您的批准。\n\n此场景说明了 Tableau Next 远景的威力：洞察不再是静态的；它们是动态的、对话式的，并直接与业务成果相关联。\n\
  \n## Einstein Discovery\n\n除了 Pulse 的主动洞察和 Tableau Next 的自主代理之外，第三个更成熟的 AI 支柱仍然是大师工具包中至关重要的部分：Einstein\
  \ Discovery。Pulse 回答“发生了什么？”，Tableau Next 开始询问“我们该怎么做？”，而 Einstein Discovery 回答根本性和预测性问题：“为什么会发生？”以及“接下来会发生什么？”\n\
  \n将 Einstein Discovery 视为您的嵌入式数据科学家。它是一个增强型分析引擎，使用 **自动化机器学习 (AutoML)** 来统计分析您的数据，发现隐藏模式并生成预测。它不需要您编写代码或从头构建复杂模型。相反，它在后台工作，暴露出原本可能隐藏的洞察。\n\
  \n请注意：将 Einstein Discovery 集成到仪表板中需要对字段映射采取严谨的方法。开发人员必须确保实时 Tableau 字段（如线索来源或交易规模）与已部署\
  \ Salesforce 模型的输入精确对齐，以确保预测窗格提供准确的驱动因素和建议操作。\n\n\n\n\n\n同样，理解 Einstein Discovery\
  \ 如何融入 2026 Tableau 生态系统至关重要。它曾经是一个独立的预测工具，如今已成为 Salesforce 统一处理架构的核心组件。随着 2025-2026\
  \ 版本的发布，Einstein Discovery 与新的 Agentforce 代理共享一个共同的推理中心。这意味着 Einstein Discovery\
  \ 的预测能力不再是孤立的功能；它为更广泛平台的自主决策提供动力。\n\n然而，其主要功能仍然各有侧重：\n\n- **Tableau Pulse 用于监控**：它会主动提醒您\
  \ KPI 的变化\n- **Tableau Next / Agentforce 用于自主行动**：它可以跨上下文进行推理，以解决客户问题或评估销售线索\n-\
  \ **Einstein Discovery 用于预测**：它提供统计模型和假设分析功能，为人类用户和自主代理提供信息\n\n作为 Tableau 开发者，您可能会以几种关键方式与\
  \ Einstein Discovery 进行交互：\n\n- **自动故事和模型构建**：在 Salesforce 的 CRM Analytics Studio（Tableau\
  \ CRM 的演进版）中，您可以创建一个故事。您选择数据集并定义目标，例如，最大化客户生命周期价值或预测线索转化概率。Einstein Discovery 随后会自动运行成千上万个变量组合，识别最重要的驱动因素，并通过一系列自动生成的图表、统计分析和自然语言解释呈现其发现。一旦您验证了这些洞察，就可以将此分析部署为**预测模型**，以便在其他地方使用。\n\
  - **仪表板中的嵌入式预测（扩展）**：这是将 Einstein 的能力引入 Tableau 工作的最直接方式。可在 Tableau Exchange 上获得的\
  \ Einstein Discovery 扩展，允许您将实时 Tableau 数据连接到已部署的预测模型。\n  - **配置**：将扩展添加到仪表板后，您需要登录\
  \ Salesforce 组织，选择模型，并将 Tableau 数据源中的字段映射到模型期望的字段。\n  - **交互**：配置完成后，用户可以单击可视化中的任何标记（如特定客户、产品或区域），扩展窗格将立即显示该选定项的预测结果。它还会显示推动该预测的主要因素（例如，由于按月合同导致的高流失风险），以及至关重要的是，改善结果的建议操作（例如，提供年度折扣）。这实现了从洞察到行动的闭环。\n\
  \n您无需置于实时仪表板中即可从 Einstein Discovery 中受益。在 Tableau Prep Builder 中，您可以向数据流添加预测步骤。这样，您可以连接已部署的\
  \ Einstein 模型，并将预测结果直接作为新字段追加到数据集中。这非常适合批量处理或准备不需要与扩展进行实时交互的分析数据。\n\n**注意**\n关于\
  \ Tableau Public 的说明\n\n社区中一个常见问题是 Einstein Discovery 是否可以与 Tableau Public 结合使用。简短的答案是，实时扩展在\
  \ Public 工作簿中无法工作。不过，作为变通方法，您可以使用 Tableau Prep 预测步骤将预测追加到数据中，然后将增强后的数据集保存以在 Tableau\
  \ Public 中使用。尽管这创建的是静态快照而非实时交互式预测，但它仍然允许您在公共作品集中分享预测分析的强大功能。\n\n## Tableau Exchange\n\
  \n现在您已了解 Tableau 中内置的智能功能，从 Pulse 的主动洞察到 Einstein Discovery 的预测能力，您可能想知道在哪里可以找到使这些功能运作的工具。Tableau\
  \ Exchange 就是您用于扩展和增强 Tableau 平台的中央市场。\n\n**注意**\n我们在*第 8 章*的 Tableau Exchange 部分讨论过扩展、加速器和连接器。\n\
  \n![](img/66cf6b89349fda3581a4f196cb3c98a4_696_0.png)\n\n图 15.4: Tableau Exchange\n\
  \n将 Tableau Exchange 视为分析环境的应用商店。它是一个精心策划的中心，您可以在其中发现、评估和部署各种扩展 Tableau 原生功能的预构建资产。随着\
  \ 2026.1 版本的发布，Exchange 已发展成为支持整个代理分析生态系统的平台，提供四大类资产：\n\n| 类别 | 用途 | 示例 |\n| :---\
  \ | :--- | :--- |\n| 扩展 | 可直接集成到仪表板中的自定义应用程序 | Einstein Discovery 扩展、自然语言处理器 |\n\
  | 加速器 | 针对特定业务功能的预构建仪表板和工作簿 | 销售预测模板、流失分析仪表板 |\n| 连接器 | 到外部数据源的预构建连接 | Salesforce、Google\
  \ Analytics、Snowflake、AWS |\n| 语义资产 | 可重用的指标定义和业务逻辑 | 认证 KPI、行业特定的数据模型 |\n\n表 15.1:\
  \ 资产类别\n\n## Einstein Discovery 扩展\n\n既然我们在上一节中讨论了 Einstein Discovery，那么让我们探讨如何通过\
  \ Exchange 实际获取和配置它。\n\n- 安装步骤：\n  1. 从 Tableau Cloud 内或通过浏览器导航至 Tableau Exchange\n\
  \  2. 在**扩展**类别中搜索**Einstein Discovery**\n  3. 查看扩展详细信息，包括所需许可（Tableau 中的 Einstein\
  \ Discovery、Tableau CRM Plus 或 Einstein Predictions）\n  4. 单击**安装**并按照提示将其添加到您的\
  \ Tableau 站点\n  5. 安装后，该扩展将出现在仪表板窗格的**扩展**下\n\n仔细映射字段，确保您的 Tableau 字段与已部署 Einstein\
  \ 模型期望的输入字段匹配；在向组织推广之前，先使用示例数据对数据子集进行预测验证；并设置权限，以控制哪些用户可以访问该扩展以及可以查询哪些模型。\n\n##\
  \ 支持 AI 创新\n\n除了核心平台之外，2026.1 版本将 AI 驱动的辅助功能带到创作和学习体验中。\n\n在 Tableau Desktop 中，您现在可以加快自定义颜色调色板的创建，同时确保对比度和可访问性。通过使用自定义颜色调色板对话框中的新\"\
  自动生成\"按钮，您只需输入几个词或简短描述（例如，海上日落），即可立即生成新的可访问配色方案。这是 AI 如何融入 Tableau 体验每个角落的一个微小但令人愉悦的例子。\n\
  \n这个新的交互式助手还可帮助用户浏览 Tableau Public，提供即时解答和功能支持。无论您是初学者还是专家，Help Agent 都提供个性化教育，加速整个社区的学习曲线。这表明\
  \ AI 代理正在整个 Tableau 生态系统中嵌入，包括许多 Tableau 用户最初学习构建的社区平台。\n\n## 总结\n\n正如我们所见，Tableau\
  \ 中的新 AI 功能不仅仅是渐进式更新。随着 2026.1 版本的发布，它们代表了一个完全成熟的生态系统。Tableau Pulse 通过向每个人提供可信赖、个性化的洞察来民主化数据，现在还具备增强的问答和相关性功能。Tableau\
  \ Next 赋予组织能够分析、推理和行动的自主代理，并由用于自动模型生成、治理和管理的新工具提供支持。Einstein Discovery 仍然是预测分析的基石，而\
  \ Tableau Exchange 则是扩展所有功能的入口。\n\n最近的版本还带来了让日常工作更轻松、更安全的功能，从 Tableau Agent for\
  \ Catalog 中的 AI 驱动文档，到回收站的安全网，再到显示数据模型的清晰度。\n\n当今掌握 Tableau 意味着掌握这个生态系统。关键在于构建可信赖的语义基础、设计主动洞察传递，并与能够增强您自身专业知识的\
  \ AI 代理协作。这些工具已从回答我们知道要问的问题，发展到发现我们尚未想象过的问题。分析的未来是智能的、主动的且具代理能力的；而未来已来。\n\n现在我们已经到了本章的结尾，请考虑这些智能功能如何改变您自己的工作。您是否将从在\
  \ Pulse 中定义几个关键指标开始？您是否会尝试 Einstein Discovery 扩展？您是否会探索 Tableau Next 中的新\"自动生成语义模型\"\
  功能？\n\n无论您选择哪条道路，请记住，这些工具旨在增强而非取代您自己的专业知识。好奇、富有创造力且具备上下文意识的人类分析师，仍然是任何分析工作流中最重要的组成部分。AI\
  \ 只是来帮助您更快地提出更好的问题。\n\n在本书的下一章中，我们仍有时间探讨另一个热门话题。数据治理是近未来实现代理分析原生化的关注领域。简单来说，因为数据混乱行不通。法规和日益增加的数据安全风险迫使公司更加重视结构完善的指南和质量检查。因此，我们将在第\
  \ 16 章，*开发数据治理实践* 中向您介绍 Tableau 的另一侧。\n\n\n\n\n\n## 获取本书的 PDF 版本及更多内容\n\n扫描二维码（或访问\
  \ packtpub.com/unlock），按书名搜索此书，确认版本，然后按照页面上的步骤操作。\n\n![](img/66cf6b89349fda3581a4f196cb3c98a4_699_0.png)\n\
  \n![](img/66cf6b89349fda3581a4f196cb3c98a4_699_1.png)\n\n注意：请随时准备好发票。直接从 Packt 购买无需发票。\n"
- "# 16 制定数据治理实践\n\n本章与其他章节略有不同。我们不会讨论用于 Tableau 仪表板或 Tableau Server 的功能，而是探讨 Tableau\
  \ 中与数据治理相关的数据功能——谁可以访问哪些数据，谁查看了哪个仪表板以及查看频率，仪表板的数据组件是什么，等等。\n\n我们将讨论以下主题：\n\n- 什么是数据治理？\n\
  - 数据治理原则\n- Tableau 中的数据治理\n\n近年来，尤其是在过去 20 年里，数据治理已从主要由 IT 驱动的职能演变为跨职能的组织责任，这表明该领域日益成熟。而在早期，数据治理仅是一项\
  \ IT 任务，并且通常仅限于数据目录编制，而今天的数据治理则是一项由多方共同承担的任务。公司存储的数据越多，雇佣的分析师越多，使用的数据越多，就越需要治理规则和指南。如今，由于缺乏适当的数据治理，公司会被处以罚款，大规模数据安全漏洞和数据泄露事件也越来越频繁地登上新闻头条。因此，许多机构（如欧盟）已将数据治理作为主要支柱之一，采纳了数据保护法律法规。例如，欧盟的\
  \ GDPR 和加州的 CCPA。\n\n即使你主要关注构建仪表板和共享数据洞察，在整个企业中保护数据也正变得，并且将继续变得更像是一项共同的努力。了解政策法规、知道如何使用数据治理工具以及负责任地行事，对你来说也是必不可少的。因此，我将本章献给数据治理，以及\
  \ Tableau 在这一领域提供的所有内置功能。让我们开始吧！\n\n## 什么是数据治理？\n\n数据治理的核心在于根据法规和行业标准制定和实施与数据相关的政策。其主要目标是保证信息的有用性、可访问性和安全性。加强的数据治理带来更好的数据分析，通过确保分析师所依赖的数据来自可靠来源、经过验证并接受了严格的数据质量评估等措施，让分析师更加安心。\n\
  \n在 www.tableau.com 网站上，您可以找到一份向 Tableau 用户介绍数据管理（包括数据治理）的白皮书：https://www.tableau.com/learn/whitepapers/tableau-data-management。\n\
  \n如果您更喜欢视频，可以在以下链接中找到演示：https://www.tableau.com/products/data-management#content-446367。\n\
  \n白皮书和视频都介绍了这种设置：\n\n![](img/66cf6b89349fda3581a4f196cb3c98a4_702_0.png)\n\n![](img/66cf6b89349fda3581a4f196cb3c98a4_702_1.png)\n\
  \n图 16.1: Tableau 数据管理\n\n此架构连接三个层：Ingest（从数据源提取元数据）、Store and Process（将该元数据集中到\
  \ Collibra 或 Alation 等企业目录中，外加 Tableau 的 Data Management 插件，用于血缘和认证）以及 Analyze &\
  \ Share（使用户能够直接在 Tableau Desktop 或 Server 中发现并信任受管数据）。通过在目录与 Tableau 之间建立双向元数据交换，您创建了一个单一事实来源，技术血缘在此与业务上下文相遇，帮助分析师找到认证数据并确切了解其来源。\n\
  \n一般来说，数据治理涵盖的关键方面包括确保数据质量、解决数据安全和隐私问题、制定数据政策和标准、指定数据 steward、遵守法规以及记录数据资产。\n\n\
  那么，数据治理为什么重要？强大的数据治理带来更好的数据质量、更低的数据管理成本和更广泛的数据访问。它提升了数据合规的可信度，从而带来更好的决策、提高的运营效率和降低的风险。例如，治理政策可以规定谁有权修改客户收入数据、该数据需要多久刷新一次，以及历史记录需要保留多久。在遵循既定政策和指南的前提下，Tableau\
  \ 可以成为数据治理框架内用于数据可视化和分析的宝贵工具。\n\n## 数据治理原则\n\n如果你计划从事数据治理工作，应该知道数据治理原则通常是整个工作的核心与灵魂。\n\
  \n## 关于全球数据保护框架的说明\n\n本节将 GDPR 作为教学示例，因为其七项原则是基础性的。不过，根据您所在的地区，可能适用不同的法律。\n\n- 欧盟：GDPR\n\
  - 英国：UK GDPR\n- 美国加州：CCPA / CPRA\n- 美国其他州：各州法律（弗吉尼亚州、科罗拉多州、康涅狄格州等）\n- 加拿大：PIPEDA\
  \ + 魁北克省第 25 号法律\n- 巴西：LGPD\n- 日本：APPI\n- 韩国：PIPA\n- 泰国：PDPA\n\n好消息是：本章涵盖的治理原则和\
  \ Tableau 功能（认证、血缘、访问控制、数据质量警告）支持遵守上述任何框架。一旦掌握这些概念，您就可以将它们适应到特定的监管环境中。\n\n为了说明这一点，让我们以\
  \ GDPR（https://gdpr-info.eu/）中概述的七项原则为例，探讨如何利用 Tableau 有效地执行这些原则：\n\n- **合法性、公平性和透明度：**\
  \ 此规定要求为提供商品或服务而收集的个人信息必须合法、公正地获取，并且个人应被告知其使用目的。此外，个人信息只能在个人明确同意的情况下收集，并且必须保留此同意的记录。\n\
  - 目的限制：个人信息应仅为特定且合法的目的而收集，除非获得明确同意，否则不得用于不同或不兼容的目的。\n- 数据最小化：个人信息的处理应限于实现预期目的所必需的范围。\n\
  - 准确性：个人信息必须准确收集并定期更新以降低对个人的风险，任何不准确的信息都应立即更正或删除。\n- **存储限制：** 个人信息应仅保留完成处理目的所必需的期限，除非为了科学、归档或公共利益目的而需要，在这种情况下可以存储更长时间。\n\
  - **完整性和保密性：** GDPR 中的完整性要求保持准确可靠的个人数据，而保密性要求保护个人数据免受未经授权的访问和披露，确保隐私权得到维护。\n- **问责制：**\
  \ 对于成功的数据治理方法，问责制至关重要，因为它提供方向和有效性；建立一个由所有部门（包括高级管理人员）代表组成的数据治理委员会，对于确保跨组织责任以及制定和执行数据流程和政策至关重要。\n\
  \n在下一节中，让我们看看 Tableau 如何帮助我们遵守这些原则。\n\n## Tableau 中的数据治理\n\n近年来，Tableau 发布了多项功能，使治理对分析师来说更加易用和有价值。这些功能远非仅仅是行政负担，实际上能简化您的工作，自动化文档编制，保护您的工作，并确保您始终基于可信数据进行构建。让我们来探索一下：\n\
  \n- **数据源连接：** Tableau 的数据源连接功能允许组织通过连接多样化的数据源来建立集中式数据治理，促进一种可信且经过策划的数据管理方法。这使得更容易遵守完整性和保密性的监管原则，因为数据存储安全，并且可以控制访问。\n\
  - **数据访问控制：** Tableau 使管理员能够管理用户对数据源和仪表板的访问，实施用户和组权限，确保只有授权人员才能访问和交互特定数据资产。访问控制使得更容易遵守完整性和保密性的监管原则，因为访问可以集中管理，从而受到限制。\n\
  - **数据安全：** Tableau 提供数据加密、单点登录（SSO）身份验证以及与身份管理系统的集成等安全功能，通过强制执行策略和保护敏感信息来增强数据安全性。此功能使得更容易遵守完整性和保密性的监管原则，因为安全漏洞以及随之而来的敏感数据非法访问将受到限制。\n\
  - **元数据管理：** Tableau 有助于创建和管理元数据，提供数据定义、描述和血缘详情等有价值的上下文信息。此功能通过增强对数据资产的理解和控制来支持数据治理计划。元数据管理使得更容易遵守准确性的监管原则，因为元数据更改可以轻松检测。\n\
  - **数据认证：** Tableau 使用户能够认证和推广可信的数据源和仪表板，表明数据已经过质量保证，可以用于分析和决策。此认证流程确保用户能够访问可靠且受管的数据资产。这使得更容易遵守准确性的监管原则，因为所有用户都可以信任认证数据的准确性和及时性受到监控。\n\
  \n\n\n\n\n- 版本控制：Tableau 提供版本控制功能，使组织能够跟踪对仪表板和数据源所做的更改，通过提供修改可见性并促进审计跟踪流程，来推动数据治理。凭借其审计跟踪功能，版本控制使遵守合法性、公平性和透明度的监管原则变得更加容易。\n\
  \n- 监控和审计：Tableau 的监控和审计功能使管理员能够跟踪用户活动、访问模式和数据使用情况，帮助识别潜在的合规性问题并确保遵守数据治理政策。这将使遵守合法性、公平性和透明度的监管原则变得更加容易，因为它帮助我们遵守规则和法规。\n\
  \n- 协作和文档：Tableau 通过提供评论、注释和文档附件等功能来支持协作和文档，使用户能够直接在 Tableau 环境中记录和讨论数据资产、定义和治理相关信息。这使得遵守问责制监管原则变得更加容易，因为评论和注释对用户之间可见且可共享。\n\
  \n虽然 Tableau 提供数据治理功能，但组织拥有超越 Tableau 平台的全面数据治理策略和框架至关重要。Tableau 的功能可以增强并与更广泛的数据治理计划保持一致，但它们应集成到总体治理计划中，以最大限度地发挥效能。\n\
  \n## 目录的 Tableau Agent\n\n为数据源编写清晰的描述对治理至关重要，但说实话，这是一项繁琐的工作。你知道应该记录数据源，以便同事能够理解和信任它们，但当截止日期临近时，文档往往是第一个被搁置的事项。Tableau\
  \ 现在提供了一种几乎像魔法一样的解决方案：Tableau Agent for Catalog。\n\n你可能从前面的章节中认识 Tableau Agent；它是一款对话式\
  \ AI 助手，可帮助你构建计算并创建可视化。但在数据治理的背景下，Tableau Agent 扮演着文档助手的角色。\n\n当你在 Tableau Cloud\
  \ 中打开已发布的数据源时，现在会在“概览”选项卡中看到一个新选项：**生成描述。** 只需点击一下，Tableau Agent 就会分析你的元数据、字段名称、数据类型甚至示例值，生成一份关于数据源包含的内容及其可能用途的全面、人类可读的摘要。\n\
  \n此数据源包含从 2020 年至今的客户交易记录。关键字段包括客户 ID、购买日期、产品类别和销售金额。数据每日更新，并已获认证可用于销售绩效仪表板。常见用例包括分析区域销售趋势和识别表现最好的产品。\n\
  \n在该功能推出之前，编写良好的文档需要你离开工作流程，这是我们大多数人所回避的过程。现在，文档编写只需几秒钟，而非几分钟。而且因为如此简便，你更有可能去做，这将使所有使用你数据源的人受益；它提高了数据可发现性，并缩短了新分析师的入职时间。\n\
  \nTableau Agent 生成的描述是一个起点，而非最终产品。你可以（而且应该）对其进行编辑，以添加只有你才知道的上下文，例如业务规则、已知限制或给新用户的提示。但拥有一个\
  \ 80% 完成的草稿作为起点，会改变一切。\n\n> **注意：** 你可能还记得此功能在早期版本中名为 \"Einstein Copilot for Tableau\
  \ Catalog\"。它于 2025 年重新品牌化为 **Tableau Agent**，但功能保持不变。它仍然是你值得信赖的 AI 助手，基于 Einstein\
  \ Trust Layer 构建，这意味着你的底层数据保持私密，绝不会用于训练公共模型。\n\n## Tableau 语义\n\n我听学生提到的最常见的挑战之一大致是这样的：“我找到了一个非常适合我分析的已认证数据源，但我需要添加几个计算字段，并将其与另一个小表格连接。如果我创建一个副本，会失去‘已认证’状态吗？如果原始数据源更新，我的副本会过时吗？”\n\
  \n这些是非常好的问题，多年来，答案并不理想。是的，你会失去认证。不，你的副本不会自动更新。这在治理（希望每个人都使用相同的已认证数据）和灵活性（分析师完成工作所需要的）之间产生了张力。\n\
  \n**Tableau 语义**优雅地解决了这个问题。作为更广泛的 Tableau Next 平台的一部分，它允许你创建与上游已认证数据保持关联的派生数据源。\n\
  \n可以将 Tableau 语义视为在数据之上创建一个智能层。当你构建引用已认证源的新数据源时，Tableau 会记住该关系。对已认证源的任何更改，无论是更新的数据、更正的计算还是新字段，都会自动流向你的派生源。你可以获得构建所需内容的灵活性，而无需创建与事实来源脱节的副本。\n\
  \n这直接支持 GDPR 的**准确性**原则。当所有人都从同一个可信的基础工作时，你就消除了“死亡电子表格”问题，即组织中流传的多个版本的真相。查看仪表板的销售经理和运行报告的财务分析师可以放心，他们查看的是相同的数字，且计算方式相同。\n\
  \n作为分析师，这意味着：\n\n- **减少重做：** 当中央数据源更新时，你的派生源会自动更新\n- **更可信：** 你可以将任何数字追溯到其已认证的来源\n\
  - **更大灵活性：** 你不被锁定在别人构建的确切内容上。你可以在保持与源连接的同时进行扩展和自定义\n\n> 性能方面呢？\n> \n> 你可能会想，所有这些关联是否会拖慢速度。Tableau\
  \ 的工程师已经考虑到了这一点。语义层经过优化，可在尽可能多的情况下将计算下推到底层数据库，确保你不必为了治理而牺牲性能。在许多情况下，查询运行速度与针对原始源运行时一样快。\n\
  \n## 为直观理解显示数据模型\n\n你是否曾打开过同事创建的已发布数据源，然后想：“这些表是如何关联的？” 也许你花过令人沮丧的几分钟（或几小时）试图弄清楚是该连接还是混合，或者哪些字段连接了哪些表。如果是这样，显示数据模型功能即将成为你的新好朋友。\n\
  \n当你在 Tableau Cloud 或 Tableau Server 中打开已发布的数据源时，请查看数据源窗格。你现在会看到数据模型的可视化表示。它包含表、字段以及它们之间的关系。这与你自己构建数据源时看到的可视化类似，现在任何使用该已发布源的人都可以使用。\n\
  \n了解数据的形状是准确分析的基础。如果你不知道表是如何关联的，你可能会在不知不觉中创建返回错误结果的计算。可视化模型消除了猜测。你可以一目了然地看到：\n\n\
  - 数据源中包含哪些表？\n- 它们如何连接（关系、连接或混合）\n- 这些连接中使用了哪些字段\n- 表是使用实时连接还是提取\n\n这补充了我们之前讨论的血缘视图。血缘显示数据来自哪里以及流向哪里。显示数据模型向你展示当前的结构。两者结合，让你对数据资产有完整的可见性。\n\
  \n## 回收站\n\n你未必把我当成讲故事的人，但回收站值得讲个故事。几年前，我的朋友正在为公司高管团队准备一个重要演示。她花了三周时间构建一个包含多个工作表、计算字段和精心设计的提示信息的复杂仪表板。演示前一天，她正在清理自己的\
  \ Tableau Server 站点，却不小心删除了错误的工作簿。咻。三周的工作，一去不复返。她花了接下来的 12 小时从记忆中重新构建，在演示前几乎没怎么睡觉。\n\
  \n\n\n\n\n这个故事令人恐惧，因为它可能发生在我们中的任何人身上。我们都曾在错误地点击了文件的“删除”后经历过那种恐慌时刻。过去，恢复数据意味着恳求 IT\
  \ 从备份中恢复，前提是他们有备份，并且能找到正确的版本。\n\n从 2025.1 版本开始，Tableau Cloud 和 Tableau Server 包含一个回收站，其工作方式与你电脑上的回收站完全一样。当你删除工作簿、数据源或项目时，它不会永久消失。它会移动到回收站，其中最多保留\
  \ 30 天（你的管理员可以配置具体的保留期限）。你找到被删除的项目，点击“还原”，它就会回到原来的位置。\n\n这是一种既保护你个人，而不仅仅是组织的治理方式。是的，它帮助公司防止数据丢失。但更重要的是，它让你免受会限制职业发展的错误和充满压力的夜晚的困扰。\n\
  \n有几点重要细节：\n\n- 你只能恢复最初有权删除的项目\n- 回收站显示谁在何时删除了什么\n- 项目在保留期限过期后会被永久删除\n- 你的管理员可以配置回收站保留项目\
  \ 7 天、14 天、30 天或 60 天\n\n回收站保护工作簿本身——如果你将其彻底删除，可以将其找回来。\n\n## 数据编排中心\n\n2026.1 版本为数据治理引入了一项重要新功能：作为\
  \ Tableau Next 一部分的数据编排中心。你可以将其视为管理整个 Tableau 环境中所有数据资产的集中式指挥中心。虽然该工具主要由管理员使用，但对数据管家来说也非常有用。\n\
  \n数据编排中心将以前分散的治理工具整合到一个统一的界面中，让你能够：\n\n- 集中管理所有数据资产——从数据源和 Prep 流到提取和语义模型\n- 集中监督数据血缘、质量和使用模式\n\
  - 通过简化的数据准备监控增强数据信任度\n- 从单个仪表板监控整个 Tableau 生态系统中的数据健康状况\n\n对于数据治理从业者来说，这是一个颠覆性的变化。你不再需要在不同页面之间跳转来检查数据源状态、提取刷新健康状况和血缘信息，而是拥有了一个统一的视图。这直接支持了\
  \ GDPR 中的问责原则，使展示对数据资产的控制变得更加容易。\n\n以下截图展示了数据编排中心的外观；图片复制自 https://www.tableau.com/en-gb/products/coming-soon#item-106157：\n\
  \n![](img/66cf6b89349fda3581a4f196cb3c98a4_709_0.png)\n\n图 16.2: 数据编排中心\n\n我们刚才探讨的功能有一个共同主题：它们让治理感觉不像是一系列限制，而更像是一系列超能力。\n\
  \n这些功能并非面向 IT 或站点管理员，而是面向你——每天构建仪表板并分享洞察的人。使用它们，你会发现良好的治理实践会成为你工作流的自然延伸，而不是需要绕过的障碍。\n\
  \n在下一节中，我们将继续介绍更多跟随操作示例，将这些功能付诸实践。\n\n## 跟随操作示例\n\n在本章的最后部分，你可以亲自尝试一些数据治理功能；欢迎在你的\
  \ Tableau Server 或 Tableau Cloud 版本中跟随操作。\n\n## 认证数据源\n\n认证数据源涉及通过验证其质量、准确性和合规性的过程，将其指定为受信任且可靠的资产。这种认证能建立信任，确保数据质量，支持合规性，促进一致性，加强数据治理，提升决策能力，促进数据发现，并由组织内的数据治理团队或专家执行。\n\
  \n你可以按照以下步骤在 Tableau 中认证数据源：\n\n- 1. 打开 Tableau Server 或 Tableau Cloud\n- 2. 打开数据源\n\
  - 3. 点击数据源名称旁边的三个点\n- 4. 选择 **编辑认证**...\n\n![](img/66cf6b89349fda3581a4f196cb3c98a4_710_0.png)\n\
  \n图 16.3: 认证\n\n- 5. 你现在可以输入一条对数据源用户可见的消息，说明认证原因或类似内容。你输入的内容取决于贵公司商定的政策。点击 **保存**。\n\
  \n![](img/66cf6b89349fda3581a4f196cb3c98a4_711_0.png)\n\n图 16.4: 认证消息\n\n在数据源所有者和日期旁边，你现在会看到一个指示，表明该数据源已认证：\n\
  \n![](img/66cf6b89349fda3581a4f196cb3c98a4_711_1.png)\n\n图 16.5: 已认证\n\n已认证的数据源有助于决策，使分析师和业务用户对其使用的数据更有信心，从而得出更精确的洞察、做出更明智的决策，并实现更好的业务成果。\n\
  \n## 数据质量警告\n\n数据质量警告是突出显示数据集质量中潜在问题或异常的通知，由不完整或缺失的数据、不一致性、异常值、数据完整性问题、验证失败或过时信息触发。这些警告表明需要进一步调查和数据清洗，以确保正确的分析和决策，强调解决数据质量问题对于可靠洞察的重要性。\n\
  \n你可以按照以下步骤设置数据质量警告：\n\n- 1. 打开 Tableau Server 或 Tableau Cloud\n- 2. 打开数据源\n- 3.\
  \ 点击数据源名称旁边的三个点\n- 4. 选择 **质量警告**，然后在 **质量警告...** 和 **提取刷新监控...** 之间选择\n\n数据质量警告弹出窗口将如下所示：\n\
  \n![](img/66cf6b89349fda3581a4f196cb3c98a4_712_0.png)\n\n图 16.6: 数据质量警告\n\n- 5.\
  \ 从此处，从下拉菜单 **选择标签** 中选择五个标签之一：\n\n![](img/66cf6b89349fda3581a4f196cb3c98a4_713_0.png)\n\
  \n图 16.7: 选择标签\n\n**提取刷新监控**弹出窗口看起来非常相似，只是没有下拉菜单：\n\n![](img/66cf6b89349fda3581a4f196cb3c98a4_713_1.png)\n\
  \n图 16.8: 提取刷新监控\n\n在两种情况下，警告指示器将出现在数据源概览页面上：\n\n![](img/66cf6b89349fda3581a4f196cb3c98a4_714_0.png)\n\
  \n图 16.9: 警告\n\n如果计划提取失败，你也可以查看计划概览页面：\n\n![](img/66cf6b89349fda3581a4f196cb3c98a4_714_1.png)\n\
  \n图 16.10: 计划\n\n数据质量警告充当指示器，表明数据在用于分析、报告或决策之前可能需要进一步调查或清洗。它们有助于发现可能影响分析结果准确性、可靠性和有效性的潜在数据问题。处理数据质量警告通常涉及数据清洗、错误更正以及确保数据符合所需的质量标准。\n\
  \n需要注意的是，应对数据质量警告采取行动，因为它们可能影响从数据中得出的洞察的可靠性和有效性。解决数据质量问题并保持高质量数据对于做出明智决策和从数据分析中得出准确结论至关重要。\n\
  \n## Tableau 血缘\n\n数据血缘很重要，因为它能建立对数据的信任，帮助进行数据质量管理和问题解决，促进影响分析，支持法规合规性，加强数据治理和管理实践，协助故障排除和调试，并实现数据和系统的成功集成。数据血缘为数据流提供透明度、理解度和控制力，有助于改进数据治理和决策过程。\n\
  \n要查看血缘，你可以在 Tableau Server 或 Tableau Cloud 上打开任何类型的概览页面——数据源、Prep 流、工作表、工作簿和其他页面——并查看“血缘”选项卡：\n\
  \n![](img/66cf6b89349fda3581a4f196cb3c98a4_715_0.png)\n\n图 16.11: Tableau 血缘\n\n\
  右侧面板会提供关于相应血缘的所有详细信息。从此处，你可以点击任意给定的组件并被重定向到该位置。\n\n\n\n\n## 血缘\n\n![](img/66cf6b89349fda3581a4f196cb3c98a4_716_0.png)\n\
  \n图 16.12: 详细血缘\n\n从表视图中，您甚至可以检查某个列被用在哪里；首先，进入一个表：\n\n| 类型 | 名称 | 虚拟连接 |\n|---|---|---|\n\
  | [icon] | 订单 | 0 |\n\n图 16.13: 上游表格\n\n然后，单击任意列。观察右侧面板如何显示列 **城市** 用于 **数据库** 和\
  \ **表**，但未用于其他任何位置：\n\n![](img/66cf6b89349fda3581a4f196cb3c98a4_717_0.png)\n\n图\
  \ 16.14: 列血缘\n\n总体而言，数据血缘为数据流提供了透明度、理解和控制。它支持数据质量管理、合规工作和决策过程。通过记录数据的血缘，组织可以改进其数据治理实践，增强数据可信度，并减轻与数据管理和分析相关的风险。\n\
  \n## 数据详情\n\nTableau 中的 **数据详情** 帮助您和用户了解已发布仪表板中的数据。要访问它，在任何给定的仪表板上，单击左上角的 **数据详情**，并观察右侧弹出的详细信息：\n\
  \n![](img/66cf6b89349fda3581a4f196cb3c98a4_718_0.png)\n\n图 16.15: Tableau 数据详情\n\
  \n几秒钟内，**数据详情** 可让您查看随时间变化的视图、数据源和正在使用的字段。\n\n## 数据指南\n\n数据指南（如数据字典或数据参考指南）是一种文档资源，提供关于数据元素结构、内容和含义的详细信息。它对于数据理解、一致性、集成、质量评估、治理、协作、培训和文档非常重要。数据指南增强了数据管理实践，促进了数据素养，并支持组织内有效的数据利用。\n\
  \n要探索数据指南，请在 Tableau Server 或 Tableau Cloud 上打开一个仪表板，并单击蓝色顶部栏右侧部分的 **数据指南** 按钮：\n\
  \n![](img/66cf6b89349fda3581a4f196cb3c98a4_719_0.png)\n\n图 16.16: 数据指南\n\n通过在视图中选择一个标记，数据指南会自动填充有关数据点和所用过滤器的详细信息，以及解释。您已在本书前几章中了解过“解释数据”功能，但数据指南使标记的解释和探索比以往任何时候都更容易。\n\
  \n这里还有一个例子，清晰地展示了 Tableau 如何弥合单个数据点与完整数据集平均值之间的差距：\n\n![](img/66cf6b89349fda3581a4f196cb3c98a4_719_1.png)\n\
  \n图 16.17: 解释\n\n通过单击一个箭头，会显示更多信息：\n\n### 为什么这比其他标记高？\n\n> 预期范围\n> 鉴于可视化中当前值的模型，Singer\
  \ Lumber 的总计预计在 -7 到 18 之间。这考虑了在度量名称、AGG(Total Activity)、行业上设置的过滤器。了解更多\n\n图 16.18:\
  \ 文本解释\n\n您甚至可以生成图表来证明这一点：\n\n### Singer Lumber\n\n高总计 171\n\n### 为什么这比其他标记高？\n\n\
  ### 贡献维度\n\n- 引荐 URL（活动 - 单击链接）\n\n引荐 URL（活动 - 单击链接）的记录分布与总计相关，这可能解释了为什么 Singer\
  \ Lumber 的总计更高。\n\n### 按引荐 URL（活动 - 单击链接）分布的记录\n\n![](img/66cf6b89349fda3581a4f196cb3c98a4_720_0.png)\n\
  \n图 16.19: 贡献维度\n\n数据指南还允许您为用户添加描述和资源：\n\n![](img/66cf6b89349fda3581a4f196cb3c98a4_721_0.png)\n\
  \n图 16.20: 描述\n\n这就是 Tableau 中数据治理领域的最后一个例子。这是一个庞大的主题，远远超出了 Tableau 的范围，因此我们只是通过研究\
  \ GDPR——众多数据法规之一——Tableau 的数据治理功能，以及最后一些实际应用，仅仅触及了表面。这个主题确实值得单独成书，但我想在这里简要地提及它，以分担责任，因为即使您身为\
  \ Tableau 开发人员，也有责任并在保障数据安全方面做出改变。希望本章能为您提供足够的思考素材，以便在开发精彩仪表板时更加关注数据治理。\n\n## 总结\n\
  \n数据治理不仅仅是 IT 问题或合规负担。它是一种共同责任，直接影响分析的质量和可信度。本章中我们探索的工具——从认证和血缘到 AI 驱动的文档和回收站——旨在将良好的治理实践变成您工作流中自然的一部分，而非障碍。通过掌握这些功能，您不仅成为一名熟练的仪表板开发人员，还成为组织数据资产值得信赖的管理员。\n\
  \n既然我们已经走到本书的结束，不妨回顾一下我们的旅程：起始于将数据加载到 Tableau、创建第一个可视化并执行第一个函数。接着，我们熟悉了细节层级和表计算，了解了\
  \ Tableau Prep Builder、Tableau Server 和一般可视化最佳实践，最后一轮则学习了高级分析以及利用 Tableau 编程工具集成的强大功能。\n\
  \n现在只剩下一个问题：您的下一个 Tableau 项目是什么？欢迎在 Tableau Public 上分享，别忘了添加标签 #MasteringTableau。祝贺大家参与并投入这个学习过程！无论您有更多疑问、意见或反馈，都欢迎联系我或\
  \ Tableau 社区。祝您在个人 Tableau 职业生涯中取得成功。\n祝 Tableau 使用愉快！\n\n## 在 Discord 上加入我们的社区\n\
  \n加入我们社区的 Discord 空间，与作者和其他读者交流。\n\nhttps://discord.gg/VXpz9YPUTW\n\n![](img/66cf6b89349fda3581a4f196cb3c98a4_722_0.png)\n"
