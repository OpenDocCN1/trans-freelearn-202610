  \ 相关的功能。\n\n## 使用 FIXED 和 EXCLUDE 操作\n\n我们将构建的第一个 playground 旨在探索三个 LOD 函数中的两个：FIXED\
  \ 和 EXCLUDE。我们将使用一组参数和关联的计算字段来高效地探索这些函数的工作原理。在深入探讨函数本身之前，让我们先了解工作簿设置。\n\n在进入技术设置之前，让我解释一下所有这些参数和计算实际有什么作用。这样以下步骤会更清晰。\n\
  \n| 组件 | 它控制什么 | 工作原理 |\n| :--- | :--- | :--- |\n| 1st Dim, 2nd Dim, 3rd Dim, 4th\
  \ Dim (参数) | Rows 存储区的四个插槽中各出现哪个维度？ | 每个参数都有一个维度列表（Category、Region、Segment 等）。当您从下拉列表中选择一个维度时，参数会将一个数字（1、2、3...）传递给相应的计算字段。\
