  \n## URL 操作\n\n下一个操作是 URL 操作。它允许您在单击仪表板中的数据点时打开一个 URL。请执行以下步骤：\n\n- 1. 转到“按州划分的数量”工作表并打开\
  \ **工作表 | 操作**\n- 2. 删除每个可见操作\n- 3. 现在，选择 **添加操作** 并选择 **转到 URL...**。复制下面所示的所有参数，并单击\
  \ Wikipedia URL 旁边的箭头。来自数据源的字段将出现，这使您可以向 URL 添加一个字段，该字段将根据仪表板自动返回值。选择 **州**：\n\n\
  ![](img/66cf6b89349fda3581a4f196cb3c98a4_469_0.png)\n\n### 图 10.31: URL 操作\n\n-\
  \ 4. 在“按州划分的数量”工作表的地图上单击某个州，并观看 Wikipedia 将打开相应的网页\n\n当您希望向用户显示网站上可用的其他信息时，URL 操作非常有用。您还可以使用纬度和经度值打开\
  \ Google 地图，或将 URL 操作链接到内部公司网站（包含法规），或者可能是工单系统。\n\n## 导航操作\n\n下一个操作过去常与按钮结合使用，以给用户带来更交互式的体验。您将添加带有操作的按钮以转到特定工作表，而不是单击选项卡从一个页面跳转到另一个页面：\n\
  \n- 1. 转到“数量与利润”仪表板，创建名为 **字符串** 的计算字段，代码为 \"返回到 [...]\"。这将很快充当我们的按钮。\n\n- 2. 打开一个新工作表并将其命名为\
  \ **按钮**\n\n- 3. 通过将 **详细信息** 和 **标签** 拖放到上面，放置计算字段 **字符串**\n\n- 4. 从 **标记** 卡下拉菜单中选择\
  \ **形状**，并选择您喜欢的任意形状（和颜色）\n\n- 5. 隐藏标题并禁用 **提示信息**\n\n- 6. 单击 **标签** 并选择 **底部居中对齐**。结果如下所示：\n\
  \n![](img/66cf6b89349fda3581a4f196cb3c98a4_470_0.png)\n\n### 图 10.32: 按钮\n\n- 7.\
  \ 返回到“数量与利润”仪表板，选择 **浮动**，并将 **按钮** 工作表拖放到仪表板上——例如，放在左下角\n\n![](img/66cf6b89349fda3581a4f196cb3c98a4_471_0.png)\n\
