  \ LOD 计算中涉及的任何维度从计算中被移除。多个维度可以是 EXCLUDE LOD 的一部分，常见的用例包括将视图中较低聚合级别（视图中存在的字段）的值与较高聚合（仿佛从视图中移除了维度）的值进行直接比较。假设你想要可视化不同区域中各类别的销售额，以及每个区域的总销售额。你可能还想要计算某个区域内单个类别与该区域总体之间的差异。LOD\
  \ 能够解决这个看似不可能的场景，难道不很酷吗？我希望上述练习能让你更好地理解 EXCLUDE LOD。\n\n在 FIXED 和 EXCLUDE 练习之后，作为快速插曲，让我们更仔细地了解一下\
  \ Tableau 的操作顺序。如你现在所知，FIXED 和 EXCLUDE 不能始终获得相同的结果——操作顺序将帮助我们理解原因。\n\n## 了解 Tableau\
