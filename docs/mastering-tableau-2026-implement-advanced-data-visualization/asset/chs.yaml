  这些警告在工作簿级别也可见，甚至在打开视图时也是如此。


  这是一个非常强大的功能，展示了 Tableau 随每个版本日益成熟。数据质量是许多数据策略的重点，也是所有分析的基础。Tableau Server 已适应这一需求，并为您提供将随您的数据策略和质量措施共同成长的功能。


  > > **注意**

  > > **关于 Ask Data 的说明**

  > >

  > > 如果您使用过较旧版本的 Tableau，可能记得 Ask Data，即自然语言查询功能，可让您键入诸如“按区域显示销售额”之类的问题。Ask Data
  于 2024 年 2 月正式停用，不再在 Tableau Cloud 或 Tableau Server 2024.2 及更高版本中提供。其功能已被 Tableau
  Pulse（提供关于指标的 AI 生成洞察）和 Tableau Agent（帮助您通过对话构建可视化）所取代。有关这些功能的更多信息，请参见第 15 章，Tableau
  AI、Pulse 和下一代的智能时代。


