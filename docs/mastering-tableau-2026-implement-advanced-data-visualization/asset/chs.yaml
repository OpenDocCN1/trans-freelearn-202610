  但现在，让我们看看一个包含地理空间数据的第二个、更简短的用例。我们将把同样的“快速思考，快速交付”方法应用于空间数据——这次是在严格的一小时截止日期内。\n\n\
  ## 芝加哥交通违章的地理空间分析\n\n星期三早上，您的经理来到您的办公室，想查看芝加哥过去一年的闯红灯违章情况。他们询问您是否可以为此构建一个仪表板。特别是，您需要突出显示大多数违章发生的位置，以及过去几年芝加哥交通信号灯违章是否存在整体趋势。您会获得两个数据集，一个包含摄像头位置，一个包含违章记录，并被告知仪表板需要在一小时内完成。您该怎么办？\n\
  \n在继续阅读之前，请思考您将如何处理这个问题。花五分钟时间思考您将采取的步骤，并草拟仪表板设计。\n\n以下是我处理此问题的概述：\n\n- 1. 在 Tableau\
  \ Prep Builder 中打开数据集\n- 2. 连接两个数据集\n- 3. 如有需要，清理数据\n- 4. 在 Tableau 中打开输出\n- 5.\
  \ 如果可能，使用地图可视化摄像头位置\n- 6. 添加每个摄像头的违章数量\n- 7. 确定是否存在月度趋势\n\n接下来是我设计仪表板的粗略草图：\n\n\
  ![](img/66cf6b89349fda3581a4f196cb3c98a4_517_0.png)\n\n网格 = 街道\n圆圈 = 交通信号灯摄像头位置\n\
  颜色/大小 = 违章数量\n\n\n\n\n\n接下来是我将要执行的步骤说明。对应的 Tableau 仪表板可以从 Tableau Public 下载，Tableau\
  \ Prep Builder 文件可在 GitHub 上找到 (https://github.com/PacktPublishing/Mastering-Tableau-2026/tree/main/Chapter11)，而数据集本身可在此公开获取：https://data.cityofchicago.org/Transportation/Red-Light-Camera-Violations/spxq-js37.\n\
  \n## 准备数据\n\n将两个文件加载到 Tableau Prep Builder 后，我发现按 LONGITUDE 和 LATITUDE 进行连接并没有任何帮助，因为几乎所有记录都不匹配：\n\
  \n![](img/66cf6b89349fda3581a4f196cb3c98a4_518_0.png)\n\n图 11.34：连接 1\n\n我尝试另一种方法：按交汇路口进行连接。这次结果同样是\
  \ 0 个连接行，但这次我明白了原因。在一个数据集中，INTERSECTION 值由短横线 (-) 分隔，而在另一个数据集中，则是 AND；此外，一个使用大写字母，另一个则不使用：\n\
  \n![](img/66cf6b89349fda3581a4f196cb3c98a4_519_0.png)\n\n图 11.35：连接 II\n\n我可以添加一个清理步骤，将所有字母转为大写并将交汇路口拆分为两部分。我可以在\
  \ - 以及 AND 上执行 Custom Split...：\n\n![](img/66cf6b89349fda3581a4f196cb3c98a4_519_1.png)\n\
  \n![](img/66cf6b89349fda3581a4f196cb3c98a4_519_2.png)\n\n图 11.36：数据准备\n\n接着，我注意到交汇路口的顺序不同；例如，Ashland-71st\
  \ 和 71ST AND ASHLAND。我可能会考虑重新构建数据集，创建一个循环，将两条街道在两个拆分部分中按字母顺序排列，但现在我没有时间这样做。\n\n\
  另一种解决方案是先将 split 1 与 split 1 连接，以及 split 2 与 split 2 连接。在第二次连接中，我可以将 split 1 与 split\
  \ 2 连接，以及 split 2 与 split 1 连接。之后，我可以将两次连接合并并创建输出文件（或直接将 Prep Builder 数据集加载到 Tableau\
  \ Desktop 中）。使用这种方法，我仍然无法包含所有数据，但可以获得 444,000 行中的 380,000 行。这可能足以大致了解模式。如果我还有剩余时间，可以继续映射剩余的不匹配项。\n\
  \n不过，我决定彻底放弃 locations 数据集，只使用 violations 数据集，因为我意识到自己只会遗漏尚未发生违规行为的地点。目前违规地点的位置已经足够。然而，如果你想判断交通信号灯控制是否停止工作，则必须同时使用两个数据集。\n\
  \n## 构建交汇路口地图\n\n我继续在 Tableau 中打开 violations 数据集：\n\n- 1. 经度和纬度值未被自动识别，因此我需要通过单击数据类型图标将两者都更改为\
  \ Number (decimal)：\n\n![](img/66cf6b89349fda3581a4f196cb3c98a4_520_0.png)\n\n图\
  \ 11.37：更改数据类型\n\n- 2. 然后，我通过单击前面图中字段上的下拉箭头并选择 **转换为度量**，将 **经度** 和 **纬度** 字段更改为\
  \ **度量**\n\n- 3. 现在我可以再次单击数据类型图标，将两个字段更改为 **纬度** 和 **经度**：\n\n![](img/66cf6b89349fda3581a4f196cb3c98a4_521_0.png)\n\
  \n图 11.38：更改地理角色\n\n- 4. 通过将 **经度** 拖到 **列**，**纬度** 拖到 **行**，并将 **交汇路口** 拖到 **文本**\
  \ 卡，我可视化红灯位置——至少包括曾发生过违规的位置：\n\n![](img/66cf6b89349fda3581a4f196cb3c98a4_522_0.png)\n\
