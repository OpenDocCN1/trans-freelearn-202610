  - 3. 构建地图：双击 **州/省**\n- 4. 将 **Sales** 拖到 **标记** 货架的 **大小** 和 **颜色** 上，并选择 **红蓝发散**\n\
  - 5. 右键单击地图 | **背景** | **地图图层**，并启用：**土地覆盖**、**海岸线**、**国家边界**，在 **数据图层** 中：**人口密度**：\n\
  \n![](img/66cf6b89349fda3581a4f196cb3c98a4_537_0.png)\n\n图 11.60：背景图层\n\n你现在将能够在人口之上看到每个州的销售数字。我们是否在人口数量较高的地方看到了更多销售？\n\
