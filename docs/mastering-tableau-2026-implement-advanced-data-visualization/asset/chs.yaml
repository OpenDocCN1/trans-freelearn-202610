  \n### 添加地图图层\n\n我们希望用一条从起点到目的地城市的线来可视化运输路线。我们还想显示交货时间以及货物重量。我们将继续使用之前的 freight 数据集；我们只需做一些调整：\n\
  \n- 1. freight 数据集没有经度或纬度，这些对于 Tableau 的某些空间计算字段（例如 MAKEPOINT，我们稍后将用到）至关重要。打开 Google\
