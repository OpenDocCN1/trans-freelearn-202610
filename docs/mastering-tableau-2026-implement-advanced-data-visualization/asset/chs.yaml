  \ 2021.1 引入的几项与 FIXED LOD 相关的新功能。\n\n## 表范围表达式\n\n编写 FIXED 表范围 LOD 表达式的快捷方式（等效于\
  \ {FIXED : MAX([Order Date])}）是：\n\n```\n{MAX([Order Date])}\n```\n\n如果在 Superstore\
  \ 数据集上使用此计算，您将获得与编写以下内容完全相同的结果：\n\n```\n{FIXED : MAX([Order Date])}\n```\n\n无论您在视图中显示什么，此字段始终会从整个表中检索最新数据。很酷，对吧？\n\
  \n## 快速 LOD\n\nTableau 2021.1 允许我们更快地创建 FIXED LOD。只需将所需度量拖放到维度上方，然后按 **Ctrl**（macOS\
  \ 上为 **Cmd**）。\n\n现在您将看到维度被蓝色高亮显示（请参阅 **图 7.16** 中的 **区域**）。然后将度量放置于该处，将创建一个新的度量字段（在此示例中为\
  \ **销售额 (区域)**）。\n\n![](img/66cf6b89349fda3581a4f196cb3c98a4_296_0.png)\n\n图 7.16:\
  \ 快速 LOD\n\n右键单击 Sales (Region)，并注意已创建一个 FIXED LOD：\n\n```\n{ FIXED [Region]: SUM([Sales])\
  \ }\n```\n\n图 7.17: 快速 LOD II\n\n如果您使用的是 Tableau 2021.1 或更高版本，可以使用此快捷方式创建 FIXED\
  \ LOD。\n\n我们构建的游乐场不仅用于 FIXED，也用于 EXCLUDE。接下来，让我们了解 EXCLUDE。\n\n## 理解 EXCLUDE\n\n\
