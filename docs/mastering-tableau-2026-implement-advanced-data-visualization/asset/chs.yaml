  \ 创建名为 Timetable Explorer 的新仪表板\n  - 左侧放置：站点热门度地图。\n  - 右侧放置：按小时划分的服务频率（顶部）和最繁忙的车站（底部）。\n\
  \n### 时刻表探索器\n\n### 站点热门度地图\n\n![](img/66cf6b89349fda3581a4f196cb3c98a4_428_0.png)\n\
  \n### 按小时划分的服务频率\n\n![](img/66cf6b89349fda3581a4f196cb3c98a4_428_1.png)\n\n### 最繁忙的车站\n\
  \n![](img/66cf6b89349fda3581a4f196cb3c98a4_428_2.png)\n\n图 9.51: 时刻表探索器\n\n该仪表板有助于了解三个核心方面\n\
  \n在 **站点热门度地图** 中，所有火车站均按停靠列车数量调整大小（最繁忙的车站显示为大圆）。这可以识别关键交通枢纽，并揭示瑞士及邻国的网络密度模式。\n\n\
  在 **按小时划分的服务频率** 中，我们显示一个热图，指示哪些路线在一天中的哪些时段运行。这有助于规划行程，显示高峰与非高峰服务，并揭示仅在高峰时段运行的路线。\n\
  \n最后，**最繁忙的车站** 工作表包含按列车频率排名的顶部车站条形图。这是网络中最重要节点的快速参考。\n\n## 摘要\n\n本章探讨了如何在不离开界面的情况下扩展\
  \ Tableau 的映射功能，通过捕获 Tableau 生成的纬度和经度数据，并学习如何在 Google 上查询这些数据。我们根据 .shp 文件为得克萨斯州创建了多边形和热图，以及一个带有双地图轴的仪表板和另一个带有\
  \ 4 个地图图层的仪表板。接下来，我们探讨了使用其他技术扩展 Tableau 映射的各种方式。我们连接到 WMS 服务器，然后探索了 Mapbox 产品，随后深入了解了多边形的世界。\n\
  \n在下一章中，我们将探讨使用 Tableau 进行演示。具体来说，我们将了解如何从 Tableau 中获取最佳图像、如何有效高效地将 Tableau 与 PowerPoint\
  \ 结合使用，以及如何直接使用 Tableau 进行演示而不依赖第三方工具。\n\n## 获取本书 PDF 版本及更多内容\n\n扫描二维码（或访问 packtpub.com/unlock），按名称搜索本书，确认版本，然后按照页面上的步骤操作。\n\
