  \nFigure 11.14: 悬停在点上\n\n- 18. 我已经添加了趋势线，现在我想在视图中显示 **皮尔逊 R** (也称为 **R 平方**) 值，以便用户知道两个指标是否相关；然而，无法将\
  \ **描述趋势线** 或 **描述趋势模型** 选项设置为始终显示。因此，我将在新字段中自己计算该值；我使用 CORR() 函数来完成此操作：\n\n```\n\
  ROUND( CORR( [X-Axis], [Y-Axis] ), 3 )\n```\n\nFigure 11.15: 皮尔逊 R\n\n\n\n\n\n##\
  \ 注意\n\n趋势线显示关系的方向，但 R-squared（R²）告诉你该关系有多强。相关性衡量两个变量如何同步变动。正相关 = 两者均上升。负相关 = 一个上升，另一个下降。R-squared\
  \ 的取值范围是 0 到 1。越接近 1，关系越强。\n\n- R² = 0.9 表明存在非常强的关系\n- R² = 0.5 表明存在中等强度的关系\n- R²\
  \ = 0.1 表明存在弱关系\n\n- 但我想显示一些文本来指示两个变量是否相关，而不是显示数值本身，因为我希望仪表板更清晰。因此，我创建了另一个名为 **相关性：是或否**\
  \ 的计算字段，使用以下代码：\n\n```\nIF [Pearson R] > 0.7 then 'The two variables <' + [Parameters].[X-Axis]+\
  \ '> and\n<'+ [Parameters].[Y-Axis]+ '> have a very strong positive correlation\
  \ of: ' +\nSTR([Pearson R])\nELSEIF [Pearson R] < 0.7 and [Pearson R] > 0.4 then\
  \ 'The two variables <' +\n[Parameters].[X-Axis] + '> and <'+ [Parameters].[Y-Axis]+\
  \ '> have a strong\npositive correlation of: ' + STR([Pearson R])\nELSEIF [Pearson\
  \ R] < 0.4 and [Pearson R] > 0.2 then 'The two variables <' +\n[Parameters].[X-Axis]\
  \ + '> and <'+ [Parameters].[Y-Axis]+ '> have a moderate\npositive correlation of:\
  \ ' + STR([Pearson R])\nELSEIF [Pearson R] <0.2 and [Pearson R] > -0.2 then 'The\
  \ two variables <' +\n[Parameters].[X-Axis] + '> and <'+ [Parameters].[Y-Axis]+\
  \ '> have no or a weak\ncorrelation of:'+ STR([Pearson R])\nELSEIF [Pearson R] <\
  \ -0.2 and [Pearson R] >-0.4 then 'The two variables <' +\n[Parameters].[X-Axis]\
  \ + '> and <'+ [Parameters].[Y-Axis]+ '> have a moderate\nnegative correlation of:\
  \ ' + STR([Pearson R])\nELSEIF [Pearson R] < -0.4 and [Pearson R] > -0.7 then 'The\
  \ two variables <' +\n[Parameters].[X-Axis] + '> and <'+ [Parameters].[Y-Axis]+\
  \ '> have a strong\nnegative correlation of: ' + STR([Pearson R])\nELSEIF [Pearson\
  \ R] < -0.7 THEN 'The two variables <' + [Parameters].[X-Axis] +\n'> and <'+ [Parameters].[Y-Axis]+\
  \ '> have a very strong negative correlation of:\n' + STR([Pearson R])\nEND\n```\n\
  \n- 完成此操作后，我创建一个新工作表，并将 **相关性：是或否** 放置在 **文本** 货架上。该工作表非常简单，如您所见：\n\n![](img/66cf6b89349fda3581a4f196cb3c98a4_505_0.png)\n\
  \n变量 <Human Development Index HDI-2014> 和 <Mean years of schooling - Years> 之间存在非常强的正相关，值为：0.899\n\
