  \n- 1. 我将新工作表命名为 热图，并将 MONTH(Violation Date) 放在 列 上，将 YEAR(Violation Date) 放在 行\
  \ 上。然后，我将 违规 拖到 颜色 卡并选择红金色，得到如下结果：\n\n![](img/66cf6b89349fda3581a4f196cb3c98a4_526_1.png)\n\
  \n图 11.46：热图\n\n夏天肯定有更多的红灯违规行为，2016 年和 2020 年的违规数量最多。\n\n- 2. 最后但同样重要的是，我添加一个名为\
  \ 趋势？ 的新工作表。我将 MONTH(Violation Date) 拖到 列 卡上。 违规 字段应放置在 行 上。我确保两个度量均为 Continuous（绿色）。从\
  \ 分析窗格，我将线性 趋势线 拖到工作表上。接下来，我将 预测 拖入视图中：\n\n![](img/66cf6b89349fda3581a4f196cb3c98a4_527_0.png)\n\
  \n图 11.47：折线图\n\n在前面的图中，你可以看到红灯违规的总体趋势随年份略有增加。预测显示，夏天红灯违规较多的季节性规律可能会在 2021 年继续。\n\
  \n欢迎在 2021 年底前检查 Tableau 预测模型的效果！芝加哥市的数据集会持续刷新。\n\n## 最终确定仪表板\n\n一小时快结束了，我只是将三个工作表放置到一个名为\
  \ 红灯违规 的仪表板上，并稍微进行格式化；它如下所示：\n\n## 红灯违规\n\n![](img/66cf6b89349fda3581a4f196cb3c98a4_528_0.png)\n\
  \n图 11.48：最终仪表板\n\n你可以在 Tableau Public 上与此章节关联的 Tableau 工作簿中找到最终仪表板，链接如下：https://github.com/PacktPublishing/Mastering-Tableau-2026/tree/main/Chapter11。\n\
  \n仪表板可以改进吗？当然可以，总是可以改进。但是在第一次迭代之后，我的老板可以告诉我是否需要调整任何内容，我可以进行调整。我相信我可以花更多时间来改进它，但大多数时候，仪表板制作更注重及时交付。与临时问题或一次性练习相比，完整的生产模型是另一回事，尤其是如果你以敏捷的方式工作，将工作拆分为可交付成果，获取反馈并继续处理。\n\
  \n## 使用距离度量扩展地理空间分析\n\n我们的最后一个用例也是针对同一芝加哥交通数据集的地理空间分析，但这次我们将添加另一个组件。我们希望租一个新地方，但要求半径\
  \ x 范围内的交汇路口不超过 n 个，且海军码头距离最多 y 英里。变量 n、x 和 y 应该是交互式的，以便我们进行更改并获得非常灵活的仪表板体验。关于此任务，需要提出的问题是：\n\
  \n- 我们如何将芝加哥的任何给定位置添加到数据集中？它当前仅显示交汇路口和违规行为。\n\n- 我们如何创建 n、x 和 y 变量？\n\n- 我们如何在地图上任何给定点添加半径指示器？\n\
  \n- 我们如何测量两个变量点之间的距离？\n\n\n\n\n\n以下步骤将解答所有这些问题：\n\n- 1. 返回与此章相关的工作簿\n- 2. 右键单击名为\
  \ **Intersection** 的工作表，然后单击 **复制**\n- 3. 将新工作表重命名为 Rental1\n- 4. 从 **页面** 中移除 **MONTH(Violation\
  \ Date)**，从 **颜色** 货架中移除 **SUM(Violations)**，并从标题中移除红色文本（子标题），使工作表如下所示：\n\n![](img/66cf6b89349fda3581a4f196cb3c98a4_529_0.png)\n\
  \n图 11.49：交集\n\n- 5. 将 **标记** 类型更改为 Map\n- 6. 单击 **地图 | 图层**，并将 **数据图层** 更改为 **无数据图层**：\n\
  \n![](img/66cf6b89349fda3581a4f196cb3c98a4_529_1.png)\n\n图 11.50：图层\n\n- 7. 将 Violation\
  \ Date 放到 **筛选器** 货架上，并选择年份 2020\n- 8. 将 Violations 拖到 **颜色** 货架上，并选择 Red 调色板：\n\
  \n![](img/66cf6b89349fda3581a4f196cb3c98a4_530_0.png)\n\n图 11.51：编辑颜色\n\n现在我们面前有一张芝加哥地图，每个点代表\
  \ 2020 年发生过违规行为的路口。点越深，表示在该路口登记的违规行为越多。\n\n## 向地图添加度量点\n\n接下来，我们需要添加功能，以便在地图上设置一个标记并从此处开始测量。这可以通过创建经度和纬度参数，并在计算字段中使用它们来实现：\n\
  \n- 1. 创建以下参数：\n  - Lat：\n  - 纬度：\n\n![](img/66cf6b89349fda3581a4f196cb3c98a4_531_0.png)\n\
  \n图 11.52：纬度参数\n\n  - Long：\n  - 经度：\n\n![](img/66cf6b89349fda3581a4f196cb3c98a4_531_1.png)\n\
  \n图 11.53：经度参数\n\n- 2. 右键单击每个参数并选择 **显示参数**\n- 3. 创建名为 Address manual 的计算字段：\n\n\
  ```\nMAKEPOINT([Lat], [Long])\n```\n\n- 4. 将 Address manual 拖到地图上，位于 **添加标记图层**\
  \ 弹出窗口上方：\n\n![](img/66cf6b89349fda3581a4f196cb3c98a4_532_0.png)\n\n图 11.54：添加图层\n\
  \n- 5. 将新图层的 **标记** 类型更改为 Map\n\n- 6. 按照这些步骤，我们将拥有一张带有路口、按颜色编码的违规数量以及一个可通过 Lat 和\
  \ Long 参数更改的点的地图。用户可以例如使用 Google Maps 查找纬度和经度；只需在 Google Maps 上选择一个代表租赁房屋位置的点即可：\n\
  \n![](img/66cf6b89349fda3581a4f196cb3c98a4_532_1.png)\n\n图 11.55：Google Maps\n\n\
  - 7. 纬度和经度将显示在 URL 和页面底部。将它们输入到 Lat 和 Long 参数中，相同的点将出现在我们的 Tableau 地图上：\n\n![](img/66cf6b89349fda3581a4f196cb3c98a4_533_0.png)\n\
  \n图 11.56：纬度和经度\n\n## 添加距离线\n\n在接下来的步骤中，我们将添加一个半径和一条从海军码头开始的距离线：\n\n- 1. 创建另一个名为\
  \ Radius in miles 的参数，并将当前值设置为 1.1\n- 2. 右键单击 Radius in miles 参数并选择 **显示参数**\n-\
  \ 3. 创建名为 Buffer 的计算字段，它将用作围绕 **Address manual** 点的半径：\n  ```\n  BUFFER([Address\
  \ manual],[Radius in miles], 'miles')\n  ```\n- 4. 将 **Buffer** 字段拖到地图上，就像我们处理 **Address\
  \ manual** 字段一样，位于 **添加标记图层** 弹出窗口上方\n- 5. 将此新图层的 **标记** 类型更改为 Map\n\n- 6. 单击 **颜色**，将不透明度更改为\
  \ **50%**，并选择灰色\n\n以下图中显示了 **Navy Pier** 在 URL 中的坐标（**41.8859088,-87.6064094**）：\n\
  \n![](img/66cf6b89349fda3581a4f196cb3c98a4_534_0.png)\n\n![](img/66cf6b89349fda3581a4f196cb3c98a4_534_1.png)\n\
  \n图 11.57：海军码头\n\n- 7. 按如下方式创建计算字段：\n\n```\nMAKEPOINT(41.892133, -87.604045)\n```\n\
  \n- 8. 将 **Navy Pier** 字段拖到地图上，位于 **添加标记图层** 弹出窗口上方\n- 9. 将 **标记** 类型更改为 Map\n-\
  \ 10. 为了将 **Navy Pier** 连接到我们的 **Address manual** 点并测量距离，创建另一个名为 Line 的计算字段：\n\n\
  ```\nMAKELINE([Address manual], [Navy Pier])\n```\n\n- 11. 要测量两者之间的距离，使用以下代码创建一个\
  \ Distance 字段：\n\n```\nDISTANCE([Address manual], [Navy Pier], 'miles')\n```\n\n\
  - 12. 将 Line 字段放置在地图上，位于 **添加标记图层** 弹出窗口上方\n- 13. 将新图层中的 **标记** 类型更改为 Map\n- 14.\
  \ 将 Distance 放到 **标签** 货架上，将度量更改为平均值，然后单击 **标签** 添加文本 miles：\n\n![](img/66cf6b89349fda3581a4f196cb3c98a4_535_0.png)\n\
  \n图 11.58：编辑标签\n\n我们的仪表板现在如下所示：\n\n租赁\n\n![](img/66cf6b89349fda3581a4f196cb3c98a4_535_1.png)\n\
  \n图 11.59：最终仪表板\n\n至此即告完成。半径清楚地显示了某段距离内有多少个路口；你可以通过将鼠标悬停在点上来查看 **路口违规数量**。从海军码头到我们当前位置\
  \ **Address manual** 的线告诉我们这两个点之间的距离。\n\n要解答开头提出的问题：\n\n- *如何将芝加哥的任何给定位置添加到我们的数据集中？目前它仅显示路口和违规行为。通过在计算字段中使用\
  \ **MAKEPOINT()** 函数。*\n- *如何创建 n、x 和 y 变量？通过使用参数。*\n- *如何在地图上的任何给定点添加半径？通过使用 **BUFFER()**\
  \ 函数。*\n- *如何测量两个可变点之间的距离？通过使用 **DISTANCE()** 函数；通过添加 **MAKELINE()** 函数，将绘制一条线。*\n\
  \n此用例可以重新创建用于某区域的超市数量、学校、公共交通站点等等。发挥创造力，欢迎将你的仪表板上传到 Tableau Public，别忘了添加 **#MasteringTableau**\
  \ 标签！\n\n如果你大量使用空间数据，我也建议你查看以下链接：\n\n- https://www.tableau.com/about/blog/2019/6/geospatial-analysis-made-easy-two-new-spatial-functions-makepoint-and-makeline\n\
  - https://www.tableau.com/about/blog/2020/3/seeing-and-understanding-proximity-made-easy-buffer-calculations\n\
  \n## 配套仪表板\n\n在本章中，我们将使用 Tableau Superstore 零售数据集创建一个预测仪表板，该数据集包含地理、时间和产品数据，非常适合空间分析和预测。\n\
