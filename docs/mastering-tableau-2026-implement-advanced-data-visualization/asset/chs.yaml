  - 3. 将 Arr Delay 拖到 Rows。如有需要，将聚合更改为 AVG。\n- 4. 将 Flight Date 拖到 Filters\n- 5. 创建字段\
  \ Avg ArrDelay(FIXED) = { FIXED : AVG([Arr Delay])}\n- 6. 将 Route Avg ArrDelay (FIXED)\
  \ 拖到视图中，将其作为 Rows 上的第二个度量并使用双轴\n\n这显示了什么：\n\n- 折线 = 平均延误随时间的变化情况（所选航班）\n- 第二条线 =\
  \ 来自 FIXED LOD 的稳定路线基准\n\n### 图 7.49：延误 vs 基准\n\n接下来，我们将创建工作表 2：KPI 磁贴（LOD 指标摘要）：\n\
