  \ |\n| 4 | 客户 ID |\n| 5 | 客户名称 |\n| 6 | 订单 ID |\n| 7 | 邮政编码 |\n\n### 图 7.2: 参数 I\n\
  \n名为 2nd Dim、3rd Dim 和 4th Dim 的参数与 1st Dim 相同。\n\n- 4. 请注意，除了 Order Date 和 Ship\
  \ Date 之外，数据集中的每个维度都包含在值列表中（参见图 7.2）。出于本练习的目的，Category、Region、Segment、Ship Mode\
