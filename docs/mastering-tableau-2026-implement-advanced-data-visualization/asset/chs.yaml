  \ 之间的行为差异，反映了底层的筛选操作顺序。如图 7.27 所示，上下文筛选器会影响 FIXED、EXCLUDE 和 INCLUDE 计算，因为上下文筛选器首先应用于数据集，然后才是\
  \ LOD。然而，维度筛选器只会影响 EXCLUDE 和 INCLUDE LOD，因为 FIXED LOD 首先应用于数据集，然后是维度筛选器，随后是 EXCLUDE\
  \ 和 INCLUDE LOD。\n\n请参见以下图表，它是 Tableau 中操作顺序的示意图：\n\n![](img/66cf6b89349fda3581a4f196cb3c98a4_306_0.png)\n\
  \n图 7.28：操作顺序\n\n图 7.28 源自 Tableau 帮助页面，地址为：https://help.tableau.com/current/pro/desktop/en-us/order_of_operations.htm。\n\
  \n该页面还包含关于 Tableau 操作顺序的更多信息。\n\n我们刚刚看到，在使用上下文筛选器时，EXCLUDE 和 FIXED LOD 可以得出相同的数字，而维度筛选器会导致结果不同。这是因为\
  \ Tableau 依次执行不同的请求。如上图所示，操作顺序为：\n\n- 1. 上下文筛选器\n- 2. FIXED LOD\n- 3. 维度筛选器\n- 4.\
  \ INCLUDE 和 EXCLUDE LOD\n\n了解这一点对您来说很重要，以便为您的目的选择正确的筛选器或 LOD。\n\n接下来，我们将使用一个新的游乐场，这次来展示\
  \ INCLUDE LOD 的工作原理。\n\n## 使用 INCLUDE 函数\n\n使用随附工作簿（https://github.com/PacktPublishing/Mastering-Tableau-2026/tree/main/Chapter07）时，第二个游乐场大部分已为您设置好。但是，我们将添加一些计算字段，以便有效探索。如果您无法随时访问工作簿，应该可以通过参考以下信息构建类似的工作簿。\n\
  \n### 设置工作簿\n\n以下，我们将设置一个工作表，以便练习 INCLUDE LOD：\n\n- 1. 打开与此章关联的工作簿并导航到“探索包含”工作表\n\
  - 2. 在之前练习中创建的名为 1st Dim、2nd Dim、3rd Dim 和 4th Dim 的参数和计算字段也用于此工作表\n- 3. 右键单击 **1st\
  \ Dim** 参数并选择 **复制**\n- 4. 将副本重命名为 Choose Included Dims\n- 5. 创建一个名为 Case Include\
  \ 的新计算字段，使用以下代码：\n\n```\nCASE [Choose Included Dims]\nWHEN 1 THEN AVG({INCLUDE [Category]:\
  \ SUM([Sales])})\nWHEN 2 THEN AVG({INCLUDE [City]: SUM([Sales])})\nWHEN 3 THEN AVG({INCLUDE\
  \ [Country]: SUM([Sales])})\nWHEN 4 THEN AVG({INCLUDE [Customer ID]: SUM([Sales])})\n\
  WHEN 5 THEN AVG({INCLUDE [Customer Name]: SUM([Sales])})\nWHEN 6 THEN AVG({INCLUDE\
  \ [Order ID]: SUM([Sales])})\nWHEN 7 THEN AVG({INCLUDE [Postal Code]: SUM([Sales])})\n\
  WHEN 8 THEN AVG({INCLUDE [Product ID]: SUM([Sales])})\nWHEN 9 THEN AVG({INCLUDE\
  \ [Product Name]: SUM([Sales])})\nWHEN 10 THEN AVG({INCLUDE [Region]: SUM([Sales])})\n\
  WHEN 11 THEN AVG({INCLUDE [Segment]: SUM([Sales])})\nWHEN 12 THEN AVG({INCLUDE [Ship\
  \ Mode]: SUM([Sales])})\nWHEN 13 THEN AVG({INCLUDE [State]: SUM([Sales])})\nWHEN\
  \ 14 THEN AVG({INCLUDE [Sub-Category]: SUM([Sales])})\nWHEN 15 THEN 0\nEND\n```\n\
  \n- 6. 将 Case Include 放在详细信息卡上\n- 7. 将以下度量和维度放置在各自的卡上：\n\n![](img/66cf6b89349fda3581a4f196cb3c98a4_307_0.png)\n\
  \n图 7.29：探索 INCLUDE\n\n- 8. 通过右键单击每个参数并选择 **显示参数控件** 来显示每个参数：\n\n![](img/66cf6b89349fda3581a4f196cb3c98a4_308_0.png)\n\
  \n图 7.30：参数\n\n完成初始设置后，我们终于可以开始研究 INCLUDE LOD 了。\n\n### 理解 INCLUDE\n\n现在游乐场环境已准备就绪，让我们构建一个场景以更好地理解\
  \ INCLUDE。到目前为止，您可能已经想象到，如果 FIXED 和 EXCLUDE LOD 从计算中移除维度，那么 INCLUDE 会添加维度。没错！您可能希望在计算中包含一个或多个维度，即使视图中未显示它们也是如此。下一个示例将利用这一功能，在不显示子类别的情况下展示每个子类别的平均值。之所以想要这样做，是因为子类别的值太多，会导致仪表板更难阅读，并且得出快速结论所需的时间更长。尽管如此，了解每个子类别的平均值仍然很有用，因为每个\
  \ **地区** 和其他维度的子类别数量可能不同，因此包含它可以深入了解真正的平均销售额。\n\n让我们看看实际效果：\n\n- 1. 如下所示设置右侧的参数：\n\
