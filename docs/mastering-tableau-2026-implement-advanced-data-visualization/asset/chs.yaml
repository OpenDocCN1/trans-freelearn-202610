  图 8.11：编辑背景图像\n\n- 10. 单击 选项 并选择 始终显示整个图像。然后关闭此窗口\n\n![](img/66cf6b89349fda3581a4f196cb3c98a4_336_1.png)\n\
  \n图 8.12：编辑背景图像选项\n\n- 11. 你的图像现在应该出现在工作表中，书本周围有匹配的点\n\n![](img/66cf6b89349fda3581a4f196cb3c98a4_337_0.png)\n\
  \n图 8.13：带点的书架\n\n- 12. 要创建围绕线而不是点，请将标记类型更改为 线，并将 形状 ID 放在 详细信息 上，将 点 ID 放在 路径 上\n\
  \n![](img/66cf6b89349fda3581a4f196cb3c98a4_337_1.png)\n\n图 8.14：带线的书架\n\n- 13. 要创建多边形，请将标记类型更改为\
  \ 多边形，并将 颜色 图架上的 透明度 设置为 0%\n\n- 14. 此外，你可以在将两个字段都放在 **详细信息** 图架后，添加带有书名和可用性的提示\n\
  \n![](img/66cf6b89349fda3581a4f196cb3c98a4_338_0.png)\n\n图 8.15：编辑提示\n\n- 15. 如果你将鼠标悬停在书本上，可以看到名称以及可用性\n\
  \n![](img/66cf6b89349fda3581a4f196cb3c98a4_338_1.png)\n\n图 8.16：使用提示\n\n多边形最好的地方在于它们填充了整个区域。在这个示例中，无论你在哪里悬停或单击，书的完整背面都被覆盖，因为我们绘制了一个区域而不是一个点或某个默认形状。并且这带来了无限的可能性；想象一个大图书馆，每本书都是一个多边形，你可以将实时数据连接到多边形数据集，以获取任何书籍的最新可用性。除了书籍，你可以画任何东西。我在\
  \ Tableau 中见过最多的是平面图、超市货架、办公布局、分割成部分的形状……多边形确实让你在可视化中发挥创造力。\n\n如果你手头没有图像，并且想要为仪表板绘制非常特定的内容，可以使用付费或免费的软件，例如\
  \ Adobe Illustrator Draw、Sketch、Sketsa SVG Editor、Boxy SVG、Gravit Designer、Vecteezy\
  \ Editor、Vectr、Method Draw、Inkpad、iDesign、Affinity Designer、macSVG、Chartist.js、Plain\
  \ Pattern、Inkscape 等。\n\n在继续之前，让我们将仪表板进一步提升：\n\n- 1. 在 名称 | 别名... 上右键单击...\n- 2.\
  \ 如图所示更改书籍并单击 确定：\n\n![](img/66cf6b89349fda3581a4f196cb3c98a4_339_0.png)\n\n图 8.17：选择另一本书\n\
  \n- 3. 删除 书店 工作表的 X 和 Y 轴\n- 4. 打开一个仪表板选项卡并将其命名为 书店。\n- 5. 将 书店 工作表拖动到仪表板的上半部分，将\
  \ 网页 对象拖动到底部的一半。在 URL 弹出窗口中键入：https://en.wikipedia.org/wiki/。\n- 6. 选择 网页 对象并单击箭头；选择\
  \ 添加 URL 操作...\n\n![](img/66cf6b89349fda3581a4f196cb3c98a4_339_1.png)\n\n图 8.18：添加\
  \ URL 操作...\n\n- 7. 在 **操作** 窗口中，通过从箭头下拉菜单中选择该字段，将 **名称** 添加到 URL。\n\n![](img/66cf6b89349fda3581a4f196cb3c98a4_340_0.png)\n\
  \n图 8.19：描述筛选器\n\n- 8. 单击 **确定** 并选择不同的书，以查看仪表板中 Wikipedia 条目的变化\n\n![](img/66cf6b89349fda3581a4f196cb3c98a4_341_0.png)\n\
  \n![](img/66cf6b89349fda3581a4f196cb3c98a4_341_1.png)\n\n图 8.20：Wikipedia\n\n我相信你现在已经有了关于如何使用多边形的大量想法。也许你想分析一场棋局？我们下一节就来做这个！\n\
  \n## 在 Tableau 中分析一场棋局\n\n在这个练习中，我们将使用 Inkscape。但是，与其在其中一个工具中绘制东西、将其转换为多边形并加载到 Tableau\
  \ 中，不如在 Tableau 中创建 SVG 文件的代码，将其加载到 Inkscape 中查看是否有效，然后将其转换为多边形，并将带有 x 和 y 坐标的转换版本加载回\
  \ Tableau 来分析一场棋局。通过亲自创建 SVG 文件，你将能够识别 Tableau 需要的哪些 X 和 Y 坐标，因此你将始终能够转换 SVGs。\n\
  \n### 在 Tableau 中创建 SVG 文件\n\n在本节中，我们将使用 Tableau 生成构建 SVG 文件所需的 XML，该文件可以用矢量图形工具\
  \ Inkscape 打开，Inkscape 是开源的，因此免费提供。访问 inkscape.org 下载最新版本。我们还需要 Chessboard.png 图像，可在\
  \ Packt GitHub 页面上找到：https://github.com/PacktPublishing/Mastering-Tableau-2026/tree/main/Chapter08。请也下载该文件。\n\
  \n通常，多边形在非线性绘图中表现出更大的威力。然而，我们的棋盘是这种情况下的一个很好示例，因为我们将创建 Tableau 自己使用的位置——创建一个正方形比创建更复杂的形状更容易，因为我们可以使用增量。请注意，以下示例中使用了\
  \ 10 行 10 列的网格，这当然会生成一个包含 100 个单元格的网格。这在 Inkscape 中运行良好。但是，如果需要大量单元格，可能需要专业的图形工具，如\
  \ Adobe Illustrator。\n\n### 创建网格\n\n以下练习具有多种目的。第一个目的是演示如何使用 Tableau 创建网格。本章提供了另一个使用数据支架的机会，该内容在第\
  \ 4 章 了解连接、混合和数据结构 中有所讨论。区别在于，在那一章中，日期用于支架目的，而在以下部分中，使用了分箱。此外，这个练习需要许多表计算，这将有助于巩固在第\
  \ 5 章 表计算简介 中学到的知识。最后，这个练习使用了数据密集化，该内容在第 6 章 使用 OData、数据密集化、大数据、Google BigQuery\
  \ 中有所讨论。\n\n要开始，请执行以下步骤：\n\n- 1. 打开一个新的 Tableau 工作簿，并将第一个工作表命名为 **标题**\n- 2. 使用\
  \ Excel 或文本编辑器，创建一个 **记录** 数据集。下面的两行表格完整地表示了 **记录** 数据集\n\n| 记录 | |\n|---|---|\n\
  | 1 | |\n| 2 | |\n\n图 8.21：Excel\n\n- 3. 将 Tableau 连接到 **记录** 数据集：\n  - o 为方便起见，可以考虑使用\
  \ `Ctrl + C` 复制数据集，并使用 `Ctrl + V` 直接粘贴到 Tableau 中。\n  - o Tableau 可能会将 **记录** 视为度量值。将\
  \ **记录** 拖动到 **数据** 窗格的 **维度** 部分。\n\n\n\n\n\n- 4. 创建两个参数。将一个命名为 Overall Pixel Count，另一个命名为\
  \ Rows Down/Columns Across。两者的设置如下：\n    - 数据类型：整数\n    - 允许值：全部\n\n- 5. 显示这两个参数。将\
  \ Rows Down/Columns Across 设置为 10，将 Overall Pixel Count 设置为 1,000：\n\n![](img/66cf6b89349fda3581a4f196cb3c98a4_343_0.png)\n\
  \n图 8.22：显示参数\n\n- 6. 创建一个名为 Concatenate Header 的计算字段，使用以下代码：\n\n```\n'<?xml version=\"\
  1.0\" encoding=\"utf-8\"?>&lt;svg version=\"1.1\" id=\"Squares\"\nxmlns=\"http://www.w3.org/2000/svg\"\
  \nxmlns:xlink=\"http://www.w3.org/1999/xlink\" x=\"0px\" y=\"0px\" viewBox=\"0 0\
  \ ' +\nSTR( [Overall Pixel Count] ) + \" \" + STR([Overall Pixel Count])+ \" \"\n\
  style=\"enable-background:new 0 0 ' + STR([Overall Pixel Count]) + ' ' +\nSTR([Overall\
  \ Pixel Count]) + '; \" xml:space=\"preserve\">\n<style type=\"text/css\"> .st0{fill:none;stroke:#000000;stroke-miterlimit:10;}\n\
  </style>'\n```\n\n注意，在计算字段对话框中输入换行符可能会导致从 Tableau 中提取结果变得困难。换句话说，请删除所有换行符。\n\n-\
  \ 7. 现在我们已创建一个骨架或模板，它将帮助我们在 Tableau 中创建多个位置以绘制网格\n\n- 8. 将新创建的计算字段放置在 文本 卡上\n\n\
  - 9. 在工具栏中，选择 适合整个视图 以查看结果；您可以看到参数从 Concatenate Header 中填充了 STR([Overall Pixel Count])\n\
  \n![](img/66cf6b89349fda3581a4f196cb3c98a4_344_0.png)\n\n```\n<?xml version=\"1.0\"\
  \ encoding=\"utf-8\"?><svg version=\"1.1\" id=\"Squares\" xmlns=\"http://www.w3.org/2000/svg\"\
  \ xmlns:xlink=\"http://www.w3.org/1999/xlink\" x=\"0px\" y=\"0px\" viewBox=\"0 0\
  \ 1000 1000\" style=\"enable-background:new 0 0 1000 1000;\" xml:space=\"preserve\"\
  > <style type=\"text/css\"> .st0{fill:none;stroke:#000000;stroke-miterlimit:10;}</style>\n\
  ```\n\n图 8.23：Concatenate Header\n\n- 10. 创建一个名为 Location Codes 的新工作表\n\n- 11. 创建以下计算字段：\n\
  \n| 名称 | 代码 |\n| :--- | :--- |\n| Rows Down/Columns Across | [Parameters].[Rows\
  \ Down/Columns Across] |\n| Which Column? | LAST()+1 |\n| Which Row? | INDEX() |\n\
  | Grid Size | [Overall Pixel Count]/LOOKUP([Which Column?],FIRST()) |\n| X | [Overall\
  \ Pixel Count] - ([Grid Size] * ([Which Row?])) |\n| Y | [Overall Pixel Count] -\
  \ ([Grid Size] * ([Which Column?]-1)) |\n| Count | If [Records] = 1 THEN 1 ELSE\
  \ [Rows Down/Columns Across] END |\n| Decicount | If [Records] = 1 THEN 1 ELSE [Rows\
  \ Down/Columns Across] END |\n| Location Codes | Index() |\n| Concatenate Locations\
  \ | '<text transform=\"matrix(1 0 0 1 ' + STR([X]) + ' ' + STR([Y]) + ')\">' + STR(\
  \ [Location Codes] ) + '</text>' |\n\n表 8.2：创建计算字段\n\n- 12. 创建的计算字段将在后续步骤中用于创建值表，类似于我们在绘图工具中生成的值表。只不过现在，我们将自行完成，并使用\
  \ SVG 代码代替经度和纬度值。\n\n- 13. 右键单击 Count 并选择 创建 | 分组（Bins）。在出现的对话框中，将 分组大小 设置为 1\n\n\
  ![](img/66cf6b89349fda3581a4f196cb3c98a4_345_0.png)\n\n图 8.24：Count 分组\n\n- 14.\
  \ 右键单击 Decicount 并选择 创建 | 分组（Bins）。在出现的对话框中，将 分组大小 设置为 1。\n\n- 15. 将 Count (bin)、Decicount\
  \ (bin)、Location Codes、X 和 Y 放置在 行 卡上。确保按列出的顺序放置这些字段。\n\n- 16. 如果您的字段为绿色（表示连续），请右键单击\
  \ 行 卡上的每个字段并将其设置为 离散。然后：\n    - 右键单击 Count (bin) 和 Decicount (bin)，并确保已选择 显示丢失值（Show\
  \ Missing Values）\n    - 右键单击 Location Codes 并选择 使用计算方式 | 表（向下）（Table (Down)）\n\
  \    - 将 X 的 使用计算方式 设置为 Count (bin)\n\n- 17. 将 Y 的 使用计算方式 设置为 Decicount (bin)\n\n\
  | Count (bin) | Decicount (bin) | Location Codes | X | Y |\n|---|---|---|---|---|\n\
  | 1 | 1 | 900 | 100 | Abc |\n| 2 | 2 | 900 | 200 | Abc |\n| 3 | 3 | 900 | 300 |\
  \ Abc |\n| 4 | 4 | 900 | 400 | Abc |\n| 5 | 5 | 900 | 500 | Abc |\n| 6 | 6 | 900\
  \ | 600 | Abc |\n| 7 | 7 | 900 | 700 | Abc |\n| 8 | 8 | 900 | 800 | Abc |\n| 9 |\
  \ 9 | 900 | 900 | Abc |\n| 10 | 10 | 900 | 1,000 | Abc |\n| 1 | 11 | 800 | 100 |\
  \ Abc |\n| 2 | 12 | 800 | 200 | Abc |\n| 3 | 13 | 800 | 300 | Abc |\n| 4 | 14 |\
  \ 800 | 400 | Abc |\n| 5 | 15 | 800 | 500 | Abc |\n| 6 | 16 | 800 | 600 | Abc |\n\
  | 7 | 17 | 800 | 700 | Abc |\n| 8 | 18 | 800 | 800 | Abc |\n\n图 8.25：Location Codes\
  \ 工作表\n\n- 18. 将 Concatenate Locations 放置在 文本 卡上\n\n- 19. 右键单击您刚刚放置在 文本 卡上的 Concatenate\
  \ Locations 实例，并选择 编辑表计算（Edit Table Calculations）\n\n- 20. 在出现的对话框顶部，请注意 嵌套计算（Nested\
  \ Calculations）下有四个选项：Grid Size、Which Column?、Which Row? 和 Location Codes。为每个选项设置\
  \ 使用计算方式（Compute Using）定义，如下所示：\n    - 嵌套计算：Grid Size > 使用计算方式：表（向下）（Table (down)）\n\
  \    - 嵌套计算：Which Column? > 使用计算方式：特定维度：Decicount (bin) > 将此维度移至顶部\n    - 嵌套计算：Which\
  \ Row? > 使用计算方式：特定维度：Count (bin) > 将此维度移至顶部\n    - 嵌套计算：Location Codes > 使用计算方式：表（向下）（Table\
  \ (down)）\n\n- 21. 在工具栏中，选择 适合宽度（Fit Width）以查看结果；您可以看到已创建多行。这些行稍后将用于绘制网格：\n\n| Count\
  \ (bin) | Decicount (bin) | Location Codes | X | Y | XML |\n|---|---|---|---|---|---|\n\
  | 1 | 1 | 900 | 100 | <text transform=\"matrix(1 0 0 1 900 100)\">1</text> |\n|\
  \ | 2 | 900 | 200 | <text transform=\"matrix(1 0 0 1 900 200)\">2</text> |\n| |\
  \ 3 | 900 | 300 | <text transform=\"matrix(1 0 0 1 900 300)\">3</text> |\n| | 4\
