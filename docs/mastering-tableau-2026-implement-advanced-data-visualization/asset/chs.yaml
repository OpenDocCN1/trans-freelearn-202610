- '# 利用 OData、数据密化、大数据和 Google BigQuery


  Tableau 新手提出的许多问题与数据准备、联接、合并、数据混合或数据结构无关，而是与 Tableau 在经常让初学者困惑的情况下的表现有关，例如意外的 null
  值、不熟悉的表计算结果，或大数据集的性能问题。本章将介绍此类情况，你还将更清晰地了解数据密化、域内填充以及 Tableau 如何与现代数据平台交互等概念。


  本章的目标是通过解释 *为什么* 某些结果会出现在你的视图中以及 *如何* Tableau 在幕后管理数据，来增强你解读 Tableau 表现的信心。通过探索连接器、密化技术和大数据工作流，你将更好地具备排查问题和设计更可靠可视化的能力。


  Tableau 新用户通常认为令人困惑的结果是由数据质量问题引起的，但实际上它们来自 Tableau 结构化和查询数据的方式。理解这些机制将帮助你避免常见陷阱，准确诊断意外结果，并在处理小型和大型数据集时做出明智的决策。


  在本章中，我们将讨论以下主题：


  - 使用 OData 连接器

  - 介绍数据密化

  - Tableau 与大数据


  ## 技术要求


  本章将首先介绍 OData 连接器。芝加哥市像其他城市、国家或公共机构一样，公开提供数据。去看看吧；你会对能在网上找到的数据量感到惊讶。在我们的情况中，我们更加幸运，因为芝加哥市使用
  OData，这使得分析变得更加容易，因为 Tableau 拥有直接的 OData 连接器。让我们开始吧。


