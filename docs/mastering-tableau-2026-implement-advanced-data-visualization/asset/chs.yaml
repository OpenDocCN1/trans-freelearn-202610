- "# 超越基础\n\n本章的前提是，你熟悉条形图、折线图、树状图、饼图和区域图等基本图表类型，并已使用 Tableau 构建过多个图表。本章的意图是聚焦于自定义背景，这是一个你可能不熟悉的\
  \ Tableau 功能，但这功能仍然非常实用。接着，我将向你介绍 Tableau Exchange，这是一个包含扩展、加速器和连接器的平台，提供一些更奇特的图表类型。\n\
  \n也许本章最有用的部分根本不在书中，而在与本章关联的工作簿中。请务必下载该工作簿（相关章节中会提供链接），以查看各种可视化类型。\n\n本章将探讨以下可视化类型和主题：\n\
  \n- * 改进常见的可视化\n- * 自定义背景图像\n- * Tableau Exchange\n- * 扩展\n- * 加速器\n- * 连接器\n\n\
  请记住，仪表板的内容最重要，但如果你可以用更漂亮的设计呈现相同的内容，那就选择更漂亮的设计。**审美偏差**和**设计驱动消费**是真实存在的。你想要销售产品——就让它看起来更好！希望接下来的章节能帮助你找到方向，最终让你成为一名更出色的仪表板设计师。\n\
  \n## 自定义背景图像\n\nTableau 中的自定义背景图像开启了无限可能。想象一下，你可以可视化任何空间。可能性涵盖体育、医疗保健、工程、建筑、室内设计以及更多、更多领域。尽管潜力巨大，但在我看来，Tableau\
  \ 中的背景图像似乎被低估了。为什么？部分原因是生成可与背景图像配合使用的数据集比较困难。\n\n背景图像需要网格布局来精确定位 x 和 y 坐标。在下一节中，我们将讨论如何使用\
  \ Tableau 创建可叠加在图像上的网格，以即时识别与 x 和 y 坐标关联的位置，并相对快速生成可供 Tableau 访问的数据集用于可视化目的。\n\n\
  ## 创建自定义多边形\n\nTableau 原生提供多边形的地理区域包括国家、州/省、县和邮政编码/邮编。例如，这意味着可以轻松为世界各国创建填充地图。只需复制国家列表并将其粘贴到\
  \ Tableau 中。然后，将 Tableau 中的视图类型设置为 **填充地图**，并将国家列表放置在 **详细信息** 置区上。Tableau 将自动为每个国家绘制多边形。\n\
  \n此外，可能会出现特殊的映射需求，需要为通常不在地图上显示的区域绘制多边形。例如，组织可能定义不遵循常规地图边界的销售区域。最后，自定义图像也可能产生映射需求。Tableau\
  \ 作者可能将篮球场或足球场图像导入 Tableau，并绘制多边形来表示场地的特定部分。要为 Tableau 未原生提供多边形的每个示例创建填充地图，必须创建自定义多边形。\n\
  \n## 在 Null Island 周围绘制正方形\n\n在本节中，我们将从基础开始，在神话中的 Null Island 周围绘制一个简单的正方形，该岛屿位于本初子午线和赤道的交汇处。\n\
  \n我们将进入一个更稳健的示例，需要为德克萨斯州的每个城市绘制多边形。Tableau 中有一个选项，允许作者为未知位置 **在默认位置显示数据**。选择此选项将导致\
  \ Tableau 将所有未知位置的纬度和经度坐标设置为 0（零），从而在非洲西海岸约 1600 公里处的世界地图上创建一个符号。Tableau 开发者亲切地将该区域称为\
  \ Null Island。\n\n> **注意**\n>\n> Null Island 甚至有自己的 YouTube 视频：https://youtu.be/bjvIpI-1w84。\n\
  \n在此练习中，我们将在 Null Island 周围绘制一个正方形：\n\n- 1. 在 Excel 中重新创建以下数据集：\n\n| | A | B | C\
  \ |\n|---|---|---|---|\n| 1 | 点 | 纬度 | 经度 |\n| 2 | 0 | -1 | -1 |\n| 3 | 1 | -1 |\
  \ 1 |\n| 4 | 2 | 1 | 1 |\n| 5 | 3 | 1 | -1 |\n| 6 | 4 | -1 | -1 |\n\n表 8.1：示例数据集\n\
  \n- 2. 将数据集复制并粘贴到 Tableau 中。这样做后，将出现名为 Clipboard_... 的新数据源\n\n![](img/66cf6b89349fda3581a4f196cb3c98a4_329_0.png)\n\
  \n图 8.1：Null Island 坐标\n\n- 3. 从工作表中删除所有字段\n\n- 4. 将 **点** 转换为维度。可以通过右键单击 **点**\
  \ 并选择 **转换为维度**，或将其拖到 **数据** 窗格的维度部分来完成。\n\n- 5. 双击 **纬度** 和 **经度**。顺序无关紧要；Tableau\
  \ 会自动将 **经度** 放在 **列** 置区上，将 **纬度** 放在 **行** 置区上。\n\n- 6. 选择 地图 | 背景地图 | 街道。你可能需要稍微缩小以查看陆地线：\n\
  \n![](img/66cf6b89349fda3581a4f196cb3c98a4_330_0.png)\n\n图 8.2：定位 Null Island\n\n\
  - 7. 将视图类型更改为 折线，并将 点 放到 路径 置区上。你应该看到以下结果：\n\n![](img/66cf6b89349fda3581a4f196cb3c98a4_330_1.png)\n\
  \n图 8.3：定位 Null Island II\n\n- 8. 返回 Excel 文件，交换包含点 1 和点 2 数据的行，并再次将数据复制到 Tableau\
  \ 中\n\n- 9. 按照步骤 2–7 并观察生成的图像：\n\n![](img/66cf6b89349fda3581a4f196cb3c98a4_331_0.png)\n\
  \n图 8.4：错误勾勒 Null Island\n\n这张有趣但不正确的图像之所以出现，是因为点顺序不正确。经验法则是，在确定点顺序时，选择如果你在物理上绘制多边形时合理的顺序。如果你无法在纸上使用给定的点顺序绘制所需的多边形，Tableau\
  \ 也无法绘制。\n\n你可能发现完成此练习在 Tableau 中相对容易。挑战在于将数据做对，特别是多边形点。一个有用（且免费）的生成多边形数据的工具可在 http://powertoolsfortableau.com/tools/drawing-tool01\
  \ 找到。这是 InterWorks 创建的许多有助于解决常见 Tableau 挑战的工具之一。\n\n我们将在下一节使用它来展示我们图书馆中哪些书籍可用，哪些不可用。\n\
  \n## 使用多边形创建交互式书架\n\n我本人绘画技巧不太好，但我一直喜欢在 Tableau Public 上看到的花哨多边形背景，有各种形状，并且可以让 Tableau\
  \ 与之交互、根据度量值为其着色，或将操作链接到特定区域。例如，你知道吗，大陆可以重塑以构建鸡的形状？没错，尼科洛·奇罗内使用多边形制作了一个 Tableau\
  \ 仪表板：https://www.theinformationlab.co.uk/2016/06/01/polygons-people-polygon-ize-image-tableau/。\n\
  \n你也想构建花哨的仪表板，但绘画技能和我一样平庸吗？别担心！本节将为你提供实现这一目标的工具。InterWorks 开发了一个类似于数字填色的工具——这是一个无需过多绘图即可构建多边形的完美应用程序。你可以在这里找到它：https://cbstudio.interworks.com。你只需要找到一张图片，将其上传到工具中，然后沿着线条开始绘制。\n\
  \n为此次练习，我在互联网上搜索了一张书架图片：\n\n- 1. 打开 InterWorks 的免费绘图工具并选择 **图像** 选项：\n\n![](img/66cf6b89349fda3581a4f196cb3c98a4_332_0.png)\n\
  \n图 8.5：CBI Studio\n\n- 2. 上传你的图片并在 **我正在创建** 部分选择 **多边形**\n\n\n\n\n\n- 3. 现在从一本书的边缘开始并单击。会出现一个橙色点。现在转到同一书的下一个边缘并再次单击。一条线将沿着该书的边缘绘制，并且坐标会自动出现在右侧的列表中\n\
  \n![](img/66cf6b89349fda3581a4f196cb3c98a4_333_0.png)\n\n图 8.6：绘图工具\n\n- 4. 书本的最后一个点应该位于第一个点之上（第一个点比其余的大）。再次点击第一个点将最终确定第一个多边形，这由绿色表示\n\
  \n![](img/66cf6b89349fda3581a4f196cb3c98a4_333_1.png)\n\n图 8.7：最终确定多边形\n\n- 5. 你在其他位置设置的下一个点将获得不同的形状\
  \ ID，因此稍后可以被 Tableau 识别为不同的形状。请记住，沿书的外部移动并避免线条交叉。\n\n- 6. 当你完成书本轮廓绘制后，以下载 .csv 格式的数据并保存文件，以便在\
  \ Tableau 中用作数据源。我就是这样做的，此外，我添加了 **名称** 和 **可用** 列。你还可以看到唯一的形状 ID、点 ID（你在屏幕上点击的顺序），以及\
  \ x 和 y 作为图像中位置的表示。\n\n| 形状 ID | 点 ID | x | y | 名称 | 可用 |\n|---|---|---|---|---|---|\n\
