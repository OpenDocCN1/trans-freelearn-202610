  \ Tableau 在后台进行计算时所执行的操作。\n\n## 准则\n\n在本章中，我列出了一系列分区和寻址准则。以下是再次列出的快速提醒：\n\n- 不要使用\
  \ Tableau 提供的开箱即用的分区和寻址设置，包括 Table（横向）和 Pane（纵向）。强制自己点击 特定维度 并手动定义分区和寻址，以便清楚了解每个表计算是如何应用的。\n\
  - 在为表计算设置分区和寻址之前，将所有所需的维度放置在所需的架子上。\n- 在“层级”下拉菜单中不需要选择底层维度。它始终与“最深层级”相同。\n- 为表计算寻址多个维度时，寻址顺序通常会反映“行”和/或“列”架子上的维度顺序。\n\
  \n## 使用表计算的跟随练习仪表板\n\n我们将使用 FIFA 球员数据集，在跟随练习仪表板中应用你的 Tableau 知识。你将通过多个相关可视化探索球员评分、国籍、俱乐部和国家。\n\
  \n如果你尚未在第 4 章中下载以下数据集，请立即下载：\n\nhttps://www.kaggle.com/datasets/stefanoleone992/fifa-22-complete-player-dataset?resource=download\n\
  \n- 1. 在 Tableau 中，连接到 players_22.csv。\n- 2. 打开新工作表并将其命名为 Nation Overall。\n- 3.\
  \ 单击 Nationality Name 的数据类型图标，将其更改为 Country/Region：\n\n![](img/66cf6b89349fda3581a4f196cb3c98a4_244_0.png)\n\
  \n## 图 5.45：地理角色\n\n- 4. 双击 Nationality Name 创建地图：\n\n![](img/66cf6b89349fda3581a4f196cb3c98a4_245_0.png)\n\
  \n## 图 5.46：地图\n\n- 5. 将 Overall 拖动到标记卡上的 Color。\n- 6. 为 Overall 的度量选择平均值。\n\n![](img/66cf6b89349fda3581a4f196cb3c98a4_246_0.png)\n\
  \n## 图 5.47：平均值\n\n此地图按国籍提供了球员质量的高级概览。\n\n- 7. 创建第二个工作表并将其命名为 Overall by Club。\n\
  - 8. 将 Club Name 拖动到“行”。\n- 9. 将 Overall 拖动到“列”。为 Overall 的度量选择平均值。\n- 10. 排除 Null：\n\
  \n![](img/66cf6b89349fda3581a4f196cb3c98a4_247_0.png)\n\n## 图 5.48：按俱乐部划分的总评\n\n\
  你现在拥有一个按排名排列的俱乐部列表，显示哪些俱乐部拥有评分最高的球员。\n\n- 11. 创建第三个工作表并将其命名为 Player Overview。\n\
  - 12. 将 Club Name 拖动到“行”。\n- 13. 将 Long Name 拖动到“行”上 Club Name 的右侧，以创建俱乐部 → 球员层次结构。\n\
  - 14. 将 Overall、Wage Eur 和 Value Eur 拖动到“列”。\n- 15. 再次排除 Club Name = Null。\n\n![](img/66cf6b89349fda3581a4f196cb3c98a4_247_1.png)\n\
  \n## 图 5.49：球员概览\n\n此工作表提供了每个球员在其俱乐部内的详细信息。\n\n- 16. 创建第四个工作表并将其命名为 Players by Country。\n\
  - 17. 将 Nationality Name 拖动到“行”。\n- 18. 将 Overall 拖动到“列”。\n- 19. 将 Overall 的聚合方式更改为平均值。\n\
  \n![](img/66cf6b89349fda3581a4f196cb3c98a4_248_0.png)\n\n## 图 5.50：按国家/地区划分的球员\n\
  \n此工作表从另一个角度突出显示了按国籍划分的球员质量。\n\n- 20. 创建新工作表并将其命名为 Player Metrics。\n- 21. 将 Club\
  \ Name 拖动到“行”。排除 Null。\n- 22. 将 Long Name 拖动到“行”上 Club Name 的右侧，创建俱乐部 → 球员层次结构。\n\
  \n\n\n\n\n- 23. 将 **Wage Eur** 和 **Overall** 拖放到 Columns。\n\n- 24. 在 **Data** 窗格中，单击下拉箭头并选择\
  \ **Create Calculated Field**。将字段命名为 % of Club Wage。输入以下公式：SUM([wage_eur]) / TOTAL(SUM([wage_eur])).\n\
  \n- 25. 将 % of Club Wage 拖放到 Columns。\n\n- 26. 右键单击 % of Club Wage 字段，并选择 **Edit\
  \ Table Calculation...**。在 **Compute Using** 下，选择 **Pane (Down)**，以便每个俱乐部的百分比重置。通过右键单击\
  \ | **Default Properties** | **Number Format...** 将字段格式设置为百分比。\n\n![](img/66cf6b89349fda3581a4f196cb3c98a4_249_0.png)\n\
  \n图 5.51：数字格式...\n\n这可让你查看每个球员的工资与队友相比如何。\n\n- 27. 在 **Data** 窗格中单击下拉箭头并选择 **Create\
  \ Calculated Field...**。将计算命名为 **Overall vs Club Avg**。输入 AVG([overall]) - WINDOW_AVG(AVG([overall])).\n\
  \n- 28. 将 **Overall vs Club Avg** 拖放到 Columns。\n\n- 29. 单击该字段并选择 Edit Table Calculation...\
  \ 设置 Compute Using | Pane (Down)，以便为每个俱乐部分别计算窗口平均值。\n\n![](img/66cf6b89349fda3581a4f196cb3c98a4_250_0.png)\n\
  \n## 图 5.52：球员指标\n\n该指标显示每个球员的评分与其俱乐部平均评分之间的差异，让你快速了解球员在团队中的表现。\n\n现在，让我们创建一个新仪表板并将所有内容整合在一起，将其命名为：FIFA\
  \ 22 球员概览。\n\n- 30. 按以下顺序添加工作表：顶部：Nation Overall，中左侧：Overall by Club，中右侧：Player\
  \ Overview，左下角：Players by Country，右下角：Player Metrics。\n\n- 31. 将筛选器：League Name、Player\
  \ Positions、Overall Rating 和 Age 添加到某个工作表中，并为每个筛选器选择 All Using This Data Source：\n\
  \n![](img/66cf6b89349fda3581a4f196cb3c98a4_251_0.png)\n\n图 5.53：筛选器\n\n- 32. 在仪表板上使四个筛选器可见：\n\
  \n![](img/66cf6b89349fda3581a4f196cb3c98a4_251_1.png)\n\n图 5.54：仪表板\n\n在本跟随式仪表板构建练习中，你已构建了一个仪表板，演示如何在\
  \ Tableau 中使用多个视图探索 FIFA 球员数据，跨工作表应用筛选器，并按国籍、俱乐部和国家分析球员表现。\n\n## 摘要\n\n在本章中，我们探索了表计算的内部工作原理。我们首先思考表计算的分区和方向是什么。在后续章节中，我们区分了表计算的方向性和非方向性寻址，这最终引导我们来到了\
  \ Edit Table Calculation 界面，并确定它是更改分区和寻址（也称为范围和方向）的位置。在探索过程中，我们回顾了表计算函数的每个独特组，但\
  \ script_ 和 model_ 函数除外，这些内容将在第 15 章，Integrating Programming Languages 中详细介绍。\n\n\
