  \ (Origin)], [Long (Origin)]), MAKEPOINT([Lat (Destination)], [Long (Destination)]))\n\
  ```\n\n- 6. Tableau 描述显示，要基于空间位置创建点，Tableau 需要经度和纬度坐标。\n\n![](img/66cf6b89349fda3581a4f196cb3c98a4_407_0.png)\n\
