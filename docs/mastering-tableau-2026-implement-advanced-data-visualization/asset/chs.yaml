  \n## 集合操作\n\n我们将讨论的最后一种操作是集合操作。集合将数据分为两部分：内部或外部。如果根据以下列表创建名为 animals 的集合：[猫, 树,\
  \ 狗, 豹, 房子, 汽车]，则将猫、狗和豹标记为内部，将树、房子和汽车标记为外部。随后，可以将集合用作仪表板的新字段。请按以下步骤操作：\n\n- 1. 打开“Qty\
  \ & Profit”仪表板，并选择西部州加利福尼亚州、俄勒冈州和华盛顿州。请注意，弹出窗口在右上角显示两个圆环。使用此图标是创建集合的一种方法；请单击该图标。\n\
