  \n![](img/66cf6b89349fda3581a4f196cb3c98a4_475_0.png)\n\n图 10.40：集合\n\n在数据窗格中，已创建一个新字段——名为西海岸的集合。\n\
  \n- 3. 通过以下方式更改“Profit by State by Category”工作表来查看其工作原理：从“行”中移除 **州**，并改为添加 **西海岸**（您可以从筛选器卡上移除\
  \ **Cat Param**，也可以保留它；两者均可）：\n\n| 西海岸的内/外 | 类别 | |\n|---|---|---|\n| 内部 | 家具 |\
  \ $14,869 |\n| | 办公用品 | $49,109 |\n| | 技术 | $44,616 |\n| 外部 | 家具 | $3,582 |\n| |\
  \ 办公用品 | $73,382 |\n| | 技术 | $100,839 |\n\n图 10.41：设置字段状态\n\n**外部**带中的利润计算了除加利福尼亚州、俄勒冈州和华盛顿州以外的所有州，而**内部**带则显示相对于上述三个州的数字。\n\
  \n- 4. 返回“Qty & Profit”仪表板，选择 **仪表板** | **操作**，以将以下参数复制到 **集合操作**：\n\n![](img/66cf6b89349fda3581a4f196cb3c98a4_476_0.png)\n\
  \n图 10.42：集合操作参数\n\n- 5. 现在，如果单击一个或多个州，所有选定的州都将成为集合的内部组。因此，利润数字将显示您的选择与其余部分的对比，如下所示：\n\
  \n![](img/66cf6b89349fda3581a4f196cb3c98a4_476_1.png)\n\n图 10.43：集合操作仪表板\n\n- 6.\
  \ 您也可以通过单击并选择 **编辑别名**... 来重命名 **内部** 和 **外部** 值：\n\n![](img/66cf6b89349fda3581a4f196cb3c98a4_477_0.png)\n\
  \n图 10.44：编辑别名..\n\n以上便是 Tableau 的六种操作；利用 **筛选器** 和 **突出显示** 操作，可以使用户更轻松地通过下钻来查找更详细的信息。**转到工作表**\
  \ 和 **转到 URL** 操作可视为交互式按钮，将用户重定向到其他信息（无论是在网络上还是在另一张工作表上）。最后，**更改参数** 和 **更改集合**\
  \ 操作可用于调整预定义值或多个值，从而允许用户从不同角度与数据进行交互并进行分析。\n\n## 下载按钮\n\n除操作之外，用户体验的另一项内容是内置下载按钮。将此类按钮添加到仪表板，即可允许用户（如果愿意）与其他人共享图像或屏幕截图、将其用于文档或用于演示目的。添加按钮非常简单；只需按以下步骤操作：\n\
  \n- 1. 打开仪表板 `601den Rectangle`，在左下角选择 **浮动**，并将 **下载** 拖动到右上角：\n\n![](img/66cf6b89349fda3581a4f196cb3c98a4_478_0.png)\n\
  \n图 10.45：下载按钮\n\n- 2. 在演示模式下，单击新添加的按钮（非演示模式下为 Alt + 单击）；将出现“打印为 PDF”弹出窗口\n\n![](img/66cf6b89349fda3581a4f196cb3c98a4_478_1.png)\n\
  \n图 10.46：打印为 PDF\n\n- 3. 单击确定，随后即可从桌面以 PDF 形式打开仪表板\n\n就这样！只需一步，就能让许多喜欢打印输出的用户非常满意。\n\
  \nTableau 工作簿和 Tableau 仪表板可能会变得非常复杂，这取决于创建它们所使用的工作表数量。幸运的是，Tableau 提供了 **项层次结构**\
  \ 和 **使用位置** 等组织功能。\n\n## 项层次结构\n\n如前所述，在*创建可折叠菜单*部分中简要提及，如果打开*拉丁美洲人口*仪表板，您将在*布局*窗格的左下角注意到\
  \ **项层次结构**。单击 *平铺* 一词旁边的箭头，即可查看仪表板的所有不同部分以及每个容器中使用的工作表。您还可以发现容器中嵌套容器以及布局的结构：\n\n\
  ![](img/66cf6b89349fda3581a4f196cb3c98a4_479_0.png)\n\n图 10.47：展开的项层次结构\n\n请尝试在项层次结构中保持逻辑顺序。这样以后修改仪表板会更加容易。您选择哪种逻辑由您决定；我经常使用的一种逻辑是从高级到更详细、从最重要到最不重要，或者从较大的工作表到较小的工作表。有关保持仪表板整洁的精彩文章可在此找到：https://www.thedataschool.co.uk/joe-beaven/layout-containers-how-to-get-your-item-hierarchy-under-control。\n\
  \n## 使用位置功能\n\n**使用位置** 功能会显示某个工作表用于哪些仪表板。只需右键单击工作表并选择 **使用位置**：\n\n![](img/66cf6b89349fda3581a4f196cb3c98a4_479_1.png)\n\
  \n图 10.48：使用位置\n\n如果您想更改工作表，此功能特别有用。在执行之前，您可以检查哪些仪表板将受到影响，从而大大降低破坏现有仪表板的风险。\n\n\
  ## 补充内容\n\n刚开始使用 Tableau 时，我就是 Makeover Monday（https://www.makeovermonday.co.uk）的超级粉丝，现在依然如此。Makeover\
  \ Monday 是由 Eva Murray 和 Andy Kriebel 主办的一项倡议。每个周一，Tableau 社区（即您）都会获得一个附带可视化的数据集，并被要求对其进行改进。数据示例可能来自报纸或网站。随后，参与者将分析数据集、构建仪表板，并使用标签\
  \ #makeovermonday 在 Twitter 上发布该版本。如果您将社区的工作与原始工作进行比较，您肯定会了解哪些仪表板效果最好以及您偏好哪些设计，从而逐渐发展出自己的风格，尤其是在参与时。\n\
  \nMakeover Monday 前几年的经验总结在一本同名书中。2022 年，Makeover Monday 暂停了一段时间，但现在以略有不同的形式回归，由\
  \ Andy 独立主导。请查看；非常值得。以下是一些示例以及我解释其有效性的原因；您将认识到我们在本章中讨论过的规则（我将把这些规则放在括号中）：\n\n第一个示例发表在\
  \ *卫报* 上，展示了 2020 年 1 月英国出口商品的下降。\n\n数据链接：https://data.world/makeovermonday/2021w13。\n\
  \n![](img/66cf6b89349fda3581a4f196cb3c98a4_480_0.png)\n\n图 10.49：英国出口\n\n\n\n\n\n\
  ## 什么方法有效？\n\n使用折线图（规则：保持可视化简单）来展示时间序列数据是个好主意。我也喜欢这条线是红色的（规则：颜色的心理暗示），因为可视化展示的是负面信息，即出口额的急剧下降。Y轴显示这些变化的货币价值，让我作为用户了解绝对损失。\n\
  \n现在让我们看看Makeover Monday的朋友们做出了什么：\n\nKimberly Furdell创建了图10.51所示的图表，在不再继续阅读之前，请问自己，与原始可视化相比有哪些不同，你更喜欢哪一个，为什么？\n\
  \nLink to the visualization: https://public.tableau.com/app/profile/kimberly.furdell/viz/UKexportstoEU_16172321299550/Dashboard1.\n\
  \n![](img/66cf6b89349fda3581a4f196cb3c98a4_481_0.png)\n\n图10.50：脱欧出口\n\n## 为什么效果更好\n\
  \n《卫报》发表的文章围绕2021年1月相比2020年1月出口额下降40%展开叙述。原始可视化中并未清楚表明该数字与前一年相关，而Kimberly的可视化中包含足够信息，无需阅读全文即可理解（规则：最大化仪表板上的文档）。为了进一步支持叙事，Kimberly对图表进行了出色的修改。\n\
  \n此可视化效果更好，因为Y轴显示百分比。现在，你可以清楚地看到2021年1月的下降比2020年的下降更严重，而由于绝对值的特性，在原始图表中两者看起来相似。将时间序列数据延伸更多年份，强调了这些发展超出了过去几年的范围。她仪表板上的灰色线条代表各种出口类别，因此，为总数使用面积图，为细节使用不太显眼颜色的折线图是个好主意（规则：呈现密集信息，谨慎使用纯色）。标明此期间事件的参考线使故事完整（规则：讲述故事）。最后，好奇哪个类别对出口额急剧下降贡献最大的用户，可以从下拉菜单中选择第二个视图，即水平条形图（设计：工作表交换）。\n\
  \n接下来，我们将探讨另一个Makeover Monday挑战以及两个做得更好的示例。\n\n这一次，我们关注不同知名连锁店各种咖啡的咖啡因含量。该文章和数据最初发布于www.which.co.uk。\n\
  \nLink to the challenge: https://data.world/makeovermonday/2023w9.\n\n在这里你可以找到原始可视化，依我看来，它并不算差：\n\
  \n## 高街咖啡咖啡因含量对比\n\n| | 单份浓缩咖啡 | 卡布奇诺 | 滴滤/冲泡咖啡 |\n|---|---|---|---|\n| Caffè Nero\
  \ | 45mg (30ml) | 110–115mg (355ml) | n/a |\n| Costa (Signature blend) | 100mg (30ml)\
  \ | 325mg (362ml) | n/a |\n| Greggs | 75mg (28ml) | 197mg (341ml) | 225mg (341ml)\
  \ |\n| Pret | 180mg (30ml) | 180mg (350ml) | 271mg (350ml) |\n| Starbucks | 33mg\
  \ (25ml) | 66mg (350ml) | 102mg (350ml) |\n\n*咖啡因含量（mg）（饮品容量 ml）*\n\n图10.51：咖啡\n\
  \n## 什么方法有效？\n\n咖啡杯图片很好；无需查看表格或阅读标题，你就会知道这个可视化是关于咖啡的。它会吸引你的注意。颜色使用有限，但背景不是我最喜欢的；蓝色很抢眼但与主题无关，且对眼睛有点刺眼。不过，表格很好用；很容易比较每个品牌的不同饮品以及不同品牌的相同饮品（规则：保持简单和稳健）。\n\
  \n同时显示咖啡因含量和毫升数几乎信息过多，可以进行更好的归一化处理。但让我们看看Tableau社区做出了什么。\n\n这个第一个示例，图10.53，由Will\
  \ Sutton发布。他创建了一个故事，每一页都是改进版的一步。多么棒的主意！\n\nLink to the visualization: https://public.tableau.com/app/profile/wjsutton/viz/HighStreetCaffeine/ImprovingabarchartMakeoverMonday2023Week9.\n\
  \n### 改进Tableau中条形图的默认视图\n\n![](img/66cf6b89349fda3581a4f196cb3c98a4_483_0.png)\n\
  \n### Pret拥有最强的单份浓缩咖啡\n\n### 注释\n\n![](img/66cf6b89349fda3581a4f196cb3c98a4_483_1.png)\n\
  \n摄入超过600mg的咖啡因，相当于3倍以上Pret单份浓缩咖啡，可能导致失眠和血压升高等健康风险。\n\n在图表中添加注释可以邀请读者了解更多。这里我将180置于语境中，我的读者可能不知道180mg咖啡因是否算大量。\n\
  \n通过快速谷歌搜索，我发现超过600mg会有一些危险的副作用，因此我对此进行了标注，并将其置于语境中，说明这相当于多少杯Pret浓缩咖啡。\n\n这使读者能够进一步探索数据，例如Starbucks浓缩咖啡弱多少，或考虑他们自己的购买决策。\n\
  \n作者：Will Sutton | 来源：Which.co.uk 2023年2月 | 注：Costa指其招牌混合咖啡\n\n图10.52：注释\n\n## 为什么效果更好\n\
  \n其效果更好的一部分可以从水平条形图旁看到；数字被置于了语境中（规则：讲述故事）。除此之外，Will将表格改为非常简单的条形图；他只关注一种饮品，并以深红色标出浓缩咖啡，标明最高可能的健康风险（规则：制作简单稳健的仪表板，使用简单颜色）。他带领用户了解一个故事，而原始表格则为语境和未知问题的答案留下了大量空间。\n\
  \n但我还会向你展示一个包含所有咖啡连锁店和所有饮品的重做版本；接下来这个由Gabriela Comanescu制作。\n\nLink to the visualization:\
  \ https://public.tableau.com/app/profile/gabriela.comanescu/viz/HowmuchcaffeineisinyourcoffeeMakeoverMonday/Coffee.\n\
  \n![](img/66cf6b89349fda3581a4f196cb3c98a4_484_0.png)\n\n图10.53：咖啡因\n\n## 为什么效果更好\n\
  \nGabriela采用了原始文章的主题，使用咖啡图片来吸引用户注意。不过，她使用逼真的咖啡豆图片作为可视化的背景，而不是插图。她的颜色选择非常简单；字体保持为米白色，这几乎可以是咖啡上的牛奶（规则：使用简单颜色）。但我最喜欢的是她对数据进行了归一化。对于所有饮品，她显示每100毫升的咖啡因含量（mg）。这使得每种饮品都可比较，因此将每种饮品都绘制为圆形条形图是合理的。几秒钟内，用户就能发现每种饮品中咖啡因含量最高的，并能相互比较。使用圆形条形图是天才之举，因为在我看来，这就像在搅拌咖啡（规则：制作简单稳健的仪表板，呈现密集信息，以及颜色的心理暗示）。\n\
  \n这就是我对Makeover Monday的看法，我希望到现在你也成了粉丝。如果你在推特上发布任何给定数据集的你的版本，请标记#MasteringTableau，这样本书的读者和我就可以查看你的作品。\n\
  \n最后但同样重要的是，我强烈推荐的另一个页面是Visual Capitalist（https://www.visualcapitalist.com）。其仪表板设计得如此完美，你真的应该尝试向它们学习。\n\
  \n## 跟随练习仪表板\n\n在本章的跟随练习中，我们将做点不同的事情。我们将拿一个因设计受到赞誉的仪表板作为示例，尝试重做一个更简单的版本。选定的仪表板来自Ryan\
  \ Sleeper，名为Super Sample Superstore。你可以在这里找到：https://www.tableau.com/data-insights/dashboard-showcase/superstore。但现在，让我们重做它，以便从这部杰作中学习。\n\
  \n我们将构建一个包含以下内容的仪表板：顶部筛选栏、三个KPI磁贴（销售额、利润率、平均发货天数）、按州划分的销售额地图以及销售额随时间变化趋势。\n\n- 打开Tableau\
  \ Desktop。\n- 连接到Sample Superstore数据集。\n- 将Orders表拖动到画布上。\n- 我们现在将模仿Sample Superstore仪表板中的KPI：销售额、利润率和平均运输时间。\n\
  \n- 打开一个新工作表，创建一个计算字段，并将默认数字格式设置为百分比：\n\n```\nProfit Ratio = SUM([Profit]) / SUM([Sales])\n\
  ```\n\n- 创建另一个计算字段：\n\n```\nShipping Days = DATEDIFF('day', [Order Date], [Ship\
  \ Date])\n```\n\n- 我们现在将构建三个单独的KPI工作表，然后将它们排成一行。打开一个新工作表并将其命名为KPI – Sales\n\n- 将Sales拖动到标记卡上的Text\n\
  \n- 将标记类型更改为Text\n\n- 单击Text，然后单击三个...在新窗口中，输入SUM(Sales)并在其后输入Sales\n\n- 将SUM(Sales)格式化为更大的字体（例如20–28pt）并将其加粗，对单词Sales使用例如15–20。\n\
  \n![](img/66cf6b89349fda3581a4f196cb3c98a4_485_0.png)\n\n图10.54：编辑标签\n\n\n\n\n\n\
  - 11. 设置 SUM(Sales) 格式：\n  - 在“数据”窗格中右键单击字段 | 默认属性 | 数字格式...\n  - 选择“货币(自定义)”，0\
  \ 位小数\n\n现在你有了这个：\n\n![](img/66cf6b89349fda3581a4f196cb3c98a4_486_0.png)\n\n图 10.55：KPI\
  \ - 销售额\n\n- 12. 复制工作表（右键单击 KPI – 销售额 | 复制）\n- 13. 重命名为 KPI – 利润率\n- 14. 将“标记”卡上“文本”处的度量值替换为：\n\
  \  - 将 利润率 拖到“文本”货架，替换掉 销售额\n  - 设置 利润率 格式：默认属性 | 数字格式 | 百分比，1 位小数\n- 15. 将标签更改为显示：<AGG(Profit\
  \ Ratio)> 利润率\n\n- 16. 再次复制并重命名为 KPI – 发货天数\n- 17. 将度量值替换为 AVG([Shipping Days])\n\
  - 18. 格式设置为带 1 位小数的数字，并将标签文本更改为：<AVG(Shipping Days)> 平均发货天数\n- 19. 打开新工作表\n- 20.\
  \ 将其重命名为 销售趋势\n- 21. 将 订单日期 拖到“列”\n  - 右键单击并选择“月份”\n- 22. 将 销售额 拖到“行”\n- 23. 选择标记类型：折线\n\
  \n| | 列 | MONTH(Order Date) |\n| --- | --- | --- |\n| | 行 | SUM(Sales) |\n\n![](img/66cf6b89349fda3581a4f196cb3c98a4_487_0.png)\n\
  \n图 10.56：销售趋势\n\n- 24. 创建另一个新工作表并将其重命名为 Map – 按州划分的销售额\n- 25. 将 州/省份 拖到“详细信息”\n\
  - 26. 将 销售额 拖到“颜色”\n- 27. 将颜色设置为单个发散调色板（例如，从浅到深）。\n- 28. 将 区域 和 细分 拖到“筛选器”货架\n\n\
  ![](img/66cf6b89349fda3581a4f196cb3c98a4_488_0.png)\n\n图 10.57：Map – 按州划分的销售额\n\n\
  - 29. 单击“新建仪表板”\n- 30. 将大小设置为自动\n- 31. 将水平布局容器拖到仪表板顶部\n- 32. 将空白对象拖入容器\n- 33. 将文本对象拖到该空白对象上方并键入：\n\
  \  - 超级商店绩效概览\n  - 将背景设置为青色，字体设置为白色、粗体、16–20 pt\n- 34. 在标题下方，拖入另一个水平容器。\n\n- 35.\
  \ 将工作表 Map – 按州划分的销售额 暂时拖入仪表板。\n- 36. 选择“筛选器”| 订单日期的月份。\n- 37. 右键单击筛选器控件（在仪表板上）|\
  \ 应用到工作表 | 使用此数据源的所有工作表。\n- 38. 还选择“多值(下拉列表)”。\n- 39. 对“国家/地区”、“区域”和“细分”筛选器执行相同操作。\n\
  - 40. 将筛选器控件排列在该水平容器中，以制作整洁的“筛选器行”，然后如果需要可以删除临时工作表。使用“均匀分布内容”功能实现完美对齐。\n- 41. 在筛选器下方拖入一个水平容器。\n\
  - 42. 将每个 KPI 工作表拖入此容器：\n  - KPI – 销售额\n  - KPI – 利润率\n  - KPI – 发货天数\n\n此行应感觉像是仪表板主体顶部整齐的三个“卡片”。\n\
  \n- 43. 在 KPI 行下方拖入一个垂直容器\n- 44. 在其中拖入：\n  - Map – 按州划分的销售额 (顶部)\n  - 销售趋势 (底部)\n\
  - 45. 通过拖动它们之间的分隔线调整相对高度\n- 46. 确保提示信息整洁且信息丰富\n\n为保持与原始 Super Sample Superstore\
  \ 设计一致（该设计因其简洁的企业风格而受到赞扬），请进行最终检查：\n\n- 一致性：所有视图中使用相同的字体和颜色。\n- 空白与对齐：使用布局容器使内容整齐排列在网格中，避免出现随意的间隙。\n\
  - 有意义的颜色：蓝灰色主题；仅在需要突出重要内容（例如负利润）时才使用亮色强调色。\n- 最小化杂乱：删除不必要的网格线、边框和图表垃圾。\n\n我做了一些美观上的更改，我的最终仪表板如下所示：\n\
  \n## 超级商店绩效概览\n\n## 关键绩效指标\n\n$2,326,534 销售额   12.6% 利润率   4.0 平均发货天数\n\n## Map\
  \ - 按州划分的销售额\n\n![](img/66cf6b89349fda3581a4f196cb3c98a4_490_0.png)\n\n## 销售趋势\n\
  \n![](img/66cf6b89349fda3581a4f196cb3c98a4_490_1.png)\n\n图 10.58：仪表板\n\n这个跟随练习很有价值，因为它不仅教你如何复制一个精美的仪表板，还解释了每个设计选择的重要性，帮助你培养创建清晰、有效且专业的\
  \ Tableau 仪表板所需的实用技能和视觉判断力。\n\n## 摘要\n\n我们在本章开头探讨了可视化设计理论。我们研究了格式规则、颜色规则，以及哪些可视化类型应该使用、哪些应该避免。我们还探讨了当最终用户表达相互冲突的设计目标时如何进行妥协。然后，我们讨论了仪表板设计原则。我们介绍了三种流行的布局：黄金矩形、四宫格和小多图。\n\
  \n之后，我们探讨了如何将工作表选择技术作为良好设计的助力。具体来说，我们探讨了如何允许最终用户选择要查看的可视化类型，以及如何隐藏和显示筛选器，以充分利用屏幕空间。接下来，我们讨论了操作和下载按钮以提供更好的用户体验，以及项目层次结构和“用于”功能，这对于组织仪表板非常有用。这反过来又将有助于改善布局设计。最后，为了结合所学的所有内容，我们分析了三个\
  \ Makeover Monday 仪表板，并根据先前讨论的规则解释了它们为什么有效。\n\n在下一章中，我们将关注用例。从数据集到产品将是主题，我们将练习使用（其中包括）地理空间数据来实现这一点。你从前几章获得的知识将非常有用！\n\
