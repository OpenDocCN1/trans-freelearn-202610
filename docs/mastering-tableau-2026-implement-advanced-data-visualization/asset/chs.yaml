- "# 练习 Level of Detail 计算\n\n当我们谈论 Tableau 中的 **Level of Detail (LOD)** 计算时，我们指的是三个表达式：FIXED、INCLUDE\
  \ 和 EXCLUDE。这三个表达式通过提供创建针对特定粒度级别的计算的能力，为我们打开了一个充满选择的世界。在较旧版本的 Tableau 中，工作表的数据粒度由视图中的维度确定。如果视图包含\
  \ Region、State 和 Postal Code 等维度，但作者想要创建 City 级别的计算，则需要将 City 维度包含在视图中。此外，没有机制在视图中排除或忽略给定的\
  \ **dimension**。诚然，所需结果通常可以通过表计算、数据混合等复杂且有时难以理解的用法来实现。幸运的是，LODs 大大简化了这些用例场景，并在某些情况下使以前不可能实现的事情成为可能。\n\
  \n在本章中，我们将讨论以下主题：\n\n- * 介绍 LODs\n- * 使用 FIXED 和 EXCLUDE 函数\n- * 使用 INCLUDE 函数\n\
  - * 构建使用 LOD 的实际应用\n\n本章的早期部分更多基于理论，但请不要担心——您将在 _构建使用 LOD 的实际应用_ 部分以实际方式探索这些概念。让我们先从介绍\
  \ LODs 及其使用方法开始。\n\n> > **注意**\n> > \n> > 您的购买包含一份免费的 PDF 副本和独家额外内容。\n> > \n> >\
