- '# 13 探索 Tableau Server 和 Tableau Cloud


  Tableau Server 和 Tableau Cloud 是用于共享、分发和协作处理在 Tableau Desktop 和/或 Tableau Public
  中创建的内容的在线解决方案。它们的优势包括提供一个环境，最终用户可以在其中安全地查看、探索和刷新实时和计划的数据可视化。Tableau Server 和 Tableau
  Cloud 之间的主要区别在于，Tableau Server 需要由您进行维护，而 Tableau Cloud 由 Tableau 在云中完全托管，并由 Amazon
  Web Services (AWS) 基础设施支持。为便于阅读，我们将统一将两者称为 Tableau Server。


  本章范围仅限于 Tableau Desktop 作者与 Tableau Server 的交互。安装和升级、身份验证和访问、安全配置以及命令行实用程序等主题与 Tableau
  Desktop 作者与 Tableau Server 的交互无关，因此未包含在本章中。


  > 注意

  > 不过，帮助文档非常出色。还可以观看 Tableau Software 关于 Tableau Server 的一些视频（例如，https://www.youtube.com/c/tableausoftware/search?query=Tableau%20Server）。如果您对此处列出的任何主题或其他任何
  Tableau Server 主题有疑问，请务必访问在线帮助网站 https://www.tableau.com/support/help。


  本章将探讨以下主题：


  - 将数据源发布到 Tableau Server

  - Tableau 文件类型

  - Web 创作

  - 在 Tableau Server 上维护工作簿

  - Tableau Server 设置和功能

  - 2026.1 版中的新增功能


  Tableau Server 是将贵公司的 Tableau 采用提升到更高水平的绝佳方式。您心中最重要的问题可能是：如何将 Tableau 仪表板从 Desktop
  迁移到 Server？这正是我们将在第一部分向您展示的内容。


  注意


  您的购买包含一份免费 PDF 副本和独家额外内容。


  您的购买包含本书的 DRM-free PDF 副本、Packt+ 图书馆 7 天试用（无需信用卡）以及其他独家额外内容。请参阅前言中的“随书附赠权益”部分，即可立即解锁并最大化您的学习效果。


  ## 将数据源发布到 Tableau Server


  因此，您购买了 Tableau Desktop，成为了一名专业的仪表板开发人员，现在想与同事分享您的工作。他们是否都需要 Tableau Desktop 许可证和安装才能查看您的可视化内容？幸运的是，答案是：不需要！共享
  Tableau 仪表板的最佳方式是通过 Tableau Server。这样一来，您的同事只需要 Tableau Server 查看许可证，这比开发人员许可证便宜得多，并且他们可以完全与您构建并上传到
  Server 的仪表板进行交互。有关 Tableau Server 许可模型中不同角色的详细说明，可以在此处找到：https://help.tableau.com/current/server/en-us/license_manage.htm。


  但是，如何将仪表板从 Desktop 上传到 Server 呢？让我们查看以下步骤，了解如何将数据源发布到 Tableau Server：


  1. 导航至 https://github.com/PacktPublishing/Mastering-Tableau-2026/tree/main/Chapter13
  以查找并下载与本章关联的工作簿

  2. 导航至“发布”工作表

  3. 确保数据源为 My Superstore

  4. 如果尚未登录，请通过单击 Server | Sign In... 登录到您的 Tableau Server 实例：


  ![](img/66cf6b89349fda3581a4f196cb3c98a4_580_0.png)


  图 13.1：Server—Sign In...


  5. 在“数据”窗格中，选择 My Superstore 数据源

  6. 选择 Server | Publish Data Source | My Superstore：


  ![](img/66cf6b89349fda3581a4f196cb3c98a4_581_0.png)


  图 13.2：Server–Publish Data Source


  7. 在弹出的对话框中，输入所需的设置


  如果您的 Tableau Server 上有不同的项目，可以选择将数据源发布到哪个项目。如果需要，也可以更改名称或添加说明，这非常有用，尤其是在您有很多不同的数据源，并希望用户能够查找所需数据源的情况下。通过添加标签，您将添加一个元数据层，使
  Tableau Server 用户能够根据标签搜索特定数据源。您还可以更改权限。您的设置可能是不同用户属于不同的组，因此在这里您可以选择哪个组拥有哪些权限。最后，您可以立即连同数据源一起上传工作簿，这样两者都可在
  Tableau Server 上使用。


  ## 了解 Tableau Server 权限层次结构


  Tableau Server 中的权限遵循层次结构。了解此层次结构是正确设置访问权限并避免用户无法看到预期内容时产生混淆的关键。


  权限层次结构（从高到低）：


  | 级别 | 它控制的内容 | 示例 |

  |---|---|---|

  | Server | 对整个 Tableau Server 实例的全局访问权限 | 谁可以登录 |

  | Site | 对特定站点的访问权限（如果存在多个站点） | 谁可以查看“销售”站点？ |

  | Project | 对项目中所有内容的访问权限 | 谁可以查看“财务”项目文件夹？ |

  | Content | 对单个工作簿、数据源或流的访问权限 | 谁可以编辑“管理仪表板”？ |


  表 13.1：权限层次结构


  此结构依赖于继承原则，即在较高级别设置的权限会自动向下传递到较低级别；例如，向用户授予项目文件夹的查看访问权限，自然也会授予其对其中所有工作簿的查看访问权限。您可以通过使用覆盖来细化此流程，以针对特定项目打破继承关系，但请记住，**拒绝**规则始终优先——如果在任何一点拒绝用户访问，它将覆盖所有其他授予，以防止意外数据泄露。这种逻辑使您能够处理各种实际场景，例如确保财务团队仅查看其特定项目，允许分析师编辑工作簿而不更改数据源，或将外部顾问隔离在其自己的专用项目中。为保持系统整洁且易于管理，您应始终将权限分配给组而不是个人，并努力在尽可能高的级别授予访问权限，而不是覆盖每个单独的文件。当您需要验证设置是否正常工作时，可以导航到某个内容，单击“权限”选项卡，并搜索特定用户以查看其
  *有效权限*，这将显示在应用所有层次结构规则后他们确切可以执行的操作。通过遵循这些原则并使用专用帐户进行测试，您可以确保一个安全且有据可查的环境，以符合您组织的需求。


  ## Tableau 文件类型


  我们将通过考虑各种 Tableau 文件类型来继续讨论 Tableau Server。这看起来可能是一个令人意外的讨论位置，但随着您的阅读，您会发现，清晰地了解文件类型为
  Tableau Desktop 作者提供了与 Tableau Server 高效且有效地交互所需的基础知识。


  之前讨论过的、与了解如何与 Tableau Server 交互相关的文件类型将进行深入探讨。与了解 Tableau Server 无关的文件类型将仅进行简要介绍。某些文件类型（例如，与许可证激活相关的文件类型）将不予讨论。


  ## Tableau 数据源


  让我们来看看 Tableau 中可用的各种数据源。请看以下 Tableau 数据文件：假设您已构建到公司 SQL 数据库的完美连接。您已定义计算字段，为清晰起见重命名了列，并设置了默认聚合。您希望组织中的每个分析师都使用同一个“真理来源”，而无需从头重新构建。.tds
  文件正是如此。


  - 文件格式类型：XML

  - 包含的内容：元数据。

  - 为何有用：.tds 文件很重要，因为它允许 Tableau 作者定义默认格式和聚合、计算字段、数据类型、字段类型等。此外，.tds 文件可以发布到 Tableau
  Server，从而供环境中的其他作者访问。这实际上使 .tds 文件成为一个“手册”，确保整个组织的一致性。此重要功能将在 Tableau Server 架构部分中更充分地探讨。

  - 如何生成：可以通过在“数据”窗格中右键单击数据源并选择 **添加到已保存的数据源...**，然后在弹出的对话框中选择 **Tableau 数据源** 来生成
  .tds 文件。此外，还可以通过 **Server | 发布数据源 | [数据源]** 在发布到 Tableau Server 时生成 .tds 文件。**将数据源发布到
  Tableau Server** 部分演示了如何发布 .tds 文件以及 .tdsx 文件。

  - 如何访问：通常在以下两个位置之一访问 .tds 文件类型。首先，它可以存储在 **我的 Tableau 存储库 | 数据源**。存储在此目录中时，.tds
  文件将在开始页面左侧的 **已保存的数据源** 部分下显示。.tds 文件通常的第二个位置是



  存储在 Tableau Server 上。导航到 **数据 | 新建数据源** 并选择 **Tableau Server** 可让 Tableau 作者指向已发布到
  Tableau Server 的 .tds 和 .tdsx 文件。


  ## Tableau 数据源包


  如果您需要与无法直接访问公司数据库的某人共享数据源（例如，外部顾问或离线工作的同事），.tdsx 文件将元数据和数据快照打包成一个任何人都可以使用的单个压缩文件。查看以下
  Tableau 数据文件详细信息：


  - 文件格式类型：压缩。

  - 它包含的内容：元数据和数据提取。

  - 它有用的原因：.tdsx 文件很有用，因为它既可用于访问元数据，也可用于访问数据。Tableau 作者可以将位于 Tableau Server 上的 .tdsx
  文件作为数据源访问，从而消除了工作簿直接连接到外部数据源的需求。已发布的 .tdsx 文件可以按计划放置，以便从基础数据源定期更新。

  - 它是如何生成的：可以通过在数据窗格中右键单击数据源并选择 **添加到已保存的数据源...**，然后在弹出的对话框中选择 **Tableau 数据源包** 来生成
  .tdsx 文件。与 .tds 文件一样，.tdsx 文件也可以通过 **服务器 | 发布数据源 | [数据源]** 发布到 Tableau Server 时生成。有关更多详细信息，请参阅下一个练习部分。

  - 如何访问它：.tdsx 文件的访问方式与 .tds 文件相同。首先，它可以存储在 **我的 Tableau 存储库 | 数据源**。存储在此目录中时，.tdsx
  文件将显示在开始页面左侧的 **已保存的数据源** 部分下。存放 .tdsx 文件的第二个位置通常是在 Tableau Server 上。选择 **数据 | 新建数据源**
  并选择 **Tableau Server** 可让 Tableau 作者指向已发布到特定 Tableau Server 实例的 .tds 和 .tdsx 文件。


  ## Tableau 工作簿


  除了数据源，还有 Tableau 工作簿。如果您正在构建一个连接到频繁更新的实时数据库的仪表板（例如，实时销售仪表板），您希望仪表板始终显示最新数据，而无需手动刷新。.twb
  文件仅存储可视化架构（“蓝图”），不包含任何数据，从而保持文件小巧且响应迅速。查看以下 Tableau 数据文件详细信息：


  - 文件格式类型：XML

  - 它包含的内容：元数据和架构。架构定义工作簿中的可视化。请注意，在此上下文中，架构是指定义工作簿可视组件的 XML，包括工作表上显示的可视化以及仪表板和故事的布局。

  - 它有用的原因：.twb 文件类型是 Tableau 作者最常用的文件类型。它是创建指向实时数据集的可视化所必需的。因此，实时解决方案将使用此文件类型。

  - 它是如何生成的：.twb 文件通过 文件 | 另存为 创建，然后在弹出的对话框中选择 .twb 文件类型。

  - 如何访问它：.twb 文件可以通过 Tableau Desktop 打开，或通过指向 Tableau Server 实例的浏览器访问。由于 .twb 文件是
  XML，可以通过文本编辑器打开、查看和更新。


  ## Tableau 工作簿包


  如果您需要与无法访问您数据源的人共享完整的仪表板（例如，将销售报告发送给客户，或在没有互联网连接的会议上进行演示），.twbx 文件将所有内容（可视化、数据和任何图像）打包成一个自包含的文件，可离线工作。查看以下
  Tableau 数据文件详细信息：


  - 文件格式类型：压缩。

  - 它包含的内容：元数据、架构，以及可选的一个或多个数据提取。

  - 它有用的原因：.twbx 文件类型是使用 Tableau Reader 所必需的。它还可以有效地与 Tableau Server 一起使用，以访问 Tableau
  Server 不直接连接的数据源，例如平面文件和 Microsoft Excel 和 Access 文件。.twbx 文件的缺点将在下文讨论。

  - 它是如何生成的：.twbx 文件通过 文件 | 另存为 创建，然后在弹出的对话框中选择 .twbx 文件类型。

  - 如何访问它：.twbx 文件可以通过 Tableau Desktop 打开，或通过指向 Tableau Server 实例的浏览器访问。由于 .twbx 文件是压缩文件，也可以通过压缩实用程序（例如
  WinZip 或 7-Zip）解压缩。


  现在您了解了不同的 Tableau 文件类型以及何时使用每种类型，您可能在想：“将工作发布到 Tableau Server 后会发生什么？我每次需要更改时是否都必须下载工作簿，在
  Tableau Desktop 中编辑，然后重新发布？”答案是否定的。而这就是 Web 创作发挥作用的地方。Web 创作允许您直接在浏览器中编辑已发布的工作簿，而无需打开
  Tableau Desktop。当您需要快速调整、与队友协作，或在未安装 Tableau Desktop 的计算机上工作时，这尤其有价值。让我们探讨一下它的工作原理。


  ## Web 创作


  将仪表板发布到 Tableau Server 后，如何对其进行编辑呢？Tableau 提供了两种选项。第一种选项是，您和所有有权访问并有权下载仪表板的其他人都可以下载它，在
  Tableau Desktop 中编辑它，然后通过新上传覆盖 Tableau Server 上的最新版本。另一种选项是在 Server 上实时编辑仪表板。此功能称为
  Web 创作。Web 创作是 Tableau Server 的一项功能，提供了与 Tableau Desktop 类似的创作界面。最初，Web 创作界面功能有限，但每个版本都会引入更多功能。因此，Tableau
  Server Web 创作环境与 Tableau Desktop 之间的功能差距已缩小。Web 创作环境提供了强大的功能来创建和应用表计算，并提供了创建仪表板的功能。


  撰写本文时，Tableau Server Web 创作环境中仍缺少一些功能，但以下链接将为您提供当前可用功能的概览，对比 Tableau Desktop 和 Tableau
  Server Web 创作功能：https://help.tableau.com/current/pro/desktop/en-us/server_desktop_web_edit_differences.html。


  接下来，两个非常简短的练习将演示如何访问 Tableau Server 中的创作环境。请记住，Tableau Server 管理员需要授予用户相应权限才能执行此操作。


