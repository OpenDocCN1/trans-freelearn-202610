- "# Tableau 2026 高级指南：实现高级数据可视化、BI 技术和 AI 驱动的分析\n\n\n\n\n\n![](img/66cf6b89349fda3581a4f196cb3c98a4_0_0.png)\n\
  \n## 序言\n\n生成式 AI 让许多人对 Tableau 等工具感到紧张。“AI 不会直接为我们构建仪表板吗？”我经常听到这种说法。说实话，对于简单的图表，也许会。但数据可视化从来不仅仅是关于构建图表。它关乎沟通。它关乎理解某人需要看到什么、为什么需要看到它，以及看到之后会做什么。AI\
  \ 可以生成柱状图。它无法在利益相关者会议上坐下来，弄清楚哪些问题才真正重要。那种判断力需要练习。它需要系统化的学习。而这正是本书的用途。\n\n《精通 Tableau》涵盖了非常广泛的内容。你从你预期的地方开始：工作表、仪表板、数据连接，以及经常让比应有范围更多的人绊倒的连续/离散区分。但它不会止步于此。关于数据准备和\
  \ Tableau Prep Builder 的章节有力地提醒我们，可视化之前的工作往往决定了当有人不可避免地问到一个你未计划的问题时，分析是否经得起考验。连接、混合、关系、数据垫片：这些在这里都得到了妥善处理，而不仅仅是一笔带过。\n\
  \n表计算章节是我特别想推荐给大家的一个。分区和寻址逻辑是大多数 Tableau 用户知道存在，但很少真正感到自如的主题之一。这里的方法，通过一、二、三维的游乐场建立直觉，正是我希望更多人学习它的方式。层次详细度计算也得到了类似深度的讲解。FIXED、INCLUDE\
  \ 和 EXCLUDE 全都基于 Tableau 的计算顺序，这比大多数人意识到的要重要得多。\n\n还有许多 Tableau 资源默默跳过的主题。数据密化。域完成和填充。自定义多边形。空间连接。集成\
  \ R 和 Python。性能调优。甚至有一节关于在 Tableau 中分析国际象棋比赛的内容，这种创造性的延伸会提醒你这个工具实际上有多灵活。\n\n设计章节将一切汇集在一起：格式规则、色彩理论、布局模式，以及从筛选器操作到集合操作的每种操作类型的演示。以及关于\
  \ Tableau Server、Cloud 和数据治理的结尾部分，确保你思考你的工作如何超越桌面。\n\n我制作了 600 多个 Tableau 视频。快速教程可以让你入门。但如果你想理解这个工具，拥有知道何时以及如何使用产品以及何时不使用的直觉，你需要更全面的东西。\n\
  \n这就是那本书。\n\n*蒂姆·恩格韦纳*\n\n内容创作者，五次 Tableau 首席专家和分析顾问\n\n## 贡献者\n\n### 关于作者\n\n玛琳·迈尔是一位成就卓著的数据策略家、作者和治理领导者，热衷于将复杂数据转化为值得信赖的可操作洞察。她将传统分析方法与机器学习、AI\
  \ 和代理分析等现代方法相结合。\n\n目前在瑞士再保险行业工作，玛琳担任数据治理负责人，她致力于通过强大的数据治理框架推动包括 AI 在内的数据计划。在这一职位上，她确保数据不仅可访问且高质量，而且可信且合规。她相信，没有可靠数据，最精巧的（AI）模型也是无用的，她每天都在努力弥合这一差距。\n\
  \n玛琳曾在德国、荷兰、美国、新加坡以及现在的瑞士等多个国家生活和工作，为她的工作带来了真正的全球视野。她跨文化的多样化经历塑造了她的协作和解决问题的方法。\n\
  \n玛琳的奉献精神、专业知识以及推动数据分析边界的承诺，使她成为该领域值得信赖的权威。通过她的写作、演讲活动以及在 Tableau 社区中的积极存在，她旨在赋予个人和组织力量，释放其数据资产的全部潜力。\n\
  \n当她不处理数据时，玛琳喜欢玩桌游。\n\n*致我的丈夫和女儿：感谢你们一直为我加油，包容我的深夜和忙碌的周末，却始终支持我。我爱你们俩。#lounicrew*\n\
  \n### 关于审稿人\n\n露奇·阿罗拉是一位全球公认的数据和 AI 高管，以将复杂的数据生态系统转化为战略业务价值而闻名。作为百时美施贵宝全球患者运营部门的数据分析与报告负责人，她推动安全的\
  \ AI 赋能平台，加速患者获取疗法，并大规模实现数据驱动的决策。\n\n她的职业生涯包括在微软、Salesforce 和星巴克的领导职务，在那里她领导了企业数据战略、治理和分析创新，包括担任\
  \ Tableau 的数据分析总监。凭借在云、AI 治理和合规方面的专业知识，她构建值得信赖、可扩展的解决方案。她积极支持全球组织，倡导包容性数据文化，并在技术领域推进多元、公平和包容。\n\
  \n## 目录\n\n本畅销 Tableau 指南的新版将教您如何在现代 BI 领域中利用 Tableau 的最新功能。本书更新了包含 Tableau Server、Tableau\
  \ Cloud、Tableau Prep 和 Tableau Desktop 最新功能的新主题，并提供了最新的示例和解决现实世界挑战的方案，将带您从掌握基本 Tableau\
  \ 概念一直到高级功能。\n\n在本书中，您将学习如何将各种文件和数据库连接到 Tableau Desktop 和 Prep Builder。您将能够轻松执行数据准备和处理，通过实用的动手示例掌握复杂连接、空间连接、并集和数据混合。您还将掌握数据填充，并使用\
  \ Tableau Exchange 探索计算、映射和可视设计的其他专家级技术。\n\n后面的章节将教您如何提升仪表板性能、连接到 Tableau Server\
  \ 和 Tableau Cloud，并通过现实世界示例理解数据可视化。您还将学习自助分析、时间序列分析和地理空间分析等高级用例。此外，您将学习如何将 Tableau\
  \ 与 Python 和 R 连接，将强大的编程功能直接带入您的 Tableau 工作流。\n\n全新的第 15 章“Tableau AI、Pulse 和 Next\
  \ 的智能时代”涵盖了 Tableau 的前沿内容：代理分析、Tableau Pulse、Tableau Next、Einstein Discovery 以及所有正在改变我们处理数据方式的\
  \ AI 驱动功能。所有其他章节均已完全更新，以反映最新功能。\n\n读完本书后，您将掌握适用于现代分析时代的 Tableau。您将有信心应对数据分析领域中常见和高级的挑战。\n\
  \n## 本书适合人群\n\n本书面向希望真正掌握 Tableau 的业务分析师、BI 专业人员和数据分析师。无论您是想解决复杂的数据科学问题，还是构建更好的商业智能仪表板，都能在这里找到实用的动手指导。\n\
  \n如果您之前使用过 Tableau，将更快掌握高级功能。但如果您是 Tableau 新手，也请不要担心；我设计了每一章，使其易于理解，配有清晰的解释和大量的跟随操作练习。您只需要好奇心和学习意愿。\n\
  \n## 本书内容\n\n第 1 章“回顾基础”将带您了解入门所需的基本 Tableau 概念。您可以将其视为 Tableau 宇宙的友好引导。\n\n第 2\
  \ 章“准备数据”是一章偏理论的章节，将帮助您理解数据准备，从而自信地驾驭即使是最混乱的数据集。\n\n\n\n\n\n- 第 3 章，使用 Tableau Prep\
  \ Builder，介绍 Tableau Prep Builder，即 Tableau Desktop 不那么“小”的 ETL 兄弟产品。你将学会轻松清洁、塑形和合并数据。\n\
  \n- 第 4 章，了解连接、混合和数据结构，解答这个经久不衰的问题：关系、连接还是混合？你将学习在什么时候使用哪种方式。\n\n- 第 5 章，介绍表计算，涵盖表计算的特殊魔力。这些强大函数使用数据顺序来分配排名、运行总和和移动平均。\n\
  \n- 第 6 章，利用 OData、数据密度化、大数据和 Google BigQuery，教你如何利用大数据解决方案并掌握数据密度化的概念，以实现更灵活的分析。\n\
  \n- 第 7 章，练习详细级别计算，帮助你解锁这个高级主题。你将学习如何更改数据的粒度，以进行精确、强大的计算。\n\n- 第 8 章，超越基础，向你介绍高级可视化概念和\
  \ Tableau Exchange。在那里你将发现扩展程序、加速器和连接器，为你的工作簿注入强大动力。\n\n- 第 9 章，使用地图，探索 Tableau\
  \ 的原生映射功能及更多。你将使用自定义多边形、热图、分层地图和现实世界空间分析。\n\n- 第 10 章，设计仪表板和可视化最佳实践，引导你了解格式化技术和设计原则，以最大限度地提升可视化的影响力和清晰度。\n\
  \n- 第 11 章，利用高级分析，通过三个动手跟练练习帮助你将分析技能提升到新水平：自助分析、时间序列分析和地理空间分析。\n\n- 第 12 章，提升性能，涵盖从数据源到仪表板设计的各个性能方面。本章将赋予你创建加载速度快、用户友好的仪表板的能力。\n\
  \n- 第 13 章，探索 Tableau Server 和 Tableau Cloud，涵盖 Tableau Server 和 Cloud 的不同产品和功能。你还将探索\
  \ Ask Data、数据详情以及最新的 2026.1 功能。\n\n- 第 14 章，集成编程语言，向你展示如何将 R 和 Python 与 Tableau\
  \ 集成。这将解锁几乎无限的分析能力，从统计建模到情感分析。\n\n- 第 15 章，Tableau AI、Pulse 和 Next 的智能时代，向你介绍 Tableau\
  \ 的前沿领域。你将探索代理分析、Tableau Pulse、Tableau Next、Einstein Discovery，以及所有正在改变我们处理数据方式的\
  \ AI 驱动功能。\n\n- 第 16 章，制定数据治理实践，介绍数据治理这一重要主题。你将学习如何遵守法规、记录数据，并使用 Tableau 的治理功能建立信任。\n\
  \n## 如何从本书中获益最大\n\n具备 Tableau 基础知识会让你领先一步，但我已将每一章设计得即使是初学者也能轻松上手。你的 14 天免费试用结束后需要\
  \ Tableau 许可证，做练习时请牢记这一点。话虽如此，本书中的大多数练习都可以使用 Tableau Public 完成，它完全免费，非常适合跟随学习和构建作品集。\n\
  \n根据 www.tableau.com，最新技术要求如下：\n\n| Windows | 64 位 Windows (8, 10, 11) |\n| ---\
  \ | --- |\n| | 2 GB 最小内存 (建议 8GB) |\n| | 1.5 GB 最小可用磁盘空间 |\n| | CPU 必须支持 SSE4.2\
  \ 和 POPCNT 指令集 |\n| Mac | macOS (Mojave, Catalina, Big Sur 11.4+) |\n| | Intel 处理器\
  \ 2 GB 最小内存 (建议 8GB) |\n| | 1.5 GB 最小可用磁盘空间 |\n\n你还需要：\n\n| 组件 | 建议 |\n| --- | ---\
  \ |\n| CPU (处理器) | 更快的单核速度比更多内核更重要。寻找主频较高的 CPU (3.5GHz+)。 |\n| RAM (内存) | 最小 8GB，处理大型数据集或复杂仪表板建议\
  \ 16GB。更多内存允许更大的数据提取保留在内存中。 |\n| SSD (存储) | 从 HDD 升级到 SSD 可将工作簿加载时间缩短 50-70%。使用本地数据提取时必不可少。\
  \ |\n| 显卡 (GPU) | Tableau 使用 GPU 进行地图渲染和某些视觉效果。集成显卡适用于大多数仪表板；独立 GPU 有助于处理大型地图或众多标记。\
  \ |\n| 网络连接 | 云数据源建议 100Mbps+。本地数据提取完全绕过网络延迟。 |\n\n你可能需要的其他安装（例如用于 Python 集成的 TabPy\
  \ 或用于 R 的 Rserve）会在相关章节中提及。所有这些都是免费的，并且适用于 Windows 和 Mac。\n\n## 下载示例代码文件\n\n本书的代码包也托管在\
