  ## 摘要


  本章首先讨论了数据密度化，并发现有两种数据密度化类型：域完成和域填充。在回顾这两种数据密度化类型时，我们了解了如何部署每种类型、每种类型何时有用以及每种类型何时可能存在问题。接下来，我们通过一个示例演练探索了大数据，了解如何使用
  Tableau 连接到 Google BigQuery。


  在下一章中，我们将探索另一种功能：**Level of Detail (LOD)** 计算。尽管表计算仍然是日常 Tableau 使用的重要组成部分，但我们将发现
  LOD 计算可以轻松完成以前仅通过复杂表计算才能实现的任务。


