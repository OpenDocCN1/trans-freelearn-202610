  - 订阅：订阅用于频繁的电子邮件更新。它们的工作方式与警报类似；可以订阅人员或群组，他们将在设定的时间收到一封包含相关仪表板概览的电子邮件。调度可以由管理员预定义：例如，每天早上
  7 点。


  ## 2026.1 版中的新增功能


  2026.1 版是 Tableau 演进中的巨大进步，引入了改进可用性、扩展连接性并加深平台与 AI 驱动分析集成的增强功能。在此前版本的基础上，该版本致力于提供更流畅、更智能的用户体验。


  在本节中，我们将探讨 Tableau 2026.1 引入的关键更新和功能，重点介绍它们如何简化工作流程、改进协作，并将分析贴近日常决策。


  ### 图像导出改进


  在导出或创建订阅时，Tableau 2026.1 引入了一种新的扩展导出服务架构，可帮助您加载使用扩展的仪表板，并生成与登录时看到的数据一致的图像输出。这确保了您的订阅、警报和下载始终与预期完全一致。分析人员和管理员可以简化围绕导出和自动作业的注意事项，并在用户下载仪表板、访问订阅和缩略图、接收警报、在
  Slack 上协作等情况下提供统一的仪表板体验。


  - 共享：单击共享，将打开一个弹出窗口，允许您与 Tableau Server 已知的任何人共享视图的 URL。该人员将收到带有链接的电子邮件。请确保该用户有权访问该项目，否则他们将无法打开视图：


  ![](img/66cf6b89349fda3581a4f196cb3c98a4_613_0.png)


  图 13.37: 共享视图


  - 下载：Tableau Server 还提供下载功能。根据管理员的配置，您可以选择不同的格式进行下载：


  ![](img/66cf6b89349fda3581a4f196cb3c98a4_614_0.png)


  图 13.38: 下载


  - 评论：最后但同样重要的是，您可以对视图进行评论；原始视图或已编辑视图均可。为此，请单击右上角的 **评论** 按钮：


  ![](img/66cf6b89349fda3581a4f196cb3c98a4_614_1.png)


  图 13.39: 评论


  您可以在评论中使用 @同事姓名 提及同事，他们将收到包含您评论的电子邮件。您还可以将屏幕截图添加到评论中。





  ## Tableau Pulse 集成


  Tableau Pulse 代表了 Tableau 提供洞察方式的根本转变，从用于构建仪表板的工具包转变为由 AI 驱动的智能、个性化分析体验。它旨在将指标和解释——而不仅仅是图表——置于用户工作流的中心。


  与其从仪表板开始，不如说 Pulse 从您的关键业务指标开始。您可以从数据源定义或自动生成这些关键 KPI（例如“经常性月收入”或“客户流失率”）。Pulse
  然后持续监控它们。


  Tableau Pulse 在现有数据和 Tableau 内容之上添加了一个智能层。其 AI 引擎会自动：


  - 它扫描您的数据以建议相关、可信的指标，并将其维护为单一事实来源。


  - 对于每个指标，Pulse 不仅显示趋势线。其 AI 提供自然语言摘要，直接在上下文中突出显示重大变化、促成因素和异常。


  - 它为每个用户量身定制体验。查看同一“收入”指标的销售总监和区域经理将看到与其特定角色和数据细分相关的解释和细分。


  - 洞察通过摘要电子邮件、个性化网页主页交付，并直接集成到 Slack 和 Salesforce 等工具中。用户无需四处寻找；关键变化会主动送达。


  Pulse 配备自然语言界面，用户可以使用普通英语就任何指标或洞察提出后续问题，而无需构建新视图即可深入钻研。这就是它与爱因斯坦副驾驶等功能集成的地方，实现从洞察到行动的无缝对话流程。


  Tableau Pulse 是 Tableau AI 愿景的体现，自动化数据洞察的生命周期。它将静态仪表板转变为与您数据的动态、智能、个性化对话，使分析更易于访问、更主动，并集成到日常决策中。


  ## 增强的数据连接性


  2026.1 版引入了两项连接数据的重大增强功能，值得特别关注。


  - 无需编写自定义代码即可连接到来自 REST API 端点的数据。新的 REST API 连接器为没有开发人员资源的业务用户解锁 API 数据，实现自助分析并缩短分析时间。REST
  API 连接器是已弃用的 Web 数据连接器选项的预期替代品。这对于依赖 API 数据的组织来说是一个变革性的功能。业务用户不再需要等待 IT 构建自定义连接器或编写
  Python 脚本，现在可以直接连接到 REST API 并将数据带入 Tableau 进行分析。


  - 使用自带连接器（BYOC，现处于 Pilot 阶段）加速您的云之旅并集中治理。使用专有系统或不支持数据库的组织现在可以部署自定义驱动程序和连接器，从而实现迁移到
  Tableau Cloud。BYOC 在确保站点级治理和使用监控的同时，解锁了网页创作、已发布数据源、提取和 Tableau Prep 流的全部功能。对于拥有旧系统或行业特定数据库的企业，此功能消除了云采用的主要障碍。您现在可以将现有连接器带到
  Tableau Cloud。


  ## Tableau 应用程序适用于 Microsoft 365


  您现在可以使用 **Tableau 应用程序适用于 Microsoft 365**（在 Tableau Cloud 和 Tableau Server 中正式提供）确保您的工作基于最新数据和洞察。除了与
  Microsoft Teams 的现有集成之外，用户现在可以将 Tableau 内容直接嵌入 PowerPoint 幻灯片和 Word 文档中，以可信数据讲述引人入胜的故事。


  此集成将 Tableau 强大的可视化效果直接带入您已用于演示和报告的工具中。不再需要截图或手动更新；您嵌入的可视化效果保持与 Tableau Server 上实时数据的连接。


  ## SCIM 与身份验证协议无关


  对于企业管理员，2026.1 版通过将 Tableau Cloud 上的 **跨域身份管理系统（SCIM）** 支持从 SAML 扩展到包括现代 **OpenID
  Connect（OIDC）** 协议，带来了更大的灵活性和简化的集成。云管理员现在可以无缝在 SCIM 配置中选择 OIDC 作为身份验证方法。这使用户预配和身份管理更加灵活，特别是对于已将
  OIDC 作为其主要身份验证协议的组织。


  ## 摘要


  本章开头介绍了 Tableau Server 设置。我们了解到修订历史记录功能可以为防止意外覆盖文件提供安全网。我们探索了 Tableau Server 网页创作环境的一节，该节将该环境与
  Tableau Desktop 进行了比较。本节的主要目的是建立知识库，以确定哪些人员应拥有 Tableau Desktop 许可证，以及 Tableau Server
  的网页创作功能对谁来说已足够。2026.1 版通过圆角、可访问创作和增强的数据模型可见性，使网页创作更接近 Desktop。


  然后我们讨论了用户筛选器。用户筛选器使 Tableau 创作者能够确保用户只能访问他们有权限访问的数据。最后，我们探讨了一些实用功能，例如警报、订阅、评论等，现在已通过图像导出改进和防止重复自定义视图得到增强。


  新的连接选项——REST API 连接器和自带连接器——使 Tableau 面向更多数据源，而 Tableau 应用程序适用于 Microsoft 365 将您的可视化效果直接带入
  PowerPoint 和 Word。Tableau Pulse 代表了分析的未来：主动、个性化且由 AI 驱动。


  在下一章中，我们将脱离 Tableau 领域，考虑如何将其与 R 和 Python 集成。编程集成知识将帮助 Tableau 创作者完成超出 Tableau 功能的分析任务，同时仍使用
  Tableau 可视化结果。


