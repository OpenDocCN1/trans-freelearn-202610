  \ 年拥有最多居民，而深绿色区域最少。\n\n你可能不喜欢多边形，或者你可能在想，像 .shp 这样的空间文件是否只允许使用多边形。幸运的是，答案是无论它是不是空间文件，我们都可以更改地图。我非常喜欢使用热图来显示地理密度，所以让我们在下一部分中使用它们。\n\
  \n## 热图\n\n我想与你分享一个功能，它是早期 Tableau 版本的一部分，在处理地理数据时已被证明非常有用。它是 **标记** 类型 **密度**，通过它你可以创建\
  \ **热图**。此新功能不仅限于地图；你也可以将其用于任何其他类型的图表。然而，它对于密集数据最为高效，在这类数据中模式不易被轻易发现。\n\n以下步骤将演示创建\
  \ **热图** 的示例：\n\n- 1. 打开与本章相关的工作簿中的 CityLimits 选项卡。如果你未完成之前的练习，请打开本章解答工作簿中的 CityLimits\
  \ 选项卡。\n\n- 2. 复制工作表并将其命名为 City Limits (2)。\n\n- 3. 将 **标记** 卡类型设置为 **密度**\n\n![](img/66cf6b89349fda3581a4f196cb3c98a4_397_0.png)\n\
  \n图 9.18: 得克萨斯州城市密度\n\n- 4. 在 **标记** 卡上单击 **颜色**，然后选择任何你喜欢的颜色。我选择了 **Density Gold\
  \ Dark**。\n\n- 5. 在 **标记** 卡中通过将滑块向左拖动来减小 **大小**。拖动直到你喜欢地图上圆圈的大小。\n\n![](img/66cf6b89349fda3581a4f196cb3c98a4_398_0.png)\n\
  \n图 9.19: 热图\n\n热图可以显示空间集中度，非常适合非常密集的数据集。在前一个图中，你可以看到我们丢失了城市周围环境和多边形结构；然而，我们仍然可以看到人口稠密区域，而且现在每个城市的大小都相同，这使得比较大小不同的地理位置变得更容易。我们还能够证明，空间文件不需要与多边形一起使用。\n\
  \n在 Tableau 2020.4 版本中，添加了另一个功能：地图图层。它们是什么以及用途将在下一部分中描述。\n\n## 双轴和地图图层\n\n你可能回想起，在之前章节的多个场合中，我们使用了双轴。双轴可视化也可以用地图实现，而且更棒的是，自\
  \ Tableau 2020.4 版本以来，地图可以分层。我们只需添加另一个具有相同结构（在此例中为地图）的图层，对于每个图层，我们可以显示不同的数据。\n\n\
  我们将学习两个练习，第一个关于双轴的使用，第二个包含地图图层。\n\n### 使用双轴\n\n让我们开始：\n\n- 1. 首先，我们需要一个数据集。我只是在\
