  ![](img/66cf6b89349fda3581a4f196cb3c98a4_541_1.png)\n\n### 类别预测\n\n![](img/66cf6b89349fda3581a4f196cb3c98a4_541_2.png)\n\
  \n图 11.6.4：最终仪表板\n\n此仪表板展示了具有空间分析功能的综合预测能力，非常适合零售规划、库存管理和战略决策。分步说明确保您可以通过调整字段名称和关系，即使使用不同的数据集也能重建此仪表板。\n\
  \n## 摘要\n\n在本章中，我们探索了高级自助分析这个迷人的世界。我们首先理解了自助分析作为一种商业智能形式的概念，它使个人能够直接查询数据集并挖掘宝贵见解。在整个过程中，我们发现了三个引人入胜的用例，展示了自助分析的威力。我们解读了世界指数之间复杂的相关性，从而更深入地了解全球市场动态。随后，我们深入研究了芝加哥交通违章领域，使用地理空间分析来发现模式和潜在改进领域。最后，我们扩展了地理空间分析，利用距离度量根据关键变量确定住房位置的最佳半径。\n\
  \n在这些多样化的场景中，一个关键教训贯穿始终：在启动自助分析项目时，结构良好的方法至关重要。通过仔细规划工作、熟悉数据、运用描述性统计，并根据中间结果调整计划，我们为成功铺平了道路。\n\
  \n请记住，仪表板永远不会真正完成：您随时可以更改内容；受众可能会发生变化；利益相关者的意愿可能会不同。交付一个具有基本功能的可用可视化，并在获得反馈后继续开发。根据您的积压工作或其他情况，最小可行产品可能正是您所需要的。\n\
  \n在本章结束时，我敦促您反思所获得的见解，并思考如何将这些原则应用到您自己的自助分析工作中。请记住，虽然我的经验可以作为指南，但有许多不同的道路可以通向您的目标。拥抱自助分析的力量，用数据赋能自己，并在追求明智决策的过程中解锁无限可能。在此过程中，让您的\
  \ IT 团队歇一歇，让他们专注于超出您职责范围的更重实现工作。\n\n下一章将全面介绍性能改进。随着数据量的不断增加，性能至关重要，可能意味着成功与失败的区别。\n\
