  \ Calculations 下，选择 City Count。\n\n- 8. 选择 Compute Using | Specific Dimensions 并勾选\
  \ City：\n\n![](img/66cf6b89349fda3581a4f196cb3c98a4_213_0.png)\n\n图 5.13: 特定维度\n\
  \n- 9. 现在再次使用 Nested Calculations 下的下拉列表并选择 Size。然后，选择 Compute Using | Specific\
  \ Dimensions 并勾选 City。\n\n- 10. 观察最终视图：\n\n![](img/66cf6b89349fda3581a4f196cb3c98a4_214_0.png)\n\
  \n图 5.14: 最终工作表\n\n让我们考虑一下前一张工作表的工作原理：\n\n- - **Size**: Size() 基于缓存中的分区/数据集生成一个单一数字，例如，Delaware\
  \ 为 3。该数字会随分区和寻址设置而变化，但不会随分区内的移动而变化。因此，它表现为非方向性。\n\n**City Count:** 字段 IF FIRST()\
  \ = 0 THEN LOOKUP([Size],0) ELSE NULL END 并非严格必需。您可以改为直接将 **Size** 放置到 **Text/Label**\
  \ 书架。但是，如果您这样做，会发现视图中的数字看起来是粗体。这是因为数字实际上被重复并相互叠加。使用 FIRST() = 0 可确保仅显示一组数字。\n\n\
  请注意，前一练习中有 **Nested Calculations** 选项，这是因为 Size 计算字段在 City Count 计算字段中被引用。\n\n实际场景：**Size**\
  \ 可能是最不常用的。我坦率地认为，除非是为了解释和演示，否则我从未使用过它。但我看到其他人使用 **Size** 的方式如下：启用**总计**列视图后，**Size**\
  \ 可以生成非默认聚合（如标准差）。只需使用以下公式：if size()=1 then sum({STDEV([Sales])}) else sum([Sales])\
  \ end。\n\n如果您对表计算欲罢不能，这里还有更多场景：\n\nhttps://www.tableau.com/blog/top-10-tableau-table-calculations\n\
  \n在介绍完不同的表计算后，我们将看到如何在计算的分区（范围）和寻址（方向）中对其进行操作。\n\n## 应用函数\n\n目前为止，我们已探讨了两个主要问题中的第一个：_函数是什么？_\
  \ 现在我们将进入下一个问题：_如何应用函数？_\n\n让我们尝试通过以下三个选项来理解该问题，它们都是 INDEX 函数的应用：\n\n| 类别 | 消费者\
  \ | | 企业 | | 家庭办公 | | | 类别 | 消费者 | 企业 | 家庭办公 |\n|---|---|---|---|---|---|---|---|---|---|---|---|\n\
  | 家具 | | 1 | | 2 | | 3 | | 家具 | | 1 | | 1 | | 1 |\n| 办公用品 | | 1 | | 2 | | 3 | |\
  \ 办公用品 | | 2 | | 2 | | 2 |\n| 技术 | | 1 | | 2 | | 3 | | 技术 | | 3 | | 3 | | 3 |\n\
  | | | | | 类别 | 消费者 | 企业 | 家庭办公 |\n| | | | | 家具 | | 1 | | 2 | | 3 |\n| | | | | 办公用品\
  \ | | 4 | | 5 | | 6 |\n| | | | | 技术 | | 7 | | 8 | | 9 |\n\n图 5.15: 应用\n\nINDEX 函数在这三张截图中均被使用；然而，在每张截图中的应用方式不同。第一张和第二张截图均显示\
  \ **1, 2, 和 3**，但方向性不同。第三张截图的范围是 **1 到 9**。因此，在每种情况下，INDEX 是如何应用的？\n\n\n\n\n\n回答这个问题可能会令人困惑，因为\
  \ Tableau 使用了不同的术语。在 Tableau 本身中，表计算应用的方式可能被称为沿行运行、沿列移动、按计算使用，或者 **分区（范围）** 和 **寻址（方向）**。出于我们的目的，我们将使用分区和寻址这两个术语，并将根据\
  \ Tableau 文档（https://help.tableau.com/current/pro/desktop/en-us/calculations_tablecalculations.htm）在此定义它们：\n\
  \n定义如何对计算进行分组（即定义计算所作用的数据范围）的维度称为分区字段。表计算在每个分区内单独执行。其余用于执行表计算的维度称为寻址字段，并确定计算的方向。\n\
  \n基本上，这意味着分区定义了正在使用的字段，例如 Segment。如果您有跨三个类别划分的三个细分市场，可以分别查看每个组合、一个细分市场内的所有类别，或一个类别内的所有细分市场。您查看的方式就是\
  \ Tableau 所称的寻址。\n\n如果在视图中使用了表计算，您可以右键单击它并选择 **编辑表计算**。这样做后，您将看到一个对话框，其中允许选择特定维度。如果某个维度被选中，则它被寻址。如果未被选中，则它被分区。\n\
  \n在下图中查看示例：\n\n![](img/66cf6b89349fda3581a4f196cb3c98a4_216_0.png)\n\n图 5.16：寻址和分区\n\
  \nTableau 提供了许多开箱即用的分区和寻址设置，包括 Table（向下）、Table（横向）、Pane（向下）和 Cell。我们偶尔会引用这些选项，但不会进行详细评述。这引出了我们的第一条分区和寻址准则：\n\
  \n*不要使用 Tableau 提供的开箱即用的分区和寻址设置，包括 Table（横向）和 Pane（向下）。强制自己单击特定维度并手动定义分区和寻址，以便您清楚了解每个表计算是如何应用的。*\n\
  \n前面准则有几点注意事项：\n\n- 有一个例外，即 **Cell**。使用分区和寻址无法在视图中寻址单个单元格。相反，有必要将 **按计算使用** 设置为\
  \ **Cell**，或在 **表计算** 对话框中选择 **Cell**。令人惊讶的是，按每个单元格寻址表计算可能很有用。本章关联的工作簿中的 **百分比占比**\
  \ 工作表提供了一个示例。在那里，它用于显示分为两个类别的每个单元格的 100%。\n- 如果为给定表计算设置了分区和寻址，然后向视图中添加维度，通常，Tableau\
  \ 不会自动调整分区和寻址设置；它们被锁定。但是，在使用 **Table（向下）**、**Pane（横向）** 等选项时，Tableau 会在向视图中添加维度时自动进行调整。\n\
  \n这引出了我们的下一条准则：\n\n*在为表计算设置分区和寻址之前，将所有所需的维度放置在所需的货架上。*\n\n遵循这些准则有助于确保您始终清楚表计算是如何应用的。起初可能需要更长时间，但最终，您将更好地控制表计算并能够更快地开发。\n\
  \n## 构建游乐场\n\n为更好地理解分区和寻址在 Tableau 中的行为，我们将创建一个简单、受控的环境，让您直接观察其效果。让我们搭建一个简单的游乐场环境，以便快速高效地探索分区和寻址：\n\
  \n- 1. 在本章关联的工作簿中，导航到 **游乐场** 工作表。\n- 2. 将 **类别** 放置在 **行** 货架上，将 **索引** 计算放置在 **标签**\
  \ 货架上。\n- 3. **索引** 计算只是 `Index()`。单击与 **索引** 关联的下拉菜单并选择 **编辑表计算**。在弹出的对话框中，单击 **特定维度**。\n\
  - 4. 最佳定位屏幕组件。可参考以下截图中的一种可能设置：\n\n![](img/66cf6b89349fda3581a4f196cb3c98a4_218_0.png)\n\
  \n图 5.17：构建游乐场\n\n如图 5.17 所示，我们创建了一个显示三个类别（家具、办公用品、技术）的工作表。通过将索引字段添加到文本货架，我们满足了使用表计算的最低要求，即一个维度和一个表计算。现在，我们可以更改表计算中使用的计算方式，并观察可视化中的变化。后来，我们将探索更复杂的示例；但是，始终从简单开始，并慢慢增加复杂程度，以完全理解发生了什么。\n\
  \n在接下来的页面中，我们将广泛使用我们的游乐场并根据需要对其进行修改。但是，为了效率，我们需要将讨论范围限定在游乐场及其相关讨论上。讨论将局限于行和列货架上的维度以及文本货架上的\
  \ INDEX 函数。\n\n我们可以探索不同货架上的各种函数及其提供的不同选项。例如，将日期字段放置在页面货架上会导致使用 TOTAL 函数的表计算，显示一个计算所有页面总计的选项。遗憾的是，在一个章节中不可能探讨每一个可能的细微差别，但如果您对这个主题感兴趣，欢迎查看\
  \ Tableau 帮助页面以获取更多内容和示例：https://help.tableau.com/current/pro/desktop/en-us/functions_functions_tablecalculation.htm。\n\
  \n### 使用一个维度的分区和寻址\n\n让我们使用我们的游乐场，以最简单的示例开始探索分区和寻址：\n\n![](img/66cf6b89349fda3581a4f196cb3c98a4_219_0.png)\n\
  \n图 5.18：按计算使用 | 类别\n\n在这个简单示例中，寻址 **类别** 会导致 **类别** 维度的每个成员被计数。这表明寻址一个维度确定了计算的方向。在我们的示例中，我们有表计算索引，但\
  \ **索引** 取决于分区和寻址，如我们之前所学。 **类别** 在 **行** 货架上充当分区。我们将数据分为三部分：**家具**、**办公用品** 和 **技术**。现在，我们还为\
  \ **表计算** 寻址 **类别**。我们通过从 **按计算使用** *图 5.18* 中选择 **类别** 来完成此操作。现在 **表计算** 将应用于类别，因此计数为\
  \ 1、2 和 3 个类别。\n\n如果选择 **按计算使用 | 单元格**，则分为三个类别的分区仍会保留在视图中——您仍会看到 **家具**、**办公用品**\
  \ 和 **技术**——但计数将按每个单元格进行，而不是针对整个 **类别** 维度。因此，**索引** 将计数 1，然后移动到下一个单元格并计数 1，再下一个单元格，再次计数\
  \ 1：\n\n![](img/66cf6b89349fda3581a4f196cb3c98a4_220_0.png)\n\n图 5.19：按计算使用 | 单元格\n\
  \n现在，让我们考虑不仅涉及一个，而是两个维度的分区和寻址。\n\n### 使用两个维度的分区和寻址\n\n在对两个或多个维度进行分区和寻址时，将提供两个额外选项：At\
  \ the level 和 Restarting every。您可以将此场景比作按大洲计算所有国家的任务。在此场景中，At the level 将是国家，因为您计算的不是街道或树木，而是国家。Restarting\
  \ every 将是大洲。在为一个大洲计算完国家后，您将为下一个大洲重新从 1 开始：\n\n![](img/66cf6b89349fda3581a4f196cb3c98a4_220_1.png)\n\
  \n图 5.20：两个维度\n\n\n\n\n\n“在级别处”和“重新开始于”都允许作者从下拉菜单中选择维度。“在级别处”允许作者选择在哪个级别进行递增，顾名思义，“重新开始于”允许作者选择在哪些维度上重新开始。这里的示例将为您的理解提供上下文。\n\
  \n请注意，“在级别处”还有一个额外选项：最深层。在这种情况下，将“在级别处”设置为最深层与选择运输方式相同。这引出了我们的下一条准则：\n\n没有必要在“在级别处”下拉菜单中选择最底层的维度。它始终与最深层相同。\n\
  \n若要重现此处列出的迭代，您需要对试验环境进行一些更改。除了将类别放在行书架上、将索引放在标签书架上之外，还需将运输方式放在行书架上。我们不会涵盖包含一个或多个维度在列书架上的迭代，因为这些可能性的行为大体相同。\n\
