  \n## 使用 R 进行回归计算\n\n简而言之，回归分析是一种用于估计变量关系的技术。有多种回归分析类型，其中最常用的是线性回归。如以下截图所示，线性回归估计最适合数据的直线，且是\
  \ Tableau 的内置功能。\n\n您只需在 **行** 和 **列** 上放置两个度量值，以及一个用于划分视图中点的维度。然后，进入 **分析**，将 **趋势线**\
  \ 拖到屏幕上并选择 **线性**：\n\n![](img/66cf6b89349fda3581a4f196cb3c98a4_632_0.png)\n\n图 14.13:\
  \ 散点图\n\n请注意，此截图来自 Tableau。您可以单击与本章关联的工作簿中的 **散点图** 工作表来访问它。这是一个打开趋势线的简单散点图。在 Tableau\
  \ 中，趋势线默认为线性，但还包括对数、指数和多项式选项，这些都是回归分析的示例。通过在使用趋势线的可视化中访问 **工作表 | 导出 | 数据**，您可以为视图上的标记生成带有预测值和残差的\
  \ **Access** 数据库。但这是一个繁琐的过程，无法为实施更强大的线性回归用途提供健壮的动态解决方案。使用 R 提供了更大的灵活性。\n\n线性回归可使用单个或多个变量。单变量方程适合学习，但多变量方程通常是现实世界应用所必需的。以下练习包含多变量方程。本练习的目标是确定\
  \ **Profit** 的线性回归模型与 COUNT(Quantity)、SUM(Sales) 和 AVG(Discount) 的拟合程度如何：\n\n- 1.\
  \ 导航到回归工作表\n\n- 2. 选择 Superstore 数据源\n\n- 3. 通过将 **Profit** 放在 **列** 货架上，将 **State**\
  \ 放在 **行** 货架上，并通过将 **State** 放在 **筛选器** 货架上按 **Sum of Profit** 筛选 **Top 10**，来构建基本布局：\n\
  \n![](img/66cf6b89349fda3581a4f196cb3c98a4_633_0.png)\n\n图 14.14: 筛选前 10\n\n- 4.\
  \ 创建名为 Profit_Expected 的计算字段，使用以下代码：\n\n```\nSCRIPT_REAL(\"\nx <- lm(.arg1 ~ .arg2\
  \ + .arg3 + .arg4)\nx$fitted\",\nSUM(Profit), COUNT(Quantity), SUM(Sales), AVG(Discount)\n\
  )\n```\n\n- 5. 创建名为 % Diff 的计算字段，用于计算 SUM(Profit) 与 Profit_Expected 之间的百分比差异：\n\n\
  ```\nSUM(Profit)/Profit_Expected - 1\n```\n\n- 6. 创建名为 Profit_Expected (残差) 的计算字段，以美元为单位返回\
  \ SUM(Profit) 与 Profit_Expected 之间的差异：\n\n```\nSCRIPT_REAL(\"\nx <- lm(.arg1 ~ .arg2\
  \ + .arg3 + .arg4)\nx$residuals\",\nSUM(Profit),COUNT(Quantity), SUM(Sales), AVG(Discount))\n\
  ```\n\n- 7. 将 Profit_Expected 放在列货架上，与 Profit 相邻。然后，单击其中任何一个并启用双轴。\n\n- 8. 右键单击一个轴并选择同步轴\n\
  \n- 9. 在标记卡的 SUM(Profit) 部分中，将 % Diff 移动到颜色货架上\n\n- 10. 选择 Red-Black 发散调色板以及分级颜色中的\
  \ 2 个步骤。这样，所有正值将显示为黑色，所有负值显示为红色。请确保视图类型选择为条形图。\n\n![](img/66cf6b89349fda3581a4f196cb3c98a4_634_0.png)\n\
  \n图 14.15: 颜色编码\n\n- 11. 从菜单中选择 分析 | 堆叠标记 | 关闭\n\n- 12. 在标记卡的 Profit_Expected 部分中，将\
  \ Profit_Expected (残差)、% Diff 和 Profit_Expected 移动到标签货架上。请确保视图类型选择为甘特条。\n\n- 13.\
  \ 再次检查所有表计算（由三角形符号指示：Profit_Expected (残差)、% Diff 和 Profit_Expected）是否都使用 State 进行计算：\n\
  \n![](img/66cf6b89349fda3581a4f196cb3c98a4_635_0.png)\n\n图 14.16: 按以下方式计算\n\n- 14.\
  \ 单击标签和文本部分中的三个点，并按喜好编辑标签：\n\n![](img/66cf6b89349fda3581a4f196cb3c98a4_636_0.png)\n\
  \n图 14.17: 预期利润\n\n根据需要调整条形图和甘特条的大小，并观察结果：\n\n![](img/66cf6b89349fda3581a4f196cb3c98a4_636_1.png)\n\
  \n图 14.18: 回归\n\n图 14.18 中的可视化显示了实际利润、预期利润及两者之间差异的比较。此计算在零售市场中尤其有用，也适用于任何公司的财务规划。\n\
  \n现在我们已经完成了练习，请花点时间考虑本练习中使用的一些代码：\n\n| SCRIPT_REAL | 此 Tableau 函数调用 R 引擎并返回浮点值。\
  \ |\n| :--- | :--- |\n| \"x <- lm(.arg1 ~ .arg2 + .arg3+.arg4); x$residuals\" |\
  \ 这是一个 R 表达式，包含一个变量、一个函数和一个参数，然后返回预测值。 |\n| x <- | 这是要由后续 R 函数填充的变量。 |\n| lm(.arg1\
  \ ~ .arg2 + .arg3 + .arg4) | 此 R 函数用于拟合线性模型。它可以用于根据参数中提供的变量返回回归。括号中的信息称为参数，用于拟合模型。具体来说，响应位于波浪号\
  \ (~) 的左侧，模型位于右侧。因此，这是一个多变量线性回归，其中 .arg1 = SUM(Profit)，.arg2 = COUNT(Quantity)，.arg3\
  \ = SUM(Sales)，.arg4 = AVG(Discount)。从英语角度来看，该参数可读作 SUM(Profit)，并被建模为 COUNT(Quantity)、SUM(Sales)\
  \ 和 AVG(Discount) 的组合项。 |\n| \", SUM(Profit), COUNT(Quantity), SUM(Sales) , AVG(Discount))\
  \ | 这些是用于填充 .arg# 变量的参数。请注意，双引号 (\") 指定传递给 R 的代码结束，逗号 (,) 指定 Tableau 函数的下半部分，即表达式。\
  \ |\n\n表 14.1: 代码快速回顾\n\n在成功实现回归后，我们将现在研究一种常用于区分数据集中子集的不同统计方法，称为聚类。\n\n\n\n\n\n\
  ## 在 Tableau 中使用 R 进行聚类\n\n**聚类**用于从较大的数据集中选择具有相似特征成员的较小数据子集。举个例子，考虑一个营销场景。您拥有一个大型客户群，计划向其发送广告材料；然而，成本禁止您向每个客户发送材料。对数据集进行聚类将返回具有相似特征的客户分组。然后您可以调查结果并选择目标群体。\n\
  \n聚类的主要方法包括层次聚类和 k-means 聚类。层次聚类更为彻底，因此更耗时。它生成一系列模型，范围从一个包含所有数据点的模型到 n 个模型，其中每个数据点都是一个独立模型。K-means\
  \ 聚类是一种更快的方法，用户或另一个函数定义簇的数量。例如，用户可以选择从一千个成员的数据集中创建四个簇。\n\nTableau 包含聚类功能。您可以在 **分析**\
  \ 选项卡下找到此功能。Tableau 中的聚类实现基于四个支柱：\n\n- 可靠的方法论\n- 可重复的结果\n- 快速的处理时间\n- 易于使用\n\n请务必在此处查看更多详细信息\
  \ (https://help.tableau.com/current/pro/desktop/en-us/clustering.htm) 以及随附解决方案工作簿中的\
  \ **聚类 (Tableau 原生)** 选项卡。\n\nTableau 开发团队处理聚类有多种方法。例如，R 提供了许多使用不同方法的不同聚类包。Tableau\
  \ 作者可能有充分理由选择其中一种不同的方法。例如，使用 Tableau 原生聚类功能时，聚类结果始终相同。但情况未必如此。通过使用 R 进行聚类，底层数据和视图可能保持不变，但每次刷新时聚类可能会有所不同，因为该函数会在看到整个数据集之前停止在最佳结果（局部最小值）上。为了性能而使用所谓的局部最小值而不是全局最小值的权衡已被证明是值得的。但取决于数字的顺序，每次运行函数时局部最小值都可能不同。如果您正在寻找标记可能在簇之间切换的边缘情况，这可能对您有利。以下示例探讨了这种情况。\n\
  \n本练习的目标是根据出生率和婴儿死亡率，从世界各国创建四个簇：\n\n- 导航到 Cluster (R) 工作表\n- 选择 World Indicators\
  \ 数据源（此数据集随 Tableau 一起提供，可在 **保存的数据源** 下找到）\n- 通过将 **婴儿死亡率** 放在 **列** 货架、**出生率**\
  \ 放在 **行** 货架、**国家/地区** 放在 **详细信息** 货架上来构建初始视图\n\n- 右键单击每个轴并选择 **对数**，取消选择 **包含零**。这将使数据点分布更加均匀，并有助于使可视化更美观且更易于阅读：\n\
  \n![](img/66cf6b89349fda3581a4f196cb3c98a4_639_0.png)\n\n图 14.19：聚类\n\n- 创建一个名为\
  \ Cluster 的计算字段，使用以下代码：\n\n```\nSCRIPT_INT(\"\nm <- cbind(.arg1, .arg2);\nkmeans(m,4,nstart=5)$cluster\"\
  ,\nAVG( [Life Expectancy Female] ), AVG([Life Expectancy Male]))\n```\n\n- 将刚才创建的\
  \ **Cluster** 字段拖到 **详细信息** 和 **颜色** 货架上。请注意，Rserve 引擎会抛出一个错误：\n\n在与分析扩展数据源通信时发生错误...\n\
  \n错误代码：6116DD27\n\n在与分析扩展通信时发生错误。\n在与分析扩展通信时发生错误。Error in\ndo_one(nmeth) : NA/NaN/Inf\
  \ in foreign function call (arg 1)\n\n图 14.20：错误处理\n\n这是因为底层数据集中存在空值。例如，数据不包括波多黎各的婴儿死亡率。\n\
  \n> **提示**\n> 如果在其他度量值上遇到此错误，则适用相同的解决方案。\n\n- 要纠正错误，请将婴儿死亡率拖到 **筛选器** 货架上。在筛选器对话框中，按显示的方式选择值以删除低于\
  \ 0.01 的所有值：\n\n![](img/66cf6b89349fda3581a4f196cb3c98a4_640_0.png)\n\n图 14.21：筛选器\n\
  \n- 确保将 Cluster 设置为离散，并将\"使用计算对象\"设置为 | 国家/地区，以避免另一个错误：k-means (m, 4, nstart = 5)\
  \ 中的错误：簇中心数量超过不同数据点的数量。结果视图应如下截图所示：\n\n![](img/66cf6b89349fda3581a4f196cb3c98a4_641_0.png)\n\
  \n图 14.22：聚类\n\n- 按 F5 并观察每次刷新时聚类都会发生变化\n\n现在我们已经完成了练习，花点时间来看看我们看到的一些代码：\n\n| 代码/术语\
  \ | 说明 |\n|-----------|------|\n| SCRIPT_REAL | 此 Tableau 函数调用 R 引擎并返回浮点值。 |\n|\
  \ \"m <- cbind( .arg1, .arg2); kmeans(m,4,nstart=1)$cluster\" | 这是包含变量、函数和参数的 R\
  \ 表达式，然后返回簇。 |\n| m <- | 这是由后续 R 函数填充的变量。 |\n| cbind | 此 R 函数将以下 .arg# 变量组合成列。 |\n\
  | (.arg1, .arg2) | 括号内的变量称为参数。每个变量包含向量信息。具体来说，.arg1 = AVG( [婴儿死亡率] ) 和 .arg2 = AVG([出生率])。\
  \ |\n| kmeans(m,4,nstart=1)$cluster | kmeans 声明 m 聚类方法。m 包含由 cbind 参数创建的向量。整数 4\
  \ 声明簇的数量。nstart 声明随机集的数量。 |\n| \", AVG ( [ Infant Mortality Rate ] ), AVG([Birth\
  \ Rate])) | 这些是用于填充 .arg# 变量的参数。请注意，双引号 (\") 指定传递给 R 的代码的结束，而逗号 (,) 指定 Tableau 函数的后半部分，即表达式。\
  \ |\n\n表 14.2：代码快速回顾\n\n我们取得了什么成就？好吧，我们能够根据预期寿命将数据集中的国家划分为四个子群。我们在散点图上展示了聚类结果，使用了两个度量值：婴儿死亡率和出生率。这样，我们可以同时间接分析四个度量值，在此情况下它们是\
  \ **婴儿死亡率**、**出生率**、**国家/地区** 和 **预期寿命**。R 聚类基于 **k-means 方法**，这与 Tableau 默认聚类不同，并且可以调整为任何可以在\
  \ R 中执行的方法。\n\n接下来，我们将探索分位数的世界。\n\n## 介绍分位数\n\n**分位数**通常被认为与四分位数同义。事实并非如此。分位数是均匀分割值总体所构成的集合。四分位数是一种分位数——五分位数、三分位数和十分位数也是。为了理解分位数如何均匀分割值总体，想象将总体乘以\
  \ 1/4、2/4、3/4 和 4/4，您将得到 4 个四分位数。要获得五分位数，您将总体乘以 1/5、2/5、3/5、4/5、5/5，依此类推。\n\nTableau\
  \ 允许您通过右键单击轴并选择 **添加参考线 | 分布 | 计算 | 分位数** 来查看分位数：\n\n![](img/66cf6b89349fda3581a4f196cb3c98a4_643_0.png)\n\
  \n图 14.23：三分位数\n\n但是，您也可以将分组数更改为 4、5 或任何其他数字来创建四分位数、五分位数等等。然而，以这种方式访问的分位数功能相当有限。主要原因是参考线不会生成可以放置在货架上的度量值。这限制了可视化选项。通过\
  \ R 生成分位数极大地扩展了这些选项。\n\n本练习的目标是通过 R 创建分位数以查看按销售额划分的客户分布。我们将进一步扩展练习，通过创建将总数据集中的成员数量限制在给定百分位数范围内的参数。最后，我们将通过添加抖动来微调可视化。\n\
  \n让我们来看看以下步骤：\n\n- 导航到 Quantiles 工作表\n- 选择 Superstore 数据源\n- 在标记卡上将视图类型更改为 Shape\n\
  - 将 Sales 拖到 行 货架，Customer Name 拖到 详细信息 货架，Region 拖到 颜色 货架\n- 创建并显示名为 Number of\
  \ quantiles 的参数，使用以下设置：\n\n![](img/66cf6b89349fda3581a4f196cb3c98a4_644_0.png)\n\
  \n图 14.24：分位数参数\n\n- 右键单击创建的参数并选择 显示参数\n- 创建一个名为 Quantiles 的计算字段，使用以下代码：\n\n```\n\
  SCRIPT_REAL(\"\nx <- .arg1;\ny <- .arg2[1];\nm <- c(1:y)/y;\nn <- length(x);\nz\
  \ <- c(1:n); for (i in c(1:n)) z[i] <- 0;\nfor (j in c(1:y)) for (i in c(1:n)) z[i]\
  \ <- if (x[i] <= quantile(x,m)[j] && z[i]\n```\n\n\n\n== 0 ) j else z[i];\nz;\"\n\
  , SUM(Sales), [Number of quantiles])\n\n- 8. 右键单击新创建的计算字段 quantiles，并选择 Convert\
  \ to Discrete\n\n- 9. 创建并显示两个参数，Select Percentile Bottom Range 和 Select Percentile\
  \ Top Range。对两者使用以下设置：\n\n![](img/66cf6b89349fda3581a4f196cb3c98a4_645_0.png)\n\n\
  图 14.25：百分位数参数\n\n- 10. 右键单击两个新创建的参数，并选择 Show Parameter\n\n- 11. 创建一个名为 Percentile\
  \ 的计算字段，使用以下代码：\n\n```\nRANK_PERCENTILE(SUM([Sales])) < [Select Percentile Top Range]\n\
  AND\nRANK_PERCENTILE(SUM([Sales])) > [Select Percentile Bottom Range]\n```\n\n-\
  \ 12. 将 Quantiles 拖到 列 (Columns) 谷架，并将 Compute Using 设置为 Customer Name\n\n- 13.\
  \ 将 Percentile 拖到 筛选器 (Filters) 谷架，单击确定，然后将 Compute Using 设置为 Customer Name。再次打开筛选器并选择值\
  \ True。\n\n所以，让我们回顾迄今为止所做的工作。我们按区域绘制了销售值，然后添加了一个 R 脚本，从销售点云中创建分位数。我们还创建了一个参数，允许我们选择要在视图中查看多少个分位数，因为我们了解到分位数不必总是四分位数，也可以是三分位数或五分位数，或更多。接下来，我们将看到此视图的实际效果，并添加抖动。\n\
  \n您可以添加这些额外步骤以进一步增强可视化效果。要利用抖动，请创建一个名为 Index() 的索引计算字段，并将该字段放置在 列 (Columns) 谷架上。将\
  \ Compute Using 设置为 Customer Name。请确保取消选择 显示标题，以便 Index 不在视图中显示。\n\n右键单击每个轴并选择 对数，取消选择\
  \ 包含零。您的屏幕上应显示以下内容：\n\n![](img/66cf6b89349fda3581a4f196cb3c98a4_646_0.png)\n\n图\
  \ 14.26：分位数仪表板\n\n在前一张图中，您可以看到我们决定显示四个分位数（利用 分位数数量 参数），它们因此被称为四分位数。通过将 Index() 函数添加到列中，我们能够将分位数划分为四个组件中的每一个。从该仪表板得出的一个结论可能是，在每个四个分位数中，西部地区的销售额最高，南部地区的销售额最低。但是，中部地区和南部地区在第三个分位数中非常接近。基于此信息，我们可以对这些地区具体发生了什么情况进行进一步分析，以及为什么中部地区的销售额在该分位数中相比其他地区下降了。\n\
  \n既然我们已完成练习，让我们花点时间考虑一下本练习中查看的一些代码：\n\n| SCRIPT_REAL | 此 Tableau 函数调用 R 引擎并返回浮点值。\
  \ |\n| :--- | :--- |\n| x <- .arg1; | x 是我们将在此基础上创建分位数的变量。在此示例中，该变量为 [Sales]。 |\n\
  | y <- .arg2[1]; | 此变量设置分位数计数。[1] 强制设置单个数字而不是向量。 |\n| m <- c(1:y)/y; | m 从 1:y 均匀分布概率。\
  \ |\n| n <- length(x); | 此设置循环的大小。下文将讨论循环。 |\n| z <- c(1:n); for (i in c(1:n)) z[i]\
  \ <- 0; | z 通过将所有内容设置为 0 来设置初始响应向量。 |\n| for (j in c(1:y)) for (i in c(1:n)) z[i]\
  \ = if (x[i] <= quantile(x,m)[j] && z[i] == 0 ) j else z[i]; | 对于每个分位数，我们遍历 z 向量，并对每个条目测试\
  \ x 的值是否小于该分位数的上限。如果 x 之前已设置，则保留不变。否则，z[i] = 该分位数 (j)。 |\n\n在本练习中，您看到，通过使用 R，Tableau\
  \ 默认功能（如聚类）可以被扩展，并将使您的仪表板用户在使用仪表板时遇到新问题时拥有更多自由来回答问题，因为他们可以更改（例如）参数并查看可视化效果的变化。既然我们了解了一些可能的\
  \ R 用例，是时候讨论值得您关注的事情了：即将编程集成与 Tableau 一起使用时带来的性能挑战。\n\n## 性能挑战\n\nR 脚本是表计算。与所有表计算一样，这意味着您只能使用视图中的字段。此外，正确设置分区和寻址非常重要；否则，您可能会得到意外结果。\n\
  \n在 *介绍分位数* 部分，您可能注意到，使用 **分位数数量** 参数设置的分位数数量越大，结果显示所需的时间就越长。这是因为 R 会在 **分位数** 计算字段中为每个分位数运行一次循环迭代。例如，如果\
  \ **分位数数量** 参数设置为 **1**，则循环仅触发一次。如果设置为 **2**，则运行两次，以此类推。经验法则是 R 代码对每个分区执行一次。分区越多，性能越慢。因此，在使用\
  \ R 代码时，尽可能减少分区数量。\n\n这是本章的 R 部分。希望您喜欢它，并希望它能激发您产生自己的想法，以扩展我们迄今共享的功能。我们现在将继续介绍另一种非常著名的编程语言：Python。Tableau\
  \ 通过 TabPy 为 Python 提供类似的集成层。\n\n## Python 安装与集成\n\nPython 是一种解释型编程语言，以其可读性而闻名。首个版本发布于\
  \ 1991 年，即相当久以前（比大多数人猜测的时间更长），并由 Guido van Rossum 开发。TabPy 是一项外部服务，允许您连接 Python\
  \ 和 Tableau——类似于 Rserve。您可以通过使用 TabPy，将 Tableau 仪表板中的字段解析到 Python 中，执行计算，并将结果作为新的计算字段发送回\
  \ Tableau。或者，您也可以在计算字段中调用您在 Python 中实现的函数。关于 TabPy 的更详细文章可在此处找到：https://www.datacamp.com/tutorial/how-to-run-python-in-tableau-with-tabpy\n\
  \n安装 Python 通常并不困难，但不仅仅是双击可执行文件那么简单。您可能需要安装某些库并在命令行上执行命令，才能成功将 Tableau 与 Python\
  \ 连接起来。以下段落将指导您完成此过程。\n\n### Python 3.11 支持\n\nTabPy 现在支持 Python 3.11，带来性能改进和对最新\
  \ Python 功能的访问。文档已相应更新。如果您是从头开始，我建议安装 Python 3.11 或更高版本，以确保与最新库和安全更新兼容。\n\nTabPy\
  \ 2.0 版本包含几项重要增强功能：\n\n- Python 3.11 支持 – 与 Python 3.11 完全兼容，确保访问最新语言功能和安全更新。\n\
  - 已更新依赖项 – 所有底层库已更新到其最新版本，改进性能和安全性。\n- 部署简化 – 模型部署流程已优化，使部署和管理自定义模型更加容易。\n- 更好的错误处理\
  \ – 当 Python 脚本出现问题时，提供更详细的错误消息，帮助您更快调试。\n\n这些改进使 Tableau-Python 集成比以往任何时候都更加强大且更易于使用。\n\
  \n安装 Python 的最简单方法是执行以下步骤：\n\n- 1. 使用带 Python 3.11 版本的 Anaconda（您至少需要 Python 3.7）：https://www.anaconda.com。任何其他\
  \ Python 解释器也可用。要集成 Python 和 Tableau，需要一些额外步骤：\n\n- 2. 例如，在 Anaconda 中打开 Jupyter\
  \ Notebook 并编写：\n\n```\n!pip install tabpy\n```\n\n或者，在 Python 目录的命令行或 Terminal（Mac）中执行以下命令：\n\
  \n```\npip install tabpy\n```\n\n- 3. 通过命令行或 Terminal（Mac）导航到安装 TabPy 的目录，并在命令行或\
  \ Terminal 界面中输入 tabpy：\n\n![](img/66cf6b89349fda3581a4f196cb3c98a4_649_0.png)\n\
  \n图 14.27：启动 TabPy\n\n> 注意\n> 出于安全原因，请务必使用用户名和密码。\n\n- 4. 您现在已连接到 tabpy 服务器，在同时运行\
  \ Tableau 和 Python 时必须保持该服务器打开\n\n- 5. 如果您遇到 TabPy 的任何其他问题，例如版本不兼容，快速在 Google 上搜索将大有帮助\n\
  \n- 6. 打开 Tableau，选择 帮助 | 设置和性能 | 管理分析扩展连接，为 Server 选择 localhost，并为 Port 输入 9004：\n\
  \n\n\n![](img/66cf6b89349fda3581a4f196cb3c98a4_650_0.png)\n\n图 14.28: Analytics\
  \ Extension 连接\n\n- 7. 如前一张截图所示，如果您有任何安全顾虑或需要进行更大规模的企业级部署，可以设置用户名、密码和 SSL。\n\n-\
  \ 8. 单击 Test Connection，您应该会看到以下弹出窗口：\n\n![](img/66cf6b89349fda3581a4f196cb3c98a4_650_1.png)\n\
  \n图 14.29: 测试分析扩展\n\n有关如何启动和运行 TabPy 的完整文档，可在 https://github.com/tableau/TabPy 上找到。如果您不想或无法在本机上安装\
  \ TabPy，Tableau 还提供了一个 Docker 容器，它将安装最新版本的 TabPy。更多信息请见：https://hub.docker.com/r/emhemh/tabpy/.\n\
  \n## 实现 Python 功能\n\n就像 R 一样，TabPy 使用 Tableau 中的 SCRIPT_ 函数。在接下来的章节中，我们将练习使用 TabPy\
  \ 并探讨多个用例。使用 TabPy 的 Tableau 计算与 R 的计算非常相似。对于 TabPy，重要的是要向计算字段添加 return 语句，并注意参数使用下划线而不是点来表示：\n\
  \n![](img/66cf6b89349fda3581a4f196cb3c98a4_651_0.png)\n\n图 14.30: Python TabPy 语法\n\
  \n这将在接下来的练习中体现；我们将首先探讨随机数生成器。\n\n### 随机数和正态随机数\n\n许多计算可以通过计算字段轻松访问，另一些则通过表计算访问——还有一些隐藏函数。之所以隐藏，是因为这些函数尚未（完全）得到支持或测试；因此，请谨慎使用。例如，如果您尝试查找\
  \ Random 函数，将找不到它。但您仍然可以使用 Random() 函数，如下所示：\n\n![](img/66cf6b89349fda3581a4f196cb3c98a4_651_1.png)\n\
  \n图 14.31: 随机数\n\n另一种选择是使用 TabPy 获取 Random 函数。我们将探讨随机数和正态随机数，并使用变量 mu 和 sigma。这将使我们能够从分布中绘制随机数，这种方法常用于统计学和定量建模等领域，用于模拟、复现或计算概率；mu\
  \ 和 sigma 分别是定义分布的均值和标准差。\n\n### 生成随机数\n\n执行以下步骤，创建具有特定底层分布（由均值和标准差定义）的随机变量点云：\n\
  \n- 1. 创建一个包含一个 Index 列和编号为 1-1,000 行的 Excel 表。这是为了拥有包含我们想用于随机数生成器的行数的初始数据集。\n-\
  \ 2. 保存文件并将 Tableau 连接到此 Excel 表。您应该会看到一个名为 **索引** 的导入度量值（就像 Excel 文件中的标题一样）。\n\
  - 3. 如 *Python 安装和集成* 中所述，将 Tableau 连接到 Python。\n\n- 4. 创建一个名为 Random 的计算字段，应如下所示：\n\
  \n```\nSCRIPT_REAL(\"\nfrom numpy import random as rd\nreturn rd.random(_arg1[0]).tolist()\"\
  ,\nSIZE()\n)\n```\n\n- 5. 将 **索引** 拖到 **行**，将 **随机数** 拖到 **列**\n- 6. 在 **分析** 选项卡上禁用\
  \ **聚合度量值**\n\n![](img/66cf6b89349fda3581a4f196cb3c98a4_652_0.png)\n\n图 14.32: 随机数可视化\n\
  \n在上述截图中，您可以看到 1,000 个随机数据点。让我们来看看本练习中用于生成此可视化效果的一些代码：\n\n| SCRIPT_REAL | 此 Tableau\
  \ 函数调用 Python 引擎并返回浮点值。 |\n|---|---|\n| \"from numpy import random as rd | 在代码的这一部分中，我们需要\
  \ Python 库 numpy，并从该库中需要 random 模块，我们将使用较短的名称 rd 加载它。 |\n| return | 此命令仅用于返回值。 |\n\
  | rd.random(_arg1[0]).tolist()\" | 在此步骤中，我们调用之前导入的 rd 模块。从 rd 模块中，我们检索 random 函数。_arg1[0]\
  \ 用于在给定某个值时激活该函数。最后，我们通过添加 .tolist() 将所有检索到的值放入值列表中。 |\n| SIZE() | 这是将替换 _arg1 的值，而\
  \ _arg1 是随机函数所需的。我们使用 SIZE() 来满足此要求，因为它将返回分区中的行数，足以为函数返回一个随机数。 |\n\n表 14.3: 代码快速回顾\n\
  \n我们恰好得到了 1,000 个数字，因为我们的初始 Excel 表有 1,000 行。通过使用计算字段，您可以向数据框添加列，但不能添加行。因此，我们需要一个能提供数据架构的数据源。在下一节中，我们将学习如何指定从正态分布中抽取的随机数。\n\
  \n### 正态随机数\n\n现在，让我们复现一个服从正态分布的随机变量。这种技术常用于统计建模中以计算概率。正态随机数值可以替代您已收集的观测值，或与之一起使用。一旦了解如何使用正态分布，您就可以扩展此知识，并在\
  \ Tableau 中创建其他分布：\n\n- 1. 重复使用上一练习中的工作簿\n- 2. 创建名为 Random Normal 的计算字段：\n\n```\n\
  SCRIPT_REAL(\"\nfrom numpy import random as rd\nmu, sigma = 0, 1\nreturn (rd.normal(mu,\
  \ sigma, _arg1[0])).tolist()\n\",\nSIZE()\n\n)\n```\n\n- 3. 将 Random Normal 放置于\
  \ Columns，将 Index 放置于 Rows\n\n- 4. 在 Analysis 选项卡上禁用 Aggregate Measures\n\n- 5.\
  \ 选择标记类型为 Circle。您现在可以看到一个带有 1,000 个正态分布数据点的图：\n\n![](img/66cf6b89349fda3581a4f196cb3c98a4_654_0.png)\n\
  \n图 14.33: 正态分布可视化\n\n- 6. 为了给用户提供更多灵活性，您还可以向视图添加与 Python 集成交互的参数。例如，创建以下两个参数：\n\
  \n![](img/66cf6b89349fda3581a4f196cb3c98a4_654_1.png)\n\n图 14.34: sigma 和 mu 参数\n\
  \n- 7. 然后，创建名为 Random Normal Param 的计算字段，如下所示：\n\n```\nSCRIPT_REAL(\"\nfrom numpy\
  \ import random as rd\nmu, sigma = _arg2, _arg3\nreturn (rd.normal(mu, sigma, _arg1[0])).tolist()\n\
  \",\nSIZE(), [mu], [sigma]\n)\n```\n\n- 8. 将参数控件添加到您的视图中，以便用户可以决定要传递给 Python 的变量：\n\
  \n![](img/66cf6b89349fda3581a4f196cb3c98a4_655_0.png)\n\n图 14.35: 最终正态分布工作表\n\n\
  与我们之前使用正态分布的可视化效果相比，您可以在上述截图中看到，通过将 mu 参数更改为 10，我们将均值更改为 10，从而可以将整个点云向任何方向移动。由于随机数可在\
  \ Tableau 中使用，您例如可以可视化蒙特卡洛模拟，它在许多实际应用中都很有用，因为它可以模拟可能的概率结果，从而帮助利益相关者了解风险和不确定性的影响。\n\
  \n> **注意**\n>\n> 有关如何在 Tableau 中计算蒙特卡洛模拟的更多信息，请见 -- https://jacksontwo.com/exploring-python-tableau\
  \ – 更多一般性蒙特卡洛内容请见：https://www.ibm.com/topics/monte-carlo-simulation.\n\n在继续之前，让我们再次考虑本练习中使用的一些关键代码行：\n\
  \n| SCRIPT_REAL | 此 Tableau 函数调用 Python 引擎并返回浮点值。 |\n|---|---|\n| \"from numpy import\
  \ random as rd | 在代码的这一部分中，我们需要 Python 库 numpy，并从该库中需要 random 模块，我们将使用较短的名称 rd 加载它。\
  \ |\n| mu, sigma = _arg2, _arg3 | 此部分定义我们将使用 _arg2 和 _arg3 来引用 mu 和 sigma。 |\n|\
  \ return | 此命令仅用于返回值。 |\n| rd.normal(mu, sigma, _arg1[0]).tolist() | 在此步骤中，我们调用之前导入的\
  \ rd 模块。从 rd 模块中，我们检索 random 函数。_arg1[0] 用于在给定某个值时激活该函数。可选值为 mu 和 sigma。这次，我们也将使用这两个值。最后，我们通过添加\
  \ .tolist() 将所有检索到的值放入值列表中。 |\n| SIZE(), [mu], [sigma] | 这是将替换 _arg1、_arg2 和 _arg3\
  \ 的值。与之前一样，我们使用 SIZE() 来激活函数。可选值 mu 和 sigma 将指向我们之前创建的参数。 |\n\n表 14.4: 代码快速回顾\n\n\
  在使用 TabPy 完成前两个练习后，我们学习了如何在 Tableau 中使用随机数。接下来，我们将随机数更改为从正态分布中抽取的随机数，并向仪表板添加了参数，以便用户可以更改正态分布的\
  \ mu 和 sigma。当然，您还可以将 TabPy 中的函数更改为其他分布。\n\n下一个主题更高级。我们将使用 TabPy 对 2003 年至 2021\
  \ 年的报纸标题进行情感分析。\n\n\n\n\n\n## 计算情感分析\n\n与机器学习和人工智能一起，另一个术语正在越来越多地被使用：**自然语言处理（NLP）**。这是机器理解单词及其含义的过程。情感分析属于这一类别；该技术有不同的变体，但其中一种是衡量极性，也就是说，说话者持有正面或负面的看法。用例包括，例如，评论、推文、评论、情节、歌词等数据集。让我们来看看！\n\
  \n此练习基于Brit Cava的想法，他使用了Makeover Monday中前100首歌曲歌词的数据来尝试Tableau-Python集成。你可以在此处找到博客文章：https://www.tableau.com/about/blog/2016/12/using-python-sentiment-analysis-tableau-63606。让我们使用这个包含一百万条新闻标题的澳大利亚广播公司数据集来复现它：https://www.kaggle.com/datasets/therohk/million-headlines。\n\
  \n- 1. 导航到与章节关联的工作簿中的情感分析选项卡\n- 2. 连接到 Headlines 数据源\n- 3. 将 Tableau 连接到 Python\n\
  - 4. 创建情感得分计算字段。格式（例如，缩进文本）非常重要：\n\n```\nSCRIPT_REAL(\"\nfrom nltk.sentiment import\
  \ SentimentIntensityAnalyzer\ntext = _arg1\nscores = []\nsid = SentimentIntensityAnalyzer()\n\
  for word in text:\n    ss = sid.polarity_scores(word)\n    scores.append(ss['compound'])\n\
  return scores\n,ATTR([headline_text]))\n```\n\n- 5. 创建颜色编码计算字段：\n\n```\nIIF ([Sentiment\
  \ Scores] >= 0, 'Positivity', 'Negativity')\n```\n\n- 6. 将 publish_date 放置在 **行**\
