  \n图 8.32: Inkscape II\n\n如果出于某种原因您的代码未能创建网格，或者您想改用我创建的版本，可以在以下 GitHub 页面中找到 SVG\
  \ 文件以及所有其他数据集：https://github.com/PacktPublishing/Mastering-Tableau-2026/tree/main/Chapter08。\n\
  \n我们将在下一个练习中介绍如何在 Tableau 中将网格用于多边形数据源的示例。\n\n## 使用网格生成数据集\n\n熟练的棋手大约需要 40 步即可完成一场比赛。在国际象棋锦标赛中，每场比赛的数据都会被常规记录，这为数据可视化提供了机会。在本练习中，我们将使用国际象棋比赛的数据来可视化棋盘每个方格被占用的频率：\n\
  \n- 1. 在本章关联的工作簿中，导航到名为 Chessboard 的工作表\n\n- 2. 如果尚未下载，请从此书的 GitHub 存储库下载 Chessboard.png\
  \ 图片\n\n- 3. 在 Inkscape 中打开上一个练习中创建的 SVG 文件\n\n> **注意**\n>\n> 如果您未完成上一个练习，可以复制本章关联的解决方案工作簿中仪表板上名为“生成的\
  \ SVG 代码”的 XML 代码。将该代码粘贴到文本编辑器中并以 SVG 扩展名保存，然后使用 Inkscape 打开该文件。\n\n- 4. 在 Inkscape\
  \ 中，按 Ctrl + A（Mac 为 Command + A）全选。使用 Ctrl + G（Mac 为 Command + G）对选定内容进行分组。\n\n\
  - 5. 在 Inkscape 菜单中，选择 图层 | 图层和对象。键盘快捷键为 Shift + Ctrl + L（Mac 为 Shift + Command\
  \ + L）。\n\n- 6. 在屏幕右侧显示的图层调色板中，按 + 图标创建一个图层。将图层命名为 Chessboard。然后，再创建一个名为 Grid 的图层\n\
  \n![](img/66cf6b89349fda3581a4f196cb3c98a4_353_0.png)\n\n图 8.33: 图层\n\n- 7. 单击视图中的任意线条或数字。右键单击同一线条或数字，然后选择“移动到图层”。选择\
  \ Grid 图层。\n\n- 8. 选择 文件 | 导入 并选择 Chessboard.png 图片\n\n\n\n\n\n![](img/66cf6b89349fda3581a4f196cb3c98a4_354_0.png)\n\
  \n### 图 8.34：图像导入\n\n- 9. 确保图像放置在棋盘图层上，以免位置代码数字被遮挡。将棋盘图像定位，使位置代码 81 居中于棋盘左上角的方格。由于棋盘仅由\
  \ 64 个方格组成，因此它不会涵盖网格提供的全部 100 个方格\n\n![](img/66cf6b89349fda3581a4f196cb3c98a4_354_1.png)\n\
  \n### 图 8.35：棋盘\n\n此时，你可以根据每个位置被占用的频率生成数据集。例如，你可能会注意到在某一局棋中，位置 81 被占用了 40 步，这种情况下玩家可能只是从未移动过那辆车。然而，在另一局棋中，该位置可能仅被占用了\
  \ 10 步，这或许表明玩家在比赛早期进行了易位。将棋局与方格文件分层的目的是识别哪个方格属于棋盘上的哪个字段。\n\n## 可视化棋局\n\n在本练习中，我们将查看从棋局生成的数据集，并了解如何基于之前练习所做的工作来可视化结果。为了按照步骤操作，你需要下载与本章相关的资源。为此，只需单击本书\
  \ GitHub 仓库的链接：https://github.com/PacktPublishing/Mastering-Tableau-2026/tree/main/Chapter08。\n\
  \n以下是步骤：\n\n- 1. 在与本章关联的工作簿中，导航到名为 Chessboard 的工作表并选择 Chessboard 数据源\n- 2. 右键单击\
  \ Chessboard 数据源并选择“编辑数据源”以检查数据集\n- 3. 在询问“数据文件在哪里？”的对话框中，定位到与本章相关资源中提供的 Chessboard.xlsx\
  \ 文件\n- 4. 名为 **棋盘网格** 的表包含每个位置代码及其关联的 X 和 Y 坐标。该数据集取自本章前面创建的 **位置代码** 工作表。名为 **已占用方格**\
  \ 的表包含字段 **位置代码** 和 **已占用移动次数**。“棋盘网格”和“已占用方格”通过在 **位置代码** 上进行左连接相连。\n\n![](img/66cf6b89349fda3581a4f196cb3c98a4_355_0.png)\n\
  \n### 图 8.36：连接\n\n- 5. 在 Chessboard 工作表中，选择 Map | 背景图像 | Chessboard\n- 6. 在弹出的对话框中，单击“添加图像”以添加背景图像\n\
  - 7. 如图所示填写“编辑背景图像”对话框\n\n![](img/66cf6b89349fda3581a4f196cb3c98a4_356_0.png)\n\n\
  ### 图 8.37：棋盘背景图像\n\n- 8. 分别将字段 X、Y（均设为维度）和位置代码放置在列、行和详细信息卡片上，并将 **已占用移动次数** 字段放置在\
  \ **颜色** 上，同时将标记类型选择为 **密度**\n\n![](img/66cf6b89349fda3581a4f196cb3c98a4_357_0.png)\n\
  \n### 图 8.38：棋盘背景图像 II\n\n- 9. 右键单击 X 和 Y 轴，并将两者均设置为 **固定**，**固定起始**值为 **0**，**固定结束**值为\
  \ **875**\n- 10. 编辑 **Y** 轴并将其设置为 **反转**。不要反转 **X** 轴。\n- 11. 根据需要调整 **颜色**、**大小**、**形状**\
  \ 等：\n\n![](img/66cf6b89349fda3581a4f196cb3c98a4_357_1.png)\n\n### 图 8.39：棋盘\n\n\
  执行此最后一步是因为数据已结构化，以镜像大多数图形工具中的默认 X 和 Y 坐标设置。在这些工具中，左上角是 X 和 Y 均等于 0 的位置。\n\n在截图中，圆圈越亮，该空间被移动占用的频率越高。圆圈越暗，占用频率越低。将鼠标悬停在字段上方时，也会显示占用量。\n\
  \n总结一下，我们首先创建了一个 SVG 文件。我们是这样做的：根据 SVG 文件的标准，创建了三种不同的代码类型，即标头、位置代码和线条。然后，我们将这三段代码复制到文本编辑器程序中，并将其另存为\
  \ SVG 文件。接着，我们下载了 Inkscape 应用程序并打开了 SVG 文件，以检查并查看我们工作的结果，即一个 10×10 的方格场。\n\n我们将一张棋盘图像添加到\
  \ Inkscape 并将两者对齐。现在，我们可以看到哪个方格编号将与哪个棋盘字段相关联。就像书架示例一样，有必要识别形状 ID，即棋盘字段 ID。基于棋盘字段\
  \ ID，我们能够生成第二个数据集，其中包含字段被占用的移动次数。通过将 Board Grid 数据集与 Occupied Moves 数据集相连，我们得到了一个用例。我们将一张棋盘背景图像添加到\
  \ Tableau，并在其上绘制了方格，并根据棋局中这些字段被占用的移动次数对其进行着色和大小调整。当然，这些数字因棋局而异，但通过收集多局棋的数据，我们能够直观地分析棋策略，甚至可能判断谁是更好的棋手。如果你喜欢国际象棋，欢迎尝试一下，比较每局不同的可视化结果，或者看看自己通常是否最终呈现相同的模式，以及你的对手是否也是如此。\n\
  \n说到游戏，在下一个练习中，我们将可视化飞镖靶。这个练习将比棋局练习更短。请按照步骤操作，了解更多关于多边形的知识。\n\n## 在背景图像上创建多边形\n\n\
  在可视化中利用特定点上的形状对于之前的练习已经足够，但有时使用多边形来勾勒形状可能更有优势。在本节中，我们将在背景图像上利用多边形，并且与书籍示例不同，我们将填充区域，以至于不再（那么）需要背景图像。\n\
  \n以下是所需步骤：\n\n- 1. 在与本章关联的工作簿中，导航到名为 Dashboard - Polygon 的工作表并选择 Dartboard_W_Polygon\
  \ 数据源\n\n**注意：** 如果在完成上一个练习时尚未下载，请下载 GitHub 上提供的图像。将内容解压到你选择的目录中。\n\n- 3. 选择 Map\
  \ | 背景图像 | Dartboard - Polygon。在背景图像对话框中，选择添加图像。如图所示填写对话框\n\n![](img/66cf6b89349fda3581a4f196cb3c98a4_359_0.png)\n\
  \n### 图 8.40：飞镖靶背景图像\n\n- 4. 使用以下配置创建参数：\n\n![](img/66cf6b89349fda3581a4f196cb3c98a4_359_1.png)\n\
  \n### 图 8.41：参数\n\n- 5. 此参数将用于在玩家 1：**Matthew** 和玩家 2：**David** 之间切换，或显示两人的飞镖命中情况\n\
