  \ String 类型，并将剪贴板中的所有字段名称粘贴到这两个参数中。为此，我在 Excel 中打开输入文件，将标题行转置为列，并按 Ctrl + C。现在可以通过“从剪贴板粘贴”选项将数据粘贴到参数中。这样可以节省时间并降低出错率：\n\
