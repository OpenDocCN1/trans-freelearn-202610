  \ route_short_name, route_type |\n| trips.txt | 每条路线的单独行程 | trip_id, route_id |\n\
  | stop_times.txt | 每个行程到达每个站点的时间 | trip_id, stop_id, arrival_time, departure_time,\
  \ stop_sequence |\n| calendar.txt | 每个行程运行的日期 | service_id, Monday, Tuesday, 等等\
  \ |\n| calendar_dates.txt | 异常（假期、特殊服务） | service_id, date, exception_type |\n|\
  \ frequencies.txt | 基于频率的服务（如果使用） | trip_id, start_time, end_time, headway_secs\
  \ |\n| transfers.txt | 站点之间的换乘时间 | from_stop_id, to_stop_id, transfer_type |\n|\
  \ agency.txt | 运输公司 | agency_name, agency_url |\n| feed_info.txt | 关于馈送的元数据 | feed_publisher_name,\
  \ feed_version |\n\n表 9.1：CSV 文件\n\n\n\n| 左表 | 右表 | 关系 |\n| --- | --- | --- |\n\
  | stops | stop_times | 原始停靠站 ID = 停靠站 ID |\n| stop_times | trips | 行程 ID = 行程 ID\
  \ |\n| trips | routes | 路线 ID = 路线 ID |\n\n表 9.2: 文件及其关系\n\n为了获得更好的性能，现在可以在数据源页面上创建提取。\n\
