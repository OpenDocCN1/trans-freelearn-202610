  \n## 添加轴分布\n\n我们已经有所起步，但现在我想在散点图旁边添加 x 轴和 y 轴的分布图。我执行以下步骤：\n\n- 1. 我从 x 轴开始，打开另一张工作表，并将\
  \ X 轴拖至 行。接下来，我单击刚添加的 **绿色药丸 X 轴**，并选择 **度量值 | 计数**。现在，在数据窗格中右键单击 **X 轴** 并选择 **创建\
