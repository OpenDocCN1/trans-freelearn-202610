  \n## 介绍 LODs\n\nTableau 的默认行为是根据视图中也存在的维度显示视图中的度量值。如果您有一个带有 Sales 数据和 State、City\
  \ 等维度的仪表板，并将 State 和 Sales 数据拖动到视图上，则 Sales 数据将按 State 分为，显示每个 State 的 Sales。如果您想将\
  \ Sales 数据进一步划分为更小的块，可以添加 City 字段，从而得到每个 State 下每个 City 的 Sales 数据。LODs 可以操纵这种默认行为。\n\
  \n完成本章后，您将能够按视图中不存在的维度划分或分区度量值，并使用比视图中可见的维度更少的维度来显示度量值。\n\n为此，我们将构建和使用两个 **playgrounds**。按职责交付所需报告可能会导致对有限功能集的深入了解；也就是说，深入但狭窄的理解。要抽出时间（并证明该时间合理）来探索\
