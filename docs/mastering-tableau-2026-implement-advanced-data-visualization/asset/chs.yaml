  \n### 图 4.42: 使用计算对象\n\n迄今为止我们取得了什么成果？我们创建了一个重复的数据结构，允许我们在两个独立的列中比较两个国家，尽管原始数据集中的数据只在一列。这种设置使我们能够提出更高级的问题。\n\
  \n为了演示这一点，让我们来问：*印度的人口何时会超过中国*？您可以按需设置参数——我选择 0.45% 和 1.20% 作为平均年度增长率，但您可以自由选择任何您认为对某个国家最合适的参数。在图\
  \ 4.43 中，您可以看到，当中国和印度的增长率分别为 0.45% 和 1.20% 时，印度到 2024 年的人口将超过中国。您可以通过查看 **A 国人口**\
  \ 和 **B 国人口** 列来观察这一点。橙色表示预测，蓝色表示来自我们数据集的实际数据：\n\n![](img/66cf6b89349fda3581a4f196cb3c98a4_177_0.png)\n\
  \n### 图 4.43: 预测仪表板\n\n我们显然已经领先多年；如果我告诉您，2020 年中国的人口为 1,439,323,776，印度的人口为 1,380,004,385，您能否使用这个仪表板找出\
  \ 2012 至 2020 年中国和印度的实际平均增长率？在 Tableau Public 上分享您的结果，并使用 #MasteringTableau 标签！\n\
  \n本练习的关键之一是数据支架（data scaffolding）。数据支架会生成数据源中不存在的数据。World Indicators 数据集仅包含 2000\
  \ 至 2012 年的日期，显然，Records 数据集不包含任何日期。通过使用 Start Date 和 End Date 参数结合计算的 Date 字段，我们能够生成所需的任何日期集。我们不得不混合数据，而不是使用连接或合并，以保持原始数据源完整，并在\
  \ World Indicators 本身之外创建所有其他数据。\n\n实际的数据支架发生在将 Date 字段放置于“行”货架后，从 Date 字段下拉列表中选择“显示缺失值”。这使得\
  \ Start Date 和 End Date 之间的每一年都能显示，即使底层数据中没有匹配的年份。第 6 章“利用 OData、数据致密化、大数据和 Google\
  \ BigQuery”将更详细地探讨与数据支架（即数据致密化）非常相似的内容。\n\n让我们更深入地研究本练习中的几个计算字段，以更好地了解预测的工作原理：\n\
  \n- **实际/预测：**\n\n```\nIIF(ISNULL(AVG([World Indicators].[Population Total])),\"\
  Forecast\",\"Actual\")\n```\n\n上述代码用于确定 **世界指标** 数据集中是否存在数据。如果日期在 2012 年之后，则不存在数据，因此返回\
  \ Forecast。\n\n- **A 国人口：**\n\n```\nIF [Actual/Forecast] = \"Actual\" THEN SUM([World\
  \ Indicators].[Country A Population]) ELSE PREVIOUS_VALUE(0)\n* [Select Country\
  \ A Forecast] + PREVIOUS_VALUE(0) END\n```\n\n如果需要预测来确定值（即日期在 2012 年之后），则会执行此代码的\
  \ ELSE 部分。PREVIOUS_VALUE 函数返回上一行的值，将结果乘以预测值，然后加上上一行。\n\n让我们看下表中的示例：\n\n- 上一行值 (PRV)：1,000\n\
  - 预测 (F)：0.01\n- PRV * F：0\n- 当前行值：1,010\n\n在 **A 国人口** 计算字段中需要注意的一个重要事项是，预测非常简单：将上一个人口乘以给定的预测数字并汇总结果。在不更改逻辑整体结构的前提下，这段代码可以使用更复杂的预测进行修改。\n\
  \n这些练习表明，借助一些其他技巧和技术，数据混合在您的数据项目中可以发挥巨大作用。最后，我们将总体讨论数据结构，以便您更好地理解 Tableau 正在做什么以及如何实现可视化目标。\n\
  \n## 理解数据结构\n\n合适的数据结构不易定义。诚然，有一些基本规则。例如，长格式数据通常优于宽格式数据。列众多的宽数据集可能难以处理，而相同数据若结构化为列较少但行更多的长格式，通常更易于处理。\n\
  \n然而，情况并非总是如此！某些业务问题更容易用宽数据结构来回答，这就是问题的关键所在。业务问题决定了合适的数据结构。如果一种结构能回答所有问题，那很好！然而，您的问题可能需要多种数据结构。Tableau\
  \ 中的 **透视** 功能可帮助您即时调整数据结构，以回答不同的业务问题。\n\n\n\n\n\n开始此练习前，请确保您理解以下几点：\n\n- Tableau\
  \ 中的数据透视仅限于 Excel、文本文件和 Google Sheets；否则，您必须使用自定义 SQL 或 Tableau Prep\n- 在数据库术语中，Tableau\
  \ 中的透视称为取消透视（unpivot）\n\n现在我们已经澄清了 Tableau 中透视的工作原理，请想象这个场景：作为一家医院的业务分析师，您正将 Tableau\
  \ 连接到患者数据的每日快照。您有两个问题：\n\n- 任何给定日期发生了多少事件？例如，有多少患者在某一天入院？\n- 事件之间过去了多少时间？例如，患者在医院多天住院的平均时长是多少？\n\
  \n要回答这些问题，请执行以下步骤：\n\n1. 在与本章相关的入门工作簿中，选择 Time Frames 工作表，并在数据窗格中选择 Patient_Snapshot\
  \ 数据源。\n2. 单击标记卡中的下拉菜单，并选择条形图作为图表类型。\n3. 在数据窗格中右键单击以创建名为 Select Time Frame 的参数，设置如下截图所示：\n\
  \n![](img/66cf6b89349fda3581a4f196cb3c98a4_179_0.png)\n\n图 4.44: 参数\n\n4. 右键单击刚刚创建的参数并选择显示参数。\n\
  5. 在数据窗格中右键单击以创建名为 Selected Time Frame 的计算字段，使用以下代码：\n\n```\nCASE [Select Time Frame]\n\
  WHEN 1 THEN DATEDIFF('day',[Check-in Date],[Discharge Date])\nWHEN 2 THEN DATEDIFF('day',[Surgery\
  \ Date],[Discharge Date])\nWHEN 3 THEN DATEDIFF('day',[Check-in Date],[Surgery Date])\n\
  END\n```\n\n6. 将患者类型字段拖动到过滤器货架并选中住院患者。\n7. 将入院日期字段拖动到过滤器货架并选择日期范围。另外，右键单击生成的筛选器并选择显示筛选器。\n\
  8. 右键单击入院日期并拖动到列货架，选择月日年。\n9. 右键单击选定时间范围并拖动到行货架，选择平均值。\n10. 右键单击选定时间范围并拖动到颜色货架，选择平均值。按需设置颜色。\n\
  11. 执行这些操作后，您的工作表应如下所示：\n\n![](img/66cf6b89349fda3581a4f196cb3c98a4_180_0.png)\n\
  \n图 4.45: 初始仪表板\n\n12. 右键单击 **选定时间范围平均值** 轴并选择 **编辑轴...**，如下截图所示。然后，删除标题：\n\n时间范围：住院时长\n\
  \n![](img/66cf6b89349fda3581a4f196cb3c98a4_181_0.png)\n\n图 4.46: 编辑轴...\n\n13. 选择\
  \ **工作表 | 显示标题**。通过插入 **选定时间范围** 参数来编辑标题，如下截图所示：\n\n![](img/66cf6b89349fda3581a4f196cb3c98a4_182_0.png)\n\
  \n图 4.47: 添加参数\n\n该数据结构非常适合此练习的第一部分。您能够快速创建可视化。唯一中等难度的部分是设置与相关参数关联的 **选定时间范围** 计算字段。\n\
  \n这允许最终用户选择他们想要查看的时间范围：\n\n![](img/66cf6b89349fda3581a4f196cb3c98a4_183_0.png)\n\
  \n图 4.48: 仪表板\n\n然而，如果您需要找出每天有多少人参与某种类型的事件，会怎样？\n\n使用当前数据结构来回答这个问题相当困难，因为每个患者一行，且该行中包含多个日期。在图\
  \ 4.49 中，您可以看到差异：右侧是我们当前的数据结构，左侧是将使按天计算事件变得更容易的数据结构：\n\n| 患者 | 事件 | 日期 | | 患者 |\
  \ 事件 A 日期 | 事件 B 日期 | 事件 C 日期 |\n|---|---|---|---|---|---|---|---|\n| U | A | X\
  \ | | U | X | Y | Z |\n| U | B | Y | | V | Y | X | |\n| U | C | Z | | | | | |\n\
  | V | A | Y | | | | | |\n| V | B | X | | | | | |\n\n图 4.49: 患者数据结构\n\n因此，在本练习的第二部分，我们将尝试通过数据透视采用不同的方法：\n\
  \n1. 在与本章相关的入门工作簿中，选择 **按日期的事件** 工作表。\n2. 在 **数据** 窗格中，右键单击 **患者快照** 数据源并选择 **复制**。\n\
  3. 将副本重命名为 **事件**。\n4. 右键单击 **事件** 数据源并选择 **编辑数据源...**:\n\n![](img/66cf6b89349fda3581a4f196cb3c98a4_184_0.png)\n\
  \n5. 执行以下步骤:\n   1. 使用 **Shift** 或 **Ctrl + 单击** 选择所有五个日期字段。\n   2. 为所选字段中的任意一个选择下拉选项，并选择\
  \ **透视**:\n\n![](img/66cf6b89349fda3581a4f196cb3c98a4_184_1.png)\n\n   3. 透视功能将转置行和列，我们将得到类似于图\
  \ 4.49 左侧的数据结构。将透视后的字段重命名为事件类型和事件日期。\n   4. 选择按日期的事件工作表，右键单击，并将事件日期字段拖动到行货架，选择月日年。\n\
  \   5. 在行货架上将事件类型放在事件日期之后。\n   6. 右键单击患者类型并选择显示筛选器。\n   7. 将记录数拖动到列货架。\n\n从此，您的工作表应如下所示：\n\
  \n![](img/66cf6b89349fda3581a4f196cb3c98a4_185_0.png)\n\n图 4.52: 按日期的事件\n\n原始数据结构不太适合此练习；然而，在复制数据源并透视后，按天计算事件的任务变得非常简单，因为我们只能使用三个字段：事件日期、记录数和事件类型。这是主要收获。如果您发现自己在为看似简单的业务问题创建可视化时遇到困难，请考虑透视。\n\
  \n## 使用关系进行跟随式仪表板练习\n\n我们将现在在一个跟随式仪表板练习中应用您的关系知识。我们将使用的数据集来自一个名为 Chinook 的虚构音乐商店。我们将使用艺术家、流派、销售和员工数据。\n\
  \n开始此练习之前，请从 https://www.kaggle.com/datasets/anurag629/chinook-csv-dataset 下载数据。\n\
  \n1. 在 Tableau 中，首先连接到 Artist.csv 文件。\n2. 现在，将 Album.csv 文件拖动到 Artist.csv 文件右侧，直到出现连接线，将两个\
  \ CSV 在关系中链接。使用 ArtistId 字段作为两个数据集之间的连接键。\n\n![](img/66cf6b89349fda3581a4f196cb3c98a4_186_0.png)\n\
