- "# 利用高级分析\n\n本章专注于高级自助分析。自助分析可以被视为一种商业智能形式，鼓励企业中的人们直接在数据集上执行查询，而不是将查询请求作为积压工作提交给\
  \ IT 团队。然后，可以进行查询分析，这应该能带来更多洞察和数据驱动的决策。但是，如果你是第一次这样做，如何开始创建有用的自助仪表板呢？如何从数据集过渡到产品？你是否曾经问过自己，其他人是如何开始处理仪表板、如何清理数据以及如何想出仪表板设计的？如果是这样，那么本章正是适合你！我要与你分享三个用例，以流程思考的方式撰写，让你了解我的工作方式。请注意，这只是我的个人经验；实现目标有许多不同的方法。\n\
  \n我们将涵盖以下主题：\n\n- 可视化世界指数相关性\n- 芝加哥交通违规的地理空间分析\n- 构建交叉路口地图\n- 使用距离度量扩展地理空间分析\n\n\
  在阅读这篇介绍后，让我们开始第一个用例，我们将构建一个探索性仪表板，帮助利益相关者按需比较任意两个指数。\n\n> **注意**\n> \n> 您的购买包含一份免费的\
  \ PDF 副本和独家额外内容\n> \n> 您的购买包含一本 DRM-free 的 PDF 副本、Packt+ 图书馆 7 天试用（无需信用卡）以及其他独家额外内容。请参阅“前言”中的“_随书免费权益_”部分，即可立即解锁它们并最大限度地提升学习效果。\n\
  \n## 可视化世界指数相关性\n\n想象你正在处理世界指数数据集，你的直属经理给你下达了以下任务：为我创建一个仪表板，我可以轻松发现所有相关的世界指数及其分布。我明天早上需要它。\n\
  \n现在，在继续阅读之前，花几分钟思考一下你将如何处理这个任务。该数据集包含 67 个带有各种指数的列，例如出生登记或排放值、出口和进口以及森林面积，分为 188\
  \ 行，每行代表一个国家。\n\n写下你计划的步骤，从 https://github.com/PacktPublishing/Mastering-Tableau-2026/tree/main/Chapter11\
  \ 打开与本章相关的工作簿，并按照你的步骤操作；计时以便更好地了解使用 Tableau 时的时间估计。这样，如果有人问你构建某个仪表板需要多长时间，你可以确保按时交付并管理期望。\n\
  \n## 绘制散点图\n\n现在，我将说明一种我可以想象的解决这个任务的方法：\n\n- 1. 首先，思考如何一次性可视化所有相关性，但又不会信息过载？我有 65\
  \ 个不同的列，这会产生 4,225 种可能的组合。不，我决定显示所有内容行不通。任务非常笼统，因此我决定采用双参数方法，这将使最终用户能够自行选择每个指数组合。我开始勾勒仪表板的可能外观，并想出了以下设计：\n\
