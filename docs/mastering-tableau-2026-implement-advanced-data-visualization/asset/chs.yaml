  \n图 5.11: 排名\n\n让我们考虑一下前一张工作表的工作原理：\n\n- - 如果您按照本练习的逐步说明操作，您会注意到，在将 Region 和 Product\
  \ Name 放置到 Rows 书架并筛选仅显示前三个产品名称后，生成的可视化中每个区域仅显示了两个产品。这是因为 Product Name 上的筛选器显示的是总体前三名产品，但碰巧其中两个总是出现在每个区域。但我们实际上希望按区域显示前三名，而不是总体前三名。为解决此问题，我们使用了\
  \ Rank 表计算函数。\n\n- - 让我们了解其工作原理。无需手动编写 Rank(Sum(Sales)) 函数，只需右键单击任何书架上 Sales 的实例，选择\
  \ Quick Table Calculation | Rank，即可自动生成相同代码。请注意，Rank 正在计算每个区域内的产品名称数量。这表明 Rank 表计算对缓存/分区中的数据集进行方向性操作。\n\
  \n实际场景：当我想要过滤不断变化的视图（并将其划分为子部分）时，我会使用 Rank —— 例如，我博客文章上每篇文章的最后三条评论。或者，当我想要展示随时间变化的行为时，例如过去\
  \ 2 年内排名前 10 的产品。这将生成一个排名漂移图。\n\n## 大小\n\n以下工作表的目标是显示 Superstore 数据集中拥有五个或更少城市的所有州。本示例将演示\
  \ SIZE 如何利用缓存中的整个分区/数据集，因此具有非方向性。我们还将使用 FIRST 表计算函数（具有方向性）来清理视图。\n\n请按以下步骤操作：\n\n\
