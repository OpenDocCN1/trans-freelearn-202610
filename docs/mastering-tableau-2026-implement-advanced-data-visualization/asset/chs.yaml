  \n- 6. 现在创建一个名为情感类别的计算字段，以对情感分数进行分类：\n\n```\nIF [Sentiment Polarity] > 0.1 THEN\
  \ \"Positive\"\nELSEIF [Sentiment Polarity] < -0.1 THEN \"Negative\"\nELSE \"Neutral\"\
  \nEND\n```\n\n- 7. 现在让我们创建一个内联 Python 计算（如您章节中的情感分析示例），以计算评论长度和复杂度。我们将此计算字段命名为评论文本统计：\n\
  \n```\nSCRIPT_INT(\"\nimport pandas as pd\nimport numpy as np\n\nreviews = _arg1\n\
  ratings = _arg2\n\nresults = []\nfor i in range(len(reviews)):\n    if pd.isna(reviews[i]):\n\
  \        results.append([0, 0])\n    else:\n        text = str(reviews[i])\n   \
  \     word_count = len(text.split())\n        char_count = len(text)\n\n       \
  \ # Calculate complexity score (words per sentence approx)\n        sentences =\
  \ text.count('.') + text.count('!') + text.count('?')\n        if sentences == 0:\n\
  \            sentences = 1\n        words_per_sentence = word_count / sentences\n\
  \n        # Combine metrics into a single complexity score (0-100)\n        complexity\
  \ = min(100, (words_per_sentence * 5) + (char_count / 20))\n\n        results.append([word_count,\
  \ int(complexity)])\n\n# Return as list of lists - Tableau will interpret each element\
  \ separately\nreturn [item[0] for item in results] # Word count\n\",\nATTR([Review\
  \ Text]),\nATTR([Rating])\n)\n```\n\n此脚本演示了内联 Python；整个脚本都位于 Tableau 计算字段内。\n\n\
