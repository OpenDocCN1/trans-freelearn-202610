  \ 选择 **Top 3**：\n\n![](img/66cf6b89349fda3581a4f196cb3c98a4_209_1.png)\n\n图 5.9:\
  \ 筛选器\n\n- 3. 将 Region 和 Product Name 放置到 Rows 书架，将 Sales 放置到 Columns 书架。\n\n- 4.\
  \ 请注意，每个区域仅显示两个项目：\n\n![](img/66cf6b89349fda3581a4f196cb3c98a4_210_0.png)\n\n图 5.10:\
  \ 查看前两个项目\n\n- 5. 创建名为 Rank 的计算字段，代码为 Rank(SUM(Sales))。在 Rows 书架上将 Rank 拖放到 Region\
