  \ 中的第二个选项卡）：\n\n![](img/66cf6b89349fda3581a4f196cb3c98a4_406_0.png)\n\n图 9.29: Join\n\
  \n- 4. 唯一的区别在于第一个连接是在 Origin 和 City 上进行，第二个是在 Destination 和 City 上进行。通过双击名称重命名 latlong\
  \ 数据源以避免混淆：\n\n![](img/66cf6b89349fda3581a4f196cb3c98a4_406_1.png)\n\n图 9.30: Join\
