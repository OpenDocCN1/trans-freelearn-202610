  \ 实例，销售数字将反映多个值。为视图中的每个表计算设置 计算方式 为 表（向下）非常重要。计算方式与 寻址 相同，将在 应用函数 部分中详细讨论。\n\n现实场景：您可以使用此类计算来计算每个季度最后\
  \ 5 个订单之间的时间，以查看订单之间的时间在白天是增加还是减少。然后，这可以帮助改善营销或更高效地安排帮助台工作时间。\n\n## 索引\n\n以下工作表的目标是列出美国底层数据集中拥有超过\
