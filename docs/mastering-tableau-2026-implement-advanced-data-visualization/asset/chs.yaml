  \ 网站向你介绍两者，并允许你在不安装任何软件的情况下在网站上练习编程。\n\n## 跟随操作构建仪表板\n\n在这个全面的练习中，你将构建一个使用 Python\
  \ 分析客户评论的交互式仪表板。你将创建两种类型的 Python 集成：\n\n- * 用于情感分析的部署模型（如糖尿病预测器示例）\n- * 用于文本统计和关键词提取的内联\
  \ Python 计算（如情感分析示例）\n\n到最后，你将拥有一个专业的仪表板，用户可以在其中选择产品、查看随时间变化的情感趋势，并探索客户在说什么——所有这些都由\
  \ Tableau 后台运行的 Python 驱动。\n\n在这个练习中，我们将使用一个客户评论数据集。你可以从 https://github.com/PacktPublishing/Mastering-Tableau-2026\
  \ 下载。\n\n首先，我们将创建并部署一个可以从 Tableau 调用的情感分析模型。这与你章节中的糖尿病预测器遵循相同的模式——我们在 Tableau 之外编写模型并将其部署到\
  \ TabPy。\n\n- 1. 在 Jupyter Notebook 或你偏好的 Python IDE 中运行以下代码。在终端或命令行中找到 .py 文件并运行脚本\n\
  \n```\nfrom tabpy.tabpy_tools.client import Client\nimport pandas as pd\nfrom textblob\
  \ import TextBlob\n```\n\n\n\n\n```python\nimport pickle\nimport os\n\n# Connect\
  \ to TabPy\nclient = Client('http://localhost:9004/')\n\ndef sentiment_analyzer(review_texts):\n\
  \    \"\"\"\n    Analyzes sentiment of customer reviews\n    Returns: polarity score\
  \ (-1 to 1) and subjectivity score (0 to 1)\n    \"\"\"\n    import pandas as pd\n\
  \    from textblob import TextBlob\n\n    results = []\n    for text in review_texts:\n\
  \        if pd.isna(text) or text == \"\":\n            results.append([0.0, 0.0])\
  \ # Neutral for empty reviews\n        else:\n            try:\n               \
  \ blob = TextBlob(str(text))\n                polarity = blob.sentiment.polarity\n\
  \                subjectivity = blob.sentiment.subjectivity\n                results.append([polarity,\
  \ subjectivity])\n            except:\n                # Fallback if TextBlob fails\n\
  \                results.append([0.0, 0.0])\n\n    return results\n\n# Deploy function\
  \ to TabPy\nclient.deploy('sentiment_analyzer',\n              sentiment_analyzer,\n\
  \              'Returns sentiment polarity and subjectivity for customer reviews',\n\
  \              override=True)\n\nprint(\"Models deployed successfully!\")\nprint(\"\
  Check endpoints at: http://localhost:9004/endpoints\")\n```\n\n```\n[marleenmeier@Mac\
