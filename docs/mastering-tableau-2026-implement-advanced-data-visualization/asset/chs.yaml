  \ **分析** 添加两条参考线，并使用以下设置进行编辑：\n\n![](img/66cf6b89349fda3581a4f196cb3c98a4_309_1.png)\n\
  \n![](img/66cf6b89349fda3581a4f196cb3c98a4_309_2.png)\n\n图 7.32：参考线设置\n\n- 3. 查看以下屏幕截图以了解结果。请注意，两条参考线相等：\n\
