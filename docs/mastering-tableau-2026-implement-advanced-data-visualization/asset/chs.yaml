  \ | 运行于 | 源 | 字段 |\n|---|---|---|---|\n\n- 筛选...\n- 高亮...\n- 转到 URL...\n- 转到工作表...\n\
  - 更改参数...\n- 更改设置值...\n\n### 图 10.25: 筛选操作\n\n- 5. 在下一个窗口中，添加一个名为 **映射到表格（数量到利润）**\
