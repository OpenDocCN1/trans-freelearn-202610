  ```\n\n- 8. 双击 Origin 文件中的 City，将出现地图，但你会遇到 12 个未知项。单击错误，然后单击 编辑位置...\n\n![](img/66cf6b89349fda3581a4f196cb3c98a4_408_0.png)\n\
