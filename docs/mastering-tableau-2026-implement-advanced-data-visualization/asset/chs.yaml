  \n## 创建可折叠菜单\n\n请按照以下步骤了解如何将可折叠筛选器菜单添加到您的仪表板中：\n\n- 1. 复制前一个练习中创建的仪表板并将其重命名为 可折叠菜单。如果您未完成前一个练习，请使用本章提供的解决方案工作簿中包含的仪表板。\n\
  \n- 2. 选择仪表板上的任意工作表并单击箭头；选择要显示的筛选器 **国家** 和 **仅年份**\n\n![](img/66cf6b89349fda3581a4f196cb3c98a4_458_0.png)\n\
  \n图 10.20：筛选器\n\n- 3. 两个筛选器将被放置在仪表板右侧的容器中。双击任一筛选器顶部中间的两条水平线，以改为选择容器。周围的线条将显示为蓝色。选择\
  \ **添加显示/隐藏按钮**\n\n![](img/66cf6b89349fda3581a4f196cb3c98a4_459_0.png)\n\n图 10.21：添加显示/隐藏按钮\n\
  \n- 4. 请注意，筛选器旁边可见一个 X。在 **演示模式** 中，现在可以使用此按钮来最小化筛选器：\n\n![](img/66cf6b89349fda3581a4f196cb3c98a4_459_1.png)\n\
  \n图 10.22：国家\n\n在本节中，我们了解到，通过使用容器和筛选器，Tableau 可以自动调整容器中所选工作表的大小。此功能可用于使工作表似乎可以被交换。然而，Tableau\
  \ 基本上只是最小化一个并最大化另一个，尽管这对用户的眼睛不可见。太棒了，不是吗？\n\n完成此练习后，您可能会想，好吧，筛选器在技术上不在仪表板上显示，但它们在侧面仍然可见。在\
  \ Tableau Desktop 中这是事实，但如果您可以将工作簿上传到 Tableau Server 的实例，您会注意到，单击菜单图标时，筛选器会出现和消失，并且不会在侧面显示。\n\
  \n可折叠菜单是一个非常好的附加功能，有助于简化您的仪表板。如果您读过本书的最后第三版，您可能会记得这是一个繁琐的过程——与其说是一个功能，不如说是让可折叠菜单工作的一种变通方法。现在，有了\
  \ 添加显示/隐藏按钮，这简直易如反掌。用户可以专注于数据，仅在需要时使用筛选器。\n\n## 仪表板最佳实践\n\n可视化最佳实践不仅限于可视化功能；操作、筛选器和组织数据同样重要。本节将提及\
  \ Tableau 提供的其中一些功能。它们中的每一个都将帮助您改善用户体验或跟踪您构建的内容——因为，有时，在处理许多不同的工作表时，您可能会迷失方向。\n\n\
  我们将先讨论六种不同类型的操作，然后是下载和导航对象，接着是“使用位置”功能，最后是项目层次结构。它们都有助于更好的仪表板构建体验。让我们开始吧！\n\n##\
  \ 操作\n\n在潜意识中，我们之前多次讨论过这一点，但让我们明确地看看使用操作可以在可视化和仪表板设计方面实现什么。如果您希望用户单击或悬停在可视化的数据上时被重定向，则操作就会发挥作用。如果您有大量数据要展示且不希望全部放在同一个仪表板上，这将很有帮助。您也不应该这样做，因为这会分散注意力，如果数据是层次结构数据，操作是实现下钻技术的完美方式。\n\
  \n以下各部分将解释您可以在 Tableau 中使用的所有不同操作，以添加交互性，支持简洁且高效的仪表板设计。\n\n\n\n\n\n## 筛选操作\n\n在此示例中，我们将使用筛选操作来显示最初隐藏的数据。通过这样做，我们将确保一次呈现较小的数据块，并且用户可以钻取到任意感兴趣的点。请执行以下步骤：\n\
  \n- 1. 请打开工作表“按州划分的数量”\n\n![](img/66cf6b89349fda3581a4f196cb3c98a4_461_0.png)\n\n\
