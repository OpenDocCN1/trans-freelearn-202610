- "# 表计算简介\n\nTableau 中的表计算主题如此丰富深奥，单凭这一点完全可以成为一本书的主题。探索每个表计算函数的各种选项以及表计算的各种应用方式，是一项有趣且有价值的工作。在审阅本章示例时，你无疑会遇到可应用于日常工作的技巧；不过，你可能会难以理解某些技巧为何有效。本章旨在提供思考表计算的方式，这些方式将在你掌握这一迷人主题的旅程中证明很有用。在此过程中，还将考虑一些实际示例。\n\
  \n在为本章审阅的几十篇博客、论坛帖子、会议场次、文章和白皮书中，Jonathan Drummey 的博客文章（http://drawingwithnumbers.artistart.org/at-the-level-unlocking-the-mystery-part-1-ordinal-calcs/）“在层级中\
  \ – 揭示谜团第 1 部分：序号计算”是理解分区和寻址（即表计算的 DNA）的各种细微差别最清晰、最具洞察力的文章。在本章中，我们将讨论以下主题：\n\n-\
  \ 分区和寻址方向\n- 方向性和非方向性寻址\n- 探索每个唯一的表计算函数\n- 函数的应用\n\n让我们深入探讨，并以表计算的一般定义及两个由此产生的问题开始本章，我们将在本章结束时回答这些问题。\n\
  \n你的购买包含免费 PDF 副本 + 专属额外内容\n\n你的购买包含本书的 DRM-free PDF 副本、Packt+ 图书馆 7 天试用（无需信用卡）以及额外的专属内容。请参阅前言中的“随书免费权益”部分，立即解锁并最大化你的学习。\n\
  \n## 分区和寻址方向\n\n如第 1 章“回顾基础知识”中所讨论，计算字段可分为行级别、聚合级别或表级别。对于行级别和聚合级别计算，底层数据源引擎完成大部分（如果不是全部）计算工作，Tableau\
  \ 仅对结果进行可视化。对于表计算，Tableau 同样依赖底层数据源引擎和机器上的可用 RAM 来执行计算任务；不过，在该工作完成并返回数据集后，Tableau\
  \ 在呈现结果之前会进行额外处理。\n\n让我们来看表计算的定义，如下：\n\n表计算是对缓存数据集执行的函数，该缓存数据集是 Tableau 向数据源发出查询后生成的。\n\
  \n此缓存不仅仅是查询返回的结果。Tableau 可能会调整返回的结果。我们将在第 6 章“利用 OData、数据密集化、大数据和 Google BigQuery”中讨论这一点；Tableau\
  \ 可能会通过数据密集化扩展缓存，但通常这是由用户驱动的。在表计算术语中，缓存称为分区。\n\n考虑缓存的结构很重要。缓存中的数据集是工作表中使用的表，像所有表一样，由行和列组成。这一点对于表计算尤其重要，因为表计算可能在沿着缓存移动时计算。`previous_value()`\
  \ 表计算在缓存结构变化时会发生变化，因为它会检索当前值之前的值，而这非常主观。它是按日期、值还是字母顺序排在前面？由你决定使用寻址和分区来告诉 Tableau\
  \ 如何构建缓存。\n\n大多数表计算都需要考虑缓存结构。这种表计算称为方向性表计算。或者，表计算可以基于整个缓存进行计算，而不考虑寻址和分区。例如，`total()`\
  \ 表计算将计算总值，该值在缓存顺序变化时不会改变。另一个例子是 `size()`、`script_` 和 `model_` 函数。这种表计算称为非方向性表计算。\n\
  \n> 请注意，在 Tableau 文档中，缓存中的数据集通常被称为分区。本章的结构旨在提供一个简单的架构，以便理解表计算。\n\n“表计算函数简介”部分探讨了每个唯一的表计算函数。“函数的应用”部分探讨了如何通过分区和寻址维度将表计算应用于视图。\n\
  \n## 方向性和非方向性寻址\n\n我们将通过列出不同的表计算函数来开始本节。\n\nTableau 提供了广泛的表计算，但如果我们将考虑范围缩小到表计算函数的唯一组，就会发现只有\
  \ 11 个：\n\n- LOOKUP\n- PREVIOUS VALUE\n- RUNNING\n- WINDOW\n- FIRST\n- INDEX\n-\
  \ LAST\n- RANK\n- SIZE\n- TOTAL\n- SCRIPT & MODEL\n\n如“分区和寻址方向”一节中所述，表计算函数在缓存上操作，因此如果缓存数据发生变化，结果可能会随之变化，具体取决于表计算的类型：方向性或非方向性。在接下来的练习中，我们将看到方向性和非方向性表计算函数的实际应用。\n\
  \n让我们深入了解方向性和非方向性表计算：\n\n1. 导航至 https://github.com/PacktPublishing/Mastering-Tableau-2026/tree/main/Chapter05\n\
  \   以查找并下载与本章相关的工作簿。\n2. 连接到 Sample – Superstore 数据集。\n3. 创建一个 Directional/Non-Directional\
  \ 工作表。\n\n\n\n\n\n4. 创建计算字段，如下表所示：\n\n| 名称 | 计算 | 说明 |\n|---|---|---|\n| 查找 | LOOKUP(SUM([Sales]),\
  \ -1) | 注意此计算中包含 -1。这指示 Tableau 从上一行检索值。 |\n| 大小 | SIZE() | SIZE 函数返回分区中的行数。因此，如下图所示，大小等于总行数。\
  \ |\n| 窗口求和 | WINDOW_SUM(SUM([Sales])) | 窗口求和函数 (WINDOW_SUM(expression, [start,\
  \ end])) 可以方向性或非方向性地操作。由于本示例不包含 [start, end] 选项，因此它以非方向性方式操作。 |\n| 带起止的窗口求和 | WINDOW_SUM(SUM([Sales]),\
  \ 0,1) | 如 [start, end] 选项的包含所示，此窗口函数示例以方向性方式操作。 |\n| 运行总计 | RUNNING_SUM(SUM([Sales]))\
  \ | 由于 RUNNING 函数在计算时会考虑前一行，因此其本质上以方向性方式操作。 |\n\n5. 将类别和运输方式放在行货架上。\n\n6. 双击销售额、查找、大小、窗口求和、带起止的窗口求和和运行总计，以填充视图，如下图所示：\n\
  \n| 类别 | 运输方式 | 沿表的查找（向下） | 沿表的运行总计（向下） | 销售额 | 沿表的大小（向下） | 沿表的窗口求和（向下） | 带起止的窗口求和\
  \ |\n|---|---|---|---|---|---|---|---|\n| Furniture | First Class | 110,761 | 110,761\
  \ | 110,761 | 12 | 2,326,534 | 149,909 |\n| | Same Day | | 149,909 | 39,149 | 12\
  \ | 2,326,534 | 200,655 |\n| | Second Class | 39,149 | 311,416 | 161,506 | 12 |\
  \ 2,326,534 | 604,838 |\n| | Standard Class | 161,506 | 754,748 | 443,332 | 12 |\
  \ 2,326,534 | 544,957 |\n| Office Supplies | First Class | 443,332 | 856,372 | 101,625\
  \ | 12 | 2,326,534 | 130,715 |\n| | Same Day | 101,625 | 885,463 | 29,090 | 12 |\
  \ 2,326,534 | 192,034 |\n| | Second Class | 29,090 | 1,048,406 | 162,943 | 12 |\
  \ 2,326,534 | 601,178 |\n| | Standard Class | 162,943 | 1,486,641 | 438,235 | 12\
  \ | 2,326,534 | 577,601 |\n| Technology | First Class | 438,235 | 1,626,007 | 139,366\
  \ | 12 | 2,326,534 | 200,398 |\n| | Same Day | 139,366 | 1,687,039 | 61,033 | 12\
  \ | 2,326,534 | 203,254 |\n| | Second Class | 61,033 | 1,829,261 | 142,222 | 12\
  \ | 2,326,534 | 639,495 |\n| | Standard Class | 142,222 | 2,326,534 | 497,273 |\
  \ 12 | 2,326,534 | 497,273 |\n\n图 5.1：表计算\n\n7. 图 5.1 中的表格显示，大小函数和窗口求和函数是唯二的非方向性函数。所有其他函数都取决于方向呈现一个数字。例如，查找会向下移动并打印实际字段之前的值。您可以单击任何表计算字段上的三角形并选择“编辑表计算”来更改方向。\n\
  \n本练习是表计算的两个类别的示例：方向性和非方向性。现在，我们将逐个考虑表计算函数。遗憾的是，篇幅不允许我们探索所有表计算；然而，为了获得工作理解，考虑除一个之外的所有独特选项组应该足够了。以\
  \ Script_ 开头的四个表计算以及六个 Model_ 函数，将在第 14 章“集成编程语言”中介绍。\n\n虽然我在编写时在每个部分末尾添加了现实世界场景，但跟随练习的重点是展示表计算功能，并考虑每个函数如何与缓存中的数据集（也称为分区）进行方向性或非方向性交互。\n\
  \n以下练习将逐个向我们展示每个表计算；在每个部分末尾，您将找到我对现实世界场景的看法。\n\n## 查找和总计\n\n以下工作表的目标是显示在 2013 年最后两天进行过购买的客户，以及\
  \ 12 月份的相关绝对销售额和相对销售额。\n\n在以下表中，LOOKUP 的行为是方向性的，而 TOTAL 是非方向性的。在结果中很容易注意到这种行为。按以下步骤操作：\n\
  \n- 1. 在与此章关联的工作簿中，导航到 查找/总计 工作表。\n- 2. 将客户名称和订单日期拖到行货架上。通过右键单击并选择“天”以及“离散”，将订单日期设置为\
  \ 月/日/年 离散。\n- 3. 将订单日期放在筛选器货架上，选择仅查看 2025 年 12 月，并将日期格式选择为 月/年。\n- 4. 创建以下计算字段：\n\
  \n| 名称 | 计算 |\n| :--- | :--- |\n| 查找间隔时间 | DATEDIFF('day', LOOKUP(MAX([Order Date]),\
  \ 0), MAKEDATE(2025, 12, 31)) |\n| 总销售额百分比 | SUM(Sales)/TOTAL(SUM([Sales])) |\n\n\
  - 5. 右键单击 总销售额百分比，选择“默认属性 | 数字格式”，将数字格式设置为带两位小数的百分比。\n- 6. 将 查找间隔时间 放在筛选器货架上，并选择\
  \ 0 到 1 的范围。\n- 7. 双击 销售额 和 总销售额百分比，将两个字段都放置在视图上。\n- 8. 按需要设置格式：\n\n| 客户名称 | 订单日期的日期\
  \ | 沿表的总销售额百分比（向下） | 销售额 |\n|---|---|---|---|\n| Chuck Clark | 2025 年 12 月 30 日\
  \ | 0.25% | 209.3 |\n| Erica Bern | 2025 年 12 月 30 日 | 0.04% | 34.6 |\n| Harry Olson\
  \ | 2025 年 12 月 30 日 | 0.00% | 3.0 |\n| Jill Matthias | 2025 年 12 月 30 日 | 0.00%\
  \ | 3.0 |\n| Patrick O'Donnell | 2025 年 12 月 30 日 | 0.55% | 466.8 |\n\n图 5.2：总销售额\n\
  \n让我们考虑一下前面工作表的工作原理：\n\n- 对订单日期的筛选确保返回到 Tableau 的数据集仅包含 2025 年 12 月的数据。\n- 总销售额百分比\
  \ SUM([Sales])/TOTAL(SUM([Sales]))) 包含 TOTAL(SUM([Sales])) 计算字段，它返回整个数据集的总销售额。将\
  \ SUM([Sales]) 除以该总数可返回总数的百分比。\n- 查找间隔时间：DATEDIFF('day', LOOKUP(MAX([Order Date]),\
  \ 0), MAKEDATE(2025, 12, 31)) 将返回一个整数，反映 LOOKUP 函数返回的日期与 2025 年 12 月 31 日之间的差异。请注意，LOOKUP\
  \ 函数的偏移量为零。这导致每行返回与该行关联的日期。这与方向性和非方向性表计算不同，后者包含偏移量为 -1 的 LOOKUP 函数，导致视图中的每行返回与上一行关联的数据。\n\
  \n乍一看，您可能认为可以通过从筛选器货架中删除 查找间隔时间 并调整 [订单日期] 的筛选以仅显示 12 月最后两天来简化此工作簿。但是，如果这样做，总销售额百分比将在视图的所有行中加起来等于\
  \ 100%，这将无法满足工作簿的目标。将 查找间隔时间 视为不是筛选，而是隐藏 12 月除最后两天外的所有日期。这种隐藏确保计算 总销售额百分比 所需的数据位于缓存/分区中的数据集中。\n\
  \n现实世界场景：我使用查找的次数比总计更多。两者在使用 Tableau 时都非常宝贵。我们已经看到，您使用查找来处理变化；您可以思考月度利润对比、今天与去年今天的员工人数、每周每天的网站点击量差异等等。\n\
  \n对于表计算 总计，每当您想要显示某事物的总数，同时仍在仪表板中显示某些聚合级别时，都可以使用它。图 5.2 中的 总计百分比 实际上就是完美的例子。\n\n\
  ## 上一个值\n\n以下工作表的目标是返回每年销售额的汇总值，并设定下一年的销售目标。请注意，已提供两个选项来确定下一年的销售目标，以演示 PREVIOUS_VALUE\
  \ 与 LOOKUP 的区别。另请注意，PREVIOUS_VALUE 的行为是方向性的。\n\n让我们来看看步骤：\n\n- 1. 在与此章关联的工作簿中，导航到\
  \ 上一个值 工作表。\n- 2. 创建以下计算字段：\n\n| 名称 | 计算 |\n|---|---|\n| 下一年目标_上一个值 | PREVIOUS_VALUE(SUM([Sales]))\
  \ * 1.05 |\n| 下一年目标_查找 | LOOKUP(SUM([Sales]), 0) * 1.05 |\n\n- 3. 将订单日期放在行货架上。\n\
  - 4. 双击 销售额、下一年目标_上一个值 和 下一年目标_查找，将每个都放置在视图上。\n- 5. 按需要设置格式，或如下图所示（通过拖动 度量值 中的药丸，视图中的顺序会相应改变，如下图所示）：\n\
  \n\n\n![](img/66cf6b89349fda3581a4f196cb3c98a4_201_0.png)\n\n## 图 5.3：下一年\n\n让我们考虑前面的工作表是如何工作的：\n\
  \n- Next Year Goal Prv_Val: PREVIOUS_VALUE(SUM([Sales])) * 1.05 应用于本工作表，它检索每一行之前的结果并增加\
  \ 5%。换句话说，目标是所有年份每年稳定增长 5%。\n- Next Year Goal Lkup: LOOKUP(SUM([Sales]),0) * 1.05\
  \ 也应用于本工作表；该计算在当前年份销售额的基础上增加 5%。换句话说，明年的目标是比当年销售额高 5%。不考虑往年数据。\n\n为了更好地理解此练习，请考虑前面截图中与\
  \ 2025 年关联的值。Next Year Goal Prv_Val 是通过 2024 年的 Next Year Goal Prv_Val 计算得出的；即：$613,934\
  \ x 1.05。另一方面，Next Year Goal Lkup 是通过 2024 年的销售额计算得出的；即：$745,568 x 1.05。\n\n现实场景：假设您想要外推一个数据点，并从该新值继续外推；为此，您使用\
  \ Previous_Value。一个示例是支付频繁票息的债券。如果您的债券面值为 100，且支付 4% 的半年期票息，您可以使用 Previous_Value\
  \ 计算债券的最终价值，就像我们在上一个练习中使用 Next Year Goal Prv_Val 一样。\n\n## 运行\n\n以下工作表的目标是显示数据集中每个月与\
  \ SUM(Profit) 相比的运行最小利润、运行平均利润和运行最大利润。\n\n以下示例演示了 Running 函数的方向性行为：\n\n- 1. 在与此章关联的工作簿中，导航到\
  \ Running 工作表。\n- 2. 创建以下计算字段：\n\n| 名称 | 计算 |\n| :--- | :--- |\n| Running Min |\
  \ RUNNING_MIN(SUM([Profit])) |\n| Running Max | RUNNING_MAX(SUM([Profit])) |\n|\
  \ Running Avg | RUNNING_AVG(SUM([Profit])) |\n\n- 3. 将订单日期放置于列书架，并将其设置为月/年 连续。将度量值放置于行书架。\n\
  - 4. 从度量值书架中删除所有度量值实例，除了 Running Min、Running Max、Running Avg 和 Profit。\n- 5. 将 SUM(Profit)\
  \ 从度量值书架移动到行书架。右键单击 SUM(Profit) 并选择双轴。\n- 6. 按需格式化。\n\n让我们考虑前面的工作表是如何工作的：\n\n- Running\
  \ Min: 前面的截图中可见 RUNNING_MIN(SUM([Profit]))，它将当前的 SUM(Profit) 与到目前为止记录的最小 SUM(Profit)\
  \ 进行比较。如果当前的 SUM(Profit) 小于迄今记录的最小 SUM(Profit)，则当前的 SUM(Profit) 将替换最小的 SUM(Profit)。\n\
  - Running Max: RUNNING_MAX(SUM([Profit])) 的运作方式与 Running Min 类似，只不过它查找的是最大值。\n-\
  \ Running Avg: RUNNING_AVG(SUM([Profit])) 根据从起始到当前月的每个月计算平均 SUM(Profit)。\n\n现实场景：同样，此表计算有大量示例。考虑年初至今的利润、基于出生的人口数量（不要忘记减去死亡人数）、当前的开放支持工单数量等等。\n\
  \n## 窗口\n\n以下工作表的目标是显示 WINDOW 函数的方向实例和非方向实例。\n\n请按照以下步骤操作：\n\n- 1. 在与此章关联的工作簿中，导航到\
  \ **窗口** 工作表。\n- 2. 创建以下计算字段：\n\n| 名称 | 计算 |\n|---|---|\n| Win Avg Directional |\
  \ WINDOW_AVG(SUM([Profit]),-2,0) |\n| Win Avg Non-Directional | WINDOW_AVG(SUM([Profit]))\
  \ |\n\n- 3. 将订单日期放置于 **列** 书架，并将其设置为 **月/年 连续**。将度量值放置于 **行** 书架。\n- 4. 从 **度量值**\
  \ 书架中删除所有度量值实例，除了 **Win Avg Directional**、**Win Avg Non-Directional** 和 **利润**。\n\
  - 5. 从 **数据** 窗格中，将另一个 **利润** 实例拖放到 **行** 书架上。右键单击 **行** 书架上的 **利润** 实例，并选择 **快速表计算\
  \ | 移动平均**。右键单击 **行** 书架上的 **利润** 实例，并选择 **双轴**。\n- 6. 右键单击标记为 **利润的移动平均** 的轴，并选择\
  \ **同步轴**。\n- 7. 按需格式化，或如下一个截图所示：\n\n![](img/66cf6b89349fda3581a4f196cb3c98a4_204_0.png)\n\
  \n## 图 5.4：窗口\n\n让我们考虑前面的工作表是如何工作的：\n\n- Win Avg Directional: WINDOW_AVG(SUM([Profit]),\
  \ -2, 0) 的起点为 -2，终点为 0，这意味着 Tableau 将基于当前月及前两个月的 SUM([Profit]) 平均值创建一个点。将 0 更改为\
  \ 2 将导致每个点的平均值基于前 2 个月、当前月和接下来的 2 个月进行计算。双击行书架上的 Profit 实例以查看底层代码。（这是通过右键单击并选择快速表计算\
  \ | 移动平均而转换为表计算的 Profit 实例。）请注意，该计算与为 **Win Avg Directional** 创建的代码相同。但是，如果您右键单击两个药丸并选择\
  \ **编辑表计算**，您会注意到生成的对话框不同。与 **利润** 关联的对话框具有更多选项，包括更改前一值和下一值的功能。更改 **Win Avg Directional**\
  \ 的前一值和下一值需要调整计算字段。\n- Win Avg Non-Directional: WINDOW_AVG(SUM([Profit])) 与视图中的水平线相关联。请注意，它不依赖于方向。相反，它是缓存/分区中数据集内所有聚合\
  \ **利润** 值的平均值生成的单一值，因此无论数据点的顺序如何，它都将保持相同。\n\n现实场景：您为什么想要使用窗口平均值？例如，因为您想要平滑异常值。窗口平均值为您的数据提供了稳定的表示。单个高点或低点将被移除。如果您分析股票价格，您会发现价格在一年内可能会有所不同！通过使用窗口平均值，或者更确切地说是窗口标准差，作为早期预警指标，您将能够更清晰地看到价格跳变，并作为投资者采取行动。然而，稳定的增长或下降将落入移动区间。使用固定区间无法实现这一点。\n\
  \n## 首先和最后\n\n以下工作表的目标是显示 Superstore 数据集中最畅销商品的第一个和最后一个实例。请注意，以下示例演示了 FIRST 和 LAST\
