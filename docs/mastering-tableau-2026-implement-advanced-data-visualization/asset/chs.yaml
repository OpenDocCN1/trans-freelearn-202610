  \ A Population] - LOOKUP([Country A Population], -1)) /\nABS(LOOKUP([Country A Population],\
  \ -1))\n```\n\n### B 国人口：\n```\nIF [Actual/Forecast] = \"Actual\" THEN SUM([World\
  \ Indicators].[Country B Population]) ELSE PREVIOUS_VALUE(0)\n* [Select Country\
  \ B Forecast] + PREVIOUS_VALUE(0)\nEND\n```\n\n### B 国同比变化：\n```\n(([Country B Population]\
  \ - LOOKUP([Country B Population], -1)) /\nABS(LOOKUP([Country B Population], -1))\n\
  ```\n\n### A-B 差异：\n```\n[Country A Population] - [Country B Population]\n```\n\n\
  ### A-B 百分比差异：\n```\n[Country A-B Diff]/[Country A Population]\n```\n\n- 20. 在“数据”窗格中，右键单击“A\
