- 'no': 6075
  overturn_probability: 0.08
  alternative: 正文小标题或篇（Part）标题
  counter_evidence:
  - 行首使用单井号（#），在部分 Markdown 图书排版中可表示“篇（Part）”而非“章（Chapter）”，若属篇标题则不应独立计为章。
  - 标题后紧接的是对本章前提的直接说明（“本章的前提是...”），而非规则要求的“后 1~3 行通常是概述段落，且后面跟着子节（如 X.Y）”，结构略显突兀。
  - 前文第 6059 行已在“摘要”中提及“在下一章中...”，该下一章语义与“超越基础”不完全匹配，暗示该标题可能为跨章节过渡性大标题而非严格章起点。
  keep_split: true
- 'no': 7117
  overturn_probability: 0.12
  alternative: 章节内的一级主题标题（大节）
  counter_evidence:
  - 标题“使用地图”语义宽泛，更像地图专题下的总览性大节标题，而非具有独立统领性的章标题。
  - 无显式章序号（如“第 X 章”或“X. ”），仅依赖语义判断，符合误报高风险特征。
  - 前文第 7107 行摘要已概括本章内容，本行可能只是该章下第一个二级标题被误提取为一级标题。
  keep_split: true
