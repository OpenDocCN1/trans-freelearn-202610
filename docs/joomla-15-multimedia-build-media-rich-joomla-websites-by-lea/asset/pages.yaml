- pgno: 149
  md: 'Before we proceed to build our podcast, let''s take a quick look at the built-in
    RSS capabilities that Joomla! offers.


    # What is RSS?


    The term RSS stands for **Real Simple Syndication**. It is, in its basic form,
    a simple method for people to stay updated with new content from your website.


    RSS is very popular on the Web now with examples of its use being: the latest
    joke of the week, watching whether cheap airfares are released, and picking up
    the latest news releases from websites.


    RSS feeds can be read by an RSS reader which can be desktop-based, web-based,
    or even run on a handheld device such as a mobile phone. A standard XML file format
    allows the information to be published and viewed by many programs.


    Users subscribe to an available RSS feed by entering the **Uniform Resource Identifier
    (URI)** into their RSS reader, or by clicking on an RSS icon (if available) in
    a web browser, which then initiates the subscription process to that particular
    RSS feed. Once subscribed, the RSS reader checks the feeds regularly and downloads
    any updates it finds, therefore informing the user of news from that site without
    the user having to visit the website:


    ![](img/0151410972a5c5ea0aab26416e44b1da_149_0.png)


    # Joomla! and RSS


    Joomla! 1.5 has some good functions to create RSS feeds, and even better ones
    to take RSS feeds and display the feed information within the Joomla! site. In
    Chapter 6, *Including Video In Your Joomla! Website*, we will look at how to manually
    create an RSS feed from a Joomla! Category containing articles with video content
    within it. It is possible to use a similar process to generate the audio podcast
    feed, but Joomla! does not create friendly podcasting RSS feeds, so we will utilize
    a third-party RSS service called FeedBurner to help us with this.'
  merge: -1
  img_proc: true
- pgno: 150
  md: '# FeedBurner


    FeedBurner is an RSS web feed management service introduced by Google in 2007.
    It is a free service providing bloggers, podcasters, and other web-based publishers
    with customer RSS management tools:


    ![](img/0151410972a5c5ea0aab26416e44b1da_150_0.png)


    We will utilize the FeedBurner service to help provide podcast-friendly feeds
    that link back to our Joomla! content.


    # Creating a new podcast feed


    Here is a step-by-step tutorial to creating a podcast using Joomla! and the FeedBurner
    RSS service.


    # Select and prepare your audio content


    Using Joomla!, it is possible to deliver your own audio podcast files from your'
  merge: -1
  img_proc: true
- pgno: 151
  md: 'server. In this example, we will upload a self-contained audio file (called
    `audio` in `.mp3` format) to our web server.


    If you are using FTP, simply move the MP3 file from your computer into the new
    directory. If you are using the Media Manager, then make sure you are residing
    in the directory you wish and use the file upload feature to load the audio into
    your desired directory on the web server.


    Once your audio has been uploaded, we can proceed to include this in a Joomla!
    Article.


    # Disable the WYSIWYG editor


    In order to place the correct HTML into our Joomla! Articles, it is best to make
    sure the built-in WYSIWYG Content Article Editors are disabled. You can easily
    do this by following these steps:


    +   - Logging into your administration.

    +   - Clicking on the menu item named **Site | User Manager**.

    +   - Select the user to edit.

    +   - Under the parameters for that user, select **Editor – No Editor** as the
    option for the **Editor** field.

    +   - Clicking on **Apply** or **Save** to save your settings.


    The editor can also be disabled on a global basis, by visiting your Global Configuration
    and changing the **Default Editor** field to **Editor – No Editor**.


    # Create the category


    Follow these steps:


    +   - Log into your Joomla! Administration and proceed to the Create Category
    area which is located under **Components | Articles | Categories**.

    +   - In the top-right corner, click on the **New** icon, which loads the **Category
    Manager: Add Category** screen.

    +   - Give your category a name. For our example, I am going to call it **Podcast**.
    The **Alias** can be left blank, but make sure the category is published. If you
    want, you can give this category a description.'
  merge: -1
  img_proc: true
- pgno: 152
  md: 'That is all we need to do for now, so complete the process by clicking on the
    Save button at the top-right of the page.


    You will see your new category created and shown in the Category List.


    # Create the article to display your audio


    The next step is to create a new Joomla! Article, which will contain your audio
    content.


    +   - If you are already in the Category screen, click on the link to the article
    view.

    +   - If you are not, then click on the Article Manager icon on your Control Panel
    or go to the Components | Articles menu item.

    +   - Click on the Create New Article button at the top-right of the page, give
    your article a Title, and select the Podcast category that was created earlier.

    +   - We now need to include the HTML code into our article (refer to the Embed
    and display audio in Joomla! Articles section, mentioned earlier in this chapter).


    Make sure you don''t have your WYSIWYG editor turned on in your Joomla! Articles
    when entering complex HTML code into your Joomla! Articles.


    Once you have your audio code in place, click on the Apply button (top-right)
    to apply the changes and save the new article.


    # Create the menu link and RSS feed


    Once you have created your audio article (or articles) and have it located in
    the applicable "Audio Podcast" category, it''s time to utilize the Joomla! RSS
    feed menu feature.


    Creating a menu link to the category is done by going to the menu you wish to
    place the new link on, for example, Menus | MainMenu, and clicking on the New
    icon at the top-right of the screen:


    ![](img/0151410972a5c5ea0aab26416e44b1da_152_0.png)'
  merge: -1
  img_proc: true
- pgno: 153
  md: 'As this section is about creating a menu link for an RSS item, we will not
    take the time to go through all of the menu parameters, but for our RSS menu link
    the most important ones are:


    +   - **Title:** Enter a title for your menu link. For our example, I am going
    to call the menu link **Audio Podcast**.

    +   - **Type:** Click on the **Change Type** button to open up the menu **Type**
    options, which will open a lightbox with menu type options. Create a new menu
    type called **Link to Category** by clicking on the applicable link. The popup
    lightbox will disappear and the appropriate Menu fields will be populated.

    +   - **Parameters (Basic) - Category:** You need to choose which category you
    wish the menu link to link to.

    +   - **Parameters (Advanced):** Make sure the **Show a Feed Link** radio button
    is set to **Yes**.


    If you want to fill out any additional parameters or properties for the menu item,
    then please do, but the previous are the main requirements to create our new **Link
    to a Category** menu item.


    Click on **Save** on that page to save the new menu item.


    # How it all works


    If you look at the front page of your website, you should now see the new menu
    link you have created. If you cannot, then make sure your menu link is published,
    and your menu module is published to show the menu on your front page.


    Click on this menu item, which will take you to the Category page, displaying
    the links to your podcast articles.


    As most modern web browsers, such as Safari and Firefox, have built-in RSS readers,
    once you are on this Category page, you should see an RSS icon in your browser.
    In Mozilla Firefox and Safari, this will be an icon to the right of the URL field
    in your browser. Click on this to view the RSS feeds from this particular web
    page:


    ![](img/0151410972a5c5ea0aab26416e44b1da_153_0.png)'
  merge: -1
  img_proc: true
- pgno: 154
  md: 'You may receive more than one option when you have clicked on the icon: RSS
    2.0 or Atom 1.0. These are syndication languages and will be covered in a chapter
    later in this book. For now, both will display your new RSS feed, and allow users
    to subscribe to and view them.


    # FeedBurner


    Now the fun begins. We are going to create a podcast-friendly feed using the FeedBurner
    service by Google.


    The FeedBurner service is located at http://feedburner.google.com. If you do not
    have one already, you will need to create a free account with Google in order
    to utilize this service.


    When you are logged into your Google account, visit the previous URL, and you
    will be presented with a box to enter your RSS feed location into:


    ![](img/0151410972a5c5ea0aab26416e44b1da_154_0.png)


    > Paste the URL to your podcasting category into this box, and not the actual
    RSS link itself. Then make sure you check the I am a podcaster! box to the right
    of this and click on the Next button.


    If the link you entered is a valid URL link to your Joomla! Category, FeedBurner
    will accept it and take you to the next step. If you are having issues with your
    link, please create a new menu link in your Joomla! site that links directly to
    your "Podcast" category, click on that link, copy the URL, and then paste it in
    FeedBurner. This should be all that is required and FeedBurner will now report
    that it has found two valid RSS links from that URL—RSS 2.0 and Atom 1.0. These
    are different syndication languages, and for this example, I will use the RSS
    2.0 option:


    ![](img/0151410972a5c5ea0aab26416e44b1da_154_1.png)'
  merge: -1
  img_proc: true
- pgno: 155
  md: 'Next we need to give our feed a descriptive **Title** that users will be able
    to view, and also provide the **Feed Address**, which will start with `http://feeds.feedburner.com/`
    and then have our suffix at the end. For this example, I will use the title, **Amplify
    Podcasts** and the Feed Address, **amp_podcast**. Once this information is populated,
    click on **Next**:


    ![](img/0151410972a5c5ea0aab26416e44b1da_155_0.png)


    Unless the information you entered into your fields has already been allocated,
    you should be presented with your brand new sparkling podcast feed:


    ![](img/0151410972a5c5ea0aab26416e44b1da_155_1.png)'
  merge: -1
  img_proc: true
- pgno: 156
  md: '# *Using Audio in Your Joomla! Website*


    The FeedBurner service offers you additional features to customize your feed and
    even submit it automatically to iTunes. We need to utilize one of these, so click
    on **Next**.


    At the top of this page, make sure the **Create podcast enclosures from links
    to: any rich media file** is selected. It should be the default setting:


    ![](img/0151410972a5c5ea0aab26416e44b1da_156_0.png)


    You can give your podcast a description, some keywords, and even add it to iTunes
    and the Yahoo! search engine. Then click on **Next**.


    In this last page, FeedBurner offers you some powerful statistics, which lets
    you know who is subscribing to your podcasts and how often they have clicked on
    the content in your feed:


    ![](img/0151410972a5c5ea0aab26416e44b1da_156_1.png)


    Click on **Next** and we are all done here!'
  merge: -1
  img_proc: true
- pgno: 157
  md: 'Next, we need to let people know about your new podcast feed. In your FeedBurner
    page, you should see a tab labeled Publicize. Click on this and then on the left-hand
    side menu item labeled Chicklet Chooser:


    ![](img/0151410972a5c5ea0aab26416e44b1da_157_0.png)


    Scroll to the bottom of the page where you can copy some HTML code:


    ```

    Copy the HTML below for use in your own page templates:

    <a href="http://feeds.feedburner.com/amp_podcast" title="Subscribe to my feed"
    rel="alternate" type="application/rss+xml"><img src="http://www.feedburner.com/fb/images/pub/feed-icon32x32.png"
    alt="" style="border:0"/></a><a

    ```


    Copy the code, go back to your Joomla! site, and create a new module, pasting
    in this HTML code linking to your new feed. Publish this on your podcast pages,
    and users will be able to subscribe directly to your feed:


    ![](img/0151410972a5c5ea0aab26416e44b1da_157_1.png)'
  merge: -1
  img_proc: true
- pgno: 158
  md: 'To continue to produce podcasts from your website is now an easy process. When
    you want to create a new podcast, simply create a new Joomla! Article and either
    embed your audio player into it, or create a link to the podcast material and
    save this article into your "Podcast" category. Joomla! and FeedBurner will do
    the rest, automatically creating a new RSS feed entry for this new article.


    # Podcasting using extensions


    There are other ways to podcast from our Joomla! site. These involve using the
    power of Joomla! third-party extensions, and one of the best tools for the job
    is the "Joomla! Podcast Suite" by Joseph LeBlanc:


    ![](img/0151410972a5c5ea0aab26416e44b1da_158_0.png)


    The Podcast Suite extension contains a Joomla! Component, Module, and Plugin which
    provides an extensive list of podcast tools at your fingertips. You can get your
    first podcast up and running quickly, and easily build and manage this ongoing.


    We will highlight the Podcast Suite extension in the following section, which
    covers third-party audio extensions.'
  merge: -1
  img_proc: true
- pgno: 159
  md: '# # Third-party audio extensions


    Joomla! Extensions provide us with a range of powerful audio solutions which can
    be installed and configured by administrators, with nearly no developer''s knowledge
    required.


    There is a huge number of extensions that are now available for Joomla!. The most
    difficult decision for a Joomla! site administrator is usually not finding an
    extension to do what you want it to, but finding the most suitable one out of
    the available options. The following section highlights some of the most popular,
    and non-commercial third-party audio extensions.


    # ## Podcast Suite


    The Podcast Suite for Joomla! is in a world of its own. It does "what it says
    on the tin" and you can be presenting podcasts within Joomla! in as little as
    ten minutes:


    ![](img/0151410972a5c5ea0aab26416e44b1da_159_0.png)'
  merge: -1
  img_proc: true
- pgno: 160
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 161
  md: 'The plugin displays the ID3 tag information for the title, album name, track
    length, and file size. It also produces a link so that users can download the
    MP3 files as well as play the files in your web pages using an embedded MP3 player.


    The plugin is called by inserting the easy-to-use plugin tags within your Joomla!
    Article. The tag looks like this: {music}your/path/to/directory{/music} and will
    automatically scan the directory for files, and output them in a table listing.


    The **Plugin Parameters** allow you to adjust the table''s width and colors, replace
    the download image icon, and adjust column headings:


    ![](img/0151410972a5c5ea0aab26416e44b1da_161_0.png)


    To download the MP3 Browser, visit http://extensions.joomla.org and search for
    "MP3 Browser".'
  merge: -1
  img_proc: true
- pgno: 162
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 163
  md: '![](img/0151410972a5c5ea0aab26416e44b1da_163_0.png)


    As you can see from the related image, the extension also has language support.


    > If you download the com_jukebox.zip file from the developer''s website, make
    sure you unzip this first before uploading it to the Extension Manager. The download
    file contains the component and a module, which both require installing.


    The component allows you to create categories for your music files to reside within.
    You can add in descriptions, album art, and other music information, as well as
    use the easy upload feature for the audio file and album cover:


    ![](img/0151410972a5c5ea0aab26416e44b1da_163_1.png)


    The included module will allow you to easily display a listing of the audio files:


    ![](img/0151410972a5c5ea0aab26416e44b1da_163_2.png)


    To download the Jukebox, visit http://extensions.joomla.org and search for "Jukebox".'
  merge: -1
  img_proc: true
- pgno: 164
  md: '# 1 PixelOut Audio Player


    The 1 PixelOut Audio Player plugin utilizes the 1 PixelOut Flash Audio Player,
    and has this packaged up so that it is easily usable within Joomla! as a plugin:


    ![](img/0151410972a5c5ea0aab26416e44b1da_164_0.png)


    As with most Joomla! plugins, their beauty is in their simplicity of use. The
    1 PixelOut Audio Player simply requires you to enter a code tag into your Joomla!
    Articles, and that''s about it. This tag calls the player to load, and you will
    have a great looking audio player displayed within your Joomla! Articles.


    The plugin contains a number of parameters that really help make this a player
    of choice. These parameters not only allow you to define a default path to your
    audio files, but you can completely customize the player''s colors to suit your
    template:


    ![](img/0151410972a5c5ea0aab26416e44b1da_164_1.png)


    To download the 1 PixelOut Audio Player plugin, visit http://extensions.joomla.org
    and search for "1 PixelOut Audio Player".


    # Zina


    Zina is a feature packed Joomla! Audio Component that provides a graphical interface
    for your music collection, a personal jukebox, a podcaster, and an MP3 player.


    Zina has been built into a Joomla! Component, which can incorporate the search
    function, meaning your audio collection can be searchable via the Joomla! search
    box.'
  merge: -1
  img_proc: true
- pgno: 165
  md: 'If you want to display music albums and offer sample songs from these, then
    Zina might be a good option:


    ![](img/0151410972a5c5ea0aab26416e44b1da_165_0.png)


    To download Zina, visit `http://extensions.joomla.org` and search for "Zina".


    # Browser support and audio accessibility


    Audio is a great tool for entertaining and delivering information to your site
    visitors and is now very common to see on the Web. In fact, the sharing of audio
    files is now one of the most popular activities on the Web.


    Audio is becoming a useful device for considerably enhancing the accessibility
    of your web pages. For people who are visually impaired, the ability to offer
    your visual content via an audio description is extremely valuable.


    Problems arise when correct text alternatives are not made available, which then
    makes the audio content on the page inaccessible to certain audiences. Your audio
    will not be accessible to those whose hearing is impaired, so an accurate textual
    description could be made available to describe the contents of the audio file.


    # Good practice techniques


    Here are some good practice techniques when using audio in your Joomla! pages:


    # Text transcripts


    It is good practice to provide a text transcript to everything you do on your
    web page. For example, the `alt` tag of an image provides a text transcript of
    alternative text, allowing the user to know there is an image about that subject
    loading into that area of the page.'
  merge: -1
  img_proc: true
- pgno: 166
  md: 'If your audio is about a meeting or product news, provide a text transcript
    of that content and make it available via a hyperlink to another area, or better
    yet, make it available on the same page somewhere. Text transcripts can be from
    a few words long to hundreds of them; your good judgment will be important to
    accurately describe your audio content.


    # Alternative content


    Your HTML, which includes the audio in your web page, can also contain alternative
    content. The object element can be used to contain all types of information; much
    more than that of an image tag <img />.


    Alternative content can not only help people with text-based browsers and screen
    readers, but it can be picked up by search engines.


    # Captioning


    Captioning may not always be suitable. However, for audio content that is news
    or training-based, it might be suitable to add captions. Adding a caption to an
    audio file effectively turns it into a video file as it will contain audio and
    visuals. Many software applications offer a simple text captioning ability to
    complement the audio track.


    # Link to downloads


    Providing a link on your web pages to the type of audio player that is required
    to play your content is very useful, and may just make a difference to your users
    listening to the audio content.


    # Audio controls


    Offering controls to manipulate the playback of your audio is great practice and
    now almost an expectation. Audio controls let your visitors control the pace of
    the track, pause it, and adjust volume levels.


    A simple feature such as playbar, pause and audio buttons on your audio player
    all help in making the player more accessible, than say a background audio track
    which loads without control features.


    "Which audio format is best to use for the Web?" is a common question asked, and
    none of them are 100 percent compatible for everyone. The trick is to choose one,
    which will be suitable for a high percentage of your site visitors and then try
    to cater in other ways to other users.'
  merge: -1
  img_proc: true
- pgno: 167
  md: 'According to numerous studies on the topic, Adobe Flash is now one of the most
    popular and widespread Multimedia Players on personal computing systems. Almost
    all modern web browsers now have Flash installed and statistics show over 98 percent
    of personal computers can play Flash files. This is why a large number of audio
    players in the Joomla! Extension directory are all Flash-based audio players.


    If your audio content is important, take the time to export this and deliver it
    in a variety of formats. This provides your site users with choice, and for example,
    those who cannot run Flash will still be able to listen to it in another player.


    # Summary


    Although Joomla! does not provide native audio features, the ability to enter
    custom HTML code into our site content provides us with great flexibility when
    we need to include audio.


    Combining Joomla! and the FeedBurner RSS tool provides an automated and accessible
    way to deliver podcasts from your site, with the ability to easily generate new
    podcasts and monitor the statistics of the contents.


    Joomla! Extensions add enhanced podcasting and audio players to your site, and
    the functionality of the extensions listed in this chapter will no doubt match
    and exceed other CMS audio features.


    The options of audio formats and accessibilities of these can seem confusing at
    first, but there are a few standard formats (such as MP3) which are popular and
    safe to reach the widest audience. To adhere to the W3C accessibility guidelines,
    always try to offer alternatives for your audio, which could be a text description
    summarizing the audio contents.'
  merge: -1
  img_proc: true
- pgno: 168
  md: <!-- no content -->
  merge: -1
