- pgno: 257
  md: '# # The mobile web


    The term "mobile web" refers to web browser based services that are viewed using
    a mobile device such as a mobile phone, PDA, iPhone, and so on.


    ![](img/0151410972a5c5ea0aab26416e44b1da_257_0.png)


    The number of mobile web users is increasing each year, and an entry on the popular
    Wikipedia page `http://en.wikipedia.org/wiki/Mobile_Web`, mentions: "In 2008,
    the total number of mobile web users grew past the total number of PC-based Internet
    users for the first time". This may come as a shock to some who have not utilized
    the mobile web service before, and to us as developers / administrators, it is
    important to note.'
  merge: -1
  img_proc: true
- pgno: 258
  md: 'In the early days of mobile web devices, the only way to surf the mobile web
    was to browse using WAP sites. **Wireless Application Protocol (WAP)** is a secure
    specification that allows users to access information instantly via handheld wireless
    devices. WAP uses **Wireless Markup Language (WML)** as its primary markup language.


    As the mobile web has evolved, WML has been superseded by a number of other technologies.
    The new technology standard is now **Extensible Hypertext Markup Language (XHTML)**.


    XHTML is an extensible markup language that was designed as a subset of XML. This
    was to promote greater interoperability and the possibility of using standard
    XML tools to parse XHTML. Most mobile devices now recognize two flavors of XHTML:


    +   - XHTML: The same markup language as is used by desktop web browsers

    +   - XHTML—MP: The MP stands for mobile phone


    One of the medium''s greatest restrictions is that the mobile web still suffers
    from accessibility and usability issues. For example, mobile devices tend to have
    small screens making it hard to fit content into. Some devices try to mimic web
    browsers but still have the need to zoom in and out of web pages. Others face
    restrictions to run certain software, such as the Adobe Flash Player. And then
    there is the abundance of formats and connection issues.


    ![](img/0151410972a5c5ea0aab26416e44b1da_258_0.png)'
  merge: -1
  img_proc: true
- pgno: 259
  md: 'Web developers are only now starting to consider taking the time to look into
    this subject and what can be done to make their websites usable to mobile web
    viewers. As Joomla! users, we have a number of testing procedures and options
    available.


    > When developing for PC-based World Wide Web viewing, as developers, we need
    to take into consideration different web browsers and screen resolutions. When
    developing for the mobile web, there are even more considerations to take into
    account. This is mainly due to the large number of operating systems and screen
    sizes available on mobile devices.


    # Making your site mobile friendly


    The main purpose of your website is to deliver your content to your audience as
    easily as possible, while allowing them to (hopefully) enjoy the experience. With
    most Joomla! Templates having been designed for desktop viewing, little consideration
    is often paid to the growing audience of mobile web users.


    A number of methods can be implemented to adjust your site, making it more suitable
    for the mobile web medium:


    ![](img/0151410972a5c5ea0aab26416e44b1da_259_0.png)


    Mobile users tend to be online to get information quickly and it is important
    to make this process as easy as possible for them. While your Joomla! Template
    might contain hundreds of graphics when viewed in a desktop-browser, and look
    very smart and stylish, mobile web users may be "out and about" and may simply
    want links to take them to the information they require. This generally means
    that a simplification of the content is required and often preferred for mobile
    web users.'
  merge: -1
  img_proc: true
- pgno: 260
  md: '# Consider these adjustments


    One of your best opportunities to developing a mobile-friendly Joomla! website
    is to begin with a well-formatted HTML valid codebase for your template, built
    with logical semantic markup. A well-structured code document will display cleanly,
    load in elements in an organized order, and should be usable on many devices due
    to the valid and well-organized code.


    # Areas of importance


    One of the most important visual hotspots in your Joomla! Template will be the
    top-left zone. This is quite often where logos reside. Take note that you want
    mobile web users to be able to navigate easily and not zoom in and out or scroll
    all over your site page just to find a menu link. So if you are creating a custom
    mobile version of your website content, look for that top-left area to place a
    main navigation or a search function:


    ![](img/0151410972a5c5ea0aab26416e44b1da_260_0.png)


    The previous image displays a web template for a PC based web browser, and a separate
    site template available for handheld devices.'
  merge: -1
  img_proc: true
- pgno: 261
  md: '# Disabling images, CSS, and JavaScript


    For older mobile devices, one of the best development methods available is to
    disable image CSS and JavaScript on your site pages, and see how it looks. Your
    site will take on a completely different look and feel with the main styling of
    the template removed, and you will see the natural layout of elements as they
    load on your page.


    # Take an on-demand approach with your multimedia


    If you utilize multimedia in your website, think about offering these to the user
    when they request it, rather than bombarding the user with this information as
    they land on your website page.


    Videos, images, audio, or other multimedia in your website can be presented to
    the user via hyperlinks to the intended content. This approach offers choice,
    and means that the user can choose to visit that content if they wish to, and
    not have it force-fed to them. If you are displaying the episodes of a podcast
    using Flash players, consider using a player that loads the media when someone
    chooses to play. This approach usually leads to well-structured sites that are
    quick to load and have a healthy "large content" feel to them.


    # Load in custom stylesheets or templates for mobile devices


    With a combination of PHP, HTML, and CSS, it is possible for your Joomla! site
    to recognize particular mobile web devices and deliver specific stylesheets for
    these. By using this method, you can provide a simplified layout for your content,
    which makes page loading faster and easier for users to navigate your site pages.'
  merge: -1
  img_proc: true
- pgno: 262
  md: 'There are a number of websites and tools that can help generate PHP code for
    recognizing particular devices viewing your website. Some PHP and CSS skills are
    required in order to achieve these results, but with efforts in this area, you
    can specifically target the mobile market with your Joomla! content. One such
    useful tool can be found at `http://detectmobilebrowsers.mobi/`.


    ![](img/0151410972a5c5ea0aab26416e44b1da_262_0.png)


    The site generator will allow you to tailor the code for your environment, and
    then download the applicable code for you to use. It is free for non-profit websites
    and donations are accepted for commercial use. For those with limited PHP knowledge,
    but like to get your hands mucky with some code play, this tool will be helpful.


    For those with limited development skills, a number of Joomla! Extensions are
    also available.


    # Available extensions


    There are a number of mobile web extensions now available for Joomla! that can
    help to make your site accessible for mobile devices, and decrease the technical
    knowledge required to make this happen.


    # PDA-plugin for Joomla! 1.5 (P.T)


    The essence of the PDA-plugin for Joomla! 1.5 is that it activates a PDA template,
    or a mobile web-friendly template, for your Joomla! site instead of using the
    default site template:'
  merge: -1
  img_proc: true
- pgno: 263
  md: '![](img/0151410972a5c5ea0aab26416e44b1da_263_0.png)


    This plugin will determine if it is appropriate to activate itself, based on it
    recognizing the user agent of a mobile device. There are two ways to use this
    plugin:


    +   1. Display the mobile version of a site for the mobile browser that is on
    the same link, http://yoursite.com/. It is possible to see both the full and mobile
    versions of a site depending on the device used for viewing. This is referred
    to as the multi-client approach.

    +   2. Display the mobile version of a site for a subdomain. For example, for
    http://pda.yoursite.com/. This is referred to as the multi-site approach.


    With this plugin, it is possible to use either of these approaches, or both.


    # Installation


    There are two elements for the PDA-plugin for Joomla! 1.5. Firstly, you install
    the template, and secondly the plugin using the Joomla! Extension Manager.


    The plugin will require publishing and contains a number of configuration options.
    The way the PDA-plugin works is to activate the PDA Template (or another template
    if set in the Plugin Parameters) so that your site will be simplified to work
    on mobile web devices.'
  merge: -1
  img_proc: true
- pgno: 264
  md: 'This plugin takes the hard work out of placing code in to recognize different
    devices visiting your website, but you may still need to get your hands dirty
    by adjusting the included PDA Template to your liking.


    To download this extension, visit http://extensions.joomla.org/ and search for
    "PDA-plugin".


    # WAFL: Mobile Content Adaption (P,C,T,M)


    **Website Adaption and Formatting Layer (WAFL)** was built to achieve device-specific
    content adaptation for your Joomla! website. It is still in alpha mode so has
    not reached the maturity of other Joomla! Extensions yet.


    This plugin supports three modes of operation. The selected mode will be activated
    when the plugin detects that a request is coming from a mobile device:


    +   1. Template switching: You will be able to select a template that will be
    used for mobile requests. The plugin contains a mobile template, which can be
    used.

    +   2. Mobile redirect: The visitor will be redirected to a URL that you can specify.

    +   3. Siruna: It is a fully managed solution for creating mobile web applications.
    When this mode is activated, the plugin will redirect any mobile requests to an
    instance of the Siruna platform. It will also deliver a mobile template (enriched
    with information for Siruna) to requests coming from the Siruna platform.


    # Installation


    There is one extension to install that contains four different files:


    +   1. **Plugin**: It intercepts Joomla! events so that mobile users get delivered
    mobile-enhanced content.

    +   2. **Administrator component**: In the WAFL administration-side section, the
    web administrator will be able to change preferences to suit their site.

    +   3. **WAFL template**: It delivers our basic version of a mobile template without
    taking screen widths and heights into account.

    +   4. **WAFL module**: It is in fact a component wrapper to enable module ordering
    in the WAFL template.


    The extension is installed via the Extension Manager.


    The administration side of our extension can be found by clicking on **WAFL**
    in the **Components** menu. Here, you can change the look-and-feel of the mobile
    website version, or how you would like to have your mobile site configured and
    displayed.'
  merge: -1
  img_proc: true
- pgno: 265
  md: 'You will need to check your mobile settings by surfing your website using a
    mobile device, or even better to look at a number of devices (just as you would
    when testing with Safari, IE6, IE7, and so on) to make sure all is as you require.


    To download this extension, visit [http://extensions.joomla.org/](http://extensions.joomla.org/)
    and search for "WAFL Mobile Content".


    # Mobilebot for Joomla 1.5 (P)


    Mobilebot 1.0 for Joomla! 1.5.x can detect visitors using mobile devices and change
    the Joomla! Template automatically.


    ![](img/0151410972a5c5ea0aab26416e44b1da_265_0.png)


    [ 251 ]'
  merge: -1
  img_proc: true
- pgno: 266
  md: 'Mobilebot 1.0 for Joomla! 1.5.x has the following features:


    +   1. It can detect iPhone, Blackberry, Android, and Opera Mini browsers separately
    and load a particular template for each of them.

    +   2. It has two extra spaces so you can add your own custom mobile devices.

    +   3. You can adjust your final HTML code with simple/regular expression PHP
    replacements. This can be done independently for each particular device.

    +   4. If none of the specific devices are detected (or you just have one template
    for all mobiles), the plugin can also perform a general mobile detection and load
    a "generic" mobile template if configured accordingly.


    # Installation


    Mobilebot is a simple plugin extension that is installed via the Extension Manager,
    and configurations are made within the Plugin Parameters.


    To download this extension, visit http://extensions.joomla.org/ and search for
    "Mobilebot".


    # Testing for the mobile web


    The following is a list of measures that you can take to improve your Joomla!
    site''s "mobile friendly" presence.


    # Disable your stylesheet


    As has been mentioned previously, one of the easiest ways to test compatibility
    of your website is to remove the Cascading Style Sheet from the equation. As your
    stylesheet will contain an abundance of styling elements, it is important from
    an accessibility point of view for you to see "if that menu still appears" or
    "do I still have a search feature showing" on your site when you have removed
    the styling:'
  merge: -1
  img_proc: true
- pgno: 267
  md: '![](img/0151410972a5c5ea0aab26416e44b1da_267_0.png)


    The previous image displays the joomla.org website with the Cascading Style Sheets
    on, and then turned off in the users'' web browser.


    Many older mobile devices still render unstyled raw HTML output. Hence, after
    turning off your stylesheet, you will get an idea of the semantic layout of your
    content and how this displays on your web browser. If your template and HTML content
    has been built according to web standards, then menu links and other main navigation
    features should continue to work.


    If you use Mozilla Firefox, you can easily turn off the loading of stylesheets
    by going to Menu | Develop | Disable Styles on the Firefox browser.


    # Resize your browser


    Resizing your browser window will give you a good idea about how your website
    will look when viewed on a mobile device that supports stylesheets. It is a simple
    but effective way to view your site on smaller screens:


    ![](img/0151410972a5c5ea0aab26416e44b1da_267_1.png)


    If you use Mozilla Firefox, http://www.firefox.com, and the "Developer Toolbar"
    plugin for it, https://addons.mozilla.org/firefox/60/, then resizing your browser
    is a piece of cake. Simply go to the Resize | Resize Window menu option, which
    will allow you to enter custom values for resizing your browser window.'
  merge: -1
  img_proc: true
- pgno: 268
  md: 'Here are common screen resolutions for mobile devices:


    +   - 128 x 160

    +   - 176 x 220

    +   - 240 x 160

    +   - 320 x 240

    +   - 480 x 320


    Being aware of these screen resolutions and testing on them will help you optimize
    your web content accordingly. As you can see there are a number of different resolutions,
    and these are just the popular ones, so designing a site that works on the mobile
    web takes important consideration.


    # Borrow a phone to test with


    This isn''t hard to do, but it''s a simple method that is often overlooked:


    ![](img/0151410972a5c5ea0aab26416e44b1da_268_0.png)


    Talk with friends and colleagues and ask them to take a look at your site on their
    mobile device, and let you know what it''s like. There are some great emulators
    available but there is nothing like viewing it with a physical device, possibly
    running various software versions.'
  merge: -1
  img_proc: true
- pgno: 269
  md: '# Target your visitors, and what you want them to see


    The goal for any website (not just mobile web) should be to deliver the most appropriate
    content to users. The goal might be to sell something, deliver important information,
    or simply offer learning material, but using good navigation and leading the user
    to this information quickly is the trick!


    This goal is even more important when viewing content on the mobile web. This
    means that you may need to simplify a version of your website content in order
    to suit a mobile device. Using Joomla! Mobile Web Extensions or manually loading
    in a different template and CSS may also help with the process of simplifying
    the layout and display of your pages. At the end of the day, make sure what you
    are trying to deliver is concise information and users can get to their location
    easily.


    Consider using a tool such as Google Analytics for monitoring your website statistics.
    The Google Analytics tool is free to use and can set goals, follow user paths,
    and closely monitor who is visiting what pages, and with what devices. Further
    information about Google Analytics can be found at www.google.com/analytics/.


    # Use an emulator


    Desktop and web browser emulators are an easy and great way to view what your
    site will look like on different devices. As with most emulators, they don''t
    always replicate the "real thing" and so are not as good as having a handset in
    your hand to test on. This being said, they are the next best thing (if they do
    work) and so here is a list of a few popular web emulators to test mobile web
    content on:


    | Emulator | Description | URL |

    |---|---|---|

    | Microsoft Pocket PC emulators | Documentation, sample code, header and library
    files, emulator images, and tools for building Windows Mobile 6 applications.
    | http://msdn.microsoft.com/en-gb/windowsmobile/bb264327.aspx |

    | dotMobi web emulator | An online emulator with Nokia N70 and Sony Ericsson K750
    skins. | http://emulator.mtid.mobi/emulator.php |

    | iPhone Simulator | A web-browser-based simulator for quickly testing your iPhone
    web applications. | http://www.testiphone.com/ |

    | Opera Mini Simulator | A live demo of Opera Mini 5 beta that functions as it
    would when installed on a handset. | http://www.opera.com/mini/demo/ |'
  merge: -1
  img_proc: true
- pgno: 270
  md: '| Emulator | Description | URL |

    |---|---|---|

    | **TagTag emulator** | Emulator to view mobile web pages on your computer. Enter
    the page address at the bottom of TagTag emulator and click on go. Browse the
    page like you would on your mobile phone. | http://tagtag.com/site/info/emulator
    |

    | **OPENWAVE** | OPENWAVE® phone simulator is a free software development kit
    that makes creating innovative mobile applications even easier. | http://developer.openwave.com/dvl/tools_and_sdk/phone_simulator/
    |


    # Accessibility


    Accessibility for your Joomla! Template is an important topic to mention, as your
    template is the key container that delivers your Joomla! contents, hence it affects
    the output of every page on your website.


    # Accessible content


    In order to make your site as accessible as possible, you may need to consider
    some of the accessibility topics mentioned in previous chapters. Always try to
    use valid HTML code to embed or display your content. If you are updating your
    Joomla! website regularly, then consider learning some basic HTML code. Turning
    off your WYSIWYG editor, in order to format your content manually will usually
    allow you to have cleaner HTML and it may be the start of a new career with the
    Web!


    Secondly, it is important to offer alternative information to cater for users
    with disabilities. For example, if you link to a document full of text, consider
    making an audio version of this available for users who may be visually impaired.
    This "alternative option" approach can be applied to almost all major content
    additions to your website, whether it is text, audio, or video.


    # Accessible template code


    With regards to the template itself, your `index.php` file contains all of the
    HTML markup and is at the core of every page that Joomla! delivers. It is a page,
    just like any HTML page, but has the extension `.php`, and contains PHP code to
    deliver the contents of your site. It is very important that this document contains
    valid HTML code, as validation errors will affect every page of your Joomla! website.
    To check for validation of your site, you can utilize online validation tools
    such as http://validator.w3.org/'
  merge: -1
  img_proc: true
- pgno: 271
  md: 'Chapter 8


    ![](img/0151410972a5c5ea0aab26416e44b1da_271_0.png)


    Here are a few key points to adhere to when building or adjusting your Joomla!
    Template:


    +   - Use valid HTML code.

    +   - Do not build the HTML using table tags, <table>. Use the modern method of
    div tags, <div>, instead.

    +   - Choose contrasting colors that can be easily viewed.

    +   - Optimize graphics for the template.

    +   - Use valid CSS code.

    +   - Offer text-resize options (most major browsers now offer this feature, so
    make sure you use em values for font control in your CSS file).

    +   - Test your template and site by using online validation tools.

    +   - Test your website in all popular web browsers.


    # Fonts, colors, and contrasts


    We all tend to choose font typefaces and color schemes that we think look great,
    but as proven on the catwalk, one person’s idea of style is not necessarily another’s!
    You may have utilized a default template, or used a pre-designed, third-party
    template for Joomla! and settled for the pre-configured options. Although glossy
    images with rounded corners and shadows / highlights look great in a perfect environment,
    there will be users visiting your sites using mobile devices, many different web
    browsers, and possibly with disabilities, which are important to consider.


    [ 257 ]'
  merge: -1
  img_proc: true
- pgno: 272
  md: 'Choosing the right color scheme is a rather simple but effective way of making
    your template more accessible. Try to use sufficient color contrast so users who
    are visually impaired do not have issues viewing the content:


    ![](img/0151410972a5c5ea0aab26416e44b1da_272_0.png)


    There are a number of tools available on the Web to test for color contrast, such
    as WebAIM, http://www.webaim.org/resources/contrastchecker/.


    If your favorite colors are light green text on dark green backgrounds and you
    just have to use them, consider offering your site users the option to adjust
    the site contrast by loading in different stylesheets at their request. It is
    possible to achieve this using CSS and it uses a similar approach as if you are
    offering the user font size controls for text resizing. Most modern web browsers
    offer the ability to adjust font sizes. Try to use em values in your site CSS
    so that users can define their own font sizes in the browser if they so require.


    # Summary


    Due to the nature of the Joomla! Template controlling layout and style properties
    of our website, it plays an important part in the accessibility of the site.


    Templates can enhance multimedia capabilities by delivering JavaScript scripts
    that can provide additional multimedia features to the site. Templates usually
    contain a number of images within their presentation and styling, which have an
    effect upon the extensions we publish in our Joomla! site.


    The mobile web is a rapidly growing environment and there are a number of things
    to check and test in order to make sure that your site can be viewed effectively
    on a mobile web device. Taking this further, it is possible to utilize some Joomla!
    Extensions that help create your own mobile web versions of your Joomla! site,
    making them available to a wider audience.'
  merge: -1
  img_proc: true
- pgno: 273
  md: '# ## 9


    # # Joomla! Multimedia Project


    In the previous chapters, we have covered a multitude of media types (and respective
    elements) that are considered as different forms of media. Put any number of these
    together and you have created multimedia!


    In this last chapter, we follow a cookbook-style approach as we build a multimedia
    packed Joomla! website from start to finish. We throw in some of the previously
    mentioned techniques, as well as some new tips and tricks for good measure!


    This chapter contains:


    +   - An overview

    +   - The site structure

    +   - Multimedia features

    +   - Accessibility and validation


    # ## Overview


    This chapter is our playground! It is designed with a cookbook-style approach
    that will enable you to include various media elements into a default Joomla!
    installation.


    The whole idea is to play and throw things at our Joomla! installation, and learn
    during the process. I am a firm believer that is not until we physically do something
    (rather than just read about it), and create or break something (and hopefully
    fix it again) that we learn how it really works!'
  merge: -1
  img_proc: true
- pgno: 274
  md: '*Joomla! Multimedia Project*


    If you have read this book and do not utilize the media features mentioned in
    it, then at least you are now aware of the multimedia capabilities of Joomla!,
    which is important when planning future projects. If you do utilize some of these
    features within your website, then you will end up with a feature-rich website
    containing many cutting-edge web features:


    ![](img/0151410972a5c5ea0aab26416e44b1da_274_0.png)


    # Preliminary advice


    Before going further, it is important to point out the following information:


    +   * **Please do not try the following on a live site:** It is best to always
    use a test website that contains a copy of the files and extensions, and a separate
    database.

    +   * **Treat the following as a demonstration project and don''t build for a
    live project:** It is very easy to copy over features to a new site, or replicate
    them once you know how. You will probably learn more by taking a laid-back approach
    to building a demo site, rather than being "up against the clock", trying to resolve
    an issue on a real project.'
  merge: -1
  img_proc: true
- pgno: 275
  md: '+   - **Take the time to read about the extensions that you use, and their
    supporting documentation**: Extensions have been written by numerous developers
    with varied experience, and agendas. Try to know what you are including within
    your website if possible.

    +   - **If you install an extension and do not use it, then remove it**: Besides
    keeping your Joomla! site organized and uncluttered, it is best to remove code/files/folders
    from your server that are not being used. Leaving older code lying around can
    create security vulnerabilities.

    +   - **Build the site for your users, not against them**: Once you have completed
    areas of development on your website, ask friends and family for their opinion
    about it. It is sometimes far too easy to become pre-occupied with "how something
    looks" and forget how users are going to navigate to it or use it effectively.
    A fresh viewpoint can only enhance the project.

    +   - **Use the Joomla! Forums**: Joomla! was made for the community, and it''s
    the community that makes Joomla! what it is. The forums are full of valuable information,
    and sometimes answers to issues that you have might only be a quick search away.
    If you don''t find what you are looking for, post it on the forums and help build
    the knowledge base.

    +   - **Keep Joomla! up-to-date**: Joomla! releases are made available for a reason
    and it is important to stay up-to-date with the software. With a well-structured
    design to the framework, there are now very few reasons to go near the core codework.
    Upgrading is usually an easy process, compared to some other web platforms. Remember
    to take a backup of your site files before performing any upgrade work, and to
    take regular backups whenever you can. There are some excellent Joomla! backup
    extensions which can be found at http://extensions.joomla.org/extensions/access-a-security/backup.


    # Getting started


    Joomla! can be what you want it to be. It is built with flexibility in mind, and
    I have personally used it from one-page websites through to UK government projects
    that receive four million hits-per-month. The Joomla.org site alone receives near
    five million hits-per-month, and is a great example of how diverse the platform
    can be.


    Joomla! is easy; with knowledge it can be installed within ten minutes and you
    have a dynamic database driven website out-of-the-box. At this point, the difference
    between "just another Joomla! install" and "your custom website" (that just happens
    to be built on the Joomla! Framework) is about knowledge, experience, content,
    and elbow grease!'
  merge: -1
  img_proc: true
- pgno: 276
  md: '# Local development


    And that''s what we are about to do; create an environment where it is easy and
    safe to play in, go get our hands dirty and come out the other end with a working
    Joomla! website that is packed with multimedia features. You can then re-create
    these features easily on your live website, if required, as you would have the
    working knowledge to do so.


    Local development takes place on your computer rather than on an external remote
    web server. Before you disregard this section, local development is your friend.
    Lets see how easy it is to get up and running with a local development environment.


    With a range of tools available, it is now very easy to set up a local development
    environment which can mimic your live website. Local development is often seen
    as something that only spotty-faced coders who hang out in closets should be doing,
    but in fact it is the safest way to work on your website without affecting a live
    site environment.


    ![](img/0151410972a5c5ea0aab26416e44b1da_276_0.png)'
  merge: -1
  img_proc: true
- pgno: 277
  md: 'The reasons to run a local development server are as follows:


    +   - Develop locally on your computer without being online.

    +   - Make mistakes and put work on your site without it being searched and indexed
    by Google. We don''t want to be halfway through something and have Google come
    along and make it available to the world.

    +   - Test out your work before introducing the same features into the live environment.

    +   - Developing with a localhost package such as MAMP, WAMP helps you understand
    the server and database relationship, which makes you more knowledgeable about
    how your Joomla! website works.

    +   - Local server development is quicker. There is no need to FTP to your web
    server, and wait for pages to reload through slow internet connections.

    +   - Local development server environments are free to set up and use.


    There are numerous ways to set up a local development environment. The main requirements
    to run a Joomla! website on a server as follows:


    +   - **Apache server**

    +     Apache makes the most popular web server software in the world. A web server
    is a program that serves the documents, images, and all other stuff you have on
    your website to the outside world.

    +   - **PHP**

    +     PHP is a popular server-side HTML-embedded scripting language. PHP can collect
    form data, generate dynamic page content, and process cookies. It supports a wide
    range of databases including mSQL, MySQL, MS-SQL, ODBC, Oracle, and PostgreSQL.
    PHP also supports a wide range of protocols including IMAP, SNMP, NNTP, and POP3.
    PHP borrows from the best of the Perl and C worlds, and has hundreds of built-in
    functions to simplify most of the common tasks.

    +   - **MySQL**

    +     MySQL is a very fast, multi-threaded, multi-user SQL database server. It
    can utilize multiple CPUs, supports many column types, and very large databases.
    Its speed, flexibility, and price (free) make it an attractive database option.


    If you know what you are doing, then it is possible to install each of these on
    their own and configure your own local development environment, but for those
    of us who just want to get on with it, there are a number of excellent packages
    available which install these elements and create an easy-to-use local web server.'
  merge: -1
  img_proc: true
- pgno: 278
  md: 'Some of the more popular packages available are:


    | Package | URL |

    |---|---|

    | WAMP – Windows | http://www.wampserver.com/en/ |

    | MAMP – Apple Mac OS X | http://www.mamp.info/en/mamp.html |

    | LAMP – Linux (and other Unix) | Distribution dependent |

    | XAMPP – Multi-platform – Windows, Linux, Solaris, Mac | http://apachefriends.org
    |


    The previous links will help provide advice for installation of these packages
    within your environment. For the purpose of this tutorial, I will show how easy
    it is to install the MAMP platform for Mac OS X.


    # Installing the MAMP package


    MAMP stands for Macintosh, Apache, MySQL, and PHP. MAMP comes free of charge and
    can be installed in typical Mac fashion with just a few clicks.


    MAMP will not compromise any existing Apache installation already running with
    your OS X, and you can install Apache, PHP, and MySQL without starting a script
    or having to change any configuration files.


    +   1. Simply download the MAMP .dmg file from the MAMP website, http://mamp.info/en/downloads/index.html.


    ![](img/0151410972a5c5ea0aab26416e44b1da_278_0.png)'
  merge: -1
  img_proc: true
- pgno: 279
  md: 'The previous image shows the MAMP website and the MAMP DMG file download option.


    +   2. Click to run this file as you would install any other Mac OS X application.

    +   3. Drag the application into your *Applications* folder and job done! You
    now have the MAMP server installed locally.

    +   4. Once installed, click on the MAMP icon in the *Applications* directory
    to open the MAMP start control panel:


    ![](img/0151410972a5c5ea0aab26416e44b1da_279_0.png)


    The MAMP control panel offers the following options:


    +   * **Start/Stop Servers**: Allows you to easily start and stop your localhost
    Apache Server with a simple click.

    +   * **Open start page**: Opens the default MAMP start page, where you have links
    to phpInfo, phpMyAdmin, SQLiteManager.

    +   * **Preferences...**: Allows some configurable options for Apache port numbers,
    PHP versions, and other settings.

    +   * **Quit**: Stops all services and shuts down the MAMP application.'
  merge: -1
  img_proc: true
- pgno: 280
  md: 'By clicking on the **Open start page** option in the MAMP control panel, the
    following start page appears in your web browser:


    ![](img/0151410972a5c5ea0aab26416e44b1da_280_0.png)


    Links to the following tools can be found on this page:


    +   - **phpMyAdmin**: Is a database management tool that is used to easily set
    up and manage MySQL databases.

    +   - **phpInfo**: Provides a listing of PHP and server configuration information.'
  merge: -1
  img_proc: true
- pgno: 281
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 282
  md: '5. Open up a web browser and type in http://www.localhost:8888. MAMP defaults
    to using port 8888 on a Mac, so it is important to include this in your URL. It
    is possible to adjust the MAMP preferences to not use this by going to the Preferences
    area from the MAMP control panel:


    ![](img/0151410972a5c5ea0aab26416e44b1da_282_0.png)


    If we leave the settings as default, in order to reach our new Joomla! installation,
    the address that we need to type as our URL will be: http://localhost:8888/JMultimedia
    (assuming you called your project JMultimedia also).


    With any luck, a Joomla! installation page will now show.


    Before we begin the Joomla! installation, we first need to go and create a database,
    which thankfully is easy to do by using the phpMyAdmin tool that comes with MAMP.


    # Creating a local database


    Open the MAMP control panel, and click on the Open start page option, or enter
    http://localhost/MAMP/ into your URL bar. From here, we can use phpMyAdmin to
    create a new database and then run the Joomla! installer.'
  merge: -1
  img_proc: true
- pgno: 283
  md: 'On the MAMP start page, a link to the **phpMyAdmin** tool can be found:


    ![](img/0151410972a5c5ea0aab26416e44b1da_283_0.png)


    Clicking on this will take your browser to the phpMyAdmin tool home page.


    To create a new MySQL database for your Joomla! installation, simply enter a new
    database name into the **Create new database** field and click on the **Create**
    button:


    ![](img/0151410972a5c5ea0aab26416e44b1da_283_1.png)


    You can leave all other settings as default. Once the database has been created,
    you should now see this listed on the left-hand column showing the database listings.


    It is now possible to proceed with the Joomla! installation via the Web Browser
    Installer, entering the details of your database during the installation process.
    Your database server will be **localhost** and the default username and password
    will be **root**:


    ![](img/0151410972a5c5ea0aab26416e44b1da_283_2.png)'
  merge: -1
  img_proc: true
- pgno: 284
  md: '# Running more than one website locally


    Creating more than one website locally is easy. Simply download or re-extract
    another copy of Joomla! from your download and then give the extracted directory
    a different project name, for example, JMultimedia2. Move this folder into the
    `htdocs` area of your local web server (in our case MAMP), and your project will
    then be accessible under the new URL http://localhost:8888/JMultimedia2, and they
    should show in a list when you navigate to the main localhost directory, for example,
    http://localhost:8888.


    Create a new database for your new project, just as you did before, and then you
    are ready to install Joomla!. You can create as may local sites as you have space
    for, as long as they are given different names.


    For those who want to install other server packages, such as WAMP for Windows
    or XAMPP, the process will be very similar to that of MAMP. Further installation
    assistance can be found by visiting the supporting documentation for each product.


    > Most of the free web server environments have been configured to run easily
    and openly on a local computer, providing ease of development. They have not been
    configured to be used as live web hosting servers, and because of open configurations,
    they should not be used to host a live website.


    # Remote server development


    A remote host is one that you access via the Internet. It may be your own server
    or rented via a web hosting company. There are many different types of web hosting
    servers, including dedicated, virtual, and shared hosting, and many forms of operating
    systems running these servers. Whichever option you choose, it is important to
    check whether Joomla! is able to run in that environment and a checklist of requirements
    can be found at Joomla.org under the Documentation area.


    Working on your site on a remote web server is a surprisingly common approach
    that is used by many people, including those new to Joomla! and the web development
    industry. Remote web development usually requires FTP access or some sort of web
    hosting control panel File Manager tool. It can be dangerous to work on the final
    site, because of the simple fact that once a file has been overwritten, there
    is no way of retrieving it easily without a backup copy. Internet connections
    can make the process very slow and sometimes FTP connections can corrupt files.'
  merge: -1
  img_proc: true
- pgno: 285
  md: 'With that said, working on a remote server may offer the ability to closely
    match a development environment to the live environment and can also offer the
    ability to easily show clients the progress of a project. If you do not want to
    work locally for development, I suggest setting up a remote hosting space to mimic
    your live environment, and password protect this via `htaccess`. Server-side programs
    such as cPanel and Plesk all offer the ability to easily password-protect directories
    on domains, which will keep it private to you and stop search engines from referencing
    your development work.


    If you are using either a remote hosting environment or localhost environment
    to perform the following additions to your site, please get into the habit of
    taking a backup of your database and files before proceeding with any of the following.


    # The site structure


    The following assumes you have a working installation of Joomla! on your web server.
    If you have any issues during an installation, please search the Joomla.org website,
    `http://help.joomla.org`, and the forums to search for answers and assistance.
    Often, it may be a hosting environment issue rather than any Joomla! issue during
    the installation.


    For the purpose of this tutorial we will be building on a new installation of
    Joomla!, without the default content installed. When working on a Joomla! website,
    I find it best to keep two tabs open in my browser window: One for the frontend
    of the Joomla! website, and one for the administration. For this tutorial, I will
    be working with Joomla! 1.5, the MAMP web server for local development, and the
    Firefox web browser:


    ![](img/0151410972a5c5ea0aab26416e44b1da_285_0.png)'
  merge: -1
  img_proc: true
- pgno: 286
  md: '# Things to consider when configuring from the start


    During the Joomla! installation process you get the opportunity to enter in some
    basic site information, such as a website name, e-mail address, and site login
    username and password, but there are usually a number of other things that are
    worth configuring when first logging into your new Joomla! installation.


    # Global Configuration settings


    The Global Configuration area of your Joomla! site contains some powerful site-wide
    settings. It is worth looking at these at the start of a project to see if these
    require adjustments.


    # Site Settings


    There is one change we need to make within the Site Settings box, and it is a
    major one:


    ![](img/0151410972a5c5ea0aab26416e44b1da_286_0.png)


    Change the Default WYSIWYG Editor to Editor - No Editor. This will give us more
    control and limit issues around entering custom code into your site.


    # Metadata Settings


    If you know what your site is going to be about (and hopefully you do), then it
    is possible to pre-populate the global Metadata Settings at this stage:'
  merge: -1
  img_proc: true
- pgno: 287
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 288
  md: 'You will need to select **Yes** for all three fields, as shown in the previous
    screenshot and then click on **Apply** at the top-right of the Global Configuration
    page. We need to make one more adjustment to a file within Joomla! for the SEO
    feature to become active.


    In order for SEO to work correctly, it needs to use a feature called `mod_rewrite`,
    which is installed on a web server. Most apache servers should have this feature
    installed, but if yours is not, then you will need to active it, or ask your web
    server support people to look at this. You can easily check if `mod_rewrite` is
    active or not by going to the **Help | System Info** menu link within your Joomla!
    administration menu. On this page, there will be a link labeled "PHP Information"
    and on this page use the browser window search bar to search for `mod_rewrite`.
    It should show in an area labeled "Loaded Modules".


    If `mod_rewrite` is active, then we are clear to proceed, and need to rename a
    file named `htaccess.txt` (which is included at the root of your Joomla! install)
    to `.htaccess`. That is all that is required for search-engine-friendly URLs to
    work for Joomla!.


    ![](img/0151410972a5c5ea0aab26416e44b1da_288_0.png)


    > Depending on your computer platform, there may be restrictions in renaming files
    beginning with a dot symbol. You may need to use an FTP program, such as the free
    and powerful FileZilla client, http://filezilla-project.org/, to rename your `htaccess.txt`
    file.


    ![](img/0151410972a5c5ea0aab26416e44b1da_288_1.png)


    Right, back to the Global Configuration screen. There are three menu links at
    the top of the Global Configuration page. Click on the second one called "System".
    On the System page, there are a range of options relating to the hosting server,
    and how Joomla! interacts with this.'
  merge: -1
  img_proc: true
- pgno: 289
  md: '# User Settings


    This box contains User Registration settings. For the purpose of this project,
    I am going to turn off User Registration, as we have no requirement for users
    on the site at this stage. User Registration can be activated for the site at
    any stage:


    ![](img/0151410972a5c5ea0aab26416e44b1da_289_0.png)


    # Media Settings


    We looked at these in earlier chapters and they are important in allowing the
    Media Manager to work effectively. At this stage, we can leave these as default,
    but we may need to re-visit them, depending on what media formats we end up using
    on the site.


    # Debug Settings


    Debug is used by developers to view additional information about the page that
    has loaded. It can help show diagnostic information and SQL errors. You can turn
    this feature on and off as you wish. If you know how to decipher the information,
    it is very useful for troubleshooting the build of a website.


    # Cache Settings


    The website cache helps to optimize and improve performance of your site by creating
    a temporary copy of pages and delivering that information to the user, rather
    than going back to the database to retrieve it each time:


    ![](img/0151410972a5c5ea0aab26416e44b1da_289_1.png)


    Caching can really come in handy on large production websites, but for development
    it can sometimes cause headaches with you making changes and not being able to
    view them. Let''s turn caching off for now.'
  merge: -1
  img_proc: true
- pgno: 290
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 291
  md: 'Generally these settings can be left at default, but if your site is not sending
    e-mails for some reason, this is the first place to look and check your e-mail
    configurations.


    Once you are happy with your Global Configuration settings, make sure you click
    on the Save button at the top-right of the Global Configuration screen to save
    your changes.


    # Content parameters


    The Article Manager in Joomla! contains a "Global Parameter" setting that sets
    the default options for your Joomla! Articles. You can override these within each
    article, but it is good practice to set these globally first, so you don''t have
    to go back and adjust them later on.


    The global parameter for articles is found at the top-right of the page when viewing
    the Article Manager screen:


    ![](img/0151410972a5c5ea0aab26416e44b1da_291_0.png)


    When you click on the Parameters button, a new screen with a lightbox pop-up effect
    will display the available parameters. For this tutorial, let''s adjust the following
    to "Hide":


    +   - Author Name

    +   - Created Date and Time

    +   - Modified Date and Time


    You can also adjust any other article parameters that you feel suitable for your
    project.


    # Front page


    When you install Joomla!, the Main Menu item that links to your front page (or
    default menu item) will have the title set for this menu link to be the same as
    your site name.


    Sometimes you may want your front page item to say something different, such as
    "Welcome to our site". You can adjust this front page title by visiting the default
    menu item to that page, in this case our Home menu link.


    To adjust your title, go to Menu | Main Menu and click on the Home menu link.'
  merge: -1
  img_proc: true
- pgno: 292
  md: 'On the right-hand side, under **Parameters (System)**, you will see the option
    to rename the menu link **Page Title**. Let''s rename this simply to **Welcome**
    for now so you can see how this affects the Joomla! front page:


    ![](img/0151410972a5c5ea0aab26416e44b1da_292_0.png)


    When we view the frontend of our website now, and click on the **Home** menu link,
    the page title will change from **JMultimedia** to **Welcome**.


    # # Sections and categories


    One more thing to do now, let''s head over to take a look at our sections and
    categories.


    Sections and categories are the foundations of our Content Management System administration.
    They are an option in 1.5 (meaning you don''t have to utilize them). However,
    they do allow you to do two things if you choose to use them:


    +   1. If you have a number of articles in your Joomla! website, then using sections
    and categories allows you to organize the content and display it accordingly.
    You can use filters when viewing the Article Manager page that can help you find
    articles easy. For sites that add new content regularly, this can really help
    to keep your site organized.

    +   2. There are built-in features in Joomla! which can take advantage of this
    article organization. Menu item types (also called Layouts) can link to sections
    or categories and automatically display the contents within these depending on
    the parameters you have set on that menu link. An example of this is the menu
    link to Section Blog, Section List, Category Blog, and Category List.'
  merge: -1
  img_proc: true
- pgno: 293
  md: 'Many other Joomla! and third-party modules utilize sections and categories
    in order to display news items for that particular topic. By grouping all of your
    articles on a particular topic into one category, for example, Latest News, any
    new items you add to this category can be automatically displayed on your site
    pages via a module. We will look into this shortly.


    Sections and Categories can be easily added from the **Content | Section Manager**,
    and **Content | Category Manager** menu links. You can also get to these areas
    from the icons located on the administration Control Panel:


    ![](img/0151410972a5c5ea0aab26416e44b1da_293_0.png)


    If you keep an organized site, you will probably constantly visit these areas
    in order to add new sections and categories. For a start, I am going to put the
    following in place. To create a new section or category, simply click on the "New"
    icon at the top-right of the respective manager screens, and give the section
    or category a title, then click on **Save**.


    # Sections


    Sections are as follows:


    +   - Site

    +   - Images

    +   - Audio

    +   - Video

    +   - General

    +   - News'
  merge: -1
  img_proc: true
- pgno: 294
  md: '# Categories


    Categories need to be located within sections, so create the following categories
    with the respective sections you just created:


    +   - Site: Create a category called General

    +   - Site: Create a category called Legal

    +   - Images: Create a category called General Image

    +   - Audio: Create a category called Podcast

    +   - Audio: Create a category called General Audio

    +   - Video: Create a category called General Video

    +   - General: Create a category called Content

    +   - News: Create a category called Latest


    That should provide us with a basic organization structure that we can define
    further as required.


    # Choosing a template / theme for your site


    A Joomla! Template is used to manipulate the way that content is delivered to
    the browsing device. Templates are extremely powerful elements to a Joomla! site
    and one of the defining factors between one site looking just like the next.


    Fonts, colors, backgrounds, links, and the way our extensions end up displaying
    within the page are controlled or influenced by the Joomla! Template. It is for
    this reason that we need to choose a template that suits the purpose of the site.
    By this, I do not just mean the color scheme, but more so the layout and flexibility
    of displaying the type of content required easily to our users.


    Templates can be added to a Joomla! install at any stage, and once added, they
    can be adjusted with a combination of HTML, CSS and PHP, image and JavaScript
    skills.


    For the purpose of this project, I am going to utilize one of the built-in templates
    that comes shipped with Joomla! 1.5. In order to change to this template, we need
    to go to the Extensions | Template Manager menu link:


    ![](img/0151410972a5c5ea0aab26416e44b1da_294_0.png)'
  merge: -1
  img_proc: true
- pgno: 295
  md: 'The **Template Manager** screen allows you to do two things, firstly you can
    set your site''s Default Template from the area, and you can also go into each
    template to adjust any available Template Parameters.


    Firstly let''s select the radio button on the left, next to the template named
    **JA_Purity** and click on the "Default" icon on the top-right of the page. This
    will make the **JA_Purity** template the default for the site, and will now show
    on your page.


    Secondly, let''s click on the Title of **JA_Purity** to go and edit some of its
    parameters. Once you are on the Template Edit screen, you should see a list of
    parameters on the right-hand side. Adjust the following:


    +   - **Template Width**: Auto (Fluid)

    +   - **Horizontal Navigation Type**: Suckerfish Menu


    You can adjust any other options as you wish and click on **Save** on that screen.


    One more thing before we get down to business: A quick logo change for this template.


    The JA_Purity template can easily be modified and is a great base for creating
    your own site''s theme. Further customization tutorials for this template can
    be found by visiting http://docs.joomla.org/Tutorial:Customising_the_JA_Purity_template,
    or taking a look at the "Joomla! 1.5 Template Design", Tessa Blakeley Silver,
    Packt Publishing book at http://www.packtpub.com/joomla-1-5-template-design-2nd-edition/book.


    To change the JA_Purity logo to a custom logo for your website, you will need
    to navigate to the JA_Purity template folder, which is located within your Joomla!
    fileset. If you are working locally, this is simply a case of visiting the following
    directories and locating the file logo.png: **htdocs | JMultimedia | Templates
    | ja_purity | images | logo.png.**


    You will need to edit this in an image-editing program on your computer.


    Once the file has been adjusted, save the new logo (with the same .png file extension)
    in the same directory as the original. The original file will be overwritten and
    your new logo will be displayed in its place. The default logo is 207 px wide
    by 80 px high. If you need to adjust the logo dimensions to suit your new logo,
    then we also need to make a change to the CSS file that is referencing the logo
    graphic.'
  merge: -1
  img_proc: true
- pgno: 296
  md: "There are two ways to edit the CSS for your template:\n\n+   1. **External\
    \ editing**\n+      Use an external editor on your computer by navigating to the\
    \ following file and opening it with an applicable editing program: **htdocs |\
    \ JMultimedia | Templates | ja_purity | css | template.css.**\n+      Within the\
    \ `template.css` file, search for the `h1.logo a` style. It should be located\
    \ around line 956 within the file:\n+      Adjust the applicable height and width\
    \ values for your new logo dimensions and click on **Save** on this file.\n+ \
    \  2. **Internal editing**\n+      You can also edit the `template.css` file using\
    \ the built-in Joomla! CSS Editor in the Joomla! Administration. Here are the\
    \ steps:\n+      - Navigate to **Extensions | Template Manager.**\n+      - Click\
    \ on the **JA_Purity** template to view the Template Edit mode.\n+      - Click\
    \ on the **Edit CSS** icon at the top-right of the screen.\n+      - Select the\
    \ `template.css` radio button, and press the \"Edit\" icon at the top-right of\
    \ the screen.\n+      - Use your browser search feature to search for `h1.logo\
    \ a`. Edit the following values:\n\n```\nh1.logo a\n{\n    width: 208px;\n   \
    \ display: block;\n    background: url(../images/logo.png) no-repeat;\n    height:\
    \ 80px;\n    position: relative;\n    z-index: 100;\n}\n```\n\n```\nh1.logo a\n\
    {\n    width: 208px;\n    display: block;\n    background: url(../images/logo.png)\
    \ no-repeat;\n    height: 80px;\n    position: relative;\n    z-index: 100;\n\
    }\n```"
  merge: -1
  img_proc: true
- pgno: 297
  md: 'If you have made logo adjustments to your site, the new logo should now appear
    when you view the frontend of your website:


    ![](img/0151410972a5c5ea0aab26416e44b1da_297_0.png)


    Before we proceed, refresh this page a few times in your web browser. You will
    notice that the JA_Purity template contains a nice feature, which is randomly
    changing the top-right header background image. So without actually adding any
    multimedia features to our website yet, we already have the following media elements
    in place:


    +   * Multiple images (including gradient and other template-styling images, in
    fact, an impressive 19 images are now loading into my web page)

    +   * Text (including font adjustment controls)

    +   * Styled text using fonts from our CSS

    +   * Template image


    # ## Multimedia features


    Now this is where the fun begins. The following section separates out the media
    features, and categorizes them into headings such as "Adding Video Features",
    "Adding an Image Gallery", and so on. We will use both built-in Joomla! features
    and a range of third-party extensions in order to achieve a media-rich working
    website.


    # ## Text content


    Due to the fact that there is no applicable content to drop into this web project,
    I will include some Fake Latin textural paragraphs to help establish some throughout
    the project. Fake Latin text is very useful for simulating how a site page can
    look with textual content. It is also an option when the client may not have delivered
    the content "copy" to you. A Fake Latin text generator can be located at the following
    website: `http://www.4guysfromrolla.com/demos/latin.asp`.'
  merge: -1
  img_proc: true
- pgno: 298
  md: '# Module positions


    Module positions play a role of allowing you to display processed code within
    different areas of your template. There is a neat trick you can add to your browser
    URL in order to see where module positions are located within a Joomla! Template.
    Simply enter in the following at the end of your main URL: /index.php?tp=1. So
    the full URL should look like: http://localhost/JMultimedia/index.php?tp=1:


    ![](img/0151410972a5c5ea0aab26416e44b1da_298_0.png)


    In most Joomla! Templates, this will display the available positions on the page
    and give you a helpful reminder of their names and locations within the template.


    You can achieve the same effect by visiting the Extensions | Template Manager
    screen and clicking on the template name you wish to preview. On the Template
    Edit screen, a preview button is located at the top-right of the page.'
  merge: -1
  img_proc: true
- pgno: 299
  md: '# Adjusting the menu


    By default, our Joomla! Installation has the Main Menu module published in the
    left-hand column. The JA_Purity template has a built-in module positioning and
    styling for your Main Menu to be displayed in a horizontal position underneath
    the logo area. To make your Main Menu show in this position, perform the following:


    +   1. In your Joomla! administration, navigate to the Extensions | Module Manager
    screen.

    +   2. Locate the Main Menu module and click on its title in order to edit it.

    +   3. In the Details area of the page, adjust the following parameters: Show
    Title = No, Position = hornav:


    ![](img/0151410972a5c5ea0aab26416e44b1da_299_0.png)


    4. Click on Save on this page and view the frontend of the website. Your side
    menu that was located in the left column will now show up in the menu bar under
    the site logo:


    ![](img/0151410972a5c5ea0aab26416e44b1da_299_1.png)


    Using this horizontal navigation area will help maximize the display space.'
  merge: -1
  img_proc: true
- pgno: 300
  md: '# Front page features


    There are a number of ways to display content on a Joomla! website''s "Home Page".


    # The front page component


    The Joomla! front page is a default view of the `com_content` component. This
    component allows you to control how your home page is displayed. The `com_content`
    component has the ability to display multiple articles on the front page, helping
    to create a magazine-type display of your articles. The front page layout is configured
    by the parameters associated with the Home link in the Main Menu.


    To customize the look and feel of this, within the administration, navigate to
    Menus | Main Menu and click on the Home link to edit it.


    On the right-hand side, under Menu Parameters, you can adjust the number of articles
    to be displayed and the number of columns to be shown in your front page. Let''s
    set the numbers as per the following image:


    ![](img/0151410972a5c5ea0aab26416e44b1da_300_0.png)


    Once you have changed the values, click on Save on that screen to save your changes,
    and that is all we need to do now in this area. If you refresh the frontend of
    your website, you will see no changes yet, but we have set the display now for
    when we add some content.


    Let''s add a few articles into our website, so we can start to build our front
    page features.


    Navigate to the Article Manager and create a new article by clicking on the "New"
    icon at the top-right of the screen. Remember our Fake Latin text generator; it
    will now come in handy! Go grab some fake text (or use real text if you prefer)
    and paste this into your new article. Make sure you give your article a Title
    (I have used "Article 1") and place this into the Section called "General" and
    Category called "Content". Make sure the article is "Published" and also "Published
    on the front page", then click on Save at the top-right of the screen.'
  merge: -1
  img_proc: true
- pgno: 301
  md: '![](img/0151410972a5c5ea0aab26416e44b1da_301_0.png)


    When you have clicked on Save, you will be taken back to the Article Manager screen.
    We want to repeat this process, so we have at least three to four articles displayed.
    Hence, use the "Copy" feature on the Article Manager screen in order to clone
    the article:


    +   1. In the Article Manager, click on the left-hand side radio button next to
    the article you wish to copy.

    +   2. Click on the "Copy" article icon at the top-right of the screen.

    +   3. Choose the section and category you wish to copy the article into (in our
    case, "General – Content"), and then click on Save.

    +   4. Click on the title of the new article to edit it. Once in the Edit Article
    screen, adjust the Title and Alias of the article (Article 2, 3, 4, and so on)
    and make sure they are set to a published state and viewable on the front page).


    If all of your copied articles have been published, when you look at the frontend
    of your site, you should now see two of them shown on the Joomla! front page.
    This is because we told our "Home" menu link to display two articles only, and
    to show two columns:


    ![](img/0151410972a5c5ea0aab26416e44b1da_301_1.png)'
  merge: -1
  img_proc: true
- pgno: 302
  md: 'You will notice that the articles have been displayed randomly. It is possible
    to show them by most recent article first, the physical ordering of them in the
    Article Manager, or by alphabetical order. These display and ordering configurations
    are all made in the "Home" menu link, under the **Parameters (Advanced)** section:


    ![](img/0151410972a5c5ea0aab26416e44b1da_302_0.png)


    # Adding a module to display our latest news


    There are a number of other features available for the front page; let''s add
    a module extension that nicely displays articles that are located within a certain
    category. The module we will use for this is called "ThumbsUp" and is available
    from the Joomla! Extensions page.


    Before we can use this module, we need some content to be displayed within it.
    Repeat the process you used to create and copy articles, but this time make sure
    they reside within the section labeled "News" and the category labeled "Latest"
    and are published. Do not publish them on the front page though. Feel free to
    add any images into your content items in order to add some color and interest
    to the pages.


    > This module pulls in news from certain sections and categories. Before editing
    this module, make a note of the ID number with the section labeled "News" and
    the category labeled "Latest". These can be found under the respective managers
    for those areas.


    Follow these steps:


    +   1. Visit `http://extensions.joomla.org` and search for "ThumbsUp".

    +   2. Visit the extension developer''s website and download the extension to
    your computer. (I will use the stable 1.3 version.)'
  merge: -1
  img_proc: true
- pgno: 303
  md: '+   3. Upload this extension in the Joomla! administration, using the Extension
    | Install / Uninstall feature.

    +   4. In the administration, navigate to Extensions | Module Manager, and click
    on the title of the "Latest Articles with Thumbnails" module to edit it.

    +   5. Adjust the parameters of the following:


    ![](img/0151410972a5c5ea0aab26416e44b1da_303_0.png)'
  merge: -1
  img_proc: true
- pgno: 304
  md: "Feel free to adjust any other parameters that you require. If you look at the\
    \ front page of your website now, it is starting to get some depth to it quickly:\n\
    \n![](img/0151410972a5c5ea0aab26416e44b1da_304_0.png)\n\n# Adding the date and\
    \ time\n\nThere are a number of ways to add a time and date function to your Joomla!\
    \ site. This can be a useful feature to users in news, magazine, or busy web portals.\
    \ Some commercial templates may already contain this feature, and simply require\
    \ it to be activated. Others, like the JA_Purity template, do not have this option,\
    \ so we will proceed to include it.\n\n+   1. **Method 1**\n+   \n+      Insert\
    \ the correct PHP, JavaScript, and / or HTML code into your template manually.\
    \ There are a number of pre-built scripts available on the Web that display the\
    \ time and date on your site pages."
  merge: -1
  img_proc: true
- pgno: 305
  md: "# 2. Method 2\n\nUse an available Joomla! Extension such as the Date and Time\
    \ module. Here are the steps:\n\n+   ◦ Search the Joomla! Extensions area for\
    \ \"Time\" at `http://extensions.joomla.org`.\n+   \n+   ◦ On the results page,\
    \ click on the category labelled **Date & Time**, and this module will be displayed.\n\
    +   \n+   ◦ Visit the extension developer's website and download the extension\
    \ to your computer.\n+   \n+   ◦ Upload this extension in the Joomla! administration,\
    \ using the **Extension | Install / Uninstall** feature.\n+   \n+   ◦ In the administration,\
    \ navigate to **Extensions | Module Manager**, and click on the Title of the \"\
    Date2\" module to edit it.\n\nAdjust the Module Parameters as you wish. I am going\
    \ to use the \"JavaScript\" feature to check the time (so seconds show in real\
    \ time), and I will publish the module to the \"Left\", which will show in a left\
    \ column in our template. I am also going to turn off the module Title:\n\n![](img/0151410972a5c5ea0aab26416e44b1da_305_0.png)\n\
    \nIt is worth noting that these time and date features will work off the server\
    \ time. Hence, if working locally, you will see your local computer time.\n\n\
    # Adding a search feature\n\nAll sites that have any form of content need a search\
    \ feature to allow users to find this easily. The JA_Purity template has built-in\
    \ styling for a search box already included within the template's CSS, so adding\
    \ a new search feature to our site will be very easy.\n\n+   1. In the administration,\
    \ navigate to the **Extensions | Module Manager** screen.\n+   2. Click on the\
    \ **New** icon at the top-right of the screen to create a new module."
  merge: -1
  img_proc: true
- pgno: 306
  md: '3. From the available list of options, select the Search link and click on
    the text in order to load a new search module:


    ![](img/0151410972a5c5ea0aab26416e44b1da_306_0.png)


    4. Make sure the title is not displayed, but the module is enabled. It will need
    to be published in user4 position, which will display it at the top-right of our
    web page:


    ![](img/0151410972a5c5ea0aab26416e44b1da_306_1.png)


    5. Click on Save on that module, and if you look at the frontend of the site,
    you will see your new search box displayed below the font size controls:


    ![](img/0151410972a5c5ea0aab26416e44b1da_306_2.png)'
  merge: -1
  img_proc: true
- pgno: 307
  md: "Personally, I feel the default black background is a bit dark to see, so a\
    \ quick change to the template CSS file can adjust that. I will set the search\
    \ background to white, and the search text to black:\n\n```\n#ja-search .inputbox\n\
    {\n    width: 120px;\n    border: 1px solid #333333;\n    padding: 3px 5px;\n\
    \    color: #000000;\n    background: #FFFFFF;\n    font-size: 92%;\n}\n```\n\n\
    Remember to save your changes and you should see these reflected in your site.\n\
    \n# Adding images\n\nAs you have seen throughout the course of this book, images\
    \ can be easily added to Joomla! Articles and Modules and formatted as you require.\
    \ There are, however, some powerful image extensions for Joomla! that we will\
    \ now utilize within our site.\n\n# Adding an image gallery\n\nImage galleries\
    \ are one of the most popular extensions at Joomla.org, hence there are a number\
    \ of excellent options available.\n\nHopefully, you have had a good read of Chapter\
    \ 4, Adding and Managing Image Content, and have found image solutions you require\
    \ for your projects. For this tutorial, I am going to utilize a few extensions\
    \ to display images throughout the site.\n\n# Image gallery using Phoca Gallery\n\
    \nPhoca Gallery is a heavyweight contender for displaying beautiful photo galleries\
    \ in Joomla!. It is a feature-packed solution, so much so that you could probably\
    \ write a book on it in itself!\n\nThat said, we are quickly going to add this\
    \ to our site in order to create a feature rich photo gallery using this component,\
    \ module, plugin. I will cover the basic steps, however for detailed support the\
    \ developer's website and Joomla! Forums will be able to provide a wealth of knowledge:\n\
    \n+   1. Search the Joomla! Extensions area for \"Phoca Gallery\" at http://extensions.joomla.org."
  merge: -1
  img_proc: true
- pgno: 308
  md: '2. Visit the extension developer''s website and download the following extensions
    to your computer:


    +   - **Phoca Gallery Component**: Powers the main Phoca Gallery features.

    +   - **Phoca Gallery Search Plugin**: Allows your Joomla! search feature to also
    search Phoca Gallery images.

    +   - **Phoca Gallery Slideshow Plugin**: Displays a slideshow of images from
    a selected Phoca Gallery category `{pgslideshow id=...|width=...|height=...|delay=...|image=...}`.
    For an image, O: original, L: large, M: medium, S: small. Example: `{pgslideshow
    id=1|width=100|height=100|delay=3000|image=M}`.

    +   - **Phoca Gallery Image Module**: Displays random images from the Phoca Gallery
    Component.


    ![](img/0151410972a5c5ea0aab26416e44b1da_308_0.png)


    3. Upload these extensions to the Joomla! administration using the Extension |
    Install / Uninstall feature. (Tackle the component last as you will need to run
    an installer for the component once it has been uploaded).'
  merge: -1
  img_proc: true
- pgno: 309
  md: '+   4. In the administration, navigate to **Extensions | Plugin Manager**,
    and enable the search and slideshow plugins.

    +   5. In the administration, navigate to **Components | Phoca Gallery**, and
    on the main Control Panel page, click on the icon "Categories". Set up a new category
    by clicking on the "New" icon at the top-right of the page. Let''s give this a
    title of **Images** and click on **Save** on that page (note that you can revisit
    all of these options to define them as you require).

    +   6. Adding images can be done using various methods, with Phoca allowing you
    to use a Flash-based and Java-based upload feature to upload multiple images quickly.


    I will use the multiple image feature to add a number of images into my new "Images"
    Category. The first step is to upload the images, and then once they are uploaded,
    you associate them with a category. This provides a mail image resource for future
    reference.


    ![](img/0151410972a5c5ea0aab26416e44b1da_309_0.png)'
  merge: -1
  img_proc: true
- pgno: 310
  md: 'Once your images have been uploaded, choose the "Images" Category (that we
    will put them into) and click on the **Save** button at the top of the screen.
    Depending on the number of images you upload, you will probably see a processing
    screen appear for a period. The page should refresh after processing and you will
    see your new images loaded into the **Image** area:


    ![](img/0151410972a5c5ea0aab26416e44b1da_310_0.png)


    To display these in your website, we need to create a new menu link to this gallery.


    Navigate to **Menu | Main Menu**, and create a new menu item to **Phoca Gallery
    | Phoca Gallery Category Layout**. The new menu item edit page will show and we
    need to give our menu link a title called "Image Gallery".


    On the right-hand side of this screen are the available parameters for the new
    Phoca Gallery menu link. Firstly, we need to choose the category to link to —
    **Images**. The following parameters contain a vast array of options, and can
    allow you to manipulate your gallery colors, layout, features, and so on. You
    can set these at a global level in Phoca Gallery, but having overrides at the
    menu item level means that each gallery (or link to a gallery) that you create
    can contain the various options you require. For now, let''s click on **Save**
    on this menu item and see the results.'
  merge: -1
  img_proc: true
- pgno: 311
