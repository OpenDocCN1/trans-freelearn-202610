- pgno: 201
  md: '# 7


    # Collaborating with

    External Sources


    Sharing information between popular external resources such as Twitter, Facebook,
    and Google is an increasingly popular feature required by Joomla! users.


    With new social networking sites and multimedia portals springing up every month,
    integrations between these and Joomla! continue to evolve through the use of powerful,
    third-party extensions.


    Designed to extend the Joomla! Framework with new functionality, this chapter
    will look at the most popular collaboration extensions for Joomla! and the features
    they contain, as well as using good old fashioned HTML to embed content into your
    site. It includes:


    +   - Social networking

    +   - Using HTML code to include resources

    +   - Using third-party extensions


    # Flickr, YouTube, MySpace, Twitter, Facebook, Google... the list goes on


    Since its beginning, the Web has been used as a tool to meet people and share
    information. In recent years though, the interactions between web users have taken
    a rapid evolution.


    Instead of using the Web as a tool to look up information, we are now inserting
    ourselves into it, and using it to connect ourselves to other people. The terminology
    "Web 2.0" was used to describe a more social, collaborative, and responsive web,
    and we see that these features are now well engrained into the modern "Web".'
  merge: -1
  img_proc: true
- pgno: 202
  md: '# Collaborating with External Sources


    The phrase "What came first, the chicken or the egg?" springs to mind when trying
    to summarize recent evolutions of the Web and popular networking sites that are
    on it, for example, Facebook and Twitter. These two "social tools" required the
    Web to be where it was for their evolution, but yet they have dramatically helped
    to shape the way the "Web" now is, creating new paths into website development,
    third-party collaboration and interactions.


    "Where is it going?" and "Where will it go to?" are questions often asked. When
    I was five years old, I watched a Star Trek episode with the actors using handheld
    flip-type devices, and using the term "Beam me up Scotty", communicating with
    their Starship. Now every day I carry a handheld computer / phone that is trackable
    by satellites, and with a few clicks I can post and receive information to a global
    notice board, the World Wide Web. It scares me in one respect how quickly we are
    socially evolving around this increasingly corporate driven entity named the Web,
    but I get excited with the technology and opportunities it brings:


    ![](img/0151410972a5c5ea0aab26416e44b1da_202_0.png)


    So, it may be Google, Facebook, Twitter, MySpace, YouTube, and so on; Joomla!
    can collaborate with them all. At the end of the day, it is electronic information
    that is contained in one location, and then presented on another. Certain Joomla!
    Extensions have developed because there was a requirement to show this information
    and display it on the users'' Joomla! based website. This chapter will highlight
    some of the most popular extensions and tools currently providing these solutions.'
  merge: -1
  img_proc: true
- pgno: 203
  md: '# # Using HTML code to include resources


    When using Joomla! as a framework for your website, not only do you get a database
    driven Content Management System with bells and whistles, you get the ability
    to use custom HTML within your site by including it into articles and modules.


    There are even specialized Joomla! Extensions that allow you to take this one
    step further and insert custom PHP, JavaScript, and HTML. For popular external
    resources, the code to share content usually comes in an accessible HTML format,
    which Joomla! can manage without the requirement of custom code plugins.


    This key feature means that we can customize the content of our Joomla! pages
    and embed and share content from popular external resources with just a few clicks.
    Many popular multimedia web resources such as YouTube, Google Video, MySpace,
    and Flickr offer the ability to share content; in fact this feature is one of
    the main purposes behind each of these distribution services.


    Using the content from these distribution services means that we can share it
    more easily with the world, but also save money on bandwidth costs. With data-intensive
    multimedia files having to be stored and then delivered to your site visitors,
    hosting your own multimedia content can quickly end up costing you a considerable
    sum in web hosting fees.


    Inserting custom embedded code from an external resource such as MySpace, YouTube,
    Google Video, and Flickr is actually an easy process thanks to the distribution
    site packaging and delivering the content ready for us to use. The important point
    is that the code generated by your external resource needs to be valid and designed
    to work in an HTML environment. If this is the case, then the process to embed
    it into your Joomla! Article or Module should be very similar for most of them.


    For this example, we will insert a *video clip sourced from Google Video*, and
    enter this into a Joomla! Module. As Google Video is delivering the content and
    is designed to offer us easy code to share this content, adding it into our Joomla!
    website is no more than a simple copy and paste exercise.


    Here are the steps required:


    ![](img/0151410972a5c5ea0aab26416e44b1da_203_0.png)


    > > When starting to insert custom code into your Joomla! Articles, it is important
    to turn off WYSIWYG editors for your user account. This is because these editors
    cannot always process the custom HTML code. If the code is not recognized by the
    editor when loading in the content, it will remove the code altogether. The editor
    settings can be adjusted in the Global Configuration, or on a user basis via the
    User Manager.'
  merge: -1
  img_proc: true
- pgno: 204
  md: '+   - Select your resource, in this case we will use a windsurfing video sourced
    from Google Video. On the Video page, we see numerous options for sharing the
    content. We want the option to **Embed Video**:

    +   - Copy the code to your clipboard:

    +   - Log into your Joomla! Administration and navigate to the **Module Manager**
    area. Select the **New** button from the top-right menu icons to create a new
    module.

    +   - On the **Add New Module** page, select the **Custom HTML** option, which
    allows you to create a new module with your own content in it:


    ![](img/0151410972a5c5ea0aab26416e44b1da_204_0.png)


    ![](img/0151410972a5c5ea0aab26416e44b1da_204_1.png)


    ![](img/0151410972a5c5ea0aab26416e44b1da_204_2.png)


    The Custom HTML option allows you to enter in custom text or code within a module
    position.'
  merge: -1
  img_proc: true
- pgno: 205
  md: '![](img/0151410972a5c5ea0aab26416e44b1da_205_0.png)


    +   - You will need to give your new module a **Title**. Select its **Position**
    on your template and select the other options available for module publishing.

    +   - In the **Custom Output** box, paste your "Google Video embed code":


    ```

    ```html

    <embed id=VideoPlayback src=http://video.google.co.uk/googleplayer.swf?docid=-166983677991678306&hl=en&fs=true
    style=width:400px;height:326px allowFullScreen=true allowScriptAccess=always type=application/x-shockwave-flash></embed>

    ```

    ```


    +   - Navigate to the frontend of your Joomla! site to see the **Google Video**
    content now showing in your Joomla! website.


    ![](img/0151410972a5c5ea0aab26416e44b1da_205_1.png)


    This method of embedding external content can be applied to Joomla! Articles also,
    and content can be utilized from almost all distribution sites, as long as their
    supplied HTML code is accepted by Joomla!.'
  merge: -1
  img_proc: true
- pgno: 206
  md: '# Using third-party extensions for external resources


    First of all, the opportunity for the inclusion of hundreds of external resources
    would be a possibility for this chapter.


    ![](img/0151410972a5c5ea0aab26416e44b1da_206_0.png)


    Instead of this approach, listed are some of the more popular GPL-based extensions
    residing at Joomla.org, and those that are feature packed and have stood the test
    of time. Further information about GPL can be found at `http://en.wikipedia.org/wiki/GNU_General_Public_License`.


    We have also taken the opportunity of trying to list only non-commercial extensions
    in this chapter. Professional commercial extensions may also be available for
    collaborating with external resources.


    Without sounding like a stuck record, the purpose of Joomla! Extensions is to
    provide additional functionality to your Joomla! Framework. Some extensions are
    so useful that if you build more multiple Joomla! websites, you may even think
    of installing a particular extension always as a default. An example of this might
    be Community Builder from `http://www.joomlapolis.com` which, besides many other
    features, enhances the user registration and profile options. Different Joomla!
    users will collect or design their own tools which they are happy to utilize,
    and this is one of the reasons that Joomla! has such a thriving community.


    Out-of-the-box Joomla! is a slick CMS that is lightweight, and the true power
    of Joomla! is in the application framework which has been developed to allow the
    extension of its core features. The majority of the multimedia features are added
    to our Joomla! sites via extensions, and with the popularity of social networking
    and external multimedia resource portals, the extensions around these sites have
    rapidly grown.'
  merge: -1
  img_proc: true
- pgno: 207
  md: "The extensions have been organized under popular titles such as Social Networking,\
    \ Video, Audio, Weather, among others. There may be some extensions that fall\
    \ under more than one of these categories, so they have been organized within\
