- pgno: 313
  md: '+   1. Search the Joomla! Extensions area for "bk thumb" at http://extensions.joomla.org.

    +   2. Visit the extension developer''s website and download the extension to
    your computer.

    +   3. Upload this extension to the Joomla! Administration, using the Extension
    | Install / Uninstall feature.

    +   4. In the administration, navigate to Extensions | Plugin Manager, and click
    on the title of the BK-Thumbs plugin to edit it.


    BK-Thumbs contains a number of parameters, all creating quite a different look
    and feel to the presentation of your images. I suggest you adjust these as you
    feel the need to, but for now let''s make sure the plugin is enabled and click
    on Save at the top-right of the screen.


    In order for BK-Thumbs to do its work, we need a new content article called "BK-Thumbs"
    and to make this reside within the section labeled "Images" and the Category labeled
    "General Image". Within your content item, insert some text and upload a good-size
    image by using the "Image Upload" button at the bottom of the content article.
    For a suitable size, aim for a pixel size between 600px and 700px width or height,
    depending on the image layout.


    In order to display our new image feature, we need to link to this article from
    the Main Menu. To do this, simply create a new link on the Main Menu and link
    to Articles | Article Layout:


    ![](img/0151410972a5c5ea0aab26416e44b1da_313_0.png)'
  merge: -1
  img_proc: true
- pgno: 314
  md: 'Give your menu link a title (BK-Thumb), and on the right-hand side, select
    the "BK-Thumb" article you created. One more thing to do here, that is under the
    parent item on the left column; choose your existing "Image Gallery" menu link.
    This will start building a submenu under the "Image Gallery" menu. Remember to
    save your new menu item by clicking on Save at the top-right of the screen.


    ![](img/0151410972a5c5ea0aab26416e44b1da_314_0.png)


    When you view the frontend of your website (refresh the page), you should now
    see the submenu item "BK-Thumb" shown under the "Image Gallery" menu Link. This
    will take you to the page that displays a nice, new automatic thumbnail of your
    larger image in the content article


    > If you can''t see the submenu item in the Administration | Extensions | Module
    Manager | Main Menu module, make sure the parameter "Always show sub items" is
    set to "Yes".


    ![](img/0151410972a5c5ea0aab26416e44b1da_314_1.png)'
  merge: -1
  img_proc: true
- pgno: 315
  md: 'BK-Thumb can automatically pick up multiple images, add captions, titles, and
    so on. It contains some great features for a plugin. I suggest playing around
    with it to see if it suits your projects. You may notice that BK-Thumb also affects
    some other images on your website, so this solution will be suitable for some
    people and not others.


    # Multimedia display using RokBox


    I mentioned previously that one of my favourite extensions is RokBox by Rocket
    Theme; this is due to its diversity to display multiple types of content. RokBox
    is a MooTools-powered JavaScript slideshow that allows you to quickly and easily
    display multiple media formats, including images, videos (video sharing services
    also), and music. Here''s how to use it easily in your site:


    +   1. Search the Joomla! Extensions area for "RokBox" at http://extensions.joomla.org.

    +   2. Visit the extension developer''s website and download the extension to
    your computer. (You can install the Content Button as well, but we definitely
    require the main rokbox-system.zip file).

    +   3. Upload this extension in the Joomla! administration, using the Extension
    | Install / Uninstall feature.

    +   4. In the administration, navigate to Extensions | Plugin Manager, and enable
    the "RokBox" plugin:


    ![](img/0151410972a5c5ea0aab26416e44b1da_315_0.png)


    The RokBox plugin is triggered by using a special tag, or link code, in content
    items and modules. The developer''s website contains a helpful documentation page
    and forums. You can find the main RokBox page at http://www.rockettheme.com/extensions-joomla/rokbox.


    The way RokBox works is really simple. All potential RokBox links need is an extra
    element within them to work with any hyperlinks: <a>. This element is used to
    put the following code into your link: <a rel="rokbox" href="/...">example</a>.
    When RokBox finds a hyperlink that contains this information, RokBox will take
    it into consideration. Using this method means you can use RokBox in modules and
    not just articles. If you do want to use RokBox within a Joomla! Article, then
    you can use another method (the following tags) which RokBox is built to recognize:


    ```

    {rokbox...}link to the file{/rokbox}

    ```'
  merge: -1
  img_proc: true
- pgno: 316
  md: 'There are many other parameters we can add to this basic tag, to start displaying
    the title and other information for your media:


    ```

    {rokbox size=|100 50| text=|my rokbox| thumb=|images/thumb.jpg| title=|Head ::
    Text| album=|photos| module=|login|}images/image.jpg{/rokbox}

    ```


    The choice of which way you reference your media is up to you. More information
    can be found within the RokBox documentation.


    For now, let''s create a new custom HTML module by navigating to the Extensions
    | Module Manager screen, and clicking on the "New" icon, and then on "Custom HTML"
    to create a new custom module.


    Give the module a title called "RokBox" and make sure the position is set to "Left".
    Then we need to enter the following into the "Custom Output" area of that screen:


    ```

    <a href="images/stories/image1.jpg" title="Image 1 :: Image Description" rel="rokbox[600
    400]">Link to RokBox Image 1</a>

    ```


    The previous code adds a hyperlink to the text called Link to RokBox Image 1,
    gives it a title of Image 1 and a description of Image Description, and opens
    the image using RokBox in a window size of 600 by 400 pixels. Make sure you have
    an image uploaded in your /images/stories folder with the correct name, then click
    on the Apply button at the top-right of the screen to apply your changes.


    When you view the frontend of your website you should now have a text link to
    the RokBox feature:


    ![](img/0151410972a5c5ea0aab26416e44b1da_316_0.png)'
  merge: -1
  img_proc: true
- pgno: 317
  md: "RokBox can be used as we have here, or you could insert an image with the RokBox\
    \ link around it, effectively creating a thumbnail link to the RokBox content.\
    \ Many options are possible, including using RokBox to create image galleries\
    \ with thumbnails.\n\n# # Adding video features\n\nVideo is the media element\
    \ of the moment! As highlighted earlier in this book, there are some great video\
    \ features now available for Joomla!, so let's crack on with these and integrate\
    \ some into our project.\n\n# # RokBox, here we go again!\n\nAs the RokBox plugin\
    \ can also play video, let's add to our RokBox side module to display a YouTube\
    \ video below our recently created RokBox image link. Here are the steps:\n\n\
    +   1. Open up the RokBox module in Extensions | Module Manager.\n+   2. Add the\
    \ following code to the custom output box:\n\n```\n```\n<p>\n<a href=\"http://www.youtube.com/watch?v=6RWQ2OQ7_2Y\"\
    \n title=\"Cars :: 2010 Aston Martin Vantage V 12\"\n rel=\"rokbox(425 373) (demo)\"\
    >Link to RokBox YouTube Video</a>\n</p>\n```\n```\n\nThe code is broken down as\
    \ follows:\n\n+   * The link is to a YouTube hosted video.\n+   * The title is\
    \ Cars.\n+   * The description is 2010 Aston Martin Vantage V 12.\n+   * It will\
    \ open in a RokBox window sized 425 px by 373 px.\n+   * The text is Link to RokBox\
    \ YouTube Video. I have placed paragraph tags around this in order to create spacing\
    \ with the image link that we created earlier.\n\nClick on Apply at the top-right\
    \ of the page to save the changes."
  merge: -1
  img_proc: true
- pgno: 318
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 319
  md: 'It is possible to use RokBox to display galleries of videos and display these
    throughout modules and in articles. I think you will agree that it''s a great
    multimedia extension!


    # Video using hwdVideoShare


    If you are after a hefty YouTube type video approach, the hwdVideoShare video
    sharing gallery is an open source (GNU GPL) video sharing Joomla! Extension that
    functions like websites such as YouTube. It features multiple uploading tools
    for large media uploads. The component supports numerous video formats.


    Let''s take a look at setting this up for our project:


    +   1. Search the Joomla! Extensions area for "hwdVideoShare" at http://extensions.joomla.org.

    +   2. Visit the extension developer''s website and download the extension to
    your computer.

    +   3. Unzip the downloaded file first before uploading it to Joomla!. The package
    contains numerous extensions within the ZIP file.

    +   4. Upload the com_hwdVideoShare.gz file to the Joomla! administration, using
    the Extension | Install / Uninstall feature. In the administration, navigate to
    Components Menu | hwdVideoShare. On this page, you get an option to install sample
    video data. Agree to the non-commercial license and click on the "Finish Setup"
    icon on that page:


    ![](img/0151410972a5c5ea0aab26416e44b1da_319_0.png)'
  merge: -1
  img_proc: true
- pgno: 320
  md: 'After the setup has completed, you will see a page with options to clean things
    up and run maintenance on the video component. Leave all settings as they are
    and click on the "Run Tools" icon at the top-right of the screen. The maintenance
    should run and refresh the screen.


    Now let''s see what we have so far after installing the main component with some
    default data. In the administration, navigate to the Menus | Main Menu and click
    on New at the top-right of the screen to create a new menu item. From the available
    list, select hwdVideoShare and then from the sublist select Video Homepage:


    ![](img/0151410972a5c5ea0aab26416e44b1da_320_0.png)


    Give the menu link a title called "Video Gallery" and click on Save at the top-right
    of the screen. If you now view the frontend of the site, you will see a new menu
    item linking to the hwdVideoShare component:


    ![](img/0151410972a5c5ea0aab26416e44b1da_320_1.png)'
  merge: -1
  img_proc: true
- pgno: 321
  md: 'The hwdVideoShare component is a big one, and full of video features as are
    displayed on the author''s demonstration site. It is possible to create a full-blown
    video hosting service such as YouTube (within your Joomla! site), or you can simply
    offer videos nicely categorized and lock down frontend uploading features. I would
    love to spend more time populating this component and adding video features, but
    I feel that the supporting documentation explains all the features of this extension.
    For now, we need to carry on and add some more multimedia features to our project.


    # Videos within articles using FlowPlayer


    For the majority of you, being able to place videos within your articles is probably
    a technique that you will require often. The FlowPlayer uses a Flash-based video
    player that plays a video file easily in your articles by using the plugin tag:


    ```

    {flowplayer}URL_Video{/flowplayer}

    ```


    The FlowPlayer is available as a Joomla! Plugin so you can add to your articles,
    or also as a module to place in any module position you require. To add the FlowPlayer
    into Joomla!:


    +   1. Search the Joomla! Extensions area for "FlowPlayer" at http://extensions.joomla.org.

    +   2. Visit the extension developer''s website and download the extensions to
    your computer.

    +   3. Upload both the video and plugin extensions to Joomla! using the Extension
    | Install / Uninstall feature.

    +   4. Navigate to the Extensions | Plugin Manager and publish the Content – FlowPlayer
    plugin:


    ![](img/0151410972a5c5ea0aab26416e44b1da_321_0.png)


    > There is another plugin called Flow Player that was installed for use with the
    hwdVideoShare component. Make sure you enable the Content – FlowPlayer plugin
    which is the one we just installed.'
  merge: -1
  img_proc: true
- pgno: 322
  md: 'The plugin also contains additional parameters, so you might want to take a
    look at these while enabling the plugin:


    ![](img/0151410972a5c5ea0aab26416e44b1da_322_0.png)


    Once the plugin has been enabled, navigate to Content | Article Manager and create
    a new Joomla! Article named "Videos". Select the Section labeled Video and Category
    labeled General Video; this simply helps with the organization of our content
    and media. We need to enter in some text for the article, and then enter the following
    code to activate FlowPlayer and link to your video file:


    ```

    {flowplayer}URL to Video{/flowplayer}

    ```


    This file can reside within your website file system:


    ```

    {flowplayer}images/video/dog.mov{/flowplayer}

    ```


    Make sure you save your article, and head over to create a new menu link to display
    this article. I am going to make this a submenu link of the Video Gallery link,
    similar to what we did for the audio link, and call it "Video Page".


    ![](img/0151410972a5c5ea0aab26416e44b1da_322_1.png)'
  merge: -1
  img_proc: true
- pgno: 323
  md: '> Want to do something similar but link to a YouTube video instead?\nUnfortunately
    due to a licensing issue, the FlowPlayer cannot play YouTube content, but we have
    other options.


    # Using the QTube extension to display\nYouTube videos


    As you are now aware, there are a number of multimedia extensions that provide
    the flexibility of displaying multiple media types. These are very useful because
    you only require one plugin or extension to cater for numerous situations.


    A simple but specialist plugin worth mentioning though is the QTube plugin. If
    you think that all of your video content is going to come from YouTube hosted
    videos, then take advantage of the small footprint that this plugin creates. It
    does what it says on the tin, and that is playing YouTube videos within your Joomla!
    Articles.


    Like the FlowPlayer, QTube offers a module and a plugin, so you can play videos
    from YouTube either in module positions or within articles. To install these extensions,
    follow these steps:


    +   1. Search the Joomla! Extensions area for "QTube" at `http://extensions.joomla.org`.

    +   2. Visit the extension developer''s website and download the extension to
    your computer.

    +   3. Upload both the extensions to Joomla! using the **Extension | Install /
    Uninstall** feature.

    +   4. Navigate to the **Extensions | Plugin Manager** area and click on the **QTube**
    plugin title to edit. Here you can configure the plugin parameters you require,
    and make sure the plugin is enabled. Click on **Save** and we are ready to roll!


    Here is the plugin syntax required in its simplest form:


    ```

    ```text

    {qtube vid:=xxx}

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 324
  md: 'In place of xxx, you must put the unique identifier assigned to the video from
    YouTube.com. To obtain it, simply visit the YouTube site and look at your browser''s
    address bar while you are watching the video you want to include. You will see
    a URL like this:


    ![](img/0151410972a5c5ea0aab26416e44b1da_324_0.png)


    The CQzUsTFqtW0 part is the unique movie identifier, so our QTube code will become:


    ```

    {qtube vid:= CQzUsTFqtW0}

    ```


    All we need to do now is to insert this into our article, so let''s head back
    to our Video Page with the FlowPlayer video in it and insert our QTube code in
    also.


    ![](img/0151410972a5c5ea0aab26416e44b1da_324_1.png)


    Checkout the documentation for the QTube player; you can adjust player size, add
    border and color, among other features.


    Let''s quickly publish a video using the QTube module. Navigate to the Extensions
    | Module Manager screen and click on the QTube module. You can configure this
    as you wish. I have placed it to the left, under my RokBox module, and have configured
    a width and height so that my video fits into the left column. I have chosen to
    show it on all pages and have saved the module.'
  merge: -1
  img_proc: true
- pgno: 325
  md: 'When we now view the frontend of the site, you can see the new QTUBE module
    playing a video in the left-hand side column:


    ![](img/0151410972a5c5ea0aab26416e44b1da_325_0.png)


    There are numerous other parameters and features for styling and playing videos
    using the QTUBE plugin and module. It really is a simple, but very easy, way to
    embed YouTube videos into our Joomla! site.


    # Adding audio features


    Audio tools for Joomla! are a fantastic way of not only offering music and interviews
    to your site visitors, but it can be utilized to help offer content to users with
    disabilities. There are some great audio extensions available and we will add
    a few to our project now.'
  merge: -1
  img_proc: true
- pgno: 326
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 327
  md: 'You will need to click on **Save** on your article and create a new top-level
    menu link to it, and you should now see something similar to the following:


    ![](img/0151410972a5c5ea0aab26416e44b1da_327_0.png)


    # ## Simple MP3 Player


    Simple MP3 Player is an easy to configure MP3 player module that uses a Flash-based
    audio player. It has various styling options and can be used as a multiplayer
    with playlists as well as a single player with only control buttons. The module
    comes with language support, with English and German language files included.


    Simple MP3 Player is a versatile player that we can put into any module position,
    so let''s add it:


    +   1. Search the Joomla! Extensions area for "Simple MP3 Player" at `http://extensions.joomla.org`.

    +   2. Visit the extension developer''s website and use the download link on the
    right-hand side of the page.'
  merge: -1
  img_proc: true
- pgno: 328
  md: '+   3. Upload the extension to Joomla! using the **Extension | Install / Uninstall**
    feature.

    +   4. Navigate to the **Extensions | Module Manager** area and click on the **Simple
    MP3 Player** module title to edit it.


    The module has not only been well designed, but the author has considered putting
    documentation into the module, so you have an easy reference guide to all of the
    Module Parameters. The main fields to populate are the following:


    ![](img/0151410972a5c5ea0aab26416e44b1da_328_0.png)


    You can enter details to your audio directory into the server path, enter the
    MP3 filenames into the MP3 file (separating them with a pipe, |, symbol), and
    then enter in some MP3 titles for the tracks (separated with a pipe symbol). There
    are plenty of other adjustments this module allows, such as player color and layout,
    but for now make sure it''s enabled and published in the right column. Then click
    on Apply and you will see the results shown on your site:


    ![](img/0151410972a5c5ea0aab26416e44b1da_328_1.png)


    You may want to revisit the module to customize it, and the supporting documentation
    will make this job easy.


    # RokBox for audio


    You can use RokBox to play audio files also with the nice JavaScript pop-up box
    that the viewer''s audio player will play within.


    To use it, head back to your RokBox module in the administration and enter the
    following syntax:


    ```

    <a href="PathToAudio" title="Audio Title :: Audio Description" rel="rokbox[200
    100](audio)">Link to RokBox Audio File</a>

    ```'
  merge: -1
  img_proc: true
- pgno: 329
  md: 'We have done exactly the same as our image and video files, except adjust the
    values for the audio file. I am going to save this module and view my updated
    side module:


    ![](img/0151410972a5c5ea0aab26416e44b1da_329_0.png)


    # Adding podcasts


    There are numerous ways to add podcasting capabilities to your Joomla! project,
    and more details on this can be found in Chapter 5, *Using Audio in Your Joomla!
    Website*. For now, there is one very important and wonderful extension we will
    add to our project. The Joomla! Podcast Suite by Joseph LeBlanc contains a component,
    module, and plugin and is a great bit of kit to offer easy podcasting capabilities.
    Here is how to install and use it:


    +   1. Search the Joomla! Extensions area for "Podcast Suite" at http://extensions.joomla.org.

    +   2. Visit the extension developer''s website and download the component, module,
    and plugin to your computer. (Download links are clearly listed on the developer''s
    site.)

    +   3. Upload the extensions to Joomla! using the **Extension | Install / Uninstall**
    feature.

    +   4. Navigate to the **Extensions | Plugin Manager** area and enable the **Content
    – Podcast** plugin (there are no Plugin Parameters to set).

    +   5. Navigate to the **Components Menu | Podcast Suite | Manage Clips.**


    You will see that a notice informs you that you will need to upload some audio
    MP3 content into the following directory: `/components/com_podcast/media/`.'
  merge: -1
  img_proc: true
- pgno: 330
  md: 'It is possible to change this to any path you wish through the **Parameters**
    button on the **Manage Clips** screen. Once you have uploaded a file (or several)
    into your repository (usually via FTP if it''s to a remote server), refresh this
    page and you will see your audio content:


    ![](img/0151410972a5c5ea0aab26416e44b1da_330_0.png)


    The Podcast Suite is unique in that the component generates a new Joomla! Article
    and places a tag to the audio file within this. Then it uses RSS capabilities
    in order to produce the podcast feed.


    To create the first podcast, click on the title of one of your audio tracks. You
    will see the following screen:


    ![](img/0151410972a5c5ea0aab26416e44b1da_330_1.png)'
  merge: -1
  img_proc: true
- pgno: 331
  md: 'You will need to populate the fields with applicable information, and then
    click on the "Save and Publish Article" icon at the top-right of the screen. This
    will actually create a new article and pre-populate it with some of the previously
    entered information. This is now simply a Joomla! Article, so you can revisit
    it at any stage if you wish to enter in further information. Make sure that you
    select the section "Audio" and the Category "Podcast" to help with article organization,
    and that the article is also published. Then click on Save at the top of the page.


    Now our first podcast has been configured, we can do two things:


    +   - Create a Menu link to this from a Menu.

    +   - Publish the Podcast Module to display our new feed.


    Now we''re going to go publish our Podcast Module. Navigate to Extensions | Module
    Manager and click on the Podcast module to edit it. There are a number of parameters
    you can set, but for now let''s enable the module, publish it on the right-hand
    side column, and adjust the module ordering so it shows at the top of the right-hand
    side column. Click on Apply to save your changes and take a look at the frontend
    of the site. There you will see the new Podcast module, and if you click on the
    icon, you will be taken to an RSS page. (The address is similar to the following
    address: http://localhost/JMultimedia/index.php?option=com_podcast&view=feed&format=raw.)


    ![](img/0151410972a5c5ea0aab26416e44b1da_331_0.png)'
  merge: -1
  img_proc: true
- pgno: 332
  md: 'Here you will be able to view your podcasts. You may want to go back into your
    module and adjust some of its parameters to define the look you require. Here
    is my new module after a few adjustments:


    ![](img/0151410972a5c5ea0aab26416e44b1da_332_0.png)


    When new podcasts are added to the Podcast Suite, they will be shown automatically,
    and any users subscribed to these feeds will be notified of the new podcasts that
    are available.


    I have rushed through this pretty quickly in order to show you the basic process,
    but there are other features available in the Joomla! Podcast Suite. In the administration,
    click on Menu | Main Menu. Create a new menu link to Articles | Article Layout,
    and select the Joomla! Audio Article that was just created for your first podcast.
    Create a link called Podcast Number 1, and make it a submenu of the main audio
    link. Once you have saved this new menu item, visit the frontend of your site
    to view the results:


    ![](img/0151410972a5c5ea0aab26416e44b1da_332_1.png)'
  merge: -1
  img_proc: true
- pgno: 333
  md: 'You will now see that the Joomla! Article contains a nice Flash MP3 player
    where our podcast tag resides. So not only does the Podcast Suite allow you to
    publish podcast feeds, but you can play the audio and display it within your site
    articles.


    > If you would like to create a link to all of your podcasts, simply create a
    menu link to a Category Blog Layout. Each time you add a new podcast article to
    your site, and locate it within the correct section and category, it will automatically
    be available to your site visitors.


    # ## Adding social profiling features


    Social networking is the big thing. It’s all about networking and groups, the
    integration of information from different sources, and opportunity for cross-publicizing
    it.


    This section will help you add a few of the most popular social networking features
    into Joomla!.


    # ### Easy Twitter Status


    Easy Twitter Status is one of the easiest (and non-commercial) twitter message
    extensions available. It contains the following features:


    +   - Twitter username

    +   - Tweet display limit

    +   - Which timeline to show

    +   - Show avatar

    +   - Avatar size

    +   - Enable default style or use your own customized style

    +   - Show follow link


    > In order to use this extension, you will require a Twitter account at <http://www.twitter.com>.


    The rest is easy, let’s add it now:


    +   1. Search the Joomla! Extensions area for “Easy Twitter Status” at <http://extensions.joomla.org>.

    +   2. Visit the extension developer’s website and download the extension to your
    computer.'
  merge: -1
  img_proc: true
- pgno: 334
  md: '+   3. Upload the extensions to Joomla! using the **Extension | Install / Uninstall**
    feature.

    +   4. Navigate to the **Extensions | Module Manager** area and click on the **Twitter**
    module to edit it.


    You will see the module preferences available. As with all modules, you can hover
    over the parameter title to obtain a tooltip description that will help explain
    the fields.


    ![](img/0151410972a5c5ea0aab26416e44b1da_334_0.png)


    In my demonstration, I have also made a change to the module title, published
    it on the left column, and under the Menu Assignment area we want to make this
    module available on just the **Home** menu link:'
  merge: -1
  img_proc: true
- pgno: 335
  md: '![](img/0151410972a5c5ea0aab26416e44b1da_335_0.png)


    Now that we have published the module on the left-hand side, it could make our
    left column quite long as compared to the other content published on the front
    page. Let''s go into our "RokBox" and "QTube" modules and only make them assigned
    to the menu links related to our video examples:


    ![](img/0151410972a5c5ea0aab26416e44b1da_335_1.png)


    The Easy Twitter module should now only show on our Home Page menu item and pull
    in our latest Twitter messages. Styling for this can be adjusted with CSS, and
    may also be affected by the current styling within your `template.css` file:


    ![](img/0151410972a5c5ea0aab26416e44b1da_335_2.png)'
  merge: -1
  img_proc: true
- pgno: 336
  md: '# # Twitter Follow Me


    The Twitter Follow Me module displays a choice of simple eye-catching graphics
    displayed within your Joomla! page and links to your Twitter account. Users who
    wish to follow your Twitters can easily reach them by clicking on the provided
    link.


    Follow these steps to install this module:


    +   1. Search the Joomla! Extensions area for "Follow Me" at `http://extensions.joomla.org`.

    +   2. Visit the extension developer''s website and download the extension to
    your computer.

    +   3. Upload the extensions to Joomla! using the **Extension | Install / Uninstall**
    feature.

    +   4. Navigate to the **Extensions | Module Manager** area and click on the **Follow
    Me** module to edit it.


    The module contains a number of self explanatory parameters. I have selected the
    following:


    ![](img/0151410972a5c5ea0aab26416e44b1da_336_0.png)'
  merge: -1
  img_proc: true
- pgno: 337
  md: 'For this module to sit well within our current template, I have selected to
    display it in the bottom-left of the site page, and have adjusted the module''s
    title so it is not displayed. This Twitter Follow Me module can actually be placed
    within any available module position as it utilizes another display method compared
    to usual modules. Here is a screenshot of how it looks in my project:


    ![](img/0151410972a5c5ea0aab26416e44b1da_337_0.png)


    For those who want to provide an easy link to their Twitter accounts, this is
    a five minute eye-catching solution.


    There are many other extensions that enable you to communicate with external social
    networking resources such as Facebook, MySpace, Flickr, and so forth. I suggest
    playing with a few to see if they provide the functionality you require for your
    projects.


    # ## Adding RSS features


    With RSS being the perfect medium to display and provide site information, it
    is important to offer some RSS feeds from our site project.


    There are a number of RSS extensions available to display Joomla! RSS feeds.'
  merge: -1
  img_proc: true
- pgno: 338
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 339
  md: 'Click on **Apply** to save your new menu item and view the frontend of the
    site. A new Main Menu option should now be available and when clicked upon, it
    should take you to a blog layout of your articles:


    ![](img/0151410972a5c5ea0aab26416e44b1da_339_0.png)


    If you look in your browser URL address bar, you should now see that an RSS feed
    has been recognized on this page and an icon displaying it is shown:


    ![](img/0151410972a5c5ea0aab26416e44b1da_339_1.png)'
  merge: -1
  img_proc: true
- pgno: 340
  md: 'When clicked on, this will offer the user the ability to subscribe to two feed
    types. The respective RSS feeds will show, allowing the user to subscribe to them:


    ![](img/0151410972a5c5ea0aab26416e44b1da_340_0.png)


    If you like you can take this feed URL, and create either text hyperlinks around
    your site to promote it, make a nice icon to publish on your site pages, or use
    an extension module to recognize feeds created from your site and automatically
    show a nice feed icon when it finds them. Either way, when we add new articles
    into this section and category, our new content will be displayed on our RSS feed
    and anyone subscribed will be able to easily view your new website content.


    RSS feeds can only be generated on the front page layout, to a section, or to
    a category. They can include video, audio, images, and other multimedia content
    and provide this directly to your subscribers, rather than them having to come
    to your site to obtain it.


    # Adding map features


    There are a number of great mapping features for Joomla!, most of them utilizing
    the Google Maps application which has become one of the most powerful mapping
    tools available on the Web.


    # Googlemaps Plugin


    Googlemaps Plugin for Joomla! displays one or more Google Maps within your articles.
    It is a perfect method for dropping mapping features easily into your site.'
  merge: -1
  img_proc: true
- pgno: 341
  md: 'Although, perhaps not considered as traditional multimedia, maps contain a
    range of text, images, and scripting features, as well as provide an enhanced
    interactive feature to your site visitors. Let''s drop one into our project:


    +   1. Search the Joomla! Extensions area for "Google map" at http://extensions.joomla.org.

    +   2. Visit the extension developer''s website and download the extension to
    your computer. (For Joomla! 1.5 make sure you take a version with that listed
    in the filename.)

    +   3. Upload the extensions to Joomla! using the Extension | Install / Uninstall
    feature.

    +   4. Navigate to the Extensions | Plugin Manager area and click on the Google
    Maps plugin to edit it.


    There are lots of Plugin Parameters to configure, and you will probably re-visit
    these to tweak them as you need to:


    ![](img/0151410972a5c5ea0aab26416e44b1da_341_0.png)'
  merge: -1
  img_proc: true
- pgno: 342
  md: 'For now, enable the plugin and click on **Save**. Navigate to **Content | Article
    Manager** and create a new article.


    Name your article "Google Map", and select the Section "Site" and Category "General".
    Within your article, we need to place the plugin code. The code works as follows:
    Usage: {mosmap parameter=''value''|parameter=''value''|...}. For example:


    ```

    {mosmap width=''500''|height=''400''|lat=''-36.843288''|lon=''174.770508''}

    ```


    There are many available parameters that you can add to this code, and the Googlemaps
    Plugin really is powerful. To use them, make sure you put a pipe symbol (|) in
    between the parameters and make sure there are no breaks within your plugin code.
    Here are some of the available parameters:


    | Parameters | Description |

    |---|---|

    | width | Adjust to whatever you want, although if it''s too small, you won''t
    see very much. |

    | height | You must put the units behind the number such as 100% or 400px. |

    | lon, lat | For the coordinates or address to search for the coordinates (use
    the standard of your country). |

    | zoom | Can be anything, as specified in the Google Maps API. |

    | zoomType | Can be small or large. This controls the type of zoom function displayed.
    It can also be none, so there is no zoom control. |

    | zoomNew | Can be 1 for continues zoom, and double-click and zoom, or 0 for click
    to center (default 0). |

    | zoomWheel | Can be 1 for mouse wheel zoom and 0 for no mouse wheel zoom (default
    0). |

    | mapType | Can be Normal (default), Satellite, or Hybrid. |

    | showMaptype | 0 for no Maptype controls and 1 shows Maptype controls (default
    1). |

    | Overview | 0 for no overview window in bottom-right corner, 1 shows the overview,
    and 2 for overview enabled but closed initially (default 0). |

    | text | Is for the marker that will show on the map in a balloon/information
    window. If you don''t want to see the text, just set text=" ", and it will not
    display. The text is the data displayed above the location pin. Usually it would
    be used to display an address or hyperlink. A hyperlink uses the format: < a href=linkAddress
    target=linkTarget title=linkTitle>linkName</a>. Don''t use (double) quotes. |

    | marker | Is for opening the information window (1 default) or closing the information
    window (0) initially. |

    | dir | For adding get directions form for a route at maps.google.com to the coordinates.
    |'
  merge: -1
  img_proc: true
- pgno: 343
  md: '| Parameters | Description |

    |---|---|

    | `tooltip` | Is for the marker to have a tooltip when the mouse is on the marker
    (don''t use HTML). |

    | `address` | Is for an address to search for the coordinates. |

    | `gotoaddr` | For a search field and button so the user can search an address
    on the map (default 0). |

    | `kml` | For a URL to a kml file to load as an overlay on the map for multiple
    markers or a route. |

    | `align` | Is for placement of the map in the content (left, right, center, or
    none). |


    Drop some code into your article and save it. Then create a new menu item to the
    map''s article. I have simply called it "Maps" and made it a top-level menu item.
    Your Google Map should now show within your Joomla! Article.


    ![](img/0151410972a5c5ea0aab26416e44b1da_343_0.png)


    There are a number of Google Map modules also available, that offer the ability
    to easily place Google Maps within module positions. These are located at `http://extensions.joomla.org`.'
  merge: -1
  img_proc: true
- pgno: 344
  md: '# # Creating a custom error page


    A nice personal feature for any web project is to create your own custom error
    pages. Joomla! uses the `/templates/system/error.php` file to handle several HTTP
    status errors, including "403 Forbidden", "404 Not Found", and "500 Internal Server"
    errors. These different status codes are information delivered by the server to
    the client, for different reasons.


    Personalizing your error pages can help the user with further information, and
    really show that you have taken the time to consider them, when things on the
    site may not function correctly. Your custom error pages may contain multimedia
    items, as they are simply HTML web pages.


    There are a number of ways to create a custom error page for Joomla! The one I
    am going to use requires you to get your hands dirty with some code, but it is
    quite easy to perform.


    # ## Override system error page


    To override the system error results, copy the `/templates/system/error.php` file
    into your own `/templates/<active template>` directory. In our case, this will
    be: `/templates/ja_purity/error.php`.


    If it finds one, Joomla! will use the `error.php` file that it finds in the active
    template, in place of the system file. This is a nice approach, as you can upgrade
    Joomla! but your custom `error.php` file will always stay within your template
    directory, which should not be affected during an upgrade. This `error.php` file
    can then be formatted as desired, usually to match your template.


    # ## Override system error page styling


    If you want to change the styling of this page, we also need to copy over the
    following file: `/templates/system/css/error.css` and place this copy into your
    `/templates/<active template>/css/error.css` file. In our case this will be: `/templates/ja_purity/css/error.css`


    Next, update the `/templates/ja_purity/error.php` file to reference the new location
    of our stylesheet by changing this line: `<link rel="stylesheet" href="<?php echo
    $this->baseurl; ?>/templates/system/css/error.css" type="text/css" />`, which
    will now become: `<link rel="stylesheet" href="<?php echo $this->baseurl; ?>/templates/ja_purity/css/error.css"
    type="text/css" />` so that it points to our copied CSS file. You can now make
    adjustments to your CSS file as desired to style your error page results.'
  merge: -1
  img_proc: true
- pgno: 345
  md: 'We have now taken duplicates of the two files concerned. Joomla! will look
    for these files in our template, before using the default ones in the system template.
    By adjusting our `error.php` page and `error.css` file, we can completely customize
    the way in which our error page is displayed. Unfortunately, it is not possible
    to go into the details of creating a new page, but by viewing both of the default
    files, you should be able to make the changes you require, even if it is a logo
    change or background color change on the page.


    A few things that good **404 Page not found** error pages should contain are:


    +   - A link to the website site map.

    +   - A link to the website home page.

    +   - Relevant links to popular pages.

    +   - A search feature. (Google offers a facility through its WebMaster Toolkit
    to drop in some easy search code.)


    Use images, text, and styling, as well as some of the mentioned features, but
    keep it as usable and simple as possible. 404 pages tell the user that the page
    they were looking for cannot be found. By offering the previous information, you
    can help your site visitors get to somewhere else easily. The last thing you want
    is a full page of site navigation, images, and other content to distract the user
    from getting to the information they required.


    ![](img/0151410972a5c5ea0aab26416e44b1da_345_0.png)'
  merge: -1
  img_proc: true
- pgno: 346
  md: '# # Changing the site favicon


    The word "favicon" is short for "Favorites Icon". It is a 16 x 16 pixel icon that
    is associated with your website, and appears on the web browser''s address bar
    and bookmark''s favorites menu. In Firefox and Internet Explorer 7 / 8, it also
    appears on the browser tab.


    Joomla! comes shipped with its own site favicon file. Unless you know how to change
    it, most people just leave that as default. The favicon, however, is actually
    quite easy to adjust and is a small feature that can help personalize your project
    and give it a professional touch.


    ![](img/0151410972a5c5ea0aab26416e44b1da_346_0.png)


    # ## Create the image


    In most situations, you will probably want to use your organization logo, or some
    part of this to be displayed as the favicon. You will need access to a graphic
    editor in order to create this image so that it fits within a 16 x 16 pixel square.
    It is best to save this as either a PNG or GIF file format.


    # ## Convert the image to an ICO format


    The next step is to convert your PNG or GIF image into another file format. There
    are a number of ways to do this, but the easiest tool that I have found is an
    `.ico` file generator located at `http://tools.dynamicdrive.com/favicon/`.


    ![](img/0151410972a5c5ea0aab26416e44b1da_346_1.png)


    Simply upload your graphic and click on **Create Icon**. Then save the new file
    on your computer.'
  merge: -1
  img_proc: true
- pgno: 347
  md: '# Replace the existing favicon


    The favicon is located within your active Joomla! Template directory. This is
    actually applicable for both the frontend and administration displays, hence you
    can create a different favicon for each if you wanted to. As we have assigned
    the JA_Purity template to our project, we need to look within our Joomla! file
    structure and replace the favicon.ico file, within the ja_purity template, with
    our new favicon file. Make sure your new file is named favicon.ico else it won''t
    be recognized — /templates/ja_purity/favicon.ico.


    ![](img/0151410972a5c5ea0aab26416e44b1da_347_0.png)


    # Viewing the new favicon


    If you have followed the previous procedure, created the graphic and the favicon.ico
    file, placed the file into your active template directory, then all should be
    good to go. If you cannot view your new favicon, then chances are the web browser
    has cached the original favicon file.


    For most browsers, it will be best to navigate away from the Joomla! page (say
    open google.com or another web page), clean out your browser cache, restart your
    web browser, and re-open your Joomla! project. This method should ensure your
    browser loads in the new favicon.ico file.


    ![](img/0151410972a5c5ea0aab26416e44b1da_347_1.png)


    # And the rest...


    As you have seen throughout the course of this book, and on the ever growing Joomla.org
    website, there is a wealth of extension features that can be used to enhance the
    Joomla! Content Management System. These provide a diverse range of added functionality
    with most being easy to install and user friendly. They offer "out-of-the-box"
    features for little-to-no expense, compared to a developer''s time to create these
    for your project.'
  merge: -1
  img_proc: true
- pgno: 348
  md: 'We could keep going with this site and throw a multitude of extensions at it,
    building a feature packed multimedia site. One important point to mention is that
    every extension available for Joomla! has been written by a different developer,
    with varied skill levels and purposes for making it available. It is good practice
    to remove any extensions that you are not using on a live site, and to assess
    the code of extensions when possible, rather than just adding them into a live
    project and assuming all is hunky dory.


    # Accessibility and validation


    If you have developed your project locally, and are ready to put this on a live
    server, then there are a number of steps worth considering before making it live.


    # Accessibility


    We have covered this topic a number of times throughout the chapters of this book.
    It is a very important subject and one that often gets overlooked.


    There are numerous levels of accessibility and the subject can be taken to extremes,
    where sometimes a website is so dull and unusable because people have tried to
    make it as accessible as possible. The opposite can also be said, but this usually
    requires a lot of time and consideration to make the site glossy and rich, while
    considering many user abilities. The most important consideration is that if we
    are offering valuable information to our visitors, we make alternative content
    available in some way.


    An example of this in our project could be the Google Maps page. For a number
    of reasons, some users may not be able to view that great looking Google Map.
    So, let''s make the contact details listed under the map, or a text description
    of why the map is on the page.


    Always try to get a range of users to view your site and provide their feedback.
    With the nature of the fast paced Web now, it is easier for your site visitors
    to close your web page if they have an issue with it, rather than take the time
    to write a notification to tell you about it. Quite often, there can be fairly
    major issues relating to a site that the developer may not be aware of until someone
    finally tips them off.


    Testing in a range of web browsers is a very important step, and relying on honest
    feedback from friends, family, and colleagues can be helpful when developing a
    project. I have seen beautiful sites in Firefox, only to find out they don''t
    work, or look poor in Internet Explorer, and it is better for you to find this
    out from your own quality control processes, rather than your client (or site
    visitors) pointing it out.'
  merge: -1
  img_proc: true
- pgno: 349
  md: 'Here are some general considerations to take into account when checking through
    your final web project:


    +   - Does the site have valid HTML?

    +   - Does the site have valid CSS?

    +   - Does the site have clear navigational mechanisms?

    +   - Does it provide clear alternatives to auditory and visual content?

    +   - Does it perform in terms of page-load speeds?

    +   - Does the site have broken links?

    +   - Do aspects of the layout break if the font size is increased in the user''s
    browser?

    +   - Are there sufficient color contrasts?

    +   - Are all hyperlinks descriptive?

    +   - Does the site work in IE 6-8, Mozilla Firefox, Safari, Opera, Chrome?

    +   - Is the site accessible with CSS switched off?

    +   - Does the site work in hand-held browsers?

    +   - Does the site include detailed metadata?

    +   - Does the site work well in a range of browser sizes?

    +   - Does the site have a useful 404 error page?

    +   - Do your URLs work without the WWW?

    +   - Does the site have a favicon?


    # Online validators


    One way to help make your site more accessible is to make sure it validates to
    at least a baseline of requirements. There are a number of web-browser based,
    and online, validation tools available to help with the validation process.'
  merge: -1
  img_proc: true
- pgno: 350
  md: 'If I run a local validation on the JMultimedia project home page, I receive
    50 errors and 33 warnings on that page. Now that leaves some work to do if I am
    trying to get this site to validate before it goes live. These errors can all
    add to making the site unusable under various circumstances, so it is important
    that I try to reduce the main errors.


    ![](img/0151410972a5c5ea0aab26416e44b1da_350_0.png)


    Having taken a quick assessment of these validation errors, it seems that there
    are one or two extensions that have been used which are causing a majority of
    these errors. Our options now are to:


    +   - Try to fix what is causing the errors.

    +   - Uninstall the extension and look for another solution.

    +   - Disregard these and go make a cup of tea (I do not recommend this one, although
    there is nothing wrong with a cuppa).


    A great way to start with solving validation errors is to make sure your template
    validates. You can check this by creating a new Joomla! Article with a simple
    `<p></p>` tag within it, save it, and create a menu link to it. Visit that page
    in the frontend. Next, make sure no modules are loaded onto that page and then
    try to validate it using a browser validation tool, such as the "Web Developer
    Toolbar" for Mozilla Firefox, or an online validation site, such as `http://validator.w3.org`.'
  merge: -1
  img_proc: true
- pgno: 351
  md: 'The results will highlight the basics of the template structure and whether
    there are any issues with the way it has been structured. From here, you can start
    to introduce page elements and find the culprits easily, or check the validation
    tool results to find out exactly where the issues are.


    # Wrapping up


    If you have developed your project locally, then the next steps will be to move
    it to a remote web server. This is usually performed via FTP or shell commands.
    There are some good articles on the Joomla! help site regarding this procedure.


    In true Joomla! fashion, there are even a number of extensions to help with this
    process, one worth mentioning is JoomlaPack. JoomlaPack is a site backup utility
    enabling you to take a copy of your website and database, and reinstall this on
    any capable Joomla! server.


    JoomlaPack not only allows you to move your site from a local development environment
    to a remote server, but it also provides you with an easy site backup feature
    to use whenever required. You can find JoomlaPack by searching for JoomlaPack
    at http://extensions.joomla.org.


    I wish you good luck with your web projects.


    # Summary


    This chapter used a cookbook-style approach to take a working copy of Joomla!
    and enhance the framework so it includes a range of multimedia features.


    We highlighted setting up a local development environment to create a safe and
    easily-usable development area, where we can assess extensions, and develop our
    project.


    A range of extensions were installed and Joomla! features configured within our
    working copy, highlighting how easily Joomla! can be extended to a media-rich
    working website.


    Finally, we wrapped up with some accessibility testing and highlighted the moving
    of our site to its final residence.'
  merge: -1
  img_proc: true
- pgno: 352
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 353
  md: '# A

    Extension Types and How to Install Them


    In order to take advantage of the full range of features that Joomla! can offer,
    you will at some stage need to install extensions to your Joomla! package. Installing
    extensions for Joomla! is an easy task, thanks to the design of extensions, and
    the Extension Manager tool that is included in Joomla!:


    ![](img/0151410972a5c5ea0aab26416e44b1da_353_0.png)


    > Please make sure that you take a backup of your files and database before installing
    any third-party extensions into your Joomla! site.'
  merge: -1
  img_proc: true
- pgno: 354
  md: '# Extension types


    The term **Extension** is a generic term used to describe five main categories
    of "extendable elements" for your Joomla! site. These are:


    # Plugins


    **Plugins** are powerful extensions that add additional functionality to your
    website. Plugins can work on different levels, for example, the content, the search,
    or system-wide levels:


    ![](img/0151410972a5c5ea0aab26416e44b1da_354_0.png)


    An example of a plugin may be to add an easy tag into your Content Article which
    will embed a movie easily with no extensive HTML code, or to enhance the Joomla!
    search system to also search an included extension.


    You can manage your plugins from the **Extension Manager | Plugin Manager** menu
    link.


    # Components


    A **Component** can add completely new features to your Joomla! website and they
    can often be classed as mini-applications in themselves:'
  merge: -1
  img_proc: true
- pgno: 355
  md: '![](img/0151410972a5c5ea0aab26416e44b1da_355_0.png)


    Components add great features such as "shopping carts" and "directory listings"
    to your site, and once installed they can be located under the Components menu.
    Components usually have various elements to them and contain additional sub-menu
    links to configuration and management screens.


    # Modules


    Modules are extensions that help to deliver information on a page to the end user:


    ![](img/0151410972a5c5ea0aab26416e44b1da_355_1.png)


    They can display information from simple HTML output to complex information delivered
    by the system, and they show this on your site pages. Modules are often associated
    with components as they provide information to the web page. An example of a module
    could be a simple weather report, a poll question, or a listing of events that
    is generated by an Events component.


    Modules are managed in the Extensions | Module Manager area.'
  merge: -1
  img_proc: true
- pgno: 356
  md: '# Templates


    A Joomla! Template influences the entire design and structure of your web pages:


    ![](img/0151410972a5c5ea0aab26416e44b1da_356_0.png)


    You can easily create a completely different style for your database-driven website
    by using a Joomla! Template. Templates contain module positions which help to
    organize and provide structure to your published modules.


    Templates often contain numerous parameters for adjustments, and these are available
    as template options within the Template Manager in the Joomla! Administration.


    # Languages


    Languages are a core feature of Joomla! and the packages of these translate the
    entire Joomla! interface including the frontend and administration of your Joomla!
    site:


    ![](img/0151410972a5c5ea0aab26416e44b1da_356_1.png)


    Languages are managed in the Extensions | Language Manager area.'
  merge: -1
  img_proc: true
- pgno: 357
  md: '# How to install


    One of the easiest ways to install extensions is to download the extension and
    have a copy located on your computer. Besides retaining a copy of the original
    extension files, extensions have been written so they can be easily installed
    with the Extension Manager doing all of the work:


    ![](img/0151410972a5c5ea0aab26416e44b1da_357_0.png)


    Log into your Joomla! Administration and navigate to the **Extension Manager**
    menu item.


    In the **Upload Package File** section, click on the **Choose File** button to
    navigate your local computer in order to find the extension that you want to upload.
    Once selected, click on the **Upload File & Install** button:


    ![](img/0151410972a5c5ea0aab26416e44b1da_357_1.png)


    You should receive an **Upload Success** message on the site. Your extension may
    require you to go and configure some parameters, or publish plugins and modules
    that were installed as part of the extension package.


    # How to uninstall


    Extensions for Joomla! 1.5 can be uninstalled easily by clicking on the **Manage**
    menu item on the Extension Manager page.


    Place a tick in the checkbox next to the extension you wish to uninstall, and
    click on the **Uninstall** icon located at the top-right of the page.


    ![](img/0151410972a5c5ea0aab26416e44b1da_357_2.png)


    Your extension will be uninstalled with a message confirming this on the screen.'
  merge: -1
  img_proc: true
