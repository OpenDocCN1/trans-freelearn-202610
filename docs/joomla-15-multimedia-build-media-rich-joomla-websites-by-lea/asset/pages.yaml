- pgno: 241
  md: '# 8

    Joomla! Templates

    and Multimedia


    Joomla! Templates are the distinguishing factor between one Joomla! website looking
    just like the next. They contain the structural elements to display your Joomla!
    content, and deliver style and scripting information to the user''s web browser.


    As Joomla! Templates provide style information for your website, they naturally
    have an impact on the multimedia elements within your Joomla! site. Besides your
    site design and module formatting (often using images), templates may contain
    advanced JavaScript features that can enhance your site''s multimedia capabilities.


    This chapter is an overview of Joomla! Templates, how they work and how they can
    affect the display of multimedia content in your Joomla! site. Learn how templates
    can enhance multimedia capabilities as well as how they affect the way in which
    your Joomla! site is displayed on mobile web devices. It contains:


    +   - What is a Joomla! Template?

    +   - Template components

    +   - Scripting and multimedia

    +   - The mobile web

    +   - Making your site mobile friendly

    +   - Accessibility'
  merge: -1
  img_proc: true
- pgno: 242
  md: '# What is a Joomla! Template?


    Joomla! uses a template system to control the look, feel, and layout of your web
    content.


    Joomla! has been designed so that the key processes for delivering your website
    have been separated out within its design, making Joomla! as efficient as possible
    and easily maintained as a piece of software:


    ![](img/0151410972a5c5ea0aab26416e44b1da_242_0.png)


    One of these elements is the Joomla! Template, which controls the overall layout,
    and distinguishes one Joomla! install from the next. Templates provide the structure
    to place various content elements (including components, plugins, and modules)
    on any given page in almost any part of the web page you choose. One of the most
    important factors for the success of your Joomla! website will be the information
    that you want to deliver to your audience, and how the template has been designed
    to achieve this. This is where a template design can make or break your Joomla!
    website:


    ![](img/0151410972a5c5ea0aab26416e44b1da_242_1.png)'
  merge: -1
  img_proc: true
- pgno: 243
  md: 'When producing a website, the location of a number of elements will often remain
    constant. For example, menus, search boxes, banners, copyright, sidebars all typically
    stay in fixed positions on the page. Important styling information will be contained
    within your stylesheets (which control the fonts, colors, and placement of information)
    and this needs to be included, so it is also presented on every page.


    This is why templates have been developed, and Joomla! is a perfect example of
    how they can be utilized effectively. You can either re-create all of the mentioned
    features on every web page you build for your site, or use a template structure
    to contain and deliver this information to every page. We as administrators simply
    "fill in the blanks" with our site content.


    # Template components


    Joomla! utilizes templates for both the frontend views, and administration sections
    of the site.


    The administration has one template (named Khepri) that comes installed as default
    and creates the style for your administration:


    ![](img/0151410972a5c5ea0aab26416e44b1da_243_0.png)


    Joomla! Administration Templates are located within the /administrator/templates
    directory. If you are looking to adjust your site administration template, take
    a copy of the default Khepri template and re-name the template folder with your
    new name. Make sure you re-name the XML references and then you can begin to customize
    your administration theme. There are third-party administrator templates also
    available, which can provide a completely new look for your Joomla! administration.'
  merge: -1
  img_proc: true
- pgno: 244
  md: 'Templates for the frontend are contained within the /templates directory of
    Joomla!:


    ![](img/0151410972a5c5ea0aab26416e44b1da_244_0.png)


    Your Joomla! Template contains a set of files and directories to sub categorize
    the contents. A typical Joomla! 1.5 Template structure will usually contain the
    following:


    +   - `index.php`: This is a key file usually containing HTML and PHP logic for
    the display and positioning of modules and components.

    +   - `component.php`: Provides the logic for the display of additional pages
    such as "E-mail this link to a friend", and the Printer Friendly page.

    +   - `css/template.css`: The template CSS file is usually located within a CSS
    folder and handles the presentational aspects of the template, including specifications
    for fonts, headings, margins, image borders, list formatting, among others.

    +   - `templateDetails.xml`: The `templateDetails.xml` is another key file which
    holds meta-information related to the template, and is used by the Joomla! Installer
    and the Template Manager. This file also contains a reference of module positions
    that the template utilizes.'
  merge: -1
  img_proc: true
- pgno: 245
  md: '+   - `template_thumbnail.png`: This image file could be a JPG, GIF, or PNG
    file. Generally, it''s a 200 x 150 pixel image that is shown when the cursor is
    hovered over the template name in the Template Manager. This gives the administrator
    a snapshot view of the template before applying it to the site.


    A typical Joomla! 1.5 Template will also contain the following directories:


    +   - `css`: The CSS folder contains all the CSS files for the template.

    +   - `html`: This folder usually contains the template override files for core
    output.

    +   - `images`: The images folder contains all images that are used by the template.
    In popular commercial templates, it is not uncommon to have multiple subdirectories
    within the images folder, each containing their own color variations of the images.


    ![](img/0151410972a5c5ea0aab26416e44b1da_245_0.png)


    Template folders for Joomla! usually contain all relevant files which relate directly
    to the template in use on the website. Therefore, images and other multimedia
    content that you use within your Joomla! Articles should reside within their own
    folders, and not be placed within the template folder.'
  merge: -1
  img_proc: true
- pgno: 246
  md: '# Scripting and multimedia


    When the majority of users hear the term "Multimedia", it may conjure initial
    thoughts of "Images" and "Video" content. The term is used to describe these prominent
    media elements; however, in this quickly evolving world of the Web, new features
    and interactive elements are presenting themselves regularly.


    A number of commercial template providers are now creating feature packed template
    systems for Joomla! that not only contain the basic template elements, but also
    include numerous scripts, making the package more feature packed and versatile
    for users.


    These features include sophisticated JavaScript drop-down menu systems, user-defined
    module ordering, mobile web themes, extensive typography options, and many more.
    While some of these features may not be considered as traditional forms of "Multimedia",
    they usually contain text, images, fonts, colors, and provide an interactive experience
    to the site user.


    ![](img/0151410972a5c5ea0aab26416e44b1da_246_0.png)


    The previous screenshot shows the Solar Sentinel template from RocketTheme at
    http://www.rockettheme.com.'
  merge: -1
  img_proc: true
- pgno: 247
  md: '# ## Mellow template—Yootheme


    Mellow is a feature packed but simple and well organized template from YooTheme:


    ![](img/0151410972a5c5ea0aab26416e44b1da_247_0.png)


    `www.yootheme.com` contains an abundance of scripting features, including the
    following:


    +   * A powerful, flexible menu system: This includes numerous submenu options
    with icons, among others:


    ![](img/0151410972a5c5ea0aab26416e44b1da_247_1.png)'
  merge: -1
  img_proc: true
- pgno: 248
