    # Learning Joomla! 1.5 Extension Development


    ISBN: 978-1-847191-30-4      Paperback: 200 pages


    A practical tutorial for creating your first Joomla! 1.5 extensions with PHP


    +   1. Program your own extensions to Joomla!

    +   2. Create new, self-contained components with both back-end and front-end
    functionality

    +   3. Create configurable site modules to show information on every page

