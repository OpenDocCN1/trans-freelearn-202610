- pgno: 223
  md: 'To download this extension, visit http://extensions.joomla.org/ and search
    for "LCPlayer".


    # Joomla! and photo integration


    Joomla! works well with images and the opportunities for displaying photos and
    galleries from external resources is vast. Here are some of the more popular extensions
    used for this purpose.


    > A number of image extensions for Joomla! also offer the ability to display content
    from external resources.


    # UniversalPlayground - Flickr slideshow plug-in (P)


    The UniversalPlayground - Flickr slideshow plug-in displays slideshows from your
    Flickr account with a simple lightbox effect:


    ![](img/0151410972a5c5ea0aab26416e44b1da_223_0.png)


    This extension uses the phpFlickr library, Slimbox (a lightweight visual lightbox
    clone), and the TripTracker slideshow scripts.


    A single photo, or complete gallery sets, can be displayed by entering a simple
    expression into your articles, for example: `[flickr photo=xxx]` (where xxx is
    replaced by the photo ID number).'
  merge: -1
  img_proc: true
- pgno: 224
  md: 'The plugin contains numerous parameters for customization:


    ![](img/0151410972a5c5ea0aab26416e44b1da_224_0.png)


    > A Flickr API key is required to enter into your plugin, and a link to this is
    available from the module and developer''s website.


    To download this extension, visit http://extensions.joomla.org/ and search for
    "UniversalPlayground - Flickr slideshow".


    # Flickr + Highslide (M)


    The Flickr + Highslide module extension displays photos from Flickr within your
    Joomla! site using the Highslide JavaScript effect:'
  merge: -1
  img_proc: true
- pgno: 225
  md: '![](img/0151410972a5c5ea0aab26416e44b1da_225_0.png)


    Highslide is an open source media and gallery viewer written in JavaScript. The
    module displays an elegant looking display of Flickr content and contains the
    following features:


    +   - 13 unique ways of displaying your photos

    +   - Eight different gallery styles

    +   - Displays photos from a photoset

    +   - Displays all photos of a user

    +   - Displays photos in latest or random order

    +   - Ability to change the size of images and thumbnails

    +   - Ability to separate photos into pages

    +   - Displays the titles of photos


    The module will require your Flickr account ID. It also offers numerous styling
    parameters:


    ![](img/0151410972a5c5ea0aab26416e44b1da_225_1.png)


    To download this extension, visit http://extensions.joomla.org/ and search for
    "Flickr Highslide".'
  merge: -1
  img_proc: true
- pgno: 226
  md: '# Joomla! and weather integration


    For busy news and community portals, offering a weather forecast is a popular
    requirement. Google Weather is a popular resource for the source of weather information
    for these extensions, and this is due to the global solution it provides. There
    are numerous other weather extensions also; here are some popular ones.


    # Google Weather - Plugin (P, M)


    The Google Weather - Plugin is a lightweight plugin that uses the Google Weather
    Forecast API to display the current weather in your Joomla! Articles:


    ![](img/0151410972a5c5ea0aab26416e44b1da_226_0.png)


    By using simple plugin tags to trigger the plugin, it is possible to include {WEATHER
    CITY, COUNTRY} into your content and the plugin will do the rest!


    The plugin is installed via the Extension Manager and then configured using the
    Plugin Manager. Numerous styling options are available and the plugin can be configured
    using custom CSS. You can display the weather as often as you like using the plugin
    tags throughout your articles.'
  merge: -1
  img_proc: true
- pgno: 227
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 228
  md: '# Collaborating with External Sources


    The component, module, and plugin are installed via the Extension Manager and
    then configured using the applicable managers. Each element provides its own set
    of parameters and configuration options in order to display the weather as you
    would like:


    ![](img/0151410972a5c5ea0aab26416e44b1da_228_0.png)


    To download this extension, visit `http://extensions.joomla.org/` and search for
    "Z Weather".


    # eWeather (C,M)


    eWeather is a component (with an additional module) which will show a visually
    appealing display of current conditions and weather forecast in your Joomla! pages.
    The weather data is supplied by The Weather Channel via an XML feed:'
  merge: -1
  img_proc: true
- pgno: 229
  md: '![](img/0151410972a5c5ea0aab26416e44b1da_229_0.png)


    One nice feature of the component is to allow your site visitors to select their
    own city and the ability to see a five-day forecast. There is, however, some "Weather
    Channel" advertising throughout the display of information.


    eWeather is a powerful component allowing configurations within the component
    configuration settings. These include:


    +   - New overview and management of installed regions/countries

    +   - Default configuration of a city

    +   - Weather forecast for up to five days

    +   - Date/time format freely definable

    +   - Proxy definable


    New icon styling packs are now available to customize the look of your site. An
    accompanying module is also available to display the weather in any module position:


    ![](img/0151410972a5c5ea0aab26416e44b1da_229_1.png)'
  merge: -1
  img_proc: true
- pgno: 230
  md: 'To download this extension, visit http://extensions.joomla.org/ and search
    for "eWeather".


    # Joomla! and news channel integration


    There are a number of good news channel extensions available to pull external
    news in and display this on your site pages. Using RSS techniques, it is possible
    to manually perform this process, but the following extensions make things nice
    and easy.


    # Google News (M)


    The Google News Module embeds Google News stories into any module position on
    your site. It allows your site visitors to see the headlines and previews of Google
    News, which you have selected to show:


    ![](img/0151410972a5c5ea0aab26416e44b1da_230_0.png)


    This module contains numerous parameters, including the ability to filter topics,
    adjust the size, country, and language that gets displayed. It is a simple module,
    but perfect for those wanting to easily display Google News in their Joomla! website.'
  merge: -1
  img_proc: true
- pgno: 231
  md: 'The Google News Module is installed via the Extension Manager with configurations
    being set in the module.


    ![](img/0151410972a5c5ea0aab26416e44b1da_231_0.png)


    To download this extension, visit `http://extensions.joomla.org/` and search for
    "Google News".


    # Other resources and how to integrate them with Joomla!


    There are hundreds of extensions that allow Joomla! to interact with external
    resources, here are examples of some of these.'
  merge: -1
  img_proc: true
- pgno: 232
  md: '# Plugin GoogleMaps (P)


    This extension is a plugin for displaying one or more Google Maps within articles,
    modules, or components for Joomla!


    ![](img/0151410972a5c5ea0aab26416e44b1da_232_0.png)


    As with a lot of plugins, the map is displayed by using a special tag containing
    numerous parameters. These offer the ability to really customize your map contents
    and the following is a small selection of this plugin''s features:


    +   - Adjustable width and height

    +   - Adjustable latitude and longitude

    +   - Zoom controls

    +   - Map markers

    +   - Add selections and tooltips to your map


    The GoogleMaps Plugin is installed via the Extension Manager with default configurations
    set in the plugin, with the ability to override with each instance of using the
    plugin trigger tag.'
  merge: -1
  img_proc: true
- pgno: 233
  md: 'A GoogleMaps reference key is required to use most Google Map services and
    is a requirement for this plugin to work.


    ![](img/0151410972a5c5ea0aab26416e44b1da_233_0.png)


    To download this extension, visit http://extensions.joomla.org/ and search for
    "Daylife News".


    # Ajax Whois (C,M)


    The Ajax Whois extension is an international domain search and "whois" extension
    for Joomla! that utilizes the power of Ajax technology in order to allow your
    Joomla! website visitors to check for availability of domain name(s). The results
    of these searches are displayed instantly on the site:


    ![](img/0151410972a5c5ea0aab26416e44b1da_233_1.png)'
  merge: -1
  img_proc: true
- pgno: 234
  md: 'The Ajax Whois component and module are installed via the Extension Manager
    with default configurations being set in the component. There are numerous display
    options available.


    To download this extension, visit http://extensions.joomla.org/ and search for
    "Ajax Whois".


    # SlideShare (P)


    SlideShare is a service that allows you to upload and share PowerPoint presentations,
    Word documents, and PDF documents using the SlideShare service. This simple module
    then allows you to display SlideShare content in your Joomla! website:


    ![](img/0151410972a5c5ea0aab26416e44b1da_234_0.png)


    A user account at SlideShare is required to use this service.


    The SlideShare Plugin is installed via the Extension Manager with default configurations
    being set using the Plugin Manager:


    ![](img/0151410972a5c5ea0aab26416e44b1da_234_1.png)


    To download this extension, visit http://extensions.joomla.org/ and search for
    "SlideShare Plugin".


    # Slick RSS (M)


    Slick RSS allows you to parse and display external RSS feeds on your Joomla! website
    with a nice tooltip teaser feature:'
  merge: -1
  img_proc: true
- pgno: 235
  md: '![](img/0151410972a5c5ea0aab26416e44b1da_235_0.png)


    Some features include:


    +   - Configure number of items

    +   - Display title and description

    +   - Enable/disable images

    +   - Limit word counts for title and descriptions


    The Slick RSS module is installed via the Extension Manager with configurations
    being set in the Module Manager:


    ![](img/0151410972a5c5ea0aab26416e44b1da_235_1.png)'
  merge: -1
  img_proc: true
- pgno: 236
  md: 'To download this extension, visit http://extensions.joomla.org/ and search
    for "Slick RSS".


    # RokBox Plugin (P)


    ![](img/0151410972a5c5ea0aab26416e44b1da_236_0.png)


    RokBox is a MooTools powered JavaScript slideshow that allows you to quickly and
    easily display multiple media formats including images, videos (video sharing
    services also), and music.


    RokBox provides a theme system that allows you to create your own custom ones
    to fit your websites design. It includes two predefined themes, a light theme
    and a dark theme that will fit seamlessly into your site design.


    RokBox is a nice all-in-one solution to present multimedia content off with professional
    effects. It can play external media sources such as YouTube videos as easily as
    it can play your own files.'
  merge: -1
  img_proc: true
- pgno: 237
  md: '![](img/0151410972a5c5ea0aab26416e44b1da_237_0.png)


    To download this extension, visit http://extensions.joomla.org/ and search for
    "RokBox".


    # Simple RSS Feed Reader (M)


    Adding RSS syndicated content inside your Joomla! website is now super-easy and
    simple with the "Simple RSS Feed Reader" module:


    ![](img/0151410972a5c5ea0aab26416e44b1da_237_1.png)


    To use, insert the feed (RSS) URLs of the websites you want to syndicate in the
    module''s settings, edit your module options, and then publish the module in your
    desired position. The module will display the latest feed contents in your module.


    Simple RSS Feed Reader is based on the very popular SimplePie PHP class, which
    makes it easy to integrate syndicated content into your Joomla! website. The module
    supports everything from RSS 0.91 and RSS 1.0 formats, to the ever-popular RSS
    2.0 format. It also supports the emerging Atom format, in both 0.3 and 1.0 flavors.'
  merge: -1
  img_proc: true
- pgno: 238
  md: 'The module has a very fast, very efficient caching system. By caching the processed
    data rather than just the raw XML, the module is able to create a feed parser
    that''s quick and should not cause excessive overhead on page loading.


    ![](img/0151410972a5c5ea0aab26416e44b1da_238_0.png)


    To download this extension, visit http://extensions.joomla.org/ and search for
    "Simple RSS Feed Reader".'
  merge: -1
  img_proc: true
- pgno: 239
  md: '# Summary


    For regular users of the Web, there are a few key tools and social networking
    sites that may contain your profile and data. Every month there are improved integrations
    between these sites and other online resources, including Joomla!. All this helps
    to minimize account logins and the repetition of data in different places.


    Web 2.0 is all about integrating yourself into the Web experience and sharing
    your information; being a part of the Web instead of just searching for material.
    Content from external resources can easily be embedded into Joomla! via the use
    of HTML code or custom extensions designed to collaborate with popular resources.


    Joomla! lends itself well to displaying external data into its framework, as it
    does to broadcast some of its own content to other sources. New extensions are
    being developed at an astounding rate that provide solutions for collaborating
    with popular external web resources. This will only increase with time, as the
    Joomla! developer community helps to define integrations for the "next big thing"
    on the Web... whatever it may be.'
  merge: -1
  img_proc: true
