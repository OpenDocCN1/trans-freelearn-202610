- pgno: 215
  md: 'The Fanbox lets users:


    +   - See how many users are already fans, and see some of their friends

    +   - Read recent posts from the page

    +   - Become a fan with one click, without needing to visit the page


    Before you add a Fanbox to your website, you need the following:


    +   - A Joomla! 1.5 website, and the ability to install modules

    +   - A Facebook page that promotes your website (you must be the administrator
    of the page)

    +   - Your Facebook page ID and profile ID to enter into the **Module Parameters**


    There are a number of parameter options for control over this extension, and it
    has received good feedback from users requiring this type of feature in their
    Joomla! site:


    ![](img/0151410972a5c5ea0aab26416e44b1da_215_0.png)


    To download this extension, visit `http://extensions.joomla.org/` and search for
    "Facebook Fanbox".'
  merge: -1
  img_proc: true
- pgno: 216
  md: '# jwFacebook Comments (P)


    The jwFacebook Comments plugin utilizes Facebook''s comments feature and allows
    you to place these at the end of your Joomla! Articles:


    ![](img/0151410972a5c5ea0aab26416e44b1da_216_0.png)


    If your site visitors have a Facebook account, they can easily place comments
    on your Joomla! Articles, but one nice feature of this system is that anyone can
    place comments (you don''t need a Facebook account). It utilizes Facebook''s comments
    feature instead of using your own, possibly saving you hosting bandwidth costs.


    Installation is easy, but there are few additional steps to perform in order to
    get this feature working. These are clearly listed on the developer''s website,
    but in short are:


    +   - Install the plugin using the Joomla! Extension Manager

    +   - Upload an included .htm file to your web server and then navigate to the
    Plugin Manager to configure the Plugin Parameters

    +   - Configure your Facebook API, the path to the uploaded .htm file

    +   - You will then need to log into Facebook to enter the domain of the site
    you are installing the comments on


    ![](img/0151410972a5c5ea0aab26416e44b1da_216_1.png)


    To download this extension, visit http://extensions.joomla.org/ and search for
    "jwFacebook Comments".'
  merge: -1
  img_proc: true
- pgno: 217
  md: '# Joomla! and video channel integration


    Video is the coolest thing on the Web at the moment, and there are some great
    Joomla! Video Extensions available to display content from external video distribution
    sites.


    > It is important to mention that there are a number of specific video solutions
    for Joomla! that also provide support for streaming external video content. Please
    see the extensions listed in Chapter 6, Using Video in Your Joomla! Website for
    further video solutions.


    # easiertube (P)


    easiertube is a Joomla! Plugin that couldn''t get any easier to manage and use.
    It is designed to display videos in your articles from the following sources:
    YouTube, Google, UStream, Revver, and MySpace.


    ![](img/0151410972a5c5ea0aab26416e44b1da_217_0.png)


    To use it, simply install this plugin and configure its settings in the Plugin
    Parameters area. Enter the remote video link within your content articles and
    the plugin will automatically convert the URL and embed the player in your page.
    Parameters can be set for:


    +   - Front page display width and height

    +   - Main content display width and height

    +   - Fullscreen

    +   - Autoplay'
  merge: -1
  img_proc: true
- pgno: 218
  md: 'The latest version (5.5) now includes:


    +   - YouTube support

    +   - Related videos (YouTube), also can disable search

    +   - Disable show info

    +   - Disable annotations

    +   - Show border (with color option)

    +   - Metacafe videos

    +   - Show statistics

    +   - Show video title


    Install the plugin using the Extension Manager and configure its parameters in
    the Plugins Manager area:


    ![](img/0151410972a5c5ea0aab26416e44b1da_218_0.png)


    To download this extension, visit http://extensions.joomla.org/ and search for
    "easiertube".'
  merge: -1
  img_proc: true
- pgno: 219
  md: '# QTUBE (M, P)


    QTUBE is a module and plugin designed to embed YouTube videos into a Joomla! Content
    Article:


    ![](img/0151410972a5c5ea0aab26416e44b1da_219_0.png)


    The plugin allows you to play videos within your Joomla! Articles and contains
    parameters which allow you to adjust the look and feel of the video container
    object.


    The developer of QTUBE has also developed a QTUBE module, allowing the ability
    to include videos into modules.


    The module and plugin are installed via the Extension Manager and its default
    parameters can be set in the Plugin and Module Manager areas:


    ![](img/0151410972a5c5ea0aab26416e44b1da_219_1.png)


    To download this extension, visit http://extensions.joomla.org/ and search for
    "QTUBE".'
  merge: -1
  img_proc: true
- pgno: 220
  md: '# JMultimedia Suite (C, M, P)


    The JMultimedia Suite is a kit of multimedia extensions. It can automatically
    detect and display videos from many streaming sites and in many media formats.
    It offers the administrator numerous video options:


    ![](img/0151410972a5c5ea0aab26416e44b1da_220_0.png)


    Key features are:


    +   - Create/edit video categories

    +   - Create/edit media items

    +   - Customizable CSS

    +   - Multi-media formats are supported

    +   - Integration with commenter comments system


    A requirement of the JMultimedia Suite is for the extension "denVideo" to be installed.
    It will then automatically recognize video links within your articles, and support
    all video formats that denVideo does, including:


    +   - SWF (Flash applications)

    +   - FLV and H264 (Flash videos)

    +   - CLASS (Java applet)

    +   - MOV and MP4 (QuickTime)

    +   - RM and RAM (RealMedia)

    +   - MP3 (audio)'
  merge: -1
  img_proc: true
