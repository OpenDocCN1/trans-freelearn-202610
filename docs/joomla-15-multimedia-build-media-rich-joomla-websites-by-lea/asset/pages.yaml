- pgno: 141
  md: '# Creating the article


    New articles are created in the "Article Manager" view:


    +   - Click on the **Article Manager** icon on the Control Panel, or under the
    **Components | Articles** menu link.

    +   - Click on the icon labeled **New** at the top-right of that page. This will
    open up the **Add Article** page.

    +   - One of few requirements your new article needs is a page **Title**, and
    some text within the article. Once these two things have been populated, you are
    able to click on the **Save** or **Apply** buttons located at the top-right of
    this page.


    # The audio HTML code


    Audio can be presented in two ways within your Joomla! Articles and Modules:


    # Direct download


    You can provide a hyperlink directly to the audio file, which will allow users
    to download the file, and when the download is complete, it can be played in the
    browser window via a plugin, or played on the users'' machine via the help of
    an audio player application such as QuickTime or Windows Media Player.


    The download method is the way that audio content used to be offered before web
    streaming and embedding content became commonplace. Direct downloads are useful
    if you want to allow your users to download and save the audio content as a file.
    The code to offer an audio download is a simple hyperlink to the file, and looks
    like this:


    ```

    <a href="/audio/sound.mp3" title="Audio of Boats Download (1MB)" >

    Listen to my Audio File (1MB)</a>

    ```


    The page looks like:


    ![](img/0151410972a5c5ea0aab26416e44b1da_141_0.png)'
  merge: -1
  img_proc: true
