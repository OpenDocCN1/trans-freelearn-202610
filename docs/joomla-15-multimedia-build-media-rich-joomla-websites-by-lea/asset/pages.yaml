- pgno: 210
  md: '# ## Collaborating with External Sources


    Some of the features in the new version include:


    +   - Uses the Twitter REST API to post messages.

    +   - All plugins are customizable: Account, category/section to post to, link
    position, show section/category, post private articles, post modified articles,
    exclude sections/categories, use a title or text for messages, additional static
    text (for example, for hashtags), short URL service provider (now bit.ly is also
    possible).

    +   - Also works with sh404sef and JoomSEF and Joomla! native SEF support.

    +   - Automatic support for short URLs.

    +   - Automatic message resending: Sometimes you will get an error message when
    posting. This can happen from time to time when Twitter or Facebook is overloaded
    or the API is down. AutoTweet resends the status message automatically if there
    is an error on the API site.

    +   - AutoTweet also posts later published or republished articles.

    +   - AutoTweet NG comes with a backend component. The component logs all posted
    messages (including error and pending messages) and you can manage and resend
    these messages in the component''s backend.

    +   - AutoTweet NG supports articles with the current publish date. (These articles
    are posted automatically to Twitter when published by Joomla! or you can post
    them manually from the AutoTweet NG backend component.)


    To download this extension, visit `http://extensions.joomla.org/` and search for
    "AutoTweet".


    # ## JTweet (M)


    The JTweet extension is a module that publishes your Twitter tweets in your Joomla!
    site:


    ![](img/0151410972a5c5ea0aab26416e44b1da_210_0.png)'
  merge: -1
  img_proc: true
- pgno: 211
  md: 'The module''s features include:


    +   - Set the number of tweets to display.

    +   - Choose whether to display your avatar or not.

    +   - Select whether to display just your tweets or all tweets related to a particular
    topic.

    +   - Select auto join phrases according to the nature of your tweet. For example,
    specific intro text for replies, verbs, replying to tweets, and more.

    +   - Set the text to appear while the tweets load.

    +   - Filter your own tweets via keywords. For example, only display tweets that
    contain the word "Joomla!".


    Once installed, all configurations are performed within the **Module Parameters**:


