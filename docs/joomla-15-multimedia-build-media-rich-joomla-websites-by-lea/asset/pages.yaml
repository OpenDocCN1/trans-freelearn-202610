- pgno: 4
  md: '# # About the Author


    **Allan Walker** grew up in New Zealand, and now lives in the United Kingdom,
    where he runs an online business consultancy and development company called "Amplify"
    (www.projectamplify.com). In recent years, Allan has been involved with a number
    of large-scale Joomla! projects, helping to establish Joomla! within the UK government
    and corporate sectors.


    Allan has been a mentor for the 2009 Joomla! Google Summer of Code program, and
    is a member of the Joomla! Marketing Team.


    > > When first starting to write this title, I assumed a couple of full-on weekends
    might break the back of the book. Nine months later, I have a better understanding
    of what efforts go into a project like this.


    I would like to thank anyone who has contributed in some way to the development
    of Joomla!. The product provides a diverse solution for projects, and through
    the ever-growing extensions directory, most users can now configure a Joomla!-based
    project, rather than have to build it. It is the design and simplicity of Joomla!
    which leads to its success, thus allowing non-technical users to build complex
    projects easily.


    For many of us who have based services around Joomla!, it has helped put food
    on the table. For this I am grateful. It is the generosity of people''s time,
    skills, and the community support that keeps the project rolling, and Joomla!''s
    features improving with every release. If you are interested in helping the product
    and community, please see information about contributing at www.joomla.org.


    For the lost evenings and weekends, my love and thanks go to my wife Georgina.
    Thank you for the continued support and patience.'
  merge: -1
  img_proc: true
- pgno: 5
  md: '# # About the Reviewers


    **Jose Argudo** is a web developer from Valencia, Spain. After finishing his studies
    he started working for a web design company. Then, six years later, he decided
    to start working as a freelancer.


    Now that some years have passed, he thinks it''s the best decision he has ever
    taken, a decision that let him work with the tools he likes, such as Joomla!,
    CodeIgniter, CakePHP, jQuery, and other known open source technologies.


    His desire to learn and share his knowledge has led him to be a regular reviewer
    of books from Packt, such as Joomla! With Flash (http://www.packtpub.com/joomla-with-flash/book),
    Joomla! 1.5 SEO (http://www.packtpub.com/joomla-1-5-search-engine-optimization-seo/book),
    Magento 1.3 Theme Design (http://www.packtpub.com/magento-1-3-theme-design/book),
    or Symfony 1.3 web application development (http://www.packtpub.com/symfony-1-3-web-application-development/book).


    Recently he has even published his own book, CodeIgniter 1.7, which you can also
    find at Packt''s site (http://www.packtpub.com/improve-coding-productivity-with-codeigniter-1-7/book).
    If you work with PHP... take a look at it!


    If you want to know more about him, you can check his site www.joseargudo.com.


    > > To my girlfriend and to my brother, I wish we will always be together.


    **Joseph L. LeBlanc** is a freelance Joomla! developer specializing in Joomla!,
    PHP, and JavaScript. Joseph can be found teaching Joomla! classes and speaking
    at conferences. He has authored a book on Joomla! extension programming and a
    Lynda.com video series on using Joomla!.'
