    Comic Sans MS - cursive

    Courier New, Courier6 - monospace

    Georgia - serif

    Impact, Charcoal6 - sans-serif

    Monaco5 - monospace

    Lucida Sans Unicode, Lucida Grande - sans-serif

    Palatino Linotype, Book Antiqua3, Palatino6 - serif

    Tahoma, Geneva - sans-serif

    Times New Roman, Times - serif

    Trebuchet MS1, Helvetica - sans-serif

    Verdana, Geneva - sans-serif

    Symbol, Σγμμβολ2

    Webdings, ♈♉♊♋♌♍

    MS Sans Serif4, Geneva - sans-serif


    Microsoft started a "Core Fonts for the Web" initiative back in 1996. This set
    contained existing fonts, fonts which were commissioned by Microsoft, and some
    licensed from Apple. The "Core Fonts for the Web" selections are classified as
    members of the "web safe" font category.


    "Core Fonts for the Web" were designed to:


    +   - Support an international market

    +   - Be legible on screen

    +   - Offer a range of typographic styles


    The "Core Fonts for the Web" initiative included the following fonts. Note that
    these fonts are all the same font size.


    Andale Mono

    Arial

    Comic Sans MS

    Courier New

    Georgia

    Impact

    Times New Roman

    Trebuchet MS

    Verdana

    ♈♉♊♋♌♍

    (Webdings)'
  merge: -1
  img_proc: true
- pgno: 84
  md: "As mentioned earlier in this chapter, using a generic font family which is\
    \ defined in your CSS will be the safest option. Remember our generic font families?\n\
    \n+   - Serif\n+   - Sans-serif\n+   - Cursive\n+   - Fantasy\n+   - Monospace\n\
    \nOne of these font families should always be specified at the end of your font\
    \ family CSS definition, like this:\n\n```\nbody {\n    font-family: Arial,Helvetica,sans-serif;\n\
    }\n```\n\nThe previous example shows the sans-serif font family that would be\
    \ loaded in if neither the Arial or Helvetica fonts were available on the user's\
    \ computer system.\n\nAs web browsers continue to evolve and adopt font typefaces,\
    \ the real-time downloading and displaying of specific fonts will evolve our current\
    \ \"web safe\" font limitations. For now, it's best to play safe (by choosing\
    \ a web safe font) and make sure your site visitors (whatever their browser and\
    \ operating system) can easily read and obtain your important textual information."
  merge: -1
  img_proc: true
- pgno: 85
  md: '# Summary


    The use of text in our Joomla! web pages is usually the most prominent media element
    on the page. However, if a pre-built template has been used with an included font
    style, often little consideration has been given towards the font type and if
    it is suitable for the intended audience.


    This chapter has highlighted the numerous fonts that are available to use and
    which ones are classified as "web safe", providing your users with the best opportunity
    to see the site text styling as you designed it to be seen.


    Joomla! Template CSS files are an important and powerful styling mechanism that
    allows us to define and style our site text as well as other elements. In our
    CSS, we can use fixed text styling methods, or relative, allowing the user to
    resize their web page text as they require. Many Joomla! Templates contain enhanced
    "Typography" features including font-options and custom CSS styling. There are
    also some excellent third-party font extensions available at http://extensions.joomla.org/.
    Some of these include image replacement features which bring some exciting new
    font technologies to your Joomla! website.


    Web Safe fonts are a safe choice to use for your main body-text. There is a great
    range of web safe fonts, which can provide different emotional responses from
    your site users. By choosing the correct font for your site, you can evoke numerous
    emotions such as a serious, humorous, or a classy feeling to your web text. You
    can also increase visitor "time on site", by providing correct font size and user-resizing
    controls for the text. Make sure you specify a font family in your CSS definitions,
    so if your specified fonts are not available, the browser will be able to choose
    a generic family-font to display your site text.'
  merge: -1
  img_proc: true
- pgno: 86
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 87
  md: '# 4


    # Adding and Managing

    Image Content


    Next to text content, images are one of the most utilized multimedia resources
    in web pages. They can be used to inform and educate the reader, offer help with
    navigation, and to enhance the design and user''s overall visual experience.


    Whether you need to create multimedia image galleries in your Joomla! website
    or simply add images to your articles and modules, this chapter will provide the
    assistance to help utilize image content effectively within your Joomla! website.
    We look at:


    +   - Why we use images in websites

    +   - Image formats and which ones to use

    +   - Including images in articles and modules

    +   - Creating image galleries and slideshows

    +   - Template images

    +   - Joomla! Image Extensions

    +   - Browser support and accessibility for images


    # Images and why we use them in websites


    Research suggests that images enhance learning by illustrating the concepts visually
    and by providing visual memory cues to the viewer. We have been using images to
    describe, tell stories, and record history since our human evolution.


    I have been in a few situations where, if a language barrier between me and the
    other party exists, we have resorted to a pencil and napkin in order to communicate
    effectively.'
  merge: -1
  img_proc: true
- pgno: 88
  md: 'Pictures can convey a message, which might take many thousands of words to
    describe. This non-textual communication and the visual emotions that the use
    of images can generate mean they are the perfect medium to complement or replace
    the text in our web pages:


    ![](img/0151410972a5c5ea0aab26416e44b1da_88_0.png)


    The previous image could easily take a thousand words to describe, which would
    look uninteresting to the reader and take up valuable space on our web pages.
    Instead the picture only utilizes a fraction of the space that our description
    would use and tells a story in itself.


    Not only do images describe a story, a moment in time, or a fantasy situation;
    they can provide a visual stimulus, which portrays a style or theme and sets a
    mood for the viewer. Many Joomla! Templates now contain a high percentage of graphical
    images in order to produce interesting designs and effects, such as this commercial
    example from http://www.yootheme.com:


    ![](img/0151410972a5c5ea0aab26416e44b1da_88_1.png)'
  merge: -1
  img_proc: true
- pgno: 89
  md: 'Many templates now utilize rounded edges for the graphics, or faded effects,
    and some create a 3D type effect on our two-dimensional computer screens. This
    is achieved by using shading and image layering effects. Others use images to
    create interesting navigation effects which could not be achieved without using
    these.


    Besides the design, navigation, and branding effects that images help provide,
    inside our content and modules, we use images to advertise and communicate to
    our site visitors. One important trick as web developers is to make sure our images
    are as optimized as they can be before asking our viewers to load them into their
    web browsers. This ensures a pleasant user experience because if a site is slow
    to load, or images are missing, these can be a big turn-off to your site visitors.


    # Image formats and which ones to use


    Images can often make up 50 percent of a Joomla! website; sometimes even more.
    These images that get loaded into the browser can be part of your template design,
    or site images we have loaded into our modules and articles. Choosing an appropriate
    format for this image content will help optimize the loading times of your web
    pages, which is one of the most important considerations when building a multimedia
    rich website:


    ![](img/0151410972a5c5ea0aab26416e44b1da_89_0.png)


    There are a few simple rules we can use in order to choose an appropriate image
    format. The most important criterion for the final file is the size. The previous
    image is exported using Adobe Fireworks on a Mac computer. External image editors
    such as the GNU Image Manipulation Program (GIMP) are good open source solutions
    for manipulating and optimizing images for the web. GIMP can be downloaded by
    visiting http://www.gimp.org.'
  merge: -1
  img_proc: true
- pgno: 90
  md: 'With each image requiring loading by the user''s browser, page-loading times
    can be easily affected with the quality and quantity of images you use in your
    web pages. This in turn results in end user frustration (especially on dial-up
    Internet connections) and loss of site traffic.


    # Digital images


    Before we proceed further into file sizes and file types, it is important to mention
    a note about digital images. Because all of our web page images are stored or
    viewed on a computer device, they are in a digital format (an electronic file
    stored using zeros and ones). A digital image is built up of tiny elements called
    pixels. **Pixels** are the building blocks of all digital images and are small
    adjoining squares in a matrix across the length and width of your image.


    Pixels are so small that you cannot easily see them when the image is viewed on
    your computer screen:


    ![](img/0151410972a5c5ea0aab26416e44b1da_90_0.png)


    Each pixel is an element containing a single solid color, and when put together
    all of these tiny dots make up your final image. Usually, more pixels per area
    make up a higher quality image, but there is a point when viewed with the human
    eye on electronic devices that you cannot actually see the extra detail that the
    additional pixel''s bring to the image:


    ![](img/0151410972a5c5ea0aab26416e44b1da_90_1.png)


    The physical dimensions of a digital image are measured in pixels and all digital
    images have what is called an image resolution (the image height and width dimensions
    in pixels). It is possible to save your digital images in numerous formats and
    compressions in order to optimize the file quality and size. Image editing programs,
    such as Adobe Fireworks, are specifically designed with web optimization and export
    options:'
  merge: -1
  img_proc: true
- pgno: 91
  md: '# Lossy and lossless data compression


    Data compression is an important part of our digital world. File compression is
    useful because it helps in reducing the consumption of expensive resources such
    as transmission bandwidth and computer hard disk space.


    Almost all digital images that we use on the web have been resized or compressed
    to some degree. When editing or saving files in popular software editing programs,
    many options are provided to help optimize digital images.'
  merge: -1
  img_proc: true
- pgno: 92
  md: '**Lossy and lossless** compression are two terms that describe the compression
    type of a file, and whether or not the file retains all of the original data once
    compression and then decompression of that file has taken place. The preferred
    formats for digital web images (such as JPEG and GIF) all fall into one of the
    following compression types:


    +   1. **Lossy**

    +   A lossy data compression is one where the compression attempts to eliminate
    redundant or unnecessary file information. Generally, once a file has been compressed,
    the information that was lost during compression cannot be recovered again. Hence,
    it is a degradable compression type, and as the file is compressed and decompressed
    each time, the quality of the file will suffer from generation loss.

    +   JPEG and MP3 files are good examples of formats that use lossy compression.


    +   2. **Lossless**

    +   Lossless file compression makes use of data compression that retains every
    single bit of data that was in the original file before compression.

    +   Lossless compression is often used when an identical representation of the
    original data is required once a file has been compressed and then decompressed
    again. As an example, it is used for the popular ZIP file format. Image formats
    such as PNG and GIF fall into the lossless compression type.


    For now, it is not so important to go into any more detail on these compression
    types, but the following image formats fall into both of these compression categories.
    It is possible to optimize your website images by choosing the correct format
    to save and present them to your site users.


    # Image formats


    With hundreds of graphical image formats now available, it is understandable that
    there are some bizarre image formats being dished up on websites, mostly from
    inexperienced site designers who just happen to upload whatever they have been
    sent in an e-mail.


    Having just mentioned the "hundreds" word, to help calm the nerves there are only
    four main formats that are commonly used and recognized as web suitable. These
    have been deemed suitable due to their format and compression properties (making
    the final file size and view quality suitable). Another important reason why these
    formats have become the standard is the accessibility of being able to open or
    view these file types on most computer systems. With the Internet bringing together
    millions of users across the globe, common formats that are easily viewed or saved
    had to evolve.'
  merge: -1
  img_proc: true
- pgno: 93
  md: 'The following formats are members of both the lossy and lossless data compression
    formats:


    +   - **Graphic Interchange Format (GIF)** pronounced "giff".

    +   - **Joint Photographic Experts Group (JPEG)** pronounced "jay-peg"

    +   - **Portable Networks Graphic (PNG)** pronounced "ping"

    +   - **Scalable Vector Graphics (SVG)**


    Converting a digital image from one format to another is usually a "Save As" in
    a common graphical editor package. During this saving or exporting process, you
    will usually have options to choose the quality, file size, and pixel resolutions.


    # GIF


    The GIF image format belongs to a family called "index-color" formats. This means
    they use a fixed number of colors to make up the image. The file size is usually
    related to the bit-depth or number of colors used. These are usually a small number
    such as 256 or "8 bit" color, and often contain as little as two colors. For optimum
    file size, you usually want to choose as lower bit-depth as possible while still
    retaining an acceptable image.


    Due to its limited color properties, GIF images are usually perfect for a low
    number of solid flat colors and are often the format of choice for logos, buttons,
    and graphical text:


    ![](img/0151410972a5c5ea0aab26416e44b1da_93_0.png)


    GIF images are an in-efficient format for images such as photographs, which contain
    lots of colors. Photographs that are converted to a GIF format will usually be
    of poor quality, look blotchy, or show jiggered edges due to the limited color
    range:


    ![](img/0151410972a5c5ea0aab26416e44b1da_93_1.png)'
  merge: -1
  img_proc: true
- pgno: 94
  md: '# JPEG


    The JPEG file format was designed to efficiently compress realistic true color
    or grayscale images such as photographs. This compression type was designed and
    is the perfect option to save and compress your photographic images.


    The JPEG format works its magic by approximating blocks of pixels and during compression
    preserving the key details that are most apparent to the human eye. JPEG images
    can be highly compressed allowing you to save a good quality picture with a small
    file size. However, the JPEG format belongs to the lossy compression type which
    means every time you read, modify, and save your JPEG image, you lose some information.
    This derogation is very noticeable when you have text within an image, such as
    logos. This loss of data will still occur even if you set the quality slider to
    "100" when saving a JPEG image; hence it''s an excellent example of lossy file
    compression.


    JPEG is an excellent image format for multiple colors or toned images for your
    website, but it is not a good format to save your images in if you wish to edit
    or change them frequently:


    ![](img/0151410972a5c5ea0aab26416e44b1da_94_0.png)


    # PNG


    PNG is a relatively newer file format that was created as the open source successor
    to the GIF format. Being a member of the lossless compression type, PNG images
    are best suited to images, which may require editing and saving again. Like the
    GIF format, the PNG file format excels when the image contains large uniformly
    colored areas. The PNG format also lends itself well to the use of transparency,
    which can be important for logos that may be laid on top of background colors,
    or graphics:


    ![](img/0151410972a5c5ea0aab26416e44b1da_94_1.png)'
  merge: -1
  img_proc: true
- pgno: 95
  md: "Mozilla Firefox, Internet Explorer 7, and most of the major browsers now offer\
    \ PNG support. Many purchased Joomla! Templates will contain PNG images for logos,\
    \ rounded module headings, and buttons / icons.\n\n# SVG\n\nSVG is a new vector\
    \ file format created by the **World Wide Web Consortium (W3C)**. It was developed\
    \ to create a standard format for displaying vector graphics on the web.\n\nSVG\
    \ is a text based graphics format with the images and their behaviors defined\
    \ in an XML file format, which means they can be easily searched, scripted, and\
    \ compressed:\n\n```\n<?xml version=\"1.0\" standalone=\"no\"?>\n<!DOCTYPE svg\
    \ PUBLIC \"-//W3C//DTD SVG 1.1//EN\"\n\"http://www.projectamplify.com/DTD/svg01.dtd\"\
    >\n<svg width=\"5cm\" height=\"5cm\" viewBox=\"0 0 700 600\"\n xmlns=\"http://www.projectamplify.com/1000/svg\"\
    \ version=\"1.1\">\n<desc>Example script01 - invoke an ECMAScript function from\
    \ an onclick event</desc>\n<!-- ECMAScript to change the radius with each click\
    \ -->\n<script type=\"text/ecmascript\"><![CDATA[\nfunction circle.click(evt)\
    \ {\n var circle = evt.target;\n var currentRadius = circle.getAttribute(\"r\"\
    );\n if (currentRadius == 100)\n circle.setAttribute(\"r\", currentRadius*2);\n\
    \ else\n circle.setAttribute(\"r\", currentRadius*0.5);\n}\n]]>\n```\n\nSVG images\
    \ can interact with users in many ways due to their textural file format, and\
    \ images can be used with scripting in order to trigger events in web pages and\
    \ on mobile devices.\n\nAll major browsers except Internet Explorer offer SVG\
    \ file support. However, a browser plugin for Internet Explorer is available.\
    \ At this stage there are not many extensions around the subject of SVG, but there\
    \ is a useful Joomla! Plugin called XHTML Headers. This plugin helps to see if\
    \ the browser supports XHTML based technologies. For more information, visit http://extensions.joomla.org\
    \ and search for XHTML Headers."
  merge: -1
  img_proc: true
- pgno: 96
  md: '# Including images in your content articles and modules


    In the following section, we will cover inserting images into our Joomla! content
    articles and modules. This section assumes that you have a basic understanding
    of how Joomla! content articles function.


    # Adding an image using the Joomla! Article Image button


    Images can be easily added to new and existing Joomla! Articles (and Modules)
    by using the Image button, which is an extended editor plugin that is configured
    to be turned on with new Joomla! installations. The Editor button loads in below
    the Content Editor window when you are in the Edit Article screen:


    ![](img/0151410972a5c5ea0aab26416e44b1da_96_0.png)


    It is important to note that this is a different method of inserting an image
    than that when using the Insert Image button on the WYSIWYG editor toolbar.'
  merge: -1
  img_proc: true
- pgno: 97
  md: 'To insert an image into your Joomla! Articles, you will need to be in Article
    Edit Mode. Open your article for editing either by:


    +   1. Clicking on the "Add New" Article icon when viewing the Control Panel.

    +   2. Clicking on the Article option in the menu at the top, and then clicking
    on the "Article Manager" menu option. Select the article you wish to edit and
    click on the "Edit" icon in the top-right toolbar.

    +   3. If logged into the frontend of your Joomla! website with the appropriate
    edit permissions, select the article you wish to edit and then click on the "Edit"
    toolbar icon.


    Next, we need to choose where we would like our image to be placed. This is performed
    by inserting the image code in relation to the text that might be in your article.
    By clicking within the text content in the editor, you will be able to position
    your mouse cursor where you want your image to load:


    ![](img/0151410972a5c5ea0aab26416e44b1da_97_0.png)


    An Insert image screen will load on top of your Edit Article screen, which is
    the Joomla! Media Manager:


    ![](img/0151410972a5c5ea0aab26416e44b1da_97_1.png)'
  merge: -1
  img_proc: true
- pgno: 98
  md: 'The Insert image screen will show all of the media in your Joomla! Media Manager.
    It contains the following features:


    +   1. **Folder navigation**

    +   This is performed by using the **Directory** drop-down menu located at the
    top-left of the screen. You can drill down to subdirectories by using this or
    simply clicking on the folders that are available in the main Insert image window.
    The **up** button will quickly take you back up one directory:


    ![](img/0151410972a5c5ea0aab26416e44b1da_98_0.png)


    > You cannot move higher than your main "Media Directory" location, which is defined
    in the Global Configuration settings.


    +   2. **Selecting an image**

    +   Simply click on the image you wish to use, and the **Image URL** location
    will be automatically populated with that image''s location on your server:


    ![](img/0151410972a5c5ea0aab26416e44b1da_98_1.png)


    If you wish to use an image from another web server or site, enter the full URL
    to the location of that image into the Image URL field:


    ![](img/0151410972a5c5ea0aab26416e44b1da_98_2.png)'
  merge: -1
  img_proc: true
- pgno: 99
  md: '# 3. **Setting the image properties**


    We have three important fields (plus the **Align** and **Caption** boxes) to consider
    when inserting an image via the "Insert image" window:


    ![](img/0151410972a5c5ea0aab26416e44b1da_99_0.png)


    The "Insert image" window has the following fields:


    +   - The **Image URL** field holds the location to your image. This can be a
    relative URL to your website domain (for example, `/images/image.jpg`), or the
    absolute URL path to your image (for example, `http://www.mydomain.com/images/test.jpg`).

    +   - The image **Align** drop-down option allows you to align the image in relation
    to the text that the image surrounds. If the align is set to the left, the image
    will float to the left of the block of text, if aligned to the right, the image
    will float to the right of the text. If this option is left blank, there will
    be no image alignment set.

    +   - The image **Description** field is a Joomla! description which is the equivalent
    to an alt tag when using HTML. The Alt description is used to describe an "alternate-text"
    for an image. The alt attribute tells the viewer what they are missing on the
    page if the image is not loaded in. They are especially useful for people with
    screen readers, or those who choose to view the web with images turned off in
    their web browsers.

    +   - The image **Title** field specifies additional information about the image.
    This information is shown as a tooltip text to the user when their mouse is hovered
    over the image.

    +   - The image **Caption** checkbox will use the image title, and output this
    description as an image caption. This usually shows under your image, and CSS
    can be used to manipulate the look and positioning of this.


    The Insert image screen also has a useful file upload tool built into it. Hence,
    if your images have not already been uploaded by FTP or the Joomla! Media Manager,
    then you have the option to upload when editing your content articles.'
  merge: -1
  img_proc: true
- pgno: 100
  md: 'Before uploading, make sure you have selected the directory in which you wish
    to upload a new image to. To upload, click on the **Choose File** upload button
    located at the bottom of the Insert image screen:


    ![](img/0151410972a5c5ea0aab26416e44b1da_100_0.png)


    A screen will appear in which you should navigate to the file that requires uploading.
    Once you have selected your file, click on the **Start Upload** button to start
    the upload process.


    A message at the top of the Insert image window will appear to tell you if your
    upload has been successful. If you have issues with uploading, check that your
    media directories and subdirectories have "read and write" permissions set on
    them to allow the upload.


    Once your file has been uploaded, you can click on it to select that file, populate
    the image properties fields, and then click on the **Insert** button at the top-right
    of the Insert image window.


    # # Adding an image using the Editor Image button


    Your Joomla! install has one or two WYSIWYG (What You See Is What You Get) editors
    available. It is possible to change the editor type on a user basis within the
    User Manager. It is also possible to make a site-wide setting within the Global
    Administration:


    ![](img/0151410972a5c5ea0aab26416e44b1da_100_1.png)


    A suggestion would be to download these and see which one (if any) makes your
    editing environment more suitable. Almost all of these editors offer the ability
    to insert images into your content articles, usually via an icon on the editor
    toolbar.'
  merge: -1
  img_proc: true
- pgno: 101
  md: 'For this example, we will use the Joomla! default TinyMCE editor:


    ![](img/0151410972a5c5ea0aab26416e44b1da_101_0.png)


    Firstly choose the article you wish to edit, or create a new article and go into
    the Edit Article screen.


    As when using the Joomla! Image button technique, we need to position the cursor
    in an area of the article where we want the image to appear. In the editor toolbar,
    you will see numerous icons to perform editor functions. Look for one with a small
    photograph image on it:


    ![](img/0151410972a5c5ea0aab26416e44b1da_101_1.png)


    When clicked on, this icon will open a pop-up window, which allows you to enter
    in the image location and properties. The main difference between this window
    and the earlier mentioned Joomla! Image button technique is that we manually need
    to enter in the image location in this area, and do not have the ability to upload
    images using this window:


    ![](img/0151410972a5c5ea0aab26416e44b1da_101_2.png)'
  merge: -1
  img_proc: true
- pgno: 102
  md: 'The fields available are:


    | Field | Description |

    |---|---|

    | Image URL | The Path to your image location. |

    | Image description | The alt text for your image. |

    | Alignment | Alignment of the image. |

    | Dimensions | The height and width of the image. |

    | Border | A border attribute for the image. |

    | Vertical space | Vertical spacing around the image. |

    | Horizontal space | Horizontal spacing around the image. |


    Using this method to input images into your content articles means that you have
    to manually enter the location to your site images (default is /images/stories/)
    and other properties into the fields provided, but it saves you having to enter
    the image code manually using HTML.


    # Image placement using custom HTML code


    Depending whether you have chosen a WYSIWYG editor for your Joomla! account, you
    may choose to edit content articles and modules using an editor, or choose to
    format your site content using an HTML code view.


    WYSIWYG editors can often add in additional characters to your site content, especially
    when content editors cut and paste the content directly from documents such as
    Microsoft Word, e-mail applications, and so on. They can allow users with no HTML
    experience to have wonderful functionalities for adding and updating website content,
    but can litter the code with unwanted or redundant code:


    ![](img/0151410972a5c5ea0aab26416e44b1da_102_0.png)'
  merge: -1
  img_proc: true
- pgno: 103
  md: 'Image placement using HTML and CSS offers you options to align and style your
    website content as you desire. Let''s look at how we can add an image into our
    content using pure HTML.


    Just like using a WYSIWYG editor to insert an image, when using HTML we are performing
    a similar process, but this time entering in the image code by hand. In HTML,
    all images are defined using the <img> tag. Additional properties are given to
    this tag to make it perform functions. When using the WYSIWYG editor, we need
    to make sure that our image code is placed in the position where we want it to
    be displayed on the page:


    ![](img/0151410972a5c5ea0aab26416e44b1da_103_0.png)


    In the editing window, position your mouse cursor where you want to enter your
    image. For our example, we will insert an image into the second (middle) paragraph
    of text (note each block of text has a <p> (paragraph) tag around it). The browser
    will show your image where the image tag occurs in the document. If we put an
    image in between two paragraphs, the browser will show the first paragraph, then
    the image, and then the second paragraph. In our example, we want the image to
    show at the start of our second paragraph, in line with our text content.


    We will break this down as an example, so let''s start off by inserting the basic
    <img> tag into our document:


    ```

    <p>This is an interesting paragraph about inserting an image around text</p>

    <p><img>This is an interesting paragraph about inserting an image around text
    </p>

    <p>This is an interesting paragraph about inserting an image around text </p>

    ```'
  merge: -1
  img_proc: true
- pgno: 104
  md: 'Next we need to provide a location for the image. This is done by using the
    src attribute (src stands for source). The value of this attribute is the source
    location of the image you wish to display:


    ```

    <p>This is an interesting paragraph about inserting an image around text</p>

    <p><img src="http://www.mydomain.com/image.jpg" />This is an interesting paragraph
    about inserting an image around text </p>

    <p>This is an interesting paragraph about inserting an image around text </p>

    ```


    Note how we have now added in a /> at the end of our image tag. This is required
    to end our <img> tag correctly and make our code XHTML compliant. Next we need
    to provide an alt (alternative text) description to our image. This is important
    to inform the viewer of what is loading into the page. Remember some web users
    have images turned off and use screen readers, so alt tags are very important
    for all images that you add into your site:


    ```

    <p>This is an interesting paragraph about inserting an image around text</p>

    <p><img src="http://www.mydomain.com/image.jpg" alt="My Page" />This is an interesting
    paragraph about inserting an image around text </p>

    <p>This is an interesting paragraph about inserting an image around text </p>

    ```


    If we click on Apply on our content article now, this code will be saved and if
    the location to the image is correct, the image will show. The previous code will
    load the image in and then the text will load underneath:


    ![](img/0151410972a5c5ea0aab26416e44b1da_104_0.png)


    If you want the text to wrap around your image, we need to set an align attribute
    (alignment) for the image. Options for the align attribute are either left, right,
    middle, top, and bottom, which will result in the image aligning to each of these
    values in relation to any text block around the image:


    ```

    <p>This is an interesting paragraph about inserting an image around text</p>

    <p><img src="http://www.mydomain.com/image.jpg" alt="My Page"

    ```'
  merge: -1
  img_proc: true
- pgno: 105
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 106
  md: 'The image will now look like:


    ![](img/0151410972a5c5ea0aab26416e44b1da_106_0.png)


    One final attribute that I would like to include is the title attribute (Title).
    This will provide a tooltip title to the image when the viewer hovers their mouse
    cursor over the image. Titles are useful for providing additional information
    and do have an affect on Search Engine Optimization (SEO). The code now becomes:


    ```

    <p>This is an interesting paragraph about inserting an image around text</p>

    <p><img src="http://www.mydomain.com/image.jpg" alt="My Page" align="left" height="60"
    width="100" hspace="5" title="A Nice Clock Image" />is an interesting paragraph
    about inserting an image around text </p>

    <p>This is an interesting paragraph about inserting an image around text </p>

    ```


    The image will now look like:


    ![](img/0151410972a5c5ea0aab26416e44b1da_106_1.png)


    If you want to insert numerous images into your articles and modules, it would
    be necessary to perform these steps for every image that you want to load in.
    It is possible to cut and paste the previous code and just change the values each
    time, but it can become time consuming.


    Some image attributes such as the image padding (vspace and hspace) can be set
    in your CSS, creating a site wide stylesheet class for all of your content images.
    This CSS code may look like:


    ```

    img { border: 0 none; margin: 3px }

    ```


    The previous example will set a border of 0 and a margin of 3 on all of your site
    images, so you may need to specify the CSS attribute in more detail to suit your
    template.'
  merge: -1
  img_proc: true
- pgno: 107
  md: '# # Creating image galleries and slideshows


    Joomla! is a Content Management System designed primarily for organizing and managing
    website content. It contains numerous multimedia features built into it, but its
    main focus is providing two roles: Powerful CMS features, and a well-designed
    framework which allows additional features to be added to the system, thus creating
    powerful functionality.


    These additional features are called **Extensions** and are designed to plug in
    to the core Joomla! Framework and extend the functionality of it. With regards
    to the core Joomla! CMS, we have already looked at how images can be included
    into content items and modules. However, image galleries and slideshows are asking
    a bit more than just simple image management, and so require the power of extensions
    to provide these features:


    ![](img/0151410972a5c5ea0aab26416e44b1da_107_0.png)


    The number of multimedia extensions now available for Joomla! is staggering. We
    have extensions which can create complex galleries, stream in videos, and compile
    jukebox type audio features.


    Having considered at great length the best approach for this section of the book,
    it has resulted in one option. That is to highlight some of the most popular and
    useful image gallery and slideshow extensions, and hope that these will provide
    understanding as to the complex image management capability that can be achieved
    by using Joomla! Extensions.'
  merge: -1
  img_proc: true
- pgno: 108
  md: '# Image management extensions, and how to install them


    Before proceeding with covering third-party extension functionality, let''s quickly
    cover how image extensions are added to your Joomla! site.


    As with most things in Joomla!, the process of installing extensions has had careful
    consideration from the development team, and is a very easy to perform. Most Joomla!
    Extensions come with their own installation instructions, and these general guidelines
    will help you get them installed on your site.


    > Before installing anything, make sure you copy your file set and backup your
    site database.


    For the purpose of this example, I am going to install one of my favorite Joomla!
    Multimedia Extensions — the RokBox extension by RocketTheme. RokBox is a MooTools
    powered slideshow plugin that enables you to display numerous media formats with
    a professional pop-up screen lightbox effect:


    ![](img/0151410972a5c5ea0aab26416e44b1da_108_0.png)'
  merge: -1
  img_proc: true
- pgno: 109
  md: 'The installation steps are as follows:


    +   1. Download the required extension and save this download on your computer.
    The file will be in a .zip format, or possibly a .gzip or .tgz format which may
    require unzipping before installation:


    ![](img/0151410972a5c5ea0aab26416e44b1da_109_0.png)


    +   2. Log into your Joomla! Administrator''s Control Panel, and navigate to the
    Extensions menu, then to Extension Manager. The page will default to the Install
    screen:


    ![](img/0151410972a5c5ea0aab26416e44b1da_109_1.png)'
  merge: -1
  img_proc: true
- pgno: 110
  md: '3. Browse your computer for the extension .zip file using the Choose File button
    on this page and once the file is located, use the Upload File & Install button.
    The Joomla! Installation Manger will perform all of the work and if your extension
    has been built correctly, the installer will place all files and documents into
    their correct directories:


    ![](img/0151410972a5c5ea0aab26416e44b1da_110_0.png)


    4. An installation success message will show to inform you that the extension
    has been successfully installed.


    > Some extensions success text may contain additional links to configuration pages
    for the extension.


    # Image gallery extensions


    The following is a list of Joomla! Extensions to create image galleries:


    # Simple Image Gallery


    The Simple Image Gallery extension is a plugin:


    ![](img/0151410972a5c5ea0aab26416e44b1da_110_1.png)'
  merge: -1
  img_proc: true
- pgno: 111
  md: 'The way the extension works is you add in a special tag—{gallery}myphotos {/gallery}—into
    your articles to display all of the photos correctly labeled in the myphotos folder:


    ![](img/0151410972a5c5ea0aab26416e44b1da_111_0.png)


    The extension then goes to work. The gallery created contains features such as
    stylish shadows on each thumbnail, lightbox pop ups to display the original images,
    and automatically generated thumbnails for each image.


    By utilizing the special tag method, you can display numerous galleries within
    your content articles and website. This offers great flexibility for a site-wide
    simple gallery feature.


    # Expose Flash Gallery


    Expose is a component, module gallery extension that offers language support.
    It is a Flash-based tool for offering eye-catching slideshows of your images on
    the Web:


    ![](img/0151410972a5c5ea0aab26416e44b1da_111_1.png)


    This extension is based on the stand-alone gallery software called "Expose" which
    has evolved to provide support for Joomla! websites. This extension offers numerous
    features, including nesting of albums, assigning thumbnails to albums, online
    picture upload, offline gallery management, watermark addition, and playing slideshows.'
  merge: -1
  img_proc: true
- pgno: 112
  md: 'With Expose, you can link directly to images, categories of images, or full
    albums:


    ![](img/0151410972a5c5ea0aab26416e44b1da_112_0.png)


    # Phoca Gallery with Slideshow


    Phoca Gallery is a fully-featured image gallery and slideshow extension for Joomla!
    It is a component with plugins and modules. It also caters for language support:


    ![](img/0151410972a5c5ea0aab26416e44b1da_112_1.png)'
  merge: -1
  img_proc: true
- pgno: 113
  md: 'Phoca Gallery allows you to create image categories and subcategories, and
    place images into these. It is possible for images to belong to more than one
    category, which provides greater flexibility in displaying images.


    Image thumbnails are automatically generated for the gallery, with added options
    such as watermarking, user access, YouTube support, and numerous gallery effects
    to display your image galleries in various ways:


    ![](img/0151410972a5c5ea0aab26416e44b1da_113_0.png)


    Phoca Gallery comes with a range of available plugins and modules. It is possible
    to present image galleries and slideshows in both your articles and modules. There
    is even a search plugin to help Joomla! search through your image categories.


    # Ozio Gallery2


    Ozio Gallery is a Joomla! Component, with available modules:


    ![](img/0151410972a5c5ea0aab26416e44b1da_113_1.png)'
  merge: -1
  img_proc: true
- pgno: 114
  md: '# Adding and Managing Image Content


    It can be used to develop complex image galleries with interesting effects thanks
    to the Flash features and gallery skins. These two features effectively turn this
    image gallery component into many different image gallery options:


    ![](img/0151410972a5c5ea0aab26416e44b1da_114_0.png)


    Ozio Gallery offers you the flexibility of linking directly to the content, or
    by publishing your galleries into module positions using the Ozio Gallery module.
    Containing numerous parameters, this product should satisfy anyone requiring an
    interesting Flash-based image gallery feature with slideshow support:'
  merge: -1
  img_proc: true
- pgno: 115
  md: '![](img/0151410972a5c5ea0aab26416e44b1da_115_0.png)


    This extension also offers the ability to show photos from a **flickr** account,
    and to display your **flickr** images within your Joomla! site:


    ![](img/0151410972a5c5ea0aab26416e44b1da_115_1.png)'
  merge: -1
  img_proc: true
- pgno: 116
  md: '# JoomGallery


    JoomGallery is a Joomla! Component, Plugin, and Module with language support:


    ![](img/0151410972a5c5ea0aab26416e44b1da_116_0.png)


    JoomGallery offers many features including defining subcategories of galleries,
    batch upload of images, user access rights to categories, configurable watermarks,
    slideshow support, and the list goes on:


    ![](img/0151410972a5c5ea0aab26416e44b1da_116_1.png)'
  merge: -1
  img_proc: true
- pgno: 117
  md: '# Image slideshows


    A list of Joomla! Image Extensions for creating slideshows is as follows:


    # RokSlideshow


    RokSlideshow is a Joomla! Module that allows you to display a series of images
    and captions, and transition between them in a configurable manner.


    ![](img/0151410972a5c5ea0aab26416e44b1da_117_0.png)


    The slideshow is driven by Mootools, providing fades, burns, wipes, and push effects
    between the images displayed. All in all, the module is capable of 30 different
    transition effects.'
  merge: -1
  img_proc: true
- pgno: 118
  md: 'Image information can be displayed and images may contain hyperlinks, a title,
    and a description:


    ![](img/0151410972a5c5ea0aab26416e44b1da_118_0.png)


    RokSlideshow is very flexible and easily customizable. It is a great way to display
    image slideshows in your Joomla! website and an excellent alternative to Flash
    image gallery players.


    # Simple Image Rotator


    The Simple Image Rotator module offers a simple image rotating mechanism. It is
    a lightweight JavaScript alternative to Flash image rotation scripts, but offers
    a similar feel in terms of the fading transition. The previous image will fade
    within a few seconds to the next image, and so on. It does what it says on the
    tin!'
  merge: -1
  img_proc: true
- pgno: 119
  md: '![](img/0151410972a5c5ea0aab26416e44b1da_119_0.png)


    # Boncko Cooliris (PicLens) Gallery Plugin


    If you happen to use Cooliris for your image galleries, then extensions such as
    the Boncko Cooliris Plugin will be right up your street:


    ![](img/0151410972a5c5ea0aab26416e44b1da_119_1.png)


    You can easily add Cooliris image galleries inside your articles by using the
    special tag: {boncko}/img_dir/{/boncko}. This plugin will insert all images and
    Flash video files from the /img_dir/ directory into your Joomla! content, making
    your image gallery look good.


    This process means you can store and organize your image galleries externally
    from your Joomla! site, and suck in the content that you wish. Boncko Cooliris
    Plugin can even play audio tracks while your image gallery is active.'
  merge: -1
  img_proc: true
- pgno: 120
  md: 'Some of these have been highlighted because they are popular GPL extensions
    which offer great flexibility for creating image galleries and slideshow features.


    There are many other image gallery extensions available at

    http://extensions.joomla.org:


    ![](img/0151410972a5c5ea0aab26416e44b1da_120_0.png)


    Many new extensions are being made available each week. Some of these are free
    GPL, some commercial extensions, and others require club memberships to access.
    Whether they are free or commercial entities, I hope you find a solution for your
    image gallery and slideshow requirements.


    Joomla! Extensions generally provide image solutions for creating galleries and
    slideshows within articles or modules. You may have a number of other images loading
    into your web pages, these are usually contained within your template.


    # Joomla! Template images


    Joomla! Templates control the overall look and layout of your Joomla! website.
    They provide the framework that brings together common elements and they provide
    the glue for your layout to interact with modules and components.'
  merge: -1
  img_proc: true
- pgno: 121
  md: 'Joomla! utilizes templates for both the frontend and backend (administration)
    of your site. When Joomla! is installed, it comes with a default set of templates
    included, and as you may be aware, you can find hundreds, if not thousands, of
    Joomla! Templates available on the Web. Some of these are feature packed and are
    commercial templates, some are ones without charge that fall under various licenses.


    Templates utilize a defined structure, which allows all of the template elements
    to interact with each other correctly:


    ![](img/0151410972a5c5ea0aab26416e44b1da_121_0.png)


    It is possible to make your own Joomla! Templates and now there are many tutorials
    available at http://www.joomla.org and a number of specialist Joomla! Template
    development books such as *Joomla 1.5 Template Design, Tessa Blakey Silver, Packt
    Publishing*. More information can be viewed at http://www.packtpub.com.


    One important role of a Joomla! Template is to contain and load the site stylesheets.
    These help position the template elements in your site. An increasing number of
    these elements in modern Joomla! Templates are scripts, style information, and
    images.


    Let''s take a quick look at one of the popular included templates that are available
    for Joomla!:


    ![](img/0151410972a5c5ea0aab26416e44b1da_121_1.png)'
  merge: -1
  img_proc: true
- pgno: 122
  md: '# Adding and Managing Image Content


    It is easy to see a number of images that help make up this template. We have
    images for the logo and rounded images for the boxes. Here is the same template
    loaded in the browser with the images disabled:


    ![](img/0151410972a5c5ea0aab26416e44b1da_122_0.png)


    The previous examples are of a relatively simplistic template, but you can see
    how the template images come together in greatly enhancing the site design. The
    advancement of Joomla! Templates are increasing every month, with many companies
    making extremely professional templates available for purchase each month.


    These commercial templates often include preset color themes and styles, offering
    the ability to change the site color scheme, and layout in seconds. This flexibility
    offers the administrator powerful features to create a new look for their site,
    but also can mean that some templates contain an abundance of scripts and images
    that never get used once the administrator had made a decision on the color choice,
    among others. What used to be a simple path to your template image folder can
    now often be multiple directories in your template containing the image files:


    ![](img/0151410972a5c5ea0aab26416e44b1da_122_1.png)'
  merge: -1
  img_proc: true
- pgno: 123
  md: '# How to adjust your template images


    The images for a Joomla! Template are generally located in the <Your Joomla Home
    Folder>/templates/<yourtemplate>/images directory. If you would like to adjust
    certain images in your template, the easiest way to do this is by viewing the
    template in your site browser and then making the necessary adjustments to the
    images.


    It is worth mentioning that many web developers develop their sites locally. A
    local development process is easily created by setting up a localhost server environment
    on your computer. Utilities such as MAMP for MAC, and XAMPP for Windows provide
    easy software installs of all the necessary components for running a local server
    environment. If you don''t already work locally, take two minutes out to look
    into these programs, as they not only save you time (as there are no connections
    to the live web servers), but also provide confidence when developing as you are
    never working on your live site:


    ![](img/0151410972a5c5ea0aab26416e44b1da_123_0.png)


    > There is more information about localhost development in Chapter 9, Joomla!
    Multimedia Project.'
  merge: -1
  img_proc: true
- pgno: 124
  md: 'One of the easiest ways to find and manipulate your site images is to either
    use a browser element inspector tool (such as Firebug for Firefox or Web Inspector
    for Safari), or to simply right-click on the images in the web browser, and choose
    **View Image**. This option may differ depending on the browser you are using,
    but most browsers offer the ability to find the location (URL) of the image or
    to open it in a new browser tab:


    ![](img/0151410972a5c5ea0aab26416e44b1da_124_0.png)


    Your image URL may look something like: `<Your Joomla Home Folder>/templates/<yourtemplate>/images/logo.png`.
    This image URL method lets you know the path, so you can find the necessary image.


    There are hundreds of available image manipulation programs, and we cannot go
    into the details of image manipulation in this book. However, if you stick to
    the following rules when adjusting your images, you will be on the right track:


    +   - Copy the original file. For example, if your file is called `logo.png`,
    then name the original file as `logo.png.orig` (or something similar), so you
    always have a copy of that original file. Or if you will be editing your website
    regularly, consider a version control system such as SVN or Git.

    +   - Make a note of the file name, size, and format before editing the file.

    +   - Unless you are a pro, always keep the same image format as the original
    image. If this image is referenced in the CSS or original code, your new image
    name will be different and the image will no longer show.

    +   - When saving an image, try to make sure the file size is as low as the original
    or as close to it as you can achieve through image optimization.

    +   - If you do change the image dimensions, make sure you check if there are
    any CSS variables or other code that might specify the physical file dimensions.


    With most templates, one of the first files you will adjust will be the Template
    Logo. The process for changing the logo is exactly the same as the previous steps.'
  merge: -1
  img_proc: true
- pgno: 125
  md: 'I briefly mentioned the use of Web Inspector Tools. Probably one of the most
    common of these is a tool available for the Firefox web browser. This is called
    Firebug. Visit http://getfirebug.com/ for more information. Firebug allows you
    to edit, debug, and inspect CSS, HTML, and JavaScript on any web page:


    ![](img/0151410972a5c5ea0aab26416e44b1da_125_0.png)


    Firebug allows you to inspect web elements and edit these on the fly, in your
    browser. For example, if you wish to move your logo sideways or up and down a
    bit, simply inspect the image logo element, and then adjust the corresponding
    CSS which positions this element. This is just a brief example of what the Firebug
    tool can do, but its power comes in handy when you need to problem solve errors,
    and so on. If you are keen on enhancing and developing for your Joomla! Template,
    I suggest a tool like Firebug which will really help you out!


    It is worth noting that Internet Explorer and Safari also have their own versions
    of an "Element Inspector".'
  merge: -1
  img_proc: true
- pgno: 126
  md: '# Browser support and image accessibility


    Almost all web browsers now offer image support. There are some considerations,
    however, when using images in your website content. The W3C Accessibility Guidelines
    emphasize the importance of offering text support (or text equivalents) to non-text
    content.


    The power of text-equivalents lie in their capacity to provide "information and
    support" to people from disability groups and those using varied technologies
    to view your web page content.


    Using text alternatives when using images can be a foolproof way to make sure
    that the widest possible audience has access to your web content. Text-alternatives
    can be visually read by screen readers, the size of the text adjusted for viewing,
    and content printed off to read in Braille, and so on, which makes a powerful
    argument for making alternative text content available.


    Secondly when we do use images, it is important to specify the alt and title tag
    information, so users who have images turned off in their browsers can see the
    "alternative text" which explains what should be loading in. Title tags provide
    clear tooltips to the user and both of these tags combined can enhance accessibility
    and search engine optimization:


    ![](img/0151410972a5c5ea0aab26416e44b1da_126_0.png)'
  merge: -1
  img_proc: true
- pgno: 127
  md: 'Up until recently, browsers such as Internet Explorer did not offer image transparency
    support, or PNG file extension support. Web developers had to use workarounds
    in order to show PNG files to users using these browsers to view their websites.
    Now Internet Explorer 7 and 8 both provide PNG support as a standard. SVG is a
    relatively new format, which required a browser plugin, for again the Internet
    Explorer browser. Web browsers, however, are improving every day, as is the support
    in them for various image formats.


    # Summary


    Images are an important communication element. They are used to tell stories,
    show facts, advertise and sell, as well as visually entice the user with emotive
    feelings. Our Joomla! Templates usually contain many images, which create eye-pleasing
    and complex designs.


    The use of images in websites has evolved quickly, from flat single color images
    to realistic high quality formats that cater to transparency and lossless compressions.
    The Web just wouldn''t be the same without them! An increase in broadband and
    connection speeds has allowed the evolution of beautiful image-gallery scripts;
    a number of these being incorporated into powerful Joomla! Image Extensions. There
    has never been a better time to display images and galleries in your Joomla! site.


    Take careful consideration when adjusting your existing template images, or when
    creating new ones for your site. Image file size and optimization is an important
    consideration to your site users. The use of good optimization tools and experience
    will help in providing quality images for your site while decreasing page loading
    time.


    With a diverse range of user abilities and disabilities, varied connection speeds,
    and a vast range of hardware accessing the World Wide Web, it is very important
    to consider the correct use of images and make alternatives available for those
    who cannot or choose not to view them. The use of alt and `title` tags, as well
    as height and width properties are all best practice when loading images into
    your site pages.'
  merge: -1
  img_proc: true
- pgno: 128
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 129
  md: '# Using Audio in Your Joomla! Website


    Audio is a powerful and emotive media element. Most humans use audio as a primary
    form of communication and hearing. It is defined as one of our major senses. For
    those with good hearing, our daily lives are surrounded with thousands of sounds
    that influence us both consciously and unconsciously.


    The Internet and audio have a very established relationship. The Internet has
    been a perfect delivery mechanism for audio and these elements have helped to
    re-define and rapidly evolve their respective technology and industries.


    In this chapter, we will look at the use of audio in your Joomla! website. You
    will learn about:


    +   - What audio is

    +   - Audio and the Internet

    +   - Audio formats

    +   - Embedding and displaying audio in Joomla! Articles

    +   - Creating an audio podcast for Joomla!

    +   - Third-party audio extensions

    +   - Browser support and audio accessibility


    # What is audio?


    **Audio** is "sound" which is detectable to the human ear. Sounds are pressure
    waves of air that we hear because our ears are designed to be sensitive to these
    waves.


    For humans, hearing is usually detected between the approximate range of 20 Hz
    and 20 kHz (20,000 Hz). 20 Hz is the lowest pitch (bassiest sound) we can interpret,
    20 kHz being the highest. It is recognized that as humans get older, the higher
    range of our hearing perception can often deteriorate.'
  merge: -1
  img_proc: true
- pgno: 130
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 131
  md: 'An important element of the Internet is the tools we use to interact with it.
    The personal computer is now a multimedia suite, offering powerful audio recording
    and playback capabilities that only specialist studios used to have access to.
    With computer screens being a visual medium, the use of audio is a perfect delivery
    medium for those who are "sight impaired", and web audio has been a solution to
    the delivery of information for people with certain disabilities:


    ![](img/0151410972a5c5ea0aab26416e44b1da_131_0.png)


    The previous image is taken from `http://www.w3.org`. It displays an accessible
    approach for an audio excerpt within a web page.


    # Audio formats


    Just like video, hundreds of audio formats exist for recording and playing back
    digital sound and music files. Many of these are software dependant, requiring
    a specific program to play that particular file. These formats are not of much
    use when trying to provide audio to the widest possible audience, so we will be
    narrowing the choices down to a few well-known and well-supported formats that
    are suitable for web use.


    Before we look at the choices of file types to use, it is important to mention
    that audio is data-intensive medium that has seen amazing developments in the
    way in which it is compressed and stored. This "data crunching" is performed using
    audio codecs. The word **Codec** stands for compression / decompression, which
    is the process that happens to the data.'
  merge: -1
  img_proc: true
- pgno: 132
  md: '# Audio compression


    Audio compression is very similar to video compression. Both use similar technologies
    to manipulate data and then offer it in a container suitable for playback to the
    user.


    It is important to point out that an audio file format and audio codec (or compression)
    are two different things.


    # Audio codecs


    The way that audio is compressed and stored is by using a codec, which has a major
    influence on the final file size. Specialist audio codecs have become available,
    which provide a balance of quality and file size options. As web hosting costs
    can become expensive to deliver data, codecs effectively reduce the storage space
    and bandwidth required for audio files on websites.


    Codecs use algorithms to remove the data that is considered "not important" and
    hence our file sizes drop as this additional information no longer exists. A good
    example of audio compression is to remove the data that falls outside of our recognized
    hearing ability. Hence, if we have very high or low frequency data in there that
    falls above or below our hearing capabilities, it is of no use to us, so we get
    rid of it.


    Most audio codecs are from the lossy compression family. This means the information
    that is removed during compression can no longer be recovered again. Lossy algorithms
    provide greater compression rates and are mostly used in consumer audio devices.
    They are also of interest to us because gauging the smallest file size (while
    retaining quality) is an important consideration when dealing with web audio.


    An audio codec may not necessarily relate to its final file name or type. An audio
    file type such as .wav (commonly used on Windows computers) can be encoded using
    different codecs, for example, the GSM, MP3, or PCM codecs. Audio file types use
    different codecs for their compressions. This is generally due to licensing and
    ownership of the codec. Just to confuse the issue, some codecs are actually named
    the same as the file type, such as the .mp3 file format that always uses the "MPEG
    Layer-3" codec.


    # Audio file format


    An audio file format plays a similar role to our video container file. The audio
    file contains the data file, but often also contains important header information,
    such as author, priority, notes, and other data.'
  merge: -1
  img_proc: true
- pgno: 133
  md: 'Some of the most common audio file formats for use in a web environment are:


    |  |  |

    |---|---|---|

    | **MIDI** (.midi) | MIDI is short for **Musical Instrument Digital Interface**.
    MIDI files are very small and are well supported by computer software and browsers.
    MIDI files, however, are usually data-based audio rather than a recorded waveform,
    therefore making them small and easy to distribute, but unsuitable for music files.
    |

    | **AIFF** (.aif/.aiff) | Developed by Apple, AIFF stands for **Audio Interchange
    File Format**. This file format is becoming increasingly popular for web audio.
    AIFF files are played using the QuickTime Player which is available on Mac and
    Windows. AIFF files can be compressed well, while retaining excellent quality.
    |

    | **MP3** (.mp3) | The **MPEG Layer-3** format is perhaps one of the most popular
    audio file formats in use on the Web. MP3 files are the audio part of a MPEG file
    and can compress audio to approximately one tenth of the original file size. This
    compression, while retaining good quality, has lead to their popular and widespread
    use. MP3 files can be played on many devices, making them an excellent choice
    for cross-platform capability. |

    | **AAC** (.aac/.mp4/.3gp/.m4a) | Designed by Apple to be the successor of MP3,
    **AAC** generally achieves better audio quality at similar sizes. AAC''s best
    known use is on the Apple iPod and it is the format used in the iTunes store and
    on Playstation 3. |

    | **WAV** (.wav) | Developed by IBM and Microsoft, WAV stands for **Waveform**
    which is the standard audio format on Windows computers. WAV does not compress
    audio data, which makes it unsuitable for web use, but is commonly used for storing
    uncompressed audio. Although WAV does not compress the file, WAV files can be
    compressed using other codecs such as MP3. |

    | **WMA** (.wma) | WMA stands for **Windows Media Audio** owned by Microsoft.
    It compares in quality and compression to an MP3 file, but has limitations on
    being accessible on all devices. |

    | **RealAudio** (.rm/.ram) | **RealAudio** is a format owned by RealNetworks.
    It was in common use, and helped to shape the use of streaming audio on the Web.
    The RealPlayer is free, but this format seems to have taken a decline due to its
    proprietary format. |'
  merge: -1
  img_proc: true
- pgno: 134
  md: '# Bit rates


    Bit rates refer to the speed at which a stream of data (compressed audio in this
    case) can travel. This is usually recorded in bits per second (kilobits per second,
    Kbps).


    The more audio data that can travel during a period of time, the better the quality
    the audio will have. Logically, the higher the bit rate that is used when recording
    audio, the more audio data there is available, which results in larger file sizes.


    We need to be aware of them because when exporting your audio, one of the options
    available is to choose the bit rate:


    ![](img/0151410972a5c5ea0aab26416e44b1da_134_0.png)


    There is a benchmark currently being used for web audio which is 128 bits per
    second (**128 kbps**) for stereo audio. Depending on your audio data (it may be
    a voice podcast or music file), you can go higher or lower than this figure, and
    if your audio is in a mono format, bit rates can be reduced again. If your music
    file is very important and you feel that the majority of your audience has a good
    broadband connection, then going to 160 Kbps may be an option. Anything below
    128 will affect your audio quality, but it is always worth experimenting to see
    how low your files sizes can be, while retaining the quality you require.


    With an abundance of audio software being available, and modern home computers
    containing audio systems, you may already have the tools to convert and export
    audio for your website in hand. The trick is to export your files in different
    formats and compression rates, and then compare them with each other to hear the
    difference, and see the file size comparisons.'
  merge: -1
  img_proc: true
- pgno: 135
  md: '# # How to compress and encode audio


    There is an abundance of audio editing and compression tools that are now available
    to help you manipulate audio files.


    If you have specific requirements, then a quick search on the Internet will lead
    you to popular software. If you have an audio file and are looking to optimize
    this for the Web, or convert it into another audio format, then take a look at
    a Windows'' open source solution, called LameXP, which can be downloaded at `http://www.snapfiles.com/get/lamexp.html`.


    LameXP is a frontend graphical interface for the Lame MP3, Ogg Vorbis, and Nero
    ACC codecs. It allows you to convert your files into MP3, OGG, Wave, and ACC formats
    by providing an easy to use interface where you can drag and drop files:


    ![](img/0151410972a5c5ea0aab26416e44b1da_135_0.png)


    LameXP is powerful but easy to use. Once you have downloaded and installed the
    package, open it up and follow these easy steps to convert and optimize your audio:


    +   1. Install any necessary codecs on your device. WAV files will require one,
    as will some others. Information boxes will talk you through these steps.

    +   2. Drag your file into the LameXP window or click on the **Add File** button
    to add your audio files.

    +   3. Use the tabs at the top to select your **Output Folder** and other file
    settings. The **Compression** tab is one to take note of. Within this tab, you
    can select the type of encoding you wish, as well as **Bitrate** for the encoded
    file. You can either use the **Quality** setting or pick a **Bitrate**, and the
    options will change depending on which radio button you select.'
  merge: -1
  img_proc: true
- pgno: 136
  md: '4. Use the **Encode Now!** button to start the encoding process:


    ![](img/0151410972a5c5ea0aab26416e44b1da_136_0.png)


    Hovering over the available options will provide further information to help you
    make choices. Due to the nature of audio, a suggestion is to encode your file
    using different settings, and then listen to these results and decide which bit
    rate / quality is most suitable for your piece of audio. Results will vary depending
    on the type of audio within your file. A piece of spoken audio such as an interview
    will react differently under compression than that containing a music track. With
    a few tests, you will find a happy compromise between the audio quality and the
    final file size.


    At the end of the day, look to reduce your file sizes as much as possible, while
    retaining the quality you require.


    # Embedding and displaying audio in Joomla! Articles


    One very powerful feature of Joomla! is the ability to include your own custom
    HTML into Joomla! Articles. This means we have the ability to completely customize
    the output of audio content in our articles and modules, which is what is required
    to insert audio manually into a Joomla! web page.'
  merge: -1
  img_proc: true
- pgno: 137
  md: '# # The source


    Before throwing some audio content at our Joomla! site, we need to make decisions
    on the type of audio it is and the file format to choose.


    As we have seen from the previous format listing, a good option is the .mp3 file
    format, due to its ability to be played via numerous audio players and devices.


    The export functions in audio software applications allow various formatting and
    compression options. There is some trial and error when creating multimedia files,
    and I can only suggest trying numerous settings and then comparing the results
    to find the audio quality you desire while achieving a manageable file size.


    # # The encoding


    Your source material may be in a raw format or in a format different than the
    one you decide to use, so the conversion of this into a popular web format is
    an important step. Exporting audio for end use could be a book in its own right.
    If you are stuck, then you should use the standard for the Web, which is the MP3
    format. The following offers you a guideline for MP3 export settings for web audio:


    | Quality | Settings |

    |---|---|

    | MP3 Voice Podcast | Mono, 64 Kbps, 44.100 kHz |

    | MP3 Low Quality | Stereo, 96 Kbps, 44.100 kHz |

    | MP3 Medium Quality | Stereo, 128 Kbps, 44.100 kHz |

    | MP3 High Quality | Stereo, 160 Kbps, 44.100 kHz |

    | MP3 Higher Quality | Stereo, 192 Kbps, 44.100 kHz |


    You can see how the bit rate increases to provide more data per second, and a
    better quality sound. Unfortunately, this will be at the expense of a larger file
    size.


    # # The upload


    Audio can be uploaded to your web server either via FTP, or you can use the built-in
    Media Manager.


    # ## Via FTP


    Open up your FTP program and log into your web server. In most graphical FTP programs,
    you will have two views; one for your local files and one for the remote files.'
  merge: -1
  img_proc: true
- pgno: 138
  md: 'In your remote file set, navigate so you can see the Joomla! root directory
    structure. At this level create a new folder. In this example, I will call it
    audio. Browse your local computer for the audio file to upload and send it on
    up to the new audio directory:


    ![](img/0151410972a5c5ea0aab26416e44b1da_138_0.png)


    > It is good practice to make a blank .html file and upload it to your new audio
    directory. This will help stop anyone from being able to directly view all of
    the files inside your new audio directory. If you cannot create a new .html file,
    copy an existing Joomla! .html file that resides in the images directory.


    ![](img/0151410972a5c5ea0aab26416e44b1da_138_1.png)


    # Via the Media Manager


    To upload via the Media Manager, log into administration and visit the Content
    | Media Manager link. Use the left-hand side directory structure to navigate to
    existing directories, or use the Create Folder feature to create a new audio directory:


    ![](img/0151410972a5c5ea0aab26416e44b1da_138_2.png)


    The previous image shows the Media Manager page with the folder structure on the
    left and files on the right.'
  merge: -1
  img_proc: true
- pgno: 139
  md: '> > The Media Manager location defaults to the setting in the Global Configuration
    settings. Usually this is within the `/images/stories` directory. If you wish
    to create a new root directory at the same level as the `/images` one (as we did
    using the FTP method), then you will need to change the default Media Manager
    path in Global Configuration and then come back to the Media Manager area to create
    your new directory. Your audio folder does not have to reside within the root
    of your Joomla! file system, but if you run a busy website, it helps for organizational
    purposes to contain your images, videos, and audio separately.


    The Global Configuration also contains other media settings, such as maximum file
    upload size, which may need to be taken into consideration when uploading audio
    using the Media Manager. There may be "PHP max file upload" restrictions on your
    web hosting server, so FTP / SFTP will be a good option if you are struggling
    with the Media Manager.


    ![](img/0151410972a5c5ea0aab26416e44b1da_139_0.png)


    Once your audio directory has been created, simply use the file upload feature
    of the Media Manager to upload your file into the selected directory.


    # ## Editors


    One of the most frustrating things that WYSIWYG editors do is to strip out or
    adjust your nicely entered code. Some are worse than others, but it will be in
    your interest to turn off your WYSIWYG editor when entering anything but simple
    HTML custom code into your Joomla! Articles. If you do not, then chances are your
    custom audio code will not work.


    Although, I have just recommended to turn your editors off, I know they can be
    useful at times, and some users can''t live without them. One simple trick is
    to create a new super administrator user and call it something like "noeditor".
    Then go and set the **Editor** choice for this user to be **Editor – No Editor**.
    Using this method you can login as the "noeditor" user whenever you wish. This
    saves having to switch the editor on and off regularly for a user.'
  merge: -1
  img_proc: true
- pgno: 140
