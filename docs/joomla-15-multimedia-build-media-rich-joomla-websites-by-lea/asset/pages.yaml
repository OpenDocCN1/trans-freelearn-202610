- pgno: 169
  md: '# # Using Video in Your Joomla! Website


    Video on the Internet is booming! Relatively recent improvements to factors such
    as superior video compression, increased connection speeds, and better hardware
    have all contributed to making the Internet a more reliable and accessible environment
    for the delivery of video content.


    This chapter highlights the use of video media within your Joomla! website, and
    includes the following topics:


    +   - Video on the Internet

    +   - Video formats

    +   - Embedding and displaying video in Joomla!

    +   - Creating video podcasts for Joomla!

    +   - Third-party video extensions

    +   - Browser support and accessibility


    # ## Video on the Internet


    The terminology, video, refers to the recording, manipulating, and display of
    a sequence of still images, representing scenes in motion.


    ![](img/0151410972a5c5ea0aab26416e44b1da_169_0.png)'
  merge: -1
  img_proc: true
- pgno: 170
  md: 'Video is probably one of the most notable "media types" that springs to mind
    when the term multimedia is used. Video is a data intensive media format, requiring
    megabytes of data to display even short video clips. Limitations such as this
    have been a restricting factor for its widespread use on the Web, up until recently!


    Over the past few years, the use of video on websites has rapidly increased and
    video has been used to sell, market, and for support and training purposes. New
    websites have evolved that focus entirely on hosting and presenting video clips
    to users, and this evolution of video potential has been because of the following
    contributing factors:


    # Bandwidth limitations


    The growth of consumer broadband has greatly contributed to video evolution on
    websites. A large percentage of site visitors now have the bandwidth required
    in order to access quality video content via the Web. It is not as good as it
    will get, but this factor alone has been one of the biggest influences in "web
    functionality" growth. Bandwidths are becoming good enough in some areas, that
    Blockbuster Movie Streaming and Television are now targeting the Internet as a
    broadcast medium.


    # Integration of video with other web content


    Until recently, most of the videos that were played on the Web offered no rich
    media capabilities, beyond that of playing back a simple video in a simple box
    player. Winding the clock back a few years, all video links on websites had to
    be downloaded to the user''s computer, before playback could happen.


    With the evolution of video formats, streaming video (content that can be played
    while it is still being downloaded), and the likes of the Adobe Flash Player,
    the delivery of video and its interaction with other web content has made for
    an enhanced user experience.


    # Authoring and playing video for the Web


    With a diverse range of browsers and operating systems available, video on websites
    often required users to pause what they were doing and download a plugin so that
    they could access the video content. Modern browsers have become well equipped
    to play numerous formats of video content, often without the need for additional
    plugins.'
  merge: -1
  img_proc: true
- pgno: 171
  md: '![](img/0151410972a5c5ea0aab26416e44b1da_171_0.png)


    Another contributing factor is the ease of creating content. In the past, you
    had to be an experienced video recorder / editor with specialist tools to create
    a video. More recently, new computer operating systems come pre-packed with a
    form of video editing software. The ease of creating videos and uploading them
    to websites has had a profound effect on its wide scale use as a popular media
    format.


    With its evolution so far, video and the Internet are extremely well suited. We
    get to have as close to a real-life experience as possible, which is educational
    or entertaining, and we get to have this in one of the most interesting playgrounds
    available, the Web!


    With the use of distribution channels, such as YouTube and Google Videos, there
    has been a dramatic evolution of video usage in websites. Rather than having to
    host your own video content (which usually causes increased web hosting costs),
    it is easy now to stream into your site''s external video content from a distribution
    site. The ease of broadcasting and sharing this video content is another major
    contributing factor to the Web video boom.


    # Video formats


    There are numerous video formats available. Each of these has an effect on the
    accessibility to different audiences, and some are licensed formats by corporate
    companies such as Microsoft and Apple. Video formats each contain their own algorithms,
    which process and handle the electronic video data in different ways:


    ![](img/0151410972a5c5ea0aab26416e44b1da_171_1.png)'
  merge: -1
  img_proc: true
- pgno: 172
  md: 'Some are more suitable for some purposes than others (such as storing videos
    on a DVD or playing videos on an iPod) and we will cover which video formats are
    suitable for a web-based environment.


    # Video compression


    When using videos on electronic devices, an important concern is the file size.
    This has often been the restricting factor for using video on the Internet. However,
    video is becoming consumer friendly now, even mobile phones are able to record
    videos easily.


    Video is a data intensive media format that uses a lot of space on a computer
    hard drive. Take this into a web scenario, and web-hosting server costs can become
    expensive due to the extended disk space required to host and play back video
    files.


    The answer to this has been video compression. By compressing the video, it becomes
    easier to distribute and store it. Digital video compression can be achieved by
    compressing the data without impacting the perceived quality of the final product.
    Most of the video compression methods fall into the "Lossy" data compression format.
    This means that certain information gets deleted every time a video is compressed.
    Once exported, this information is lost and can no longer be reclaimed:


    ![](img/0151410972a5c5ea0aab26416e44b1da_172_0.png)'
  merge: -1
  img_proc: true
- pgno: 173
  md: 'Compression works to remove the data that is considered "not important" and
    hence our file sizes drop due to this additional information that no longer exists.
    A good example of video compression is to remove the unrecognized colors from
    a video clip. There may be millions of colors in a movie (subtle shades of similar
    colors), but with humans only being able to perceive just over 1000 of them, it
    is in our interest to compress and remove this unwanted data.


    Throw away too much data (over compression) and the changes become noticeable.
    When compressing video, the goal is to compress as much as possible to the point
    where you can notice a quality loss, and then nudge back a bit from this point,
    so you try to achieve optimum data compression and file size with minimal quality
    loss.


    # Video codec


    Once upon a time, video codecs were a thing for "AV Nerds" and "Hardcore Illegal
    Video Downloaders", but believe it or not, you probably use them often if you
    use or watch movies either in a cinema, on a TV, or on your mobile phone.


    A **video codec** is a device or software that enables video compression, and
    again the decompression of this data. The term **codec** stands for compression
    / decompression and various codecs are used in both the audio and video media
    formats.


    Due to large media file sizes, mathematical codecs were built to encode a signal
    for transmission, and then decode it again for viewing. There are hundreds of
    codecs being used now and many of these come included with modern computer equipment.
    Some of the more common video codecs are VC-1, MPEG-4, and H.264.


    It is important to note that a video codec is not a video container (or wrapper)
    file, by this I mean the final file format. You have probably noticed that none
    of your video files have an extension like `.vc-1`, or `.h.264`. This is because
    video files are packaged in containers or wrappers that hold all sorts of file
    information, such as additional audio and navigational information, as well as
    the video file itself. The codec does the compression and the container file holds
    the information for that file. Examples of video container files are FLV (Flash
    Video), MOV (Apple QuickTime), and so on. Each of these containers uses a certain
    type of video codec for their compression. Further information about video codecs
    and container files can be found at `http://en.wikipedia.org/wiki/Category:Video_codecs`.


    We will be looking at these container files very soon because they are an important
    format for saving our web videos.'
  merge: -1
  img_proc: true
- pgno: 174
  md: '# Bit rates


    Bit rates describe how much information is processed per unit of time. Bit rates
    are an important part of video and audio compression, and all major video compression
    formats use various bit rates to crunch the data during compression.


    ![](img/0151410972a5c5ea0aab26416e44b1da_174_0.png)


    The unit of bit rate is bits per second (bps or bit / s) and can be used with
    prefixes such as (Kilo) Kbps, or (Mega) MBps, and so on. When exporting files
    from video editing applications, you may see the bit rate as an exporting option.
    What is important to remember is the higher the bit rate, the more information
    the file contains, resulting in a higher quality video file. A higher bit rate
    file will also result in more effort to encode / decode it, as well as a larger
    file size. Further information about video bit rates can be found at http://en.wikipedia.org/wiki/Bit_rate.


    # Video containers


    There are many compression standards used to compress video file sizes into an
    efficient state. A compressed video file will be wrapped in a container file,
    which contains all of the relevant information to play back the video. In order
    to play this video, the viewing system needs to understand both the video codec
    the file has been compressed with, and the video container.


    The following is a list of the most common video containers used for the Web:


    +   - AVI

    +   - FLV

    +   - MOV

    +   - MPEG'
  merge: -1
  img_proc: true
- pgno: 175
  md: '+   - WMV

    +   - RM


    Here is a brief introduction to each of these container formats:


    # AVI


    AVI stands for **Audio Video Interleave** which is a well-known video container
    format developed by Microsoft in 1992. AVI files are of excellent quality, but
    this is usually at the expense of file size. It is a popular choice for video
    editors to save and view videos in, due to the quality.


    There are many compression codecs for AVI files, so some of these cannot be played
    if the system does not contain the specific codec. This may mean a specific update
    may be needed in order to view some AVI movies. Most new computer systems, however,
    should be able to play a .avi movie file without the need for additional software.


    # FLV


    FLV stands for **Flash Live Video**. It is a format owned by Adobe Systems and
    designed for web video playback. It offers high rates of compression and high
    quality video.


    FLV is a popular format because it can be easily embedded into a web page for
    live streaming and is supported in most computer operating systems via the Adobe
    Flash Player and its web browser plugin.


    At present, FLV is the chosen format for popular video broadcasting sites such
    as YouTube and MySpace and it is thought to be one of the most popular formats
    to deliver video on the Web.


    Flash movies are an excellent format for web video, but they do have their limitations.
    Some companies will not allow the Flash player to be installed on their IT networks.
    There are also some search engine optimization limitations around full Flash authored
    websites.


    # MOV


    **QuickTime** (the file extension is .mov) is the multimedia playback and storage
    technology developed by Apple. QuickTime files act as containers that combine
    file, text, audio, and video in a single file.'
  merge: -1
  img_proc: true
- pgno: 176
  md: 'QuickTime movies are usually of great quality and the format offers good compression
    rates. The QuickTime player comes with Apple Macs, but Windows users may need
    to download the QuickTime player to view MOV files.


    # MPEG


    MPEG stands for **Moving Pictures Experts Group**, which was established in 1988
    as a working group to define a standard format for audio and video media types.


    MPEG files are a common format for web use and offer good quality compression
    and file sizes. There have been numerous editions to the MPEG family since the
    1980s with the latest and most popular format being MPEG-4 (.mp4).


    MPEG files can be played with Windows Media Player or Apple QuickTime Player,
    which means they are probably one of the most cross-platform suitable file formats.
    This has led to their popular use all over the Web. The latest format, .mp4, offers
    superior compression, with great quality and small file sizes.


    # WMV


    WMV stands for **Windows Media Video** and was created and licensed by Microsoft
    as a competitor to RealVideo. It is comparable in quality with other similar codecs
    and is supported by all Microsoft tools, which makes it the nature of choice for
    creating videos when using a Windows computer.


    Anyone who isn''t using a Windows computer will need to download the Windows Media
    Player, or an equivalent player, in order to play .wmv files. Therefore, in order
    to reach the largest audience, there are more suitable containers to use for your
    web-based videos.


    # RM


    **Real Audio/Video** was one of the leading pioneers in streaming video. It is
    a propriety video format developed by RealNetworks and was first released in 1997.
    Its streaming format and good compression rates provided quality videos in relatively
    small file sizes.


    RealVideo is usually packaged with audio and compiled in the container (.rm) file.
    The RealMedia format used to be very popular, but the propriety technology has
    led to the format''s decline in favor of more easily available solutions.


    There are many other video containers available for use in different environments.
    Further information on these can be found at http://en.wikipedia.org/wiki/Video_container.'
  merge: -1
  img_proc: true
- pgno: 177
  md: '# Embedding and displaying video in your Joomla! web pages


    Besides all of the wonderful features that Joomla! provides out-of-the-box, one
    very powerful feature is the ability to include your own custom HTML into Joomla!
    Articles. This means we have the ability to completely customize the output of
    content in our articles and modules, which is what is required to insert a video
    into a Joomla! web page, without the use of extensions.


    # The source


    When preparing your video for the Web, one of the most significant choices is
    which video format to use.


    Unfortunately, no single video format is 100 percent guaranteed to suit all of
    your site visitors. They will all be using different computer operating systems,
    screen resolutions, and web browsers, which means that consideration is required
    to allow your video to be seen by the majority of users, without the requirements
    for additional downloads or plugins.


    We have already listed video formats earlier in this chapter. The three main players
    that make themselves noticed when providing support for these video formats are
    as follows:


    | Adobe Flash | SWF movies |

    | Apple QuickTime | MOV, MPEG-1/2/4, AVI (depending on the codec used) |

    | Windows Media | WMV, MPEG-1, AVI (depending on the codec used) |


    Adobe Flash claims they have a 98 percent presence in the market, and it is widely
    used as a format choice for video distribution sites such as Google, YouTube,
    and Yahoo!. If a high percentage of users can view Flash content, then this is
    one great reason to consider using Flash as a video format for your site.


    There may be situations where installing Flash is restricted, such as on company
    computer networks. To cater for audiences such as this, making your content also
    available in an MPEG-4 video format may be a suitable option.


    # The encoding


    An essential step for web video is preparing it for web delivery. Your source
    material may often be in a different format than the one you decide to use, and
    if it has been recorded by a mobile phone, a DVD camcorder, among others, it will
    probably be in a very unsuitable format for use on the Web.'
  merge: -1
  img_proc: true
- pgno: 178
  md: 'There are a number of video exporting and conversion software applications
    available now, and although it would be great to go into detail, whole books have
    been written about editing and optimizing videos. The following is some basic
    information that can be taken as a guide when exporting your movie from video
    editing software. These are ideal for users viewing your sites with a broadband
    connection:


    | Adobe Flash format | Frame size and aspect ratio: (4:3) 384 x 480, (16:9) 270
    x 480. |

    |  | Frame rate: 12-15 frames per second. |

    |  | De-interlace: Should be set to yes. |

    |  | Audio bit rate: 64 Kbps (speech) to 128 Kbps (music). |

    | Apple QuickTime format | Frame size and aspect ratio: (4:3) 640 x 480 or 320
    x 240, (16:9) 640 x 352. |

    |  | Frame rate: 15 frames per second. |

    |  | De-interlace: Should be set to yes. |

    |  | Audio bit depth: 16 bit. |

    | Windows Media format | Frame size and aspect ratio: (4:3) 640 x 480 or 320 x
    240, (16:9) 640 x 352. |

    |  | Frame rate: 15 frames per second. |

    |  | De-interlace: Should be set to yes. |

    |  | Audio bit depth: 16 bit. |


    Raw video will need to be encoded into a streaming format to produce an appropriate
    QuickTime, Windows Media, Flash, RealMedia, or MPEG-4 file. The length and time
    required to encode video is dependent on the export settings, software, and computer
    processing power. Many free and commercial software applications are now available
    to perform video editing, exporting, and file conversions.


    An open source encoding tool worth mentioning is the MediaCoder from http://www.mediacoderhq.com/download.htm.
    MediaCoder is a free universal media transcoder that works with almost all popular
    codecs. MediaCoder can also transcode audio, providing you with a Swiss army knife
    for media encoding. A search on the Internet will provide you with editing tools
    to suit your computer platform, and there are lots available.'
  merge: -1
  img_proc: true
- pgno: 179
  md: '# The upload


    Whether you choose to use FTP or the built-in Media Manager, it is an easy process
    to upload video to your web server.


    # Via FTP


    Open up your FTP program and log into your web server. In most graphical FTP programs,
    you will have two views, one for your local files and one for the remote files:


    ![](img/0151410972a5c5ea0aab26416e44b1da_179_0.png)


    In your remote file set, navigate so you can see the Joomla! root directory structure.
    At this level, create a new folder named videos. Browse your local computer for
    the video file you want to upload and send it on up to the new video directory.


    > It is good practice to make a blank .html file and upload it to your new video
    directory. This will help stop anyone from being able to directly view all of
    the video files inside your new video directory. If you cannot create a new .html
    file, copy an existing Joomla! .html file that resides in the images directory.'
  merge: -1
  img_proc: true
- pgno: 180
  md: '# Via the Media Manager


    In order to upload a file via the Media Manager, log into the administration and
    visit the **Content | Media Manager** feature. Use the left-hand side directory
    structure to navigate to existing directories, or use the **Create Folder** feature
    to create a new video directory:


    ![](img/0151410972a5c5ea0aab26416e44b1da_180_0.png)


    > The Media Manager location defaults to the setting in the Global Configuration
    settings. Usually this is within the /images directory. If you wish to create
    a new root directory at the same level as the /images one (as we did using the
    FTP method), then you will need to change the default Media Manager path in Global
    Configuration and then come back to the Media Manager area to create your new
    directory.'
  merge: -1
  img_proc: true
- pgno: 181
  md: '![](img/0151410972a5c5ea0aab26416e44b1da_181_0.png)


    The Global Configuration also contains other media settings such as Max File upload
    size, which may need to be taken into consideration when uploading videos.


    Once your videos directory has been created, simply use the file upload feature
    of the Media Manager to upload your file into the selected directory.


    # Editors


    One of the most frustrating things with WYSIWYG editors is that they strip out
    or adjust your nicely formatted code. Some are worse than others at performing
    this role, but it will be in your interest to turn off your WYSIWYG editor when
    entering anything but simple HTML custom code into your Joomla! Articles.


    Although, I have just recommended that you turn your editors off, I know they
    can be useful at times, and some users can''t live without them. One simple trick
    is to create a new super administrator user and call it something like "noeditor".
    Then go and set the Editor choice for this user as Editor - No Editor. Using this
    method, you can log in as the "noeditor" user whenever you wish. This saves having
    to switch the editor on and off frequently.'
  merge: -1
  img_proc: true
- pgno: 182
  md: 'User editor settings can be adjusted on a "User basis" by going to the Site
    | User Manager page. Click on the user you wish to edit and there will be a parameter
    setting labeled Editor:


    ![](img/0151410972a5c5ea0aab26416e44b1da_182_0.png)


    Select the option you require and click on Save on the User Edit page. Editors
    can also be set on a higher level in Global Administration. Again, visit the Site
    | Global Configuration menu to adjust this setting. Once on the Global Configuration
    page, you will see a setting labeled Default Editor. Select the option you require,
    and click on Save on the Global Configuration page to save your changes:


    ![](img/0151410972a5c5ea0aab26416e44b1da_182_1.png)


    At Joomla.org, there are numerous editor extensions which can be easily installed
    and provide some fantastic functionality for editing your site content. All of
    these treat the code differently, but as a blanket rule: When entering complex
    HTML code into your Joomla! Articles, it is best to have all editors turned off.
    Once your custom HTML code has been included into the article page and saved,
    be cautious about turning on your WYSIWYG editor and revisiting the article. When
    your WYSIWYG editor loads the source code, it may strip out all of your hard work,
    and leave you with an article that will not display correctly.


    To help make the Joomla! editor a bit more HTML friendly, you can adjust the security
    for your editor filtering. Here is how to do it:


    +   - Within your Joomla! Administration, visit the Article Manager screen.

    +   - At the top-right of the page, you will see an option to edit the Global
    Article "Parameters".'
  merge: -1
  img_proc: true
- pgno: 183
  md: '+   - Click on this and at the bottom of the screen, you will see the Editor
    Filtering List.

    +   - Choose your Filter Group (for example, super administrator) and under the
    filter type, select "Whitelist".


    You can also configure specific HTML to be ignored from the editor''s filter list.
    Make sure you save these new configurations at the top of the page.


    # Creating the article


    New articles are created in the "Article Manager" view:


    +   - Click on the **Article Manager** icon on the control panel, or under the
    **Components | Articles** menu link.

    +   - Once you are in the Article Manager, click on the icon labeled **New** at
    the top-right of that page. This will open up the **Add Article** page.

    +   - One of the few requirements your new article needs is a page **Title**,
    and some text within the article. Once these two things have been populated, you
    will be able to click on the **Save** or **Apply** buttons located at the top-right
    of this page.


    # The video HTML code


    Videos can be presented in two ways within your Joomla! Article:


    # Direct download


    You can provide a hyperlink directly to the video file, which will allow users
    to download the video file, and when the download is complete, it can be viewed
    in the browser window with a plugin, or played on the user''s machine via the
    help of a video player application such as QuickTime or Windows Media Player.


    The download method is the way that video content used to be offered before web
    streaming and embedding content became commonplace. Direct downloads are useful
    if you want to allow your users to download and save the video content. The code
    to offer a video download is a simple hyperlink to the file, and looks like this:


    ```

    <a href="/videos/boats.mov" title="Video of Boats Download 1.2MB" >

    My Movie about Boats (1.2MB)</a>

    ```'
  merge: -1
  img_proc: true
- pgno: 184
  md: 'The page looks like:


    ![](img/0151410972a5c5ea0aab26416e44b1da_184_0.png)


    > When creating a link to a video file, it is good practice to always display
    the file size and additional information next to the link. This information can
    help the user to know what they are receiving, and the expected download times.


    # Streaming


    Streaming is a process of delivering compressed multimedia content, and displaying
    this to the user in real time. Examples of web streaming include Internet radio
    and television broadcasts.


    In the case of streaming video, once sufficient data has been downloaded, the
    user''s player (QuickTime Player, Windows Media Player) can start playing the
    video while the remaining portion of the video stream continues to download. This
    process means users do not have to wait for the full file download to finish before
    viewing that particular content.


    Streaming video is usually sent from prerecorded video files located on a server,
    but streaming can also relate to a "live video broadcast (or feed)". Live video
    feeds are converted into a compressed video signal, which can then be delivered
    via a web streaming server that is able to multi-cast, or send the files to multiple
    users at the same time.


    # Embedding code


    As with most HTML code, different browsers interpret it in various ways. To ensure
    that our videos will play properly in all browsers, we need to use a W3C preferred
    method of using the `<object>` tag alongside the `<embed>` tag (which is recommended
    for Netscape and older browsers).


    Using both of these tags lets our video play properly on all browsers, which provides
    us with the best possible chance of offering our video to the widest audience.'
  merge: -1
  img_proc: true
- pgno: 185
  md: 'The <object> tag is used to include multimedia objects such as audio, video,
    and Flash into web pages. Within the object tags are parameters, and other tags
    which all have a function (some to different browsers) for displaying your content
    correctly.


    The minimum valid code to embed a video in your Joomla! Article looks something
    like this:


    ```

    <object width="320" height="240" classid="clsid:02BF25D5-8C17-4B23-BC80-D3488ABDDC6B"
    codebase="http://www.apple.com/qtactivex/qtplugin.cab">

    <param name="src" value="/videos/videofile.mov">

    <param name="controller" value="true">

    <param name="autoplay" value="false">

    <embed src="/videos/videofile.mov" width="320" height="240" autoplay="false" controller="true"
    pluginspage="http://www.apple.com/quicktime/download/">

    </embed>

    </object>

    ```


    Let''s take a look at the elements of this code:


    | object | Used to include multimedia in a web page. |

    | height and width | Used to define the height and width of the object. This is
    usually the same size or slightly larger than the video file size, as sometimes
    we need a bit of extra space to show the video controls around the actual video.
    |

    | classid and codebase | Defines specific directions for automatically installing
    the ActiveX element. |

    | param | Controls the parameters of the object. |

    | src | The source of the file. |

    | controller | Set to true or false in order to show or hide the controller. |

    | autoplay | Set to true or false in order to start playing the video automatically.
    |

    | embed | Use the embed tag to place the player on the page. |

    | pluginspage | Takes the user to a plugins download page where they can download
    the specific player. |


    You will notice that the content within the <embed> tag is similar to some of
    that within the <object> tag. Using both of these tags will result in all major
    browsers being able to interoperate your content correctly.'
  merge: -1
  img_proc: true
- pgno: 186
  md: "Let's see our code in a working example. If we have a video called boats.mov\
    \ that has been saved as a .mov file of 320 x 240 proportions, and this file is\
    \ located in a directory named videos which resides at the root level of our Joomla!\
    \ file structure (at the same top level that the images directory does). The code\
    \ to embed that video will look like the following:\n\n```\n<object width=\"320\"\
    \ height=\"240\"\n    classid=\"clsid:02BF25D5-8C17-4B23-BC80-D3488ABDDC6B\"\n\
    \    codebase=\"http://www.apple.com/qtactivex/qtplugin.cab\">\n<param name=\"\
    src\" value=\"/videos/boats.mov\">\n<param name=\"controller\" value=\"true\"\
    >\n<param name=\"autoplay\" value=\"false\">\n<embed src=\"/videos/boats.mov\"\
    \ width=\"320\" height=\"240\"\n    autoplay=\"false\" controller=\"true\"\n \
    \   pluginspage=\"http://www.apple.com/quicktime/download/\">\n</embed>\n</object>\n\
    ```\n\nThere are many parameters that can reside within the <object> tag, too\
    \ many to cover in this manual, but the ones listed previously are common parameters.\
    \ For a list of more detailed parameters, visit the W3 Schools website at: http://www.w3schools.com/TAGS/tag_object.asp.\n\
    \n# Including a video using an article plugin\n\nNow that we have done the hard\
    \ work of including a video into our Joomla! Article using raw HTML code, we will\
    \ take a look at the power of a Joomla! Video Extension to include our video.\n\
    \nJoomla! Video Extensions provide a diverse range of extended functionality to\
    \ the core CMS. Once a plugin is installed and configured, adding video can be\
    \ a simple few clicks process. Joomla! Video Extensions will be highlighted later\
    \ in this chapter, but for now we will look at how powerful they can be to administrators.\n\
    \nAn example of an extension is the Flow Player:\n\n![](img/0151410972a5c5ea0aab26416e44b1da_186_0.png)"
  merge: -1
  img_proc: true
- pgno: 187
  md: 'Flow Player is a GPL licensed video player for web pages. The Flow Player utilizes
    a Flash-based player interface which takes numerous video formats and streams
    them in your HTML pages. It is a pretty advanced piece of kit, with advanced streaming
    technologies such as bandwidth, among others.


    The Flow Player for Joomla! has been developed, which harnesses this wonderful
    player, and makes it work easily within your Joomla! website. There is a plugin
    version available that allows you to play media within your articles, and a module
    version which can be placed in any module position.


    To get the Flow Player for Joomla!, visit http://extensions.joomla.org/ and search
    for "Flow Player Plugin". Once you have downloaded this extension to your computer,
    we are ready to roll!


    > Before installing any third-party code into your Joomla! website, make sure
    you take a backup of your site database and file set before the installation of
    extensions. There are some excellent backup extensions such as JoomlaPack and
    JoomlaCloner. Once configured, these help you to easily backup your Joomla! website
    with just a couple of clicks.


    Log into your site administration and click on Extensions | Extension Manager.


    Use the Choose File upload button to browse your local computer and find the plg_flowplayer.zip
    file. Once selected, use the Upload File & Install button to install this extension
    on your Joomla! website.


    ![](img/0151410972a5c5ea0aab26416e44b1da_187_0.png)


    Once successfully installed, you should head over to Extensions | Plugin Manager
    in order to configure the new plugin. This particular plugin is classed as a content
    plugin, so you will be looking for something like Content - FlowPlayer. Click
    on the text to load the Plugin Edit page.


    ![](img/0151410972a5c5ea0aab26416e44b1da_187_1.png)'
  merge: -1
  img_proc: true
- pgno: 188
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 189
  md: '# Creating a video podcast


    Creating a video podcast for Joomla! will allow you to display and promote your
    site or products to many users. Due to the nature of a podcast, they do not even
    have to be on your website to view the video podcasts, if produced correctly.


    It would be easy for us to create a regular RSS feed to a category containing
    video articles. This would provide us with an RSS feed, informing subscribers
    that we have new content on our site. Unfortunately, the RSS feed capabilities
    of Joomla! are limited, and this method would not enclose the video content within
    the RSS feed. Hence, our users cannot download the video file for viewing without
    coming back to the website.


    ![](img/0151410972a5c5ea0aab26416e44b1da_189_0.png)


    Creating a true video podcast requires the video content to be wrapped within
    RSS enclosures, which are a way of attaching multimedia content to RSS feeds.
    As Joomla! cannot provide this feature, we need to utilize a method mentioned
    in Chapter 5, Using Audio in Your Joomla! Website.


    The external RSS feed creation service "FeedBurner" can generate RSS feeds that
    can contain our multimedia content. For further details about the process, please
    look at Chapter 5 for this topic. Following are the brief steps for creating a
    video podcast using the FeedBurner service:


    +   1. Select and prepare your video content. A suggestion at first would be to
    insert your video code manually, as some video extension plugins may or may not
    work with this process.

    +   2. Create a video article and place this within a designated "Video" category.

    +   3. Create a "Link to Category" menu link so Joomla! can generate the RSS feed
    to that category.

    +   4. View the menu link in the frontend of Joomla!, and copy the RSS feed URL.


    ![](img/0151410972a5c5ea0aab26416e44b1da_189_1.png)'
  merge: -1
  img_proc: true
- pgno: 190
  md: '+   5. Visit http://feedburner.google.com and paste the URL into the feed creation
    box, making sure you click on the "I am a podcaster" checkbox.

    +   6. Follow the rest of the FeedBurner process, giving your feed a title and
    address and making sure that you select "Create podcast enclosures from links
    to: Any rich media file".

    +   7. Grab your new video podcast feed from FeedBurner and job done!


    So what we have done here is that we used FeedBurner''s powerful features to create
    a supercharged RSS feed, built off our Joomla! generated RSS feed.


    Once your FeedBurner feed has been successfully created and tested, you should
    be able to add new video articles into the same Joomla! Category, with these automatically
    being added to the video podcast feed.


    With the abundance of screen capture tools and video editing programs available,
    utilizing video to spread your message can be easily performed. As video is one
    of the most true-to-life media experiences, using it will inform and entertain
    your website visitors, and might just put you one step ahead of your competitors.


    # Third-party video extensions


    It is the use of Joomla!''s video extensions that provide us with some really
    powerful video capabilities. So much so, that Joomla! has extensions ranging from
    placing a simple video into a content article, through to providing a mini YouTube
    style video distribution site.


    Listed in this section are some of the most powerful, popular, non-commercial
    third-party video extensions for Joomla!. There are a number of commercial solutions
    also available; some of these are listed within the Joomla! Extensions directory.


    # AllVideos


    AllVideos is an all-in-one media solution for Joomla!. AllVideos is a plugin which
    can easily embed video from distribution sites such as YouTube, Vimeo, and many
    more. As well as this, it can play back almost any video / audio file type directly
    from your server or a remote one.'
  merge: -1
  img_proc: true
- pgno: 191
  md: '![](img/0151410972a5c5ea0aab26416e44b1da_191_0.png)


    AllVideos has the following features:


    +   1. Dozens of video distribution sites are supported. For example, YouTube,
    Google Videos, Vimeo, Metacafe, Brightcove, Dailymotion, Revver, Spike, and more!

    +   2. You can stream your own popular video formats, including `.fla`, `.swf`,
    `.mp4`, `.mov`, `.wmv`, `.wma`, `.mp3`, `.3gp`, `.divx`.

    +   3. You can embed video content from your own server, or a remote one.

    +   4. It is easy to use. Set the Plugin Parameters, make the plugin published,
    and you''re ready to stream video content from your website.

    +   5. You can customize your own display of the output from this plugin using
    a skinable template system.


    It is worth mentioning that there has been a developed fork of this extension,
    called AllVideos Reloaded. Both extensions are popular, and have continued development
    and their own set of features. Please review both of them at http://extensions.joomla.org
    (listed under the Multimedia category, or search for "AllVideos") to view the
    comparisons.'
  merge: -1
  img_proc: true
- pgno: 192
  md: '# hwdVideoShare


    hwdVideoShare is a video sharing gallery extension consisting of a component and
    plugin. The purpose of this extension is to provide you with the features of a
    video gallery and distribution website, such as YouTube.


    ![](img/0151410972a5c5ea0aab26416e44b1da_192_0.png)


    The component requires FFMPEG, MENCODER, and FLVTOOL2 to run, and can support
    the MPG, MPEG, AVI, DIVX, MP4, FLV, WMV, RM, MOV, MOOV, ASF, SWF, and VOB video
    formats.


    Videos from third-party sources such as YouTube and Google Videos are also supported,
    and function seamlessly with uploaded media, while users can rate, comment, report,
    and add videos to their favorites.


    The software uses the Joomla! Plugin Manager to support a variety of additional
    plugins:


    +   - Template plugins can be used to style the gallery with a custom theme

    +   - Language plugins can be used to translate the software

    +   - Video player plugins can be used to change the video player

    +   - Third party video plugins can be used to import videos from popular video
    sites

    +   - System plugins can be used to trigger useful tasks on specific video events'
  merge: -1
  img_proc: true
