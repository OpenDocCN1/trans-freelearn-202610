- pgno: 21
  md: '# 1

    Getting Started with Joomla! Multimedia


    At present, the use of multiple media content in web pages is evolving at an astonishing
    rate. Each week there are new multimedia extensions launched in the http://extensions.joomla.org
    extensions directory. Launching almost as quickly are new social / media web portals,
    offering the ability to interact and stream media content into your site pages.
    Some of these popular portals are defining new multimedia features and setting
    new standards for website user interactions.


    Your Joomla! Content Management System has lots of great built-in multimedia capabilities;
    these enriched with third-party extensions and streaming media sources can help
    evolve your default Joomla! website into a powerful media-rich interactive experience
    for your visitors.


    This chapter is an introduction to multimedia, and how Joomla! interacts with
    these media elements.


    # What is multimedia?


    The definition of **multimedia** is an ambiguous description, loosely used to
    define multiple types of media that are integrated and used with each other. Multimedia
    surrounds us in our daily lives and is utilized in many areas including marketing,
    advertising, art, medicine, engineering, and more!


    Examples of multimedia can range from a simple mixture of two media types, such
    as a book containing text and images, through to an advanced interactive video
    game including images, video, text, and audio.


    As the description suggests, "multimedia" contains different types of media content,
    and these different media elements can usually be defined into categories.'
  merge: -1
  img_proc: true
- pgno: 22
  md: '# Categories of multimedia


    From an academic approach, multimedia is often defined in two main categories:
    linear and non-linear. Hypermedia is the third definition, and although often
    viewed as its own classification, it falls under the non-linear multimedia category.


    # Linear


    Linear multimedia content generally progresses as a presentation, without the
    requirement for the viewer to interact or navigate. Examples of linear multimedia
    would be a blockbuster movie at a cinema, or a television show.


    # Non-linear


    Non-linear multimedia content is a media category which allows the user to control
    and progress through their own experience. Examples of non-linear multimedia could
    be an interactive video game or a computer based learning application.


    # Hypermedia


    Hypermedia is a member of the non-linear category. It is an extension of the term
    "Hypertext", meaning linkable text that a user can click on and navigate to another
    area.


    Hypermedia may contain text, images, video, and audio content that is linked.
    Hypermedia is the fundamental element for web pages due to its navigational properties.
    The best example of hypermedia is the World Wide Web (WWW) itself, which contains
    millions of web pages offering inter-linked media content.


    # Website multimedia


    Website multimedia describes multiple forms of media and content that is delivered
    electronically to the end user via a web server, or website page. Website multimedia
    generally falls under the non-linear multimedia classification, as more often
    than not, it allows the end user navigational and control opportunities. The types
    of media used on websites can include text, images, audio, and video, but can
    also contain a number of other interactive features which fall under the "multimedia"
    description.'
  merge: -1
  img_proc: true
- pgno: 23
  md: 'Throughout this book we will be looking at these multimedia elements, and how
    to display them effectively in our Joomla! website.


    # Various types of website multimedia


    The Internet started with simple textual content. With the implementation of HTML
    and other coding languages, and the evolution of web browsers and connection speeds,
    media-rich applications and websites are now present everywhere on the World Wide
    Web.'
  merge: -1
  img_proc: true
- pgno: 24
  md: '# Getting Started with Joomla! Multimedia


    Multimedia has directly influenced the growth of the Internet, just as the Internet
    has influenced multimedia. The expansion of information online is now becoming
    the most important multimedia vehicle. Web users now have the ability to control
    the delivery of data as they wish, and user interactivity is now a key process
    used in popular websites.


    ![](img/0151410972a5c5ea0aab26416e44b1da_24_0.png)


    As mentioned earlier in this chapter, multimedia is the combination of multiple
    forms of content. These can include text, images, audio, video as well as scripting
    and numerous other site features, which help site users with navigation and interactivity.


    # What is Joomla!?


    Joomla! is an award-winning open source Content Management System (CMS), enabling
    you to build powerful database driven website applications.'
  merge: -1
  img_proc: true
- pgno: 25
  md: 'Joomla! allows you to construct, organize, and manage your website content
    easily. Joomla! itself is a rapidly evolving product, as are the team and community
    supporting its growth:


    ![](img/0151410972a5c5ea0aab26416e44b1da_25_0.png)


    Joomla! creates pages which are publically viewable and also contains a web driven
    administration area, accessible via a login screen:


    ![](img/0151410972a5c5ea0aab26416e44b1da_25_1.png)'
  merge: -1
  img_proc: true
- pgno: 26
  md: 'Joomla! is utilized all over the world to power intranet and Internet websites
    of all shapes and sizes.


    Examples of where Joomla! is used are:


    +   - Online magazines, news portals, and publications

    +   - Government applications

    +   - School and church websites

    +   - Corporate websites and intranets

    +   - Personal web pages and blogs

    +   - Audio and video portals


    Joomla! has become a favored CMS to many people. Some of the reasons for its fast
    and continued growth include:


    +   - Joomla! is an open source application that is freely available to everyone.
    For further information about this subject please visit http://www.opensourcematters.org.

    +   - The product has a well structured roadmap for continued development and
    support.

    +   - Joomla! has a vibrant growing community, creating an excellent help and
    support network.

    +   - There are thousands of third-party extensions available which offer easily
    installable additional functionality. This allows powerful new features to be
    easily added to your Joomla! website, with just a few clicks of the mouse.

    +   - A template structure allows you to completely customize the look and feel
    of your Joomla! website.

    +   - Backend administration contains powerful features, is flexible and easy
    to use.


    # Including multimedia in your Joomla! site


    Just like a hand-coded website, your Joomla! website can easily contain multimedia
    site content. In fact, the Joomla! CMS is constructed to easily create, manage,
    and present multiple content types, allowing you to publish these on your site
    pages.


    The approach of including multimedia material into a software driven web framework
    (such as the Joomla! CMS) can be different than that of a hand-coded website.
    The media elements used will need to be included and deployed in a way conforming
    to the Joomla! CMS framework.'
  merge: -1
  img_proc: true
- pgno: 27
  md: 'The Joomla! CMS web platform is designed for content management and to be as
    lightweight as possible in additional clutter. Out of the box it does a great
    job at managing content, but the application framework offers the ability for
    thousands of developers around the world to contribute additional features for
    the base CMS. These are called Joomla! Extensions.


    Joomla! Extensions are third-party products which have been written to enhance
    the core Joomla! capabilities. They come in all shapes and sizes and can add powerful
    functionality to your default Joomla! There are thousands of Joomla! Extensions
    available in the Joomla! Extension Directory (JED) located at http://extensions.joomla.org
    as well as other Joomla! resources available on the Internet.


    ![](img/0151410972a5c5ea0aab26416e44b1da_27_0.png)


    Multimedia extensions contribute to a large section of the JED, and we will be
    highlighting some of the most powerful and useful extensions in the following
    chapters.'
  merge: -1
  img_proc: true
- pgno: 28
  md: '*Getting Started with Joomla! Multimedia*


    # Multimedia use in your Joomla! CMS


    A powerful feature of the Joomla! CMS is its ability to organize and manage content.
    This content can be text, images, documents, audio, video, and anything else you
    can think up to deliver to your site users.


    Joomla ships with its own "Media Manager" tool. This allows the ability to upload,
    organize, and delete different types of media to the images directory, or subdirectories
    if you wish. The media manager offers a thumbnail view as well as a detailed view
    of the file’s properties, such as name, file size, and so on.


    The purpose of the built-in media manager is to allow site administrators to manage
    media content from the website pages, without the requirement for File Transfer
    Protocol (FTP) access to the server. As a developer, using FTP is an essential
    transmission method, but when handing over a Joomla! based website over to the
    end clients, the need to restrict such access is commonplace.


    Once files are in place on the web server, things start to get interesting. We
    have our media on the server, all ready to go, and now what? Before we get too
    much further, now is the time to highlight Joomla! Templates.


    A Joomla! **Template** is a number of files within the Joomla! CMS which control
    the presentation of the content. Templates allow you to obtain a completely different
    "look and feeling" on your site pages. When combined with images, a Cascading
    Style Sheet (CSS) and the CMS database content templates contribute to the overall
    design and layout of your website.


    When producing website pages, often the location of main elements will stay the
    same; these might be menus, banners, and so on. These pages will probably also
    require the same logo, colors, and styles, which is where our template and cascading
    style sheets come in handy. Templates also have the important role of allowing
    us to publish certain Joomla! content into specific areas of the template.


    The CMS and template approach offers the ability to not only deliver our multiple
    media content in different positions around our website template, but we also
    have the flexibility of showing the content we want, when we want to. We will
    be devoting a whole chapter towards Joomla! Templates and how they can enhance
    our site multimedia features.


    For now, it has been important to highlight the fact that "out of the box" Joomla!
    seems to offer basic web content management. With knowledge of the product as
    well as additional extensions and configurations, it can provide a stunning web
    solution that is brimming with multimedia features.'
  merge: -1
  img_proc: true
