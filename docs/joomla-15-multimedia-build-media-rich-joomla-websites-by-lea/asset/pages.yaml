- pgno: 15
  md: '# Preface


    Joomla! is a Content Management System designed to organize and deliver content
    within a website environment.


    Multimedia provides us with stunning interactive user experiences and wonderful
    design options, but it requires discipline and knowledge to utilize it effectively
    so that we do not alienate our audiences.


    If you want to display more than just text on your Joomla! pages, this book has
    been designed for you and is a must-read. It takes you beyond the basics of Joomla!
    and helps to take full advantage of this powerful CMS structure to deliver media-rich
    web content to your site users. This book provides detailed information and all
    the required know-how for Joomla! administrators to create engaging, media-rich
    Joomla! websites. Utilizing core Joomla! features and the power of Joomla! Extensions,
    this step-by-step guide will show you how to include popular media elements into
    your website and collaborate with external web resources.


    You will learn everything you need to know to present text, images, video, and
    audio in your content by manually embedding content, using more automated methods,
    and the power of specialized extensions. You will learn to create regular podcasts
    and utilize RSS to help publicize and deliver your site content.


    Learn about the popular multimedia extensions for Joomla!; learn how they benefit
    your CMS with additional features, and how they are installed and configured.
    Utilize the abundance of external resources now available on the Web and learn
    how your Joomla! site can interact and present content from such sites as YouTube,
    Flickr, Twitter, and Google.'
  merge: -1
  img_proc: true
- pgno: 16
  md: '# What this book covers


    Chapter 1, *Getting Started With Joomla! Multimedia* introduces you to multimedia,
    breaks down the main elements, and is an overview of some of the things to come
    in following chapters. Your Joomla! Content Management System contains a number
    of built-in multimedia capabilities, these enriched with third-party extensions
    can turn your basic Joomla! CMS into a media-rich interactive user experience.


    Chapter 2, *Managing Your Joomla! Media* tells us that one of the most important
    tasks when using multimedia in our Joomla! websites is the ability to upload and
    manage the files on your web server. In this chapter, we will look at using the
    built-in Joomla! Media Manager, as well as alternative methods for managing your
    website media and files.


    Chapter 3, *Text, Characters, and Fonts in Your Joomla! Site* shows that text
    (and the styling of it) is one of the most prominent media types that has been,
    and still is used in website pages. Although it''s such a major media element,
    web developers often pay little attention to this subject. In this chapter, we
    will highlight the use of fonts, characters, and text within your Joomla! site,
    and how we can not only change the site design by using another font typeface,
    but by doing so we can affect your site''s user''s overall experience.


    Chapter 4, *Adding and Managing Image Content* will provide the assistance to
    help utilize image content effectively within your Joomla! website, whether you
    need to create multimedia image galleries in your Joomla! website, or simply add
    images to your articles and modules.


    Chapter 5, *Using Audio in Your Joomla! Website* highlights the use of audio in
    your Joomla! website. You will learn how to include powerful audio features such
    as audio players and podcasting capabilities into Joomla!.


    Chapter 6, *Using Video in Your Joomla! Website* highlights the use of video media
    within your Joomla! website. We look at the process of embedding video content
    into articles, creating and maintaining video podcasts, and the powerful video
    solutions that third-party Joomla! Extensions provide.


    Chapter 7, *Collaborating With External Sources* talks about how sharing of information
    between popular external resources, such as Twitter, Facebook, and Google, is
    an increasingly popular feature required by Joomla! users. Designed to extend
    the Joomla! Framework with new functionality, this chapter will look at the most
    popular collaboration extensions for Joomla! and the features they contain, as
    well as using good old fashioned HTML methods to embed external content into your
    site.'
  merge: -1
  img_proc: true
