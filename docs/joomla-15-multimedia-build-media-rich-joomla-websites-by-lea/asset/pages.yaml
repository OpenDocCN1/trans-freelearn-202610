    > Please note that the module now requires the JB Library plugin in order to work.
    The JB Library plugin loads the jQuery library automatically into the head of
    your template. The jQuery library is required for the jTweet module.


    To download this extension, visit http://extensions.joomla.org/ and search for
    "JTweet".'
  merge: -1
  img_proc: true
- pgno: 212
  md: '# Tweetboard (P)


    From the makers of the "Twitter Follow Me" module comes "Tweetboard". Utilizing
    the Tweetboard API plugin will allow you to display a Twitter Tweetboard on your
    Joomla! website:


    ![](img/0151410972a5c5ea0aab26416e44b1da_212_0.png)


    Tweetboard is a fun and engaging micro-forum type application that pulls your
    Twitter feeds in and reformats them into threaded conversations. This is a great
    marketing technique in order to improve traffic flow to your website. Conversations
    that have spun off from the original are also captured, effectively providing
    a discussion layout to your site visitors.


    The Tweetboard extension is a Joomla! Plugin. Once installed, the configuration
    settings are located in the plugin, under the Plugin Manager area:


    ![](img/0151410972a5c5ea0aab26416e44b1da_212_1.png)'
  merge: -1
  img_proc: true
- pgno: 213
  md: '> Before enabling the plugin, please visit the Joomla Exclusive Invite Portal
    (a link on the author''s downloads page) and use the specially generated code:
    `joomlainvites01`. This will allow you to quickly use Tweetboard with your Twitter
    account.


    To download this extension, visit `http://extensions.joomla.org/` and search for
    "Tweetboard".


    # WebScribble jConnector (C,M,P)


    jConnector allows your Joomla! members to sign in using Facebook Connect, which
    is a powerful set of APIs that lets developers bring identities and connections
    into other applications:


    ![](img/0151410972a5c5ea0aab26416e44b1da_213_0.png)


    If users are registered with Facebook, they can simply click on the **Facebook
    Connect** icon next time they visit your site, and they will be logged in automatically.
    This integration will add these users to your Joomla! database, so you can administer
    their accounts through Joomla!.


    Installation is easy with one `jConnector.zip` package file to be uploaded via
    the Extension Manager. Following a successful installation, you will need to go
    to the Module Manager in order to configure the **Module Parameters**:


    ![](img/0151410972a5c5ea0aab26416e44b1da_213_1.png)


    To begin using Facebook Connect, you must obtain **API key** and **Application
    Secret** from Facebook. To do so, you should first sign into Facebook at `http://facebook.com`.'
  merge: -1
  img_proc: true
- pgno: 214
  md: 'After signing in, you need to go to http://facebook.com/developers/ and follow
    the process for creating a new application. Once you have the Facebook API key,
    you will need to populate this parameter within the plugin management screen.


    To download this extension, visit http://extensions.joomla.org/ and search for
    "jConnector".


    # Facebook Fanbox Free (M)


    Facebook Fanbox is a Joomla! Module that displays Facebook FanBox in your Joomla!
    website:


    ![](img/0151410972a5c5ea0aab26416e44b1da_214_0.png)'
