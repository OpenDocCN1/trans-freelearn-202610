    \ titles denote whether the extension is a component, module, plugin, language,\
    \ or template.\n\n> Due to lengthy URLs and the possibility that Joomla! Extension\
    \ Directory (JED) listings could change at any time, search terms for the following\
    \ extensions have been included, rather than direct links to the extensions. Performing\
    \ a search on the JED for the related terms will help you find these extensions\
    \ easily.\n> \n> The letters after the extension titles denote the following:\n\
    > M = Module\n> C = Component\n> P = Plugin\n> L = Language\n> T = Template\n\n\
    # Joomla! and social networking integration\n\nSocial networking is the ability\
    \ to define communities or groups of people that share interests and can interact.\
    \ Traditionally, these would be small groups of people who were often located\
    \ within a similar regional area, but with the growth of the Internet and social\
    \ networking websites, these communities are now available to a global audience.\n\
    \n# Twitter Follow Me (M)\n\nThe \"Twitter Follow Me\" module places a Twitter\
