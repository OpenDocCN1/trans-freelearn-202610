- pgno: 18
  md: "# # Conventions\n\nIn this book, you will find a number of styles of text that\
    \ distinguish between different kinds of information. Here are some examples of\
    \ these styles, and an explanation of their meaning.\n\nCode words in text are\
    \ shown as follows: \"We can include other contexts through the use of the `include`\
    \ directive.\"\n\nA block of code is set as follows:\n\n```\n```css\nbody {\n\
    \    font-family: Arial,Courier,sans-serif;\n    line-height: 1.3em;\n    margin:\
    \ 0px;\n    font-size: 12px;\n    color: #333;\n}\n```\n```\n\nWhen we wish to\
    \ draw your attention to a particular part of a code block, the relevant lines\
    \ or items are set in bold:\n\n```\n```css\nh1.logo a\n{\n    **width: 208px;**\n\
    \    display: block;\n    background: url(../images/logo.png) no-repeat;\n   \
    \ **height: 80px;**\n    position: relative;\n    z-index: 100;\n}\n```\n```\n\
    \n**New terms and important words** are shown in bold. Words that you see on the\
    \ screen, in menus or dialog boxes for example, appear in the text like this:\
    \ \"Your Joomla! site **Media Settings** can be found by going to the **Site |\
    \ Global Configuration.**\"\n\n![](img/0151410972a5c5ea0aab26416e44b1da_18_0.png)\n\
    \n![](img/0151410972a5c5ea0aab26416e44b1da_18_1.png)"
  merge: -1
  img_proc: true
