  merge: -1
  img_proc: true
- pgno: 30
  md: 'In modern websites, the text and the type of style you would like applied to
    it is usually defined using a stylesheet. Within a stylesheet document, it is
    possible to set font and text properties. These properties can apply to small
    or large areas of text used on your site pages:


    ![](img/0151410972a5c5ea0aab26416e44b1da_30_0.png)


    # Images


    Next to written text, images are probably one of the most utilized types of media
    in websites.


    Images not only communicate information effectively (the old saying "a picture
    tells a thousand words"), but they are an important element of design, marketing,
    and branding which may distinguish your website from others.


    The definition of an "Image" can often be used to describe the following elements:


    +   - Photographs

    +   - Graphics

    +   - Diagrams

    +   - Drawings


    Images can be placed on web pages as a singular item to complement text, or they
    can be placed together to form galleries, which play a major multimedia role on
    some websites:'
  merge: -1
  img_proc: true
- pgno: 31
  md: '![](img/0151410972a5c5ea0aab26416e44b1da_31_0.png)


    Images can be created, edited, and saved into numerous formats. Some of these
    formats are more applicable for use on the Web than others.


    For more detailed image information, please view Chapter 4, Adding and Managing
    Image Content.


    # Audio


    Audio (or sound as we know it) can be used to inspire human emotion and deliver
    information. Audio is a major element of human entertainment, as well as a contributing
    element to videos, gaming, and other multimedia presentations.


    The use of audio can add interest, be informative, and entertain. An often overlooked
    fact is that audio can also provide an interface for visually impaired users to
    attain the information they require:


    ![](img/0151410972a5c5ea0aab26416e44b1da_31_1.png)'
  merge: -1
  img_proc: true
- pgno: 32
  md: 'Internet is now an audio-rich delivery mechanism, with audio being easily downloaded
    from websites and applications on portables. Most modern computer setups now include
    speakers, which depending on the way you look at it, has helped the evolution
    of audio usage within web pages. Possibly the equation goes the other way and
    greater audio usage on web pages has specified the requirements for computer users
    to need speakers.


    All of that said, gone are the dancing Santas that used to load into web pages,
    and play a nasty Christmas MIDI file with no volume control! Now we are talking
    about websites containing "podcasts on demand", and "dial up your own personal
    radio station playlists", and impressive audio players including time counts and
    player controls.


    Like images, sound files can be created and saved in many formats, including AAC,
    MP3, MIDI, WAV, as well as many others. Choosing the correct audio format to use
    on your website is imperative for the efficient delivery of the audio content
    to your site users.


    ![](img/0151410972a5c5ea0aab26416e44b1da_32_0.png)'
  merge: -1
  img_proc: true
- pgno: 33
  md: '# Video


    Video can be defined as a sequence of still images put together and displayed
    on a screen to form the illusion of motion:


    ![](img/0151410972a5c5ea0aab26416e44b1da_33_0.png)


    Video is one of the most powerful multimedia types, as it incorporates both images
    and audio. It can also contain text in the form of titles and descriptions.


    Video has been known as one of the most demanding media types to work with due
    to the overheads of processing and working with large file sizes. Transmission
    and storage of video has often made it an unsuitable medium to use in certain
    conditions. However, things are changing rapidly, and video is now often linked
    to or "streamed" into an application, rather than the files hosted themselves.'
  merge: -1
  img_proc: true
- pgno: 34
  md: 'Video can be saved in a variety of formats and compression types. Some of these
    will be very applicable, and others you should stay clear of for website use.
    More information about working with video can be found in Chapter 5, *Using Video
    within Your Joomla! Website.*


    ![](img/0151410972a5c5ea0aab26416e44b1da_34_0.png)


    # Multimedia and web accessibility


    Website accessibility means that people who have disabilities can understand,
    interact, and navigate through web pages.


    One of the main principles of web accessibility is to design websites and web
    software, which is flexible to meet different users'' situations, preferences,
    and environments.'
  merge: -1
  img_proc: true
- pgno: 35
  md: 'With the Web becoming an increasingly important resource for the sharing of
    information, many users are now going online for reference: health, commerce,
    government, recreation, media, and many other resources. It is essential that
    people wanting to utilize the Web have equal access and equal opportunities to
    these resources:


    ![](img/0151410972a5c5ea0aab26416e44b1da_35_0.png)


    Another important consideration when building a website is that web accessibility
    has legal obligations in certain countries. Besides the important consideration
    to all of your site users, there could also be legal reasons why accessibility
    should be considered when building and maintaining your website.'
  merge: -1
  img_proc: true
- pgno: 36
  md: '# Can a multimedia website be accessible?


    It is possible for a multimedia rich website to also be an accessible website.
    However, the level of accessibility options you choose to implement into your
    website are decisions you need to make for your project. The decision basis will
    often include factors such as target audiences, country legalities, and project
    time and budgets.


    There are a number of accessibility standards used around the Web, which provide
    accessibility guidelines and checklists to benchmark against. Examples of these
    are:


    # The Web Content Accessibility Guidelines (WCAG)


    The Web Content Accessibility Guidelines (WCAG) have become a world standard for
    web accessibility, and falls into three ''compliance'' categories:


    +   1. **A (also known as Level 1)**

    +      A website must comply with all checkpoints in Level 1 otherwise one or
    more user groups will find it impossible to access information or functionality.

    +   2. **AA (also known as Level 2)**

    +      A website should comply with all checkpoints in Level 2 otherwise one or
    more groups will experience significant barriers to access information or functionality.

    +   3. **AAA (also known as Level 3)**

    +      A website may comply with all checkpoints in Level 3 otherwise one or more
    groups will find it somewhat difficult to access information in the document.


    # Section 508


    Section 508 is a standard created by the US Federal Government. It contains 16
    checkpoints for testing your website against. The first 11 checkpoints are exactly
    equivalent to the WCAG A (Level 1) guidelines. The last five checkpoints are partly
    based on the WCAG guidelines, but are more extensive. For further information
    about this standard, please search for Section 508 on the Net.


    Site accessibility features are best considered at the start of a website project,
    and then having these addressed during development. It is much easier to take
    this approach rather than address this issue retrospectively. Fixing invalid site
    code and creating `title` or `alt` tags can consume hours of working time and
    often outweigh any budgets that have been put aside to make your content accessible.


    There are a number of simple processes you can put in place to make your website
    more accessible. Trying to attain a higher level of accessibility will of course
    require a greater investment of time.'
  merge: -1
  img_proc: true
- pgno: 37
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 38
  md: '+   3. http://en.wikipedia.org/wiki/Web_accessibility: Wikipedia''s page on
    accessibility guidelines.

    +   4. http://www.section508.gov/: Section 508 requires that Federal agencies''
    electronic and information technology is accessible to people with disabilities.


    # Web browser support for multimedia


    The Web was originally a text only medium, with browsers only being able to display
    text in a single font, size, and color.


    With the explosion of the Internet, website browsers can now view images, play
    audio and video. A further development of the World Wide Web has been the evolution
    of "streaming media" which allows the media playback to begin without the files
    being fully downloaded first.


    There are many web browsers available. Some of these are suitable for specific
    purposes and others pride themselves on being the most lightweight, or the fastest
    browser available.


    Most browsers have built-in media capabilities, which is an acknowledgement of
    the growth of website multimedia. Other browsers require plugins to play multimedia
    content. **Plugins** are programs, which extend your browser capabilities by making
    them compatible with additional media types. When your browser encounters a multimedia
    file, it hands over the data to the plugin in order to play or display that file.


    You may have heard of the plugin "Adobe Flash Player", which enables you to play
    Adobe movies through your web browser, or the "Windows Media Player" browser plugin,
    which plays streaming audio, video, and presentations saved in Microsoft formats.
    Without these plugins installed into the web browser, this media content on website
    pages cannot be effectively viewed:'
  merge: -1
  img_proc: true
- pgno: 39
  md: This highlights the importance of offering multimedia material in numerous formats,
    or if that is not an option, to provide the site users with clear instructions
    about the media trying to load, and when possible, where to go and find a plugin
    in order to play it.
  merge: -1
  img_proc: true
- pgno: 40
  md: '# Summary


    In this chapter, we have looked at the terminology "multimedia" and how this description
    contains numerous types of media content.


    We have highlighted the Joomla! CMS platform and recognized its built-in multimedia
    capabilities, as well as mentioned how these can be enhanced using Joomla! Extensions.
    As extensions enhance the default Joomla! installation, they will receive a healthy
    coverage throughout the chapters.


    It is important to note website accessibility in this chapter, as it is much easier
    to consider and integrate web accessibility into the start of website development,
    rather than trying to address accessibility issues retrospectively. More information
    about accessibility and how it relates to specific media, is covered within each
    chapter.'
  merge: -1
  img_proc: true
- pgno: 41
  md: '# # Managing Your

    # Joomla! Media


    One of the most important tasks when using multimedia in our Joomla! websites
    is the ability to upload and manage the files on your web server. Once uploaded,
    this content may not require further attention, or you might need the ability
    for constant management and file revisions.


    In this chapter, we will look at using the built-in Joomla! Media Manager, as
    well as alternative methods for managing our website media and files. This chapter
    includes:


    +   - Overview of the Joomla! Media Manager

    +   - Uploading media using the Media Manager

    +   - The view

    +   - Organizing your content

    +   - Uploading your content

    +   - Managing media using the Media Manager

    +   - Alternative methods of managing files and media

    +   - Third-party file management extensions'
  merge: -1
  img_proc: true
- pgno: 42
  md: '# Overview of the Joomla! Media Manager


    The Media Manager is a useful file management tool, which is included in the Joomla!
    CMS.


    The Media Manager tool is located within your administration area and can be accessed
    by using the "Quick Link" icon on your Control Panel, or by going to the Menu:
    Site | Media Manager:


    ![](img/0151410972a5c5ea0aab26416e44b1da_42_0.png)


    One of the main purposes of the Media Manager is to easily allow site administrators,
    and frontend users with permissions, the ability to upload and manage files for
    their Joomla! site. In circumstances where you do not have FTP (File Transfer
    Protocol) access to your web server, the media manager might be the only available
    tool with which you can add new images, videos, documents, and other files to
    your website.


    # Uploading media using the Media Manager


    During initial site development, there are usually regular requirements to upload
    new files to your Joomla! site. Depending on the content for your website, this
    process can decrease as you move into the maintenance stages, or stay as a requirement
    for sites which are updated often.


    # Media Manager settings


    As with all software applications, the Media Manager tool contains a set of predefined
    settings. Before using the Media Manager for the first time, it is recommended
    that you take a look at these as they offer the ability to customize media handling
    for your website. Depending on your file requirements, adjusting the media configuration
    settings now may save you time and effort down the line.'
  merge: -1
  img_proc: true
- pgno: 43
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 44
  md: "> If you do decide to use another folder name for your media directory, it\
    \ is important to leave the current `/images` directory on the server as this\
    \ can often be used by other components.\n\n+   - **Path to Image Folder**\n+\
    \     This is generally a path where you put your images for your Joomla! Content\
    \ Articles.\n+   \n+     By default, it is set to `<joomlaroot>/images/stories`.\
    \ You can change this to be what you wish. If you want to access this folder from\
    \ the Media Manager, then make this a subfolder of the \"Media Folder\" previously\
    \ mentioned. For example, `<joomlaroot><mediafoldername>/<imagefoldername>`.\n\
    \n> If you do decide to use another folder name for your image directory, it is\
    \ important to leave the current `/images/stories` directory on the server as\
    \ this can often be used by other components.\n\n+   - **Restrict Uploads**\n\
    +     This feature restricts uploads by user type. The default is set to **Yes**,\
    \ which means that users below the status of a \"Manager\" will only get one folder\
    \ option to upload files into. That folder is your main \"Media Folder\". If you\
    \ set this option to **No**, then users will also be allowed to upload to subdirectories\
    \ within your main media folder.\n\n+   - **Check MIME Types**\n+     This is\
    \ a security feature, and uses MIME Magic or Fileinfo to verify your uploaded\
    \ file types. By checking the MIME file information, you help ensure users don't\
    \ upload malicious files to your site. Further information about **Fileinfo**\
    \ can be found at `http://www.php.net/manual/en/book.fileinfo.php`.\n\n+   - **Legal\
    \ Image Extensions (File Types)**\n+     This is a list of legal image extensions\
    \ that you and other users are allowed to upload to your Joomla! site. The default\
    \ list includes **bmp**, **gif**, **jpg**, and **png** files. Adjust, if you require\
    \ further image extension types."
  merge: -1
  img_proc: true
- pgno: 45
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 46
  md: '# The view


    When you open the Media Manager, one of the initial options available to you is
    the choice of viewing your files and the associated information about them.


    The two options are "Thumbnail View" and "Detailed View".


    +   1. **Thumbnail View**: The first (and default setting) is called Thumbnail
    View. This offers a thumbnail preview of your files and a delete button below
    each file. Thumbnail View is great for a quick scan of your files (especially
    images), as you can actually see the list and a thumbnail icon in front of you.
    This view, however, can be cumbersome when dealing with larger quantities of files.


    ![](img/0151410972a5c5ea0aab26416e44b1da_46_0.png)


    +   2. **Detailed View**: The Detailed View option shows a five column layout.
    This contains additional information about each file. The following information
    is offered in the Detailed View:

    +     - File Preview

    +     - File Name in alphabetical order

    +     - Image Dimensions

    +     - File Size

    +     - Delete option'
  merge: -1
  img_proc: true
- pgno: 47
  md: '![](img/0151410972a5c5ea0aab26416e44b1da_47_0.png)


    It is a simple click to switch between both of these view types. Depending on
    the directory you are in and how many files are contained within this, you may
    find that you often use both of these views.


    # Organizing your content


    By default, the Joomla! Media Manager contains a number of subdirectories which
    will show up in a column to the left of the Media Manager. By clicking on the
    folders in this tree structure, you can show their content in the right-hand section
    of the Media Manager. Navigation through subdirectories in the Media Manager can
    be done using this method, or by clicking on the folders in the right-hand section
    which will also show the contents.


    The organization of your website media content is of utmost importance. Just like
    with your Joomla! Articles, the correct structure of your files can save you time
    and frustration down the line when you want to easily find an image or media file.


    One of the limitations in the current version of the Media Manager is that files
    cannot be moved into other directories. This means that it''s important to get
    your file structure correct at the start of the project, and then files can easily
    be uploaded to their destination.'
  merge: -1
  img_proc: true
- pgno: 48
  md: '# Creating a new directory


    At the top of the Media Manager, you will see a horizontal bar showing the current
    directory location you are in. New directories can be easily created in the Media
    Manager by using the Create Folder, situated to the right of this bar.


    ![](img/0151410972a5c5ea0aab26416e44b1da_48_0.png)


    To make a new directory, first make sure that you are in the directory where you
    wish to create a new folder. Populate the text field to the left of the Create
    Folder button and then click on this button to create your new directory with
    that name.


    The page should reload, showing your new directory in place.


    > A forward slash is already pre-populated, so you only need to enter the name
    of the directory and nothing else.


    Just like with your Joomla! Articles, the better you organize your site files,
    the easier it is to manage these on an ongoing basis.


    # Deleting files


    As with most things, a spring clean regularly can help in keeping things organized
    and efficient.


    If you are not using your files any more or have created newer versions of them,
    then you can easily delete them by clicking on the red "X" icon next to the file
    type:


    ![](img/0151410972a5c5ea0aab26416e44b1da_48_1.png)


    If you wish to delete multiple files at once, then you tick the checkbox next
    to each file, and click on the Delete button in the top-right of the Media Manager.'
  merge: -1
  img_proc: true
- pgno: 49
  md: '# # Uploading your content


    Depending on your "Media Settings" in the Global Configuration, you have the option
    of using two types of upload features in the Media Manager.


    # ## Single file upload


    The default uploader in the Media Manager is the single file upload tool, which
    is located at the bottom of the Media Manager. This tool will allow you to browse
    your local computer for a single file type, and upload this to your web server
    in the directory you have chosen.


    To upload files using this method, first make sure that your destination for the
    file upload is correct. The easiest way to do this is by using the **Folder**
    Directory Menu on the left-hand side, and making sure the directory you want to
    upload your file to is highlighted.


    ![](img/0151410972a5c5ea0aab26416e44b1da_49_0.png)


    To upload a file, click on the **Choose File** button. This will allow you to
    browse your local computer for the file to upload. Once selected, click on the
    **Start Upload** button to upload this file to your chosen directory on your web
    server. The Media Manager will refresh once the file is uploaded and you should
    see your new file inside your selected directory.


    ![](img/0151410972a5c5ea0aab26416e44b1da_49_1.png)'
  merge: -1
  img_proc: true
- pgno: 50
  md: 'Managing Your Joomla! Media


    # Multiple file uploads


    If you have enabled the "Enable Flash Uploader" option in your Global Configuration
    Media Settings, then you should be able to benefit from the Flash based upload
    feature.


    Like the single file feature, the multiple file Flash uploader is also located
    at the bottom of the Media Manager.


    ![](img/0151410972a5c5ea0aab26416e44b1da_50_0.png)


    To upload multiple files, first make sure that the directory you wish to upload
    to is highlighted. Click on the **Browse Files** button and browse your local
    computer for a file. Repeat this process until you have a list of the files you
    wish to upload. Click on the **Start Upload** button to upload the files.


    The process will show the status of each file upload.


    > At the time of writing this book, Flash 11s security settings have broken the
    built-in Joomla! Media Manager Flash Multi-file upload tool. This may be addressed
    in future releases of Joomla! However, the single file upload feature is the stable
    upload tool to use at present.


    # Managing media using the Media Manager


    As mentioned earlier in this chapter, the necessity for good organization of your
    site content is very important.


    Analyzing your project requirements at the start may save you hours of work in
    the future. A defined directory structure and clear descriptions of these folders
    can be very helpful for not only your own management, but for other administrators
    and users who may be uploading files to the site server. Even the default `<joomlaroot>/images/stories`
    structure can become challenging at times; now, did I put it in the /images folder
    or was it the /images/stories folder?'
  merge: -1
  img_proc: true
- pgno: 51
  md: '![](img/0151410972a5c5ea0aab26416e44b1da_51_0.png)


    The built-in Media Manager is a wonderful tool for Joomla! administrators. In
    fact if you have a Joomla! website that has been built by someone else, then this
    may be your only tool for uploading new files to your web server.


    So we agree that it''s a cool tool; one, which can limit file types and allow
    you to create directories and upload files, but unfortunately one that is simplistic
    and has its limitations. One of these drawbacks is the lack of ability to move
    files about once they are uploaded.


    Remember, we can create as many subdirectories as we wish (under our main media
    directory). So the trick is to analyze your site purpose at the start of the project,
    and set up these directories accordingly, which will save you time and frustration
    down the line. If your site is already established with files and links to these,
    then the job will certainly become more time consuming to do. A spring clean of
    the established site is possible though, and will require new directories to be
    created, files moved into these, and content and links checked to make sure they
    go to the correct destination.


    # Alternative method of managing files and media


    Depending on your circumstances, you may or may not have login access to your
    web hosting server. If you do not, then one of your only options for uploading
    files will be to use the Joomla! Media Manager, or the option of third-party Joomla!
    Extensions.


    If you do have web server access, then by using a method called FTP (File Transfer
    Protocol), you will be able to gain greater control over your file management.'
  merge: -1
  img_proc: true
- pgno: 52
  md: 'FTP is a standard network protocol that is used to exchange and manipulate
    files over a computer network. A common use of FTP is to transfer files over the
    Internet between a local computer and a web server, which is exactly what we are
    after!


    # FTP clients


    There are numerous FTP clients (programs) that can be used to transfer files.
    Some of these graphically show the file and transfer processes, making the management
    of your files from your computer to your web server very easy to do.


    # FTP programs


    FTP programs range from no cost applications through to commercial software. Which
    one you choose to use will be down to personal preference. Most of these programs
    provide drag and drop features as well as easy directory navigation tools:


    ![](img/0151410972a5c5ea0aab26416e44b1da_52_0.png)'
  merge: -1
  img_proc: true
- pgno: 53
  md: 'There are excellent FTP programs for all major operating systems. Some popular
    options for Windows and Mac are:


    +   - Windows

    +     - FileZilla

    +     - CuteFTP

    +     - SmartFTP

    +     - WS_FTP

    +     - cURL

    +   - Mac

    +     - FileZilla

    +     - Transmit

    +     - Cyberduck

    +     - CuteFTP

    +     - Fetch

    +     - FTP Command in Terminal


    If you perform a search using a popular search engine, you will obtain a definitive
    list of FTP programs. A suggestion would be to download a trial version of these
    to see which one suits your operating system and requirements.


    For the purpose of this topic, I have chosen to use and take screenshots from
    an FTP program called "Transmit". It is a commercial product, but personally one
    of my favorites. For those whose use MAC computers, Transmit is recognized as
    a wonderful FTP tool.


    # Connecting using an FTP program


    Almost all FTP programs require similar information in order to connect to the
    web server. Depending on the program you are using, the naming of these fields
    may be slightly different.


    In order to connect, we need the following information which is usually derived
    from setting up a user account (with FTP permissions) on your web hosting control
    panel:


    +   1. **Server**

    +      This is the server address that you wish to connect to. Typically this
    can look like `ftp.yourserver.com`. Depending on the domain name settings, it
    can sometimes be your domain name, such as `www.yourserver.com`.'
  merge: -1
  img_proc: true
- pgno: 54
  md: '# 2. User Name


    This is your web server account username. Often this can be in the format of yourusername@yourdomain.com.


    # 3. Password


    This is your web server account password.


    # 4. Initial Path


    Some programs offer the ability to set an initial directory to navigate to upon
    login. If you do not have this option, then do not worry.


    # 5. Port


    If the server requires connections on a port other than the default one, some
    programs offer you the ability to enter in a port number. It is best to leave
    this as the default setting unless you know what you are doing.


    ![](img/0151410972a5c5ea0aab26416e44b1da_54_0.png)


    If you are having any issues connecting, then it''s best to contact your web hosting
    administrator in order to check your login access details.


    There are typically three types of FTP login methods available. These are:


    # 1. Anonymous FTP access


    This is an easy connection method as you do not need to include any user information.
    Sometimes software companies offer updates or corporate and government websites
    offer forms and content to be downloaded via an anonymous connection method.'
  merge: -1
  img_proc: true
- pgno: 55
  md: '+   2. **Username**

    +   A simplified but restricted access level where you will be required to enter
    just a username. This type of FTP login is often used in school and intranet environments.


    +   3. **Username and Password**

    +   This is a more restricted security access level where the user requires both
    a username and password in order to access the server. This method is often used
    by web hosting companies who offer people the ability to upload files to the web
    server.


    If your FTP connection is set to username (or username and password), then you
    should see a dialog box on the screen. This will prompt you to enter your security
    access details:


    ![](img/0151410972a5c5ea0aab26416e44b1da_55_0.png)


    Once connected, you will need to navigate to your webroot folder. Depending on
    your web server, this area may be named httpdocs, mainwebsite_html, public_html,
    or other naming conventions. It will be inside this directory where your Joomla!
    website files will reside.'
  merge: -1
  img_proc: true
- pgno: 56
  md: 'When you have located your main http documents area and clicked to navigate
    inside this, you will see the default Joomla! media folder named images.


    ![](img/0151410972a5c5ea0aab26416e44b1da_56_0.png)


    When you have successfully navigated to your remote main media folder (or any
    of the subfolders within this), you will need to make sure that you also navigate
    locally to the folders or files you wish to upload. Most FTP programs offer you
    the ability to create new directories, and drag and drop files from your local
    computer to the web server.


    By using an FTP program, you can gain additional control over your website files
    and content.


    FTP programs can allow you to:


    +   - Create files and directories

    +   - Rename files and directories

    +   - Move files and directories

    +   - Delete files and directories

    +   - Set file and directory permissions


    > FTP programs offer you the most flexibility in managing your website files,
    but it is important to take care when using FTP programs. By connecting to your
    directory structure on the web server, you are navigating amongst core Joomla!
    files.


    # FTP via a web browser


    In addition to browsing the World Wide Web, modern web browsers are comprehensive
    internet tools containing additional features such as RSS readers, the ability
    to use e-mail, and work with FTP.'
  merge: -1
  img_proc: true
- pgno: 57
  md: 'Although you can use dedicated FTP programs as we have covered, it''s easy
    to connect to FTP servers using a typical web browser such as Firefox or Internet
    Explorer.


    For the purpose of this example and screenshots, we will be using Mozilla Firefox.


    # Connecting to FTP via a web browser


    There are some cases where web browser FTP access can be restricted by organizations,
    but in general, if you can use an FTP program to connect to your web hosting server,
    then you should be able to connect via FTP using your web browser.


    The benefits of using a web browser are: Well... it''s free and you probably already
    have it in front of you!


    As when using an FTP program to connect, there are typically three types of FTP
    login methods available. These are:


    +   1. **Anonymous FTP access**

    +   Authentication methods for FTP via a web browser are the same as when using
    a software-based FTP program.

    +   2. **Username**

    +   A simplified but restricted access level where you will be required to enter
    just a username. This type of FTP login is often used in school and intranet environments.

    +   3. **Username and Password**

    +   This is a more restricted security access level where the user requires both
    a username and password in order to access the server. This method is often used
    by web hosting companies, who offer people the ability to upload files to the
    web server.


    There are usually two methods of connecting to FTP via a web browser. These are:


    +   1. **Enter an FTP address into the address bar**

    +   For most web browsers that offer FTP support, it is possible to type in the
    syntax: `ftp.yourserver.com` or sometimes `ftp.yourdomainname.com`, and then press
    *Enter*.'
  merge: -1
  img_proc: true
- pgno: 58
  md: 'If your FTP connection is set to **Username** (or **Username** and **Password**),
    then you should see a dialog box on the screen. This will prompt you to enter
    your security access details:


    ![](img/0151410972a5c5ea0aab26416e44b1da_58_0.png)


    If you are having any issues connecting, then it''s best to contact your web hosting
    administrator in order to check your login access details.


    Once connected, you will need to navigate to your webroot folder. Depending on
    your web server, this area may be named httpdocs, mainwebsite_html, public_html,
    or other naming conventions. It will be inside this directory where your Joomla!
    website files will reside.


    +   2. **Entering directly into the address bar**


    The second method of connecting via FTP in a web browser is to enter the user
    information directly into the address bar. Although this can save you a step,
    I often find that users can make mistakes using this method, taking them longer
    than the previous connection method.


    Different browsers may have slightly different syntax, but when using Mozilla
    Firefox you would enter something similar to the following directly into the address
    bar:


    ```

    ```

    http://username: password@yourserver.com

    ```

    ```


    For example, if my username was john and my password was 12345, then that would
    look like: ftp:john: 12345@yourserver.com.


    Quite often the username can contain the domain name. If this is the case, the
    syntax would look like: ftp:john@yourserver.com: 12345@yourserver.com.'
  merge: -1
  img_proc: true
- pgno: 59
  md: '# Uploading and downloading


    Once you are connected to FTP by a web browser (by either of the previous methods),
    the uploading and downloading of files is usually quite intuitive.


    ![](img/0151410972a5c5ea0aab26416e44b1da_59_0.png)


    To upload a new file, make sure you are residing in the correct remote directory
    for upload. Browse to a file on your computer and simply drag this file over into
    your web browser. Depending on the size of the file, this might take some time
    to upload and then the process should complete. You can download a file in a similar
    manner, or you might need to double-click on the file to start downloading it.


    # Web browser plugins


    A number of popular web browsers offer you extension plugins, which can enhance
    the FTP capabilities when using the browser connection method.


    The Firefox web browser has a useful extension called FireFTP. This plugin offers
    you a left and right view to easily manage and move files via FTP using your web
    browser. FireFTP is just like having a stand alone FTP program on your computer.
    It''s free to use and works on Windows, Mac, and Linux. More information about
    FireFTP can be found by visiting http://fireftp.mozdev.org/.'
  merge: -1
  img_proc: true
- pgno: 60
  md: 'The following screenshot shows the FireFTP plugin:


    ![](img/0151410972a5c5ea0aab26416e44b1da_60_0.png)


    It is important to mention that, if you are performing regular file uploading,
    then using a specialist FTP browser plugin or FTP program will offer you additional
    features and make life easier for you. Usually you can save your favorite connections,
    so you can login to your web server with a few clicks.


    With lots of free FTP programs available now that provide the options for file
    moving, renaming, and in some cases server-to-server file movement, there is no
    reason why you should not be using one of these if you have FTP server access
    and perform regular transfers.


    # SFTP


    Secure FTP (SFTP) is a program that uses SSH to transfer files. SFTP encrypts
    both the commands and data being transferred, creating a secure connection between
    your computer and the remote server. You can use SFTP via an SFTP client, or the
    command line. Most FTP clients do offer SFTP support, but not all web hosts support
    SFTP, so it will pay to check with yours before trying to use this transfer method.'
  merge: -1
  img_proc: true
- pgno: 61
  md: '# Third-party file management extensions


    For the majority of users, the Joomla! Media Manager or using FTP will be more
    than enough to manage media between your computer and your Joomla! website. A
    number of file management extensions are also available in the http://extensions.joomla.org
    area. Some of these provide enhanced file uploading features, and others provide
    the abilities of an FTP program located within our Joomla! Administration.


    Listed below are two popular extensions that provide an administrator with file
    management capabilities within the Joomla! Administration.


    > There are also a number of excellent Document Management and Download Extensions
    to offer frontend document sharing and management. As mentioned earlier, for further
    file management extensions, visit http://extensions.joomla.org to see the available
    extensions.


    # eXtplorer


    eXtplorer is a third-party file management application which runs natively under
    Joomla! 1.0 x and 1.5 versions. eXtplorer easily installs as a Joomla! component,
    but a requirement is to run in legacy mode for Joomla! 1.5.


    You can use eXtplorer to access and modify files and directories on your server
    via FTP or direct file access. Rather than firing up an FTP client, using an extension
    like this can perform powerful file management actions from the backend of your
    Joomla! Administration:


    ![](img/0151410972a5c5ea0aab26416e44b1da_61_0.png)'
  merge: -1
  img_proc: true
- pgno: 62
  md: '# Joomla! Flash Uploader


    Joomla! Flash Uploader is similar to the built-in Media Manager Flash uploader,
    but this extension contains extended features. It does not seem affected by the
    same issues that the Joomla! Media Manager Flash upload tool currently receives
    due to Flash security settings. This extension allows you to upload multiple files
    easily from your desktop to your Joomla! web directories. One nice feature of
    this extension is the ability to create "Upload Profiles" for your website users.
    This means you can give different website users different directories to upload
    to if you wish—a handy feature for larger sites requiring additional control over
    user uploading.


    ![](img/0151410972a5c5ea0aab26416e44b1da_62_0.png)


    # Summary


    Good organization and structure of your website media is as important as it is
    to Joomla! Articles.


    When your project is in the development stage, you should review and customize
    the Media Settings for your project, as well as define usable directory structures,
    which will make file management a simplified task.


    Using the built-in Joomla! Media Manager is a great way for administrators (and
    frontend users with permission) to create directory structures and easily upload
    files from their local computer to the web server. Once uploaded, files can then
    be used in Joomla! Articles and in Components and Modules.


    For developers (and site users with additional access to the server), the use
    of FTP is a powerful way to manage your files and site content, allowing you the
    ability to move and manipulate files, and gain access to other areas of your Joomla!
    file structure.'
  merge: -1
  img_proc: true
- pgno: 63
  md: '# 3


    # Text, Characters, and Fonts

    in Your Joomla! Site


    Some may ask, why is a chapter about text and fonts being included in a book about
    multimedia?


    The answer is quite straightforward: Text (and the styling of it) is one of the
    most prominent media types that has been, and is still, used in web pages. Although
    it''s such a major media element, web developers often pay little attention to
    this subject.


    In this chapter, we will highlight the use of fonts, characters, and text within
    your Joomla! site, and how we can not only change the site design by using another
    font typeface, but also affect your site user''s overall experience by doing so.


    Topics include:


    +   - Overview of text, characters, and fonts

    +   - Fonts and their effect on website users

    +   - Which font is best to use?

    +   - Joomla! Templates and Cascading Style Sheets (CSS)

    +   - Alternative methods to use custom fonts in your web pages

    +   - Joomla! text and typography extensions

    +   - Browser support and accessibility around fonts'
  merge: -1
  img_proc: true
- pgno: 64
  md: '# # Overview of text, characters, and fonts


    Text, and the use of it, is one of the largest contributions to most website pages.
    Text and characters are used to communicate and deliver information to the reader.
    When large blocks of text are displayed, it is important that it is styled to
    visually please the reader, as well as being easily readable.


    **Plain Text** is a term, which is used to describe text that does not contain
    attributes such as fonts and styling. It is readable by almost all computer programs.
    In one respect, HTML code, CSS, and XML files are all plain text, but they also
    contain structural tags included with the characters.


    A **Character** is a symbol. It can be a letter, a digit, or a punctuation mark,
    as well as a range of other informative symbols. Characters represent units of
    information.


    A **Font** (also fount) is traditionally defined as "a complete character set
    of a single size and style of a particular typeface".


    In the early days of the Web there was plain text on screens. This text could
    only have one style applied to it, making most web pages look very similar in
    text formatting, such as this screenshot of an early web page designed by Tim
    Berners-Lee in 1991:


    ![](img/0151410972a5c5ea0aab26416e44b1da_64_0.png)


    In general, the fonts that were used on computer devices (for screen viewing)
    were usually transpositions of popular offline printing styles, for example those
    for printed books. In early web pages, there were only a small number of typefaces
    available for use. The one main typographic constant that was used was a font
    called "Times New Roman" (for Windows), and "Times" (for MAC). These early computer
    typefaces were almost always members of the serif font family (or serified fonts).'
  merge: -1
  img_proc: true
- pgno: 65
  md: 'Serif fonts are an imitation of hand written characters, and their style is
    usually enriched by (calli) graphic embellishments. A serif is a flick added to
    the tips of the lines that make up the character. An example of a serif font typeface
    (Times New Roman) is as follows; note the serifs (flicks) on each character:


    ![](img/0151410972a5c5ea0aab26416e44b1da_65_0.png)


    The five main font families are:


    +   1. Serif

    +   2. Sans-serif

    +   3. Cursive

    +   4. Fantasy

    +   5. Monospace


    Next to "Serif" another popular font family is sans-serif or sans serif. A sans-serif
    typeface is one that does not contain the small character embellishments (serifs)
    at the end of the strokes. The term comes from the French word "sans", meaning
    "without".


    Sans-serif fonts have now become the de-facto standard typeface for general body
    text that is viewed on screens. This is partly due to screen resolutions not being
    able to show the (serif) embellishments clearly, and a number of fonts residing
    in the "sans-serif family" have been created especially for screen view, such
    as the following example called "Helvetica". This having been said, do not write
    off fonts in the "serif" family, as these are also popular web font options.


    ![](img/0151410972a5c5ea0aab26416e44b1da_65_1.png)


    Many tests have been performed regarding usability of typefaces residing within
    these font families, especially when they are delivered on computer screens. With
    the characters having to fit a relatively small pixel grid on screens, it is considered
    by designers that sans-serif fonts lend themselves more naturally to being digitized
    for screen view.'
  merge: -1
  img_proc: true
- pgno: 66
  md: 'Fonts have been a popular method of stylizing plain text for centuries. You
    may be surprised to know that a number of the fonts installed on your computer
    will be older than you think. For example, Wikipedia quotes that the serif font
    "Times New Roman" was commissioned by the British newspaper "The Times" in 1931
    and "Helvetica" first made its debut in 1957.


    # # Fonts and their effect on website users


    One of the most important (and often overlooked) area of web design is the use
    of text sizing and font choice. Many inexperienced designers fail to realize the
    effect these can have on the visitor''s initial experience on their site pages.
    This in turn may cause a great effect on traffic conversions and the bounce rate
    of your site visitors.


    Of course, the language you use throughout your website needs to be informative,
    make sense, and be of interest to your visitors. However, if this "wonderful content"
    is wrapped in a text size that is too large or small, and your users find it difficult
    to read, then those users are likely to leave your site and not return again.
    Equally, if you have given thought and consideration to your text sizing and font
    style, then this may help improve the duration your visitors stay on your site
    pages and possibly their return rate.


    ![](img/0151410972a5c5ea0aab26416e44b1da_66_0.png)


    Preferences for visual appearance will always vary from person to person and the
    readability of a typeface may determine its appropriate use on a particular audience.
    Each typeface will produce some form of visual emotion to the user, and some fonts
    can portray a "take me seriously" emotion, while others a "relaxed" feeling while
    reading the text.


    If you were going for a job interview, you might take time to dress up accordingly
    for the job-role. Presentation is everything; and the same goes for the typefaces
    used in your web pages. Typefaces attract attention; they set a tone and emotion
    to the text they embellish. Change your typeface and you can go from creating
    a casual feeling in your web pages to a formal one, unorganized to stylish, old
    fashioned to modern, and so on.'
  merge: -1
  img_proc: true
- pgno: 67
  md: 'Typefaces are here to serve the text. They should be easy to read (especially
    when used in body text) and create a subtle style that does not overpower the
    reader. A number of font websites categorize their fonts into useful groups. If
    you would like assistance in choosing a font for your website, take a look at
    the font assistance tool at http://www.esperfonto.com/.


    # Which font is best to use?


    When it comes to typefaces and fonts, there are plenty to choose from. A search
    for "fonts" in a popular search engine gave me 50,500,000 results and easily over
    100,000 different typefaces were available.


    Before you go out and buy a new hard drive to install all of these fonts, it is
    important to note that there are only a few fonts which are actually classed as
    easily readable fonts to use for the Web. These are fonts that are available on
    most computer operating systems and actually look good (as well as being easily
    readable) when viewed on screen.


    If you are a designer, then you will probably have the web safe, major font groups
    installed on your computer. These typefaces would have been included in your computer
    when it was purchased. By visiting some of the popular font download sites, you
    could go ahead and install lots of additional typefaces. However, there is no
    point in specifying these interesting and custom typefaces on our websites, if
    the end user viewing the site doesn''t have these fonts also installed on their
    computer. Without the same font available they won''t see what we see. Hence,
    when choosing your font typeface we need to choose from a list of "Popular font
    families", in order to reach the majority of our site users.


    The subject of "What font is best for the Web?" is an intriguing and long-winded
    one. Remember, it''s best to play it safe for your body text and use one of the
    following popular choices:'
  merge: -1
  img_proc: true
- pgno: 68
  md: '# ## Sans-serif fonts


    The fonts in this family are as follows:


    # ### Verdana


    Verdana was designed by Microsoft in 1996. Its purpose was specifically for screen
    use. The absence of serifs and the wide spacing make this font a popular choice
    for the Web.


    ![](img/0151410972a5c5ea0aab26416e44b1da_68_0.png)


    # ### Arial and Helvetica


    Helvetica (for MAC) and Arial (for MAC and Windows) is a common font style created
    over 50 years ago by Swiss designers. Although two different fonts, they are similar
    in properties with Arial being created by Microsoft as their version of the style.
    Arial and Helvetica are one of the most widely used sans-serif fonts.


    ![](img/0151410972a5c5ea0aab26416e44b1da_68_1.png)


    # ### Trebuchet MS


    Trebuchet MS was developed for screen use and is common on Windows and MAC systems.
    It is popular for large headings and some consider it not quite as legible as
    Verdana for normal size print. It''s best to try it out and see what you think!


    ![](img/0151410972a5c5ea0aab26416e44b1da_68_2.png)


    # ### Lucinda Sans family


    Lucinda Sans Unicode (Windows) and Lucinda Grande (MAC) were not created for the
    Web, but are remarkably legible when reading on screen. Lucinda Grande is the
    font choice used on MAC operating systems. They are considered the most calligraphic
    of typefaces within the sans-serif family.


    ![](img/0151410972a5c5ea0aab26416e44b1da_68_3.png)'
  merge: -1
  img_proc: true
- pgno: 69
  md: '# # Serif fonts


    The fonts in this family are as follows:


    # ## Times New Roman / Times


    Times New Roman (Windows and MAC) and Times (MAC) are primarily an offline print
    based font that is approximately 80 years old now. It is not the best font for
    screens but often a good second choice in your CSS file because it is such a prevalent
    computer font.


    ![](img/0151410972a5c5ea0aab26416e44b1da_69_0.png)


    # ## Georgia


    Georgia is a font commissioned by Microsoft; again it was made especially for
    the screen. Although a serif font, Georgia tends to work well for screen viewing
    of small and larger text. Designers often substitute Times New Roman with this
    font due to its preferred web viewing properties.


    ![](img/0151410972a5c5ea0aab26416e44b1da_69_1.png)


    # ## Palatino Linotype / Palatino


    Palatino Linotype (Windows) and Palatino (MAC) were developed over 60 years ago
    and are not screen fonts, but they render very well for web use. Microsoft distributed
    a clear imitation of this font; they called it "Book Antiqua".


    ![](img/0151410972a5c5ea0aab26416e44b1da_69_2.png)


    The previous typefaces are recommended fonts to use for your main body text. However,
    there are methods for being able to show fancy custom fonts in your web pages,
    allowing all of your site users to view them without the need to install the fonts
    on their system.'
  merge: -1
  img_proc: true
- pgno: 70
  md: 'If you are looking for examples of what various fonts look like on your screen,
    take a look at the TYPETESTER online tool at http://www.typetester.org/. This
    type tool allows you to include your custom text, and then format this with a
    variety of font and size options, viewing the output on your screen. There are
    many tools available that do this, but TYPETESTER is a great example of them:


    ![](img/0151410972a5c5ea0aab26416e44b1da_70_0.png)


    # # Joomla! Templates and Cascading Style Sheets


    Before we launch into adjusting our Joomla! CSS font, it is important to include
    a brief introduction regarding Joomla! Templates.


    # ## What is a Joomla! Template?


    A Joomla! Template is a set of files which control the presentation of your website
    content. Templates are packaged with a "formal file structure", meaning that they
    have certain requirements in order to work with Joomla! Each Template file plays
    a vital part in producing your final website design, its structure, and your site
    pages'' interactive features.'
  merge: -1
  img_proc: true
- pgno: 71
  md: 'Joomla! Templates are usually packaged up in a zipped format and installed
    using the built-in Joomla! upload / unzip feature. They come in all shapes and
    sizes and are designed in such a way that when they are installed and activated,
    they will display your Joomla! content with their designated structure and design:


    ![](img/0151410972a5c5ea0aab26416e44b1da_71_0.png)


    Using templates has a number of benefits, including:


    +   - A new template can be applied instantly to your website content. This flexibility
    means a completely different design may be given to your website with little effort.

    +   - Multiple styles can be applied to your website by using a number of templates.
    If you are looking to provide different design layouts to different areas of your
    CMS, then this is an important feature.

    +   - The template contains all CSS and website styling. This is all self-contained
    and can include overrides. By going into your "Templates area", you can easily
    make adjustments to your current template, and include custom changes into this
    folder, protecting the "Core Joomla! Framework".


    An important styling element of a Joomla! Template is the CSS. These .css files
    contain important layout and style information, which contributes to your Joomla!
    website design.


    # Template CSS


    Cascading Style Sheets are a web developer''s best friend! They provide us with
    the opportunity to be completely consistent with our site styling, and provide
    additional layout and design options than plain HTML usage can offer.'
  merge: -1
  img_proc: true
- pgno: 72
  md: "Before CSS was used, nearly all of the styling in an HTML document was contained\
    \ in the HTML code. Color, layout, styling, fonts, among others had to be specifically\
    \ listed in the code, often repeatedly throughout the HTML document:\n\n```\n\
    <html>\n<body>\n<p><font size=\"2\" face=\"Verdana\">\nThis is a paragraph of\
    \ text.\n</font></p>\n<p><font size=\"5\" face=\"Times\" color=\"red\">\nThis\
    \ is another paragraph.\n</font></p>\n</body>\n</html>\n```\n\nHere text is styled\
    \ using an older HTML method, where the styling is within the HTML code.\n\nBy\
    \ using a CSS method, it allows us to put most of this styling information into\
    \ a separate document (.css file). This information can be referenced in the HTML\
    \ easily, resulting in a more efficient process and considerably simpler HTML\
    \ code.\n\nThe HTML code is as follows:\n\n```\n<html>\n<body>\n<p>This is a paragraph\
    \ of text.</p>\n</body>\n</html>\n```\n\nThe CSS code is as follows:\n\n```\n\
    p {\n    font-family:Helvetica ,Arial,sans-serif;\n    font-size: 1em;\n    color:\
    \ #000000;\n    text-align: left;\n    width: 100%;\n}\n```\n\nThe previous HTML\
    \ and CSS code shows the styling of a p tag.\n\nCSS information can be embedded\
    \ into the HTML document, but for a Joomla! Template it is usually included in\
    \ a separate document. Quite often Joomla! Templates contain multiple CSS files\
    \ to separate the design elements. When using CSS, a separate stylesheet for a\
    \ handheld device may be used to accommodate the"
  merge: -1
  img_proc: true
- pgno: 73
  md: "smaller screen resolution, a custom stylesheet could be used just for the Internet\
    \ Explorer 6 browser, and so on. Your Joomla! Template can contain coding to tell\
    \ the browser what stylesheet to load in, depending on what type of appliance\
    \ the user is viewing your website with.\n\n![](img/0151410972a5c5ea0aab26416e44b1da_73_0.png)\n\
    \nThe Joomla! Template CSS file is usually located in the following directory\n\
    `/templates/yourtemplate/css/template.css`. If you are using a pre-built Joomla!\
    \ Template, you may see multiple CSS files inside the CSS directory. It is important\
    \ to note that the names of these CSS files may differ between Joomla! Templates,\
    \ but the `template.css` file is the standard naming convention for the main CSS\
    \ file. Certain WYSIWYG editors rely on this naming convention to work correctly.\n\
    \nWe could devote a whole book to the complexities of CSS. For this chapter, however,\
    \ we are just going to highlight the font property, and its available values.\n\
    \n# CSS font properties\n\nLet's take a look at the numerous properties we can\
    \ manipulate the text with when using CSS:\n\n# Font family\n\nThe font family\
    \ property is a prioritized list of font names for an element. It is possible\
    \ (and good practice) to specify more than one font typeface in case the user\
    \ does not have the font you are specifying loaded on their computer system. In\
    \ CSS, your browser will use the first font that it recognizes; hence we always\
    \ list our font families in a priority order:\n\n```\nbody {\n    font-family:\
    \ Arial,Courier,sans-serif;\n    line-height: 1.3em;\n    margin: 0px;\n    font-size:\
    \ 12px;\n    color: #333;\n}\n```"
  merge: -1
  img_proc: true
- pgno: 74
  md: "In the previous example, the font Arial will be used ahead of the font Courier.\n\
    \nThere are two types of font-family values:\n\n+   1. **Family Name**\n+    \
    \  The name of the font typeface. For example: Helvetica, Courier, Arial.\n+ \
    \  2. **Generic Family**\n+      The name of one of the five generic font categories.\
    \ For example, serif, sans-serif, and so on.\n\nIn a Joomla! Template CSS file,\
    \ the font family is usually applied to the body tag. This specifies a main font\
    \ to be used for your website body text. If you require additional styling to\
    \ other Joomla! text elements, then we define those accordingly using further\
    \ CSS.\n\n```\nbody {\n    font-family: Arial,Helvetica,sans-serif;\n}\n```\n\n\
    In the previous example, the browser will look for the font Arial, then Helvetica,\
    \ and if for some unknown reason the user didn't have those fonts installed on\
    \ their computer device, then the browser would substitute an available sans-serif\
    \ font to use.\n\nWhere you use font families having more than one word in the\
    \ name, it is important to surround these font names with double quote marks.\
    \ While some browsers can read these fonts without the quote marks, problems can\
    \ occur if the white space in between the words is considered or ignored.\n\n\
    ```\nbody {\n    font-family: Arial,\"Times New Roman\",sans-serif;\n}\n```\n\n\
    Note the Times New Roman in quotation marks.\n\n# Font size\n\nThe font size property\
    \ in CSS sets the size of your text. Font sizing methods that you can utilize\
    \ in CSS can either be of absolute (fixed), or relative size.\n\n+   1. **Absolute:**\n\
    +      - Sets the text to a specific size\n+      - Absolute sizing is useful\
    \ if a fixed output or container is known. Using this method you can get the text\
    \ to sit exactly as you wish into that defined area."
  merge: -1
  img_proc: true
- pgno: 75
  md: '+   - Does not allow the user to adjust the text sizing in some browsers. For
    this reason it is considered poor for accessibility.


    # 2. Relative:


    +   - Allows the user to change their text size in all browsers.

    +   - The font size is based off the default font setting in the browser. The
    user can change this default value if they wish.

    +   - Sets a size of the text that is relative to the surrounding elements.


    The debate regarding which method to use is as on-going as which font typeface
    is best for the screen. Specifying in pt or px (absolute methods) has been classified
    as non-W3C accessible, but allows you to style text in a confined container with
    more design control. If the layout of your text is important, then you may require
    this styling method to align your text as you wish.


    If text can just spill out on the page and be resized by the user if required,
    then relative is the preferred and accessible method of managing font size. Relative
    sizing can be done using em measurement or % (percent).


    As a general rule:


    ```

    1em = 16px = 12pt = 100%

    ```


    # Meet the units


    In CSS there are four different units with which we can measure the size of the
    text as it is displayed in the web browser.


    # Setting the text size using em


    To cater for all browsers and retain accessibility standards on your website,
    most designers are trying to adopt the em relative text sizing method. This is
    the preferred text resizing method by the W3C standards.


    The way em sizing works is: 1em is equal to the current font size of the element
    in question. If you have not set a font size in other areas of your CSS, then
    it will take the user''s default browser font size. The default text size in browsers
    is 16px, and usually a font such as Arial font or Times. This means the default
    size of 1em = 16px. If you were to set a font size for the body, say 18px, then
    1em = 18px.'
  merge: -1
  img_proc: true
- pgno: 76
  md: "For general body text, you may see something similar to this Joomla! CSS file:\n\
    \n```\nbody { \nfont-family: Helvetica, Arial, sans-serif; \nline-height: 1.3em;\
    \ \nmargin: 0px 0px 0px 0px; \nfont-size: 12px; \ncolor: #333;\n}\n```\n\nOnce\
    \ the main body text font size has been specified, as in the previous example,\
    \ other text elements in your CSS can then be set relative to this using ems:\n\
    \n```\nh2, .contentheading { \npadding: 0; \nfont-family: Arial, Helvetica, sans-serif;\
    \ \nfont-size: 1.4em; \nfont-weight: normal; \nvertical-align: bottom; \ncolor:\
    \ #333; \ntext-align: left; \nwidth: 100%;\n}\n```\n\n# Setting the text size\
    \ using percent\n\nSizing using percentages works, as you would probably expect\
    \ a percentage to work. Just like ems, using a percentage styling method is relative.\n\
    \nIf the parent item has a font size of 24px, and the child has a percentage of\
    \ 50%, then it will be displayed with font size of 12px.\n\nJust like ems, one\
    \ popular technique for sizing using percentages is to set a parent font size\
    \ on the body of your CSS, and then use percentages for all other styling. Everything\
    \ will be relative to that one parent size which is set:\n\n```\n.tool-text {\
    \ \nfont-size: 95%; \nmargin: 0;\n}\n```"
  merge: -1
  img_proc: true
- pgno: 77
  md: "# Setting the text size using pixels\n\nPixels are fixed size units that are\
    \ used in screen media. One pixel is equal to one dot on your screen and when\
    \ using pixels to size your text you are telling the browsers to render the text\
    \ exactly that number of pixels high. Using pixels to define our text size provides\
    \ us with excellent control over the size and layout of the text. Using pixels,\
    \ however, does not allow the ability to scale upwards for visually impaired users,\
    \ nor scale downwards for mobile devices.\n\nSizing your text using pixels will\
    \ allow browsers such as Firefox and Safari to still retain some text control,\
    \ but when viewing with Internet Explorer 6 the user will not be able to resize\
    \ this absolute styled text. All in all, setting font sizes with px is an accurate\
    \ method, but do take into consideration the IE 6 lack of accessibility.\n\n#\
    \ Setting the text size using points\n\nThe unit of points (pt) is usually associated\
    \ with print media. Points are much like pixels in that they are of fixed size\
    \ and cannot be scaled to size. Just like pixels are accurate for screen resolutions,\
    \ points are accurate on paper.\n\n```\n72pts = one inch\n```\n\nIt is not good\
    \ practice to use pt styling for your Joomla! Template CSS, but it would be good\
    \ to use points when creating a separate print.css stylesheet.\n\nAn example of\
    \ print CSS may look like:\n\n```\nbody {\n  color : #000000;\n  background :\
    \ #ffffff;\n  font-family : \"Times New Roman\", Times, serif;\n  font-size :\
    \ 12pt;\n}\n```\n\n# Font style\n\nThe \"font style\" property sets the style\
    \ of your specified fonts.\n\nThe values are:\n\n+   - **Normal**\n+     The browser\
    \ will display a normal font style\n+   - **Italic**\n+     The browser will display\
    \ an italic font\n+   - **Oblique**\n+     The browser will display an oblique\
    \ font"
  merge: -1
  img_proc: true
- pgno: 78
  md: "When written down in the CSS, the font-style property may look like this:\n\
    \n```\nbody {\n  font-style: italic;\n}\n```\n\n# Font weight\n\nThe font weight\
    \ property sets the width of the font. For example, how thick or thin the text\
    \ should be displayed.\n\nThe values are:\n\n+   - **Normal**\n+     Defines normal\
    \ characters\n+   - **Bold**\n+     Defines thick characters\n+   - **Bolder**\n\
    +     Defines thicker characters\n+   - **Lighter**\n+     Defines lighter characters\n\
    \nYou can also use the values: 100-900.\n\nThis method defines thick to thin characters\
    \ and offers a further level of control. As an indication, the value 400 is the\
    \ same as normal, and the value 700 is the same as bold.\n\n```\np\n{\n  font-weight:\
    \ bold;\n}\n```\n\nUsing CSS, it is possible to define each of the font properties\
    \ within your document, or you can define all of the values into one shorthand\
    \ property. This is called simply font.\n\nThe \"font\" property in CSS can include\
    \ the \"line-height\" value. This element allows you to set the space between\
    \ the text lines:\n\n```\np\n{\n  font: italic bold 900 12px/14px arial;\n}\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 79
  md: '# Alternative methods to use custom fonts in your web pages


    So, we really like a specific font and wish to use this for our menu or heading,
    but we know that the reader won''t have this installed on their computer system.
    What can be done?


    One of the most popular methods is to use images in place of the text. By using
    an image method, you can design your typeface in a graphics program (in the font
    of your choice) and then put that into your website page. This means that the
    user ends up viewing the words in your selected font. For Joomla! Templates, you
    will often see this method used for menu and module icons, among others.


    Image replacement techniques can also be performed using a PHP / JavaScript Library
    called FaceLift Image Replacement (FLIR), pronounced "fleer". This technique automatically
    replaces any text on the web page with an automatically generated picture if the
    font is not found on the user''s machine. FLIR is open source and doesn''t require
    other tools to be used on the server, nor any plugins to be loaded on the user''s
    browser. FLIR requires PHP and the GD Image Library to be installed on the server.


    The following is an example of FLIR in action on the home page at


    ```

    http://facelift.mawhorter.net.

    ```


    ![](img/0151410972a5c5ea0aab26416e44b1da_79_0.png)


    Scalable Inman Flash Replacement (sIFR) is another method of replacing short passages
    of plain text, with that rendered in the font of your choice. The sIFR method
    uses a combination of Flash, JavaScript, and CSS. sIFR is a new technology growing
    in popularity. sIFR is also open source, and requires the Flash player plugin
    to be installed in the reading browser.


    Initiatives for real-time downloading of specific fonts to the user''s browser
    are being developed and browser support being phased-in, and I''m sure in the
    near future will be available. There are even a number of sIFR extensions now
    available for Joomla! These will be mentioned in the following sections.'
  merge: -1
  img_proc: true
- pgno: 80
  md: '# # Joomla! text and typography extensions


    The majority of professional Joomla! Templates now available have "Typography"
    and text / font features built directly into them. Pre-configured class styling
    have been included into the CSS sheets, allowing the end user a vast array of
    text styling at their fingertips.


    From administration driven "What font do you want to use?" parameters, through
    to included `.class` styling, your template can take on a stunning new text look
    with small changes:


    ![](img/0151410972a5c5ea0aab26416e44b1da_80_0.png)


    The majority of modern professional Joomla! Templates now contain pre-styled typography
    options which provide style and interest within your site pages:


    ![](img/0151410972a5c5ea0aab26416e44b1da_80_1.png)'
  merge: -1
  img_proc: true
- pgno: 81
  md: 'In true open source fashion, there are a number of Joomla! Extensions available.
    These have been built to enhance the Joomla! Templates with all sorts of interesting
    text functionality.


    # Frontend font size adjuster (M)


    This module allows visitors to increase or decrease the font size on the site
    pages. Visitors'' font settings are remembered by use of JavaScript and a Cookie.


    This module contains six different buttons and styles, and it is possible to assign
    a class to the module so you can customize these to suit your site:


    ![](img/0151410972a5c5ea0aab26416e44b1da_81_0.png)


    To utilize this extension, visit http://extensions.joomla.org and search for "Font
    Size".


    # JsIFR3 (P)


    Use any font in your Joomla! 1.5 website. This plugin incorporates Scalable Inman
    Flash Replacement (sIFR) into Joomla! 1.5.


    There is a commercial version of this plugin, but this non-commercial version
    offers 14 plugin parameter settings to help refine the results for your project:


    ![](img/0151410972a5c5ea0aab26416e44b1da_81_1.png)


    To utilize this extension, visit http://extensions.joomla.org and search for "jsIFR3".'
  merge: -1
  img_proc: true
- pgno: 82
  md: '# capDropper (P)


    capDropper is a simple plugin that makes the first letter of an article appear
    styled as a drop capital.


    Styling can be adjusted to suit your template and the plugin activated or de-activated
    manually at an article level.


    ![](img/0151410972a5c5ea0aab26416e44b1da_82_0.png)


    To utilize this extension, visit `http://extensions.joomla.org` and search for
    "capDropper".


    There are numerous extensions which allow easy "text-resizing" and "drop capital"
    capabilities, alongside commercial versions of sIFR extensions. Visit `http://extensions.joomla.org/`
    in order to view the latest text and typography extensions that can spice up your
    Joomla! website.


    # Browser support and accessibility around fonts


    As mentioned earlier in this chapter, there are a specific number of fonts which
    should be used for your main body text on website pages. The reason for these
    selected few is because they are easy to read and available on a diverse range
    of user computer systems, therefore offering the best opportunity to reach as
    large an audience as you can.


    Fonts which usually fit into the previous categorization are called "web safe"
    fonts. Web safe fonts are a group of fonts which are installed and common among
    all versions of Windows, MAC, and Linux computers. By choosing a web safe font
    as a site designer, you increase the chance of your content being displayed in
    your chosen format.


    The following is a list of recognized web safe fonts. These are available on Windows,
    MAC, and Linux operating systems:'
  merge: -1
  img_proc: true
- pgno: 83
