  \ 319\n    Twitter Follow Me 322\n\n\n\n\n## 前言\n\nJoomla! 是一种内容管理系统，旨在在网站环境中组织和发布内容。\n\
  \n多媒体为我们提供了令人惊叹的交互式用户体验和美妙的设计选择，但要有效地利用它，需要纪律和知识，否则我们会疏远我们的受众。\n\n如果您希望在 Joomla!\
  \ 页面上展示的不只是文本，本书就是为您设计的，必读。它带您超越 Joomla! 的基础知识，并帮助充分利用这种强大的 CMS 结构，为网站用户提供丰富的媒体内容。本书为\
  \ Joomla! 管理员提供了创建引人入胜、媒体丰富的 Joomla! 网站所需的详细资料和全部必备知识。利用 Joomla! 的核心功能和 Joomla!\
  \ 扩展的强大功能，本逐步指南将向您展示如何将流行的媒体元素纳入您的网站并与外部网络资源协作。\n\n您将学习所需的一切知识，以便通过手动嵌入内容、使用更自动化的方法和专用扩展的强大功能，在内容中呈现文本、图像、视频和音频。您将学习如何创建常规播客并利用\
  \ RSS 来帮助宣传和发布您的网站内容。\n\n了解 Joomla! 的流行多媒体扩展；了解它们如何通过额外功能使您的 CMS受益，以及它们如何安装和配置。利用现在在网络上可用的大量外部资源，并学习您的\
  \ Joomla! 网站如何与 YouTube、Flickr、Twitter 和 Google 等网站进行交互并呈现内容。\n\n## 本书涵盖内容\n\n第\
  \ 1 章，*开始使用 Joomla! 多媒体* 向您介绍多媒体，分解主要元素，并概述后续章节中将出现的一些内容。您的 Joomla! 内容管理系统包含许多内置的多媒体功能，这些功能通过第三方扩展增强，可以将您基本\
  \ Joomla! CMS 转变为媒体丰富的交互式用户体验。\n\n第 2 章，*管理您的 Joomla! 媒体* 告诉我们，使用多媒体在 Joomla! 网站中使用时最重要的任务之一是能够上传和管理您网络服务器上的文件。在本章中，我们将查看使用内置\
  \ Joomla! 媒体管理器，以及管理网站媒体和文件的替代方法。\n\n第 3 章，*Joomla! 网站中的文本、字符和字体* 显示文本（及其样式）是网站页面中使用最广泛、至今仍在使用的媒体类型之一。尽管它是如此重要的媒体元素，网络开发人员往往对此关注甚少。在本章中，我们将重点介绍字体、字符和文本在\
  \ Joomla! 网站中的使用，以及我们如何通过使用另一种字体类型来改变网站设计，从而影响您网站用户的整体体验。\n\n第 4 章，*添加和管理图像内容* 将提供帮助，以在\
  \ Joomla! 网站中有效利用图像内容，无论您需要在 Joomla! 网站中创建多媒体图像画廊，还是只需将图像添加到文章和模块中。\n\n第 5 章，*在\
  \ Joomla! 网站中使用音频* 突出了音频在 Joomla! 网站中的使用。您将学习如何将强大的音频功能（如音频播放器和播客功能）纳入 Joomla!。\n\
  \n第 6 章，*在 Joomla! 网站中使用视频* 突出了视频媒体在 Joomla! 网站中的使用。我们将查看将视频内容嵌入文章的过程，创建和维护视频播客，以及第三方\
  \ Joomla! 扩展提供的强大视频解决方案。\n\n第 7 章，*与外部来源协作* 谈论了在 Twitter、Facebook 和 Google 等流行外部资源之间共享信息是如何越来越受欢迎的\
  \ Joomla! 用户所需的功能。旨在扩展 Joomla! 框架以提供新功能，本章将介绍 Joomla! 最受欢迎的协作扩展及其包含的功能，以及使用老式 HTML\
  \ 方法将外部内容嵌入到您的网站中。\n\n## 惯例\n\n在本书中，您会发现多种文本样式，用于区分不同类型的信息。以下是这些样式的一些示例，以及它们的含义。\n\
