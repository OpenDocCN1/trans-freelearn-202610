  \n## 疑问\n\n如果您在使用本书的任何方面遇到问题，可以通过 questions@packtpub.com 联系我们，我们将竭诚为您解决。\n\n## 快速入门\
  \ Joomla! 多媒体\n\n目前，网页中多媒体内容的应用正以惊人的速度发展。每周都会在 http://extensions.joomla.org 扩展目录中发布新的多媒体扩展。几乎同时，新的社交/媒体网络门户也层出不穷，它们提供了将媒体内容交互和流媒体传输到您网站页面的功能。其中一些流行的门户正在定义新的多媒体功能，并为网站用户交互树立新的标准。\n\
  \n您的 Joomla! 内容管理系统拥有许多出色的内置多媒体功能；这些功能通过第三方扩展和流媒体源的丰富，可以帮助将您的默认 Joomla! 网站演变为面向访客的强大且丰富的媒体交互体验。\n\
  \n本章是多媒体的介绍，以及 Joomla! 如何与这些媒体元素进行交互。\n\n### 什么是多媒体？\n\n**多媒体**的定义是一种模棱两可的描述，它被宽松地用来定义多种相互集成并共同使用的媒体类型。多媒体遍布我们的日常生活，并应用于包括营销、广告、艺术、医学、工程在内的许多领域！\n\
  \n多媒体的例子可以是从简单的两种媒体类型混合（如包含文字和图片的书籍），到先进的交互视频游戏（包括图像、视频、文本和音频）。\n\n如描述所示，“多媒体”包含不同类型的媒体内容，而这些不同的媒体元素通常可以归类。\n\
  \n### 多媒体的类别\n\n从学术角度来看，多媒体通常被定义为两个主要类别：线性和非线性。超媒体是第三种定义，虽然它通常被视为独立的分类，但它属于非线性多媒体类别。\n\
  \n### 线性\n\n线性多媒体内容通常像演示文稿一样推进，不需要观看者进行交互或导航。线性多媒体的例子包括电影院里的商业大片或电视节目。\n\n### 非线性\n\
  \n非线性多媒体内容是一种允许用户控制并推进自身体验的媒体类别。非线性多媒体的例子可以是交互式视频游戏或基于计算机的学习应用程序。\n\n### 超媒体\n\n\
  超媒体是非线性类别的成员。它是“超文本”一词的扩展，意味着用户可以点击并导航到另一个区域的链接文本。\n\n超媒体可以包含相互链接的文本、图像、视频和音频内容。由于其导航属性，超媒体是网页的基本元素。超媒体的最佳例子是万维网（WWW）本身，它包含数百万个提供相互链接媒体内容的网页。\n\
  \n### 网站多媒体\n\n网站多媒体描述了通过 Web 服务器或网站页面以电子方式传递给最终用户的多种媒体和内容形式。网站多媒体通常归入非线性多媒体分类，因为通常情况下，它为最终用户提供了导航和控制的机会。网站使用的媒体类型可以包括文本、图像、音频和视频，但也可以包含许多符合“多媒体”描述的其他交互功能。\n\
  \n在这本书中，我们将探讨这些多媒体元素，以及如何在我们的 Joomla! 网站中有效地显示它们。\n\n### 各种类型的网站多媒体\n\n互联网最初是从简单的文本内容开始的。随着\
  \ HTML 和其他编程语言的实施，以及 Web 浏览器和连接速度的演变，媒体丰富的应用程序和网站如今遍布万维网。\n\n## 快速入门 Joomla! 多媒体\n\
  \n多媒体直接影响了互联网的增长，正如互联网也影响了多媒体一样。在线信息的扩展正在成为最重要的多媒体载体。Web 用户现在能够按需控制数据的传输，而用户交互性已成为流行网站使用的关键过程。\n\
  \n![](img/0151410972a5c5ea0aab26416e44b1da_24_0.png)\n\n如本章前面所述，多媒体是多种形式内容的组合。这些内容可以包括文本、图像、音频、视频以及脚本和许多其他网站功能，这些功能有助于网站用户的导航和交互。\n\
  \n### 什么是 Joomla!？\n\nJoomla! 是一个屡获殊荣的开源内容管理系统（CMS），使您能够构建强大的数据库驱动的网站应用程序。\n\nJoomla!\
  \ 允许您轻松构建、组织和管理网站内容。Joomla! 本身是一个快速演变的产品，支持其增长的团队和社区也是如此：\n\n![](img/0151410972a5c5ea0aab26416e44b1da_25_0.png)\n\
  \nJoomla! 创建可公开查看的页面，并包含一个由 Web 驱动的管理区域，可通过登录屏幕访问：\n\n![](img/0151410972a5c5ea0aab26416e44b1da_25_1.png)\n\
  \nJoomla! 在全球各地被用于驱动各种形状和大小的内部网络和互联网网站。\n\nJoomla! 的使用示例包括：\n- 在线杂志、新闻门户和出版物\n-\
  \ 政府应用程序\n- 学校和教堂网站\n- 公司网站和内部网络\n- 个人网页和博客\n- 音频和视频门户\n\nJoomla! 已成为许多人喜爱的 CMS。其快速且持续增长的原因包括：\n\
  - Joomla! 是一个免费向所有人开放的开源应用程序。有关此主题的更多信息，请访问 http://www.opensourcematters.org。\n\
  - 该产品具有结构完善的路线图，用于持续开发和支持。\n- Joomla! 拥有一个充满活力的成长社区，创建了一个优秀的帮助和支持网络。\n- 有数千个第三方扩展可用，它们提供了易于安装的附加功能。这使得强大的新功能可以轻松添加到您的\
  \ Joomla! 网站中，只需几次鼠标点击。\n- 模板结构允许您完全自定义 Joomla! 网站的外观和感觉。\n- 后端管理包含强大的功能，灵活且易于使用。\n\
  \n### 在 Joomla! 站点中包含多媒体\n\n就像手工编码的网站一样，您的 Joomla! 网站可以轻松包含多媒体站点内容。事实上，Joomla! CMS\
  \ 的构建旨在轻松创建、管理和展示多种内容类型，允许您在站点页面上发布这些内容。\n\n将多媒体材料纳入软件驱动的 Web 框架（如 Joomla! CMS）的方法可能与手工编码的网站不同。使用的媒体元素需要按照\
  \ Joomla! CMS 框架的方式包含和部署。\n\nJoomla! CMS Web 平台专为内容管理而设计，并尽可能减少额外杂乱。开箱即用，它在管理内容方面做得非常出色，但应用程序框架为全球成千上万的开发者提供了为基本\
  \ CMS 贡献额外功能的能力。这些被称为 Joomla! 扩展。\n\nJoomla! 扩展是第三方产品，旨在增强核心 Joomla! 功能。它们形态各异，可以为默认的\
  \ Joomla! 添加强大功能。有数千个 Joomla! 扩展可在位于 http://extensions.joomla.org 的 Joomla! 扩展目录（JED）以及互联网上可用的其他\
  \ Joomla! 资源中找到。\n\n![](img/0151410972a5c5ea0aab26416e44b1da_27_0.png)\n\n多媒体扩展构成了\
  \ JED 的一个重要部分，我们将在接下来的章节中介绍一些最强大和最有用的扩展。\n\n\n\n\n\n*Joomla! 多媒体入门*\n\n## Joomla!\
  \ CMS 中的多媒体使用\n\nJoomla! CMS 的强大功能之一在于其组织和内容管理能力。这些内容可以是文本、图像、文档、音频、视频，以及你能想到的任何其他形式，用于提供给网站用户。\n\
  \nJoomla! 自带“媒体管理器”工具。它允许你将不同类型的媒体上传、整理和删除到 images 目录，或者如果你愿意，也可以上传到子目录。媒体管理器提供缩略图视图以及文件属性的详细视图，例如名称、文件大小等。\n\
  \n内置媒体管理器的目的是让网站管理员能够直接在网站页面中管理媒体内容，而无需通过文件传输协议（FTP）访问服务器。作为开发人员，使用 FTP 是一种基本的传输方法，但在将基于\
  \ Joomla! 的网站移交给最终客户时，限制这种访问是常见需求。\n\n一旦文件放置在 Web 服务器上，一切就有趣了。我们的媒体已经就位，一切就绪，接下来呢？在我们深入之前，现在是时候着重介绍\
  \ Joomla! 模板了。\n\nJoomla! **模板**是 Joomla! CMS 中的一组文件，用于控制内容的呈现。模板允许你在网站页面上获得完全不同的“外观和感觉”。当与图像、层叠样式表（CSS）和\
  \ CMS 数据库内容组合时，模板有助于网站的整体设计和布局。\n\n在生成网站页面时，主要元素的位置通常保持不变；这些元素可能是菜单、横幅等。这些页面可能还需要相同的徽标、颜色和样式，这就是我们的模板和层叠样式表发挥作用的所在。模板还有一个重要作用，就是允许我们将特定的\
  \ Joomla! 内容发布到模板的特定区域。\n\nCMS 和模板方法不仅使我们能够将多种媒体内容投放到网站模板的不同位置，而且还能灵活地在需要时展示我们想要的内容。我们将用一整章来介绍\
  \ Joomla! 模板以及它们如何增强我们网站的多媒体功能。\n\n目前，重点强调的是，开箱即用的 Joomla! 似乎只提供基本的网站内容管理。但凭借对产品的了解以及额外的扩展和配置，它可以提供一个充满多媒体功能的惊艳\
  \ Web 解决方案。\n\n## 文本\n\n文本由字母、数字、字符、单词和符号组成。它们组合在一起形成词语，传达思想、信念或事实。文本是使用最广泛的交流形式，被视为视觉多媒体的基本元素。\n\
  \n文本在网站上无处不在，甚至用于许多用户看不见的网站部分。其中一个例子就是网站页面的 HTML 源代码：\n\n```\n```php\n<?php if ($this->params->get('show_page_title',\
  \ 1) && ...\n    <div class=\"componentheading\">...\n        <?php echo $this->escape($this->params->get(...\n\
  \    </div>\n<?php endif; ?>\n<?php if (condition || $this->params->get('show_title'...)\n\
  <table class=\"contentpaneopen\">\n<tr>\n    <?php if ($this->params->get('show_title'))\
  \ : ?>\n    <td class=\"contentheading\">\n        <?php if ($this->params->get('link_titles')\
  \ && ...\n        <a href=\"<?php echo $this->article->readmore_l...\n         \
  \   <?php echo $this->escape($this->article->t...\n        <?php else : ?>\n   \
  \         <?php echo $this->escape($this->article->t...\n        <?php endif; ?>\n\
  ```\n```\n\n文本可用于页面的标题、主要内容、标题说明和帮助提示、文档、错误报告，基本上遍布你网站的每个角落。\n\n字体是一种特定的文本样式，在现代网站的外观和感觉中起着重要作用。如今，字体在整个\
  \ Web 中被广泛用于样式化和定义文本。如果没有字体，我们所看到的所有文本都会拥有相同的外观，这会让一切变得索然无味。\n\n![](img/0151410972a5c5ea0aab26416e44b1da_29_0.png)\n\
  \n在现代网站中，文本及其希望应用的样式类型通常使用样式表来定义。在样式表文档中，可以设置字体和文本属性。这些属性可以应用到网站页面上使用的小范围或大范围的文本：\n\
  \n![](img/0151410972a5c5ea0aab26416e44b1da_30_0.png)\n\n## 图像\n\n除了书面文本，图像可能是网站中使用最多的媒体类型之一。\n\
  \n图像不仅能有效传达信息（俗话说“一图胜千言”），而且它们也是设计、营销和品牌推广的重要元素，可能让你的网站从其他网站中脱颖而出。\n\n“图像”的定义往往可以用来描述以下元素：\n\
  \n- 照片\n- 图形\n- 示意图\n- 绘图\n\n图像可以作为单一元素放置在网页上以补充文本，也可以组合在一起形成图库，在某些网站上扮演着重要的多媒体角色：\n\
  \n![](img/0151410972a5c5ea0aab26416e44b1da_31_0.png)\n\n图像可以创建、编辑并保存为多种格式。其中一些格式比其他格式更适合在\
  \ Web 上使用。\n\n有关图像的更详细信息，请参阅第 4 章“添加和管理图像内容”。\n\n## 音频\n\n音频（或我们熟知的声频）可用于激发人类情感和传递信息。音频是人类娱乐的重要元素，也是视频、游戏和其他多媒体演示的构成元素。\n\
  \n音频的使用可以增添趣味、提供信息并娱乐大众。一个经常被忽视的事实是，音频还可以为有视觉障碍的用户提供获取所需信息的接口：\n\n![](img/0151410972a5c5ea0aab26416e44b1da_31_1.png)\n\
  \n现在的互联网是一种音频丰富的传输机制，音频可以轻松地从网站和便携设备上的应用程序下载。如今大多数现代计算机配置都包含扬声器，这从某种角度看，促进了网页中音频使用的演变。也可能反过来，网页中更多的音频使用指定了计算机用户需要扬声器的要求。\n\
  \n话虽如此，那些曾经加载到网页上、播放着无法控制音量的圣诞 MIDI 文件的跳舞圣诞老人已经一去不复返了！现在我们谈论的是包含“点播播客”和“拨打你自己的个人电台播放列表”的网站，以及包含计时和播放控件等令人印象深刻的音频播放器。\n\
  \n与图像一样，声音文件可以创建并保存为多种格式，包括 AAC、MP3、MIDI、WAV 等。选择正确的音频格式用于你的网站，对于高效地向网站用户传递音频内容至关重要。\n\
  \n![](img/0151410972a5c5ea0aab26416e44b1da_32_0.png)\n\n## 视频\n\n视频可以定义为一系列静止图像组合在一起并在屏幕上显示，从而形成运动的错觉：\n\
  \n![](img/0151410972a5c5ea0aab26416e44b1da_33_0.png)\n\n视频是最强大的多媒体类型之一，因为它融合了图像和音频。它还可以以标题和描述的形式包含文本。\n\
  \n视频一直被认为是处理起来最苛刻的媒体类型之一，因为处理大文件大小会带来很高的开销。视频的传输和存储常常使其在某些条件下成为不合适的介质。然而，情况正在迅速变化，现在视频通常被链接到应用程序或“流式传输”到应用程序中，而不是直接托管文件本身。\n\
  \n视频可以保存为多种格式和压缩类型。其中一些非常适用，而另一些则应避免在网站中使用。有关处理视频的更多信息，请参阅第 5 章*在 Joomla! 网站中使用视频*。\n\
  \n![](img/0151410972a5c5ea0aab26416e44b1da_34_0.png)\n\n## 多媒体与网站可访问性\n\n网站可访问性意味着有残障的人士能够理解、交互和浏览网页。\n\
  \n网站可访问性的主要原则之一是设计网站和 Web 软件，使其能够灵活满足不同用户的状况、偏好和环境。\n\n\n\n\n\n随着网络成为信息共享日益重要的资源，越来越多的用户现在上网查阅资料：健康、商业、政府、休闲、媒体以及许多其他资源。希望利用网络的人必须能够平等地访问这些资源并享有平等的机会：\n\
  \n![](img/0151410972a5c5ea0aab26416e44b1da_35_0.png)\n\n在构建网站时另一个重要考虑因素是，在某些国家，网络无障碍具有法律义务。除了对所有网站用户的重要考虑之外，在构建和维护网站时考虑无障碍也可能有法律原因。\n\
  \n## 一个多媒体网站可以是无障碍的吗？\n\n多媒体丰富的网站也可以是无障碍网站。然而，你选择为网站实施的无障碍选项的程度是你需要为项目做出的决定。决策依据通常包括目标受众、国家法律以及项目时间和预算等因素。\n\
  \n网络上使用着多种无障碍标准，它们提供了无障碍指南和检查清单以供衡量。示例包括：\n\n### Web 内容无障碍指南（WCAG）\n\nWeb 内容无障碍指南（WCAG）已成为网络无障碍的世界标准，并分为三个“合规”类别：\n\
  \n- 1. **A（也称为 Level 1）**\n- 网站必须符合 Level 1 中的所有检查点，否则一个或多个用户群体将无法访问信息或功能。\n- 2.\
  \ **AA（也称为 Level 2）**\n- 网站应符合 Level 2 中的所有检查点，否则一个或多个群体在访问信息或功能时将遇到重大障碍。\n- 3.\
  \ **AAA（也称为 Level 3）**\n- 网站可以符合 Level 3 中的所有检查点，否则一个或多个群体在访问文档中的信息时会发现有些困难。\n\n\
  ### Section 508\n\nSection 508 是由美国联邦政府创建的标准。它包含 16 个用于测试网站的检查点。前 11 个检查点与 WCAG\
  \ A（Level 1）指南完全等效。后五个检查点部分基于 WCAG 指南，但更为详尽。有关此标准的更多信息，请在网上搜索 Section 508。\n\n网站无障碍功能最好在网站项目开始时考虑，然后在开发过程中解决。采取这种方法比事后解决这个问题要容易得多。修复无效的网站代码并创建\
  \ `title` 或 `alt` 标签可能需要花费数小时的工作时间，并且通常会超过为使内容无障碍而预留的任何预算。\n\n你可以实施一些简单的流程来使网站更具无障碍性。当然，力求达到更高的无障碍水平当然需要更大的时间投入。\n\
  \n- 3. http://en.wikipedia.org/wiki/Web_accessibility: Wikipedia's page on accessibility\
  \ guidelines.\n- 4. http://www.section508.gov/: Section 508 requires that Federal\
  \ agencies' electronic and information technology is accessible to people with disabilities.\n\
  \n## Web 浏览器对多媒体的支持\n\nWeb 最初是一个仅限文本的媒介，浏览器只能以单一字体、大小和颜色显示文本。\n\n随着互联网的爆炸式增长，网站浏览器现在可以查看图像、播放音频和视频。万维网的进一步发展是“流媒体”的演进，它允许在文件完全下载之前开始媒体播放。\n\
  \n有许多网络浏览器可用。其中一些适用于特定用途，而另一些则以轻量级或最快的浏览器为荣。\n\n大多数浏览器具有内置的多媒体功能，这是对网站多媒体增长的认可。其他浏览器需要插件来播放多媒体内容。**插件**是扩展浏览器功能的程序，使其与额外的媒体类型兼容。当浏览器遇到多媒体文件时，它会将数据交给插件以播放或显示该文件。\n\
  \n你可能听说过插件“Adobe Flash Player”，它使你能够通过网络浏览器播放 Adobe 电影，或“Windows Media Player”浏览器插件，它播放以\
  \ Microsoft 格式保存的流音频、视频和演示文稿。如果没有将这些插件安装到网络浏览器中，网站页面上的此媒体内容将无法有效查看：\n\n这凸显了以多种格式提供多媒体材料的\
  \ importance，或者如果这不是一个选项，则为网站用户提供有关正在尝试加载的媒体的明确说明，以及在可能的情况下，指导他们去哪里找到插件以播放它。\n\n\
  ## 摘要\n\n在本章中，我们研究了术语“多媒体”以及该描述包含众多类型的媒体内容。\n\n我们强调了 Joomla! CMS 平台并认识到其内置的多媒体功能，以及如何使用\
  \ Joomla! 扩展增强这些功能。正如扩展增强了默认的 Joomla! 安装，它们将在各章中得到充分的介绍。\n\n在本章中指出网站无障碍很重要，因为在网站开发开始时考虑和集成网络无障碍要比事后尝试解决无障碍问题容易得多。有关无障碍及其与特定媒体的关系的更多信息将在各章中介绍。\n\
  \n## 管理你的 Joomla! 媒体\n\n在使用 Joomla! 网站中的多媒体时，最重要的任务之一是能够上传和管理你网络服务器上的文件。一旦上传，此内容可能不需要进一步关注，或者你可能需要能够进行持续管理和文件修订。\n\
  \n在本章中，我们将研究使用内置的 Joomla! 媒体管理器，以及管理网站媒体和文件的替代方法。本章包括：\n\n- Joomla! 媒体管理器概述\n- 使用媒体管理器上传媒体\n\
  - 视图\n- 组织你的内容\n- 上传你的内容\n- 使用媒体管理器管理媒体\n- 管理文件和媒体的替代方法\n- 第三方文件管理扩展\n\n## Joomla!\
  \ 媒体管理器概述\n\n媒体管理器是一个有用的文件管理工具，包含在 Joomla! CMS 中。\n\n媒体管理器工具位于你的管理区域内，可以通过控制面板上的“快速链接”图标访问，或通过菜单：站点\
  \ | 媒体管理器访问：\n\n![](img/0151410972a5c5ea0aab26416e44b1da_42_0.png)\n\n媒体管理器的主要目的之一是让网站管理员以及具有权限的前端用户能够轻松上传和管理其\
  \ Joomla! 站点的文件。在你没有 FTP（文件传输协议）访问网络服务器的情况下，媒体管理器可能是你唯一可用的工具，可以将新图像、视频、文档和其他文件添加到你的网站。\n\
  \n## 使用媒体管理器上传媒体\n\n在初始网站开发期间，通常需要定期将新文件上传到你的 Joomla! 站点。根据网站的内容，随着你进入维护阶段，此过程可能会减少，或对于经常更新的站点而言仍然是必需的。\n\
  \n## 媒体管理器设置\n\n与所有软件应用程序一样，媒体管理器工具包含一组预定义设置。在首次使用媒体管理器之前，建议你查看这些设置，因为它们提供了自定义网站媒体处理的能力。根据你的文件需求，现在调整媒体配置设置可能会在以后为你节省时间和精力。\n\
  \n\n\n\n## 媒体设置配置\n\n如果您决定为媒体目录使用其他文件夹名称，保留服务器上当前的 `/images` 目录非常重要，因为其他组件通常会使用该目录。\n\
  \n- **图片文件夹路径**\n  这通常是将 Joomla! 内容文章中的图片放置的路径。\n  \n  默认情况下，它被设置为 `<joomlaroot>/images/stories`。您可以将其更改为所需的任何路径。如果您希望通过媒体管理器访问此文件夹，请将其设置为之前提到的“媒体文件夹”的子文件夹。例如，`<joomlaroot><mediafoldername>/<imagefoldername>`。\n\
  \n> 如果您决定为图片目录使用其他文件夹名称，保留服务器上当前的 `/images/stories` 目录非常重要，因为其他组件通常会使用该目录。\n\n-\
  \ **限制上传**\n  此功能根据用户类型限制上传。默认设置为**是**，这意味着低于“管理员”状态的用户只能获得一个文件夹选项来上传文件。该文件夹即为主要“媒体文件夹”。如果将此选项设置为**否**，则用户也允许在主媒体文件夹内的子目录中上传文件。\n\
  \n- **检查 MIME 类型**\n  这是一个安全功能，使用 MIME Magic 或 Fileinfo 来验证上传的文件类型。通过检查 MIME 文件信息，有助于确保用户不会向网站上传恶意文件。有关**Fileinfo**\
  \ 的更多信息可在 `http://www.php.net/manual/en/book.fileinfo.php` 找到。\n\n- **合法的图像扩展名（文件类型）**\n\
  \  这是您和其他用户允许上传到 Joomla! 网站的合法图像扩展名列表。默认列表包括 **bmp**、**gif**、**jpg** 和 **png** 文件。如果需要更多图像扩展名类型，请进行调整。\n\
  \n## 视图\n\n打开媒体管理器时，其中一个初始可用选项是选择查看文件及其相关信息的方式。\n\n两个选项是“缩略图视图”和“详细视图”。\n\n1. **缩略图视图**：第一种（也是默认设置）称为缩略图视图。它提供文件的缩略图预览，并在每个文件下方提供删除按钮。缩略图视图非常适合快速浏览文件（尤其是图像），因为您可以实际看到列表以及面前的缩略图图标。然而，在处理大量文件时，此视图可能会显得繁琐。\n\
  \n![](img/0151410972a5c5ea0aab26416e44b1da_46_0.png)\n\n2. **详细视图**：详细视图选项显示五列布局。其中包含有关每个文件的附加信息。详细视图中提供的信息如下：\n\
  \   - 文件预览\n   - 按字母顺序排列的文件名\n   - 图像尺寸\n   - 文件大小\n   - 删除选项\n\n![](img/0151410972a5c5ea0aab26416e44b1da_47_0.png)\n\
  \n在这两种视图类型之间切换只需简单点击一下。根据您所在的目录以及其中包含的文件数量，您可能会发现经常使用这两种视图。\n\n## 组织内容\n\n默认情况下，Joomla!\
  \ 媒体管理器包含若干子目录，这些目录将显示在媒体管理器左侧的一列中。通过点击此树形结构中的文件夹，您可以在媒体管理器的右侧部分显示其内容。通过此方法或点击右侧部分的文件夹（这也将显示内容）可在媒体管理器中遍历子目录。\n\
  \n网站媒体内容的组织至关重要。正如 Joomla! 文章一样，文件正确的结构可以在日后需要轻松查找图片或媒体文件时，为您节省时间和避免挫败感。\n\n当前版本媒体管理器中的一个限制是，文件不能移动到其他目录。这意味着在项目开始时正确构建文件结构非常重要，然后文件可以轻松上传到其目标位置。\n\
  \n## 创建新目录\n\n在媒体管理器的顶部，您将看到一个水平栏，显示当前所在的目录位置。使用位于此栏右侧的“创建文件夹”功能，可以轻松地在媒体管理器中创建新目录。\n\
  \n![](img/0151410972a5c5ea0aab26416e44b1da_48_0.png)\n\n要创建新目录，首先确保您处于希望创建新文件夹的目录中。填写“创建文件夹”按钮左侧的文本字段，然后单击此按钮以创建该名称的新目录。\n\
  \n页面应重新加载，显示您的新目录已就位。\n\n> 已预先填充一个正斜杠，因此您只需输入目录名称，无需输入其他内容。\n\n正如 Joomla! 文章一样，网站文件组织得越好，就越容易进行持续管理。\n\
  \n## 删除文件\n\n与其他大多数事物一样，定期的大扫除有助于保持事物的有序和高效。\n\n如果您不再使用某些文件，或已创建了它们的较新版本，则可以通过点击文件类型旁边的红色“X”图标轻松删除它们：\n\
  \n![](img/0151410972a5c5ea0aab26416e44b1da_48_1.png)\n\n如果希望一次性删除多个文件，请勾选每个文件旁边的复选框，并点击媒体管理器右上角的“删除”按钮。\n\
  \n## 上传内容\n\n根据全局配置中的“媒体设置”，您可以选择使用媒体管理器中的两种上传功能类型。\n\n### 单文件上传\n\n媒体管理器的默认上传工具是单文件上传工具，它位于媒体管理器的底部。此工具允许您在本地计算机上浏览单个文件类型，并将其上传到您选择的目录中的\
  \ Web 服务器。\n\n要使用此方法上传文件，首先确保文件上传的目标位置正确。最简单的做法是使用左侧的**文件夹**目录菜单，并确保要上传文件的目标目录处于高亮状态。\n\
  \n![](img/0151410972a5c5ea0aab26416e44b1da_49_0.png)\n\n要上传文件，请单击**选择文件**按钮。这将允许您在本地计算机上浏览要上传的文件。选择后，单击**开始上传**按钮将此文件上传到您\
  \ Web 服务器上选择的目录。文件上传完成后，媒体管理器将刷新，您应能在所选目录中看到新文件。\n\n![](img/0151410972a5c5ea0aab26416e44b1da_49_1.png)\n\
  \n### 多文件上传\n\n如果您在全局配置媒体设置中启用了“启用 Flash 上传器”选项，则应能够享受基于 Flash 的上传功能。\n\n与单文件功能一样，多文件\
  \ Flash 上传器也位于媒体管理器的底部。\n\n![](img/0151410972a5c5ea0aab26416e44b1da_50_0.png)\n\n\
  要上传多个文件，首先确保要上传的目录处于高亮状态。单击**浏览文件**按钮，并在本地计算机上浏览文件。重复此过程，直到列出要上传的文件列表。单击**开始上传**按钮上传文件。\n\
  \n该过程将显示每个文件上传的状态。\n\n> 在编写本书时，Flash 11 的安全设置已破坏了 Joomla! 媒体管理器内置的 Flash 多文件上传工具。这可能会在未来的\
  \ Joomla! 版本中得到解决。然而，单文件上传功能是目前要使用的稳定上传工具。\n\n## 使用媒体管理器管理媒体\n\n如本章前面所述，网站内容的良好组织是非常重要的。\n\
  \n在项目开始时分析项目需求可以在未来为您节省数小时的工作。明确的目录结构以及这些文件夹的清晰描述不仅有助于您自己的管理，也有助于其他可能向网站服务器上传文件的管理员和用户。即使是默认的\
  \ `<joomlaroot>/images/stories` 结构有时也会变得具有挑战性；例如，我是把它放在 /images 文件夹中，还是 /images/stories\
  \ 文件夹中？\n\n\n\n\n\n![](img/0151410972a5c5ea0aab26416e44b1da_51_0.png)\n\n内置的媒体管理器是\
  \ Joomla! 管理员的一个很棒的工具。事实上，如果你有一个由他人搭建的 Joomla! 网站，那么这可能是你上传新文件到 Web 服务器的唯一工具。\n\n\
  所以我们同意这是一个很酷的工具；它可以限制文件类型并允许你创建目录和上传文件，但不幸的是它很简单且有其局限性。其中一个缺点是上传后无法移动文件。\n\n请记住，我们可以在主媒体目录下创建任意多的子目录。因此诀窍是在项目开始时分析你的网站用途，并相应地设置这些目录，这将为你节省时间和日后的挫败感。如果你的网站已经建立并且文件和链接指向这些文件，那么工作肯定会变得更耗时。不过对已建立的网站进行一次彻底清理是可能的，这需要创建新目录、将文件移入其中，并检查内容和链接以确保它们指向正确的目标。\n\
  \n## 管理文件和媒体的替代方法\n\n根据你的情况，你可能拥有也可能不拥有对 Web 主机服务器的登录访问权限。如果没有，那么你上传文件的唯一选择之一就是使用\
  \ Joomla! 媒体管理器，或第三方 Joomla! 扩展的选项。\n\n如果你拥有 Web 服务器访问权限，那么通过一种称为 FTP（文件传输协议）的方法，你将能够更好地控制文件管理。\n\
  \nFTP 是一种用于在计算机网络上交换和操作文件的标准网络协议。FTP 的常见用途是在本地计算机和 Web 服务器之间通过互联网传输文件，这正是我们想要的！\n\
  \n## FTP 客户端\n\n有许多 FTP 客户端（程序）可用于传输文件。其中一些以图形方式显示文件和传输过程，使得从你的计算机到 Web 服务器的文件管理变得非常容易。\n\
  \n## FTP 程序\n\nFTP 程序从免费应用程序到商业软件不等。你选择使用哪一个取决于个人喜好。这些程序大多数都提供拖放功能以及易于使用的目录导航工具：\n\
  \n![](img/0151410972a5c5ea0aab26416e44b1da_52_0.png)\n\n所有主要操作系统都有出色的 FTP 程序。Windows\
  \ 和 Mac 的一些流行选项是：\n\n- Windows\n  - FileZilla\n  - CuteFTP\n  - SmartFTP\n  - WS_FTP\n\
  \  - cURL\n- Mac\n  - FileZilla\n  - Transmit\n  - Cyberduck\n  - CuteFTP\n  - Fetch\n\
  \  - FTP Command in Terminal\n\n如果你使用流行的搜索引擎进行搜索，你将获得一份确定的 FTP 程序列表。建议下载这些程序的试用版，以查看哪一个适合你的操作系统和需求。\n\
  \n出于本主题的目的，我选择使用并从名为 “Transmit” 的 FTP 程序中截取屏幕截图。它是一款商业产品，但个人而言是我最喜欢的之一。对于使用 MAC\
  \ 电脑的人来说，Transmit 被公认为是一款很棒的 FTP 工具。\n\n## 使用 FTP 程序连接\n\n几乎所有 FTP 程序都需要类似的信息才能连接到\
  \ Web 服务器。根据你使用的程序，这些字段的命名可能略有不同。\n\n为了连接，我们需要以下信息，这些信息通常来自在你的 Web 主机控制面板上设置一个用户账户（具有\
  \ FTP 权限）：\n\n- 1. **Server**\n  这是你希望连接到的服务器地址。通常它看起来像 `ftp.yourserver.com`。根据域名设置，有时它也可以是你的域名，例如\
  \ `www.yourserver.com`。\n\n## 2. User Name\n\n这是你的 Web 服务器账户用户名。通常格式为 yourusername@yourdomain.com。\n\
  \n## 3. Password\n\n这是你的 Web 服务器账户密码。\n\n## 4. Initial Path\n\n一些程序提供在登录后导航到初始目录的能力。如果你没有此选项，则不必担心。\n\
  \n## 5. Port\n\n如果服务器需要在非默认端口上连接，一些程序允许你输入端口号。除非你知道自己在做什么，否则最好将其保留为默认设置。\n\n![](img/0151410972a5c5ea0aab26416e44b1da_54_0.png)\n\
  \n如果连接遇到任何问题，最好联系你的 Web 主机管理员以检查你的登录访问详情。\n\n通常有三种类型的 FTP 登录方法可用。这些是：\n\n## 1. Anonymous\
  \ FTP access\n\n这是一种简单的连接方法，因为你不需要包含任何用户信息。有时软件公司提供更新，或企业和政府网站通过匿名连接方法提供可下载的表单和内容。\n\
  \n- 2. **Username**\n  这是一种简化但受限的访问级别，你只需输入用户名。此类型的 FTP 登录通常用于学校和内联网环境。\n\n- 3.\
  \ **Username and Password**\n  这是一种更受限的安全访问级别，用户需要用户名和密码才能访问服务器。此方法通常由 Web 主机公司使用，他们允许人们将文件上传到\
  \ Web 服务器。\n\n如果你的 FTP 连接设置为用户名（或用户名和密码），那么你应该在屏幕上看到一个对话框。这将提示你输入安全访问详情：\n\n![](img/0151410972a5c5ea0aab26416e44b1da_55_0.png)\n\
  \n连接后，你需要导航到你的 webroot 文件夹。根据你的 Web 服务器，此区域可能命名为 httpdocs、mainwebsite_html、public_html\
  \ 或其他命名约定。你的 Joomla! 网站文件将位于此目录内。\n\n当你找到主 http 文档区域并点击进入后，你将看到默认的 Joomla! 媒体文件夹名为\
  \ images。\n\n![](img/0151410972a5c5ea0aab26416e44b1da_56_0.png)\n\n当你成功导航到远程主媒体文件夹（或其中的任何子文件夹）后，你还需要本地导航到你希望上传的文件夹或文件。大多数\
  \ FTP 程序允许你创建新目录，并将文件从本地计算机拖放到 Web 服务器。\n\n通过使用 FTP 程序，你可以更好地控制你的网站文件和内容。\n\nFTP\
  \ 程序允许你：\n\n- Create files and directories\n- Rename files and directories\n- Move\
  \ files and directories\n- Delete files and directories\n- Set file and directory\
  \ permissions\n\n> FTP 程序为你管理网站文件提供了最大的灵活性，但使用 FTP 程序时要小心。通过连接到 Web 服务器上的目录结构，你正在浏览核心\
  \ Joomla! 文件之间。\n\n## 通过 Web 浏览器使用 FTP\n\n除了浏览万维网之外，现代 Web 浏览器是包含 RSS 阅读器、使用电子邮件以及与\
  \ FTP 协作等额外功能的全面的互联网工具。\n\n虽然你可以使用我们已介绍的专用 FTP 程序，但使用典型的 Web 浏览器（如 Firefox 或 Internet\
  \ Explorer）连接到 FTP 服务器很容易。\n\n出于本示例和屏幕截图的目的，我们将使用 Mozilla Firefox。\n\n## 通过 Web\
  \ 浏览器连接到 FTP\n\n在某些情况下，组织的限制可能会限制 Web 浏览器 FTP 访问，但通常，如果你可以使用 FTP 程序连接到你的 Web 主机服务器，那么你应该能够通过\
  \ Web 浏览器使用 FTP 连接。\n\n使用 Web 浏览器的好处是：嗯……它是免费的，而且你可能已经在面前使用了！\n\n与使用 FTP 程序连接时一样，通常有三种类型的\
  \ FTP 登录方法可用。这些是：\n\n- 1. **Anonymous FTP access**\n  通过 Web 浏览器进行 FTP 的身份验证方法与使用基于软件的\
  \ FTP 程序时相同。\n- 2. **Username**\n  这是一种简化但受限的访问级别，你只需输入用户名。此类型的 FTP 登录通常用于学校和内联网环境。\n\
  - 3. **Username and Password**\n  这是一种更受限的安全访问级别，用户需要用户名和密码才能访问服务器。此方法通常由 Web 主机公司使用，他们允许人们将文件上传到\
  \ Web 服务器。\n\n通常有两种方法可通过 Web 浏览器连接到 FTP。这些是：\n\n- 1. **Enter an FTP address into\
  \ the address bar**\n  对于大多数提供 FTP 支持的 Web 浏览器，可以输入语法：`ftp.yourserver.com` 或有时 `ftp.yourdomainname.com`，然后按\
  \ *Enter*。\n\n\n\n\n\n如果你的 FTP 连接设置为 **Username**（或 **Username** 和 **Password**），那么屏幕上应该会出现一个对话框。这将提示你输入安全访问详细信息：\n\
  \n![](img/0151410972a5c5ea0aab26416e44b1da_58_0.png)\n\n如果连接时遇到任何问题，最好联系你的网站托管管理员以检查登录访问详细信息。\n\
  \n连接后，你需要导航到你的 webroot 文件夹。根据你的 web 服务器，该区域可能命名为 httpdocs、mainwebsite_html、public_html\
  \ 或其他命名约定。你的 Joomla! 网站文件将位于此目录内。\n\n## 2. 直接输入地址栏\n\n通过网页浏览器连接 FTP 的第二种方法是直接在地址栏中输入用户信息。虽然这可以为你节省一步，但我经常发现用户使用这种方法容易出错，导致花费的时间比之前连接方法更长。\n\
  \n不同浏览器可能有略微不同的语法，但使用 Mozilla Firefox 时，你可以直接在地址栏中输入类似以下内容：\n\n```\nhttp://username:password@yourserver.com\n\
  ```\n\n例如，如果我的用户名是 john，密码是 12345，那么它看起来像：ftp://john:12345@yourserver.com。\n\n用户名通常可以包含域名。如果是这种情况，语法看起来像：ftp://john@yourserver.com:12345@yourserver.com。\n\
  \n## 上传和下载\n\n一旦通过网页浏览器（通过上述任一方法）连接到 FTP，文件的上传和下载通常是相当直观的。\n\n![](img/0151410972a5c5ea0aab26416e44b1da_59_0.png)\n\
  \n要上传新文件，请确保你位于正确的远程上传目录中。浏览到你计算机上的文件，然后直接将其拖放到你的网页浏览器中。根据文件大小，这可能需要一些时间来上传，然后过程应该会完成。你可以以类似的方式下载文件，或者可能需要双击文件以开始下载它。\n\
  \n## 网页浏览器插件\n\n许多流行的网页浏览器为你提供扩展插件，可以增强使用浏览器连接方法时的 FTP 功能。\n\nFirefox 网页浏览器有一个有用的扩展名为\
  \ FireFTP。该插件提供左右视图，可轻松通过网页浏览器使用 FTP 管理和移动文件。FireFTP 就像在你的计算机上拥有一个独立的 FTP 程序一样。它免费使用，并在\
  \ Windows、Mac 和 Linux 上运行。有关 FireFTP 的更多信息，可访问 http://fireftp.mozdev.org/。\n\n以下屏幕截图显示了\
  \ FireFTP 插件：\n\n![](img/0151410972a5c5ea0aab26416e44b1da_60_0.png)\n\n必须提到的是，如果你定期进行文件上传，那么使用专业的\
  \ FTP 浏览器插件或 FTP 程序将为你提供额外的功能并使生活更轻松。通常你可以保存收藏的连接，这样你就可以用几次点击登录到你的 web 服务器。\n\n\
  现在有许多免费的 FTP 程序可用，提供文件移动、重命名选项，在某些情况下还提供服务器到服务器的文件移动，如果你有 FTP 服务器访问权限并定期传输文件，就没有理由不使用其中一个。\n\
  \n## SFTP\n\n安全 FTP（SFTP）是一种使用 SSH 传输文件的程序。SFTP 对传输的命令和数据进行加密，在你的计算机和远程服务器之间创建安全连接。你可以通过\
  \ SFTP 客户端或命令行使用 SFTP。大多数 FTP 客户端确实提供 SFTP 支持，但并非所有 web 主机都支持 SFTP，因此在使用此传输方法之前最好先向他们确认。\n\
  \n## 第三方文件管理扩展\n\n对于大多数用户来说，Joomla! 媒体管理器或使用 FTP 足以在你的计算机和 Joomla! 网站之间管理媒体。http://extensions.joomla.org\
  \ 区域中也有许多文件管理扩展可用。其中一些提供了增强的文件上传功能，而其他一些则提供了位于 Joomla! 管理中的 FTP 程序的能力。\n\n下面列出了两个流行的扩展，它们为管理员在\
  \ Joomla! 管理中提供文件管理功能。\n\n> 还有许多优秀的文档管理和下载扩展可提供前端文档共享和管理。如前所述，有关更多文件管理扩展，请访问 http://extensions.joomla.org\
  \ 查看可用的扩展。\n\n## eXtplorer\n\neXtplorer 是一个第三方文件管理应用程序，可在 Joomla! 1.0.x 和 1.5 版本下原生运行。eXtplorer\
  \ 可轻松作为 Joomla! 组件安装，但要求在 Joomla! 1.5 中以传统模式运行。\n\n你可以使用 eXtplorer 通过 FTP 或直接文件访问来访问和修改服务器上的文件和目录。无需启动\
  \ FTP 客户端，使用此类扩展可以从 Joomla! 管理的后端执行强大的文件管理操作：\n\n![](img/0151410972a5c5ea0aab26416e44b1da_61_0.png)\n\
  \n## Joomla! Flash Uploader\n\nJoomla! Flash Uploader 类似于内置媒体管理器 Flash 上传器，但该扩展包含扩展功能。它似乎不受\
  \ Joomla! 媒体管理器 Flash 上传工具因 Flash 安全设置而目前收到的相同问题的影响。该扩展允许你轻松地从桌面上传多个文件到 Joomla!\
  \ web 目录。该扩展的一个不错功能是能够为你的网站用户创建“上传配置文件”。这意味着如果你愿意，可以为不同的网站用户提供不同的上传目录——对于需要额外控制用户上传的大型网站来说这是一个方便的功能。\n\
  \n![](img/0151410972a5c5ea0aab26416e44b1da_62_0.png)\n\n## 总结\n\n你网站媒体的良好组织和结构与\
  \ Joomla! 文章一样重要。\n\n在你的项目处于开发阶段时，你应该审查和自定义项目的媒体设置，以及定义可用的目录结构，这将使文件管理成为一项简化的任务。\n\
  \n使用内置的 Joomla! 媒体管理器是管理员（以及具有权限的前端用户）创建目录结构并轻松地从本地计算机上传文件到 web 服务器的绝佳方式。上传后，文件然后可以在\
  \ Joomla! 文章和组件及模块中使用。\n\n对于开发人员（以及对服务器有额外访问权限的网站用户），使用 FTP 是管理文件和网站内容的有力方式，使你能够移动和操作文件，并访问\
  \ Joomla! 文件结构的其他区域。\n\n# 3\n\n# 你 Joomla! 网站中的文本、字符和字体\n\n有些人可能会问，为什么在一本关于多媒体的书中要包含一章关于文本和字体的内容？\n\
  \n答案很简单：文本（及其样式）是最突出的媒体类型之一，一直以来并仍在使用于网页中。尽管它是如此重要的媒体元素，web 开发人员通常对这个主题关注甚少。\n\n\
  在本章中，我们将重点介绍字体、字符和文本在你的 Joomla! 网站中的使用，以及我们如何不仅通过使用另一种字体来改变网站设计，还通过这样做来影响网站用户的整体体验。\n\
  \n主题包括：\n- 文本、字符和字体的概述\n- 字体及其对网站用户的影响\n- 哪种字体最好使用？\n- Joomla! 模板和层叠样式表（CSS）\n-\
  \ 在网页中使用自定义字体的替代方法\n- Joomla! 文本和排版扩展\n- 浏览器对字体的支持和可访问性\n\n## 文本、字符和字体的概述\n\n文本及其使用是大多数网站页面最大的贡献之一。文本和字符用于向读者传达和传递信息。当显示大块文本时，重要的是对其进行样式设计以在视觉上取悦读者，同时易于阅读。\n\
  \n**纯文本** 是一个术语，用来描述不包含字体和样式等属性的文本。它几乎可以被所有计算机程序读取。从一个方面来说，HTML 代码、CSS 和 XML 文件都是纯文本，但它们也包含与字符一起包含的结构标签。\n\
  \n一个 **字符** 是一个符号。它可以是字母、数字或标点符号，以及一系列其他信息符号。字符代表信息单元。\n\n一个 **字体**（也称 fount）传统上定义为“特定字体的一种尺寸和样式的完整字符集”。\n\
  \n在 Web 早期的日子里，屏幕上只有纯文本。此文本只能应用一种样式，使大多数网页在文本格式上看起来非常相似，例如 Tim Berners-Lee 于 1991\
  \ 年设计的早期网页的此屏幕截图：\n\n![](img/0151410972a5c5ea0aab26416e44b1da_64_0.png)\n\n通常，计算机设备上用于屏幕查看的字体通常是流行离线印刷样式的转置，例如印刷书籍的样式。在早期网页中，可供使用的字体只有很少几种。使用的一个主要排版常量是名为“Times\
  \ New Roman”（适用于 Windows）和“Times”（适用于 MAC）的字体。这些早期的计算机字体几乎总是衬线字体家族的成员（或衬线字体）。\n\n\
  \n\n\n\n衬线字体是对手写字符的模仿，其风格通常通过（书法）装饰得以丰富。衬线是添加到构成字符的线条末端的小挑。一种衬线字体示例（Times New Roman）如下；注意每个字符上的衬线（挑）：\n\
  \n![](img/0151410972a5c5ea0aab26416e44b1da_65_0.png)\n\n五大主要字体家族是：\n\n- 1. Serif\n\
  - 2. Sans-serif\n- 3. Cursive\n- 4. Fantasy\n- 5. Monospace\n\n在“Serif”旁边，另一种流行的字体家族是无衬线体或无衬线。无衬线字体是指在笔画末端不包含小字符装饰（衬线）的字体。该词源自法语单词“sans”，意为“没有”。\n\
  \n无衬线字体现在已成为在屏幕上查看的通用正文的标准字体。这部分是由于屏幕分辨率无法清晰显示（衬线）装饰，并且“无衬线家族”中已创建了许多专门用于屏幕显示的字体，例如以下名为“Helvetica”的示例。话虽如此，不要否定“衬线”家族的字体，因为这些也是流行的网络字体选项。\n\
  \n![](img/0151410972a5c5ea0aab26416e44b1da_65_1.png)\n\n已针对这些字体家族中字体的可用性进行了大量测试，尤其是在计算机屏幕上显示时。由于字符必须适应屏幕上相对较小的像素网格，设计师认为无衬线字体更自然地适合数字化以供屏幕查看。\n\
  \n字体几个世纪以来一直是美化纯文本的流行方法。你可能会惊讶地知道，你电脑上安装的许多字体比你想象的要老。例如，维基百科引用称，衬线字体“Times New Roman”是由英国报纸“The\
  \ Times”于1931年委托制作的，而“Helvetica”首次亮相于1957年。\n\n## 字体及其对网站用户的影响\n\n网页设计中最重要（也常被忽视）的领域之一是文本大小和字体选择的使用。许多缺乏经验的设计师未能意识到这些因素对访客首次在网站页面上的体验可能产生的影响。这反过来可能会对流量转化率和网站访客的跳出率产生很大影响。\n\
  \n当然，你在整个网站上使用的语言需要具有信息性、通顺且对访客有兴趣。然而，如果这种“精彩内容”被包裹在过大或过小的文本大小中，并且用户发现难以阅读，那么这些用户很可能会离开你的网站且不再返回。同样，如果你对文本大小和字体样式进行了思考和考虑，那么这可能有助于提高访客在网站页面上停留的时长以及可能的回访率。\n\
  \n![](img/0151410972a5c5ea0aab26416e44b1da_66_0.png)\n\n视觉外观的偏好始终因人而异，而字体的可读性可能会决定其在特定受众上的适当使用。每种字体都会给用户带来某种形式的视觉情感，有些字体可以传达“请认真对待我”的情感，而另一些则在阅读文本时营造出“放松”的感觉。\n\
  \n如果你要去参加工作面试，你可能会花时间根据职位要求相应地打扮。呈现方式就是一切；同样适用于网页中使用的字体。字体吸引注意力；它们为所装饰的文本设定基调和情感。更改字体，你就可以从在网页中营造随意感转变为正式感，从杂乱无章到时尚，从老式到现代，等等。\n\
  \n字体是为服务文本而存在的。它们应易于阅读（尤其是在正文中使用时），并营造出一种低调的风格，不会压倒读者。许多字体网站将其字体归类为有用的组别。如果你想在选择网站字体时获得帮助，请查看\
  \ http://www.esperfonto.com/ 上的字体辅助工具。\n\n## 哪种字体最好用？\n\n当谈到字体和字形时，有很多选择。在热门搜索引擎中搜索“fonts”给我带来了\
  \ 50,500,000 条结果，轻松超过 100,000 种不同的字体。\n\n在你出去购买新硬盘来安装所有这些字体之前，需要注意的是，只有少数字体才被归类为易于在网络上阅读的字体。这些字体在大多数计算机操作系统上都可用，并且在屏幕上查看时看起来不错（并且易于阅读）。\n\
  \n如果你是设计师，那么你很可能已在电脑上安装了网络安全的主要字体组。这些字体在购买电脑时就已包含在内。通过访问一些流行的字体下载网站，你可以继续安装大量额外的字体。然而，如果最终用户在查看网站时没有在自己的电脑上安装这些有趣且定制的字体，那么在我们的网站上指定这些字体就没有意义了。如果没有相同的字体可用，他们就看不到我们所看到的内容。因此，在选择字体时，我们需要从“流行字体家族”列表中选择，以便覆盖大多数网站用户。\n\
  \n“网络上什么字体最好？”这个主题很有趣且冗长。请记住，对于正文文本，最好选择安全的做法，使用以下流行选择之一：\n\n### Sans-serif fonts\n\
  \n该家族的字体如下：\n\n#### Verdana\n\nVerdana 由微软于1996年设计。其目的专门用于屏幕使用。没有衬线和宽间距使这种字体成为网络流行的选择。\n\
  \n![](img/0151410972a5c5ea0aab26416e44b1da_68_0.png)\n\n#### Arial and Helvetica\n\
  \nHelvetica（适用于 MAC）和 Arial（适用于 MAC 和 Windows）是一种由瑞士设计师在50多年前创建的常见字体样式。尽管是两种不同的字体，但它们在属性上相似，Arial\
  \ 由微软创建为该风格的版本。Arial 和 Helvetica 是使用最广泛的无衬线字体之一。\n\n![](img/0151410972a5c5ea0aab26416e44b1da_68_1.png)\n\
  \n#### Trebuchet MS\n\nTrebuchet MS 是为屏幕使用而开发的，并在 Windows 和 MAC 系统上很常见。它常用于大标题，有些人认为它对于正常大小的印刷来说没有\
  \ Verdana 可读性高。最好试用一下，看看你怎么想！\n\n![](img/0151410972a5c5ea0aab26416e44b1da_68_2.png)\n\
  \n#### Lucida Sans family\n\nLucinda Sans Unicode（Windows）和 Lucinda Grande（MAC）并非为网络创建，但在屏幕上阅读时却出奇地清晰。Lucinda\
  \ Grande 是 MAC 操作系统使用的字体选择。它们被认为是无衬线家族中最具书法特色的字体。\n\n![](img/0151410972a5c5ea0aab26416e44b1da_68_3.png)\n\
  \n### Serif fonts\n\n该家族的字体如下：\n\n#### Times New Roman / Times\n\nTimes New Roman（Windows\
  \ 和 MAC）和 Times（MAC）主要是约80年前基于离线印刷的字体。它不是屏幕的最佳字体，但在 CSS 文件中通常是很好的第二选择，因为它是如此普遍的计算机字体。\n\
  \n![](img/0151410972a5c5ea0aab26416e44b1da_69_0.png)\n\n#### Georgia\n\nGeorgia\
  \ 是微软委托的字体；同样，它是专门为屏幕制作的。尽管是衬线字体，Georgia 在屏幕上查看小文本和大文本时往往表现良好。设计师经常用这种字体替代 Times\
  \ New Roman，因为它具有更佳的网络查看属性。\n\n![](img/0151410972a5c5ea0aab26416e44b1da_69_1.png)\n\
  \n#### Palatino Linotype / Palatino\n\nPalatino Linotype（Windows）和 Palatino（MAC）是在60多年前开发的，并非屏幕字体，但它们在网络使用中渲染得非常好。微软分发了这种字体的清晰仿制品；他们称之为“Book\
  \ Antiqua”。\n\n![](img/0151410972a5c5ea0aab26416e44b1da_69_2.png)\n\n之前的字体是推荐用于主要正文文本的字体。然而，有方法可以在网页中显示花哨的自定义字体，让所有网站用户都能查看，而无需在系统上安装字体。\n\
  \n\n\n\n如果你正在寻找各种字体在屏幕上显示效果的示例，可以看看 http://www.typetester.org/ 上的 TYPETESTER 在线工具。这个字体工具允许你输入自定义文本，然后使用多种字体和大小选项进行格式化，并在屏幕上查看输出。有很多工具可以做到这一点，但\
  \ TYPETESTER 是其中的一个很好的例子：\n\n![](img/0151410972a5c5ea0aab26416e44b1da_70_0.png)\n\
  \n## Joomla! 模板与层叠样式表\n\n在我们开始调整 Joomla! CSS 字体之前，有必要简要介绍一下 Joomla! 模板。\n\n### 什么是\
  \ Joomla! 模板？\n\nJoomla! 模板是一组控制网站内容呈现的文件。模板以“正式文件结构”打包，这意味着它们需要满足某些要求才能与 Joomla!\
  \ 配合使用。每个模板文件在生成最终网站设计、结构以及网站页面的交互功能方面都起着至关重要的作用。\n\nJoomla! 模板通常以压缩包格式打包，并使用 Joomla!\
  \ 内置的上传/解压功能进行安装。它们形状和大小各异，其设计方式使得在安装并激活后，它们会按照指定的结构和设计来显示你的 Joomla! 内容：\n\n![](img/0151410972a5c5ea0aab26416e44b1da_71_0.png)\n\
  \n使用模板有许多好处，包括：\n\n- 新模板可以立即应用于你的网站内容。这种灵活性意味着你可以轻松地为网站提供完全不同的设计。\n- 通过使用多个模板，可以为你的网站应用多种样式。如果你希望为\
  \ CMS 的不同区域提供不同的设计布局，那么这是一个重要功能。\n- 模板包含所有 CSS 和网站样式。这些都是自包含的，并且可以包含覆盖。通过进入“模板区域”，你可以轻松地对当前模板进行调整，并将自定义更改包含到此文件夹中，从而保护“Joomla!\
  \ 核心框架”。\n\nJoomla! 模板的一个重要样式元素是 CSS。这些 .css 文件包含重要的布局和样式信息，它们有助于你的 Joomla! 网站设计。\n\
  \n## 模板 CSS\n\n层叠样式表是网页开发人员最好的朋友！它们使我们能够保持网站样式完全一致，并提供比纯 HTML 更多的布局和设计选项。\n\n在 CSS\
  \ 出现之前，HTML 文档中几乎所有的样式都包含在 HTML 代码中。颜色、布局、样式、字体等都必须具体列在代码中，而且经常在整个 HTML 文档中重复出现：\n\
  \n```\n<html>\n<body>\n<p><font size=\"2\" face=\"Verdana\">\nThis is a paragraph\
  \ of text.\n</font></p>\n<p><font size=\"5\" face=\"Times\" color=\"red\">\nThis\
  \ is another paragraph.\n</font></p>\n</body>\n</html>\n```\n\n这里使用一种较旧的 HTML 方法对文本进行样式设置，其中样式位于\
  \ HTML 代码内部。\n\n通过使用 CSS 方法，我们可以将大部分样式信息放入单独的文档（.css 文件）中。这些信息可以在 HTML 中轻松引用，从而提高效率并大大简化\
  \ HTML 代码。\n\nHTML 代码如下：\n\n```\n<html>\n<body>\n<p>This is a paragraph of text.</p>\n\
  </body>\n</html>\n```\n\nCSS 代码如下：\n\n```\np {\n    font-family:Helvetica ,Arial,sans-serif;\n\
  \    font-size: 1em;\n    color: #000000;\n    text-align: left;\n    width: 100%;\n\
  }\n```\n\n前面的 HTML 和 CSS 代码展示了 p 标签的样式。\n\nCSS 信息可以嵌入到 HTML 文档中，但对于 Joomla! 模板，它通常包含在单独的文档中。Joomla!\
  \ 模板通常包含多个 CSS 文件来分离设计元素。使用 CSS 时，可能会为手持设备使用单独的样式表以适应较小的屏幕分辨率，也可能仅针对 Internet Explorer\
  \ 6 浏览器使用自定义样式表，等等。你的 Joomla! 模板可以包含代码，根据用户用来查看网站的设备类型，告诉浏览器加载哪个样式表。\n\n![](img/0151410972a5c5ea0aab26416e44b1da_73_0.png)\n\
  \nJoomla! 模板 CSS 文件通常位于以下目录：`/templates/yourtemplate/css/template.css`。如果你使用的是预构建的\
  \ Joomla! 模板，你可能会在 CSS 目录中看到多个 CSS 文件。需要注意的是，这些 CSS 文件的名称可能因 Joomla! 模板而异，但 `template.css`\
  \ 文件是主 CSS 文件的标准命名约定。某些所见即所得编辑器依赖此命名约定才能正常工作。\n\n我们可以用一整本书来介绍 CSS 的复杂性。然而，在本章中，我们只重点介绍\
  \ font 属性及其可用值。\n\n## CSS 字体属性\n\n让我们来看看使用 CSS 时可以用来操作文本的众多属性：\n\n### 字体族\n\n字体族属性是元素字体名称的优先级列表。指定多个字体是一种好的做法，以防用户的计算机系统未安装你所指定的字体。在\
  \ CSS 中，浏览器会使用它识别的第一种字体；因此我们总是按优先级顺序列出字体族：\n\n```\nbody {\n    font-family: Arial,Courier,sans-serif;\n\
  \    line-height: 1.3em;\n    margin: 0px;\n    font-size: 12px;\n    color: #333;\n\
  }\n```\n\n在前面的示例中，字体 Arial 将优先于 Courier 使用。\n\n有两种类型的 font-family 值：\n\n- 1. **字体族名称**\n\
  \  字体名称。例如：Helvetica、Courier、Arial。\n- 2. **通用字体族**\n  五种通用字体类别之一的名称。例如，serif、sans-serif\
  \ 等。\n\n在 Joomla! 模板 CSS 文件中，字体族通常应用于 body 标签。这指定了用于网站正文文本的主要字体。如果你需要对其他 Joomla!\
  \ 文本元素进行额外样式设置，那么我们可以使用进一步的 CSS 来相应定义。\n\n```\nbody {\n    font-family: Arial,Helvetica,sans-serif;\n\
  }\n```\n\n在前面的示例中，浏览器会查找 Arial 字体，然后是 Helvetica，如果由于某种未知原因用户的计算机设备上没有安装这些字体，那么浏览器将替换为可用的\
  \ sans-serif 字体。\n\n当使用名称中包含多个单词的字体族时，务必用双引号将这些字体名称括起来。虽然某些浏览器可以在没有引号的情况下读取这些字体，但如果单词之间的空格被考虑或忽略，则可能会出现一些问题。\n\
  \n```\nbody {\n    font-family: Arial,\"Times New Roman\",sans-serif;\n}\n```\n\n\
  注意 Times New Roman 使用了引号。\n\n### 字体大小\n\nCSS 中的 font-size 属性设置文本的大小。你可以在 CSS 中使用的字体大小方法可以是绝对固定大小，也可以是相对大小。\n\
  \n- 1. **绝对大小：**\n  - 将文本设置为特定大小\n  - 如果已知固定输出或容器，绝对大小很有用。使用此方法，你可以让文本完全按照你的意愿放置在该定义区域内。\n\
  \  - 在某些浏览器中不允许用户调整文本大小。因此，它被认为不利于可访问性。\n\n- 2. **相对大小：**\n  - 允许用户在所有浏览器中更改文本大小。\n\
  \  - 字体大小基于浏览器中的默认字体设置。用户可以根据需要更改此默认值。\n  - 设置相对于周围元素的文本大小。\n\n关于使用哪种方法的争论，就像哪种字体最适合屏幕一样持续不断。使用\
  \ pt 或 px 的绝对方法已被归类为不符合 W3C 可访问性标准，但它允许你在受限容器中设置文本样式，并具有更多设计控制权。如果文本的布局很重要，那么你可能需要这种样式方法来按需对齐文本。\n\
  \n如果文本可以随意在页面上溢出，并且用户可以根据需要调整大小，那么相对大小是管理字体大小的首选且可访问的方法。相对大小可以使用 em 度量或 % 百分比来完成。\n\
  \n一般规则如下：\n\n```\n1em = 16px = 12pt = 100%\n```\n\n### 认识单位\n\n在 CSS 中，有四种不同的单位可用于测量文本在网页浏览器中显示的大小。\n\
  \n### 使用 em 设置文本大小\n\n为了适应所有浏览器并在你的网站上保持可访问性标准，大多数设计师都在尝试采用 em 相对文本大小方法。这是 W3C 标准首选的文本调整大小方法。\n\
  \nem 大小的工作原理是：1em 等于所讨论元素的当前字体大小。如果你没有在 CSS 的其他区域设置字体大小，那么它将采用用户的默认浏览器字体大小。浏览器中的默认文本大小是\
  \ 16px，通常使用 Arial 或 Times 等字体。这意味着 1em 的默认大小 = 16px。如果你要为 body 设置字体大小，比如 18px，那么\
  \ 1em = 18px。\n\n\n\n\n对于一般正文文本，你可能会看到类似以下 Joomla! CSS 文件的内容：\n\n```\nbody { \n\
  font-family: Helvetica, Arial, sans-serif; \nline-height: 1.3em; \nmargin: 0px 0px\
  \ 0px 0px; \nfont-size: 12px; \ncolor: #333;\n}\n```\n\n一旦正文主字号已指定（如上一个示例所示），你就可以使用\
  \ em 单位将 CSS 中的其他文本元素设置为相对于该字号的值：\n\n```\nh2, .contentheading { \npadding: 0; \n\
  font-family: Arial, Helvetica, sans-serif; \nfont-size: 1.4em; \nfont-weight: normal;\
  \ \nvertical-align: bottom; \ncolor: #333; \ntext-align: left; \nwidth: 100%;\n\
  }\n```\n\n## 使用百分比设置文本大小\n\n使用百分比来调整大小是可行的，正如你预期百分比的工作方式一样。与 em 一样，使用百分比作为样式方法是相对的。\n\
  \n如果父元素的字号为 24px，而子元素的百分比为 50%，那么它将以 12px 的字号显示。\n\n与 em 一样，使用百分比调整大小的一个流行技术是在 CSS\
  \ 的 body 上设置父字号，然后使用百分比来设置其他所有样式。一切都相对于那个已设置的父字号：\n\n```\n.tool-text { \nfont-size:\
  \ 95%; \nmargin: 0;\n}\n```\n\n## 使用像素设置文本大小\n\n像素是用于屏幕媒体的固定大小单位。一个像素等于屏幕上的一一个点，当你使用像素来设置文本大小时，你是在告诉浏览器以确切的像素高度渲染文本。使用像素定义文本大小提供了对文本大小和布局的极佳控制。然而，使用像素不允许为视力障碍用户向上缩放，也不允许为移动设备向下缩放。\n\
  \n使用像素设置文本大小将允许 Firefox 和 Safari 等浏览器保留一定的文本控制，但在通过 Internet Explorer 6 查看时，用户将无法调整这种绝对样式化文本的大小。总而言之，使用\
  \ px 设置字号是一种准确的方法，但请务必考虑 IE 6 缺乏可访问性的问题。\n\n## 使用点设置文本大小\n\n点（pt）通常与打印媒体相关联。点与像素类似，它们是固定大小的，无法按比例缩放。就像像素对屏幕分辨率准确一样，点对纸张也是准确的。\n\
  \n```\n72pts = one inch\n```\n\n在 Joomla! 模板 CSS 中使用 pt 样式并不是好的实践，但在创建单独的 print.css\
  \ 样式表时使用点是很好的。\n\n打印 CSS 的示例可能如下所示：\n\n```\nbody {\n  color : #000000;\n  background\
  \ : #ffffff;\n  font-family : \"Times New Roman\", Times, serif;\n  font-size :\
  \ 12pt;\n}\n```\n\n## 字体样式\n\n“font style” 属性设置你指定字体的样式。\n\n其值包括：\n\n- **Normal**\n\
  \  浏览器将显示正常字体样式\n- **Italic**\n  浏览器将显示斜体字体\n- **Oblique**\n  浏览器将显示斜体（oblique）字体\n\
  \n在 CSS 中书写时，font-style 属性可能如下所示：\n\n```\nbody {\n  font-style: italic;\n}\n```\n\
  \n## 字体粗细\n\nfont-weight 属性设置字体的宽度。例如，文本应显示得有多粗或多细。\n\n其值包括：\n\n- **Normal**\n \
  \ 定义正常字符\n- **Bold**\n  定义粗体字符\n- **Bolder**\n  定义更粗的字符\n- **Lighter**\n  定义更细的字符\n\
  \n你还可以使用 100-900 的值。\n\n这种方法定义了从粗到细的字符，并提供更进一步的控制。作为参考，值 400 等同于 normal，值 700 等同于\
  \ bold。\n\n```\np\n{\n  font-weight: bold;\n}\n```\n\n使用 CSS，你可以定义文档中的每个字体属性，或者将所有值定义为一个简写属性。这简单地称为\
  \ font。\n\nCSS 中的“font” 属性可以包含“line-height”值。此元素允许你设置文本行之间的间距：\n\n```\np\n{\n  font:\
  \ italic bold 900 12px/14px arial;\n}\n```\n\n## 在网页中使用自定义字体的替代方法\n\n好的，我们确实喜欢某种特定的字体，并希望将其用于菜单或标题，但我们要知道读者可能没有在计算机系统上安装该字体。我们可以做什么？\n\
  \n最流行的方法之一是使用图像替代文本。通过使用图像方法，你可以在图形程序（在你选择的字体中）设计你的字体，然后将其放入网站页面。这意味着用户最终会以你选择的字体查看文字。对于\
  \ Joomla! 模板，你经常会看到这种方法用于菜单和模块图标等。\n\n图像替换技术也可以使用名为 FaceLift Image Replacement (FLIR)\
  \ 的 PHP / JavaScript 库来实现，发音为 \"fleer\"。如果用户在机器上未找到字体，该技术会自动将网页上的任何文本替换为自动生成的图片。FLIR\
  \ 是开源的，不需要在服务器上使用其他工具，也不需要在用户浏览器中加载任何插件。FLIR 需要在服务器上安装 PHP 和 GD 图像库。\n\n以下是 FLIR\
  \ 在主页上运行效果的示例：\n\n```\nhttp://facelift.mawhorter.net.\n```\n\n![](img/0151410972a5c5ea0aab26416e44b1da_79_0.png)\n\
  \nScalable Inman Flash Replacement (sIFR) 是另一种方法，用于将短段的纯文本替换为你选择的字体渲染结果。sIFR 方法使用了\
  \ Flash、JavaScript 和 CSS 的组合。sIFR 是一种日益受欢迎的新兴技术。sIFR 也是开源的，并且需要在阅读浏览器中安装 Flash 播放器插件。\n\
  \n实时将特定字体下载到用户浏览器的举措正在开发中，并且浏览器支持正在逐步引入，我相信在不久的将来将会可用。甚至现在有许多 sIFR 扩展可用于 Joomla！\
  \ 这些将在以下部分中提及。\n\n## Joomla! 文本和排版扩展\n\n目前可用的大部分专业 Joomla! 模板都直接内置了“排版”和文本/字体功能。预配置类样式已包含在\
  \ CSS 样式表中，允许最终用户在指尖拥有大量的文本样式选项。\n\n从管理端的“你想使用什么字体？”参数，到包含的 `.class` 样式，你的模板可以通过小的改动呈现出惊艳的新文本外观：\n\
  \n![](img/0151410972a5c5ea0aab26416e44b1da_80_0.png)\n\n目前大多数现代专业 Joomla! 模板都包含预排版的选项，为你的网站页面提供风格和趣味：\n\
  \n![](img/0151410972a5c5ea0aab26416e44b1da_80_1.png)\n\n本着真正的开源精神，有一些可用的 Joomla!\
  \ 扩展。这些扩展旨在通过各种有趣的文本功能增强 Joomla! 模板。\n\n## 前端字号调整器 (M)\n\n此模块允许访问者增加或减少网站页面上的字号。通过\
  \ JavaScript 和 Cookie 的使用，访问者的字体设置会被记住。\n\n此模块包含六种不同的按钮和样式，并且你可以为该模块分配一个类，以便你可以自定义这些以适合你的网站：\n\
  \n![](img/0151410972a5c5ea0aab26416e44b1da_81_0.png)\n\n要利用此扩展，请访问 http://extensions.joomla.org\
  \ 并搜索 \"Font Size\"。\n\n## JsIFR3 (P)\n\n在你的 Joomla! 1.5 网站中使用任何字体。此插件将 Scalable\
  \ Inman Flash Replacement (sIFR) 集成到 Joomla! 1.5 中。\n\n此插件有一个商业版本，但这个非商业版本提供了 14\
  \ 个插件参数设置，以帮助优化你的项目结果：\n\n![](img/0151410972a5c5ea0aab26416e44b1da_81_1.png)\n\n\
  要利用此扩展，请访问 http://extensions.joomla.org 并搜索 \"jsIFR3\"。\n\n## capDropper (P)\n\n\
  capDropper 是一个简单的插件，它使文章的首字母显示为装饰性首字母（drop capital）样式。\n\n可以调整样式以适合你的模板，并且可以在文章级别手动激活或停用该插件。\n\
  \n![](img/0151410972a5c5ea0aab26416e44b1da_82_0.png)\n\n要利用此扩展，请访问 `http://extensions.joomla.org`\
  \ 并搜索 \"capDropper\"。\n\n有许多扩展允许轻松实现“文本调整大小”和“装饰性首字母”功能，以及 sIFR 扩展的商业版本。请访问 `http://extensions.joomla.org/`\
  \ 以查看最新的文本和排版扩展，它们可以为你的 Joomla! 网站增添色彩。\n\n## 字体相关的浏览器支持和可访问性\n\n正如本章前面提到的，用于网站页面的主要正文文本应使用特定数量的字体。选择这少数几种字体的原因是因为它们易于阅读，并且在各种用户计算机系统上可用，因此提供了触达尽可能多受众的最佳机会。\n\
  \n通常符合上述分类的字体被称为“Web 安全”字体。Web 安全字体是一组安装在所有版本的 Windows、MAC 和 Linux 计算机上并通用的字体。作为网站设计师，选择一种\
  \ Web 安全字体可以增加你的内容以所选格式显示的可能性。\n\n以下是公认的 Web 安全字体列表。这些在 Windows、MAC 和 Linux 操作系统上可用：\n\
  \n\n\n\n\n## Web 安全字体列表\n\n- Arial, Helvetica - 无衬线字体\n- Comic Sans MS - 手写字体\n\
  - Courier New, Courier 6 - 等宽字体\n- Georgia - 衬线字体\n- Impact, Charcoal 6 - 无衬线字体\n\
  - Monaco 5 - 等宽字体\n- Lucida Sans Unicode, Lucida Grande - 无衬线字体\n- Palatino Linotype,\
  \ Book Antiqua 3, Palatino 6 - 衬线字体\n- Tahoma, Geneva - 无衬线字体\n- Times New Roman,\
  \ Times - 衬线字体\n- Trebuchet MS 1, Helvetica - 无衬线字体\n- Verdana, Geneva - 无衬线字体\n\
  - Symbol, Σγμμβολ 2\n- Webdings, ♈♉♊♋♌♍\n- MS Sans Serif 4, Geneva - 无衬线字体\n\n微软于\
  \ 1996 年启动了“Web 核心字体”计划。该字体集包含现有字体、微软委托开发的字体，以及部分从 Apple 获得许可的字体。“Web 核心字体”被归类为“Web\
  \ 安全”字体类别。\n\n“Web 核心字体”的设计目标是：\n\n- 支持国际市场\n- 在屏幕上清晰可读\n- 提供多种字体风格\n\n“Web 核心字体”计划包含以下字体。请注意，这些字体的大小均相同。\n\
  \n- Andale Mono\n- Arial\n- Comic Sans MS\n- Courier New\n- Georgia\n- Impact\n\
  - Times New Roman\n- Trebuchet MS\n- Verdana\n- ♈♉♊♋♌♍ (Webdings)\n\n如前文所述，使用 CSS\
  \ 中定义的通用字体族是最安全的选择。还记得我们有哪些通用字体族吗？\n\n- 衬线字体\n- 无衬线字体\n- 手写体\n- 幻想体\n- 等宽字体\n\n\
  在字体族 CSS 定义的最后，应始终指定这些字体族之一，如下所示：\n\n```\nbody {\n    font-family: Arial,Helvetica,sans-serif;\n\
  }\n```\n\n上面的示例中，如果用户的计算机系统中没有 Arial 或 Helvetica 字体，则会加载 sans-serif 通用字体族。\n\n随着\
  \ Web 浏览器的不断发展和字体类型的采用，实时下载和显示特定字体将突破当前“Web 安全”字体的限制。就目前而言，最好选择保守方案（即选择 Web 安全字体），并确保您的网站访问者（无论其使用何种浏览器和操作系统）都能轻松阅读并获取您重要的文本信息。\n\
  \n## 摘要\n\n在 Joomla! 网页中，文本通常是页面上最突出的媒体元素。然而，如果使用了带有内置字体样式的预建模板，通常很少考虑字体类型是否适合目标受众。\n\
  \n本章重点介绍了多种可供使用的字体，以及哪些字体被归类为“Web 安全”字体，从而为用户提供最佳机会，让他们以您设计的样式看到网站文本。\n\nJoomla!\
  \ 模板 CSS 文件是一种重要且强大的样式机制，它使我们能够定义和设置网站文本及其他元素的样式。在 CSS 中，我们可以使用固定文本样式方法，或相对文本样式方法，允许用户根据需要调整网页文本的大小。许多\
  \ Joomla! 模板都包含增强的“排版”功能，包括字体选项和自定义 CSS 样式。此外，在 http://extensions.joomla.org/ 上还有一些优秀的第三方字体扩展。其中一些扩展包含图像替换功能，可为您的\
  \ Joomla! 网站带来令人兴奋的新字体技术。\n\nWeb 安全字体是用于主体文本的安全选择。Web 安全字体种类繁多，可给网站用户带来不同的情感反应。通过为网站选择正确的字体，您可以唤起多种情感，例如让网页文本呈现严肃、幽默或高雅的感觉。您还可以通过提供适当的字体大小和用户可调整文本大小的控件，来增加访问者的“网站停留时间”。请确保在\
  \ CSS 定义中指定字体族，这样即使您指定的字体不可用，浏览器也能选择通用字体族来显示您的网站文本。\n\n# 4. 添加和管理图片内容\n\n除了文本内容，图片是网页中使用最多的多媒体资源之一。它们可用于向读者提供信息和教育，辅助导航，并增强设计和用户的整体视觉体验。\n\
  \n无论您需要在 Joomla! 网站中创建多媒体图片画廊，还是只是将图片添加到文章和模块中，本章都将提供帮助，助您在 Joomla! 网站中有效利用图片内容。我们将讨论：\n\
  \n- 为什么在网站中使用图片\n- 图片格式以及使用哪种格式\n- 在文章和模块中包含图片\n- 创建图片画廊和幻灯片\n- 模板图片\n- Joomla!\
  \ 图片扩展\n- 图片的浏览器支持和可访问性\n\n## 图片及其在网站中的作用\n\n研究表明，图片通过视觉方式展示概念并提供视觉记忆线索，从而增强学习效果。自人类进化以来，我们一直使用图片来描述事物、讲述故事和记录历史。\n\
  \n我曾遇到一些情况，当我和对方之间存在语言障碍时，我们不得不借助铅笔和餐巾纸来进行有效沟通。\n\n图片可以传递信息，而这些信息可能需要数千字才能描述清楚。这种非文本交流方式以及图片所引发的视觉情感，使其成为补充或替代网页文本的理想媒介：\n\
  \n![](img/0151410972a5c5ea0aab26416e44b1da_88_0.png)\n\n上面的图片可以很容易地用千言万语来描述，但这些文字会显得枯燥，并占用网页宝贵空间。而图片只占我们描述所需空间的一小部分，并且本身就能讲述一个故事。\n\
  \n图片不仅能描述故事、时间瞬间或幻想场景；它们还能提供视觉刺激，传达风格或主题，并为观看者营造氛围。许多 Joomla! 模板现在包含大量图形图像，以产生有趣的设计和效果，例如来自\
  \ http://www.yootheme.com 的这个商业示例：\n\n![](img/0151410972a5c5ea0aab26416e44b1da_88_1.png)\n\
  \n如今许多模板在图形上采用圆角边缘或褪色效果，有些还在二维计算机屏幕上创建 3D 视觉效果。这些效果是通过使用阴影和图像分层技术实现的。其他模板则使用图片来创建仅靠图片才能实现的趣味导航效果。\n\
  \n除了图片提供的设计、导航和品牌效应之外，在我们的内容和模块中，我们还使用图片向网站访问者进行广告和沟通。作为 Web 开发人员，一个重要的技巧是要确保我们的图片在要求访问者将其加载到浏览器之前尽可能优化。这能确保良好的用户体验，因为如果网站加载缓慢或图片缺失，这会让访问者非常反感。\n\
  \n## 图片格式以及使用哪种格式\n\n图片通常占 Joomla! 网站的 50%，有时甚至更多。这些加载到浏览器中的图片可以是模板设计的一部分，也可以是加载到模块和文章中的网站图片。为这些图片内容选择适当的格式有助于优化网页加载时间，这是构建多媒体丰富网站时最重要的考虑因素之一：\n\
  \n![](img/0151410972a5c5ea0aab26416e44b1da_89_0.png)\n\n我们可以使用一些简单的规则来选择适当的图片格式。最终文件最重要的标准是大小。上图是使用\
  \ Mac 电脑上的 Adobe Fireworks 导出的。外部图像编辑器，如 GNU 图像处理程序（GIMP），是操作和优化 Web 图片的优秀开源解决方案。可通过访问\
  \ http://www.gimp.org 下载 GIMP。\n\n由于每张图片都需要用户浏览器加载，您在网页中使用的图片质量和数量很容易影响页面加载时间。这反过来会导致最终用户沮丧（尤其是在拨号上网连接上），并造成网站流量流失。\n\
  \n## 数字图像\n\n在进一步探讨文件大小和文件类型之前，有必要提一下数字图像。因为所有网页图片都存储在计算机设备上或通过其查看，所以它们采用数字格式（使用\
  \ 0 和 1 存储的电子文件）。数字图像由微小的元素——像素组成。**像素**是所有数字图像的基础，它们是沿图像长宽方向排列的矩阵中相邻的小方块。\n\n像素非常小，在计算机屏幕上查看图像时，很难直接看到它们：\n\
  \n![](img/0151410972a5c5ea0aab26416e44b1da_90_0.png)\n\n每个像素是包含一种纯色的元素，当所有这些微小色点组合在一起时，就构成了最终图像。通常，单位面积内像素越多，图像质量越高，但在电子设备上用人眼观看时，存在一个临界点，超过该点后您实际上无法看到额外像素给图像带来的更多细节：\n\
  \n![](img/0151410972a5c5ea0aab26416e44b1da_90_1.png)\n\n数字图像的物理尺寸以像素为单位，所有数字图像都有所谓的图像分辨率（图像的高度和宽度像素尺寸）。您可以以多种格式和压缩方式保存数字图像，以优化文件质量和大小。图像编辑程序（如\
  \ Adobe Fireworks）专门设计了 Web 优化和导出选项。\n\n\n\n\n\n## 有损和无损数据压缩\n\n数据压缩是我们数字世界的重要组成部分。文件压缩很有用，因为它有助于减少昂贵资源的消耗，例如传输带宽和计算机硬盘空间。\n\
  \n我们在网络上使用的几乎所有数字图像都已被调整大小或在某种程度上被压缩。在流行的软件编辑程序中编辑或保存文件时，会提供许多选项来帮助优化数字图像。\n\n**有损和无损**压缩是描述文件压缩类型的两个术语，以及在对该文件进行压缩然后解压缩后，文件是否保留了所有原始数据。数字网络图像的首选格式（例如\
  \ JPEG 和 GIF）都属于以下压缩类型之一：\n\n- 1. **有损**\n有损数据压缩是指压缩尝试消除冗余或不必要的文件信息。一般来说，一旦文件被压缩，压缩过程中丢失的信息就无法再次恢复。因此，这是一种可降解的压缩类型，随着文件每次被压缩和解压缩，文件的质量会因代际损失而受损。\n\
  JPEG 和 MP3 文件是使用有损压缩的格式的良好示例。\n\n- 2. **无损**\n无损文件压缩使用的数据压缩保留了原始文件中压缩前每一个比特的数据。\n\
  无损压缩通常在需要文件被压缩然后再次解压缩后获得原始数据的完全相同表示时使用。例如，它用于流行的 ZIP 文件格式。PNG 和 GIF 等图像格式属于无损压缩类型。\n\
  \n现在，不必再深入了解这些压缩类型的更多细节，但以下图像格式都属于这两种压缩类别。通过选择正确的格式来保存和向网站用户展示，可以优化你的网站图像。\n\n##\
  \ 图像格式\n\n现在有数百种图形图像格式，可以理解的是，网站上出现了一些奇怪的图像格式，主要是由缺乏经验的网站设计师上传的，他们只是上传了通过电子邮件收到的任何文件。\n\
  \n刚刚提到“数百”这个词，为了缓解紧张情绪，实际上只有四种主要格式被广泛使用并被认可为适合网络使用。这些格式被认为适合使用，是由于其格式和压缩特性（使最终文件大小和显示质量适合）。这些格式成为标准的另一个重要原因是能够在大多数计算机系统上打开或查看这些文件类型的可访问性。随着互联网将全球数百万用户联系在一起，必须发展出易于查看或保存的通用格式。\n\
  \n以下格式属于有损和无损数据压缩格式：\n\n- **图形交换格式 (GIF)** 发音为“giff”。\n- **联合图像专家组 (JPEG)** 发音为“jay-peg”\n\
  - **便携式网络图形 (PNG)** 发音为“ping”\n- **可缩放矢量图形 (SVG)**\n\n将数字图像从一种格式转换为另一种格式通常是在常见的图形编辑包中执行“另存为”。在此保存或导出过程中，你通常有选择质量、文件大小和像素分辨率的选项。\n\
  \n### GIF\n\nGIF 图像格式属于称为“索引颜色”格式的家族。这意味着它们使用固定数量的颜色来构成图像。文件大小通常与位深度或所用颜色数量相关。这些通常是较小的数字，例如\
  \ 256 或“8 位”颜色，并且通常仅包含两种颜色。为了获得最佳文件大小，你通常希望在仍能保留可接受图像的同时选择尽可能低的位深度。\n\n由于其有限的颜色特性，GIF\
  \ 图像通常非常适合少量纯色平坦颜色，并且通常是徽标、按钮和图形文本的首选格式：\n\n![](img/0151410972a5c5ea0aab26416e44b1da_93_0.png)\n\
  \nGIF 图像对于包含大量颜色的图像，例如照片来说是一种低效的格式。转换为 GIF 格式的照片通常质量较差，看起来斑驳，或由于颜色范围有限而显示锯齿状边缘：\n\
  \n![](img/0151410972a5c5ea0aab26416e44b1da_93_1.png)\n\n### JPEG\n\nJPEG 文件格式旨在高效压缩逼真的真彩色或灰度图像，例如照片。这种压缩类型是为设计而生，是保存和压缩你的照片图像的完美选择。\n\
  \nJPEG 格式通过近似像素块并在压缩过程中保留对人眼最明显的关键细节来发挥其魔力。JPEG 图像可以高度压缩，使你能够以较小的文件大小保存高质量的图片。然而，JPEG\
  \ 格式属于有损压缩类型，这意味着每次你读取、修改和保存 JPEG 图像时，你都会丢失一些信息。这种退化在图像中包含文本时非常明显，例如徽标。即使在保存 JPEG\
  \ 图像时将质量滑块设置为“100”，数据丢失仍然会发生；因此它是无损文件压缩的绝佳示例。\n\nJPEG 是网站上多色或调色图像的优秀图像格式，但如果你希望频繁编辑或更改图像，它并不是保存图像的好格式：\n\
  \n![](img/0151410972a5c5ea0aab26416e44b1da_94_0.png)\n\n### PNG\n\nPNG 是一种相对较新的文件格式，是作为\
  \ GIF 格式的开源继任者而创建的。作为无损压缩类型的一员，PNG 图像最适合可能需要编辑并再次保存的图像。与 GIF 格式一样，PNG 文件格式在图像包含大面积均匀颜色区域时表现出色。PNG\
  \ 格式也非常适合使用透明度，这对于可能叠加在背景颜色上方的徽标或图形来说很重要：\n\n![](img/0151410972a5c5ea0aab26416e44b1da_94_1.png)\n\
  \nMozilla Firefox、Internet Explorer 7 和大多数主要浏览器现在都提供 PNG 支持。许多购买的 Joomla! 模板将包含用于徽标、圆角模块标题以及按钮/图标的\
  \ PNG 图像。\n\n### SVG\n\nSVG 是由 **万维网联盟 (W3C)** 创建的一种新的矢量文件格式。它是为了在网络上显示矢量图形而创建的标准格式。\n\
  \nSVG 是一种基于文本的图形格式，图像及其行为在 XML 文件格式中定义，这意味着它们可以轻松搜索、脚本化并压缩：\n\n```\n<?xml version=\"\
  1.0\" standalone=\"no\"?>\n<!DOCTYPE svg PUBLIC \"-//W3C//DTD SVG 1.1//EN\"\n\"\
  http://www.projectamplify.com/DTD/svg01.dtd\">\n<svg width=\"5cm\" height=\"5cm\"\
  \ viewBox=\"0 0 700 600\"\n xmlns=\"http://www.projectamplify.com/1000/svg\" version=\"\
  1.1\">\n<desc>Example script01 - invoke an ECMAScript function from an onclick event</desc>\n\
  <!-- ECMAScript to change the radius with each click -->\n<script type=\"text/ecmascript\"\
  ><![CDATA[\nfunction circle.click(evt) {\n var circle = evt.target;\n var currentRadius\
  \ = circle.getAttribute(\"r\");\n if (currentRadius == 100)\n circle.setAttribute(\"\
  r\", currentRadius*2);\n else\n circle.setAttribute(\"r\", currentRadius*0.5);\n\
  }\n]]>\n```\n\n由于其基于文本的文件格式，SVG 图像可以通过多种方式与用户交互，并且图像可以与脚本一起使用以在网页和移动设备上触发事件。\n\n\
  除 Internet Explorer 外的所有主要浏览器都提供 SVG 文件支持。然而，Internet Explorer 可用的浏览器插件。此时，关于 SVG\
  \ 的扩展并不多，但有一个有用的 Joomla! 插件称为 XHTML Headers。该插件有助于查看浏览器是否支持基于 XHTML 的技术。有关更多信息，请访问\
  \ http://extensions.joomla.org 并搜索 XHTML Headers。\n\n\n\n\n\n## 在内容文章和模块中插入图片\n\n\
  在接下来的章节中，我们将介绍如何在 Joomla! 内容文章和模块中插入图片。本节假设您对 Joomla! 内容文章的工作原理有基本的了解。\n\n## 使用\
  \ Joomla! 文章图片按钮添加图片\n\n通过使用图片按钮，可以轻松地将图片添加到新的和现有的 Joomla! 文章（和模块）中。图片按钮是一个扩展编辑器插件，在\
  \ Joomla! 新安装时默认配置为开启。当您处于编辑文章界面时，编辑器按钮会显示在内容编辑器窗口下方：\n\n![](img/0151410972a5c5ea0aab26416e44b1da_96_0.png)\n\
  \n需要注意的是，此插入图片的方法与使用 WYSIWYG 编辑器工具栏上的插入图片按钮的方法不同。\n\n要将图片插入到您的 Joomla! 文章中，您需要处于文章编辑模式。通过以下方式之一打开您的文章进行编辑：\n\
  \n- 1. 查看控制面板时，点击\"新建\"文章图标。\n- 2. 点击顶部菜单中的\"文章\"选项，然后点击\"文章管理器\"菜单选项。选择您要编辑的文章，然后点击右上角工具栏中的\"\
  编辑\"图标。\n- 3. 如果您以适当的编辑权限登录到 Joomla! 网站的前端，选择您要编辑的文章，然后点击\"编辑\"工具栏图标。\n\n接下来，我们需要选择图片的放置位置。这通过相对文章中的文本插入图片代码来实现。在编辑器中点击文本内容，您可以将鼠标光标定位到希望图片显示的位置：\n\
  \n![](img/0151410972a5c5ea0aab26416e44b1da_97_0.png)\n\n编辑文章界面上方将加载一个插入图片界面，即 Joomla!\
  \ 媒体管理器：\n\n![](img/0151410972a5c5ea0aab26416e44b1da_97_1.png)\n\n插入图片界面将显示 Joomla!\
  \ 媒体管理器中的所有媒体。它包含以下功能：\n\n- 1. **文件夹导航**\n\n通过使用屏幕左上角的**目录**下拉菜单进行导航。您可以使用此菜单深入子目录，也可以直接点击插入图片主窗口中的可用文件夹。**向上**按钮可快速返回上一级目录：\n\
  \n![](img/0151410972a5c5ea0aab26416e44b1da_98_0.png)\n\n> 您不能导航到高于主\"媒体目录\"的位置，该位置在全局配置设置中定义。\n\
  \n- 2. **选择图片**\n\n只需点击您要使用的图片，**图片 URL** 位置将自动填充该图片在您服务器上的位置：\n\n![](img/0151410972a5c5ea0aab26416e44b1da_98_1.png)\n\
  \n如果您希望使用来自其他 Web 服务器或网站的图片，请在图片 URL 字段中输入该图片位置的完整 URL：\n\n![](img/0151410972a5c5ea0aab26416e44b1da_98_2.png)\n\
  \n### 3. **设置图片属性**\n\n通过\"插入图片\"窗口插入图片时，我们需要考虑三个重要字段（以及**对齐**和**标题**框）：\n\n![](img/0151410972a5c5ea0aab26416e44b1da_99_0.png)\n\
  \n\"插入图片\"窗口包含以下字段：\n\n- **图片 URL** 字段保存图片的位置。这可以是相对于您网站域名的相对 URL（例如，`/images/image.jpg`），也可以是图片的绝对\
  \ URL 路径（例如，`http://www.mydomain.com/images/test.jpg`）。\n- 图片**对齐**下拉选项允许您根据图片周围的文本设置图片的对齐方式。如果设置为左对齐，图片将浮动在文本块的左侧；如果设置为右对齐，图片将浮动在文本的右侧。如果此选项留空，则不会设置图片对齐方式。\n\
  - 图片**描述**字段是 Joomla! 描述，相当于使用 HTML 时的 alt 标签。Alt 描述用于描述图片的\"替代文本\"。alt 属性告知查看者如果图片未加载，他们在页面上错过了什么。这对于使用屏幕阅读器的人，或选择在\
  \ Web 浏览器中关闭图片浏览网页的人特别有用。\n- 图片**标题**字段指定关于图片的附加信息。当用户将鼠标悬停在图片上时，此信息会作为工具提示文本显示给用户。\n\
  - 图片**标题**复选框将使用图片标题，并将此描述作为图片标题输出。这通常显示在图片下方，可以使用 CSS 来调整其外观和位置。\n\n插入图片界面还内置了一个实用的文件上传工具。因此，如果您的图片尚未通过\
  \ FTP 或 Joomla! 媒体管理器上传，您可以在编辑内容文章时选择上传。\n\n上传之前，请确保您已选择要上传新图片的目标目录。要上传，请点击插入图片界面底部的**选择文件**上传按钮：\n\
  \n![](img/0151410972a5c5ea0aab26416e44b1da_100_0.png)\n\n将出现一个界面，您需要在其中导航到需要上传的文件。选择文件后，点击**开始上传**按钮开始上传过程。\n\
  \n插入图片窗口顶部将出现一条消息，告知您上传是否成功。如果上传出现问题，请检查您的媒体目录和子目录是否设置了\"读写\"权限以允许上传。\n\n文件上传后，您可以点击选择该文件，填写图片属性字段，然后点击插入图片窗口右上角的**插入**按钮。\n\
  \n## 使用编辑器图片按钮添加图片\n\n您的 Joomla! 安装中有一个或两个可用的 WYSIWYG（所见即所得）编辑器。可以在用户管理器中基于用户更改编辑器类型。也可以在全局管理中设置站点范围的配置：\n\
  \n![](img/0151410972a5c5ea0aab26416e44b1da_100_1.png)\n\n建议下载这些编辑器，看看哪一个（如果有的话）更适合您的编辑环境。几乎所有这些编辑器都提供插入图片到内容文章的功能，通常通过编辑器工具栏上的图标实现。\n\
  \n在本示例中，我们将使用 Joomla! 默认的 TinyMCE 编辑器：\n\n![](img/0151410972a5c5ea0aab26416e44b1da_101_0.png)\n\
  \n首先选择您要编辑的文章，或创建新文章并进入编辑文章界面。\n\n与使用 Joomla! 图片按钮技术时一样，我们需要将光标定位在文章中的图片显示区域。在编辑器工具栏中，您会看到许多用于执行编辑器功能的图标。查找带有小照片图像的图标：\n\
  \n![](img/0151410972a5c5ea0aab26416e44b1da_101_1.png)\n\n点击此图标后，将打开一个弹出窗口，您可以在其中输入图片位置和属性。此窗口与前面提到的\
  \ Joomla! 图片按钮技术之间的主要区别在于，我们需要在此区域手动输入图片位置，并且无法使用此窗口上传图片：\n\n![](img/0151410972a5c5ea0aab26416e44b1da_101_2.png)\n\
  \n可用的字段如下：\n\n| 字段 | 描述 |\n|---|---|\n| 图片 URL | 图片位置的路径。 |\n| 图片描述 | 图片的替代文本。 |\n\
  | 对齐 | 图片的对齐方式。 |\n| 尺寸 | 图片的高度和宽度。 |\n| 边框 | 图片的边框属性。 |\n| 垂直间距 | 图片周围的垂直间距。 |\n\
  | 水平间距 | 图片周围的水平间距。 |\n\n使用此方法将图片输入到内容文章意味着您必须手动输入网站图片的位置（默认为 /images/stories/）和其他属性到提供的字段中，但它使您无需使用\
  \ HTML 手动输入图片代码。\n\n## 使用自定义 HTML 代码放置图片\n\n根据您是否为 Joomla! 帐户选择了 WYSIWYG 编辑器，您可以选择使用编辑器编辑内容文章和模块，也可以选择使用\
  \ HTML 代码视图格式化您的网站内容。\n\nWYSIWYG 编辑器通常会在您的网站内容中添加额外的字符，尤其是当内容编辑者直接从 Microsoft Word、电子邮件应用程序等文档中剪切并粘贴内容时。它们可以让没有\
  \ HTML 经验的用户拥有添加和更新网站内容的出色功能，但可能会用不需要或冗余的代码使代码变得杂乱：\n\n![](img/0151410972a5c5ea0aab26416e44b1da_102_0.png)\n\
  \n\n\n\n使用HTML和CSS进行图像定位，可以让你根据自己的需求对齐和样式化网站内容。让我们看看如何使用纯HTML将图像添加到内容中。\n\n就像使用所见即所得（WYSIWYG）编辑器插入图像一样，使用HTML时我们执行类似的过程，只不过这次是手动输入图像代码。在HTML中，所有图像都使用<img>标签定义。通过为该标签添加额外属性，可以让它执行相应功能。使用所见即所得编辑器时，我们需要确保图像代码放置在页面上我们希望其显示的位置：\n\
  \n![](img/0151410972a5c5ea0aab26416e44b1da_103_0.png)\n\n在编辑窗口中，将鼠标光标定位到要输入图像的位置。在我们的示例中，我们将图像插入到第二段（中间段落）文本中（注意每个文本块周围都有一个<p>（段落）标签）。浏览器会在文档中图像标签出现的位置显示你的图像。如果我们将图像放在两个段落之间，浏览器会先显示第一段，然后是图像，再显示第二段。在我们的示例中，我们希望图像显示在第二段的开头，与文本内容对齐。\n\
  \n我们将其分解为一个示例，首先从在文档中插入基本的<img>标签开始：\n\n```\n<p>This is an interesting paragraph\
  \ about inserting an image around text</p>\n<p><img>This is an interesting paragraph\
  \ about inserting an image around text </p>\n<p>This is an interesting paragraph\
  \ about inserting an image around text </p>\n```\n\n接下来，我们需要为图像提供位置。这可以通过使用src属性（src代表source，即来源）来完成。该属性的值是你希望显示的图像的来源位置：\n\
  \n```\n<p>This is an interesting paragraph about inserting an image around text</p>\n\
  <p><img src=\"http://www.mydomain.com/image.jpg\" />This is an interesting paragraph\
  \ about inserting an image around text </p>\n<p>This is an interesting paragraph\
  \ about inserting an image around text </p>\n```\n\n请注意，我们现在已在图像标签的末尾添加了`/>`。这是正确结束我们的<img>标签并使代码符合XHTML规范所必需的。接下来，我们需要为图像提供alt（替代文本）描述。这对于告知查看者页面正在加载什么内容非常重要。请记住，一些网页用户会关闭图像并使用屏幕阅读器，因此，对于你添加到网站中的所有图像，alt标签都非常重要：\n\
  \n```\n<p>This is an interesting paragraph about inserting an image around text</p>\n\
  <p><img src=\"http://www.mydomain.com/image.jpg\" alt=\"My Page\" />This is an interesting\
  \ paragraph about inserting an image around text </p>\n<p>This is an interesting\
  \ paragraph about inserting an image around text </p>\n```\n\n如果我们现在点击内容文章上的“应用”（Apply），这段代码将被保存，如果图像位置正确，图像就会显示。上面的代码会先加载图像，然后文本会加载在下方：\n\
  \n![](img/0151410972a5c5ea0aab26416e44b1da_104_0.png)\n\n如果你希望文本环绕图像，我们需要为图像设置一个align属性（对齐方式）。align属性的选项可以是left、right、middle、top和bottom，这会根据图像周围的任何文本块，使图像按照这些值进行对齐：\n\
  \n```\n<p>This is an interesting paragraph about inserting an image around text</p>\n\
  <p><img src=\"http://www.mydomain.com/image.jpg\" alt=\"My Page\"\n```\n\n图像现在看起来像这样：\n\
  \n![](img/0151410972a5c5ea0aab26416e44b1da_106_0.png)\n\n我想包含的最后一种属性是title属性（标题）。当查看者将鼠标光标悬停在图像上时，它会为图像提供一个工具提示标题。标题对于提供附加信息非常有用，并且确实会影响搜索引擎优化（SEO）。现在代码变成：\n\
  \n```\n<p>This is an interesting paragraph about inserting an image around text</p>\n\
  <p><img src=\"http://www.mydomain.com/image.jpg\" alt=\"My Page\" align=\"left\"\
  \ height=\"60\" width=\"100\" hspace=\"5\" title=\"A Nice Clock Image\" />is an\
  \ interesting paragraph about inserting an image around text </p>\n<p>This is an\
  \ interesting paragraph about inserting an image around text </p>\n```\n\n图像现在看起来像这样：\n\
  \n![](img/0151410972a5c5ea0aab26416e44b1da_106_1.png)\n\n如果你想在文章和模块中插入大量图像，则需要对每个要加载的图像执行这些步骤。可以剪切粘贴之前的代码，每次只更改值，但这可能会很耗时。\n\
  \n一些图像属性，例如图像内边距（vspace和hspace），可以在CSS中设置，为所有内容图像创建站点范围的样式表类。这段CSS代码可能如下所示：\n\n\
  ```\nimg { border: 0 none; margin: 3px }\n```\n\n前面的示例将为你网站的所有图像设置边框为0、外边距为3，因此你可能需要更详细地指定CSS属性，以适应你的模板。\n\
  \n## 创建图库和幻灯片\n\nJoomla! 是一个内容管理系统（CMS），主要用于组织和管理网站内容。它内置了许多多媒体功能，但其主要焦点是提供两个作用：强大的CMS功能，以及一个设计良好的框架，允许向系统添加额外功能，从而创建强大的功能。\n\
  \n这些附加功能被称为**扩展**，旨在插入Joomla!核心框架并扩展其功能。关于Joomla!核心CMS，我们已经了解了如何将图像包含到内容项和模块中。然而，图库和幻灯片要求的不仅仅是简单的图像管理，因此需要借助扩展的功能来提供这些特性：\n\
  \n![](img/0151410972a5c5ea0aab26416e44b1da_107_0.png)\n\n现在可用于Joomla!的多媒体扩展数量惊人。我们有能够创建复杂图库、流式传输视频以及编译点唱机式音频功能的扩展。\n\
  \n在仔细考虑本书本节内容的最佳方法后，我们得出了一个选项。那就是重点介绍一些最流行和最有用的图库和幻灯片扩展，并希望这些内容能够帮助你了解使用Joomla!扩展可以实现的高度复杂的图像管理能力。\n\
  \n## 图像管理扩展及其安装方法\n\n在继续介绍第三方扩展功能之前，让我们快速了解一下图像扩展是如何添加到你的Joomla!站点的。\n\n与Joomla!中的大多数操作一样，扩展的安装过程经过了开发团队的仔细考虑，并且非常容易执行。大多数Joomla!扩展都带有自己的安装说明，而这些通用指南将帮助你在站点上安装它们。\n\
  \n> 在安装任何内容之前，请确保复制文件集并备份站点数据库。\n\n出于本示例的目的，我将安装我最喜欢的Joomla!多媒体扩展之一——由RocketTheme开发的RokBox扩展。RokBox是一个由MooTools驱动的幻灯片插件，可让你通过专业的弹出屏幕灯箱效果显示多种媒体格式：\n\
  \n![](img/0151410972a5c5ea0aab26416e44b1da_108_0.png)\n\n安装步骤如下：\n\n- 1. 下载所需的扩展，并将下载内容保存到计算机上。文件将采用.zip格式，也可能是.gzip或.tgz格式，这些格式可能需要在安装前解压：\n\
  \n![](img/0151410972a5c5ea0aab26416e44b1da_109_0.png)\n\n- 2. 登录你的Joomla!管理员控制面板，导航至“扩展”菜单，然后进入“扩展管理器”。页面将默认显示“安装”界面：\n\
  \n![](img/0151410972a5c5ea0aab26416e44b1da_109_1.png)\n\n\n\n\n3. 使用本页上的选择文件按钮浏览计算机上的扩展\
  \ .zip 文件，并在找到文件后，使用上传文件并安装按钮。Joomla! 安装管理器将执行所有工作，如果您的扩展已正确构建，安装程序将把所有文件和文档放置到其正确的目录中：\n\
  \n![](img/0151410972a5c5ea0aab26416e44b1da_110_0.png)\n\n4. 安装成功消息将会显示，以告知您扩展已成功安装。\n\
  \n> 某些扩展的成功文本可能包含指向扩展配置页面的额外链接。\n\n## 图片画廊扩展\n\n以下是用于创建图片画廊的 Joomla! 扩展列表：\n\n###\
  \ 简单图片画廊\n\n简单图片画廊扩展是一个插件：\n\n![](img/0151410972a5c5ea0aab26416e44b1da_110_1.png)\n\
  \n该扩展的工作方式是您在文章中添加一个特殊标签——{gallery}myphotos {/gallery}——以正确标记 myphotos 文件夹中的所有照片进行显示：\n\
  \n![](img/0151410972a5c5ea0aab26416e44b1da_111_0.png)\n\n然后扩展开始工作。创建的画廊包含诸如每个缩略图上的时尚阴影、用于显示原始图像的光箱弹出窗口，以及为每张图像自动生成的缩略图等功能。\n\
  \n通过利用特殊标签方法，您可以在内容文章和网站中显示多个画廊。这为全站范围的简单画廊功能提供了极大的灵活性。\n\n### Expose Flash 画廊\n\
  \nExpose 是一个组件、模块画廊扩展，提供语言支持。它是一个基于 Flash 的工具，用于在网络上展示引人注目的图像幻灯片：\n\n![](img/0151410972a5c5ea0aab26416e44b1da_111_1.png)\n\
  \n该扩展基于名为 \"Expose\" 的独立画廊软件，该软件已发展以提供对 Joomla! 网站的支持。该扩展提供众多功能，包括相册的嵌套、为相册分配缩略图、在线图片上传、离线画廊管理、水印添加以及播放幻灯片。\n\
  \n使用 Expose，您可以直接链接到图像、图像类别或完整的相册：\n\n![](img/0151410972a5c5ea0aab26416e44b1da_112_0.png)\n\
  \n### Phoca Gallery with Slideshow\n\nPhoca Gallery 是 Joomla! 的功能齐全的图片画廊和幻灯片扩展。它是一个带有插件和模块的组件。它也提供语言支持：\n\
  \n![](img/0151410972a5c5ea0aab26416e44b1da_112_1.png)\n\nPhoca Gallery 允许您创建图片类别和子类别，并将图片放入其中。图片可以属于多个类别，这提供了在显示图片时更大的灵活性。\n\
  \n画廊会自动为图片生成缩略图，并提供诸如水印、用户访问、YouTube 支持以及众多画廊效果等附加选项，以多种方式显示您的图片画廊：\n\n![](img/0151410972a5c5ea0aab26416e44b1da_113_0.png)\n\
  \nPhoca Gallery 随附一系列可用的插件和模块。可以将图片画廊和幻灯片同时呈现在您的文章和模块中。甚至还有一个搜索插件，可帮助 Joomla! 在您的图片类别中进行搜索。\n\
  \n### Ozio Gallery2\n\nOzio Gallery 是 Joomla! 组件，可用模块：\n\n![](img/0151410972a5c5ea0aab26416e44b1da_113_1.png)\n\
  \n它可用于借助 Flash 功能和画廊皮肤开发具有有趣效果的复杂图片画廊。这两个功能有效地将此图片画廊组件转变为多种不同的图片画廊选项：\n\n![](img/0151410972a5c5ea0aab26416e44b1da_114_0.png)\n\
  \nOzio Gallery 为您提供直接链接到内容的灵活性，或通过使用 Ozio Gallery 模块将画廊发布到模块位置。该产品包含众多参数，应该能满足任何需要有趣的基于\
  \ Flash 的图片画廊功能并支持幻灯片的人的需求：\n\n![](img/0151410972a5c5ea0aab26416e44b1da_115_0.png)\n\
  \n该扩展还提供从 **flickr** 账户显示照片的能力，并在您的 Joomla! 网站中显示您的 **flickr** 图像：\n\n![](img/0151410972a5c5ea0aab26416e44b1da_115_1.png)\n\
  \n### JoomGallery\n\nJoomGallery 是具有语言支持的 Joomla! 组件、插件和模块：\n\n![](img/0151410972a5c5ea0aab26416e44b1da_116_0.png)\n\
  \nJoomGallery 提供许多功能，包括定义画廊的子类别、批量上传图片、用户对类别的访问权限、可配置的水印、幻灯片支持，等等：\n\n![](img/0151410972a5c5ea0aab26416e44b1da_116_1.png)\n\
  \n## 图片幻灯片\n\n用于创建幻灯片的 Joomla! 图片扩展列表如下：\n\n### RokSlideshow\n\nRokSlideshow 是一个\
  \ Joomla! 模块，允许您显示一系列图片和标题，并以可配置的方式在它们之间转换。\n\n![](img/0151410972a5c5ea0aab26416e44b1da_117_0.png)\n\
  \n幻灯片由 Mootools 驱动，提供显示图片之间的淡入淡出、燃烧、擦拭和推送效果。总的来说，该模块能够实现 30 种不同的转换效果。\n\n可以显示图片信息，图片可以包含超链接、标题和描述：\n\
  \n![](img/0151410972a5c5ea0aab26416e44b1da_118_0.png)\n\nRokSlideshow 非常灵活且易于自定义。它是在\
  \ Joomla! 网站上显示图片幻灯片的绝佳方式，也是 Flash 图片画廊播放器的优秀替代品。\n\n### 简单图片旋转器\n\n简单图片旋转器模块提供简单的图片旋转机制。它是\
  \ Flash 图片旋转脚本的轻量级 JavaScript 替代方案，但在淡入淡出转换方面提供了类似的感觉。上一张图片将在几秒钟内淡出到下一张图片，依此类推。它做到了它所说的！\n\
  \n![](img/0151410972a5c5ea0aab26416e44b1da_119_0.png)\n\n### Boncko Cooliris (PicLens)\
  \ 画廊插件\n\n如果您为图片画廊使用 Cooliris，那么 Boncko Cooliris 插件等扩展将非常适合您：\n\n![](img/0151410972a5c5ea0aab26416e44b1da_119_1.png)\n\
  \n您可以通过使用特殊标签 {boncko}/img_dir/{/boncko} 在文章中轻松添加 Cooliris 图片画廊。此插件将从 /img_dir/\
  \ 目录插入所有图片和 Flash 视频文件到您的 Joomla! 内容中，使您的图片画廊看起来很棒。\n\n这意味着您可以将图片画廊存储并组织在 Joomla!\
  \ 站点外部，并吸入您想要的内容。Boncko Cooliris 插件甚至可以在您的图片画廊处于活动状态时播放音频曲目。\n\n其中一些已被突出显示，因为它们是流行的\
  \ GPL 扩展，为创建图片画廊和幻灯片功能提供了极大的灵活性。\n\n在 http://extensions.joomla.org 上有许多其他图片画廊扩展可用：\n\
  \n![](img/0151410972a5c5ea0aab26416e44b1da_120_0.png)\n\n每周都有许多新扩展可用。其中一些是免费的 GPL，一些是商业扩展，还有一些需要俱乐部会员资格才能访问。无论它们是免费还是商业实体，我希望您能为您的图片画廊和幻灯片需求找到解决方案。\n\
  \nJoomla! 扩展通常提供在文章或模块中创建画廊和幻灯片的图片解决方案。您可能还有许多其他图片加载到网页中，这些通常包含在您的模板中。\n\n## 添加和管理图片内容\n\
  \n### Joomla! 模板图片\n\nJoomla! 模板控制您 Joomla! 网站的整体外观和布局。它们提供将通用元素组合在一起的框架，并提供模板布局与模块和组件交互的粘合剂。\n\
  \nJoomla! 为您的网站的前端和后端（管理）都使用模板。安装 Joomla! 时，它附带一组默认模板，如您所知，网络上可以找到数百个，如果不是数千个 Joomla!\
  \ 模板。其中一些功能丰富且是商业模板，一些是不收费的并在各种许可下发布。\n\n模板利用定义的<|message|>\n结构，这允许所有模板元素正确地相互交互：\n\
  \n![](img/0151410972a5c5ea0aab26416e44b1da_121_0.png)\n\n您可以制作自己的 Joomla! 模板，现在在\
  \ http://www.joomla.org 上有许多教程可用，还有一些专门的 Joomla! 模板开发书籍，例如 *Joomla 1.5 Template\
  \ Design, Tessa Blakey Silver, Packt Publishing*。更多信息可在 http://www.packtpub.com\
  \ 查看。\n\nJoomla! 模板的一个重要作用是包含并加载站点样式表。这些有助于在站点中定位模板元素。现代 Joomla! 模板中这些元素中日益增多的部分是脚本、样式信息和图片。\n\
  \n让我们快速看一下可用于 Joomla! 的流行内置模板之一：\n\n![](img/0151410972a5c5ea0aab26416e44b1da_121_1.png)\n\
  \n\n\n\n## 添加和管理图片内容\n\n很容易看到许多图片共同构成了这个模板。我们有用于标志的图片，以及用于方框的圆角图片。以下是该模板在禁用图片的情况下加载在浏览器中的样子：\n\
  \n![](img/0151410972a5c5ea0aab26416e44b1da_122_0.png)\n\n前面的示例使用的是相对简单的模板，但你可以看到模板图片如何协同作用，极大地增强了网站设计。Joomla!\
  \ 模板的发展正在每月不断前进，许多公司每月都会推出极其专业的模板供购买。\n\n这些商业模板通常包含预设的颜色主题和样式，提供了在几秒钟内更改网站配色方案和布局的能力。这种灵活性为管理员提供了强大的功能来为其网站创建新的外观，但也意味着一旦管理员决定了颜色选择等因素，一些模板可能包含大量从未使用过的脚本和图片。过去通往模板图片文件夹的简单路径，现在通常变成模板中包含图片文件的多个目录：\n\
  \n![](img/0151410972a5c5ea0aab26416e44b1da_122_1.png)\n\n## 如何调整你的模板图片\n\nJoomla!\
  \ 模板的图片通常位于 `<你的Joomla主文件夹>/templates/<你的模板>/images` 目录中。如果你想调整模板中的某些图片，最简单的方法是在网站浏览器中查看模板，然后对图片进行必要的调整。\n\
  \n值得一提的是，许多Web开发人员都在本地开发他们的网站。通过在计算机上设置localhost服务器环境，可以轻松创建本地开发流程。MAMP for MAC和XAMPP\
  \ for Windows等工具提供了运行本地服务器环境所需所有组件的简便软件安装。如果你还没有在本地工作，请花两分钟了解这些程序，因为它们不仅节省了你的时间（因为不需要连接实时Web服务器），而且在开发时也提供了信心，因为你永远不会在实时网站上操作：\n\
  \n![](img/0151410972a5c5ea0aab26416e44b1da_123_0.png)\n\n> 有关localhost开发的更多信息，请参见第9章《Joomla!多媒体项目》。\n\
  \n查找和操作网站图片最简单的方法之一是使用浏览器元素检查器工具（如Firefox的Firebug或Safari的Web Inspector），或者直接在Web浏览器中右键点击图片，并选择**查看图像**。此选项可能因使用的浏览器而异，但大多数浏览器都提供了查找图像位置（URL）或在新浏览器标签页中打开图像的功能：\n\
  \n![](img/0151410972a5c5ea0aab26416e44b1da_124_0.png)\n\n你的图像URL可能类似于：`<你的Joomla主文件夹>/templates/<你的模板>/images/logo.png`。这种图像URL方法让你知道路径，以便你可以找到所需的图像。\n\
  \n有数百种可用的图像处理程序，我们无法在这本书中详细介绍图像处理。然而，如果在调整图像时遵循以下规则，你就走在正确的轨道上：\n\n- 复制原始文件。例如，如果你的文件名为`logo.png`，则将原始文件命名为`logo.png.orig`（或类似名称），以便你始终保留该原始文件的副本。或者，如果你将经常编辑你的网站，可以考虑使用SVN或Git等版本控制系统。\n\
  - 在编辑文件之前，记录文件名、大小和格式。\n- 除非你是专业人士，否则始终保留与原始图像相同的图像格式。如果此图像在CSS或原始代码中被引用，你的新图像名称将不同，图像将不再显示。\n\
  - 保存图像时，请尽量确保文件大小与原始大小相同或尽可能接近，通过图像优化来实现。\n- 如果你更改了图像尺寸，请检查是否有CSS变量或其他代码可能指定了物理文件尺寸。\n\
  \n对于大多数模板，你将调整的第一个文件之一是模板标志。更改标志的过程与前面的步骤完全相同。\n\n我简要提到了Web检查工具的使用。其中最常见的工具之一是可用于Firefox\
  \ Web浏览器的工具。这叫做Firebug。请访问 http://getfirebug.com/ 获取更多信息。Firebug允许你在任何Web页面上编辑、调试和检查CSS、HTML和JavaScript：\n\
  \n![](img/0151410972a5c5ea0aab26416e44b1da_125_0.png)\n\nFirebug允许你在浏览器中实时检查Web元素并编辑这些元素。例如，如果你想将标志左右移动或上下移动一点，只需检查图像标志元素，然后调整定位该元素的相应CSS。这只是Firebug工具功能的简要示例，但当你需要解决错误等问题时，它的实用性就显现出来了。如果你热衷于增强和开发你的Joomla!\
  \ 模板，我建议像Firebug这样的工具，它会真正帮助你！\n\n值得注意的是，Internet Explorer和Safari也有它们自己的“元素检查器”版本。\n\
  \n## 浏览器支持和图像可访问性\n\n几乎所有Web浏览器现在都提供图像支持。然而，在网站内容中使用图像时有一些需要考虑的因素。W3C可访问性指南强调了为非文本内容提供文本支持（或文本等效物）的重要性。\n\
  \n文本等效物的威力在于它们能够为残障群体以及使用各种技术查看网页内容的人提供“信息和支持”的能力。\n\n使用图像时，使用文本替代是一种确保尽可能广泛的受众能够访问你的Web内容的可靠方法。文本替代可以被屏幕阅读器以视觉方式读取，文本大小可以调整以便查看，内容可以打印出来以盲文阅读等等，这就为提供替代文本内容提供了有力的论据。\n\
  \n其次，当我们使用图像时，重要的是指定alt和title标签信息，这样在浏览器中关闭图像的用户可以看到解释应该加载什么的“替代文本”。标题标签为用户提供清晰的工具提示，这两个标签的结合可以增强可访问性和搜索引擎优化：\n\
  \n![](img/0151410972a5c5ea0aab26416e44b1da_126_0.png)\n\n直到最近，像Internet Explorer这样的浏览器不提供图像透明度支持，也不支持PNG文件扩展名。Web开发人员必须使用变通方法才能向使用这些浏览器查看其网站的用户显示PNG文件。现在Internet\
  \ Explorer 7和8都将PNG支持作为标准。SVG是一种相对较新的格式，对于Internet Explorer浏览器而言，它也需要浏览器插件。然而，Web浏览器每天都在改进，其中对各种图像格式的支持也是如此。\n\
  \n## 总结\n\n图像是重要的通信元素。它们用于讲述故事、展示事实、广告和销售，并以情感感受在视觉上吸引用户。我们的Joomla! 模板通常包含许多图像，这些图像创建出赏心悦目且复杂的设计。\n\
  \n图像在网站中的使用发展迅速，从扁平的单色图像发展到支持透明度和无损压缩的高保真高质量格式。没有它们，Web就不会一样了。宽带和连接速度的提高使得精美的图像库脚本得以发展，其中许多被整合到强大的Joomla!\
  \ 图像扩展中。现在是在你的Joomla! 站点上显示图像和画廊的最佳时机。\n\n调整现有模板图像或为网站创建新图像时要仔细考虑。图像文件大小和优化是对网站用户的重要考量。使用良好的优化工具和经验将有助于为你的网站提供高质量图像，同时减少页面加载时间。\n\
  \n由于用户能力和残障的多样性、连接速度的差异以及访问万维网的硬件种类繁多，考虑图像的正确使用并为那些无法或选择不查看图像的人提供替代方案是非常重要的。使用alt和`title`标签以及height和width属性都是将图像加载到你的网站页面时的最佳实践。\n\
  \n\n\n\n# 在您的 Joomla! 网站中使用音频\n\n音频是一种强大且富有感染力的媒体元素。大多数人类使用音频作为主要的交流和听觉形式。它被定义为我们主要的感官之一。对于听力良好的人来说，我们的日常生活被成千上万的声音所包围，这些声音在有意识和无意识层面影响着我们。\n\
  \n互联网与音频有着非常成熟的关系。互联网一直是音频的完美传输媒介，这些元素帮助重新定义并迅速发展了各自的技术和行业。\n\n在本章中，我们将探讨在您的 Joomla!\
  \ 网站中使用音频。您将了解：\n\n- 音频是什么\n- 音频与互联网\n- 音频格式\n- 在 Joomla! 文章中嵌入和显示音频\n- 为 Joomla!\
  \ 创建音频播客\n- 第三方音频扩展\n- 浏览器支持和音频可访问性\n\n### 什么是音频？\n\n**音频**是“声音”，可被人类耳朵探测到。声音是空气的压力波，我们之所以能听到，是因为我们的耳朵设计为对这些波敏感。\n\
  \n对于人类来说，听觉通常在大约 20 Hz 到 20 kHz（20,000 Hz）的范围内被检测到。20 Hz 是我们能解读的最低音调（bassi est sound），20\
  \ kHz 是最高音调。众所周知，随着人类年龄增长，我们听觉感知的较高范围往往会退化。\n\n互联网的一个重要元素是我们用来与之交互的工具。个人电脑现在已成为多媒体套件，提供强大的音频录制和播放功能，这些功能过去只有专业录音棚才能使用。由于电脑屏幕是视觉媒介，音频的使用对于“视力受损”的人来说是完美的传输媒介，网络音频已成为向某些残疾人士传递信息的一种解决方案：\n\
  \n![](img/0151410972a5c5ea0aab26416e44b1da_131_0.png)\n\n上图取自 `http://www.w3.org`。它展示了网页中音频摘录的可访问性方法。\n\
  \n### 音频格式\n\n就像视频一样，存在数百种音频格式用于录制和播放数字声音和音乐文件。其中许多依赖软件，需要特定程序才能播放该特定文件。当试图为最广泛的受众提供音频时，这些格式用处不大，因此我们将选择范围缩小到几种知名且支持良好的、适合网络使用的格式。\n\
  \n在查看要使用的文件类型之前，重要的是要提到音频是一种数据密集型媒介，其在压缩和存储方式上取得了惊人的发展。这种“数据压缩”使用音频编解码器执行。**编解码器**一词代表压缩/解压缩，即数据发生的处理过程。\n\
  \n### 音频压缩\n\n音频压缩与视频压缩非常相似。两者都使用类似的技术来操纵数据，然后以适合用户播放的容器形式提供。\n\n重要的是要指出，音频文件格式和音频编解码器（或压缩）是两件不同的事情。\n\
  \n### 音频编解码器\n\n音频的压缩和存储方式是通过使用编解码器，这对最终文件大小有重大影响。专业的音频编解码器已问世，可提供质量和文件大小选项的平衡。由于网络托管成本可能变得昂贵以传输数据，编解码器有效地减少了网站上音频文件所需的存储空间和带宽。\n\
  \n编解码器使用算法去除被认为“不重要”的数据，因此文件大小会下降，因为这些额外信息不再存在。一个很好的音频压缩例子是去除超出我们听觉能力范围的数据。因此，如果我们有超出或低于我们听觉能力的非常高或低频数据，对我们来说就没用，所以我们就去掉它。\n\
  \n大多数音频编解码器属于有损压缩家族。这意味着压缩过程中移除的信息无法再恢复。有损算法提供更高的压缩率，主要用于消费类音频设备。它们也引起我们的兴趣，因为衡量最小文件大小（同时保留质量）是在处理网络音频时一个重要的考虑因素。\n\
  \n音频编解码器不一定与其最终文件名或类型相关。音频文件类型如 .wav（在 Windows 电脑上常用）可以使用不同的编解码器编码，例如 GSM、MP3 或\
  \ PCM 编解码器。音频文件类型使用不同的编解码器进行压缩。这通常是由于编解码器的许可和所有权问题。只是为了增加混乱，有些编解码器实际上与文件类型同名，例如\
  \ .mp3 文件格式始终使用“MPEG Layer-3”编解码器。\n\n### 音频文件格式\n\n音频文件格式的作用与我们的视频容器文件类似。音频文件包含数据文件，但通常还包含重要的头信息，如作者、优先级、注释和其他数据。\n\
  \n一些在网络环境中最常用的音频文件格式是：\n\n| 格式 | 描述 |\n|---|---|\n| **MIDI** (.midi) | MIDI 是 **Musical\
  \ Instrument Digital Interface** 的缩写。MIDI 文件非常小，并且得到计算机软件和浏览器的良好支持。然而，MIDI 文件通常是基于数据的音频而非录制的波形，因此使它们很小、易于分发，但不适合音乐文件。\
  \ |\n| **AIFF** (.aif/.aiff) | 由 Apple 开发，AIFF 代表 **Audio Interchange File Format**。这种文件格式在网络音频中越来越受欢迎。AIFF\
  \ 文件使用 QuickTime Player 播放，该播放器可在 Mac 和 Windows 上使用。AIFF 文件可以很好地压缩，同时保持出色的质量。 |\n\
  | **MP3** (.mp3) | **MPEG Layer-3** 格式或许是在网络上使用最广泛的音频文件格式之一。MP3 文件是 MPEG 文件的音频部分，可以将音频压缩到原始文件大小的大约十分之一。这种在保持良好质量的同时的压缩，导致了它们广泛流行。MP3\
  \ 文件可以在许多设备上播放，使其成为跨平台能力的绝佳选择。 |\n| **AAC** (.aac/.mp4/.3gp/.m4a) | 由 Apple 设计为\
  \ MP3 的继任者，**AAC** 通常在相似大小下实现更好的音频质量。AAC 最为人所知的用途是在 Apple iPod 上，它是 iTunes 商店和 Playstation\
  \ 3 使用的格式。 |\n| **WAV** (.wav) | 由 IBM 和 Microsoft 开发，WAV 代表 **Waveform**，是 Windows\
  \ 电脑上的标准音频格式。WAV 不压缩音频数据，这使其不适合网络使用，但通常用于存储未压缩的音频。虽然 WAV 本身不压缩文件，但 WAV 文件可以使用其他编解码器如\
  \ MP3 进行压缩。 |\n| **WMA** (.wma) | WMA 代表由 Microsoft 拥有的 **Windows Media Audio**。其质量和压缩与\
  \ MP3 文件相当，但在所有设备上的可访问性有限。 |\n| **RealAudio** (.rm/.ram) | **RealAudio** 是 RealNetworks\
  \ 拥有的格式。它曾被广泛使用，并帮助塑造了网络上流媒体音频的使用。RealPlayer 是免费的，但由于其专有格式，这种格式似乎有所衰落。 |\n\n###\
  \ 比特率\n\n比特率指的是数据流（在此为压缩音频）传输的速度。这通常以每秒比特数（千比特每秒，Kbps）记录。\n\n在一段时间内能够传输的音频数据越多，音频质量就越好。逻辑上，在录制音频时使用的比特率越高，可用的音频数据就越多，这会导致文件大小更大。\n\
  \n我们需要意识到这一点，因为在导出音频时，可用的选项之一是选择比特率：\n\n![](img/0151410972a5c5ea0aab26416e44b1da_134_0.png)\n\
  \n目前网络音频使用的一个基准是立体声音频每秒 128 比特（**128 kbps**）。根据您的音频数据（可能是语音播客或音乐文件），您可以高于或低于此数值，如果您的音频为单声道格式，比特率可以再次降低。如果您的音乐文件非常重要，并且您认为大多数受众拥有良好的宽带连接，那么提高到\
  \ 160 Kbps 可能是个选择。低于 128 会影响音频质量，但始终值得尝试，看看在保持所需质量的同时文件大小可以降低到多低。\n\n由于有大量音频软件可用，并且现代家用电脑都包含音频系统，您可能已经拥有将音频转换为网站所需格式的工具。诀窍在于以不同格式和压缩率导出文件，然后相互比较，听取差异，并查看文件大小对比。\n\
  \n\n\n\n\n## 如何压缩和编码音频\n\n现在有大量音频编辑和压缩工具可供使用，帮助你操作音频文件。\n\n如果你有特定需求，快速在互联网上搜索即可找到流行的软件。如果你有一个音频文件，想将其优化用于网页，或转换为另一种音频格式，那么可以查看一个\
  \ Windows 的开源解决方案 LameXP，它可以从 `http://www.snapfiles.com/get/lamexp.html` 下载。\n\n\
  LameXP 是 Lame MP3、Ogg Vorbis 和 Nero ACC 编解码器的前端图形界面。它提供了一个易于使用的界面，可通过拖放文件将文件转换为\
  \ MP3、OGG、Wave 和 ACC 格式：\n\n![](img/0151410972a5c5ea0aab26416e44b1da_135_0.png)\n\
  \nLameXP 功能强大但易于使用。下载并安装软件包后，打开它并按照以下简单步骤转换和优化你的音频：\n\n- 1. 在设备上安装必要的编解码器。WAV 文件需要一个，某些其他文件也需要。信息框会引导你完成这些步骤。\n\
  - 2. 将文件拖入 LameXP 窗口，或点击 **Add File** 按钮添加音频文件。\n- 3. 使用顶部选项卡选择你的 **Output Folder**\
  \ 和其他文件设置。**Compression** 选项卡值得注意。在此选项卡中，你可以选择想要的编码类型，以及编码文件的 **Bitrate**。你可以使用\
  \ **Quality** 设置或选择一个 **Bitrate**，选项会根据你选择的单选按钮而变化。\n- 4. 使用 **Encode Now!** 按钮开始编码过程：\n\
  \n![](img/0151410972a5c5ea0aab26416e44b1da_136_0.png)\n\n将鼠标悬停在可用选项上会提供进一步的信息，帮助你做出选择。由于音频的特性，建议使用不同的设置编码文件，然后收听这些结果并决定哪种比特率/质量最适合你的音频。结果会根据文件中的音频类型而有所不同。诸如访谈之类的语音音频在压缩下的反应与包含音乐曲目的音频不同。通过几次测试，你会在音频质量和最终文件大小之间找到一个满意的折中。\n\
  \n最终，尽可能在保留所需质量的同时减小文件大小。\n\n## 在 Joomla! 文章中嵌入和显示音频\n\nJoomla! 的一项非常强大的功能是能够将自定义\
  \ HTML 包含到 Joomla! 文章中。这意味着我们可以完全自定义文章和模块中音频内容的输出，这正是手动将音频插入 Joomla! 网页所需的。\n\n\
  ### 源文件\n\n在向 Joomla! 网站投放音频内容之前，我们需要决定音频的类型和要选择的格式。\n\n正如我们从之前的格式列表中看到的，.mp3 文件格式是一个不错的选择，因为它可以通过众多音频播放器和设备播放。\n\
  \n音频软件应用程序中的导出功能允许各种格式和压缩选项。创建多媒体文件时有一定的试错过程，我只能建议尝试多种设置，然后比较结果，以找到你想要的音频质量，同时获得可管理的大小。\n\
  \n### 编码\n\n你的源素材可能以原始格式或与你决定使用的格式不同的格式存在，因此将其转换为流行的网页格式是一项重要步骤。为最终使用导出音频可能本身就是一本书。如果你遇到困难，那么应使用网页标准，即\
  \ MP3 格式。以下为网页音频 MP3 导出设置的指南：\n\n| Quality | Settings |\n|---|---|\n| MP3 Voice\
  \ Podcast | Mono, 64 Kbps, 44.100 kHz |\n| MP3 Low Quality | Stereo, 96 Kbps, 44.100\
  \ kHz |\n| MP3 Medium Quality | Stereo, 128 Kbps, 44.100 kHz |\n| MP3 High Quality\
  \ | Stereo, 160 Kbps, 44.100 kHz |\n| MP3 Higher Quality | Stereo, 192 Kbps, 44.100\
  \ kHz |\n\n你可以看到比特率的增加提供了每秒更多的数据和更好的音质。不幸的是，这会以更大的文件大小为代价。\n\n### 上传\n\n音频可以通过 FTP\
  \ 上传到你的 Web 服务器，也可以使用内置的 Media Manager。\n\n#### 通过 FTP\n\n打开你的 FTP 程序并登录到你的 Web\
  \ 服务器。在大多数图形化 FTP 程序中，你会有两个视图；一个用于本地文件，一个用于远程文件。\n\n在你的远程文件集中，导航以查看 Joomla! 根目录结构。在此级别创建一个新文件夹。在此示例中，我将它命名为\
  \ audio。浏览你的本地计算机查找要上传的音频文件并将其发送到新的 audio 目录：\n\n![](img/0151410972a5c5ea0aab26416e44b1da_138_0.png)\n\
  \n> 建议在新的 audio 目录中创建一个空白的 .html 文件并上传它。这将有助于阻止任何人直接查看新 audio 目录内的所有文件。如果你无法创建新的\
  \ .html 文件，请复制 images 目录中已有的 Joomla! .html 文件。\n\n![](img/0151410972a5c5ea0aab26416e44b1da_138_1.png)\n\
  \n#### 通过 Media Manager\n\n要通过 Media Manager 上传，请登录管理后台并访问 Content | Media Manager\
  \ 链接。使用左侧的目录结构导航到现有目录，或使用 Create Folder 功能创建新的 audio 目录：\n\n![](img/0151410972a5c5ea0aab26416e44b1da_138_2.png)\n\
  \n上图显示了 Media Manager 页面，左侧为文件夹结构，右侧为文件。\n\n> Media Manager 位置默认为 Global Configuration\
  \ 设置中的设置。通常这是 `/images/stories` 目录。如果你希望在与 `/images` 相同级别创建新的根目录（正如我们使用 FTP 方法所做的那样），那么你需要更改\
  \ Global Configuration 中的默认 Media Manager 路径，然后返回 Media Manager 区域创建新目录。你的音频文件夹不必位于\
  \ Joomla! 文件系统的根目录内，但如果你运行的是繁忙的网站，将图像、视频和音频分开存放有助于组织。\n\nGlobal Configuration 还包含其他媒体设置，例如最大文件上传大小，在使用\
  \ Media Manager 上传音频时可能需要考虑。你 Web 主机服务器上可能存在“PHP max file upload”限制，因此如果 Media Manager\
  \ 遇到困难，FTP / SFTP 将是一个不错的选择。\n\n![](img/0151410972a5c5ea0aab26416e44b1da_139_0.png)\n\
  \n创建音频目录后，只需使用 Media Manager 的文件上传功能将文件上传到所选目录即可。\n\n#### 编辑器\n\nWYSIWYG 编辑器最令人沮丧的事情之一是它们会删除或调整你精心输入的代码。有些比其他更糟，但为了在\
  \ Joomla! 文章中输入任何非简单的 HTML 自定义代码，关闭你的 WYSIWYG 编辑器将符合你的利益。如果你不这样做，那么你的自定义音频代码很可能无法工作。\n\
  \n虽然我刚刚建议关闭编辑器，但我知道它们有时很有用，有些用户离不开它们。一个简单的技巧是创建一个新的超级管理员用户并将其命名为“noeditor”。然后将该用户的\
  \ **Editor** 选择设置为 **Editor – No Editor**。使用这种方法，你可以随时以“noeditor”用户登录。这可以避免经常为一个用户开关编辑器。\n\
  \n## 创建文章\n\n新文章在“Article Manager”视图中创建：\n\n- 点击控制面板上的 **Article Manager** 图标，或在\
  \ **Components | Articles** 菜单链接下。\n- 点击该页面右上角标记为 **New** 的图标。这将打开 **Add Article**\
  \ 页面。\n- 新文章的几个要求之一是页面 **Title**，以及文章中的一些文本。填充这两项后，你就可以点击该页面右上角的 **Save** 或 **Apply**\
  \ 按钮。\n\n## 音频 HTML 代码\n\n音频可以在 Joomla! 文章和模块中以两种方式呈现：\n\n### 直接下载\n\n你可以直接提供指向音频文件的超链接，允许用户下载文件，下载完成后可在浏览器窗口中通过插件播放，或通过\
  \ QuickTime 或 Windows Media Player 等音频播放器应用程序在用户机器上播放。\n\n下载方式是音频内容在 Web 流媒体和嵌入内容变得普遍之前提供的传统方式。直接下载很有用，如果你希望允许用户下载并保存音频内容为文件。提供音频下载的代码是一个指向文件的简单超链接，看起来像这样：\n\
  \n```html\n<a href=\"/audio/sound.mp3\" title=\"Audio of Boats Download (1MB)\"\
  \ >\nListen to my Audio File (1MB)</a>\n```\n\n页面看起来像：\n\n![](img/0151410972a5c5ea0aab26416e44b1da_141_0.png)\n\
  \n\n\n\n\n# 文档中各元素\n\nJSON 计数：4\n\n```json\n{\n  \"direction\": \"horizontal\",\n\
  \  \"contents\": [\n    {\n      \"type\": \"paragraph\",\n      \"markdown\": \"\
  ...\",\n      \"bbox\": [0.1, 0.1, 0.5, 0.2]\n    }\n  ]\n}\n```\n\n在 Joomla! 文章中嵌入音频所需的最小有效代码如下所示：\n\
  \n```\n<object width=\"350\" height=\"50\">\n<param name=\"src\" value=\"audio/sound.mp3\"\
  >\n<param name=\"autoplay\" value=\"true\">\n<param name=\"controller\" value=\"\
  true\">\n<param name=\"bgcolor\" value=\"#F4F4F4\">\n<embed src=\"audio/sound.mp3\"\
  \ autostart=\"true\" loop=\"false\" width=\"350\" height=\"50\" controller=\"true\"\
  \ bgcolor=\"#F4F4F4\">\n</embed>\n</object>\n```\n\n让我们分解这段代码中的各个元素：\n\n| object\
  \ | 用于在网页中嵌入多媒体。 |\n| height and width | 用于定义对象的高度和宽度。 |\n| param | 控制对象的参数。 |\n\
  | src | 文件来源。 |\n| autostart | 设置为 true 或 false，以控制音频是否自动播放。 |\n| controller | 设置为\
  \ true 或 false，以显示或隐藏控制器。 |\n| bgcolor | 用于设置播放器的背景颜色。 |\n| embed | 使用 embed 标签将播放器放置到页面中。\
  \ |\n| pluginspage | 将用户带到插件下载页面，在那里他们可以下载相应的播放器。 |\n\n你会注意到 `<embed>` 标签中的内容与 `<object>`\
  \ 标签中的部分内容相似，这是为了兼容所有浏览器。\n\n前面的代码会将 MP3 文件嵌入到我们的 Joomla! 文章中，前提是音频文件名为 `sound.mp3`，并以\
  \ MP3 格式保存在名为 `audio` 的目录中，该目录位于 Joomla! 文件结构的根目录下（与 `images` 目录处于同一顶层）。\n\n![](img/0151410972a5c5ea0aab26416e44b1da_143_0.png)\n\
  \n前面的代码会使用用户计算机上的默认媒体播放器来播放音频文件。这虽然可行，但无法灵活控制播放器的行为。因此，我们可以在代码中指定播放器，从而控制音频文件的播放器。\n\
  \n现在有许多基于 Flash 的 MP3 播放器；我特别喜欢的是 http://www.flash-mp3-player.net 上的这款，它是一个功能强大的免费\
  \ Flash MP3 播放器，并且具备一些很棒的功能。该网站甚至提供了一个简易代码生成器功能，可以让你轻松生成将播放器嵌入网页的正确代码。如果你使用 flash-mp3-player\
  \ 作为音频播放器，HTML 代码大致如下：\n\n```\n<object type=\"application/x-shockwave-flash\" data=\"\
  http://flash-mp3-player.net/medias/player_mp3_maxi.swf\" width=\"200\" height=\"\
  20\">\n<param name=\"movie\" value=\"http://flash-mp3-player.net/medias/player_mp3_maxi.swf\"\
  \ />\n<param name=\"bgcolor\" value=\"#ffffff\" />\n<param name=\"FlashVars\" value=\"\
  mp3=audio/sound.mp3\" />\n</object>\n```\n\n> 诸如 Flash MP3 Player 之类的音频播放器提供了一种播放外部音频媒体的工具。要播放音频文件，需要正确设置音频文件的路径、文件名及其权限。\n\
  \n![](img/0151410972a5c5ea0aab26416e44b1da_144_0.png)\n\n这段代码将以极少的代码知识和工作量，在 Joomla!\
  \ 文章中加入一个精美的 Flash 音频播放器。如前所述，市面上有许多播放器和在线服务，各有各的功能。其中大多数都是基于 Flash 的播放器，因为近 98%\
  \ 的网民电脑和浏览器都装有 Flash 播放器。\n\n如果你希望进一步操作 HTML 音频代码，`<object>` 标签中还可以包含许多参数。遗憾的是，参数实在太多，本书无法一一介绍。如需更详细的参数列表，请访问\
  \ W3 Schools 网站：http://www.w3schools.com/TAGS/tag_object.asp。\n\n## 使用 Joomla! 插件添加音频\n\
  \n我们已经完成了使用原始 HTML 代码向 Joomla! 文章添加音频文件的繁重工作，现在来看看 Joomla! 音频扩展的强大功能。\n\nJoomla!\
  \ 音频扩展为核心 CMS 提供了多种多样的扩展功能。安装并配置插件后，添加音频只需简单的“几次点击”即可完成。本章后面将重点介绍一些具体的 Joomla! 音频扩展，但下面的示例将向你展示它们对管理员来说有多么强大。\n\
  \n本示例所选的扩展是 JosDewplayer：\n\n![](img/0151410972a5c5ea0aab26416e44b1da_145_0.png)\n\
  \nJosDewplayer 是一个适用于 Joomla! 的 GPL 许可 MP3 音频播放器。它采用基于 Flash 的播放器界面，可获取 MP3 文件并在\
  \ HTML 页面中流式播放。这些文件可以位于你的服务器上，也可以位于远程位置；最新版本支持多文件播放。\n\n要获取适用于 Joomla! 的 JosDewplayer，请访问\
  \ http://extensions.joomla.org/ 并搜索“JosDewplayer”。\n\n> 在向 Joomla! 网站安装任何第三方代码之前，请确保在安装扩展前备份你的网站数据库和文件集。\n\
  \n## 在 Joomla! 网站中使用音频\n\n登录你网站的后台管理，然后点击顶部菜单中的**扩展 | 扩展管理器**：\n\n![](img/0151410972a5c5ea0aab26416e44b1da_146_0.png)\n\
  \n使用**选择文件**上传按钮浏览本地计算机，找到 `josdewplayer_plugin.zip` 文件。选中后，使用**上传并安装**按钮将该扩展安装到你的\
  \ Joomla! 网站。\n\n安装成功后，前往**扩展 | 插件管理器**配置新插件。此插件属于**内容**类型插件，因此你应在此类型下查找“JosDewplayer”。点击该文本即可打开插件编辑页面：\n\
  \n![](img/0151410972a5c5ea0aab26416e44b1da_146_1.png)\n\n左侧的一组字段可让你根据需要重命名插件、启用或禁用插件，并为站点用户设置访问级别。在这些字段下方是**描述**字段，其中包含使用该插件的基本说明。右侧的一组参数可让你自定义**自动播放、背景颜色和自动重播**功能。**插件参数**通常只需设置一次；在本示例中，我们将发布插件，其他参数设置保持不变。\n\
  \n![](img/0151410972a5c5ea0aab26416e44b1da_146_2.png)\n\n> 确保插件已启用，才能正常工作。\n\n![](img/0151410972a5c5ea0aab26416e44b1da_147_0.png)\n\
  \n让我们回到之前创建的 Joomla! 文章，即包含原始 HTML 音频代码和 MP3 播放器代码的那篇。现在我们的扩展已经完成所有工作，我们只需在文章中输入一个插件能够识别的特殊标记——`{play}`——，然后输入音频文件的\
  \ URL 链接，最后再次关闭该特殊标记——`{/play}`。在 Joomla! 文章中输入以下代码：\n\n```text\n{play}/audio/sound.mp3{/play}\n\
  ```\n\n要创建指向该文件的绝对链接，请使用以下代码（将链接替换为音频文件的完整 URL）：\n\n```text\n{play}http://localhost/Joomla1.6/audio/sound.mp3{/play}\n\
  ```\n\n你可以根据音频文件所在的位置使用相对链接或绝对链接。如果链接到外部音频内容，绝对链接非常有用；这也是 JosDewplayer 的一个不错的功能。\n\
  \n在插件参数中全局设置的自动播放、背景颜色和自动重播功能，可以在每次使用标记时被覆盖。例如，要更改默认颜色，可以使用以下代码：\n\n```text\n{play}audio/sound.mp3|#000000\
  \ [BGCOLOR]{/play}\n```\n\n音频播放器现在将显示为：\n\n![](img/0151410972a5c5ea0aab26416e44b1da_147_1.png)\n\
  \n可用参数列表位于插件参数的**描述**字段中。只要你的音频文件路径正确，几秒钟内就能将音频播放器放入 Joomla! 文章。现在，查看你网站的前端页面，即可看到音频通过\
  \ JosDewplayer 插件播放。只需插入此插件特有的简单标记，你就可以在网站中任意多次使用该播放器。使用 Joomla! 音频插件为网站页面添加音频，就是这么简单。\n\
  \n\n\n\n\n在我们开始构建播客之前，让我们先快速了解一下 Joomla! 提供的内置 RSS 功能。\n\n## 什么是 RSS？\n\n术语 RSS\
  \ 代表 **Real Simple Syndication**。它在基本形式上是一种简单的方法，让人们能够及时了解您网站上的新内容。\n\nRSS 现在在网络上非常流行，其用途示例包括：每周最新的笑话、查看是否发布了廉价机票，以及从网站获取最新的新闻发布。\n\
  \nRSS 订阅源可以通过 RSS 阅读器读取，RSS 阅读器可以是基于桌面的、基于网络的，甚至可以在手持设备（如手机）上运行。标准的 XML 文件格式允许信息被发布并被许多程序查看。\n\
  \n用户通过将其 RSS 阅读器中的 **Uniform Resource Identifier (URI)** 输入，或通过点击网页浏览器中的 RSS 图标（如果可用）来订阅可用的\
  \ RSS 订阅源，这将启动向该特定 RSS 订阅源的订阅流程。一旦订阅，RSS 阅读器会定期检查订阅源并下载找到的任何更新，因此可以通知用户该网站的新闻，而无需用户访问网站：\n\
  \n![](img/0151410972a5c5ea0aab26416e44b1da_149_0.png)\n\n## Joomla! 与 RSS\n\nJoomla!\
  \ 1.5 具有创建 RSS 订阅源的一些不错功能，甚至还有更好的功能可以将 RSS 订阅源获取并在 Joomla! 网站内显示订阅源信息。在第 6 章 *在\
  \ Joomla! 网站中包含视频* 中，我们将介绍如何从包含视频内容的 Joomla! 分类中手动创建 RSS 订阅源。可以采用类似的过程来生成音频播客订阅源，但\
  \ Joomla! 不会创建友好的播客 RSS 订阅源，因此我们将利用名为 FeedBurner 的第三方 RSS 服务来帮助我们完成此操作。\n\n## FeedBurner\n\
  \nFeedBurner 是 Google 于 2007 年推出的 RSS 网络订阅源管理服务。它是一项免费服务，为博主、播客和其他网络出版商提供客户 RSS\
  \ 管理工具：\n\n![](img/0151410972a5c5ea0aab26416e44b1da_150_0.png)\n\n我们将利用 FeedBurner\
  \ 服务来帮助提供播客友好的订阅源，这些订阅源链接回我们的 Joomla! 内容。\n\n## 创建新的播客订阅源\n\n以下是使用 Joomla! 和 FeedBurner\
  \ RSS 服务创建播客的分步教程。\n\n## 选择和准备您的音频内容\n\n使用 Joomla!，您可以从服务器交付自己的音频播客文件。在本示例中，我们将把一个自包含的音频文件（称为\
  \ `audio`，格式为 `.mp3`）上传到我们的 Web 服务器。\n\n如果您使用 FTP，只需将 MP3 文件从计算机移动到新目录即可。如果您使用媒体管理器，请确保您位于希望所在的目录，并使用文件上传功能将音频加载到\
  \ Web 服务器上的所需目录。\n\n一旦音频上传完成，我们就可以将其包含在 Joomla! 文章中。\n\n## 禁用 WYSIWYG 编辑器\n\n为了将正确的\
  \ HTML 放入我们的 Joomla! 文章中，最好确保内置的 WYSIWYG 内容文章编辑器被禁用。您可以按照以下步骤轻松完成此操作：\n\n- 登录您的管理后台。\n\
  - 点击名为 **Site | User Manager** 的菜单项。\n- 选择要编辑的用户。\n- 在该用户的参数下，将 **Editor – No Editor**\
  \ 选择为 **Editor** 字段的选项。\n- 点击 **Apply** 或 **Save** 保存设置。\n\n编辑器也可以在全局范围内禁用，方法是访问您的全局配置并将\
  \ **Default Editor** 字段更改为 **Editor – No Editor**。\n\n## 创建分类\n\n按照以下步骤操作：\n\n-\
  \ 登录您的 Joomla! 管理后台并进入创建分类区域，该区域位于 **Components | Articles | Categories** 下。\n-\
  \ 在右上角，点击 **New** 图标，这将加载 **Category Manager: Add Category** 屏幕。\n- 为您的分类命名。对于我们的示例，我将把它命名为\
  \ **Podcast**。**Alias** 可以留空，但请确保分类已发布。如果您愿意，可以为此分类添加描述。\n\n目前我们只需要做到这一点，因此通过点击页面右上角的保存按钮完成流程。\n\
  \n您将看到新分类已创建并显示在分类列表中。\n\n## 创建用于显示音频的文章\n\n下一步是创建一个新的 Joomla! 文章，其中将包含您的音频内容。\n\
  \n- 如果您已在分类屏幕中，点击文章视图的链接。\n- 如果没有，则点击控制面板上的文章管理器图标或转到 Components | Articles 菜单项。\n\
  - 点击页面右上角的创建新文章按钮，输入文章标题，并选择之前创建的 Podcast 分类。\n- 我们现在需要在文章中包含 HTML 代码（请参阅本章前面提到的嵌入和在\
  \ Joomla! 文章中显示音频部分）。\n\n在将复杂的 HTML 代码输入 Joomla! 文章时，请确保您的 WYSIWYG 编辑器未在 Joomla!\
  \ 文章中打开。\n\n一旦音频代码就位，点击 Apply 按钮（右上角）以应用更改并保存新文章。\n\n## 创建菜单链接和 RSS 订阅源\n\n一旦您创建了音频文章（或多篇文章）并将其放置在适用的“音频播客”分类中，就该利用\
  \ Joomla! RSS 订阅源菜单功能了。\n\n创建指向分类的菜单链接是通过转到您希望放置新链接的菜单，例如 Menus | MainMenu，然后点击屏幕右上角的新图标来完成的：\n\
  \n![](img/0151410972a5c5ea0aab26416e44b1da_152_0.png)\n\n由于本节是关于为 RSS 项目创建菜单链接的，我们不会花时间介绍所有菜单参数，但对于我们的\
  \ RSS 菜单链接，最重要的参数是：\n\n- **Title:** 为您的菜单链接输入标题。对于我们的示例，我将菜单链接命名为 **Audio Podcast**。\n\
  - **Type:** 点击 **Change Type** 按钮以打开菜单 **Type** 选项，这将打开一个包含菜单类型选项的光箱。通过点击相应的链接创建一个名为\
  \ **Link to Category** 的新菜单类型。弹出光箱将消失，适当的菜单字段将被填充。\n- **Parameters (Basic) - Category:**\
  \ 您需要选择希望菜单链接指向的分类。\n- **Parameters (Advanced):** 确保 **Show a Feed Link** 单选按钮设置为\
  \ **Yes**。\n\n如果您想填写菜单项的任何其他参数或属性，请随意填写，但前述的是创建我们的新 **Link to a Category** 菜单项的主要要求。\n\
  \n点击该页面上的 **Save** 保存新的菜单项。\n\n## 它是如何工作的\n\n如果您查看网站的前端页面，您现在应该会看到您创建的新菜单链接。如果看不到，请确保您的菜单链接已发布，并且您的菜单模块已发布以在首页显示菜单。\n\
  \n点击此菜单项，这将带您进入分类页面，显示指向您播客文章的链接。\n\n由于大多数现代网页浏览器，如 Safari 和 Firefox，都内置了 RSS 阅读器，一旦您进入此分类页面，您应该会在浏览器中看到\
  \ RSS 图标。在 Mozilla Firefox 和 Safari 中，这将是浏览器 URL 字段右侧的图标。点击它以查看此特定网页的 RSS 订阅源：\n\
  \n![](img/0151410972a5c5ea0aab26416e44b1da_153_0.png)\n\n点击图标后，您可能会收到多个选项：RSS 2.0\
  \ 或 Atom 1.0。这些是聚合语言，将在本书记述的后续章节中介绍。目前，两者都会显示您的新 RSS 订阅源，并允许用户订阅和查看它们。\n\n## FeedBurner\n\
  \n现在有趣的部分开始了。我们将使用 Google 的 FeedBurner 服务创建一个播客友好的订阅源。\n\nFeedBurner 服务位于 http://feedburner.google.com。如果您还没有，您需要使用\
  \ Google 创建一个免费账户才能使用此服务。\n\n当您登录 Google 账户后，访问上述 URL，您将被提示输入 RSS 订阅源位置的框：\n\n![](img/0151410972a5c5ea0aab26416e44b1da_154_0.png)\n\
  \n> 将您播客分类的 URL 粘贴到此框中，而不是实际的 RSS 链接本身。然后确保勾选此框右侧的 I am a podcaster! 框并点击 Next 按钮。\n\
  \n如果您输入的链接是通往 Joomla! 分类页面的有效 URL 链接，FeedBurner 将接受它并带您进入下一步。如果您在链接方面遇到问题，请在 Joomla!\
  \ 网站中创建一个新的菜单链接，该链接直接指向您的“Podcast”分类，点击该链接，复制 URL，然后将其粘贴到 FeedBurner 中。这应该是所需的一切，FeedBurner\
  \ 现在将报告它已从该 URL 找到两个有效的 RSS 链接——RSS 2.0 和 Atom 1.0。这些是不同的聚合语言，对于本示例，我将使用 RSS 2.0\
  \ 选项：\n\n![](img/0151410972a5c5ea0aab26416e44b1da_154_1.png)\n\n\n\n\n\n接下来我们需要为我们的\
  \ feed 提供一个用户可以查看的描述性 **标题**，并提供 **Feed 地址**，该地址将以 `http://feeds.feedburner.com/`\
  \ 开头，然后在末尾加上我们的后缀。对于本示例，我将使用标题 **Amplify Podcasts** 和 Feed 地址 **amp_podcast**。填写完这些信息后，点击\
  \ **Next**：\n\n![](img/0151410972a5c5ea0aab26416e44b1da_155_0.png)\n\n除非您输入到字段中的信息已被分配，否则您应该会看到全新的闪亮播客\
  \ feed：\n\n![](img/0151410972a5c5ea0aab26416e44b1da_155_1.png)\n\n## *在您的 Joomla!\
  \ 网站中使用音频*\n\nFeedBurner 服务为您提供额外的功能来自定义您的 feed，甚至可以自动将其提交到 iTunes。我们需要利用其中之一，因此点击\
  \ **Next**。\n\n在此页面的顶部，确保选中 **Create podcast enclosures from links to: any rich\
  \ media file**。它应该是默认设置：\n\n![](img/0151410972a5c5ea0aab26416e44b1da_156_0.png)\n\
  \n您可以为播客提供描述、一些关键词，甚至将其添加到 iTunes 和 Yahoo! 搜索引擎。然后点击 **Next**。\n\n在此最后一页，FeedBurner\
  \ 为您提供强大的统计数据，让您了解谁在订阅您的播客以及他们点击 feed 中内容的频率：\n\n![](img/0151410972a5c5ea0aab26416e44b1da_156_1.png)\n\
  \n点击 **Next**，我们在这里就全部完成了！\n\n接下来，我们需要让人们知道您的新播客 feed。在您的 FeedBurner 页面中，您应该会看到一个标签为\
  \ Publicize。点击它，然后在左侧菜单中点击标签为 Chicklet Chooser 的项目：\n\n![](img/0151410972a5c5ea0aab26416e44b1da_157_0.png)\n\
  \n滚动到页面底部，您可以在此处复制一些 HTML 代码：\n\n```\nCopy the HTML below for use in your own page\
  \ templates:\n<a href=\"http://feeds.feedburner.com/amp_podcast\" title=\"Subscribe\
  \ to my feed\" rel=\"alternate\" type=\"application/rss+xml\"><img src=\"http://www.feedburner.com/fb/images/pub/feed-icon32x32.png\"\
  \ alt=\"\" style=\"border:0\"/></a><a\n```\n\n复制代码，返回您的 Joomla! 站点，并创建一个新的模块，将此\
  \ HTML 代码粘贴进去，链接到您的新 feed。在您的播客页面上发布它，用户将能够直接订阅您的 feed：\n\n![](img/0151410972a5c5ea0aab26416e44b1da_157_1.png)\n\
  \n继续从您的网站制作播客现在是一个简单的过程。当您想要创建新的播客时，只需创建一个新的 Joomla! 文章并将音频播放器嵌入其中，或创建指向播客材料的链接并将此文章保存到您的“Podcast”分类中。Joomla!\
  \ 和 FeedBurner 将完成其余工作，自动为这篇新文章创建新的 RSS feed 条目。\n\n## 使用扩展进行播客\n\n还有其他方法可以从我们的\
  \ Joomla! 站点进行播客。这些方法涉及使用 Joomla! 第三方扩展的强大功能，而其中最好的工具之一是 Joseph LeBlanc 的“Joomla!\
  \ Podcast Suite”：\n\n![](img/0151410972a5c5ea0aab26416e44b1da_158_0.png)\n\nPodcast\
  \ Suite 扩展包含一个 Joomla! 组件、模块和插件，提供了触手可及的广泛播客工具。您可以快速启动第一个播客，并轻松构建和管理这一持续进行的工作。\n\
  \n我们将在下一节中重点介绍 Podcast Suite 扩展，该节涵盖第三方音频扩展。\n\n## 第三方音频扩展\n\nJoomla! 扩展为我们提供了多种强大的音频解决方案，可以由管理员安装和配置，几乎不需要开发人员的知识。\n\
  \n现在有大量的扩展可用于 Joomla!。对于 Joomla! 站点管理员来说，最困难的决定通常不是找不到一个能满足您需求的扩展，而是从可用选项中找出最合适的。以下部分重点介绍了最受欢迎的非商业第三方音频扩展。\n\
  \n### Podcast Suite\n\nJoomla! 的 Podcast Suite 独树一帜。它“名副其实”，您可以在短短十分钟内在 Joomla!\
  \ 中展示播客：\n\n![](img/0151410972a5c5ea0aab26416e44b1da_159_0.png)\n\n插件会显示 ID3 标签信息，包括标题、专辑名称、曲目长度和文件大小。它还生成一个链接，使用户可以下载\
  \ MP3 文件以及在网页中使用嵌入式 MP3 播放器播放文件。\n\n插件通过在您的 Joomla! 文章中插入易于使用的插件标签来调用。标签如下所示：{music}your/path/to/directory{/music}，它会自动扫描目录中的文件，并在表格列表中输出它们。\n\
  \n**Plugin Parameters** 允许您调整表格的宽度和颜色，替换下载图像图标，并调整列标题：\n\n![](img/0151410972a5c5ea0aab26416e44b1da_161_0.png)\n\
  \n要下载 MP3 Browser，请访问 http://extensions.joomla.org 并搜索“MP3 Browser”。\n\n![](img/0151410972a5c5ea0aab26416e44b1da_163_0.png)\n\
  \n正如您从相关图像中看到的那样，该扩展还具有语言支持。\n\n> 如果您从开发人员网站下载 com_jukebox.zip 文件，请确保先解压缩，然后再上传到扩展管理器。下载文件包含组件和模块，两者都需要安装。\n\
  \n组件允许您为音乐文件创建分类。您可以添加描述、专辑封面和其他音乐信息，以及使用便捷的上传功能上传音频文件和专辑封面：\n\n![](img/0151410972a5c5ea0aab26416e44b1da_163_1.png)\n\
  \n包含的模块将允许您轻松显示音频文件的列表：\n\n![](img/0151410972a5c5ea0aab26416e44b1da_163_2.png)\n\
  \n要下载 Jukebox，请访问 http://extensions.joomla.org 并搜索“Jukebox”。\n\n## 1 PixelOut Audio\
  \ Player\n\n1 PixelOut Audio Player 插件利用了 1 PixelOut Flash Audio Player，并将其打包，以便在\
  \ Joomla! 中作为插件轻松使用：\n\n![](img/0151410972a5c5ea0aab26416e44b1da_164_0.png)\n\n\
  与大多数 Joomla! 插件一样，其美妙之处在于使用的简单性。1 PixelOut Audio Player 只需您在 Joomla! 文章中输入一个代码标签即可，基本上就完成了。此标签调用播放器加载，您将在\
  \ Joomla! 文章中看到一个外观精美的音频播放器。\n\n该插件包含许多参数，真正使其成为首选播放器。这些参数不仅允许您定义音频文件的默认路径，而且您可以完全自定义播放器的颜色以适应您的模板：\n\
  \n![](img/0151410972a5c5ea0aab26416e44b1da_164_1.png)\n\n要下载 1 PixelOut Audio Player\
  \ 插件，请访问 http://extensions.joomla.org 并搜索“1 PixelOut Audio Player”。\n\n## Zina\n\
  \nZina 是一个功能丰富的 Joomla! 音频组件，为您的音乐收藏提供图形界面、个人点唱机、播客工具和 MP3 播放器。\n\nZina 已构建为 Joomla!\
  \ 组件，可以集成搜索功能，这意味着您的音频收藏可以通过 Joomla! 搜索框进行搜索。\n\n如果您想展示音乐专辑并提供这些专辑的试听歌曲，那么 Zina\
  \ 可能是一个不错的选择：\n\n![](img/0151410972a5c5ea0aab26416e44b1da_165_0.png)\n\n要下载 Zina，请访问\
  \ `http://extensions.joomla.org` 并搜索“Zina”。\n\n## 浏览器支持和音频可访问性\n\n音频是娱乐和向网站访客传递信息的绝佳工具，现在在网络上非常常见。事实上，共享音频文件现在已成为网络上最受欢迎的活动之一。\n\
  \n音频正成为显著增强网页可访问性的有用设备。对于视力受损的人来说，通过音频描述提供视觉内容的能力极其宝贵。\n\n问题出现在没有提供正确的文本替代时，这会使页面上的音频内容对某些受众无法访问。您的音频对听力受损者来说将无法访问，因此可以提供准确的文本描述来描述音频文件的内容。\n\
  \n## 良好实践技术\n\n以下是使用音频在 Joomla! 页面中的一些良好实践技术：\n\n### 文本转录\n\n提供您网页上所有内容的文本转录是良好的做法。例如，图像的\
  \ `alt` 标签提供了替代文本的文本转录，允许用户知道该主题的图像正在加载到页面区域中。\n\n\n\n\n\n如果你的音频内容是关于会议或产品新闻，请提供该内容的文本转录，并通过超链接使其可在另一个区域访问，或者更好的是，在同一页面的某个位置提供。文本转录可以从几个词长到数百个词；你的良好判断对于准确描述你的音频内容非常重要。\n\
  \n## 替代内容\n\n包含网页中音频的 HTML 也可以包含替代内容。object 元素可用于包含各种类型的信息；远不止图像标签 <img />。\n\n\
  替代内容不仅可以帮助使用文本浏览器的用户和屏幕阅读器，还可以被搜索引擎收录。\n\n## 字幕\n\n字幕可能并不总是合适的。然而，对于新闻或培训类的音频内容，可能适合添加字幕。给音频文件添加字幕实际上将其转变为视频文件，因为它将包含音频和视觉内容。许多软件应用程序都提供简单的文本字幕功能来补充音频轨道。\n\
  \n## 链接到下载\n\n在网页上提供指向播放内容所需的音频播放器类型的链接非常有用，并且可能对用户收听音频内容产生很大影响。\n\n## 音频控件\n\n\
  提供用于操控音频播放的控件是很好的做法，现在几乎已成为一种期望。音频控件让访客能够控制轨道的播放速度、暂停以及调节音量级别。\n\n诸如播放条、暂停和音频按钮等简单功能，都能使播放器比例如无控制功能的背景音频轨道更易于访问。\n\
  \n“在 Web 上使用哪种音频格式最好？”是一个常见问题，没有任何一种格式能对所有人实现 100% 兼容。诀窍是选择一种适合你网站访客绝大多数人的格式，然后再尝试以其他方式满足其他用户。\n\
  \n根据众多研究，Adobe Flash 现在是个人计算机系统上最流行、最广泛的流媒体播放器之一。几乎所有现代网络浏览器现在都已安装 Flash，并且统计数据显示超过\
  \ 98% 的个人电脑可以播放 Flash 文件。这就是为什么 Joomla! 扩展目录中的大量音频播放器都是基于 Flash 的音频播放器。\n\n如果你的音频内容很重要，请花时间将其导出并以多种格式提供。这为你的网站用户提供了选择，例如，那些无法运行\
  \ Flash 的用户仍能在其他播放器中收听。\n\n## 摘要\n\n尽管 Joomla! 没有提供原生的音频功能，但能够将自定义 HTML 代码输入到我们的网站内容中，为我们在需要包含音频时提供了极大的灵活性。\n\
  \n将 Joomla! 与 FeedBurner RSS 工具结合使用，为从你的网站提供播客提供了一种自动化且易于访问的方式，能够轻松生成新的播客并监控内容的统计数据。\n\
  \nJoomla! 扩展为你的网站添加了增强的播客和音频播放器，并且本章中列出的扩展的功能无疑会匹配并超越其他 CMS 的音频功能。\n\n音频格式及其可访问性的选择乍一看似乎令人困惑，但有几种标准格式（如\
  \ MP3）很受欢迎且安全，能够覆盖最广泛的受众。为了遵守 W3C 可访问性指南，始终尝试为你的音频提供替代方案，这可以是总结音频内容的文本描述。\n\n# 在你的\
  \ Joomla! 网站中使用视频\n\n互联网上的视频正在蓬勃发展！视频压缩的改进、连接速度的提升以及硬件的改善等相对较新的因素，都促成了互联网成为交付视频内容更可靠、更易访问的环境。\n\
  \n本章重点介绍在你的 Joomla! 网站中使用视频媒体，并包括以下主题：\n\n- Video on the Internet\n- Video formats\n\
  - Embedding and displaying video in Joomla!\n- Creating video podcasts for Joomla!\n\
  - Third-party video extensions\n- Browser support and accessibility\n\n### Video\
  \ on the Internet\n\n术语视频指的是对一系列静止图像的记录、处理和显示，这些图像代表运动中的场景。\n\n![](img/0151410972a5c5ea0aab26416e44b1da_169_0.png)\n\
  \n视频可能是当提到多媒体一词时最引人注目的“媒体类型”之一。视频是一种数据密集型媒体格式，即使是短视频片段也需要兆字节的数据。直到最近，这样的限制一直是其在网络上广泛使用的制约因素！\n\
  \n在过去几年中，网站上视频的使用迅速增加，视频已被用于销售、营销以及支持和培训目的。出现了一些完全专注于托管和向用户展示视频剪辑的新网站，而视频潜力的这种演变归因于以下促成因素：\n\
  \n### 带宽限制\n\n消费者宽带的增长极大地促进了网站上视频的演变。现在很大一部分网站访客拥有通过网络访问高质量视频内容所需的带宽。这还不是最好的，但仅此一点就已成为“网络功能”增长的最大影响因素之一。某些地区的带宽已变得足够好，以至于\
  \ Blockbuster 电影流媒体和电视现在将互联网作为广播媒介来定位。\n\n### 视频与其他网络内容的集成\n\n直到最近，在网络上播放的大多数视频除了在简单盒式播放器中播放简单视频外，没有提供丰富的媒体功能。倒回几年，所有网站上的视频链接都必须先下载到用户的计算机，然后才能播放。\n\
  \n随着视频格式的演变、流媒体视频（可在下载时播放的内容）以及 Adobe Flash Player 等技术的发展，视频的交付及其与其他网络内容的交互带来了更佳的用户体验。\n\
  \n### 为网络创作和播放视频\n\n由于可用的浏览器和操作系统种类繁多，网站上的视频往往要求用户暂停正在进行的操作并下载插件才能访问视频内容。现代浏览器已配备良好，能够播放多种格式的视频内容，通常无需额外的插件。\n\
  \n![](img/0151410972a5c5ea0aab26416e44b1da_171_0.png)\n\n另一个促成因素是创建内容的便捷性。过去，你必须是一名经验丰富的视频录制/编辑人员并使用专业工具才能制作视频。最近，新的计算机操作系统预装了某种形式的视频编辑软件。创建视频并将其上传到网站的便捷性对其作为流行媒体格式的广泛使用产生了深远影响。\n\
  \n随着迄今为止的演变，视频和互联网非常契合。我们可以获得尽可能接近真实生活的体验，它是教育性的或娱乐性的，并且我们可以在最有趣的游乐场之一——网络上获得这一体验！\n\
  \n随着 YouTube 和 Google Videos 等分发渠道的使用，网站上视频的使用发生了显著演变。与其自行托管视频内容（这通常会导致网络托管成本增加），现在可以轻松地将外部视频内容从分发站点流式传输到你的网站。广播和共享这种视频内容的便捷性是网络视频热潮的另一个主要促成因素。\n\
  \n## 视频格式\n\n有许多视频格式可用。每种格式都会影响对不同受众的可访问性，其中一些是由微软和苹果等公司许可的格式。视频格式各自包含自己的算法，以不同的方式处理和处理电子视频数据：\n\
  \n![](img/0151410972a5c5ea0aab26416e44b1da_171_1.png)\n\n\n\n\n\n有些格式比其他格式更适合某些用途（如在\
  \ DVD 上存储视频或在 iPod 上播放视频），我们将介绍哪些视频格式适合基于网络的环境。\n\n## 视频压缩\n\n在使用电子设备上的视频时，一个重要问题是文件大小。这通常是互联网上使用视频的限制因素。然而，视频现在变得对消费者友好，甚至手机也能轻松录制视频。\n\
  \n视频是一种数据密集型媒体格式，在计算机硬盘上占用大量空间。将其带入网络场景，网络托管服务器成本可能会因托管和播放视频文件所需的额外磁盘空间而变得昂贵。\n\n\
  解决办法是视频压缩。通过压缩视频，更容易分发和存储它。数字视频压缩可以通过压缩数据而不会影响最终产品的感知质量来实现。大多数视频压缩方法都属于“有损”数据压缩格式。这意味着每次压缩视频时，某些信息就会被删除。一旦导出，这些信息就会丢失，无法再恢复：\n\
  \n![](img/0151410972a5c5ea0aab26416e44b1da_172_0.png)\n\n压缩的作用是去除被认为“不重要”的数据，因此由于这些不再存在的信息，我们的文件大小会下降。视频压缩的一个很好的例子是从视频片段中删除无法识别的颜色。一部电影中可能有数百万种颜色（相似颜色的细微色调），但人类只能感知到其中略多于\
  \ 1000 种，因此压缩并删除这些不需要的数据对我们是有益的。\n\n丢弃太多数据（过度压缩）时，变化就会变得明显。在压缩视频时，目标是尽可能多地压缩，直到你能注意到质量损失，然后从这一点稍微回退一点，这样你就可以在最小的质量损失下实现最佳的数据压缩和文件大小。\n\
  \n## 视频编解码器\n\n从前，视频编解码器是“AV 极客”和“硬核非法视频下载者”的东西，但信不信由你，如果你使用或观看电影，无论是在电影院、电视上还是在手机上，你可能经常使用它们。\n\
  \n**视频编解码器**是一种设备或软件，可实现视频压缩，并对该数据进行解压缩。术语 **编解码器**代表压缩/解压缩，各种编解码器用于音频和视频媒体格式。\n\
  \n由于媒体文件大小庞大，数学编解码器被构建用于对信号进行编码以便传输，然后再次解码以供观看。现在使用着数百种编解码器，其中许多已包含在现代计算机设备中。一些常见的视频编解码器是\
  \ VC-1、MPEG-4 和 H.264。\n\n需要注意的是，视频编解码器不是视频容器（或包装）文件，即最终文件格式。你可能已经注意到，你的视频文件没有像\
  \ `.vc-1` 或 `.h.264` 这样的扩展名。这是因为视频文件被打包在容器或包装中，这些容器包含各种文件信息，例如额外的音频和导航信息，以及视频文件本身。编解码器负责压缩，而容器文件保存该文件的信息。视频容器文件的例子有\
  \ FLV（Flash Video）、MOV（Apple QuickTime）等。每个容器都使用某种类型的视频编解码器进行压缩。有关视频编解码器和容器文件的更多信息，可在\
  \ http://en.wikipedia.org/wiki/Category:Video_codecs 上找到。\n\n我们很快就会研究这些容器文件，因为它们是保存网络视频的重要格式。\n\
  \n## 比特率\n\n比特率描述了每单位时间内处理的信息量。比特率是视频和音频压缩的重要组成部分，所有主要的视频压缩格式都使用各种比特率在压缩期间压缩数据。\n\
  \n![](img/0151410972a5c5ea0aab26416e44b1da_174_0.png)\n\n比特率的单位是每秒比特数（bps 或 bit/s），可使用诸如（千）Kbps\
  \ 或（兆）Mbps 等前缀。当从视频编辑应用程序导出文件时，你可能会看到比特率作为导出选项。重要的是要记住，比特率越高，文件包含的信息越多， resulting\
  \ in a higher quality video file。比特率越高，编码/解码所需的 effort 越大，文件大小也越大。有关视频比特率的更多信息，可在\
  \ http://en.wikipedia.org/wiki/Bit_rate 上找到。\n\n## 视频容器\n\n有许多压缩标准用于将视频文件大小压缩到高效状态。压缩后的视频文件将被包装在容器文件中，其中包含播放视频所需的所有相关信息。为了播放此视频，查看系统需要理解文件使用的视频编解码器以及视频容器。\n\
  \n以下是网络上最常用的视频容器列表：\n\n- AVI\n- FLV\n- MOV\n- MPEG\n- WMV\n- RM\n\n以下是这些容器格式的简要介绍：\n\
  \n### AVI\n\nAVI 代表 **Audio Video Interleave**，这是一种由微软于 1992 年开发的知名视频容器格式。AVI 文件质量极佳，但这通常以文件大小为代价。它是视频编辑人员保存和查看视频的热门选择，因为质量高。\n\
  \nAVI 文件有许多压缩编解码器，因此如果系统不包含特定编解码器，则其中一些无法播放。这可能意味着需要特定的更新才能观看某些 AVI 电影。然而，大多数新计算机系统应该能够在无需额外软件的情况下播放\
  \ .avi 电影文件。\n\n### FLV\n\nFLV 代表 **Flash Video**。它是 Adobe Systems 拥有的格式，专为网络视频播放而设计。它提供高压缩率和高品质视频。\n\
  \nFLV 是一个流行的格式，因为它可以轻松嵌入网页中进行实时流媒体播放，并且在大多数计算机操作系统中通过 Adobe Flash Player 及其网页浏览器插件得到支持。\n\
  \n目前，FLV 是 YouTube 和 MySpace 等热门视频广播网站的首选格式，被认为是在网络上投递视频最受欢迎的格式之一。\n\nFlash 电影是网络视频的绝佳格式，但它们也有其局限性。一些公司不允许在其\
  \ IT 网络上安装 Flash Player。还有一些关于全 Flash 制作网站的搜索引擎优化限制。\n\n### MOV\n\n**QuickTime**（文件扩展名为\
  \ .mov）是 Apple 开发的多媒体播放和存储技术。QuickTime 文件充当容器，将 Flash、文本、音频和视频组合成一个文件。\n\nQuickTime\
  \ 电影通常质量极佳，该格式提供良好的压缩率。QuickTime 播放器随 Apple Mac 电脑一起提供，但 Windows 用户可能需要下载 QuickTime\
  \ 播放器才能查看 MOV 文件。\n\n### MPEG\n\nMPEG 代表 **Moving Picture Experts Group**，该组织成立于\
  \ 1988 年，作为一个工作组来定义音频和视频媒体类型的标准格式。\n\nMPEG 文件是网络使用的常见格式，提供良好的质量压缩和文件大小。自 1980 年代以来，MPEG\
  \ 家族已多次增加，最新的最流行格式是 MPEG-4（.mp4）。\n\nMPEG 文件可以用 Windows Media Player 或 Apple QuickTime\
  \ Player 播放，这意味着它们可能是跨平台最合适的格式之一。这导致它们在整个网络上得到广泛使用。最新格式 .mp4 提供卓越的压缩，质量极佳且文件大小小。\n\
  \n### WMV\n\nWMV 代表 **Windows Media Video**，由微软创建并授权，作为 RealVideo 的竞争对手。其质量与其他类似编解码器相当，并得到所有微软工具的支持，这使其成为使用\
  \ Windows 计算机创建视频时的自然选择。\n\n任何不使用 Windows 计算机的人都需要下载 Windows Media Player 或等效播放器才能播放\
  \ .wmv 文件。因此，为了覆盖最广泛的受众，使用更合适的容器来制作基于网络的视频。\n\n### RM\n\n**Real Audio/Video** 是流媒体视频的先驱之一。它是由\
  \ RealNetworks 开发的专有视频格式，于 1997 年首次发布。其流媒体格式和良好的压缩率提供了相对较小文件大小中的高质量视频。\n\nRealVideo\
  \ 通常与音频打包并组合在容器（.rm）文件中。RealMedia 格式曾经非常流行，但专有技术导致该格式衰落，取而代之的是更易获得的解决方案。\n\n还有许多其他视频容器可用于不同的环境。有关这些的更多信息可在\
  \ http://en.wikipedia.org/wiki/Video_container 上找到。\n\n\n\n\n\n## 在 Joomla! 网页中嵌入和显示视频\n\
  \n除了 Joomla! 开箱即用的众多出色功能外，一个非常强大的功能是允许将自定义 HTML 代码包含在 Joomla! 文章中。这意味着我们完全可以根据需要定制文章中内容的输出形式，而这正是将视频插入\
  \ Joomla! 网页时所需要的，无需使用扩展插件。\n\n### 视频源\n\n在为网页准备视频时，最重要的选择之一就是使用哪种视频格式。\n\n不幸的是，没有任何单一的视频格式能够百分之百保证适合所有网站访客。由于他们使用的计算机操作系统、屏幕分辨率和网页浏览器各不相同，因此需要仔细考虑，以确保大多数用户都能观看视频，而不需要额外下载或安装插件。\n\
  \n我们在本章前面已经列出了视频格式。在提供这些视频格式支持时，三大主要参与者如下：\n\n| Adobe Flash | SWF 电影 |\n| Apple\
  \ QuickTime | MOV, MPEG-1/2/4, AVI（取决于所使用的编解码器） |\n| Windows Media | WMV, MPEG-1,\
  \ AVI（取决于所使用的编解码器） |\n\nAdobe Flash 声称其在市场中的占有率高达 98%，并且被 Google、YouTube 和 Yahoo!\
  \ 等视频分发网站广泛用作视频格式选择。如果高比例的用户能够观看 Flash 内容，那么这就是考虑使用 Flash 作为网站视频格式的一个绝佳理由。\n\n在某些情况下，Flash\
  \ 的安装可能受到限制，例如在公司计算机网络上。为了适应此类受众，将内容同时提供为 MPEG-4 视频格式可能是一个合适的选择。\n\n### 编码\n\n网络视频的一个基本步骤是为其网络传输做好准备。您的源材料格式可能与您决定使用的格式不同，如果是通过手机、DVD\
  \ 摄像机或其他设备录制的，则其格式很可能非常不适合用于网络。\n\n目前有许多视频导出和转换软件应用程序可用。虽然详细阐述这些内容会非常有益，但关于视频编辑和优化已经写了不少整本书。以下是从视频编辑软件导出电影时可以作为指南的一些基本信息。这些设置非常适合使用宽带连接浏览您网站的用户：\n\
  \n| Adobe Flash 格式 | 帧大小和宽高比：(4:3) 384 x 480, (16:9) 270 x 480。 |\n|  | 帧速率：12-15\
  \ 帧/秒。 |\n|  | 去隔行：应设置为“是”。 |\n|  | 音频比特率：64 Kbps（语音）至 128 Kbps（音乐）。 |\n| Apple\
  \ QuickTime 格式 | 帧大小和宽高比：(4:3) 640 x 480 或 320 x 240, (16:9) 640 x 352。 |\n|  |\
  \ 帧速率：15 帧/秒。 |\n|  | 去隔行：应设置为“是”。 |\n|  | 音频比特深度：16 位。 |\n| Windows Media 格式 |\
  \ 帧大小和宽高比：(4:3) 640 x 480 或 320 x 240, (16:9) 640 x 352。 |\n|  | 帧速率：15 帧/秒。 |\n\
  |  | 去隔行：应设置为“是”。 |\n|  | 音频比特深度：16 位。 |\n\n原始视频需要编码为流媒体格式，以生成合适的 QuickTime、Windows\
  \ Media、Flash、RealMedia 或 MPEG-4 文件。视频编码所需的长度和时间取决于导出设置、软件和计算机处理能力。现在有许多免费和商业软件应用程序可用于执行视频编辑、导出和文件转换。\n\
  \n值得一提的一个开源编码工具是 MediaCoder，网址为 http://www.mediacoderhq.com/download.htm。MediaCoder\
  \ 是一个免费的通用媒体转码器，几乎支持所有流行的编解码器。MediaCoder 还可以转码音频，为您提供一把媒体编码的“瑞士军刀”。在 Internet 上搜索即可为您提供适合您计算机平台的编辑工具，并且有很多可供选择。\n\
  \n### 上传\n\n无论您选择使用 FTP 还是内置的媒体管理器，将视频上传到网络服务器都是一个简单的过程。\n\n#### 通过 FTP\n\n打开您的\
  \ FTP 程序并登录到网络服务器。在大多数图形化 FTP 程序中，您会有两个视图，一个用于本地文件，另一个用于远程文件：\n\n![](img/0151410972a5c5ea0aab26416e44b1da_179_0.png)\n\
  \n在远程文件集中，导航以查看 Joomla! 根目录结构。在此级别下，创建一个名为 videos 的新文件夹。在本地计算机中查找要上传的视频文件，并将其发送到新的\
  \ video 目录中。\n\n> 创建一个空白的 .html 文件并将其上传到新的 video 目录是一种良好的做法。这有助于阻止任何人直接查看新 video\
  \ 目录中的所有视频文件。如果您无法创建新的 .html 文件，请复制一个位于 images 目录中现有的 Joomla! .html 文件。\n\n####\
  \ 通过媒体管理器\n\n为了通过媒体管理器上传文件，请登录管理后台并访问 **内容 | 媒体管理器** 功能。使用左侧的目录结构导航到现有目录，或使用 **创建文件夹**\
  \ 功能创建一个新的 video 目录：\n\n![](img/0151410972a5c5ea0aab26416e44b1da_180_0.png)\n\n\
  > 媒体管理器的位置默认使用全局配置中的设置。通常这是在 /images 目录内。如果您希望在 /images 同一层级创建一个根目录（就像我们使用 FTP 方法所做的那样），则需要更改全局配置中的默认媒体管理器路径，然后返回媒体管理器区域创建新目录。\n\
  \n![](img/0151410972a5c5ea0aab26416e44b1da_181_0.png)\n\n全局配置还包含其他媒体设置，例如最大文件上传大小，这在上传视频时可能需要考虑。\n\
  \n创建 videos 目录后，只需使用媒体管理器的文件上传功能将文件上传到所选目录即可。\n\n### 编辑器\n\nWYSIWYG 编辑器最令人沮丧的事情之一是，它们会剥离或调整您格式化良好的代码。有些编辑器在这方面比其他编辑器做得更糟，但为了您的利益，在\
  \ Joomla! 文章中输入除简单 HTML 自定义代码以外的任何内容时，最好关闭 WYSIWYG 编辑器。\n\n虽然我刚建议您关闭编辑器，但我知道它们有时很有用，而且有些用户离不开它们。一个简单的小技巧是创建一个超级管理员用户，并将其命名为类似\
  \ \"noeditor\" 的名称。然后为该用户设置编辑器选项为 **编辑器 - 无编辑器**。使用这种方法，您可以随时以 \"noeditor\" 用户身份登录。这节省了频繁切换编辑器开和关的麻烦。\n\
  \n可以通过访问 **站点 | 用户管理器** 页面按“用户基础”调整用户编辑器设置。点击您希望编辑的用户，将会有一个标有 **编辑器：** 的参数设置：\n\n\
  ![](img/0151410972a5c5ea0aab26416e44b1da_182_0.png)\n\n选择您需要的选项，并在用户编辑页面上点击 **保存**。也可以在更高层级的全局管理设置中设置编辑器。同样，访问\
  \ **站点 | 全局配置** 菜单以调整此设置。进入全局配置页面后，您会看到一个标有 **默认编辑器** 的设置。选择您需要的选项，并在全局配置页面上点击 **保存**\
  \ 以保存更改：\n\n![](img/0151410972a5c5ea0aab26416e44b1da_182_1.png)\n\n在 Joomla.org\
  \ 上，有许多可以轻松安装的编辑器扩展，它们为您的网站内容编辑提供了一些很棒的功能。这些扩展对代码的处理方式各不相同，但作为一个普遍规则：在 Joomla! 文章中输入复杂\
  \ HTML 代码时，最好关闭所有编辑器。一旦自定义 HTML 代码被包含在文章页面并保存，开启 WYSIWYG 编辑器并重新访问文章时要格外小心。当您的 WYSIWYG\
  \ 编辑器加载源代码时，它可能会剥离掉您所有的努力，留下一个无法正确显示的文章。\n\n为了帮助使 Joomla! 编辑器对 HTML 更加友好，您可以调整编辑器过滤器的安全性。方法如下：\n\
  \n- 在 Joomla! 管理后台中，访问文章管理器屏幕。\n- 在页面的右上角，您将看到一个编辑全局文章“参数”的选项。\n\n\n\n- 点击此项，然后在屏幕底部，你将看到编辑器过滤列表。\n\
  - 选择你的过滤组（例如，超级管理员），并在过滤类型下选择“白名单”。\n\n你也可以配置特定的 HTML 以从编辑器过滤列表中忽略。确保在页面顶部保存这些新配置。\n\
  \n## 创建文章\n\n新文章在“文章管理器”视图中创建：\n\n- 点击控制面板上的 **Article Manager** 图标，或在 **Components\
  \ | Articles** 菜单链接下。\n- 进入文章管理器后，点击该页面右上角标记为 **New** 的图标。这将打开 **Add Article** 页面。\n\
  - 新文章的少数要求之一是页面 **Title**，以及文章内的一些文本。一旦这两项已填写，你将能够点击该页面右上角的 **Save** 或 **Apply**\
  \ 按钮。\n\n## 视频 HTML 代码\n\n视频可以在你的 Joomla! 文章中有两种呈现方式：\n\n### 直接下载\n\n你可以直接提供指向视频文件的超链接，这将允许用户下载视频文件，下载完成后，可以在浏览器窗口中使用插件查看，或通过\
  \ QuickTime 或 Windows Media Player 等视频播放应用程序在用户机器上播放。\n\n下载方式是视频内容在网络流媒体和嵌入内容变得普遍之前所采用的方式。直接下载在你希望允许用户下载并保存视频内容时很有用。提供视频下载的代码是一个指向文件的简单超链接，看起来像这样：\n\
  \n```\n<a href=\"/videos/boats.mov\" title=\"Video of Boats Download 1.2MB\" >\n\
  My Movie about Boats (1.2MB)</a>\n```\n\n页面看起来像：\n\n![](img/0151410972a5c5ea0aab26416e44b1da_184_0.png)\n\
  \n> 在创建指向视频文件的链接时，始终在链接旁边显示文件大小和其他信息是良好的做法。这些信息可以帮助用户了解他们将收到什么内容，以及预期的下载时间。\n\n\
  ### 流媒体\n\n流媒体是将压缩的多媒体内容传递并实时显示给用户的一种过程。网络流媒体的例子包括互联网广播和电视广播。\n\n在流媒体视频的情况下，一旦下载了足够的数据，用户播放器（QuickTime\
  \ Player、Windows Media Player）就可以开始播放视频，同时视频流的剩余部分继续下载。此过程意味着用户不必等待整个文件下载完成即可观看特定内容。\n\
  \n流媒体视频通常从服务器上的预录视频文件发送，但流媒体也可以涉及“现场视频广播（或馈送）”。现场视频馈送被转换为压缩视频信号，然后可以通过能够多播或同时向多个用户发送文件的网络流媒体服务器传递。\n\
  \n### 嵌入代码\n\n与大多数 HTML 代码一样，不同浏览器以各种方式解释它。为了确保我们的视频在所有浏览器中都能正常播放，我们需要使用 W3C 推荐的方法，即同时使用\
  \ `<object>` 标签和 `<embed>` 标签（推荐用于 Netscape 和旧浏览器）。\n\n使用这两个标签可以让我们的视频在所有浏览器上都能正常播放，这为我们提供了将视频提供给最广泛受众的最佳机会。\n\
  \n<object> 标签用于将音频、视频和 Flash 等多媒体对象包含到网页中。在 object 标签内有参数和其他标签，它们都有各自的功能（对不同浏览器），用于正确显示你的内容。\n\
  \n在你的 Joomla! 文章中嵌入视频的最小有效代码看起来像这样：\n\n```\n<object width=\"320\" height=\"240\"\
  \ classid=\"clsid:02BF25D5-8C17-4B23-BC80-D3488ABDDC6B\" codebase=\"http://www.apple.com/qtactivex/qtplugin.cab\"\
  >\n<param name=\"src\" value=\"/videos/videofile.mov\">\n<param name=\"controller\"\
  \ value=\"true\">\n<param name=\"autoplay\" value=\"false\">\n<embed src=\"/videos/videofile.mov\"\
  \ width=\"320\" height=\"240\" autoplay=\"false\" controller=\"true\" pluginspage=\"\
  http://www.apple.com/quicktime/download/\">\n</embed>\n</object>\n```\n\n让我们看看这段代码的元素：\n\
  \n| object | 用于在网页中包含多媒体。 |\n| height and width | 用于定义对象的高度和宽度。这通常与视频文件大小相同或稍大，有时我们需要一些额外空间来显示视频周围的视频控件。\
  \ |\n| classid and codebase | 定义用于自动安装 ActiveX 元素的特定指令。 |\n| param | 控制对象的参数。 |\n\
  | src | 文件的来源。 |\n| controller | 设置为 true 或 false 以显示或隐藏控制器。 |\n| autoplay | 设置为\
  \ true 或 false 以自动开始播放视频。 |\n| embed | 使用 embed 标签将播放器放置在页面上。 |\n| pluginspage |\
  \ 将用户带到插件下载页面，在那里他们可以下载特定的播放器。 |\n\n你会注意到 <embed> 标签内的内容与 <object> 标签内的内容相似。使用这两个标签将导致所有主要浏览器能够正确互操作你的内容。\n\
  \n让我们在工作示例中看看我们的代码。如果我们有一个名为 boats.mov 的视频，已保存为 320 x 240 比例的 .mov 文件，并且该文件位于名为\
  \ videos 的目录中，该目录位于我们的 Joomla! 文件结构的根级别（与 images 目录位于同一顶层）。嵌入该视频的代码将如下所示：\n\n```\n\
  <object width=\"320\" height=\"240\"\n    classid=\"clsid:02BF25D5-8C17-4B23-BC80-D3488ABDDC6B\"\
  \n    codebase=\"http://www.apple.com/qtactivex/qtplugin.cab\">\n<param name=\"\
  src\" value=\"/videos/boats.mov\">\n<param name=\"controller\" value=\"true\">\n\
  <param name=\"autoplay\" value=\"false\">\n<embed src=\"/videos/boats.mov\" width=\"\
  320\" height=\"240\"\n    autoplay=\"false\" controller=\"true\"\n    pluginspage=\"\
  http://www.apple.com/quicktime/download/\">\n</embed>\n</object>\n```\n\n可以在 <object>\
  \ 标签内存在许多参数，太多无法在本手册中涵盖，但前面列出的参数是常见参数。有关更详细参数的列表，请访问 W3 Schools 网站：http://www.w3schools.com/TAGS/tag_object.asp。\n\
  \n## 使用文章插件包含视频\n\n现在我们已经完成了使用原始 HTML 代码将视频包含到 Joomla! 文章中的艰苦工作，我们将看看 Joomla! 视频扩展包含视频的强大功能。\n\
  \nJoomla! 视频扩展为核心 CMS 提供了多样化的扩展功能。一旦插件安装并配置好，添加视频可以是一个简单的几步点击过程。Joomla! 视频扩展将在本章后面重点介绍，但现在我们将看看它们对管理员有多强大。\n\
  \n一个扩展的例子是 Flow Player：\n\n![](img/0151410972a5c5ea0aab26416e44b1da_186_0.png)\n\
  \nFlow Player 是一个 GPL 许可的网页视频播放器。Flow Player 利用基于 Flash 的播放器界面，将众多视频格式流式传输到你的 HTML\
  \ 页面中。它是一个相当先进的工具，具有带宽等先进的流媒体技术。\n\nFlow Player for Joomla! 已经被开发出来，利用了这个精彩的播放器，并使其在你的\
  \ Joomla! 网站中易于使用。有可用的插件版本，允许你在文章中播放媒体，以及模块版本，可以放置在任何模块位置。\n\n要获取 Flow Player for\
  \ Joomla!，请访问 http://extensions.joomla.org/ 并搜索“Flow Player Plugin”。一旦你将此扩展下载到你的计算机，我们就可以开始了！\n\
  \n> 在将任何第三方代码安装到你的 Joomla! 网站之前，请确保在安装扩展之前备份你的网站数据库和文件集。有一些优秀的备份扩展，如 JoomlaPack\
  \ 和 JoomlaCloner。一旦配置好，它们可以帮助你只需点击几下即可轻松备份你的 Joomla! 网站。\n\n登录你的网站管理并点击 Extensions\
  \ | Extension Manager。\n\n使用选择文件上传按钮浏览你的本地计算机并找到 plg_flowplayer.zip 文件。选择后，使用上传文件并安装按钮将此扩展安装到你的\
  \ Joomla! 网站。\n\n![](img/0151410972a5c5ea0aab26416e44b1da_187_0.png)\n\n成功安装后，你应该前往\
  \ Extensions | Plugin Manager 以配置新插件。此特定插件被归类为内容插件，因此你将寻找类似 Content - FlowPlayer\
  \ 的内容。点击文本以加载插件编辑页面。\n\n![](img/0151410972a5c5ea0aab26416e44b1da_187_1.png)\n\n\n\
  \n\n\n## 创建视频播客\n\n为 Joomla! 创建视频播客可以让您向众多用户展示和推广您的网站或产品。由于播客的特性，只要制作得当，用户甚至无需访问您的网站即可观看视频播客。\n\
  \n对我们来说，为包含视频文章的分类创建一个常规 RSS 源很容易。这将为我们提供一个 RSS 源，通知订阅者我们网站上有新内容。遗憾的是，Joomla! 的\
  \ RSS 源功能有限，这种方法无法将视频内容封闭在 RSS 源内。因此，我们的用户如果不回到网站，就无法下载视频文件进行观看。\n\n![](img/0151410972a5c5ea0aab26416e44b1da_189_0.png)\n\
  \n创建一个真正的视频播客需要将视频内容封装在 RSS 附件（enclosures）中，RSS 附件是一种将多媒体内容附加到 RSS 源的方式。由于 Joomla!\
  \ 无法提供此功能，我们需要使用第5章“在您的 Joomla! 网站中使用音频”中提到的方法。\n\n外部 RSS 源创建服务“FeedBurner”可以生成能够包含我们多媒体内容的\
  \ RSS 源。有关该过程的更多详细信息，请参阅第5章的相关主题。以下是使用 FeedBurner 服务创建视频播客的简要步骤：\n\n- 1. 选择并准备您的视频内容。一开始建议您手动插入视频代码，因为某些视频扩展插件在此过程中可能有效，也可能无效。\n\
  - 2. 创建一篇视频文章，并将其放入指定的“视频”分类中。\n- 3. 创建一个“链接到分类”菜单链接，以便 Joomla! 可以生成该分类的 RSS 源。\n\
  - 4. 在前端查看 Joomla! 菜单链接，并复制 RSS 源 URL。\n\n![](img/0151410972a5c5ea0aab26416e44b1da_189_1.png)\n\
  \n- 5. 访问 http://feedburner.google.com ，将 URL 粘贴到源创建框中，并确保您勾选了“我是播客制作者”复选框。\n- 6.\
  \ 按照 FeedBurner 的其余流程操作，为您的源指定标题和地址，并确保选择“从链接创建播客附件：任意富媒体文件”。\n- 7. 从 FeedBurner\
  \ 获取您新的视频播客源，然后大功告成！\n\n因此，我们在这里所做的是利用 FeedBurner 的强大功能，基于 Joomla! 生成的 RSS 源创建了一个增强版的\
  \ RSS 源。\n\n一旦您的 FeedBurner 源成功创建并测试通过，您就可以在同一个 Joomla! 分类中添加新的视频文章，这些文章将自动添加到视频播客源中。\n\
  \n随着大量屏幕捕获工具和视频编辑程序的出现，利用视频来传播您的信息是很容易实现的。由于视频是最接近真实生活的媒体体验之一，使用它可以让您的网站访客获取信息并得到娱乐，而且可能让您比竞争对手领先一步。\n\
  \n## 第三方视频扩展\n\n正是使用 Joomla! 的视频扩展为我们提供了一些非常强大的视频功能。以至于 Joomla! 的扩展范围从将简单视频放入内容文章，一直到提供迷你\
  \ YouTube 风格的视频分发网站。\n\n本节列举了一些为 Joomla! 开发的功能强大、广受欢迎、非商业性的第三方视频扩展。也有许多商业解决方案；其中一些列在\
  \ Joomla! 扩展目录中。\n\n### AllVideos\n\nAllVideos 是一个适用于 Joomla! 的一体化媒体解决方案。AllVideos\
  \ 是一个插件，可以轻松嵌入来自 YouTube、Vimeo 等众多分发网站的视频。此外，它还可以直接播放来自您自己的服务器或远程服务器上的几乎所有视频/音频文件类型。\n\
  \n![](img/0151410972a5c5ea0aab26416e44b1da_191_0.png)\n\nAllVideos 具有以下功能：\n\n-\
  \ 1. 支持数十个视频分发网站。例如 YouTube、Google Videos、Vimeo、Metacafe、Brightcove、Dailymotion、Revver、Spike\
  \ 等！\n- 2. 您可以流式播放自己常用的视频格式，包括 `.flv`、`.swf`、`.mp4`、`.mov`、`.wmv`、`.wma`、`.mp3`、`.3gp`、`.divx`。\n\
  - 3. 您可以从自己的服务器或远程服务器嵌入视频内容。\n- 4. 使用简单。设置插件参数，使插件发布，即可从您的网站流式播放视频内容。\n- 5. 您可以使用可换皮肤的模板系统自定义此插件的输出显示。\n\
  \n值得一提的是，该扩展已有一个开发分支，名为 AllVideos Reloaded。这两个扩展都很受欢迎，并持续开发，各自拥有一系列功能。请在 http://extensions.joomla.org\
  \ 上查看它们（列在多媒体类别下，或搜索“AllVideos”），以查看对比。\n\n### hwdVideoShare\n\nhwdVideoShare 是一个视频分享画廊扩展，由一个组件和一个插件组成。该扩展的目的是为您提供视频画廊和分发网站（如\
  \ YouTube）的功能。\n\n![](img/0151410972a5c5ea0aab26416e44b1da_192_0.png)\n\n该组件需要 FFMPEG、MENCODER\
  \ 和 FLVTOOL2 才能运行，并支持 MPG、MPEG、AVI、DIVX、MP4、FLV、WMV、RM、MOV、MOOV、ASF、SWF 和 VOB 视频格式。\n\
  \n还支持来自 YouTube 和 Google Videos 等第三方来源的视频，并与上传的媒体无缝协作，用户可以评分、评论、举报以及将视频添加到收藏夹。\n\
  \n该软件使用 Joomla! 插件管理器来支持各种附加插件：\n\n- 模板插件可用于使用自定义主题为画廊设置样式\n- 语言插件可用于翻译该软件\n- 视频播放器插件可用于更换视频播放器\n\
  - 第三方视频插件可用于从热门视频网站导入视频\n- 系统插件可用于在特定视频事件上触发有用的任务\n\n该扩展还与其他产品的开发人员集成，提供更多功能。要下载此扩展，请访问\
  \ `http://extensions.joomla.org` 并搜索“hwdVideoShare”。\n\n### Simple Flash Video Player\n\
  \nSimple Flash Video Player 是一个适用于 Joomla! 1.5 的模块，基于 JW 播放器。它易于使用，并具有以下功能：\n\n\
  - 播放来自 URL 的单个视频文件，或播放来自播放列表的无限视频文件\n- 播放 YouTube 视频\n- 支持 Adobe Flash Player 可以处理的任何格式（FLV、MP4、MP3、AAC、JPG、PNG\
  \ 和 GIF）\n\n![](img/0151410972a5c5ea0aab26416e44b1da_193_0.png)\n\n该模块包含以下可调参数：\n\
  \n- 更改播放器设置\n- 视频文件属性\n- 播放列表设置\n- 显示预览图像\n- 在影片加载时插入您自己的徽标\n- 外部页面的 URL\n- 自动开始、重复和随机播放设置\n\
  \n要下载 Simple Flash Video Player 模块，请访问 `http://extensions.joomla.org` 并搜索“Flash\
  \ Video”。\n\n### RokBox\n\nRokBox 是一个由 MooTools 驱动的 JavaScript 幻灯片和多媒体插件，以一种引人注目的\
  \ lightbox 类型弹出效果显示您的内容。\n\nRokBox 可以显示多种媒体格式，包括图像、视频、来自分享网站的视频和音频。它是一种新型插件，可以开箱即用地提供多种媒体内容功能。\n\
  \n![](img/0151410972a5c5ea0aab26416e44b1da_194_0.png)\n\nRokBox 带有两个默认主题，但其设计使您可以根据站点设计定制主题，为您的站点媒体创建定制的多媒体显示。\n\
  \n功能包括：\n\n- 兼容 MooTools v1.11\n- 四种可自定义的转场类型：Fade、QuickSilver、Growl、Explode。\n\
  - 支持 PDF、图像、FLV、QuickTime（.mov、.m4v）、Windows Media 视频（.wmv）、Flash（.swf）、YouTube、DailyMotion、Metacafe、Google\
  \ Videos、Vimeo、音频（.mp3、.wav、.m4a）、本地和远程站点\n- 支持相册/分类\n\n\n\n\n\n- 能够以像素或百分比弹出 RokBox，并在相对于浏览器窗口的全屏模式下显示\n\
  - 支持字幕，包括标题和描述的支持\n- 提供两种预定义主题：浅色主题和深色主题\n- 支持自定义主题，能够按主题自定义样式和 RokBox 配置\n- 在对本地图像使用\
  \ RokBox 时能够自动生成缩略图\n- 支持从你的 Joomla! 内容生成缩略图或内联链接\n\nRokBox 是一个很棒的插件。其简洁性、美观以及媒体类型的多样性，使其成为你网站的一个非常有用的扩展。\n\
  \n要下载 RokBox，请访问 http://extensions.joomla.org 并搜索 \"RokBox\"。\n\n## Shadowbox\n\n\
  与 RokBox 类似，Shadowbox 是一个在线媒体查看器应用程序，支持网络上最流行的媒体发布格式。\n\nShadowbox 完全用 JavaScript\
  \ 和 CSS 编写，并且高度可定制。使用 Shadowbox，网站作者可以在所有主要浏览器中展示各种媒体，而无需将用户导航离开链接页面。\n\n![](img/0151410972a5c5ea0aab26416e44b1da_195_0.png)\n\
  \nShadowbox 可以支持图像、音频和视频。可用的视频格式包括：\n\n- QuickTime\n- Flash\n- Windows Media\n\n\
  你可以使用 Shadowbox 在文章和模块中的链接中显示媒体，因为正是超链接中的 rel 属性激活了该插件。这意味着你可以在任何你想要的超链接上使用 Shadowbox\
  \ 功能：\n\n```\n<a href=\"/myimage.jpg\" rel=\"shadowbox\">My Image</a>\n```\n\n与\
  \ RokBox 一样，Shadowbox 是你 Joomla! 网站的多用途媒体插件，因此它可能就是你多媒体需求所需的一切。该扩展可以在 http://extensions.joomla.org\
  \ 上通过搜索 \"Shadow\" 下载。\n\n还有许多其他视频扩展和解决方案可用于 Joomla!。其中许多提供了强大的功能，但属于商业许可，未在本节中涵盖。如果你需要特定的\
  \ Joomla! 视频功能，在 http://extensions.joomla.org 上搜索或通过流行的搜索引擎搜索将为你提供此处列出的额外解决方案。\n\
  \n## 浏览器支持和视频可访问性\n\n视频是娱乐和向网站访问者传递信息的绝佳工具，现在在网络上比以往任何时候都更常见。\n\n乍一看，似乎视频并不是在网页中加载时在可访问性方面理想的媒体。然而，如果使用正确，视频实际上可以通过成为向网站用户传递音频和视觉内容的额外手段来增强网页的可访问性。由于这些结合的媒介，视频正成为显著增强网页可访问性的有用设备。\n\
  \n问题在于，当没有提供正确的文本替代时就会出现问题，这使得页面的视频内容对某些受众无法访问。例如，没有音频内容的视频对视力障碍者来说是无法访问的，或者对于既视力又听力受损的人来说，完全没有用处。\n\
  \n文本等价物应尽可能始终提供。例如，如果你的视频是关于“如何使用我们的产品”，请确保提供视频内容的文本描述，要么在同一页面上，要么作为链接到另一个区域。\n\n\
  ## 良好实践技术\n\n以下是使用 Joomla! 页面中的视频时的一些良好实践技术。\n\n### 文本转录\n\n为你在网页上所做的一切提供文本转录是良好的做法。例如，图像的\
  \ alt 标签提供了替代文本的文本转录，允许用户知道该页面区域正在加载关于该主题的图像。\n\n如果你的视频是关于演讲或新闻，提供该内容的文本转录并通过超链接使其可访问到另一个区域，或更好的是，在同一页面的某个位置提供。文本转录可以从几个词长到数百个词；你的良好判断对于准确描述视频内容将非常重要。\n\
  \n### 替代内容\n\n就像图像一样，包含视频到你网页中的 HTML 也可包含替代内容。object 元素可用于包含各种类型的信息，远不止图像标签 `<img\
  \ />`。\n\n一个例子是，如果你想在网页上提供 Windows .wmv 视频，那么使用 Apple Mac 的用户将无法观看，除非他们已下载适用于 MAC\
  \ 的 Windows Media Player。使用 object 元素，你可以指定如果用户无法播放 .wmv，则应加载该电影的 MPEG 版本或替代格式。如果\
  \ MPEG 电影不受支持，你可以指定改为提供文本转录。\n\n替代内容不仅可以帮助使用文本浏览器和屏幕阅读器的人，还可以被搜索引擎获取。\n\n### 字幕\n\
  \n视频内容上的字幕对听力受损者或电脑上没有扬声器的人有用。字幕可能并不总是合适。然而，对于新闻或培训类视频内容，字幕通常只会增强视频内容。\n\n## 视频控件\n\
  \n提供用于操纵视频播放的控件是很好的做法，现在几乎已成为一种期望。视频控件让你的访客能够控制视频的播放节奏、暂停和重看视频，以及打开和关闭音频等等：\n\n\
  ![](img/0151410972a5c5ea0aab26416e44b1da_198_0.png)\n\n播放条、暂停和音频按钮等简单功能都能使这段视频比没有控制功能的视频更易于访问。\n\
  \n网络浏览器变得越来越复杂，内置了强大的多媒体功能。在过去的日子里，访问一个网页然后不得不去下载浏览器插件才能查看该页面上显示的多媒体内容的情况并不少见。\n\
  \n这些网络浏览器插件是可选软件，可增强或为网络浏览器添加特定功能。无法播放你特定视频格式的用户需要为其浏览器下载插件才能播放该视频格式。\n\n一些最受欢迎的视频浏览器插件是：\n\
  \n- Adobe Flash Player\n- Apple QuickTime Player\n- Real Media Player\n- Windows\
  \ Media Player\n\n“在网络上使用哪种视频格式最好？”这个问题的问题在于，没有一种格式对每个人都是 100% 兼容的。诀窍是选择一种适合你大部分网站访问者的格式，然后尝试以其他方式为其他用户提供服务。\n\
  \n根据众多研究，Adobe Flash 现在是网络上显示视频最流行和最广泛的格式之一。几乎所有现代网络浏览器现在都已安装 Flash，统计数据显示超过 98%\
  \ 的个人电脑可以播放 Flash 文件。\n\n如果你选择不使用 Flash，我建议将你的电影保存为 MPEG-4 格式 .mp4。这些也将可被大多数用户在许多设备上播放。\n"
- "# 7\n\n# 与外部来源协作\n\n在 Joomla! 用户中，与 Twitter、Facebook 和 Google 等流行外部资源之间共享信息的需求日益增长。\n\
  \n随着新的社交网络站点和多媒体门户每月不断涌现，这些与 Joomla! 之间的集成继续通过强大的第三方扩展而不断发展。\n\n本章旨在扩展 Joomla! 框架的新功能，将介绍\
  \ Joomla! 最受欢迎的协作扩展及其包含的功能，以及使用老式 HTML 将内容嵌入到你的网站中。它包括：\n\n- 社交网络\n- 使用 HTML 代码包含资源\n\
  - 使用第三方扩展\n\n## Flickr、YouTube、MySpace、Twitter、Facebook、Google…… 列表还在继续\n\n自诞生以来，网络一直被用作结识人们和分享信息的工具。然而，近年来，网络用户之间的互动经历了快速演变。\n\
  \n我们不再将网络用作查找信息的工具，而是将自己融入其中，并利用它与他人建立联系。“Web 2.0”这一术语被用来描述一个更具社交性、协作性和响应性的网络，我们看到这些功能现在已深深植根于现代“网络”中。\n\
  \n\n\n\n\n## 与外部资源协作\n\n“先有鸡还是先有蛋？”这个问题在试图总结 Web 以及其上流行的网络站点，例如 Facebook 和 Twitter\
  \ 的近期演变时就会浮现。这两个“社交工具”需要 Web 处于当时的状态才能演化，但它们也极大地塑造了“Web”现在的样子，创造了通往网站开发、第三方协作和交互的新路径。\n\
  \n“它将走向何方？”和“它会去向何处？”是经常被问到的问题。当我五岁时，我观看了一集《星际迷航》，演员们使用手持翻盖式设备，并使用“Beam me up Scotty”这一术语，与他们的星舰进行通信。如今我每天携带的是一部可被卫星追踪的手持计算机/手机，只需几次点击，我就可以向全球公告板——万维网——发布和接收信息。就我们围绕这个日益由企业驱动的名为\
  \ Web 的实体所进行的社会演变速度之快而言，这让我感到害怕，但我对它带来的技术和机遇感到兴奋：\n\n![](img/0151410972a5c5ea0aab26416e44b1da_202_0.png)\n\
  \n因此，无论是 Google、Facebook、Twitter、MySpace、YouTube 等等；Joomla! 都可以与它们全部协作。归根结底，是电子信息存储在一个位置，然后在另一个位置呈现。某些\
  \ Joomla! 扩展之所以开发出来，正是因为有将这些信息展示并显示在用户基于 Joomla! 的网站上的需求。本章将重点介绍目前提供这些解决方案的一些最受欢迎的扩展和工具。\n\
  \n## 使用 HTML 代码包含资源\n\n当使用 Joomla! 作为您网站的框架时，您不仅获得了一个功能齐全的数据库驱动内容管理系统，您还获得了在站点中通过将其包含到文章和模块中使用自定义\
  \ HTML 的能力。\n\n甚至还有专门的 Joomla! 扩展，允许您更进一步插入自定义 PHP、JavaScript 和 HTML。对于流行的外部资源，共享内容的代码通常以可访问的\
  \ HTML 格式提供，Joomla! 可以在无需自定义代码插件的情况下管理它。\n\n这一关键特性意味着我们可以自定义 Joomla! 页面的内容，并只需几次点击即可嵌入和共享来自流行外部资源的内容。许多流行的多媒体网络资源，如\
  \ YouTube、Google Video、MySpace 和 Flickr 都提供共享内容的能力；事实上，这一功能是这些分发服务各自主要目的之一。\n\n\
  使用这些分发服务的内容意味着我们可以更轻松地与世界分享它，同时节省带宽成本。数据密集型的多媒体文件必须存储然后传递给您的网站访问者，自行托管多媒体内容很快就会花费您相当可观的网络托管费用。\n\
  \n从 MySpace、YouTube、Google Video 和 Flickr 等外部资源插入自定义嵌入代码实际上是一个简单的过程，这得益于分发站点打包并交付内容供我们使用。重要的是，由您的外部资源生成的代码需要有效并设计为在\
  \ HTML 环境中工作。如果是这种情况，那么将其嵌入到您的 Joomla! 文章或模块中的过程对于大多数来说应该非常相似。\n\n在本例中，我们将插入一个*来自\
  \ Google Video 的视频剪辑*，并将其输入到 Joomla! 模块中。由于 Google Video 交付内容并设计为提供易于共享内容的代码，将其添加到我们的\
  \ Joomla! 网站上只不过是一个简单的复制和粘贴练习。\n\n以下是所需步骤：\n\n![](img/0151410972a5c5ea0aab26416e44b1da_203_0.png)\n\
  \n> > 在开始将自定义代码插入 Joomla! 文章时，重要的是为您的用户账户关闭 WYSIWYG 编辑器。这是因为这些编辑器不总是能处理自定义 HTML\
  \ 代码。如果编辑器在加载内容时无法识别代码，它将完全删除代码。编辑器设置可以在全局配置中调整，或通过用户管理器按用户进行调整。\n\n- 选择您的资源，在本例中我们将使用来自\
  \ Google Video 的冲浪视频。在视频页面上，我们看到许多共享内容的选项。我们想要**嵌入视频**选项：\n- 将代码复制到剪贴板：\n- 登录您的\
  \ Joomla! 管理后台并导航到**模块管理器**区域。从顶部右侧菜单图标中选择**新建**按钮以创建新模块。\n- 在**添加新模块**页面上，选择**自定义\
  \ HTML**选项，这允许您使用自己的内容创建新模块：\n\n![](img/0151410972a5c5ea0aab26416e44b1da_204_0.png)\n\
  \n![](img/0151410972a5c5ea0aab26416e44b1da_204_1.png)\n\n![](img/0151410972a5c5ea0aab26416e44b1da_204_2.png)\n\
  \n自定义 HTML 选项允许您在模块位置中输入自定义文本或代码。\n\n![](img/0151410972a5c5ea0aab26416e44b1da_205_0.png)\n\
  \n- 您需要为新模块提供一个**标题**。选择其在模板上的**位置**并选择模块发布的其他可用选项。\n- 在**自定义输出**框中，粘贴您的“Google\
  \ Video 嵌入代码”：\n\n```html\n<embed id=VideoPlayback src=http://video.google.co.uk/googleplayer.swf?docid=-166983677991678306&hl=en&fs=true\
  \ style=width:400px;height:326px allowFullScreen=true allowScriptAccess=always type=application/x-shockwave-flash></embed>\n\
  ```\n\n- 导航到 Joomla! 站点的前端，查看**Google Video**内容现在显示在您的 Joomla! 网站上。\n\n![](img/0151410972a5c5ea0aab26416e44b1da_205_1.png)\n\
  \n这种嵌入外部内容的方法也可以应用于 Joomla! 文章，并且只要其提供的 HTML 代码被 Joomla! 接受，就可以使用几乎所有分发站点的资源。\n\n\
  ## 使用第三方扩展用于外部资源\n\n首先，本章包含数百个外部资源的可能性。\n\n![](img/0151410972a5c5ea0aab26416e44b1da_206_0.png)\n\
  \n与其采用这种方法，这里列出了一些在 Joomla.org 上驻留的更受欢迎的基于 GPL 的扩展，以及功能丰富且经受住时间考验的扩展。有关 GPL 的更多信息可在\
  \ `http://en.wikipedia.org/wiki/GNU_General_Public_License` 找到。\n\n我们还利用了这个机会，尝试在本章中仅列出非商业扩展。用于与外部资源协作的专业商业扩展也可能可用。\n\
  \n不啰嗦地说，Joomla! 扩展的目的是为您的 Joomla! 框架提供额外功能。有些扩展非常有用，以至于如果您构建多个 Joomla! 网站，您甚至可能会考虑始终将其作为默认安装。一个例子是来自\
  \ `http://www.joomlapolis.com` 的 Community Builder，它除了其他许多功能外，还增强了用户注册和个人资料选项。不同的\
  \ Joomla! 用户会收集或设计他们喜欢使用的工具，这也是 Joomla! 拥有如此繁荣社区的原因之一。\n\n开箱即用的 Joomla! 是一个轻量级的\
  \ slick CMS，而 Joomla! 的真正力量在于已开发的应用框架，该框架允许扩展其核心功能。大多数多媒体功能都是通过扩展添加到我们的 Joomla!\
  \ 站点的，随着社交网络和外部多媒体资源门户的流行，围绕这些站点的扩展迅速增长。\n\n扩展已按社交网络、视频、音频、天气等热门标题组织。有些扩展可能属于多个类别，因此已在最适用的区域中组织。每个扩展列表将包含其目的的摘要和功能列表。以下扩展标题右侧的字母表示该扩展是组件、模块、插件、语言还是模板。\n\
  \n> 由于 URL 冗长且 Joomla! 扩展目录（JED）列表可能随时更改，因此已包含以下扩展的搜索词，而不是直接链接到扩展。在 JED 上对相关术语进行搜索将帮助您轻松找到这些扩展。\n\
  > \n> 扩展标题后的字母表示以下内容：\n> M = 模块\n> C = 组件\n> P = 插件\n> L = 语言\n> T = 模板\n\n### Joomla!\
  \ 与社交网络集成\n\n社交网络是定义共享兴趣并能够互动的人群社区或群体的能力。传统上，这些是通常位于相似区域内的少数人群，但随着互联网和社交网络网站的增长，这些社区现在可供全球受众使用。\n\
  \n### Twitter Follow Me (M)\n\n“Twitter Follow Me”模块在您的网站页面上放置一个 Twitter 链接图像图标，以便访问者可以点击它前往您的\
  \ Twitter 页面。模块定位可以位于 Joomla! 模板之外，以便图标相对于用户的浏览器窗口放置，而不是包含在站点模板内。\n\n![](img/0151410972a5c5ea0aab26416e44b1da_207_0.png)\n\
  \n\n\n\n\n![](img/0151410972a5c5ea0aab26416e44b1da_209_0.png)\n\nAutoTweet 扩展的一个不错的功能是可用的额外插件，它们可以从与\
  \ Joomla! 相关的软件和扩展中发布推文。示例包括 Kunena 论坛帖子、K2 文章管理器、Phoca Download、EventList 事件管理等。\n\
  \n安装后，配置在插件参数中进行：\n\n![](img/0151410972a5c5ea0aab26416e44b1da_209_1.png)\n\n## 与外部源协作\n\
  \n新版本中的一些功能包括：\n\n- 使用 Twitter REST API 发布消息。\n- 所有插件均可自定义：账户、要发布的分类/版块、链接位置、显示版块/分类、发布私有文章、发布已修改文章、排除版块/分类、使用标题或文本作为消息、附加静态文本（例如，用于\
  \ hashtags）、短网址服务提供商（现在也支持 bit.ly）。\n- 也兼容 sh404sef 和 JoomSEF 以及 Joomla! 原生的 SEF\
  \ 支持。\n- 自动支持短网址。\n- 自动消息重发：有时发布时会收到错误消息。这在 Twitter 或 Facebook 负载过重或 API 宕机时偶尔会发生。AutoTweet\
  \ 会在 API 站点出现错误时自动重新发送状态消息。\n- AutoTweet 也会发布稍后发布或重新发布的文章。\n- AutoTweet NG 带有后端组件。该组件记录所有已发布的消息（包括错误和待处理消息），你可以在组件的后端管理和重发这些消息。\n\
  - AutoTweet NG 支持具有当前发布日期的文章。 （这些文章在 Joomla! 发布时会自动发布到 Twitter，或你可以从 AutoTweet NG\
  \ 后端组件手动发布它们。）\n\n要下载此扩展，请访问 `http://extensions.joomla.org/` 并搜索 \"AutoTweet\"。\n\
  \n## JTweet (M)\n\nJTweet 扩展是一个模块，可在你的 Joomla! 网站上发布你的 Twitter 推文：\n\n![](img/0151410972a5c5ea0aab26416e44b1da_210_0.png)\n\
  \n该模块的功能包括：\n\n- 设置要显示的推文数量。\n- 选择是否显示你的头像。\n- 选择仅显示你的推文还是与特定主题相关的所有推文。\n- 根据推文的性质选择自动连接短语。例如，回复的特定介绍文本、动词、回复推文等。\n\
  - 设置推文加载时显示的文本。\n- 通过关键词过滤你自己的推文。例如，仅显示包含 \"Joomla!\" 的推文。\n\n安装后，所有配置均在 **模块参数**\
  \ 中进行：\n\n![](img/0151410972a5c5ea0aab26416e44b1da_211_0.png)\n\n最新版本现在会即时加载脚本，使模块符合\
  \ XHTML 标准。\n\n> 请注意，该模块现在需要 JB Library 插件才能工作。JB Library 插件会自动将 jQuery 库加载到你的模板头部。jQuery\
  \ 库是 jTweet 模块所必需的。\n\n要下载此扩展，请访问 http://extensions.joomla.org/ 并搜索 \"JTweet\"。\n\
  \n## Tweetboard (P)\n\n由 \"Twitter Follow Me\" 模块的制作方带来的 \"Tweetboard\"。利用 Tweetboard\
  \ API 插件，你可以在 Joomla! 网站上显示 Twitter Tweetboard：\n\n![](img/0151410972a5c5ea0aab26416e44b1da_212_0.png)\n\
  \nTweetboard 是一种有趣且引人入胜的微型论坛类型应用，它会抓取你的 Twitter 动态并将其重新格式化为线程式对话。这是一种很好的营销技巧，可以提高网站的流量。源自原始内容的对话也会被捕获，有效地为网站访问者提供讨论布局。\n\
  \nTweetboard 扩展是一个 Joomla! 插件。安装后，配置设置位于插件管理器区域的插件中：\n\n![](img/0151410972a5c5ea0aab26416e44b1da_212_1.png)\n\
  \n> 在启用插件之前，请访问 Joomla 独家邀请门户（作者下载页面上的链接）并使用特别生成的代码：`joomlainvites01`。这将允许你快速使用\
  \ Tweetboard 与你的 Twitter 账户。\n\n要下载此扩展，请访问 `http://extensions.joomla.org/` 并搜索 \"\
  Tweetboard\"。\n\n## WebScribble jConnector (C,M,P)\n\njConnector 允许你的 Joomla! 成员使用\
  \ Facebook Connect 登录，Facebook Connect 是一套强大的 API，让开发者可以将身份和连接带入其他应用：\n\n![](img/0151410972a5c5ea0aab26416e44b1da_213_0.png)\n\
  \n如果用户已在 Facebook 注册，他们下次访问你的网站时只需点击 **Facebook Connect** 图标，即可自动登录。此集成会将这些用户添加到你的\
  \ Joomla! 数据库中，以便你通过 Joomla! 管理他们的账户。\n\n安装非常简单，只需上传一个 `jConnector.zip` 软件包文件通过扩展管理器上传。成功安装后，你需要进入模块管理器以配置\
  \ **模块参数**：\n\n![](img/0151410972a5c5ea0aab26416e44b1da_213_1.png)\n\n要开始使用 Facebook\
  \ Connect，你必须从 Facebook 获取 **API 密钥** 和 **应用密钥**。为此，你应首先在 `http://facebook.com`\
  \ 登录 Facebook。\n\n登录后，你需要前往 http://facebook.com/developers/ 并按照创建新应用的流程进行操作。一旦获得\
  \ Facebook API 密钥，你需要在插件管理屏幕中填充此参数。\n\n要下载此扩展，请访问 http://extensions.joomla.org/\
  \ 并搜索 \"jConnector\"。\n\n## Facebook Fanbox Free (M)\n\nFacebook Fanbox 是一个 Joomla!\
  \ 模块，可在你的 Joomla! 网站上显示 Facebook FanBox：\n\n![](img/0151410972a5c5ea0aab26416e44b1da_214_0.png)\n\
  \nFanbox 允许用户：\n\n- 查看已有多少用户是粉丝，并查看他们中的一些朋友\n- 阅读页面的最新帖子\n- 一键成为粉丝，无需访问页面\n\n在向你的网站添加\
  \ Fanbox 之前，你需要以下内容：\n\n- 一个 Joomla! 1.5 网站，以及安装模块的能力\n- 一个推广你网站的 Facebook 页面（你必须是该页面的管理员）\n\
  - 要输入到 **模块参数** 中的你的 Facebook 页面 ID 和个人资料 ID\n\n该扩展有许多参数选项可供控制，并且已从需要此类型功能的 Joomla!\
  \ 网站用户那里获得了良好的反馈：\n\n![](img/0151410972a5c5ea0aab26416e44b1da_215_0.png)\n\n要下载此扩展，请访问\
  \ `http://extensions.joomla.org/` 并搜索 \"Facebook Fanbox\"。\n\n## jwFacebook Comments\
  \ (P)\n\njwFacebook Comments 插件利用 Facebook 的评论功能，允许你在 Joomla! 文章末尾放置这些评论：\n\n![](img/0151410972a5c5ea0aab26416e44b1da_216_0.png)\n\
  \n如果你的网站访问者拥有 Facebook 账户，他们可以轻松地在你的 Joomla! 文章上发表评论，但该系统的一个不错的功能是任何人都可以发表评论（你不需要\
  \ Facebook 账户）。它使用 Facebook 的评论功能而不是使用你自己的，可能为你节省托管带宽成本。\n\n安装很容易，但为了使此功能正常工作，需要执行几个额外的步骤。这些步骤在开发者的网站上清楚列出，但简而言之是：\n\
  \n- 使用 Joomla! 扩展管理器安装插件\n- 将包含的 .htm 文件上传到你的 Web 服务器，然后导航到插件管理器以配置插件参数\n- 配置你的\
  \ Facebook API、上传的 .htm 文件的路径\n- 然后你需要登录 Facebook 以输入你要安装评论的网站的域名\n\n![](img/0151410972a5c5ea0aab26416e44b1da_216_1.png)\n\
  \n要下载此扩展，请访问 http://extensions.joomla.org/ 并搜索 \"jwFacebook Comments\"。\n\n\n\n\n\
  \n## Joomla! 与视频频道集成\n\n视频目前是网络上最酷的东西，而有一些很棒的 Joomla! 视频扩展可用于显示来自外部视频分发站点的内容。\n\n\
  > 必须提到的是，有一些专门针对 Joomla! 的视频解决方案，也提供对流媒体外部视频内容的支持。请参阅第 6 章《在 Joomla! 网站中使用视频》中列出的扩展，以获取更多视频解决方案。\n\
  \n### easiertube (P)\n\neasiertube 是一个 Joomla! 插件，使用和管理起来再简单不过了。它旨在从以下来源在您的文章中显示视频：YouTube、Google、UStream、Revver\
  \ 和 MySpace。\n\n![](img/0151410972a5c5ea0aab26416e44b1da_217_0.png)\n\n要使用它，只需安装此插件并在插件参数区域配置其设置。在内容文章中输入远程视频链接，插件将自动转换\
  \ URL 并在页面中嵌入播放器。可以设置的参数有：\n\n- 首页显示宽度和高度\n- 主内容显示宽度和高度\n- 全屏\n- 自动播放\n\n最新版本（5.5）现已包含：\n\
  \n- YouTube 支持\n- 相关视频（YouTube），也可禁用搜索\n- 禁用显示信息\n- 禁用注释\n- 显示边框（可选项颜色）\n- Metacafe\
  \ 视频\n- 显示统计信息\n- 显示视频标题\n\n使用扩展管理器安装插件，并在插件管理器区域配置其参数：\n\n![](img/0151410972a5c5ea0aab26416e44b1da_218_0.png)\n\
  \n要下载此扩展，请访问 http://extensions.joomla.org/ 并搜索 \"easiertube\"。\n\n### QTUBE (M,\
  \ P)\n\nQTUBE 是一个模块和插件，旨在将 YouTube 视频嵌入到 Joomla! 内容文章中：\n\n![](img/0151410972a5c5ea0aab26416e44b1da_219_0.png)\n\
  \n该插件允许您在 Joomla! 文章中播放视频，并包含可用于调整视频容器对象外观的参数。\n\nQTUBE 的开发者还开发了一个 QTUBE 模块，可将视频包含到模块中。\n\
  \n模块和插件均通过扩展管理器安装，其默认参数可在插件和模块管理器区域设置：\n\n![](img/0151410972a5c5ea0aab26416e44b1da_219_1.png)\n\
  \n要下载此扩展，请访问 http://extensions.joomla.org/ 并搜索 \"QTUBE\"。\n\n### JMultimedia Suite\
  \ (C, M, P)\n\nJMultimedia Suite 是一套多媒体扩展。它可以自动检测并显示来自众多流媒体站点和多种媒体格式的视频。它为管理员提供众多视频选项：\n\
  \n![](img/0151410972a5c5ea0aab26416e44b1da_220_0.png)\n\n主要功能有：\n\n- 创建/编辑视频分类\n\
  - 创建/编辑媒体项目\n- 可自定义 CSS\n- 支持多媒体格式\n- 与 commenter 评论系统集成\n\nJMultimedia Suite 的要求是必须安装扩展\
  \ \"denVideo\"。安装后，它将自动识别文章中的视频链接，并支持 denVideo 支持的所有视频格式，包括：\n\n- SWF（Flash 应用程序）\n\
  - FLV 和 H264（Flash 视频）\n- CLASS（Java 小程序）\n- MOV 和 MP4（QuickTime）\n- RM 和 RAM（RealMedia）\n\
  - MP3（音频）\n\n要下载此扩展，请访问 http://extensions.joomla.org/ 并搜索 \"LCPlayer\"。\n\n## Joomla!\
  \ 与照片集成\n\nJoomla! 与图像配合良好，从外部资源显示照片和画廊的机会非常广泛。以下是用于此目的的一些更受欢迎的扩展。\n\n> Joomla!\
  \ 的许多图像扩展也提供从外部资源显示内容的能力。\n\n### UniversalPlayground - Flickr 幻灯片插件 (P)\n\nUniversalPlayground\
  \ - Flickr 幻灯片插件使用简单的灯箱效果显示您 Flickr 账户中的幻灯片：\n\n![](img/0151410972a5c5ea0aab26416e44b1da_223_0.png)\n\
  \n此扩展使用 phpFlickr 库、Slimbox（轻量级视觉灯箱克隆）和 TripTracker 幻灯片脚本。\n\n只需在文章中输入简单表达式，即可显示单张照片或完整的图集，例如：`[flickr\
  \ photo=xxx]`（其中 xxx 用照片 ID 号替换）。\n\n插件包含众多自定义参数：\n\n![](img/0151410972a5c5ea0aab26416e44b1da_224_0.png)\n\
  \n> 需要输入 Flickr API 密钥到您的插件中，模块和开发者网站上提供此链接。\n\n要下载此扩展，请访问 http://extensions.joomla.org/\
  \ 并搜索 \"UniversalPlayground - Flickr slideshow\"。\n\n### Flickr + Highslide (M)\n\
  \nFlickr + Highslide 模块扩展使用 Highslide JavaScript 效果在您的 Joomla! 网站中显示来自 Flickr 的照片：\n\
  \n![](img/0151410972a5c5ea0aab26416e44b1da_225_0.png)\n\nHighslide 是一个用 JavaScript\
  \ 编写的开源媒体和画廊查看器。该模块以优雅的外观显示 Flickr 内容，并包含以下功能：\n\n- 13 种独特的照片显示方式\n- 八种不同的画廊样式\n\
  - 显示来自照片集的照片\n- 显示用户的全部照片\n- 按最新或随机顺序显示照片\n- 可更改图像和缩略图的大小\n- 可将照片分页显示\n- 显示照片标题\n\
  \n该模块需要您的 Flickr 账户 ID。它还提供众多样式参数：\n\n![](img/0151410972a5c5ea0aab26416e44b1da_225_1.png)\n\
  \n要下载此扩展，请访问 http://extensions.joomla.org/ 并搜索 \"Flickr Highslide\"。\n\n## Joomla!\
  \ 与天气集成\n\n对于繁忙的新闻和社区门户，提供天气预报是一个常见需求。Google Weather 是这些扩展天气信息来源的热门资源，这归功于其提供的全球解决方案。还有许多其他天气扩展；以下是一些热门的。\n\
  \n### Google Weather - Plugin (P, M)\n\nGoogle Weather - Plugin 是一个轻量级插件，使用 Google\
  \ Weather Forecast API 在您的 Joomla! 文章中显示当前天气：\n\n![](img/0151410972a5c5ea0aab26416e44b1da_226_0.png)\n\
  \n通过使用简单的插件标签触发插件，可以将 {WEATHER CITY, COUNTRY} 包含到内容中，插件将完成其余工作！\n\n插件通过扩展管理器安装，然后使用插件管理器配置。可用的样式选项众多，插件可使用自定义\
  \ CSS 配置。您可以使用文章中的插件标签随意频繁地显示天气。\n\n## 与外部资源协作\n\n组件、模块和插件均通过扩展管理器安装，然后使用相应的管理器配置。每个元素都提供自己的参数和配置选项，以便按您想要的方式显示天气：\n\
  \n![](img/0151410972a5c5ea0aab26416e44b1da_228_0.png)\n\n要下载此扩展，请访问 `http://extensions.joomla.org/`\
  \ 并搜索 \"Z Weather\"。\n\n### eWeather (C,M)\n\neWeather 是一个组件（附带一个额外模块），可在您的 Joomla!\
  \ 页面中以视觉上吸引人的方式显示当前状况和天气预报。天气数据由 The Weather Channel 通过 XML feed 提供：\n\n![](img/0151410972a5c5ea0aab26416e44b1da_229_0.png)\n\
  \n组件的一个不错功能是允许网站访问者选择自己的城市并查看五天预报。然而，信息显示中包含一些 \"Weather Channel\" 广告。\n\neWeather\
  \ 是一个功能强大的组件，允许在组件配置设置中进行配置。这些包括：\n\n- 已安装地区/国家的全新概览和管理\n- 城市的默认配置\n- 最长五天的天气预报\n\
  - 日期/时间格式可自由定义\n- 可定义代理\n\n新的图标样式包现已可用，可自定义您网站的外观。还提供了一个配套模块，可在任何模块位置显示天气：\n\n![](img/0151410972a5c5ea0aab26416e44b1da_229_1.png)\n\
  \n\n\n\n\n要下载此扩展，请访问 http://extensions.joomla.org/ 并搜索 \"eWeather\"。\n\n## Joomla!\
  \ 与新闻频道集成\n\n有许多优秀的新闻频道扩展可用于抓取外部新闻并在您的网站页面上显示。使用 RSS 技术，可以手动执行此过程，但以下扩展使事情变得简单易行。\n\
  \n### Google News (M)\n\nGoogle News 模块可将 Google 新闻故事嵌入到您网站的任何模块位置。它允许您的网站访客查看您选择的\
  \ Google 新闻的标题和预览：\n\n![](img/0151410972a5c5ea0aab26416e44b1da_230_0.png)\n\n此模块包含众多参数，包括过滤主题、调整显示的尺寸、国家和语言的能力。它是一个简单的模块，但非常适合希望在\
  \ Joomla! 网站中轻松显示 Google 新闻的用户。\n\nGoogle News 模块通过扩展管理器安装，配置在模块中设置。\n\n![](img/0151410972a5c5ea0aab26416e44b1da_231_0.png)\n\
  \n要下载此扩展，请访问 http://extensions.joomla.org/ 并搜索 \"Google News\"。\n\n## 其他资源及如何将其与\
  \ Joomla! 集成\n\n有数百个扩展允许 Joomla! 与外部资源交互，以下是一些示例。\n\n### Plugin GoogleMaps (P)\n\
  \n此扩展是用于在 Joomla! 的文章、模块或组件中显示一个或多个 Google 地图的插件！\n\n![](img/0151410972a5c5ea0aab26416e44b1da_232_0.png)\n\
  \n与许多插件一样，地图是通过使用包含众多参数的特殊标签来显示的。这些提供了真正自定义地图内容的能力，以下是该插件功能的少量选择：\n\n- 可调整宽度和高度\n\
  - 可调整纬度和经度\n- 缩放控件\n- 地图标记\n- 为地图添加选择和工具提示\n\nGoogleMaps 插件通过扩展管理器安装，默认配置在插件中设置，可通过每次使用插件触发标签的实例进行覆盖。\n\
  \n使用大多数 Google 地图服务需要 GoogleMaps 参考密钥，并且是此插件正常工作的要求。\n\n![](img/0151410972a5c5ea0aab26416e44b1da_233_0.png)\n\
  \n要下载此扩展，请访问 http://extensions.joomla.org/ 并搜索 \"GoogleMaps\"。\n\n### Ajax Whois\
  \ (C,M)\n\nAjax Whois 扩展是 Joomla! 的国际域名搜索和“whois”扩展，利用 Ajax 技术，让您的 Joomla! 网站访客可以检查域名是否可用。这些搜索结果会即时显示在网站上：\n\
  \n![](img/0151410972a5c5ea0aab26416e44b1da_233_1.png)\n\nAjax Whois 组件和模块通过扩展管理器安装，默认配置在组件中设置。有众多显示选项可用。\n\
  \n要下载此扩展，请访问 http://extensions.joomla.org/ 并搜索 \"Ajax Whois\"。\n\n### SlideShare\
  \ (P)\n\nSlideShare 是一项服务，允许您上传和分享 PowerPoint 演示文稿、Word 文档和 PDF 文档。此简单模块随后允许您在 Joomla!\
  \ 网站中显示 SlideShare 内容：\n\n![](img/0151410972a5c5ea0aab26416e44b1da_234_0.png)\n\n\
  使用此服务需要 SlideShare 用户账户。\n\nSlideShare 插件通过扩展管理器安装，默认配置使用插件管理器设置：\n\n![](img/0151410972a5c5ea0aab26416e44b1da_234_1.png)\n\
  \n要下载此扩展，请访问 http://extensions.joomla.org/ 并搜索 \"SlideShare Plugin\"。\n\n### Slick\
  \ RSS (M)\n\nSlick RSS 允许您解析并在 Joomla! 网站上以漂亮的工具提示摘要功能显示外部 RSS 源：\n\n![](img/0151410972a5c5ea0aab26416e44b1da_235_0.png)\n\
  \n部分功能包括：\n\n- 配置项目数量\n- 显示标题和描述\n- 启用/禁用图片\n- 限制标题和描述的字数\n\nSlick RSS 模块通过扩展管理器安装，配置在模块管理器中设置：\n\
  \n![](img/0151410972a5c5ea0aab26416e44b1da_235_1.png)\n\n要下载此扩展，请访问 http://extensions.joomla.org/\
  \ 并搜索 \"Slick RSS\"。\n\n### RokBox Plugin (P)\n\n![](img/0151410972a5c5ea0aab26416e44b1da_236_0.png)\n\
  \nRokBox 是一个由 MooTools 驱动的 JavaScript 幻灯片放映，允许您快速轻松地显示多种媒体格式，包括图片、视频（视频分享服务也支持）和音乐。\n\
  \nRokBox 提供主题系统，允许您创建自己的自定义主题以适应您网站的设计。它包含两个预定义主题，即浅色主题和深色主题，可无缝融入您的网站设计。\n\nRokBox\
  \ 是一个不错的一体化解决方案，可使用专业效果呈现多媒体内容。它可以像播放您自己的文件一样轻松播放外部媒体源，例如 YouTube 视频。\n\n![](img/0151410972a5c5ea0aab26416e44b1da_237_0.png)\n\
  \n要下载此扩展，请访问 http://extensions.joomla.org/ 并搜索 \"RokBox\"。\n\n### Simple RSS Feed\
  \ Reader (M)\n\n使用“Simple RSS Feed Reader”模块，现在在 Joomla! 网站中添加 RSS 汇集内容变得超级简单：\n\
  \n![](img/0151410972a5c5ea0aab26416e44b1da_237_1.png)\n\n使用方法：在模块设置中插入您想要汇集的网站的源（RSS）URL，编辑您的模块选项，然后在所需位置发布模块。模块将显示您模块中的最新源内容。\n\
  \nSimple RSS Feed Reader 基于非常流行的 SimplePie PHP 类，这使得将汇集内容集成到 Joomla! 网站变得容易。该模块支持从\
  \ RSS 0.91 和 RSS 1.0 格式到 ever-popular RSS 2.0 格式的所有内容。它还支持新兴的 Atom 格式，包括 0.3 和 1.0\
  \ 版本。\n\n该模块具有非常快速、非常高效的缓存系统。通过缓存处理后的数据而不是原始 XML，模块能够创建快速的源解析器，不会在页面加载时造成过多的开销。\n\
  \n![](img/0151410972a5c5ea0aab26416e44b1da_238_0.png)\n\n要下载此扩展，请访问 http://extensions.joomla.org/\
  \ 并搜索 \"Simple RSS Feed Reader\"。\n\n## 总结\n\n对于 Web 的常规用户，有几个关键工具和社交网络站点可能包含您的个人资料和数据。每个月，这些站点与其他在线资源（包括\
  \ Joomla!）之间的集成都在改进。所有这些都有助于最大限度地减少账户登录次数和数据在不同地方的重复。\n\nWeb 2.0 全部是关于将自己融入 Web\
  \ 体验并分享您的信息；成为 Web 的一部分，而不仅仅是搜索资料。来自外部资源的内容可通过使用 HTML 代码或为与流行资源协作而设计的自定义扩展轻松嵌入到\
  \ Joomla! 中。\n\nJoomla! 在将其框架中显示外部数据的同时，也非常适合将自己的内容广播到其他来源。正在以惊人的速度开发新扩展，为与流行的外部网络资源协作提供解决方案。随着时间的推移，这只会增加，因为\
  \ Joomla! 开发者社区帮助定义了 Web 上“下一个大事件”的集成……无论它是什么。\n"
- "# 8 Joomla! 模板和多媒体\n\nJoomla! 模板是使一个 Joomla! 网站与下一个网站不同的决定性因素。它们包含显示 Joomla! 内容的结构元素，并向用户的网络浏览器提供样式和脚本信息。\n\
  \n由于 Joomla! 模板为您的网站提供样式信息，因此它们自然会对 Joomla! 网站中的多媒体元素产生影响。除了您的网站设计和模块格式（通常使用图片）之外，模板可能包含高级\
  \ JavaScript 功能，可增强您网站的多媒体功能。\n\n本章是 Joomla! 模板的概述，说明它们的工作原理以及它们如何影响 Joomla! 网站中多媒体内容的显示。了解模板如何增强多媒体功能，以及它们如何影响\
  \ Joomla! 网站在移动网络设备上的显示方式。它包含：\n\n- 什么是 Joomla! 模板？\n- 模板组件\n- 脚本和多媒体\n- 移动网络\n\
  - 使您的网站适合移动设备\n- 可访问性\n\n\n\n\n\n## 什么是 Joomla! 模板？\n\nJoomla! 使用模板系统来控制网页内容的外观、风格和布局。\n\
  \nJoomla! 的设计将交付网站的关键流程在其设计中分离出来，使 Joomla! 尽可能高效，并且作为软件易于维护：\n\n![](img/0151410972a5c5ea0aab26416e44b1da_242_0.png)\n\
  \n其中一个元素是 Joomla! 模板，它控制整体布局，并区分一个 Joomla! 安装与下一个。模板提供结构，可将各种内容元素（包括组件、插件和模块）放置在任何给定页面的几乎任何您选择的部分。您\
  \ Joomla! 网站成功的最重要因素之一将是您希望向受众传达的信息，以及模板是如何设计来实现这一点的。这就是模板设计可以成就或毁掉您的 Joomla! 网站的地方：\n\
  \n![](img/0151410972a5c5ea0aab26416e44b1da_242_1.png)\n\n在制作网站时，许多元素的位置通常保持不变。例如，菜单、搜索框、横幅、版权、侧边栏通常都固定在页面的固定位置。重要的样式信息将包含在样式表中（控制字体、颜色和信息放置），并且需要包含在内，以便在每个页面上呈现。\n\
  \n这就是为什么开发了模板，而 Joomla! 是它们可以有效利用的完美示例。您可以为站点构建的每个网页重新创建所有上述功能，也可以利用模板结构将此信息包含并传递到每个页面。我们作为管理员只需用站点内容“填补空白”。\n\
  \n## 模板组件\n\nJoomla! 利用模板用于站点的前端视图和后台管理部分。\n\n管理部分有一个模板（名为 Khepri），作为默认安装并创建管理界面的样式：\n\
  \n![](img/0151410972a5c5ea0aab26416e44b1da_243_0.png)\n\nJoomla! 管理模板位于 /administrator/templates\
  \ 目录中。如果您希望调整站点管理模板，请复制默认的 Khepri 模板并将模板文件夹重命名为您的新名称。确保重命名 XML 引用，然后您可以开始自定义管理主题。也有第三方管理员模板可用，可为您的\
  \ Joomla! 管理提供全新的外观。\n\n前端的模板包含在 Joomla! 的 /templates 目录中：\n\n![](img/0151410972a5c5ea0aab26416e44b1da_244_0.png)\n\
  \n您的 Joomla! 模板包含一组文件和目录以对内容进行子分类。典型的 Joomla! 1.5 模板结构通常包含以下内容：\n\n- `index.php`：这是一个关键文件，通常包含用于模块和组件显示及定位的\
  \ HTML 和 PHP 逻辑。\n- `component.php`：提供“通过电子邮件将此链接发送给朋友”等附加页面的显示逻辑，以及打印友好页面。\n- `css/template.css`：模板\
  \ CSS 文件通常位于 CSS 文件夹中，处理模板的展示方面，包括字体、标题、边距、图像边框、列表格式等规范。\n- `templateDetails.xml`：`templateDetails.xml`\
  \ 是另一个关键文件，其中保存与模板相关的元信息，并被 Joomla! 安装程序和模板管理器使用。该文件还包含模板使用的模块位置引用。\n\n- `template_thumbnail.png`：此图像文件可以是\
  \ JPG、GIF 或 PNG 文件。通常，它是一个 200 x 150 像素的图像，当在模板管理器中将光标悬停在模板名称上时显示。这为管理员在将模板应用到站点之前提供了模板的快照视图。\n\
  \n典型的 Joomla! 1.5 模板还将包含以下目录：\n\n- `css`：CSS 文件夹包含模板的所有 CSS 文件。\n- `html`：此文件夹通常包含核心输出的模板覆盖文件。\n\
  - `images`：images 文件夹包含模板使用的所有图像。在流行的商业模板中，在 images 文件夹内拥有多个子目录，每个子目录包含图像的不同颜色变化的情况并不少见。\n\
  \n![](img/0151410972a5c5ea0aab26416e44b1da_245_0.png)\n\nJoomla! 的模板文件夹通常包含与网站上使用的模板直接相关的所有相关文件。因此，您在\
  \ Joomla! 文章中使用的图像和其他多媒体内容应位于自己的文件夹中，而不是放置在模板文件夹中。\n\n## 脚本和多媒体\n\n当大多数用户听到“多媒体”一词时，可能会首先想到“图像”和“视频”内容。该术语用于描述这些突出的媒体元素；然而，在这个快速发展的网络世界中，新的功能和交互元素正在不断出现。\n\
  \n一些商业模板提供商现在为 Joomla! 创建功能丰富的模板系统，不仅包含基本模板元素，还包括大量脚本，使软件包对用户来说更具功能性和多功能性。\n\n这些功能包括复杂的\
  \ JavaScript 下拉菜单系统、用户定义的模块排序、移动网络主题、广泛的排版选项等等。虽然其中一些功能可能不被视为“多媒体”的传统形式，但它们通常包含文本、图像、字体、颜色，并为网站用户提供交互体验。\n\
  \n![](img/0151410972a5c5ea0aab26416e44b1da_246_0.png)\n\n上图显示了来自 RocketTheme 的 Solar\
  \ Sentinel 模板，网址为 http://www.rockettheme.com。\n\n## Mellow 模板—Yootheme\n\nMellow\
  \ 是 YooTheme 提供的一个功能丰富但简单且组织良好的模板：\n\n![](img/0151410972a5c5ea0aab26416e44b1da_247_0.png)\n\
  \n`www.yootheme.com` 包含大量脚本功能，包括以下内容：\n\n- 功能强大的灵活菜单系统：这包括带图标的众多子菜单选项等：\n\n![](img/0151410972a5c5ea0aab26416e44b1da_247_1.png)\n\
  \n- 自动日期/天数调整：它使用 PHP 脚本来相应地调整日期：\n- 十种颜色选项：这个系列适合每个人：\n- MooTools 酷炫淡入淡出菜单项：主菜单和侧菜单项不仅有悬停效果，还有使用\
  \ JavaScript 操作实现的微妙淡入淡出效果。\n- 详细的排版：Mellow 包含大量文本格式和标题样式信息，使您的网站文本可以轻松包含众多样式元素：\n\
  \n![](img/0151410972a5c5ea0aab26416e44b1da_248_0.png)\n\n![](img/0151410972a5c5ea0aab26416e44b1da_248_1.png)\n\
  \n![](img/0151410972a5c5ea0aab26416e44b1da_248_2.png)\n\n- 返回顶部：页面底部包含一个图标，并带有 JavaScript\
  \ 平滑滚动返回顶部的功能：\n\n![](img/0151410972a5c5ea0aab26416e44b1da_249_0.png)\n\n## Infuse—RocketTheme\n\
  \nInfuse by RocketTheme 是一款色彩丰富且专业的模板，可能适合各种用途：\n\n![](img/0151410972a5c5ea0aab26416e44b1da_249_1.png)\n\
  \nInfuse 模板是艺术风格和功能的融合。该主题拥有六种独立且独特的样式变体：\n\n- 1. Fusion：功能强大的基于 JavaScript 的下拉菜单系统（包括菜单图标、子菜单支持）：\n\
  \n![](img/0151410972a5c5ea0aab26416e44b1da_250_0.png)\n\n- 2. 样式变体：有 18 个选项可供选择，同一模板可以通过各种主题选项呈现全新的外观和感觉：\n\
  \n![](img/0151410972a5c5ea0aab26416e44b1da_250_1.png)\n\n3. 优化布局：您的中心内容将首先加载到页面中，领先于侧边栏，这对搜索引擎优化是一个额外的增强：\n\
  \n![](img/0151410972a5c5ea0aab26416e44b1da_251_0.png)\n\n4. 排版选项：为您的内容增添特色并使其栩栩如生，使用一系列精美的样式选项：\n\
  \n![](img/0151410972a5c5ea0aab26416e44b1da_251_1.png)\n\n5. 返回顶部：而不是让用户再次滚动到页面顶部，他们可以利用易于使用的返回顶部超链接，该链接使用\
  \ JavaScript 平滑滚动到页面顶部：\n\n![](img/0151410972a5c5ea0aab26416e44b1da_251_2.png)\n\
  \n\n\n\n- 6. 多模块位置和变体：拥有28个模块位置，并且每个位置都有一系列样式选项，你总能找到地方放置内容：\n\n![](img/0151410972a5c5ea0aab26416e44b1da_252_0.png)\n\
  \n## Joomla! 模板与多媒体\n\n### JA Halite—Joomla Art\n\nJA Halite 是 Joomla Art（www.joomlaart.com）出品的一款简洁而醒目的模板。该模板功能丰富，包括移动设备支持、颜色和样式选项以及菜单选项：\n\
  \n![](img/0151410972a5c5ea0aab26416e44b1da_252_1.png)\n\n其功能包括：\n\n- 手持设备和 iPhone\
  \ 支持：当识别到移动设备时，此模板会自动简化站点内容和样式：\n\n  ![](img/0151410972a5c5ea0aab26416e44b1da_253_0.png)\n\
  \n- 多主题：十个主题选项，每个主题内还有模块变体：\n\n  ![](img/0151410972a5c5ea0aab26416e44b1da_253_1.png)\n\
  \n- 丰富的菜单选项：四种不同的菜单选项，包括分割菜单、CSS 菜单、MooTools 菜单和超级菜单。\n\n- **排版：** 此模板包含一些精心预设计的样式和格式，让你可以轻松使用多种颜色、样式和图标来美化网页文本：\n\
  \n  ![](img/0151410972a5c5ea0aab26416e44b1da_254_0.png)\n\n### Motion—Yootheme\n\
  \n无论是否合你口味，Yootheme 出品的 Motion 主题都是一个功能丰富的 Joomla! 模板，包含宽屏布局和强大的脚本，可创造出众多动画效果：\n\
  \n![](img/0151410972a5c5ea0aab26416e44b1da_254_1.png)\n\n该模板中的每个主题都有自己独特的动画效果，这些效果通过图形、CSS\
  \ 和 JavaScript 的组合来实现。在下一个截图显示的主题中，两艘船在屏幕上划过，背景中的云朵也在页面上缓缓飘动：\n\n![](img/0151410972a5c5ea0aab26416e44b1da_255_0.png)\n\
  \nMotion 模板实际上是将十个模板合为一体，这得益于其主题的多样性：\n\n- 十个内置主题：每个主题都包含丰富的图形和动画：\n\n  ![](img/0151410972a5c5ea0aab26416e44b1da_255_1.png)\n\
  \n- 自动日期功能：日期随服务器日期的变化而变化。\n\n  ![](img/0151410972a5c5ea0aab26416e44b1da_256_0.png)\n\
  \n- MooTools 菜单：具有滑动框、颜色渐变等炫酷效果的菜单。菜单项可以包含说明性副标题和其他强大的菜单效果。\n- IE 的 PNG 修复：由于只有\
  \ IE7 及更高版本支持透明的 PNG 图像文件，Yootheme 的 PNG 修复功能可为整个模板中的内联图像和背景图像启用 PNG 透明效果。\n- 无表格模板覆盖：该模板不仅设计上不使用表格，还会让整个内容区域摆脱表格布局，而\
  \ Joomla! 通常会将内容区域渲染为表格：\n\n  ![](img/0151410972a5c5ea0aab26416e44b1da_256_1.png)\n\
  \n模板的列表还可以继续列下去。正如你所见，模板可以完全改变 Joomla! 网页的外观、感觉和复杂程度。即使是同一个模板，也可以按照与他人不同的方式进行完全不同的配置。为你的项目选择合适的模板，可以大幅缩短项目时间和节约开支，同时还能让你开箱即用地获得这些额外的多媒体功能。\n\
  \n大多数新的专业 Joomla! 模板都包含菜单选项、彩色主题和复杂的 CSS。这意味着，你添加到网站上的大多数构建良好的扩展都能轻松集成到你的模板中，并自动采用合适的模板样式。\n\
  \n## 移动网络\n\n“移动网络”一词指的是使用移动设备（如手机、PDA、iPhone 等）访问的基于 Web 浏览器的服务。\n\n![](img/0151410972a5c5ea0aab26416e44b1da_257_0.png)\n\
  \n移动网络用户的数量每年都在增长，维基百科热门页面 `http://en.wikipedia.org/wiki/Mobile_Web` 上的一条条目提到：“2008\
  \ 年，移动网络用户总数首次超过了基于 PC 的互联网用户总数。” 这对于一些从未使用过移动网络服务的人来说可能是个冲击，而对我们这些开发者/管理员来说，注意到这一点很重要。\n\
  \n在移动网络设备发展的早期，浏览移动网络的唯一方式是访问 WAP 站点。**无线应用协议（WAP）**是一种安全规范，允许用户通过手持无线设备即时访问信息。WAP\
  \ 使用**无线标记语言（WML）**作为其主要标记语言。\n\n随着移动网络的发展，WML 已被多种其他技术所取代。现在的新技术标准是**可扩展超文本标记语言（XHTML）**。\n\
  \nXHTML 是一种可扩展标记语言，被设计为 XML 的子集。这是为了促进更强的互操作性，并使得使用标准 XML 工具解析 XHTML 成为可能。如今大多数移动设备都支持两种风格的\
  \ XHTML：\n\n- XHTML：与桌面 Web 浏览器使用的标记语言相同\n- XHTML—MP：MP 代表移动电话（Mobile Phone）\n\n\
  这种媒介最大的限制之一在于，移动网络仍然存在可访问性和可用性问题。例如，移动设备通常屏幕较小，难以容纳内容。有些设备试图模仿 Web 浏览器，但仍然需要放大和缩小网页。另一些设备则无法运行某些软件，例如\
  \ Adobe Flash Player。此外还有格式多样和连接方面的问题。\n\n![](img/0151410972a5c5ea0aab26416e44b1da_258_0.png)\n\
  \nWeb 开发者们直到现在才开始花时间研究这一主题，以及如何让网站对移动网络用户可用。作为 Joomla! 用户，我们有许多测试流程和选项可供使用。\n\n\
  > 在为基于 PC 的万维网浏览进行开发时，作为开发者，我们需要考虑不同的 Web 浏览器和屏幕分辨率。而在为移动网络开发时，需要考虑的因素更多。这主要是因为移动设备上可用的操作系统和屏幕尺寸种类繁多。\n\
  \n### 让网站更适合移动设备\n\n你网站的主要目的是尽可能轻松地将内容传递给受众，同时（希望）让他们享受这一体验。由于大多数 Joomla! 模板都是为桌面浏览而设计的，因此往往很少考虑到日益增长的移动网络用户群体。\n\
  \n可以通过多种方法来调整你的网站，使其更适合移动网络这一媒介：\n\n![](img/0151410972a5c5ea0aab26416e44b1da_259_0.png)\n\
  \n移动用户上网通常是为了快速获取信息，因此尽可能简化这一过程对他们来说非常重要。虽然你的 Joomla! 模板在桌面浏览器中可能包含数百张图片，看起来非常精美时尚，但移动网络用户可能正在“外出奔波”，他们可能只想要能直接带他们到所需信息的链接。这通常意味着需要对内容进行简化，而这也是移动网络用户所期望的。\n\
  \n### 考虑这些调整\n\n开发移动友好的 Joomla! 网站的最佳途径之一，是从一个格式良好、HTML 有效的模板代码库入手，并使用合理的语义标记进行构建。结构良好的代码文档将清晰显示，按有序顺序加载元素，并且由于代码有效且组织良好，应当能在许多设备上使用。\n\
  \n### 重要区域\n\nJoomla! 模板中最重要的视觉热点之一是左上角区域。这里通常是放置 Logo 的地方。请注意，你希望移动网络用户能够轻松导航，而不是为了找到一个菜单链接而不断缩放或滚动整个页面。因此，如果你正在创建网站内容的定制移动版本，请将主导航或搜索功能放在左上角区域：\n\
  \n![](img/0151410972a5c5ea0aab26416e44b1da_260_0.png)\n\n上面的图片显示了一个用于 PC 端 Web 浏览器的网站模板，以及一个专为手持设备提供的独立网站模板。\n\
  \n\n\n\n\n## 禁用图像、CSS 和 JavaScript\n\n对于较旧的移动设备，可用的最佳开发方法之一是在网站页面上禁用图像 CSS 和 JavaScript，然后看看效果如何。去掉模板的主要样式后，您的网站将呈现完全不同的外观和感觉，您将看到元素在页面上加载时的自然布局。\n\
  \n## 对多媒体采用按需方式\n\n如果您在网站中使用多媒体，请考虑在用户请求时提供这些内容，而不是在用户登陆网站页面时就轰炸用户这些信息。\n\n视频、图像、音频或其他网站中的多媒体可以通过超链接到预期内容的方式呈现给用户。这种方法提供选择，意味着用户可以选择在想要时访问该内容，而不是被强行灌输。如果您使用\
  \ Flash 播放器显示播客的剧集，请考虑使用在有人选择播放时才加载媒体的播放器。这种方法通常会导致结构良好的网站，加载速度快，并且具有健康的“大内容”感觉。\n\
  \n## 为移动设备加载自定义样式表或模板\n\n通过 PHP、HTML 和 CSS 的组合，您的 Joomla! 网站可以识别特定的移动网络设备并为其提供特定的样式表。通过使用此方法，您可以为内容提供简化的布局，从而使页面加载更快，使用户更易于导航网站页面。\n\
  \n有一些网站和工具可以帮助生成用于识别访问您网站的特定设备的 PHP 代码。需要一定的 PHP 和 CSS 技能才能实现这些结果，但通过在该领域的努力，您可以使用\
  \ Joomla! 内容专门针对移动市场。一种有用的工具可以在 `http://detectmobilebrowsers.mobi/` 找到。\n\n![](img/0151410972a5c5ea0aab26416e44b1da_262_0.png)\n\
  \n站点生成器将允许您根据自己的环境定制代码，然后下载适用的代码供您使用。它对非营利网站免费，商业用途接受捐赠。对于 PHP 知识有限但喜欢动手玩代码的人来说，这个工具会很有帮助。\n\
  \n对于开发技能有限的人来说，还有许多 Joomla! 扩展可用。\n\n## 可用的扩展\n\n现在有许多移动网络扩展可用于 Joomla!，可以帮助使您的网站可供移动设备访问，并降低实现这一目标所需的专业知识。\n\
  \n## Joomla! 1.5 的 PDA 插件 (P.T)\n\nJoomla! 1.5 的 PDA 插件的本质是为您的 Joomla! 网站激活 PDA\
  \ 模板或移动网络友好的模板，而不是使用默认站点模板：\n\n![](img/0151410972a5c5ea0aab26416e44b1da_263_0.png)\n\
  \n此插件将根据其识别移动设备的用户代理来确定是否适合激活自身。有两种使用此插件的方法：\n\n- 1. 在同一链接 http://yoursite.com/\
  \ 上为移动浏览器显示网站的移动版本。可以根据用于查看的设备看到网站的完整版和移动版。这被称为多客户端方法。\n- 2. 为子域显示网站的移动版本。例如，http://pda.yoursite.com/。这被称为多站点方法。\n\
  \n使用此插件，可以使用这两种方法中的一种或两种。\n\n### 安装\n\nJoomla! 1.5 的 PDA 插件有两个元素。首先，您安装模板，其次使用 Joomla!\
  \ 扩展管理器安装插件。\n\n插件需要发布并包含许多配置选项。PDA 插件的工作方式是激活 PDA 模板（或在插件参数中设置的其他模板），以便您的网站简化为可在移动网络设备上工作。\n\
  \n此插件省去了放置代码以识别访问您网站的不同设备的繁重工作，但您可能仍需要动手调整包含的 PDA 模板以满足您的喜好。\n\n要下载此扩展，请访问 http://extensions.joomla.org/\
  \ 并搜索 \"PDA-plugin\"。\n\n## WAFL：移动内容适配 (P,C,T,M)\n\n**网站适配和格式化层 (WAFL)** 是为实现 Joomla!\
  \ 网站的设备特定内容适配而构建的。它仍处于 alpha 模式，因此尚未达到其他 Joomla! 扩展的成熟度。\n\n此插件支持三种操作模式。所选模式将在插件检测到请求来自移动设备时激活：\n\
  \n- 1. 模板切换：您将能够选择一个将在移动请求中使用的模板。插件包含一个移动模板，可供使用。\n- 2. 移动重定向：访问者将被重定向到您可以指定的 URL。\n\
  - 3. Siruna：它是一个用于创建移动网络应用程序的完全托管解决方案。当此模式激活时，插件将把任何移动请求重定向到 Siruna 平台的实例。它还将向来自\
  \ Siruna 平台的请求提供移动模板（丰富了 Siruna 的信息）。\n\n### 安装\n\n有一个扩展需要安装，其中包含四个不同的文件：\n\n- 1.\
  \ **插件**：它拦截 Joomla! 事件，以便移动用户获得增强的移动内容。\n- 2. **管理员组件**：在 WAFL 管理端部分，网站管理员将能够更改首选项以适应其网站。\n\
  - 3. **WAFL 模板**：它提供我们移动模板的基本版本，而不考虑屏幕宽度和高度。\n- 4. **WAFL 模块**：它实际上是一个组件包装器，可在 WAFL\
  \ 模板中启用模块排序。\n\n扩展通过扩展管理器安装。\n\n我们的扩展的管理端可以通过在 **组件** 菜单中单击 **WAFL** 找到。在这里，您可以更改移动网站版本的风格，或配置和显示移动网站的方式。\n\
  \n您需要通过使用移动设备浏览您的网站来检查移动设置，甚至最好查看多个设备（就像您使用 Safari、IE6、IE7 等进行测试时一样），以确保一切符合您的要求。\n\
  \n要下载此扩展，请访问 [http://extensions.joomla.org/](http://extensions.joomla.org/) 并搜索\
  \ \"WAFL Mobile Content\"。\n\n## Joomla 1.5 的 Mobilebot (P)\n\nMobilebot 1.0 for\
  \ Joomla! 1.5.x 可以检测使用移动设备的访客并自动更改 Joomla! 模板。\n\n![](img/0151410972a5c5ea0aab26416e44b1da_265_0.png)\n\
  \n[ 251 ]\n\nMobilebot 1.0 for Joomla! 1.5.x 具有以下功能：\n\n- 1. 它可以分别检测 iPhone、Blackberry、Android\
  \ 和 Opera Mini 浏览器，并为每个浏览器加载特定的模板。\n- 2. 它有两个额外空间，您可以添加自己的自定义移动设备。\n- 3. 您可以使用简单/正则表达式\
  \ PHP 替换调整最终 HTML 代码。这可以针对每个特定设备独立完成。\n- 4. 如果未检测到任何特定设备（或您只有一个适用于所有移动设备的模板），插件也可以执行通用移动检测并在配置\
  \ accordingly 时加载“通用”移动模板。\n\n### 安装\n\nMobilebot 是一个简单的插件扩展，通过扩展管理器安装，配置在插件参数中进行。\n\
  \n要下载此扩展，请访问 http://extensions.joomla.org/ 并搜索 \"Mobilebot\"。\n\n## 测试移动网络\n\n以下是您可以采取的一系列措施来改善\
  \ Joomla! 网站的“移动友好”表现。\n\n## 禁用样式表\n\n如前所述，测试网站兼容性的最简单方法之一是移除层叠样式表的影响。由于您的样式表将包含大量样式元素，从可访问性的角度来看，重要的是您在移除样式后看到“菜单是否仍然出现”或“我是否仍然显示搜索功能”：\n\
  \n\n\n![](img/0151410972a5c5ea0aab26416e44b1da_267_0.png)\n\n上图显示了在用户的网络浏览器中打开了层叠样式表后以及关闭后的\
  \ joomla.org 网站。\n\n许多较旧的移动设备仍会渲染未样式化的原始 HTML 输出。因此，关闭样式表后，你就能了解内容的语义布局以及它在网络浏览器中的显示方式。如果你的模板和\
  \ HTML 内容是按照网络标准构建的，那么菜单链接和其他主要导航功能仍应继续正常工作。\n\n如果你使用 Mozilla Firefox，可以通过进入菜单 |\
  \ 开发 | 禁用样式 来轻松关闭样式表的加载。\n\n## 调整浏览器大小\n\n调整浏览器窗口大小可以让你很好地了解你的网站在支持样式表的移动设备上会是什么样子。这是一种简单但有效的方法，可以在较小的屏幕上查看你的网站：\n\
  \n![](img/0151410972a5c5ea0aab26416e44b1da_267_1.png)\n\n如果你使用 Mozilla Firefox，http://www.firefox.com，并为其安装了“开发者工具栏”插件，https://addons.mozilla.org/firefox/60/，那么调整浏览器大小就轻而易举了。只需前往\
  \ 调整大小 | 调整窗口大小 菜单选项，即可输入自定义值来调整浏览器窗口大小。\n\n以下是移动设备的常见屏幕分辨率：\n\n- 128 x 160\n- 176\
  \ x 220\n- 240 x 160\n- 320 x 240\n- 480 x 320\n\n了解这些屏幕分辨率并在上面进行测试，将有助于你相应地优化网络内容。正如你所见，有许多不同的分辨率，而且这些只是流行的分辨率，因此设计一个在移动网络上可用的网站需要重要的考虑。\n\
  \n## 借用手机进行测试\n\n这并不难，但这是一种经常被忽视的简单方法：\n\n![](img/0151410972a5c5ea0aab26416e44b1da_268_0.png)\n\
  \n与朋友和同事交谈，请他们在自己的移动设备上查看你的网站，并告诉你使用体验。虽然有许多出色的模拟器可用，但没有什么能比得上用实体设备查看，尤其可能运行不同软件版本。\n\
  \n## 针对你的访客，以及他们需要看到的内容\n\n任何网站的目标，无论是移动网络还是非移动网络，都应该是向用户提供最合适的内容。目标可能是销售某物、提供重要信息，或只是提供学习材料，但使用良好的导航并快速引导用户找到这些信息是关键！\n\
  \n当在移动网络上查看内容时，这一目标变得更加重要。这意味着你可能需要简化网站内容的版本以适应移动设备。使用 Joomla! 移动网络扩展或手动加载不同的模板和\
  \ CSS 也可能有助于简化页面布局和显示。归根结底，确保你试图提供的信息简洁明了，用户可以轻松到达其位置。\n\n考虑使用 Google Analytics\
  \ 等工具来监控你的网站统计数据。Google Analytics 工具免费使用，可以设定目标、跟踪用户路径，并密切监控谁在访问哪些页面，以及使用何种设备。有关\
  \ Google Analytics 的更多信息，可访问 www.google.com/analytics/。\n\n## 使用模拟器\n\n桌面和网络浏览器模拟器是查看你的网站在不同设备上显示效果的简便且极佳的方式。与大多数模拟器一样，它们并不总是能完全复制“真实情况”，因此不如手持设备进行测试那样好。话虽如此，如果它们能正常工作，它们就是第二好的选择，因此这里列出了一些流行的网络模拟器，可用于测试移动网络内容：\n\
  \n| 模拟器 | 描述 | URL |\n|---|---|---|\n| Microsoft Pocket PC emulators | 用于构建 Windows\
  \ Mobile 6 应用程序的文档、示例代码、头文件和库文件、模拟器图像以及工具。 | http://msdn.microsoft.com/en-gb/windowsmobile/bb264327.aspx\
  \ |\n| dotMobi web emulator | 带有 Nokia N70 和 Sony Ericsson K750 皮肤的在线模拟器。 | http://emulator.mtid.mobi/emulator.php\
  \ |\n| iPhone Simulator | 基于网络浏览器的模拟器，可快速测试你的 iPhone 网络应用程序。 | http://www.testiphone.com/\
  \ |\n| Opera Mini Simulator | Opera Mini 5 beta 的实时演示，其功能与安装在手机上的情况相同。 | http://www.opera.com/mini/demo/\
  \ |\n| **TagTag emulator** | 在计算机上查看移动网页的模拟器。在 TagTag 模拟器底部输入页面地址并点击 go。像在手机上一样浏览页面。\
  \ | http://tagtag.com/site/info/emulator |\n| **OPENWAVE** | OPENWAVE® 手机模拟器是一款免费的软件开发工具包，可让创建创新移动应用程序变得更加容易。\
  \ | http://developer.openwave.com/dvl/tools_and_sdk/phone_simulator/ |\n\n## 可访问性\n\
  \n你的 Joomla! 模板的可访问性是一个重要的话题，因为你的模板是传递 Joomla! 内容的关键容器，因此会影响网站上每个页面的输出。\n\n### 可访问的内容\n\
  \n为了使你的网站尽可能可访问，你可能需要考虑前几章中提到的一些可访问性主题。始终尝试使用有效的 HTML 代码来嵌入或显示你的内容。如果你定期更新 Joomla!\
  \ 网站，那么考虑学习一些基本的 HTML 代码。关闭你的 WYSIWYG 编辑器，以便手动格式化内容，通常可以让你获得更干净的 HTML，并且可能是你网络职业生涯的开始！\n\
  \n其次，提供替代信息以照顾残障用户非常重要。例如，如果你链接到一份充满文字的文档，请考虑为视力受损的用户提供音频版本。这种“替代选项”方法可以应用于网站上几乎所有主要的内容添加，无论是文本、音频还是视频。\n\
  \n### 可访问的模板代码\n\n关于模板本身，你的 `index.php` 文件包含所有 HTML 标记，并且是 Joomla! 交付的每个页面的核心。它是一个页面，就像任何\
  \ HTML 页面一样，但扩展名为 `.php`，并包含 PHP 代码来交付你的网站内容。非常重要的一点是，该文档必须包含有效的 HTML 代码，因为验证错误会影响\
  \ Joomla! 网站的每个页面。要检查你网站的验证情况，你可以使用在线验证工具，例如 http://validator.w3.org/\n\n## 第 8\
  \ 章\n\n![](img/0151410972a5c5ea0aab26416e44b1da_271_0.png)\n\n在构建或调整你的 Joomla! 模板时，这里有一些需要遵守的关键要点：\n\
  \n- 使用有效的 HTML 代码。\n- 不要使用表格标签 <table> 来构建 HTML。改用现代的 div 标签 <div> 方法。\n- 选择对比鲜明且易于查看的颜色。\n\
  - 为模板优化图形。\n- 使用有效的 CSS 代码。\n- 提供文字大小调整选项（大多数主流浏览器现在都提供此功能，因此请确保在 CSS 文件中使用 em 值来控制字体）。\n\
  - 使用在线验证工具测试你的模板和网站。\n- 在所有流行的网络浏览器中测试你的网站。\n\n## 字体、颜色和对比度\n\n我们都倾向于选择我们认为看起来很棒的字体和配色方案，但正如在时装秀上所证明的那样，一个人的风格观念不一定是另一个人的！你可能使用了默认模板，或使用了为\
  \ Joomla! 设计的第三方预设计模板，并接受了预配置的选项。虽然在完美环境中带有圆角和阴影/高光的光泽图像看起来很棒，但会有用户使用移动设备、许多不同的网络浏览器，甚至可能有残障人士访问你的网站，这些都是需要考虑的重要因素。\n\
  \n[ 257 ]\n\n选择合适的配色方案是使模板更易访问的一种相当简单但有效的方法。尝试使用足够的颜色对比度，以便视力受损的用户不会在查看内容时遇到问题：\n\
  \n![](img/0151410972a5c5ea0aab26416e44b1da_272_0.png)\n\n网络上有许多工具可用于测试颜色对比度，例如 WebAIM，http://www.webaim.org/resources/contrastchecker/。\n\
  \n如果你的最爱颜色是浅绿色文字在深绿色背景上，并且你一定要使用它们，请考虑为网站用户提供调整网站对比度的选项，通过按需加载不同的样式表。这可以使用 CSS 实现，其方法与为用户提供字体大小控制以调整文字大小的方法类似。大多数现代网络浏览器都提供调整字体大小的能力。尝试在网站\
  \ CSS 中使用 em 值，以便用户可以根据需要自行在浏览器中定义字体大小。\n\n## 总结\n\n由于 Joomla! 模板控制着我们网站的布局和样式属性，因此它在网站的可访问性方面发挥着重要作用。\n\
  \n模板可以通过提供 JavaScript 脚本来增强多媒体功能，从而为网站提供额外的多媒体功能。模板通常在其演示和样式中包含许多图像，这会影响我们在 Joomla!\
  \ 网站上发布的扩展。\n\n移动网络是一个快速发展的环境，有许多事情需要检查和测试，以确保你的网站可以在移动网络设备上有效查看。更进一步，可以利用一些 Joomla!\
  \ 扩展来帮助创建你自己的 Joomla! 网站的移动网络版本，使其可供更广泛的受众使用。\n\n\n\n"
- "# 9\n# Joomla! 多媒体项目\n\n在之前的章节中，我们已经介绍了多种媒体类型（以及相应的元素），它们被视为不同形式的媒体。只要把这些元素任意组合在一起，你就创建了多媒体！\n\
  \n在最后一章中，我们采用“食谱式”的方法，从头到尾构建一个多媒体内容丰富的 Joomla! 网站。我们会加入一些之前提到过的技巧，也会添加一些新的诀窍，让内容更加充实！\n\
  \n本章包含：\n\n- 概述\n- 网站结构\n- 多媒体特性\n- 可访问性与验证\n\n## 概述\n\n本章是我们的游乐场！它以食谱式的方法设计，使你能够将各种媒体元素整合到默认的\
  \ Joomla! 安装中。\n\n整个想法就是在我们的 Joomla! 安装中尽情玩耍、尝试各种操作，并在此过程中学习。我坚信，只有当我们真正动手去做（而不仅仅是阅读），去创造或破坏某些东西（并希望能再次修复它），我们才能真正了解它是如何运作的！\n\
  \n*Joomla! 多媒体项目*\n\n如果你读过这本书，但没有使用书中提到的媒体功能，那么至少你现在已经了解了 Joomla! 的多媒体能力，这在规划未来项目时非常重要。如果你确实在网站中使用了其中一些功能，那么你最终将得到一个功能丰富、包含许多前沿\
  \ Web 特性的网站：\n\n![](img/0151410972a5c5ea0aab26416e44b1da_274_0.png)\n\n## 初步建议\n\
  \n在继续之前，有必要指出以下信息：\n\n- * **请勿在正式网站上尝试以下操作：** 最好始终使用一个测试网站，其中包含文件和扩展的副本，以及一个单独的数据库。\n\
  - * **请将以下内容视为演示项目，不要为正式项目构建：** 将功能复制到新网站或在你了解后复制它们是非常容易的。采用轻松的方式构建演示站点，而不是“与时间赛跑”、试图解决真实项目中的问题，你可能会学到更多。\n\
  - **花时间阅读你所使用的扩展及其支持文档**：扩展是由许多经验不同、目的各异的开发人员编写的。尽可能了解你网站中包含的内容。\n- **如果你安装了一个扩展但不使用它，请将其移除**：除了保持你的\
  \ Joomla! 网站井井有条、简洁清爽之外，最好从服务器中移除未使用的代码/文件/文件夹。遗留旧代码可能会造成安全漏洞。\n- **为你的用户构建网站，而不是对抗他们**：在完成网站的开发区域后，请征求朋友和家人对其的意见。有时候我们太容易沉迷于“某样东西看起来如何”，而忘记用户将如何导航到它或有效使用它。一个新鲜的视角只会让项目变得更好。\n\
  - **使用 Joomla! 论坛**：Joomla! 是为社区而生的，也正是社区造就了如今的 Joomla!。论坛中充满了有价值的信息，有时你所遇到问题的答案可能只需快速搜索即可获得。如果没有找到你要找的内容，请将其发布在论坛上，帮助建立知识库。\n\
  - **保持 Joomla! 更新**：Joomla! 发布是有原因的，保持软件更新非常重要。由于框架设计良好，现在几乎没有理由去修改核心代码。与其他一些 Web\
  \ 平台相比，升级通常是一个简单的过程。请记住，在执行任何升级工作之前备份你的网站文件，并尽可能定期备份。有一些很棒的 Joomla! 备份扩展，可以在 http://extensions.joomla.org/extensions/access-a-security/backup\
  \ 找到。\n\n## 开始使用\n\nJoomla! 可以成为你想要的样子。它在设计时考虑了灵活性，我个人曾将它用于从单页网站到每月获得四百万次访问量的英国政府项目。仅\
  \ Joomla.org 网站每月就有近五百万次访问量，这是该平台多样性的一个很好的例子。\n\nJoomla! 很容易；只要有一定的知识，你可以在十分钟内完成安装，并立即拥有一个动态数据库驱动的网站。此时，“又一个\
  \ Joomla! 安装”与“你的定制网站”（恰好是构建在 Joomla! 框架之上）之间的区别，就在于知识、经验、内容和辛勤付出！\n\n## 本地开发\n\n\
  这正是我们接下来要做的：创建一个容易且安全的环境，让我们动手实践，最终得到一个功能完备、充满多媒体特性的 Joomla! 网站。然后，如果需要，你可以轻松地在正式网站上重现这些功能，因为你已经掌握了相关知识。\n\
  \n本地开发是在你的计算机上进行的，而不是在外部远程 Web 服务器上。在忽略本节之前，请记住：本地开发是你的朋友。让我们看看建立一个本地开发环境有多容易。\n\
  \n现在有了各种工具，搭建一个可以模拟你的正式网站的本地开发环境变得非常容易。本地开发常常被看作是只有那些躲在壁橱里、满脸痘痘的程序员才该做的事，但事实上，它是在不影响正式站点环境的情况下进行网站工作的最安全方式。\n\
  \n![](img/0151410972a5c5ea0aab26416e44b1da_276_0.png)\n\n运行本地开发服务器的理由如下：\n\n- 在不上网的情况下，在你的计算机上进行本地开发。\n\
  - 犯错误并将工作放到你的网站上，而不必担心被 Google 搜索和索引。我们不希望在事情做到一半时，Google 出现并将其展示给全世界。\n- 在将相同的功能引入正式环境之前，先测试你的工作。\n\
  - 使用诸如 MAMP、WAMP 之类的 localhost 软件包进行开发，有助于你理解服务器和数据库之间的关系，从而让你更深入地了解你的 Joomla! 网站是如何工作的。\n\
  - 本地服务器开发更快。无需通过 FTP 上传到你的 Web 服务器，也无需等待页面通过缓慢的互联网连接重新加载。\n- 本地开发服务器环境免费设置和使用。\n\
  \n有许多方法可以搭建本地开发环境。在服务器上运行 Joomla! 网站的主要要求如下：\n\n- **Apache 服务器**\n  Apache 是世界上使用最广泛的\
  \ Web 服务器软件。Web 服务器是一个程序，它把你的网站上的文档、图像以及所有其他内容提供给外界。\n- **PHP**\n  PHP 是一种流行的服务器端、内嵌于\
  \ HTML 的脚本语言。PHP 可以收集表单数据、生成动态页面内容并处理 Cookie。它支持广泛的数据库，包括 mSQL、MySQL、MS-SQL、ODBC、Oracle\
  \ 和 PostgreSQL。PHP 还支持广泛的协议，包括 IMAP、SNMP、NNTP 和 POP3。PHP 借鉴了 Perl 和 C 语言的精华，并拥有数百个内置函数来简化大多数常见任务。\n\
  - **MySQL**\n  MySQL 是一个速度非常快、多线程、多用户的 SQL 数据库服务器。它可以利用多个 CPU，支持许多列类型和非常大的数据库。其速度、灵活性和价格（免费）使其成为一个有吸引力的数据库选择。\n\
  \n如果你知道自己在做什么，那么可以分别安装这些组件并配置自己的本地开发环境；但对于那些只想快速上手的人来说，有许多优秀的软件包可以安装这些元素，并创建一个易于使用的本地\
  \ Web 服务器。\n\n\n\n\n\n一些可用的较流行软件包如下：\n\n| 软件包 | URL |\n|---|---|\n| WAMP – Windows\
  \ | http://www.wampserver.com/en/ |\n| MAMP – Apple Mac OS X | http://www.mamp.info/en/mamp.html\
  \ |\n| LAMP – Linux（及其他 Unix） | 取决于发行版 |\n| XAMPP – 多平台 – Windows、Linux、Solaris、Mac\
  \ | http://apachefriends.org |\n\n上述链接将帮助你获得有关在自己环境中安装这些软件包的建议。在本教程中，我将展示在 Mac OS\
  \ X 上安装 MAMP 平台是多么简单。\n\n## 安装 MAMP 软件包\n\nMAMP 代表 Macintosh、Apache、MySQL 和 PHP。MAMP\
  \ 完全免费，只需点击几下，即可按照典型的 Mac 方式进行安装。\n\nMAMP 不会影响你 OS X 中已运行的任何现有 Apache 安装，而且你无需启动脚本或更改任何配置文件，即可安装\
  \ Apache、PHP 和 MySQL。\n\n1. 直接前往 MAMP 官网 http://mamp.info/en/downloads/index.html\
  \ 下载 MAMP .dmg 文件。\n\n![](img/0151410972a5c5ea0aab26416e44b1da_278_0.png)\n\n上图显示的是\
  \ MAMP 官网以及 MAMP DMG 文件下载选项。\n\n2. 像安装其他 Mac OS X 应用程序一样，点击运行此文件。\n3. 将应用程序拖入你的*应用程序*文件夹，大功告成！现在你已在本地安装好\
  \ MAMP 服务器。\n4. 安装完成后，点击*应用程序*目录中的 MAMP 图标，打开 MAMP 启动控制面板：\n\n![](img/0151410972a5c5ea0aab26416e44b1da_279_0.png)\n\
  \nMAMP 控制面板提供以下选项：\n\n- **启动/停止服务器**：只需单击一下，即可轻松启动和停止你的 localhost Apache 服务器。\n\
  - **打开起始页**：打开默认的 MAMP 起始页，其中提供指向 phpInfo、phpMyAdmin、SQLiteManager 的链接。\n- **偏好设置...**：允许配置\
  \ Apache 端口号、PHP 版本及其他设置的一些选项。\n- **退出**：停止所有服务并关闭 MAMP 应用程序。\n\n在 MAMP 控制面板中点击**打开起始页**选项，Web\
  \ 浏览器中会出现以下起始页：\n\n![](img/0151410972a5c5ea0aab26416e44b1da_280_0.png)\n\n此页面上可以找到以下工具的链接：\n\
  \n- **phpMyAdmin**：这是一个数据库管理工具，用于轻松设置和管理 MySQL 数据库。\n- **phpInfo**：提供 PHP 和服务器配置信息的列表。\n\
  \n5. 打开 Web 浏览器并输入 http://localhost:8888。MAMP 在 Mac 上默认使用 8888 端口，因此在 URL 中包含该端口很重要。你可以从\
  \ MAMP 控制面板进入偏好设置区域，调整 MAMP 偏好设置以不使用该端口：\n\n![](img/0151410972a5c5ea0aab26416e44b1da_282_0.png)\n\
  \n如果我们保持默认设置，要访问新的 Joomla! 安装，我们需要在 URL 中输入的地址将是：http://localhost:8888/JMultimedia（假设你将自己的项目也命名为\
  \ JMultimedia）。\n\n如果一切顺利，现在会显示 Joomla! 安装页面。\n\n在开始 Joomla! 安装之前，我们首先需要去创建一个数据库；幸好可以使用\
  \ MAMP 自带的 phpMyAdmin 工具轻松完成。\n\n## 创建本地数据库\n\n打开 MAMP 控制面板，点击“打开起始页”选项，或在 URL 栏中输入\
  \ http://localhost/MAMP/。在这里，我们可以使用 phpMyAdmin 创建一个新数据库，然后运行 Joomla! 安装程序。\n\n在\
  \ MAMP 起始页上，可以找到指向 **phpMyAdmin** 工具的链接：\n\n![](img/0151410972a5c5ea0aab26416e44b1da_283_0.png)\n\
  \n点击它后，浏览器将转到 phpMyAdmin 工具主页。\n\n要为你的 Joomla! 安装创建新的 MySQL 数据库，只需在**创建新数据库**字段中输入一个新的数据库名称，然后点击**创建**按钮：\n\
  \n![](img/0151410972a5c5ea0aab26416e44b1da_283_1.png)\n\n你可以将所有其他设置保留为默认值。数据库创建完成后，你应该会在左侧列中看到该数据库已列出，显示数据库列表。\n\
  \n现在，可以通过 Web 浏览器安装程序继续 Joomla! 安装，并在安装过程中输入数据库的详细信息。你的数据库服务器将是 **localhost**，默认用户名和密码将是\
  \ **root**：\n\n![](img/0151410972a5c5ea0aab26416e44b1da_283_2.png)\n\n## 在本地运行多个网站\n\
  \n在本地创建多个网站很容易。只需下载另一份 Joomla!，或从你已有的下载中重新解压一份，然后为解压后的目录指定一个不同的项目名称，例如 JMultimedia2。将该文件夹移动到本地\
  \ Web 服务器（本例中为 MAMP）的 `htdocs` 区域，然后你的项目就可以通过新 URL http://localhost:8888/JMultimedia2\
  \ 访问；当你导航到主 localhost 目录（例如 http://localhost:8888）时，它们应显示在列表中。\n\n像之前一样为新项目创建一个新数据库，然后就可以安装\
  \ Joomla! 了。只要指定不同的名称，你就可以在空间允许的范围内创建任意数量的本地站点。\n\n对于那些想要安装其他服务器软件包（如适用于 Windows\
  \ 的 WAMP 或 XAMPP）的用户，其过程与 MAMP 非常相似。访问每个产品的支持文档，可以获得进一步的安装帮助。\n\n> 大多数免费的 Web 服务器环境都被配置为可在本地计算机上轻松、开放地运行，以方便开发。它们并未被配置为用作线上\
  \ Web 托管服务器，而且由于配置开放，也不应被用来托管线上网站。\n\n## 远程服务器开发\n\n远程主机是通过互联网访问的主机。它可以是你的服务器，也可以通过\
  \ Web 托管公司租用。Web 托管服务器有许多不同类型，包括独立、虚拟和共享主机；运行这些服务器的操作系统也有多种形式。无论选择哪种选项，检查 Joomla!\
  \ 是否能在该环境中运行非常重要；可以在 Joomla.org 的文档区域找到需求清单。\n\n在远程 Web 服务器上处理你的网站是一种非常常见的做法，许多人都在使用，包括那些刚接触\
  \ Joomla! 和 Web 开发行业的人。远程 Web 开发通常需要 FTP 访问权限，或某种 Web 托管控制面板的文件管理器工具。在正式站点上工作可能很危险，原因很简单：一旦文件被覆盖，如果没有备份副本，就无法轻松找回。互联网连接可能使这个过程非常缓慢，有时\
  \ FTP 连接还可能导致文件损坏。\n\n话虽如此，在远程服务器上工作或许能让开发环境与线上环境高度一致，也可以轻松地向客户展示项目进度。如果你不想在本地进行开发，我建议建立一个远程托管空间来模拟你的线上环境，并通过\
  \ `htaccess` 对其进行密码保护。cPanel 和 Plesk 等服务器端程序都可以轻松地对域上的目录进行密码保护，这样可以保证其私密性，并阻止搜索引擎收录你的开发工作。\n\
  \n如果你使用远程托管环境或 localhost 环境来对网站执行以下添加操作，请养成在进行以下任何操作之前备份数据库和文件的习惯。\n\n## 网站结构\n\n\
  以下内容假设你的 Web 服务器上已有可正常运行的 Joomla! 安装。如果在安装过程中遇到任何问题，请在 Joomla.org 网站、`http://help.joomla.org`\
  \ 和论坛中搜索答案和帮助。通常情况下，安装过程中出现的问题可能是托管环境的问题，而不是 Joomla! 本身的问题。\n\n为了本教程，我们将以全新的 Joomla!\
  \ 安装为基础，该安装不包含默认内容。在处理 Joomla! 网站时，我发现最好在浏览器窗口中打开两个标签页：一个用于 Joomla! 网站的前端，一个用于管理后台。在本教程中，我将使用\
  \ Joomla! 1.5、用于本地开发的 MAMP Web 服务器以及 Firefox Web 浏览器：\n\n![](img/0151410972a5c5ea0aab26416e44b1da_285_0.png)\n\
  \n\n\n\n## 初始配置时需要考虑的事项\n\n在 Joomla! 安装过程中，你有机会输入一些基本站点信息，例如网站名称、电子邮件地址以及站点登录用户名和密码。但通常还有其他一些内容值得在你首次登录新的\
  \ Joomla! 安装环境时进行配置。\n\n## 全局配置设置\n\n你的 Joomla! 站点的全局配置区域包含一些强大的全站设置。在项目开始时查看这些设置是值得的，看看是否需要调整。\n\
  \n## 站点设置\n\n在“站点设置”框中，我们需要进行一项重大更改：\n\n![](img/0151410972a5c5ea0aab26416e44b1da_286_0.png)\n\
  \n将默认富文本编辑器更改为“编辑器 - 无编辑器”。这将给予我们更多的控制权，并限制向站点输入自定义代码时可能出现的问题。\n\n## 元数据设置\n\n如果你知道你的站点将涉及什么内容（希望你知道），那么在这个阶段可以预先填充全局元数据设置：\n\
  \n你需要为以下三个字段都选择**“是”**，如前一张截图所示，然后点击全局配置页面右上角的**“应用”**。为了让 SEO 功能生效，我们需要对 Joomla!\
  \ 中的一个文件进行额外的调整。\n\n为了使 SEO 正确工作，它需要使用一种名为 `mod_rewrite` 的功能，该功能安装在 Web 服务器上。大多数\
  \ Apache 服务器应该已经安装了这个功能，但如果你的服务器没有，那么你需要启用它，或者请你的 Web 服务器支持人员查看此事。你可以通过访问 Joomla!\
  \ 管理菜单中的**“帮助 | 系统信息”**菜单链接来轻松检查 `mod_rewrite` 是否处于活动状态。在此页面上，将有一个标记为“PHP 信息”的链接，在该页面上使用浏览器窗口的搜索栏搜索\
  \ `mod_rewrite`。它应该会在一个标记为“已加载模块”的区域中显示出来。\n\n如果 `mod_rewrite` 处于活动状态，我们就可以继续了，并且需要将一个名为\
  \ `htaccess.txt` 的文件（包含在你的 Joomla! 安装根目录中）重命名为 `.htaccess`。这是 Joomla! 使用对搜索引擎友好的\
  \ URL 所需的一切。\n\n![](img/0151410972a5c5ea0aab26416e44b1da_288_0.png)\n\n> 根据你计算机平台的不同，重命名以点符号开头的文件可能存在限制。你可能需要使用\
  \ FTP 程序，例如免费且功能强大的 FileZilla 客户端 [http://filezilla-project.org/](http://filezilla-project.org/)，来重命名你的\
  \ `htaccess.txt` 文件。\n\n![](img/0151410972a5c5ea0aab26416e44b1da_288_1.png)\n\n\
  好，回到全局配置屏幕。全局配置页面的顶部有三个菜单链接。点击第二个名为“系统”的链接。在系统页面上，有一些与托管服务器相关的选项，以及 Joomla! 如何与该服务器交互。\n\
  \n## 用户设置\n\n此框包含用户注册设置。出于本项目目的，我将关闭用户注册，因为我们现阶段没有站点用户的需求。用户注册可以随时为站点激活：\n\n![](img/0151410972a5c5ea0aab26416e44b1da_289_0.png)\n\
  \n## 媒体设置\n\n我们在前面的章节中已经研究过这些设置，它们对于让媒体管理器有效工作非常重要。在这个阶段，我们可以将这些设置保留为默认值，但根据我们最终在站点上使用的媒体格式，可能需要重新访问这些设置。\n\
  \n## 调试设置\n\n开发人员使用调试功能来查看已加载页面的额外信息。它有助于显示诊断信息和 SQL 错误。你可以随意打开或关闭此功能。如果你知道如何解读这些信息，它在故障排查网站构建时会非常有用。\n\
  \n## 缓存设置\n\n网站缓存通过创建页面的临时副本并将该信息交付给用户，而不是每次都回到数据库检索数据，从而帮助优化和改进你的站点性能：\n\n![](img/0151410972a5c5ea0aab26416e44b1da_289_1.png)\n\
  \n缓存对大型生产网站可能非常有用，但对于开发而言，有时会导致麻烦，因为你进行了更改却看不到效果。让我们暂时关闭缓存。\n\n通常，这些设置可以保留为默认值，但如果你的站点因某种原因没有发送电子邮件，这是首先要检查电子邮件配置的地方。\n\
  \n一旦你对全局配置设置满意，请确保点击全局配置屏幕右上角的“保存”按钮以保存你的更改。\n\n## 内容参数\n\nJoomla! 中的文章管理器包含一个“全局参数”设置，它为你的\
  \ Joomla! 文章设置默认选项。你可以在每篇文章中覆盖这些设置，但首先全局设置这些是良好的做法，这样你就不必回头稍后调整它们了。\n\n文章的全局参数可以在查看文章管理器屏幕时，在页面右上角找到：\n\
  \n![](img/0151410972a5c5ea0aab26416e44b1da_291_0.png)\n\n当你点击“参数”按钮时，具有灯箱弹出效果的新屏幕将显示可用的参数。对于这个教程，让我们将以下参数调整为“隐藏”：\n\
  \n- 作者名称\n- 创建日期和时间\n- 修改日期和时间\n\n你也可以调整其他你认为适合你项目的文章参数。\n\n## 主页\n\n当你安装 Joomla!\
  \ 时，链接到你的主页（或默认菜单项）的主菜单项会将此菜单链接的标题设置为与你的站点名称相同。\n\n有时你可能希望主页项目显示不同的内容，例如“欢迎来到我们的网站”。你可以通过访问该页面的默认菜单项来调整此主页标题，在本例中就是我们的“主页”菜单链接。\n\
  \n要调整你的标题，请转到菜单 | 主菜单，并点击“主页”菜单链接。\n\n在右侧，**参数（系统）**下方，你会看到重命名菜单链接**“页面标题”**的选项。让我们暂时将此重命名为**“欢迎”**，以便你可以看到这如何影响\
  \ Joomla! 主页：\n\n![](img/0151410972a5c5ea0aab26416e44b1da_292_0.png)\n\n当我们现在查看网站的前端并点击**“主页”**菜单链接时，页面标题将从\
  \ **JMultimedia** 更改为**“欢迎”**。\n\n## 栏目和分类\n\n现在还要做一件事，让我们去看看我们的栏目和分类。\n\n栏目和分类是我们内容管理系统管理的基础。它们在\
  \ 1.5 版本中是一个选项（意味着你不必使用它们）。然而，如果你选择使用它们，它们确实允许你做到两件事：\n\n- 1. 如果你的 Joomla! 网站有很多文章，使用栏目和分类可以让你组织内容并相应地显示。你可以在查看文章管理器页面时使用过滤器，这可以帮助你轻松找到文章。对于经常添加新内容的站点，这真的有助于保持站点井井有条。\n\
  - 2. Joomla! 有内置功能可以利用这种文章组织方式。菜单项类型（也称为布局）可以链接到栏目或分类，并根据你在该菜单链接上设置的参数自动显示其中的内容。一个例子是链接到栏目博客、栏目列表、分类博客和分类列表的菜单链接。\n\
  \n许多其他 Joomla! 和第三方模块利用栏目和分类来显示特定主题的新闻项。例如，通过将特定主题的所有文章分组到一个分类中（如最新新闻），你添加到该分类的任何新项目都可以通过模块自动显示在站点页面上。我们将很快对此进行详细研究。\n\
  \n可以从**内容 | 栏目管理器**和**内容 | 分类管理器**菜单链接轻松添加栏目和分类。你还可以通过管理控制面板上的图标访问这些区域：\n\n![](img/0151410972a5c5ea0aab26416e44b1da_293_0.png)\n\
  \n如果你保持站点井井有条，你可能会经常访问这些区域以添加新栏目和分类。首先，我将放置以下内容。要创建新的栏目或分类，只需点击相应管理器屏幕右上角的“新建”图标，给栏目或分类一个标题，然后点击**保存**。\n\
  \n### 栏目\n\n栏目如下：\n\n- 站点\n- 图片\n- 音频\n- 视频\n- 通用\n- 新闻\n\n\n\n\n## 分类\n\n分类需要放置在章节中，因此请在刚刚创建的各个章节下创建以下分类：\n\
  \n- 站点：创建一个名为“General”的分类\n- 站点：创建一个名为“Legal”的分类\n- 图片：创建一个名为“General Image”的分类\n\
  - 音频：创建一个名为“Podcast”的分类\n- 音频：创建一个名为“General Audio”的分类\n- 视频：创建一个名为“General Video”的分类\n\
  - 通用：创建一个名为“Content”的分类\n- 新闻：创建一个名为“Latest”的分类\n\n这应该能为我们提供一个基本的组织结构，我们可以根据后续需要进行进一步定义。\n\
  \n## 为你的网站选择模板/主题\n\nJoomla! 模板用于控制内容传递给浏览设备的方式。对于 Joomla! 网站来说，模板是非常强大的元素，也是决定一个网站与其他网站外观差异的关键因素之一。\n\
  \n字体、颜色、背景、链接，以及我们的扩展在页面中的显示方式，都由 Joomla! 模板控制或影响。因此，我们需要选择一个适合网站用途的模板。我所说的“适合”不仅指配色方案，更是指布局和灵活性，以便轻松地向用户展示所需类型的内容。\n\
  \n模板可以在任何阶段添加到 Joomla! 安装中，添加后可以使用 HTML、CSS 和 PHP、图像以及 JavaScript 技能的组合进行调整。\n\n\
  为了本项目的需要，我将使用 Joomla! 1.5 自带的内置模板之一。为了切换到这个模板，我们需要进入“扩展 | 模板管理”菜单链接：\n\n![](img/0151410972a5c5ea0aab26416e44b1da_294_0.png)\n\
  \n**模板管理**屏幕允许你做两件事：首先，你可以在该区域设置你网站的默认模板；其次，你还可以进入每个模板，调整任何可用的模板参数。\n\n首先，让我们选中左侧名为\
  \ **JA_Purity** 的模板旁边的单选按钮，然后点击页面右上角的“默认”图标。这将使 **JA_Purity** 模板成为网站的默认模板，并会立即显示在你的页面上。\n\
  \n其次，让我们点击 **JA_Purity** 的标题，进入并编辑它的一些参数。进入模板编辑屏幕后，你应该会在右侧看到一个参数列表。请调整以下参数：\n\n\
  - **模板宽度**：自动（流式）\n- **水平导航类型**：吸盘式菜单\n\n你也可以根据需要调整其他任何选项，并点击该屏幕上的**保存**。\n\n在我们正式开始之前还有一件事：快速修改一下这个模板的徽标。\n\
  \nJA_Purity 模板很容易修改，是创建你自己网站主题的绝佳基础。关于这个模板的更多定制教程，可以访问 http://docs.joomla.org/Tutorial:Customising_the_JA_Purity_template，或者参考《Joomla!\
  \ 1.5 模板设计》一书（Tessa Blakeley Silver 著，Packt Publishing 出版），网址为 http://www.packtpub.com/joomla-1-5-template-design-2nd-edition/book。\n\
  \n要将 JA_Purity 的徽标替换为你网站的自定义徽标，你需要进入 JA_Purity 模板文件夹，该文件夹位于你的 Joomla! 文件集中。如果你在本地工作，只需访问以下目录并找到\
  \ logo.png 文件：**htdocs | JMultimedia | Templates | ja_purity | images | logo.png**。\n\
  \n你需要在电脑上的图像编辑程序中编辑该文件。\n\n文件调整完成后，将新徽标（使用相同的 .png 文件扩展名）保存到与原始文件相同的目录中。原始文件将被覆盖，你的新徽标将显示在其位置上。默认徽标尺寸为宽\
  \ 207 像素、高 80 像素。如果你需要调整徽标尺寸以适应新徽标，那么我们也需要修改引用徽标图形的 CSS 文件。\n\n有两种方法可以编辑模板的 CSS：\n\
  \n- 1. **外部编辑**\n  在计算机上使用外部编辑器，导航到以下文件并用适用的编辑程序打开：**htdocs | JMultimedia | Templates\
  \ | ja_purity | css | template.css**。\n  在 `template.css` 文件中，搜索 `h1.logo a` 样式。它应该位于文件中大约第\
  \ 956 行：\n  根据你的新徽标尺寸调整相应的宽度和高度值，然后点击**保存**。\n- 2. **内部编辑**\n  你也可以使用 Joomla! 管理后台内置的\
  \ CSS 编辑器来编辑 `template.css` 文件。步骤如下：\n  - 导航到**扩展 | 模板管理**。\n  - 点击 **JA_Purity**\
  \ 模板以进入模板编辑模式。\n  - 点击屏幕右上角的**编辑 CSS** 图标。\n  - 选中 `template.css` 单选按钮，然后按下屏幕右上角的“编辑”图标。\n\
  \  - 使用浏览器的搜索功能搜索 `h1.logo a`。编辑以下值：\n\n```\nh1.logo a\n{\n    width: 208px;\n \
  \   display: block;\n    background: url(../images/logo.png) no-repeat;\n    height:\
  \ 80px;\n    position: relative;\n    z-index: 100;\n}\n```\n\n```\nh1.logo a\n\
  {\n    width: 208px;\n    display: block;\n    background: url(../images/logo.png)\
  \ no-repeat;\n    height: 80px;\n    position: relative;\n    z-index: 100;\n}\n\
  ```\n\n如果你对网站的徽标进行了调整，那么当你查看网站前端时，新徽标应该会显示出来：\n\n![](img/0151410972a5c5ea0aab26416e44b1da_297_0.png)\n\
  \n在我们继续之前，请在浏览器中刷新此页面几次。你会注意到 JA_Purity 模板有一个不错的功能：它会随机更换右上角的页眉背景图片。因此，虽然我们还没有向网站添加任何多媒体功能，但我们已经在页面上拥有以下媒体元素：\n\
  \n- 多张图片（包括渐变和其他模板样式图片，实际上我的网页中已经加载了令人印象深刻的 19 张图片）\n- 文本（包括字体调整控件）\n- 使用我们 CSS\
  \ 中字体的样式化文本\n- 模板图片\n\n## 多媒体功能\n\n现在，有趣的部分开始了。以下部分将媒体功能分离开来，并将它们归类到“添加视频功能”、“添加图片画廊”等标题下。为了实现一个媒体丰富的可用网站，我们将同时使用\
  \ Joomla! 内置功能和一系列第三方扩展。\n\n## 文本内容\n\n由于没有现成的内容可以放入这个网站项目中，我将加入一些假拉丁文段落，以帮助在整个项目中建立一些文本内容。假拉丁文本对于模拟带有文本内容的网站页面外观非常有用。当客户可能尚未将“文字稿”内容交付给你时，这也是一个可选的解决方案。假拉丁文本生成器可以在以下网站找到：`http://www.4guysfromrolla.com/demos/latin.asp`。\n\
  \n## 模块位置\n\n模块位置的作用是让你能够在模板的不同区域中显示处理后的代码。有一个巧妙的小技巧可以在浏览器 URL 中添加一段代码，用来查看模块位置在\
  \ Joomla! 模板中的位置。只需在主 URL 末尾输入：/index.php?tp=1。因此完整的 URL 应该类似于：http://localhost/JMultimedia/index.php?tp=1：\n\
  \n![](img/0151410972a5c5ea0aab26416e44b1da_298_0.png)\n\n在大多数 Joomla! 模板中，这会显示页面上的可用位置，并帮助你记住它们在模板中的名称和位置。\n\
  \n你也可以通过访问“扩展 | 模板管理”屏幕并点击你想要预览的模板名称来达到同样的效果。在模板编辑屏幕上，预览按钮位于页面右上角。\n\n## 调整菜单\n\n\
  默认情况下，我们的 Joomla! 安装将主菜单模块发布在左侧列中。JA_Purity 模板内置了模块定位和样式设置，可以让你的主菜单显示在徽标区域下方的水平位置。要让你的主菜单显示在该位置，请执行以下操作：\n\
  \n- 1. 在 Joomla! 管理后台中，导航到“扩展 | 模块管理”屏幕。\n- 2. 找到主菜单模块，并点击其标题进行编辑。\n- 3. 在页面的“详细信息”区域，调整以下参数：显示标题\
  \ = 否，位置 = hornav：\n\n![](img/0151410972a5c5ea0aab26416e44b1da_299_0.png)\n\n4.\
  \ 点击此页面上的**保存**，然后查看网站前端。你原来位于左侧列的侧边菜单现在会显示在网站徽标下方的菜单栏中：\n\n![](img/0151410972a5c5ea0aab26416e44b1da_299_1.png)\n\
  \n使用这个水平导航区域有助于最大化显示空间。\n\n\n\n\n\n## 首页功能\n\n有若干种方式可以在 Joomla! 网站的“首页”上显示内容。\n\n\
  ### 首页组件\n\nJoomla! 首页是 `com_content` 组件的默认视图。该组件允许你控制首页的显示方式。`com_content` 组件能够在首页显示多篇文章，帮助你创建杂志式的文章展示效果。首页布局由与主菜单中“首页”链接关联的参数配置。\n\
  \n要自定义其外观和风格，请在后台中导航到“菜单 | 主菜单”，然后点击“首页”链接进行编辑。\n\n在右侧的“菜单参数”下，你可以调整要在首页显示的文章数和列数。让我们按照下图设置数值：\n\
  \n![](img/0151410972a5c5ea0aab26416e44b1da_300_0.png)\n\n更改数值后，点击该屏幕上的“保存”以保存更改，这就是我们目前在此区域需要做的全部操作。如果你刷新网站前端，暂时还不会看到任何变化，但我们已经为稍后添加内容时设置好了显示方式。\n\
  \n让我们向网站添加几篇文章，以便开始构建首页功能。\n\n导航到“文章管理器”，点击屏幕右上角的“新建”图标创建新文章。还记得我们的假拉丁文本生成器吗？现在它派上用场了！去获取一些假文本（如果你愿意，也可以使用真实文本），然后将其粘贴到新文章中。确保为文章设置标题（我使用了“Article\
  \ 1”），并将其放入名为“General”的版块和名为“Content”的分类中。确保文章状态为“已发布”，并且“发布到首页”，然后点击屏幕右上角的“保存”。\n\
  \n![](img/0151410972a5c5ea0aab26416e44b1da_301_0.png)\n\n点击“保存”后，你会返回“文章管理器”界面。我们希望重复此过程，以便至少显示三到四篇文章。因此，请使用“文章管理器”界面上的“复制”功能来克隆文章：\n\
  \n- 1. 在文章管理器中，点击要复制文章旁边的左侧单选按钮。\n- 2. 点击屏幕右上角的“复制”文章图标。\n- 3. 选择要将文章复制到的版块和分类（本例中为“General\
  \ – Content”），然后点击“保存”。\n- 4. 点击新文章的标题进行编辑。进入“编辑文章”界面后，调整文章的标题和别名（Article 2、3、4\
  \ 等），并确保它们设置为已发布状态且可在首页查看。\n\n![](img/0151410972a5c5ea0aab26416e44b1da_301_1.png)\n\
  \n你会注意到文章是随机显示的。你可以按最新文章优先、文章管理器中的物理排序，或按字母顺序来显示它们。这些显示和排序配置都可以在“首页”菜单链接的 **参数（高级）**\
  \ 部分中设置：\n\n![](img/0151410972a5c5ea0aab26416e44b1da_302_0.png)\n\n### 添加模块以显示最新新闻\n\
  \n首页还有其他许多可用功能；让我们添加一个模块扩展，它能很好地显示位于特定分类中的文章。我们将使用的模块名为“ThumbsUp”，可从 Joomla! 扩展页面获取。\n\
  \n在使用此模块之前，我们需要一些内容供其显示。请重复之前创建和复制文章的过程，但这次请确保文章位于标记为“News”的版块和标记为“Latest”的分类中，并且已发布。不过，不要将它们发布到首页。你可以随意在内容项中添加图片，为页面增添色彩和趣味。\n\
  \n> 此模块会从特定版块和分类中拉取新闻。在编辑此模块之前，请分别记下标记为“News”的版块和标记为“Latest”的分类的 ID 编号。这些信息可以在相应区域的管理器中找到。\n\
  \n请按以下步骤操作：\n\n- 1. 访问 `http://extensions.joomla.org` 并搜索“ThumbsUp”。\n- 2. 访问扩展开发者的网站，将扩展下载到你的计算机。（我将使用稳定的\
  \ 1.3 版本。）\n- 3. 在 Joomla! 后台中，使用“扩展 | 安装 / 卸载”功能上传此扩展。\n- 4. 在后台中，导航到“扩展 | 模块管理器”，然后点击“带缩略图的最新文章”模块的标题进行编辑。\n\
  - 5. 调整以下参数：\n\n![](img/0151410972a5c5ea0aab26416e44b1da_303_0.png)\n\n你可以根据需要随意调整任何其他参数。现在查看网站首页，你会看到它很快就开始变得层次丰富起来：\n\
  \n![](img/0151410972a5c5ea0aab26416e44b1da_304_0.png)\n\n### 添加日期和时间\n\n有几种方法可以为你的\
  \ Joomla! 网站添加时间和日期功能。对于新闻、杂志或繁忙的 Web 门户网站的用户来说，这可能是一个有用的功能。某些商业模板可能已经包含此功能，只需激活即可。其他模板（如\
  \ JA_Purity 模板）没有此选项，因此我们将继续添加它。\n\n- **方法 1**：手动将正确的 PHP、JavaScript 和/或 HTML 代码插入到你的模板中。Web\
  \ 上有许多预构建脚本可用于在网站页面上显示时间和日期。\n\n- **方法 2**：使用可用的 Joomla! 扩展，例如“Date and Time”模块。步骤如下：\n\
  \n  - 在 `http://extensions.joomla.org` 的 Joomla! 扩展区域中搜索“Time”。\n  - 在结果页面中，点击标记为\
  \ **日期和时间** 的分类，该模块就会显示出来。\n  - 访问扩展开发者的网站，将扩展下载到你的计算机。\n  - 在 Joomla! 后台中，使用 **扩展\
  \ | 安装 / 卸载** 功能上传此扩展。\n  - 在后台中，导航到 **扩展 | 模块管理器**，然后点击“Date2”模块的标题进行编辑。\n\n请根据需要调整模块参数。我将使用“JavaScript”功能来显示时间（这样秒数会实时显示），并将模块发布到“Left”位置，它将在我们的模板左列中显示。我还将关闭模块标题：\n\
  \n![](img/0151410972a5c5ea0aab26416e44b1da_305_0.png)\n\n值得注意的是，这些时间和日期功能将基于服务器时间运行。因此，如果在本地工作，你将看到本地计算机的时间。\n\
  \n### 添加搜索功能\n\n任何包含任何形式内容的网站都需要搜索功能，以便用户轻松找到内容。JA_Purity 模板的 CSS 中已经内置了搜索框的样式，因此为我们的网站添加新的搜索功能将非常容易。\n\
  \n- 1. 在后台中，导航到 **扩展 | 模块管理器** 界面。\n- 2. 点击屏幕右上角的 **新建** 图标以创建新模块。\n- 3. 从可用选项列表中，选择“搜索”链接并点击该文字，以加载新的搜索模块：\n\
  \n![](img/0151410972a5c5ea0aab26416e44b1da_306_0.png)\n\n- 4. 确保不显示标题，但模块已启用。它需要发布到\
  \ user4 位置，这将使它显示在网页右上角：\n\n![](img/0151410972a5c5ea0aab26416e44b1da_306_1.png)\n\
  \n- 5. 点击该模块的“保存”，如果查看网站前端，你会看到新的搜索框显示在字号控件下方：\n\n![](img/0151410972a5c5ea0aab26416e44b1da_306_2.png)\n\
  \n\n\n\n\n个人而言，我觉得默认的黑色背景有点太暗看不清，所以可以快速修改模板 CSS 文件来调整。我将把搜索背景设为白色，搜索文字设为黑色：\n\n\
  ```\n#ja-search .inputbox\n{\n    width: 120px;\n    border: 1px solid #333333;\n\
  \    padding: 3px 5px;\n    color: #000000;\n    background: #FFFFFF;\n    font-size:\
  \ 92%;\n}\n```\n\n记得保存你的更改，你应该能在网站上看到这些更改的反映。\n\n## 添加图片\n\n正如你在本书的课程中看到的，图片可以轻松添加到\
  \ Joomla! 文章和模块中并按需格式化。然而，Joomla! 还有一些强大的图片扩展，我们现在将在我们的网站中使用它们。\n\n## 添加图片画廊\n\n\
  图片画廊是 Joomla.org 上最受欢迎的扩展之一，因此有许多优秀的选择可用。\n\n希望你已经仔细阅读了第 4 章《添加和管理图片内容》，并为你的项目找到了所需的图片解决方案。对于本教程，我将使用几个扩展在整个网站中显示图片。\n\
  \n## 使用 Phoca Gallery 的图片画廊\n\nPhoca Gallery 是在 Joomla! 中展示精美照片画廊的重量级竞争者。它功能丰富，丰富到足以单独写一本书！\n\
  \n话虽如此，我们将快速将其添加到我们的网站，以便使用此组件、模块、插件创建一个功能丰富的照片画廊。我将介绍基本步骤，不过对于详细支持，开发者的网站和 Joomla!\
  \ 论坛将能够提供丰富的知识：\n\n+   1. 在 http://extensions.joomla.org 上搜索 Joomla! 扩展区域中的 \"Phoca\
  \ Gallery\"。\n2. 访问扩展开发者的网站并下载以下扩展到你的电脑：\n\n+   - **Phoca Gallery 组件**：驱动主要的 Phoca\
  \ Gallery 功能。\n+   - **Phoca Gallery 搜索插件**：允许你的 Joomla! 搜索功能也搜索 Phoca Gallery 图片。\n\
  +   - **Phoca Gallery 幻灯片插件**：显示来自所选 Phoca Gallery 分类中的图片幻灯片 `{pgslideshow id=...|width=...|height=...|delay=...|image=...}`。对于图片，O：原始，L：大，M：中，S：小。示例：`{pgslideshow\
  \ id=1|width=100|height=100|delay=3000|image=M}`。\n+   - **Phoca Gallery 图片模块**：从\
  \ Phoca Gallery 组件中显示随机图片。\n\n![](img/0151410972a5c5ea0aab26416e44b1da_308_0.png)\n\
  \n3. 使用扩展 | 安装 / 卸载 功能将这些扩展上传到 Joomla! 管理后台。（最后处理组件，因为你需要在上传后运行组件的安装程序）。\n\n+  \
  \ 4. 在管理后台，导航到 **扩展 | 插件管理器**，并启用搜索和幻灯片插件。\n+   5. 在管理后台，导航到 **组件 | Phoca Gallery**，在主控制面板页面上，点击图标\
  \ \"分类\"。通过点击页面右上角的 \"新建\" 图标设置一个新分类。让我们给它一个标题 **图片** 并在该页面点击 **保存**（注意你可以随时重新访问这些选项以按需定义它们）。\n\
  +   6. 添加图片可以通过各种方法完成，Phoca 允许你使用基于 Flash 和基于 Java 的上传功能快速上传多张图片。\n\n我将使用多图片功能向我的新\
  \ \"图片\" 分类中添加多张图片。第一步是上传图片，然后在上传后将它们与分类关联。这为将来参考提供了邮件图片资源。\n\n![](img/0151410972a5c5ea0aab26416e44b1da_309_0.png)\n\
  \n一旦你的图片上传完成，选择 \"图片\" 分类（我们将把它们放入其中）并点击屏幕顶部的 **保存** 按钮。根据你上传的图片数量，你可能会看到处理屏幕出现一段时间。页面在处理后应刷新，你将看到新图片加载到\
  \ **图片** 区域：\n\n![](img/0151410972a5c5ea0aab26416e44b1da_310_0.png)\n\n要在你的网站上显示这些图片，我们需要为此画廊创建一个新的菜单链接。\n\
  \n导航到 **菜单 | 主菜单**，并创建一个新的菜单项链接到 **Phoca Gallery | Phoca Gallery 分类布局**。新的菜单项编辑页面将显示，我们需要给我们的菜单链接一个标题\
  \ \"图片画廊\"。\n\n在此屏幕右侧是新的 Phoca Gallery 菜单链接的可用参数。首先，我们需要选择要链接到的分类 — **图片**。以下参数包含大量选项，可以让你操纵画廊的颜色、布局、功能等。你可以在\
  \ Phoca Gallery 中全局设置这些，但菜单项级别的覆盖意味着你创建的每个画廊（或链接到画廊）都可以包含所需的各种选项。现在，让我们点击此菜单项上的\
  \ **保存** 并查看结果。\n\n## 参数（基本）\n\n## 参数（组件）\n\n|  | 分类视图设置（缩略图） |\n|---|---|\n| 字体颜色\
  \ | 选择颜色 [] |\n| 背景颜色 | 选择颜色 [] |\n| 背景颜色（鼠标悬停） | 选择颜色 [] |\n| 图片背景颜色 | 选择颜色 []\
  \ |\n| 图片背景阴影 | 使用全局 |\n| 边框颜色 | 选择颜色 [] |\n| 边框颜色（鼠标悬停） | 选择颜色 [] |\n| 盒子边距 | []\
  \ |\n| 盒子内边距 | [] |\n| 显示名称 | 使用全局 |\n| 显示详情图标 | 使用全局 |\n| 显示下载图标 | 使用全局 |\n| 显示文件夹图标\
  \ | 使用全局 |\n| 名称字体大小 | [] |\n| 名称字符数 | [] |\n| 图片盒子间距 | [] |\n| 在分类视图中显示分类 | 使用全局\
  \ |\n| 在每个页面上显示子分类 | 使用全局 |\n| 显示图片代替文件夹图标 | 使用全局 |\n\n+   1. 在 http://extensions.joomla.org\
  \ 上搜索 Joomla! 扩展区域中的 \"bk thumb\"。\n+   2. 访问扩展开发者的网站并下载扩展到你的电脑。\n+   3. 使用扩展 |\
  \ 安装 / 卸载 功能将此扩展上传到 Joomla! 管理后台。\n+   4. 在管理后台，导航到 扩展 | 插件管理器，并点击 BK-Thumbs 插件的标题进行编辑。\n\
  \nBK-Thumbs 包含许多参数，所有这些都会为你的图片展示带来相当不同的外观和感觉。我建议你根据需要进行调整，但现在让我们确保插件已启用并点击屏幕右上角的保存。\n\
  \n为了让 BK-Thumbs 发挥作用，我们需要一个名为 \"BK-Thumbs\" 的新内容文章，并使其位于标记为 \"图片\" 的分区内以及标记为 \"\
  通用图片\" 的分类内。在你的内容项中，插入一些文字并使用内容文章底部的 \"图片上传\" 按钮上传一张尺寸合适的图片。对于合适的尺寸，目标像素尺寸为 600px\
  \ 到 700px 宽或高，具体取决于图片布局。\n\n为了显示我们的新图片功能，我们需要从主菜单链接到这篇文章。为此，只需在主菜单上创建一个新链接并链接到 文章\
  \ | 文章布局：\n\n![](img/0151410972a5c5ea0aab26416e44b1da_313_0.png)\n\n给你的菜单链接一个标题（BK-Thumb），并在右侧选择你创建的\
  \ \"BK-Thumb\" 文章。这里还有一件事要做，即在左侧列下的父项中；选择你现有的 \"图片画廊\" 菜单链接。这将开始在 \"图片画廊\" 菜单下构建子菜单。记得通过点击屏幕右上角的保存来保存你的新菜单项。\n\
  \n![](img/0151410972a5c5ea0aab26416e44b1da_314_0.png)\n\n当你查看网站的前端（刷新页面）时，你现在应该能在\
  \ \"图片画廊\" 菜单链接下看到子菜单项 \"BK-Thumb\"。这将带你到显示内容文章中较大图片的漂亮新自动缩略图的页面\n\n> 如果你在 管理 |\
  \ 扩展 | 模块管理器 | 主菜单 模块中看不到子菜单项，请确保参数 \"始终显示子项\" 设置为 \"是\"。\n\n![](img/0151410972a5c5ea0aab26416e44b1da_314_1.png)\n\
  \n\n\n\n\nBK-Thumb 可以自动拾取多张图片，添加标题、标题等。它包含了一些很棒的插件功能。我建议你试用一下，看看是否适合你的项目。你可能会注意到\
  \ BK-Thumb 也会影响网站上的其他一些图片，因此这种解决方案适合某些人而不适合其他人。\n\n## 使用 RokBox 进行多媒体显示\n\n我之前提到过，我最喜欢的扩展之一是\
  \ Rocket Theme 的 RokBox；这是因为它能够以多种方式显示多种类型的内容。RokBox 是一个基于 MooTools 的 JavaScript\
  \ 幻灯片，允许你快速轻松地显示多种媒体格式，包括图片、视频（也包括视频分享服务）以及音乐。以下是如何在你的网站上轻松使用它的方法：\n\n- 1. 在 http://extensions.joomla.org\
  \ 的 Joomla! 扩展区域搜索 \"RokBox\"。\n- 2. 访问扩展开发者的网站并将扩展下载到你的电脑。 （你也可以安装内容按钮，但我们确实需要主\
  \ rokbox-system.zip 文件）。\n- 3. 使用扩展 | 安装 / 卸载 功能在 Joomla! 管理后台上传此扩展。\n- 4. 在管理后台导航至\
  \ 扩展 | 插件管理器，并启用 \"RokBox\" 插件：\n\n![](img/0151410972a5c5ea0aab26416e44b1da_315_0.png)\n\
  \nRokBox 插件是通过在内容项和模块中使用特殊标签或链接代码触发的。开发者的网站包含一个有用的文档页面和论坛。你可以在 http://www.rockettheme.com/extensions-joomla/rokbox\
  \ 找到主要的 RokBox 页面。\n\nRokBox 的工作原理非常简单。所有潜在的 RokBox 链接只需要在其内部添加一个额外的元素即可与任何超链接配合使用：<a>。此元素用于将以下代码放入你的链接中：<a\
  \ rel=\"rokbox\" href=\"/...\">example</a>。当 RokBox 找到包含此信息的超链接时，RokBox 会将其纳入考虑。使用这种方法意味着你可以在模块中使用\
  \ RokBox，而不仅仅是在文章中使用。如果你确实想在 Joomla! 文章中使用 RokBox，那么你可以使用另一种方法（以下标签），RokBox 就是为识别这些标签而构建的：\n\
  \n```\n{rokbox...}link to the file{/rokbox}\n```\n\n我们可以在这个基本标签中添加许多其他参数，以开始为你的媒体显示标题和其他信息：\n\
  \n```\n{rokbox size=|100 50| text=|my rokbox| thumb=|images/thumb.jpg| title=|Head\
  \ :: Text| album=|photos| module=|login|}images/image.jpg{/rokbox}\n```\n\n你引用媒体的方式由你决定。更多信息可以在\
  \ RokBox 文档中找到。\n\n现在，让我们通过导航到 扩展 | 模块管理器 屏幕，点击 \"新建\" 图标，然后点击 \"自定义 HTML\" 来创建一个新的自定义\
  \ HTML 模块，以创建一个新的自定义 HTML 模块。\n\n给模块一个名为 \"RokBox\" 的标题，并确保位置设置为 \"Left\"。然后我们需要在该屏幕的\
  \ \"自定义输出\" 区域输入以下内容：\n\n```\n<a href=\"images/stories/image1.jpg\" title=\"Image\
  \ 1 :: Image Description\" rel=\"rokbox[600 400]\">Link to RokBox Image 1</a>\n\
  ```\n\n之前的代码为名为 Link to RokBox Image 1 的文本添加了一个超链接，给它一个标题 Image 1 和描述 Image Description，并在\
  \ 600 x 400 像素的窗口大小中使用 RokBox 打开图像。确保你在 /images/stories 文件夹中有名为正确名称的图片，然后点击屏幕右上角的\
  \ 应用 按钮以应用你的更改。\n\n当你查看网站的前端时，你现在应该有一个指向 RokBox 功能的文本链接：\n\n![](img/0151410972a5c5ea0aab26416e44b1da_316_0.png)\n\
  \nRokBox 可以像我们在这里使用的一样使用，或者你也可以在 RokBox 链接周围插入一张图片，从而有效地创建一个指向 RokBox 内容的缩略图链接。许多选项都是可能的，包括使用\
  \ RokBox 创建带缩略图的图像画廊。\n\n## 添加视频功能\n\n视频是当下的媒体元素！如本书前面所强调的那样，现在有许多很棒的视频功能可用于 Joomla!，因此让我们继续并将一些功能集成到我们的项目中。\n\
  \n## RokBox，再来一次！\n\n由于 RokBox 插件也可以播放视频，让我们在 RokBox 侧边模块中添加内容，以在我们最近创建的 RokBox\
  \ 图像链接下方显示一个 YouTube 视频。以下是步骤：\n\n- 1. 在 扩展 | 模块管理器 中打开 RokBox 模块。\n- 2. 将以下代码添加到自定义输出框中：\n\
  \n```\n<p>\n<a href=\"http://www.youtube.com/watch?v=6RWQ2OQ7_2Y\"\n title=\"Cars\
  \ :: 2010 Aston Martin Vantage V 12\"\n rel=\"rokbox(425 373) (demo)\">Link to RokBox\
  \ YouTube Video</a>\n</p>\n```\n\n代码的分解如下：\n\n- * 链接指向一个 YouTube 主机视频。\n- * 标题是\
  \ Cars。\n- * 描述是 2010 Aston Martin Vantage V 12。\n- * 它将在 425 px x 373 px 大小的 RokBox\
  \ 窗口中打开。\n- * 文本是 Link to RokBox YouTube Video。我在周围放置了段落标签，以便与我们之前创建的图像链接创建间距。\n\
  \n点击页面右上角的 应用 以保存更改。\n\n可以使用 RokBox 在模块和文章中显示视频画廊。我认为你会同意这是一个很棒的多媒体扩展！\n\n## 使用\
  \ hwdVideoShare 进行视频\n\n如果你想要一个像 YouTube 那样的强大的视频方法，hwdVideoShare 视频分享画廊是一个开源（GNU\
  \ GPL）视频分享 Joomla! 扩展，其功能类似于 YouTube 等网站。它具有多种上传工具，可用于大媒体上传。该组件支持众多视频格式。\n\n让我们看看如何为我们的项目设置它：\n\
  \n- 1. 在 http://extensions.joomla.org 的 Joomla! 扩展区域搜索 \"hwdVideoShare\"。\n- 2.\
  \ 访问扩展开发者的网站并将扩展下载到你的电脑。\n- 3. 在上传到 Joomla! 之前先解压下载的文件。压缩包包含 ZIP 文件中的众多扩展。\n- 4.\
  \ 使用 扩展 | 安装 / 卸载 功能将 com_hwdVideoShare.gz 文件上传到 Joomla! 管理后台。在管理后台导航至 组件菜单 | hwdVideoShare。在此页面上，你可以选择安装示例视频数据。同意非商业许可并点击该页面上的\
  \ \"完成设置\" 图标：\n\n![](img/0151410972a5c5ea0aab26416e44b1da_319_0.png)\n\n设置完成后，你将看到一个包含清理选项和对视频组件进行维护的页面。保持所有设置不变并点击屏幕右上角的\
  \ \"运行工具\" 图标。维护应该会运行并刷新屏幕。\n\n现在让我们看看在安装了主组件和一些默认数据后我们有什么。在管理后台导航至 菜单 | 主菜单 并点击屏幕右上角的新建以创建新的菜单项。从可用列表中选择\
  \ hwdVideoShare，然后从子列表中选择 视频主页：\n\n![](img/0151410972a5c5ea0aab26416e44b1da_320_0.png)\n\
  \n给菜单链接一个名为 \"Video Gallery\" 的标题并点击屏幕右上角的 保存。如果现在查看网站的前端，你将看到一个指向 hwdVideoShare\
  \ 组件的新菜单项：\n\n![](img/0151410972a5c5ea0aab26416e44b1da_320_1.png)\n\nhwdVideoShare\
  \ 组件非常庞大，充满了作者演示站点上显示的视频功能。可以创建一个像 YouTube 一样的完整视频托管服务（在你的 Joomla! 站点内），也可以简单地很好地分类视频并锁定前端上传功能。我很想花更多时间填充此组件并添加视频功能，但我认为支持文档解释了此扩展的所有功能。现在，我们需要继续并为我们的项目添加更多多媒体功能。\n\
  \n## 使用 FlowPlayer 在文章中嵌入视频\n\n对于大多数人来说，能够在文章中放置视频可能是一个你经常需要的技术。FlowPlayer 使用基于\
  \ Flash 的视频播放器，通过使用插件标签轻松在文章中播放视频文件：\n\n```\n{flowplayer}URL_Video{/flowplayer}\n\
  ```\n\nFlowPlayer 可作为 Joomla! 插件使用，以便添加到你的文章中，也可作为模块放置在你需要的任何模块位置。要将 FlowPlayer\
  \ 添加到 Joomla!：\n\n- 1. 在 http://extensions.joomla.org 的 Joomla! 扩展区域搜索 \"FlowPlayer\"\
  。\n- 2. 访问扩展开发者的网站并将扩展下载到你的电脑。\n- 3. 使用 扩展 | 安装 / 卸载 功能将视频和插件扩展都上传到 Joomla!。\n-\
  \ 4. 导航至 扩展 | 插件管理器 并发布 内容 – FlowPlayer 插件：\n\n![](img/0151410972a5c5ea0aab26416e44b1da_321_0.png)\n\
  \n> 还有另一个名为 Flow Player 的插件，是为与 hwdVideoShare 组件一起使用而安装的。确保你启用的是 内容 – FlowPlayer\
  \ 插件，即我们刚刚安装的那个。\n\n\n\n\n\n插件还包含额外的参数，因此在启用插件时可能需要查看这些参数：\n\n![](img/0151410972a5c5ea0aab26416e44b1da_322_0.png)\n\
  \n启用插件后，导航到 内容 | 文章管理器 并创建一个新的 Joomla! 文章，命名为“Videos”。选择标记为 Video 的分区和标记为 General\
  \ Video 的分类；这只是为了帮助组织我们的内容和媒体。我们需要在文章中输入一些文本，然后输入以下代码以激活 FlowPlayer 并链接到你的视频文件：\n\
  \n```\n{flowplayer}URL to Video{/flowplayer}\n```\n\n该文件可以位于你的网站文件系统中：\n\n```\n\
  {flowplayer}images/video/dog.mov{/flowplayer}\n```\n\n确保保存你的文章，然后前往创建一个新的菜单链接来显示此文章。我将把它做成\
  \ Video Gallery 链接的子菜单链接，类似于我们为音频链接所做的那样，并将其命名为“Video Page”。\n\n![](img/0151410972a5c5ea0aab26416e44b1da_322_1.png)\n\
  \n> 想做类似的事情但链接到 YouTube 视频呢？\n> 不幸的是由于许可问题，FlowPlayer 无法播放 YouTube 内容，但我们还有其他选择。\n\
  \n## 使用 QTube 扩展显示 YouTube 视频\n\n正如你现在所知，有许多多媒体扩展提供了显示多种媒体类型的灵活性。这些非常有用，因为你只需要一个插件或扩展即可满足众多情况。\n\
  \n一个简单但专业的插件值得提及的是 QTube 插件。如果你认为你的所有视频内容都将来自 YouTube 主机视频，那么就利用这个插件所创建的小巧占用空间吧。它名副其实，就是在你的\
  \ Joomla! 文章中播放 YouTube 视频。\n\n与 FlowPlayer 类似，QTube 提供了一个模块和一个插件，因此你可以从 YouTube\
  \ 播放视频，无论是在模块位置还是在文章中。要安装这些扩展，请按照以下步骤操作：\n\n- 1. 在 `http://extensions.joomla.org`\
  \ 的 Joomla! 扩展区域搜索“QTube”。\n- 2. 访问扩展开发者的网站并将扩展下载到你的计算机。\n- 3. 使用 **扩展 | 安装 / 卸载**\
  \ 功能将两个扩展上传到 Joomla!。\n- 4. 导航到 **扩展 | 插件管理器** 区域并点击 **QTube** 插件标题进行编辑。在这里你可以配置所需的插件参数，并确保插件已启用。点击\
  \ **保存**，我们就准备就绪了！\n\n以下是所需插件语法最简单的形式：\n\n```\n{qtube vid:=xxx}\n```\n\n将 xxx 替换为\
  \ YouTube.com 分配给该视频的唯一标识符。要获取它，只需访问 YouTube 网站并在观看你想要包含的视频时查看浏览器地址栏。你会看到类似这样的 URL：\n\
  \n![](img/0151410972a5c5ea0aab26416e44b1da_324_0.png)\n\nCQzUsTFqtW0 部分是唯一的电影标识符，因此我们的\
  \ QTube 代码将变为：\n\n```\n{qtube vid:= CQzUsTFqtW0}\n```\n\n现在我们需要做的就是将其插入到我们的文章中，所以让我们回到包含\
  \ FlowPlayer 视频的 Video Page 并也插入我们的 QTube 代码。\n\n![](img/0151410972a5c5ea0aab26416e44b1da_324_1.png)\n\
  \n查看 QTube 播放器的文档；你可以调整播放器大小、添加边框和颜色，以及其他功能。\n\n让我们快速使用 QTube 模块发布一个视频。导航到 扩展 |\
  \ 模块管理器 屏幕并点击 QTube 模块。你可以按需配置它。我将其放置在左侧，在我的 RokBox 模块下方，并配置了宽度和高度，以便我的视频适合左侧列。我选择在所有页面上显示它并保存了模块。\n\
  \n当我们现在查看网站前端时，你可以看到新的 QTUBE 模块在左侧列中播放视频：\n\n![](img/0151410972a5c5ea0aab26416e44b1da_325_0.png)\n\
  \n使用 QTUBE 插件和模块进行样式设置和播放视频还有许多其他参数和功能。它确实是一种简单但非常容易的方式将 YouTube 视频嵌入到我们的 Joomla!\
  \ 网站中。\n\n## 添加音频功能\n\nJoomla! 的音频工具不仅是向网站访问者提供音乐和访谈的绝佳方式，还可用于帮助向残障用户提供内容。有一些很棒的音频扩展可用，我们现在将向我们的项目中添加一些。\n\
  \n你需要点击文章上的 **保存** 并为其创建一个新的顶级菜单链接，现在你应该会看到类似以下内容：\n\n![](img/0151410972a5c5ea0aab26416e44b1da_327_0.png)\n\
  \n### 简单 MP3 播放器\n\n简单 MP3 播放器是一个易于配置的 MP3 播放器模块，使用基于 Flash 的音频播放器。它具有各种样式选项，可用作多播放器播放列表以及仅带控制按钮的单播放器。该模块附带语言支持，其中包括英语和德语语言文件。\n\
  \n简单 MP3 播放器是一个多功能播放器，我们可以将其放入任何模块位置，所以让我们添加它：\n\n- 1. 在 `http://extensions.joomla.org`\
  \ 的 Joomla! 扩展区域搜索“Simple MP3 Player”。\n- 2. 访问扩展开发者的网站并使用页面右侧的下载链接。\n- 3. 使用 **扩展\
  \ | 安装 / 卸载** 功能将扩展上传到 Joomla!。\n- 4. 导航到 **扩展 | 模块管理器** 区域并点击 **Simple MP3 Player**\
  \ 模块标题进行编辑。\n\n该模块不仅设计精良，作者还考虑将文档放入模块中，因此你拥有所有模块参数的简易参考指南。主要需要填充的字段如下：\n\n![](img/0151410972a5c5ea0aab26416e44b1da_328_0.png)\n\
  \n你可以将音频目录的详细信息输入到服务器路径中，将 MP3 文件名输入到 MP3 文件中（用竖线 | 符号分隔），然后输入曲目的 MP3 标题（用竖线符号分隔）。该模块允许进行大量其他调整，例如播放器颜色和布局，但现在请确保它已启用并发布在右侧列中。然后点击\
  \ 应用，你将在网站上看到结果：\n\n![](img/0151410972a5c5ea0aab26416e44b1da_328_1.png)\n\n你可能想要重新访问模块来自定义它，支持文档将使这项工作变得轻松。\n\
  \n## RokBox 用于音频\n\n你也可以使用 RokBox 播放音频文件，并使用漂亮的 JavaScript 弹出框让观众的音频播放器在其中播放。\n\n\
  要使用它，请返回管理中的 RokBox 模块并输入以下语法：\n\n```\n<a href=\"PathToAudio\" title=\"Audio Title\
  \ :: Audio Description\" rel=\"rokbox[200 100](audio)\">Link to RokBox Audio File</a>\n\
  ```\n\n我们与图像和视频文件做得完全一样，只是将值调整为音频文件。我将保存此模块并查看我更新的侧边模块：\n\n![](img/0151410972a5c5ea0aab26416e44b1da_329_0.png)\n\
  \n## 添加播客\n\n有许多方法可以为你的 Joomla! 项目添加播客功能，更多细节可在第 5 章 *在你的 Joomla! 网站中使用音频* 中找到。现在，我们将向项目中添加一个非常重要的优秀扩展。Joseph\
  \ LeBlanc 的 Joomla! Podcast Suite 包含一个组件、模块和插件，是提供简易播客功能的绝佳工具包。以下是安装和使用方法：\n\n-\
  \ 1. 在 http://extensions.joomla.org 的 Joomla! 扩展区域搜索“Podcast Suite”。\n- 2. 访问扩展开发者的网站并将组件、模块和插件下载到你的计算机。\
  \ （下载链接在开发者的网站上清晰列出。）\n- 3. 使用 **扩展 | 安装 / 卸载** 功能将扩展上传到 Joomla!。\n- 4. 导航到 **扩展\
  \ | 插件管理器** 区域并启用 **内容 – Podcast** 插件（无需设置插件参数）。\n- 5. 导航到 **组件菜单 | Podcast Suite\
  \ | 管理剪辑。**\n\n你会看到通知告知你需要将一些音频 MP3 内容上传到以下目录：`/components/com_podcast/media/`。\n\
  \n\n\n\n你可以通过**管理片段**屏幕上的**参数**按钮将其更改为你希望的任何路径。将文件（或几个文件）上传到你的仓库后（如果是远程服务器，通常通过FTP），刷新此页面，你将看到你的音频内容：\n\
  \n![](img/0151410972a5c5ea0aab26416e44b1da_330_0.png)\n\nPodcast Suite 的独特之处在于，该组件会生成一篇新的\
  \ Joomla! 文章，并在其中放置一个指向音频文件的标签。然后，它利用 RSS 功能来生成播客订阅源。\n\n要创建第一个播客，请点击其中一个音频轨道的标题。你将看到以下屏幕：\n\
  \n![](img/0151410972a5c5ea0aab26416e44b1da_330_1.png)\n\n你需要填写相关字段的信息，然后点击屏幕右上角的“保存并发布文章”图标。这将实际创建一篇新文章，并预先填入一些先前输入的信息。这现在只是一篇\
  \ Joomla! 文章，所以你可以在任何阶段重新访问它，如果你想输入更多信息。确保你选择了“音频”部分和“播客”类别以帮助文章组织，并确保文章也已发布。然后点击页面顶部的“保存”。\n\
  \n现在我们的第一个播客已经配置完成，我们可以做两件事：\n\n- 从菜单创建指向此内容的菜单链接。\n- 发布播客模块以显示我们的新订阅源。\n\n现在我们将发布我们的播客模块。导航到**扩展\
  \ | 模块管理器**，点击播客模块进行编辑。你可以设置许多参数，但现在让我们启用模块，将其发布在右侧栏，并调整模块顺序，使其显示在右侧栏的顶部。点击“应用”保存更改，然后查看网站的前端。你会看到新的播客模块，如果点击该图标，你将进入一个\
  \ RSS 页面。（地址类似于以下地址：http://localhost/JMultimedia/index.php?option=com_podcast&view=feed&format=raw。）\n\
  \n![](img/0151410972a5c5ea0aab26416e44b1da_331_0.png)\n\n在这里你将能够查看你的播客。你可能想回到你的模块中，调整一些参数来定义你需要的显示效果。这是我经过一些调整后的新模块：\n\
  \n![](img/0151410972a5c5ea0aab26416e44b1da_332_0.png)\n\n当新的播客添加到 Podcast Suite\
  \ 时，它们将自动显示，任何订阅了这些订阅源的用户都将收到有关新播客可用的通知。\n\n我为了向你展示基本流程而快速完成了这一步，但 Joomla! Podcast\
  \ Suite 中还有其他可用功能。在管理后台中，点击**菜单 | 主菜单**。创建一个指向**文章 | 文章布局**的新菜单链接，并选择为你的第一个播客刚刚创建的\
  \ Joomla! 音频文章。创建一个名为“播客 1”的链接，并将其设为主要音频链接的子菜单。保存此新菜单项后，访问网站前端查看结果：\n\n![](img/0151410972a5c5ea0aab26416e44b1da_332_1.png)\n\
  \n你现在将看到 Joomla! 文章包含一个漂亮的 Flash MP3 播放器，其中放置了我们的播客标签。因此，Podcast Suite 不仅允许你发布播客订阅源，还可以在站点文章内播放音频并显示它。\n\
  \n> 如果你想创建指向所有播客的链接，只需创建一个指向**分类博客布局**的菜单链接。每次你向站点添加新的播客文章，并将其定位到正确的部分和类别中时，它将自动对你的站点访客可用。\n\
  \n## 添加社交资料功能\n\n社交网络是大事。它关乎网络和群组、来自不同来源的信息整合，以及交叉宣传的机会。\n\n本节将帮助你在 Joomla! 中添加一些最流行的社交网络功能。\n\
  \n### Easy Twitter Status\n\nEasy Twitter Status 是最简单的（且非商业性的）Twitter 消息扩展之一。它包含以下功能：\n\
  \n- Twitter 用户名\n- 推文显示限制\n- 显示哪个时间线\n- 显示头像\n- 头像大小\n- 启用默认样式或使用自定义样式\n- 显示关注链接\n\
  \n> 要使用此扩展，你需要一个 Twitter 帐户，网址为 <http://www.twitter.com>。\n\n其余部分很简单，让我们现在添加它：\n\
  \n1. 在 <http://extensions.joomla.org> 的 Joomla! 扩展区域搜索“Easy Twitter Status”。\n2.\
  \ 访问扩展开发者的网站，将扩展下载到你的计算机。\n3. 使用**扩展 | 安装 / 卸载**功能将扩展上传到 Joomla!。\n4. 导航到**扩展 |\
  \ 模块管理器**区域，点击**Twitter**模块进行编辑。\n\n你将看到可用的模块首选项。与所有模块一样，你可以将鼠标悬停在参数标题上以获取工具提示描述，这将有助于解释字段。\n\
  \n![](img/0151410972a5c5ea0aab26416e44b1da_334_0.png)\n\n在我的演示中，我还更改了模块标题，将其发布在左列，并且在菜单分配区域中，我们希望此模块仅对**首页**菜单链接可用：\n\
  \n![](img/0151410972a5c5ea0aab26416e44b1da_335_0.png)\n\n既然我们已将模块发布在左侧，这可能会使我们的左列与首页上发布的其他内容相比变得相当长。让我们进入我们的“RokBox”和“QTube”模块，仅将它们分配给与我们的视频示例相关的菜单链接：\n\
  \n![](img/0151410972a5c5ea0aab26416e44b1da_335_1.png)\n\nEasy Twitter 模块现在应该只显示在我们的首页菜单项上，并拉取我们最新的\
  \ Twitter 消息。其样式可以通过 CSS 进行调整，也可能会受到你 `template.css` 文件中当前样式的影响：\n\n![](img/0151410972a5c5ea0aab26416e44b1da_335_2.png)\n\
  \n### Twitter Follow Me\n\nTwitter Follow Me 模块在你的 Joomla! 页面中显示一组简单醒目的图形选择，并链接到你的\
  \ Twitter 帐户。希望关注你的 Twitters 的用户可以通过点击提供的链接轻松访问它们。\n\n按照以下步骤安装此模块：\n\n1. 在 `http://extensions.joomla.org`\
  \ 的 Joomla! 扩展区域搜索“Follow Me”。\n2. 访问扩展开发者的网站，将扩展下载到你的计算机。\n3. 使用**扩展 | 安装 / 卸载**功能将扩展上传到\
  \ Joomla!。\n4. 导航到**扩展 | 模块管理器**区域，点击**Follow Me**模块进行编辑。\n\n该模块包含许多不言自明的参数。我选择了以下内容：\n\
  \n![](img/0151410972a5c5ea0aab26416e44b1da_336_0.png)\n\n为了使此模块在我们当前模板中合适地呈现，我选择将其显示在站点页面的左下角，并调整了模块标题使其不显示。这个\
  \ Twitter Follow Me 模块实际上可以放置在任何可用的模块位置，因为它使用了与通常模块不同的显示方法。这是它在我项目中的外观截图：\n\n![](img/0151410972a5c5ea0aab26416e44b1da_337_0.png)\n\
  \n对于那些希望为他们的 Twitter 帐户提供简单链接的人来说，这是一个五分钟就能完成的醒目解决方案。\n\n还有许多其他扩展可以让你与外部社交网络资源（如\
  \ Facebook、MySpace、Flickr 等）进行通信。我建议尝试一些，看看它们是否能为你的项目提供所需的功能。\n\n## 添加 RSS 功能\n\n\
  由于 RSS 是展示和提供站点信息的完美媒介，因此从我们的站点项目提供一些 RSS 订阅源非常重要。\n\n有许多可用的 RSS 扩展可以用来显示 Joomla!\
  \ RSS 订阅源。\n\n\n\n\n\n点击 **Apply** 保存你的新菜单项并查看网站的前端。现在应该会出现一个新 的 Main Menu 选项，点击后应会带你进入文章的博客布局：\n\
  \n![](img/0151410972a5c5ea0aab26416e44b1da_339_0.png)\n\n如果查看浏览器 URL 地址栏，你现在应该会看到此页面已被识别为\
  \ RSS 订阅源，并在其上显示了图标：\n\n![](img/0151410972a5c5ea0aab26416e44b1da_339_1.png)\n\n\
  点击后，用户将能够订阅两种订阅源类型。相应的 RSS 订阅源会显示出来，使用户能够订阅它们：\n\n![](img/0151410972a5c5ea0aab26416e44b1da_340_0.png)\n\
  \n如果你愿意，可以使用此订阅源 URL，并在你的网站周围创建文本超链接以推广它，为你的网站页面制作漂亮的图标，或使用扩展模块来识别从你的网站创建的订阅源，并在找到时自动显示漂亮的订阅源图标。无论哪种方式，当我们向此部分和分类添加新文章时，我们的新内容将显示在我们的\
  \ RSS 订阅源上，任何订阅者都能够轻松查看你的新网站内容。\n\nRSS 订阅源只能在首页布局、某个栏目或某个分类上生成。它们可以包含视频、音频、图像和其他多媒体内容，并直接提供给你的订阅者，而无需他们访问你的网站来获取。\n\
  \n## 添加地图功能\n\nJoomla! 有许多出色的地图功能，其中大多数都利用了 Google Maps 应用程序，该应用程序已成为网络上最强大的地图工具之一。\n\
  \n## Googlemaps 插件\n\nGooglemaps Plugin for Joomla! 可在你的文章中显示一个或多个 Google 地图。它是将地图功能轻松添加到你的网站的完美方法。\n\
  \n尽管可能不被视为传统的多媒体，地图包含一系列文本、图像和脚本功能，并且为你的网站访客提供增强的交互功能。让我们在项目中添加一个：\n\n- 1. 在 http://extensions.joomla.org\
  \ 上搜索 Joomla! 扩展区域中的 \"Google map\"。\n- 2. 访问扩展开发者的网站并将扩展下载到你的电脑。 （对于 Joomla! 1.5\
  \ 请确保文件名中列出了该版本。）\n- 3. 使用 Extension | Install / Uninstall 功能将扩展上传到 Joomla!。\n-\
  \ 4. 导航到 Extensions | Plugin Manager 区域并点击 Google Maps 插件进行编辑。\n\n有很多插件参数需要配置，你可能需要根据需要反复调整它们：\n\
  \n![](img/0151410972a5c5ea0aab26416e44b1da_341_0.png)\n\n现在，启用插件并点击 **Save**。导航到\
  \ **Content | Article Manager** 并创建一个新文章。\n\n将你的文章命名为 \"Google Map\"，并选择 Section\
  \ \"Site\" 和 Category \"General\"。在你的文章中，我们需要放置插件代码。代码用法如下：Usage: {mosmap parameter='value'|parameter='value'|...}。例如：\n\
  \n```\n{mosmap width='500'|height='400'|lat='-36.843288'|lon='174.770508'}\n```\n\
  \n有许多可用的参数可以添加到此代码中，而 Googlemaps Plugin 非常强大。要使用它们，请确保在参数之间放置管道符号 (|)，并且确保插件代码中没有换行。以下是一些可用参数：\n\
  \n| Parameters | Description |\n|---|---|\n| width | 调整为你想要的任何值，尽管如果太小，你将看不到太多内容。\
  \ |\n| height | 你必须在数字后面加上单位，例如 100% 或 400px。 |\n| lon, lat | 用于坐标或用于搜索坐标的地址（使用你所在国家的标准）。\
  \ |\n| zoom | 可以是 Google Maps API 中指定的任何值。 |\n| zoomType | 可以是 small 或 large。这控制显示的缩放功能类型。它也可以是\
  \ none，这样就没有缩放控件。 |\n| zoomNew | 可以是 1 表示连续缩放和双击缩放，或 0 表示单击居中（默认 0）。 |\n| zoomWheel\
  \ | 可以是 1 表示鼠标滚轮缩放和 0 表示无鼠标滚轮缩放（默认 0）。 |\n| mapType | 可以是 Normal（默认）、Satellite 或\
  \ Hybrid。 |\n| showMaptype | 0 表示无地图类型控件，1 显示地图类型控件（默认 1）。 |\n| Overview | 0 表示右下角无概览窗口，1\
  \ 显示概览，2 表示概览启用但初始关闭（默认 0）。 |\n| text | 用于将在地图上显示的标记的气球/信息窗口中的文本。如果不想看到文本，只需设置 text=\"\
  \ \"，它将不会显示。文本是显示在位置图钉上方的文本。通常它用于显示地址或超链接。超链接使用格式：< a href=linkAddress target=linkTarget\
  \ title=linkTitle>linkName</a>。不要使用（双）引号。 |\n| marker | 用于初始打开信息窗口（1 默认）或关闭信息窗口（0）。\
  \ |\n| dir | 用于在 maps.google.com 上为坐标添加获取路线表单。 |\n\n| Parameters | Description |\n\
  |---|---|\n| `tooltip` | 用于标记在鼠标悬停在标记上时显示工具提示（不要使用 HTML）。 |\n| `address` | 用于搜索坐标的地址。\
  \ |\n| `gotoaddr` | 用于用户可在地图上搜索地址的搜索字段和按钮（默认 0）。 |\n| `kml` | 用于加载为地图叠加层的 kml 文件的\
  \ URL，以显示多个标记或路线。 |\n| `align` | 用于在内容中放置地图（left、right、center 或 none）。 |\n\n在你的文章中添加一些代码并保存它。然后为地图文章创建一个新的菜单项。我只是简单地将其命名为\
  \ \"Maps\" 并使其成为顶级菜单项。你的 Google 地图现在应该显示在你的 Joomla! 文章中。\n\n![](img/0151410972a5c5ea0aab26416e44b1da_343_0.png)\n\
  \n还有许多 Google 地图模块可用，可轻松将 Google 地图放置在模块位置。这些位于 `http://extensions.joomla.org`。\n\
  \n## 创建自定义错误页面\n\n为任何网络项目创建自己的自定义错误页面是一个不错的个性化功能。Joomla! 使用 `/templates/system/error.php`\
  \ 文件来处理多个 HTTP 状态错误，包括 \"403 Forbidden\"、\"404 Not Found\" 和 \"500 Internal Server\"\
  \ 错误。这些不同的状态代码是由服务器为不同原因向客户端提供的信息。\n\n个性化你的错误页面可以帮助用户获得进一步的信息，并且真正表明你已花时间考虑他们，当网站上的某些功能可能无法正常工作时。你的自定义错误页面可以包含多媒体项目，因为它们只是\
  \ HTML 网页。\n\n创建 Joomla! 自定义错误页面有多种方法。我将使用的方法需要你动手编写一些代码，但操作起来相当容易。\n\n### 覆盖系统错误页面\n\
  \n要覆盖系统错误结果，请将 `/templates/system/error.php` 文件复制到你自己的 `/templates/<active template>`\
  \ 目录。在我们的例子中，这将是：`/templates/ja_purity/error.php`。\n\n如果找到，Joomla! 将使用在活动模板中找到的\
  \ `error.php` 文件，代替系统文件。这是一种不错的方法，因为你可以升级 Joomla!，但你的自定义 `error.php` 文件将始终保留在你的模板目录中，在升级期间不应受影响。此\
  \ `error.php` 文件可以按需格式化，通常以匹配你的模板。\n\n### 覆盖系统错误页面样式\n\n如果你想更改此页面的样式，我们还需要复制以下文件：`/templates/system/css/error.css`\
  \ 并将其副本放置到你的 `/templates/<active template>/css/error.css` 文件中。在我们的例子中，这将是：`/templates/ja_purity/css/error.css`\n\
  \n接下来，更新 `/templates/ja_purity/error.php` 文件以引用我们样式表的新位置，将此行更改：`<link rel=\"stylesheet\"\
  \ href=\"<?php echo $this->baseurl; ?>/templates/system/css/error.css\" type=\"\
  text/css\" />`，现在将变为：`<link rel=\"stylesheet\" href=\"<?php echo $this->baseurl;\
  \ ?>/templates/ja_purity/css/error.css\" type=\"text/css\" />`，以便指向我们复制的 CSS 文件。你现在可以根据需要调整\
  \ CSS 文件来设置错误页面结果的样式。\n\n\n\n\n我们现在已经复制了这两个相关文件。Joomla! 会先在我们的模板中查找这些文件，然后才使用系统模板中的默认文件。通过调整我们的\
  \ `error.php` 页面和 `error.css` 文件，我们可以完全自定义错误页面的显示方式。遗憾的是，我们无法深入讨论创建新页面的细节，但通过查看这两个默认文件，你应该能够进行所需的更改，即使是更改页面上的标志或背景颜色。\n\
  \n一个好的 **404 页面未找到** 错误页面应包含以下几点：\n\n-   指向网站站点地图的链接。\n-   指向网站主页的链接。\n-   指向热门页面的相关链接。\n\
  -   搜索功能。（谷歌通过其站长工具提供了一项功能，可以轻松插入一些搜索代码。）\n\n使用图片、文本和样式，以及上面提到的部分功能，但要尽量保持可用和简单。404\
  \ 页面告诉用户，他们要找的页面无法找到。通过提供上述信息，你可以帮助网站访客轻松地访问其他位置。你最不希望看到的是一整页的站点导航、图片和其他内容，分散用户的注意力，使他们无法获取所需的信息。\n\
  \n![](img/0151410972a5c5ea0aab26416e44b1da_345_0.png)\n\n## 更改网站图标\n\n“favicon”是“Favorites\
  \ Icon”的缩写。它是一个 16 x 16 像素的图标，与你的网站关联，显示在 Web 浏览器的地址栏和书签/收藏夹菜单中。在 Firefox 和 Internet\
  \ Explorer 7 / 8 中，它也显示在浏览器选项卡上。\n\nJoomla! 自带其网站图标文件。除非你知道如何更改，否则大多数人只会保留默认图标。但网站图标实际上很容易调整，而且是一个小功能，可以帮助个性化你的项目并赋予其专业感。\n\
  \n![](img/0151410972a5c5ea0aab26416e44b1da_346_0.png)\n\n### 创建图像\n\n在大多数情况下，你可能会希望使用你的组织标志或其部分内容作为网站图标。你需要使用图形编辑器来创建此图像，使其适合\
  \ 16 x 16 像素的正方形。最好将此图像保存为 PNG 或 GIF 文件格式。\n\n### 将图像转换为 ICO 格式\n\n下一步是将你的 PNG 或\
  \ GIF 图像转换为另一种文件格式。有多种方法可以做到这一点，但我发现最简单的工具是位于 `http://tools.dynamicdrive.com/favicon/`\
  \ 的 `.ico` 文件生成器。\n\n![](img/0151410972a5c5ea0aab26416e44b1da_346_1.png)\n\n只需上传你的图像，然后点击**创建图标**。然后将新文件保存到你的计算机上。\n\
  \n## 替换现有的网站图标\n\n网站图标位于你当前使用的 Joomla! 模板目录中。这实际上适用于前端和管理后台显示，因此如果你愿意，可以为两者创建不同的网站图标。由于我们已将\
  \ JA_Purity 模板分配给我们的项目，我们需要在 Joomla! 文件结构中查找，并替换 ja_purity 模板中的 favicon.ico 文件，使用我们的新网站图标文件。确保你的新文件名为\
  \ favicon.ico，否则将无法被识别——/templates/ja_purity/favicon.ico。\n\n![](img/0151410972a5c5ea0aab26416e44b1da_347_0.png)\n\
  \n## 查看新的网站图标\n\n如果你按照上述流程操作，创建了图像和 favicon.ico 文件，并将文件放入当前使用的模板目录中，那么一切应该就绪。如果你无法查看新的网站图标，那么很可能是\
  \ Web 浏览器缓存了原始的网站图标文件。\n\n对于大多数浏览器，最好先离开 Joomla! 页面（比如打开 google.com 或其他网页），清理浏览器缓存，重启浏览器，然后重新打开你的\
  \ Joomla! 项目。这种方法应能确保你的浏览器加载新的 favicon.ico 文件。\n\n![](img/0151410972a5c5ea0aab26416e44b1da_347_1.png)\n\
  \n## 以及其余部分...\n\n正如你在本书全过程中以及不断发展的 Joomla.org 网站上所看到的，有大量扩展功能可用于增强 Joomla! 内容管理系统。这些功能提供了多种附加功能，其中大多数易于安装且对用户友好。与开发人员为你的项目创建这些功能所需的时间相比，它们以极少甚至零成本提供了“开箱即用”的功能。\n\
  \n我们可以继续推进这个网站，添加大量扩展，构建一个功能丰富的多媒体网站。需要提及的一个重要点是，Joomla! 可用的每个扩展都由不同的开发人员编写，他们的技能水平和发布目的各不相同。最佳做法是删除在正式站点上未使用的任何扩展，并尽可能评估扩展的代码，而不是仅仅将它们添加到正式项目中并假设一切完美。\n\
  \n## 可访问性与验证\n\n如果你已在本地开发项目，并准备将其部署到正式服务器，那么在使其上线之前，有一些步骤值得考虑。\n\n## 可访问性\n\n在本书的多个章节中，我们已经多次讨论该主题。这是一个非常重要但经常被忽视的主题。\n\
  \n可访问性有许多级别，该主题也可能被推向极端，有时网站因为人们试图使其尽可能可访问而变得枯燥且难以使用。反之亦然，但要让网站既光鲜又内容丰富，同时兼顾众多用户的能力，通常需要大量时间和考虑。最重要的考虑是，如果我们向访客提供有价值的信息，就要以某种方式提供替代内容。\n\
  \n我们项目中的一个例子可能是谷歌地图页面。由于多种原因，一些用户可能无法查看那幅外观漂亮的谷歌地图。因此，让我们把联系方式列在地图下方，或者提供一段文字说明地图为何出现在页面上。\n\
  \n始终尝试让不同类型的用户浏览你的网站并提供反馈。鉴于如今快节奏的网络特点，如果你的网站访客遇到问题，他们更倾向于关闭你的网页，而不是花时间写通知告诉你。很多时候，网站可能存在相当严重的问题，而开发人员直到有人最终提醒他们时才会意识到。\n\
  \n在多种 Web 浏览器中进行测试是一个非常重要的步骤，在开发项目时，依靠朋友、家人和同事的诚实反馈会很有帮助。我曾看到在 Firefox 中很漂亮的网站，后来却发现它们在\
  \ Internet Explorer 中无法正常工作或效果不佳。最好由你自己的质量控制流程来发现这些问题，而不是由你的客户（或网站访客）指出。\n\n以下是检查最终\
  \ Web 项目时需要考虑的一些通用事项：\n\n-   网站是否具有有效的 HTML？\n-   网站是否具有有效的 CSS？\n-   网站是否有清晰的导航机制？\n\
  -   是否提供听觉和视觉内容的清晰替代方案？\n-   页面加载速度是否表现良好？\n-   网站是否有损坏的链接？\n-   如果用户浏览器中的字体大小增大，布局的某些方面是否会损坏？\n\
  -   是否有足够的颜色对比度？\n-   所有超链接是否具有描述性？\n-   网站是否在 IE 6-8、Mozilla Firefox、Safari、Opera、Chrome\
  \ 中正常工作？\n-   关闭 CSS 后网站是否可访问？\n-   网站是否在手持浏览器中正常工作？\n-   网站是否包含详细的元数据？\n-   网站是否能在各种浏览器尺寸下良好运行？\n\
  -   网站是否有有用的 404 错误页面？\n-   你的 URL 在没有 WWW 时是否有效？\n-   网站是否有网站图标？\n\n## 在线验证工具\n\
  \n帮助提高网站可访问性的一种方法是确保它至少通过基本要求的验证。有许多基于 Web 浏览器和在线验证的工具可帮助进行验证过程。\n\n\n\n\n\n如果我在\
  \ JMultimedia 项目主页上运行本地验证，我会收到该页面 50 个错误和 33 个警告。现在如果我试图在网站上线前使其通过验证，就还有一些工作要做。这些错误都可能导致网站在各种情况下无法使用，因此我必须努力减少主要错误。\n\
  \n![](img/0151410972a5c5ea0aab26416e44b1da_350_0.png)\n\n在对这些验证错误进行快速评估后，似乎有一两个扩展被使用，导致了大部分这些错误。我们现在的选项是：\n\
  \n- 尝试修复导致错误的原因。\n- 卸载扩展并寻找其他解决方案。\n- 忽略这些然后去泡杯茶（我不推荐这一项，虽然喝杯茶也没什么不好）。\n\n解决验证错误的一个很好的开始方式是确保你的模板通过验证。你可以通过创建一个新的\
  \ Joomla! 文章，并在其中放置一个简单的 `<p></p>` 标签来检查这一点，保存它，并为其创建一个菜单链接。在前端访问该页面。接下来，确保该页面上没有加载任何模块，然后使用浏览器验证工具，例如\
  \ Mozilla Firefox 的“Web Developer Toolbar”，或在线验证站点，例如 `http://validator.w3.org`\
  \ 来验证它。\n\n结果将突出模板结构的基础以及其结构方式是否存在任何问题。从这里开始，你可以开始引入页面元素并轻松找到罪魁祸首，或检查验证工具结果以准确找到问题所在。\n\
  \n## 收尾\n\n如果你在本地开发了你的项目，那么下一步将是将其移至远程 Web 服务器。这通常通过 FTP 或 shell 命令执行。Joomla! 帮助网站上有一些关于此过程的优秀文章。\n\
  \n按照 Joomla! 的惯例，甚至还有许多扩展可以帮助此过程，其中值得一提的是 JoomlaPack。JoomlaPack 是一款网站备份实用程序，使你能够复制你的网站和数据库，并在任何兼容的\
  \ Joomla! 服务器上重新安装。\n\nJoomlaPack 不仅允许你将网站从本地开发环境移至远程服务器，而且还为你提供了随时需要的简易网站备份功能。你可以通过在\
  \ http://extensions.joomla.org 搜索 JoomlaPack 来找到 JoomlaPack。\n\n祝你的网络项目好运。\n\n##\
  \ 摘要\n\n本章采用了 cookbook 风格的方法，取了一个正在运行的 Joomla! 副本并增强了框架，使其包含一系列多媒体功能。\n\n我们重点介绍了设置本地开发环境以创建安全且易于使用的开发区域，在此我们可以评估扩展并开发我们的项目。\n\
  \n安装了一系列扩展并在我们的工作副本中配置了 Joomla! 功能，突出了 Joomla! 可以轻松扩展为媒体丰富的网站的方式。\n\n最后，我们通过一些可访问性测试收尾，并强调了将网站移至其最终驻地的过程。\n\
  \n## A\n\n## 扩展类型及如何安装它们\n\n为了充分利用 Joomla! 可以提供的全部功能，你在某个阶段需要向你的 Joomla! 包安装扩展。感谢扩展的设计以及\
  \ Joomla! 中包含的扩展管理器工具，安装 Joomla! 扩展是一项轻松的任务：\n\n![](img/0151410972a5c5ea0aab26416e44b1da_353_0.png)\n\
  \n> 请务必在向你的 Joomla! 网站安装任何第三方扩展之前备份你的文件和数据库。\n\n## 扩展类型\n\n**扩展**一词是通用术语，用于描述用于扩展你的\
  \ Joomla! 网站的五大类“可扩展元素”。这些是：\n\n## 插件\n\n**插件**是功能强大的扩展，可为你的网站添加额外功能。插件可以在不同层面上工作，例如内容、搜索或系统范围级别：\n\
  \n![](img/0151410972a5c5ea0aab26416e44b1da_354_0.png)\n\n插件的一个例子可能是向你的内容文章中添加一个简单的标签，以便轻松嵌入电影而无需复杂的\
  \ HTML 代码，或增强 Joomla! 搜索系统以便同时搜索包含的扩展。\n\n你可以通过 **扩展管理器 | 插件管理器** 菜单链接管理你的插件。\n\n\
  ## 组件\n\n**组件**可以为你的 Joomla! 网站添加全新的功能，它们通常可以被归类为迷你应用程序：\n\n![](img/0151410972a5c5ea0aab26416e44b1da_355_0.png)\n\
  \n组件为你的网站添加了“购物车”和“目录列表”等出色功能，并且一旦安装就可以在组件菜单下找到。组件通常包含各种元素，并包含指向配置和管理屏幕的附加子菜单链接。\n\
  \n## 模块\n\n模块是帮助向最终用户传递页面信息的扩展：\n\n![](img/0151410972a5c5ea0aab26416e44b1da_355_1.png)\n\
  \n它们可以从简单的 HTML 输出到系统提供的复杂信息，并在你的网站页面上显示这些信息。模块通常与组件相关联，因为它们为网页提供信息。模块的一个例子可以是简单的天气预报、投票问题，或由事件组件生成的事件列表。\n\
  \n模块在 扩展 | 模块管理器 区域中管理。\n\n## 模板\n\nJoomla! 模板影响你网页的整体设计和结构：\n\n![](img/0151410972a5c5ea0aab26416e44b1da_356_0.png)\n\
  \n你可以通过使用 Joomla! 模板轻松为你的数据库驱动网站创建完全不同的风格。模板包含模块位置，有助于组织和为已发布的模块提供结构。\n\n模板通常包含许多调整参数，这些参数在\
  \ Joomla! 管理中的模板管理器中作为模板选项提供。\n\n## 语言\n\n语言是 Joomla! 的核心功能，这些包可将整个 Joomla! 界面（包括你的\
  \ Joomla! 网站的前端和管理）翻译出来：\n\n![](img/0151410972a5c5ea0aab26416e44b1da_356_1.png)\n\
  \n语言在 扩展 | 语言管理器 区域中管理。\n\n## 如何安装\n\n安装扩展的最简单方法之一是下载扩展并在你的计算机上保留一份副本。除了保留原始扩展文件的副本外，扩展已编写为可通过扩展管理器轻松安装，所有工作由扩展管理器完成：\n\
  \n![](img/0151410972a5c5ea0aab26416e44b1da_357_0.png)\n\n登录你的 Joomla! 管理并导航到 **扩展管理器**\
  \ 菜单项。\n\n在 **上传安装包文件** 部分，单击 **选择文件** 按钮以在本地计算机上导航以找到你想要上传的扩展。选择后，单击 **上传文件并安装**\
  \ 按钮：\n\n![](img/0151410972a5c5ea0aab26416e44b1da_357_1.png)\n\n你应该在网站上收到 **上传成功**\
  \ 消息。你的扩展可能要求你去配置一些参数，或发布作为扩展包安装的一部分的插件和模块。\n\n## 如何卸载\n\nJoomla! 1.5 的扩展可以通过单击扩展管理器页面上的\
  \ **管理** 菜单项轻松卸载。\n\n在要卸载的扩展旁边的复选框中放置一个勾选标记，然后单击页面右上角的 **卸载** 图标。\n\n![](img/0151410972a5c5ea0aab26416e44b1da_357_2.png)\n\
  \n你的扩展将被卸载，屏幕上会显示一条确认消息。\n"
