  \n## 感谢您购买\n## Joomla! 1.5 多媒体\n\n### 开源项目版税\n\n当我们销售一本关于开源项目的书籍时，我们会直接向该项目支付版税。因此，通过购买《Joomla!\
  \ 1.5 多媒体》，Packt 会将收到的部分款项捐赠给 Joomla! 项目。\n\n从长远来看，我们将自己和您——我们书籍的客户和读者——视为开源生态系统的一部分，为我们所出版的项目提供可持续的收入。我们在\
  \ Packt 的目标是将出版版税确立为服务的重要组成部分，并支持一种能够维持开源发展的商业模式。\n\n如果您正在从事某个开源项目，希望我们为其出版书籍并随后支付版税，请与我们联系。\n\
  \n### 为 Packt 撰稿\n\n我们欢迎所有对写作感兴趣的人士前来咨询。图书提案请发送至 `authors@packtpub.com`。如果您的图书构思还处于早期阶段，希望在撰写正式提案之前先进行讨论，请联系我们；我们的一位策划编辑将与您取得联系。\n\
  \n我们不仅仅寻找已出版过作品的作者；如果您拥有扎实的技术技能但缺乏写作经验，我们经验丰富的编辑可以帮助您发展写作事业，或者仅仅为您的专业知识获得一些额外回报。\n\
  \n### 关于 Packt 出版社\n\nPackt，发音为“packed”，于 2004 年 4 月出版了第一本书《Mastering phpMyAdmin\
  \ for Effective MySQL Management》，此后一直专注于出版针对特定技术和解决方案的高度聚焦型书籍。\n\n我们的书籍和出版物分享了您的\
  \ IT 同行们在适配和定制当今系统、应用程序和框架方面的经验。我们基于解决方案的书籍为您提供定制软件和技术以完成工作所需的知识和能力。Packt 的书籍比您以往见过的\
  \ IT 书籍更为具体，而非泛泛而谈。我们独特的商业模式使我们能够为您提供更集中的信息，让您获得更多所需的内容，减少无关的内容。\n\nPackt 是一家现代而独特的出版公司，专注于为开发者、管理员和新手社区制作高质量的尖端书籍。欲了解更多信息，请访问我们的网站：`www.PacktPub.com`。\n\
