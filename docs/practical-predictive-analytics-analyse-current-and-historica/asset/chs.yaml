  \ |\n\n## 关于并行处理的说明\n\nSpark 将尽可能充分利用并行处理算法。提取训练和测试数据样本就是这种情况的典型示例，因为提取训练数据集可以独立于训练数据执行。\n\
  \n因此，在 Databricks 中，您将能够通过进度条直观地看到它们同时运行。在代码块依赖于另一块代码的情况下，您将看到执行开始，但它将处于等待状态，直到所需的前置块完成。\n\
  \n其启示是，您应始终尝试以利用并行处理的方式开发分析代码，以便充分利用并行处理。\n\n## 将错误引入测试数据集\n\n由于测试数据集和训练数据集均由模拟随机正态分布生成，因此数据几乎过于完美。为了补偿这一点，并使数据更具现实感并帮助您培养更多模拟技能，我们可以向测试数据集中引入一些随机错误。例如，我们可能希望向测试数据变量中添加最多正负\
  \ 10% 的变化。\n\n要实现此目的，我们将首先生成可应用于原始数据的误差分布。为了简单起见，我们可以推导出四个离散误差箱，每个箱表示对数据的不同百分比调整。-10%\
  \ 到 +10% 之间的百分比错误是合理的限制。\n\n我们将使用以下 rnorm 函数生成此分布，然后将任何超出 +/- 10% 的值设置为 0。这将成为我们用于选择错误概率的自定义分布：\n\
  \n```\n#set the random seed\nset.seed(123)\n#set the bins\nx <- rnorm(n=25,mean=0,sd=4)\
  \ /100\n#assign errors conditionally\nx <- ifelse(abs(x) > .10,0,x)\n```\n\n## 生成分布的直方图\n\
  \n\n\n\n\n与其简单地绘制分布，不如绘制分布的直方图，这样我们可以看到近似误差箱的样子。事实上，让我们生成两个不同的直方图，一个包含实际计数，另一个包含百分比：\n\
  \n```\npar(mfrow=c(1,2))\nh <- hist(x,freq=FALSE,right=FALSE,breaks=c(-.20, -.15,-.10,-.05,\n\
  print(h)\n\nplot(h$mids,100*h$counts/sum(h$counts),type=\"h\",lwd=25, lty=1, ma\n\
  ```\n\n在下面的图表中，你可以从左侧的直方图中看到，没有数值超出指定的限制。事实上，由于分布是以均值=0 生成的，许多测试元素将不会添加任何错误。这是设计如此。\n\
  \n右侧的条形图只是为了显示每个条形的相对百分比（而非直接频率）。由此，我们可以看到，例如，调整幅度为 5-10% 的概率约为 12%：\n\n## x 的直方图\n\
  \n![](img/672c0cf8ba3c000a6529b117ed96945e_577_0.png)\n\n## 引入错误的概率\n\n![](img/672c0cf8ba3c000a6529b117ed96945e_577_1.png)\n\
