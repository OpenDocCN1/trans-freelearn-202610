  | 1 | 33.2 |\n| 2 | 26.0 |\n| 3 | 25.3 |\n| 4 | 34.3 |\n| 5 | 32.6 |\n\n现在打印一些正值。\n\
  \n```\nhead(SparkR::filter(out_sd,out_sd$outcome == 1),5)\n```\n\n| | 样本箱 | 结果 |\
  \ 怀孕次数 | 血糖 | 血压 | 肱三头肌皮褶 | 胰岛素 | 质量 | 谱系函数 |\n|---|---|---|---|---|---|---|---|---|---|\n\
  | 1 | 78 | 1 | 1.943 | 157 | 61.5 | 15.7 | 129.6 | 29.4 | 1.223 |\n| 2 | 212 | 1\
  \ | 4.364 | 149 | 71.7 | 41.6 | 240.0 | 25.0 | 0.314 |\n| 3 | 110 | 1 | 0.859 |\
  \ 173 | 74.4 | 30.0 | 379.5 | 32.8 | 0.445 |\n| 4 | 237 | 1 | 1.855 | 107 | 74.4\
  \ | 34.9 | 86.2 | 42.3 | 0.530 |\n| 5 | 253 | 1 | 9.171 | 105 | 78.1 | 33.0 | -67.8\
  \ | 35.6 | 0.386 |\n\n| | 年龄 |\n|---|---|\n| 1 | 25.8 |\n| 2 | 19.4 |\n| 3 | 46.3\
  \ |\n| 4 | 16.7 |\n| 5 | 26.6 |\n\n### 协方差和相关性函数\n\n相关性和协方差也可以直接从 Spark DataFrame\
  \ 计算。在我们的示例中，可以看到非糖尿病患者的年龄与血糖之间存在更大的相关性：\n\n首先是糖尿病结果。相关性为 .113：\n\n```\n> corr(SparkR::filter(out_sd,out_sd$outcome==1),\
  \ \"glucose\", \"age\", method = \"pearson\")\n```\n\n[1] 0.113\n\n现在，非糖尿病结果。相关性为\
  \ .22：\n\n```\n> corr(SparkR::filter(out_sd,out_sd$outcome==0), \"glucose\", \"\
  age\", method = \"pearson\")\n```\n\n[1] 0.22\n\n对于整个总体，相关性为 0.26：\n\n```\n> corr(out_sd,\
  \ \"glucose\", \"age\", method = \"pearson\")\n```\n\n- (1) Spark 作业\n- 作业 295 视图（阶段：1/1）\n\
  \n[1] 0.269\n\n## 创建新列\n\n通常有必要根据现有变量创建一些新的转换，以改进预测。我们已经看到，将变量分箱通常用于从定量变量创建名义变量。\n\
  \n让我们创建一个名为 agecat 的新列，将年龄分为两个部分。为简单起见，我们将首先将年龄四舍五入到最近的整数。\n\n```\nfiltered <- SparkR::filter(out_sd,\
  \ \"age > 0 AND insulin > 0\")\nfiltered$age <- round(filtered$age,0)\nfiltered$agecat\
  \ <- ifelse(filtered$age <= 35,\"<= 35\",\"35 Or Older\")\nSparkR::head(SparkR::select(filtered,\
  \ \"age\",\"agecat\"))\n```\n\n(1) Spark 作业\n\n| | 年龄 | 年龄类别 |\n|---|---|---|\n\
  | 1 | 26 | <= 35 |\n| 2 | 19 | <= 35 |\n| 3 | 46 | 35 岁及以上 |\n| 4 | 17 | <= 35 |\n\
  | 5 | 26 | <= 35 |\n| 6 | 37 | 35 岁及以上 |\n\n在刚才运行的代码中，你可能会注意到某些命令前面加有 SparkR:: 前缀。\n\
  \n这样做是为了让程序知道我们希望应用哪个版本的函数，以这种方式加前缀命令始终是良好的做法，以避免语法错误以及在 SparkR 和普通 R 之间出现同名函数时误用。\n\
  \n### 构建交叉表\n\n既然已经对年龄进行了分类，就可以运行交叉表来按年龄类别统计结果。\n\n由于只有两个结果和两个年龄类别，因此得到一个四单元格交叉表：\n\
  \n- 1. 首先，使用特殊的 Databricks `display` 命令显示结果。\n- 2. 结果显示如下表格后，可以单击绘图按钮（左下角第 2 个图标），此时将出现自定义绘图对话框，允许将结果绘制为柱状图。图表显示，较高年龄组中糖尿病发病率高于较低年龄组，而非糖尿病组则相反：\n\
  \n```\ntable <- crosstab(filtered, \"outcome\", \"agecat\")\ndisplay(as.data.frame(table))\n\
  ```\n\n| 结果_年龄类别 | 35 岁及以上 | <= 35 |\n|---|---|---|\n| 1.0 | 156000 | 109000 |\n\
  | 0.0 | 179000 | 297000 |\n\n### 自定义绘图\n\n- 所有字段：\n  - 结果_年龄类别\n  - 35 岁及以上\n  -\
  \ <= 35\n  - <id>\n\n键：\n结果_年龄类别\n\n系列分组：\n\n值：\n35 岁及以上   <= 35\n\n![](img/672c0cf8ba3c000a6529b117ed96945e_550_0.png)\n\
  \n选项：\n( ) 分组（已选中）\n( ) 堆叠\n( ) 100% 堆叠\n\n聚合：求和\n显示类型：柱状图\n\n[取消] [应用]\n\n## 对比直方图\n\
  \n直方图也是直观检查和比较结果变量的快速方法。\n\n以下是使用 Spark 直方图函数对比研究中糖尿病患者与非糖尿病患者体重指数平均值的另一个示例。对于第一个柱状图，可以看到约\
  \ 38.9 BMI 的峰值柱，而非糖尿病患者的峰值柱为 29.8。这表明 BMI 将是我们开发的任何模型中的重要变量：\n\n此代码使用 SparkR 直方图函数计算带有\
  \ 10 个箱的直方图。质心给出每个 10 个箱的中心值。出现频率最高的柱是中心值为 38.9、计数约为 50,000 的柱。这种直方图有助于快速了解变量分布，但在标签和控制各种元素（如刻度和范围）方面略有欠缺。如果希望微调某些元素，可以先使用\
  \ `collect()` 函数将样本下载到本地 R 机器。我们将在后面讨论此功能。\n\n\n\n\n\n> tmp <- SparkR::filter(out_sd,out_sd$outcome\
  \ ==1)\nmasshist_low <- histogram(tmp , tmp$mass, nbins = 10)\ndisplay(masshist_low)\n\
  \n(4) Spark 作业\n\n![](img/672c0cf8ba3c000a6529b117ed96945e_552_0.png)\n\n> tmp <-\
  \ SparkR::filter(out_sd,out_sd$outcome ==0)\nmasshist_low <- histogram(tmp , tmp$mass,\
  \ nbins = 10)\ndisplay(masshist_low)\n\n(4) Spark 作业\n\n![](img/672c0cf8ba3c000a6529b117ed96945e_552_1.png)\n\
  \n## 使用 ggplot 绘图\n\n如果您偏好使用 ggplot 来绘制结果，请加载 ggplot2 包以直接针对 Spark 数据帧运行绘图。您将有更多机会进行进一步的自定义：\n\
  \n下面是一个与上文所示 histogram() 函数相对应的基本 ggplot：\n\n```r\nrequire(ggplot2)\nplot <- ggplot(age_hist,\
  \ aes(x = centroids, y = counts)) +\ngeom_bar(stat = \"identity\") +\nxlab(\"mass\"\
  ) + ylab(\"Frequency\")\nplot\n```\n\n![](img/672c0cf8ba3c000a6529b117ed96945e_553_0.png)\n\
  \n## Spark SQL\n\n在 Spark 中探索数据的另一种方法是使用 Spark SQL。这样，那些可能不精通特定于语言的 API（例如 SparkR、PySpark（用于\
  \ Python）和 Scala）的分析师也能探索 Spark 数据。\n\n我将介绍通过 SQL 访问 Spark 数据的两种不同方式：\n\n- 通过 R\
  \ 接口发出 SQL 命令：\n\n这样做的优点是将结果作为 R 数据帧返回，从而可以对其进行进一步处理\n\n- 通过 Databricks SQL `magic`\
  \ 指令发出 SQL 查询\n\n这种方法允许分析师发出直接的 SQL 命令，而无需考虑任何特定的语言环境\n\n在将对象作为 SQL 处理之前，需要先将其注册为\
  \ SQL 表或视图。注册后，可以通过任何语言 API 的 SQL 接口访问它。\n\n注册后，可以使用 show tables SparkR 命令获取会话中已注册表的列表。\n\
  \n### 注册表格\n\n```r\n#register out_sd as a table\n\nSparkR::registerTempTable(out_sd,\"\
  out_tbl\")\nSparkR::cacheTable(sqlContext,\"out_tbl\")\n\nhead(SparkR::sql(sqlContext,\
  \ \"SHOW tables\"))\n```\n\n## 通过 R 接口发出 SQL\n\n以这种方式编写 SQL 包括通过 `sql` 函数构建有效的 SQL\
  \ 字符串查询：\n\n- 查询必须引用已注册的表\n\n- 可以将查询结果分配给数据帧：\n\n下面是从已注册对象 out_table 获取可用样本频率计数的示例。请注意，代码以\
  \ %r 命令开头，这是一个特殊的 Databricks 指令，用于指示后续代码适用于 R。但是，在某些情况下（即使在 R 笔记本中）也需要指定此项，特别是当先前的代码块使用了其他语言指令（例如\
  \ %sql 或 %python）时。\n\n```r\n%r\nrm(tmp)\ntmp <- SparkR::sql(sqlContext, \"SELECT\
  \ sample_bin, count(*) FROM out_tbl group by sample_bin\")\n```\n\n- 此外，在 Databricks\
  \ 中，sqlContext 已预先分配，因此可以在代码中省略，如下所示。\n\n```r\ntmp <- SparkR::sql(\"SELECT sample_bin\
  \ , count(*) FROM out_tbl GROUP BY sample_bin\")\n```\n\n- 将数据提取到 tmp 数据帧后，可以显示每个样本的计数。在后续查询中，可以选择与您感兴趣的结果的大小和比例相对应的样本：\n\
  \n```r\nhead(tmp, 1000)\n```\n\n| | sample_bin | count(*) |\n|---|---|---|\n| 1\
  \ | -142 | 4000 |\n| 2 | 184 | 1000 |\n| 3 | 147 | 1000 |\n| 4 | 170 | 1000 |\n\
  | 5 | -305 | 1000 |\n| 6 | -492 | 2000 |\n| 7 | 160 | 2000 |\n| 8 | 169 | 2000 |\n\
  | 9 | 67 | 1000 |\n| 10 | 70 | 1000 |\n| 11 | -335 | 3000 |\n| 12 | -500 | 1000\
  \ |\n| 13 | -282 | 1000 |\n| 14 | 69 | 1000 |\n| 15 | -74 | 4000 |\n| 16 | -81 |\
  \ 2000 |\n| 17 | -58 | 1000 |\n| 18 | -52 | 4000 |\n\n## 使用 SQL 检查潜在异常值\n\n基于先前的\
  \ sample_bin 计数，我们可能决定提取一些负例和正例的样本。已知正 sample_bin 表示结果为 1，负 sample_bin 表示结果为 0。我们还可以选择一个截断值，以适应所需的任何样本大小。我们打算提取\
  \ 10,000 行的样本，因此将边界设置为 +10 和 -10。\n\n```r\nbin_extract <- SparkR::sql(\"SELECT *\
  \ from out_tbl where sample_bin\")\nnrow(bin_extract)\n#nrow should be 10,000 in\
  \ the output\n```\n\n接下来，我们将注册 bin_extract，以便可以执行一些 SQL 操作\n\n```r\nSparkR::registerTempTable(bin_extract,\"\
  bin_extract\")\n```\n\n## 创建一些聚合\n\n如果我们有兴趣将血压数值与平均年龄进行比较，那么可以构建一个查询，在较大的 Spark\
  \ 表（out_tbl）上计算一些均值和标准差，然后按结果对结果进行分组。输出还表明，糖尿病患者年龄更大：\n\n```r\nbin_agg <- SparkR::sql\
  \ (\"SELECT outcome,\nmean (pressure) as mean_pressure,\nstd(pressure) as std_pressure,\n\
  mean(age) as mean_age,\nstd(age) as std_age\nfrom out_tbl group by 1\")\n#register\
  \ the table\nSparkR::registerTempTable(bin_agg,\"bin_agg\")\n#print a few records\n\
  head(bin_agg)\n```\n\n```text\n» (5) Spark Jobs\noutcome mean_pressure std_pressure\
  \ mean_age std_age\n1 0 71.60760 7.454448 32.55031 9.274967\n2 1 71.17571 9.905474\
  \ 39.88985 2.276876\n```\n\n## 使用第三个查询选取一些潜在异常值\n\n现在将构建第三个查询，以提取可能被视为异常值的所有记录。在本示例中，我们将异常值定义为年龄或压力高于或低于其结果类别均值\
  \ 1.5 个标准差的任何记录。这是通过将我们的明细数据与年龄和压力的汇总均值连接来实现的：\n\n- 还可以计算一个新列 agediff，即年龄与平均年龄之间的差值。\n\
  \n- 我们添加 limit=1000 作为保护性过滤器，以便检索的结果数量不会超过指定数量。对 SQL 查询设置限制倾向于加快结果处理速度。在此示例中，返回了一条记录：\n\
  \n```r\nanomalies <- SparkR::sql(\"select distinct\na.outcome,pressure,mean_pressure,age,b.mean_age,\n\
  (age- b.mean_age) as agediff\nfrom bin_extract a inner join bin_agg b\non a.outcome=b.outcome\n\
  AND\n(a.pressure > mean_pressure + (1.5*std_pressure))\nOR\n(a.pressure < mean_pressure\
  \ - (1.5*std_pressure))\nOR\n(a.age < b.mean_age - (1.5*std_age))\nOR\n(a.age >\
  \ mean_age + (1.5*std_age))\norder by agediff desc\nlimit 1000\")\nhead(anomalies)\n\
  ```\n\n输出仅显示一条记录，其年龄比平均年龄高出 1.5 个标准差。您可以自定义截止标准差，以便为异常值检查目的增加或减少返回的行数。\n\n| outcome\
  \ | pressure | mean_pressure | age | mean_age | agediff |\n|---|---|---|---|---|---|\n\
  | 1 | 0 | 75.93101 | 70.87059 | 51.63939 | 31.19 |\n| | | | | | 20.44939 |\n\n##\
  \ 切换到 SQL API\n\n可以通过在第一行编写 %sql 来切换到 SQL 接口。这样，该笔记本单元中所有后续代码语句都将仅被解释为 SQL。\n\n\
  如果希望在后续单元中返回到其他语言，请在单元的第一行输入 %r、%python、%scala 等等。如果未输入这些魔法指令之一，则将按默认笔记本类型（在此例中为\
  \ R）的语法进行解释。\n\n下面是我们之前在 R 中执行的 sample_bin 计数查询的 SQL 接口版本，现在完全使用 SQL 接口。结果显示为透视表。如果需要，可以通过选择原始数据图标（数据下方最左侧的第一个图标），或者选择图表图标（其后的第二个图标）并选择特定图表来操作格式：\n\
  \n```sql\n%sql\nSELECT sample_bin , count(*) as k FROM out_tbl group by sample_bin\n\
  ```\n\n| sample_bin | k |\n|---|---|\n| -305 | 1000 |\n| -361 | 1000 |\n| 64 | 1000\
  \ |\n| 191 | 1000 |\n| 35 | 1000 |\n| 161 | 1000 |\n| -450 | 1000 |\n| -328 | 1000\
  \ |\n| 251 | 1000 |\n\n## SQL - 使用 Case 语句计算新列\n\nSQL 窗口使我们能够利用标准 SQL 的所有优势。其中包括创建新列的功能。在此示例中，我们查询整个表，并按高质量（>30）和低质量（<-30）计算平均质量。\n\
  \n这样，我们可以看到糖尿病患者的上限平均质量高于非糖尿病患者。下限似乎也是如此：\n\n```sql\n%sql\nselect case when mass\
  \ > 30 then \"BMI_HIGH\" else \"BMI_LOW\" end as outcome,avg(mass) from out_tbl\n\
  group by 1,2\n```\n\n| BMICAT | outcome | avg(mass) |\n|---|---|---|\n| BMI_HIGH\
  \ | 1 | 37.88309305496696 |\n| BMI_LOW | 0 | 25.469591340978635 |\n| BMI_LOW | 1\
  \ | 26.599527908424488 |\n| BMI_HIGH | 0 | 35.79285447090313 |\n\n\n\n\n![](img/672c0cf8ba3c000a6529b117ed96945e_560_0.png)\n\
  \n## 基于年龄段评估结果\n\n在 30 岁断点处拆分年龄也显示，较高年龄段的结果比较低年龄段多得多：\n\n```sql\n%sql\nselect CASE\
  \ WHEN age < 30 THEN 'YOUNG' ELSE 'OLD' END AS agecat,\nsum(outcome)\nfrom out_tbl\n\
  group by 1\n```\n\n![](img/672c0cf8ba3c000a6529b117ed96945e_560_1.png)\n\n## 计算所有变量的平均值\n\
  \n仅使用 SQL 即可做出有趣的比较，方法是计算所有变量的变异系数，并按结果分组。变异系数是一种标准化变量均值和方差的方法，因此在进行比较时可以忽略量纲：\n\
  \n```sql\n%sql\nselect outcome,\n   mean(pregnant)/std(pregnant) ,\n   mean(glucose)/std(glucose)\
  \ ,\n   mean(pressure)/std(pressure) ,\n   mean(triceps)/std(triceps) ,\n   mean(insulin)/std(insulin)\
  \ ,\n   mean(mass)/std(mass) ,\n   mean(pedigree)/std(pedigree) ,\n   mean(age)/std(age)\n\
  from out_tbl\ngroup by 1\n```\n\n- 查询完成后，切换到绘图窗口，并将图表类型更改为折线图。\n- 然后将 outcome 拖到\
  \ *键* 窗格中。\n- 然后将所有其他变量拖到 *值* 窗格中。\n\n将出现一个简单的折线图，使您能够比较两种结果之间这些变量的平均值。\n\n我们可以看到，糖尿病患者的变量均值在增加，尽管某些变量的变化幅度比其他变量大：\n\
  \n## 自定义图表\n\n![](img/672c0cf8ba3c000a6529b117ed96945e_562_0.png)\n\n我们还可以演示类似于上一节中异常值查询的查询。这次，我们将查询年龄或压力记录高于均值两个标准差的所有记录：\n\
  \n```sql\n%sql\nselect distinct a.outcome, pressure, mean_pressure, age, mean_age\
  \ from\na.outcome=b.outcome\nAND\n(a.pressure > mean_pressure + (2*std_pressure))\n\
  OR\n(a.age > mean_age + (2*std_age))\nlimit 100\n```\n\n| outcome | pressure | mean_pressure\
  \ | age | mean_age |\n|---|---|---|---|---|\n| 0 | 75.93100817427452 | 71.607060161398534\
  \ | 51.63938860382109 | 32.55030965046543 |\n| 0 | 75.93100817427452 | 71.17571330678416\
  \ | 51.63938860382109 | 39.889849391046326 |\n\n## 将数据从 Spark 导出回 R\n\n您经常会遇到这种情况：希望进行的某些分析在\
  \ SparkR 中不可用，您需要从 Spark 对象中提取部分数据，并将其返回到基础 R 中。\n\n例如，我们之前可以直接在 Spark 数据帧上运行相关性和协方差函数，方法是指定特定的变量对。\n\
  但是，我们未针对整个数据帧生成相关性矩阵，原因有二：\n\n- 执行此操作的功能可能未内置在您当前运行的 Spark 版本中\n- 即使可用，这类计算的计算开销也可能非常大\n\
  \n您可能想采用的一种策略是使用 Spark 函数探索数据的基本特征，和/或使用为 Spark 编写的专用包（例如 MLlib）来执行此操作。\n\n对于其他情况，即您想要进行更深入的分析，只需从\
  \ Spark 数据帧中提取一个样本，并使用常规 R 数据帧执行分析。这样做时，良好做法是不要返回整个总体，而只返回一个样本或子分段。毕竟，如果您从 Spark\
  \ 提取整个数据帧，那么您根本不需要首先使用 Spark，还不如使用本地 R 进行整个分析！\n\n我们可以使用 collect() 函数执行此操作，先按 sample_bin\
  \ 过滤，然后将结果返回到名为 samp 的本地数据帧。如果您对 samp 运行 str() 函数，可以看到输出的第一行指示该对象是常规 R 数据帧，而非 Spark\
  \ 数据帧：\n\n```r\n### bring a sample back to R and visualize\nsamp <- SparkR::collect(SparkR::filter(out_sd,\
  \ \"sample_bin >= -50\"))\nstr(samp)\n```\n\n> (1) Spark 作业\n\n```\n'data.frame':\
  \ 77000 obs. of 10 variables:\n$ sample_bin: num 13 28 12 40 7 39 41 38 13 33 ...\n\
  $ outcome : num 1 1 1 1 1 1 1 1 1 ...\n$ pregnant : num 1.12 7.73 6.61 6.31 5.2\
  \ ...\n$ glucose : num 189 143 146 167 189 ...\n$ pressure : num 61.9 84.1 91.2\
  \ 92.3 84.7 ...\n$ triceps : num 28.2 57 29.4 58.2 41.5 ...\n$ insulin : num 181.682\
  \ 269.068 63.504 0.372 180.244 ...\n$ mass : num 42.5 49.3 34.9 51.1 47.5 ...\n\
  $ pedigree : num 0.251 0.68 0.622 0.822 0.355 ...\n$ age : num 26.2 41.8 31.6 37.8\
  \ 37.5 ...\n```\n\n## 运行本地 R 包\n\n提取样本后，您可以运行常规 R 函数（如 pairs）生成相关性矩阵，或使用 `reshape2`\
  \ 包配合 `ggplot` 生成相关性图。\n\n## 使用 pairs 函数（位于 base 包中）\n\n```r\n### this takes our\
  \ \"collect()\" data frame which we exported from Spark\npairs(samp[,3:8], col=samp$outcome)\n\
  ```\n\n![](img/672c0cf8ba3c000a6529b117ed96945e_565_0.png)\n\n## 生成相关性图\n\n这是一个更高级的可视化示例，使用\
  \ ggplot 说明如何通过阴影表示相交变量之间的相关程度来生成相关性矩阵。同样，重点是强调，如果样本量合理且您运行的 Spark 版本中没有所需的精确功能，则可以在\
  \ Spark 外部执行分析。\n\n```r\nrequire(ggplot2)\nlibrary(reshape2)\ncormatrix <- round(cor(samp),2)\n\
  cormatrix_melt <- melt(cormatrix)\nhead(cormatrix_melt)\nggplot(data = cormatrix_melt,\
  \ aes(x=Var1, y=Var2, fill=value)) +\n```\n\n![](img/672c0cf8ba3c000a6529b117ed96945e_566_0.png)\n\
  \n## 使用 Spark 的一些技巧\n\n请查看以下技巧：\n\n- 尽可能采样。大胆使用 `sample_bin` 方法和 filter 命令。采样将加快分析阶段和开发/测试阶段的分析速度。\n\
  - 在较小分段上完成测试后，可以放心地将其扩展到更大的总体。\n- 预处理数据，以便可以子选择潜在的有趣子分段。\n- 在有意义时缓存分析。\n- 如果性能成为因素，请尝试在数据中使用更多分区数。\n\
  - 对于大规模数值计算，将具有代表性的样本带回本地 R。\n\n## 摘要\n\n本章中，我们学习了探索 Spark 数据的基础知识，使用了一些特定于 Spark\
  \ 的命令，使我们能够过滤、分组和汇总 Spark 数据。\n\n我们还了解了如何直接在 Spark 中可视化数据，以及学习如何在数据上运行 ggplot 等\
  \ R 函数。\n\n我们了解了处理 Spark 数据的一些策略，例如执行智能过滤和采样。\n\n最后，我们演示了，如果我们想使用 Spark 环境中可能不原生提供的常用工具的灵活性，通常需要将部分\
  \ Spark 数据提取回本地 R。\n\n在下一章中，我们将深入探讨可用于大型数据集的各种预测模型。\n"
- "# 第 11 章. Spark 机器学习 - 回归和聚类模型\n\n> “研究思维机器让我们对大脑的了解，超越了内省方法所能教导我们的。西方人正以小玩意的形式外化自己。”\n\
  \n- 威廉·S·伯勒斯（《裸体午餐》）\n\n## 关于本章/您将学到的内容\n\n在前几章中，我们介绍了 Spark 和 SparkR，重点是使用 SQL\
  \ 探索数据。在本章中，我们将开始探讨 Spark 的机器学习功能，使用 MLlib（即随 Spark 一起打包的原生机器学习库）。\n\n本章将介绍逻辑回归和聚类算法。在下一章中，我们将介绍基于规则的算法（包括决策树）。部分材料已在之前的章节中使用\
  \ PC 版 R 进行过讨论。在本章及下一章中，我们将主要关注如何准备数据，并使用 Spark 中存在的 MLlib 算法应用这些技术。\n\n## 读取数据\n\
  \n上一章中，我们将 `out_sd` 保存到了外部 parquet 文件中。\n在现实世界中，您将面临分析多个数据源的情况。\n通常，这些数据源具有类似的架构，但按写入的时间段有所不同。\n\
  \n例如，日志文件可以按日期归档到不同的目录中，作为分析师的您需要读取多个文件并将它们连接在一起。\n\n因此，虽然每个单独的文件可能很小，但汇总后将生成一个大得多的文件。\n\
  \n让我们假设将在过去两天内写入的多个文件上进行一些机器学习操作。为了说明目的，我们将对两个输入使用相同的文件。但是，在实际操作中，您可能正在连接多天的交易：\n\
  \n- 1. 首先，重新读取数据。请回顾，文件保存在了\n\n\nparquet 格式的前一章：\n\n```\ntodays_file <- parquetFile(sqlContext,\n\
  \"/tmp/temp.parquet\")\nyesterdays_file <- parquetFile(sqlContext,\n\"/tmp/temp.parquet\"\
  )\n```\n\n- 2. 使用 Spark unionAll() 函数将两天的数据合并到一个文件中：\n\n```\nout_sd <- unionAll(todays_file,yesterdays_file)\n\
  ```\n\n- 3. 读取文件后，可以缓存 out_sd 文件，以便在会话余下时间中对其进行最优查询：\n\n```\ncache(out_sd)\n```\n\
  \n接下来，使用 SparkR mean() 和 count() 函数验证文件的完整性。例如，根据原始数据，我们知道约 34% 的结果为阳性，因此可以使用这些函数作为计算器来确定文件中包含\
  \ 536,000 个阳性病例。何必这样做？在处理大型数据集时，在开始操作记录之前先验证文件内容通常值得付出努力。通过执行数据准备来节省时间至关重要：\n\n\
  ```\nhead(SparkR::select(out_sd,\ncount(out_sd$outcome), mean(out_sd$outcome), mean(out_sd$outcome)\
  \ * count(out_sd$outcome))\n```\n\n| | count(outcome) | avg(outcome) | (avg(outcome)\
  \ * count(outcome)) |\n|---|---|---|---|\n| 1 | 1536000 | 0.3489583 | 536000 |\n\
