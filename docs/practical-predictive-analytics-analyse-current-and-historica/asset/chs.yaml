  select outcome,grp,errbin, count(*) as k, avg(err\ndisplay(result2)\n```\n\n## 伪R平方\n\
  \n![](img/672c0cf8ba3c000a6529b117ed96945e_595_0.png)\n\n请回顾，真正的R平方度量并非逻辑回归的标准输出统计量，但我们可以使用其他拟优度量，例如McFadden伪R平方。\n\
  \n我们在代码中计算此值，首先获取残差偏差和空偏差。残差偏差衡量包含所有因变量的模型中的偏差。空偏差衡量仅包含截距的残差。对于良好的模型，你希望偏差/空偏差的比率尽可能小。用1减去此值即可得到伪R平方。\n\
  \n所有这些度量均可通过model_summary对象获得：\n\n```\n#mc fadden pseudo Rsquare\n```\n\n```\n1-(model_summary$deviance/model_summary$null.deviance)\n\
  ```\n\n计算结果会自动打印：\n\n## 均方根误差（RMSE）\n\n我们已经从数据中计算了平方误差，因此要计算均方根误差（RMSE），只需调用SQL来获取每个结果的平均平方误差即可。可以看到，预测outcome=1（糖尿病）的变异远大于预测outcome=0：\n\
  \n```\nresult <- sql(\"select outcome, avg(errorsqr) from preds_tbl group\ndisplay(result)\n\
