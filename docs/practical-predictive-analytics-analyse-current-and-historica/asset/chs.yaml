  | 20 | A | F | 74 | 1 | 0 |\n| 26 | P | M | 74 | 4 | 0 |\n| 38 | B | M | 70 | 22\
  \ | 0 |\n| 53 | B | F | 69 | 24 | 0 |\n\n请注意，在前面的示例中，我们从每个集群中只提取了四个观察结果。然而，你不必只提取四个。按需要提取尽可能多的，并尝试为其命名以对集群特征进行分类。\n\
  \n## 支持向量机\n\n我们已经看过一些示例，其中使用直线来分隔类别。\n\n随着模型维度（或特征空间）的增加，可能有多种不同的方式以线性或非线性方式分隔类别。\n\
  \n在支持向量机的情况中，数据首先使用称为内核的映射函数转换到更高维空间，并使用最优超平面对更高维空间进行分段。超平面使用比其试图测量的空间少一维的维度，因此使用直线来分段二维空间，并使用二维纸张来分段三维空间。超平面可以是线性或非线性的。\n\
  \n超平面使用支持向量，这些是重要的训练元组，用于定义每个类别的边界。它们是数据中最关键的点，也是用于支持超平面定义的最重要点。超平面用于定义不同类别之间的边界。类别通常是二进制类别，例如\
  \ 0 或 1。类别之间的边界也可以宽或窄。该特征由边距来衡量，边距定义了类别之间可优化的最大分离度。\n\n以下是一个具有两个特征 x 和 y 的数据集示例。线条\
  \ A 和 B 可以被视为两个独立的线性分类器，用于将红色观察值与蓝色观察值分开的决策规则。A 线更可取，因为它在决策线与最近观察值之间具有更大的边距（分离值）。靠近该线的观察值称为支持向量：\n\
  \n![](img/672c0cf8ba3c000a6529b117ed96945e_269_0.png)\n\n### 映射函数的简单示例\n\n为了说明内核映射函数如何帮助定义线性边界，请查看以下图表，看看创建新变量\
  \ z 如何帮助区分由多项式函数 t2$Latitude^2*t2$High.Low.Temp^2 在二维空间中映射的新转换点。然而，内核映射将在更高维度中进行，映射结果将反向映射回原始空间：\n\
  \n```\n#generate a non-linear circle of point\n\nradius <- 2\nt2 <- data.frame(x=radius\
  \ * cos(seq(0,6,length = 20)),y = radius\nnames(t2) <- c(\"Latitude\",\"High.Low.Temp\"\
  )\nplot(t2$Latitude,t2$High.Low.Temp)\n```\n\n```\n### create a new variable and\
  \ plot it against on the original point\nt2$z = (t2$Latitude^2*t2$High.Low.Temp^2)\n\
  plot(t2$High.Low.Temp,t2$z)\n```\n\n![](img/672c0cf8ba3c000a6529b117ed96945e_270_0.png)\n\
  \n通常，SVM 用于维度非常高的数据。这可能涉及物体和面部识别等应用。SVM 可以非常准确，但其缺点包括可解释性和性能。SVM 也可能过度拟合数据，因为决策边界高度依赖于用于执行映射的内核选择。有大量内核选择可供使用，内核选择不应基于最佳模型拟合。这与使用高阶多项式函数来过度拟合回归模型并无不同。\n\
  \n### 使用 SVM 分析消费者投诉数据\n\n在本示例中，我们将使用文本分类模型来定义线性 SVM 模型。非结构化文本数据是说明 SVM 的完美方式，因为数据维度非常高。\n\
  \n为了说明 SVM 分类器，我们将首先读取一些关于学生贷款的消费者投诉数据。我们将使用两个包，\n\n\n\n### e1071 和 RTextTools：\n\
  \n```r\ninstall.packages(\"e1071\")\ninstall.packages(\"RTextTools\")\nlibrary(e1071)\n\
  library(RTextTools)\n```\n\n首先从 CSV 文件加载数据。该数据框简单地包含一些关于学生贷款的消费者叙述，以及投诉的分类情况。目标是开发一个\
