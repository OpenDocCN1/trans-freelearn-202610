  \n正则化模型是 `spark.glm` 的一种替代方案；你也可以运行 `spark.logit` 并向自变量提供正则化参数。\n\n默认情况下，`spark.logit`\
  \ 将产生与没有正则化参数的 `spark.glm` 相同的结果：\n\n```\nmodel2 <- spark.logit(df, outcome ~ pregnant\
  \ + glucose + pressure\n```\n\n为了验证这一点，同时运行 `spark.logit` 和 `spark.glm` 并验证结果是否相同。\n\
  \n验证这一点后，如果希望通过拉平系数或将某些系数设为 0 来平滑模型，可以添加正则化参数。\n\n下面运行的模型仅将 glucose、insulin 和 pressure\
  \ 作为预测变量。由于 elasticnetparam (.8) 介于 0 和 1 之间（0 使用 L2，1 使用 L1），它将使用 L1 和 L2 正则化的组合。因此，你会看到一些系数收缩到\
  \ 0：\n\n```\n### Fit an binomial logistic regression model with spark.logit\nmodel2\
