  \ select 函数从结果中打印几行以提取几个关键列：\n\n```\nhead(SparkR::select(preds_test,preds_test$outcome,preds_test$prediction)\n\
  ```\n\n![](img/672c0cf8ba3c000a6529b117ed96945e_585_0.png)\n\n## 合并训练数据集和测试数据集\n\
  \n接下来，我们将把训练（grp=1）和测试（grp=0）数据集合并到一个数据框中，并手动计算一些准确性统计数据：\n\n- `preds$error`: 这是结果（0,1）与预测之间的绝对差值。请回顾，对于二元回归模型，预测表示事件（糖尿病）发生的概率。\n\
  - `preds$errorsqr`: 这是计算出的平方误差。这样做是为了去除符号。\n- `preds$correct`: 为了将概率分类为正确或不正确，我们将误差与\
  \ 0.5 阈值进行比较。如果误差较小（<= 0.5），我们将其称为正确，否则将被视为不正确。这是一个有些随意的阈值，用于确定将预测归入哪个类别。\n\n作为最后一步，我们将再次根据\
  \ `grp` 标志将数据分回测试和训练：\n\n```\n#classify 'correct' prediction if error is less than\
  \ or equal to\npreds <- rbind(preds_train,preds_test)\npreds$error = abs(preds$prediction-preds$outcome)\n\
  #square the error to get the absolute squared error\npreds$errorsqr = (preds$prediction-preds$outcome)\
  \ ^ 2\n#assign correct=Yes, or correct=No\npreds$correct = ifelse(preds$error <=\
  \ .5, \"Y\",\"N\")\npreds$errbin = round( (preds$error*10),0)\n#separate the data\
  \ again, including the new columns\npreds_train = filter(preds, preds$grp==1)\n\
  preds_test = filter(preds, preds$grp==0)\n```\n\n接下来，打印一些结果。您可以从输出中看到，第一个观测值被分类为正确，因为模型概率为\
  \ .03 且更接近实际结果（0）。另一方面，第六个观测值被（勉强）分类为预测 outcome=1，但这是错误的，因此 correct 设置为 N：\n\n```\n\
