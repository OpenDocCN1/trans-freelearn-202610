  \ 0.003941543 |\n| 男性 45 至 54 岁 | -10.975387917, 0.005549255 |\n| 男性 55 至 64 岁 |\
  \ -5.370380544, 0.002738269 |\n| 男性 65 岁及以上 | -0.4834523450, 0.0002479691 |\n| 男性\
  \ 所有年龄 | -4.315036958, 0.002232003 |\n| 男性 18 岁以下 | 2.914343264, -0.001401998 |\n\
  | 18 岁以下 | 3.086509947, -0.001487938 |\n\n## 对系数进行排名\n\n现在我们有了系数，可以开始按递增趋势对每个类别进行排名。由于迄今获得的结果包含在嵌入列表中，有点难以处理，我们可以进行一些代码操作，将其转换为常规数据框，每个类别一行，包含类别名称、系数和系数排名：\n\
  \n```r\nlibrary(dplyr)\n### extract the coefficients part from the model list, and\
  \ then transform\n### data frame so that the coefficient appear one per row, rather\
  \ than\n### column.\n\nxx <- as.data.frame(fitted_models$model)\nxx2 <- as.data.frame(t(xx[2,\
  \ ]))\n\n### The output does not contain the category name, so we will merge\n###\
  \ from the original data frame.\n\nxx4 <- cbind(xx2, as.data.frame(fitted_models))[,\
  \ c(1, 2)] #only\n\n### rank the coefficients from lowest to highest. Force the\
  \ format\n### as length 2, with leading zero's\n\ntmp <- sprintf(\"%02d\", rank(xx4[,\
  \ 1]))\n\n### Finally prepend the rank to the actual category\nxx4$rankcat <- as.factor(paste(tmp,\
  \ \"-\", as.character(xx4$cat)))\n\n### name the columns\nnames(xx4) <- c(\"lm.coef\"\
  , \"cat\", \"coef.rank\")\n### and View the results\nView(xx4)\n```\n\n如您所见，第 2、3、4\
  \ 列现在包含了整齐排列的 `coefficients`、`category` 和 `coef.rank` 的表示，这些是通过将 `lm.coef` 从小到大排名，然后将排名顺序添加到类别名前面得出的：\n\
