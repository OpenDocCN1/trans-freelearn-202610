  \ |\n\n## 运行 k-means 模型\n\n现在数据已标准化，我们可以进行模型构建。\n\nSparkR 包含一个 k-means 模型，其语法与基本\
  \ k-means 模型非常相似。还有一个额外参数 `InitMode`，您可以在其中指定为生成起始集群而生成随机种子。就此版本的 SparkR 而言，您无法手动设置种子。因此，请注意，每次运行模型时生成的集群可能会略有不同。\n\
  \n此外，您可以指定结果变量（glucose）以及要集群的变量，以便您可以评估集群模型的拟合度。\n\n为了说明，我们将生成一个包含五个集群的模型。\n\n使用\
  \ `summary(model)` 显示生成预测所需的系数以及每个集群的大小，如下所示。\n\n```\nmodel <- spark.kmeans(df_normal,\
  \ glucose ~ age + mass + triceps +\nk = 5, initMode = \"random\")\nsummary(model)\n\
