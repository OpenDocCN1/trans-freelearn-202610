  \ | 0.0048501876 | 女性 35 至 44 岁 | 17 - 女性 35 至 44 岁 |\n| structure.c..10.3633655124299..0.00523536960...\
  \ | 0.0052353696 | 女性 45 至 54 岁 | 20 - 女性 45 至 54 岁 |\n| structure.c..4.10277495735534..0.00210834349...\
  \ | 0.0021083435 | 女性 55 至 64 岁 | 11 - 女性 55 至 64 岁 |\n| structure.c..1.36745107793605..0.00068877425...\
  \ | 0.0006887743 | 女性 65 岁及以上 | 08 - 女性 65 岁及以上 |\n| structure.c..3.81748382391257..0.00197005880...\
  \ | 0.0019700588 | 女性所有年龄段 | 10 - 女性所有年龄段 |\n| structure.c..3.26759338613744..0.00157832779...\
  \ | -0.0015783278 | 女性 18 岁以下 | 02 - 女性 18 岁以下 |\n| structure.c..4.03612772673809..0.00186299125...\
  \ | -0.0018629913 | 男性 18 至 24 岁 | 01 - 男性 18 至 24 岁 |\n| structure.c..9.71595028579057..0.00498362081...\
  \ | 0.0049836208 | 男性 25 至 34 岁 | 18 - 男性 25 至 34 岁 |\n| structure.c..7.70662482144783..0.00394154306...\
  \ | 0.0039415431 | 男性 35 至 44 岁 | 16 - 男性 35 至 44 岁 |\n| structure.c..10.9753879171274..0.00554925524...\
  \ | 0.0055492552 | 男性 45 至 54 岁 | 22 - 男性 45 至 54 岁 |\n| structure.c..5.37038054369785..0.00273826914...\
  \ | 0.0027382691 | 男性 55 至 64 岁 | 15 - 男性 55 至 64 岁 |\n\n## 将分数合并回原始数据框\n\n我们将通过按类别合并，然后按系数排名对数据框进行排序，将此新信息合并回原始\
  \ x2 数据框。这样我们就可以将其用作趋势的代理：\n\n```\nx2x <- x2 %>% left_join(xx4, by = \"cat\") %>%\
  \ arrange(coef.rank, c\n```\n\n```\n### exclude some columns so as to fit on one\
  \ page\nhead(x2x[, c(-2, -3, -4, -8)])\n> Source: local data frame [6 x 7]\n>\n\
  > cat Year.1 Total.People Total Not.Covered.\n> (fctr) (int) (dbl) (dbl) (d\n> 1\
  \ MALE 18 to 24 YEARS 2012 15142.04 11091.86 0.2674\n> 2 MALE 18 to 24 YEARS 2011\
  \ 15159.87 11028.75 0.2725\n> 3 MALE 18 to 24 YEARS 2010 14986.02 10646.88 0.2895\n\
  > 4 MALE 18 to 24 YEARS 2010 14837.14 10109.82 0.3186\n> 5 MALE 18 to 24 YEARS 2008\
