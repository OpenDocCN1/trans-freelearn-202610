  Consumer.complaint.narrative\"],\n                          minWordLength=4, removeStopwords=TRUE,\
  \ re\n```\n\n与其查看 TDM（在这种情况下会非常大），不如通过对词条出现次数求和来执行频率分析。通过浏览数据框，您将很好地了解频繁出现的单个词条。您可能还希望计算这些词条的组合（双词组和\
  \ N-词组），这将让您了解客户投诉的主要内容：\n\n```r\nfreq <- colSums(as.matrix(dtMatrix))\nlength(freq)\n\
  head(freq)\nfreq.df <- as.data.frame(freq)\nView(freq.df)\n```\n\n`View` 命令的输出将按字母顺序显示\
  \ TDM 中的以下术语。使用滚动条浏览列表：\n\n| | 频率 |\n|---|---|\n| aaron | 1 |\n| abhorrent | 1 |\n\
  | abide | 2 |\n| abided | 2 |\n| abiding | 2 |\n| abilities | 1 |\n| ability | 82\
  \ |\n| able | 771 |\n| ablethe | 1 |\n| ableye | 1 |\n\nRTextTools 包使用容器来保存不同类型的\
  \ R 对象。我们将创建一个容器，用作持有对象，以训练前 500 条客户评论：\n\n```r\ncontainer <- create_container(dtMatrix,\
