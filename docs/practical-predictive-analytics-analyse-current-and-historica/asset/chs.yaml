  ### 比较“UNDER 18 YEARS”组的测试和训练\n\n我们还可以检查此子段的训练和测试组的图表，以查看是否真的有什么情况：\n\n```\npar(mfrow\
  \ = c(1, 2))\nplot(forecast(fit))\nplot(forecast(fit2))\n```\n\n从以下图表可以看出，尽管该组的未覆盖百分比有所下降，但可能没有足够的数据来辨别趋势，因此预测被设置为平均值。\n\
  \n对于测试数据图，我们也可以看到为什么绝对残差图在 2011 年下降，因为它从 2010 年的局部峰值（《平价医疗法案》颁布时）过渡到 2011 年下降的开始：\n\
  \n![](img/672c0cf8ba3c000a6529b117ed96945e_498_0.png)\n\n![](img/672c0cf8ba3c000a6529b117ed96945e_498_1.png)\n\
  \n### 准确度指标\n\n使用残差，我们可以根据三个流行的准确度指标来衡量预测值和实际值之间的误差：\n\n- 平均绝对误差 (MAE)：该指标计算所有误差（残差）绝对值的平均值\n\
  - 均方根误差 (RMSE)：均方根误差首先计算所有平方误差的平均值，然后对平均值开方，以便恢复到原始尺度。这是衡量误差的标准统计方法。\n\n### 注意\n\
  \nMAE 和 RMSE 都是依赖尺度的指标，这意味着它们可用于比较尺度相似的问题。在比较不同尺度的模型的准确度时，应使用其他与尺度无关的指标，例如 MAPE。\n\
  \n- 平均百分比误差 (MAPE)：这是实际值和预测值之间的绝对差值，以实际值的百分比表示。这在直观上易于理解，是一种非常流行的指标：\n\n```\nM =\
  \ \\frac{100}{n} \\sum_{t=1}^n \\left| \\frac{A_t - F_t}{A_t} \\right|,\n```\n\n\
  其中 $A_t$ 是实际值，$F_t$ 是预测值。\n\n我们可以通过简单地按 MAPE 列对 `onestep.df` 对象进行排序，来查看在 MAPE 等指标方面表现最差的模型：\n\
  \n```\nonestep.df %>% arrange(., desc(mape)) %>% head()\n>\n> cat rmse mae mape\n\
  > 1 MALE 65 YEARS AND OVER 0.002647903 0.002226841 17.440671 0.57\n> 2 MALE 35 to\
  \ 44 YEARS 0.039044319 0.024111701 14.218445 0.99\n> 3 65 YEARS AND OVER 0.002487451\
  \ 0.002096323 12.156875 0.99\n> 4 MALE 25 to 34 YEARS 0.024195057 0.019901117 6.748294\
  \ 0.99\n> 5 MALE 45 to 54 YEARS 0.017711280 0.010388681 6.380865 0.99\n> 6 FEMALE\
  \ 55 to 64 YEARS 0.006749771 0.005610275 4.021224 0.50\n```\n\n一次性绘制所有 MAPE 显示，指数模型对年轻群体效果更好，并且似乎对老年群体效果变差，尤其是男性：\n\
  \n```\nlattice::barchart(cat ~ mape, data = onestep.df)\n```\n\n![](img/672c0cf8ba3c000a6529b117ed96945e_500_0.png)\n\
  \n## 参考资料\n\nhttp://www.census.gov/data/tables/time-series/demo/health-insurance/historical-series/hib.html\n\
  \n## 摘要\n\n本章通过读取和探索 CMS 网站上的医疗保健登记数据，介绍了时间序列分析。接着，我们定义了一些基本的时间序列概念，例如简单移动平均和指数移动平均。最后，我们使用\
  \ R 的 \"forecast\" 包处理了一些指数平滑状态空间模型，并展示了一种为您的数据生成自动预测的方法。我们还展示了使用 ggplot、lattice\
  \ 包以及原生 R 图形的各种绘图方法。\n"
- "# 第 9 章. 使用 R 进行 Spark 入门\n\n> *数据！数据！数据！没有粘土，我无法制砖！*\n>\n> - 阿瑟·柯南·道尔爵士\n\n迄今为止，我们已学习如何对所谓的“小数据”进行分析。然而，随着数据量的增加，数据的规模以及如何分析产生的海量数据的问题也随之增加。当这种情况发生时，我们开始接近“大数据”，解决问题的新方法不断涌现，有时还需要新的工具。\n\
  \n在某种程度上，一切都未改变。您仍然需要高质量的数据。您仍然希望能够考察关系，并将问题放在预测分析框架内。\n\n发生变化的是实现该目标所需的步骤，请记住数据更难管理，因此已经发展出新的工具来帮助您完成这项工作。\n\
  \n近年来发展起来的工具之一是 Apache Spark。\n\n在本章中，我们将介绍 Spark 的一些基础知识。我们将从一个已知的小数据集开始，进行一些数据清理，然后将此数据集转换为更大的数据，以便带入\
  \ Apache Spark 环境。我们还将学习如何调整我们熟悉的工具，以便与 Spark 一起使用，并在过程中学习一些新工具。\n\n\n\n\n\n## 关于\
  \ Spark\n\n撰写本文时，Spark 可能是用于预测分析的最流行的超大规模数据集架构。Spark 是一种分布式架构，可帮助您管理大数据并使其更易于分析。Spark\
  \ 构建于 Hadoop 之上，两者共享同一文件系统。\n\n但是，Spark 不基于 MapReduce 范式，而是使用弹性分布式数据集（RDD）结构，以实现内存分析并管理环境中所有节点的并行处理集群。这对分析人员来说意味着查询速度非常快，因为数据从内存中检索，其检索速度远快于磁盘访问。访问速度更快意味着更多的分析时间，以及更少的等待结果时间。\n\
  \nSpark 的一些优势如下：\n\n- Spark 克服了内存受限分析的一些局限性，因为它管理内存，并能够优化数据访问和查询。\n- Spark 有自己的机器学习库，称为\
  \ MLlib，它实现了多种预测模型技术，并优化了涉及大型数据集的算法的计算速度。\n- Spark 现在包含数据框的概念，这使得使用 R 或 Python 的分析人员更容易上手。\n\
  - Spark 利用了 Hadoop 的冗余和容错特性。如果某个节点因任何原因失败，另一个节点将接替其位置，因此分析不会失败。在生产环境中工作时，这一点非常重要。\n\
  - Spark 还支持其他语言，例如 Java 和 Scala。语言可以在分析流水线中混合使用，分析人员可以共享相同的数据。这可以改善团队协作并提高效率。\n\n\
  ## Spark 环境\n\nSpark 以三种不同的模式运行：\n\n- Standalone\n- YARN\n- MESOS\n\n对于初始部署（以及学习），最好从独立模式开始，该模式专门为\
  \ Spark 分配集群。此外，您可以在本地模式（您的计算机）或通过云计算（例如使用 Amazon AWS）中运行独立模式。\n\n## 集群计算\n\n集群计算允许\
  \ Spark 同时在多台计算机上并行处理和分发数据。集群管理器根据用户请求为集群分配资源。Spark 的一个重要方面是，它会尽可能在内存中保留所需的数据，以便数据能够尽快用于各种分析，而不是每次指定查询或模型时都要等待从存储中检索数据。\n\
  \nSpark 数据以 RDD 的形式存储，允许将不同类型的对象分布在整个集群中。\n\n## 并行计算\n\n并行计算是指同时执行独立计算任务的能力。它通过分配工作负载来实现这一点。例如，如果一个数据框需要按姓氏简单排序，集群管理器可以将以字母表中\
  \ 26 个字母开头的各种名称分发到 26 个不同的节点，让每个节点排序自己的字母，然后要求将所有结果返回到一个位置，在那里执行 1 次最终排序。这比只由 1\
  \ 台机器执行排序要快。\n\n## SparkR\n\nSpark 本身使用名为 Scala 的编程语言编写，并在 Java 环境中运行。但是，您不局限于使用\
  \ Scala。Spark 有几个通过 API 暴露的接口，允许使用这些其他语言编写 Spark 程序：\n\n- R\n- Scala\n- Java\n-\
  \ Python\n- Clojure\n\n我们将在本章中使用 SparkR 演示一些示例。SparkR 是一个 R 包，提供了从 R 使用 Apache Spark\
  \ 的前端。这使得 SparkR 允许数据科学家在集群上从 R 交互式运行作业。对于传统的 R 程序员来说，使用 SparkR 的一个巨大优势是，它使用了一些他们已经熟悉的技术，例如数据框的概念在\
  \ SparkR 中也可用。\n\n### 数据框\n\nSpark RDD 使用起来可能有点困难，因此在最近的 Spark 版本中，数据框抽象被构建在 RDD\
  \ 之上，这使分析人员能够以他们习惯的方式查看数据，例如，能够将其视为表格和列表。这使得许多高级语言（例如 R 和 Python）能够使用对它们来说熟悉的语法，并能够集成与原生\
  \ Scala 或 Spark SQL 相当的优化代码。\n\nDatabricks 是由 Apache Spark 的创始人创立的公司，提供了一个免费环境，可在云中使用\
  \ R、Java、Scala 或 Python 运行 Spark 程序。\n\n我将使用 Databricks 环境来演示运行本章示例所需的代码。这些示例使用\
  \ Databricks 笔记本的概念。Databricks 笔记本类似于 Jupyter 或 Zeppelin 笔记本。笔记本比喻允许您在一个地方显示代码和结果。\n\
  \n以下是一个简单的 Databricks 笔记本示例，它计算鸢尾花萼片长度的直方图，并使用 ggplot 绘制图表。\n\n[插入 Databricks 模拟图\
  \ 1 和 Databricks 模拟图 2 图片]\n\n如我们将看到的，Databricks 笔记本还允许您在一个笔记本中混合使用不同的语言；例如，您可以使用\
  \ R、Python 和 SQL 代码的组合构建一个分析。\n\n要开始使用：\n\n- 1. 在 databricks.com 注册免费的 Databricks\
  \ 账户。\n- 2. 导入本章中使用的笔记本。\n- 3. 启动集群。\n- 4. 开始跟随学习！\n\n## 构建我们的第一个 Spark 数据框\n\n\
  使用 Spark 时的挑战之一是在处理非常大的数据集时寻找分析解决方案。作为准备步骤，在本章中，我们将构建我们自己的大型 Spark 数据框。\n\n另请注意，大型数据框的概念显然是相对的。由于免费的\
  \ Databricks 会限制所创建的任何数据框的大小，我们最终将构建一个约 11 个变量的 100 万行数据框。\n\n我还将向您展示如何在基础 R 中构建类似的数据集，以便您可以自行测试，并能够判断在\
  \ Spark 上执行分析所带来的性能收益。\n\n## 模拟\n\n我们最终将通过模拟构建这个 Spark 数据框。这将占用本章的大部分内容。我认为这比导入现有的公共数据集要好，因为在现有数据集中您无法控制数据的构成。使用模拟数据集，您可以随心所欲地调整其大小（受账户限制）。\n\
  \n但是，您始终可以自由导入任何想要的数据集，随后的分析概念将是相同的。\n\n- 1. 首先，您需要注册并登录您的 Databricks 账户。\n- 2.\
  \ 接下来，创建一个集群。为其命名，例如 MyCluster。\n- 3. 为了与本章中的示例保持一致，请确保选择 Spark 2.1。这非常重要。由于 Spark\
  \ 是 Apache 开源产品，功能可能会演变，因此我们希望确保您可以复现代码。\n- 4. 选择 `Create Cluster`。\n- 5. 留出一些时间来创建集群。当它完成时，您将收到运行中状态，如以下屏幕截图所示：\n\
  \n![](img/672c0cf8ba3c000a6529b117ed96945e_510_0.png)\n\n| 名称 | 内存 | 类型 | 状态 | 节点\
  \ | Spark |\n|---|---|---|---|---|---|\n| MyClust | 6 GB | 社区优化版, Spark 2.0 (自动更新,\
  \ Scala 2.10) | 运行中 | > 1 按需 | Spark UI 日志 |\n\n## 导入示例笔记本\n\n运行本章中示例的最佳方式是从外部网站导入笔记本。具体操作如下：\n\
  \n- 1. 单击 **工作区**。\n- 2. 右键单击 **培训与教程**（或备用文件夹）并选择 **导入**。\n- 3. 将从出版社网站下载的文件拖放到放置区，然后单击\
  \ **导入**。\n\n请参阅以下屏幕截图：\n\n![](img/672c0cf8ba3c000a6529b117ed96945e_511_0.png)\n\
  \n导入笔记本后，所有代码和输出都会出现，您可以自由地跟随剩余的代码示例进行学习。\n\n### 笔记本格式\n\n\n\n\nDatabricks 笔记本将上方窗格单元格中编写的代码，后跟下方单元格中的任何输出，类似于旁边显示的“diamonds”数据教程代码。\n\
  \n要运行当前单元格，只需单击右侧的三角形图标即可。\n\n- 单元格运行后，您将能够在代码下方查看输出。这可能是一个图表或控制台输出。始终检查错误消息和警告，尤其是当输出不是您预期的结果时。\n\
  \n- 另请注意，有些情况下根本不会产生任何输出。这可能没问题，但请务必检查输出单元格上的时间戳，以确保单元格确实已运行：\n\n![](img/672c0cf8ba3c000a6529b117ed96945e_512_0.png)\n\
  \n## 创建新笔记本\n\n作为导入笔记本的替代方案，您可以从 Databricks 主屏幕创建新笔记本，并将本章中的代码复制/粘贴到笔记本单元格中。如果您希望将本章的某些部分用作模板并添加自己的代码，可能需要这样做。\n\
  \n### 注意\n\n您可以使用以下键盘快捷键序列\n\n```\n<Ctrl> + <Alt> + N\n```\n\n以创建新笔记本。\n\n## 从小处着手，逐步壮大\n\
  \n本章将采用的策略是先检索一个现有的公开小数据集（Pima Indians diabetes，皮马印第安人糖尿病）。然后我们将进行一些基本的探索性分析，计算一些关键统计属性，并利用这些属性模拟一个更大的数据集，用于输入到\
  \ Spark 中。我们将用于生成该“大数据”的关键特征如下：\n\n- 变量的均值/标准差：目标是为大数据集生成均值和标准差，使其与小数据集的相应均值和标准差接近。\n\
  - 变量的相关性：由于统计建模和分析在很大程度上基于变量之间的关联，模拟的目标是保留小数据集中存在的所有大数据集的双向相关性数值。\n- 变量的底层分布：我们将假设所有变量均服从正态分布，但结果变量（Diabetes\
  \ 与 NonDiabetes 除外。不过，我们将模拟结果以使其与样本数据集中反映的比例相符。\n\n### 皮马印第安人糖尿病数据集\n\n要构建 Spark\
  \ DataFrame 的特征，我们将首先获取一个小数据集，确定该数据集的基本统计属性，然后基于这些属性构建 Spark DataFrame。\n\n皮马印第安人糖尿病数据集包含以下属性：\n\
  \n- 怀孕次数\n- 口服葡萄糖耐量试验两小时血浆葡萄糖浓度\n- 舒张压（mm Hg）\n- 三头肌皮皱厚度（mm）\n- 2小时血清胰岛素（mu U/ml）\n\
  - 体重指数（体重 kg/(身高 m)^2）\n- 糖尿病谱系函数\n- 年龄（岁）\n- 是否患糖尿病（是或否）\n\n该数据是公开可用的数据集。实际上，该数据集有多个版本可用。我们将使用\
  \ `mlbench` 包中包含的数据集，并将其加载到 R 工作区中。\n\n## 运行代码\n\n加载笔记本后，将出现一系列代码“块”。此特定笔记本是 R 类型笔记本，即默认情况下，代码行可以是\
  \ R 命令、SparkR 命令或特殊的 Databricks 命令（例如 display）。\n\n稍后我们将看到，可以为 SQL 命令（以 %sql 开头的笔记本）设置不同的单元格，甚至可以混合\
  \ Python（%python）或 Scala 代码（%scala）。\n\n要运行任何特定代码块的内容，可以使用以下键盘序列：\n\n```\n<Shift>\
  \ + <Enter> : Run command and move to next cell\n```\n\n或者，您可以使用运行单元格图标（第一个三角形图标）：\n\
  \n![](img/672c0cf8ba3c000a6529b117ed96945e_516_0.png)\n\n既然我们知道如何运行单个代码块，我们将首先运行初始化代码，该代码仅用于测试\
  \ Databricks 系统是否正常运行，并设置一些选项。\n\n### 运行初始化代码\n\n初始化代码仅为后续使用设置一些选项，没有实际输出。我们将只打印\
  \ \"Hello World\" 以确保其正常工作：\n\n```\noptions(digits=3)\noptions(repr.plot.width =\
  \ 1000, repr.plot.height = 500, repr.plot\nrep_times=1000\ncat(\"Hello World\")\n\
  ```\n\n输出单元格将打印 Hello World，同时给出运行耗时、用户名、日期和时间以及运行所在的集群。请密切关注每个代码块的运行时长，这日后对代码性能基准测试将很有用。\n\
  \n```\nHello World\nCommand took 0.00 seconds -- by r_wintersat 2/27/2017, 6:20:39\
  \ PM on MyCluster\n```\n\n## 提取皮马印第安人糖尿病数据集\n\n运行以下代码后，我们将加载 `PimaIndiansDiabetes`\
  \ R 数据帧，并运行通常的 `str()` 和 `summary()` 函数。请注意，我们需要先安装 `mlbench` 包以检索包中包含的数据。\n\n此时，尚未引入任何\
  \ Spark 指令。尽管我们在 Databricks 环境中运行，但代码是纯 R 代码，您也可以在常规 R 环境中复制此代码。\n\n```\n### load\
  \ the library\ndevtools::install_github(\"cran/mlbench\")\nlibrary(mlbench)\ndata(PimaIndiansDiabetes)\n\
  str(PimaIndiansDiabetes)\nsummary(PimaIndiansDiabetes)\n```\n\n### 检查输出\n\n如常，`str()`\
  \ 和 `summary()` 函数将让您初步了解数据。输出将出现在控制台窗格中，通常位于代码窗格正下方。\n\n注意：未显示所有输出。\n\n### str()\
  \ 函数的输出\n\n- `str()` 函数告诉我们，共有 768 个观测值和 9 个变量。所有变量均已加载为数值型，除了目标变量 diabetes，它已编码为具有两个级别的因子。\n\
  - `neg` 表示不存在糖尿病状况。\n- pos 表示存在糖尿病状况。\n\n同样，str() 是快速获取见解的好方法。始终扫描前几行中的 0 和 NA，并开始自问期望这些值是否合理。\n\
  \n请参考下图：\n\n```\n'data.frame': 768 obs. of 9 variables:\n$ pregnant: num 6 1 8 1\
  \ 0 5 3 10 2 8 ...\n$ glucose : num 148 85 183 89 137 116 78 115 197 125 ...\n$\
  \ pressure: num 72 66 64 66 40 74 50 0 70 96 ...\n$ triceps : num 35 29 0 23 35\
  \ 0 32 0 45 0 ...\n$ insulin : num 0 0 0 94 168 0 88 0 543 0 ...\n$ mass : num 33.6\
  \ 26.6 23.3 28.1 43.1 25.6 31 35.3 30.5 0 ...\n$ pedigree: num 0.627 0.351 0.672\
  \ 0.167 2.288 ...\n$ age : num 50 31 32 21 33 30 26 29 53 54 ...\n$ diabetes: Factor\
  \ w/ 2 levels \"neg\",\"pos\": 2 1 2 1 2 1 2 1 2 2 ...\n```\n\n### summary() 函数的输出\n\
  \nsummary() 函数将 diabetes 变量细分为计数。在 768 个观测值中，有 500 个阴性和 268 个阳性观测值。\n\n请注意，summary\
