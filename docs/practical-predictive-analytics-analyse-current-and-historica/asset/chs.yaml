  > Variables not shown: lm.coef (dbl), coef.rank (fctr)\n```\n\n## 使用趋势线绘制数据\n\n\
  现在我们已拥有趋势系数，将首先使用 ggplot 绘制所有 24 个类别的参保人数，然后创建第二组图表，添加基于刚才计算的线性系数的趋势线。\n\n代码说明：facet_wrap\
  \ 将按变量 z 的值对图表进行排序，该变量被分配为系数排名。因此，我们可以先看到参保人数下降的类别，最后看到 1999-2012 期间参保趋势最高的类别。\n\
  \n### 注意\n\n我喜欢将即将更改的变量分配给标准变量名，例如 x、y 和 z，以便记住它们的用途（例如，变量 x 始终是 x 变量，而 y 始终是 x\
  \ 变量）。但你也可以直接在 ggplot 调用中提供变量名，或设置自己的函数来完成相同的事情：\n\n```\nlibrary(ggplot2)\n.df <-\
  \ data.frame(x = x2x$Year.1, y = x2x$Not.Covered.Pct, z = x2\n#use ggplot to layer\
  \ the different components of the visualization\n.plot <- ggplot(data = .df, aes(x\
  \ = x, y = y, colour = 1, shape =\n+ geom_point()\n+ scale_shape_manual(values =\
  \ seq(0, 24))\n+ scale_y_continuous(expand = c(0.1,0))\n+ scale_x_continuous(expand\
  \ = c(0.1, 1))\n+ facet_wrap(~z) + xlab(\"Year.1\")\n+ ylab(\"Not.Covered.Pct\"\
  )\n+ labs(colour = \"cat\", shape = \"cat\")\n+ theme(panel.margin = unit(0.3,\"\
  points\"), legend.position = \"non\n+ theme(strip.text.x = element_text(size = 6))\n\
  print(.plot)\n```\n\n![](img/672c0cf8ba3c000a6529b117ed96945e_469_0.png)\n\n如你所见，对于“所有年龄段”类别，未投保百分比在整个时间段内呈上升趋势，直至\
  \ 2010 年（《平价医疗法案》颁布之年），之后百分比开始下降。然而，在同一时间段内，18 岁以下年龄组的未投保人口比例相对于人口规模呈下降趋势。\n\n我们可以更仔细地查看前四名和后四名类别，以及“所有年龄段”类别，以更深入地研究这一点。这次，我们将使用\
  \ geom_smooth 参数添加自己的趋势线，它将添加线性回归趋势线：\n\n```\n### declining enrollment\n.df2 <-\
  \ rbind(head(.df, (4*14)) , tail(.df, (4*14)) , .df[.df$z == \"1\n.plot2 <- ggplot(data\
  \ = .df2, aes(x = x, y = y, colour = 1, shape\n+ geom_point()\n+ scale_shape_manual(values\
  \ = seq(0, nrow(.df2)))\n+ scale_y_continuous(expand = c(0.1, 0))\n+ scale_x_continuous(expand\
  \ = c(0.1, 1))\n+ facet_wrap(~z)\n+ xlab(\"Year.1\")\n+ ylab(\"Not.Covered.Pct\"\
  )\n+ labs(colour = \"cat\", shape = \"cat\")\n+ theme(panel.margin = unit(0.3,\"\
  points\"),legend.position = \"none\n+ geom_smooth(method = \"lm\", se = FALSE,colour\
  \ = \"red\")\n.plot2 <- ggplot(data = .df2, aes(x = x, y = y, colour = 1, shape\n\
  + geom_point()\n+ scale_shape_manual(values = seq(0, nrow(.df2)))\n+ scale_y_continuous(expand\
  \ = c(0.1,0))\n+ scale_x_continuous(expand = c(0.1, 1))\n+ facet_wrap(~z)\n+ xlab(\"\
  Year.1\")\n+ ylab(\"Not.Covered.Pct\")\n+ labs(colour = \"cat\", shape = \"cat\"\
  )\n+ theme(panel.margin = unit(0.3,\"points\"),legend.position = \"none\n+ geom_smooth(method\
  \ = \"lm\", se = FALSE,colour = \"red\")\nprint(.plot2)\n```\n\n![](img/672c0cf8ba3c000a6529b117ed96945e_470_0.png)\n\
  \n## 将所有类别绘制在同一图表上\n\n有时，将所有线条绘制在同一图表上而不是分开的图表会更好。为此，我们会稍微修改语法，使类别显示为堆叠线。同样，我们可以看到不同年龄段的未投保百分比是一致的，其中\
  \ 18 岁以下组的未投保率最低，而 25-54 岁组的未投保率最高：\n\n```\nlibrary(ggplot2)\n### plot all on one\
  \ graph\n\n.df <- x3[order(x3$Year.1), ]\n.plot <- ggplot(data = .df, aes(x = Year.1,\
  \ y = Not.Covered.Pct,\n+ geom_point()\n+ geom_line(size = 1)\n+ scale_shape_manual(values\
  \ = seq(0,15))\n+ ylab(\"Not.Covered.Pct\")\n+ labs(colour = \"cat\", shape = \"\
  cat\")\n+ theme_bw(base_size = 14,base_family = \"serif\")\nprint(.plot)\n```\n\n\
  ![](img/672c0cf8ba3c000a6529b117ed96945e_472_0.png)\n\n## 添加标签\n\n有时，根据图例辨别类别之间的差异可能有些困难，尤其是类别数量增加时，因此我们可以使用\
  \ directlabels 库为每条线标记类别名称。现在我们可以看到，例如，所有男性类别在所有时间段的未投保率均高于所有女性类别：\n\n```\n#install.packages(\"\
  directlabels\")\nlibrary(directlabels)\ndirect.label(.plot, list(last.points, hjust\
  \ = 0.75, cex = 0.75, v\n```\n\nNot.Covered.Pct\n\nYear.1\n\n- 25 至 34 岁\n- 35 至\
  \ 44 岁\n- 45 至 54 岁\n- 男性所有年龄段\n- 所有年龄段\n- 女性所有年龄段\n- 女性 19 岁以下\n- 65 岁及以上\n\n![](img/672c0cf8ba3c000a6529b117ed96945e_473_0.png)\n\
  \n\n\n\n## 使用 ets 函数进行自动化预测\n\n到目前为止，我们已经探讨了如何探索数据中可能固有的任何线性趋势。这为下一步（预测）奠定了坚实基础。现在，我们将开始探讨如何进行实际预测。\n\
  \n### 将数据框转换为时间序列对象\n\n作为准备步骤，我们将使用 ts 函数将数据框转换为时间序列对象。在转换为 ts 对象之前，确保时间序列间距相等很重要。至少，你需要将时间序列变量、开始日期和结束日期作为参数提供给\
  \ ts 函数。\n\n创建新对象 x 后，运行 str() 函数以验证 1999 年至 2012 年的全部 14 个时间序列是否已创建：\n\n```\n####\
  \ only extract the 'ALL' timeseries\nx <- ts(x2$Not.Covered.Pct[1:14], start = c(1999),\
  \ end = c(2012),\n\nstr(x)\n> Time-Series [1:14] from 1999 to 2012: 0.154 0.157\
  \ 0.163 0.161\n```\n\n## 使用移动平均平滑数据\n\n分析时间序列的一种简单技术涉及简单移动平均和指数移动平均。简单移动平均和指数移动平均都是用于平滑系列中的随机噪声并观察周期和趋势的方法。\n\
  \n### 简单移动平均\n\n简单移动平均将简单地取过去 k 个周期时间序列变量的总和，然后除以周期数。从这个意义上说，它与均值计算相同。然而，使其与简单平均值不同的是以下几点：\n\
  \n- 平均值会随着每增加一个时间段而移动。移动平均是向后看的，每当时间段移动时，平均值也会随之移动。这就是它们被称为“移动”的原因。移动平均有时也称为滚动平均。\n\
  - 回顾期可以移动。这是移动平均的第二个特征。10 周期移动平均将取最后 10 个数据元素的平均值，而 20 周期移动平均将取最后 20 个数据点的总和，然后除以\
  \ 20。\n\n### 使用函数计算 SMA\n\n为了计算我们数据的五周期滚动移动平均值，我们将使用 TTR 包中的简单移动平均（SMA）函数，然后显示前几行：\n\
  \n```\n#install.packages(\"TTR\")\nlibrary(TTR)\nMA <- SMA(x, n = 5)\ncbind(head(x,\
  \ 14), head(MA, 14) )\n>           [,1]         [,2]\n> [1,] 0.1541247         NA\n\
  > [2,] 0.1574131         NA\n> [3,] 0.1629424         NA\n> [4,] 0.1609860     \
  \    NA\n> [5,] 0.1485338 0.1568000\n> [6,] 0.1474000 0.1554551\n> [7,] 0.1523271\
  \ 0.1544379\n> [8,] 0.1464598 0.1511414\n> [9,] 0.1433967 0.1476235\n> [10,] 0.1455136\
  \ 0.1470194\n> [11,] 0.1391090 0.1453612\n> [12,] 0.1347953 0.1418549\n> [13,] 0.1308892\
  \ 0.1387408\n> [14,] 0.1362041 0.1373023\n```\n\n有多种方法可以将移动平均值与原始数据一起绘图。使用基础 R，使用\
  \ `ts.plot()` 函数来实现这一点，该函数将原始系列和系列的移动平均值作为参数：\n\n```\nts.plot(x, MA, gpars = list(xlab\
  \ = \"year\", ylab = \"Percentage of\nlty = c(1:2)))\ntitle(\"Percentage of Non-Insured\
  \ 1999-2012 - With SMA\")\n```\n\n以下图表以实线显示原始数据，以虚线显示计算出的移动平均值：\n\n![](img/672c0cf8ba3c000a6529b117ed96945e_477_0.png)\n\
  \n你可以看到移动平均值如何有助于显示数据的上升和下降趋势，同时也有助于平滑数据以消除一些噪声。还要注意，移动平均需要一些初始数据才能开始计算，这就是为什么图表中前四个时间段的虚线移动平均线缺失的原因。只有在第五个周期，它才能通过对应时间段\
  \ 1999-2003 的数值求和然后除以五来确定计算结果。下一个点是通过对应时间段 2000-2004 的数值求和，然后再除以五来得出的。\n\n### 验证\
  \ SMA 计算\n\n始终验证计算很重要，以确保值计算正确，并促进理解。\n\n对于 `SMA` 函数，我们可以切换到控制台，计算最后五个数据点的 `SMA`\
  \ 函数值。\n\n首先，计算元素的总和，然后除以移动平均中的数据点数（5）：\n\n```\nsum(x[10:14])/5\n> [1] 0.1373023\n\
  ```\n\n这与时间段 14 的 SMA 列完全一致。\n\n### 指数移动平均\n\n对于简单移动平均（SMA），所有数据点均等权重，无论其数据有多旧或出现多近。指数移动平均（EMA）对近期数据赋予更多权重，基于未来更可能类似于近期过去而非久远过去的假设。\n\
  \n实际上，EMA 是一个更简单的计算。EMA 首先计算一个简单移动平均。当它达到指定的回顾期数（n）时，它通过给当前值和前一个值分配不同的权重来计算当前值。\n\
  \n这种权重由平滑（或比率）因子指定。当 ratio=1 时，预测值完全基于最后一个时间值。对于 ratio=0，预测基于整个回顾期的平均值。因此，平滑因子越接近\
  \ 1，对近期数据赋予的权重就越大。如果你想给较旧数据更多权重，请将平滑因子降低到接近 0。\n\n一般来说，EMA 的公式如下：\n\n{Current Data\
  \ Point - EMA(previous)} x smoothing factor + EMA(previous day)\n\n要计算 EMA，可以使用\
  \ `EMA()` 函数（来自 `TTR` 包）。你需要指定一个平滑常数（比率）以及一个回顾期（n）。\n\n### 使用函数计算 EMA\n\n以下代码将使用回顾期为\
  \ 5、比率为 .8 计算 EMA。比率 .8 会给最近周期赋予最大权重，同时仍允许过去影响预测。\n\n然后我们将使用 cbind() 显示数据点，以及简单移动平均和指数移动平均：\n\
  \n```\nExpMA <- EMA(x, n = 5, ratio = 0.8)\ncbind(head(x, 15), head(MA, 15), head(ExpMA,\
  \ 15))\n> [,1] [,2] [,3]\n> [1,] 0.1541247 NA NA\n> [2,] 0.1574131 NA NA\n> [3,]\
  \ 0.1629424 NA NA\n> [4,] 0.1609860 NA NA\n> [5,] 0.1485338 0.1568000 0.1568000\n\
  > [6,] 0.1474000 0.1554551 0.1492800\n> [7,] 0.1523271 0.1544379 0.1517177\n> [8,]\
  \ 0.1464598 0.1511414 0.1475114\n> [9,] 0.1433967 0.1476235 0.1442196\n> [10,] 0.1455136\
  \ 0.1470194 0.1452548\n> [11,] 0.1391090 0.1453612 0.1403382\n> [12,] 0.1347953\
  \ 0.1418549 0.1359039\n> [13,] 0.1308892 0.1387408 0.1318922\n> [14,] 0.1362041\
  \ 0.1373023 0.1353417\nts.plot(x, ExpMA, gpars = list(xlab = \"year\", ylab = \"\
  Percentage\nlty = c(1:2)))\ntitle(\"Percentage of Non-Insured 1999-2012 - With EMA\"\
  )\n```\n\n以下图表以图形形式显示数据。你可以看到每个数据点比 SMA 更接近其 EMA，如前所述，SMA 在回顾期内对所有先前数据点赋予相等权重。在这方面，EMA\
  \ 对近期数据反应更快，而 SMA 移动较慢且变异性较小。当然，两者都受参数影响，尤其是回顾期。在两种情况下，更长的回顾期都会导致移动平均更慢：\n\n###\
  \ 1999-2012 年未投保百分比 - 带 EMA\n\n![](img/672c0cf8ba3c000a6529b117ed96945e_482_0.png)\n\
  \n### 选择平滑因子\n\n有时，选择合适的平滑因子是基于你对数据的自身经验，让你能够表达自己对未来表现的看法。例如，如果你认为数据最近已发生变化以反映新模式，你可能希望假设近期数据更重要，并使用接近\
  \ 1 的平滑因子。另一方面，如果你认为近期活动仅由随机波动引起，你可能希望选择较低的平滑因子，以给过去更多权重。将近期过去与远古过去同等对待的平滑因子可能是类似\
  \ 0.5 的值。重点是，不一定总是需要自动优化平滑因子（我们将在下一节看到）。\n\n\n\n### 使用 ets 函数\n\n虽然移动平均非常有用，但它们仅是所谓的指数平滑状态空间模型的一个组成部分，该模型有许多选项来定义最佳平滑因子，并允许您通过参数定义趋势和季节性的类型。要实现此模型，我们将使用\
  \ forecast 包中的 ets() 函数来对\"ALL AGES\"类别的 Not-Covered Percent 变量进行建模。\n\nets() 函数很灵活，因为它还可以在预测中纳入趋势以及季节性。\n\
  \n我们将仅演示一个简单的指数平滑模型（ANN）。然而，为了完整起见，您应该知道在调用 ets() 函数时需要指定三个字母，并且应该了解每个字母代表的含义。否则，它将基于默认参数进行建模。\n\
  \n以下是包作者 Hyndman 指定的描述：\n\n- 第一个字母表示误差类型（“A”、“M”或“Z”）\n- 第二个字母表示趋势类型（“N”、“A”、“M”或“Z”）\n\
  - 第三个字母表示季节类型（“N”、“A”、“M”或“Z”）\n\n在所有情况下，N=无，A=加法，M=乘法，Z=自动选择。\n\n因此，对于我们的示例，如果我们想要像手动计算中所做的那样建立一个简单的指数平滑模型，我们将指定\
  \ model=ANN。\n\n### 使用 ALL AGES 进行预测\n\n以下代码将执行以下步骤：\n\n- 首先，它将过滤数据，使其仅包含 `ALL AGES`\
  \ 类别。\n- 然后，它创建一个时间序列对象。\n- 最后，它使用 `ets()` 函数运行一个简单的指数模型。\n\n请注意，我们没有指定平滑因子。`ets()`\
  \ 函数计算最佳平滑因子（alpha，通过下面粗体显示的 `summary()` 函数显示），在此例中为 .99，这意味着模型时间序列将约 99% 的前一值纳入下一个时间序列预测中：\n\
  \n```\nlibrary(dplyr)\n>\n> Attaching package: 'dplyr'\n> The following objects\
  \ are masked from 'package:stats':\n>\n>     filter, lag\n> The following objects\
  \ are masked from 'package:base':\n>\n>     intersect, setdiff, setequal, union\n\
  library(forecast)\n> Loading required package: zoo\n>\n> Attaching package: 'zoo'\n\
  > The following objects are masked from 'package:base':\n>\n>     as.Date, as.Date.numeric\n\
  > Loading required package: timeDate\n> This is forecast 7.1\nx4 <- x2[x2$cat ==\
  \ \"ALL AGES\", ]\n\n#### set up as a time series object\nx <- ts(x4$Not.Covered.Pct,\
  \ start = c(1999), end = c(2012), frequency = 1)\n\nfit <- ets(x, model = \"ANN\"\
  )\n```\n\n```\nsummary(fit)\n> ETS(A,N,N)\n>\n> Call:\n> ets(y = x, model = \"ANN\"\
  )\n>\n> Smoothing parameters:\n> alpha = 0.9999\n>\n> Initial states:\n> l = 0.1541\n\
  >\n> sigma: 0.0052\n>\n> AIC   AICc   BIC\n> -106.3560 -105.2651 -105.0779\n>\n\
  > Training set error measures:\n>           ME      RMSE      MAE       MPE    \
  \  MAPE\n> Training set -0.001279923 0.005191075 0.00430566 -0.9445532 2.9\n>  \
  \         MASE    ACF1\n> Training set 0.9286549 0.004655079\n```\n\n### 绘制预测值和实际值\n\
  \n接下来，我们可以绘制预测值与实际值的对比图。请注意，预测值几乎与实际值相同；然而，它们总是领先一步：\n\n```\nplot(x)\nlines(fit$fitted,\
  \ col = \"red\")\n```\n\n![](img/672c0cf8ba3c000a6529b117ed96945e_486_0.png)\n\n\
  ### forecast（fit）方法\n\nforecast 方法包含许多可显示的对象，例如拟合值、原始值、置信区间和残差。使用 str(forecast(fit))\
  \ 来查看可用的对象。\n\n我们将使用 cbind 打印原始数据点、拟合数据点和模型拟合方法。\n\n```\ncbind(forecast(fit)$method,forecast(fit)$x,forecast(fit)$fitted)\n\
  Time Series:\nStart = 1999\nEnd = 2012\nFrequency = 1\nforecast(fit)$method forecast(fit)$x\
  \ forecast(fit)$fitted\n1999 ETS(A,N,N) 0.15412470117969 0.154120663632029\n2000\
  \ ETS(A,N,N) 0.157413125646824 0.154124700770241\n2001 ETS(A,N,N) 0.162942355969924\
  \ 0.157412792166205\n2002 ETS(A,N,N) 0.160986044554207 0.162941795214416\n2003 ETS(A,N,N)\
  \ 0.148533847659868 0.160986242887746\n2004 ETS(A,N,N) 0.147400008880004 0.148535110462768\n\
  2005 ETS(A,N,N) 0.152327126236553 0.147400123991157\n2006 ETS(A,N,N) 0.146459794092561\
  \ 0.152326626587079\n2007 ETS(A,N,N) 0.14339666192983 0.146460389050636\n2008 ETS(A,N,N)\
  \ 0.145513631588618 0.143396972623751\n2009 ETS(A,N,N) 0.139109023459534 0.145513416937297\n\
  2010 ETS(A,N,N) 0.134795323545856 0.139109672931905\n2011 ETS(A,N,N) 0.130889234985064\
  \ 0.134795761065932\n2012 ETS(A,N,N) 0.136204104247743 0.130889631147599\n```\n\n\
  我们还可以使用 View 以矩阵形式显示 forecast 对象的部分内容：\n\n| | 点预测 | 80% 下限 | 80% 上限 | 95% 下限 | 95%\
  \ 上限 |\n|---|---|---|---|---|---|\n| 2013 | 0.1362036 | 0.1295509 | 0.1428562 |\
  \ 0.1260292 | 0.1463779 |\n| 2014 | 0.1362036 | 0.1267958 | 0.1456113 | 0.1218156\
  \ | 0.1505915 |\n| 2015 | 0.1362036 | 0.1246817 | 0.1477255 | 0.1185823 | 0.1538248\
  \ |\n| 2016 | 0.1362036 | 0.1228993 | 0.1495078 | 0.1158565 | 0.1565507 |\n| 2017\
  \ | 0.1362036 | 0.1213290 | 0.1510781 | 0.1134549 | 0.1589522 |\n| 2018 | 0.1362036\
  \ | 0.1199094 | 0.1524977 | 0.1112838 | 0.1611233 |\n| 2019 | 0.1362036 | 0.1186039\
  \ | 0.1538032 | 0.1092872 | 0.1631199 |\n| 2020 | 0.1362036 | 0.1173888 | 0.1550184\
  \ | 0.1074288 | 0.1649783 |\n| 2021 | 0.1362036 | 0.1162475 | 0.1561597 | 0.1056834\
  \ | 0.1667238 |\n| 2022 | 0.1362036 | 0.1151680 | 0.1572391 | 0.1040325 | 0.1683747\
  \ |\n\n### 绘制带置信带的未来值\n\n使用 `plot` 函数绘制未来预测。请注意，最后一个值的预测包围了围绕水平预测线的上下置信带。但为什么是水平预测线？这表明指数模型没有趋势或季节性，且最佳预测基于平滑平均值的最后一个值。然而，我们可以看到，基于置信带，预测存在显著变化。随着预测期的增加，置信带也会增大，以反映预测相关的不确定性：\n\
  \n```\nplot(forecast(fit))\n```\n\n### ETS(A,N,N) 的预测\n\n![](img/672c0cf8ba3c000a6529b117ed96945e_490_0.png)\n\
  \n### 修改模型以包含趋势分量\n\n此前，我们向数据添加了线性趋势线。如果我们还希望将线性趋势纳入预测，可以将第二个参数（趋势参数）替换为 A，从而得到一个\
  \ \"AAN\" 模型（Holt 线性趋势）。这种方法允许带有趋势的指数平滑：\n\n```\nfit <- ets(x, model = \"AAN\")\n\
  summary(fit)\n> ETS(A,A,N)\n>\n> Call:\n>  ets(y = x, model = \"AAN\")\n>\n>  Smoothing\
  \ parameters:\n>   alpha = 0.0312\n>   beta = 0.0312\n>\n>  Initial states:\n> \
  \  l = 0.1641\n>   b = -0.0021\n>\n>  sigma: 0.0042\n>\n>      AIC     AICc    \
  \  BIC\n> -108.5711 -104.1267 -106.0149\n>\n>   Training set error measures:\n>\
  \                   ME      RMSE        MAE         MPE      MAPE\n> Training set\
  \ -0.000290753 0.004157744 0.003574276 -0.2632899 2.\n>   MASE      ACF1\n> Training\
  \ set 0.7709083 0.05003007\n```\n\n绘制预测会产生下面的图表：\n\n```\nplot(forecast(fit))\n```\n\
  \n### ETS(A,A,N) 的预测\n\n![](img/672c0cf8ba3c000a6529b117ed96945e_492_0.png)\n\n\
  #### 在所有类别上迭代运行 ets 函数\n\n现在我们已经在一个类别上运行了 ets 模型，可以构建一些代码来自动化所有类别的模型构建过程。\n\n在此过程中，我们还将保存一些精度指标，以便查看我们的模型表现如何：\n\
  \n- 首先，按类别对数据帧进行排序，然后按年份排序。\n- 然后，初始化一个新数据帧（onestep.df），我们将使用它来存储测试和训练数据每个移动窗口预测的准确性结果。\n\
  - 然后，将每个组（均包含 14 个时间周期）作为 for 循环中的一次迭代进行处理。\n- 对于每次迭代，提取一个测试和训练数据帧。\n- 为训练数据集拟合一个简单的指数平滑模型。\n\
  - 将模型拟合应用于测试数据集。\n- 应用 accuracy 函数以提取验证统计信息。\n- 将每个结果存储在前一步中初始化的 onestep.df 数据帧中：\n\
  \n```\ndf <- x2 %>% arrange(cat, Year.1)\n\n#### create results data frame\nonestep.df\
  \ <- data.frame(cat = character(), rmse = numeric(), mape = numeric(), acf1 = numeric(),\
  \ stringsAsFactors = FALSE)\n\n#\n```\n\n\n\n\n```\n#### library(forecast)\niterations\
  \ <- 0\nfor (i in seq(from = 1, to = 999, by = 14)) {\nj <- i + 13\n#### pull out\
  \ the next category. It will always be 14 records.\nx4 <- df[i:j, ]\nx <- ts(x4$Not.Covered.Pct,\
  \ start = c(1999), end = c(2012), frequency = 1)\n\n#### assign the first 10 records\
  \ to the training data, and the next\n#### test data.\n```\n\n```\ntrainingdata\
  \ <- window(x, start = c(1999), end = c(2008))\ntestdata <- window(x, start = c(2009),\
  \ end = c(2012))\n```\n\n```\npar(mfrow = c(2, 2))\n\n#### first fit the training\
  \ data, then the test data.\n#### Use simple exponential smoothing\nfit <- ets(trainingdata,\
  \ model = \"ANN\")\n#### summary(fit)\nfit2 <- ets(testdata, model = fit)\nonestep\
  \ <- fitted(fit2)\n```\n\n```\niterations <- iterations + 1\nonestep.df[iterations,\
  \ 1] <- paste(x4$cat[1])\nonestep.df[iterations, 2] <- accuracy(onestep, testdata)[,\
  \ 2] #RMSE\nonestep.df[iterations, 3] <- accuracy(onestep, testdata)[, 3] #MAE\n\
  onestep.df[iterations, 4] <- accuracy(onestep, testdata)[, 5] #MAPE\nonestep.df[iterations,\
  \ 5] <- accuracy(onestep, testdata)[, 7] #ACF1\n\nif (iterations == 24)\nbreak\n\
  }\n```\n\n查看 for 循环中提取的某个类别的一些行。由于循环中创建的所有中间对象都仍然完整，因此查看最后处理的组很容易。\n\n首先，让我们来看看原始组的实际数据：\n\
  \n```\ntail(x4)\n```\n\n这显示了最后一个组“UNDER 18 YEARS”的部分输出。注意：要查看所有年份，您需要在控制台中运行命令 `tail(x4,14)`\
  \ 而不是此命令：\n\n```\n> Source: local data frame [6 x 9]\n>\n> cat Avg.Total.Insured\
  \ Avg.People Year Year.1\n> (fctr) (dbl) (dbl) (fctr) (int)\n> 1 UNDER 18 YEARS\
  \ 66200.46 73752.5 2007 2007\n> 2 UNDER 18 YEARS 66200.46 73752.5 2008 2008\n> 3\
  \ UNDER 18 YEARS 66200.46 73752.5 2009 2009\n> 4 UNDER 18 YEARS 66200.46 73752.5\
  \ 2010 2010\n> 5 UNDER 18 YEARS 66200.46 73752.5 2011 2011\n> 6 UNDER 18 YEARS 66200.46\
  \ 73752.5 2012 2012\n> Variables not shown: Total.People (dbl), Total (dbl), Not.Covered,\
  \ Not.Covered.Pct (dbl)\n```\n\n### onestep 生成的准确度指标\n\n从 for 循环生成的 onestep.df 对象包含所有组的所有准确度指标。让我们看看前\
  \ 6 个。您可以看到，每个类别都捕获了准确度指标 rmse、mae 和 mape：\n\n```\nhead(onestep.df)\n> cat rmse\
  \ mae mape acf1\n> 1 18 to 24 YEARS 0.013772470 0.009869590 3.752381 1.0000552\n\
  > 2 25 to 34 YEARS 0.004036661 0.003380938 1.217612 1.0150588\n> 3 35 to 44 YEARS\
  \ 0.006441549 0.004790155 2.231886 0.9999469\n> 4 45 to 54 YEARS 0.004261185 0.003129072\
  \ 1.734022 0.9999750\n> 5 55 to 64 YEARS 0.005160212 0.004988592 3.534093 0.7878765\n\
  > 6 65 YEARS AND OVER 0.002487451 0.002096323 12.156875 0.9999937\ncbind(fit$x,\
  \ fit$fitted, fit$residuals)\n> Time Series:\n> Start = 1999\n> End = 2008\n> Frequency\
  \ = 1\n> fit$x fit$fitted fit$residuals\n> 1999 0.11954420 0.1056241 0.0139200744\n\
  > 2000 0.10725759 0.1056255 0.0016320737\n> 2001 0.10649619 0.1056257 0.0008705016\n\
  > 2002 0.10291788 0.1056258 -0.0027078918\n> 2003 0.10393522 0.1056255 -0.0016902769\n\
  > 2004 0.09942592 0.1056253 -0.0061994140\n> 2005 0.10320781 0.1056247 -0.0024169001\n\
