  \ clusters7) %>%\n+   group_by(clusters7) %>%\n+   summarise_each(funs(n(),mean))\n\
  Source: local data frame [7 x 7]\n\nclusters7 units.bought_n TotalPaid_n Days.since_n\
  \ units.bought_mean TotalPaid_mean Days.since_mean\n(int)       (int)          (int)\
  \         (int)          (dbl)         (dbl)         (dbl)\n1           1      \
