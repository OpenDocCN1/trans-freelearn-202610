  \ 1000 行。\n\n### 运行 OneR 模型\n\nOneR 模型的语法应该很熟悉。结果变量 frisked 指定在公式 (~) 的左侧，特征指定在右侧。如你所记得，元字符\
  \ (.) 指定将使用所有特征作为预测器：\n\n```\nmodel <- OneR(train_data, frisked ~ ., verbose = TRUE)\n\
  summary(model)\n```\n\n（部分）摘要输出显示基于仅选择一个变量作为预测器及其分类率的准确率。显著变量带有星号。\n\n接下来显示前 7 个变量的属性和准确率指标。请注意，一旦准确率达到\
  \ 67.61%，它就不会下降：\n\n| | 属性 | 准确率 |\n|---|---|---|\n| 1 | * sex | 68.56% |\n| 2 |\
  \ eyecolor | 67.68% |\n| 3 | haircolor | 67.62% |\n| 4 | year | 67.61% |\n| 4 |\
  \ ser_num | 67.61% |\n| 4 | datestop | 67.61% |\n| 4 | timestop | 67.61% |\n\n函数调用在日志中显示，决策树规则已显示。\n\
  \n```\nCall:\nOneR(data = train_data, formula = frisked ~ ., verbose = TRUE)\n\n\
  Rules:\nIf sex = F then frisked = N\nIf sex = M then frisked = Y\nIf sex = Z then\
  \ frisked = Y\n\nAccuracy:\n11728 of 17105 instances classified correctly (68.56%)\n\
  \nContingency table:\n    sex\nfrisked   F     M     Z  Sum\n  N   * 668  4822 \
  \  50 5540\n  Y   505  * 10968  * 92 11565\n  Sum 1173 15790  142 17105\n---\nMaximum\
  \ in each column: '*'\n\nPearson's Chi-squared test:\nX-squared = 348.29, df = 2,\
  \ p-value < 2.2e-16\n```\n\n### 解读输出\n\n摘要输出很好地体现了每个变量作为单独预测器的重要性。所有准确率指标的范围在 67.61%\
  \ 到 68.56% 之间，因此没有哪个单一变量明显优于其他变量来预测是否被盘查。\n\n不过，排名靠前的变量是 sex，其准确率为 68.56%。将结果分类为被盘查或未被盘查的唯一简单规则是：\n\
  \n如果 sex 为男性或未知，则 68.56% 的时间结果被正确预测。\n\n这在下面两个手动计算的列联表中有所体现，其中星号 * 表示正确分类（以下背景为绿色）。我手动添加了第二个列联表，它给出的是百分比，而不是输出中提供的原始计数。\n\
  \n以下是一个包含计数和百分比的混淆矩阵：\n\n| frisked | F | M | Z | 总计 | 正确分类总数 |\n|---|---|---|---|---|---|\n\
  | N | 668 | 4,822 | 50 | 5,540 | |\n| Y | 505 | 10,968 | 92 | 11,565 | 11,728 |\n\
  | Sum | 1,173 | 15,790 | 142 | 17,105 | |\n\n| frisked | F | M | Z | 总计 | 正确分类总数\
  \ |\n|---|---|---|---|---|---|\n| N | 4% | 28% | 0% | 32% | 69% |\n| Y | 3% | 64%\
  \ | 1% | 68% | |\n| Sum | 7% | 92% | 1% | 17,105 | |\n\n- 如果 sex=M，则 64% 的时间被盘查被正确预测。\n\
  - 如果 sex=F，则 4% 的时间未被盘查被正确预测。\n\n虽然百分比很小，但你可以看到，一般来说，男性被盘查的次数远多于女性。你还可以由此推导一些条件概率：如果你是女性，则有\
  \ 3/7 或 43% 的几率会被盘查。但是，如果你是男性，则有 64/92 或 70% 的几率会被盘查。\n\n如果 sex=Z（未知），则 1% 的时间被盘查被正确预测。\n\
  \n### 构建新变量\n\n尽管 OneR 通过寻找单个最佳预测器来工作，但我们也可以通过构建一些新变量并诱使 OneR 认为它是一个变量，来尝试改进预测。\n\
  \n在下面的代码中，我们通过组合 build、eyecolor 和 hair color 等单个变量的属性来创建新变量。再次运行 OneR 模型后，你可以看到，在预测准确率方面它有所帮助，并且其中一个新变量（eye_hair_build）现在排名第二。\n\
  \n\n\n\n这是一个演示如何执行“特征工程”的简单示例。\n\n```\ntmp <- train_data\ntmp$eye_hair_build <-\
  \ paste(train_data$eyecolor, train_data$haircolor)\ntmp$weapon <- paste(train_data$knifcuti,\
  \ train_data$riflshot, train)\nmodel <- OneR(tmp, frisked ~ ., verbose = TRUE)\n\
  ```\n\n| 属性 | 准确率 |\n|---|---|\n| 1 * 性别 | 68.56% |\n| 2 eye_hair_build | 68.07%\
  \ |\n| 3 eyecolor | 67.68% |\n| 4 haircolor | 67.62% |\n\n### 在测试样本上运行预测\n\neval_model\
  \ 函数将预测规则应用于测试数据，\n并生成混淆矩阵，包含绝对计数和相对\n百分比，因此无需手动计算百分比，如我们\n上面所做的那样。\n\n将模型结果应用于测试样本显示准确率与\n\
  训练样本相似，这在一定程度上验证了结果。\n\n错误率是错误分类的百分比，相当于\n1 减去准确率：\n\n```\nprediction <- predict(model,\
  \ test_data,type=\"class\")\n#Evaluate prediction statistics\n\neval_model(prediction,\
  \ test_data)\n```\n\n```\nConfusion matrix (absolute):\n        actual\nprediction\
  \   N   Y  Sum\nN           153 122 275\nY          1269 2722 3991\nSum        1422\
  \ 2844 4266\n\nConfusion matrix (relative):\n        actual\nprediction   N    \
  \ Y     Sum\nN           0.04  0.03  0.06\nY           0.30  0.64  0.94\nSum   \
  \      0.33  0.67  1.00\n```\n\n准确率：\n0.6739 (2875/4266)\n\n错误率：\n0.3261 (1391/4266)\n\
  \n### 另一个 OneR 示例\n\n此示例使用更大的糖尿病数据集。由于该数据集中的大多数变量都是数值型，OneR 可以对所有变量进行分箱：\n\n- 首先，使用\
  \ SQL 读取 Spark 糖尿病表，该表已在前一章中注册。\n- 从数据中收集 15% 的随机样本，并将其分配给名为 \"local\" 的 R（非 Spark！）数据框。\n\
  - 根据所有可用变量预测结果的能力对其进行分箱，并将其分配给名为 \"data\" 的 R 数据框：\n\n```\nlibrary(OneR)\ndf = sql(\"\
  SELECT outcome, age, mass, triceps, pregnant,\nglucose, pressure, insulin, pedigree\n\
  FROM global_temp.df_view\")\n\nlocal = collect(sample(df, F, .15))\n\ndata <- optbin(local,outcome~.)\n\
  summary(data)\n```\n\n| 年龄 | 质量 | 肱三头肌 | 怀孕 | 葡萄糖 | 压力 | 胰岛素 | 系谱 | 结果 |\n|---|---|---|---|---|---|---|---|---|\n\
  | (-1.54,37.1]:118790 | (12.4,35]:121754 | (0.703,32.8]:128435 | (-5.29,4.91]:117506\
  \ | (38.9,139]:139019 | (35.3,75.6]:114164 | (-149,205]:131628 | (-0.548,0.529]:111914\
  \ | 0:121724 |\n| (37.1,74]: 67698 | (35,54.2]: 64734 | (32.8,58.3]: 58053 | (4.91,13.8]:\
  \ 68982 | (139,220]: 47469 | (75.6,112]: 72324 | (205,447]: 54860 | (0.529,1.69]:\
  \ 74574 | 1: 64764 |\n\n4. 使用所有变量运行 OneR 模型来预测结果。请记住，结果是指示是否患有糖尿病：\n\n```\nmodel\
  \ <- OneR(data, outcome~., verbose = TRUE)\nsummary(model)\nprediction <- predict(model,\
  \ data)\n```\n\n5. 评估预测统计信息。请注意，与其他预测变量相比，葡萄糖和胰岛素具有更好的单变量准确率结果：\n\n```\neval_model(prediction,\
  \ data)\n```\n\n| 属性 | 准确率 |\n|---|---|\n| * 葡萄糖 | 76.54% |\n| 胰岛素 | 72.25% |\n\
  | 肱三头肌 | 65.73% |\n| 年龄 | 65.27% |\n| 质量 | 65.27% |\n| 怀孕 | 65.27% |\n| 压力 | 65.27%\
  \ |\n| 系谱 | 65.27% |\n\n由于准确率和并列方法（如适用）而选择的属性：'*'\n\n### 规则部分\n\n既然我们知道了重要变量，是时候检查\
  \ OneR 包如何输出决策规则了。由于 glucose 被认为是最佳单一预测变量，预测糖尿病的决策规则显示在 Rules: 部分下，而 glucose 的最优截止点（139）显示在下面的列联表中。\n\
  \n```\nCall:\nOneR(data = data, formula = outcome ~ ., verbose = TRUE)\n```\n\n\
  ```\nRules:\nIf glucose = (38.9,139] then outcome = 0\nIf glucose = (139,220] then\
  \ outcome = 1\n```\n\n准确率：\n186488 个实例中有 142741 个被正确分类（76.54%）\n\n列联表：\n\n| 结果 |\
  \ (38.9,139] | (139,220] | 总计 |\n|---|---|---|---|\n| 0 | * 108498 | 13226 | 121724\
  \ |\n| 1 | 30521 | * 34243 | 64764 |\n| 总计 | 139019 | 47469 | 186488 |\n\n---\n\
  每列最大值：'*'\n\nPearson 卡方检验：\nX-squared = 39311, df = 1, p-value < 2.2e-16\n\n现在，查看混淆矩阵列联表——一个用于绝对计数，另一个用于相对百分比。\n\
  \n在我们的示例中，葡萄糖水平大于或等于 139 在 18% 的总病例中预测糖尿病。但是，请注意，大部分预测能力来自预测非事件。也就是说，56% 的正确预测来自小于\
  \ 139 的葡萄糖读数，这预测了糖尿病的不存在。这很有价值，因为它可能有助于确定预防糖尿病的因素，但我们可能也对能够预测糖尿病的模型的准确率感兴趣。\n\n\
  这将涉及更深入地挖掘变量之间的交互作用，并需要更复杂的算法。但是，OneR 确实为变量选择提供了一个有趣的框架。\n\n混淆矩阵（绝对计数）：\n\n| 预测\
  \ | 实际 0 | 实际 1 | 总计 |\n|---|---|---|---|\n| 0 | 108498 | 30521 | 139019 |\n| 1\
  \ | 13226 | 34243 | 47469 |\n| 总计 | 121724 | 64764 | 186488 |\n\n混淆矩阵（相对百分比）：\n\n\
  | 预测 | 实际 0 | 实际 1 | 总计 |\n|---|---|---|---|\n| 0 | 0.58 | 0.16 | 0.75 |\n| 1 |\
  \ 0.07 | 0.18 | 0.25 |\n| 总计 | 0.65 | 0.35 | 1.00 |\n\n准确率：\n0.7654 (142741/186488)\n\
  \n错误率：\n0.2346 (43747/186488)\n\n### 使用 Rpart 构建决策树\n\n虽然 OneR 非常擅长确定简单的分类规则，但它无法构建完整的决策树。但是，我们可以从\
  \ Spark 提取样本并将其路由到任何 R 决策树算法，例如 rpart。\n\n### 首先收集样本\n\n为了说明这一点，让我们首先从 stop and\
  \ frisk 数据框中提取 50% 的样本。我们还希望确保提取的数据量可以被 base R 轻松处理，base R 有取决于 CPU 大小的内存限制。\n\n\
  - 下面的代码将首先从 Spark 提取 50% 的样本，并将其存储在名为 `dflocal` 的本地 R 数据框中。\n- 然后它将运行 `str()` 命令来验证行数和元数据：\n\
  \n```\ndflocal = collect(sample(df, F, .50, 123))\nstr(dflocal)\n```\n\n输出表明有 11,311\
  \ 行，大约是 Stop and Frisk 数据中 22,563 行的 50%。\n\n```\n'data.frame': 11311 obs. of 113\
  \ variables:\n $ year  : chr \"2015\" \"2015\" \"2015\" \"2015\" ...\n $ pct   :\
  \ chr \"20\" \"20\" \"67\" \"68\" ...\n $ ser_num : int 41 39 122 9 141 2 1 5 2\
  \ 1 ...\n $ datestop: int 1292015 1292015 2062015 2142015 3142015 1012015 1012015\
  \ 1012015 1012015 1012015 ...\n $ timestop: int 1745 1745 2155 200 15 10 50 115\
  \ 229 230 ...\n $ recstat : chr \"1\" \"1\" \"A\" ...\n $ inout   : chr \"O\" \"\
  O\" \"O\" \"O\" ...\n $ trhsloc : chr \"P\" \"P\" \"P\" \"P\" ...\n $ perobs  :\
  \ int 1 1 2 1 1 2 5 1 1 ...\n $ crimsusp: chr \"MISD\" \"MISD\" \"FEL\" \"FEONY\"\
  \ ...\n $ perstop : int 16 16 5 10 15 5 45 1 5 ...\n $ typeofid: chr \"Y\" \"Y\"\
  \ \"R\" \"V\" ...\n $ explnstp: chr \"Y\" \"Y\" \"Y\" \"Y\" ...\n $ othpers : chr\
  \ \"Y\" \"Y\" \"N\" \"Y\" ...\n $ arstmade: chr \"N\" \"N\" \"N\" \"N\" ...\n $\
  \ arstoffn: chr \" \" \" \" \" \" \" \" ...\n $ sumissue: chr \"N\" \"N\" \"N\"\
  \ \"N\" ...\n $ sumoffen: chr \" \" \" \" \" \" \" \" ...\n```\n\n### 使用 Rpart 构建决策树\n\
  \n我们将把 rpart 算法作为回归树运行。请记住，当输出变量是数值形式而非名义形式时，使用回归树。在这样做之前，我们需要将 frisked=Y/N 映射为\
  \ frisked=1/0，并在调用中指定 method=\"anova\"。\n\n代码的最后一行 (fit) 将把决策规则以文本形式打印到控制台。\n\n\
  height、sex、age 和 city 参数作为主要分割出现：\n\n```\nset.seed(123)\nlibrary(rpart)\ndflocal$frisked_bin\
  \ <- ifelse(dflocal$frisked==\"Y\",1,0)\nfit <- rpart(frisked_bin ~ sex + age +\
  \ weight + height + perstop\nfit\n```\n\n\n\n\n### 绘制树图\n\n查看树的可视化表示要容易得多。因此，您需要安装\
  \ rpart.plot（如果尚未安装），以便能够查看它。\n\n可以看到，第一条规则对应于主要规则（按 Gender 拆分），该规则之前由本章的 OneR 包生成。\n\
  \n```\nchr [1:11311] \"N\" \"N\" \"Y\" \"N\" \"Y\" \"Y\" \"Y\" \"Y\" \"Y\" \"Y\"\
  \ ...\nn= 11311\n```\n\n```\nnode), split, n, deviance, yval\n* denotes terminal\
  \ node\n```\n\n```\n1) root 11311 2482.374000 0.6747414\n 2) sex=F 753  185.620200\
  \ 0.4409031\n   4) height< 65.5 418   98.988040 0.3851675  *\n   5) height>=65.5\
  \ 335   83.713430 0.5104478  *\n 3) sex=M,Z 10558 2252.643000 0.6914188\n   6) city=BROOKLYN,MANHATTAN,QUEENS,STATEN\
  \ IS 8339 1841.411000 0.6708238\n    12) age>=28.5 2908  683.906500 0.6217331  *\n\
  \    13) age< 28.5 5431 1146.745000 0.6971092  *\n   7) city=BRONX 2219  394.402000\
  \ 0.7688148\n    14) age>=60.5 26    6.346154 0.4230769  *\n    15) age< 60.5 2193\
  \  384.911100 0.7729138  *\n```\n\n```\ndevtools::install_github(\"cran/rpart.plot\"\
  )\nlibrary(rpart.plot)\nrpart.plot(fit,cex=.75)\n```\n\n```\n0.67\n100%\n\nsex =\
  \ F\nyes                 no\n\n0.44               0.69\n7%                 93%\n\
  \nheight < 66   city = BROOKLYN,MANHATTAN,QUEENS,STATEN IS\n\n0.39   0.51      \
  \     0.62   0.7     0.42   0.77\n4%     3%            26%    48%     0%    19%\n\
  \n           age >= 28       age >= 60\n```\n\n### 在 Python 中运行替代模型\n\n在此示例中，我们通过从\
  \ Spark DataFrame 提取样本并在 R 基础包中运行树模型，在 R 中运行了决策树。虽然这完全可以接受（因为它迫使您思考采样问题），但在许多情况下，直接在\
  \ Spark DataFrame 上使用 `MLlib` 包或等效工具运行模型会更高效。\n\n对于您正在使用的 Spark 版本（2.1）；决策树算法无法在\
  \ R 下运行。幸运的是，原生 Spark 决策树已经在 Python 和 Scala 中实现。我们将使用 Python 来说明示例，以便您可以看到可用的选项。如果您关注\
  \ Spark 中的算法开发，您会发现算法通常首先用 Scala 编写，因为那是 Spark 的原生语言。\n\n### 运行 Python 决策树\n\n以下是关于下面出现的\
  \ Python 决策树代码的一些说明。\n\n对于第一个代码块，请注意代码第一行中的“魔法”指令。魔法指令以 '%' 开头，并指定您将使用哪种语言或 API。因此，由于我们将使用\
  \ Python 而不是 R，需要将 `%python` 指定为第一行。这是因为笔记本最初设置为 R 笔记本。混合语言时，需要将使用的语言指定为第一行，除非您正在使用默认笔记本语言编写。\n\
  \n对于不熟悉 Python 的人，代码顶部的 import 指令导入所需的库和模块，这些库和模块将由 Python 使用，类似于 R 中使用 library\
  \ 函数。如果不提供 import 指令，通常会收到错误。\n\n### 读取 Stop and Frisk 表格\n\n第一个代码块将读取 StopFrisk\
  \ DataFrame，类似于本节前面使用 spark.sql 执行的操作。请注意，使用 Python 编写的 SQL 语法与我们之前在 R 中使用的非常相似。\n\
  \n在 SQL 调用中，结果变量 frisked 使用 CASE 语句映射为二进制变量。这样做的原因是 MLlib 算法处理整数数据比字符数据好得多。如果使用字符数据，通常需要将其映射为整数或标记点。\n\
  \n然后使用 show(5) 函数显示生成的 DataFrame（df2），这是 R 中 head(df2, 5) 函数的 Python 等效项：\n\n```\n\
  %python\nfrom pyspark.mllib.tree import DecisionTree, DecisionTreeModel\nfrom pyspark.mllib.util\
  \ import MLUtils\nimport pyspark.mllib\nimport pyspark.mllib.regression\nfrom pyspark.mllib.regression\
  \ import LabeledPoint\nfrom pyspark.sql.functions import *\nfrom pyspark.ml.feature\
  \ import StringIndexer\ndf2 = spark.sql(\"SELECT case when frisked='Y' THEN 1 else\
  \ 0 END a\ndf2.show(5)\n```\n\n|frisked|sex|race|age|weight|\n|---|---|---|---|---|\n\
  | 1| 0| W| 33| 190|\n| 1| 0| B| 14| 140|\n| 0| 0| B| 14| 140|\n| 0| 0| B| 14| 180|\n\
  | 0| 0| B| 13| 160|\n\n### 索引分类特征\n\n索引用于优化数据访问，并以可接受的格式向特定机器学习算法提供参数。\n\n我们将把 race\
  \ 变量纳入决策树模型，因此第一步是确定 race 的不同值有哪些。我们将再次使用 SQL 按 race 统计频率。请注意，可以说 \"Group by Race\"\
  \ 或 \"Group by 1\"，这是对 select 语句中指定的第一列（即 race）的简写引用：\n\n```\n%python\ndfx = spark.sql(\"\
  SELECT race,count(*) FROM stopfrisk group by 1\")\ndfx.show()\n```\n\n请注意，有八个值：Q、B、U、Z、A、W、I\
  \ 和 P：\n\n| race | count(1) |\n|---|---|\n| Q | 5090 |\n| B | 11950 |\n| U | 122\
  \ |\n| Z | 298 |\n| A | 1103 |\n| W | 2514 |\n| I | 77 |\n| P | 1409 |\n\n接下来，使用\
  \ `indexer.fit(df2) transform`。这将把字符因子（`race`）映射为数字索引（`race_indexed`）：\n\n```\n\
  %python\nindexer = StringIndexer(inputCol=\"race\", outputCol=\"race_indexed\")\n\
  df3 = indexer.fit(df2).transform(df2)\n```\n\n```\ndf3.show(15)\n#drop race for\
  \ the final dataframe\ndf4 = df3.drop(\"race\")\n```\n\n查看 `race` 和 `race_indexed`\
  \ 的对，以了解数字将如何替代字符：\n\n### (2) Spark 作业\n\n| frisked2 | sex2 | race | age | weight\
  \ | race_indexed |\n|---|---|---|---|---|---|\n| 1 | 0 | W | 33 | 190 | 2.0 |\n\
  | 1 | 0 | B | 14 | 140 | 0.0 |\n| 0 | 0 | B | 14 | 140 | 0.0 |\n| 0 | 0 | B | 14\
  \ | 180 | 0.0 |\n| 0 | 0 | B | 13 | 160 | 0.0 |\n| 0 | 0 | W | 13 | 130 | 2.0 |\n\
  | 1 | 0 | B | 25 | 160 | 0.0 |\n| 1 | 0 | B | 15 | 150 | 0.0 |\n| 1 | 0 | B | 23\
  \ | 160 | 0.0 |\n| 0 | 0 | W | 36 | 150 | 2.0 |\n| 1 | 0 | B | 30 | 160 | 0.0 |\n\
  | 1 | 0 | B | 18 | 160 | 0.0 |\n| 1 | 0 | Q | 48 | 160 | 1.0 |\n| 1 | 0 | B | 16\
  \ | 160 | 0.0 |\n| 1 | 0 | B | 26 | 155 | 0.0 |\n\n仅显示前 15 行\n\n我们只是查看输出的少量记录。我们真正想看到的是\
  \ race 的所有值及其计数。我们可以使用 PySpark SQL 中的 CountDistinct 子句来获取该信息：\n\n```\n%python\n\
  df3.registerTempTable(\"df3\")\n```\n\n```\n#### Perform the same query as the DataFrame\
  \ above and return `expl\ncountDistinctDF_sql = sqlContext.sql(\"SELECT race, race_indexed,\
  \ c\ncountDistinctDF_sql.show()\n```\n\n### (5) Spark 作业\n\n| race | race_indexed\
  \ | count(race) |\n|---|---|---|\n| W | 2.0 | 2514 |\n| B | 0.0 | 11950 |\n| P |\
  \ 3.0 | 1409 |\n| Z | 5.0 | 298 |\n| Q | 1.0 | 5090 |\n| A | 4.0 | 1103 |\n| I |\
  \ 7.0 | 77 |\n| U | 6.0 | 122 |\n\n我们仍然需要一本码本来解码 race 的值，以确保我们了解它们所代表的含义。\n\n```\n\
  race\nA          ASIAN/PACIFIC ISLANDER\nB          BLACK\nI          AMERICAN INDIAN/ALASKAN\
  \ NATIVE\nP          BLACK-HISPANIC\nQ          WHITE-HISPANIC\nW          WHITE\n\
  X          UNKNOWN\nZ          OTHER\n```\n\n### 映射到 RDD\n\n我们将使用的决策树算法来自标准 Spark\
  \ MLlib 库。此实现要求输入格式化为标记点格式。标记点有助于指定哪些变量是目标变量，哪些是特征。\n\n在此示例中，目标变量（frisked2）是列出的第一个变量（我们将第一个变量称为列\
  \ 0），因此目标变量在 LabeledPoint 调用中指定为 line[0]。\n\n自变量（或特征）包含在其余列中，并指定为 line[1:]。这是列 1\
  \ 及之后所有列的简写，直到没有更多列为止。\n\n\n\n\n\n在模型中引用特征时，它们也按顺序编号，对应其在数据框中出现的顺序。对于我们的模型，它们的命名如下：\n\
  \n- 特征 0 - 性别\n- 特征 1 - 年龄\n- 特征 2 - 体重\n- 特征 3 - 种族\n\n由于这是一个基于 RDD 的模型，首先使用标记点将数据框映射到\
  \ RDD，先指定目标变量，然后是特征：\n\n```\n%python\nrdd1 = df4.rdd.map(lambda line:LabeledPoint(line[0],[line[1:]]))\n\
  ```\n\n打印生成的 RDD 的一部分。调试 RDD 的输出可能比较困难；然而，您可以从输出中看到，每个标记点的第一个键值对是 1 或 0。第二个键值对（括号内）是特征向量，您可以将其与预测器进行匹配并仔细检查，以确保您的标记点正确：\n\
  \n```\nprint rdd1.take(5)\n```\n\n```\n(1) Spark Jobs\n[LabeledPoint(1.0, [0.0,\
  \ 33.0, 190.0, 2.0]), LabeledPoint(1.0, [0.0,\n```\n\n### 指定决策树模型\n\n还记得我们讨论过的分类特征映射吗？使用分类特征信息参数来指定哪些变量是真正的分类变量，也就是说，不仅仅是映射到索引。\n\
  \n在我们的示例中，Frisked 有两个级别，因此指定为 0:2（具有 2 个级别的目标变量），而 Race 有 8 个级别，因此指定为 3:8（具有 8 个级别的第三个特征）：\n\
  \n设置适合决策树模型的其他参数：\n\n- numClasses：这适用于结果的数量；在我们的例子中，它是 2。\n- maxDepth：您希望决策树有多深？为了说明目的，我们将其设置为\
  \ 2 层深，但对于实际问题，您应该尝试更深一些。请记住，如果太深，模型会过拟合。\n- maxBins：在 sparkR 中，您最多只能有 32 个桶。\n\n\
  现在一切就绪，我们可以运行模型了。我们将创建一棵简单的树，深度不超过两层：\n\n```\n%python\nmodel_train = DecisionTree.trainClassifier(rdd1,numClasses=2,maxDepth=2,\
  \ categoricalFeaturesInfo={0:2,3:8})\n```\n\n模型完成后，使用 DebugString() 函数将其打印为文本文件。这将为您提供决策树规则：\n\
  \n```\nprint(model_train.toDebugString())\n```\n\n```\n(6) Spark Jobs\nDecisionTreeModel\
  \ classifier of depth 2 with 7 nodes\nIf (feature 0 in {1.0})\nIf (feature 2 <=\
  \ 154.0)\nPredict: 0.0\nElse (feature 0 > 154.0)\nPredict: 1.0\nElse (feature 0\
  \ not in {1.0})\nIf (feature 3 in {5.0,6.0,2.0,7.0,3.0,4.0})\nPredict: 1.0\nElse\
  \ (feature 3 not in {5.0,6.0,2.0,7.0,3.0,4.0})\nPredict: 1.0\n```\n\n为了对特征 0、1、2\
  \ 和 3 的含义进行编码，我们需要使用之前运行过的代码本和 SQL 代码，将特征编号映射到特征名称，并映射特征的生成值。\n\n由于决策树输出有时会给出无意义或冗余的规则，我们可以手动将输出浓缩为简单的英文描述。试着在前面的代码中发现这个问题！\n\
  \n```\nIf sex is equal to 1 (Female)\n    if weight <= 154 then subject was NOT\
  \ frisked\n    Else if weight > 154 then Subject WAS frisked\nIf sex is NOT equal\
  \ to 1 (Male)\n    BOTH race paths lead to Subject WAS frisked\n```\n\n### 生成更大的树\n\
  \n有时，对于小树，决策规则可能过于琐碎或显而易见。在这种情况下，增加树中的节点数量通常是有意义的。这里我们将生成一棵 15 层深的树：\n\n```\n%python\n\
  rdd1 = df4.rdd.map(lambda line:LabeledPoint(line[0],[line[1:]]))\nrdd1.take(15)\n\
  model_train = DecisionTree.trainClassifier(rdd1,numClasses=2,maxDepth=2)\nprint(model_train.toDebugString())\n\
  ```\n\n同样，一些规则看起来是冗余的，因此需要更多工作来将此输出转换为有意义的业务规则。\n\n```\nDecisionTreeModel classifier\
  \ of depth 15 with 4291 nodes\nIf (feature 0 in {1.0})\nIf (feature 2 <= 154.0)\n\
  If (feature 1 <= 54.0)\nIf (feature 2 <= 129.0)\nIf (feature 1 <= 37.0)\nIf (feature\
  \ 3 in {5.0,1.0,6.0,2.0,3.0,4.0})\nIf (feature 1 <= 23.0)\nIf (feature 3 in {4.0})\n\
  If (feature 1 <= 16.0)\nIf (feature 1 <= 15.0)\nPredict: 0.0\nElse (feature 1 >\
  \ 15.0)\nPredict: 1.0\nElse (feature 1 > 16.0)\nIf (feature 1 <= 22.0)\nIf (feature\
  \ 1 <= 18.0)\nIf (feature 1 <= 17.0)\nPredict: 0.0\nElse (feature 1 > 17.0)\nIf\
  \ (feature 2 <= 117.0)\n```\n\n### 可视化树\n\n除非您能可视化输出，否则决策树规则可能难以解释。除非您用 Scala 语言实现决策树（该语言具有使用\
  \ databricks `Display` 命令的树可视化方法），否则您的一些选择是：\n\n首先将 Spark 输出对象解析为 JSON 格式，然后使用 `D3.js`\
  \ 输入以可视化树。Github 上有一些预构建的包可以帮助您完成此操作。\n\n将您创建的 RDD 写入文件，在 Scala 中输入 RDD，并运行 `DecisionTreeClassifier()`。然后，拟合模型并在模型上使用\
  \ databricks display 命令来显示树。\n\n### 比较训练和测试决策树\n\n决策树没有预测方法。但是，我们仍然可以从测试数据集和训练数据集生成树并将其进行比较以检查合理性。\n\
  \n使用我们的糖尿病示例，我们可以首先在训练数据上运行一个 Pyspark 决策树。同样，我们的结果变量是第一列（#0），在 LabeledPoint 引用中被引用，特征由所有后续变量（1：）指定：\n\
  \n```\n%python\ndf = spark.sql(\"SELECT outcome, age, mass, triceps, pregnant, glucose\"\
  )\n#sqlDF.show()\nrdd1 = df.rdd.map(lambda line:LabeledPoint(line[0],[line[1:]]))\n\
  model_train = DecisionTree.trainClassifier(rdd1,numClasses=2,maxDepth=2,maxBins=32,\
  \ categoricalFeaturesInfo={})\nprint(model_train.toDebugString())\n```\n\n决策树已将特征\
  \ 4（葡萄糖）和特征 6（胰岛素）确定为两个最重要的分割变量。这两个变量是不错的选择，因为它们都影响血糖水平：\n\n```\n> (6) Spark Jobs\n\
  DecisionTreeModel classifier of depth 2 with 7 nodes\nIf (feature 4 <= 144.2881556590044)\n\
  If (feature 6 <= 244.2896167908184)\nPredict: 0.0\nElse (feature 6 > 244.2896167908184)\n\
  Predict: 1.0\nElse (feature 4 > 144.2881556590044)\nIf (feature 6 <= 233.49668637807514)\n\
  Predict: 1.0\nElse (feature 6 > 233.49668637807514)\nPredict: 1.0\n```\n\n现在，在测试数据上运行相同的代码。结果相似；但是，树反转了特征\
  \ 6 和 4 的顺序。在现实世界中这是可以接受的，但如果我们生成了完全不同的树，我们需要查看两个模型为何不同，并尝试调和模型的不同版本。如果您无法解释差异，如果存在巨大差异，您可能需要重新处理甚至放弃模型：\n\
  \n```\n%python\ntest = spark.sql(\"SELECT outcome, age, mass, triceps, pregnant,\
  \ glucose\")\nrdd2 = test.rdd.map(lambda line:LabeledPoint(line[0],[line[1:]]))\n\
  model_test = DecisionTree.trainClassifier(rdd2,numClasses=2,maxDepth=2, categoricalFeaturesInfo={})\n\
  #model.save(spark, \"/myDecisionTreeClassificationModel\")\nprint(model_test.toDebugString())\n\
  ```\n\n(6) Spark Jobs\n\n```\nDecisionTreeModel classifier of depth 2 with 7 nodes\n\
  If (feature 6 <= 258.7717216438844)\nIf (feature 4 <= 134.95577326132448)\nPredict:\
  \ 0.0\nElse (feature 4 > 134.95577326132448)\nPredict: 1.0\nElse (feature 6 > 258.7717216438844)\n\
  If (feature 6 <= 303.47523507134343)\nPredict: 1.0\nElse (feature 6 > 303.47523507134343)\n\
  Predict: 1.0\n```\n\n## 总结\n\n至此，本章和本书结束。我一开始就说，这是一本不同于以往的预测分析书籍，我从技术和概念两个角度，涵盖了许多不同的主题。希望您从中学到了很多，它为您提供了一些可用的新算法，并让您了解了一些“旧”工具，例如\
  \ SQL，它们非常有能力完成有时需要的繁重工作。我也试图强调“小数据”、元数据和采样，希望这能帮助您更好地理解数据，仅仅因为能够单独查看单个部分。我还希望本书中的一些材料能让您与拥有不同技能的团队成员协作。这可能包括代码优化专家、统计学专家，甚至是与贵企业所有关键人员合作过并能够传达业务需求和愿望的人。当然，样样精通很棒，但预测分析既关乎倾听，也关乎行动。\n\
  \n我所讨论的大部分内容适用于您将参与的任何类型的分析项目，无论选择何种语言或平台。这就是为什么我想在最后包含一些云计算和 SQL 示例，以及一个 Python\
  \ 示例，以证明预测分析从业者可以凭借不同的技能集聚在一起，将他们的工作整合到本书前面讨论的 6 个步骤中，以实施成功的分析方法论和框架。\n\n建模愉快！\n\
