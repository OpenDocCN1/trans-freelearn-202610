  \ SVM。\n\n这意味着我们将使用线性超平面将高维文本空间中的数据分隔为不同段：\n\n```r\n### train a SVM Model\nmodel\
  \ <- train_model(container, \"SVM\", kernel=\"linear\", cost=\nstr (model)\nhead\
  \ (model)\nsummary (model)\n```\n\nsummary 模型的输出如下；创建了 349 个支持向量，用于将数据分为三个类：\n\n\
  ```\nCall:\nsvm.default(x = container@training_matrix, y = container@training\n\
  \    method = method)\n\nParameters:\n    SVM-Type:  C-classification\n    SVM-Kernel:\
  \  linear\n        cost:  1\n        gamma:  9.832842e-05\n\nNumber of Support Vectors:\
  \  349\n\n ( 189 143 17 )\n\nNumber of Classes:  3\n\nLevels:\nCan't repay my loan\
  \ Dealing with my lender or servicer Getting\n```\n\n现在数据已经训练完毕，我们将使用接下来的 500 条观测值进行测试，以查看模型的表现。与我们对训练数据所做的类似，我们将为测试数据创建一个\
  \ TDM，但使用与训练数据相同的标签或术语：\n\n```r\npredictionData <- data$Consumer.complaint.narrative[501:1000]\n\
  \n### create a prediction document term matrix\npredMatrix <- create_matrix(predictionData,\
  \ originalMatrix=dtMatrix)\n\n### create the corresponding container\n\nplength\
  \ = length(predictionData);\npredictionContainer <- create_container(predMatrix,\
  \ labels=rep(0,\n```\n\n为了查看模型的表现，我们将使用分类模型函数根据模型对测试数据集进行评分。然后，我们将根据问题类型和平均 SVM\
  \ 概率对数据进行汇总。如输出所示，模型在对“与我的贷款人或服务商打交道”进行分类时表现最佳，而对“获得贷款”的识别效果不佳。所有这些都为贷款人提供了有价值的信息，因为我们现在可以看到来电者讨论了哪些类型的主题：\n\
  \n```r\n### predict\nresults <- classify_model(predictionContainer, model)\nhead(results)\n\
  aggregate(results$SVM_PROB, by=list(results$SVM_LABEL), FUN=mean,\n> head(results)\n\
  ```\n\n输出在控制台中显示如下：\n\n```\n     SVM_LABEL SVM_PROB\n1 Dealing with my lender or\
  \ servicer 0.5436438\n2 Dealing with my lender or servicer 0.7521835\n3 Dealing\
  \ with my lender or servicer 0.5153998\n4 Dealing with my lender or servicer 0.7611152\n\
