  \ | 32.442846279285206 | 6.874555211563171 |\n\n### 将均值和标准差与测试数据连接\n\n与前面的代码类似，我们分别将均值和标准差连接到测试数据集。\n\
  \n检查创建的行数。如果要查看实际结果，请像上面使用训练数据一样打印部分数据：\n\n```\ntest_means <- crossJoin(test,both)\n\
  nrow(test_means)\n```\n\n> (3) Spark 作业\n\n[1] 298000\n\n### 数据标准化\n\n我们现在拥有标准化数据所需的所有统计量。回顾一下，标准化变量\
  \ x 的公式如下：\n\n(x - mean(x)) / std(x)\n\n为了实现这一点，我们将所需的计算封装到一个函数中，并对训练数据集和测试数据集都调用它：\n\
  \n- 使用 SparkR `selectExpr` 表达式根据上述公式计算每个变量的标准化版本。\n- 另外，创建一个在名称中附加 old 的新变量，以保留变量的原始值。测试后，应删除这些额外变量以节省空间，但在调试时保留它们是有好处的：\n\
  \n```\nnormalize_it <- function (x) {\nselectExpr(x,\n\"age as ageold\",\"(age-age_mean)\
  \ / age_std as age\",\n\"mass as massold\",\"(mass-mass_mean) / mass_std as mass\"\
  ,\n\"triceps as tricepsold\",\"(triceps-triceps_mean) / triceps_std as triceps\"\
  ,\n\"pressure as pressureold\",\"(pressure-pressure_mean) / pressure_std as pressure\"\
  ,\n\"pedigree as pedigreeold\",\"(pedigree-pedigree_mean) / pedigree_std as pedigree\"\
  ,\n\"glucose as glucoseold\",\"(glucose-glucose_mean) / glucose_std as glucose\"\
  ,\n\"pregnant as pregnantold\",\"(pregnant-pregnant_mean) / pregnant_std as pregnant\"\
  ,\n\"insulin as insulinold\",\"(insulin-insulin_mean) / insulin_std as insulin\"\
  \n)\n}\n```\n\n首先，为 `test` 数据集调用该函数：\n\n```\ntest_normal <- normalize_it(test_means)\n\
  ```\n\n接下来，为训练数据集进行标准化：\n\n```\ndf_normal <- normalize_it(df_means)\n```\n\n## 显示输出\n\
