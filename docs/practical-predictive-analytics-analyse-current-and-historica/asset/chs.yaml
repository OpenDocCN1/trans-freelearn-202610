  \n```\nsetwd(\"C:/PracticalPredictiveAnalytics/Data\")\nsave(df,file=\"pain_raw.Rda\"\
  )\n```\n\n### 拟合GLM模型\n\n现在我们将使用glm包拟合一个逻辑模型。逻辑回归通常预测1事件的概率，因此请确保1事件对应您想要预测的内容。当变量编码为1表示不存在或不存在等负面条件时，常常会产生一些混淆。对于我们的模型，Pain=1表示疼痛减轻。请务必将family=\"\
  binomial\"指定为一个选项，因为这告诉GLM您将运行一个逻辑模型：\n\n```\nPainGLM <- glm(Pain ~ Treatment +\
  \ Gender + Age + Duration, data=df)\n```\n\nsummary函数将列出系数（Estimate），以及标准误、标准化z值和p值。p值（最后一列）中带有星号（*或**）的通常指定显著变量，通常也是您首先应该查看的变量。但是，请尽量不要自动只查看带有星号的变量。您应该查看所有变量的系数和统计量，因为p值不应被视为绝对数字，尤其是在涉及人们健康时：\n\
  \n```\nsummary(PainGLM)\n```\n\n这将生成以下输出：\n\n```\nCall:\nglm(formula = Pain ~ Treatment\
  \ + Gender + Age + Duration, family\ndata = df)\n```\n\nDeviance Residuals:\nMin\
