  \n重置 `graphics` 参数。输出将显示 `null device`，指示其已重置：\n\n```\ndev.off()\n> null device\n\
  > 1\n```\n\n### 查找关联规则\n\n如前所示，关联规则是使用 `apriori()` 函数运行的。\n\n`apriori()` 函数具有多个筛选参数，用于控制生成的规则数量。在我们的示例中，我们将指定规则要被考虑所需通过的最小支持度和置信度阈值。\n\
  \n传递给 apriori 的数字取决于你想如何查看规则。它可以是初步筛选，也可以在进行多轮之后进行深入分析。但通常，如果我们想要更多规则，可以减小 `support`\
  \ 和 `confidence` 参数。如果我们想关注出现频繁的项目，则提高支持度阈值。如果我们想专注于更高质量、更准确的规则，则会提高置信度水平。\n\n这些数字不是绝对的。它们是你可以调整的数字，以限制你将要查看的规则数量，与它们的质量相权衡。\n\
  \n通常会指定 `minlen = 2` 参数，以保证规则左侧包含项集：\n\n```\nrulesx <- apriori(trans4, parameter\
  \ = list(minlen = 2, support =\n> Apriori\n> Parameter specification:\n> confidence\
  \ minval smax arem aval originalSupport support min\n> 0.01 0.1 1 none FALSE TRUE\
  \ 0.02\n> target ext\n> rules FALSE\n> Algorithmic control:\n> filter tree heap\
  \ memopt load sort verbose\n> 0.1 TRUE TRUE FALSE TRUE 2 TRUE\n> Absolute minimum\
  \ support count: 272\n> set item appearances ...[0 item(s)] done [0.00s].\n> set\
  \ transactions ...[13 item(s), 13617 transaction(s)] done [0\n> sorting and recoding\
  \ items ... [13 item(s)] done [0.00s].\n> creating transaction tree ... done [0.00s].\n\
  > checking subsets of size 1 2 3 4 5 done [0.00s].\n> writing ... [829 rule(s)]\
  \ done [0.00s].\n> creating S4 object ... done [0.00s].\n```\n\napriori 算法的输出将告诉我们生成了多少条规则。如果你还对\
  \ rulesx 执行 str() 函数，它将显示 rulesx 对象中包含的所有子列表，这可能会变得复杂。通常，输出足以分析规则，但这些子列表可以在循环中变化参数时以编程方式用于打印生成的规则数量。在我们的示例中，打印其中一个子列表的第二列\
  \ (rulesx@lhs@data@Dim[2]) 显示此处已生成 829 条规则。这是一个可以管理的规则数量，可以查看：\n\n```\nstr(rulesx)\n\
