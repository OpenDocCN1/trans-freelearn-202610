  \ 377\n15 FEMALE ALL AGES 130200.9 150329.7 2012 2012 158780.9 136315.1\n#\nsave(x3,\
  \ file = \"x3.RData\")\n```\n\n\n\n## 使用 lattice 绘制数据\n\n`lattice` 包是一个值得学习的有用包，尤其是喜欢使用公式表示法（y~x）的分析师。\n\
  \n在此示例中，我们将运行一个 lattice 图，以便在 `y-axis` 上绘制 `Not.Covered.Pct`，在 `x-axis` 上绘制 `Year`，并按类别生成单独的图表。\n\
  \n主调用如下所示：\n\n```\nxyplot(Not.Covered.Pct ~ Year | cat, data = x3)\n```\n\n由于我们要绘制前\
  \ 10 个组，可以指定 `layout=c(5, 2)` 表示我们希望将 10 个图表排列成 5×2 矩阵。`Not.Covered.Pct` 将排列在 `y\
  \ axis` 上（~ 符号的左侧），`Year` 将沿 `x-axis` 排列（~ 符号的右侧）。竖线（`|`）表示数据将按每个类别单独绘制：\n\n```\n\
  library(lattice)\nx.tick.number <- 14\nat <- seq(1, nrow(x3), length.out = x.tick.number)\n\
  labels <- round(seq(1999, 2012, length.out = x.tick.number))\n\np <- xyplot(Not.Covered.Pct\
  \ ~ Year | cat, data = x3, type = \"l\",\n    cex = 1, par.strip.text = list(cex\
  \ = 0.5), scales = list(x = list(cex = 0.4, rot = 45)), layout = c(5, 2))\n\ntrellis.device()\n\
  \nprint(p)\n```\n\n## 按类别划分的参保人数\n\n未覆盖百分比\n\n年份\n\n![](img/672c0cf8ba3c000a6529b117ed96945e_456_0.png)\n\
  \n## 使用 ggplot 绘制数据\n\n如果您喜欢使用 ggplot，可以使用 facets 渲染一组类似的图表：\n\n```\nrequire(\"\
  ggplot2\")\n\n.df <- data.frame(x = x3$Year.1, y = x3$Not.Covered.Pct, z = x3$cat)\n\
  df <- .df[order(.df$x), ]\n.plot <- ggplot(data = .df, aes(x = x, y = y, colour\
  \ = z, shape = z))\n+ geom_point()\n+ geom_line(size = 1)\n+ scale_shape_manual(values\
  \ = seq(0, 15))\n+ scale_y_continuous(expand = c(0.01, 0))\n+ facet_wrap(~z)\n+\
  \ xlab(\"Year.1\")\n+ ylab(\"Not.Covered.Pct\")\n+ labs(colour = \"cat\", shape\
  \ = \"cat\")\n+ theme(panel.margin = unit(0.3, \"lines\"), legend.position = \"\
  none\")\nprint(.plot)\n```\n\n![](img/672c0cf8ba3c000a6529b117ed96945e_458_0.png)\n\
  \n## 将输出发送到外部文件\n\n将图表分配给图表对象的一个好处是，您可以稍后将图表发送到外部文件（例如 PDF），在外部查看，甚至可以直接从 R 在浏览器中查看。例如，对于\
  \ lattice 图示例，您可以使用 `trellis.device` 并指定输出参数，然后打印该对象。如前一章所示，您可以使用 `browseURL` 在浏览器中打开\
  \ PDF：\n\n```\n### send to pdf\nsetwd(\"C:/PracticalPredictiveAnalytics/Outputs\"\
  )\ntrellis.device(pdf, file = \"x3.pdf\")\nprint(p)\ndev.off()\n#NOT run\n#browseURL('file:///c:///PracticalPredictiveAnalytics/Outputs//x3.pdf')\n\
  ```\n\n## 检查输出\n\n如果我们检查前面的图表，可以发现有些群体的趋势比其他群体更明显。例如，18 岁以下年龄组显示出下降的入学趋势，而 25-54\
  \ 岁年龄组则呈上升趋势。\n\n## 检测线性趋势\n\n在线性趋势模型中，通过对数据点运行 `lm()` 回归来构建线性回归最小二乘线。这些模型适合最初直观地探索趋势。我们可以利用\
  \ base R 中提供的 `lm()` 函数，专门计算趋势线的斜率。\n\n例如，前 14 行显示整个总体组（ALL AGES）的数据。我们可以针对编号为 1-14\
  \ 的每一年对 Not.Covered.Pct 运行回归，并看到 Year.1 变量的系数为正，表明随着时间推移，未覆盖百分比呈线性增加。我们还可以将 lm()\
  \ 函数包装在 coef() 函数中，从而单独查看系数输出。\n\n使用 `lm()` 函数运行回归后，我们可以随后使用 `coef` 函数从 `lm` 模型中专门提取斜率和截距。\n\
  \n由于这是一个只有一个自变量（`Time`）的回归，因此只会有一个系数：\n\n```\nlm(Not.Covered.Pct ~ Year.1, data\
  \ = x2[1:14, ])\n>\n> Call:\n> lm(formula = Not.Covered.Pct ~ Year.1, data = x2[1:14,\
  \ ])\n>\n> Coefficients:\n> (Intercept)      Year.1\n>  -4.102621    0.002119\n\
  coef(lm(Not.Covered.Pct ~ Year.1, data = x2[1:14, ]))\n> (Intercept)      Year.1\n\
  > -4.102621443  0.002119058\n```\n\n## 自动化回归\n\n现在我们已经了解了如何运行单个时间序列回归，可以继续实现对所有类别的单独回归进行自动化，并提取系数。\n\
  \n实现此目的有多种方法。一种方法是使用 `dplyr` 包中的 `do()` 函数。事件顺序如下：\n\n- 数据首先按类别分组。\n- 然后，针对每个类别运行线性回归（`lm()`\
  \ 函数），以 `Year` 作为自变量，`Not.Covered.Pct` 作为因变量。这一切都包装在 `do()` 函数中。\n- 从模型中提取系数。系数将充当趋势方向和幅度的代理。\n\
  - 最后，创建一个列表数据框（`fitted.models`），用于存储每个类别回归运行的系数和截距。系数最高为正的类别表现出最大的线性上升趋势，而下降趋势则由负系数表示：\n\
  \n```\nlibrary(dplyr)\nfitted_models = x2 %>%\n  group_by(cat) %>%\n  do(model =\
  \ coef(lm(Not.Covered.Pct ~ Year.1, data = .)))\n```\n\n所有生成的模型现在都位于 `fitted_models`\
  \ 对象中。\n\n`knitr` 包中的 `kable` 函数提供简单输出，将截距显示为第一个数字，并将模型列中的系数显示出来。作为检查，我们可以看到，ALL\
  \ AGES 模型中的系数与前一部分推导出的系数相同：\n\n```\nlibrary(knitr)\nkable(fitted_models)\n```\n\n\
  | 类别 | 模型 |\n| --- | --- |\n| 18 至 24 岁 | -0.4061834427, 0.0003367988 |\n| 25 至\
  \ 34 岁 | -11.375187597, 0.005796182 |\n| 35 至 44 岁 | -10.916822084, 0.005534037\
  \ |\n| 45 至 54 岁 | -11.544566448, 0.005829194 |\n| 55 至 64 岁 | -4.709612146, 0.002409908\
