  \ + 英寸。出于我们的目的，无需分别保留英尺高度和英寸高度的变量：以下是 str() 输出的第一页。请注意，ser_num、datestop、timestop、perobs\
  \ 和 perstop 已映射为整数。\n\n```\n'SparkDataFrame': 113 variables:\n$ year : chr \"2015\"\
