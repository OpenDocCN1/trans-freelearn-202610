  \ |\n\n## 将数据拆分为训练集和测试集\n\n继续创建我们的测试集和训练集。目标是将 80% 的数据用于训练集，20% 的数据用于测试集。\n\n为加快采样速度，我们可以按顺序采样\
  \ `sample_bin` 范围的两端作为测试数据集，然后使用中间部分作为训练数据。这仍然是随机采样，因为 `sample_bin` 最初是随机生成的，数字的序列或范围不影响随机性。\n\
  \n## 生成训练数据集\n\n由于我们希望 80% 的数据为训练数据，首先获取所有介于高截止值和低截止值之间的 `sample_bin` 数字。我们可以将截止范围定义为\
  \ `sample_bin` 最高值和最低值之差的 20%。\n\n将低截止值设置为先前定义的最低值加上截止范围，将高截止值设置为最高值减去截止范围：\n\n\
  ```\n#compute the minimum and maximum values of sample bin\nset.seed(123)\nsample_bin_min\
  \ <- as.integer(collect(select(out_sd, min(out_sd$sample_bin))))\nsample_bin_max\
  \ <- as.integer(collect(select(out_sd, max(out_sd$sample_bin))))\nCutoff <- .20*(sample_bin_max\
  \ - sample_bin_min)\nCutoff_low <- sample_bin_min + Cutoff\nCutoff_high <- sample_bin_max\
  \ - Cutoff\nrm(df)\n#take 80% of the training samples. These happens to be the ones\n\
  df <- filter(out_sd, out_sd$sample_bin > Cutoff_low & out_sd$sample_bin < Cutoff_high)\n\
  ```\n\n```\ntrain_sumdf = summary(df)\n```\n\n使用 databricks `display` 命令中的 Spark\
  \ `select()` 函数打印一些关键字段。请注意，以这种方式打印摘要对象时，始终会有五行（`count`、`mean`、`sdev`、`min` 和 `max`）以及每个变量的一列：\n\
