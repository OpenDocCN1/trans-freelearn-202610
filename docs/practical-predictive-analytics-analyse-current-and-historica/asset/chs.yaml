  file.show('demo_single') #not run\n```\n\n### 将事务文件读回内存\n\n使用 read.transaction 文件将分隔文件读回内存，格式化为事务文件。这与我们之前将数据框强制转换为事务文件的结果相同。\n\
  \n不同之处在于，事务按每行一个事务的格式排列，由 format='single' 选项指定。我们还通过 cols 选项指定 TransactionID 和物品描述的位置。可以有多个描述符和事务\
  \ ID，并通过 cols 选项对其进行标识。sep 关键字指定分隔符，在此情况下为 ! 字符。还有一个删除重复事务的选项，这是一个逻辑值，用于确定是否要消除重复项。\n\
