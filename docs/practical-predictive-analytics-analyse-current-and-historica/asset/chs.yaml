  \ | 27.2 | 28.1 | 31.0 |\n| 168 | 191 | 137 | 141 | 40.0 | 74.4 | 35.0 | 32.8 |\
  \ 43.1 | 35.7 |\n| 129 | 129 | 116 | 109 | 74.0 | 70.4 | 27.2 | 27.2 | 25.6 | 31.0\
  \ |\n| 88 | 191 | 78 | 141 | 58.0 | 74.4 | 32.0 | 32.8 | 31.0 | 35.7 |\n| 129 |\
  \ 129 | 115 | 109 | 70.4 | 70.4 | 27.2 | 27.2 | 35.3 | 31.0 |\n| 543 | 328 | 197\
