  ### 查找频繁术语\n\ntm 包有一个名为 findFreqTerms 的有用函数，可用于查找常用术语的频率。函数的第二个参数将结果限制为具有指定最小频率的术语。我们还可以通过对\
  \ TDM 中每个术语的 1 和 0 求和来计算出现次数。然后，我们可以对列表进行排序，并显示最高和最低频率的出现情况：\n\n```\ndata.frame(findFreqTerms(dtms,\
  \ 10000, Inf))\n> findFreqTerms.dtms.\n> 1 cake\n> 2 christmas\n> 3 design\n> 4\
  \ heart\n> 4 metal\n> 5 metal\n> 6 retrospot\n> 7 vintage\nfreq <- colSums(as.matrix(dtms))\n\
  #### there are xx terms\nlength(freq)\n> [1] 62\nord <- order(freq)\n#### look at\
  \ the top and bottom number of terms\nfreq[head(ord, 12)]\n> union skill zinc bird\
  \ wood wall birthday\n> 2752 2770 2837 2974 2993 3042 3069\n> colour charlotte star\
  \ antique silver\n> 3089 3114 3121 3155 3175\nfreq[tail(ord, 10)]\n> hanging sign\
  \ lu\n> 8437 8580 9107 10478 10623 12534 14884\n> vintage retrospot heart\n> 16755\
  \ 17445 19520\n```\n\n为了演示目的，条形图也有助于显示相对频率：\n\n```\nbarplot(freq[tail(ord, 10)],\
  \ cex.names = 0.75, col = c(\"blue\"))\n```\n\n最流行的术语是 heart：\n\n![](img/672c0cf8ba3c000a6529b117ed96945e_422_0.png)\n\
