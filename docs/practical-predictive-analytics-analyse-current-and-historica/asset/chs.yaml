  \n```\nplotsurv(ChurnStudy$factorC,c(1:6),c('none'))\ntitle(main = \"4 KM Curve\
  \ Gender*Education\")\n#\ndev.copy(jpeg,'Ch5 - 4 KM Curve Gender Education.jpg');\n\
  dev.off()\n```\n\n![](img/672c0cf8ba3c000a6529b117ed96945e_309_0.png)\n\n调用 survdiff()\
  \ 函数以查看曲线之间是否存在显著差异。survdiff() 函数的输出如下所示：\n\n```\noptions(scipen=3)\nsurvdiff(SurvObj\
  \ ~ ChurnStudy$factorC, data = ChurnStudy)\n#\n#\n> survdiff(SurvObj ~ ChurnStudy$factorC,\
  \ data = ChurnStudy)\nCall:\nsurvdiff(formula = SurvObj ~ ChurnStudy$factorC, data\
  \ = ChurnStudy)\n```\n\n| 类别 | N | 观察值 | 期望值 | (O-E)^2/E |\n|---|---|---|---|---|\n\
  | ChurnStudy$factorC=Bachelor's Degree.F | 279 | 111 | 150.49 | 10.3 |\n| ChurnStudy$factorC=Doctorate\
  \ Degree.F | 22 | 8 | 8.21 | 0.0 |\n| ChurnStudy$factorC=Master's Degree.F | 40\
  \ | 18 | 18.81 | 0.0 |\n| ChurnStudy$factorC=Bachelor's Degree.M | 907 | 481 | 444.28\
  \ | 3.0 |\n| ChurnStudy$factorC=Doctorate Degree.M | 66 | 37 | 37.16 | 0.0 |\n|\
  \ ChurnStudy$factorC=Master's Degree.M | 174 | 96 | 92.05 | 0.1 |\n\nChisq= 16.3，自由度为\
  \ 5，p= 0.00597\n\n卡方检验综合考察所有组别，如果任何一组与其他组有显著差异，将显示出显著性。要查看哪个特定组别表现不同，你需要检查观察值和期望值列，以及最后两列中的平方误差项。较高的值表示与期望值的偏离。检查输出后，我们发现有两个效应似乎是显著组别：\n\
  \n- 拥有学士学位的女性。我们预期 150 名流失客户，但观察到 111 名。这是一个相对流失率较低的群体。\n- 拥有博士学位的男性。观察到的生存率高于预期值。\n\
  \n此前，我们看到仅凭大学学位本身并没有太大区别。但加入性别因素可以识别出可针对性开展营销的特定群体。\n\n保存历史记录：\n\n```\nsavehistory(file=\"\
  ch5 interaction plot km curves.log\")\n```\n\n## 将服务呼叫次数转换为二元变量\n\n级别较多的变量通常难以管理，即使曲线中可能显示出统计学上的显著差异。这可能是由于组别规模较小所致。与其试图一次性分析所有组别，不如先寻找一个切断点，将变量合并为二元结果，这样通常更有意义。\n\
  \n例如，对服务呼叫次数（范围为 0 到 5）运行 survdiff() 函数，显示单个生存曲线之间存在显著差异：\n\n```\n> survdiff(SurvObj\
  \ ~ Xservice.calls, data = ChurnStudy)\n```\n\n\n\n调用：\nsurvdiff(formula = SurvObj\
  \ ~ Xservice.calls, data = ChurnStudy)\n\n  N Observed Expected (O-E)^2/E (O-E)^2/V\n\
  Xservice.calls=0 1103 507 542.87 2.371 10.322\nXservice.calls=1 222 154 116.77 11.873\
  \ 16.992\nXservice.calls=2 58 23 32.72 2.888 3.711\nXservice.calls=3 51 33 28.43\
  \ 0.734 0.923\nXservice.calls=4 47 31 25.95 0.985 1.215\nXservice.calls=5 7 3 4.26\
  \ 0.373 0.448\n\n卡方 = 23.3，自由度 = 5，p = 0.000301\n\n最后两列给出卡方值，可以看到，大多数较高的值对应较少的服务呼叫次数。Xservice.calls\
  \ 1 和 2 之间似乎存在一个断点。因此，我们可以将其视为自然断点。\n\n或者，我们可以制定一个假设，即低服务呼叫和高服务呼叫之间存在差异；我们可以创建一个新的二元变量，仅用于指示是否有任何服务呼叫。\n\
  \n然后我们可以绘制结果，并再次使用 log-rank 检验来检验差异：\n\n```\nChurnStudy$called.binary <- as.factor(ifelse(ChurnStudy$Xservice.calls=\n\
  survdiff(SurvObj ~ ChurnStudy$called.binary, data = ChurnStudy)\nplotsurv(ChurnStudy$called.binary,c(1:2),c('none'))\n\
  title(main = \"5 KM Curve Called\")\ndev.copy(jpeg,'Ch5 - 5 KM Curve Called.jpg');\
  \ dev.off()\n\nsurvdiff(SurvObj ~ ChurnStudy$called.binary, data = ChurnStudy)\n\
  ```\n\n此处指定的 plotsurv 调用生成以下图表：\n\n## 5 KM 曲线：已呼叫\n\n![](img/672c0cf8ba3c000a6529b117ed96945e_312_0.png)\n\
  \n## 检验呼叫客户与未呼叫客户之间的差异\n\n调用 survdiff() 函数生成卡方检验：\n\n```\n> survdiff(SurvObj ~ ChurnStudy$called.binary,\
  \ data = ChurnStudy)\nCall:\nsurvdiff(formula = SurvObj ~ ChurnStudy$called.binary,\
  \ data = ChurnStudy)\n\n                    N Observed Expected (O-E)^2/E (O-E)^2/V\n\
  ChurnStudy$called.binary=CALLED   385    244     208     6.18\nChurnStudy$called.binary=NONE\
  \    1103    507     543     2.37\n\nChisq= 10.3  on 1 degrees of freedom, p= 0.00131\n\
  ```\n\n这显示了客户是否呼叫之间存在明显的断点，并表明客户呼叫可能需要干预计划，以便解决任何潜在的流失问题。\n\n## Cox 回归建模\n\nKM 检验在许多情况下都可以令人满意，尤其是在初步分析期间；然而，KM\
  \ 检验是非参数的，通常不如参数等价方法功效强大。Cox 回归将生存分析扩展到参数回归类型框架下，从而假设更大的功效。如果有几个自变量需要纳入模型，并且其中一些是连续的，那么执行\
  \ Cox 比例风险建模比 KM 更有优势。\n\n### 我们的第一个模型\n\nCox 建模也始于创建生存对象，就像我们在之前的示例中所做的那样。除此之外，Cox\
  \ 模型与标准回归模型非常相似，响应变量指定在 ~ 的左侧，自变量指定在右侧。\n\n在 Cox 回归建模中，我们使用 coxph() 函数而不是 surv()\
  \ 函数来指定因变量。可以直接在公式中完成，也可以将其分配给新变量并将新变量指定在 ~ 的左侧。\n\n请回顾，在定义我们最初的生存对象时，我们将 Xtenure2\
  \ 定义为时间变量，将 Churn 定义为感兴趣的结局。在我们的示例中，我们将指定 coxph(Surv(Xtenure2, Churn) 作为预测模型的左侧。\n\
  \n继续进行本练习的下一部分，运行以下代码，该代码将运行一个 Cox 回归模型，使用教育、性别、客户满意度、服务呼叫次数、月费和上月购买次数作为自变量来预测流失：\n\
  \n```\nclearhistory()\n#start CoxModel.1====\nrm(CoxModel.1)\n```\n\n```\nChurnStudy$SurvObj\
  \ <- with(ChurnStudy, Surv(Xtenure2, Churn == 1))\nCoxModel.1 <- coxph(Surv(Xtenure2,\
  \ Churn) ~\n    Xeducation + Xgender + Xsatisfaction + Xservice.calls +\n    Xpurch.last.month\
  \ + Xmonthly.charges,\n    data=ChurnStudy)\n```\n\n要查看结果，我们将使用 stargazer 库：\n\n\
  ```\nlibrary(stargazer)\nstargazer(CoxModel.1,single.row=TRUE,multicolumn=TRUE,font.size='\n\
  no.space = TRUE,column.separate = c(1,2,3),\nout=c(\"CoxModel.html\"),type='html')\n\
  browseURL(\"CoxModel.html\")\n```\n\nbrowseURL 命令将在浏览器中显示从 stargazer 写入的输出：\n\n\
  | 因变量： | |\n|---|---|\n| | Xtenure2 |\n| XeducationDoctorate Degree | -0.007 (0.157)\
  \ |\n| XeducationMaster's Degree | -0.041 (0.103) |\n| XgenderM | 0.281*** (0.095)\
  \ |\n| Xsatisfaction2 | -0.003 (0.101) |\n| Xsatisfaction3 | -0.231* (0.124) |\n\
  | Xsatisfaction4 | -0.250** (0.111) |\n| Xsatisfaction5 | -0.188 (0.125) |\n| Xservice.calls\
  \ | 0.030 (0.034) |\n| Xpurch.last.month | -0.016 (0.024) |\n| Xmonthly.charges\
  \ | 0.008*** (0.0004) |\n| Observations | 1,488 |\n| R² | 0.298 |\n| Max. Possible\
  \ R² | 0.999 |\n| Log Likelihood | -4,611.885 |\n| Wald Test | 494.750*** (df =\
  \ 10) |\n| LR Test | 526.196*** (df = 10) |\n| Score (Logrank) Test | 551.558***\
  \ (df = 10) |\n| 注： | * p<0.1; ** p<0.05; *** p<0.01 |\n\n或者，你可以运行 `summary(CoxModel.1)`\
  \ 命令在控制台中打印更详细的版本：\n\n```\n> summary(CoxModel.1)\nCall:\ncoxph(formula = Surv(Xtenure2,\
  \ Churn) ~ Xeducation + Xgender +\n              Xsatisfaction + Xservice.calls\
  \ + Xpurch.last.month + Xmonthly.charges,\n          data = ChurnStudy)\n\nn= 1488,\
  \ number of events= 751\n\n             coef exp(coef) se(coef)\nXeducationDoctorate\
  \ Degree -0.0067422  0.9932804 0.1568365 -0.04\nXeducationMaster's Degree -0.0411774\
  \  0.9596589 0.1031115 -0.39\nXgenderM                   0.2809885  1.3244384 0.0954112\
  \  2.94\nXsatisfaction2            -0.0031029  0.9969019 0.1010203 -0.03\nXsatisfaction3\
  \            -0.2305492  0.7940974 0.1240880 -1.85\nXsatisfaction4            -0.2503191\
  \  0.7785523 0.1105464 -2.26\nXsatisfaction5            -0.1879801  0.8286312 0.1247098\
  \ -1.50\nXservice.calls             0.0303329  1.0307976 0.0336934  0.90\nXpurch.last.month\
  \         -0.0160869  0.9840418 0.0243041 -0.66\nXmonthly.charges           0.0082750\
  \  1.0083093 0.0003928 21.06\n---\nSignif. codes:  0 '***' 0.001 '**' 0.01 '*' 0.05\
  \ '.' 0.1 ' ' 1\n```\n\n### 检查 Cox 回归输出\n\n由于我们本质上是在运行一个改进的逻辑回归，Cox 模型中的系数始终以对数形式表示。要将其转换为似然比，需要取指数。这也是摘要输出的一部分。\n\
  \n首先，查看列在 `exp(coef)` 列下的指数化系数的值。任何显著大于 1 的系数表明客户更有可能流失而非不流失。另一方面，`exp(coef)` <\
  \ 1 表明该变量流失的可能性较低。与 1 的差异幅度将指示某一方向的更高概率。\n\n模型结果表明，`gender (males)`、`satisfaction`\
  \ 和 `monthly charges` 是显著变量。\n\n男性以及月费较高的客户流失倾向更高，这由其高于 1 且 p 值较低的可能性得分所表明。\n\n\
  满意度得分为 4 的客户流失倾向较低，这由低于 1 且 p 值较低的可能性得分所表明。尽管满意度得分为 5 的客户未被发现显著，但将其也纳入是有意义的，因为他们的系数表明他们可能会留下，并且他们的\
  \ p 值相当低（但在 .05 水平上不显著）。单独提取这些客户并查看是否有其他因素导致其中一些人流失也会很有趣。我们指出模型中可能需要交互项。\n\n###\
  \ 比例风险检验\n\n运行 Cox 回归后，需要进行一些后续检验。Cox 回归需要检验的一个假设是，事件的风险仅取决于变量，而不取决于时间。如果是这样，时间就不能被视为自变量。因此，我们需要检验所谓的比例风险。这可以使用\
  \ cox.zph 函数来完成。\n\n运行以下代码部分，该代码列在标签 #coxproptext=== 下：\n\n它将执行以下操作：\n- 将比例风险检验的输出分配给\
  \ `temp` 对象\n- 将检验结果打印到控制台\n- 遍历 `temp` 对象中包含的所有模型变量并绘制比例风险：\n\n```\n#coxproptext===\n\
  #test for proportional hazards\ntemp <- cox.zph(CoxModel.1, transform = 'log')\n\
  print(temp)\npar(mfrow=c(2,5))\nfor (i in 1:10) {\nplot(temp[i])\n}\n```\n\n\n\n\
  \n```\n}\ndev.copy(jpeg,'Ch5 - Coxmodel1 zph.jpg');\ndev.off()\nsavehistory (file=\"\
  Ch5 CoxModel zph.txt\")\n```\n\n### 首先，查看 `print(temp)` 命令的输出：\n\n```\n> print(temp)\n\
  ```\n\n| 变量 | rho | chisq | p |\n|---|---|---|---|\n| Xeducation博士学位 | 0.02283 |\
  \ 0.40067 | 0.5267 |\n| Xeducation硕士学位 | 0.06161 | 2.88733 | 0.0893 |\n| Xgender男性\
  \ | -0.05593 | 2.36508 | 0.1241 |\n| Xsatisfaction2 | -0.01517 | 0.17429 | 0.6763\
  \ |\n| Xsatisfaction3 | -0.06778 | 3.47926 | 0.0621 |\n| Xsatisfaction4 | 0.01274\
  \ | 0.12252 | 0.7263 |\n| Xsatisfaction5 | -0.00120 | 0.00111 | 0.9735 |\n| Xservice.calls\
  \ | 0.02364 | 0.41897 | 0.5175 |\n| Xpurch.last.month | 0.00987 | 0.10354 | 0.7476\
  \ |\n| Xmonthly.charges | 0.01265 | 0.07633 | 0.7823 |\n| GLOBAL | NA | 11.43649\
  \ | 0.3245 |\n\n对于打印输出，您会注意到卡方检验值（第4列）及其关联的p值（第5列），它们用于检验每个回归协变量是否随时间变化的假设。为了使模型通过该假设，您希望看到较高的p值，且所有p值均高于关键显著性水平。在此例中，它们均高于\
  \ p=.05，因此所有变量均通过比例风险假设的检验。\n\n### 比例风险图\n\n生成的图表还显示，随着时间增加，所有变量都呈均匀分散状态。任何因时间引起的变化都会由一条明显向上或向下倾斜的直线指示：\n\
  \n![](img/672c0cf8ba3c000a6529b117ed96945e_320_0.png)\n\n### 获取Cox生存曲线\n\n我们可以以与KM模型类似的方式获取Cox模型的生存曲线。要获取曲线的数据点，请使用\
  \ `summary(survfit(CoxModel.1))`，它还将显示置信区间、流失成员数 `churned (n.event)`，以及处于风险中的成员数\
  \ `(n.risk)`：\n\n```\n> summary(survfit(CoxModel.1))\nCall: survfit(formula = CoxModel.1)\n\
  ```\n\n| 时间 | n.risk | n.event | 生存率 | 标准误 | 95%置信区间下限 | 95%置信区间上限 |\n|---|---|---|---|---|---|---|\n\
