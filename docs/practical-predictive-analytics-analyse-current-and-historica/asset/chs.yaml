  浏览生成的五个集群，您可能会将集群 2 归类为一群年轻人且怀孕率较低的群体，因为两个变量的均值都接近负 -1 值。请记住，这些都是标准化值，因此您可以进行比较，并使用\
  \ +1/-1 标准差水平作为截止值。因此，将其作为截止值，您还可以假设集群 3 可能是身体质量较低的人，因为三头肌水平也接近 -1。接近 0 的值意味着该变量对集群的影响可忽略不计。\n\
