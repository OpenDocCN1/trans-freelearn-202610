  \ num 29.4401765315476 24.953572101178 32.846294484615 42.3403328136571 35.6341563357795\
  \ 42.5202651318031\n $ pedigree : num 1.22263036150258 0.313509501680247 0.445328027648939\
  \ 0.52963571807743 0.385501592130751 0.25120511045\n $ age : num 25.8341329573308\
  \ 19.4383095827238 46.3093049981371 16.6689622302294 26.5530890692054 26.1512830183403\n\
  ```\n\n### 模拟阴性病例\n\n我们刚刚模拟了阳性病例。现在，让我们设置一些类似的代码来模拟非糖尿病患者（outcome=0）。\n\n对于阴性病例，我们还将\
  \ `sample.bin` 乘以 -1，以便在将来，我们知道所有正的 `sample.bin` 实例都对应阳性病例，而所有负的 `sample.bin` 实例都对应阴性病例：\n\
  \n```\nset.seed(123)\nnbins2=base::round(n2/400,0)\ncorrelationMatrix <- cor(PimaIndians[PimaIndians$diabetes\
  \ =='neg'\ncovarianceMatrix <- stats::cov(PimaIndians[PimaIndians$diabetes =\nout_sd2\
  \ <- as.DataFrame(data.frame(data.frame(\n   sample.bin=base::sample(1:nbins2,n2,replace=TRUE)\
  \ * (-1),\n   outcome=0,\n   mvrnorm(n2, mu = means.neg, Sigma = matrix(covarianceMatrix,\
  \ ncol))[rep (1:n2, times=2000), ]]))\nnrow(out_sd2)\n```\n\n输出表明生成了 500,000 行。请注意，它还表明运行了两个\
  \ Spark 作业才能获得结果。对于好奇者，你还可以点击三角形图标，从处理角度显示有关 Spark 作业的详细信息，（尽管它不包含任何结果输出）。\n\n-\
  \ > (2) Spark 作业\n\n[1] 5e+05\n\n### 将阳性和阴性病例合并为单个 Spark 数据框\n\n我们现在有两个分别对应阳性和阴性病例的独立\
  \ Spark 数据框。对于某些类型的分析，保持结果分开是合理的；但是，为了说明目的，我们将使用 unionAll() 函数将它们合并为一个单一数据集。\n\n\
  ```\nout_sd <- unionAll(out_sd1, out_sd2)\nnrow(out_sd)\n```\n\nnrow 的输出表明总共有 768,000\
  \ 行。这个数字代表我们原来的 768 行，已乘以 1000 的因子：\n\n```\n(1) Spark Jobs\n\n[1] 768000\n```\n\n\
  \n\n\n### 运行汇总统计\n\n创建新数据对象后，我首先要做的事情之一就是运行汇总统计。R 的 summary 函数有一个 Spark 特有的函数，称为\
