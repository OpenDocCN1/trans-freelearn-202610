  (1.37e+03,2.36e+03]:9624 1:10454 0:13079 P:13009 (2.74,360] : 3364\n9: 8 T: 638\n\
  A: 3529\n\nperstop typeofid explnstp othpers arstmade sumissue compyear\n(0.911,8.1]:9942\
  \ 0: 308 N: 20 N:11285 N:13211 N:15591 0:16034\n(8.1,90.1] :6092 P:9279 Y:16014\
  \ Y: 4749 Y: 2823 Y: 443\nR: 454\nV:5993\n```\n\n### 检查分桶数据\n\n在前面的输出中，观察到每个数值变量已转换为两个分类桶中的一个。这两个分桶类别由用\
