  \ 1342 | 20 | 0.940 | 0.00559 | 0.929 | 0.951 |\n| 5 | 1315 | 39 | 0.919 | 0.00655\
  \ | 0.906 | 0.932 |\n| 6 | 1245 | 42 | 0.896 | 0.00752 | 0.881 | 0.911 |\n| 7 |\
  \ 1156 | 60 | 0.861 | 0.00884 | 0.844 | 0.879 |\n| 8 | 1020 | 68 | 0.818 | 0.01033\
