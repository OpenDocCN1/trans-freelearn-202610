  现在我们已经生成了最终的 Spark 数据框，可以将其写入磁盘。从下一章开始，我们会将其读回工作区，而无需从头重新创建。如果你直接继续下一章，现在可以跳过此步骤：\n\
  \n- 我们将以 Parquet 文件格式保存，这是一种对 Spark 和 SQL 非常高效的格式。%fs（文件系统）指令允许你使用 `ls` 操作系统命令发出目录（或文件列表）命令。\n\
  - 文件保存后，你可以通过将其读回并再次分配给 `out_sd` 数据框来验证文件的完整性。\n- 使用 `head` 命令验证数据是否已读回：\n\n```\n\
  saveAsParquetFile(out_sd, \"/tmp/temp.parquet\")\n%fs ls\nout_sd <- parquetFile(sqlContext,\
  \ \"/tmp/temp.parquet\")\nhead(out_sd)\n```\n\n## 总结\n\n在本章中，我们了解了 Spark 是什么以及其一些优势。我们开始编写将数据加载到\
  \ Spark 集群并保存到其中的程序。我们学习了几种方法，可以根据小型数据集的特征构建我们自己的超大型 Spark 数据框。\n\n我们还学习了如何在 Databricks\
  \ 中编写 Spark 程序以及如何运行标准 R 分析和安装包。我们还通过替换原始数据中的一些缺失值，巩固了关于缺失值填充的知识。\n\n在下一章中，我们将利用已构建的内容开始探索数据。\n"
- "# 第 10 章. 使用 Spark 探索大型数据集\n\n> \"我从不猜测。在拥有数据之前进行理论推测是一个严重的错误。人们会不自觉地开始扭曲事实以迎合理论，而不是让理论符合事实。\"\
  \n>\n> - 阿瑟·柯南·道尔爵士\n\n在本章中，我们将开始对在上一章中创建的 Spark 数据框进行一些探索性数据分析。我们将学习一些有助于你分析的特定\
  \ Spark 命令，并讨论几种绘图和作图方法。\n\n在学习这些示例时，请记住，驻留在 Spark 中的数据可能比你习惯的要大得多，并且在不首先考虑数据如何组织以及使用标准技术会如何影响性能的情况下，应用一些快速分析技术可能不切实际。\n\
  \n如果你是从上一章中断的地方继续，那么在开始之前需要加载保存的 Spark 数据框。请记住，我们将糖尿病数据集的结果保存为 parquet 文件，因此可以使用\
  \ parquetFile() 函数将数据读回内存。然后筛选出阳性糖尿病病例，因为我们将在下一部分探索它们：\n\n```\nout_sd <- parquetFile(sqlContext,\
  \ \"/tmp/temp.parquet\")\nout_sd1 = SparkR::filter(out_sd,out_sd$outcome == 1)\n\
  ```\n\n## 对阳性病例进行探索性分析\n\n在探索整个 Spark 数据框之前，我们可以查看已为阳性病例生成的一些数据。如你可能从上一章中记得，这些数据存储在\
  \ Spark 数据框 out_sd1 中。\n\n我们专门生成了一些随机样本箱，以便进行探索性分析。\n\n我们可以使用 filter 命令提取随机样本 1，并获取前\
  \ 1,000 条记录：\n\n- `filter` 是一个 SparkR 命令，允许你对 Spark 数据框进行子集提取\n- `display` 是一个 Databricks\
  \ 命令，相当于我们之前使用过的 `View` 命令，你也可以使用 `head` 函数来限制显示的行数：\n\n这段代码从阳性病例中提取 1000 条记录并显示它们：\n\
  \n```\nsmall_pos <- head(SparkR::filter (out_sd1, out_sd1$sample_bin)\nnrow (small_pos)\n\
  display (small_pos)\n```\n\n![](img/672c0cf8ba3c000a6529b117ed96945e_539_0.png)\n\
  \n数据以表格形式显示，你可以上下或左右滚动以查找缺失值、极端值等。\n\nfilter 命令具有两个功能：\n\n- 为你的分析提取感兴趣的片段。\n- 提取样本，这有助于调试你的\
  \ Spark 数据流。这可以帮助后续步骤更快运行，并避免不必要地运行大型作业，尤其是当样本反映总体构成时。\n\n## 显示 Spark 数据框的内容\n\n\
  显示 Spark 数据框子集有多种方法。可选项如下：\n\n- `showDF`：这是一个 Spark 命令，以紧凑的方式显示数据框的内容。\n- `head`：这是正常的\
  \ R 函数，可用于 Spark 数据框；它遵循与基础 R 相同的语法。\n- `take`：该命令也会打印一些行，但会从底层 RDD 中收集行。\n- `display`：这是一个特殊的\
  \ Databricks 命令，大致相当于基础 R 的 `View` 命令，但还允许你通过数据下方横向滚动条下方的控制图标绘制输出的子集。使用 display\
  \ 还允许你切换到绘图模式。\n\n## 使用原生图表功能进行绘图\n\n点击第二个图标：\n\n![](img/672c0cf8ba3c000a6529b117ed96945e_540_0.png)\n\
  \n你将进入一个图表对话框，在其中可以绘制变量之间的各种关系。要绘制这些关系，首先将一个变量从 `All fields` 列拖动到 `Values` 列：\n\n\
  \n\n- 例如，图 1 显示 diabetes=1 的胰岛素水平箱线图\n- 图 2 显示带有 20 个定义箱的胰岛素水平直方图\n- 图 3 显示年龄与胰岛素水平之间的散点图\n\
  - 图 4 显示年龄、胰岛素和怀孕月数的相关矩阵：\n\n![](img/672c0cf8ba3c000a6529b117ed96945e_541_0.png)\n\
  \n![](img/672c0cf8ba3c000a6529b117ed96945e_541_1.png)\n\n![](img/672c0cf8ba3c000a6529b117ed96945e_541_2.png)\n\
  \n![](img/672c0cf8ba3c000a6529b117ed96945e_541_3.png)\n\n## 直接在 Spark DataFrame\
  \ 上运行成对相关性分析\n\n提供可直接在 Spark DataFrame 上运行的相关性和协方差函数。以下示例表明，对于糖尿病患者，年龄与血糖水平之间存在\
  \ 11% 的相关性：\n\n```\ncorr <- corr(out_sd1, \"glucose\", \"age\", method = \"pearson\"\
  )\ncorr\n```\n\n- (1) Spark 作业\n\n[1] 0.1130607\n\n## 清理并将表缓存到内存中\n\n由于 Spark 擅长处理内存中数据，我们将首先删除中间数据，然后缓存\
  \ out_sd DataFrame，以便后续查询运行速度快得多。当重复执行相似类型的查询时，内存中缓存数据效果最好。这样，Spark 就能知道如何平衡内存，使大部分所需数据都驻留在内存中。\n\
  \n不过，这并非万无一失。良好的 Spark 查询和表设计有助于优化，但开箱即用的缓存通常也能带来一些好处。通常，最初的查询不会从内存缓存中受益，但后续查询将运行快得多。\n\
  \n由于我们不再使用创建的中间 DataFrame，将使用 rm 函数删除它们，然后在完整 DataFrame 上使用 cache() 函数：\n\n```\n\
  #cleanup and cache df\nrm(out_sd1)\nrm(out_sd2)\ncache(out_sd)\n```\n\n## 探索数据的一些有用\
  \ Spark 函数\n\n### Count 和 groupby\n\n还可以使用 `Count` 和 `groupby` 函数来汇总单个变量。\n\n以下是按结果统计观测值数量的示例。由于结果是另一个\
  \ DataFrame，可以使用 `head` 函数将结果写入控制台。\n\n### 注意\n\n如果更改查询，可能需要更改 head 返回的行数。使用 `head`\
  \ 等函数过滤结果始终是个好主意，以确保不会打印数百行（或更多）。\n\n但同时也需要确保不会截断所有输出。如果不确定行数，请先将结果分配给 DataFrame，然后再使用\
  \ `nrow` 检查行数：\n\n此代码行按结果统计行数。我知道应该只有 2 个结果，但我将 count 函数放在 head 语句中，只是为了采取防御性编程。\n\
  \n```\nhead(SparkR::count(groupBy(out_sd, \"outcome\")))\n```\n\n### (5) Spark 作业\n\
  \n| | 结果 | 计数 |\n|---|---|---|\n| 1 | 0 | 500000 |\n| 2 | 1 | 268000 |\n\n从 Spark\
  \ DataFrame 打印值非常快。以下是每个结果组中的一些值。请注意，当 outcome == 0 时 sample_bin 为负值，当 outcome ==\
  \ 1 时为正值：\n\n首先打印一些负值。可以看到一些怀孕数值为负，表明模拟并不完美。\n\n```\nhead(SparkR::filter(out_sd,out_sd$outcome\
  \ == 0),5)\n```\n\n### (2) Spark 作业\n\n| 样本箱 | 结果 | 怀孕次数 | 血糖 | 血压 | 肱三头肌皮褶 | 胰岛素\
  \ | 质量 | 谱系函数 |\n|---|---|---|---|---|---|---|---|---|\n| -144 | 0 | -1.481 | 73.4\
