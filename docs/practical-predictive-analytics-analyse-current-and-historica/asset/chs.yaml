  \ -0.06523912 |\n| 0.37704262 | 0.45119753 |\n\n## 摘要\n\n在本章中，我们超越了 SQL，开始探索 Spark\
  \ 的机器学习功能。我们使用糖尿病数据集介绍了回归和 kmeans 聚类。我们构建了训练和测试数据集，并了解了如何通过模拟向数据中引入一些变化。还介绍了大量 Databricks\
  \ 可视化，以及使用 collect() 函数将数据导出到基础 R 以便使用 ggplot 的某些可视化。我们还学习了如何使用代码手动执行一些回归诊断。随后，我们学习了如何通过代码标准化数据集，并利用结果使用\
  \ Spark 说明了一个 kmeans 示例。最后，我们查看了生成的集群，并检查了一些简单的解释。\n"
- "# 第 12 章. Spark 模型 – 基于规则的学习\n\n在本节中，我们将学习如何实现一些基于规则的算法。这些算法的实现方法取决于您使用的语言接口以及正在运行的\
  \ Spark 版本。\n\n对于 Spark 2.0，仅 Scala 和 Python 支持基于规则的决策树。因此，为了演示如何直接在 Spark 中构建决策规则，我们将举例说明如何使用\
  \ Python 来确定被搜身的规则。\n\n对于其他语言，例如 R，目前无法直接在 Spark dataframe 上运行决策树算法；但是，可以使用其他方法来生成准确的树。\n\
  \n我们将演示如何先从 Spark 提取样本，下载到基础 R，然后运行我们常用的工具，例如 rpart。大型数据集通常包含比决策树所需多得多的数据，因此从大数据源中适当抽样、将数据从\
  \ Spark 提取到 R 并运行标准工具是非常合理的。\n\n我们将介绍 One Rule (OneR) 包，以了解每个单变量如何预测结果。基于 OneR “少即是多”的理念，我们将演示\
  \ OneR 如何优化地对数值进行分箱，并使用决策树规则确定哪些是最主要的预测因子。您也可以使用 OneR 包进行特征选择。\n\n\n\n\n## 加载停止和盘查数据集\n\
  \n我们将使用上一章构建的糖尿病数据集。对于其他一些决策树示例，我们需要加载停止和盘查数据集。您可以从以下 URL 获取此数据集：http://www1.nyc.gov/site/nypd/stats/reports-analysis/stopfrisk.page.\n\
  \n选择 2015 年 CSV 压缩归档，下载并提取文件到项目目录，例如 C:/PracticalPredictiveAnalytics/Data，并将文件命名为\
  \ 2015_sqf_csv\n\n## 将 CSV 文件导入 Databricks\n\nDatabricks 包含一个简单的用户界面，允许您将文件加载到 Databricks\
  \ HDFS 文件系统。或者，您可以将文件直接加载到 **亚马逊云服务** (AWS) 并直接从 Databricks API 读取文件。\n\n- 1. 切换到\
  \ Databricks 应用程序，选择 `Tables`，然后选择 `Data Import`。请注意，在某些版本的 Databricks 中，此功能位于 Data\
  \ 菜单下：选择 \"Tables\"，然后单击 +。\n- 2. 系统可能会提示您创建新集群。如果是，请先按照我们在 **第 9 章** 中创建新集群的说明进行操作。\n\
  - 3. 将名为 `2015_sqf_csv` 的文件从 PracticalPredictiveAnalytics 目录拖到数据导入框中，如下所示：\n\n###\
  \ 创建表\n### 数据导入\n\n- 4. 单击 **预览表**。\n- 5. 将 **表名** 输入为 `stopfrisk`。\n- 6. 观察变量的分配方式（它们全部分配为字符串）；但是，不要更改任何属性。只需单击\
  \ **创建表**（左侧的蓝色按钮）：\n\n### 创建表\n### 表详细信息\n\n| _c0 | _c1 | _c2 | _c3 | _c4 | _c5\
  \ |\n| --- | --- | --- | --- | --- | --- |\n| STRING | STRING | STRING | STRING\
  \ | STRING | STRING |\n| year | pct | ser_num | datestop | timestop | recstat |\n\
  | 2015 | 61 | 18 | 1012015 | 315 | 1 |\n| 2015 | 22 | 5 | 1152015 | 1747 | A |\n\
  | 2015 | 20 | 36 | 1292015 | 1745 | 1 |\n| 2015 | 20 | 38 | 1292015 | 1745 | 1 |\n\
  | 2015 | 20 | 41 | 1292015 | 1745 | 1 |\n| 2015 | 20 | 39 | 1292015 | 1745 | 1 |\n\
  \n## 读取表\n\n完成上述步骤后，您刚刚创建的表将在 Databricks 系统中注册，并在会话间保持持久，即您每次登录时都不需要重新加载数据。\n\n\
  ## 运行第一个单元格\n\n首先运行第一个单元格（也称为代码块），它将获取按年份统计的记录数量。您可以通过从本书网站下载来访问本章中的代码。或者，您可以将以下代码的每个部分复制到新单元格，以此方式创建自己的笔记本。\n\
  \n由于停止和盘查已导入并已注册为表，我们可以开始使用 SQL 读取一些计数，以查看文件有多大：\n\n```\n#embed all SQL within the\
  \ sql() function\nyr <- sql(\"SELECT year,frisked,count(*) as year_cnt FROM stopfrisk\"\
  )\ndisplay(yr)\n```\n\n几秒钟后，输出将以简单的格式化表格形式出现。使用 year_cat 列的简单计算表明，对于 2015 年，68%\
