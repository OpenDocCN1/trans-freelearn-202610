  2           2            19416         19416         19416        1.748146     \
  \ 25.58429     512.46127\n3           3            330           330           \
  \ 330          18.075758     305.69979    371.37273\n4           4            10461\
  \         10461          10461        2.522417      36.73229     216.94523\n5  \
  \         5            3668          3668           3668         6.151854      101.58269\
  \    485.78190\n6           6            14969         14969          14969    \
  \    1.843142      26.49776     456.32394\n7           7            10517      \
  \   10517          10517        2.548636      36.79511     77.25055\n```\n\n我们可以用原始变量来解释这些聚类：\n\
  \n对于三聚类分配：\n\n- 聚类 1 具有所有三个聚类中最低的平均购买单位数量，以及最低的 TotalPaid 金额。它还拥有相对于其他客户很久以前购买过商品的客户。\n\
  \n\n\n\n\n- 集群 2 按最近购买的客户进行分类，因为它们的 Day.since 均值统计量最低。\n- 集群 3 按购买数量相对较多、总发票金额较高，但不一定是最近购买者的客户进行分类。\n\
  \n基于这些集群定义，营销部门可以为每个客户群定制不同的产品或服务。\n\n### 层次聚类\n\n作为 k-means 的一种替代方案，你可以执行层次聚类，无需事先指定集群数量。在层次聚类中，你可以从一个集群开始，每次继续细分两个集群；也可以从每条记录各自作为一个集群开始，然后将它们合并成更大的集群。无论如何，都可以轻松扫描树（称为树状图）的上下，找出适合你需求的集群分组，而不必逐次运行聚类。但是，对于大规模计算处理，分区聚类（k-means）绝对具有性能优势，这也是它在工业界备受青睐的原因。\n\
  \n我们将使用 hclust R 函数和 Pain 数据框来演示层次聚类。读取数据后，我们将通过将均值中心化到 0 来对数据进行缩放或标准化。这样做的原因是，我们不希望聚类过程仅因变量的大小或方差而偏爱某个变量，因此我们尽可能使其量级相等。\n\
  \n首先，我们将之前保存的 pain_raw 数据加载到一个数据框对象中：\n\n```\nrequire(graphics)\nsetwd(\"C:/PracticalPredictiveAnalytics/Data\"\
  )\nload(\"pain_raw.Rda\")\n\ndf2 <- subset(df, select=c(Age,Duration,Pain))\ndf2\
  \ <- scale(df2)\nhead(df2)\n```\n\n接下来，我们将计算距离矩阵，并使用平均连接法运行层次聚类算法：\n\n```\nfit <-\
  \ hclust(dist(df2), \"average\")\n```\n\n在绘制树状图之前，我们将指定要在最相似的三个集群组周围显示红色边框：\n\n\
  ```\ngroups <- cutree(fit, k=3)\nrect.hclust(fit, k=3, border=\"red\")\n```\n\n\
  树状图已绘制，其外观应与以下图表类似。垂直线末端显示观察编号，因此可以轻松从原始数据框中提取子集并检查数据：\n\n![](img/672c0cf8ba3c000a6529b117ed96945e_265_0.png)\n\
  \n### 检查集群 1 中的一些示例\n\n从树状图底部，我们可以看到与 cluster1 关联的一些观察结果。从原始数据框 (df) 中提取它们：\n\n\
