  \ 1.1186379328449\n $ glucose : num 157.123189654394 148.943347099497 172.842735207286\
  \ 107.366227123907 105.302689867468 188.881198462925\n $ pressure : num 61.5029879083116\
  \ 71.69507301027 74.4269535626088 74.3844944342854 78.1355932536701 61.884344482885\n\
  \ $ triceps : num 15.6917644205514 41.5591691064547 30.0192322177519 34.9364879662772\
  \ 33.0035759583851 28.1923108753192\n $ insulin : num 129.597011349131 240.029631091656\
