  我们现在将执行简单的均值填充。但是，我们将不使用单一均值数字进行替换，而是根据以下四组的成员资格，用均值替换 NAs：\n\n- 糖尿病=阳性/较年轻年龄范围\n\
  - 糖尿病=阴性/较年轻年龄范围\n- 糖尿病=阴性/较年长年龄范围\n- 糖尿病=阳性/较年长年龄范围\n\n我们已经有了糖尿病=阴性/阳性类别，那么如何将年龄分为年轻/较年长组？\n\
  \n我们将通过自动计算切点来实现这一点。为确定切点，我们将对年龄变量使用 cut 函数将其分为两个级别。然后，我们将使用 dplyr 根据年龄组的切分方式，计算五个变量的均值。\n\
  \n- 1. 首先，让我们看看有多少个观测值落入这四个组中：\n\n```\nlibrary(dplyr)\nPimaIndians$agegrp <- as.numeric(cut(PimaIndians$age,\
  \ bre\nPimaIndians %>%\ngroup_by(diabetes,agegrp) %>% count()\n```\n\n- 2. 输出显示了创建的四个组及其计数。\n\
  \n```\nSource: local data frame [4 x 3]\nGroups: diabetes [?]\n\ndiabetes agegrp\
  \   n\n1   neg      1 460\n2   neg      2  40\n3   pos      1 235\n4   pos     \
  \ 2  33\n```\n\n- 3. 接下来，我们将为每个组替换一个填充的均值。\n\n- 4. 请注意，只替换 NA 值。如果不是 NA，我们将保留原始值。这一点需要始终注意。您通常不想用填充值覆盖有效的接受值！\n\
  \n```\nlibrary(dplyr)\ndf <- PimaIndians %>%\n  group_by(diabetes,agegrp) %>%\n\
  \  mutate(\n    insulin.imp = mean(insulin,na.rm=TRUE),\n    glucose.imp = mean(glucose,na.rm=TRUE),\n\
  \    pressure.imp = mean(pressure,na.rm=TRUE),\n    triceps.imp = mean(triceps,na.rm=TRUE),\n\
  \    mass.imp    = mean(mass,na.rm=TRUE)\n  )\n```\n\n```\ndf$insulin <- ifelse(is.na(df$insulin),\
  \ df$insulin.imp, d\ndf$glucose <- ifelse(is.na(df$glucose), df$glucose.imp, d\n\
  df$pressure <- ifelse(is.na(df$pressure), df$pressure.imp\ndf$pressure)\ndf$triceps\
  \ <- ifelse(is.na(df$triceps), df$triceps.imp, d\ndf$mass <- ifelse(is.na(df$mass),\
  \ df$mass.imp, df$mass)\n```\n\n### 检查填充情况（读者练习）\n\n在替换 NAs 后，打印结果数据框，并比较分配的值与填充的值。这只是一个检查点，以确保您的填充顺利进行，且结果合理。始终查找填充中的极端值，这些值可以告诉您是否有问题。\n\
