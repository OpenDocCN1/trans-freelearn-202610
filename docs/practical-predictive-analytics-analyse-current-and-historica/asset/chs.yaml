  \ 5\n```\n\n### 在聚类上运行 apriori 算法\n\n回到 apriori 算法，我们可以使用生成的预测聚类来代替 lastword，以便制定一些规则：\n\
  \n- 我们将使用强制转换为数据框的方法来生成事务文件，与之前生成的方式相同\n- 创建一个 rules_clust 对象，该对象基于聚类项集 {1,2,3,4,5}\
  \ 构建关联规则\n- 按提升度（lift）检查一些生成的规则：\n\n```\nlibrary(arules)\ncolnames(kw_with_cluster2_score)\n\
  kable(head(kw_with_cluster2_score[, c(1,13) ],5))\ntmp <-\ndata.frame(kw_with_cluster2_score[,1],\n\
  kw_with_cluster2_score[,13])\nnames(tmp)[1] <- \"TransactionID\"\nnames(tmp)[2]\
  \ <- \"Items\"\ntmp <- unique(tmp)\ntrans4 <- as(split(tmp[,2], tmp[,1]), \"transactions\"\
  )\nrules_clust <- apriori(trans4, parameter = list(minlen=2,support = 0.02,confidence\
  \ = 0.01))\nsummary(rules_clust)\ntmp <- as.data.frame(inspect(head(sort(rules_clust,\
  \ by=\"lift\"),10)))\n```\n\n| | 左项集 | 右项集 | 支持度 | 置信度 | 提升度 |\n|---|-----|-----|---------|------------|------|\n\
