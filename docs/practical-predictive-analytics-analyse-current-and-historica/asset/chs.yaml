  \ | 1.28411227 |\n| TreatmentP | 24.087421759279735 | 1.38534008 | 5.45845778 |\n\
  | GenderM | 6.247629578965714 | 0.38227954 | 3.58627713 |\n| Age | 1.299647808771851\
  \ | 0.09349231 | 0.48146218 |\n| Duration | 0.994158449470197 | -0.07338820 | 0.05768555\
  \ |\n\n\n\n\n\nexp() 函数将为每个变量提供实际的似然比。这使您可以观察每个变量对预测器发生可能性的影响。在我们之前的示例中，Age 每增加\
  \ 1 年，Pain 的可能性会以 1.3 的因子增加。这很多吗？开始超越数字思考，并考虑如果您自己正在遭受慢性病困扰，您会如何看待那个结果。\n\n### 检查残差\n\
  \n查看系数后，我首先做的事情之一就是查看残差。\n\n可以使用 residuals() 函数查看所有残差：\n\n```r\nresiduals(PainGLM,\
  \ type=\"deviance\") # residuals\n```\n\n对于许多好的模型，残差将围绕零点散布，并且在所有水平上都具有大致相同的方差。本模型的残差偏差列在先前显示的摘要部分中。我们可以看到分布是平衡的，因为最小值和最大值的绝对值大约相等，1Q（第\
  \ 25 百分位数）与 3Q（第 75 百分位数）也是如此：\n\n| | 最小值 | 1Q | 中位数 | 3Q | 最大值 |\n|---|---|---|---|---|---|\n\
  | 偏差残差 | -2.7638 | -0.5904 | -0.1952 | 0.6151 | 2.3153 |\n\n如果我们想查看均值，可以将 mean()\
  \ 函数包装在 residuals() 函数周围。请注意，-0.04 的均值大于 -0.195 的中位数。这意味着残差具有轻微的正偏态：\n\n```r\nmean(residuals(PainGLM,\
  \ type=\"deviance\"))\n```\n\n控制台中将显示以下输出：\n\n```\n[1] -0.04269042\n```\n\n### 残差图\n\
  \n图表对展示残差非常有帮助，并且通常对于诊断模型问题至关重要：\n\n```r\nplot(residuals(PainGLM, type=\"deviance\"\
  ))\n```\n\n输出的图表显示了残差分布整齐的良好示例。沿索引范围，残差看起来围绕 0 分布，并且沿范围似乎没有显著的上升或下降趋势，除了先前提到的轻微偏态：\n\
  \n![](img/672c0cf8ba3c000a6529b117ed96945e_208_0.png)\n\n### 添加变量图\n\n添加变量图允许您在保持其他变量系数不变的情况下，检查特定变量的影响。换句话说，它从视觉上描述了向模型中添加另一个变量时会发生什么。它也可以被视为检查特定变量影响的一种方式，即将多元回归线投影到二维空间。通过这种方式，您可以检查与其他变量相比，哪些变量具有更大影响。\n\
  \n在以下图表中，我们将使用 `car` 包中的 `avPlots()` 函数。您可以看到 `Age` 具有强线性影响，而 `Duration` 的影响可忽略不计。这也反映在先前显示的逻辑回归模型的系数和显著性中：\n\
  \n```r\nlibrary(car)\navPlots(PainGLM, id.method=\"mahal\", id.n=2)\n```\n\n###\
  \ 添加变量图\n\n![](img/672c0cf8ba3c000a6529b117ed96945e_209_0.png)\n\n### 回归中的异常值\n\n\
  请注意，每个图表前面还会识别数据集中可能影响回归线（穿过数据的线）的极端数据点。极端值在图本身中以粗体表示。\n\n例如，在所有先前的图表中，您可以看到观测值\
  \ 26 相对于其他协变量被视为异常值。\n\n将此观测值及其一些邻居打印到控制台。您可以通过目视检查就看出这可能被视为异常值，因为两个变量（`Duration`\
  \ 和 `Treatment`）立即显示出与周围观测值不同：\n\n```r\ndf[c(26,27,28,25),]\n```\n\n发送到控制台的输出如下：\n\
  \n| | 治疗 | 性别 | 年龄 | 持续时间 | 疼痛 |\n|---|---|---|---|---|---|\n| 26 | P | M | 74 |\
  \ 4 | 0 |\n| 27 | B | M | 66 | 19 | 0 |\n| 28 | A | M | 70 | 28 | 0 |\n| 25 | A\
  \ | M | 62 | 42 | 0 |\n\n### P 值与效应量\n\nP 值长期以来一直是对输出统计量进行假设检验的传统方法，但在许多情况下，近年来因不被视为适用的衡量标准而受到批评。\n\
  \n数据集现在比过去大得多。一个包含大量变量的超大型数据集总是可以显示显著的 p 值，即使实际上不存在显著性。\n\n还有大量不同种类的算法可以生成 p 值，而且很有可能你可以选出一个能给你想要\
  \ p 值的算法。\n\n分析师可以使用不同的 p 值截止水平来强制显著性。\n\n更危险的情况是，您可以选择或更改数据以影响 p 值。这往往非常微妙，并可能通过非随机采样、从一个层级到另一个层级的数据转换、保留缺失值，或删除或填充缺失值来体现。模型者在应用统计检验之前所做的所有决定都会影响\
  \ p 值。\n\n话虽如此，p 值仍然有助于识别可能的显著预测器，并了解数据是否符合模型。但它应被视为仅一项工具，就像您使用的每个算法只是众多用于揭示真相的工具之一一样。我们演示的其他工具（如置信区间、随机采样和变量影响图）应与\
  \ p 值的计算一起使用，以呈现数据的完整图景。\n\n以下是美国统计协会关于 p 值使用的重要声明（AMERICAN STATISTICAL ASSOCIATION\
  \ RELEASES STATEMENT ON, 2016）：\n\n- P 值可以指示数据与指定统计模型的不兼容程度\n- P 值不衡量所研究假设为真的概率，也不衡量数据仅由随机机会产生的概率\n\
  - 科学结论以及商业或政策决策不应仅基于 p 值是否通过特定阈值\n- 正确的推断需要充分报告和透明度\n- P 值或统计显著性不衡量效应的大小或结果的重要性\n\
  - 单凭 P 值无法提供关于模型或假设的良好证据度量\n\n### P 值与效应大小\n\n关于小样本 p 值一直存在这样的担忧，然而使用大样本数据也可能导致不良结果，即\
  \ p 值可能是正确的，但变化的幅度（效应）非常小。\n\n请看这个示例：您正在衡量在彩票中平均奖金为 1,000,000 美元或 1,000,001 美元时获胜的效应。\n\
  \n我们将生成两个概率样本：\n\n- X 包含 100 万个观测值，均值为 1,000,000\n- Y 也包含 100 万个观测值，但均值为 1,000,001，且仅相差\
  \ 1 个单位\n\n使用 X 和 Y 生成一个数据框并打印一些汇总统计量：\n\n```r\nset.seed(1020)\nlottery <- data.frame(\n\
  cbind(x=rnorm(n=1000000,1000000,100),y=rnorm(1000000,1000001,100)\n)\nsummary(lottery)\n\
  ```\n\n输出显示模拟的 X 和 Y 完全如我们所预期。两者观测值数量相同，但均值仅相差 1 个单位：\n\n| x | Y |\n|---|---|\n\
  | 最小值 : 999503 | 最小值 : 999513 |\n| 第 1 四分位数 : 999933 | 第 1 四分位数 : 999934 |\n| 中位数\
  \ :1000000 | 中位数 :1000001 |\n| 均值 :1000000 | 均值 :1000001 |\n| 第 3 四分位数 :1000067\
  \ | 第 3 四分位数 :1000068 |\n| 最大值 :1000526 | 最大值 :1000489 |\n\n如果对均值差异运行统计 t 检验，p 值会显示出基于\
  \ p 值的非常显著差异。但是，仅相差 1 美元：\n\n```r\nt.test(lottery$x,lottery$y)\n```\n\n写入控制台的输出如下：\n\
  \n```\nWelch Two Sample t-test\n\ndata:  lottery$x and lottery$y\nt = -7.4518, df\
  \ = 2000000, p-value = 9.209e-14\n```\n\n\n\n\n\n```\nalternative hypothesis: true\
  \ difference in means is not equal to\n95 percent confidence interval:\n-1.3303374\
  \ -0.7762632\nsample estimates:\nmean of x mean of y\n999999.9 1000001.0\n```\n\n\
  现在让我们重复这个模拟，但这次使用一个更小的 n 值来运行相同的代码，比如 n=100000：\n\n```\nset.seed(1020)\nlottery\
  \ <- data.frame(\ncbind(x=rnorm(n=100000,1000000,100), y=rnorm(n=100000,1000001,100))\n\
  )\nsummary(lottery)\n```\n\n这是写入控制台的输出：\n\n```\nx                 y\nMin.   : 999545\
  \   Min.   : 999590\n1st Qu.: 999933   1st Qu.: 999934\nMedian :1000000   Median\
  \ :1000000\nMean   :1000000   Mean   :1000001\n3rd Qu.:1000068   3rd Qu.:1000068\n\
  Max.   :1000446   Max.   :1000450\n```\n\n现在重新运行 t 检验，注意我们得到一个更大的 p 值 0.2492：\n\n\
  ```\nt.test(lottery$x,lottery$y)\n```\n\n这是写入控制台的输出：\n\n```\nWelch Two Sample t-test\n\
  \ndata:  lottery$x and lottery$y\nt = -1.1522, df = 200000, p-value = 0.2492\nalternative\
  \ hypothesis: true difference in means is not equal to\n95 percent confidence interval:\n\
  -1.3899758  0.3607735\nsample estimates:\nmean of x mean of y\n1000000   1000001\n\
  ```\n\n这里是这个练习的要点。\n\n如果这些是彩票中奖金额，大多数人不会在乎自己中了 $1,000,000 还是 $1,000,001（无论样本量大小），因此起作用的是效应大小，在此例中就是两个均值的差值（$1）。显然，对于大笔金额来说，$1\
  \ 并无区别，但重要的是，你需要知道在分析工作中，大约多大的变化对你来说是有意义的。\n\n### Variable selection\n\nStepwise\
  \ regression can be used as a variable selection method in cases in which you have\
  \ a large number of variables, and you need to define a starting point in which\
  \ you can start looking at a limited set of variables. However, all of the caveats\
  \ regarding p-values come into play here as well. Use this method only to look at\
  \ a candidate list of variables for model testing. It is not a good idea to use\
  \ stepwise regression to determine a final model, since there are several methods\
  \ use to determine the best variables, the final model can yield artificially high\
  \ and biased results.\n\nHowever, let's just start with identifying a list of potential\
  \ variables for our `PainGLM` model, which is small, but will be good to illustrate\
  \ the process. In the following example, the `stepwise()` function is used to determine\
  \ a maximum `AIC` using the stepwise regression `forward/backward` options.\n\n\
  The variable selection process starts by adding variables one at a time, and then\
  \ implementing a form of variable swapping, that is, taking into account whether\
  \ or not `AIC` would be improved by removing any variable which was already in the\
  \ model. Once `AIC` cannot be improved, the selection process stops.\n\n- In the\
  \ `PainGLM` example, the algorithm is illustrated, listing all the steps it goes\
  \ through to determine the final variables selected. It begins with an initial `AIC`\
  \ statistic of 83.5 (intercept-only model). Adding all of the variables into the\
  \ model produces an `AIC` of 73.48. However, the `AIC` can then be improved by removing\
  \ Duration. Therefore, it ends with a `Treatment, Age, and Gender` model with an\
  \ `AIC` of 58.77, since it can no longer improve the AIC:\n\n```\ninstall.packages(\"\
  RcmdrMisc\")\nlibrary(RcmdrMisc)\nstepwise(PainGLM,\n         direction='forward/backward',\n\
  \         criterion='AIC')\n```\n\nThe output of the stepwise function is written\
  \ to the console:\n\n```\nDirection:  forward/backward-\nCriterion:  AIC\n\nStart:\
  \  AIC=83.5\nPain ~ 1\n\n   Df Deviance    AIC\n+ Treatment   2   67.480  73.480\n\
  + Age         1   73.056  77.056\n+ Gender      1   75.849  79.849\n<none>     \
  \       81.503  83.503\n+ Duration    1   79.886  83.886\n\nStep:  AIC=73.48\nPain\
  \ ~ Treatment\n\n   Df Deviance    AIC\n+ Age         1   55.044  63.044\n+ Gender\
  \      1   59.886  67.886\n<none>            67.480  73.480\n+ Duration    1   66.688\
  \  74.688\n- Treatment   2   81.503  83.503\n\nStep:  AIC=63.04\nPain ~ Treatment\
  \ + Age\n\n   Df Deviance    AIC\n+ Gender      1   48.767  58.767\n<none>     \
  \       55.044  63.044\n+ Duration    1   55.036  65.036\n- Age         1   67.480\
  \  73.480\n- Treatment   2   73.056  77.056\n\nStep:  AIC=58.77\nPain ~ Treatment\
  \ + Age + Gender\n\n   Df Deviance    AIC\n<none>            48.767  58.767\n+ Duration\
  \    1   48.736  60.736\n- Gender      1   55.044  63.044\n- Age         1   59.886\
  \  67.886\n- Treatment   2   68.900  74.900\n```\n\n```\nCall: glm(formula = Pain\
  \ ~ Treatment + Age + Gender, family = data = df)\n\nCoefficients:\n(Intercept)\
  \ Treatment[T.B] Treatment[T.P] Age\n-20.8694 -0.5474 3.1790 0.2650\n\nDegrees of\
  \ Freedom: 59 Total (i.e. Null); 55 Residual\nNull Deviance: 81.5\nResidual Deviance:\
  \ 48.77 AIC: 58.77\n```\n\n### Interactions\n\nWe have seen that regression is additive,\
  \ that is, the prediction is mostly calculated via adding crossproducts of the coefficients\
  \ and independent single variables together. However, often single variables by\
  \ themselves are not enough to adequately predict an outcome in a simple regression\
  \ model. Often considering how say, predictor variable A affects predictor variable\
  \ B can improve the outcome. This also goes a long way in terms of explaining the\
  \ rationale behind using certain variables. The way two or more variables influence\
  \ each other is referred to as *interaction*, and using an interaction in a model\
  \ can produce an effect which is greater than the sum of their individual effects.\
  \ Usually, two or more interaction variables are involved, and the way that one\
  \ variable effects the dependent variable is conditional upon the different levels\
  \ or ranges of the other variables.\n\nIn this example, we will take our original\
  \ `Pain` model and determine if there is a separate effect for the different treatments\
  \ by age. Interaction effects can be specified in the model by using the : separator\
  \ (the colon). If we also want to include the individual variable effects as well\
  \ as the interaction we would use the * separator.\n\nFirst we will set up the model\
  \ as we did before, but specify an `Age:Treatment` effect in the model. We will\
  \ do this because we already know that Age and the Type of treatment independently\
  \ can predict the Pain outcome to some degree, but we are interested to see if knowing\
  \ the Age of the participant together with the type of treatment they received will\
  \ improve the model. If so, we could research administrating different treatments\
  \ to the various age groups, and as a result, affect the output variable (Pain):\n\
  \n```\ninstall.packages(\"effects\")\nlibrary(effects)\noutput <- glm(Pain ~ Treatment\
  \ + Gender + Age + Duration + Age:Treatment, data=df, family=\"binomial\")\nsummary(output)\n\
  ```\n\nThe output of the summary function is written to the console:\n\n```\nglm(formula\
  \ = Pain ~ Treatment + Gender + Age + Duration + Age:Treatment, family = \"binomial\"\
  , data = df)\n\nDeviance Residuals:\n    Min       1Q   Median       3Q      Max\
  \  \n-2.21745  -0.38598  -0.05829   0.44605   2.53761  \n\nCoefficients:\n     \
  \           Estimate Std. Error z value Pr(>|z|)    \n(Intercept)   -39.420723 \
  \ 20.276062  -1.944  0.0519 .  \nTreatmentB     -9.012876  31.965793  -0.282  0.7780\
  \    \nTreatmentP     38.338070  21.827078   1.756  0.0790 .  \nGenderM        1.957605\
  \   0.872107   2.245  0.0248 *  \nAge            0.524314   0.283665   1.848  0.0646\
  \ .  \nDuration       0.003562   0.036643   0.097  0.9226    \nTreatmentB:Age  0.100597\
  \   0.433846   0.232  0.8166    \nTreatmentP:Age -0.504315   0.307248  -1.641  0.1007\
  \    \n---\nSignif. codes:  0 '***' 0.001 '**' 0.01 '*' 0.05 '.' 0.1 ' ' 1\n\n(Dispersion\
  \ parameter for binomial family taken to be 1)\n\n    Null deviance: 81.503  on\
  \ 59  degrees of freedom\nResidual deviance: 41.928  on 52  degrees of freedom\n\
  AIC: 57.928\n\nNumber of Fisher Scoring iterations: 7\n```\n\nIn the output that\
  \ appears preceding, note that instead of having one coefficient for Treatment,\
  \ we have two separate coefficients for TreatmentB and TreatmentP, as well as the\
  \ interaction of these levels versus Age. Note that none of the new interaction\
  \ terms have significance codes in the last column.\n\n### Interaction effects plot:\n\
  \n\n交互效果图可以使用 `effects()` 函数的 plot 来显示：\n\n```\nplot(effect(\"Treatment*Age\", output,\
  \ xlevels=list(age=0:99)),\nticks=list(at=c(.001, .005, .01, .05, seq(.1,.9,by=.2),\
  \ .95, .99,\n```\n\n如图所示，TreatmentP（安慰剂）与 Age 之间没有交互作用，这符合对照研究的预期。图还显示了另外两种治疗中 Age\
  \ 与 Pain 之间的关系，但差异不够显著（在 0.05 水平上），不足以证明将其作为个体化系数包含在内：\n\n![](img/672c0cf8ba3c000a6529b117ed96945e_218_0.png)\n\
  \n## 拟合优度统计量\n\n拟合优度检验用于确定模型与数据的拟合程度。判断数据与逻辑回归模型拟合程度的方法有多种：\n\n- **数据划分**：我们学习的一种方法是将数据分为训练集和测试集，并衡量它们产生相似结果的程度。该方法在第\
  \ 2 章“建模过程”中进行了演示。\n\n- **单一指标**：另一种方法是提出一个定量指标，在 0 到 1 的范围内衡量自变量预测因变量的效果，0 表示无预测能力，1\
  \ 表示最佳预测能力。**曲线下面积 (AUC)** 和 R 平方是此类**拟合优度 (GOF)** 检验的示例。\n\n- R 平方是评估拟合优度的常用方法，它大致衡量模型中解释变异量与总变异量之比。在线性回归中，它是通过先计算残差平方和与总平方和的比率，然后用\
  \ 1 减去该结果来计算的。（决定系数）\n\n```\nR^2 \\equiv 1 - \\frac{SS_{res}}{SS_{tot}}.\n```\n\n\
  - 有趣的是，逻辑回归没有 R 平方统计量。这是因为 R 平方基于这样一个假设：所拟合的模型是线性的，而正如我们所见，逻辑回归不做此假设。不过，已经开发出了伪\
  \ R 平方指标，它们采用相同的 0-1 量表。其中之一是 McFadden 统计量。\n\n### McFadden 统计量\n\nMcFadden 统计量通过查看完整模型的对数似然（类似于先前定义的\
  \ OLS R 平方模型公式中的误差平方和之和）与仅截距模型的对数似然（类似于 R 平方总平方和分母）之比，近似一个 R 平方类型的指标。这近似了逻辑模型相对于仅截距零模型的改进程度。McFadden\
  \ 统计量可被视为一种伪 R 平方，因为它试图衡量相同的内容，并在相同的 0-1 量表内产生类似的 R 平方结果。\n\n以下是来自 UCLA 数字研究与教育研究所的\
  \ McFadden 公式。（常见问题解答：什么是伪 R 平方？）：\n\n```\n$R^2 \\equiv 1 - \\frac{ln \\hat{L}(M_{Full})}{ln\
  \ \\hat{L}(M_{Intercept})}$\n```\n\n在以下代码中，0.40 的 McFadden 统计量表明该模型具有相当好的拟合度：\n\n\
  ```\ninstall.packages(\"pscl\")\nlibrary(pscl)\npR2 (PainGLM)\n```\n\npR2() 函数的输出写入控制台：\n\
  \n```\nllh      llhNull       G2    McFadden      r2ML\n-24.3678589 -40.7515960\
  \  32.7674742   0.4020392   0.4208099\n              r2CU\n              0.5664233\n\
  ```\n\n### 置信区间和 Wald 统计量\n\nWald 检验用于评估模型中每个系数的统计显著性，计算方法是取回归系数平方与系数标准误差平方的比率。其思路是检验模型中自变量系数与零之间是否没有显著差异的假设。\n\
  \n输出显示 95% 置信区间（下限为 2.5%，上限为 97.5%）。给出了两个区间，一个用于实际模型系数，另一个用于指数化系数。我们可以再次看到，0 包含在\
  \ `Duration` 的范围内，因此可以考虑从模型中移除该变量：\n\n```\nconfint(output, level=0.95, type=\"Wald\"\
  )\n```\n\n`confint()` 函数的输出写入控制台：\n\n| | 估计值 | 2.5 % | 97.5 % | exp(估计值) |\n|---|---|---|---|---|\n\
  | (截距) | -20.588282035 | -34.50967776 | -6.66688631 | 1.144518 |\n| Treatment[T.B]\
  \ | -0.526852662 | -2.36338765 | 1.30968232 | 5.904604 |\n| Treatment[T.P] | 3.181689786\
  \ | 1.19032495 | 5.17305463 | 2.408742 |\n| Gender[T.M] | 1.832202124 | 0.27166722\
  \ | 3.39273703 | 6.247630 |\n| Age | 0.262093311 | 0.07195380 | 0.45223282 | 1.299648\
  \ |\n| Duration | -0.005858679 | -0.07052171 | 0.05880435 | 9.941584 |\n\n| | 2.5\
  \ % | 97.5 % |\n|---|---|---|\n| (截距) | 1.029526e-15 | 1.272354e-03 |\n| Treatment[T.B]\
  \ | 9.410090e-02 | 3.704997e+00 |\n| Treatment[T.P] | 3.288150e+00 | 1.764530e+02\
  \ |\n| Gender[T.M] | 1.312150e+00 | 2.974726e+01 |\n| Age | 1.074606e+00 | 1.571818e+00\
  \ |\n| Duration | 9.319075e-01 | 1.060568e+00 |\n\n### 基础回归诊断图\n\n图表对诊断拟合优度及回归模型相关的潜在问题至关重要。这四个图可帮助您识别与回归不太吻合的观测值，并应单独查看以了解它们是否有什么特别之处。这只是开发模型过程中迭代过程的一部分，其本身并不表明模型不好。\n\
  \n为 `PainGLM` 运行基本图。请注意，我们将在 2x2 四分图中绘制这四个图：\n\n```\noldpar <- par(oma=c(0,0,3,0),\
  \ mfrow=c(2,2))\nplot (PainGLM)\npar(oldpar)\n```\n\n### glm(Pain ~ Treatment +\
  \ Gender + Age + Duration)\n\n![](img/672c0cf8ba3c000a6529b117ed96945e_222_0.png)\n\
  \n### 图表说明\n\n残差与拟合值：残差与拟合值图有助于确定残差中是否存在任何模式。理想情况下，模式（或理想情况下无模式）应为残差围绕水平线的随机散点。\n\
  \n如果存在任何明显模式，最好重新检查一些双变量相关性或偏回归图，以尝试将该区域与原始散点图联系起来：\n\n- **正态 Q-Q**：此图将指示残差是否服从正态分布。如果残差沿直线分布，则是一个好迹象。\n\
  \n- **尺度位置**：此图用于检查等方差假设。如果该图显示残差沿预测变量范围均匀分布，也是一个好迹象。这就是检查等方差假设（同方差性）的方法。如果看到水平（红色）参考线，且点随机等距分布在该线周围，则是好的迹象。\n\
  \n- **残差与杠杆值**：此图将有助于识别哪些异常值影响回归估计。并非所有异常值都会影响回归，即使它们远离回归线。虚线外的异常值是可能影响回归系数的异常值，如果将其从分析中移除，您的结果可能会发生变化。\n\
  \n### 交互式游戏：猜测残差是否随机\n\n查看诊断图时，您只看到残差的一种可能分布。`TeachingDemos` 库有一个名为 `vis.test` 的有趣交互函数，它会挑战您从回归生成的残差中挑选出来，并与同一回归的另一组随机生成的残差进行对比。请记住，残差应该是随机的，因此该测试本质上对残差进行随机化。如果您能从生成的其他残差中辨别出自己的残差，则残差未通过测试，测试将得出结论（当然带有\
  \ p 值）称您的残差确实不是随机的，这将迫使您重新开始建模。\n\n要运行测试并玩游戏，请运行以下代码：\n\n```\ninstall.packages(\"\
  TeachingDemos\")\nlibrary(TeachingDemos)\nset.seed(1)\nif (interactive()) {vis.test(residuals(PainGLM,\
  \ type=\"response\"),\n```\n\n出现以下图案后，单击您认为与先前第 1 行第 2 列的正态 Q-Q 图相匹配的图案：\n\n\n![](img/672c0cf8ba3c000a6529b117ed96945e_224_0.png)\n\
  \nAfter clicking your answer, the function will test if you matched correctly, and\
  \ what the probability was. If you keep on getting it wrong, reduce the number of\
  \ rows and columns until you are able to match the Q-Q plot.\n\n### Goodness of\
  \ fit — Hosmer-Lemeshow test\n\nThis goodness of fit test will look at subgroups\
  \ of the predicted probabilities, for example, the probability ranges grouped into\
  \ 10 (deciles), and measuring whether or not the prediction of the response variable\
  \ is significantly different from what would be expected by chance.\n\nFirst the\
  \ data is grouped by their predicted probabilities from lowest to highest, and then\
  \ binned into equally-sized groups.\n\nThen a chi-square test is used to compare\
  \ the predicted probability of each binned group to their expected probabilities.\
  \ In a good model, predictions should do better than what is expected for most of\
  \ the binned groups. If it does not, the groups which are problematic will be indicated\
  \ in the predicted vs. expected plot, and you will be able to go back and attempt\
  \ to identify any potential model problems.\n\n#### Goodness of fit example on the\
  \ PainGLM data\n\nIn the following example, we will apply the Hosmer-Lemeshow test\
  \ to the PainGLM dataset. We will implement the Hosmer-Lemeshow test via the `hoslem.test()`\
  \ function contained within the `ResourceSelection` package.\n\nTo set up the test,\
  \ supply the observed values, with the fitted (predicted) values as part of the\
  \ `hoslem.test()` function:\n\n```\ninstall.packages(\"ResourceSelection\")\nlibrary(ResourceSelection)\n\
  hoslem.test(PainGLM$y, fitted(PainGLM))\n```\n\nThe `hoslem.test` output is written\
  \ to the console:\n\n```\nHosmer and Lemeshow goodness of fit (GOF) test\n\ndata:\
  \  PainGLM$y, fitted(PainGLM)\nX-squared = 8.4981, df = 8, p-value = 0.3864\n```\n\
  \nFrom the p-value statistic (0.38) the test shows that there is no problem with\
  \ the fit.\n\nThe following plot shows that some of the predicted probabilities\
  \ are better than expected (above the line). Some of the bins do better than expected,\
  \ and others do worse, relative to the ideal straight line.\n\nWe can see the bins,\
  \ predicted, and observed values using a `cbind()` function:\n\n`cbind(hoslem$observed,hoslem$expected)`\n\
  \n| 分组 | y0 | y1 | yhat0 | yhat1 |\n|---|---|---|---|---|\n| [0.0143,0.02] | 6 |\
  \ 0 | 5.8984765 | 0.1015235 |\n| (0.02,0.0668] | 6 | 0 | 5.7762161 | 0.2237839 |\n\
  | (0.0668,0.128] | 5 | 1 | 5.4894519 | 0.5105481 |\n| (0.128,0.246] | 5 | 1 | 4.9134095\
  \ | 1.0865905 |\n| (0.246,0.353] | 5 | 1 | 4.1805425 | 1.8194575 |\n| (0.353,0.502]\
  \ | 4 | 2 | 3.4564716 | 2.5435284 |\n| (0.502,0.632] | 2 | 4 | 2.6816122 | 3.3183878\
  \ |\n| (0.632,0.807] | 1 | 5 | 1.5600375 | 4.4399625 |\n| (0.807,0.903] | 0 | 6\
  \ | 0.9008531 | 5.0991469 |\n| (0.903,0.998] | 1 | 5 | 0.1429292 | 5.8570708 |\n\
  \n## Regularization\n\nIn certain cases in which you have a large number of variables,\
  \ you can end up overfitting the model. This will result in a biased model with\
  \ some variables having more of an influence on the prediction than is reasonable\
  \ to expect.\n\nOne way to deal with this is to select a subset of the original\
  \ variables. We demonstrated all subsets regression which only considers a reduced\
  \ number of variables for a final model. However, in some cases you may want to\
  \ keep all or most of the variables in your model. For example, if you know via\
  \ past studies that particular variables should always be included, you would want\
  \ to keep that in the model, even though it might drop out of contention after a\
  \ variable selection procedure has been run.\n\nRegularization in regression is\
  \ a method by which certain coefficients are reduced or even set to 0 in an effort\
  \ to reduce their influence. While I believe it is always the better course to simplify\
  \ the model by reducing the model to the most important variables, regularization\
  \ can also help to reduce multicollinearity, or correlation between the independent\
  \ variables, along with some other techniques that we have discussed such as principal\
  \ components.\n\nIf you do choose the regularization path, there are many regularization\
  \ options. Some of the regularization methods are ridge regression, LASSO, or LARS.\n\
  \n### An example — ElasticNet\n\nTo illustrate regularization for our PainGLM data,\
  \ we will use the ElasticNet regularization algorithm (contained within the glmnet\
  \ package), which combines several different methods of regularization.\n\nStart\
  \ by creating some dummy variables using the model.matrix() function which we have\
  \ used previously. Then, merge in the Duration variable to form a new matrix:\n\n\
  ```\ndummy.vars <- model.matrix(df$Pain ~ df$Treatment + df$Gender + d\nx <- as.matrix(data.frame(df$Duration,dummy.vars))\n\
  head(x)\n```\n\nThis is the following output:\n\n| | df.Treatment.T.B | df.Treatment.T.P\
  \ | df.Gender.T.M | df.Age | df.Duration |\n|---|---|---|---|---|---|\n| 1 | 0 |\
  \ 1 | 0 | 68 | |\n| 2 | 0 | 1 | 1 | 66 | |\n| 3 | 0 | 0 | 0 | 71 | |\n| 4 | 0 |\
  \ 0 | 1 | 71 | |\n| 5 | 1 | 0 | 0 | 66 | |\n| 6 | 0 | 0 | 0 | 64 | |\n\nNext, run\
  \ Lasso regularization (alpha=1) on the model, using matrix x as input, and setting\
  \ the Pain as the target variable. Note that the syntax for glmnet is similar to\
  \ that of the glm function which we used earlier:\n\n```\ninstall.packages(\"glmnet\"\
  )\nlibrary(glmnet)\noptions(scipen = 999)\nmod.result<-glmnet(x, y=as.factor(df$Pain),\
  \ alpha=1, family='binomial')\n```\n\n### Choosing a correct lambda\n\nThe model\
  \ output will show the ranges of lambda (the regularization parameter), which will\
  \ smooth out the effects of the various coefficients to different degrees.\n\nA\
  \ plot of `mod.result` will display the size of the coefficients as lambda changes:\n\
  \n```\nplot(mod.result,xvar=\"lambda\")\n```\n\nThe parameter lambda controls the\
  \ amount of shrinkage for the coefficients.\n\nNotice that as lambda gets larger,\
  \ more coefficients will be shrinking towards 0:\n\n![](img/672c0cf8ba3c000a6529b117ed96945e_229_0.png)\n\
  \nIf you print some of the results you will see how many non-zero coefficients are\
  \ included in the model for each lambda, as well as the percent deviation for each\
  \ model. This will help you select an appropriate lambda for your model:\n\n```\n\
  head(print(mod.result))\n```\n\nThe table of Lambda's are written to the console:\n\
  \n| 索引 | 自由度 | 偏差百分比 | Lambda |\n|---|---|---|---|\n| [1,] | 0 | -0.0000000000000004904\
  \ | 0.2357 |\n| [2,] | 1 | 0.028449999999999996 | 0.2148 |\n| [3,] | 1 | 0.0519700000000000023\
  \ | 0.1957 |\n| [4,] | 2 | 0.0739900000000000002 | 0.1783 |\n| [5,] | 2 | 0.107100000000000008\
  \ | 0.1625 |\n| [6,] | 2 | 0.1351999999999999869 | 0.1480 |\n\n```\ntail(print(mod.result))\n\
  ```\n\n| 索引 | 自由度 | 偏差百分比 | Lambda |\n|---|---|---|---|\n| [56,] | 5 | 0.4019 |\
  \ 0.0014130 |\n| [57,] | 5 | 0.4019 | 0.0012870 |\n| [58,] | 5 | 0.4020 | 0.0011730\
  \ |\n| [59,] | 5 | 0.4020 | 0.0010690 |\n| [60,] | 5 | 0.4020 | 0.0009739 |\n| [61,]\
  \ | 5 | 0.4020 | 0.0008874 |\n\n### Printing out the possible coefficients based\
  \ on Lambda\n\nUsing some of the lambda values, you can print out the different\
  \ coefficients for each model.\n\nThis will also help you choose a lambda value\
  \ that is good for your model:\n\n```\ncoef(mod.result,s=0.1957000)   #  4 of 5\
  \ coefficient are at 0,\ncoef(mod.result,s=0.0131800)   #    only 1 coefficient\
  \ is set to\ncoef(mod.result,s=0.0120100)   #    All coefficients are include\n\
  coef(mod.result,s=0.01)\n```\n\nUsing a lambda of .01 will use all of the variables,\
  \ so let's print out the coefficients using that value:\n\n```\ncoef(mod.result,s=0.01)\n\
  ```\n\n| | 1 |\n|---|---|\n| （截距） | -17.57297008856023268208 |\n| df.Duration |\
  \ -0.000962546 |\n| df.TreatmentB | -0.33638216397784859168 |\n| df.TreatmentP |\
  \ 2.82134076268210698402 |\n| df.GenderM | 1.54779351031200929079 |\n| df.Age |\
  \ 0.22139548722788335300 |\n| df.Duration.1 | . |\n\nComparing the regularized coefficients\
  \ with the original glm coefficients, you can observe that the magnitude of the\
  \ coefficients has been reduced. As an exercise, try experimenting with different\
  \ lambda values and observe how the coefficients change:\n\n```\nCoefficients:\n\
  ```\n\n| | 估计值 | 标准误 | z 值 | Pr(>|z|) |\n|---|---|---|---|---|\n| （截距） | -20.588282\
  \ | 7.102883 | -2.899 | 0.00375  ** |\n| TreatmentB | -0.526853 | 0.937025 | -0.562\
  \ | 0.57394 |\n| TreatmentP | 3.181690 | 1.016021 | 3.132 | 0.00174  ** |\n\n\n\n\
  \n\n| GenderM | 1.832202 | 0.796206 | 2.301 | 0.02138 | * |\n| --- | --- | --- |\
  \ --- | --- | --- |\n| Age | 0.262093 | 0.097012 | 2.702 | 0.00690 | ** |\n| Duration\
  \ | -0.005859 | 0.032992 | -0.178 | 0.85905 | |\n\n## 摘要\n\n在本章中，我们首先讨论了监督学习和无监督学习，并强调了纯粹预测分析与探索性分析之间的区别。接着，我们介绍了核心算法中的第一种（广义线性模型），它们在预测分析领域非常重要。随后，我们讨论了各种回归方法及其优缺点，并指出回归是一种极其灵活且研究充分的统计建模工具。然后，我们使用疼痛阈值研究来展示逻辑回归和正则化回归的示例，同时讨论了交互作用、p值和效应量等重要回归概念。\n\
  \n在下一章中，我们将继续讨论核心预测分析算法，重点介绍另外三种算法，即决策树、聚类和支持向量机。\n"
- "# 第 5 章. 决策树、聚类和 SVM 简介\n\n> 我的兴趣在于未来，因为我将把余生都度过在那里\n\n> Charles F. Kettering\n\
  \n## 决策树算法\n\n决策树被认为是一个很好的入门预测模型，并具有许多优势。可解释性、变量选择、变量交互，以及选择决策树复杂程度的灵活性，都发挥着作用。\n\
  \n决策树方法被视为分类方法，因此决策树的典型用例是预测类别或类别。但是，也存在某些类型的决策树，称为回归树，其中输出是连续变量。通过这种方式，我们可以开始开发混合数值变量和分类变量的模型。\n\
  \n决策树在营销和广告中大量使用，以及在任何需要将客户细分为不同群体的行业中。它们也用于医疗保健中的疾病和风险分类。\n\n## 决策树的优势\n\n决策树具有许多优势。技术人员和业务人员都能轻松理解它们，并且可以以极度简化或详细的方式呈现。\n\
  \n它们可以根据受众类型进行专门定制，具体取决于领域特定变量的包含或排除以及复杂程度。当变量数量较少到中等且通常被理解时，它们最有用，而目标是了解它们之间的交互。决策树也是讲故事的良好载体，因为树的自然表达及其分裂机制与业务规则决策非常契合，并且在必要时可以检查和质疑每个特定节点。\n\
  \n决策树可以处理分类变量和数值变量，并处理缺失值。无需丢弃或填补它们。\n\n## 决策树的劣势\n\n大多数决策树使用所谓的贪婪算法。对于贪婪的含义有许多定义，但我喜欢这样一种定义：它始终基于当时可用的任何信息做出最优选择。构建树时不使用后见之明。数据的轻微变化可能会改变结果，如果在后续样本上运行该算法，结果可能不会以完全相同的方式复制。在自动化运行时，也很难强制树按照你想要的方式分裂。如果你想精确控制分裂，最好使用交互式决策树，你可以通过点击来拆分节点。不幸的是，这方面的开源选项不多。\n\
  \n另外，决策树算法中存在内置偏差，即偏好具有大量类别的变量。这使得算法能够拆分大型类别，即使结果没有任何意义（我们将在示例中看到这一点）。大树可能会产生无效或荒谬的结果，尤其是当树的大小非常大时。过拟合很常见，但有一种称为剪枝的技术可用于减少这种情况。随机森林树在某种程度上可以帮助缓解这些劣势，因为并非所有变量都包含在每棵树中，并且它使用共识构建来生成结果。\n\
  \n尽管决策树存在这些劣势，我仍主张将其更多地作为探索性工具（无监督学习）来使用，当以有组织和有条理的方法进行分析时，你会发现它们非常擅长挖掘数据中存在的许多重要关系。这也是验证其他类型模型所获得结果的好方法。如果你发现其他模型获得的结果远好于你，而你无法在决策树模型中直观复现，那么很有可能，更复杂模型的结果在未来也无法复制。\n\
  \n## 基本决策树概念\n\n决策树算法类似于 20 个问题游戏，或动物、植物、矿物游戏。基本决策树算法将从树的根开始，代表所有数据，并继续根据最优方法将每个类别拆分为两个单独的类别，以便能够猜测识别这两个类别的最佳特征。这称为**拆分节点**。然后，算法将继续拆分数据，直到无法再拆分为止，或者基于控制参数以其他方式停止。\n\
  \n例如，如果我们想根据骨质疏松、缺血性心脏病和平均处方数量来分类性别，我们可以开发一棵类似这样的树：\n\n![](img/672c0cf8ba3c000a6529b117ed96945e_236_0.png)\n\
  \n请注意，第一个问题是“患者是否患有骨质疏松？”。然后，基于答案，会问另一系列问题，最终将患者放置在树的终端节点中，在该节点中无法再提出能够改善结果的问题。\n\
  \n### 生长树\n\n我们的原始节点始终从树的根开始。在前面的图表中，第一个节点仅从按性别划分的人群描述开始。在这种情况下，女性占多数类，占人口的 58%。决策树算法的目标是始终生长树并改进预测。因此，在这一点上，我们希望在性别预测上优于\
  \ 58%。\n\n在生长树时，始终需要考虑两个问题：\n\n- 哪个变量能最好地改善目标变量每个类别的预测？\n- 对于该变量，最佳分割点是什么，能够将分类变量分成两部分，或将连续变量分成两部分，并改善该类别的预测？\n\
  \n此决策的结果将是一个新的树节点或叶子节点。在经典决策树中，通常有两条路径（是或否，高或低），但根据算法，也可能有超过两条路径。\n\n在前面的示例中，算法首先会遍历所有变量并确定哪个能改善预测。该变量恰好是骨质疏松的存在。如果存在骨质疏松，可以以\
  \ 74% 的准确率预测患者是女性。但是，当不存在骨质疏松时，成为女性的概率实际上会降至 51%，这略低于研究中女性原来的 58% 占比。\n\n等等。分区算法将继续尝试再次拆分数据。这次它将平均处方数量变量作为改善预测的方法。在这项分析中，每个受益人每年的平均处方数量大约从每年\
  \ 15 个到约 200 个。算法将尝试此范围内的所有值，将数据拆分为两部分。例如，它可能首先尝试比较拥有 10 个或更多处方的患者与拥有 9 个或更少处方的患者。然后它将查看该切断点的预测。接着，它将继续更改切断值，直到找到优化两个类别之间分离的切断值。\n\
  \n在此示例中，它发现 51 个处方是优化的切断点\n\n\n\n\n对于未患骨质疏松的患者进行分割。当处方数量大于 50 时，患者为男性的概率为 64%。\n\
  \n### 不纯度\n\n当一个节点根据最佳标准分割后，会检查生成的节点的不纯度。不纯度衡量类别的分离程度，基于该点处应有的预期频率。对于二元分类，最不纯的情况是节点被\
  \ 50/50 分割。这本质上指定了随机的类别分配。不纯度最低的情况是决策规则将所有观测值完全归入一个类别，而另一个类别中有 0 个观测值。这是更理想的情况，因为它允许我们对该节点做出完美预测。\n\
  \n计算出不纯度指标后，算法将计算信息增益指标，该指标计算通过分割每个变量使不纯度降低了多少，并接着计算连续变量的所有可能分割点。\n\n### 控制树的生长\n\
  \nCART 的一个特点是（在 R 中作为 rpart 实现），它会尝试所有可能的变量和分割点，直到找到最佳的变量。具体取决于算法的配置方式，这可能是实现最高信息增益的变量。然而，在实际应用中，很少有树是在没有边界限制的情况下生长的。树是在约束条件下生长的。约束示例包括指定可以生长的最大分支数，或叶节点中包含的最小观测数量。因此，预测建模者可以构建出尽可能简单或尽可能复杂的树。\n\
  \n### 决策树算法的类型\n\n在 R 中，将介绍两种决策树算法。我们将首先了解传统的算法，即 rpart，并分析 `state.x77` 数据，以基于多个属性确定预期寿命。\n\
  \n以下是 `state.x77` 数据的元数据描述。您也可以在 R 控制台中输入 `?x77.data` 以获取有关此表的更多信息。\n\n| 变量 | 描述\
  \ |\n| --- | --- |\n| 人口 | 1975 年 7 月 1 日的人口估计值 |\n| 收入 | 人均收入（1974 年） |\n| 文盲率\
  \ | 文盲率（1970 年，人口百分比） |\n| 预期寿命 | 预期寿命（年）（1969-71 年） |\n| 谋杀率 | 每 10 万人口的谋杀及过失杀人率（1976\
  \ 年） |\n| 高中毕业生比例 | 高中毕业生百分比（1970 年） |\n| 霜冻天数 | 首府或大城市最低温度低于冰点的天数平均值（1931-1960\
  \ 年） |\n| 面积 | 陆地面积（平方英里） |\n\n首先，我们将此数据与另外两个参考数据集合并。使用 R 帮助系统获取关于附加表的更多信息：\n\n\
  - state.abb：获取州缩写\n- state.region：获取州的地理区域\n\n```\nstatedf <- as.data.frame(state.x77)\n\
  x <- data.frame(statedf, state.abb, state.region)\nsummary(x)\n```\n\nsummary()\
  \ 函数的输出将出现在控制台中：\n\n```\n> summary(x)\n```\n\n| 变量 | 最小值 | 下四分位数 | 中位数 | 均值 | 上四分位数\
  \ | 最大值 |\n| --- | --- | --- | --- | --- | --- | --- |\n| 人口 | 365 | 1080 | 2838\
  \ | 4246 | 4968 | 21198 |\n| 收入 | 3098 | 3993 | 4519 | 4436 | 4814 | 6315 |\n| 文盲率\
  \ | 0.500 | 0.625 | 0.950 | 1.170 | 1.575 | 2.800 |\n| 预期寿命 | 67.96 | 70.12 | 70.67\
  \ | 70.88 | 71.89 | 73.60 |\n| 谋杀率 | 1.400 | 4.350 | 6.850 | 7.378 | 10.675 | 15.100\
  \ |\n| 高中毕业生比例 | 37.80 | 48.05 | 53.25 | 53.11 | 59.15 | 67.30 |\n| 霜冻天数 | 0.00\
  \ | 66.25 | 114.50 | 104.46 | 139.75 | 188.00 |\n| 面积 | 1049 | 36985 | 54277 | 70736\
  \ | 81163 | 566432 |\n\n| 州缩写 | 计数 |\n| --- | --- |\n| AK | 1 |\n| AL | 1 |\n| AR\
  \ | 1 |\n| AZ | 1 |\n| CA | 1 |\n| CO | 1 |\n| (其他) | 44 |\n\n| 州区域 | 计数 |\n| ---\
  \ | --- |\n| 东北部 | 9 |\n| 东南部 | 16 |\n| 北中部 | 12 |\n| 西部 | 13 |\n\n### 检查目标变量\n\n\
  对目标变量预期寿命绘制直方图可显示出相当大的变异。因此，它可以被视为一个良好的潜在目标变量。\n\n```\nhist(x$Life.Exp)\n```\n\n\
  ![](img/672c0cf8ba3c000a6529b117ed96945e_241_0.png)\n\n### 在 rpart 模型中使用公式表示法\n\n\
  我们已经了解了如何在 R 中使用公式表示法指定回归模型。例如，我们使用 `lm(women$height ~ women$weight)` 根据体重预测身高。\n\
  \n回归模型中公式表示法的一般形式为：\n\n*因变量 ~ 自变量*\n\n其中，因变量位于波浪号（~）左侧，自变量位于波浪号（~）右侧。\n\nrpart 模型也可以使用公式表示法进行设置，只是术语略有变化。在\
  \ rpart 模型中，我们可以将目标变量（Life.Exp）指定在波浪号（~）左侧，将预测变量指定在波浪号（~）右侧。我们将使用点表示法（.）来指示将考虑 _所有_\
  \ 变量。\n\n### 注意\n\n点表示法是指定所有变量的一种便捷方式；不过，在构建模型时，您可能希望避免使用它，而是指定感兴趣的变量的具体列表。这将加快处理速度，并避免不必要的分割。\n\
  \n在以下示例中，您可以看到 rpart 将选择 `state` 作为最佳初始分割变量。虽然这最终可能会生长出一棵非常准确的树，但在预测能力方面，最初基于 state\
  \ 等高维变量进行分割并不能提供关于导致预期寿命变化的原因的深入了解。州始终有可能被细分为地理区域。但通常您会得到一些毫无意义的州分割结果。\n\n在以下示例中，我们将使用\
  \ `rpart()` 函数生成一个简单的决策树。我们还将使用程序包 `rpart.plot` 中的 `prp()` 函数来可视化树：\n\n```\ninstall.packages(\"\
  rpart\")\ninstall.packages(\"rattle\")\ninstall.packages(\"rpart.plot\")\ninstall.packages(\"\
  RColorBrewer\")\n\nlibrary(rpart)\nlibrary(rattle)\nlibrary(rpart.plot)\nlibrary(RColorBrewer)\n\
  set.seed(1020)\ny1 <- rpart(Life.Exp ~ .,data=x,cp=.01)\nprp(y1, type=4, extra=1)\n\
  ```\n\n### 对图表的解读\n\n在以下图表中，节点的分割完全基于 state，并未体现州是如何分组的。请注意，`state.region` 在分割算法中根本不起作用，因此可以合理推测，许多分割纯属机械操作，且从视觉上看，许多分割中并未反映出明显的分组：\n\
  \n![](img/672c0cf8ba3c000a6529b117ed96945e_243_0.png)\n\n### 打印决策树的文本版本\n\n打印 rpart\
  \ 对象还会给出文本输出，显示每个分割点后各类别的成员。带有星号（*）的条目为终端节点。终端节点无法再进一步分割。通常，可以仅根据终端节点进行分段，假设其规模足够大，以便基于其做出的决策可付诸实施：\n\
  \n```\n> print(y1)\n```\n\n此 print() 函数将输出发送到控制台：\n\n```\nn= 50\nnode), split, n,\
  \ deviance, yval\n* denotes terminal node\n1) root 50 88.2990000 70.87860\n2) state.abb=AK,AL,AR,AZ,DE,FL,GA,IL,IN,KY,LA,MD,ME,MI,MO,MS,MT,N\n\
  4) state.abb=AK,AL,GA,LA,MS,NC,NV,SC,WV 9 2.2790220 68.82556 *\n5) state.abb=AR,AZ,DE,FL,IL,IN,KY,MD,ME,MI,MO,MT,NJ,NM,NY,OH,PA,T\n\
  10) state.abb=DE,IL,KY,MD,ME,NM,PA,TN,VA,WY 10 0.1656400 70.2140\n11) state.abb=AR,AZ,FL,IN,MI,MO,MT,NJ,NY,OH,TX\
  \ 11 0.2109636 70.7\n3) state.abb=CA,CO,CT,HI,IA,ID,KS,MA,MN,ND,NE,NH,OK,OR,RI,SD,UT,V\n\
  6) state.abb=CA,CO,ID,MA,NH,OK,OR,RI,SD,VT,WA 11 0.7760909 71.78\n7) state.abb=CT,HI,IA,KS,MN,ND,NE,UT,WI\
  \ 9 1.0192890 72.77111 *\n```\n\n如果从模型中移除 state，我们将开始使用一个更易于理解的模型。在 prp() 函数绘制结果后，您可以看到树的左侧分支完全基于较高的谋杀率。\n\
  该分支的两个终端节点表明，谋杀率 >= 11% 的地区预期寿命比谋杀率 < 11% 的地区低一年。\n\n树的右侧分支集中在较低的谋杀率上。对于这些分支，会考虑区域。北区和南区的预期寿命比西区或北中部地区低一年：\n\
  \n```\ny2 <- rpart(Life.Exp ~ Population + Income + Illiteracy +\nMurder +\nHS.Grad\
  \ +\nFrost +\nArea +\nstate.region,method='anova',\ndata=x\n)\nprp(y2, type=4, extra=1)\n\
  ```\n\n\n\n\n![](img/672c0cf8ba3c000a6529b117ed96945e_245_0.png)\n\n### ctree 算法\n\
  \nctree 函数相对于 rpart 具有一些优势，因为它产生的结果可能更直观一些。与仅根据生成节点的纯度来优化结果节点不同，ctree 使用统计假设检验来确定分割的结果在统计上是否显著。它使用卡方检验统计量来检验关联，仅保留显著的关联，从而消除由于类别数量较多而产生的偏差。因此，虽然在某些情况下准确性可能会受影响，但通过使结果更具解释性获得了益处：\n\
  \n```\ninstall.packages(\"partykit\")\nlibrary(partykit)\ny2 <- ctree(Life.Exp ~\
  \ .,data=x)\ny2\nplot(y2)\n```\n\n从下图可以看出，ctree 和 rpart 在第一个分割（murder）上达成一致，且切断点非常相似。由于该分割得到两种不同算法的验证，这可以增加对第一个分割的可信度：\n\
  \n![](img/672c0cf8ba3c000a6529b117ed96945e_246_0.png)\n\n### 剪枝\n\n剪枝是防止过拟合的另一种方法。如果您直观地检查一棵树，并希望在某个特定点停止分支的生长，则可以剪掉该节点下的所有分支，使该节点下的所有结果合并为一个节点。这可能会为该点显示的决策规则提供更具可解释性的结果。\n\
  \nrpart 具有一个独特的交互式剪枝功能，使用 prp() 函数可以帮助您完成此操作。\n\n在前面的 states 示例中，您可能希望移除节点 70 下的所有节点，以平衡树并将其保持在两层深度。平衡树也可以被视为一种可取的特征：\n\
  \n```\nPrunedTree <- prp(y1,type=4, extra=1,snip=TRUE)$obj\n```\n\n单击节点 70，并在控制台中观察“删除节点\
  \ 5”的消息。看到该消息后，在图中单击退出：\n\n```\n> PrunedTree <- prp(y1,type=4, extra=1,snip=TRUE)$obj\n\
  Click to snip ...\nDelete node 5 state.ab = DE,IL,KY,MD,ME,NM,PA,TN,VA,WY\n```\n\
  \n| 节点 | 变量 | n | wt | dev | yval | 复杂度 | ncompete | nsurrogate |\n|---|---|---|---|---|---|---|---|---|\n\
  | 5 | state.abb | 21 | 21 | 1.7 | 70 | 0.015 | 4 | 5 |\n\n显示树的结果，并注意节点已被删除：\n\n\
  ```\nprp(PrunedTree, type=4, extra=1)\n```\n\n![](img/672c0cf8ba3c000a6529b117ed96945e_247_0.png)\n\
  \n#### 其他用于渲染决策树的选项\n\n这些是 rpart 用于生长树的重要控制参数。您通常可以调整这些值，以使树以合理的形式呈现，并控制其复杂度：\n\n\
  - cp 参数：cp（复杂度参数）是 rpart 中使用的一个选项，用于控制分割算法在决定是否分割节点时应有多“宽松”。使用较小的 cp 值（< 0.01）可以生成一棵巨大的树，该树可能包含无法解释的分割；而\
  \ cp 值较高（> 0.05）的树可能只产生包含明显信息的树。因此，将 cp 级别设置为一个既能生成合理数量节点、又保持可解释性的数值非常重要。\n\n- 最大深度：如果您希望树的层数在某个级别停止，请在函数调用中将此数字指定为一个选项。有些人会在大约\
  \ 10 层后停止决策树，假设在那之后将没有可解释的信息。但是，如果您怀疑可能会出现包含您要查找的信息的单个节点，请务必继续生长树。但是，请记住，随着层数的增加，所需的计算时间和内存也会增加。即使是一个较大的数字，对树的增长设置限制也是一个好主意。\n\
  \n- Minbucket：许多分析师喜欢关注终端节点。但是，终端节点需要达到最小大小才能具有统计意义。唯一的例外是您在寻找真正的异常值或离群点。但一般来说，对于分段，我们希望分组足够大以具有意义。\n\
  \n- Minsplit：此选项控制一个节点必须拥有多少个观测值才能被考虑进行分割。\n\n## 聚类分析\n\n聚类分析有很多用途。在最基本的层面上，簇是一群具有相似特征的人或对象。在营销和销售行业，聚类很重要，因为客户（或潜在客户）可以根据平均消费、购买频率和最近购买时间等特征进行分组，并被分配一个代表该簇中所有属性所包含的不同层级的单一指标的簇。因此，在我们的\
  \ RFM 示例中，簇 A 可能代表经常购买、花费很多钱且购买频繁的客户（每个营销人员的梦想）。簇 B 可能代表在那三个 RFM 指标上都只是平均消费者的人，甚至可能有一个簇\
  \ Z，代表看似不可能的事情，例如只在周二购买万圣节服装的客户。\n\n数据分析师通常可以通过使用 SQL 等工具，或通过深入了解客户行为来获得良好的结果。因此，虽然聚类分析不一定是一种自娱自乐的手段，但聚类算法可以让您快速切入主题，并能够以不同的方式开始查看分组。\n\
  \n### 聚类在多种行业中的应用\n\n聚类通常与您在不同行业中可能听到的其他术语相关：\n\n- 在营销和销售中，您会听到“产品细分”这一术语，它是指我们根据人们在各个维度上的产品偏好对他们进行聚类的方式。它也可以指客户购买产品的意愿，其最终目的是能够将客户聚类为这两组（愿意和不愿意），并只向我们预测愿意购买的客户进行营销。\n\
  - 保险公司可能会根据客户提出索赔的频率对客户进行聚类，或者根据某个风险档案对客户进行聚类。\n\n### 什么是簇？\n\n簇可以定义为一组具有相似特征的对象。簇的大小可以不同。没有要求簇必须拥有特定数量的成员。它甚至可以只有一个成员。这在欺诈应用中可能很有用，您希望在其中识别数据中的异常值。在这种情况下，非常小的簇可以作为异常值。\n\
  \n簇通常被构建为每个组中拥有相同数量的成员，如分区聚类中所述。在这种情况下，每个簇中的所有成员在每个簇组内都是同质的。\n\n此外，簇被构建为与其余簇具有明显差异。差异通常基于每个簇质心之间的测量值来计算，质心是每个簇的中间点，每个簇的质心可以被视为该簇所代表属性的平均代表值。\n\
  \n聚类通常只在数值变量上进行。这是因为聚类使用距离度量，而且如我们所见，类别变量之间没有度量。但是，有方法可以使用类别变量纳入相似性，我们稍后将看到。\n\n\
  ### 聚类类型\n\n常用的两种聚类类型是分区聚类和层次聚类：\n\n### 分区聚类\n\n这也被称为非层次聚类。在分区聚类中，每个对象被分成具有相似特征的较小的非重叠子集（分区）。一个观测值只能属于一个簇。\n\
  \n这是一个三簇分区模型的经典示例。但是，您可能会想知道为什么某些黄色观测值最终出现在黄色组簇中，而不是红色组中。这是因为 k-means 确定了每个簇的线性边界（右图），任何落在特定决策边界内的点都由该簇的边界定义：\n\
  \n![](img/672c0cf8ba3c000a6529b117ed96945e_251_0.png)\n\n### K-means 聚类\n\nK-means\
  \ 聚类是用于分区聚类的最流行算法。在 K-means 聚类中，簇之间的相似性部分基于距离度量。通常，目标是将相似的簇分组在一起，使每个观测值与同一簇中其他观测值的距离相对较小。另一方面，另一个目标是使一个簇到下一个簇的距离最大，以便可以分辨距离。这本质上是一种权衡，即在组内定义相似性和组间定义相反的不相似性之间进行取舍。\n\
  \n### K-means 算法\n\nK-means 算法基于迭代过程。\n\n首先，我们决定希望有多少个簇。簇的数量可以通过多种方法确定，但请记住，实际上并没有正确的簇数量。通常，3\
  \ 到 20 个簇可以作为一个范围。\n\n作为初始步骤，簇成员被随机分配到三个中的一个\n\n\n\n已指定的簇。在以下示例中，我们有 12 个观测值（灰色），以及三个随机生成的质心（实色）。在此示例中，假设我们只有两个变量，假设是\
  \ `age` 和 `height`。我们将它们表示在 x 轴和 y 轴上，但不会对它们进行标记：\n\n![](img/672c0cf8ba3c000a6529b117ed96945e_252_0.png)\n\
  \n下一步是将每个观测值分配到最近的簇。各簇的近接性将在下一节中讨论，但目前，假设如下图所示，每个观测值已被随机分配给三个簇中的每一个。实线定义了簇的边界。从视觉上可以看出，一些调整可能有助于改进随机分配。例如，位于红色簇和绿色簇边界之间的绿色观测值，如果被分配到红色（顶部）簇，是否会更合适？这可能是正确的，因为看起来它可能比被随机分配到的簇更靠近顶部的簇：\n\
  \n![](img/672c0cf8ba3c000a6529b117ed96945e_252_1.png)\n\n随机分配后，簇分配会被重新校准。这意味着每个簇的质心会被重新计算（稍后我们将看到具体做法），然后每个数据点会被移动到新的最近质心。下图展示了质心移动的过程：\n\
  \n![](img/672c0cf8ba3c000a6529b117ed96945e_253_0.png)\n\n此过程会重复进行。质心会被重新计算，数据点再次移动到最近的质心，直到无法再有所改进。完成后，最终质心被计算出来，簇按如下图所示最终确定。可以看到，观测值的聚类效果略好于原始随机分配。请注意，每个簇内的数据点比原始随机分配更紧密，且至少两个簇（左侧的簇和中间的簇）之间有更大的分离：\n\
  \n![](img/672c0cf8ba3c000a6529b117ed96945e_253_1.png)\n\n### 测量簇之间的距离\n\nK-means\
  \ 聚类使用欧氏距离来确定各簇之间的相距远近。对于只有一个变量的簇，计算非常简单。只需取任意两个簇的质心并相互相减即可。随着变量增加，计算变得稍微复杂一些，因为你需要对构成各簇的所有变量之间的平方差求和，并将它们全部相加以确定总距离。\n\
  \n下面是一个示例，说明如何为已分配到簇 1 的三个簇成员确定质心。质心 1 已计算得出，向量为 [186,45]，其中 186 是三个成员（1、2 和 3）的平均重量，45\
  \ 是成员 1、2 和 3 的平均年龄。这些并不是最终的簇分配，而只是目前的最佳推测：\n\n| 成员 | 重量 | 年龄 |\n| --- | --- | ---\
  \ |\n| 1 | 146 | 25 |\n| 2 | 175 | 43 |\n| 3 | 236 | 68 |\n| 质心 1 | 186 | 45 |\n\
  \n下一步是为每个簇分配获得更准确的估计。然后将每个成员的维度与所有簇的质心进行比较，并将其重新分配到最近的簇。这是使用欧氏距离的概念完成的。\n\n欧氏距离的公式如下：\n\
  \n```\n$$\\sqrt{\\sum_{i=1}^{n}(q_i - p_i)^2}$$\n```\n\n对于只包含两个变量的簇，这等同于：\n\n```\n\
  $$\\sqrt{(q_1 - p_1)^2 + (q_2 - p_2)^2}$$\n```\n\n在之前定义的年龄和体重示例中，已计算了成员 1 在簇 1（其当前所属的第一个簇分配）和备选簇\
  \ 2 之间的欧氏距离。距离使用前面的公式计算，最终平方和的结果列在最后一列。如您所见，簇 2 被计算为离成员 1 更近，因为距离更小，因此，成员 1 被移入簇\
  \ 2：\n\n| | 重量 | 年龄 | | 重量平方 | 年龄平方 | 平方和的平方根 |\n| --- | --- | --- | --- | --- |\
  \ --- | --- |\n| 成员 1 | 146 | 25 | 距离到簇 1 | 1600 | 400 | 45 |\n| | 146 | 25 | 距离到簇\
  \ 2 | 16 | 1225 | 35 |\n| 簇 1 | 186 | 45 | | | | |\n| 簇 2 | 150 | 60 | | | | |\n\
  \n在所有成员的距离都已计算完毕，并且每个成员都已移入最近的簇后，各簇的质心会发生变化，因为成员已被添加或移除。因此，此过程会重复进行，直到没有更多成员可以被移入更合适的簇。\n\
  \n### 使用 k-means 的聚类示例\n\n本示例将说明一个简单的 RFM 聚类示例。RFM 分析是一种简单的数据库营销方法，可用于区分您最好（和最差）的客户。由于只有三个变量，并且理论上可以细分为更多数量的营销细分群体，因此这是一个很好的示例，用于演示聚类分析。\n\
  \n数据来自 `CDNOW` 数据库，其中包含了 23,570 名在 1997 年第一季度于 `CDNOW` 进行首次购买的个体群体截至 1998 年 6 月底的完整购买历史（Fader,\
  \ 2001）。\n\n我们将使用以下三个变量：\n\n- **购买日期**：这是购买商品的日期，将用于确定 RFM 分析中的近期性部分。\n- **购买数量**：这对应于购物车中购买的商品数量，大致对应于客户的购买频率。\n\
  - **已付总额**：这是购买的总金额。这反映了 RFM 中的货币部分。\n\n作为第一步，我们将读取数据，将日期转换为日期值，然后计算购买以来的天数。\n\n\
  然后我们将为变量分配列名：\n\n```\nlibrary(graphics)\nlibrary(dplyr)\nx <- read.table(\"C:/PracticalPredictiveAnalytics/Data/CDNOW_maste\n\
  ```\n\n接下来，我们将购买日期转换为日期格式，并计算自该购买以来过了多长时间。使用 1998 年 7 月 1 日作为参考日期：\n\n```\nx$xd\
  \ <- as.Date(as.character(x$V2), \"%Y%m%d\")\nx$diffdate <- as.integer(as.Date(\"\
  1998-07-01\") - x$xd)\n#rename the columns\n```\n\n```\ncolnames(x) <- c(\"id\"\
  ,\"orig.date\",\"units.bought\",\"TotalPaid\",\"pur\nstr(x)\nsummary(x)\n```\n\n\
  我们将说明 k-means 函数，以对变量 `units.bought`、`TotalPaid` 和 `Days.since` 执行 k-means 聚类。k-means\
  \ 聚类的一个特点是，每个观测值只能被归类到一个且仅一个簇中。k-means 要求所有变量必须是数值型，您不能在 `kmeans` 函数中使用分类变量。\n\n\
  您需要做出的一个决定是希望 k-means 生成多少个簇。我通常喜欢设定在 5 到 15 个簇之间。比这更多会使得解释每个单独簇背后的含义变得困难，但您当然也可以这样做。增加簇数量的一个问题是，k-means\
  \ 算法规定簇的大小应大致相等，因此随着簇数量的增加，一些离群簇的成员数量会更少。\n\nk-means 的输出将让您大致了解聚类的拟合优度。簇内平方和表示各簇内个体数据点的分离程度。较小的数字表明簇更加同质。比率\
  \ `betweenss/totss` 是一个单一指标，可用于衡量所有簇作为一个整体的分离程度。较高的数字表明簇的分离效果更好。\n\n在本示例中，我们将生成大小为\
  \ 3、5 和 7 的簇：\n\n```\nattach(x)\n#cluster on the RFM variables\ny <- subset(x, select\
  \ = c(units.bought, TotalPaid, Days.since))\n#perform kmeans producing 3 and 5 clusters\n\
  ```\n\n#### 注意\n\nk-means 依赖于随机种子来初始填充伪随机簇分配。更改种子可能会更改您的结果。由于聚类涉及一定程度的人类解释，因此通常使用不同种子多次运行该算法，并观察它们之间的一致性（或不一致性）。\n\
  \n\n\n\n\n创建三个聚类后，打印聚类间平方和与聚类总平方和的比率。这将为您提供一个起始指标，以便开始比较聚类。较高的数字意味着聚类之间的分离度更好：\n\
  \n```\n#always set seed before clustering\nset.seed(1020)\nclust3 <- kmeans( y,3)\n\
  clust3$betweenss/clust3$totss\nclust5 <- kmeans( y,5)\nclust5$betweenss/clust5$totss\n\
  clust7 <- kmeans( y,7)\nclust7$betweenss/clust7$totss\n```\n\n```\n> set.seed(1020)\n\
  > clust3 <- kmeans( y,3)\n> clust3$betweenss/clust3$totss\n[1] 0.8706681\n> clust5\
  \ <- kmeans( y,5)\n> clust5$betweenss/clust5$totss\n[1] 0.9178001\n> clust7 <- kmeans(\
  \ y,7)\n> clust7$betweenss/clust7$totss\n[1] 0.9381889\n```\n\n基于以上输出，聚类 7 具有最高的\
  \ betweenss/totss 比率，七个聚类将被视为最佳聚类数量。但是，如果您运行分析，每次增加聚类数量，您始终会看到比率增加。因此，我们需要确定边际效益递减定律在何处开始发挥作用。\n\
  \n### 聚类肘部图\n\n确定这一点的一种方法是使用一种称为“肘部法”的自动化方法，即对范围内的所有值绘制簇内平方和总计，并在图中找到出现肘部的位置：\n\n\
  ```\n#elbow method\nset.seed(1020)\n### Compute and plot wss for k = 3 to k = 15\n\
  df <- sapply(3:15,function(k){kmeans(y,k)$tot.withinss})\nplot(3:15, df,type='b',xlab=\"\
  # of clusters\",ylab=\"Total Within Clusters Sum of Squares\")\n```\n\n在以下图中，您可能会看到两个肘部，一个在\
  \ 5-6 个聚类处，另一个在 8-9 处。我们暂时假设五个是最佳数量，仅仅是因为该区域有一个肘部，而且给聚类命名会更容易解释：\n\n![](img/672c0cf8ba3c000a6529b117ed96945e_259_0.png)\n\
  \n### 提取聚类分配\n\n让我们从 `clust` 对象中提取聚类分配，然后比较每个聚类的计数，与大小为 3、4 和 7 的聚类进行比较：\n\n```\n\
  #cluster assignments\nclusters3 <- clust3$cluster\nclusters5 <- clust5$cluster\n\
  clusters7 <- clust7$cluster\n```\n\n### 以图形方式显示聚类\n\n我们可以以多种不同的方式绘制聚类。首先要查看的是聚类段的直方图。请记住，k-means\
  \ 希望看到大小大约相等的聚类：\n\n```\n#usually but now always the middle cluster is the average\
  \ cluster\npar(mfrow=c(1,3))\nhist(clusters3)\nhist(clusters5)\nhist(clusters7)\n\
  ```\n\n![](img/672c0cf8ba3c000a6529b117ed96945e_260_0.png)\n\n### 聚类图\n\n我们还可以将分配的聚类与原始数据一起绘制，以查看聚类分配是否存在任何问题。\n\
  \n首先，我们需要将聚类分配追加到原始数据集中：\n\n```\n#append the clusters the original data\nappend.clust\
  \ <- data.frame(x, clusters3,clusters5,clusters7)\n```\n\n为进行说明，让我们从 append.clust\
  \ 数据集中抽样。我们将样本大小设置为 100，但您可以将其设置为任何使图表可读的数字：\n\n```\nlibrary(cluster)\nset.seed(1020)\n\
  sampleit <- append.clust[sample(nrow(append.clust), 100), ]\n```\n\n### 生成聚类图\n\n\
  我们将使用 cluster 库中的 clusplot 包，根据前两个主成分绘制聚类分配。如果您记得，主成分是一种将本练习中的变量数量减少到两个的方法，主要是为了在二维\
  \ x 和 y 轴上绘制它。\n\n### 注意\n\n如果您运行以下命令，将看到第一个成分是价格和购买单位数量的度量，第二个成分是自上次购买以来的时间的度量。这就是在\
  \ x 和 y 轴上表示的内容。在这种情况下这很琐碎，因为聚类模型只有三个输入变量，但随着您使用的变量数量增加，这会变得更加重要：prcomp(append.clust[,\
  \ c(3, 4, 6)], scale = TRUE)\n\n```\npar(mfrow=c(1,3))\nclusplot(sampleit[,c(3,4,6)],\
  \ sampleit$clusters3, color=TRUE, shade=TRUE)\nclusplot(sampleit[,c(3,4,6)], sampleit$clusters5,\
  \ color=TRUE, shade=TRUE)\nclusplot(sampleit[,c(3,4,6)], sampleit$clusters7, color=TRUE,\
  \ shade=TRUE)\n```\n\n![](img/672c0cf8ba3c000a6529b117ed96945e_262_0.png)\n\n基于前面的图，我会排除\
  \ `clusters7`，因为第三个质心似乎具有较小的 `count.p`。\n\n让我们来看看每个聚类的构成，并看看它们如何与原始变量相关。\n\n查看 `head()`\
  \ 函数的输出。请注意，每一行包含三个不同的聚类分配。让我们按每个聚类分组查看原始变量的均值和计数：\n\n```\nhead(append.clust)\n\
  ```\n\n| | id | orig.date | units.bought | TotalPaid | purch.date | Days.since |\
  \ clusters3 | clusters5 | clusters7 |\n|---|---|---|---|---|---|---|---|---|---|\n\
  | 1 | 1 | 19970101 | 1 | 11.77 | 1997-01-01 | 546 | 1 | 5 | 2 |\n| 2 | 2 | 19970112\
  \ | 1 | 12.00 | 1997-01-12 | 535 | 1 | 5 | 2 |\n| 3 | 2 | 19970112 | 5 | 77.00 |\
  \ 1997-01-12 | 535 | 1 | 5 | 5 |\n| 4 | 3 | 19970102 | 2 | 20.76 | 1997-01-02 |\
  \ 545 | 1 | 5 | 2 |\n| 5 | 3 | 19970330 | 2 | 20.76 | 1997-03-30 | 458 | 1 | 5 |\
  \ 6 |\n| 6 | 3 | 19970402 | 2 | 19.54 | 1997-04-02 | 455 | 1 | 5 | 6 |\n\n我们将使用\
  \ `dplyr` 获取每个聚类的平均值和计数：\n\n```\nlibrary(dplyr)\nattach(append.clust)\nappend.clust\
  \ %>% select(units.bought, TotalPaid, Days.since, clusters3) %>%\n  group_by(clusters3)\
  \ %>%\n  summarise_each(funs(n(), mean))\nappend.clust %>% select(units.bought,\
  \ TotalPaid, Days.since, clusters5) %>%\n  group_by(clusters5) %>%\n  summarise_each(funs(n(),\
  \ mean))\nappend.clust %>% select(units.bought, TotalPaid, Days.since, clusters7)\
  \ %>%\n  group_by(clusters7) %>%\n  summarise_each(funs(n(), mean))\n```\n\n```\n\
  > append.clust %>% select(units.bought, TotalPaid, Days.since, clusters3) %>%\n\
