  \ , pedigree , age ,\n####   diabetes , agegrp , insulin.imp , glucose.imp ,\n####\
  \   pressure.imp , triceps.imp , mass.imp\n```\n\n### 计算相关系数矩阵\n\n现在，我们将计算相关系数矩阵和协方差矩阵。这将让我们了解预测变量之间如何相互关联。之后，我们还将使用这些信息来构建更大的数据集：\n\
  \n```\n#### calculate correlation matrix and exclude NA's\ncorrelationMatrix <-\
  \ cor(PimaIndians[, 1:8])\n\ncovarianceMatrix <- stats::cov(PimaIndians[, 1:8])\n\
  \n#### summarize the correlation matrix\nprint(correlationMatrix,digits=3)\n```\n\
  \n相关系数矩阵以 n*n 表格形式呈现，变量沿矩阵的顶部和侧面指定。要获取任何变量与另一个变量的相关系数，请沿矩阵顶部和底部查找任何变量对，并查看交叉点的数字。这就是计算出的相关系数：\n\
  \n![](img/672c0cf8ba3c000a6529b117ed96945e_526_0.png)\n\n对于少量变量，扫描矩阵并挑出显著相关性就足够容易了。对于大量变量，使用类似以下代码挑出较大的相关性（>\
  \ .5）会更合理：\n\n```\ndf <- as.data.frame(as.table(correlationMatrix))\nsubset(df,\
  \ abs(Freq) > 0.5 & abs(Freq) <1)\n```\n\n我们可以看到某些变量之间存在高度相关性——年龄、怀孕次数\n\n\n怀孕次数、胰岛素和葡萄糖水平的相关性最高：\n\
  \n```\n> subset(df, abs(Freq) > 0.5 & abs(Freq) <1)\n           Var1    Var2   \
  \   Freq\n8     age   pregnant 0.5443412\n13 insulin   glucose 0.5811862\n30   \
  \ mass   triceps 0.6482139\n34 glucose   insulin 0.5811862\n44 triceps     mass\
  \ 0.6482139\n```\n\n你也可以用多种不同的方式创建这些变量的散点图。\n\n使用 pairs() 函数，仅使用基础 R 即可实现这一点：\n\n\
  ```\npairs(PimaIndians[c(1, 2, 4, 5, 6, 8)], pch=21)\n```\n\n![](img/672c0cf8ba3c000a6529b117ed96945e_527_0.png)\n\
  \n### 计算列均值\n\n在接下来的模拟部分，我们需要通过向量提供列均值，因此现在让我们计算它们，并将其显示为水平条形图。我们将首先为糖尿病阳性组计算列均值，然后为糖尿病阴性组计算列均值。最后，我们将计算总体的均值，尽管我们不会在下一部分中使用它们：\n\
  \n```\nmeans.pos = colMeans(PimaIndians[PimaIndians$diabetes =='pos',1:8]\nmeans.neg\
  \ = colMeans(PimaIndians[PimaIndians$diabetes =='neg',1:8]\nmeans.all = colMeans(PimaIndians[,1:8],na.rm=TRUE)\n\
  barplot(means.all[c(1, 2,3,4,5,6,7,8)],cex.axis=.75,cex.names=.70,\n```\n\n下方的条形图仅供参考，显示计算出的均值。由于它们的量级各不相同，我们不进行比较。\n\
  \n![](img/672c0cf8ba3c000a6529b117ed96945e_528_0.png)\n\n### 模拟数据\n\n一旦我们计算了所有列的均值和协方差矩阵，我们就可以模拟任何我们想要的观测数量的大型数据集了。\n\
  \n### 使用哪些相关性？\n\n对于协方差矩阵，我们可以针对两种糖尿病结果（1,0）使用单独的矩阵，也可以使用汇总协方差矩阵，后者显示变量之间的相关性，与结果无关。\n\
  \n我们将使用单独的相关性或协方差矩阵，因为每种结果都有足够的观测值（n=500 和 n=268）。如果其中任何一个类别相对于另一个类别要小得多，我们可以改用汇总（或总体）协方差矩阵，因为这将涵盖更大的观测值集合。\n\
  \n关于以下代码的一些注意事项：\n\n- 提醒一下，在模拟之前始终先设置随机种子。这将确保每次运行代码时都能获得相同的随机结果。\n- `cor()` 函数将计算所有变量之间的相关矩阵，而\
  \ `cov()` 函数计算协方差矩阵。相关矩阵与协方差矩阵的主要区别在于，协方差的单位与变量相同，而相关性将关系标准化为 0 到 1 之间的值。然而，它们本质上衡量的是同一事物。\n\
  - `nbins` 变量将数据分成每个包含 400 个观测值的单独 bin。这对于提取较小的数据样本（而不是对整个数据集进行分析）非常有用。同样，这是另一种表明抽样是你朋友的方式。\n\
  - 数据集是使用 `mvrnorm` 函数生成的，该函数接受均值输入（列 1-8 的均值），以及我们刚刚生成的协方差矩阵。注意：要获取有关此函数的更多信息，你可以在本\
  \ notebook 中的任何位置创建一个新单元格并运行此命令，这将调用 R 帮助系统：help(mvrnorm, package=\"MASS\")\n- 要增加数据框的大小，我们生成包含\
  \ n1 个观测值的数据框，然后由 rep_times 变量指定重复指定次数。如果你觉得模拟耗时太长，可以将此变量降低到更小的数字，模拟将快得多完成。\n- 最后，我们需要区分\
  \ data.frame 和 as.DataFrame 函数：\n- data.frame 是一个普通的 R 函数，用于从函数内的参数创建数据框。\n- as.DataFrame\
  \ 是一个 SparkR 函数，用于将结果转换为 Spark 数据框。\n- 如果不确定，请在函数前加上 base:: 或 SparkR:: 前缀，以明确指定其来源的包。否则，你可能会收到难以调试的警告或错误消息。\n\
  - 最后一行代码使用 nrow() 函数打印 Spark 数据框的行数。\n\n运行下一代码块：\n\n```\n#generate spark dataframe\n\
  set.seed(123)\nn1=28\nn2=500\n#data loaded into spark\n#use separate correlation\
  \ matrix for now. May want to use 1 pooled\ncorrelationMatrix <- cor(PimaIndians[PimaIndians$diabetes\
  \ =='pos'\ncovarianceMatrix <- stats::cov(PimaIndians[PimaIndians$diabetes =\nrequire(MASS)\n\
  nbins1=base::round(n1/400,0)\nout_sd1 <- as.DataFrame(data.frame(data.frame(data.frame(\n\
  sample.bin=base::sample(1:nbins1,n1,replace=TRUE) * (+1),\noutcome=1,\nmvrnorm(n1,\
  \ mu = means.pos, Sigma = matrix(covarianceMatrix, ncol))[rep(1:n1, times=200),\
  \ ])\n\nnrow(out_sd1)\n```\n\n```\n(1)Spark Jobs\nLoading required package: MASS\n\
  Attaching package: 'MASS'\nThe following object is masked from 'package:SparkR':\n\
  \    select\n[1] 536000\nCommand took 2.88 minutes -- by r_winters at 2/13/2017,\
  \ 3:15:24 PM\n```\n\n### 检查对象类型\n\n你可以通过发出 str() 函数来查看生成的对象是 Spark 数据框。输出将明确说明 SparkDataFrame，后跟变量和数据类型的描述。但是，它不会列出行数：\n\
  \n```\nstr (out_sd1)\n```\n\n```\n> (1) Spark Jobs\n'Spark DataFrame': 10 variables:\n\
