  cat (nrow(OnlineRetail), \"rows loaded\\n\")\n> 10000 rows loaded\n```\n\n上一步中的\
  \ cat 函数应反映训练数据集的行数，即 268034。\n\n### 确定后继规则\n\n在数据准备阶段，我们已经看到每张发票都生成了大量的项集。为了开始演示算法，我们将从每个产品描述中提取一个代表性单词，并使用该单词作为后继（或\
  \ rhs）来构建一些关联规则。我们已经保存了每个产品描述的第一个和最后一个单词。我们将更仔细地检查这些单词，看看是否可以对它们进行过滤，以得到一组可管理的事务。\n\
  \n让我们先按降序预览描述中第一个和最后一个单词的频率。这应该能让我们了解哪些是热门产品：\n\n```\nlibrary(arules)\n> Loading\
  \ required package: Matrix\n>\n> Attaching package: 'arules'\n>\n> The following\
  \ objects are masked from 'package:base':\n>\n>     abbreviate, write\nlibrary(arulesViz)\n\
  > Loading required package: grid\n```\n\n打印描述中流行的第一个单词。我们将按降序对第一个单词的频率进行排序来实现：\n\
  \n```\nkable(head(as.data.frame(sort(table(OnlineRetail$firstword[]), decreasing\
  \ = TRUE)))\n```\n\n| | |\n|---|---|\n| 套装 | 17381 |\n| 袋子 | 8720 |\n| 午餐 | 7692\
  \ |\n\n\n\n\n\n| 单词 | 计数 |\n|---|---|\n| RETROSPOT | 7155 |\n| PACK | 6861 |\n|\
  \ VINTAGE | 6204 |\n| HEART | 4799 |\n| HANGING | 4457 |\n| DOORMAT | 4175 |\n|\
  \ REGENCY | 3452 |\n\n同样，打印描述中常见的最后几个词：\n\n```\nkable(head(as.data.frame(sort(table(OnlineRetail$lastword[]),\
  \ decreasing = TRUE)), 10))\nsort(table(OnlineRetail$lastword[]), decreasing = TRUE)\n\
  ```\n\n18376\n\n| 单词 | 计数 |\n|---|---|\n| DESIGN | 12713 |\n| HOLDER | 6792 |\n\n\
  - BOX 6528\n- RETROSPOT 6517\n- SIGN 6184\n- CASES 5465\n- BAG 4826\n- SET 4418\n\
  - CHRISTMAS 3963\n\n查看常见术语表明，许多交易涉及购买盒子、箱子、标志、袋子等。\n\n### 替换缺失值\n\n我们从 `lastword`\
  \ 的频率中看出存在一些空白值。`lastword` 似乎主要包含名词，而 `firstword` 似乎也是形容词和名词的混合体（bag、heart）。如果将文本字符串视为词袋（Bag\
  \ of Words），我们可以合理地将两者合并为一个标记。但是，我们将优先使用 `lastword`，仅在其缺失时才用 `firstword` 的值填充它：\n\
  \n```\n#### replace blank values in lastword, with first word.\nOnlineRetail$lastword\
  \ <- ifelse(OnlineRetail$lastword == \"\", OnlineRetail$firstword, OnlineRetail$lastword)\n\
  ```\n\n完成此步骤后，我们将再次查看频率，并观察到空白值已消失：\n\n```\nhead(as.data.frame(sort(table(OnlineRetail$lastword[]),\
  \ decreasing = TRUE)), 10)\n> sort(table(OnlineRetail$lastword[]), decreasing =\
  \ TRUE)\n> DESIGN 12\n> HOLDER 6\n> RETROSPOT 6\n> BOX 6\n> SIGN 6\n> BAG 5\n> CASES\
  \ 5\n> SET 4\n> HEART 4\n> CHRISTMAS 4\n```\n\n### 创建最终子集\n\n基于这些频率，我们将过滤数据，仅包含顶级类别的子集。我们将排除不适用于实物产品的一些术语，例如\
  \ design、set 及任何相关颜色：\n\n```\n#### Testing OnlineRetail2 <- OnlineRetail\nOnlineRetail2\
  \ <- subset(OnlineRetail, lastword %in% c(\"BAG\", \"CASES\", \"BOX\", \"SIGN\"\
  , \"CHRISTMAS\", \"BOTTLE\", \"BUNTING\", \"MUG\", \"BOWL\", \"COVER\", \"HEART\"\
  , \"MUG\", \"BOWL\"))\n```\n\n再次对结果运行 table() 函数以查看新频率：\n\n```\nhead(as.data.frame(sort(table(OnlineRetail2$lastword[]),\
  \ decreasing = TRUE)), 10)\n> sort(table(OnlineRetail2$lastword[]), decreasing =\
  \ TRUE)\n> HOLDER 6792\n> BOX 6528\n> SIGN 6184\n> BAG 5761\n> CASES 5465\n> HEART\
  \ 4027\n> CHRISTMAS 4005\n> BOTTLE 3795\n> BUNTING 3066\n> MUG 2900\n```\n\n使用 nrow()\
  \ 函数查看从原始数据中过滤掉了多少数据：\n\n```\ncat(nrow(OnlineRetail), \"Original before subsetting\\\
  n\")\n> 268034 Original before subsetting\ncat(nrow(OnlineRetail2), \"After Subsetting\\\
  n\")\n> 55609 After Subsetting\n```\n\n### 创建市场篮子交易文件\n\n我们快成功了！还需要额外的一步来为市场篮子分析准备数据。\n\
  \n关联规则包要求数据采用事务格式。事务可以采用两种不同的格式指定：\n\n- 每个项集一条事务，带有标识符，并以一行显示整个篮子，就像我们在 Groceries\
  \ 数据中看到的那样。\n- 每行一项，带有标识符。\n\n此外，可以通过以下两种方式之一来创建实际的事务文件：\n\n- 实际写入事务文件。\n- 将数据框强制转换为事务格式。\n\
  \n对于较小的数据量，将数据框强制转换为事务文件更简单，但对于较大的事务文件，最好先写入事务文件，因为追加文件可以从大型操作事务系统中读取。我们将说明这两种方式。\n\
  \n### 方法一：将数据框强制转换为事务文件\n\n现在我们准备好强制转换数据框了。我们将创建一个临时数据框，仅包含事务 ID（InvoiceNo）和描述符（lastword）。\n\
  \n首先，我们将验证这两个变量的列名和列号。我们可以先对 OnlineRetail2 运行 colnames 函数，查看它们对应数据框的第 1 列和第 12 列：\n\
  \n```\ncolnames(OnlineRetail2)\n> [1] \"InvoiceNo\" \"StockCode\" \"Description\"\
  \ \"Quantity\" \"I\n> [6] \"UnitPrice\" \"CustomerID\" \"Country\" \"itemcount\"\
  \ \"D\n> [11] \"lastword\" \"firstword\"\n```\n\n为了再次确认，请显示前 25 行，指定先前找到的索引：\n\n\
  ```\nkable(head(OnlineRetail2[, c(1, 11)], 5))\n```\n\n| | 发票号 | 最后一个词 |\n| :--\
  \ | :-------- | :------- |\n| 6 | 536365 | HOLDER |\n| 45 | 536370 | BOX |\n| 39\
  \ | 536370 | BOX |\n| 57 | 536373 | HOLDER |\n| 59 | 536373 | BOTTLE |\n\n首先，创建仅包含两个列的数据框，分别命名为\
  \ TransactionID 和 Items：\n\n```\ntmp <- data.frame(OnlineRetail2[, 1], OnlineRetail2[,\
  \ 11])\nnames(tmp)[1] <- \"TransactionID\"\nnames(tmp)[2] <- \"Items\"\n\ntmp <-\
  \ unique(tmp)\nnrow(tmp)\n> [1] 33182\n```\n\n验证结果：\n\n```\nkable(head(tmp))\n```\n\
  \n以下是输出：\n\n| | 事务 ID | 项目 |\n|:-:|:------|:----|\n| 1 | 536365 | HOLDER |\n| 2\
  \ | 536370 | BOX |\n| 4 | 536373 | HOLDER |\n| 5 | 536373 | BOTTLE |\n| 7 | 536373\
  \ | MUG |\n| 9 | 536375 | HOLDER |\n\n我们将使用 `split()` 函数按 `InvoiceID`（第 1 列）对描述（`lastword`，即第\
  \ 2 列）进行分组。`as()` 函数是关键字，因为它将拆分结果转换为事务形式：\n\n```\ntrans4 <- as(split(tmp[, 2], tmp[,\
  \ 1]), \"transactions\")\n```\n\n### 检查事务文件\n\n数据强制转换为事务形式后，可以使用 inspect 函数来检查数据。\n\
  \n### 注意\n\n检查事务文件时，不能直接使用常规 print 或 head 函数，因为这些对象是稀疏格式。应改用 `inspect()` 函数。\n\n\
  如果恰好加载了 `tm` 包（我们稍后将使用它），则必须在 `inspect` 前加上 `arules::inspect` 前缀，因为 `tm` 包中也有一个用途不同的\
  \ inspect 函数。\n\n如果在前五条记录上运行 `inspect` 命令，可以看到数据采用篮子格式，即每张发票显示由 `{}` 分隔的与该发票关联的项集：\n\
  \n```\narules::inspect(trans4[1:5])\n>  items       transactionID\n> 1 {HOLDER}\
  \    536365\n> 2 {BOX}       536370\n> 3 {BOTTLE,HOLDER,MUG} 536373\n> 4 {BOTTLE,HOLDER}\
  \       536375\n> 5 {HOLDER}              536376\n```\n\n除使用 inspect 之外，显示事务的另一种方法是先将其强制转换为矩阵，然后以布尔值显示项目。如果项目较多，需要对列向量进行子集化，以便适应屏幕：\n\
  \n```\nas(trans4, \"matrix\")[1:5, 1:5]\n>        BAG BOTTLE BOWL BOX BUNTING\n\
  > 536365 FALSE FALSE FALSE FALSE FALSE\n> 536370 FALSE FALSE FALSE TRUE  FALSE\n\
  > 536373 FALSE TRUE  FALSE FALSE FALSE\n> 536375 FALSE TRUE  FALSE FALSE FALSE\n\
