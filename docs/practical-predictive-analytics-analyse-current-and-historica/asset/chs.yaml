  )\nregisterTempTable(preds_test,\"preds_test\")\n```\n\n## 验证回归结果\n\nSparkR 中的逻辑回归缺少一些您可能在基础\
  \ R 中习惯的交叉验证和其他功能。但是，它是一个起点，可让您开始运行大规模模型。如果需要使用已经介绍过的一些交叉验证技术，您当然可以提取数据样本（通过 collect）并在基础\
  \ R 中运行回归。\n\n但是，有一些技术可让您在继续在 Spark 中工作的同时生成伪 R-平方和其他诊断信息，我们将演示这些技术。\n\n## 计算优拟度指标\n\
  \n### 混淆矩阵\n\n我们可以计算混淆矩阵或误差矩阵，以确定我们在将预测结果分类为正确或不正确时，手动计算的表现如何：\n\n```\n#Confusion\
