  \n### 检查规则质量并观察最高支持度\n\n质量度量会告诉你关于支持度、置信度和提升度分布的信息。quality 函数将为每条规则提供支持度、提升度和置信度。你还可以按每个重要度量对规则进行排序，并观察哪些规则具有最高度量。\n\
