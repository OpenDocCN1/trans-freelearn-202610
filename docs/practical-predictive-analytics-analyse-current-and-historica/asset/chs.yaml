  \n- Anscombe四重奏。从维基百科检索：https://en.wikipedia.org/wiki/Anscombe%27s_quartet\n\n-\
  \ 决定系数。从维基百科检索：https://en.wikipedia.org/wiki/Coefficient_of_determination\n\n- Fader,\
  \ P. S. (2001年5-6月)。预测CDNOW的重复销售。Interfaces，31（5-6月），第2部分（共2部分），S94-S107。\n\n- 常见问题：什么是伪R平方？从加州大学洛杉矶分校数字研究与教育学院检索：http://stats.idre.ucla.edu/other/mult-pkg/faq/general/faq-what-are-pseudo-r-squareds/\n\
  \n## 摘要\n\n在本章中，我们向工具箱中添加了三种更多算法，这3种算法连同回归构成了核心基础算法，可以覆盖预测分析师将面临的典型问题的大部分方面。我们了解到，良好的决策树方法知识可以让你快速开始开发模型，它们易于解释，并且是随机森林等更高级技术的基础。接着我们转向聚类。聚类让你开始掌握相似性和不相似性的概念，我们还介绍了距离度量。最后，我们对支持向量机进行了基本介绍，在文本挖掘的语境中进行了演示。\n\
  \n下一章中，我们将开始探讨一些创建模型的示例，这些模型可以预测客户与公司保持关系的时间，或者预测患者患上某种疾病还需要多长时间。\n"
- "# 第 6 章. 使用生存分析预测和分析客户流失\n\n> \"在无限的宇宙里，任何事情都可能发生，\"福特说，“甚至生存。奇怪但真实。”\n\n- 道格拉斯·亚当斯\
  \ 《宇宙尽头的餐馆》(1980)\n\n## 什么是生存分析？\n\n生存分析涵盖广泛的主题。本章将涵盖以下主题：\n\n- 生存分析\n- 基于时间的变量和回归\n\
  - R生存对象\n- 客户流失或流失\n- 生存曲线\n- Cox回归\n- 绘图方法\n- 变量选择\n- 模型一致性\n\n通常，预测分析问题涉及跟踪客户旅程中重要事件并预测这些事件发生时间的各种情况。生存分析是一种基于“时间到事件”概念的分析形式。时间到事件仅仅是直到某事发生之前所经过的时间单位数量。事件可以是几乎任何事情；车祸、股市崩盘或毁灭性现象。\n\
  \n生存分析起源于对患癌症等绝症患者的研究，因此称为“生存”。但是，从概念上讲，它甚至可以应用于营销应用，即在客户生命周期内跟踪事件的发生。在这种情况下，时间到事件可以指客户响应或购买。\n\
  \n在我们的示例中，我们将使用客户流失示例。客户流失是你在公司如何留住客户的语境中经常会听到的术语。流失非常重要，因为获取新客户的成本通常高于向现有客户提供折扣或促销，以保持他们的满意度，防止他们离开。\n\
  \n你可以为流失分析选择许多不同的统计建模技术，包括回归、决策树、随机森林、朴素贝叶斯和神经网络。\n\n生存分析是处理客户流失问题的一种好技术，因为它能够专门处理其他技术难以处理的营销数据的两个方面。这些涉及时间相关数据和删失的概念。\n\
  \n### 基于时间的数据\n\n在许多分析技术中，所有数据在分析时都被视为静态，这些技术不擅长处理随时间变化的数据。任何随时间测量变量变化的事件，例如年龄或通过调查测量的态度变化，都可以视为时间相关变量，并且生存技术能够很好地处理它们。这在营销概念中效果良好，因为不同客户细分群体的处理方式可能会发生变化，我们需要一种机制来衡量促销和广告等干预措施的影响，这些措施可以随时间改变客户行为。\n\
  \n### 删失\n\n通常，删失是一个用于描述仅部分已知的数据的术语。之所以被视为部分已知，是因为所有数据都受限于观察性研究的开始和结束期间。这可能是在研究开始之前或结束之后发生的信息。如果所有信息都包含在研究期间内，则数据未被删失。然而，这种情况很少发生。\n\
  \n删失数据可以是左删失或右删失。\n\n### 左删失\n\n在营销语境中，研究通常始于已有客户，而不知晓他们是如何被获取的。\n\n此外，并非所有客户都同时开始。当客户在研究或分析开始之前就已经开始时，某些客户属性可以被称为左删失。如果你开始一项包含所有客户的分析，你将不会了解研究开始之前发生的一些事件。这些知识可能包括非常重要的信息，例如客户对研究开始前很久实施的先前客户政策的不满，但如果我们没有信息，也无能为力。在生存分析中，每个人都从同等的起点开始。\n\
  \n### 右删失\n\n研究也有结束期间，客户可能在研究结束后一天离开，但仍被视为活跃。这是另一个不会被记录的数据示例。因此，如果研究在客户终止之前结束，则该客户被视为右删失。然而，它还包括一些其他特殊情况，例如客户在研究结束时仍处于活跃状态，或因与研究变量无关的事件而丢失。\n\
  \n例如，如果客户只活跃了10天，而研究恰好在不久之后结束，则仍预计该客户会保持活跃；或者，如果客户因地址变更未回复跟进问卷，他们可能会被排除在研究之外。这些都是自然发生的事件。\n\
  \n在下图中，黑色垂直线表示假设流失研究的开始日期和结束日期。每行的第一个点表示客户被获取的时间点，最后一个点表示客户离开的时间点。只有在开始和结束日期期间内可用的数据才可用于分析。图表显示了在客户可能被视为左删失或右删失的位置的垂直线：\n\
  \n- 如顶部栏所示，我们看到一名客户在研究开始后被获取，并在研究结束前离开。因此，我们拥有关于该客户任期的完整信息，该客户被视为未删失。\n- 中间栏显示了一名在研究开始后被获取的客户；但是，该客户在研究结束时仍处于活跃状态，右垂直线稍后一点的点显示客户在研究结束后不久离开。但是，这种流失活动不会在数据中反映，因此这是右删失数据的示例。\n\
  - 底部栏显示了一名在研究开始前就被获取、开始日期未知的客户。这是左删失观测值的示例：\n\n![](img/672c0cf8ba3c000a6529b117ed96945e_283_0.png)\n\
  \n\n\n\n\n## 我们的客户满意度数据集\n\n在本章中，我们将查看一个由假设客户组成的数据集，这些客户订阅了一项在线服务，并在研究开始前完成了一份客户满意度调查。随后，该调查与事务数据以及人口统计数据相匹配，生成了这个简单的分析数据集。该数据集包含一个事件变量（流失），用于表示客户是否取消了服务订阅。我们还将包括一些事务数据（上月购买次数）、一些人口统计数据（性别、教育程度），以及研究开始前实施的总体满意度调查：\n\
  \n| 变量 | 描述 |\n|---|---|\n| Monthly.Charges | 以前购买的平均美元金额 |\n| Purch.last.Month\
  \ | 研究开始前一个月的购买次数 |\n| Satisfaction | 基于李克特量表的服务总体满意度 |\n| Satisfaction2 | 后续满意度评分\
  \ |\n| Gender | 男性或女性 |\n| Education Level | 学士/硕士/博士 |\n\n## 使用概率函数生成数据\n\n与其使用现有数据集，不如我们使用一些内置的采样和概率函数来生成自己的数据。这将是学习如何执行分析的一种宝贵方式，因为它能让您修改自己的数据构成，并观察这如何改变生成的模型。您将看到的一些代码还包含了我们在第\
  \ 1 章“使用预测分析入门”中讨论过的某些可重复性研究概念。\n\n为确保这些示例能正确运行，请确保 `setwd()` 已设置为计算机上的正确文件夹。以下代码的前几行演示了此函数。除\
  \ `setwd()` 之外，您还将在给定的代码示例中看到一些其他函数，这些函数有助于促进可重复性：\n\n- `set.seed()`：始终提供一个常量。这保证任何采样数据都可以在使用相同种子的不同计算机上精确复制。在本示例中，我将使用数字\
  \ 1 作为种子。\n- `dev.copy()`：这会将屏幕上显示的图表复制到 `setwd()` 设置的目录中指定的文件名。这样，您就可以将所有图像保存在适用于您正在进行的项目或子项目的相应目录中。完成\
  \ `dev.copy()` 后，使用 `dev.off()` 重置图表。注意：您可能需要指定两次 `dev.off()` 才能完成。\n- `clearhistory()`、`savehistory()`：这两个函数之间包含的所有代码都会被复制到\
  \ `savehistory()` 中指定的文件名。这样，您就可以保留代码的永久记录，与代码编辑器分开。如果您手动跟踪版本，或将其用于包含在其他文字处理程序中，这很重要。\n\
  - 代码标签：您将看到一些以 `#` 开头并以 `====`（四个等号）结尾的代码标签。虽然它们在技术上是注释，但它们也充当标签或书签，用于标识代码的特定部分。例如，我们的第一部分代码将开始使用\
  \ `#simulate churn===` 标签，如下图所示：\n\n### 注意\n\n在 RStudio 中，使用源代码窗格底部的上/下箭头跳转到带有定义标签的代码区域。\n\
  \n![](img/672c0cf8ba3c000a6529b117ed96945e_286_0.png)\n\n定位下一节中的代码后，选择并运行它。以下是按标记部分划分的代码功能简要概述。对于每个项目，请跳转到指示的代码标签。\n\
  \n### 创建流失和未流失数据框\n\n代码首先模拟响应变量（xchurn）的数据。请记住，该变量只能取两个值：0 和 1。由于我们希望这些组表现不同，我们将分别为每个组（即流失者（xchurn）和在\
  \ 12 个月期结束时仍保持活跃的人员（xnochurn））单独模拟数据：\n\n```\n#simulate churn data===\nsetwd('C:/PracticalPredictiveAnalytics/Outputs')\n\
  frame.size <- 1000\nxchurn <- data.frame(Churn=rep(c(1),frame.size))\nxnochurn <-\
  \ data.frame(Churn=rep(c(0),frame.size))\n```\n\n### 创建和验证新的模拟变量\n\n本节模拟自变量 Xeducation、Xgender、Xsatisfaction、Xpurch.last.month\
  \ 和 Xmonthly.charges。代码使用 sample() 函数根据概率向量，为这两个数据框中的每一个生成略有不同的数据。生成的某些数据分布在流失者和非流失者之间只有微小差异（例如教育程度），而其他变量则专门生成，以显示留下的成员和离开的成员之间的差异（tenure2\
  \ 和上月购买次数）：\n\n```\n#create new vars===\n### set the seed for reproducibility\n\
  set.seed(1)\n\n#set the gender and Education Vectors.\ned.vector <- c(\"Bachelor's\
  \ Degree\", \"Master's Degree\", \"Doctorate\")\ngen.vector <- c(\"M\", \"F\")\n\
  \n#sample from each of the vector elements with the associated prob\nxchurn$Xeducation\
  \ <- sample(ed.vector, nrow(xchurn), replace = TRUE)\nxnochurn$Xeducation <- sample(ed.vector,\
  \ nrow(xnochurn), replace = TRUE)\nxchurn$Xgender <- sample(gen.vector, nrow(xchurn),\
  \ replace = TRUE)\nxnochurn$Xgender <- sample(gen.vector, nrow(xnochurn), replace\
  \ = TRUE)\n\n#do the same for the service vector. 1=not at all satisfied, 5=very\n\
  serv.vector <- c(\"1\",\"2\",\"3\",\"4\",\"5\",NA)\n#make the churners not very\
  \ satisfied. Note that the probability\n\nxchurn$Xsatisfaction <- sample(serv.vector,\
  \ nrow(xchurn), replace = TRUE)\n#non churners get an increased probability of a\
  \ higher satisfaction\nxnochurn$Xsatisfaction <- sample(serv.vector, nrow(xnochurn),\
  \ replace = TRUE)\n\n### simulate incremental increase in satisfaction after the\
  \ 2nd survey\nxchurn$Xsatisfaction2 <- as.integer(xchurn$Xsatisfaction) + 1\n#For\
  \ the 2nd survey, keep the satisfaction level the same for the non-churners\nxnochurn$Xsatisfaction2\
  \ <- sample(serv.vector, nrow(xnochurn), replace = TRUE)\n#simulate a higher increase\
  \ in calls to customer service for the churners\nxchurn$Xservice.calls <- sample(c(0,1,2,3,4,5),\
  \ nrow(xchurn), replace = TRUE)\nxnochurn$Xservice.calls <- sample(c(0,1,2,3,4,5),\
  \ nrow(xnochurn), replace = TRUE)\n#Simulate tenure of 12 months to 1 month. Notice,\
  \ for example, the\nxchurn$Xtenure2 <- sample(c(12:1), nrow(xchurn), replace = TRUE)\n\
  xnochurn$Xtenure2 <- sample(c(12:1), nrow(xnochurn), replace = TRUE)\n#simulate\
  \ the number of purchases last month. We do the simulation\nxchurn$Xpurch.last.month\
  \ <- sample(c(rep(10,5),rep(1,150),rep(3,1)), replace = TRUE)\nxnochurn$Xpurch.last.month\
  \ <- sample(c(rep(0,5),rep(1,20),rep(3,1)), replace = TRUE)\n#monthly charges are\
  \ selected via a normal distribution. Churners\nxchurn$Xmonthly.charges <- rnorm(nrow(xchurn),\
  \ mean=215, sd=70)\nxnochurn$Xmonthly.charges <- rnorm(nrow(xnochurn), mean=75,\
  \ sd=50)\n#also convert to a list\nxchurn.list <- lapply(xchurn, function(x) sample(x,\
  \ replace=TRUE))\nxnochurn.list <- lapply(xnochurn, function(x) sample(x, replace=TRUE))\n\
  ```\n\n数据生成后，您可以使用一些其他 R 函数来验证数据是否按预期生成。例如，在命令行中，您可以使用 prop.table() 函数来验证百分比是否生成正确：\n\
  \n```\n> prop.table(table(xchurn$Xeducation))\n```\n\n以下是输出：\n\n| 学士学位 | 博士学位 |\
  \ 硕士学位 |\n|---|---|---|\n| 0.802 | 0.053 | 0.145 |\n\n检查以下代码：\n\n```\n> prop.table(table(xnochurn$Xeducation))\n\
  ```\n\n以下是输出：\n\n| 学士学位 | 博士学位 | 硕士学位 |\n|---|---|---|\n| 0.819 | 0.060 | 0.121\
  \ |\n\n这表明流失者的数据是根据 `sample(ed.vector)` 代码行中指定的原始参数正确生成的。两个流失/未流失组之间只有微小差异。\n\n\
  但是请注意，由于这是模拟数据，您可以更改 `sample()` 函数中的 `prob=` 选项，以使其与适用于您所在行业的任何场景相对应。这是可取的，因为它最终会向您表明当假设发生变化时，您的模型有多稳健。如果您愿意，可以通过更改概率向量来尝试一些不同的场景。\n\
  \n例如，如果我们希望通过增加博士学位的出现频率来大幅改变教育程度的组成，我们将再次增加概率向量中第三个槽的概率：\n\n```\nXeducation_PHD\
  \ <- sample(ed.vector, 1000, replace = TRUE, prob = c\n```\n\n然后我们可以通过绘制百分比来查看差异：\n\
  \n```r\npar(mfrow=c(1,3))\nbarplot(table(xchurn$Xeducation), names.arg=c('B.A','Ph.D','Master'))\n\
  barplot(table(xnochurn$Xeducation), names.arg=c('B.A','Ph.D','Mast'))\nbarplot(table(Xeducation_PHD),\
  \ names.arg=c('B.A','Ph.D','Masters'))\n```\n\n以下是输出：\n\n![](img/672c0cf8ba3c000a6529b117ed96945e_289_0.png)\n\
  \n### 重新组合流失者和非流失者\n\n\n\n\n既然我们已经分别为两组模拟了变量，现在将重新组合它们，然后删除一些NA值：\n\n```\n### bind\
