  \ \"MISD\" \"MISD\" \"MISD\"\n$ perstop : int 10 4 16 16 16 16\n```\n\n## 发现重要特征\n\
  \n我们将现在介绍 OneR 包，以发现数据集中的一些重要特征。OneR 包将为每个特征生成一条决策规则，然后按准确性对它们进行排名。准确性定义为正确分类结果的概率，可以表示为混淆矩阵或错误矩阵，我们在之前的章节中见过。OneR\
  \ 包还有一些其他很好的功能，例如能够以最佳方式对整数变量进行分箱，从而产生最佳预测器。\n\nOneR 包不在 Spark 上原生运行，因此我们首先需要使用\
  \ collect() 和 sample() 函数对 Spark 数据帧进行 95% 采样，然后通过 collect() 函数将其移动到本地 R 数据帧。\n\n\
  虽然这个 Spark 数据帧足够小，可以不进行采样就完成示例，但了解如何从数据帧进行采样很重要，因为如果您按预期使用 Spark，您的数据帧将太大，无法使用 collect\
  \ 函数将整个数据帧带入本地 R 实例。对于非常大的 Spark 表，您可能希望在初始分析时使用 5%-10% 左右的采样百分比。但是，对于我们的示例，我们将使用\
  \ 95% 的采样百分比以捕获大部分数据，因为 2015 年停止和盘查数据相对较小。但是，如果您要导入所有年份的数据并将其连接到一个大的 Spark 数据帧中，则会考虑将采样百分比降低到更合理的数字。否则，您可能最终会得到基础\
  \ R 无法处理的更多行。\n\n另请注意，OneR 包当前不是默认安装的包。但是，您可以使用 devtools 从 cran 安装最新版本：\n\n```\n\
  devtools::install_github(\"cran/OneR\")\nlibrary(OneR)\n```\n\n\n\n\n### 将名为 \"\
  df\" 的 Spark DataFrame 中 95% 的行加载到本地\nlocal = collect(sample(df, 0.95))\n\n### 消除具有大量水平的某些因子\n\
  \n由于数据集在某些特征（如邮政编码和 GPS 位置变量）上非常细致，我们将首先通过仅包含最多 20 个水平的特征/变量来执行降维。这将有助于我们之后构建模型，而无需担心由于某些具有高维度的变量而导致过拟合。不过，数字\
  \ 20 并非一成不变；你可以更改默认值，并且无论水平如何，始终保留你认为模型中需要的变量。\n\nOneR 具有一个名为 maxlevels() 的函数，可以完成此操作。任何水平数超过此值的变量都不会包含在输出中。\n\
  \n运行该函数后，使用 str() 函数验证某些变量已被消除。我们最初有 113 个变量，现在减少到 97 个。一些变量（例如 x 和 y 坐标）已被消除，因为\
  \ GPS 坐标显然具有超过 20 个水平：\n\n```\nfrisked_df <- maxlevels(local, maxlevels = 20, na.omit\
  \ = TRUE)\n#check the output to see if the number of levels were reduced\nstr(frisked_df)\n\
  ```\n\n观察输出的前 3 行，显示变量数量已从 113 减少到 97：\n\n```\n'data.frame': 21359 obs. of 97 variables:\n\
  $ year : chr \"2015\" \"2015\" \"2015\" \"2015\" ...\n$ ser_num : int 18 5 38 41\
  \ 39 122 42 9 141 2 ...\n```\n\n### 测试和训练数据集\n\n当然，我们会希望将数据划分为测试数据集和训练数据集。\n\n我们已经介绍了许多将数据分为测试集和训练集的方法。下一种划分方法将采用\
  \ 80%/20% 的训练/测试分割，具体步骤如下：\n\n- 首先从训练数据集中提取索引编号。我们将使用 base::sample 函数来完成此操作\n- 根据这些索引构建训练数据集\n\
  - 从不包含在索引中的行构建测试数据集\n\n一旦我们获得训练索引，将使用 OneR 包中的 optbin 函数，该函数将根据变量预测 frisked 的 Yes\
  \ 或 No 结果的能力，对数值变量进行最优划分。我们之前在决策树中已经见过这种最优划分。在下面的代码中，optbin 被指示为所有数值变量找到最佳分割点，方法是指定\
  \ frisked ~ 。\n\n```\nset.seed(123)\ntrain.index <- base::sample(1:base::nrow(frisked_df),\
  \ 0.80 * base::nrow(frisked_df))\ntrain_data <- optbin(frisked_df[train.index,],\
  \ frisked ~ .)\ntest_data <- optbin( frisked_df[-train.index,], frisked ~ .)\n#after\
  \ partitioning, run a summary of the first 15 rows to see what\nsummary(train_data[1:15])\n\
  ```\n\n```\nyear ser_num datestop\n2015:16034 (-0.523,265] :10299 (1e+06,6.13e+06]\
  \ :8689\n(265,1.53e+03]: 5735 (6.13e+06,1.23e+07]:7345\n\ntimestop recstat inout\
