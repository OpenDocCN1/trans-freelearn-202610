  \ 142.0769 -0.1904382 -0.04164209        2\n\n## 以图形方式显示聚类分配\n\n双变量聚类图通常很有助于查看聚类分配如何与两个变量的\
  \ x-y 图相关联。每个集群都以不同的颜色绘制。\n\n在 Databricks 中，您可以轻松完成此操作：\n\n首先，在一些拟合数据上运行 display\
  \ 命令。在下面的代码中，我首先提取了一个 1,000 行的样本。您希望样本足够小，以使图上的点不会太稠密。\n\n```\ntmp <- head(sample(fitted,\
  \ F, .01), 1000)\ndisplay(tmp)\n\n#show cluster assignment by 2 variable matrix\n\
  ```\n\n接下来，切换到绘图对话框，打开“自定义绘图”对话框，并执行以下图形设置：\n\n1. 将图表类型更改为散点图。\n2. 将 prediction\
  \ 拖到 keys 区域。\n3. 将所有可能的 x-y 绘图变量拖到 values 区域：\n4. 如果向图中添加 LOESS 线，您将能够识别出一些容易通过两个变量组合分离的集群。\n\
  \n单击 **应用** 以更新图表。在以下图表中，`age` 和 `pregnant` 交叉点处的上升趋势线显示，随着年龄和怀孕月数的变化，集群分离明显：\n\n\
  ![](img/672c0cf8ba3c000a6529b117ed96945e_610_0.png)\n\n## 通过 Pairs 函数绘图\n\n要获得更大、更详细的图表，您还可以使用\
  \ pairs 函数在所需变量上生成散点矩阵，并使用颜色勾勒各个集群。\n\n我们可以看到，在某些情况下，集群与其余部分是分开的，而在其他情况下，可能会有轻微或重大的重叠：\n\
  \n```r\npairs(tmp[c(\"age\", \"mass\", \"pressure\", \"pregnant\") ],\ncol=tmp$prediction)\n\
  ```\n\n![](img/672c0cf8ba3c000a6529b117ed96945e_611_0.png)\n\n要开始分析集群的组成部分，可以查看变量沿每个轴的绘制方式。\n\
  \n例如，红色集群显示年长患者与怀孕月数之间存在关系。这似乎表明糖尿病呈阳性。为了再次确认，可以查看身体质量，并且还会看到其他所有变量的较高值也出现在红色集群中。\n\
  \n另一方面，血压与身体质量之间的关系不那么清晰，可能是因为其他因素在起作用，而这些因素在二维图中不明显。\n\n## 按均值表征集群\n\n查看集群的另一种方法是直接查看其均值。可以直接使用\
  \ SQL 来完成：\n\n- 首先，查看任何具有归一化值 >1 或 <-1，或该变量最高绝对值的变量。这将为您开始对集群进行分类提供一些线索。\n- 还要查看系数的大小和符号。绝对值较大的系数可能表明该变量对特定集群具有重要影响。符号相反的变量在表征或命名集群方面很重要。\n\
  \n```\ntmp_agg <- SparkR::sql(\"SELECT prediction, mean(age),\nmean(triceps),\n\
  mean(pregnant),mean(pressure),mean(insulin),\nmean(glucose),\nmean(pedigree) from\
  \ fitted_tbl group by 1\")\nhead(tmp_agg)\n```\n\n| prediction | avg(age) | avg(triceps)\
