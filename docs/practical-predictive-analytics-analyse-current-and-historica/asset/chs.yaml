  \ 5 |\n| 1536000 |\n\n## 聚类分析\n\n在本节中，我们将说明如何使用k-means在Spark中直接实现聚类分析。k-means是一种无监督学习，是开始探索大数据的绝佳起点，尤其是当您的数据量很大且没有明确的目标变量定义时。\n\
  \n## 准备分析数据\n\n我们将首先进行一些数据准备，以便为k-means归一化数据。归一化几乎是k-means的要求，因为它迫使每个变量具有尺度独立性，从而使k-means集群之间的距离测量也具有尺度独立性。\n\
  \n请回顾，归一化变量的一种方法是首先获取变量的均值，然后除以其标准差。\n\n## 从全局视图读取数据\n\n我们在上一部分将糖尿病数据集保存为表和全局视图，因此现在可以使用SQL将其读回。我们将首先读取训练表(`temp.df_view`)，然后读取测试表(`test_view`)。生成的对象都是Spark数据帧。\n\
  \n读取表后，打印行计数。如果希望将计数作为一个结果查看，可以使用cat()等函数将结果打印在一行上：\n\n```\ndf = sql(\"select age,\n\
  \t\t\t\tpregnant,\n\t\t\t\tglucose,\n\t\t\t\tpressure,\n\t\t\t\tinsulin,\n\t\t\t\
  \tpedigree,\n\t\t\t\ttriceps,\n\t\t\t\tmass\nfrom global_temp.df_view\")\n```\n\n\
  ```\ntest = sql(\"select age ,\npregnant,\nglucose,\npressure,\ninsulin,\npedigree,\n\
  triceps,\nmass\nfrom global_temp.test_view\")\ncat(count(df),count(test))\n```\n\
  \n```\n▶ (2) Spark Jobs\n1238000 298000\n```\n\n## 输入先前计算的均值和标准差\n\n为了归一化数据，我们需要每个列的均值和标准差。如果纯粹在基础R中进行此操作，有许多方法可以使用内置函数和包来完成。但是，使用SparkR可能会限制我们通常的操作方式，并迫使我们更高效地以不同方式处理数据。\n\
  \n请回顾，我们已将此数据存储在汇总对象（sumdf_view等等）中，因此为了节省处理时间，我们将直接读回汇总统计量，避免重新计算汇总统计量。\n\n首先，我们将读入均值行，然后是`stddev`行：\n\
  \n```\nmeans = sql(\"select age as age_mean,\npregnant as pregnant_mean,\nglucose\
  \ as glucose_mean,\npressure as pressure_mean,\ninsulin as insulin_mean,\npedigree\
  \ as pedigree_mean,\ntriceps as triceps_mean,\nmass as mass_mean\nfrom global_temp.sumdf_view\
  \ where summary='mean'\")\nstds = sql(\"select age as age_std,\n```\n\n\n\n\n\n\
  ```\npregnant as pregnant_std,\nglucose as glucose_std,\npressure as pressure_std,\n\
  insulin as insulin_std,\npedigree as pedigree_std,\ntriceps as triceps_std,\nmass\
  \ as mass_std\nfrom global_temp.sumdf_view where summary='stddev'\")\n```\n\n##\
  \ 将均值和标准差与训练数据连接\n\n现在我们可以使用 crossJoin 将汇总均值和标准差连接在一起。由于表格具有相同数量的行并且彼此一一对应，因此不需要键。\n\
  \n然后将汇总数据与原始数据连接。生成的对象是另一个 Spark 数据框 (df_means)，其中所有变量的均值和标准差已连接到每一行：\n\n```\n#join\
  \ the means and standard deviations\nboth <- crossJoin(means,stds)\n#join with the\
  \ original data\ndf_means <- crossJoin(df,both)\nnrow(df_means)\n```\n\n(8) Spark\
