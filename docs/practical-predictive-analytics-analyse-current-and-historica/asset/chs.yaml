  \ 318 |\n\n### 预测簇分配\n\n本练习的目标是对测试数据集打分，通过基于训练数据集的 predict 方法分配簇。\n\n### 使用 flexclust\
  \ 预测簇分配\n\n标准 kmeans 函数没有预测方法。然而，我们可以使用 flexclust 包，它具有此方法。由于预测方法运行可能耗时较长，我们将仅对样本行和列进行说明。为了比较测试和训练结果，它们还需要具有相同数量的列。为说明目的，我们将数量设置为\
  \ 10。\n\n首先，从 OnlineRetail 训练数据中取样：\n\n```\nset.seed(1)\nsample.size <- 10000\n\
  max.cols <- 10\nlibrary(\"flexclust\") OnlineRetail <- OnlineRetail[1:sample.size,\n\
  ```\n\n接下来，从采样数据集的 description 列创建文档-术语矩阵。我们将使用 RTextTools 包的 create_matrix 函数，它可以在不单独创建语料库的步骤下先创建\
  \ TDM：\n\n```\nrequire(tm)\nlibrary(RTextTools) #Create the DTM for the training\
  \ data\n```\n\n```\ndtMatrix <- create_matrix(OnlineRetail$Description, minDocFreq\
  \ =\nminWordLength = 4, removeStopwords = TRUE, removePunctuation = T\nweighting\
  \ = weightTf)\n```\n\n接下来，检查数据的维度。可以看到有 1300 个术语。几乎所有这些都是稀疏术语，因此我们将从矩阵中删除它们：\n\n\
