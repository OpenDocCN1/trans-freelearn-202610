- pgno: 503
  md: "# Chapter 9. Introduction to Spark Using R\n\n> *Data! Data! Data! I can't\
    \ make bricks without clay!*\n> \n> - Sir Arthur Conan Doyle\n\nSo far, we have\
    \ learned how to perform analytics on what can be referred to as \"small data\"\
    . However, as the amount of data increases, so does the size and the problem of\
    \ how to analyze the vast amounts of data that is produced arises. Â When that\
    \ occurs, we begin to approach \"big data\" and new approaches to solving problems\
    \ develop and sometimes, new tools are needed as well.\n\nTo some extent, nothing\
    \ changes. You still want high quality data. You still want to be able to examine\
    \ the relationships and cast the problem within a predictive analytic framework.\n\
    \nWhat does change are the steps needed to achieve that end, bearing in mind that\
    \ the data is more difficult to manage and as a result new tools have evolved\
    \ to help you do that.\n\nOne of the tools that has evolved in recent years is\
    \ Apache Spark.\n\nIn this chapter, we will cover some basics of Spark. Â We will\
    \ start with a known small dataset, perform some data cleaning, and then transform\
    \ this dataset into something much larger which we can use to bring into the Apache\
    \ Spark environment. We will also learn how to adapt tools that we are familiar\
    \ with, in order to work with Spark, and learn some new tools along the way."
  merge: -1
  img_proc: true
- pgno: 504
  md: '# # About Spark


    At the time of writing, Spark is probably the most popular very large dataset
    architecture for predictive analytics. Spark is a distributed architecture which
    helps you manage your large data and makes it easier to analyze. Spark is built
    upon Hadoop and they share the same filesystem.


    However, Spark is not based upon the MapReduce paradigm, and uses the resilient
    distributed dataset (RDD) structure in order to implement in-memory analytics
    and manage the parallel processing cluster across all of the nodes of the environment.
    What that means for analysts is that queries can be very quick, since data is
    retrieved from memory, which offers much quicker retrieval than disk access. Quicker
    access means more time for analysis, and less time waiting for results.


    Here are some advantages of Spark:


    +   * Spark overcomes some of the limitations of memory-bound analytics, since
    it manages memory, and is able to optimize data access and querying.

    +   * Spark has its own machine learning library known as MLlib, which implements
    several population predictive model techniques and optimizes computational speed
    for algorithms involving large datasets.

    +   * Spark now includes the concepts of dataframes, which extends ease of use
    to analysts who use R or Python.

    +   * Spark takes advantage of redundancy and fault-tolerant aspects of Hadoop.
    If one node fails for whatever reason, another node will take its place so that
    the analytics do not fail. This is very important when working in a production
    environment.

    +   * Spark also supports other languages such as Java and Scala. Languages can
    be mixed within an analytics pipeline and analysts can share the same data. This
    can improve team collaboration and improve efficiency.'
  merge: -1
  img_proc: true
- pgno: 505
  md: '# Spark environments


    Spark runs in three different modes:


    +   - Standalone

    +   - YARN

    +   - MESOS


    For initial deployments (and for learning), it is best to start with standalone,
    which allocates clusters specifically for Spark use only. Furthermore, you can
    run standalone mode in local mode (your computer) or via cloud computing (an example
    would be using Amazon AWS).


    # Cluster computing


    Cluster computing allows Spark to process and distribute data over many computers
    at once, in parallel. A cluster managerÂ allocates resources for the cluster depending
    upon user requests. An important aspect of Spark is that it attempts to keep as
    much data in memory as needed, so that data is available for the various analyses
    as quickly as possible rather than having to wait to retrieve data from storage
    every time a query or model is specified.


    Spark data is stored as RDDs, which allow different kinds of objects to be spread
    out over the cluster.


    # Parallel computing


    Parallel computing refers to the ability to perform separate computing tasks at
    the same time. It does this by distributing the work load. Â For example if a
    dataframe needs to simply be sorted by last name, the cluster manager can pass
    the various names starting with 26 letters of the alphabet to 26 different nodes,
    have them each sort their own letter, and then ask for them all to be returned
    to one place where 1 final sort will be performed. Â This can be'
  merge: -1
  img_proc: true
- pgno: 506
  md: quicker than if only 1 machine performed the sort.Â
  merge: -1
  img_proc: true
- pgno: 507
  md: '# # SparkR


    Spark itself is written in a programming language called Scala and runs in a Java
    environment. However, you are not restricted to using Scala. Spark has several
    interfaces which are exposed through an API, which allows Spark programs to be
    written in these other languages:


    +   - R

    +   - Scala

    +   - Java

    +   - Python

    +   - Clojure


    We will be demonstrating some of the examples in this chapter using SparkR. SparkR
    is an R package that provides a frontend to use Apache Spark from R. This allows
    SparkR to allow data scientists to interactively run jobs from R on a cluster.
    One big advantage of using SparkR, for the traditional R programmer, is that it
    uses some of the techniques that they already know such as the concept of dataframes
    is also available within SparkR.


    # ## Dataframes


    Spark RDDs can be a bit difficult to work with, so in recent versions of Spark,
    Dataframe abstractions have been built on top of RDDs, which allows analysts to
    view data in ways that they are used to looking at them, for example, being able
    to view them as tables and lists. This allows many high level languages (such
    as R and Python) to utilize syntax which is familiar to them and to be able to
    integrate optimized code, which is on par with native Scala or Spark SQL.


    Databricks is a company founded by the creators of Apache Spark, which offers
    a free environment for running Spark programs in the cloud utilizing R, Java,
    Scala, or Python.'
  merge: -1
  img_proc: true
