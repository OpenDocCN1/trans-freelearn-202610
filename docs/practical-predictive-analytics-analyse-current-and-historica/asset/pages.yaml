    from pyspark.mllib.regression import LabeledPoint

    from pyspark.sql.functions import *

    from pyspark.ml.feature import StringIndexer

    df2 = spark.sql("SELECT case when frisked=''Y'' THEN 1 else 0 END a

    df2.show(5)

    ```


