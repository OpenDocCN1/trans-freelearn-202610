    ![](img/672c0cf8ba3c000a6529b117ed96945e_270_0.png)


    Typically, SVMs are used with data that is very high dimensional. That could include
    applications involving object and facial recognition. SVM can be very accurate,
    but its disadvantage includes interpretability and performance. SVMs can also
    overfit the data, since the decision boundaries are highly dependent upon the
    choice of the kernel that is used to perform the mapping. There are a large number
    of kernel choices available and the choice of a kernel should not be made based
    upon the best model fit. This would not be unlike using higher order polynomial
    functions to overfit a regression model.


