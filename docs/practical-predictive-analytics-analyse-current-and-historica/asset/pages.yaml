  md: '# Determining all of the subset groups


    Since we have only looked at parts of the file (via `head()` or `tail()` functions),
    we do not know how many categories there are and how they differ in terms of health
    care coverage. So we will start off by looking at some of the groupings.


    In previous chapters, we have used `sql()` and the `aggregate()` function to group
    data. For this example, we will use the `dplyr` package. One advance of the `dplyr()`
    package is that it can also be used with pipe syntax, which allows the result
    of one function to be passed to the next function without intermediate assignments:


    ```

    library(dplyr)

