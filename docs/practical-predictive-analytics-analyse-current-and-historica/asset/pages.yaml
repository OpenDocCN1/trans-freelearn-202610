  md: '# Examining the rules summary


    The rule length distribution indicates the number of itemsets that appear in both
    the left and right side of the association. The most frequent number of item is
    3, which either means that the purchase of two items together, implies purchasing
    a single item, or conversely, purchasing a single item implies purchasing two
    additional items.


    # Examining the rules quality and observing the highest support


    The quality measures tell you something about the distribution of support, confidence,
    and lift. The quality function will give the support, lift, and confidence for
    each of the rules. You can also sort the rules by each of these important measures
    and observe which rules have the highest measures.


    We can see from the low support distribution that there are no particular itemsets
    that occur more than others. If you inspect the rules sorted by the support level,
    you will see the highest support level at 0.046. Notice that this agrees with
    the Max. support level given in the summary. The top three support levels are
    for those customers who purchase holders, boxes, or signs:


