- pgno: 72
  md: '# Step 2 data understanding


    Once an objective is established and data sources have been identified, you can
    begin looking at the data in order to understand how each data element behaves
    individually, as well as how it interacts in combination with other variables.
    But even before you start looking at the values of variables, it is important
    to understand the different types of data levels of measurement and the kind of
    analyses you can perform with them.


    # Levels of measurement


    Levels of measurement is a classification system for classifying data into 4 different
    categories which is discussed as follows (ratio, ordinal, interval, and nominal).
    It is an important aspect of the project or studies metadata.


    Levels of measurement is important in the world of predictive analytics since
    the specific measurements will often dictate which algorithm or techniques can
    be applied. For example k-means clustering does work if you want to incorporate
    nominal data, and logistic regression can not use ratio data as a dependent variable
    (although you can transform variables to a lower scale).


    # Nominal data


    Nominal data, sometimes referred to as categorical data, simply defines a class
    or group without any natural order. Nominal variables are usually character data,
    but not always. Your gender, the cell phone brand you prefer, and the type of
    book you are reading now are all examples of nominal variables. Sometimes it can
    be tricky, since the number 1 and 2 written on a sign are also nominal variables
    when they are used to designate two possible waiting lines you may need to visit
    at the motor vehicle bureau. Nominal data only designates classes and you cannot
    perform any mathematical operations on them, such as addition or subtraction.'
  merge: -1
  img_proc: true
- pgno: 73
  md: 'When characterizing nominal data, the only measure of central tendency is the
    *mode*, which is the most frequently occurring value. Computing means or medians
    cannot be performed.


    In the R language, we can convert character data to factors so that we can analyze
    them as nominal data. That will be an important part of the cleaning process,
    which we will learn about later on. When analyzing nominal data, frequencies of
    occurrence (counts) are a good starting point. Alternatively, you can begin by
    grouping calculations with other nominal variables, in order to determine counts,
    or averages of other numeric variables.


    # Ordinal data


    Ordinal data only has rank order. Statements can be made such as A>B and B < C,
    but you cannot compute the numeric differences between any of the groups. A top
    ten list is an example of the presentation of ordinal data. Often categorical
    data can be classified as ordinal data if they have an implied order, such as
    two categories labeled *Better*, and *Best*. One problem with ordinal data is
    we never know what is the exact difference between each of the ranked data points.


    # Interval data


    This is numeric data in which you can measure distances but cannot take ratios.
    Temperature data and calendar data are two examples of interval data. All of the
    arithmetic differences between two consecutive data points on the numeric scale
    are measured exactly the same way, so you can take meaningful differences.


    Often, interval data is treated as ratio data. This is often seen when performing
    calculations such as averages on likert scales (even though this is not technically
    correct). With ordinal data, you can compute frequencies, calculate the median,
    and compute percentiles but you cannot do any arithmetic or calculate a mean.


    # Ratio data'
  merge: -1
  img_proc: true
- pgno: 74
  md: 'The highest level of numeric data is ratio scale. With ratio data, you can
    make meaningful comparisons using division and subtraction. It is meaningful to
    say that you have acquired twice as many customers when you went from 50 to 100
    customers in one month. Ratio data also adds 0 to the domain of numbers (which
    interval data does not contain), so it is meaningful to say that you have 0 customers
    (although not desireable). Weight and income are other examples of ratio data.
    however, the fahrenheit and celsius temperature scale do not have a 0 meaning
    no temperature. That creates some interesting comparisons if you would try to
    make temperature comparisons. For example, in fahrenheit, a temperature of 36/18
    equals 2, but the equivalent celsius is 2.22/-7.78 which equals 0.28 which suggests
    that ration comparisons are meaningless, and that both sides should be treated
    as interval.Â


    To learn more about the theory of scales and measurement refer to On the Theory
    of Scales and of Measurement (Stevens, 1946).


    # Converting from the different levels of measurement


    As a general rule, you can always transform a higher level of measurement to a
    lower level of measurement, but not the reverse. Often this is done via a technique
    known as **binning** in which you place all values with a certain range into a
    bin. You may want to take various ranges of height and bin them into *tall*, *short*,
    or *medium* based upon predefined ranges. However, you would generally not take
    a categorical variable and map it to a numeric variable, unless you knew a lot
    about how that category was measured and you were willing to make a lot of assumptions.


    # Dependent and independent variables


    The **dependent variable** is the variable that you are predicting. It can also
    be referred to as a target variable, response variable, or outcome variable. One
    goal of predictive modeling is to derive a prediction for the dependent variable
    based upon some function of the independent variables. A dependent variable is
    typically fixed and you cannot manipulate it. **Independent variables** are variables
    that you choose in the belief that they are important in determining the outcome
    of the dependent variable, also based upon some'
  merge: -1
  img_proc: true
- pgno: 75
  md: 'function. This function is typically applied using an algorithm.


    # Transformed variables


    Transformed variables are variables that you create which did not exist in the
    raw data. Here are some examples of how you can create transformed variables:


    +   • You can bin a numeric variable into several distinct categories such as
    High (all numeric values greater than 10) or low or any value less than 10. Notice
    that binning results in losing information, but allows you some flexibility by
    being able to name things and promote understandability

    +   • Transforming count data into percentages by dividing a cell count by the
    total population.

    +   • Standardizing the data in the modeling phase; it is often useful to work
    with standardized variables, as opposed to using the raw data itself. A standardized
    variable is a transformation which forces a mean of 0, and a standard deviation
    of 1. This transformation preserves the distribution and structure of the original
    values, but makes it easier to compare one set of variables with another variable
    with a different scale.

    +   • In regression modeling, it is common to replace or add another variable
    with a transformation such as `log()` or `exp()` so that the resultant model has
    a better linear fit.


    # Single variable analysis


    After taking inventory of all your potential candidate variables, it makes sense
    to start with single variable analysis. Why complicate things by looking all at
    multiple variables at once when you can start looking at them one at a time? Often,
    the results of modeling will suggest immediate elimination of a variable for inclusion
    in a model, such as one with a high percentage of missing values, or one with
    data quality issues. Eliminating variables early is often the best course, rather
    than carrying them through an analysis only to discard them later on. This is
    especially true if you find two variables which measure the same thing.'
  merge: -1
  img_proc: true
- pgno: 76
  md: '# Summary statistics


    It is usually a good idea to begin analysis with look at summary statistics for
    every candidate variable which might appear in a model.Â Means, standard deviations,
    frequencies, and skewness allow quick generalization about how you expect a variable
    to behave. Special consideration should also be given when examining any variable
    deemed to be a target variable.


    To display basic summary statistics about a single variable, use the R `Summary()`
    function. This can be issued as part of an R scripts or directly from the command
    line. The general form of the `Summary()` function is:


    ```

    #for a single variable

    Summary(dataframe$variable)

    #for all of the variables

    Summary(dataframe)

    ```


    Two other typical single variable analysis summary techniques to use are:


    +   • **Distributions**: A distribution plot (histogram, probability density plot,
    and so on) will give you an idea of what a variable looks like versus a theoretical
    statistical distribution. Some modeling techniques will require some assumptions
    regarding distributions and others will not. If you find that a variable follows
    a particular distribution, you will be lucky. That will make modeling easier later
    on. In R, you can use the `hist()` function.


    +   • **Boxplots**: A boxplot is a simple graphic representation of a distribution,
    which always includes five key elements of a distribution minimum, first quartile,
    median, third quartile, and maximum. (Refer to *Comparing treatments* in the next
    section for an example the R function `boxplot()`, which produces these five key
    elements.)

    +     • The box has the upper and lower lines of the box representing the third
    and first quartile, with the median line in between.

    +     • The whiskers has the top line representing the maximum and the bottom
    line representing the minimum.


    # Bivariate analysis'
  merge: -1
  img_proc: true
- pgno: 77
  md: 'Bivariate analysis is typically the next step you would take after single variable
    analysis. Bivariate analysis is used to show the relationship between any two
    variables. You are performing bivariate analysis for two reasons:


    +   - In a modeling framework, one key outcome we are looking for would be any
    association between the target variable and any one of the independent variables.

    +   - Another, equally important outcome we are looking for is any possible associations
    between any two of the independent variables. That will help us understand which
    of the independent variables are correlated with each other, or help us understand
    how one variable changes the behavior of another.


    # Types of questions that bivariate analysis can answer


    As you examine the relationship between any two variables, here are some key points
    to keep in mind:


    +   - Do the two variables move in the same direction as one changes, or do they
    move in opposite directions? Â Is there one critical value in either of the variables
    that alters the relationship?

    +   - Are the changes in the values dramatic, or are they slow and steady?

    +   - Is there strength in the relationship, and is the relationship linear, or
    is there curvature?

    +   - Are there specific subsets of data that have correlations that are more
    interesting than others?


    The kinds of plots and charts one uses to display these relationships are dependent
    upon the variable data types. For interval and ratio scale data, we will group
    them together into one category and refer to them as quantitative data.


    Therefore, when we look at bivariate relations between quantitative and nominal
    data, we can have three basic combinations:


    +   - Quantitative with quantitative

    +   - Nominal with nominal'
  merge: -1
  img_proc: true
