    of purchasing clusters occur and then use that to subset the association rules.
    To illustrate text clustering on our `OnlineRetail` dataset, we will first need
    to load our training and test dataframes that we previously saved. Also, issue
    a set.seed command since we will be doing some sampling later on:


    ```

    setwd("C:/Users/randy/Desktop/ch6")

