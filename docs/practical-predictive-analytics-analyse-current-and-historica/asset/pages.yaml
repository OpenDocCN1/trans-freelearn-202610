    ![](img/672c0cf8ba3c000a6529b117ed96945e_247_0.png)


    # # Other options to render decision trees


    These are the important control parameters that are used by rpart to grow a tree.
    You can often play with these values to get a tree to render in a reasonable form,
    and to control its complexity:


    +   • cp parameters: The cp (complexity parameter) is an option used in rpart
    that controls how liberal you want the splitting algorithm to be when it decides
    whether or not to split a node. Utilizing a small cp value (< 0.01) can generate
    an enormous tree that can contain unexplainable splits, while a tree with a high
    cp value (> 0.05) can produce a tree containing only obvious information. Therefore,
    it is important to set the'
  merge: -1
  img_proc: true
- pgno: 248
  md: 'cp level at a number that generates a fair amount of nodes, yet remains explainable.


    +   • Maximum depth: If you want the number of levels of the tree to stop at a
    certain level, specify this number as an option within the function call. Some
    people will stop a decision tree after 10 levels or so, assuming that there will
    be no interpretable information beyond that point. However, if you suspect that
    there may be single nodes that pop up that could contain the information you are
    looking for, by all means continue to grow the tree. However, remember as you
    extend the number of levels, that will increase the computation time and memory
    needed. It is always a good idea to see limits on the growth of the tree, even
    if it is a high number.


    +   • Minbucket: Many analysts like to concentrate on terminal nodes. However,
    a terminal node needs to be a minimum size for it to have statistical meaning.
    The only exception would be if you were looking for true outliers or anomalies.
    But generally, for segmentation, we want groups that are large enough to have
    meaning.


    +   • Minsplit: This option controls how many observations a node has to have
    in order to even be considered for a split.'
  merge: -1
  img_proc: true
- pgno: 249
  md: '# # Cluster analysis


    Cluster analysis has many uses. At its very basic level, a cluster is a group
    of people or objects that share similar characteristics. In the marketing and
    sales industries, clustering is important, since customers (or potential customers)
    can be grouped by characteristics such as average spending, frequency of purchase,
    and recency of purchases, and assigned a cluster that represents one single measure
    of the different levels contained in all of the attributes that make up that cluster.
    So, for our RFM example, cluster A might represent frequent purchasers who spend
    a lot of money, and spend often (every marketers dream). Cluster B could represent
    people who are just average consumers across all three of those RFM metrics, and
    there might even be a cluster Z which represents things that seem to be impossible,
    such as customers who buy Halloween costumes only on Tuesdays.


    Data analysts can often get good results by using tools such as SQL, or by having
    great insights in customers behavior. So, while cluster analysis is not necessarily
    an end in itself, clustering algorithms allow you to cut to the chase rather quickly
    and enable you to begin to look at groupings in different ways.


    # # Clustering is used in diverse industries


    Clustering is often related to other terms that you may hear in different industries:


    +   • In marketing and sales, you will hear the term product segmentation, which
    refers to how we cluster people according to their product preferences along various
    dimensions. It can also refer to a customer''s willingness to buy a product with
    the ultimate goal of being able to cluster customers into those two groups (willing
    and not willing) and only marketing to those customers who we predict are willing
    to buy.

    +   • An insurance company might cluster customers according to how often they
    file a claim, or cluster customers according to a certain risk profile.'
  merge: -1
  img_proc: true
- pgno: 250
  md: '# What is a cluster?


    A cluster can be defined as a group of objects with similar characteristics. Clusters
    can vary in size. There is no requirement that a cluster must have a certain number
    of members. It can even have a single member. This might be useful in fraud applications,
    in which you want to identify anomalies in the data. In this case, very small
    clusters can act as outliers.


    Clusters are often constructed to have an equal number of members in each group,
    as in partitioning clustering. In this case, all of the members in each cluster
    are homogeneous within each cluster group.


    Furthermore, clusters are constructed so they have distinct differences from the
    remaining clusters. Differences are usually calculated based upon measurements
    between each of the clusters centroids, which is the middle of each cluster, and
    the centroid of each cluster can be thought of as the average representative values
    of the attributes for the cluster that it represents.


    Clustering is usually done on numeric variables only. That is because clustering
    utilizes distance measures, and as we have seen, categorical variables have no
    measure between them. However, there are ways to incorporate similarity using
    categorical variables, which we will see later on.


    # Types of clustering


    There are two types of clustering that are often utilized, partional clustering
    and hierarchical clustering:


    # Partitional clustering


    This is also known as non-hierarchical clustering. In partitional clustering,
    each object is divided into smaller non-overlapping subsets (partition)Â that
    have similar characteristics. An observation can belong to one, and only one,
    cluster.


    Here is a classic example of a three-cluster partitioned model. However, you'
  merge: -1
  img_proc: true
- pgno: 251
  md: 'may wonder why some of the yellow observations end up in the yellow group cluster,
    rather than the red group. That is because k-means has determined what the linear
    boundaries are for each of the clusters (right diagram), and any point that falls
    within any particular decision boundary is defined by the boundaries of that cluster:


    ![](img/672c0cf8ba3c000a6529b117ed96945e_251_0.png)


    # K-means clustering


    K-means clustering is the most popular algorithm used for partition clustering.
    In k-means clustering, similarity between clusters is based, in part, upon distance
    measures. Generally, the goal is to group similar clusters together with each
    observation having a relatively small distance from other observations in the
    same clusters. On the other hand, another goal is to have the maximum distance
    from one cluster to the next, so that the distances can be discerned.Å It is essentially
    a balancing act in which there is a tradeoff between defining similarities within
    groups, and defining opposing dissimilarities between groups.


    # The k-means algorithm


    The k-means algorithm is based upon an iterative process.


    First, we decide how many clusters we desire. The number of clusters can be determined
    by a number of methods, but bear in mind that there is really no correct number
    of clusters. Typically, between 3 and 20 clusters can be used as a range.


    As an initial step, cluster members are randomly assigned to one of the three'
  merge: -1
  img_proc: true
- pgno: 252
  md: 'clusters that have been specified. In the following example, we have 12 observations
    (in gray), and three centroids (solid colors) which have been randomly generated.
    For this example letâs make believe we have only two variables, letâs say there
    were `age`, and `height`. We will represent them on an x and y axis but we wonât
    label them:


    ![](img/672c0cf8ba3c000a6529b117ed96945e_252_0.png)


    The next step is to assign each observation to the nearest cluster. The nearness
    of each cluster will be discussed in the next section, but for now let''s say
    that each of the observations have been assigned to each of the three clusters
    randomly as shown below. The solid lines define the boundaries of the cluster.
    Visually you can see that that some adjustment could help theÂ random assignment.
    For example, would the green observation at the border between the red and green
    cluster border could be a better fit if it was assigned to the red (top) cluster?Â
    That could be true Â since it looks like it could be closer to the cluster at
    the top than the one it was randomly assigned to:


    ![](img/672c0cf8ba3c000a6529b117ed96945e_252_1.png)


    After the random assignment, the cluster assignment are recalibrated. What that
    means is that the centroids of each cluster are recomputed (we will see how that
    is done later), Â and then each data point is then moved to the new'
  merge: -1
  img_proc: true
- pgno: 253
  md: 'closest centroid.Â This movement is demonstrated in the following figure showing
    the centroids being shifted:


    ![](img/672c0cf8ba3c000a6529b117ed96945e_253_0.png)


    This process is repeated. Centroids are recalculated, and the data points move
    again to their nearest centroid until there can be no additional improvement.
    When done the final centroids are computed, the clusters are finalized as in the
    diagram below. You can see that the observations are clustered slightly better
    than the original random assignment. Note that the data point in each cluster
    tend to be closer together than the original random assignment, and that there
    is more separation between at least two of the clusters (the one on the left,
    and the other in the middle):


    ![](img/672c0cf8ba3c000a6529b117ed96945e_253_1.png)


    # Measuring distance between clusters


    K-means clustering uses Euclidian distances to determine how far apart each of
    the clusters are from each other. For clusters of just one variable, the computation
    is trivial. You just take the centroids from any two clusters and subtract them
    from one another. As you add more variables, the computation becomes slightly
    more involved since you will be summing the squared difference between all of
    the variables that comprise each of the clusters, and'
  merge: -1
  img_proc: true
- pgno: 254
  md: 'summing them all together to determine the total distance.


    Here is an example of how the centroid is determined for three cluster members
    that have been assigned to cluster 1. Centroid 1 has been calculated, the vector
    [186,45] where 186 is the average of the weight of the three members, 1, 2, and
    3, and 45 is the average age of members 1, 2, and 3. These will not be the final
    cluster assignments, but merely a best guess at this point:


    | Member | Weight | Age |

    |---|---|---|

    | 1 | 146 | 25 |

    | 2 | 175 | 43 |

    | 3 | 236 | 68 |

    | Centroid 1 | 186 | 45 |


    The next step is to get a better estimate for each cluster assignment. Each member''s
    dimensions are then compared to the centroids of all of the clusters, and then
    reassigned to the cluster to which it is the closest. This is done using the concept
    of Euclidean distances.


    The formula for Euclidean distance is as follows:'
  merge: -1
  img_proc: true
- pgno: 255
  md: '```

    $$\sqrt{\sum_{i=1}^{n}(q_i - p_i)^2}$$

    ```


    For a cluster that contains only two variables, this is equivalent to:


    ```

    $$\sqrt{(q_1 - p_1)^2 + (q_2 - p_2)^2}$$

    ```


    In our age and weight example previously defined, the Euclidean distances have
    been computed for member 1 between cluster 1 (the first cluster assignment that
    it is currently a member of), and an alternative cluster 2. The distance is calculated
    using the preceding formula, and the results of the final sum of squares is listed
    in the final column. As you can see, cluster 2 is computed as being closer to
    member 1, since the distance is smaller, and as a result, member 1 is moved into
    cluster 2:


    | | Weight | Age | | Weight Squared | Age Squared | square root of sums |

    |---|---|---|---|---|---|---|

    | Member 1 | 146 | 25 | Distance to Cluster 1 | 1600 | 400 | 45 |

    | | 146 | 25 | Distance to Cluster 2 | 16 | 1225 | 35 |

    | Cluster 1 | 186 | 45 | | | | |

    | Cluster 2 | 150 | 60 | | | | |


    After the distances have been computed for all members, and each member has been
    moved into its closest cluster, the centroids for each cluster will change, since
    members will have been added or removed. So, the process is repeated until no
    more members can be moved into more suitable clusters.


    # Clustering example using k-means


    This example will illustrate a simple RFM clustering example. RFM analysis'
  merge: -1
  img_proc: true
