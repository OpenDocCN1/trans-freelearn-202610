- pgno: 68
  md: 'data is a great way to begin to test code and algorithms since you will always
    have a better idea of what kind of results to expect, given the assumptions.


    # Charts and plots


    At the business understanding phase, it is not necessary to get too complex with
    visualizations. The reason I say this is that in some instances complex visualization
    can influence interpretation, rather than provide objective data. Basic charts
    and plots, which indicate the relationship between the variables are more than
    adequate for communicating ideas.


    When passing charts and plots back and forth during this phase, it is a good idea
    to include basic statistical measures of distribution and associationāthis will
    give management a rough idea of how significant the relationships are, rather
    than having them rely purely on the visual representation.


    # Spreadsheets


    Sending the data to spreadsheets and creating pivot tables is another way to get
    management involved in the process. Spreadsheets have definite disadvantages,
    but they are heavily used in the industry and knowing how to manipulate spreadsheets
    will be another way that you can communicate with managers.


    # Simulation


    **Simulation** is a tool which can demonstrate what-ifs. This technique is very
    useful if there is not a lot of historical data to go by, and you need to make
    assumptions about the behavior of some of your variables. Typically, you do not
    have a lot of data at this point, so you are really constructing your own data,
    based upon how you think it will behave.


    In the later sections of the book, I will use simulation techniques heavily to
    illustrate this.'
  merge: -1
  img_proc: true
