  md: 'We will now perform a simple mean imputation. However, rather than substituting
    with a single mean number, we will replace the NAs with the mean values based
    upon membership of these four groups:


    +   - Diabetes=pos/younger age range

    +   - Diabetes=neg/younger age range

    +   - Diabetes=neg/older age range

    +   - Diabetes=pos/older age range


