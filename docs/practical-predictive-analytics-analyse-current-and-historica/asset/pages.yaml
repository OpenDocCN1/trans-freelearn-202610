    # In sample/out of sample tests, walk forward tests


    After a model has been developed, it is considered best practice to validate the
    results against other data.


    # Training/test/validation datasets


    Training data is the data that is used to build the predictive data. Test data,
    also known as a hold-out sample, is the data which was not used in the training
    process. Test data is used to see if a trained model is able to generalize its
    results to another dataset which was not part of the model training.


    However, even though the test dataset is not used in the training of the model,
    the contents are usually viewable by the modeler during model development.


    A validation set is a third dataset which is sometimes used to further'
  merge: -1
  img_proc: true
- pgno: 114
  md: 'benchmark the model results. Validation data is also data that has never been
    seen before, which is incorporated after the model has passed validation against
    the test dataset and prior to deployment. Validation datasets are often brought
    from a completely different source from the original training/test data source,
    the goal being to provide a second corroboration, or refutation, of the model
    results.


    Along with training, test, and validation data, you will also hear some other
    terms which are related:


    +   - In-sample data refers to the data which was used to fit (model) the data
    and is used on the training dataset

    +   - Out-of-sample data refers to data not used to fit the data


    This means that out-of-sample data is typically used only on the test and validation
    datasets. Another technique to validate the data is known as **k-fold cross-validation**.
    This technique will use multiple folds to define different subsets of in-sample
    and out-of-sample datasets in order to perform multiple iterations of model testing
    in order to randomize the selection of training and test data.


    # Time series validation


    Of course time series models also use this concept; however, time periods alone
    can be used to partition test and training data, for example, a model might be
    built on the previous five years of historical data (training) and then forecast
    on the current sixth year of data (testing or validation data).


    Variations of this are common. A *walk forward* testing modeler will develop a
    time-series model on years 1-5, test the results on year 6, and then develop a
    similar model on years 2-6, and then test the results on year 7. This procedure
    would be repeated until there is no more data to test. In all these cases, the
    model is built on the *in-sample* data, and tested on out-of-sample data which
    is similar to k-fold validation.


    # Benchmark against best champion model'
  merge: -1
  img_proc: true
- pgno: 115
  md: 'In champion/challenger model development, you currently have a deployed stable
    champion model in which you can benchmark any future results. This allows you
    to discard any model results which fall far below this benchmark. If you do not
    have a current champion, you can develop a theoretical best model using an algorithm
    such as random forests or SVM, and use that as a benchmark for what is achievable
    but (assume) is not actionable. Look at the results of the model you have just
    developed and see if it is close to these kinds of results. If so, the results
    are probably not attainable and you might want to look elsewhere.


    # Expert opinions: man against machine


    This is often done with classification problems and it essentially pits man against
    machine. If an expert agrees with a lot of what your model spits out, that is
    another reason to deem it valid.


    # Meta-analysis


    Much has been written about junk science and how there is always another study
    which produces the opposite results from a previous one.Â p-value hacking is one
    way to do this. We have already mentioned metadata which is data about data.


    Meta-analysis is the study of studies in which a research will look at all of
    the previous analyses and report what they all have to say about outcomes in totality.
    If your analysis agrees with other similar analyses that have been performed in
    the past, that would be more evidence to support your model.


    # Dart board method


    In some instances, you need not have only one model to predict the outcome. If
    you accept the view thatÂ All models are useful, why not use some of them at the
    same time? This is used extensively in marketing campaign management and financial
    portfolio management. Sometimes it pays not to put all of your eggs in one basket.
    One model can fail to work during one'
  merge: -1
  img_proc: true
- pgno: 116
  md: month but is offset with positive results from another model. Ensemble modeling,
    which is similar, can also incorporate several diverse models at the same time,
    but usually there is a single outcome and may be subject to overfitting.
  merge: -1
  img_proc: true
- pgno: 117
  md: '# Step 6 deployment


    Deployment of a model is the process by which you put your models into a real-world
    production setting. This can depend on many factors, such as the environment in
    which it was developed, the algorithm that was chosen, assumptions concerning
    the data that was made when the model was developed, and of course, the level
    of the developer. Often a model is unable to scale up to the demands of a production
    environment and knowing your possible production environment in advance will dictate
    what problems or techniques are feasible.


    # Model scoring


    Model scoring makes the model actionable. If you develop a model and you are unable
    to apply the results to new data, then you will be unable to do any prediction
    on an ongoing basis. New model scoring often involves outputting the development
    model outputs to a real-time scoring engine. That engine is often Java or C++.
    How that is performed varies vastly depending upon the modeling technique. Sometimes
    the scoring is performed separately, so it can be optimized for efficiency.


    Regression type models are relatively easy to score, since all that is needed
    are the model''s coefficients and intercepts. Other types of models need a little
    more work. For example, decision tree software should be able to output a set
    of decision rules which would enable production language to recode it using a
    series of if/then/else rules. Software packages often output the decision rules
    which were determined for each node.


    Certain production packages will accept PMML input. PMML is a common language
    which is used to facilitate translation of one language''s model specification
    into a common format.


    For more complicated models, it may be necessary to have production versions of
    the model on a separate production machine and run the model'
  merge: -1
  img_proc: true
