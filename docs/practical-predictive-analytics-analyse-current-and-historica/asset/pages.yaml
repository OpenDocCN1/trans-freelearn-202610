    +   - First at the console, enter `help (warpbreaks)` to get a description of
    the dataset:


    [,1]breaks numeric This is the number of breaks


    [,2]wool factor This is the type of wool (A or B)


    [,3]tension factor This is the level of tension (L, M, or H)


    Then, set up and execute the model using the `glm()` function. We are predicting
    the number of breaks, using the type of wool and level of tension. Note that we
    need to add a `summary()` function after the `glm()` function in order to see
    the output, since running the `glm()` function just assigns the output to an object
    named the `model.poisson` model.


    ```

    model.poisson <-glm(breaks~wool+tension, data=warpbreaks, family=

