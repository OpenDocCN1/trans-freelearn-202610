  md: '# Running the OneR model


    The syntax to the OneR model should be familiar. The outcome variable frisked
    is specified on the left side of the formula (~) and the features are specified
    on the right side. As you will recall, the metacharacter (.) designates that all
    features will be used as predictors:


    ```

    model <- OneR(train_data, frisked ~ ., verbose = TRUE)

    summary(model)

    ```


    The (partial) summary output displays the accuracy based upon selecting only one
    variable as a predictor along with its classification rate. Â The significant
    variables are starred.


    The attribute and the accuracy metrics for the first 7 variables are shown next.
    Notice that once accuracy reaches 67.61% it does not decrease:


    | | Attribute | Accuracy |

    |---|---|---|

    | 1 | * sex | 68.56% |

    | 2 | eyecolor | 67.68% |

    | 3 | haircolor | 67.62% |

    | 4 | year | 67.61% |

    | 4 | ser_num | 67.61% |

    | 4 | datestop | 67.61% |

    | 4 | timestop | 67.61% |


    The call to the function is shown in the log, and the Decision Tree rules are
    displayed.'
