  md: "# # Setting the stage by creating survival objects\n\nCoding survival analysis\
    \ in R usually starts with creating what is known as a survival object using the\
    \ `Surv()` function. A `survival` object contains more information than a regular\
    \ dataframe. The purpose of the `survival` object is to keep track of the time\
    \ and the event status (0 or 1) for each observation. It is also to designate\
    \ what the response (dependent) variable is.\n\nAt a minimum, you need to supply\
    \ a single time variable and an event when defining a `survival` object. In our\
    \ case, we will use the tenure time (`Xtenure2`) as the time variable, and a formula\
    \ that designates the defining event. In our case, this will be `Churn == 1`,\
    \ since that means that the customer churned in that month:\n\n```\n```r\ninstall.packages(\"\
    survival\")\nlibrary(survival)\nChurnStudy$SurvObj <- with(ChurnStudy, Surv(Xtenure2,\
    \ Churn == 1))\n```\n```\n\nAs I mentioned in earlier chapters, I always like\
    \ to issue a `str()` command after I create a new dataframe, just to make sure\
    \ the results are as expected:\n\n```\n```\n> str(ChurnStudy$SurvObj)\nSurv [1:1488,\
    \ 1:2] 7 9 6 11+ 11 1+ 4 12 12 3 ...\n - attr(*, \"dimnames\")=List of 2\n  ..$\
    \ : NULL\n  ..$ : chr [1:2] \"time\" \"status\"\n - attr(*, \"type\")= chr \"\
    right\"\n```\n```\n\nFrom the preceding output we can see that the `survival`\
    \ object created contains 1488 rows, with columns named time and status. Note\
    \ that the `+` sign after the number of months means that the member was censored\
    \ at the end of the study period, that is, the subscriber remained active and\
    \ did not churn. The `attr(*, \"type\")` line shows the model is incorporating\
    \ right censoring.\n\nOnce the `survival` object is created, we can perform some\
    \ rudimentary"
  merge: -1
  img_proc: true
