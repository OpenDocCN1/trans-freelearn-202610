- pgno: 356
  md: '# The sample market basket


    Each transaction numbered 1-10 listed previously represents a basket of items
    purchased by a shopper. These are typically all items that are associated with
    a particular transaction or invoice. Each basket is enclosed within braces {},
    and is referred to as an itemset. An itemset is a group of items that occur together.


    Market basket algorithms construct rules in the form of:


    ```

    Itemset{x1,x2,x3 ...} --> Itemset{y1,y2,y3...}.

    ```


    This notation states that buyers who have purchased items on the left-hand side
    of the formula (lhs) have a propensity to purchase items on the right-hand side
    (rhs). The association is stated using the Ã symbol, which can be interpreted
    as implies.


    # Note


    The lhs of the notation is also known as the antecedent, and the rhs is known
    as the consequence. If nothing appears on either the left-hand side or right-hand
    side there is no specific association rule for those items; however, it also means
    that those items have appeared in the basket.'
  merge: -1
  img_proc: true
- pgno: 357
  md: '# Association rule algorithms


    Without an association rule algorithm, you are left with the computationally

    very expensive task of generating all possible pairs of itemsets, and then

    trying to mine the data in order to identifyÂ the best ones yourself. Associate

    rule algorithms help with filtering this.


    The most popular algorithm for MBA is the apriori algorithm, which is

    contained within the `arules` package (the other popular algorithm is the eclat

    algorithm).


    Running apriori is fairly simple. We will demonstrate this using our demo 10

    transaction itemset that we just printed.


    The apriori algorithm is based upon the principle that if a particular itemset
    is

    frequent, then all of its subsets must also be frequent. That principle itself
    is

    helpful for reducing the number of itemsets that need to be evaluated, since it

    only needs to look at the largest items sets first, and then be able to filter

    down:


    +   • First, some housekeeping. Fix the number of printable digits to 2:


    ```

    options(digits = 2)

    ```


    +   • Next, run the apriori algorithm. However, only run it on rows 10 through

    +   19 of the `Groceries` dataset since we will want to keep the output small

    +   for now. We will also adjust the `supp =,` and `conf =` parameters to

    +   produce enough output so that we can illustrate some points in the next

    +   sections:


    ```

    rules <- apriori(Groceries[10:19], parameter = list(supp

    conf = 0.6))

    ```


    +   • The output shows that 2351 rules were created. This is a large number of

    +   rules relative to the 10 transactions we are inspecting. The large number

    +   of rules is due to the low support level that we specified (0.10). That'
  merge: -1
  img_proc: true
