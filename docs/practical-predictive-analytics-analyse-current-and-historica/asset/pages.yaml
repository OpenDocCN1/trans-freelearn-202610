  md: '# Percentage of Non-Insured 1999-2012 - With EMA


    ![](img/672c0cf8ba3c000a6529b117ed96945e_482_0.png)


    # Selecting a smoothing factor


    Sometimes selecting an appropriate smoothing factor is done via your own experience
    with the data, and let''s you express your own view about how you expect the future
    to behave. For example if you thank that the data has recently changed to reflect
    new pattern, you might want to assume that the recent data is more important and
    use a smoothing factor close to 1. On the other hand, if you think that recent
    activity is just due to random fluctuations, you might want to choose a lower
    smoothing factor to give more weight to the past. A smoothing factor which treats
    the recent past with the distant past might be something like 0.5. The point is
    that it is not always necessary to automatically optimize the smoothing factor
    (s as we will see next).'
  merge: -1
  img_proc: true
- pgno: 483
  md: '# Using the ets function


    While moving averages re extremely useful, they are only one component of what
    is known as an exponential smoothed state space model, which has many options
    to define the optimal smoothing factor, as well as enabling you to define the
    type of trend and seasonality via the parameters. To implement this model we will
    use the ets() function from the forecast package to model the Not-Covered Percent
    variable for the "ALL AGES" category.


    The ets() function is flexible in that it can also incorporate trend, as well
    as seasonality for its forecasts.


    We will just be illustrating a simple exponentially smoothed model (ANN). However,
    for completeness, you should know that you specify three letters when calling
    the ets() function, and you should be aware of what each letter represents. Otherwise,
    it will model based upon the default parameters.


    Here is the description as specified by the package author, Hyndman:


    +   • The first letter denotes the error type ("A", "M", or "Z")


    +   • The second letter denotes the trend type ("N","A","M", or "Z")


    +   • The third letter denotes the season type ("N",''A'',"M", or "Z")


    In all cases, N=none, A=additive, M=multiplicative, and Z=automatically selected.


    So, for our example, if we want to model a simple, exponentially smoothed model,
    as we did in our manual calculations, we will specify model=ANN.'
  merge: -1
  img_proc: true
- pgno: 484
  md: '# # Forecasting using ALL AGES


    The following code will perform the following steps:


    +   1. First, it will filter the data so that it only includes the `ALL AGES`
    category.

    +   2. Then, it creates a time series object.

    +   3. Finally, it runs a simple exponential model, using the `ets()` function.


    Note that we did not specify a smoothing factor. The `ets()` function calculates
    the optimal smoothing factor (alpha, shown via the `summary()` function (in bold
    below)), which in this case is .99, which means that model time series takes about
    99% of the previous value to incorporate into the next time series prediction:


    ```

    library(dplyr)

