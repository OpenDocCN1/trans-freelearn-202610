  md: '# Our customer satisfaction dataset


    In this chapter, we will be looking at a dataset of hypothetical customers who
    are subscribed to an online service, and who have responded to a customer satisfaction
    survey prior to the beginning of the study. This survey was then matched to transactional
    as well as demographic data to produce this simple analysis dataset, consisting
    of an event variable (churn), which will represent whether or not a customer unsubscribed
    from the service. We will also include some transaction data (number of purchases
    last month), as well as some demographic data (gender, educational level), as
    well as an overall satisfaction survey administered prior to the start of the
    study:


    | Variable | Description |

    |---|---|

    | Monthly.Charges | Average dollar amount of previous purchases |

    | Purch.last.Month | Number of purchases in the month before the study begins
    |

    | Satisfaction | Overall satisfaction with the service supplied on a Likert scale
    |

    | Satisfaction2 | Follow-up satisfaction score |

    | Gender | Male or female |

    | Education Level | Bachelors/masters/doctorate |'
  merge: -1
