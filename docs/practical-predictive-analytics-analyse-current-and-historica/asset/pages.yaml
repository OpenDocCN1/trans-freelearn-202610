  md: "Recall that we initially simulated the second survey data for the churners\
    \ by increasing the satisfaction rating by 1 (Xsatisfaction2). This resulted in\
    \ some satisfaction scores of 6 for some members, which would be impossible. So\
    \ we will first clean those by setting the 6 ratings to 5:\n\n```\n#fix up some\
    \ \"6\" satisfaction scores, that are not possible, and\nSURV2$Xsatisfaction2\
    \ <- as.factor(ifelse(SURV2$Xsatisfaction2==\"6\n```\n\nAssume that at month 5\
    \ there was a promotion targeted to those members who gave low satisfaction ratings\
    \ (1 or 2) in the initial survey. This result in an increased satisfaction score\
    \ for some members who would have churned.\n\nWe will simulate a positive response\
    \ to the survey by upgrading their satisfaction score (Xsatisfaction2) for those\
    \ that churned from 1 or 2 to 3. This is to simulate a slight increase in satisfactions.\
    \ This is only performed for period=1, which is the period following the survey.\
    \ Technically, this is the period assigned by survSplit() function after the cut\
    \ (Period 1). Period 0 is the period before the cut:\n\n```\n#an intervention\
    \ increased low satisfaction scores to \"Average\".\nSURV2$Xsatisfaction2 <- ifelse(SURV2$period==1\
    \ & SURV2$Churn==1 &\n```\n\nWe will also simulate the change in retention status\
    \ for these survey2 customers by changing theÂ Churn status from 1 (left) to 0\
    \ (retained), indicating that the promotion had enough of an effect to keep them\
    \ from leaving:\n\n```\n#Simulate retaining these customers by changing their\
    \ status to a\n#change is detected when the new score is higher than the old sco\n\
    SURV2$Churn2 <-ifelse (SURV2$period==1 & SURV2$Churn==1 &\n       (as.integer\
    \ (SURV2$Xsatisfaction2) > as.in\n       0, SURV2$Churn)fe\nSURV2$ChurnChanged\
    \ <- ifelse(SURV2$Churn==SURV2$Churn2,âÑà,âÝà)\n```\n\nNow, sort the dataframe\
    \ by ID and view the results. Records that have multiple IDs have been split by\
    \ the algorithm:\n\n```\nattach(SURV2)\ntmp <- SURV2[order(CustomerID),]\nstr(tmp)\n\
    ```"
