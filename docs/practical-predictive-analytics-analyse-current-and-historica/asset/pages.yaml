    # Tracking down the cause of the outliers


    Once you have identified a possible outlier, it is always the best course of action
    to determine why they occurred. We have illustrated an outlier that appears in
    one set of data; however, more often than not you will be splitting your data
    into various subsets to try to track down the cause of the outlier. This is assuming
    that you have enough data to work with. Outlier detection for small samples is
    a lot tougher.


    # Ways to deal with outliers


    Here are a few ways to deal with the outliers:


    +   Remove them, or set them to NA. This can make sense if you do not have too
    many of them, and it will make your model easier to explain. The trade-off is
    that you may be removing important data, so use with caution.'
  merge: -1
  img_proc: true
- pgno: 169
  md: '+   - Use a transformation to reduce the variability. Choose the appropriate
    transformation based upon the skewness of the data, or try a **Box-Cox Power Transformation**.
    One advantage to this is that the correct transformation can reduce the influence
    of the extreme observations.

    +   - Bring them down to a pre-controlled level. This can be accomplished by using
    a trimmed or Windsorized mean. This is done in the actuarial profession, since
    some risk can be capped if the variable exceeds a certain level.

    +   - Choose a classification rather than a regression type algorithm, which will
    not be as sensitive to outliers. For decision trees, outliers will tend to show
    up in their own leaves with small counts. At that point, you can choose to ignore
    the outlier by pruning the tree and collapsing it into a different category.

    +   - For regression type algorithms, you can choose an algorithm that penalizes
    large coefficients, such as ridge or lasso regression, which are more robust against
    outliers.


    # Example â setting the outliers to NA


    The next step is of course to start examining these outliers. For our example,
    the extremes are part of the random number generation process, therefore they
    are not really outliers. However, if you encountered this situation in your own
    data, you would begin to track down the reasons these extremes occur. Start by
    trying to associate these extremes with other data elements. Perhaps these outliers
    are appearing in certain age groups and not in others.


    For our example, we will simply be setting the value to NA for these extreme values.
    We will also be creating a new variable, vlx, to house the new variable, and will
    not overwrite the value of the original variable. As you investigate new ways
    of detecting outliers, you can store the new values in additional variables, with
    the assurance that you can always refer back to the original variable:


    ```

    outlier.df$vlx<-ifelse( (outlier.df$v1 >= 2.68 | outlier.df$v1 <=

    tail(outlier.df)

    head(outlier.df)

    ```


    Refer to the console with output of the head() and tail() command and'
