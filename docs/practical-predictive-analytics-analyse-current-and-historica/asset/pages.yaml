    | 45 | 9 | 0 | 0 | 5 | 3 | 6 | 106 | 1 |


    At this point, nothing has really changed analytically. There have been two records
    created with the exact same information, except that one record shows the information
    as it exists at the end of period 6, and the other the information at the end
    of period 12.


    We can see how months 1-12 align with the periods by running a simple crosstab:


