    # Goodness of fit statistics


    Goodness of fit tests determine how well a model fits the data. There are several
    methods of judging how well the data fits the logistic regression model:


    +   - **Data partitioning**: One way we learned how to do this was by dividing
    the data into training and testing datasets and measuring the degree to which
    they produce similar results. That method was demonstrated in Chapter 2, The Modeling
    Process.'
  merge: -1
  img_proc: true
- pgno: 219
  md: '+   - **Single metrics**: Another way to do this is to come up with a quantitative
    measure of how well your independent variable predicts your dependent variables
    on a scale from 0 to 1, with 0 meaning no predictive power, and 1 meaning the
    best possible predictive power. **Area Under the Curve (AUC)**, and R-square are
    examples of these kind of **Goodness of Fit (GOF)** tests.


    +   - R-Square is a popular method of assessing goodness of fit, and it roughly
    measures the amount of explained variation in a model to the total variation.
    In linear regression, it is calculated by first taking the ratio of the residual
    Sum of Squares to the total Sum of Squares and subtracting the result from 1.
    (Coefficient of Determination)


    ```

    R^2 \equiv 1 - \frac{SS_{res}}{SS_{tot}}.

    ```


    +   - Interestingly enough, logistic regression does not have an R-square statistic.
    That is because R-Square is based upon the assumption that the model you are fitting
    is linear, and as we have seen, logistic regression does not make that assumption.
    However, pseudo R-Square measures have been developed which contain the same 0-1
    scale. Of these measure is the McFadden Statistic.


    # McFadden statistic


    The McFadden statistic approximates an R-Square type measure by looking at the
    ratio of the log-likelihood of the full model (analogous to the sum of squared
    errors in the OLS R-square model formula previously defined), divided by the log-likelihood
    of an intercept-only model (similar to the R-square total sum of squares denominator).
    This approximates the improvement of a logistical model over the intercept-only
    null model. The McFadden statistic can be considered a pseudoÂ R-square since
    it will try to measure the same thing, and produce similar R-square results within
    the same 0-1 scale.'
  merge: -1
  img_proc: true
