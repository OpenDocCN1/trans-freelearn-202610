    The goal in this exercise is to score the test dataset, by assigning clusters
    based upon the predict method for the training dataset.


    # Using flexclust to predict cluster assignment


    The standard kmeans function does not have a prediction method. However, we can
    use the flexclust package which does. Since the prediction method can take a long
    time to run, we will illustrate it only on a sample number of rows and columns.
