    some examples of independent and dependent variables and the importance of doing
    preliminary 1-way and 2-way variable analysis as a precursor to modeling.


    Finally, we learned about some of the basic predictive models that we will be
    using later on, and discussed the importance of the bias/variance tradeoff when
