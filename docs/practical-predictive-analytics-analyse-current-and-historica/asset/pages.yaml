- pgno: 55
  md: '# # Analytic process methodologies


    There are several analytic process methodologies which are currently practiced;
    however, I will be discussing only two longstanding methodologies that have been
    in existence for a while, CRISP-DM and SEMMA, which can help you organize your
    journey from problem definition to insight.


    # ## CRISP-DM and SEMMA


    **Cross-Industry Standard process for Data Mining (CRISP-DM) and Sample, Explore,
    Modify, Model, and Assess (SEMMA) are two standard data mining methodologies that
    have been utilized for many years and describe a general methodology for implementing
    analytical projects. There is a good deal of overlap between the methodologies,
    even though the names for each step are different. All of the listed steps are
    important to the success of a predictive analytics project. However, it is not
    necessary that these steps be followed exactly in order. The concepts outlined
    are more or less an outline of best practices. It helps to be aware of the importance
    of each of these steps, and understand how each step is built upon the knowledge
    of the previous ones.**


    Although these steps are listed in sequence for reference, you will discover that
    in practice, they are more iterative and that you will often be cycling back to
    a previous step. This often happens when you discover information, which is in
    conflict with what you have previously discovered.


    As an example, many times you believe that you are finished with the data preparation
    stage, only to find during the modeling stage that you have discovered a glitch
    in the data collection, and that you need to perform more data prep to accommodate
    certain conditions.Â One solution might be to cycle back, try to remedy the data
    situation, while at the same time see how you can continue with your modeling.
    This often entails ''coding around'' the problem by setting flags, or maintaining
    different include files, versions, and'
  merge: -1
  img_proc: true
- pgno: 56
  md: 'so on. It always pays to code defensively when dealing data.Â


    # # CRISP-DM and SEMMA chart


    If you examine the differences between SEMMA and CRISP-DM in the following chart,
    you will notice that steps 2-5 are similar in approach.


    # # Note


    Note that SEMMA adds sampling as an initial phase and CRISP-DM begins with business
    understanding and ends with model deployment.


    | Step # | CRISP-DM | SEMMA |

    |---|---|---|

    | 1 | Business understanding | Sample |

    | 2 | Data understanding | Explore |

    | 3 | Data preparation | Modify |

    | 4 | Modeling | Model |

    | 5 | Evaluation | Assess |

    | 6 | Deployment | |'
  merge: -1
  img_proc: true
- pgno: 57
  md: 'Critical to both processes is the concept of visualizing and communicating
    results to stakeholders. Note that visualization is not considered a separate
    step. Always try to include a presentation layer (plots, charts, and visualizations)
    within each of the steps, so that communications between all of the predictive
    analytical stakeholders are facilitated.


    # Agile processes


    Since developing a predictive model is iterative, agile approaches such as Scrum
    and Kanban work well within a structured framework, especially when they are tied
    to product delivery. However, knowledge discovery, proof of concept, and model
    incremental change improvements also benefitÂ from an agile approach. When used
    as part of the business understanding process, these techniques can also be useful
    in grouping lists of questions into an agile backlog, which can then be incorporated
    in sprints.


    # Six sigma and root cause


    Six sigma has been around for a long time and is associated with process improvement.
    As a result, it has developed its own set of methodologies and techniques, which
    deal with examining business problems and their solutions. Knowledge of basic
    statistical techniques is useful. Often a root cause analysis step (which is an
    important part of six sigma) is followed in order to understand why a data quality
    issue is occurring. For example, data can be passed along through multiple internal
    and external systems and be subject to many manual updates and system glitches
    and failures. In complex systems, it is often unclear where the errors occur.
    Six sigma can also be used to examine some causal relationships using some very
    simple techniques such as the 5 Whys (_Determine the Root Cause: 5 Whys._)


    # To sample or not to sample?


    Sampling is specified as step 1 of the SEMMA process (but not specific to CRISP-DM),
    so I will cover this separately.'
  merge: -1
  img_proc: true
- pgno: 58
  md: 'Traditionally, predictive analytics have started with sampling. Sampling is
    particularly important in certain industries (such as pharmaceutical and healthcare),
    which begin with experimental studies. Sampling is also important in studies which
    you follow groups of people over a long period of time (cohorts). However, other
    kinds of data projects are not research type projects, and they are more machine
    learning oriented. Given that, I hold the belief that many algorithms are easier
    to work with (and are more powerful) if the data follows certain statistical properties,
    such as transforming raw data into dataÂ which follows normal distributions, or
    constructing training data so that there are an equal number of observations for
    various sub segments of the population. Sampling can be critical in preparing
    the data for these algorithms, so that data is more representative of the larger
    dataset.


    Here are some other advantages to sampling:


    +   - With a smaller sample, you will have the ability to get to know all of your
    data. If necessary this means going down to the record level. This is something
    that would not be practical with very large datasets. This also enables you to
    ask more specific detailed level follow up questions, in addition to larger group
    level questions.

    +   - Sampling allows you to contemplate potential interesting subsets of the
    population. You can first random sample a smaller subset of something that looks
    interesting, and then test to see if that group behaves heterogeneously.

    +   - Sampling also speeds up algorithmic development. Spending a lot of time
    running algorithms on very large datasets is often not productive, since you can
    spend a lot of processing time running memory-consuming algorithms. If you anticipate
    a lot of future tweaking for the algorithm, I suggest testing your algorithms
    first on a smaller representative sample, and then scaling up to the much larger
    dataset.

    +   - With sampling, you are more in control of the ultimate data quality of your
    samples. I say this since you would have already done your legwork by looking
    at the characteristics of your population first, and then designing an appropriate
    sampling strategy which minimizes biases.

    +   - Performing Bootstrap (repeated) sampling can help illustrate any biases
    in large data samples. If you see some strange stuff appear via sampling,'
  merge: -1
  img_proc: true
- pgno: 59
  md: 'there is a good chance that there is a much larger problem in the larger data.


    # Using all of the data


    However, many data scientists will choose to use the entire population as the
    basis of analysis, instead of a sample. I suspect one reason is that often it
    is difficult to obtain a reliable sample, especially when the data has many different
    sources, and some are of unknown data quality. Good reliable data costs money
    to collect. Another reason is that the data scientists may not be familiar with
    sampling techniques, or believe that more is always better. Therefore, it is important
    to understand some important points about using all of the data:


    +   - You can use all of the data if it accurately represents the underlying population.
    If *all the data*Â is the underlying population, you can’t do better than that,
    but proceed with caution. What you think is a population may just be a very large
    sample. Future data may reflect a reality that is completely different. For very
    large data sets, you can never be quite sure if what we are looking at IS representative,
    since the amount of data can simply be overwhelming, and the underlying data collection
    methods may be unknown or unreliable. Be particular careful for data which is
    collected over long periods of time. Often data collection methods change, or
    the way calculations are performed are altered.


    +   - When you use an incredibly large amount of data, what you are measuring
    is not necessarily representative of the factors which motivate the response.
    For example, clickstream data and online survey data is not always representative
    of the why?Â Deeper inspection (through smaller samples) is always advisable to
    examine motivation.


    +   - As mentioned earlier, processing huge amounts of data consumes a lot of
    computational resources. Processing accurate samples can take a fraction of that
    time


    +   - With large datasets, you will just about always find correlations somewhere.
    Related to this is the concept of significant correlation versus effect size.
    This means that even if you find a statistically significant correlation, the
    differences can be so slight, so as to render'
  merge: -1
  img_proc: true
