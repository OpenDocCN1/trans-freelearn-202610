  md: '# Transposing a dataframe


    You will sometimes be given a format that contains data that is arranged vertically
    and you want to flip it so that the variables are arranged horizontally. You will
    also hear this referred to as long format versus wide format. Most predictive
    analytics packages are set up to use long format, but there are often cases in
    which you want to switch rows with columns. Perhaps data is being input as a set
    of key pairs and you want to be able to map them to features for an individual
    entity. Also, this may be necessary with some time series data in which the data
    which comes in as long format needs to be reformatted so that the time periods
    appear horizontally.


    Here is a data frame that consists of sales for each member for each month in
    the first quarter. We will use the text='' option of the read.table() function
    to read table data that we have pasted directly into the code. For example, this
    is from data that has been pasted directly from an Excel spreadsheet:


    ```

    sales_vertical <- read.table(header=TRUE, text=''

    memberid Month sales

    1 1 17

    1 2 15

    1 3 11

    2 1 6

    2 2 20

    2 3 11

    3 1 9

    3 2 33

    3 3 43

    4 1 11

    4 3 13

    4 4 12

    '')

    ```


    After running the preceding code, the sales_vertical command displays the data
    in the console similar to how it was coded in the read.table() function:


    ```

    >sales_vertical

    memberid Month sales

    ```'
