- pgno: 192
  md: '# # Chapter 4. Introduction to Regression Algorithms


    > > "It ain''t ignorance causes so much trouble; it''s folks knowing so much

    > that ain''t so." A A A A A A A A A A A A A A A A A A A A A A A A A A A A A A

    > A A A A A A A A A A A A A A A A A A A A A A A A A A A A A A A A A A A A A

    > A A A A A A A A A A A A A A A A A A A A A A A A A A A A A A A A A A A A A

    > A A A A A A A A A A A A A A A A A A A A A A A A A A A A A A A - Billings


    Every day, the number of predictive analytics techniques seems to be

    increasing. There is a constant debate about whether we need better

    algorithms, or whether more or better data is needed in order to attack a

    predictive analytics problem.


    Whatever the case, it is always good to keep abreast of all of the available

    algorithms at your disposal. It is equally important to hone your skills on the

    top three or four algorithms that can tackle 90% of the problems that you will

    face, and be able to understand the situations in which it makes sense to use

    them.


    This chapter is the first of two chapters which will present four basic

    algorithms which cover a lot of typical business situations that you will

    encounter. In fact, many of the data science surveys which poll analytics

    practitioners will often include these techniques in the top techniques that all

    data scientists should know. Among these techniques, we will discuss

    regression in detail for this chapter and the three remaining core algorithms

    in the following chapters. But let us start by introducing all four:


    +   - Regression techniques represent a standard parametric approach to

    +   problem solving which assigns a coefficient or weight to each of the

    +   independent variables. Variables are related to the outcome variable via

    +   a `linear` function.

    +   - Decision trees are an important algorithm class which can be used as an

    +   alternative to regression when the relationships of the variables may not

    +   necessarily be linear.

    +   - Cluster analysis is also discussed as a form of unsupervised learning,'
  merge: -1
  img_proc: true
- pgno: 193
  md: 'which is more exploratory in nature, but not necessarily predictive.


    +   • Support vector machines are useful in situations in which you have high
    dimensional data. High dimensional data comes into play when you have a large
    number of variables appearing in the data, and you have chosen to use all or most
    of them in the model, without first applying some sort of data reduction technique.
    This can often occur as you apply analysis to some real-time data in raw form,
    in which case models need to be applied in split-second time.'
  merge: -1
  img_proc: true
- pgno: 194
  md: '# # Supervised versus unsupervised learning models


    We have already discussed the concept of target (dependent) variables and independent
    variables, or features. Features (or independent variables) are used to describe
    the relationship with, or to predict values of, a target variable. After defining
    your independent and depending variables, you will formulate your model. One way
    to characterize the way in which a model learns from the data, is by classifying
    it into either a supervised or unsupervised learning model.


    # ## Supervised learning models


    When the possible values of a target variable are specified and labeled, a model
    is considered supervised, that is, we know what we want to predict, and the goal
    is to find the most appropriate predictive model which will predict the outcome.


    As an example, if we are predicting the approval rating for a product, we know
    what we are predicting (approval rating of a product), and we also usually know
    the range of possible outcomes. It could be a percentage from 0-100, or it could
    be some category such as high approval or low approval.


    When the problem is supervised, the choice of which models to use are usually
    dependent upon the type of the target variable, that is, whether it is continuous
    or categorical. It can also be dependent upon factors such as bias/variance (discussed
    in Chapter 2, The Modeling Process), and the various assumptions we are willing
    to make concerning the model. Regression and decision tree algorithms are considered
    supervised algorithms since the target variables or target classes (in the case
    of decision trees) are specified even before the predictive modelling begins.'
  merge: -1
  img_proc: true
- pgno: 195
  md: '# Unsupervised learning models


    Unsupervised problems are more exploratory in nature. In an unsupervised learning
    context, one doesn’t specify a target variable, or even have any idea what something
    should be. A data scientist is usually given a set of attributes, and then asked
    to derive some relationships, or discover some new attributes which are not obvious
    from looking at the data.


    As an example, during an exploratory customer analysis, you could look at different
    attributes of customers, such as age, gender, and sales history, which could then
    lead you to create new variables (which hadn’t existed before), which would describe
    each customer as best, good, or average. You could then choose an appropriate
    algorithm to suit this problem which might be a clustering algorithm, a decision
    tree, or a support vector machine.


    Another example would be to use a neural network algorithm with some financial
    trading data in order to uncover some potential fraud or anomaly findings.


    Usually, you will match up an unsupervised algorithm (such as neural networks)
    cast to an unsupervised setting (find fraud), but that is not always the case.
    You may find that you are able to incorporate traditional supervised techniques
    such as regression to find results which are totally unexpected using post-diagnostic
    tools which would examine such thing as residuals and outliers. That might lead
    you to other explorations which could cause you to reformulate your problem.


    Finally, supervised learning and unsupervised learning often work hand in hand.
    It is possible to find yourself creating a new variable, discovered through an
    unsupervised process, which in turn would lead to incorporating this as a latent
    variable into a traditional supervised algorithm, such as a decision tree.'
  merge: -1
  img_proc: true
- pgno: 196
  md: '# # Regression techniques


    Regression analysis (which is considered a supervised learning algorithm) dates
    back to the early 1800s when Gauss and Legendre utilized these techniques to measure
    the trajectories of the planets around the sun ([https://en.wikipedia.org/wiki/Regression_analysis](https://en.wikipedia.org/wiki/Regression_analysis)).
    The regression algorithm''s usage is still going strong within the predictive
    analytics community due to its large base of literature and its ability to adapt
    to a wide range of problems.


    Linear regression is the basic regression technique to use when your target variable
    is continuous. Linear regression is built upon the concept of ordinary least squares,
    and the functional form of the model is:


    ```

    $$y_i = \beta_0 + \beta_{1xi1} + \beta_{2xi2} + \dots \beta_{pxip} + \varepsilon_i$$

    ```


    The preceding formula illustrates that linear regression models are additive,
    that is, the results of the prediction are calculated by summing the cross-product
    values of all of the independent variables, and then adding an intercept (first
    term of the formula), and error term (last term of the formula). That calculation
    yields the *prediction* for the dependent or target variable (y). The linear regression
    line is fitted via the method of **ordinary least squares** (OLS), in which the
    squared (residual) differences between the observed value and the predicted distances
    on the regression line are minimized. Squared differences are used, rather than
    the actual differences, since we are really interested in the magnitude, not the
    direction of the differences. Squaring the results eliminates the negative or
    positive sign.Â The residuals are often used to test the errors resulting from
    the predictive model.


    # ## Advantages of regression


    One advantage to using linear regression is that it facilitates easy'
  merge: -1
  img_proc: true
- pgno: 197
  md: 'interpretation of the linear coefficients which are attributed to each variable.

    Specifically, the slope of each variable in a regression model (the $\hat{I}^2$
    in front

    of each of the regression terms), will indicate the change in the prediction for

    each 1-unit change in the corresponding independent variable, with all other

    variables in the model held constant. There is a fair amount of flexibility in

    using linear models in that you can also model nominal (categorical)

    independent variables as well as continuous ones, and incorporate a fair

    degree of non-linear relationships by using variable transformations and

    interactions. The body of knowledge for linear regression is vast, and based

    heavily on probability theory.


    While linear regression can be very powerful when used correctly, here are

    some of the major assumptions of linear regression which you should pay

    attention to:


    +   Independence: the observations have no relationship with each other.

    +   This assumption will often be violated when you are dealing with time-

    +   series data. Knowing how the data was sampled will help with

    +   understanding whether or not the data is independent and randomly

    +   sampled.


    +   Linearity: there is a linear relationship between the independent and

    +   dependent variables. Other kinds of relationships can exist; for example

    +   there can be a curvilinear relationship between the variables. The second

    +   plot of the first row in the Wikipedia reference for Anscombe''s quartet

    +   shows how this can occur.


    +   Normality: the errors term in the regression model is normally

    +   distributed. Intuitively, normally distributed residuals are good to have

    +   since they imply that the correct variables are all accounted for in your

    +   model, and there is nothing left to explain. You are just left with random

    +   error.


    +   Equal variances of errors: the error terms also have constant variance.

    +   For example, non equality of variances can mean that the errors in

    +   prediction are increasing or decreasing as values of the independent

    +   variables grow larger or smaller.


    If any of the assumptions are grossly violated, you probably should not be

    using linear regression. I say grossly since there is a certain degree of'
  merge: -1
  img_proc: true
- pgno: 198
  md: 'tolerance that any model has for assumptions, and there are statistical tests
    that can be used to measure that degree for some of the assumptions.

    However, if your data meets the assumptions of linear regression, the predictions
    can be quite powerful.'
  merge: -1
  img_proc: true
- pgno: 199
  md: '# Generalized linear models


    Generalized linear models (GLMs) refer to a larger framework of prediction techniques
    which can include linear regression, logistic regression (used to predict binary
    outcomes), and poisson regression (used to predict counts). They are a generalization
    of linear regression techniques which allow you to work with other distributions
    which have non-normal error terms. GLMs can be implemented in R by using the glm
    package, in which you supply a link function to specify which distribution you
    are modeling. That makes it easier to work with different types of models within
    a single package, using standard syntax.


    # Linear regression using GLM


    In Chapter 1, Getting Started with Predictive Analytics, our original example
    that we used to predict womens'' heights based upon womens'' weights used the
    lm package. We could also have used the glm package, specifying family=Gaussian
    as the link function:


    ```

    lm_output <- lm(women$height ~ women$weight)

    ```


    or:


    ```

    glm_output <- glm(women$height ~ women$weight, family=gaussian)

    ```'
  merge: -1
  img_proc: true
- pgno: 200
  md: '# # Logistic regression


    A very popular use of GLM is via logistic regression. This is the type of regression
    to use when your target variable is a binary value, that is, it can only take
    on two values. These two binary values usually take the form:


    +   - Something occurredÂ (binary value = 1)

    +   - Something did not occurÂ (binary value = 0)


    These two values typically vary according to the type of industry. Here are some
    examples of binary responses in different industries:


    +   - **Marketing**: Did the customer respond to a specific offer or not?

    +   - **Health care**: Was a specific drug effective in treating a condition or
    was it not?

    +   - **Financial**: Did a specific trading strategy lead to a profit or not?

    +   - **Web tracking**: Did a customer abandon a shopping cart at the checkout
    or not?


    Virtually every industry will have problems which can be formulated in terms of
    binary outcomes. In fact, sometimes standard linear regression problems are often
    recast, so instead of predicting the specific values for the target value, the
    problem will be reformulated into a binary problem. Often this is done to take
    advantage of some of the relaxed assumptions of logistic regression.


    You may ask, "Why not use regular linear regression for these kinds of problems?"
    Unfortunately, linear regression itself will not work when you have a binary outcome
    variable for a variety of reasons. Here are two important ones:


    +   - First of all, if regular regression is used, the results will extend way
    beyond the bounded ranges of 0 and 1, since a line is infinite in both directions.

    +   - Second, one of the requirements of regular regression is that the residual'
  merge: -1
  img_proc: true
- pgno: 201
  md: 'errors are normally distributed, and this is not true in the case of logistic
    regression. The error term is related to a conditional Bernoulli distribution.


    However, logistic regression does share many of the features of regression models:


    +   - It is a low variance algorithm, and as a result it is fairly simple to implement
    and explain, and does not have as many problems with overfitting as some of the
    other algorithms.

    +   - It also has good capabilities for feature selection, and the addition of
    transformed variables and interactions which it shares with linear regression.
    However, what it *does* predicts (the likelihood of an event), sets it apart from
    standard regression techniques.


    # The odds ratio


    While linear regression will predict an actual outcome for the dependent variable,
    logistic regression does not predict actual outcomes or events. What it will predict
    is the likelihood, (or odds ratio) of one of the events occurring. This is slightly
    different since it is related to the probability of an event occurrence (rather
    than the prediction of the event itself).


    The odds ratio is defined as the ratio of the probability of an event A occurring
    divided by the probability of an event not occurring. In functional form, this
    ratio is expressed as a natural logarithm:


    ```

    ln\left( \frac{P}{1 - P} \right) = a + \beta_1X_1 + \beta_2X_2 + \dots \beta_1X_1

    ```


    # The logistic regression coefficients


    The coefficients returned from the logistic regression are standardized, in that'
  merge: -1
  img_proc: true
- pgno: 202
  md: 'they measure the effect of a 1-unit change in the independent variable on the
    log of the odds ratio, and not on the change of the variable itself.


    The algorithm determines these coefficients not by using the OLS method used in
    linear regression, but it determines the coefficients by using a method called
    **maximum likelihood estimation**. Simply put, this means that the algorithm starts
    with arbitrary values of the coefficients and then puts forth an initial model.
    Then the algorithm measures the errors in the model and adjusts the coefficients
    to new values so that the results of the next model conform better to the values
    contained in your data. This is performed iteratively until the errors converge
    to an optimal solution.


    Since the predictions from a linear model are determined by summing up the cross
    products and intercepts from the model, this result can be compared to a 0.5 percent
    cut-off value, which is used as a decision rule to classify an occurrence into
    one of the two values of the target variables. So while the output of a logistic
    regression is really a function of an odds ratio, logistic regression can essentially
    be used as a classification algorithm.


    # Example - using logistic regression in health care to predict pain thresholds


    This example takes data from a research study which predicts whether or not a
    subject reported experiencing a reduction of pain for a condition, after being
    administered various treatments. The `Gender`, `Age`, and the `DurationÃ` columns
    of any pre-existing pain were also used as independent variables in the model.
    The outcome variable, `Pain`, is coded as 1 (reported pain), or 0 (reported no
    pain). The `Treatment` column refers to 1 of 2 treatments (A or B), as well as
    a control group (P).


    # Reading the data


    We will use the `read.table` with the `text=` option to read the raw data inline,
    that is, without the need to first create an external file. This method is useful
    for analysis in which you are copying and pasting data from another source, for
    example, a spreadsheet:'
