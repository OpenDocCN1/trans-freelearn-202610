  md: '# fit


    ![](img/672c0cf8ba3c000a6529b117ed96945e_98_0.png)


    # Dimension reduction techniques


    You will often be examining hundreds or even thousands of variables, and dimension
    reduction is a technique that you can use to drastically reduce the number of
    rows or variables that you need to examine. The premise behind dimension reduction
    is duplication, that is, many variables which are measuring the same thing. For
    example, reading, writing, math, and musical aptitude scores are all important
    in predicting a college GPA, but it is possible that if you only used a musical
    aptitude score in combination with a writing score, you could achieve the same
    prediction accuracy as compared to using all four measures. It might also be easier
    to explain as well, that is one example of why you would use a dimension reduction
    technique.


    When you are looking at reducing the actual number of variables, consider principal
    components. You will end up with the same number of observations but will limit
    the number of variables you look at (the Principal Components section).'
  merge: -1
  img_proc: true
- pgno: 99
  md: 'When you are considering reducing the dimensionality of *rows*, use clustering
    methods.


    # Principal components


    **Principal Component Analysis (PCA)** is useful in cases in which you have too
    many variables and you wish to capture all of the variation of data into one or
    two variables. Principal component does this using matrix algebra to create linear
    combinations of all of the variables.


    PCA is also used to see which variables have the most influence within each of
    the principal components, so often it is a way to discard certain variables when
    a PCA analysis indicates certain variables have little effect on the outcome.


    An example using the variables of height and weight is a good one. Since height
    and weight are positively correlated, choosing to use only height or only weight
    as an independent variable to predict body mass might not make much of a difference.
    So, we can create a new variable which is a linear combination of height and weight
    and use that as a variable instead.


    # Clustering


    Clustering is a method which groups data into different classes, so that each
    class is similar to each other. There are various methods that can be used to
    define similarity. K-Means clustering is probably the most popular method of clustering.
    This method uses distances measured to assign data observations to the closest
    class. Clustering is often used in marketing in order to develop different customer
    segments.


    Clustering is an unsupervised algorithm and is subjective. You can specify beforehand
    how many groups you wish to cluster into. This number is somewhat arbitrary, and
    if the goal is interpretability, it can yield to different interpretations.


    Scatterplots are often used to show data clusters using only two variables'
  merge: -1
  img_proc: true
- pgno: 100
  md: '(one is on the $x$ axis and the other on the $y$ axis).


    Here is an example of some scatterplots which can be used to pick out clusters
    by seeing which data points *congregate* together.


    ![](img/672c0cf8ba3c000a6529b117ed96945e_100_0.png)


    The plot on the right shows five distinct clusters. You can see that very low
    values of variable $x$ tend to go with very low values of variable $y$. However,
    it is a bit unclear what the clusters should be for the plot on the left. Sometimes
