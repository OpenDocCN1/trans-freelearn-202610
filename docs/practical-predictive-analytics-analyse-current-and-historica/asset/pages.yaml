  md: "An inner join will consolidate two records based on the matching of a single\
    \ or multiple key that they both have in common. An outer join will also merge\
    \ the two tables together by keys, but will also include any rows that are not\
    \ matched. You can identify an outer join by observing the existence of NAs in\
    \ any of the matching keys. Inner joins are usually more efficient, but should\
    \ only be used if you expect to have matching keys of both of the joined files.\n\
    \nThe join2Â dataframe is an inner join that will contain only those members that\
    \ had a purchase record. The sqldf() function will match all the observations\
    \ by member:\n\n```\njoin2 <- sqldf(\"select * from 'member' inner join 'purchases_filt\
    \ member.memberid=purchases_filtered.memberid2\")\n```\n\nImmediately after the\
    \ join, perform a str() function on theÂ join2Â dataframe:\n\n```\nstr(join2)\n\
    ```\n\nThe str() function will show that there are 489 observations, indicating\
    \ that not all members had purchases:\n\n```\n> str(join2)\n'data.frame':\t489\
    \ obs. of  16 variables:\n $ memberid : int  192 676 909 971 384 963 541 9 79\
    \ 272 ...\n $ Age      : int  23 20 31 29 28 20 33 26 26 24 ...\n $ Gender   :\
    \ Factor w/ 2 levels \"M\",\"F\": 2 2 2 2 2 1 1 2 1 1 ...\n $ DOB      : Date,\
