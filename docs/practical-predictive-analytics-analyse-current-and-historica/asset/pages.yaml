- pgno: 108
  md: '# Step 5 evaluation


    Model evaluation deals with how accurate or useful the model you have just developed
    is or will be in the future. Model evaluation can take different forms. Some are
    more subjective and are domain oriented, such as placing it under the scrutiny
    of experts in your field, and some are more technically oriented. There are many
    metrics and procedures available to assess a model. At the basic level, you have
    many statistics (some of them with acronyms known as AIC, BIC, and AUC) which
    purport to convey the goodness of a model in a single metric. However, these metrics
    by themselves are unable to convey the purpose and application of a predictive
    model to a larger audience and often these metrics are in conflict. Some context
    is needed. Some would argue that one could also develop a perfectly good predictive
    model and then be unable to convey its purpose and application to a larger audience.
    In my opinion, that is a bad model, regardless of how well an evaluation metric
    fits. And then there is the performance factor. A model may work well on sample
    data but be too slow to become actionable in the real world. In short, there is
    no single metric that you should use for model evaluation. The best course is
    to look at it from all angles and then present the objective results.


    # Model validation


    The basic premise of predictive analytics model validation is that you develop
    your model on one subset of the data (called the training dataset), and then demonstrate
    that your model has the capability to successfully predict similar results on
    a different set of data. Of primary importance the data set known generically
    as test. Â The test dataset is also known as a holdout sample. The training and
    test datasets are randomly determined before any model building begins, and the
    data is never changed. The validation data is a third dataset that is sometimes
    used to further test the validity of the data. It typically contains data the
    modeler has never seen before and is introduced after one model has been developed
    and determined to be the champion model.'
  merge: -1
  img_proc: true
- pgno: 109
  md: 'The following code will create a simple Naive Bayes model and create a `confusionMatrix`
    (or classification error table), which shows how many predictions were classified
    correctly. For the `iris` dataset, 92% of the predictions were correct. Note that,
    for this example, we are using the confusion matrix, which is part of the caret
    package, rather than computing the accuracy manually as we did in the previous
    examples:


    ```

    require(caret)

    require(e1071)

    data(iris)

    set.seed(123)

    partition.index <- createDataPartition(iris$Species, p=.5, list=F

    Training <- iris[ partition.index,]

    test <- iris[-partition.index,]

    model <- naiveBayes(Species~.,data = Training)

    predictions <- predict(model, test[,1:4])

    # summarize results

    % confusionMatrix(predictions, test[,5])

    ```'
