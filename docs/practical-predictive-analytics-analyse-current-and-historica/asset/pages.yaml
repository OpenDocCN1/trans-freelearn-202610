  md: '# # Creating the market basket transaction file


    We are almost there! There is an extra step that we need to do in order to prepare
    our data for market basket analysis.


    The association rules package requires that the data be in transaction format.
    Transactions can either be specified in two different formats:


    +   1. One transaction per itemset with an identifier and this shows the entire
    basket in one line, just as we saw with the Groceries data.

    +   2. One single item per line with an identifier.


    Additionally, you can create the actual transaction file in two different ways,
    by either:


    +   1. Physically writing a transactions file.

    +   2. Coercing a dataframe to transaction format.


    For smaller amounts of data, coercing the dataframe to a transaction file is simpler,
    but for large transaction files, writing the transaction file first is preferable,
    since append files can be fed from large operational transaction systems. We will
    illustrate both ways.


    # # Method one âÂĄ Coercing a dataframe to a transaction file


    Now we are ready to coerce the dataframe. We will create a temporary data frame
    containing just the transaction ID (InvoiceNo), and the descriptor (lastword).


    First, we will verify the column names and numbers for these two variables. We
    can see that they correspond to columns 1 and 12 of the dataframe by first running
    a colnames function on OnlineRetail2:'
  merge: -1
  img_proc: true
