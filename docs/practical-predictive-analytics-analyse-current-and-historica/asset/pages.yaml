    Observe that any customer who has had a tenure of more than 6 months has also
    had an additional record added. This additional record reflects the customer’s
    updated status and updates the value of variables that have changed.


    In this case, we have performed one cut at 6 months. The data also includes two
    new variables: `time0`, which designates the starting period; and an episode variable,
    which we named period, and is incremented sequentially for every time-based change
    in a variable. We only showed an example with one change in a time-based variable.
    For longer observation periods you can have many more changes.


    # Running the time-based model


