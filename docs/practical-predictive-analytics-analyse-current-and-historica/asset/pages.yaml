  md: 'Chisq= 16.3 on 5 degrees of freedom, p= 0.00597


    The chi-square test looks at all of the groups together, and will indicate significance
    if any one of the groups is significantly different from the others. To see which
    particular group behaves differently, you need to examine the observed and expected
    column, as well as the squared error terms in the last two columns. Higher values
    indicate deviation from the expected. On examination of the output, we see that
    there are two effects that seem to be the significant groups:


    +   • Females with bachelor''s degrees. We expected 150 churners and we observed
    111. This is a group that has relatively lower churn than the others.

    +   • Males with doctorate degrees. The observed survival rate is higher than
    what would be expected.


    Earlier, we saw that a college degree by itself didn''t make much of difference.
    But adding gender to the mix can identify specific cohorts that can be targeted.


    Save the history:


    ```

    savehistory(file="ch5 interaction plot km curves.log")

    ```


    # Transforming service calls to a binary variable


    Variables with a higher number of levels will often be difficult to manage even
    though there may be statistically significant differences shown in the curves.
    This can be due to the smaller sizes of the groups. Rather than try to analyse
    all the groups at once, it often makes more sense to first find a cutoff point
    that collapses the variable into a binary outcome.


    For example, running the survdiff() function on the number of service calls (ranging
    from 0 to 5) shows a significant difference between the individual survival curves:


    ```

    > survdiff(SurvObj ~ Xservice.calls, data = ChurnStudy)

    ```'
