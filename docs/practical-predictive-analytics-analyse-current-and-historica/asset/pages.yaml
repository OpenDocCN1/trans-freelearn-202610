- pgno: 190
  md: '# Summary


    In this chapter, we learned all about getting data prepared for analysis so that
    you can start to run models. It starts with inputting external data in raw form,
    and we saw that there are several ways you can accomplish these available methods.
    You also learned how to generate your own data and two different ways you can
    use to join, or munge data together, one using SQL and the other using `dplyr`
    function.


    We later proceeded to cover some basic data cleaning and data exploration techniques
    that are sometimes needed after your data is input, such as standardizing and
    transposing the data, changing the variables type, creating dummy variables, binning,
    and eliminating redundant data. You now know about the key R functions that are
    used to take a first glance at the contents of the data, as well as its structure.


    We then covered the important concepts of analyzing missing values and outliers,
    and how to handle them.


    We saw a few ways to decrease the number of variables to a manageable level, using
    techniques such as Principal Component Analysis and all subsets regression.


    Finally, we learned to use Random Forest algorithms to identify the most important
    variables for modeling.


    This concludes the data preparation section, and we have just scratched the surface
    in terms of the ways you can prepare your data for modeling.


    In the next chapter, we will cover more detail about Random Forests, as well as
    regression, decision trees, SVM, and some other things that will allow us to build
    a solid foundation of basic algorithms that you can use for your own core models.'
  merge: -1
  img_proc: true
