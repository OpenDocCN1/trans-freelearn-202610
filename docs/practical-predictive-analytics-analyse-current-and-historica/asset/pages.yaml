  md: '# Becoming large by starting small


    The strategy we will use in this chapter is to first retrieve a small existing
    publicly available dataset (Pima Indians diabetes). Â Then we will perform some
    basic exploratory analysis, compute some key statistical properties, and then
    use those properties to simulate a much larger dataset that we will use to input
    into Spark. The key characteristics that we will use to generate this ''big data''
    Â will be:


    +   • The means/standard deviations of the variables: the goal will be to generate
    means and standard deviations for the large dataset, which are close to the equivalent
    means and standard deviations of the small dataset.

    +   • The correlations of the variables: since statistical modeling and analysis
    is largely based upon the association among the variables, the goal of the simulation
    will be to preserve all of the 2-way correlation numbers for the large dataset
    which exist in the small dataset.

    +   • The underlying distribution of the variables: we will assume normal distributions
    for all the variables, except for the outcome variables (Diabetes, versus NonDiabetes.
    However, we will simulate the outcomes to correspond with the proportion reflected
    in the sample dataset.


    # The Pima Indians diabetes dataset


    To build the characteristics of the Spark dataframe, we will first take a small
    dataset, determine the basic statistical properties of this dataset, and then
    build a Spark dataframe based upon these properties.


    The Pima Indians diabetes dataset contains the following attributes:


    +   • Number of times pregnant

    +   • Plasma glucose concentration with two hours in an oral glucose tolerance
    test

    +   • Diastolic blood pressure (mm Hg)'
  merge: -1
  img_proc: true
