- pgno: 257
  md: 'We will illustrate the k-means function to perform k-means clustering on the
    variables `units.bought`, `TotalPaid`, and `Days.since`. One characteristic of
    k-means clustering is that each observation can be categorized into one and only
    one cluster. K-means requires all variables to be numeric, you cannot use categorical
    variables in the `kmeans` function.


    One decision you will need to make is how many clusters you would like kmeans
    to produce. I usually like to aim for between 5 and 15 clusters. Anything more
    than that will make it difficult to explain the meaning behind each individual
    cluster, but you can certainly do that. One problem with increasing the number
    of clusters is that the k-means algorithm specifies approximately equal size clusters,
    so as you increase the number of clusters, some of the outlier clusters will have
    a smaller number of members.


    The output from k-means will give you a general idea of the goodness of fit of
    your clusters. The within cluster sum of squares indicates the separation of the
    individual data points within each cluster. Smaller numbers show the cluster is
    more homogeneous. The ratio `betweenss/totss` is a single metric that you can
    use as a measure of how all of the clusters are separated as a group. A higher
    number indicates a better separation of clusters.


    For this example, we will generate clusters of size 3, 5, and 7:


    ```

    attach(x)

    #cluster on the RFM variables

    y <- subset(x, select = c(units.bought, TotalPaid, Days.since))

    #perform kmeans producing 3 and 5 clusters

    ```


    # Note


    K-means relies on a random seed in order to initially populate a pseudo-random
    cluster assignment. Changing the seed may change your results. Since clustering
    involves some degree of human interpretation, it is common to run the algorithm
    several times using different seeds, and observe how well they conform (or not)
    with each other.'
  merge: -1
  img_proc: true
- pgno: 258
  md: '```

    #always set seed before clustering

    set.seed(1020)

    clust3 <- kmeans( y,3)

    clust3$betweenss/clust3$totss

    clust5 <- kmeans( y,5)

    clust5$betweenss/clust5$totss

    clust7 <- kmeans( y,7)

    clust7$betweenss/clust7$totss

    ```


    After creating the three clusters, print the ratio of the cluster between sum
    of squares to the cluster total sum of squares. That will give you a starting
    metric to begin comparing clusters. A higher number implies better separation
    between the clusters:


    ```

    > set.seed(1020)

    > clust3 <- kmeans( y,3)

    > clust3$betweenss/clust3$totss

    [1] 0.8706681

    > clust5 <- kmeans( y,5)

    > clust5$betweenss/clust5$totss

    [1] 0.9178001

    > clust7 <- kmeans( y,7)

    > clust7$betweenss/clust7$totss

    [1] 0.9381889

    ```


    So, based on the output above, cluster 7 has the highest betweenss/totss ratio,
    and having seven clusters would be considered the optimal number of clusters.
    But, if you run the analysis, increasing the number of clusters each time, you
    will always see an increase in the ratio. So, we need to determine where the law
    of diminishing returns kicks in.


    # Cluster elbow plot


    One way to determine this is by using an automated method known as the elbow method
    in which you plot the total within clusters sum of squares for all values within
    a range, and look at where an elbow method develops in the plot:


    ```

    #elbow method

    set.seed(1020)

    # Compute and plot wss for k = 3 to k = 15

    ```'
  merge: -1
  img_proc: true
