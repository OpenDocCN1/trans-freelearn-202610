  md: '# # Spark SQL


    Another way to explore data in Spark is by using Spark SQL. This allows analysts
    who may not be well-versed in language-specific APIs, such as SparkR, À PySpark
    (for Python), and Scala, to explore Spark data.


    I will describe two different ways of accessing Spark data via SQL:


    +   - Issuing SQL commands through the R interface:


    This has the advantage of returning the results as an R dataframe, where it can
    be further manipulated


    +   - Issuing SQL queries via databricks SQL `magic:` directive


    This method allows analysts to issue direct SQL commands, without regard to any
    specific language environment


    Before processing an object as SQL, the object needs to be registered as a SQL
    table or view. Once it is registered, it can be accessed through the SQL interface
    of any language API.


    Once registered, you can use the show tables SparkR command to get a list of registered
    tables for your session.


    # ## Registering tables


    ```

    #register out_sd as a table


    SparkR::registerTempTable(out_sd,"out_tbl")

    SparkR::cacheTable(sqlContext,"out_tbl")


    head(SparkR::sql(sqlContext, "SHOW tables"))

    ```'
  merge: -1
  img_proc: true
- pgno: 555
  md: '# Issuing SQL through the R interface


    Writing SQL this way consists of constructing a valid SQL string query via the
    `sql` function:


    +   - The query must reference a registered table


    +   - You can assign the results of the query to a dataframe:


    Here is an example of getting a frequency count of the available samples from
    the registered object out_table. Â Note that the code begins with %r command which
    is a special Databricks directive that indicates that the code that follows applies
    to R. Â However, it is sometimes necessary to specify this (even in R notebooks),
    when a previous Â code chunks has used another language directive, such as %sql,
    or %python.


    ```

    %r

    rm(tmp)

    tmp <- SparkR::sql(sqlContext, "SELECT sample_bin, count(*) FROM out_tbl group
    by sample_bin")

    ```


    +   - Additionally in databricks, sqlcontext is preassigned, and so can be omitted
    in the code as follows.


    ```

    tmp <- SparkR::sql("SELECT sample_bin , count(*) FROM out by sample_bin")

    ```


    +   - Once you have extracted the data to a tmp dataframe, you can display the
    counts of each of the samples. In subsequent queries, you can select samples corresponding
    to the size and proportion of the outcome you are interested in:'
