  md: "# Examining survival curves\n\nKaplan Meir survival curves are usually a good\
    \ place to start when examining the effect of different single factors upon the\
    \ survival rate, since they are easy to construct and visualize. Later on, we\
    \ will example cox regression, which can examine multiple factors.\n\n**Kaplan\
    \ Meir (KM) curves are actually step functions in which the** `survival` **object,\
    \ or hazard rate, is estimated at each discrete time point. This survival rate\
    \ is computed by calculating the number of customers who have survived (are still\
    \ active), divided by the number of customers at risk. The number of customers\
    \ at risk (which is the denominator) excludes all customers who have already churned,\
    \ or haven't achieved the tenure specified at any particular time point.**\n\n\
    To illustrate, if we table `ChurnStudy` by the number of months active (`Xtenure2`),\
    \ we can see that for month 1, there were 44 members whose survival rate is calculated\
    \ as (1984 -19) (Number left after end of month 1 / 1984):\n\n```\ntable(ChurnStudy$Xtenure2,\
    \ ChurnStudy$Churn)\n    0   1\n1   25  19\n2   12  69\n3   24  45\n4    9  29\n\
    5   50  50\n6   63  61\n7  100  73\n8  124  98\n9  132 114\n10 150 159\n11 144\
    \ 129\n12 159 146\n```\n\nThree elements are needed to construct a KM curve:\n\
    \n+   • A serial time, which is simply the time interval (months, day, years)"
  merge: -1
