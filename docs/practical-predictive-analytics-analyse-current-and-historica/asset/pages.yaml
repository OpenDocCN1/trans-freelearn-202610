  md: '# Description of the data


    Year and Year.1 (columns 1 and 2):Â Year is the year for which the annual enrollment
    figures are taken. You will notice that year appears twice, in column 1 (as a
    factor) and then again in column 2 (integer). This is because the data has been
    previously preprocessed, and appears twice merely for convenience, since there
    are certain instances in which we will prefer to use a factor, and other instances
    in which we prefer to use an integer. The numbers in parentheses in Year refer
    to footnotes in the original data sources. Please refer the the reference notes
    at the CMS website for a full explanation of how the data was collected. While
    you could always create integers from factors and vice versa in the code, this
    saves valuable processing time if certain transformations can be made beforehand.


    Total people (column 3): Total people is the population size of the category.
    They may either enrolled for health coverage (total) or not (Not.Covered).


    Total (column 4): Total is the number of people who were enrolled for health coverage
    for that year and in the cat category.


    Not.Covered (Column 5): The Not.Covered column is the number of people notÂ enrolled
    in the specified year and category.


    Cat (Column 6): Cat is the time series subset. This column, along with Year, defines
    the particular row. It defines the specific demographic data for enrollment for
    that year.


    The ALL AGES category represents the entire population for the specified year.
    All of the other subsets in the file should roll up to this category when totaled
    together.


    For example, the last category (printed as part of tail ()) represents females
    over 65, which is a subset of the ALL AGES category.'
  merge: -1
  img_proc: true
- pgno: 446
  md: '# # Target time series variable


    The variable that we will begin to look at initially will be the variable `Not.Covered`.
    We will be interested in examining any possible enrollment trends using this variable.
    Since the population size will differ depending upon the category, we will calculate
    the percentage of people not covered in a given year by dividing the raw number
    corresponding to this variable by the total in the population for that category.
    This will give us a new variable named `Not.Covered.Pct`. This will also standardize
