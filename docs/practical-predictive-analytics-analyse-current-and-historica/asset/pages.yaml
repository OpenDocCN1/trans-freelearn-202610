    So, in Databricks, you will be able to visually see them run at the same time

    via a progress bar. In cases in which a block of code is dependent upon

    another block of code, you will see the execution begin, but it will be in wait

    state until the needed prior blocks have been completed.


    The takeaway from this is that you should always try to develop your

    analytics code in a manner which utilizes this in order to take advantage of

    parallel processing.


    # Introducing errors into the test data set


    Since both the test and training datasets have been generated by simulated

    random normal distributions, the data is almost too perfect. To compensate

    for this, and to make the data more realistic and help you develop more

    simulation skills, we can introduce some random error into the test data set.

    For example, we might want to add up to a plus/minus 10% variation into the

    test data variables.Â


    To accomplish this, we will first generate an error distribution that we can

    apply to the original data. For simplicity''s sake, we can derive four discrete

    error bins, each designating a different percentage adjustment to the data.

    Percentage errors between -10% and +10% are reasonable limits.


    We will generate this by using the followingÂ rnorm function, and then set

    any value beyond +/- 10 percent to 0. This will become our own customized

    distribution for selecting a probability of error:


    ```

    `#set the random seed

    set.seed(123)

    #set the bins

    x <- rnorm(n=25,mean=0,sd=4) /100

    #assign errors conditionally

    x <- ifelse(abs(x) > .10,0,x)`

    ```


    # Generating a histogram of the distribution'
