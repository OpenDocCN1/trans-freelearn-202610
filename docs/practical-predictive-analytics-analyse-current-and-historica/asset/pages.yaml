- pgno: 439
  md: '# # Time series data


    Time series data is usually a set of ordered data collected over equally spaced
    intervals. Time series data occurs in most business and scientific disciplines,
    and the data is closely tied to the concept of forecasting, which uses previously
    measured data points to predict future data points based upon a specific statistical
    model.


    Time series data differs from the kind of data that we have been looking at previously;
    because it is a set of ordered data points, it can contain components such as
    trend, seasonality, and autocorrelation, which have little meaning in other types
    of analysis, such as "Cross-sectional" analysis, which looks at data collected
    at a static point in time.


    Usually, time series data is collected in equally spaced intervals, such as days,
    weeks, quarters, or years, but that is not always the case. Measurement of events
    such as natural disasters is a prime example. In some cases, you can transform
    uneven data into equally spaced data. In other cases, you can use specialized
    techniques such as Croston''s method for forecasting intermittent or unexpected
    demand for goods and services in certain cases.


    # ## Exploring time series data


    Many time series studies start out by exploring one data metric which has been
    measured across equally spaced time intervals. From a data science perspective,
    we could be interested in identifying various segments of a time series which
    could be exhibiting interesting trends, or cyclical or seasonal patterns. So,
    we always begin time series by looking at the data graphically, and producing
    aggregate measures before proceeding with the modeling.'
  merge: -1
  img_proc: true
- pgno: 440
  md: '# Health insurance coverage dataset


    We will start by reading in a dataset which contains health care enrollment data
    over a period for several categories. This data has been sourced from Table HIB-2,
    Â health insurance coverage status and type of coverage all persons by age and
    sex: 1999 to 2012, and it is available from the CMS website at http://www.census.gov/data/tables/time-series/demo/health-insurance/historical-series/hib.html.


    This table shows the number of people covered by government and private insurance,
    as well as the number of people not covered.


    This table has several embedded time series across all the 14 years represented.
    14 data points would not be considered an extremely long time series; however,
    we will use this data to demonstrate how we can comb through many time series
    at once. Since it is small, it will be easy enough to verify the results via visual
    inspection and printing subsets of the data. As you become familiar with the methodology,
    it will enable you to expand to larger complex datasets with more data points,
    in order to isolate the most significant trends.'
  merge: -1
  img_proc: true
