    # # Interactions


    We have seen that regression is additive, that is,Â the prediction is mostly calculated
    via adding crossproducts of the coefficients and independent single variables
    together. However, often single variables by themselves are not enough to adequately
    predict an outcome in a simple regression model. Often considering how say, predictor
    variable A affects predictor variable B can improve the outcome. This also goes
    a long way in terms of explaining the rationale behind using certain variables.
    The way two or more variables influence each other is referred to as _interaction_,
    and using an interaction in a model can produce an effect which is greater than
    the sum of their individual effects. Usually, two or more interaction variables
    are involved, and the way that one variable effects the dependent variable is
    conditional upon the different levels or ranges of the other variables.


    In this example, we will take our original `Pain` model and determine if there
    is a separate effect for the different treatments by age. Interaction effects
    can be specified in the model by using the : separator (the colon). If we also
    want to include the individual variable effects as well as the interaction we
    would use the *Â separator.


    First we will set up the model as we did before, but specify an `Age:Treatment`
    effect in the model. We will do this because we already know that Age and the
    Type of treatment independently can predict the Pain outcome to some degree, but
    we are interested to see if knowing the Age of the participant together with the
    type of treatment they received will improve the model. If so, we could research
    administrating different treatments to the'
  merge: -1
