    # Hierarchical clustering


    As an alternative to k-means, you can perform hierarchical clustering, which

    does not require you to specify the number of clusters beforehand. In

    hierarchical clustering, you can either start with one cluster and then continue

    to subdivide two clusters at a time, or start with every record being in its own

    cluster, and then merge them together to become a larger cluster. In any case,

    it is easy to scan up and down the tree, known as a dendrogram, and identify

    the grouping of clusters that suit your needs, rather than having to run the

    clustering one at a time. However, for large computational processing,

    partitioning clustering (k-means) definitely has a performance edge, which is

    why it is favored in industry.


    We will use the hclust R function with the Pain dataframe to demonstrate

    hierarchical clustering. After reading in the data, we will scale or normalize

    the data by centering the mean to 0. The reason we do this is that we do not

    want the clustering procedure to favor any variable over another, by nature of

    its size or variance, so we try to equalize the magnitude as best we can.


    First, we will load the pain_raw data we saved earlier into a dataframe

    object:


    ```

    require(graphics)

    setwd("C:/PracticalPredictiveAnalytics/Data")

    load("pain_raw.Rda")


    df2 <- subset(df, select=c(Age,Duration,Pain))

    df2 <- scale(df2)

    head(df2)

    ```'
