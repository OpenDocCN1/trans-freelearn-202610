- pgno: 461
  md: '# # Detecting linear trends


    In a linear trend model, one constructs a linear regression least squares line
    by running an `lm()` regression through the data points. These models are good
    for initially exploring trends visually. We can take advantage of our `lm()` function,
    which is available in base R, in order to specifically calculate the slope of
    the trend line.


    For example, the first 14 rows show the data for the entire population group (ALL
    AGES). We can run a regression on Not.Covered.Pct for each of the years numbered
    1-14 and see that the coefficient for the Year.1 variable is positive, indicating
    that there is a linear increase in the non-coverage percentage as ime advances.
    We can also the coefficient output by itself, by wrapping the lm() function within
    a coef() function.


    After running the regression using the `lm()` function, we can subsequently use
    the `coef` function to specifically extract the slope and the intercept from the
    `lm` model.


    Since this is a regression in which there is only one independent variable (`Time`),
    there will only be one coefficient:


    ```

    lm(Not.Covered.Pct ~ Year.1, data = x2[1:14, ])

    >

    > Call:

    > lm(formula = Not.Covered.Pct ~ Year.1, data = x2[1:14, ])

    >

    > Coefficients:

    > (Intercept)      Year.1

    >  -4.102621    0.002119

    coef(lm(Not.Covered.Pct ~ Year.1, data = x2[1:14, ]))

    > (Intercept)      Year.1

    > -4.102621443  0.002119058

    ```'
  merge: -1
  img_proc: true
- pgno: 462
  md: "# # Automating the regressions\n\nNow that we have seen how we can run a single\
    \ time series regression, we can move on to automating separate regressions and\
    \ extracting the coefficients over all of the categories.\n\nThere are several\
    \ ways to do this. One way is by using the `do()` function within the `dplyr`\
    \ package. Here is the sequence of events:\n\n+   • The data is first grouped\
    \ by category.\n+   • Then, a linear regression (`lm()` function) is run for each\
    \ category, with `Year` as the independent variable, and `Not.Covered` as the\
    \ dependent variable. This is all wrapped within a `do()` function.\n+   • The\
    \ coefficient is extracted from the model. The coefficient will act as a proxy\
    \ for the direction and magnitude of the trend.\n+   • Finally, a dataframe of\
    \ lists is created (`fitted.models`), where the coefficients and intercepts are\
    \ stored for each regression run on every category. The categories that have the\
    \ highest positive coefficients exhibit the greatest increasing linear trend,\
    \ while the declining trend is indicated by negative coefficients:\n\n```\nlibrary(dplyr)\n\
    fitted_models = x2 %>%\n  group_by(cat) %>%\n  do(model = coef(lm(Not.Covered.Pct\
    \ ~ Year.1, data = .)))\n```\n\nAll of the generated models are now in the `fitted_models`\
    \ object.\n\nThe `kable` function from `knitr` gives a simple output which displays\
    \ the intercept as the first number and the coefficient in the model column. As\
    \ a check, we can see that the coefficients in the ALL AGES model are identical\
    \ to those derived in the previous section:\n\n```\nlibrary(knitr)\nkable(fitted_models)\n\
    ```"
  merge: -1
  img_proc: true
