    # Filtering a large number of rules


    Once we have the rules built, we can use special subsetting functions to filter
    items from itemsets on either the left (lhs) or right (rhs) side of the association
    rule. This is valuable if you are looking for particular items within the itemsets.


    Use the %in% operator to perform an exact match, or %pin% to perform a partial
    match:


