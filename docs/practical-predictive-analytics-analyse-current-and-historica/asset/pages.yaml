- pgno: 475
  md: '# Smoothing the data using moving averages


    One simple technique used to analyze time series involves simple and exponential
    moving averages. Both simple moving average and exponential moving average are
    ways in which we can smooth out the random noise in the series and observe cycles
    and trends.'
  merge: -1
  img_proc: true
- pgno: 476
  md: '# # Simple moving average


    A simple moving average will simply take the sum of the time series variable for
    the last k periods and then will divide it by the number of periods. In this sense,
    it is identical to the calculation for the mean. However, what makes it different
    from a simple mean is the following:


    +   * The average will shift for every additional time period. Moving averages
    are backward-looking, and every time a time period shifts, so will the average.
    That is why they are called moving. Moving averages are sometimes called rolling
    averages.

    +   * The look backwards period can shift. That is the second characteristic of
    a moving average. A 10-period moving average will take the average of the last
    10 data elements, while a 20-period moving average will take the sum of the last
    20 data points, and then divide by 20.


    # ## Computing the SMA using a function


    To compute a rolling five-period moving average for our data, we will use the
    simple moving average (SMA) function from the TTR package, and then display the
    first few rows:


    ```

    #install.packages("TTR")

    library(TTR)

    MA <- SMA(x, n = 5)

    cbind(head(x, 14), head(MA, 14) )

    >           [,1]         [,2]

    > [1,] 0.1541247         NA

    > [2,] 0.1574131         NA

    > [3,] 0.1629424         NA

    > [4,] 0.1609860         NA

    > [5,] 0.1485338 0.1568000

    > [6,] 0.1474000 0.1554551

    > [7,] 0.1523271 0.1544379

    > [8,] 0.1464598 0.1511414

    > [9,] 0.1433967 0.1476235

    > [10,] 0.1455136 0.1470194

    ```'
