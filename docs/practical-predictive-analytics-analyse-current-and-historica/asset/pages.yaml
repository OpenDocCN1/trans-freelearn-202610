    We previously demonstrated some text mining examples using a package called `RTextTools`.
    Another popular text mining package is `tm`. The `tm` package has been around
    for a long time, and it will be useful to know how this package works. Tm requires
    that all text data be converted to a corpus first. That can be done using the
    `VCorpus()` function. We can use vector input, since we already have the data
    available in an existing data frame, and there is no need to read in additional
    external data:


    ```

    library(tm)

