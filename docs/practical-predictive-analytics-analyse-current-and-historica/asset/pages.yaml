  md: '# Step 3 data preparation


    As was mentioned in Chapter 1, Getting Started with Predictive Analysis, one purpose
    of data preparation is preparing an input data modeling file, which can go directly
    into an algorithm. In theory, the input file will encompass all of the knowledge
    gained in steps 1 and 2. Ideally, this file will consist of a target variable,
    all meaningful predictor variables and other identification variables to aid in
    the modeling process, and any additional variables which would have been created
    based on the raw data sources. Data preparation, such as the previous steps outlined
    is an iterative process. Here are some typical steps you might follow when preparing
    the data:


    +   Identifying the data sources: These are the critical data inputs that you
    will need to read in and manipulate. They can be sourced from various data formats
    such as CSV files, databases, or XML or JSON files. They can be in structured
    format or unstructured format.


    +   Identify the expected input: Read in some test samples and closely examine
    the input to see if it is what you expect. More often than not, there will be
    some formatting problems that can be easily fixed, and you will probably want
    to rename variables and change some data types from character to numeric and vice
    versa.


    +   Perform further data quality and reasonability checks: After you have performed
    your own internal checks, cross-reference the data you observe with existing metadata
    information (such as data dictionaries, if available), domain experts, and other
    data artifacts which already exist to see if what you are reading is what you
    expected. Sometimes you will need to join the data with other lookup or reference
    tables in order to obtain what you are really looking for.


    +   Expanding the number of input records: After reading in and getting a test
    sample, you will probably want to read in a much larger sample of records and
    variables beyond what you read in the initial stage. Determining how much data
    to read in at this stage is a decision you will need to make. If you read in all
    of the variables, you may encounter memory problems later on, and if you read
    in just what you need, that'
  merge: -1
  img_proc: true
- pgno: 86
  md: 'may force you to go back later on and incorporate additional data or variables.
    Try to get a good representative sample of data at the beginning. Later on, it
    may make sense to rewrite your code to read in only a subset of the variables
    that you really need.


    +   **Perform some basic data cleaning**: Although cleaning the data is an important
    part of the modeling process, it is important not to over clean. An example of
    over cleaning would be attempting to fix every missing value via imputation. Models
    can co-exist with a reasonable amount of bad data and will perform better in the
    long run if some variation is included.


    +   **Try some aggregation**: Aggregate some of the data by some basic categories
    and observe the results. Consider whether using aggregated data instead of individual
    data will help speed model development while achieve models results than are similar
    to those achieved from using the individual observations.


    +   **Create new variables or transformations**: This is where binning and standardizing
    variables come into play.


    +   **Identify key variables**: Even though modeling has begun, you should be
    able to preliminarily identify which variables are important using a combination
    of bivariate analysis, SQL, correlations and other exploratory tools. It is not
    critical to identify the most important variables, but only the ones that may
    have some predictive power, or are already known to be relevant.


    +   Join any of the input files you have examined into one single analytics file.
    Now you are ready for the modeling phase.'
  merge: -1
  img_proc: true
- pgno: 87
  md: '# # Step 4 modeling


    In the modeling stage, you will pick an appropriate predictive modeling technique
    that fits your problem and apply it to your data. There are several factors which
    influence the selection of a model:


    +   1. Who will use the model?

    +   2. How will the model be used?

    +   3. What are the assumptions of the model?

    +   4. How much data do I have?

    +   5. How many variables do I need to use?

    +   6. What is the accuracy level needed by the model?

    +   7. Am I willing to trade some accuracy for interpretability?


    Particularly related to the last point is the concept of **bias** and **variance**.


    Bias is related to the ability of a model to approximate the data. Low bias algorithms
    are able to fit the data with little error. While this may seem to an advantage
    all of the time, it can result in a complex model which is unstable, and difficult
    to explain. On the other hand, a high bias model is relatively simple to explain
    (like linear regression), but may sacrifice some accuracy for explanability, and
    stability. You will usually start by looking at your data and matching it up with
    a choice of potential algorithms.Â A linear regression, for example, which tries
    to fit data which forms a U-shaped distribution would not be an appropriate algorithmic
    choice for that problem, regardless of the number of parameters selected or how
    the coefficients were adjusted. For example, 5-star ranking reviews are often
    skewed toward very high or very low ratings and linear regression would not be
    an appropriate choice.


    Here is an example showing how linear regression would be a ppor choice:


    ```

    set.seed(1010)

    x <- sample(c(1,2,3,4,5),100,replace=TRUE,prob=(c(.25,.05,.05,.3,

    y <- data.frame(rating=x,custid=seq(1:100))

    hist(y$rating, prob=TRUE, main="Customer Ratings")

    lines(density(y$rating))

    ```'
  merge: -1
  img_proc: true
- pgno: 88
  md: 'It would be a much better fit if a regression problem involved sales prediction
    from inventory. Low bias models tend to result in over fitting and high bias models
    have lower accuracy but are simpler to explain.


    Variance is related to how a model would change when supplied with different data.
    Low variance is also desirable.


    Decision trees are an example of an algorithm, which tends to have low bias (over
    fits) but can come up with completely different results when given a new training
    sample (high variance). Even adding one additional observation to an existing
    decision tree model can result in a totally different tree.


    To develop a good predictive model, you acknowledge that there ultimately will
    be a compromise or tradeoff between bias and variance. To learn more about the
    bias-variance trade-off, check out some of the external references in *Wikipedia*.


    # Description of specific models


    Here are some short descriptions of some of the models that we will be covering,
    with some short code examples.


    # **Poisson (counts)**


    A Poisson model is used to model counts of things. That could be the number of
    insurance claims filed in a given month, the number of calls which are received
    in a call center in a given minute, or the number of orders which are sold for
    a particular item. The Poisson distribution is the appropriate way for modeling
    count data since all data is positive and the range of the distribution is bound
    by 0 and infinity. The classic way of modeling a Poisson model is through the
    R `glm()` function using a `poisson` link function:


    ```

    model.poisson <- glm(count ~ v1+v2+v3, data=inputdata, family=poi

    ```


    Note that the preceding model specified merely shows the model in a generalized
    form. Do not try to run it since there are no variables other than the existing
    ones `v1`, `v2`, `v3` or `count`. However, what the model specification'
  merge: -1
  img_proc: true
- pgno: 89
