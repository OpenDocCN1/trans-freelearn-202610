- pgno: 234
  md: '# Decision tree algorithms


    Decision trees are considered a good predictive model to start with, and have
    many advantages. Interpretability, variable selection, variable interaction, and
    the flexibility to choose the level of complexity for a decision tree all come
    into play.


    Decision trees methods are considered classification methods, so the typical use
    case for a decision tree is predicting a class or category. However, there are
    also certain types of decision trees, which are known as regression trees, where
    the output is a continuous variable. In this way, we can begin development models
    that are a mix of numeric and categorical variables.


    Decision trees are heavily used in marketing and advertising, and in any industry
    where there is a need to segment customers into different groups. They are also
    used in healthcare for disease and risk classification.


    # Advantages of decision trees


    Decision trees have many advantages. They can be easily understood by both technical
    and business people and can be presented in an extremely simplified or detailed
    way.


    They can be specifically tailored to the type of audience, depending upon the
    inclusion/exclusion of domain-specific variables and the level of complexity.
    They are most useful when there are a small to medium number of variables that
    are generally understood, and the goal is to learn about the interactions between
    them. Decision trees are also good vehicles for storytelling since the natural
    presentation of a tree, and its splitting mechanism, corresponds well with business
    rule decision making and each specific node can be examined and questioned if
    need be.


    Decision trees can handle both categorical and number variables, and deal with
    missing values. There is no need to discard or impute them.'
  merge: -1
  img_proc: true
- pgno: 235
  md: '# Disadvantages of decision trees


    Most decision trees utilize what are known as greedy algorithms. There are many
    definitions of what greedy means, but I like the one that suggests that it always
    makes the optimal choice based upon whatever information happens to be available
    at that moment. There is no hindsight that is used when building trees. Slight
    changes in data can alter results, and if you run the algorithm on a subsequent
    sample, the results may not replicate in exactly the same way. It is also difficult
    to force the tree to split the way you want it to when running in an automated
    fashion. If you want to control splits exactly, you may be better off using interactive
    decision trees in which you are able to split a node by pointing and clicking.Â
    Unfortunately there are not a lot of open source options for this.


    Additionally, there is a built-in bias in decision tree algorithms in that they
    favor variables with a large number of categories. This enables the algorithm
    to be able to split over a large category, even when the result would not make
    any sense (we will see this in an example). Large trees can produce invalid or
    silly results, especially when the size of the tree is very large. Over-fitting
    is common, but there is a technique known as pruning which can be used to reduce
    this. Random forest trees can help with these disadvantages somewhat, since not
    all variables are included in every tree, and it uses consensus building to generate
    a result.


    Despite these disadvantages of decision trees, I advocate their use as more of
    an exploratory tool (unsupervised learning), and you will find that they are very
    good at uncovering many important relationships that exist in your data when the
    analysis is performed in an organized and methodical method. It is also a good
    way to validate results obtained from other types of models. If you find that
    other models obtain much better results that you cannot replicate visually in
    a decision tree model, chances are good that the results from the more complex
    model will not replicate in the future.


    # Basic decision tree concepts


    Decision trees algorithm are analogous to the game of 20 questions, or'
  merge: -1
  img_proc: true
- pgno: 236
  md: 'animal, vegetable, mineral. A basic decision tree algorithm will start at the
    root of the tree, representing all of the data, and continue to break each category
    into two separate categories that are based upon optimal methods, to be able to
    guess the best characteristics to identify each of the two categories. This is
    known as **splitting a node**. Then the algorithm will continue to split the data
    until it either cannot split any more, or stops in other ways based upon the control
    parameters.


    For example, if we want to classify gender based upon the presence of osteoporosis,
    ischemic heart disease, and the average number of prescriptions, we could develop
    a tree that looked something like this:


    ![](img/672c0cf8ba3c000a6529b117ed96945e_236_0.png)


    Notice that the first question is âDoes the patient have Osteoporosis?â. Then
    based upon the answer, another series of question are asked which will ultimately
    place a patient into a final node of the tree, in which no more questions can
    be asked which will improve the results.


    # ## Growing the tree


    Our original node always starts at the root of the tree. In the preceding diagram,
    the first node merely starts with a description of how the population'
  merge: -1
  img_proc: true
- pgno: 237
  md: 'breaks down by gender. In this case, females make up the majority class at
    58% of the population. The goal in decision of tree algorithms is to always grow
    a tree and improve predictions. So, at this point, we want to do better than 58%
    prediction for gender.


    As we grow the tree, two questions will always need to be taken into consideration:


    +   - Which variable will best improve the prediction for each of the classes
    of the target variable at that point?

    +   - For that variable, what is the best split point that will segment a categorical
    variable into two parts, or divide a continuous variable into two parts, and will
    improve the prediction for that class?


    The outcome of this decision will be a new tree node, or leaf. In a classical
    decision tree, there are typically two paths (yes or no, high or low) that are
    followed, but there can be more than two paths depending upon the algorithm.


    In our preceding example, the algorithm will first run through all of the variables
    and determine which one will improve the prediction. That variable happens to
    be the presence of osteoporosis. If osteoporosis is present, one could predict
    that the patient is female with 74% accuracy. However, when osteoporosis is not
    present, the probability of being female actually decreases to 51%, which is slightly
    worse than the original 58% representation of females in the study.


    But wait. The partitioning algorithm will continue to try to split the data again.
    This time it looks at the average prescriptions variable as a way to improve the
    prediction. The average number of prescriptions per year per beneficiary for this
    analysis runs from about 15 per year to about 200. The algorithm will try all
    values in this range to split the data into two parts. For example, it might try
    to first compare patients with 10 or more prescriptions, with those with 9 or
    less prescriptions. It will then look at the prediction for that cutoff. Then
    it will continue to change to cutoff value until it finds the cutoff value which
    optimizes the separation between the two classes.


    In this instance, it has found that 51 prescriptions is the cutoff that optimizes'
  merge: -1
  img_proc: true
- pgno: 238
  md: 'the split for those patients without osteoporosis. When the number of prescriptions
    is greater than 50, there is a 64% probabiliti that the patient is male.


    # Impurity


    One a node is split according to the best criteria, the resulting nodes are examined
    for impurity. Impurity measures the separation of the classes, based upon what
    the expected frequencies should be at that point. The most impure case is when
    a node is split 50/50 for a binary class. This essentially designates a random
    class assignment. The least impure case is when a decision rule places all the
    observations completely in one class, and 0 observations are placed in the other
    class. This is the more desirable case, since it allows us to make a perfectÂ
    prediction for that node.


    Once an impurity measure is calculated, the algorithm will compute an information
    gain measure, which calculates how much the impurity decreases by splitting each
    of the variables, and proceeds to calculate all possible split points for a continuous
    variable.


    # Controlling the growth of the tree


    One characteristic of the cart (implemented as rpart in R) is that it will try
    all possible variables and split points until it finds the best one to use. Depending
    upon how the algorithm is configured, it can be, the one that achieves the highest
    information gain. However, in a real-world setting, very few trees are grown with
    unlimited boundaries. Trees are grown with constraints. Examples of constraints
    would be specifying the maximum number of branches that can be grown, or the minimum
    number of observations contained within a leaf. As a result, the predictive modeler
    can construct a tree to be as simple or as complex as needed.


    # Types of decision tree algorithms


    In R, two types of decision tree algorithms are illustrated. We will first look'
  merge: -1
  img_proc: true
