- pgno: 52
  md: '# Chapter 2. The Modeling Process


    > Remember that all models are wrong; the practical question is how wrong do they
    have to be to not be useful.

    > -George Edward Pelham Box


    Today, we are at a juncture in which many different types of skill sets are needed
    to participate in predictive analytics projects. Once, this was the pure domain
    of statisticians, programmers, and business analysts. Now, the roles have expanded
    to include visualization experts, data storage experts, and other types of specialists.
    Yet, so many are unfamiliar with an understanding of how predictive analytics
    projects can be structured. This lack of structure can be inhibited by several
    factors. Often there is a lack of understanding of the critical parts of a business
    problem, and a model is developed much too early. Alternatively, a formal methodology
    may be put off to the future, in favor of a quick solution.


    In this chapter, we will start by discussing the advantages of using structured
    analytics methodologies. Methodologies are a great way to demonstrate a value
    to the upper management, and groups or individuals advocating for a structured
    approach is one way to obtain buy-in from the management. If the project gains
    acceptance using a methodology, there is a strong possibility that future projects
    will have support.


    We will cover the following points in this chapter:


    +   - Advantages of a structuredÂ approach

    +   - Analytic process methodologies

    +   - An outline of the specific steps used within an analytics process methodology

    +   - Short descriptions of specific analytic techniques, with code examples'
  merge: -1
  img_proc: true
- pgno: 53
  md: '# # Advantages of a structured approach


    Analytic projects have many components. That is where a structured methodology
    can help. Many benefits can be gained if there is a structure which is placed
    upon discovery and analysis, rather than only on pure model building. The discovery
    and insight gained will certainly be utilized past the original intent of the
    problem.


    > > We assume that the quick-thinking "hare brain" will beat out the slower Intuition
    of the "tortoise mind." However, now research in cognitive science is changing
    this understanding of the human mind. It suggests that patience and confusion--rather
    than rigor and certainty--are the essential precursors of wisdom. Â Â Â Â Â Â
    Â Â Â Â Â Â Â Â Â Â Â Â Â Â Â Â Â Â Â Â Â Â Â Â Â Â Â Â Â Â Â Â Â Â Â Â Â Â Â
    Â Â Â Â Â Â Â Â Â Â Â Â Â Â Â Â Â Â Â Â Â Â Â Â Â Â Â Â Â Â Â Â Â Â Â Â Â Â Â
    Â Â Â Â Â Â Â Â Â Â Â Â Â Â Â Â Â Â Â Â Â Â Â Â Â Â Â Â Â Â -Guy Claxton


    # ## Ways in which structured methodologies can help


    Here are several points to bear in mind concerning the advantages of structured
    methodologies:


    +   • Data is coming at us fast and furious. We need to keep track of the many
    data sources, evaluate which ones are the best ones to use at any given time and
    continually monitor them for data accuracy. Expect changes to come quicker than
    expected. Predictive modelers need a structured methodology to be able to keep
    track of things; changes can be disruptive at whatever stage of the modeling process
    they are in.

    +   • The difference between useful data and data masquerading as useful data
    is increasing. Structured methodologies help with maintaining metadata repositories
    for information, which can help in determining what data is useful and what is
    not.

    +   • The number of data analysis techniques are increasing. Knowing which analytical
    techniques to choose can be a daunting task. Dedicating'
  merge: -1
  img_proc: true
- pgno: 54
  md: "projects purely for evaluating which data techniques are more useful than others\
    \ for a particular business problem is a laudable goal.\n\n+   • Structured methodologies\
    \ help with objectivity. Everyone has their own subjective technical biases that\
    \ they bring to the table. Creating a structured way for sharing code and results\
    \ can encourage out-of-the-box thinking.\n+   \n+   • Incremental Improvement:\
    \ Often projects are too large or ambitious. Projects can be organized in a way\
    \ which offers small ways to provide value. This is easier to attain when projects\
    \ are encapsulated within a structured methodology.\n+   \n+   • Iterative analytics\
    \ development uses structured techniques that enforce good data analytics practice\
    \ such as being able to iterate in small steps. If any discrepancies are found\
    \ later on, it is relatively easy to backtrack through the incremental updates.\n\
    +   \n+   • Divide and conquer helps to organize projects involving multiple team\
    \ members who work on different parts of project\n+   \n+   • Reproducibility\
    \ helps analytic teams reproduce the same results again and again. This has always\
    \ been important in research, but also has implications for any large-scale data\
    \ project, in which you can be dealing with a multitude of data raw sources. Often,\
    \ one needs help with understanding transformed data sources in which business\
    \ rule transformations are unclear and can be changed without your knowledge.\
    \ Certainly, this is also important when implementing version control, but this\
    \ is also important when you are upgrading packages and need to recreate results.\
    \ When data sampling is involved, it might also be possible that the original\
    \ selection criteria which produced the sample is no longer available, and that\
    \ reproducibility may be lost. Therefore, it is important to develop sample strategies\
    \ in a structured way, which are robust and can be reproduced with future analyses."
