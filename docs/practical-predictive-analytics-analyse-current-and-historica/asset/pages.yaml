    |---|---|---|---|

    | 1 | 29 | M | $40,000 |

    | 2 | 45 | M | $36,000 |

    | 3 | 81 | M | --missing-- |

    | 4 | 22 | --missing-- | $16,000 |

    | 5 | 41 | M | $98,000 |

    | 6 | 33 | F | $60,000 |

    | 7 | 22 | F | $24,000 |

    | 8 | --missing-- | F | $81,000 |

    | 9 | 33 | F | $55,000 |

    | 10 | 45 | F | $80,000 |


    However, the downside effect of listwise deletion is that you may end up deleting
    some non-missing variables that could have an important effect on the model. However,
    since the missing data is presumed random, removing some rows would not have a
    major effect, assuming your assumptions are correct.


    Another consideration is the amount of data you have to work with. You do not
    want to end up deleting most of your data if there is one missing value that would
    cause you to throw out all of your data! If you will be going down this route,
    see if you can eliminate this variable from consideration and start with a list
    of variables that are reasonably complete.


    For example, if you had zip code information on most of the records, but the state
    variable was only 50% populated, you wouldn''t want to include both zipcode and
    state together in an algorithm that performed listwise deletion (such as regression)
    since that would eliminate 50% at least of your data. So, the first line of attack
    would be to see if the variables were even needed in the first place (possible
    through a variable importance measure), or if there was an alternative variable
    that could serve as a substitute that was better populated. Principal component
    analysis or basic pairwise correlation can help you identify this situation.


    # Imputation methods'
  merge: -1
  img_proc: true
- pgno: 158
  md: 'Imputating a missing value means substituting the missing value for another
    value that is reasonable. What is reasonable can range from substituting the missing
    value for the mean, median, or mode of a variable to regression techniques, to
    more advanced techniques involving Monte Carlo simulation.


    # Imputing missing values using the ''mice'' package


    In this example we will use the `mice` package to impute some missing values for
    the `age` variable in the `all.df` dataframe. The value of the `age` variable
    will be imputed by two other existing variables: `gender` and `education`.


    To begin, install and load the `mice` package:


    ```

    install.packages("mice")

    library(mice)

    ```


    We will now run the `md.pattern()` function, which will show you the distribution
    of the missing values over the other columns in the dataframe. The `md.pattern()`
    function Â output is useful for suggesting which variables might be good candidates
    to use for imputing the missing values:


    ```

    md.pattern(all.df)

    ```


    The output from `md.pattern()` function Â is shown later. Each row shows a count
    of observation along with a 1 or 0 flag, which indicates if the count contains
    completely populated values or not:


    +   - The first row indicates that there are 1,920 observations where **Gender**,
    **Education**, and **Age** are not missing

    +   - The second row shows the remaining **80** observations also have populated
    values for **Gender**, and **Education**, but not for **Age**


    It is important to examine theÂ `md.pattern()` function to see if there are enough
    non-missing values in other variables to be able to impute missing values:'
