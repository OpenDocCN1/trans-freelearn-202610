  md: '# # Chapter 7. Using Market Basket Analysis as a Recommender Engine


    > > "It''s not wise to violate the rules until you know how to observe them."


    - T.S. Eliot


    In this chapter, we will cover the following topics:


    +   - Market basket analysis using the arules package

    +   - Data transformation and cleaning techniques using semi-structured market
    basket transaction data

    +   - Learn how to transform transaction objects into dataframes

