  md: '# Chapter 1. Getting Started with Predictive Analytics


    > "In God we trust, all others must bring Data"

    > - Deming


    I enjoy working and explaining predictive analytics to people because it is based
    upon a simple concept: predicting the probability of future events based upon
    historical data. Its history may date back to at least 650 BC. Some early examples
    include the Babylonians, who tried to predict short-term weather changes based
    on cloud appearances and halos: Weather Forecasting through the Ages, NASA.


    Medicine also has a long history of needing to classify diseases. The Babylonian
    king Adad-apla-iddina decreed that medical records be collected to form the Diagnostic
    Handbook. Some predictions in this corpus list treatments based on the number
    of days the patient had been sick, and their pulse rate (Linda Miner et al., 2014).
    One of the first instances of bioinformatics!


    In later times, specialized predictive analytics was developed at the onset of
    the insurance underwriting industries. This was used as a way to predict the risk
    associated with insuring marine vessels (https://www.lloyds.com/lloyds/about-us/history/corporate-history).
    At about the same time, life insurance companies began predicting the age that
    a person would live to in order to set the most appropriate premium rates.


    Although the idea of prediction always seemed to be rooted early in the human
    need to understand and classify, it was not until the 20th century, and the advent
    of modern computing, that it really took hold.


    In addition to helping the US government in the 1940s break code, Alan Turing
    also worked on the initial computer chess algorithms that pitted man against machine.
    Monte Carlo simulation methods originated as part of the'
  merge: -1
  img_proc: true
- pgno: 8
  md: 'Manhattan project, where mainframe computers crunched numbers for days in order
    to determine the probability of nuclear attacks (Computing and the Manhattan Project,
    n.d).


    In the 1950s, **Operations Research (OR)** theory developed, in which one could
    optimize the shortest distance between two points. To this day, these techniques
    are used in logistics by companies such as UPS and Amazon.


    Non-mathematicians have also gotten in on the act. In the 1970s, cardiologist
    Lee Goldman (who worked aboard a submarine) spend years developing a decision
    tree that did this efficiently. This helped the staff determine whether or not
    the submarine needed to resurface in order to help the chest pain sufferers (Gladwell,
    2005)!


    What many of these examples had in common was that people first made observations
    about events which had already occurred, and then used this information to generalize
    and then make decisions about might occur in the future. Along with prediction,
    came further understanding of cause and effect and how the various parts of the
    problem were interrelated. Discovery and insight came about through methodology
    and adhering to the scientific method.


    Most importantly, they came about in order to find solutions to important, and
    often practical, problems of the times. That is what made them unique.'
  merge: -1
  img_proc: true
- pgno: 9
  md: '# Predictive analytics are in so many industries


    We have come a long way since then, and practical analytics solutions have furthered
    growth in so many different industries. The internet has had a profound effect
    on this; it has enabled every click to be stored and analyzed. More data is being
    collected and stored, some with very little effort, than ever before. That in
    itself has enabled more industries to enter predictive analytics.


    # Predictive Analytics in marketing


    One industry that has embraced PA for quite a long time is marketing. Marketing
    has always been concerned with customer acquisition and retention, and has developed
    predictive models involving various promotional offers and customer touch points,
    all geared to keeping customers and acquiring new ones. This is very pronounced
    in certain segments of marking, such as wireless and online shopping cards, in
    which customers are always searching for the best deal.


    Specifically, advanced analytics can help answer questions such as,Â If I offer
    a customer 10% off with free shipping, will that yield more revenue than 15% off
    with no free shipping?Â The 360-degree view of the customer has expanded the number
    of ways one can engage with the customer, therefore enabling marketing mix and
    attribution modeling to become increasingly important. Location-based devices
    have enabled marketing predictive applications to incorporate real-time data to
    issue recommendation to the customer while in the store.


    # Predictive Analytics in healthcare


    Predictive analytics in healthcare has its roots in clinical trials, which use
    carefully selected samples to test the efficacy of drugs and treatments.'
  merge: -1
  img_proc: true
- pgno: 10
  md: 'However, healthcare has been going beyond this. With the advent of sensors,
    data can be incorporated into predictive analytics to monitor patients with critical
    illness, and to send alerts to the patient when he is at risk. Healthcare companies
    can now predict which individual patients will comply with courses of treatment
    advocated by health providers. This will send early warning signs to all parties,
    which will prevent future complications, as well as lower the total cost of treatment.


    # Predictive Analytics in other industries


    Other examples can be found in just about every other industry. Here are just
    a few:


    +   • Finance:

    +       • Fraud detection is a huge area. Financial institutions are able to monitor
    client''s internal and external transactions for fraud, through pattern recognition
    and other machine learning algorithms, and then alert a customer concerning suspicious
    activity. Analytics are often performed in real time. This is a big advantage,
    as criminals can be very sophisticated and be one step ahead of the previous analysis.

    +       • Wall street program trading. Trading algorithms will predict intraday
    highs and lows, and will decide when to buy and sell securities.

    +   • Sports management:

    +       • Sports management analytics is able to predict which sports events will
    yield the greatest attendance and institute variable ticket pricing based upon
    audience interest.

    +       • In baseball, a pitcher''s entire game can be recorded and then digitally
    analyzed. Sensors can also be attached to their arm, to alert when future injury
    might occur.

    +   • Higher education:

    +       • Colleges can predict how many, and which kind of, students are likely
    to attend the next semester, and be able to plan resources accordingly. This is
    a challenge which is beginning to surface now, many schools may be looking at
    how scoring changes made to the SAT in 2016 are affecting admissions.

    +       • Time-based assessments of online modules can enable professors to'
  merge: -1
  img_proc: true
- pgno: 11
  md: 'identify students'' potential problems areas, and tailor individual instruction.


    +   - Government:

    +     - Federal and State Governments have embraced the open data concept and
    have made more data available to the public, which has empowered Citizen Data
    Scientists to help solve critical social and governmental problems.

    +     - The potential use of data for the purpose of emergency services, traffic
    safety, and healthcare use is overwhelmingly positive.


    Although these industries can be quite different, the goals of predictive analytics
    are typically implemented to increase revenue, decrease costs, or alter outcomes
    for the better.'
  merge: -1
  img_proc: true
