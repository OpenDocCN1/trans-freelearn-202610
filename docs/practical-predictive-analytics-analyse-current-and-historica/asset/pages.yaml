  md: "# # Missing values\n\nMissing values denote the absence of a value for a variable.\
    \ Since data can never be collected in a perfect manner, many missing values can\
    \ appear due to human oversight, or can be introduced via any systematic process\
    \ that touches a data element. It can be due to a survey respondent not completing\
    \ a question, or, as we have seen, it can be created from joining a membership\
    \ file with a transaction file. In this case, if a member did not have a purchase\
    \ in a particular year, it might end up as NA or missing.\n\nThe first course\
    \ of action for handling missing values is to understand why they are occurring.\
    \ In the course of plotting missing values, you not only want to produce counts\
    \ of missing values, but you want to determine which sub-segments may be responsible\
    \ for the missing values.\n\nTo research this, attempt to break out your initial\
    \ analysis by time periods and other attributes using some of the bivariate analysis\
    \ techniques that have been mentioned. This will help you to identify where missing\
    \ values may be tucked away.\n\n# ## Setting up the missing values test dataset\n\
    \nWe will start off by using two groups of generated data. One group is for males,\
    \ who have a 3% probability of not responding to an age question in a survey,\
    \ and the other group is for females, who have a 5% probability of not responding\
    \ to an age question:\n\n```\n```r\nlibrary(wakefield)\nlibrary(dplyr)\n\n#generate\
    \ some data for Males with a 5% missing value for age\n\nset.seed(10)\nf.df <-\
    \ r_data_frame(\n n = 1000,\n age,\n```\n```"
  merge: -1
  img_proc: true
