- pgno: 465
  md: '# # Ranking the coefficients


    Now that we have the coefficients, we can begin to rank each of the categories
    by increasing trend. Since the results we have obtained so far are contained in
    embedded lists, which are a bit difficult to work with, we can perform some code
    manipulation to transform them into a regular data frame, with one row per category,
    consisting of the category name, coefficient, and coefficient rank:


    ```

    ```r

    library(dplyr)

    # extract the coefficients part from the model list, and then tra

    # data frame so that the coefficient appear one per row, rather t

    # column.


    xx <- as.data.frame(fitted_models$model)

    xx2 <- as.data.frame(t(xx[2, ]))


    # The output does not contain the category name, so we will merge

    # from the original data frame.


    xx4 <- cbind(xx2, as.data.frame(fitted_models))[, c(1, 2)] #only


    # rank the coefficients from lowest to highest. Force the format

    # as length 2, with leading zero''s


    tmp <- sprintf("%02d", rank(xx4[, 1]))


    # Finally prepend the rank to the actual category

    xx4$rankcat <- as.factor(paste(tmp, "-", as.character(xx4$cat)))


    # name the columns

    names(xx4) <- c("lm.coef", "cat", "coef.rank")

    # and View the results

    View(xx4)

    ```

    ```


    As you can see, columns 2, 3, and 4 now contain a neatly arranged representation
    of the `coefficients`, `category`, and `coef.rank`, which was derived by ranking
    `lm.coef` from smallest to largest, and then pretending the rank order to the
    category:'
  merge: -1
  img_proc: true
