  md: '# # Exploring the hospital dataset


    Exploratory data analysis is a preliminary step prior to data modeling in which
    you look at all of the characteristics of data in order t0 get a sense of data
    distribution, correlation, missing values, outliers, and any other factors that
    might impact future analyses. It is a very important step, and if performed diligently,
    will save you a lot of time later on.


    For the following examples, we will read the NYC hospital discharges dataset (hospital
    inpatient discharges (SPARCS De-Identified): 2012, n.d.). This example uses the
    `read.csv` function to input the delimited file, and then uses the `View` function
