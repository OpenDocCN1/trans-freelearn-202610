  md: '# Running an alternative model in Python


    In this example, we ran a decision tree in R by extracting a sample from the Spark
    dataframe and running the tree model using base R. While that is perfectly acceptable
    (since it forced you to think about sampling), in many instances it would be more
    efficient to run the models directly on the Spark dataframe using a `MLlib` package
    or equivalent.


    For the version of Spark, you should be working with (2.1); decision tree algorithms
    are not available to be run under R. Fortunately, native Spark decision trees
    are already implemented in Python and Scala. We will illustrate the example using
    Python so that you can see that there are options available. If you will be following
    algorithm development in Spark you will find that often algorithms are written
    first in Scala, since that is the native Spark language.


    # Running a Python Decision Tree


    Here are some notes on the Python decision tree code which appears below.


    For the first code chunk, notice the "magic" directive in the first line of the
    code. Â The magic directive begins with ''%'' and specifies which language or
    API you will be using. Therefore, since we will be using Python instead or R,
    we need to specify `%python` as the first line. That is because the notebook was
    originally set up as an R notebook. When mixing languages, you need to specify
    the language used as the first line, unless you are writing in the default notebook
    language.


    For those of you who are not familiar with Python, the import directives at the
    top of the code import the needed libraries and modules, which are to be used
    by Python, similar to how the library function is used in R. If you do not supply
    import directives, you will usually get errors.'
  merge: -1
  img_proc: true
