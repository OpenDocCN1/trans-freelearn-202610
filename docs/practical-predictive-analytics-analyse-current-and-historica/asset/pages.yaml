  md: 'This is a simple example of how you can perform "feature engineering".


    ```

    tmp <- train_data

    tmp$eye_hair_build <- paste(train_data$eyecolor,train_data$hairco

    tmp$weapon <- paste(train_data$knifcuti,train_data$riflshot,train

    model <- OneR(tmp, frisked ~ ., verbose = TRUE)

    ```


