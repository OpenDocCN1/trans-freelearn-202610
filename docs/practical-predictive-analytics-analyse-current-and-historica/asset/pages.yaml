    +   same no matter how many times you run the code

    +   - The `r_sample_replace()` function will generate a unique member ID

    +   with a value from 1 to 1000

    +   - The `income`, `children`, `employment`, `level`, `grad`, `year`, `state`,
    and

    +   `zip_code` variables are all randomly generated without supplying any

    +   specialized parameters'
