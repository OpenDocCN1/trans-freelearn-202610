    younger/older age group?


    We will do that by automatically calculating a cut point. To determine the cut
    point, we will use the cut function on the Age variable so separate it into two
    levels. Then we will use dplyr to compute mean values for the five variables,
    depending upon how the age group was cut.


    +   1. First, let''s see how many observations fall into each of the four groups:


