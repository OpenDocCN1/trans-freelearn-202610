- pgno: 92
  md: 'Decision trees are popular since they can roughly be equated with

    If/Then/Else rules used in some business contexts and are relatively easy to

    explain to managers. Decision trees are not only used for classification. When

    they are used to predict numeric outcomes, they are referred to as regression

    trees. The basic concept that decision trees use is that each node of the tree
    is

    split into two parts based upon an optimal split point. The tree continues to

    grow by adding more leafs until it is not able to make any additional splits,

    which improve the ability to distinguish between any of the decisions.


    # Random forests


    Note that Random Forests (tm) is a trademark of Leo Breiman and Adele

    Cutler and is licensed exclusively to Salford Systems for the commercial

    release of the software.


    One problem with decision trees is that they are highly dependent on the

    specific variables that are initially chosen. One could generate a slightly

    different set of initial variables and end up with an equally valid solution,

    although different.


    Random forest algorithms (which are known by several different names refer

    to the note at end of the chapter) are an attempt to improve decision trees in

    that random forests randomize the selection of variables and subsamples in

    order to generate multiple (even thousands of) separate decision trees. After

    all the decision trees are generated, a consensus prediction is determined

    which averages the effects over all of the different trees that have been

    generated.


    In order to determine consensus, you can specify that the algorithm

    implements a simple majority vote scheme. We will see how this works by

    running two simple decision trees on the `titanic` dataset first, and then

    comparing the results to that which is obtained using a random forest.


    # Example - comparing single decision trees to a random forest


    First, install the `titanic` package and assign the training dataset to a

    dataframe:'
