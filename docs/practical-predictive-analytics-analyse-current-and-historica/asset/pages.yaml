  md: '![](img/672c0cf8ba3c000a6529b117ed96945e_171_0.png)


    # Multivariate outliers


    The precedingÂ example has just given an example of looking at outliers from a
    univariate, or single variable, perspective. However, outliers can also occur
    in a multivariate or combination form. In these cases, visualizing outliers in
    two dimensions can be a start, but as the dimensionality increases they can be
    more difficult to isolate. For multivariate outliers you can use distance and
    influence measures such as Cook''s D or Mahalanobis distances to measure how far
    they are from a regression line. Principal component analysis can also help by
    reducing the dimensionality first, and then examining the higher order principal
    components that could include the outliers.'
  merge: -1
  img_proc: true
- pgno: 172
  md: '# # Data transformations


    When you are dealing with continuous skewed data, consider applying a data transformation,
    which can conform the data to a specific statistical distribution with certain
    properties. Once you have forced the data to a certain shape, you will find it
    easier to work with certain models. A simple transformation usually involves applying
    a mathematical function to the data.


    Some of the typical data transformations used are `log`, `exp`, and `sqrt`. Some
    work better for different kinds of skewed data, but they are not always guaranteed
    to work, so it is always best practice to try out several basic ones and determine
    if the transformation becomes workable within the modeling context. As always,
    the simplest transformation is the best transformation, and do some research on
    how transformations work, and which ones are best for certain kinds of data.


    To illustrate the concept of a transformation, we will start by first generating
    an exponential distribution, which is an example of a non-linear distribution.
    Refer to the histogram of _X_ and the normal Q-Q plot in the first row of the
    following plot quadrant. Both of these plots show the data to be highly skewed.
    You can see the histogram is heavily weighted toward the lower range of _x_, and
    the Q-Q plot is not displaying as a straight line. So, we will need to find a
    transformation that smooths out the skewness. We will apply the Box Cox algorithm,
    which will determine an optimal transformation to use.


    # ## Generating the test data


    Install the packages if needed:


    ```

    install.packages("car")

    install.packages("MASS")

    ```


    Assign the libraries:'
  merge: -1
  img_proc: true
- pgno: 173
  md: '```

    library(car)

    library(MASS)

    ```


    Generate the skewed data:


    ```

    set.seed(1010)

    x<-rexp(1000)   # exponential sample with parameter 1

    par(mfrow=c(2,3) )

    ```


    Plot the histogram and normal probability plots. The par() function specified

    that they will be part of the first row of plots shown in the next section:


    ```

    hist(x)

    qqnorm(x)

    # Normal probability plot for original variable

    ```


    # The Box-Cox Transform


    We will now illustrate the Box-Cox Power Transformation (also known as

    Power Transformation). This is a generic transform that will search for

    optimal transformations to use on your data. This transformation optimizes an

    exponent called lambda, which is then applied to your data. It does this by

    iterating over all exponents between -5 and +5 until it has found the best one

    to transform your data to a normal distribution:


    ```

    boxcox(x~1)

    ```


    As you can see from the plot produced from the boxcox() function (the third

    plot), the optimal exponent to apply the data will be somewhere between 0

    and 1.


    Next, we will apply the power function. The powerTransform() function will

    apply the optimal lambda just calculated to the original data:


    ```

    p<-powerTransform(x)

    ```


    You can see what the value is by switching over to the console and looking

    for the value of p$lambda. The console will show that the value is 0.2873638:


    ```

    p$lambda

    ```'
  merge: -1
  img_proc: true
- pgno: 174
  md: 'The next step is to apply the power transformation to your existing data and
    assign the results to a new vector, y:


    ```

    y<-bcPower(x,p$lambda) # Box-Cox transformation

    ```


    The histogram of the new data (histogram of y in the following image) shows that
    the data has been transformed to a normal distribution, and the QQ plot, which
    measures normality, shows a nice straight line:


    ```

    qqnorm(y)

    # Normal probability plot for transformed variable

    hist(y)

    ```


