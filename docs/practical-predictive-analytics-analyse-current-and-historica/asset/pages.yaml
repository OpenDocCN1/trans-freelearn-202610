    +   - The model will be run via the `glm()` function with some dependent variable
    to the left of the ~\n- The independent variable will be supplied to the right
    of the ~\n- The `Data=` parameter will supply an input dataset\n- The `family=`
    parameter will specify the type of general linear model that you will be running,
    and, in this case, it will be a Poisson model


    To try a Poisson model on real data, we can use the `warpsbreaks` data, which
