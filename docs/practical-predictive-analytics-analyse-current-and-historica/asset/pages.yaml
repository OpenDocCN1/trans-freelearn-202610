  md: "# Compressing descriptions using camelcase\n\nFor long descriptions, sometimes\
    \ it is beneficial to compress them into camelcase to improve readability. This\
    \ is especially valuable when viewing descriptions that are labels on _x_ or _y_\
    \ axes.\n\nCamelcase is a method that some programmers use for writing compound\
    \ words, where spaces are first removed, and then each word begins with a capital\
    \ letter. It is also a way of conserving space.\n\nTo accomplish this, we can\
    \ write a function called `.simpleCap`, which performs this function. To illustrate\
    \ how it works, we will pass it a two element character vector c(\"A certain good\
    \ book\",\"A very easy book\"), and observe the results.\n\n# Custom function\
    \ to map to camelcase\n\nThis is a simple example use of this function that maps\
    \ the two character vector c(\"A certain good book\", \"A very easy book\") to\
    \ camelcase. This vector is mapped to two new elements:\n\n```\n[1] \"ACertainGoodBook\"\
    , and [2] \"AVeryEasyBook\"\n```\n\n```\n# change descriptions to camelcase maybe\
    \ append to itemnumber for\n.simpleCap <- function(x) {\n  # s <- strsplit(x,\
    \ ' ')[[1]]\n  s <- strsplit(tolower(x), \" \")[[1]]\n\n  aa <- paste(toupper(substring(s,\
    \ 1, 1)), substring(s, 2), se\ngsub(\" \", \"\", aa, fixed = TRUE)\n}\n\na <-\
    \ c(\"A certain good book\", \"A very easy book\")\na4 <- gsub(\" \", \"\", .simpleCap(a),\
    \ fixed = TRUE)\na4\n```"
  merge: -1
  img_proc: true
