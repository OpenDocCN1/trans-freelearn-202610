    60%   10364.65\n70%   11019.19\n80%   12175.63\n90%   13164.27\n100%  15363.60\n\
    ```\n\n# Transforming the data\n\nAnother way to look at outliers is by first\
    \ standardizing them to a normal distribution with a mean of 0 and standard deviation\
    \ of 1. Using standard normal form is convenient, since the properties of the\
    \ distribution never change, and some critical cut-off points can be committed\
    \ to memory. For example, for a standard normal distribution, quartile 1 is always\
    \ at -.67 and quartile 3 is always at +.67, so it is easy to compute the interquartile\
    \ range to memory, which is 1.34. Using the interquartile range rule to identify\
    \ outliers means that we will take 1.5 times this amount to derive the value of\
    \ 2.01, so we will be considering any data point above .67+2.01=2.68, or -.67-2.01=-2.86,\
    \ to be a possible outlier. This is an example of how we can use a statistical\
    \ property of a distribution to identify an outlier. You could also use a rule\
    \ such as identifying any data point more than three standard deviations from\
    \ the mean, or by using a Chi-square test to determine if your grouped data differs\
    \ significantly from the theoretical distribution. The outliers package also contains\
    \ several other methods and statistical tests for detecting outliers, including\
    \ the Grubbs test.\n\nHere we will first normalize the data, and then look for\
    \ data falling above or"
