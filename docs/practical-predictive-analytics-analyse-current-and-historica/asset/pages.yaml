    this, in that, if you are a female, there is a 3/7 or 43% chance that you will
    be frisked. However, if you are a male, there is a 64/92 or 70% chance that you
    will be frisked.


    If sex=Z (unknown), being frisked was correctly predicted 1% of the time.


    # Constructing new variables


    Even though OneR works by finding the single best predictor, we can also try to
    improve the predictions by constructing some new variables and tricking OneR into
    thinking it is one variable.


    In the code below we are creating new variables by combining attributes of single
    variables such ass of build, eyecolor, and hair color. After running the OneR
    model again, you can see that it helps a bit in terms of prediction accuracy and
    one of the new variables (eye_hair_build) is now ranked second.'
