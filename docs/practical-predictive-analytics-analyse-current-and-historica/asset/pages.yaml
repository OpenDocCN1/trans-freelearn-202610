  img_proc: true
- pgno: 304
  md: 'The two curves plotted here indicate that females are more likely to be retained
    over all time periods, and suggests that useful marketing incentives could target
    males early on:


    # Survival Curves by Gender


    ![](img/672c0cf8ba3c000a6529b117ed96945e_304_0.png)


    # Testing for the gender difference between survival curves


    On examination of the survival curve, it is apparent that females are surviving
    longer than males at every time period. However, we are judging this purely based
    upon visual inspection. Often, the results are not as obvious. Even if they were
    obvious, it is good statistical practice to construct a statistical hypothesis
    test for this. We will use the log-rank test, which is implemented in R using
    the `survdiff()` function.


    The output from the function prints the chi-square statistics associated with'
  merge: -1
  img_proc: true
- pgno: 305
  md: 'the test, which will demonstrate any significant difference between the two
    curves, along with the associated p-value.


    For gender, there is a significant difference at the .01 level, as shown by the
    low p-value, which is much less than this cutoff:


    ```

    > survdiff(SurvObj ~ Xgender, data = ChurnStudy)

    Call:

    survdiff(formula = SurvObj ~ Xgender, data = ChurnStudy)

    ```


    | N | Observed | Expected | (O-E)^2/E | (O-E)^2/V |

    |---|---|---|---|---|

    | Xgender=F | 341 | 137 | 177 | 9.24 | 14.5 |

    | Xgender=M | 1147 | 614 | 574 | 2.86 | 14.5 |


    Chisq= 14.5 on 1 degrees of freedom, p= 0.000143


    # Testing for the educational differences between survival curves


    Now run the survdiff function for any differences in education:


    ```

    > survdiff(SurvObj ~ Xeducation, data = ChurnStudy)

    Call:

    survdiff(formula = SurvObj ~ Xeducation, data = ChurnStudy)

    ```


    | N | Observed | Expected | (O-E)^2/E | (O- |

