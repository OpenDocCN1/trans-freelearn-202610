- pgno: 299
  md: 'from the start of the study. What that means for customer retention is that
    a subscriber who has been with a company for five years is treated the same as
    someone who joined one month ago, if the start period for the study begin an a
    month ago. The five years prior are considered censored information.


    +   • An event flag, usually 0 or 1, which designates whether or not the event
    has occurred during that time period. A customer will have multiple event flags
    corresponding to each month in the study.


    +   • A classification or grouping variable. This is usually a single variable.


    KM survival curves are then generated by using the Survfit() function, which is
    contained within the survival package.


    We can begin by examining the survival curve for the entire dataset, without grouping.
    In this case we use a unity operator, or 1 using formula notation, to designate
    the entire dataset as a single group:


    ```

    km <- survfit(SurvObj ~ 1, data = ChurnStudy, conf.type = "log-lo

    plot(km,col=''red'')

    title(main = "Survival Curve Baseline")

    dev.copy(jpeg,''Ch5 - Survival Plot Baseline.jpeg''); dev.off()

    ```


    The curve shows all members as being active at the beginning of the study. As
    members leave, the plot monotonically decreases in value. You can see that the
    variance of each estimate (the dashed lines that appear above and below the estimate)
    is much larger as the time period extends in duration. That is because the sample
    size becomes smaller as the number of customers shrink, and the estimates become
    less accurate. For the baseline estimate, we can see that at 6 months, the (theoretical)
    estimate shows that about 86% customers have remained:'
  merge: -1
  img_proc: true
