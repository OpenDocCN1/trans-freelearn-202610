- pgno: 343
  md: "# # Variable selection\n\nThe model we just worked with had a limited number\
    \ of variables, so mechanical variable selection methods when dealing with a large\
    \ number of variables were not really that pertinent. We were able to pinpoint\
    \ the important ones via the regression model. However, for a model with a large\
    \ number of variables we could use the `glmulti` package for the purpose of performing\
    \ variable selection.\n\nFor the churn example that was generated, we have a small\
    \ number of variables, so it is easy to demonstrate a variable selection and not\
    \ so time consuming.\n\nIn the following code, we will set the maximum number\
    \ of terms to include in the best regression to 10 in order to limit the computational\
    \ time needed to perform an exhaustive search. We will also use the genetic algorithm\
    \ option (`method = \"g\"`) which can be much faster with larger datasets, since\
    \ it only considers the best subsets of all of the combinations.\n\nIf you wish\
    \ to perform an exhaustive search, use `method = \"h\"`. However, be forewarned,\
    \ this may tie up your machine for a very long time:\n\n+   - Run the following\
    \ code to begin the variable selection process:\n\n```\nlibrary(glmulti)\nglmulti.coxph.out\
    \ <-\n  glmulti(Surv(Xtenure2, Churn) ~ Xeducation + Xgender +\n    Xsatisfaction\
    \ + Xservice.calls +\n    Xpurch.last.month + Xmonthly.charges, data =\n    ChurnStudy,\n\
    \    maxsize=10,\n    level = 2,\n    method = \"g\",\n    crit = \"aic\",\n \
    \   confsetsize = 5,\n    plotty = T, report = F,\n    fitfunction = \"coxph\"\
    )\n```"
  merge: -1
  img_proc: true
