  md: 'across some format at this point. No predefined schemas are used in XML, but
    that also means that there is a fair amount of data parsing that needs to be performed
    after the data is read in order to extract the data itself. The XML() package
    is used to read XML data into R.


    JSON is another standard derived from web technologies that was originally used
    to transmit sets of key pairs between different application systems. The jsonlite
    package can be used to parse JSON files.


    # Note


    Still confused about all the different file formats? Try using the Rio package
    with input files. Rio is a specialized wrapper package that is able to identify
    the type of file that you wish to read and then call the appropriate package.


    # Generating your own data


    Not sure which data source to use when testing a predictive model? No problem.
    Generate your own data with the built-in sample() function, as well as generating
    random observations based upon distributions such as runif (uniform), rnorm (normal),
    mvnorm (multivariate normal), or rpois (poisson counts). We will also be using
    a specialized package called wakefield, which generates typical random values
    that you would find in many data sources, such as age, gender, education, and
    customer satisfaction scores, without having to worry about the underlying distributions.


    # Tips for dealing with large files


    Some input files can get quite large and inefficient to read. Here are some tips
    to speed up the process:


    +   - Use external Unix tools for splitting files so that they can be read in
    chunks. There is usually a field that you can use to split out separate files.
    Date fields are good ones.

    +   - Consider using external tools to replace large character strings with'
  merge: -1
  img_proc: true
- pgno: 128
  md: "+   numerical or shorter character strings. This will save valuable memory.\n\
    +   \n+   * Use parameters on input to control how much data you want to read.\
    \ You may want to process your input file by starting to read your input at row\
    \ 1,000,000. You don't always have to read a file from the beginning.\n+   * Do\
    \ not feel obliged to always read all of the columns. Once you have determined\
    \ which columns are truly needed, read only those columns; this will speed up\
    \ the processing. For example, if you are using read.table, you can specify NULL\
    \ in the colClasses option to indicate that a column is to be skipped.\n+   *\
    \ Use the scan, fread, and readlines functions. They will give you a greater degree\
    \ of control over the input, and can make input faster.\n\n# Data munging and\
    \ wrangling\n\nA large part of preparing the data for analysis utilizes bringing\
    \ disparate information together in order to produce the final analytics dataset,\
    \ which will be passed directly to the algorithm. This process is known by many\
    \ different names, such as data munging, data wrangling, ETL, or simply data prep.\
    \ We have already discussed some ways in which we can read data from a single\
    \ source. You will be very fortunate if you are able to work with a single data\
    \ file that has all of the information that you need. In fact, if you are able\
    \ to utilize data that is already consolidated, go for it, since someone else\
    \ has already done the work and there is no need to try to figure out how to relate\
    \ them yourself. However, most of the time you will need to relate at least two\
    \ different sources, and somehow relate them based upon some common data elements."
