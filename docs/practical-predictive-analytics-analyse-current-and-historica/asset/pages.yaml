  md: "The exp() function will give you the actual likelihood ratios for each of the\
    \ variables. This allows you to observe the effect of each variable on the likelihood\
    \ of the predictor occurring. In our previous example, increasing the Age by 1\
    \ year increases the likelihood of Pain by a factor of 1.3. Å Is that a lot?Å\
    \ Start thinking beyond the numbers and consider how you might perceive that result\
    \ if you happened to be suffering a chronic condition.\n\n# Examining the residuals\n\
    \nOne of the first things I do after looking at the coefficients is to look at\
    \ the residuals.\n\nYou can see all of the residuals by using the residuals()\
    \ function:\n\n```\nresiduals(PainGLM, type=\"deviance\") # residuals\n```\n\n\
    For many good models, the residuals will be scattered around zero, and will have\
    \ roughly the same variance at all levels. The deviance of the residuals for this\
    \ model are listed within the summary section shown previously. We can see that\
    \ the distribution is balanced since the absolute values of the min and max are\
    \ approximately equal, as well as 1Q (25th percentile) with 3Q (75th percentile):\n\
    \n```\nDeviance Residuals:\n       Min        1Q    Median        3Q       Max\n\
    \ -2.7638   -0.5904  -0.1952   0.6151   2.3153\n```\n\nIf we want to look at the\
    \ mean, we can wrap the mean() function around the residuals() function. Note\
    \ that the mean value of -0.04 is greater than the median value of -0.195. This\
    \ means that the residuals have a slightly positive skew:\n\n```\nmean(residuals(PainGLM,\
    \ type=\"deviance\"))\n```\n\nHere is the output which will appear in the console:\n\
    \n```\n[1] -0.04269042\n```\n\n# Residual plots"
