    # R installation


    R installation is typically done by downloading the software directly from the
    Comprehensive R Archive Network (CRAN) site:


    +   1. Navigate to https://cran.r-project.org/.

    +   2. Install the version of R appropriate for your operating system.Â Please
    read any notes regarding downloading specific versions. For example, if you are
    a Mac user may need to have XQuartz installed in addition to R, so that some graphics
    can render correctly.


    # Alternate ways of exploring R


    Although installing R directly from the CRAN site is the way most people will
    proceed, I wanted to mention some alternative R installation methods. These methods
    are often good in instances when you are not always at your computer:


    +   • Virtual environment: Here are a few ways to install R in the virtual environment:

    +     • VirtualBox or VMware: Virtual environments are good for setting up protected
    environments and loading preinstalled operating systems and packages. Some advantages
    are that they are good for isolating testing areas, and when you do not wish to
    take up additional space on your own machine.

    +     • Docker: Docker resembles a virtual machine, but is a bit more lightweight
    since it does not emulate an entire operating system, but emulates only the needed
    processes.

    +   • Cloud-based: Here are aâ€few methods to install R in the cloud-based environment.
    Cloud based environments as perfect for working in situations when you are not
    working directly on your computer:'
