- pgno: 122
  md: '# Data input


    Data by itself is just a pure stream of a numerical something. It is the analytics
    process that turns this something into knowledge, but before we start understanding
    it, we have to be able to obtain it. The number of ways in which we can now generate
    data has grown exponentially. Progressing from fixed length format, through HTML,
    and then to free form unstructured input, and then to today''s schema on read
    technologies, there are so many different data formats today that there is a very
    good chance that you haven''t, and will never work with a few of them. Reading
    data in and understanding the variables and what the data represents can also
    be incredibly frustrating. Integrating the data with other sources, both internal
    and external, can seem like a jigsaw puzzle at times. At times, the data will
    not seem to fit as nicely as you would hope.


    However, with regard to raw input, most people will work with a couple of common
    formats in the course of their work, and it will be useful to know how to utilize
    them.


    # Text file Input


    The most convenient way to read data into a predictive analytics project is via
    an input text file. Text files are convenient and work well for small and medium
    projects. You can examine text files using many different kinds of program in
    human readable form. However, as the data gets larger, it may be that storing
    data in text files becomes a bit unmanageable, and you might have to turn to retrieving
    directly from data warehouses, both from the SQL and NoSQL variety, and possibly
    incorporate ecosystems such as Spark and Hadoop, in which you will begin to use
    parallel processing and memory management techniques.


    # The read.table function'
  merge: -1
  img_proc: true
- pgno: 123
  md: 'The basic function for reading text files is `read.table`. The most important
    information to supply to this function is a filename, a separator, and whether
    or not a row header is included. There are also some other important options to
    consider when reading in a file using `read.table` function:


    +   • `header`:Â set to `header=TRUE` if the first line of the input data contains
    column header information.

    +   • `col.names`:Â if you will be supplying your own column names, use this option
    to specify the columns names in a vector.

    +   • `na.string`:Â The default for this is NA; however, input data contains a
    variety of codes that can represent NA, or can even have multiple NA values. Sometimes,
    the values 0, 9, or other characters such as . can be used to represent a missing
    value.

    +   • `ColClasses`:Â use this option if you want to specifically read an input
    data item as a specific data type, such as string, int, or factor. Supply `ColClasses`
    as a vector of character types. This option is often supplied after an initial
    read of the data, when you discover the default data type is not what you want
    it to be, and you will be forcing a reading of the particular variable with the
    specific data type specified.

    +   • `stringsAsFactors`:Â If this option is specified as `TRUE`, it will coerce
    the character input into a factor. Factors are a special representation of character
    categorical variables, which are represented internally as integers. Setting a
    character variable as a factor makes it more efficient to analyze as categorical
    variables, but makes it a little more difficult to perform strict text processing,
    for example, string manipulation. However, this are ways around these by using
    functions, which cast data types into alternative data types.


    # Note


    Generally, it is a good idea to set `stringsasFactors` to FALSE if you will be
    doing a lot of string manipulations. However, factors are much more useful for
    analytic packages, and most of the time variables are required to be in factor
    format. But there are ways to convert the variables from character to factor,
    or vice versa, and this only becomes important when your code reaches production,
    or when you want to conserve memory.'
