  md: "# Plotting the data using lattice\n\nThe `lattice` package is a useful package\
    \ to learn, especially for analysts who like to work in formula notation (y~x).\n\
    \nIn this example, we will run a lattice plot in order to plot `Not.Covered.Pct`\
    \ on the `y-axis`, `Year` on the `x-axis`, and produce separate plots by category.\n\
    \nThe main call is specified by the following:\n\n```\nxyplot(Not.Covered.Pct\
    \ ~ Year | cat, data = x3)\n```\n\nSince we are plotting the top 10 groups, we\
    \ can specify `layout=c(5, 2)` to indicate we want to arrange the 10 plots in\
    \ a 5*2 matrix. `Not.Covered.Pct` is to be arranged on the `y axis` (left side\
    \ of the ~ sign), and `Year` is arranged along the `x-axis` (right side of ~ sign).\
    \ The bar (`|`) indicates that the data is to be plotted separately by each category:\n\
    \n```\nlibrary(lattice)\nx.tick.number <- 14\nat <- seq(1, nrow(x3), length.out\
    \ = x.tick.number)\nlabels <- round(seq(1999, 2012, length.out = x.tick.number))\n\
    \np <- xyplot(Not.Covered.Pct ~ Year | cat, data = x3, type = \"1\",\n    cex\
    \ = 1), par.strip.text = list(cex = 0.5), scales = list(x =\n    cex = 0.4, rot\
    \ = 45), layout = c(5, 2))\n\ntrellis.device()\n\nprint(p)\n```"
  merge: -1
  img_proc: true
