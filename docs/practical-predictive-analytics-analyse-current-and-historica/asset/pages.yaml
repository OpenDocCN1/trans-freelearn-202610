  md: '# Support vector machines


    We have already seen some examples in which we use a straight line to separate
    classes.


    As the dimensionality, or feature space, of a model increases, there may be many
    different ways to separate classes, in both linear and non-linear ways.


    In the cases of support vector machines, data is first transformed into a higher
    dimensional space using a mapping function known as a kernel, and an optimal hyperplane
    is used to segment the higher dimensional space. A hyperplane uses one dimension
    less than the space it is trying to measure, so a straight line is used to segment
    a two-dimensional space, and a 2-dimensional sheet of paper is used to segment
    a three-dimensional space. The hyperplane can be either linear or non-linear.


    Hyperplanes use support vectors which are important training tuples and are used
    to define the boundaries of each class. They are the most critical points in the
    data, and they are the most important pointsÂ used which support the definition
    of the hyperplane. The hyperplane is used do define the boundaries beween the
    different classes. A class is often a binary class, such as 0 or 1. The boundaries
    between the classes can also be wide or thin. That characteristic is measured
    by the margins which define a maximum separation that can be optimized between
    the classes.


    Here is an example of a dataset with two features, x and y. The lines A and B
    could be considered as two separate linear classifiers for a decision rule that
    separates the red observations from the blue observations. The A line is preferable,
    since it contains a larger margin, separation value between the decision line
    and the nearest observation. The observations that are close to the line are known
    as the support vectors:'
  merge: -1
  img_proc: true
