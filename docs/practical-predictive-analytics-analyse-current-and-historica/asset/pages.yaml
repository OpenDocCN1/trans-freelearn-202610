    the output produced by running a summary function on the regression results, as
    we did previously. You can run it again if you wish.


    ```

    summary(lm_output)

    ```


    The amount of statistical information output by the `summary()` function can be
    overwhelming to the initiated. This is not only related to the amount of output,
    but the formattng. That is why I did not show the entire output in the previous
    example.


    One way to make output easier to look at is to first reduce the amount of'
