- pgno: 205
  md: '# # Saving your data


    Before we do anything else, let''s save this dataframe to disk, since we will
    be using it again in this chapter. Before saving the file, make sure you set your
    working directory to the data directory:


    ```

    setwd("C:/PracticalPredictiveAnalytics/Data")

    save(df,file="pain_raw.Rda")

    ```


    # # Fitting a GLM model


    Now we will fit a logistic model using the glm package. Logistic regression typically
    predicts the probability of the 1 event, so make sure that the 1 events corresponds
    to what you want to predict. Often there is some confusion when variables are
    coded 1 for negative conditions such as not present, or does not exist. For our
    model, Pain=1 represents reduction of pain. Be sure to specify family="binomial"
    as an option, since that tells GLM that you will be running a logistic model:


    ```

    PainGLM <- glm(Pain ~ Treatment + Gender + Age + Duration, data=d

    ```


    The summary function will list the coefficients (Estimate), along with the standard
    error, standardized z value, and the p-values. The p-values (last column) which
    contain an asterisk (* or **) usually specify the significant variables, and are
    usually the ones you should look at first. However, please try not to automatically
    look at just the variables with asterisks. You should look at the coefficients
    and statistics for all of the variables, since p-values should not be treated
    as absolute numbers, especially when dealing with people''s health:


    ```

    summary(PainGLM)

    ```


    This is the output that is produced:


    ```

    Call:

    glm(formula = Pain ~ Treatment + Gender + Age + Duration, family

    data = df)

    ```'
