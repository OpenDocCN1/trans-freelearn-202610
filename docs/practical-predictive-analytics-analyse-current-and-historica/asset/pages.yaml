- pgno: 23
  md: '# How is a predictive analytics project organized?


    After you install R on your own machine, I would give some thought to how you
    want to organize your data, code, documentation, and so on. There will probably
    be many different kinds of projects that you will need to set up, ranging from
    exploratory analysis to full production-grade implementations. However, most projects
    will be somewhere in the middle, that is, those projects thatÂ ask a specific
    question or a series of related questions. Whatever their purpose, each project
    you will work on will deserve its own project folder or directory.


    Some important points to remember about constructing projects:


    +   * It is never a good idea to boil the ocean, or try to answer too many questions
    at once. Remember, predictive analytics is an iterative process.

    +   * Another trap that people fall into is not having their project reproducible.
    Nothing is worse than to develop some analytics on a set of data, and then backtrack,
    and oops! different results.

    +   * When organizing code, try to write code as building block, which can be
    reusable. For R, write code liberally as functions.

    +   * Assume that anything concerning requirements, data, and outputs will change,
    and be prepared.

    +   * Considering the dynamic nature of the R language. Changes in versions, and
    packages could all change your analysis in various ways, so it is important to
    keep code and data in sync, by using separate folders for the different levels
    of code, data, and so on or by using version management packages such as subversion,
    git, or cvs.


    Once you have considered all of the preceding points, physically set up your folder
    environment.'
  merge: -1
  img_proc: true
- pgno: 24
  md: '# Setting up your project and subfolders


    We will start by creating folders for our environment. Often projects start with
    three subfolders which roughly correspond to:


    +   • Data source

    +   • Code-generated outputs

    +   • The code itself (in this case, R)


    There may be more in certain cases, but letâs keep it simple:


    +   • First, decide where you will be housing your projects. Then create a sub-directory
    and name it `PracticalPredictiveAnalytics`. For this example, we will create the
    directory under Windows drive C.

    +   • Create three subdirectories under this project: `Data`, `Outputs`, and `R`:

    +     • The `R` directory will hold all of our data prep code, algorithms, and
    so on.

    +     • The `Data` directory will contain our raw data sources that will typically
    be read in by our programs.

    +     • The `Outputs` directory will contain anything generated by the code. That
    can include plots, tables, listings, and output from the log.


    Here is an example of how the structure will look after you have created the folders:


    | Name | Date modified | Type |

    |---|---|---|

    | Data | 4/27/2017 1:30 PM | File folder |

    | Outputs | 4/27/2017 1:30 PM | File folder |

    | R | 4/27/2017 1:31 PM | File folder |'
  merge: -1
  img_proc: true
- pgno: 25
  md: '# # GUIs


    R, like many languages and knowledge discovery systems, started from the command
    line. However, predictive analysts tend to prefer Graphic User Interfaces (GUIs),
    and there are many choices available for each of the three different operating
    systems (Mac, Windows, and Linux). Each of them has its strengths and weaknesses,
    and of course there is always the question of preference.


    Memory is always a consideration with R, and if that is of critical concern to
    you, you might want to go with a simpler GUI, such as the one built in with R.


    If you want full control, and you want to add some productive tools, you could
    choose RStudio, which is a full-blown GUI and allows you to implement version
    control repositories, and has nice features such as code completion.


    R Commander (Rcmdr), and Rattle unique features are that they offer menus that
    allow guided point and click commands for common statistical and data mining tasks.
    They are always both code generators. This is a way to start when learning R,
    since you can use the menus to accomplish the tasks, and then by looking at the
    way the code was generated for each particular task. If you are interested in
    predictive analytics using Rattle, I have written a nice tutorial on using R with
    Rattle which can be found in the tutorial section of *Practical Predictive Analytics
    and Decisioning Systems for Medicine*, which is referenced at the end of this
    chapter.


    Both RCmdr and RStudio offer GUIs that are compatible with the Windows, Apple,
    and Linux operator systems, so those are the ones I will use to demonstrate examples
    in this book. But bear in mind that they are only user interfaces, and not R proper,
    so it should be easy enough to paste code examples into other GUIs and decide
    for yourself which ones you like.'
  merge: -1
  img_proc: true
