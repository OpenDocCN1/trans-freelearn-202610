    # Using formula notation in an rpart model


    We have already seen how to specify regression models in R using formula notation.
    For example, we use `lm(women$height ~ women$weight)` to predict height based
    upon weight.


    The general form of formula notation in regression models is:


    *Dependent variable ~ Independent variables*


    Where the dependent variable is on the left side of the tilde (~), and the independent
    variables are on the right side of the tilde.


    An rpart model can be set up using formula notation as well, with a slight change
    in terminology. In an rpart model, we can specify the target variable'
  merge: -1
  img_proc: true
- pgno: 242
  md: '(Life.Exp) on the left side of the tilde (~), and the predictor variables on
    the right side of the tilde. We will use dot notation (.) to designate that we
    will be considering _all_ variables.


    # Note


    Dot notation is a convenient way to specify all your variables; however, as you
    build out your model, you may want to avoid using this, and instead specify the
    specific list of the variables that you are interested in. This will speed up
    processing, and will avoid unnecessary splits.


    In the following example, you can see that rpart will select `state` as the best
    initial split variable. While this may ultimately grow a very accurate tree, in
    terms of prediction ability, splitting initially on a high dimensional variable
    such as state does not offer great insight into what causes variation in life
    expectancy. There is always the possibility that the states will be broken out
    into geographic areas. But often you will obtain a split of states that do not
    make any sense.


    In the following example we will use the `rpart()` function to generate a simple
    decision tree.Â We will also use the `prp()` function from the package `rpart.plot`
    to visualize the tree:


    ```

    install.packages("rpart")

    install.packages("rattle")

    install.packages("rpart.plot")

    install.packages("RColorBrewer")


    library(rpart)

    library(rattle)

    library(rpart.plot)

    library(RColorBrewer)

    set.seed(1020)

    y1 <- rpart(Life.Exp ~ .,data=x,cp=.01)

    prp(y1, type=4, extra=1)

    ```


    # Interpretation of the plot'
  merge: -1
  img_proc: true
