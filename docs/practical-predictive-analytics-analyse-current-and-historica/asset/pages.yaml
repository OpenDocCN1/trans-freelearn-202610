- pgno: 622
  md: '# Discovering the important features


    We will now introduce the OneR package to discover some of the important features
    of the dataset. The OneR package will produce a single decision rule for each
    of the features and then rank them in terms of accuracy. Accuracy is defined as
    the probability of classifying the outcome correctly and can be expressed as a
    confusion or error matrix, which we have seen before in the previous chapters.
    The OneR package has some other nice features, such as the ability to bin integer
    variables optimally in order to yield the best predictor.


    The OneR package does not run natively on Spark, so we first need to use the collect()
    and sample() functions to perform a 95% sample of the Spark dataframe and then
    move it to a local R dataframe via the collect() function.


    Although this Spark dataframe is small enough to perform the example without the
    sampling, it is important to know how to sample from a dataframe, since if you
    are using Spark as intended, Â your dataframes will be too large to use the collect
    function to bring the entire dataframe into a local instance of R. Â For extremely
    large Spark tables, you may want to use a sampling percentage of 5-10% or so for
    an initial analysis. Â However, for our example we will use a sampling percentage
    of 95% to capture most of the data, since the 2015 stop and risk data is relatively
    small. However, if you were bringing in all of the years'' data and concatenating
    it into one big Spark dataframe, you would consider bringing down the sampling
    percentage to a more reasonable number. Otherwise, you might end up with more
    rows than base R could handle.


    Also note that the OneR package is not currently available as a default installed
    package. But you can use devtools to install the latest version from cran:


    ```

    devtools::install_github("cran/OneR")

    library(OneR)

    ```'
  merge: -1
  img_proc: true
- pgno: 623
  md: '```

    #bring 95% of the rows from the Spark dataframe named "df" into a

    local = collect(sample(df, F.,95))

    ```


    # Eliminating some factors with a large number of levels


    Since the dataset is very granular for some of the features such as zip code and
    GPS location variables, we will first perform a dimension reduction by only including
    features/variables with a maximum of 20 levels. That will help us formulate models
    later without worrying about overfitting due to some variables that having high
    dimensionality. However, the number 20 is not set in stone; you can change the
    default and always keep variables which you feel are needed in the model regardless
    of levels.


    OneRÂ Â Â Â has a function named maxlevels()Â which can accomplish this. Â Any
    variable which has a number of levels exceeding this is not included in the output.


    After running the function, use the str() function to verify some variables have
    been eliminated. We originally started with 113 variables and now are down to
    97. Some of the variables, such as the x and y coordinates, have been eliminated
    since GPS coordinates obviously have more than 20 levels:


    ```

    frisked_df <- maxlevels(local, maxlevels = 20, na.omit = TRUE)

    #check the output to see if the number of levels were reduced

    str(frisked_df)

    ```


    Observe the first 3 lines of the output showing that the number of variables has
    been reduced from 113 to 97:


    ```

    ''data.frame'': 21359 obs. of 97 variables:

    $ year : chr "2015" "2015" "2015" "2015" ...

    $ ser_num : int 18 5 38 41 39 122 42 9 141 2 ...

    ```


    # Test and train datasets


    Of course, we will want to partition the data into test and training datasets.'
  merge: -1
  img_proc: true
- pgno: 624
  md: 'We have covered many ways to separate into test and train. This next method
    of partitioning will take a 80%/20% training/test split by:


    +   - first extracting the index numbers from the training dataset.Â We will use
    the base::sample function to accomplish this

    +   - building the training dataset from these indices

    +   - constructing the test dataset from the rows which are not contained in the
    index.


    Once we obtain the train indices, we will use the optbin function from the OneR
    package, which will optimally split a numeric variable based upon its ability
    to predict a Yes or No outcome for frisked. Â We have already seen this kind of
    optimal splitting with Decision Trees.Â Â In the code below optbin is directed
    to find the best split point for all of the numerical variables as indicated by
    specifying frisked~.


    ```

    set.seed(123)

    train.index <- base::sample(1:base::nrow(frisked_df), 0.80 * base

    train_data <- optbin(frisked_df[train.index,], frisked~.)

    test_data <- optbin( frisked_df[-train.index,], frisked~.)

    #after partitioning, run a summary of the first 15 rows to see wh

    summary(train_data[1:15])

    ```


