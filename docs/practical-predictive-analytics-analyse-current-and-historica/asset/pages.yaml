    # Variable selection


    Stepwise regression can be used as a variable selection method in cases in which
    you have a large number of variables, and you need to define a starting point
    in which you can start looking at a limited set of variables. However, all of
    the caveats regarding p-values come into play here as well. Use this method only
    to look at a candidate list of variables for model testing. It is not a good idea
    to use stepwise regression to determine a final model, since there are several
    methods use to determine the best variables, the final model can yield artificially
    high and biased results.


    However, let''s just start with identifying a list of potential variables for
    our `PainGLM` model, which is small, but will be good to illustrate the process.
    In the following example, the `stepwise()` function is used to determine a maximum
    `AIC` using the stepwise regression `forward/backward` options.


    The variable selection process starts by adding variables one at a time, and then
    implementing a form of variable swapping, that is, taking into account whether
    or not `AIC` would be improved by removing any variable which was already in the
    model. Once `AIC` cannot be improved, the selection process stops.


    +   • In the `PainGLM` example, the algorithm is illustrated, listing all the
    steps it goes through to determine the final variables selected. It begins with
    an initial `AIC` statistic of 83.5 (intercept-only model). Adding all of the variables
    into the model produces an `AIC` of 73.48. However, the `AIC` can then be improved
    by removing Duration. Therefore, it ends with a `Treatment, Age, and Gender` model
    with an `AIC` of 58.77, since it can no longer improve the AIC:'
  merge: -1
  img_proc: true
