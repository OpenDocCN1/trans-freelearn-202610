- pgno: 225
  md: 'This goodness of fit test will look at subgroups of the predicted probabilities,
    for example, the probability ranges grouped into 10 (deciles), and measuring whether
    or not the prediction of the response variable is significantly different from
    what would be expected by chance.


    First the data is group by their predicted probabilities from lowest to highest,
    and then binned into equally-sized groups.


    Then a chi-square test is used to compare the predicted probability of each binned
    group to their expected probabilities. In a good model, predictions should do
    better than what is expected for most of the binned groups. If it does not, the
    groups which are problematic will be indicated in the predicted vs. expected plot,
    and you will be able to go back and attempt to identify any potential model problems.


    # Goodness of fit example on the PainGLM data


    In the following example, we will apply the Hosmer-Lemeshow test to the PainGLM
    dataset. We will implement the Hosmer-Lemeshow test via the `hoslem.test()` function
    contained within the `ResourceSelection` package.


    To set up the test, supply the observed values, with the fitted (predicted) values
    as part of the `hoslem.test()` function:


    ```

    install.packages("ResourceSelection")

    library(ResourceSelection)

    hoslem.test(PainGLM$y, fitted(PainGLM))

    ```


