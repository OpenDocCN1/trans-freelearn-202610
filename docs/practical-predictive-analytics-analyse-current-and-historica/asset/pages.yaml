    We will now use the `split()` function to group the descriptions (`lastword`,
    which is column 2), by `InvoiceID` (column 1). The `as()` function is the critical
    keyword, as it converts the results of the split to transaction form:


    ```

    trans4 <- as(split(tmp[, 2], tmp[, 1]), "transactions")

    ```


    # Inspecting the transaction file


    Once the data has been coerced to transaction form, we can use the inspect function
    to examine the data.


    # Note


    When inspecting transaction files, you do not use normal print, or head functions
    directly, since the objects are in sparse format. You use an `inspect()` function
    instead.


    If you happen to have the `tm` package loaded (which we will use later), you must
    preface `inspect` with `arules::inspect`, since there is also an inspect function
    in the `tm` package that serves a different purpose.


