  md: '# Skills and roles that are important in Predictive Analytics


    So what skills do you need to be successful in predictive analytics? I believe
    that there are three basic skills that are needed:


    +   Algorithmic/statistical/programming skills: These are the actual technical
    skills needed to implement a technical solution to a problem. I bundle these all
    together since these skills are typically used in tandem. Will it be a purely
    statistical solution, or will there need to be a bit of programming thrown in
    to customize an algorithm, and clean the data? There are always multiple ways
    of doing the same task and it will be up to you, the predictive modeler, to determine
    how it is to be done.


    +   Business skills: These are the skills needed for communicating thoughts and
    ideas among groups of the interested parties. Business and data analysts who have
    worked in certain industries for long periods of time, and know their business
    very well, are increasingly being called upon to participate in predictive analytics
    projects. Data science is becoming a team sport and most projects include working
    with others in the organization, summarizing findings, and having good presentation
    and documentation skills are important. You will often hear the term domain knowledge
    associated with this. Domain knowledge is important since it allows you to apply
    your particular analytics skills to the particular analytic problems of whatever
    business you are (or wish to) work within. Everyone business has its own nuances
    when it comes to solving analytic problems. If you do not have the time or inclination
    to learn all about the inner workings of the problem at hand yourself, partner
    with someone who does. That will be the start of a great team!


    +   Data storage/Extract Transform and Load (ETL) skills: This can refer to specialized
    knowledge regarding extracting data, and storing it in a relational or non-relational
    NoSQL data store. Historically, these tasks were handled exclusively within a
    data warehouse. But now that the age of big data is upon us, specialists have
    emerged who understand'
  merge: -1
  img_proc: true
- pgno: 13
  md: 'the intricacies of data storage, and the best way to organize it.


    # Related job skills and terms


    Along with the term predictive analytics, here are some terms that are very much
    related:


    +   - **Predictive modeling**: This specifically means using a mathematical/statistical
    model to predict the likelihood of a dependent or target variable. You may still
    be able to predict; however, if there is no underlying model, it is not a predictive
    model.

    +   - **Artificial intelligence (AI)**: A broader term for how machines are able
    to rationalize and solve problems. AI''s early days were rooted in neural networks.

    +   - **Machine learning**: A subset of AI. Specifically deals with how a machine
    learns automatically from data, usually to try to replicate human decision-making
    or to best it. At this point, everyone knows about Watson, who beat two human
    opponents in Jeopardy.

    +   - **Data science**: Data science encompasses predictive analytics but also
    adds algorithmic development via coding, and good presentation skills via visualization.

    +   - **Data engineering**: Data engineering concentrates on data extraction and
    data preparation processes, which allow raw data to be transformed into a form
    suitable for analytics. A knowledge of system architecture is important. The data
    engineer will typically produce the data to be used by the predictive analysts
    (or data scientists).

    +   - **Data analyst/business analyst/domain expert**: This is an umbrella term
    for someone who is well versed in the way the business at hand works, and is an
    invaluable person to learn from in terms of what may have meaning, and what may
    not.

    +   - **Statistics**: The classical form of inference, typically done via hypothesis
    testing.Â Statistics also forms the basis for the probability distributions used
    in machine learning, and is closely tied with predictive analytics and data science.'
  merge: -1
  img_proc: true
- pgno: 14
  md: '# Predictive analytics software


    Originally, predictive analytics was performed by hand, by statisticians on mainframe
    computers using a progression of various language such as FORTRAN. Some of these
    languages are still very much in use today. FORTRAN, for example, is still one
    of the fastest-performing languages around, and operates with very little memory.
    So, although it may no longer be as widespread in predictive model development
    as other languages, it certain can be used to implement models in a production
    environment.


    Nowadays, there are many choices about which software to use, and many loyalists
    remain true to their chosen software. The reality is that for solving a specific
    type of predictive analytics problem, there exists a certain amount of overlap,
    and certainly the goal is the same. Once you get the hang of the methodologies
    used for predictive analytics in one software package, it should be fairly easy
    to translate your skills to another package.


    # Open source software


    Open source emphasizes agile development and community sharing. Of course, open
    source software is free, but free must also be balanced in the context of Total
    Cost Of Ownership (TCO).Â TCO costs include everything that is factored into a
    softwareâ€s cost over a period of time: that not only includes the cost of the
    software itself, but includes training, infrastructure setup, maintenance, people
    costs, as well as other expenses associated with the quick upgrade and development
    cycles which exist in some products.


    # Closed source software


    Closed source (or proprietary)Â software such as SAS and SPSS was at the forefront
    of predictive analytics, and has continued to this day to extend its reach beyond
    the traditional realm of statistics and machine learning. Closed'
  merge: -1
  img_proc: true
- pgno: 15
  md: 'source software emphasizes stability, better support, and security, with better
    memory management, which are important factors for some companies.


    # Peaceful coexistence


    There is much debate nowadays regarding which one is better. My prediction is
    that they both will coexist peacefully, with one not replacing the other. Data
    sharing and common APIs will become more common. Each has its place within the
    data architecture and ecosystem that are deemed correct for a company. Each company
    will emphasize certain factors, and both open and closed software systems are
    constantly improving themselves.Â So, in terms of learning one or the other, it
    is not an either/or decision. Predictive analytics, per second does not care what
    software you use. Please be open to the advantages offered by both open and closed
    software. If you do, that will certainly open up possibilities for working for
    different kinds of companies and technologies'
  merge: -1
  img_proc: true
- pgno: 16
  md: '# # Other helpful tools


    *Man does not live by bread alone, so it would behave you to learn additional
    tools in addition to R, so as to advance your analytic skills:*


    +   - **SQL**: SQL is a valuable tool to know, regardless of which language/package/environment
    you choose to work in. Virtually every analytics tool will have a SQL interface,
    and knowledge of how to optimize SQL queries will definitely speed up your productivity,
    especially if you are doing a lot of data extraction directly from a SQL database.
    Today''s common thought is to do as much pre-processing as possible within the
    database, so if you will be doing a lot of extracting from databases such as MySQL,
    PostgreSQL, Oracle, or Teradata, it will be a good thing to learn how queries
    are optimized within their native framework. In the R language, there are several
    SQL packages that are useful for interfacing with various external databases.
    We will be using `sqldf`, which is a popular R package for interfacing with R
    dataframes. There are other packages that are specifically tailored for the specific
    database you will be working with.

    +   - **Web extraction tools**: Not every data source will originate from a data
    warehouse. Knowledge of APIs that extract data from the internet will be valuable
    to know. Some popular tools include Curl and Jsonlite.

    +   - **Spreadsheets**: Despite their problems, spreadsheets are often the fastest
    way to do quick data analysis and, more importantly, enable you to share your
    results with others! R offers several interfaces to spreadsheets but, again, learning
    standalone spreadsheet skills such as pivot tables and Virtual Basic for applications
    will give you an advantage if you work for corporations in which these skills
    are heavily used.

    +   - **Data visualization tools**: Data visualization tools are great for adding
    impact to an analysis, and for concisely encapsulating complex information. Native
    R visualization tools are great, but not every company will be using R. Learn
    some third-party visualization tools such as D3.js, Google Charts, Qlikview, or
    Tableau.

    +   - **Big data, Spark, Hadoop, NoSQL database**: It is becoming'
  merge: -1
  img_proc: true
- pgno: 17
  md: 'increasingly important to know a little bit about these technologies, at least
    from the viewpoint of having to extract and analyze data that resides within these
    frameworks. Many software packages have APIs that talk directly to Hadoop and
    can run predictive analytics directly within the native environment, or extract
    data and perform the analytics locally.


    # Past the basics


    Given that the predictive analytics space is so huge, once you are past the basics,
    ask yourself what area of predictive analytics really interests you, and what
    you would like to specialize in. Learning all you can about everything concerning
    predictive analytics is good at the beginning, but ultimately you will be called
    upon because you are an expert in certain industries or techniques. This could
    be research, algorithmic development, or even managing analytics teams.


    # Data analytics/research


    But, as general guidance, if you are involved in, or are oriented toward, data,
    the analytics or research portion of data science, I would suggest that you concentrate
    on data mining methodologies and specific data modeling techniques that are heavily
    prevalent in the specific industries that interest you.


    For example, logistic regression is heavily used in the insurance industry, but
    social network analysis is not. Economic research is geared toward time series
    analysis, but not so much cluster analysis. Recommender engines are prevalent
    in online retail.


    # Data engineering


    If you are involved more on the data engineering side, concentrate more on data
    cleaning, being able to integrate various data sources, and the tools needed to
    accomplish this.'
  merge: -1
  img_proc: true
- pgno: 18
  md: '# Management


    If you are a manager, concentrate on model development, testing and control, metadata,
    and presenting results to upper management in order to demonstrate value or return
    on investment.


    # Team data science


    Of course, predictive analytics is becoming more of a team sport, rather than
    a solo endeavor, and the data science team is very much alive. There is a lot
    that has been written about the components of a data science team, much of which
    can be reduced to the three basic skills that I outlined earlier.


    # Two different ways to look at predictive analytics


    Various industries interpret the goals of predictive analytics differently. For
    example, social science and marketing like to understand the factors which go
    into a model, and can sacrifice a bit of accuracy if a model can be explained
    well enough. On the other hand, a black box stock trading model is more interested
    in minimizing the number of bad trades, and at the end of the day tallies up the
    gains and losses, not really caring which parts of the trading algorithm worked.
    Accuracy is more important in the end.


    Depending upon how you intend to approach a particular problem, look at how two
    different analytical mindsets can affect the predictive analytics process:


    +   1. Minimize prediction error goal: This is a very common use case forÂ machine
    learning. The initial goal is to predict using the appropriate algorithms in order
    to minimize the prediction error. If done incorrectly, an algorithm will ultimately
    fail and it will need to be continually optimized to come up with the new best
    algorithm. If this is performed mechanically without regard to understanding the
    model, this will certainly result in failed outcomes. Certain models, especially
    over optimized ones with many variables, can have a very high prediction rate,
    but be unstable in a variety of ways. If one does not have an'
  merge: -1
  img_proc: true
- pgno: 19
  md: 'understanding of the model, it can be difficult to react to changes in the
    data input.


    +   2. Understanding model goal: This came out of the scientific method and is
    tied closely to the concept of hypothesis testing. This can be done in certain
    kinds of models, such as regression and decision trees, and is more difficult
    in other kinds of models such as Support Vector Machine (SVM) and neural networks.
    In the understanding model paradigm, understanding causation or impact becomes
    more important than optimizing correlations. Typically, understanding models has
    a lower prediction rate, but has the advantage of knowing more about the causations
    of the individual parts of the model, and how they are related. For example, industries
    that rely on understanding human behavior emphasize understanding model goals.
    A limitation to this orientation is that we might tend to discard results that
    are not immediately understood.Â It takes discipline to accept a model with lower
    prediction ability.Â However, you can also gain model stability


    Of course, the previous examples illustrate two disparate approaches. Combination
    models, which use the best of both worlds, should be the ones we should strive
    for.Â Therefore, one goal for a final model is one which:


    +   • Has an acceptable prediction error

    +   • Is stable over time

    +   • Needs a minimum of maintenance

    +   • Is simple enough to understand and explain.


    You will learn later that is this related to Bias/Variance tradeoff.'
