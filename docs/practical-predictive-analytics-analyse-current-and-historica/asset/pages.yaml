- pgno: 175
  md: '# # Variable reduction/variable importance


    Variable reduction techniques allow you to reduce the number of variables that
    you need to specify to a model. We will discuss three different methods to accomplish
    this.


    +   1. Principal Components Analysis (PCA).

    +   2. All subsets Regression.

    +   3. Variable Importance.


    # ## Principal Components Analysis (PCA)


    Principle Components Analysis (PCA) is a variable reduction technique, and can
    also be used to identify variable importance. An interesting benefit of PCA is
    that all of the resulting new component variables will all be uncorrelated with
    each other. Uncorrelated variables are desirable in a predictive model since too
    many correlated variables confound predictions and make it difficult to tell which
    of the independent variables have the most influence. So, if you first perform
    an exploratory analysis of your data and you find that a high number of correlations
    exist, this would be a good opportunity to apply PCA.


    # ## Note


    Models can tolerate some degree of correlated variables. The situations I am speaking
    of are cases in which you have a large number of variables to consider, and just
    end up throwing them into a model, hoping the algorithm will determine the model
    by itself. Most of the time it won’t.


    In many models where you start with a large number of variables, you will find
    that many of them are similar to each other and have the same predictive abilities.'
  merge: -1
  img_proc: true
- pgno: 176
  md: 'A classic example of this is predictors for standardized test scores. While
    some of them are tailored to measure specific things, such as reading or math
    aptitude, many of the predictors have high correlations with each other. The bottom
    line is that using one or two of them in a prediction model may not be all that
    different that using all eight or nine of them.


    PCA has the ability to identify redundancy in the data and can be thought of as
    a way to determine the minimum number of variables that contribute the most to
    the model''s variation. If you can reduce the explained variability of the data
    to just two or three components, that will help you reduce the dimensionality
    of the data. Once you determine the components, you can use them in the following
    ways:


    +   - Replace the original variables with the principal components.

    +   - Use the principal component analysis to simply identify and keep only the
    most useful original variables. In this case, useful can mean variables with the
    highest variance, variables with the highest correlation with the target variable,
    variables that have the most meaning, and so on.


    Therefore, one goal of principal component analysis is to identify a small subset
    of new variables that explain a very large part of the variance of the original
    data.


    # Where is PCA used?


    Principal components are used heavily in the social sciences, marketing, and advertising
    industries. Related to PCA is factor analysis, in which rotating principal components
    results in creating latent variables. Latent variables attempt to describe the
    behavior of the data subjectively, as opposed to principal components, which are
    simply a linear combination of the original variables, and are more or less synthetic
    linear equations.


