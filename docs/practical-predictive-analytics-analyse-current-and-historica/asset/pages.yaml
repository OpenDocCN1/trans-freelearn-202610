- pgno: 154
  md: "# Missing Completely at Random (MCAR)\n\nSome percentage of missing values\
    \ will always occur naturally. When this happens, the missing data is known as\
    \ Missing Completely at Random (MCAR). An example of this is if 2% of a survey\
    \ was not recorded due to a glitch in a survey response system. If this were the\
    \ case, one could assume that it was not related to any other variable in the\
    \ data. MCAR variables are also not correlated with its own data values, that\
    \ is it would also not be related to any other of the non-missing values that\
    \ appear in the data.\n\n# Testing for MCAR\n\nWhen you suspect that your data\
    \ is MCAR, there are various statistical tests can help you determine if MCAR\
    \ may be occurring. One important test is the Little test, which we will now run\
    \ on the test missing value dataset.\n\nFirst, install the BaylorEdPsych package,\
    \ which contains the LittleMCAR test:\n\n```\ntry (require(BaylorEdPsych) || install.packages(\"\
    BaylorEdPsych\", de\nlibrary(BaylorEdPsych)\n```\n\nNow, run the LittleMCAR test:\n\
    \n```\ntest_mcar<-LittleMCAR(all.df)\n```\n\nPrint the missing values found by\
    \ the test. 4% of the data was found to be missing. This makes perfect sense,\
    \ since 5% of the 1,000 males and 3% of the 1,000 females were generated with\
    \ NAs.\n\n```\nprint(test_mcar$amount.missing)\nprint(test_mcar$p.value)\n```\n\
    \n```\n> print(test_mcar$amount.missing)\n     Age Gender Education\nNumber Missing\
    \   80.00   0        0\nPercent Missing  0.04    0        0\n```\n\nPrint the\
    \ value of the test statistic. High values of p imply the data is MCAR, while\
    \ low values imply there is some pattern. At the .05 significance level, it"
  merge: -1
  img_proc: true
- pgno: 155
  md: 'passes the MCAR test (but barely). We also know that we generated our own patterns
    of NA via the simulation, so that certainly contributed to the p-value of .07:


    ```

    `> print(test_mcar$p.value)`

    `[1] 0.06782777`

    ```


    Alternatively, you can use Chi-square and regressions tests to determine if the
    missingness of a variable is related to another variable. If you find that there
    is no statistical significance between the missing variable and any other variable,
    you can consider the variable MCAR. These tests can be valuable, although the
    methods are not fool proof. There are still assumptions that need to be made about
    the process that generated them. As always, the best course is to investigate
    the process that generated the values to see how they were generated.


    # Missing at Random (MAR)


    Missing at random (MAR) implies that the missingness of a value is related to
    another variable in the analysis. It is somewhat of a misnomer, since there is
    nothing random about it.


    So, another question to ask when dealing with missing values is "Is the fact that
    there are missing values in this variable related to the dynamics of any other
    variable?" Again, using our survey analogy as an example, missing values for,
    "What is your Expected Salary?" might occur for certain demographic groups who
    did not answer the question. If you found a statistically significant number of
    missing values at one level of a factor, but not as many within another level,
    that would suggest that the data was missing at random. A variable that is MAR
    can be found by looking at some of the same techniques used previously, that is,
    Chi-square, regression, and Little test, and if differences are found you can
    consider the variable MAR. For our test missing dataset, we might consider this
    MAR since there is a difference in the number of missing values for males and
    females.


    # Not Missing at Random (NMAR)'
  merge: -1
  img_proc: true
- pgno: 156
  md: 'A variable that is not MCAR and not MAR can be considered **Not Missing at
    Random (NMAR)**. That basically means that the missing value is related to the
    values of the missing value itself, or is related to a variable that''s not in
    the model. NMAR values often show up in survey research and clinical research
    where subjects are measured over time. For example, a survey respondent who reported
    severe depression at the beginning of a study may drop out at the end of the study,
    so if they scored high on a depression scale, that would be related to the fact
    they have missing scores at a later date, since they might be more inclined to
    drop out.


    NMAR is the most difficult situation to detect, since a variable may seem to be
    MAR or MCAR and really be NMAR. Missing value analysis is not an exact method,
    and again, that is where understanding the domain, and the underlying methods
    of generating data, is so important.


    # Correcting for missing values


    Although it is always important to understand the source of your missing values,
    how you ultimately handle them depends upon the technique that you use to analyse
    your data sets. For example, classification methods such as decision trees and
    random forests know how to deal with missing values, since they can treat them
    as a separate class, and you can safely leave them in the model. However, if a
    variable has a large amount of missing values, say > 20%, you might want to look
    at imputation techniques, or try to find a better variable that measures the same
    thing.


    # Listwise deletion


    For MCAR, eliminating rows that have missing values is acceptable. In this example
    (from [https://en.wikipedia.org/wiki/Listwise_deletion](https://en.wikipedia.org/wiki/Listwise_deletion)),
    observations 3, 4, and 8 will be removed from the data prior to analysis:'
  merge: -1
  img_proc: true
