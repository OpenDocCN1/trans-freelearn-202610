  md: '# # Exporting data from Spark back into R


    It will often be the case that some of the analysis you wish to perform will not
    be available within SparkR and you will need to extract some of the data from
    Spark objects, and return them to base R.


    For example, we were able to run correlation and covariance functions earlier
    directly on a Spark dataframe, by specifying specific pairs of variables.

    However, we did not generate correlation matrices for the entire dataframe for
    a couple of reasons:


    +   - The capability to do this may not be built into the version of Spark that

    +   you are currently running

    +   - Even if it was available, these kinds of calculation could be very

    +   computationally expensive to perform


    One strategy you may want to use is to use Spark functions to explore basic

    characteristics of the data, and/or utilize specialized packages written for

    Spark (such as MLlib) to perform this.


    For other cases, in which you want to perform more in-depth analysis, simply

    extract a sample from the Spark dataframe, and perform the analysis using

    normal R dataframes. When doing this, it is good practice not to return the

    entire population, but only to return a sample or a subsegment. After all, if

    you extract the entire dataframe from Spark, you do not really need to use

    Spark in the first place, and might as well perform the whole analysis using

    local R!


    We can use the collect() function to perform this, by first filtering by

    sample_bin and then returning the results to a local dataframe named samp.

    Â If you run a str() function on samp, you can see that the first line of the

    output indicates that the object is a normal R dataframe, and NOT a Spark

    dataframe:'
  merge: -1
  img_proc: true
