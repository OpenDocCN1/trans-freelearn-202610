  md: 'separating what you want to predict, with what you are using to predict. This
    is an expression in formula syntax. What you are predicting (the dependent or
    target variable) is usually on the left side of the formula, and the predictors
    (independent variables, features) are on the right side.Â In order to improve
    readability, the independent variable (`weight`) and dependent variable (`height`)
    are specified using $Â notation which specifies the object name, $, and then the
    dataframe column. So womenÂs height is referenced as `women$height` and womenÂs
    weight is referenced as `women$weight`. Alternatively, you can use the `attach`
    command, and then refer to these columns only by specifying the names `height`
    and `weight`. For example, the following code would achieve the same results:


    ```

    attach(women)

    lm_output <- lm(height ~ weight)

    ```


    +   The `<-` operator: Also called the assignment operator. This common statement
    assigns whatever expressions are evaluated on the right side of the assignment
    operator to the object specified on the left side of the operator. This will always
    create or replace a new object that you can further display or manipulate. In
    this case, we will be creating a new object called `lm_output`, which is created
    using the function `lm()`, which creates a linear model based on the formula contained
    within the parentheses.


