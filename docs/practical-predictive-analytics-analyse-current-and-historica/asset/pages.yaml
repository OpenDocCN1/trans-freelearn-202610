  md: '# Plotting the data with the trend lines


    Now that we have the trend coefficients, we will use ggplot to first plot enrollment
    for all of the 24 categories, and then create a second set of plots which adds
    the trend line based upon the linear coefficients we have just calculated.


    Code notes: facet_wrap will order the plots by the value of variable z, which
    was assigned to the coefficient rank. Thus, we can get to see the categories with
    declining enrollment first, ending with the categories having the highest trend
    in enrollment from the period 1999-2012.


    # Note


    I like to assign the variables that I will be changing to standard variable names,
    such as x, y, and z, so that I can remember their usage (for example, variable
    x is always the x variable, and y always the x variable). But you can supply the
    variable names directly in the call to ggplot, or set up your own function to
    do the same thing:


    ```

    library(ggplot2)

    .df <- data.frame(x = x2x$Year.1, y = x2x$Not.Covered.Pct, z = x2

    #use ggplot to layer the different components of the visualization

    .plot <- ggplot(data = .df, aes(x = x, y = y, colour = 1, shape =

    + geom_point()

    + scale_shape_manual(values = seq(0, 24))

    + scale_y_continuous(expand = c(0.1,0))

    + scale_x_continuous(expand = c(0.1, 1))

    + facet_wrap(~z) + xlab("Year.1")

    + ylab("Not.Covered.Pct")

    + labs(colour = "cat", shape = "cat")

    + theme(panel.margin = unit(0.3,"points"), legend.position = "non

    + theme(strip.text.x = element_text(size = 6))

    print(.plot)

    ```'
  merge: -1
  img_proc: true
