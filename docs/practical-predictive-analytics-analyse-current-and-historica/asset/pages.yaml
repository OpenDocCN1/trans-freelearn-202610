  md: '# Modifying the model to include a trend component


    Earlier, we added a linear trend line to the data. If we wanted to incorporate
    a linear trend into the forecast as well, we can substitute A for the second parameter
    (trend parameter), which yields an "AAN" model (Holt''s linear trend). This type
    of method allows exponential smoothing with a trend:


    ```

    fit <- ets(x, model = "AAN")

