  md: '![](img/672c0cf8ba3c000a6529b117ed96945e_246_0.png)


    # Pruning


    Pruning is another way to defend against overfitting. If you visually examine
    a tree and find that you want to stop the growth of branches at a particular point,
    you can prune all branches below that node, so that all of the results under that
    node are collapsed into a single node. That may give you more interpretable results
    for the decision rules displayed at that point.


    Â The rpart has a unique interactive pruning feature using theÂ prp() Â function
    which can help you do this.


    In the previous states example, you might want to rid yourself of all of the nodes
    below node 70 in order to balance the tree and keep it at two levels deep. Balanced
    trees can also be considered a desirable feature:


    ```

    PrunedTree <- prp(y1,type=4, extra=1,snip=TRUE)$obj

    ```


    Click on node 70 and observe the delete node 5 message in the console. After you
    see that message, click quit in the plot:'
  merge: -1
  img_proc: true
