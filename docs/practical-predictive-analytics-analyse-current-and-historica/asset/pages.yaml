  md: '# Imputing categorical variables


    Imputing categorical variables can be trickier than imputation of numeric variables.
    Numeric imputation is based upon random variates, but imputation of categorical
    variables is based upon statistical tests with less power, such as Chi-square,
    and they can be rule-based, so if you end up imputing categorical variables, use
    with caution and run the results past some domain experts to see if it makes sense.
    You can use decision trees or random forests to come up with a prediction path
    for your missing values, and map them to a reasonable prediction value using the
    actual decision rules generated by the tree.'
  merge: -1
  img_proc: true
- pgno: 164
  md: '# # Outliers


    Outliers are values in the data that are outside the range of what is to be expected.
    "What is to be expected?" is of course subjective. Some people will define an
    outlier as anything beyond three standard deviations of a normal distribution,
    or anything beyond 1.5 times the interquartile ranges. This, of course, may be
    good starting points, but there are many examples of real data that defies any
    statistical explanation. These rules of thumb are also highly dependent upon the
    form of the data. What might be considered an outlier for a normal distribution
    would not hold for a lognormal or Poisson distribution.


    In addition to potential single variable outliers, outliers can also exist in
    multivariate form, and are more prevalent as data is examined more closely in
    a high-dimensional space.


    Whenever they appear, outliers should be examined closely since they may be simple
    errors or provide valuable insight. Again, it is best to consult with other collaborators
    when you suspect deviation from the norm.


    # ## Why outliers are important


    Outlier detection is important for a couple of reasons. First, it allows you to
    learn a lot about the extremes in your data. Typical data is usually easy to explain.
    If you have many values of a certain category, it is usually easy to track down
    an explanation. It is the extreme values that can add additional insight beyond
    the typical, or identify faulty processes which can be fixed.


    Additionally, outliers have a profound effect upon some algorithms. In particular,
    regression methods can be biased by the presence of outliers and lose power because
    of them.


    # ## Detecting outliers'
  merge: -1
  img_proc: true
- pgno: 165
  md: 'Graphical methods are best for initially scanning for outliers. Boxplots, histograms,
    and normal probability plots are very useful tools.


    In this code example, sales data is generated with an average sale of $10,000
    and a standard deviation of $3,000. The boxplot shows some data above and below
    the whiskers of the diagram. Additionally, the histogram shows a gap between the
    highest bar and the one just below that. These are clues that potential outliers
    need to be looked at more closely:


    ```

    ```r

    set.seed(4070)

    #generate sales data

    outlier.df <-data.frame(sales=rnorm(100,mean=10000,sd=3000))

    #plot the data, to possible outliers

    par(mfrow=c(1,2))

    boxplot(outlier.df$sales, ylab="sales")

    hist(outlier.df$sales)

    ```

    ```


    ![](img/672c0cf8ba3c000a6529b117ed96945e_165_0.png)


    ![](img/672c0cf8ba3c000a6529b117ed96945e_165_1.png)


    Another way of looking for outliers is to examine the actual quartiles, percentiles,
    or deciles. These measures are useful for breaking the data into equal buckets,
    and then observing the difference among the groupings.'
  merge: -1
  img_proc: true
