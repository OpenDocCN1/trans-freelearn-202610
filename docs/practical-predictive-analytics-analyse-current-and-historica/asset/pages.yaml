  md: 'absence of a feature. If you are using dummy variables, you will need to accommodate
    for as many levels as there are of the dummy variable, minus 1. For example, if
    you have a category designating humidity with only two levels, such as High and
    Low, you only need to create one dummy variable. Let''s say it is called is.humid.
    If the value of humidity is High, is.humid=1. If humidity is Low, is.humid=0.
    However, many predictive analytics functions handle the creation of a dummy variable
    internally, so there is not as much use for coding dummy variables manually as
    there used to be. But you still may want to create flags that designate the levels
    of a categorical variable, which can be useful for plotting, creating customized
    transformations, and for manually creating interactions in a statistical model.
    There are several ways to do this; you can use Dummies package, which will create
    dummy variables automatically. But you can also accomplish this via code by using
    the Model Matrix function.


    This takes the Segment categorical variable , which contains five levels (A-E),
    and expands it into four separate dummy variables:


