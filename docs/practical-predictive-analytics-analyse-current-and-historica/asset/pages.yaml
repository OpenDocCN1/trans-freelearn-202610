- pgno: 314
  md: '# # Cox regression modeling


    KM tests can be satisfactory in many situations, especially during preliminary
    analysis; however, KM tests are non-parametric, and typically are less powerful
    than parametric equivalents. Cox regression extends survival analysis to a parametric
    regression type framework under which it assumes more power. If there are several
    independent variables that need to be incorporated into a model, and some of them
    are continuous, it is advantageous to perform cox proportional hazard modeling
    rather than KM.


    # ## Our first model


    Cox modeling also starts with creating aÂ survival object, as we did in previous
    examples. Other than that, a cox model looks very similar to a standard regression
    model with the response variables specified to the left of the ~ and the independent
    variables specified to the right.


    In cox regression modeling, we use the coxph() function over the surv() function
    to specify the dependent variable. This can be done directly in the formula, or
    by assigning it to a new variable and specifying the new variable to the left
    of the ~.


    Recall that in defining our original survival object we defined Xtenure2 as the
    time variable and Churn as the outcome of interest. In our example, we will specify
    coxph(Surv(Xtenure2, Churn) as the left side of the predictive model.


    Proceed with this next part of the exercise by running the following code, which
    will run a cox regression model that predicts churn using education, gender, customer
    satisfaction, number of service calls, monthly charge, and number of purchases
    last month as independent variables:


    ```

    clearhistory()

    #start CoxModel.1====

    rm(CoxModel.1)

    ```'
  merge: -1
  img_proc: true
- pgno: 315
