- pgno: 361
  md: "# # Evaluating the accuracy of a rule\n\nThree main metrics have been developed\
    \ that measure the importance, or accuracy of an association rule: support, confidence,\
    \ and lift.\n\n# ## Support\n\nSupport measures how frequently the items occur\
    \ together. Imagine having a shopping cart in which there can be a very large\
    \ number of combinations of items. Some items that occur rarely could be excluded\
    \ from the analysis.\nWhen an item occurs frequently you will have more confidence\
    \ in the\nassociation among the items, since it will be a more popular item. Often\
    \ your\nanalysis will be centered around items with high support.\n\n# ## Calculating\
    \ support\n\nCalculating support is simple. You first calculate a proportion by\
    \ counting\nthe number of times that the items in the rule appear in the basket\
    \ divided by\nthe total number of occurences in the itemsets:\n\n# ## Examples\n\
    \n+   * We can see that for the first rule (index #63), {bottled water} and\n\
    +   {tropical fruit} appear together in the same transaction in two\n+   different\
    \ transactions (2 and 3), therefore the support for that rule is 2/10\n+   or\
    \ 20%\n+   \n+   * The last rule shown, rule (index #3) has a support of 0.10,\
    \ since soda\n+   with rolls/buns only appears once in the 10 transactions (1/10)\n\
    \n# ## Confidence\n\nConfidence is the conditional probability that the event\
    \ on the right-hand side"
  merge: -1
  img_proc: true
- pgno: 362
  md: '(rhs or consequence) will occur, given the items on the left-hand has occurred

    (lhs or antecedent). This can be computed manually by counting the number

    of occurrences in the transactions.


    For example, let''s take a closer look at the following rule:


    +   * `{tropical fruit} => {bottled water}`


    +   * We can see that tropical fruit occurs in three separate transaction

    +   itemsets, itemset 2, 3, and 6 and therefore the denominator of the

    +   formula is 3


    +   * Of those three itemsets, bottled water occurs in two of them (itemsets 2

    +   and 3 only, but not 6), so the confidence is 2/3 or 67% and also note that

    +   the confidence for the reverse itemset `{bottled water} => {tropical

    +   fruit}` is higher, since every time bottled water is purchased, tropical

    +   fruit is purchased as well and you can easily verify that by inspecting

    +   and counting the elements by hand


    # ## Lift


    Lift is determined by dividing the confidence just calculated by the

    independent probability of the consequent. Lift can be a better measure than

    either support or confidence, since it incorporates features of both.


    To calculate the lift for the second rule (index #64), we only need to

    determine the unconditional probability of the consequence we just

    calculated. Since `{bottled water}` appears two out of 10 times (20%) as the

    consequence, we divide .67 by .20 to yield 3.4, which is the lift for rule 64.


    # ### Evaluating lift


    The factors when dealing with the evaluation are as follows:


    +   * When evaluating the lift metric, use 1 as a baseline lift measure, since
    a

    +   lift of 1 implies no relationship between the antecedent and the

    +   consequence.


    +   * As the value of lift increases, it will help you target more interesting'
  merge: -1
  img_proc: true
