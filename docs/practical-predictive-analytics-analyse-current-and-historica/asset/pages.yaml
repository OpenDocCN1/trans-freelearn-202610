    \ The resulting objects are both Spark dataframes.\n\nAfter reading the table\
    \ in, print the count of the rows. If you want to see the counts as one result,\
    \ you can use a function such as cat() to print the results on one line:\n\n```\n\
    df = sql(\"select age,\n\t\t\t\tpregnant,\n\t\t\t\tglucose,\n\t\t\t\tpressure,\n\
    \t\t\t\tinsulin,\n\t\t\t\tpedigree,\n\t\t\t\ttriceps,\n\t\t\t\tmass\nfrom global_temp.df_view\"\
    )\n```"
