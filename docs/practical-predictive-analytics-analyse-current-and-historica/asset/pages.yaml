  md: 'Notice that complaint data is in unstructured format. Certain text mining algorithms
    treat unstructured text as a *bag of words*, which means that in analyzing documents,
    one disregards semantics and grammar, and ends up treating each word as its own
    feature or variable.


    An important data structure in text mining is a **term document matrix** (TDM),
    which simply indicates which words appear in each document.


    The `create_matrix()` function will do this for us. However, before we do this,
    we will want to clean the data and impose some restrictions on the creation of
    the term document matrix.


    First, we do not want to include any words, such as *the*, *an*, or *it*, that
    would not add any value to the TDM and would force it to be quite large. These
    are known as **stopwords**. So, we will filter these words using the option `removeStopwords=TRUE`.
    Similarly, we will also eliminate any numbers and punctuation, and only consider
    words that have a minimum length of four. These options are not arbitrary. It
    is up to the text miner to set these options at the optimal value, tempering the
    need to capture the most value from the data, while keeping the size of the data
    at a minimum. Knowledge of the domain is extremely helpful when setting these
    options. For example, had I set `minwordLength=5`, I would have not included words
    such as Paid:


    ```

    # Create the document term matrix

    dtMatrix <-create_matrix(data.samp["""Consumer.complaint.narrative

    minWordLength=4,removeStopwords=TRUE,re

    ```


    The TDM is a data structure that is optimized for text mining. It can be difficult
    to view as the number of documents and words increase. However, in our example,
    we only have 50 documents, and since we have started by taking a sample of the
    data, only have a limited number of words, so we can view a small TDM using the
    `transpose()` function:


    ```

    xx = as.data.frame( t(as.matrix( dtMatrix ) ) )

    head(xx)

    ```


    Notice that even in this small sample, we can see the document contains several
    references to access,Â able, and ability. The column indicates the documents that
    the word occurs in, along with the number of references.'
  merge: -1
  img_proc: true
