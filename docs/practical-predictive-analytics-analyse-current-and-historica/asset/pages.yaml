    sample_bin_min <- as.integer(collect(select(out_sd, min(out_sd$sa

    sample_bin_max <- as.integer(collect(select(out_sd, max(out_sd$sa

    Cutoff <- .20*(sample_bin_max - sample_bin_min)

    Cutoff_low <- sample_bin_min + Cutoff

    Cutoff_high <- sample_bin_max - Cutoff

    rm(df)

    #take 80% of the training samples. These happens to be the ones

    df <- filter(out_sd, out_sd$sample_bin > Cutoff_low & out_sd$samp

    ```'
