- pgno: 480
  md: '# # Exponential moving average


    For a simple moving average (SMA), equal weight is given to all data points, regardless
    of how old they are or how recently they occurred. An exponential moving average
    (EMA) gives more weight to recent data, under the assumption that the future is
    more likely to look like the recent past, rather than the older past.


    The EMA is actually a much simpler calculation. An EMA begins by calculating a
    simple moving average. When it reaches the specified number of lookback periods
    (n), it computes the current value by assigning different weights to the current
    value,and to the previous value.


    This weighting is specified by the smoothing (or ratio) factor. When ratio=1,
    the predicted value is entirely based upon the last time value. For ratios b=0,
    the prediction is based upon the average of the entire lookback period. Therefore,
    the closer the smoothing factor is to 1, the more weight it will give to recent
    data. If you want to give additional weight to older data, decrease the smoothing
    factor toward 0.


    Generally, the formula for an EMA is as follows:


    {Current Data Point - EMA(previous)} x smoothing factor + EMA(previous day)


    To compute the EMA, you can use the `EMA()` function (from the `TTR` package).
    You need to specify a smoothing constant (ratio), as well as a lookback period
    (n).


    # ## Computing the EMA using a function


    The following code will compute an EMA with a ratio of .8, using a lookback period
    of 5. The ratio of .8 will give the most weight to the most recent period, whiel
    still allowing the past to influence the prediction.'
  merge: -1
  img_proc: true
