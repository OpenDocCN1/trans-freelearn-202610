  md: '# Summary


    In this chapter, we learned about what survival analysis is, and how two main
    techniques, Kaplan-Meir and Cox Regression, can be used to explain and predict
    customer churn.


    We also learned how we can generate our own data to test assumptions and test
    the robustness of the models.


    Finally, we included some coding techniques to help us reproduce and save our
    generated code and images.


    In the next chapter, we will not be concerned with a customer leaving, but will
    cover how to keep customers happy by predicting what they will purchase next using
    a technique known as **Market Basket Analysis**.'
