- pgno: 227
  md: 'Regularization in regression is a method by which certain coefficients are
    reduced or even set to 0 in an effort to reduce their influence. While I believe
    it is always the better course to simplify the model by reducing the model to
    the most important variables, regularization can also help to reduce multicollinearity,
    or correlation between the independent variables, along with some other techniques
    that we have discussed such as principal components.


    If you do choose the regularization path, there are many regularization options.
    Some of the regularization methods are ridge regression, LASSO, or LARS.


