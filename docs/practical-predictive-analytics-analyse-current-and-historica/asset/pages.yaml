  md: '# # Checking the time intervals


    Earlier, we mentioned needing to have equally sized time intervals. Additionally,
    before we perform any time series analysis, we need to check for the number of
    non-missing time intervals. So, let''s check the number of enrollment years for
    each category.


    Using theÂ dplyr package, we can use summarize (n()) to count the number of entries
    for each category:


    ```

    # -- summarize and sort by the number of years

    yr.count <- x2 %>% group_by(cat) %>% summarise(n = n()) %>% arrang

    # - we can see that there are 14 years for all of the groups. Th

    print(yr.count, 10)

