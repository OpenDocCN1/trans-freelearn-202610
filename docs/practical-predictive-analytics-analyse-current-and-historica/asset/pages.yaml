    # Predicting the outcome at time 6


    The predictions are in log form. Take the exponent and multiply by the base hazard
    estimate to obtain the predicted value at 6 months:


    ```

    #

    head(pred_validation)

    #

    pred.val <- base[6,1]*exp(pred_validation)

