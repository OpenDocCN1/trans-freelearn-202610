- pgno: 144
  md: 'dataset.


    We would like to standardize both the `Total.Costs` variable and the `Total.Charges`
    variable so that we can compare them more easily.

    Predictive models like to see variables standardized because there is less bias

    towards any particular variable, since all standardized variables have

    approximately the same magnitude.


    The way we do this is by normalizing the means to 0, with a standard

    deviation of 1. Computational means that we will take each value, subtract

    the mean and divide the results by the standard deviation.


    In previous examples, we have explicitly referred to variables using their full

    name (for example, `df$Total.Costs`, which refers to the `Total.Costs`

    variable within the `df` dataframe). If you will be referring to many variables

    within a single dataframe, it sometimes makes sense to issue an `attach`

    statement, which will allow you to use the variable without the dollar sign, if

    your intent is to always refer to the same dataframe.


    Start off by issuing the `attach(df)` command so that we can use these

    shortcut names to apply to the `df` dataframe:


    ```

    ```

    attach(df)

    ```

    ```


    Compute a new standardized variable by subtracting the mean of

    `Total.Costs` variable from each of the `Total.Costs` variable and dividing by

    the standard deviation of `Total.Costs`:


    ```

    ```

    Total.Costs.z <- mean((Total.Costs - mean(Total.Costs)) / sd(Tota

    ```

    ```


    We can also accomplish the same thing by using the `scale()` function, which

    simplifies the calculation a bit:


    ```

    ```

    Total.Costs.z <- scale(df$Total.Costs)

    Total.Charges.z <- scale(df$Total.Charges)

    ```

    ```


    To prove to yourself that the transformation is accurate, print the `mean` and
    `sd`

    of the new variables separately to verify that the mean is 0 and the standard

    deviation is 1. Note that there will be some minor rounding in the results:'
  merge: -1
  img_proc: true
- pgno: 145
  md: '```

    mean(Total.Costs.z)

    sd(Total.Costs.z)

    mean(Total.Charges.z)

    sd(Total.Charges.z)

    ```


    # Changing a variable to another type


    If you examine the preceding `str()` output, you will also see that `Length.of.Stay`
    is currently defined as a factor. This will need to be transformed to a new variable
    by using the `as.integer` function. Transform it to an integer, and code a `str()`
    and `summary()` function to ensure that the transformation is correct:


    ```

    los.int <- as.integer(Length.of.Stay)

    head(los.int)

    summary(los.int)

    ```


    # Appending the variables to the existing dataframe


    We will now take the three new variables that we have created, append the new
    vectors to the existing data frame, and give it a new name:


    ```

    df2 <- cbind(df,Total.Charges.z,Total.Costs.z,los.int)

    str(df2)

    ```


    # Extracting a subset


    Another typical task that you might want to perform is to first extract a particular
    characteristic of the data (such as patient "Expired"), and then perform a similar
    grouping to try to understand where the differences are. In this next example,
    we will also use the `dplyr` package to first extract those patients admitted
    to a hospital who died, and then summarize the `TotalCosts` by each of the major
    diagnostic classifications. Finally, we will order the costs by the most expensive
    diagnoses. As you can see from the results, infectious diseases have the highest
    costs associated with them:


    ```

    df %>% filter(as.character(Patient.Disposition) == "Expired") %>%

    group_by(APR.MDC.Description) %>%

    summarize(total.count=n(),TotalCosts=sum(Total.Costs)) %>% arrange

    ```'
