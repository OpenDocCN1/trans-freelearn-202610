    \ if your data is large and you have no clear definition of target variables.\n\
    \n# Preparing the data for analysis\n\nWe will first perform some data preparation\
    \ in order to normalize the data for k-means. Normalization is pretty much a requirement\
    \ for k-means, since it forces each variable to be scale-independent so that measuring\
    \ distances between the k-means clusters is also scale-independent.\n\nRecall\
    \ that one way to normalize a variable is to first obtain the mean of the variable\
    \ and then divide by its standard deviation.\n\n# Reading the data from the global\
    \ views\n\nWe saved the diabetes dataset as a table and a global view in the previous\
    \ section, so we can now read it back using SQL. We will first read the training\
