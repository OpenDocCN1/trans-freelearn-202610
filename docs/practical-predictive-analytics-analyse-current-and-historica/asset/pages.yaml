  md: '+   - Triceps skin fold thickness (mm)

    +   - 2-hour serum insulin (mu U/ml)

    +   - Body mass index (weight in kg/(height in m)^2)

    +   - Diabetes pedigree function

    +   - Age (years)

    +   - Developed diabetes (yes or no)


    The data is a publicly available dataset. In fact, there are several versions
    of this dataset available. We will use the dataset contained within the `mlbench`
    package, which we will load into the R workspace.'
