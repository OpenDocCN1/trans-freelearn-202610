    # Description of the plots


    Residual versus fitted: The residual versus fitted plot helps with determining
    if there are any patterns in the residuals. Ideally, the pattern (or ideally,
    no pattern) will be random scatter of the residual around a horizontal line.


    If there is any obvious pattern, it is a good idea to revisit some of the bivariate
    correlations, or partial regression plot to try to tie the area back to some of
    the original scatterplots:


    +   * **Normal Q-Q**: This plot will indicate if the residuals are normally distributed.
    It is a good sign if the residuals track the straight line.


    +   * **Scale location**: This plot is used to check for the assumption of equal
    variances. It is also a good sign if this plot shows if residuals are spread'
  merge: -1
  img_proc: true
- pgno: 223
  md: 'equally along the ranges of predictors. This is how you can check the assumption
    of equal variance (homoscedasticity). It''s good if you see a horizontal (red)
    reference line with points randomly equidistant from the line.


    +   • Residuals versus leverage: This plot will help identify which outliers influence
    the regression estimates. Not all outliers will influence the regression, even
    if they are far from the regression line. The outliers outside of the dashed lines
    are the ones which can affect the regression coefficients, and if they are removed
    from the analysis, your results can change.


    # An interactive game à guessing if the residuals are random


    When looking at the diagnostic plots, you are only looking at one possible distribution
    of the residuals. The library `TeachingDemos` has an interesting interactive function
    named `vis.test` which will challenge you to pick out the residuals which were
    generated from the regression which was run, with an alternate set of randomly
    generated residuals from the same regression. Remember, the residuals are supposed
    to be random, so the test essentially randomizes the residuals. If you are able
    to discern your own residuals from the other residuals that it generates, the
    residuals fail the test, and the test concludes (with a p-value of course) that
    your residuals really aren''t random, which will send you back to the modelling
    drawing board.


    To run the test, and play the game, run the following code:


    ```

    ```

    install.packages ("TeachingDemos")

    library (TeachingDemos)

    set.seed(1)

    if (interactive () ) {vis.test (residuals (PainGLM, type="response") ,

    ```

    ```


    After the following pattern appears, click on the pattern that you believe matches
    the normal Q-Q plot in row 1, column 2 previously:'
