  md: 'regression are all considered **General Linear Models (GLM)**. However, in
    the case of logistic regression, the predicted value can only be 0, or 1.

    Fortunately, this corresponds with many use cases, such as whether or not a

    customer will leave, or whether or not a hurricane will appear. If you are

    already familiar with multiple linear regressions, logistic regression should
    be

    easier to understand, since you should already be familiar with concepts such

    as specifying multiple independent variables, and the use of mathematical

    functions, such as log and exp, which can smooth the variables in the model

    and force it to be more linear.


    Logistic regression is also useful, in that it produces an odd ratio. An odd

    ratio is the probability that an event will occur divided by the probability that

    the event will not occur.


    A standard logistic regression is called in R via the `glm()` function.


    # Note


    The call to `glm()` contains a specification for a `link` function.

    The `link` function specifies which kind of model or distribution

    will be used for the linear model. For logistic regression, use

    `family=binomial()` to specify logistic regression.


    The simplest general form of the `glm()` function is:


    ```

    Model.logistic <- glm(Target~v1+v2+v3,data=sourcedata,family=bino

    ```


    # Support vector machines (SVM)


    **Support vector machines (SVM)** can also be used to predict a binary class.

    SVM projects the data into a higher dimensional space so that hyperplanes

    can be used to separate the classifiers. SVMs can be very accurate but

    difficult to interpret and computationally expensive. They are a classic

    example of a low bias algorithm.


    Here is a simple example of using an SVM to predict whether a person is

    satisfied based upon the day of the week and whether or not it is a payday.'
