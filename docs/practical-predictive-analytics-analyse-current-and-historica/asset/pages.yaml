    the success of an analytics project through collaboration and communication. We
    went through the various steps of the CRISP-DM methodology and demonstrated tools
    that you could use to help you progress along these steps.


    We discussed the benefits of sampling and how it could speed up your project.
    SQL was demonstrated to illustrate basic charts and plots, so that you can begin
