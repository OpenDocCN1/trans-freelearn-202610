  md: 'Plots are extremely helpful at showing the residuals, and often are critical
    at diagnosing problems with a model:


    ```

    plot(residuals(PainGLM, type="deviance"))

    ```


    The plot which is output indicates a good example of neatly distributed residuals.
    Along the range of index, the residuals look like they are scattered around 0,
