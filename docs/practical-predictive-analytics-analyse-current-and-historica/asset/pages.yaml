    |CREAM CUPID HEARTS COAT HANGER                |

    |KNITTED UNION FLAG HOT WATER BOTTLE           |

    |RED WOOLLY HOTTIE WHITE HEART.                |

    ```


    Although each line contains a separate grocery item, the items are in a

    uniform format, that is, the number of words describing each item can vary,

    and some words are adjectives and some are nouns. Additionally, the retailer

    may deem certain words to be irrelevant to a particular marketing campaign

    (such as colors, or sizes, which may be standard across all products). This

    type of data can be referred to as semi-structured data, since it incorporates

    certain definitions of structured data (the topic is only groceries, all

    capitalized, products that are pre-known, and so on), as well as some

    elements of unstructured data (varying lengths of products, variations in text

    strings). For optimal results, unstructured data such as text usually needs to

    be scrubbed and cleaned before it is in a form that is suitable for analysis.

    Fortunately, there are several R functions available that help you do that.


    # Removing unneeded character spaces


    We can start by removing leading and trailing blanks from each of the

    product descriptions, since they add no value to the analysis and just take up

    extra space. trimws is a handy function to accomplish this, since it removes

    both leading and trailing spaces. The nchar() function will count the number'
  merge: -1
  img_proc: true
