  - "[PAGE 154]\n\n# Functions\n\nAnother common programming task is to define a function\
    \ or subroutine that can be executed with a single call. Defining and using functions\
    \ can be complicated because of the technical details associated with working\
    \ with variables that exist in different contexts but may have the same name.\
    \ Another problem that arises is that everything in R is an object. Up to this\
    \ point, we have quietly ignored this issue, but it is a technical issue that\
    \ we must now consider. In this section, we will first demonstrate how to define\
    \ a function. We will then discuss the details about how arguments are passed\
    \ to a function. Finally, we discuss the technical details of how R determines\
    \ what a variable name means.\n\nBefore we get into those details, we will provide\
    \ a note about how R keeps track of functions. When we define a variable, R treats\
    \ that variable as an object that can be accessed using the name we assign to\
    \ the variable. Likewise, when you define a new function, it is assigned a variable\
    \ name, and the variable is an object.\n\n# Defining a function\n\nAs previously\
    \ mentioned, when a function is defined, it is assigned to an object and treated\
    \ like any other variable. The format for a function definition is as follows:\n\
    \n```\nfunction (arg1, arg2, ... )\n  code block\n```\n\nThis will create an object,\
    \ and you must assign a variable name to the object. If you print out the value\
    \ of the variable, it will print out the definition of the function. In the following\
    \ example, suppose we need a function used to simulate a random walk in the complex\
    \ plane. The function takes the current position and adds a unit step in a random\
    \ direction:\n\n```\n> updatePosition <- function(currentPos)\n+ {\n+     newDirection\
