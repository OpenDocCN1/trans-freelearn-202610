    result is defined to be an X² distribution. Note that there is one parameter,
    *n*, and it is generally specified by giving the *number of degrees of freedom*,
    which is defined to be *n-1*. The number of degrees of freedom is often referred
    to as *df*.


    For this example, the command to obtain an approximation for the probability density
    function is `dchisq`, and it takes two arguments, x and df. Here, we plot the
    probability'
