  mdcn: "\n\n## Summary\n\n我们介绍了 S4 类的概念并提供了若干示例。S4 类至少分两个阶段构建。第一阶段是定义类的名称和相关的数据组件。然后在单独的步骤中定义与该类相关的方法。\n\
