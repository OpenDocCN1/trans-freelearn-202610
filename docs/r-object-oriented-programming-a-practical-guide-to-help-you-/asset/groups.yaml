  - "[PAGE 252]\n\n# # The Monte-Carlo class\n\nThe final class examined is the MonteCarlo\
    \ class. The MonteCarlo class is used to keep track of the results from multiple\
    \ simulations. Here, we provide a partial list of the code for the class and then\
    \ provide the methods used to generate multiple simulations.\n\nFirst, the code\
    \ required to define the class is given here:\n\n```\n###############################################\n\
    # Create the Monte Carlo class\n#\n# This class is used to make many simulations\n\
    MonteCarlo <- function()\n{\n\n    # Define the slots\n    me = list(\n\n    \
    \    ## First define the parameters for the stochastic model\n        N      \
    \   = 0,\n        T         = 0,\n        x0        = 0,\n        y0        =\
    \ 0,\n        alpha     = 0,\n        beta      = 0,\n        gamma     = 0,\n\
    \        delta     = 0,\n        noiseOne  = 0,\n        noiseTwo  = 0,\n\n  \
    \      ## Define the data to track and the number of trials\n        xData = 0,\n\
    \        yData = 0\n\n    )\n    ## Set the name for the class\n    class(me)\
    \ <- append(class(me),\"MonteCarlo\")\n    return(me)\n}\n\n# Define the method\
    \ used to initialize the data prior to a run.\nprepare <- function(monteCarlo,number)\n\
    {\n    UseMethod(\"prepare\",monteCarlo)\n}\nprepare.MonteCarlo <- function(monteCarlo,number)\n\
    {\n    ## Set the number of trials and initialize the values to\n    ## zeroes.\n\
    \    monteCarlo$xData <- double(number)\n    monteCarlo$yData <- double(number)\n\
    \    return(monteCarlo)\n}\n```"
  - "[PAGE 253]\n\nThe class requires an additional method. The simulations method\
    \ is used to create multiple simulations and record the results:\n\n```\n```r\n\
    simulations <- function(monteCarlo,number,simulation)\n{\n    UseMethod(\"simulations\"\
    ,monteCarlo)\n}\n\nsimulations.monteCarlo <- function(monteCarlo,number,simulation)\n\
    {\n    ## Set the number of trials and initialize the values\n    monteCarlo <-\
    \ prepare(monteCarlo,number)\n    params <- getParams(monteCarlo)  # get the parameters\n\
    \n    ## Perform the simulations\n    lupe <- 0\n    while(lupe < number)\n  \
    \  {\n        lupe <- lupe + 1 # increment the count\n        ## Perform a single\
    \ simulation.\n        simulation <- singleSimulation(\n            simulation,\n\
    \            params[1],params[2],params[3],params[4],params[5],\n            params[6],params[7],params[8],params[9],params[10])\n\
    \        ## Get the last values of the simulation and record them.\n        values\
    \ <- getFinalValues(simulation)\n        monteCarlo <- setValue(monteCarlo,values[1],values[2],lupe)\n\
    \    }\n\n    return(monteCarlo)\n}\n```\n```"
