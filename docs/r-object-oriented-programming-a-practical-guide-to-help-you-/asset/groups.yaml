    \n我们选择 initialize 方法是因为一个常见任务是构建构造函数链，为每个构造函数关联的类初始化数据。我们尚未创建任何 initialize 方法，从基类\
    \ Ant 开始：\n\n```r\nsetMethod(f=\"initialize\",\n         signature=\"Ant\",\n\
