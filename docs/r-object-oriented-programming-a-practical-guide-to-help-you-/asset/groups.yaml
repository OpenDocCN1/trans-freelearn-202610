    ## Chapter 2. Organizing Data


    In this chapter, we will explore the primary data structures that are used to
    organize data. Some of the details about accessing information within data structures
    will be discussed, and some of the ways to apply different operations to parts
    of the data within a data structure will be discussed too. There are roughly three
    parts to this chapter:


    - **Basic data structures:** This section gives you information on using vectors,
    lists, data frames, tables, matrices, and time series

    - **Accessing and managing memory:** This section gives you an overview of the
    basic ways to gain access and censor specific elements

    - **Operations on data structures:** This section gives you an overview of the
    operations and methods used to apply operations within the different kinds of
    data structures


    ### Basic data structures


    The basic data structures used to organize data within the R environment include
    vectors, lists, data frames, tables, and matrices. Here, we provide details for
    each of these data structures and demonstrate how to create them. This chapter
    does not include information about how to read data from a file, and the focus
    is on the data structures themselves. More information about reading from a file
    can be found in [Chapter 3](#), *Saving Data and Printing Results*.


    ### Vectors


    The default data structure in R is the vector. For example, if you define a variable
    as a single number, R will treat it as a vector of length one:


    ```r

    > a <- 5

    > a[1]

    [1] 5

    ```


    Vectors represent a convenient and straightforward way to store a long list of
    numbers. Please see [Chapter 1](#), *Data Types*, to see more examples of creating
    vectors. One useful and common way to define a vector is to use the c command.
    The c command concatenates a set of arguments to form a single vector:


    ```r

    > v <- c(1,3,5,7,-10)

    > v

    [1]    1   3   5   7 -10

    > v[4]

    [1] 7

    > v[2] <- v[1]-v[5]

    > v

    [1]    1  11   5   7 -10

    ```


    Two other methods to generate vectors make use of the : notation and the seq command.
    The : notation is used to create a list of sequentially numbered values for given
    start and end values. The seq command does the same thing, but it provides more
    options to determine the increment between values in the vector:


    ```r

    > 1:5

    [1] 1 2 3 4 5

    > 10:14

    [1] 10 11 12 13 14

    > a <- 3:7

    > a

    [1] 3 4 5 6 7

    > b <- seq(3,5)

    > b

    [1] 3 4 5

    > b <- seq(3,10,by=3)

    > b

    [1] 3 6 9

    ```


    ### Lists


    Another important type is the list. Lists are flexible and are an unstructured
    way of organizing information. A list can be thought of as a collection of named
    objects. A list is created using the `list` command, and a variable can be tested
    or coerced using the `is.list` and `as.list` commands. A component within a list
    is accessed using the `$` character to denote which object within the list to
    use. As an example, suppose that we want to create a list to keep track of the
