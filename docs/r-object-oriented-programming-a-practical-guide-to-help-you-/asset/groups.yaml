    \ `dpois` 命令相同。下面的示例与上一节的示例对应，绘制了参数为 10.0 的泊松分布的累积分布函数：\n\n```r\n> x <- 0:20\n\
    > cdf <- ppois(x,10.0)\n> barplot(cdf,names.arg=x)\n```\n\n连续随机变量的累积分布函数的定义方式与离散随机变量相同。唯一的区别是，我们使用积分而不是求和，如下所示：\n\
    \n![](img/18eeabe9ab8c81c5a3f4040db5906c67_113_2.png)\n\n这个定义得到的结果与之前相同，随机变量介于两个数之间的概率可以通过以下等式确定：\n\
    \n![](img/18eeabe9ab8c81c5a3f4040db5906c67_113_3.png)\n\n以下示例比较了两个 $X^2$ 分布的累积分布函数，其中第一个分布的自由度为\
    \ 30，第二个分布的自由度为 35：\n\n```r\n> x <- seq(0.0,100.0,by=0.1)\n> cdf <- pchisq(x,df=30)\n\
    > plot(x,cdf,main=\"Chi Squared Dist.\",xlab='x',ylab='p',col=2,\n+      type=\"\
    l\")\n> cdfTwo <- pchisq(x,df=35)\n> points(x,cdfTwo,col=3,type=\"l\")\n```\n\n\
    ## 逆累积分布函数\n\n累积分布函数通常用于计算概率，但在其他情况下，目标是在给定概率的情况下找到一系列值。在这种情况下，可以使用逆累积分布函数来确定与给定概率对应的随机变量值。其思想是，给定概率后，你需要求解表达式中的\
    \ $a$ 值：\n\n$p = p(x \\leq a) = F(a)$\n\n例如，假设我们有一个参数为 10.0 的泊松随机变量，希望找到 $a$ 的值，使得随机变量小于\
    \ $a$ 的概率为 0.5。使用 `qpois` 命令，我们可以确定该值：\n\n```r\n> a <- qpois(0.5,10.0)\n> a\n\
    [1] 10\n```\n\n这一结果表明，参数为 10.0 的泊松随机变量小于 10.0 的概率为 0.5，换句话说，中位数为 10.0。由于这也是该随机变量的均值，我们可以看到该分布不存在偏斜。\n\
    \n现在我们对自由度为 30 的 $X^2$ 分布执行同样的操作。`qchisq` 命令可用于确定该分布的中位数：\n\n```r\n> a <- qchisq(0.5,df=30)\n\
    > a\n[1] 29.33603\n```\n\n在这种情况下，我们看到中位数小于均值（即 30），因此自由度为 30 的 $X^2$ 分布向左偏斜，因为中位数位于均值的左侧。\n\
    \n## 生成伪随机数\n\n模拟中的一个常见任务是生成服从给定分布的随机数。我们将探讨这个重要主题，但关于随机数生成，有必要先说明几点。首先，也是最重要的，尽管名称如此，这些数字并不是随机的，因为它们是由确定性算法生成的。其次，在调试和比较用于模拟随机过程的代码时，能够以可重复的方式生成数字以确保结果一致是非常重要的。\n\
    \n在讨论生成随机数之前，我们先提供一些关于 R 如何生成随机数的最小背景信息。这是一个复杂的主题，你可以使用 `help(RNG)` 命令找到更多细节。需要注意的一点是，`.Random.seed`\
    \ 变量保存当前种子的值，但在你显式设置它或调用需要生成随机数的命令之前，它都是未定义的。你可以直接设置该变量，但最好使用 `set.seed` 命令来更改它。此外，用于生成随机数的算法可以通过\
    \ `RNGkind` 命令设置或获取。请注意，如果你在修改既有代码时需要保持结果的可重复性，`save` 命令可以方便地保存种子。\n\n随机数生成可能是一个令人生畏的话题，但我们主要关注如何根据给定分布生成随机数。与之前一样，我们首先考察一个离散分布：参数为\
    \ 10.0 的泊松分布。然后我们考察一个自由度为 30 的 $X^2$ 分布。在每种情况下，我们生成一百个随机数并创建结果的直方图。\n\n首先我们考察离散分布。可以使用\
    \ `rpois` 命令生成这些数字。它接受两个参数：要近似的点数和与分布相关的参数：\n\n```r\n> numbers <- rpois(100,10.0)\n\
    > hist(numbers,main=\"100 Samples of a Poisson Dist.\",xlab=\"x\")\n```\n\n同样，也可以对\
    \ $X^2$ 分布进行抽样，并使用直方图绘制结果：\n\n```r\n> numbers <- rchisq(100,df=30)\n> hist(numbers,main=\"\
    100 Samples from a Chi-Squared Dist.\",xlab=\"x\")\n```\n\n## 抽样\n\n我们将讨论的最后一个主题是抽样。这也可以是一个复杂的话题，它常用于自助法（bootstrapping）以及各种其他技术中。由于其普遍性，我们将其作为单独一节进行介绍。\n\
    \n本节唯一关注的是 `sample` 命令。对单个命令给予如此关注可能看起来很奇怪，但抽样是一个复杂的话题，与其相关的观点比统计学家还要多。`sample`\
    \ 命令至少需要一个参数，即一个向量或一个数字，它返回一组随机选择的值。该命令的选项允许你指定抽样次数、是否使用放回抽样，以及如果你不想使用均匀质量函数，还可以指定一个概率分布。\n\
    \n`sample` 函数的行为取决于你传入的是向量还是数字。如果你向它传入一个数字（即长度为 1 的向量），它将从小于或等于该数字的正整数集合中进行抽样：\n\
    \n```r\n> sample(3)\n[1] 3 2 1\n> sample(5)\n[1] 2 3 1 4 5\n> sample(5.6)\n[1]\
    \ 5 1 4 3 2\n```\n\n如果你传入一个长度大于 1 的向量，它将从向量中的元素进行抽样：\n\n```r\n> x <- c(1,3,5,7)\n\
    > sample(x)\n[1] 7 1 5 3\n```\n\n如果你不指定抽样次数，它将使用传入的对象数量。`size` 参数允许你指定不同的抽样次数：\n\
    \n```r\n> x <- c(1,3,5,7)\n> sample(x,size=2)\n[1] 1 7\n> sample(x,size=3)\n[1]\
    \ 1 3 5\n> sample(x,size=8)\nError in sample.int(length(x), size, replace, prob)\
    \ :\n    cannot take a sample larger than the population when 'replace = FALSE'\n\
    ```\n\n在前面的示例中，抽样次数大于可用元素的数量。为了避免错误，你必须指定使用放回抽样：\n\n```r\n> x <- c(1,3,5,7)\n\
    > sample(x,size=8,replace=TRUE)\n[1] 3 5 5 5 3 7 5 1\n```\n\n在前面的示例中，样本是通过默认算法得到的。默认使用均匀概率质量函数，这意味着每个元素具有相同的\n"
