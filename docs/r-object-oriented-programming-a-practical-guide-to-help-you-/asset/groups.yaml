  - '[PAGE 115]


    # Inverse cumulative distribution functions


    The cumulative distribution function is often used to calculate probabilities,
    but in other circumstances the goal is to find a range of values given the probability.
    In this case, the inverse cumulative distribution function can be used to determine
    a value of the random variable that corresponds to a given probability. The idea
    is that given the probability, you want to solve for the value of $a$ in the expression:


    $p = p(x \leq a) = F(a)$


    For example, suppose that we have a Poisson random variable with parameter 10.0
    and wish to find the value of $a$ for which the probability of the random variable
    is less than $a$ is 0.5. Using the qpois command, we can determine the value:


    ```

    ```r

    > a <- qpois(0.5,10.0)

    > a

    [1] 10

    ```

    ```


    This result indicates that the probability that a Poisson random variable with
    parameter 10.0 is less than 10.0 is 0.5, or put another way the median is 10.0.
    Since this is also the mean of the random variable, we can see that there is no
    skew associated with the distribution.


    We now do the same for the $X^2$ distribution with 30 degrees of freedom. The
    qchisq command can be used to determine the median for this distribution:


    ```

    ```r

    > a <- qchisq(0.5,df=30)

    > a

    [1] 29.33603

    ```

    ```


    In this case, we see that the median is less than the mean, which is 30, so the
    $X^2$ distribution with 30 degrees of freedom is skewed to the left since the
    median is to the left of the mean.'
  - '[PAGE 116]


    # Generating pseudorandom numbers


    A common task in simulations is to generate random numbers that follow a given
    distribution. We explore this important topic, but it is important to make a few
    notes about Random Number Generation. First, and foremost, despite the nomenclature,
    the numbers are not random because they are generated using a deterministic algorithm.
    Secondly, when debugging and comparing code used to simulate a stochastic process,
    it is important to be able to generate numbers in a repeatable way to ensure that
    the results are consistent.


    Before discussing generating random numbers, we provide some minimal background
    information about how R generates random numbers. This is a complex topic, and
    you can find more details using the `help(RNG)` command. One thing to note is
    that the `.Random.seed` variable has the value of the current seed, but it is
    not defined until you do so explicitly or a command is called that requires that
    a random number be generated. The variable can be set directly, but it is better
    to change it using the `set.seed` command. Also, the algorithm that is used to
    generate random numbers can be set or obtained using the RNGkind command. Note
    that the save command can be used as a convenient way to save the seed if repeatability
    of your results is important as you make changes to established code.


    Random Number Generation can be a daunting subject, but we primarily focus on
    how to generate random numbers according to a given distribution. As before, we
    first examine a discrete distribution; the Poisson distribution with parameter
    10.0. We then examine an X² distribution with 30 degrees of freedom. In each case,
    we generate one hundred random numbers and create a histogram of the results.


    First we examine the discrete distribution. The `rpois` command can be used to
    generate the number. It takes two parameters, the number of points to approximate
    and the parameter associated with the distribution:


    ```

    ```r

    > numbers <- rpois(100,10.0)

    > hist(numbers,main="100 Samples of a Poisson Dist.",xlab="x")

    ```

    ```


    Likewise, a X² distribution can also be sampled, and the results are plotted using
    a histogram:


    ```

    ```r

    > numbers <- rchisq(100,df=30)

    > hist(numbers,main="100 Samples from a Chi-Squared Dist.",xlab="x")

    ```

    ```'
