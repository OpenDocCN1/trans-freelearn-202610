    \ can be used to append data to existing objects. These commands can be used on\
    \ vectors, matrices, arrays, and they are extended to also act on data frames.\
    \ The following examples use data frames, as that is a common operation. You should\
    \ be careful and try the commands on arrays to make sure that the operation behaves\
    \ in the way you expect.\n\nThe `cbind` command is used to combine the columns\
    \ of the data given as arguments:\n\n```\n```r\n> d <- data.frame(one=c(1,2,3),two=as.factor(c(\"\
    one\",\"two\",\"three\")))\n> e <- c(\"ein\",\"zwei\",\"drei\")\n> newDataFrame\
    \ <- cbind(d,third=e)\n> newDataFrame\n  one   two third\n1   1   one   ein\n\
    2   2   two  zwei\n3   3 three  drei\n> newDataFrame$third\n[1] ein zwei drei\n\
    Levels: drei ein zwei\n```\n```\n\nIf the arguments to the `cbind` command are\
    \ two data frames (or two arrays), then the command combines all of the columns\
    \ from all of the data frames (arrays):\n\n```\n```r\n> d <- data.frame(one=c(1,2,3),two=as.factor(c(\"\
    one\",\"two\",\"three\")))\n> e <- data.frame(three=c(4,5,6),four=as.factor(c(\"\
    vier\",\"funf\",\"sechs\")))\n> newDataFrame <- cbind(d,e)\n> newDataFrame\n \
    \ one   two three  four\n1   1   one     4  vier\n2   2   two     5  funf\n3 \
    \  3 three     6 sechs\n```\n```\n\nThe `rbind` command concatenates the rows\
    \ of the objects passed to it. The command uses the names of the columns to determine\
    \ how to append the data. The number and names of the columns must be identical:\n\
    \n```\n```r\n> d <- data.frame(one=c(1,2,3),two=as.factor(c(\"one\",\"two\",\"\
    three\")))\n> e <- data.frame(one=c(4,5,6),two=as.factor(c(\"vier\",\"funf\",\"\
    sechs\")))\n> newDataFrame <- rbind(d,e)\n> newDataFrame\n  one   two\n1   1 \
    \  one\n2   2   two\n3   3 three\n4   4  vier\n5   5  funf\n6   6 sechs\n```\n\
    ```"
