  mdcn: "\n\n# 摘要\n\n在本章中，我们考察了可用于组织数据的基本数据结构。这些数据结构包括向量、列表、数据框、表格和数组。我们研究了使用 rbind\
    \ 和 cbind 命令管理数据结构的一些方法。最后，我们考察了在数据结构内对数据执行计算的一些方法，并研究了可将命令应用于数据结构中数据各部分的多种函数。\n\
    \n在下一章中，我们将在此基础上进一步探讨如何从数据文件中获取信息并将其载入各种数据结构。我们还将研究可用的方法，以生成格式化输出，从而显示数据计算的结果。\n\
    \n## 第 3 章 保存数据与打印结果\n\n本章将广泛介绍将信息输入 R 环境以及从 R 环境输出信息的方法。虽然有许多包可用且与此重要功能相关，但我们将把重点放在一部分基础的内置函数上。本章分为以下五个部分：\n\
    \n- **文件和目录信息：** 本节简要介绍 R 环境中文件和目录的组织方式。\n- **输入：** 本节概述可用于将数据导入 R 环境的方法。\n- **输出：**\
    \ 本节概述可用于将数据从 R 环境导出的方法。\n- **原始输入/输出：** 本节概述可用于以预定义格式写入二进制或字符数据的方法。\n- **网络选项：**\
    \ 本节简要介绍与创建和操作套接字相关的方法。\n\n## 输入数据\n\n在讨论了与目录和文件相关的概念之后，我们现在可以讨论如何读取数据。这里，我们将概述从文件中获取信息的不同方法。我们首先简要介绍如何从命令行输入数据，然后举例说明如何读取文本文件（表格形式）、csv\
    \ 文件和固定宽度文件。最后，我们将讨论从二进制文件读取数据的更原始的方法。\n\n需要注意的是，我们将依赖于[第 1 章](#)（数据类型）和[第 2 章](#)（组织数据）中讨论的主题。我假设你已经熟悉[第\
    \ 1 章](#)（数据类型）中给出的各种数据类型，以及[第 2 章](#)（组织数据）中讨论的数据结构。在本章中，我们将探讨将数据读取到 R 中的少数几种方法。目前有大量可用的库，能够读取多种格式的数据，如\
    \ JSON、XML、SAS、Excel 及其他文件格式。在基础 R 发行版中也有更多选项。要查看更多选项，请键入 `read` 并按 *TAB* 键（在字母\
    \ *read* 之后不要有空格）以查看其他选项的部分列表。\n\npine, 34.8\noak, 25.3\n\n第一列是字符数据，第二列是数值数据。每行中的信息以逗号分隔。scan\
    \ 命令默认假定信息使用空白（空格和制表符）分隔，因此在这种情况下，我们必须指定文件中使用逗号作为分隔符。在以下示例中，读取文件并通过 `what` 参数指定格式：\n\
    \n```\n> x <- scan(\"trees.csv\",what=list(\"character\",\"double\"),sep=\",\"\
    )\nRead 5 records\n> x\n[[1]]\n[1] \"pine\" \"pine\" \"oak\" \"pine\" \"oak\"\n\
    \n[[2]]\n[1] \"28.8\" \"27.3\" \"45.8\" \"34.8\" \"25.3\"\n```\n\n另一种输入数据的方法是使用\
    \ `data.entry` 命令。如果系统上存在图形界面，该命令将打开一个图形界面。具体细节可能因操作系统和你所使用的图形界面而异。\n\n## CSV\
    \ 文件\n\n`read.table` 命令提供了一种从已知结构中读取数据文件的通用方法。一种常见的文件结构是值之间以逗号分隔的文件，即 csv 文件。读取\
    \ csv 文件的命令是 `read.csv`。该命令还有一个替代版本 `read.csv2`，其默认参数有所不同。区别在于，`read.csv2` 的默认值被定义为允许简单读取以下文件：小数分隔符为逗号，值之间以分号分隔，这种格式在一些欧洲国家更为常见。\n\
    \n`read.csv` 命令与 `read.table` 命令类似。主要区别在于前者返回的结果是数据框，并且能够识别更多类型的列数据类型。\n\n在前面的示例中，`trialTable.csv`\
    \ 文件被读取到工作区中。同样的文件也可以使用 `read.csv` 命令读取。`trialTable.csv` 文件没有表头，数字之间用空格分隔：\n\n\
    ```\n```r\n> trial <- read.csv(\"trialTable.csv\",header=FALSE,sep=' ')\n> trial\n\
    \   V1 V2 V3\n1  1  2  3\n2  3  5  6\n> typeof(trial)\n[1] \"list\"\n```\n```\n\
    \n在下一个示例中，我们有一个数据文件，其中每行具有相同的列数，数据字段以逗号分隔。该文件下载自 [http://www.bea.gov/](http://www.bea.gov/)。该文件的前六行用于以人类可读的形式标识有关数据的信息，但\
    \ `read.csv` 函数应忽略这些信息。另外需要注意，第七行是表头，其中包含用于定义列标签的信息。最后要注意的是，数字以逗号分隔。如果我们想使用 `read.csv`\
    \ 命令读取该文件，必须指定所有这些细节。第二个文件 `inventories.csv` 可以使用 `read.csv` 命令读取，如下所示：\n\n```\n\
    ```r\ninventories <- read.csv(\"inventories.csv\", + skip=6,header=TRUE,sep=\"\
    ,\")\n> typeof(inventories)\n[1] \"list\"\n> names(inventories)\n[1] \"Line\"\
    \     \"X\"        \"X1994.1\" \"X1994.2\" \"X1994.3\" \"X1994.4\" \"X1995.1\"\
    \n[8] \"X1995.2\"  \"X1995.3\"  \"X1995.4\"  \"X1996.1\"  \"X1996.2\"  \"X1996.3\"\
    \  \"X1996.4\"\n```\n```\n\n## 打印结果与保存数据\n\n我们将探讨可用的选项，以获取存储在 R 环境中的信息，并将这些信息表示为人类可读或机器可读的形式。我们首先简要讨论如何在\
    \ R 环境中保存工作区。接下来，我们将讨论可用于将信息打印到屏幕或文件的各种命令。最后，我们将讨论可用于基本文件操作的原始命令。\n\n## 保存工作区\n\
    \n有两个命令可用来保存当前工作区中的信息。第一个是 save 命令，它允许你保存特定的变量。第二个是 `save.image` 命令，它允许你保存工作区中的所有变量。\n\
    \nsave 命令需要一组要保存的变量，以及一个用于保存这些变量的文件名。虽然有很多选项，但在最基本的形式中，你只需保存当前工作区中的特定变量。在这里，我们首先使用\
    \ `ls` 命令列出当前工作区中的变量，然后使用 save 命令保存 `inventories` 和 `trees` 这两个变量：\n\n```\n```r\n\
    > dir()\n[1] \"diameters.csv\"  \"inventories.csv\" \"network.csv\" \"trees.csv\"\
    \n[5] \"trialFWF.dat\"   \"trialTable.csv\"\n> ls()\n[1] \"a\"          \"d\"\
    \          \"f\"          \"inventories\" \"trees\"\n[6] \"trial\"      \"x\"\
    \          \"y\"\n> save(inventories,trees,file=\"theInventories.RData\")\n> dir()\n\
    [1] \"diameters.csv\"        \"inventories.csv\"       \"network.csv\"\n[4] \"\
    theInventories.RData\" \"trees.csv\"              \"trialFWF.dat\"\n[7] \"trialTable.csv\"\
    \n```\n```\n\n`save.image` 命令只需要一个参数：用于保存信息的文件名：\n\n```\n```r\n> dir()\n[1] \"\
    diameters.csv\"        \"inventories.csv\"       \"network.csv\"\n[4] \"theInventories.RData\"\
    \ \"trees.csv\"              \"trialFWF.dat\"\n[7] \"trialTable.csv\"\n> save.image(\"\
    wholeShebang.RData\")\n> dir()\n[1] \"diameters.csv\"        \"inventories.csv\"\
    \       \"network.csv\"\n[4] \"theInventories.RData\" \"trees.csv\"          \
    \    \"trialFWF.dat\"\n[7] \"trialTable.csv\"       \"wholeShebang.RData\"\n```\n\
    ```\n\n如果你启动一个新的 R 会话，可以使用 `load` 命令读取通过 save 或 `save.image` 命令保存的信息：\n\n```\n\
    ```r\n> ls()\ncharacter(0)\n> dir()\n[1] \"diameters.csv\"        \"inventories.csv\"\
    \       \"network.csv\"\n[4] \"theInventories.RData\" \"trees.csv\"          \
    \    \"trialFWF.dat\"\n[7] \"trialTable.csv\"       \"wholeShebang.RData\"\n>\
    \ load(\"theInventories.RData\")\n> ls()\n[1] \"inventories\" \"trees\"\n```\n\
    ```\n\n"
