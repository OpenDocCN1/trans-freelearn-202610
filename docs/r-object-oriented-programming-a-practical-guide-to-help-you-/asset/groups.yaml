    # Chapter 10. Case Study – Course Grades


    This chapter is our first case study. We bring together the ideas from the previous
    chapters and provide an extended example. Some new ideas are introduced, and they
    should make more sense in the context of a full example.


    This chapter is roughly divided into four parts:


    +   - **The Course class**: This section gives you an overview of the S4 class
    that will contain a list of grades for a course. The grades are kept in a list
    with each graded task as a separate object.

    +   - **The assignment classes**: This section gives you an overview of the S4
    classes used to keep the grades for a specific graded task. This class has two
    derived classes. One derived class is to keep track of grades that have a numeric
    score, and the other is to keep track of grades that consist of letters.

    +   - **Extending existing functions**: This section includes a brief discussion
    of how existing functions can be extended to react in an appropriate way to an
    object that is one of the assignment classes. We focus on the summary, plot, and
    show commands.

    +   - **Extending operations**: This section includes a discussion on how to extend
    arithmetic and access functions by building on existing methods.'
  - '[PAGE 213]


    # # Overview


    All the previous chapters focus on specific topics, and here we bring together
    a number of different topics to examine an extended example. All of the classes
    examined here are S4 classes. These classes are used to read in a CSV file that
    contains the grades for students in a class. There is one class that defines how
    to read a grade file and how to interpret a column. Another set of classes is
    defined and the classes are used to track the information for a single assignment.
    An object of this class will include all the scores for the assignments of all
    students.


    We first discuss the new Course class, which is used to keep track of all the
    assignments. Next, we discuss the assignment classes that are used to keep track
    of the grades for a single assignment. Once the classes are defined, the details
    on extending the summary, plot, and show commands are given to demonstrate how
    common commands can be extended to react when passed a newly defined object. Finally,
    some basic arithmetic and accessor operators are redefined so that the R system
    will react in an appropriate manner when using familiar operations, such as addition
    or multiplication.


    The Course class includes objects whose type is one of the assignment classes,
    and it seems more natural to define the assignment classes first. The actions
    of the assignment classes are more intricate and include more details, while the
    Course class is relatively straightforward. To keep the introduction to the classes
    more gentle, we’ll first discuss the Course class.'
