  - "[PAGE 90]\n\n# CSV files\n\nThe `read.table` command offers a general way to\
    \ read the data from a file with a known structure. One common file structure\
    \ is a file where the values are separated by commas, or a csv file. The command\
    \ to read a csv file is the `read.csv` command. There is an alternate version\
    \ of the command, `read.csv2`, which has a different set of defaults. The difference\
    \ is that the defaults for `read.csv2` are defined to allow a simple way of reading\
    \ a file in which the delimiter between the decimal values is a comma and the\
    \ values are separated by semicolons, which are more commonly used in some European\
    \ countries.\n\nThe `read.csv` command is similar to the `read.table` command.\
    \ The primary difference is that the result is returned as a data frame, and a\
    \ greater range of data types for the columns are recognized.\n\nIn the preceding\
    \ examples, the `trialTable.csv` file is read into the workspace. The same file\
    \ can be read using the `read.csv` command. The `trialTable.csv` file does not\
