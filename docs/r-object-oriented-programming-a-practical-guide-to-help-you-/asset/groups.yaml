    # # The cat command


    The cat command can be used to take a list of variables, convert them to a text
    form, and concatenate the results. If no file or connector is specified, the result
    is printed to the screen; otherwise, the connector is used to determine how the
    result is handled. Note that there is an additional set of commands, the various
    write commands, but those commands are convenient routines that allow a shorthand
    notation to access the cat commands. These commands are primarily used in scripts:


    ```

    ```r

    > one <- "A"

    > two <- "B"

    > cat(one,two,"\n")

    A B

    ```

    ```


    The cat command allows you to specify a number of options. For example, you can
    specify the separator between variables, labels to be used, or whether or not
    to append to a given file:


    ```

    ```r

    > cat(one,two,"\n",sep=" - ")

    A - B -

    ```

    ```'
