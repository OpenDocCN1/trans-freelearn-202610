  - '[PAGE 183]


    # # Chapter 9. S4 Classes


    This chapter is the third part in our introduction to programming. We examined
    S3 classes in the previous chapter. We will now examine S4 classes. The approach
    associated with S3 classes is more flexible, and the approach associated with
    S4 classes is a more formal and structured definition.


    This chapter is roughly divided into four parts:


    +   - **Class definition:** This section gives you an overview of how a class
    is defined and how the data (slots) associated with the class are specified

    +   - **Class methods:** This section gives you an overview of how methods that
    are associated with a class are defined

    +   - **Inheritance:** This section gives you an overview of how child classes
    that build on the definition of a parent class can be defined

    +   - **Miscellaneous commands:** This section explains four commands that can
    be used to explore a given object or class'
  - '[PAGE 184]


    # Introducing the Ant class


    We defined the idea of control flow structures in [Chapter 7](#), *Basic Programming*,
    and introduced the idea of an S3 class in [Chapter 8](#), *S3 Classes*. We will
    now introduce the idea of S4 classes, which is a more formal way to implement
    classes in R. One of the odd quirks of S4 classes is that you first define the
    class along with its data, and then you define the methods separately.


    As a result of this separation in the way a class is defined, we will first discuss
    the general idea of how to define a class and its data. We will then discuss how
    to add a method to an existing class. Next, we will discuss how inheritance is
    implemented. Finally, we will provide a few notes about other options that do
    not fit nicely in the categories mentioned earlier.


    In the previous chapter, we took an example and then modified it. The approach
    associated with an S4 class is less flexible and requires a bit more forethought
    in terms of how a class is defined. We will take a different approach in this
    chapter and create a complete class from the beginning. In this case, we will
    build on an idea proposed by Cole and Cheshire. The authors proposed a cellular
    automata simulation to mimic how ants move within a colony.


    As part of a simulation, we will assume that we need an Ant class. We will depart
    from the paper and assume that the ants are not homogeneous. We will then assume
    that there are male (drones) and female ants, and the females can be either workers
    or soldiers. We will need an ant base class, which is discussed in the first two
    sections of this chapter as a means to demonstrate how to create an S4 class.
    In the third section, we will define a hierarchy of classes based on the original
    Ant class. This hierarchy includes male and female classes. The worker class will
    then inherit from the female class, and the soldier class will inherit from the
    worker class.'
