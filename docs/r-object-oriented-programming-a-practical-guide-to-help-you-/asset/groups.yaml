  - "[PAGE 236]\n\n# # Redefining existing functions\n\nAs mentioned previously, the\
    \ summary, show, and plot commands are extended to react in an appropriate way\
    \ when passed a NumericGrade or LetterGrade object. Extending these functions\
    \ is done by simply defining a new method for these functions using the setMethod\
    \ command. Each of these commands already exist, so it is not necessary to reserve\
    \ the names using the setGeneric command. That is, we simply define the method\
    \ to associate with the command when passed an object that is a member of the\
    \ NumericGrade or LetterGrade class.\n\nWe extend the summary command in the first\
    \ example. In this case, the function should have a different behavior if the\
    \ object passed to it is NumericGrade versus LetterGrade. For an object that is\
    \ LetterGrade, the summary command retrieves the grades and prints out a frequency\
    \ table for the grades:\n\n```\nsetMethod(f=\"summary\",\n          signature=\"\
    LetterGrade\",\n          definition=function(object,...)\n          {\n     \
    \         # Get the letter grades as factors and return the\n              # frequency\
    \ table.\n              values <- GetLetterGrade(object)\n              return(summary(as.factor(values)))\n\
    \          }\n)\n```\n\nIn this example, the only other kind of assignment that\
    \ can be created is NumericGrade, but in the future, the class may be extended.\
    \ Instead of creating a summary function solely for the NumericGrade class, we\
    \ create a summary function for its base class, Assignment. In this way, an argument\
    \ to the summary command that is derived from the Assignment class will obtain\
    \ the object’s grades, and the grades are assumed to be a numeric vector. The\
    \ summary command can then be invoked on the vector:\n\n```\nsetMethod(f=\"summary\"\
    ,\n          signature=\"Assignment\",\n          definition=function(object,...)\n\
    \          {\n              # Get the grade values and return the five point\n\
    \              # summary.\n              values <- GetValue(object)\n        \
    \      return(summary(values))\n          }\n)\n```\n\nIn the following example,\
    \ the necessary files are read, and the information from the shortList.csv file\
    \ is read. Copies of two different assignments, test1 and project1, are found,\
    \ and a summary for each object is printed:\n\n```\n> source('grades.R')\n> source('ops.R')\n\
    > source('overriding.R')\n```"
  md: "\n## Example – reading grades from a file\n\nA short example is given to demonstrate\
    \ how to read a class file. We assume that a CSV file, called `shortList.csv`,\
    \ is in the current working directory. The first task to accomplish is to execute\
    \ the file that contains the class definitions, `grades.R`. Once the class is\
    \ defined, the filename is set, and the file is read.\n\nFirst, in this example,\
    \ the file with the `shortList.csv` grades is assumed to be the following:\n\n\
    ```\n```csv\nsection,test1,project1,final\n3,75,B+,89\n2,68,B,94\n3,98,B+,110\n\
    2,76,A-,93\n1,96,A+,112\n1,81,B+,91\n2,19,A,70\n2,52,B+,70\n2,88,A,71\n```\n```\n\
    \nThe default value for the `GradeTypes` slot in the Course class is the following:\n\
    \n```\n```r\nGradeTypes = c(\"test\",\"hw\",\"quiz\",\"project\")\n```\n```\n\n\
    Any column in the file whose name starts with one of the strings in the `GradeTypes`\
    \ vector is assumed to be a recognized grade. The `test1`, `test2`, `hw1`, `hw2`,\
    \ `hw3`, `quiz1`, `quiz2`, and `project1` columns are recognized as being a graded\
    \ item. The column whose name is `final` is not in the default vector and is not\
    \ recognized, so the `GradeTypes` slot should be replaced:\n\n```\n```r\n> source('grades.R')\n\
    > dir(pattern='csv$')\n[1] \"math100.csv\" \"shortList.csv\"\n> course <- Course()\n\
    > course <- SetGradeTypes(course,c(\"test\",\"hw\",\"quiz\",\"project\",\n+  \
    \                                \"final\"))\n> course <- SetFileName(course,\"\
    shortList.csv\")\n> course <- ReadGrades(course)\n> course\nAn object of class\
    \ \"Course\"\nSlot \"GradesFile\":\n[1] \"shortList.csv\"\n\nSlot \"GradeTypes\"\
    :\n[1] \"test\"    \"hw\"      \"quiz\"    \"project\" \"final\"\n\nSlot \"Grades\"\
    :\n$test1\nAn object of class \"NumericGrade\"\nSlot \"Value\":\n[1] 75 68 98\
    \ 76 96 81 19 52 88\n\nSlot \"Name\":\n```\n```\n\n```\n[1] \"Test\"\n\nSlot \"\
    Number\":\n[1] 1\n\n$project1\nAn object of class \"LetterGrade\"\nSlot \"Value\"\
    :\n[1] \"B+\" \"B\"  \"B+\" \"A-\" \"A+\" \"B+\" \"A\"  \"B+\" \"A\"\n\nSlot \"\
    Scale\":\n$'A+'\n[1] 98\n\n$A\n[1] 95\n\n$'A-'\n[1] 92\n\n$'B+'\n[1] 88\n\n$B\n\
    [1] 85\n\n$'B-'\n[1] 83\n\n$'C+'\n[1] 78\n\n$C\n[1] 75\n\n$'C-'\n[1] 73\n\n$'D+'\n\
    [1] 68\n\n$D\n[1] 65\n\n$'D-'\n[1] 63\n\n$'F+'\n[1] 58\n\n$F\n[1] 55\n\n$'F-'\n\
    [1] 53\n```\n\n```\n```r\n$'NA'\n[1] 0\n\nSlot \"Name\":\n[1] \"Test\"\n\nSlot\
    \ \"Number\":\n[1] 1\n\n$final\nAn object of class \"NumericGrade\"\nSlot \"Value\"\
    :\n[1] 89  94 110  93 112  91  70  70  71\n\nSlot \"Name\":\n[1] \"Test\"\n\n\
    Slot \"Number\":\n[1] 1\n```\n```\n\n## Defining indexing operations\n\nAn object\
    \ that is a Course class can have many assignment objects in its Grades slot.\
    \ We did not define a special method to get a particular assignment, and no method\
    \ is defined to save an assignment. We examine how to do this is in this section,\
    \ and the discussion revolves around redefining the [ operation.\n\nFirst we redefine\
    \ the [ operation used to get an assignment. The idea is that we want to get a\
    \ copy of an assignment by enclosing the name of the assignment as defined in\
    \ the original file within square braces. To do this, we can redefine the operation.\
    \ In this case, we want to be able to pass any kind of object within the braces,\
    \ which will allow us to also use integers to index by location in the list:\n\
    \n```\nsetMethod(\"[\",\n         signature(x=\"Course\",i=\"ANY\"),\n       \
    \  definition=function(x,i=1)\n         {\n             #print(paste(\"Get grade\
    \ item\",i))\n             return(x@Grades[[i]])\n         }\n)\n```\n\nWe would\
    \ like to also be able to get a grade within an assignment. In this case, we will\
    \ pass two arguments within the braces. The first task is to get the assignment\
    \ using the previous definition and then get the grade within the assignment whose\
    \ index matches the second argument:\n\n```\nsetMethod(\"[\",\n         signature(x=\"\
    Course\",i=\"ANY\",j=\"numeric\"),\n         definition=function(x,i=1,j=1)\n\
    \         {\n             #print(paste(\"course value\",i,j))\n             allGrades\
    \ <- GetValue(x[i])\n             return(allGrades[[j]])\n         }\n)\n```\n\
    \nWe assume that the operations are defined in a file called ops.R. Once these\
    \ methods are read and executed, the [ operation is used in the following example\
    \ to get a copy of test1 or to examine the third grade in test1:\n\n```\n> source('grades.R')\n\
    > source('ops.R')\n> source('overriding.R')\n> course <- Course()\n> course <-\
    \ SetFileName(course,\"shortList.csv\")\n> course <- ReadGrades(course)\n> course['test1']\n\
    [1] Assignment: Test\n[1] (9) Grades:\n[1] 75 68 98 76 96 81 19 52 88\n> course['test1',3]\n\
    [1] 98\n```\n\nThe final topic to examine in this section is the use of the `[`\
    \ operation to set the value of an entry. The approach is similar to the methods\
    \ used to get information given earlier. The only difference is that instead of\
    \ using the setMethod function, we use the setReplace method, and the last argument\
    \ to the function is the value to set the corresponding entry in the appropriate\
    \ object:\n\n```\nsetReplaceMethod(\"[\",\n                 signature(\"NumericGrade\"\
    ),\n                 definition=function(x,i,value)\n                 {\n    \
    \                 #print(paste(\"grade value\",i,value))\n                   \
    \  x@value[i] = value\n                     return(x)\n                 }\n  \
    \               )\n\nsetReplaceMethod(\"[\",\n                 signature(\"Course\"\
    ),\n                 definition=function(x,i,j,value)\n                 {\n  \
    \                   #print(paste(\"course grade\",i,j,value))\n              \
    \       grades <- x@Grades[[i]]\n                     grades[j] <- value\n   \
    \                  x@Grades[i] <- grades\n                     return(x)\n   \
    \              }\n                 )\n```\n\nWith these definitions in place,\
    \ a value within the course for a specific grade can be easily set, as follows:\n\
    \n```\n> source('grades.R')\n> source('ops.R')\n> source('overriding.R')\n>\n\
    > course <- Course()\n> course <- SetFileName(course,\"shortList.csv\")\n> course\
    \ <- ReadGrades(course)\n> print(course['test1'])\n[1] Assignment: Test\n[1] (9)\
    \ Grades:\n[1] 75 68 98 76 96 81 19 52 88\n> print(course['test1',3])\n[1] 98\n\
    >\n> course['test1',3] <- 99.1\n> print(course['test1',3])\n[1] 99.1\n>\n```\n\
    \n## Redefining existing functions\n\nAs mentioned previously, the summary, show,\
    \ and plot commands are extended to react in an appropriate way when passed a\
    \ NumericGrade or LetterGrade object. Extending these functions is done by simply\
    \ defining a new method for these functions using the setMethod command. Each\
    \ of these commands already exist, so it is not necessary to reserve the names\
    \ using the setGeneric command. That is, we simply define the method to associate\
    \ with the command when passed an object that is a member of the NumericGrade\
    \ or LetterGrade class.\n\nWe extend the summary command in the first example.\
    \ In this case, the function should have a different behavior if the object passed\
    \ to it is NumericGrade versus LetterGrade. For an object that is LetterGrade,\
    \ the summary command retrieves the grades and prints out a frequency table for\
    \ the grades:\n\n```\nsetMethod(f=\"summary\",\n          signature=\"LetterGrade\"\
    ,\n          definition=function(object,...)\n          {\n              # Get\
    \ the letter grades as factors and return the\n              # frequency table.\n\
    \              values <- GetLetterGrade(object)\n              return(summary(as.factor(values)))\n\
    \          }\n)\n```\n\nIn this example, the only other kind of assignment that\
    \ can be created is NumericGrade, but in the future, the class may be extended.\
    \ Instead of creating a summary function solely for the NumericGrade class, we\
    \ create a summary function for its base class, Assignment. In this way, an argument\
    \ to the summary command that is derived from the Assignment class will obtain\
    \ the object’s grades, and the grades are assumed to be a numeric vector. The\
    \ summary command can then be invoked on the vector:\n\n```\nsetMethod(f=\"summary\"\
    ,\n          signature=\"Assignment\",\n          definition=function(object,...)\n\
    \          {\n              # Get the grade values and return the five point\n\
    \              # summary.\n              values <- GetValue(object)\n        \
    \      return(summary(values))\n          }\n)\n```\n\nIn the following example,\
    \ the necessary files are read, and the information from the shortList.csv file\
    \ is read. Copies of two different assignments, test1 and project1, are found,\
    \ and a summary for each object is printed:\n\n```\n> source('grades.R')\n> source('ops.R')\n\
    > source('overriding.R')\n```\n"
  mdcn: "\n\n## 示例 – 从文件读取成绩\n\n下面给出一个简短示例，演示如何读取班级文件。我们假设当前工作目录下有一个名为 `shortList.csv`\
    \ 的 CSV 文件。首先要完成的任务是执行包含类定义的文件 `grades.R`。类定义完成后，设置文件名，然后读取文件。\n\n首先，在本示例中，包含\
    \ `shortList.csv` 成绩的文件内容假设如下：\n\n```csv\nsection,test1,project1,final\n3,75,B+,89\n\
    2,68,B,94\n3,98,B+,110\n2,76,A-,93\n1,96,A+,112\n1,81,B+,91\n2,19,A,70\n2,52,B+,70\n\
    2,88,A,71\n```\n\nCourse 类中 `GradeTypes` 槽位的默认值如下：\n\n```r\nGradeTypes = c(\"\
    test\",\"hw\",\"quiz\",\"project\")\n```\n\n文件中任何列名以 `GradeTypes` 向量中某个字符串开头的列，都被视为可识别的成绩项。`test1`、`test2`、`hw1`、`hw2`、`hw3`、`quiz1`、`quiz2`\
    \ 和 `project1` 列被识别为成绩项。列名为 `final` 的列不在默认向量中，因此不会被识别，所以需要替换 `GradeTypes` 槽位：\n\
    \n```r\n> source('grades.R')\n> dir(pattern='csv$')\n[1] \"math100.csv\" \"shortList.csv\"\
    \n> course <- Course()\n> course <- SetGradeTypes(course,c(\"test\",\"hw\",\"\
    quiz\",\"project\",\n+                                  \"final\"))\n> course\
    \ <- SetFileName(course,\"shortList.csv\")\n> course <- ReadGrades(course)\n>\
    \ course\nAn object of class \"Course\"\nSlot \"GradesFile\":\n[1] \"shortList.csv\"\
    \n\nSlot \"GradeTypes\":\n[1] \"test\"    \"hw\"      \"quiz\"    \"project\"\
    \ \"final\"\n\nSlot \"Grades\":\n$test1\nAn object of class \"NumericGrade\"\n\
    Slot \"Value\":\n[1] 75 68 98 76 96 81 19 52 88\n\nSlot \"Name\":\n[1] \"Test\"\
    \n\nSlot \"Number\":\n[1] 1\n\n$project1\nAn object of class \"LetterGrade\"\n\
    Slot \"Value\":\n[1] \"B+\" \"B\"  \"B+\" \"A-\" \"A+\" \"B+\" \"A\"  \"B+\" \"\
    A\"\n\nSlot \"Scale\":\n$'A+'\n[1] 98\n\n$A\n[1] 95\n\n$'A-'\n[1] 92\n\n$'B+'\n\
    [1] 88\n\n$B\n[1] 85\n\n$'B-'\n[1] 83\n\n$'C+'\n[1] 78\n\n$C\n[1] 75\n\n$'C-'\n\
    [1] 73\n\n$'D+'\n[1] 68\n\n$D\n[1] 65\n\n$'D-'\n[1] 63\n\n$'F+'\n[1] 58\n\n$F\n\
    [1] 55\n\n$'F-'\n[1] 53\n\n$'NA'\n[1] 0\n\nSlot \"Name\":\n[1] \"Test\"\n\nSlot\
    \ \"Number\":\n[1] 1\n\n$final\nAn object of class \"NumericGrade\"\nSlot \"Value\"\
    :\n[1] 89  94 110  93 112  91  70  70  71\n\nSlot \"Name\":\n[1] \"Test\"\n\n\
    Slot \"Number\":\n[1] 1\n```\n\n## 定义索引操作\n\nCourse 类的对象在其 Grades 槽位中可以包含许多作业对象。我们没有定义专门的方法来获取某个特定作业，也没有定义保存作业的方法。本节我们将研究如何实现这一点，讨论围绕重新定义\
    \ `[` 操作展开。\n\n首先，我们重新定义用于获取作业的 `[` 操作。思路是：我们希望通过在方括号内写入原始文件中定义的作业名称来获取该作业的副本。为此，我们可以重新定义该操作。在这种情况下，我们希望能够在方括号内传递任意类型的对象，这样我们也可以使用整数按列表中的位置进行索引：\n\
    \n```r\nsetMethod(\"[\",\n         signature(x=\"Course\",i=\"ANY\"),\n      \
    \   definition=function(x,i=1)\n         {\n             #print(paste(\"Get grade\
    \ item\",i))\n             return(x@Grades[[i]])\n         }\n)\n```\n\n我们还希望能够获取某个作业内的单个成绩。在这种情况下，我们将在方括号内传递两个参数。第一个任务是使用前面的定义获取作业，然后获取该作业中索引与第二个参数匹配的成绩：\n\
    \n```r\nsetMethod(\"[\",\n         signature(x=\"Course\",i=\"ANY\",j=\"numeric\"\
    ),\n         definition=function(x,i=1,j=1)\n         {\n             #print(paste(\"\
    course value\",i,j))\n             allGrades <- GetValue(x[i])\n             return(allGrades[[j]])\n\
    \         }\n)\n```\n\n我们假设这些操作定义在名为 `ops.R` 的文件中。一旦这些方法被读取并执行，就可以在下面的示例中使用 `[`\
    \ 操作来获取 `test1` 的副本，或查看 `test1` 中的第三个成绩：\n\n```r\n> source('grades.R')\n> source('ops.R')\n\
    > source('overriding.R')\n> course <- Course()\n> course <- SetFileName(course,\"\
    shortList.csv\")\n> course <- ReadGrades(course)\n> course['test1']\n[1] Assignment:\
    \ Test\n[1] (9) Grades:\n[1] 75 68 98 76 96 81 19 52 88\n> course['test1',3]\n\
    [1] 98\n```\n\n本节要讨论的最后一个主题是使用 `[` 操作来设置某个条目的值。其方法与前面获取信息的方法类似。唯一的区别是，我们不再使用 `setMethod`\
    \ 函数，而是使用 `setReplace` 方法，并且函数的最后一个参数是要在相应对象中设置对应条目的值：\n\n```r\nsetReplaceMethod(\"\
    [\",\n                 signature(\"NumericGrade\"),\n                 definition=function(x,i,value)\n\
    \                 {\n                     #print(paste(\"grade value\",i,value))\n\
    \                     x@value[i] = value\n                     return(x)\n   \
    \              }\n                 )\n\nsetReplaceMethod(\"[\",\n            \
    \     signature(\"Course\"),\n                 definition=function(x,i,j,value)\n\
    \                 {\n                     #print(paste(\"course grade\",i,j,value))\n\
    \                     grades <- x@Grades[[i]]\n                     grades[j]\
    \ <- value\n                     x@Grades[i] <- grades\n                     return(x)\n\
    \                 }\n                 )\n```\n\n有了这些定义，就可以轻松地设置课程中某个特定成绩的值，如下所示：\n\
    \n```r\n> source('grades.R')\n> source('ops.R')\n> source('overriding.R')\n>\n\
    > course <- Course()\n> course <- SetFileName(course,\"shortList.csv\")\n> course\
    \ <- ReadGrades(course)\n> print(course['test1'])\n[1] Assignment: Test\n[1] (9)\
    \ Grades:\n[1] 75 68 98 76 96 81 19 52 88\n> print(course['test1',3])\n[1] 98\n\
    >\n> course['test1',3] <- 99.1\n> print(course['test1',3])\n[1] 99.1\n>\n```\n\
    \n## 重新定义现有函数\n\n如前所述，`summary`、`show` 和 `plot` 命令被扩展为在接收到 `NumericGrade` 或 `LetterGrade`\
    \ 对象时以适当的方式作出反应。扩展这些函数只需使用 `setMethod` 命令为这些函数定义新方法即可。这些命令都已存在，因此无需使用 `setGeneric`\
    \ 命令来保留名称。也就是说，我们只需定义当传入 `NumericGrade` 或 `LetterGrade` 类的成员对象时与该命令关联的方法。\n\n\
    在第一个示例中，我们扩展了 `summary` 命令。在这种情况下，如果传递给函数的对象是 `NumericGrade` 而不是 `LetterGrade`，函数应该有不同的行为。对于\
    \ `LetterGrade` 对象，`summary` 命令会获取成绩并打印成绩的频率表：\n\n```r\nsetMethod(f=\"summary\"\
    ,\n          signature=\"LetterGrade\",\n          definition=function(object,...)\n\
    \          {\n              # Get the letter grades as factors and return the\n\
    \              # frequency table.\n              values <- GetLetterGrade(object)\n\
    \              return(summary(as.factor(values)))\n          }\n)\n```\n\n在本示例中，唯一可以创建的其他类型的作业是\
    \ `NumericGrade`，但将来可能会扩展该类。我们不是仅为 `NumericGrade` 类创建 summary 函数，而是为其基类 `Assignment`\
    \ 创建一个 summary 函数。这样，传递给 summary 命令的、从 `Assignment` 类派生的参数将获得该对象的成绩，并且这些成绩被假定为一个数值向量。然后可以对向量调用\
    \ summary 命令：\n\n```r\nsetMethod(f=\"summary\",\n          signature=\"Assignment\"\
    ,\n          definition=function(object,...)\n          {\n              # Get\
    \ the grade values and return the five point\n              # summary.\n     \
    \         values <- GetValue(object)\n              return(summary(values))\n\
    \          }\n)\n```\n\n在下面的示例中，读取了必要的文件，并读取了 `shortList.csv` 文件中的信息。找到两个不同作业（`test1`\
    \ 和 `project1`）的副本，并打印每个对象的摘要：\n\n```r\n> source('grades.R')\n> source('ops.R')\n\
    > source('overriding.R')\n```\n\n"
