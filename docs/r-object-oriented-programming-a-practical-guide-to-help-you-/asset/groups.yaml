  - "[PAGE 46]\n\n# # The workspace\n\nThe R environment keeps track of variables\
    \ as well as allocates and manages memory as it is requested. One command to list\
    \ the currently defined variables is the `ls` command. A variable can be deleted\
    \ using the `rm` command. In the following example, the a and b variables have\
    \ been changed, and the a variable is deleted:\n\n```\n```r\n> a <- 17.5\n> b\
    \ <- 99/4\n> ls()\n[1] \"a\" \"b\"\n> objects()\n[1] \"a\" \"b\"\n> rm(a)\n> ls()\n\
    [1] \"b\"\n```\n```\n\nIf you wish to delete all of the variables in the workspace,\
    \ the list option in the `rm` command can be combined with the `ls` command, as\
    \ follows:\n\n```\n```r\n> ls()\n[1] \"b\"\n> rm(list=ls())\n> ls()\ncharacter(0)\n\
    ```\n```\n\nA wide variety of other options are available. For example, there\
    \ are directory options to show and set the current directory, as follows:\n\n\
    ```\n```r\n> getwd()\n[1] \"/home/black\"\n> setwd(\"/tmp\")\n> getwd()\n[1] \"\
    /tmp\"\n> dir()\n [1] \"antActivity.R\"            \"betterS3.R\"\n [3] \"chiSquaredArea.R\"\
    \         \"firstS3.R\"\n [5] \"math100.csv\"              \"opsTesting.R\"\n\
    \ [7] \"probabilityExampleOne.png\" \"s3.R\"\n [9] \"s4Example.R\"\n```\n```\n\
    \nAnother important task is to save and load a workspace. The `save` and `save.image`\
    \ commands can be used to save the current workspace. The `save` command allows\
    \ you to save a particular variable, and the `save.image` command allows you to\
    \ save the entire workspace. The usage of these commands is as follows:\n\n```\n\
    ```r\n> save(a,file=\"a.RData\")\n> save.image(\"wholeworkspace.Rdata\")\n```\n\
    ```\n\nThese commands have a variety of options. For example, the ascii option\
    \ is a commonly used option to ensure that the data file is in a (nearly) human-readable\
    \ form. The `help` command can be used to get more details and see more of the\
    \ options that are available. In the following example, the variable a is saved\
    \ in a file, a.RData, and the file is saved in a"
