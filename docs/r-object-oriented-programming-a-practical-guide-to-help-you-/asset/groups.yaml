    \n## 第 8 章 S3 类\n\n这是我们编程介绍中的第二章。在前一章中，我们探讨了有助于定义要执行代码的基本控制结构，并初次接触了对象。现在我们将基于面向对象编程的思想，重点讨论\
    \ S3 类。有两种方法：S3 类和 S4 类。有些人只使用其中一种是很常见的。\n\n本章分为三个部分：\n\n- **定义类和方法**：本节将概述如何定义方法，这些方法的函数行为取决于主要参数的类名。\n\
    - **对象与继承**：在本节中，我们将讨论如何定义给定类的对象；我们还将介绍 S3 类中的继承概念。\n- **封装**：在本节中，我们将讨论封装对于类的重要性，以及在\
    \ R 类中如何处理封装。\n\n乍一看，S3 对象的行为方式似乎与其他语言中定义的对象不同。与 Java 或 C++ 相比，这种定义是一种奇怪的实现。但好的一面是，S3\
    \ 对象相对简单，并提供一种强大的方式来处理各种不同情形。\n\n我们已经见过各种数据结构和函数，在本章中，我们将看到如何使用类属性来规定当列表传递给函数时函数的响应方式。其思想是，对象的类属性是一个名称向量，该向量表示一组有序的名称，用于在决定函数应采取何种操作时进行搜索。我们将在本章中构建并扩展一个示例。其思想是，我们希望创建一组类，用于模拟遵循几何分布的随机变量。会有两个类。第一个类用于公平硬币，我们抛硬币直到出现\
    \ *正面*。第二个类用于公平的六面骰子，我们掷骰子直到掷出 *1*。\n\n### 定义类和方法\n\n`class` 命令与其他属性命令类似，可用于设置或获取对象类的信息。对象的类是一个向量，向量中的每一项是一个类的名称。类向量中的第一个元素是对象的基类，当你从左到右阅读时，它会从其他类继承。\n\
    \n我们首先关注对象只有一个类的情况，并在接下来的部分中考察继承。本章中使用的示例用于模拟一个遵循几何分布的实验。其思想是重复某个实验，直到第一次成功时停止。首先，我们考察两个类，并构造一个根据类名采取行动的函数。第一个类用于表示公平的六面骰子。掷骰子会给出一个介于\
    \ 1 到 6（含）之间的整数，当返回 1 时实验停止。第二个类表示公平硬币。抛硬币返回 H 或 T，当返回 H 时实验停止。\n\n下面的图说明了这两个类的定义。每个类跟踪试验，结果保存在一个向量中。这两个方法包括一个重置历史的方法，但当我们考察继承时会添加更多方法。在这个示例中，我们并不是在传统意义上创建方法，而是创建一些基于传递给它们的参数的类名采取适当行动的函数。请看下图：\n\
    \n![](img/18eeabe9ab8c81c5a3f4040db5906c67_167_0.png)\n\n*与骰子和硬币类相关联的方法*\n\n首先，我们定义这两个类。每个类由一个列表组成，类名分别设置为\
    \ `Die` 和 `Coin`。（这些名称是我们自定义的字符串。）每个类由一个包含单个数值向量的列表组成，该向量初始长度为 0。在下面的每种情况中，列表都是手动创建的，并定义了一个类名。我们本可以使用向量，但我们使用了列表，以便示例与我们稍后扩展类的方式保持一致：\n\
    \n```\n```r\n> oneDie <- list(trials=character(0))\n> class(oneDie) <- \"Die\"\
    \n\n> oneCoin <- list(trials=character(0))\n> class(oneCoin) <- \"Coin\"\n```\n\
    ```\n\n首先，我们定义两组函数。第一组函数重置历史记录，第二组函数执行一次伯努利试验。我们首先关注一个重置和初始化历史的例程，并定义一个名为 reset\
    \ 的函数。reset 函数使用了三个不同的函数。第一个使用 UseMethod 命令，它告诉 R 搜索要调用的适当函数。该决定基于传递给它的第一个对象的类名。UseMethod\
    \ 命令会查找名称形如 resetTrial.class_name 的其他函数，其中 class_name 后缀必须与类的名称完全匹配。例外情况是 default\
    \ 后缀，如果没有找到其他函数，将执行默认后缀：\n\n```\nreset <- function(theObject)\n{\n    UseMethod(\"\
    reset\",theObject)\n    print(\"Reset the Trials\")\n}\n\nreset.default <- function(theObject)\n\
    {\n    print(\"Uh oh, not sure what to do here!\\n\")\n    return(theObject)\n\
    }\n\nreset.Die <- function(theObject)\n{\n    theObject$trials <- character(0)\n\
    \    print(\"Reset the die\\n\")\n    return(theObject)\n}\n\nreset.Coin <- function(theObject)\n\
    {\n    theObject$trials <- character(0)\n    print(\"Reset the coin\\n\")\n  \
    \  return(theObject)\n}\n```\n\n请注意，这些函数会返回传递给它们的对象。回想一下，R 是按值传递参数的。你对变量所做的任何更改都是函数内部的局部更改，因此必须返回新值。现在我们可以调用\
    \ resetTrial 函数，它会根据传递给它的参数决定调用哪个函数。请看下面的代码：\n\n```\n> oneDie$trials = c(\"3\"\
