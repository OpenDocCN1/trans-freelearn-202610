    # Scope


    An important question when dealing with a function is how to decide what a symbol
    means. This idea is referred to as scope, and the language used to describe the
    ideas associated with scope can be confusing. Unfortunately, it is something that
    needs to be considered, and we try to discuss some of the ideas here. It is also
    important to note that the details discussed here represent an area in which R
    is not consistent with the S_PLUS language, so be careful about generalizing these
    ideas. For further information, you can enter the demo(scoping) command in the
    R environment and a brief demonstration of the notion of scope is given. If you
    enter the help(environment) command, you can also find more details.


    The basic idea is that R maintains a hierarchy of environments. Each environment
    has a list of symbols that are associated with that environment. You can create
    a new environment that is embedded within another environment. The new.env command
    is used to create an environment. This environment holds its own variables, and
    variables can be created using the assign command. The values can be obtained
    using the get command:


    ```

    ```r

    > envOne <- new.env()

    > typeof(envOne)

    [1] "environment"

    > ls()

    [1] "envOne"

    > ls(envOne)

    character(0)

    >

    >

    > assign("bubba",12,envir=envOne)

    > ls()

    [1] "envOne"

    > ls(envOne)

    [1] "bubba"

    > envOne$bubba

    [1] 12

    > get("bubba",envOne)

    [1] 12

    > bubba

    Error: object ''bubba'' not found

    ```

    ```


    Note that in the preceding example, we used the optional environment argument
    to the ls command, which specifies which environment to use. The environment is
    used to guide R'
