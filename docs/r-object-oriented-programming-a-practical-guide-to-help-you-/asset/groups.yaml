    > >


    One of the greatest advantages of the S3 class definition is that it is simple
    to build on what is already available. In the example from the previous section,
    I would like to have the `plot` command react appropriately according to whether
    or not I pass it a class of the type `Die` or `Coin`. Assuming that I have the
