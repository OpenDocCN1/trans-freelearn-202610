    [1] "and the first"     "this is the second" "yo, third!"

    ```


    可以使用 `as.character` 命令将值强制转换为字符类型，如下所示：


    ```r

    > a <- 3.0

    > a

    [1] 3

    > b <- as.character(a)

    > b

    [1] "3"

    ```


    最后，`is.character` 命令接受一个参数，如果该参数是字符串，则返回 TRUE：


    ```r

    > a <- as.character(4.5)

    > a

    [1] "4.5"

    > is.character(a)

    [1] TRUE

    ```


    ### 因子


    另一种常见的记录数据方式是为数据提供一组离散的水平。例如，实验中单次试验的结果可以用 a、b 或 c 来表示。这种类别数据在 R 中被称为因子。其命令和思路与前面描述的数据类型大致类似。不过，因子存在一些细微差别。因子用于指定不同的水平，并且可以被视为有序或无序。因子有很多选项，明智的做法是使用
    `help(factor)` 命令查阅因子的帮助页面。但需要注意的一点是，对因子执行 `typeof` 命令将返回整数。


    可以使用 `factor` 命令定义因子，如下所示：


    ```r

    > lev <- factor(x=c("one","two","three","one"))

    > lev

    [1] one   two   three one

    ```


    `complex` 命令有许多选项，因此建议快速查看一下帮助页面 `(help(complex))`：


    ```r

    > z <- complex(3)

    > z

    [1] 0+0i 0+0i 0+0i

    > typeof(z)

    [1] "complex"

    > z <- complex(real=c(1,2),imag=c(3,4))

    > z

    [1] 1+3i 2+4i

    > Re(z)

    [1] 1 2

    ```


    将变量强制转换为复数以及测试变量是否为复数的方法与前面看到的方法类似。可以使用 `as.complex` 命令将变量强制转换为复数。此外，可以使用 `is.complex`
    命令测试变量是否为复数。


