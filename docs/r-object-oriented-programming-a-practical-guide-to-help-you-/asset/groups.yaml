    Reset the die\n\n> oneDie\n$trials\ncharacter(0)\n\nattr(, \"class\")\n```\n\n\
    ```\n[1] \"Die\"\n\n> oneCoin$trials = c(\"H\",\"H\",\"T\")\n> oneCoin <- reset(oneCoin)\n\
    Reset the coin\n\n> oneDie$trials\ncharacter(0)\n> # Look at an example that will\
