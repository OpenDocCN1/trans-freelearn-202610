    # # Vectors


    The default data structure in R is the vector. For example, if you define a variable
    as a single number, R will treat it as a vector of length one:


    ```

    ```r

    > a <- 5

    > a[1]

    [1] 5

    ```

    ```


    Vectors represent a convenient and straightforward way to store a long list of
    numbers. Please see [Chapter 1](#), *Data Types*, to see more examples of creating
    vectors. One useful and common way to define a vector is to use the c command.
    The c command concatenates a set of arguments to form a single vector:


    ```

    ```r

    > v <- c(1,3,5,7,-10)

    > v

    [1]    1   3   5   7 -10

    > v[4]

    [1] 7

    > v[2] <- v[1]-v[5]

    > v

    [1]    1  11   5   7 -10

    ```

    ```


    Two other methods to generate vectors make use of the : notation and the seq command.
    The : notation is used to create a list of sequentially numbered values for given
    start and end values. The seq command does the same thing, but it provides more
    options to determine the increment between values in the vector:


    ```

    ```r

    > 1:5

    [1] 1 2 3 4 5

    > 10:14

    [1] 10 11 12 13 14

    > a <- 3:7

    > a

    [1] 3 4 5 6 7

    > b <- seq(3,5)

    > b

    [1] 3 4 5

    > b <- seq(3,10,by=3)

    > b

    [1] 3 6 9

    ```

    ```'
