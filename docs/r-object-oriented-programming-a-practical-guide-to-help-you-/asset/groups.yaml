  md: "\nArranged in vectors. This can lead to potential problems with a logical statement.\
    \ The first element in the vector is used to decide whether a whole statement\
    \ is TRUE or FALSE. Fortunately, R will give a warning if the condition evaluates\
    \ to a vector of length greater than one:\n\n```\n> x <- c(1,2)\n> if(x < 2) {\n\
    +   cat(\"Oh yes it is\\n\")\n+ }\nOh yes it is\nWarning message:\nIn if (x <\
    \ 2) { :\n  the condition has length > 1 and only the first element will be used\n\
    ```\n\nThis is something to keep in mind when deciding which logical operator\
    \ to use in an if statement. For example, the `|` operator will perform a logical\
    \ OR on all elements of the vectors, but the `||` operator will only perform a\
    \ logical OR on the first elements of the vectors:\n\n```\n> x <- c(FALSE,FALSE,TRUE)\n\
    > y <- c(FALSE,TRUE,TRUE)\n> x|y\n[1] FALSE  TRUE  TRUE\n> x||y\n[1] FALSE\n```\n\
    \nA variety of logical operators are recognized. Some provide comparisons between\
    \ all entries in a vector and others are for comparisons only for the first elements\
    \ in the vectors. A list of the operators is given in the following table:\n\n\
    | Operator | Description | Operator | Description |\n|---|---|---|---|\n| < |\
    \ Less than (vector) | \\| | Or (vector) |\n| > | Greater than (vector) | \\|\\\
    | | Or (first entry only) |\n| <= | Less than or equal (vector) | ! | Not (vector)\
    \ |\n| >= | Greater than or equal (vector) | & | And (vector) |\n| == | Equal\
    \ to (vector) | && | And (first entry only) |\n| != | Not equal to (vector) |\
    \ xor(a,b) | Exclusive or (vector) |\n\nTable 1 – The logical operators including\
    \ comparison operators\n\n## Loop constructs\n\nAnother important programming\
    \ task is to create a set of instructions that can be repeated in a structured\
    \ way. There are three loop constructs in R: for, while, and repeat loops. We\
    \ will explore each of these loop constructs and discuss the break and next commands,\
    \ which can control how the instructions within a loop’s code block are executed.\
    \ More details are available using the `help(Control)` command.\n\n### The for\
    \ loop\n\nA for loop takes a vector, and it repeats a block of code for each value\
    \ in the vector. The syntax is as follows:\n\n```\nfor(var in vector)\n  code\
    \ block\n```\n\nThe for loop repeats a set of instructions for every value within\
    \ a vector in the appropriate order. It can be memory intensive if you need to\
    \ repeat the loop a lot of times and the vector is not already stored in the workspace.\
    \ An example of a simple for loop is given here:\n\n```\n> for(lupe in seq(1,2,by=0.33))\n\
    + {\n+   cat(\"The value of lupe is \",lupe,\"\\n\")\n+ }\nThe value of lupe is\
    \  1\nThe value of lupe is  1.33\nThe value of lupe is  1.66\nThe value of lupe\
    \ is  1.99\n```\n\n### The while loop\n\nA while loop will execute a code block\
    \ as long as a given expression is true. The syntax is as follows:\n\n```\nwhile(condition)\n\
    \  code block\n```\n\nThey are often used when the number of iterations is not\
    \ known in advance and the loop is repeated until some criteria is met. Also,\
    \ the while loop has some advantages over the for loop. It can be more efficient,\
    \ especially with respect to memory, and it is more flexible (RMemory, Please\
    \ refer to RMemory: Hadley Wickham, memory, 2014, http://adv-r.had.co.nz/memory.html\
    \ for more information on this topic). For example, instead of constructing a\
    \ large vector to iterate over its elements, a single index can be used. On the\
    \ down side, it can be harder to read, and it can require a little more care when\
    \ writing the code. An example is given here:\n\n```\n> lupe <- 1.0;\n> while(lupe\
    \ <= 2.0)\n+ {\n+   cat(\"The value of lupe is \",lupe,\"\\n\")\n+   lupe <- lupe\
    \ + 0.33\n+ }\nThe value of lupe is  1\nThe value of lupe is  1.33\nThe value\
    \ of lupe is  1.66\nThe value of lupe is  1.99\n```\n\n### The repeat loop\n\n\
    A repeat loop is used to denote a block of code that will be repeatedly executed\
    \ until an explicit breakout of the block is executed. The primary advantage of\
    \ the repeat loop is that the start of the code block will always be executed.\
    \ One disadvantage is that it can be difficult to read. The syntax is relatively\
    \ simple:\n\n```\nrepeat\n    code block\n```\n\nYou must use a break command\
    \ to tell R to exit the code block. The break command is described in the next\
    \ subsection in more detail. An example of a repeat loop is given in the following\
    \ example, and it is a brief example of simulation of a random walk in the complex\
    \ plane:\n\n```\npositions  <- complex(0) # Initialize the history of positions\n\
    currentPos <- 0.0+0.0i    # Start at the origin\nNUMBERSTEPS <- 50          #\
    \ Number of steps to take\nangleFacing <- 0.0         # direction it is facing\n\
    stdDev      <- 1.0         # std dev. of the change in the angle\n\nstep <- as.integer(0)\n\
    repeat\n{\n    ## Update the current time step\n    step <- step + as.integer(1)\n\
    \n    ## Check to see if it is time to stop\n    if(step>MAXNUMBER)\n        break\n\
    \n    ## Add new people to the line and update the length\n    angle <- angle\
    \ + rnorm(1,0.0,stdDev)\n    currentPos <- currentPos + exp(angle*1.0i)\n    positions\
    \ <- c(positions,currentPos)\n}\nplot(Re(positions),Im(positions),type=\"l\")\n\
    ```\n\n### Break and next statements\n\nThe break and next statements are used\
    \ to influence which part of the code in the current loop will be executed. The\
    \ break statement will move to the very end of the current block and it will stop\
    \ the execution of the loop. The next statement will act as if the end of the\
    \ code block was reached and start over at the beginning of the code block to\
    \ begin the next iteration.\n\nAs a demonstration, we build on the simulation\
    \ of the random walk in the previous example. We alter the model by placing a\
    \ restriction on the position. If a step moves to the left-hand part of the plane,\
    \ it is ignored:\n\n```\npositions   <- complex(0) # Initialize the history of\
    \ positions\ncurrentPos  <- 0.0+0.0i   # Start at the origin\nNUMBERSTEPS <- 50\
    \         # Number of steps to take\nangleFacing <- 0.0        # direction it\
    \ is facing\nstdDev      <- 1.0        # std dev. of the change in the angle\n\
    \nstep <- as.integer(0)\nrepeat\n  {\n    ## Add new people to the line and update\
    \ the length\n    newAngle     <- angle + rnorm(1,0.0,stdDev)\n    proposedStep\
    \ <- currentPos + exp(newAngle*1.0i)\n    if(Re(proposedStep) < 0.0)\n      next\
    \  # Ignore this step. It moves to neg. real parts\n\n    ## update the position\n\
    \    angle     <- newAngle\n    currentPos <- proposedStep\n    positions  <-\
    \ c(positions,currentPos)\n\n    ## Update the current time step\n    step <-\
    \ step + as.integer(1)\n\n    ## Check to see if it is time to stop\n    if(step>MAXNUMBER)\n\
    \      break\n  }\nplot(Re(positions),Im(positions),type=\"l\")\n```\n\n## Functions\n\
    \nAnother common programming task is to define a function or subroutine that can\
    \ be executed with a single call. Defining and using functions can be complicated\
    \ because of the technical details associated with working with variables that\
    \ exist in different contexts but may have the same name. Another problem that\
    \ arises is that everything in R is an object. Up to this point, we have quietly\
    \ ignored this issue, but it is a technical issue that we must now consider. In\
    \ this section, we will first demonstrate how to define a function. We will then\
    \ discuss the details about how arguments are passed to a function. Finally, we\
    \ discuss the technical details of how R determines what a variable name means.\n\
    \nBefore we get into those details, we will provide a note about how R keeps track\
    \ of functions. When we define a variable, R treats that variable as an object\
    \ that can be accessed using the name we assign to the variable. Likewise, when\
    \ you define a new function, it is assigned a variable name, and the variable\
    \ is an object.\n\n### Defining a function\n\nAs previously mentioned, when a\
    \ function is defined, it is assigned to an object and treated like any other\
    \ variable. The format for a function definition is as follows:\n\n```\nfunction\
    \ (arg1, arg2, ... )\n  code block\n```\n\nThis will create an object, and you\
    \ must assign a variable name to the object. If you print out the value of the\
    \ variable, it will print out the definition of the function. In the following\
    \ example, suppose we need a function used to simulate a random walk in the complex\
    \ plane. The function takes the current position and adds a unit step in a random\
    \ direction:\n\n```\n> updatePosition <- function(currentPos)\n+ {\n+     newDirection\
    \ <- exp(1i*runif(1,0.0,2.0*pi))\n+     currentPos + newDirection\n+ }\n> \n>\
    \ updatePosition(0.0)\n[1] 0.9919473-0.1266517i\n> updatePosition\nfunction(currentPos)\n\
    {\n    newDirection <- exp(1i*runif(1,0.0,2.0*pi))\n    currentPos + newDirection\n\
    }\n```\n\nOne oddity associated with functions is that the value it returns is\
    \ the last expression evaluated within the code block.\n\nThere are times when\
    \ you want a function to perform operations that impact more than one variable.\
    \ In such cases, you may need to return a combination of results. For difficult\
    \ results that cannot be expressed as a vector, you can return the result as a\
    \ list. In the\n"
  mdcn: "\n以向量形式排列。这可能会导致逻辑语句出现问题。向量中的第一个元素用于判断整个语句是 TRUE 还是 FALSE。幸运的是，如果条件计算结果为长度大于\
    \ 1 的向量，R 会给出警告：\n\n```\n> x <- c(1,2)\n> if(x < 2) {\n+   cat(\"Oh yes it is\\\
    n\")\n+ }\nOh yes it is\nWarning message:\nIn if (x < 2) { :\n  the condition\
    \ has length > 1 and only the first element will be used\n```\n\n在决定 if 语句中使用哪个逻辑运算符时，这一点需要牢记。例如，`|`\
    \ 运算符会对向量的所有元素执行逻辑或运算，但 `||` 运算符只对向量的第一个元素执行逻辑或运算：\n\n```\n> x <- c(FALSE,FALSE,TRUE)\n\
    > y <- c(FALSE,TRUE,TRUE)\n> x|y\n[1] FALSE  TRUE  TRUE\n> x||y\n[1] FALSE\n```\n\
    \nR 能识别多种逻辑运算符。有些运算符会对向量中的所有元素进行比较，有些则只对向量中的第一个元素进行比较。下表列出了这些运算符：\n\n| 运算符 | 描述\
    \ | 运算符 | 描述 |\n|---|---|---|---|\n| < | 小于（向量） | \\| | 或（向量） |\n| > | 大于（向量）\
    \ | \\|\\| | 或（仅第一个元素） |\n| <= | 小于等于（向量） | ! | 非（向量） |\n| >= | 大于等于（向量） | & |\
    \ 与（向量） |\n| == | 等于（向量） | && | 与（仅第一个元素） |\n| != | 不等于（向量） | xor(a,b) | 异或（向量）\
    \ |\n\n表 1 – 逻辑运算符（包括比较运算符）\n\n## 循环结构\n\n另一个重要的编程任务是创建一组可以按结构方式重复执行的指令。R 中有三种循环结构：for\
    \ 循环、while 循环和 repeat 循环。我们将逐一探讨这些循环结构，并讨论 break 和 next 命令，它们可以控制循环代码块内指令的执行方式。使用\
    \ `help(Control)` 命令可以查看更多详细信息。\n\n### for 循环\n\nfor 循环接受一个向量，并针对向量中的每个值重复执行一段代码。语法如下：\n\
    \n```\nfor(var in vector)\n  code block\n```\n\nfor 循环会按相应顺序对向量中的每个值重复执行一组指令。如果你需要多次重复该循环，而向量又尚未存储在工作区中，则可能会占用大量内存。下面是一个简单\
    \ for 循环的示例：\n\n```\n> for(lupe in seq(1,2,by=0.33))\n+ {\n+   cat(\"The value\
    \ of lupe is \",lupe,\"\\n\")\n+ }\nThe value of lupe is  1\nThe value of lupe\
    \ is  1.33\nThe value of lupe is  1.66\nThe value of lupe is  1.99\n```\n\n###\
    \ while 循环\n\nwhile 循环会在给定表达式为真的情况下执行代码块。语法如下：\n\n```\nwhile(condition)\n  code\
    \ block\n```\n\n它们通常用于事先不知道迭代次数、循环会一直重复直到满足某个条件的情况。此外，while 循环相对于 for 循环有一些优势。它可能更高效，尤其是在内存方面，而且更灵活（RMemory，有关此主题的更多信息，请参阅\
    \ RMemory: Hadley Wickham, memory, 2014, http://adv-r.had.co.nz/memory.html）。例如，无需构造一个大型向量来遍历其元素，而是可以使用单个索引。缺点是可读性较差，编写代码时需要多加小心。下面给出一个示例：\n\
    \n```\n> lupe <- 1.0;\n> while(lupe <= 2.0)\n+ {\n+   cat(\"The value of lupe\
    \ is \",lupe,\"\\n\")\n+   lupe <- lupe + 0.33\n+ }\nThe value of lupe is  1\n\
    The value of lupe is  1.33\nThe value of lupe is  1.66\nThe value of lupe is \
    \ 1.99\n```\n\n### repeat 循环\n\nrepeat 循环用于表示一段代码块，该代码块将反复执行，直到显式跳出该代码块。repeat\
    \ 循环的主要优点是代码块的起点总是会执行。一个缺点是可能难以阅读。语法相对简单：\n\n```\nrepeat\n    code block\n```\n\
    \n你必须使用 break 命令来告诉 R 退出该代码块。break 命令将在下一小节中更详细地描述。下面的示例给出了一个 repeat 循环的示例，它是在复平面中模拟随机游走的简要示例：\n\
    \n```\npositions  <- complex(0) # Initialize the history of positions\ncurrentPos\
    \ <- 0.0+0.0i    # Start at the origin\nNUMBERSTEPS <- 50          # Number of\
    \ steps to take\nangleFacing <- 0.0         # direction it is facing\nstdDev \
    \     <- 1.0         # std dev. of the change in the angle\n\nstep <- as.integer(0)\n\
    repeat\n{\n    ## Update the current time step\n    step <- step + as.integer(1)\n\
    \n    ## Check to see if it is time to stop\n    if(step>MAXNUMBER)\n        break\n\
    \n    ## Add new people to the line and update the length\n    angle <- angle\
    \ + rnorm(1,0.0,stdDev)\n    currentPos <- currentPos + exp(angle*1.0i)\n    positions\
    \ <- c(positions,currentPos)\n}\nplot(Re(positions),Im(positions),type=\"l\")\n\
    ```\n\n### break 与 next 语句\n\nbreak 和 next 语句用于影响当前循环中哪部分代码将被执行。break 语句会跳转到当前代码块的末尾，并停止循环的执行。next\
    \ 语句的作用则相当于已到达代码块末尾，然后回到代码块开头开始下一次迭代。\n\n作为演示，我们在前面示例的随机游走模拟基础上进行构建。我们通过对位置施加限制来修改模型。如果某一步移动到平面的左侧部分，则该步会被忽略：\n\
    \n```\npositions   <- complex(0) # Initialize the history of positions\ncurrentPos\
    \  <- 0.0+0.0i   # Start at the origin\nNUMBERSTEPS <- 50         # Number of\
    \ steps to take\nangleFacing <- 0.0        # direction it is facing\nstdDev  \
    \    <- 1.0        # std dev. of the change in the angle\n\nstep <- as.integer(0)\n\
    repeat\n  {\n    ## Add new people to the line and update the length\n    newAngle\
    \     <- angle + rnorm(1,0.0,stdDev)\n    proposedStep <- currentPos + exp(newAngle*1.0i)\n\
    \    if(Re(proposedStep) < 0.0)\n      next  # Ignore this step. It moves to neg.\
    \ real parts\n\n    ## update the position\n    angle     <- newAngle\n    currentPos\
    \ <- proposedStep\n    positions  <- c(positions,currentPos)\n\n    ## Update\
    \ the current time step\n    step <- step + as.integer(1)\n\n    ## Check to see\
    \ if it is time to stop\n    if(step>MAXNUMBER)\n      break\n  }\nplot(Re(positions),Im(positions),type=\"\
    l\")\n```\n\n## 函数\n\n另一个常见的编程任务是定义可以通过一次调用执行的函数或子例程。由于在不同上下文中可能存在的同名变量所涉及的技术细节，定义和使用函数可能比较复杂。另一个出现的问题是\
    \ R 中一切都是对象。到目前为止，我们一直悄然忽略这个问题，但这是一个我们现在必须考虑的技术问题。在本节中，我们首先演示如何定义函数。然后讨论参数如何传递给函数的细节。最后讨论\
    \ R 如何确定变量名含义的技术细节。\n\n在深入这些细节之前，我们先说明一下 R 如何跟踪函数。当我们定义一个变量时，R 会将该变量视为一个对象，可以使用我们分配给该变量的名称来访问它。同样，当你定义一个新函数时，它会被分配一个变量名，并且该变量是一个对象。\n\
    \n### 定义函数\n\n如前所述，定义函数时，函数会被分配到一个对象上，并像任何其他变量一样被对待。函数定义的格式如下：\n\n```\nfunction\
    \ (arg1, arg2, ... )\n  code block\n```\n\n这将会创建一个对象，你必须给该对象分配一个变量名。如果你打印出该变量的值，它会打印出函数的定义。在下面的示例中，假设我们需要一个用于在复平面中模拟随机游走的函数。该函数接受当前位置，并在随机方向上增加一个单位步长：\n\
    \n```\n> updatePosition <- function(currentPos)\n+ {\n+     newDirection <- exp(1i*runif(1,0.0,2.0*pi))\n\
    +     currentPos + newDirection\n+ }\n> \n> updatePosition(0.0)\n[1] 0.9919473-0.1266517i\n\
    > updatePosition\nfunction(currentPos)\n{\n    newDirection <- exp(1i*runif(1,0.0,2.0*pi))\n\
    \    currentPos + newDirection\n}\n```\n\n与函数相关的一个奇特之处在于，函数返回的值是代码块中最后求值的表达式。\n\
    \n有时你可能希望函数执行影响多个变量的操作。在这种情况下，你可能需要返回结果的组合。对于无法表示为向量的复杂结果，你可以将结果作为列表返回。在\n"
