    \ the number of rows or columns. The command has an additional option to\n\nspecify\
    \ whether or not the data is in row major or column major order:\n\n```\n```r\n\
    > B <- matrix(1:12,nrow=3)\n> B\n     [,1] [,2] [,3] [,4]\n[1,]    1    4    7\
    \   10\n[2,]    2    5    8   11\n[3,]    3    6    9   12\n\n> B <- matrix(1:12,nrow=3,byrow=TRUE)\n\
    > B\n     [,1] [,2] [,3] [,4]\n[1,]    1    2    3    4\n[2,]    5    6    7 \
    \   8\n[3,]    9   10   11   12\n```\n```\n\nBoth matrices and arrays can be manipulated\
    \ to determine or change their dimensions. The dim command can be used to get\
    \ or set this information:\n\n```\n```r\n> C <- matrix(1:12,ncol=3)\n> C\n   \
    \  [,1] [,2] [,3]\n[1,]    1    5    9\n[2,]    2    6   10\n[3,]    3    7  \
    \ 11\n[4,]    4    8   12\n> dim(C)\n[1] 4 3\n> dim(C) <- c(3,4)\n> C\n     [,1]\
    \ [,2] [,3] [,4]\n[1,]    1    4    7   10\n[2,]    2    5    8   11\n[3,]   \
    \ 3    6    9   12\n```\n```\n\n## Censoring data\n\nUsing a logical vector as\
    \ an index is useful for limiting data that is examined. For example, to limit\
    \ a vector to examine only the positive values in the data set, a logical comparison\
    \ can be used for the index into the vector:\n\n```\n```r\n> u <- 1:6\n> v <-\
    \ c(-1,1,-2,2,-3,3)\n> u\n[1] 1 2 3 4 5 6\n> v\n[1] -1  1 -2  2 -3  3\n> u[v >\
    \ 0]\n[1] 2 4 6\n> u[v < 0] = -2*u[v < 0]\n> u\n[1]  -2  2  -6  4 -10  6\n```\n\
    ```\n\nAnother useful aspect of a logical index into a vector is the use of the\
    \ NA data type. The is.na function and a logical NOT operator (!) can be a useful\
    \ tool when a vector contains data that is not defined:\n\n```\n```r\n> v <- c(1,2,3,NA,4,NA)\n\
    > v\n[1]  1  2  3 NA  4 NA\n> v[is.na(v)]\n[1] NA NA\n> v[!is.na(v)]\n[1] 1 2\
    \ 3 4\n```\n```\n\nNote that many functions have optional arguments to specify\
    \ how R should react to data that contains a value with the NA type. Unfortunately,\
    \ the way this is done is not consistent, and you should use the help command\
    \ with respect to any particular function:\n\n```\n```r\n> v <- c(1,2,3,NA,4,NA)\n\
    > v\n[1]  1  2  3 NA  4 NA\n> mean(v)\n[1] NA\n> mean(v,na.rm=TRUE)\n[1] 2.5\n\
    ```\n```\n\nIn this last example, the na.rm option in the mean function is set\
    \ to TRUE to specify that R should ignore the entries in the vector that are NA.\n\
    \n## Appending rows and columns\n\nThe `cbind` and `rbind` commands can be used\
    \ to append data to existing objects. These commands can be used on vectors, matrices,\
    \ arrays, and they are extended to also act on data frames. The following examples\
    \ use data frames, as that is a common operation. You should be careful and try\
    \ the commands on arrays to make sure that the operation behaves in the way you\
    \ expect.\n\nThe `cbind` command is used to combine the columns of the data given\
    \ as arguments:\n\n```\n```r\n> d <- data.frame(one=c(1,2,3),two=as.factor(c(\"\
    one\",\"two\",\"three\")))\n> e <- c(\"ein\",\"zwei\",\"drei\")\n> newDataFrame\
    \ <- cbind(d,third=e)\n> newDataFrame\n  one   two third\n1   1   one   ein\n\
    2   2   two  zwei\n3   3 three  drei\n> newDataFrame$third\n[1] ein zwei drei\n\
    Levels: drei ein zwei\n```\n```\n\nIf the arguments to the `cbind` command are\
    \ two data frames (or two arrays), then the command combines all of the columns\
    \ from all of the data frames (arrays):\n\n```\n```r\n> d <- data.frame(one=c(1,2,3),two=as.factor(c(\"\
    one\",\"two\",\"three\")))\n> e <- data.frame(three=c(4,5,6),four=as.factor(c(\"\
    vier\",\"funf\",\"sechs\")))\n> newDataFrame <- cbind(d,e)\n> newDataFrame\n \
    \ one   two three  four\n1   1   one     4  vier\n2   2   two     5  funf\n3 \
    \  3 three     6 sechs\n```\n```\n\nThe `rbind` command concatenates the rows\
    \ of the objects passed to it. The command uses the names of the columns to determine\
    \ how to append the data. The number and names of the columns must be identical:\n\
    \n```\n```r\n> d <- data.frame(one=c(1,2,3),two=as.factor(c(\"one\",\"two\",\"\
    three\")))\n> e <- data.frame(one=c(4,5,6),two=as.factor(c(\"vier\",\"funf\",\"\
    sechs\")))\n> newDataFrame <- rbind(d,e)\n> newDataFrame\n  one   two\n1   1 \
    \  one\n2   2   two\n3   3 three\n4   4  vier\n5   5  funf\n6   6 sechs\n```\n\
    ```\n\n```\n2.00 0.75\n> typeof(meanResult)\n[1] \"double\"\n```\n\n## tapply\n\
    \nThe tapply command is used to apply a function to different parts of data within\
    \ an array. The function takes at least three arguments. The first is the data\
    \ to apply an operation, the second is the set of factors that defines how the\
    \ data is organized with respect to the different levels, and the third is the\
    \ operation to perform. In the following example, a vector is defined that has\
    \ the diameter of trees. A second vector is defined, which specifies what kind\
    \ of tree was measured for each observation. The goal is to find the standard\
    \ deviation for each type of tree:\n\n```\n> diameters <- c(28.8, 27.3, 45.8,\
    \ 34.8, 25.3)\n> tree <- as.factor(c(\"pine\",\"pine\",\"oak\",\"pine\",\"oak\"\
    ))\n> tapply(diameters,tree,sd)\n      oak      pine\n14.495689  3.968627\n```\n\
    \n## mapply\n\nThe last command to examine is the mapply command. The mapply command\
    \ takes a function to apply and a list of arrays. The function takes the first\
    \ elements of each array and applies the function to that list. It then takes\
    \ the second elements of each array and applies the function. This is repeated\
    \ until it goes through every element. Note that if one of the arrays has fewer\
    \ elements than the others, the mapply command will reset and start at the beginning\
    \ of that array to fill in the missing values:\n\n```\n> a <- c(1,2,3)\n> b <-\
    \ c(1,2,3)\n> mapply(sum,a,b)\n[1] 2 4 6\n>\n```\n"
  mdcn: "\n## 数据框\n\n数据框类似于列表，许多操作也相似。主要区别在于数据框的所有组件必须具有相同数量的元素。这是存储信息的最常见方式之一，许多用于从文件读取数据的函数默认返回数据框。例如，假设我们询问五个人两个问题。第一个问题是：“你有宠物猫吗？”第二个问题是：“你家里有多少房间需要换新地毯？”\n\
    \n```r\n> d <- data.frame(Q1=as.factor(c(\"y\",\"n\",\"y\",\"y\",\"n\")),\n+ \
    \                Q2=c(2,0,1,2,0))\n> d\n  Q1 Q2\n1  y  2\n2  n  0\n3  y  1\n4\
    \  y  2\n5  n  0\n\n> d$Q1\n[1] y n y y n\nLevels: n y\n\n> summary(d)\n   Q1\
    \             Q2\n n:2   Min.   :0\n y:3   1st Qu.:0\n       Median :1\n     \
    \  Mean   :1\n       3rd Qu.:2\n       Max.   :2\n```\n```\n\nnames 和 attributes\
    \ 命令在数据框上的行为与在列表上相同。在前面的示例中，我们采用之前示例中定义的数据框，并将字段重命名为更具描述性的名称：\n\n```r\n> d <-\
    \ data.frame(Q1=as.factor(c(\"y\",\"n\",\"y\",\"y\",\"n\")),\n+              \
    \   Q2=c(2,0,1,2,0))\n> names(d) <- c(\"HaveCat\",\"NumberRooms\")\n> d\n  HaveCat\
    \ NumberRooms\n1       y           2\n2       n           0\n3       y       \
    \    1\n4       y           2\n5       n           0\n```\n```\n\n数字。cut 命令接受数值数据和一个断点向量，这些断点指示每个区间之间的分界点，如下所示：\n\
    \n```r\n> a <- c(-0.8,-0.7,0.9,-1.4,-0.3,1.2)\n> b <- cut(a,breaks=c(-1.5,-1,-0.5,0,0.5,1.0,1.5))\n\
    > b\n[1] (-1,-0.5] (-1,-0.5] (0.5,1]   (-1.5,-1] (-0.5,0]  (1,1.5]\nLevels: (-1.5,-1]\
    \ (-1,-0.5] (-0.5,0] (0,0.5] (0.5,1] (1,1.5]\n> summary(b)\n(-1.5,-1] (-1,-0.5]\
    \ (-0.5,0]   (0,0.5]   (0.5,1]   (1,1.5]\n         1          2          1   \
    \       0          1          1\n> table(b)\nb\n(-1.5,-1] (-1,-0.5] (-0.5,0] \
    \  (0,0.5]   (0.5,1]   (1,1.5]\n         1          2          1          0  \
    \        1          1\n```\n```\n\n## 矩阵和数组\n\n表是数组的一种特殊情况。可以使用 `array` 或 `matrix`\
    \ 命令直接构造数组或矩阵。`array` 命令接受一个向量和维度，并按列主序构造数组。如果你希望按行主序提供数据，则可以使用 `t` 命令对结果进行转置。\n\
    \n```r\n> a <- c(1,2,3,4,5,6)\n> A <- array(a,c(2,3))\n> A\n     [,1] [,2] [,3]\n\
    [1,]    1    3    5\n[2,]    2    4    6\n> t(A)\n     [,1] [,2]\n[1,]    1  \
    \  2\n[2,]    3    4\n[3,]    5    6\n```\n```\n\n你不必局限于二维数组。dim 选项可以包含任意数量的维度。在以下示例中，通过使用三个数字作为维度数量来创建三维数组：\n\
    \n```r\n> A <- array(1:24,c(2,3,4),dimnames=c(\"row\",\"col\",\"dep\"))\n> A\n\
    , , 1\n\n     [,1] [,2] [,3]\n[1,]    1    3    5\n[2,]    2    4    6\n\n, ,\
    \ 2\n\n     [,1] [,2] [,3]\n[1,]    7    9   11\n[2,]    8   10   12\n\n, , 3\n\
    \n     [,1] [,2] [,3]\n[1,]   13   15   17\n[2,]   14   16   18\n\n, , 4\n\n \
    \    [,1] [,2] [,3]\n[1,]   19   21   23\n[2,]   20   22   24\n\n> A[2,3,4]\n\
    [1] 24\n```\n```\n\n矩阵是二维数组，是可以通过 `matrix` 命令创建的一种特殊情况。`matrix` 命令不使用维度，而是要求指定行数或列数。该命令还有一个附加选项，用于指定数据是按行主序还是按列主序排列：\n\
    \n```r\n> B <- matrix(1:12,nrow=3)\n> B\n     [,1] [,2] [,3] [,4]\n[1,]    1 \
    \   4    7   10\n[2,]    2    5    8   11\n[3,]    3    6    9   12\n\n> B <-\
    \ matrix(1:12,nrow=3,byrow=TRUE)\n> B\n     [,1] [,2] [,3] [,4]\n[1,]    1   \
    \ 2    3    4\n[2,]    5    6    7    8\n[3,]    9   10   11   12\n```\n```\n\n\
    矩阵和数组都可以被操作以确定或更改其维度。dim 命令可用于获取或设置此信息：\n\n```r\n> C <- matrix(1:12,ncol=3)\n\
    > C\n     [,1] [,2] [,3]\n[1,]    1    5    9\n[2,]    2    6   10\n[3,]    3\
    \    7   11\n[4,]    4    8   12\n> dim(C)\n[1] 4 3\n> dim(C) <- c(3,4)\n> C\n\
    \     [,1] [,2] [,3] [,4]\n[1,]    1    4    7   10\n[2,]    2    5    8   11\n\
    [3,]    3    6    9   12\n```\n```\n\n## 数据筛选\n\n使用逻辑向量作为索引对于限制所检查的数据很有用。例如，要限制向量只检查数据集中的正值，可以使用逻辑比较作为向量的索引：\n\
    \n```r\n> u <- 1:6\n> v <- c(-1,1,-2,2,-3,3)\n> u\n[1] 1 2 3 4 5 6\n> v\n[1] -1\
    \  1 -2  2 -3  3\n> u[v > 0]\n[1] 2 4 6\n> u[v < 0] = -2*u[v < 0]\n> u\n[1]  -2\
    \  2  -6  4 -10  6\n```\n```\n\n逻辑索引对向量的另一个有用方面是使用 NA 数据类型。当向量包含未定义的数据时，is.na\
    \ 函数和逻辑非运算符 (!) 可以成为有用的工具：\n\n```r\n> v <- c(1,2,3,NA,4,NA)\n> v\n[1]  1  2  3\
    \ NA  4 NA\n> v[is.na(v)]\n[1] NA NA\n> v[!is.na(v)]\n[1] 1 2 3 4\n```\n```\n\n\
    请注意，许多函数都有可选参数，用于指定 R 对包含 NA 类型值的数据应如何反应。不幸的是，这种方式并不一致，你应该对任何特定函数使用 help 命令：\n\
    \n```r\n> v <- c(1,2,3,NA,4,NA)\n> v\n[1]  1  2  3 NA  4 NA\n> mean(v)\n[1] NA\n\
    > mean(v,na.rm=TRUE)\n[1] 2.5\n```\n```\n\n在最后一个示例中，mean 函数中的 na.rm 选项被设置为 TRUE，以指定\
    \ R 应忽略向量中为 NA 的条目。\n\n## 追加行和列\n\n`cbind` 和 `rbind` 命令可用于向现有对象追加数据。这些命令可用于向量、矩阵、数组，并扩展为也可作用于数据框。以下示例使用数据框，因为这是一种常见操作。你应该小心，并尝试在数组上使用这些命令，以确保操作行为符合预期。\n\
    \n`cbind` 命令用于将作为参数给定的数据的列组合起来：\n\n```r\n> d <- data.frame(one=c(1,2,3),two=as.factor(c(\"\
    one\",\"two\",\"three\")))\n> e <- c(\"ein\",\"zwei\",\"drei\")\n> newDataFrame\
    \ <- cbind(d,third=e)\n> newDataFrame\n  one   two third\n1   1   one   ein\n\
    2   2   two  zwei\n3   3 three  drei\n> newDataFrame$third\n[1] ein zwei drei\n\
    Levels: drei ein zwei\n```\n```\n\n如果 `cbind` 命令的参数是两个数据框（或两个数组），则该命令会组合所有数据框（数组）中的所有列：\n\
    \n```r\n> d <- data.frame(one=c(1,2,3),two=as.factor(c(\"one\",\"two\",\"three\"\
    )))\n> e <- data.frame(three=c(4,5,6),four=as.factor(c(\"vier\",\"funf\",\"sechs\"\
    )))\n> newDataFrame <- cbind(d,e)\n> newDataFrame\n  one   two three  four\n1\
    \   1   one     4  vier\n2   2   two     5  funf\n3   3 three     6 sechs\n```\n\
    ```\n\n`rbind` 命令将传递给它的对象的行连接起来。该命令使用列名来确定如何追加数据。列的数量和名称必须相同：\n\n```r\n> d <-\
    \ data.frame(one=c(1,2,3),two=as.factor(c(\"one\",\"two\",\"three\")))\n> e <-\
    \ data.frame(one=c(4,5,6),two=as.factor(c(\"vier\",\"funf\",\"sechs\")))\n> newDataFrame\
    \ <- rbind(d,e)\n> newDataFrame\n  one   two\n1   1   one\n2   2   two\n3   3\
    \ three\n4   4  vier\n5   5  funf\n6   6 sechs\n```\n```\n\n```\n2.00 0.75\n>\
    \ typeof(meanResult)\n[1] \"double\"\n```\n\n## tapply\n\ntapply 命令用于对数组中数据的不同部分应用函数。该函数至少接受三个参数。第一个是要对其应用操作的数据，第二个是定义数据相对于不同水平如何组织的一组因子，第三个是要执行的操作。在以下示例中，定义了一个包含树木直径的向量。还定义了第二个向量，用于指定每次观测所测量的树的种类。目标是找出每种树的标准差：\n\
    \n```\n> diameters <- c(28.8, 27.3, 45.8, 34.8, 25.3)\n> tree <- as.factor(c(\"\
    pine\",\"pine\",\"oak\",\"pine\",\"oak\"))\n> tapply(diameters,tree,sd)\n    \
    \  oak      pine\n14.495689  3.968627\n```\n\n## mapply\n\n最后一个要检查的命令是 mapply\
    \ 命令。mapply 命令接受一个要应用的函数和一个数组列表。该函数取出每个数组的第一个元素并应用于该列表。然后取出每个数组的第二个元素并应用该函数。如此重复，直到遍历每个元素。请注意，如果其中一个数组的元素比其他数组少，mapply\
    \ 命令将重置并从该数组的开头开始以填充缺失的值：\n\n```\n> a <- c(1,2,3)\n> b <- c(1,2,3)\n> mapply(sum,a,b)\n\
    [1] 2 4 6\n>\n```\n"
