    ## 正则表达式


    上一节中介绍的命令缺乏灵活性，但它们的实现方式简单直接。另一方面，在某些情况下，使用正则表达式可以提供更优雅的方法，但它们可能更复杂。我们简要了解一下几个允许通过正则表达式进行字符串操作的命令，并假设你已经熟悉正则表达式。要获取更多关于
    R 中正则表达式的信息，可以使用 `help(regular expression)` 命令。


    在本节中，我们将重点介绍 `gregexpr` 和 `gsub` 命令。当你输入 `help(gregexpr)` 命令时，还会列出许多其他命令。此外，这些命令有许多选项，但我们只介绍它们最基本的形式。需要提一下的是，之前讨论过的
    `grep` 命令所接收的模式也可以是正则表达式。


    `gregexpr` 命令是一个通用命令，它返回与正则表达式相关的结果数量。具体来说，它会返回匹配的位置、是否找到匹配项以及匹配项的字符数。该函数的第一个参数是一个模式，然后是待匹配的字符串。该函数返回一个包含匹配信息的列表。在下面的示例中，我们检查搜索前面定义的
    `urls` 向量第一个元素中 `=` 分隔符的结果：


    ```

    > loc <- gregexpr("=", urls[[1]])

    > loc

    [[1]]

    [1] 25

    attr(","match.length")

    [1] 1

    attr(","useBytes")

    [1] TRUE


    > loc[[1]][1]

    [1] 25

    ```


    请注意，该函数返回一个列表。由于使用单个方括号会返回另一个列表，所以我们使用双方括号以确保返回的是列表中的元素（作为一个向量）。


    `sub` 命令可用于替换字符串中所有符合条件的模式。该函数接受三个参数：模式、替换字符串以及用于执行操作的字符串：


    ```

    > sub("\\?.*$", "", urls)

    [1] "https://duckduckgo.com"      "https://search.yahoo.com/search"

    [3] "http://www.bing.com/search"  "http://www.google.com/search"

    ```


    请注意，在前面的示例中必须使用两个反斜杠。第一个反斜杠用于表示下一个字符是一个需要被解释的符号；如果使用了第二个反斜杠，则意味着将这一对符号解释为一个反斜杠。


    ## 摘要


    在本章中，我们探讨了多种操作字符串变量的方法。我们研究了两大类方法。第一组函数提供了多种功能范围较窄的函数。这些函数相对简单直接，但通常需要配合使用才能完成复杂的任务。第二组函数使用正则表达式，可以通过少量步骤完成一组复杂的任务。


    在下一章中，我们将讨论与时相关的变量处理。这包括将字符串转换为 R 的内置时间类型，以及能够在时间变量上执行的操作种类。


    ## 第 6 章 转换和定义时间变量


    本章概述了转换和存储时间变量的各种方法。这是一个比较常规的主题，但数据中通常会包含各种形式的日期和时间信息。本章大致分为三个部分：


    - **将字符串转换为时间数据类型**：本节介绍如何将文本格式的时间戳转换并存储为 R 的一种内部时间格式。

    - **将时间数据类型转换为字符串**：本节介绍如何将时间数据类型转换为字符串，以便能以标准格式保存到文件中。

    - **时间数据类型的运算**：本节概述了在时间数据类型上执行基本算术运算的方法和技术。


    ### 引言与假设


    日期和时间信息通常作为数据集的一部分被保存。将这类信息转换为日期或时间变量是较为枯燥的工作之一，而且需要格外细心。在本章中，我们将讨论转换字符串与数据类型的方法，并演示如何执行基本的算术运算。有一点很重要：处理时间和日期数据会在多种不同的情境中出现，也有许多不同的库（如
    `chron`、`lubridate` 和 `date`）可以帮助你处理时间和数据变量。


    不过，我们这里的重点是 R 中用于处理时间和日期数据的内置函数。需要注意的是，这里讨论的命令可能对数据文件中的细微变化很敏感，因此你应该经常检查自己的工作，尤其是时间数据方面。这可能是一项乏味的任务，但确保数据正确非常重要。如果你经常处理时间数据，应该阅读
    `help(DateTimeClasses)` 命令中给出的详细信息。


    另一个复杂之处在于时区可能会发生变化，与时间数据相关的通用做法也可能会改变。例如，新的时区可能会被更改、创建或移除，或者某个区域可能会更改其时区。你应该始终确保自己处理时间数据的做法与生成数据时所采用的做法保持一致。


    ### 将字符串转换为时间数据类型


    我们要探讨的第一个任务是将字符串转换并存储为各种内部时间格式。`strptime` 命令接受一个字符串并将其转换为 POSIXlt 时间变量。如果希望将字符串转换为
    POSIXct 数据类型，可以使用 `as.POSIXct` 命令转换 `strptime` 的结果。我们首先关注如何将字符串转换为 POSIXlt 数据类型，并在本节末尾给出一个转换为
    POSIXct 数据类型的示例。


    要将字符串转换为时间数据类型，必须指定该字符串的格式，且格式选项必须符合 ISO C99/POSIX 标准。字符串包含一系列字面字符和一部分转换子字符串，*表
    1* 中给出了部分列表。例如，`%Y-%m-%d %H:%M:%S` 字符串表示，当日期为 2014 年 5 月 14 日上午 9:54 时，其显示形式应为
    *2014-05-14 09:54:10*。一个字符串可以包含任意数量的预定义字符串。除此之外的内容都被视为字面字符，必须与格式字符串中显示的形式完全一致。


    一旦指定了格式字符串，就可以使用 `strptime` 命令将字符串转换为 POSIXlt 数据类型。该命令的参数为要转换的字符串，后跟格式字符串：


    ```

    > theTime <- c("08:30:00 1867-07-01", "18:15:00 1864-10-27")

    > converted <- strptime(theTime,"%H:%M:%S %Y-%m-%d")

    > converted

    [1] "1867-07-01 08:30:00" "1864-10-27 18:15:00"

    > typeof(converted[1])

    [1] "list"

    > converted[1]-converted[2]

    Time difference of 976.5938 days

    ```


    该命令还接受一个可选的时区选项，如下所示：


    ```

    > theTime <- c("08:30:00 1867-07-01", "18:15:00 1864-10-27")

    > converted <- strptime(theTime,"%H:%M:%S %Y-%m-%d", + tz="Canada/Eastern")

    > converted

    [1] "1867-07-01 08:30:00 EST" "1864-10-27 18:15:00 EST"

    > converted[1]-converted[2]

    Time difference of 976.5938 days

    ```


    `strptime` 命令返回的结果是 POSIXlt 数据类型。可以使用 `as.POSIXct` 命令对其进行转换：


    ```

    > theTime <- c("08:30:00 1867-07-01", "18:15:00 1864-10-27")

    > converted <- strptime(theTime,"%H:%M:%S %Y-%m-%d", tz="Canada/Eastern")

    > converted

    [1] "1867-07-01 08:30:00 EST" "1864-10-27 18:15:00 EST"

    > typeof(converted[1])

    [1] "list"

    > otherTime <- as.POSIXct(converted)

    > otherTime

    [1] "1867-07-01 08:30:00 EST" "1864-10-27 18:15:00 EST"

    > typeof(otherTime[1])

    ```


