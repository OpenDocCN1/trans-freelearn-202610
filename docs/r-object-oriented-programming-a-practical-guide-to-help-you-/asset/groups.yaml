    \n## 摘要\n\n本章介绍了指定某些命令可选执行的基本思想以及三种基本循环结构。我们不得不顺带讨论作用域的概念，并探索 R 如何查找和解释变量名的含义。你可以结合这些思想来创建和实现算法，并在文件中执行命令。\n\
