    \ to apply an operation, the second is the set of factors that defines how the\
    \ data is organized with respect to the different levels, and the third is the\
    \ operation to perform. In the following example, a vector is defined that has\
    \ the diameter of trees. A second vector is defined, which specifies what kind\
    \ of tree was measured for each observation. The goal is to find the standard\
    \ deviation for each type of tree:\n\n```\n> diameters <- c(28.8, 27.3, 45.8,\
    \ 34.8, 25.3)\n> tree <- as.factor(c(\"pine\",\"pine\",\"oak\",\"pine\",\"oak\"\
    ))\n> tapply(diameters,tree,sd)\n      oak      pine\n14.495689  3.968627\n```\n\
    \n# mapply\n\nThe last command to examine is the mapply command. The mapply command\
    \ takes a function to apply and a list of arrays. The function takes the first\
    \ elements of each array and applies the function to that list. It then takes\
    \ the second elements of each array and applies the function. This is repeated\
    \ until it goes through every element. Note that if one of the arrays has fewer\
    \ elements than the others, the mapply command will reset and start at the beginning\
    \ of that array to fill in the missing values:\n\n```\n> a <- c(1,2,3)\n> b <-\
    \ c(1,2,3)\n> mapply(sum,a,b)\n[1] 2 4 6\n>\n```"
