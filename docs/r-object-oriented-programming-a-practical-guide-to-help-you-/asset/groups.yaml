    ## 第2章 组织数据


    在本章中，我们将探讨用于组织数据的主要数据结构。我们将讨论在数据结构中访问信息的一些细节，以及如何对数据结构中的数据部分应用不同操作的一些方法。本章大致分为三个部分：


    - **基本数据结构：** 本节介绍如何使用向量、列表、数据框、表格、矩阵和时间序列。

    - **访问和管理内存：** 本节概述访问和筛选特定元素的基本方法。

    - **数据结构上的操作：** 本节概述用于在不同类型的数据结构内执行操作的方法。


    ### 基本数据结构


    在 R 环境中用于组织数据的基本数据结构包括向量、列表、数据框、表格和矩阵。这里，我们将详细介绍每种数据结构，并演示如何创建它们。本章不包含如何从文件读取数据的信息，重点在于数据结构本身。有关从文件读取数据的更多信息，请参阅
    [第3章](#) *保存数据与打印结果*。


    ### 向量


    R 中的默认数据结构是向量。例如，如果将变量定义为单个数字，R 会将其视为长度为 1 的向量：


    ```r

    > a <- 5

    > a[1]

    [1] 5

    ```


    向量提供了一种便捷而直接的方式来存储一长串数字。更多创建向量的示例，请参阅 [第1章](#) *数据类型*。定义向量的一种常用且便捷的方法是使用 `c` 命令。`c`
    命令将一组参数连接起来形成一个向量：


    ```r

    > v <- c(1,3,5,7,-10)

    > v

    [1]    1   3   5   7 -10

    > v[4]

    [1] 7

    > v[2] <- v[1]-v[5]

    > v

    [1]    1  11   5   7 -10

    ```


    另外两种生成向量的方法使用 `:` 表示法和 `seq` 命令。`:` 表示法用于为给定的起始值和结束值创建一个连续编号的值列表。`seq` 命令的作用相同，但它提供了更多选项来确定向量中值之间的增量：


    ```r

    > 1:5

    [1] 1 2 3 4 5

    > 10:14

    [1] 10 11 12 13 14

    > a <- 3:7

    > a

    [1] 3 4 5 6 7

    > b <- seq(3,5)

    > b

    [1] 3 4 5

    > b <- seq(3,10,by=3)

    > b

    [1] 3 6 9

    ```


    ### 列表


    另一种重要的类型是列表。列表非常灵活，是一种非结构化的信息组织方式。可以将列表看作一组命名对象的集合。使用 `list` 命令创建列表，并可以使用 `is.list`
    和 `as.list` 命令测试或强制转换变量。通过 `$` 字符访问列表中的组件，以指定要使用列表中的哪个对象。例如，假设我们要创建一个列表来记录实验的参数。第一个组件名为
    `means`，是一个包含假定均值的向量。第二个组件是置信水平，第三个组件是实验参数 `maxRealEigen` 的值：


    ```r

    > assumedMeans <- c(1.0,1.5,2.1)

    > alpha <- 0.05

    > eigenValue <- 3+2i

    > l <- list(means=assumedMeans,alpha=alpha,maxRealEigen=eigenValue)

    > l

    $means

    [1] 1.0 1.5 2.1

    $alpha

    [1] 0.05

    $maxRealEigen

    [1] 3+2i


    > l$means

    [1] 1.0 1.5 2.1

    > l$means[2]

    [1] 1.5

    ```


    `names` 和 `attributes` 命令可用于确定列表中的组件。`attributes` 命令是一个更通用的命令，可用于列出类及更广泛对象的组件。请注意，`names`
    命令也可以用来重命名列表中的组件。在下面的示例中，我们使用上一个示例，但更改了元素的名称：


    ```r

    > l <- list(means=c(1.0,1.5,2.1),alpha=0.05,maxRealEigen=3+2i)

    > names(l)

    [1] "means"          "alpha"          "maxRealEigen"

    > names(l) <- c("assumedMeans","confidenceLevels","maximumRealValue")

    > l

    $assumedMeans

    [1] 1.0 1.5 2.1

    $confidenceLevels

    [1] 0.05

    $maximumRealValue

    [1] 3+2i

    ```


