    \ grade (an object from the `NumericGrade` class); otherwise, it is assumed to\
    \ be a letter grade (an object from the `LetterGrade` class):\n\n```\n```r\nsetGeneric(name=\"\
    ReadGrades\",\n           def=function(course)\n           {\n               standardGeneric(\"\
    ReadGrades\")\n           }\n)\n```\n```\n\n```\n```r\nsetMethod(f=\"ReadGrades\"\
    ,\n          signature=\"Course\",\n          definition=function(course)\n  \
    \        {\n              grades <- read.csv(GetFileName(course))\n          \
    \    convertedGrades <- list()\n              courseTypes <- GetGradeTypes(course)\n\
