    ```


    As an alternative to the help command, the ? operator can also be used to get
    the help page for a given command. An additional command is the help.search command
    that is used to search the help files for a given string. The ?? operator is also
    available to perform a search for a given string.


    The information in a file can be read back into the workspace using the load command:


    ```

    ```r

    > load("a.RData")

