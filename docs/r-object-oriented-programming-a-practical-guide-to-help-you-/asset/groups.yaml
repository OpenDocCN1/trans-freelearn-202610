    The `ReadGrades` method first reads the `csv` file. It then goes through the columns\
    \ that were read from the file, and the names of the columns are assumed to be\
    \ in the first row of the file. If the first letters in the name of a column match\
    \ one of the strings that are in the vector (found in the `GradeTypes` slot),\
    \ then it is assumed that the column represents a graded item. There are two kinds\
    \ of assignments: numerical grades or letter grades. If a column from the data\
    \ file is determined to be a graded item, then its type is checked. If the type\
