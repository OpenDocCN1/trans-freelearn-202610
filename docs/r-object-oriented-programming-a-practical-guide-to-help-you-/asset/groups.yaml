    # Lists


    Another important type is the list. Lists are flexible and are an unstructured
    way of organizing information. A list can be thought of as a collection of named
    objects. A list is created using the `list` command, and a variable can be tested
    or coerced using the `is.list` and `as.list` commands. A component within a list
    is accessed using the `$` character to denote which object within the list to
    use. As an example, suppose that we want to create a list to keep track of the
    parameters for an experiment. The first component, called means, will be a vector
    of the assumed means. The second component will be the confidence level, and the
    third component will be the value of a parameter for the experiment called maxRealEigen:


    ```

    ```r

    > assumedMeans <- c(1.0,1.5,2.1)

    > alpha <- 0.05

    > eigenValue <- 3+2i

    > l <- list(means=assumedMeans,alpha=alpha,maxRealEigen=eigenValue)

    > l

    $means

    [1] 1.0 1.5 2.1

    $alpha

    [1] 0.05

    $maxRealEigen

    [1] 3+2i


    > l$means

    [1] 1.0 1.5 2.1

    > l$means[2]

    [1] 1.5

    ```

    ```


    The names and attributes commands can be used to determine the components within
    a list. The attributes command is a more generic command that can be used to list
    the components of classes and a wider range of objects. Note that the names command
    can also be used to rename the components of a list. In the following example,
    we use the previous example but change the names of the elements:


    ```

    ```r

    > l <- list(means=c(1.0,1.5,2.1),alpha=0.05,maxRealEigen=3+2i)

    > names(l)

    [1] "means"          "alpha"          "maxRealEigen"

    > names(l) <- c("assumedMeans","confidenceLevels","maximumRealValue")

    > l

    $assumedMeans

    [1] 1.0 1.5 2.1

    $confidenceLevels

    [1] 0.05

    $maximumRealValue

    [1] 3+2i

    ```

    ```'
