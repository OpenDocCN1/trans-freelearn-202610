    # # Converting time data types to strings


    A date and time variable can be converted to a string using the `strftime` command.
    Its format is similar to the `strptime` command, except it has one additional
    option to determine whether or not to include time zone information in the resulting
    string. The command is a convenience function, and it calls either the `format.POSIXlt`
    or `format.POSIXct` command depending on the data type of the time variable. We
    focus on the `strftime` command because it is familiar to people from a wider
    variety of programming experiences.


    The `strftime` command requires a time variable and a format. It returns a string
    in the given format (some format options are given in *Table 1*):


    ```

    ```r

    > theTime <- c("08:30:00 1867-07-01", "18:15:00 1864-10-27")

    > converted <- strptime(theTime,"%H:%M:%S %Y-%m-%d",

    + tz="Canada/Eastern")

    > converted

    [1] "1867-07-01 08:30:00 EST" "1864-10-27 18:15:00 EST"

    > typeof(converted)

    [1] "list"

    > backAgain <- strftime(converted,"%j - %B")

    > backAgain

    [1] "182 - July"   "301 - October"

    > typeof(backAgain[1])

    [1] "character"

    ```

    ```'
  - '[PAGE 143]


    # # Operations on time data types


    A variety of arithmetic operations are available for the time data types, and
    you should be especially wary when performing any operations. The units that are
    returned can vary depending on the context. It is extremely easy to lose track
    of the units and make a spurious comparison. In this section, I’ll introduce some
    of the basic operations and then discuss the `difftime` command. It is possible
    to perform any operation without the `difftime` command, but the command has an
    important advantage: it allows you to explicitly define the units.


    When you perform simple arithmetic on time data types, it acts in the way you
    might expect:


    ```

    ```r

    > earlier <- strptime("2014-01-01 00:00:00", "%Y-%m-%d %H:%M:%S")

    > later <- strptime("2014-01-02 00:00:00", "%Y-%m-%d %H:%M:%S")

    > later-earlier

    Time difference of 1 days

    > timeDiff <- later-earlier

    > timeDiff

    Time difference of 1 days

    > as.double(timeDiff)

    [1] 1

    > earlier+timeDiff

    [1] "2014-01-02 EST"

    ```

    ```


    Note that in the previous example, the units used are given in days. One small
    change, though, results in a different kind of result:


    ```

    ```r

    > earlier <- strptime("2014-01-01 00:00:00", "%Y-%m-%d %H:%M:%S")

    > later <- strptime("2014-01-01 12:00:00", "%Y-%m-%d %H:%M:%S")

    > later-earlier

    Time difference of 12 hours

    > timeDiff <- later-earlier

    > timeDiff

    Time difference of 12 hours

    > as.double(timeDiff)

    [1] 12

    ```

    ```


    The R environment will keep track of the difference and its units. If you look
    at the `difftime` variable in the previous example, it contains information about
    what it means:


    ```

    ```r

    > attributes(timeDiff)

    $units

    [1] "hours"


    $class

    [1] "difftime"


    > attr(timeDiff,"units")

    [1] "hours"

    ```

    ```


    You can specify the units by casting the result as a numeric value and providing
    the units to use:'
  - '[PAGE 144]


    ```

    ```r

    > earlier <- strptime("2014-01-01 00:00:00", "%Y-%m-%d %H:%M:%S")

    > later <- strptime("2014-01-01 12:00:00", "%Y-%m-%d %H:%M:%S")

    > timeDiff <- later-earlier

    > timeDiff

    Time difference of 12 hours

    > as.numeric(timeDiff,units="weeks")

    [1] 0.07142857

    > as.numeric(timeDiff,units="secs")

    [1] 43200

    ```

    ```


    Because of potential ambiguities, it is usually advantageous to use the `difftime`
    command. The difftime command offers a wide range of options, and you should carefully
    read its help page, `help(difftime)`, to see the options and details. In its most
    basic use, you can find the difference between two times, and you can specify
    what units to use:


    ```

    ```r

    > earlier <- strptime("2014-01-01 00:00:00", "%Y-%m-%d %H:%M:%S")

    > later <- strptime("2014-01-01 12:00:00", "%Y-%m-%d %H:%M:%S")

    > timeDiff <- difftime(later,earlier,units="sec")

    > timeDiff

    Time difference of 43200 secs

    > timeDiff <- difftime(later,earlier,units="day")

    > timeDiff

    Time difference of 0.5 days

    ```

    ```


    The units that are available are auto, secs, mins, hours, days, or weeks.


    One final note; the `difftime` data type offers a convenient way to perform some
    time arithmetic options. The `as.difftime` command can be used to specify a time
    interval, and you can specify the units, so it is more likely that the results
    are consistent with your expectations:


    ```

    ```r

    > later <- strptime("2014-01-01 12:00:00", "%Y-%m-%d %H:%M:%S")

    > oneHour = as.difftime(1,units="hours")

    > later+oneHour

    [1] "2014-01-01 13:00:00 EST"

    ```

    ```'
