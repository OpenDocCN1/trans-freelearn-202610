    # # The Course class


    The Course class is used to keep track of all of the grades for a course. This
    class will read in the information from a file, decide whether grades are numeric
    grades or letter grades, and create an appropriate assignment object to hold the
    grades. The details for the class are shown in the following figure. We’ll first
    discuss the data and then the methods associated with the class. We’ll then give
    some details on how to define the class. Most of the code associated with the
    accessors is omitted for the sake of brevity, but the full code is available on
    the website associated with this book.


    ![](img/18eeabe9ab8c81c5a3f4040db5906c67_215_0.png)


    First, there are three data structures (slots) associated with the class. The
    first is the name of the CSV file that contains all of the grades for the class.
    The second is a vector of prefixes used to determine what kind of graded tasks
    are in the file. The last is a list that contains all of the assignments.


    There are seven methods. All but one are used to set and get the values for the
    three slots. The accessor routines to get and set the filename are given here,
    and the others are not included in the text here. The last routine is used to
    read the grades, and it is a complex method that reads the data from the file
    and then determines whether the assignment has numerical or letter grades. It
    then defines an appropriate assignment object.'
