    \ FALSE\n```\n\n`incoming` 变量现在将包含操作的结果。\n\n## 总结\n\n在本章中，我们探讨了可用于将信息读写到文件的一些工具，以及从命令行输入数据的方法。我们研究了在目录之间切换和获取目录信息的方法。\n\
    \n在研究了读取数据的方法之后，我们探讨了显示信息的一些方式。我们首先研究了如何在命令行上打印信息，然后探讨了如何将数据保存到本地文件。我们还探讨了如何保存当前工作空间并在以后的会话中召回使用。\n\
    \n探讨的一个重要主题是如何处理不符合基本格式的文件。我们研究了读取数据所需的命令，包括文本和二进制形式，其中数据文件遵循预定义的结构。\n\n最后探讨的主题是如何使用网络连接读取信息。这包括使用套接字连接器来访问结构相对良好的信息。我们还探讨了更原始选项，这些选项允许我们以更基本的形式创建和操作套接字。\n\
    \n在前面的章节中，我们研究了存储数据的基本方法。在下一章 [第 4 章](#)，*计算概率与随机数* 中，我们将初步了解可帮助我们理解如何解释数据的函数。我们将探讨一些可用于处理各种预定义概率分布的选项。\n\
    \n| 分布 | 后缀 | 分布 | 后缀 |\n| --- | --- | --- | --- |\n| 负二项分布 | `nbinom` | 学生 t\
    \ 分布 | `t` |\n| 泊松分布 | `pois` | 均匀分布 | `unif` |\n|  |  | 威布尔分布 | `weibull` |\n\
    \n*表 1 – 分布列表及 R 中用于引用它们的后缀*\n\n## 分布函数\n\n我们首先讨论如何在 R 中计算分布函数的值。然后我们将讨论离散分布，接着是连续分布。分布函数用于确定特定事件发生的概率。对于离散分布，该函数称为概率质量函数；对于连续分布，则称为概率分布函数。对于离散分布，概率使用求和来计算，其中\
    \ *f(i)* 是概率质量函数：\n\n![](img/18eeabe9ab8c81c5a3f4040db5906c67_111_0.png)\n\n每个分布都有与其关联的参数，强烈建议明智地使用帮助命令。例如，要获取有关泊松分布的更多信息，可以使用\
    \ `help(dpois)` 命令。对于泊松分布，`dpois` 命令需要两个参数。第一个是 x，第二个是 lambda。该函数返回具有 lambda 参数的泊松随机变量返回\
    \ x 给定值的概率。\n\n例如，要绘制参数为 10 的泊松分布的概率，使用以下命令生成可以返回的值（称为 x），并使用条形图显示它们：\n\n```r\n\
    > x <- 0:20\n> probabilities <- dpois(x,10.0)\n> barplot(probabilities,names.arg=x,xlab=\"\
    x\",ylab=\"p\",main=\"Poisson Dist, l=10.0\")\n```\n\n对于连续分布，随机变量可以取一系列值，并且我们不使用加法，而是找到曲线\
    \ *f(s)* 下的面积，该曲线称为概率密度函数：\n\n![](img/18eeabe9ab8c81c5a3f4040db5906c67_111_1.png)\n\
    \n在下一个示例中，我们使用 X² 分布。X² 分布背后的思想是，你采样 *n* 个遵循标准正态分布的独立随机变量。然后对采样的值进行平方并将它们相加。结果被定义为\
    \ X² 分布。请注意，有一个参数 *n*，通常通过给出 *自由度* 来指定，其定义为 *n-1*。自由度通常称为 *df*。\n\n对于此示例，获取概率密度函数近似值的命令是\
    \ `dchisq`，它接受两个参数 x 和 df。在这里，我们绘制概率\n\n"
