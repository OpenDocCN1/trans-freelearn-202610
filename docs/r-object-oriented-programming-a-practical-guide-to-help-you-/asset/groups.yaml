    \ logical statement. The first element in the vector is used to decide whether\
    \ a whole statement is TRUE or FALSE. Fortunately, R will give a warning if the\
    \ condition evaluates to a vector of length greater than one:\n\n```\n> x <- c(1,2)\n\
    > if(x < 2) {\n+   cat(\"Oh yes it is\\n\")\n+ }\nOh yes it is\nWarning message:\n\
    In if (x < 2) { :\n  the condition has length > 1 and only the first element will\
    \ be used\n```\n\nThis is something to keep in mind when deciding which logical\
    \ operator to use in an if statement. For example, the | operator will perform\
    \ a logical OR on all elements of the vectors, but the || operator will only perform\
    \ a logical OR on the first elements of the vectors:\n\n```\n> x <- c(FALSE,FALSE,TRUE)\n\
    > y <- c(FALSE,TRUE,TRUE)\n> x|y\n[1] FALSE  TRUE  TRUE\n> x||y\n[1] FALSE\n```\n\
    \nA variety of logical operators are recognized. Some provide comparisons between\
    \ all entries in a vector and others are for comparisons only for the first elements\
    \ in the vectors. A list of the operators is given in the following table:\n\n\
    | Operator | Description | Operator | Description |\n|---|---|---|---|\n| < |\
    \ Less than (vector) | | | Or (vector) |\n| > | Greater than (vector) | || | Or\
    \ (first entry only) |\n| <= | Less than or equal (vector) | ! | Not (vector)\
    \ |\n| >= | Greater than or equal (vector) | & | And (vector) |\n| == | Equal\
    \ to (vector) | && | And (first entry only) |\n| != | Not equal to (vector) |\
    \ xor(a,b) | Exclusive or (vector) |\n\nTable 1 – The logical operators including\
    \ comparison operators"
  - "[PAGE 151]\n\n# Loop constructs\n\nAnother important programming task is to create\
    \ a set of instructions that can be repeated in a structured way. There are three\
    \ loop constructs in R: for, while, and repeat loops. We will explore each of\
    \ these loop constructs and discuss the break and next commands, which can control\
    \ how the instructions within a loop’s code block are executed. More details are\
    \ available using the help(Control) command.\n\n# The for loop\n\nA for loop takes\
    \ a vector, and it repeats a block of code for each value in the vector. The syntax\
    \ is as follows:\n\n```\nfor(var in vector)\n  code block\n```\n\nThe for loop\
    \ repeats a set of instructions for every value within a vector in the appropriate\
    \ order. It can be memory intensive if you need to repeat the loop a lot of times\
    \ and the vector is not already stored in the workspace. An example of a simple\
    \ for loop is given here:\n\n```\n> for(lupe in seq(1,2,by=0.33))\n+ {\n+   cat(\"\
    The value of lupe is \",lupe,\"\\n\")\n+ }\nThe value of lupe is  1\nThe value\
    \ of lupe is  1.33\nThe value of lupe is  1.66\nThe value of lupe is  1.99\n```\n\
    \n# The while loop\n\nA while loop will execute a code block as long as a given\
    \ expression is true. The syntax is as follows:\n\n```\nwhile(condition)\n  code\
    \ block\n```\n\nThey are often used when the number of iterations is not known\
    \ in advance and the loop is repeated until some criteria is met. Also, the while\
    \ loop has some advantages over the for loop. It can be more efficient, especially\
    \ with respect to memory, and it is more flexible (RMemory, Please refer to RMemory:\
    \ Hadley Wickham, memory, 2014, http://adv-r.had.co.nz/memory.html for more information\
    \ on this topic). For example, instead of constructing a large vector to iterate\
    \ over its elements, a single index can be used. On the down side, it can be harder\
    \ to read, and it can require a little more care when writing the code. An example\
    \ is given here:\n\n```\n> lupe <- 1.0;\n> while(lupe <= 2.0)\n+ {\n+   cat(\"\
    The value of lupe is \",lupe,\"\\n\")\n+   lupe <- lupe + 0.33\n```"
