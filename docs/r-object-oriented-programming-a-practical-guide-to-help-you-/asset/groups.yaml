    $units\n[1] \"hours\"\n\n$class\n[1] \"difftime\"\n\n> attr(timeDiff,\"units\"\
    )\n[1] \"hours\"\n```\n\nYou can specify the units by casting the result as a\
    \ numeric value and providing the units to use:\n\n```r\n> earlier <- strptime(\"\
    2014-01-01 00:00:00\", \"%Y-%m-%d %H:%M:%S\")\n> later <- strptime(\"2014-01-01\
    \ 12:00:00\", \"%Y-%m-%d %H:%M:%S\")\n> timeDiff <- later-earlier\n> timeDiff\n\
    Time difference of 12 hours\n> as.numeric(timeDiff,units=\"weeks\")\n[1] 0.07142857\n\
    > as.numeric(timeDiff,units=\"secs\")\n[1] 43200\n```\n\nBecause of potential\
    \ ambiguities, it is usually advantageous to use the `difftime` command. The `difftime`\
    \ command offers a wide range of options, and you should carefully read its help\
    \ page, `help(difftime)`, to see the options and details. In its most basic use,\
    \ you can find the difference between two times, and you can specify what units\
    \ to use:\n\n```r\n> earlier <- strptime(\"2014-01-01 00:00:00\", \"%Y-%m-%d %H:%M:%S\"\
    )\n> later <- strptime(\"2014-01-01 12:00:00\", \"%Y-%m-%d %H:%M:%S\")\n> timeDiff\
    \ <- difftime(later,earlier,units=\"sec\")\n> timeDiff\nTime difference of 43200\
    \ secs\n> timeDiff <- difftime(later,earlier,units=\"day\")\n> timeDiff\nTime\
    \ difference of 0.5 days\n```\n\nThe units that are available are auto, secs,\
    \ mins, hours, days, or weeks.\n\nOne final note; the `difftime` data type offers\
    \ a convenient way to perform some time arithmetic operations. The `as.difftime`\
    \ command can be used to specify a time interval, and you can specify the units,\
    \ so it is more likely that the results are consistent with your expectations:\n\
    \n```r\n> later <- strptime(\"2014-01-01 12:00:00\", \"%Y-%m-%d %H:%M:%S\")\n\
    > oneHour = as.difftime(1,units=\"hours\")\n> later+oneHour\n[1] \"2014-01-01\
    \ 13:00:00 EST\"\n```\n\n## Summary\n\nA broad overview of the options available\
    \ to convert between strings and the two time data types was given in this chapter.\
    \ The `strptime` command is used to convert a string into a POSIXlt variable.\
    \ The `strftime` command is used to convert a time data type into a string. Finally,\
    \ the basic operators used to perform arithmetic operations between two time variables\
    \ was discussed, with an emphasis on using the `difftime` command. We also explored\
    \ the use of the `difftime` data type.\n\n## Conditional execution\n\nThe first\
    \ control construct examined is the if statement. An if statement will determine\
    \ whether or not a code block should be executed, and it has an optional else\
    \ statement. An additional if statement can be chained to an else statement to\
    \ create a cascade of options.\n\nIn its most basic form, an if statement has\
    \ the following form:\n\n```\nif(condition)\n    code block\n```\n\nThe condition\
    \ can be a logical statement constructed from the operators given in the next\
    \ table, or it can be a numeric result. If the condition is numeric, then zero\
    \ is considered to be FALSE, otherwise the statement is TRUE. The code block can\
    \ either be a single statement or a set of statements enclosed in braces:\n\n\
    ```\n> # check if 1 is less than 2\n> if(1<2)\n+     cat(\"one is smaller than\
    \ two.\\n\")\none is smaller than two.\n> if(2>1) {\n+     cat(\"But two is bigger\
    \ yet.\\n\")\n+ }\nBut two is bigger yet.\n```\n\nNote that a comment is included\
    \ in the previous code. The # character is used to denote a comment. Anything\
    \ after the # character is ignored.\n\nThe if statement can be extended using\
    \ an else statement. The else statement allows you to specify a code block to\
    \ execute if the condition does not evaluate to TRUE:\n\n```\n> if(1>2) {\n+ \
    \    cat(\"One is the most biggest number\\n\")   # Say something wrong\n+ } else\
    \ {\n+     cat(\"One is the loneliest number\\n\")      # Say something less wrong\n\
    + }\nOne is the loneliest number\n```\n\nThe first thing to note about these examples\
    \ is that a **Kernighan and Ritchie (K&R)** indentation style is adopted. We adopted\
    \ the K&R style because the else statement must be on the same line as the closing\
    \ brace. The second thing to note is that another if statement can be appended\
    \ to the else statement so that a standard if-then-else block can be constructed:\n\
    \n```\n> if(0) {\n+     cat(\"Yes, that is FALSE.\\n\")\n+ } else if (1) {\n+\
    \     cat(\"Yes, that is TRUE\\n\")\n+ } else {\n+     cat(\"Whatever\")\n+ }\n\
    Yes, that is TRUE\n```\n\nOne potential issue is that R does not have a scalar\
    \ type and assumes most data types are\n"
