    ## Chapter 6. Converting and Defining Time Variables


    This chapter provides a broad overview of the ways to convert and store time variables.
    This is a mundane topic, but it is common to have data that contains date and
    time information in a wide variety of forms. There are roughly three parts in
    this chapter:


    - **Converting strings to time data types**: This section gives you an introduction
    to the methods available to take a time stamp in text format and convert it into
    one of R’s internal time formats

    - **Converting time data types to strings**: This section gives you an introduction
    to the methods available to take a time data type and convert it to a string so
    that it can be saved to a file in a standard format

    - **Operations on time data types**: This section gives you an overview of the
    methods and techniques used to perform basic arithmetic on time data types


    ### Introduction and assumptions


    Date and time formations are often saved as part of the information within a dataset.
    Converting the information into a date or time variable is one of the less exciting
    chores to perform, and it is something that requires a great deal of care. In
    this chapter, we will discuss the ways of transforming strings and data types
    and demonstrate how to perform basic arithmetic operations. It is important to
    note that working with time and date data occurs in a number of different contexts,
    and there are a number of different libraries, such as chron, lubridate, and date,
    to help you work with time and data variables.


    Our focus here, though, is on R’s built-in functions used to work with time and
    date data. It is important to note that the commands explored here can be sensitive
    to small variations within a data file, and you should always double check your
    work especially with respect to time data. It can be a tedious task, but it is
    important to make sure that the data is correct. If you commonly work with time
    data, you should read the details found using the `help(DateTimeClasses)` command.


    Another complication is that time zones can change, and the general practices
    associated with time data can change. For example, new time zones can be changed,
    created, or removed, or a region can change its time zone. You should always ensure
    that your practices associated with time data are consistent with the practice
    used to generate the data that you have.


    ### Converting strings to time data types


    The first task to examine is to take a string and convert it to each of the internal
    time formats. The `strptime` command will take a string and convert it to a POSIXlt
    time variable. If you wish to convert a string to a POSIXct data type, you can
    cast the result of `strptime` using the `as.POSIXct` command. We first focus on
    converting a string to a POSIXlt data type and provide an example at the end of
    this section to be converted to a POSIXct data type.


    To convert a string to a time data type, the format for the string must be specified,
    and the formatting options must conform to the ISO C99/POSIX standard. The string
    includes a sequence of literal characters and a partial list of conversion substrings,
    which is given in *Table 1*. For example, the `%Y-%m-%d %H:%M:%S` string indicates
    that the date should look like *2014-05-14 09:54:10* when referring to May 14,
    2014 at 9:54 in the morning. A string is assumed to include any number of predefined
    strings. Anything else is considered to be a literal character that must appear
    exactly as it appears in the format string.


    Once the format string has been specified, the `strptime` command can be used
    to convert a string into the POSIXlt data type. The arguments for the command
    are the strings to convert, followed by the format string:


    ```

    > theTime <- c("08:30:00 1867-07-01", "18:15:00 1864-10-27")

    > converted <- strptime(theTime,"%H:%M:%S %Y-%m-%d")

    > converted

    [1] "1867-07-01 08:30:00" "1864-10-27 18:15:00"

    > typeof(converted[1])

    [1] "list"

    > converted[1]-converted[2]

    Time difference of 976.5938 days

    ```


    The command also accepts an optional time zone option, as follows:


    ```

    > theTime <- c("08:30:00 1867-07-01", "18:15:00 1864-10-27")

    > converted <- strptime(theTime,"%H:%M:%S %Y-%m-%d", + tz="Canada/Eastern")

    > converted

    [1] "1867-07-01 08:30:00 EST" "1864-10-27 18:15:00 EST"

