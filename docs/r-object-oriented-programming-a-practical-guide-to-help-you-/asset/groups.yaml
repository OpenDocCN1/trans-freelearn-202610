    \ 类。`DiscreteSimulation` 类用于生成以下方程给出的离散随机系统的近似值：\n\n$x_{n+1}=ax_n+bx_ny_n+N_1W_1,\\\
    \ y_{n+1}=gx_n+dy_n+N_2W_2$\n\n在前述方程中，a、b、N1、g、d 和 N2 为常数，W1 和 W2 为均值为零、标准差为一的正态分布随机变量。`ContinuousSimulation`\
    \ 类用于使用 Milstein 格式生成随机微分方程的近似值：\n\n$dx=(axy+by)dt+N_1dW_1,\\ dy=(gx+dy)dt+N_2dW_2$\n\
    \n在前述方程中，a、b、N1、g、d 和 N2 为常数，W1 和 W2 为独立的维纳过程。\n\n所有类的完整脚本都可以在随本文本提供的代码中找到。出于简洁考虑，我们只查看一个派生类：`DiscreteSimulation`\
    \ 类。该类的定义如下所示：\n\n```\n###############################################\n## Create\
    \ a simulation for a discrete simulation.\n##\n## This is used to represent the\
    \ results from a discrete simulation.\nDiscreteSimulation <- function()\n{\n \
    \   ## Define the base class and get the environment\n    me <- Simulation()\n\
    \    me$N <- 0\n\n    ## Set the name for the class with a numeric grade associated\
    \ with\n    ## it.\n    class(me) <- append(class(me),\"DiscreteSimulation\")\n\
    \    return(me)\n}\n```\n\n该类特有的最后一个方法是 `singleSimulation` 方法，用于进行一次模拟并保存结果。定义离散模拟类所需的方法如下：\n\
    \n```\n# the methods to do the actual simulations.\nsingleSimulation <- function(simulation,N,T,x0,y0,alpha,beta,\n\
    \    gamma,delta, noiseOne,noiseTwo)\n{\n```\n\n```\nUseMethod(\"singleSimulation\"\
    ,simulation)\n}\n\nsingleSimulation.DiscreteSimulation <-function(\n  simulation,N,T,x0,y0,alpha,beta,gamma,delta,noiseOne,noiseTwo)\n\
    {\n  ## Make an approximation for one run of the discrete model\n  ## with the\
    \ given parameters. Store the approximation in\n  ## the simulation slot when\
    \ done.\n\n  ## initialize the necessary variables.\n  x <- matrix(data=double(N*2),nrow=N,ncol=2)\n\
    \  x[1,1] <- x0\n  x[1,2] <- y0\n  lupe <- 2\n\n  ## Go through and make N iterations\
    \ of the stochastic model.\n  while(lupe <= N)\n    {\n      dW <- rnorm(2,mean=0,sd=1)\
    \      # Generate two random numbers\n                                      #\
    \ with a normal dist.\n      ## Take one step of the discrete model\n      x[lupe,1]\
    \ <- alpha*x[lupe-1,1] + beta*x[lupe-1,1]*x[lupe-1,2] +\n        noiseOne*dW[1]\n\
    \      x[lupe,2] <- gamma*x[lupe-1,1] + delta*x[lupe-1,2] +\n        noiseTwo*dW[2]\n\
    \      lupe <- lupe + 1\n    }\n\n  ## Save the simulation and return the result.\n\
    \  simulation <- setSimulation(simulation,x)\n  return(simulation)\n}\n```\n\n\
    ## 蒙特卡洛类\n\n最后检查的类是 MonteCarlo 类。MonteCarlo 类用于跟踪多次模拟的结果。在此，我们提供该类的部分代码列表，然后提供用于生成多次模拟的方法。\n\
    \n首先，给出定义该类所需的代码：\n\n```\n###############################################\n# Create\
    \ the Monte Carlo class\n#\n# This class is used to make many simulations\nMonteCarlo\
    \ <- function()\n{\n\n    # Define the slots\n    me = list(\n\n        ## First\
    \ define the parameters for the stochastic model\n        N         = 0,\n   \
    \     T         = 0,\n        x0        = 0,\n        y0        = 0,\n       \
    \ alpha     = 0,\n        beta      = 0,\n        gamma     = 0,\n        delta\
    \     = 0,\n        noiseOne  = 0,\n        noiseTwo  = 0,\n\n        ## Define\
    \ the data to track and the number of trials\n        xData = 0,\n        yData\
    \ = 0\n\n    )\n    ## Set the name for the class\n    class(me) <- append(class(me),\"\
    MonteCarlo\")\n    return(me)\n}\n\n# Define the method used to initialize the\
    \ data prior to a run.\nprepare <- function(monteCarlo,number)\n{\n    UseMethod(\"\
    prepare\",monteCarlo)\n}\nprepare.MonteCarlo <- function(monteCarlo,number)\n\
    {\n    ## Set the number of trials and initialize the values to\n    ## zeroes.\n\
    \    monteCarlo$xData <- double(number)\n    monteCarlo$yData <- double(number)\n\
    \    return(monteCarlo)\n}\n```\n\n该类还需要一个额外的方法。simulations 方法用于创建多次模拟并记录结果：\n\
    \n```\n```r\nsimulations <- function(monteCarlo,number,simulation)\n{\n    UseMethod(\"\
    simulations\",monteCarlo)\n}\n\nsimulations.monteCarlo <- function(monteCarlo,number,simulation)\n\
    {\n    ## Set the number of trials and initialize the values\n    monteCarlo <-\
    \ prepare(monteCarlo,number)\n    params <- getParams(monteCarlo)  # get the parameters\n\
    \n    ## Perform the simulations\n    lupe <- 0\n    while(lupe < number)\n  \
    \  {\n        lupe <- lupe + 1 # increment the count\n        ## Perform a single\
    \ simulation.\n        simulation <- singleSimulation(\n            simulation,\n\
    \            params[1],params[2],params[3],params[4],params[5],\n            params[6],params[7],params[8],params[9],params[10])\n\
    \        ## Get the last values of the simulation and record them.\n        values\
    \ <- getFinalValues(simulation)\n        monteCarlo <- setValue(monteCarlo,values[1],values[2],lupe)\n\
    \    }\n\n    return(monteCarlo)\n}\n```\n```\n\n## 总结\n\n定义了一个 S3 类的示例，可用于跟踪一组模拟。类中包括一个用于创建单个模拟的单独类。单个模拟可以是对离散或连续随机过程的近似。还开发了另一个类，可以跟踪大量模拟的结果。\n\
    \n在下一章中，我们将研究另一个扩展示例。下一章的重点是创建一组 S3 类，以提供一种通用方法来处理各种数据类型回归任务。您可以从 https://www.packtpub.com/sites/default/files/downloads/66820S_Case_Study_Regression\
    \ 下载本章\n\n"
