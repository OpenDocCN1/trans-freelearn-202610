    # # Six focused tasks


    We first examine six specific tasks. These operations are to determine the length
    of a string, location of a substring, extract or replace a substring, change the
    case of a string, split a string into separate parts, and express a combination
    of objects as a single string. Please note that the examples will make extensive
    use of the definition of the url vector that is defined in the previous section.'
  - "[PAGE 125]\n\n# Determining the length of a string\n\nThe `nchar` command is\
    \ used to determine the length of a string. This option can be used as part of\
    \ a simple statistic for a set of strings or can be part of a programming tool\
    \ when it is necessary to iterate over a string. You can specify how the count\
    \ is calculated with options to count the number of characters, bytes, or width\
    \ of the resulting string. In most cases, these values will be the same but can\
    \ differ depending on the Unicode settings for your environment:\n\n```\n```r\n\
    > nchar(ur ls)\n[1] 52 62 41 42\n```\n```\n\nThe `nchar` command tries to coerce\
    \ its argument to a string, which means that it interprets the values of objects\
    \ whose type is NA as the string NA. Another side effect is that it can return\
    \ an error when used on factors:\n\n```\n```r\n>> nchar(c(\"one\", NA, 1234))\n\
    [1] 3 2 4\n> nchar(as.factor(c(\"a\", \"b\", \"a\", \"a\", \"b\", \"c\")))\nError\
    \ in nchar(as.factor(c(\"a\", \"b\", \"a\", \"a\", \"b\", \"c\"))) :\n  'nchar()'\
    \ requires a character vector\n```\n```\n\nIf you are running R within a Unicode\
    \ environment such as UTF-8, this command may return an error. If this is the\
    \ case, try the `allowNA=TRUE` option to see whether the results are appropriate.\n\
    \nOne last note; there is an additional command, `nzchar`, which tests to determine\
    \ whether the character width of the string has zero length. This function returns\
    \ a logical value, and it is true if the string does not have a zero length. As\
    \ an example, suppose you have a list of file types with an empty string being\
    \ an unrecognized file type. You may want to use `nzchar` to create a mask to\
    \ skip or ignore an empty string:\n\n```\n```r\n> fileTypes <- c(\"txt\", \"\"\
    , \"html\", \"txt\")\n> nzchar(fileTypes)\n[1] TRUE FALSE TRUE TRUE\n> fileTypes[nzchar(fileTypes)]\n\
    [1] \"txt\" \"html\" \"txt\"\n```\n```"
  - '[PAGE 126]


    # Location of a substring


    In some circumstances, it is necessary to determine the location within a string
    for the occurrence of a substring. For example, it might be necessary to search
    a set of filenames to determine whether they contain a match for a predetermined
    parameter. The command to return the location of a substring is the `regexpr`
    command. This command has many options, and it is explored in more detail in the
    following section. Here, we use it in its most basic form to determine the location
    of a substring.


    Using the definition of the vector, `urls`, as an example, we may wish to find
    the location of the colons in the URLs. The colons are the delimiter between the
    protocol and the host name, and we cannot assume it will always be in the same
    position:


    ```

    ```r

    > colons <- regexpr(":",urls)

    > colons

    [1] 6 6 5 5

    attr(,"match.length")

    [1] 1 1 1 1

    attr(,"useBytes")

    [1] TRUE

    > colons[2]

    [1] 6

    > colons[3]

    [1] 5

    ```

    ```


    Note that the assumed position of the first character is one and not zero.'
  - '[PAGE 127]


    # Extracting or changing a substring


    There are two commands available to change a substring within a string. The two
    commands are `substr` and `substring`, and their arguments are identical. The
    substring command is compatible with S, but we focus on the R command `substr`.
    The command has two forms. One form can be used to extract a substring, and the
    other form can be used to change the value of a substring.


    First, we examine the option to extract a substring. The command takes a string,
    the location of the start of the substring, and the location of the end of the
    substring. Making use of the previous example, we now use the `urls` vector defined
    at the start of the chapter and determine the protocol for each URL:


    ```

    ```r

    > protocols <- substr(urls,1,colons-1)

    > protocols

    [1] "https" "https" "http" "http"

    ```

    ```


    A substring can be replaced by combining the `substr` command and the assignment
    operator. Unfortunately, the length of the string inserted must be the same length
    as the string being replaced, which can return nonintuitive results. Here, we
    replace each of the protocols in the `urls` vector with a `mailto` protocol:


    ```

    ```r

    > colons <- regexpr(":",urls)

    > mailto <- urls

    > substr(mailto,1,colons-1) <- c("mailto","mailto","mailto")

    > mailto

    [1] "mailto://duckduckgo.com?q=Johann+Carl+Friedrich+Gauss"

    [2] "mailto://search.yahoo.com/search?p=Jean+Baptiste+Joseph+Fourier"

    [3] "mail://www.bing.com/search?q=Isaac+Newton"

    [4] "mail://www.google.com/search?q=Brahmagupta"

    ```

    ```


    Note that the string “http” has fewer characters than the string “mailto,” and
    the command has truncated the new string that is substituted into the original
    string.'
