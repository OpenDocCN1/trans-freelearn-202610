    # # Cumulative distribution functions


    Another important tool used to approximate probabilities is the cumulative distribution
    function. In many situations, we are required to determine the probability that
    a random variable will return a value within some given range of values. The cumulative
    distribution allows us to use a shortcut to calculate the resulting probability.
    As in the previous section, we look at discrete and continuous distributions separately.
    We examine the definition and look at examples for both cases.


    For a discrete distribution, the cumulative distribution function is defined to
    be the following equation:


    ![](img/18eeabe9ab8c81c5a3f4040db5906c67_113_0.png)


    From this definition, the probability that a random variable is between two numbers
    can be determined by the following equation:


    ![](img/18eeabe9ab8c81c5a3f4040db5906c67_113_1.png)


    Please note the details in the inequality. In the case of discrete distributions,
    it matters if *less than or equal* is used as opposed to *less than*.


    For a Poisson distribution, the command to determine the cumulative distribution
    function is the ppois command, and it has the same arguments as the dpois command
    discussed earlier. The following example mirrors the example in the previous section,
    and the cumulative distribution function is plotted for a Poisson distribution
    with parameter 10.0:


    ```

    ```r

    > x <- 0:20

    > cdf <- ppois(x,10.0)

    > barplot(cdf,names.arg=x)

    ```

    ```


    The cumulative distribution function for a continuous random variable is defined
    in the same way as that of a discrete random variable. The only difference is
    that instead of a sum we use an integral, as follows:


    ![](img/18eeabe9ab8c81c5a3f4040db5906c67_113_2.png)


    This definition gives the same result as before, and the probability that a random
    variable is between two numbers can be determined by using the following equation:


    ![](img/18eeabe9ab8c81c5a3f4040db5906c67_113_3.png)'
