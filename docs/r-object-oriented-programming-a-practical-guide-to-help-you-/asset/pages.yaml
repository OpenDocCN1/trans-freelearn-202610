  md: "# Loop constructs\n\nAnother important programming task is to create a set\
    \ of instructions that can be repeated in a structured way. There are three loop\
    \ constructs in R: for, while, and repeat loops. We will explore each of these\
    \ loop constructs and discuss the break and next commands, which can control how\
    \ the instructions within a loop’s code block are executed. More details are available\
    \ using the help(Control) command.\n\n# The for loop\n\nA for loop takes a vector,\
    \ and it repeats a block of code for each value in the vector. The syntax is as\
    \ follows:\n\n```\nfor(var in vector)\n  code block\n```\n\nThe for loop repeats\
    \ a set of instructions for every value within a vector in the appropriate order.\
    \ It can be memory intensive if you need to repeat the loop a lot of times and\
    \ the vector is not already stored in the workspace. An example of a simple for\
    \ loop is given here:\n\n```\n> for(lupe in seq(1,2,by=0.33))\n+ {\n+   cat(\"\
    The value of lupe is \",lupe,\"\\n\")\n+ }\nThe value of lupe is  1\nThe value\
    \ of lupe is  1.33\nThe value of lupe is  1.66\nThe value of lupe is  1.99\n```\n\
    \n# The while loop\n\nA while loop will execute a code block as long as a given\
    \ expression is true. The syntax is as follows:\n\n```\nwhile(condition)\n  code\
    \ block\n```\n\nThey are often used when the number of iterations is not known\
    \ in advance and the loop is repeated until some criteria is met. Also, the while\
    \ loop has some advantages over the for loop. It can be more efficient, especially\
    \ with respect to memory, and it is more flexible (RMemory, Please refer to RMemory:\
    \ Hadley Wickham, memory, 2014, http://adv-r.had.co.nz/memory.html for more information\
    \ on this topic). For example, instead of constructing a large vector to iterate\
    \ over its elements, a single index can be used. On the down side, it can be harder\
    \ to read, and it can require a little more care when writing the code. An example\
    \ is given here:\n\n```\n> lupe <- 1.0;\n> while(lupe <= 2.0)\n+ {\n+   cat(\"\
    The value of lupe is \",lupe,\"\\n\")\n+   lupe <- lupe + 0.33\n```"
  merge: -1
  img_proc: true
