  md: "# # Redefining arithmetic operations\n\nThe last topic that we’re going to\
    \ examine is how to define basic arithmetic operations on assignments. In particular,\
    \ we’ll examine how to perform arithmetic operations on two `NumericGrade` objects\
    \ and how to add a set of values to a `NumericGrade` object. This can be done\
    \ in the R environment by extending one of the sets of generic groups that is\
    \ used to collect similar operations. The different groups include the `Arith`,\
    \ `Compare`, `Ops`, `Logic`, `Math`, `Math2`, `Summary`, and `Complex` groups.\
    \ The Ops group includes the Arith, Compare, and Logic operations, and we extend\
    \ this group to include objects from the `NumericGrades` class.\n\nWe use the\
    \ `setMethod` function for the Ops group to define operations involving `NumericGrade`\
    \ objects. The resulting function obtains the grades and performs the requisite\
    \ operation using the `callGeneric` command. The quirk of the system is that it\
    \ must return a `NumericGrade` object, and the last step is to set the value of\
    \ the grades for the first `NumericGrade` object sent to the function:\n\n```\n\
    setMethod(\"Ops\", signature(e1=\"NumericGrade\", e2=\"NumericGrade\"),\n    \
    \      function(e1, e2) {\n              theSum <- callGeneric(GetValue(e1), GetValue(e2))\n\
    \              return(SetValue(e1,theSum))\n          }\n)\n\nsetMethod(\"Ops\"\
    , signature(e1=\"NumericGrade\", e2=\"numeric\"),\n          function(e1, e2)\
    \ {\n              theSum <- callGeneric(GetValue(e1), e2)\n              return(SetValue(e1,theSum))\n\
    \          }\n)\n\nsetMethod(\"Ops\", signature(e1=\"numeric\", e2=\"NumericGrade\"\
    ),\n          function(e1, e2) {\n              theSum <- callGeneric(e1, GetValue(e2))\n\
    \              return(SetValue(e1,theSum))\n          }\n)\n```\n\nIn the following\
    \ example, the grades from the `math100.csv` file are read. A copy of the scores\
    \ taken from the `test1` and `test2` assignments are obtained, and the simple\
    \ average is found by adding them and dividing by two:\n\n```\n> source('grades.R')\n\
    > source('ops.R')\n> source('overriding.R')\n>\n> course <- Course()\n> course\
    \ <- SetFileName(course,\"math100.csv\")\n> course <- ReadGrades(course)\n> x\
    \ <- course['test1']\n> y <- course['test2']\n> z <- (x + y)/2\n```"
  merge: -1
  img_proc: true
