- pgno: 172
  md: "you call the UseMethod command, R will search for a function whose class matches\
    \ the first element in the vector. If it does not find that function, it looks\
    \ for a function that matches the second element, and it proceeds until it reaches\
    \ the last element in the vector. If it does not find anything, it calls the default\
    \ function. With this in mind, we now examine new definitions of the classes.\
    \ Rather than manually creating the class, we define functions that will create\
    \ a list representing the class, append a class name to the class attribute, and\
    \ then return the list. There are three classes, and we will define one function\
    \ for each class. The first function is used to define a constructor for an object\
    \ of the GeometricTrial class:\n\n```\nGeometricTrial <- function()\n{\n    #\
    \ Create the basic data structure - a list that keeps track of\n    # a set of\
    \ trials.\n\n    # Create the basic methods as part of a list to be returned.\n\
    \    me = list(\n        # Define the history to keep track of the trials.\n \
    \       history = character(0)\n    )\n\n    # Define my class identifier and\
    \ return the list.\n    class(me) <- append(class(me),\"GeometricTrial\")\n  \
    \  return(me)\n}\n```\n\nPrior to returning the list, the append function is used\
    \ to add the new class name to the end of the current class attribute. This idea\
    \ is used in classes that are derived from the GeometricTrial classes as well.\
    \ The constructor for the Die and Coin classes can now be defined, and both constructors\
    \ explicitly call the constructor for the parent class, perform any actions associated\
    \ with the current class, and then append the current class name to the class\
    \ attribute:\n\n```\nDie <- function()\n{\n    # Define the object by first calling\
    \ the constructor for the base class\n    me <- GeometricTrial()\n    # Add the\
    \ class name to the end of the list of class names\n    class(me) <- append(class(me),\"\
    Die\")\n    return(me)\n}\n\nCoin <- function()\n{\n    # Define the object by\
    \ calling the constructor for the base class\n    me <- GeometricTrial()\n\n \
    \   # Add the class name to the end of the list of class names\n    class(me)\
    \ <- append(class(me),\"Coin\")\n    return(me)\n}\n```\n\nThe GeometricTrial\
    \ class includes four methods. The reset method behaves exactly like"
