- pgno: 90
  md: "# CSV files\n\nThe `read.table` command offers a general way to read the data\
    \ from a file with a known structure. One common file structure is a file where\
    \ the values are separated by commas, or a csv file. The command to read a csv\
    \ file is the `read.csv` command. There is an alternate version of the command,\
    \ `read.csv2`, which has a different set of defaults. The difference is that the\
    \ defaults for `read.csv2` are defined to allow a simple way of reading a file\
    \ in which the delimiter between the decimal values is a comma and the values\
    \ are separated by semicolons, which are more commonly used in some European countries.\n\
    \nThe `read.csv` command is similar to the `read.table` command. The primary difference\
    \ is that the result is returned as a data frame, and a greater range of data\
    \ types for the columns are recognized.\n\nIn the preceding examples, the `trialTable.csv`\
    \ file is read into the workspace. The same file can be read using the `read.csv`\
    \ command. The `trialTable.csv` file does not have a header, and the numbers are\
    \ separated using spaces:\n\n```\n```r\n> trial <- read.csv(\"trialTable.csv\"\
    ,header=FALSE,sep=' ')\n> trial\n   V1 V2 V3\n1  1  2  3\n2  3  5  6\n> typeof(trial)\n\
    [1] \"list\"\n```\n```\n\nIn the next example, we have a data file in which each\
    \ line has the same number of columns, and the data fields are separated by commas.\
    \ The file was downloaded from [http://www.bea.gov/](http://www.bea.gov/). The\
    \ first six lines of the file are used to identify information about the data\
    \ in a human-readable form, but that information should be ignored by the `read.csv`\
    \ function. The other thing to note is that the seventh line is a header; it has\
    \ information that defines the label used to refer to the columns. The last thing\
    \ to note is that the numbers are separated by commas. All of these details must\
    \ be specified if we want to read the file using the `read.csv` command. This\
    \ second file, `inventories.csv`, can be read using the `read.csv` command, as\
    \ follows:\n\n```\n```r\ninventories <- read.csv(\"inventories.csv\", + skip=6,header=TRUE,sep=\"\
    ,\")\n> typeof(inventories)\n[1] \"list\"\n> names(inventories)\n[1] \"Line\"\
    \     \"X\"        \"X1994.1\" \"X1994.2\" \"X1994.3\" \"X1994.4\" \"X1995.1\"\
    \n[8] \"X1995.2\"  \"X1995.3\"  \"X1995.4\"  \"X1996.1\"  \"X1996.2\"  \"X1996.3\"\
    \  \"X1996.4\"\n```\n```"
  merge: -1
