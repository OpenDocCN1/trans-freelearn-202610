- pgno: 25
  md: '# # Preface


    The R environment is a powerful software suite that started as a model for the
    S language originally developed at Bell Laboratories. The original code base was
    created by Ross Ihaka and Robert Gentleman in 1993. It rapidly grew with the help
    of others, and it has since become a standard in statistical computing. The software
    suite itself has grown well beyond an implementation of a language and has become
    an “environment”. It is extensible, and the wide variety of packages that are
    available help make it a powerful resource that continues to grow in popularity
    and power.


    Our aim in this book is to provide a resource for programming using the R language,
    and we assume that you will be making use of the R environment to implement and
    test your code. The book can be roughly divided into four parts. In the first
    part, we provide a discussion of the basic ideas and topics necessary to understand
    how R classifies data and the options that can be used to make calculations from
    data. In the second part, we provide a discussion of how R organizes data and
    the options available to keep track of data, display data, and read and save data.
    In the third part, we provide a discussion on programming topics specific to the
    R language and the options available for object-oriented programming. In the fourth
    part, we provide several extended examples as a way to demonstrate how all of
    the topics can fit together to solve problems.'
  merge: -1
  img_proc: true
- pgno: 26
  md: '# # What this book covers


    A list of the chapters is given here. The first three chapters focus on the basic
    requirements associated with getting data into the system and the most basic tasks
    associated with calculations associated with data. The next three chapters focus
    on the miscellaneous issues that arise in practice when working with and examining
    data including the mechanics of dealing with different data types. The next three
    chapters focus on basic and advanced programming topics. The final three chapters
    provide more detailed examples to demonstrate how all of the ideas can be brought
    together to solve problems.


    [Chapter 1](#), *Data Types*, offers a broad overview of the different data types.
    This includes basic representations such as float, double, complex, factors, and
    integer representations, and it also includes examples of how to enter vectors
    through the interactive shell. A brief discussion of the most basic operations
    and how to interact with the R shell is also given.


    [Chapter 2](#), *Organizing Data*, offers a more detailed look at the way data
    is organized within the R environment. Additional topics include how to access
    the data as well as how to perform basic operations on the various data structures.
    The primary data structures examined are lists, arrays, tables, and data frames.


    [Chapter 3](#), *Saving Data and Printing Results*, offers a detailed look at
    the ways to bring data into the R environment and builds on the topics discussed
    in the previous chapter. Additional topics revolve around the ways to display
    results as well as various ways to save data.


    [Chapter 4](#), *Calculating Probabilities and Random Numbers*, offers a detailed
    examination of the probability and sampling features of the R language. The R
    environment includes a number of features to aid in the way data can be analyzed.
    Any statistical analysis includes an underlying reliance on probability, and it
    is a topic that cannot be ignored. The availability of a wide variety of probability
    and sampling options is one of the strengths of the R language, and we explore
    some of the options in this chapter.


    [Chapter 5](#), *Character and String Operations*, offers a detailed examination
    of the various options available for examining, testing, and performing operations
    on strings. This is an important topic because it is not uncommon for datasets
    to have inconsistencies, and a routine that reads data from a file should include
    some basic checks.


    [Chapter 6](#), *Converting and Defining Time Variables*, offers a detailed examination
    of the time data structure. A basic introduction is given in the first chapter,
    and more details are provided in this chapter. The prevalence of time-related
    data makes the topic of these data structures too important to ignore.


    [Chapter 7](#), *Basic Programming*, offers a detailed examination of the most
    basic flow controls and programming features of the R language. The chapter provides
    details about conditional execution as well as the various looping constructs.
    Additionally, mundane topics associated with writing programs, execution, and
    formatting are also discussed.


    [Chapter 8](#), *S3 Classes*, offers a detailed examination of S3 classes. This
    is the first and'
