  md: "# # Defining new methods\n\nThe first step to create a new method is to reserve\
    \ the name. Some functions are included by default, such as the `initialize`,\
    \ `print` or `show` commands, and we will later see how to extend them. To reserve\
    \ a new name, you must first use the `setGeneric` command. At the very least,\
    \ you need to give this command the name of the function as a character string.\
    \ As in the previous section, we will use more options as an attempt to practice\
    \ safe programming.\n\nThe methods to be created are shown in preceding figure.\
    \ There are a number of methods, but we will only define four here. All of the\
    \ methods are accessors; they are used to either get or set values of the data\
    \ components. We will only define the methods associated with the length slot\
    \ in this text, and you can see the rest of the code in the examples available\
    \ on the website. The other methods closely follow the code used for the length\
    \ slot. There are two methods to set the activity level, and those codes are examined\
    \ separately to provide an example of how a method can be overloaded.\n\nFirst,\
    \ we will define the methods to get and set the length. We will first create the\
    \ method to get the length, as it is a little more straightforward. The first\
    \ step is to tell R that a new function will be defined, and the name is reserved\
    \ using the `setGeneric` command. The method that is called when an Ant object\
    \ is passed to the command is defined using the `setMethod` command:\n\n```\n\
    ```r\nsetGeneric(name=\"GetLength\",\n           def=function(antie)\n       \
    \    {\n                 standardGeneric(\"GetLength\")\n           }\n\nsetMethod(f=\"\
    GetLength\",\n          signature=\"Ant\",\n          definition=function(antie)\n\
    \          {\n                 return(antie@length)\n          }\n)\n```\n```\n\
    \nNow that the GetLength function is defined, it can be used to get the length\
    \ component for an Ant object:\n\n```\n```r\n> ant2 <- new(\"Ant\",length=4.5)\n\
    > GetLength(ant2)\n[1] 4.5\n```\n```\n\nThe method to set the length is similar,\
    \ but there is one difference. The method must return a copy of the object passed\
    \ to it, and it requires an additional argument:\n\n```\n```r\nsetGeneric(name=\"\
    SetLength\",\n           def=function(antie,newLength)\n           {\n       \
    \          standardGeneric(\"SetLength\")\n```\n```"
  merge: -1
