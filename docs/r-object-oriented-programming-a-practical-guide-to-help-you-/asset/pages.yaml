- pgno: 94
  md: '# # Saving a workspace


    There are two commands used to save the information in the current workspace.
    The first is the save command, which allows you to save particular variables.
    The second is the `save.image` command, which allows you to save all the variables
    within the workspace.


    The save command requires a list of variables to save, and the name of a file
    to save the variables. There are a wide variety of options, but in the most basic
    form you simply save specific variables from the current workspace. Here, we use
    the `ls` command to first list the variables in the current workspace and then
    use the save command to save two variables, `inventories` and `trees`:


    ```

    ```r

    > dir()

    [1] "diameters.csv"  "inventories.csv" "network.csv" "trees.csv"

    [5] "trialFWF.dat"   "trialTable.csv"

    > ls()

    [1] "a"          "d"          "f"          "inventories" "trees"

    [6] "trial"      "x"          "y"

    > save(inventories,trees,file="theInventories.RData")

    > dir()

    [1] "diameters.csv"        "inventories.csv"       "network.csv"

    [4] "theInventories.RData" "trees.csv"              "trialFWF.dat"

    [7] "trialTable.csv"

    ```

    ```


    The `save.image` command requires only one argument; the name of the file used
    to save the information:


    ```

    ```r

    > dir()

    [1] "diameters.csv"        "inventories.csv"       "network.csv"

    [4] "theInventories.RData" "trees.csv"              "trialFWF.dat"

    [7] "trialTable.csv"

    > save.image("wholeShebang.RData")

    > dir()

    [1] "diameters.csv"        "inventories.csv"       "network.csv"

    [4] "theInventories.RData" "trees.csv"              "trialFWF.dat"

    [7] "trialTable.csv"       "wholeShebang.RData"

    ```

    ```


    If you start a new R session, the information that has been saved using a save
    or `save.image` command can be read using the `load` command:


    ```

    ```r

    > ls()

    character(0)

    > dir()

    [1] "diameters.csv"        "inventories.csv"       "network.csv"

    [4] "theInventories.RData" "trees.csv"              "trialFWF.dat"

    [7] "trialTable.csv"       "wholeShebang.RData"

    > load("theInventories.RData")

    > ls()

    [1] "inventories" "trees"

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 95
  md: '# # The cat command


    The cat command can be used to take a list of variables, convert them to a text
    form, and concatenate the results. If no file or connector is specified, the result
    is printed to the screen; otherwise, the connector is used to determine how the
    result is handled. Note that there is an additional set of commands, the various
    write commands, but those commands are convenient routines that allow a shorthand
    notation to access the cat commands. These commands are primarily used in scripts:


    ```

    ```r

    > one <- "A"

    > two <- "B"

    > cat(one,two,"\n")

    A B

    ```

    ```


    The cat command allows you to specify a number of options. For example, you can
    specify the separator between variables, labels to be used, or whether or not
    to append to a given file:


    ```

    ```r

    > cat(one,two,"\n",sep=" - ")

    A - B -

    ```

    ```'
  merge: -1
