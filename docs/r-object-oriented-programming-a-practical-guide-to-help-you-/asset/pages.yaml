- pgno: 16
  md: '# # About the Author


    **Kelly Black** is a faculty member in the Department of Mathematics at Clarkson
    University. His background is in numerical analysis with a focus on the use of
    spectral methods and stochastic differential equations. He makes extensive use
    of R in the analysis of the results of Monte-Carlo simulations.


    In addition to using R for his research interests, Kelly also uses the R environment
    for his statistics classes. He has extensive experience sharing his experiences
    with R in the classroom. The use of R to explore datasets is an important part
    of the curriculum.


    I would like to thank my wife and daughter for their support and inspiration.
    You are my life, and we do this together.


    I also wish to thank to thank the people who took a direct role in bringing this
    book to completion. In particular, thanks go to the Content Development Editor,
    Parita Khedekar, for her work in assembling everything, keeping me on track, and
    ensuring the overall integrity of this book. Additional thanks go to the Technical
    Editor, Tanvi Bhatt, for maintaining the integrity of the book as a whole and,
    technical guidance. Thank you!


    I would also like to thank the reviewers. Unfortunately, some of your insights
    were not able to be integrated into this work. I did read your reviews and valued
    them. I tried to balance your concerns to the best of my ability. Thank you as
    well.'
  merge: -1
