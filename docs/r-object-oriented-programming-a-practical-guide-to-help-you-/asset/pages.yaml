    # Factors


    Another common way to record data is to provide a discrete set of levels. For
    example, the results of an individual trial in an experiment may be denoted by
    a value of a, b, or c. Ordinal data of this kind is referred to as a factor in
    R. The commands and ideas are roughly parallel to the data types described previously.
    There are some subtle differences with factors, though. Factors are used to designate
    different levels and can be considered ordered or unordered. There are a large
    number of options, and it is wise to consult the help pages for factors using
    the (help(factor)) command. One thing to note, though, is that the typeof command
    for a factor will return an integer.


    Factors can be defined using the factor command, as follows:


    ```

    ```r

    > lev <- factor(x=c("one","two","three","one"))

    > lev

    [1] one   two   three one

    ```

    ```'
