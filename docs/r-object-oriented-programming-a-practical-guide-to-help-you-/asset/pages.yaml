    It is possible to explicitly specify the value returned by a function using the
    return command. The return command takes at most one argument. The command will
    exit the function and return the value given in the argument if it exists. In
    the following example, we build on our example of a random walk in the complex
    plane. Here, we assume that the left-hand side of the plane is not reachable,
    and if the real part of a step is negative, then the step moves in the opposite
    direction:


