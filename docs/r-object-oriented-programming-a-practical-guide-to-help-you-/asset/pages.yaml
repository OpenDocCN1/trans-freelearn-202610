  md: "The class has the usual accessor methods to get and set the values of the slots.\
    \ We give the method to set the value of the grades because it is a complex exercise.\
    \ The method must convert each grade to a character because they may be passed\
    \ as a factor. The method must also go through and make sure that each grade is\
    \ the one that is already defined. It does this using the `grep` command and the\
    \ names of the list in the `Scales` slot, as follows:\n\n```\nsetMethod(f=\"SetValue\"\
    ,\n          signature=\"LetterGrade\",\n          definition=function(assignment,value)\n\
    \          {\n              # Loop through each item in the vector of values.\
    \ Also,\n              # convert the value to a character vector. We need the\n\
    \              # scale list inside the loop so grab a copy now for\n         \
    \     # later use.\n              lupe <- 1\n              value <- as.character(value)\n\
    \              theScale <- GetScale(assignment)\n              theNames <- names(theScale)\n\
    \              while(lupe <= length(value))\n                  {\n           \
    \       # Determine whether this item can be found in the\n                  #\
    \ list of scale items. Express it as a regular\n                  # expression\
    \ and make sure it is an exact match\n                  # by using first and last\
    \ place markers.\n                  thePattern <- paste(\"^\",sub(\"\\\\+\",\"\
    \\\\\\\\+\",\n                      value[lupe]),\"$\",sep=\"\")\n           \
    \       pos <- grep(thePattern,theNames)\n                  if(value[lupe]==\"\
    \") {\n                      #An empty string was passed.\n                  \
    \    value[lupe] <- \"NA\"\n                  } else if(length(pos) != 1) {\n\
    \                      # This item was not found. Print a warning and make it\
    \ an NA\n                      warning(paste(\"The grade \\\\\\\"\",value[lupe],\n\
    \                          \"\\\\\\\"is not recognized. It is set to NA.\",\n\
    \                          sep=\"\"))\n                      value[lupe] <- \"\
    NA\"\n                  }\n                  lupe <- lupe + 1\n              \
    \    }\n              assignment@Value <- value\n              return(assignment)\n\
    \          }\n)\n```\n\nThe final method examined here is the method to print\
    \ out a grade report. It is a simpler method compared to the same method in the\
    \ `NumericGrade` class. In this case, the only results to print are the frequency\
    \ of occurrences for each possible letter grade:\n\n```\nsetMethod(f=\"GradeReport\"\
    ,\n          signature=\"LetterGrade\",\n          definition=function(assignment,maxGrade=NA,div=10)\n\
    \          {\n```"
