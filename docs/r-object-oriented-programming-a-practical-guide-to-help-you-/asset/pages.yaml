- pgno: 130
  md: '# # Creating formatted strings


    The `sprintf` function allows you to take a combination of objects and express
    them as a formatted string. The `paste`, `format`, and `print` commands have been
    examined in [Chapter 3, *Saving Data and Printing Results*](#), and those functions
    can be used to accomplish similar results. The primary difference is that the
    `sprintf` function acts like the C language’s `sprintf` function. For example,
    suppose we have a loop that performs an analysis on the text found at each of
    the URLs found in the `urls` vector defined earlier. As part of the analysis,
    we may have the result of a calculation stored in a variable and wish to use that
    number in the title for a graph. In the following example, we simply set the value,
    though, to keep the example more streamlined:


    ```

    ```r

    > n <- 1

    > calculation <- 123.0

    > theTitle <- sprintf("URL: %s, Count=%d",urls[n],calculation)

    > theTitle

    [1] "URL: https://duckduckgo.com?q=Johann+Carl+Friedrich+Gauss, Count=123"

    ```

    ```


    The %s characters refer to a string in the argument list, and %d refers to an
    integer next in the argument list. These definitions follow the same specification
    as the C language definition of `sprintf`.'
  merge: -1
  img_proc: true
