- pgno: 102
  md: "# # Opening a socket\n\nThe `socketConnection` command will create a network\
    \ connection to a given host using a port number. The command returns a connector\
    \ that can be treated the same as a file connector. In the following example,\
    \ a connection is opened to the [waterdata.usgs.gov](https://waterdata.usgs.gov)\
    \ website using the standard HTTP port, 80. It then sends the HTTP header necessary\
    \ to request the data for the daily flow rates for the South Colton station on\
    \ the Raquette River in northern New York:\n\n```\n```r\n> usgs <- socketConnection(host\
    \ = \"waterdata.usgs.gov\",80)\n> writeLines(\"GET /ny/nwis/dv?cb_00060=on&format=rdb&site_no=04267500&referred_module=sw&period=&begin_date=2013-05-08&end_date=2014-05-08\
    \ HTTP/1.1\",con=usgs)\n> writeLines(\"Host: waterdata.usgs.gov\",con=usgs)\n\
    > writeLines(\"\\n\\n\",con=usgs)\n> lines <- readLines(usgs)\n> lines\n [1] \"\
    HTTP/1.1 200 OK\"\n [2] \"Date: Fri, 09 May 2014 16:28:26 GMT\"\n [3] \"Server:\
    \ Apache\"\n [4] \"AMF-Ver: 4.02\"\n [5] \"Connection: close\"\n [6] \"Transfer-Encoding:\
    \ chunked\"\n [7] \"Content-Type: text/plain\"\n [8] \"\"\n [9] \"3bc\"\n[10]\
    \ \"# ------------------------------ WARNING ------------------------------\"\n\
    [11] \"# The data you have obtained from this automated U.S. Geological Survey\
    \ database\"\n[12] \"# have not received Director's approval and as such are provisional\
    \ and subject to\"\n[13] \"# revision. The data are released on the condition\
    \ that neither the USGS nor the\"\n[14] \"# United States Government may be held\
    \ liable for any damages resulting from its use.\"\n[15] \"# Additional info:\
    \ http://waterdata.usgs.gov/ny/nwis/?provisional\"\n[16] \"#\"\n[17] \"# File-format\
    \ description:  http://waterdata.usgs.gov/nwis/?tab_delimited_format_info\"\n\
    [18] \"# Automated-retrieval info: http://help.waterdata.usgs.gov/faq/automated-retrievals\"\
    \n[19] \"#\"\n[20] \"# Contact:    gs-w_support_nwisweb@usgs.gov\"\n[21] \"# retrieved:\
