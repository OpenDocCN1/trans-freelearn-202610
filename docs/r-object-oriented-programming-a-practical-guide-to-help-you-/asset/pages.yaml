- pgno: 233
  md: "# # Defining indexing operations\n\nAn object that is a Course class can have\
    \ many assignment objects in its Grades slot. We did not define a special method\
    \ to get a particular assignment, and no method is defined to save an assignment.\
    \ We examine how to do this is in this section, and the discussion revolves around\
    \ redefining the [ operation.\n\nFirst we redefine the [ operation used to get\
    \ an assignment. The idea is that we want to get a copy of an assignment by enclosing\
    \ the name of the assignment as defined in the original file within square braces.\
    \ To do this, we can redefine the operation. In this case, we want to be able\
    \ to pass any kind of object within the braces, which will allow us to also use\
    \ integers to index by location in the list:\n\n```\nsetMethod(\"[\",\n      \
    \   signature(x=\"Course\",i=\"ANY\"),\n         definition=function(x,i=1)\n\
    \         {\n             #print(paste(\"Get grade item\",i))\n             return(x@Grades[[i]])\n\
    \         }\n)\n```\n\nWe would like to also be able to get a grade within an\
    \ assignment. In this case, we will pass two arguments within the braces. The\
    \ first task is to get the assignment using the previous definition and then get\
    \ the grade within the assignment whose index matches the second argument:\n\n\
    ```\nsetMethod(\"[\",\n         signature(x=\"Course\",i=\"ANY\",j=\"numeric\"\
    ),\n         definition=function(x,i=1,j=1)\n         {\n             #print(paste(\"\
    course value\",i,j))\n             allGrades <- GetValue(x[i])\n             return(allGrades[[j]])\n\
    \         }\n)\n```\n\nWe assume that the operations are defined in a file called\
    \ ops.R. Once these methods are read and executed, the [ operation is used in\
    \ the following example to get a copy of test1 or to examine the third grade in\
    \ test1:\n\n```\n> source('grades.R')\n> source('ops.R')\n> source('overriding.R')\n\
    > course <- Course()\n> course <- SetFileName(course,\"shortList.csv\")\n> course\
    \ <- ReadGrades(course)\n> course['test1']\n[1] Assignment: Test\n[1] (9) Grades:\n\
    [1] 75 68 98 76 96 81 19 52 88\n> course['test1',3]\n[1] 98\n```"
  merge: -1
  img_proc: true
- pgno: 234
  md: "The final topic to examine in this section is the use of the `[` operation\
    \ to set the value of an entry. The approach is similar to the methods used to\
    \ get information given earlier. The only difference is that instead of using\
    \ the setMethod function, we use the setReplace method, and the last argument\
    \ to the function is the value to set the corresponding entry in the appropriate\
    \ object:\n\n```\nsetReplaceMethod(\"[\",\n                 signature(\"NumericGrade\"\
    ),\n                 definition=function(x,i,value)\n                 {\n    \
    \                 #print(paste(\"grade value\",i,value))\n                   \
    \  x@value[i] = value\n                     return(x)\n                 }\n  \
    \               )\n\nsetReplaceMethod(\"[\",\n                 signature(\"Course\"\
    ),\n                 definition=function(x,i,j,value)\n                 {\n  \
    \                   #print(paste(\"course grade\",i,j,value))\n              \
    \       grades <- x@Grades[[i]]\n                     grades[j] <- value\n   \
    \                  x@Grades[i] <- grades\n                     return(x)\n   \
    \              }\n                 )\n```\n\nWith these definitions in place,\
    \ a value within the course for a specific grade can be easily set, as follows:\n\
    \n```\n> source('grades.R')\n> source('ops.R')\n> source('overriding.R')\n>\n\
    > course <- Course()\n> course <- SetFileName(course,\"shortList.csv\")\n> course\
    \ <- ReadGrades(course)\n> print(course['test1'])\n[1] Assignment: Test\n[1] (9)\
    \ Grades:\n[1] 75 68 98 76 96 81 19 52 88\n> print(course['test1',3])\n[1] 98\n\
    >\n> course['test1',3] <- 99.1\n> print(course['test1',3])\n[1] 99.1\n>\n```"
