- pgno: 46
  md: "# # The workspace\n\nThe R environment keeps track of variables as well as\
    \ allocates and manages memory as it is requested. One command to list the currently\
    \ defined variables is the `ls` command. A variable can be deleted using the `rm`\
    \ command. In the following example, the a and b variables have been changed,\
    \ and the a variable is deleted:\n\n```\n```r\n> a <- 17.5\n> b <- 99/4\n> ls()\n\
    [1] \"a\" \"b\"\n> objects()\n[1] \"a\" \"b\"\n> rm(a)\n> ls()\n[1] \"b\"\n```\n\
    ```\n\nIf you wish to delete all of the variables in the workspace, the list option\
    \ in the `rm` command can be combined with the `ls` command, as follows:\n\n```\n\
    ```r\n> ls()\n[1] \"b\"\n> rm(list=ls())\n> ls()\ncharacter(0)\n```\n```\n\nA\
    \ wide variety of other options are available. For example, there are directory\
    \ options to show and set the current directory, as follows:\n\n```\n```r\n> getwd()\n\
    [1] \"/home/black\"\n> setwd(\"/tmp\")\n> getwd()\n[1] \"/tmp\"\n> dir()\n [1]\
    \ \"antActivity.R\"            \"betterS3.R\"\n [3] \"chiSquaredArea.R\"     \
    \    \"firstS3.R\"\n [5] \"math100.csv\"              \"opsTesting.R\"\n [7] \"\
    probabilityExampleOne.png\" \"s3.R\"\n [9] \"s4Example.R\"\n```\n```\n\nAnother\
    \ important task is to save and load a workspace. The `save` and `save.image`\
    \ commands can be used to save the current workspace. The `save` command allows\
    \ you to save a particular variable, and the `save.image` command allows you to\
    \ save the entire workspace. The usage of these commands is as follows:\n\n```\n\
    ```r\n> save(a,file=\"a.RData\")\n> save.image(\"wholeworkspace.Rdata\")\n```\n\
    ```\n\nThese commands have a variety of options. For example, the ascii option\
    \ is a commonly used option to ensure that the data file is in a (nearly) human-readable\
    \ form. The `help` command can be used to get more details and see more of the\
    \ options that are available. In the following example, the variable a is saved\
    \ in a file, a.RData, and the file is saved in a"
  merge: -1
  img_proc: true
- pgno: 47
  md: 'human-readable format:


    ```

    ```r

    > save(a,file="a.RData",ascii=TRUE)

    > save.image(" wholeworkspace.RData",ascii=TRUE)

    > help(save)

    ```

    ```


    As an alternative to the help command, the ? operator can also be used to get
    the help page for a given command. An additional command is the help.search command
    that is used to search the help files for a given string. The ?? operator is also
    available to perform a search for a given string.


    The information in a file can be read back into the workspace using the load command:


    ```

    ```r

    > load("a.RData")

    > ls()

    [1] "a"

    > a

    [1] 19

    ```

    ```


    Another question that arises with respect to a variable is how it is stored. The
    two commands to determine this are mode and storage.mode. You should try to use
    these commands for each of the data types described in the following subsections.
    Basically, these commands can make it easier to determine whether a variable is
    a numeric value or another basic data type.


    The previous commands provide options for saving the values of the variables within
    a workspace. They do not save the commands that you have entered. These commands
    are referred to as the history within the R workspace, and you can save your history
    using the savehistory command. The history can be displayed using the history
    command, and the loadhistory command can be used to replay the commands in a file.


    The last command given here is the command to quit, q(). Some people consider
    this to be the most important command because without it you would never be able
    to leave R. The rest of us are not sure why it is necessary.'
  merge: -1
