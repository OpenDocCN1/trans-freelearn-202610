- pgno: 173
  md: "the reset method discussed in the previous section. The `getHistory` method\
    \ is an accessor for a data element and is discussed in the following section.\
    \ We will now discuss the `simulation` method, and a discussion on the `singleTrial`\
    \ method will follow.\n\nThe `simulation` method is used to simulate a single\
    \ experiment. The history is first cleared, and the `singleTrial` method is repeatedly\
    \ called until a successful result is returned. We first define the base simulation\
    \ function, the default simulation function, and then the simulation function\
    \ used by the `GeometricTrial` class, as follows:\n\n```\n```r\nsimulation <-\
    \ function(theObject)\n{\n    UseMethod(\"simulation\",theObject)\n}\n\nsimulation.default\
    \ <- function(theObject)\n{\n    warning(\"Default simulation method called on\
    \ unrecognized object.\")\n    return(theObject)\n}\n\n## Define a method to run\
    \ a simulation of a geometric trial.\nsimulation.GeometricTrial = function(theObject)\n\
    {\n    theObject <- reset(theObject)   # Reset the history\n                 \
    \                    # before the trial.\n    repeat\n    {\n        ## perform\
    \ a single trial and add it to the history\n        thisTrial <- singleTrial(theObject)\n\
    \        theObject <- appendEvent(theObject,thisTrial$result)\n        if(thisTrial$success)\n\
    \        {\n            break   # The trial resulted in a success. Time\n    \
    \                # to stop!\n        } # The trial was not a success. Keep going.\n\
    \n    return(theObject)\n}\n```\n```\n\nThe effort to define a default function\
    \ may not appear to be a worthwhile endeavor. However, this practice is generally\
    \ employed to ensure that the system can responsibly react if the methods you\
    \ define are called by mistake.\n\nThe final step is to define the `singleTrial`\
    \ methods. This method is executed by the child classes, Die and Coin. Again,\
    \ the base and default methods are created. In this case, though, there are also\
    \ methods for each of the three classes. The base function calls the `UseMethod`\
    \ function, which scrolls through the `class` attribute for the first function\
    \ to call. We use a method for the `GeometricTrial` class to demonstrate the order\
    \ of the calls as well as the `NextMethod` function. The `NextMethod` function\
    \ continues the search in the `class` attribute and will call the next function\
    \ based on the class names that follow the current class:"
