- pgno: 73
  md: '# # Censoring data


    Using a logical vector as an index is useful for limiting data that is examined.
    For example, to limit a vector to examine only the positive values in the data
    set, a logical comparison can be used for the index into the vector:


    ```

    ```r

    > u <- 1:6

    > v <- c(-1,1,-2,2,-3,3)

    > u

    [1] 1 2 3 4 5 6

    > v

    [1] -1  1 -2  2 -3  3

    > u[v > 0]

    [1] 2 4 6

    > u[v < 0] = -2*u[v < 0]

    > u

    [1]  -2  2  -6  4 -10  6

    ```

    ```


    Another useful aspect of a logical index into a vector is the use of the NA data
    type. The is.na function and a logical NOT operator (!) can be a useful tool when
    a vector contains data that is not defined:


    ```

    ```r

    > v <- c(1,2,3,NA,4,NA)

    > v

    [1]  1  2  3 NA  4 NA

    > v[is.na(v)]

    [1] NA NA

    > v[!is.na(v)]

    [1] 1 2 3 4

    ```

    ```


    Note that many functions have optional arguments to specify how R should react
    to data that contains a value with the NA type. Unfortunately, the way this is
    done is not consistent, and you should use the help command with respect to any
    particular function:


    ```

    ```r

    > v <- c(1,2,3,NA,4,NA)

    > v

    [1]  1  2  3 NA  4 NA

    > mean(v)

    [1] NA

    > mean(v,na.rm=TRUE)

    [1] 2.5

    ```

    ```


    In this last example, the na.rm option in the mean function is set to TRUE to
    specify that R should ignore the entries in the vector that are NA.'
  merge: -1
  img_proc: true
- pgno: 74
  md: "# Appending rows and columns\n\nThe `cbind` and `rbind` commands can be used\
    \ to append data to existing objects. These commands can be used on vectors, matrices,\
    \ arrays, and they are extended to also act on data frames. The following examples\
    \ use data frames, as that is a common operation. You should be careful and try\
    \ the commands on arrays to make sure that the operation behaves in the way you\
    \ expect.\n\nThe `cbind` command is used to combine the columns of the data given\
    \ as arguments:\n\n```\n```r\n> d <- data.frame(one=c(1,2,3),two=as.factor(c(\"\
    one\",\"two\",\"three\")))\n> e <- c(\"ein\",\"zwei\",\"drei\")\n> newDataFrame\
    \ <- cbind(d,third=e)\n> newDataFrame\n  one   two third\n1   1   one   ein\n\
    2   2   two  zwei\n3   3 three  drei\n> newDataFrame$third\n[1] ein zwei drei\n\
    Levels: drei ein zwei\n```\n```\n\nIf the arguments to the `cbind` command are\
    \ two data frames (or two arrays), then the command combines all of the columns\
    \ from all of the data frames (arrays):\n\n```\n```r\n> d <- data.frame(one=c(1,2,3),two=as.factor(c(\"\
    one\",\"two\",\"three\")))\n> e <- data.frame(three=c(4,5,6),four=as.factor(c(\"\
    vier\",\"funf\",\"sechs\")))\n> newDataFrame <- cbind(d,e)\n> newDataFrame\n \
    \ one   two three  four\n1   1   one     4  vier\n2   2   two     5  funf\n3 \
    \  3 three     6 sechs\n```\n```\n\nThe `rbind` command concatenates the rows\
    \ of the objects passed to it. The command uses the names of the columns to determine\
    \ how to append the data. The number and names of the columns must be identical:\n\
    \n```\n```r\n> d <- data.frame(one=c(1,2,3),two=as.factor(c(\"one\",\"two\",\"\
    three\")))\n> e <- data.frame(one=c(4,5,6),two=as.factor(c(\"vier\",\"funf\",\"\
    sechs\")))\n> newDataFrame <- rbind(d,e)\n> newDataFrame\n  one   two\n1   1 \
    \  one\n2   2   two\n3   3 three\n4   4  vier\n5   5  funf\n6   6 sechs\n```\n\
    ```"
  merge: -1
  img_proc: true
