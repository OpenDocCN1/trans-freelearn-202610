  md: '# # Summary


    An example of an S3 class was defined that can be used to keep track of a set
    of simulations. The classes include a separate class used to create a single simulation.
    The single simulation can be an approximation of either a discrete or continuous
    stochastic process. Another class is developed that can keep track of the results
    from a large number of simulations.


    In the next chapter, we look at another extended example. The focus in the next
    chapter is on creating a set of S3 classes to provide a general way to handle
    regression tasks for a variety of data types. You can download this chapter from
    [https://www.packtpub.com/sites/default/files/downloads/66820S_Case_Study_Regression](https://www.packtpub.com/sites/default/files/downloads/66820S_Case_Study_Regression)'
