- pgno: 122
  md: "# # Basic string operations\n\nIn some situations, data is kept in the form\
    \ of characters or strings, whereas in some other situations the strings must\
    \ be parsed or investigated as part of a statistical analysis. Because of the\
    \ prevalence of data in the form of strings, the R language has a rich set of\
    \ options available for manipulating strings. In this chapter, we investigate\
    \ some of the options available, and our investigation is divided into two parts.\
    \ They are as follows:\n\n+   - In the first part, we examine a number of basic\
    \ string operations whose function is focused on particular operations\n+   -\
    \ In the second part, we examine the functions that are based on regular expressions\
    \ that offer a powerful set of wide ranging operations\n\nThe use of regular expressions\
    \ represent a powerful set of tools for string manipulation, but the cost is greater\
    \ complexity. In this chapter, we only focus on the most basic uses of these functions\
    \ as their most common uses tend to be parts of more complex code that may use\
    \ a complicated combination of the commands.\n\nAs a way to make the connection\
    \ between the commands, we assume a common data set throughout this chapter. In\
    \ particular, we assume that we have a set of URLs:\n\n```\n```r\n> urls <- c(\"\
    https://duckduckgo.com?q=Johann+Carl+Friedrich+Gauss\",\n             \"https://search.yahoo.com/search?p=Jean+Baptiste+Joseph+Fourier\"\
    ,\n             \"http://www.bing.com/search?q=Isaac+Newton\",\n             \"\
    http://www.google.com/search?q=Brahmagupta\")\n```\n```\n\nWe will examine various\
    \ ways to pull information from each URL. Such a task may be necessary either\
    \ to pull information from a website or to perform an analysis on the URLs themselves."
  merge: -1
