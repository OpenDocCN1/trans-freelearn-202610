    \ the complications associated with determining how R finds a method when there\
    \ are collisions. Assuming that the Ant base class given in the first section\
    \ has already been defined in the current session, the child classes can be defined.\
    \ The details for the two classes, Female and Worker, are discussed here.\n\n\
    First, the FemaleAnt class is defined. It adds a new slot, Food, and inherits\
    \ from the Ant class. Before defining the FemaleAnt class, we add a caveat about\
    \ the Ant class. The base Ant class should have been a virtual class. We would\
    \ not ordinarily create an object of the Ant class. We did not make it a virtual\
    \ class in order to simplify our introduction. We are wiser now and wish to demonstrate\
    \ how to define a virtual class. The FemaleAnt class will be a virtual class to\
    \ demonstrate the idea. We will make it a virtual class by including the VIRTUAL\
    \ character string in the contains parameter, and it will not be possible to create\
    \ an object of the FemaleAnt class:\n\n```\n```r\n# Define the female ant class.\n\
    FemaleAnt <- setClass(\n    # Set the name of the class\n    \"FemaleAnt\",\n\n\
    \    # Name the data types (slots) that the class will track\n    slots = c(\n\
    \        Food = \"numeric\"    # The number of food units carried\n    ),\n\n\
    \    # Set the default values for the slots. (optional)\n    prototype=list(\n\
    \        Food=0\n    ),\n\n    # Make a function that can test to see if the data\
    \ is consistent.\n    # (optional)\n    # This is not called if you have an initialize\
    \ function defined!\n    validity=function(object)\n    {\n        print(\"Validity:\
