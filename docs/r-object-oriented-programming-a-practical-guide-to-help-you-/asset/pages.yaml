- pgno: 64
  md: '# # Chapter 2. Organizing Data


    In this chapter, we will explore the primary data structures that are used to
    organize data. Some of the details about accessing information within data structures
    will be discussed, and some of the ways to apply different operations to parts
    of the data within a data structure will be discussed too. There are roughly three
    parts to this chapter:


    +   - **Basic data structures:** This section gives you information on using vectors,
    lists, data frames, tables, matrices, and time series

    +   - **Accessing and managing memory:** This section gives you an overview of
    the basic ways to gain access and censor specific elements

    +   - **Operations on data structures:** This section gives you an overview of
    the operations and methods used to apply operations within the different kinds
    of data structures'
  merge: -1
  img_proc: true
- pgno: 65
  md: '# # Basic data structures


    The basic data structures used to organize data within the R environment include
    vectors, lists, data frames, tables, and matrices. Here, we provide details for
    each of these data structures and demonstrate how to create them. This chapter
    does not include information about how to read data from a file, and the focus
    is on the data structures themselves. More information about reading from a file
    can be found in [Chapter 3](#), *Saving Data and Printing Results*.'
  merge: -1
  img_proc: true
- pgno: 66
  md: '# # Vectors


    The default data structure in R is the vector. For example, if you define a variable
    as a single number, R will treat it as a vector of length one:


    ```

    ```r

    > a <- 5

    > a[1]

    [1] 5

    ```

    ```


    Vectors represent a convenient and straightforward way to store a long list of
    numbers. Please see [Chapter 1](#), *Data Types*, to see more examples of creating
    vectors. One useful and common way to define a vector is to use the c command.
    The c command concatenates a set of arguments to form a single vector:


    ```

    ```r

    > v <- c(1,3,5,7,-10)

    > v

    [1]    1   3   5   7 -10

    > v[4]

    [1] 7

    > v[2] <- v[1]-v[5]

    > v

    [1]    1  11   5   7 -10

    ```

    ```


    Two other methods to generate vectors make use of the : notation and the seq command.
    The : notation is used to create a list of sequentially numbered values for given
    start and end values. The seq command does the same thing, but it provides more
    options to determine the increment between values in the vector:


    ```

    ```r

    > 1:5

    [1] 1 2 3 4 5

    > 10:14

    [1] 10 11 12 13 14

    > a <- 3:7

    > a

    [1] 3 4 5 6 7

    > b <- seq(3,5)

    > b

    [1] 3 4 5

    > b <- seq(3,10,by=3)

    > b

    [1] 3 6 9

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 67
  md: '# Lists


    Another important type is the list. Lists are flexible and are an unstructured
    way of organizing information. A list can be thought of as a collection of named
    objects. A list is created using the `list` command, and a variable can be tested
    or coerced using the `is.list` and `as.list` commands. A component within a list
    is accessed using the `$` character to denote which object within the list to
    use. As an example, suppose that we want to create a list to keep track of the
    parameters for an experiment. The first component, called means, will be a vector
    of the assumed means. The second component will be the confidence level, and the
    third component will be the value of a parameter for the experiment called maxRealEigen:


    ```

    ```r

    > assumedMeans <- c(1.0,1.5,2.1)

    > alpha <- 0.05

    > eigenValue <- 3+2i

    > l <- list(means=assumedMeans,alpha=alpha,maxRealEigen=eigenValue)

    > l

    $means

    [1] 1.0 1.5 2.1

    $alpha

    [1] 0.05

    $maxRealEigen

    [1] 3+2i


    > l$means

    [1] 1.0 1.5 2.1

    > l$means[2]

    [1] 1.5

    ```

    ```


    The names and attributes commands can be used to determine the components within
    a list. The attributes command is a more generic command that can be used to list
    the components of classes and a wider range of objects. Note that the names command
    can also be used to rename the components of a list. In the following example,
    we use the previous example but change the names of the elements:


    ```

    ```r

    > l <- list(means=c(1.0,1.5,2.1),alpha=0.05,maxRealEigen=3+2i)

    > names(l)

    [1] "means"          "alpha"          "maxRealEigen"

    > names(l) <- c("assumedMeans","confidenceLevels","maximumRealValue")

    > l

    $assumedMeans

    [1] 1.0 1.5 2.1

    $confidenceLevels

    [1] 0.05

    $maximumRealValue

    [1] 3+2i

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 68
  md: "# Data frames\n\nA data frame is similar to a list, and many of the operations\
    \ are similar. The primary difference is that all of the components of a data\
    \ frame must have the same number of elements. This is one of the most common\
    \ ways to store information, and many of the functions available to read data\
    \ from a file return a data frame by default. For example, suppose we ask five\
    \ people two questions. The first question is, “Do you have a pet cat?” The second\
    \ question is, “How many rooms in your house need new carpet?”\n\n```\n```r\n\
    > d <- data.frame(Q1=as.factor(c(\"y\",\"n\",\"y\",\"y\",\"n\")),\n+         \
    \        Q2=c(2,0,1,2,0))\n> d\n  Q1 Q2\n1  y  2\n2  n  0\n3  y  1\n4  y  2\n\
    5  n  0\n\n> d$Q1\n[1] y n y y n\nLevels: n y\n\n> summary(d)\n   Q1         \
    \    Q2\n n:2   Min.   :0\n y:3   1st Qu.:0\n       Median :1\n       Mean   :1\n\
    \       3rd Qu.:2\n       Max.   :2\n```\n```\n\nThe names and attributes commands\
    \ have the same behaviors with data frames as lists. In the preceding example,\
    \ we take the data frame defined in the previous example and rename the fields\
    \ to something more descriptive:\n\n```\n```r\n> d <- data.frame(Q1=as.factor(c(\"\
    y\",\"n\",\"y\",\"y\",\"n\")),\n+                 Q2=c(2,0,1,2,0))\n> names(d)\
    \ <- c(\"HaveCat\",\"NumberRooms\")\n> d\n  HaveCat NumberRooms\n1       y   \
    \        2\n2       n           0\n3       y           1\n4       y          \
    \ 2\n5       n           0\n```\n```"
  merge: -1
  img_proc: true
