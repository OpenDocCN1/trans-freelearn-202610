    \ of lupe is  1.66\nThe value of lupe is  1.99\n```\n```\n\n# The repeat loop\n\
    \nA repeat loop is used to denote a block of code that will be repeatedly executed\
    \ until an explicit breakout of the block is executed. The primary advantage of\
    \ the repeat loop is that the start of the code block will always be executed.\
    \ One disadvantage is that it can be difficult to read. The syntax is relatively\
    \ simple:\n\n```\n```r\nrepeat\n    code block\n```\n```\n\nYou must use a break\
    \ command to tell R to exit the code block. The break command is described in\
    \ the next subsection in more detail. An example of a repeat loop is given in\
    \ the following example, and it is a brief example of simulation of a random walk\
    \ in the complex plane:\n\n```\n```r\npositions  <- complex(0) # Initialize the\
    \ history of positions\ncurrentPos <- 0.0+0.0i    # Start at the origin\nNUMBERSTEPS\
    \ <- 50          # Number of steps to take\nangleFacing <- 0.0         # direction\
    \ it is facing\nstdDev      <- 1.0         # std dev. of the change in the angle\n\
    \nstep <- as.integer(0)\nrepeat\n{\n    ## Update the current time step\n    step\
    \ <- step + as.integer(1)\n\n    ## Check to see if it is time to stop\n    if(step>MAXNUMBER)\n\
    \        break\n\n    ## Add new people to the line and update the length\n  \
    \  angle <- angle + rnorm(1,0.0,stdDev)\n    currentPos <- currentPos + exp(angle*1.0i)\n\
    \    positions <- c(positions,currentPos)\n}\nplot(Re(positions),Im(positions),type=\"\
    l\")\n```\n```\n\n# Break and next statements\n\nThe break and next statements\
    \ are used to influence which part of the code in the current loop will be executed.\
    \ The break statement will move to the very end of the current block and it will\
    \ stop the execution of the loop. The next statement will act as if the end of\
    \ the code block was reached and start over at the beginning of the code block\
    \ to begin the next iteration.\n\nAs a demonstration, we build on the simulation\
    \ of the random walk in the previous"
