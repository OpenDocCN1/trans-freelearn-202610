  md: "# # Conditional execution\n\nThe first control construct examined is the if\
    \ statement. An if statement will determine whether or not a code block should\
    \ be executed, and it has an optional else statement. An additional if statement\
    \ can be chained to an else statement to create a cascade of options.\n\nIn its\
    \ most basic form, an if statement has the following form:\n\n```\nif(condition)\n\
    \    code block\n```\n\nThe condition can be a logical statement constructed from\
    \ the operators given in the next table, or it can be a numeric result. If the\
    \ condition is numeric, then zero is considered to be FALSE, otherwise the statement\
    \ is TRUE. The code block can either be a single statement or a set of statements\
    \ enclosed in braces:\n\n```\n> # check if 1 is less than 2\n> if(1<2)\n+    \
    \ cat(\"one is smaller than two.\\n\")\none is smaller than two.\n> if(2>1) {\n\
    +     cat(\"But two is bigger yet.\\n\")\n+ }\nBut two is bigger yet.\n```\n\n\
    Note that a comment is included in the previous code. The # character is used\
    \ to denote a comment. Anything after the # character is ignored.\n\nThe if statement\
    \ can be extended using an else statement. The else statement allows you to specify\
    \ a code block to execute if the condition does not evaluate to TRUE:\n\n```\n\
    > if(1>2) {\n+     cat(\"One is the most biggest number\\n\")   # Say something\
    \ wrong\n+ } else\n+     cat(\"One is the loneliest number\\n\")      # Say something\
    \ less wrong\n+ }\nOne is the loneliest number\n```\n\nThe first thing to note\
    \ about these examples is that a **Kernighan and Ritchie (K&R)** indentation style\
    \ is adopted. We adopted the K&R style because the else statement must be on the\
    \ same line as the closing brace. The second thing to note is that another if\
    \ statement can be appended to the else statement so that a standard if-then-else\
    \ block can be constructed:\n\n```\n> if(0) {\n+     cat(\"Yes, that is FALSE.\\\
    n\")\n+ } else if (1) {\n+     cat(\"Yes that is TRUE\\n\")\n+ } else\n+     cat(\"\
    Whatever\")\n+ }\nYes that is TRUE\n```\n\nOne potential issue is that R does\
    \ not have a scalar type and assumes most data types are"
  merge: -1
  img_proc: true
- pgno: 150
  md: "arranged in vectors. This can lead to potential problems with a logical statement.\
    \ The first element in the vector is used to decide whether a whole statement\
    \ is TRUE or FALSE. Fortunately, R will give a warning if the condition evaluates\
    \ to a vector of length greater than one:\n\n```\n> x <- c(1,2)\n> if(x < 2) {\n\
    +   cat(\"Oh yes it is\\n\")\n+ }\nOh yes it is\nWarning message:\nIn if (x <\
    \ 2) { :\n  the condition has length > 1 and only the first element will be used\n\
    ```\n\nThis is something to keep in mind when deciding which logical operator\
    \ to use in an if statement. For example, the | operator will perform a logical\
    \ OR on all elements of the vectors, but the || operator will only perform a logical\
    \ OR on the first elements of the vectors:\n\n```\n> x <- c(FALSE,FALSE,TRUE)\n\
    > y <- c(FALSE,TRUE,TRUE)\n> x|y\n[1] FALSE  TRUE  TRUE\n> x||y\n[1] FALSE\n```\n\
    \nA variety of logical operators are recognized. Some provide comparisons between\
    \ all entries in a vector and others are for comparisons only for the first elements\
    \ in the vectors. A list of the operators is given in the following table:\n\n\
    | Operator | Description | Operator | Description |\n|---|---|---|---|\n| < |\
    \ Less than (vector) | | | Or (vector) |\n| > | Greater than (vector) | || | Or\
    \ (first entry only) |\n| <= | Less than or equal (vector) | ! | Not (vector)\
    \ |\n| >= | Greater than or equal (vector) | & | And (vector) |\n| == | Equal\
    \ to (vector) | && | And (first entry only) |\n| != | Not equal to (vector) |\
    \ xor(a,b) | Exclusive or (vector) |\n\nTable 1 – The logical operators including\
    \ comparison operators"
  merge: -1
