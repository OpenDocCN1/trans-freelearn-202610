- pgno: 132
  md: '# Regular expressions


    The commands examined in the previous section lack flexibility, but they are straightforward
    in their implementation. The use of regular expressions, on the other hand, offers
    a more elegant approach in many circumstances, but they can be more complex. We
    briefly examine a few commands that allow string manipulations via regular expressions,
    and we assume that you are familiar with regular expressions. To get more information
    about regular expressions in R you can use the help(regular expression) command.


    In this section, we will focus on the gregexpr and gsub commands. There are a
    number of other commands that are listed when you enter the help(gregexpr) command.
    Also, the commands have a number of options, but we will only examine their most
    basic forms. As a quick note, the pattern submitted to the grep command discussed
    earlier can also be a regular expression.


    The gregexpr command is a general command that returns the number of results with
    respect to the regular expression. In particular, it will return the location
    of a match, whether or not a match was found, and the number of characters in
    match. The first argument to the function is a pattern and then the strings to
    match. The function returns a list that has information about match. In the following
    example, we examine the results of searching for the = delimiter in the first
    entry in our urls vector defined earlier:


    ```

    > loc <- gregexpr("=", urls[[1]])

    > loc

    [[1]]

    [1] 25

    attr(","match.length")

    [1] 1

    attr(","useBytes")

    [1] TRUE


    > loc[[1]][1]

    [1] 25

    ```


    Note that the function returns a list. Since the use of a single brace returns
    another list, we use the double braces to ensure that we return the element within
    the list as a vector.


    The sub command can be used to replace all occurrences of a pattern within a string.
    This function takes three arguments, the pattern, the replacement string, and
    the strings that are used to perform the operation:


    ```

    > sub("\\?.*$", "", urls)

    [1] "https://duckduckgo.com"      "https://search.yahoo.com/search"

    [3] "http://www.bing.com/search"  "http://www.google.com/search"

    ```


    Note that two backslashes must be used in the previous example. The first backslash
    is used to indicate that the next character is a symbol to be interpreted, and
    if a second backslash is used, then it means to interpret the pair as a single
    backslash.'
  merge: -1
  img_proc: true
