- pgno: 223
  md: "# The NumericGrade class\n\nThe first class we examine that inherits from the\
    \ `Assignment` class is the `NumericGrade` class. This class is used to retain\
    \ the grades for an assignment whose grades are numbers. The class has only one\
    \ slot, a numeric vector of grades. The definition is given here:\n\n```\n###########################################\n\
    # Create the class to keep track of the grades that are numeric in\n# nature.\n\
    #\n# This is used to represent the numeric grades for one assignment.\nNumericGrade\
    \ <- setClass(\n    # Set the name for the class with a numeric grade associated\
    \ with\n    # it.\n    \"NumericGrade\",\n\n    # Define the slots\n    slots\
    \ = c(\n        Value = \"numeric\"\n    ),\n\n    # Set the default values for\
    \ the slots. (optional)\n    prototype=list(\n        Value = 0.0\n    ),\n\n\
    \    # Make a function that can test to see if the data is consistent.\n    #\
    \ (optional)\n    # This is not called if you have an initialize function defined!\n\
    \    validity=function(object)\n    {\n        if(object@Value < 0) {\n      \
    \      object@Value <- 0\n            warning(paste(\"A negative number for the\
    \ assignment value\",\n            \"is passed. It is set to zero.\"))\n     \
    \   }\n        return(TRUE)\n    },\n\n    # This class inherits from the Assignment\
    \ class\n    contains=\"Assignment\"\n\n)\n```\n\nThe methods for the class include\
    \ the routines to set and get the values of the grades as well as a method to\
    \ print out a report. The method to get the grades is given here as an example:\n\
    \n```\n# Create the methods to retrieve and set the values of the NumericGrade\n\
    class.\nsetGeneric(name=\"GetValue\",\n           def=function(assignment)\n \
    \          {\n               standardGeneric(\"GetValue\")\n           }\n```"
  merge: -1
  img_proc: true
- pgno: 224
  md: "```\n```r\nsetMethod(f=\"GetValue\",\n          signature=\"NumericGrade\"\
    ,\n          definition=function(assignment)\n          {\n              return(assignment@Value)\n\
    \          }\n)\n```\n```\n\nThere is one other method to be defined, and it is\
    \ used to print out a report based on the scores. The method for the grade report\
    \ prints out a five-point summary of the grades, the frequency of the grades divided\
    \ into ten percent intervals (90–100 percent, 80–90 percent, 70–80 percent, and\
    \ so on), a stem-leaf plot of the grades, and a sorted list of the grades. The\
    \ report method includes a call to the summary command to get the five-point summary\
    \ for the grades. The summary function is overridden, and the details are given\
    \ in a later section, *Redefining existing functions*.\n\nThe definition of the\
    \ report method is given here:\n\n```\n```r\nsetGeneric(name=\"GradeReport\",\n\
    \           def=function(assignment,maxGrade=NA,div=10)\n           {\n      \
    \         standardGeneric(\"GradeReport\")\n           }\n)\n\nsetMethod(f=\"\
    GradeReport\",\n          signature=\"Assignment\",\n          definition=function(assignment,maxGrade=NA,div=10)\n\
    \          {\n              print(noquote(paste(\"Grade report for\",\n      \
    \            GetName(assignment))))\n              print(noquote(''))\n      \
    \        print(summary(assignment))  # Print out a five\n                    \
    \                     # point summary for the data\n              values <- GetValue(assignment)\
    \  # Get the raw scores.\n              if(is.na(maxGrade)) {\n              \
    \    # The maxGrade was not set. Assume the max score\n                  # from\
    \ the data is the maximum possible.\n                  maxGrade <- max(values)\n\
    \                  warning(paste(\"The max grade is not set, and it is\",\n  \
    \                              \"assumed to be\",maxGrade))\n              }\n\
    \n              skip <- maxGrade*div/100;                    # Set the\nwidth\
    \ of the intervals.\n              # Move the max grade up to make sure that the\
    \ left sided\n              # cut will have an interval to contain the top scores.\n\
    \              while(maxGrade<=max(values))\n              {\n               \
    \   maxGrade = maxGrade + skip\n              }\n\n              # Determine the\
    \ number of intervals.\n```\n```"
  merge: -1
  img_proc: true
- pgno: 225
  md: "```\n```r\nnumLower <- ceiling((maxGrade-min(values))/skip)\n\n# Determine\
    \ all of the cutoff points\nbins=c(seq(maxGrade-numLower*skip,\n          max(c(values,maxGrade)),by=skip))\n\
    \n# Convert the data into factors\nlevs <- cut(values,breaks=bins,right=FALSE)\n\
    \n# Determine the frequencies for the different levels.\ngradeFreqs <- table(levs)\n\
    \n        print(noquote(''))\n        print(noquote(\"Stem Leaf plot of grades:\"\
    ))\n        print(stem(values))\n        print(noquote(''))\n\n        print(noquote(\"\
    Grade Frequencies:\"))\n        print(gradeFreqs)\n        print(noquote(''))\n\
    \n        print(noquote(\"Sorted Grades:\"))\n        print(sort(values))\n  \
    \  }\n)\n```\n```"
