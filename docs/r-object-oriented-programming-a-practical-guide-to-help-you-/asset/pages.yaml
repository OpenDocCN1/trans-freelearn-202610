- pgno: 218
  md: "# Reading grades from a file\n\nThe last method examined is the method to read\
    \ the data from a given file. We will examine the `Grades` list within the `Course`\
    \ class before providing a listing. This slot is a list, and each element within\
    \ the list is an assignment object. (The assignment classes are discussed in the\
    \ next section of this chapter.) The name of the object within the list is the\
    \ same as the name found in the first row of the CSV file.\n\nThe `ReadGrades`\
    \ method first reads the `csv` file. It then goes through the columns that were\
    \ read from the file, and the names of the columns are assumed to be in the first\
    \ row of the file. If the first letters in the name of a column match one of the\
    \ strings that are in the vector (found in the `GradeTypes` slot), then it is\
    \ assumed that the column represents a graded item. There are two kinds of assignments:\
    \ numerical grades or letter grades. If a column from the data file is determined\
    \ to be a graded item, then its type is checked. If the type is a numeric type,\
    \ then it is assumed that the course type is for a numeric grade (an object from\
    \ the `NumericGrade` class); otherwise, it is assumed to be a letter grade (an\
    \ object from the `LetterGrade` class):\n\n```\n```r\nsetGeneric(name=\"ReadGrades\"\
    ,\n           def=function(course)\n           {\n               standardGeneric(\"\
    ReadGrades\")\n           }\n)\n```\n```\n\n```\n```r\nsetMethod(f=\"ReadGrades\"\
    ,\n          signature=\"Course\",\n          definition=function(course)\n  \
    \        {\n              grades <- read.csv(GetFileName(course))\n          \
    \    convertedGrades <- list()\n              courseTypes <- GetGradeTypes(course)\n\
    \              for (gradeItem in names(grades))\n              {\n           \
    \       # Go through each column from the file.\n                  for (type in\
    \ courseTypes)\n                  {\n                      # go through each course\
    \ type and determine if\n                      # this column is a quiz/test/hw?\n\
    \                      if(length(grep(type,gradeItem))>0)\n                  \
    \    {\n                          # The prefix for the name matches one of\n \
    \                         # the predefined types.\n                          if((class(grades[[gradeItem]])==\"\
    numeric\" ||\n                             (class(grades[[gradeItem]])==\"integer\"\
    )) {\n                              thisItem <- NumericGrade()\n             \
    \                 #print(paste(\"This item,\",gradeItem,\n                   \
    \           #   \",is a numeric grade item.\",\n                             \
    \ #   class(thisItem)))\n                          } else {\n                \
    \              thisItem <- LetterGrade()\n```\n```"
  merge: -1
  img_proc: true
