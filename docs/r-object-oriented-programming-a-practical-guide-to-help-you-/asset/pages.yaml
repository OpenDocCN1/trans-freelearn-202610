    +             # Move in the opposite direction.

    +             return(list(newPos=currentPos - newStep,

    +                         newAngle=angle+pi))

    +     }

    +     # All is good. Accept this move.

    +     return(list(newPos=currentPos + newStep,

    +                 angle=angle))

    + }

    >

