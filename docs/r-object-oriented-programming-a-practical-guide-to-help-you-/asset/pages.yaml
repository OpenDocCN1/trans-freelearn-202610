  md: "# # Matrices and arrays\n\nTables are a special case of an array. An array\
    \ or a matrix can be constructed directly using either the `array` or `matrix`\
    \ commands. The `array` command takes a vector and dimensions, and it constructs\
    \ an array using column major order. If you wish to provide the data in row major\
    \ order, then the command to transpose the result is `t`.\n\n```\n```r\n> a <-\
    \ c(1,2,3,4,5,6)\n> A <- array(a,c(2,3))\n> A\n     [,1] [,2] [,3]\n[1,]    1\
    \    3    5\n[2,]    2    4    6\n> t(A)\n     [,1] [,2]\n[1,]    1    2\n[2,]\
    \    3    4\n[3,]    5    6\n```\n```\n\nYou are not limited to two-dimensional\
    \ arrays. The dim option can include any number of dimensions. In the following\
    \ example, a three-dimensional array is created by using three numbers for the\
    \ number of dimensions:\n\n```\n```r\n> A <- array(1:24,c(2,3,4),dimnames=c(\"\
    row\",\"col\",\"dep\"))\n> A\n, , 1\n\n     [,1] [,2] [,3]\n[1,]    1    3   \
    \ 5\n[2,]    2    4    6\n\n, , 2\n\n     [,1] [,2] [,3]\n[1,]    7    9   11\n\
    [2,]    8   10   12\n\n, , 3\n\n     [,1] [,2] [,3]\n[1,]   13   15   17\n[2,]\
    \   14   16   18\n\n, , 4\n\n     [,1] [,2] [,3]\n[1,]   19   21   23\n[2,]  \
    \ 20   22   24\n\n> A[2,3,4]\n[1] 24\n```\n```\n\nA matrix is a two-dimensional\
    \ array and is a special case that can be created using the `matrix` command.\
    \ Rather than using the dimensions, the `matrix` command requires that you specify\
    \ the number of rows or columns. The command has an additional option to"
  merge: -1
  img_proc: true
