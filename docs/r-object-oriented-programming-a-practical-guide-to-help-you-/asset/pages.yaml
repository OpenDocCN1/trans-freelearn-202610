    First a range of values, x, is defined, and then the height of the probability
    density function for an $X^2$ distribution with df=30 is plotted. Next, another
    $X^2$ distribution with df=35 is plotted on the same plot using the `points` command:


    ```

    ```r

    > x <- seq(0.0,100.0,by=0.1)

    > prob <- dchisq(x,df=30)

    > plot(x,prob,main="Chi Squared Dist.",xlab=''x'',ylab=''p'',col=2,type="l")

    > probTwo <- dchisq(x,df=35)

    > points(x,probTwo,col=3,type="l")

    ```

    ```'
