  md: "# Polymorphism\n\nThe definition of S4 classes allows methods to be overloaded.\
    \ That is, multiple functions that have the same name can be defined, and the\
    \ function that is executed is determined by the arguments’ types. We will now\
    \ examine this idea in the context of defining the methods used to set the activity\
    \ level in the Ant class.\n\nTwo or more functions can have the same name, but\
    \ the types of the arguments passed to them differ. There are two methods to set\
    \ the activity level. One takes a floating point number and sets the activity\
    \ level based to the value passed to it. The other takes a logical value and sets\
    \ the activity level to zero if the argument is FALSE; otherwise, it sets it to\
    \ a default value.\n\nThe idea is to use the signature option in the setMethod\
    \ command. It is set to a vector of class names, and the order of the class names\
    \ is used to determine which function should be called for a given set of arguments.\
    \ An important thing to note, though, is that the prototype defined in the setGeneric\
    \ command defines the names of the arguments, and the argument names in both methods\
    \ must be exactly the same and in the same order:\n\n```\nsetGeneric(name=\"SetActivityLevel\"\
    ,\n           def=function(antie,activity)\n           {\n               standardGeneric(\"\
    SetActivityLevel\")\n           }\n)\n\nsetMethod(f=\"SetActivityLevel\",\n  \
    \        signature=c(\"Ant\",\"logical\"),\n          definition=function(antie,activity)\n\
    \          {\n              if(activity) {\n                  antie@ActivityLevel\
    \ = 0.1\n              } else {\n                  antie@ActivityLevel = 0.0\n\
    \              }\n              return(antie)\n          }\n)\n\nsetMethod(f=\"\
    SetActivityLevel\",\n          signature=c(\"Ant\",\"numeric\"),\n          definition=function(antie,activity)\n\
    \          {\n              if(activity>=0.0) {\n                  antie@ActivityLevel\
    \ = activity\n              } else {\n                  warning(\"The activity\
    \ level cannot be negative\")\n              }\n              return(antie)\n\
    \          }\n)\n```\n\nOnce the two methods are defined, R will use the class\
    \ names of the arguments to"
  merge: -1
  img_proc: true
- pgno: 196
  md: 'determine which function to call in a given context:


    ```

    ```r

    > ant2 <- SetActivityLevel(ant2,0.1)

    > ant2@ActivityLevel

    [1] 0.1

    > ant2 <- SetActivityLevel(ant2,FALSE)

    > ant2@ActivityLevel

    [1] 0

    ```

    ```


    There are two additional data types recognized by the signature option: ANY and
    missing. These can be used to match any data type or a missing value. Also note
    that we have left out the use of ellipses (...) for the arguments in the preceding
    examples. The ... argument must be the last argument and is used to indicate that
    any remaining parameters are passed as they appear in the original call to the
    function. Ellipses can make the use of the overloaded functions in a more flexible
    way than indicated. More information can be found using the `help(dotsMethods)`
    command.'
