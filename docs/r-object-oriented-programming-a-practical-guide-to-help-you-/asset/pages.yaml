- pgno: 247
  md: '# # Chapter 11. Case Study – Simulation


    We will now examine a set of S3 classes designed to implement a Monte-Carlo simulation.
    The example scripts include a class to generate a single simulation as well as
    a class to run and collect the results from multiple simulations. The simulation
    class includes two derived classes. One is used for simulations of a discrete
    stochastic process, and the other is for simulations of a stochastic differential
    equation.


    This section is roughly divided into the following parts:


    +   - The simulation classes

    +   - The Monte-Carlo class

    +   - Examples


    We will first examine a set of simulation classes that are designed to generate
    a single simulation of a stochastic system. The classes make use of a base class
    to manage the parameters. Two classes are derived from the base class. The first
    derived class is used to simulate a discrete stochastic system. The second derived
    class is used to approximate a stochastic differential equation.


    After examining the simulation classes, a master class is used to manage the Monte-Carlo
    simulations. The Monte-Carlo class accepts a simulation class and collects the
    results from multiple simulations. Our focus is on the basic structure of the
    classes, so we do not discuss statistical methods for the data.


    We briefly examine an example using the classes in the last section of this chapter.
    The example focuses on how to create an object from the discrete stochastic simulation
    class and how to generate results.'
  merge: -1
  img_proc: true
- pgno: 248
  md: "# # The simulation classes\n\nThe simulation classes consist of three parts.\
    \ The Simulation class is the base class, and two classes, DiscreteSimulation\
    \ and ContinuousSimulation, are derived from the base class. We assume that the\
    \ definitions for these classes are kept in a separate file, simulationS3.R.\n\
    \nThe base class, Simulation, is used to manage the parameters and results for\
    \ a single simulation. The data includes the final time used in the simulation\
    \ and accessor methods are defined for the data:\n\n```\n########################Create\
    \ the base simulation class\n##\n## This is used to represent a single simulation\n\
    Simulation <- function()\n{\n\n    ## Create the list used to represent an\n \
    \   ## object for this class\n    me = list(\n        simulationResults = matrix(0)\n\
    \        )\n\n    ## Set the name for the class \"Simulation\"\n    class(me)\
    \ <- append(class(me),\"Simulation\")\n    return(me)\n\n}# Set the data values\
    \ that are the result of a simulation.\nsetSimulation <- function(theSimulation)\n\
    {\n    UseMethod(\"setSimulation\",theSimulation)\n}\nsetSimulation <- function(theSimulation,simulationResults)\n\
    {\n    ## Set the value of the variable theSimulation\n    theSimulation$simulationResults\
    \ <- simulationResults\n    return(theSimulation)\n}\n]\n## method to return the\
    \ data from the current set of results.\ngetFinalValues <- function(theSimulation)\n\
    {\n    UseMethod(\"getFinalValues\",theSimulation)\n}\ngetFinalValues <- function(theSimulation)\n\
    {\n    ## Get the value of the data pair at the last time step\n    size <- dim(theSimulation$simulationResults)\n\
    \    return(c(theSimulation$simulationResults[size[1],1],\n             theSimulation$simulationResults[size[1],2]))\n\
    }\n```\n\nNote that the class includes an addition method, getFinalValues, which\
    \ is used to"
  merge: -1
  img_proc: true
- pgno: 249
  md: "retrieve the last values approximated in the simulation. This method is required\
    \ by the Monte-Carlo class defined in the next section. The results are used to\
    \ determine the requisite statistics.\n\nThe next two classes are the `DiscreteSimulation`\
    \ and `ContinuousSimulation` classes. The `DiscreteSimulation` class is used to\
    \ generate an approximation to the discrete stochastic system given by the following\
    \ equation:\n\n$x_{n+1}=ax_n+bx_ny_n+N_1W_1,\\ y_{n+1}=gx_n+dy_n+N_2W_2$\n\nIn\
    \ the preceding equation, a, b, N1, g, d, and N2 are constants, and W1 and W2\
    \ are normally distributed random variables with a mean of zero and a standard\
    \ deviation of one. The `ContinuousSimulation` class is used to generate an approximation\
    \ using the Milstein scheme to the stochastic differential equation:\n\n$dx=(axy+by)dt+N_1dW_1,\\\
    \ dy=(gx+dy)dt+N_2dW_2$\n\nIn the preceding equation, a, b, N1, g, d, and N2 are\
    \ constants, and W1 and W2 are independent Wiener processes.\n\nThe complete scripts\
    \ for all of the classes can be found in the code that accompanies this text.\
    \ In the interest of brevity, we only look at one derived class: the `DiscreteSimulation`\
    \ class. The definition of the class is given here:\n\n```\n###############################################\n\
    ## Create a simulation for a discrete simulation.\n##\n## This is used to represent\
    \ the results from a discrete simulation.\nDiscreteSimulation <- function()\n\
    {\n    ## Define the base class and get the environment\n    me <- Simulation()\n\
    \    me$N <- 0\n\n    ## Set the name for the class with a numeric grade associated\
    \ with\n    ## it.\n    class(me) <- append(class(me),\"DiscreteSimulation\")\n\
    \    return(me)\n}\n```\n\nThe final method specific to this class is the `singleSimulation`\
    \ method that is used to conduct one simulation and save the results. The methods\
    \ necessary to define the discrete simulation class are as follows:\n\n```\n#\
    \ the methods to do the actual simulations.\nsingleSimulation <- function(simulation,N,T,x0,y0,alpha,beta,\n\
    \    gamma,delta, noiseOne,noiseTwo)\n{\n```"
  merge: -1
  img_proc: true
- pgno: 250
  md: "```\nUseMethod(\"singleSimulation\",simulation)\n}\n\nsingleSimulation.DiscreteSimulation\
    \ <-function(\n  simulation,N,T,x0,y0,alpha,beta,gamma,delta,noiseOne,noiseTwo)\n\
    {\n  ## Make an approximation for one run of the discrete model\n  ## with the\
    \ given parameters. Store the approximation in\n  ## the simulation slot when\
    \ done.\n\n  ## initialize the necessary variables.\n  x <- matrix(data=double(N*2),nrow=N,ncol=2)\n\
    \  x[1,1] <- x0\n  x[1,2] <- y0\n  lupe <- 2\n\n  ## Go through and make N iterations\
    \ of the stochastic model.\n  while(lupe <= N)\n    {\n      dW <- rnorm(2,mean=0,sd=1)\
    \      # Generate two random numbers\n                                      #\
    \ with a normal dist.\n      ## Take one step of the discrete model\n      x[lupe,1]\
    \ <- alpha*x[lupe-1,1] + beta*x[lupe-1,1]*x[lupe-1,2] +\n        noiseOne*dW[1]\n\
    \      x[lupe,2] <- gamma*x[lupe-1,1] + delta*x[lupe-1,2] +\n        noiseTwo*dW[2]\n\
    \      lupe <- lupe + 1\n    }\n\n  ## Save the simulation and return the result.\n\
    \  simulation <- setSimulation(simulation,x)\n  return(simulation)\n}\n```"
  merge: -1
  img_proc: true
