  md: "# # The definition of the Course class\n\nThe Course class definition is given\
    \ and then the accessors for the slots are stated. It is an S4 class. In this\
    \ case, we do not provide any checks to ensure that the information in the slots\
    \ is consistent to reduce the complexity of the example:\n\n```\n###########################################\n\
    # Create the Course class to keep track of all grades\nCourse <- setClass(\n \
    \   # Set the name for the class\n    \"Course\",\n\n    # Define the slots\n\
    \    slots = c(\n        GradesFile = \"character\",\n        GradeTypes = \"\
    character\",\n        Grades     = \"list\"\n    ),\n\n    # Set the default values\
    \ for the slots. (optional)\n    prototype=list(\n        GradesFile = \"\",\n\
    \        GradeTypes = c(\"test\",\"hw\",\"quiz\",\"project\"),\n        Grades\
    \     = list()\n    ),\n\n    # Make a function that can test to see if the data\
    \ is consistent.\n    # This is not called if you have an initialize function\
    \ defined!\n    validity=function(object)\n    {\n        return(TRUE)\n    }\n\
    )\n```\n\nEach of the slots includes a set of accessor functions to assist in\
    \ retrieving or setting information tracked by the class. We only provide the\
    \ details for one set of accessors. The methods to set and get the filename are\
    \ given. Neither of these methods exist in the default R environment so they must\
    \ be created first, as follows:\n\n```\n# Define the methods used to retrieve\
    \ or set the values within a Course object.\nsetGeneric(name=\"GetFileName\",\n\
    \           def=function(course)\n           {\n               standardGeneric(\"\
    GetFileName\")\n           }\n)\n\nsetMethod(f=\"GetFileName\",\n          signature=\"\
    Course\",\n          definition=function(course)\n          {\n              return(course@GradesFile)\n\
    \          }\n)\n```"
