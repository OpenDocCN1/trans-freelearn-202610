- pgno: 111
  md: '# # Distribution functions


    We will first discuss the way to calculate the value of a distribution function
    in R. We will then discuss discrete distributions and then continuous distributions.
    The distribution function is used to determine the probabilities that a particular
    event will occur. In the case of a discrete distribution, the function is called
    a probability mass function, and for a continuous distribution it is called a
    probability distribution function. For a discrete distribution, the probabilities
    are calculated using a sum where *f(i)* is the probability mass function:


    ![](img/18eeabe9ab8c81c5a3f4040db5906c67_111_0.png)


    Each distribution has its own parameters associated with it, and judicial use
    of the help command is highly recommended. For example, to get more information
    about the Poisson distribution, the `help(dpois)` command can be used. In the
    case of the Poisson distribution, there are two parameters required for the `dpois`
    command. The first is x and the second is lambda. The function returns the probabilities
    that a Poisson random variable with the lambda parameter returns the values given
    by x.


    For example, to plot the probabilities for a Poisson distribution with parameter
    10, the following commands are used to generate the values that can be returned
    (called x), and a bar plot is used to display them:


    ```

    ```r

    > x <- 0:20

    > probabilities <- dpois(x,10.0)

    > barplot(probabilities,names.arg=x,xlab="x",ylab="p", + main="Poisson

    Dist, l=10.0")

    ```

    ```


    For the continuous distribution, the random variable can take on a range of values,
    and instead of adding, we find the area under a curve, *f(s)*, called the probability
    density function:


    ![](img/18eeabe9ab8c81c5a3f4040db5906c67_111_1.png)


    In the next example, we use the X² distribution. The idea behind the X² distribution
    is that you sample *n* independent random variables that follow a standard normal
    distribution. You then square the values that were sampled and add them up. The
    result is defined to be an X² distribution. Note that there is one parameter,
    *n*, and it is generally specified by giving the *number of degrees of freedom*,
    which is defined to be *n-1*. The number of degrees of freedom is often referred
    to as *df*.


    For this example, the command to obtain an approximation for the probability density
    function is `dchisq`, and it takes two arguments, x and df. Here, we plot the
    probability'
  merge: -1
  img_proc: true
- pgno: 112
