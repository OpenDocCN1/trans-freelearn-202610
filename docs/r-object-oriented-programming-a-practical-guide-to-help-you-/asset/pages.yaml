  md: '# Chapter 5. Character and String

    Operations


    This chapter will provide you with a broad overview of the operations available
    for the manipulation of character and string objects. This is a relatively concise
    chapter, and the focus is on basic operations. There are roughly two parts in
    this chapter:


    +   - **Basic string operations:** This section gives you a broad overview of
    the most basic string operations

    +   - **Regular expressions:** This section gives you a brief introduction of
    three commands that make use of regular expressions'
