  md: '# # Defining an S4 class


    We will define the base Ant class called Ant. The class is represented in the
    following figure. The class is used to represent the fundamental aspects that
    we need to track for an ant, and we focus on creating the class and data. The
    methods are constructed in a separate step and are examined in the next section.


    ![](img/18eeabe9ab8c81c5a3f4040db5906c67_186_0.png)


    A class is created using the setClass command. When creating the class, we specify
    the data in a character vector using the slots argument. The slots argument is
    a vector of character objects and represents the names of the data elements. These
    elements are often referred to as the slots within the class.


    Some of the arguments that we will discuss here are optional, but it is a good
    practice to use them. In particular, we will specify a set of default values (the
    prototype) and a function to check whether the data is consistent (a validity
    function). Also, it is a good practice to keep all of the steps necessary to create
    a class within the same file. To that end, we assume that you will not be entering
    the commands from the command line. They are all found within a single file, so
    the formatting of the examples will reflect the lack of the R workspace markers.


    The first step is to define the class using the setClass command. This command
    defines a'
