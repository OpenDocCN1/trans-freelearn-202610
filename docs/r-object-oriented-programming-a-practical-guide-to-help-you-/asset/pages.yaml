  md: "# The assignment classes\n\nThere are two assignment classes, and they are\
    \ both derived from the assignment class. The first class is the NumericGrade\
    \ class, which keeps track of a numeric grade. The second class is the LetterGrade\
    \ class, which keeps track of a letter grade. The details of the classes are shown\
    \ in the next figure. The definition of the Assignment class is given in the following\
    \ figure, and the details about the accessors are omitted for the sake of brevity.\
    \ The complete code is available on the website for this book.\n\n![](img/18eeabe9ab8c81c5a3f4040db5906c67_221_0.png)\n\
    \nThe details of the NumericGrade and LetterGrade classes are given in separate\
    \ subsections in this chapter. Once the classes are given, examples are provided\
    \ to demonstrate how to use the Course class to read the grades from a file and\
    \ create the necessary assignment objects.\n\nThe assignment class is the base\
    \ class for the NumericGrade and LetterGrade classes. The class only has two slots:\
    \ the name and a number. The name is used to display the information related to\
    \ the assignment, and the number can further identify the set of grades. For example,\
    \ the grades for test 3 from a class might have a name, Test, and number set to\
    \ the value of 3.\n\nThe definition for the class is given here:\n\n```\n######################################\n\
    # Create the base assignment class\n#\n# This is used to represent the grades\
    \ for one assignment.\nAssignment <- setClass(\n    # Set the name for the class\n\
    ```"
