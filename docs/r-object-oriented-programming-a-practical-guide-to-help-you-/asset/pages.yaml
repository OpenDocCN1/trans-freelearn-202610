- pgno: 166
  md: '# Chapter 8. S3 Classes


    This is the second chapter in our introduction to programming. In the preceding
    chapter, we explored the basic control structures that help us to define the code
    that is executed, and we had our first taste of objects. We will now build on
    the idea of object-oriented programming, concentrating on S3 classes. There are
    two approaches, S3 and S4 classes. It is common for some people to use only one
    exclusively.


    This chapter is divided into three parts:


    +   - **Defining classes and methods**: This section will give a general idea
    of how methods are defined whose function depends on the class name of the primary
    argument

    +   - **Objects and inheritance**: In this section, we will discuss the way in
    which objects of a given class can be defined; we will also introduce the idea
    of inheritance in the context of S3 classes

    +   - **Encapsulation**: In this section, we will discuss the importance of encapsulation
    with respect to a class and how it is handled within the context of an R class


    At first glance, S3 objects do not appear to behave like objects as defined in
    other languages. The definition is an odd implementation compared to Java or C++.
    On the plus side, S3 objects are relatively simple and can offer a powerful way
    to deal with a wide variety of circumstances.


    We have seen a variety of data structures as well as functions, and in this chapter,
    we will see how the class attribute can be used to dictate how a function responds
    when a list is passed to a function. The idea is that the class attribute for
    an object is a vector of names, and the vector represents an ordered set of names
    to search when deciding what action a function should take. We will build on and
    extend one example throughout this chapter. The idea is that we wish to create
    a set of classes that can be used to simulate a random variable, which follows
    a geometric distribution. There will be two classes. The first class is for a
    fair coin, in which we flip the coin until *heads* is tossed. The second class
    is for a fair, six-sided die, in which we roll until a *1* is rolled.'
  merge: -1
  img_proc: true
- pgno: 167
  md: '# Defining classes and methods


    The `class` command is similar to other attribute commands, and it can be used
    to either set or get information about an object’s class. An object’s class is
    a vector, and each item in the vector is the name of a class. The first element
    in the class vector is the object’s base class, and it inherits from the other
    classes as you read from left to right.


    We first focus on the situation where an object has a single class and will examine
    inheritance in the section that follows. The example examined throughout this
    chapter is used to simulate one experiment that follows a geometric distribution.
    The idea is that you repeat some experiment and stop when the first success occurs.
    First, we examine two classes, and we construct a function that will take an action
    depending on the class name. The first class is used to represent a fair, six-sided
    die. The die will be rolled, giving an integer between 1 and 6 inclusive, and
    the experiment stops when a 1 is returned. The second class represents a fair
    coin. The coin will be flipped returning either an H or a T, and the experiment
    stops when H is returned.


    The two class definitions are illustrated in the following figure. Each class
    keeps track of the trials, and the results are kept in a vector. The two methods
    include a method to reset the history, but more will be added when we examine
    inheritance. In this example, we are not creating methods in the traditional sense
    but are creating functions that take appropriate action based on the class name
    of the argument passed to them. Have a look at the following diagram:


    ![](img/18eeabe9ab8c81c5a3f4040db5906c67_167_0.png)


    *The methods associated with the die and coin classes*


    First, we define the two classes. Each class is composed of a list, and the class
    names are set to `Die` and `Coin` respectively. (The names are strings that we
    make up.) Each class consists of a list with a single numeric vector that initially
    has a length of zero. In each of the following cases, the list is created manually,
    and a class name is defined. We could have used a vector, but we used a list so
    that the examples are consistent with the way we extend the classes later:


    ```

    ```r

    > oneDie <- list(trials=character(0))

    > class(oneDie) <- "Die"


    > oneCoin <- list(trials=character(0))

    > class(oneCoin) <- "Coin"

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 168
  md: "First, we define two sets of functions. The first set of functions resets the\
    \ history, and the second set performs a single Bernoulli trial. We first focus\
    \ on a routine to reset and initialize the history, and define a function called\
    \ reset. The reset function makes use of three different functions. The first\
    \ uses the UseMethod command, which will tell R to search for the appropriate\
    \ function to call. The decision is based on the class name of the object passed\
    \ to it as the first argument. The UseMethod command looks for other functions\
    \ whose names have the form resetTrial.class_name, where the class_name suffix\
    \ must exactly match the name of the class. The exception is the default suffix\
    \ that is executed if no other function is found:\n\n```\nreset <- function(theObject)\n\
    {\n    UseMethod(\"reset\",theObject)\n    print(\"Reset the Trials\")\n}\n\n\
    reset.default <- function(theObject)\n{\n    print(\"Uh oh, not sure what to do\
    \ here!\\n\")\n    return(theObject)\n}\n\nreset.Die <- function(theObject)\n\
    {\n    theObject$trials <- character(0)\n    print(\"Reset the die\\n\")\n   \
    \ return(theObject)\n}\n\nreset.Coin <- function(theObject)\n{\n    theObject$trials\
    \ <- character(0)\n    print(\"Reset the coin\\n\")\n    return(theObject)\n}\n\
    ```\n\nNote that the functions return the object passed to them. Recall that R\
    \ passes arguments as values. Any changes you make to the variable are local to\
    \ the function, so the new value must be returned. We can now call the resetTrial\
    \ function, and it will decide which function to call, given the argument passed\
    \ to it. Have a look at the following code:\n\n```\n> oneDie$trials = c(\"3\"\
    ,\"4\",\"1\")\n> oneDie$trials\n[1] \"3\" \"4\" \"1\"\n\n> oneDie <- reset(oneDie)\n\
    Reset the die\n\n> oneDie\n$trials\ncharacter(0)\n\nattr(, \"class\")\n```"
