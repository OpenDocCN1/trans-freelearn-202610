  md: '# # Example – reading grades from a file


    A short example is given to demonstrate how to read a class file. We assume that
    a CSV file, called `shortList.csv`, is in the current working directory. The first
    task to accomplish is to execute the file that contains the class definitions,
    `grades.R`. Once the class is defined, the filename is set, and the file is read.


    First, in this example, the file with the `shortList.csv` grades is assumed to
    be the following:


    ```

    ```csv

    section,test1,project1,final

    3,75,B+,89

    2,68,B,94

    3,98,B+,110

    2,76,A-,93

    1,96,A+,112

    1,81,B+,91

    2,19,A,70

    2,52,B+,70

    2,88,A,71

    ```

    ```


    The default value for the `GradeTypes` slot in the Course class is the following:


    ```

    ```r

    GradeTypes = c("test","hw","quiz","project")

    ```

    ```


