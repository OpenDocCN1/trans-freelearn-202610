  md: "# Extending the existing methods\n\nThere are a number of generic functions\
    \ defined in a basic R session, and we will examine how to extend an existing\
    \ function. For example, the show command is a generic function whose behavior\
    \ depends on the class name of the object passed to it. Since the function name\
    \ is already reserved, the setGeneric command is not used to reserve the function\
    \ name.\n\nThe show command is a standard example. The command takes an object\
    \ and converts it to a character value to be displayed. The command defines how\
    \ other commands print out and express an object. In the preceding example, a\
    \ new class called coordinate is defined; this keeps track of two values, x and\
    \ y, for a coordinate, and we will add one method to set the values of the coordinate:\n\
    \n```\n# Define the base coordinates class.\nCoordinate <- setClass(\n    # Set\
    \ the name of the class\n    \"Coordinate\",\n\n    # Name the data types (slots)\
    \ that the class will track\n    slots = c(\n        x=\"numeric\",  # the x position\n\
    \        y=\"numeric\"   # the y position\n    ),\n\n    # Set the default values\
    \ for the slots. (optional)\n    prototype=list(\n        x=0.0,\n        y=0.0\n\
    \    ),\n\n    # Make a function that can test to see if the data is consistent.\n\
    \    # (optional)\n    # This is not called if you have an initialize function\
    \ defined!\n    validity=function(object)\n    {\n        # Check to see if the\
    \ coordinate is outside of a circle of\n        # radius 100\n        print(\"\
    Checking the validity of the point\")\n        if(object@x*object@x+object@y*object@y>100.0*100.0)\
    \ {\n            return(paste(\"Error: The point is too far \",\n            \
    \    \"away from the origin.\"))\n        }\n        return(TRUE)\n    }\n)\n\n\
    # Add a method to set the value of a coordinate\nsetGeneric(name=\"SetPoint\"\
    ,\n    def=function(coord,x,y)\n    {\n        standardGeneric(\"SetPoint\")\n\
    \    }\n```"
  merge: -1
  img_proc: true
- pgno: 198
  md: "```\nsetMethod(f=\"SetPoint\",\n    signature=\"Coordinate\",\n    def=function(coord,x,y)\n\
    \    {\n        print(\"Setting the point\")\n        coord@x = x\n        coord@y\
    \ = y\n        return(coord)\n    }\n)\n```\n\nWe will now extend the show method\
    \ so that it can properly react to a coordinate object. As it is reserved, we\
    \ do not have to use the setGeneric command but can simply define it:\n\n```\n\
    setMethod(f=\"show\",\n    signature=\"Coordinate\",\n    def=function(object)\n\
    \    {\n        cat(\"The coordinate is X: \",object@x,\" Y: \",object@y,\"\\\
    n\")\n    }\n)\n```\n\nAs noted previously, the signature option must match the\
    \ original definition of a function that you wish to extend. You can use the getMethod('show')\
    \ command to examine the signature for the function. With the new method in place,\
    \ the show command is used to convert a coordinate object to a string when it\
    \ is printed:\n\n```\n> point <- Coordinate(x=1,y=5)\n[1] \"Checking the validity\
    \ of the point\"\n> print(point)\nThe coordinate is X:  1  Y:  5\n> point\nThe\
    \ coordinate is X:  1  Y:  5\n```\n\nAnother import predefined method is the initialize\
    \ command. If the initialize command is created for a class, then it is called\
    \ when a new object is created. That is, you can define an initialize function\
    \ to act as a constructor. If an initialize function is defined for a class, the\
    \ validator is not called. You have to manually call the validator using the validObject\
    \ command. Also note that the prototype for the initialize command requires the\
    \ name of the first argument to be an object, and the default values are given\
    \ for the remaining arguments in case a new object is created without specifying\
    \ any values for the slots:\n\n```\nsetMethod(f=\"initialize\",\n    signature=\"\
    Coordinate\",\n    def=function(.Object,x=0.0,y=0.0)\n    {\n        print(\"\
    Checking the point\")\n        .Object = SetPoint(.Object,x,y)\n        validObject(.Object)\
    \ # you must explicitly call the\n                            # inspector\n  \
    \      return(.Object)\n    }\n```"
