- "## 第 11 章 案例研究——模拟\n\n我们现在将检查一组设计用于实现蒙特卡洛模拟的 S3 类。示例脚本包含一个用于生成单次模拟的类，以及一个用于运行并收集多次模拟结果的类。模拟类包含两个派生类。一个用于离散随机过程的模拟，另一个用于随机微分方程的模拟。\n\
  \n本节大致分为以下部分：\n\n- 模拟类\n- 蒙特卡洛类\n- 示例\n\n我们首先检查一组设计用于生成随机系统单次模拟的模拟类。这些类使用一个基类来管理参数。从基类派生出两个类。第一个派生类用于模拟离散随机系统。第二个派生类用于近似随机微分方程。\n\
  \n在检查模拟类之后，使用一个主类来管理蒙特卡洛模拟。蒙特卡洛类接受一个模拟类，并收集多次模拟的结果。我们的重点是这些类的基本结构，因此我们不讨论数据的统计方法。\n\
  \n我们将在本章最后一节简要检查一个使用这些类的示例。该示例重点介绍如何从离散随机模拟类创建对象，以及如何生成结果。\n\n\n\n\n### 模拟类\n\n\
  模拟类由三部分组成。Simulation 类是基类，DiscreteSimulation 和 ContinuousSimulation 两个类派生自基类。我们假设这些类的定义保存在单独的文件\
  \ simulationS3.R 中。\n\n基类 Simulation 用于管理单个模拟的参数和结果。数据包括模拟中使用的最终时间，并为数据定义了访问方法：\n\
  \n```\n########################Create the base simulation class\n##\n## This is\
  \ used to represent a single simulation\nSimulation <- function()\n{\n\n    ## Create\
  \ the list used to represent an\n    ## object for this class\n    me = list(\n\
  \        simulationResults = matrix(0)\n        )\n\n    ## Set the name for the\
  \ class \"Simulation\"\n    class(me) <- append(class(me),\"Simulation\")\n    return(me)\n\
  \n}# Set the data values that are the result of a simulation.\nsetSimulation <-\
  \ function(theSimulation)\n{\n    UseMethod(\"setSimulation\",theSimulation)\n}\n\
  setSimulation <- function(theSimulation,simulationResults)\n{\n    ## Set the value\
  \ of the variable theSimulation\n    theSimulation$simulationResults <- simulationResults\n\
  \    return(theSimulation)\n}\n```\n## method to return the data from the current\
  \ set of results.\ngetFinalValues <- function(theSimulation)\n{\n    UseMethod(\"\
  getFinalValues\",theSimulation)\n}\ngetFinalValues <- function(theSimulation)\n\
  {\n    ## Get the value of the data pair at the last time step\n    size <- dim(theSimulation$simulationResults)\n\
  \    return(c(theSimulation$simulationResults[size[1],1],\n             theSimulation$simulationResults[size[1],2]))\n\
  }\n```\n\n请注意，该类包含一个附加方法 getFinalValues，用于检索模拟中近似的最后值。该方法由下一节中定义的 Monte-Carlo 类所必需。结果用于确定所需的统计量。\n\
  \n接下来的两个类是 `DiscreteSimulation` 和 `ContinuousSimulation` 类。`DiscreteSimulation`\
  \ 类用于生成以下方程给出的离散随机系统的近似值：\n\n$x_{n+1}=ax_n+bx_ny_n+N_1W_1,\\ y_{n+1}=gx_n+dy_n+N_2W_2$\n\
  \n在前述方程中，a、b、N1、g、d 和 N2 为常数，W1 和 W2 为均值为零、标准差为一的正态分布随机变量。`ContinuousSimulation`\
  \ 类用于使用 Milstein 格式生成随机微分方程的近似值：\n\n$dx=(axy+by)dt+N_1dW_1,\\ dy=(gx+dy)dt+N_2dW_2$\n\
  \n在前述方程中，a、b、N1、g、d 和 N2 为常数，W1 和 W2 为独立的维纳过程。\n\n所有类的完整脚本都可以在随本文本提供的代码中找到。出于简洁考虑，我们只查看一个派生类：`DiscreteSimulation`\
  \ 类。该类的定义如下所示：\n\n```\n###############################################\n## Create\
  \ a simulation for a discrete simulation.\n##\n## This is used to represent the\
  \ results from a discrete simulation.\nDiscreteSimulation <- function()\n{\n   \
  \ ## Define the base class and get the environment\n    me <- Simulation()\n   \
  \ me$N <- 0\n\n    ## Set the name for the class with a numeric grade associated\
  \ with\n    ## it.\n    class(me) <- append(class(me),\"DiscreteSimulation\")\n\
  \    return(me)\n}\n```\n\n该类特有的最后一个方法是 `singleSimulation` 方法，用于进行一次模拟并保存结果。定义离散模拟类所需的方法如下：\n\
  \n```\n# the methods to do the actual simulations.\nsingleSimulation <- function(simulation,N,T,x0,y0,alpha,beta,\n\
  \    gamma,delta, noiseOne,noiseTwo)\n{\n```\n\n```\nUseMethod(\"singleSimulation\"\
  ,simulation)\n}\n\nsingleSimulation.DiscreteSimulation <-function(\n  simulation,N,T,x0,y0,alpha,beta,gamma,delta,noiseOne,noiseTwo)\n\
  {\n  ## Make an approximation for one run of the discrete model\n  ## with the given\
  \ parameters. Store the approximation in\n  ## the simulation slot when done.\n\n\
  \  ## initialize the necessary variables.\n  x <- matrix(data=double(N*2),nrow=N,ncol=2)\n\
  \  x[1,1] <- x0\n  x[1,2] <- y0\n  lupe <- 2\n\n  ## Go through and make N iterations\
  \ of the stochastic model.\n  while(lupe <= N)\n    {\n      dW <- rnorm(2,mean=0,sd=1)\
  \      # Generate two random numbers\n                                      # with\
  \ a normal dist.\n      ## Take one step of the discrete model\n      x[lupe,1]\
  \ <- alpha*x[lupe-1,1] + beta*x[lupe-1,1]*x[lupe-1,2] +\n        noiseOne*dW[1]\n\
  \      x[lupe,2] <- gamma*x[lupe-1,1] + delta*x[lupe-1,2] +\n        noiseTwo*dW[2]\n\
  \      lupe <- lupe + 1\n    }\n\n  ## Save the simulation and return the result.\n\
  \  simulation <- setSimulation(simulation,x)\n  return(simulation)\n}\n```\n\n###\
  \ 蒙特卡洛类\n\n最后检查的类是 MonteCarlo 类。MonteCarlo 类用于跟踪多次模拟的结果。在此，我们提供该类的部分代码列表，然后提供用于生成多次模拟的方法。\n\
  \n首先，给出定义该类所需的代码：\n\n```\n###############################################\n# Create\
  \ the Monte Carlo class\n#\n# This class is used to make many simulations\nMonteCarlo\
  \ <- function()\n{\n\n    # Define the slots\n    me = list(\n\n        ## First\
  \ define the parameters for the stochastic model\n        N         = 0,\n     \
  \   T         = 0,\n        x0        = 0,\n        y0        = 0,\n        alpha\
  \     = 0,\n        beta      = 0,\n        gamma     = 0,\n        delta     =\
  \ 0,\n        noiseOne  = 0,\n        noiseTwo  = 0,\n\n        ## Define the data\
  \ to track and the number of trials\n        xData = 0,\n        yData = 0\n\n \
  \   )\n    ## Set the name for the class\n    class(me) <- append(class(me),\"MonteCarlo\"\
  )\n    return(me)\n}\n\n# Define the method used to initialize the data prior to\
  \ a run.\nprepare <- function(monteCarlo,number)\n{\n    UseMethod(\"prepare\",monteCarlo)\n\
  }\nprepare.MonteCarlo <- function(monteCarlo,number)\n{\n    ## Set the number of\
  \ trials and initialize the values to\n    ## zeroes.\n    monteCarlo$xData <- double(number)\n\
  \    monteCarlo$yData <- double(number)\n    return(monteCarlo)\n}\n```\n\n该类还需要一个额外的方法。simulations\
  \ 方法用于创建多次模拟并记录结果：\n\n```\n```r\nsimulations <- function(monteCarlo,number,simulation)\n\
  {\n    UseMethod(\"simulations\",monteCarlo)\n}\n\nsimulations.monteCarlo <- function(monteCarlo,number,simulation)\n\
  {\n    ## Set the number of trials and initialize the values\n    monteCarlo <-\
  \ prepare(monteCarlo,number)\n    params <- getParams(monteCarlo)  # get the parameters\n\
  \n    ## Perform the simulations\n    lupe <- 0\n    while(lupe < number)\n    {\n\
  \        lupe <- lupe + 1 # increment the count\n        ## Perform a single simulation.\n\
  \        simulation <- singleSimulation(\n            simulation,\n            params[1],params[2],params[3],params[4],params[5],\n\
  \            params[6],params[7],params[8],params[9],params[10])\n        ## Get\
  \ the last values of the simulation and record them.\n        values <- getFinalValues(simulation)\n\
  \        monteCarlo <- setValue(monteCarlo,values[1],values[2],lupe)\n    }\n\n\
  \    return(monteCarlo)\n}\n```\n```\n\n### 总结\n\n定义了一个 S3 类的示例，可用于跟踪一组模拟。类中包括一个用于创建单个模拟的单独类。单个模拟可以是对离散或连续随机过程的近似。还开发了另一个类，可以跟踪大量模拟的结果。\n\
  \n在下一章中，我们将研究另一个扩展示例。下一章的重点是创建一组 S3 类，以提供一种通用方法来处理各种数据类型回归任务。您可以从 https://www.packtpub.com/sites/default/files/downloads/66820S_Case_Study_Regression\
  \ 下载本章\n\n"
- '## 附录 A. 包管理


  这里简要概述了如何使用包。作为参考，列出了用于管理包的基本命令。它并不详尽，仅作为管理与你所安装的 R 相关的包的简要参考。


  本附录分为四个部分：


  - 如何访问包的概述

  - 如何安装包的概述

  - 如何移除包的概述

  - 如何更新包的概述


  R 最大的优势之一是能够使用专门的包，而且有大量的包可用。有些包包含在常规安装中，有些包则必须单独安装和维护。我们简要概述了如何在你的系统上安装、移除和升级已安装的包。


  我们首先讨论两个在处理包时常用的命令。第一个是`installed.packages`命令。该命令将列出安装中的所有包。另一个命令是`library`命令。`library`命令用于告诉
  R 使用给定库中可用的命令。在以下示例中，第一个命令显示有关 splines 包的信息，第二个命令必须在使用 splines 包之前输入：


  ```r

  > library(help = "splines")

  > library(splines)

  ```


  如果一个包不在你的安装中，你需要安装它。安装包的命令，奇怪的是，是`install.packages`命令。在以下示例中，car 包（用于额外的回归选项）被安装。这里不提供完整细节。你必须回答一系列问题，然后
  R 将自动获取并为你安装该包：


  ```r

  > install.packages("car")

  ```


  使用`remove.packages`命令也可以轻松移除包。在以下示例中，我们移除了 car 包：


  ```r

  > remove.packages("car")

  ```


  最后讨论的主题是如何更新你的包。要更新所有包，只需使用`update.packages`命令。在以下示例中，输入了命令，但不提供完整细节。提交命令后，你会看到一个可以更新的包列表，然后你必须决定在你的系统上更新哪些包：


  ```r

  > update.packages()

  ```

