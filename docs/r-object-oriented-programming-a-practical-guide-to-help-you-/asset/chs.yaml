  \n### 封面设计\n\nAlwin Roy\n\n## 关于作者\n\n**Kelly Black** 是克拉克森大学数学系的教员。他的背景是数值分析，专注于谱方法和随机微分方程的应用。他在分析蒙特卡罗模拟结果时广泛使用\
  \ R。\n\n除了将 R 用于自己的研究兴趣外，Kelly 还在统计学课程中使用 R 环境。他在课堂上分享 R 使用经验方面有着丰富的经验。使用 R 探索数据集是课程的重要组成部分。\n\
  \n我想感谢我的妻子和女儿对我的支持和启发。你们是我的生命，我们共同完成这一切。\n\n我还希望感谢那些在本书完成过程中直接发挥作用的人。特别感谢内容开发编辑\
  \ Parita Khedekar，她负责统筹一切，使我保持进度，并确保本书的整体完整性。另外还要感谢技术编辑 Tanvi Bhatt，她维护了全书的一致性并提供了技术指导。谢谢！\n\
  \n我还要感谢审稿人。遗憾的是，你们的一些见解未能融入本作品。我确实阅读了你们的评审意见并十分珍视。我尽力平衡你们的关切。同样感谢你们。\n\n## 关于审稿人\n\
  \n**Mzabalazo Z. Ngwenya** 在统计咨询领域有广泛的工作经验，目前是一名生物统计学家。他拥有开普敦大学数理统计学硕士学位，目前正在攻读博士学位。他的研究兴趣包括统计计算、机器学习和空间统计。此前，他曾参与审阅\
  \ Packt Publishing 出版的 *学习使用 RStudio 进行 R 统计计算*、*R 统计应用开发示例初学者指南* 和 *使用 R 进行机器学习*。\n\
  \n**Prabhanjan Tattar** 目前担任 Dell Global Analytics（戴尔公司）的高级业务分析顾问。他有 7 年的统计分析师经验。生存分析和统计推断是他的主要研究/兴趣领域，他已在同行评审期刊上发表了多篇研究论文，并撰写了两本关于\
  \ R 的书籍：*R 统计应用开发示例*（Packt Publishing 出版）和 *R 统计课程*（Narosa Publishing 出版）。R 包 gpk\
  \ 和 RSADBE 也由他维护。\n\n**Tengfei Yin** 在爱荷华州立大学获得分子、细胞和发育生物学（MCDB）博士学位，主攻计算生物学和生物信息学，辅修统计学。他的研究兴趣包括信息可视化、高通量生物数据分析、数据挖掘和应用统计遗传学。他开发并维护了\
  \ R 和 Bioconductor 中的多个软件包。\n\n## 为什么订阅？\n\n- 可全文检索 Packt 出版的每本书\n- 复制、粘贴、打印和标记内容\n\
  - 按需访问，可通过网页浏览器访问\n\n### Packt 账户持有者的免费访问\n\n如果您在 [www.PacktPub.com](http://www.PacktPub.com)\
  \ 拥有 Packt 账户，您可以使用该账户立即访问 PacktLib，并查看九本完全免费的书籍。只需使用您的登录凭据即可立即访问。\n\n## 前言\n\n\
  R 环境是一个强大的软件套件，最初是作为贝尔实验室开发的 S 语言的模型。最初的代码库由 Ross Ihaka 和 Robert Gentleman 于 1993\
  \ 年创建。在其他人的帮助下，它迅速发展壮大，并从此成为统计计算的标准。该软件套件本身已远远超出了语言的实现范畴，演变成一个“环境”。它是可扩展的，种类繁多的可用软件包使其成为一个强大的资源，在受欢迎程度和功能方面持续增长。\n\
  \n本书旨在为使用 R 语言编程提供资源，我们假设您将使用 R 环境来实现和测试您的代码。本书大致可分为四个部分。在第一部分中，我们讨论了理解 R 如何对数据进行分类以及可用于从数据中进行计算的基本思想和主题。在第二部分中，我们讨论了\
  \ R 如何组织数据，以及可用于跟踪数据、显示数据、读取和保存数据的选项。在第三部分中，我们讨论了 R 语言特有的编程主题以及可用于面向对象编程的选项。在第四部分中，我们提供了几个扩展示例，以演示所有主题如何组合在一起解决问题。\n\
  \n\n\n\n\n### 本书涵盖内容\n\n这里列出了各章节。前三章重点介绍将数据输入系统的基本要求，以及与数据计算相关的最基本任务。接下来的三章重点讨论在处理和检查数据时实践中遇到的各种问题，包括处理不同数据类型的具体机制。再接下来的三章重点介绍基础和高级编程主题。最后三章提供更详细的示例，以展示如何将所有思路结合起来解决问题。\n\
  \n- [第1章](#)，*数据类型*，概述了不同的数据类型。这包括基本表示形式，如浮点数、双精度数、复数、因子和整数表示形式，还包括如何通过交互式 shell\
  \ 输入向量的示例。还简要讨论了最基本的操作以及如何与 R shell 进行交互。\n\n- [第2章](#)，*组织数据*，更详细地介绍了数据在 R 环境中的组织方式。其他主题包括如何访问数据，以及如何对各种数据结构执行基本操作。所考查的主要数据结构是列表、数组、表格和数据框。\n\
  \n- [第3章](#)，*保存数据与打印结果*，详细介绍了将数据带入 R 环境的方法，并基于前一章讨论的主题进行了扩展。其他主题围绕结果的显示方式以及数据保存的各种方法展开。\n\
  \n- [第4章](#)，*计算概率和随机数*，详细考察了 R 语言中的概率和抽样特性。R 环境包含许多有助于数据分析的功能。任何统计分析都依赖于概率这一基础，这是一个不可忽视的主题。R\
  \ 语言的优势之一在于提供了多种概率和抽样选项，本章将探讨其中一些选项。\n\n- [第5章](#)，*字符和字符串操作*，详细考察了可用于检查、测试和执行字符串操作的各种选项。这是一个重要的主题，因为数据集存在不一致的情况并不少见，而从文件读取数据的例程应包含一些基本检查。\n\
  \n- [第6章](#)，*转换和定义时间变量*，详细考察了时间数据结构。第一章已经给出了基本介绍，本章将提供更多细节。时间相关数据的普遍存在使得这些数据结构的重要性不容忽视。\n\
  \n- [第7章](#)，*基础编程*，详细考察了 R 语言最基本的流程控制和编程特性。本章提供了条件执行以及各种循环结构的详细说明。此外，还讨论了与编写程序、执行和格式化相关的常见主题。\n\
  \n- [第8章](#)，*S3类*，详细考察了S3类。这是第一个也是最——\n\n### 本书所需环境\n\n假定你将在R环境中工作，示例代码已针对R 3.0.1及更高版本进行开发和测试。R环境是一种自由软件，由R基金会慷慨地提供。可以从[http://www.r-project.org/](http://www.r-project.org/)下载。本书前半部分的材料假定你可以使用R，并能在R环境中的交互式命令行下工作。后半部分的材料假定你熟悉编程，并能编写和保存计算机代码。至少，你应该拥有一个编程编辑器，并熟悉目录结构和搜索路径。\n\
  \n### 本书读者对象\n\n如果你熟悉编程，希望初步了解R环境，并学习如何使用R语言创建编程应用程序，那么这本书适合你。我们假定你对R环境有所接触，并对R有基本的了解。本书不会对某些方法和实践进行大量动机性解释，因为假定读者能够自如地进行软件应用程序开发。\n\
  \n### 约定\n\n在本书中，你会看到多种文本样式，用以区分不同种类的信息。以下是这些样式的一些示例及其含义的解释。\n\n文本中的代码词汇、数据库表名、文件夹名、文件名、文件扩展名、路径名、虚拟URL、用户输入和Twitter账号显示如下：“使用`list`命令创建列表，可使用`is.list`和`as.list`命令测试或强制转换变量。”\n\
  \n代码块设置如下：\n\n```r\n> x = rnorm(5,mean=10,sd=3)\n> x\n[1] 11.172719  8.784284 10.074035\
  \  5.735171 10.800138\n> pnorm(abs(x-10),mean=0,sd=3)-pnorm(-abs(x-10),mean=0,sd=3)\n\
  [1] 0.30413363 0.31469803 0.01968849 0.84486037 0.21030971\n>\n```\n\n当我们希望引起你对代码块特定部分的注意时，相关行或条目会以粗体显示：\n\
  \n```r\n> v <- c(1,3,5,7,-10)\n> v\n[1]   1   3   5   7 -10\n> v[4]\n[1] 7\n> v[2]\
  \ <- v[1]-v[5]\n> v\n[1]   1  11   5   7 -10\n```\n\n**新术语和重要词汇**以粗体显示。\n\n####\
  \ 注意\n\n警告或重要提示会出现在这样的框中。\n\n#### 提示\n\n技巧和诀窍显示如下。\n\n## 读者反馈\n\n我们始终欢迎读者的反馈。请告诉我们你对这本书的看法——你喜欢什么，或可能不喜欢什么。读者反馈对我们开发真正让读者受益的图书非常重要。\n\
