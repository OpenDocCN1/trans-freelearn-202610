  :\n$test1\nAn object of class \"NumericGrade\"\nSlot \"Value\":\n[1] 75 68 98 76\
  \ 96 81 19 52 88\n\nSlot \"Name\":\n[1] \"Test\"\n\nSlot \"Number\":\n[1] 1\n\n\
  $project1\nAn object of class \"LetterGrade\"\nSlot \"Value\":\n[1] \"B+\" \"B\"\
  \  \"B+\" \"A-\" \"A+\" \"B+\" \"A\"  \"B+\" \"A\"\n\nSlot \"Scale\":\n$'A+'\n[1]\
  \ 98\n\n$A\n[1] 95\n\n$'A-'\n[1] 92\n\n$'B+'\n[1] 88\n\n$B\n[1] 85\n\n$'B-'\n[1]\
  \ 83\n\n$'C+'\n[1] 78\n\n$C\n[1] 75\n\n$'C-'\n[1] 73\n\n$'D+'\n[1] 68\n\n$D\n[1]\
  \ 65\n\n$'D-'\n[1] 63\n\n$'F+'\n[1] 58\n\n$F\n[1] 55\n\n$'F-'\n[1] 53\n\n$'NA'\n\
  [1] 0\n\nSlot \"Name\":\n[1] \"Test\"\n\nSlot \"Number\":\n[1] 1\n\n$final\nAn object\
  \ of class \"NumericGrade\"\nSlot \"Value\":\n[1] 89  94 110  93 112  91  70  70\
  \  71\n\nSlot \"Name\":\n[1] \"Test\"\n\nSlot \"Number\":\n[1] 1\n```\n\n### 定义索引操作\n\
  \nCourse 类的对象在其 Grades 槽位中可以包含许多作业对象。我们没有定义专门的方法来获取某个特定作业，也没有定义保存作业的方法。本节我们将研究如何实现这一点，讨论围绕重新定义\
  \ `[` 操作展开。\n\n首先，我们重新定义用于获取作业的 `[` 操作。思路是：我们希望通过在方括号内写入原始文件中定义的作业名称来获取该作业的副本。为此，我们可以重新定义该操作。在这种情况下，我们希望能够在方括号内传递任意类型的对象，这样我们也可以使用整数按列表中的位置进行索引：\n\
  \n```r\nsetMethod(\"[\",\n         signature(x=\"Course\",i=\"ANY\"),\n        \
  \ definition=function(x,i=1)\n         {\n             #print(paste(\"Get grade\
  \ item\",i))\n             return(x@Grades[[i]])\n         }\n)\n```\n\n我们还希望能够获取某个作业内的单个成绩。在这种情况下，我们将在方括号内传递两个参数。第一个任务是使用前面的定义获取作业，然后获取该作业中索引与第二个参数匹配的成绩：\n\
  \n```r\nsetMethod(\"[\",\n         signature(x=\"Course\",i=\"ANY\",j=\"numeric\"\
  ),\n         definition=function(x,i=1,j=1)\n         {\n             #print(paste(\"\
  course value\",i,j))\n             allGrades <- GetValue(x[i])\n             return(allGrades[[j]])\n\
  \         }\n)\n```\n\n我们假设这些操作定义在名为 `ops.R` 的文件中。一旦这些方法被读取并执行，就可以在下面的示例中使用 `[`\
  \ 操作来获取 `test1` 的副本，或查看 `test1` 中的第三个成绩：\n\n```r\n> source('grades.R')\n> source('ops.R')\n\
  > source('overriding.R')\n> course <- Course()\n> course <- SetFileName(course,\"\
  shortList.csv\")\n> course <- ReadGrades(course)\n> course['test1']\n[1] Assignment:\
  \ Test\n[1] (9) Grades:\n[1] 75 68 98 76 96 81 19 52 88\n> course['test1',3]\n[1]\
  \ 98\n```\n\n本节要讨论的最后一个主题是使用 `[` 操作来设置某个条目的值。其方法与前面获取信息的方法类似。唯一的区别是，我们不再使用 `setMethod`\
  \ 函数，而是使用 `setReplace` 方法，并且函数的最后一个参数是要在相应对象中设置对应条目的值：\n\n```r\nsetReplaceMethod(\"\
  [\",\n                 signature(\"NumericGrade\"),\n                 definition=function(x,i,value)\n\
  \                 {\n                     #print(paste(\"grade value\",i,value))\n\
  \                     x@value[i] = value\n                     return(x)\n     \
  \            }\n                 )\n\nsetReplaceMethod(\"[\",\n                \
  \ signature(\"Course\"),\n                 definition=function(x,i,j,value)\n  \
  \               {\n                     #print(paste(\"course grade\",i,j,value))\n\
  \                     grades <- x@Grades[[i]]\n                     grades[j] <-\
  \ value\n                     x@Grades[i] <- grades\n                     return(x)\n\
  \                 }\n                 )\n```\n\n有了这些定义，就可以轻松地设置课程中某个特定成绩的值，如下所示：\n\
  \n```r\n> source('grades.R')\n> source('ops.R')\n> source('overriding.R')\n>\n>\
  \ course <- Course()\n> course <- SetFileName(course,\"shortList.csv\")\n> course\
  \ <- ReadGrades(course)\n> print(course['test1'])\n[1] Assignment: Test\n[1] (9)\
  \ Grades:\n[1] 75 68 98 76 96 81 19 52 88\n> print(course['test1',3])\n[1] 98\n\
  >\n> course['test1',3] <- 99.1\n> print(course['test1',3])\n[1] 99.1\n>\n```\n\n\
  ### 重新定义现有函数\n\n如前所述，`summary`、`show` 和 `plot` 命令被扩展为在接收到 `NumericGrade` 或 `LetterGrade`\
  \ 对象时以适当的方式作出反应。扩展这些函数只需使用 `setMethod` 命令为这些函数定义新方法即可。这些命令都已存在，因此无需使用 `setGeneric`\
  \ 命令来保留名称。也就是说，我们只需定义当传入 `NumericGrade` 或 `LetterGrade` 类的成员对象时与该命令关联的方法。\n\n在第一个示例中，我们扩展了\
  \ `summary` 命令。在这种情况下，如果传递给函数的对象是 `NumericGrade` 而不是 `LetterGrade`，函数应该有不同的行为。对于\
  \ `LetterGrade` 对象，`summary` 命令会获取成绩并打印成绩的频率表：\n\n```r\nsetMethod(f=\"summary\"\
  ,\n          signature=\"LetterGrade\",\n          definition=function(object,...)\n\
  \          {\n              # Get the letter grades as factors and return the\n\
  \              # frequency table.\n              values <- GetLetterGrade(object)\n\
  \              return(summary(as.factor(values)))\n          }\n)\n```\n\n在本示例中，唯一可以创建的其他类型的作业是\
  \ `NumericGrade`，但将来可能会扩展该类。我们不是仅为 `NumericGrade` 类创建 summary 函数，而是为其基类 `Assignment`\
  \ 创建一个 summary 函数。这样，传递给 summary 命令的、从 `Assignment` 类派生的参数将获得该对象的成绩，并且这些成绩被假定为一个数值向量。然后可以对向量调用\
  \ summary 命令：\n\n```r\nsetMethod(f=\"summary\",\n          signature=\"Assignment\"\
  ,\n          definition=function(object,...)\n          {\n              # Get the\
  \ grade values and return the five point\n              # summary.\n           \
  \   values <- GetValue(object)\n              return(summary(values))\n        \
  \  }\n)\n```\n\n在下面的示例中，读取了必要的文件，并读取了 `shortList.csv` 文件中的信息。找到两个不同作业（`test1` 和\
  \ `project1`）的副本，并打印每个对象的摘要：\n\n```r\n> source('grades.R')\n> source('ops.R')\n\
  > source('overriding.R')\n```\n\n\n\n\n```\nCreating a generic function for 'plot'\
  \ from package 'graphics' in the global environment\nCreating a generic function\
  \ for 'summary' from package 'base' in the global environment\n>\n> course <- Course()\n\
  > course <- SetFileName(course,\"shortList.csv\")\n> course <- ReadGrades(course)\n\
  > x <- course['test1']\n> summary(x)\n   Min. 1st Qu.  Median    Mean 3rd Qu.  \
  \  Max.\n  19.00   68.00   76.00   72.56   88.00   98.00\n> p <- course['project1']\n\
  > summary(p)\nA A+ A-  B B+\n2  1  1  1  4\n>\n```\n\n本书仓库中可用的文件包含了 show、summary\
  \ 和 plot 命令的定义。我们在这里再检查一个。NumericGrade 对象的 plot 命令比其他示例稍微复杂一些。plot 命令从传递给它的对象中获取成绩，输出直方图，在直方图顶部添加箱线图，并使用\
  \ rug 命令在同一绘图上显示数据值。\n\n该命令的参数包括作业的最高分。这个参数是必需的，因为在某些情况下，成绩有额外加分，一些学生的得分可能高于分配给班里其他学生的分数；而在另一些情况下，可能没有学生能获得满分。如果未提供此参数，则使用最高分。\n\
  \n第二个参数用于指示要使用的百分比。默认值是 10，表示直方图的分箱间断点按分数的 10% 标记处划分。例如，如果使用默认值 10，则 90-100 范围内的分数会被合并计数。\n\
  \n最后一个参数是省略号（...），表示可以将其他参数传递给该函数。方法内部的 plot 命令也使用了相同的符号。其思路是所有额外参数都会传递给 plot 命令。这使我们能够通过该方法设置各种各样的绘图参数，而无需处理任何特殊情况：\n\
  \n```\nsetMethod(f=\"plot\",\n          signature=\"Assignment\",\n          definition=function(x,maxGrade=NA,div=10,...)\n\
  \          {\n\n              #print(\"Plotting an assignment\")\n\n           \
  \   values <- GetValue(x) # Get the raw scores\n              if(is.na(maxGrade))\
  \ {\n                  # The maxGrade was not set. Assume the max score from\n \
  \                 # the data is the maximum possible.\n```\n\n### 重新定义算术运算\n\n我们要检查的最后一个主题是如何对作业定义基本的算术运算。具体来说，我们将研究如何对两个\
  \ `NumericGrade` 对象执行算术运算，以及如何向一个 `NumericGrade` 对象添加一组值。在 R 环境中，可以通过扩展一组用于收集类似操作的泛型组之一来完成。这些不同的组包括\
  \ `Arith`、`Compare`、`Ops`、`Logic`、`Math`、`Math2`、`Summary` 和 `Complex` 组。`Ops` 组包含\
  \ `Arith`、`Compare` 和 `Logic` 操作，我们扩展该组以包含 `NumericGrades` 类的对象。\n\n我们使用 `setMethod`\
  \ 函数为 `Ops` 组定义涉及 `NumericGrade` 对象的操作。生成的函数获取成绩，并使用 `callGeneric` 命令执行所需操作。该系统的一个特殊之处是它必须返回一个\
  \ `NumericGrade` 对象，而最后一步是设置传递给函数的第一个 `NumericGrade` 对象的成绩值：\n\n```\nsetMethod(\"\
  Ops\", signature(e1=\"NumericGrade\", e2=\"NumericGrade\"),\n          function(e1,\
  \ e2) {\n              theSum <- callGeneric(GetValue(e1), GetValue(e2))\n     \
  \         return(SetValue(e1,theSum))\n          }\n)\n\nsetMethod(\"Ops\", signature(e1=\"\
  NumericGrade\", e2=\"numeric\"),\n          function(e1, e2) {\n              theSum\
  \ <- callGeneric(GetValue(e1), e2)\n              return(SetValue(e1,theSum))\n\
  \          }\n)\n\nsetMethod(\"Ops\", signature(e1=\"numeric\", e2=\"NumericGrade\"\
  ),\n          function(e1, e2) {\n              theSum <- callGeneric(e1, GetValue(e2))\n\
  \              return(SetValue(e1,theSum))\n          }\n)\n```\n\n在下面的示例中，读取了 `math100.csv`\
