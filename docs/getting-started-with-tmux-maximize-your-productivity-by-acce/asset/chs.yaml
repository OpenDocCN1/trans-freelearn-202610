- '# tmux 入门指南：通过单个窗口访问多个终端会话以提高工作效率

  '
- "## 致谢\n\n感谢我出色的妻子苏珊，感谢你在四年半全职工作、就读法学院以及随后多年以创业公司的节奏工作并承担无数副业（包括这本书）期间给予我的无限耐心和支持。你无休止的支持推动着我，让我得以不断为我们未来的美好生活而努力。\n\
  \n感谢我的父母，没有你们早年的支持，我就不会成为今天的我——永远好奇，不断挑战技术的边界，去做大多数人不会做的事情，比如写这样一本书。我永远感激你们给予我出色的人生起点，以及你们一如既往的关爱与支持！\n\
  \n**Thomas Ferris Nicolaisen** 是一名软件开发者，博客、演讲和播客内容涵盖程序员使用的工具和技术。他持续关注所有平台上优秀的命令行工具，并在多年前开始使用\
  \ tmux。从那以后，他在服务器工作和桌面终端窗口中都一直在使用并享受 tmux。\n\n你可以在 www.tfnico.com 找到他的博客，以及他在 www.gitminutes.com\
  \ 上的最新播客项目。\n\n**Gustavo Sampaio** 是一名软件开发者，拥有多种专长。他熟悉多种编程语言和平台（Android、iOS、Windows、Linux、Web\
  \ 以及微控制器 Arduino）。\n\n他还从事过数字图像处理和计算机图形学方面的工作，包括高级渲染技术（全局光照、着色器、光线追踪等）、自然语言处理（朴素贝叶斯分类器和词性标注器），以及使用\
  \ OpenMPI 库进行并行计算。\n\n他目前正在攻读计算机科学学位，并在其领域有发表成果。\n\n**Ian Yang** 拥有多年的软件开发经验。他喜欢摆弄各种生产力工具。他也是一个键盘爱好者，倾向于仅用键盘完成工作。tmux\
  \ 是他最爱的工具之一。\n\n他作为一名 Web 开发者远程工作多年。目前他作为联合创始人和 CTO 运营一家移动游戏初创公司。\n\n## 前言\n\ntmux\
  \ 凭借其广泛的功能和简单的配置，正在迅速成为终端复用器的事实标准。由于它在最大化终端窗口生产力方面的强大能力，它是开发者工具箱中增长最快的工具之一。大量时间在终端中度过的开发者将极大地受益于学习如何利用\
  \ tmux 及其强大功能。通过将单个终端窗口变成多个窗口，每个窗口都有自己的状态，tmux 就像是为你的控制台加装了一个超级增压器。\n\n我们将从对 tmux\
  \ 的简单介绍开始，学习一些在日常终端使用中帮助提升生产力的方法。接着，我们将继续配置和定制 tmux，使其外观和操作方式最适合你的需求。在此过程中，我们有大量的教程和截图，方便你跟随学习而不会迷路。我们还将解释\
  \ tmux 的一些核心概念，包括它如何使用会话、窗口和窗格来划分内容和运行中的程序。\n\n在学习了一些入门主题之后，我们将深入探讨一些高级 tmux 概念。我们将介绍如何执行文本操作，在一个窗口与另一个窗口之间甚至与文件之间复制和粘贴文本。我们将学习如何使用\
  \ tmux 进行容错的 SSH 会话或结对编程，最后还将讨论一些可以与 tmux 一起使用的其他开源工具，使其更加强大。\n\ntmux 是一个非常强大的工具，其中有一些概念可能难以掌握。本书将以\
  \ tmux 手册页中找不到的方式，通过大量解释和丰富示例来帮助厘清这些难点。\n\n在本书结束时，你将更深入地理解 tmux 及其能力，以及为你的终端体验加速所需的所有工具。本书涵盖以下主题：\n\
  \n第 1 章“直接开始”将让我们迅速进入实战状态，体验一个典型的 tmux 工作流程，并沿途解释一切。这会让我们感受到 tmux 的用途，以及如何将其融入你的日常工作流程。\n\
  \n第 2 章“配置 tmux”将教我们如何更改和配置 tmux 几乎所有的行为，从它的外观和操作感到加载时执行的命令。你甚至可以配置 tmux 响应的每一个按键组合。在本章中，我们将介绍配置\
  \ tmux 的各种方式，并使其为你的工作流程进行定制。\n\n第 3 章“会话、窗口和窗格”将帮助我们全面了解会话、窗口和窗格。这些是构成 tmux 窗口管理功能的基本组件，本章将帮助我们理解它们是什么以及它们之间的关系。我们将通过示例学习许多使用它们的方法，从而用\
  \ tmux 加速我们的终端。\n\n第 4 章“文本操作”帮助我们了解 tmux 中用于文本操作的强大工具。这些工具以复制模式和粘贴缓冲区形式出现，我们将进一步学习它们以及如何使用它们进行非常强大的文本操作，例如滚动浏览已滚出屏幕的文本，以及从窗口历史记录中的任意位置复制文本并粘贴——通常完全不需要触碰鼠标。\n\
  \n第 5 章“深入探索”涉及我们已介绍主题的更多细微方面。这些主题包括 tmux 命令及其命令模式、高级粘贴缓冲区用法，以及窗口和窗格的一些高级用法。最后，我们将学习如何启动一个带有默认窗口的\
  \ tmux 会话。\n\n第 6 章“用于 SSH、结对编程等的 tmux”将带我们了解一些可能非常强大的使用模式。它将帮助我们学习如何通过 SSH 使用 tmux\
  \ 进行长会话结对编程，同时我们将使用 Vagrant 来提高可预测性和安全性。\n\n第 7 章“将其他工具与 tmux 一起使用”将让我们讨论一些可以与 tmux\
  \ 一起运行并添加更强大功能的第三方工具。我们将了解 tmuxinator（它简化了 tmux 启动配置）和 wemux（它将 tmux 的多用户体验提升到一个全新水平）。我们还将了解这些工具以及一些其他技巧和实用程序。\n\
  \n附录包含三个部分，即“为什么选择 tmux？”、“配置参考”和“键绑定与命令参考”。\n\n\n\n\n\n### 本书所需\n\n一台运行 tmux 1.8+\
  \ 的计算机（Unix、Linux 或 OS X），可从以下链接下载：\n\n```\nhttp://tmux.sourceforge.net\n```\n\n\
  ### 本书适合谁\n\n本书面向软件开发人员、DevOps 工程师以及在日常工作流程中大量使用终端的其他专业人士。熟悉终端是有用的，但无需事先使用过 tmux\
  \ 或其他终端多路复用器（如 GNU Screen）的经验。\n\n### 约定\n\n在本书中，你会看到多种文本样式，用来区分不同类型的信息。以下是这些样式的示例，以及它们的含义。\n\
  \n当我们描述要按下的键时，它会以斜体显示，如下所示：“Please press the letter b now.” 通常我们会描述一个键组合，即同时按下多个键，它会显示如下：Ctrl\
  \ + b。 这意味着按住 Control 键并按下字母 b。 我们还会看到多个键组合，按顺序按下。它们会以逗号分隔并显示如下：Ctrl + b, c。 这意味着按住\
  \ Ctrl 键并按下字母 b，然后松开两个键并按下字母 c。\n\n文本中的代码词、数据库表名、文件夹名、文件名、文件扩展名、路径名、示例 URL、用户输入和\
  \ Twitter 账号显示如下：“Simply run the tmux command show-options with a flag for which\
  \ set of options you want to view.”\n\n配置代码块设置如下：\n\n```\n# Set the status bar background\
  \ to blue\nset-option -g status-bg blue\n# Set the status bar text to white\nset-option\
  \ -g status-fg white\n\n# Set the active window background in the status bar\nset-window-option\
  \ -g window-status-current-bg magenta\n```\n\n当我们希望引起你对代码块中特定部分的注意时，相关行或项目会以粗体显示：\n\
  \n```\n# Set the active window background in the status bar\nset-window-option -g\
  \ window-status-current-bg magenta\n```\n\n```\n# Rebind the prefix key\nset-option\
  \ -g prefix C-t\n```\n\n```\n# Add a key binding for reloading our configuration\n\
  bind-key C-r source-file ~/.tmux.conf\n```\n\n任何命令行输入或输出写成如下形式：\n\n```\n$ tmux attach-session\
  \ -t tutorial\n```\n\n**新术语**和**重要词语**以粗体显示。你在屏幕上看到的词语，例如菜单或对话框中出现的词语，在文本中如下显示：“You\
  \ will see **Search Up:** appear in the lower left-hand corner.”\n\n警告或重要说明会出现在如下的框中。\n\
  \n![](img/5969098f450265ac0c7947efcdbe7889_18_0.png)\n\n提示和技巧如下所示。\n\n![](img/5969098f450265ac0c7947efcdbe7889_18_1.png)\n\
  \n### 读者反馈\n\n我们始终欢迎读者的反馈。请告诉我们你对本书的看法——你喜欢什么或可能不喜欢什么。读者反馈对我们开发你能最大程度受益的书籍标题非常重要。\n\
  \n如需发送一般反馈，只需发送电子邮件至 feedback@packtpub.com，并在邮件主题中提及书名即可。\n\n你也可以在 Twitter 上关注或直接向作者\
  \ @victorquinn 发推。\n\n如果你在某个主题上具有专业知识并且有兴趣撰写或为一本书做出贡献，请参阅 www.packtpub.com/authors\
  \ 上的作者指南。\n\n不过，你应该注意到现在终端窗口底部有一条栏。这可以在以下终端窗口的屏幕截图中看到：\n\n![](img/5969098f450265ac0c7947efcdbe7889_22_0.png)\n\
  \n恭喜！你现在正在运行 tmux。\n\n底部那条栏由 tmux 提供。我们称这条栏为状态行。状态行会提供有关你当前查看的会话和窗口的信息，以及此会话中还有哪些其他窗口可用等信息。\n\
  \n其中一些内容现在可能看起来像乱码，但随着我们在本書的进展，我们将了解更多关于这些内容含义的信息。我们还将学习如何自定义状态栏，以确保它始终显示对你的工作流程最有用的项目。这些自定义包括\
  \ tmux 本身的一部分内容（如时间、日期、你连接的服务器等）或第三方库中的内容（如笔记本电脑的电池电量、当前天气或未读邮件数量）。\n\n## 会话\n\n\
  通过不带任何参数运行 tmux，你会创建一个全新的会话。在 tmux 中，基本单元称为会话。一个会话可以有一个或多个窗口。一个窗口可以被拆分为一个或多个窗格。我们将在专门的章节中重新讨论这个主题（有关更多信息，请参阅第\
  \ 3 章，会话、窗口和窗格）；不过，作为一个预告，我们当前屏幕上显示的是一个会话中一个窗口占据整个窗口的单个窗格。想象一下，它可以被拆分为两个或多个不同的终端，每个终端运行不同的程序，每个终端的可视分割就是一个窗格。有关此内容的更多信息将在后面的章节中介绍。\n\
  \n### tmux 中的会话是什么？\n\n将 tmux 会话视为你计算机上的登录会话可能很有用。你可以登录计算机，从而启动一个新的会话。登录后输入用户名和密码，你会到达一个空的桌面。这类似于一个全新的\
  \ tmux 会话。你可以在此会话中运行一个或多个程序，每个程序都有自己的窗口或窗口，每个窗口都有自己的状态。\n\n在大多数操作系统中，你可以注销、重新登录并返回到同一个会话，窗口与你离开时完全相同。通常，你在注销时打开的一些程序仍会在后台继续运行，即使它们的窗口不再可见。\n\
  \ntmux 中的会话以非常相似的方式工作。因此，将 tmux 视为一个迷你操作系统是有用的，它在会话内管理运行的程序、窗口等。\n\n![](img/5969098f450265ac0c7947efcdbe7889_23_0.png)\n\
  \n你可以同时运行多个会话。如果你希望为正在处理的每个任务设置一个会话，这很方便。你可能有一个用于独自开发的应用程序的会话，另一个用于结对编程。或者，你可能有一个用于开发一个应用程序，另一个用于开发另一个应用程序。这样一切都可以井井有条、干净且分开。\n\
  \n### 为会话命名\n\n每个会话都有一个你可以设置或更改的名称。注意状态栏最左侧的 [0]？ 这是会话名称，用括号括起来。这里，由于你只是不带任何参数启动了\
  \ tmux，它被命名为 0。然而，这不是一个很有用的名称，所以让我们更改它。\n\n在提示符下，只需运行以下命令：\n\n```\n$ tmux rename-session\
  \ tutorial\n```\n\n### 立即上手\n\n这告诉 tmux 你想要重命名当前会话，而 tutorial 是你希望它具有的名称。当然，你可以随意命名。你应该会看到状态栏已更新，因此现在左侧不再是\
  \ [0]，而应显示 [tutorial]。\n\n![](img/5969098f450265ac0c7947efcdbe7889_24_0.png)\n\n\
  当然，很好的是状态栏现在有一个我们定义的有趣名称而不是 0，但它提供的实用功能远不止于此，我们稍后会看到！\n\n值得注意的是，这里我们为会话命名，但此相同命令也可以用于重命名现有会话。\n\
  \n### 窗口字符串\n\n状态栏有一个字符串代表每个窗口，以告知我们当前正在运行的内容。以下步骤将帮助我们进一步探索这一点：\n\n1. 让我们启动一个文本编辑器来假装我们在进行编码：\n\
  \n   ```bash\n   $ nano test\n   ```\n\n2. 现在在其中输入一些内容来模拟在一些代码上非常努力地工作：\n\n![](img/5969098f450265ac0c7947efcdbe7889_24_1.png)\n\
  \n\n\n\n\n果然，现在窗口 1 已处于活动状态，所有内容都在，就像我们离开时一样。刚才我们在这里输入了一些无意义的命令，但这里也完全可以是一个正在运行的活动进程，例如单元测试、代码检查或\
  \ `top`。任何此类进程都可以在 tmux 中于后台运行，不会有任何问题。\n\n![](img/5969098f450265ac0c7947efcdbe7889_29_0.png)\n\
  \n> 这是 tmux 最强大的功能之一。\n>\n> 在传统环境中，如果想让一个长时间运行的进程留在终端窗口中，同时又在终端里处理其他事情，就需要打开两个不同的终端窗口；如果不小心关闭其中一个窗口，该窗口中完成的工作就会丢失。\n\
  >\n> tmux 允许你只打开一个终端窗口，而这个窗口内部可以包含许多不同的窗口，并运行各种不同的进程。关闭这个终端窗口不会终止正在运行的进程；tmux 会继续在后台运行，所有程序也会继续在幕后执行。\n\
  \n## 查看按键绑定帮助\n\n现在，细心的观察者可能会注意到，输入窗口编号这一技巧只适用于前 10 个窗口。这是因为窗口编号达到两位数后，tmux 无法判断你何时输入完毕。如果这种使用前缀键加数字的技巧只适用于前\
  \ 10 个窗口（窗口 0 到 9），那么我们该如何选择编号超过 10 的窗口呢？\n\n值得庆幸的是，tmux 提供了许多在窗口之间切换的强大方式。我最喜欢的方法之一就是选择窗口界面。\n\
  \n不过，哎呀！这有点尴尬。看起来作者完全忘记了进入选择窗口界面的按键组合。但别担心，tmux 内置了一种很方便的方式，可以查看所有按键绑定。让我们使用它吧！\n\
  \n按下 <Prefix>, ?，屏幕会发生变化，显示一个列表：左侧是 `bind-key`，中间是按键绑定，右侧是它所运行的命令。你可以使用方向键上下滚动，但其中的条目非常多！\n\
  \n值得庆幸的是，还有一种更快的方式，可以直接找到你想要的条目，而不必一直滚动。\n\n按下 Ctrl + s，你会看到一个提示符，显示为 `Search Down:`。此时你可以输入字符串，帮助文档就会搜索该字符串。\n\
  \n## Emacs 模式或 vi 模式\n\ntmux 努力与开发者的默认设置保持良好配合，因此针对两种最流行的终端编辑器 Emacs 和 vi，它实际上为许多按键组合提供了两种不同的模式。这些模式在\
  \ tmux 术语中分别称为 `status-keys` 和 `mode-keys`，其值可以是 Emacs 或 vi。\n\ntmux 默认对所有按键组合使用\
  \ Emacs 模式，但可以通过配置改为 vi 模式，我们将在第 2 章“配置 tmux”中介绍相关内容。它也可能根据 shell 中的全局 `$EDITOR`\
  \ 设置自动设为 vi 模式。\n\n如果你习惯使用 Emacs，那么 Ctrl + s 应该会让你感到非常自然，因为这是 Emacs 用来搜索的命令。\n\n\
  因此，如果你尝试按下 Ctrl + s 却没有任何效果，那么你的按键很可能处于 vi 模式。对于这类与模式相关的按键，我们会尽量提供相应说明：在默认按键后面的括号中，附上\
  \ vi 模式下的对应按键。\n\n例如，在本例中，该命令应写作 Ctrl + s (/)：默认模式下使用 Ctrl + s，而 vi 模式下使用 `/`。\n\
  \n输入 `choose-window`，然后按 Enter 向下搜索，你会找到 `choose-window` 的按键绑定。看！它就在这里：`w`：\n\n\
  ![](img/5969098f450265ac0c7947efcdbe7889_30_0.png)\n\n不过，这究竟是什么意思呢？\n\n简单来说，我们可以先输入前缀键（<Prefix>），再输入帮助文档中显示的按键，从而运行所提到的命令。首先，让我们退出帮助文档。要退出这类由\
  \ tmux 生成的帮助页面或其他类似界面，只需按下 `q` 表示退出，你就会回到窗口 2 的 shell 提示符。\n\n如果你忘记了某个按键绑定，这应该是你首先采取的步骤。\n\
  \n> 这个按键绑定帮助页面的一个优点是：当你更改按键绑定时，它会动态更新。\n>\n> 稍后讲到**配置**时，你可能会想要更改绑定或绑定新的快捷键。它们都会根据你提供的配置显示在这个界面中。\n\
  >\n> 这可是手册页做不到的！\n\n现在，要打开选择窗口界面，只需输入 <Prefix>, w，因为帮助文档显示 `w` 绑定到了 **choose-window**，然后就可以了：\n\
  \n![](img/5969098f450265ac0c7947efcdbe7889_31_0.png)\n\n注意，它以类似任务管理器的界面整齐地列出了当前打开的所有窗口。\n\
  \n这个界面也是交互式的。你可以使用方向键上下移动，突出显示你想要的窗口，然后按 Enter 打开它。让我们打开正在运行 nano 的窗口。向上移动以突出显示窗口\
  \ 0，然后按 Enter。\n\n浏览按键绑定帮助时，你可能会发现更多方便且直观的方式，可以在当前活动窗口之间切换。例如，<Prefix>, p 会切换到上一个窗口，而\
  \ <Prefix>, n 会切换到下一个窗口。无论是重新熟悉已经学过的按键绑定，还是探索新的按键绑定，按键绑定帮助都是一个非常优秀的资源。\n\n## 搜索文本\n\
  \n现在我们只有三个窗口，因此很容易记住每个窗口中的内容，但如果有 30 个或 300 个窗口呢？使用 tmux，这完全有可能。（不过，这种情况既不太可能，也不太实用！你会用\
  \ 300 个活动窗口做什么呢？）\n\n另一种在窗口之间切换的便捷方式是使用 **find-window** 功能。它会提示我们输入一些文本，然后搜索所有活动窗口，并打开包含该文本的窗口。\n\
  \n如果你一直跟着操作，那么当前打开的应该是运行 nano 的窗口（窗口 0）。还记得我们在窗口 1 中打开了一个 shell，并输入了一些无意义的命令吗？让我们尝试使用\
  \ **find-window** 功能切换到那个窗口。\n\n输入 `<Prefix>, f`，你会看到如下截图所示的 **find-window** 提示符：\n\
  \n![](img/5969098f450265ac0c7947efcdbe7889_32_0.png)\n\n在这里输入 `cat test`，然后按 *Enter*。\n\
  \n你会看到自己已经切换到了窗口 1，因为其中包含 `cat test` 命令。\n\n不过，如果搜索的文本具有歧义，会发生什么呢？例如，如果你一直跟着操作，就会看到单词\
  \ **test** 在窗口 0 和窗口 1 中都出现了多次。因此，如果只使用单词 **test** 尝试执行 **find-window**，它就无法立即神奇地完成切换，因为它不知道你指的是哪个窗口。\n\
  \n值得庆幸的是，tmux 足够智能，能够处理这种情况。它会显示一个类似于前面介绍的 *choose-window* 界面的提示符，但其中只包含与查询匹配的窗口（在本例中是窗口\
  \ 0 和窗口 1；窗口 2 中没有单词 test）。它还会显示每个窗口中包含该文本的第一行，以便提供上下文。\n\n![](img/5969098f450265ac0c7947efcdbe7889_33_0.png)\n\
  \n选择窗口 0 将其打开。\n\n## 分离与重新连接\n\n现在按下 <Prefix>, d。\n\n糟糕！看起来 tmux 不见了！熟悉的状态栏不再显示。<Prefix>\
  \ 键也不再起作用。\n\n![](img/5969098f450265ac0c7947efcdbe7889_33_1.png)\n\n你可能会认为我们这些作者把你引入了歧途，导致你丢失了工作。没有正在\
  \ nano 中编写的那份详细文档，你该怎么办呢？\n\n不要害怕，探索者；我们只是在演示 tmux 的另一个非常强大的功能。<Prefix>, d 只会将当前活动会话分离，但会让它继续在后台愉快地运行！\n\
  \n没错，虽然看起来它已经消失了，但我们的会话仍然运行良好。\n\n我们该如何回到它呢？首先，让我们查看活动会话。在终端中运行以下命令：\n\n```\n$ tmux\
  \ list-sessions\n```\n\n你应该会看到一个清晰的列表，其中包含会话名称、窗口数量、创建日期和尺寸。如果你有多个会话，也会在这里看到它们。\n\
  \n![](img/5969098f450265ac0c7947efcdbe7889_34_0.png)\n\n要将已分离的会话重新连接到当前会话，只需运行以下命令：\n\
  \n```\n$ tmux attach-session -t tutorial\n```\n\n这条命令告诉 tmux 连接一个会话，并将要连接的会话指定为目标（因此使用\
  \ `-t`）。在本例中，我们要连接名为 tutorial 的会话。果然，你应该已经回到了 tmux 会话中：底部显示着现在熟悉的状态栏，你在 nano 中创作的杰作也重新出现在眼前。\n\
  \n注意，这是该命令最完整的写法。如果只有一个正在运行的会话，就像我们这个场景一样，实际上可以省略目标参数。这会将命令缩短为 `tmux attach-session`。由于\
  \ `attach-session` 还有一个更短的别名 `attach`，因此还可以进一步缩短。这样，我们只需使用 `tmux attach` 就能完成同样的操作。\n\
  \n在全文中，我们通常会使用更完整的写法，因为它们往往描述得更清楚，并将较短的对应写法留作读者练习。\n\n## 解释 tmux 命令\n\n现在你可能会注意到，`attach-session`\
  \ 听起来像是一个相当长的命令。`list-sessions` 也是如此，而且 tmux 命令词汇表中还有许多其他看起来相当冗长的命令。\n\n\n\n\n\n\
  ### Tab 补全\n\n长命令的复杂性比看起来要小，因为大多数命令都可以通过 Tab 补全。试着打开你的命令行提示符并输入以下内容：\n\n```\n$ tmux\
  \ list-se\n```\n\n接下来，按 Tab 键。你应该会看到它补全为：\n\n```\n$ tmux list-sessions\n```\n\n\
  因此，多亏了 Tab 补全，记住这些长命令的需求就很少了。\n\n请注意，Tab 补全只在某些配置的 shell 中有效，所以如果 Tab 补全技巧不起作用，你可能需要搜索网络并找到一种方法来为\
  \ tmux 启用 Tab 补全。\n\n### 别名\n\n大多数命令都有别名，即每个命令的较短形式，可以使用。例如，list-sessions 的别名是 ls。new-session\
  \ 的别名是 new。\n\n你可以通过运行 tmux 命令 list-commands（别名 lscm）轻松查看它们全部，如以下代码片段所示：\n\n```\n\
  $ tmux list-commands\n```\n\n这将显示所有 tmux 命令及其别名，完整名称后用括号括起来。\n\n在整篇文章中，我们将始终使用完整形式以求清晰，但你同样可以轻松使用别名（当然也可以使用\
  \ Tab 补全）。\n\n你会最有可能注意到的一件事是，在你的终端中只有最后几行是可见的。如果你拿起鼠标并尝试向上滚动，那也不起作用！如何查看放置在上面的文本？我们需要进入名为\
  \ Copy mode 的东西，它在本文本后面有自己的章节（参见第 4 章，Manipulating Text）。\n\n### 重命名窗口\n\n假设你想给一个窗口一个更有描述性的名称。如果你有三个不同的窗口，每个窗口都打开了\
  \ nano 编辑器，看到每个窗口都是 nano 就不会很有帮助了。幸运的是，重命名窗口非常容易。只需切换到你想要重命名的窗口。然后 <Prefix>, 会提示你输入新名称。让我们将\
  \ nano 窗口重命名为 masterpiece。\n\n请看状态栏已更新，现在显示窗口 0 及其 masterpiece 标题，如以下屏幕截图所示。幸运的是，tmux\
  \ 不够智能，无法检查窗口的内容；否则，我们不确定 masterpiece 标题是否能通过。\n\n![](img/5969098f450265ac0c7947efcdbe7889_36_0.png)\n\
  \n### 关闭窗口\n\n作为我们虚拟之旅的最后一站，让我们杀掉一个不再需要的窗口。使用我们的 find-window 技巧切换到窗口 1，输入 <Prefix>,\
  \ f, cat test, Enter 或者当然我们也可以使用不太令人兴奋的 <Prefix>, l 命令移动到最后打开的窗口。\n\n现在让我们向这个窗口告别。按\
  \ <Prefix>, & 来杀掉它。你会收到一个提示，需要确认你是否要杀掉它。\n\n这是一个破坏性过程，不像分离，所以请确保你关心的任何内容都已保存。\n\n\
  一旦你确认，窗口 1 将不复存在。可怜的窗口 1！你会看到现在只剩下窗口 0 和窗口 2：\n\n![](img/5969098f450265ac0c7947efcdbe7889_36_1.png)\n\
  \n你还会看到现在 <Prefix>,f, cat test, Enter 不再加载窗口 1，而是显示 **No windows matching: cat test**。所以，窗口\
  \ 1 真的已经不在我们身边了。\n\n每当我们创建一个新窗口时，它将采用最低可用的索引，在本例中将是 1。所以窗口 1 可以再次出现，但这次作为一个新且不同的窗口，对过去几乎没有记忆。我们也可以重新编号窗口，如后面将看到的，所以如果窗口\
  \ 1 缺失会冒犯你的审美感，不用担心，可以补救！\n\n### 总结\n\n在本章中，我们直接上手，对 tmux 中一些最酷的功能进行了旋风式巡游。\n\n\
  以下是本章涵盖的功能的快速总结：\n\n- Starting tmux\n- Naming and renaming sessions\n- The window\
  \ string and what each chunk means\n- Creating new windows\n- The prefix key\n-\
  \ Multiple ways to switch back and forth between windows\n- Accessing the help documents\
  \ for available key bindings\n- Detaching and attaching sessions\n- Renaming and\
  \ killing windows\n\n在下一章中，我们将研究配置以及 tmux 可以以多种方式进行自定义以适应你的口味和工作流程。\n\n对于本章及以后所有章节中学习到的所有命令的参考，你可以参考\
  \ *Appendix* 中的 *Key binding and command reference* 部分。\n\n- Binding a new prefix\
  \ key\n- Binding keys without the prefix key\n- Unbinding keys\n- Revising the status\
  \ bar\n- Option types\n- Handy configuration tips\n\n到本章结束时，我们还将构建一个示例配置文件，你可以用它作为你自己的个性化配置的起点。\n\
  \n### 使用 set-option 命令\n\n在 tmux 中设置和配置选项的主要方式是通过恰如其名命名的 `set-option` 命令。\n\n此命令可以单独调用以临时设置选项。然而，大多数时候，我们将使用它在\
  \ tmux 配置文件中设置选项，以便每次启动 tmux 时，选项都会按我们希望的方式设置。\n\n为了体验使用 `set-option` 命令临时设置选项，打开一个终端窗口并启动\
  \ tmux；或者，如果你一直在按照第 1 章 Jump Right In 进行操作，只需在窗口中输入以下命令：\n\n```\n$ tmux set-option\
  \ status off\n```\n\n一旦你这样做，状态栏就会消失！此设置仅是临时的，所以如果你保持原样，结束会话并重新启动 tmux 或创建新会话，它将不会加载此设置。换句话说，状态栏将会出现。\n\
  \n你所做的是告诉 tmux 将选项 `status` 设置为值 `off`。你可以使用此命令以这种方式即时设置任何 tmux 选项。没有状态栏可能会有点不安，所以让我们把它重新打开：\n\
  \n```\n$ tmux set-option status on\n```\n\n如果我们希望这些配置选项在 tmux 重启和会话之间保持不变，我们需要某种方法告诉\
  \ tmux 它们的值应该是什么。我们将通过创建 tmux 配置文件来做到这一点。\n\n### 创建 tmux 配置文件\n\n为了在重新启动 tmux 后保留设置，我们将创建一个配置文件，其中包含我们想要设置的所有选项及其值的相关信息。\n\
  \n像许多其他基于 Unix 的实用程序一样，配置 tmux 只需在你的主目录中创建一个名为 .tmux.conf 的文件即可。\n\n然而，与许多其他配置文件不同，tmux\
  \ 配置文件不包含程序的某种特定配置语言，而是由一系列在 tmux 启动时按顺序运行的 tmux 命令组成。我们将看到的大多数命令都是简单的 set-option\
  \ 命令，类似于我们在前面的示例中玩过的命令。让我们创建并开始构建我们的配置文件：\n\n```\n$ cd ~\n$ touch .tmux.conf\n```\n\
  \n在你喜欢的文本编辑器中打开这个新创建的文件，我们就可以开始了！\n\n> 与大多数基于 Unix 的实用程序一样，你个人目录中的此文件仅包含你自己的用户的配置。\n\
  > 也可以设置将应用于系统所有用户的全局 tmux 配置。它遵循与个人配置文件相同的格式，但通常位于 /etc/tmux.conf。\n> 然而，由于系统上并非所有用户都想要相同的全局配置，最好只修改你自己的个人配置。\n\
  \n### Emacs 或 vi 模式\n\n正如我们在第 1 章 Jump Right In 中发现的那样，tmux 试图通过为两种最广泛使用的文本编辑器各提供一套键绑定来帮助开发者。如果你更倾向于其中一种，这很可能是你想要首先更改以使\
  \ tmux 对你感觉正确的事情之一。\n\ntmux 的默认设置是使用 Emacs 模式键，所以如果你是 Emacs 用户，你可能已经准备就绪。tmux 也会尝试提供帮助，并可能基于环境变量默认切换到其中一组或另一组。要检查\
  \ tmux 当前处于哪种模式，运行以下命令：\n\n```\n$ tmux show-options -g | grep key\n```\n\n\n\n##\
  \ 修改状态栏的背景颜色\n\n让我们在配置中添加一项，用来改变状态栏的颜色。通过前面的快速上手，我们看到状态栏的默认颜色是某种绿色。注意，我们的配置中恰好也有一种绿色，但在你的终端上很可能显示为不同的颜色，除非你使用的配色方案与我们相同。\n\
  \n> 作者使用的配色方案叫做 Solarized。这是一套包含深色和浅色两种变体的配色方案，专为终端和可读性优化。它由 Ethan Schoonover 开发，因其精确性、对称性，以及能让几乎任何代码看起来都相当漂亮，在技术社区中获得了不少追随者。更多信息请访问\
  \ http://ethanschoonover.com/solarized。\n\n我们当前终端的配色方案如下面的截图所示：\n\n![](img/5969098f450265ac0c7947efcdbe7889_43_0.png)\n\
  \n哎呀！在我们当前的配色方案下，这看起来相当难看。\n\n假设我们希望它变成一种更好看的蓝色。打开你喜欢的文本编辑器，编辑 `~/.tmux.conf`，添加下面这一行：\n\
  \n```\nset-option -g status-bg blue\n```\n\n这一行指定我们希望状态栏为蓝色，而不是默认颜色（在我们的系统上默认恰好是绿色）。\n\
  \n你应该会看到状态栏立即变成蓝色（同样，这取决于你的 shell 和终端程序对颜色的支持能力）。\n\n注意，我们做的只是把写入配置文件的那段文本，在 tmux\
  \ 后面输入一遍，然后就搞定了。\n\n回想一下，像这样在 shell 中运行的任何命令都只是临时的，所以我们仍然需要配置文件；不过，这是一种快速测试某个命令是否能按预期工作的好方法。\n\
  \n## 重新加载配置\n\n现在，我们有了一个全新的配置文件，里面包含改变状态栏颜色的新命令，但在我们重新加载配置、让 tmux 从新文件中加载命令之前，这个配置是没有用的。\n\
  \n保存配置文件后，它已经准备好生效了，但是看，你的状态栏仍然是绿色的！我们如何告诉 tmux 去获取最新的配置并重新加载窗口以使用该配置呢？有两种方法可以告诉\
  \ tmux 重新加载配置。\n\n第一种是彻底终止所有会话，然后重新启动 tmux。这不是一个很吸引人的选项，因为它需要关闭我们所有的 tmux 会话，这也就意味着要关闭所有当前打开并运行的程序。然后，我们必须重新启动所有的\
  \ tmux 会话和窗口，并重启所有程序，才能回到之前的状态——仅仅是为了重新加载配置。这样做可行，但总体而言是个相当混乱的解决方案。一般来说，tmux 在重启时会加载新的配置文件，这是相当不错的，因为这意味着之后任何\
  \ tmux 启动都会使用我们最新的配置，这很合理。然而，这迫使我们关闭所有正在运行的应用来加载它，这并不理想。\n\n第二种更常见也更有用的方法是使用 `tmux\
  \ source-file` 命令。这个命令会告诉 tmux 去获取最新的配置并立即加载。在这种情况下，无需离开 tmux！\n\n在 tmux 中进入命令行提示符（如果你跟着第\
  \ 1 章“直接上手”操作过，你会知道只需按下 <Prefix>, 2 就能调出我们留在那里的命令提示符）。如果当前没有打开的窗口，只需在 tmux 中打开一个新窗口（<Prefix>,\
  \ c），默认就会以命令提示符启动。现在在提示符中输入以下命令并按回车：\n\n```\n$ tmux source-file ~/.tmux.conf\n```\n\
  \n和下面的截图类似，你应该会看到状态栏现在是蓝色的了！\n\n![](img/5969098f450265ac0c7947efcdbe7889_46_0.png)\n\
  \n## 修改状态栏的前景颜色\n\n现在蓝色状态栏看起来不错！不过文字有点难以阅读；背景和文字之间的对比度不够。让我们来修复这个问题！\n\n再次打开 `.tmux.conf`\
  \ 文件，这次添加第二行：\n\n```\nset-option -g status-bg blue\nset-option -g status-fg white\n\
  ```\n\n使用我们之前讨论的方法，用 `source-file` 命令重新加载配置。现在，如下面的截图所示，状态栏上的文字应该更容易阅读了！\n\n![](img/5969098f450265ac0c7947efcdbe7889_46_1.png)\n\
  \n## 高亮当前活动窗口\n\n让我们更容易看出哪个是当前活动窗口。星号也能起到作用，但既然我们有这些颜色，也许可以更直观一些。\n\n再次打开 `.tmux.conf`\
  \ 文件，这次添加第三行：\n\n```\nset-option -g status-bg blue\nset-option -g status-fg white\n\
  set-window-option -g window-status-current-bg magenta\n```\n\n这里我们看到了第一个窗口选项。前两个选项是全局的。这意味着在所有窗口中，状态栏始终会有蓝色背景。\n\
  \n这一新行的意思是，对于每个窗口，如果它是当前窗口，就将其背景设置为洋红色。再次使用 `tmux source-file ~/.tmux.conf` 重新加载配置，看看效果，如下面的截图所示：\n\
  \n![](img/5969098f450265ac0c7947efcdbe7889_47_0.png)\n\n切换到另一个窗口，观察洋红色高亮会跟着移动。\n\
  \n你可能注意到，每次我们都要输入很多内容来重新加载配置，完整地敲一遍 `tmux source-file ~/.tmux.conf` 命令。肯定有更好的办法吧！\n\
  \n坏消息是，tmux 默认没有提供重新加载配置的按键组合。好消息是，我们可以绑定自己的按键来让这个任务更简单！\n\n幸运的是，通过查看按键绑定列表，似乎 `Ctrl\
  \ + r` 目前没有绑定到任何 tmux 命令。所以它可以自由使用。在按键绑定界面中，所有以 `C-` 开头的键都表示你需要按下 Ctrl 键。因此，`C-r`\
  \ 的使用方式与 `Ctrl + r` 相同。\n\n![](img/5969098f450265ac0c7947efcdbe7889_49_0.png)\n\n\
  这会相当方便，因为默认的前缀键也使用 Ctrl 键。所以假设当前默认前缀键是 `Ctrl + b`，我们将能够按住 Ctrl，依次轻按 B 和 R 来重新加载配置。\n\
  \n## 将 Ctrl 重新绑定到 Caps Lock\n\n![](img/5969098f450265ac0c7947efcdbe7889_49_1.png)\n\
  \n我最喜欢的一个编程效率技巧，就是在系统范围内将 Caps Lock 重新绑定为 Ctrl。这在大多数计算机的操作系统层面都很容易实现，甚至在一些功能更强的键盘上也可以。\n\
  \n大多数电脑用户很少使用 Caps Lock，但它位于主键盘行上，按起来很方便。由于 Ctrl 键经常被命令行程序员使用，而它在键盘上的位置又比较难按，交换两者会非常有帮助。通过交换，万一你真的需要用到\
  \ Caps Lock，它仍然可以通过键盘上原来的 Ctrl 键位置来访问。\n\n作者是 Emacs 的忠实粉丝，而 Emacs 大量使用 Ctrl 键，tmux\
  \ 也是另一个重度使用 Ctrl 键的程序。\n\n这绝不是强制要求，但如果你发现自己经常使用 Ctrl 键，可以考虑使用这个小技巧！\n\n在 Mac 上，这非常简单，不需要额外软件。在其他一些系统上会稍微麻烦一点，但到处都能实现。\n\
  \n详细教程请访问 http://vq.io/rebindcaps。\n\n> 注意，我们还在一些逻辑分组之间添加了一些空格。幸运的是，tmux 配置会忽略空白字符，所以我们可以按自己喜欢的方式分隔它们。\n\
  \n## 绑定新的前缀键\n\n我们也可以重新绑定前缀键，让它变得更方便，或者设置成不会与其他程序冲突的方式。\n\n你们中的一些人可能来自使用 GNU screen\
  \ 的背景，那是另一个终端复用器，使用 `Ctrl + a` 作为前缀键。所以与其学习 tmux 的按键，你可能想直接把 `Ctrl + a` 重新绑定为你的\
  \ tmux 前缀键。\n\n或者，你可能是 Emacs、nano 或其他大量使用 `Ctrl + b` 来将光标向后移动一个字符的程序的频繁用户。在这种情况下，`Ctrl\
  \ + b` 并不是一个适合全局重新绑定的方便按键。\n\n这类用户可能会选择将前缀键重新绑定为在 Emacs 或其他程序中较少使用或不太重要的键，比如 `Ctrl\
  \ + t`。这还顺便有助于提供按键提示（t 代表 tmux！）。\n\n无论你的动机是什么，重新绑定前缀键都是可能的。那么，作为练习，让我们把它重新绑定为 `Ctrl\
  \ + t`。如果这让你感到不适，你可以在自己的配置中忽略它。不过，重新绑定前缀键与重新绑定其他键略有不同。你可能会认为在 `.tmux.conf` 文件中写下下面这行就能生效，但事实并非如此：\n\
  \n```\nbind-key C-t prefix\n```\n\n回想一下，tmux 中的所有按键绑定首先都需要按下前缀键才能生效。所以这段代码片段，用大白话来说，本质上是在说：“在你按下前缀键之后，再按\
  \ Ctrl 和 t 作为前缀键。”它并不是在说：“这是新的前缀键，请使用它。”\n\n因此，要设置前缀键，请在我们不断增长的 `.tmux.conf` 中添加以下几行：\n\
  \n```\n## 将状态栏背景设置为蓝色\nset-option -g status-bg blue\n## 将状态栏文字设置为白色\nset-option\
  \ -g status-fg white\n```\n\n\n\n注意到 `-n` 选项了吗？这允许你在不先按下前缀键的情况下直接按下绑定键。因此，你可以直接按下\
  \ `F1` 而无需任何前缀，立即切换到窗口 1！\n\n这听起来像是一个非常酷的技巧（通常也确实如此），直到你在 tmux 中运行哪怕一个需要使用 `F1`\
  \ 键的程序。到那时，由于你已经在全局范围内为 tmux 捕获了 `F1`，该键击就无法在该程序或任何其他程序中使用，因为 tmux 会捕获它，将其用于你指定的用途，并且永远不会将其传递给程序。同样，你可以使用诸如将\
  \ `<Prefix>, F1` 绑定为向底层窗口发送 `F1` 的技巧；然而，对于大多数用户来说，养成全局覆盖按键的习惯可能并不是一个好做法。\n\n所以，这里最可能出现的结果是，你可以为类似功能创建一些很酷的全局快捷键，它们会正常工作一段时间，直到你遇到一个例外。然后你会取消它们的绑定，并最终不得不说服自己的肌肉记忆去忘记它已经学到的东西。\n\
  \n## 取消按键绑定\n\n现在，假设有一个你想出于某种原因移除的键绑定。这非常简单；只需在你的 `.tmux.conf` 文件中添加一个 `unbind`\
  \ 指令即可。\n\n假设出于某种原因，我们想取消 `0` 默认的“选择窗口 0”操作。为此，只需将以下代码片段添加到你的配置中：\n\n```\nunbind\
  \ 0\n```\n\n请注意，在将某个键绑定到其他功能之前，无需显式地取消该键的绑定；每个键只能有一个绑定。因此，我们发现这个实用功能很少用到，但知道它在需要时可用也是件好事。\n\
  \n## 重新审视状态栏\n\n上次我们修改状态栏时，更改了它的颜色，但没有对其内容做任何改动。tmux 允许我们更改状态栏内容的许多不同方面。我们不会深入探讨每一种可能的配置，但会解释相关概念并展示一个示例。\n\
  \n所以，状态栏基本上分为三个部分：\n\n- **status-left**：这表示状态栏左侧的内容，包括当前会话\n\n假设我们想更改 `status-left`\
  \ 的值，使其看起来类似于 `{username@host}`，其中用户名和主机名自动填充；我们可以轻松做到这一点。只需将以下行添加到 `.tmux.conf`\
  \ 并重新加载配置（请注意，我们还加宽了状态栏，因为默认值是 10，内容会被截断）：\n\n```\nset-option -g status-left-length\
  \ 25\nset-option -g status-left \"#(whoami)@#H\"\n```\n\n这将为我在状态栏中填充 `{victor@minerva.local}`，因为它执行了\
  \ `whoami` 命令，将该命令的输出放入 `@` 之前的字符串中，并在其后填充主机名。\n\n## 选项类型\n\n到目前为止，我们设置的所有选项都带有\
  \ `-g` 标志。这意味着该选项是全局生效的。然而，选项有三种类型：服务器选项、会话选项和窗口选项。\n\n还有多个标志用于指示给定选项应如何影响或被影响。听起来很复杂，但实际上相当简单。\n\
  \n服务器选项将应用于连接到 tmux 的任何客户端。在底层，当你第一次输入并运行 tmux 命令时，tmux 会创建一个服务器；然后，它会创建你的客户端并连接到它所启动的服务器。这就是允许你分离会话、稍后重新连接，并让一切保持你离开时状态的魔法，因为\
  \ tmux 服务器会在后台持续运行。因此，使用 `-s` 标志指定的选项将应用于服务器，这意味着它会影响任何连接到该服务器的客户端。\n\n会话选项将应用于当前会话。这意味着两个客户端可以连接到同一个服务器，并且各自可以拥有略有不同的会话选项。这与服务器选项形成对比，服务器选项是每个客户端无论是否愿意都拥有相同的选项。会话选项没有标志；它们是通过省略标志来设置的，因为它们是默认类型。\n\
  \n然后是窗口选项，它们仅应用于单个窗口。要设置窗口选项，请使用 `-w` 标志指定。\n\n在配置选项时，它们是向下级联的。因此，使用 `-g` 指定的全局选项将作为主集。然后，链中任何更下层的选项都将继承全局设置，或者可以用自己的设置覆盖全局设置。\n\
  \n要做到这一点，只需在你的 `.tmux.conf` 文件中添加一个 `bind-key` 条目，并将与前缀键相同的按键组合绑定到 `last-window`\
  \ 命令。例如，如果你按照前面的步骤将前缀键设置为 `Ctrl + t`，那么以下行在你的 `.tmux.conf` 文件中是合适的：\n\n```\n## 双击前缀键跳转到上一个窗口\n\
  bind-key C-t last-window\n```\n\n现在，切换到上一个窗口就像按住 `Ctrl` 并轻敲两次 `t` 一样简单。\n\n## 更改转义时间\n\
  \n我听说一些 vim 用户反映，tmux 会在命令之间增加一个短暂的、几乎察觉不到的延迟，这可能导致在 tmux 内运行 vim 时出现奇怪的行为。\n\n\
  在 tmux 术语中，这种延迟被称为 `escape-time`（转义时间）。默认情况下，它设置为 500 毫秒。要解决 vim 的问题，请将以下行添加到你的配置文件中，将\
  \ `escape-time` 设置为 0：\n\n```\nset-option -s escape-time 0\n```\n\n请注意，这个选项显然存在是有原因的，所以做此更改时务必谨慎，因为你可能会遇到意外行为。然而，我们听说许多\
  \ vi 用户做了这个更改后，再也没有回头。另外请注意，如前所述，这个选项带有 `-s` 标志，因此它是一个会话特定的选项，这意味着如果其他人连接到同一服务器，他们可以为\
  \ `escape-time` 设置不同的值。\n\n## 增加历史记录限制\n\ntmux 只有有限数量的回滚历史。回滚历史是指它保存在内存中、已经滚出屏幕并且可以在复制模式（参见第\
  \ 4 章《处理文本》）中访问的行数。\n\n然而，tmux 的默认 `history-limit` 是 2,000，对于许多使用场景来说可能相当低。为了调高它，请将以下行添加到你的配置文件中：\n\
  \n```\nset-option -g history-limit 10000\n```\n\n请注意，增加此历史记录限制的同时，也会增加 tmux 的内存占用。因此，如果设置得过高，可能需要进行一些调整，特别是如果你倾向于打开大量窗口和窗格的话。\n\
  \n## 增加显示时间\n\n某些命令会导致 tmux 向你显示一条消息，用其显示的文本替换状态栏。消息显示的时间被称为 `display-time`（显示时间）。\n\
  \n开箱即用时，tmux 的 `display-time` 值相当低。尝试在另一个窗口中搜索你知道不存在的文本。例如，按 `<Prefix>, f`，然后输入任何你确定在其他窗口中不存在的搜索字符串，例如\
  \ `potato`。\n\n你会看到文本 `No windows matching: potato` 出现在状态栏的位置，然后眨眼间就消失了：\n\n![](img/5969098f450265ac0c7947efcdbe7889_59_0.png)\n\
  \n它会一闪而过，因为它只会在屏幕上停留当前 `display-time` 的时长，而默认情况下只有 750 毫秒。将 `display-time` 的值调高一些可能是个好主意，这样消息就能显示得更久一点，至少在你对\
  \ tmux 更熟悉之前是这样。要做到这一点，请将以下行添加到你的配置文件中，将持续时间改为 2 秒：\n\n```\nset-option -g display-time\
  \ 2000\n```\n\n对于 2 秒的持续时间，我们将 `display-time` 设置为 2000，因为显示时间是以毫秒为单位的。\n\n## 总结\n\
  \n现在让我们把所有内容整合起来。请参阅 *附录* 以查看最终成果，即我们在本章中构建的 `.tmux.conf` 文件。\n\n在本章中，我们学到了许多关于配置\
  \ tmux 的知识。从一个空白的 `.tmux.conf` 配置文件开始，我们构建了一个更大的配置，改变了我们使用 tmux 体验的许多方面。\n\n我们通过修改状态栏改变了外观和感觉，并学习了如何绑定按键，包括前缀键。我们向你展示了如何将多个命令绑定到同一个按键绑定，以及如何取消按键绑定。我们学习了如何通过添加注释来保持文件的可管理性和良好的文档化，以及如何在不使用前缀键的情况下绑定按键。我们了解了可以在配置文件中设置的不同类型的选项，以及一些可能对大多数读者来说不太容易显而易见的实用配置技巧。\n\
  \n到本章结束时，我们已经构建了一个非常丰富的示例配置文件，它可以成为你个人定制的绝佳起点。我们还学习了一些如何浏览手册页以获取可用选项的详尽列表的方法。\n\n\
  我们希望你将这个 `.tmux.conf` 文件视为一份活的文档，并用你发现的其他有趣内容更新它，同时移除或修改现有的任何部分。根据你的需求个性化它；毕竟这就是它的用途！\n\
  \n既然我们已经学习了所有关于配置的知识，在下一章中，我们将继续讨论 tmux 的主要基础之一：会话、窗口和窗格的概念。\n\n\n\n\n窗口（window）和窗格（pane）与它们对应的现实世界事物是非常完美的类比。看一看各种不同的现实世界中的物理窗户，你会发现其中许多都被整齐地分割成多个窗格。\n\
  \n> tmux 中的窗格相较于现实世界窗户上的窗格，一个很大的好处在于：它们可以根据你的需求轻松地创建、销毁和调整大小。而大多数物理窗户上的窗格可做不到这一点。\n\
  \n## 动手体验会话、窗口和窗格\n\n现在我们已经有了一个高层面的理解，接下来就稍微逛一逛会话、窗口和窗格。让我们从一个全新的终端窗口、没有任何现有 tmux\
  \ 会话的状态开始。先创建一个名为 work 的会话：\n\n```\n$ tmux new-session -s work\n```\n\n你会看到一个名为\
  \ work 的新会话启动。这个会话当前只有一个窗口，窗口中只有一个窗格。\n\n让我们再创建一个窗口。回想一下，这可以通过按下 <Prefix>, c（c 代表\
  \ create/创建）来完成。现在你有一个会话、两个窗口和两个窗格。每个窗口都只有一个窗格，如下面的截图所示：\n\n![](img/5969098f450265ac0c7947efcdbe7889_66_0.png)\n\
  \n## 多个会话\n\n现在让我们看看同时使用多个会话是什么感觉。首先分离当前会话。回想一下，要做到这一点，我们需要按下 <Prefix>, d（d 代表 detach/分离）。\n\
  \n现在 work 会话已被分离，我们回到了命令行提示符，你的屏幕应该与下一张截图类似。我们不要重新附加 work 会话，而是创建一个新会话，并将其命名为 play：\n\
  \n```\n$ tmux new-session -s play\n```\n\n![](img/5969098f450265ac0c7947efcdbe7889_67_0.png)\n\
  \n现在看起来我们有了一个完全不同的会话。我们的状态栏也不一样了，左下角显示的是会话名称 [play]，而不是 [work]。\n\n现在要切回 work 会话，我们可以分离\
  \ play 会话，回到一个没有 tmux 的终端，然后重新附加会话，这次以 work 会话为目标；不过实际上还有一种更简单的方法。\n\n只需按下 <Prefix>,\
  \ s（以交互方式选择会话），就会弹出一个对话框，我们可以从中选择要附加到哪个会话。所以，我们甚至不需要离开当前所在的会话就能切换到另一个会话。使用方向键高亮你想要的会话，或者直接点击与该会话对应的数字即可切换。\n\
  \n试着切换到另一个会话，再切回来，但等等，还有一种更简单的方法。只需使用 <Prefix>, )（下一个会话）和 <Prefix>, (（上一个会话）在会话之间循环切换。你会发现切换会话非常容易。这里我们跳过多个窗口之间的切换，因为你已经从第一章知道了如何操作；让我们直接进入多个窗格的部分。\n\
  \n## 多个窗格\n\n现在让我们把这个窗口拆分成两个窗格。输入 <Prefix>, %（垂直分割窗口），可以看到窗口现在被垂直分隔线从中间分开了；我们有了另一个命令提示符。这就是第二个窗格，如下面的截图所示：\n\
  \n![](img/5969098f450265ac0c7947efcdbe7889_68_0.png)\n\n现在我们有两个会话、三个窗口和四个窗格。一个会话、一个窗口和一个窗格构成\
  \ play 会话（它现在不可见，但在后台正常运行），而一个会话、两个窗口和三个窗格构成我们在上一张截图中看到的 work 会话。\n\n让我们稍微摆弄一下窗格。首先，试着输入一些文本。你会看到光标在右侧窗格中。要让它移动到左侧窗格，只需按下\
  \ <Prefix>, o（o 代表 other/其他）。现在你的光标就在另一个窗格中了。输入一些内容来确认光标在哪个窗格中。\n\n实际上，有一种比输入随机内容更好的方法来判断光标在哪个窗格中。从之前的截图中可能很难分辨；然而，当一个窗口被垂直分割成两部分时，如果光标在左侧窗格中，分割这两个窗格的垂直分隔线的上半部分会着色；如果光标在右侧窗格中，下半部分会着色。在之前的截图中，下半部分以绿色显示，表示光标在右侧窗格中。当窗格超过两个时，tmux\
  \ 会尝试不同的方案让我们知道哪个窗格处于活动状态，我们很快会看到。\n\n你也可以使用 <Prefix> 加右方向键、<Prefix> 加左方向键、<Prefix>\
  \ 加下方向键或 <Prefix> 加上方向键，将光标移动到右侧、左侧、下方或上方的窗格。这样更容易记住，并且在窗格结构更复杂时也更有用。\n\n## 使用更多窗格\n\
  \n现在，<Prefix>, %（垂直分割窗格）并不是创建窗格的唯一方式。它只是将当前窗格垂直分割成两个较小的窗格。如果你再执行一次，它会用另一条垂直分隔线将当前窗格再一分为二，如下面的截图所示：\n\
  \n![](img/5969098f450265ac0c7947efcdbe7889_69_0.png)\n\n不过这看起来有点愚蠢和拥挤。首先，让我们杀掉那个窗格，然后尝试垂直分割。要杀掉我们创建的新窗格，我们可以终止该窗格中正在运行的程序——在这种情况下，输入\
  \ exit 并按下回车，因为这会结束 shell 进程。或者，我们可以按下 <Prefix>, x（杀死窗格），然后会被询问是否要杀死该窗格。\n\n> 注意，杀死一个正在运行进程的窗格会立即终止该进程，而不会优雅地结束它，因此你将会丢失该窗格中的任何现有数据。请务必小心！\n\
  \n确认 y，你就回到了两个窗格的状态。注意，当一个窗格被移除时，周边内容会自动调整到合适的大小。让我们尝试水平分割左侧窗格。为此，输入 <Prefix>, \"\
  （水平分割窗格），如下面的截图所示：\n\n![](img/5969098f450265ac0c7947efcdbe7889_69_1.png)\n\n![](img/5969098f450265ac0c7947efcdbe7889_71_0.png)\n\
  \n让我们尝试用合理的增量来调整窗格大小。使用 <Prefix>、方向键或 <Prefix>, o 将光标移到 Date 窗口上。\n\n现在要调整它的大小，让我们试试\
  \ <Prefix>, Meta 加右方向键。你应该会看到最右侧的窗格变小了一点。再试一次，它会变得更小。再试试 <Prefix>, Meta 加左方向键，你应该会看到最右侧的窗格变大了一点。\n\
  \n> 如果你看看自己的键盘，发现没有 Meta 键，你并没有错过什么；大多数键盘上都没有这个键。\n>\n> Meta 是终端程序中经常使用的一个键，在历史上它曾在键盘上占有一席之地，但现在不再有了。\n\
  >\n> iTerm 和 Mac 自带的终端程序都可以选择将 Option 键用作 Meta。其他操作系统通常也有某种方式将 Alt 键用作 Meta。\n>\n\
  > 尽管这可能让人困惑，但本书中使用 Meta 是因为这是历史沿用的称呼，更重要的是，因为这是 tmux 文档中所指的键。\n\n谢天谢地，你不需要每次想稍微调整大小时都输入前缀键；一旦你开始调整大小，就可以不带前缀键一遍又一遍地输入增大或缩小的命令。所以先用\
  \ <Prefix>, Meta 加右方向键，然后你应该可以按住 Meta 键并按左方向键、右方向键或左方向键来改变窗格大小。你会看到窗格不断扩展和收缩，而不必每次都停下来输入前缀键。\n\
  \n这是改变窗格大小的一种方式。实际上，这每次以五个单元格为单位进行调整（每个单元格基本上就是一个等宽字符所占的空间）。\n\n## 会话、窗口和窗格\n\n\
  我们还可以更精细地调整，每次以一个单元格为单位改变大小。只需按下 <Prefix>, Ctrl 加方向键。不过，这样移动的增量要小得多，而且在 OS X 上会与切换空间（Space）的命令冲突。\n\
  \n如果你已经跟着*第 2 章 配置 tmux*操作过，并且开启了 mode-mouse 选项，以及 mouse-select-pane 和 mouse-resize-pane\
  \ 选项，那么你也可以使用鼠标来选择活动窗格。只需点击活动窗格即可完成选择，还可以通过点击并拖拽来调整窗格大小，使其变为活动窗格。虽然这样做的缺点是不得不伸手去拿鼠标，但这可能是快速达到所需窗格布局的最简单方法。\n\
  \n## 按编号在窗格之间切换\n\n既然我们有了这么多窗格，在它们之间切换可能会有点笨重。方向键很不错，但可能还是有点烦人。谢天谢地，有一种更简单的方法。按下\
  \ <Prefix>, q，你会看到每个窗格中都会出现一个数字，然后很快就会消失。\n\n当前活动的窗格会以不同于其他窗格的颜色显示。这还会显示每个窗格的尺寸。\n\
  \n就像每个窗口都被分配了一个唯一编号一样，每个窗格在每个窗口中也被分配了一个唯一编号。如果你再次按下 <Prefix>, q，并在数字消失之前输入出现在那个窗格中的数字，你就会自动切换到那个窗格。\n\
  \n默认情况下，这些数字在屏幕上停留的时长是 1 秒，但你可以通过在 .tmux.conf 文件中添加以下选项来更改：\n\n```\nset-option -g\
  \ display-panes-time 3000\n```\n\n这会将窗格编号显示在屏幕上的时间延长到 3000 毫秒（即 3 秒），让你有更多时间通过索引选择窗格。\n\
  \n所以，要跳到输入了 Apple 这个词的窗格，只需按下 <Prefix>, q，然后按 1。因为你之前位于哪个窗格并不重要，因为这个窗格被赋予了索引 1；使用这个组合键就会跳到那个窗格。\n\
  \n## 循环切换窗格布局\n\ntmux 为我们提供了几种不同的方式来自动改变窗格布局，这样你就不必用别扭的方式精心分割和调整大小来达到想要的结果了。\n\n\
  \n\n\n这组按键中功能最丰富的要数一个键绑定，每次按下组合键时，它都会循环切换到一种不同的预设窗格布局。这个组合键是 <Prefix>，空格键（循环切换窗格布局）。\n\
  \n试试看；按下 <Prefix>，空格键，你会看到窗格移动。内容保持在窗格中，因此其中的任何程序都会继续正常运行，但每次使用该组合键时，窗格都会以不同的方式重新排列和调整大小。\n\
  \n如果你查看状态栏，会看到布局的名称。你可以循环切换五种不同的预设布局，分别是：水平均分、垂直均分、主水平、主垂直和平铺。\n\n在你了解特定用例中自己喜欢哪种布局之前，循环切换是查看各种可能性的一个好方法。\n\
  \n一旦你足够熟悉这些布局，就可以直接切换到它们，无需循环遍历所有布局。方法是按下 <Prefix>，然后按 Meta 和预设布局在之前列表中的索引。例如，你可以使用\
  \ <Prefix>，Meta + 1 切换到水平均分视图，<Prefix>，Meta + 2 切换到垂直均分视图，依此类推。\n\n## 其他窗格操作\n\n\
  窗格操作实在太多，本书无法详尽地全部覆盖；对于大多数未讨论的操作，我们恳请你深入查阅 tmux 的手册页：\n\n```\n$ man tmux\n```\n\n\
  或者，你可以在网络上参考 http://man.cx/tmux。\n\n既然你了解了窗格，手册页中关于窗格的内容应该很容易理解和掌握。\n\n你可以做很多事情，比如将一个窗格拆分为独立窗口；旋转窗格；将一个窗格与另一个窗格交换；将窗格移动到另一个窗口；以及将所有的窗格水平排列、垂直排列、平铺排列，等等。\n\
  \n还有更多用于调整窗格大小的命令，其中许多甚至没有键盘快捷键，因为它们并不常用。当然，你可以添加自己的快捷键，如果你阅读了第 2 章“配置 tmux”，你的工具箱中就应该有相应的工具来实现这一点。\n\
  \n## 本章小结\n\n在本章中，我们学习了 tmux 中关于会话、窗口和窗格的大量知识。我们了解了它们各自如何融入 tmux 的层级结构，并通过实践操作来巩固这些概念。我们创建了多个会话，将窗口拆分为多个窗格，移动它们，并学习了在窗格之间切换光标的多种方式。\n\
  \n在下一章中，我们将进入文本处理部分，学习如何回滚窗口历史、如何将窗口历史中的文本复制到粘贴缓冲区，以及如何粘贴这些内容。\n"
- "## 文本处理\n\ntmux 中有两个重要组件我们还没有详细讨论，即**复制模式**和**粘贴缓冲区**。\n\n复制模式是 tmux 中我们可以切换的一种模式；它允许我们选择屏幕上已经出现的文本并复制。此外，它还允许我们将光标移动到屏幕上的任何位置，甚至移动到已滚出屏幕的区域。\n\
  \n当从复制模式复制某个项目时，它最终会进入粘贴缓冲区。顾名思义，这个缓冲区用于存放所有被复制的内容，以便稍后粘贴。\n\n以下是本章将要介绍的功能的快速摘要：\n\
  \n- 窗口历史以及 tmux 如何处理移出屏幕的文本\n- 解释 tmux 的两种模式\n  - 向上滚动窗口历史\n  - 通过搜索或行号跳转\n  - 将文本复制到粘贴缓冲区\n\
  - 与粘贴缓冲区交互\n  - 粘贴最后复制的项目\n  - 查看整个粘贴缓冲区堆栈\n  - 交互式选择要粘贴的项目\n\n在本章结束时，我们将全面了解如何在\
  \ tmux 中处理文本。\n\n## 解释窗口历史\n\n你可能在前几章中注意到，输出文本过多的命令似乎被截断了。你可以看到结尾部分，但其余部分似乎跑到窗口上方去了。如果你尝试向上滚动，却无法滚动。这是怎么回事？\n\
  \n命令的开头并没有永远丢失。它仍然存在；只是滚出了屏幕。\n\n为了实现其神奇功能并将所有内容保留在单个终端窗口中，tmux 必须隐藏所有无法适应当前查看窗格的文本。它将这些文本全部存储在一个叫做**窗口历史**的缓冲区中。\n\
  \n可以把这想象成一本实体书的页面。一本书包含的文本远多于你在任意时刻能看到的，但为了便于管理，所有这些文本都在同一时间不可见的页面上。唯一可见的页面是你打开的那一页。\n\
  \n类似地，tmux 会保留所有未适应当前查看窗格的文本，并将它们收纳到窗口历史中。\n\n当然，tmux 不需要像传统书籍那样把页面堆叠起来，一页压在一页上面。因此，只要配置了历史记录，这些文本就会按顺序一个接一个地向下排列。\n\
  \n下面的插图有助于直观理解：\n\n![](img/5969098f450265ac0c7947efcdbe7889_76_0.png)\n\n## 选择文本\n\
  \n- **时钟模式：** 该模式显示当前时间，与其说是一种实际模式，不如说是一种新奇/实用工具。可以通过 `<Prefix>, t` 访问。\n- **控制模式：**\
  \ 该模式允许第三方应用程序通过纯文本协议与 tmux 交互。\n\n此外，这也是我们开始接触 tmux 中文本处理技巧的地方。当我们进入复制模式时，可以回滚查看窗口历史，还可以使用一些很酷的文本处理工具。\n\
  \n让我们用一个复制模式的示例工作流来走一遍。\n\n## 复制模式工作流示例\n\n如果你从本章开头一直跟随我们，那么你应该已经启动了一个 tmux 会话。让我们先重新运行之前用来列出可用键绑定的那个长输出命令：\n\
  \n```\n```bash\n$ tmux list-keys\n```\n```\n\n正如我们上次运行这个命令时所看到的，当前窗格中只显示了最后几行。然而，现在我们掌握了一些关于窗口历史的知识，可以推测其余的行仍然存在，只是滚动到屏幕之外了。我们如何向上滚动查看那些文本呢？复制模式！\n\
  \n## 进入复制模式\n\n让我们进入复制模式，以便回滚查看其余内容，这些内容存储在窗口历史中。按 `<Prefix>, [` 切换回复制模式。\n\n你会注意到的第一件事是屏幕上新增了一个界面元素。终端屏幕右上角会出现一个新框，显示\
  \ **[0/76]**，如下面的截图所示：\n\n![](img/5969098f450265ac0c7947efcdbe7889_78_0.png)\n\n\
  这向我们展示了历史记录中的行数（76）以及光标当前所在的行号（0）。\n\n请注意，这些行是按逆时间顺序排列的，因此 0 代表我们当前查看的窗格，1 是它上面的一行，2\
  \ 是第 1 行上面的一行，而 76 是窗口历史最顶部的内容。这有助于在我们向上滚动时了解我们在历史记录中的位置。\n\n回到我们的窗口历史示意图，这些行可以理解为下图所示：\n\
  \n![](img/5969098f450265ac0c7947efcdbe7889_79_0.png)\n\n[0/76] 中的第一个数字会显示当前视图中最低可见行的索引。有时这会有点令人困惑，因为当你向上滚动时，似乎第一个数字在你将光标滚动过当前窗格之前不会开始增加；然而，当你向下滚动并逐行将文本带入当前视图时，这就更合理了。\n\
  \n## 移动光标\n\n既然你处于复制模式，就可以一次一个字符地向上、下、左、右移动光标。这很直观，即使用上箭头、下箭头、左箭头或右箭头键，或者 Ctrl +\
  \ p、Ctrl + n、Ctrl + b、Ctrl + f（k、j、h、l）。试着在复制模式下稍微移动一下光标。\n\n## 复制模式的 Emacs 或 vi\
  \ 风格键绑定\n\n实际上，在 tmux 中为复制模式绑定按键有主要两种方式：Emacs 风格键绑定或 vi 风格键绑定。\n\n这可以使用 mode-keys\
  \ 选项进行配置。我们将主要介绍默认（Emacs 风格）键绑定，并在其后附上 vi 键绑定作为括号说明。然而，请注意，正如我们在第 1 章“直接上手”中所见，tmux\
  \ 很智能，可能会根据你的环境变量更改默认值。因此，虽然 Emacs 是通常的默认值，但在没有任何配置的情况下，基于另一种配置，你可能会默认使用 vi 模式，而\
  \ tmux 开箱即用就是这样设置的。\n\n如果你是 vi 用户，要知道你可以设置 vi 风格的模式按键；如果这么做了，浏览复制模式的按键方式与浏览 vi 的正常模式非常相似。\n\
  \n复制模式的 Emacs 键绑定可以通过以下命令查看：\n\n```\ntmux list-keys -t emacs-copy\n```\n\n复制模式的\
  \ vi 键绑定可以通过以下命令查看：\n\n```\ntmux list-keys -t vi-copy\n```\n\n或者，你可以查看 mode-keys\
  \ 下的手册页，了解有关配置以及哪个键做什么的更多细节（http://man.cx/tmux 或在终端中运行 man tmux）。\n\n![](img/5969098f450265ac0c7947efcdbe7889_80_0.png)\n\
  \n现在让我们向上滚动，看看后面留下了什么。\n\n## 滚动浏览窗口历史\n\n要向上滚动一页，你可以使用 Page Up 或 Meta + v（Ctrl +\
  \ b），你会看到每次按下时，右上角的数字都会从 [0/76] 变化，与你当前所在的位置匹配。\n\n\n\n\n你还会注意到，很快你就会看到之前不可见的文本。没错，现在你正在向上滚动到\
  \ Window 历史记录中！当然，你也可以使用 Page Down 或 Ctrl + v（Ctrl + f）来向下导航到下一页。\n\n你可能会发现 Meta\
  \ + v 在 tmux 中无法向上滚动。如果遇到这种情况，很可能是由于终端的配置设置所致。\n\n如果你在 Mac 上使用 iTerm2，你可以指定终端如何发送\
  \ Option 键。要访问此设置，请访问 Preferences | Profiles | Keys，你应该会看到 Left option (^) key acts\
  \ as。将其设置为 +Esc 即可使 Option 键像 Meta 一样工作，如以下截图所示：\n\n![](img/5969098f450265ac0c7947efcdbe7889_81_0.png)\n\
  \n如果你在 Mac 上使用 Terminal，你也可以指定终端如何发送 Option 键。要访问此设置，请访问 Preferences | Profiles，选择你的活动配置文件，选择\
  \ Keyboard 选项卡，并勾选 Use Option as Meta key。\n\n对于其他操作系统，Alt 通常开箱即用即可作为 Meta。\n\n\
  你也可以直接使用 Meta + > (g) 跳转到 Window 历史记录的顶部，并使用 Meta + < (G) 返回到底部。\n\n## 通过搜索或行跳转\n\
  \n通常，当你回溯历史记录时，你确切地知道自己在寻找什么。当这种情况成立时，你可以通过搜索词跳转到特定行。\n\n例如，在 Copy mode 中，按 Ctrl\
  \ + r（?）。你会在左下角看到出现 Search Up：，如以下截图所示：\n\n![](img/5969098f450265ac0c7947efcdbe7889_82_0.png)\n\
  \n输入 list-keys 然后按 Enter。你会看到你直接跳转到了 Window 历史记录中该词 list-keys 的最后一次使用。再次尝试，你就会跳转回我们第一次输入它的时间。\n\
  \n如果你没有确切的搜索词，你仍然可以直接跳转到行号。只需按 g（:）即可提示你输入要跳转到的行。这在你不确定具体要搜索什么但想回跳几页时很有帮助。\n\n##\
  \ 退出复制模式\n\n要退出 Copy mode 并返回到 Default mode，只需按 Esc 或 q 即可离开 Copy mode。\n\n还有许多其他键可以导航到\
  \ Copy mode，但描述每一个都太繁琐了。不过我们已经见过大部分，其余的可以在 tmux 手册页上找到：\n\n```\n$ man tmux\n```\n\
  \n或者，你也可以使用 tmux 命令 list-keys -t emacs-copy 或 list-keys -t vi-copy 来查找，具体取决于你选择的键绑定。\n\
  \n你可以在 http://man.cx/tmux 上在线查看更多用于导航到 Copy mode 的键。\n\n## 将文本复制到粘贴缓冲区\n\n现在我们已经尝到了在\
  \ Copy mode 中导航的滋味，让我们来实际使用它。\n\nCopy mode 不仅仅是为了让你可以滚动浏览 Window 历史记录，也是为了提供一种从过去复制文本并重用的方式。\n\
  \n通过按 `<Prefix>, [` 进入 Copy mode 并滚动直到找到感兴趣的文本。一旦找到想要复制的内容，确保光标位于想要复制的起始位置并按 `Ctrl\
  \ + Space bar`（Space bar）。这会设置选择的起点。\n\n现在使用前面提供的相同键移动光标，你会看到选择被高亮并随着你远离选择起点而增长。你选择的区域背景颜色会与其他区域不同。以下截图就是一个示例：\n\
  \n![](img/5969098f450265ac0c7947efcdbe7889_83_0.png)\n\n当你对选择满意时，只需按 `Meta + w (Enter)`\
  \ 复制文本，你会立即离开 Copy mode 并滚动回你所在的位置。你选择的文本将被复制并添加到你的 paste buffer 中（稍后会详细介绍）。\n\n\
  需要注意几点如下：\n\n- 这是按照 Emacs（或 vi）的键命令来建模的，几乎完全相同，用于导航、复制等。如果你使用 Emacs 或 vi，应该会感到相当熟悉。如果你不熟悉两者，可能会觉得有点陌生，需要一些时间适应。\n\
  - 请注意，tmux 中的复制操作始终是非破坏性的。你已从 Window 历史记录中复制了文本，但完全没有更改 Window 历史记录。因此，你可以一遍又一遍地复制同一文本而不会干扰历史记录。\n\
  - 如果你尝试从多行复制文本，你可能会注意到选择包裹的行。你可以在 Copy mode 中在开始选择之前或之后随时按 R (v) 将其切换为矩形。这在以下截图中显示：\n\
  \n![](img/5969098f450265ac0c7947efcdbe7889_84_0.png)\n\n- 你也可以使用 Ctrl + k 键盘命令抓取光标右侧的所有文本或单行文本的末尾，就像\
  \ Emacs 中的 kill line 一样。同样，tmux 的 Copy mode 是非破坏性的，因此这不会像 Emacs 中那样实际删除该行，而是将其复制到\
  \ paste buffer。\n\n## 与粘贴缓冲区交互\n\nPaste buffer 是存放你将复制的所有文本的暂存桶，你稍后可以访问它并粘贴到任何 pane。\n\
  \n它实际上是一个栈，因此每次从 Copy mode 复制的项目都会添加到栈顶，每个新项目都会添加到顶部，而其他项目则向下移动一位。Paste buffer 中的每个项目都根据其进入栈的顺序分配一个编号。\n\
  \n## 从粘贴缓冲区粘贴文本\n\n现在你已经抓取了一些文本，你想从 paste buffer 中取出它。\n\n在 tmux 中运行的任何程序中，将光标移动到想要粘贴文本的位置并按\
  \ <Prefix>, ]。\n\n例如，让我们启动 nano：\n\n```\n$ nano\n```\n\n一旦我们这样做，就用 <Prefix>, ] 粘贴我们最后复制的内容。\n\
  \n果然，我们的文本出现了！注意这种很好的对称性，你使用 <Prefix>, [ 进入 Copy mode，而使用 <Prefix>, ] 粘贴文本。\n\n\
  现在 <Prefix>, ] 很适合粘贴最近复制的文本片段，但对于复制两项然后粘贴两项等更复杂的情况怎么办？不用担心，tmux 已经涵盖了！\n\n## 从粘贴缓冲区选择项目\n\
  \nPaste buffer 不仅仅是保存最后复制内容的单个文本块；它实际上是所有先前复制项目的栈。你可以按任何顺序访问它并从中粘贴。\n\n要访问此列表，只需按\
  \ <Prefix>, =。这会调出一个交互式列表，显示你之前复制的最后几项，如以下截图所示，你只需高亮其中一项并按 Enter 即可粘贴它：\n\n![](img/5969098f450265ac0c7947efcdbe7889_85_0.png)\n\
  \n默认情况下，每次复制时，它都会被添加到 paste buffer 栈中。有趣的是，默认情况下，当你从 paste buffer 中取出一个项目时，它不会将最新复制的项目从缓存中弹出。\n\
  \n命令 <Prefix>, ] 只是快速从栈顶（0）抓取并粘贴。\n\n## 使用粘贴缓冲区\n\n在使用 paste buffer 时，我们还可以做一些其他有用的事情。\n\
  \n你可以通过在 tmux 配置中将 buffer-limit 选项设置为一个数字，来选择性地设置存储在此栈中的项目数量限制。如果出于安全原因，你只想保留最近复制的例如五项，这会很有用。\n\
  \n你也可以通过按 <Prefix>, :（list-buffers）并按 Enter 来非交互式地列出 paste buffers，这将以列表形式显示所有缓冲区，你可以滚动浏览。注意每个缓冲区都有一个索引，即一个数字，后跟该缓冲区的大小。按\
  \ q（Esc）关闭此列表。\n\n此缓冲区索引可用于多种操作。它可用于删除缓冲区、将缓冲区复制到另一个会话、在特定索引加载缓冲区、设置特定缓冲区的內容、将缓冲区写入文件等等。关于缓冲区可以完成的所有事情超出了本书的范围，但我们将在第\
  \ 5 章《Diving Deeper》中重新审视一些非常有用的任务。\n\n与前几章一样，附录中提供了完整的键绑定和命令参考，其中包含了本章学到的所有键和命令，集中在一处。\n\
  \n## 总结\n\n在本章中，我们学习了很多关于文本操作的内容，从了解 Window 历史记录开始，到学习 tmux 中用于向上滚动 Window 历史记录的两种不同模式。我们接着学习了按搜索词或行跳转、将文本复制到\
  \ paste buffer、使用 Copy mode 复制文本。我们最后讨论了如何将项目从 paste buffer 粘贴到底层窗口、如何查看整个 paste\
  \ buffer 栈以及如何限制 paste buffer 中存储的项目数量。\n\n在下一章中，我们将进入一些更高级的使用主题，包括对 paste buffer\
  \ 的更深入理解、关于会话和窗口的更多内容，以及一个启动 tmux 并使用默认设置的机会。\n\n\n\n\n"
- "## 深入探讨\n\n既然我们已经学习了如何使用复制模式和粘贴缓冲区进行文本操作，也就讨论了 tmux 的大部分基础操作。现在让我们深入探讨一些更高级的使用主题，这些主题在你的日常工作中可能会很有帮助。\n\
  \n我们已经对这些内容有了一些了解，但这一次我们将更深入地探索它们。在本章中，我们将介绍以下主题：\n\n- 理解 tmux 命令与命令模式\n- 高级粘贴缓冲区用法\n\
  - 从一个会话中的窗口跳转到另一个会话中的窗口\n- 移动窗口\n- 在会话之间链接窗口\n- 拆分窗格\n- 合并窗格\n- 使用默认窗口启动会话\n\n###\
  \ 理解 tmux 命令与命令模式\n\n你可能已经注意到，在前面几章中，我们使用不同的方法访问了某些命令。例如，我们演示了如何列出当前的键绑定。这可以通过以下方式完成：\n\
  \n- 使用组合键 `<Prefix> ?`。\n- 直接在 shell 中键入命令，并在命令前加上 tmux 关键字，例如 `tmux list-keys`。\n\
  \n### 将粘贴缓冲区保存到文件\n\n假设你刚刚将大量优秀文本复制到了粘贴缓冲区，现在想将其保存到文件中。\n\n当然，你可以打开文本编辑器，粘贴缓冲区的内容，然后保存一个新文件；然而，tmux\
  \ 提供了一种便捷的方法，可以毫不费力地将粘贴缓冲区直接保存到文件中。\n\n所以，请回到你的 tmux 会话中，或者启动一个新会话，我们开始吧！\n\n1.\
  \ 首先，找一些要复制的文本。可以是任何包含文本的文件。例如，我们有一个示例文件，通过 `cat filename` 将其内容打印出来。你可以使用计算机上的任何文件。\n\
  2. 回想一下，我们可以通过按 `<Prefix> [` 进入复制模式。\n3. 然后，按 `Ctrl + Spacebar` 开始复制文本。\n4. 继续移动以高亮文本。\n\
  5. 然后，按 `Ctrl + w` 复制文本。\n\n![](img/5969098f450265ac0c7947efcdbe7889_89_0.png)\n\
  \n好了，现在我们的粘贴缓冲区索引 0 中有一些文本。我们可以通过 `<Prefix> =` 查看。\n\n![](img/5969098f450265ac0c7947efcdbe7889_90_0.png)\n\
  \n该粘贴缓冲区中有 628 字节。按 `q` 关闭该对话框。现在我们可以运行 tmux 命令 `save-buffer -b 0 [path]`；这里，`[path]`\
  \ 是我们保存文件的位置，`-b 0` 表示我们要保存来自索引 0 的粘贴缓冲区的文本，也就是我们刚刚复制的文本。运行此命令后，我们会得到一个包含该缓冲区内容的新文件。\n\
  \n例如，`<Prefix> : save-buffer -b 0 ~/sonnet16.poem` 会将粘贴缓冲区的内容保存到文件中。这在许多情况下都非常有用。例如，假设你正在使用\
  \ `tail` 实用程序实时跟踪日志文件。如果屏幕上出现有用的片段，进入复制模式，将其复制到粘贴缓冲区，然后保存到文件，这是一种将相关文本复制到文件的便捷方式。或者，想象你正在阅读手册页，想把一个有用的片段保存到文件中以备后用。在这种情况下，先将片段复制到粘贴缓冲区，再直接将该缓冲区写入文件，就能快速保存供以后使用。\n\
  \n### 从文件加载粘贴缓冲区\n\n我们也可以实现相反的操作，即将文件内容加载到粘贴缓冲区中。要做到这一点，只需运行 tmux 命令 `load-buffer\
  \ [path]`，该文件的内容就会被加载到粘贴缓冲区中。\n\n如果你有文件中的文本想要粘贴到 tmux 内运行的任何程序中，这会非常有用；你无需在编辑器中导航并打开该文件、用光标选中文件中的所有文本，然后复制它才能粘贴。\n\
  \n这可能非常有用，例如，可以利用 tmux 的核心功能打造一个非常强大的代码片段管理器。\n\n假设你在代码中经常编写各种常见的样板代码，例如 for 循环、函数定义或类声明。你可以为每段样板代码创建一个简单文件，直接将其加载到粘贴缓冲区，然后在\
  \ tmux 中粘贴。如果你的主目录中有一个名为 `~/snippets` 的文件夹，并且有一个名为 `~/snippets/forloop` 的 for 循环样板文件，你可以使用\
  \ tmux 命令 `load-buffer ~/snippets/forloop` 加载它，然后通过 `<Prefix> ]` 直接粘贴到当前缓冲区。随着时间推移，当你为大量样板代码积累片段时，可以节省大量击键操作。\n\
  \n默认情况下，如果未指定索引，文件内容将被加载到索引 0，就像你通过 `<Prefix> [` 正常复制它一样（其他粘贴缓冲区会向上移动一个索引）；不过，也可以指定要将文件内容加载到的缓冲区索引。\n\
  \n请注意，如果指定了缓冲区索引，该索引必须是已经存在的缓冲区索引，并且它会覆盖你提供的索引对应的粘贴缓冲区内容。因此，例如，使用 tmux 命令 `load-buffer\
  \ -b 0 ~/snippets/forloop` 指定缓冲区 0 时，内容不会进入索引 0 并将所有缓冲区向上推一位；相反，它会完全替换索引 0 中之前可用的任何内容。\n\
  \n### 直接设置粘贴缓冲区\n\n也可以直接用 tmux 设置缓冲区。如果你想多次粘贴相同的文本，这可能会很有用。无需先完整输入文本，然后复制它再进行粘贴；你可以直接设置缓冲区的内容。\n\
  \n例如，假设我们想直接把一个句子放入缓冲区。我们可以通过执行 tmux 命令 `set-buffer` 来实现，也可以选择指定索引并提供要放入该缓冲区的文本。以下步骤将指导你直接设置粘贴缓冲区：\n\
  \n1. 尝试执行 `<Prefix> : set-buffer \"The quick brown fox jumped over the lazy dog\"\
  `。\n2. 由于我们没有指定缓冲区索引，它会被推入堆栈顶部，即缓冲区索引 0，其余缓冲区向下移动一个索引。我们可以使用 tmux 命令 `show-buffer`\
  \ 查看该缓冲区的内容。果然，你会看到内容正是我们刚刚设置的句子。\n3. 现在使用 `<Prefix> ]` 将其粘贴到屏幕上。\n\n当然，肯定有某种方法可以清除窗口历史记录，以帮助防止这种情况。确实有，那就是\
  \ tmux 命令 `clear-history`。你可以选择提供一个目标窗格，它将清除该窗格的历史记录。例如，`clear-history -t 1` 将清除窗格\
  \ 1 的历史记录，即使该窗格不是你当前活动的窗格。\n\n> 清除历史记录时，它会清除该窗格中已滚动出窗格的所有窗口历史记录，但会保留该窗格当前可见的所有内容。要清除历史记录以及该窗格中的所有内容，最好先运行\
  \ Unix 命令 `clear` 将内容推出屏幕，然后运行 tmux 命令 `clear-history` 来清除所有内容。\n>\n> 请注意，如果有极其敏感的信息需要清除，最好在清除窗口历史记录后重启\
  \ tmux。这些敏感信息虽然已从窗口历史记录中删除，因此无法在复制模式中获取，但仍然可能被能力很强的黑客嗅探到。其数据位可能会残留在 tmux 的内存转储中并可被恢复，因此重启\
  \ tmux 是确保它也从内存中消失的唯一方法。虽然这是一种相当边缘的情况，但值得一提。\n\n![](img/5969098f450265ac0c7947efcdbe7889_94_0.png)\n\
  \n### 高级会话与窗口用法\n\n之前讨论会话时，我们介绍了如何从一个会话切换到另一个会话。当时没有涉及一些更高级的内容，例如从一个会话中的一个窗口直接切换到另一个会话中的另一个特定窗口、在会话之间移动窗口以及在会话之间共享窗口。\n\
  \n#### 从一个会话中的窗口跳转到另一个会话中的窗口\n\n几章之前，我们讨论了如何使用 `<Prefix> s` 调出会话列表并选择任意会话来在多个会话之间切换。\n\
  \n好的！让我们先做一些准备。我们需要两个活动会话，每个会话有几个窗口。如果你跟上了上一节的内容，我们应该已经有一个活动会话了；现在让我们使用 tmux 命令\
  \ `new-session -s \"Another\"` 创建另一个会话。\n\n现在让我们使用 `<Prefix> c` 创建另一个窗口，并在其中运行一些命令，例如\
  \ `top`：\n\n```\n$ top\n```\n\n\n\n\n\nThe output of this command is shown in the\
  \ following screenshot:\n\n![](img/5969098f450265ac0c7947efcdbe7889_95_0.png)\n\n\
  Let's switch back to our other session with <Prefix> s and then highlight and select\
  \ the other session we want, as shown here:\n\n![](img/5969098f450265ac0c7947efcdbe7889_95_1.png)\n\
  \nJump onto the other session (Advanced, as shown in the preceding screenshot).\
  \ Now if we do the same thing again, using <Prefix> s and switch back to the Another\
  \ session, we will arrive back in Another, in window 2 that is running top. This\
  \ is because tmux will take us back to the last window we were viewing in an active\
  \ session.\n\nHowever, what if we wanted to move directly from one session to a\
  \ specific window in another? Surely, we should not have to switch to the session\
  \ and then select the window. Well, we can directly choose a window within a session,\
  \ and tmux actually makes this a breeze.\n\nBring up the choose-tree interface again\
  \ with <Prefix> s. Notice the plus symbols to the left of the session names? They're\
  \ there because that session can be expanded to show the windows running in those\
  \ sessions. Simply highlight the session you want to drill into and tap the Space\
  \ bar or right arrow key to unfold that session and see a list of the windows in\
  \ that session. Notice how it resembles a file tree, as shown in the following screenshot.\
  \ This is why this command has the name that it does.\n\n![](img/5969098f450265ac0c7947efcdbe7889_96_0.png)\n\
  \nRecall from our first chapter what some of the magic characters on the window\
  \ mean? The characters are as follows:\n\n- The character * indicates the currently\
  \ active window\n- The character - indicates the previously active window\n\nIn\
  \ the preceding screenshot, you can see that window 2 running top was our currently\
  \ active window. If we just selected the session by choosing (1), we would be plopped\
  \ back into that session with the window running top. However, if we want to go\
  \ directly to the other window, we can do this by highlighting it, refer to the\
  \ previous screenshot, and hitting Enter.\n\n## 移动窗口\n\nSo we've got top running\
  \ in the session named Another. Imagine that we want to move that window to our\
  \ session named Advanced. First, switch to the window with top running. Now run\
  \ the tmux command move-window. It is conveniently bound to the keyboard shortcut\
  \ <Prefix> . so you can type that and then provide the name of the destination session\
  \ which, in our case, is Advanced.\n\nNote how that window is gone; now our Another\
  \ session has only one window. The window with top was moved to the Advanced session,\
  \ but we are still in the Another session. tmux opened the other window to keep\
  \ us in the current session.\n\nNow pull up the session list again using <Prefix>\
  \ s and then expand Advanced. In the following screenshot, we can see how it now\
  \ has three windows, the last of which is the window that we just moved by running\
  \ top:\n\n![](img/5969098f450265ac0c7947efcdbe7889_97_0.png)\n\nNote that this same\
  \ command can also be used to move a window to a different index within the same\
  \ session. We can specify the numerical index we'd like the window moved to within\
  \ this session rather than providing a session name. For instance, to move a window\
  \ to index 5, we could run the same move-window command via <Prefix> . and then\
  \ enter 5; by doing this, the status bar will be updated to reflect this window's\
  \ new index.\n\nWhen being moved from one session to another, the window will, by\
  \ default, be placed at the lowest available base index. So, if you have set the\
  \ base index to 1 and have windows in index 1 and 3, the moved window will land\
  \ in this session with index 2.\n\nTo specify both the session and window index\
  \ as the home for the window, specify both, separating them with a colon. For example,\
  \ to move this window to the Another session in window index 7, you could use the\
  \ move-window command with the argument Another:7 where the session comes before\
  \ the colon and the window index after.\n\nThis is also useful to move a window\
  \ to a session with a numeric name, such as the default session name 0. By default,\
  \ if you specify a number alone to the move-window command, tmux will assume you\
  \ meant the window index 0 and not the session named 0. To specify this, you will\
  \ use the command move-window 0: to explicitly specify the session named 0.\n\n\
  ## 在会话之间链接窗口\n\nNow moving the window between sessions is quite useful, but what\
  \ if we want to use the same program in multiple sessions and not have multiple\
  \ instances of it running? Note that if you do this, killing a pane or window in\
  \ one place will kill it at both places.\n\nTo later remove a window from one session\
  \ but not the other, you will need to unlink the window rather than kill it by using\
  \ the tmux command, unlink-window.\n\n## 拆分窗格\n\nThe act of taking a pane within\
  \ a window and moving it to its own window is called breaking that pane. It can\
  \ be accomplished with the tmux command break-pane or the keys <Prefix> !.\n\nBy\
  \ default, the break-pane command will operate on the currently selected pane; however,\
  \ any arbitrary pane can be specified using the same syntax we saw in the previous\
  \ example to select a window within a session, specifically separating the session\
  \ and window name by a colon. However, of course, a pane also has an index, which\
  \ can be added after the window separated by a period. This all sounds complex,\
  \ but it is actually rather intuitive.\n\nFor example, to select pane 2 in window\
  \ 1 in the session Advanced and break it into its own window, we could use the command\
  \ break-pane -s Advanced:1.2.\n\nRemember that you can see the current pane indexes\
  \ flash on the screen briefly with the key binding <Prefix> q.\n\nWhen you break\
  \ a pane, tmux automatically switches the window to select the window that now contains\
  \ that pane.\n\n## 合并窗格\n\nIn addition to linking windows between one session and\
  \ another, you can also do something called joining panes. The name can seem a bit\
  \ misleading at first, but essentially, this is used to take a pane in one window\
  \ and move it to another window.\n\nIt can be used to move one pane in a multipaned\
  \ window to another window, but it can also be used to take a window, which has\
  \ only one pane, and join it with another (now its name is probably a bit less misleading).\
  \ This is very useful if you have two windows running different things but decide\
  \ you'd prefer them as two panes of the same window.\n\nFor example, let's say we\
  \ have a pane running in one window and we want to join it with another window.\
  \ In the simplest case, we could switch to the pane we want to join and run the\
  \ command `join-pane -t :1` where `:1` indicates that we want the window in index\
  \ 1 in the current session. After running this command, the window index 1 in the\
  \ current session will have the contents of any panes it had before in addition\
  \ to the new pane we just joined to it.\n\nUsing the same elaborate `session:window.pane`\
  \ syntax we saw previously, we can specify a source pane and target destination\
  \ to get really slick about it. Say we want to take the pane in the session **Advanced**,\
  \ window 2, pane 1, and move it to the session **Another**, window 1, and not specify\
  \ a pane number so it defaults to the lowest available index. We can do this with\
  \ the command `join-pane -s Advanced:2.1 Another:1`\n\nAs you can now see, joining\
  \ panes is an incredibly powerful tool in your tmux arsenal that will allow you\
  \ to combine multiple panes into one. Now you have learned how to break a pane off\
  \ into its own window, how to combine it with other panes, how to move windows and\
  \ link them between sessions, and more.\n\n## 使用默认设置启动\n\nImagine you integrate\
  \ tmux into your workflow such that you get very used to certain things being in\
  \ certain places, perhaps a shell at the root of your code repository in window\
  \ 1, Emacs in window 2, top in window 3, and so on. Now every time you reboot your\
  \ machine, you spend some time to set up everything again, start a new session,\
  \ create three windows, launch the programs in each window, and so on; there must\
  \ be a better way. Of course there is!\n\ntmux gives us some ways to configure things\
  \ with nice defaults out of the box. We'll also see another way to do this later\
  \ in *Chapter 7, Using Other Tools with tmux*, with a third-party utility.\n\nSo\
  \ let's take the previous example and run through it. There are ways to make some\
  \ of this happen within your `.tmux.conf` file but it's generally more powerful\
  \ to do it externally via a separate bash script. So hop into your favorite editor\
  \ and start editing a new file named `.tmux.defaults`. You can name this file anything,\
  \ so if you have multiple sessions you may want to name it based on the session\
  \ name.\n\nNow let's specify our configuration. In this file, copy the following\
  \ code:\n\n```\nnew -n term zsh\nneww -n emacs emacs\nneww -n htop htop\n```\n\n\
  \n\n当然，你的命令可能会根据你的系统配置以及你希望默认运行的内容而略有不同。\n\n现在，要使用此配置文件运行，请按如下方式启动 tmux：\n\n```\n\
  $ tmux source-file ~/.tmux.defaults\n```\n\n就这样！你会看到自己在一个新的会话中启动，其中有三个窗口：第一个运行终端，第二个在\
  \ Emacs 中，第三个在 top 中。\n\n同样，你可以通过简单地为每个想要自动化的会话创建多个文件来创建多个这样的配置。\n\n> 要了解有关使用默认设置启动\
  \ tmux 的更多详细信息，请查看 tmux 手册中关于会话初始化的部分：https://wiki.archlinux.org/index.php/Tmux#Session_initialization\n\
  \n可以创建比前一个示例更复杂的会话初始化，但复杂配置通常更适合由第三方工具处理，我们将在第 7 章《使用其他工具与 tmux》中看到这一点。\n\n## 总结\n\
  \n在本章中，我们重新回顾了几个 tmux 主题，比前几章深入得多。到目前为止，你应该对粘贴缓冲区、会话、窗口、窗格以及我们在本章中深入探讨的其他所有主题都有很好的掌握和深入的了解。\n\
  \n在下一章中，我们将不会再学习 tmux 本身的更多机制，而是学习大量使用技巧，可以帮助最大化你的生产力。\n\n## 6\n\n## tmux 用于 SSH、结对编程等\n\
  \n到目前为止，我们已经几乎涵盖了 tmux 机制的方方面面。综合前几章的内容，我们现在已经了解了配置、会话、窗口和窗格、文本操作，以及诸如粘贴缓冲区、移动窗口、窗格，甚至使用某些默认值启动会话等主题中的高级使用。因此，在这一点上，我们可以用许多很棒的方式使用、配置和自定义\
  \ tmux。\n\n现在，我们将不会探索使用 tmux 的机制中的新概念，而是探索新的利用我们已经学到的东西的方法，以便简化日常工作流程。在本章中，我们将涵盖以下主题：\n\
  \n- 通过 SSH 使用 tmux 进行长期会话\n  - 使用 Vagrant 设置虚拟机\n  - 通过 SSH 使用 tmux 的工作流程\n  - 在连接时通过\
  \ SSH 启动 tmux\n- 使用 tmux 进行结对编程\n  - 连接到同一会话\n  - 使用 Vagrant Cloud 进行结对编程\n  - 使用分组会话进行配对\n\
  \n## 通过 SSH 使用 tmux 进行长期会话\n\n有多少次你通过 SSH 连接到远程服务器，却因为网络波动导致会话终止，让你在重新连接时回到原点？\n\
  \n使用 tmux，你可以连接到远程服务器，启动一个 tmux 会话，并按你喜欢的方式设置窗口和窗格。然后，如果你因任何原因与远程服务器断开连接——无论是网络波动、SSH\
  \ 会话超时、断开 VPN，还是简单地关闭笔记本电脑回家——你稍后可以 SSH 到该机器并重新连接到你的 tmux 会话，该会话一直在运行，保留了你离开时的状态。\n\
  \n这是我最喜欢的 tmux 用法，也是我在日常工作流程中节省最多时间的方法。不仅因为它可以优雅地处理网络连接问题，而且因为大多数运行 Linux 的远程服务器很少被终止；这意味着一旦你启动\
  \ tmux 会话，它可以持续数周或数月。\n\n从实际角度来说，这意味着你每天连接到某个远程服务器时，都可以通过使用 tmux 节省设置时间。你不必切换到通常想要在某个窗口中打开的目录，你不必在另一个窗口中连接\
  \ tail 到日志文件，你也不必在另一个窗口中打开你喜欢的文本编辑器中的文件。它们都会在那里，就像你之前离开时一样——多亏了 tmux。\n\n让我们通过一个实际示例来演示这一点。为此，要么通过\
  \ SSH 连接到远程服务器，要么我们提供了使用 Vagrant 在本地创建虚拟机的简短说明，你可以连接到它。\n\n### 使用 Vagrant 的好处\n\n\
  Vagrant 是一个非常简单的方式，使用虚拟化在本地启动一台机器。我们建议在这里使用它以保持一致性。\n\n我们提供的说明应该适用于几乎任何 Linux 服务器的连接，但由于有如此多的不同\
  \ Linux 发行版、版本等，肯定会有一些细微的不一致。\n\n通过使用 Vagrant，我们可以确保作者本地的环境与我们提供的说明相匹配，而这些说明将与读者本地的环境相匹配，如果你也使用\
  \ Vagrant 来设置环境的话。\n\n现在关闭你的终端窗口。是的，我是认真的，相信我——一切都会继续运行！想象一下这就像掉线、SSH 超时或回家度过一天一样。打开一个全新的终端窗口。运行以下我们之前运行过的\
  \ SSH 命令：\n\n```\n$ ssh -i ~/.vagrant.d/insecure_private_key vagrant@tmux.dev\n\
  ```\n\n一旦通过 SSH 连接，运行以下命令：\n\n```\n$ tmux attach-session -t MyServer\n```\n\n你甚至可以运行以下命令的简写版本来附加你之前运行的会话：\n\
  \n```\n$ tmux attach\n```\n\n瞧！一切都和你离开时一样！它会一直持续通过所有断开连接，只要该服务器保持运行。想象一下每天早上连接到服务器或任何时候断开连接时不必打开所有这些窗口所节省的时间！\n\
  \n## 在 SSH 连接时自动启动 tmux\n\n你也可以触发 tmux 在 SSH 连接时自动运行，这样你就不必先连接然后再启动 tmux。再次关闭你的终端窗口并打开一个新窗口。在这个新窗口中，运行以下命令：\n\
  \n```\n$ ssh -i ~/.vagrant.d/insecure_private_key vagrant@tmux.dev -t -- 'tmux attach-session\
  \ -t \"MyServer\"'\n```\n\n这告诉 SSH，在你连接后，你希望立即运行 tmux attach-session 命令并重新附加你之前拥有的会话。这很方便，但你连接到服务器的命令变得相当长了！我们可以将这个长命令放在一个可执行的\
  \ shell 脚本中并运行该脚本来连接到你的远程服务器。或者，我们也可以通过将其大部分内容隐藏在我们的 SSH 配置中来使事情变得更容易。打开你喜欢的编辑器并编辑\
  \ ~/.ssh/config 文件。该文件可能已经存在；它在你使用 SSH 连接到服务器时使用。将以下行添加到文件中：\n\n```\nHost tmux\n\
  \  HostName tmux.dev\n  User vagrant\n  IdentityFile ~/.vagrant.d/insecure_private_key\n\
  ```\n\n现在你可以使用以下简化命令更轻松地连接：\n\n```bash\n$ ssh tmux -t -- 'tmux attach-session -t\
  \ MyServer'\n```\n\n> 不幸的是，没有很好的方法可以将 tmux 命令隐藏在 ~/.ssh/config 文件中。但是，有一种方法可以在服务器上通过调整\
  \ ~/.ssh/authorized_keys 文件来实现。\n> \n> 我们把这个作为用户的练习，因为这深入到了概念中，而且并非总是希望每次连接到远程主机时都启动\
  \ tmux。\n> \n> 它也可能导致连接到远程主机的問題。例如，想象一下你指定在连接时远程会话应始终运行 tmux attach-session -t MyServer。但是，如果会话\
  \ MyServer 尚不存在会怎样？你可能会被锁定在服务器之外！所以亲爱的读者，请谨慎行事。\n\n## 使用 tmux 进行结对编程\n\n所以我们看到了如何创建会话以及如何附加现有会话，但你是否想过如果多个终端附加到同一个会话会发生什么？\n\
  \n能够将多个终端连接到同一个会话最终成为 tmux 提供的最大优势之一。通过允许两个或多个终端窗口连接到同一个 tmux 会话，tmux 成为一个极其强大的协作工具。使用\
  \ tmux，两个或更多人可以同时看到甚至交互相同的内容！\n\n## 本地连接到同一会话\n\n在进行完整的结对编程之前，让我们先尝试在两个不同的终端窗口中本地连接到同一个会话，看看会发生什么。\n\
  \n如果你按照之前的说明进行操作，你应该能够通过打开一个新终端窗口并运行以下命令来调出你的 tmux 会话：\n\n```bash\n$ ssh tmux -t\
  \ -- 'tmux attach-session -t MyServer'\n```\n\n\n\nSo let's get started. The following\
  \ steps will guide you in using Vagrant:\n\n- 1. Go to https://vagrantcloud.com/\
  \ and sign up. It's free to create an account.\n- 2. Next, go back to a terminal,\
  \ one not in the SSH session already (you can open a new one or detach one of the\
  \ existing tmux sessions with the keyboard command <Prefix>, d), and enter the following\
  \ command:\n  $ vagrant login\n- 3. Provide your username and password and you'll\
  \ be logged in.\n- 4. Navigate back to the directory where you created your Vagrantfile\
  \ and run the command:\n  $ vagrant share --ssh\n- 5. You will be prompted to provide\
  \ a password to encrypt the SSH key. Give it something that is a decent password\
  \ but which you can share with the person you're pairing with.\n- 6. On the screen,\
  \ Vagrant will give instructions for the other user to connect and issue your machine\
  \ a random name. Your current screen will look similar to the following screenshot:\n\
  \n![](img/5969098f450265ac0c7947efcdbe7889_113_0.png)\n\n- 7. Now open another terminal\
  \ window (simulating another user on a remote machine) and run the command it suggested.\
  \ In my case, the command used was:\n```\n$ vagrant connect --ssh greedy-lamb-6478\n\
  ```\nHowever, the machine name will be different for you since it's randomized.\
  \ After entering the SSH key password, you'll be connected via SSH to the server!\
  \ This could be a person on the other side of the world.\n\n- 8. Now run tmux and\
  \ attach the session of interest:\n```\n$ tmux attach-session -t MyServer\n```\n\
  And you're ready to rock.\n\nOf course, the other person connecting will also have\
  \ to sign up for Vagrant Cloud in order to connect. This is an incredibly easy way\
  \ to come up with a relatively safe pair programming environment so two (or more)\
  \ people can collaborate in real time over the Web without fear of compromising\
  \ one of the collaborator's environments.\n\nIf the worst happens and one of the\
  \ pair is nefarious, the worst they can do is make a mess of this virtual machine,\
  \ which was created with only a handful of commands.\n\n## 使用分组会话进行结对编程\n\nYou may\
  \ have seen the previous pairing and thought, \"Well that's great and seeing what\
  \ the other person sees in real time is cool, but what if you want each person to\
  \ be able to have different windows?\"\n\nThis is where grouped sessions come in.\
  \ You can have one person create a session and the next to join create a new session,\
  \ but specify the grouped session as well. This way, each person has their own control\
  \ over the windows in a session, but anything they do in each session is shared.\
  \ This allows one person to be in one window and the other in another.\n\nThey can\
  \ switch to each other's sessions at will, but otherwise don't need every command\
  \ and keystroke to enact on both windows. To create a grouped session, one person\
  \ must initiate the session as we discussed previously. If you still have the MyServer\
  \ session running, you can use that.\n\nIn a new terminal window, connect to the\
  \ same server but instead of attaching that same session with tmux, run the following\
  \ command:\n\n```\n$ tmux new-session -t MyServer -s MySession\n```\n\nThis instructs\
  \ tmux to create a new session, but with the same target. This initializes a grouped\
  \ session. The MyServer session is the grouped session, so the new connector can\
  \ view it, but new connector can also switch to another window without stealing\
  \ the initial user's view.\n\nWhile this new session shares the same target, it\
  \ essentially clones the original session and creates another for the second viewer.\
  \ They are linked; so as one user opens new windows or changes anything in one session,\
  \ the same will happen in the other session, but both sessions can have different\
  \ names and both sessions will appear in the list of sessions as two different sessions.\
  \ This way, if the second viewer kills their session (with the tmux command kill-session\
  \ -t {session name}), the first session will continue running.\n\nThis allows the\
  \ second user that connected to go off and do their own thing, creating more windows,\
  \ using a different program, and so on, but without stealing the spotlight and forcing\
  \ the host to watch their every move.\n\nNow in each of our examples, we only showed\
  \ two clients connecting to the same session. However, that could just as easily\
  \ be 3, 13, 37, 359, or more. While there is no stated limit to the number of clients\
  \ that can connect to a session simultaneously, there will be a practical limit\
  \ on throughput and bandwidth and memory at some point. However, tmux does not enforce\
  \ a set limit.\n\n## 总结\n\nWe learned some tricks of using tmux in a daily workflow.\
  \ We learned how it can be used to help created long-lived SSH sessions and how\
  \ it can be used for pair programming with a stop along the way to learn about using\
  \ Vagrant to set up a shareable virtual machine.\n\nIn the next chapter, our last,\
  \ we will discuss how we can use some other third-party tools with tmux to make\
  \ it even more powerful.\n\nA sample usage would be to run a command like the following:\n\
  \n```\n$ cat Sonnet16.text | pbcopy\n```\n\nThis command will print out the contents\
  \ of the Sonnet16.text file and pipe them into the pbcopy program, which will then\
  \ make the contents of that file easy to be pasted in OS X in any program with simply\
  \ ⌘ + v.\n\nThe problem is that if you try this trick within a tmux session, it\
  \ won't work! This is because the OS X Pasteboard doesn't play nicely. A short way\
  \ to explain it is that because tmux runs its server as a daemon (which is what\
  \ allows you to detach then reattach with it still running), OS X denies permission\
  \ for it to access the Pasteboard. This is done for security purposes, so other\
  \ programs running in the background are unable to access the Pasteboard. However,\
  \ programs we'd like to have access to the Pasteboard, such as tmux, cannot access\
  \ it without some tricks.\n\n> For the more information, see this lengthy description\
  \ in README for a utility that fixes the issue: https://github.com/ChrisJohnsen/tmux-MacOSX-pasteboard#mac-os-x-pasteboard-access-under-tmux-and-screen.\n\
  \nHowever, since we do want tmux to have access to the OS X Pasteboard, surely there\
  \ must be some way around this security restriction! Thankfully, some smart minds\
  \ have come before us and solved the problem.\n\nIt'll take two steps. First, we'll\
  \ install the small utility program. Second, we'll update our .tmux.conf file to\
  \ launch every new window using this utility.\n\nLet's first install the program.\
  \ If you are a developer, you may already have Homebrew or MacPorts installed. (If\
  \ not, we recommend that you install Homebrew: http://brew.sh)\n\nNow, use the following\
  \ command to install this utility using Homebrew:\n\n```\n$ brew install reattach-to-user-namespace\n\
  ```\n\nYou can even use the following command if you prefer MacPorts:\n\n```\n$\
  \ port install tmux-pasteboard\n```\n\nNow, add the following lines to your .tmux.conf\
  \ file:\n\n```\n# 让 tmux 与 OS X 剪贴板友好协作\nset-option -g default-command \"reattach-to-user-namespace\
  \ -l zsh\"\n```\n\nHere, `zsh` can be replaced by your shell of choice, so it could\
  \ be `bash`, or `fish`, or any other shell of your choice. By adding these lines\
  \ to your configuration, you are basically telling tmux that any new window it launches\
  \ should launch with that command rather than just a normal new shell. This new\
  \ command is a shell that has been patched to play nicely with the OS X Pasteboard\
  \ so `pbcopy` and `pbpaste` work as intended.\n\nYou may notice that this will only\
  \ work on a system with the `reattach-to-user-namespace` utility installed and will\
  \ cause issues on Linux or another Mac that did not have that installed. This can\
  \ be remedied by using the following formulation instead:\n\n```\nif-shell 'test\
  \ -x /usr/local/bin/reattach-to-user-namespace' 'set-option -g default-command \"\
  reattach-to-user-namespace -l zsh\"'\n```\n\nThis will run only on systems that\
  \ have this `reattach-to-user-namespace` command. The `if-shell` bit is a very useful\
  \ little tmux command that will run the second command that follows it, provided\
  \ the first command that follows it returns success. In our case, using the `test\
  \ -x` command allows us to check and see whether the `reattach-to-user-namespace`\
  \ file exists. If it does, it runs the tmux `set-option` to use the fixed item.\
  \ If not, it runs nothing, so it will not break on systems that do not have this\
  \ script.\n\n## tmux configuration from the maximum-awesome project, by Square\n\
  \nWhile we're on the topic of configuration, we should discuss the maximum-awesome\
  \ project, and the configuration files for Vim and tmux from the folks at Square.\
  \ Square specializes in payments and is very active in the open source community.\n\
  \nThey have put a ton of thought and effort over the years into curating what they\
  \ consider to be the ideal configuration for Vim and tmux and they have it freely\
  \ available on GitHub: https://github.com/square/maximum-awesome.\n\nBe forewarned,\
  \ their configuration is rather Vim opinionated, but that caveat aside, they have\
  \ baked up a truly awesome set of configurations.\n\nOur favorite thing about these\
  \ configuration files is that they provide a good set of defaults and recently added\
  \ support for a `.tmux.conf.local` file intended for user overrides and custom commands.\
  \ They are both great drop-in configuration files and great sources of inspiration\
  \ for creating your own configuration.\n\n\n\n\n那么，让我们来试试 maximum-awesome 吧。导航到一个你可以克隆这个仓库的目录。例如，我们就在主目录下操作。输入以下命令开始：\n\
  \n```\n$ cd\n```\n\n然后，用以下命令克隆仓库：\n\n```\n$ git clone https://github.com/square/maximum-awesome.git\n\
  ```\n\n接下来，进入该目录：\n\n```\n$ cd maximum-awesome\n```\n\n运行 rake 命令来安装项目：\n\n```\n\
  $ rake\n```\n\n> 这里，rake 是 Ruby 命令 make 的简称，相当于 Ruby 中的 make。如果你没有安装它，可以通过命令 `gem\
  \ install rake` 来安装。如果你没有安装 gem，请参考 RubyGems 网站上的说明：https://rubygems.org/pages/download。\n\
  \n现在，gems 应该已经安装好了！如果你现在启动 tmux，就会进入 maximum-awesome 的配置环境。\n\n> 另外，需要提醒你的是，加载 maximum-awesome\
  \ 可能会覆盖你本地已有的 `.tmux.conf` 文件（因为本质上，它的核心就是一个很棒的 `.tmux.conf` 文件）。所以，在运行这个命令之前，请务必备份好你的\
  \ `.tmux.conf` 文件。\n\n## 使用 tmuxinator 让会话管理更轻松\n\n在第 5 章“深入探索”中，我们在“使用默认配置启动”一节里简单提到了如何用一些默认会话配置来启动\
  \ tmux。\n\n你可能已经注意到，即使是一个相当简单的配置，也可能变得有些复杂和棘手。这正是 tmux 核心功能中不尽如人意的地方之一。\n\n幸运的是，开源社区挺身而出，创建了一个名为\
  \ *tmuxinator* 的优秀工具，让这类配置变得简单得多。\n\ntmuxinator 使用 Ruby 构建，安装容易，功能强大。它允许你使用简单直观的\
  \ YAML 语法来指定窗口的布局方式、启动时要运行的程序等等。tmuxinator 允许你创建在任何窗口配置运行之前执行的钩子，并且让指定一组默认窗口和窗格比在\
  \ tmux 核心功能中要容易得多。\n\n让我们来走一遍安装和创建示例 tmuxinator 配置文件的完整流程。\n\n### 安装 tmuxinator\n\
  \n由于它是用 Ruby 构建的，所以作为 Ruby gem 提供，安装起来非常轻松。在命令行中，直接运行：\n\n```sh\n$ gem install tmuxinator\n\
  ```\n\n> 根据你的系统设置，可能需要使用 sudo 来安装 gems。我们建议先尝试不用 sudo，如果安装失败再使用 sudo。\n\ntmuxinator\
  \ 会在安装过程中友好地提示，它包含一个 `tmuxinator doctor` 命令，可以用来检查你本地的系统配置，确保一切正常。我们建议现在就运行它，并修复它发现的任何问题：\n\
  \n```sh\n$ tmuxinator doctor\n```\n\n当你看到所有项目都确认为 **Yes** 时，就可以继续了。\n\n### 理解 tmuxinator\
  \ 配置\n\n首先，打开终端，运行以下命令来创建初始的 tmuxinator 配置文件：\n\n```sh\n$ tmuxinator new tutorial\n\
  ```\n\n`tmuxinator new` 命令会启动一个新的 tmuxinator 配置文件，我们给它命名为 `tutorial`。当然，你可以随意给你的文件起任何名字。\n\
  \n你将会直接进入你喜欢的编辑器，里面已经包含了 tmuxinator 配置文件的默认内容。关于这个文件，有几点需要注意：\n\n-   它位于 `~/.tmuxinator/<name>.yml`（在我们的例子中是\
  \ `~/.tmuxinator/tutorial.yml`）。这是 tmuxinator 存储所有配置文件的地方。这样很好，因为你可以有多个配置文件，它们都存放在一个地方，并且\
  \ tmuxinator 都可以访问。\n-   在几行之后，有一大堆注释。这些注释表示可以使用的选项，但默认情况下并未启用。我们稍后会深入探讨。\n-   在文件的底部是实际布置窗口、窗格等的\
  \ YAML。tmuxinator 包含了一套默认的布局。\n\ntmuxinator 包含它自己特有的一种领域特定语言，用于构建包含窗口、窗格以及在其中运行的默认程序的丰富配置。\n\
  \n例如，下面是一个示例配置文件。我们在每一行之前添加了以 `#` 开头的有用注释，以描述该行在做什么：\n\n```\n# 设置这个 tmuxinator 配置的名称\n\
  name: tutorial\n# 设置根目录，所有新窗格都会从\n# 打开到这个目录的终端开始\nroot: ~/\n\n# 这是窗口规格说明的开始部分\n\
  windows:\n  # 指定第一个名为 \"editor\" 的窗口\n  - editor:\n    # \"editor\" 窗口应该采用垂直布局\n\
  \    layout: main-vertical\n    # 指定 \"editor\" 窗口应该有两个\n    # 窗格\n    panes:\n\
  \      # emacs 应该在一个窗格中运行\n      - emacs\n      # top 应该在另一个窗格中运行\n      - top\n\
  \  # 现在我们有第二个名为 \"server\" 的窗口，它应该在打开时\n  # 运行命令 \"node ~/myapp.js\"\n  - server:\
  \ node ~/myapp.js\n  # 应该有第三个名为 \"logs\" 的窗口，它应该\n  # 启动时运行 tail 命令来查看日志\n  - logs:\
  \ tail -f log/development.log\n```\n\n### 将其他工具与 tmux 结合使用\n\n我们还没有深入讨论过 socket，因为这会涉及比较专业深入的领域，但第一行允许你指定一个\
  \ socket 名称。\n\n默认情况下，当 tmux 首次启动时，会在机器上启动一个服务器，该服务器会创建一个 socket 并开始监听。然后启动客户端并连接到这个\
  \ socket。这在正常使用中都是无缝衔接的。\n\n这个 socket 的持久性使得你可以分离 tmux 会话并重新连接。实际上，当你分离时，你终止的是客户端；然而，tmux\
  \ 服务器会继续运行，监听该 socket 上的传入连接。当你决定重新连接到一个会话时，你就是启动一个客户端并连接到该 socket。\n\n这个 socket\
  \ 也是允许多人连接到一个 tmux 会话的原因，正如我们在*第 6 章“tmux 用于 SSH、结对编程等”*中讨论使用 tmux 进行结对编程时看到的那样。\n\
  \n到目前为止，每当我们运行 tmux 命令进行连接时，都会无缝地连接到那个默认 socket，但你可以启动 tmux 并指定你自己的 socket 路径或名称。这样我们就可以在同一台机器上运行多个独立的\
  \ tmux 实例。\n\n所以，这个配置选项允许我们在使用 `tmuxinator start <name>` 启动时指定 socket 名称。\n\n接下来从\
  \ `pre` 命令开始的部分，复制在下面的代码片段中：\n\n```text\n# 在所有操作之前运行。用它来启动守护进程等。\n# pre: sudo /etc/rc.d/mysqld\
  \ start\n```\n\n正如其名称所示，这部分允许你指定在 tmuxinator 会话启动时要运行的任何命令。这对于启动那些没有界面但你希望它们在会话期间运行并可用的后台任务非常有用。这很方便，因为它避免了我们不得不打开一个新窗格（或多个窗格）、启动一个程序，然后让它一直挂在那里却又不予理睬的情况。下面的代码片段允许我们为这个\
  \ tmuxinator 实例指定可能不会出现在标准 `.tmux.conf` 文件中的 tmux 选项：\n\n```text\n# 在每个窗口和窗格中、窗口/窗格特定命令之前运行。\n\
  # 对于设置解释器版本很有用。\n# pre_window: rbenv shell 2.0.0-p247\n```\n\n这个命令允许我们在创建的每个窗口或窗格中运行一个命令，而不仅仅是在\
  \ tmux 启动时运行。在下面的命令中，我们传递的是配置文件：\n\n```text\n# 向 tmux 传递命令行选项。对于指定不同的\n# tmux.conf\
  \ 很有用。\n# tmux_options: -f ~/.tmux.mac.conf\n```\n\n可能有一些更简单的命令，比如更改前缀键或我们在*第 2\
  \ 章“配置 tmux”*中看到的任何其他内容，也可能有更强大的命令，比如示例中加载另一个配置文件并吸收其所有命令。下面的代码允许我们更改调用 tmux 的命令：\n\
  \n```text\n# 更改调用 tmux 的命令。这可以用于 tmux 的衍生/封装工具，\n# 比如 byobu。\n# tmux_command: byobu\n\
  ```\n\n这段代码提到了 byobu，它是一个基本上运行在 tmux（或 GNU Screen）之上并为其添加额外功能的程序。这行的理念是，如果你更倾向于使用\
  \ tmuxinator 来调用 tmux 之外的某些封装了 tmux 的其他命令，你可以通过这一行来实现。\n\n### 总结 tmuxinator\n\n\
  总而言之，tmuxinator 是一个非常强大的程序，它为 tmux 添加了许多有用的功能，并且将为任何 tmux 用户节省大量时间，每次他们需要重新启动 tmux\
  \ 并设置好环境时都能派上用场。\n\n它不仅能节省大量时间，对于初学者来说也极其有用，它可以充当辅助轮的角色，直到 tmux 用户熟悉了创建窗口和窗格的所有细节。正如我们在*第\
  \ 3 章“会话、窗口和窗格”*中看到的，创建和操作窗格可能相当困难。有一个简单的 tmuxinator 配置文件，可以毫不费力地快速启动这个过程，这将会非常有帮助。\n\
  \n![](img/5969098f450265ac0c7947efcdbe7889_125_0.png)\n\n\n\n\n\n## 使用 wemux 简化多用户体验\n\
  \n社区构建的另一个很棒的实用工具是 **wemux**。它旨在简化 tmux 中的多用户体验。正如我们在上一章中所看到的，将 tmux 设置用于结对编程是 tmux\
  \ 的一个很棒的功能。它在此基础上构建，使配置变得更容易，并增加了一些非常有用的功能。\n\n前往 wemux 的 GitHub 页面开始使用并安装 wemux：\n\
  \n```\nhttps://github.com/zolrath/wemux\n```\n\n如果您正在进行一个活动的 tmux 会话，请在继续之前先分离它\
  \ `<Prefix>, d`。\n\n现在让我们进入 wemux。从您的终端运行以下命令：\n\n```\n$ wemux start\n```\n\nBoom！但等等，你可能会说这看起来完全像\
  \ tmux。你说得对，wemux 是 tmux 的一个包装器，所以它就是你所熟悉和喜爱的 tmux，只是添加了一些特殊功能来促进多用户概念。\n\n从你的命令行运行以下命令：\n\
  \n```\n$ wemux users\n```\n\n此命令的输出可以在以下截图中看到：\n\n![](img/5969098f450265ac0c7947efcdbe7889_126_0.png)\n\
  \n你应该会看到包含一个用户的列表。可以想象，如果有其他用户连接，他们也会出现在这个列表中。此外，如果列表中还有另一个用户，而我们想将其从当前 wemux 会话中踢出，你可以运行以下命令：\n\
  \n```\n$ wemux kick username\n```\n"
- "## 附录\n\n附录将涵盖以下三个主题：\n\n- 为什么使用 tmux？\n- 配置参考\n- 键绑定和命令参考\n\n### 为什么使用 tmux？\n\
  \n许多开发人员在终端中花费了大部分时间。无论是用于编码；SSH 连接到远程服务器；浏览文件系统；本地任务，如检查、编译或代码检查、运行单元测试；甚至用于邮件或\
  \ Internet Relay Chat（IRC），终端都是开发人员武器库中最广泛使用的工具之一。\n\ntmux 是一个在终端内运行的命令行应用程序，可以\
  \ turbocharge 它。其强大的功能允许简化许多日常任务，如本书各处所示。然而，大多数人使用像 tmux 这样的程序的主要原因是它允许你将一个终端窗口变成许多虚拟窗口，每个窗口都有自己的状态。它属于一类称为终端多路复用器（tmux\
  \ 只是该术语的缩写）的应用程序。它有一些兄弟程序，但最突出的是 GNU Screen。\n\n还记得没有标签页的网页浏览器吗？如果你回答没有，你就没错过什么，并且享受你的青春！然而，如果你回答是，可能需要一秒钟来回忆它有多不方便。当然，用多个标签页可以做的事情，用没有标签页和多个浏览器窗口也可以做，但能够将它们组合在一起仍然是对生产力的很大提升。拥有许多浏览器窗口会非常混乱。标签页的出现让你能够在逻辑上分离你的浏览体验。在标签页之前，你会有用于参考文档的一个浏览器窗口，另一个用于购物，等等。\n\
  \n同样，tmux 等终端多路复用器允许你做同样的事情，将多个窗口在逻辑上分组到一个终端窗口中，就像浏览器中的标签页一样。就像每个浏览器标签页包含自己的状态一样，每个\
  \ tmux 窗口也是如此。\n\n然而，与浏览器标签页不同，后者主要只是增加了组织性，tmux 实际上为终端增加了丰富的额外功能。tmux 不仅允许将窗口分割成窗格，以便屏幕上同时显示多个不同的内容，而且\
  \ tmux 还增加了复制模式和其他结构，允许重度终端用户在不离开 tmux 或甚至不必经常使用鼠标的情况下做更多事情。我们在本书中触及了其中的许多好处，因此在这里就不必重复了。\n\
  \n为什么要在标准终端应用程序带原生标签页（例如，OS X Terminal、iTerm、Gnome Terminal 等）的情况下使用终端多路复用器？原因有很多，但以下只是其中几个：\n\
  \n- 复制模式的添加允许在终端窗口之间复制和粘贴，而无需使用鼠标。这对于标准标签页终端应用程序来说很难实现。\n- 保存状态的添加意味着你可以关闭正在运行 tmux\
  \ 的终端窗口，你的整个会话状态将被保存并可以在以后重新附加（假设你的终端程序允许 tmux 服务器在后台继续运行；并非所有都允许）。任何正在运行的程序都会在后台继续运行。这对于\
  \ iTerm、OS X Terminal 或任何 Linux 终端中的标签页来说并非如此。关闭其中一个将丢弃该窗口的状态。\n- 使用 tmux 将窗口分割成窗格并重新排列这些窗格的强大功能和灵活性远超任何标签页终端界面。大多数现代终端应用程序现在只支持简单的垂直或水平分割，大概就这样了。而对于\
  \ tmux 而言，分割的数量、布局等方面的可能性几乎是无限的。\n- 所有用于更改这些分割的大小和布局的 tmux 键盘快捷键都意味着对鼠标的依赖减少，这是大多数普通标签页终端应用程序无法提供的。\n\
  - 不仅 tmux 提供了更多用于调整这个或那个大小的快捷键，而且 tmux 还提供了更广泛的自定义范围，针对它能处理的每个操作的键盘快捷键。实际上，每个 tmux\
  \ 快捷键都可以通过简单的配置文件更改或重新连接，如第 2 章《配置 tmux》所示。一些终端应用程序可能提供一些自定义，但没有一个在这一点上像 tmux 那样强大。\n\
  - tmux 中的窗格和窗口管理要简单得多，也更强大。使用 tmux，很容易将窗口分割成许多不同的窗格，移动它们，将它们附加到不同的窗口，移动窗口，将窗口附加到不同的会话，等等。Screen\
  \ 中许多这些任务是不可能的，而且最终比使用 tmux 复杂得多。\n- tmux 的状态栏配置开箱即用非常简单，默认设置大多数人都会喜欢。另一方面，Screen\
  \ 默认不包含状态栏，并且指定它的方法非常复杂。例如，这是我 Screen 配置中启用 tmux 风格状态栏的实际一行：\n\n  ```\n  hardstatus\
  \ string '{%=kG} [ %{G}%H %{g} [%{=kw}%?%-Lw%?%{r}(%{W}%n*%f%t%? (%u)%?%{r})%{w}%?%+Lw%?%=\
  \ %{g}] [%{B}%Y-%m-%d %{W}%c %{g}]'\n  ```\n\n不；这不是一个笑话。这是实际的行，它所做的只是显示 tmux 状态栏开箱即用支持的相同内容。\n\
  \ntmux 相对于 Screen 的好处还有更多，但这应该能让任何读者很好地了解这里的理由。\n\n> 作为我们曾经使用过的第一个终端多路复用器，Screen\
  \ 在作者心中仍占有特殊地位。这里的意图绝对不是抨击 Screen，该程序令人印象深刻地在撰写本文时庆祝其第 27 年。Screen 仍然是一个非常棒的程序，并且在很大程度上为\
  \ tmux 铺平了道路。然而，你购买这本书是因为你想学习 tmux，我们的意图是列举一些原因，说明为什么 tmux 是其类型中最棒的程序。\n\n![](img/5969098f450265ac0c7947efcdbe7889_134_0.png)\n\
  \n### 配置参考\n\n下面是我们在第 2 章《配置 tmux》中逐步构建的配置文件：\n\n```\n# Enable mouse mode for mouse\
  \ scrolling (tmux 1.9a+)\nset-window-option -g mouse-mode on\n# Enable mouse for\
  \ selecting the window by clicking on the title\n# in the status bar\nset-option\
  \ -g mouse-select-window on\n# Enable mouse for selecting the pane by clicking on\
  \ it\nset-option -g mouse-select-pane on\n# Enable the mouse for clicking and dragging\
  \ to resize panes\nset-option -g mouse-resize-pane on\n```\n\n\n\n\n# Set the status\
  \ bar background to blue\nset-option -g status-bg blue\n# Set the status bar text\
  \ to white\nset-option -g status-fg white\n\n# Widen the status-left a bit to fit\
  \ more\nset-option -g status-left-length 25\n# Change status-left to be {username@host}\n\
  set-option -g status-left \"#{whoami}@#H\"\n\n# Set the active window background\
  \ in the status bar\nset-window-option -g window-status-current-bg magenta\n\n#\
  \ Rebind the prefix key\nset-option -g prefix C-t\n\n# Add a key binding for reloading\
  \ our configuration\nbind-key C-r source-file ~/.tmux.conf\n# Double tapping the\
  \ prefix jumps to last window\nbind-key C-t last-window\n\n# Set escape time to\
  \ not break vim\nset-option -s escape-time 0\n\n# Set the base-index to 1 rather\
  \ than 0\nset-option -g base-index 1\nset-window-option -g pane-base-index 1\n\n\
  # Extend the display time to 2 seconds\nset-option -g display-time 2000\n\n# Store\
  \ more history in the buffer than default\nset-option -g history-limit 10000\n\n\
  ## 键绑定与命令参考\n\n这并非旨在成为 tmux 键绑定和命令的详尽参考。若需详尽参考，可在终端中输入以下命令查看 tmux 手册页：\n\n```\n\
  $ man tmux\n```\n\n你也可以访问 http://man.cx/tmux 查看更多有关 tmux 的信息。\n\n相反，这是一份逐章参考，涵盖了每章中提到的\
  \ tmux 键和命令，并按照它们被提及的顺序附有简要描述。\n\n这样便于你按照章节中出现的顺序回顾和记忆这些键绑定和命令，而无需通读整章内容。\n\n###\
  \ 第 1 章 – 直接上手\n\n在本章中，我们直接上手，游览了 tmux 的许多功能。因此，以下命令列表五花八门：\n\n- 启动 tmux：$ tmux\n\
  - 重命名会话：$ tmux rename-session {session name}\n- 创建新窗口：<Prefix>, c\n- 切换到最后一个窗口：<Prefix>,\
  \ l\n- 按索引切换窗口：<Prefix>, {index of window}\n- 列出所有键绑定：<Prefix>, ?\n- 在键绑定列表中启动搜索：Ctrl\
  \ + s（或 vi 用户使用 /）\n- 关闭 tmux 打开的任何对话框，例如键绑定列表：q\n- 打开选择窗口界面：<Prefix>, w\n- 切换到下一个窗口（按窗口索引）：<Prefix>,\
  \ n\n- 切换到上一个窗口（按窗口索引）：<Prefix>, p\n- 使用指定搜索文本查找打开的窗口：<Prefix>, f\n- 脱离当前 tmux 会话：<Prefix>,\
  \ d\n- 列出所有活动会话：$ tmux list-sessions\n- 启动 tmux 并按名称附加会话：$ tmux attach-session -t\
  \ {session-name}\n- 启动 tmux 并附加会话的更短方式：$ tmux attach -t {session-name}\n- 启动 tmux\
  \ 并附加会话的更更短方式（仅当只有一个活动会话时可用）：$ tmux attach\n- 列出所有活动会话的别名：$ tmux ls\n- 列出所有 tmux\
  \ 命令：$ tmux list-commands\n- 列出所有 tmux 命令的别名：$ tmux lscm\n\n### 第 2 章 – 配置 tmux\n\
  \n在本章中，我们大量涉及配置。这里列出的是*第 2 章“配置 tmux”*中介绍的键绑定和命令，关于我们讨论的新配置项，请参阅*配置参考*部分：\n\n- 设置\
  \ tmux 选项：`$ tmux set-option {option to set} {value}`\n- 禁用状态栏：`$ tmux set-option\
  \ status off`\n- 启用状态栏：`$ tmux set-option status on`\n- 查看当前处于 Emacs 还是 vi 模式：`$\
  \ tmux show-options -g | grep key`\n- 重新加载 tmux 配置：`$ tmux source-file ~/.tmux.conf`\n\
  - 显示所有先前显示过的消息：`<Prefix>, ~`\n\n### 第 3 章 – 会话、窗口和窗格\n\n在*第 3 章“会话、窗口和窗格”*中，我们学习了如何使用\
  \ tmux 的三个核心构建块——会话、窗口和窗格——在终端窗口内移动和组织内容。因此，我们在本章中学习的键命令都与操作这三个元素之一有关。本章涵盖的键命令如下：\n\
  \n- 使用指定名称的会话启动 tmux：`$ tmux new-session -s {session name}`\n- 访问切换会话的交互式对话框：`<Prefix>,\
  \ s`\n- 切换到下一个会话：`<Prefix>, )`\n- 切换到上一个会话：`<Prefix>, (`\n- 将一个窗格水平拆分为两个窗格：`<Prefix>,\
  \ %`\n- 将光标切换到另一个窗格：`<Prefix>, o`\n- 将光标移动到右侧、左侧、下方或上方的窗格：`<Prefix>, right arrow;\
  \ <Prefix>, left arrow; <Prefix>, down arrow; <Prefix>, up arrow`\n- 关闭当前窗格：`<Prefix>,\
  \ x`\n- 将一个窗格垂直拆分为两个窗格：`<Prefix>, \"`\n- 调整当前窗格大小：`<Prefix>, Alt + {arrow key}`\n\
