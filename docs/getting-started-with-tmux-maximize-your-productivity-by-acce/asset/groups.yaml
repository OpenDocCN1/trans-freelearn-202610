    \ tmux 及其强大功能。通过将单个终端窗口变成多个窗口，每个窗口都有自己的状态，tmux 就像是为你的控制台加装了一个超级增压器。\n\n我们将从对 tmux\
    \ 的简单介绍开始，学习一些在日常终端使用中帮助提升生产力的方法。接着，我们将继续配置和定制 tmux，使其外观和操作方式最适合你的需求。在此过程中，我们有大量的教程和截图，方便你跟随学习而不会迷路。我们还将解释\
    \ tmux 的一些核心概念，包括它如何使用会话、窗口和窗格来划分内容和运行中的程序。\n\n在学习了一些入门主题之后，我们将深入探讨一些高级 tmux 概念。我们将介绍如何执行文本操作，在一个窗口与另一个窗口之间甚至与文件之间复制和粘贴文本。我们将学习如何使用\
    \ tmux 进行容错的 SSH 会话或结对编程，最后还将讨论一些可以与 tmux 一起使用的其他开源工具，使其更加强大。\n\ntmux 是一个非常强大的工具，其中有一些概念可能难以掌握。本书将以\
    \ tmux 手册页中找不到的方式，通过大量解释和丰富示例来帮助厘清这些难点。\n\n在本书结束时，你将更深入地理解 tmux 及其能力，以及为你的终端体验加速所需的所有工具。本书涵盖以下主题：\n\
    \n第 1 章“直接开始”将让我们迅速进入实战状态，体验一个典型的 tmux 工作流程，并沿途解释一切。这会让我们感受到 tmux 的用途，以及如何将其融入你的日常工作流程。\n\
    \n第 2 章“配置 tmux”将教我们如何更改和配置 tmux 几乎所有的行为，从它的外观和操作感到加载时执行的命令。你甚至可以配置 tmux 响应的每一个按键组合。在本章中，我们将介绍配置\
    \ tmux 的各种方式，并使其为你的工作流程进行定制。\n\n第 3 章“会话、窗口和窗格”将帮助我们全面了解会话、窗口和窗格。这些是构成 tmux 窗口管理功能的基本组件，本章将帮助我们理解它们是什么以及它们之间的关系。我们将通过示例学习许多使用它们的方法，从而用\
    \ tmux 加速我们的终端。\n\n第 4 章“文本操作”帮助我们了解 tmux 中用于文本操作的强大工具。这些工具以复制模式和粘贴缓冲区形式出现，我们将进一步学习它们以及如何使用它们进行非常强大的文本操作，例如滚动浏览已滚出屏幕的文本，以及从窗口历史记录中的任意位置复制文本并粘贴——通常完全不需要触碰鼠标。\n\
    \n第 5 章“深入探索”涉及我们已介绍主题的更多细微方面。这些主题包括 tmux 命令及其命令模式、高级粘贴缓冲区用法，以及窗口和窗格的一些高级用法。最后，我们将学习如何启动一个带有默认窗口的\
    \ tmux 会话。\n\n第 6 章“用于 SSH、结对编程等的 tmux”将带我们了解一些可能非常强大的使用模式。它将帮助我们学习如何通过 SSH 使用\
    \ tmux 进行长会话结对编程，同时我们将使用 Vagrant 来提高可预测性和安全性。\n\n第 7 章“将其他工具与 tmux 一起使用”将让我们讨论一些可以与\
    \ tmux 一起运行并添加更强大功能的第三方工具。我们将了解 tmuxinator（它简化了 tmux 启动配置）和 wemux（它将 tmux 的多用户体验提升到一个全新水平）。我们还将了解这些工具以及一些其他技巧和实用程序。\n\
    \n附录包含三个部分，即“为什么选择 tmux？”、“配置参考”和“键绑定与命令参考”。\n\n"
