    我们也可以重新绑定前缀键，让它变得更方便，或者设置成不会与其他程序冲突的方式。


    你们中的一些人可能来自使用 GNU screen 的背景，那是另一个终端复用器，使用 `Ctrl + a` 作为前缀键。所以与其学习 tmux 的按键，你可能想直接把
    `Ctrl + a` 重新绑定为你的 tmux 前缀键。


    或者，你可能是 Emacs、nano 或其他大量使用 `Ctrl + b` 来将光标向后移动一个字符的程序的频繁用户。在这种情况下，`Ctrl + b` 并不是一个适合全局重新绑定的方便按键。


    这类用户可能会选择将前缀键重新绑定为在 Emacs 或其他程序中较少使用或不太重要的键，比如 `Ctrl + t`。这还顺便有助于提供按键提示（t 代表 tmux！）。


    无论你的动机是什么，重新绑定前缀键都是可能的。那么，作为练习，让我们把它重新绑定为 `Ctrl + t`。如果这让你感到不适，你可以在自己的配置中忽略它。不过，重新绑定前缀键与重新绑定其他键略有不同。你可能会认为在
    `.tmux.conf` 文件中写下下面这行就能生效，但事实并非如此：


    ```

    bind-key C-t prefix

    ```


