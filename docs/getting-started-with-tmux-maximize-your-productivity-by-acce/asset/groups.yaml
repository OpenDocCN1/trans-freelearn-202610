    \ these key bindings and commands in the same order that they were covered in\
    \ the chapter without having to wade through all of the text of that chapter.\n\
    \n## Chapter 1 – Jump Right In\n\nIn this chapter, we jumped right in and went\
    \ on a tour of many of the features of tmux. As a result, the following list of\
    \ commands is widely varied:\n\n- Launch tmux: $ tmux\n- Rename a session: $ tmux\
    \ rename-session {session name}\n- Create a new window: <Prefix>, c\n- Switch\
    \ to the last window: <Prefix>, l\n- Switch to a window by its index: <Prefix>,\
    \ {index of window}\n- List all key bindings: <Prefix>, ?\n- Initiate a search\
    \ within the key bindings list: Ctrl + s (or / for vi users)\n- Close any dialog\
    \ opened by tmux, such as the key bindings list: q\n- Open the choose window interface:\
    \ <Prefix>, w\n- Switch to the next window (by the window index): <Prefix>, n\n\
    - Switch to the previous window (by the window index): <Prefix>, p\n- Find an\
    \ open window with the specified search text: <Prefix>, f\n- Detach the current\
    \ tmux session: <Prefix>, d\n- List all active sessions: $ tmux list-sessions\n\
    - Start tmux and attach a session by name: $ tmux attach-session -t {session-name}\n\
    - A shorter way to start tmux and attach a session: $ tmux attach -t {session-name}\n\
    - An even shorter way to start tmux and attach a session (only works when there\
