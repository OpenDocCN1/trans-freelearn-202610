  mdcn: "\n\nSo let's get started. The following steps will guide you in using Vagrant:\n\
    \n- 1. Go to https://vagrantcloud.com/ and sign up. It's free to create an account.\n\
    - 2. Next, go back to a terminal, one not in the SSH session already (you can\
    \ open a new one or detach one of the existing tmux sessions with the keyboard\
    \ command <Prefix>, d), and enter the following command:\n  $ vagrant login\n\
    - 3. Provide your username and password and you'll be logged in.\n- 4. Navigate\
    \ back to the directory where you created your Vagrantfile and run the command:\n\
    \  $ vagrant share --ssh\n- 5. You will be prompted to provide a password to encrypt\
    \ the SSH key. Give it something that is a decent password but which you can share\
    \ with the person you're pairing with.\n- 6. On the screen, Vagrant will give\
    \ instructions for the other user to connect and issue your machine a random name.\
    \ Your current screen will look similar to the following screenshot:\n\n![](img/5969098f450265ac0c7947efcdbe7889_113_0.png)\n\
    \n- 7. Now open another terminal window (simulating another user on a remote machine)\
    \ and run the command it suggested. In my case, the command used was:\n```\n$\
    \ vagrant connect --ssh greedy-lamb-6478\n```\nHowever, the machine name will\
    \ be different for you since it's randomized. After entering the SSH key password,\
    \ you'll be connected via SSH to the server! This could be a person on the other\
    \ side of the world.\n\n- 8. Now run tmux and attach the session of interest:\n\
    ```\n$ tmux attach-session -t MyServer\n```\nAnd you're ready to rock.\n\nOf course,\
    \ the other person connecting will also have to sign up for Vagrant Cloud in order\
    \ to connect. This is an incredibly easy way to come up with a relatively safe\
    \ pair programming environment so two (or more) people can collaborate in real\
    \ time over the Web without fear of compromising one of the collaborator's environments.\n\
    \nIf the worst happens and one of the pair is nefarious, the worst they can do\
    \ is make a mess of this virtual machine, which was created with only a handful\
    \ of commands.\n\n## Using grouped sessions for pairing\n\nYou may have seen the\
    \ previous pairing and thought, \"Well that's great and seeing what the other\
    \ person sees in real time is cool, but what if you want each person to be able\
    \ to have different windows?\"\n\nThis is where grouped sessions come in. You\
    \ can have one person create a session and the next to join create a new session,\
    \ but specify the grouped session as well. This way, each person has their own\
    \ control over the windows in a session, but anything they do in each session\
    \ is shared. This allows one person to be in one window and the other in another.\n\
    \nThey can switch to each other's sessions at will, but otherwise don't need every\
    \ command and keystroke to enact on both windows. To create a grouped session,\
    \ one person must initiate the session as we discussed previously. If you still\
    \ have the MyServer session running, you can use that.\n\nIn a new terminal window,\
    \ connect to the same server but instead of attaching that same session with tmux,\
    \ run the following command:\n\n```\n$ tmux new-session -t MyServer -s MySession\n\
    ```\n\nThis instructs tmux to create a new session, but with the same target.\
    \ This initializes a grouped session. The MyServer session is the grouped session,\
    \ so the new connector can view it, but new connector can also switch to another\
    \ window without stealing the initial user's view.\n\nWhile this new session shares\
    \ the same target, it essentially clones the original session and creates another\
    \ for the second viewer. They are linked; so as one user opens new windows or\
    \ changes anything in one session, the same will happen in the other session,\
    \ but both sessions can have different names and both sessions will appear in\
    \ the list of sessions as two different sessions. This way, if the second viewer\
    \ kills their session (with the tmux command kill-session -t {session name}),\
    \ the first session will continue running.\n\nThis allows the second user that\
    \ connected to go off and do their own thing, creating more windows, using a different\
    \ program, and so on, but without stealing the spotlight and forcing the host\
    \ to watch their every move.\n\nNow in each of our examples, we only showed two\
    \ clients connecting to the same session. However, that could just as easily be\
    \ 3, 13, 37, 359, or more. While there is no stated limit to the number of clients\
    \ that can connect to a session simultaneously, there will be a practical limit\
    \ on throughput and bandwidth and memory at some point. However, tmux does not\
    \ enforce a set limit.\n\n## Summary\n\nWe learned some tricks of using tmux in\
    \ a daily workflow. We learned how it can be used to help created long-lived SSH\
    \ sessions and how it can be used for pair programming with a stop along the way\
    \ to learn about using Vagrant to set up a shareable virtual machine.\n\nIn the\
    \ next chapter, our last, we will discuss how we can use some other third-party\
    \ tools with tmux to make it even more powerful.\n\nA sample usage would be to\
    \ run a command like the following:\n\n```\n$ cat Sonnet16.text | pbcopy\n```\n\
    \nThis command will print out the contents of the Sonnet16.text file and pipe\
    \ them into the pbcopy program, which will then make the contents of that file\
    \ easy to be pasted in OS X in any program with simply ⌘ + v.\n\nThe problem is\
    \ that if you try this trick within a tmux session, it won't work! This is because\
    \ the OS X Pasteboard doesn't play nicely. A short way to explain it is that because\
    \ tmux runs its server as a daemon (which is what allows you to detach then reattach\
    \ with it still running), OS X denies permission for it to access the Pasteboard.\
    \ This is done for security purposes, so other programs running in the background\
    \ are unable to access the Pasteboard. However, programs we'd like to have access\
    \ to the Pasteboard, such as tmux, cannot access it without some tricks.\n\n>\
    \ For the more information, see this lengthy description in README for a utility\
    \ that fixes the issue: https://github.com/ChrisJohnsen/tmux-MacOSX-pasteboard#mac-os-x-pasteboard-access-under-tmux-and-screen.\n\
    \nHowever, since we do want tmux to have access to the OS X Pasteboard, surely\
    \ there must be some way around this security restriction! Thankfully, some smart\
    \ minds have come before us and solved the problem.\n\nIt'll take two steps. First,\
    \ we'll install the small utility program. Second, we'll update our .tmux.conf\
    \ file to launch every new window using this utility.\n\nLet's first install the\
    \ program. If you are a developer, you may already have Homebrew or MacPorts installed.\
    \ (If not, we recommend that you install Homebrew: http://brew.sh)\n\nNow, use\
    \ the following command to install this utility using Homebrew:\n\n```\n$ brew\
    \ install reattach-to-user-namespace\n```\n\nYou can even use the following command\
    \ if you prefer MacPorts:\n\n```\n$ port install tmux-pasteboard\n```\n\nNow,\
    \ add the following lines to your .tmux.conf file:\n\n```\n# Make tmux and OS\
    \ X Pasteboard play nicely\nset-option -g default-command \"reattach-to-user-namespace\
    \ -l zsh\"\n```\n\nHere, `zsh` can be replaced by your shell of choice, so it\
    \ could be `bash`, or `fish`, or any other shell of your choice. By adding these\
    \ lines to your configuration, you are basically telling tmux that any new window\
    \ it launches should launch with that command rather than just a normal new shell.\
    \ This new command is a shell that has been patched to play nicely with the OS\
    \ X Pasteboard so `pbcopy` and `pbpaste` work as intended.\n\nYou may notice that\
    \ this will only work on a system with the `reattach-to-user-namespace` utility\
    \ installed and will cause issues on Linux or another Mac that did not have that\
    \ installed. This can be remedied by using the following formulation instead:\n\
    \n```\nif-shell 'test -x /usr/local/bin/reattach-to-user-namespace' 'set-option\
    \ -g default-command \"reattach-to-user-namespace -l zsh\"'\n```\n\nThis will\
    \ run only on systems that have this `reattach-to-user-namespace` command. The\
    \ `if-shell` bit is a very useful little tmux command that will run the second\
    \ command that follows it, provided the first command that follows it returns\
    \ success. In our case, using the `test -x` command allows us to check and see\
    \ whether the `reattach-to-user-namespace` file exists. If it does, it runs the\
    \ tmux `set-option` to use the fixed item. If not, it runs nothing, so it will\
    \ not break on systems that do not have this script.\n\n## tmux configuration\
    \ from the maximum-awesome project, by Square\n\nWhile we're on the topic of configuration,\
    \ we should discuss the maximum-awesome project, and the configuration files for\
    \ Vim and tmux from the folks at Square. Square specializes in payments and is\
    \ very active in the open source community.\n\nThey have put a ton of thought\
    \ and effort over the years into curating what they consider to be the ideal configuration\
    \ for Vim and tmux and they have it freely available on GitHub: https://github.com/square/maximum-awesome.\n\
    \nBe forewarned, their configuration is rather Vim opinionated, but that caveat\
    \ aside, they have baked up a truly awesome set of configurations.\n\nOur favorite\
    \ thing about these configuration files is that they provide a good set of defaults\
    \ and recently added support for a `.tmux.conf.local` file intended for user overrides\
    \ and custom commands. They are both great drop-in configuration files and great\
    \ sources of inspiration for creating your own configuration.\n\n"
