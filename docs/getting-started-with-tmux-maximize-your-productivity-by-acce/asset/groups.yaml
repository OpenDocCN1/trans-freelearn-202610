    ```\n\nThere could be simpler commands such as changing the prefix key or anything\
    \ else we saw back in *Chapter 2, Configuring tmux* or more powerful as in the\
    \ example where they are loading another configuration file and sucking in all\
    \ of its commands. The following code allows us to change the command used to\
    \ call tmux:\n\n```text\n# Change the command to call tmux. This can be used by\
    \ derivatives/\n# wrappers like byobu.\n# tmux_command: byobu\n```\n\nThis code\
    \ snippet mentions byobu, which is a program that basically sits atop tmux (or\
    \ GNU Screen) and adds additional functionality to them. The idea behind this\
    \ is that if you prefer to use tmuxinator to call some command other than tmux\
    \ that wraps tmux, you can do so using this line.\n\n### Summarizing tmuxinator\n\
    \nIn summary, tmuxinator is an extremely powerful program that adds a lot of useful\
    \ features to tmux and will save any tmux user a lot of time, every time they\
    \ have to relaunch tmux and get all set up with their environment.\n\nNot only\
    \ can it be a huge timesaver, but can also be incredibly helpful for beginners\
    \ as it can act as training wheels until a tmux user has grown accustomed to all\
    \ the nuances of creating windows and panes. As we saw in *Chapter 3, Sessions,\
    \ Windows, and Panes*, creating and manipulating panes can be fairly difficult.\
    \ Having a simple tmuxinator configuration file that can jumpstart that process\
    \ without much effort can be incredibly helpful.\n\n![](img/5969098f450265ac0c7947efcdbe7889_125_0.png)\n"
  mdcn: "\n那么，让我们来试试 maximum-awesome 吧。导航到一个你可以克隆这个仓库的目录。例如，我们就在主目录下操作。输入以下命令开始：\n\
    \n```\n$ cd\n```\n\n然后，用以下命令克隆仓库：\n\n```\n$ git clone https://github.com/square/maximum-awesome.git\n\
    ```\n\n接下来，进入该目录：\n\n```\n$ cd maximum-awesome\n```\n\n运行 rake 命令来安装项目：\n\n```\n\
    $ rake\n```\n\n> 这里，rake 是 Ruby 命令 make 的简称，相当于 Ruby 中的 make。如果你没有安装它，可以通过命令 `gem\
    \ install rake` 来安装。如果你没有安装 gem，请参考 RubyGems 网站上的说明：https://rubygems.org/pages/download。\n\
    \n现在，gems 应该已经安装好了！如果你现在启动 tmux，就会进入 maximum-awesome 的配置环境。\n\n> 另外，需要提醒你的是，加载\
    \ maximum-awesome 可能会覆盖你本地已有的 `.tmux.conf` 文件（因为本质上，它的核心就是一个很棒的 `.tmux.conf` 文件）。所以，在运行这个命令之前，请务必备份好你的\
    \ `.tmux.conf` 文件。\n\n## 使用 tmuxinator 让会话管理更轻松\n\n在第 5 章“深入探索”中，我们在“使用默认配置启动”一节里简单提到了如何用一些默认会话配置来启动\
    \ tmux。\n\n你可能已经注意到，即使是一个相当简单的配置，也可能变得有些复杂和棘手。这正是 tmux 核心功能中不尽如人意的地方之一。\n\n幸运的是，开源社区挺身而出，创建了一个名为\
    \ *tmuxinator* 的优秀工具，让这类配置变得简单得多。\n\ntmuxinator 使用 Ruby 构建，安装容易，功能强大。它允许你使用简单直观的\
    \ YAML 语法来指定窗口的布局方式、启动时要运行的程序等等。tmuxinator 允许你创建在任何窗口配置运行之前执行的钩子，并且让指定一组默认窗口和窗格比在\
    \ tmux 核心功能中要容易得多。\n\n让我们来走一遍安装和创建示例 tmuxinator 配置文件的完整流程。\n\n### 安装 tmuxinator\n\
    \n由于它是用 Ruby 构建的，所以作为 Ruby gem 提供，安装起来非常轻松。在命令行中，直接运行：\n\n```sh\n$ gem install\
    \ tmuxinator\n```\n\n> 根据你的系统设置，可能需要使用 sudo 来安装 gems。我们建议先尝试不用 sudo，如果安装失败再使用\
    \ sudo。\n\ntmuxinator 会在安装过程中友好地提示，它包含一个 `tmuxinator doctor` 命令，可以用来检查你本地的系统配置，确保一切正常。我们建议现在就运行它，并修复它发现的任何问题：\n\
    \n```sh\n$ tmuxinator doctor\n```\n\n当你看到所有项目都确认为 **Yes** 时，就可以继续了。\n\n### 理解\
    \ tmuxinator 配置\n\n首先，打开终端，运行以下命令来创建初始的 tmuxinator 配置文件：\n\n```sh\n$ tmuxinator\
    \ new tutorial\n```\n\n`tmuxinator new` 命令会启动一个新的 tmuxinator 配置文件，我们给它命名为 `tutorial`。当然，你可以随意给你的文件起任何名字。\n\
    \n你将会直接进入你喜欢的编辑器，里面已经包含了 tmuxinator 配置文件的默认内容。关于这个文件，有几点需要注意：\n\n-   它位于 `~/.tmuxinator/<name>.yml`（在我们的例子中是\
    \ `~/.tmuxinator/tutorial.yml`）。这是 tmuxinator 存储所有配置文件的地方。这样很好，因为你可以有多个配置文件，它们都存放在一个地方，并且\
    \ tmuxinator 都可以访问。\n-   在几行之后，有一大堆注释。这些注释表示可以使用的选项，但默认情况下并未启用。我们稍后会深入探讨。\n- \
    \  在文件的底部是实际布置窗口、窗格等的 YAML。tmuxinator 包含了一套默认的布局。\n\ntmuxinator 包含它自己特有的一种领域特定语言，用于构建包含窗口、窗格以及在其中运行的默认程序的丰富配置。\n\
    \n例如，下面是一个示例配置文件。我们在每一行之前添加了以 `#` 开头的有用注释，以描述该行在做什么：\n\n```\n# 设置这个 tmuxinator\
    \ 配置的名称\nname: tutorial\n# 设置根目录，所有新窗格都会从\n# 打开到这个目录的终端开始\nroot: ~/\n\n# 这是窗口规格说明的开始部分\n\
    windows:\n  # 指定第一个名为 \"editor\" 的窗口\n  - editor:\n    # \"editor\" 窗口应该采用垂直布局\n\
    \    layout: main-vertical\n    # 指定 \"editor\" 窗口应该有两个\n    # 窗格\n    panes:\n\
    \      # emacs 应该在一个窗格中运行\n      - emacs\n      # top 应该在另一个窗格中运行\n      - top\n\
    \  # 现在我们有第二个名为 \"server\" 的窗口，它应该在打开时\n  # 运行命令 \"node ~/myapp.js\"\n  - server:\
    \ node ~/myapp.js\n  # 应该有第三个名为 \"logs\" 的窗口，它应该\n  # 启动时运行 tail 命令来查看日志\n  -\
    \ logs: tail -f log/development.log\n```\n\n### 将其他工具与 tmux 结合使用\n\n我们还没有深入讨论过\
    \ socket，因为这会涉及比较专业深入的领域，但第一行允许你指定一个 socket 名称。\n\n默认情况下，当 tmux 首次启动时，会在机器上启动一个服务器，该服务器会创建一个\
    \ socket 并开始监听。然后启动客户端并连接到这个 socket。这在正常使用中都是无缝衔接的。\n\n这个 socket 的持久性使得你可以分离 tmux\
    \ 会话并重新连接。实际上，当你分离时，你终止的是客户端；然而，tmux 服务器会继续运行，监听该 socket 上的传入连接。当你决定重新连接到一个会话时，你就是启动一个客户端并连接到该\
    \ socket。\n\n这个 socket 也是允许多人连接到一个 tmux 会话的原因，正如我们在*第 6 章“tmux 用于 SSH、结对编程等”*中讨论使用\
    \ tmux 进行结对编程时看到的那样。\n\n到目前为止，每当我们运行 tmux 命令进行连接时，都会无缝地连接到那个默认 socket，但你可以启动 tmux\
    \ 并指定你自己的 socket 路径或名称。这样我们就可以在同一台机器上运行多个独立的 tmux 实例。\n\n所以，这个配置选项允许我们在使用 `tmuxinator\
    \ start <name>` 启动时指定 socket 名称。\n\n接下来从 `pre` 命令开始的部分，复制在下面的代码片段中：\n\n```text\n\
    # 在所有操作之前运行。用它来启动守护进程等。\n# pre: sudo /etc/rc.d/mysqld start\n```\n\n正如其名称所示，这部分允许你指定在\
    \ tmuxinator 会话启动时要运行的任何命令。这对于启动那些没有界面但你希望它们在会话期间运行并可用的后台任务非常有用。这很方便，因为它避免了我们不得不打开一个新窗格（或多个窗格）、启动一个程序，然后让它一直挂在那里却又不予理睬的情况。下面的代码片段允许我们为这个\
    \ tmuxinator 实例指定可能不会出现在标准 `.tmux.conf` 文件中的 tmux 选项：\n\n```text\n# 在每个窗口和窗格中、窗口/窗格特定命令之前运行。\n\
    # 对于设置解释器版本很有用。\n# pre_window: rbenv shell 2.0.0-p247\n```\n\n这个命令允许我们在创建的每个窗口或窗格中运行一个命令，而不仅仅是在\
    \ tmux 启动时运行。在下面的命令中，我们传递的是配置文件：\n\n```text\n# 向 tmux 传递命令行选项。对于指定不同的\n# tmux.conf\
    \ 很有用。\n# tmux_options: -f ~/.tmux.mac.conf\n```\n\n可能有一些更简单的命令，比如更改前缀键或我们在*第\
    \ 2 章“配置 tmux”*中看到的任何其他内容，也可能有更强大的命令，比如示例中加载另一个配置文件并吸收其所有命令。下面的代码允许我们更改调用 tmux\
    \ 的命令：\n\n```text\n# 更改调用 tmux 的命令。这可以用于 tmux 的衍生/封装工具，\n# 比如 byobu。\n# tmux_command:\
    \ byobu\n```\n\n这段代码提到了 byobu，它是一个基本上运行在 tmux（或 GNU Screen）之上并为其添加额外功能的程序。这行的理念是，如果你更倾向于使用\
    \ tmuxinator 来调用 tmux 之外的某些封装了 tmux 的其他命令，你可以通过这一行来实现。\n\n### 总结 tmuxinator\n\n\
    总而言之，tmuxinator 是一个非常强大的程序，它为 tmux 添加了许多有用的功能，并且将为任何 tmux 用户节省大量时间，每次他们需要重新启动\
    \ tmux 并设置好环境时都能派上用场。\n\n它不仅能节省大量时间，对于初学者来说也极其有用，它可以充当辅助轮的角色，直到 tmux 用户熟悉了创建窗口和窗格的所有细节。正如我们在*第\
    \ 3 章“会话、窗口和窗格”*中看到的，创建和操作窗格可能相当困难。有一个简单的 tmuxinator 配置文件，可以毫不费力地快速启动这个过程，这将会非常有帮助。\n\
    \n![](img/5969098f450265ac0c7947efcdbe7889_125_0.png)\n\n"
