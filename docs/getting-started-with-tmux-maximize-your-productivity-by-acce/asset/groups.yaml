    # Binding a new prefix key


    We can also rebind the prefix key to make it something more convenient or set
    it up in a way that it doesn’t get into a conflict with other programs.


    Some of you might be from a background where you use GNU screen, another terminal
    multiplexer that uses Ctrl + a as its prefix key. So instead of learning the tmux
    key, you might want to simply rebind Ctrl + a as your tmux prefix key.


    Alternatively, you might be a frequent user of Emacs, nano, or another program
    that makes extensive use of Ctrl + b to move the point back one character. In
    that case, Ctrl + b is not a convenient key to have rebound globally.


    Users in this category may choose to rebind the prefix to something less used
    or less important in Emacs or other programs, such as Ctrl + t. This also conveniently
    helps to provide guidance on the key (t for tmux!).


    Whatever your motives, it is possible to rebind the prefix key. So, as an exercise,
    let’s rebind it to Ctrl + t. If this makes you uncomfortable, feel free to ignore
    it in your own configuration. However, rebinding the prefix key is a bit different
    than rebinding any other key. You might think that the following in your .tmux.conf
    file would work, but that is not the case:


    ```

    bind-key C-t prefix

    ```


    Recall that all of the key bindings within tmux first require the prefix key to
    work. So this code snippet, in plain English, is essentially saying, "After you
    have pressed the prefix key, press Ctrl and t as the prefix key." It is not saying,
    "Here is the new prefix key, please use it."


    So in order to set the prefix key, add the following lines to our ever-growing
    .tmux.conf:


    ```

    # Set the status bar background to blue

    set-option -g status-bg blue

    # Set the status bar text to white

    set-option -g status-fg white

    ```'
