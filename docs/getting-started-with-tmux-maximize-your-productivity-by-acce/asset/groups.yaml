  - '[PAGE 118]


    A sample usage would be to run a command like the following:


    ```

    $ cat Sonnet16.text | pbcopy

    ```


    This command will print out the contents of the Sonnet16.text file and pipe them
    into the pbcopy program, which will then make the contents of that file easy to
    be pasted in OS X in any program with simply ⌘ + v.


    The problem is that if you try this trick within a tmux session, it won''t work!
    This is because the OS X Pasteboard doesn''t play nicely. A short way to explain
    it is that because tmux runs its server as a daemon (which is what allows you
    to detach then reattach with it still running), OS X denies permission for it
    to access the Pasteboard. This is done for security purposes, so other programs
    running in the background are unable to access the Pasteboard. However, programs
    we''d like to have access to the Pasteboard, such as tmux, cannot access it without
    some tricks.


    > For the more information, see this lengthy description in README for a utility
    that fixes the issue: https://github.com/ChrisJohnsen/tmux-MacOSX-pasteboard#mac-os-x-pasteboard-access-under-tmux-and-screen.


    However, since we do want tmux to have access to the OS X Pasteboard, surely there
    must be some way around this security restriction! Thankfully, some smart minds
    have come before us and solved the problem.


    It''ll take two steps. First, we''ll install the small utility program. Second,
    we''ll update our .tmux.conf file to launch every new window using this utility.


    Let''s first install the program. If you are a developer, you may already have
    Homebrew or MacPorts installed. (If not, we recommend that you install Homebrew:
    http://brew.sh)


    Now, use the following command to install this utility using Homebrew:


    ```

    $ brew install reattach-to-user-namespace

    ```


    You can even use the following command if you prefer MacPorts:


    ```

    $ port install tmux-pasteboard

    ```


    Now, add the following lines to your .tmux.conf file:


    ```

    # Make tmux and OS X Pasteboard play nicely

    set-option -g default-command "reattach-to-user-namespace -l zsh"

    ```'
  - '[PAGE 119]


    Here, `zsh` can be replaced by your shell of choice, so it could be `bash`, or
    `fish`, or any other shell of your choice. By adding these lines to your configuration,
    you are basically telling tmux that any new window it launches should launch with
    that command rather than just a normal new shell. This new command is a shell
    that has been patched to play nicely with the OS X Pasteboard so `pbcopy` and
    `pbpaste` work as intended.


    You may notice that this will only work on a system with the `reattach-to-user-namespace`
    utility installed and will cause issues on Linux or another Mac that did not have
    that installed. This can be remedied by using the following formulation instead:


    ```

    if-shell ''test -x /usr/local/bin/reattach-to-user-namespace'' ''set-option -g
    default-command "reattach-to-user-namespace -l zsh"''

    ```


    This will run only on systems that have this `reattach-to-user-namespace` command.
    The `if-shell` bit is a very useful little tmux command that will run the second
    command that follows it, provided the first command that follows it returns success.
    In our case, using the `test -x` command allows us to check and see whether the
    `reattach-to-user-namespace` file exists. If it does, it runs the tmux `set-option`
    to use the fixed item. If not, it runs nothing, so it will not break on systems
    that do not have this script.


    # tmux configuration from the maximum-awesome project, by Square


    While we''re on the topic of configuration, we should discuss the maximum-awesome
    project, and the configuration files for Vim and tmux from the folks at Square.
    Square specializes in payments and is very active in the open source community.


    They have put a ton of thought and effort over the years into curating what they
    consider to be the ideal configuration for Vim and tmux and they have it freely
    available on GitHub: https://github.com/square/maximum-awesome.


    Be forewarned, their configuration is rather Vim opinionated, but that caveat
    aside, they have baked up a truly awesome set of configurations.


    Our favorite thing about these configuration files is that they provide a good
    set of defaults and recently added support for a `.tmux.conf.local` file intended
    for user overrides and custom commands. They are both great drop-in configuration
    files and great sources of inspiration for creating your own configuration.'
