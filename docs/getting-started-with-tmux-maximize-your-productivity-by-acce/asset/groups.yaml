  - '[PAGE 81]


    You''ll also notice that you will soon see the text that wasn''t previously visible.
    That''s right, now you''re scrolling up into the Window history! Of course, you
    can also use Page Down or Ctrl + v (Ctrl + f) to navigate to a page back down.


    You may find that Meta + v won''t work to scroll up in tmux. If you encounter
    this, it is likely due to a configuration setting on your terminal.


    If you are using iTerm2 on a Mac, you have the ability to specify how the terminal
    sends the Option key. To access this, visit Preferences | Profiles | Keys and
    you should see Left option (^) key acts as. Set this to +Esc to have the Option
    key work like Meta, as shown in the following screenshot:


    ![](img/5969098f450265ac0c7947efcdbe7889_81_0.png)


    If you are using Terminal on a Mac, you have the ability to specify how the terminal
    sends the Option key. To access this, visit Preferences | Profiles, pick your
    active profile, select the Keyboard tab, and check the box that says Use Option
    as Meta key.


    For other operating systems, Alt will often work as Meta out of the box.


    You can also jump directly to the top of the Window history with Meta + > (g)
    and go back to the bottom with Meta + < (G).'
  - '[PAGE 82]


    # Jump by search or line


    Often, you know exactly what you''re searching for when you go back through the
    history. When this is true, you can jump by a search term to get to a specific
    line.


    For example, in Copy mode, press Ctrl + r (?). You will see Search Up: appear
    in the lower-left corner, as shown in the following screenshot:


    ![](img/5969098f450265ac0c7947efcdbe7889_82_0.png)


    Type list-keys and then press Enter. You''ll see you jumped directly to the last
    use of the term, list-keys, within the Window history. Try it again and you''ll
    jump back to the time we first entered it.


    If you don''t have an exact search term, you can still jump directly to a line
    number. Simply press g (:) and you''ll be prompted for the line to jump to. This
    is helpful when you don''t know exactly what you may be searching for but would
    like to jump back several pages.


    # Leaving Copy mode


    To drop out of Copy mode and go back to Default mode, simply tap Esc or q and
    you''ll leave Copy mode.


    There are many more keys to navigate to Copy mode, but it would be onerous to
    describe each one of them. However, we''ve seen most, and the rest is available
    on the tmux man page:


    ```

    $ man tmux

    ```


    Alternatively, you can find it with the tmux command list-keys -t emacs-copy or
    list-keys -t vi-copy, based on your chosen key bindings.


    You can view more keys to navigate to Copy mode online at http://man.cx/tmux.'
  - '[PAGE 83]


    # # Copying text into the paste buffer


    Now that we''ve gotten a taste of navigating around in Copy mode, let''s put it
    to use.


    Copy mode doesn''t exist just to have a Window history that you can scroll through,
    but also to have a way to copy text from the past and reuse it.


    Enter Copy mode by pressing `<Prefix>, [` and scroll around until you find some
    text that is of interest. Once you find something you''d like to copy, make sure
    the cursor is at the start of where you''d like to copy and press `Ctrl + Space
    bar` (Space bar). This sets the start point of the selection.


    Now move the cursor around using the same keys as provided earlier, and you''ll
    see the selection is highlighted and grows as you move away from the start of
    the selection. The area you select will have a different background color as the
    area is highlighted. See the following screenshot, which is an example of this:


    ![](img/5969098f450265ac0c7947efcdbe7889_83_0.png)


    When you are satisfied with your selection, simply press `Meta + w (Enter)` to
    copy the text and you will leave Copy mode immediately and will be scrolled back
    to where you were. The text you selected will be copied and added to your paste
    buffer (more on this soon).


    A few things to note are as follows:


    +   - This is set up to model Emacs (or vi) almost identically in terms of key
    commands to navigate, copy, and so on. Things should feel rather familiar to you
    if you use Emacs or vi. If you aren''t familiar with either, things may seem a
    bit foreign and will take some time getting used to.

    +   - Note the copy operation is always nondestructive in tmux. You have copied
    the text out of the Window history but have not altered the Window history at
    all. So, you can go back and copy the same text again and again without disturbing
    the history.'
  - '[PAGE 84]


    +   - If you have tried copying text from multiple lines, you might have noticed
    the selection-wrapped lines. You can toggle it as a rectangle by pressing R (v)
    at any time in Copy mode before or after you start the selection. This is shown
    in the following screenshot:


    ![](img/5969098f450265ac0c7947efcdbe7889_84_0.png)


    +   - You can also grab all of the text to the right of your cursor or to the
    end of a single line of text, much like the kill line in Emacs, with the Ctrl
    + k keyboard command. Again, tmux''s Copy mode is nondestructive, so this won''t
    actually kill the line as it would in Emacs but will copy it to the paste buffer.


    # Interacting with the paste buffer


    The paste buffer is a holding bucket for all of the text you will copy, which
    you will then be able to access later to paste onto any pane.


    It is actually a stack, so each item copied from Copy mode is added at the top
    of the stack, and every new item is added at the top with every other item moved
    down by one. Each item in the paste buffer is assigned a number based on the order
    in which it went into the stack.


    # Pasting text from the paste buffer


    Now that you''ve grabbed some text, you want to pull it from the paste buffer
    to get it back.


    In any program that runs within tmux, move your cursor to the point where you
    want the text to be pasted and press <Prefix>, ].


    For example, let''s fire up nano:


    ```

    $ nano

    ```


    Once we do this, paste what we last copied with <Prefix>, ].'
  - '[PAGE 85]


    Sure enough, our text appears! Notice the nice symmetry, where you use <Prefix>,
    [ to enter Copy mode, and <Prefix>, ] to paste the text.


    Now <Prefix>, ] is nice to paste the most recently copied bit of text, but what
    about more complex situations such as copying two items and then pasting two items?
    Don''t worry, tmux has it covered!


    # Choosing items from the paste buffer


    The paste buffer is not just a single blob of text holding the last thing you
    copied; it is actually a stack of all the previously copied items. You can access
    this and paste from it in any order.


    To access this list, simply press <Prefix>, =. This will bring up an interactive
    list of the last things you previously copied, as shown in the following screenshot,
    and you can simply highlight one and hit Enter to paste it:


    ![](img/5969098f450265ac0c7947efcdbe7889_85_0.png)


    By default, each time you copy it, it will be added to the paste buffer stack.
    Interestingly though, by default, when you pull an item out of the paste buffer,
    it will not pop the latest copied item out of the cache.


    The command <Prefix>, ] just quickly grabs and pastes from the top of the stack
    in (0).


    # Working with the paste buffer


    There are also a handful of other useful things we can do when working with the
    paste buffer.


    You can optionally set a limit for the number of items to store in this stack
    by setting the buffer-limit option to a number in your tmux configuration. This
    can be useful if you only want, say, the last five items you copied in a paste
    buffer for security reasons.'
  - '[PAGE 86]


    You can also list paste buffers non-interactively by pressing <Prefix>, : (list-buffers)
    and Enter, which will display all the buffers in a list that you can scroll through.
    Notice how each buffer has an index, which is a number, followed by the size of
    that buffer. Press q (Esc) to dismiss this list.


    This buffer index can be used in a few different operations. It can be used to
    delete a buffer, to copy a buffer to another session, to load a buffer at a particular
    index, to set the contents in a particular buffer, to write a buffer to a file,
    and much more. It is a bit outside the scope of this book to cover all the things
    that can be done with buffers, but we will revisit a few very useful tasks in
    Chapter 5, Diving Deeper.


    As in prior chapters, there is a full key binding and command reference in the
    appendix with all of the keys and commands we learned in this chapter handy, all
    in one place.


    # Summary


    In this chapter, we learned a lot about manipulating text, starting from understanding
    the Window history to learning about the two different modes in tmux to scroll
    up through the Window history. We then moved on to jumping by search or line,
    copying text into a paste buffer, using Copy mode to copy text. We finished by
    discussing how to paste items from the paste buffer to the underlying window,
    how to view the whole paste buffer stack, and how to limit the number of items
    stored in the paste buffer.


    In the next chapter, we will get to some more advanced usage topics, including
    a deeper understanding of the paste buffer, a bit more on sessions and windows,
    and an opportunity to get a taste of launching tmux with defaults.'
