    \nPackt，发音为'packed'，于 2004 年 4 月出版了其第一本书《精通 phpMyAdmin，实现高效的 MySQL 管理》，此后继续专注于出版针对特定技术和解决方案的高度聚焦的书籍。\n\
    \n我们的书籍和出版物分享了您的 IT 同行在适配和定制当今系统、应用程序和框架方面的经验。我们基于解决方案的书籍赋予您定制软件和技术以完成工作的知识与能力。Packt\
    \ 的书籍比您过去所见的 IT 书籍更加具体，而非泛泛而谈。我们独特的商业模式使我们能够为您带来更聚焦的信息，让您获得更多需要了解的内容，减少不必要的信息。\n\
    \nPackt 是一家现代且独特的出版公司，专注于为开发者、管理员和初学者等各类人群制作高质量、前沿的书籍。如需更多信息，请访问我们的网站：www.packtpub.com。\n\
    \n## 关于 Packt Open Source\n\n2010 年，Packt 推出了两个新品牌——Packt Open Source 和 Packt\
    \ Enterprise，以继续其专业化聚焦。本书属于 Packt Open Source 品牌，该品牌出版围绕开源许可证构建的软件相关书籍，为从高级开发者到初出茅庐的网页设计师等各类人群提供信息。Open\
