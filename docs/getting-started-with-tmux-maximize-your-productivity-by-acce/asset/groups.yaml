    \ 上的作者指南。\n\n不过，你应该注意到现在终端窗口底部有一条栏。这可以在以下终端窗口的屏幕截图中看到：\n\n![](img/5969098f450265ac0c7947efcdbe7889_22_0.png)\n\
    \n恭喜！你现在正在运行 tmux。\n\n底部那条栏由 tmux 提供。我们称这条栏为状态行。状态行会提供有关你当前查看的会话和窗口的信息，以及此会话中还有哪些其他窗口可用等信息。\n\
    \n其中一些内容现在可能看起来像乱码，但随着我们在本書的进展，我们将了解更多关于这些内容含义的信息。我们还将学习如何自定义状态栏，以确保它始终显示对你的工作流程最有用的项目。这些自定义包括\
    \ tmux 本身的一部分内容（如时间、日期、你连接的服务器等）或第三方库中的内容（如笔记本电脑的电池电量、当前天气或未读邮件数量）。\n\n## 会话\n\
    \n通过不带任何参数运行 tmux，你会创建一个全新的会话。在 tmux 中，基本单元称为会话。一个会话可以有一个或多个窗口。一个窗口可以被拆分为一个或多个窗格。我们将在专门的章节中重新讨论这个主题（有关更多信息，请参阅第\
    \ 3 章，会话、窗口和窗格）；不过，作为一个预告，我们当前屏幕上显示的是一个会话中一个窗口占据整个窗口的单个窗格。想象一下，它可以被拆分为两个或多个不同的终端，每个终端运行不同的程序，每个终端的可视分割就是一个窗格。有关此内容的更多信息将在后面的章节中介绍。\n\
    \n### tmux 中的会话是什么？\n\n将 tmux 会话视为你计算机上的登录会话可能很有用。你可以登录计算机，从而启动一个新的会话。登录后输入用户名和密码，你会到达一个空的桌面。这类似于一个全新的\
    \ tmux 会话。你可以在此会话中运行一个或多个程序，每个程序都有自己的窗口或窗口，每个窗口都有自己的状态。\n\n在大多数操作系统中，你可以注销、重新登录并返回到同一个会话，窗口与你离开时完全相同。通常，你在注销时打开的一些程序仍会在后台继续运行，即使它们的窗口不再可见。\n\
    \ntmux 中的会话以非常相似的方式工作。因此，将 tmux 视为一个迷你操作系统是有用的，它在会话内管理运行的程序、窗口等。\n\n![](img/5969098f450265ac0c7947efcdbe7889_23_0.png)\n\
    \n你可以同时运行多个会话。如果你希望为正在处理的每个任务设置一个会话，这很方便。你可能有一个用于独自开发的应用程序的会话，另一个用于结对编程。或者，你可能有一个用于开发一个应用程序，另一个用于开发另一个应用程序。这样一切都可以井井有条、干净且分开。\n\
    \n### 为会话命名\n\n每个会话都有一个你可以设置或更改的名称。注意状态栏最左侧的 [0]？ 这是会话名称，用括号括起来。这里，由于你只是不带任何参数启动了\
    \ tmux，它被命名为 0。然而，这不是一个很有用的名称，所以让我们更改它。\n\n在提示符下，只需运行以下命令：\n\n```\n$ tmux rename-session\
    \ tutorial\n```\n\n### 立即上手\n\n这告诉 tmux 你想要重命名当前会话，而 tutorial 是你希望它具有的名称。当然，你可以随意命名。你应该会看到状态栏已更新，因此现在左侧不再是\
    \ [0]，而应显示 [tutorial]。\n\n![](img/5969098f450265ac0c7947efcdbe7889_24_0.png)\n\
    \n当然，很好的是状态栏现在有一个我们定义的有趣名称而不是 0，但它提供的实用功能远不止于此，我们稍后会看到！\n\n值得注意的是，这里我们为会话命名，但此相同命令也可以用于重命名现有会话。\n\
    \n### 窗口字符串\n\n状态栏有一个字符串代表每个窗口，以告知我们当前正在运行的内容。以下步骤将帮助我们进一步探索这一点：\n\n1. 让我们启动一个文本编辑器来假装我们在进行编码：\n\
    \n   ```bash\n   $ nano test\n   ```\n\n2. 现在在其中输入一些内容来模拟在一些代码上非常努力地工作：\n\n![](img/5969098f450265ac0c7947efcdbe7889_24_1.png)\n\
    \n"
