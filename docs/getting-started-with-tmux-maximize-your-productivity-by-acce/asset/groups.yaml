    ## 修改状态栏的背景颜色


    让我们在配置中添加一项，用来改变状态栏的颜色。通过前面的快速上手，我们看到状态栏的默认颜色是某种绿色。注意，我们的配置中恰好也有一种绿色，但在你的终端上很可能显示为不同的颜色，除非你使用的配色方案与我们相同。


    > 作者使用的配色方案叫做 Solarized。这是一套包含深色和浅色两种变体的配色方案，专为终端和可读性优化。它由 Ethan Schoonover 开发，因其精确性、对称性，以及能让几乎任何代码看起来都相当漂亮，在技术社区中获得了不少追随者。更多信息请访问
    http://ethanschoonover.com/solarized。


    我们当前终端的配色方案如下面的截图所示：


    ![](img/5969098f450265ac0c7947efcdbe7889_43_0.png)


    哎呀！在我们当前的配色方案下，这看起来相当难看。


    假设我们希望它变成一种更好看的蓝色。打开你喜欢的文本编辑器，编辑 `~/.tmux.conf`，添加下面这一行：


    ```

    set-option -g status-bg blue

    ```


    这一行指定我们希望状态栏为蓝色，而不是默认颜色（在我们的系统上默认恰好是绿色）。


    你应该会看到状态栏立即变成蓝色（同样，这取决于你的 shell 和终端程序对颜色的支持能力）。


    注意，我们做的只是把写入配置文件的那段文本，在 tmux 后面输入一遍，然后就搞定了。


    回想一下，像这样在 shell 中运行的任何命令都只是临时的，所以我们仍然需要配置文件；不过，这是一种快速测试某个命令是否能按预期工作的好方法。


    ## 重新加载配置


    现在，我们有了一个全新的配置文件，里面包含改变状态栏颜色的新命令，但在我们重新加载配置、让 tmux 从新文件中加载命令之前，这个配置是没有用的。


    保存配置文件后，它已经准备好生效了，但是看，你的状态栏仍然是绿色的！我们如何告诉 tmux 去获取最新的配置并重新加载窗口以使用该配置呢？有两种方法可以告诉
    tmux 重新加载配置。


    第一种是彻底终止所有会话，然后重新启动 tmux。这不是一个很吸引人的选项，因为它需要关闭我们所有的 tmux 会话，这也就意味着要关闭所有当前打开并运行的程序。然后，我们必须重新启动所有的
    tmux 会话和窗口，并重启所有程序，才能回到之前的状态——仅仅是为了重新加载配置。这样做可行，但总体而言是个相当混乱的解决方案。一般来说，tmux 在重启时会加载新的配置文件，这是相当不错的，因为这意味着之后任何
    tmux 启动都会使用我们最新的配置，这很合理。然而，这迫使我们关闭所有正在运行的应用来加载它，这并不理想。


    第二种更常见也更有用的方法是使用 `tmux source-file` 命令。这个命令会告诉 tmux 去获取最新的配置并立即加载。在这种情况下，无需离开
    tmux！


    在 tmux 中进入命令行提示符（如果你跟着第 1 章“直接上手”操作过，你会知道只需按下 <Prefix>, 2 就能调出我们留在那里的命令提示符）。如果当前没有打开的窗口，只需在
    tmux 中打开一个新窗口（<Prefix>, c），默认就会以命令提示符启动。现在在提示符中输入以下命令并按回车：


    ```

    $ tmux source-file ~/.tmux.conf

    ```


    和下面的截图类似，你应该会看到状态栏现在是蓝色的了！


    ![](img/5969098f450265ac0c7947efcdbe7889_46_0.png)


    ## 修改状态栏的前景颜色


    现在蓝色状态栏看起来不错！不过文字有点难以阅读；背景和文字之间的对比度不够。让我们来修复这个问题！


    再次打开 `.tmux.conf` 文件，这次添加第二行：


    ```

    set-option -g status-bg blue

    set-option -g status-fg white

    ```


    使用我们之前讨论的方法，用 `source-file` 命令重新加载配置。现在，如下面的截图所示，状态栏上的文字应该更容易阅读了！


    ![](img/5969098f450265ac0c7947efcdbe7889_46_1.png)


    ## 高亮当前活动窗口


    让我们更容易看出哪个是当前活动窗口。星号也能起到作用，但既然我们有这些颜色，也许可以更直观一些。


    再次打开 `.tmux.conf` 文件，这次添加第三行：


    ```

    set-option -g status-bg blue

    set-option -g status-fg white

    set-window-option -g window-status-current-bg magenta

    ```


