  - '[PAGE 72]


    # Sessions, Windows, and Panes


    It''s also possible to be a bit fine-grained with it, changing the size in steps
    of one cell at a time. Simply press <Prefix>, Ctrl and the arrow key. However,
    this will move in much smaller increments and will also conflict with the command
    to switch between spaces on OS X.


    If you have followed along with *Chapter 2, Configuring tmux*, and turned on the
    mode-mouse option along with the mouse-select-pane and mouse-resize-pane options,
    you can also use your mouse to select the active pane. You can do this by just
    clicking on the active pane and resizing the panes by clicking and dragging them
    on to the active pane. While this has the downside of reaching for your mouse,
    it can be the easiest way to rapidly arrive at a desired pane configuration.


    # Switching between panes by number


    Now that we have so many panes, switching between them can get a bit unwieldy.
    The arrow keys are pretty nice but can still be a tad annoying. Thankfully, there
    is an easier way. Press <Prefix>, q and you will see a number appear in each pane
    and then disappear shortly thereafter.


    The currently active pane will be of a different color than the other panes. This
    will also show the dimensions of each pane.


    Just as each window was assigned a unique number, so also each pane is assigned
    with a unique number in every window. If you press <Prefix>, q again and, before
    the numbers disappear, type the number that appears in that pane, you''ll automatically
    switch to it.


    By default, the duration for these numbers to remain on the screen is 1 second,
    but you can change that by adding the following option to your .tmux.conf file:


    ```

    set-option -g display-panes-time 3000

    ```


    This will extend the time that the pane numbers are displayed on screen to 3000
    ms or 3 seconds, allowing you more time to select a pane by its index.


    So, to jump to the pane with the word Apple typed in it, simply press <Prefix>,
    q, and 1. It does not matter which pane you were in previously since this pane
    is given an index of 1; using that key combo will jump to that pane.


    # Cycling through pane layouts


    tmux provides us with a few different ways to change the pane layout automatically
    so you don''t have to meticulously split and resize in odd ways to get to your
    desired result.'
  md: "\nA window and a pane are perfect analogies to their real-world counterparts.\
    \ Check out the different physical, real-world windows, and you will find that\
    \ many of them are nicely divided into multiple panes.\n\n> One nice benefit of\
    \ panes in tmux over panes in the real world is that they are easy to create,\
    \ destroy, and resize based on your needs. You cannot do that with panes on most\
    \ physical windows.\n\n## Playing around with sessions, windows, and panes\n\n\
    So now that we have a high-level understanding, let's take a little tour of sessions,\
    \ windows, and panes. Let's start totally fresh with a new terminal window and\
    \ no existing tmux sessions. Start by creating a session named work:\n\n```\n\
    $ tmux new-session -s work\n```\n\nYou'll see a new session started with the name\
    \ work. This session, currently, has a single window with a single pane.\n\nLet's\
    \ create another window. Recall that this is done by pressing <Prefix>, c (c for\
    \ create). Now you have one session, two windows, and two panes. Each window has\
    \ a single pane, as shown in the following screenshot:\n\n![](img/5969098f450265ac0c7947efcdbe7889_66_0.png)\n\
    \n## Multiple sessions\n\nNow let's see what it's like working with more than\
    \ one session. Let's first detach the current session. Recall that in order to\
    \ do so, we'll press <Prefix>, d (d for detach).\n\nNow that the work session\
    \ is detached, we are back at a command line, and your screen should be similar\
    \ to the next screenshot. Instead of reattaching the work session, let's create\
    \ a new session and call this session play:\n\n```\n$ tmux new-session -s play\n\
    ```\n\n![](img/5969098f450265ac0c7947efcdbe7889_67_0.png)\n\nNow it looks like\
    \ we have an entirely different session. We have a different status bar with the\
    \ session name [play] in the bottom-left corner rather than [work].\n\nNow to\
    \ switch back to the work session, we could detach the play session, arrive back\
    \ at a tmux-less terminal and then reattach the session, this time with the work\
    \ session as the target; however, there is actually an easier way.\n\nSimply press\
    \ <Prefix>, s (select the session interactively); this will bring up a dialog\
    \ where we can take our pick about which session to attach. So, we didn't even\
    \ need to leave the session we were in to switch to the other one. Use the arrow\
    \ keys to highlight the session you want, or just tap the number associated with\
    \ that session to switch.\n\nTry switching to the other session, then back again,\
    \ but wait, there is an even easier way. Simply use <Prefix>, ) (next session)\
    \ and <Prefix>, ( (previous session) to cycle around between the sessions. You'll\
    \ see it's very easy to switch between sessions. We'll skip switching between\
    \ multiple windows since you already know how to do that from the first chapter;\
    \ let's move right on to multiple panes.\n\n## Multiple panes\n\nNow let's break\
    \ this window into two panes. Type <Prefix>, % (split the window vertically) and\
    \ see how the window is now divided down the middle by vertical bars; we now have\
    \ another command prompt. This is the second pane, as can be seen in the following\
    \ screenshot:\n\n![](img/5969098f450265ac0c7947efcdbe7889_68_0.png)\n\nNow we\
    \ have two sessions, three windows, and four panes. One session, one window, and\
    \ one pane make up the play session (which is no longer visible but humming along\
    \ in the background), while one session, two windows, and three panes make up\
    \ the work session we saw in the previous screenshot.\n\nLet's play around with\
    \ panes a bit. First, try typing in some text. You'll see the cursor is in the\
    \ right pane. To get it to the left pane, simply press <Prefix>, o (o for other).\
    \ Now your cursor is in the other pane. Type some stuff to verify which pane the\
    \ cursor is in.\n\nThere is actually a better way to tell which pane has the cursor\
    \ than typing in random stuff. It may be tough to tell from the previous screenshot;\
    \ however, when a window is split into two vertically, the top half of the vertical\
    \ bars that split the two windows will be colored when the cursor is in the left\
    \ pane, and the bottom half will be colored when the cursor is in the right pane.\
    \ In the previous screenshot, the bottom half is colored in green to indicate\
    \ that the cursor is in the right pane. When there are more than two panes, tmux\
    \ tries different schemes to let us know which pane is active, as we soon shall\
    \ see.\n\nYou can also use <Prefix> and the right arrow key, <Prefix> and the\
    \ left arrow key, <Prefix> and the down arrow key, or <Prefix> and the up arrow\
    \ key to move the cursor to the pane to the right, left, down, or up, which is\
    \ a bit easier to remember and also more useful when we have a more complex pane\
    \ structure.\n\n## Working with more panes\n\nNow <Prefix>, % (split the pane\
    \ vertically) is not the only way to create panes. This simply splits the current\
    \ pane into two smaller ones by splitting it vertically. If you actually do it\
    \ again, it'll split the current pane in half again with another vertical line,\
    \ as shown in the following screenshot:\n\n![](img/5969098f450265ac0c7947efcdbe7889_69_0.png)\n\
    \nThis is rather silly and scrunched though. First, let's kill that pane and then\
    \ try to split it vertically. To kill the new pane we created, we can either terminate\
    \ the running program in that pane, in this case, typing exit and pressing Enter\
    \ as this will end the shell process. Alternatively, we can press <Prefix>, x\
    \ (kill pane) to be prompted whether to kill that pane or not.\n\n> Note that\
    \ killing a pane with a running process will terminate that process immediately\
    \ without gracefully ending it, so you will lose any existing data in that pane.\
    \ Be careful!\n\nConfirm with y, and you're back to two panes. Note that when\
    \ a pane is removed, things are automatically resized appropriately. Let's try\
    \ to split the left pane horizontally. In order to do this, type <Prefix>, \"\
    \ (split the pane horizontally), as shown in the following screenshot:\n\n![](img/5969098f450265ac0c7947efcdbe7889_69_1.png)\n\
    \n![](img/5969098f450265ac0c7947efcdbe7889_71_0.png)\n\nLet's try resizing the\
    \ panes by some decent increments. Get the cursor over to the Date window, either\
    \ using <Prefix>, arrow keys or <Prefix>, o.\n\nNow to resize it, let's try <Prefix>,\
    \ Meta and the right arrow key. You should see the rightmost pane get a bit smaller.\
    \ Try it again and it gets even smaller. Try <Prefix>, Meta and the left arrow\
    \ key, and you should see the rightmost pane get a bit larger.\n\n> If you look\
    \ at your keyboard and see no Meta key, you are not missing anything; it does\
    \ not exist on most keyboards.\n> \n> Meta is a key often used in terminal programs\
    \ that historically had a place on the keyboard, but no longer.\n> \n> Both iTerm\
    \ and the stock terminal program on Mac have the choice to use the Option key\
    \ as Meta. Other operating systems often have some way of using the Alt key as\
    \ Meta.\n> \n> Though this may seem confusing, we use Meta in this book because\
    \ that is the way it is referred to historically, and more importantly, because\
    \ this is the key referred to in the tmux documentation.\n\nThankfully, you don't\
    \ actually have to type the prefix key every time you want to resize it a little\
    \ bit; as soon as you start resizing, you can just type the command to increase\
    \ or decrease over and over without the prefix key. So start by using <Prefix>,\
    \ Meta and the right arrow key, then you should be able to change the panes by\
    \ holding down the Meta key and by pressing the left arrow key, the right arrow\
    \ key, or the left arrow key. You will see the panes expand and contract without\
    \ having to stop and type the prefix key each time.\n\nThis is one way to change\
    \ the size of a pane. This is actually changing it in steps of five cells at a\
    \ time (each cell being basically the space of one mono-spaced character).\n\n\
    ## Sessions, Windows, and Panes\n\nIt's also possible to be a bit fine-grained\
    \ with it, changing the size in steps of one cell at a time. Simply press <Prefix>,\
    \ Ctrl and the arrow key. However, this will move in much smaller increments and\
    \ will also conflict with the command to switch between spaces on OS X.\n\nIf\
    \ you have followed along with *Chapter 2, Configuring tmux*, and turned on the\
    \ mode-mouse option along with the mouse-select-pane and mouse-resize-pane options,\
    \ you can also use your mouse to select the active pane. You can do this by just\
    \ clicking on the active pane and resizing the panes by clicking and dragging\
    \ them on to the active pane. While this has the downside of reaching for your\
    \ mouse, it can be the easiest way to rapidly arrive at a desired pane configuration.\n\
    \n## Switching between panes by number\n\nNow that we have so many panes, switching\
    \ between them can get a bit unwieldy. The arrow keys are pretty nice but can\
    \ still be a tad annoying. Thankfully, there is an easier way. Press <Prefix>,\
    \ q and you will see a number appear in each pane and then disappear shortly thereafter.\n\
    \nThe currently active pane will be of a different color than the other panes.\
    \ This will also show the dimensions of each pane.\n\nJust as each window was\
    \ assigned a unique number, so also each pane is assigned with a unique number\
    \ in every window. If you press <Prefix>, q again and, before the numbers disappear,\
    \ type the number that appears in that pane, you'll automatically switch to it.\n\
    \nBy default, the duration for these numbers to remain on the screen is 1 second,\
    \ but you can change that by adding the following option to your .tmux.conf file:\n\
    \n```\nset-option -g display-panes-time 3000\n```\n\nThis will extend the time\
    \ that the pane numbers are displayed on screen to 3000 ms or 3 seconds, allowing\
    \ you more time to select a pane by its index.\n\nSo, to jump to the pane with\
    \ the word Apple typed in it, simply press <Prefix>, q, and 1. It does not matter\
    \ which pane you were in previously since this pane is given an index of 1; using\
    \ that key combo will jump to that pane.\n\n## Cycling through pane layouts\n\n\
    tmux provides us with a few different ways to change the pane layout automatically\
    \ so you don't have to meticulously split and resize in odd ways to get to your\
    \ desired result.\n"
  mdcn: '

    窗口（window）和窗格（pane）与它们对应的现实世界事物是非常完美的类比。看一看各种不同的现实世界中的物理窗户，你会发现其中许多都被整齐地分割成多个窗格。


    > tmux 中的窗格相较于现实世界窗户上的窗格，一个很大的好处在于：它们可以根据你的需求轻松地创建、销毁和调整大小。而大多数物理窗户上的窗格可做不到这一点。


    ## 动手体验会话、窗口和窗格


    现在我们已经有了一个高层面的理解，接下来就稍微逛一逛会话、窗口和窗格。让我们从一个全新的终端窗口、没有任何现有 tmux 会话的状态开始。先创建一个名为 work
    的会话：


    ```

    $ tmux new-session -s work

    ```


    你会看到一个名为 work 的新会话启动。这个会话当前只有一个窗口，窗口中只有一个窗格。


    让我们再创建一个窗口。回想一下，这可以通过按下 <Prefix>, c（c 代表 create/创建）来完成。现在你有一个会话、两个窗口和两个窗格。每个窗口都只有一个窗格，如下面的截图所示：


    ![](img/5969098f450265ac0c7947efcdbe7889_66_0.png)


    ## 多个会话


    现在让我们看看同时使用多个会话是什么感觉。首先分离当前会话。回想一下，要做到这一点，我们需要按下 <Prefix>, d（d 代表 detach/分离）。


    现在 work 会话已被分离，我们回到了命令行提示符，你的屏幕应该与下一张截图类似。我们不要重新附加 work 会话，而是创建一个新会话，并将其命名为 play：


    ```

    $ tmux new-session -s play

    ```


    ![](img/5969098f450265ac0c7947efcdbe7889_67_0.png)


    现在看起来我们有了一个完全不同的会话。我们的状态栏也不一样了，左下角显示的是会话名称 [play]，而不是 [work]。


    现在要切回 work 会话，我们可以分离 play 会话，回到一个没有 tmux 的终端，然后重新附加会话，这次以 work 会话为目标；不过实际上还有一种更简单的方法。


    只需按下 <Prefix>, s（以交互方式选择会话），就会弹出一个对话框，我们可以从中选择要附加到哪个会话。所以，我们甚至不需要离开当前所在的会话就能切换到另一个会话。使用方向键高亮你想要的会话，或者直接点击与该会话对应的数字即可切换。


    试着切换到另一个会话，再切回来，但等等，还有一种更简单的方法。只需使用 <Prefix>, )（下一个会话）和 <Prefix>, (（上一个会话）在会话之间循环切换。你会发现切换会话非常容易。这里我们跳过多个窗口之间的切换，因为你已经从第一章知道了如何操作；让我们直接进入多个窗格的部分。


    ## 多个窗格


    现在让我们把这个窗口拆分成两个窗格。输入 <Prefix>, %（垂直分割窗口），可以看到窗口现在被垂直分隔线从中间分开了；我们有了另一个命令提示符。这就是第二个窗格，如下面的截图所示：


    ![](img/5969098f450265ac0c7947efcdbe7889_68_0.png)


    现在我们有两个会话、三个窗口和四个窗格。一个会话、一个窗口和一个窗格构成 play 会话（它现在不可见，但在后台正常运行），而一个会话、两个窗口和三个窗格构成我们在上一张截图中看到的
    work 会话。


    让我们稍微摆弄一下窗格。首先，试着输入一些文本。你会看到光标在右侧窗格中。要让它移动到左侧窗格，只需按下 <Prefix>, o（o 代表 other/其他）。现在你的光标就在另一个窗格中了。输入一些内容来确认光标在哪个窗格中。


    实际上，有一种比输入随机内容更好的方法来判断光标在哪个窗格中。从之前的截图中可能很难分辨；然而，当一个窗口被垂直分割成两部分时，如果光标在左侧窗格中，分割这两个窗格的垂直分隔线的上半部分会着色；如果光标在右侧窗格中，下半部分会着色。在之前的截图中，下半部分以绿色显示，表示光标在右侧窗格中。当窗格超过两个时，tmux
    会尝试不同的方案让我们知道哪个窗格处于活动状态，我们很快会看到。


    你也可以使用 <Prefix> 加右方向键、<Prefix> 加左方向键、<Prefix> 加下方向键或 <Prefix> 加上方向键，将光标移动到右侧、左侧、下方或上方的窗格。这样更容易记住，并且在窗格结构更复杂时也更有用。


    ## 使用更多窗格


    现在，<Prefix>, %（垂直分割窗格）并不是创建窗格的唯一方式。它只是将当前窗格垂直分割成两个较小的窗格。如果你再执行一次，它会用另一条垂直分隔线将当前窗格再一分为二，如下面的截图所示：


    ![](img/5969098f450265ac0c7947efcdbe7889_69_0.png)


    不过这看起来有点愚蠢和拥挤。首先，让我们杀掉那个窗格，然后尝试垂直分割。要杀掉我们创建的新窗格，我们可以终止该窗格中正在运行的程序——在这种情况下，输入 exit
    并按下回车，因为这会结束 shell 进程。或者，我们可以按下 <Prefix>, x（杀死窗格），然后会被询问是否要杀死该窗格。


    > 注意，杀死一个正在运行进程的窗格会立即终止该进程，而不会优雅地结束它，因此你将会丢失该窗格中的任何现有数据。请务必小心！


    确认 y，你就回到了两个窗格的状态。注意，当一个窗格被移除时，周边内容会自动调整到合适的大小。让我们尝试水平分割左侧窗格。为此，输入 <Prefix>, "（水平分割窗格），如下面的截图所示：


    ![](img/5969098f450265ac0c7947efcdbe7889_69_1.png)


    ![](img/5969098f450265ac0c7947efcdbe7889_71_0.png)


    让我们尝试用合理的增量来调整窗格大小。使用 <Prefix>、方向键或 <Prefix>, o 将光标移到 Date 窗口上。


    现在要调整它的大小，让我们试试 <Prefix>, Meta 加右方向键。你应该会看到最右侧的窗格变小了一点。再试一次，它会变得更小。再试试 <Prefix>,
    Meta 加左方向键，你应该会看到最右侧的窗格变大了一点。


    > 如果你看看自己的键盘，发现没有 Meta 键，你并没有错过什么；大多数键盘上都没有这个键。

    >

    > Meta 是终端程序中经常使用的一个键，在历史上它曾在键盘上占有一席之地，但现在不再有了。

    >

    > iTerm 和 Mac 自带的终端程序都可以选择将 Option 键用作 Meta。其他操作系统通常也有某种方式将 Alt 键用作 Meta。

    >

    > 尽管这可能让人困惑，但本书中使用 Meta 是因为这是历史沿用的称呼，更重要的是，因为这是 tmux 文档中所指的键。


    谢天谢地，你不需要每次想稍微调整大小时都输入前缀键；一旦你开始调整大小，就可以不带前缀键一遍又一遍地输入增大或缩小的命令。所以先用 <Prefix>, Meta
    加右方向键，然后你应该可以按住 Meta 键并按左方向键、右方向键或左方向键来改变窗格大小。你会看到窗格不断扩展和收缩，而不必每次都停下来输入前缀键。


    这是改变窗格大小的一种方式。实际上，这每次以五个单元格为单位进行调整（每个单元格基本上就是一个等宽字符所占的空间）。


    ## 会话、窗口和窗格


    我们还可以更精细地调整，每次以一个单元格为单位改变大小。只需按下 <Prefix>, Ctrl 加方向键。不过，这样移动的增量要小得多，而且在 OS X 上会与切换空间（Space）的命令冲突。


    如果你已经跟着*第 2 章 配置 tmux*操作过，并且开启了 mode-mouse 选项，以及 mouse-select-pane 和 mouse-resize-pane
    选项，那么你也可以使用鼠标来选择活动窗格。只需点击活动窗格即可完成选择，还可以通过点击并拖拽来调整窗格大小，使其变为活动窗格。虽然这样做的缺点是不得不伸手去拿鼠标，但这可能是快速达到所需窗格布局的最简单方法。


    ## 按编号在窗格之间切换


    既然我们有了这么多窗格，在它们之间切换可能会有点笨重。方向键很不错，但可能还是有点烦人。谢天谢地，有一种更简单的方法。按下 <Prefix>, q，你会看到每个窗格中都会出现一个数字，然后很快就会消失。


    当前活动的窗格会以不同于其他窗格的颜色显示。这还会显示每个窗格的尺寸。


    就像每个窗口都被分配了一个唯一编号一样，每个窗格在每个窗口中也被分配了一个唯一编号。如果你再次按下 <Prefix>, q，并在数字消失之前输入出现在那个窗格中的数字，你就会自动切换到那个窗格。


    默认情况下，这些数字在屏幕上停留的时长是 1 秒，但你可以通过在 .tmux.conf 文件中添加以下选项来更改：


    ```

    set-option -g display-panes-time 3000

    ```


    这会将窗格编号显示在屏幕上的时间延长到 3000 毫秒（即 3 秒），让你有更多时间通过索引选择窗格。


    所以，要跳到输入了 Apple 这个词的窗格，只需按下 <Prefix>, q，然后按 1。因为你之前位于哪个窗格并不重要，因为这个窗格被赋予了索引 1；使用这个组合键就会跳到那个窗格。


    ## 循环切换窗格布局


    tmux 为我们提供了几种不同的方式来自动改变窗格布局，这样你就不必用别扭的方式精心分割和调整大小来达到想要的结果了。


    '
