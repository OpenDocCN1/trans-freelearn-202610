  - '[PAGE 124]


    # Using Other Tools with tmux


    We have not yet discussed sockets much as we get into rather esoteric territory,
    but the first line allows you to specify a socket name.


    By default, when tmux is first launched, a server is launched on the machine and
    that server creates a socket on which it begins listening. Then the client is
    launched and connects to that socket. This is all rather seamless under normal
    usage.


    This socket persisting is what allows you to detach the tmux session and reattach
    it. In reality, when you detach you are terminating the client; however, the tmux
    server continues humming along, listening on that socket for incoming connections.
    When you decide to reattach to a session, you are launching a client and connecting
    to that socket.


    This socket is also what allows multiple people to connect to a single tmux session
    as we saw in *Chapter 6, tmux for SSH, Pair Programming, and More*, when we discussed
    using tmux for pair programming.


    So far, whenever we ran a tmux command to connect, we seamlessly connected to
    that default socket, but you can launch tmux and specify your own socket path
    or name. This will allow us to run more than one independent instance of tmux
    on the same machine.


    So, this configuration option allows us to specify the socket name when we launch
    with `tmuxinator start <name>`.


    The next section starting with the pre command is copied in the following code
    snippet:


    ```

    ```text

    # Runs before everything. Use it to start daemons etc.

    # pre: sudo /etc/rc.d/mysqld start

    ```

    ```


    This section allows you to specify any commands to run when the tmuxinator session
    is started as its name implies. This is great to start any background tasks that
    do not have a UI but which we would like to be running and available for the session.
    This is convenient because it prevents us from having to open a new pane (or panes),
    launch a program, then leave it around forever but just ignore it. The following
    code snippet allows us to specify tmux options specific to this tmuxinator instance
    that may not appear in the standard `.tmux.conf` file:


    ```

    ```text

    # Runs in each window and pane before window/pane specific commands.

    Useful for setting up interpreter versions.

    # pre_window: rbenv shell 2.0.0-p247

    ```

    ```'
  - '[PAGE 125]


    This command allows us to run a command with every window or pane that we create
    rather than just on tmux launch. In the following commands we''re passing the
    configuration file:


    ```

    ```text

    # Pass command line options to tmux. Useful for specifying a different

    # tmux.conf.

    # tmux_options: -f ~/.tmux.mac.conf

    ```

    ```


    There could be simpler commands such as changing the prefix key or anything else
    we saw back in *Chapter 2, Configuring tmux* or more powerful as in the example
    where they are loading another configuration file and sucking in all of its commands.
    The following code allows us to change the command used to call tmux:


    ```

    ```text

    # Change the command to call tmux. This can be used by derivatives/

    # wrappers like byobu.

    # tmux_command: byobu

    ```

    ```


    This code snippet mentions byobu, which is a program that basically sits atop
    tmux (or GNU Screen) and adds additional functionality to them. The idea behind
    this is that if you prefer to use tmuxinator to call some command other than tmux
    that wraps tmux, you can do so using this line.


    # Summarizing tmuxinator


    In summary, tmuxinator is an extremely powerful program that adds a lot of useful
    features to tmux and will save any tmux user a lot of time, every time they have
    to relaunch tmux and get all set up with their environment.


    Not only can it be a huge timesaver, but can also be incredibly helpful for beginners
    as it can act as training wheels until a tmux user has grown accustomed to all
    the nuances of creating windows and panes. As we saw in *Chapter 3, Sessions,
    Windows, and Panes*, creating and manipulating panes can be fairly difficult.
    Having a simple tmuxinator configuration file that can jumpstart that process
    without much effort can be incredibly helpful.


    ![](img/5969098f450265ac0c7947efcdbe7889_125_0.png)'
