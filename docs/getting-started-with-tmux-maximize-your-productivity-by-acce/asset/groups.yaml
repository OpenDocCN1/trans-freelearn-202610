  md: "\nThe most versatile of the bunch is a key binding that will essentially cycle\
    \ through to a different preset pane layout each time you press a key combination.\
    \ This key combination is <Prefix>, Space bar (cycle through pane layouts).\n\n\
    Try it out; press <Prefix>, Space bar, and you will see your panes move around.\
    \ The content stays in them, so any programs in them would keep running fine,\
    \ but they get rearranged and resized in different ways each time you use that\
    \ key combination.\n\nIf you look at the status bar, you will see the name of\
    \ the layout. There are five different preset layouts that you can cycle through;\
    \ these are even-horizontal, even-vertical, main-horizontal, main-vertical, and\
    \ tiled.\n\nUntil you know what you like for a given use case, cycling through\
    \ them is a pretty good way to see what the possibilities are.\n\nOnce you are\
    \ comfortable enough with these layouts, you can switch to them directly, without\
