    \ 撰稿\n\n我们欢迎所有对写作感兴趣的人士前来咨询。书籍提案请发送至 author@packtpub.com。如果您的书籍构思尚处于早期阶段，希望在撰写正式提案之前先进行讨论，请联系我们；我们的策划编辑之一将与您取得联系。\n\
    \n我们不仅仅寻找已经出版过作品的作者；如果您拥有扎实的技术技能但没有写作经验，我们经验丰富的编辑可以帮助您发展写作事业，或者让您的专业知识获得额外回报。\n\
