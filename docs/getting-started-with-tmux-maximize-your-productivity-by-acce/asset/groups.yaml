    same option whether they want it or not. Session options do not have a flag; they
    are set by leaving off the flag, as they are the default.


    Then, there are window options, which apply only to one window. To set a window
    option, specify it with the -w flag.


    When it comes to configuring options, they cascade down. So there are global options
    specified with -g that will serve as the master set. Then, any option further
    down the chain will inherit from the global settings or may override the global
    setting with its own.


    To do this, simply add a bind-key entry to your `.tmux.conf` file and bind the
    same key combination as your prefix key to the last-window command. For example,
    if you followed the preceding steps and set the prefix key to Ctrl + t, the following
    line in your `.tmux.conf` file is appropriate:


    ```

    # Double tapping the prefix jumps to last window

    bind-key C-t last-window

    ```


    Now moving on to the last window is as easy as holding down Ctrl and tapping t
    twice.


    ## Changing the escape time


    I have heard from some vim users that tmux adds a short, almost imperceptible
    delay between the commands that can cause funny behavior when running vim inside
    tmux.


    In tmux terms, this delay is called escape-time. By default, it''s set to 500
    ms. To fix things with vim, set the escape-time to 0 by adding the following line
    to your configuration file:


    ```

    set-option -s escape-time 0

    ```


    Note that this option obviously exists for a reason, so tread carefully when doing
    this as you may come across unexpected behavior. However, we''ve heard from a
    lot of vi users that make this change and they never look back. Also note, as
    discussed previously, this has the -s flag so it is a session-specific option,
    which means that if someone else connects to the same server, they could have
    a different value for escape-time.


    ## Lengthening the history limit


    tmux only has a limited amount of scrollback history. The scrollback history is
    the number of lines it retains in memory that have scrolled off the screen and
    which are accessible in Copy mode (see Chapter 4, Manipulating Text).


    However, the default history-limit for tmux is 2,000, which can be pretty low
    for many use cases. In order to crank it up, add the following line to your configuration
    file:


    ```

    set-option -g history-limit 10000

    ```


    Note that by increasing this history limit, you are also increasing the memory
    footprint of tmux. So some tweaking may be necessary if it''s set too high, particularly
    if you tend to have a lot of open windows and panes.


    ## Lengthening the display time


    Some commands will cause tmux to display a message to you, replacing the status
    bar with the text it displays for you. The time a message is displayed is called
    display-time.


    Out of the box, the value of display-time for tmux is rather low. Try doing a
    search for text in another window with some text that you know doesn''t exist.
    For example, try `<Prefix>, f`, then type any search string that you know doesn''t
    exist in any other window, for example, potato.


    You will see the text `No windows matching: potato` appear in place of the status
    bar and then disappear in the blink of an eye:


    ![](img/5969098f450265ac0c7947efcdbe7889_59_0.png)


    It will go in a flash because it only stays on the screen for the duration of
    the current display-time, which is only 750 ms by default. It''s probably a good
    idea to crank the value of display-time up a bit so messages stay visible a bit
    longer, at least until you are more comfortable with tmux. To do so, add the following
    line to your configuration file, changing the duration to 2 seconds:


    ```

    set-option -g display-time 2000

    ```


    For a 2-second duration, we set display-time to 2000 because the display time
    is set in milliseconds.


    ## Summary


    So let''s put it all together. Refer to the *Appendix* to see the final product,
    the `.tmux.conf` file we have built throughout this chapter.


    Throughout this chapter, we learned a lot about configuring tmux. Starting with
    a blank `.tmux.conf` configuration file, we built up a much larger configuration
    changing many aspects of our tmux experience.


    We altered the look and feel by modifying the status bar, and we learned how to
    bind keys, including the prefix key. We showed you how to bind multiple commands
    to a single key binding and how to unbind keys. We learned how to keep the file
    manageable and well documented by adding comments, and how to bind keys without
    needing the prefix key. We learned about the different types of options that can
    be set in the configuration file and some handy configuration tips that probably
    wouldn''t be readily obvious to most readers.


    By the end of the chapter, we have built up a very rich sample configuration file,
    which can be a great starting point for your own personal customization. We learned
    a bit about how to browse the man page for an extensive list of the available
    options.


    We hope you treat this `.tmux.conf` file as a living document and update it with
    other neat things you may find and remove or change any bits that exist in it
    now. Personalize it to suit your needs; after all that''s what it''s for!


    Now that we''ve learned all about configuration, in the next chapter, we will
    move on to discuss one of the major fundamentals of tmux: the concept of sessions,
    windows, and panes.

