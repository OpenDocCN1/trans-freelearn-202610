    # Using wemux to ease multiuser experience


    Another fantastic utility built by the community is **wemux**. It seeks to simplify
    the multiuser experience in tmux. As we saw in the last chapter, setting tmux
    up for pair programming is an awesome feature of tmux. It builds upon that experience,
    making it easier to configure and adds some very useful functionality.


    Jump on over to the wemux GitHub page to get started and install wemux:


    ```

    https://github.com/zolrath/wemux

    ```


    If you are in an active tmux session, detach it before proceeding with `<Prefix>,
    d`.


    Now let''s jump into wemux. From your terminal, run the following command:


    ```

    $ wemux start

    ```


    Boom! But wait, you may say that this looks exactly like tmux. You would be right,
    wemux is a wrapper around tmux so it is the tmux you know and love with some special
    sauce added to facilitate some of the multi-user concepts.


    From your command line, run the following command:


    ```

    $ wemux users

    ```


    The output of this command can be seen in the following screenshot:


    ![](img/5969098f450265ac0c7947efcdbe7889_126_0.png)


    You should see a list containing one user. As you can imagine, if you had other
    users connected, they would appear in this list. Moreover, if there were another
    user in that list and we wanted to boot them out of our current wemux session,
    you could run the following command:


    ```

    $ wemux kick username

    ```'
