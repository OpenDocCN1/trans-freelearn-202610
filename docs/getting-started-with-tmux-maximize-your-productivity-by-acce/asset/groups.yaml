  - '[PAGE 134]


    +   - The pane and window management in tmux is much simpler and more powerful.
    With tmux, it is easy to split a window into many different panes, move them around,
    attach them to different windows, move windows, attach windows to different sessions,
    and so on. Many of these tasks are not possible in Screen, and they end up being
    far more complex than they are with tmux.

    +   - The tmux status bar configuration, out of the box, is quite simple and defaults
    to what most people would like. Screen, on the other hand, does not include a
    status bar by default, and the way to specify it is very complex. For example,
    this is an actual line from my Screen configuration to enable a tmux-style status
    bar:


    ```

    hardstatus string ''{%=kG} [ %{G}%H %{g} [%{=kw}%?%-Lw%?%{r}(%{W}%n*%f%t%? (%u)%?%{r})%{w}%?%+Lw%?%=
    %{g}] [%{B}%Y-%m-%d %{W}%c %{g}]''

    ```


    No; this is not a joke. This is the actual line and all it does is display the
    same things that the tmux status bar supports out of the box.


    There are more benefits of tmux over Screen, but this should give any reader a
    good indication of the rationale here.


    > As it was the first terminal multiplexer we ever used, Screen still has a special
    place in the author''s heart. The intent here is certainly not to bash Screen,
    which, impressively, is celebrating its 27th year at the time of writing this.
    Screen is still quite a great program and very much paved the way for tmux. However,
    you purchased this book because you wanted to learn about tmux and our intent
    was to enumerate some reasons why tmux is the most awesome program of its type.


    ![](img/5969098f450265ac0c7947efcdbe7889_134_0.png)


    # The configuration reference


    What follows is the configuration file that we built over the course of Chapter
    2, Configuring tmux:


    ```

    # Enable mouse mode for mouse scrolling (tmux 1.9a+)

    set-window-option -g mouse-mode on

    # Enable mouse for selecting the window by clicking on the title

    # in the status bar

    set-option -g mouse-select-window on

    # Enable mouse for selecting the pane by clicking on it

    set-option -g mouse-select-pane on

    # Enable the mouse for clicking and dragging to resize panes

    set-option -g mouse-resize-pane on

    ```'
