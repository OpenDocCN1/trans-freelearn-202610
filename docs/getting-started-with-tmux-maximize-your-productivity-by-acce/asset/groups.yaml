  - '[PAGE 73]


    The most versatile of the bunch is a key binding that will essentially cycle through
    to a different preset pane layout each time you press a key combination. This
    key combination is <Prefix>, Space bar (cycle through pane layouts).


    Try it out; press <Prefix>, Space bar, and you will see your panes move around.
    The content stays in them, so any programs in them would keep running fine, but
    they get rearranged and resized in different ways each time you use that key combination.


    If you look at the status bar, you will see the name of the layout. There are
    five different preset layouts that you can cycle through; these are even-horizontal,
    even-vertical, main-horizontal, main-vertical, and tiled.


    Until you know what you like for a given use case, cycling through them is a pretty
    good way to see what the possibilities are.


    Once you are comfortable enough with these layouts, you can switch to them directly,
    without cycling through all of them, by pressing <Prefix>, then Meta and the index
    of the preset layout in the previous list. So, for example, you can use <Prefix>,
    Meta + 1 to switch to the even-horizontal view, <Prefix>, Meta + 2 to switch to
    the even-vertical view, and so on.


    # Other pane operations


    There are far too many pane operations, so we''ll not be able to cover all of
    them exhaustively in this book; for most that we''ll not discuss, we implore you
    to dig into the tmux man page:


    ```

    $ man tmux

    ```


    Alternatively, you can refer to them on the Web at http://man.cx/tmux.


    Now that you understand panes, the man page should be very manageable and understandable
    on the topic of panes.


    You can do things like breaking one pane out into its own window; rotating the
    panes; swapping one pane with another; moving a pane to another window; and arranging
    all the panes horizontally, vertically, tiled, and much more.


    There are many more commands to resize panes, many of which don''t even have keyboard
    shortcuts because they''re not used all that much. Of course, you could add your
    own, and if you read Chapter 2, Configuring tmux, you should have all the tools
    in your toolbox to do so.'
  - '[PAGE 74]


    # Summary


    In this chapter, we learned a lot about sessions, windows, and panes in tmux.
    We learned how each of these fit into the tmux hierarchy, and we played around
    with them to solidify some of the concepts. We created multiple sessions, split
    windows into multiple panes, moved them around, and learned different ways to
    switch the cursor from one pane to another.


    In the next chapter, we will move on to text manipulation and learn about how
    we can scroll back through the window history, how we can copy text from the window
    history into a paste buffer, and how we can paste that content.'
  - '[PAGE 75]


    # # Manipulating Text


    There are two important components of tmux that we are yet to discuss in more
    detail, namely, **Copy mode** and **paste buffers**.


    Copy mode is a mode in tmux that we can switch to; it allows us to select the
    text that already appears on the screen and copy it. Also, it allows us to move
    our cursor anywhere on the screen, even to places that have moved off the screen.


    When an item is copied from Copy mode, it ends up in the paste buffer. As its
    name implies, this is a buffer that exists to hold anything that is copied so
