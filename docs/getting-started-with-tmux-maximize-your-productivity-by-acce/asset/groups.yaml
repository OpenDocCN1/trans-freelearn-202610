    \ achieved with a standard tabbed terminal application.\n- The addition of the\
    \ saved state means that you can close a terminal window that is running tmux,\
    \ and your entire session state will be saved and can be reattached later (assuming\
    \ your terminal program allows the tmux server to continue running in the background;\
    \ not all do). Any programs that were running continue running in the background.\
    \ This is not the case with tabs in iTerm, OS X Terminal, or any Linux terminal.\
    \ Closing one of these will drop your state for that window.\n- There is much\
    \ more power and flexibility to using tmux to split a window into panes and rearranging\
    \ those panes than in using any tabbed terminal interface. Most modern terminal\
    \ applications will now support simply a vertical or horizontal split, and that's\
    \ about it. With tmux, the possibilities are (nearly) endless in terms of the\
    \ number of splits, layouts, and so on.\n- All of the tmux keyboard shortcuts\
    \ for changing the size and layout of these splits translate into less dependence\
    \ on your mouse, which is something most normal tabbed terminal applications cannot\
    \ offer.\n- Not only are there more shortcuts with tmux for tweaking the size\
    \ of this or that, but tmux also offers a much broader range of customizability\
    \ in terms of keyboard shortcuts for every operation it can handle. Literally,\
    \ every single tmux shortcut can be changed or rewired with a simple configuration\
    \ file, as shown in Chapter 2, Configuring tmux. Some terminal applications might\
    \ offer some customization, but none are quite as powerful as tmux in this regard.\n\
    - The pane and window management in tmux is much simpler and more powerful. With\
    \ tmux, it is easy to split a window into many different panes, move them around,\
    \ attach them to different windows, move windows, attach windows to different\
    \ sessions, and so on. Many of these tasks are not possible in Screen, and they\
    \ end up being far more complex than they are with tmux.\n- The tmux status bar\
    \ configuration, out of the box, is quite simple and defaults to what most people\
    \ would like. Screen, on the other hand, does not include a status bar by default,\
    \ and the way to specify it is very complex. For example, this is an actual line\
    \ from my Screen configuration to enable a tmux-style status bar:\n\n  ```\n \
    \ hardstatus string '{%=kG} [ %{G}%H %{g} [%{=kw}%?%-Lw%?%{r}(%{W}%n*%f%t%? (%u)%?%{r})%{w}%?%+Lw%?%=\
    \ %{g}] [%{B}%Y-%m-%d %{W}%c %{g}]'\n  ```\n\nNo; this is not a joke. This is\
    \ the actual line and all it does is display the same things that the tmux status\
    \ bar supports out of the box.\n\nThere are more benefits of tmux over Screen,\
    \ but this should give any reader a good indication of the rationale here.\n\n\
    > As it was the first terminal multiplexer we ever used, Screen still has a special\
    \ place in the author's heart. The intent here is certainly not to bash Screen,\
    \ which, impressively, is celebrating its 27th year at the time of writing this.\
    \ Screen is still quite a great program and very much paved the way for tmux.\
    \ However, you purchased this book because you wanted to learn about tmux and\
    \ our intent was to enumerate some reasons why tmux is the most awesome program\
    \ of its type.\n\n![](img/5969098f450265ac0c7947efcdbe7889_134_0.png)\n\n### The\
    \ configuration reference\n\nWhat follows is the configuration file that we built\
    \ over the course of Chapter 2, Configuring tmux:\n\n```\n# Enable mouse mode\
    \ for mouse scrolling (tmux 1.9a+)\nset-window-option -g mouse-mode on\n# Enable\
    \ mouse for selecting the window by clicking on the title\n# in the status bar\n\
    set-option -g mouse-select-window on\n# Enable mouse for selecting the pane by\
    \ clicking on it\nset-option -g mouse-select-pane on\n# Enable the mouse for clicking\
    \ and dragging to resize panes\nset-option -g mouse-resize-pane on\n```\n"
  mdcn: "\n\n## 使用 wemux 简化多用户体验\n\n社区构建的另一个很棒的实用工具是 **wemux**。它旨在简化 tmux 中的多用户体验。正如我们在上一章中所看到的，将\
    \ tmux 设置用于结对编程是 tmux 的一个很棒的功能。它在此基础上构建，使配置变得更容易，并增加了一些非常有用的功能。\n\n前往 wemux 的\
    \ GitHub 页面开始使用并安装 wemux：\n\n```\nhttps://github.com/zolrath/wemux\n```\n\n如果您正在进行一个活动的\
    \ tmux 会话，请在继续之前先分离它 `<Prefix>, d`。\n\n现在让我们进入 wemux。从您的终端运行以下命令：\n\n```\n$ wemux\
    \ start\n```\n\nBoom！但等等，你可能会说这看起来完全像 tmux。你说得对，wemux 是 tmux 的一个包装器，所以它就是你所熟悉和喜爱的\
    \ tmux，只是添加了一些特殊功能来促进多用户概念。\n\n从你的命令行运行以下命令：\n\n```\n$ wemux users\n```\n\n此命令的输出可以在以下截图中看到：\n\
    \n![](img/5969098f450265ac0c7947efcdbe7889_126_0.png)\n\n你应该会看到包含一个用户的列表。可以想象，如果有其他用户连接，他们也会出现在这个列表中。此外，如果列表中还有另一个用户，而我们想将其从当前\
    \ wemux 会话中踢出，你可以运行以下命令：\n\n```\n$ wemux kick username\n```\n\n## 附录\n\n附录将涵盖以下三个主题：\n\
    \n- 为什么使用 tmux？\n- 配置参考\n- 键绑定和命令参考\n\n### 为什么使用 tmux？\n\n许多开发人员在终端中花费了大部分时间。无论是用于编码；SSH\
    \ 连接到远程服务器；浏览文件系统；本地任务，如检查、编译或代码检查、运行单元测试；甚至用于邮件或 Internet Relay Chat（IRC），终端都是开发人员武器库中最广泛使用的工具之一。\n\
    \ntmux 是一个在终端内运行的命令行应用程序，可以 turbocharge 它。其强大的功能允许简化许多日常任务，如本书各处所示。然而，大多数人使用像\
    \ tmux 这样的程序的主要原因是它允许你将一个终端窗口变成许多虚拟窗口，每个窗口都有自己的状态。它属于一类称为终端多路复用器（tmux 只是该术语的缩写）的应用程序。它有一些兄弟程序，但最突出的是\
    \ GNU Screen。\n\n还记得没有标签页的网页浏览器吗？如果你回答没有，你就没错过什么，并且享受你的青春！然而，如果你回答是，可能需要一秒钟来回忆它有多不方便。当然，用多个标签页可以做的事情，用没有标签页和多个浏览器窗口也可以做，但能够将它们组合在一起仍然是对生产力的很大提升。拥有许多浏览器窗口会非常混乱。标签页的出现让你能够在逻辑上分离你的浏览体验。在标签页之前，你会有用于参考文档的一个浏览器窗口，另一个用于购物，等等。\n\
    \n同样，tmux 等终端多路复用器允许你做同样的事情，将多个窗口在逻辑上分组到一个终端窗口中，就像浏览器中的标签页一样。就像每个浏览器标签页包含自己的状态一样，每个\
    \ tmux 窗口也是如此。\n\n然而，与浏览器标签页不同，后者主要只是增加了组织性，tmux 实际上为终端增加了丰富的额外功能。tmux 不仅允许将窗口分割成窗格，以便屏幕上同时显示多个不同的内容，而且\
    \ tmux 还增加了复制模式和其他结构，允许重度终端用户在不离开 tmux 或甚至不必经常使用鼠标的情况下做更多事情。我们在本书中触及了其中的许多好处，因此在这里就不必重复了。\n\
    \n为什么要在标准终端应用程序带原生标签页（例如，OS X Terminal、iTerm、Gnome Terminal 等）的情况下使用终端多路复用器？原因有很多，但以下只是其中几个：\n\
    \n- 复制模式的添加允许在终端窗口之间复制和粘贴，而无需使用鼠标。这对于标准标签页终端应用程序来说很难实现。\n- 保存状态的添加意味着你可以关闭正在运行\
    \ tmux 的终端窗口，你的整个会话状态将被保存并可以在以后重新附加（假设你的终端程序允许 tmux 服务器在后台继续运行；并非所有都允许）。任何正在运行的程序都会在后台继续运行。这对于\
    \ iTerm、OS X Terminal 或任何 Linux 终端中的标签页来说并非如此。关闭其中一个将丢弃该窗口的状态。\n- 使用 tmux 将窗口分割成窗格并重新排列这些窗格的强大功能和灵活性远超任何标签页终端界面。大多数现代终端应用程序现在只支持简单的垂直或水平分割，大概就这样了。而对于\
    \ tmux 而言，分割的数量、布局等方面的可能性几乎是无限的。\n- 所有用于更改这些分割的大小和布局的 tmux 键盘快捷键都意味着对鼠标的依赖减少，这是大多数普通标签页终端应用程序无法提供的。\n\
    - 不仅 tmux 提供了更多用于调整这个或那个大小的快捷键，而且 tmux 还提供了更广泛的自定义范围，针对它能处理的每个操作的键盘快捷键。实际上，每个\
    \ tmux 快捷键都可以通过简单的配置文件更改或重新连接，如第 2 章《配置 tmux》所示。一些终端应用程序可能提供一些自定义，但没有一个在这一点上像\
    \ tmux 那样强大。\n- tmux 中的窗格和窗口管理要简单得多，也更强大。使用 tmux，很容易将窗口分割成许多不同的窗格，移动它们，将它们附加到不同的窗口，移动窗口，将窗口附加到不同的会话，等等。Screen\
    \ 中许多这些任务是不可能的，而且最终比使用 tmux 复杂得多。\n- tmux 的状态栏配置开箱即用非常简单，默认设置大多数人都会喜欢。另一方面，Screen\
    \ 默认不包含状态栏，并且指定它的方法非常复杂。例如，这是我 Screen 配置中启用 tmux 风格状态栏的实际一行：\n\n  ```\n  hardstatus\
    \ string '{%=kG} [ %{G}%H %{g} [%{=kw}%?%-Lw%?%{r}(%{W}%n*%f%t%? (%u)%?%{r})%{w}%?%+Lw%?%=\
    \ %{g}] [%{B}%Y-%m-%d %{W}%c %{g}]'\n  ```\n\n不；这不是一个笑话。这是实际的行，它所做的只是显示 tmux 状态栏开箱即用支持的相同内容。\n\
    \ntmux 相对于 Screen 的好处还有更多，但这应该能让任何读者很好地了解这里的理由。\n\n> 作为我们曾经使用过的第一个终端多路复用器，Screen\
    \ 在作者心中仍占有特殊地位。这里的意图绝对不是抨击 Screen，该程序令人印象深刻地在撰写本文时庆祝其第 27 年。Screen 仍然是一个非常棒的程序，并且在很大程度上为\
    \ tmux 铺平了道路。然而，你购买这本书是因为你想学习 tmux，我们的意图是列举一些原因，说明为什么 tmux 是其类型中最棒的程序。\n\n![](img/5969098f450265ac0c7947efcdbe7889_134_0.png)\n\
    \n### 配置参考\n\n下面是我们在第 2 章《配置 tmux》中逐步构建的配置文件：\n\n```\n# Enable mouse mode for\
    \ mouse scrolling (tmux 1.9a+)\nset-window-option -g mouse-mode on\n# Enable mouse\
    \ for selecting the window by clicking on the title\n# in the status bar\nset-option\
    \ -g mouse-select-window on\n# Enable mouse for selecting the pane by clicking\
    \ on it\nset-option -g mouse-select-pane on\n# Enable the mouse for clicking and\
    \ dragging to resize panes\nset-option -g mouse-resize-pane on\n```\n"
