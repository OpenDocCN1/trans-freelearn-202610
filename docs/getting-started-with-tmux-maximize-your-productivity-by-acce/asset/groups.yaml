  - '[PAGE 113]


    So let''s get started. The following steps will guide you in using Vagrant:


    +   1. Go to https://vagrantcloud.com/ and sign up. It''s free to create an account.

    +   2. Next, go back to a terminal, one not in the SSH session already (you can
    open a new one or detach one of the existing tmux sessions with the keyboard command
    <Prefix>, d), and enter the following command:

    +      $ vagrant login

    +   3. Provide your username and password and you''ll be logged in.

    +   4. Navigate back to the directory where you created your Vagrantfile and run
    the command:

    +      $ vagrant share --ssh

    +   5. You will be prompted to provide a password to encrypt the SSH key. Give
    it something that is a decent password but which you can share with the person
    you''re pairing with.

    +   6. On the screen, Vagrant will give instructions for the other user to connect
    and issue your machine a random name. Your current screen will look similar to
    the following screenshot:


    ![](img/5969098f450265ac0c7947efcdbe7889_113_0.png)'
  - '[PAGE 114]


    +   7. Now open another terminal window (simulating another user on a remote machine)
    and run the command it suggested. In my case, the command used was:

    +   ```

    +   $ vagrant connect --ssh greedy-lamb-6478

    +   ```

    +   However, the machine name will be different for you since it''s randomized.
    After entering the SSH key password, you''ll be connected via SSH to the server!
    This could be a person on the other side of the world.


    +   8. Now run tmux and attach the session of interest:

    +   ```

    +   $ tmux attach-session -t MyServer

    +   ```

    +   And you''re ready to rock.


    Of course, the other person connecting will also have to sign up for Vagrant Cloud
    in order to connect. This is an incredibly easy way to come up with a relatively
    safe pair programming environment so two (or more) people can collaborate in real
    time over the Web without fear of compromising one of the collaborator''s environments.


    If the worst happens and one of the pair is nefarious, the worst they can do is
    make a mess of this virtual machine, which was created with only a handful of
    commands.


    # Using grouped sessions for pairing


    You may have seen the previous pairing and thought, "Well that''s great and seeing
    what the other person sees in real time is cool, but what if you want each person
    to be able to have different windows?"


    This is where grouped sessions come in. You can have one person create a session
    and the next to join create a new session, but specify the grouped session as
    well. This way, each person has their own control over the windows in a session,
    but anything they do in each session is shared. This allows one person to be in
    one window and the other in another.


    They can switch to each other''s sessions at will, but otherwise don''t need every
    command and keystroke to enact on both windows. To create a grouped session, one
    person must initiate the session as we discussed previously. If you still have
    the MyServer session running, you can use that.'
  - '[PAGE 115]


    In a new terminal window, connect to the same server but instead of attaching
    that same session with tmux, run the following command:


    ```

    $ tmux new-session -t MyServer -s MySession

    ```


    This instructs tmux to create a new session, but with the same target. This initializes
    a grouped session. The MyServer session is the grouped session, so the new connector
    can view it, but new connector can also switch to another window without stealing
    the initial user''s view.


    While this new session shares the same target, it essentially clones the original
    session and creates another for the second viewer. They are linked; so as one
    user opens new windows or changes anything in one session, the same will happen
    in the other session, but both sessions can have different names and both sessions
    will appear in the list of sessions as two different sessions. This way, if the
    second viewer kills their session (with the tmux command kill-session -t {session
    name}), the first session will continue running.


    This allows the second user that connected to go off and do their own thing, creating
    more windows, using a different program, and so on, but without stealing the spotlight
    and forcing the host to watch their every move.


    Now in each of our examples, we only showed two clients connecting to the same
    session. However, that could just as easily be 3, 13, 37, 359, or more. While
    there is no stated limit to the number of clients that can connect to a session
    simultaneously, there will be a practical limit on throughput and bandwidth and
    memory at some point. However, tmux does not enforce a set limit.


    # Summary


    We learned some tricks of using tmux in a daily workflow. We learned how it can
    be used to help created long-lived SSH sessions and how it can be used for pair
    programming with a stop along the way to learn about using Vagrant to set up a
    shareable virtual machine.


    In the next chapter, our last, we will discuss how we can use some other third-party
    tools with tmux to make it even more powerful.'
