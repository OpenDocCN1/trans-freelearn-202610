    # Using the set-option command


    The main way in which options are set and configured within tmux is through the
    appropriately named `set-option` command.


    This command can be called on its own to set an option temporarily. However, most
    of the time, we will use it to set options within a tmux configuration file so
    each time we launch tmux, the options are set the way we would like.


    For a taste of using the `set-option` command to set an option temporarily, open
    a terminal window and launch tmux; alternatively, if you''ve been following along
    through Chapter 1, Jump Right In, just type the following command in the window:


