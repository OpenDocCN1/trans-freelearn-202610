  - '[PAGE 78]


    # Manipulating Text


    +   - **Clock mode:** This mode shows the current time and is more of a novelty
    / utility than an actual mode, like the rest. It can be accessed by `<Prefix>,
    t`.

    +   - **Control mode:** This mode allows third-party applications to interact
    with tmux through a text-only protocol.


    In addition, this is where we start to get to the text manipulation goodies within
    tmux. When we drop into Copy mode, we can scroll back to look back through the
    Window history, and we can also access some cool text manipulation tools.


    Let''s walk through a sample workflow with Copy mode.


    # A sample workflow with Copy mode workflow


    If you have followed us from the beginning of the chapter, you should have a tmux
    session started. Let''s first rerun the long-running command we used previously
    to list the available key bindings:


    ```

    ```bash

    $ tmux list-keys

    ```

    ```


    Just as we saw the last time we ran this command, only the last few lines are
    made visible in our current pane. However, now we are armed with a bit of knowledge
    about the Window history and can likely surmise that the remaining lines are there
    but have scrolled off the screen. How can we scroll up and see what that text
    was? Copy mode!


    # Entering Copy mode


    Let''s enter Copy mode so we can scroll back and see the rest of it, which is
    stored in our Window history. Press `<Prefix>, [` to switch back to Copy mode.


    The first thing you''ll notice is a new interface element added to our screen.
    There will be a new box in the upper-right corner of the terminal screen that
    shows **[0/76]**, as shown in the following screenshot:


    ![](img/5969098f450265ac0c7947efcdbe7889_78_0.png)'
  - '[PAGE 79]


    This shows us both the number of lines in the history (76) and the current line
    our cursor is currently on (0).


    Note that these lines are in reverse chronological order, so 0 stands for our
    currently viewed pane, 1 is a line above it, 2 is a line above line 1, and 76
    is way up at the top of our Window history. This helps give context as to where
    in the history we are as we scroll up through it.


    Going back to our Window history diagram, the lines can be thought of as shown
