    # ## Chapter 2 – Configuring tmux


    In this chapter, we dealt a lot with configuration. Listed here are the key bindings
    and commands introduced in *Chapter 2, Configuring tmux*, but see the *Configuration
    reference* section for information on the new configuration items we discussed:


    +   - Set a tmux option: `$ tmux set-option {option to set} {value}`

    +   - Disable the status bar: `$ tmux set-option status off`

    +   - Enable the status bar: `$ tmux set-option status on`

    +   - See whether you are in the Emacs or vi mode: `$ tmux show-options -g | grep
    key`

    +   - Reload the tmux configuration: `$ tmux source-file ~/.tmux.conf`

    +   - Show all previously displayed messages: `<Prefix>, ~`


    # ## Chapter 3 – Sessions, Windows, and Panes


    In *Chapter 3, Sessions, Windows, and Panes*, we learned all about how to move
    and organize your content within a terminal window using the three core building
    blocks of tmux: sessions, windows, and panes. As a result, the key commands we
    learned throughout this chapter relate to manipulating one of those three items.
    The key commands covered in this chapter are as follows:


    +   - Launch tmux with a named session: `$ tmux new-session -s {session name}`

    +   - Access the switch session interactive dialog: `<Prefix>, s`

    +   - Switch to the next session: `<Prefix>, )`

    +   - Switch to the previous session: `<Prefix>, (`

    +   - Split a pane into two panes (horizontally): `<Prefix>, %`

    +   - Switch the cursor to the other pane: `<Prefix>, o`

    +   - Move the cursor to the pane to the right, left, down, or up: `<Prefix>,
    right arrow; <Prefix>, left arrow; <Prefix>, down arrow; <Prefix>, up arrow`

    +   - Kill the current pane: `<Prefix>, x`

    +   - Split a pane into two panes (vertically): `<Prefix>, "`

    +   - Resize the current pane: `<Prefix>, Alt + {arrow key}`'
