    # Apache Solr PHP Integration


    ISBN: 978-1-78216-492-0      Paperback: 118 pages


    Build a fully-featured and scalable search application using PHP to unlock the
    search functions provided by Solr


    +   1. Understand the tools that can be used to communicate between PHP and Solr,
    and how they work internally.

    +   2. Explore the essential search functions of Solr such as sorting, boosting,
    faceting, and highlighting using your PHP code.

    +   3. Take a look at some advanced features of Solr such as spell checking, grouping,
    and auto complete with implementations using PHP code.


    ![](img/5969098f450265ac0c7947efcdbe7889_147_1.png)


    # Learning Shell Scripting with Zsh


    ISBN: 978-1-78328-293-7      Paperback: 132 pages


    Your one-stop guide to reading, writing, and debugging simple and complex Z shell
    scripts


    +   1. A step-by-step guide that will show you how to use zsh and its repertoire
    of powerful features to improve the efficiency of your daily tasks.

    +   2. Learn how to configure and use zsh.

    +   3. Discover some advanced features of zsh such as process and parameter substitution,
    running on restricted functionality mode, and emulating other shells.'
