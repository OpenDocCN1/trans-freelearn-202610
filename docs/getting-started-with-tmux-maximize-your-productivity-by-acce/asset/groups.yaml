    Run the rake command to install the project:


    ```

    $ rake

    ```


    > Here, rake is short for the Ruby command make and it is the ruby analogue to
    make. If you do not have it installed, it can be installed with the command gem
    install rake. If you do not have gem installed, look to the RubyGems website for
    instructions: https://rubygems.org/pages/download.


    Now, the gems should be installed! Now if you launch tmux, you''ll be in maximum-awesome''s
    configuration.


    > Also, be forewarned that loading maximum-awesome can wipe out your locally configured
    .tmux.conf file (since the whole point, in essence, is that it is an awesome .tmux.conf
    file). So be sure to back up your .tmux.conf file before running this command.


    # Using tmuxinator to make session management easier


    In Chapter 5, Diving Deeper, we touched a bit on starting tmux with some default
    session configuration in the Launch with defaults section.


    You may have noticed that even a rather simple configuration turned out to be
    a bit complex and tricky. This is one of those areas of core tmux that leaves
    a little to be desired.'
  - '[PAGE 121]


    Thankfully, the open source world has stepped up to the plate and created an excellent
    utility called *tmuxinator* to make this kind of configuration far simpler.


    Built in ruby, tmuxinator is easy to install and provides a ton of useful capability.
    It does so by allowing you to specify in a simple and intuitive YAML syntax how
    you''d like your window laid out, any programs that should be run on launch, and
    more. tmuxinator allows you to create hooks that run before any window configuration
    is run and makes it much, much easier to specify a set of default windows and
    panes than in core tmux.


    Let''s run through the workflow of installing and creating a sample tmuxinator
    configuration file.


    # Installing tmuxinator


    Since it is built in ruby, it''s available as a ruby gem so installation is a
    breeze. In a command line, simply run:


    ```

    ```sh

    $ gem install tmuxinator

    ```

    ```


    > Depending on your system setup, you may have to use sudo to install gems. We''d
    suggest trying without sudo first, then falling back to it if the installation
    fails.


    tmuxinator helpfully tells us during install that it includes a tmuxinator doctor
    command that can be used to check your local system configuration and ensure all
    is well. We recommend running that now and fixing any issues it finds:


    ```

    ```sh

    $ tmuxinator doctor

    ```

    ```


    When you see all items confirmed as **Yes**, you can move on.


    # Understanding the tmuxinator configuration


    First, open a terminal and run the following command to create the initial tmuxinator
    configuration file:


    ```

    ```sh

    $ tmuxinator new tutorial

    ```

    ```


    The tmuxinator new command will start a new tmuxinator configuration file and
    we gave it the name `tutorial`. Feel free to name your file whatever you''d like
    of course.'
  - "[PAGE 122]\n\nYou'll be dropped right into your editor of choice with the default\
    \ contents of a tmuxinator configuration file already in your editor. A few things\
    \ to note about this file:\n\n+   - It is located in ~/.tmuxinator/<name>.yml\
    \ (in our case ~/tmuxinator/tutorial.yml). This is where tmuxinator will store\
    \ all of its configuration files. This is nice because you can have multiple configuration\
    \ files and they will all live in one place and be accessible by tmuxinator.\n\
    +   - After a couple lines, there are a bunch of comments. These comments indicate\
    \ options that could be used but aren't by default. We will dig into these in\
    \ a bit.\n+   - At the bottom of the file is the YAML that actually lays out the\
    \ windows, panes, and so on. tmuxinator includes a default set of layouts.\n\n\
    tmuxinator includes its own kind of domain-specific language to build a rich configuration\
    \ of windows, panes, and the default programs to run in them.\n\nFor example,\
    \ what follows is a sample configuration file. We have added useful comments starting\
    \ with # before each line to describe what the following line is doing:\n\n```\n\
    # sets the name for this tmuxinator config\nname: tutorial\n# sets the root directory,\
    \ all new panes will start with a\n# terminal opened to this directory\nroot:\
    \ ~/\n\n# this is the start of the specification for which windows\nwindows:\n\
    \  # this specifies the first window named \"editor\"\n  - editor:\n    # the\
    \ \"editor\" window should have a vertical layout\n    layout: main-vertical\n\
    \    # this specifies that the \"editor\" window should have two\n    # panes\n\
    \    panes:\n      # emacs should be running in one pane\n      - emacs\n    \
    \  # top should be running in the other pane\n      - top\n  # now we have a second\
    \ window called \"server\" that should start\n  # running the command \"node ~/myapp.js\"\
    \ on opening\n  - server: node ~/myapp.js\n  # there should be a third window\
    \ called \"logs\" which should\n  # start with the tail command to view the logs\n\
    \  - logs: tail -f log/development.log\n```"
