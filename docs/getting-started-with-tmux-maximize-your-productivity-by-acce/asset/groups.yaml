    # Modifying the background color of the status bar


    Let''s add an item to our configuration to change the color of the status bar.
    As we saw by jumping in, the default color of the status bar is a shade of green.
    Note that there happens to be a shade of green in our configuration as well, but
    it is likely a different color on your terminal unless you are using the same
    color scheme as we are.


    > The authors are using a color scheme called Solarized. It is a color scheme
    that includes both dark and light variants and is optimized for the terminal and
    readability. It was developed by Ethan Schoonover and has gained quite a following
    in the tech community for its precision, symmetry, and because it makes just about
    any code look downright pretty. For more information, visit http://ethanschoonover.com/solarized.


    The color scheme of our current terminal is as shown in the following screenshot:


    ![](img/5969098f450265ac0c7947efcdbe7889_43_0.png)


    Eeek! That''s pretty ugly with our current color scheme.


    Say, we want it to be a nicer blue color. Jump into your favorite text editor
    and edit ~/.tmux.conf to have the following line:


    ```

    set-option -g status-bg blue

    ```


    This line specifies that we want the status bar to be blue rather than its default,
    which on our system happened to be green.'
