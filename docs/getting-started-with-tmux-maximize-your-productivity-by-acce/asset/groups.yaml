    # Rebinding Ctrl to Caps Lock


    ![](img/5969098f450265ac0c7947efcdbe7889_49_1.png)


    One of my favorite programming productivity tips of all time is to rebind Caps
    Lock to Ctrl on a system-wide scale. This is easily done on most computers at
    the operating system level and even on some more capable keyboards.


    The majority of computer users seldom use Caps Lock, yet its place on the home
    row makes it a convenient key to press. Since Ctrl is used often by command-line
    programmers and its place on the keyboard is rather difficult to press, swapping
    the two can be very helpful. By swapping them, in the unlikely event that you
    ever do need to use Caps Lock, it is still accessible by the old Ctrl key on your
    keyboard.


    The author is a huge fan of Emacs that makes heavy use of the Ctrl key, and tmux
    is another program that does as well.


    This is by no means a requirement, but if you find yourself using the Ctrl key
    regularly, consider making use of this trick!


    On a Mac, it is very easy and requires no additional software. It''s a bit trickier
    on some other systems, but possible everywhere.


    For detailed tutorials visit http://vq.io/rebindcaps.'
