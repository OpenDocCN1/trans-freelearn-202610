    # Creating a tmux configuration file


    In order to keep the settings around after restarting tmux, we will create a configuration
    file that will include all the information about what options we want to set and
    to what values.


    Like many other Unix-based utilities, configuring tmux is as simple as creating
    a file with the name .tmux.conf in your home directory.


    However, unlike many other configuration files, a tmux configuration file does
    not contain some kind of specific configuration language for the program, rather
    it consists of a series of tmux commands that are run, in order, when tmux starts
    up. Most of the commands we''ll see are simple set-option commands similar to
    the commands we played with in the previous examples. Let''s create and start
    building our configuration file:


    ```

    $ cd ~

    $ touch .tmux.conf

    ```


    Open this newly created file in your favorite text editor and we''re ready to
    rock!


    > Like with most Unix-based utilities, this file in your personal directory contains
    the configuration for your user only.

    > It is also possible to set the global tmux configuration that will apply to
    all the users in the system. It follows the same format as that of a personal
    configuration file but generally lives in /etc/tmux.conf.

    > However, since it is likely that not all the users of a system want the same
    global configuration, it''s probably best to just modify your own personal configuration.


    # Emacs or vi mode


    As we discovered in Chapter 1, Jump Right In, tmux tries to help developers by
    providing two sets of key bindings, one each for the two most widespread text
    editors. If you swing one way or the other, this is likely to be one of the first
    things you''ll want to change to make tmux feel right for you.


    The default for tmux is to use the Emacs mode keys, so if you are an Emacs user,
    you may be all set. tmux also tries to help out and might, based on environment
    variables, switch to one group or the other by default. To check which mode tmux
    is currently in, run the following command:


    ```

    $ tmux show-options -g | grep key

    ```'
