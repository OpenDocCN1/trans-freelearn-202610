    **Thomas Ferris Nicolaisen** is a software developer who blogs, speaks, and podcasts
    about tooling and techniques for programmers. He continuously keeps a check on
    what the great command-line utilities on all platforms are, and in doing so, he
    picked up tmux some years ago. Since then, he has been using and enjoying working
    with it for both server work and terminal windows on the desktop.


    You can find his blog at www.tfnico.com and his recent podcast project on www.gitminutes.com.


    **Gustavo Sampaio** is a software developer with different kinds of specializations.
    He has experience with a lot of programming languages and various platforms (Android,
    iOS, Windows, Linux, Web, and the microcontroller Arduino).


    He has also worked with digital image processing and computer graphics, including
    advanced rendering techniques (global illumination, shaders, raytracing, and so
    on), natural language processing (the Naive Bayes classifier and POS Tagger),
    and parallel computing using the OpenMPI library.


    He is currently studying Computer Science and has publications in his fields.


    **Ian Yang** has several years of software development experience. Playing with
    various productivity tools is one of the things he loves. He is also a keyboard
    enthusiast who prefers to finish the job, mostly using keyboard. tmux is one of
    his favorite tools.


    He has worked remotely for several years as a web developer. He is currently running
    a mobile game start-up as the co-founder and CTO.'
