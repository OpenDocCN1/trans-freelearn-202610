    ### Tab completion


    长命令的复杂性比看起来要小，因为大多数命令都可以通过 Tab 补全。试着打开你的命令行提示符并输入以下内容：


    ```

    $ tmux list-se

    ```


    接下来，按 Tab 键。你应该会看到它补全为：


    ```

    $ tmux list-sessions

    ```


    因此，多亏了 Tab 补全，记住这些长命令的需求就很少了。


    请注意，Tab 补全只在某些配置的 shell 中有效，所以如果 Tab 补全技巧不起作用，你可能需要搜索网络并找到一种方法来为 tmux 启用 Tab 补全。


    ### Aliases


    大多数命令都有别名，即每个命令的较短形式，可以使用。例如，list-sessions 的别名是 ls。new-session 的别名是 new。


    你可以通过运行 tmux 命令 list-commands（别名 lscm）轻松查看它们全部，如以下代码片段所示：


    ```

    $ tmux list-commands

    ```


    这将显示所有 tmux 命令及其别名，完整名称后用括号括起来。


    在整篇文章中，我们将始终使用完整形式以求清晰，但你同样可以轻松使用别名（当然也可以使用 Tab 补全）。


    你会最有可能注意到的一件事是，在你的终端中只有最后几行是可见的。如果你拿起鼠标并尝试向上滚动，那也不起作用！如何查看放置在上面的文本？我们需要进入名为 Copy
    mode 的东西，它在本文本后面有自己的章节（参见第 4 章，Manipulating Text）。


    ### Renaming windows


    假设你想给一个窗口一个更有描述性的名称。如果你有三个不同的窗口，每个窗口都打开了 nano 编辑器，看到每个窗口都是 nano 就不会很有帮助了。幸运的是，重命名窗口非常容易。只需切换到你想要重命名的窗口。然后
    <Prefix>, 会提示你输入新名称。让我们将 nano 窗口重命名为 masterpiece。


    请看状态栏已更新，现在显示窗口 0 及其 masterpiece 标题，如以下屏幕截图所示。幸运的是，tmux 不够智能，无法检查窗口的内容；否则，我们不确定
    masterpiece 标题是否能通过。


    ![](img/5969098f450265ac0c7947efcdbe7889_36_0.png)


    ### Killing windows


    作为我们虚拟之旅的最后一站，让我们杀掉一个不再需要的窗口。使用我们的 find-window 技巧切换到窗口 1，输入 <Prefix>, f, cat test,
    Enter 或者当然我们也可以使用不太令人兴奋的 <Prefix>, l 命令移动到最后打开的窗口。


    现在让我们向这个窗口告别。按 <Prefix>, & 来杀掉它。你会收到一个提示，需要确认你是否要杀掉它。


    这是一个破坏性过程，不像分离，所以请确保你关心的任何内容都已保存。


    一旦你确认，窗口 1 将不复存在。可怜的窗口 1！你会看到现在只剩下窗口 0 和窗口 2：


    ![](img/5969098f450265ac0c7947efcdbe7889_36_1.png)


    你还会看到现在 <Prefix>,f, cat test, Enter 不再加载窗口 1，而是显示 **No windows matching: cat test**。所以，窗口
    1 真的已经不在我们身边了。


    每当我们创建一个新窗口时，它将采用最低可用的索引，在本例中将是 1。所以窗口 1 可以再次出现，但这次作为一个新且不同的窗口，对过去几乎没有记忆。我们也可以重新编号窗口，如后面将看到的，所以如果窗口
    1 缺失会冒犯你的审美感，不用担心，可以补救！


    ### Summary


    在本章中，我们直接上手，对 tmux 中一些最酷的功能进行了旋风式巡游。


    以下是本章涵盖的功能的快速总结：


    - Starting tmux

    - Naming and renaming sessions

    - The window string and what each chunk means

    - Creating new windows

    - The prefix key

    - Multiple ways to switch back and forth between windows

    - Accessing the help documents for available key bindings

    - Detaching and attaching sessions

    - Renaming and killing windows


    在下一章中，我们将研究配置以及 tmux 可以以多种方式进行自定义以适应你的口味和工作流程。


    对于本章及以后所有章节中学习到的所有命令的参考，你可以参考 *Appendix* 中的 *Key binding and command reference*
    部分。


    - Binding a new prefix key

    - Binding keys without the prefix key

    - Unbinding keys

    - Revising the status bar

    - Option types

    - Handy configuration tips


    到本章结束时，我们还将构建一个示例配置文件，你可以用它作为你自己的个性化配置的起点。


    ### Using the set-option command


    在 tmux 中设置和配置选项的主要方式是通过恰如其名命名的 `set-option` 命令。


    此命令可以单独调用以临时设置选项。然而，大多数时候，我们将使用它在 tmux 配置文件中设置选项，以便每次启动 tmux 时，选项都会按我们希望的方式设置。


    为了体验使用 `set-option` 命令临时设置选项，打开一个终端窗口并启动 tmux；或者，如果你一直在按照第 1 章 Jump Right In 进行操作，只需在窗口中输入以下命令：


    ```

    $ tmux set-option status off

    ```


    一旦你这样做，状态栏就会消失！此设置仅是临时的，所以如果你保持原样，结束会话并重新启动 tmux 或创建新会话，它将不会加载此设置。换句话说，状态栏将会出现。


    你所做的是告诉 tmux 将选项 `status` 设置为值 `off`。你可以使用此命令以这种方式即时设置任何 tmux 选项。没有状态栏可能会有点不安，所以让我们把它重新打开：


    ```

    $ tmux set-option status on

    ```


    如果我们希望这些配置选项在 tmux 重启和会话之间保持不变，我们需要某种方法告诉 tmux 它们的值应该是什么。我们将通过创建 tmux 配置文件来做到这一点。


    ### Creating a tmux configuration file


    为了在重新启动 tmux 后保留设置，我们将创建一个配置文件，其中包含我们想要设置的所有选项及其值的相关信息。


    像许多其他基于 Unix 的实用程序一样，配置 tmux 只需在你的主目录中创建一个名为 .tmux.conf 的文件即可。


    然而，与许多其他配置文件不同，tmux 配置文件不包含程序的某种特定配置语言，而是由一系列在 tmux 启动时按顺序运行的 tmux 命令组成。我们将看到的大多数命令都是简单的
    set-option 命令，类似于我们在前面的示例中玩过的命令。让我们创建并开始构建我们的配置文件：


    ```

    $ cd ~

    $ touch .tmux.conf

    ```


    在你喜欢的文本编辑器中打开这个新创建的文件，我们就可以开始了！


    > 与大多数基于 Unix 的实用程序一样，你个人目录中的此文件仅包含你自己的用户的配置。

    > 也可以设置将应用于系统所有用户的全局 tmux 配置。它遵循与个人配置文件相同的格式，但通常位于 /etc/tmux.conf。

    > 然而，由于系统上并非所有用户都想要相同的全局配置，最好只修改你自己的个人配置。


    ### Emacs or vi mode


    正如我们在第 1 章 Jump Right In 中发现的那样，tmux 试图通过为两种最广泛使用的文本编辑器各提供一套键绑定来帮助开发者。如果你更倾向于其中一种，这很可能是你想要首先更改以使
    tmux 对你感觉正确的事情之一。


    tmux 的默认设置是使用 Emacs 模式键，所以如果你是 Emacs 用户，你可能已经准备就绪。tmux 也会尝试提供帮助，并可能基于环境变量默认切换到其中一组或另一组。要检查
    tmux 当前处于哪种模式，运行以下命令：


    ```

    $ tmux show-options -g | grep key

    ```


