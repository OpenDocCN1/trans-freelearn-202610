  - '[PAGE 22]


    However, you should notice that now there is a bar along the bottom of your terminal
    window. This can be seen in the following screenshot of the terminal window:


    ![](img/5969098f450265ac0c7947efcdbe7889_22_0.png)


    Congratulations! You''re now running tmux.


    That bar along the bottom is provided by tmux. We call this bar the status line.
    The status line gives you information about the session and window you are currently
    viewing, which other windows are available in this session, and more.


    Some of what''s on that line may look like gibberish now, but we''ll learn more
    about what things mean as we progress through this book. We''ll also learn how
    to customize the status bar to ensure it always shows the most useful items for
    your workflow. These customizations include things that are a part of tmux (such
    as the time, date, server you are connected to, and so on) or things that are
    in third-party libraries (such as the battery level of your laptop, current weather,
    or number of unread mail messages).


    # Sessions


    By running tmux with no arguments, you create a brand new session. In tmux, the
    base unit is called a session. A session can have one or more windows. A window
    can be broken into one or more panes. We''ll revisit this topic in its own whole
    chapter (for more information, refer to Chapter 3, Sessions, Windows, and Panes);
    however, as a sneak preview, what we have here on the current screen is a single
    pane taking up the whole window in a single session. Imagine that it could be
    split into two or more different terminals, all running different programs, and
    each visible split of the terminal is a pane. More on this will be covered in
    the later chapters.'
  - '[PAGE 23]


    # What is a session in tmux?


    It may be useful to think of a tmux session as a login on your computer.


    You can log on to your computer, which initiates a new session. After you log
    on by entering your username and password, you arrive at an empty desktop. This
    is similar to a fresh tmux session. You can run one or more programs in this session,
    where each program has its own window or windows and each window has its own state.


    In most operating systems, there is a way for you to log out, log back in, and
    arrive back at the same session, with the windows just as you left them. Often,
    some of the programs that you had opened will continue to run in the background
    when you log out, even though their windows are no longer visible.


    A session in tmux works in much the same way. So, it may be useful to think of
    tmux as a mini operating system that manages running programs, windows, and more,
    all within a session.


    ![](img/5969098f450265ac0c7947efcdbe7889_23_0.png)


    You can have multiple sessions running at the same time. This is convenient if
    you want to have a session for each task you might be working on. You might have
    one for an application you are developing by yourself and another that you could
    use for pair programming. Alternatively, you might have one to develop an application
    and one to develop another. This way everything can be neat and clean and separate.


    # Naming the session


    Each session has a name that you can set or change.


    Notice the [0] at the very left of the status bar? This is the name of the session
    in brackets. Here, since you just started tmux without any arguments, it was given
    the name 0. However, this is not a very useful name, so let''s change it.


    In the prompt, just run the following command:


    ```

    $ tmux rename-session tutorial

    ```'
