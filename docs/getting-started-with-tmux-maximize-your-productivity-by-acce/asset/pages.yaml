- pgno: 94
  md: "Surely, there must be some way to purge that Window history to help prevent\
    \ this. There sure is; it is the tmux command clear-history. Optionally, you can\
    \ provide a target pane, and it will clear the history for that pane. For instance,\
    \ clear-history -t 1 will clear the history for pane 1 even if that is not your\
    \ currently active pane.\n\n> While clearing the history, it will clear everything\
    \ that was in the Window history that scrolled out of that pane, but it will retain\
    \ everything that is currently visible in that pane. To clear the history and\
    \ everything in that pane, it is best to run the Unix command clear first to push\
    \ it off the screen, then the tmux command clear-history to flush everything.\n\
    > \n> Note that if there is extremely sensitive information that needs to be cleared,\
    \ it may be best to restart tmux after you clear the Window history. This sensitive\
    \ information, while expunged from the Window history and therefore not available\
    \ in Copy mode, could still potentially be sniffed by a very capable hacker. Its\
    \ bits may linger and be salvageable from a tmux memory dump, so restarting tmux\
    \ is the only way to be entirely sure that it is gone from the memory as well.\
    \ While this is a case that is quite on the fringe, it bears mentioning.\n\n![](img/5969098f450265ac0c7947efcdbe7889_94_0.png)\n\
    \n# An advanced session and window usage\n\nBack when we discussed sessions, we\
    \ walked through how to switch from one session to another. What we didn't cover\
    \ were some more advanced things such as switching from one window in one session\
    \ directly to another specific window in another session, moving windows between\
    \ sessions and sharing windows between sessions.\n\n# Jumping from one window\
    \ in a session to another window in another session\n\nA couple of chapters back,\
    \ we discussed switching between multiple sessions using <Prefix>, s to bring\
    \ up the list of sessions and select any of them.\n\nOK! So let's get set up a\
    \ bit. We'll need two active sessions with a couple of windows each. If you followed\
    \ along the previous section, we should already have one active session; let's\
    \ create another session using the tmux command, new-session -s \"Another\".\n\
    \nNow let's create another window using <Prefix>, c and run some command in it,\
    \ for instance, top:\n\n```\n$ top\n```"
  merge: -1
  img_proc: true
- pgno: 95
  md: 'The output of this command is shown in the following screenshot:


    ![](img/5969098f450265ac0c7947efcdbe7889_95_0.png)


    Let''s switch back to our other session with <Prefix>, s and then highlight and
    select the other session we want, as shown here:


    ![](img/5969098f450265ac0c7947efcdbe7889_95_1.png)


    Jump onto the other session (Advanced, as shown in the preceding screenshot).
    Now if we do the same thing again, using <Prefix>, s and switch back to the Another
    session, we will arrive back in Another, in window 2 that is running top. This
    is because tmux will take us back to the last window we were viewing in an active
    session.


    However, what if we wanted to move directly from one session to a specific window
    in another? Surely, we should not have to switch to the session and then select
    the window. Well, we can directly choose a window within a session, and tmux actually
    makes this a breeze.'
