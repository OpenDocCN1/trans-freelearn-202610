- pgno: 131
  md: '# Appendix


    The appendix will cover the following three topics:


    +   - Why tmux?

    +   - The configuration reference

    +   - Key binding and command reference


    # Why tmux?


    Many developers spend much of their day in a terminal. Whether using it for coding;
    SSH sessions to remote servers; browsing the filesystem; local tasks such as checking,
    compiling, or linting code, running unit tests; or even for mail or Internet Relay
    Chat (IRC), the terminal is one of the most widely used weapons in the developer''s
    arsenal.


    tmux is a command-line application that runs within your terminal and turbocharges
    it. Its powerful features allow for the simplification of many everyday tasks,
    as illustrated throughout this book. However, the main reason most people use
    a program like tmux is that it allows you to take a single terminal window and
    turn it into many virtual windows, each having their own state. It is one in a
    class of applications called terminal multiplexers (tmux is just a shortening
    of this term). It has some brethren, but the most prominent is GNU Screen.


    Remember browsing in web browsers without tabs? If you answered no, you weren''t
    missing much, and enjoy your youth! However, if you answered yes, it might take
    you a second to remember how much less convenient it was. Sure, there was nothing
    you can do with multiple tabs that you couldn''t with no tabs and many browser
    windows, but it was still a very helpful boost to productivity to be able to group
    them together. Having many browser windows got very confusing. The advent of tabs
    allowed you to separate your browsing experience logically. Before tabs you would
    have had one browser window for reference documents, another for shopping, and
    so on.'
  merge: -1
  img_proc: true
- pgno: 132
  md: 'Likewise, a terminal multiplexer such as tmux allows you to do the same, logically
    grouping multiple windows into a single terminal window, like tabs in a browser.
    Just as each browser tab contains its own state, so does each tmux window.


    However, unlike browser tabs, which mostly just add organization, tmux actually
    adds a rich set of additional functionality to the terminal. Not only does tmux
    allow for dividing a window into panes so that multiple different bits of content
    can be on the screen at the same time, but tmux also adds Copy mode and other
    constructs that allow heavy terminal users to do more without leaving tmux or
    even having to reach for their mouse as often. We touch on many of these benefits
    throughout this book, so it''s unnecessary to repeat them here.


    Why use a terminal multiplexer over a standard terminal app with native tabs (for
    example, OS X Terminal, iTerm, Gnome Terminal, and so on)? There are many reasons,
    but the following are a few:


    +   - The addition of Copy mode allows for copying and pasting between terminal
    windows without reaching for your mouse. This is not something that can be easily
    achieved with a standard tabbed terminal application.

    +   - The addition of the saved state means that you can close a terminal window
    that is running tmux, and your entire session state will be saved and can be reattached
    later (assuming your terminal program allows the tmux server to continue running
    in the background; not all do). Any programs that were running continue running
    in the background. This is not the case with tabs in iTerm, OS X Terminal, or
    any Linux terminal. Closing one of these will drop your state for that window.

    +   - There is much more power and flexibility to using tmux to split a window
    into panes and rearranging those panes than in using any tabbed terminal interface.
    Most modern terminal applications will now support simply a vertical or horizontal
    split, and that''s about it. With tmux, the possibilities are (nearly) endless
    in terms of the number of splits, layouts, and so on.

    +   - All of the tmux keyboard shortcuts for changing the size and layout of these
    splits translate into less dependence on your mouse, which is something most normal
    tabbed terminal applications cannot offer.

    +   - Not only are there more shortcuts with tmux for tweaking the size of this
    or that, but tmux also offers a much broader range of customizability in terms
    of keyboard shortcuts for every operation it can handle. Literally, every single
    tmux shortcut can be changed or rewired with a simple configuration file, as shown
    in Chapter 2, Configuring tmux. Some terminal applications might offer some customization,
    but none are quite as powerful as tmux in this regard.'
  merge: -1
  img_proc: true
