- pgno: 118
  md: 'A sample usage would be to run a command like the following:


    ```

    $ cat Sonnet16.text | pbcopy

    ```


    This command will print out the contents of the Sonnet16.text file and pipe them
    into the pbcopy program, which will then make the contents of that file easy to
    be pasted in OS X in any program with simply ⌘ + v.


    The problem is that if you try this trick within a tmux session, it won''t work!
    This is because the OS X Pasteboard doesn''t play nicely. A short way to explain
    it is that because tmux runs its server as a daemon (which is what allows you
    to detach then reattach with it still running), OS X denies permission for it
    to access the Pasteboard. This is done for security purposes, so other programs
    running in the background are unable to access the Pasteboard. However, programs
    we''d like to have access to the Pasteboard, such as tmux, cannot access it without
    some tricks.


    > For the more information, see this lengthy description in README for a utility
    that fixes the issue: https://github.com/ChrisJohnsen/tmux-MacOSX-pasteboard#mac-os-x-pasteboard-access-under-tmux-and-screen.


    However, since we do want tmux to have access to the OS X Pasteboard, surely there
    must be some way around this security restriction! Thankfully, some smart minds
    have come before us and solved the problem.


    It''ll take two steps. First, we''ll install the small utility program. Second,
    we''ll update our .tmux.conf file to launch every new window using this utility.


    Let''s first install the program. If you are a developer, you may already have
    Homebrew or MacPorts installed. (If not, we recommend that you install Homebrew:
    http://brew.sh)


    Now, use the following command to install this utility using Homebrew:


    ```

    $ brew install reattach-to-user-namespace

    ```


    You can even use the following command if you prefer MacPorts:


    ```

    $ port install tmux-pasteboard

    ```


    Now, add the following lines to your .tmux.conf file:


    ```

    # Make tmux and OS X Pasteboard play nicely

    set-option -g default-command "reattach-to-user-namespace -l zsh"

    ```'
  merge: -1
  img_proc: true
- pgno: 119
  md: 'Here, `zsh` can be replaced by your shell of choice, so it could be `bash`,
    or `fish`, or any other shell of your choice. By adding these lines to your configuration,
    you are basically telling tmux that any new window it launches should launch with
    that command rather than just a normal new shell. This new command is a shell
    that has been patched to play nicely with the OS X Pasteboard so `pbcopy` and
    `pbpaste` work as intended.


    You may notice that this will only work on a system with the `reattach-to-user-namespace`
    utility installed and will cause issues on Linux or another Mac that did not have
    that installed. This can be remedied by using the following formulation instead:


    ```

    if-shell ''test -x /usr/local/bin/reattach-to-user-namespace'' ''set-option -g
    default-command "reattach-to-user-namespace -l zsh"''

    ```


    This will run only on systems that have this `reattach-to-user-namespace` command.
    The `if-shell` bit is a very useful little tmux command that will run the second
    command that follows it, provided the first command that follows it returns success.
    In our case, using the `test -x` command allows us to check and see whether the
    `reattach-to-user-namespace` file exists. If it does, it runs the tmux `set-option`
    to use the fixed item. If not, it runs nothing, so it will not break on systems
    that do not have this script.


    # tmux configuration from the maximum-awesome project, by Square


    While we''re on the topic of configuration, we should discuss the maximum-awesome
    project, and the configuration files for Vim and tmux from the folks at Square.
    Square specializes in payments and is very active in the open source community.


    They have put a ton of thought and effort over the years into curating what they
    consider to be the ideal configuration for Vim and tmux and they have it freely
    available on GitHub: https://github.com/square/maximum-awesome.


    Be forewarned, their configuration is rather Vim opinionated, but that caveat
    aside, they have baked up a truly awesome set of configurations.


    Our favorite thing about these configuration files is that they provide a good
    set of defaults and recently added support for a `.tmux.conf.local` file intended
    for user overrides and custom commands. They are both great drop-in configuration
    files and great sources of inspiration for creating your own configuration.'
  merge: -1
  img_proc: true
- pgno: 120
  md: 'So let''s give maximum-awesome a go. Navigate to a directory where you can
    clone this repository. For example, we''ll do it in our home directory. Enter
    the following command to get started:


    ```

    $ cd

    ```


    Then, clone the repository with the following command:


    ```

    $ git clone https://github.com/square/maximum-awesome.git

    ```


    Next, change into that directory:


    ```

    $ cd maximum-awesome

    ```


    Run the rake command to install the project:


    ```

    $ rake

    ```


    > Here, rake is short for the Ruby command make and it is the ruby analogue to
    make. If you do not have it installed, it can be installed with the command gem
    install rake. If you do not have gem installed, look to the RubyGems website for
    instructions: https://rubygems.org/pages/download.


    Now, the gems should be installed! Now if you launch tmux, you''ll be in maximum-awesome''s
    configuration.


    > Also, be forewarned that loading maximum-awesome can wipe out your locally configured
    .tmux.conf file (since the whole point, in essence, is that it is an awesome .tmux.conf
    file). So be sure to back up your .tmux.conf file before running this command.


    # Using tmuxinator to make session management easier


    In Chapter 5, Diving Deeper, we touched a bit on starting tmux with some default
    session configuration in the Launch with defaults section.


    You may have noticed that even a rather simple configuration turned out to be
    a bit complex and tricky. This is one of those areas of core tmux that leaves
    a little to be desired.'
  merge: -1
  img_proc: true
- pgno: 121
  md: 'Thankfully, the open source world has stepped up to the plate and created an
    excellent utility called *tmuxinator* to make this kind of configuration far simpler.


    Built in ruby, tmuxinator is easy to install and provides a ton of useful capability.
    It does so by allowing you to specify in a simple and intuitive YAML syntax how
    you''d like your window laid out, any programs that should be run on launch, and
    more. tmuxinator allows you to create hooks that run before any window configuration
    is run and makes it much, much easier to specify a set of default windows and
    panes than in core tmux.


    Let''s run through the workflow of installing and creating a sample tmuxinator
    configuration file.


    # Installing tmuxinator


    Since it is built in ruby, it''s available as a ruby gem so installation is a
    breeze. In a command line, simply run:


    ```

    ```sh

    $ gem install tmuxinator

    ```

    ```


    > Depending on your system setup, you may have to use sudo to install gems. We''d
    suggest trying without sudo first, then falling back to it if the installation
    fails.


    tmuxinator helpfully tells us during install that it includes a tmuxinator doctor
    command that can be used to check your local system configuration and ensure all
    is well. We recommend running that now and fixing any issues it finds:


    ```

    ```sh

    $ tmuxinator doctor

    ```

    ```


    When you see all items confirmed as **Yes**, you can move on.


    # Understanding the tmuxinator configuration


    First, open a terminal and run the following command to create the initial tmuxinator
    configuration file:


    ```

    ```sh

    $ tmuxinator new tutorial

    ```

    ```


    The tmuxinator new command will start a new tmuxinator configuration file and
    we gave it the name `tutorial`. Feel free to name your file whatever you''d like
    of course.'
  merge: -1
  img_proc: true
- pgno: 122
  md: "You'll be dropped right into your editor of choice with the default contents\
    \ of a tmuxinator configuration file already in your editor. A few things to note\
    \ about this file:\n\n+   - It is located in ~/.tmuxinator/<name>.yml (in our\
    \ case ~/tmuxinator/tutorial.yml). This is where tmuxinator will store all of\
    \ its configuration files. This is nice because you can have multiple configuration\
    \ files and they will all live in one place and be accessible by tmuxinator.\n\
    +   - After a couple lines, there are a bunch of comments. These comments indicate\
    \ options that could be used but aren't by default. We will dig into these in\
    \ a bit.\n+   - At the bottom of the file is the YAML that actually lays out the\
    \ windows, panes, and so on. tmuxinator includes a default set of layouts.\n\n\
    tmuxinator includes its own kind of domain-specific language to build a rich configuration\
    \ of windows, panes, and the default programs to run in them.\n\nFor example,\
    \ what follows is a sample configuration file. We have added useful comments starting\
    \ with # before each line to describe what the following line is doing:\n\n```\n\
    # sets the name for this tmuxinator config\nname: tutorial\n# sets the root directory,\
    \ all new panes will start with a\n# terminal opened to this directory\nroot:\
    \ ~/\n\n# this is the start of the specification for which windows\nwindows:\n\
    \  # this specifies the first window named \"editor\"\n  - editor:\n    # the\
    \ \"editor\" window should have a vertical layout\n    layout: main-vertical\n\
    \    # this specifies that the \"editor\" window should have two\n    # panes\n\
    \    panes:\n      # emacs should be running in one pane\n      - emacs\n    \
    \  # top should be running in the other pane\n      - top\n  # now we have a second\
    \ window called \"server\" that should start\n  # running the command \"node ~/myapp.js\"\
    \ on opening\n  - server: node ~/myapp.js\n  # there should be a third window\
    \ called \"logs\" which should\n  # start with the tail command to view the logs\n\
    \  - logs: tail -f log/development.log\n```"
  merge: -1
