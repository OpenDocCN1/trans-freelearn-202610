- pgno: 29
  md: "Sure enough, now window 1 is active and everything is present, just as we left\
    \ it. Now we typed some silly commands here, but it could just as well have been\
    \ an active running process here, such as unit tests, code linting, or top. Any\
    \ such process would run in the background in tmux without an issue.\n\n![](img/5969098f450265ac0c7947efcdbe7889_29_0.png)\n\
    \n> This is one of the most powerful features of tmux.\n> \n> In the traditional\
    \ world, to have a long-running process in a terminal window and get some stuff\
    \ done in a terminal, you would need two different terminal windows open; if you\
    \ accidentally close one, the work done in that window will be gone.\n> \n> tmux\
    \ allows you to keep just one terminal window open, and this window can have a\
    \ multitude of different windows within it, closing all the different running\
    \ processes. Closing this terminal window won't terminate the running processes;\
    \ tmux will continue humming along in the background with all of the programs\
    \ running behind the scenes.\n\n# Help on key bindings\n\nNow a keen observer\
    \ may notice that the trick of entering the window number will only work for the\
    \ first 10 windows. This is because once you get into double digits, tmux won't\
    \ be able to tell when you're done entering the number. If this trick of using\
    \ the prefix key plus the number only works for the first 10 windows (windows\
    \ 0 to 9), how will we select a window beyond 10?\n\nThankfully, tmux gives us\
    \ many powerful ways to move between windows. One of my favorites is the choose\
    \ window interface.\n\nHowever, oh gee! This is embarrassing. Your author seems\
    \ to have entirely forgotten the key combination to access the choose window interface.\
    \ Don't fear though; tmux has a nice built-in way to access all of the key bindings.\
    \ So let's use it!\n\nPress <Prefix>, ? to see your screen change to show a list\
    \ with bind-key to the left, the key binding in the middle, and the command it\
    \ runs to the right. You can use your arrow keys to scroll up and down, but there\
    \ are a lot of entries there!\n\nThankfully, there is a quicker way to get to\
    \ the item you want without scrolling forever."
  merge: -1
  img_proc: true
- pgno: 30
  md: 'Press Ctrl + s and you''ll see a prompt appear that says Search Down:, where
    you can type a string and it will search the help document for that string.


    # Emacs or vi mode


    tmux tries hard to play nicely with developer defaults, so it actually includes
    two different modes for many key combinations tailored for the two most popular
    terminal editors: Emacs and vi. These are referred to in tmux parlance as status-keys
    and mode-keys that can be either Emacs or vi.


    The tmux default mode is Emacs for all the key combinations, but it can be changed
    to vi via configuration, something we''ll cover in Chapter 2, Configuring tmux.
    It may also be set to vi automatically based on the global $EDITOR setting in
    your shell.


    If you are used to Emacs, Ctrl + s should feel very natural since it''s the command
    Emacs uses to search.


    So, if you try Ctrl + s and it has no effect, your keys are probably in the vi
    mode. We''ll try to provide guidance when there is a mode-specific key like this
    by including the vi mode''s counterpart in parentheses after the default key.


    For example, in this case, the command would look like Ctrl + s (/) since the
    default is Ctrl + s and / is the command in the vi mode.


    Type in choose-window and hit Enter to search down and find the choose-window
    key binding. Oh look! There it is; it''s w:


    ![](img/5969098f450265ac0c7947efcdbe7889_30_0.png)


    However, what exactly does that mean?


    Well, all that means is that we can type our prefix key (<Prefix>), followed by
    the key in that help document to run the mentioned command. First, let''s get
    out of these help docs. To get out of these or any screens like them, generated
    by tmux, simply press q for quit and you should be back in the shell prompt for
    window 2.'
  merge: -1
  img_proc: true
- pgno: 31
  md: "If you ever forget any key bindings, this should be your first step.\n\n> A\
    \ nice feature of this key binding help page is that it is dynamically updated\
    \ as you change your key bindings.\n> \n> Later, when we get to **Configuration**,\
    \ you may want to change bindings or bind new shortcuts. They'll all show up in\
    \ this interface with the configuration you provide them with.\n> \n> Can't do\
    \ that with manpages!\n\nNow, to open the choose window interface, simply type\
    \ <Prefix>, w since w was the key shown in the help bound to **choose-window**\
    \ and voilà:\n\n![](img/5969098f450265ac0c7947efcdbe7889_31_0.png)\n\nNotice how\
    \ it nicely lays out all of the currently open windows in a task-manager-like\
    \ interface.\n\nIt's interactive too. You can use the arrow keys to move up and\
    \ down to highlight whichever window you like and then just hit Enter to open\
    \ it. Let's open the window with nano running. Move up to highlight window 0 and\
    \ hit Enter.\n\nYou may notice a few more convenient and intuitive ways to switch\
    \ between the currently active windows when browsing through the key bindings\
    \ help. For example, <Prefix>, p will switch to the previous window and <Prefix>,\
    \ n will switch to the next window. Whether refreshing your recollection on a\
    \ key binding you've already learnt or seeking to discover a new one, the key\
    \ bindings help is an excellent resource."
  merge: -1
  img_proc: true
- pgno: 32
  md: '# Searching for text


    Now we only have three windows so it''s pretty easy to remember what''s where,
    but what if we had 30 or 300? With tmux, that''s totally possible. (Though, this
    is not terribly likely or useful! What would you do with 300 active windows?)


    One other convenient way to switch between windows is to use the **find-window**
    feature. This will prompt us for some text, and it will search all the active
    windows and open the window that has the text in it.


    If you''ve been following along, you should have the window with nano currently
    open (window 0). Remember we had a shell in window 1 where we had typed some silly
    commands? Let''s try to switch to that one using the **find-window** feature.


    Type `<Prefix>, f` and you''ll see a **find-window** prompt as shown in the following
    screenshot:


    ![](img/5969098f450265ac0c7947efcdbe7889_32_0.png)


    Here, type in `cat test` and hit *Enter*.


    You''ll see you''ve switched to window 1 because it had the `cat test` command
    in it.


    However, what if you search for some text that is ambiguous? For example, if you''ve
    followed along, you will see the word **test** appear multiple times on both windows
    0 and 1. So, if you try **find-window** with just the word **test**, it couldn''t
    magically switch right away because it wouldn''t know which window you mean.


    Thankfully, tmux is smart enough to handle this. It will give you a prompt, similar
    to the *choose-window* interface shown earlier, but with only the windows that
    match the query (in our case, windows 0 and 1; window 2 did not have the word
    test in it). It also includes the first line in each window (for context) that
    had the text.'
  merge: -1
  img_proc: true
- pgno: 33
  md: '![](img/5969098f450265ac0c7947efcdbe7889_33_0.png)


    Pick window 0 to open it.


    # Detaching and attaching


    Now press <Prefix>, d.


    Uh oh! Looks like tmux is gone! The familiar status bar is no more available.
    The <Prefix> key set does nothing anymore.


    ![](img/5969098f450265ac0c7947efcdbe7889_33_1.png)


    You may think we the authors have led you astray, causing you to lose your work.
    What will you do without that detailed document you were writing in nano?


    Fear not explorer, we are simply demonstrating another very powerful feature of
    tmux. <Prefix>, d will simply detach the currently active session, but it will
    keep running happily in the background!


    Yes, although it looks like it''s gone, our session is alive and well.


    How can we get back to it? First, let''s view the active sessions. In your terminal,
    run the following command:


    ```

    $ tmux list-sessions

    ```'
  merge: -1
  img_proc: true
- pgno: 34
  md: 'You should see a nice list that has your session name, number of windows, and
    date of creation and dimensions. If you had more than one session, you''d see
    them here too.


    ![](img/5969098f450265ac0c7947efcdbe7889_34_0.png)


    To re attach the detached session to your session, simply run the following command:


    ```

    $ tmux attach-session -t tutorial

    ```


    This tells tmux to attach a session and the session to attach it to as the target
    (hence -t). In this case, we want to attach the session named tutorial. Sure enough,
    you should be back in your tmux session, with the now familiar status bar along
    the bottom and your nano masterpiece back in view.


    Note that this is the most verbose version of this command. You can actually omit
    the target if there is only one running session, as is in our scenario. This shortens
    the command to tmux attach-session. It can be further shortened because attach-session
    has a shorter alias, attach. So, we could accomplish the same thing with just
    tmux attach.


    Throughout this text, we will generally use the more verbose version, as they
    tend to be more descriptive, and leave shorter analogues as exercises for the
    reader.


    # Explaining tmux commands


    Now you may notice that attach-session sounds like a pretty long command. It''s
    the same as list-sessions, and there are many others in the lexicon of tmux commands
    that seem rather verbose.'
  merge: -1
  img_proc: true
- pgno: 35
  md: '# Tab completion


    There is less complexity to the long commands than it may seem because most of
    them can be tab-completed. Try going to your command prompt and typing the following:


    ```

    $ tmux list-se

    ```


    Next, hit the Tab key. You should see it fill out to this:


    ```

    $ tmux list-sessions

    ```


    So thankfully, due to tab completion, there is little need to remember these long
    commands.


    Note that tab completion will only work in certain shells with certain configurations,
    so if the tab completion trick doesn''t work, you may want to search the Web and
    find a way to enable tab completion for tmux.


    # Aliases


    Most of the commands have an alias, which is a shorter form of each command that
    can be used. For example, the alias of list-sessions is ls. The alias of new-session
    is new.


    You can see them all readily by running the tmux command list-commands (alias
    lscm), as used in the following code snippet:


    ```

    $ tmux list-commands

    ```


    This will show you a list of all the tmux commands along with their aliases in
    parenthesis after the full name.


    Throughout this text, we will always use the full form for clarity, but you could
    just as easily use the alias (or just tab complete of course).


    One thing you''ll most likely notice is that only the last few lines are visible
    in your terminal. If you go for your mouse and try to scroll up, that won''t work
    either! How can you view the text that is placed above? We will need to move into
    something called the Copy mode that has its own chapter later in this text (See
    Chapter 4, Manipulating Text).


    # Renaming windows


    Let''s say you want to give a more descriptive name to a window. If you had three
    different windows, each with the nano editor open, seeing nano for each window
    wouldn''t be all that helpful.'
  merge: -1
  img_proc: true
- pgno: 36
  md: '# Jump Right In


    Thankfully, it''s very easy to rename a window. Just switch to the window you''d
    like to rename. Then <Prefix>, will prompt you for a new name. Let''s rename the
    nano window to masterpiece.


    See how the status line has been updated and now shows window 0 with the masterpiece
    title as shown in the following screenshot. Thankfully, tmux is not smart enough
    to check the contents of your window; otherwise, we''re not sure whether the masterpiece
    title would make it through.


    ![](img/5969098f450265ac0c7947efcdbe7889_36_0.png)


    # Killing windows


    As the last stop on our virtual tour, let''s kill a window we no longer need.
    Switch to window 1 with our find-window trick by entering <Prefix>, f, cat test,
    Enter or of course we could use the less exciting <Prefix>, l command to move
    to the last opened window.


    Now let''s say goodbye to this window. Press <Prefix>, & to kill it. You will
    receive a prompt to which you have to confirm that you want to kill it.


    This is a destructive process, unlike detaching, so be sure anything you care
    about has been saved.


    Once you confirm it, window 1 will be gone. Poor window 1! You will see that now
    there are only window 0 and window 2 left:


    ![](img/5969098f450265ac0c7947efcdbe7889_36_1.png)'
  merge: -1
  img_proc: true
- pgno: 37
  md: 'You will also see that now <Prefix>,f, cat test, Enter no longer loads window
    1 but rather says **No windows matching: cat test**. So, window 1 is really no
    longer with us.


    Whenever we create a new window, it will take the lowest available index, which
    in this case will be 1. So window 1 can rise again, but this time as a new and
    different window with little memory of its past. We can also renumber windows
    as we''ll see later, so if window 1 being missing is offensive to your sense of
    aesthetics, fear not, it can be remedied!


    # Summary


    In this chapter, we got to jump right in and get a whirlwind tour of some of the
    coolest features in tmux.


    Here is a quick summary of the features we covered in this chapter:


    +   - Starting tmux

    +   - Naming and renaming sessions

    +   - The window string and what each chunk means

    +   - Creating new windows

    +   - The prefix key

    +   - Multiple ways to switch back and forth between windows

    +   - Accessing the help documents for available key bindings

    +   - Detaching and attaching sessions

    +   - Renaming and killing windows


    In the next chapter, we will look into configuration and many of the ways tmux
    can be customized to fit your tastes and workflow.


    For a reference of all the commands learned in this chapter and every following
    chapter, you can refer to the *Key binding and command reference* section in *Appendix.*'
  merge: -1
  img_proc: true
