- pgno: 99
  md: 'Note that if you do this, killing a pane or window in one place will kill it
    at both the places.


    To later remove a window from one session but not the other, you will need to
    unlink the window rather than kill it by using the tmux command, unlink-window.


    # Breaking panes


    The act of taking a pane within a window and moving it to its own window is called
    breaking that pane. It can be accomplished with the tmux command break-pane or
    the keys <Prefix>, !.


    By default, the break-pane command will operate on the currently selected pane;
    however, any arbitrary pane can be specified using the same syntax we saw in the
    previous example to select a window within a session, specifically separating
    the session and window name by a colon. However, of course, a pane also has an
    index, which can be added after the window separated by a period. This all sounds
    complex, but it is actually rather intuitive.


    For example, to select pane 2 in window 1 in the session Advanced and break it
    into its own window, we could use the command break-pane -s Advanced:1.2.


    Remember that you can see the current pane indexes flash on the screen briefly
    with the key binding <Prefix>, q.


    When you break a pane, tmux automatically switches the window to select the window
    that now contains that pane.


    # Joining panes


    In addition to linking windows between one session and another, you can also do
    something called joining panes. The name can seem a bit misleading at first, but
    essentially, this is used to take a pane in one window and move it to another
    window.


    It can be used to move one pane in a multipaned window to another window, but
    it can also be used to take a window, which has only one pane, and join it with
    another (now its name is probably a bit less misleading). This is very useful
    if you have two windows running different things but decide you''d prefer them
    as two panes of the same window.'
  merge: -1
  img_proc: true
- pgno: 100
  md: 'For example, let''s say we have a pane running in one window and we want to
    join it with another window. In the simplest case, we could switch to the pane
    we want to join and run the command `join-pane -t :1` where `:1` indicates that
    we want the window in index 1 in the current session. After running this command,
    the window index 1 in the current session will have the contents of any panes
    it had before in addition to the new pane we just joined to it.


    Using the same elaborate `session:window.pane` syntax we saw previously, we can
    specify a source pane and target destination to get really slick about it. Say
    we want to take the pane in the session **Advanced**, window 2, pane 1, and move
    it to the session **Another**, window 1, and not specify a pane number so it defaults
    to the lowest available index. We can do this with the command `join-pane -s Advanced:2.1
    Another:1`


    As you can now see, joining panes is an incredibly powerful tool in your tmux
    arsenal that will allow you to combine multiple panes into one. Now you have learned
    how to break a pane off into its own window, how to combine it with other panes,
    how to move windows and link them between sessions, and more.


    # Launching with defaults


    Imagine you integrate tmux into your workflow such that you get very used to certain
    things being in certain places, perhaps a shell at the root of your code repository
    in window 1, Emacs in window 2, top in window 3, and so on. Now every time you
    reboot your machine, you spend some time to set up everything again, start a new
    session, create three windows, launch the programs in each window, and so on;
    there must be a better way. Of course there is!


    tmux gives us some ways to configure things with nice defaults out of the box.
    We''ll also see another way to do this later in *Chapter 7, Using Other Tools
    with tmux*, with a third-party utility.


    So let''s take the previous example and run through it. There are ways to make
    some of this happen within your `.tmux.conf` file but it''s generally more powerful
    to do it externally via a separate bash script. So hop into your favorite editor
    and start editing a new file named `.tmux.defaults`. You can name this file anything,
    so if you have multiple sessions you may want to name it based on the session
    name.


    Now let''s specify our configuration. In this file, copy the following code:


    ```

    new -n term zsh

    neww -n emacs emacs

    neww -n htop htop

    ```'
  merge: -1
  img_proc: true
- pgno: 101
  md: 'Of course, your commands may be slightly different based on your system configuration
    and what you would like to run by default.


    Now, to run with this configuration file, start tmux as follows:


    ```

    $ tmux source-file ~/.tmux.defaults

    ```


    That''s it! You''ll see yourself get started in a new session with three windows:
    the first running a terminal, the second in Emacs, and the third in top.


    Again, you can create multiple configurations like this by simply creating multiple
    files, one for each session you''d like to automate.


    > For more details on launching tmux with defaults, check out the tmux manual
    section on session initialization: https://wiki.archlinux.org/index.php/Tmux#Session_initialization


    It is possible to create more complex session initializations than our previous
    example, but complex configurations are often tasks better suited to third-party
    tools, as we will see in Chapter 7, Using Other Tools with tmux.


    # Summary


    In this chapter, we revisited a handful of tmux topics, going into far more depth
    than we were able to in earlier chapters. At this point, you should have a great
    grasp and depth of information on paste buffers, sessions, windows, panes, and
    all of the other topics we covered in great depth here.


    In the next chapter, we will not learn more about the mechanics of tmux itself,
    but rather a bunch of tricks and tips for its use that can help maximize your
    productivity.'
  merge: -1
  img_proc: true
