- pgno: 71
  md: "![](img/5969098f450265ac0c7947efcdbe7889_71_0.png)\n\nLet's try resizing the\
    \ panes by some decent increments. Get the cursor over to the Date window, either\
    \ using <Prefix>, arrow keys or <Prefix>, o.\n\nNow to resize it, let's try <Prefix>,\
    \ Meta and the right arrow key. You should see the rightmost pane get a bit smaller.\
    \ Try it again and it gets even smaller. Try <Prefix>, Meta and the left arrow\
    \ key, and you should see the rightmost pane get a bit larger.\n\n> If you look\
    \ at your keyboard and see no Meta key, you are not missing anything; it does\
    \ not exist on most keyboards.\n> \n> Meta is a key often used in terminal programs\
    \ that historically had a place on the keyboard, but no longer.\n> \n> Both iTerm\
    \ and the stock terminal program on Mac have the choice to use the Option key\
    \ as Meta. Other operating systems often have some way of using the Alt key as\
    \ Meta.\n> \n> Though this may seem confusing, we use Meta in this book because\
    \ that is the way it is referred to historically, and more importantly, because\
    \ this is the key referred to in the tmux documentation.\n\nThankfully, you don't\
    \ actually have to type the prefix key every time you want to resize it a little\
    \ bit; as soon as you start resizing, you can just type the command to increase\
    \ or decrease over and over without the prefix key. So start by using <Prefix>,\
    \ Meta and the right arrow key, then you should be able to change the panes by\
    \ holding down the Meta key and by pressing the left arrow key, the right arrow\
    \ key, or the left arrow key. You will see the panes expand and contract without\
    \ having to stop and type the prefix key each time.\n\nThis is one way to change\
    \ the size of a pane. This is actually changing it in steps of five cells at a\
    \ time (each cell being basically the space of one mono-spaced character)."
  merge: -1
  img_proc: true
- pgno: 72
  md: '# Sessions, Windows, and Panes


    It''s also possible to be a bit fine-grained with it, changing the size in steps
    of one cell at a time. Simply press <Prefix>, Ctrl and the arrow key. However,
    this will move in much smaller increments and will also conflict with the command
    to switch between spaces on OS X.


    If you have followed along with *Chapter 2, Configuring tmux*, and turned on the
    mode-mouse option along with the mouse-select-pane and mouse-resize-pane options,
    you can also use your mouse to select the active pane. You can do this by just
    clicking on the active pane and resizing the panes by clicking and dragging them
    on to the active pane. While this has the downside of reaching for your mouse,
    it can be the easiest way to rapidly arrive at a desired pane configuration.


    # Switching between panes by number


    Now that we have so many panes, switching between them can get a bit unwieldy.
    The arrow keys are pretty nice but can still be a tad annoying. Thankfully, there
    is an easier way. Press <Prefix>, q and you will see a number appear in each pane
    and then disappear shortly thereafter.


    The currently active pane will be of a different color than the other panes. This
    will also show the dimensions of each pane.


    Just as each window was assigned a unique number, so also each pane is assigned
    with a unique number in every window. If you press <Prefix>, q again and, before
    the numbers disappear, type the number that appears in that pane, you''ll automatically
    switch to it.


    By default, the duration for these numbers to remain on the screen is 1 second,
    but you can change that by adding the following option to your .tmux.conf file:


    ```

    set-option -g display-panes-time 3000

    ```


    This will extend the time that the pane numbers are displayed on screen to 3000
    ms or 3 seconds, allowing you more time to select a pane by its index.


    So, to jump to the pane with the word Apple typed in it, simply press <Prefix>,
    q, and 1. It does not matter which pane you were in previously since this pane
    is given an index of 1; using that key combo will jump to that pane.


    # Cycling through pane layouts


    tmux provides us with a few different ways to change the pane layout automatically
    so you don''t have to meticulously split and resize in odd ways to get to your
    desired result.'
  merge: -1
  img_proc: true
- pgno: 73
  md: 'The most versatile of the bunch is a key binding that will essentially cycle
    through to a different preset pane layout each time you press a key combination.
    This key combination is <Prefix>, Space bar (cycle through pane layouts).


    Try it out; press <Prefix>, Space bar, and you will see your panes move around.
    The content stays in them, so any programs in them would keep running fine, but
    they get rearranged and resized in different ways each time you use that key combination.


    If you look at the status bar, you will see the name of the layout. There are
    five different preset layouts that you can cycle through; these are even-horizontal,
    even-vertical, main-horizontal, main-vertical, and tiled.


    Until you know what you like for a given use case, cycling through them is a pretty
    good way to see what the possibilities are.


    Once you are comfortable enough with these layouts, you can switch to them directly,
    without cycling through all of them, by pressing <Prefix>, then Meta and the index
    of the preset layout in the previous list. So, for example, you can use <Prefix>,
    Meta + 1 to switch to the even-horizontal view, <Prefix>, Meta + 2 to switch to
    the even-vertical view, and so on.


    # Other pane operations


    There are far too many pane operations, so we''ll not be able to cover all of
    them exhaustively in this book; for most that we''ll not discuss, we implore you
    to dig into the tmux man page:


    ```

    $ man tmux

    ```


    Alternatively, you can refer to them on the Web at http://man.cx/tmux.


    Now that you understand panes, the man page should be very manageable and understandable
    on the topic of panes.


    You can do things like breaking one pane out into its own window; rotating the
    panes; swapping one pane with another; moving a pane to another window; and arranging
    all the panes horizontally, vertically, tiled, and much more.


    There are many more commands to resize panes, many of which don''t even have keyboard
    shortcuts because they''re not used all that much. Of course, you could add your
    own, and if you read Chapter 2, Configuring tmux, you should have all the tools
    in your toolbox to do so.'
  merge: -1
  img_proc: true
- pgno: 74
  md: '# Summary


    In this chapter, we learned a lot about sessions, windows, and panes in tmux.
    We learned how each of these fit into the tmux hierarchy, and we played around
    with them to solidify some of the concepts. We created multiple sessions, split
    windows into multiple panes, moved them around, and learned different ways to
    switch the cursor from one pane to another.


    In the next chapter, we will move on to text manipulation and learn about how
    we can scroll back through the window history, how we can copy text from the window
    history into a paste buffer, and how we can paste that content.'
  merge: -1
  img_proc: true
- pgno: 75
  md: '# # Manipulating Text


    There are two important components of tmux that we are yet to discuss in more
    detail, namely, **Copy mode** and **paste buffers**.


    Copy mode is a mode in tmux that we can switch to; it allows us to select the
    text that already appears on the screen and copy it. Also, it allows us to move
    our cursor anywhere on the screen, even to places that have moved off the screen.


    When an item is copied from Copy mode, it ends up in the paste buffer. As its
    name implies, this is a buffer that exists to hold anything that is copied so
    it can be pasted later.


    Here is a quick summary of the features we will cover in this chapter:


    +   - Window history and how tmux handles text that has moved off screen

    +   - Explaining the two tmux modes

    +     - Scrolling up through the Window history

    +     - Jumping by search or line

    +     - Copying text into the paste buffer

    +   - Interacting with the paste buffer

    +     - Pasting the last copied item

    +     - Viewing the whole paste buffer stack

    +     - Choosing an item to paste interactively


    By the end of this chapter, we will know all about working with text from within
    tmux.'
  merge: -1
  img_proc: true
- pgno: 76
  md: '# Explaining the Window history


    One thing you may have noticed in the previous chapters is that commands with
    too much text output appear to get cut off. You can see the tail end, but the
    rest seems to go above the window. If you try scrolling up, it will not work.
    What is going on here?


    The start of a command is not lost forever. It still exists; it has simply scrolled
    off the screen.


    In order to work its magic and keep everything in a single terminal window, tmux
    has to hide all of the text that won''t fit in the currently viewed pane. It keeps
    all of this text stored in something called **Window history**.


    Think of it like pages in a physical book. A book contains far more text than
    you can see at any given point in time, but to make it manageable, all of that
    text is on pages that aren''t visible at the same time. The one page that is visible
    is the one you have opened.


    Similarly, tmux maintains all of the text that didn''t fit on the pane you are
    currently viewing and tucks it away in the Window history.


    Now, of course, tmux doesn''t need to stack its pages in a way that one is on
    top of the other, like with a traditional book. So, they''re more laid out, one
    above the next, for as long as the history is configured.


    The following illustration helps visualize it:


    ![](img/5969098f450265ac0c7947efcdbe7889_76_0.png)'
  merge: -1
  img_proc: true
- pgno: 77
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 78
  md: '# Manipulating Text


    +   - **Clock mode:** This mode shows the current time and is more of a novelty
    / utility than an actual mode, like the rest. It can be accessed by `<Prefix>,
    t`.

    +   - **Control mode:** This mode allows third-party applications to interact
    with tmux through a text-only protocol.


    In addition, this is where we start to get to the text manipulation goodies within
    tmux. When we drop into Copy mode, we can scroll back to look back through the
    Window history, and we can also access some cool text manipulation tools.


    Let''s walk through a sample workflow with Copy mode.


    # A sample workflow with Copy mode workflow


    If you have followed us from the beginning of the chapter, you should have a tmux
    session started. Let''s first rerun the long-running command we used previously
    to list the available key bindings:


    ```

    ```bash

    $ tmux list-keys

    ```

    ```


    Just as we saw the last time we ran this command, only the last few lines are
    made visible in our current pane. However, now we are armed with a bit of knowledge
    about the Window history and can likely surmise that the remaining lines are there
    but have scrolled off the screen. How can we scroll up and see what that text
    was? Copy mode!


    # Entering Copy mode


    Let''s enter Copy mode so we can scroll back and see the rest of it, which is
    stored in our Window history. Press `<Prefix>, [` to switch back to Copy mode.


    The first thing you''ll notice is a new interface element added to our screen.
    There will be a new box in the upper-right corner of the terminal screen that
    shows **[0/76]**, as shown in the following screenshot:


    ![](img/5969098f450265ac0c7947efcdbe7889_78_0.png)'
  merge: -1
  img_proc: true
- pgno: 79
  md: 'This shows us both the number of lines in the history (76) and the current
    line our cursor is currently on (0).


    Note that these lines are in reverse chronological order, so 0 stands for our
    currently viewed pane, 1 is a line above it, 2 is a line above line 1, and 76
    is way up at the top of our Window history. This helps give context as to where
    in the history we are as we scroll up through it.


    Going back to our Window history diagram, the lines can be thought of as shown
    in the following diagram:


    ![](img/5969098f450265ac0c7947efcdbe7889_79_0.png)


    The first number in the [0/76] bit will show you the index of the lowest visible
    line on the current viewpoint. This can be a bit confusing at times as it seems,
    when you scroll up, that the first number doesn''t start going up until you scroll
    your cursor past the current pane; however, it makes a bit more sense when you
    scroll down and bring the lines into the current view one by one.'
  merge: -1
  img_proc: true
- pgno: 80
  md: '# Moving the cursor around


    Now that you''re in Copy mode, you can move the cursor up, down, left, or right,
    one character at a time. This is, rather intuitively, the up arrow, down arrow,
    left arrow, or right arrow keys or Ctrl + p, Ctrl + n, Ctrl + b, Ctrl + f (k,
    j, h, l). Try moving the cursor around a bit in Copy mode.


    # Emacs or vi style key bindings for Copy mode


    Actually, there are two main ways to bind keys in tmux for Copy mode: Emacs-style
    key bindings or vi-style key bindings.


    This is configurable using the mode-keys option. We will be primarily covering
    the default (Emacs-style) key bindings and will include the vi key binding in
    parenthesis following it. However, note that as we saw in Chapter 1, Jump Right
    In, tmux is smart and may alter the defaults based on your environment variables.
    So, while Emacs is the usual default, you may, without any configuration, be set
    to the vi mode with tmux out of the box, based on another configuration.


    If you are a vi user, know that you can set up vi-style mode keys, and if you
    do, then the keys to browse Copy mode are very much like browsing vi''s normal
    mode.


    The Emacs key bindings for Copy mode can be viewed with the following command:


    ```

    tmux list-keys -t emacs-copy

    ```


    The vi key bindings for Copy mode can be viewed with the following command:


    ```

    tmux list-keys -t vi-copy

    ```


    Alternatively, you can look at the man pages under mode-keys for more details
    on configuring and which key does what (http://man.cx/tmux or man tmux from a
    terminal).


    ![](img/5969098f450265ac0c7947efcdbe7889_80_0.png)


    Now let''s scroll up and see what''s left behind.


    # Scrolling through the Window history


    To scroll up a page, you can use Page Up or Meta + v (Ctrl + b) and you''ll see
    that each time you press it, the number in the upper-right corner changes from
    [0/76] to match wherever you currently are.'
  merge: -1
  img_proc: true
- pgno: 81
  md: 'You''ll also notice that you will soon see the text that wasn''t previously
    visible. That''s right, now you''re scrolling up into the Window history! Of course,
    you can also use Page Down or Ctrl + v (Ctrl + f) to navigate to a page back down.


    You may find that Meta + v won''t work to scroll up in tmux. If you encounter
    this, it is likely due to a configuration setting on your terminal.


    If you are using iTerm2 on a Mac, you have the ability to specify how the terminal
    sends the Option key. To access this, visit Preferences | Profiles | Keys and
    you should see Left option (^) key acts as. Set this to +Esc to have the Option
    key work like Meta, as shown in the following screenshot:


    ![](img/5969098f450265ac0c7947efcdbe7889_81_0.png)


    If you are using Terminal on a Mac, you have the ability to specify how the terminal
    sends the Option key. To access this, visit Preferences | Profiles, pick your
    active profile, select the Keyboard tab, and check the box that says Use Option
    as Meta key.


    For other operating systems, Alt will often work as Meta out of the box.


    You can also jump directly to the top of the Window history with Meta + > (g)
    and go back to the bottom with Meta + < (G).'
  merge: -1
  img_proc: true
- pgno: 82
  md: '# Jump by search or line


    Often, you know exactly what you''re searching for when you go back through the
    history. When this is true, you can jump by a search term to get to a specific
    line.


    For example, in Copy mode, press Ctrl + r (?). You will see Search Up: appear
    in the lower-left corner, as shown in the following screenshot:


    ![](img/5969098f450265ac0c7947efcdbe7889_82_0.png)


    Type list-keys and then press Enter. You''ll see you jumped directly to the last
    use of the term, list-keys, within the Window history. Try it again and you''ll
    jump back to the time we first entered it.


    If you don''t have an exact search term, you can still jump directly to a line
    number. Simply press g (:) and you''ll be prompted for the line to jump to. This
    is helpful when you don''t know exactly what you may be searching for but would
    like to jump back several pages.


    # Leaving Copy mode


    To drop out of Copy mode and go back to Default mode, simply tap Esc or q and
    you''ll leave Copy mode.


    There are many more keys to navigate to Copy mode, but it would be onerous to
    describe each one of them. However, we''ve seen most, and the rest is available
    on the tmux man page:


    ```

    $ man tmux

    ```


    Alternatively, you can find it with the tmux command list-keys -t emacs-copy or
    list-keys -t vi-copy, based on your chosen key bindings.


    You can view more keys to navigate to Copy mode online at http://man.cx/tmux.'
  merge: -1
  img_proc: true
- pgno: 83
  md: '# # Copying text into the paste buffer


    Now that we''ve gotten a taste of navigating around in Copy mode, let''s put it
    to use.


    Copy mode doesn''t exist just to have a Window history that you can scroll through,
    but also to have a way to copy text from the past and reuse it.


    Enter Copy mode by pressing `<Prefix>, [` and scroll around until you find some
    text that is of interest. Once you find something you''d like to copy, make sure
    the cursor is at the start of where you''d like to copy and press `Ctrl + Space
    bar` (Space bar). This sets the start point of the selection.


    Now move the cursor around using the same keys as provided earlier, and you''ll
    see the selection is highlighted and grows as you move away from the start of
    the selection. The area you select will have a different background color as the
    area is highlighted. See the following screenshot, which is an example of this:


    ![](img/5969098f450265ac0c7947efcdbe7889_83_0.png)


    When you are satisfied with your selection, simply press `Meta + w (Enter)` to
    copy the text and you will leave Copy mode immediately and will be scrolled back
    to where you were. The text you selected will be copied and added to your paste
    buffer (more on this soon).


    A few things to note are as follows:


    +   - This is set up to model Emacs (or vi) almost identically in terms of key
    commands to navigate, copy, and so on. Things should feel rather familiar to you
    if you use Emacs or vi. If you aren''t familiar with either, things may seem a
    bit foreign and will take some time getting used to.

    +   - Note the copy operation is always nondestructive in tmux. You have copied
    the text out of the Window history but have not altered the Window history at
    all. So, you can go back and copy the same text again and again without disturbing
    the history.'
  merge: -1
  img_proc: true
- pgno: 84
  md: '+   - If you have tried copying text from multiple lines, you might have noticed
    the selection-wrapped lines. You can toggle it as a rectangle by pressing R (v)
    at any time in Copy mode before or after you start the selection. This is shown
    in the following screenshot:


    ![](img/5969098f450265ac0c7947efcdbe7889_84_0.png)


    +   - You can also grab all of the text to the right of your cursor or to the
    end of a single line of text, much like the kill line in Emacs, with the Ctrl
    + k keyboard command. Again, tmux''s Copy mode is nondestructive, so this won''t
    actually kill the line as it would in Emacs but will copy it to the paste buffer.


    # Interacting with the paste buffer


    The paste buffer is a holding bucket for all of the text you will copy, which
    you will then be able to access later to paste onto any pane.


    It is actually a stack, so each item copied from Copy mode is added at the top
    of the stack, and every new item is added at the top with every other item moved
    down by one. Each item in the paste buffer is assigned a number based on the order
    in which it went into the stack.


    # Pasting text from the paste buffer


    Now that you''ve grabbed some text, you want to pull it from the paste buffer
    to get it back.


    In any program that runs within tmux, move your cursor to the point where you
    want the text to be pasted and press <Prefix>, ].


    For example, let''s fire up nano:


    ```

    $ nano

    ```


    Once we do this, paste what we last copied with <Prefix>, ].'
  merge: -1
  img_proc: true
- pgno: 85
  md: 'Sure enough, our text appears! Notice the nice symmetry, where you use <Prefix>,
    [ to enter Copy mode, and <Prefix>, ] to paste the text.


    Now <Prefix>, ] is nice to paste the most recently copied bit of text, but what
    about more complex situations such as copying two items and then pasting two items?
    Don''t worry, tmux has it covered!


    # Choosing items from the paste buffer


    The paste buffer is not just a single blob of text holding the last thing you
    copied; it is actually a stack of all the previously copied items. You can access
    this and paste from it in any order.


    To access this list, simply press <Prefix>, =. This will bring up an interactive
    list of the last things you previously copied, as shown in the following screenshot,
    and you can simply highlight one and hit Enter to paste it:


    ![](img/5969098f450265ac0c7947efcdbe7889_85_0.png)


    By default, each time you copy it, it will be added to the paste buffer stack.
    Interestingly though, by default, when you pull an item out of the paste buffer,
    it will not pop the latest copied item out of the cache.


    The command <Prefix>, ] just quickly grabs and pastes from the top of the stack
    in (0).


    # Working with the paste buffer


    There are also a handful of other useful things we can do when working with the
    paste buffer.


    You can optionally set a limit for the number of items to store in this stack
    by setting the buffer-limit option to a number in your tmux configuration. This
    can be useful if you only want, say, the last five items you copied in a paste
    buffer for security reasons.'
  merge: -1
  img_proc: true
- pgno: 86
  md: 'You can also list paste buffers non-interactively by pressing <Prefix>, : (list-buffers)
    and Enter, which will display all the buffers in a list that you can scroll through.
    Notice how each buffer has an index, which is a number, followed by the size of
    that buffer. Press q (Esc) to dismiss this list.


    This buffer index can be used in a few different operations. It can be used to
    delete a buffer, to copy a buffer to another session, to load a buffer at a particular
    index, to set the contents in a particular buffer, to write a buffer to a file,
    and much more. It is a bit outside the scope of this book to cover all the things
    that can be done with buffers, but we will revisit a few very useful tasks in
    Chapter 5, Diving Deeper.


    As in prior chapters, there is a full key binding and command reference in the
    appendix with all of the keys and commands we learned in this chapter handy, all
    in one place.


    # Summary


    In this chapter, we learned a lot about manipulating text, starting from understanding
    the Window history to learning about the two different modes in tmux to scroll
    up through the Window history. We then moved on to jumping by search or line,
    copying text into a paste buffer, using Copy mode to copy text. We finished by
    discussing how to paste items from the paste buffer to the underlying window,
    how to view the whole paste buffer stack, and how to limit the number of items
    stored in the paste buffer.


    In the next chapter, we will get to some more advanced usage topics, including
    a deeper understanding of the paste buffer, a bit more on sessions and windows,
    and an opportunity to get a taste of launching tmux with defaults.'
  merge: -1
  img_proc: true
- pgno: 87
  md: '# # Diving Deeper


    Now that we have learned about text manipulation with Copy mode and paste buffers,
    we have discussed most of the basics of working with tmux. Let''s dive deeper
    into some more advanced usage topics that could be helpful in your daily workflow.


    We have gotten a taste of these items already, but this time around, we will explore
    them in more depth. In this chapter, we will cover the following topics:


    +   - Understanding tmux commands and Command mode

    +   - Advanced paste buffer usage

    +   - Jumping from one window in a session to a window in another session

    +   - Moving windows

    +   - Linking a window between sessions

    +   - Breaking panes

    +   - Joining panes

    +   - Launching a session with default windows


    # ## Understanding tmux commands and Command mode


    You may have noticed that in prior chapters, we accessed some of our commands
    using different methods. For example, we showed you how to list the current key
    bindings. This can be done:


    +   - By using the key combination `<Prefix>, ?`.

    +   - By typing the command directly into a shell, prefacing the command with
    the tmux keyword, for example, `tmux list-keys`.'
  merge: -1
