- pgno: 96
  md: 'Bring up the choose-tree interface again with <Prefix>, s. Notice the plus
    symbols to the left of the session names? They''re there because that session
    can be expanded to show the windows running in those sessions. Simply highlight
    the session you want to drill into and tap the Space bar or right arrow key to
    unfold that session and see a list of the windows in that session. Notice how
    it resembles a file tree, as shown in the following screenshot. This is why this
    command has the name that it does.


    ![](img/5969098f450265ac0c7947efcdbe7889_96_0.png)


    Recall from our first chapter what some of the magic characters on the window
    mean? The characters are as follows:


    +   - The character * indicates the currently active window

    +   - The character - indicates the previously active window


    In the preceding screenshot, you can see that window 2 running top was our currently
    active window. If we just selected the session by choosing (1), we would be plopped
    back into that session with the window running top. However, if we want to go
    directly to the other window, we can do this by highlighting it, refer to the
    previous screenshot, and hitting Enter.


    # Moving windows


    So we''ve got top running in the session named Another. Imagine that we want to
    move that window to our session named Advanced. First, switch to the window with
    top running. Now run the tmux command move-window. It is conveniently bound to
    the keyboard shortcut <Prefix>, . so you can type that and then provide the name
    of the destination session which, in our case, is Advanced.


    Note how that window is gone; now our Another session has only one window. The
    window with top was moved to the Advanced session, but we are still in the Another
    session. tmux opened the other window to keep us in the current session.'
  merge: -1
  img_proc: true
- pgno: 97
  md: 'Now pull up the session list again using <Prefix>, s and then expand Advanced.
    In the following screenshot, we can see how it now has three windows, the last
    of which is the window that we just moved by running top:


    ![](img/5969098f450265ac0c7947efcdbe7889_97_0.png)


    Note that this same command can also be used to move a window to a different index
    within the same session. We can specify the numerical index we''d like the window
    moved to within this session rather than providing a session name. For instance,
    to move a window to index 5, we could run the same move-window command via <Prefix>,
    . and then enter 5; by doing this, the status bar will be updated to reflect this
    window''s new index.


    When being moved from one session to another, the window will, by default, be
    placed at the lowest available base index. So, if you have set the base index
    to 1 and have windows in index 1 and 3, the moved window will land in this session
    with index 2.


    To specify both the session and window index as the home for the window, specify
    both, separating them with a colon. For example, to move this window to the Another
    session in window index 7, you could use the move-window command with the argument
    Another:7 where the session comes before the colon and the window index after.


    This is also useful to move a window to a session with a numeric name, such as
    the default session name 0. By default, if you specify a number alone to the move-window
    command, tmux will assume you meant the window index 0 and not the session named
    0. To specify this, you will use the command move-window 0: to explicitly specify
    the session named 0.


    # Linking a window between sessions


    Now moving the window between sessions is quite useful, but what if we want to
    use the same program in multiple sessions and not have multiple instances of it
    running?'
  merge: -1
