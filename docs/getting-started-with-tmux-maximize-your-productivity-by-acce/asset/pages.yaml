  md: "Now close your terminal window. Yes, I'm serious, trust me—everything will\
    \ keep running! Imagine this is the same as dropping your network connection,\
    \ having an SSH timeout, or going home for the day. Open a brand new terminal\
    \ window. Run the following SSH command we ran before:\n\n```\n$ ssh -i ~/.vagrant.d/insecure_private_key\
    \ vagrant@tmux.dev\n```\n\nOnce you're connected via SSH, run the following command:\n\
    \n```\n$ tmux attach-session -t MyServer\n```\n\nYou can even run the following\
    \ abbreviated version of the command to attach the session that you had running:\n\
    \n```\n$ tmux attach\n```\n\nLo and behold, there is everything just as you had\
    \ left it! It will persist through all your disconnections for as long as that\
    \ server stays up. Imagine the daily time saving in not having to open all these\
    \ windows every morning when you connect to the server or any time you get disconnected!\n\
    \n# Launching tmux on SSH connect automatically\n\nYou can also trigger tmux to\
    \ be run on SSH connect automatically so you don't have to connect then start\
    \ tmux. Close your terminal window again and open a new one. In this new window,\
    \ run the following command:\n\n```\n$ ssh -i ~/.vagrant.d/insecure_private_key\
    \ vagrant@tmux.dev -t -- 'tmux attach-session -t \"MyServer\"'\n```\n\nThis tells\
    \ SSH that after you connect, you want to immediately run the tmux attach-session\
    \ command and reattach the session you had before. Now this is handy, but your\
    \ command to connect to your server is getting rather long! We could place this\
    \ long command in an executable shell script and run that script to connect to\
    \ your remote server. Alternatively, we can also make things a bit easier by tucking\
    \ most of it away in our SSH configuration. Jump into your favorite editor and\
    \ edit the ~/.ssh/config file. This file probably already exists; it is used whenever\
    \ you connect to a server using SSH. Add the following lines to the file:\n\n\
    ```\nHost tmux\n  HostName tmux.dev\n  User vagrant\n  IdentityFile ~/.vagrant.d/insecure_private_key\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 110
  md: "Now you can connect more easily with the following simplified command:\n\n\
    ```\n```bash\n$ ssh tmux -t -- 'tmux attach-session -t MyServer'\n```\n```\n\n\
    > Unfortunately, there is not a great way to tuck away the tmux command into the\
    \ ~/.ssh/config file. There is, however, a way to do it on the server by tweaking\
    \ the ~/.ssh/authorized_keys file.\n> \n> We leave this as an exercise for the\
    \ user as this is going in-depth into the concept and because it's not always\
    \ desirable to initiate tmux every single time you connect to a remote host.\n\
    > \n> It could also create issues connecting to the remote host. For example,\
    \ imagine you specify that on connecting the remote session should always run\
    \ tmux attach-session -t MyServer. However, what happens when the session MyServer\
    \ doesn't already exist? You could be locked out of the server! So tread carefully\
    \ here dear reader.\n\n# Using tmux for pair programming\n\nSo we saw how to create\
    \ sessions and how you can attach an existing session, but did you wonder what\
    \ would happen if more than one terminal attached to the same session?\n\nThe\
    \ ability to connect multiple terminals to the same session ends up being one\
    \ of the biggest advantages tmux offers. By allowing two or more terminal windows\
    \ to connect to the same tmux session, tmux becomes an extremely powerful collaboration\
    \ tool. With tmux, two or more people can see and even interact with the same\
    \ content at the same time!\n\n# Connecting to the same session locally\n\nBefore\
    \ we get to full pair programming, let's try just connecting to the same session\
    \ locally in two different terminal windows and see what happens.\n\nIf you followed\
    \ the previous instructions, you should be able to pull up your tmux session by\
    \ opening a new terminal window and running:\n\n```\n```bash\n$ ssh tmux -t --\
    \ 'tmux attach-session -t MyServer'\n```\n```"
  merge: -1
  img_proc: true
