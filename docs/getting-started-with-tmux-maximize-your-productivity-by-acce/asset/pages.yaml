- pgno: 104
  md: '# # Using tmux over SSH for long lived sessions


    How many times have you been connected to a remote server over SSH just to have
    some network blip terminate your session, putting you back at square one when
    you reconnect?


    With tmux, you can connect to a remote server, start a tmux session, and set up
    windows and panes the way you''d like them. Then, if you get disconnected from
    the remote server for any reason—be it a network blip, the SSH session timing
    out, disconnecting from a VPN, or simply closing your laptop to go home for the
    day—you can SSH into that machine later and reconnect to your tmux session which
    has continued running, preserving your state as you left it.


    This is my favorite use of tmux and one that saves the most time in my daily workflow.
    Not only because it is useful to deal with network connectivity issues gracefully,
    but also since most remote servers running Linux are rarely terminated; this means
    that once you start a tmux session, it can persist for weeks or months.


    Practically speaking, this means that every day when you connect to some remote
    server, you could be saving time setting everything up by using tmux. You won''t
    have to change to the directory you usually want open in one window, you won''t
    have to connect tail to a logfile in another window, and you won''t have to open
    a file for editing in your favorite text editor in another. They''ll already be
    there, just the way you left them before—thanks to tmux.


    Let''s walk through a hands-on example of this in action. For this, either connect
    to a remote server over SSH, or we have short instructions on using Vagrant to
    create a virtual machine locally to which you can connect.


    # ## Benefits of using Vagrant


    Vagrant is an incredibly easy way to use virtualization to get a machine up and
    running locally. We suggest using it here for consistency.


    The instructions we give *should* work when connected to just about any Linux
    server, but since there are so many different Linux distributions, versions, and
    more, there are bound to be slight inconsistencies.


    By using Vagrant, we can ensure that the environment we authors have locally matches
    the instructions we provide which will match the environment you readers have
    locally if you also use Vagrant to set up your environment.'
  merge: -1
  img_proc: true
