- pgno: 89
  md: '# # Saving a paste buffer to a file


    Assume you''ve just copied a lot of excellent text to the paste buffer and now
    you want to save it to a file.


    Of course, you could open a text editor, paste the contents of the buffer, and
    save a new file; however, tmux provides us with a handy way to save a paste buffer
    directly to a file without all that fuss.


    So jump back into your tmux session or start a new one and let''s go!


    +   1. First, find some text to copy. It could be any file with some text in it.
    For example, we have a sample file with some text that we print out via `cat filename`.
    You can use any file on your computer.

    +   2. Recall that we can enter Copy mode by pressing `<Prefix>, [`.

    +   3. Then, we can press `Ctrl + Spacebar` to start copying the text.

    +   4. Move on to highlight the text.

    +   5. Then, press `Ctrl + w` to copy it.


    ![](img/5969098f450265ac0c7947efcdbe7889_89_0.png)'
  merge: -1
  img_proc: true
- pgno: 90
  md: 'Alright, so now we have some text in the paste buffer at index 0. We can check
    this out with <Prefix>, =.


    ![](img/5969098f450265ac0c7947efcdbe7889_90_0.png)


    We have 628 bytes there in that paste buffer. Hit q to dismiss that dialog. Now
    we can run the tmux command save-buffer -b 0 [path]; here, [path] is the location
    where we will save it and -b 0 indicates that we want to save the text from the
    paste buffer with index 0, in this case, the text we just copied. After you run
    this command, we''ll have a new file with the contents of that buffer.


    So, for instance, <Prefix>; save-buffer -b 0 ~/sonnet16.poem will save the contents
    of our paste buffer to a file. This can be extremely useful in many contexts.
    For instance, let''s say you are using the tail utility to follow a log file in
    real time. If a useful snippet appears on the screen, jumping into Copy mode,
    copying it to a paste buffer, and then saving it to a file is a convenient way
    to copy the relevant text to a file. Alternatively, imagine you are reading a
    man file and want to snag a useful snippet to a file for later use. In this case,
    copying the snippet first and then writing that paste buffer directly to a file
    will store it for later use with expedience.


    # Loading a paste buffer from a file


    We can also achieve the reverse, that is, loading the contents of a file into
    a paste buffer. To do this, simply run the tmux command load-buffer [path], and
    the contents of that file will be loaded into a paste buffer.


    This is very useful if you have text in a file that you want to paste into any
    program running within tmux; you can do this without having to navigate to and
    open that file in an editor, select all of the text in the file with the cursor,
    and then copy it in order to be able to paste it.


    This can be incredibly useful, for example, as a way to utilize the core functionality
    of tmux to have a very powerful code snippet manager.'
  merge: -1
  img_proc: true
- pgno: 91
  md: 'Say there are a bunch of different common boilerplate things you write in your
    code, such as a for loop, a function definition, or a class declaration. You could
    create a simple file for each snippet of boilerplate, load it directly into a
    paste buffer, and then paste it from within tmux. If you had a folder in your
    home directory called ~/snippets and had boilerplate for a for loop with the name
    ~/snippets/forloop, you could load it with the tmux command load-buffer ~/snippets/forloop
    and then simply paste it into the current buffer with <Prefix>, ]. Over time,
    as you build up snippets for a lot of boilerplate code, you can save a lot of
    keystrokes.


    By default, if no index is specified, the file''s contents will be loaded into
    index 0, just as if you had copied it normally via <Prefix>, [ (with each other
    paste buffer moving up one index); however, it''s also possible to specify a buffer
    index to load it into.


    Note that if a buffer index is specified, it must be an already existing buffer
    index, and it will overwrite the contents of that paste buffer with the index
    you will provide. So, for example, specifying buffer 0 with the tmux command load-buffer
    -b 0 ~/snippets/forloop will not end up in index 0, pushing all the buffers up
    by one; rather, it will entirely displace whatever was previously available in
    index 0.


    # Setting a paste buffer directly


    It is also possible to set a buffer directly with tmux. This may be useful if
    you would like to paste the same text multiple times. There is no need to type
    the whole text out first and then copy it before being able to paste it; you can
    set the contents of a buffer directly.


    For example, say we would like to put a sentence into a buffer directly. We can
    do this by issuing the tmux command set-buffer, optionally giving it an index
    and providing text to put into that buffer. The following steps will guide you
    in setting a paste buffer directly:


    +   1. Try <Prefix>, ; set-buffer "The quick brown fox jumped over the lazy dog".

    +   2. Since we did not specify a buffer index, it will be pushed to the top of
    the stack, in buffer index 0, with the rest of the buffers moving down one index.
    We can view the contents of this buffer with the tmux command show-buffer. Sure
    enough, you''ll see that the content is the sentence we just set.

    +   3. Now paste it onto the screen using <Prefix>, ].'
  merge: -1
  img_proc: true
