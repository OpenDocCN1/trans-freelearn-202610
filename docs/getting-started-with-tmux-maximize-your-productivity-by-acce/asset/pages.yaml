- pgno: 66
  md: 'A window and a pane are perfect analogies to their real-world counterparts.
    Check out the different physical, real-world windows, and you will find that many
    of them are nicely divided into multiple panes.


    > One nice benefit of panes in tmux over panes in the real world is that they
    are easy to create, destroy, and resize based on your needs. You cannot do that
    with panes on most physical windows.


    # Playing around with sessions, windows, and panes


    So now that we have a high-level understanding, let''s take a little tour of sessions,
    windows, and panes. Let''s start totally fresh with a new terminal window and
    no existing tmux sessions. Start by creating a session named work:


    ```

    $ tmux new-session -s work

    ```


    You''ll see a new session started with the name work. This session, currently,
    has a single window with a single pane.


    Let''s create another window. Recall that this is done by pressing <Prefix>, c
    (c for create). Now you have one session, two windows, and two panes. Each window
    has a single pane, as shown in the following screenshot:


    ![](img/5969098f450265ac0c7947efcdbe7889_66_0.png)'
  merge: -1
  img_proc: true
- pgno: 67
  md: '# Multiple sessions


    Now let''s see what it''s like working with more than one session. Let''s first
    detach the current session. Recall that in order to do so, we''ll press <Prefix>,
    d (d for detach).


    Now that the work session is detached, we are back at a command line, and your
    screen should be similar to the next screenshot. Instead of reattaching the work
    session, let''s create a new session and call this session play:


    ```

    $ tmux new-session -s play

    ```


    ![](img/5969098f450265ac0c7947efcdbe7889_67_0.png)


    Now it looks like we have an entirely different session. We have a different status
    bar with the session name [play] in the bottom-left corner rather than [work].


    Now to switch back to the work session, we could detach the play session, arrive
    back at a tmux-less terminal and then reattach the session, this time with the
    work session as the target; however, there is actually an easier way.


    Simply press <Prefix>, s (select the session interactively); this will bring up
    a dialog where we can take our pick about which session to attach. So, we didn''t
    even need to leave the session we were in to switch to the other one. Use the
    arrow keys to highlight the session you want, or just tap the number associated
    with that session to switch.


    Try switching to the other session, then back again, but wait, there is an even
    easier way. Simply use <Prefix>, ) (next session) and <Prefix>, ( (previous session)
    to cycle around between the sessions. You''ll see it''s very easy to switch between
    sessions. We''ll skip switching between multiple windows since you already know
    how to do that from the first chapter; let''s move right on to multiple panes.'
  merge: -1
  img_proc: true
- pgno: 68
  md: '# Multiple panes


    Now let''s break this window into two panes. Type <Prefix>, % (split the window
    vertically) and see how the window is now divided down the middle by vertical
    bars; we now have another command prompt. This is the second pane, as can be seen
    in the following screenshot:


    ![](img/5969098f450265ac0c7947efcdbe7889_68_0.png)


    Now we have two sessions, three windows, and four panes. One session, one window,
    and one pane make up the play session (which is no longer visible but humming
    along in the background), while one session, two windows, and three panes make
    up the work session we saw in the previous screenshot.


    Let''s play around with panes a bit. First, try typing in some text. You''ll see
    the cursor is in the right pane. To get it to the left pane, simply press <Prefix>,
    o (o for other). Now your cursor is in the other pane. Type some stuff to verify
    which pane the cursor is in.


    There is actually a better way to tell which pane has the cursor than typing in
    random stuff. It may be tough to tell from the previous screenshot; however, when
    a window is split into two vertically, the top half of the vertical bars that
    split the two windows will be colored when the cursor is in the left pane, and
    the bottom half will be colored when the cursor is in the right pane. In the previous
    screenshot, the bottom half is colored in green to indicate that the cursor is
    in the right pane. When there are more than two panes, tmux tries different schemes
    to let us know which pane is active, as we soon shall see.


    You can also use <Prefix> and the right arrow key, <Prefix> and the left arrow
    key, <Prefix> and the down arrow key, or <Prefix> and the up arrow key to move
    the cursor to the pane to the right, left, down, or up, which is a bit easier
    to remember and also more useful when we have a more complex pane structure.'
  merge: -1
  img_proc: true
- pgno: 69
  md: '# Working with more panes


    Now <Prefix>, % (split the pane vertically) is not the only way to create panes.
    This simply splits the current pane into two smaller ones by splitting it vertically.
    If you actually do it again, it''ll split the current pane in half again with
    another vertical line, as shown in the following screenshot:


    ![](img/5969098f450265ac0c7947efcdbe7889_69_0.png)


    This is rather silly and scrunched though. First, let''s kill that pane and then
    try to split it vertically. To kill the new pane we created, we can either terminate
    the running program in that pane, in this case, typing exit and pressing Enter
    as this will end the shell process. Alternatively, we can press <Prefix>, x (kill
    pane) to be prompted whether to kill that pane or not.


    > Note that killing a pane with a running process will terminate that process
    immediately without gracefully ending it, so you will lose any existing data in
    that pane. Be careful!


    Confirm with y, and you''re back to two panes. Note that when a pane is removed,
    things are automatically resized appropriately. Let''s try to split the left pane
    horizontally. In order to do this, type <Prefix>, " (split the pane horizontally),
    as shown in the following screenshot:


    ![](img/5969098f450265ac0c7947efcdbe7889_69_1.png)'
  merge: -1
  img_proc: true
