    We''ve completed our signup and login interfaces, which will allow users to register
    and sign in. Then, we built the header and footer components. The header contains
    navigation buttons for our application that are rendered conditionally based on
    whether the user is authenticated or not. We only show the button that takes the
    user to the login component if the user is not logged in.


    The header also includes a search bar, which allows users to search for other
    users in our social network and display the results on a Material Design-styled
    dialog component.


    # Summary


    Throughout this chapter, we''ve seen how to use Apollo Client to send queries
    and mutations to our previously implemented backend API. We integrated Apollo
    with our Angular frontend, then implemented the required services and components
    for user authentication.


    We have also added functionality to our application header to allow users to navigate
    between pages, such as the profile, home feed, and login pages. We used conditional
    rendering to display just the necessary buttons based on the user''s authentication
    state. We added the necessary functionality to allow users to search for other
    users on the network using a search bar in the header. The results are then displayed
    in a dialog component that includes pagination and close buttons.


    In the next chapter, we''ll continue improving our authentication system and add
    unit testing to ensure our code works as expected.'
