  md: "# Implementing JWT authentication with subscriptions\n\nThis section explains\
    \ how to implement authentication over WebSocket. Refer to the documentation at\
    \ https://www.apollographql.com/docs/apollo-server/data/subscriptions/#operation-context\
    \ for more information.\n\nUntil now, our subscriptions have not been secure,\
    \ so we need to prevent subscriptions from users that are not authenticated. This\
    \ means that we only allow WebSocket connections if the user is authenticated.\n\
    \nWe can secure our subscriptions in the same way we did with queries and mutations.\
    \ We simply need to pass a context parameter to our subscriptions each time a\
    \ user connects over WebSocket!\n\nWhen we create an instance of SubscriptionServer,\
    \ we can use an onConnect function that gets executed before every WebSocket connection.\
    \ This function accepts an object of the ConnectionParams type as one of its arguments.\
    \ If it returns an object, it gets passed to the resolvers as context.\n\nUsing\
    \ ConnectionParams, we can get the JWT sent from the client. Inside onConnect,\
    \ we will extract the authenticated user from the JWT and add it to the context:\n\
    \n+   1. Open the server/src/index.ts file and add the following imports:\n\n\
    ```\nimport { ApolloServer, AuthenticationError } from 'apollo-server-express';\n\
    import { SubscriptionServer, ConnectionParams } from 'subscriptions-transport-ws';\n\
    ```\n\nWe add AuthenticationError to the existing import declaration from apollo-server-express\
    \ and ConnectionParams from the existing import declaration from subscriptions-transport-ws.\n\
    \n+   2. Next, add the onConnect function to the object passed to the SubscriptionServer.create()\
    \ method and extract the token that can be retrieved from the parameter passed\
    \ to onConnect:\n\n```\nconst subscriptionServer = SubscriptionServer.create(\n\
    {\n  schema, execute, subscribe, onConnect:\n    (connectionParams: ConnectionParams)\
    \ => {\n```"
  merge: -1
  img_proc: true
- pgno: 139
  md: "```\nconst token = connectionParams.get('authToken')\n    || '';\n    if (token\
    \ != '') {\n        const authUser = getAuthUser(token.split('\n') [1]);\n   \
    \     return {\n            authUser: authUser\n        }\n    }\n    throw new\
    \ AuthenticationError('User is not\n        authenticated');\n    }\n},\n    {\
    \ server: httpServer, path: server.graphqlPath }\n);\n```\n\nWe've now learned\
    \ how to secure our WebSocket connection to prevent users that are not authenticated\
    \ from subscribing to realtime events.\n\n# Summary\n\nThroughout this chapter,\
    \ we learned how to add realtime support to our server application to push new\
    \ comments and likes on users' posts from the server to the client, right at the\
    \ moment when they are added. To achieve this, we used GraphQL subscriptions with\
    \ Apollo Server.\n\nNext, we implemented JWT authentication to prevent users that\
    \ are not authenticated from subscribing to these realtime subscriptions.\n\n\
    Now that we have a working GraphQL API, with realtime subscriptions and JWT authentication,\
    \ in the next chapter we'll start implementing our Angular frontend for building\
    \ the UI of our social network application."
