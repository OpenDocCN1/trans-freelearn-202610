  md: "6. Define the following private methods to get the stored user from the local\
    \ storage and store the token:\n\n```\n```ts\nprivate getLocalUser(): User | null\
    \ {\n  return JSON.parse(localStorage.getItem(AUTH_USER) as string) ?? null;\n\
    }\nprivate storeToken(token: string): void {\n  localStorage.setItem(ACCESS_TOKEN,\
    \ token);\n}\n```\n```\n\n7. Define the following private methods to check whether\
    \ a token exists in the local storage and whether it's expired or not:\n\n```\n\
    ```ts\nprivate tokenExists(): boolean {\n  return !!localStorage.getItem(ACCESS_TOKEN);\n\
    }\nprivate tokenExpired(token: string): boolean {\n  const tokenObj =\n    JSON.parse(atob(token.split('.')[1]));\n\
    \  return Date.now() > (tokenObj.exp * 1000);\n}\n```\n```\n\n8. Define the following\
    \ private methods to update and reset the authentication state:\n\n```\n```ts\n\
    private updateAuthState(token: string, user: User) {\n  this.storeToken(token);\n\
    \  this.storeUser(user);\n  this.authSubject.next({\n    isLoggedIn: true,\n \
    \   currentUser: user,\n    accessToken: token\n  });\n}\nprivate resetAuthState()\
    \ {\n  this.authSubject.next({\n    isLoggedIn: false,\n    currentUser: null,\n\
    \    accessToken: null\n  });\n}\n```\n```"
