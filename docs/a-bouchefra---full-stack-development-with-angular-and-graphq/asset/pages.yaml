  md: "# Signing up and logging users in\n\nIn this section, we'll look at how to\
    \ use Apollo Client and the Apollo library for Angular to add user authentication\
    \ to our Angular frontend.\n\n# Defining GraphQL documents\n\nLet's begin by defining\
    \ the GraphQL documents (queries and mutations) required for user registration,\
    \ signing in, and searching:\n\n+   1. Create a shared/constants/auth.ts file\
    \ (make sure to create the constants/ folder inside the shared/ folder) and begin\
    \ by adding the following import and two string constants, containing the keys\
    \ for the access token and authenticated user, which will be used to store the\
    \ corresponding information in the user's browser's local storage:\n+   2. Add\
    \ and export the register mutation that is sent to the backend API for registering\
    \ users:\n\n```\nimport { gql } from 'apollo-angular';\nexport const ACCESS_TOKEN:\
    \ string = 'accessToken';\nexport const AUTH_USER: string = 'authUser';\n```\n\
    \n```\nexport const REGISTER_MUTATION = gql'\nmutation register($fullName: String!,\
    \ $username:\n  String!, $email: String!, $password: String!){\n  register(fullName:$fullName,\
    \ username:$username,\n    email:$email, password:$password){\n    token, user\
    \ { id fullName bio email username image\n      coverImage postsCount createdAt\
    \ }\n  }\n}\n';\n```\n\nWe use the gql function to wrap query and mutation strings,\
    \ so they get parsed to GraphQL documents. It's a template literal tag for passing\
    \ queries, mutations, subscriptions, and fragments to Apollo Client. It returns\
    \ an object of the DocumentNode type, which is an object representation of a GraphQL\
    \ query string after getting parsed. See https://git.io/JikfN."
  merge: -1
  img_proc: true
- pgno: 182
  md: "We used the mutation operation type since we need to call a mutation on the\
    \ GraphQL server. We named it register and provided the necessary arguments using\
    \ GraphQL variables (since we need to dynamically pass the full name, username,\
    \ email, and password of the user to register an account for them).\n\nIn the\
    \ body of our mutation, we simply asked for the register field, which we've previously\
    \ added to the Mutation type in our GraphQL server schema, and because the corresponding\
    \ resolver will return an object containing the authentication token and the user\
    \ saved in the database, we specified a selection set to request the required\
    \ fields.\n\nCheck out https://graphql.org/learn/queries/ for more information\
    \ about operation types.\n\n+   3. Add and export the login mutation for authenticating\
    \ users:\n\n```\n```ts\nexport const LOGIN_MUTATION = gql'\nmutation signIn($email:\
    \ String!, $password: String!){\n  signIn(email:$email, password:$password){\n\
    \    token, user { id fullName bio email username image\n      coverImage postsCount\
    \ createdAt }\n  }\n}\n';\n```\n```\n\nAgain, we used the gql template literal\
    \ to build the GraphQL document that will be sent to the server to authenticate\
    \ users. We used the mutation type to instruct the server to call the signIn field\
    \ on the top-level Mutation type and we used variables to pass dynamic arguments,\
    \ such as the name and password, which are required to authenticate users.\n\n\
    Since the signIn mutation field refers to an object with a token string and a\
    \ user object, we use a selection set to ask for all the required information\
    \ on the client side, including a JWT and the authenticated user.\n\n+   4. Create\
    \ a shared/constants/user.ts file and import the gql tag, as follows:\n\n```\n\
    ```ts\nimport { gql } from 'apollo-angular';\n```\n```"
  merge: -1
