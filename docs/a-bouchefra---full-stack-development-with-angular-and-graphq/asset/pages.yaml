  md: "We can have a flat output of the JavaScript source files inside the dist/ folder\
    \ without the src/ subfolder by changing the value of the rootDir property in\
    \ the tsconfig.json file to src/:\n\n```\n{\n  \"compilerOptions\": {\n    \"\
