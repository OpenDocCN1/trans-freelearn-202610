  md: 'You''ll be prompted with `The package @angular/material@12.2.8 will be installed
    and executed. Would you like to proceed? (Y/n)`. Type Y and press Enter.


    This will install the package from npm. Next, the CLI will prompt you to `Choose
    a prebuilt theme name, or "custom" for a custom theme`. Let''s pick Indigo/Pink.
    Next, it will ask `Set up global Angular Material typography styles?` Type y.
    Next, it will ask `Set up browser animations for Angular Material?` Type y.


    That''s it – you should have Angular Material installed and configured in your
    project.


    # Summary


    Over the course of this chapter, we have learned about how to use the Angular
    CLI to generate a brand-new Angular application based on the latest version of
    the framework. We also looked at many essential concepts of Angular, such as modules,
    components, and services, and how to use the Angular CLI to generate those artifacts
    that provide the structure of our application.


    After covering those topics and generating the basic structure of our application,
    we then discussed the basic concepts of routing in Angular, including the routing
    module, routes, and navigation directives such as `routerLink` that replace the
    regular `href` attribute in HTML.


    Next, we looked at some tips on how to debug our application, using the debugging
    methods available by default in development mode, and why it''s necessary to enable
    production mode when you are ready to deploy your application for production.


    Finally, we added Angular Material to our project to provide Material Design components
    for building our application UI throughout the next chapters.


    That concludes this chapter! In the next one, we''ll continue our journey of building
    a frontend application to consume the GraphQL API exposed by the backend previously
    built. We''ll specifically see how to integrate the frontend with the backend
    using Apollo Client for sending GraphQL queries and writing data on the server.'
