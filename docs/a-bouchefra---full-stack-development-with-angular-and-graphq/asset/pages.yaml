  md: "# Implementing GraphQL subscriptions\n\nNow that we've set up Apollo Client\
    \ for GraphQL subscriptions, we'll learn how to use subscriptions to add some\
    \ realtime features to our application.\n\nIn the server, we have added a Subscription\
    \ type with two fields – onPostCommented and onPostLiked – to our GraphQL schema.\
    \ Then, we implemented the required resolvers to push realtime updates to the\
    \ client when a post is commented on or liked.\n\nIn this section, we are going\
    \ to learn how to listen to realtime updates from the server. This process is\
    \ similar to how we used queries to query for data, but instead of using the query\
    \ operation, we use the subscription operation with the fields that need to be\
    \ sent from the server. For the response, we get results every time new data is\
    \ available on the server.\n\nIn our case, we'll implement the functionality for\
    \ displaying new comments and likes on posts every time they are added by the\
    \ users of the network without the need to refresh the page or re-click buttons.\
    \ We'll also implement a simple notification system that notifies the users of\
    \ new comments and likes.\n\nBefore we proceed, we need to fix a line of code\
    \ in the server. Open the server/src/index.ts file and locate the SubscriptionServer.create()\
    \ method. Then, update the code for retrieving the token from the connectionParams\
    \ object inside the onConnect handler, as follows:\n\n```\nconst token = connectionParams['authToken']\
    \ || '';\n```\n\nCheck out the changes by reading the following code commit: https://git.io/JDuom.\n\
    \nLet's start by adding the subscription for listening to new comments on posts:\n\
    \n+   1. Open the src/app/graphql.documents/comment.graphql file and add the following\
    \ subscription:\n\n```\nsubscription onPostCommented{\n  onPostCommented {\n \
    \   ...CommentFields\n    author { ...BasicUserFields }\n    post { id commentsCount\
    \ }\n  }\n}\n```"
  merge: -1
  img_proc: true
