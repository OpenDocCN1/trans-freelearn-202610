  md: '# Summary


    In this chapter, we started implementing our backend application, which will be
    exposing the GraphQL API. We created a project using Lerna to follow the monorepo
    approach to organizing our code base, which will contain both the server and client
    apps.


    We installed Express.js and configured it with TypeScript and also GraphQL via
    Apollo Server.


    Next, we created an initial GraphQL schema for our small social network application
    and configured Apollo Server with mocking. Then, we used the casual tool to use
    realistic values for our mock data.


    Thanks to mocking, we were able to run a working GraphQL server by providing only
    a schema without implementing the resolvers.


    This is a great feature that allows us to easily test the GraphQL API without
    running a complete API server. It also allows the frontend developer/team to start
    working on the features that require data to be fetched from the server as quickly
    as possible without waiting for the backend development to finish.


    Next, we used Apollo Studio to send queries to our Apollo Server, which was able
    to return data that contains the shapes of our schema types.


    Finally, we installed the `cors` module and configured CORS in our Express/Apollo
    Server to enable our frontend application, which will be running from a different
    port at localhost during development, to send requests without getting blocked
    due to the same-origin policy in web browsers.


    In the next chapter, we''ll continue our journey of building our backend application
    to expose a fully working GraphQL API with resolvers that fetches data from a
    real MySQL database.'
