- pgno: 131
  md: '# 5

    Adding Realtime Support with Apollo Server


    In the previous chapter, we saw how to add authentication and image uploading
    to our **GraphQL** API. We''ve also seen how to protect endpoints from access
    by non-authenticated users.


    Traditionally, in web applications, clients send HTTP requests to servers and
    receive the response. After that, the connection gets closed. As a result, if
    the data on the server is changed, the client doesn''t have the mechanism to know
    that.


    Nowadays, contemporary apps operate in real time, which means that the backend
    server can alert clients anytime data changes, even if they do not send another
    request, because the connection remains open to allow the server to transmit updates
    whenever they become available.


    In this chapter, we''ll add realtime support to our server application, which
    will allow us to communicate fresh data from the server to the client as soon
    as it becomes available. To do this, we''ll leverage Apollo Server''s GraphQL
    subscriptions.'
  merge: -1
  img_proc: true
- pgno: 132
  md: 'We will address the following topics:


    +   - Understanding GraphQL subscriptions

    +   - Implementing GraphQL subscriptions with Apollo Server

    +   - Implementing JSON Web Token (JWT) authentication with subscriptions


    # Technical requirements


    To accomplish the steps in this chapter, you must have completed the previous
    chapter''s steps. Refer to *Chapter 4, Implementing Authentication and Image Uploads
    with Apollo Server*, of this book for instructions.


    You also need to be familiar with the following technologies:


    +   - TypeScript

    +   - Node.js

    +   - GraphQL basics


    You can find the code source for this chapter in the `chapter5` folder of our
    GitHub repository or via this link: at https://github.com/PacktPublishing/Full-Stack-App-Development-with-Angular-and-GraphQL/tree/main/Chapter05.


    # Understanding GraphQL subscriptions


    When interacting with a GraphQL server, you''ll often get and write data using
    queries and mutations. In this situation, the client must send a query or mutation
    to the server in order to obtain a response.


    **Subscriptions** are another form of data communication in GraphQL, in which
    the server provides realtime data to listening clients.


    In order to do that, the client opens a two-way communication with the server,
    which can be done with protocols such as WebSocket instead of HTTP. WebSocket
    can be used to make two-way communication between the user''s browser and a server.


    Subscriptions are similar to queries. However, they let subscribing clients receive
    fresh or updated data whenever a certain server event happens. You may configure
    Apollo Server to use a subscription-specific endpoint that is distinct from the
    default endpoint for queries and mutations.'
  merge: -1
  img_proc: true
