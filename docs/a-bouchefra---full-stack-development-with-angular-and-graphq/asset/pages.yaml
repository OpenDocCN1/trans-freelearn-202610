- pgno: 56
  md: "# Mocking our GraphQL API\n\nMocking allows frontend developers to start building\
    \ the UI without waiting for the backend development to finish. It also lets us\
    \ test the UI without waiting on slow database operations or running a complete\
    \ GraphQL server.\n\nThe community has provided many tools that make it easy to\
    \ mock requests based on a GraphQL schema and queries such as graphql-tools, graphql-faker,\
    \ and the built-in mocking feature of Apollo Server.\n\nSince we are already using\
    \ Apollo Server, let's use its mocking feature to mock our GraphQL requests before\
    \ implementing the resolvers.\n\nOpen the src/index.ts file and add mocks: true\
    \ to Apollo Server, as follows:\n\n```\nconst server : ApolloServer = new ApolloServer({schema\
    \ ,\n  mocks: true});\n```\n\nThe built-in mocking of Apollo Server is very basic.\
    \ It simply looks at the type definitions and returns a value of the same type\
    \ as the corresponding field.\n\nHead over to Apollo Studio and add the following\
    \ query:\n\n```\nquery {\n  searchUsers(searchQuery:\"a\") {\n    id fullName\
    \ email postsCount\n  }\n  getPostsByUserId(userId:\"1\") {\n    id text author\
    \ { id fullName } commentsCount\n    latestComment { id comment }\n    createdAt\n\
    \  }\n}\n```\n\nThe following screenshot shows the query results:"
  merge: -1
  img_proc: true
