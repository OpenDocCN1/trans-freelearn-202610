- pgno: 154
  md: '```

    title = ''client'';

    }

    ```


    This is just an ordinary TypeScript class that has the `@Component` decorator,
    imported from the core module, applied to it. The decorator contains metadata
    about the component, such as the following:


    +   - `selector`: This is used in the same way as conventional HTML tags to call
    the component from an HTML page. You may use Angular to build custom HTML tags
    that are only useable within your application.

    +   - `templateUrl`: This is used to tell Angular where to look for the HTML template
    that contains the presentation markup.

    +   - `styleUrls`: This is used to designate where to find component-specific
    styles that determine the appearance and feel of the component.


    A component''s life cycle begins when Angular constructs an instance of the component''s
    class and ends when the component is destroyed and removed from the DOM.


    Angular supports lifecycle hook methods via a slew of interfaces, each of which
    contains a method, to allow you to hook onto important events in a component''s
    lifecycle.


    The `OnInit` interface, for example, provides the `ngOnInit` method, which is
    run when the component is initialized. Please refer to https://angular.io/guide/glossary#lifecycle-hook
    for further information about lifecycle hooks.


    Now that we''ve defined modules and components, let''s look at services and dependency
    injection.


    # Understanding services and dependency injection


    A service in Angular is a singleton that may be provided to other components or
    services using `dependency injection`, which is a way to supply dependencies to
    an object.


    Don''t be misled by this terminology! This simply means that an Angular entity
    called the **injector** is in charge of creating an instance of the service and
    delivering it to the components that request it.


    Dependency injection is tightly linked with the Angular framework and is used
    to inject services and other objects into components, allowing access to the service
    functionality without having to manually create an instance.'
  merge: -1
  img_proc: true
- pgno: 155
  md: 'Angular services enable you to create apps that adhere to the following guidelines:


    +   - Isolation of your application''s business logic from its display logic in
    components

    +   - Interchange of data between components in your application

    +   - Reusability of code


    This means that you should leverage services to organize and reuse code within
    your application in order to prevent duplication and reinventing the wheel.


    Generally, you should utilize components to create your application''s user interface
    by supplying properties and methods to the HTML template (which is responsible
    for creating the view) via data binding and events. You can refer to `https://angular.io/guide/binding-syntax`
    for more information about Angular binding syntax.


    On the other hand, services are necessary for common tasks that several components
    require to function, such as data retrieval from the server.


    In Angular, you may define a service by using the `@Injectable` decorator, which
    allows you to supply the information that the framework needs to inject the service
    as a dependency into a component or other service.


    How do we then instruct Angular to inject a service?


    By simply passing the dependency as a parameter to the constructor of the requesting
    component. This is sufficient for Angular to provide the component with a service
    instance. However, before Angular can accomplish that, we must supply the service
    in one of the following ways:


    +   - By adding the service to a component''s `providers` array, it becomes exclusive
    to that component.

    +   - By including the service in a module''s `providers` array, it becomes available
    solely within the module.

    +   - By utilizing the `providedIn` property in conjunction with the `@Injectable`
    decorator. For further details, see `https://next.angular.io/api/core/Injectable`.


    Now that we''ve defined modules, components, and services, we''ll explore how
    to create them using the Angular CLI.'
  merge: -1
  img_proc: true
- pgno: 156
  md: '# Creating modules, services, and components


    You may automatically create components, services, and modules in Angular by calling
    the relevant Angular CLI command, which generates the bare minimum code required
    for a basic component, service, or module.


    Let''s use the Angular CLI to generate our modules, services, and components.


    Create a module for each feature of your application. This is a basic rule to
    follow. For instance, the home feed can be contained within a separate module.
    Splitting your application into modules enables you to lazily load components,
    and maintain it efficiently.


    # Creating modules


    In our application, we''ll utilize the following modules:


    +   - A `users` module that incorporates components for login, signup, and profile.

    +   - A `feed` module that includes the component(s) necessary to show the posts
    retrieved using GraphQL.

    +   - A `shared` module may include elements that are shared with other modules
    in your application.

    +   - A root module containing our application''s global services and common layout
    components, such as the authentication service and header and footer components.


    Shared modules save you time by avoiding the import of common modules, components,
    and other artifacts that are required by several modules in your application.


    For instance, by importing and exporting ReactiveFormsModule from our shared module,
    we can avoid importing it in both the users and feed modules by simply importing
    the shared module.


    Additionally, we''ll import and re-export Angular Material component modules into
    the shared module to make them available to the other modules in our project.


    Let''s begin by creating the modules automatically using the Angular CLI. Open
    a new Terminal window, browse to the folder containing your Angular project, and
    run the following commands:


    ```

    ng generate module shared

    ng generate module users --routing

    ng generate module feed --routing

    ```'
  merge: -1
  img_proc: true
- pgno: 157
  md: "These commands will create a number of files under the src/app/ folder, each\
    \ with its own subdirectory called after the module we specified.\n\nThe shared\
