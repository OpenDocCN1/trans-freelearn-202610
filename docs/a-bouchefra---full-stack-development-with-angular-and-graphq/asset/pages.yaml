  md: '# 10

    Fetching Posts and Adding Comments and Likes


    In the previous chapters, we introduced you to Apollo Client and demonstrated
    how to integrate it with our Angular frontend. We also implemented authentication
    and image uploading, shielded the feed''s posts component from unauthenticated
    users, and built a header component with the application''s navigation buttons
    and a search bar to search for users in our network using their full names.


    We then began creating a profile component, which allows users to add their biography,
    cover image, and photo, as well as create posts.


    In this chapter, we''ll begin by dealing with an authentication token expiration
    issue, which we''ll describe later, and then we''ll continue working on our profile
    component by sending queries to receive paginated posts and comments data, and
    mutations to add comments and likes to posts.'
