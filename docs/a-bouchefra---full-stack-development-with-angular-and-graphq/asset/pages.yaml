- pgno: 73
  md: "+   - Like\n+   - Notification\n\nTo define an entity, we must first create\
    \ a TypeScript file under the entity/ folder. A basic entity is made up of one\
    \ or more columns, one of which should be the primary column.\n\nBegin by creating\
    \ an src/entity/User.ts file and then adding the following entity:\n\n```\nimport\
    \ { Entity, Column, PrimaryGeneratedColumn,\nCreateDateColumn } from 'typeorm';\n\
    \n@Entity()\nexport class User {\n    @PrimaryGeneratedColumn() id: number;\n\
    \    @Column() fullName: string;\n    @Column(\"text\", { nullable: true }) bio:\
    \ string;\n    @Column({ unique: true }) email: string;\n    @Column({ unique:\
    \ true }) username: string;\n    @Column() password: string;\n    @Column({ nullable:\
    \ true }) image: string;\n    @Column({ nullable: true }) coverImage: string;\n\
    \    @Column({ default: 0 }) postsCount: number;\n    @CreateDateColumn() createdAt:\
    \ Date;\n}\n```\n\nAs previously stated, @Entity() instructs TypeORM to match\
    \ the class to a database table. To make it easier for TypeORM to discover the\
    \ entity, we place it in the entity/ folder. This was previously configured in\
    \ the ormconfig.json file's entities array.\n\nTo produce the matching database's\
    \ table columns, we just use the @Column decorator to decorate the class property\
    \ that you wish to make into a column.\n\nTypeORM will map a string to a varchar-like\
    \ type (depending on the database type) and a number to an integer-like type by\
    \ default. We may also modify the default type by supplying the required type\
    \ to the column decorator. It's worth noting that we utilized the text type for\
    \ the bio column rather than the limited varchar type.\n\nTypeORM will build database\
    \ tables with the same names as the entities; however, if you want to use a different\
    \ table name, you may give it in the @Entity decorator — for example, @Entity(\"\
    mytablename\")."
  merge: -1
  img_proc: true
- pgno: 74
  md: "The @PrimaryGeneratedColumn() decorator defines a primary Int column that is\
    \ automatically generated with an auto-incrementing value.\n\nWe added the default\
    \ option to the postsCount column, which specifies that it has a default value\
    \ of zero; the nullable option to the bio, image, and coverImage columns, which\
    \ specifies that they can be null; and the unique option to the username and email\
    \ columns, which specifies that duplicate values are not accepted.\n\nThe @CreateDateColumn()\
    \ decorator adds the entity's insertion date to the createdAt column automatically.\n\
    \nThe id column, which includes the primary key of the corresponding database\
    \ table, and the createdAt column, which contains the date of insertion, will\
    \ be shared by all entities.\n\nFor building the next entities, we'll use the\
    \ same decorators and parameters.\n\nFor representing a user's post, create an\
    \ src/entity/Post.ts file and add the following entity:\n\n```\n```ts\nimport\
    \ { Entity, Column, PrimaryGeneratedColumn,\nCreateDateColumn } from 'typeorm';\n\
    \n@Entity()\nexport class Post {\n    @PrimaryGeneratedColumn() id: number;\n\
    \    @Column(\"longtext\") text: string;\n    @Column({ nullable: true }) image:\
    \ string;\n    @Column({ default: 0 }) commentsCount: number;\n    @Column({ default:\
    \ 0 }) likesCount: number;\n    @Column({ default: \"\" }) latestLike: string;\n\
    \    @CreateDateColumn() createdAt: Date;\n    @Column({ default: false }) likedByAuthUser:\
    \ boolean;\n}\n```\n```\n\nIn this case, we added the longtext option to the text\
    \ column in order to modify the column type from the default (varchar(255) for\
    \ string fields) to longtext.\n\nNext, create the src/entity/Comment.ts file and\
    \ add the following entity to model a user's comment:\n\n```\n```ts\nimport {\
    \ Entity, Column, PrimaryGeneratedColumn,\nCreateDateColumn } from 'typeorm';\n\
    ```\n```"
