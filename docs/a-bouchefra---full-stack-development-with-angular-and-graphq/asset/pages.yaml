    \ modules, to provide routing for each module's components in the *Creating modules,\
    \ services, and components* section using the --routing option.\n\nTo implement\
    \ routing, all you need to do now is add the route/component mappings inside the\
    \ routing modules, but first let's look at what the CLI has done to set up routing.\n\
    \n# The <base href> tag\n\nWhen you view the src/index.html file, you will notice\
