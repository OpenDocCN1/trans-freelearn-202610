- pgno: 115
  md: "# Protecting GraphQL queries and mutations\n\nAfter implementing the GraphQL\
    \ mutations for registering and signing users, we need to protect our other queries\
    \ and mutations using the JWT token that we obtain when users are registered or\
    \ signed in.\n\nFollowing user authentication, the server will transmit a JWT\
    \ token to the client, which should store it locally and send it back with each\
    \ request using an HTTP header (the authorization header).\n\nWe can use the context\
    \ option of Apollo Server to access the authorization header from the request\
    \ object and pass this data to the resolvers. The context is available in each\
    \ resolver.\n\nThe following are the steps required to protect our GraphQL API:\n\
    \n+   1. Open the server/src/index.ts file and add the following code:\n+   2.\
    \ Add the following method, which will be used to verify and retrieve the user's\
    \ information from the JWT using the verify() method, from jsonwebtoken, and the\
    \ secret:\n\n```\nimport jwt from 'jsonwebtoken'\nimport dotenv from 'dotenv';\n\
    dotenv.config();\nconst { JWT_SECRET } = process.env;\n```\n\nWe import the necessary\
    \ symbols and retrieve the JWT_SECRET environment variable from the process.env\
    \ object (loaded during runtime from the .env file using dotenv). This will enable\
    \ us to get our JWT secret from the .env file. Check out https://nodejs.dev/learn/how-to-read-environment-variables-from-nodejs\
    \ for more details about how to read environment variables in Node.js.\n\n```\n\
    const getAuthUser = (token: string) => {\n  try {\n    if (token) {\n      return\
    \ jwt.verify(token, JWT_SECRET as string);\n    }\n    return null;\n  } catch\
    \ (error) {\n    return null;\n  }\n```"
  merge: -1
  img_proc: true
- pgno: 116
  md: "```\n}\n}\n```\n\nNext, we need to confirm the identity of the user before\
    \ allowing them to access the protected endpoints.\n\n3. Update the Context type,\
    \ as follows:\n\n```\nexport type Context = {\n  orm: {\n    userRepository: Repository<User>;\n\
    \    postRepository: Repository<Post>;\n    commentRepository: Repository<Comment>;\n\
    \    likeRepository: Repository<Like>;\n    notificationRepository: Repository<Notification>;\n\
    \  };\n  authUser: User | null;\n};\n```\n\n4. Modify the code for bootstrapping\
    \ Apollo Server, as follows:\n\n```\nconst server: ApolloServer = new ApolloServer({\
    \ schema,\n  context: ({req}) => {\n    const token = req.get('Authorization')\
    \ || '';\n    const authUser = getAuthUser(token.split(' ')[1]);\n    const ctx:\
    \ Context = {\n      orm: {\n        userRepository: userRepository,\n       \
    \ postRepository: postRepository,\n        commentRepository: commentRepository,\n\
    \        likeRepository: likeRepository,\n        notificationRepository: notificationRepository\n\
    \      },\n      authUser: authUser\n    };\n    return ctx;\n  }\n});\n```"
  merge: -1
  img_proc: true
- pgno: 117
  md: "In the context function, we call the get() method of the request object to\
    \ retrieve the value of the authorization header, which should contain the \"\
    JWT: \" string, plus the token. Next, we split the value using space and pass\
    \ the second part, which contains the actual JWT, to our getAuthUser() function\
    \ to decode the token and get the user's information, that is, the user's ID and\
    \ email. Then, we create a ctx object (typed with Context) with the authUser and\
    \ the orm object that contains the TypeORM repositories.\n\nPlease note that we've\
    \ moved the creation of the context object from outside to inside the context\
    \ method of Apollo Server, so you must remove the previous code for creating the\
    \ instance that exists right above the call for bootstrapping Apollo Server. Check\
    \ this GitHub commit for the updates we've made: https://git.io/JgCgO.\n\nAfter\
    \ implementing this, if a JWT is sent back with any request to our GraphQL API,\
    \ we'll be able to access the logged-in user's ID and email from the context parameter\
    \ of any resolver function.\n\n+   5. After that, you can go to the server/src/graphql/resolvers.ts\
    \ file and modify every resolver that you need to protect by adding the following:\n\
    \n```\ngetUser: async (_, args, { orm, authUser }) => {\n  if (!authUser) throw\
    \ new Error('Not authenticated!');\n  // [...] \n}\n```\n\nWe destructure the\
    \ context parameter passed to the function to get the authUser object that contains\
    \ information about the authenticated user. Then, we check whether that object\
    \ is not null; otherwise, we throw an error with the Not authenticated! message.\n\
    \nThis will ensure that every resolver will be protected against unauthenticated\
    \ users.\n\nA better solution is using directives, so let's see how to implement\
    \ this second approach. We'll implement an @auth directive that can be applied\
    \ to the query and mutation fields in the schema to check whether the user is\
    \ authenticated before they can complete the operation:\n\n+   1. Open the server/src/graphql/schema.ts\
    \ file and import the following symbols:\n\n```\nimport { defaultFieldResolver\
    \ } from 'graphql';\nimport { getDirective, MapperKind, mapSchema } from '@\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 118
  md: "```\n```\ngraphql-tools/utils';\nimport { ApolloError } from 'apollo-server-express';\n\
    ```\n```\n\n2. Next, add the following function:\n\n```\n```\nfunction authDirective()\
    \ {\n  return {\n    authDirectiveTypeDefs: gql'directive @auth on\n    FIELD_DEFINITION',\n\
    \    authDirectiveTransformer: (schema: GraphQLSchema)\n      => mapSchema(schema,\
    \ {})\n  };\n}\n```\n```\n\n3. Next, add the following code to the second parameter\
    \ of the mapSchema() function, between the curly braces:\n\n```\n```\n[MapperKind.OBJECT_FIELD]:\
    \ (fieldConfig) => {\n  const directiveName = 'auth';\n  const authDirective =\
    \ getDirective(schema,\n    fieldConfig, directiveName)?.[0];\n  if (authDirective)\
    \ {\n    const { resolve = defaultFieldResolver } =\n      fieldConfig;\n    fieldConfig.resolve\
    \ = (source, args, context,\n      info) => {\n      if (!context.authUser) {\n\
    \        throw new ApolloError(\"User is not\n          authenticated\", \"USER_NOT_AUTHENTICATED\"\
    );\n      }\n      return resolve(source, args, context, info);\n    };\n    return\
    \ fieldConfig;\n  }\n}\n```\n```\n\nFor more details about implementing directives,\
    \ read https://www.graphql-tools.com/docs/schema-directives."
