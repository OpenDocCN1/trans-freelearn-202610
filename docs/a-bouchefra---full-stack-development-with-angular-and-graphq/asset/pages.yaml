  md: "# Using the OnPush change detection strategy\n\nAngular employs the ChangeDetectionStrategy.Default\
    \ strategy by default. This strategy is not the most efficient in terms of performance\
    \ because every time an event occurs in our application, such as clicks or network\
    \ responses, change detection runs on all components. To avoid unnecessary change\
    \ detection runs, we can use the OnPush strategy for some components, as shown\
    \ in the following steps:\n\n+   1. Go to the core/components/header/header.component.ts\
    \ file and import ChangeDetectionStrategy and ChangeDetectorRef from the @angular/core\
    \ module, as follows:\n\n```\nimport { Component, OnInit, ElementRef, ViewChild,\n\
    \  OnDestroy, ChangeDetectionStrategy,\n  ChangeDetectorRef } from '@angular/core';\n\
    ```\n\n+   2. Change the detection strategy to OnPush, like this:\n\n```\n@Component({\n\
    \  selector: 'app-header',\n  templateUrl: './header.component.html',\n  styleUrls:\
    \ ['./header.component.css'],\n  changeDetection: ChangeDetectionStrategy.OnPush\n\
    })\nexport class HeaderComponent implements OnInit,\n  OnDestroy {\n  /* [...]\
    \ */\n}\n```\n\nAfterward, you will notice that the search bar and the buttons\
    \ on the right are not properly rendered if you log out and log back in. This\
    \ occurs because Angular does not run change detection to synchronize the view\
    \ with the component's updated variables—namely, the authUser and isLoggedIn members.\
    \ Let's fix that by manually triggering change detection whenever the auth state\
    \ changes.\n\n+   3. Inject ChangeDetectorRef into the header component's constructor,\
    \ like this:\n\n```\nconstructor(\n  /*...*/,\n  private changeDetectorRef: ChangeDetectorRef)\
    \ { }\n```"
  merge: -1
  img_proc: true
