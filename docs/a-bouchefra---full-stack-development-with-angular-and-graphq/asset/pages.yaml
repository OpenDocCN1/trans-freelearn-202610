- pgno: 170
  md: '# # Debugging Angular applications


    Angular by default runs in development mode, which has debugging enabled and provides
    developers with the enableProdMode() method to enable the production mode. This
    also disables debugging and removes any debugging information from the final production
    bundles.


    With the new Ivy renderer, we also have a set of APIs on the global ng object
    that you can use to invoke methods, update state, and access components right
    from your browser''s console when your Angular application is running. Check out
    https://angular.io/api/core/global for more information.


    After running your Angular application, open your browser''s console; you should
    be able to see the Angular is running in development mode. Call enableProdMode()
    to enable production mode message:


    ![](img/c798729e4c42765fcb1c98950164d0ba_170_0.png)


    Figure 6.2 – Angular is running in development mode message in the console


    This simply tells you that your application is in development mode and has debugging
    enabled.


    After finishing developing your application, you should turn off debugging by
    enabling the production mode using the enableProdMode() function, as follows:


    ```

    ```typescript

    import { enableProdMode } from ''@angular/core'';

    enableProdMode();

    ```

    ```


    Enabling production mode will tell Angular to stop doing many unnecessary things
    that are not required in production, which will both reduce the size of your final
    application bundles and increase the runtime performance.


    In fact, if you open the src/main.ts file of your project, you should see that
    this method is already added:


    ```

    ```typescript

    import { enableProdMode } from ''@angular/core'';

    import { platformBrowserDynamic } from ''@angular/platform-browser-dynamic'';

    import { AppModule } from ''./app/app.module'';

    ```

    ```'
  merge: -1
  img_proc: true
