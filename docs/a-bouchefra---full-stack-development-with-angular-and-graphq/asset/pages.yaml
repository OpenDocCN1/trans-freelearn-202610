    \ which means that Apollo Client first checks the cache to see whether the result\
    \ is there before sending a network request to get the result from the server.\
    \ If the result is present, there is no need to send a network request.\n\nBy\
    \ configuring the fetch policy for this query to be network-only, we ensure that\
    \ Apollo Client always asks our server to retrieve the most up-to-date list of\
    \ users that correspond to the search term entered by the user."
