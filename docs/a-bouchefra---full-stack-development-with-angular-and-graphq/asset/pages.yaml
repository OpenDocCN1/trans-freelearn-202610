- pgno: 110
  md: "In order to hash passwords using Scrypt, you need to create a unique salt for\
    \ each hash. You can check out https://auth0.com/blog/adding-salt-to-hashing-a-better-way-to-store-passwords/\
    \ and https://qvault.io/cryptography/very-basic-intro-to-the-scrypt-hash/ for\
    \ more details.\n\nThis function concatenates and returns both the salt and password's\
    \ hash, which will both be saved to the database because the salt is required\
    \ to verify the password.\n\n9. Add the following method, which will be used to\
    \ compare the plain password to the hash:\n\n```\n```ts\nconst compareToHash =\
    \ async (plainPassword: string, hash: string): Promise<boolean> => {\n  return\
    \ new Promise((resolve, reject) => {\n    const result = hash.split(\":\");\n\
    \    const salt = result[0];\n    const hPass = result[1];\n    crypto.scrypt(plainPassword,\
    \ salt, 64,\n      (error, buffer) => {\n        if (error) reject(error);\n \
    \       resolve(hPass == buffer.toString('hex'));\n      });\n  })\n};\n```\n\
