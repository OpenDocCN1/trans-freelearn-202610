  md: "You can find the source code of this chapter at https://github.com/PacktPublishing/Full-Stack-App-Development-with-Angular-and-GraphQL/tree/main/Chapter06.\n\
    \nTypeScript expertise is not required, however, knowledge of concepts such as\
