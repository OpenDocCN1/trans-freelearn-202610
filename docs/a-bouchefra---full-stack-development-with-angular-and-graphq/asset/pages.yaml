    \ with a particular label.\n\nApollo Server adopts a publish-subscribe mechanism\
    \ to track events for updating active subscriptions.\n\n2. Next, add a Subscription\
    \ object inside the resolvers object, as follows:\n\n```\nSubscription: {\n  onPostCommented:\
    \ {\n    subscribe: () =>\n      pubsub.asyncIterator(['ON_POST_COMMENTED'])\n\
    \  },\n  onPostLiked: {\n    subscribe: () =>\n```"
