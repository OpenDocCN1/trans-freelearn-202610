  md: "# Using GraphQL fragments\n\nIn this section, we'll refactor our code to take\
    \ advantage of another GraphQL feature: **GraphQL fragments.**\n\nMultiple queries\
    \ and mutations make use of the same user's fields that we've used in multiple\
    \ GraphQL documents. Using fragments, we can avoid repeating these fields.\n\n\
    Begin by refactoring our queries to make use of GraphQL fragments. A fragment\
    \ allows you to define a set of fields that you can reuse across multiple queries\
    \ without having to repeat the same ones.\n\nTo refactor existing queries to use\
    \ fragments, follow these steps:\n\n+   1. Create a shared/constants/user.fragments.ts\
    \ file and add the following contents:\n\n```\nimport { gql } from 'apollo-angular';\n\
    \nexport const BASIC_USER_FIELDS_FRAGMENT = gql`\nfragment BasicUserFields on\
    \ User {\n  id fullName bio username image\n}`;\nexport const USER_FIELDS_FRAGMENT\
    \ = gql`\nfragment UserFields on User {\n  id fullName bio email username image\
    \ coverImage\n  postsCount createdAt\n}`;\n```\n\n+   2. Next, let's update our\
    \ query strings to use the previous fragments in their selection sets in order\
    \ to reduce repeated fields that are shared by queries. Open the shared/constants/auth.ts\
    \ file and begin by importing the following fragments:\n\n```\nimport { USER_FIELDS_FRAGMENT\
    \ } from\n  './user.fragments';\n```\n\n+   3. Then, update the LOGIN_MUTATION\
    \ document, as follows:\n\n```\nexport const LOGIN_MUTATION = gql`\n${USER_FIELDS_FRAGMENT}\n\
    mutation signIn($email: String!, $password: String!) {\n  signIn(email:$email,\
    \ password:$password) {\n```"
  merge: -1
