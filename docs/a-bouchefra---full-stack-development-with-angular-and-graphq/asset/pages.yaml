    In this chapter, we will start implementing the profile component''s functionality.
    We''ll add the necessary code to fetch the user that corresponds to a profile
    URL and render their information on the page, including the ability to upload
    the user''s photo and cover image, as well as adding a biography.


    We''ll use extra tools such as GraphQL Code Generator to generate code and automatically
    infer variable and result types rather than manually specifying them, which keeps
    our code clean, maintainable, and scalable.


    We will cover the following topics:


    +   - Image uploading with Angular and Apollo

    +   - Implementing the post service

    +   - Implementing the profile service

    +   - Implementing the base component

    +   - Implementing the profile component'
