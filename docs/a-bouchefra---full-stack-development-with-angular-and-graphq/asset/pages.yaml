- pgno: 107
  md: '# What''s JWT?


    **JWT** stands for **JSON Web Token**, and it''s an open standard (RFC 7519) that
    offers a concise and self-contained mechanism for securely encoding and transmitting
    information between computers as JSON objects.


    When developing GraphQL APIs, you''ll almost always need to secure specific endpoints
    from public access and need users to be authenticated first and authorized (allowed)
    to use the endpoint(s).


    You can achieve that using JWTs. This is how authentication with JWTs works:


    +   1. When users register or sign in, we build a JWT token that includes the
    user''s identity on the server and send it to the client.

    +   2. We need to transmit the received token back to the server with every request
    on the client side so that the server can verify the client''s identity and determine
    whether they are permitted to visit the endpoint.


    In contemporary web apps, where we have a JavaScript client app that has to interface
    with an API to query and save data to the server, JWT authentication is quite
    popular and efficient.


    Because tokens are not encrypted but merely signed using cryptographic techniques,
    using HTTPS with JWT is needed when persisting the user''s data to secure it from
    any man-in-the-middle attacks that may intercept and manipulate it.


    Authentication may be accomplished in a number of ways. The most typical method
    is to ask for the user''s email and password using a login form that the user
    fills out.


    When protecting our APIs, we should note the difference between two concepts:


    +   - **Authentication**, which is the process of confirming a user''s identity.

    +   - **Authorization**, which is used to verify whether the authenticated user
    is authorized to access or perform certain actions based on their role on the
    system.


    Now that we understand what a JWT token is and the difference between authentication
    and authorization, let''s see how to implement authentication with Apollo.


    # Implementing authentication


    You''ll almost always need to safeguard queries and mutations from unauthenticated
    and/or unauthorized users while implementing your GraphQL API. In this section,
    we''ll add authentication with JWT to our GraphQL API.'
