  md: "# Defining types for user authentication\n\nTypeScript is a strongly typed\
    \ programming language. We'll use this to write type-safe code, which helps prevent\
    \ unexpected errors and enables auto-completion from IDEs for increased productivity.\n\
    \nLet's take a look at how to create TypeScript types for strongly typing server\
    \ responses. We'll start with the User model, which represents a single user and\
    \ encapsulates the fields corresponding to the GraphQL API's user information:\n\
    \n+   1. Create a shared/models/user.model.ts file and add, then export, a TypeScript\
    \ interface with the following fields that refer to the user's details and their\
    \ types:\n+   2. Create a shared/types/auth.ts file and start by importing the\
    \ User model:\n\n```\n```ts\nexport interface User {\n  id: string;\n  fullName:\
    \ string;\n  bio: string;\n  username: string;\n  email: string;\n  image: string;\n\
    \  coverImage: string;\n  postsCount: number;\n  createdAt: string;\n}\n```\n\
    ```\n\nThe preceding code block specifies the format of the user data returned\
    \ by the GraphQL API.\n\n```\n```ts\nimport { User } from '../models/user.model';\n\
    ```\n```\n\nThen, to strongly type the authentication state, define and export\
    \ the following interface:\n\n```\n```ts\nexport interface AuthState {\n  isLoggedIn:\
    \ boolean;\n  currentUser: User | null;\n  accessToken: string | null;\n};\n```\n\
    ```"
