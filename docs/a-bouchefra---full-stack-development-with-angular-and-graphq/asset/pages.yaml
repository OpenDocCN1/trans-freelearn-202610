    \ OnPostCommentedGQL,\n  private onPostLiked: OnPostLikedGQL) { }\n```\n\n4. Add\
    \ the following method for subscribing to new comments to the component's class:\n\
    \n```\nsubscribeToNewComments() {\n  const onPostCommentedObs = this.onPostCommentedGQL\n\
    \    .subscribe();\n  onPostCommentedObs\n    .subscribe({\n      next: (result)\
    \ => {\n        const comment = result.data?.onPostCommented;\n        if (this.authUser?.id\
    \ !== comment?.author.id) {\n          this.notificationsCount++;\n          this.changeDetectorRef.markForCheck();\n\
    \        }\n      }\n    });\n}\n```\n\nHere, we called the subscribe() method\
    \ of the GraphQL service to return an Observable that we can subscribe to, to\
    \ start listening for new comments.\n\nThen, we subscribed to the returned Observable\
    \ to start listening for new comments. In the next handler of the observer object,\
    \ we retrieved the comment from the GraphQL subscription response; we increment\
    \ the notificationsCount property if the comment's author is different from the\
    \ currently logged-in user."
  merge: -1
  img_proc: true
- pgno: 373
  md: "5. Similarly, add the following method for subscribing to new likes to the\
    \ component's class:\n\n```\nsubscribeToNewLikes() {\n    const onPostLikedObs\
    \ = this.onPostLiked\n        .subscribe();\n    onPostLikedObs.subscribe({\n\
    \        next: (result) => {\n            const like = result.data?.onPostLiked;\n\
    \            if (this.authUser?.id !== like?.user.id) {\n                this.notificationsCount++;\n\
    \                this.changeDetectorRef.markForCheck();\n            }\n     \
    \   }\n    });\n}\n```\n\n6. Call the previous methods from the ngOnInit() method\
    \ of the component, as follows:\n\n```\nngOnInit(): void {\n    this.authService.authState\n\
    \        .pipe(takeUntil(this.destroyNotifier$))\n        .subscribe({\n     \
    \       next: (authState: AuthState) => {\n                this.isLoggedIn = authState.isLoggedIn;\n\
    \                this.authUser = authState.currentUser;\n                this.changeDetectorRef.markForCheck();\n\
    \                this.subscribeToNewComments();\n                this.subscribeToNewLikes();\n\
    \            }\n        });\n}\n```"
  merge: -1
  img_proc: true
- pgno: 374
  md: "7. Finally, display the notifications count in the template using a Material\
    \ badge. Open the src/app/core/components/header/header.component.html file and\
    \ update the Notifications button, as follows:\n\n```\n<button *ngIf=\"isLoggedIn\"\
    \ mat-icon-button matTooltip=\"Notifications\">\n  <mat-icon aria-hidden=\"false\"\
    \ aria-label=\"Notifications\" [matBadge]=\"\n    \"notificationsCount\" matBadgeColor=\"\
    warn\">\n    notifications\n  </mat-icon>\n</button>\n```\n\nHere, we added the\
    \ matBadge attribute to the <mat-icon> element and bound it to the notificationsCount\
    \ property of the component.\n\nThat's it – you should now be able to receive\
    \ and display the notifications of new comments and likes in your application.\
    \ Check out the commit at https://git.io/JDuoK.\n\nYou can always extend this\
    \ implementation to display more information about the notifications the users\
    \ receive.\n\n# Summary\n\nIn this final chapter, we learned how to configure\
    \ Apollo Client for GraphQL subscriptions and then added code to display notifications\
    \ in the application's header using a badge.\n\nThroughout this book, we have\
    \ used cutting-edge technologies such as Angular and GraphQL to develop a full\
    \ stack application with a monorepo architecture using Lerna. We used Apollo on\
    \ both the client and server to send and respond to GraphQL queries.\n\nAfter\
    \ setting up the development environment and installing Node.js, we built a server\
    \ with GraphQL support to implement the backend using Express.js and Apollo Server.\
    \ We also used Apollo Studio to communicate with our GraphQL API before we started\
    \ developing a frontend application to consume the API and present a user interface\
    \ to users to communicate with the backend.\n\nAfter that, we explained how to\
    \ install Express.js and configure it with TypeScript and GraphQL. We used mocking\
    \ to provide a working GraphQL server with Apollo Server before implementing the\
    \ resolvers that are responsible for fetching and adding data."
  merge: -1
  img_proc: true
- pgno: 375
  md: 'Then, we learned how to connect a MySQL database to our web application using
    TypeORM and implemented the resolvers for communicating with the database. We
    exposed a working GraphQL API with resolvers that query and remove data from a
    real MySQL database.


    We also utilized TypeORM to abstract the database operations, allowing developers
    to use any desired database management system for their application without changing
    the code. We learned how to connect TypeORM to Apollo, as well as how to generate
    and seed database tables.


    Next, we added authentication and image uploads with Apollo Server to our GraphQL
    API and learned about the necessary concepts for adding authentication with Node.js,
    Express, and Apollo Server, as well as for handling image uploads.


    We also added realtime support with authentication to our server application,
    which enabled us to communicate fresh data from the server to the client as soon
    as it becomes available. To do this, we leveraged Apollo Server''s GraphQL subscriptions
    to push new comments and likes on users'' posts from the server to the client,
    right at the moment when they are added.


    After implementing the backend, we used the Angular CLI to create a new Angular
    project and reviewed many fundamental Angular concepts, such as modules, components,
    and services. We also learned how to use the Angular CLI to generate the artifacts
    that constitute the structure of the application.


    Then, we utilized Angular Material in the project to provide Material design components
    to create a visually appealing application UI.


    Finally, we integrated the frontend that we built using Angular with the backend
    using Apollo Client, which is designed to send GraphQL queries and mutations to
    the server to fetch and write data.


    After developing and testing the application and adding any extra features that
    you want, you can build the production bundles and host them with your preferred
    hosting service. Please refer to the official documentation at `https://angular.io/guide/deployment`
    for more information about this process.


    Thanks for taking the time to read this book and I hope you enjoyed it.'
  merge: -1
  img_proc: true
