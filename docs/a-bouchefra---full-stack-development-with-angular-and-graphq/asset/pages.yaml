  md: "We use the `importDocumentNodeExternallyFrom` option, with `documentMode` set\
    \ to `external` to import the base types generated with the `typescript-operations`\
    \ plugin in their own file, which is `graphql-operations.ts` in our case, and\
    \ we use the `importOperationTypesFrom` option to prefix them with the `Operations`\
    \ prefix.\n\nFor more information, check out https://www.graphql-code-generator.com/docs/plugins/typescript-document-nodes.\n\
    \nThis configuration was used to avoid generating the same basic types, document\
    \ types, and GraphQL operations in each file. We create them once and import them\
    \ from other files as needed. Check out all the available plugins at https://www.graphql-code-generator.com/docs/plugins/index.\n\
    \n# Adding fragments and mutations\n\nIn this section, we'll add the necessary\
    \ fragments and mutations for creating posts and uploading images, and then generate\
    \ the results' types and the Apollo services for sending the mutations to the\
    \ server, before implementing the users module's profile service.\n\nIf you are\
    \ unfamiliar with fragments, read the official guide at https://graphql.org/learn/queries/#fragments.\n\
    \nLet's start by adding the GraphQL fragments and mutations:\n\n+   1. Begin by\
    \ creating the `graphql.documents/` folder inside the `client/src/app/` folder,\
    \ then create the `graphql.documents/user.graphql` file, and add the following\
    \ fragment on the User type:\n+   2. Add the UserFields fragment as follows:\n\
    \n```\n```graphql\nfragment BasicUserFields on User {\n  id\n  fullName\n  username\n\
    \  image\n}\n```\n```\n\nThis fragment contains a set of basic fields from our\
    \ GraphQL schema's User type.\n\n```\n```graphql\nfragment UserFields on User\
    \ {\n  ...BasicUserFields\n  email\n  bio\n}\n```\n```"
