  md: "Inside the body of the constructor, add the following code:\n\n```\n```\nconst\
    \ localToken = this.getLocalToken();\nlet isLoggedIn = false;\nif (localToken)\
    \ {\n    isLoggedIn = this.tokenExists() &&\n        !this.tokenExpired(localToken);\n\
    }\nthis.authSubject = new BehaviorSubject<AuthState>({\n    isLoggedIn: isLoggedIn,\n\
    \    currentUser: this.getLocalUser(),\n    accessToken: localToken\n});\nthis.authState\
    \ = this.authSubject.asObservable();\nthis.isLoggedInAsync = this.authState.pipe(map(state\n\
    \    => state.isLoggedIn()));\n```\n```\n\nInside the constructor, we created\
    \ the instance of BehaviorSubject with an initial state retrieved from the browser's\
    \ local storage (used for persisting the authentication state after leaving the\
    \ application).\n\nAfter creating the authentication subject, we call the asObservable()\
    \ method to take only the Observable part of the subject and assign it to the\
    \ authState property. This can be used by the other components or services to\
    \ watch for the authentication state since it's declared as a public property.\n\
    \nA subject is both an Observer and an Observable; but to watch the state from\
    \ the other components, we only need the Observable part.\n\nWe also created the\
    \ isLoggedInAsync property, which exposes only the isLoggedIn part of the authentication\
    \ state using the map() operator on the authState Observable.\n\nTo get the access\
    \ token, the current user, and the logged-in state stored on the local storage\
    \ of the user's browser, we use the getLocalToken(), getLocalUser(), tokenExists(),\
    \ and tokenExpired() methods of the service, which we'll define in the next steps.\n\
    \nIf a token exists in localStorage and is not expired, we set the isLoggedIn\
    \ variable to true and provide it as an initial value to the authentication subject\
    \ along with the current user and access token."
