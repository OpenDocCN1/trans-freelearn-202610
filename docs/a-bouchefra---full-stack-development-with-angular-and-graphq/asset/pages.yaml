- pgno: 43
  md: "# Creating the server\n\nNow, we're ready to create our Express server:\n\n\
    +   1. Create a src/index.ts file using the following commands from the root of\
    \ your server/ folder:\n\n```\n```bash\nmkdir src && touch src/index.ts\n```\n\
    ```\n\nNote that in the case of TypeScript, we're using the .ts file extension\
    \ instead of the .js extension, which is used for plain JavaScript source files.\n\
    \n+   2. Next, open the src/index.ts file and add the following code, which is\
    \ required to start a server on the 8080 port of localhost:\n\n```\n```typescript\n\
    import express, { Application } from 'express';\nconst PORT = 8080;\nconst app:\
    \ Application = express();\napp.get('/', (req, res) =>\n  res.send('Express is\
    \ successfully running!'));\napp.listen(PORT, () => {\n  console.log('Server is\
    \ running at\n    http://localhost:${PORT}');\n});\n```\n```\n\nIn the preceding\
    \ code, we start by importing express and Application from the express module\
    \ and then define a constant to hold the port number where our server will be\
    \ listening.\n\nNext, we create an application instance and add a route using\
    \ the get() method of the Express application. This route will enable us to invoke\
    \ a handler method when a GET request is made to the / endpoint. Finally, we call\
    \ the listen() method of the Express application to start listening for HTTP requests\
    \ on the provided port.\n\nWe create routes in Express.js using some methods that\
    \ are available on the Express application. These methods contain the names of\
    \ the HTTP requests that can be handled by the route; for example, you can use\
    \ .get() for GET requests, and .post() for POST requests. You can check the documentation\
    \ at https://expressjs.com/en/4x/api.html#app.METHOD for a complete list.\n\n\
    In the example we'll be building in this book, we don't need to use many routes\
    \ because GraphQL only needs one endpoint that can listen to and handle all the\
    \ requests in our app."
  merge: -1
  img_proc: true
- pgno: 44
  md: "3. Now, we can run our server using ts-node by adding the following start script\
    \ to our package.json file:\n\n```\n\"scripts\": {\n  \"start\": \"ts-node ./src/index.ts\"\
    ,\n},\n```\n\n4. Head back to your Terminal and run the following command to invoke\
    \ the previous script, which starts our server:\n\n```\nnpm start\n> [...] \n\
    Server is running at http://localhost:8080\n```\n\nIf you visit the http://localhost:8080\
    \ address with your web browser, you should see a blank page with the following\
    \ message: Express is successfully running!\n\nNow that we've created our Express.js\
    \ server, we'll learn how to configure our project to watch for any code changes\
    \ during development, automatically recompile our code, and restart the server.\n\
    \n# Watching and recompiling our code\n\nAt this point, we can easily run our\
    \ TypeScript code without compilation using ts-node. This is great for development,\
    \ but every time we change our code, we'll need to stop and execute our script\
    \ again.\n\nThis isn't appropriate when it comes to developing real-world projects,\
    \ so we can take this a step further by using some utilities that watch the project's\
    \ folder, such as nodemon and ts-node-dev. Let's use the latter because it's the\
    \ easiest one to use.\n\nHead back to your Terminal, stop your running server,\
    \ and run the following command from your server application:\n\n```\nnpm install\
    \ --save-dev ts-node-dev\n```\n\nThis command will install ts-node-dev as a development\
    \ dependency.\n\nNext, change the start script in the package.json file, as follows:\n\
    \n```\n\"scripts\": {\n  \"start\": \"ts-node-dev --respawn ./src\"\n},\n```"
  merge: -1
  img_proc: true
- pgno: 45
  md: "Next, run your start script again and change your index.ts file (you can simply\
    \ add a comment, such as // Our code is being watched and recompiled now thanks\
    \ to ts-node-dev). Your server should restart without doing this manually and\
    \ it will output a message in the Terminal that is similar to the following:\n\
    \n```\n[INFO] 16:57:48 Restarting: /home/ahmed/ngsocial/packages/\nserver/src/index.ts\
    \ has been modified\nServer is running at http://localhost:8080\n```\n\nThis is\
    \ a good setup for development, but when your project is ready for deployment,\
    \ you only need to compile your TypeScript code to plain JavaScript once.\n\n\
    We can achieve this by adding another script that simply invokes the tsc compiler.\
    \ Go back to the package.json file and add a script named build (you can choose\
    \ any valid name you want), as follows:\n\n```\n\"scripts\": {\n  \"start\": \"\
    ts-node-dev --respawn ./src\",\n  \"build\": \"tsc --project ./\"\n}\n```\n\n\
    The --project flag is used to specify the folder of the TypeScript files that\
    \ will be compiled to JavaScript. Here, we specified ./ where the tsconfig.json\
    \ file exists. This command will allow us to run the tsc compiler without specifying\
    \ the full ./node_modules/typescript/bin/tsc path of the compiler.\n\nThere are\
    \ other ways to do this, such as installing TypeScript globally on our system\
    \ using the -g switch of the npm install command or using npx to run tsc from\
    \ the npm registry without installing it (npx tsc).\n\nHead back to your Terminal,\
    \ stop the running server, and let's invoke our build script using the following\
    \ command from the root of your server project:\n\n```\nnpm run build\n```\n\n\
    This will run the tsc compiler to compile our project's files as plain JavaScript.\
    \ At this point, we only have one file (index.ts), which will be converted into\
    \ JavaScript code in the dist/src/index.js file."
  merge: -1
  img_proc: true
