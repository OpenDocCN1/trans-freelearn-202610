  md: 'Then, we provide the `variables` object with the arguments needed by the query,
    which are the `userId`, `offset`, and `limit` arguments.


    Next, we set `fetchPolicy` to `cache-and-network` to instruct Apollo to check
    the cache first for available data and then send a request to the GraphQL server
    to get newer data and save it to the cache. This last step happens regardless
    of whether any data is found in the cache.


    +   5. Open the `src/app/cache.ts` file and add the `offsetLimitPagination` import,
    as follows:


