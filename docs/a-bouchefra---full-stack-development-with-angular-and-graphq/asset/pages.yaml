- pgno: 347
  md: '# 11

    Implementing

    GraphQL

    Subscriptions


    In the previous chapter, we learned how to use Apollo Client to send queries and
    mutations to the backend API that we implemented previously to fetch paginated
    posts and comments, as well as create new comments and likes.


    In this chapter, we''ll continue building our users'' profile components before
    learning how to add realtime support to our application. This will allow us to
    retrieve and display new data from the server without having to constantly refresh
    the app. We''ll utilize GraphQL subscriptions with Apollo Client and Angular to
    do this.


    Then, we''ll configure Apollo Client for GraphQL subscriptions and show you how
    to get and display notifications in the application''s header through a badge.
    GraphQL subscriptions allow the app to acquire new data from the server without
    having to manually refresh the app.


    In this chapter, we will cover the following topics:


    +   - Persisting the component state with reactive variables

    +   - Using field policies to rewrite dates'
