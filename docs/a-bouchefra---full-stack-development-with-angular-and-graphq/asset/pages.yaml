- pgno: 108
  md: "In Apollo, we can retrieve the JWT token sent back by the client from the HTTP\
    \ header, extract the user information from that token, and include it in the\
    \ context, which can be accessed from any resolver. In the resolver, we can use\
    \ the user's information to verify what data the user is authorized to access.\n\
    \nWe'll be using libraries such as dotenv for loading environment variables from\
    \ a .env file that we can use to add the secret required for generating JWTs,\
    \ and jsonwebtoken for generating the tokens. We'll also be using the Scrypt algorithm\
    \ for hashing the users' passwords before saving them to the database.\n\nLet's\
    \ now see the practical steps:\n\n1. Let's get started by installing the required\
    \ libraries using the following commands from the folder of your server project:\n\
    \n```\nnpm install dotenv jsonwebtoken\n```\n\n```\nnpm install --save-dev @types/jsonwebtoken\n\
    ```\n\n2. Add the following type to your GraphQL schema, available from the server/src/graphql/schema.graphql\
    \ file:\n\n```\ntype AuthPayload {\n    token: String!\n    user: User!\n}\n```\n\
    \n3. Next, we need to add two mutations for registering and signing in users to\
    \ the src/graphql/schema.graphql file:\n\n```\ntype Mutation {\n    [...]\n  \
    \  register(fullName: String!, username: String!,\n    email: String!, password:\
    \ String!): AuthPayload!\n    signIn(email: String!, password: String!):\n   \
    \ AuthPayload!\n}\n```\n\n4. After updating the schema, you need to regenerate\
    \ the types. Open a new command-line interface and run the following command from\
    \ the folder of your monorepo project (where the /packages folder lives):\n\n\
    ```\nnpm run codegen\n```"
