- pgno: 262
  md: '+   - Creating the profile UI

    +   - Implementing the `create-post` component


    # Technical requirements


    To complete this chapter''s steps, you must first finish the previous chapter
    of this book.


    You should also be acquainted with the following technologies:


    +   - JavaScript/TypeScript

    +   - HTML

    +   - CSS


    This chapter''s source code can be found at https://github.com/PacktPublishing/Full-Stack-App-Development-with-Angular-and-GraphQL/tree/main/Chapter07.


    # Image uploading with Angular and Apollo


    Uploading images is a required feature of any social network; in our case, we
    need images not only for posts, but also for the user''s photo and profile cover.


    We''ve added three mutations to the backend: `uploadFile`, `setUserPhoto`, and
    `setUserCover`. In this section, we''ll write the code for sending requests to
    call these GraphQL mutations to create posts with or without an image, as well
    as setting the user''s profile photo and cover.


    We manually created the GraphQL documents in the previous section by wrapping
    the queries and mutations with the `gql` tag, which returns the documents (objects
    of the `DocumentNode` type) that we pass to Apollo Client methods to fetch or
    mutate data.


    Then, for communicating with our GraphQL API, we created types for results/responses
    and implemented the Apollo services, which extend the generic `Query` or `Mutation`
    classes.


    This works, but as our code base grows, it is unlikely to scale because manually
    writing and maintaining types requires extra work to ensure the types of the results
    (and variables) match the selection sets (and GraphQL arguments) we are working
    with. This increases the likelihood of errors such as typos.'
  merge: -1
  img_proc: true
- pgno: 263
  md: 'Fortunately, we have generation tools such as GraphQL Code Generator, which
    generates TypeScript types and even Apollo services.


    Using various plugins, this tool generates complete types and code constructs
    such as GraphQL documents and Apollo services (for apollo-angular) by providing
    the server schema and GraphQL queries and mutations. Check out https://www.graphql-code-generator.com.


    To generate TypeScript types for variables and results, we can use the @graphql-codegen/typescript
    and @graphql-codegen/typescript-operations plugins.


    Then, using the @graphql-codegen/typescript-apollo-angular plugin, we can generate
    Angular services.


    This saves you from having to manually create and update the types. The tool was
    recently expanded so that you don''t have to manually specify the types when calling
    the Apollo Client APIs (or any GraphQL client you prefer to use).


    This feature is implemented in the graphql-typed-document-node plugin, which generates
    DocumentNode objects with strong typing. See https://github.com/dotansimha/graphql-typed-document-node
    and https://the-guild.dev/blog/typed-document-node for more information.


    In this section, we''ll continue implementing our application, but this time we''ll
    use the code generator, which we''ll configure with the necessary plugins, to
    generate services and typed DocumentNode objects to automatically infer variable
    and result types, rather than specifying them manually, which keeps our code clean,
    maintainable, and scalable!


    # Setting up GraphQL Code Generator


    Typed document nodes are supported by apollo-angular versions 2.6.0 and higher,
    so let''s make sure we have the most recent versions of the @apollo/client and
    apollo-angular packages by running the following commands from the client/ folder
    to upgrade the existing dependencies:


    ```

    ```bash

    npm i @apollo/client

    npm i apollo-angular

    ```

    ```


    Please keep in mind that this step may not be necessary in your case because support
    for typed documents was added while this book was being written.'
  merge: -1
  img_proc: true
- pgno: 264
  md: "Let's go over how to set up GraphQL Code Generator to generate typed documents\
    \ and services for interacting with the GraphQL API step by step:\n\n+   1. To\
    \ begin, open your terminal and execute the following commands from the root of\
    \ your monorepo project to install the necessary dependencies:\n\n```\nnpm i @graphql-codegen/cli\n\
    npm i @graphql-typed-document-node/core\nnpm i @graphql-codegen/typescript\nnpm\
    \ i @graphql-codegen/typescript-operations\nnpm i @graphql-codegen/typed-document-node\n\
    npm i @graphql-codegen/typescript-apollo-angular\nnpm i @graphql-codegen/import-types-preset\n\
    ```\n\nWe previously installed the CLI while working on the server-side application,\
    \ but reinstalling it ensures that we have the most recent version.\n\n+   2.\
    \ Open the codegen.yml file in the monorepo project's root directory and update\
    \ it to point to your GraphQL documents using the documents field in the root-level\
    \ configuration, as shown here:\n\n```\ndocuments: './packages/client/src/**/*.graphql'\n\
    ```\n\nThe field was added at the same level as the schema field. The field accepts\
    \ a variety of options. In our case, we used a glob expression to specify multiple\
    \ files that could exist in the ./packages/client/src/ folder's subfolders. Check\
    \ out https://www.graphql-code-generator.com/docs/getting-started/documents-field\
    \ for more information on this field.\n\n+   3. Under the generates field, add\
    \ the following output for generating types:\n\n```\ngenerates:\n  # [...] \n\
    \  ./packages/graphql-types/src/types.ts:\n    plugins:\n      - typescript\n\
    ```\n\nTo generate the types that will be imported in the next generated files,\
    \ we use the TypeScript plugin."
  merge: -1
  img_proc: true
- pgno: 265
  md: "4. Similarly, add the following output for generating GraphQL documents and\
    \ operations:\n\n```\n./packages/graphql-types/src/client/\n  graphql-operations.ts:\n\
    \  preset: import-types\n  presetConfig:\n    typesPath: ../types\n  plugins:\n\
    \    - typescript-operations\n    - typed-document-node\n```\n\nThe import-types\
    \ preset is used to import and reuse previously generated types from the ../types\
    \ path, and the typescript-operations and typed-document-node plugins are used\
    \ to generate the GraphQL operations and typed documents.\n\n5. Finally, use the\
    \ typescript-apollo-angular plugin to generate the Angular services as follows:\n\
    \n```\n./packages/client/src/app/core/gql.services.ts:\n  config:\n    documentMode:\
    \ external\n    importOperationTypesFrom: Operations\n    importDocumentNodeExternallyFrom:\n\
    \      '@ngsocial/graphql/documents'\n  plugins:\n    - typescript-apollo-angular\n\
    ```\n\nIn the config field, we pass options to import the documents from the '@ngsocial/graphql/documents'\
    \ path, which will be configured to point to the graphql-operations.ts file we\
    \ generated previously, since they are required by the services that will be generated.\n\
    \nOtherwise, we'll have to add the typescript-operations plugin here, too, which\
    \ will generate the same types in the gql.services.ts file. Check out more on\
    \ the config field at https://www.graphql-code-generator.com/docs/getting-started/config-field."
