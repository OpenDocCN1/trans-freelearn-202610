  md: "```\n```\n    AppRoutingModule\n  ],\n  providers: [],\n  bootstrap: [AppComponent]\n\
    })\nexport class AppModule { }\n```\n```\n\nAppRoutingModule is imported from\
    \ the app-routing.module.ts file and added to AppModule imports array. The same\
    \ was done in the users and feed modules for each routing module.\n\nWe've documented\
    \ all of the steps that the Angular CLI took automatically to establish routing\
    \ in our project. In the following part, we'll look at how to add routes to our\
    \ previously created components in order to provide in-app navigation.\n\n# Understanding\
    \ and adding routes\n\nAs previously stated, the Angular CLI automatically configured\
    \ routing when creating our project, so all we need to do now is specify the routes\
    \ to the components of our application that we previously created.\n\nNot all\
    \ components are routable – in other words, they should be mapped to particular\
    \ paths. For example, the header component will be included in other components\
    \ to render the header element of the page through its selector, therefore we\
    \ do not need to include it in our routing module's routes array.\n\nA route is\
    \ a Route object that holds information about which component maps to which path.\
    \ A path is a URL element that specifies which view should be navigated to.\n\n\
    A route may have one or more of the following attributes:\n\n+   - **path**: A\
    \ property that holds the route's path.\n+   - **pathMatch**: A property for configuring\
    \ the matching strategy that the router will use to match the path. It can have\
    \ a `prefix` or a `full` value, with the `prefix` being the default.\n+   - **component**:\
    \ A property referring to the component that should be mapped to the route.\n\
    +   - **redirectTo**: A property that contains another path to which you wish\
    \ to be redirected if the path in the `path` property matches.\n+   - **loadChildren**:\
    \ A property to lazy-load a module by the router."
