    # Defining Apollo services


    After defining the GraphQL queries and mutations, as well as the types of responses
    that will be returned after the requests are sent to the server, we must now create
    a slew of services for registering, authenticating, and searching for users.


    The Apollo Client library for Angular supports two methods of communicating with
    the server:


    +   - Using the Apollo service, an Angular service that includes methods such
    as `query()` and `watchQuery()` to send queries, as well as `mutate()` and `subscribe()`
    to send mutations and subscriptions.

    +   - Built-in `Query`, `Mutation`, and `Subscription` services.


    Mutation, Query, and Subscription are generic TypeScript classes that accept a
    generic type parameter between angle brackets after the class name. We specify
    the expected response type for each service and the document property for the
    mutation, query, or subscription that will be sent to the server. Check out https://apollo-angular.com/docs/data/services.


    > **Note**

    > For more information about the generic classes in TypeScript, check out https://www.typescriptlang.org/docs/handbook/2/generics.html#generic-classes.


    We''ll use both approaches to communicate with our backend throughout this book.
    More information can be found in the official documentation at https://apollo-angular.com/docs/.'
