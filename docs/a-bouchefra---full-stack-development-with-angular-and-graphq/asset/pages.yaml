  md: "Then, add and export the user query for getting a user by ID:\n\n```\nexport\
    \ const USER_QUERY = gql'\nquery getUser($userId: ID!){\n  getUser(userId:$userId){\n\
    \    id fullName bio email username image coverImage\n    postsCount createdAt\
    \ }\n}\n';\n```\n\nHere, we use the query operation type and we pass the user\
    \ ID as an argument to ask the API server to return an existing user with that\
    \ ID. The Query type on the server contains the getUser field that we are querying\
    \ and because it returns a user object, we provide a selection set to ask for\
    \ the fields that we are interested in, on the client side.\n\n5. Add and export\
    \ the following query to search for users:\n\n```\nexport const SEARCH_USERS_QUERY\
    \ = gql'\nquery searchUsers($searchQuery: String!){\n  searchUsers(searchQuery:$searchQuery){\n\
    \    id fullName bio username image\n  }\n}\n';\n```\n\nHere, we use a query operation\
    \ type to ask for the searchUsers field on the top-level query of the GraphQL\
    \ schema, which returns an array of users with full names that contain the search\
    \ term passed as an argument. We then specify a selection set for selecting the\
    \ user fields that we are interested in, such as the user's ID, full name, bio,\
    \ username, and image.\n\n6. Finally, create a shared/index.ts file (barrel file)\
    \ and export the defined constants, as follows:\n\n```\nexport * from './constants/auth';\n\
    export * from './constants/user';\n```\n\nFollowing the definition of the queries\
    \ and mutations that will be parsed and sent to the server via Apollo Client,\
    \ we must define the types of responses/results that will be returned from the\
    \ API server."
