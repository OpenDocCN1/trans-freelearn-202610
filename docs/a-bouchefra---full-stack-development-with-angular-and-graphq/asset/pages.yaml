    \  query: SEARCH_USERS_QUERY,\n  variables: {\n    searchQuery: searchQuery,\n\
    \    offset: offset,\n    limit: limit\n  },\n  fetchPolicy: 'network-only',\n\
    });\n```\n\nFor a given query, you can specify different fetch policies. Include\
    \ fetchPolicy to accomplish this. In this case, we instruct Apollo Client to ignore\
    \ the cache and retrieve data directly from the server by using the network-only\
    \ fetch policy. As a result, we will never reuse locally cached data and will\
    \ always send a network request to retrieve the query, ignoring any locally cached\
    \ data.\n\nA fetch policy specifies how the Apollo Client will use the cache for\
