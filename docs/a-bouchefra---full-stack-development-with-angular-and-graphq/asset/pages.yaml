  md: "You can find more details about the supported fetch policies at https://www.apollographql.com/docs/react/data/queries/#supported-fetch-policies.\n\
    \n13. Then, add the following function, which wraps the fetchMore() method of\
    \ Apollo Client:\n\n```\nconst fetchMore: (users: User[]) => void = (users:\n\
    \    User[]) => {\n        feedQuery.fetchMore({\n            variables: {\n \
    \               offset: users.length,\n            }\n        });\n    }\n```\n\
    \nIn this method, we pass the GraphQL query for searching users to the query attribute\
    \ in the Apollo.watchQuery() method. The method returns a QueryRef object that\
    \ contains the valueChanges property, which is an Observable. We return an object\
    \ of the SearchUsersReponse type with a data property, which is an Observable\
    \ of the UsersResponse type, and a fetchMore property, which is a function that\
    \ can be used to fetch more users according to the passed pagination parameters.\n\
    \n> Note\n> The fetchMore() method is provided by Apollo for data pagination.\n\
    > Check out https://apollo-angular.com/docs/caching/interaction/#incremental-loading-fetchmore.\n\
    \nThe method takes a set of variables to be sent with the query. We also set the\
    \ offset to users.length so that we can fetch users that aren't already fetched.\n\
    \nWhen obtaining paginated data, we'll be using offset-based pagination. As implemented\
    \ in this approach, the paginated field receives two arguments: a limit argument,\
    \ which determines the amount of data that we want to fetch, and an offset argument,\
    \ which tells us where in the set of data the server should start when returning\
    \ results for a certain query."
