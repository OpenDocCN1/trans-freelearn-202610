- pgno: 76
  md: "Following that, we must build certain relationships between the entities in\
    \ accordance with the following requirements:\n\n+   - A user may have one or\
    \ more notifications, posts, comments, and likes.\n+   - A post may be associated\
    \ with one or more comments and likes, an author, and the most recent comment.\n\
    \nReturn to the src/entity/User.ts file and include the following imports:\n\n\
    ```\nimport { OneToMany } from 'typeorm';\nimport { Post } from './Post';\nimport\
    \ { Comment } from './Comment';\nimport { Like } from './Like';\nimport { Notification\
    \ } from './Notification';\n```\n\nWe just imported the entities that will be\
    \ associated with the user entity and the decorator that will be used to construct\
    \ the one-to-many relationship in this case.\n\nAdd the following fields next:\n\
    \n```\n@Entity()\nexport class User {\n  // [...] \n  @OneToMany(type => Post,\
    \ post => post.author) posts:\n    Post[];\n  @OneToMany(type => Comment, comment\
    \ => comment.author)\n    comments: Comment[];\n  @OneToMany(type => Like, like\
    \ => like.user) likes:\n    Like[];\n  @OneToMany(type => Notification, notification\
    \ =>\n    notification.user) notifications: Notification[];\n}\n```\n\nHere, we\
    \ added some extra fields of the array type, including posts, comments, likes,\
    \ and notifications with @OneToMany annotations. This is one of the provided entity\
    \ relationships by TypeORM.\n\nTypeORM inserts the necessary foreign keys between\
    \ tables when using entity relationships."
  merge: -1
  img_proc: true
- pgno: 77
  md: "We modeled the requirement where a user may have many comments, likes, and\
    \ notifications.\n\nIn addition, we utilized the @OneToMany decorator to construct\
    \ a one-to-many relationship between two entities.\n\nThe type => Post statement\
    \ is a function that returns the associated entity's class. Because of language\
