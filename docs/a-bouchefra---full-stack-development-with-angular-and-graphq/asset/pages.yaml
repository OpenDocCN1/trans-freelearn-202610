- pgno: 235
  md: "To avoid memory leaks, we'll use the subject to notify the takeUntil() operator\
    \ when the component is destroyed so that it can complete the source Observable\
    \ it's applied to. Read the official documentation at https://rxjs.dev/api/operators/takeUntil.\n\
    \n4. Update the component's ngOnInit() method, as follows:\n\n```\nngOnInit():\
    \ void {\n  this.authService.authState\n  .pipe(takeUntil(this.destroyNotifier$))\n\
    \  .subscribe({\n    next: (authState: AuthState) => {\n      this.isLoggedIn\
    \ = authState.isLoggedIn;\n      this.authUser = authState.currentUser;\n    }\n\
    \  });\n}\n```\n\nWe subscribe to the Observable returned by the authState property\
    \ and provide an observer object with a next() handler that is called whenever\
    \ the Observable emits a value (which, in our case, is the auth state stored in\
    \ the reactive variable).\n\nTo avoid memory leaks, we also use the takeUntil()\
    \ operator to complete the Observable when the component is destroyed.\n\nThen,\
    \ add the ngOnDestroy() method, as follows:\n\n```\nngOnDestroy(): void {\n  this.destroyNotifier$.next(true);\n\
    \  this.destroyNotifier$.complete();\n}\n```\n\nWhen the component is destroyed,\
    \ we notify the takeUntil() operator by invoking the subject's next() method,\
    \ which emits a true value, and we also complete the notifier subject."
  merge: -1
  img_proc: true
