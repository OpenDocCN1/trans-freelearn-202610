  md: '# 2

    Setting Up GraphQL with Node.js, Express.js, and Apollo


    In the previous chapter, we prepared our development machine by installing **Node.js**
    and **MySQL**. We can now start building our backend application to provide the
    API that will be consumed by our **Angular** application.


    For the sake of time, we''ll try to build a simple social network application
    with a minimal set of features (a **Minimum Viable Product** or **MVP**) that
    will be implemented throughout the book.


    First, users will be presented with a login and signup interface. In this interface,
    users are required to provide their email and password to log in or create an
    account if they are not already registered. In this case, they need to enter their
    full name, username, email, password, and password confirmation.


    After they log in, they will be taken to an interface where they can create posts
    and see their feed, which will display the posts that have been added by the users
