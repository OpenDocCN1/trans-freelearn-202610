    ,\n    \"outDir\": \"./dist\",\n    \"esModuleInterop\": true,\n    \"strict\"\
    : true\n  }\n}\n```\n\nNow, if we run our npm run build command again, we'll get\
    \ the output in the dist/ folder without the src/ subfolder.\n\nThis is the compiled\
    \ code:\n\n```\n\"use strict\";\nvar __importDefault =\n(this && this.__importDefault)\
    \ || function (mod) {\n    return (mod && mod.__esModule) ? mod : { \"default\"\
    : mod };\n};\nObject.defineProperty(exports, \"__esModule\", { value: true });\n\
    const express_1 = __importDefault(require(\"express\"));\nconst PORT = 8080;\n\
    const app = express_1.default();\napp.get('/', (req, res) =>\n    res.send('Express\
    \ is successfully running!'));\napp.listen(PORT, () => {\n    console.log('Server\
    \ is running at\n        http://localhost:${PORT}');\n});\n```\n\nWe can test\
