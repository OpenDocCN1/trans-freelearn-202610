  md: 'This should start the Express server and output **Server is running at http://
    localhost:8080** in the Terminal. If you visit that address on your browser, it
    will display a message stating **Express is successfully running!**.


    From now on, we''ll be working with the `ts-node-dev` utility (using the previous
    `npm start` command). This will allow us to continuously watch our TypeScript
    source code, which resides inside the `src/` folder of our server project and
    invokes the `ts-node` utility, to run it and re-run it after each change we make.


    So far, we have initialized our server project, installed Express.js and TypeScript,
    and created a basic server running on the 8080 port of our localhost machine.
    In the next section, we''ll learn how to configure Apollo Server to expose a GraphQL
    API.


    # Creating a GraphQL API


    In this section, we''ll learn how to create our GraphQL API using Apollo Server,
    an open source GraphQL server maintained by the community. First, we''ll create
    a server with a simple schema. Then, we will add the types and resolvers to enable
    us to query and mutate posts, comments, and likes that are made by each user;
    we will use fake data first, before adding a real database.


    # Installing the necessary libraries


    Let''s start by installing the necessary libraries. Head back to your Terminal
    and run the following commands from the root of the `server/` folder:


    ```

    npm install graphql apollo-server-express @graphql-tools/utils @graphql-tools/schema

    npm install --save-dev @types/graphql graphql-tag

    ```


    The `graphql-tag` library exports a JavaScript template literal tag that converts
    GraphQL query strings to a **GraphQL Abstract Syntax Tree**.


    The previous commands will install `graphql v15.6.0`, `apollo-server-express v3.3.0`,
    `@graphql-tools/schema v 8.2.0`, and `@graphql-tools/utils v8.2.3` as dependencies,
    plus `graphql-tag v2.12.5` and `@types/graphql v14.5.0` as development dependencies.


    Next, let''s learn how to proceed by creating our GraphQL server and schema. First,
    we''ll expose a server with a simple API before adding the API for our social
    network application.'
