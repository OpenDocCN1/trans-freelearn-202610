    \ file and update the createPost() method, as follows:\n\n```\ncreatePost(text:\
    \ string | null, image: string | null) {\n  return this.createPostGQL\n    .mutate({\n\
    \      text: text,\n      image: image\n    }, { refetchQueries: ['getUser'] })\n\
    \    .pipe(map(result => result.data!.post));\n}\n```\n\nHere, we re-fetch the\
    \ active getUser query, which will cause the related Observable to re-emit the\
    \ updated profile's user object (the postsCount property has been incremented).\
    \ This will also cause the getPostsByUserId Observable to re-emit the posts data\
    \ since they are both chained by the switchMerge() operator.\n\n# Using field\
    \ policies to rewrite dates\n\nNext, let's display the dates of both the post\
    \ and comments in a human-readable format. We will do this in the time ago format,\
    \ which is commonly used in social network apps:\n\n+   1. Install the following\
    \ package in your client's project:\n+   2. Open the src/app/cache.ts file and\
    \ import the library:\n+   3. Add two field policies for the Post.createdAt and\
    \ Comment.createdAt fields. Let's start with the Post type:\n\n```\nnpm install\
    \ timeago.js\n```\n\n```\nimport * as timeago from 'timeago.js';\n```\n\n```\n\
    Post: {\n  fields: {\n    createdAt: {\n      read(createdAt) {\n        return\
    \ timeago.format(createdAt)\n      }\n    }\n  }\n}\n```"
  merge: -1
