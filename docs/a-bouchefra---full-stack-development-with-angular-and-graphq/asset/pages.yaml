    \ resolvers. One issue that arises is that the entries that should be linked in\
    \ a real-world scenario are not linked in our mocked API – let’s learn how to\
    \ change that!\n\n# Linking the mocked data\n\nPosts should belong to users, so\
    \ they should be linked to users via the user field. However, the randomly generated\
    \ value of the field is not guaranteed to be one of the values that’s generated\
    \ for the users’ identifiers. We can solve this easily by defining two arrays\
    \ before the mocked object in the src/index.ts file, as follows:\n\n```\nlet postsIds:\
    \ string[] = [];\nlet usersIds: string[] = [];\n```\n\nThese arrays will allow\
    \ us to keep track of the generated identifiers for users and posts to ensure\
    \ that the user and post fields of the Post, Comment, and Like types receive one\
    \ of these values. This way, our generated data will be more realistic and similar\
    \ to a real-world example.\n\nNext, change the generator for the id field on the\
    \ mock User object to the following function:\n\n```\nid: () => {let uuid = casual.uuid;\
    \ usersIds.push(uuid);\n        return uuid},\n```\n\nThis makes sure that the\
    \ generated ID is added to the usersIds array.\n\nNext, you need to change the\
    \ id field of the mocked Post type to the following function:\n\n```\nid: () =>\
    \ {let uuid = casual.uuid; postsIds.push(uuid);\n        return uuid},\n```\n\n\
    Similarly, this makes sure that the generated post ID is added to the postsIds\
    \ array.\n\nNext, add an author field to the mocked Post object, as follows:\n\
    \n```\nauthor: casual.random_element(usersIds),\n```\n\nNext, change the author\
    \ field of the mocked Comment object, as follows:\n\n```\nauthor: casual.random_element(usersIds),\n\
    ```"
