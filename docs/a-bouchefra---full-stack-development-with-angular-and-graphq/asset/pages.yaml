    \ our comment immediately. We can implement this feature using a custom Angular\
    \ directive, as follows:\n\n1. Head over to your Terminal and run the following\
    \ command:\n\n```\nng g directive shared/directives/autofocus\n```\n\nThis directive\
    \ is automatically imported into the shared module by the CLI. You don't need\
    \ to re-export it like you have to with the post and comment components since\
    \ it will only be used inside the component(s) of the shared module.\n\n2. Open\
    \ the shared/directives/autofocus.directive.ts file and update it, as follows:\n\
    \n```\nimport { Directive, AfterViewInit } from\n'@angular/core';\nimport { MatInput\
    \ } from '@angular/material/input';\n\n@Directive({\n  selector: '[appAutofocus]'\n\
    })\nexport class AutofocusDirective implements\n  AfterViewInit {\n\n    constructor(private\
    \ matInput: MatInput) { }\n    ngAfterViewInit() {\n      this.matInput.focus();\n\
    \    }\n  }\n```\n\nHere, we imported the AfterViewInit interface and the MatInput\
    \ directive before implementing the life cycle interface and injecting the directive.\n\
    \nFinally, we called the focus() method of the MatInput instance inside the ngAfterViewInit()\
    \ method, which gets called once the view has been initialized."
