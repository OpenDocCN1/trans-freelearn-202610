    # Technical requirements


    To complete this chapter, you must have Node.js and npm installed on your local
    development machine. Please refer to *Chapter 1, App Architecture and Development
    Environment*, to learn how to install them if you haven''t done so already.


    You also need to have completed the steps and assignments that were mentioned
