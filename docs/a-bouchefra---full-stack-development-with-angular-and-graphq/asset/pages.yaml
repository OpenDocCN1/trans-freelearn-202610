    \ file and add the following type:\n+   3. Open the src/graphql/resolvers.ts file\
    \ and add the following code:\n\n```\ncd src && mkdir graphql\ncd graphql && touch\
    \ schema.ts && touch schema.graphql && touch resolvers.ts\n```\n\n```\ntype Query\
