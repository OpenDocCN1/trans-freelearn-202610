- pgno: 13
  md: '# Preface


    Angular is one of the most popular JavaScript frameworks in modern web app development,
    allowing developers to not only build apps and reuse the code, but also develop
    apps for any deployment target. For web, mobile web, native mobile, and native
    desktop, GraphQL is the modern and REST alternative for querying web APIs. Using
    Angular, TypeScript, and GraphQL will give you a future-proof and scalable stack
    that you can start building apps around.


    This book shows you how to build apps using cutting-edge technologies. You''ll
    learn how to solve common web development problems with GraphQL and Apollo, such
    as database access, authentication, and image uploads.


    The book starts by introducing you to building full stack apps with Angular and
    GraphQL. After that, you''ll learn how to create a monorepo project with Lerna
    and NPM workspaces and configure a Node.js app to use GraphQL with Express and
    Apollo Server. You''ll also understand the basics of Angular architecture and
    routing. Then, the book demonstrates how to build a professionally looking UI
    with Angular Material and use Apollo Client to interface with the server to get
    data from the built-in GraphQL API.


    You''ll learn about Apollo Client''s type and field policies, and various fetching
    policies. In addition to this, you''ll learn about local state management and
    reactive variables with Apollo Client and how to generate TypeScript types and
    even Angular Apollo services for your GraphQL schema and queries using GraphQL
    Code Generator to implement a scalable code base.


    By the end of this book, you''ll have the skills you need to be able to build
    your own full stack application.


    # Who this book is for


    This Angular GraphQL book is for Angular developers who want to learn how to use
    GraphQL and Apollo with Angular to build full stack applications. This book does
    not assume prior knowledge of full stack development with Angular and GraphQL.'
  merge: -1
  img_proc: true
- pgno: 14
  md: '# What this book covers


    *Chapter 1, App Architecture and Development Environment,* teaches you about the
    project''s structure and the tools required to develop the application. After
    that, you''ll have your machine ready for development. Specifically, you''ll install
    Node.js alongside npm and MySQL.


    *Chapter 2, Setting Up GraphQL with Node.js, Express.js, and Apollo,* assists
    you with building your backend application to provide the API that will be consumed
    by your Angular application.


    *Chapter 3, Connecting the Database with TypeORM,* teaches you how to connect
    a MySQL database to your application using TypeORM, as well as how to create resolvers
    to get and save data from the database.


    *Chapter 4, Implementing Authentication and Image Uploads with Apollo Server,*
    helps you understand how to add authentication and image uploads with Apollo Server
    to your GraphQL API, implementing more resolvers. You''ll learn about the necessary
    concepts for adding authentication with Node.js, Express, and Apollo Server and
    then how to handle image uploads.


    *Chapter 5, Adding Realtime Support with Apollo Server,* helps you to add realtime
    support to your server application, which will allow you to communicate fresh
    data from the server to the client as soon as it becomes available. To do this,
    you''ll use Apollo Server''s GraphQL subscriptions.


    *Chapter 6, Angular Application Architecture and Routing,* gets you started by
    installing the Angular CLI and creating a new project using a recent version of
    Angular. Following that, you''ll utilize the Angular CLI to create the modules,
    services, and components that make up your application''s UI, as well as being
    introduced to dependency injection.


    *Chapter 7, Adding User Search Functionality,* specifically looks at how to integrate
    the frontend with the backend using Apollo Client, which is designed for sending
    GraphQL queries and mutations to the server to fetch and write data. Then, you''ll
    begin implementing authentication.


    *Chapter 8, Guarding Routes and Testing Authentication,* continues with implementing
    our authentication system by guarding the necessary route(s) from unauthorized
    access, sending the JWT with API requests, and unit testing our code.


    *Chapter 9, Uploading Images and Adding Posts,* implements the profile component''s
    functionality. You''ll add the necessary code to fetch the user that corresponds
    to a profile URL and render their information on the page, including the ability
    to upload the user''s photo and cover image as well as add a biography.'
  merge: -1
  img_proc: true
- pgno: 15
  md: 'Chapter 10, Fetching Posts and Adding Comments and Likes, begins by dealing
    with an authentication token expiration issue, and then you''ll continue working
    on your profile component by sending queries to receive paginated posts and comments
    data and mutations to add comments and likes to posts.


    Chapter 11, Implementing GraphQL Subscriptions, continues with building your users''
    profile component before learning how to add realtime support to your application
    so that you can retrieve and display new data from the server without having to
    constantly refresh the app. You''ll utilize GraphQL subscriptions with Apollo
    Client and Angular to do this.


