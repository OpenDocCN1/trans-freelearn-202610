- pgno: 150
  md: '# Understanding the application architecture


    Throughout this book, we''ll be developing a full stack web application with the
    functionality of a small social network. We already discussed the architecture
    of the backend application, which utilizes Node.js, Apollo Server, and GraphQL.
    Now, we''re going to create the frontend of our application using Angular and
    Apollo Client to consume the server''s GraphQL API.


    Angular is a Google-developed platform for creating client-side web apps for mobile
    and desktop using TypeScript. We''ll use it to consume the server''s GraphQL API
    and build the application''s user interface. Additionally, we''ll utilize Angular
    Material to style the UI.


    TypeScript is a Microsoft-created superset of JavaScript that adds static typing,
    improved error checking, type safety, and object-oriented programming principles
    to the language before it is compiled to JavaScript and processed in web browsers.
    Additionally, it integrates more tightly with code editors and integrated development
    environments (IDEs), which enhances the developer experience, particularly when
    developing big JavaScript applications that must scale.


    In comparison to other popular JavaScript libraries, such as React, Angular is
    a framework that includes built-in libraries for common development tasks, such
    as the following:


    +   - **HttpClient** to communicate with servers using HTTP

    +   - **Angular Universal** to render your Angular application on the server

    +   - **Angular Material** to provide material components for styling the user
    interface

    +   - **Angular forms** to create, validate, and manipulate forms


    Angular supports both modular and component-based architectures, which enable
    you to build your application using modules and components.


    When developing an Angular application, you may break it down into modules and
    components that can be reused across the application and, with care, across numerous
    applications.


    While the Angular APIs are contained within built-in modules, you can also develop
    custom modules to structure and organize your application. A module can include
    components, services, and any other Angular artifacts. Let''s take a closer look
    at modules and components.'
  merge: -1
  img_proc: true
- pgno: 151
  md: '# What''s a module?


    A module is nothing more than a container for Angular code that implements a certain
    domain function. They allow you to break up your application into smaller, more
    manageable pieces.


    In order to avoid having to write all of the code from scratch for every new project,
    the code units may be combined into libraries that can be used by other developers.


    An Angular module can include components, directives, pipes, and services, and
    can be lazy-loaded by the router to improve application speed.


    You may either design your own custom modules to implement a requirement or feature
    in your app, or you can utilize the built-in modules that expose the Angular APIs,
    such as the ones listed here:


    +   - `FormsModule` for creating and validating forms.

    +   - `HttpClientModule` for making HTTP requests.

    +   - `RouterModule` for supplying your Angular application with a router as well
    as a variety of helpful APIs and components.

    +   - `CommonModule` for supplying all of the basic Angular directives and pipes,
    such as `NgIf` and `NgForOf`.


    **NgModules** may be used to define Angular modules. `NgModule` is a TypeScript
    class annotated with the `@NgModule` decorator that accepts certain metadata and
    performs the following functions:


    +   - Declares other module artifacts, such as components, directives, and pipes

    +   - Exports some components, directives, or pipes so that other modules can
    import and use them

    +   - Imports other modules with their components, directives, and pipes

    +   - Provides services that the other components can use


    By convention, an Angular application comprises at least one module, which is
    referred to as the root module. This is the module that is used to get the application
    up and running.


    In our Angular CLI-generated project, we already have two modules included in
    the `src/app/app.module.ts` and `src/app/app-routing.module.ts` files, which export
    the classes used to define the root application module and the routing module.


    A module may be made up of one or more components. So, what exactly is a component?'
  merge: -1
  img_proc: true
- pgno: 152
  md: '# What''s a component?


    An **Angular component** is in charge of displaying an area of the application''s
    user interface. A component, for example, may be used to make your application''s
    home page, and if you want to gain further code reusability, you can further break
    the home page into smaller components, such as the navigation bar, main, and footer
    areas.


    This allows you to incorporate the navigation and footer components on other pages
    of your application without having to rewrite the same code for the elements that
    are shared by all, or just some, parts of your application.


    In terms of code, a component is just a TypeScript class that has been decorated
    with the `@Component` decorator exported from the Angular core module. It also
    includes an HTML template, which may be inline or saved as a separate HTML file
    and uses specific Angular template syntax to show data and bind properties and
    events from the component''s class.


    Finally, a component may have one or more associated style sheet files that include
    styles for the view in the format you''ve selected for your project, such as CSS,
    SCSS, or Sass.


    Angular 9 arrives with a new rendering engine called Ivy, which is considered
    a next-generation compilation and rendering system, consisting of a compiler and
    a set of runtime instructions.


    Ivy yields smaller production bundles, faster build times and runtime performance,
    and easier debugging. It makes use of **incremental DOM** where Angular components
    and templates are compiled into a group of JavaScript instructions that are used
    to create and update the **Document Object Model (DOM)**.


    Let''s get back to our application for a moment. In the `src/app` folder, you''ll
    find a number of files that include the TypeScript code, HTML template, and CSS
    style sheet for the app component:


    +   - The `app.component.css` file that provides the CSS styles for the component

    +   - The `app.component.html` file that provides the HTML code for rendering
    the component

    +   - The `app.component.ts` file that provides the TypeScript code for defining
    the component data and functionality


    When the app is launched, the root component is first loaded. This is accomplished
    by the inclusion of the component in the application module''s `bootstrap` array.'
  merge: -1
  img_proc: true
- pgno: 153
  md: "Simply open the src/app/app.module.ts file containing the application module\
    \ to see this:\n\n```\n// [...]\nimport { AppComponent } from './app.component';\n\
    \n@NgModule({\n  // [...]\n  bootstrap: [AppComponent]\n})\nexport class AppModule\
    \ { }\n```\n\nThe root component is also included in the src/index.html file,\
    \ which is the file that gets downloaded when users visit your Angular application\
    \ from a web browser:\n\n```\n<!doctype html>\n<html lang=\"en\">\n<head>\n  <!--\
    \ [...] -->\n</head>\n<body>\n  <app-root></app-root>\n</body>\n</html>\n```\n\
    \nThrough its selector, you can see that the root component is being utilized\
    \ exactly like a standard HTML tag. This instructs Angular to load the component\
    \ and all of its descendant components into the DOM.\n\nOpen the app.component.ts\
    \ file in the src/app directory. The root component should be defined using the\
    \ following code:\n\n```\nimport { Component } from '@angular/core';\n\n@Component({\n\
    \  selector: 'app-root',\n  templateUrl: './app.component.html',\n  styleUrls:\
    \ ['./app.component.css']\n})\nexport class AppComponent {\n```"
