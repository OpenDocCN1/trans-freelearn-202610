  md: "5. Use the following code to implement the life cycle's ngOnInit() method:\n\
    \n```\n```ts\nngOnInit(): void {\n    this.authService\n        .authUser\n  \
    \      .pipe(\n            takeUntil(this.componentDestroyed)\n        )\n   \
    \     .subscribe({\n            next: (authUser) => {\n                this.authUser\
    \ = authUser;\n            }\n        });\n}\n```\n```\n\nWe also assign the authenticated\
    \ user to the component's authUser property so that we can access it without referencing\
    \ the authentication service in our component and its children.\n\n6. Use the\
    \ following code to implement the ngOnDestroy() life cycle method:\n\n```\n```ts\n\
    ngOnDestroy(): void {\n    this.componentDestroyed.next();\n    this.componentDestroyed.complete();\n\
    }\n```\n```\n\nIf the component is destroyed, we emit a value from the componentDestroyed\
    \ subject and complete the subject. This will serve as a notifier for the takeUntil()\
    \ operator, which will be applied to the methods we'll implement in the following\
    \ steps to unsubscribe from the returned observables. When our subject emits a\
    \ value, the takeUntil() operator unsubscribes from the source observable to which\
    \ we are subscribed.\n\n7. To handle errors, add the protected handleErrors()\
