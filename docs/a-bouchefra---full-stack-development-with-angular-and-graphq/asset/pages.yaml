- pgno: 86
  md: '# Using Apollo with TypeORM


    After we''ve created the entities and inserted some test data, we''ll look at
    how to integrate Apollo with TypeORM. In this section, we''ll define our GraphQL
    resolvers, which are functions that will be called when we send queries and mutations
    to our GraphQL endpoint:


    +   1. First, you need to change back the user and author fields on the Post,
    Comment, and Like types of our GraphQL schema, in the src/graphql/schema.graphql
    file, to the type of User instead of ID:

    +   2. Additionally, change the type of the post field from ID to Post in the
    Comment and Like types:


    ```

    author: User!

    user: User!

    ```


    ```

    post: Post!

    ```


    Before implementing our schema resolvers, we need to create the types for ensuring
    the type safety of our resolvers'' code. Fortunately, we don''t have to do this
    manually. Instead, we can use GraphQL Code Generator, which is a tool for generating
    code from your GraphQL schema and operations with a simple CLI. For additional
    information about this tool, please refer to https://www.graphql-code-generator.com/.


    Since those types are generated code, we''ll place them in their own package and
    then import them from our resolvers.


    Following that, we''ll look at how to use Lerna to create a package and configure
    it to be able to import the generated types:


    +   1. If your server is still running, stop it and execute the following commands
    to create a graphql-types package:


    ```

    cd ../../

    lerna create graphql-types

    ```


    Note that you''ll be asked some questions regarding your package. Accept the default
    values and press Enter.


    A new graphql-types package will be created in ./packages/graphql-types.'
  merge: -1
  img_proc: true
- pgno: 87
  md: "Now that we have multiple packages, which are folders with a package.json file,\
    \ in our project, let's use npm workspaces, which are supported by npm v7+, to\
    \ efficiently manage dependencies across all of our monorepo project's packages.\n\
    \n+   2. Simply add the workspaces key to the ngsocial/package.json root file\
    \ to inform npm where our packages exist:\n\n```\n{\n  \"name\": \"@ngsocial/ngsocial\"\
    ,\n  \"private\": true,\n  \"devDependencies\": {\n    \"lerna\": \"^4.0.0\"\n\
    \  },\n  \"version\": \"0.0.1\",\n  \"workspaces\": [\"./packages/*\"]\n}\n```\n\
    \nObserve that we also changed the name of the root package to @ngsocial/ngsocial\
    \ to create a scoped package. For more information, please refer to https://docs.npmjs.com/cli/v7/using-npm/scope.\n\
    \nLerna and npm can now both find packages in the ./packages folder. If many packages\
    \ require the same dependency, thanks to npm workspaces, it may be installed once\
    \ in the root and imported from the other packages without trouble.\n\nContinuing\
    \ with our steps:\n\n+   1. Install GraphQL Codegen and the required plugins in\
    \ the root of our monorepo project, as shown here:\n\n```\nnpm install @graphql-codegen/cli\
    \ @graphql-codegen/typescript @graphql-codegen/typescript-resolvers\n```\n\nIt\
    \ is worth noting that we may install these dependencies within the graphql-types\
    \ package as well; however, the official documentation advises installing Codegen\
    \ within the root. For further details, please see https://www.graphql-code-generator.com/docs/getting-started/development-workflow."
  merge: -1
  img_proc: true
- pgno: 88
  md: "2. Create an ngsocial/codegen.yml file and add the following contents:\n\n\
    ```\nschema: './packages/server/src/graphql/schema.graphql'\ngenerates:\n  ./packages/graphql-types/src/resolvers-types.ts:\n\
    \    plugins:\n      - typescript\n      - typescript-resolvers\n```\n\n3. Open\
    \ the ngsocial/package.json file and add the following script:\n\n```\n\"scripts\"\
    : {\n  \"codegen\": \"npx graphql-codegen --watch\"\n},\n```\n\nThis script will\
    \ launch GraphQL Codegen in watching mode.\n\nThen, use the following command\
    \ to start it:\n\n```\nnpm run codegen\n```\n\nThis will create a graphql-types/src/resolvers-types.ts\
    \ file with all of the required types for our schema resolvers.\n\nBecause this\
    \ is a TypeScript file contained within another package, we must be able to import\
    \ it into our server's code, which is contained within a different package. To\
    \ do this, we may use a tsconfig.json file with the appropriate settings and an\
    \ index.ts file.\n\n4. Create a packages/graphql-types/tsconfig.json file and\
    \ add the following contents:\n\n```\n{\n  \"compilerOptions\": {\n    \"outDir\"\
    : \"lib\",\n    \"rootDir\": \"src\",\n    \"baseUrl\": \"./\",\n    \"composite\"\
    : true\n  },\n  \"include\": [\"src/**/**\"],\n  \"exclude\": [\"node_modules\"\
    , \"**/__tests__/**\"]\n}\n```"
  merge: -1
  img_proc: true
- pgno: 89
  md: "The \"composite\": true option is required to be able to reference this package\
    \ from the other packages.\n\nNext, create a packages/graphql-types/src/index.ts\
    \ file and add the following code:\n\n```\nexport * from './resolvers-types';\n\
    ```\n\nThis ensures that we export all of the symbols that we need.\n\nNext, you\
    \ need to open the graphql-types/package.json file and change name to @ngsocial/graphql\
    \ to create a scoped package.\n\n+   5. Finally, you need to open the server/tsconfig.json\
    \ file and update it, as follows:\n\n```\n{\n  \"compilerOptions\": {\n    [...]\
    \ \n    \"paths\": {\n      \"@ngsocial/graphql\": [\"../graphql-types/src\"]\n\
    \    }\n  },\n  \"references\": [{ \"path\": \"../graphql-types\" }]\n}\n```\n\
    \nYou need to ensure that the pathname specified in the paths object matches the\
    \ name in the graphql-types/package.json file, which, in our case, is @ngsocial/graphql.\n\
    \nThat's all! We can now import our generated GraphQL types by writing the following:\n\
    \n```\nimport { Resolvers, User, QueryGetUserArgs } from '@ngsocial/graphql';\n\
    ```\n\nTo ensure consistent naming throughout our project's packages, edit the\
    \ server/package.json file and change the name to @ngsocial/server.\n\nYou can\
    \ see the updates of these steps on GitHub at https://git.io/Jzd77."
