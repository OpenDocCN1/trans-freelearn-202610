    We add two custom input properties for receiving the authenticated user and loading
    state, via the parent component, as well as a custom event that will be fired
    when users click the button to create a post.


    Using input properties and events, we ensure parent-child communication between
    components. For more information, see https://angular.io/guide/inputs-outputs#sending-data-to-a-child-component.


    We decorate the class properties with the @Input decorator to create input properties,
    and we can create a custom event by creating an instance of EventEmitter and exposing
    it as a property decorated with @Output that parent components can bind to, to
