    \       this.authUser = authState.currentUser;\n            this.changeDetectorRef.markForCheck();\n\
    \        }\n    });\n}\n```\n\nUse the OnPush detection strategy for the footer\
    \ and page-not-found components as an assignment. The updates and solutions can\
    \ be found at this commit: https://git.io/JV9zb.\n\n# Testing the auth service\
    \ and component(s)\n\nBefore we finish implementing the auth section, we need\
    \ to add automatic tests to our implementation to detect any hidden errors that\
    \ we might miss when manually testing.\n\nWhen we generate our project with the\
    \ Angular command-line interface (Angular CLI), we also have testing configured\
    \ with a number of initial tests that are added to ensure that artifacts, such\
    \ as components and services, are properly instantiated.\n\nIf you're new to Angular\
    \ testing, start by reading https://angular.io/guide/testing and https://techiediaries.com/angular/jasmine-unit-testing,\
    \ then learn how to write your first test suite at https://jasmine.github.io/tutorials/your_first_suite.\n\
    \nAlso, before testing Apollo Client APIs, make sure to read the official testing\
    \ documentation at https://apollo-angular.com/docs/development-and-testing/testing/.\n\
    \nJasmine includes a set of APIs that make it simple to write unit tests. We basically\
    \ have three options, as follows:\n\n+   - The describe() function is used to\
    \ define a set of tests.\n+   - The it() function is used to initialize a unit\
    \ test/specification."
