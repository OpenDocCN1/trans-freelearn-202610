- pgno: 147
  md: 'The official utility for creating Angular projects is the Angular CLI. It simplifies
    the process of creating fully functional Angular projects.


    The Angular CLI allows you to do more than just create project files and install
    dependencies. It also helps you throughout the development process, from serving
    your application locally through testing and generating final production bundles
    and deploying them to your chosen hosting provider.


    Now, let''s begin with the chapter''s first practical step. By opening a new command-line
    interface and entering the following command, you can install the Angular CLI
    from npm:


    ```

    npm install -g @angular/cli

    ```


    At the time this chapter was written, angular/cli version 12 is installed on our
    development machine.


    > **Important Note**

    > In order to globally install packages on your machine, you may need to include
    `sudo` before your command in your Ubuntu system. Check out https://www.shabang.dev/multiple-versions-node-nvm.


    # Angular CLI commands


    The Angular CLI includes a plethora of commands to aid you in the development
    of your project. Simply running the `ng` executable in a command-line interface
    will display the available commands along with their explanations. The following
    are some of the most frequently used commands:


    +   - The `ng new` command is used to create an application.

    +   - The `ng generate` command is used to create Angular constructs like modules,
    components, and services.

    +   - The `ng serve` command is used for starting a live-reload server during
    the development of your project.

