  md: "# Implementing the create post component\n\nIn this section, we'll implement\
    \ the create post component, which will be used to create posts from the profile\
    \ page (and also from the home feed). We'll put the logic for creating posts in\
    \ its own reusable component because it will be required on multiple pages.\n\n\
    This component is known as a **presentational** or **dumb** component. It receives\
    \ input and emits custom output events to the parent component. This type of component\
    \ has no idea how to fetch data (no injected services), so its only responsibility\
    \ is to receive data, render it, and emit some events for the parent component(s)\
    \ to handle. These parent components in our case are the profile and feed's posts\
    \ components, which are referred to as the **container** or **smart** components.\n\
    \nWhen this component's post event fires, the onPost() method of the base component\
    \ that we defined earlier will be called. This custom event will be triggered\
    \ when the user clicks on a button for creating posts, which we will implement\
    \ in the following steps:\n\n+   1. Begin by generating a component by running\
    \ the following command from your client/ folder:\n+   2. Export the create-post\
    \ component from the shared/shared.module.ts file as follows:\n+   3. Start by\
    \ adding the following imports to the create-post.component.ts file in the core/components/create-post/\
    \ folder:\n\n```\nng g c core/components/create-post --module=shared\n```\n\n\
    ```\n@NgModule({\n  declarations: [CreatePostComponent],\n  imports: [\n    CommonModule,\
    \ ReactiveFormsModule, ...matModules\n  ],\n  exports: [ReactiveFormsModule, ...matModules,\n\
    \    CreatePostComponent]\n})\n```\n\n```\nimport {\n  Component,\n  ElementRef,\n\
    \  EventEmitter,\n  Input,\n}\n```"
  merge: -1
  img_proc: true
