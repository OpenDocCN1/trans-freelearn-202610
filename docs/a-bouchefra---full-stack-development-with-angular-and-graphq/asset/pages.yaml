    We''ll also learn how to configure **cross-origin resource sharing (CORS)** and
    learn how to test our GraphQL server with Apollo Studio.


    In this chapter, we will cover the following topics:


    +   - Initializing our project

    +   - Installing Express.js and adding TypeScript support

    +   - Setting up Apollo Server with Node.js

    +   - Mocking our GraphQL API with Apollo Server

    +   - Testing the GraphQL server using Apollo Studio

    +   - Configuring CORS in Express.js


    # Technical requirements


    To complete this chapter, you are required to have Node.js and npm installed on
    your local development machine. Please refer to *Chapter 1, App Architecture and
    Development Environment*, for instructions on how to install them if you haven''t
    done so yet.


    You also need to be familiar with the following technologies:


    +   - JavaScript/TypeScript

    +   - Git, Node.js, and Express

    +   - GraphQL concepts such as schemas and types


    If you need a refresher of GraphQL concepts, check out https://graphql.org/learn/.
    This is the official documentation for GraphQL schemas and it explains various
    features of the schema and how to use them with the schema language.'
