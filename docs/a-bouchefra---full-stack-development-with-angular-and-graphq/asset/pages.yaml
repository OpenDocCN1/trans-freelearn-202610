- pgno: 239
  md: '+   - The `expect()` function is used to define expectations to ensure that
    our code works as expected.


    When we generate an artifact, such as a component or service, with the Angular
    CLI, we also get a specification file that includes tests for the artifact, as
    well as a unit test that checks whether the artifact is instantiated.


    # Testing the auth service


    Your project is ready for testing. All you have to do is follow the upcoming steps
    in this section.


    Go to your Terminal and type the following command:


    ```

    ng test

    ```


    The ng test command builds the application and runs the Karma test runner in watch
    mode. Visit https://github.com/karma-runner/karma for more information. This command
    will run our tests and open a web browser with either passed or failed tests.
    At this point, we would expect all tests to pass, but this is not the case. This
    is due to the fact that the tests, not the code, are broken.


    This is because we modified the default project''s code generated by the Angular
    CLI by injecting some services via the constructor or adding code to the components''
    ngOnInit() method. Because they are involved in the creation of components, the
    constructor and ngOnInit() methods are both called in the existing unit tests.


    Let''s start by testing the auth service before we fix the broken tests. If you
    are unfamiliar with testing services, read https://angular.io/guide/testing-services
    to better understand these steps.


    Most of our service''s methods follow a similar pattern—we request data, handle
    errors, and extract data from the response, so they should be tested in much the
    same way.


    We must mock/fake the response and then assert that queries and mutations are
    called once or multiple times with the expected documents and variables, and that
    the mocked response data is returned. Proceed as follows:


    +   1. Return to your Terminal and run the tests for the auth service only, using
    the following command from the client/ folder:


    ```

    ng test --include src/app/core/services/auth/auth.service.spec.ts

    ```'
