  md: "# Introducing and installing Apollo Client\n\nIn this section, we'll introduce\
    \ you to Apollo Client, which helps you integrate your Angular frontend with your\
    \ GraphQL API built on top of Apollo Server. Then, we'll see how to install and\
    \ configure Apollo Client in our Angular project.\n\nApollo Client is a JavaScript\
    \ state management library that allows developers to manage local and remote data\
    \ using GraphQL. It can be used to retrieve, cache, and update application data\
    \ while also automatically synchronizing data changes with your UI.\n\nLet's install\
    \ Apollo Client in our Angular project:\n\n+   1. Return to your Terminal and\
    \ execute the following command from your Angular project's root folder:\n+  \
    \ 2. Following that, you'll be prompted to enter the URL to your GraphQL endpoint.\
    \ Type in http://localhost:8080/graphql.\n\n```\nng add apollo-angular\n```\n\n\
    The apollo-angular package will be installed and executed. You will be asked the\
    \ following question:\n\n```\nWould you like to proceed?\n```\n\nType Y and press\
    \ Enter.\n\nThis will install and configure Apollo Client. An src/app/graphql.module.ts\
    \ file is created and imported in the src/app/app.module.ts file, as follows:\n\
    \n```\n// [...] \nimport { GraphQLModule } from './graphql.module';\nimport {\
    \ HttpClientModule } from\n'@angular/common/http';\n\n@NgModule({\n  declarations:\
    \ [\n    // [...] \n  ],\n  imports: [\n    // [...] \n    GraphQLModule,\n  \
    \  HttpClientModule\n  ],\n```"
  merge: -1
  img_proc: true
- pgno: 178
  md: "```\nproviders: [],\n    bootstrap: [AppComponent]\n})\n\nexport class AppModule\
    \ { }\n```\n\nIn the GraphQL module, we use the HttpLink service from apollo-angular/http\
    \ to link the client to the GraphQL server running at http://localhost:8080/graphql.\
    \ We also use InMemoryCache from @apollo/client/core to create a memory cache\
    \ for storing local and remote data. The HttpLink service makes use of HttpClient\
    \ to communicate with the server, so we also imported HttpClientModule from @angular/common/http\
    \ in the application root module.\n\nApollo provides the Apollo Link interface,\
    \ which allows you to manage the network layer where you can plug in links to\
    \ control data flow, or simply how queries are sent, between the client and the\
    \ GraphQL server. The network behavior of your client can be described as a chain\
    \ of links that run sequentially.\n\nHttpLink is one example of these links. By\
    \ default, Apollo Client sends GraphQL operations to a remote server via HTTP\
    \ using Apollo Link's HttpLink. This default link is created automatically, which\
    \ covers our initial use cases, but later, we'll define more advanced links and\
    \ specify their execution order to extend the default networking behavior.\n\n\
    Read https://www.apollographql.com/docs/react/api/link/introduction/ for more\
    \ information about Apollo Link and see a list of custom links developed by the\
    \ community at https://www.apollographql.com/docs/react/api/link/community-links/.\n\
    \nThe in-memory cache is where Apollo Client stores the data fetched from the\
    \ GraphQL server. You can find more information at https://apollo-angular.com/docs/caching/configuration/.\n\
    \nNow that we've added Apollo Client to our application and established a connection\
    \ to our GraphQL server, we'll see how to import the Angular Material components\
    \ required for building the application's UI in the following section."
