  md: "```\n}\n}) ;\n}\n}\n```\n\nNext, we'll learn to update the cache after removing\
    \ comments.\n\n# Updating the cache after removing comments\n\nIf we want to remove\
    \ comments, we can click on the x button that exists next to the comment. At this\
    \ point, the comment gets removed, but we need to refresh the comments to verify\
    \ that it was deleted.\n\nWe want to see the result immediately. Again, we can\
    \ implement this by re-fetching the comments or manually updating the cache. Update\
    \ the removeComment() method in the core/services/comment/comments.service.ts\
    \ file by adding a second argument object with an update() method, as follows:\n\
    \n```\n{\n    update(cache) {\n        cache.modify({\n            fields: {\n\
    \                getCommentsByPostId(existingComments, { readField }) {\n    \
    \                return existingComments\n                        .filter((cc:\
    \ StoreObject) => {\n                            return id !== readField('id',\
    \ cc)\n                        });\n                }\n            }\n       \
    \ });\n    }\n}\n```\n\nWe have already imported StoreObject, which simply represents\
    \ an object in the cache. In the update() function, we add the code for updating\
    \ the cache by removing the deleted comment using the filter() method and the\
    \ readField() utility function, which is used to read the value of the cached\
    \ field. For more information, check out https://www.apollographql.com/docs/react/caching/cache-interaction/#example-removing-an-item-from-a-list."
