    +   - CSS and SCSS


    You can find the source code for this chapter at https://github.com/PacktPublishing/Full-Stack-App-Development-with-Angular-and-GraphQL/tree/main/Chapter08.


    # Persisting the component state with reactive variables


    In the previous chapter, we implemented some methods that allow us to like and
    comment on posts. However, there''s one issue with this – after commenting or
    liking the post, the post element will be initialized and properties such as `commentsShown`
    will have an initial value of `false`, which will hide the comment box (and the
    comments'' feed later) and display the latest comment.


    This is not quite the intended behavior since we don''t want the component to
    reset its internal state each time the user comments or likes a post. Instead,
    the user should be presented with the comment box and the comments'' feed (which
    will be implemented later) until they choose to hide them.


    The following screenshot shows a post once it''s been liked and commented on:'
