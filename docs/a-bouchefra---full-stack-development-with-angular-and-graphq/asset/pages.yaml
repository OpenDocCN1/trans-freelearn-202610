  md: "Define the following members in the class's body:\n\n```\n```ts\npublic authService:\
    \ AuthService;\npublic postService: PostService;\npublic posts: Post[] = [];\n\
    public authUser: Partial<User> | null = null;\npublic loading: boolean = false;\n\
    protected snackBar: MatSnackBar;\nprivate componentDestroyed = new Subject();\n\
    ```\n```\n\nWe defined the properties that will be used in the parent components,\
    \ such as the posts array, which will hold the fetched posts, the authUser object,\
    \ which will hold the authenticated user, and the loading property, which will\
    \ track the loading state of operations.\n\nWe also defined the componentDestroyed\
    \ subject, which will be used to unsubscribe from the returned observables of\
    \ various methods after the component has been destroyed.\n\nFinally, we defined\
    \ the authService, postService, and snackBar properties, which will be used to\
    \ assign dependencies with the Injector service rather than injecting them via\
    \ the constructor to simplify the child components.\n\nThe private attributes\
    \ are only accessible from within the base component, whereas the protected attributes\
    \ are accessible from both the base and child components. The public properties\
    \ are accessible from within the components and the associated templates.\n\n\
    4. Next, instead of using the constructor's arguments, let's inject the dependencies\
    \ inside the constructor:\n\n```\n```ts\nconstructor(public injector: Injector)\
    \ {\n  this.snackBar = injector.get(MatSnackBar);\n  this.authService = injector.get(AuthService);\n\
    \  this.postService = injector.get(PostService);\n}\n```\n```\n\nWe inject the\
    \ Injector service in the constructor and then use it to get the required dependencies.\
    \ This eliminates the need for the child components to re-pass all of the parent\
    \ dependencies into their constructor. For more information, check out https://devblogs.microsoft.com/premier-developer/angular-how-to-simplify-components-with-typescript-inheritance/."
