  md: "We used `BehaviorSubject` for storing the authentication state.\n\n`BehaviorSubject`\
    \ is a type of subject that is able to store a current value and emits it to all\
    \ new subscribers. It should always be initialized with an initial value. In our\
    \ case, we initialize it with an object of the `AuthState` type that we've previously\
    \ defined. It contains three properties, the `isLoggedIn` Boolean property, which\
    \ indicates whether the user is logged in or not, the `currentUser` property,\
    \ which contains the currently logged-in user, and the access token.\n\n> **Note**\n\
    > \n> RxJS Observables, subjects, and operators allow us to build a reactive UI\
    \ that reacts to changes in real time. You can read more about RxJS and reactivity\
    \ at https://www.techiediaries.com/javascript-reactive-asynchronous-code-rxjs-6-angular-10/.\n\
    \n4. Define the following properties below the service constructor to get the\
    \ logged-in state of the users and the currently logged-in user:\n\n```\n```typescript\n\
    get isLoggedIn(): boolean {\n    return this.authSubject.getValue().isLoggedIn;\n\
    }\nget authUser(): User | null {\n    return this.authSubject.getValue().currentUser;\n\
    }\n```\n```\n\nHere, we use the `getValue()` method of `BehaviorSubject` to get\
    \ the value of the `isLoggedIn` and `currentUser` attributes of the authentication\
    \ state. This method allows us to get the value stored in the behavior subject\
    \ synchronously instead of subscribing to the Observable and getting the value\
    \ asynchronously. This is possible because a behavior subject always contains\
    \ a value at any point in time.\n\n5. Define the following methods to get the\
    \ token and store the current user in the local storage of the user's browser:\n\
    \n```\n```typescript\ngetLocalToken(): string | null {\n    return localStorage.getItem(ACCESS_TOKEN);\n\
    }\nstoreUser(user: User): void {\n    localStorage.setItem(AUTH_USER,\n      \
    \  JSON.stringify(user));\n}\n```\n```"
