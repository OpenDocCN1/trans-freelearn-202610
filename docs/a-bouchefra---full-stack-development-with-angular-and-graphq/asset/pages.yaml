    import { offsetLimitPagination } from

    ''@apollo/client/utilities'';

    ```


    Next, update the cache by adding the following field policy for `Query`.

    `getPostsByUserId:`


    ```

    getPostsByUserId: offsetLimitPagination([''userId''])

    ```


    In the constructor of `InMemoryCache`, we provide the fields'' policies to customize
    how the field is read and written in the cache of Apollo Client.


    We use the `offsetLimitPagination` helper function to generate an appropriate
    field policy for the desired fields. This creates a `merge()` function for the
    field that can handle merging paginated results into the cache. This will allow
    us to use the `fetchMore` method to fetch more data.


    Since the `getPostsByUserId` field accepts the `userId` argument as well as the
    `offset` and `limit` arguments, we need to set the user ID as a key argument for
    the field to enable Apollo Client to distinguish between posts that belong to
    each user. This is done by passing an array of key arguments to the `offsetLimitPagination`
    helper. See https://www.apollographql.com/docs/react/pagination/offset-based/#setting-keyargs-with-offsetlimitpagination
    for more on this.


