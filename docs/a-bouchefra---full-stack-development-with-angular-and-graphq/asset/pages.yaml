    \ = gql'\n${USER_FIELDS_FRAGMENT}\nmutation register($fullName: String!, $username:\n\
    \    String!, $email: String!, $password: String!){\n    register(fullName:$fullName,\
    \ username:$username,\n        email:$email, password:$password){\n        token,\
    \ user { ...UserFields }\n    }\n}\n';\n```\n\nAs an assignment, update the documents\
    \ in the shared/constants/user.ts file using the UserFields and BasicUserFields\
    \ fragments.\n\n# Local state management with Apollo Client\n\nIn this section,\
    \ we'll see how to refactor our code to make use of Apollo Client's built-in local\
    \ state management features, such as local-only fields, field policies, and reactive\
    \ variables.\n\nReactive variables, introduced in Apollo Client 3, are a convenient\
    \ way to store local state outside of the Apollo Client cache. They can hold information\
    \ of any type and structure because they are independent of the cache, and you\
    \ can interact with them from anywhere in your application without using GraphQL\
    \ syntax.\n\n> **Note**\n> Read https://www.apollographql.com/docs/react/local-state/reactive-variables/\
    \ for more explanations about reactive variables.\n\nLocal-only fields are simply\
    \ those that are not defined in the schema of the GraphQL server. These values\
    \ are computed locally using whatever logic you want, such as reading data from\
    \ localStorage."
