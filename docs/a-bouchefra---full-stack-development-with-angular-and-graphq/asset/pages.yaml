  md: "# Exposing a simple GraphQL API\n\nNow that we've installed the necessary libraries,\
    \ we'll learn how to expose a simple GraphQL server with a simple schema to test\
    \ how our server works:\n\n+   1. Open the src/index.ts file and replace its contents\
    \ with the following code as you progress.\n+   \n+      Start by adding the necessary\
    \ imports:\n+   2. Next, add a type definition, as follows:\n+   3. Add the resolver:\n\
    +   4. Then, add the following configuration object:\n+   5. Finally, add the\
    \ following function:\n\n```\nimport express, { Application } from 'express';\n\
    import { ApolloServer, Config, gql }\n    from 'apollo-server-express';\nimport\
    \ { IResolvers } from '@graphql-tools/utils';\n```\n\n```\nconst typeDefs = gql'\n\
    \    type Query {\n        message: String!\n    }\n'\n```\n\n```\nconst resolvers:\
    \ IResolvers = {\n    Query: {\n        message: () => 'It works!'\n    }\n};\n\
    ```\n\n```\nconst config: Config = {\n    typeDefs: typeDefs,\n    resolvers:\
    \ resolvers\n};\n```\n\n```\nasync function startApolloServer(config: Config)\
    \ {\n    const PORT = 8080;\n    const app: Application = express();\n```"
  merge: -1
