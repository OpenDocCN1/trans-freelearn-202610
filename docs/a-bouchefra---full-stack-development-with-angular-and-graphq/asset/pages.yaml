  md: "Next, mock the Like type, as follows:\n\n```\nLike: () => ({\n  id: casual.uuid,\n\
    \  post: casual.uuid\n})\n```\n\nFor each field of each type in our schema, we\
    \ can assign either a constant value or random value using casual, which provides\
