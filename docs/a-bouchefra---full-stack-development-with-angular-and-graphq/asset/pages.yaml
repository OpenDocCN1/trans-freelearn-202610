- pgno: 230
  md: "We create a GraphQL document (using the gql tag) with a query named getAuthState\
    \ that asks Apollo Client for a field named authState. We use the @client directive\
    \ to inform Apollo Client that this is a client-side query and that it should\
    \ not attempt to send a request to the server. It will instead retrieve it from\
    \ its cache.\n\n+   5. Next, you need to use a field policy to add an authState\
    \ field to the Query type policy in the cache. Go back to the src/app/cache.ts\
    \ file and import the reactive variable, as follows:\n\n```\nimport { authState\
    \ } from './reactive';\n```\n\nThen, update the in-memory cache by adding a field\
    \ policy for authState to the Query type policy, as follows:\n\n```\nexport default\
    \ new InMemoryCache({\n  typePolicies: {\n    Query: {\n      fields: {\n    \
    \    authState: {\n          read() {\n            return authState();\n     \
    \     }\n        }\n      }\n    }\n  }\n});\n```\n\nWhen the authState field\
    \ is queried, the read() function returns the value of the authState reactive\
    \ variable. In our case, we've given the field and reactive variable the same\
    \ name, but this isn't required.\n\nTo provide the logic that controls how to\
    \ read from or write to the corresponding GraphQL field in the Apollo Client cache,\
    \ we use a field policy. Field policies can be added for either local-only fields\
    \ (with the @client directive appended) or remote fields (fetched from the server).\n\
    \n> Note\n> \n> For more information, check out https://apollo-angular.com/docs/local-state/management#field-policies-and-local-only-fields."
