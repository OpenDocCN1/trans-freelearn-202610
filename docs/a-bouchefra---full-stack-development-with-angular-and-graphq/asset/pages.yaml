- pgno: 109
  md: "5. After that, we need to implement the resolvers in the server/src/graphql/resolvers.ts\
    \ file. Start by adding the following imports:\n\n```\nimport jsonwebtoken from\
    \ 'jsonwebtoken';\nimport crypto from 'crypto';\nimport dotenv from 'dotenv';\n\
    ```\n\n6. Next, add the following line:\n\n```\ndotenv.config();\n```\n\nThis\
    \ will configure dotenv to load our environment variable(s).\n\n7. Inside the\
    \ server/ folder, create a .env file and add the following variable that will\
    \ be used to sign the tokens:\n\n```\nJWT_SECRET=azerty123456\n```\n\nWe used\
    \ azerty123456 for our JWT shared secret. However, for production, make sure to\
    \ use a strong key for signing JWTs with the HMAC algorithm to prevent any brute-force\
    \ attacks.\n\n8. Add the following method for hashing passwords in the server/src/graphql/resolvers.ts\
    \ file:\n\n```\nconst hashPassword = async (plainPassword: string):\nPromise<string>\
    \ => {\n    return new Promise((resolve, reject) => {\n        const bytes = crypto.randomBytes(16);\n\
    \        const salt = bytes.toString(\"hex\");\n        crypto.scrypt(plainPassword,\
    \ salt, 64,\n        (error, buffer) => {\n            if (error) reject(error);\n\
    \            const hashedPassword =\n                '${salt}:${buffer.toString('hex')}';\n\
    \            resolve(hashedPassword);\n        });\n    })\n};\n```\n\nWe'll use\
    \ this function to hash our passwords before saving them to the database using\
    \ Scrypt – a salted hashing algorithm."
