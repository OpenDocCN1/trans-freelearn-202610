- pgno: 323
  md: '# Implementing a presentational post component


    The post component will only be presentational. It doesn’t inject any services
    and it communicates with the parent components (containers such as the feed posts
    and profile components) with input properties and events.


    Check out https://www.webtutpro.com/smart-dumb-components-in-angular-3c51ae6efcc4
    for more information about smart (container) and dumb (presentational) components.


    The post component takes as input the post and authUser properties, which should
    be passed from the parent component(s) to enable the component to render the post
    and information about the post''s author. It also emits a bunch of custom events
    to the parent components, such as the following:


    +   - A comment event that fires when the user comments on a post

    +   - A like event that fires when the user likes a post

    +   - A remove event that fires when the user removes a post

    +   - A listComments event that fires when the user wants to display a post''s
    comments

    +   - A moreComments event that fires when the user wants to display more posts''
    comments

    +   - A listLikes event that fires when the user wants to display a post''s likes


    Let''s get started with the steps to implement our post component:


    +   1. Generate a post component using the following command:


    ```

    ng g c shared/components/post

    ```


    This component will be generated inside the post/ folder of the shared/ components
    folder.


    The component will be automatically imported into the shared module, but you also
    need to export it from the module by adding it to the exports array. This enables
    you to use the component in other modules where the shared module is imported.'
  merge: -1
  img_proc: true
