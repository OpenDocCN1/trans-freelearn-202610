- pgno: 165
  md: "These are the most commonly used features of a route, but we may also utilize\
    \ other properties, which can be found in the official documentation.\n\nConsider\
    \ the following example: we want the router to render the posts component if we\
    \ browse to the /posts URL. All we have to do is add the following route configuration\
    \ to the routes array:\n\n```\n{ path: 'posts', component: PostsComponent }\n\
    ```\n\nWe may also have special paths, such as the empty path, which refers to\
    \ the root URL of your application's domain name, or a wildcard path marked with\
    \ **, which refers to a default route that the router will match if the user navigates\
    \ to a path that does not exist in the routes array. You may use it to display\
    \ a 404 error page informing the user that the page does not exist, or you can\
    \ simply redirect the visitor to another URL.\n\nFollowing that, we'll learn about\
    \ the router's matching strategies for matching routes.\n\n# Route-matching strategies\n\
    \nThe matching algorithm in the Angular router provides two strategies: prefix\
    \ and full, however you may also use custom matching strategies:\n\n+   - The\
    \ router checks if the start of the browser's URL is prefixed with the route's\
    \ path and renders the appropriate component using the default prefix strategy.\n\
    +   - The router uses the full strategy to determine if the path segment of the\
    \ browser's URL is identical to the path of the route.\n\nIf you need to match\
    \ the entire path, just set the pathMatch attribute of the route to full strategy,\
    \ as seen here:\n\n```\n{ path: 'posts', pathMatch: 'full', component:\n  PostsComponent\
    \ }\n```\n\nThe scenario of an empty path is another typical example of matching\
    \ the full path, because the default prefix strategy will match all paths since\
    \ the empty string is part of any path. For example, we can use the following\
    \ route configuration to redirect visitors to the /home path when they first visit\
    \ our application:\n\n```\n{ path: '', redirectTo: '/home, pathMatch: 'full' }\n\
    ```\n\nWe employ redirectTo instead of the component attribute, which accepts\
    \ the path to which users will be routed."
  merge: -1
  img_proc: true
- pgno: 166
  md: "Now that we've learned about route-matching strategies and the distinction\
    \ between prefix and full strategies, let's look at route parameters.\n\n# Route\
    \ parameters\n\nRoutes can also be used to carry arguments. The Angular router\
    \ supports dynamic paths and offers the APIs needed to access route parameters\
    \ within matched components.\n\nYou may add a parameter to your route by putting\
    \ a colon before the parameter's name, as seen here:\n\n```\n{path: 'post/:id'\
    \ , component: PostComponent}\n```\n\nWe made use of a parameter called id.\n\n\
    The route parameter's value may be obtained by using the ActivatedRoute service,\
    \ which allows you to obtain information about a route coupled with a component\
    \ loaded in a router outlet, as well as the ParamMap Observable, which provides\
    \ a map of the query parameters.\n\n> **Important Note**\n> Consider an Observable\
    \ to be a collection of data that may be available at some point in the future,\
    \ not necessarily at the time it is defined. It's a different method of performing\
    \ asynchronous operations in JavaScript that's more powerful than Promises. It's\
    \ supported on Angular via the RxJS library and is tightly integrated into the\
    \ framework, with several built-in APIs.\n\n# Adding routes\n\nLet's add routes\
    \ to the components we previously created in our application now that we've learned\
    \ about routes, matching strategies, and parameters.\n\nReturn to the src/app/app.component.html\
    \ file and delete all of the unnecessary HTML markup, leaving only the router\
    \ outlet. Next, include the header and footer components respectively on top of\
    \ and below the router outlet, as follows:\n\n```\n<app-header></app-header>\n\
    <main>\n    <router-outlet></router-outlet>\n</main>\n<app-footer></app-footer>\n\
    ```"
