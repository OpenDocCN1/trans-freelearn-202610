    server.

    +   2. We''ll utilize the GraphQL generator to produce the types of the results
    and variables, as well as the GraphQL services (that extend the Query and Mutation
    classes of apollo-angular) to like and comment on posts.

    +   3. We''ll create and export Angular services, which include the logic for
