  .profile-bio-box {\n  width: 100%;\n  height: 5rem;\n}\n.bio-box-wrapper > textarea\
  \ {\n  padding: 10px;\n  background-color: #f0f2f5;\n  border-radius: 9px;\n}\n\
  ```\n\nprofile-grid 类包含封面图像和用户照片下方的所有信息，以及包含全名、简介、日期、帖子计数和帖子的元素。\n\n我们将显示切换到网格模式，并使用\
  \ fr 单位（分数单位）将可用水平空间划分为比例为 1、2.5 和 1.5 的三列。查看 https://www.techiediaries.com/css-grid-layout-tutorial/\
  \ 获取详细说明。\n\n5. 设置在找不到与对应个人资料用户 ID 匹配的用户时将显示的元素样式：\n\n```\n.user-not-found {\n \
  \   text-align: center;\n    font-size: 5vw;\n    margin: 100px;\n}\n```\n\n6. 对于最大宽度为\
