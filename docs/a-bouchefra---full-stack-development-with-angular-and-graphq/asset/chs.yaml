- "## 9 上传图片和添加帖子\n\n在上一章中，我们通过添加 authentication guard 和单元测试完成了身份验证系统的实现。\n\n在本章中，我们将开始实现\
  \ profile 组件的功能。我们将添加必要的代码来获取与个人资料 URL 对应的用户，并在页面上渲染其信息，包括上传用户照片和封面图片的能力，以及添加个人简介。\n\
  \n我们将使用 GraphQL Code Generator 等额外工具来生成代码并自动推断变量和结果类型，而不是手动指定它们，这使我们的代码保持干净、可维护且可扩展。\n\
  \n我们将涵盖以下主题：\n\n- 使用 Angular 和 Apollo 上传图片\n- 实现 post service\n- 实现 profile service\n\
  - 实现 base component\n- 实现 profile component\n\n- 创建 profile UI\n- 实现 `create-post`\
  \ 组件\n\n## 技术要求\n\n要完成本章的步骤，你必须先完成本书的上一章。\n\n你还应熟悉以下技术：\n\n- JavaScript/TypeScript\n\
  - HTML\n- CSS\n\n本章的源代码可在 https://github.com/PacktPublishing/Full-Stack-App-Development-with-Angular-and-GraphQL/tree/main/Chapter07\
  \ 找到。\n\n## 使用 Angular 和 Apollo 上传图片\n\n上传图片是任何社交网络的必备功能；在我们的案例中，我们不仅需要帖子的图片，还需要用户的照片和个人资料封面。\n\
  \n我们已在后端添加了三个 mutations：`uploadFile`、`setUserPhoto` 和 `setUserCover`。在本节中，我们将编写代码以发送请求调用这些\
  \ GraphQL mutations，从而创建带或不带图片的帖子，以及设置用户的个人资料照片和封面。\n\n我们在上一节中通过使用 `gql` 标签包装查询和\
  \ mutations 手动创建了 GraphQL 文档，该标签返回我们传递给 Apollo Client 方法以获取或变更数据的文档（`DocumentNode`\
  \ 类型的对象）。\n\n然后，为了与我们的 GraphQL API 通信，我们为 results/responses 创建了类型并实现了 Apollo services，这些服务扩展了通用的\
  \ `Query` 或 `Mutation` 类。\n\n这可行，但随着代码库的增长，很可能无法扩展，因为手动编写和维护类型需要额外的工作来确保结果（和变量）的类型与我们正在使用的\
  \ selection sets（和 GraphQL arguments）匹配。这增加了出现诸如拼写错误等错误的可能性。\n\n\n\n幸运的是，我们拥有诸如\
  \ GraphQL Code Generator 之类的生成工具，它可以生成 TypeScript 类型甚至 Apollo 服务。\n\n使用各种插件，该工具通过提供服务器模式和\
  \ GraphQL 查询与变更来生成完整的类型和代码结构，例如 GraphQL 文档和 Apollo 服务（用于 apollo-angular）。请查看 https://www.graphql-code-generator.com。\n\
  \n要为变量和结果生成 TypeScript 类型，我们可以使用 @graphql-codegen/typescript 和 @graphql-codegen/typescript-operations\
  \ 插件。\n\n然后，使用 @graphql-codegen/typescript-apollo-angular 插件，我们可以生成 Angular 服务。\n\
  \n这让你无需手动创建和更新类型。该工具最近已扩展，因此在调用 Apollo Client API（或你偏好使用的任何 GraphQL 客户端）时无需手动指定类型。\n\
  \n此功能在 graphql-typed-document-node 插件中实现，该插件生成具有强类型的 DocumentNode 对象。有关更多信息，请参阅\
  \ https://github.com/dotansimha/graphql-typed-document-node 和 https://the-guild.dev/blog/typed-document-node。\n\
  \n在本节中，我们将继续实现我们的应用程序，但这次我们将使用代码生成器，并使用必要的插件进行配置，以生成服务和类型化的 DocumentNode 对象，从而自动推断变量和结果类型，而不是手动指定，这样可以保持代码整洁、可维护且可扩展！\n\
  \n## 设置 GraphQL Code Generator\n\n类型化文档节点由 apollo-angular 2.6.0 及更高版本支持，因此让我们确保拥有\
  \ @apollo/client 和 apollo-angular 包的最新版本，通过从 client/ 文件夹运行以下命令来升级现有依赖项：\n\n```bash\n\
  npm i @apollo/client\nnpm i apollo-angular\n```\n\n请注意，在本书编写期间已添加对类型化文档的支持，因此在你的情况下此步骤可能并非必要。\n\
  \n让我们逐步介绍如何设置 GraphQL Code Generator 以生成用于与 GraphQL API 交互的类型化文档和服务：\n\n- 1. 首先，打开你的终端并从\
  \ monorepo 项目的根目录执行以下命令以安装必要的依赖项：\n\n```\nnpm i @graphql-codegen/cli\nnpm i @graphql-typed-document-node/core\n\
  npm i @graphql-codegen/typescript\nnpm i @graphql-codegen/typescript-operations\n\
  npm i @graphql-codegen/typed-document-node\nnpm i @graphql-codegen/typescript-apollo-angular\n\
  npm i @graphql-codegen/import-types-preset\n```\n\n我们在处理服务器端应用程序时之前已安装 CLI，但重新安装可确保我们拥有最新版本。\n\
  \n- 2. 在 monorepo 项目的根目录中打开 codegen.yml 文件，并使用根级配置中的 documents 字段更新它以指向你的 GraphQL\
  \ 文档，如下所示：\n\n```\ndocuments: './packages/client/src/**/*.graphql'\n```\n\n该字段与\
  \ schema 字段在同一级别添加。该字段接受多种选项。在我们的例子中，我们使用 glob 表达式指定可能存在于 ./packages/client/src/\
  \ 文件夹子文件夹中的多个文件。有关该字段的更多信息，请查看 https://www.graphql-code-generator.com/docs/getting-started/documents-field。\n\
  \n- 3. 在 generates 字段下，添加以下输出以生成类型：\n\n```\ngenerates:\n  # [...] \n  ./packages/graphql-types/src/types.ts:\n\
  \    plugins:\n      - typescript\n```\n\n为了生成将在下一个生成文件中导入的类型，我们使用 TypeScript 插件。\n\
  \n- 4. 同样，添加以下输出以生成 GraphQL 文档和操作：\n\n```\n./packages/graphql-types/src/client/\n\
  \  graphql-operations.ts:\n  preset: import-types\n  presetConfig:\n    typesPath:\
  \ ../types\n  plugins:\n    - typescript-operations\n    - typed-document-node\n\
  ```\n\nimport-types 预设用于从 ../types 路径导入并重用之前生成的类型，而 typescript-operations 和 typed-document-node\
  \ 插件用于生成 GraphQL 操作和类型化文档。\n\n- 5. 最后，使用 typescript-apollo-angular 插件按如下方式生成 Angular\
  \ 服务：\n\n```\n./packages/client/src/app/core/gql.services.ts:\n  config:\n    documentMode:\
  \ external\n    importOperationTypesFrom: Operations\n    importDocumentNodeExternallyFrom:\n\
  \      '@ngsocial/graphql/documents'\n  plugins:\n    - typescript-apollo-angular\n\
  ```\n\n在 config 字段中，我们传递选项以从 '@ngsocial/graphql/documents' 路径导入文档，该路径将被配置为指向我们之前生成的\
  \ graphql-operations.ts 文件，因为它们是生成服务所必需的。\n\n否则，我们还必须在此处添加 typescript-operations\
  \ 插件，这将在 gql.services.ts 文件中生成相同的类型。有关 config 字段的更多信息，请查看 https://www.graphql-code-generator.com/docs/getting-started/config-field。\n\
  \n我们使用 `importDocumentNodeExternallyFrom` 选项，并将 `documentMode` 设置为 `external`，以便在自己的文件中导入使用\
  \ `typescript-operations` 插件生成的基类型，在我们的例子中是 `graphql-operations.ts`，并且我们使用 `importOperationTypesFrom`\
  \ 选项为它们添加 `Operations` 前缀。\n\n有关更多信息，请查看 https://www.graphql-code-generator.com/docs/plugins/typescript-document-nodes。\n\
  \n此配置用于避免在每个文件中生成相同的基本类型、文档类型和 GraphQL 操作。我们只创建一次，然后根据需要从其他文件导入。查看所有可用插件 https://www.graphql-code-generator.com/docs/plugins/index。\n\
  \n## 添加片段和变更\n\n在本节中，我们将添加创建帖子和上传图像所需的片段和变更，然后生成结果的类型和用于向服务器发送变更的 Apollo 服务，然后再实现\
  \ users 模块的个人资料服务。\n\n如果你不熟悉片段，请阅读官方指南 https://graphql.org/learn/queries/#fragments。\n\
  \n让我们开始添加 GraphQL 片段和变更：\n\n- 1. 首先，在 `client/src/app/` 文件夹内创建 `graphql.documents/`\
  \ 文件夹，然后创建 `graphql.documents/user.graphql` 文件，并添加以下作用于 User 类型上的片段：\n- 2. 按如下方式添加\
  \ UserFields 片段：\n\n```graphql\nfragment BasicUserFields on User {\n  id\n  fullName\n\
  \  username\n  image\n}\n```\n\n此片段包含我们 GraphQL 模式的 User 类型的一组基本字段。\n\n```graphql\n\
  fragment UserFields on User {\n  ...BasicUserFields\n  email\n  bio\n  coverImage\n\
  \  postsCount\n  createdAt\n}\n```\n\n此片段包含 User 类型字段的全部集合。为了在 UserFields 片段上扩展\
  \ BasicUserFields 片段，我们使用 ...（三个点）语法。\n\n- 3. 添加用于设置用户照片的 setUserPhoto 变更：\n\n```graphql\n\
  mutation setUserPhoto($file: Upload!) {\n  setUserPhoto(file: $file) {\n    ...UserFields\n\
  \  }\n}\n```\n\n由于此变更返回其照片已被设置的 user 对象，我们使用选择集来要求后端为我们在前端应用中需要的确切字段。在选择集中，我们扩展\
  \ UserFields 片段，该片段引用模式中 User 类型的字段。\n\n- 4. 添加用于设置用户封面图像的 setUserCover 变更：\n\n\
  ```graphql\nmutation setUserCover($file: Upload!) {\n  setUserCover(file: $file)\
  \ {\n    ...UserFields\n  }\n}\n```\n\n- 5. 添加用于设置用户简介的 setUserBio 变更：\n\n```graphql\n\
  mutation setUserBio($bio: String!) {\n  setUserBio(bio: $bio) {\n    ...UserFields\n\
  \  }\n}\n```\n\n让我们现在添加必要的 Post 类型片段。\n\n- 1. 创建 graphql.documents/post.graphql\
  \ 文件并开始添加以下片段：\n- 2. 添加以下片段，其中包含与 Post 类型的点赞信息相关的字段：\n- 3. 添加以下片段，其中包含与 Post 类型上的评论信息相关的字段：\n\
  \n```graphql\nfragment BasicPostFields on Post {\n  id\n  text\n  image\n  createdAt\n\
  }\n```\n\n```graphql\nfragment LikesInfo on Post {\n  likesCount\n  latestLike\n\
  \  likedByAuthUser\n}\n```\n\n```graphql\nfragment CommentsInfo on Post {\n  latestComment\
  \ {\n    ...CommentFields\n    author {\n      ...BasicUserFields\n    }\n  }\n\
  \  commentsCount\n}\n```\n\n我们在返回对象的 latestComment 字段中扩展将在后续步骤中定义的 CommentFields\
  \ 片段。我们在 author 字段中扩展 BasicUserFields 片段，该片段包含 User 类型的基本字段。\n\n\n\n\n4. 按如下所示添加\
  \ PostFields 片段：\n\n```\nfragment PostFields on Post {\n  ...BasicPostFields\n \
  \ author {\n    ...BasicUserFields\n  }\n  ...CommentsInfo\n  ...LikesInfo\n}\n\
  ```\n\n接下来，添加三个用于上传文件、创建和删除帖子的 mutation。\n\n5. 首先将以下 mutation 添加到同一个 post.graphql\
  \ 文件中：\n\n```\nmutation uploadFile($file: Upload!) {\n  uploadFile(file: $file)\
  \ {\n    url\n    filename\n    mimetype\n    encoding\n  }\n}\n```\n\n添加以下用于从文本和/或图像创建帖子的\
  \ mutation：\n\n```\nmutation createPost($text: String, $image: String) {\n  post(text:\
  \ $text, image: $image) {\n    ...BasicPostFields\n    author {\n      ...BasicUserFields\n\
  \      postsCount\n    }\n  }\n}\n```\n\n我们在选择集中扩展 BasicPostFields 片段，然后在 author\
  \ 字段中扩展 BasicUserFields 片段。\n\n添加以下用于通过 ID 删除帖子的 mutation：\n\n```\nmutation removePost($id:\
  \ ID!) {\n  removePost(id: $id)\n}\n```\n\n- 6. 同时创建 graphql.documents/comment.graphql\
  \ 文件，并向 GraphQL 模式的 Comment 类型添加以下片段：\n\n```\nfragment CommentFields on Comment\
  \ {\n  id\n  comment\n  createdAt\n}\n```\n\n现在我们已添加了用于上传图像、创建和删除帖子所需片段和 mutation，将会看到如何使用代码生成器生成类型和\
  \ Apollo 服务。\n\n## 生成类型和服务\n\n让我们使用代码生成器生成类型和服务：\n\n- 1. 要从 monorepo 项目的根目录启动代码生成器，请使用以下命令：\n\
  \n```\nnpm run codegen\n```\n\n这将生成相关文件，其中包含适当的代码和类型。在 @ngsocial/graphql 包中，类型和文档会被生成，而\
  \ Angular 服务则在客户端项目的 core/ 文件夹中生成。\n\n- 2. 打开 client/tsconfig.json 文件并向生成的文件添加以下路径：\n\
  \n```\n\"paths\": {\n  \"@ngsocial/graphql\": [\"../graphql-types/src\"],\n  \"\
  @ngsocial/graphql/types\": [\"../graphql-types/src/types\"],\n  \"@ngsocial/graphql/documents\"\
  : [\"../graphql-types/src/client/graphql-operations\"]\n}\n```\n\n而不是指定完整路径，我们将能够从\
  \ @ngsocial/graphql/types 和 @ngsocial/graphql/documents 路径导入类型和文档节点对象。\n\n## 实现\
  \ post 服务\n\n现在让我们生成并实现 post 服务，该服务封装了创建和删除帖子以及上传图像的方法，在我们生成类型和服务并配置路径之后。只需注入生成的\
  \ CreatePostGQL、RemovePostGQL 和 UploadFileGQL 服务，并使用必要的参数调用它们的 mutate() 方法以将 mutation\
  \ 发送到后端：\n\n- 1. 要在 core/ 文件夹中生成 post 服务，请打开终端并运行以下命令：\n\n```\nng g s core/services/post/post\n\
  ```\n\n接下来，创建 core/services/index.ts 文件并从 core/ 文件夹内部将现有服务导出到导入路径：\n\n```\nexport\
  \ { AuthService } from './auth/auth.service';\n```\n\n```\nexport { PostService\
  \ } from './post/post.service';\n```\n\n此外，打开 core/index.ts 文件并按如下方式更新它：\n\n```\n\
  export {\n    AuthService,\n    PostService\n} from './services';\nexport { AuthGuard\
  \ } from './guards/auth/auth.guard';\nexport * from './gql.services';\n```\n\n我们重新导出\
  \ post 服务和所有 Apollo 服务，这些服务由代码生成器在 ./gql.services.ts 文件中生成。\n\n- 2. 向 core/services/post/post.service.ts\
  \ 文件添加以下导入：\n\n```\nimport { map } from 'rxjs/operators';\nimport {\n    CreatePostGQL,\n\
  \    RemovePostGQL,\n    UploadFileGQL\n} from 'src/app/core';\n```\n\n3. 接下来，使用服务构造函数按如下方式注入导入的服务：\n\
  \n```\n```typescript\nexport class PostService {\n  constructor(\n    private createPostGQL:\
  \ CreatePostGQL,\n    private removePostGQL: RemovePostGQL,\n    private uploadFileGQL:\
  \ UploadFileGQL) { }\n```\n```\n\n4. 定义并实现以下文件上传方法：\n\n```\n```typescript\nuploadFile(image:\
  \ File) {\n  return this.uploadFileGQL.mutate(\n    {\n      file: image\n    },\n\
  \    {\n      context: {\n        useMultipart: true\n      }\n    }).pipe(map(result\
  \ => result.data!.uploadFile));\n}\n```\n```\n\n5. 定义并实现以下创建帖子的方法：\n\n```\n```typescript\n\
  createPost(text: string | null, image: string | null) {\n  return this.createPostGQL\n\
  \    .mutate({\n      text: text,\n      image: image\n    })\n    .pipe(map(result\
  \ => result.data!.post));\n}\n```\n```\n\n6. 按如下方式定义并实现按 ID 删除帖子的方法：\n\n```\n```typescript\n\
  removePost(id: string) {\n  return this.removePostGQL\n    .mutate({\n      id:\
  \ id\n    })\n```\n```\n\n```\n```ts\n.pipe(map(result => result.data!.removePost));\n\
  }\n```\n```\n\n我们已添加了创建和删除帖子以及上传帖子图像所需的必要方法。接下来，我们必须实现 profile 服务，其中包含用于配置用户简介、照片和封面的代码。然后，我们将查看如何使用\
  \ profile 组件添加用于调用这些功能的 UI。\n\n## 实现 profile 服务\n\n在本节中，我们将构建 profile 服务，其中包含与用户个人资料交互的代码。此服务注入生成的\
