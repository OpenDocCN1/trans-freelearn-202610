  当您添加帖子时，Apollo Client 并不会总是显示它，因此我们需要刷新应用才能看到它。让我们确保它始终被添加，而无需刷新。类似于删除帖子，我们可以重新获取相关查询或手动更新缓存。打开\
  \ src/app/core/services/post/post.service.ts 文件并按如下方式更新 createPost() 方法：\n\n```\n\
  createPost(text: string | null, image: string | null) {\n  return this.createPostGQL\n\
