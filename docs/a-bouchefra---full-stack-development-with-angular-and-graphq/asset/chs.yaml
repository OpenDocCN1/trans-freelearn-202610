  \n```ts\npublic authService: AuthService;\npublic postService: PostService;\npublic\
  \ posts: Post[] = [];\npublic authUser: Partial<User> | null = null;\npublic loading:\
  \ boolean = false;\nprotected snackBar: MatSnackBar;\nprivate componentDestroyed\
  \ = new Subject();\n```\n\n我们定义了将在父组件中使用的属性，例如 posts 数组，用于保存获取到的帖子，authUser 对象，用于保存已认证的用户，以及\
  \ loading 属性，用于跟踪操作的加载状态。\n\n我们还定义了 componentDestroyed subject，它将在组件被销毁后用于取消订阅各种方法返回的可观察对象。\n\
  \n最后，我们定义了 authService、postService 和 snackBar 属性，这些属性将用于使用 Injector 服务分配依赖项，而不是通过构造函数注入，以简化子组件。\n\
  \nprivate 属性只能从基组件内部访问，而 protected 属性可以从基组件和子组件访问。public 属性可以从组件内部和关联的模板访问。\n\n\
  ## 4. 接下来，而不是使用构造函数的参数，让我们在构造函数内部注入依赖项：\n\n```ts\nconstructor(public injector: Injector)\
  \ {\n  this.snackBar = injector.get(MatSnackBar);\n  this.authService = injector.get(AuthService);\n\
  \  this.postService = injector.get(PostService);\n}\n```\n\n我们在构造函数中注入 Injector\
  \ 服务，然后使用它获取所需的依赖项。这消除了子组件需要将其父依赖项重新传递到其构造函数的需要。有关更多信息，请查看 https://devblogs.microsoft.com/premier-developer/angular-how-to-simplify-components-with-typescript-inheritance/。\n\
  \n## 5. 使用以下代码实现生命周期 ngOnInit() 方法：\n\n```ts\nngOnInit(): void {\n    this.authService\n\
  \        .authUser\n        .pipe(\n            takeUntil(this.componentDestroyed)\n\
  \        )\n        .subscribe({\n            next: (authUser) => {\n          \
  \      this.authUser = authUser;\n            }\n        });\n}\n```\n\n我们还将已认证的用户分配给组件的\
  \ authUser 属性，这样我们就可以在组件及其子组件中访问它，而无需引用身份验证服务。\n\n## 6. 使用以下代码实现 ngOnDestroy() 生命周期方法：\n\
  \n```ts\nngOnDestroy(): void {\n    this.componentDestroyed.next();\n    this.componentDestroyed.complete();\n\
  }\n```\n\n如果组件被销毁，我们从 componentDestroyed subject 发出一个值并完成该 subject。这将作为 takeUntil()\
  \ 运算符的通知器，该运算符将在以下步骤中实现的方法上应用，以取消订阅返回的可观察对象。当我们的 subject 发出值时，takeUntil() 运算符将取消订阅我们订阅的源可观察对象。\n\
  \n## 7. 为处理错误，添加 protected handleErrors() 方法，该方法将传递给 subscribe() 方法的错误处理程序：\n\n\
  ```ts\nprotected handleErrors(err: Error) {\n    if(this.loading) this.loading =\
  \ false;\n    console.log(err);\n    this.snackBar.open(err.message, 'Ok', {\n \
  \       duration: 5 * 1000\n    });\n}\n```\n\n当发生错误时，loading 属性被设置为 false，并显示错误消息。loading\
  \ 属性控制用户界面中是否出现加载指示器。\n\n## 8. 添加 displayMessage() 方法，该方法使用 snack bar 显示作为参数传递的消息：\n\
  \n```ts\nprotected displayMessage(message: string) {\n    this.snackBar\n      \
  \  .open(message,\n            'Ok', {\n                duration: 5 * 1000\n   \
  \         });\n}\n```\n\n## 9. 添加 createPost() 方法以创建仅文本帖子或显示错误消息，如下所示：\n\n```ts\n\
  private createPost(text: string | null) {\n    if (!text?.length) {\n        this.displayMessage('Cannot\
  \ create an empty\n            post.');\n        return;\n    }\n    if (text) {\n\
  \        this.createTextPost(text);\n    }\n}\n```\n\n要创建没有图片的帖子，将调用此方法。如果作为参数传递的文本为空，则会使用\
  \ snack bar 组件显示 Cannot create an empty post. 错误，并退出该方法。否则，我们将操作委托给下一步的 createTextPost()\
  \ 方法。\n\n## 10. 实现 createTextPost() 方法，该方法将帖子的创建传递给 post 服务：\n\n```ts\nprivate createTextPost(text:\
  \ string): void {\n    this.loading = true;\n    this.postService\n        .createPost(text,\
  \ null)\n        .pipe(\n            takeUntil(this.componentDestroyed))\n     \
  \   .subscribe(/* ... */);\n}\n```\n\n当操作即将开始时，我们将 loading 属性设置为 true，并在操作成功或失败时将其值设置为\
  \ false。为了避免内存泄漏，我们还将使用 takeUntil() 运算符取消订阅返回的可观察对象。\n\n然后，将以下观察者对象传递给 subscribe()\
  \ 方法：\n\n```ts\n{\n    next: (post) => {\n        if (post) {\n            this.loading\
  \ = false;\n            this.displayMessage('Your post was created.');\n       \
  \     console.log(post);\n        }\n    },\n    error: (err) => this.handleErrors(err)\n\
  }\n```\n\n如果操作成功，我们将 loading 属性设置为 false，并使用 snack bar 组件显示成功消息。否则，我们处理错误。\n\n##\
  \ 11. 实现 uploadImageAndCreatePost() 方法以上传图片并创建带或不带文本的帖子：\n\n```ts\nprivate uploadImageAndCreatePost(image:\
  \ File, text: string | null) {\n    this.loading = true;\n    this.postService\n\
  \        .uploadFile(image)\n        .pipe(\n            mergeMap(uploadFile =>\
  \ this.postService\n                .createPost(text, uploadFile?.url || null)\n\
  \            ),\n            takeUntil(this.componentDestroyed)\n        ).subscribe(/*\
  \ ... */);\n}\n```\n\n在此方法中，我们首先将 loading 属性设置为 true，然后调用 post 服务的 uploadFile()\
  \ 方法并订阅返回的可观察对象。\n\n我们使用 mergeMap() 运算符将创建帖子的可观察对象与上传图片的可观察对象链接起来，因为对 createPost()\
  \ 方法的调用依赖于 uploadFile() 方法的结果。当我们订阅组合后的可观察对象时，它会将两个可观察对象合并为一个，并确保内部可观察对象在源之后发出。\n\
  \n当源可观察对象发出上传文件的信息时，发出的值会传递给我们传递给 mergeMap() 运算符的函数，在该函数中我们调用 createPost() 方法，该方法返回内部可观察对象。\n\
  \n这意味着图片将首先被上传，然后输出将传递给负责创建帖子的方法。顺序至关重要，因为我们必须先获取上传图片的 URL，然后才能调用 createPost() 方法。\n\
  \nmergeMap() 运算符将 uploadFile() 方法返回的源可观察对象发出的每个值映射并展平为 createPost() 方法返回的内部可观察对象。\n\
  \n请参阅 https://rxjs.dev/api/operators/mergeMap。\n\n我们还使用 pipe() 方法在调用 subscribe()\
  \ 方法之前将 takeUntil() 运算符应用于源可观察对象。\n\n我们将 componentDestroyed subject 作为通知器传递给 takeUntil()\
  \ 运算符，以便在组件被销毁时取消订阅可观察对象。\n\n然后，将以下观察者对象传递给 subscribe() 方法：\n\n```ts\n{\n    next:\
  \ (post) => {\n        this.loading = false;\n        if (post) {\n```\n\n\n```\n\
  this.displayMessage('Your post was created.');\nconsole.log(post);\n}\n},\nerror:\
  \ (err) => this.handleErrors(err)\n}\n```\n\n如果帖子成功创建，我们会显示一条成功消息，否则，我们会处理错误。为了在方法中处理错误，我们在错误处理程序中调用\
  \ handleErrors() 方法。\n\n12. 实现以下 onPost() 方法，当用户想要创建帖子时调用该方法：\n\n```\nonPost(e:\
  \ PostEvent): void {\n  if (e.image) {\n    this.uploadImageAndCreatePost(e.image,\
  \ e.text);\n  }\n  else {\n    this.createPost(e.text);\n  }\n}\n```\n\n此方法将在响应帖子创建的自定义事件时被调用。如果用户选择了图片，我们使用\
  \ uploadImageAndCreatePost() 方法上传图片并创建帖子，该帖子可以带或不带文字（e.text 对象可以为 null）。否则，我们将使用\
  \ createPost() 方法创建仅包含文字的帖子。\n\n13. 添加 onRemovePost() 方法以根据其 ID 删除帖子：\n\n```\nonRemovePost(e:\
  \ RemovePostEvent): void {\n  this.postService\n    .removePost(e.id)\n    .pipe(takeUntil(this.componentDestroyed))\n\
