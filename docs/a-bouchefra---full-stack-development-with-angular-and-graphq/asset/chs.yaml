  \n打开 shared/index.ts 文件并按如下方式导出类型：\n\n```\nexport { PostEvent } from './types/post.event';\n\
  export { RemovePostEvent } from './types/removepost.event';\n```\n\n2. 创建 core/components/base.component.ts\
  \ 文件并添加以下导入：\n\n首先导入 Injector 和生命周期接口：\n\n```\nimport {\n  Injector,\n  Component,\n\
