- "## 4 实现身份验证和授权\n使用 Apollo Server 实现身份验证和图像上传\n\n在上一章中，我们介绍了如何使用 TypeORM 将 MySQL\
  \ 数据库连接到我们的 Web 应用程序，并实现了用于与数据库通信的一些解析器。我们能够公开一个可工作的 GraphQL API，其中包含实际的解析器，可查询和删除真实\
  \ MySQL 数据库中的数据。\n\n我们使用 TypeORM 而不是纯 SQL 来操作数据库，它使用 TypeScript 中的高级编程结构抽象底层数据库管理系统和\
  \ SQL 指令。\n\n我们创建了负责为社交应用程序生成数据库表和列的 TypeORM 实体，并将 TypeORM 与 Apollo Server 集成。在本章中，我们将了解如何使用\
  \ Apollo Server 为我们的 GraphQL API 添加身份验证和图像上传，并实现更多解析器。\n\n我们将学习使用 Node.js、Express\
  \ 和 Apollo Server 添加身份验证所需的概念，然后学习如何处理图像上传。\n\n我们将具体涵盖以下主题：\n\n- 什么是 JWT?\n- 使用\
  \ Node.js 和 Apollo 实现身份验证\n- 保护 GraphQL 查询和变更\n- 实现图像上传\n\n## 技术要求\n\n要完成本章的步骤，你需要完成本书的第\
  \ 3 章《使用 TypeORM 连接数据库》。\n\n你需要熟悉以下技术：\n\n- TypeScript\n- Node.js\n- SQL 基础\n- GraphQL\
  \ 基础\n\n你需要拥有 Amazon S3/DigitalOcean Spaces 对象存储或任何兼容服务的账户。\n\nAmazon 提供免费套餐供你跟随本章步骤使用，但如果你无法为他们注册账户，可以使用\
  \ MinIO 等工具在本地运行与 Amazon S3 兼容的服务器。更多信息请查看 https://docs.min.io/。\n\n你可以在 https://github.com/PacktPublishing/Full-Stack-App-Development-with-Angular-and-GraphQL/tree/main/Chapter04\
  \ 找到本章的源代码。\n\n\n\n## 什么是 JWT？\n\n**JWT** 代表 **JSON Web Token**，它是一个开放标准（RFC 7519），提供了一种简洁且自包含的机制，用于以\
  \ JSON 对象的形式在计算机之间安全地编码和传输信息。\n\n在开发 GraphQL API 时，你几乎总是需要保护特定端点免受公开访问，并且需要用户先经过身份验证，然后获得授权（允许）使用该端点（们）。\n\
  \n你可以使用 JWT 实现这一点。这就是使用 JWT 进行身份验证的工作方式：\n\n- 1. 当用户注册或登录时，我们在服务器上构建包含用户身份的 JWT\
  \ 令牌并将其发送给客户端。\n- 2. 我们需要在客户端每次请求时将收到的令牌传回服务器，以便服务器验证客户端的身份并确定其是否被允许访问该端点。\n\n在当代\
  \ Web 应用中，其中 JavaScript 客户端应用必须与 API 接口以查询和保存数据到服务器，JWT 身份验证非常流行且高效。\n\n由于令牌未加密而只是使用加密技术签名，因此在使用\
  \ JWT 时需要使用 HTTPS 来持久化用户数据，以防止任何中间人攻击拦截和篡改它。\n\n身份验证可以通过多种方式完成。最典型的方法是使用用户填写的登录表单要求用户的电子邮件和密码。\n\
  \n在保护我们的 API 时，我们应注意两个概念之间的区别：\n\n- **Authentication**，即确认用户身份的过程。\n- **Authorization**，用于验证经过身份验证的用户是否根据其在系统中的角色有权访问或执行某些操作。\n\
  \n现在我们了解了 JWT 令牌是什么以及身份验证和授权之间的区别，让我们看看如何使用 Apollo 实现身份验证。\n\n## 实现身份验证\n\n在实现 GraphQL\
  \ API 时，你几乎总是需要保护查询和变更免受未经身份验证和/或未经授权的用户访问。在本节中，我们将向我们的 GraphQL API 添加 JWT 身份验证。\n\
  \n在 Apollo 中，我们可以从 HTTP 头中检索客户端发送回的 JWT 令牌，从该令牌中提取用户信息，并将其包含在上下文中，该上下文可以从任何解析器访问。在解析器中，我们可以使用用户信息来验证用户有权访问的数据。\n\
  \n我们将使用 dotenv 等库从 .env 文件加载环境变量，我们可以使用它来添加生成 JWT 所需的密钥，并使用 jsonwebtoken 生成令牌。我们还将使用\
  \ Scrypt 算法在将用户密码保存到数据库之前对其进行哈希处理。\n\n让我们现在看看实际步骤：\n\n- 1. 让我们从服务器项目的目录开始，使用以下命令安装所需的库：\n\
  \n```\nnpm install dotenv jsonwebtoken\n```\n\n```\nnpm install --save-dev @types/jsonwebtoken\n\
  ```\n\n- 2. 在你的 GraphQL 模式中添加以下类型，可从 server/src/graphql/schema.graphql 文件获得：\n\n\
  ```\ntype AuthPayload {\n    token: String!\n    user: User!\n}\n```\n\n- 3. 接下来，我们需要在\
  \ src/graphql/schema.graphql 文件中添加两个用于注册和登录用户的变更：\n\n```\ntype Mutation {\n    [...]\n\
  \    register(fullName: String!, username: String!,\n    email: String!, password:\
  \ String!): AuthPayload!\n    signIn(email: String!, password: String!):\n    AuthPayload!\n\
  }\n```\n\n- 4. 更新模式后，你需要重新生成类型。打开一个新的命令行界面，并从你的 monorepo 项目文件夹（其中包含 /packages 文件夹）运行以下命令：\n\
  \n```\nnpm run codegen\n```\n\n- 5. 之后，我们需要在 server/src/graphql/resolvers.ts 文件中实现解析器。首先添加以下导入：\n\
  \n```\nimport jsonwebtoken from 'jsonwebtoken';\nimport crypto from 'crypto';\n\
  import dotenv from 'dotenv';\n```\n\n- 6. 接下来，添加以下行：\n\n```\ndotenv.config();\n\
  ```\n\n这将配置 dotenv 以加载我们的环境变量。\n\n- 7. 在 server/ 文件夹内，创建一个 .env 文件并添加以下将用于签名令牌的变量：\n\
  \n```\nJWT_SECRET=azerty123456\n```\n\n我们使用了 azerty123456 作为我们的 JWT 共享密钥。然而，对于生产环境，请确保使用强密钥使用\
  \ HMAC 算法签名 JWT，以防止任何暴力攻击。\n\n- 8. 在 server/src/graphql/resolvers.ts 文件中添加以下用于哈希密码的方法：\n\
  \n```\nconst hashPassword = async (plainPassword: string):\nPromise<string> => {\n\
  \    return new Promise((resolve, reject) => {\n        const bytes = crypto.randomBytes(16);\n\
  \        const salt = bytes.toString(\"hex\");\n        crypto.scrypt(plainPassword,\
  \ salt, 64,\n        (error, buffer) => {\n            if (error) reject(error);\n\
  \            const hashedPassword =\n                `${salt}:${buffer.toString('hex')}`;\n\
  \            resolve(hashedPassword);\n        });\n    })\n};\n```\n\n我们将使用此函数在将密码保存到数据库之前使用\
  \ Scrypt（一种加盐哈希算法）对其进行哈希处理。\n\n为了使用 Scrypt 对密码进行哈希处理，你需要为每个哈希创建唯一的盐。你可以查看 https://auth0.com/blog/adding-salt-to-hashing-a-better-way-to-store-passwords/\
  \ 和 https://qvault.io/cryptography/very-basic-intro-to-the-scrypt-hash/ 了解更多详情。\n\
  \n此函数连接并返回盐和密码的哈希值，两者都将保存到数据库中，因为验证密码需要盐。\n\n- 9. 添加以下方法，将用于比较明文密码与哈希值：\n\n```ts\n\
  const compareToHash = async (plainPassword: string, hash: string): Promise<boolean>\
  \ => {\n  return new Promise((resolve, reject) => {\n    const result = hash.split(\"\
  :\");\n    const salt = result[0];\n    const hPass = result[1];\n    crypto.scrypt(plainPassword,\
  \ salt, 64,\n      (error, buffer) => {\n        if (error) reject(error);\n   \
  \     resolve(hPass == buffer.toString('hex'));\n      });\n  })\n};\n```\n\n查看文档\
  \ https://nodejs.org/api/crypto.html#crypto_crypto_scrypt_password_salt_keylen_options_callback。\n\
  \n- 10. 接下来，添加用于注册用户的 register 变更：\n\n```ts\nregister: async (_, args, { orm })\
  \ => {}\n```\n\n在方法体内部，我们首先解构 args 对象以检索用户的全名、用户名、电子邮件和密码：\n\n```ts\nconst { fullName,\
  \ username, email, password } = args;\n```\n\n- 11. 接下来，我们调用用户存储库的 create() 方法，使用检索到的信息创建一个新用户。对于密码，我们在分配之前调用\
  \ hashPassword() 方法对其进行哈希处理：\n\n```ts\nlet user = orm.userRepository.create({\n\
  \  fullName: fullName,\n  username: username,\n  email: email,\n  password: await\
  \ hashPassword(password),\n  postsCount: 0,\n  image: 'https://i.imgur.com/nzTFnsM.png'\n\
  });\n```\n\n- 12. 接下来，我们调用用户存储库的 save() 方法将用户保存到数据库中：\n\n```\nconst savedUser =\
  \ await orm.userRepository.save(user)\n.catch((error: unknown) => {\n  if (error\
  \ instanceof QueryFailedError &&\n    error.driverError.code == \"ER_DUP_ENTRY\"\
  ) {\n    throw new ApolloError(\"A user with this email/username already exists\"\
  ,\n    \"USER_ALREADY_EXISTS\");\n  }\n});\n```\n\n确保按如下方式导入 QueryFailedError 类：\n\
  \n```\nimport { DeleteResult, QueryFailedError } from 'typeorm';\n```\n\n在持久化注册的用户信息后，我们使用\
  \ jsonwebtoken 库的 sign() 方法根据用户的 ID 和电子邮件创建一个 JWT，过期期为一年，并使用密钥：\n\n```\nconst token\
  \ = jsonwebtoken.sign(\n  { id: savedUser.id, email: user.email },\n  process.env.JWT_SECRET\
  \ as string,\n  { expiresIn: '1y' }\n);\n```\n\n有关 JWT 的更多详细信息，请阅读 https://jwt.io/introduction/。\n\
  \n- 13. 最后，我们从解析器返回生成的 JWT 和用户：\n\n```\nreturn { token: token, user: savedUser };\n\
  ```\n\n- 14. 接下来，让我们按如下方式实现 signIn 变更：\n\n```ts\nsignIn: async (_, args, { orm })\
  \ => {}\n```\n\n\n\n在方法体内部，我们解构 args 对象以获取用户的电子邮件和密码：\n\n```js\nconst { email, password\
  \ } = args;\n```\n\n然后，调用用户仓库的 findOne() 方法来验证数据库中是否存在具有提供电子邮件的用户。如果用户不存在，我们将抛出一个错误，消息为\
  \ No user found with this email!：\n\n```js\nconst user = await orm.userRepository.findOne({\
  \ where: {\n  email: email } });\nif (!user) {\n  throw new ApolloError('No user\
  \ found with this email!', 'NO_USER_FOUND');\n}\n```\n\n15. 接下来，我们调用 compareToHash()\
  \ 函数来验证提交的密码是否与返回用户的密码匹配。如果不匹配，我们将抛出一个错误，消息为 Incorrect password!：\n\n```js\nif (!await\
  \ compareToHash(password, user.password)) {\n  throw new ApolloError('Incorrect\
  \ password!', 'INCORRECT_PASSWORD');\n}\n```\n\n16. 之后，我们从用户信息生成 JWT token 并从 resolver\
  \ 返回用户和 token：\n\n```js\nconst token = jsonwebtoken.sign(\n  { id: user.id, email:\
  \ user.email },\n  process.env.JWT_SECRET as string,\n  { expiresIn: '1d' }\n);\n\
  return { token, user };\n```\n\n接下来，访问 http://localhost:8080/graphql 并从 Apollo Studio\
  \ 调用你的 register 和 signIn mutations，以查看它们是否按预期工作。\n\n17. 首先使用 register mutation 根据提供的信息创建用户：\n\
  \n```graphql\nmutation {\n  register(\n    fullName: \"Ahmed Bouchefra\"\n    username:\
  \ \"ahmed.bouchefra\"\n    email: \"ahmed@email.com\"\n    password: \"123456789\"\
