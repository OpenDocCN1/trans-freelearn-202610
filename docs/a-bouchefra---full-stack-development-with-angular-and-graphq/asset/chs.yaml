  \    width: 100%;\n    background-position: center;\n    background-repeat: no-repeat;\n\
  \    background-size: cover;\n    background-color:rgb(97, 76, 76);\n    position:\
  \ absolute;\n}\n```\n\n为了占据页面的整个宽度，我们将宽度设置为 100%，然后将高度设置为 10rem。随后将背景属性设置为位置居中，重复属性为不重复。最重要的是，我们将\
  \ background-size 属性设置为 cover 并使用绝对定位。\n\n查看 https://developer.mozilla.org/en-US/docs/Web/CSS/CSS_Backgrounds_and_Borders/Resizing_background_images。\n\
  \n3. 添加用户图像的以下样式：\n\n```css\n.profile-image {\n  width: 9rem;\n  height: 9rem;\n\
  \  clip-path: circle(60px at center);\n  background-color: gray;\n  border-width:\
