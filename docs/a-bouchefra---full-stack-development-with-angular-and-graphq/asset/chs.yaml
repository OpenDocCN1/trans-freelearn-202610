  \n查看此链接获取更新：https://git.io/JohPJ。\n\n\n\n## 测试认证守卫\n\n让我们编写 auth guard 测试。我们将编写一些测试来断言守卫会根据用户的认证状态适当地重定向用户。如果用户已登录，我们的守卫会使用\
  \ auth service 来确定他们是否已登录；否则，它会使用 router 的 parseUrl() 方法将他们重定向到登录路径。\n\n为了确保我们的实现按预期工作，我们需要添加一个隔离的单元测试套件。因此，我们必须定义\
  \ auth service 的一个存根，供 auth guard 使用以确定用户是否已通过身份验证。我们还将为 parseUrl() 方法定义一个间谍对象。按以下步骤操作：\n\
  \n- 1. 打开 core/guards/auth/auth.guard.spec.ts 文件并开始通过包含以下导入来配置测试：\n\n```\nimport\
  \ { TestBed }\n  from '@angular/core/testing';\nimport {\n  ActivatedRouteSnapshot,\n\
  \  Router,\n  RouterStateSnapshot,\n  UrlTree } from '@angular/router';\nimport\
  \ { Observable, of } from 'rxjs';\nimport { AuthService }\n  from '../../services/auth/auth.service';\n\
  ```\n\n然后，添加以下用于模拟 auth service 的类：\n\n```\nclass AuthServiceMock {\n  get isLoggedIn():\
  \ Observable<boolean> {\n    return of(true);\n  }\n}\n```\n\n我们使用 of() 函数返回一个同步的\
  \ Observable，该 Observable 为身份验证状态发出 true 值。\n\n- 2. 接下来，我们需要通过定义这些变量来扩展我们的 describe()\
  \ 块：\n\n```\nlet router: Partial<Router>;\nlet authService: Partial<AuthService>;\n\
  let routerStateSnapshot: RouterStateSnapshot;\nlet activatedRouteSnapshot: ActivatedRouteSnapshot;\n\
  ```\n\n- 3. 在 beforeEach() 函数内部，我们必须通过向 TestBed. configureTestingModule({}) 调用添加以下\
  \ providers 来配置测试模块：\n\n```\nproviders: [\n  {\n    provide: Router,\n    useValue:\
  \ {\n      parseUrl: jasmine.createSpy('navigate')\n    }\n  },\n  {\n    provide:\
  \ AuthService,\n    useClass: AuthServiceMock\n  },\n]\n```\n\n- 4. 接下来，按如下方式注入\
  \ router 和 auth 服务：\n\n```\nrouter = TestBed.inject(Router);\nauthService = TestBed.inject(AuthService);\n\
  ```\n\n然后，按如下方式创建虚拟对象：\n\n```\nrouterStateSnapshot = { url: '/feed' } as RouterStateSnapshot;\n\
  activatedRouteSnapshot = {} as ActivatedRouteSnapshot;\n```\n\n而不是使用完整对象，我们只设置测试所需的最小属性。CanActivate\
