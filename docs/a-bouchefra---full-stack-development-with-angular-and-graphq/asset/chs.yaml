  \ 你应该收到包含用户信息的 token。 参数和响应中的电子邮件应相同，而返回的密码应为哈希。\n\n如果你提供错误的电子邮件或密码与用户注册密码不匹配，你应该会收到相应的\
  \ No user found with this email! 或 Incorrect password! 错误消息。\n\n这是我们收到的响应的一个示例：\n\
  \n![](img/c798729e4c42765fcb1c98950164d0ba_114_0.png)\n\n图 4.2 – signIn mutation\
  \ 的响应\n\n我们已使用 JWT 创建了用于注册和登录用户的 mutations。 接下来，我们将了解如何使用生成的 JWT 与 Apollo 保护 GraphQL\
  \ 端点。\n\n## 保护 GraphQL 查询和变更\n\n在实现用于注册和登录用户的 GraphQL mutations 之后，我们需要使用在用户注册或登录时获得的\
  \ JWT token 来保护其他查询和 mutations。\n\n在用户身份验证后，服务器会将 JWT token 传输给客户端，客户端应将其本地存储并在每次请求中使用\
  \ HTTP 头（授权头）将其传回。\n\n我们可以使用 Apollo Server 的 context 选项从请求对象访问授权头并将此数据传递给 resolvers。\
  \ context 在每个 resolver 中都可用。\n\n保护我们的 GraphQL API 所需的步骤如下：\n\n- 1. 打开 server/src/index.ts\
  \ 文件并添加以下代码：\n- 2. 添加以下方法，该方法将使用来自 jsonwebtoken 的 verify() 方法和密钥来验证并从 JWT 中检索用户信息：\n\
  \n```js\nimport jwt from 'jsonwebtoken'\nimport dotenv from 'dotenv';\ndotenv.config();\n\
  const { JWT_SECRET } = process.env;\n```\n\n我们导入必要的符号并从 process.env 对象检索 JWT_SECRET\
  \ 环境变量（使用 dotenv 在运行时从 .env 文件加载）。 这将使我们能够从 .env 文件获取 JWT 密钥。 查看 https://nodejs.dev/learn/how-to-read-environment-variables-from-nodejs\
  \ 了解有关如何在 Node.js 中读取环境变量的更多详细信息。\n\n```js\nconst getAuthUser = (token: string)\
  \ => {\n  try {\n    if (token) {\n      return jwt.verify(token, JWT_SECRET as\
  \ string);\n    }\n    return null;\n  } catch (error) {\n    return null;\n  }\n\
  }\n```\n\n接下来，我们需要在允许用户访问受保护的端点之前确认用户的身份。\n\n- 3. 按如下方式更新 Context 类型：\n\n```ts\n\
  export type Context = {\n  orm: {\n    userRepository: Repository<User>;\n    postRepository:\
  \ Repository<Post>;\n    commentRepository: Repository<Comment>;\n    likeRepository:\
  \ Repository<Like>;\n    notificationRepository: Repository<Notification>;\n  };\n\
  \  authUser: User | null;\n};\n```\n\n- 4. 按如下方式修改引导 Apollo Server 的代码：\n\n```ts\n\
  const server: ApolloServer = new ApolloServer({ schema,\n  context: ({req}) => {\n\
  \    const token = req.get('Authorization') || '';\n    const authUser = getAuthUser(token.split('\
  \ ')[1]);\n    const ctx: Context = {\n      orm: {\n        userRepository: userRepository,\n\
  \        postRepository: postRepository,\n        commentRepository: commentRepository,\n\
  \        likeRepository: likeRepository,\n        notificationRepository: notificationRepository\n\
  \      },\n      authUser: authUser\n    };\n    return ctx;\n  }\n});\n```\n\n\
  在 context 函数中，我们调用请求对象的 get() 方法来检索授权头的值，该值应包含 \"JWT: \" 字符串加上 token。 接下来，我们使用空格分割该值并将第二部分（包含实际\
  \ JWT）传递给我们的 getAuthUser() 函数，以解码 token 并获取用户信息，即用户的 ID 和电子邮件。 然后，我们创建一个 ctx 对象（使用\
  \ Context 类型）并带有 authUser 和包含 TypeORM 仓库的 orm 对象。\n\n请注意，我们已将 context 对象的创建从外部移至\
  \ Apollo Server 的 context 方法内部，因此你必须删除在引导 Apollo Server 调用正上方存在的用于创建实例的先前代码。 查看此\
  \ GitHub 提交以了解我们所做的更新： https://git.io/JgCgO。\n\n在实现此功能后，如果 JWT 与对我们 GraphQL API\
  \ 的任何请求一起发送回来，我们将能够从任何 resolver 函数的 context 参数访问已登录用户的 ID 和电子邮件。\n\n- 5. 之后，你可以进入\
  \ server/src/graphql/resolvers.ts 文件并通过添加以下内容修改需要保护的每个 resolver：\n\n```ts\ngetUser:\
  \ async (_, args, { orm, authUser }) => {\n  if (!authUser) throw new Error('Not\
  \ authenticated!');\n  // [...] \n}\n```\n\n我们解构传递给函数的 context 参数以获取包含已验证用户信息 authUser\
  \ 对象的对象。 然后，我们检查该对象是否不为 null；否则，我们抛出一个错误，消息为 Not authenticated!。\n\n这将确保每个 resolver\
  \ 都能防止未经过身份验证的用户访问。\n\n更好的解决方案是使用指令，因此让我们看看如何实现这种第二种方法。 我们将实现一个 @auth 指令，可以将其应用于模式中的查询和\
  \ mutation 字段，以在用户完成操作之前检查用户是否已通过身份验证：\n\n- 1. 打开 server/src/graphql/schema.ts 文件并导入以下符号：\n\
  \n```ts\nimport { defaultFieldResolver } from 'graphql';\nimport { getDirective,\
  \ MapperKind, mapSchema } from '@\n```\n\n```js\nimport { mapSchema, getDirective,\
  \ MapperKind } from 'graphql-tools/utils';\nimport { ApolloError } from 'apollo-server-express';\n\
  ```\n\n- 2. Next, add the following function:\n```js\nfunction authDirective() {\n\
  \  return {\n    authDirectiveTypeDefs: gql`directive @auth on FIELD_DEFINITION`,\n\
  \    authDirectiveTransformer: (schema: GraphQLSchema) => mapSchema(schema, {})\n\
  \  };\n}\n```\n\n- 3. Next, add the following code to the second parameter of the\
