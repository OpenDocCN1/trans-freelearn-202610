  \ await orm.userRepository.findOne(authUser?.id)\n  } as CommentEntity);\n\n  const\
  \ savedComment = await orm.commentRepository.save(comment);\n  await orm.postRepository.update(args.postId,\
  \ {\n    commentsCount: savedComment.post.commentsCount + 1,\n    latestComment:\
  \ savedComment\n  });\n  savedComment.post = await orm.postRepository.findOne(args.postId)\
  \ as PostEntity;\n  return savedComment as unknown as Comment;\n}\n```\n\n- 12.\
