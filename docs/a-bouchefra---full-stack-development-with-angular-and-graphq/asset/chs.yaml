  \n用户可以使用 header 中的搜索栏查找在我们的应用程序中创建了账户的其他用户。输入搜索词并点击搜索按钮后，将创建并显示一个对话框组件。\n\n在本节中，我们将了解如何制作以下屏幕截图中显示的搜索对话框组件：\n\
  \n![](img/c798729e4c42765fcb1c98950164d0ba_216_0.png)\n\n图 7.6 – 搜索对话框组件\n\n- 1.\
  \ 进入 core/components/ 文件夹中的 search-dialog/search-dialog.component.ts 文件，并开始添加以下导入：\n\
  \n```ts\nimport {\n  Component,\n  Inject,\n  OnInit,\n  OnDestroy\n} from '@angular/core';\n\
  import { Router } from '@angular/router';\nimport { Subscription } from 'rxjs';\n\
  import {\n  MatDialogRef,\n  MAT_DIALOG_DATA\n} from '@angular/material/dialog';\n\
  import {\n  User,\n  SearchUsersResponse,\n  UsersResponse } from 'src/app/shared';\n\
  ```\n\n- 2. 向组件的类添加以下属性：\n\n```ts\nusersSubscription: Subscription | null = null;\n\
  users: User[] = [];\nfetchMore: (feed: User[]) => void = () => {};\n```\n\n接下来，按如下方式更新构造函数：\n\
  \n```ts\nconstructor(\n  public dialogRef:\n    MatDialogRef<SearchDialogComponent>,\n\
  \  @Inject(MAT_DIALOG_DATA) public response:\n    SearchUsersResponse,\n  public\
  \ router: Router) { }\n```\n\n- 3. 按如下方式更新 ngOnInit() 方法：\n\n```ts\nngOnInit():\
  \ void {\n  this.usersSubscription =\n    this.response.data.subscribe({\n     \
  \ next: (data: UsersResponse | null | undefined) => {\n        if (data?.searchUsers)\
  \ {\n          this.users = data.searchUsers;\n        }\n      }\n    });\n  this.fetchMore\
  \ = this.response.fetchMore;\n}\n```\n\n- 4. 按如下方式添加 ngOnDestroy() 方法：\n\n```ts\n\
  ngOnDestroy(): void {\n  if (this.usersSubscription) {\n    this.usersSubscription.unsubscribe();\n\
  \  }\n}\n```\n\n- 5. 向组件添加以下辅助方法，这些方法将从模板中调用：\n\n```ts\ngoToProfile(profileId: string):\
  \ void {\n    this.router.navigateByUrl(`/users/profile/${profileId}`);\n}\ninvokeFetchMore():\
  \ void {\n    this.fetchMore(this.users);\n}\nclose(): void {\n    this.dialogRef.close();\n\
  }\n```\n\n- 6. 接下来，打开 core/components/ 文件夹中的 search-dialog/search-dialog.component.html\
  \ 文件并添加以下内容：\n\n```html\n<h2 mat-dialog-title>Users</h2>\n<mat-dialog-content>\n\
  <!-- [...] -->\n</mat-dialog-content>\n<mat-dialog-actions>\n<button class=\"mat-raised-button\"\
  \ (click)=\"close()\">Close</button>\n<button class=\"mat-raised-button\" (click)=\"\
  invokeFetchMore()\">More...</button>\n</mat-dialog-actions>\n```\n\n然后，在对话框的内容部分中，遍历用户并使用\
  \ Material 卡片显示每个用户：\n\n```html\n<mat-card *ngFor=\"let user of users;\">\n    <mat-card-header>\n\
  \        <img mat-card-avatar [src]=\"user.image?? ''\" />\n        <mat-card-title>\n\
  \            {{ user.fullName }}\n        </mat-card-title>\n        <mat-card-subtitle>\n\
  \            {{ user.username }}\n        </mat-card-subtitle>\n        <button\
  \ mat-button (click)=\"goToProfile(user.id)\">Visit</button>\n</mat-card-subtitle>\n\
  </mat-card-header>\n</mat-card>\n```\n\n我们已经完成了注册和登录界面，这将允许用户注册和登录。然后，我们构建了 header\
  \ 和 footer 组件。Header 包含应用程序的导航按钮，这些按钮根据用户是否已通过身份验证有条件地呈现。如果用户未登录，我们只显示将用户带到登录组件的按钮。\n\
  \nHeader 还包括一个搜索栏，允许用户搜索社交网络中的其他用户，并在 Material Design 风格的对话框组件上显示结果。\n\n## 摘要\n\n\
  在本章中，我们看到了如何使用 Apollo Client 向我们之前实现的后端 API 发送查询和变更。我们将 Apollo 与 Angular 前端集成，然后为用户身份验证实现所需服务和组件。\n\
  \n我们还向应用程序 header 添加了功能，以允许用户在页面之间导航，例如个人资料、主页信息流和登录页面。我们使用条件渲染根据用户的身份验证状态仅显示必要的按钮。我们添加了必要的功能，允许用户使用\
  \ header 中的搜索栏搜索网络上的其他用户。然后，结果显示在包含分页和关闭按钮的对话框组件中。\n\n在下一章中，我们将继续改进我们的身份验证系统并添加单元测试以确保我们的代码按预期工作。\n\
  \n## 8 保护路由和测试身份验证\n\n## 保护路由和测试身份验证\n\n在上一章中，我们看到了如何使用 Apollo Client 向我们之前实现的后端\
  \ **API** 发送查询和变更。我们将 Apollo 与 Angular 前端集成，然后为用户 **authentication** 实现所需服务和组件。\n\
  \n我们还向应用程序 header 添加了功能，以允许用户在个人资料、主页信息流和登录页面等页面之间导航。我们添加了必要的功能，允许用户使用 header 中的搜索栏搜索网络上的其他用户。\n\
  \n在本章中，我们将通过保护必要的路由免受未经授权的访问、将 **JWT** 与 API 请求一起发送以及对代码进行单元测试来继续实现我们的 auth 系统。\n\
  \n本章将涵盖以下主题：\n\n- 保护路由\n- 测试 auth 服务和组件\n\n## 技术要求\n\n要成功完成本章的步骤，您必须首先完成本书的上一章。\n\
  \n您还应熟悉以下技术：\n\n- JavaScript/TypeScript。\n- HyperText Markup Language (HTML)。\n\
  - Cascading Style Sheets (CSS)。\n- Angular 测试——请查看 https://angular.io/guide/testing。\n\
  \n本章的源代码可在 https://github.com/PacktPublishing/Full-Stack-App-Development-with-Angular-and-GraphQL/tree/main/Chapter08\
  \ 找到。\n\n## 保护路由\n\n由于我们已经实现了 auth，因此我们需要保护应用程序的路由免受未通过身份验证的用户访问。\n\n并非所有页面都应受保护；例如，用户的个人资料页面可以设为公开，以便尚未拥有账户的用户可以通过搜索引擎找到其他用户。如果他们在网络上有朋友，这将鼓励他们注册账户。\n\
  \n让我们开始创建 auth guard，如下所示：\n\n- 1. 返回到您的 Terminal 并输入以下命令：\n- 2. 打开 core/guards/auth/auth.guard.ts\
  \ 文件并开始导入 auth 服务和 Router，如下所示：\n\n```\nng g guard core/guards/auth/auth\n```\n\n\
  您将被提示 Which interfaces would you like to implement?。\n\n按空格键选择 CanActivate，然后按 Enter\
  \ 确认。\n\n```ts\nimport { ActivatedRouteSnapshot, CanActivate, Router, RouterStateSnapshot,\
  \ UrlTree } from '@angular/router';\nimport { AuthService } from '../../services/auth/auth.service';\n\
  ```\n\n- 3. 通过 guard 类的构造函数注入 auth 服务和 Router，如下所示：\n\n```ts\nconstructor(\n   \
  \ private authService: AuthService,\n    private router: Router) {}\n```\n\n- 4.\
  \ 接下来，按如下方式更新 auth guard 的 canActivate() 方法：\n\n```ts\ncanActivate(\n    route:\
  \ ActivatedRouteSnapshot,\n    state: RouterStateSnapshot): Observable<boolean |\
  \ UrlTree> | Promise<boolean | UrlTree> | boolean | UrlTree {\n        if (this.authService.isLoggedIn)\
  \ {\n            return true;\n        }\n        else {\n            return this.router.parseUrl\n\
  \                (\"/users/login\");\n        }\n    }\n```\n\n在 guard 的 canActivate()\
  \ 方法中，该方法将被调用以确定路由是否可以被激活，我们使用注入的 auth 服务的 isLoggedIn 属性来确定当前用户是否已登录；如果是，我们返回 true。否则，我们使用\
  \ router 的 parseUrl() 方法将用户重定向到登录组件。此方法返回一个 UrlTree 对象，它只不过是一个解析的 Uniform Resource\
  \ Locator (URL)。\n\n我们通过返回 /users/login URL 的 URL 树结构来告诉 Angular 将用户重定向到登录组件。\n\n\
  **Note**\n有关 UrlTree 的更多信息，请查看 https://angular.io/api/router/UrlTree。\n\n- 5. 按如下方式从\
  \ core/ 文件夹的 index.ts 文件导出 auth guard：\n\n```ts\nexport { AuthGuard } from './guards/auth/auth.guard';\n\
  ```\n\n- 6. 打开 src/app/app-routing.module.ts 文件并导入守卫：\n\n```\nimport { AuthGuard\
  \ } from 'src/app/core';\n```\n\n接下来，按如下方式更新 routes 数组中的 feed 路由：\n\n```\n{\n  path:\
  \ 'feed',\n  canActivate: [AuthGuard],\n  loadChildren: () =>\n    import('./feed/feed.module').then(m\
  \ =>\n      m.FeedModule)\n}\n```\n\n要应用我们刚刚创建的身份验证守卫，我们使用路由的 canActivate 选项。这可以保护\
  \ feed 模块的子路由免受未认证用户的访问。\n\n我们已为应用添加了身份验证并将 feed 路由从公开访问中保护起来。现在我们的应用用户可以创建账户、登录，并使用页眉区域的搜索输入框搜索其他网络用户（实际上，最后这个功能尚未完全实现）。\n\
  \n由于我们现在有两个应用，前端和后端，我们可以从 monorepo 项目的根目录运行以下命令来同时启动两者：\n\n```\nlerna run start\
  \ --stream\n```\n\n这将运行客户端和服务器包的 start 脚本。\n\n## 发送 JWT\n\n如果此时尝试搜索用户，你将收到用户未通过身份验证的错误。这是因为访问令牌必须随请求一起发送。\n\
  \n你可以这样做：\n\n- 1. 打开 src/app/graphql.module.ts 文件并首先添加以下高亮的导入：\n\n```\nimport {\
  \ ApolloClientOptions, from, InMemoryCache } from '@apollo/client/core';\nimport\
  \ { HttpLink } from 'apollo-angular/http';\nimport { setContext } from '@apollo/client/link/context';\n\
  import { HttpHeaders } from '@angular/common/http';\n```\n\n- 2. 按如下方式更新 createApollo()\
  \ 函数：\n\n```\nexport function createApollo(httpLink: HttpLink): ApolloClientOptions<any>\
  \ {\n    const accessToken =\n        localStorage.getItem('accessToken');\n   \
  \ const http = httpLink.create({ uri });\n    const setAuthorizationLink = setContext(()\
  \ => ({\n        headers: new HttpHeaders().set(\n            'Authorization', `Bearer\
  \ ${accessToken}`\n        )\n    }));\n    return {\n        link: from([setAuthorizationLink,\
  \ http]),\n        cache: new InMemoryCache(),\n    };\n}\n```\n\n更多详情，请查看 https://www.apollographql.com/docs/react/api/link/apollo-link-context/。\n\
  \n## 改进搜索功能（作业）\n\n作为作业，按如下方式更新页眉组件的 searchUsers() 方法代码：\n\n- 如果用户输入的搜索词为空，使用 Material\
  \ snack bar（导入并注入 MatSnackBar）显示 **请输入搜索词！** 的消息，之后应退出该方法。\n- 在打开对话框显示结果之前检查是否找到任何用户；否则，使用\
  \ snack bar 显示 **未找到与此搜索词匹配的用户！** 消息。\n\n此作业的源代码可在以下链接找到：https://git.io/Ja7WN。\n\
  \n## 使用 GraphQL 片段\n\n在本节中，我们将重构代码以利用另一个 GraphQL 功能：**GraphQL 片段**。\n\n多个查询和变更使用了我们在多个\
  \ GraphQL 文档中使用的相同用户字段。使用片段，我们可以避免重复这些字段。\n\n首先重构我们的查询以使用 GraphQL 片段。片段允许你定义一组字段，可以在多个查询中重复使用，而无需重复相同的内容。\n\
  \n要重构现有查询以使用片段，请按照以下步骤操作：\n\n- 1. 创建 shared/constants/user.fragments.ts 文件并添加以下内容：\n\
  \n```\nimport { gql } from 'apollo-angular';\n\nexport const BASIC_USER_FIELDS_FRAGMENT\
  \ = gql`\nfragment BasicUserFields on User {\n  id fullName bio username image\n\
  }`;\nexport const USER_FIELDS_FRAGMENT = gql`\nfragment UserFields on User {\n \
  \ id fullName bio email username image coverImage\n  postsCount createdAt\n}`;\n\
  ```\n\n- 2. 接下来，让我们更新查询字符串以在其选择集中使用之前的片段，以便减少查询间共享的重复字段。打开 shared/constants/auth.ts\
  \ 文件并首先导入以下片段：\n\n```\nimport { USER_FIELDS_FRAGMENT } from\n  './user.fragments';\n\
  ```\n\n- 3. 然后，按如下方式更新 LOGIN_MUTATION 文档：\n\n```\nexport const LOGIN_MUTATION =\
  \ gql`\n${USER_FIELDS_FRAGMENT}\nmutation signIn($email: String!, $password: String!)\
  \ {\n  signIn(email:$email, password:$password) {\n    token, user { ...UserFields\
  \ }\n  }\n}\n`;\n```\n\n- 4. 最后，按如下方式更新 REGISTER_MUTATION 文档：\n\n```\nexport const\
  \ REGISTER_MUTATION = gql`\n${USER_FIELDS_FRAGMENT}\nmutation register($fullName:\
  \ String!, $username:\n    String!, $email: String!, $password: String!){\n    register(fullName:$fullName,\
  \ username:$username,\n        email:$email, password:$password){\n        token,\
  \ user { ...UserFields }\n    }\n}\n`;\n```\n\n作为作业，使用 UserFields 和 BasicUserFields\
  \ 片段更新 shared/constants/user.ts 文件中的文档。\n\n## 使用 Apollo Client 进行本地状态管理\n\n在本节中，我们将了解如何重构代码以使用\
  \ Apollo Client 内置的本地状态管理功能，例如仅本地字段、字段策略和响应式变量。\n\n响应式变量是在 Apollo Client 3 中引入的，是一种在\
  \ Apollo Client 缓存之外存储本地状态的便捷方式。它们可以保存任何类型和结构的信息，因为它们独立于缓存，并且你可以在应用程序的任何位置与它们交互，而无需使用\
  \ GraphQL 语法。\n\n> **注意**\n> 阅读 https://www.apollographql.com/docs/react/local-state/reactive-variables/\
  \ 以获取有关响应式变量的更多解释。\n\n仅本地字段只是那些在 GraphQL 服务器模式中未定义的字段。这些值是使用你想要的任何逻辑在本地计算的，例如从 localStorage\
  \ 读取数据。\n\n> **注意**\n> 阅读 https://www.apollographql.com/docs/react/local-state/managing-state-with-field-policies/。\n\
  \n字段策略定义了确定单个 GraphQL 字段如何从 Apollo Client 缓存获取和写入的自定义逻辑。字段策略可以为仅本地字段和远程获取的字段设置。\n\
  \n> **注意**\n> 请在继续之前阅读 https://www.apollographql.com/docs/react/caching/cache-field-behavior/。\n\
  \n我们使用 RxJS behavior subject 在 auth 服务中管理 auth 状态，这在 Angular 中是一种常见做法，但由于我们使用的是\
  \ Apollo Client，它也是一个状态管理工具，我们可以利用其缓存以及诸如仅本地字段和响应式变量等功能来管理 auth 状态，使缓存成为我们应用中唯一的\
  \ **事实来源**。\n\n让我们一步一步地来看如何重构代码，特别是 auth 服务和页眉组件，以使用 Apollo Client 缓存和响应式变量，如下所示：\n\
  \n- 1. 创建一个新的 `src/app/cache.ts` 文件并将创建内存缓存的代码移至其中，如下所示：\n\n```\nimport { InMemoryCache\
  \ } from '@apollo/client/core';\nexport default new InMemoryCache();\n```\n\n- 2.\
  \ 返回 `src/app/graphql.module.ts` 文件并按如下方式导入缓存：\n\n```\nimport cache from './cache';\n\
  ```\n\n然后，按如下方式修改 createApollo() 函数以使用导入的缓存：\n\n```\nexport function createApollo(httpLink:\
  \ HttpLink):\n  ApolloClientOptions<any> {\n  // [...] \n  return {\n    link: from([setAuthorizationLink,\
  \ http]),\n    cache: cache\n  };\n}\n```\n\n另外，请确保从此模块中删除未使用的 InMemoryCache 导入。\n\
  \n- 3. 创建 src/app/reactive.ts 文件并包含以下导入：\n\n```\nimport { makeVar } from '@apollo/client/cache';\n\
  import { gql } from '@apollo/client/core';\nimport { AuthState } from './shared';\n\
  ```\n\n接下来，使用 makeVar() 函数创建并导出一个名为 authState 的响应式变量，如下所示：\n\n```\nexport const\
  \ authState = makeVar<AuthState>(\n  {\n    accessToken: '',\n    currentUser: null,\n\
  \    isLoggedIn: false\n  } as AuthState\n);\n```\n\n这将使用提供的对象初始化我们的响应式变量，该对象应具有作为泛型类型传递给括号的\
  \ AuthState 接口的形状。\n\nmakeVar() 返回的函数可用于通过调用 authState() 获取变量的当前值，并通过调用 authState(newValue)\
  \ 设置新值。\n\n响应式变量的文档可在 https://apollo-angular.com/docs/local-state/reactive-variables/\
  \ 找到。\n\n- 4. 接下来，定义并导出以下客户端查询：\n\n```\nexport const GET_AUTH_STATE = gql`\n  query\
  \ getAuthState {\n    authState @client\n  }\n`;\n```\n\n\n\n我们使用 gql 标签创建一个 GraphQL\
  \ 文档，其中包含一个名为 getAuthState 的查询，该查询向 Apollo Client 请求名为 authState 的字段。我们使用 @client\
  \ 指令告知 Apollo Client 这是一个客户端查询，不应尝试向服务器发送请求。它将改为从其缓存中检索。\n\n- 5. 接下来，你需要使用字段策略将\
  \ authState 字段添加到缓存中的 Query 类型策略中。返回 src/app/cache.ts 文件并按如下方式导入响应式变量：\n\n```\n\
  import { authState } from './reactive';\n```\n\n然后，按如下方式通过为 Query 类型策略添加 authState\
  \ 的字段策略来更新内存缓存：\n\n```\nexport default new InMemoryCache({\n  typePolicies: {\n\
  \    Query: {\n      fields: {\n        authState: {\n          read() {\n     \
  \       return authState();\n          }\n        }\n      }\n    }\n  }\n});\n\
  ```\n\n当查询 authState 字段时，read() 函数会返回 authState 响应式变量的值。在我们的例子中，我们为字段和响应式变量使用了相同的名称，但这不是必需的。\n\
  \n为了提供控制如何在 Apollo Client 缓存中读取或写入相应 GraphQL 字段的逻辑，我们使用字段策略。字段策略可以为仅本地字段（附加 @client\
  \ 指令）或远程字段（从服务器获取）添加。\n\n> 注意\n> \n> 有关更多信息，请查看 https://apollo-angular.com/docs/local-state/management#field-policies-and-local-only-fields.\n\
  \n### 6. 打开 core/services/auth/auth.service.ts 文件并开始添加以下导入：\n\n```\nimport { ApolloQueryResult\
  \ } from '@apollo/client/core';\nimport { authState, GET_AUTH_STATE } from 'src/app/reactive';\n\
  ```\n\n然后，从服务的类中移除以下成员：\n\n```\nauthState: Observable<AuthState>;\nisLoggedInAsync:\
  \ Observable<boolean>;\nprivate readonly authSubject: BehaviorSubject<AuthState>;\n\
  ```\n\n接下来，在构造函数内部，移除以下代码：\n\n```\nthis.authSubject = new BehaviorSubject<AuthState>({\n\
  \  isLoggedIn: isLoggedIn,\n  currentUser: this.getLocalUser(),\n  accessToken:\
  \ localToken\n});\nthis.authState = this.authSubject.asObservable();\nthis.isLoggedInAsync\
  \ = this.authState.pipe(map(state => state.isLoggedIn));\n```\n\n然后，用以下代码替换它：\n\n\
  ```\nauthState({\n  isLoggedIn: isLoggedIn,\n  currentUser: this.getLocalUser(),\n\
  \  accessToken: localToken\n});\n```\n\n我们删除初始化 BehaviorSubject 以及保存 auth 状态的其他\
  \ Observable 的代码，并用代码替换它，该代码使用从浏览器 localStorage 检索到的初始 auth 状态初始化我们的响应式变量。\n\n你还应该删除未使用的\
  \ BehaviorSubject 符号的导入。\n\n### 7. 要获取 auth 状态，请定义以下属性：\n\n```\nget authState():\
  \ Observable<AuthState> {\n  return this.apollo.watchQuery<{ authState: AuthState\
  \ }>({\n    query: GET_AUTH_STATE\n  }).valueChanges.pipe(map((qr: ApolloQueryResult<{\
  \ authState: AuthState }>) => qr.data.authState));\n}\n```\n\n此外，对现有的 isLoggedIn\
  \ getter 做出以下更改：\n\n```\nget isLoggedIn(): Observable<boolean> {\n    return this.apollo.watchQuery<{\
  \ authState: AuthState }>({\n        query: GET_AUTH_STATE\n    }).valueChanges.pipe(map((qr:\
  \ ApolloQueryResult<{ authState: AuthState }>) =>\n        qr.data.authState.isLoggedIn));\n\
  }\n```\n\n然后，按如下方式更新现有的 authUser getter：\n\n```\nget authUser(): Observable<User\
  \ | null> {\n    return this.apollo.watchQuery<{ authState: AuthState }>({\n   \
  \     query: GET_AUTH_STATE\n    }).valueChanges.pipe(map((qr: ApolloQueryResult<{\
  \ authState: AuthState }>) =>\n        qr.data.authState.currentUser));\n}\n```\n\
  \n在所有这些 getter 属性中，我们调用 Apollo Client 的 watchQuery() 方法，将获取 auth 状态的客户端查询作为参数传递，以将查询发送到缓存，缓存将返回\
  \ authState 字段的结果。客户端将使用字段策略的 read() 函数返回结果，在我们的例子中，这是保存 auth 状态的响应式变量的值。\n\n###\
  \ 8. 通过删除发布行为主体新状态的代码并用调用来更新响应式变量的代码替换它，更新 private updateAuthState() 方法，如下所示：\n\n\
  ```\nprivate updateAuthState(token: string, user: User) {\n    this.storeToken(token);\n\
  \    this.storeUser(user);\n    authState({\n        isLoggedIn: true,\n       \
  \ currentUser: user,\n        accessToken: token\n    });\n}\n```\n\n然后，按如下方式更新\
  \ resetAuthState() 方法：\n\n```\nprivate resetAuthState() {\n  authState({\n    isLoggedIn:\
  \ false,\n    currentUser: null,\n    accessToken: null\n  });\n}\n```\n\n为了更新 auth\
  \ 状态，register()、login() 和 logOut() 方法会调用这些更新后的方法。我们不调用 subject 的 next() 方法来发布新的\
  \ auth 状态，而是使用 authState() 函数来更新包含本地 auth 状态的响应式变量。\n\n就是这样——我们已经完成了服务的重构；请参阅提交\
  \ https://git.io/JVyRO。\n\n现在，我们将按如下方式查看 auth guard 和 header 组件：\n\n- 1. 转到 core/guards/auth/auth.guard.ts\
  \ 文件并首先按如下方式导入 map() 操作符来更新 auth guard：\n\n```\nimport { map } from 'rxjs/operators';\n\
  ```\n\n然后，在 auth guard 的类中，按如下方式更新 canActivate() 方法：\n\n```\ncanActivate(\n  route:\
  \ ActivatedRouteSnapshot,\n  state: RouterStateSnapshot): Observable<boolean | UrlTree>\
  \ | Promise<boolean | UrlTree> | boolean | UrlTree {\n  return this.authService.isLoggedIn.pipe(\n\
  \    map((isLoggedIn: boolean) => {\n      if (isLoggedIn) {\n        return true;\n\
  \      }\n      return this.router.parseUrl('/users/login');\n    })\n  );\n}\n\
  ```\n\n而不是使用 behavior subject 的 getValue() 方法返回的同步（当前）值，我们的 auth guard 现在使用由更新后的\
  \ isLoggedIn 属性返回的 Observable 以及 router 的 parseUrl() 方法。\n\n- 2. 然后，你需要更新 header\
  \ 组件。打开 core/components/header/header.component.ts 文件并按如下方式开始添加必要的导入：\n\n按如下方式更新来自\
  \ @angular/core 的第一个导入语句以包含 OnDestroy 符号：\n\n```\nimport { Component, OnInit, ElementRef,\
  \ ViewChild, OnDestroy } from '@angular/core';\n```\n\n按如下方式更新来自 src/app/shared\
  \ 的导入以包含 AuthState：\n\n```\nimport { User, SearchUsersResponse, UsersResponse, AuthState\
  \ } from 'src/app/shared';\n```\n\n然后，按如下方式更新来自 rxjs/operators 的导入语句以包含 takeUntil\
  \ 符号：\n\n```\nimport { first, takeUntil } from 'rxjs/operators';\n```\n\n最后，按如下方式导入\
  \ Subject 符号：\n\n```\nimport { Subject } from 'rxjs';\n```\n\n- 3. 通过执行以下代码实现 OnDestroy\
  \ 接口：\n\n```\nexport class HeaderComponent implements OnInit, OnDestroy { /*...*/\
  \ }\n```\n\n接下来，向组件添加以下成员：\n\n```\npublic isLoggedIn: boolean = false;\npublic authUser:\
  \ User | null = null;\nprivate destroyNotifier$: Subject<boolean> = new Subject<boolean>();\n\
  ```\n\n为了避免内存泄漏，我们将使用 subject 在组件销毁时通知 takeUntil() 操作符，以便它可以完成其应用到的源 Observable。请阅读官方文档\
  \ https://rxjs.dev/api/operators/takeUntil。\n\n- 4. 按如下方式更新组件的 ngOnInit() 方法：\n\n\
  ```\nngOnInit(): void {\n  this.authService.authState\n  .pipe(takeUntil(this.destroyNotifier$))\n\
  \  .subscribe({\n    next: (authState: AuthState) => {\n      this.isLoggedIn =\
  \ authState.isLoggedIn;\n      this.authUser = authState.currentUser;\n    }\n \
  \ });\n}\n```\n\n我们订阅 authState 属性返回的 Observable，并提供一个观察者对象，其中包含 next() 处理程序，每当\
  \ Observable 发出值时就会调用它（在我们的例子中，这是存储在响应式变量中的 auth 状态）。\n\n为了避免内存泄漏，我们还使用 takeUntil()\
  \ 操作符在组件销毁时完成 Observable。\n\n然后，按如下方式添加 ngOnDestroy() 方法：\n\n```\nngOnDestroy():\
  \ void {\n  this.destroyNotifier$.next(true);\n  this.destroyNotifier$.complete();\n\
  }\n```\n\n当组件被销毁时，我们通过调用 subject 的 next() 方法来通知 takeUntil() 操作符，该方法发出 true 值，并且我们还完成通知\
  \ subject。\n\n\n\n5. 前往 core/components/header/header.component.html 文件，并将 *ngIf\
  \ 表达式* 从使用 authService.isLoggedIn 属性（该属性过去返回布尔值，现在返回 Observable）改为使用组件的 isLoggedIn\
  \ 属性。例如，搜索栏应按如下方式渲染：\n\n```\n<div *ngIf=\"isLoggedIn\">\n  <input class=\"searchbar\"\
  \ type=\"text\" placeholder=\"Search\" #searchInput matInput>\n  <button mat-icon-button\
  \ (click)=\"searchUsers()\">\n    <mat-icon>search</mat-icon>\n  </button>\n</div>\n\
  ```\n\n你还必须对右侧的按钮进行同样的操作以有条件地渲染它们。\n\n此外，对于将用户带到其个人资料的按钮，请将 {{ 和 }} 之间的插值表达式 authService.authUser?.id\
  \ 替换为仅 authUser?.id，如下所示：\n\n```\n<button *ngIf=\"isLoggedIn\" mat-icon-button\n\
  \  matTooltip=\"My profile\"\n  routerLink=\"/users/profile/{{authUser?.id}}\">\n\
  ```\n\n对于对头部组件所做的所有更新，请查看此提交：https://git.io/JVyW0。\n\n如果你在登录后检查 Apollo Client Devtools，你应该会看到一个活动的\
  \ getAuthState 查询，只要头部组件未被销毁，该查询就会保持活动状态，如以下屏幕截图所示：\n\n![](img/c798729e4c42765fcb1c98950164d0ba_236_0.png)\n\
  \n图 8.1 – Apollo Client Devtools 中的 getAuthState 查询\n\n## 使用 OnPush 变更检测策略\n\nAngular\
  \ 默认采用 ChangeDetectionStrategy.Default 策略。由于每次应用程序中发生事件（例如点击或网络响应）时，变更检测都会在所有组件上运行，因此该策略在性能方面并不是最高效的。为了避免不必要的变更检测运行，我们可以在某些组件上使用\
  \ OnPush 策略，如以下步骤所示：\n\n-   1. 前往 core/components/header/header.component.ts 文件并从\
  \ @angular/core 模块导入 ChangeDetectionStrategy 和 ChangeDetectorRef，如下所示：\n\n```\n\
  import { Component, OnInit, ElementRef, ViewChild,\n  OnDestroy, ChangeDetectionStrategy,\n\
  \  ChangeDetectorRef } from '@angular/core';\n```\n\n-   2. 将检测策略更改为 OnPush，如下所示：\n\
  \n```\n@Component({\n  selector: 'app-header',\n  templateUrl: './header.component.html',\n\
  \  styleUrls: ['./header.component.css'],\n  changeDetection: ChangeDetectionStrategy.OnPush\n\
  })\nexport class HeaderComponent implements OnInit,\n  OnDestroy {\n  /* [...] */\n\
  }\n```\n\n之后，你会注意到如果退出登录再重新登录，搜索栏和右侧的按钮将无法正确渲染。这是因为 Angular 没有运行变更检测来将视图与组件的更新变量——即\
  \ authUser 和 isLoggedIn 成员——同步。我们可以通过在认证状态发生变化时手动触发变更检测来修复这个问题。\n\n-   3. 将 ChangeDetectorRef\
  \ 注入到头部组件的构造函数中，如下所示：\n\n```\nconstructor(\n  /*...*/,\n  private changeDetectorRef:\
  \ ChangeDetectorRef) { }\n```\n\n4. 在头部组件的 ngOnInit() 方法中标记组件以进行检查，如下所示：\n\n```\n\
  ngOnInit(): void {\n    this.authService.authState\n    .pipe(takeUntil(this.destroyNotifier$))\n\
  \    .subscribe({\n        next: (authState: AuthState) => {\n            this.isLoggedIn\
  \ = authState.isLoggedIn;\n            this.authUser = authState.currentUser;\n\
  \            this.changeDetectorRef.markForCheck();\n        }\n    });\n}\n```\n\
  \n将 OnPush 检测策略用于页脚和页面未找到组件作为练习。更新和解决方案可以在此提交中找到：https://git.io/JV9zb。\n\n## 测试\
  \ auth 服务和组件\n\n在完成认证部分的实施之前，我们需要为实现添加自动测试，以检测在手动测试时可能遗漏的隐藏错误。\n\n当我们使用 Angular\
  \ 命令行界面（Angular CLI）生成项目时，我们还配置了测试，并添加了一些初始测试，以确保工件（例如组件和服务）能够正确实例化。\n\n如果你对 Angular\
  \ 测试不熟悉，请先阅读 https://angular.io/guide/testing 和 https://techiediaries.com/angular/jasmine-unit-testing，然后在\
  \ https://jasmine.github.io/tutorials/your_first_suite 学习如何编写你的第一个测试套件。\n\n此外，在测试\
  \ Apollo Client API 之前，请务必阅读官方测试文档 https://apollo-angular.com/docs/development-and-testing/testing/。\n\
  \nJasmine 包含一组 API，可简化单元测试的编写。我们基本上有以下三个选项：\n\n-   - describe() 函数用于定义一组测试。\n- \
  \  - it() 函数用于初始化单元测试/规范。\n-   - `expect()` 函数用于定义期望，以确保我们的代码按预期工作。\n\n当我们使用 Angular\
  \ CLI 生成工件（例如组件或服务）时，我们还会获得一个规范文件，其中包含工件的测试，以及一个检查工件是否已实例化的单元测试。\n\n### 测试认证服务\n\
  \n你的项目已准备好进行测试。你只需按照本节中的后续步骤操作即可。\n\n前往你的终端并输入以下命令：\n\n```\nng test\n```\n\nng test\
  \ 命令构建应用程序并以监视模式运行 Karma 测试运行器。有关更多信息，请访问 https://github.com/karma-runner/karma。该命令将运行我们的测试并打开一个网页浏览器，显示通过或失败的测试。此时，我们期望所有测试都通过，但事实并非如此。这是因为测试（而非代码）损坏了。\n\
  \n这是因为我们通过构造函数注入一些服务或向组件的 ngOnInit() 方法添加代码，修改了 Angular CLI 生成的默认项目代码。由于它们参与组件的创建，构造函数和\
  \ ngOnInit() 方法都会在现有的单元测试中被调用。\n\n让我们先在修复损坏的测试之前测试认证服务。如果你不熟悉服务测试，请阅读 https://angular.io/guide/testing-services\
  \ 以更好地理解这些步骤。\n\n我们服务的大多数方法遵循类似的模式——我们请求数据、处理错误并从响应中提取数据，因此它们应以大致相同的方式进行测试。\n\n\
  我们必须模拟/伪造响应，然后断言查询和变更是否按预期文档和变量被调用一次或多次，并且返回了模拟的响应数据。按如下方式进行：\n\n-   1. 返回你的终端并仅运行认证服务的测试，使用以下命令从\
  \ client/ 文件夹执行：\n\n```\nng test --include src/app/core/services/auth/auth.service.spec.ts\n\
  ```\n\n如你所见，现有的 *应被创建* 测试用例通过了；让我们再编写一些。打开 core/services/auth/auth.service.spec.ts\
  \ 文件并添加以下规范：\n\n```\nit('should register a user');\nit('should reset auth state\
  \ when registration fails on server');\nit('should authenticate a user');\nit('should\
  \ reset auth state when login fails on server');\nit('should store user and token\
  \ on updateAuthState call');\nit('should call localStorage.setItem on storeUser\
  \ call');\nit('should call localStorage.setItem on storeToken call');\nit('should\
  \ return the isLoggedIn state');\nit('should return the authenticated user state');\n\
  it('should return the full auth state');\nit('should log out users');\nit('should\
  \ search for users');\nit('should get user by ID');\n```\n\n如果你在实现实际测试逻辑之前查看 Karma\
  \ 报告，你会看到在 it() 函数的第二个参数中，你的规范被标记为待定，如以下屏幕截图所示：\n\n![](img/c798729e4c42765fcb1c98950164d0ba_240_0.png)\n\
  \n图 8.2 – 认证服务的待定测试\n\n我们将使用 apollo-angular/testing 模块，其中包含 ApolloTestingModule\
  \ 和 ApolloTestingController，以便通过模拟对 GraphQL 端点的调用来简化调用 Apollo Client API 的代码测试。\n\
  \n2. 首先包含以下导入：\n\n```\nimport {\n    ApolloTestingController,\n    ApolloTestingModule\n\
  } from 'apollo-angular/testing';\nimport {\n    AuthResponse,\n    RegisterResponse,\n\
