  ```\n\n- 2. Add the following two public properties to the header component:\n\n\
  ```\n@ViewChild('searchInput') searchInput: ElementRef | null = null;\nfetchMore:\
  \ (users: User[]) => void = (users: User[]) => { };\n```\n\nTo access the corresponding\
  \ input element, referenced by the searchInput reference in the template, where\
  \ users can enter the term for searching for other users in our application, we\
