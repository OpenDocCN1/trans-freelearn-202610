- '# 第 1 部分：设置开发环境、GraphQL 服务器和数据库


  在本部分，我们将了解应用程序的架构和需求，并为全栈开发设置开发环境。我们还将使用 Express.js 和 Apollo 设置 GraphQL 服务器，并使用
  TypeORM 连接 SQL 数据库以存储应用程序数据。


  本节包含以下章节：


  - 第 1 章，应用程序架构和开发环境

  - 第 2 章，使用 Node.js、Express.js 和 Apollo 设置 GraphQL

  - 第 3 章，使用 TypeORM 连接数据库

  - 第 4 章，使用 Apollo Server 实现身份验证和图像上传

  - 第 5 章，使用 Apollo Server 添加实时支持

  '
- "## 1 应用程序架构和开发环境\n\n在本书中，我们将开发一个全栈 Web 应用程序，使用 **Angular** 前端、**Node.js** 后端和 **MySQL**\
  \ 数据库。\n\n因此，在本章中，我们将了解项目的结构以及开发应用程序所需的工具。之后，我们的机器将准备好进行开发。具体来说，我们将安装 Node.js 以及\
  \ npm 和 MySQL。\n\nNode.js 对于后端应用程序是必需的，该应用程序运行一个服务器，使用 Express.js（最受欢迎的 Node 框架之一）公开\
  \ GraphQL API。Node.js 对于前端应用程序的开发也是必要的。这是因为 Angular 使用官方命令行界面来初始化项目，并在应用程序开发期间生成所需的任何构件。\n\
  \nMySQL 将用于存储我们的数据，但它在代码中不会直接访问。相反，我们将使用名为 **TypeORM** 的 ORM。\n\n在本章中，我们将涵盖以下主题：\n\
  \n- 项目的架构和开发技术\n- 安装 MySQL\n- 安装和配置 Node.js\n\n### 技术要求\n\n本章需要一台配备操作系统和互联网连接的计算机。由于我使用的是\
  \ Ubuntu 系统，本书中的说明将特定于该系统。它们也应该在基于 Debian 的任何其他系统上运行。\n\n### 架构和技术\n\n在本节中，我们将了解应用程序的架构以及在本书中用于开发应用程序前端和后端的各种技术。\n\
  \n让我们先熟悉 **full stack** 架构和 **monorepo** 仓库（也称为 **mono-repositories**）的概念。\n\n###\
  \ 全栈架构\n\n我们将开发一个包含前端和后端的 Web 应用程序，也称为 **full stack application**。这意味着我们将承担全栈开发者的工作。\n\
  \n全栈开发者是一名 Web 开发者，能够处理 Web 开发项目的前端（客户端）和后端（服务器端）部分的开发。\n\n他们必须精通 HTML、JavaScript\
  \ 和 CSS 等基本技术，并对 TypeScript、Node.js 以及 MySQL 等数据库管理系统等技术有所了解。这些技术大致可分为两类：\n\n- 用于开发基于浏览器的应用程序的客户端语言、框架和工具，包括\
  \ HTML、CSS、JavaScript、TypeScript 和 Angular。\n- 服务器端语言和工具，如 Node.js、Python 或 PHP，以及数据库语言，如\
  \ SQL。\n\n要构建我们的全栈应用程序，我们需要两个部分：\n\n- **前端**：这是运行在客户端机器的 Web 浏览器中的应用程序。历史上，这通过在服务器上渲染\
  \ HTML 页面然后返回给客户端来实现。然而，浏览器现在可以运行功能齐全的 JavaScript 应用程序（也称为 **client-side apps**），它们在客户端浏览器上完成大部分处理，仅依赖服务器提供应用程序的初始文件和数据。简单来说，前端是向用户展示用户界面的部分，用户通过它进行交互。\n\
  - **后端**：这是服务器端应用程序，将处理 HTTP 请求，执行一些处理逻辑，并向浏览器返回响应（HTML 和/或 JSON 数据）。\n\n我们将使用 Lerna\
  \ 等工具，采用 monorepo 方法来组织应用程序的代码。在软件开发的上下文中，monorepo 仅指使用单个源代码仓库（通常使用 Git 进行版本控制）来管理所有应用程序（服务器、客户端和任何共享库）。\n\
  \n让我们从高层次来看我们的应用程序将如何交付到客户端机器上：\n\n1. 首先，客户端将在浏览器地址栏中输入应用程序域名以发出请求。\n2. 服务器将拦截请求并处理包含\
  \ Angular 应用的 HTML 文档。\n3. 客户端浏览器将开始下载运行 Angular 应用程序所需的所有 JavaScript 和 CSS 文件。\n\
  4. Angular 应用程序将发送对服务器的任何初始数据请求，例如帖子，并在用户界面中渲染。\n5. 用户开始与应用程序交互后，将向服务器发出其他请求。\n\n\
  此过程提供了应用程序运行方式的高层次概述。我们将在下一章中更深入地探讨这些阶段。\n\n在快速讨论了全栈和 monorepo 概念之后，让我们看看我们将用于构建应用程序的技术和工具。\n\
  \n### 开发技术\n\n每个项目都需要使用一套技术和工具。这包括编程语言、命令行界面、库和框架。在我们的全栈项目中，我们将为前端和后端开发使用多种技术。\n\
  \n如今，现代开发涉及在前端和后端使用相同的工具。让我们更详细地了解这些技术和工具。\n\n我们将使用 Angular 的最新版本（撰写时为版本 12）作为前端，Node.js\
  \ 作为后端，以及一套支持库，包括 Express.js 用于启动 Web 服务器和 TypeORM 用于抽象数据库操作。\n\n本书的主要目标之一是构建一个\
  \ GraphQL API，该 API 将由我们的 Express.js 服务器提供，并被我们的 Angular 前端消费。为了抽象运行 Web 服务器所需的所有低级\
  \ API，我们将在 Node.js 之上使用 Express.js。\n\nWeb 服务器将监听来自客户端浏览器的传入 HTTP 请求，这些请求主要是用于获取数据的\
  \ GraphQL 查询和用于创建和更新数据的 mutation。\n\n接下来，我们将了解 Node.js 及其用途。\n\n### 使用 Node.js 在服务器上运行\
  \ JavaScript\n\nNode.js 到底是什么？Node.js 是一个免费的开源平台和运行时环境，允许您在服务器上运行 JavaScript，并采用事件驱动、非阻塞输入/输出（I/O）架构。Ryan\
  \ Dahl 于 2009 年在 Google Chrome 的 JavaScript 引擎（V8 引擎）之上创建了 Node.js。\n\n如果您是一名经验丰富的\
  \ JavaScript 开发者，您可能熟悉 JavaScript 作为一种用于创建只能在客户端浏览器中执行的动态网页的编程语言。然而，得益于 Node.js，我们现在可以使用\
  \ JavaScript 在客户端（通过浏览器）和服务器上构建 Web 应用。\n\n正如您所期望的，开发者现在可以使用单一编程语言创建完整全栈 Web 应用程序，而无需为服务器使用不同的语言，例如\
  \ PHP 或 Python，它们只是众多可用选项中的两个。Node.js 与这些语言一样，可用于开发 Web 应用程序的后端。\n\n这使得前端 JavaScript\
  \ 开发者无需学习新语言即可开始开发后端应用。\n\n\n\nNode.js 的用途远不止于服务端应用；它是一种通用工具，可用于构建各种网络应用，以及在开发者的机器上构建和运行前端桌面工具。例如，Angular\
  \ CLI 就是一个基于 Node.js 的工具，我们将使用它来开发和操作我们的前端 Angular 项目。\n\n> **重要提示**\n> 因为 Node.js\
  \ 是一个 JavaScript 运行时，因此它也可以与 TypeScript 配合使用，TypeScript 是包含面向对象编程原则和静态类型检查的 JavaScript\
  \ 超集。在本书中，我们将利用 Node.js 和 TypeScript 来开发后端。\n\n## 使用 npm 安装包\n\nNode.js 拥有庞大的生态系统以及一个名为节点包管理器（npm）的包管理工具。它可用于从一个中央注册表中快速安装包，该注册表包含成千上万由其他组织和开发者构建并发布以解决常见开发问题的包。\n\
  \n得益于庞大的生态系统和 npm 注册表，在尝试解决其他开发者之前已经遇到过的相同开发难题时，你无需重复造轮子。npm 注册表还使使用单个命令安装任何包或库变得简单，包括\
  \ Angular 和 Express.js 等知名库。\n\n在我们前端和后端项目中，我们都将使用 npm 来安装必要的工具和库，例如 Angular、Apollo\
  \ 和 Express.js 等。\n\n## 使用 Express.js 运行 Web 服务器\n\n如前所述，Node.js 是一个平台和运行时环境，它公开了一组我们在构建\
  \ Web 应用时很少直接使用的低级 API。与其开发大量复杂的代码或重复造轮子，我们将利用其他开发者创建的某些库。Express.js，如我们之前所述，就是其中之一。那么它到底是什么？\n\
  \nExpress.js 是一个流行的 Node.js Web 应用框架，用于开发服务器应用。它无主观偏见、轻量级，并且包含开发 Web 应用和 Web API\
  \ 所需的所有基本功能。\n\nExpress.js 让你无需处理低级 Node.js API 即可创建接收 HTTP 请求并以 HTTP 响应响应的服务器。它还使实现路由、管理静态文件和提供资源变得简单。\n\
  \n> **提示**\n> 与 Python 中被认为有主见的流行框架 Django 不同，Express.js 是一个灵活的框架，不强制规定你应如何组织项目。\n\
  \n## GraphQL\n\n现在我们知道了 Node 是什么，并且将使用 Express.js 运行后端服务器，GraphQL 是什么，它在这个技术栈中处于什么位置？\n\
  \nGraphQL 与 SQL 类似；然而，它用于查询 Web API 而非数据库。它是一种 API 规范和查询语言。它还充当运行时，用于响应查询以获取、创建和更新数据。\n\
  \n> **重要提示**\n> GraphQL 是 REST 的一种更新替代方案，REST 被开发人员广泛用于创建可被桌面和移动客户端消费的 API。\n\n\
  Facebook 于 2015 年推出 GraphQL，以解决 REST 和其他 API 开发方法的一些不足。\n\n例如，使用 GraphQL，前端应用可以仅向服务器请求其所需的数据。这是因为\
  \ GraphQL 允许你使用由字符串和整数等基本内置类型构成的用户定义类型来描述数据的形式。\n\nGraphQL 可与多种网络协议一起使用，其中最常见的是\
  \ WebSocket 和 HTTP。\n\n如果你熟悉 SQL，你会认识到它与使用表来定义数据形式的方式相似。如果你熟悉面向对象语言，它也与你构建接口和类来描述现实世界对象的方式相似。\n\
  \n你可以发送类似 JSON 的对象查询，指定你希望服务器通过 HTTP 响应返回的字段。以下是一个查询示例：\n\n```\npost {\n  id\n \
  \ content\n  date\n}\n```\n\n如果将此查询提交给定义了带有 ID、content 和 date 属性的 post 类型的 GraphQL\
  \ 服务器，则相关帖子数据将使用 **解析器函数** 返回。\n\n解析器函数处理数据的解析，执行从数据库检索数据所需的逻辑，并将其返回给请求客户端。\n\n\
  如前所述，GraphQL 是一个标准，不受任何编程语言或框架的约束。许多流行的编程语言，如 Python 和 JavaScript，都有实现。\n\n它也不受任何数据库系统的约束，可以与包含\
  \ MySQL 或任何数据库管理系统作为数据库的任何技术栈一起使用。在我们的情况下，我们将与 MySQL 结合使用它。\n\n**Apollo** 是 GraphQL\
  \ 实现之一。那么它在我们的技术栈中处于什么位置？\n\n## 使用 Apollo 集成前端和后端\n\n我们将使用 Apollo，这是一种面向 JavaScript\
  \ 的行业标准 GraphQL 实现。它由客户端和服务器部分组成，分别称为 Apollo Client 和 Apollo Server。\n\nApollo Client\
  \ 与纯 JavaScript 以及最新的 UI 库和框架（如 React、Angular 和 Vue.js）兼容，而 Apollo Server 与常见的 Node.js\
  \ 框架（如 Express.js 和 Hapi）兼容。\n\n得益于 Apollo Client 和 Apollo Server，我们可以在应用程序的前端和后端之间简单轻松地交互，从而无需复杂的获取数据逻辑。\n\
  \n因此，在我们的 Angular 前端中，Apollo Client 将提供一个用于发送查询以获取数据以及用于向数据库添加、修改和删除数据的 mutation\
  \ 的层。Apollo Client 不直接与数据库交互，而是与运行在 Node.js 之上的 Apollo Server 和 Express.js 交互。\n\
  \n## 使用 TypeORM 和 MySQL 保存数据\n\n数据将保存在 MySQL 数据库中。在开发环境中，我们将使用本地安装的 MySQL 服务器，但在生产环境中，你可以使用云托管的关系数据库，例如\
  \ **亚马逊关系数据库服务 (Amazon RDS)** 或你选择的任何其他服务。\n\n我们选择 MySQL 作为数据库管理系统，因为它是世界上使用最广泛的开源关系数据库，这意味着大多数开发者都熟悉它，并且可能在之前的某个\
  \ Web 项目中使用过它。\n\n它在所有受支持的操作系统上本地安装非常容易。借助 Amazon RDS 和 DigitalOcean 等云服务，在生产环境中设置和扩展也非常简单。\n\
  \nAmazon RDS 提供免费套餐，超出后你将按需付费。它将帮助你专注于应用开发，而非数据库管理操作，如备份、监控、可扩展性和复制。\n\n我们将不会使用\
  \ SQL 直接构建表或查询数据。相反，我们将使用对象关系映射器（ORM）来创建数据库表并使用高级编程语言而不是 SQL 来查询、插入和删除数据。在我们的案例中，将使用基于\
  \ TypeScript 的 ORM TypeORM。\n\n现在我们已经介绍了后端最后一个主要组件——数据库，让我们来看看我们技术栈的另一个组件：Angular。\n\
  \n## 使用 TypeScript 和 Angular 构建前端\n\nGoogle 的 Angular 是一个开源客户端框架。它从头开始用 TypeScript\
  \ 创建，是基于纯 JavaScript 的 Angular.js 的替代品。Angular 与 React 和 Vue 一起，是三大最受欢迎的前端框架之一。它包含构建面向移动和桌面设备的现代前端\
  \ Web 应用所需的库。\n\n我们将使用官方 Angular CLI 以基本的文件结构创建项目，并使用模块、组件和服务等抽象来组织我们的客户端 TypeScript\
  \ 代码。\n\nAngular 开箱即带客户端路由器，允许我们在应用中添加路由和导航。当我们开始采用这些技术时，我们将在接下来的章节中更深入地介绍它们。\n\n\
  我们还将通过利用 Apollo Client 与 Angular 集成，将前端与基于 Apollo Server 构建的 GraphQL 服务器集成。\n\n\
  通过将所有这些工具结合起来，我们将拥有一个包含 Node.js、MySQL、Express.js、TypeORM、Apollo 和 Angular 的技术栈。\n\
  \n现在我们已经介绍了应用架构和技术，让我们开始在开发环境中安装 MySQL 和 Node.js。\n\n\n\n## 安装 MySQL\n\n在本节中，我们将学习如何在开发机器上安装\
  \ MySQL。 在计算机上安装 MySQL 的说明取决于您的操作系统，但在这里，我们将重点介绍 Ubuntu 的说明。\n\nMySQL 是一款流行的数据库管理系统，由于其安装和配置简单，也适用于本地开发。\n\
  \n安装过程很简单；只需更新系统的软件包索引，安装 mysql-server 软件包，然后执行随附的安全脚本即可。\n\nMySQL 可能已安装在您的开发机器上。如果是这样，您可以跳过此步骤。\n\
  \n> **重要说明**\n> 以下步骤仅用于在本地机器上为开发目的设置 MySQL。在生产环境中，您必须遵循适当的指南，尤其是在保护数据库免受攻击方面。您可以使用云服务轻松实现这一点，云服务提供托管数据库，您无需自行管理和保护。\n\
  \n现在，让我们通过运行安装 MySQL Server 的说明开始。打开一个新的命令行界面并运行以下命令：\n\n```\nsudo apt-get update\n\
  ```\n\n```\nsudo apt-get upgrade -y\n```\n\n这些说明将把系统的软件包索引更新到最新版本。\n\n然后，要安装 MySQL\
  \ Server，请使用以下命令：\n\n```\nsudo apt-get install mysql-server\n```\n\n现在我们已经安装了 MySQL\
  \ Server，让我们学习如何配置它。\n\n## 配置 MySQL Server\n\n安装 MySQL Server 后，您必须执行安全脚本。返回命令行界面并执行以下命令：\n\
  \n```\nsudo mysql_secure_installation\n```\n\n系统会提示您输入 root 用户密码；输入密码并按 Enter。\n\
  \n接下来，您将看到一系列问题。第一个问题将是 Would you like to set up VALIDATE PASSWORD plugin? 这用于验证密码并提高安全性。它评估密码的强度并帮助用户创建足够安全的密码。由于我们使用的是开发机器，这不是关键，因此回答\
  \ N 表示否。下一个问题将要求您为 MySQL root 用户创建密码。输入您选择的密码并确认。\n\n要为以下问题选择默认答案，只需输入 Y 然后按 Enter\
  \ 即可。\n\n- Remove anonymous users?\n- Disallow root login remotely?\n- Remove test\
  \ database and access to it?\n- Reload privilege tables now?\n\n这将删除一些匿名用户以及测试数据库及其访问权限，禁用远程\
  \ root 登录，并加载权限表以确保所有先前的修改立即生效。\n\n就是这样——完成了！您已成功在运行 Ubuntu 的本地开发机器上安装了 MySQL Server。接下来，您将学习如何验证\
  \ MySQL 是否正在运行，以及如果未运行如何启动它。\n\n## 测试 MySQL Server\n\n安装后 MySQL 应该已自动启动。返回命令行界面并执行以下命令：\n\
  \n```\nsystemctl status mysql.service\n```\n\n如果它正在运行，您会看到类似以下内容：\n\n```\nmysql.service\
  \ - MySQL Community Server\n  Loaded: loaded (/lib/systemd/system/mysql.service;\
  \ enabled; vendor preset: enabled\n  Active: active (running) since Tue 2020-12-08\
  \ 17:15:40 +01; 48min ago\nMain PID: 20416 (mysqld)\n  Tasks: 29\n  CGroup: /system.slice/mysql.service\n\
  \    └─20416 /usr/sbin/mysqld --daemonize --pid-file=/run/mysqld/mysqld.pid\n```\n\
  \n如果 MySQL Server 未运行，请使用以下命令启动它：\n\n```\nsudo systemctl start mysql\n```\n\n在我们安装\
  \ MySQL 并验证其正在运行后，我们将学习如何安装 Node.js，我们的前端和后端应用程序都需要它。\n\n## 安装和配置 Node.js\n\n在安装\
  \ MySQL 数据库管理系统后，我们需要安装 Node.js，因为它对于执行服务器代码是必要的。\n\n我们有几种在操作系统上安装 Node.js 的选项：\n\
  \n- Node Version Manager (NVM)，您可以使用它在开发系统上运行各种版本的 Node.js，获取有关可用版本的信息，并通过单个命令安装任何版本\n\
  - 操作系统的官方包管理器，例如 Ubuntu 的 APT、macOS 的 Homebrew 或 Windows 的 Chocolatey\n- 来自官方网站\
  \ https://nodejs.org/en/download/ 的二进制文件，它不仅提供 Windows、macOS 和 Linux 二进制文件，还提供可下载和编译的源代码\n\
  \n如前所述，我们假设您正在运行基于 Debian 的系统，例如 Ubuntu。在本章中，我们将教您如何在 Ubuntu 系统上使用第一种方法。\n\n> **重要说明**\n\
  > 如果您未使用 Ubuntu 或基于 Debian 的系统，请访问官方网站 https://nodejs.org/en/download/package-manager/\
  \ 并获取在您的操作系统上安装 Node.js 的必要说明。\n\n## 使用 nvm 安装 Node.js\n\n您可以使用 nvm 而不是系统的原生包管理器来安装\
  \ Node.js 和 npm。此实用程序不在系统级别运行。相反，它使用主目录中的一个单独文件夹。\n\n这使您可以同时安装多个版本的 Node.js，并在需要时快速在它们之间切换。此外，在安装\
  \ nvm 后，您可以使用单个命令快速安装任何版本的 Node.js，无论新旧。\n\n让我们回顾一下步骤：\n\n1. 返回您的命令行界面并运行以下命令以下载\
  \ nvm 安装脚本：\n\n```\ncurl -sL https://raw.githubusercontent.com/nvm-sh/nvm/v0.37.2/install.sh\n\
  ```\n\n2. 然后，使用以下命令执行脚本：\n\n```\nbash install.sh\n```\n\n此命令将在 ~/.nvm 文件夹下克隆 nvm\
  \ 仓库并根据需要更新 ~/.profile 文件。\n\n3. 要开始使用 nvm，只需 source 以下文件或注销然后重新登录即可：\n\n```\nsource\
  \ ~/.profile\n```\n\n4. 使用此命令，您可以快速检索可安装的可用 Node.js 版本列表：\n\n```\nnvm ls-remote\n\
  ```\n\n5. 我们在本书中使用 v12.22.1，您可以使用以下命令安装它：\n\n```\nnvm install v12.22.1\n```\n\n\
  这将下载与您的操作系统兼容的安装二进制文件并安装 Node.js 以及 npm。它还将使此版本成为默认版本。\n\n6. 要验证已安装的版本，请使用以下命令：\n\
  \n```\nnode -v\n```\n\n在我们的例子中，终端上会打印 v12.22.1。\n\n有关可用命令的更多信息以及如何使用它们，可以在官方仓库 https://github.com/nvm-sh/nvm\
  \ 中找到。\n\nnvm 实用程序兼容 Linux、macOS 和 **Windows 子系统 for Linux** (WSL)。您可以使用两个非官方的 Windows\
  \ 替代方案：\n\n- nvm-windows，可在 https://github.com/coreybutler/nvm-windows 找到\n- nodist，可在\
  \ https://github.com/marcelklehr/nodist 找到\n\n就是这些——您已将开发机器配置为运行 Node.js，从而可以安装和使用\
  \ Node.js 包，例如 Express.js 来构建后端应用程序，以及前端库和工具，例如 Angular CLI。\n\n在整本书中，我们将使用 npm\
  \ 来安装后端和前端应用程序的依赖项。\n\n## 摘要\n\n在本章中，我们了解了整本书中我们将构建的应用程序的全栈和 monorepo 架构，以及我们将用于构建它的技术。\n\
  \n在介绍架构和技术之后，我们研究了如何在开发机器上安装 MySQL。最后，我们学习了如何安装和设置 Node.js，我们的全栈应用程序的前端和后端都需要它。\n\
  \n本章现已完成！现在我们已经设置了开发环境并安装了 Node.js，我们需要构建一个具有 GraphQL 支持的 Node.js 服务器来实现后端。在下一章中，我们将首先安装和配置\
  \ Express.js，然后添加 Apollo Server 并查看如何测试和调试我们的 GraphQL 服务器。\n\n\n"
- "## 2 使用 Node.js、Express.js 和 Apollo 设置 GraphQL\n\n在上一章中，我们通过安装 **Node.js** 和 **MySQL**\
  \ 为开发机器做好了准备。现在我们可以开始构建后端应用程序，以提供将被我们的 **Angular** 应用程序消费的 API。\n\n为了节省时间，我们将尝试构建一个具有最少功能集的简单社交网络应用程序（一个\
  \ **最小可行产品** 或 **MVP**），该产品将在全书中实现。\n\n首先，用户将看到登录和注册界面。在此界面中，用户需要提供电子邮件和密码以登录，或在尚未注册的情况下创建账户。在这种情况下，他们需要输入全名、用户名、电子邮件、密码和密码确认。\n\
  \n登录后，他们将被带到一个界面，在那里他们可以创建帖子并查看自己的动态，动态将显示该应用用户添加的帖子。他们还可以按名称搜索其他用户并从那里访问他们的个人资料。\n\
  \n用户可以看到自己的个人资料，其中包含他们的照片和帖子，以及其他用户的个人资料。\n\n最后，用户可以在帖子上添加评论和点赞，并在有人评论或点赞他们的帖子时收到通知。\n\
  \n在设置开发环境并安装 Node.js 之后，我们需要设置一个具有 **GraphQL** 支持的 Node.js 服务器来实现后端。在本章中，我们将解释如何安装\
  \ **Express.js** 并将其与 **TypeScript** 和 GraphQL 配置。\n\n接下来，我们将学习如何使用 **模拟** 来提供一个可工作的\
  \ GraphQL 服务器，使用 **Apollo Server** 进行测试，然后再实现 **解析器**，解析器负责获取和修改数据。\n\n我们还将学习如何配置\
  \ **跨源资源共享（CORS）**，并学习如何使用 Apollo Studio 测试我们的 GraphQL 服务器。\n\n本章将涵盖以下主题：\n\n- 初始化我们的项目\n\
  - 安装 Express.js 并添加 TypeScript 支持\n- 使用 Node.js 设置 Apollo Server\n- 使用 Apollo Server\
  \ 模拟我们的 GraphQL API\n- 使用 Apollo Studio 测试 GraphQL 服务器\n- 在 Express.js 中配置 CORS\n\
  \n### 技术要求\n\n要完成本章，您需要在本地开发机器上安装 Node.js 和 npm。请参阅 *第 1 章，应用架构与开发环境*，以获取如果尚未安装的安装说明。\n\
  \n您还需要熟悉以下技术：\n\n- JavaScript/TypeScript\n- Git, Node.js, and Express\n- GraphQL\
  \ concepts such as schemas and types\n\n如果您需要复习 GraphQL 概念，请查看 https://graphql.org/learn/。这是\
  \ GraphQL 模式的官方文档，它解释了模式的各种功能以及如何使用模式语言使用它们。\n\n您可以在 https://github.com/PacktPublishing/Full-Stack-App-Development-with-Angular-and-GraphQL/tree/main/Chapter02\
  \ 找到本章的完整源代码。或者，您也可以访问 https://git.io/JKZpT。请确保您查阅历史记录，其中包含本章主要步骤的提交。\n\n### 设置单仓库项目\n\
  \n我们将采用单仓库方法来管理项目，这本质上围绕着使用单个仓库来管理客户端和服务器应用程序（以及任何共享库）的想法，而不是使用多个仓库。我们将使用一个名为 Lerna\
  \ 的工具来实现这一点。让我们开始吧：\n\n1. 转到您的命令行界面并运行以下命令安装 Lerna：\n2. 接下来，使用以下命令为您的项目创建文件夹并初始化\
  \ Lerna：\n\n```\nnpm install --global lerna\n```\n\n```\nmkdir ngsocial\n```\n\n\
  ```\ncd ngsocial\n```\n\n```\nlerna init\n```\n\n您应该会看到类似以下的输出：\n\n```\nlerna notice\
  \ cli v4.0.0\nlerna info Initializing Git repository\nlerna info Creating package.json\n\
  lerna info Creating lerna.json\nlerna info Creating packages directory\nlerna success\
  \ Initialized Lerna files\n```\n\nlerna.json 文件保存 Lerna 的配置，而 package.json 文件包含整个（客户端和服务器）项目的配置。packages/\
  \ 文件夹将包含客户端和服务器应用程序，以及您希望在两个应用程序之间共享的任何库。该命令还将运行 git init 命令以初始化 Git 仓库。您可以在 https://github.com/lerna/lerna#lernajson\
  \ 找到配置 Lerna 的可用选项。\n\n3. 接下来，创建一个 .gitignore 文件并添加以下内容：\n\n```\nnode_modules\n\
  .DS_Store\n```\n\n4. 接下来，打开 lerna.json 文件并将 version 设置为 \"0.0.1\"：\n\n```\n{\n \
  \ \"packages\": [\n    \"packages/*\"\n  ],\n  \"version\": \"0.0.1\"\n}\n```\n\n\
  然后，打开 package.json 文件并将 version 设置为 \"0.0.1\"：\n\n```\n{\n  \"name\": \"root\",\n\
  \  \"private\": true,\n  \"devDependencies\": {\n    \"lerna\": \"^4.0.0\"\n  },\n\
  \  \"version\": \"0.0.1\"\n}\n```\n\n有关 Lerna 的更多信息，请查看 https://lerna.js.org/。\n\
  \n5. 接下来，转到您的 GitHub 账户并创建一个新的仓库，以便将项目的代码推送到其中。此过程很简单，但如果您遇到任何问题，请确保查阅 https://help.github.com/articles/creating-a-new-repository/\
  \ 中的文档。\n\n6. 然后，您需要使用以下命令将本地仓库指向远程仓库：\n\n```\ngit remote add origin <PUT_YOUR_REPO_URL_HERE>\n\
  ```\n\n7. 在继续之前，让我们创建一个分支，以便我们可以区分每个章节的代码。在您的终端中运行以下命令：\n\n```\ngit checkout -b\
  \ chapter2\n```\n\n您应该会得到以下输出：\n\n```\nSwitched to a new branch 'chapter2'\n```\n\
  \n8. 最后，使用以下命令暂存并提交更改：\n\n```\ngit add -A\n```\n\n```\ngit commit -m \"Init lerna\"\
  \n```\n\n9. 然后，如果您想推送代码，请运行以下命令：\n\n```\ngit push -u origin chapter2\n```\n\n现在我们已经使用\
  \ Lerna 创建了单仓库项目，让我们初始化我们的服务器端项目。\n\n### 初始化我们的服务器项目\n\n在本节中，我们将学习如何初始化我们的服务器项目并安装\
  \ Express.js，这将帮助我们快速启动服务器，而无需处理 Node.js 平台提供的低级 API。\n\nnpm 提供了一个命令，允许开发人员创建一个项目（一个带有\
  \ package.json 文件的空文件夹）。让我们学习如何使用它来生成 package.json 文件。\n\n### 生成 package.json 文件\n\
  \n我们将通过在 ngsocial/ packages/ 文件夹内为服务器文件创建一个文件夹来开始：\n\n1. 打开一个新的命令行界面并运行以下命令：\n\n\
  ```\ncd packages\n```\n\n```\nmkdir server && cd server\n```\n\n2. 接下来，运行以下命令：\n\
  \n```\nnpm init --yes\n```\n\n--yes 标志告诉 npm 使用默认设置生成 package.json 文件。\n\n3. 您可以运行以下命令来更新您的\
  \ npm 版本：\n\n```\nnpm install -g npm\n```\n\n我们执行此命令是因为我们需要更新到 npm 7（如果您尚未使用此版本，其中包括对工作区（Workspaces）的支持）。请参阅\
  \ https://docs.npmjs.com/cli/v7/using-npm/workspaces。\n\n以下为 package.json 文件的内容。在我的例子中，我已调整了名称、作者、版本和许可证信息：\n\
  \n```\n{\n  \"name\": \"ngsocial\",\n  \"version\": \"0.0.1\",\n  \"description\"\
  : \"\",\n  \"main\": \"index.js\",\n  \"scripts\": {\n    \"test\": \"echo \\\"\
  Error: no test specified\\\" && exit 1\"\n  },\n  \"keywords\": [],\n  \"author\"\
  :\n    \"Ahmed Bouchefra (https://www.ahmedbouchefra.com)\",\n  \"license\": \"\
  MIT\"\n}\n```\n\n现在我们有了包含 package.json 文件的项目文件夹，接下来我们将安装 Express.js 以及一些开发依赖项，例如\
  \ typescript 和 ts-node。\n\n### 安装 Express.js 和开发依赖项\n\n在初始化服务器项目后，我们需要使用以下命令从 npm\
  \ 仓库安装 express 包：\n\n```\nnpm install express\n```\n\n在撰写本文时，已安装 express v4.17.1。在\
  \ package.json 文件中，必须添加一个名为 dependencies 的新对象，如下所示：\n\n```\n\"dependencies\": {\n\
  \  \"express\": \"^4.17.1\"\n}\n```\n\n接下来，我们需要安装以下开发依赖项：\n\n- `typescript`，一种能够将\
  \ TypeScript 代码编译为纯 JavaScript 的工具\n- `ts-node`，一种能够直接从终端启动基于 TypeScript 的开发服务器而无需将其编译为纯\
  \ JavaScript 的工具\n\n返回你的终端并运行以下命令：\n\n```\nnpm install --save-dev typescript ts-node\n\
  ```\n\n安装这些库后，打开 package.json 文件。你会看到一个新的 devDependencies 对象，如下所示：\n\n```\n\"devDependencies\"\
  : {\n  \"ts-node\": \"^10.2.1\",\n  \"typescript\": \"^4.4.3\"\n}\n```\n\n我们还将有一个名为\
  \ tsc 的新可执行文件，它指的是 TypeScript 编译器。由于我们已将包安装在本地，因此需要提供完整路径来调用它。例如，我们可以通过提供可执行文件的完整路径并使用\
  \ -v 开关来获取已安装的 typescript 版本，如下所示：\n\n```\n./node_modules/typescript/bin/tsc -v\n\
  Version 4.4.3\n```\n\n现在，让我们使用此工具在服务器文件夹的根目录生成一个 tsconfig.json 文件：\n\n```\n./node_modules/typescript/bin/tsc\
  \ --init\nmessage TS6071: Successfully created a tsconfig.json file.\n```\n\n> **重要提示**\n\
  > 我们也可以使用 npx tsc --init --rootDir src --outDir dist --lib dom,es6 --module commonjs\
  \ --removeComments 命令来生成仅包含我们需要的属性的 tsconfig.json 文件。请参考 https://aka.ms/tsconfig.json\
  \ 以了解有关 tsconfig.json 文件的更多信息。\n\ntsconfig.json 文件包含配置 TypeScript 的所有可能选项。让我们删除其中大部分，只保留以下最小配置：\n\
  \n```\n{\n  \"compilerOptions\": {\n    \"target\": \"es6\",\n    \"module\": \"\
  commonjs\",\n    \"rootDir\": \"./\",\n    \"outDir\": \"./dist\",\n    \"esModuleInterop\"\
  : true,\n    \"strict\": true\n  }\n}\n```\n\n文件中剩余的选项如下：\n\n- target：这用于指定编译器输出的\
  \ JavaScript 版本。\n- module：这用于指定编译后的 JavaScript 代码的模块系统。\n- rootDir：这用于指定 TypeScript\
  \ 代码文件在项目中的位置。\n- outDir：这用于指定编译后的 JavaScript 代码输出文件夹的位置。\n- esModuleInterop：这告诉编译器将\
  \ ES6 模块编译为 CommonJS 模块。\n- strict：这用于启用严格的类型检查。\n\n接下来，我们需要使用以下命令安装 Node 和 Express.js\
  \ 的类型定义：\n\n```\nnpm install --save-dev @types/node @types/express\n```\n\n它们将被添加到\
  \ package.json 文件中的 devDependencies 对象下：\n\n```\n\"devDependencies\": {\n  \"@types/express\"\
  : \"^4.17.13\",\n  \"@types/node\": \"^16.9.6\",\n  \"ts-node\": \"^10.2.1\",\n\
  \  \"typescript\": \"^4.4.3\"\n}\n```\n\n可选地，你可以按如下方式暂存并提交更改：\n\n```\ngit add -A\n\
  git commit -m \"Installing Express and development dependencies\"\n```\n\n在安装 Express.js\
  \ 和其他开发依赖项并在项目中配置 TypeScript 之后，让我们学习如何创建服务器。\n\n## 创建服务器\n\n现在，我们准备创建 Express 服务器：\n\
  \n- 1. 使用以下命令从 server/ 文件夹的根目录创建 src/index.ts 文件：\n\n```bash\nmkdir src && touch\
  \ src/index.ts\n```\n\n请注意，在 TypeScript 的情况下，我们使用的是 .ts 文件扩展名，而不是用于纯 JavaScript\
  \ 源文件 的 .js 扩展名。\n\n- 2. 接下来，打开 src/index.ts 文件并添加以下代码，该代码用于在 localhost 的 8080 端口启动服务器：\n\
  \n```typescript\nimport express, { Application } from 'express';\nconst PORT = 8080;\n\
  const app: Application = express();\napp.get('/', (req, res) =>\n  res.send('Express\
  \ is successfully running!'));\napp.listen(PORT, () => {\n  console.log(`Server\
  \ is running at http://localhost:${PORT}`);\n});\n```\n\n在前面的代码中，我们首先从 express 模块导入\
  \ express 和 Application，然后定义一个常量来保存服务器将监听的端口号。\n\n接下来，我们创建一个应用程序实例，并使用 Express 应用程序的\
  \ get() 方法添加一个路由。此路由将使我们能够在向 / 端点发出 GET 请求时调用处理程序方法。最后，我们调用 Express 应用程序的 listen()\
  \ 方法开始在提供的端口上监听 HTTP 请求。\n\n我们使用 Express 应用程序上可用的一些方法在 Express.js 中创建路由。这些方法包含路由可以处理的\
  \ HTTP 请求的名称；例如，你可以使用 .get() 处理 GET 请求，使用 .post() 处理 POST 请求。你可以在 https://expressjs.com/en/4x/api.html#app.METHOD\
  \ 查看完整列表。\n\n在本书中我们将构建的示例中，我们不需要使用许多路由，因为 GraphQL 只需要一个端点来监听并处理我们应用中的所有请求。\n\n-\
  \ 3. 现在，我们可以通过向 package.json 文件添加以下启动脚本，使用 ts-node 运行我们的服务器：\n\n```\n\"scripts\"\
  : {\n  \"start\": \"ts-node ./src/index.ts\"\n}\n```\n\n- 4. 返回你的终端并运行以下命令以调用之前的脚本，从而启动我们的服务器：\n\
  \n```\nnpm start\n> [...]\nServer is running at http://localhost:8080\n```\n\n如果你使用网络浏览器访问\
  \ http://localhost:8080 地址，你应该会看到一个空白页面，其中显示以下消息：Express is successfully running!\n\
  \n现在我们已经创建了 Express.js 服务器，我们将学习如何配置项目以在开发期间监视任何代码更改，自动重新编译代码并重启服务器。\n\n## 监视和重新编译代码\n\
  \n在这一点上，我们可以使用 ts-node 在无需编译的情况下轻松运行 TypeScript 代码。这对于开发来说很棒，但每次更改代码时，我们都需要停止并再次执行脚本。\n\
  \n这对于开发真实项目来说并不合适，因此我们可以通过使用一些监视项目文件夹的实用工具（如 nodemon 和 ts-node-dev）来更进一步。让我们使用后者，因为它是最容易使用的。\n\
  \n返回你的终端，停止正在运行的服务器，并从你的服务器应用程序运行以下命令：\n\n```\nnpm install --save-dev ts-node-dev\n\
  ```\n\n此命令将把 ts-node-dev 安装为开发依赖项。\n\n接下来，按如下方式更改 package.json 文件中的启动脚本：\n\n```\n\
  \"scripts\": {\n  \"start\": \"ts-node-dev --respawn ./src\"\n}\n```\n\n接下来，再次运行你的启动脚本并更改你的\
  \ index.ts 文件（你可以简单地添加一个注释，例如 // 我们的代码现在正在被 ts-node-dev 监视和重新编译）。你的服务器应该会在不手动操作的情况下重启，并且它将在终端中输出类似以下的消息：\n\
  \n```\n[INFO] 16:57:48 Restarting: /home/ahmed/ngsocial/packages/server/src/index.ts\
  \ has been modified\nServer is running at http://localhost:8080\n```\n\n这对于开发来说是一个不错的设置，但当你的项目准备部署时，你只需要将\
  \ TypeScript 代码编译为纯 JavaScript 一次。\n\n我们可以通过添加另一个脚本来实现这一点，该脚本只需调用 tsc 编译器。返回 package.json\
  \ 文件并添加一个名为 build 的脚本（你可以选择任何有效的名称），如下所示：\n\n```\n\"scripts\": {\n  \"start\": \"\
  ts-node-dev --respawn ./src\",\n  \"build\": \"tsc --project ./\"\n}\n```\n\n--project\
  \ 标志用于指定将编译为 JavaScript 的 TypeScript 文件的文件夹。在这里，我们指定了 ./，其中存在 tsconfig.json 文件。此命令允许我们在不指定编译器的完整\
  \ ./node_modules/typescript/bin/tsc 路径的情况下运行 tsc 编译器。\n\n还有其他方法可以做到这一点，例如使用 npm\
  \ install 命令的 -g 开关在系统上全局安装 TypeScript，或使用 npx 在不安装的情况下从 npm 仓库运行 tsc（npx tsc）。\n\
  \n返回你的终端，停止正在运行的服务器，并让我们从服务器项目的根目录使用以下命令调用我们的构建脚本：\n\n```\nnpm run build\n```\n\n\
  这将运行 tsc 编译器以将我们项目的代码编译为纯 JavaScript。此时，我们只有一个文件（index.ts），它将被转换为 dist/src/index.js\
  \ 文件中的 JavaScript 代码。\n\n\n\n我们可以在 dist/ 文件夹内获得 JavaScript 源文件的扁平输出，而没有 src/ 子文件夹，通过将\
  \ tsconfig.json 文件中 rootDir 属性的值更改为 src/：\n\n```\n{\n  \"compilerOptions\": {\n\
  \    \"target\": \"es6\",\n    \"module\": \"commonjs\",\n    \"rootDir\": \"./src\"\
  ,\n    \"outDir\": \"./dist\",\n    \"esModuleInterop\": true,\n    \"strict\":\
  \ true\n  }\n}\n```\n\n现在，如果我们再次运行 npm run build 命令，我们将在 dist/ 文件夹中获得输出，而没有 src/\
  \ 子文件夹。\n\n这是编译后的代码：\n\n```\n\"use strict\";\nvar __importDefault =\n(this && this.__importDefault)\
  \ || function (mod) {\n    return (mod && mod.__esModule) ? mod : { \"default\"\
  : mod };\n};\nObject.defineProperty(exports, \"__esModule\", { value: true });\n\
  const express_1 = __importDefault(require(\"express\"));\nconst PORT = 8080;\nconst\
  \ app = express_1.default();\napp.get('/', (req, res) =>\n    res.send('Express\
  \ is successfully running!'));\napp.listen(PORT, () => {\n    console.log('Server\
  \ is running at\n        http://localhost:${PORT}');\n});\n```\n\n我们可以测试是否可以使用 Node\
  \ 运行我们的服务器，使用以下命令：\n\n```\nnode dist/index.js\n```\n\n这应该启动 Express 服务器并在终端中输出 **Server\
  \ is running at http://localhost:8080**。如果您在浏览器中访问该地址，它将显示一条消息，内容为 **Express is\
  \ successfully running!**。\n\n从现在开始，我们将使用 `ts-node-dev` 工具（使用之前的 `npm start` 命令）。这将允许我们持续监视我们的\
  \ TypeScript 源代码，该源代码位于服务器项目的 `src/` 文件夹内，并调用 `ts-node` 工具，以运行它并在我们每次更改后重新运行它。\n\
  \n到目前为止，我们已经初始化了服务器项目，安装了 Express.js 和 TypeScript，并创建了一个在本地主机的 8080 端口上运行的基本服务器。在下一节中，我们将学习如何配置\
  \ Apollo Server 以公开 GraphQL API。\n\n## 创建 GraphQL API\n\n在本节中，我们将学习如何使用 Apollo Server\
  \ 创建我们的 GraphQL API，Apollo Server 是一个由社区维护的开源 GraphQL 服务器。首先，我们将创建一个具有简单模式的服务器。然后，我们将添加类型和解析器，以便能够查询和变更每个用户所做的帖子、评论和点赞；我们将首先使用假数据，然后再添加真实数据库。\n\
  \n## 安装必要的库\n\n让我们开始安装必要的库。返回到您的终端，并从 `server/` 文件夹的根目录运行以下命令：\n\n```\nnpm install\
  \ graphql apollo-server-express @graphql-tools/utils @graphql-tools/schema\nnpm\
  \ install --save-dev @types/graphql graphql-tag\n```\n\n`graphql-tag` 库导出一个 JavaScript\
  \ 模板字面量标签，可将 GraphQL 查询字符串转换为 **GraphQL 抽象语法树**。\n\n之前的命令将安装 `graphql v15.6.0`、`apollo-server-express\
  \ v3.3.0`、`@graphql-tools/schema v 8.2.0` 和 `@graphql-tools/utils v8.2.3` 作为依赖项，以及\
  \ `graphql-tag v2.12.5` 和 `@types/graphql v14.5.0` 作为开发依赖项。\n\n接下来，让我们通过创建 GraphQL\
  \ 服务器和模式来学习如何继续。首先，我们将在为社交网络应用程序添加 API 之前公开一个具有简单 API 的服务器。\n\n## 公开简单的 GraphQL\
  \ API\n\n现在我们已经安装了必要的库，我们将学习如何公开一个简单的 GraphQL 服务器和简单模式来测试我们的服务器如何工作：\n\n- 1. 打开\
  \ src/index.ts 文件并在您进行时用以下代码替换其内容。\n- 首先添加必要的导入：\n- 2. 接下来，按如下方式添加类型定义：\n- 3. 添加解析器：\n\
  - 4. 然后，添加以下配置对象：\n- 5. 最后，添加以下函数：\n\n```\nimport express, { Application } from\
  \ 'express';\nimport { ApolloServer, Config, gql }\n    from 'apollo-server-express';\n\
  import { IResolvers } from '@graphql-tools/utils';\n```\n\n```\nconst typeDefs =\
  \ gql`\n    type Query {\n        message: String!\n    }\n`\n```\n\n```\nconst\
  \ resolvers: IResolvers = {\n    Query: {\n        message: () => 'It works!'\n\
  \    }\n};\n```\n\n```\nconst config: Config = {\n    typeDefs: typeDefs,\n    resolvers:\
  \ resolvers\n};\n```\n\n```\nasync function startApolloServer(config: Config) {\n\
  \    const PORT = 8080;\n    const app: Application = express();\n```\n\n```\nconst\
  \ server: ApolloServer =\n    new ApolloServer(config);\nawait server.start();\n\
  server.applyMiddleware({\n    app,\n    path: '/graphql'\n});\napp.listen(PORT,\
  \ () => {\n    console.log('Server is running at\n        http://localhost:${PORT}');\n\
  });\n}\nstartApolloServer(config);\n```\n\n首先，我们开始添加必要的导入，例如从 `express` 包导入 Express.js，以及从\
  \ `apollo-server-express` 包导入 `ApolloServer` 和 `gql`。接下来，我们定义我们的模式类型和解析器，然后创建一个\
  \ `express` 应用程序。\n\n之后，我们创建一个 Apollo Server 实例，该实例将 `typeDefs` 和 `resolvers` 作为配置参数。接下来，我们通过使用\
  \ `applyMiddleware` 将 Apollo Server 添加到 Express 应用程序中，`applyMiddleware` 接受 `express`\
  \ 应用程序和 GraphQL 端点作为参数。\n\n您需要在调用 ApolloServer 的 `server.applyMiddleware()` 之前等待\
  \ `server.start()`。\n\n我们的模式包含一个简单的类型定义，该类型定义有一个名为 `message` 的单个字段，其类型为 `string`。在查询解析器对象中，我们为\
  \ message 字段实现了一个解析器函数，该函数仅返回一些文本，内容为 **It works!**。\n\n> **重要提示**\n> 本书假设您已经熟悉\
  \ GraphQL 的基本概念。如果不是这样，或者您需要复习，我们建议您访问 `https://graphql.org/learn/`。\n\n接下来，让我们通过使用\
  \ Apollo Studio 向我们的服务器发送查询来与此 API 交互。\n\n## 使用 Apollo Studio 发送查询\n\n确保您的服务器仍在运行且没有错误，然后使用网络浏览器转到\
  \ http://localhost:8080/graphql 地址。您应该会看到一个类似于以下内容的界面：\n\n![](img/c798729e4c42765fcb1c98950164d0ba_50_0.png)\n\
  \n图 2.1 – 查询您的服务器\n\n从此界面，您可以单击 Query your server 按钮以访问 Apollo Studio，在那里您可以向 API\
  \ 端点发送请求。\n\n在左侧面板中，编写以下 GraphQL 查询以发送 message 查询：\n\n```\nquery {\n  message\n\
  }\n```\n\n单击 Run 按钮。您应该在右侧面板中获得以下输出：\n\n```\n{\n  \"data\": {\n    \"message\":\
  \ \"It works!\"\n  }\n}\n```\n\n以下屏幕截图显示了 Apollo Studio，以及我们的查询和响应：\n\n![](img/c798729e4c42765fcb1c98950164d0ba_51_0.png)\n\
  \n图 2.2 – Apollo Studio\n\n现在我们已经测试了我们的 Apollo Server，让我们创建我们的社交应用程序的 GraphQL 模式。我们将处理用户、帖子、评论、点赞和通知等实体。\n\
  \n## 为我们的社交网络创建 GraphQL 模式\n\n在本节中，我们将在单独的文件中创建类型定义和解析器，并将它们导入到我们的 index.ts 文件中。让我们更改之前示例的文件夹结构，并在添加更多\
  \ GraphQL 类型之前确保它仍然按预期工作：\n\n- 1. 返回到您的终端，并从服务器文件夹的根目录运行以下命令：\n- 2. 打开 src/graphql/schema.graphql\
  \ 文件并添加以下类型：\n- 3. 打开 src/graphql/resolvers.ts 文件并添加以下代码：\n\n```\ncd src && mkdir\
  \ graphql\ncd graphql && touch schema.ts && touch schema.graphql && touch resolvers.ts\n\
  ```\n\n```\ntype Query {\n  message: String!\n}\n```\n\n```\nimport { IResolvers\
  \ } from '@graphql-tools/utils';\nconst resolvers: IResolvers = {\n  Query: {\n\
  \    message: () => 'It works!'\n  }\n};\nexport default resolvers;\n```\n\n在这里，我们创建了一个\
  \ resolvers 变量，其类型为 IResolvers，其中包含 message 字段的解析器，然后将其从文件中导出。\n\n- 4. 接下来，打开 src/graphql/schema.ts\
  \ 文件并添加以下代码：\n\n```ts\nimport fs from 'fs';\nimport { GraphQLSchema } from 'graphql';\n\
  import { makeExecutableSchema }\n    from '@graphql-tools/schema';\nimport { gql\
  \ } from 'apollo-server-express';\nimport resolvers from './resolvers';\n\nconst\
  \ typeDefs = gql`${fs.readFileSync(\n    __dirname.concat('/schema.graphql'), 'utf8')}`;\n\
  const schema: GraphQLSchema = makeExecutableSchema({\n    typeDefs,\n    resolvers,\n\
  });\nexport default schema;\n```\n\n在这里，我们使用从 fs 模块导入的 readFileSync 方法从 .graphql\
  \ 文件读取查询，并使用 import 语句从 resolvers.ts 文件导入解析器。接下来，我们使用 typeDefs 和 resolvers 参数调用\
  \ makeExecutableSchema，以创建我们可以从 schema.ts 文件导出的模式。\n\n> **重要提示**\n> 如果您使用 **Webpack**，您可以使用随\
  \ graphql-tag 包提供的加载器，使用 Webpack 从 .graphql 文件导入 GraphQL 查询。\n\n- 5. 打开 src/index.ts\
  \ 文件并按如下方式更新其内容：\n\n```ts\nimport express, { Application } from 'express';\nimport\
  \ { ApolloServer } from 'apollo-server-express';\nimport schema from './graphql/schema';\n\
  async function startApolloServer() {\n    const PORT = 8080;\n```\n\n\n\n```\nconst\
  \ app: Application = express();\nconst server : ApolloServer =\n    new ApolloServer({schema});\n\
  await server.start();\nserver.applyMiddleware({\n    app,\n    path: '/graphql'\n\
  });\napp.listen(PORT, () => {\n    console.log('Server is running at\n         \
  \       http://localhost:${PORT}');\n});\n}\nstartApolloServer();\n```\n\n我们使用 import\
  \ 语句导入 schema 并将其传递给 Apollo Server。如果再次运行服务器，你应该能够像之前那样与 Apollo Studio 交互。\n\n现在，让我们为我们的小型社交网络应用添加类型。\n\
  \n6. 进入 src/graphql/schema.graphql 文件并按如下方式添加 User 类型：\n\n```\ntype User {\n   \
  \ id: ID!\n    fullName: String!\n    bio: String\n    email: String!\n    username:\
  \ String!\n    password: String!\n    image: String\n    coverImage: String\n  \
  \  postsCount: Int!\n    createdAt: String!\n}\n```\n\n7. 接下来，按如下方式添加 Post 类型：\n\
  \n```\ntype Post {\n  id: ID!\n  text: String\n  image: String\n  author: User!\n\
  \  commentsCount: Int!\n  likesCount: Int!\n  likedByAuthUser: Boolean\n  latestComment:\
  \ Comment\n  latestLike: String\n  createdAt: String!\n}\n```\n\n8. 按如下方式添加 Comment\
  \ 类型：\n\n```\ntype Comment {\n  id: ID!\n  Comment: String!\n  Author: User!\n \
  \ post: ID!\n  createdAt: String!\n}\n```\n\n9. 按如下方式添加 Like 类型：\n\n```\ntype Like\
  \ {\n  id: ID!\n  user: User!\n  post: ID!\n  createdAt: String!\n}\n```\n\n10.\
  \ 按如下方式添加 Notification 类型：\n\n```\ntype Notification {\n  id: ID!\n  text: String!\n\
  ```\n\n```\npostId: ID!\ncreatedAt: String!\n}\n```\n\n11. 然后，我们需要按如下方式添加查询：\n\n\
  ```\ntype Query {\n  message: String!\n  getUser(userId: ID!): User\n  getPostsByUserId(userId:\
  \ ID!, offset: Int, limit:\n    Int): [Post]\n  getFeed(offset: Int, limit: Int):\
  \ [Post]\n  getNotificationsByUserId(userId: ID!, offset: Int,\n    limit: Int):\
  \ [Notification]\n  getCommentsByPostId(postId: ID!, offset: Int, limit:\n    Int):\
  \ [Comment]\n  getLikesByPostId(postId: ID!, offset: Int, limit:\n    Int): [Like]\n\
  \  searchUsers(searchQuery: String): [User]\n}\n```\n\n12. 最后，按如下方式添加变更：\n\n```\n\
  type Mutation {\n  post(text: String, image: String): Post\n  removePost(id: ID!):\
  \ ID\n  comment(comment: String!, postId: ID!): Comment\n  removeComment(id: ID!):\
  \ Comment\n  like(postId: ID!): Like\n  removeLike(postId: ID!): Like\n  removeNotification(id:\
  \ ID!): ID\n}\n```\n\n这是我们将在后续章节中不断改进的初始 schema。在继续实现 GraphQL API 之前，让我们学习如何使用 Apollo\
  \ Server 的模拟功能（如果你计划遵循 **GraphQL优先开发** 流程，这是一个重要步骤）。\n\n## 使用 GraphQL API 模拟\n\n\
  模拟允许前端开发者在后端开发完成之前开始构建 UI。它还让我们可以在不等待缓慢的数据库操作或运行完整的 GraphQL 服务器的情况下测试 UI。\n\n社区提供了许多工具，可以轻松地基于\
  \ GraphQL schema 和查询进行请求模拟，例如 graphql-tools、graphql-faker 以及 Apollo Server 的内置模拟功能。\n\
  \n由于我们已经在使用 Apollo Server，让我们在实现解析器之前使用其模拟功能来模拟我们的 GraphQL 请求。\n\n打开 src/index.ts\
  \ 文件并按如下方式向 Apollo Server 添加 mocks: true：\n\n```\nconst server : ApolloServer =\
  \ new ApolloServer({schema ,\n  mocks: true});\n```\n\nApollo Server 的内置模拟非常基础。它只是查看类型定义并返回与对应字段相同类型的值。\n\
  \n前往 Apollo Studio 并添加以下查询：\n\n```\nquery {\n  searchUsers(searchQuery:\"a\") {\n\
  \    id fullName email postsCount\n  }\n  getPostsByUserId(userId:\"1\") {\n   \
  \ id text author { id fullName } commentsCount\n    latestComment { id comment }\n\
  \    createdAt\n  }\n}\n```\n\n以下截图显示了查询结果：\n\n![](img/c798729e4c42765fcb1c98950164d0ba_57_0.png)\n\
  \n图 2.3 – 使用 Apollo Studio 的查询结果\n\n在这里，我们可以看到，默认情况下，每个预期返回列表值的查询只返回两个值，并且每个字符串值字段都返回\
  \ Hello World。这提供了结果的正确结构，但离真实情况还很远。\n\n幸运的是，我们可以在 Apollo Server alongside 使用其他工具，例如\
  \ casual，这是一个用于 JavaScript 的假数据生成器，它允许我们在实现所需解析器之前从 GraphQL 查询中返回更真实和随机的值。\n\n返回到你的终端，并在\
  \ server/ 文件夹的根目录下运行以下命令：\n\n```\nnpm install casual\n```\n\n接下来，返回 src/index.ts\
  \ 文件并添加以下导入：\n\n```\nimport casual from 'casual';\n```\n\n接下来，按如下方式添加一个 mocks 对象：\n\
  \n```\nconst mocks = {};\n```\n\n接下来，通过在 mocks 对象内部添加以下代码来模拟 User 类型：\n\n```\nUser:\
  \ () => ({\n    id: casual.uuid,\n    fullName: casual.full_name,\n    bio: casual.text,\n\
  \    email: casual.email,\n    username: casual.username,\n    password: casual.password,\n\
  \    image: 'https://picsum.photos/seed/picsum/200/300',\n    coverImage:\n    \
  \  'https://picsum.photos/seed/picsum/200/300',\n    postsCount: () => casual.integer(0)\n\
  \  }),\n```\n\n接下来，按如下方式模拟 Post 类型：\n\n```\nPost: () => ({\n    id: casual.uuid,\n\
  \    text: casual.text,\n    image: 'https://picsum.photos/seed/picsum/200/300',\n\
  \    commentsCount: () => casual.integer(0),\n    likesCount: () => casual.integer(0),\n\
  \    latestLike: casual.first_name,\n    createdAt: () => casual.date()\n  }),\n\
  ```\n\n接下来，按如下方式模拟 Comment 类型：\n\n```\nComment: () => ({\n    id: casual.uuid,\n\
  \    comment: casual.text,\n    post: casual.uuid,\n    createdAt: () => casual.date()\n\
  \  }),\n```\n\n接下来，按如下方式模拟 Like 类型：\n\n```\nLike: () => ({\n  id: casual.uuid,\n\
  \  post: casual.uuid\n})\n```\n\n对于 schema 中每个类型的每个字段，我们可以使用 casual 为其分配常量值或随机值，casual\
  \ 为最常用的数据类型提供了生成器。你可以在 https://github.com/boolean/casual 找到可用属性和方法的列表。\n\n默认情况下，我们的模拟解析器对查询只返回两个结果。我们可以按如下方式更改此默认行为。在同一个\
  \ mocks 对象中，你需要添加以下对象：\n\n```\nQuery: () => ({\n  getPostsByUserId: () =>\n    [...new\
  \ Array(casual.integer(10, 100))],\n  getFeed: () => [...new Array(casual.integer(10,\
  \ 100))],\n  getNotificationsByUserId: () =>\n    [...new Array(casual.integer(10,\
  \ 100))],\n  getCommentsByPostId: () =>\n    [...new Array(casual.integer(10, 100))],\n\
  \  getLikesByPostId: () =>\n    [...new Array(casual.integer(10, 100))],\n  searchUsers:\
  \ () =>\n    [...new Array(casual.integer(10, 100))]\n})\n```\n\n现在，我们的查询将返回 10\
  \ 到 100 条假条目。有关更多详细信息，请参阅 https://www.graphql-tools.com/docs/mocking#using-lists-in-mocks。\n\
  \n按如下方式更新传递给 ApolloServer 的对象：\n\n```\nconst server: ApolloServer = new ApolloServer({schema,\n\
  \  mocks, mockEntireSchema: false});\n```\n\n如果你与开发团队一起工作，前端开发者可以开始构建前端，因为他们可以与\
  \ GraphQL API 交互并获取生成的数据，而无需等待后端开发者实现解析器。出现的一个问题是，在现实场景中应链接的条目在我们的模拟 API 中并未链接——让我们学习如何更改这一点！\n\
  \n## 链接模拟数据\n\n帖子应属于用户，因此应通过 user 字段链接到用户。然而，该字段的随机生成值不保证是为用户标识符生成的其中一个值。我们可以通过在\
  \ src/index.ts 文件中模拟对象之前定义两个数组来轻松解决此问题，如下所示：\n\n```\nlet postsIds: string[] = [];\n\
  let usersIds: string[] = [];\n```\n\n这些数组将允许我们跟踪用户和帖子生成的标识符，以确保 Post、Comment 和 Like\
  \ 类型的 user 和 post 字段接收这些值中的一个。这样，我们生成的数据将更真实，更类似于现实世界的示例。\n\n接下来，将 mock User 对象上\
  \ id 字段的生成器更改为以下函数：\n\n```\nid: () => {let uuid = casual.uuid; usersIds.push(uuid);\n\
  \        return uuid},\n```\n\n这确保生成的 ID 被添加到 usersIds 数组中。\n\n接下来，你需要将模拟的 Post\
  \ 类型的 id 字段更改为以下函数：\n\n```\nid: () => {let uuid = casual.uuid; postsIds.push(uuid);\n\
  \        return uuid},\n```\n\n同样，这确保生成的帖子 ID 被添加到 postsIds 数组中。\n\n接下来，按如下方式向模拟的\
  \ Post 对象添加 author 字段：\n\n```\nauthor: casual.random_element(usersIds),\n```\n\n\
  接下来，按如下方式更改模拟的 Comment 对象的 author 字段：\n\n```\nauthor: casual.random_element(usersIds),\n\
  ```\n\n\n\nNext, add a user field to the Like type, as follows:\n\n```\nuser: casual.random_element(usersIds),\n\
  ```\n\nNext, change the post fields of the Comment and Like types, as follows:\n\
  \n```\npost: casual.random_element(postsIds)\n```\n\nWe've added all these modifications\
  \ to make sure the fields that point to users and posts are getting values from\
  \ the usersIds and postsIds arrays.\n\nFinally, you need to change the user and\
  \ author fields on the Post, Comment and Like types in our src/graphql/schema.graphql\
  \ file to the ID type instead of the User type:\n\n```\nauthor: ID!\nuser: ID!\n\
  ```\n\nThis is only temporary for the sake of mocking realistic data relationships.\n\
  \nNow, head back to Apollo Studio and run the following query:\n\n```\nquery {\n\
  \  searchUsers { id }\n  getPostsByUserId(userId:\"93c9c019\"){ id author }\n  getCommentsByPostId(postId:\"\
  93c9c019\"){ id author post }\n  getLikesByPostId(postId:\"93c9c019\"){ id user\
  \ post }\n}\n```\n\nMake sure that you pass the right values for userId and postId\
  \ as they will be different in your case since they are randomly generated values.\n\
  \nYou should get linked results – that is, the user and post fields will contain\
  \ values that are equal to the values that were generated for the posts' identifiers.\n\
  \nNow that we have realistic and linked data to test our API, we'll learn how to\
  \ configure CORS. This will help us connect to our GraphQL server from the Angular\
  \ frontend without getting blocked by the browser.\n\n## 配置 CORS\n\nCross-origin\
  \ resource sharing (CORS) refers to a mechanism by which we can allow or disallow\
  \ other domains from requesting restricted resources on a web page that are being\
  \ served from a specific domain.\n\nWe have already set up a server on port 8080\
  \ of our localhost machine and we'll be also running a development server of the\
  \ Angular CLI from another port in the next few chapters. Different ports on localhost\
  \ are considered different origins, so we need to configure CORS in our Express.js\
  \ server; otherwise, the requests from our Angular frontend will be disallowed.\n\
  \nFortunately for us, configuring CORS in Express.js is easy. Head to your Terminal\
  \ and run the following command from the root of the server folder to install the\
  \ cors module:\n\n```\nnpm install cors\n```\n\nNow, you need to open the src/index.ts\
  \ file and import the cors module:\n\n```\nimport cors from 'cors';\n```\n\nNext,\
  \ add the following line just below where you created an instance of the Express.js\
  \ application:\n\n```\napp.use(cors());\n```\n\nThis is the basic configuration\
  \ of CORS in our Express.js server, which allows any other domains to request data\
  \ from your server without restriction.\n\nYou can refer to the docs of the cors\
  \ module at https://expressjs.com/en/resources/middleware/cors.html for more options\
  \ for configuring CORS while protecting your server resources from non-authorized\
  \ access.\n\n## 摘要\n\nIn this chapter, we started implementing our backend application,\
  \ which will be exposing the GraphQL API. We created a project using Lerna to follow\
  \ the monorepo approach to organizing our code base, which will contain both the\
  \ server and client apps.\n\nWe installed Express.js and configured it with TypeScript\
  \ and also GraphQL via Apollo Server.\n\nNext, we created an initial GraphQL schema\
  \ for our small social network application and configured Apollo Server with mocking.\
  \ Then, we used the casual tool to use realistic values for our mock data.\n\nThanks\
  \ to mocking, we were able to run a working GraphQL server by providing only a schema\
  \ without implementing the resolvers.\n\nThis is a great feature that allows us\
  \ to easily test the GraphQL API without running a complete API server. It also\
  \ allows the frontend developer/team to start working on the features that require\
  \ data to be fetched from the server as quickly as possible without waiting for\
  \ the backend development to finish.\n\nNext, we used Apollo Studio to send queries\
  \ to our Apollo Server, which was able to return data that contains the shapes of\
  \ our schema types.\n\nFinally, we installed the `cors` module and configured CORS\
  \ in our Express/Apollo Server to enable our frontend application, which will be\
  \ running from a different port at localhost during development, to send requests\
  \ without getting blocked due to the same-origin policy in web browsers.\n\nIn the\
  \ next chapter, we'll continue our journey of building our backend application to\
  \ expose a fully working GraphQL API with resolvers that fetches data from a real\
  \ MySQL database.\n"
- "## 3 连接数据库与 TypeORM\n\nIn the last chapter, we learned how to set up a Node.js\
  \ server with GraphQL support to implement a backend application. Additionally,\
  \ we explained how to install Express.js and configure it with TypeScript and GraphQL.\
  \ We used mocking to provide a working GraphQL server with Apollo Server before\
  \ implementing the resolvers that should actually be responsible for fetching and\
  \ adding data.\n\nIn addition, we set up Cross-Origin Resource Sharing (CORS) and\
  \ used Apollo Studio to communicate with our GraphQL server.\n\nIn this chapter,\
  \ we'll look at how to connect a MySQL database to our application using TypeORM,\
  \ as well as how to create resolvers to get and save data from the database.\n\n\
  Now that we've built a backend application that can respond to GraphQL queries,\
  \ we'll need to connect it to our database in order to store our data. We'll utilize\
  \ TypeORM to abstract the database operations, allowing you to use any desired database\
  \ management system for your app without changing the code. In addition, we will\
  \ learn how to connect TypeORM with Apollo, as well as how to generate and seed\
  \ our database tables.\n\nWe will discuss the following topics in this chapter:\n\
  \n- Creating a MySQL user and database\n- Setting up TypeORM and MySQL in our server\
  \ project\n- Creating TypeORM entities\n- Seeding test data in our database\n- Using\
  \ Apollo together with TypeORM\n\n## 技术要求\n\nBefore you can proceed with the steps\
  \ in this chapter, you must first finish the steps in the previous chapter on how\
  \ to set up a functional GraphQL server. Please refer to Chapter 2, Setting Up GraphQL\
  \ with Node.js, Express.js, and Apollo, to learn how to build up a GraphQL server\
  \ using Express.js and Apollo Server.\n\nIt is important to note that your work\
  \ machine should have MySQL installed. Please refer to Chapter 1, App Architecture\
  \ and Development Environment, for instructions.\n\nYou should also be familiar\
  \ with the following technologies:\n\n- TypeScript\n- Node.js and npm\n- SQL (including\
  \ basic concepts such as tables, columns and their types, relationships, and primary\
  \ and foreign keys)\n- GraphQL basics (including resolvers, queries, and mutations)\n\
  \nIf you want to learn more about SQL, please see https://www.khanacademy.org/computing/computer-programming/sql.\n\
  \nYou should also go through TypeORM's official documentation, which is accessible\
  \ at https://typeorm.io/#/\n\nIf you need a review on the fundamentals of GraphQL,\
  \ please see https://graphql.org/learn/.\n\nThe code for this chapter may be found\
  \ in the GitHub repository at https://github.com/PacktPublishing/Full-Stack-App-Development-with-Angular-and-GraphQL/tree/main/Chapter03.\n\
  \n## 创建 MySQL 用户和数据库\n\nWhen we first installed MySQL on our development machine,\
  \ it created a root user who can manage the database system. This user has complete\
  \ access to the MySQL server, including all databases and tables.\n\nFurthermore,\
  \ beginning with MySQL v5.7, the root user can be authenticated via the auth socket\
  \ plugin rather than a username and password, as allowed by the MySQL client used\
  \ with TypeORM.\n\n> **Important Note**\n> \n> The name of the system user that\
  \ launches the MySQL client and the MySQL user must be the same when using the auth\
  \ socket plugin; moreover, you must execute mysql with sudo privileges to have access\
  \ to your database(s).\n\nFor the reasons stated above, it is required to create\
  \ a new user in MySQL and provide it with the right permissions. To do so, go through\
  \ the following steps:\n\n1. To begin, use the following command to connect to MySQL:\n\
  2. Once you've accessed the MySQL prompt, you may use SQL commands such as CREATE\
  \ USER to create a new user with a password that utilizes the mysql native password\
  \ plugin for authentication:\n3. We must provide it with the necessary permissions\
  \ using the following command:\n4. Then, use the following command to reload all\
  \ of the privileges:\n\n```\nsudo mysql\n```\n\nYou'll be asked to enter a password.\
  \ Enter your system's root password.\n\n```\nCREATE USER 'dbuser'@'localhost' IDENTIFIED\
  \ WITH mysql_native_password BY 'p4ssw0rd';\n```\n\nIn this case, we created a user\
  \ called dbuser with the password p4ssw0rd.\n\n```\nGRANT ALL PRIVILEGES ON *.*\
  \ TO dbuser@'localhost';\n```\n\nWe have given the user all of the privileges (that\
  \ is, full root access to everything in our database). This is not advised for security\
  \ reasons. However, keep in mind that this is simply a test database.\n\n```\nFLUSH\
  \ PRIVILEGES;\n```\n\n\n\n5. 退出当前的 MySQL 提示符：\n\n```\nexit;\n```\n\n6. 使用以下命令以新用户身份登录：\n\
  \n```\nmysql -u dbuser -p\n```\n\n输入分配给用户的密码，换句话说，p4ssw0rd。\n\n7. 最后，要创建数据库，请使用以下命令：\n\
  \n```\ncreate database socialdb;\n```\n\n就这样！我们有一个名为 dbuser 的用户，密码为 p4ssw0rd，以及一个\
  \ socialdb 数据库。这些凭据将在下一节中用于设置 TypeORM。\n\n## 设置 TypeORM 和 MySQL\n\n在本节中，我们将在服务器项目中安装和配置\
  \ TypeORM。\n\nTypeORM 是一个 Node.js 和 TypeScript 对象关系映射器（ORM）。它让你能够使用 TypeScript 以及类、装饰器和函数等高级编程结构来构建和查询数据库表，而不是使用\
  \ SQL 命令。\n\n返回到你的终端。要启动服务器，请确保你在服务器项目中，然后执行以下命令：\n\n```\ncd ngsocial/packages/server/\n\
  npm start\n```\n\n确认你位于服务器项目内部。之后，在另一个终端中执行以下命令：\n\n```\ncd ngsocial/packages/server/\n\
  npm install typeorm reflect-metadata mysql\n```\n\nreflect-metadata 库对于提供 TypeORM\
  \ 所需的 TypeScript 装饰器支持至关重要。\n\n接下来，打开 tsconfig.json 文件并进行以下更改：\n\n```\n{\n\"compilerOptions\"\
  : {\n\"target\": \"es6\",\n\"module\": \"commonjs\",\n\"rootDir\": \"./src\",\n\"\
  outDir\": \"./dist\",\n\"esModuleInterop\": true,\n\"strict\": true,\n\"experimentalDecorators\"\
  : true,\n\"emitDecoratorMetadata\": true,\n\"strictPropertyInitialization\": false\n\
  }\n}\n```\n\n我们添加了 experimentalDecorators 和 emitDecoratorMetadata 属性并将其设置为 true。我们还添加了\
  \ strictPropertyInitialization 并将其设置为 false。\n\n由于装饰器目前仍是实验性功能，experimentalDecorators\
  \ 属性为其提供实验性支持。emitDecoratorMetadata 属性告诉编译器发出装饰声明所需的元数据。为了生成装饰器元数据，我们必须在 TypeScript\
  \ 代码中导入 reflect-metadata 包。\n\nstrictPropertyInitialization 属性指示编译器是否应在类中启用或禁用严格属性初始化检查。\n\
  \n然后，打开 src/index.ts 文件并开始修改导入，如下所示：\n\n```\nimport express, { Application } from\
  \ 'express';\nimport { ApolloServer } from 'apollo-server-express';\nimport schema\
  \ from './graphql/schema';\nimport cors from 'cors';\nimport 'reflect-metadata';\n\
  import { createConnection, Connection } from 'typeorm';\n```\n\n然后，按如下方式编辑剩余代码：\n\
  \n```\nconst connection: Promise<Connection> = createConnection();\nconnection.then(()\
  \ => {\n    startApolloServer();\n}).catch(error => console.log(\"Database connection\
  \ error: \", error));\n```\n\n```ts\nasync function startApolloServer() {\n  const\
  \ PORT = 8080;\n  const app: Application = express();\n  app.use(cors());\n  const\
  \ server: ApolloServer = new ApolloServer({ schema });\n  await server.start();\n\
  \  server.applyMiddleware({\n    app,\n    path: '/graphql'\n  });\n  app.listen(PORT,\
  \ () => {\n    console.log('Server is running at http://localhost:${PORT}');\n \
  \ });\n}\n```\n\n为了支持装饰器，我们导入了 reflect-metadata 库。随后，我们从 TypeORM 包中导入了 createConnection\
  \ 函数，并删除了几个符号，例如 context，在本部分中不再需要。\n\nreflect-metadata 包是一个实用库，可增强 TypeScript 装饰器的功能。这对于\
  \ TypeORM 正常运行至关重要。\n\n然后丢弃了 mocks 对象，并更改了创建 Apollo Server 的行以移除 mocks 参数。在本部分中我们不需要\
  \ mocks，因为我们将创建实际的解析器。\n\n我们使用 createConnection 函数创建了 TypeORM 连接，然后调用了返回的 promise\
  \ 的 then() 方法。接下来，在 promise 的 then() 方法体中，我们调用了构建 Express 和 Apollo Server 的代码。这确保了只有在成功连接到\
  \ MySQL 数据库后服务器才会启动。\n\n如果出现问题，包含错误详细信息的数据库连接错误消息将被打印到控制台。\n\n由于我们在之前的步骤中已经启动了服务器，在保存文件后我们会收到\
  \ Database connection error: TypeORMError: No connection options were found in any\
  \ orm configuration files 错误。\n\n为了解决此问题，使用以下命令在 server/ 文件夹中创建 ormconfig.json 文件：\n\
  \n```\ntouch ormconfig.json\n```\n\n然后，在 ormconfig.json 文件中添加以下内容：\n\n```\n{\n \
  \ \"type\": \"mysql\",\n  \"host\": \"localhost\",\n  \"port\": 3306,\n  \"username\"\
  : \"dbuser\",\n  \"password\": \"p4ssw0rd\",\n  \"database\": \"socialdb\",\n  \"\
  synchronize\": true,\n  \"logging\": false,\n  \"entities\": [\n    \"src/entity/**/*.ts\"\
  \n  ],\n  \"migrations\": [\n    \"src/migration/**/*.ts\"\n  ],\n  \"subscribers\"\
  : [\n    \"src/subscriber/**/*.ts\"\n  ]\n}\n```\n\n这是 TypeORM 配置文件，我们在其中添加数据库连接配置设置，例如数据库类型（在我们的实例中为\
  \ mysql）、数据库主机和端口、数据库名称、用户名和密码。\n\n之后，如果一切配置正确，使用以下命令停止并重新启动开发服务器：\n\n```\nnpm start\n\
  ```\n\n因此，我们现在已经配置了 TypeORM。接下来，我们将介绍如何为我们的社交应用创建数据库实体。\n\n## 创建 TypeORM 实体\n\n\
  在本部分，我们将创建代表社交网络数据库的实体。实体是一个用 @Entity() 装饰器注解的 TypeScript 类，对应于数据库表。\n\n当使用纯 SQL\
  \ 而非 ORM 处理数据库时，你首先创建数据库表。使用 TypeORM 时，我们也必须首先创建实体。\n\n要创建实体，请将 @Entity() 装饰器添加到类定义中，并将\
  \ @Column（或等效）装饰器添加到类的每个属性中。这些注解为 TypeORM 提供了创建数据库表和列所需的信息。\n\n我们还可以使用以下装饰器在实体之间建立关联：\n\
  \n- OneToOne: This is used to create a one-to-one relationship between two objects.\n\
  - JoinColumn: This specifies which part of the relationship contains the join column.\n\
  - OneToMany: This specifies a one-to-many relationship between objects.\n- ManyToOne:\
  \ This specifies a many-to-one relationship between objects.\n- ManyToMany: This\
  \ is used to establish a many-to-many relationship among objects.\n- JoinTable:\
  \ This specifies the join columns of a many-to-many relationship.\n\n通过运行以下命令在 src/\
  \ 文件夹中创建一个名为 entity/ 的子目录：\n\n```\nmkdir src/entity\n```\n\n由于我们已根据应用需求定义了 GraphQL\
  \ 模式类型，因此我们可以根据模式结构简单地考虑数据库结构。\n\n因此，在我们的情况下，以下实体是必要的：\n\n- User\n- Post\n- Comment\n\
  - Like\n- Notification\n\n要定义实体，我们必须首先在 entity/ 文件夹下创建一个 TypeScript 文件。基本实体由一个或多个列组成，其中一个应为主列。\n\
  \n首先创建 src/entity/User.ts 文件，然后添加以下实体：\n\n```\nimport { Entity, Column, PrimaryGeneratedColumn,\
  \ CreateDateColumn } from 'typeorm';\n\n@Entity()\nexport class User {\n    @PrimaryGeneratedColumn()\
  \ id: number;\n    @Column() fullName: string;\n    @Column(\"text\", { nullable:\
  \ true }) bio: string;\n    @Column({ unique: true }) email: string;\n    @Column({\
  \ unique: true }) username: string;\n    @Column() password: string;\n    @Column({\
  \ nullable: true }) image: string;\n    @Column({ nullable: true }) coverImage:\
  \ string;\n    @Column({ default: 0 }) postsCount: number;\n    @CreateDateColumn()\
  \ createdAt: Date;\n}\n```\n\n如前所述，@Entity() 指示 TypeORM 将类映射到数据库表。为了让 TypeORM 更容易发现实体，我们将其放在\
  \ entity/ 文件夹中。这已在 ormconfig.json 文件的 entities 数组中预先配置。\n\n为了生成匹配数据库的表列，我们只需使用 @Column\
  \ 装饰器装饰希望作为列的类属性即可。\n\n默认情况下，TypeORM 会将字符串映射为类似 varchar 的类型（取决于数据库类型），将数字映射为类似 integer\
  \ 的类型。我们也可以通过向列装饰器提供所需类型来修改默认类型。值得注意的是，我们对 bio 列使用了 text 类型而不是受限的 varchar 类型。\n\n\
  TypeORM 将使用与实体相同的名称构建数据库表；但是，如果你想使用不同的表名，可以在 @Entity 装饰器中指定——例如，@Entity(\"mytablename\"\
  )。\n\n\n\n@PrimaryGeneratedColumn() 装饰器定义了一个主键 Int 列，该列会自动生成自增的值。\n\n我们为 postsCount\
  \ 列添加了 default 选项，指定其默认值为零；为 bio、image 和 coverImage 列添加了 nullable 选项，指定它们可以为 null；以及为\
  \ username 和 email 列添加了 unique 选项，指定不接受重复值。\n\n@CreateDateColumn() 装饰器会自动将实体的插入日期添加到\
  \ createdAt 列。\n\nid 列，其中包含相应数据库表的主键，以及 createdAt 列，其中包含插入日期，将会被所有实体共享。\n\n为了构建下一个实体，我们将使用相同的装饰器和参数。\n\
  \n为了表示用户的帖子，创建 src/entity/Post.ts 文件并添加以下实体：\n\n```ts\nimport { Entity, Column,\
  \ PrimaryGeneratedColumn,\nCreateDateColumn } from 'typeorm';\n\n@Entity()\nexport\
  \ class Post {\n    @PrimaryGeneratedColumn() id: number;\n    @Column(\"longtext\"\
  ) text: string;\n    @Column({ nullable: true }) image: string;\n    @Column({ default:\
  \ 0 }) commentsCount: number;\n    @Column({ default: 0 }) likesCount: number;\n\
  \    @Column({ default: \"\" }) latestLike: string;\n    @CreateDateColumn() createdAt:\
  \ Date;\n    @Column({ default: false }) likedByAuthUser: boolean;\n}\n```\n\n在这种情况下，我们为\
  \ text 列添加了 longtext 选项，以便将列类型从默认值（字符串字段的 varchar(255)）修改为 longtext。\n\n接下来，创建 src/entity/Comment.ts\
  \ 文件并添加以下实体来建模用户的评论：\n\n```ts\nimport { Entity, Column, PrimaryGeneratedColumn,\n\
  CreateDateColumn } from 'typeorm';\n\n@Entity()\nexport class Comment {\n    @PrimaryGeneratedColumn()\
  \ id: number;\n    @Column(\"text\") comment: string;\n    @CreateDateColumn() createdAt:\
  \ Date;\n}\n```\n\n为了表示用户的点赞，创建 src/entity/Like.ts 文件并添加以下实体：\n\n```ts\nimport {\
  \ Entity, PrimaryGeneratedColumn, CreateDateColumn }\nfrom 'typeorm';\n\n@Entity('likes')\n\
  export class Like {\n    @PrimaryGeneratedColumn() id: number;\n    @CreateDateColumn()\
  \ createdAt: Date;\n}\n```\n\n在 Entity 装饰器中，我们使用了 likes 作为表名，而不是 like 的名称，因为 like\
  \ 是 SQL 中的保留关键字。\n\n最后，将以下实体添加到 src/entity/Notification.ts 文件中以建模用户的通知：\n\n```ts\n\
  import { Entity, Column, PrimaryGeneratedColumn,\nCreateDateColumn } from 'typeorm';\n\
  \n@Entity()\nexport class Notification {\n    @PrimaryGeneratedColumn() id: number;\n\
  \    @Column() text: string;\n    @Column() postId: number;\n    @CreateDateColumn()\
  \ createdAt: Date;\n}\n```\n\n此部分的代码可在 GitHub commit at https://git.io/JzddQ 中找到。\n\
  \n接下来，我们必须根据以下要求在实体之间构建某些关系：\n\n- 用户可能拥有一个或多个通知、帖子、评论和点赞。\n- 帖子可能与一个或多个评论和点赞、作者以及最近的评论相关联。\n\
  \n返回 src/entity/User.ts 文件并包含以下导入：\n\n```ts\nimport { OneToMany } from 'typeorm';\n\
  import { Post } from './Post';\nimport { Comment } from './Comment';\nimport { Like\
  \ } from './Like';\nimport { Notification } from './Notification';\n```\n\n我们刚刚导入了将与用户实体关联的实体以及在此情况下用于构建一对多关系的装饰器。\n\
  \n接下来添加以下字段：\n\n```ts\n@Entity()\nexport class User {\n  // [...] \n  @OneToMany(type\
  \ => Post, post => post.author) posts:\n    Post[];\n  @OneToMany(type => Comment,\
  \ comment => comment.author)\n    comments: Comment[];\n  @OneToMany(type => Like,\
  \ like => like.user) likes:\n    Like[];\n  @OneToMany(type => Notification, notification\
  \ =>\n    notification.user) notifications: Notification[];\n}\n```\n\n在这里，我们添加了一些额外的数组类型字段，包括\
  \ posts、comments、likes 和 notifications，并使用 @OneToMany 注解。这是由 TypeORM 提供的实体关系之一。\n\
  \n使用实体关系时，TypeORM 会在表之间插入必要的外键。\n\n我们建模了用户可能拥有许多评论、点赞和通知的需求。\n\n此外，我们利用了 @OneToMany\
  \ 装饰器在两个实体之间构建一对多关系。\n\ntype => Post 语句是一个返回关联实体类的函数。由于语言限制，采用这种方法而不是直接使用类。() =>\
  \ Post 也是另一个选项。\n\n返回 src/entity/Post.ts 文件并插入以下导入：\n\n```ts\nimport { OneToOne,\
  \ OneToMany, ManyToOne, JoinColumn } from 'typeorm';\nimport { User } from './User';\n\
  import { Comment } from './Comment';\nimport { Like } from './Like';\n```\n\n我们导入了关联的用户、评论和点赞实体以及装饰器，以便创建一对一、一对多和多对一关系。\n\
  \n接下来添加以下字段：\n\n```ts\n@Entity()\nexport class Post {\n  // [...] \n  @OneToOne(type\
  \ => Comment, comment => comment.post, {\n    onDelete: 'SET NULL' })\n  @JoinColumn()\
  \ latestComment: Comment;\n  @ManyToOne(type => User, user => user.posts, { onDelete:\n\
  \    'CASCADE' }) author: User;\n  @OneToMany(type => Comment, comment => comment.post)\n\
  \  comments: Comment[];\n  @OneToMany(type => Like, like => like.post) likes:\n\
  \  Like[];\n}\n```\n\n我们为 author、latest comment、comments 和 likes 添加了额外的字段，并使用 @OneToMany、@ManyToOne\
  \ 和 @OneToOne 注解。\n\n我们建模了帖子可能拥有多个评论、多个点赞、一个最近评论和一个作者的需求。\n\n为了定义关系列在哪一端持有，我们使用了\
  \ @JoinColumn 装饰器。在此示例中为 post 表。这是必不可少的，并且应在关系的仅一端存在。\n\n返回 src/entity/Comment.ts\
  \ 文件并插入以下导入：\n\n```ts\nimport { ManyToOne } from 'typeorm';\nimport { User } from\
  \ './User';\nimport { Post } from './Post';\n```\n\n在这里，我们导入了想要形成关联的用户和帖子实体，以及多对一装饰器。\n\
  \n接下来添加以下字段：\n\n```ts\n@Entity()\nexport class Comment {\n  // [...]\n  @ManyToOne(type\
  \ => User, user => user.comments, {\n    onDelete: 'CASCADE' })\n  author: User;\n\
  \  @ManyToOne(type => Post, post => post.comments, {\n    onDelete: 'CASCADE' })\n\
  \  post: Post;\n}\n```\n\n我们在这里添加了 author 和 post 字段并使用 @ManyToOne 注解。这意味着一个人可以添加许多评论，而一个帖子可以有多个评论。这些是为用户和帖子实体指定的逆关系。\n\
  \n返回 src/entity/Like.ts 文件并包含以下导入：\n\n```ts\nimport { ManyToOne } from 'typeorm';\n\
  import { User } from './User';\nimport { Post } from './Post';\n```\n\n为了定义逆关系，我们导入了用户和帖子实体，以及多对一装饰器。\n\
  \n接下来添加以下字段：\n\n```ts\n@Entity('likes')\nexport class Like {\n  // [...] \n  @ManyToOne(type\
  \ => User, user => user.likes, { onDelete:\n    'CASCADE' })\n  user: User;\n  @ManyToOne(type\
  \ => Post, post => post.likes, { onDelete:\n    'CASCADE' })\n  post: Post;\n}\n\
  ```\n\n请注意，我们还为用户和帖子添加了额外的字段，并使用 @ManyToOne 注解来定义我们之前为用户和帖子实体创建的逆关系。\n\n返回 src/entity/Notification.ts\
  \ 文件并包含以下导入：\n\n```ts\nimport { ManyToOne } from 'typeorm';\nimport { User } from\
  \ './User';\n```\n\n在这里，我们导入了想要构建逆关系的用户实体，以及多对一装饰器。\n\n然后，包含以下字段：\n\n```ts\n@Entity()\n\
  export class Notification {\n  // [...] \n  @ManyToOne(type => User, user => user.notifications,\
  \ {\n    onDelete: 'CASCADE' })\n  user: User;\n}\n```\n\n我们使用 @ManyToOne 注解添加了通知所属用户的字段。这是用户实体中定义的关系的逆关系。\n\
  \n在此实体中，我们建模了一个或多个通知可能属于一个用户的需求。\n\n添加 TypeORM 关系 的代码可在 GitHub commit at https://git.io/JzdFl\
  \ 中找到。\n\n\n\n因此我们已经构建了建立社交应用数据库所需的实体，以及它们之间的关联。接下来，我们将介绍如何使用测试数据填充数据库表，这将使我们在下一节中能够轻松测试解析器的功能。\n\
  \n## 填充测试数据\n\n到目前为止，我们已经构建了数据库实体，让 TypeORM 构建 SQL 表。现在让我们向数据库中输入一些信息。你可以手动完成，但这会很耗费精力；我们需要足够自动化，以便能够快速启动运行。\n\
  \n我们可以通过利用 typeorm-seeding 包为我们的实体创建工厂和种子器来实现，这简化了流程。请执行以下步骤：\n\n- 1. 返回你的终端，并使用以下命令开始安装该包：\n\
  - 2. 安装 Faker 库的类型定义并创建 src/database/、database/seeds/ 和 database/factories/ 文件夹：\n\
  - 3. 在 package.json 文件中添加以下脚本以调用种子命令：\n- 4. 在 package.json 文件中添加以下命令，以便更轻松地删除和同步数据库：\n\
  \n```\nnpm install typeorm-seeding\n```\n\n```\nnpm install -D @types/faker\n```\n\
  \n```\ncd src/ && mkdir database\n```\n\n```\ncd database && mkdir seeds factories\n\
  ```\n\n```\n\"scripts\": {\n  \"seed:config\": \"ts-node ./node_modules/typeorm-seeding/dist/cli.js\
  \ config\",\n  \"seed:run\": \"ts-node ./node_modules/typeorm-seeding/dist/cli.js\
  \ seed\",\n  [...] \n}\n```\n\n```\n\"scripts\": {\n  \"schema:drop\": \"ts-node\
  \ ./node_modules/typeorm/cli.js schema:drop\",\n  \"schema:sync\": \"ts-node ./node_modules/typeorm/cli.js\
  \ schema:sync\",\n  [...] \n}\n```\n\n为了创建并用测试数据填充数据库，会使用一个种子类。它有一个名为 run 的单一方法，我们可以在其中使用\
  \ TypeORM 的查询构建器或实体工厂向数据库中输入数据。\n\n为了生成数据，我们可以使用实体工厂，而不是为每个实体种子单独提供属性。\n\n对于每个实体，我们需要创建一个工厂，在其中可以创建实体并返回它。这些工厂文件应创建在\
  \ src/database/factories 文件夹中，并以 .factory.ts 为后缀：\n\n- 1. 创建用户实体的工厂。创建 src/database/factories/user.factory.ts\
  \ 文件并添加以下代码：\n\n```ts\nimport Faker from 'faker';\nimport { define } from 'typeorm-seeding';\n\
  import { User } from '../../entity/User';\n\ndefine(User, (faker: typeof Faker)\
  \ => {\n    const user = new User()\n    user.fullName = faker.name.findName();\n\
  \    user.bio = faker.lorem.sentences();\n    user.email = faker.internet.email();\n\
  \    user.username = faker.internet.userName();\n    user.password = faker.internet.password();\n\
  \    user.image = faker.image.imageUrl();\n    user.coverImage = faker.image.imageUrl();\n\
  \    user.postsCount = 200;\n    user.createdAt = faker.date.past();\n    return\
  \ user;\n});\n```\n\n- 2. 在 src/database/factories/post.factory.ts 文件中为 post 实体创建工厂：\n\
  \n```\nimport Faker from 'faker';\nimport { define, factory } from 'typeorm-seeding';\n\
  import { Post } from '../../entity/Post';\n\ndefine(Post, (faker: typeof Faker)\
  \ => {\n  const post = new Post();\n  post.text = faker.lorem.text();\n  post.image\
  \ = faker.image.imageUrl();\n  post.commentsCount = 100;\n  post.likesCount = 200;\n\
  \  post.latestLike = faker.name.findName();\n  post.createdAt = faker.date.past();\n\
  \  return post;\n});\n```\n\n- 3. 使用以下代码在 src/database/factories/comment.factory.ts\
  \ 文件中创建 comment 工厂：\n\n```\nimport Faker from 'faker';\nimport { define, factory\
  \ } from 'typeorm-seeding';\nimport { Comment } from '../../entity/Comment';\n\n\
  define(Comment, (faker: typeof Faker) => {\n  const comment = new Comment();\n \
  \ comment.comment = faker.lorem.text();\n  comment.createdAt = faker.date.past();\n\
  \  return comment;\n});\n```\n\n- 4. 按如下方式在 src/database/factories/like.factory.ts\
  \ 文件中创建 like 工厂：\n\n```\nimport Faker from 'faker';\nimport { define } from 'typeorm-seeding';\n\
  import { Like } from '../../entity/Like';\n\ndefine(Like, (faker: typeof Faker)\
  \ => {\n    const like = new Like();\n    like.createdAt = faker.date.past();\n\
  \    return like;\n});\n```\n\n- 5. 按如下方式在 src/database/factories/notification.factory.ts\
  \ 文件中创建 notification 工厂：\n\n```\nimport Faker from 'faker';\nimport { define } from\
  \ 'typeorm-seeding';\nimport { Notification } from '../../entity/Notification';\n\
  \ndefine(Notification, (faker: typeof Faker) => {\n    const notification = new\
  \ Notification();\n    notification.text = faker.lorem.words();\n    notification.postId\
  \ = 1;\n    notification.createdAt = faker.date.past();\n    return notification;\n\
  });\n```\n\n之后，你必须在 src/database/seeds/create-users.seed.ts 文件中创建一个种子类：\n\n- 6.\
  \ 首先包含以下导入：\n\n```\nimport { Seeder, Factory } from 'typeorm-seeding';\nimport {\
  \ User } from '../../entity/User';\nimport { Post } from '../../entity/Post';\n\
  import { Comment } from '../../entity/Comment';\nimport { Like } from '../../entity/Like';\n\
  import { Notification } from '../../entity/Notification';\n```\n\n- 7. 按如下方式定义种子类：\n\
  \n```\nexport default class CreateUsers implements Seeder {\n    public async run(factory:\
  \ Factory): Promise<void> {\n    }\n}\n```\n\n- 8. 在 run 方法内部，添加以下代码以使用用户工厂的 createMany\
  \ 方法创建 15 个用户：\n\n```\nawait factory(User)().map(async (user: User) => {\n  return\
  \ user;\n}).createMany(15);\n```\n\n- 9. 在 map 方法内部，添加以下代码以创建 1 到 10 之间的随机数量的评论：\n\
  \n```\nconst comments: Comment[] = await factory\n  (Comment)().map(async (comment:\
  \ Comment) => {\n    comment.author = await\n      factory(User)().create();\n \
  \   return comment;\n  }).createMany(Math.floor(Math.random() * 10)\n  + 1);\n```\n\
  \n- 10. 同样地，创建 1 到 10 之间的随机数量的点赞：\n\n```\nconst likes: Like[] = await\n  factory(Like)().map(async\
  \ (like: Like) => {\n    like.user = await\n      factory(User)().create();\n  \
  \  return like;\n  }).createMany(Math.floor(Math.random() * 10)\n  + 1);\n```\n\n\
  - 11. 接下来，创建 1 到 10 之间的随机数量的帖子，并使用以下代码将之前创建的评论和点赞关联到这些帖子：\n\n```\nconst userPosts:\
  \ Post[] = await\n  factory(Post)().map(async (post: Post) => {\n    post.comments\
  \ = comments;\n    post.likes = likes;\n    post.latestComment = await\n      factory(Comment)().map(async\
  \ (comment:\n        Comment) => {\n        comment.author = await\n          factory(User)().create();\n\
  \        return comment;\n      }).create();\n    return post;\n  }).createMany(Math.floor(Math.random()\
  \ * 10)\n  + 1);\n```\n\n- 12. 创建通知并按如下方式将其与帖子和当前用户关联：\n\n```\nconst postIds = userPosts.map((post:\
  \ Post)\n=> post.id);\nconst notifications: Notification[] = await\nfactory(Notification)().map(async\n\
  (notification: Notification) => {\nconst postId: number = postIds.pop() as\nnumber;\n\
  notification.postId = postId;\nreturn notification;\n}).createMany(postIds.length);\n\
  ```\n\n- 13. 最后，按如下方式在 map 主体中将帖子和通知与当前用户关联：\n\n```\nuser.posts = userPosts;\nuser.notifications\
  \ = notifications;\nreturn user;\n```\n\n就这样！这个类将负责生成所有必要的假数据并在它们之间关联条目，就像在现实场景中一样。\n\
  \n之后，我们需要执行以下命令来启动种子器：\n\n```\nnpm run seed:run\n```\n\n本节的代码可在 https://git.io/JzdbJ\
  \ 的提交中找到。更多信息，请查看 https://www.npmjs.com/package/typeorm-seeding。\n\n现在我们已经用一些测试数据填充了数据库，让我们实现解析器。\n\
  \n## 使用 Apollo 与 TypeORM\n\n在我们创建了实体并插入了一些测试数据后，我们将研究如何将 Apollo 与 TypeORM 集成。在本节中，我们将定义我们的\
  \ GraphQL 解析器，这些解析器是在向我们的 GraphQL 端点发送查询和变更时将被调用的函数：\n\n- 1. 首先，你需要在 src/graphql/schema.graphql\
  \ 文件中，将我们 GraphQL 模式的 Post、Comment 和 Like 类型上的 user 和 author 字段改回 User 类型而不是 ID：\n\
  - 2. 此外，将 Comment 和 Like 类型中 post 字段的类型从 ID 改为 Post：\n\n```\nauthor: User!\nuser:\
  \ User!\n```\n\n```\npost: Post!\n```\n\n在实现模式解析器之前，我们需要创建类型以确保解析器代码的类型安全。幸运的是，我们不必手动完成。相反，我们可以使用\
  \ GraphQL Code Generator，这是一个使用简单 CLI 从你的 GraphQL 模式和操作生成代码的工具。有关此工具的更多信息，请参阅 https://www.graphql-code-generator.com/。\n\
  \n由于这些类型是生成的代码，我们将把它们放在自己的包中，然后从我们的解析器中导入它们。\n\n接下来，我们将研究如何使用 Lerna 创建一个包并配置它以能够导入生成的类型：\n\
  \n- 1. 如果你的服务器仍在运行，请停止它并执行以下命令来创建 graphql-types 包：\n\n```\ncd ../../\nlerna create\
  \ graphql-types\n```\n\n请注意，你将被询问有关你的包的一些问题。接受默认值并按 Enter。\n\n一个新的 graphql-types\
  \ 包将在 ./packages/graphql-types 中创建。\n\n\n\n现在我们项目中已经有多个包（带有 package.json 文件的文件夹），让我们使用\
  \ npm workspaces（由 npm v7+ 支持）来高效地管理我们 monorepo 项目中所有包的依赖关系。\n\n- 2. 只需在 ngsocial/package.json\
  \ 根文件中添加 workspaces 键，以告知 npm 我们的包所在位置：\n\n```\n{\n  \"name\": \"@ngsocial/ngsocial\"\
  ,\n  \"private\": true,\n  \"devDependencies\": {\n    \"lerna\": \"^4.0.0\"\n \
  \ },\n  \"version\": \"0.0.1\",\n  \"workspaces\": [\"./packages/*\"]\n}\n```\n\n\
  请注意，我们还将根包的名称更改为 @ngsocial/ngsocial 以创建作用域包。有关更多信息，请参阅 https://docs.npmjs.com/cli/v7/using-npm/scope。\n\
  \nLerna 和 npm 现在都可以在 ./packages 文件夹中找到包。如果许多包需要相同的依赖项，得益于 npm workspaces，它可以在根目录中安装一次，然后从其他包中导入而不会出现问题。\n\
  \n继续我们的步骤：\n\n- 1. 按如下所示在我们 monorepo 项目的根目录中安装 GraphQL Codegen 和所需的插件：\n\n```\n\
  npm install @graphql-codegen/cli @graphql-codegen/typescript @graphql-codegen/typescript-resolvers\n\
  ```\n\n值得注意的是，我们也可以在 graphql-types 包内安装这些依赖项；然而，官方文档建议在根目录中安装 Codegen。有关更多详细信息，请参阅\
  \ https://www.graphql-code-generator.com/docs/getting-started/development-workflow。\n\
  \n2. 创建 ngsocial/codegen.yml 文件并添加以下内容：\n\n```\nschema: './packages/server/src/graphql/schema.graphql'\n\
  generates:\n  ./packages/graphql-types/src/resolvers-types.ts:\n    plugins:\n \
  \     - typescript\n      - typescript-resolvers\n```\n\n3. 打开 ngsocial/package.json\
  \ 文件并添加以下脚本：\n\n```\n\"scripts\": {\n  \"codegen\": \"npx graphql-codegen --watch\"\
  \n},\n```\n\n此脚本将以监视模式启动 GraphQL Codegen。\n\n然后，使用以下命令启动它：\n\n```\nnpm run codegen\n\
  ```\n\n这将创建一个包含我们模式解析器所需所有类型的文件 graphql-types/src/resolvers-types.ts。\n\n由于这是一个包含在另一个包中的\
  \ TypeScript 文件，我们必须能够将其导入到位于不同包中的服务器代码中。为此，我们可以使用具有适当设置的 tsconfig.json 文件和一个 index.ts\
  \ 文件。\n\n4. 创建 packages/graphql-types/tsconfig.json 文件并添加以下内容：\n\n```\n{\n  \"compilerOptions\"\
  : {\n    \"outDir\": \"lib\",\n    \"rootDir\": \"src\",\n    \"baseUrl\": \"./\"\
  ,\n    \"composite\": true\n  },\n  \"include\": [\"src/**/**\"],\n  \"exclude\"\
  : [\"node_modules\", \"**/__tests__/**\"]\n}\n```\n\n\"composite\": true 选项是必需的，以便能够从其他包中引用此包。\n\
  \n接下来，创建 packages/graphql-types/src/index.ts 文件并添加以下代码：\n\n```\nexport * from './resolvers-types';\n\
  ```\n\n这确保了我们导出所需的所有符号。\n\n接下来，你需要打开 graphql-types/package.json 文件并将 name 更改为 @ngsocial/graphql\
  \ 以创建作用域包。\n\n- 5. 最后，你需要打开 server/tsconfig.json 文件并按如下方式更新它：\n\n```\n{\n  \"compilerOptions\"\
  : {\n    [...] \n    \"paths\": {\n      \"@ngsocial/graphql\": [\"../graphql-types/src\"\
  ]\n    }\n  },\n  \"references\": [{ \"path\": \"../graphql-types\" }]\n}\n```\n\
  \n你需要确保 paths 对象中指定的路径名与 graphql-types/package.json 文件中的名称匹配，在我们的例子中是 @ngsocial/graphql。\n\
  \n就这样！我们现在可以通过编写以下内容导入生成的 GraphQL 类型：\n\n```\nimport { Resolvers, User, QueryGetUserArgs\
  \ } from '@ngsocial/graphql';\n```\n\n为了确保项目各包中命名的一致性，请编辑 server/package.json 文件并将名称更改为\
  \ @ngsocial/server。\n\n你可以在 GitHub 上查看这些步骤的更新，网址为 https://git.io/Jzd77。\n\n接下来，让我们执行几个更多步骤：\n\
  \n1. 创建 server/src/entity/index.ts 文件并添加以下导入：\n\n```\nexport { User } from './User';\n\
  export { Post } from './Post';\nexport { Comment } from './Comment';\nexport { Like\
  \ } from './Like';\nexport { Notification } from './Notification';\n```\n\n我们没有从各自的文件导入每个实体，而是添加了一个\
  \ barrel 文件，允许我们使用简短路径导入实体，如下所示：\n\n```\nimport { User, Post, Comment, Like, Notification\
  \ } from './entity';\n```\n\n有关 barrel 文件的更多信息，请参阅 https://basarat.gitbook.io/typescript/main-1/barrel。\n\
  \n2. 打开 server/src/index.ts 文件并添加突出显示的导入：\n\n```\nimport { createConnection, Connection,\
  \ Repository, getRepository } from 'typeorm';\n```\n\n```\nimport { User, Post,\
  \ Comment, Like, Notification } from './entity';\n```\n\n我们将使用 typeorm 包中的 Repository\
  \ 和 getRepository() 符号来操作我们的实体。\n\n在 TypeORM 中，repository 是一个抽象层，提供了一组用于查询和保存实体到数据库的操作。有关更多信息，请查看\
  \ https://typeorm.io/#/working-with-repository 和 https://typeorm.io/#/entities。\n\
  \n每个实体都有一个包含用于操作该实体的方法的 repository。可以使用 getRepository() 方法创建 repository，然后传递实体，如下所示：\n\
  \n```\nuserRepository = getRepository(User);\n```\n\n3. 按如下方式定义并导出 Context 类型：\n\
  \n```\nexport type Context = {\n  orm: {\n    userRepository: Repository<User>;\n\
  \    postRepository: Repository<Post>;\n    commentRepository: Repository<Comment>;\n\
  \    likeRepository: Repository<Like>;\n    notificationRepository: Repository<Notification>;\n\
  \  };\n};\n```\n\n此类型将用于为传递给解析器的 context 对象提供类型。此时，我们只传递一个包含用于操作数据库的 TypeORM repositories\
  \ 的 orm 对象。\n\n- 4. 在 startApolloServer() 方法中，紧跟在 app.use(cors()) ; 行下方添加以下代码：\n\
  \n```\n    const userRepository: Repository<User> =\n        getRepository(User);\n\
  \    const postRepository: Repository<Post> =\n        getRepository(Post);\n  \
  \  const commentRepository: Repository<Comment> =\n        getRepository(Comment);\n\
  \    const likeRepository: Repository<Like> =\n        getRepository(Like);\n  \
  \  const notificationRepository:\n        Repository<Notification> =\n        getRepository(Notification);\n\
  ```\n\n接下来，定义 Context 类型的 context 对象并向其中添加 TypeORM repositories，如下所示：\n\n```\n \
  \   const context: Context = {\n        orm: {\n            userRepository: userRepository,\n\
  \            postRepository: postRepository,\n            commentRepository: commentRepository,\n\
  \            likeRepository: likeRepository,\n            notificationRepository:\
  \ notificationRepository\n        }\n    };\n```\n\n5. 最后，如以下代码所示，替换创建 Apollo Server\
  \ 时提供 context 和 schema 的代码行：\n\n```ts\nconst server: ApolloServer = new ApolloServer({\
  \ schema,\n  context });\n```\n\n为了与数据库协作，我们现在可以在解析器中使用此 context 对象以及提供的 repositories。我们也可以选择在解析器中为每个实体调用\
  \ getRepository() 函数，但出于多种原因（包括易于测试），这是首选解决方案。你可以在 https://git.io/JzdQM 的提交中查看之前步骤的更改。\n\
  \n接下来，我们将为我们的 GraphQL 模式实现解析器：\n\n1. 打开 server/src/graphql/resolvers.ts 文件并按如下方式更新导入：\n\
  \n```ts\nimport { Context } from '...';\nimport {\n  Resolvers,\n  User,\n  Post,\n\
  \  Comment,\n  Like,\n  Notification } from '@ngsocial/graphql';\nimport { ApolloError\
  \ } from 'apollo-server-errors';\n```\n\n2. 将 resolvers 对象的类型更新为 Resolvers 而不是 IResolvers：\n\
  \n```ts\nconst resolvers: Resolvers = {\n  Query: {\n    message: () => 'It works!'\n\
  \  }\n};\nexport default resolvers;\n```\n\n因此，我们所有的模式解析器及其参数都将是类型安全的。\n\n\n\n\n\
  我们利用自定义的 Context 类型作为解析器的上下文对象，因为它使用 any 进行类型化。我们也可以告诉 GraphQL Codegen 使用此类型作为上下文。有关更多详细信息，请参阅\
  \ https://the-guild.dev/blog/better-type-safety-for-resolvers-with-graphql-codegen。\n\
  \n接下来，在 Query 对象内部，逐一添加下面列出的解析器函数，用逗号分隔：\n\n- 1. 首先包含 getUser 查询解析器，用于通过 ID 查找用户：\n\
  \n```ts\ngetUser: async (_, args, ctx: Context) => {\n    const orm = ctx.orm;\n\
  \    const user = await orm\n        .userRepository\n        .findOne({\n     \
  \       where:\n                { id: args.userId }});\n    if (!user) {\n     \
  \   throw new ApolloError(\n            \"No user found\",\n            \"USER_NOT_FOUND\"\
  );\n    }\n    return user as unknown as User;\n}\n```\n\n为了找到指定 ID 的用户，我们利用从解析器上下文传递的\
  \ orm 对象中获取的用户存储库的 findOne() 方法。如果未找到用户，则会抛出 Apollo 错误。\n\n在返回之前，我们将来自 User 实体 的\
  \ user 对象转换为 User 类型，并且由于 TypeScript 警告类型重叠不足，因此我们首先将对象转换为 unknown 类型。\n\n- 2. 实现\
  \ getPostsByUserId 解析器以根据用户 ID 检索帖子：\n\n```ts\ngetPostsByUserId: async (_, args,\
  \ ctx: Context) => {\n    const posts = await ctx.orm.postRepository\n        .createQueryBuilder(\"\
  post\")\n        .where({ author: { id: args.userId } })\n        .leftJoinAndSelect(\"\
  post.author\", \"post_author\")\n        .leftJoinAndSelect(\"post.latestComment\"\
  ,\n    \"latestComment\")\n        .leftJoinAndSelect(\"latestComment.author\",\n\
  \    \"latestComment_author\")\n        .leftJoinAndSelect(\"post.likes\", \"likes\"\
  )\n        .leftJoinAndSelect(\"likes.user\", \"likes_user\")\n        .orderBy(\"\
  post.createdAt\", \"DESC\")\n        .skip(args.offset as number)\n        .take(args.limit\
  \ as number)\n        .getMany();\n    return posts as unknown as Post[];\n}\n```\n\
  \nTypeORM 中的查询生成器允许您创建和执行基本和高级 SQL 查询。在这种情况下，post 是所选帖子的别名。别名用于访问所选数据的列。\n\n有关如何使用查询生成器的更多信息，请参阅\
  \ https://typeorm.io/#/select-query-builder。\n\n3. 实现 getFeed 解析器以获取所有网络用户帖子的动态：\n\
  \n```ts\ngetFeed: async (_, args, ctx: Context) => {\n    const feed = await ctx.orm.postRepository\n\
  \        .createQueryBuilder(\"post\")\n        .leftJoinAndSelect(\"post.author\"\
  , \"post_author\")\n        .leftJoinAndSelect(\"post.latestComment\",\n       \
  \     \"latestComment\")\n        .leftJoinAndSelect(\"latestComment.author\",\n\
  \            \"latestComment_author\")\n        .leftJoinAndSelect(\"post.likes\"\
  , \"likes\")\n        .leftJoinAndSelect(\"likes.user\", \"likes_user\")\n     \
  \   .orderBy(\"post.createdAt\", \"DESC\")\n        .skip(args.offset as number)\n\
  \        .take(args.limit as number)\n        .getMany();\n    return feed as unknown\
  \ as Post[];\n}\n```\n\n4. 实现 getNotificationsByUserId 解析器，用于根据其 ID 检索属于用户的通知：\n\
  \n```ts\ngetNotificationsByUserId: async (_, args, ctx: Context) => {\n  const notifications\
  \ = await\n    ctx.orm.notificationRepository\n    .createQueryBuilder(\"notification\"\
  )\n    .innerJoinAndSelect(\"notification.user\", \"user\")\n    .where(\"user.id\
  \ = :userId\", { userId: args.userId })\n    .orderBy(\"notification.createdAt\"\
  , \"DESC\")\n    .skip(args.offset as number)\n    .take(args.limit as number)\n\
  \    .getMany();\n  return notifications as unknown as Notification[];\n}\n```\n\
  \n5. 实现 getCommentsByPostId 解析器以根据其 ID 获取帖子的评论：\n\n```ts\ngetCommentsByPostId: async\
  \ (_, args, ctx: Context) => {\n  return await ctx.orm.commentRepository\n    .createQueryBuilder(\"\
  comment\")\n    .innerJoinAndSelect(\"comment.author\", \"author\")\n    .innerJoinAndSelect(\"\
  comment.post\", \"post\")\n    .where(\"post.id = :id\", { id: args.postId as string\
  \ })\n    .orderBy(\"comment.createdAt\", \"DESC\")\n    .skip(args.offset as number)\n\
  \    .take(args.limit as number)\n    .getMany() as unknown as Comment[];\n}\n```\n\
  \n6. 实现 getLikesByPostId 解析器以根据其 ID 获取帖子的点赞：\n\n```ts\ngetLikesByPostId: async (_,\
  \ args, ctx: Context) => {\n    return await ctx.orm.likeRepository\n        .createQueryBuilder(\"\
  like\")\n        .innerJoinAndSelect(\"like.user\", \"user\")\n        .innerJoinAndSelect(\"\
  like.post\", \"post\")\n        .where(\"post.id = :id\", { id: args.postId })\n\
  \        .orderBy(\"like.createdAt\", \"DESC\")\n        .skip(args.offset as number)\n\
  \        .take(args.limit as number)\n        .getMany() as unknown as Like[];\n\
  }\n```\n\n7. 实现 searchUsers 解析器以按姓名或用户名搜索用户：\n\n```ts\nsearchUsers: async (_, args,\
  \ ctx: Context) => {\n    const users = await ctx.orm.userRepository\n        .createQueryBuilder(\"\
  user\")\n        .where('user.fullName Like'\n            '%${args.searchQuery}%')\n\
  \        .orWhere('user.username Like'\n            '%${args.searchQuery}%')\n \
  \       .getMany();\n    return users as unknown as User[];\n}\n```\n\n现在我们已经实现了查询，让我们继续进行突变。将以下方法添加到\
  \ Mutation 对象中：\n\n1. 首先包含以下解析器：\n\n```ts\npost: (_, args, ctx: Context) => {\n\
  \    throw new ApolloError(\"Not implemented yet\",\n        \"NOT_IMPLEMENTED_YET\"\
  );\n},\ncomment: (_, args, ctx: Context) => {\n    throw new ApolloError(\"Not implemented\
  \ yet\",\n        \"NOT_IMPLEMENTED_YET\");\n},\nlike: (_, args, ctx: Context) =>\
  \ {\n    throw new ApolloError(\"Not implemented yet\",\n    \"NOT_IMPLEMENTED_YET\"\
  );\n},\nremoveLike: async (_, args, ctx: Context) => {\n    throw new ApolloError(\"\
  Not implemented yet\",\n    \"NOT_IMPLEMENTED_YET\");\n}\n```\n\n我们在这里只是抛出一个 Apollo\
  \ 错误，表示该解析器在本章中尚未实现。我们将在下一章中实现它们，在实现身份验证后，因为我们需要有关当前（已认证）用户的信息。\n\n- 2. 实现 removePost\
  \ 解析器以通过其 ID 从数据库中删除帖子，如下所示：\n\n```ts\nremovePost: async (_, args, {orm}: Context)\
  \ => {\n    const post = await orm.postRepository.findOne(\n        args.id, { relations:\
  \ ['author'] });\n    if (!post) {\n        throw new ApolloError(\"Post not found\"\
  ,\n            \"POST_NOT_FOUND\");\n    }\n    const result: DeleteResult = await\n\
  \        orm.postRepository.createQueryBuilder()\n        .delete().from(PostEntity).where(\"\
  id = :id\", { id:\n            args.id }).execute();\n    const postsCount = post?.author?.postsCount;\n\
  \    if (postsCount && postsCount >= 1) {\n        await orm.userRepository.update({\
  \ id:\n            post?.author.id }, { postsCount: postsCount - 1\n        });\n\
  \    }\n    if (result.affected && result.affected <= 0) {\n        throw new ApolloError(\"\
  Post not deleted\",\n            \"POST_NOT_DELETED\");\n    }\n    return args.id;\n\
  }\n```\n\n有关更多详细信息，请查看 https://typeorm.io/#/delete-query-builder。\n\n3. 实现 removeComment\
  \ 解析器以通过其 ID 从数据库中删除评论：\n\n```ts\nremoveComment: async (_, args, {orm}: Context)\
  \ => {\n    const comment = await orm.commentRepository.findOne(\n        args.id,\
  \ {relations:['author', 'post']});\n    if (!comment) {\n        throw new ApolloError(\"\
  Comment not found\",\n            \"COMMENT_NOT_FOUND\");\n    }\n\n    const result:\
  \ DeleteResult = await\n        orm.commentRepository.delete(args.id);\n    if (result.affected\
  \ && result.affected <= 0) {\n        throw new ApolloError(\"Comment not deleted\"\
  ,\n            \"COMMENT_NOT_DELETED\");\n    }\n\n    const commentsCount = comment?.post?.commentsCount;\n\
  \    if (commentsCount && commentsCount >= 1) {\n        await orm.postRepository.update(comment.post.id,\
  \ {\n            commentsCount: commentsCount - 1 });\n    }\n\n    return comment\
  \ as unknown as Comment;\n}\n```\n\n4. 实现 removeNotification 解析器以通过其 ID 从数据库中删除通知：\n\
  \n```ts\nremoveNotification: async (_, args, {orm}: Context) => {\n    const notificationRepository\
  \ =\n        orm.notificationRepository;\n    const notification = await\n```\n\n\
  ```\nnotificationRepository.findOne(args.id,\n    {relations:['user']});\nif(!notification){\n\
  \    throw new ApolloError(\"Notification not found\",\n        \"NOTIFICATION_NOT_FOUND\"\
  );\n}\nconst result: DeleteResult = await\n    notificationRepository.delete(args.id);\n\
  if(result.affected && result.affected <= 0) {\n    throw new ApolloError(\"Notification\
  \ not deleted\",\n        \"NOTIFICATION_NOT_DELETED\");\n}\nreturn args.id;\n}\n\
  ```\n\n值得注意的是，我们没有包含创建通知的 mutation。这是因为它们必须在人们评论或点赞内容时创建。因此，我们可以在每次新增评论或点赞实体时简单地创建它们。\n\
  \n我们可以通过在 Comment 和 Like 实体某些方法上使用 AfterInsert 装饰器来实现，该装饰器将在实体插入数据库后被调用：\n\n- 1.\
  \ 打开 server/src/entity/Comment.ts 文件并添加以下导入：\n- 2. 向类中添加 createNotification() 方法并使用\
  \ AfterInsert 装饰器对其进行注解，如下所示：\n\n```\nimport { AfterInsert, getRepository } from\
  \ 'typeorm';\nimport { Notification } from './Notification';\n```\n\n```\n@AfterInsert()\n\
  async createNotification() {\n    if (this.post && this.post.id) {\n        const\
  \ notificationRepository =\n            getRepository(Notification);\n        const\
  \ notification =\n            notificationRepository.create();\n```\n\n```\nnotification.user\
  \ = await getRepository(\n    User).createQueryBuilder(\"user\")\n    .innerJoinAndSelect(\"\
  user.posts\", \"post\")\n    .where(\"post.id = :id\", { id: this.post.id })\n \
  \   .getOne() as User;\n    notification.postId = this.post.id;\n    notification.text\
  \ = '${this.author.fullName}\n    commented on your post';\n    await notificationRepository.save(notification);\n\
  \  }\n}\n```\n\n使用通知存储库的方法，我们在该方法内创建必要的通知。\n\n然后我们必须在 Like 实体上重复此过程：\n\n- 1. 向 server/src/entity/Like.ts\
