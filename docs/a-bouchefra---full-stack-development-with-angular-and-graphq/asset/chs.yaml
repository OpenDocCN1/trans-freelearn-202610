  \            'Your profile photo is successfully updated.'\n        )\n    },\n\
  \    error: (err) => this.handleErrors(err)\n}\n```\n\n10. 定义 private handleSuccess()\
  \ 方法：\n\n```\nprivate handleSuccess(\n    userResult: Partial<Maybe<User>>,\n  \
  \  message: string) {\n    if (userResult) {\n        this.displayMessage(message);\n\
  \        const prevAuthState = authState();\n        authState({\n            ...prevAuthState,\n\
  \            currentUser: userResult as UserModel\n        });\n        if (this.authUser)\
  \ {\n            this.authUser = userResult as User;\n            this.authService\n\
  \                .storeUser(this.authUser as any);\n        }\n    }\n}\n```\n\n\
  11. 定义以下方法，通过将 showEditSection 属性设置为 true/false 来显示/隐藏个人资料的编辑部分：\n\n```\nenableDisableEditing():\
  \ void {\n    this.showEditSection = !this.showEditSection;\n}\n```\n\n定义以下方法，当用户从系统文件对话框中选择照片时将被调用：\n\
  \n```\nonPhotoSelected(event: Event): void {\n  const files: FileList =\n    (event.target\
  \ as HTMLInputElement)\n      .files!;\n  if (files.length > 0) {\n    const photoFile\
  \ = files[0];\n    this.setUserPhoto(photoFile);\n  }\n}\n```\n\n我们从事件对象获取图像文件，并使用组件的\
  \ setUserPhoto() 方法将其上传。\n\n12. 最后，定义当用户为个人资料封面选择照片时将被调用的方法：\n\n```\nonCoverSelected(event:\
  \ Event) {\n  const files: FileList =\n    (event.target as HTMLInputElement)\n\
  \      .files!;\n  if (files.length > 0) {\n    const coverFile = files[0];\n  \
  \  this.setUserCover(coverFile);\n  }\n}\n```\n\n此方法与前一个方法类似，当用户从系统文件对话框中选择封面图像时会被调用。我们从事件对象获取封面图像，并使用\
  \ setUserCover() 将其上传到服务器。\n\n在进入下一节之前，我们需要在身份验证服务中更改一种行为：当令牌过期时，我们需要从 localStorage\
  \ 中删除当前用户和令牌。\n\n只需打开 core/services/auth/auth.service.ts 文件并对构造函数进行以下更改：\n\n```\n\
  constructor(\n  /* ... */\n) {\n  const localToken = this.getLocalToken();\n  let\
  \ isLoggedIn = false;\n  if (localToken) {\n    isLoggedIn = this.tokenExists()\
  \ && !this.tokenExpired(localToken);\n  }\n  if(!isLoggedIn){\n    localStorage.removeItem(ACCESS_TOKEN);\n\
  \    localStorage.removeItem(AUTH_USER);\n  }\n  // [...] \n}\n```\n\n如果令牌过期，isLoggedIn\
  \ 变量包含 false 值。在这种情况下，访问令牌和身份验证用户将从 localStorage 中移除。\n\n## 定义字段策略\n\n在开始构建 UI 之前，我们必须先在用户字段显示在个人资料\
  \ UI 上之前对其应用一些转换。我们可以通过多种方式实现这一点，包括使用内置或自定义的 Angular 指令和管道，以及 Apollo Client 的类型和字段策略。\n\
  \n让我们看看如何使用字段策略来转换用户的 coverImage 和 createdAt 字段：\n\n- 1. 打开 client/src/app/cache.ts\
  \ 文件并按如下方式将 User 类型策略添加到内存缓存的 typePolicies 对象中：\n- 2. 然后，在 fields 对象中，添加要转换的字段，从\
  \ coverImage 字段策略开始：\n\n```\nUser: {\n  fields: {}\n}\n```\n\n```\ncoverImage: {\n\
  \  read(coverImage) {\n    return 'url(${coverImage})';\n  }\n}\n```\n\n```\n}\n\
  }\n```\n\n访问该字段时，它将返回用 CSS url() 函数包装的 coverImage URL，该 URL 可以分配给将显示封面图像的 HTML 元素的\
  \ background-image 样式属性。\n\n- 3. 然后，添加 createdAt 字段策略：\n\n```\ncreatedAt: {\n  \
  \  read(createdAt) {\n        return new Date(Number(createdAt))\n            .toLocaleDateString('en-US',\
  \ {\n                weekday: 'short',\n                day: 'numeric',\n      \
  \          year: 'numeric',\n                month: 'long'\n            });\n  \
  \  }\n}\n```\n\n访问 createdAt 字段时，它将返回相应的可读日期。\n\n## 创建个人资料 UI\n\n在实现组件方法后，让我们构建个人资料\
