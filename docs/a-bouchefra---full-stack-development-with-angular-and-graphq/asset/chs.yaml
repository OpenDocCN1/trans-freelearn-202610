  \  }\n  post3: post(text: \"This is post 3\") {\n    id author { id fullName }\n\
  \  }\n}\n```\n\n\n\n这是我收到的响应：\n\n![](img/c798729e4c42765fcb1c98950164d0ba_125_0.png)\n\
  \n图 4.4 - post mutation 的响应\n\n你可以看到作者与我们使用 signIn mutation 登录时使用的已认证用户相同。它已成功从我们通过\
  \ authorization header 传递的 token 中检索出来。这表明我们的实现按预期工作。\n\n接下来，让我们在这篇文章上创建一些评论和点赞：\n\
  \n```graphql\nmutation CreateComments {\n    c1: comment(comment: \"Comment on post\
  \ with id #2\",\n        postId: 2 ) {\n        id comment author { id fullName\
  \ } post { id }\n    }\n    c2: comment(comment: \"Comment on post with id #3\"\
  ,\n        postId: 3 ) {\n        id comment author { id fullName } post { id }\n\
  \    }\n    c3: comment(comment: \"Comment on post with id #4\",\n        postId:\
  \ 4 ) {\n        id comment author { id fullName } post { id }\n    }\n}\n```\n\n\
  在响应中，你在 selection set 中收到的 post ID 应与你传递给 mutation 的 postId 参数相同。这意味着我们在 resolver\
  \ 中正确地检索了关系。此外，selection set 中的作者应与已认证用户相同。\n\n让我们以同样的方式创建点赞：\n\n```graphql\nmutation\
  \ CreateLikes {\n  like1: like(postId: 1) {\n    id user { fullName } post { id\
  \ }\n  }\n  like2: like(postId: 2) {\n    id user { fullName } post { id }\n  }\n\
  \  like3: like(postId: 3) {\n    id user { fullName } post { id }\n  }\n}\n```\n\
  \n我们已保护了 GraphQL 端点，仅允许已认证用户与 API 的大多数查询和 mutation 交互。我们还实现了 post、comment、like 和\
  \ removeLike mutation。接下来，我们将了解如何使用 Apollo Server 实现图片上传，以便用户上传其个人资料的照片和封面图片。\n\n\
  ## 实现图片上传\n\n在 GraphQL API 中实现身份验证并保护查询和 mutation 之后，现在让我们实现图片上传功能，该功能将用于上传用户的个人资料照片和封面图片。\n\
  \n我们将了解如何使用 Apollo Server 实现文件上传并将图片流式传输到存储服务，例如 Amazon S3 或 DigitalOcean Spaces\
  \ 对象存储。我们将使用后者服务，但如果你更喜欢 Amazon S3 或任何 S3 兼容的对象存储服务，也可以随意使用。\n\n在此之前，请确保为你选择的 S3\
  \ 兼容服务注册，创建 S3 存储桶，并记下以下信息：\n\n- S3_ACCESS_KEY_ID\n- S3_SECRET_ACCESS_KEY\n- S3_ENDPOINT\n\
  - S3_BUCKET\n\n使用服务器 URL、存储桶名称（或 Space 名称）、访问密钥和密钥，你可以将任何 S3 兼容的客户端或库连接到你的 DigitalOcean\
  \ Space。Space 等同于存储桶。\n\nDigitalOcean Spaces API 与 Amazon S3 REST API 互操作，因此我们将使用\
  \ AWS SDK 与 Spaces 交互：\n\n- 1. 打开 server/src/graphql/schema.graphql 文件并在顶部添加以下行：\n\
  - 2. 然后，添加以下类型：\n- 3. 接下来，添加以下 mutation：\n- 4. 接下来，你需要返回到 Terminal 并从 server 文件夹运行以下命令：\n\
  \n```\nscalar Upload\n```\n\n```\ntype File {\n    url: String\n    filename: String\n\
  \    mimetype: String\n    encoding: String\n}\n```\n\n```\ntype Mutation {\n  \
  \  [...]\n    uploadFile(file: Upload!): File!\n}\n```\n\n```\nnpm i graphql-upload\
  \ aws-sdk\nnpm i --save-dev @types/graphql-upload\n```\n\n这将安装 graphql-upload 及其类型，以及\
  \ aws-sdk 包。\n\n- 5. 接下来，打开 server/src/index.ts 文件并首先添加此导入：\n\n```\nimport { graphqlUploadExpress\
  \ } from 'graphql-upload';\n```\n\n然后，按如下方式使用中间件：\n\n```\nasync function startApolloServer()\
  \ {\n  const PORT = 8080;\n  const app: Application = express();\n  app.use(cors());\n\
  \  app.use(graphqlUploadExpress());\n  // [...]\n```\n\n确保在调用 server.applyMiddleware()\
  \ 方法之前使用 graphqlUploadExpress 中间件。\n\n我们现在已使用 Apollo Server 和 Express 启用了文件上传；接下来，我们需要实现\
  \ uploadFile resolver。\n\n在此之前，打开 .env 文件并使用你自己的 S3 服务凭据添加以下变量：\n\n```\nS3_ACCESS_KEY_ID=<YOUR_ACCESS_KEY>\n\
  S3_SECRET_ACCESS_KEY=< YOUR_SECRET_KEY >\nS3_ENDPOINT=<YOUR_S3_ENDPOINT>\nS3_BUCKET=<YOUR_S3_BUCKET>\n\
  ```\n\n此外，请确保重新生成你的 resolver 类型（使用从 Lerna 项目根目录运行的 npm run codegen）。\n\n- 6. Upload\
  \ scalar 的实现由 graphql-upload 包中的 GraphQLUpload 导出提供，因此你需要将其添加到 resolver 的映射中以启用它。打开\
  \ server/src/graphql/resolvers.ts 文件并添加以下导入：\n\n```\nimport { GraphQLUpload } from\
  \ 'graphql-upload';\n```\n\n然后，将其添加到 resolvers 对象中：\n\n```\nconst resolvers: Resolvers\
  \ = {\n  Upload: GraphQLUpload,\n  Query: {...},\n  Mutation: {...}\n};\n```\n\n\
  接下来，在顶部添加以下代码：\n\n```\nimport AWS from 'aws-sdk';\nconst spacesEndpoint = new AWS.Endpoint(process.env.S3_ENDPOINT\
  \ as string);\nconst s3 = new AWS.S3({\n  endpoint: spacesEndpoint,\n  accessKeyId:\
  \ process.env.S3_ACCESS_KEY_ID,\n  secretAccessKey: process.env.S3_SECRET_ACCESS_KEY\n\
  });\n```\n\n最后，按如下方式添加 uploadFile mutation：\n\n```\nuploadFile: async (_, { file\
  \ }) => {\n  const { createReadStream, filename, mimetype, encoding } = await file;\n\
  \  const fileStream = createReadStream();\n  const uploadParams = { Bucket: process.env.S3_BUCKET\
  \ as string, Key: filename, Body: fileStream, ACL: \"public-read\" };\n  const result\
  \ = await s3.upload(uploadParams).promise();\n  console.log(result);\n  const url\
  \ = result.Location;\n  return { url, filename, mimetype, encoding };\n}\n```\n\n\
  我们解构作为参数传递给 resolver 的 file promise。这样，我们就可以获取读取流和其他信息，例如文件名、MIME 类型和编码，这些信息是使用\
  \ AWS SDK 的 upload() 方法将文件保存到 S3 服务所需的。接下来，我们获取已保存文件的 URL 并连同其他信息一起返回。\n\n## 练习\n\
  \n我们将使用 uploadFile mutation 为帖子上传图片。对于上传用户的照片和封面图片，我们还需要将上传的图片链接到相应的用户。为此，我们需要添加两个\
  \ setUserPhoto 和 setUserCover mutation。\n\n按照相同的步骤将 `setUserPhoto` 和 `setUserCover`\
  \ mutation 添加到 schema。两个 mutation 都应具有 `Upload` 类型的 `file` 参数，并应返回 `User` 对象。\n\n\
  接下来，重新生成 resolver 的类型，然后实现所需的 resolver。\n\n最后，使用 `@auth` 指令保护 mutation 免受未认证用户的访问。\n\
  \n你可以在 https://git.io/JgQiC 找到此练习的解决方案。\n\n作为第二个练习，添加 `setUserBio` mutation（它接受\
  \ `String` 类型的 `bio` 参数并返回更新后的 `User` 对象），重新生成 resolver 的类型，并实现 mutation 的 resolver。\n\
  \n你可以在 https://git.io/JgQzA 的提交中找到此练习的解决方案。\n\n## 总结\n\n在本章中，我们了解了如何使用 JWT 向 GraphQL\
  \ API 添加身份验证和图片上传，并保护端点免受未认证用户的访问。\n\n本章到此结束！在下一章中，我们将继续构建后端应用程序的旅程，通过实现实时订阅。\n"
- "## 5 使用 Apollo Server 添加实时支持\n\n在上一章中，我们了解了如何向我们的 **GraphQL** API 添加身份验证和图片上传。我们还了解了如何保护端点免受非认证用户的访问。\n\
  \n传统上，在 Web 应用程序中，客户端向服务器发送 HTTP 请求并接收响应。之后，连接会被关闭。因此，如果服务器上的数据发生变化，客户端没有机制知道这一点。\n\
  \n如今，当代应用程序实时运行，这意味着后端服务器可以在数据发生变化时随时提醒客户端，即使它们没有发送另一个请求，因为连接保持打开状态，以便服务器在更新可用时进行传输。\n\
  \n在本章中，我们将为服务器应用程序添加实时支持，这将使我们能够在数据可用时立即将最新数据从服务器传达给客户端。为此，我们将利用 Apollo Server 的\
  \ GraphQL subscriptions。\n\n\n\nWe will address the following topics:\n- Understanding\
  \ GraphQL subscriptions\n- Implementing GraphQL subscriptions with Apollo Server\n\
  - Implementing JSON Web Token (JWT) authentication with subscriptions\n\n## 技术要求\n\
  \nTo accomplish the steps in this chapter, you must have completed the previous\
  \ chapter's steps. Refer to *第 4 章，使用 Apollo Server 实现身份验证和图像上传*, of this book for\
  \ instructions.\n\nYou also need to be familiar with the following technologies:\n\
  - TypeScript\n- Node.js\n- GraphQL basics\n\nYou can find the code source for this\
  \ chapter in the `chapter5` folder of our GitHub repository or via this link: at\
  \ https://github.com/PacktPublishing/Full-Stack-App-Development-with-Angular-and-GraphQL/tree/main/Chapter05.\n\
  \n## 理解 GraphQL 订阅\n\nWhen interacting with a GraphQL server, you'll often get and\
  \ write data using queries and mutations. In this situation, the client must send\
  \ a query or mutation to the server in order to obtain a response.\n\n**Subscriptions**\
  \ are another form of data communication in GraphQL, in which the server provides\
  \ realtime data to listening clients.\n\nIn order to do that, the client opens a\
  \ two-way communication with the server, which can be done with protocols such as\
  \ WebSocket instead of HTTP. WebSocket can be used to make two-way communication\
  \ between the user's browser and a server.\n\nSubscriptions are similar to queries.\
  \ However, they let subscribing clients receive fresh or updated data whenever a\
  \ certain server event happens. You may configure Apollo Server to use a subscription-specific\
  \ endpoint that is distinct from the default endpoint for queries and mutations.\n\
  \nWe will be able to add realtime capabilities to our social network application\
  \ thanks to GraphQL subscriptions. We may create them in the same way that we define\
  \ queries, with a group of fields indicating the form of data required by the client,\
  \ but under a Subscription type in our schema.\n\nNow that we've defined GraphQL\
  \ subscriptions, we'll see how to use them with Apollo Server to provide realtime\
  \ capabilities to our social network application.\n\n## 实现 GraphQL 订阅\n\nAfter explaining\
  \ GraphQL subscriptions, let's look at how we can use Apollo Server to implement\
  \ them in our application. Because subscriptions utilize WebSocket rather than HTTP,\
  \ we must use a second GraphQL endpoint created for subscriptions that uses the\
  \ WebSocket protocol rather than HTTP:\n\n1. Begin by installing the packages listed\
  \ as follows:\n2. Add the following imports to the server/src/index.ts file:\n3.\
  \ Following that, we must launch two servers, HTTP and WebSocket. As a result, we\
  \ must create http.Server by providing our Express app to the createServer() function\
  \ in the body of the startApolloServer() function, as seen here:\n\n```\nnpm install\
  \ subscriptions-transport-ws graphql-subscriptions\n```\n\n```\nimport { createServer\
  \ } from 'http';\nimport { execute, subscribe } from 'graphql';\nimport { SubscriptionServer\
  \ } from 'subscriptions-transport-ws';\n```\n\n```\nasync function startApolloServer()\
  \ {\n  const PORT = 8080;\n  const app: Application = express();\n  // [...]\n \
  \ const httpServer = createServer(app);\n```\n\n4. Next, create a SubscriptionServer\
  \ instance beneath the ApolloServer instance:\n\n```\nconst subscriptionServer =\
  \ SubscriptionServer.create(\n  { schema, execute, subscribe },\n  { server: httpServer,\
  \ path: server.graphqlPath }\n);\n```\n\n5. Then, in the ApolloServer constructor,\
  \ add a plugin to close the SubscriptionServer instance.\n\nFirst, add the plugins\
  \ array to the constructor, as follows:\n\n```\nconst server: ApolloServer = new\
  \ ApolloServer({ schema,\ncontext: ({req}) => {\n  // [...]\n  return ctx;\n}, plugins:\
  \ [] });\n```\n\nThen, inside the plugins array, add the following code:\n\n```\n\
  {\n  async serverWillStart() {\n    return {\n      async drainServer() {\n    \
  \    subscriptionServer.close();\n      }\n    };\n  }\n}\n```\n\n6. Update the\
  \ listen() call from app.listen() to httpServer.listen():\n\n```\nhttpServer.listen(PORT,\
  \ () => {\n  console.log('Server is running at http://localhost:${PORT}');\n});\n\
  ```\n\nThis will allow us to launch both servers. Check out this commit for the\
  \ updates we've made in this step: https://git.io/JghrI.\n\n7. Next, we need to\
  \ update the schema, open the server/src/graphql/schema.graphql file, and add the\
  \ following type:\n\n```\ntype Subscription {\n  onPostCommented: Comment\n  onPostLiked:\
  \ Like\n}\n```\n\nWe added a Subscription type that defines the top-level fields\
  \ that clients can subscribe to.\n\nThe onPostCommented field will update its value\
  \ whenever a new comment is created on the backend and send the comment to subscribing\
  \ clients.\n\nBefore continuing, you need to regenerate the resolvers' types using\
  \ the npm run codegen command from the root of your monorepo project.\n\nNext, we\
  \ need to implement the resolvers for these two fields. Resolvers for these fields\
  \ are different from the resolvers for the query and mutation fields. They are not\
  \ functions but objects that should define a subscribe function. This function must\
  \ return an object of the AsyncIterator type, a standard interface for iterating\
  \ over asynchronous results:\n\n1. Open the server/src/graphql/resolvers.ts file\
  \ and start by adding the following code:\n\n```\nimport { PubSub } from 'graphql-subscriptions';\n\
  const pubsub = new PubSub();\n```\n\nWe imported the PubSub interface and created\
  \ an instance that will allow you to publish events to a particular label and listen\
  \ for events associated with a particular label.\n\nApollo Server adopts a publish-subscribe\
  \ mechanism to track events for updating active subscriptions.\n\n2. Next, add a\
  \ Subscription object inside the resolvers object, as follows:\n\n```\nSubscription:\
  \ {\n  onPostCommented: {\n    subscribe: () =>\n      pubsub.asyncIterator(['ON_POST_COMMENTED'])\n\
  \  },\n  onPostLiked: {\n    subscribe: () =>\n      pubsub.asyncIterator(['ON_POST_LIKED'])\n\
  \  }\n}\n```\n\nFor each field, we added a subscribe() function and mapped the corresponding\
  \ event using the pubsub.asyncIterator() method.\n\n3. Next, you need to publish\
  \ some events with the publish() method of the PubSub object.\n\nUpdate the comment\
  \ mutation, as follows:\n\n```\ncomment: async (_, args, { orm, authUser }:\n  \
  \  Context) => {\n    // [...] \n    pubsub.publish('ON_POST_COMMENTED',\n    {\
  \ onPostCommented: savedComment });\n    return savedComment as unknown as Comment;\n\
  }\n```\n\nThen, update the like mutation, as follows:\n\n```\nlike: async (_, args,\
  \ { orm, authUser }: Context) => {\n    // [...] \n    pubsub.publish('ON_POST_LIKED',\n\
  \    { onPostLiked: savedLike });\n    return savedLike as unknown as Like;\n}\n\
  ```\n\nApollo Server uses the payloads of the ON_POST_COMMENTED and ON_POST_LIKED\
  \ events to push updated values for the onPostCommented and onPostLiked fields respectively.\n\
  \n4. We can write the GraphQL query for listening for subscriptions in the same\
  \ way we write other types of queries. Head over to http://localhost:8080/graphql\
  \ and write the following subscription in the left panel of Apollo Studio:\n\n```\n\
  subscription {\n    onPostCommented {\n        comment\n        post {\n       \
  \     id\n        }\n    }\n}\n```\n\nAfter running this subscription, we will listen\
  \ for comments on posts over WebSocket. In Apollo Studio, this will not return data\
  \ immediately like queries and mutations. Instead, we'll get data every time a comment\
  \ is added.\n\nIf you want to see some data pushed to an onPostCommented subscription,\
  \ you simply need to create a comment.\n\nYou can start listening for new likes\
  \ using the following subscription:\n\n```\nsubscription {\n  onPostLiked {\n  \
  \  id\n    post {\n      id\n      likesCount\n    }\n  }\n}\n```\n\nThis is an\
  \ example of a response I received after liking the post with the 1 ID:\n\n![](img/c798729e4c42765fcb1c98950164d0ba_137_0.png)\n\
  \nFigure 5.1 – 订阅的响应\n\nNow that we have implemented subscriptions to add realtime\
  \ features to our social application, let's see how to secure these subscriptions\
  \ using JWT authentication.\n\n\n\n## 使用订阅实现 JWT 身份验证\n\n本节介绍如何通过 WebSocket 实现身份验证。有关更多信息，请参阅\
  \ https://www.apollographql.com/docs/apollo-server/data/subscriptions/#operation-context\
  \ 的文档。\n\n到目前为止，我们的订阅尚未安全，因此我们需要阻止未经过身份验证的用户订阅。这意味着只有在用户经过身份验证时才允许 WebSocket 连接。\n\
  \n我们可以以与查询和变更相同的方式保护我们的订阅。我们只需在用户每次通过 WebSocket 连接时向我们的订阅传递一个上下文参数即可！\n\n当我们创建 SubscriptionServer\
  \ 实例时，可以使用在每次 WebSocket 连接之前执行的 onConnect 函数。此函数接受 ConnectionParams 类型的对象作为其参数之一。如果它返回一个对象，则该对象会作为上下文传递给解析器。\n\
  \n使用 ConnectionParams，我们可以获取客户端发送的 JWT。在 onConnect 内部，我们将从 JWT 中提取经过身份验证的用户并将其添加到上下文中：\n\
  \n- 1. 打开 server/src/index.ts 文件并添加以下导入：\n\n```\nimport { ApolloServer, AuthenticationError\
  \ } from 'apollo-server-express';\nimport { SubscriptionServer, ConnectionParams\
  \ } from 'subscriptions-transport-ws';\n```\n\n我们将 AuthenticationError 添加到来自 apollo-server-express\
  \ 的现有导入声明中，并将 ConnectionParams 添加到来自 subscriptions-transport-ws 的现有导入声明中。\n\n- 2.\
  \ 接下来，将 onConnect 函数添加到传递给 SubscriptionServer.create() 方法的对象中，并提取可以从传递给 onConnect\
  \ 的参数中检索到的令牌：\n\n```\nconst subscriptionServer = SubscriptionServer.create(\n{\n\
  \  schema, execute, subscribe, onConnect:\n    (connectionParams: ConnectionParams)\
  \ => {\nconst token = connectionParams.get('authToken')\n    || '';\n    if (token\
  \ != '') {\n        const authUser = getAuthUser(token.split(' ')[1]);\n       \
  \ return {\n            authUser: authUser\n        }\n    }\n    throw new AuthenticationError('User\
  \ is not authenticated');\n    }\n},\n    { server: httpServer, path: server.graphqlPath\
  \ }\n);\n```\n\n我们现在已经学会如何保护我们的 WebSocket 连接，以防止未经过身份验证的用户订阅实时事件。\n\n### 摘要\n\n\
  在本章中，我们学习了如何为服务器应用程序添加实时支持，以便在新评论和点赞添加到用户帖子时立即将它们从服务器推送到客户端。为此，我们使用了 Apollo Server\
  \ 中的 GraphQL 订阅。\n\n接下来，我们实现了 JWT 身份验证，以防止未经过身份验证的用户订阅这些实时订阅。\n\n现在我们拥有了一个功能齐全的\
  \ GraphQL API，其中包含实时订阅和 JWT 身份验证，在下一章中我们将开始实现 Angular 前端来构建社交网络应用程序的用户界面。\n"
- '# 第 2 部分：使用实时支持构建 Angular 前端


  在本部分中，我们将使用 Angular 和 Apollo 实现应用程序的前端。我们将在各个模块和组件之间添加路由和导航。


  我们将了解如何使用 Apollo Client 将前端与后端集成，Apollo Client 旨在向服务器发送 GraphQL 查询和变更以获取和写入数据，然后我们将实现身份验证系统。


  之后，我们将通过添加上传用户照片和封面图片以及个人简介的功能来实现个人资料组件的功能。


  我们将添加必要的代码来获取与个人资料 URL 对应的用户并在页面上渲染其信息，然后我们将学习如何发送查询以接收分页帖子和评论相关数据，以及发送变更以向帖子添加评论和点赞。


  本节包含以下章节：


  - 第 6 章，Angular 应用程序架构和路由

  - 第 7 章，添加用户搜索功能

  - 第 8 章，保护路由和测试身份验证

  - 第 9 章，上传图片和添加帖子

  - 第 10 章，获取帖子并添加评论和点赞

  '
- "## 6 Angular 应用程序架构和路由\n\n在之前的章节中，我们使用 GraphQL 和 Apollo Server 开发了后端，并且还使用 Apollo\
  \ Studio 与我们的 GraphQL API 通信。我们现在可以开始开发前端应用程序来使用 API 并向用户展示用户界面以与后端通信。\n\n在接下来的章节中，我们将重点关注通过\
  \ Apollo Client 将前端应用程序与后端 API 连接起来并发送查询以获取和变更数据，但在开始之前，我们需要使用基本布局构建一个 Angular 前端项目。\n\
  \n在本章中，我们将首先安装 **Angular CLI** 并使用最新版本的 Angular 创建一个新项目。之后，我们将利用 Angular CLI 创建构成应用程序用户界面的\
  \ **模块**、**服务** 和 **组件**，并向您介绍 **依赖注入**。\n\n在创建项目所需的各种工件之后，我们将向您介绍 **Angular Router**\
  \ 并演示如何实现路由和导航以开发单页应用程序。之后，我们将指导您使用当前的 **Angular Ivy** 运行时进行调试，这将允许您从控制台访问应用程序组件、执行方法，甚至触发变更检测。最后，我们将在项目中安装和配置\
  \ **Angular Material**，以提供用于开发应用程序用户界面的组件。\n\n以下主题将被涵盖：\n\n- 安装 Angular CLI\n- 初始化\
  \ Angular 项目\n- 理解应用程序架构\n- 理解服务和依赖注入\n- 创建模块、服务和组件\n- 理解 Angular 路由\n- 理解并添加路由\n\
  - 添加导航\n- 调试 Angular 应用程序\n- 添加 Angular Material\n\n### 技术要求\n\n为了按照本章中的说明操作，您必须在本地开发机器上安装\
  \ Node.js 和 npm。如果您尚未安装，请参阅本书的 *第 1 章，应用程序架构和开发环境* 以获取安装说明。\n\n您还必须完成之前的章节，以便开发将在本章开始实现的前端使用的\
  \ GraphQL API。\n\n您还应熟悉以下技术：\n\n- JavaScript/TypeScript\n- HTML\n\n您可以在 https://github.com/PacktPublishing/Full-Stack-App-Development-with-Angular-and-GraphQL/tree/main/Chapter06\
  \ 找到本章的源代码。\n\n不需要 TypeScript 专业知识，但了解类和装饰器等概念会有所帮助。\n\nTypeScript 类的示例如下：\n\n```typescript\n\
  class Product {\n  name: string;\n  constructor(name: string) {\n    this.name =\
  \ name;\n  }\n  getName() {\n    return this.name;\n  }\n}\n\nlet product1 = new\
  \ Product(\"product1\");\n```\n\n如果您之前使用过基于类的面向对象编程语言，您应该熟悉这种语法，但即使是 JavaScript\
  \ 的最新版本，例如 ECMAScript 6 或 JavaScript 2015，也允许开发人员使用这种语法定义类。\n\n我们只需使用 class 关键字，后跟类名和类体来定义类。\n\
  \n类的成员被添加到用大括号包围的类体中。在这种情况下，我们有一个名为 name 的字符串类型属性、一个构造函数和一个名为 getName() 的方法。\n\n\
  最后，我们使用 new 关键字创建 Product 类的实例，这将创建一个具有 Product 类型的新对象并调用类的构造函数来初始化它。\n\n类可以被视为创建用户定义类型的机制，从而让您轻松表示现实世界中的对象。\n\
  \n在 TypeScript 中，装饰器是一种特殊结构，允许您动态地修改类、方法、访问器、属性和参数。\n\n\n\n> **重要提示**\n> 有关类的更多信息可在\
  \ TypeScript 手册中找到，网址为 https://www.typescriptlang.org/docs/handbook/classes.html。您可以在\
  \ https://www.typescriptlang.org/docs/handbook/decorators.html 了解有关装饰器的更多信息。\n\n\
  这是一个使用 @Component 装饰器装饰的类的示例，该装饰器可从 Angular 核心模块获得，用于从 TypeScript 类创建组件：\n\n```\n\
  @Component({\n  selector:  'product-list',\n  templateUrl: './product-list.component.html'\n\
  })\nexport class ProductListComponent implements OnInit {\n  products: Product[];\n\
  \  myProduct;\n  constructor(private service: ProductService) { }\n  ngOnInit()\
  \ {\n    this.products = this.service.getProducts();\n  }\n  selectProduct(product:\
  \ Product) {\n    this.myProduct = product;\n  }\n}\n```\n\n本章后面，我们将了解组件是什么以及提供给\
  \ @Component 装饰器的不同属性的作用。\n\nAngular 严重依赖于可从核心模块访问的自定义装饰器，例如 @Component、@Injectable\
  \ 和 @NgModule，以生成可用于构建应用程序结构的各种产物。\n\n## 安装 Angular CLI\n\n本节我们将学习如何安装 Angular CLI，这样就可以在无需处理\
  \ webpack 或其他构建系统的复杂性情况下快速开始 Angular 项目。\n\n创建 Angular 项目的官方工具是 Angular CLI。它简化了创建功能完整的\
  \ Angular 项目的过程。\n\nAngular CLI 不仅可以帮助你创建项目文件和安装依赖项，还能在整个开发过程中提供帮助，从在本地提供应用程序、进行测试，到生成最终的生产包并部署到你选择的托管服务提供商。\n\
  \n现在，让我们从本章的第一个实践步骤开始。通过打开一个新的命令行界面并输入以下命令，你可以从 npm 安装 Angular CLI：\n\n```\nnpm\
  \ install -g @angular/cli\n```\n\n在撰写本章时，我们的开发机器上安装的是 angular/cli 版本 12。\n\n> **重要提示**\n\
  > 为了在你的机器上全局安装包，在 Ubuntu 系统中你可能需要在命令前加上 `sudo`。请查看 https://www.shabang.dev/multiple-versions-node-nvm。\n\
  \n## Angular CLI 命令\n\nAngular CLI 包含大量有助于项目开发的命令。只需在命令行界面中运行 `ng` 可执行文件，即可显示可用命令及其说明。以下是一些最常用的命令：\n\
  \n- `ng new` 命令用于创建应用程序。\n- `ng generate` 命令用于创建 Angular 构造，如模块、组件和服务。\n- `ng serve`\
  \ 命令用于在项目开发期间启动实时重新加载服务器。\n- `ng build` 命令用于创建项目的最终包。\n\n我们安装了 Angular CLI，并介绍了\
  \ CLI 中最有用的一些命令。在下一节中，我们将了解如何利用 CLI 创建和提供项目。\n\n## 初始化 Angular 项目\n\n本节介绍如何创建我们的\
  \ Angular 项目以及如何构建、监控和提供应用程序。\n\n返回到你的命令行界面并进入项目的 packages/ 子目录：\n\n```\ncd ~/ngsocial/packages/\n\
  ```\n\n然后，要在不使用 Git 仓库的情况下创建新的 Angular 项目，请使用以下命令：\n\n```\nng new client --skip-git\n\
  ```\n\nCLI 会询问你几个问题：\n\n- 是否要添加 Angular 路由？输入 Y 表示是。\n- 你想使用哪种样式表格式？选择 CSS。\n\n\
  > **重要提示**\n> 要查看我们使用的 Angular CLI 的版本，可以在项目文件夹内运行 ng version 命令。可以通过使用 --routing\
  \ 和 --style=css 选项与 ng new 命令一起使用来跳过提示问题，告诉 Angular CLI 你想要使用预配置的路由和 CSS 样式表创建项目。\n\
  \n确认后，CLI 将自动创建基本的文件夹结构和源文件，从 npm 安装所需的依赖项，并且由于你已选择启用 Angular 路由，它还将为你的项目设置路由。\n\
  \n上述命令将创建一个工作区，其中包含一个以项目命名的初始应用程序，并位于项目的根文件夹中。工作区可以包含许多应用和库。\n\n你的应用程序源代码位于 src/\
  \ 子目录中，TypeScript 源文件就在此处创建。\n\n你会在 src/ 子目录之外看到多个配置文件，包括以下内容：\n\n- 用于 npm 的 package.json\
  \ 文件。\n- 用于配置 TypeScript 的 tsconfig.json 文件。\n- karma.conf.js 用于 **karma** 测试运行器。\n\
  - 用于 Angular CLI 配置的 angular.json。\n\n接下来，导航到包含你的项目的目录并使用以下命令启动本地开发服务器：\n\n```\n\
  cd client\n```\n\n```\nng serve\n```\n\n本地实时重新加载开发服务器可通过 http://localhost:4200/\
  \ 地址访问。当你对代码进行更改时，应用程序会自动重建并交付到浏览器，无需手动刷新。\n\n打开你的网络浏览器并导航到 http://localhost:4200/，即可看到你的\
  \ Angular 应用程序正在运行并带有一些初始内容，我们将在创建演示的实际 UI 之前将其删除。以下是该页面的屏幕截图：\n\n![](img/c798729e4c42765fcb1c98950164d0ba_149_0.png)\n\
  \nFigure 6.1 – Angular 项目默认页面\n\n现在我们已经创建了 Angular 项目并启动了实时重新加载开发服务器，我们准备进入以下阶段，其中包括对\
  \ Angular 基本概念的介绍，例如模块、组件和服务，然后是用户界面的创建。\n\n## 了解应用程序架构\n\n在本节中，我们将开发一个具有小型社交网络功能的全栈\
  \ Web 应用程序。我们已经讨论了后端应用程序的架构，它使用 Node.js、Apollo Server 和 GraphQL。现在，我们将使用 Angular\
  \ 和 Apollo Client 创建应用程序的前端，以使用服务器的 GraphQL API。\n\nAngular 是 Google 开发的平台，用于使用\
  \ TypeScript 创建面向移动设备和桌面的客户端 Web 应用。我们将使用它来使用服务器的 GraphQL API 并构建应用程序的用户界面。此外，我们还将使用\
  \ Angular Material 来设置 UI 样式。\n\nTypeScript 是 Microsoft 创建的 JavaScript 超集，在编译为 JavaScript\
  \ 并在 Web 浏览器中处理之前，为语言添加了静态类型、改进的错误检查、类型安全和面向对象编程原则。此外，它与代码编辑器和集成开发环境（IDE）集成得更紧密，这增强了开发体验，特别是在开发必须可扩展的大型\
  \ JavaScript 应用程序时。\n\n与 React 等其他流行的 JavaScript 库相比，Angular 是一个框架，它包含用于常见开发任务的内置库，例如以下内容：\n\
  \n- **HttpClient** 用于使用 HTTP 与服务器通信\n- **Angular Universal** 用于在服务器上渲染你的 Angular\
  \ 应用程序\n- **Angular Material** 用于提供用于设置用户界面样式的材料组件\n- **Angular forms** 用于创建、验证和操作表单\n\
  \nAngular 支持模块化和基于组件的架构，使你能够使用模块和组件构建应用程序。\n\n在开发 Angular 应用程序时，你可以将它分解为可在应用程序中重复使用并且在仔细处理的情况下可在多个应用程序中重复使用的模块和组件。\n\
  \n虽然 Angular API 包含在内置模块中，但你也可以开发自定义模块来构建和组织你的应用程序。模块可以包含组件、服务和任何其他 Angular 构件。让我们更详细地了解模块和组件。\n\
  \n\n\n## 什么是模块？\n\n一个模块不过是实现特定领域功能的 Angular 代码的容器。\n\n它们允许你将应用程序拆分为更小、更易管理的部分。\n\
  \n为了避免为每个新项目都从头编写所有代码，代码单元可以组合成库，供其他开发者使用。\n\nAngular 模块可以包含组件、指令、管道和服务，并且可以由路由器懒加载以提高应用程序速度。\n\
  \n你可以设计自己的自定义模块来实现应用中的需求或功能，也可以利用内置模块来暴露 Angular API，例如下面列出的模块：\n\n-   `FormsModule`\
  \ 用于创建和验证表单。\n-   `HttpClientModule` 用于发出 HTTP 请求。\n-   `RouterModule` 用于为你的 Angular\
  \ 应用提供路由器以及各种有用的 API 和组件。\n-   `CommonModule` 用于提供所有基本的 Angular 指令和管道，例如 `NgIf`\
  \ 和 `NgForOf`。\n\n**NgModules** 可用于定义 Angular 模块。`NgModule` 是一个用 `@NgModule` 装饰器标注的\
  \ TypeScript 类，它接受某些元数据并执行以下功能：\n\n-   声明其他模块构件，例如组件、指令和管道\n-   导出一些组件、指令或管道，以便其他模块可以导入并使用它们\n\
  -   导入其他模块及其组件、指令和管道\n-   提供其他组件可以使用的服务\n\n按惯例，Angular 应用至少包含一个模块，称为根模块。这是用于启动应用程序的模块。\n\
  \n在我们使用 Angular CLI 生成的项目中，我们已经在 `src/app/app.module.ts` 和 `src/app/app-routing.module.ts`\
  \ 文件中包含了两个模块，它们导出了用于定义根应用程序模块和路由模块的类。\n\n一个模块可以由一个或多个组件组成。那么组件到底是什么？\n\n## 什么是组件？\n\
  \n一个 **Angular 组件** 负责显示应用程序用户界面的某个区域。组件例如可用于创建应用程序的首页，如果你想获得更高的代码复用性，可以将首页进一步拆分为更小的组件，例如导航栏、主体和页脚区域。\n\
  \n这样你就可以在应用程序的其他页面上使用导航和页脚组件，而无需为所有或部分共享的元素重写相同的代码。\n\n从代码角度看，组件只是一个用从 Angular 核心模块导出的\
  \ `@Component` 装饰器装饰的 TypeScript 类。它还包含一个 HTML 模板，该模板可以内联或保存为单独的 HTML 文件，并使用特定的\
  \ Angular 模板语法来显示数据并绑定组件类中的属性和事件。\n\n最后，组件可以有一个或多个关联的样式表文件，其中包含以你为项目选择的格式（如 CSS、SCSS\
  \ 或 Sass）为视图提供的样式。\n\nAngular 9 带来了名为 Ivy 的新渲染引擎，被视为下一代编译和渲染系统，由编译器和一组运行时指令组成。\n\
  \nIvy 产生更小的生产包、更快的构建时间和运行时性能，以及更易于调试。它使用 **增量 DOM**，其中 Angular 组件和模板被编译成一组 JavaScript\
  \ 指令，用于创建和更新 **文档对象模型 (DOM)**。\n\n让我们暂时回到我们的应用程序。在 `src/app` 文件夹中，你会找到包含 app 组件的\
  \ TypeScript 代码、HTML 模板和 CSS 样式表的多个文件：\n\n-   提供组件 CSS 样式的 `app.component.css` 文件\n\
  -   提供用于渲染组件的 HTML 代码的 `app.component.html` 文件\n-   提供用于定义组件数据和功能的 TypeScript 代码的\
  \ `app.component.ts` 文件\n\n当应用启动时，根组件首先被加载。这是通过将组件包含在应用程序模块的 `bootstrap` 数组中实现的。\n\
  \n只需打开包含应用程序模块的 src/app/app.module.ts 文件即可看到这一点：\n\n// [...]\nimport { AppComponent\
  \ } from './app.component';\n\n@NgModule({\n  // [...]\n  bootstrap: [AppComponent]\n\
  })\nexport class AppModule { }\n\n根组件也包含在 src/index.html 文件中，该文件是在用户从 Web 浏览器访问你的\
  \ Angular 应用程序时下载的文件：\n\n```\n<!doctype html>\n<html lang=\"en\">\n<head>\n  <!--\
  \ [...] -->\n</head>\n<body>\n  <app-root></app-root>\n</body>\n</html>\n```\n\n\
  通过其选择器，你可以看到根组件正像标准 HTML 标签一样被使用。这指示 Angular 将组件及其所有子组件加载到 DOM 中。\n\n在 src/app 目录中打开\
  \ app.component.ts 文件。根组件应使用以下代码定义：\n\n```\nimport { Component } from '@angular/core';\n\
  \n@Component({\n  selector: 'app-root',\n  templateUrl: './app.component.html',\n\
  \  styleUrls: ['./app.component.css']\n})\nexport class AppComponent {\n  title\
  \ = 'client';\n}\n```\n\n这只是一个普通的 TypeScript 类，已应用从核心模块导入的 `@Component` 装饰器。装饰器包含有关组件的元数据，例如以下内容：\n\
  \n-   `selector`：它与常规 HTML 标签的使用方式相同，用于从 HTML 页面调用组件。你可以使用 Angular 构建只能在应用程序内部使用的自定义\
  \ HTML 标签。\n-   `templateUrl`：用于告诉 Angular 在哪里查找包含展示标记的 HTML 模板。\n-   `styleUrls`：用于指定组件特定样式的位置，这些样式决定了组件的外观和感觉。\n\
  \n组件的生命周期始于 Angular 构造组件类的实例，并在组件被销毁并从 DOM 中移除时结束。\n\nAngular 通过一系列接口支持生命周期钩子方法，每个接口都包含一个方法，以便你可以在组件生命周期的关键事件上挂钩。\n\
  \n例如，`OnInit` 接口提供了 `ngOnInit` 方法，该方法在组件初始化时运行。请参阅 https://angular.io/guide/glossary#lifecycle-hook\
  \ 了解有关生命周期钩子的更多信息。\n\n现在我们已经定义了模块和组件，让我们来看看服务和依赖注入。\n\n## 理解服务和依赖注入\n\nAngular 中的服务是一个单例，可以通过\
  \ `dependency injection` 提供给其他组件或服务，依赖注入是一种向对象提供依赖的方式。\n\n不要被这个术语误导！这仅仅意味着一个名为 **注入器**\
  \ 的 Angular 实体负责创建服务的实例并将其交付给请求它的组件。\n\n依赖注入与 Angular 框架紧密相关，用于将服务和其他对象注入组件，从而在无需手动创建实例的情况下访问服务功能。\n\
  \nAngular 服务使你能够创建遵循以下准则的应用：\n\n-   将应用程序的业务逻辑与其在组件中的显示逻辑分离\n-   在应用程序的组件之间交换数据\n\
  -   代码可复用性\n\n这意味着你应该利用服务来组织和复用应用程序中的代码，以防止重复和重复造轮子。\n\n通常，你应该利用组件通过数据绑定和事件向 HTML\
  \ 模板提供属性和方法来创建应用程序的用户界面。你可以参考 `https://angular.io/guide/binding-syntax` 了解有关 Angular\
  \ 绑定语法的更多信息。\n\n另一方面，服务对于多个组件正常运行所需的常见任务是必要的，例如从服务器检索数据。\n\n在 Angular 中，你可以使用 `@Injectable`\
  \ 装饰器定义服务，这允许你提供框架所需的信息，以便将服务作为依赖项注入组件或其他服务。\n\n那么我们如何指示 Angular 注入服务呢？\n\n只需将依赖项作为参数传递给请求组件的构造函数即可。这足以让\
  \ Angular 为组件提供服务实例。然而，在 Angular 能够做到这一点之前，我们必须以以下方式之一提供服务：\n\n-   通过将服务添加到组件的 `providers`\
  \ 数组中，它就成为该组件独有的。\n-   通过将服务包含在模块的 `providers` 数组中，它仅在该模块内可用。\n-   通过结合使用 `@Injectable`\
  \ 装饰器中的 `providedIn` 属性。有关更多详细信息，请参阅 `https://next.angular.io/api/core/Injectable`。\n\
  \n现在我们已经定义了模块、组件和服务，我们将探讨如何使用 Angular CLI 创建它们。\n\n\n\n## 创建模块、服务和组件\n\n你可以通过调用相关的\
  \ Angular CLI 命令在 Angular 中自动创建组件、服务和模块，该命令会生成创建基本组件、服务或模块所需的最基本代码。\n\n让我们使用 Angular\
  \ CLI 生成我们的模块、服务和组件。\n\n为应用程序的每个功能创建一个模块。这是一条基本规则。例如，首页信息流可以包含在单独的模块中。将应用程序拆分为模块使你能够延迟加载组件并高效维护它。\n\
  \n### 创建模块\n\n在我们的应用程序中，我们将使用以下模块：\n\n- 一个 `users` 模块，包含登录、注册和个人资料的组件。\n- 一个 `feed`\
  \ 模块，包含使用 GraphQL 获取的帖子所需的组件。\n- 一个 `shared` 模块可能包含与应用程序中其他模块共享的元素。\n- 一个根模块，包含应用程序的全局服务和通用布局组件，例如身份验证服务以及页眉和页脚组件。\n\
  \n共享模块通过避免导入多个模块所需的通用模块、组件和其他构件来节省您的时间。\n\n例如，通过从共享模块导入并导出 ReactiveFormsModule，我们可以通过简单地导入共享模块来避免在\
  \ users 和 feed 模块中分别导入它。\n\n此外，我们将导入并重新导出 Angular Material 组件模块到共享模块中，以便在项目中的其他模块中使用。\n\
  \n让我们开始使用 Angular CLI 自动创建模块。打开一个新的终端窗口，浏览到包含 Angular 项目的文件夹，并运行以下命令：\n\n```\nng\
  \ generate module shared\nng generate module users --routing\nng generate module\
  \ feed --routing\n```\n\n这些命令将在 src/app/ 文件夹下创建多个文件，每个文件都有一个以我们指定的模块命名的子目录。\n\n\
  例如，共享模块将创建在 src/app/shared/shared.module.ts 文件下。打开该文件并进行以下更改：\n\n```\nimport { NgModule\
  \ } from '@angular/core';\nimport { CommonModule } from '@angular/common';\nimport\
  \ { ReactiveFormsModule } from '@angular/forms';\n\n@NgModule({\n    declarations:\
  \ [],\n    imports: [\n        CommonModule,\n        ReactiveFormsModule\n    ],\n\
  \    exports: [\n        ReactiveFormsModule\n    ]\n})\nexport class SharedModule\
  \ { }\n```\n\n我们只是将 ReactiveFormsModule 导入到 imports 数组中，然后通过 exports 数组重新导出它。这使得它可用于导入共享模块的所有模块，从而消除了单独导入的需求。\n\
  \n--routing 选项指示 CLI 为每个生成的模块创建路由模块，使我们能够为每个模块的组件实现路由。此外，它将使我们能够使用延迟加载，从而通过允许 Angular\
  \ 仅在需要时加载模块而不是在启动时全部加载来提高应用程序的速度。\n\n> **重要提示**\n> \n> 此外，我们可以将 CommonModule 添加到\
  \ exports 数组中以从共享模块重新导出它，然后将其从导入共享模块的任何其他模块中移除。虽然你可能认为共享模块对于小型应用程序是不必要的，但随着应用程序变得更大，它将为你节省大量重复的导入行，因此遵循这一做法是明智的。\n\
  \n### 创建组件和服务\n\n接下来，让我们开发模块的组件和服务，首先是可能属于根应用程序模块的 header、footer、page-not-found\
  \ 和 search-dialog 组件：\n\n```\nng generate component core/components/header --module=app\n\
  ```\n\n```\nng generate component core/components/footer --module=app\n```\n\n```\n\
  ng generate component core/components/page-not-found --module=app\n```\n\n```\n\
  ng generate component core/components/search-dialog --module=app\n```\n\n```\nng\
  \ generate service core/services/auth/auth\n```\n\n> **重要提示**\n> \n> 另外，我们可以创建一个包含这些组件的核心模块，并导入和重新导出诸如\
  \ BrowserModule、AppRoutingModule 和 BrowserAnimationsModule 之类的模块，同时将 app 模块留空。然而，我们选择使用\
  \ core/ 文件夹而不是单独的模块来聚合应用程序的主要功能并直接从应用程序模块导入它们。\n\n接下来，我们使用以下命令生成 users 模块的组件：\n\n\
  ```\nng generate component users/components/login --module=users\n```\n\n```\nng\
  \ generate component users/components/signup --module=users\n```\n\n```\nng generate\
  \ component users/components/profile --module=users\n```\n\n```\nng generate service\
  \ users/services/profile/profile\n```\n\n接下来，我们将创建 feed 模块的组件：\n\n```\nng generate\
  \ component feed/components/posts --module=feed\n```\n\n该命令已自动将创建的组件添加到各自的模块中。\n\
  \n接下来，我们创建共享模块的组件和服务：\n\n```\nng generate component shared/components/create-post\
  \ --module=shared\n```\n\n```\nng generate component shared/components/post --module=shared\n\
  ```\n\n```\nng generate component shared/components/dialog --module=shared\nng generate\
  \ service shared/services/post/post --module=shared\n```\n\n然后，在 src/app/feed/feed.module.ts\
  \ 文件中，按如下方式导入共享模块：\n\n```\nimport { NgModule } from '@angular/core';\nimport { CommonModule\
  \ } from '@angular/common';\n\nimport { FeedRoutingModule } from './feed-routing.module';\n\
  import { PostsComponent } from './components/posts/posts.component';\nimport { SharedModule\
  \ } from '../shared/shared.module';\n\n@NgModule({\n  declarations: [PostsComponent],\n\
  \  imports: [\n    CommonModule,\n    FeedRoutingModule,\n    SharedModule\n  ]\n\
  })\nexport class FeedModule { }\n```\n\n此外，你必须在 app 和 users 模块中导入共享模块，因为它将用于导入这些模块所需的组件（例如\
  \ Angular Material 组件）。\n\n现在我们需要做的就是构建应用程序的模块、组件和服务的结构。一些其他构件也将在本书的后续章节中添加。在接下来的几章中，我们将开发每个组件和服务的底层功能。\n\
  \n在下一节中，我们将了解 Angular Router 以及如何使用它将应用程序用户界面的组件映射到特定的 URL 路由并提供应用内导航。\n\n## 理解\
  \ Angular 路由\n\n通常，你需要在 Web 应用程序中实现路由，因为你无法将应用程序的所有功能都放在一个页面上——这会造成糟糕的用户体验，甚至使某些任务对用户来说变得不可能，例如，在我们的例子中，通过其唯一\
  \ URL 访问个人资料的能力，或通过 **搜索引擎优化 (SEO)** 使个人资料可被搜索引擎找到。\n\n作为一个一体化平台，Angular 具有内置的路由器模块，可简化具有众多视图和导航的单页应用的实现。此外，Angular\
  \ CLI 在项目创建过程中可以通过自动配置应用程序中的路由模块来帮助你。\n\nAngular Router 是一个静态路由库。与动态路由相反，路由是在应用程序初始化时指定的。你可以在包含应用程序所有路由的单个路由模块中实现路由，也可以为每个模块单独添加路由。\n\
  \n接下来，我们将探讨 Angular Router 的工作原理以及 Angular CLI 如何自动化我们在项目中配置路由的过程。\n\n### Angular\
  \ Router 的工作原理\n\n而不是向服务器请求获取新页面，你可以通过显示或隐藏由组件控制的视图来管理用户在 Angular 应用程序中看到的内容。这是通过\
  \ **客户端路由** 而非服务器端路由实现的。\n\n为了提供良好的用户体验，你的应用程序应根据业务领域为每个活动或相关活动组呈现不同的视图，而不是将所有功能都合并到单个视图中。此外，它应启用不同视图之间的导航——这可以通过使用\
  \ Angular Router 和浏览器 URL 实现。\n\nAngular Router 是一个客户端 JavaScript 解决方案，它通过监控 URL\
  \ 的变化并使用路由/组件映射数组将路径映射到视图来运行。\n\n你在路由模块中指定路径如何映射到组件，当路径匹配时（即当用户导航到与路由条目关联的某个路径时），路由器会处理显示适当的组件。\n\
  \n路由器还允许你提供一个通用的通配符条目，当未识别到匹配的路径时将使用该条目。\n\n\n\n如果某个组件匹配，路由器会将其显示在路由出口中。路由出口是一个\
  \ Angular 指令，用作与当前 URL 匹配的组件（们）的放置位置。\n\n> **重要说明**\n> 在 Angular 中，指令是一个概念，允许你使用仅在应用程序上下文中可用的自定义标签来扩展\
  \ HTML。Angular 提供了许多内置指令，例如 NgFor 和 NgIf，并且你可以使用 @Directive 装饰器创建自己的指令。\n\n路由器可在\
  \ @angular/router 模块中找到。通过导入此模块，你将获得构建 Angular 项目中路由和导航所需的所有服务、组件和指令。\n\n回到 *初始化\
  \ Angular 项目* 部分，当你创建项目时，Angular CLI 会询问是否要添加路由。通过选择 yes，你指示 CLI 自动设置路由，导致在 src/app/app-routing.module.ts\
  \ 文件中生成路由模块。你还指示 Angular CLI 为 users 和 feed 模块生成路由模块，以便在 *创建模块、服务和组件* 部分使用 --routing\
  \ 选项为每个模块的组件提供路由。\n\n要实现路由，现在你需要做的就是在路由模块内部添加路由/组件映射，但首先让我们看看 CLI 为设置路由所做的工作。\n\n\
  ## The <base href> tag\n\n当你查看 src/index.html 文件时，你会注意到 <base> 标签已被插入为 <head> 标签的子元素。这有助于路由器构建导航路径。以下是你在添加路由后\
  \ Angular 应用程序的 index.html 文件示例：\n\n```\n<!doctype html>\n<html lang=\"en\">\n<head>\n\
  \    <meta charset=\"utf-8\">\n    <title>Client</title>\n    <base href=\"/\">\n\
  \    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\
  \    <link rel=\"icon\" type=\"image/x-icon\" href=\"favicon.ico\">\n</head>\n<body>\n\
  \  <app-root></app-root>\n</body>\n</html>\n```\n\n<base href> 标签是一个 HTML 标签，允许你定义将用于确定文档中任何相对\
  \ URL 的绝对 URL 的基本 URL。\n\n## The routing modules\n\nCLI 已在 src/app/app-routing.module.ts\
  \ 文件中添加了一个路由模块用于设置路由，如下所示：\n\n```\nimport { NgModule } from '@angular/core';\nimport\
  \ { Routes, RouterModule } from '@angular/router';\n\nconst routes: Routes = [];\n\
  \n@NgModule({\n  imports: [RouterModule.forRoot(routes)],\n  exports: [RouterModule]\n\
  })\nexport class AppRoutingModule { }\n```\n\n此代码从提供必要路由器 API 的 @angular/router\
  \ 包导入 Routes 和 RouterModule 符号。接下来，它定义了一个 Routes 类型的 routes 数组。此数组将用于添加应用程序中的任何路由。\n\
  \n接下来，通过路由模块的 imports 数组添加 RouterModule，并使用之前定义的 routes 数组调用其 forRoot() 方法。然后使用\
  \ exports 数组从路由模块导出 RouterModule。\n\nAppRoutingModule 只是一个 Angular 模块，它将 RouterModule\
  \ 的一个实例与将用于保存应用程序中任何路由的 routes 数组包装在一起。RouterModule 是一个内置模块，提供实现路由所需的服务和指令，例如 RouterLink、RouterLinkActive\
  \ 和 RouterOutlet。\n\n相同的路由模块已添加到 users 和 feed 模块中。\n\n## The router outlet\n\n除了路由模块之外，还在根应用程序组件中添加了\
  \ router-outlet 指令。转到 src/app/app.component.html 模板并查找包含 <router-outlet> 自定义标签的一些\
  \ HTML 代码，如下所示：\n\n```\n<!-- [...] -->\n<router-outlet></router-outlet>\n```\n\n\
  路由出口是一个与 @angular/router 模块中的其他路由 API 一起导入的指令，它充当标记，告诉路由器根据之前描述的传递给 routes 数组的信息，在哪里插入并渲染与浏览器\
  \ URL 匹配的组件（们）。\n\n## Importing the routing module\n\nCLI 还在根应用程序模块中导入了 AppRoutingModule，该模块可在\
  \ src/app/app.module.ts 文件中找到，使用以下代码：\n\n```\nimport { NgModule } from '@angular/core';\n\
  import { BrowserModule } from '@angular/platform-browser';\n\nimport { AppRoutingModule\
  \ } from './app-routing.module';\nimport { AppComponent } from './app.component';\n\
  import { HeaderComponent } from './core/components/header/header.component';\nimport\
  \ { FooterComponent } from './core/components/footer/footer.component';\nimport\
  \ { PageNotFoundComponent } from './core/components/page-not-found/page-not-found.component';\n\
  \n@NgModule({\n  declarations: [\n    AppComponent,\n    HeaderComponent,\n    FooterComponent,\n\
  \    PageNotFoundComponent\n  ],\n  imports: [\n    BrowserModule,\n    AppRoutingModule\n\
  \  ],\n  providers: [],\n  bootstrap: [AppComponent]\n})\nexport class AppModule\
  \ { }\n```\n\nAppRoutingModule 从 app-routing.module.ts 文件导入并添加到 AppModule imports\
  \ 数组中。对 users 和 feed 模块中的每个路由模块也执行了相同的操作。\n\n我们已记录了 Angular CLI 自动执行以在项目中建立路由的所有步骤。在下一部分中，我们将了解如何向之前创建的组件添加路由以提供应用内导航。\n\
  \n## Understanding and adding routes\n\n如前所述，Angular CLI 在创建项目时自动配置了路由，因此现在我们需要做的就是指定我们之前创建的应用程序组件的路由。\n\
  \n并非所有组件都是可路由的——换句话说，它们不应映射到特定路径。例如，header 组件将包含在其他组件中以通过其选择器渲染页面的页眉元素，因此我们无需将其包含在路由模块的\
  \ routes 数组中。\n\n路由是一个 Route 对象，其中包含有关哪个组件映射到哪个路径的信息。路径是 URL 元素，指定应导航到哪个视图。\n\n\
  路由可能具有以下一个或多个属性：\n\n- **path**：保存路由路径的属性。\n- **pathMatch**：用于配置路由器匹配路径时使用的匹配策略的属性。它可以具有\
  \ `prefix` 或 `full` 值，其中 `prefix` 为默认值。\n- **component**：引用应映射到路由的组件的属性。\n- **redirectTo**：包含另一个路径的属性，如果\
  \ `path` 属性中的路径匹配，则希望重定向到该路径。\n- **loadChildren**：路由器按需加载模块的属性。\n\n这些是路由最常用的功能，但我们也可以使用其他属性，可在官方文档中找到。\n\
  \n考虑以下示例：如果我们浏览到 /posts URL，我们希望路由器渲染 posts 组件。我们需要做的就是将以下路由配置添加到 routes 数组中：\n\n\
  ```\n{ path: 'posts', component: PostsComponent }\n```\n\n我们还可能有特殊路径，例如空路径，它指的是应用程序域名根\
  \ URL，或用 ** 标记的通配符路径，它指的是路由器在用户导航到 routes 数组中不存在的路径时将匹配的默认路由。你可以使用它来显示 404 错误页面，告知用户页面不存在，或者你可以简单地将访客重定向到另一个\
  \ URL。\n\n接下来，我们将了解路由器匹配路由的匹配策略。\n\n## Route-matching strategies\n\nAngular 路由器中的匹配算法提供两种策略：prefix\
  \ 和 full，不过你也可以使用自定义匹配策略：\n\n- 路由器检查浏览器 URL 的开头是否以路由的路径为前缀，并使用默认的 prefix 策略渲染适当的组件。\n\
  - 路由器使用 full 策略确定浏览器 URL 的路径段是否与路由的路径相同。\n\n如果需要匹配整个路径，只需将路由的 pathMatch 属性设置为 full\
  \ 策略，如下所示：\n\n```\n{ path: 'posts', pathMatch: 'full', component: PostsComponent\
  \ }\n```\n\n空路径的场景是匹配完整路径的另一个典型示例，因为默认的 prefix 策略将匹配所有路径，因为空字符串是任何路径的一部分。例如，我们可以使用以下路由配置将访客在首次访问我们的应用程序时重定向到\
  \ /home 路径：\n\n```\n{ path: '', redirectTo: '/home', pathMatch: 'full' }\n```\n\n\
  我们使用 redirectTo 而不是 component 属性，后者接受用户将被路由到的路径。\n\n\n\n现在我们已经学习了路由匹配策略以及前缀和完整策略的区别，让我们来看一下路由参数。\n\
  \n## 路由参数\n\n路由也可以用于携带参数。Angular 路由器支持动态路径，并提供在匹配的组件中访问路由参数所需的 API。\n\n你可以通过在参数名称前加上冒号来为路由添加参数，如下所示：\n\
  \n```\n{path: 'post/:id' , component: PostComponent}\n```\n\n我们使用了一个名为 id 的参数。\n\
  \n路由参数的值可以通过使用 ActivatedRoute 服务获得，该服务允许你获取与在路由器出口中加载的组件关联的路由信息，以及 ParamMap Observable，它提供查询参数的映射。\n\
  \n> **重要提示**\n> 将 Observable 视为可能在未来某个时间点可用（不一定是在定义时）的数据集合。它是执行 JavaScript 异步操作的一种不同方法，比\
  \ Promise 更强大。它在 Angular 中通过 RxJS 库得到支持，并且与框架紧密集成，拥有多个内置 API。\n\n## 添加路由\n\n现在我们已经学习了路由、匹配策略和参数，让我们在应用程序中为之前创建的组件添加路由。\n\
  \n返回 src/app/app.component.html 文件并删除所有不必要的 HTML 标记，只保留路由器出口。接下来，分别在路由器出口上方和下方包含页眉和页脚组件，如下所示：\n\
  \n```\n<app-header></app-header>\n<main>\n    <router-outlet></router-outlet>\n\
  </main>\n<app-footer></app-footer>\n```\n\n接下来，打开 src/app/users/users-routing.module.ts\
  \ 文件并开始添加以下导入：\n\n```\nimport { LoginComponent } from './components/login/login.component';\n\
  import { SignupComponent } from './components/signup/signup.component';\nimport\
  \ { ProfileComponent } from './components/profile/profile.component';\n```\n\n接下来，为每个组件添加路由并将空路由重定向到登录路由：\n\
  \n```\nconst routes: Routes = [\n  { path: '' , pathMatch: 'full', redirectTo: 'login'\
  \ },\n  { path: 'login' , component: LoginComponent },\n  { path: 'signup' , component:\
  \ SignupComponent },\n  { path: 'profile/:userId' , component: ProfileComponent\
  \ }\n];\n```\n\n我们导入了 users 模块的组件并在 routes 数组中为它们添加了路由。\n\n接下来，打开 src/app/feed/feed-routing.module.ts\
  \ 文件并添加此导入：\n\n```\nimport { PostsComponent } from './components/posts/posts.component';\n\
  ```\n\n接下来，为 posts 组件添加路由并将空路由重定向到 posts 路由：\n\n```\nconst routes: Routes = [\n\
  \  { path: '', pathMatch: 'full', redirectTo: 'posts' },\n  { path: 'posts', component:\
  \ PostsComponent }\n];\n```\n\n我们导入了 feed 模块的组件并在 routes 数组中为其添加了路由。\n\n最后，打开 src/app/app-routing.module.ts\
  \ 文件并开始添加以下导入：\n\n```\nimport { PageNotFoundComponent } from './core/components/page-not-found/page-not-found.component';\n\
  ```\n\n接下来，将突出显示的路由添加到 routes 数组中：\n\n```\nconst routes: Routes = [\n  { path: '',\
  \ pathMatch: 'full', redirectTo: 'feed' },\n  { path: 'users', loadChildren: ()\
  \ =>\n    import('./users/users.module').then(m => m.UsersModule)\n  },\n  { path:\
  \ 'feed', loadChildren: () =>\n    import('./feed/feed.module').then(m => m.FeedModule)\
  \ },\n  { path: '**', component: PageNotFoundComponent }\n];\n```\n\n我们导入了 PageNotFoundComponent\
  \ 组件，然后为该组件添加了通配符路由。如果用户尝试访问路由器配置中不存在的路由，这将把用户带到该组件。我们还使用了 loadChildren 属性，以便在用户访问\
  \ users 和 feed 路径时延迟加载 users 和 feed 模块。\n\n你可以从 https://angular.io/guide/lazy-loading-ngmodules\
  \ 了解更多关于 loadChildren 的信息。\n\n现在我们已经学习了 Angular 中的路由，并在应用程序的不同模块和组件中添加了路由，让我们继续添加导航链接，以便用户可以在应用的不同视图之间导航。\n\
  \n## 添加导航\n\nAngular Router 提供了 routerLink 和 routerLinkActive 指令，它们必须代替 <a> 标签中的常规\
  \ href 属性来创建导航链接。routerLinkActive 用于标记活动链接。\n\n打开 src/app/core/components/header.component.html\
  \ 文件并按如下方式更新它：\n\n```\n<button routerLink=\"/feed/posts\">Feed</button>\n<button\
  \ routerLink=\"/users/profile/ahmedbouchefra\">My profile</button>\n<button routerLink=\"\
  /users/login\">Login</button>\n<button routerLink=\"/users/signup\">Sign up</button>\n\
  ```\n\n我们使用 routerLink 指令添加了四个导航按钮，该指令保存用户在点击相应按钮后将被带到的目标路径。\n\n这只是为了测试我们的导航链接；我们稍后会更改此组件的模板以在更合适的位置包含按钮。例如，我们实际上不需要将登录和注册按钮放在页眉区域，因为如果用户未登录，用户将被自动重定向到登录组件。\n\
  \n接下来，让我们看看如何在相应的 profile 组件中获取传递给 /profile 路径的 userId 参数。打开 src/app/users/components/profile/profile.component.ts\
  \ 文件并按如下方式更新它：\n\n```\nimport { Component, OnInit } from '@angular/core';\nimport\
  \ { ActivatedRoute } from '@angular/router';\n\n@Component({\n    selector: 'app-profile',\n\
  \    templateUrl: './profile.component.html',\n    styleUrls: ['./profile.component.css']\n\
  })\nexport class ProfileComponent implements OnInit {\n    constructor(private route:\
  \ ActivatedRoute) { }\n    ngOnInit(): void {\n        this.route.params.subscribe(params\
  \ => {\n            console.log(params['userId']);\n        });\n    }\n}\n```\n\
  \n我们通过组件构造函数导入并注入 ActivatedRoute 的一个实例，并订阅 params Observable 以获取 userId 参数。我们稍后将看到如何使用此信息查询与当前登录用户相关的信息和帖子并将其渲染在个人资料页面上。\n\
  \n在 Angular 前端实现路由和导航之后，让我们向你介绍一些调试应用程序的技巧。\n\n## 调试 Angular 应用程序\n\nAngular 默认以开发模式运行，该模式启用了调试并为开发者提供了\
  \ enableProdMode() 方法来启用生产模式。这也会禁用调试并从最终的生产包中删除任何调试信息。\n\n使用新的 Ivy 渲染器，我们还在全局 ng\
  \ 对象上有一组 API，你可以在 Angular 应用程序运行时直接从浏览器控制台调用方法、更新状态和访问组件。有关更多信息，请查看 https://angular.io/api/core/global。\n\
  \n运行你的 Angular 应用程序后，打开浏览器控制台；你应该能够看到 Angular is running in development mode. Call\
  \ enableProdMode() to enable production mode 消息：\n\n![](img/c798729e4c42765fcb1c98950164d0ba_170_0.png)\n\
  \n图 6.2 – 控制台中 Angular 正在开发模式下运行的消息\n\n这只是告诉你你的应用程序处于开发模式并且已启用调试。\n\n在完成应用程序的开发后，你应该通过使用\
  \ enableProdMode() 函数启用生产模式来关闭调试，如下所示：\n\n```typescript\nimport { enableProdMode\
  \ } from '@angular/core';\nenableProdMode();\n```\n\n启用生产模式会告诉 Angular 停止执行生产环境中不需要的许多不必要操作，这将同时减少最终应用程序包的大小并提高运行时性能。\n\
  \n事实上，如果你打开项目的 src/main.ts 文件，你应该会看到此方法已被添加：\n\n```typescript\nimport { enableProdMode\
  \ } from '@angular/core';\nimport { platformBrowserDynamic } from '@angular/platform-browser-dynamic';\n\
  import { AppModule } from './app/app.module';\n```\n\n\n\n```\nimport { environment\
  \ } from './environments/environment';\n\nif (environment.production) {\n    enableProdMode();\n\
  }\n// [...]\n```\n\n这仅在 environment.production 变量被设置为 true 时启用生产模式，而在 Angular CLI\
  \ 运行 ng build --prod 命令时使用的 environments/environment.prod.ts 文件中就是这种情况。\n\n继续在你的应用程序中选择一些\
  \ DOM 元素，例如 Feed 按钮，然后右键单击并在上下文菜单中点击 Inspect（或在 Chrome 上按 Ctrl + Shift + I）。\n\n\
  在 DevTools 中，我们可以使用 $0 引用最近选择的 DOM 元素。将其与 ng.getOwningComponent() 方法结合，我们可以在控制台中获取渲染该元素的组件，如下所示：\n\
  \n```\n> ng.getOwningComponent($0)\n< ▼ HeaderComponent { _ngContext_: LComponentView_AppComponent(53)\
  \ } ⓘ\n  ► _ngContext__: LComponentView_AppComponent(53) [app-root, TView, 147,\
  \ LRootView(31), nul...\n  ▼ _proto__:\n    ► constructor: class HeaderComponent\n\
  \    ► ngOnInit: f ngOnInit()\n    ► _proto__: Object\n> |\n```\n\n图 6.3 – 使用 ng\
  \ 获取 DOM 元素的父组件\n\n返回 src/app/core/components/header/header.component.ts 文件并向组件添加以下方法：\n\
  \n```\ninvokeMe() {\n    console.log(\"Invoked from the console\");\n}\n```\n\n\
  接下来，返回正在运行的应用程序，从头部区域选择一个按钮，运行 ng.getOwningComponent($0) 方法，并将结果分配给一个组件变量，如下所示：\n\
  \n```\nconst component = ng.getOwningComponent($0)\n```\n\n你应该能够按如下方式调用 invokeMe\
  \ () 方法：\n\n```\ncomponent.invokeMe ()\n```\n\n这是在浏览器控制台中你会看到的结果：\n\n```\n> const\
  \ component = ng.getOwningComponent($0)\n< undefined\n> component.invokeMe()\n \
  \ Invoked from the console                header.component.ts:16\n< undefined\n\
  > |\n```\n\n图 6.4 – 从控制台调用组件方法\n\n你也可以使用其他方法，例如以下：\n\n- `ng.getComponent(element)`\
  \ 用于在所选元素对应于组件时获取该元素的组件\n- `ng.getDirectives(element)` 用于获取所选元素的关联指令\n- `ng.applyChanges(element)`\
  \ 用于触发所选组件的变更检测\n\n我们已经看到 Angular 默认以启用调试的开发模式运行，以及在完成应用程序开发时如何打开生产模式。我们还看到了 Ivy\
  \ 提供的一些方法，这些方法可以帮助开发人员从浏览器控制台调试 Angular 应用程序。在下一节中，你将了解 Angular Material，并将看到如何使用\
  \ Angular CLI 在项目中安装和配置它。\n\n## 添加 Angular Material\n\nAngular Material 为 Angular\
  \ 提供基于 Material Design 的 UI 组件。借助 Angular CLI，你可以在几个步骤内将其安装到项目中。\n\n返回你的命令行界面，并在项目的根目录下运行以下命令：\n\
  \n```\nng add @angular/material\n```\n\n系统会提示你 `The package @angular/material@12.2.8\
  \ will be installed and executed. Would you like to proceed? (Y/n)`。输入 Y 并按 Enter。\n\
  \n这将从 npm 安装包。接下来，CLI 会提示你 `Choose a prebuilt theme name, or \"custom\" for a custom\
  \ theme`。我们选择 Indigo/Pink。接下来，它会询问 `Set up global Angular Material typography styles?`\
  \ 输入 y。接下来，它会询问 `Set up browser animations for Angular Material?` 输入 y。\n\n就这样——你应该已经在项目中安装并配置了\
  \ Angular Material。\n\n## 总结\n\n在本章中，我们学习了如何使用 Angular CLI 基于框架的最新版本生成全新的 Angular\
  \ 应用程序。我们还研究了 Angular 的许多基本概念，例如模块、组件和服务，以及如何使用 Angular CLI 生成提供应用程序结构的这些构件。\n\n\
  在涵盖这些主题并生成应用程序的基本结构后，我们随后讨论了 Angular 中路由的基本概念，包括路由模块、路由以及导航指令，例如 `routerLink`，它取代了\
  \ HTML 中的常规 `href` 属性。\n\n接下来，我们研究了一些调试应用程序的技巧，使用开发模式下默认可用的调试方法，以及在准备将应用程序部署到生产环境时启用生产模式的原因。\n\
  \n最后，我们向项目添加了 Angular Material，以在接下来的章节中提供 Material Design 组件来构建应用程序 UI。\n\n本章到此结束！在下一章中，我们将继续构建前端应用程序以使用后端之前构建的\
  \ GraphQL API 的旅程。我们将具体看到如何使用 Apollo Client 将前端与后端集成，以便向服务器发送 GraphQL 查询和写入数据。\n"
- "## 7 添加用户搜索功能\n\n在上一章中，我们看到了如何使用 Angular CLI 基于最近版本的框架创建一个全新的 Angular 项目。我们回顾了许多基本的\
  \ Angular 概念，例如模块、组件和服务，以及如何使用 Angular CLI 生成构成应用程序结构的构件。\n\n我们还在项目中包含了 Angular\
  \ Material，以提供 Material Design 组件用于创建视觉上吸引人的应用程序 UI。\n\n在本章中，我们将具体研究如何使用 Apollo\
  \ Client 将前端与后端集成，Apollo Client 旨在向服务器发送 GraphQL 查询和变更以获取和写入数据。\n\n我们将介绍使用 Angular、Apollo\
  \ Client 和 GraphQL 添加身份验证所需的概念和步骤。同时，我们将开发以下功能：\n\n- 一个注册和登录界面，允许用户创建账户并进行身份验证\n\
  - 一个包含用于导航应用程序、登录和注销的按钮的头部栏，以及用于搜索网络用户的搜索栏\n- 一个显示 `ngSocial (c) 2021` 的页脚\n\n我们将涵盖以下主题：\n\
  \n- 介绍和安装 Apollo Client\n- 导入 Angular Material 组件\n- 注册和登录用户\n\n## 技术要求\n\n要成功完成本章的步骤，你必须先完成本书的上一章。\n\
  \n你可以选择性地安装以下内容：\n\n- Angular DevTools\n- DevTools for Apollo Client\n- Visual Studio\
  \ Code\n\n如果你使用 Visual Studio Code，强烈建议使用 `ext install GraphQL.vscode-graphql` 命令安装\
  \ GraphQL for Visual Studio Code 扩展。你也可以使用 `ext install capaj.graphql-codegen-vscode`\
  \ 命令将 Codegen 与 Visual Studio Code 集成，并在每次保存查询/变更时运行它。\n\n你还应熟悉以下技术：\n\n- JavaScript/TypeScript\n\
  - HTML\n- CSS\n- RxJS Observables；请查看 https://angular.io/guide/observables 和 https://rxjs.dev/guide/observable\n\
  - Angular testing；请查看 https://angular.io/guide/testing\n\n本章的源代码可在 https://github.com/PacktPublishing/Full-Stack-App-Development-with-Angular-and-GraphQL/tree/main/Chapter07\
  \ 找到。\n\n## 介绍和安装 Apollo Client\n\n在本节中，我们将向你介绍 Apollo Client，它有助于将你的 Angular 前端与构建在\
  \ Apollo Server 之上的 GraphQL API 集成。然后，我们将看到如何在 Angular 项目中安装和配置 Apollo Client。\n\
  \nApollo Client 是一个 JavaScript 状态管理库，允许开发人员使用 GraphQL 管理本地和远程数据。它可用于检索、缓存和更新应用程序数据，同时自动将数据更改与你的\
  \ UI 同步。\n\n让我们在 Angular 项目中安装 Apollo Client：\n\n- 1. 返回你的终端并从 Angular 项目的根文件夹执行以下命令：\n\
  - 2. 之后，系统会提示你输入 GraphQL 端点的 URL。输入 http://localhost:8080/graphql。\n\n```\nng add\
  \ apollo-angular\n```\n\napollo-angular 包将被安装并执行。你将被问到以下问题：\n\n```\nWould you like\
  \ to proceed?\n```\n\n输入 Y 并按 Enter。\n\n这将安装并配置 Apollo Client。src/app/graphql.module.ts\
  \ 文件将被创建并在 src/app/app.module.ts 文件中导入，如下所示：\n\n```\n// [...] \nimport { GraphQLModule\
  \ } from './graphql.module';\nimport { HttpClientModule } from\n'@angular/common/http';\n\
  \n@NgModule({\n  declarations: [\n    // [...] \n  ],\n  imports: [\n    // [...]\
  \ \n    GraphQLModule,\n    HttpClientModule\n  ],\n```\n\n\n\n```\nproviders: [],\n\
  \    bootstrap: [AppComponent]\n})\n\nexport class AppModule { }\n```\n\n在 GraphQL\
  \ 模块中，我们使用来自 apollo-angular/http 的 HttpLink 服务将客户端链接到运行在 http://localhost:8080/graphql\
  \ 的 GraphQL 服务器。我们还使用来自 @apollo/client/core 的 InMemoryCache 来创建内存缓存，用于存储本地和远程数据。HttpLink\
  \ 服务使用 HttpClient 与服务器通信，因此我们在应用程序根模块中还导入了来自 @angular/common/http 的 HttpClientModule。\n\
  \nApollo 提供了 Apollo Link 接口，它允许你管理网络层，在该层中可以插入链接来控制客户端与 GraphQL 服务器之间的数据流，或查询的发送方式。客户端的网络行为可以描述为按顺序运行的链接链。\n\
  \nHttpLink 就是这些链接中的一个示例。默认情况下，Apollo Client 使用 Apollo Link 的 HttpLink 通过 HTTP 将\
  \ GraphQL 操作发送到远程服务器。此默认链接会自动创建，可满足我们的初始用例，但稍后，我们将定义更高级的链接并指定其执行顺序，以扩展默认的网络行为。\n\
  \n阅读 https://www.apollographql.com/docs/react/api/link/introduction/ 了解有关 Apollo\
  \ Link 的更多信息，并查看社区开发的自定义链接列表 https://www.apollographql.com/docs/react/api/link/community-links/。\n\
  \n内存缓存是 Apollo Client 存储从 GraphQL 服务器获取的数据的位置。你可以在 https://apollo-angular.com/docs/caching/configuration/\
  \ 找到更多信息。\n\n现在我们已将 Apollo Client 添加到应用程序中并建立了与 GraphQL 服务器的连接，我们将在下一节中了解如何导入构建应用程序\
  \ UI 所需的 Angular Material 组件。\n\n## 导入 Angular Material 组件\n\n每个 Angular Material\
  \ 组件都包含在其自己的模块中。这些组件通常在整个应用程序的多个位置使用，这就是为什么我们必须从共享模块导入并重新导出它们，以避免在每个模块中都导入它们：\n\n\
  - 1. 打开 shared/shared.module.ts 文件并添加以下导入：\n\n```typescript\nimport { MatToolbarModule\
  \ } from '@angular/material/toolbar';\nimport { MatButtonModule } from '@angular/material/button';\n\
  import { MatIconModule } from '@angular/material/icon';\nimport { MatInputModule\
  \ } from '@angular/material/input';\nimport { MatCardModule } from '@angular/material/card';\n\
  import { MatFormFieldModule } from '@angular/material/form-field';\nimport { MatTooltipModule\
  \ } from '@angular/material/tooltip';\nimport { MatSnackBarModule } from '@angular/material/snack-bar';\n\
  import { MatDialogModule } from '@angular/material/dialog';\nimport { MatProgressBarModule\
  \ } from '@angular/material/progress-bar';\nimport { MatBadgeModule } from '@angular/material/badge';\n\
  ```\n\n组件模块的名称不言自明；例如，MatToolbarModule 包含 Material Toolbar 组件，将用于构建应用程序的页眉，但你也可以查阅官方文档\
  \ https://material.angular.io/ 了解有关每个可用 UI 组件的更多信息。\n\n- 2. 接下来，我们需要按如下方式将这些组件添加到共享模块的\
  \ imports 和 exports 数组中。\n\n首先，将导入的模块添加到 matModules 数组中：\n\n```typescript\nconst\
  \ matModules = [\n  MatToolbarModule,\n  MatButtonModule,\n  MatIconModule,\n  MatInputModule,\n\
  \  MatCardModule,\n  MatFormFieldModule,\n  MatTooltipModule,\n  MatSnackBarModule,\n\
  \  MatDialogModule,\n  MatProgressBarModule,\n  MatBadgeModule\n];\n```\n\n接下来，按如下方式将它们添加到共享模块的\
  \ imports 和 exports 数组中：\n\n```typescript\n@NgModule({\n  declarations: [],\n  imports:\
  \ [\n    CommonModule, ReactiveFormsModule, ...matModules\n  ],\n  exports: [ReactiveFormsModule,\
  \ ...matModules]\n})\nexport class SharedModule { }\n```\n\n由于这些 Angular Material\
  \ 组件需要同时添加到共享模块的 imports 和 exports 数组中，我们只将它们添加到 matModules 数组一次，然后使用 Spread 运算符将其包含在内。查看\
  \ https://basarat.gitbook.io/typescript/future-javascript/spread-operator。\n\n在导入并重新导出必要的\
  \ Material UI 组件后，我们将了解如何添加用户注册和身份验证功能，包括如何使用 UI 组件构建注册和登录界面。\n\n## 注册和登录用户\n\n\
  在本节中，我们将了解如何使用 Apollo Client 和 Angular 的 Apollo 库为 Angular 前端添加用户身份验证。\n\n### 定义\
  \ GraphQL 文档\n\n让我们首先定义用户注册、登录和搜索所需的 GraphQL 文档（查询和变更）：\n\n- 1. 创建 shared/constants/auth.ts\
  \ 文件（确保在 shared/ 文件夹内创建 constants/ 文件夹）并首先添加以下导入和两个字符串常量，其中包含访问令牌和已认证用户的键，这些键将用于在用户浏览器的本地存储中存储相应信息：\n\
  - 2. 添加并导出发送到后端 API 用于注册用户的 register 变更：\n\n```typescript\nimport { gql } from 'apollo-angular';\n\
  export const ACCESS_TOKEN: string = 'accessToken';\nexport const AUTH_USER: string\
  \ = 'authUser';\n```\n\n```typescript\nexport const REGISTER_MUTATION = gql`\nmutation\
  \ register($fullName: String!, $username: String!, $email: String!, $password: String!){\n\
  \  register(fullName:$fullName, username:$username, email:$email, password:$password){\n\
  \    token, user { id fullName bio email username image coverImage postsCount createdAt\
  \ }\n  }\n}\n`;\n```\n\n我们使用 gql 函数包装查询和变更字符串，使其被解析为 GraphQL 文档。它是一个模板字面量标签，用于将查询、变更、订阅和片段传递给\
  \ Apollo Client。它返回 DocumentNode 类型的对象，即解析后 GraphQL 查询字符串的对象表示形式。参见 https://git.io/JikfN。\n\
  \n我们使用了 mutation 操作类型，因为我们需要在 GraphQL 服务器上调用一个变更。我们将其命名为 register，并使用 GraphQL 变量提供了必要的参数（因为我们需要动态传递用户的全名、用户名、电子邮件和密码以便为他们注册账户）。\n\
  \n在我们的变更体中，我们只是请求了 register 字段，该字段我们之前已添加到 GraphQL 服务器模式的 Mutation 类型中，并且由于相应的解析器将返回包含身份验证令牌和保存在数据库中的用户的对象，因此我们指定了一个选择集来请求所需字段。\n\
  \n查看 https://graphql.org/learn/queries/ 了解有关操作类型的更多信息。\n\n- 3. 添加并导出用于身份验证用户的登录变更：\n\
  \n```ts\nexport const LOGIN_MUTATION = gql`\nmutation signIn($email: String!, $password:\
  \ String!){\n  signIn(email:$email, password:$password){\n    token, user { id fullName\
  \ bio email username image coverImage postsCount createdAt }\n  }\n}\n`;\n```\n\n\
  再次，我们使用了 gql 模板字面量来构建将发送到服务器以验证用户的 GraphQL 文档。我们使用了 mutation 类型来指示服务器调用顶级 Mutation\
  \ 类型上的 signIn 字段，并使用变量传递动态参数，例如名称和密码，这些参数是验证用户所必需的。\n\n由于 signIn 变更字段引用了一个包含令牌字符串和用户对象的对象，我们使用选择集来请求客户端所需的所有信息，包括\
  \ JWT 和已认证用户。\n\n- 4. 创建 shared/constants/user.ts 文件并按如下方式导入 gql 标签：\n\n```ts\n\
  import { gql } from 'apollo-angular';\n```\n\n然后，添加并导出用于按 ID 获取用户的用户查询：\n\n```typescript\n\
  export const USER_QUERY = gql`\nquery getUser($userId: ID!){\n  getUser(userId:$userId){\n\
  \    id fullName bio email username image coverImage postsCount createdAt }\n}\n\
  `;\n```\n\n在这里，我们使用 query 操作类型并将用户 ID 作为参数传递，以要求 API 服务器返回具有该 ID 的现有用户。服务器上的 Query\
  \ 类型包含我们正在查询的 getUser 字段，并且由于它返回一个用户对象，因此我们在客户端提供一个选择集来请求我们感兴趣的字段。\n\n- 5. 添加并导出以下用于搜索用户的查询：\n\
  \n```typescript\nexport const SEARCH_USERS_QUERY = gql`\nquery searchUsers($searchQuery:\
  \ String!){\n  searchUsers(searchQuery:$searchQuery){\n    id fullName bio username\
  \ image\n  }\n}\n`;\n```\n\n在这里，我们使用 query 操作类型来请求 GraphQL 模式顶级查询上的 searchUsers\
  \ 字段，该字段返回一个包含作为参数传递的搜索词的全名用户的数组。然后我们指定一个选择集来选择我们感兴趣的用户字段，例如用户的 ID、全名、简介、用户名和图像。\n\
  \n- 6. 最后，创建 shared/index.ts 文件（桶文件）并按如下方式导出已定义的常量：\n\n```typescript\nexport * from\
  \ './constants/auth';\nexport * from './constants/user';\n```\n\n在定义将通过 Apollo Client\
  \ 解析并发送到服务器的查询和变更之后，我们必须定义将从 API 服务器返回的响应/结果的类型。\n\n\n\n## 为用户认证定义类型\n\nTypeScript\
  \ 是一种强类型编程语言。我们将使用它来编写类型安全代码，这有助于防止意外错误并为 IDE 提供自动完成功能以提高生产力。\n\n让我们看看如何创建 TypeScript\
  \ 类型以对服务器响应进行强类型化。我们将从 User 模型开始，它表示单个用户并封装了对应于 GraphQL API 用户信息的字段：\n\n- 1. 创建\
  \ shared/models/user.model.ts 文件并添加，然后导出一个 TypeScript 接口，其中包含以下引用用户详细信息及其类型的字段：\n\
  - 2. 创建 shared/types/auth.ts 文件并首先导入 User 模型：\n\n```ts\nexport interface User {\n\
  \  id: string;\n  fullName: string;\n  bio: string;\n  username: string;\n  email:\
  \ string;\n  image: string;\n  coverImage: string;\n  postsCount: number;\n  createdAt:\
  \ string;\n}\n```\n\n前面的代码块指定了 GraphQL API 返回的用户数据的格式。\n\n```ts\nimport { User }\
  \ from '../models/user.model';\n```\n\n然后，为了对认证状态进行强类型化，定义并导出以下接口：\n\n```ts\nexport\
  \ interface AuthState {\n  isLoggedIn: boolean;\n  currentUser: User | null;\n \
  \ accessToken: string | null;\n};\n```\n\n接下来，定义并导出 register 和 signIn 突变的响应类型：\n\
  \n```ts\nexport type AuthResponse = {\n    token: string;\n    user: User;\n};\n\
  export type RegisterResponse = {\n    register: AuthResponse;\n};\nexport type LoginResponse\
  \ = {\n    signIn: AuthResponse;\n};\n```\n\n3. 创建 shared/types/user.ts 文件并首先添加以下导入：\n\
  \n```ts\nimport { Observable } from 'rxjs';\nimport { User } from '../models/user.model';\n\
  ```\n\n接下来，定义并导出以下类型以对 getUser 和 searchUsers 查询的响应进行类型化：\n\n```ts\nexport type UserResponse\
  \ = {\n    getUser: User;\n};\nexport type UsersResponse = {\n    searchUsers: User[];\n\
  };\nexport type SearchUsersResponse = {\n    data: Observable<UsersResponse>;\n\
  \    fetchMore: (users: User[]) => void\n};\n```\n\n我们从 RxJS 导入了 Observable 类并导入了之前定义的\
  \ User 模型，然后定义并导出了一组类型以对服务器返回的响应进行类型化。这些类型定义了服务器为每个操作返回的响应的数据形状。我们将使用 SearchUsersResponse\
  \ 来为包含搜索用户查询响应以及用于分页的获取更多数据的方法的变量进行类型化。\n\n4. 最后，打开 shared/index.ts 文件并添加以下导出：\n\
  \n```ts\nexport { User } from './models/user.model';\nexport * from './types/user';\n\
  export * from './types/auth';\n```\n\n在下一节中，我们将了解如何构建服务来封装发送用于用户认证的查询和突变的请求的逻辑。\n\
  \n我们将用户搜索功能添加到认证服务中，因为它将对我们的应用程序全局可用，并在仅在我们懒加载用户模块时才加载的个人资料服务之前访问。\n\n## 定义 Apollo\
  \ 服务\n\n在定义了 GraphQL 查询和突变以及请求发送到服务器后将返回的响应类型之后，我们现在必须创建一系列用于注册、认证和搜索用户的服务。\n\n\
  Angular 的 Apollo Client 库支持两种与服务器通信的方法：\n\n- 使用 Apollo 服务，一个 Angular 服务，其中包含诸如 `query()`\
  \ 和 `watchQuery()` 等方法来发送查询，以及 `mutate()` 和 `subscribe()` 来发送突变和订阅。\n- 内置的 `Query`、`Mutation`\
  \ 和 `Subscription` 服务。\n\nMutation、Query 和 Subscription 是泛型 TypeScript 类，它们在类名后接受尖括号之间的泛型类型参数。我们为每个服务指定预期的响应类型以及将发送到服务器的突变、查询或订阅的\
  \ document 属性。查看 https://apollo-angular.com/docs/data/services。\n\n> **注意**\n> 有关\
  \ TypeScript 中泛型类的更多信息，请查看 https://www.typescriptlang.org/docs/handbook/2/generics.html#generic-classes。\n\
  \n在本书中，我们将使用这两种方法与后端通信。更多信息可以在官方文档 https://apollo-angular.com/docs/ 中找到。\n\n现在，让我们创建用于注册、认证和搜索用户的服务：\n\
  \n- 1. 创建 core/services/auth/graphql/register.service.ts 文件并添加以下代码：\n- 2. 创建 core/services/auth/graphql/login.service.ts\
  \ 文件并添加以下代码：\n- 3. 创建 core/services/auth/graphql/getuser.service.ts 文件并添加以下代码：\n\
  \n```ts\nimport { Injectable } from '@angular/core';\nimport { Mutation } from 'apollo-angular';\n\
  import { RegisterResponse, REGISTER_MUTATION } from\n  'src/app/shared';\n\n@Injectable({\n\
  \  providedIn: 'root',\n})\nexport class RegisterGQL extends\n  Mutation<RegisterResponse>\
  \ {\n    document = REGISTER_MUTATION;\n  }\n```\n\n```ts\nimport { Injectable }\
  \ from '@angular/core';\nimport { Mutation } from 'apollo-angular';\nimport { LOGIN_MUTATION,\
  \ LoginResponse } from\n  'src/app/shared';\n\n@Injectable({\n  providedIn: 'root',\n\
  })\nexport class LoginGQL extends Mutation<LoginResponse> {\n  document = LOGIN_MUTATION;\n\
  }\n```\n\n```ts\nimport { Injectable } from '@angular/core';\nimport { Query } from\
  \ 'apollo-angular';\nimport { UserResponse, USER_QUERY } from\n  'src/app/shared';\n\
  ```\n\n```ts\n@Injectable({\n  providedIn: 'root',\n})\nexport class GetUserGQL\
  \ extends Query<UserResponse> {\n  document = USER_QUERY;\n}\n```\n\n我们导入必要的 API，例如\
  \ Injectable 装饰器用于装饰类以定义 Angular 服务，例如 apollo-angular 的 Mutation 和 Query 服务、包含将发送到服务器的查询和突变的常量以及响应类型。\n\
  \n接下来，我们通过扩展 Mutation 或 Query 服务并将 document 属性设置为适当的查询或突变来创建我们的 GraphQL 服务。\n\n\
  封装用户认证功能的认证服务将接下来实现。\n\n## 实现用户认证服务\n\n认证服务是 app 模块的一部分，所有之前定义的 Apollo 服务将被注入到其中。\n\
  \n该服务将包含用户的认证逻辑，并为用户的组件提供注册、登录、注销、检查认证状态、按 ID 获取特定用户以及最后搜索用户的方法。\n\n让我们通过以下步骤开始实现认证服务：\n\
  \n- 1. 打开 core/services/auth/auth.service.ts 文件并首先添加这些导入：\n\n```ts\nimport { Apollo\
  \ } from 'apollo-angular';\nimport { Observable, BehaviorSubject } from 'rxjs';\n\
  import { map, tap } from 'rxjs/operators';\n```\n\n此外，从 shared 模块添加以下导入：\n\n```ts\n\
  import {\n  User,\n  RegisterResponse,\n  LoginResponse,\n  AuthState,\n  UserResponse,\n\
  \  UsersResponse,\n  SearchUsersResponse,\n  SEARCH_USERS_QUERY,\n  ACCESS_TOKEN,\n\
  \  AUTH_USER\n} from 'src/app/shared';\n```\n\n接下来，从相应的源文件导入 GraphQL 服务：\n\n```ts\n\
  import { GetUserGQL } from\n'./graphql/getuser.service';\nimport { LoginGQL } from\
  \ './graphql/login.service';\nimport { RegisterGQL } from\n'./graphql/register.service';\n\
  ```\n\n2. 定义以下公共属性和私有属性：\n\n```ts\nauthState: Observable<AuthState>;\nisLoggedInAsync:\
  \ Observable<boolean>;\nprivate readonly authSubject:\nBehaviorSubject<AuthState>;\n\
  ```\n\n我们定义了两个 Observables，authState 和 isLoggedInAsync，以及一个 authSubject 私有属性，它提供了存储当前用户认证状态的所有不同方式。这些\
  \ Observables 可用于对认证状态的实时更改做出反应。\n\n3. 接下来，通过服务构造函数注入 Apollo 服务和 GraphQL 服务，如下所示：\n\
  \n```ts\nconstructor(\nprivate apollo: Apollo,\nprivate registerGQL: RegisterGQL,\n\
  private loginGQL: LoginGQL,\nprivate getUserGQL: GetUserGQL) {}\n```\n\n在构造函数的体内，添加以下代码：\n\
  \n```\nconst localToken = this.getLocalToken();\nlet isLoggedIn = false;\nif (localToken)\
  \ {\n    isLoggedIn = this.tokenExists() &&\n        !this.tokenExpired(localToken);\n\
  }\nthis.authSubject = new BehaviorSubject<AuthState>({\n    isLoggedIn: isLoggedIn,\n\
  \    currentUser: this.getLocalUser(),\n    accessToken: localToken\n});\nthis.authState\
  \ = this.authSubject.asObservable();\nthis.isLoggedInAsync = this.authState.pipe(map(state\n\
  \    => state.isLoggedIn()));\n```\n\n在构造函数内部，我们创建了 BehaviorSubject 的实例，其初始状态从浏览器的本地存储中检索（用于在离开应用程序后持久保存身份验证状态）。\n\
  \n创建身份验证主题后，我们调用 asObservable() 方法以仅获取主题的可观察部分并将其分配给 authState 属性。由于它被声明为公共属性，其他组件或服务可以使用它来监视身份验证状态。\n\
  \n主题既是观察者也是可观察对象；但要从其他组件监视状态，我们只需要可观察部分。\n\n我们还创建了 isLoggedInAsync 属性，它使用 authState\
  \ 可观察对象上的 map() 运算符仅公开身份验证状态的 isLoggedIn 部分。\n\n为了获取存储在用户浏览器本地存储中的访问令牌、当前用户和登录状态，我们使用服务中的\
  \ getLocalToken()、getLocalUser()、tokenExists() 和 tokenExpired() 方法，这些方法将在后续步骤中定义。\n\
  \n如果 localStorage 中存在令牌且未过期，我们将 isLoggedIn 变量设置为 true，并将其作为初始值连同当前用户和访问令牌一起提供给身份验证主题。\n\
  \n我们使用 `BehaviorSubject` 来存储身份验证状态。\n\n`BehaviorSubject` 是一种能够存储当前值并将其发送给所有新订阅者的主题类型。它应始终使用初始值进行初始化。在我们的例子中，我们用之前定义过的\
  \ `AuthState` 类型的对象对其进行初始化。它包含三个属性：`isLoggedIn` 布尔属性，表示用户是否已登录；`currentUser` 属性，包含当前登录的用户；以及访问令牌。\n\
  \n> **Note**\n> \n> RxJS 的可观察对象、主题和运算符使我们能够构建对实时变化做出反应的响应式 UI。你可以在 https://www.techiediaries.com/javascript-reactive-asynchronous-code-rxjs-6-angular-10/\
  \ 阅读更多关于 RxJS 和响应式编程的内容。\n\n4. 在服务构造函数下方定义以下属性以获取用户的登录状态和当前登录用户：\n\n```typescript\n\
  get isLoggedIn(): boolean {\n    return this.authSubject.getValue().isLoggedIn;\n\
  }\nget authUser(): User | null {\n    return this.authSubject.getValue().currentUser;\n\
  }\n```\n\n在这里，我们使用 `BehaviorSubject` 的 `getValue()` 方法来获取身份验证状态的 `isLoggedIn` 和\
  \ `currentUser` 属性的值。此方法允许我们同步获取行为主题中存储的值，而无需订阅 Observable 并异步获取值。这是因为行为主题在任何时候都包含一个值。\n\
  \n5. 定义以下方法以获取令牌并将当前用户存储在用户浏览器的本地存储中：\n\n```typescript\ngetLocalToken(): string\
  \ | null {\n    return localStorage.getItem(ACCESS_TOKEN);\n}\nstoreUser(user: User):\
  \ void {\n    localStorage.setItem(AUTH_USER,\n        JSON.stringify(user));\n\
  }\n```\n\n6. 定义以下私有方法以从本地存储获取存储的用户并存储令牌：\n\n```ts\nprivate getLocalUser(): User\
  \ | null {\n  return JSON.parse(localStorage.getItem(AUTH_USER) as string) ?? null;\n\
  }\nprivate storeToken(token: string): void {\n  localStorage.setItem(ACCESS_TOKEN,\
  \ token);\n}\n```\n\n7. 定义以下私有方法以检查本地存储中是否存在令牌以及令牌是否已过期：\n\n```ts\nprivate tokenExists():\
  \ boolean {\n  return !!localStorage.getItem(ACCESS_TOKEN);\n}\nprivate tokenExpired(token:\
  \ string): boolean {\n  const tokenObj =\n    JSON.parse(atob(token.split('.')[1]));\n\
  \  return Date.now() > (tokenObj.exp * 1000);\n}\n```\n\n8. 定义以下私有方法以更新和重置身份验证状态：\n\
  \n```ts\nprivate updateAuthState(token: string, user: User) {\n  this.storeToken(token);\n\
  \  this.storeUser(user);\n  this.authSubject.next({\n    isLoggedIn: true,\n   \
  \ currentUser: user,\n    accessToken: token\n  });\n}\nprivate resetAuthState()\
  \ {\n  this.authSubject.next({\n    isLoggedIn: false,\n    currentUser: null,\n\
  \    accessToken: null\n  });\n}\n```\n\n第一个方法将提供的令牌和用户参数存储在本地存储中，然后调用主题的 next ()\
  \ 方法将身份验证状态发布给所有订阅者。此方法将由接下来定义的 register () 和 login () 方法调用。\n\n第二个方法调用身份验证主题的 next\
  \ () 方法来重置身份验证状态。这将由接下来定义的服务的 logOut ()、register () 和 login () 方法调用。它将 isLoggedIn\
  \ 属性设置为 false，并将 currentUser 和 accessToken 设置为 null。\n\n9. 按如下方式定义用于注册用户的 register()\
  \ 方法：\n\n```\nregister(\n    fullName: string,\n    username: string,\n    email:\
  \ string,\n    password: string): Observable<RegisterResponse |\n    null | undefined>\
  \ {}\n```\n\n在方法体内，添加以下代码：\n\n```\nreturn this.registerGQL\n    .mutate({\n    \
  \    fullName: fullName,\n        username: username,\n        email: email,\n \
  \       password: password\n    }).pipe(map(result => result.data), tap());\n```\n\
  \n该方法调用注入的 RegisterGQL 服务实例的 mutate () 方法，使用提供的信息注册用户。\n\n接下来，在 tap () 方法内部，添加以下观察者对象：\n\
  \n```\n{\n    next: (data: RegisterResponse | null | undefined) => {\n        if\
  \ (data?.register.token && data?.register.user) {\n            const token: string\
  \ = data?.register.token,\n            user: User = data?.register.user;\n     \
  \       this.updateAuthState(token, user);\n```\n\n```\n}\n},\n    error: err =>\
  \ {\n        console.error(err);\n        this.resetAuthState();\n    }\n}\n```\n\
  \n在 tap() 方法中，我们检查是否从服务器获取到令牌和用户，并调用 updateAuthState() 方法使用行为主题发布身份验证状态。出现错误时，我们调用\
  \ resetAuthState() 来重置身份验证状态。\n\ntap() 运算符用于执行副作用。查看 https://rxjs.dev/api/operators/tap。\n\
  \n10. 按如下方式定义用于验证用户的 login() 方法：\n\n```\nlogin(\n    email: string,\n    password:\
  \ string): Observable<LoginResponse | null |\n    undefined> {}\n```\n\n接下来，在方法体内添加以下代码：\n\
  \n```\nreturn this.loginGQL\n    .mutate({\n        email: email,\n        password:\
  \ password\n    }).pipe(map(result => result.data), tap());\n```\n\n接下来，在 tap()\
  \ 内部添加以下观察者对象：\n\n```\n{\n    next: (data: LoginResponse | null | undefined) =>\
  \ {\n        if (data?.signIn.token && data?.signIn.user) {\n            const token:\
  \ string = data?.signIn.token, user =\n                data?.signIn.user;\n    \
  \        this.updateAuthState(token, user);\n        }\n    },\n```\n\n```\nerror:\
  \ err => {\n    console.error(err);\n    this.resetAuthState();\n}\n}\n```\n\n在\
  \ login() 和 register() 方法中，我们都调用相应 Apollo 服务的 mutate() 方法向服务器发送请求。它们分别返回 LoginResponse\
  \ 和 RegisterResponse 类型的 Observable。\n\n我们使用 tap() 运算符执行副作用，即将令牌和已验证用户存储在本地存储中并向订阅者发布身份验证状态。mutate()\
  \ 方法接收一个包含将传递给突变的参数的对象。\n\n我们使用 map() 运算符获取结果的数据对象而不是整个对象，这对应于我们的响应类型，或可能为 null\
  \ 或 undefined，因此需要添加这些类型；否则 TypeScript 编译器会抛出错误。\n\n出现错误时，我们将错误记录到控制台并调用 resetAuthState()\
  \ 方法来重置身份验证状态。\n\n11. 实现 getUser() 方法以从我们的 GraphQL API 按 ID 获取用户，如下所示：\n\n```\n\
  getUser(userId: string): Observable<UserResponse> {\n    return this.getUserGQL.watch({\n\
  \        userId: userId\n    }).valueChanges.pipe(map(result => result.data));\n\
  }\n```\n\n在此方法中，我们使用扩展 Apollo Query 服务的 GetUserGQL 服务的 watch() 方法发送查询并保持监视；我们使用\
  \ map() 运算符获取结果的数据对象，而不是完整的 Apollo 查询结果对象，这对应于 Observable<UserResponse> 类型的对象。\n\
  \n只要我们没有取消订阅返回的 Observable，此查询将在应用程序的生命周期内保持活动状态。\n\n\n\n### 12. 实现 searchUsers()\
  \ 方法，如下所示：\n\n```\nsearchUsers(searchQuery: string, offset: number, limit: number):\
  \ SearchUsersResponse {\n  // [...] \n  return { data:\n    feedQuery.valueChanges.pipe(map(result\
  \ =>\n      result.data)), fetchMore: fetchMore };\n}\n```\n\n在方法体中，添加以下代码以发送查询：\n\
  \n```\nconst feedQuery = this.apollo.watchQuery<UsersResponse>({\n  query: SEARCH_USERS_QUERY,\n\
  \  variables: {\n    searchQuery: searchQuery,\n    offset: offset,\n    limit:\
  \ limit\n  },\n  fetchPolicy: 'network-only',\n});\n```\n\n对于给定的查询，你可以指定不同的 fetch\
  \ policies。包含 fetchPolicy 以实现此目的。在这种情况下，我们指示 Apollo Client 忽略缓存并使用 network-only\
  \ fetch policy 直接从服务器检索数据。因此，我们永远不会重用本地缓存的数据，并且总是发送网络请求来检索查询，忽略任何本地缓存的数据。\n\nfetch\
  \ policy 指定当查询执行时 Apollo Client 将如何使用缓存。cache-first policy 是默认值，这意味着 Apollo Client\
  \ 首先检查缓存以查看结果是否在其中，然后发送网络请求以从服务器获取结果。如果结果存在，则无需发送网络请求。\n\n通过将此查询的 fetch policy 配置为\
  \ network-only，我们确保 Apollo Client 总是要求我们的服务器检索与用户输入的搜索词相对应的最新用户列表。\n\n你可以在 https://www.apollographql.com/docs/react/data/queries/#supported-fetch-policies\
  \ 找到有关支持的 fetch policies 的更多详细信息。\n\n### 13. 然后，添加以下包装 Apollo Client 的 fetchMore()\
  \ 方法的函数：\n\n```\nconst fetchMore: (users: User[]) => void = (users: User[]) => {\n\
  \        feedQuery.fetchMore({\n            variables: {\n                offset:\
  \ users.length,\n            }\n        });\n    }\n```\n\n在此方法中，我们将用于搜索用户的 GraphQL\
  \ 查询传递给 Apollo.watchQuery() 方法中的 query 属性。该方法返回一个包含 valueChanges 属性的 QueryRef 对象，该属性是一个\
  \ Observable。我们返回 SearchUsersResponse 类型的对象，其中包含 data 属性，该属性是 UsersResponse 类型的\
  \ Observable，以及 fetchMore 属性，该属性是一个可用于根据传递的分页参数获取更多用户的函数。\n\n> 注意\n> fetchMore()\
  \ 方法由 Apollo 提供用于数据分页。\n> 查看 https://apollo-angular.com/docs/caching/interaction/#incremental-loading-fetchmore。\n\
  \n该方法接受一组与查询一起发送的变量。我们还将 offset 设置为 users.length，以便我们可以获取尚未获取的用户。\n\n在获取分页数据时，我们将使用基于偏移量的分页。按此方法实现，分页字段接收两个参数：limit\
  \ 参数，确定我们想要获取的数据量，以及 offset 参数，告诉我们在返回特定查询的结果时服务器应在数据集中从何处开始。\n\n你可以在 https://apollo-angular.com/docs/data/pagination\
  \ 了解有关 Apollo Client 分页的信息。\n\nwatchQuery() 方法返回 QueryRef 类型的对象，其中包含与 RxJS Observable\
  \ 相同的 methods，但要获取数据，我们需要订阅其 valueChanges 属性，该属性公开标准 RxJS Observable。\n\n### 14.\
