  \ ID 删除指定帖子的自定义事件时被调用。它调用注入的 post 服务的 removePost() 方法并订阅返回的 observable。如果操作成功，我们会显示一条成功消息，内容为\
  \ Post deleted.。否则，我们会处理错误。\n\n我们使用 takeUntil() 操作符与 componentDestroyed 主题配合，在组件被销毁时取消订阅返回的\
  \ observable。\n\n14. 最后，让我们将基础组件添加到 core/ 文件夹的 barrel 文件中。在 core/index.ts 文件中添加以下行：\n\
