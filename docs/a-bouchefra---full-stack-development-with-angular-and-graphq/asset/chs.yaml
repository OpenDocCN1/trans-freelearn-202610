  \n        (comment)= \"onComment($event)\"\n        (like)= \"onLike($event)\"\n\
  \        (listComments)= \"onListComments($event)\"\n        (moreComments)= \"\
  onLoadMoreComments($event)\">\n    </app-post>\n</div>\n```\n\n在 <app-post> 元素内部，按如下方式显示评论：\n\
  \n```\n<div class=\"comments-section\"\n*ngFor=\"let comment of postComments(post.id)\"\
  >\n    <app-comment\n        [comment]=\"comment\"\n        (removeComment)=\"onRemoveComment($event)\"\
  ></app-comment>\n</div>\n```\n\n在这里，我们添加了一个带有 comments-section 类的 HTML division，它将被投影到\
  \ <post> 组件内部的带有 <ng-content> 元素的 HTML division 中。在此 division 内部，我们使用 *ngFor 指令遍历帖子的评论，并使用\
  \ <app-comment> 元素显示每个评论。我们通过 comment 属性传递 comment 对象，并将 removeComment 事件的处理程序设置为在基组件中实现的\
  \ onRemoveComment() 方法。\n\n\n\n下面的截图显示了正在显示的评论：\n\n![](img/c798729e4c42765fcb1c98950164d0ba_360_0.png)\n\
  \n图 11.7 – 显示的评论\n\n现在，我们可以显示评论并加载更多评论。但是，如果我们添加一条评论，它不会自动显示，直到我们点击其中一个按钮。我们将在下一节中修复这个问题。\n\
  \n## 显示新评论\n\n我们可以通过在添加新评论时重新获取评论，或手动将评论添加到缓存来实现此功能。\n\n我们可以通过更新 core/services/comment/comments.service.ts\
  \ 文件中的 createComment() 方法来重新获取评论，如下所示：\n\n```ts\ncreateComment(\n    comment: string,\n\
  \    postId: string) {\n    return this.commentPostGQL\n        .mutate({\n    \
  \        comment: comment,\n            postId: postId\n        }, {\n         \
  \   refetchQueries: ['getCommentsByPostId']\n        })\n        .pipe(map(result\
  \ => result.data!.comment));\n}\n```\n\n但是，在重新获取评论时要小心，因为这将重新运行我们之前为其获取过评论的所有帖子的所有\
  \ getCommentsByPostId 活动查询。\n\n例如，在我的情况下，下面的截图显示了 Apollo DevTools 中当前活动的查询：\n\n\
  ![](img/c798729e4c42765fcb1c98950164d0ba_361_0.png)\n\n图 11.8 - Apollo DevTools\
  \ 中的活动查询\n\n在这里，你可以看到我们同时可以有多个活动的 getCommentsByPostId 查询。\n\n现在，让我们学习如何手动更新缓存。通过将以下对象以及\
  \ update () 方法作为 mutate () 方法的第二个参数添加到 createComment () 方法中进行更新：\n\n```ts\n{\n \
  \   update(cache, comment) {\n        cache.modify({\n            fields: {\n  \
  \              getCommentsByPostId(existingComments) {\n                    const\
  \ comments = [comment, ...existingComments]\n                    return comments;\n\
  \                }\n            }\n        })\n    }\n}\n```\n\n接下来，我们将学习在删除评论后更新缓存。\n\
  \n## 删除评论后更新缓存\n\n如果我们想删除评论，可以点击评论旁边的 x 按钮。此时，评论会被删除，但我们需要刷新评论以验证它已被删除。\n\n我们希望立即看到结果。同样，我们可以通过重新获取评论或手动更新缓存来实现此功能。通过添加带有\
  \ update() 方法的第二个参数对象来更新 core/services/comment/comments.service.ts 文件中的 removeComment()\
  \ 方法，如下所示：\n\n```ts\n{\n    update(cache) {\n        cache.modify({\n          \
  \  fields: {\n                getCommentsByPostId(existingComments, { readField\
  \ }) {\n                    return existingComments\n                        .filter((cc:\
  \ StoreObject) => {\n                            return id !== readField('id', cc)\n\
  \                        });\n                }\n            }\n        });\n  \
  \  }\n}\n```\n\n我们已经导入了 StoreObject，它只代表缓存中的一个对象。在 update() 函数中，我们添加代码通过 filter()\
  \ 方法和 readField() 实用函数来更新缓存以删除已删除的评论，该实用函数用于读取缓存字段的值。有关更多信息，请参阅 https://www.apollographql.com/docs/react/caching/cache-interaction/#example-removing-an-item-from-a-list.\n\
  \n有关此内容的更多信息也可在 https://www.apollographql.com/docs/react/caching/overview/ 获取。\n\
  \n## 为评论框赋予焦点\n\n显示评论框后，我们希望 <textarea> 自动获得焦点，以便我们可以立即开始输入评论。我们可以使用自定义 Angular\
  \ 指令来实现此功能，如下所示：\n\n- 1. 转到你的终端并运行以下命令：\n\n```\nng g directive shared/directives/autofocus\n\
  ```\n\n该指令由 CLI 自动导入到共享模块中。你不需要像对 post 和 comment 组件那样重新导出它，因为它只会在共享模块的组件内部使用。\n\n\
  - 2. 打开 shared/directives/autofocus.directive.ts 文件并按如下方式更新它：\n\n```ts\nimport {\
  \ Directive, AfterViewInit } from '@angular/core';\nimport { MatInput } from '@angular/material/input';\n\
  \n@Directive({\n  selector: '[appAutofocus]'\n})\nexport class AutofocusDirective\
  \ implements AfterViewInit {\n\n    constructor(private matInput: MatInput) { }\n\
  \    ngAfterViewInit() {\n      this.matInput.focus();\n    }\n  }\n```\n\n在这里，我们在实现生命周期接口并注入指令之前导入了\
  \ AfterViewInit 接口和 MatInput 指令。\n\n最后，我们在 ngAfterViewInit() 方法内部调用了 MatInput 实例的\
  \ focus() 方法，该方法在视图初始化后调用一次。\n\n> **注意**\n> 请参阅 https://angular.io/api/core/AfterViewInit\
  \ 和 https://material.angular.io/components/input/overview 获取更多信息。\n\n最后，在 shared/components/post/post.component.html\
  \ 文件中，将自定义 appAutofocus 指令应用于 <textarea> 元素，以便在显示时自动赋予其焦点：\n\n```\n<textarea #commentInput\
  \ placeholder=\"Leave a comment..\" matInput (keydown.enter)=\"createComment($event)\"\
  \ appAutofocus></textarea>\n```\n\n下面的截图显示了点击评论按钮后具有焦点的评论框：\n\n![](img/c798729e4c42765fcb1c98950164d0ba_364_0.png)\n\
  \n图 11.9 – 具有焦点的评论文本区域\n\n我们通过添加用于显示带评论和点赞的帖子的代码和标记完成了个人资料组件的实现。同样，我们需要实现 feeds\
  \ 模块的 posts 组件，即主页，应在其中显示网络上所有用户的最新帖子。\n\n由于 feed 的 posts 组件与个人资料组件相似，并且最常见的代码已实现在基类中，feed\
  \ 的 posts 组件也可以扩展该基类，因此我们将实现此功能留给你作为练习。\n\n## 练习\n\n作为练习，实现用户搜索功能的分页。在第 10 章《获取帖子并添加评论和点赞》中，我们在搜索对话框中添加了一个用于获取更多用户的按钮。但是，我们没有在服务器和客户端应用程序上实现所有必需的代码。因此，作为练习，添加必要的代码以使分页与用户的搜索结果一起工作。\n\
  \n作为第二个练习，实现 post 服务的 getFeed() 方法以获取网络的最新帖子。它的签名如下：\n\n```\ngetFeed(offset: number,\
  \ limit: number) {}\n```\n\n此方法与 getPostsByUserId() 方法类似，只是我们不需要传递 user ID 参数。我们之前定义了\
  \ GraphQL 查询并生成了此方法所需变量和结果类型，因此你只需编写方法体即可。\n\n你还需要为 Query.getFeed 字段的缓存添加必要的字段策略。\n\
  \n最后，实现 feed 模块的 posts 组件。此组件应显示已登录用户的名字和用户 feed。下面的截图显示了在添加用户照片和一些帖子后组件应是什么样子：\n\
  \n![](img/c798729e4c42765fcb1c98950164d0ba_365_0.png)\n\n图 11.10 – feed 的帖子组件\n\n\
  最后，编写必要的测试，类似于你在前几章中所做的那样。\n\n接下来，让我们学习如何为订阅设置 Apollo Client。\n\n## 为订阅设置 Apollo\
  \ Client\n\n在本节中，我们将为订阅设置 Apollo Client，以便在网络上的其他用户实时点赞或评论他们的帖子时通知用户。\n\n订阅需要持久连接，因此无法使用\
  \ Apollo Client 用于查询和突变的默认 HTTP 协议来处理。相反，它们通过社区维护的 subscriptions-transport-ws 库通过\
  \ WebSocket 发送，我们需要在项目中安装它：\n\n- 1. 转到你的终端，确保你已导航到前端项目文件夹（client/ 文件夹）内部，并运行以下命令：\n\
  \n```\nnpm install subscriptions-transport-ws\n```\n\n- 2. 打开 src/app/graphql.module.ts\
  \ 文件并开始添加以下导入：\n\n```ts\nimport {\n  ApolloClientOptions,\n  from,\n  split\n} from\
  \ '@apollo/client/core';\nimport { WebSocketLink } from '@apollo/client/link/ws';\n\
  import { getMainDefinition } from '@apollo/client/utilities';\n```\n\n在这里，我们从其包中导入了\
  \ WebSocketLink 和 getMainDefinition 符号，并将 split 方法添加到从 @apollo/client/core 的现有导入声明中。\n\
  \n- 3. 在 createApollo() 函数内部，定义以下 Apollo 链接：\n\n```ts\nconst ws = new WebSocketLink({\n\
  \  uri: 'ws://localhost:8080/graphql',\n  options: {\n    reconnect: true,\n```\n\
  \n\n\n```\nconnectionParams: {\n    authToken: accessToken\n}\n}\n}) ;\n```\n\n\
  这里，我们创建了一个指向 ws://localhost:8080/graphql URL 的 WebSocket 链接，该 URL 上 WebSocket 服务器正在监听。我们指定了一些选项，例如将\
  \ reconnect 属性设置为 true 以便在 WebSocket 断开连接时重新连接，并使用 connectionParams 对象将身份验证令牌传递给服务器。\n\
  \n- 4. 在同一个函数中，添加以下代码以拆分链接，如下所示：\n\n```\nconst splitLink = split(\n    ({ query\
  \ }) => {\n        const definition = getMainDefinition(query);\n        return\
  \ (\n            definition.kind === 'OperationDefinition' &&\n            definition.operation\
  \ === 'subscription'\n        );\n    },\n    ws,\n    http\n);\n```\n\n这里，我们使用\
  \ split() 函数来拆分链接，以便我们可以根据发送的操作类型——查询、变更或订阅——将适当的数据发送到每个链接。\n\n- 5. 最后，用拆分后的链接替换\
  \ createApollo() 函数返回的链接链中的 HTTP 链接：\n\n```\nreturn {\n    link: from([setAuthorizationLink,\
  \ splitLink]),\n    cache: cache\n};\n```\n\n现在，我们同时拥有指向在不同端口上运行的 HTTP 和 WebSocket\
  \ 服务器的链接。查看源代码提交 https://git.io/JDuwf。\n\n接下来，我们将学习如何在客户端应用程序中实现实时订阅。\n\n## 实现 GraphQL\
  \ 订阅\n\n现在我们已经为 GraphQL 订阅设置了 Apollo Client，我们将学习如何使用订阅为我们的应用程序添加一些实时功能。\n\n在服务器中，我们在\
  \ GraphQL 模式中添加了一个包含两个字段——onPostCommented 和 onPostLiked 的 Subscription 类型。然后，我们实现了所需的解析器，以便在帖子被评论或点赞时将实时更新推送到客户端。\n\
  \n在本节中，我们将学习如何监听来自服务器的实时更新。此过程类似于我们使用查询查询数据的方式，但不是使用查询操作，而是使用订阅操作以及需要从服务器发送的字段。对于响应，每当服务器上有新数据可用时，我们都会收到结果。\n\
  \n在我们的案例中，我们将实现在网络用户添加新评论和点赞时显示帖子上的新评论和点赞的功能，而无需刷新页面或重新点击按钮。我们还将实现一个简单的通知系统，以通知用户新的评论和点赞。\n\
  \n在继续之前，我们需要在服务器中修复一行代码。打开 server/src/index.ts 文件并找到 SubscriptionServer.create()\
  \ 方法。然后，按如下方式更新 onConnect 处理程序内部从 connectionParams 对象检索令牌的代码：\n\n```\nconst token\
  \ = connectionParams['authToken'] || '';\n```\n\n通过阅读以下代码提交查看更改：https://git.io/JDuom。\n\
  \n让我们开始添加用于监听帖子新评论的订阅：\n\n- 1. 打开 src/app/graphql.documents/comment.graphql 文件并添加以下订阅：\n\
  \n```\nsubscription onPostCommented{\n  onPostCommented {\n    ...CommentFields\n\
  \    author { ...BasicUserFields }\n    post { id commentsCount }\n  }\n}\n```\n\
  \nonPostCommented 订阅返回一个 Comment 对象。因此，我们必须使用选择集来请求我们感兴趣的字段，例如 ID、评论文本、作者信息、被评论帖子的\
  \ ID 以及其创建时间。\n\n- 2. 打开 src/app/graphql.documents/like.graphql 文件并添加以下订阅以监听新的点赞：\n\
  \n```\nsubscription onPostLiked{\n  onPostLiked{\n    id\n    user { ...BasicUserFields\
  \ }\n    post { id likesCount }\n    createdAt\n  }\n}\n```\n\n- 3. 添加这些订阅后，从 monorepo\
  \ 项目的根目录使用以下命令运行代码生成器：\n\n```\nnpm run codegen\n```\n\n- 4. 在 src/app/core/services/comment/comments.service.ts\
  \ 文件中，添加以下导入：\n\n```\nimport { OnPostCommentedDocument }\nfrom '@ngsocial/graphql/documents';\n\
  ```\n\n- 5. 通过添加以下代码更新 getCommentsByPostId() 方法：\n\n```\nqueryRef.subscribeToMore({\n\
  \  document: OnPostCommentedDocument,\n  updateQuery: (prev, { subscriptionData\
  \ }) => {}\n});\n```\n\n这里，我们使用了 watch() 方法返回的 QueryResult 对象的 subscribeToMore()\
  \ 来订阅来自 onPostCommented 订阅的实时更新。我们调用了 queryRef 变量的 subscribeToMore() 方法，并将参数对象的\
  \ document 属性设置为 onPostCommentedDocument 订阅。\n\n- 6. 在传递给 updateQuery 属性的箭头函数中，添加以下代码：\n\
  \n```\nif (!subscriptionData.data) {\n    return prev;\n}\nconst newComment = subscriptionData\n\
  \    .data\n    .onPostCommented!;\nconsole.log(\"New comment coming: \",\n    subscriptionData.data);\n\
  if (newComment.post.id !== postId) {\n    return prev;\n}\nreturn {\n    getCommentsByPostId:\
  \ [newComment,\n        ...prev.getCommentsByPostId!]\n};\n```\n\n这里，我们实现了 updateQuery\
  \ 回调函数，该函数在每次从服务器获取新数据时都会被调用，以将新评论与现有评论合并。此函数应返回一个具有初始查询数据形状的对象。\n\n- 7. 打开 src/app/core/services/like/likes.service.ts\
  \ 文件并添加以下导入：\n\n```\nimport { OnPostLikedDocument }\n    from '@ngsocial/graphql/documents';\n\
  ```\n\n- 8. 按如下方式更新 getLikesByPostId() 方法：\n\n```\nqueryRef.subscribeToMore({\n\
  \    document: OnPostLikedDocument,\n    updateQuery: (prev, { subscriptionData\
  \ }) => ({})\n});\n```\n\n- 9. 在传递给 updateQuery 属性的函数中，添加以下代码：\n\n```\nif (!subscriptionData.data)\
  \ {\n    return prev;\n}\nconst newLike = subscriptionData\n    .data\n    .onPostLiked!;\n\
  console.log(\"New like coming: \",\n    subscriptionData.data);\nif (newLike.post.id\
  \ !== postId) {\n    return prev;\n}\nreturn {\n    getLikesByPostId: [newLike,\n\
  \        ...prev.getLikesByPostId!]\n};\n```\n\n现在，如果有人向帖子添加评论，它将被添加并实时显示在评论区域。但是在开始接收新评论的实时更新之前，用户需要至少通过点击帖子上的两个按钮之一来运行\
  \ getCommentsByPostId() 方法以获取评论。前往 https://git.io/JDurx 查看源代码提交。\n\n如果我们需要实现单独的逻辑，例如在获取之前显示有关新评论的通知，我们必须使用之前生成的扩展\
  \ Subscription 服务的 GraphQL 服务：\n\n- 1. 打开 src/app/core/components/header/header.component.ts\
  \ 文件并导入以下生成的服务：\n\n```\nimport {\n    OnPostCommentedGQL,\n    OnPostLikedGQL\n\
  } from '../../gql.services';\n```\n\n- 2. 在组件的类中定义以下属性：\n\n```\npublic notificationsCount:\
  \ number = 0;\n```\n\n这将用于在页眉模板上显示通知的数量。\n\n- 3. 通过服务的构造函数注入你导入的服务：\n\n```\nconstructor(\n\
  \  // [...] \n  private onPostCommentedGQL: OnPostCommentedGQL,\n  private onPostLiked:\
  \ OnPostLikedGQL) { }\n```\n\n- 4. 向组件的类添加以下用于订阅新评论的方法：\n\n```\nsubscribeToNewComments()\
  \ {\n  const onPostCommentedObs = this.onPostCommentedGQL\n    .subscribe();\n \
  \ onPostCommentedObs\n    .subscribe({\n      next: (result) => {\n        const\
  \ comment = result.data?.onPostCommented;\n        if (this.authUser?.id !== comment?.author.id)\
  \ {\n          this.notificationsCount++;\n          this.changeDetectorRef.markForCheck();\n\
  \        }\n      }\n    });\n}\n```\n\n这里，我们调用了 GraphQL 服务的 subscribe() 方法以返回一个\
  \ Observable，我们可以订阅它以开始监听新评论。\n\n然后，我们订阅了返回的 Observable 以开始监听新评论。在观察者对象的 next 处理程序中，我们从\
  \ GraphQL 订阅响应中检索评论；如果评论的作者与当前登录用户不同，我们将递增 notificationsCount 属性。\n\n\n\n5. 同样地，为组件的类添加以下用于订阅新点赞的方法：\n\
  \n```\nsubscribeToNewLikes() {\n    const onPostLikedObs = this.onPostLiked\n  \
  \      .subscribe();\n    onPostLikedObs.subscribe({\n        next: (result) =>\
  \ {\n            const like = result.data?.onPostLiked;\n            if (this.authUser?.id\
  \ !== like?.user.id) {\n                this.notificationsCount++;\n           \
  \     this.changeDetectorRef.markForCheck();\n            }\n        }\n    });\n\
  }\n```\n\n6. 按如下方式从组件的 ngOnInit() 方法调用之前的方法：\n\n```\nngOnInit(): void {\n    this.authService.authState\n\
  \        .pipe(takeUntil(this.destroyNotifier$))\n        .subscribe({\n       \
  \     next: (authState: AuthState) => {\n                this.isLoggedIn = authState.isLoggedIn;\n\
  \                this.authUser = authState.currentUser;\n                this.changeDetectorRef.markForCheck();\n\
  \                this.subscribeToNewComments();\n                this.subscribeToNewLikes();\n\
  \            }\n        });\n}\n```\n\n7. 最后，使用 Material 徽章在模板中显示通知计数。打开 src/app/core/components/header/header.component.html\
  \ 文件并按如下方式更新 Notifications 按钮：\n\n```\n<button *ngIf=\"isLoggedIn\" mat-icon-button\
  \ matTooltip=\"Notifications\">\n  <mat-icon aria-hidden=\"false\" aria-label=\"\
  Notifications\" [matBadge]=\"notificationsCount\" matBadgeColor=\"warn\">\n    notifications\n\
  \  </mat-icon>\n</button>\n```\n\n这里，我们向 <mat-icon> 元素添加了 matBadge 属性并将其绑定到组件的 notificationsCount\
  \ 属性。\n\n就这样——现在你应该能够在应用程序中接收并显示新评论和点赞的通知了。查看提交 https://git.io/JDuoK。\n\n你始终可以扩展此实现以显示用户收到的通知的更多信息。\n\
  \n## 摘要\n\n在本最后一章中，我们学习了如何为 GraphQL 订阅配置 Apollo Client，然后添加代码使用徽章在应用程序的页眉中显示通知。\n\
  \n在整本书中，我们使用 Angular 和 GraphQL 等前沿技术，使用 Lerna 开发了具有 monorepo 架构的全栈应用程序。我们在客户端和服务器上都使用\
  \ Apollo 来发送和响应 GraphQL 查询。\n\n在设置开发环境并安装 Node.js 之后，我们使用 Express.js 和 Apollo Server\
  \ 构建了一个支持 GraphQL 的服务器来实现后端。我们还在开始开发用于消费 API 并向用户展示用户界面以便与后端通信的前端应用程序之前，使用 Apollo\
  \ Studio 与我们的 GraphQL API 通信。\n\n之后，我们解释了如何安装 Express.js 并使用 TypeScript 和 GraphQL\
  \ 对其进行配置。我们使用模拟在实现负责获取和添加数据的解析器之前提供了一个使用 Apollo Server 的工作 GraphQL 服务器。\n\n然后，我们学习了如何使用\
  \ TypeORM 将 MySQL 数据库连接到我们的 Web 应用程序，并实现了用于与数据库通信的解析器。我们公开了一个工作中的 GraphQL API，其解析器从真实的\
  \ MySQL 数据库中查询和删除数据。\n\n我们还利用 TypeORM 抽象数据库操作，使开发人员能够在不更改代码的情况下为其应用程序使用任何所需的数据库管理系统。我们学习了如何将\
  \ TypeORM 连接到 Apollo，以及如何生成和填充数据库表。\n\n接下来，我们使用 Apollo Server 向我们的 GraphQL API 添加了身份验证和图像上传，并学习了使用\
  \ Node.js、Express 和 Apollo Server 添加身份验证以及处理图像上传所需的概念。\n\n我们还向服务器应用程序添加了带身份验证的实时支持，这使我们能够在数据可用时立即将最新数据从服务器通信到客户端。为此，我们利用\
  \ Apollo Server 的 GraphQL 订阅，在用户帖子上的新评论和点赞被添加的瞬间将其从服务器推送到客户端。\n\n在实现后端之后，我们使用 Angular\
  \ CLI 创建了一个新的 Angular 项目，并回顾了许多基本的 Angular 概念，例如模块、组件和服务。我们还学习了如何使用 Angular CLI\
  \ 生成构成应用程序结构的工件。\n\n然后，我们在项目中使用 Angular Material 提供 Material 设计组件，以创建视觉上吸引人的应用程序\
  \ UI。\n\n最后，我们使用 Apollo Client 将使用 Angular 构建的前端与后端集成，Apollo Client 设计用于向服务器发送 GraphQL\
  \ 查询和变更以获取和写入数据。\n\n在开发和测试应用程序并添加任何你想要的额外功能之后，你可以构建生产包并使用你喜欢的托管服务托管它们。请参阅 `https://angular.io/guide/deployment`\
  \ 官方文档以获取有关此过程的更多信息。\n\n感谢你抽出时间阅读本书，希望你喜欢它。\n\n## Index\n\n## Symbols\n\n<base href>\
