  \ => result.data!.setUserCover));\n}\n```\n\n## 实现基础组件\n\n由于用户个人资料和 feed 帖子组件的实现相似，这些组件之间共享大量代码。为了避免重复造轮子并遵循\
  \ Don't Repeat Yourself (DRY) 原则，我们可以使用 TypeScript 继承，通过抽象基类实现共享功能，然后从两个组件中扩展它。\n\
  \n让我们逐步介绍如何实现 profile 组件：\n\n1. 创建 shared/types/post.event.ts 文件并添加以下类型：\n\n```\n\
