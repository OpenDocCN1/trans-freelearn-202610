  \ source code can be found at this link: https://git.io/Ja7Bo.\n\n## Implementing\
  \ the header component\n\nLet's implement and style the header and footer components\
  \ now that we've implemented the user authentication functionality.\n\nWhen the\
  \ user is logged in, the header should look like this:\n\n![](img/c798729e4c42765fcb1c98950164d0ba_209_0.png)\n\
  \nFigure 7.3 – The header component\n\nBegin with the header component and proceed\
  \ as follows:\n\n- 1. Open the core/components/header/header.component.ts file and\
  \ start by adding the following imports:\n\n```\nimport { Component, OnInit, ElementRef,\
  \ ViewChild }\n    from '@angular/core';\nimport { Router } from '@angular/router';\n\
  import { MatDialog, MatDialogConfig } from\n    '@angular/material/dialog';\nimport\
