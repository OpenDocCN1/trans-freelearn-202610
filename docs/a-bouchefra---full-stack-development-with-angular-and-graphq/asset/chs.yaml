  comment\">\n<p>\n  {{comment.comment}}\n\n  {{comment.createdAt}}\n  <button mat-icon-button\n\
  \    matTooltip=\"Remove\" (click)=\"remove()\">\n    x\n  </button>\n</p>\n</mat-card-subtitle>\n\
  ```\n\n在这里，我们显示了评论、评论的日期以及用于删除评论的删除按钮。\n\n然后，我们将 mat-icon-button 指令应用于此按钮以创建具有 Material\
  \ 样式和行为的图标按钮，并使用 matTooltip 属性为悬停在按钮上时添加工具提示。\n\n现在，让我们返回帖子组件的模板，并在包含评论 textarea\
