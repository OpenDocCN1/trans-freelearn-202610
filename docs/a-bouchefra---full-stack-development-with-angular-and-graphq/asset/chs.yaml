  \ Observable 重新发出帖子数据，因为它们都由 switchMerge() 操作符链接。\n\n## 使用字段策略重写日期\n\n接下来，让我们以人类可读的格式显示帖子和评论的日期。我们将以时间流逝格式进行，这在社交网络应用中很常见：\n\
  \n1. 在客户端项目中安装以下包：\n2. 打开 src/app/cache.ts 文件并导入库：\n3. 为 Post.createdAt 和 Comment.createdAt\
  \ 字段添加两个字段策略。让我们从 Post 类型开始：\n\n```\nnpm install timeago.js\n```\n\n```\nimport\
  \ * as timeago from 'timeago.js';\n```\n\n```\nPost: {\n  fields: {\n    createdAt:\
  \ {\n      read(createdAt) {\n        return timeago.format(createdAt)\n      }\n\
  \    }\n  }\n}\n```\n\n```\n}\n}\n},\n```\n\n我们只是在字段被读取时使用我们刚刚导入的 `timeago` 对象的\
