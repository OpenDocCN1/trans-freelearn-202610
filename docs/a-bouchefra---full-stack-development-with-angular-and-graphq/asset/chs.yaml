  }\n```\n\nWe call the logOut() method of AuthService, then navigate to the login\
  \ page.\n\nThen, implement the method to search for users:\n\n```\nsearchUsers():\
  \ void {\n  const searchText =\n    this.searchInput?.nativeElement.value;\n  const\
  \ result: SearchUsersResponse =\n    this.authService.searchUsers(searchText, 0,\
  \ 10);\n  const dialogConfig = new MatDialogConfig();\n  dialogConfig.data = result;\n\
  \  this.matDialog.open(SearchDialogComponent,\ndialogConfig);\n}\n```\n\nWe get\
  \ the search term entered by the user in the search input field using the nativeElement.value\
  \ property of the searchInput property, then call the searchUsers() method of the\
  \ authentication service to send the search query to the server, and finally, call\
  \ the openSearchDialog() method to display the users whose names correspond to the\
  \ entered search term, using a Material dialog.\n\n- 4. Open the core/components/header/header.component.html\
  \ file and add the following markup to display the search bar on the left:\n\n```\n\
  <mat-toolbar>\n    <mat-toolbar-row>\n        <h1>ngSocial</h1>\n        <div *ngIf=\"\
  authService.isLoggedIn\">\n            <input class=\"searchbar\" type=\"text\"\n\
  \                placeholder=\"Search\" #searchInput matInput>\n            <button\
  \ mat-icon-button\n                (click)=\"searchUsers()\">\n                <mat-icon>search</mat-icon>\n\
  \            </button>\n        </div>\n        <span class=\"spacer\"></span>\n\
  ```\n\nWe add a Material toolbar using the <mat-toolbar> component with one row\
  \ using the <mat-toolbar-row> component. Next, we add the <h1> tag containing our\
  \ application's name, as well as a <div> tag containing the search bar and some\
  \ navigation buttons that will be added next.\n\nWe conditionally render the <div>\
  \ tag containing the input field, which has the #searchInput template reference\
  \ used to access it from the component's class with the ViewChild decorator. It\
  \ also has a search icon button for invoking the searchUsers() method defined in\
