  \nFigure 11.6 – 使用格式化日期的帖子和评论\n\n现在我们已使用“time ago”格式格式化了帖子和最新评论的日期，让我们学习如何获取和显示评论。\n\
  \n## 显示评论\n\n按照以下步骤获取并显示评论：\n\n- 1. 在 core/components/base.component.ts 文件中，通过将其添加到现有的导入声明中导入\
  \ Comment 类型：\n- 2. 在同一文件中，在基本组件内部定义以下属性：\n- 3. 向基类添加用于获取评论的 onListComments() 方法：\n\
  \n```\nimport {\n  User,\n  Post,\n  Comment\n} from '@ngsocial/graphql/types';\n\
  ```\n\n然后，导入以下突出显示的类型：\n\n```\nimport {\n  CommentEvent,\n  LikeEvent,\n  ListCommentsEvent,\
  \ MoreCommentsEvent,\n  PostEvent,\n  RemoveCommentEvent,\n  RemovePostEvent\n}\
  \ from 'src/app/shared';\n```\n\n```\npublic comments: Map<string,\n  {\n    result:\
  \ Comment[],\n    fetchMore: () => void\n  }> = new Map();\n```\n\n这将用于将评论数组和 fetchMore()\
  \ 函数映射到帖子 ID，从而允许我们保存和跟踪每个帖子的评论和分页函数。\n\n```\nonListComments(e: ListCommentsEvent):\
  \ void {}\n```\n\n在方法体内部，调用 commentsService 的 getCommentsByPostId() 方法：\n\n```\n\
  const qRef = this.commentsService\n.getCommentsByPostId(e.postId);\n```\n\n定义 fetchMore()\
  \ 函数，它只是包装返回的 QueryRef 对象的 fetchMore() 方法：\n\n```\nconst fetchMore = () => {\n \
  \ qRef.fetchMore({\n    variables: {\n      offset: this.comments\n        .get(e.postId)?.result.length\n\
  \    }\n  })\n}\n```\n\n订阅 QueryRef 对象的 valueChanges Observable：\n\n```\nqRef\n\
  .valueChanges\n.pipe(takeUntil(this.componentDestroyed))\n.subscribe();\n```\n\n\
  将以下观察者对象传递给 subscribe() 方法：\n\n```\n{\n  next: (result) => {\n    this.comments\n\
  \      .set(\n        e.postId,\n        {\n          result: result\n         \
  \   .data\n            .getCommentsByPostId as Comment[],\n          fetchMore:\
  \ fetchMore\n        });\n  }\n}\n```\n\n此方法用于通过 ID 获取帖子的评论。它将自定义事件对象作为参数，调用 `CommentsService`\
  \ 的 `getCommentsByPostId()` 方法，并在使用 `componentDestroyed` 主题应用 `takeUntil()` 操作符后订阅\
  \ `valueChanges` Observable，以便在组件销毁时取消订阅。\n\n在 `next()` 处理程序中，我们只需将获取到的评论与 `fetchMore()`\
  \ 函数一起放入 `comments` 映射中，以评论所属的帖子 ID 作为键。这将使我们能够在下次重新调用该方法以获取另一个帖子的评论时保存此信息。\n\n\
  - 4. 向基类添加用于获取更多评论的 `onLoadMoreComments()` 方法：\n\n```\nonLoadMoreComments(e: MoreCommentsEvent):\
  \ void {\n  const fetchMore = this.comments\n    .get(e.postId)?.fetchMore!;\n \
  \ fetchMore();\n}\n```\n\n添加用于按 ID 删除评论的 `onRemoveComment()` 方法：\n\n```\nonRemoveComment(e:\
  \ RemoveCommentEvent) {\n  this.commentsService\n    .removeComment(e.id)\n    .pipe(take(1))\n\
  \    .subscribe({\n      error: (err) => this.handleErrors(err)\n    });\n}\n```\n\
  \n- 5. 打开 `src/app/cache.ts` 文件并使用 `offsetLimitPagination` 辅助函数为 `getCommentsByPostId`\
