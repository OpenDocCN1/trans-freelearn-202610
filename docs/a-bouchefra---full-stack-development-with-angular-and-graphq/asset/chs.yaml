  \n图 11.3 – 添加点赞后状态得以保留的帖子\n\n如果添加的评论超过五条，将显示“加载更多评论”按钮：\n\n![](img/c798729e4c42765fcb1c98950164d0ba_351_0.png)\n\
  \n图 11.4 – 带有“加载更多评论”按钮的帖子\n\n然后，如果您点击评论按钮或显示评论数量的按钮，<textarea> 和“加载更多评论”按钮将被隐藏，而最新评论将显示出来。\n\
