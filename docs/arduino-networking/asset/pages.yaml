- pgno: 46
  md: '# # Testing your connection


    Now that the hardware is ready, we can write our first sketch to test the Ethernet
    shield and the connection to the Web. Note that the pieces of code shown in this
    section are only the most important parts of the code, and you can find the complete
    code inside the GitHub repository of the book.


    Start the Arduino sketch by including the following required libraries to use
    the shield:


    ```

    #include <SPI.h>

    #include <Ethernet.h>

    ```


    # ## Tip


    # ## Downloading the example code


    You can download the example code files for all Packt books you have purchased
