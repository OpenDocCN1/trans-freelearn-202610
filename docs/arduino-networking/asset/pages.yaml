- pgno: 64
  md: '# # Log incoming data in a database


    In this section, we are going to use PHP to build the server-side part of the
    project. If you are a complete novice in PHP, I recommend the following resource
    to learn the basics of the language:


    [http://php.net/manual/en/tutorial.php](http://php.net/manual/en/tutorial.php)


    First, we are going to see the content of the datalogger.php file. This file will
    handle the requests coming from the Arduino board, log the data in a database,
    and answer with a simple message. Note that this file has to be in a folder named
    datalogger on your web server. We will see the important parts of the code. To
    get the complete code for this section, please refer to the GitHub repository
    of the chapter. Note that all the PHP code should be between the <?php ... ?>
    tags.


    The file starts by receiving the data from the GET request sent by the Arduino
    Ethernet shield:


    ```

    $temperature = intval($_GET["temp"]);

    $humidity = intval($_GET["hum"]);

    ```


    We also instantiate the connection with the SQLite database:


    ```

    $db = new SQLite3(''database.db'');

    ```


    Then, we need to give some structure to the database if the database file is brand
    new. If you are not familiar with the SQL commands, I invite you to visit the
    following link:


    [http://www.cs.utexas.edu/~mitra/csFall2013/cs329/lectures/sql.html](http://www.cs.utexas.edu/~mitra/csFall2013/cs329/lectures/sql.html)


    We are going to create four different columns inside the database: a unique ID
    that will be automatically incremented by SQLite, a timestamp to know when the
    measurement was made, and the temperature and humidity data. This is done using
    the following piece of code:


    ```

    $db->exec(''CREATE TABLE IF NOT EXISTS measurements (id INTEGER PRIMARY KEY,

    timestamp TIMESTAMP DEFAULT CURRENT_TIMESTAMP NOT NULL, temperature

    INTEGER, humidity INTEGER);'');

    ```


    Note that if you are using more sensors (for example, if you are also measuring
    the ambient light level), you can add more fields here. Simply add a new field
    to the list, for example: pressure INTEGER.


    Now, we can actually insert the data as a new row in the database. Since SQLite
    automatically adds the ID and timestamp fields, we just need to insert the data
    concerning the temperature and humidity:


    ```

    $db->exec("INSERT INTO measurements (temperature, humidity) VALUES

    (''$temperature'', ''$humidity'')");

    ```


    If you need to insert more data into the database, for example, if you have another
    measurement to log, you can simply extend this command to insert more data into
    the SQLite database.'
  merge: -1
  img_proc: true
- pgno: 65
  md: '# Tip


    This simple code illustrates how easy it is to insert data into the SQLite database.
    However, it leaves our server exposed to a security issue known as the SQL injection.
    Since our project is made for your own local network only, this is not really
    an issue here. However, if you plan to deploy the project online, I recommend
    modifying the code to solve this security problem. The following link will give
    you more information about this issue [http://www.tutorialspoint.com/sqlite/sqlite_injection.htm](http://www.tutorialspoint.com/sqlite/sqlite_injection.htm).


    Finally, we reply to the Arduino board with a simple message:


    ```

    echo "Data received";

    ```


    Now, we haven''t actually talked about the database itself yet. There is a database.db
    file included as an example in the code for this chapter, but I recommend you
    simply delete it and try to make your own database. You can simply go to the directory
    in a terminal where all files of the project are located and type:


    ```

    sqlite3 database.db

    ```


    # Tip


    If you are using Windows, I recommend using Console as a terminal. You can get
    it at the following link [http://sourceforge.net/projects/console/](http://sourceforge.net/projects/console/).


    This command will create your database file. You can now again exit the database
    file by typing the following command:


    ```

    .exit

    ```


    Note that if you are under Linux, you might have to change the permissions on
    the database and the folder that contains the project. To do so, go the project''s
    folder via a terminal and type:


