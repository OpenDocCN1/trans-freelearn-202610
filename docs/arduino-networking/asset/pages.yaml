    You can also use the integrated plotting functionalities of Google Docs to display
    the measurements on a graph. You can simply select the columns corresponding to
    the data (A, B, and C in the example developed in this chapter), and click on
    the **Insert Chart** button inside the toolbar. You will be prompted to choose
    the type of graph you want to plot. I simply chose a line chart to plot all the
    data on a single graph. The graph will look similar to the following screenshot:


    ![](img/b454031c864977fe997c5feb0b3f9b63_156_0.png)


    As everything is dynamic, you should see that the graph is updated in real time
    as new measurements come in. Note that as this is a spreadsheet on Google Docs,
    it is accessible'
  merge: -1
  img_proc: true
