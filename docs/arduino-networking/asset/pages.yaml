- pgno: 53
  md: '# Chapter 2. Sending Data to a Web Server


    In the previous chapter, we made sure that your Arduino Ethernet shield could
    actually connect to your local network and to the Web. In this chapter, we are
    going to build on that, and build our first application using the Ethernet shield.


    We are going to see in more detail how the Ethernet client works by measuring
    data from a digital sensor and sending this data to a web server. In this chapter,
    this web server will be a server running on your own computer.


    These will be the major takeaways from this chapter:


    +   - First, we are going to choose the temperature and humidity sensor that we
    will also use later in the book. We are also going to install the different software
    components that are required for this chapter, especially the library to plot
    data on your computer.

    +   - Then, we are going to build the Arduino code that will perform measurements
    and send these measurements to the web server running on your computer.

    +   - After that, we’ll start building the server-side code. In the first part,
    we are going to build the code responsible for simply logging the received data
    into a local database.

    +   - Finally, we will interface the database with a live plotting library so
    the measurements can be seen as they come from the Ethernet shield and are logged
    in the database.'
  merge: -1
  img_proc: true
- pgno: 54
  md: '# Hardware and software requirements


    On the hardware side, you will of course need the Arduino Uno board and Arduino
    Ethernet shield.


    You will also need a sensor to measure some data. As this book is about how to
    use the Ethernet shield and not how to measure data from sensors, you can actually
    take any sensor of your choice.


    I used a DHT11 sensor, which is a digital temperature and humidity sensor. I chose
    this sensor for this chapter and for many chapters of the book since it is a very
    cheap sensor and easy to interface with Arduino. Along with the DHT11 sensor,
    you will also need a 4.7k Ohm resistor.


    You can also use other kind of sensors. You can use analog sensors, which return
    a signal depending on the measured data. For example, the TMP36 sensor is an analog
    temperature sensor that returns a voltage proportional to the ambient temperature.


    Other kind of sensors you can use here are sensors based on the SPI or I2C protocols,
    which are digital communication protocols that are easy to use with Arduino. For
    example, you can use the BMP085 or BMP180 sensors, which have an I2C interface,
    and you can also measure the barometric pressure and ambient humidity.


    You will also need a breadboard and some jumper wires to make the connections
    between the sensor and the Ethernet shield.


    This is a list of all the components that were used for this chapter:


    +   - Arduino Uno (https://www.adafruit.com/products/50)

    +   - Arduino Ethernet Shield (https://www.adafruit.com/products/201)

    +   - DHT11 sensor (https://www.adafruit.com/products/386)

    +   - Breadboard (https://www.adafruit.com/product/64)

    +   - Jumper wires (https://www.adafruit.com/product/758)


    On the software side, the first thing you will need is the library to interface
    with the sensor you chose before. As I chose a DHT11 sensor for this project,
    you will need to download and install the DHT library:


    https://github.com/adafruit/DHT-sensor-library


    To install an Arduino library, simply unzip the content of the downloaded file
    into the /libraries folder of your main Arduino folder (or create this folder
    if it doesn''t exist already).


    You will also need a library to plot the data stored in the database. I used the
    flot library, which is very convenient to use and allows real-time visualization
    of incoming data. This library is included in the code of this chapter, but if
    you want more information on the library you can go to http://www.flotcharts.org/.


    About the database itself, this project uses SQLite, which is a lite and easy-to-use
    database. It is perfect for such projects, as it doesn''t require a database server
    running on'
  merge: -1
  img_proc: true
- pgno: 55
  md: 'your computer.


    It comes preinstalled on many operating systems such as OS X or Linux, but if
    that’s not the case, go over to their website to download and install it:

    http://www.sqlite.org/


    If you are using Linux, the best option is to install SQLite with your Linux distribution
    package manager.


    Note that it is also possible to use relational databases other than SQlite, such
    as MySQL. Many web servers come with the MySQL server as well, and you will only
    need to make small changes in the code of this chapter to use a MySQL database.
    You can also use nonrelational databases such as MongoDB (http://www.mongodb.org/),
    but this will require more changes in the code.


    Finally, you will also need to have a web server up and running to make this project
    work. You can find more information about how to set up a web server in the preface
    of this book. If you don’t have a web server installed yet, you can visit the
    following links to get one:


    +   - Windows: EasyPHP (http://www.easyphp.org/) or WAMP (http://www.wampserver.com/en/)

    +   - OS X: MAMP (http://www.mamp.info/)

    +   - Linux: LAMP (https://help.ubuntu.com/community/ApacheMySQLPHP)'
  merge: -1
