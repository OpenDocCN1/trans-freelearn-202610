- pgno: 87
  md: "# # Creating a web server on Arduino\n\nFor the rest of this chapter, we are\
    \ going to take another approach. We are still going to make the Arduino with\
    \ the Ethernet Shield work as an independent system, but this time we are even\
    \ going to create a web server on the Arduino board. This is actually similar\
    \ to the project we saw in the Chapter 2, Sending Data to a Web Server, but this\
    \ time it is the Arduino board itself that will display the data as it is measured.\n\
    \nThe sketch for this part starts by including the right libraries, as shown in\
    \ the following code:\n\n```\n```cpp\n#include \"DHT.h\"\n#include <Ethernet.h>\n\
    #include <SPI.h>\n```\n```\n\nDefine the pin and the type of the sensor in the\
