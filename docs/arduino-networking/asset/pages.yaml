- pgno: 124
  md: '# Creating your Xively account


    The first thing we have to do to use the Xively service is create and configure
    a Xively account. You need to create an account on Xively so that we can send
    data to their service. Xively is basically an online platform for connected objects
    such as our Ethernet shield. The service will automatically store the data that
    we send. It will also display the measured data in the form of graphs that are
    updated in real time as the data comes in.


    The very first step is to go over to the Xively signup page on their website at
    https://xively.com/signup/. You will arrive at a page where you can enter your
    personal details:


    ![](img/b454031c864977fe997c5feb0b3f9b63_124_0.png)


    Then, you will need to create a device, which is a virtual entity on the Xively
    website. This device will receive the measured data. When you create a new device,
    you will need to enter a name for your device:'
  merge: -1
  img_proc: true
- pgno: 125
  md: '# # Add Device


    The Xively Developer Workbench will help you to get your devices, applications
    and services talking to each other through Xively. The first step is to create
    a development device. Begin by providing some basic information:


    **Device Name**

    Weather station


    **Device Description** optional

    Tell us more about this device


    **Privacy** You own your data, we help you share it. more info


    ○ Private Device

    You use API keys to choose if and how you share a device''s data.


    ○ Public Device

    You agree to share a device''s data under the CC0 1.0 Universal license. The Device''s
    data is indexed by major search engines, and its Feed page is publicly viewable.


    ✓ Add Device   Cancel


    Then, you can add channels to your device. A channel on Xively is like a variable
    or a row in a database; it is the entity that will receive a specific measurement
    from the Arduino board. You can create a new channel on the page of your device
    by clicking on the button shown in the following screenshot:'
