- pgno: 153
  md: "# Logging data in a spreadsheet\n\nAfter finishing the configuration of our\
    \ device on the Temboo website, we downloaded a bunch of files from Temboo. However,\
    \ the Arduino file that was downloaded is for a generic sensor. In this section,\
    \ we are going to adapt this file for our own needs and see the details of how\
    \ the code works.\n\n# Note\n\nYou will need to insert your own TembooAccount.h\
    \ file in the same folder as the Arduino file so that the code can work.\n\nThe\
    \ main Arduino sketch for this section starts by including all the libraries that\
    \ are required for the project to work with Temboo. Note that we will also insert\
    \ the DHT library. Add the following libraries in the code:\n\n```\n#include <SPI.h>\n\
    #include <Dhcp.h>\n#include <Dns.h>\n#include <Ethernet.h>\n#include <EthernetClient.h>\n\
    #include <Temboo.h>\n#include \"TembooAccount.h\"\n#include \"DHT.h\"\n```\n\n\
    We also define the pin on which the DHT sensor is connected and the type of the\
    \ sensor:\n\n```\n#define DHTPIN 7\n#define DHTTYPE DHT11\n```\n\nThen, we will\
    \ create an instance of the sensor:\n\n```\nDHTdht(DHTPIN, DHTTYPE);\n```\n\n\
    We also assign the MAC address of the Ethernet shield. Note that here it is not\
    \ explicitly assigned, but the information is directly taken from your Temboo\
    \ account file. The MAC address is assigned with the following line:\n\n```\n\
    byte ethernetMACAddress[] = ETHERNET_SHIELD_MAC;\n```\n\nWe will also create an\
    \ instance of an Ethernet client as follows:\n\n```\nEthernetClient client;\n\
    ```\n\nNow, in the setup() function of the sketch, we will get an IP address for\
    \ the Ethernet shield via DHCP, as shown in the following code:\n\n```\nSerial.print(\"\
    DHCP:\");\nif (Ethernet.begin(ethernetMACAddress) == 0) {\n Serial.println(\"\
    FAIL\");\n while(true);\n}\nSerial.println(\"OK\");\ndelay(5000);\n```"
  merge: -1
  img_proc: true
- pgno: 154
  md: 'Start the DHT sensor with the following line:


    ```

    dht.begin();

    ```


    Then, in the loop() function, we will measure the temperature and humidity from
    the DHT sensor and convert the measurements to strings with the following piece
    of code:


    ```

    float h = dht.readHumidity();

    float t = dht.readTemperature();

    ```


    ```

    int temperature = (int)t;

    int humidity = (int)h;

    ```


    ```

    Serial.println("Temperature: " + String(temperature));

    Serial.println("Humidity: " + String(humidity));

    ```


    After the measurements are done, we will call the following function that will
    actually connect to the web and log the data to our Google Docs spreadsheet. We
    are going to see the details of this function that was autogenerated by Temboo
    in a moment:


    ```

    runAppendRow(temperature, humidity);

    ```


    Finally, we will also insert some delay between each measurement. I recommend
    using a large delay (I chose to log data every minute for demonstration purposes)
    because the number of calls you can make to Temboo is limited. The delay is inserted
    with the following line:


    ```

    delay(60000);

    ```


    You can see the different plans and pricing at the following link:


    https://www.temboo.com/about/plans


    For example, on the free plan, you are limited to 1,000 calls per month, which
    means that you can log measurements approximately every 44 minutes. On the first
    paid plan, you can log one data point approximately every 5 minutes. Keep these
    limitations in mind while developing your applications.


    Let''s now see the details of the runAppendRow() function. It starts by declaring
    the type of Choreo we want to use. A Choreo is the equivalent of a library on
    the Temboo service. For example, we will declare that we want to use the specific
    library to insert data in a row in the Google Docs spreadsheet:


    ```

    TembooChoreoAppendRowChoreo(client);

    ```


    We will set the different information about your account, such as the name of
    the account and your app key. All these are already defined in your Temboo account
    file that you downloaded before, so you don''t need to define anything more:


    ```

    AppendRowChoreo.setAccountName(TEMBOO_ACCOUNT);

    AppendRowChoreo.setAppKeyName(TEMBOO_APP_KEY_NAME);

    AppendRowChoreo.setAppKey(TEMBOO_APP_KEY);

    ```


    Then, you need to somehow specify where the data should be logged. Once more,
    all the work is done by Temboo: all the information is saved on the Temboo side
    in the Google'
  merge: -1
  img_proc: true
- pgno: 155
  md: "Account credentials you have set before. If you used the same name as I did\
    \ for this example, you don't have to modify anything in the following line:\n\
    \n```\nAppendRowChoreo.setSavedInputs(\"arduinoTemperatureSpreadsheet\");\n```\n\
    \nNote that the new way to overcome the Temboo call limitation is also to transmit\
    \ several data points at each call of the Temboo API, for example, by appending\
    \ several rows at each call. You can modify the code accordingly as an exercise.\n\
    \nNow, we need to format the data so it can be recorded correctly in Google Docs.\
    \ What you want to insert in a given row is a timestamp, the temperature, and\
    \ the humidity. For the timestamp, we are simply going to use the time that has\
    \ passed since the device was powered on with the millis() function.\n\nThe data\
    \ itself will be contained inside a string variable, where the value of each column\
    \ will be separated with a comma, as shown in the following code:\n\n```\nString\
    \ RowDataValue = String(millis()) + \",\" + String(temperature) + \",\" + String(humidity);\n\
    AppendRowChoreo.addInput(\"RowData\", RowDataValue);\n```\n\nWe also need to set\
    \ which Choreo we want to use with the following line:\n\n```\nAppendRowChoreo.setChoreo(\"\
    /Library/Google/Spreadsheets/AppendRow\");\n```\n\nThen, we can finally execute\
    \ Choreo and store the result in a variable called returnCode using the following\
    \ line:\n\n```\nunsigned int returnCode = AppendRowChoreo.run();\n```\n\nIf this\
    \ code is equal to 0 after Choreo has been executed, it means that everything\
    \ went fine, and we will print the corresponding message on the Serial Monitor\
    \ for debugging purposes using the following piece of code:\n\n```\nif (returnCode\
    \ == 0) {\n    Serial.println(\"Done!\\\\n\");\n} else {\n    // A non-zero return\
    \ code means there was an error\n    // Read and print the error message\n   \
    \ while (AppendRowChoreo.available()) {\n        char c = AppendRowChoreo.read();\n\
    \        Serial.print(c);\n    }\n    Serial.println();\n}\n```\n\nIf that's not\
    \ the case, we will print the corresponding error message on the Serial Monitor.\
    \ Finally, we close Choreo with the following line:\n\n```\nAppendRowChoreo.close();\n\
    ```\n\n# Note\n\nYou can find all the code for this section on the GitHub repository\
    \ of this chapter at https://github.com/openhomeautomation/arduino-networking/tree/master/chapter6."
  merge: -1
  img_proc: true
