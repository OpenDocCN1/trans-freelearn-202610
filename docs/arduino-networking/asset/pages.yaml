- pgno: 92
  md: "# # Plotting the data locally\n\nTo end the chapter, we are going to see how\
    \ to plot data measured by the Arduino board. To do so, we will modify the Arduino\
    \ sketch a little bit, and then use part of the code from the previous chapter\
    \ to plot the data right in your web browser.\n\nFirst, we are going to modify\
    \ the Arduino sketch so that it returns data in a more useful format; in the present\
    \ case, the JSON format. In place of the code responsible to print out the measurements,\
    \ we are going to simply print the data in the JSON format. This is done using\
    \ the following piece of code:\n\n```\nclient.println(\"HTTP/1.1 200 OK\");\n\
    client.println(\"Content-Type: application/json\");\nclient.println(\"Connection:\
    \ close\");\nclient.println();\nclient.print(\"{\\\"temperature\\\": \");\nclient.print(temp);\n\
    client.print(\", \\\"humidity\\\": \");\nclient.print(hum);\nclient.println(\"\
    }\");\n```\n\nWe can now quickly test this project. Upload the code to the Arduino\
    \ board again, open your web browser, and go to the same IP address you used before.\
    \ You should see the following line printed on the page:\n\n```\n{\"temperature\"\
    : 24, \"humidity\": 36}\n```\n\nNow, we also have to build the server-side code\
    \ to plot the data. The code is very similar to the code of the previous chapter,\
    \ so I will only detail the differences between the two projects. In the previous\
    \ chapter, it was the board that was trying to reach out the server running on\
    \ your computer, and the datalogger.php file was handling the requests. In this\
    \ chapter, we are going to do the reverse and call the board from the web server\
    \ running on your computer. To do so, we are going to use a module from PHP called\
    \ cURL to make GET requests to a given URL; in this case, the URL of the Arduino\
    \ board.\n\nThe first thing we have to do is make changes to the datalogger.php\
    \ file and add the URL of the Arduino board, as shown in the following line of\
    \ code:\n\n```\n$url = 'http://192.168.1.103';\n```\n\nStart the cURL call, as\
    \ shown in the following line of code:\n\n```\n$curl = curl_init();\n```\n\nWe\
    \ also have to set the options of the cURL call. We want the call to return the\
    \ data from our Arduino web server, and we also want the URL to be the one we\
    \ defined before. This is done using the following code:\n\n```\ncurl_setopt_array($curl,\
    \ array(\n    CURLOPT_RETURNTRANSFER => 1,\n    CURLOPT_URL => $url,\n));\n```"
  merge: -1
  img_proc: true
- pgno: 93
  md: "We can now execute the command, as shown in the following line of code::\n\n\
    ```\n$resp = curl_exec($curl);\n```\n\nClose the cURL call, as follows:\n\n```\n\
    curl_close($curl);\n```\n\nWe get the answer in a variable that contains the data\
    \ in a string. In order to open it with PHP, we need to convert it to the JSON\
    \ format first, and then extract the temperature and humidity fields. This is\
    \ done using the following piece of code:\n\n```\n$json = json_decode($resp, true);\n\
