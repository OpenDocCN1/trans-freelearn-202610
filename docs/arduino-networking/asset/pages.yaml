    \ key[] = { 0x64, 0x26, 0xFF, 0xC9,\n                      0x20, 0x4D, 0xF1, 0xCF,\n\
    \                      0xAE, 0x42, 0xD4, 0x1A,\n                      0xED, 0x6C,\
    \ 0xB0, 0xB7 };\n\n```\n\nYou also need to define the following variables so that\
