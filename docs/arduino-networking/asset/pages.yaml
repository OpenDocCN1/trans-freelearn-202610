- pgno: 129
  md: '# Sending data to Xively


    We are now going to build the Arduino sketch for this project. The goal is to
    measure data on the Arduino board, connect with the Xively server, and send the
    data.


    The first step is to include the following required libraries:


    ```

    #include <SPI.h>

    #include <Ethernet.h>

    #include "DHT.h"

    ```


    Enter the MAC address of your board:


    ```

    byte mac[] = { 0x90, 0xA2, 0xDA, 0x0E, 0xFE, 0x40 };

    ```


    We can then define the pin and the type of the DHT sensor as follows:


    ```

    #define DHTPIN 7

    #define DHTTYPE DHT11

    ```


    Create an instance on the sensor, as shown in the following line:


    ```

    DHT dht(DHTPIN, DHTTYPE);

    ```


    Create an instance of the Ethernet client:


    ```

    EthernetClient client;

    ```


    We also define a default IP address for the board:


    ```

    IPAddress ip(192,168,1,50);

    ```


    In the sketch, we also set the address of the secured Xively server that we will
    connect to using the Ethernet shield:


    ```

    IPAddress server(216,52,233,120);

    ```


    Now, we have to modify the sketch a little bit to enter your own information about
    your Xively account. This is where you have to enter your API key and feed ID
    that you got in the previous section. Using the following code, you can define
    your API key and feed ID:


    ```

    #define WEBSITE "api.xively.com"

    #define API_key "yourAPIKey"

    #define feedID "yourFeedID"

    ```


    In the setup() function of the sketch, we can now use DHCP to get an IP address
    for the sketch, as shown in the following code:


    ```

    // Start the Ethernet connection

    if (Ethernet.begin(mac) == 0) {

    Serial.println("Failed to configure Ethernet using DHCP");

    Ethernet.begin(mac, ip);

    }

    ```


    For debug purposes, we print this IP address on the Serial Monitor:


    ```

    Serial.print("IP address: ");

    ```'
  merge: -1
  img_proc: true
- pgno: 130
  md: "```\nSerial.println(Ethernet.localIP());\n```\n\nNow, in the loop() function\
    \ of the sketch, we will make the measurements with the DHT sensor, format the\
    \ data for Xively, and send this data to the Xively server.\n\nThe first step\
    \ is to make the measurements. This is done with the following lines of code:\n\
    \n```\nfloat humidity = dht.readHumidity();\nfloat temperature = dht.readTemperature();\n\
    ```\n\nWe then need to format this measured data so the Xively server can understand\
    \ it. Indeed, Xively defines a specific format to receive data. All the formats\
    \ are defined at https://xively.com/dev/docs/api/communicating/data_formats/.\n\
    \nIn our case, we will need to put the data in a JSON string according to the\
    \ Xively specifications. This is done using the following piece of code:\n\n```\n\
    int length = 0;\nString data = \"\";\ndata = data + \"\\\\n\" + \"{\\\\\"version\\\
    \\\":\\\\\"1.0.0\\\\\",\\\\\"datastreams\\\\\" : [ {\\\\\"id\\\\\" : \\\\\"Temperature\\\
    \\\",\\\\\"current_value\\\\\" : \\\\\"\" + String((int)temperature) + \"\\\\\"\
    },\" + \"{\\\\\"id\\\\\" : \\\\\"Humidity\\\\\",\\\\\"current_value\\\\\" : \\\
    \\\"\" + String((int)humidity) + \"\\\\\"}]}\";\nSerial.println(data);\nlength\
    \ = data.length();\n```\n\nYou will note that we also get the length of the string\
    \ that we will also need in order to send the data to the Xively server. Also,\
    \ we are using backslashes before quotations marks to indicate that we want to\
    \ transmit quotation marks and not the end of the string.\n\nThen, we will actually\
    \ connect to the Xively server and send the data. This is done by using a PUT\
    \ request and sending a JSON file to the Xively server. In the header of the request,\
    \ we define the feed ID of the Xively device and we also transmit your Xively\
    \ API key.\n\nWe also need to send the data we defined before in the body of the\
    \ request. This is done using the following piece of code:\n\n```\nif (client.connect(server,\
