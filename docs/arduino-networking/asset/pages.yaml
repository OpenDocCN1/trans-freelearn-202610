  img_proc: true
- pgno: 119
  md: '# Chapter 5. Internet of Things with Xively


    In the previous chapters of the book, we mainly kept things local when performing
    measurements on the Arduino board with the Ethernet shield. For example, we sent
    some measured data back to a database on your computer and displayed the measurements
    there.


    In this chapter, we are going to take a different approach. We are going to integrate
    the Ethernet shield into an Internet of Things perspective. This means that instead
    of logging measurements locally within your local network, we are going to automatically
    send the measured data to a cloud service called Xively. The purpose of the Xively
    website is to store data that comes from your devices and display this data on
    their website. This way, your data will be available at any time and can be accessed
    from anywhere.


    The following will be the major takeaways from this chapter:


    +   - First, we are going to build the hardware for this project around the Ethernet
    shield and the DHT11 temperature and humidity sensor.

    +   - Then, we will create an account on the Xively website. We will also configure
    this account so that we can send the measured data to it using the Arduino Ethernet
    shield.

    +   - When the account is correctly set, we will use the account information such
    as the Xively API key to build the Arduino sketch for this project.

    +   - Finally, we will upload the sketch to the Arduino board and test it. We
    will check that the data is correctly sent to the Arduino board and visualize
    the recorded data in real time in your browser.'
  merge: -1
  img_proc: true
- pgno: 120
  md: '# # Hardware and software requirements


    On the hardware side, you will of course need the Arduino Ethernet shield and
    an Arduino board such as the Arduino Uno.


    You will also need a sensor to measure some data. As this book is about how to
    use the Ethernet shield and not how to measure from sensors, you can actually
    use a sensor of your choice.


    I picked a DHT11 sensor, which is a digital temperature and humidity sensor. I
    chose this sensor as it is a very cheap sensor and easy to interface with Arduino.
    Along with the DHT11 sensor, you will also need a 4.7k ohm resistor.


    You will also need a breadboard and some jumper wires to make the connections
    between the sensor and the Ethernet shield.


    On the software side, the first thing you will need is the library to interface
    with the sensor you chose before. As I chose a DHT11 sensor for this project,
    you will need to download and install the DHT library from https://github.com/adafruit/DHT-sensor-library.


    To install an Arduino library, simply unzip the contents of the downloaded file
    into your libraries folder of your main Arduino folder (or create this folder
    if it doesn''t exist already).'
  merge: -1
  img_proc: true
- pgno: 121
  md: '# # Hardware configuration


    It’s now time to set up the hardware for this project. At this point, if you followed
    one of the previous chapters, you should already have your Arduino Ethernet shield
    plugged into the Arduino board, one Ethernet cable connecting the Ethernet shield,
    and your Internet router. If that’s not the case already, please do so.


    The only thing you will have to connect in this project is the DHT11 sensor and
    the resistor. You can have an overview of the different connections you have to
    make by looking at the following schematic diagram:


    ![](img/b454031c864977fe997c5feb0b3f9b63_121_0.png)


    First, plug the DHT11 sensor to the breadboard. Then, connect pin numbers 1 and
    2 of the sensor using the 4.7k ohm resistor.


    Now comes the power supply. Connect the pin number 1 of the sensor to the Arduino
    5 V and the pin number 4 to the Arduino GND. Finally, connect the pin number 2
    of the DHT sensor to the Arduino pin number 7.


    At the end, it should look like the following image:'
