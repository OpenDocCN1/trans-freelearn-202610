- pgno: 159
  md: '# # Sending automated e-mails


    In this last part of the chapter, we are going to build on what we already did,
    but change the application slightly. This time, we are going to use the Ethernet
    shield and Temboo to automatically send e-mails when a condition is reached. As
    an example, we will set a condition on the measured temperature. Whenever the
    temperature reaches a given value, we will send an e-mail to the address of your
    choice, for example, your professional e-mail to keep you updated when you are
    at work.


    It starts by going again to the Device Coder on the Temboo website at https://www.temboo.com/library/Library/Devices/Arduino/Others/.


    Click on **Generic sensor** and then on **Email**. This time you won’t have to
    enter that much information. Your Gmail account should already be set from the
    previous section and the Device Coder should automatically select your Ethernet
    shield.


    You simply need to enter the destination e-mail (for example, your professional
    e-mail address or the e-mail address from a family member) and the **Subject**
    field of the e-mail. Do not worry now about the value of the body of the e-mail;
    we will change it later:


    ![](img/b454031c864977fe997c5feb0b3f9b63_159_0.png)


    When it is finished, click on **Generate**. As for the previous section, you will
    be prompted to enter a name for this project so that Temboo knows where to send
    e-mails. I named mine arduinoTemperatureEmail, but if you decide to use another
    name, you will simply have to change one line in the code later.


    You can now download the generated code, which we will modify a bit. As for the
    previous section, we are going to modify the Arduino code, but it is important
    that you get your own TembooAccount.h file that contains the information relative
    to your own account on Temboo.


    The Arduino sketch is similar to the one in the previous section, so I will only
    discuss the main changes.


    In the loop() function of the sketch, you need to set the limit at which the e-mail
    will be sent by Temboo. For demonstration purposes, I will set the limit to 23,
    as shown in the following code:'
  merge: -1
  img_proc: true
- pgno: 160
  md: "```\nif (temperature > 23) {\n    Serial.println(\"\\nTriggered! Calling /Library/Google/Gmail/SendEmail...\"\
    );\n\n    // Send email\n    runSendEmail(temperature);\n}\n```\n\nYou can see\
    \ that every time the temperature goes above that limit, an alert will be sent\
    \ by Temboo via e-mail. We will see the details of this function in a moment.\
    \ I also inserted a 1-minute delay between each measurement, so we don’t continuously\
    \ send e-mails if the threshold is crossed:\n\n```\ndelay(60000);\n```\n\nNow\
    \ let’s look at the details of the runSendEmail() function. This function is responsible\
    \ for creating the correct Choreo to send an e-mail, set the body of the e-mail,\
    \ and send it via Temboo.\n\nIt starts by creating the correct Choreo to send\
    \ an e-mail with the following line:\n\n```\nTembooChoreoSendEmailChoreo(client);\n\
    ```\n\nWe also define the different information relative to your account that\
    \ is defined in the Temboo account file you just downloaded from Temboo:\n\n```\n\
    SendEmailChoreo.setAccountName(TEMBOO_ACCOUNT);\nSendEmailChoreo.setAppKeyName(TEMBOO_APP_KEY_NAME);\n\
    SendEmailChoreo.setAppKey(TEMBOO_APP_KEY);\n```\n\nThen, this is where you need\
    \ to enter the name of the e-mail project that you just created on Temboo. If\
    \ you use the same name as I did, there is no need to modify anything in the following\
    \ line:\n\n```\nSendEmailChoreo.setSavedInputs(\"arduinoTemperatureEmail\");\n\
    ```\n\nWe will now build the body of the e-mail, which will be stored in a string\
    \ variable. We simply use a generic message where we attach the value of the measured\
    \ temperature and store everything in a string. Finally, we will add the following\
    \ lines as an input to the Choreo used to send e-mails:\n\n```\nString MessageBodyValue\
    \ = String(\"Alert! The current sensor value is: \") +\nString(sensorValue);\n\
    SendEmailChoreo.addInput(\"MessageBody\", MessageBodyValue);\n```\n\nJust before\
    \ executing Choreo, we define that we want to use SendEmailChoreo from Gmail using\
    \ the following line:\n\n```\nSendEmailChoreo.setChoreo(\"/Library/Google/Gmail/SendEmail\"\
    );\n```\n\nWe can finally execute Choreo and store the result in a variable:\n\
    \n```\nunsigned intreturnCode = SendEmailChoreo.run();\n```\n\nAs in the previous\
    \ section, if the result is 0, it means everything went fine. If this is not the\
    \ case, we will print the error message on the Serial port for debugging using\
    \ the following"
  merge: -1
  img_proc: true
- pgno: 161
  md: "piece of code:\n\n```\nif (returnCode == 0) {\n  Serial.println(\"Done!\\n\"\
    );\n} else {\n  // A non-zero return code means there was an error\n  // Read\
    \ and print the error message\n  while (SendEmailChoreo.available()) {\n    char\
    \ c = SendEmailChoreo.read();\n    Serial.print(c);\n  }\n  Serial.println();\n\
    }\n```\n\nFinally, we will close Choreo with the following line:\n\n```\nSendEmailChoreo.close();\n\
    ```\n\n# Note\n\nYou can find all the code for this section on the GitHub repository\
    \ of this chapter at [https://github.com/openhomeautomation/arduino-networking/tree/MASTER/chapter6.](https://github.com/openhomeautomation/arduino-networking/tree/MASTER/chapter6.)\n\
    \nYou can now test the sketch. The first thing to do is to make sure that you\
    \ have your own Temboo account file in the same folder as the Arduino sketch.\
    \ Then, upload the sketch to the Arduino board and open the Serial Monitor. The\
    \ first thing you should see is the confirmation message that everything went\
    \ ok:\n\n```\n**DHCP: OK**\n**Setup complete**\n```\n\nThen, you should see the\
    \ first measurements on the Serial Monitor:\n\n```\n**Temperature: 21**\n**Humidity:\
    \ 39**\n```\n\nDepending on the temperature value, you might need to pinch your\
    \ sensor to trigger the e-mail alert. Remember, in the example of this chapter,\
    \ we set a value of 23 degrees for the temperature. After a while, if the temperature\
    \ reaches the threshold, you should see the following message:\n\n```\n**Triggered!\
    \ Calling /Library/Google/Gmail/SendEmail...**\n```\n\nAfter a while, the following\
    \ confirmation message should appear:\n\n```\n**Done!**\n```\n\nYou can now close\
    \ the Serial Monitor and go check the e-mail account that you set on Temboo. You\
    \ should have received a message with the title you set on Temboo, and you will\
    \ also receive the body that indicates the generic message you set in the sketch\
    \ along with the measured temperature."
  merge: -1
  img_proc: true
