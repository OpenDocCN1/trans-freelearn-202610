- pgno: 27
  md: '# What you need for this book


    You will need several hardware and software components to make all the projects
    found in this book. Of course, you can just read the description of the projects
    and learn this way. However, I really recommend actually doing the projects yourself
    to really learn about how to use the Arduino Ethernet shield to build exciting
    networking applications.


    The hardware components required are detailed at the beginning of each chapter.
    However, what you will really need for all the projects is an Arduino board.


    All the projects of the book are based on the Arduino Uno board:


    http://arduino.cc/en/Main/arduinoBoardUno


    For all the projects of this book, you will also need the Arduino Ethernet shield:


    http://arduino.cc/en/Main/ArduinoBoardEthernet


    On the software side, there is some software that we will use in all the chapters
    of the book. The first software that we will use in all the chapters is the Arduino
    IDE that you need to install. You can download it from:


    http://arduino.cc/en/main/software


    The Ethernet library itself is contained within the Arduino IDE, so you won’t
    need to install it yourself. There are also several external libraries you will
    need, but these are detailed in each chapter where they are necessary.


    You will also need a web server running on your computer for some of the projects.
    I recommend using software that integrates a web server and a database, and that
    handles all the details for you.


    If you are working on Windows, I recommend using EasyPHP:


    http://www.easyphp.org/


    Under OS X, I recommend using MAMP:


    http://www.mamp.info/


    For Linux, you can follow the instructions provided at the following link to install
    a web server:


    http://doc.ubuntu-fr.org/lamp


    Make sure that the server is running at this point; we are going to use it in
    several projects in this book.'
  merge: -1
  img_proc: true
- pgno: 28
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 29
  md: '# Who this book is for


    This book is for all those who are willing to build exciting connected Arduino
    projects using the Ethernet shield. You actually don’t need to know the Arduino
    platform beforehand as all the projects will be explained step by step with clear
    instructions. You also don’t need any prior knowledge in the Ethernet technology.
    The only thing you need to understand is the projects found in this book are just
    basic knowledge in electronics and programming.


    This book is also for electronic hobbyists who want to learn more about the Arduino
    platform. By executing the projects found in this book, you will learn about many
    possible ways to use the Arduino Ethernet shield. You will also learn how to connect
    sensors and actuators to Arduino and control them within your local network.


    Finally, this book is also for those who are willing to learn more about the Internet
    of Things framework using the Arduino Ethernet shield. The last chapters of the
    book are dedicated to building projects that are connected to cloud services and
    can be accessed from anywhere in the world, simply by connecting your Arduino
    projects to your Internet router via Ethernet.'
  merge: -1
  img_proc: true
