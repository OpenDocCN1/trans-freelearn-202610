  md: "# Displaying the results\n\nWe are now going to use the data that was logged\
    \ in the database and display it on a graph for more convenience. For this task,\
    \ we are going to use a JavaScript library called flot, which is already included\
    \ in the code for this chapter. This library provides nice functions to plot data\
    \ on a web page, and also allows you to plot data in real time, so you will see\
    \ the graph being automatically updated as more data comes in.\n\nEverything will\
    \ happen inside an HTML file called plot.html. We will only see the most important\
    \ parts of the code here. Please refer to the GitHub repository of the chapter\
    \ to get the complete files. Inside this file, you first have to to include the\
    \ files required for the flot library:\n\n```\n<script src=\"flot/jquery.js\"\
    ></script>\n<script src=\"flot/jquery.flot.js\"></script>\n<script src=\"flot/jquery.flot.time.js\"\
    ></script>\n```\n\nYou also need an element in the HTML page that will host the\
    \ graph. This is done using the following piece of code:\n\n```\n<div id=\"placeholder\"\
    \ style=\"width:800px; height:450px;\"></div>\n```\n\nLet's also define some options\
    \ for the plot. Since this is now JavaScript, we have to write this code inside\
    \ the <script>...</script> tags. If you want to learn more about JavaScript first,\
    \ I recommend this excellent interactive tutorial:\n\nhttp://www.codecademy.com/en/tracks/javascript\n\
    \nBecause we have timestamps as the x-axis, we need to specify that the data for\
    \ this axis is a specific time, and that we want to display the hours, minutes,\
    \ and seconds:\n\n```\nvar options = {\n xaxis: {\n mode: \"time\",\n timeformat:\
    \ \"%H:%M:%S\"\n }\n};\n```\n\nWe also need to receive the data every time we\
    \ call the script to plot the data. This is done by an AJAX call to the PHP file\
    \ we created before:\n\n```\n$.ajax({\n url: \"readout.php\",\n type: \"GET\"\
    ,\n dataType: \"json\",\n success: onDataReceived\n});\n```\n\nNote that this\
    \ code has to go inside the update() function in the JavaScript code. You can\
    \ define this function with:\n\n```\nfunction update() {\n```\n\nYou can see that\
    \ this AJAX call, if successful, calls another JavaScript function. This"
  merge: -1
  img_proc: true
- pgno: 70
  md: "function will actually take the data as an argument and plot it with the options\
    \ we defined before:\n\n```\nfunction onDataReceived(series) {\n    var data =\
    \ [];\n    data.push(series);\n    $.plot(\"#placeholder\", data, options);\n\
    }\n```\n\nAll this code is contained in the update() function, and this function\
    \ is called continuously (every 10 milliseconds) so that the plot is always updated\
    \ when a new data point comes in:\n\n```\nsetTimeout(update, 10);\n```\n\nFinally,\
    \ at the end of the script, we call this function once to get the graph started:\n\
    \n```\nupdate();\n```\n\nIt is now time to test the page we just created. Place\
