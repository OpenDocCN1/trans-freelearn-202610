- pgno: 76
  md: '# Chapter 3. Data Logging Station


    In this chapter, we are going to create something really similar to what we did
    in Chapter 2, Sending Data to a Web Server, that is measuring data from a sensor,
    storing the data, and sending it back to a web server so that it can be plotted.


    However, things are going to be similar only on the appearance front. Instead
    of having an Ethernet client that runs on the Arduino board and sends data to
    a server, we are going to make the Arduino board more independent. In the first
    part of the chapter, we are going to log the data locally using the integrated
    MicroSD card reader of the Ethernet shield.


    Then, we are going to create a server right on the Arduino board. The board will
    measure data as usual, but the server will serve the data to the incoming clients.
    Finally, we will use a modified version of the code we used in the Chapter 2,
    Sending Data to a Web Server, to plot the measured data on your computer.


    The following will be the major takeaways of this chapter:


    +   First, we are going to build the hardware for this project, including the
    temperature and humidity sensor, and the SD card to log the measured data.


    +   Then, we will create the first part of the project, and log data automatically
    on the SD card, which is inserted inside the Ethernet shield. At this point, we
    are going to use the Internet connection of the Ethernet shield to automatically
    obtain the current time from a Network Time Protocol (NTP) time server.


    +   Finally, we are going to build a web server and run it on the Arduino board.
    You will then be able to access the data measured by the board just by entering
    in the address of the board in a web browser. We are also going to modify the
    code from the last chapter to obtain the measurements from the Arduino board and
    plot them live in your browser.'
  merge: -1
  img_proc: true
- pgno: 77
  md: '# # Hardware and software requirements


    On the hardware front, you will of course, need the Arduino Ethernet shield and
    an

    Arduino board such as the Arduino Uno.


    You will also need a sensor to measure some data. As this book is about how to
    use the

    Ethernet shield and not how to measure from sensors, you could actually take any
    sensor

    of your choice.


    I used a DHT11 sensor, which is a digital temperature and humidity sensor. I chose
    this

    sensor for this chapter and for many chapters of the book as it is a very cheap
    sensor and

    easy to interface with Arduino. Along with the DHT11 sensor, you will also need
    a 4.7k

    ochm resistor.


    To log the data, you will need to have a MicroSD card that you can plug into the
    Ethernet

    shield. I don''t have a specific brand to recommend, but I used a SanDisk MicroSD
    card

    with a normal SD adapter (which worked well for me), so you can also plug it into
    your

    computer to check whether the data was correctly logged. Also, make sure that
    the SD

    card is formatted using the FAT32 format.


    You will also need a breadboard and some jumper wires to create the connection
    between

    the sensor and the Ethernet shield.


    The following is a list of all components that were used for this chapter:


    +   - The Arduino Uno (https://www.adafruit.com/products/50)

    +   - The Arduino Ethernet shield (https://www.adafruit.com/products/201)

    +   - The DHT11 sensor (https://www.adafruit.com/products/386)

    +   - A MicroSD card (http://www.amazon.com/SanDisk-Micro-SDHC-Memory-

    +   Adapter/dp/B0052MHQM6)

    +   - A breadboard (https://www.adafruit.com/product/64)

    +   - Jumper wires (https://www.adafruit.com/product/758)


    On the software front, the first thing you will need is the library to interface
    with the

    sensor you chose before. I chose a DHT11 sensor for this project. You will need
    to

    download and install the DHT library from https://github.com/adafruit/DHT-sensor-

    library.


    To install an Arduino library, simply unzip the content of the downloaded file
    to your

    libraries folder of your main Arduino folder (or create this folder if you haven''t
    done so

    already).'
  merge: -1
  img_proc: true
- pgno: 78
  md: '# # Hardware configuration


    It''s now time to set up the hardware for this project. At this point, if you
    followed any of the previous chapters of this book, you should already have your
    Arduino Ethernet shield plugged into the Arduino board, and one Ethernet cable
    connecting the Ethernet shield and your Internet router. If that''s not the case
    already, please do so.


    The only thing you will have to connect in this project is the DHT11 sensor and
    the resistor. You can see an overview of the different connections you have to
    make by looking at the following schematic diagram:


    ![](img/b454031c864977fe997c5feb0b3f9b63_78_0.png)


    First, plug the DHT11 sensor into the breadboard. Then, connect the pin number
    1 and 2 of the sensor using the 4.7k ohm resistor.


    Now comes the power supply. Connect the pin number 1 of the sensor to the Arduino
    5V, and the pin number 4 to the Arduino GND. Finally, connect the pin number 2
    of the DHT sensor to the Arduino pin number 7.


    At the end, it should look like the following image:'
