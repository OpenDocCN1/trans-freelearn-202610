- pgno: 81
  md: '# # Logging data on an SD card


    Let''s start with the first topic of this chapter—logging data on a SD card using
    the integrated SD card slot of the Ethernet shield. What we are going to do is
    perform some measurements on the Arduino board and log each of these measurements
    to the SD card in a simple text file.


    However, compared to the project of the Chapter 2, Sending Data to a Web Server,
    we don''t actually know the date when the measurement was taken. In the previous
    chapter, we simply used the date of the computer, but we don''t have this information
    here. To get the time on the Arduino board, we are going to use another strategy.
    We are going to use the Ethernet shield to connect to an NTP time server, grab
    the time once when the Arduino sketch starts, and then use the Time library to
    track the time from there.


    To learn more about the Time library, you can visit the following page on the
    Arduino website:


    http://playground.arduino.cc/Code/Time


    The process of logging data on a SD card starts by including the correct libraries
    as follows:


    ```

    #include "DHT.h"

    #include <SD.h>

    #include <Time.h>

    #include <Ethernet.h>

    #include <EthernetUdp.h>

    #include <SPI.h>

    ```


    We also need to define the sensor type and the pin to which the sensor is connected.
    This is done with the following lines of code:


    ```

    #define DHTPIN 7

    #define DHTTYPE DHT11

    ```


    To define the MAC address of the Ethernet shield, use the following line of code:


    ```

    byte mac[] = { 0x90, 0xA2, 0xDA, 0x0E, 0xFE, 0x40 };

    ```


    To use the SD card, you will also need to define the chipSelect pin, which is
    the pin number 4 on the Ethernet shield. This is done using the following line:


    ```

    const int chipSelect = 4;

    ```


    Now, we are going to deal with the NTP server. There are actually several NTP
    servers you can use (you can see the IP addresses of many of these servers inside
    the TimeNTP example that come with the Time library). You can also set your time
    zone here. To get more information about which NTP server you can use and which
    time zone to set, you can have a look at the example TimeNTP sketch. This sketch
    is given as an example inside the Time library. For this project, I used the first
    server available with time zone number 1, as shown in the following code:'
  merge: -1
  img_proc: true
- pgno: 82
  md: '```

    IPAddress timeServer(132, 163, 4, 101);

    const int timeZone = 1;

    ```


    To connect to this server, we also need to define an Ethernet client. This time,
    we are

    going to use a protocol different from the earlier one, which is called UDP. UDP
    is

    different from TCP—it’s much simpler and lighter. However, it doesn’t guarantee
    that the

    data was correctly delivered, which TCP does. You don’t actually need to care
    about the

    details of this protocol, as the Time library handles everything. You can just
    leave the

    default UDP port, as shown in the following code:


    ```

    EthernetUDP Udp;

    unsigned int localPort = 8888;

    ```


    You also need to create an instance of the DHT sensor as follows:


    ```

    DHT dht(DHTPIN, DHTTYPE);

    ```


    Now, in the setup() function of the sketch, you need to define the following code

    responsible for getting an IP address for the Ethernet shield:


    ```

    Serial.begin(9600);

    if (Ethernet.begin(mac) == 0) {

    // no point in carrying on, so do nothing forevermore:

    while (1) {

    Serial.println("Failed to configure Ethernet using DHCP");

    delay(10000);

    }

    }

    ```


    After that, we will try to initialize the SD card, as shown in the following code:


    ```

    Serial.print("Initializing SD card...");

    pinMode(10, OUTPUT);

    ```


    If this is successful, we will print out a message on the serial port, as shown
    in the

    following code:


    ```

    if (!SD.begin(chipSelect)) {

    Serial.println("Card failed, or not present");

    // don''t do anything more:

    return;

    }

    Serial.println("card initialized.");

    ```


    We will also start the DHT sensor as follows:


    ```

    dht.begin();

    ```


    Finally, still in the setup() function, we will print out the IP address of the
    Ethernet shield

    and create the connection to the NTP server. Note that here we are calling a function
    called

    getNtpTime, which is defined later in the sketch. As this is a function provided
    by the

    Time library, we are not going to look into the details of this function. The
    following is the

    code for this part:


    ```

    Serial.print("IP number assigned by DHCP is ");

    Serial.println(Ethernet.localIP());

    ```'
  merge: -1
  img_proc: true
- pgno: 83
  md: '```

    Udp.begin(localPort);

    Serial.println("waiting for sync");

    setSyncProvider(getNtpTime);

    ```


    Now, in the loop() function of the sketch, we will first measure the temperature
    and humidity from the sensor using the following code:


    ```

    float h = dht.readHumidity();

    float t = dht.readTemperature();

    ```


    Secondly, we will convert these measurements to strings as follows:


    ```

    String temp = String((int) t);

    String hum = String((int) h);

    ```


    We are now going to build a string that contains the date and time of the measurement
    using the Time library. This library contains functions to get the current time,
    day, or month, for example, which are calculated from the initial call to the
    NTP server. For example, calling the day() function will return the current day.
    The following piece of code returns a string with the date and time:


    ```

    String log_time = String(day()) + "/" +

    String(month()) + "/" + String(year())) + " " +

    String(hour()) + ":" + String(minute()) + ":" +

    String(second());

    ```


    We then assemble this string with the temperature and humidity measurements using
    commas as separators between the different strings, as shown in the following
    line of code:


    ```

    String dataString = log_time + "," + temp + "," + hum;

    ```


    We are now going to write this data on the SD card. We first need to open the
    card to write data using the following line:


    ```

    File dataFile = SD.open("datalog.txt", FILE_WRITE);

    ```


    If that''s successful, we will put the contents of the dataString variable to
    this file named datalog.txt, as shown in the following code:


    ```

    if (dataFile) {

    dataFile.println(dataString);

    dataFile.close();

    Serial.println(dataString);

    } else {

    Serial.println("error opening datalog.txt");

    }

    ```


    Finally, we will repeat the operation every 10 seconds, but you can, of course,
    modify this delay with the following line:


    ```

    delay(10000);

    ```


    # Note'
  merge: -1
  img_proc: true
