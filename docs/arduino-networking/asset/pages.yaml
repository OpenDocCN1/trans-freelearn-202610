- pgno: 102
  md: '# # Hardware configuration


    Now let''s see how to connect the different components of the project. As with
    the other chapters of the book, you will need to have the Ethernet shield plugged
    into the Arduino board. You will also need to connect an Ethernet cable between
    the Ethernet shield and your router.


    Then, you need to connect the relay module. The relay module has three input pins:
    VCC, GND, and a signal pin usually called SIG. You need to connect the VCC pin
    to Arduino 5 V, GND to Arduino GND, and finally the signal pin to Arduino pin
    number 7, which is a digital pin. The following image shows the system at this
    point:


    ![](img/b454031c864977fe997c5feb0b3f9b63_102_0.png)


    Then, you need to connect the power cables to the relay module. A relay module
    basically has three output pins: COM (for the common pin), NC (for the normally
    closed pin), and NO (for the normally open pin).


    What we want is to have the COM pin of the relay connected to one wire of the
    power plug, NC not connected, and NO connected to one other wire of the power
    plug. The following image summarizes the connections at this stage:'
  merge: -1
  img_proc: true
- pgno: 103
  md: '![](img/b454031c864977fe997c5feb0b3f9b63_103_0.png)


    First, connect one pin of the female power plug to the **COM** pin. Then, connect
    one pin of the male power plug to the **NO** pin. Finally, connect the two remaining
    cables together, for example, using a typical electrical screw terminal.


    Once this is done, you can connect the device you want to control the relay. Connect
    the lamp inside the female power socket, and then connect the male power plug
    to the power plug in the wall. The following image represents the system at this
    point, without the device to control being connected:


    ![](img/b454031c864977fe997c5feb0b3f9b63_103_1.png)


    If you have something similar, congratulations! You are done with the hardware
    connections for this chapter.'
