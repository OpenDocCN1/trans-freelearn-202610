    you can visit http://www.packtpub.com/support and register to have the files e-mailed
    directly to you.


    Then, we have to define the MAC address of the Ethernet shield. This address is
    located just behind the shield, and you should have noted it down already. You
    have to enter it in the following format:


    ```

    byte mac[] = { 0x90, 0xA2, 0xDA, 0x0E, 0xFE, 0x40 };

    ```


    We also need to define where we are going to connect to test the connection. You
    can use any web page you want, or even perform a search on Google, but for this
    first test, I want to use a simple page.


    I found this website with a simple test page that we''ll try to grab while making
    a request later in the sketch. You can also set up your own page if you have a
    web server online, for example, if you have a blog hosted somewhere.


    The website address is stored in a char variable:


    ```

    char server[] = "www.brainjar.com";

    ```


    Note that you can also use other pages here, for example http://www.example.com/hello.


    The Ethernet shield will then automatically get the IP address of this website.


    To get an IP address for the Ethernet shield itself, we''ll use DHCP to automatically
    get one from the router we are connected to. However, if DHCP fails, we need to
    assign a default address to the shield.


    This is stored in an IPAddress variable. Note that you can put anything you want
    inside this variable. As for this first project, we really need DHCP to work to
    get connected to the Web. However, it is a good practice to specify an IP address
    in the same subnet as your router, so the shield can at least connect to your
    local network. For example, the IP address'
