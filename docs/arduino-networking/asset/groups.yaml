    \ time it is the Arduino board itself that will display the data as it is measured.\n\
    \nThe sketch for this part starts by including the right libraries, as shown in\
    \ the following code:\n\n```\n```cpp\n#include \"DHT.h\"\n#include <Ethernet.h>\n\
    #include <SPI.h>\n```\n```\n\nDefine the pin and the type of the sensor in the\
    \ following manner:\n\n```\n```cpp\n#define DHTPIN 7\n#define DHTTYPE DHT11\n\
    ```\n```\n\nAlso, you have to define the MAC address of your Ethernet shield as\
    \ usual, as shown in the following line of code:\n\n```\n```cpp\nbyte mac[] =\
    \ { 0x90, 0xA2, 0xDA, 0x0E, 0xFE, 0x40 };\n```\n```\n\nWe will also define a default\
    \ IP address in case the DHCP fails, as shown in the following line:\n\n```\n\
    ```cpp\nIPAddress ip(192,168,1,50);\n```\n```\n\nThis is where the new feature\
    \ comes in. So far, we only used the EthernetClient class to define a client that\
    \ will connect to a remote server. Here, however, because we want to create a\
    \ server right on the Arduino board, we are going to use the EthernetServer class,\
    \ as shown in the following line of code:\n\n```\n```cpp\nEthernetServer server(80);\n\
    ```\n```\n\nYou can use the port 80 for your server, as it will be much easier\
    \ to access the server from your web browser.\n\nWe also should not forget to\
    \ create an instance of the DHT sensor. This is done using the following line:\n\
    \n```\n```cpp\nDHT dht(DHTPIN, DHTTYPE);\n```\n```\n\nNow, in the setup() function\
    \ of the sketch, we will try to use DHCP to get an IP address for the Ethernet\
    \ shield using the following code:\n\n```\n```cpp\nif (Ethernet.begin(mac) ==\
    \ 0) {\n    Serial.println(\"Failed to configure Ethernet using DHCP\");\n   \
    \ Ethernet.begin(mac, ip);\n}\n```\n```\n\nStill in the setup() function, we also\
    \ have to start our Ethernet server, and print out the IP"
  - "[PAGE 88]\n\naddress of the server using the following code:\n\n```\nserver.begin();\n\
