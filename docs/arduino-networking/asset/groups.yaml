  mdcn: "\n\n![](img/b454031c864977fe997c5feb0b3f9b63_143_0.png)\n\n本项目的硬件配置现已完成，您可以进入下一步，即为此项目设置\
    \ Google 账号。\n\n## 设置您的 Google 账号\n\n为此项目，您需要拥有一个 Google 账号。如果您已经在使用 Gmail 或 YouTube\
    \ 等服务，则说明您已拥有 Google 账号，并可立即使用 Google 文档。如果不是这种情况，您可以在以下地址创建账号：\n\n[https://docs.google.com](https://docs.google.com)\n\
    \n创建账号后，您即可创建第一个电子表格。为此，只需点击 **创建** 按钮并选择 **电子表格**。您需要为电子表格输入一个名称，这一点非常重要，因为您稍后需要将此名称提供给\
    \ Temboo。我将我的表格简单地命名为 Ethernet。\n\n然后，您需要为将接收数据的列命名。我们将测量温度和湿度，并为每次测量添加时间戳。您需要在第一行中输入这些内容，如以下截图所示：\n\
    \n| | A | B | C |\n|---|---|---|---|\n| 1 | 时间戳 | 温度 | 湿度 |\n| 2 | | | |\n| 3\
    \ | | | |\n| 4 | | | |\n\n当您拥有如上所示的 Google 电子表格时，即表示此部分设置已完成，您可以进入下一部分。\n\n##\
    \ 创建您的 Temboo 账号\n\n下一步是在 Temboo 上创建账号。为此，只需访问以下地址：\n\nhttps://www.temboo.com/\n\
    \n您将看到一个要求输入电子邮件地址的页面。\n\n![](img/b454031c864977fe997c5feb0b3f9b63_147_0.png)\n\
    \n创建账号后，您将被带到 Temboo 主页。此阶段您会有许多选择，但我们要找的是 **设备**，如以下截图所示：\n\n![](img/b454031c864977fe997c5feb0b3f9b63_147_1.png)\n\
    \n在设备页面中，Temboo 提供了一个名为 **设备编码器** 的工具。当我们使用 Arduino Yun 等平台，或者在本例中使用 Arduino Ethernet\
    \ 扩展板时，该工具旨在为我们生成大部分代码。\n\n只需点击正确的选项，该选项对应 Ethernet 扩展板等其他 Arduino 设备，如以下截图所示：\n\
    \n## 设备编码器\n\n## 无需编写代码即可编程硬件\n\n几分钟内设置连接设备。我们全新的设备编码器工具可让您使用带有传感器的 Arduino 在多种场景下触发\
    \ Choreo 调用。\n\n安装 Temboo 的新 Arduino 库以运行设备编码器。了解如何。\n\n## Arduino Yún\n\nArduino\
    \ 第一款带有 Linux 架构和 Wi-Fi 兼容性的开发板，内置了 Temboo 的强大功能。\n\n## 其他 Arduino 开发板\n\n- Internet\
    \ Shield\n将其他 Arduino 及 Arduino 兼容开发板与 Temboo 的强大功能相结合。\n\n然后，您将被要求选择要使用的传感器类型。当然，Temboo\
    \ 无法列出此类项目可能使用的每一种传感器。因此，DHT11 传感器不在可能设备列表中。但是，我们将通过重写部分生成的代码来解决这个问题。暂时，只需选择 **通用传感器**。然后在下一个菜单中，选择\
    \ **电子表格**。\n\n随后，您将进入一个新菜单，可在其中配置您的设备。由于这是您第一次配置设备，系统将要求您为以太网扩展板创建新的 Temboo 凭据。Temboo\
    \ 凭据是一组存储在 Temboo 服务器上的参数，以便您在后续开发应用程序时无需再次输入它们。\n\n在凭据框中输入您的 Arduino 开发板和以太网扩展板的详细信息，如以下截图所示：\n\
    \n![](img/b454031c864977fe997c5feb0b3f9b63_149_0.png)\n\n然后，就像您选择使用电子表格一样，您还需要输入您的\
    \ Google 账号凭据。我们将使用它来访问 Google 文档，并在本章的最后部分用于与 Gmail 进行交互。\n\n在以下截图所示的框中输入您的所有\
    \ Google 账号信息：\n\n![](img/b454031c864977fe997c5feb0b3f9b63_150_0.png)\n\n对于我的\
    \ Google 账号凭据名称，我使用了 Ethernet@gmail。\n\n请注意，如果您已启用 Google 两步验证方法，则需要在此处提供专用应用密码。这是出于安全考虑，以防\
    \ Temboo 受到攻击时，您的 Google 账号不会被泄露。您可以在 https://support.google.com/accounts/answer/185833?hl=en\
    \ 查找有关专用应用密码的更多信息。\n\n您也可以选择此时不输入 Google 信息。但是，在这种情况下，您将需要在 Arduino 草图中输入这些信息，并对该草图进行轻微修改。要了解更多信息，您可以访问\
    \ https://www.temboo.com/arduino/yun/update-google-spreadsheet。\n\n您还需要为先前准备好的电子表格提供一个名称。只需在正确的框中输入此名称，如以下截图所示：\n\
    \n![](img/b454031c864977fe997c5feb0b3f9b63_150_1.png)\n\n例如，我将我的电子表格命名为 Ethernet：\n\
    \n![](img/b454031c864977fe997c5feb0b3f9b63_151_0.png)\n\n之后，您需要选择要用于向电子表格记录数据的设备。这就是您选择之前创建的凭据的地方，如以下截图所示：\n\
    \n![](img/b454031c864977fe997c5feb0b3f9b63_151_1.png)\n\n您还需要为刚创建的项目命名，以便您的 Arduino\
    \ 草图稍后知道将数据发送到哪里。我将我的项目命名为 arduinoTemperatureSpreadsheet。如果您决定使用另一个名称，稍后需要在代码中进行小修改。\n\
    \n完成后，系统将提示您下载一个包含两个 Arduino 代码文件的压缩文件。下载它，解压缩，然后查看它。它将如以下截图所示：\n\n![](img/b454031c864977fe997c5feb0b3f9b63_151_2.png)\n\
    \n应该有一个 Arduino 文件和另一个名为 TembooAccount.h 的文件。最后一个文件是最重要的，因为它包含您的项目凭据。在项目的其余部分中，您需要使用此文件来替代项目\
    \ GitHub 仓库中包含的文件。\n\n## 在电子表格中记录数据\n\n在 Temboo 网站上完成设备配置后，我们从 Temboo 下载了一堆文件。但是，下载的\
    \ Arduino 文件是针对通用传感器的。在本节中，我们将根据自己的需求调整此文件，并了解代码的工作原理。\n\n### 注意\n\n您需要将自己的 TembooAccount.h\
    \ 文件放在与 Arduino 文件相同的文件夹中，以便代码可以工作。\n\n本节的主要 Arduino 草图首先包含所有使项目能够与 Temboo 协同工作所需的库。请注意，我们还将插入\
    \ DHT 库。在代码中添加以下库：\n\n```\n#include <SPI.h>\n#include <Dhcp.h>\n#include <Dns.h>\n\
    #include <Ethernet.h>\n#include <EthernetClient.h>\n#include <Temboo.h>\n#include\
    \ \"TembooAccount.h\"\n#include \"DHT.h\"\n```\n\n我们还定义了连接 DHT 传感器的引脚以及传感器的类型：\n\
    \n```\n#define DHTPIN 7\n#define DHTTYPE DHT11\n```\n\n然后，我们将创建传感器的实例：\n\n```\n\
    DHTdht(DHTPIN, DHTTYPE);\n```\n\n我们还分配了以太网扩展板的 MAC 地址。请注意，这里并未明确分配，而是直接从您的 Temboo\
    \ 账号文件中获取信息。MAC 地址通过以下行分配：\n\n```\nbyte ethernetMACAddress[] = ETHERNET_SHIELD_MAC;\n\
    ```\n\n我们还将按以下方式创建一个以太网客户端实例：\n\n```\nEthernetClient client;\n```\n\n现在，在草图的 setup()\
