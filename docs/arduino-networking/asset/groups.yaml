    ## Summary


    Let’s summarize what we did in this chapter. We used the Ethernet shield to build
    an Internet of Things project, as we connected the Ethernet shield directly to
    a cloud service. We measured data on the Arduino board and sent this data to the
    cloud service Xively so that it can be accessed and displayed from anywhere.


    The advantage of this solution is that the data recorded on Xively is accessible
    from anywhere, and not only from your local network. You can also use the data
    and Xively to create automated triggers based on the data. You can, for example,
    send a request to another website based on the recorded data. You can also share
    the data that is recorded by your device with colleagues or friends so that they
    can also monitor what your project is recording in real time.


    Of course, one of the drawbacks from this solution is that if your Internet connection
    is down, the whole project won’t work at all.


    The following were the major takeaways from this chapter:


    - We first built the hardware of this project, including the Ethernet shield and
    the DHT11 sensor to measure temperature and humidity.

    - Then, we went over to the Xively website and created an account there. We also
    set up a device on the Xively interface, and created channels so that data can
    be recorded on the Xively website. Finally, we also got a feed ID and API key
    so that the Arduino sketch knows where to send the data.

    - We then designed the Arduino sketch for this project. The Arduino sketch was
    responsible for measuring data, formatting it according to the Xively guidelines,
    and sending it to Xively. We tested this sketch and made sure that Xively accepted
    the data.

    - Finally, we went again to the Xively website to visualize the data. We learned
    how to visualize this data graphically, and saw the data arrive in real time.


    In the next chapter, we are going to continue building Internet of Things applications.
    We are going to use another web service called **Temboo**, which is a platform
    that can be interfaced with other services such as Gmail or Google Docs. We are
    going to use this service to record data directly on a Google Docs spreadsheet
    and send automated e-mails based on the recorded data.


    ## Chapter 6. Logging Data in Google Docs


    In this chapter, we are going to continue building Internet of Things applications
    using the Arduino Ethernet shield. This time, we are going to use the web service
    Temboo, to build some useful and interesting applications. Temboo is different
    from Xively, which we used in the previous chapter. It is not a cloud platform
    in itself, but it can be used to interface our Arduino projects with several other
    applications and services. You can see Temboo as a bridge between your Ethernet
    shield and a wide range of web services, such as e-mail services, text messaging
    services, or storage services.


    For example, in this chapter, we are going see how to interface your Arduino project
    to your Google Account via Temboo. We will use this functionality to automatically
    log measurements inside a Google Docs spreadsheet.


    The advantage of this solution is that you can access your Google Docs spreadsheet
    from anywhere, thus monitoring your data from anywhere in the world while your
    Ethernet shield is sending data from home. We are also going to send automated
    e-mail alerts using Gmail based on the measured data.


    The following will be the major takeaways of this chapter:


    - First, we are going to configure the hardware part of this project using the
    Ethernet shield and the DHT11 sensor. We are also going to download and install
    the required libraries for the project, including the Temboo Arduino library.

    - Then, we will set up the different accounts that we need for this chapter. First,
    we will set up your Google Account and create a spreadsheet where the data will
    be logged. We are also going to set up a Temboo account and configure it to use
    the Arduino Ethernet shield.

    - Once all the accounts are set, we are going to build the first application of
    this project —automatic log measured data in a Google Docs spreadsheet. You will
    be able to see the measured data recorded live in the spreadsheet and the data
    being plotted automatically in real time.

    - Finally, we are going to set up our Arduino system to automatically send e-mails
    when a given measurement exceeds a threshold.


    ## Hardware and software requirements


    On the hardware side, you will of course need the Arduino Ethernet shield and
    an Arduino board such as the Arduino Uno.


    You will also need a sensor to measure some data. As this book is about how to
    use the Ethernet shield and not how to measure from sensors, you could actually
    take any sensor of your choice.


    I used a DHT11 sensor, which is a digital temperature and humidity sensor. I chose
    this sensor for this chapter and for many chapters of the book as it is a very
    cheap sensor and it is easy to interface with Arduino. Along with the DHT11 sensor,
    you will also need a 4.7k ohm resistor.


    You will also need a breadboard and some jumper wires to create the connections
    between the sensor and the Ethernet shield.


    On the software side, the first thing you will need is the library to interface
    with the sensor you chose before. As I chose a DHT11 sensor for this project,
    you will need to download and install the DHT library from https://github.com/adafruit/DHT-sensor-library
    in order to use this.


    You will also need to download and install the Arduino Temboo library from https://www.temboo.com/arduino/others/library-installation.


    To install an Arduino library, simply unzip the contents of the downloaded file
    to your libraries folder of your main Arduino folder (or create this folder if
    it doesn''t exist already).


    ## Hardware configuration


    It''s now time to set up the hardware for this project. At this point, if you
    followed one of the previous chapters, you should already have your Arduino Ethernet
    shield plugged to the Arduino board, one Ethernet cable connecting the Ethernet
    shield, and your Internet router. If that''s not the case already, please do so.


    The only thing you will have to connect in this project is the DHT11 sensor and
    the resistor. You can have an overview of the different connections you have to
    make by looking at the following schematic diagram:


    ![](img/b454031c864977fe997c5feb0b3f9b63_142_0.png)


    First, plug the DHT11 sensor to the breadboard. Then, connect pin number 1 and
    2 of the sensor using the 4.7k ohm resistor.


    Now, we are going to connect the power supply. Connect pin number 1 of the sensor
    to the Arduino 5V, and pin number 4 to the Arduino GND. Finally, connect pin number
    2 of the DHT sensor to the Arduino pin number 7.


    At the end, the connections should look like the following screenshot:

    '
