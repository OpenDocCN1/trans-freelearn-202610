  - '[PAGE 163]


    # Summary


    In this chapter, we created another Internet of Things project using the web service
    Temboo. Based on Temboo, we built two exciting applications. The first one was
    to automatically log measurements inside a Google Docs spreadsheet. Compared to
    the approach we took in the previous chapter, the advantage here is clearly that
    Google Docs is the widely used standard to create and share spreadsheets. You
    can access your data from anywhere just by using a web browser, and you can also
    plot the data and share it easily with your friends and family.


    We also built an exciting application where we interfaced our project with Gmail
    via Temboo. We built an automated e-mail alert system based on the measured data.


    Let’s see what the major takeaways of this chapter were. First, we built the hardware
    of the project, with the DHT11 temperature and humidity sensor on top of the Arduino
    Ethernet shield.


    Then, we set up the different accounts that were needed for the project. We first
    created a spreadsheet on Google Docs and configured it correctly so it can work
    with Temboo. Then, we also created a Temboo account and configured it so that
    your Ethernet shield can send data to Temboo and log measurements to Google Docs.


    After the setting up phase, we built the first application of this project, which
    consisted of logging data directly to a Google Docs spreadsheet. We also displayed
    this data using the Google Docs plotting capabilities.


    Finally, we used Temboo again to create an automated e-mail alert system by sending
    an e-mail automatically to the address of your choice when a measurement reached
    a given threshold.


    As this is the end of this book, let’s see what we learned about the Arduino Ethernet
    shield and what exciting applications we can create with it.


    The first part of the book was all about running a web client on the Ethernet
    shield. We made a first test by just trying out the shield and seeing whether
    it could connect to the Internet and grab the contents of a page. Then, we built
    our first measurement system, where the Ethernet shield was connecting to a server
    running to your computer to log some data.


    In the second part of the book, we gave more autonomy to the Arduino Ethernet
    shield by running a web server right on the Arduino board. We made the measurement
    project again, but this time by having a web server run on the board and logging
    data to a SD card inserted in the shield. We also connected a relay to the Arduino
    board and we controlled it via Ethernet.


    Finally, we built two Internet of Things project using the platforms Xively and
    Temboo. In both these projects, we sent data to the Web using the Ethernet shield
    so that this data can be accessed and displayed graphically from anywhere in the
    world.


    To conclude this book, I hope that all the information you found in the different
    chapters'
  - '[PAGE 164]


    will give you the will to build even more exciting applications. The Arduino Ethernet
    shield is one of the best ways to build amazing connected applications with Arduino,
    and there is no limit to what you can do with the concepts you learned in this
    book.'
