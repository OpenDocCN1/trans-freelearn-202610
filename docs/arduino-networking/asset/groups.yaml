    # Summary


    In this second chapter of the book, we built our first application based on the
    Arduino Ethernet shield and Ethernet client class. We did some basic measurements
    on the Arduino board, sent these measurements on a local web server, and finally
    displayed this data in real time on a graph.


    To proceed further with this chapter, I invite you to carefully repeat all the
    steps of this chapter to really understand well how the Arduino Ethernet shield
    communicates with the PHP code running on your computer. You can also add more
    sensors to the projects and log this data inside the database. Also, you can try
    to plot several variables at once on different graphs.


    These were the major takeaways from this chapter:


    +   - First, we interfaced a digital temperature and humidity sensor to the Arduino
