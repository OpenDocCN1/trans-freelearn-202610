    \n在草图中设置的延迟之后，您将看到带有相应日期和时间的第二次测量。为确保草图正确将数据写入 SD 卡，您可以让它运行一段时间，然后将以太网扩展板从电源上断开。之后，取出\
    \ SD 卡，并通过适配器在计算机上读取它。您应该看到以下截图：\n\n![](img/b454031c864977fe997c5feb0b3f9b63_84_0.png)\n\
    \n如您所见，所有测量值都已正确记录在 SD 卡上，我们可以清楚地看到两次测量之间的间隔为 10 秒。\n\n## 在 Arduino 上创建 Web 服务器\n\
    \n在本章的其余部分，我们将采用另一种方法。我们仍将使带有以太网扩展板的 Arduino 作为独立系统工作，但这次我们甚至要在 Arduino 开发板上创建一个\
    \ Web 服务器。这实际上类似于我们在第 2 章“将数据发送到 Web 服务器”中看到的项目，但这次是 Arduino 开发板本身在测量时显示数据。\n\n\
    此部分的草图首先包括正确的库，如以下代码所示：\n\n```cpp\n#include \"DHT.h\"\n#include <Ethernet.h>\n\
    #include <SPI.h>\n```\n\n请按以下方式定义引脚和传感器类型：\n\n```cpp\n#define DHTPIN 7\n#define\
    \ DHTTYPE DHT11\n```\n\n同样，您还需要像往常一样定义以太网扩展板的 MAC 地址，如以下代码行所示：\n\n```cpp\nbyte\
    \ mac[] = { 0x90, 0xA2, 0xDA, 0x0E, 0xFE, 0x40 };\n```\n\n我们还将定义一个默认 IP 地址，以防\
    \ DHCP 失败，如以下行所示：\n\n```cpp\nIPAddress ip(192,168,1,50);\n```\n\n新功能就在这里。到目前为止，我们只使用\
    \ EthernetClient 类来定义将连接到远程服务器的客户端。但是在这里，因为我们想要在 Arduino 开发板上直接创建一个服务器，所以我们将使用\
    \ EthernetServer 类，如以下代码行所示：\n\n```cpp\nEthernetServer server(80);\n```\n\n您可以为服务器使用端口\
    \ 80，因为这样从 Web 浏览器访问服务器会更加容易。\n\n我们也不应忘记创建 DHT 传感器的实例。这是使用以下行完成的：\n\n```cpp\n\
    DHT dht(DHTPIN, DHTTYPE);\n```\n\n现在，在草图的 setup() 函数中，我们将尝试使用 DHCP 为以太网扩展板获取 IP\
    \ 地址，使用以下代码：\n\n```cpp\nif (Ethernet.begin(mac) == 0) {\n    Serial.println(\"\
    Failed to configure Ethernet using DHCP\");\n    Ethernet.begin(mac, ip);\n}\n\
    ```\n\n仍然在 setup() 函数中，我们还必须启动以太网服务器，并使用以下代码打印服务器的 IP 地址：\n\n```cpp\nserver.begin();\n\
    Serial.print(\"Server is at \");\nSerial.println(Ethernet.localIP());\n```\n\n\
    最后，我们将按以下方式启动 DHT 传感器：\n\n```cpp\ndht.begin();\n```\n\n现在，在草图的 loop() 部分中，我们将执行温度和湿度测量，如以下代码所示：\n\
    \n```cpp\nfloat h = dht.readHumidity();\nfloat t = dht.readTemperature();\n```\n\
    \n使用以下代码将测量值转换为字符串：\n\n```cpp\nString temp = String((int) t);\nString hum = String((int)\
    \ h);\n```\n\n然后，我们需要处理到达 Arduino 开发板的连接，例如来自 Web 浏览器的连接。为此，每次服务器可用时，我们实际上都将创建一个\
    \ EthernetClient 类的实例。由于这是我们在本书前面章节中已经见过的类，这已经是我们熟悉的操作了。\n\n如果检测到连接，我们将创建此客户端，并将其打印到串行端口以供调试，如以下代码所示：\n\
    \n```cpp\nEthernetClient client = server.available();\nif (client) {\n    Serial.println(\"\
    New client\");\n}\n```\n\n下一部分有些技术性。我们需要读取来自客户端的请求，但也需要检测请求结束的时刻，以便我们可以关闭连接。这是通过始终检查当前行是否为空白来处理的。然后，第一步是使用以下代码片段逐个字符地读取来自客户端的请求：\n\
    \n```cpp\nboolean currentLineIsBlank = true;\nwhile (client.connected()) {\n \
    \   // Read data\n    if (client.available()) {\n        char c = client.read();\n\
    \        Serial.write(c);\n    }\n}\n```\n\n请注意，传入的请求也会打印到串行端口以供调试。现在，如果我们检测到换行符且当前行是空白，则表示请求已结束，如以下行所示：\n\
    \n```cpp\nif (c == '\\n' && currentLineIsBlank) {\n```\n\n因此，我们可以回复客户端。我们将首先发送一个标准\
    \ HTTP 头，指出一切正常，并且我们希望每 5 秒自动刷新页面一次，如以下代码所示：\n\n```cpp\nclient.println(\"HTTP/1.1\
    \ 200 OK\");\nclient.println(\"Content-Type: text/html\");\nclient.println(\"\
    Connection: close\");\nclient.println(\"Refresh: 5\"); // Refresh the page automatically\
    \ every 5 sec\nclient.println();\nclient.println(\"<!DOCTYPE HTML>\");\nclient.println(\"\
    <html>\");\n```\n\n然后，我们将使用以下代码在页面上打印测量数据：\n\n```cpp\nclient.print(\"Temperature:\
    \ \");\nclient.print(temp);\nclient.print(\"<br />\");\nclient.print(\"Humidity:\
    \ \");\nclient.print(hum);\nclient.println(\"<br/>\");\nclient.println(\"</html>\"\
    );\n```\n\n以下其余代码用于检测是否到达了请求的末尾：\n\n```cpp\nif (c == '\\n') {\n // Starting a\
    \ new line\n currentLineIsBlank = true;\n} else if (c != '\\r') {\n // you've\
    \ gotten a character on the current line\n currentLineIsBlank = false;\n}\n```\n\
    \n最后，我们将给浏览器一个小延迟以接收响应，然后关闭连接，如以下代码所示：\n\n```cpp\n// Give the web browser time\
    \ to receive the data\ndelay(1);\n\n// Close the connection:\nclient.stop();\n\
    Serial.println(\"Client disconnected\");\n```\n\n### 注意\n\n本节的所有代码都可以在本章的 GitHub\
    \ 仓库中找到 https://github.com/openhomeautomation/arduino-networking/tree/master/chapter3。\n\
    \n现在是时候测试我们在本节中编写的代码了。再次，请确保以太网电缆已插入以太网扩展板和您的路由器。然后，您可以将代码上传到开发板，并打开串行监视器。您首先应该看到运行在\
    \ Arduino 开发板上的 Web 服务器的 IP 地址，如下所示：\n\n```\nServer is at 192.168.1.103\n```\n\
    \n之后，草图将什么也不做，只等待任何传入的连接。要建立连接，只需打开 Web 浏览器并输入开发板的 IP 地址。您应该立即在 Arduino 串行监视器中看到浏览器的\
    \ GET 请求被打印出来，如以下输出所示：\n\n```\nNew client\nGET / HTTP/1.1\nHost: 192.168.1.103\n\
    Connection: keep-alive\nCache-Control: max-age=0\nAccept: text/html,application/xhtml+xml,application/xml;q=0.9,image/webp,*/*;q=0.8\n\
    User-Agent: Mozilla/5.0 (Macintosh; Intel Mac OS X 10_9_3)\nAppleWebKit/537.36\
    \ (KHTML, like Gecko) Chrome/34.0.1847.137 Safari/537.36\nReferer: http://192.168.1.103/\n\
    Accept-Encoding: gzip,deflate,sdch\nAccept-Language: fr-FR,fr;q=0.8,en-US;q=0.6,en;q=0.4,de;q=0.2\n\
    ```\n\n如您所见，这里有大量文本，具体取决于您的浏览器。但是，重要的是请求的第一行，这意味着这是对我们 Arduino 开发板的 GET 请求。\n\n\
    最后，在 Arduino 回复服务器后，连接会关闭并显示以下消息：\n\n```\nClient disconnected\n```\n\n在您的浏览器中，您还应该直接看到数据正在打印在\
    \ Arduino 开发板创建的页面上，如以下截图所示：\n\n![](img/b454031c864977fe997c5feb0b3f9b63_90_0.png)\n\
    \n如果您可以看到这个，恭喜，您刚刚创建了在 Arduino 开发板上运行的自己的 Web 服务器。如果您看不到页面，首先请确保 Arduino 有一个 IP\
    \ 地址，并且它可以连接到您的局域网。为此，请再次重复第 1 章“发现 Arduino 以太网扩展板”的说明。\n\n还请确保您在浏览器中正确输入了开发板的\
    \ IP 地址。您还可以检查串行监视器，确保您没有收到来自 DHT 传感器的任何错误消息，因为这会影响 Web 服务器的行为。\n"
