    # About the Author


    **Marco Schwartz** is an electrical engineer, entrepreneur, and blogger. He has
    a Master’s degree in Electrical Engineering and Computer Science from SUPELEC
    in France, and a Master’s degree in Microengineering from EPFL in Switzerland.


    He has more than 5 years of experience working in the domain of electrical engineering.
    His interests gravitate around electronics, home automation, the Arduino and the
    Raspberry Pi platforms, open source hardware projects, and 3D printing.


    He runs several websites around Arduino, including the Open Home Automation website
    (http://www.openhomeautomation.net/), which is dedicated to building home automation
    systems using open source hardware.


    He has written another book, Home Automation with Arduino, Amazon Digital Services,
    Inc., which is a self-published Kindle book. He has also written a book on how
    to build Internet of Things projects with Arduino called Internet of Things with
    the Arduino Yun, Packt Publishing.'
