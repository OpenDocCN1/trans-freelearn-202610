    \ You need to connect the VCC pin to Arduino 5 V, GND to Arduino GND, and finally\
    \ the signal pin to Arduino pin number 7, which is a digital pin. The following\
    \ image shows the system at this point:\n\n![](img/b454031c864977fe997c5feb0b3f9b63_102_0.png)\n\
    \nThen, you need to connect the power cables to the relay module. A relay module\
    \ basically has three output pins: COM (for the common pin), NC (for the normally\
    \ closed pin), and NO (for the normally open pin).\n\nWhat we want is to have\
    \ the COM pin of the relay connected to one wire of the power plug, NC not connected,\
    \ and NO connected to one other wire of the power plug. The following image summarizes\
    \ the connections at this stage:\n\n![](img/b454031c864977fe997c5feb0b3f9b63_103_0.png)\n\
    \nFirst, connect one pin of the female power plug to the **COM** pin. Then, connect\
    \ one pin of the male power plug to the **NO** pin. Finally, connect the two remaining\
    \ cables together, for example, using a typical electrical screw terminal.\n\n\
    Once this is done, you can connect the device you want to control the relay. Connect\
    \ the lamp inside the female power socket, and then connect the male power plug\
    \ to the power plug in the wall. The following image represents the system at\
    \ this point, without the device to control being connected:\n\n![](img/b454031c864977fe997c5feb0b3f9b63_103_1.png)\n\
    \nIf you have something similar, congratulations! You are done with the hardware\
    \ connections for this chapter.\n\n## Testing the relay\n\nWe are now going to\
    \ build a very simple sketch to test the hardware connections we just made. The\
    \ sketch will simply switch the relay on and off every second.\n\nThe sketch starts\
    \ by declaring the right pin for the relay:\n\n```\nconst int relay_pin = 7;\n\
    ```\n\nThen, we set this pin as an output:\n\n```\npinMode(relay_pin, OUTPUT);\n\
    ```\n\nThen, in the loop() function of the sketch, we set the relay to a HIGH\
    \ state:\n\n```\ndigitalWrite(relay_pin, HIGH);\n```\n\nWe wait for 5 seconds:\n\
    \n```\ndelay(5000);\n```\n\nThen, we switch the relay pin to a LOW state again:\n\
    \n```\ndigitalWrite(relay_pin, LOW);\n```\n\nWe then wait again for 5 seconds:\n\
    \n```\ndelay(5000);\n```\n\n### Note\n\nThe code for this section can be found\
    \ in the GitHub repository for this chapter at https://github.com/openhomeautomation/arduino-networking/tree/master/chapter4.\n\
    \nYou can now upload the code to the Arduino board. You should hear the relay\
    \ switching on and off every second. If you connect a lamp to the project, for\
    \ example, you should also see it switching on and off every second.\n\n## Controlling\
    \ the relay remotely\n\nNow, we are going to build our first interesting application\
    \ using the system we just assembled. We are going to build an Arduino sketch\
    \ to control the relay from anywhere within your local network. For example, if\
    \ your computer is connected via Wi-Fi to your router and the Ethernet shield\
    \ is connected to the same router, you will be able to control the relay via your\
    \ computer. The advantage of this approach in this section is that even if your\
    \ Internet connection is down, you will still be able to control the relay.\n\n\
    The application starts by including the correct libraries:\n\n```cpp\n#include\
    \ <SPI.h>\n#include <Ethernet.h>\n#include <aREST.h>\n```\n\nWe set up the MAC\
    \ address of the board:\n\n```cpp\nbyte mac[] = { 0x90, 0xA2, 0xDA, 0x0E, 0xFE,\
    \ 0x40 };\n```\n\nWe also define a default IP address for the board that will\
    \ be used if DHCP fails:\n\n```cpp\nIPAddress ip(192, 168, 1, 150);\n```\n\nWe\
    \ then create an instance of the aREST library, which will handle the request\
    \ that comes to the board:\n\n```cpp\naREST rest = aREST();\n```\n\nYou also need\
    \ to create an instance of the Ethernet server:\n\n```cpp\nEthernetServer server(80);\n\
    ```\n\nIn the setup() function of the sketch, we get an IP address using DHCP,\
    \ as shown in the following code snippet:\n\n```cpp\nif (Ethernet.begin(mac) ==\
    \ 0) {\n  Serial.println(\"Failed to configure Ethernet using DHCP\");\n  Ethernet.begin(mac,\
    \ ip);\n}\n```\n\nPrint the IP address on the Serial Monitor, using the following\
    \ code:\n\n```cpp\nserver.begin();\nSerial.print(\"Server is at \");\nSerial.println(Ethernet.localIP());\n\
    ```\n\nFinally, in the loop() function of the sketch, we check whether there are\
    \ incoming clients and handle these clients with the aREST instance:\n\n```cpp\n\
    EthernetClient client = server.available();\nrest.handle(client);\n```\n\n###\
    \ Note\n\nThe code for this section can be found in the GitHub repository for\
    \ this chapter at https://github.com/openhomeautomation/arduino-networking/tree/master/chapter4.\n"
  mdcn: "\n\n## 硬件和软件要求\n\n让我们先看看这个项目需要什么。与其他章节一样，你需要一块 Arduino 开发板和 Arduino Ethernet\
    \ 扩展板。\n\n你还需要一个继电器模块。我强烈建议使用集成在电路板上的继电器，电路板上包含所有必需的元件。这样可以避免你在面包板上自行搭建继电器模块，而且也更安全。事实上，以错误的方式布线继电器和其他元件没有任何风险。只需确保你选择的继电器兼容\
    \ 5 V 输入电压电平即可。此外，你还需要确保继电器模块能够处理本项目中将要使用的设备的功率。例如，我使用的是一盏 30 W 的灯，而继电器能够处理超过\
    \ 1000 W 的功率，只是为了保险起见。我选择了 Pololu 的 5 V 继电器模块，如图所示：\n\n![](img/b454031c864977fe997c5feb0b3f9b63_99_0.png)\n\
    \n你可以直接使用继电器，并使用我们将在本项目中开发的代码来控制它，但使用继电器的目的是将设备连接到它。对于本项目，我选择将灯连接到继电器，但按照本章的说明，你将能够连接任何使用标准电源插头的设备。\n\
    \n为此，我使用了一组电源线，一根带有母插座，另一根带有公插座，如下图所示：\n\n![](img/b454031c864977fe997c5feb0b3f9b63_100_0.png)\n\
    \n公插头将用于将继电器连接到墙上的主电源插头，而母插座将用于连接要控制的设备到继电器。\n\n### 注意\n\n将电线连接到主电源时，务必非常小心。确保不要触碰继电器的任何裸露部分，并且确保电缆本身没有裸露的铜线。另外，在组装项目时，最后再将插头连接到电源。\n\
    \n现在让我们来看看本项目的软件要求。像往常一样，你需要安装 Arduino IDE，并在计算机上运行一个 Web 服务器。\n\n在本章的第二部分，我们将使用一个名为\
    \ Teleduino 的服务来从任何地方控制 Ethernet 扩展板。要使用此服务，你需要获取一个 API 密钥，并将其插入 Arduino 草图中。\n\
    \n你可以通过访问以下地址获取密钥：\n\nhttps://www.teleduino.org/tools/request-key\n\n你将被带到以下页面，你可以在那里获取你的密钥：\n\
    \n### 请求密钥\n\n密钥用于唯一标识你的 Teleduino 设备。\n\n密钥将在几分钟内生成并发送到你的电子邮件。\n\n**你的隐私受到保护，你的电子邮件地址不会转发给第三方。**\n\
    \n请填写下面的表格以请求密钥。如果你需要为多个设备申请多个密钥，可以使用相同的电子邮件地址多次填写该表格。\n\n- 名：\n- 姓：\n- 电子邮件地址：\n\
    - 你是人类吗？（输入 \"yes\"）：\n- 我接受 Teleduino 服务条款\n- 提交请求\n\n你还需要为本章安装几个 Arduino 库。\n\
    \n你需要的第一个库是 Arduino 的 aREST 库，你可以在以下链接中找到它：\n\nhttps://github.com/marcoschwartz/aREST\n\
    \n最后，你还需要下载并安装 Teleduino 库，你可以在此处找到它：\n\nhttps://www.teleduino.org/downloads/\n\
    \n安装给定库，只需将文件夹解压到你的 Arduino/libraries 文件夹中（如果该文件夹不存在，则创建它）。\n\n## 硬件配置\n\n现在让我们看看如何连接项目的不同组件。与本书其他章节一样，你需要将\
    \ Ethernet 扩展板插入 Arduino 开发板。你还需要在 Ethernet 扩展板和路由器之间连接一根以太网电缆。\n\n然后，你需要连接继电器模块。继电器模块有三个输入引脚：VCC、GND\
    \ 和一个通常称为 SIG 的信号引脚。你需要将 VCC 引脚连接到 Arduino 5 V，GND 连接到 Arduino GND，最后将信号引脚连接到\
    \ Arduino 引脚 7（一个数字引脚）。下图显示了此时的系统：\n\n![](img/b454031c864977fe997c5feb0b3f9b63_102_0.png)\n\
    \n然后，你需要将电源线连接到继电器模块。继电器模块基本上有三个输出引脚：COM（公共引脚）、NC（常闭引脚）和 NO（常开引脚）。\n\n我们希望将继电器的\
    \ COM 引脚连接到电源插头的一根电线上，NC 不连接，NO 连接到电源插头的另一根电线。下图总结了此阶段的连接：\n\n![](img/b454031c864977fe997c5feb0b3f9b63_103_0.png)\n\
    \n首先，将母电源插头的一个引脚连接到 **COM** 引脚。然后，将公电源插头的一个引脚连接到 **NO** 引脚。最后，将剩余的两根电缆连接在一起，例如，使用典型的电气螺丝端子。\n\
    \n完成此操作后，你可以连接要控制继电器的设备。将灯连接到母电源插座中，然后将公电源插头连接到墙上的电源插头。下图表示此时的系统，未连接要控制的设备：\n\n\
    ![](img/b454031c864977fe997c5feb0b3f9b63_103_1.png)\n\n如果你的情况类似，恭喜！你已完成本章的硬件连接。\n\
    \n## 测试继电器\n\n我们现在将构建一个非常简单的草图来测试刚刚完成的硬件连接。该草图将简单地每秒切换继电器的开和关。\n\n```\nconst int\
    \ relay_pin = 7;\n```\n\n然后，我们将此引脚设置为输出：\n\n```\npinMode(relay_pin, OUTPUT);\n\
    ```\n\n然后，在草图的 loop() 函数中，我们将继电器设置为 HIGH 状态：\n\n```\ndigitalWrite(relay_pin, HIGH);\n\
    ```\n\n我们等待 5 秒：\n\n```\ndelay(5000);\n```\n\n然后，我们再次将继电器引脚切换到 LOW 状态：\n\n```\n\
    digitalWrite(relay_pin, LOW);\n```\n\n然后我们再次等待 5 秒：\n\n```\ndelay(5000);\n```\n\
    \n### 注意\n\n本节的代码可以在本章的 GitHub 仓库中找到：https://github.com/openhomeautomation/arduino-networking/tree/master/chapter4。\n\
    \n现在你可以将代码上传到 Arduino 开发板。你应该能听到继电器每秒切换一次开和关。例如，如果你将灯连接到项目，你也应该看到它每秒切换一次开和关。\n\
    \n## 远程控制继电器\n\n现在，我们将使用刚刚组装的系统构建第一个有趣的应用程序。我们将构建一个 Arduino 草图，以便从本地网络中的任何位置控制继电器。例如，如果你的计算机通过\
    \ Wi-Fi 连接到路由器，而 Ethernet 扩展板连接到同一个路由器，你将能够通过计算机控制继电器。本节这种方法的优势是，即使你的互联网连接中断，你仍然可以控制继电器。\n\
    \n```cpp\n#include <SPI.h>\n#include <Ethernet.h>\n#include <aREST.h>\n```\n\n\
    我们设置开发板的 MAC 地址：\n\n```cpp\nbyte mac[] = { 0x90, 0xA2, 0xDA, 0x0E, 0xFE, 0x40\
    \ };\n```\n\n我们还为开发板定义了一个默认 IP 地址，如果 DHCP 失败将使用该地址：\n\n```cpp\nIPAddress ip(192,\
    \ 168, 1, 150);\n```\n\n然后我们创建一个 aREST 库的实例，它将处理发送到开发板的请求：\n\n```cpp\naREST rest\
    \ = aREST();\n```\n\n你还需要创建一个以太网服务器实例：\n\n```cpp\nEthernetServer server(80);\n\
    ```\n\n在草图的 setup() 函数中，我们使用 DHCP 获取 IP 地址，如以下代码片段所示：\n\n```cpp\nif (Ethernet.begin(mac)\
    \ == 0) {\n  Serial.println(\"Failed to configure Ethernet using DHCP\");\n  Ethernet.begin(mac,\
    \ ip);\n}\n```\n\n使用以下代码在串行监视器上打印 IP 地址：\n\n```cpp\nserver.begin();\nSerial.print(\"\
    Server is at \");\nSerial.println(Ethernet.localIP());\n```\n\n最后，在草图的 loop()\
    \ 函数中，我们检查是否有传入客户端，并使用 aREST 实例处理这些客户端：\n\n```cpp\nEthernetClient client = server.available();\n\
    rest.handle(client);\n```\n\n### 注意\n\n本节的代码可以在本章的 GitHub 仓库中找到：https://github.com/openhomeautomation/arduino-networking/tree/master/chapter4。\n\
    \n"
