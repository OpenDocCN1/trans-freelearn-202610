    float t = dht.readTemperature();\n```\n\nConvert the measurements to strings using\
    \ the following code:\n\n```\nString temp = String((int) t);\nString hum = String((int)\
    \ h);\n```\n\nThen, we need to handle the connections that come to the Arduino\
    \ board, for example, from a web browser. To do so, we are actually going to create\
