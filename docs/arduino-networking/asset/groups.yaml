    \ A、B 和 C），然后单击工具栏中的 **插入图表** 按钮。系统将提示你选择要绘制的图表类型。我只是选择了折线图，将所有数据绘制在单个图表上。图表将类似于以下屏幕截图：\n\
    \n![](img/b454031c864977fe997c5feb0b3f9b63_156_0.png)\n\n由于一切都是动态的，你应该看到随着新测量值的输入，图表会实时更新。请注意，由于这是\
