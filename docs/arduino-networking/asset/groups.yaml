  - '[PAGE 113]


    # Controlling the relay from anywhere


    In the last section of this chapter, we are going to take another approach. So
    far, we have a server running on our Arduino board, which can receive commands
    from any device on your local network. However, this is not convenient if you
    want to control a device from anywhere in the world. For example, you want to
    activate a lamp in your home at given intervals when you are away from your home.


    To do so, we are going to use the Teleduino service, which allows you to do exactly
    that. The Arduino Ethernet shield will be constantly connected to this service,
    so you can transmit commands to the board from anywhere in the world if you have
    an Internet connection. We are going to build a new sketch for the Arduino board
    and then adapt the interface accordingly, so you can control the relay from anywhere
    in the world right from your web browser.


    You first need to include the required libraries:


    ```

    #include <EEPROM.h>

    #include <Servo.h>

    #include <Wire.h>

    #include <Teduino328.h>

    #include <SPI.h>

    #include <Ethernet.h>

    ```


    Then you need to define the MAC address of your Ethernet shield:


    ```

    byte mac[] = { 0x90, 0xA2, 0xDA, 0x0E, 0xFE, 0x40 };

    ```


    Then, define a lot of parameters for the Teleduino service. As we will use DHCP
    to get an IP address, you don''t need to change anything in the following code:


    ```

    IPAddress deviceIp(192, 168, 1, 100); // Only if useDhcp is false

    IPAddress gatewayIp(192, 168, 1, 1); // Only if useDhcp is false

    IPAddress dnsIp(192, 168, 1, 1); // Only if useDhcp is false

    IPAddress subnet(255, 255, 255, 0); // Only if useDhcp is false

    IPAddress serverIp(173, 230, 152, 173); // Only if useDns is false

    char serverName[] = "us01.proxy.teduino.org"; // Only if useDns is true

    unsigned int serverPort = 5353; // Can be set to either 53 or 5353

    byte statusLedPin = 8;

    ```


    We also need to enter the key that you got at the beginning of the chapter. However,
    you will need to convert this key to the correct format so that you can insert
    it inside the Arduino sketch.


    You can do so by visiting the following URL:


    https://www.teduino.org/tools/arduino-sketch-key


    You will be prompted to insert the key inside the new window, as shown in the
    following screenshot:'
  - "[PAGE 114]\n\n# Arduino Sketch Key\n\nThis tool is used for generating code that\
    \ can be copy/pasted into your Arduino sketch.\n\nEnter your valid key to generate\
    \ the code.\n\nYou can then copy and paste the result inside the Arduino sketch:\n\
    \n```\nbyte key[] = { 0x64, 0x26, 0xFF, 0xC9,\n                      0x20, 0x4D,\
    \ 0xF1, 0xCF,\n                      0xAE, 0x42, 0xD4, 0x1A,\n               \
    \       0xED, 0x6C, 0xB0, 0xB7 };\n\n```\n\nYou also need to define the following\
    \ variables so that the Teleduino service can work:\n\n```\nbyte data[257];\n\
    byte dataLength;\nbyte hexStage;\nunsigned long lastInstruction = 0;\nunsigned\
    \ long lastRefresh = 0;\nbyte stage = 0;\n\n```\n\nFinally, define an Ethernet\
    \ client:\n\n```\nEthernetClient Client;\n\n```\n\nThe rest of the sketch comes\
    \ from the Teleduino example and won't be detailed here.\n\n# Note\n\nThe code\
    \ for this section can be found in the GitHub repository for this chapter at https://github.com/openhomeautomation/arduino-networking/tree/master/chapter4.\n\
    \nIt's now time to make a first test of this sketch. Upload the sketch to your\
    \ Arduino board, and then go to your web browser. You can now directly send commands\
    \ to your board. First, we are going to set the relay pin as an output as seen\
    \ earlier. This is done using the following command (where you have to insert\
    \ your own key at the k parameter):\n\n```\nhttp://us01.proxy.teleduino.org/api/1.0/328.php?k=yourKey\n\
    &r=definePinMode&pin=7&mode=1\n\n```\n\nYou will be greeted by a confirmation\
    \ message inside your web browser. You can now switch the relay pin to a HIGH\
    \ state using the following command:\n\n```\nhttp://us01.proxy.teleduino.org/api/1.0/328.php?\n\
    k=yourKey&r=setDigitalOutput&pin=7&output=1\n\n```"
  md: "\nhttps://github.com/openhomeautomation/arduino-networking/tree/master/chapter4.\n\
    \nYou can now upload the code to the Arduino board and open the Serial Monitor.\
    \ You should see the IP address of the board being printed out:\n\n```\nServer\
    \ is at 192.168.1.103\n```\n\nYou can now go to your web browser and start typing\
    \ in commands. The aREST library allows you to directly command all the pins of\
    \ the Arduino board via Ethernet. You can find the complete documentation of the\
    \ library at https://github.com/marcoschwartz/aREST. For example, we first need\
    \ to set pin number 7 as an output. This is done using the following command:\n\
    \n```\nhttp://192.168.1.103/mode/7/o\n```\n\nYou will be greeted with the following\
    \ message in the browser:\n\n```\nPin D7 set to output\n```\n\nNow, to set the\
    \ pin to a HIGH state, you can simply type:\n\n```\nhttp://192.168.1.103/digital/7/1\n\
    ```\n\nYou will get the confirmation in your browser:\n\n```\nPin D7 set to 1\n\
    ```\n\nYou should also hear the relay switching from one state to the other when\
    \ you enter the command.\n\nNow we are going to build the server-side interface\
    \ to control the relay from your computer without having to enter commands manually\
    \ in your browser.\n\nThe interface is based on HTML, JavaScript, and PHP. In\
    \ the HTML file, there are basically two buttons: one to turn the relay on and\
    \ one to turn the relay off. The following is the code for one of the buttons:\n\
    \n```\n<button class=\"btn btn-block btn-lg btn-primary\" type=\"button\" id=\"\
    1\" onClick=\"buttonClick(this.id)\">On</button>\n```\n\nYou can see that the\
    \ button calls a function, which is defined in a JavaScript file. Now let's have\
    \ a look at this file. The first thing we have to do when the page loads is set\
    \ the relay pin to be an output, just as we did when we typed commands directly\
    \ in the browser. This is done using the following piece of code:\n\n```\nwindow.onload\
    \ = function() {\n  $.get( \"command.php\", {command: \"/mode/7/o\"} );\n}\n```\n\
    \nYou can see that we are calling a file named command.php. We will see the details\
    \ of this file later. Now, we saw earlier that every time a button is clicked,\
    \ it calls a function called buttonClick. The following function is also defined\
    \ in the JavaScript file:\n\n```\nfunction buttonClick(clicked_id){\n```\n\nDepending\
    \ on which button was clicked, we send the corresponding command to the Arduino\
    \ board. For example, for the **On** button, we put a HIGH state on the relay\
    \ pin, as shown in the following code:\n\n```\nif (clicked_id == \"1\"){\n   \
    \ $.get( \"command.php\", {command: \"/digital/7/1\"} );\n}\n```\n\nFinally, we\
    \ have to look at the PHP file that will actually send the command to the board.\
    \ We first need to get the command that was sent by the JavaScript file and store\
    \ it in a variable:\n\n```\n$command = $_GET['command'];\n```\n\nThen, we need\
    \ to set the URL to which we will send the command. To send the command to the\
    \ board, we will use a PHP module called curl, which will do exactly the same\
    \ as what we just did from the web browser.\n\nAt this point, you will have to\
    \ modify the IP address defined in the PHP file and replace it with the IP address\
    \ of your board. The following piece of code does just that:\n\n```\n$service_url\
    \ = 'http://192.168.1.103' . $command;\n$curl = curl_init($service_url);\n```\n\
    \nThen, we can actually perform the cURL call using the following piece of code:\n\
    \n```\ncurl_setopt($curl, CURLOPT_IPRESOLVE, CURL_IPRESOLVE_V4 );\ncurl_setopt($curl,\
    \ CURLOPT_CONNECTTIMEOUT, 0.5);\n$curl_response = curl_exec($curl);\ncurl_close($curl);\n\
    ```\n\n## Note\n\nThe code for this section can be found in the GitHub repository\
    \ for this chapter at [https://github.com/openhomeautomation/arduino-networking/tree/master/chapter4.](https://github.com/openhomeautomation/arduino-networking/tree/master/chapter4.)\n\
    \nWe can now test the interface. Make sure that all the files of this interface\
    \ are stored inside a folder at the root of your web server folder, and also make\
    \ sure that the web server is running. Then, go to this folder via the localhost\
    \ path in your browser and open the HTML file. You should see the following screenshot:\n\
    \n![](img/b454031c864977fe997c5feb0b3f9b63_110_0.png)\n\nTry to click on one of\
    \ the buttons: you should hear that the relay instantly switches according to\
    \ the button you clicked.\n\n## Note\n\nWhen you loaded the interface in your\
    \ browser, the relay pin was also automatically set to be an output.\n\n## Controlling\
    \ the relay from anywhere\n\nIn the last section of this chapter, we are going\
    \ to take another approach. So far, we have a server running on our Arduino board,\
    \ which can receive commands from any device on your local network. However, this\
    \ is not convenient if you want to control a device from anywhere in the world.\
    \ For example, you want to activate a lamp in your home at given intervals when\
    \ you are away from your home.\n\nTo do so, we are going to use the Teleduino\
    \ service, which allows you to do exactly that. The Arduino Ethernet shield will\
    \ be constantly connected to this service, so you can transmit commands to the\
    \ board from anywhere in the world if you have an Internet connection. We are\
    \ going to build a new sketch for the Arduino board and then adapt the interface\
    \ accordingly, so you can control the relay from anywhere in the world right from\
    \ your web browser.\n\nYou first need to include the required libraries:\n\n```\n\
    #include <EEPROM.h>\n#include <Servo.h>\n#include <Wire.h>\n#include <Teduino328.h>\n\
    #include <SPI.h>\n#include <Ethernet.h>\n```\n\nThen you need to define the MAC\
    \ address of your Ethernet shield:\n\n```\nbyte mac[] = { 0x90, 0xA2, 0xDA, 0x0E,\
    \ 0xFE, 0x40 };\n```\n\nThen, define a lot of parameters for the Teleduino service.\
    \ As we will use DHCP to get an IP address, you don't need to change anything\
    \ in the following code:\n\n```\nIPAddress deviceIp(192, 168, 1, 100); // Only\
    \ if useDhcp is false\nIPAddress gatewayIp(192, 168, 1, 1); // Only if useDhcp\
    \ is false\nIPAddress dnsIp(192, 168, 1, 1); // Only if useDhcp is false\nIPAddress\
    \ subnet(255, 255, 255, 0); // Only if useDhcp is false\nIPAddress serverIp(173,\
    \ 230, 152, 173); // Only if useDns is false\nchar serverName[] = \"us01.proxy.teduino.org\"\
    ; // Only if useDns is true\nunsigned int serverPort = 5353; // Can be set to\
    \ either 53 or 5353\nbyte statusLedPin = 8;\n```\n\nWe also need to enter the\
    \ key that you got at the beginning of the chapter. However, you will need to\
    \ convert this key to the correct format so that you can insert it inside the\
    \ Arduino sketch.\n\nYou can do so by visiting the following URL:\n\nhttps://www.teduino.org/tools/arduino-sketch-key\n\
    \nYou will be prompted to insert the key inside the new window, as shown in the\
    \ following screenshot:\n\n## Arduino Sketch Key\n\nThis tool is used for generating\
    \ code that can be copy/pasted into your Arduino sketch.\n\nEnter your valid key\
    \ to generate the code.\n\nYou can then copy and paste the result inside the Arduino\
    \ sketch:\n\n```\nbyte key[] = { 0x64, 0x26, 0xFF, 0xC9,\n                   \
    \   0x20, 0x4D, 0xF1, 0xCF,\n                      0xAE, 0x42, 0xD4, 0x1A,\n \
    \                     0xED, 0x6C, 0xB0, 0xB7 };\n\n```\n\nYou also need to define\
    \ the following variables so that the Teleduino service can work:\n\n```\nbyte\
    \ data[257];\nbyte dataLength;\nbyte hexStage;\nunsigned long lastInstruction\
    \ = 0;\nunsigned long lastRefresh = 0;\nbyte stage = 0;\n\n```\n\nFinally, define\
    \ an Ethernet client:\n\n```\nEthernetClient Client;\n\n```\n\nThe rest of the\
    \ sketch comes from the Teleduino example and won't be detailed here.\n\n## Note\n\
    \nThe code for this section can be found in the GitHub repository for this chapter\
    \ at https://github.com/openhomeautomation/arduino-networking/tree/master/chapter4.\n\
    \nIt's now time to make a first test of this sketch. Upload the sketch to your\
    \ Arduino board, and then go to your web browser. You can now directly send commands\
    \ to your board. First, we are going to set the relay pin as an output as seen\
    \ earlier. This is done using the following command (where you have to insert\
    \ your own key at the k parameter):\n\n```\nhttp://us01.proxy.teleduino.org/api/1.0/328.php?k=yourKey\n\
    &r=definePinMode&pin=7&mode=1\n\n```\n\nYou will be greeted by a confirmation\
    \ message inside your web browser. You can now switch the relay pin to a HIGH\
    \ state using the following command:\n\n```\nhttp://us01.proxy.teleduino.org/api/1.0/328.php?\n\
    k=yourKey&r=setDigitalOutput&pin=7&output=1\n\n```\n"
  mdcn: "\nhttps://github.com/openhomeautomation/arduino-networking/tree/master/chapter4.\n\
    \n现在可以将代码上传到 Arduino 开发板并打开串口监视器。你应该会看到开发板的 IP 地址被打印出来：\n\n```\nServer is at 192.168.1.103\n\
    ```\n\n现在可以打开 Web 浏览器并开始输入命令。aREST 库允许你通过以太网直接控制 Arduino 开发板的所有引脚。你可以在 https://github.com/marcoschwartz/aREST\
    \ 上找到该库的完整文档。例如，我们首先需要将 7 号引脚设置为输出。可以使用以下命令：\n\n```\nhttp://192.168.1.103/mode/7/o\n\
    ```\n\n浏览器中将出现以下消息：\n\n```\nPin D7 set to output\n```\n\n现在，要将引脚设置为 HIGH 状态，只需输入：\n\
    \n```\nhttp://192.168.1.103/digital/7/1\n```\n\n浏览器中将收到确认：\n\n```\nPin D7 set\
    \ to 1\n```\n\n输入命令时，你还应该能听到继电器在两种状态之间切换。\n\n现在，我们将构建服务器端界面，以便从计算机控制继电器，而无需在浏览器中手动输入命令。\n\
    \n该界面基于 HTML、JavaScript 和 PHP。在 HTML 文件中，基本上有两个按钮：一个用于打开继电器，一个用于关闭继电器。以下是其中一个按钮的代码：\n\
    \n```\n<button class=\"btn btn-block btn-lg btn-primary\" type=\"button\" id=\"\
    1\" onClick=\"buttonClick(this.id)\">On</button>\n```\n\n你可以看到该按钮调用了一个在 JavaScript\
    \ 文件中定义的函数。现在让我们来看看这个文件。页面加载时要做的第一件事是将继电器引脚设置为输出，这与我们在浏览器中直接输入命令时所做的一样。可以使用以下代码片段：\n\
    \n```\nwindow.onload = function() {\n  $.get( \"command.php\", {command: \"/mode/7/o\"\
    } );\n}\n```\n\n你可以看到我们正在调用一个名为 command.php 的文件。我们稍后会看到该文件的详细内容。之前我们看到，每次单击按钮时，都会调用一个名为\
    \ buttonClick 的函数。以下函数也定义在 JavaScript 文件中：\n\n```\nfunction buttonClick(clicked_id){\n\
    ```\n\n根据单击的是哪个按钮，我们将相应的命令发送到 Arduino 开发板。例如，对于 **开启** 按钮，我们将继电器引脚置为 HIGH 状态，如以下代码所示：\n\
    \n```\nif (clicked_id == \"1\"){\n    $.get( \"command.php\", {command: \"/digital/7/1\"\
    } );\n}\n```\n\n最后，我们需要查看实际将命令发送到开发板的 PHP 文件。首先需要获取 JavaScript 文件发送的命令并将其存储在变量中：\n\
    \n```\n$command = $_GET['command'];\n```\n\n然后，我们需要设置要发送命令的 URL。要向开发板发送命令，我们将使用名为\
    \ curl 的 PHP 模块，它将执行与我们刚才从网页浏览器中所做的完全相同的操作。\n\n此时，你需要修改 PHP 文件中定义的 IP 地址，并将其替换为开发板的\
    \ IP 地址。以下代码片段正是如此：\n\n```\n$service_url = 'http://192.168.1.103' . $command;\n\
    $curl = curl_init($service_url);\n```\n\n然后，我们可以使用以下代码片段实际执行 cURL 调用：\n\n```\n\
    curl_setopt($curl, CURLOPT_IPRESOLVE, CURL_IPRESOLVE_V4 );\ncurl_setopt($curl,\
    \ CURLOPT_CONNECTTIMEOUT, 0.5);\n$curl_response = curl_exec($curl);\ncurl_close($curl);\n\
    ```\n\n## 注意\n\n本节的代码可以在本章的 GitHub 仓库中找到，地址为 [https://github.com/openhomeautomation/arduino-networking/tree/master/chapter4.](https://github.com/openhomeautomation/arduino-networking/tree/master/chapter4.)\n\
    \n我们现在可以测试界面了。确保将此界面的所有文件都存储在 Web 服务器文件夹根目录下的一个文件夹中，并且确保 Web 服务器正在运行。然后，通过浏览器中的\
    \ localhost 路径访问该文件夹并打开 HTML 文件。你应该会看到以下截图：\n\n![](img/b454031c864977fe997c5feb0b3f9b63_110_0.png)\n\
    \n尝试单击其中一个按钮：你应该能听到继电器根据你单击的按钮立即切换。\n\n## 注意\n\n当你在浏览器中加载界面时，继电器引脚也会自动设置为输出。\n\
    \n## 从任何地方控制继电器\n\n在本章的最后一部分，我们将采用另一种方法。到目前为止，我们的 Arduino 开发板上运行着一个服务器，可以接收本地网络上任何设备的命令。但是，如果你想从世界上任何地方控制设备，这并不方便。例如，当你不在家时，你想在家中按固定间隔激活一盏灯。\n\
    \n为此，我们将使用 Teleduino 服务，它允许你做到这一点。Arduino 以太网扩展板将始终连接到此服务，因此如果你有 Internet 连接，可以从世界上任何地方向开发板传输命令。我们将为\
    \ Arduino 开发板构建一个新的草图，然后相应地调整界面，以便你可以直接从 Web 浏览器控制来自世界上任何地方的继电器。\n\n首先需要包含所需的库：\n\
    \n```\n#include <EEPROM.h>\n#include <Servo.h>\n#include <Wire.h>\n#include <Teduino328.h>\n\
    #include <SPI.h>\n#include <Ethernet.h>\n```\n\n然后需要定义以太网扩展板的 MAC 地址：\n\n```\n\
    byte mac[] = { 0x90, 0xA2, 0xDA, 0x0E, 0xFE, 0x40 };\n```\n\n然后，为 Teleduino 服务定义许多参数。由于我们将使用\
    \ DHCP 获取 IP 地址，因此不需要更改以下代码中的任何内容：\n\n```\nIPAddress deviceIp(192, 168, 1, 100);\
    \ // Only if useDhcp is false\nIPAddress gatewayIp(192, 168, 1, 1); // Only if\
    \ useDhcp is false\nIPAddress dnsIp(192, 168, 1, 1); // Only if useDhcp is false\n\
    IPAddress subnet(255, 255, 255, 0); // Only if useDhcp is false\nIPAddress serverIp(173,\
    \ 230, 152, 173); // Only if useDns is false\nchar serverName[] = \"us01.proxy.teduino.org\"\
    ; // Only if useDns is true\nunsigned int serverPort = 5353; // Can be set to\
    \ either 53 or 5353\nbyte statusLedPin = 8;\n```\n\n我们还需要输入你在本章开头获得的密钥。但是，你需要将此密钥转换为正确的格式，以便可以将其插入到\
    \ Arduino 草图中。\n\n你可以通过访问以下 URL 来完成此操作：\n\nhttps://www.teduino.org/tools/arduino-sketch-key\n\
    \n将提示你在新窗口中插入密钥，如以下截图所示：\n\n## Arduino 草图密钥\n\n此工具用于生成可以复制/粘贴到 Arduino 草图中的代码。\n\
    \n输入有效密钥以生成代码。\n\n然后可以将结果复制并粘贴到 Arduino 草图中：\n\n```\nbyte key[] = { 0x64, 0x26,\
    \ 0xFF, 0xC9,\n                      0x20, 0x4D, 0xF1, 0xCF,\n               \
    \       0xAE, 0x42, 0xD4, 0x1A,\n                      0xED, 0x6C, 0xB0, 0xB7\
    \ };\n\n```\n\n还需要定义以下变量，以便 Teleduino 服务可以工作：\n\n```\nbyte data[257];\nbyte dataLength;\n\
    byte hexStage;\nunsigned long lastInstruction = 0;\nunsigned long lastRefresh\
    \ = 0;\nbyte stage = 0;\n\n```\n\n最后，定义一个以太网客户端：\n\n```\nEthernetClient Client;\n\
    ```\n\n草图的其余部分来自 Teleduino 示例，此处不详细说明。\n\n## 注意\n\n本节的代码可以在本章的 GitHub 仓库中找到，网址为\
    \ https://github.com/openhomeautomation/arduino-networking/tree/master/chapter4。\n\
    \n现在是时候对这个草图进行首次测试了。将草图上传到 Arduino 开发板，然后打开 Web 浏览器。现在可以直接向开发板发送命令。首先，我们将像之前一样将继电器引脚设置为输出。可以使用以下命令（你需要在\
    \ k 参数中插入自己的密钥）：\n\n```\nhttp://us01.proxy.teleduino.org/api/1.0/328.php?k=yourKey\n\
    &r=definePinMode&pin=7&mode=1\n\n```\n\n浏览器中将显示一条确认消息。现在可以使用以下命令将继电器引脚切换到 HIGH\
    \ 状态：\n\n```\nhttp://us01.proxy.teleduino.org/api/1.0/328.php?\nk=yourKey&r=setDigitalOutput&pin=7&output=1\n\
    \n```\n"
