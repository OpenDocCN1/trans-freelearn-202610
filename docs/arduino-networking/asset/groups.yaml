    # About the Reviewers


    **Ryan Dunn** is a solutions architect, who specializes in web technologies and
    enterprise-level deployments. He currently lives in Southern Kansas City, KS.


    He holds a Bachelor''s degree in Computer Science from Kansas State University
    and a Master''s degree in Business Administration from the University of Kansas.
    He has worked for a variety of organizations, with his career spanning a number
    of industries, including e-commerce, digital marketing, SEO, education, security,
    and mobile.


    He has been working with web technologies for over 10 years, and during this time,
    he has always retained an agnostic approach to the technology, which has resulted
    in a wide range of experience. As a solutions architect, he manages every aspect
    of solution deployments, including analysis, network architecture, system architecture,
    creative design, and development.


    I have a wife, Crystal, and two children. As a result of their support, I have
    been able to pursue my passion for technology and am forever grateful for all
    their love.


    **Phillip Mayhew** has a Bachelor of Science degree in Computer Science from North
    Carolina State University. He is the founder and managing principal of Rextency
    Technologies LLC, which is based in Statesville, North Carolina. His primary expertise
    lies in software application performance testing and monitoring.


    **Tom O''Connor** is an experienced systems architect and DevOps engineer. He
    lives in the West Midlands in the United Kingdom. Over the last 8 years, he has
    worked for a wide variety of companies, from e-commerce to video effects, and
    now is the owner of the company he founded, which provides systems consultancy
    for wireless network design and installations.


    He writes a technical blog on his website that provides both tutorial articles
    and updates on what he''s been working on. He has wide-reaching skills and experience
    gathered over the last 10 years of working on Windows, Linux, and Unix systems
    for most of that time, coupled with recent experience in designing and building
    high-performance computer systems.


    He is also an active member of the UK DevOps community as well as a community
    moderator on www.serverfault.com, where he demonstrates his expertise and skills
    to a wide audience.


    **Krisjanis Rijnieks** is a digital interactive media professional working with
    projects that involve graphic design, animation, user interface design, projection
    mapping, programming, and electronics. The outcome of his projects usually are
    websites, games, and hardware prototypes or interactive installations. He also
    runs workshops in the field of creative coding and projection mapping. One of
    his most interesting current projects is the development of an openframeworks
    add-on for projection mapping on the Raspberry Pi—ofxPiMapper.


    He is also an MA student at the Media Lab Helsinki (Aalto University School of
    Arts,'
  - '[PAGE 17]


    Design and Architecture), and he is currently working on his master thesis, which
    is related to the ofxPiMapper projection mapping software project.


    Krisjanis runs a small digital media company CodeBark (www.codebark.com) with
    his colleague, Irina Spicaka. Together, they also developed a platform called
    Creative Coding for Live Audio and Visuals (www.cc4av.info), which acts as a placeholder
    for different events and workshops related to electronic audiovisual culture.


    He is also collaborating with the Fab Lab, Berlin, and this is where he spends
    most of his time when in Berlin.


    Cinder – Begin Creative Coding, Packt Publishing, is the first book that he has
    worked on. It’s an introduction to Cinder, the C++ creative coding framework,
    (similar to openFrameworks) and contains tutorials to get you started with Cinder
    as fast and painless as possible.'
