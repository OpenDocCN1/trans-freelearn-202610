    \ Arduino 板更加独立。在本章的第一部分，我们将使用 Ethernet 扩展板集成的 MicroSD 卡读卡器在本地记录数据。\n\n然后，我们将直接在\
    \ Arduino 板上创建一个服务器。板子将像往常一样测量数据，但服务器将为传入的客户端提供数据。最后，我们将使用我们在第 2 章“将数据发送到 Web\
    \ 服务器”中使用的代码的修改版本，在你的计算机上绘制测量数据。\n\n以下是本章的主要要点：\n\n- 首先，我们将构建此项目的硬件，包括温湿度传感器和用于记录测量数据的\
    \ SD 卡。\n- 然后，我们将创建项目的第一部分，并自动将数据记录到插在 Ethernet 扩展板内部的 SD 卡上。此时，我们将使用 Ethernet\
    \ 扩展板的 Internet 连接，从网络时间协议（NTP）时间服务器自动获取当前时间。\n- 最后，我们将构建一个 Web 服务器并在 Arduino\
    \ 板上运行它。然后，你只需在 Web 浏览器中输入板子的地址，即可访问板子测量的数据。我们还将修改上一章的代码，从 Arduino 板获取测量数据，并在浏览器中实时绘制它们。\n\
    \n"
