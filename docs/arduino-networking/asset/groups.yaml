    # # Chapter 6. Logging Data in Google Docs


    In this chapter, we are going to continue building Internet of Things applications
    using the Arduino Ethernet shield. This time, we are going to use the web service
    Temboo, to build some useful and interesting applications. Temboo is different
    from Xively, which we used in the previous chapter. It is not a cloud platform
    in itself, but it can be used to interface our Arduino projects with several other
    applications and services. You can see Temboo as a bridge between your Ethernet
    shield and a wide range of web services, such as e-mail services, text messaging
    services, or storage services.


    For example, in this chapter, we are going see how to interface your Arduino project
    to your Google Account via Temboo. We will use this functionality to automatically
    log measurements inside a Google Docs spreadsheet.


    The advantage of this solution is that you can access your Google Docs spreadsheet
    from anywhere, thus monitoring your data from anywhere in the world while your
    Ethernet shield is sending data from home. We are also going to send automated
    e-mail alerts using Gmail based on the measured data.


    The following will be the major takeaways of this chapter:


    +   - First, we are going to configure the hardware part of this project using
    the Ethernet shield and the DHT11 sensor. We are also going to download and install
    the required libraries for the project, including the Temboo Arduino library.

    +   - Then, we will set up the different accounts that we need for this chapter.
    First, we will set up your Google Account and create a spreadsheet where the data
    will be logged. We are also going to set up a Temboo account and configure it
    to use the Arduino Ethernet shield.

    +   - Once all the accounts are set, we are going to build the first application
    of this project —automatic log measured data in a Google Docs spreadsheet. You
    will be able to see the measured data recorded live in the spreadsheet and the
    data being plotted automatically in real time.

    +   - Finally, we are going to set up our Arduino system to automatically send
    e-mails when a given measurement exceeds a threshold.'
