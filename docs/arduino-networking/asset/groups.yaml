    \ sketch, we are going to specify where the Arduino Ethernet shield has to send\
    \ the data.\n\nFinding your IP address is easy, but it depends on your operating\
    \ system. If you are using OS X, you can find your IP address inside **Network\
    \ Preferences**.\n\n![](img/b454031c864977fe997c5feb0b3f9b63_59_0.png)\n\nIf you\
    \ are using Windows, you will find the information you need under the **Network\
    \ Settings** in your **Control Panel**:\n\n![](img/b454031c864977fe997c5feb0b3f9b63_59_1.png)\n\
    \nAnother way under Windows is to go to **Start**, then **Run**, and type cmd.\
    \ Then, inside the console, type ipconfig and hit Enter. Your computer’s IP address\
    \ will be displayed.\n\nIf you are using Linux or OS X, you can simply go to a\
    \ terminal and type:\n\n```\nifconfig\n```\n\nThis command should print your IP\
    \ address inside the terminal window. It will in general be something like eth0\
    \ or en0. This is what I had on my machine:\n\n```\nen0: flags=8863<UP,BROADCAST,SMART,RUNNING,SIMPLEX,MULTICAST>\
    \ mtu 1500\n    ether b8:f6:b1:12:c4:d7\n    inet6 fe80::baf6:b1ff:fe12:c4d7%en0\
    \ prefixlen 64 scopeid 0x4\n    inet 192.168.1.100 netmask 0xffffff00 broadcast\
    \ 192.168.1.255\n    nd6 options=1<PERFORMNUD>\n    media: autoselect\n    status:\
    \ active\n```\n\nSome Linux distributions made the move to another tool called\
    \ ip. To use it, simply go to a terminal and type:"
  - "[PAGE 60]\n\n# ip addr\n\nThis will also display your computer's IP address.\n\
    \nWe are now ready to build the Arduino sketch. First, we need to include the\
    \ required libraries:\n\n```\n#include <SPI.h>\n#include <Ethernet.h>\n#include\
    \ \"DHT.h\"\n```\n\nInsert the MAC address of your Ethernet shield, which you\
    \ can find on the back of the shield:\n\n```\nbyte mac[] = { 0x90, 0xA2, 0xDA,\
    \ 0x0E, 0xFE, 0x40 };\n```\n\nYou will also need to define the pin on which the\
    \ DHT sensor was connected, as well as the type of sensor you are using:\n\n```\n\
    #define DHTPIN 7\n#define DHTTYPE DHT11\n```\n\nNote that you do not need a sensor\
    \ connected to your Arduino board to test this project. You can simply send the\
    \ content of any variable as a test, or use the random() function of Arduino to\
    \ generate random data measurements.\n\nFirst, we will define a default IP address\
    \ for the Ethernet shield. The sketch should not use this address since we'll\
    \ attempt to connect using DHCP, but if DHCP fails, we need this default IP address.\
    \ I recommend using an address that is in the same IP domain as your computer\
    \ IP address:\n\n```\nIPAddress ip(192,168,1,50);\n```\n\nThen, we can define\
    \ the IP address of the server, which in this case is your computer. This is where\
    \ you need to enter the IP address you got before:\n\n```\nIPAddress server(192,168,1,100);\n\
    ```\n\nWe can then create an instance of the Ethernet client:\n\n```\nEthernetClient\
    \ client;\n```\n\nWe can also create an instance of the DHT library:\n\n```\n\
    DHT dht(DHTPIN, DHTTYPE);\n```\n\nNow in the setup() function of the sketch, we\
