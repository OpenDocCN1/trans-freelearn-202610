    我们现在要可视化使用 Xively 记录的数据。你可以再次访问 Xively 网站上的设备页面。你应该能看到不同通道中已记录了一些数据，如以下截图所示：


    | 通道 | 几秒前最后更新 | 图表 |

    |---|---|---|

    | 湿度 | 35 % | |

    | 温度 | 23 °C | |

    | + 添加通道 | | |


    点击其中任一通道，你也可以以图形方式显示数据。例如，以下截图显示了几次测量后的温度通道：


    ![](img/b454031c864977fe997c5feb0b3f9b63_135_0.png)


    过一段时间后，温度测量将有更多数据点，如以下截图所示：


    ![](img/b454031c864977fe997c5feb0b3f9b63_135_1.png)


    湿度测量亦可如此操作；以下截图显示了湿度测量：


    ![](img/b454031c864977fe997c5feb0b3f9b63_136_0.png)


    请注意，点击时间图标可以更改时间轴并显示更长或更短的时间范围。


    如果未看到任何数据显示，你需要返回 Arduino IDE，并确保来自 Xively 服务器的响应是一条 200 OK 消息，就像我们在上一节中看到的那样。


    ## 摘要


    让我们总结本章所做的工作。我们使用 Ethernet 扩展板搭建了一个物联网项目，因为我们将 Ethernet 扩展板直接连接到云服务。我们在 Arduino
    开发板上测量数据，并将数据发送到云服务 Xively，以便可以从任何位置访问和显示。


    该解决方案的优势在于，记录在 Xively 上的数据可以从任何位置访问，而不仅仅是你的本地网络。你还可以使用数据和 Xively 基于数据创建自动触发器。例如，你可以根据记录的数据向另一个网站发送请求。你还可以将设备记录的数据与同事或朋友共享，以便他们也能实时监控你的项目正在记录的内容。


    当然，该解决方案的缺点之一是，如果你的互联网连接中断，整个项目将完全无法工作。


    以下是本章的主要要点：


    - 我们首先搭建了该项目的硬件，包括 Ethernet 扩展板和 DHT11 传感器，用于测量温度和湿度。

    - 然后，我们访问了 Xively 网站并在那里创建了一个帐户。我们还在 Xively 界面上设置了一个设备，并创建了通道，以便数据可以记录在 Xively
    网站上。最后，我们还获取了 feed ID 和 API 密钥，以便 Arduino 草图知道将数据发送到哪里。

    - 然后，我们为该项目设计了 Arduino 草图。Arduino 草图负责测量数据，根据 Xively 指南对其进行格式化，并将其发送到 Xively。我们测试了该草图，并确保
    Xively 接受了数据。

    - 最后，我们再次访问 Xively 网站来可视化数据。我们学习了如何以图形方式可视化这些数据，并看到了数据实时到达。


    在下一章中，我们将继续构建物联网应用程序。我们将使用另一个名为 **Temboo** 的 web 服务，这是一个可以与 Gmail 或 Google Docs
    等其他服务对接的平台。我们将使用此服务直接在 Google Docs 电子表格上记录数据，并根据记录的数据发送自动电子邮件。


    ## 第 6 章 在 Google Docs 中记录数据


    在本章中，我们将继续使用 Arduino Ethernet 扩展板构建物联网应用程序。这一次，我们将使用名为 Temboo 的 web 服务来构建一些有用且有趣的应用程序。Temboo
    与我们在上一章中使用的 Xively 不同。它本身不是云平台，但可以用于将我们的 Arduino 项目与多个其他应用程序和服务对接。你可以将 Temboo
    视为 Ethernet 扩展板与广泛 web 服务之间的桥梁，例如电子邮件服务、短信服务或存储服务。


    例如，在本章中，我们将了解如何通过 Temboo 将你的 Arduino 项目与你的 Google 帐户对接。我们将使用此功能自动将测量数据记录到 Google
    Docs 电子表格中。


    该解决方案的优势在于，你可以从任何位置访问 Google Docs 电子表格，从而在世界任何地方监控数据，而你的 Ethernet 扩展板正在从家中发送数据。我们还将根据测量数据使用
    Gmail 发送自动电子邮件警报。


    以下是本章的主要要点：


    - 首先，我们将使用 Ethernet 扩展板和 DHT11 传感器配置该项目的硬件部分。我们还将下载并安装项目所需的库，包括 Temboo Arduino
    库。

    - 然后，我们将设置本章所需的不同帐户。首先，我们将设置你的 Google 帐户并创建一个用于记录数据的电子表格。我们还将设置一个 Temboo 帐户，并将其配置为使用
    Arduino Ethernet 扩展板。

    - 一旦所有帐户都设置完毕，我们将构建该项目的第一个应用程序——自动将测量数据记录到 Google Docs 电子表格中。你将能够在电子表格中实时查看记录的测量数据，并看到数据自动实时绘图。

    - 最后，我们将设置 Arduino 系统，以在给定测量值超过阈值时自动发送电子邮件。


    ## 硬件和软件要求


    在硬件方面，你当然需要 Arduino Ethernet 扩展板和一个 Arduino 开发板，例如 Arduino Uno。


    你还需要一个传感器来测量一些数据。由于本书讲的是如何使用 Ethernet 扩展板，而不是如何从传感器测量，你可以选择任何你喜欢的传感器。


    我使用了 DHT11 传感器，这是一种数字温度和湿度传感器。我为本章和书中许多章节选择了这个传感器，因为它非常便宜且易于与 Arduino 对接。除了 DHT11
    传感器，你还需要一个 4.7k 欧姆电阻。


    你还需要一个面包板和一些跳线，以在传感器和 Ethernet 扩展板之间创建连接。


    在软件方面，你首先需要的是用于对接你之前选择的传感器的库。由于我为本项目选择了 DHT11 传感器，你需要从 https://github.com/adafruit/DHT-sensor-library
    下载并安装 DHT 库才能使用它。


    你还需要从 https://www.temboo.com/arduino/others/library-installation 下载并安装 Arduino
    Temboo 库。


    要安装 Arduino 库，只需将下载文件的内容解压到主 Arduino 文件夹的库文件夹中（如果不存在，则创建该文件夹）。


    ## 硬件配置


    现在是时候为本项目设置硬件了。此时，如果你按照之前某一章的操作，你应该已经将 Arduino Ethernet 扩展板插到 Arduino 开发板上，有一根以太网线连接到
    Ethernet 扩展板，以及你的互联网路由器。如果还没有，请先这样做。


    在本项目中，你需要连接的唯一东西是 DHT11 传感器和电阻。你可以通过查看以下原理图来了解需要进行的不同连接：


    ![](img/b454031c864977fe997c5feb0b3f9b63_142_0.png)


    首先，将 DHT11 传感器插到面包板上。然后，使用 4.7k 欧姆电阻连接传感器的引脚 1 和 2。


    现在，我们将连接电源。将传感器的引脚 1 连接到 Arduino 5V，将引脚 4 连接到 Arduino GND。最后，将 DHT 传感器的引脚 2 连接到
    Arduino 引脚 7。


    最后，连接应该如以下截图所示：


