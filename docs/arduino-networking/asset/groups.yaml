  - '[PAGE 96]


    # Summary


    Let''s summarize what we did in this chapter. We created an independent measurement
    station with Arduino that automatically measures and serves the data in some way.
    First, we logged the data locally on a SD card and then we served this data using
    a web server running on the Arduino board.


    The following are the major takeaways of this chapter:


    +   1. First, we built the required hardware for this chapter, and inserted the
    SD card into the Ethernet shield.

    +   2. Then, in the first part of the project, we logged the measured data on
    the SD card and used a remote time server to automatically get the measurement
    times.

    +   3. Finally, we built a new Arduino sketch to have a web server running on
    the Arduino board. We then modified the plotting code from the previous chapter
    so it can call the server on the Arduino board to get and plot the measured data.


    There are, of course, many ways to improve this project. You can add more sensors
    to the project and either log this additional data on a SD card or serve it on
    a web page using the Arduino web server. You can also have many of these boards
    in your home or even outside and make your computer poll all these Arduino servers
    at a regular interval to get their measurements.


    In the next chapter, we are going to work again with this idea of creating an
    independent system with the Arduino Ethernet shield. We are going to connect a
    relay to the Arduino board, so you can switch a lamp on and off remotely. This
    project will come in two flavors. First, we will make a sketch to control the
    relay remotely via your web browser. In the second part of the chapter, we will
    use a special library so the relay can be controlled from anywhere in the world.'
  - '[PAGE 97]


    <!-- no content -->'
  - '[PAGE 98]


    # # Chapter 4. Controlling Objects from Anywhere


    In this chapter, we are going to do something different to what we did in the
    other chapters. What we did so far was measure some data on the Arduino board
    and transmit this data back to the network using the Ethernet shield. In this
    chapter, we are going to control a device instead of measuring data.


    To do so, we will use a relay connected to the Arduino board with the Ethernet
    shield and control this relay remotely. We are also going to connect a set of
    power cables to this relay so you can directly plug a lamp into it so that it
    can be controlled remotely.


    In the first part of the chapter, we are going to control this relay remotely
    within your local network. In the second part of the chapter, we will use a dedicated
    web service to control this relay from anywhere in the world.


    The following will be the major takeaways from this chapter:


    +   • First, we are going to see how to choose the different components for this
    project, including the relay and cables to connect a device to the relay such
    as a lamp.

    +   • Then, we will assemble the different hardware components, connect the relay
    to the Arduino board, and the power cables to the relay.

    +   • After that, we will write an Arduino sketch to test whether the relay is
    working correctly and has been correctly connected to the circuit.

    +   • When we are sure that the relay is working, we will write an application
    using the Ethernet shield along with the relay. We are going to write a sketch
    to control the relay via Ethernet and then build an interface to control the relay
    from your web server.

    +   • Finally, in the last section of the chapter, we are going to use a dedicated
    web service to control the relay from anywhere in the world. We are also going
    to adapt the interface we just created to control the relay from anywhere.'
