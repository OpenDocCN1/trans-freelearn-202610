    ![](img/b454031c864977fe997c5feb0b3f9b63_20_0.png)


    http://PacktLib.PacktPub.com


    你是否需要立即解决 IT 问题？PacktLib 是 Packt 的在线数字图书馆。在这里，你可以访问、阅读并搜索 Packt 的整个图书库。


    ### 为什么要订阅？


    - 可在 Packt 出版的每本书中全文搜索

    - 复制粘贴、打印和收藏内容

