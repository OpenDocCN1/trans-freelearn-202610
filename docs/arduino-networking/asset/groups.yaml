    \ 分钟可以记录一次测量值。在第一个付费计划中，你大约每 5 分钟可以记录一个数据点。在开发应用程序时，请牢记这些限制。\n\n现在让我们看看 runAppendRow()\
    \ 函数的详细信息。它首先声明我们要使用的 Choreo 类型。Choreo 是 Temboo 服务上库的等效项。例如，我们将声明我们要使用特定的库，将数据插入\
