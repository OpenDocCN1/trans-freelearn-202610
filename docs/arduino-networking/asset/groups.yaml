    # Creating your Xively account


    The first thing we have to do to use the Xively service is create and configure
    a Xively account. You need to create an account on Xively so that we can send
    data to their service. Xively is basically an online platform for connected objects
    such as our Ethernet shield. The service will automatically store the data that
    we send. It will also display the measured data in the form of graphs that are
    updated in real time as the data comes in.


    The very first step is to go over to the Xively signup page on their website at
    https://xively.com/signup/. You will arrive at a page where you can enter your
    personal details:


    ![](img/b454031c864977fe997c5feb0b3f9b63_124_0.png)


    Then, you will need to create a device, which is a virtual entity on the Xively
    website. This device will receive the measured data. When you create a new device,
    you will need to enter a name for your device:'
