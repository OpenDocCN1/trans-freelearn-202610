    \ and display this data on their website. This way, your data will be available\
    \ at any time and can be accessed from anywhere.\n\nThe following will be the\
    \ major takeaways from this chapter:\n\n- First, we are going to build the hardware\
    \ for this project around the Ethernet shield and the DHT11 temperature and humidity\
    \ sensor.\n- Then, we will create an account on the Xively website. We will also\
