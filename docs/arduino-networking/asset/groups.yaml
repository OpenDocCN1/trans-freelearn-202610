    \ account information such as the Xively API key to build the Arduino sketch for\
    \ this project.\n- Finally, we will upload the sketch to the Arduino board and\
    \ test it. We will check that the data is correctly sent to the Arduino board\
    \ and visualize the recorded data in real time in your browser.\n\n## Hardware\
    \ and software requirements\n\nOn the hardware side, you will of course need the\
