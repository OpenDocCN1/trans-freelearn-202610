    # # Sending automated e-mails


    In this last part of the chapter, we are going to build on what we already did,
    but change the application slightly. This time, we are going to use the Ethernet
    shield and Temboo to automatically send e-mails when a condition is reached. As
    an example, we will set a condition on the measured temperature. Whenever the
    temperature reaches a given value, we will send an e-mail to the address of your
    choice, for example, your professional e-mail to keep you updated when you are
    at work.


    It starts by going again to the Device Coder on the Temboo website at https://www.temboo.com/library/Library/Devices/Arduino/Others/.


    Click on **Generic sensor** and then on **Email**. This time you won’t have to
    enter that much information. Your Gmail account should already be set from the
    previous section and the Device Coder should automatically select your Ethernet
    shield.


    You simply need to enter the destination e-mail (for example, your professional
    e-mail address or the e-mail address from a family member) and the **Subject**
    field of the e-mail. Do not worry now about the value of the body of the e-mail;
    we will change it later:


    ![](img/b454031c864977fe997c5feb0b3f9b63_159_0.png)


    When it is finished, click on **Generate**. As for the previous section, you will
    be prompted to enter a name for this project so that Temboo knows where to send
    e-mails. I named mine arduinoTemperatureEmail, but if you decide to use another
    name, you will simply have to change one line in the code later.


    You can now download the generated code, which we will modify a bit. As for the
    previous section, we are going to modify the Arduino code, but it is important
    that you get your own TembooAccount.h file that contains the information relative
    to your own account on Temboo.


    The Arduino sketch is similar to the one in the previous section, so I will only
    discuss the main changes.


    In the loop() function of the sketch, you need to set the limit at which the e-mail
    will be sent by Temboo. For demonstration purposes, I will set the limit to 23,
    as shown in the following code:'
