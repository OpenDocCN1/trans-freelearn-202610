    components. We are also going to assemble the shield and the Arduino Uno board,
    and connect everything to our local network via a router.

    - Then, we will write the sketch that will connect your shield to your local network
    as well as the Web, and this sketch will grab a test page to make sure your connection
    is working correctly.

    - Finally, we are going to test this sketch and monitor the status of the Ethernet
    shield on the Arduino Serial Monitor. From this first test of the shield, we’ll
    be able to tell whether the shield is correctly connected to the Internet or not.


