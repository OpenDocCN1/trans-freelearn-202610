    \ 4.7k ohm resistor.\n\nYou will also need a breadboard and some jumper wires\
    \ to make the connections between the sensor and the Ethernet shield.\n\nOn the\
    \ software side, the first thing you will need is the library to interface with\
    \ the sensor you chose before. As I chose a DHT11 sensor for this project, you\
    \ will need to download and install the DHT library from https://github.com/adafruit/DHT-sensor-library.\n\
    \nTo install an Arduino library, simply unzip the contents of the downloaded file\
    \ into your libraries folder of your main Arduino folder (or create this folder\
    \ if it doesn't exist already).\n\n## Hardware configuration\n\nIt's now time\
    \ to set up the hardware for this project. At this point, if you followed one\
    \ of the previous chapters, you should already have your Arduino Ethernet shield\
    \ plugged into the Arduino board, one Ethernet cable connecting the Ethernet shield,\
    \ and your Internet router. If that's not the case already, please do so.\n\n\
    The only thing you will have to connect in this project is the DHT11 sensor and\
    \ the resistor. You can have an overview of the different connections you have\
    \ to make by looking at the following schematic diagram:\n\n![](img/b454031c864977fe997c5feb0b3f9b63_121_0.png)\n\
    \nFirst, plug the DHT11 sensor to the breadboard. Then, connect pin numbers 1\
    \ and 2 of the sensor using the 4.7k ohm resistor.\n\nNow comes the power supply.\
    \ Connect the pin number 1 of the sensor to the Arduino 5 V and the pin number\
