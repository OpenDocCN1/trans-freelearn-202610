  - "[PAGE 108]\n\n# # Controlling the relay remotely\n\nNow, we are going to build\
    \ our first interesting application using the system we just assembled. We are\
    \ going to build an Arduino sketch to control the relay from anywhere within your\
    \ local network. For example, if your computer is connected via Wi-Fi to your\
    \ router and the Ethernet shield is connected to the same router, you will be\
    \ able to control the relay via your computer. The advantage of this approach\
    \ in this section is that even if your Internet connection is down, you will still\
    \ be able to control the relay.\n\nThe application starts by including the correct\
    \ libraries:\n\n```\n```cpp\n#include <SPI.h>\n#include <Ethernet.h>\n#include\
    \ <aREST.h>\n```\n```\n\nWe set up the MAC address of the board:\n\n```\n```cpp\n\
    byte mac[] = { 0x90, 0xA2, 0xDA, 0x0E, 0xFE, 0x40 };\n```\n```\n\nWe also define\
    \ a default IP address for the board that will be used if DHCP fails:\n\n```\n\
    ```cpp\nIPAddress ip(192, 168, 1, 150);\n```\n```\n\nWe then create an instance\
    \ of the aREST library, which will handle the request that comes to the board:\n\
    \n```\n```cpp\naREST rest = aREST();\n```\n```\n\nYou also need to create an instance\
    \ of the Ethernet server:\n\n```\n```cpp\nEthernetServer server(80);\n```\n```\n\
    \nIn the setup() function of the sketch, we get an IP address using DHCP, as shown\
    \ in the following code snippet:\n\n```\n```cpp\nif (Ethernet.begin(mac) == 0)\
    \ {\n  Serial.println(\"Failed to configure Ethernet using DHCP\");\n  Ethernet.begin(mac,\
    \ ip);\n}\n```\n```\n\nPrint the IP address on the Serial Monitor, using the following\
    \ code:\n\n```\n```cpp\nserver.begin();\nSerial.print(\"Server is at \");\nSerial.println(Ethernet.localIP());\n\
    ```\n```\n\nFinally, in the loop() function of the sketch, we check whether there\
    \ are incoming clients and handle these clients with the aREST instance:\n\n```\n\
    ```cpp\nEthernetClient client = server.available();\nrest.handle(client);\n```\n\
    ```\n\n# ## Note\n\nThe code for this section can be found in the GitHub repository\
    \ for this chapter at"
