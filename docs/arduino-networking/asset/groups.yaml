    \ world and have your Ethernet shield in another part of the world and it would\
    \ still work.\n\n## Summary\n\nIn this chapter, we interfaced a relay to the Arduino\
    \ board and the Ethernet shield so that it can be controlled remotely. To do so,\
    \ we used two different approaches, each with their own advantages and disadvantages.\
    \ First, we kept things local and controlled the relay from within your local\
    \ network. This solution has the advantage that even if your Internet connection\
    \ is down, the project still works.\n\nThen, we used a dedicated web service to\
