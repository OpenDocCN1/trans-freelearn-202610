    \ the Arduino pin number 7.\n\nAt the end, it should look like the following image:\n\
    \n![](img/b454031c864977fe997c5feb0b3f9b63_122_0.png)\n\nYou are now done with\
    \ the hardware configuration of this project and can move to the next step, which\
    \ is creating an account on Xively.\n"
  mdcn: "\n\n这样一来，你应该能听到继电器的咔嗒声，表示命令已正确发送。你还会在浏览器中看到一条确认消息。\n\n现在，我们将修改界面，以便你可以使用\
    \ Web 浏览器从任何地方控制继电器。在 JavaScript 文件中，你需要定义你的 Teleduino API 密钥：\n\n```javascript\n\
    var key = \"yourAPIKey\";\n```\n\n然后，我们需要修改命令参数以符合 Teleduino API，并同时提及密钥，如以下代码所示：\n\
    \n```javascript\nwindow.onload = function() {\n  $.get( \"command.php\", {\n \
    \   key: key, command: \"definePinMode&pin=7&mode=1\"} );\n}\n```\n\n另外，我们还需要为按钮点击时调用的函数修改命令参数并提及密钥：\n\
    \n```javascript\nif (clicked_id == \"1\"){\n  $.get( \"command.php\", {\n    key:\
    \ key, command: \"setDigitalOutput&pin=7&output=1\"} );\n}\n```\n\n在 PHP 文件中，我们现在需要获取两个参数，即来自\
    \ Teleduino 的命令和 API 密钥：\n\n```php\n$key = $_GET['key'];\n$command = $_GET['command'];\n\
    ```\n\n我们还需要修改服务 URL，如以下代码所示：\n\n```php\n$service_url = 'http://us01.proxy.teleduino.org/api/1.0/328.php?k='\
    \ . $key . '&r=' . $command;\n$curl = curl_init($service_url);\n```\n\n其余文件与上一节中所示完全相同。\n\
    \n## 注意\n\n本节的代码可以在本章的 GitHub 仓库中找到，网址为 https://github.com/openhomeautomation/arduino-networking/tree/master/chapter4。\n\
    \n你现在可以将此修改后界面的所有文件放在 Web 服务器根目录下的一个文件夹中。同时，请确保 Web 服务器仍在运行。你可以打开 HTML 文件，应该会看到与之前完全相同的界面。\n\
    \n你现在可以尝试点击按钮，应该会立即听到继电器切换的声音。相对于本章上一节的优势在于，此界面现在可以从任何地方工作。你可以身处世界的一部分，而你的以太网扩展板在世界的另一部分，它仍然可以工作。\n\
    \n## 摘要\n\n在本章中，我们将继电器与 Arduino 板和以太网扩展板连接起来，以便远程控制。为此，我们采用了两种不同的方法，各有优缺点。首先，我们保持本地化，并从本地网络内控制继电器。此解决方案的优点在于，即使你的互联网连接中断，项目仍可正常工作。\n\
    \n然后，我们使用专用 Web 服务从任何地方控制继电器。这显然是后一种方法的优势；但是，如果你的以太网扩展板未连接到互联网，则无法工作。\n\n本章的主要收获如下：\n\
    \n- 首先，我们为项目选择了不同的组件，并将它们组装起来，以便可以从 Arduino 板控制设备（例如台灯）。\n- 然后，我们编写了第一个草图来测试项目，只需简单地打开和关闭继电器。\n\
    - 随后，我们基于刚刚组装好的硬件构建了第一个应用程序。我们使用了一个专用库，以便 Arduino 板能够通过以太网扩展板从网络接收命令。我们还构建了一个简单的基于\
    \ Web 的界面，以便你可以从在计算机上运行的图形界面控制继电器。\n- 最后，我们使用名为 Teleduino 的 Web 服务从世界任何地方控制继电器。我们还修改了图形界面，以便可以从任何地方控制继电器。\n\
    \n在下一章中，我们将采用另一种方法，使用以太网扩展板将 Arduino 项目连接到物联网。我们将在 Arduino 板上进行一些测量，并将这些数据直接发送到云服务。使用此服务，我们将能够实时监控来自板子的测量数据，无论身在世界哪个地方。\n\
    \n## 第 5 章。使用 Xively 实现物联网\n\n在本书的前几章中，当使用以太网扩展板在 Arduino 板上进行测量时，我们主要保持本地化。例如，我们将一些测量数据发送回计算机上的数据库，并在那里显示测量结果。\n\
    \n在本章中，我们将采取不同的方法。我们将把以太网扩展板集成到物联网视角中。这意味着，我们将不再在本地网络内本地记录测量数据，而是自动将测量数据发送到名为\
    \ Xively 的云服务。Xively 网站的目的是存储来自你设备的数据，并在其网站上显示这些数据。这样，你的数据将随时可用，并可以从任何地方访问。\n\n\
    本章的主要收获如下：\n\n- 首先，我们将围绕以太网扩展板和 DHT11 温湿度传感器构建本项目的硬件。\n- 然后，我们将在 Xively 网站上创建一个帐户。我们还将配置此帐户，以便可以使用\
    \ Arduino 以太网扩展板将测量数据发送到该帐户。\n- 当帐户正确设置后，我们将使用帐户信息（例如 Xively API 密钥）来构建本项目的 Arduino\
    \ 草图。\n- 最后，我们将草图上传到 Arduino 板并进行测试。我们将检查数据是否已正确发送到 Arduino 板，并在浏览器中实时可视化记录的数据。\n\
    \n## 硬件和软件要求\n\n在硬件方面，你当然需要 Arduino 以太网扩展板和一个 Arduino 板（例如 Arduino Uno）。\n\n你还需要一个传感器来测量一些数据。由于本书主要介绍如何使用以太网扩展板，而非如何从传感器进行测量，你可以选择任何传感器。\n\
    \n我选择了 DHT11 传感器，这是一种数字温湿度传感器。我选择这个传感器是因为它非常便宜且易于与 Arduino 连接。除了 DHT11 传感器外，你还需要一个\
    \ 4.7k 欧姆电阻。\n\n你还需要一个面包板和一些跳线，以便在传感器和以太网扩展板之间建立连接。\n\n在软件方面，你首先需要的是用于与之前选择的传感器进行连接的库。由于我为本项目选择了\
    \ DHT11 传感器，你需要从 https://github.com/adafruit/DHT-sensor-library 下载并安装 DHT 库。\n\
    \n要安装 Arduino 库，只需将下载文件的内容解压到主 Arduino 文件夹的 libraries 文件夹中（如果该文件夹不存在，则创建它）。\n\n\
    ## 硬件配置\n\n现在是时候为本项目设置硬件了。到此为止，如果你遵循了前面的某一章，你应该已经将 Arduino 以太网扩展板插入 Arduino 板，并用一根以太网线将以太网扩展板连接到互联网路由器。如果还没有，请务必这样做。\n\
    \n在本项目中，你需要连接的唯一东西是 DHT11 传感器和电阻。你可以通过查看以下示意图来了解需要建立的不同连接的概览：\n\n![](img/b454031c864977fe997c5feb0b3f9b63_121_0.png)\n\
    \n首先，将 DHT11 传感器插入面包板。然后，使用 4.7k 欧姆电阻连接传感器的引脚 1 和 2。\n\n接下来是电源供应。将传感器的引脚 1 连接到\
    \ Arduino 5 V，将引脚 4 连接到 Arduino GND。最后，将 DHT 传感器的引脚 2 连接到 Arduino 引脚 7。\n\n最终，它应该看起来如下图所示：\n\
    \n![](img/b454031c864977fe997c5feb0b3f9b63_122_0.png)\n\n你现在已完成本项目的硬件配置，可以进入下一步，即在\
    \ Xively 上创建帐户。\n\n"
