- pgno: 119
  md: '# Risk Management, Controls, and Policies


    One of the most important things to sort out, aside from preparing all the documentation
    needed and confirming support from management, is to have a list of all the entity''s
    assets. In this chapter, we will be covering risk management, data classification,
    and the controls defined within ISO 27001.


    An asset is a resource having economic worth that a person, business, or nation
    owns or manages with the idea that it will produce future benefits. The balance
    sheet of a firm lists its assets. They are acquired or established to raise the
    value of a company or to boost its operations. In our context, an asset is defined
    as any goods or services, tangible or intangible, that are considered part of
    an entity.


    So a firewall, for instance, is an asset; a pen is an asset; but also the documents
    on the local or online repository of the company are considered to be an asset,
    as well as that server that they were supposed to dismiss five years ago, but
    for some reasons as unknown as the Bermuda triangle, is still there.


    Why in the world is a document (MS Word, Excel, PowerPoint, you name it) considered
    an asset? Well, of course it''s not due to the document(s) themselves, but because
    of what those documents are worth: let''s suppose that you are the King of Reign1
    and your plans for invading Reign2 and therefore becoming Emperor of the Galaxy
    are in your safe waiting to be used – how much are they worth? Or let''s suppose
    that you''ve got 50 kilos of bearer shares? What is their value? Or all the notebooks
    that you used while at primary school, how much are they worth, according to your
    parents?


    You got the point: if the shape of water depends on the container that encloses
    it, the value of a document does not depend on the physical document but on the
    information it contains.


    In this chapter, we will cover the following topics:


    +   - Elements of project risk management

    +   - Data classification

    +   - ISO 27001 controls'
  merge: -1
  img_proc: true
- pgno: 120
  md: '# Elements of project risk management


    Project risk management is an essential project management strategy that aims
    to minimize the number of surprises that occur during a project''s execution.
    Despite the fact that it is impossible to forecast the future with absolute certainty,
    a straightforward and simplified risk management method may be used to anticipate
    uncertainties and reduce their occurrence or effect. This raises the probability
    that the project will be completed successfully and decreases the implications
    of these risks.


    The basic processes for project risk management are therefore the following:


    +   - **Risk identification**, or the identification of risks or their sources.

    +   - **Risk evaluation**, or the evaluation of risks in terms of probability
    and impact to establish an order of priority among the identified risks.

    +   - **Risk handling**, which is the process that identifies, evaluates, selects,
    and implements various remediations in order to obtain an acceptable risk threshold
    in compliance with the constraints and objectives of the project. In particular,
    it includes what must be done, when, who is responsible for it, and the related
    cost and schedule.

    +   - **Risk controlling**, meaning the continuous reporting and monitoring of
    both risks and their management mechanisms.


    Risk reporting in particular has a dual purpose: in the immediate term, it enhances
    communication within the project, and in the long term, it generates historical
    precedents that may be utilized to produce more accurate risk forecasts in future
    projects.


    # The risk management plan


    During my career, also as a risk manager, I learned some fundamentals of risk
    management:


    > *Risk management is uninteresting to 99 percent of the population of the globe.
    They see no value in it.*


    I developed a risk register strategy that was as straightforward as I deemed it
    needed to be in order to assist conversations and decision-making. It worked well,
    and after a few years as a general risk manager, I transitioned into the information
    security field, carrying the strategy with me to the current day.


    # Fundamental notions


    *A few broad views on risk management*


    Risk management is a management method that helps your organization accomplish
    its goals by concentrating on helping you understand some of the undesirable events
    that might prevent you from reaching your goals. It then assists you in deciding
    what you might do to handle these negative events, and perhaps prevent them from
    occurring. It is a managerial approach designed to aid in decision-making; if
    it is not aiding in decision-making, then it is a waste of time. Risk management
    is a subpar'
  merge: -1
  img_proc: true
- pgno: 121
  md: 'method for managing hazards, but it is the best method available, and like
    other management method, it sometimes works and sometimes does not. Again, like
    any management strategy, it requires some talent to be effective, and the more
    you practice, the better you get at it. Like the finest management strategies,
    it is fundamentally straightforward.


    # Risk evaluation


    To select the most effective risk reduction approach, it is necessary to analyze
    risks. There are three stages involved:


    +   - **Identification**: Identifying and defining the kinds of risks your firm
    confronts is the first step. Both internal and external threats exist. Consider
    also whether the risks are avoidable, such as operational risks, or not, such
    as natural calamities, when recognizing them.

    +   - **Impact assessment**: Once a risk has been identified, its effect may be
    assessed. This entails defining the likelihood of a risk''s occurrence and its
    corresponding effect or outcome.

    +   - **Develop strategies**: Finally, you may establish the required approach
    for risks with a medium or high likelihood of occurring. Despite the fact that
    you may still choose to monitor minor risks, they are less important when it comes
    to taking the next step and developing a strategy.


    # Risk characteristics


    These are the 10 characteristics that each risk should be ascribed:


    +   - **Risk ID** of some form, e.g., R0417. This can be anything that allows
    you to individually distinguish each risk.

    +   - **Risk description**: What is *the undesirable event that might lead to
    the loss of confidentiality, availability, or integrity of information under your
    scope*? You should strive for clarity on the business repercussions of this negative
    event and its source or causes.

    +   - **Risk owner**: There must be a designated risk owner. This individual must
    be able to make risk-related choices and is often a senior member of staff. Who
    will have to deal with the consequences if this unfortunate event occurs? What
    is sometimes advantageous is having a *delegated risk manager* who reports to
    the risk owner but can handle the risk on a continuing basis. Nonetheless, it
    is essential that the risk owner possess some degree of comprehension of and responsibility
    for the risk. It is uncommon for certification auditors, in my experience, to
    speak with risk owners to inquire about their awareness of the risks and the decisions
    they have made. But they must!

    +   - **Existing essential controls**: What do you currently have in place that
    aids your risk management? You don''t need to mention every control already in
    place to manage the risk, since the standard just asks you to describe the essential
    measures. Try to keep the number of items on this list modest. If there are controls
    that you believe should be in place but are not, you should explain them in your
    risk improvement actions.'
  merge: -1
  img_proc: true
- pgno: 122
  md: "+   - **Current likelihood:** How probable is it that something will occur\
    \ during the next 12 months? People use many scales, but I propose a range from\
    \ 1 (low) to 5 (high). I propose basing this probability assessment on your current\
    \ awareness of how effectively the controls are working to manage the risk today\
    \ – i.e., how effective they are today in light of any presently known deficiencies\
    \ in the controls.\n+   - **Current effects:** What is the single-number business\
    \ effect of the loss of confidentiality, availability, and integrity of the impacted\
    \ information? Typically, this is a single number from 1 (low) to 5 (high). Some\
    \ individuals like to use three different numbers/evaluations – one for each of\
    \ confidentiality, availability, and integrity – but to keep things simple, I\
    \ suggest using a single value. The criterion does not require three separate\
    \ evaluations. As with the probability, this should account for any information\
    \ on the present efficacy and known current flaws of the controls managing the\
    \ risk.\n+   - **Current risk rating:** There are more intricate approaches but\
    \ multiplying the numbers for probability and effect will suffice. This is also\
    \ referred to as the level of risk, i.e., a value from 1 to 25.\n+   - **Current\
    \ risk assessment:** This indicates whether or not this risk is within your risk\
    \ appetite, however that is defined. Typically, this is determined by the risk\
    \ score. For example, *All hazards with a score over 12 exceed the risk appetite.*\
    \ People often have two breaking points: one for risks that are far outside their\
    \ risk appetite (e.g., with a score above 20) and one for risks that are above\
    \ the risk appetite but not quite as far – e.g., between 12 and 21. This is represented\
    \ by the colors red, amber, and green.\n+   \n+     *(Optional) Should you be\
    \ pleased with this result?* Yes, if the current risk score is within the risk\
    \ tolerance. Otherwise, the answer is no. This characteristic is optional, however\
    \ it may facilitate thought.\n+   - **Risk treatment determination:** If the risk\
    \ is acceptable, *Accept* should be selected. This means we are satisfied with\
    \ this risk and no more action is required. Depending on your risk assessment\
    \ methodology and risk acceptance criteria, *Accept* might be selected if the\
    \ risk exceeds your risk tolerance. Nonetheless, if it exceeds risk tolerance,\
    \ the most probable response is *Treat*, i.e., take action. You might alternatively\
    \ select *Avoid* or *Transfer* as the risk treatment choice, but these options\
    \ are unlikely to be utilized much, if ever.\n+   - **Risk improvement activities:**\
    \ If you have selected the *Treat* option, you will add one or more new controls\
    \ or enhance existing controls in the majority of situations. The expectation\
    \ is that, after these steps have been implemented, they will have some influence\
    \ on the probability or impact, which will ideally be sufficient to bring the\
    \ risk below the established risk tolerance. Each activity should have a designated\
    \ owner and a deadline for completion.\n\nHopefully, this was clear enough to\
    \ let you understand the list of characteristics that a risk should have. Next\
    \ stop, heatmaps."
