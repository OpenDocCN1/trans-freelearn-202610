    in the Information Classification Policy.


    7 – Personally Identifiable Information (PII) may only be used in compliance with
    information protected by federal, state, or local laws and regulations or industry
    standards, such as the GDPR, HIPAA, HITECH, FERPA, PIPEDA, and PCI-DSS.'
  merge: -1
  img_proc: true
- pgno: 160
  md: '# 7. **DATA AVAILABILITY AND RECORDS RETENTION:**


    8.1 – Ensure that all academic, administrative, or research-related data is retained
    according to the records retention and EU-GDPR requirements.


    8.2 – Back up data regularly to ensure that records are available when needed,
    as many providers assume no responsibility for the data recovery of content (for
    further information, please consult the ACME Business Continuity and Disaster
    Recovery Policy).


    # 8. **ROLES AND RESPONSIBILITIES:**


    9.1 – Security and data security will be in charge of the operations, with support
    from the legal and ERP departments.


    # 9. **OTHER APPLICABLE POLICIES:**


    +   - P001: Information Security Policy

    +   - P002: Permanent change of where equipment is located within the ACME office

    +   - P003: Sale and disposition of equipment

    +   - P004: Equipment donations and transfers to other entities (e.g., charities)

    +   - P005: Equipment deletion from ACME assets

    +   - P006: ACME **Acceptable Use Policy (AUP)**


    These are just examples: you can customize them according to your needs, find
    other templates and samples through the internet, and still buy some decent packages
    at a decent price online. Of course, my suggestion, as usual, is to involve a
    third-party consultancy to do the job, and then you can update them on your own.


    # Company procedures


    Would you wish to undergo a complex process to get an additional pen or pad of
    paper? Of course not!


    Procedures and their near relatives, policies, may be a genuine pain in the you-know-what.
    Sometimes, they are excessively stringent and limiting, while other times they
    are too general and missing specifics. However, if a colleague calls in ill and
    you are suddenly responsible in case of an emergency, you should substitute that
    sick colleague just by reading and understanding a procedure. Therefore, it is
    helpful to have a well-written, clear protocol to follow.


    Procedures may have a significant impact on an organization if executed properly.
    When stated clearly and correctly, they may improve the functionality of systems
    and individuals. If your employees know what to do, when to do it, how to do it,
    and how to avoid making mistakes, you may decrease aggravation and save a great
    deal of time and energy.'
  merge: -1
  img_proc: true
- pgno: 161
  md: "Procedures are the company’s workhorses. Procedures detail “how to” complete\
    \ a job or process, while policies outline how individuals should make choices.\n\
    \nProcedures emphasize action. They describe the actions to be performed and the\
    \ sequence in which they must be taken. They are often instructive and may be\
    \ used in training and orientation. Typically, well-written processes are solid,\
    \ accurate, truthful, brief, and direct.\n\nWriting an accurate, concise, and\
    \ understandable method is not always simple. However, with a little bit of information\
    \ and experience, you may develop good procedure-writing abilities and recognize\
    \ many possibilities to enhance the quality of your work.\n\n> **Tip**\n> \n>\
    \ Numerous procedures seem *black and white*, with distinct phases and a single\
    \ method: “Complete A, then B, and then C.” Occasionally, though, it is necessary\
    \ to be less precise and allow for individual discretion. When a method is too\
    \ restrictive, it might lead to misunderstanding. Since life is not always straightforward\
    \ and uncomplicated, some methods must allow for subjectivity and individual choice.\n\
    \n# When is a procedure necessary?\n\nIf you design processes for fundamental\
    \ jobs, they will be disregarded since they are unnecessary. The first guideline\
    \ of creating procedures is to ensure that they serve a purpose: perhaps individuals\
    \ forget to complete particular activities, perhaps they continue to make mistakes,\
    \ or perhaps jobs are so lengthy and complicated that a checklist is required\
    \ for success.\n\nA documented procedure is only required if the problem is severe\
    \ or if there is a substantial advantage to clarifying a method. Before you begin,\
    \ consider whether people really need or want to know something.\n\n# When a process\
    \ requires a procedure\n\nTo a certain extent, a process works on its own. But\
    \ then, your company needs to write it, to put it clear:\n\n+   - Is extensive\
    \ (for example, a year-end inventory)\n+   - Is complicated (for example, benefits\
    \ administration)\n+   - Is routine, yet everyone must rigorously adhere to the\
    \ guidelines (for example, a payroll)\n+   - Requires consistency (for example,\
    \ handling a refund request)\n+   - Involves documentation (for example, disciplining\
    \ a staff member)\n+   - Involves considerable alteration (for example, installing\
    \ a new computer system)\n+   - Has severe implications for error (for example,\
    \ safety guidelines)"
  merge: -1
  img_proc: true
- pgno: 162
  md: 'In a normal business, many tasks are performed without formal processes. Unwritten
    norms and informal processes exist. Occasionally, though, these unwritten principles
    must be codified by a process. Here are some examples of when this may need to
    occur:


    +   - Similar questions are constantly posed

    +   - People seem perplexed

    +   - There are too many possible interpretations of the technique


    # How to write a procedure


    Not only what readers desire to know but also what they must know should be communicated
    in procedures. They may need to know how to do the task accurately, more quickly,
    or with less waste. They may also want to know why they must do a task in a specific
    way, where they may get assistance, and what happens if anything goes wrong. Whenever
    required, ensure that your processes address both technical and subjective factors.


    It is also essential that your processes have the appropriate amount of information.
    Here are some questions to consider:


    +   - Do users have sufficient information to act?

    +   - Does it contain sufficient information to assist users in exercising sound
    professional judgment?

    +   - Is the degree of information suitable for the topic?

    +   - Is the degree of detail suitable for the audience?

    +   - How familiar are readers with the topic?


    # Step 1: gathering information


    Before you begin writing, you should collect extensive information on the technique
    you are creating.


    Talk with subject matter experts as well as those who hold essential knowledge,
    including long-time employees, stakeholders, technical personnel, and process
    users.


    Take copious notes and then organize the material at your leisure. As the process
    author, you should have a comprehensive grasp of what is occurring. From there,
    reduce the information just to what the end user needs to fully comprehend the
    procedure (a mind map is a fantastic tool for arranging information. This may
    assist you in ensuring that you have included and linked all the necessary components).'
  merge: -1
  img_proc: true
- pgno: 163
  md: '# Step 2: beginning to write


    When writing the initial draft of your method, you should not be concerned with
    perfect terminology and structure. The primary objective is to provide the necessary
    information. After that, you can concentrate on the wording and arrangement.


    Here are some helpful guidelines:


    +   - Record activities in the sequence in which they occur

    +   - Begin with the first action and conclude with the last action

    +   - Avoid excessive wordiness

    +   - Just be explicit enough to ensure clear communication

    +   - Use bullets and lists

    +   - If you are too brief, you risk losing clarity

    +   - Explain your assumptions and ensure that they are accurate

    +   - Utilize jargon and slang with caution


    # Step 3: evaluating design elements


    You may discover that words alone are insufficient to describe the technique.
    Occasionally, additional features might enhance a presentation. Here are a few
    prevalent formats.


    # Flowchart


    This is a schematic of a process. You may outline and simplify a process by using
    a sequence of symbols and arrows to show the flow of activity. Make sure that
    your chart does not include too many strange symbols or too much text. If necessary,
    divide it into many smaller flowcharts.


    # Playscript


    This seems to be a theatre script with many characters. In this instance, though,
    you list the staff members with varying duties. Scripts may be particularly beneficial
    when several people are participating in a process:'
  merge: -1
  img_proc: true
- pgno: 164
  md: '| Person in charge | Action |

    |---|---|

    | | Gathering information |

    | Writer responsibility | Writing the process |

