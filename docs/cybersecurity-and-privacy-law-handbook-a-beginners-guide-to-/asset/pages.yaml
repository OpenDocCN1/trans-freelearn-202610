    # Conclusions


    Beyond the proposed solutions, there is a serious danger of generating actual
    blacklists of non-EU governments that do not guarantee the protection of the privacy
    of European residents, with obvious implications for international commerce and
    geopolitics. The review of the “countries at risk” might have significant effects
    on international transactions and the worldwide supply of services, including
    cloud computing, banking, and insurance. The majority of transactions and commerce
    rely on the transfer of data to non-EU nations, including the United Kingdom.
    If it is true that personal data is the new black gold and that the accumulation
    of enormous masses of data (so-called big data), and its study and use for commercial
    and market purposes, is the foundation of the fortunes of big players (online
    service providers, cloud computing, social media, big tech), then it is also true
    that the majority (if not all) of them are located in the United States or other
    non-EU, countries such as China and South Korea.


    One, therefore, wonders if the judgment in question is not the result of a political
    will to redesign future relations in the context of a European neo-sovereignism
    vis-à-vis the excessive power of non-EU suppliers; if you want to force the retention
    of data within European borders by making it more difficult to transfer data outside
    the EU in order to entice stakeholders to choose European suppliers, as opposed
    to US operations, then Europeans need to create a whole technological ecosystem,
    starting from cloud operations, but the technological gap will increase.'
