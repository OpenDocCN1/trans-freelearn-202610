    Figure 7.2 – Heatmap in tabular format


    Well, now that we have defined how much a risk is hot, we need to find a way to
    take care of these risks, or, using the proper jargon, to mitigate them.


    # Risk mitigation


    Risk mitigation refers to the methods to decrease risk and lessen the chance of
    an event happening. Risk mitigation is ensuring that your organization is completely
    safeguarded, which necessitates a continual focus on your main risks and concerns.
    The processes that govern and direct an organization are sometimes referred to
    as controls or mitigation activities.


    To further comprehend this, let’s examine it in connection to the overall Enterprise
    Risk Management (ERM) process. The objective of your controls is to avoid certain
    hazards from materializing. This results in the development of policies and procedures
    designed to reduce the probability of risks materializing, remove the possibility
    that they will materialize, or raise the likelihood that your processes will protect
    you should the risk materialize.


    # Best risk mitigation strategies


    At any one given time, every firm confronts a plethora of hazards. They incur
    more risks when doing anything new (such as a project or initiative) or experiencing
    any form of organizational change. These inherent hazards are often related to
    the procedures involved in achieving the final objective. However,'
  merge: -1
  img_proc: true
- pgno: 125
  md: 'there are ways to reduce the likelihood (possibility) of occurrences that may
    be used to identify and guide better risk mitigation plans.


    Consequently, the four most prevalent strategies are as follows:


    +   - **Risk acceptance**, an idea that can be reduced to *taking the chance*.
    This means accepting that the danger exists and that there is nothing you can
    do to lessen or alter it. Instead, it involves comprehension of the likelihood
    of its occurrence and acceptance of the potential repercussions. This is the optimal
    method when the danger is low or the risk is unlikely to occur. When the cost
    of minimizing or avoiding risk is greater than the cost of accepting and leaving
    it to chance, it makes sense to accept the risk.

    +   - **Risk avoidance**: If the risk associated with initiating a project, introducing
    a product, relocating your firm, and so on is too great to take, it may be preferable
    to forgo it. In this instance, risk avoidance involves avoiding engaging in the
    risk-causing behavior. Managing risk in this manner most closely resembles how
    individuals manage personal hazards. Despite the fact that some individuals are
    risk-seekers and others are risk-averse, everyone has a tipping point at which
    things become too hazardous to undertake.

    +   - **Risk mitigation**: When evaluating risks, it is preferable not to avoid
    or accept certain hazards. In this case, risk minimization is investigated. Risk
    mitigation refers to the activities and techniques used to manage and mitigate
    risk. When risk and its likelihood are identified, management resources can be
    allocated appropriately.

    +   - **Risk reduction**: Businesses may choose an acceptable degree of risk,
    known as the residual risk level. Risk minimization is the most prevalent method
    since there is often a means to minimize risk. It entails taking actions to mitigate
    the effects of outcomes. An example of risk reduction is risk transfer, such as
    purchasing insurance.

    +   - **Risk transfer**: As previously stated, risk transfer includes transferring
    the risk to a third person or institution. As is the case of leasing property,
    risk transfers might be outsourced, transferred to an insurance company, or provided
    to a new organization. Not often do risk transfers result in decreased costs.
    A risk transfer is preferable when it can be utilized to mitigate future harm.
    Therefore, insurance may be costly, but it may be more cost-effective than experiencing
    the risk and being fully liable for repairs.


    **Tip – What is the most effective risk management strategy?**

    Obviously, the optimal technique depends on the risk you want to avoid. A solid
    rule of thumb for deciding which strategy to pursue is to undertake a risk assessment
    first. This will allow you to detect policy and activity gaps. Based on this input,
    you may effectively rank your efforts.


    *Just remember:* there is no *one size fits all* formula here. 99.9% of the entities
    I have consulted for use the preceding strategies in conjunction with each other,
    according to their business needs.'
  merge: -1
  img_proc: true
- pgno: 126
  md: '# How to establish risk mitigation strategies


    All risks and benefits are evaluated differently based on your company''s particular
    objectives. To effectively create risk reduction measures, you must engage in
    the following:


    +   - **Understand the user’s requirements**: Understand your clients’ wants.
    Consider their needs while evaluating risks, since they are the foundation of
    your organization.

    +   - **Seek out and use experts**: Risk need not be addressed in isolation. There
    are both software systems and subject matter experts available as resources.

    +   - **Recognize risk that arises**: The worst thing you can do as a company
    leader is to ignore the existence of risk, since this is neither practical nor
    useful. When you are able to identify, define, and handle risk, you may better
    train your team and management to cope with its many varieties.

    +   - **Encourage risk-taking**: Sometimes, taking risks is the best course of
    action. If your firm is capable of handling risk, promote risk-taking. Have backup
    plans and explain them so that everyone is on the same page to make this less
    intimidating.

    +   - **Recognize possibilities**: Taking a risk may lead to the discovery of
    new opportunities. If you frame the discourse around risk in this manner, you
    may foster a problem-solving mindset that is adept at managing risk.

    +   - **Promote consideration of mitigating strategies**: Consider comments from
    your team and include everyone. Everyone may have a unique risk mitigation strategy
    or approach. You can utilize data and analytics to evaluate alternatives and choose
    the optimal course of action.


    Not every risk requires a mitigating strategy: as stated previously, it is occasionally
    preferable to take risk. Recognize that this is an option, and that some risks
    need no strategic response at all.


    I tried my best here to give you all the basic (and non-basic) notions, but if
    you want to continue exploring the interesting world of risk management, you will
    find a plethora of books in your favorite bookstore that can help you to dig into
    the matter. For us, it''s time to move on to data classification.


    # Data classification


    We started this chapter talking about assets, and data classification is the process
    of organizing data assets, so it''s worth a mention here.


    Data classification involves building a classification scheme and defining one
    or more taxonomies for the whole organization. A categorization system facilitates
    the efficient determination of data action priorities and intensities. Data classification
    depends on characteristics such as criticality, security, access and usage, privacy,
    ethics, data quality, and storage needs.'
  merge: -1
  img_proc: true
- pgno: 127
  md: '# Why is the classification of data important?


    Classification of data offers businesses with an interface for implementing rules
    and processes across data types, structures, and storage systems. Classified data
    enables an organization to create and apply a single handling policy for sensitive
    data across numerous systems and data items. Defining many rules for each sort
    of data item is impractical in contexts with plentiful data today.


    The categorization of data provides a corporate context to applications and processes.
    On the basis of data categorization, for instance, an organization might identify
    apps that handle sensitive data and specify stronger security criteria for such
    applications:


    +   - **Compliance**: Data categorization makes it simpler to comply with regulatory
    frameworks such as as GDPR, CCPA, HIPAA, and PCI, and also demonstrates compliance

    +   - **Security**: Data categorization makes the organization aware of the data’s
    sensitivity, both as a whole and each time new data is presented, and enables
    the organization to apply the appropriate degree of security control based on
    this context

    +   - **Governance**: Data categorization facilitates the mapping, monitoring,
    and management of data


    # What are the four levels of data classification?


    In information security, there are commonly four categorization levels for data:


    +   - **Public**: Data that may exist in the public domain and can be freely shared
    with anybody outside the organization, a flyer outlining the company’s goods and
    services, for example

    +   - **Internal**: Company-wide data that is retained inside the organization
    and should not be shared outside, while not being sensitive, for instance, instructions
    on how to contact the company’s IT support

    +   - **Confidential**: This is information is domain-specific data, may be shared
    with particular individuals or teams, and includes sensitive corporate information;
    a pricing list for one of the company’s goods, for instance

    +   - **Restricted**: Highly sensitive information that should only be accessible
    on a need-to-know basis is restricted, for example, employment agreements


    # What are the various types of data classification?


    While data is categorized depending on the requirements of each organization,
    there are a few typical methods of data classification:


    +   - **Data-based**: A classification that explains the characteristics of the
    data. A credit card number or an email address are examples.'
  merge: -1
  img_proc: true
- pgno: 128
  md: '+   - **Context-based**: Classification that describes the business context
    of the data, for instance, sensitive information or earnings data.

    +   - **Source-based**: Categorization that identifies the data source, for instance,
    consumer information gathered through a webinar registration form.


    # Difficulties with data classification


    While data categorization is necessary for performing a variety of operations,
    information security focuses primarily on sensitive data. In the majority of businesses,
    sensitive data is categorized into various sensitivity levels and then mapped
    to distinct sensitive data categories (e.g., personal information).


    Typically, companies confront the following obstacles when categorizing data:


    +   - **False positives**: The same data may appear in several forms and circumstances.
    False classifications are more likely to be produced by classification algorithms
    that disregard the format and context of the input. As classification efforts
    often entail enormous volumes of data, even very low false positive rates might
    prohibit an organization from classifying properly.

    +   - **False negatives**: According to different regulatory requirements, data
    may be deemed sensitive in one circumstance but not another. For instance, a name
    may be deemed non-sensitive by itself, but sensitive when paired with a medical
    record. Oftentimes, inaccurate categorization results from classifying data outside
    of its use context.

    +   - **Big data**: Data lakes and data warehouses represent ever-expanding dynamic
    data stores, posing a formidable challenge for categorization methods that are
    not continuous.

    +   - **Cost**: For the majority of classification tools, the cost of adopting
    and maintaining a data categorization strategy is contingent upon the quantity
    of data and the number of rules imposed. This procedure limits a company''s ability
    to categorize massive datasets with rigorous access rules.


    # Effects of compliance standards on data classification


    Many legislation and compliance requirements mandate that enterprises classify
    their data. Depending on the kind of data used, processed, collected, sent, and
    stored by an organization, each compliance standard may have varying requirements.


    Here are several common compliance standards and their data classification requirements:


    +   - **GDPR**: Under GDPR, organizations that handle the personal data of European
    data subjects must categorize all the kinds of data gathered. As mentioned in
    the previous chapters, GDPR classifies as *special* data pertaining to race, political
    beliefs, healthcare, ethnic origin, and biometrics. This information needs greater
    security.

    +   - **PCI-DSS**: Entities are required by PCI DSS Requirement 9.6.1 to *classify
    data such that the sensitivity of the data may be assessed.*'
  merge: -1
  img_proc: true
- pgno: 129
  md: '+   - **SOC2**: Trust Services (SOC2) Entities are required by SOC2 criteria
    to show that they routinely identify and manage sensitive information in accordance
    with their specific confidentiality goals.

    +   - **HIPAA**: Protected health information (**PHI**) is a high-risk asset under
    HIPAA. The HIPAA Security Rule mandates that businesses and related **business
    associates (BA)** to whom the law is applicable identify PHI and adopt protections
    to assure its availability, confidentiality, and integrity. The HIPAA Privacy
    Rule restricts the uses and disclosures of **protected health information (PHI)**
    and requires those applicable businesses and business partners to implement data
    categorization methods.


    *Preciousness of data is heavily dependent of the value we attribute to it.*


    Let’s use an example to better understand this concept: let’s suppose there is
    a country named XYZ and their king wants to conquer the adjacent country of ZYX.
    He calls all his counselors, ministries and advisers and prepares a war plan and
    puts it in the safe. This plan, as you may imagine, has enormous value. But, for
    some reason, the king never decides to use this plan and, instead, he agrees a
    long-lasting peace agreement with the other country. When his successor (or an
    opponent, or a revolution, you name it) ascends to the throne and finds the attack
    plan, what will the plan’s value be then?


    The answer is I don’t know, and you probably don’t know either. But for sure its
    value will be different than in the past because of the successful peace agreement,
    because the old king is dead, and many other different reasons. Data classification
    is the technique of ascribing value to some information.


    # Data classification levels


    Data sensitivity levels assist in establishing how to handle each form of classified
    data. For instance, the Center for Internet Security (CIS) proposes three information
    classes:


    +   - Public

    +   - Business Confidential

    +   - Sensitive


    With seven categories of data sensitivity, the US Government has a more comprehensive
    categorization system:


    +   - **Controlled Unclassified Information (CUI)**

    +   - Public Trust

    +   - Confidential

    +   - Secret

    +   - Top Secret'
  merge: -1
  img_proc: true
- pgno: 130
  md: '+   - Code Word Classification

    +   - Restricted Data/Formerly Restricted Data


    Using more than three layers might complicate data categorization and make it
    difficult to monitor and maintain. Using less than three tiers is deemed too basic
    and may result in inadequate protection and privacy. As recommended by the CIS,
    the majority of enterprises employ three categorization levels.


    Here is a simplified version of the CIS classification definitions that you can
    use in your efforts to classify data:


    +   - **Low-sensitivity data:** This consists of publicly available data that
    does not require access restrictions, such as web pages, blog posts, and job postings.

    +   - **Medium-sensitivity data:** This is intended exclusively for internal use,
    and a breach might have a significant effect on the business, for instance, company
    strategies, client lists, and anonymous personal data.

    +   - **High-sensitivity data:** This consists of information that is protected
    by rules or compliance requirements, necessitating tight access restrictions and
    security measures. The data, if compromised, might cause serious damage to people
    or the company, as well as incur compliance penalties or fines.


    # Developing a policy for data classification


    A data categorization policy outlines the manner in which your business manages
    its information life cycle. The objective is to guarantee that sensitive data
    is handled according to the amount of risk it presents. A data categorization
    policy should handle access and authorization, taking the data structure and its
    typical business applications into consideration.


    Here are numerous important aspects that your policy should address:


    +   - **Objectives:** The rationale for applying data categorization and the desired
    outcomes, together with quantifiable **key performance indicators (KPIs)**.

    +   - **Workflows:** Clarify how the whole categorization process should be structured
    and coordinated. Explain how this procedure will affect all workers and how they
    should handle various degrees of sensitive information.

    +   - **Location:** Identify where the data is kept, such as on site, in the cloud,
    on backup systems, in databases, files, and so on.

    +   - **Schema:** Determine and describe the data classification categories.

    +   - **Data owners:** Clarify the roles and responsibilities of all stakeholders
    participating in the categorization management process. Describe how each position
    should organize and allow access to data.'
  merge: -1
  img_proc: true
- pgno: 131
  md: '+   - **Compliance**: Clearly identify what information is governed by compliance
    standards and what steps are necessary to achieve compliance.


    # Data classification procedures


    Here are a few recommended practices that may help you enhance your organization’s
    data categorization:


    +   - **Conduct a data risk assessment**: A full awareness of all data needs,
    including those connected to corporate rules and compliance standards, may be
    attained via a data risk assessment. You should also identify the contractual
    obligations for privacy and confidentiality. Define goals for data categorization
    in collaboration with all stakeholders, including IT, security, and legal teams.


    +   - **Create a data inventory**: Before you can categorize data, you must identify
    it using methods and tools for data discovery. Once all sensitive data has been
    found, it must be identified and classified to ensure that each category of data
    is adequately secured. To make the procedure faster and more precise, you may
    mark any item containing sensitive data. This may considerably enhance the enforcement
    of your data categorization rules. You may manually or automatically label data.


    This procedure may be automated via the use of intelligent categorization systems.
    Using specified criteria, for instance, a data classification system may automatically
    recognize and categorize data, and then tag it with the relevant categorization
    label. Throughout the entire data lifespan, these systems may continually monitor
    data to ensure that it is always appropriately categorized.


    +   - **Establish data security measures**: Each level of data categorization
    needs a unique degree of protection. To guarantee that each level is adequately
    secured, standardize your security methods. Define the policy-based controls for
    each label categorization.


    +   - **Maintenance and supervision**: Data is dynamic and must be continuously
    monitored and maintained. It may be copied, generated, edited, removed, and transferred
    regularly. Due to the fact that data undergoes several transformations during
    its existence, classifying it may be a time-consuming endeavor. Identifying which
    data actually needs to be safeguarded and focusing classification efforts there
    is a crucial step in reducing classification time. Automated categorization systems
    are an additional method for reducing workloads and expediting the identification
    and processing of newly produced sensitive data. Lastly, verify that your data
    categorization standards are adaptable enough to accommodate changes in data structure,
    the introduction of new data kinds, and an increase in data volume.


    Now that we have exhaustively dealt with data and its classification, it’s time
    to move to ISO 27001 controls and why they are so important.'
  merge: -1
  img_proc: true
- pgno: 132
  md: '# ISO 27001 controls


    The ISO 27001 standard is comprised of the standard itself, plus a second part,
    called Annex A, where all the controls (114 divided into 14 categories) exist:


    +   - Information Security Policies

    +   - Organization of Information Security

    +   - Human Resources Security

    +   - Asset Management

    +   - Access Control

    +   - Cryptography

    +   - Physical and Environmental Security

    +   - Operational Security

    +   - Communications Security

    +   - System Acquisition, Development, and Maintenance

    +   - Supplier Relationships

    +   - Information Security Incident Management

    +   - Information Security Aspects of Business Continuity Management

    +   - Compliance


    Each of the 14 categories provide you with a clear explanation of the primary
    objective(s) of that category.


    # Control Category A.5 – Information Security Policies (1 objective and 2 controls)


    This category’s aim is to give management guidance and assistance on information
    security in accordance with the organization’s needs and applicable laws and regulations.
    This is accomplished by the documentation of a set of information security rules
    that must be authorized, publicized, disseminated, and reviewed at certain intervals.'
  merge: -1
  img_proc: true
- pgno: 133
  md: '# Control Category A.6 – Organization of Information Security (2 objectives
    and 7 controls)


    The first purpose is to develop a management structure that starts and regulates
    the implementation and operation of information security. This involves ensuring
    the following:


    +   - Information security roles and responsibilities are explained and understood

    +   - Segregation of duties is recognized and maintained

    +   - Appropriate contact information is created and maintained with authorities,
    including the ICO, and special interest organizations, such as ISACA


    No matter the kind of project, information security is developed and handled in
    project management. The second purpose is to protect the security of mobile devices
    and remote work.


    This is accomplished by developing and executing a policy and supplementary security
    measures to control the risks associated with the usage of mobile devices and
    to safeguard information remotely accessed, processed, or stored.


    # Control Category A.7 – Human Resource Security (3 objectives and 6 controls)


    The primary purpose is to ensure that employees understand their obligations and
    are qualified for the positions for which they are being evaluated. This is accomplished
    by completing adequate background checks on all applicants and including information
    security duties in employment contracts.


    The second purpose is to ensure that employees are aware of and comply with their
    information security duties. To do this, they must implement information security
    in accordance with organizational rules and procedures. The organization is responsible
    for ensuring that personnel get proper training and frequent updates.


    A structured and disclosed disciplinary procedure must also be developed so that
    any person who violates information security may be punished. The end purpose
    of this category is to safeguard an organization''s interests when employees change
    jobs or leave the organization by defining, communicating, and enforcing restrictive
    covenants.


    # Control Category A.8 – Asset Management (3 objectives and 10 controls)


    The first aim requires the identification of information assets and the assignment
    of suitable protection tasks. This is accomplished by developing an asset inventory
    that identifies asset owners. Document and execute rules on the permissible use
    of these assets. When recovered, assets must also be secured and maintained. The
    subsequent purpose is to guarantee that data is adequately safeguarded.'
  merge: -1
  img_proc: true
- pgno: 134
  md: 'To do this, it is necessary to develop a categorization system and classify
    the assets properly. Therefore, all electronic and physical assets must be labeled
    in line with the categorization system, and procedures for managing assets must
    also be designed and executed. The final purpose is to prevent unauthorized disclosure,
    alteration, deletion, or destruction of information stored on media. This can
    be accomplished by employing removable-media management methods. These processes
    must address the safe disposal and transit of storage media holding sensitive
    information.


    # Control Category A.9 – Access Control (4 objectives and 14 controls)


    The primary goal is to restrict access to information and data processing resources:
    this is accomplished in part by developing and enforcing an access control policy
    and limiting user access to just the systems and network regions they require
    to execute their jobs.


    The second goal is to guarantee authorized user access and prevent unauthorized
    access.


    The following controls are used for this purpose:


    +   - A structured procedure for user registration and de-registration

    +   - A structured procedure for user access provisioning

    +   - Restriction and management of the assignment and use of privileged access
    rights

    +   - A structured method for managing the distribution of passwords, PINs, and
    so on

    +   - The examination of access rights

    +   - Users’ access privileges are revoked when they leave an organization or
