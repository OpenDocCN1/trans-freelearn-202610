- pgno: 99
  md: '# Define ISO 27001 Mandatory Requirements


    After spending some time on data protection, we are back to our beloved ISO 27001.
    This time, we’ll go past the tip of the iceberg to see what’s hidden, and we’ll
    spend some time (the whole chapter) better understanding ISO 27001 requirements


    The main topics here will be related to iSMS: the meaning of PDCA, project objectives
    and estimates, team building, project development and selections of controls to
    be used, and many more.


    We will cover the following topics in this chapter:


    +   - ISO 27001 operations

    +   - ISO 27001 support requirements (or Clause 7)


    # ISO 27001 operations


    The iSMS constitutes a benchmark in the implementation of a corporate security
    controls framework and can become one of the fundamental pillars in guaranteeing
    a structured, continuous, and risk-oriented approach across the entire entity


    Correctly weighing the perimeter of applicability, the necessary resources and
    skills, and strong support from senior management are the key elements for the
    success of the iSMS.


    The most obvious benefits of an iSMS model are the following:


    +   - It allows you to have an overall vision of corporate security that goes
    beyond the perimeter of IT security, also including people and processes

    +   - It is an adaptive model that adapts to the temporal evolution of threats
    and therefore to the rapid changes typical of today''s information systems'
  merge: -1
  img_proc: true
- pgno: 100
  md: '+   - It returns a correct view of the state of security and thus becomes the
    fundamental tool for optimizing the allocation of budget, directing it toward
    initiatives that give a greater return in terms of risk reduction

    +   - Implementing this control model allows us, in many cases, to also respond
    to external regulatory constraints that normally require a series of measures
    that are nothing more than a subset of the possible controls of the framework

    +   - In fact, the application of controls allows an effective tool for corporate
    security governance, and ISO/IEC 27001 is undoubtedly one of the most complete
    standards, consisting of an innumerable collection of indications and controls
    that must be carefully selected or declined by choosing the relevant and feasible
    measures for the organization


    # The ISO 27001 standard – what it is and what requirements it establishes


    Annex A of ISO/IEC 27001 contains the objectives and controls, or the thematic
    areas considered and the controls to be applied (the 14 thematic areas are then
    broken down into lower-level controls, more details of which are provided in ISO/IEC27002).
    The areas, or domains, of the whole ISO/IEC 27001 are broken up into the following
    14 controls:


    +   - A.5: Information security policy

    +   - A.6: Organization of information security

    +   - A.7: Human resource security

    +   - A.8: Asset management

    +   - A.9: Access control

    +   - A.10: Cryptography

    +   - A.11: Physical and environmental security

    +   - A.12: Operation security

    +   - A.13: Communications security

    +   - A.14: System acquisition, development, and maintenance

    +   - A.15: Supplier relationships

    +   - A.16: Information security incident management

    +   - A.17: Information security aspects of business continuity management

    +   - A.18: Compliance


    Each of these sections then contains subareas that provide directives without,
    however, providing stringent specifications on the security measures that must
    be chosen and used in a specific case.'
  merge: -1
  img_proc: true
- pgno: 101
  md: '# How to structure an iSMS


    With regard to what has been said previously, the impact of iSMS crosses widespread
    across the entire organization, so top management support is a fundamental prerequisite
    to starting the project.


    Having said that, it is possible to break down the project into different phases.
    Let''s analyze them in detail.


    # Structuring an iSMS – project objective and estimate


    This is the first step of the project in which it is necessary to estimate the
    scope of the project and calculate the construction and maintenance costs.


    The size and maturity of the company determine very different approaches: we could
    consider the basic perimeter at the beginning of the implementation, thus including
    only the network equipment related to the company (of course including devices
    in use by remote workers, if any ), systems at greatest risk, and consider gradually
    enlarging in subsequent project waves, including social accounts, cloud computing
    and remote repositories


    Other variables to consider are support from other structures and offices of the
    company, aside from the security offices, touching many areas of the company,
    including the human resources office, legal, and purchases.


    Having the right commitment from all the actors involved and from management will
    be essential to the success of the project.


    ISO 27001 relies on continuous improvement and, even if not directly explained
    in the standard. It will therefore be possible to choose Plan-Do-Check-Act (PDCA,
    known also as Deming Cycle) as the best iterative methodology.


    ![](img/60ab32c90068557380d1368a9d3a0d47_101_0.png)


    Figure 6.1 – Plan-Do-Check-Act


    PDCA consists of a continuous implementation aimed at constant improvement for
    effective and adaptive management that follows the evolution of the information
    system. The four phases of PDCA are described as follows:


    +   - **Plan:** Establish the iSMS plan by defining its perimeter and objectives,
    carry out the risk assessment, and establish the plan and procedures for risk
    management.

    +   - **Do:** Implement the iSMS plan. The procedure becomes operational.'
  merge: -1
  img_proc: true
- pgno: 102
  md: '+   - **Check:** This is the monitoring and correction phase of the iSMS plan,
    which is carried out through internal audits, and the results are reported to
    top management.

    +   - **Act:** Maintain and improve the plan through corrective actions.


    PCDA is adopting the aforementioned cycle because it reflects the evolutionary
    nature of threats. As threats and risks change they require continuous re-evaluation
    and adaptation, in order to reach the ultimate company goal: Ensure the adequate
    containment of the overall risk, below an established threshold. We cannot set
    an arbitrary risk threshold, as company risk appetites may differ.


    # Structuring an iSMS – team building


    This is the project phase in which the team responsible for managing the project
    estimates the necessary effort.


    An iSMS requires strong knowledge and experience of the ISO 27001 and its implementation
    should be followed by professionals who have a background of working on projects
    of this type and at the same time will need senior managers with sufficient authority
    to orchestrate all the resources and structures involved.


    # Structuring an iSMS – project development and selection of controls


    First of all, it is necessary to identify controls, processes, and procedures
    that already regulate the scope within which ISO 27001 is to be implemented and
    all the assets and actors involved: customers, data, partners, offices, and so
    on.


    Once these entities have been identified, it will be necessary to select the controls
    to be implemented and all the necessary metrics that will serve monitoring purposes.


    As ISO 27001 is devoted to any kind of company, the selection of controls and
    how to interpret and implement them cannot be specific because they depend on
    the sector in which the company operates, its size, the technologies it uses,
    and the resources that the company has to implement and manage these controls.


    In fact, it is necessary to pay close attention to how many controls to use to
    ensure you do not jeopardize the psychological acceptability of users and not
    overload the operational processes. Remember that implementing controls can affecting
    a company at all levels, at every department. Therefore, it is imperative to work
    on a few controls at a time.


    # Structuring an iSMS – project development and documentation system


    Once the scope and controls have been established, the management of the iSMS
    will have to be included in the business processes, and then the PDCA quality
    management process should be tailored accordingly, formalizing it by following
    a fairly lean document system that includes at least one policy, a standard, and
    an operational guide.'
  merge: -1
  img_proc: true
- pgno: 103
  md: '# Structuring an iSMS – project development and risk analysis


    At the heart of the iSMS is the risk analysis and assessment process, which allows
    you to assess the riskiness of threats and therefore establish possible countermeasures.


    In this case, the suggestion is to adopt an approach already used in the company,
    if present, or to create a new one that is simple enough so as not to make the
    project excessively complicated.


    Being able to identify relevant threats and weigh them accurately is a very difficult
    aspect and typically requires coordinated work between security specialists.


    Without going into excessive detail, the risk analysis phases must be as follows:


    +   - **Risk identification**: This is the phase in which the possible risks must
    emerge, which, if they materialize, would lead to a compromise in terms of the
    integrity, confidentiality, or availability of data.

    +   - **Risk measurement**: Once the possible risks have been identified, they
    must be weighed according to the impact they would have on the organization. They
    can be both quantifiable, such as monetary impacts (usually in the case of material
    losses), and immaterial, as in the case of damage to reputation.

    +   - **Risk weighting**: In this step, the results of the previous phase are
    compared with the risk criteria to establish the priorities and methods of risk
    treatment.


    Ultimately, therefore, it is decided how to intervene when risk is encountered
    and how to proceed. The options are as follows:


    +   - Accept the risk if it is not believed to substantially affect the overall
    risk

    +   - Transfer the risk, where possible, if, for example, it is easier than having
    to compensate for it with mitigation actions

    +   - Cancel the risk, for example, by decommissioning a service if the cost of
    correcting the risk is excessive compared to the actual benefit that this service
    entails

    +   - Mitigate the risk or implement one or more controls in order to bring the
    risk back to a value that is considered acceptable


    # Structuring an iSMS – assessment


    Periodically, it is important to schedule iSMS review and monitoring phases to
    evaluate its effectiveness and adherence to controls with respect to the context
    of current threats that could be significantly modified over time.


    From this point of view, the quality of the audit and the metrics chosen become
    the key points for evaluating the project. In particular, the more the metrics
    are an objective and significant measure of the control in question, the more
    truthful and simple the analysis will be to carry out.'
  merge: -1
  img_proc: true
- pgno: 104
  md: "One of the most important clauses of ISO 27001 is Clause 7 because it sets\
    \ the standards for implementation (related to training, the implementation team\
    \ (if internal), and so on). Let’s see the requirements in detail.\n\n# ISO 27001\
    \ support requirements (or Clause 7)\n\nIn this part, we will focus in depth on\
    \ Clause 7, which is fundamental because it deals with training and resources.\
    \ It applies to people, infrastructure, and the environment just as much as it\
    \ does to physical resources, materials, and equipment. This clause focuses on\
    \ acquiring the necessary resources, personnel, and infrastructure to build, deploy,\
    \ maintain, and continuously enhance the iSMS. It addresses the need for competence,\
    \ awareness, and communication to support the iSMS, and might involve, for instance,\
    \ providing training and access to staff. This article also stipulates that all\
    \ individuals working for a company must be aware of its information security\
    \ policy, how they contribute to its success, and the consequences of failing\
    \ to comply. Additionally, the company must ensure that internal and external\
    \ communications pertinent to information security and the iSMS are conveyed effectively.\
    \ This entails determining what must be conveyed to whom, when, and how.\n\n>\
    \ Tip\n> \n> Please consider that, once implemented, ISO 27001 has to be maintained\
    \ too. Therefore, your organization requires someone that is able to improve the\
    \ value of the certification. Remember the PDCA or Deming cycle? Let’s imagine\
    \ this with the example of a bicycle: once you jump on and start to cycle, it\
    \ (you complete the first PDCA cycle) is quite difficult to keep the bicycle steady\
    \ and at a good speed. After a few meters, you will be pedaling at a faster pace\
    \ and the handlebars will be more stable, and, in a perfect world, you will be\
    \ steady forever. Of course, in real life, it works differently: there are traffic\
    \ lights, pedestrians, cars, and so on that inhibit our progress, but our ride\
    \ continues.\n\nOrganizations must assess the degree of recorded information required\
    \ for iSMS control. Controlling access to recorded information is also emphasized,\
    \ reflecting the significance of information security. In your company, there\
    \ is also a renewed emphasis on knowledge as a vital resource. When designing\
    \ your quality targets, the present capacity and capability of your resources,\
    \ as well as those you may need to acquire from external suppliers/partners, will\
    \ be a crucial concern. This section of the standard specifies the prerequisites\
    \ for establishing and operating an iSMS. Included in Section 7 are the following:\n\
    \n+   - 7.1 – Resources required to establish and operate an iSMS\n+   - 7.2 –\
    \ Competency\n+   - 7.3 – Awareness\n+   - 7.4 – Communication\n+   - 7.5 – Documented\
    \ information"
  merge: -1
  img_proc: true
- pgno: 105
  md: '# 7.1 – Resources required to establish and operate an iSMS


    The company must select and provide the necessary resources for establishing,
    implementing, maintaining, and continuously improving the information security
    management system.


    Clause 7.1 includes information about the selection and allocation of resources
    to establish and manage an iSMS, as well as the requirements for ongoing awareness
    for all personnel executing work within the scope of the iSMS and under the authority
    of the organization. A sufficient amount of resources must be allocated to the
    creation, implementation, maintenance, and ongoing enhancement of the iSMS. It
    is sufficient that roles, duties, and authority be clearly defined and owned –
    assuming that the appropriate amount of resources will be deployed – but it does
    not demand that the iSMS be staffed with full-time personnel. Clause 7.1, which
    serves as an overview of the resources promise, is followed by more detailed criteria
    in the following clauses


    +   - 7.2 – Competence of the support resources for ISO 27001

    +   - 7.3 – Awareness of the people doing the work for the iSMS to meet ISO 27001

    +   - 7.4 – Communication (this clause is about communicating the iSMS to the
    interested parties internally and externally)

    +   - 7.5 – Documented information about the iSMS to demonstrate it conforms to
    the ISO 27001 standard


    Having access to the necessary resources at the appropriate time is a crucial
    factor in the success of an iSMS deployment. Remember that each iSMS position
    holder needs to be competent in their function. Therefore, it is essential to
    recall the essential duties and resources you will need. This relates to the iSMS''s
    installation and operations. Core roles will presumably include the following:


    +   - The iSMS owner, typically a senior manager.

    +   - Members of the governance forum, regardless of its titles.

    +   - The individual responsible for managing information security inside the
    organization.

    +   - Those accountable for diverse operational operations that influence information
    security. This covers operational support professionals, including server and
    network support teams, service desk workers, and human resources management people.

    +   - The iSMS internal auditor.

    +   - The person entrusted with ensuring that the iSMS complies with the standard.

    +   - The person responsible for reporting iSMS performance to upper management.'
  merge: -1
  img_proc: true
- pgno: 106
  md: 'During implementation planning, there are many questions that must be presented
    and answered, such as the following:


    +   - What skills do we require?

    +   - Do we have access to these capabilities? If not, can we recruit somebody
    who does? Can we hire them on a contract basis?

    +   - What internal training and development is needed to retain the requisite
    competencies over the long term?


    These issues are mostly concerned with verifying the availability of the requisite
    capabilities. Included are inquiries about recording the desired capabilities,
    determining the present competency set, and establishing potential methods to
    resolve any competency gaps. Typically, gaps are remedied as follows:


    +   - By hiring – acquiring permanent resources with the appropriate skill set

    +   - By acquiring temporary contract resources

    +   - By developing in-house capabilities via training and mentorship


    The decisions about these alternatives will rely on the magnitude of the skill
    gap and whether the competencies are necessary for the iSMS’s adoption or continuous
    operation.


    # 7.2 – Competency


    The organization must identify the requisite competence of all individuals doing
    work under its control that impacts the performance of information security. It
    must also guarantee that these individuals are qualified based on their degree,
    training, or experience. Whenever relevant, it must carry out activities to acquire
    the required competence, assess the success of those efforts, and keep the requisite
    documentation as proof of competence. Examples of applicable activities include
    training, mentorship, or reassignment of present personnel, as well as the recruiting
    or contracting of competent individuals.


    Clause 7.2 of ISO 27001 essentially states that the entity will guarantee it meets
    the following requirements:


    +   - Assessed the ability of the iSMS personnel whose job might impact its performance

    +   - Has people regarded as qualified based on their applicable education, training,
    or experience

    +   - Whenever necessary, takes action to obtain the essential competency and
    assess the efficacy of their activities, and preserved proof for auditing


    Clause 7.2 stipulates that all iSMS personnel must be competent in their respective
    tasks. The supply of training, education, experience, and skills leads to competence.
    All of these must be addressed while managing human resources. To effectively
    deploy and sustain an iSMS, supporting resources must be in place.'
  merge: -1
  img_proc: true
- pgno: 107
  md: 'The organization must do the following:


    +   - Decide who has to have the requisite skills to undertake tasks under its
    supervision that have an impact on information security performance

    +   - Confirm that these individuals possess the necessary education, skill, or
    experience to be considered competent

    +   - If necessary, take steps to develop the essential skills and assess their
    efficacy

    +   - Save pertinent documentation as proof of competency


    **Tip**

    Be careful as requirements related to sensitive and private information could
    interfere with data protection.


    Clause 7.2 outlines the requirements for individuals to be aware of their iSMS
    duties. The expertise and abilities of your workers, vendors, and contractors
    is crucial to the successful application of information security rules. To guarantee
    an adequate knowledge and skill basis, you must do the following:


    +   - Specify the needed knowledge and abilities

    +   - Identify who must possess the necessary knowledge and abilities

    +   - Specify how you will evaluate or confirm that the appropriate individuals
    have the necessary knowledge and abilities


    Beyond knowledge of physical security, cybersecurity, computer security, and other
    kinds of information security, a multitude of talents and experiences is necessary
    for the effective deployment and continuous administration of an iSMS that is
    certified to ISO 27001. These include commercial, legal, HR, IT, and goods and
    services expertise relevant to the scope of business. Developing and maintaining
    an iSMS is often a team effort. Your auditor will expect you to have documentation
    outlining your required knowledge and abilities. Where you feel the standards
    have been met, you must provide documentation such as training certificates, course
    attendance records, or internal competency evaluations. The majority of firms
    that currently utilize tools such as training/skills matrices, evaluations, or
    supplier assessments may meet the need for competence records by increasing the
    categories covered to include information security.


    **Tip**

    Of course, this has to be read differently in case you are using a third-party
    company to implement ISO 27001, but still, your entity should be able to maintain
    this certification.'
