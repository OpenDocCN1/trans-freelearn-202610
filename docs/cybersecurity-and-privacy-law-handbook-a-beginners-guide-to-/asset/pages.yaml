- pgno: 167
  md: '# Social Engineering, Password Guidance, and Policy


    While in the previous chapter we got an in-depth look into policies and procedures,
    now we are going to understand the most powerful attack vector: social engineering.
    Why is it the most powerful? Mainly because it attacks the weakest link of the
    security chain: humans. While a machine (software) is intended to execute commands
    and orders, we use our intelligence, feelings, and so on to interact with others.
    But it''s the interaction with other human beings to make us behave differently
    and in a less secure way.


    In this chapter, we will cover the following topics:


    +   - The starting point

    +   - Common social engineering attack methods

    +   - Have you got a M.A.P.P.?


    # The starting point


    The internet has become an integral aspect of modern business and personal life
    since it facilitates the acquisition of information. Businesses and people use
    the internet for a variety of reasons, including content surfing, social networking,
    communicating, purchasing, downloading......


    There are now roughly 4.81 billion internet users worldwide. Today, it is common
    practice for a person to hunt for a certain answer on the internet and get a satisfactory
    result. Alongside the convenience of locating different internet services, social
    networking websites are one of the most significant and rapidly growing areas
    of general interest nowadays. It is fairly popular for individuals to utilize
    social networking sites to maintain frequent touch with their friends and family.


    Intruders compromise systems for a variety of motives. Consequently, it is essential
    to comprehend how and why hostile hackers target and exploit systems. According
    to Sun Tzu’s The Art of War, if you know yourself but not the opponent, for every
    triumph you achieve, you will also suffer a loss. It is'
  merge: -1
  img_proc: true
- pgno: 168
  md: 'the responsibility of system administrators and security experts to protect
    their infrastructure against exploits by understanding their adversary: the malicious
    hackers who want to utilize the infrastructure for illicit operations.


    Social engineering is a wide category of malevolent operations carried out via
    human contact. It employs psychological manipulation to deceive users into committing
    security errors or divulging sensitive data.


    Social engineering is the practice of manipulating, persuading, or misleading
    an individual in order to get access to their computer system. The hacker may
    get unauthorized access by phone, email, snail mail, or direct contact. Examples
    include phishing, spear phishing, and CEO fraud.


    Social engineering assaults consist of several phases. A perpetrator initially
    analyzes the target victim in order to obtain background information, such as
    possible entry points and weak security procedures, required to continue with
    the assault. The attacker next attempts to acquire the victim''s confidence and
    give stimuli for later acts that violate security norms, such as disclosing sensitive
    information or providing access to vital resources.


    # OSINT


    Open Source Intelligence (OSINT) is the lifeblood of social engineering. Information
    is the foundation and support of every interaction. Because OSINT is so critical
    to us as social engineers, it is crucial that you be familiar with the many methods
    for gathering information on your targets.


    No matter how you collect OSINT, you must have a clear notion of what you''re
    searching for. That is not as simple as it sounds. You cannot just request all
    information about the target. Each type of information has a unique value, which
    might vary depending on the type of assault you want to execute.


    # Social scientist


    So, who are these individuals who carry out social engineering attacks? It might
    be a hacker who intends to cause harm or disruption. It may be a member of a cybercrime
    syndicate from somewhere in Europe attempting to infiltrate your network and steal
    money from your online bank account


    # Common social engineering attack methods


    Understanding the many assault vectors for this sort of criminal activity is essential
    for its prevention. The following subsections provide insight into how cybercriminals
    operate.


    # Pretexting


    To improve the likelihood that a prospective victim will bite, an imagined scenario
    is employed to interest the victim.'
  merge: -1
  img_proc: true
- pgno: 169
  md: 'It is a bogus purpose that often involves some actual knowledge about the victim
    (e.g., date of birth or social security number) in an effort to get further information.


    Let’s have an example: Imagine that Mr. White is a middle manager of a company
    and goes to the same bar every morning to have an expresso coffee before going
    to work. Let’s suppose that I am a Social Engineer who wants to hack that company.
    I’ll go to the same place at the same time everyday. After a couple of weeks,
    I’ll wish him good morning before leaving, and he will answer politely. Within
    a few months, I’ll be able to talk to him, maybe about the weather, or briefly
    commenting on a strike or some local news. Another few weeks and he will (possibly)
    give me relevant details about his private life and I can be lucky enough to get
    parts of the passwords of his account (name of his sons, son''s or wife''s birthday
    and so on).


    # Misdirection theft


    This is an example of fraud perpetrated by experienced criminals, often against
    a transportation or courier firm. The purpose is to deceive the firm into delivering
    the package to a different place than originally planned.


    # Phishing


    This is the act of trying to collect sensitive information, such as usernames,
    passwords, and credit card information, by posing as a trustworthy company sending
    out bulk emails, attempting to avoid spam filters. Emails appearing to be from
    well-known social networking sites, banks, auction sites, or IT administrators
    are often used to deceive the public. It is an instance of false social engineering.


    # Targeted phishing


    This is a limited, concentrated, and targeted email assault against a specific
    individual or organization with the intent of penetrating their defenses. After
    doing research on the target, a spear phishing assault is launched with a tailored
    component aimed to induce the target to act against their own best interests.
    The following subsections provide further information on the methodology.


    # *Water-holing*


    This strategy makes use of websites that are frequently visited and trusted by
    users. The attacker at first will introduce a malware, then he will collect information
    on a certain set of users in order to determine which websites they frequent and
    will subsequently test those websites for weaknesses. Over time, one or more members
    of the target group will get infected, granting the attacker access to the protected
    system, via e-mail for instance (we always tend to trust legitimate websites,
    especially from those we are subscribed).'
  merge: -1
  img_proc: true
- pgno: 170
  md: '# Baiting


    Luring a person into action by hanging something in front of them is known as
    baiting. It might be in the form of an (x-rated movie download from a peer-to-peer
    or social networking site, or it could be a Q1 Layoff Plan-labeled USB drive placed
    in public for the victim to locate. After using the device or downloading the
    malicious file, the victim’s computer is infected, enabling the criminal to seize
    control of the network.


    # Quid pro quo


    Quid pro quo is a Latin phrase meaning something for something. In this scenario,
    the victim receives a reward in return for information. An excellent example is
    hackers posing as IT assistants. They will phone everyone they can locate at a
    corporation and claim they have a fast remedy to solve all the IT issues that
    requires disabling antivirus software. Whoever falls for it will have ransomware
    installed on their computer.


    # Tailgating


    This is a technique employed by social engineers to obtain entry to a building
    or other secured location. A tailgater waits for an authorized user to open and
    pass through a protected entrance before following them through.


    # Honeytrap


    This is a type of deception where the attacker poses as an attractive person and
    engages in a relationship with the victim to eventually persuade them to share
    sensitive information. This is taken from classic espionage techniques in which
    attractive women were used to obtain secrets


    Usually the lady will somehow seduce the victim to tell more than allowed (passwords,
    insider news, and similar). This is taken from classic espionage techniques in
    which a genuine woman was used.


    # Rogue


    Also known as a rogue scanner, rogue anti-spyware, rogue anti-malware, or scareware,
    rogue security software is a kind of computer virus that induces users to pay
    for the phony or simulated eradication of malware. In recent years, malicious
    security software has become a major and severe danger to desktop computer security.
    This application is quite popular, and there are practically hundreds of them.


    # Vishing


    Vishing draws its name from the combination of two words: voice and phishing.
    A vishing assault is similar to phishing, only it occurs over the phone or voicemail.
    It is a cybercrime since fraudsters utilize it to get access to victims’ money
    or personal information. For instance, an attacker may attempt to get access to
    a person’s bank account, steal their credit card data, or convince the victim
    to make a wire transfer to them.'
  merge: -1
  img_proc: true
- pgno: 171
  md: '# How does vishing function?


    There is a particular reason why fraudsters are increasingly turning to vishing.
    This form of telephone scam makes use of social engineering, a set of strategies
    that exploit people''s basic emotions, such as trust, fear, greed, or charity.
    The cybercriminal attempts to generate these sensations, inciting fear or other
    emotions that might impair the victim''s judgment, and uses this to steal money
    or sensitive information. For instance, a con artist may attempt to persuade them
    to make a lucrative investment or donate money to someone else, as himself or
    some relatives. In this example, the social engineering technique employed induces
    you to behave hastily, as opposed to analyzing the matter rationally and carefully.
    This can happen on social networks, with the scammer pretending to be in love
    with the victim and then requesting money to meet him/her (this is called a sentimental
    scam).


    # The most prevalent vishing methods


    Cybercriminals often pose as trustworthy individuals, such as bank employees,
    Internal Revenue Service officials, or insurance agents. These fraudsters believe
    that you will trust these individuals enough to grant them access to your accounts
    or your money. In addition, they are very competent at adapting what they say
    on phone calls based on your location, age, and other particular variables. Here
    are some of the most prevalent approaches:


    +   - In one sort of vishing attack, fraudsters phone you to inform you that your
    account has been hacked and is at risk of a cyber assault. The attacker may next
    attempt to persuade you to move funds from your checking account to a more secure
    account, or request your login credentials in order to resolve the issue. A legitimate
    bank would never phone a client to urge them to do such an action, thus it is
    better to hang up immediately. Contact your bank if you have any doubts about
    the status of your account.

    +   - Some con artists may phone you and offer you a loan, a reward, or a fantastic
    investment opportunity. In most cases, these offers seem quite advantageous, thus
    the desire to accept them is great. But don''t be fooled: if a contest you''ve
    never entered requests personal information, you may safely hang up. Remember
    that not everything that glitters is gold; if an offer seems too good to be true,
    then it probably is.

    +   - Tax scams are also popular. Some experienced vishing fraudsters pose as
    revenue agency officials or debt collectors and intimidate victims by discussing
    outstanding taxes and threatening severe penalties. These calls are very annoying
    but do not be afraid. Even if you have ongoing obligations, you should always
    confirm that the collection agency requesting payment is authorized.

    +   - Social security scams are another common example. Cybercriminals pose as
    representatives of a social security or welfare institution in order to get benefits
    or pensions, or to steal money. Seniors are common victims of these scams because
    they often live alone and may be unaware of the perils of phishing. To protect
    your loved ones against these scams, have a conversation with them, explaining
    which types of fraud are most prevalent and encouraging them to never provide
    their private information to strangers, especially over the phone.'
  merge: -1
  img_proc: true
- pgno: 172
  md: '# How to protect against and avoid vishing attacks


    Vishing prevention is not very tough. Following these guidelines can help you
    avoid being a victim of a vishing assault:


    +   - Never provide or confirm your personal information over the phone, especially
    if the caller claims to represent your bank. If the caller were from your bank,
    they would never ask for this sort of information. Simply getting this request
    should prompt you to assume a vishing effort and hang up the phone. Don’t forget
    to notify your bank of the situation.

    +   - Do not answer calls from unfamiliar phone numbers. Allow the answering machine
    to play, listen to the message, and calmly assess the situation. Alternatively,
    if you believe the call may be authentic, call the number again from a different
    phone number. If it was a fraud, there will likely be no response.

    +   - Check whether your country has an opposition registry. By registering your
    telephone number in this register, you will warn sales and marketing companies
    that you do not want to receive so-called cold calls or calls made for commercial
    objectives without your consent. Thus, if you were to get cold calls, it would
    likely be an effort at vishing.

    +   - Do not respond to social media, email, or text communications requesting
    your phone number. This is often how hackers get the details of naïve individuals
    they would later target with a vishing assault.


    # How to identify a vishing effort


    To identify a vishing assault, you must be vigilant for certain warning indications.
    If you receive the impression that the caller is attempting to hurry, manipulate,
    or alarm you, it’s likely a phone scam.


    The first step in avoiding vishing is to hang up on anybody who requests personal
    information, such as your address, bank account information, debit or credit card
    number, or passwords. If someone unexpectedly requests this information, hang
    up. No reputable firm would attempt to get your information in this manner.


    # Smishing


    The name smishing is derived from a combination of the terms SMS and phishing.
    It has all the primary features of phishing (particularly the tactics of deception
    and social engineering) but varies from similarly prevalent email scams by using
    only text messages. The attacker utilizes mobile phones as a platform to entice
    new victims, targeting the sensitive data of the user. Scammers invent a wide
    variety of schemes, but in most instances, they can be traced back to the following
    core objectives: stealing the victim’s money or identity. In SMS scams, sophisticated
    social engineering methods are the most important factor in persuading the victim
    to click on the link at the bottom of the message or engage with it. To do this,
    they attempt to rush the assaulted subject, who will behave illogically due to
    panic and the urge to flee a dangerous situation.'
  merge: -1
  img_proc: true
- pgno: 173
  md: 'Alerts telling the user that their bank account has been hacked or pressing
    them to pay a past-due payment are excellent examples of psychological manipulation.
    In both circumstances, the victim is pressured to act immediately by exploiting
    their fear. Usually, though, if you think about the situation logically, it doesn''t
    make sense. How can you lose money from your bank account and face repercussions
    for non-payment of an invoice simultaneously?


    # Smishing and messaging applications


    More recently, it has become common for computer scams to be carried out via WhatsApp
    and other popular instant messaging applications, such as Signal and Telegram.
    While not technically smishing, we are dealing with a related phenomenon because
    the attacker''s goals are identical: to deceive the victim in order to steal personal
    or bank account information. Taking into consideration the proliferation of instant
    messaging, which, particularly with the introduction of smartphones, has almost
    completely supplanted SMS messages, we might even call it smishing 2.0.


    # How to protect against smishing


    To increase the credibility of the fraud, the attacker will often misappropriate
    the name of a reputable institution or corporation, such as banks, debt collection
    agencies, insurance organizations, and fashion or electronics retailers. Therefore,
    the message is displayed as originating from one of these institutions, and the
    rationale for this is pretty obvious: it enhances the trustworthiness of the received
    information. Additionally, consumers are more likely to believe an SMS sent from
    a reputable and well-known sender than one received by an unknown sender. Smishing
    efforts are quite diverse; however, they may be categorized according to the goals
    they often accomplish. The sender or topic of the message may differ, but not
    its objective. In the following list, we have outlined the primary strategies
    used by cybercriminals to recruit new victims:


    +   - **Click on a link:** In this instance, the message instructs the user to
    click on a link that should lead to a phishing website where they may enter sensitive
    information. Some recent examples of this are a false bank login page that directs
    the user to input their credentials in order to access their bank account. There
    are also examples involving Amazon, e-commerce sites, and insurance corporations.

    +   - **React to a message:** In this instance, the SMS encourages the user to
    reply to the received communication, demanding the entry of certain personal data
    (such as a PIN code or banking credentials).

    +   - **Download an app:** In this instance, the message pushes the user to download
    an external app – fraudulently connected to the company described in the SMS –
    that contains malware in the vast majority of instances.

    +   - **Call the suggested number:** A classic example is asking the victim to
    call a number pretending to be the customer service of a reputable firm. Instead
    of settling a possible issue, the impostor will attempt to get your account details.'
  merge: -1
  img_proc: true
- pgno: 174
  md: '+   - **Download an attachment:** The relevant document that might be an attachment
    can be possibly found on the real company''s website, while the attachment in
    the e-mail may contain malware.

    +   - **Send money:** In this situation, the fraudster poses as an insurance or
    debt collection agency and asks the user to make a wire transfer to the bank account
    information provided in the same SMS, citing outstanding debts.


    In conclusion, we are confronted with a wide variety of scenarios that have three
    characteristics: psychological coercion, dishonesty, and a request to provide
    sensitive information. It is always feasible to defend oneself against these cons;
    just don''t panic, and employ some common sense. If there are any concerns regarding
    the validity of the communication, a simple phone call to the customer care department
    of the participating firm (the genuine one, this time) will clear them up. In
    addition, as every credit institution notes, consumers are never requested to
    provide personal access information through SMS, email, or telephone.


    # Have you got a M.A.P.P.?


    What exactly is a **M.A.P.P.**? It is an abbreviation for **Mitigation and Prevention
    Plan**. Now, we will understand the meaning of M.A.P.P. We need one of these to
    prevent and prepare for social engineering attacks. You can easily set up a M.A.P.P.
    by following these four steps:


    +   - Learn how to recognize social engineering attacks (by creating a team of
    professional and requesting a third-party company, able to simulate social engineering
    attacks, to create a real-world scenario)

    +   - Develop realistic and implementable policies

    +   - Conduct periodic real-world audits

    +   - Implement applicable security awareness programs


    # Step 1 – learn how to recognize social engineering attacks


    Although this first step seems obvious, it is not. How many individuals in your
    organization are able to define phishing, vishing, smishing, and impersonation
    attacks? How many people do you believe are aware of how risky it is for an attacker
    to get the identity of your trash vendor? How many of your employees do you believe
    are familiar with malware, ransomware, and Trojans?


    Do not misunderstand; I am not suggesting that every employee must have advanced
    cybersecurity knowledge. Everyone in your company must simply comprehend that
    these *bad guys* could possibly attack your organization. Understanding what assaults
    are, what they may look like, and what they may do to you is an essential first
    step.


    You may be wondering, *How can we accomplish this?* That is an excellent question.
    What many years (24, to be precise) of working in cybersecurity has taught me,
    and what you should anticipate from a social engineering specialist, is how to
    spot and withstand a social engineering *attack*.'
  merge: -1
  img_proc: true
- pgno: 175
  md: 'This initial step of learning how to recognize and acknowledge the existence
    of these assaults will put your team light-years ahead of an ordinary organization.
    Help your employees understand the value of the information they possess—that
    emails can be used to breach the entire organization; phone calls are used to
    obtain passwords and other sensitive information; if their mobile device is compromised,
    it can be used to attack their home and work networks; and just because a person
    is smiling and friendly, it doesn’t mean you can ignore the badge policy.


    Your workforce may be made more vigilant by educating them about potential assaults.
    Because I deal with kind of menaces everyday, I sometimes forget that not everyone
    is aware of these assaults.


    Just a few days ago, my ex-wife texted me that an older friend of hers was scammed
    by *General Eric Hill* on Facebook, who claimed he was in need of money and asked
    her for $3,000 and to take a safe deposit box from a bank where he would then
    deposit his portfolio through a UN diplomat. Of course, this was all a fabrication.
    My ex-wife’s friend transferred the fraudster the money and retrieved the safe
    deposit box but didn’t receive anything in return.


    Learn from this situation. Do not presume that understanding these assaults is
    just common wisdom. If someone is a victim of social engineering, it does not
    always indicate that they are foolish, worthless, and doomed to fail. Instead,
    demonstrate compassion and consider, *Okay, we can do better next time. How can
    we I improve tomorrow?* That will greatly enhance the success of the following
    step.


    # Step 2 – develop realistic and implementable policies


    In the realm of security, policy may seem like a dirty word. Most individuals
    dislike creating, enforcing, and/or adhering to rules. Policies often have a negative
    reputation because they are illogical or unclear in their aim. Occasionally, rules
    are so restricted that people simply ignore them.


    Creating a safe workplace with a culture of security awareness requires striking
    a balance. Policies must be firm, but they cannot be monoliths, which are not
    simple at all. However, achieving this balance is vital for success.


    What constitutes a good policy? It should not be too restrictive and be actionable
    and attainable. There are a few components of a fantastic policy that we will
    discuss next.


    # *Remove the thinking from policies*


    Too often, policies are so broad that they place an excessive amount of thought
    or decision-making in the hands of an individual who has not yet been trained
    on these matters. Now, I’m not suggesting that you should treat your employees
    like idiots. Simply understand that the less time an employee needs to spend contemplating
    anything, the better. The simplest solution is the best one.


    Here’s one example: An organization performed vishing exercise or a significant
    financial institution, and more than 80% of the time, they were successful in
    obtaining very sensitive information about the targets. They exploited their targets
    using empathy and trust by playing on these qualities.'
  merge: -1
  img_proc: true
- pgno: 176
  md: 'To the credit of this financial institution, they had incredibly pleasant staff,
    and the social engineering company didn’t want that to change. How awful would
    it be if the mitigating suggestion was *make your staff more suspicious and mistrustful*?
    The social engineering testing firm came up with a reasonable solution. They established
    an actual, executable policy: *You may not disclose any information to unauthenticated
    people.*


    And they continued from there. They established both what constitutes valuable
    information and how to properly authenticate people. Then, they did something
    else that made a tremendous difference: they blocked their employees’ ability
    to advance in their career if they did not answer security related questions correctly.


    Let’s have an example: Assume that a pregnant consultant working in an IT company,
    carrying a box of devices, needs to get into the server room. If there is someone
    else nearby who has server room access, you can bet he or she will take the box
    and open the door, letting her into the room, without checking whether the lady
    is authorized by a badge or similar.


    In this case, a policy stating that IDs must be verified at server room only can
    easily be bypassed, because empathy for a person in need exceeds any other aspect.
    So, without forgetting empathy, a company can state that ID check must be done
    at the reception, so the lady’s identity can be verified in a proper way. Never
    forget that humans are filled with emotions, reasoning, education, and belief
    that causes them to mostly take decisions considering this.


    # *Make policies practical and realistic*


    I have personally seen rules stating *do not click on harmful links*. How does
    that sound to you? If you are saying, *Yeah, that’s great—I’m going to utilize
    that*, I want you to put this book down and slowly hit yourself in the face with
    the back cover.


    This kind of policy is poor since it lacks sufficient clarity for the employee.
    How do they identify harmful links? Are they aware that `support-google.com` is
    distinct from `Google.com`?


    The policy is devoid of an *if* clause. Upon clicking the link, what happens?
    This policy is missing a section that reads *Please contact xxxxxx@company.com
    if you believe that an email, phone conversation, or in-person interaction did
    not go according to policy.*


    However, there is more! Now, you must instruct your staff on how to properly report
    the incident, including forwarding the email and passing on the caller ID information.
    What specifics should be reported? What are the repercussions of reporting?


    A realistic policy aids the employee in seeing the subject from all sides and
    leaves no room for doubt. At one organization I worked with, I assisted in the
    creation of a new phishing policy education program. It went roughly as follows.


    Phishing is a hazard to your organization and to you individually. Email-based
    assaults are used by malicious attackers to get personal information. They may
    use malicious files with extensions such as'
  merge: -1
  img_proc: true
- pgno: 177
  md: '.exe, .pdf, .xls, or .doc. Or, they may give you links to websites that are
    not what they claim to be and that include malware or other malicious software.


    If you get an email from an unknown source, forward it to abuse@company.com before
    taking any action by clicking FORWARD and entering abuse@company.com in the TO
    field.


    Within 24 hours, someone from that department will let you know whether this email
    is secure.


    If you’ve already clicked on a link or opened an attachment that you believe may
    have been malicious, it’s not too late to remove it. Report the email to the department
    of abuse.


    Obviously, the policy included further information and connections to internal
    training and other resources. You get the point, though. A good policy is based
    on reality and provides clear advice about what actions are important to take
    and what to avoid.


    A good policy helps the individual understand not just the what, but also the
    why. Eventually, if done correctly, your workforce will develop muscle memory
    for these actions.


    # Step 3 – conduct periodic real-world audits


    You have educated your people about the nature of these assaults. Your workers
    have received training on how to respond to these types of assaults. You have
    established rules to assist them in taking the optimal action in the event of
    an assault. Now, how well did you retain all of this information? Will the workers’
    muscle memory kick in when they are tested? The only way to determine this is
    to choose the best security consulting partner and work with them.


    Selecting the right training partner is crucial. Remember that isn’t important
    how cool is the company you choose, but their expertise and how they want to help
    to leverage the security posture.


    How can you determine whether the prospective spouse is a good match? Here are
    some recommendations:


    +   - Ask excellent questions.

    +   - Don’t be hesitant to inquire about past employment or how the organization
    suggests handling a certain scenario. Is the response consistent with your basic
    values?


    It is necessary to teach individuals about their wrongdoings, retest them after
    education, and then evaluate whether they posed a danger to the business, but
    it is a horrible idea to routinely fire individuals for failing.


    Clearly establish the regulations. As a customer, nothing is worse than assuming
    that a pentest would only go one layer deep, only to discover that the pentester
    got five levels deep and you must now explain what occurred to your boss. The
    easiest method to guarantee that there are no issues is to have a properly defined
    set of test criteria so that no limits are crossed. Clearly stated regulations
    are comparable to the protective gear used by boxers during sparring.'
  merge: -1
  img_proc: true
- pgno: 178
  md: 'As a customer seeking a pentester, you may have more criteria for selecting
    a vendor, but these are a solid starting point to guarantee you get the ideal
    sparring partner.


    After selecting a partner, you should begin testing and then use the findings
    to decide what services you need and how often you will be evaluated. A trustworthy
    partner can help you evaluate your requirements and will be straightforward about
    them (rather than basing them on dollar signs).


    Some services, such as phishing testing, are best performed monthly. Other services,
    such as penetration testing, perform well as yearly or semi-annual services. But
    there is no one-size-fits-all solution; it depends on your demands and how you
    want to achieve your objectives.


    # Step 4 – implement applicable security awareness programs


    Perhaps you’re wondering, *Didn’t you just discuss security awareness? Are you
    repeating yourself?* Actually, no; not at all. All prior phases are a component
    of your security awareness program, but this step focuses on how successfully
    you utilize the previous three steps to develop meaningful, practical, and relevant
    programs.


    Some companies have a comprehensive strategy for both teaching employees about
    vishing and phishing and ensuring their vishing education was comprehensive. IT
    educates staff about assaults, provides them with realistic situations and true
    procedures, and frequently tests them in a secure environment, but can have weaknesses
    in other parts, such as a phishing program.


    If you feel that your company needs assistance with your awareness program, do
    not look for companies that want to create a new program from scratch, but find
    a company that is able to adapt what you have already to make it updated and comprehensive,
    based on the preceding three steps.


    # Summary


    In this chapter, we looked deeply into social engineering, including techniques,
    and for some of them, we gave you a deep understanding of how to avoid them; most
    importantly, we gave you some hints on how to implement a social engineering program
    and why your organization needs one.


    In the next chapter, we will go through vulnerability assessments and pentesting.'
  merge: -1
  img_proc: true
- pgno: 179
  md: '# 10


    # The Cloud


    > *There is no cloud; it''s just someone else''s computer.*


    Of course, the preceding sentence is a sort of nerdy joke but isn’t really far
    from the truth.


    While in the previous chapter, we delved into social engineering and checking
    various aspects of it, it’s now time to understand how the cloud works, focusing
    on cloud security and privacy.


    In this chapter, we will cover the following topics:


    +   - How did the cloud emerge?

    +   - The seven pain points of cloud computing

    +   - Cloud and GDPR concerns

    +   - The GDPR code of conduct for **Cloud Service Providers (CSPs)**, that is,
    the companies offering services as storage over the internet


    # How did the cloud emerge?


    Due to the proliferation of gadgets such as smartphones, tablets, and laptops,
    we can now access the internet from almost anywhere, with all the advantages and
    disadvantages that this may involve. Occasionally, you may create a file on your
    home computer but forget to bring it with you to the office the following day.
    Sometimes, though, you may find yourself with many copies of the same file and
    be unable to determine which copy is required. In a worst-case scenario, you may
    lose your smartphone, tablet, or laptop with all of your information, or even
    worse, your preferred gadget could suddenly cease to function. So, collaboration
    is the keyword here.'
  merge: -1
  img_proc: true
- pgno: 180
  md: '# What exactly is the cloud? How does it work?


    To solve these and other similar issues, the cloud was created. The cloud is nothing
    more than a personal storage space, sometimes referred to as cloud storage, which
    is accessible from any location with an internet connection. It should be noted,
    however, that in addition to cloud storage, the word cloud can also apply to various
    services provided by cloud computing.


    From a compliance perspective, according to NIST, “Cloud computing [is] a model
    for enabling ubiquitous, convenient, on-demand network access to a shared pool
    of configurable computing resources (e.g., networks, servers, storage, applications,
    and services) that can be rapidly provisioned and released with minimal management
    effort or service provider interaction,” while the German government adheres to
    an attestation scheme (also roughly adopted in France) by the Federal Office for
    Information Security (BSI). The standard is named the Cloud Computing Compliance
    Controls Catalogue (C5). They claim that “Cloud computing is a new paradigm in
    ICT (information and communication technology). It consists of IT services being
    adjusted dynamically to the customers need and made available through a network
    in a billable manner.” Also, new associations have appeared to support the cloud
    experience (in Europe at least), such as the Cloud Security Alliance (CSA) (https://cloudsecurityalliance.org/)
    and, more recently, the European Cloud User Coalition (ECUC) (https://ecuc.group/)
    which, with no costs, “aims to promote a structured dialog between cloud users,
    providers, and other parties.”


    Cloud storage just synchronizes all of your favorite data in a single location,
    providing the benefit of re-downloading, altering, deleting, and/or upgrading
    it without the need to carry external hard disks, a USB drive, or any other item
    that is generally susceptible to loss or forgetfulness. In addition, with cloud
    storage, you will have the option of creating backup copies and sharing all of
    your favorite files with anyone you want, for as long as you want, with undeniable
    benefits in terms of time and convenience. Of course, where there are benefits,
    there are also hassles; let’s go a bit into detail now.


    # What is cloud security?


    Cloud security refers to the set of technologies, protocols, and best practices
    that allow you to protect data and information in a cloud architecture.


    Cloud security is a shared responsibility. On the one hand, cloud service providers
    must guarantee an adequate and protected infrastructure. On the other hand, users
    must also use it correctly and implement adequate measures, as they too are responsible
    for protecting the applications and data managed.


    Cloud security can differ depending on the type of cloud service and the deployment
    model. Let’s clarify immediately, seeing an overview of the main ones.'
  merge: -1
  img_proc: true
- pgno: 181
  md: '# Types of cloud services


    Cloud services consist of infrastructures, platforms, or software hosted by external
    providers, and the various services are made available to the user via the internet.
    The types of cloud computing can be mainly divided into three categories:


    +   - **Infrastructure as a Service (IaaS)**: The service provider manages the
    infrastructure (i.e., the physical servers, networks, virtual machines, data storage,
    and operating systems) on behalf of the customer, via an internet connection.
    It is up to the customer to secure what is added to the operating system and to
    manage the access, devices, and networks of end users.

    +   - **Platform as a Service (PaaS)**: This is designed for developers and programmers.
    With this service, a host is provided to customers who can create and host their
    own applications, without having to create and manage the infrastructure of servers,
    storage, networks, and databases.

    +   - **Software as a Service (SaaS)**: Here, the customer is provided with access
    to software applications managed by the cloud service provider, without the need
    for a computer or server. The customer can access online services (without necessarily
    having to install an app on the computers of individual users) by checking the
    software configuration but without managing the infrastructure (examples of SaaS
    include Microsoft Office 365, Dropbox, iCloud, and apps by Google).


    # Distribution models


    In addition to the type of cloud service, the cloud computing distribution model
    is then defined. In this case, the main distribution methods are as follows:


    +   - **Public model**: Cloud services are made available by an external provider
    and are available to anyone, free or paid. Some examples include Microsoft Azure
    and Amazon Web Services.

    +   - **Private model**: Cloud services are made available for access by a single
    organization, via the internet or a private internal network. The private cloud
    can be managed by an external provider or even internally by the company itself.

    +   - **Hybrid model**: Cloud services are provided by combining private clouds
    (third-party or in-house) with public clouds as needed, taking advantage of the
    best of both infrastructures.

    +   - **Other models**: These include community cloud, multi-cloud, poly cloud,
    and HPC cloud. Without going into detail, suffice it to say that – in addition
    to the aforementioned – there are also other less popular solutions that can be
    used as needed.'
  merge: -1
  img_proc: true
- pgno: 182
  md: '# Cloud security – examples of measures that can prevent risks


    Cloud security, as anticipated, concerns a set of strategies aimed at achieving
    multiple objectives. This includes archiving and network protection against cyberattacks,
    recovering any lost or stolen data, and generally reducing the impact of compromised
    systems or personal data breaches.


    Too often, migrations to the cloud are carried out without first evaluating which
    data and processes to move and without having defined cybersecurity measures suitable
    for your specific case.


    Everything must start, therefore, from the awareness of how data has been secured
    up until now, of the infrastructures used, and of the weak points on which it
    is necessary to intervene. Therefore, have a snapshot of the current situation
    to evaluate which cloud service offers adequate levels of security and plan an
    adequate migration strategy.


    Depending on the case and the needs, there are different tools that a company
    can implement for solid cloud security. Here are some examples:


    +   - An **Identity and access management (IAM)** system, for identity and access
    management

    +   - Micro-segmentation, thanks to which the implementation of the cloud is divided
    into distinct segments, down to the level of a single workload, minimizing the
    damage of a possible attacker

    +   - Next-generation firewalls – compared to traditional ones, they add advanced
    features, such as application-aware filters, deep packet inspection, and intrusion
    prevention systems

    +   - Cryptography so that data can only be decrypted using a specific key

    +   - Threat intelligence, monitoring, and prevention, or features aimed at analyzing
    traffic to identify, block, or at least mitigate a malware attack


    # The seven pain points of cloud computing


    Security is an issue for all firms, regardless of whether they operate in the
    cloud. You will be exposed to threats such as denial of service, malware, SQL
    injection, data breaches, and data loss – all of which may severely affect your
    company’s reputation and financials.


    Moving to the cloud introduces a new set of hazards and modifies the nature of
    others. This does not imply that cloud computing is insecure. In reality, many
    cloud service providers provide access to very advanced security technologies
    and resources that you would not have otherwise.


    It simply implies that you must be aware of changing hazards in order to manage
    them. Consequently, let''s examine the particular security vulnerabilities of
    cloud computing.'
  merge: -1
  img_proc: true
- pgno: 183
  md: '# Reduced visibility


    The majority of businesses will access a variety of cloud services through numerous
    devices, departments, and geographic locations. Without the proper tools, this
    level of complexity in a cloud computing arrangement might lead you to lose awareness
    of access to your infrastructure.


    Without the proper procedures in place, it is possible to lose track of who is
    using your cloud services, including the information they access, post, and download.


    Just remember, an asset in the cloud may not be visible. And if it is not visible,
    it cannot be protected, increasing the likelihood of data loss and data breaches.


    Of course, the same or similar controls that apply to on premises are applied
    to the cloud.


    # Compliance violations


    With the expansion of regulatory oversight, you must comply with a variety of
    strict compliance criteria. If you are not cautious, migrating to the cloud might
    expose you to compliance issues.


    Many of these requirements require your organization to be aware of the location
    of your data, who has access to it, how it is handled, and how it is safeguarded.
    Other requirements may say that your cloud service provider needs to possess certain
    compliance certifications.


    Transferring data inattentively to the cloud or migrating to the incorrect provider
    might place your firm in a position of non-compliance, introducing the possibility
    of severe legal and financial consequences (we spoke already of data transfer
    and Schrems II sentences, in Chapter 4, Data Processing).


    # Absence of a strategy and architecture for cloud security


    You can simply avoid this cloud security risk, but many do not. In their rush
    to shift systems and data to the cloud, many firms become operational before the
    security mechanisms and plans to defend the infrastructure are in place.


    Ensure that you create a cloud-specific security policy and architecture before
    deploying your systems and data to the cloud.


    # Internal threats


    Your most trusted workers, contractors, and business partners may pose the greatest
    security threats. These internal risks may bring harm to your organization, even
    without malice. In truth, the majority of insider occurrences are the result of
    inadequate training or carelessness.


    Despite the fact that you now encounter this difficulty, switching to the cloud
    modifies the danger. When you transfer over management of your data to your cloud
    service provider, you create a new level of insider danger posed by the company''s
    personnel.'
  merge: -1
  img_proc: true
- pgno: 184
  md: '# Contractual violations


    Any contractual relationships you have will have constraints on the use, storage,
    and allowed access of any shared data. Inadvertently transferring limited data
    to a cloud provider without authorization might constitute a contract violation
    and result in legal action.


    Make sure you read the terms and conditions of your cloud provider. Even if you
    have permission to transfer data to the cloud, several service providers reserve
    the right to share any data uploaded to their infrastructure. You may accidentally
    violate a non-disclosure agreement due to ignorance.


    # Unprotected user interface (API)


    When running systems on a cloud infrastructure, you can implement control via
    an API. Any API included in your web or mobile apps may be accessed both internally
    and externally.


    An external API may create a security risk to the cloud. Any unsecured external
    API provides thieves with unauthorized access to steal data and modify services.


    The Facebook–Cambridge Analytica scandal is the most notable instance of an unsafe
    external API. Cambridge Analytica gained extensive access to Facebook user data
    through Facebook’s unsecured external API.


    # Errors in the configuration of cloud services


    Another possible cloud security concern is cloud service misconfiguration. This
    is a developing concern as the breadth and complexity of services expand. A misconfiguration
    of cloud services may result in data being exposed to the public, altered, or
    even erased.


    Common reasons include retaining security and access control settings by default
    for extremely sensitive data. Others include mismatched access management, which
    gives unauthorized users access, and twisted data access, in which personal information
    is left accessible without authorization.


    # Cloud and GDPR concerns


    Although the GDPR takes a risk-based approach to data protection, it makes no
    mention of the cloud directly. The regulation, on the other hand, is technology-neutral
    in that it applies regardless of the method used to treat personal data. The fragmented
    processing environment of the cloud, where such standards may not always apply,
    makes it difficult to implement the GDPR. The challenges are broken down in some
    detail in the following sections.'
  merge: -1
  img_proc: true
- pgno: 185
  md: '# Security concerns specific to the cloud


    The **European Data Protection Supervisor (EDPS)** and the **European Union Agency
    for Network and Information Security (ENISA)** have stated that the specific features
    and processes linked to the different service and deployment models of a cloud
    infrastructure imply specific risks compared to a “traditional” on-premises data
    center.


    **NIST** defines three service models (SaaS, PaaS, and IaaS) and four deployment
    models: public, private, community, and hybrid (a composition of the former three
    models) cloud environments. Each represents different models of outsourcing with
    disparate security and privacy risks.


    Some of the security tasks (such as monitoring, patching, and incident response)
    are outsourced. Depending on the type of cloud service, some tasks remain under
    the responsibility of the customer, while other tasks remain under the responsibility
    of the provider. Division of responsibilities can sometimes be a major source
    of problems, as it is often based on assumptions and is poorly documented, leading
    to overlaps and gaps. For example, in IaaS/PaaS, the customers run their own code
    on top of the cloud service and often remain responsible for this (application)
    software. In SaaS, on the other hand, the application software is usually under
    the control of the provider.


    Therefore, it is not uncommon for customers to be confused about their responsibilities
    concerning security – that is, which security tasks are outsourced to the provider
    and which security tasks remain under their own responsibility.


    # What effect is GDPR having on the cloud industry?


    Businesses still struggle to comply with the GDPR regulatory criteria nearly 5
    years after the rule was enacted. Additionally, it has become necessary for both
    organizations and cloud service providers to modify their business models as a
    result of the fast use of cloud services by businesses. In order to comply with
    the regulations, they must significantly alter their business practices. GDPR
    lays out specific requirements for data controllers and processors to adhere to
    in Chapter 4, Article 24–43. The regulation outlines the obligations, specifications,
    and guidelines that must be followed when handling personal data. Let''s take
    a deeper look at the specifications listed in that section in order to better
    comprehend the effects of GDPR on data controllers and processors as they apply
    to cloud service providers.


    # Requirements for cloud service providers under GDPR


    When a cloud service provider stores or processes data belonging to EU persons
    on behalf of the data controller, it is said to be *in scope*. A cloud service
    provider and a data controller can become joint data controllers depending on
    how and why the data is processed, which entails additional important duties and
    responsibilities for the data processor. To implement the essential controls and
    specifications for compliance, the cloud service provider must define its function
    in accordance with the regulations established by GDPR.'
  merge: -1
  img_proc: true
- pgno: 186
  md: 'The function role must be identified to make it simple to find the GDPR rules
    that apply. Therefore, defining roles and duties is the first stage in creating
    a suitable data protection policy. Once roles have been defined, the development
    of a data protection strategy is needed for cloud service providers in order to
    execute and manage the relevant GDPR standards.


    # Normative requirements


    The following is a list of specifications that would be applicable to cloud service
    providers, paraphrasing the language of the law:


    +   - Establish guidelines for the handling of personal data

    +   - Establish procedures for processing data and upholding the rights of data
    subjects, such as the right to information, the right to access, the right to
    revoke consent, the right to alter information, and the right to object to the
    processing activities carried out by the cloud service provider

    +   - Establish privacy requirements from the start for anybody handling or controlling
    data

    +   - Create and implement rules for data portability and ownership

    +   - Implement security measures to protect data privacy

    +   - Establish guidelines for the handling of personal data for third parties
    and foreign organizations

    +   - Create policies and processes for handling violations and incidents

    +   - Create policies for the creation of contracts, data retention periods, and
    other necessary needs


    The regulations that apply to cloud service providers with regard to data security
    and compliance are summarized in the following outline:


    +   - **Security control requirements**: Cloud service providers must offer sufficient
    assurances that the necessary organizational and technical safeguards are in place
    to ensure GDPR compliance. Both the controller and the processor must apply the
    necessary steps to provide a degree of security appropriate to risk, which may
    include the following:

    +     - Pseudonymization and personal data encryption

    +     - Continually ensure the privacy, accuracy, availability, and robustness
    of processing systems and services

    +     - In the case of a technical failure or physical attack, immediately restore
    access to and the availability of personal data

    +     - Create a procedure for routinely testing, analyzing, and reviewing the
    efficiency of organizational and technical safeguards for processing security'
  merge: -1
  img_proc: true
- pgno: 187
  md: '+   - Adherence to a recognized code of conduct, as described in *Article 40*,
    or a recognized certification method, as described in *Article 42*, may be used
    as a component to show conformity with standards

    +   - Unless compelled to do so by union or member state law, the data controller
    and data processor must make sure that anyone operating on their behalf and having
    access to personal data does not handle it without the controller''s permission

    +   - **Contractual requirements**: The commercial service contract outlines specific
    responsibilities for cloud service providers’ GDPR and that the following contract
    clauses be included:

    +     - The cloud service provider or its subprocessors may only follow instructions
    from the data controller when processing data

    +     - A guarantee from the cloud service providers about security precautions
    and how *Article 32* GDPR standards will be met

    +     - A list of the subprocessors that the processor uses, together with information
    on how updates to these are handled by the controller

    +     - Information required to prove the cloud provider complies with *Article
    28* of GDPR, as well as how the processor will support the data controller’s audits
    and inspections

    +     - The safeguards in place to ensure the security of personal data handled
    outside the European Economic Area

    +     - The allocation of responsibility between the controller and processor
    in the event of a GDPR violation or personal data breach, as well as how the controller
    should be informed of such incidents

    +     - How the processor is carrying out its responsibilities to uphold the rights
    of data subjects

    +     - How types and categories of personal data are handled at the beginning
    and during transfer, normal processing, and *end-of-life* – including return and
    deletion – as well as the subject matter, extent, nature, context, purpose, and
    length of the processing

    +   - **Documentation requirements:**

    +     - **Data controllers**: Where applicable, each controller shall keep a record
    of processing actions as well as a record including the following information:

    +       - Name and contact information for the controller, joint controller, controller’s
    representative, and data protection officer, if applicable

    +       - Purpose of the processing

    +       - Categories of data subjects and types of personal data are described'
  merge: -1
  img_proc: true
- pgno: 188
  md: '+   - Receivers in foreign nations or international organizations are among
    the categories of recipients to whom personal data has been given or will be given

    +   - Transfers of personal data to a third country or an international organization,
    including the name of the third country or international organization and the
    evidence of appropriate safeguards, as per *Article 49*

    +   - Predicted time limits for erasing the various categories of data, whenever
    possible

    +   - A general overview of the technical and organizational security measures
    mentioned in *Article 32*, whenever possible

    +   - **Data processors.** The following information must be included in each
    processor’s record of all categories of processing actions performed on behalf
    of a controller, when applicable:

    +     - Name, address, and phone number of the data protection officer and any
    other processors

    +     - Categories of processing activities performed

    +     - Transfers of personal data to a third country or an international organization,
    including the mention of the third country or the international organization and
    the proof of the necessary protections, as outlined in *Article 49*

    +     - A general overview of the organizational and technical security measures
    mentioned in *Article 32*


    # The GDPR code of conduct for CSPs


    Cloud service providers and processors are required by GDPR to adopt approved
    codes of conduct or take part in certification or seal programs that have been
    authorized by supervisory authorities, in order to demonstrate compliance with
    GDPR standards. This assists in demonstrating conformity with the regulation,
    offering guarantees and assurances of cross-border transfer safeguards. The creation
    of codes of conduct that support the correct implementation of GDPR is encouraged
    under *Article 40*. The rule makes it clear that the proposed code of conduct
    must include particular elements related to how GDPR must be applied. The following
    ought to be mentioned:


    +   - Fair and transparent processing – controllers’ legitimate interests

    +   - Gathering of personal information

    +   - Anonymization of personal information

    +   - Data made available to the general public and data subjects

    +   - Exercising data subjects’ rights

    +   - Information given to children, their protection, and the process of obtaining
    approval from those who have parental responsibility for them'
  merge: -1
  img_proc: true
- pgno: 189
  md: '+   - Processes and policies mentioned in Article 24 and Article 25, as well
    as the security-related procedures and policies mentioned in Article 32

    +   - Notification of breaches of personal data to supervisory authorities and
    dissemination of such information to data subjects

    +   - Transfer of personal data to international organizations or third nations

    +   - Resolution of processing-related issues between controllers and data subjects
    through out-of-court actions and other dispute resolution processes, while upholding
    all protections for data subject rights under Article 77 and Article 79


    The regulation''s enforcement has made it very clear that no company can shirk
    its obligation to process customer data safely. As previously mentioned, we can
    take into consideration associations such as ECUC (an interest group for **European
    Financial Institutions in Cloud (ECUC)** related questions https://ecuc.group/),
    **BSI – Cloud Computing Compliance Criteria Catalog** (**BSI C5** of the German
    Federal Office for Information Security, https://www.bsi.bund.de/EN/Themen/Unternehmen-und-Organisationen/Informationen-und-Empfehlungen/Empfehlungen-nach-Angriffszielen/Cloud-Computing/Kriterienkatalog-C5/C5_Einfuehrung/C5_Einfuehrung_node.html),
    or **Cloud Security Alliance (CSA**, a cloud computing environment, https://www.cloudsecurityalliance.org)
    for references. Every organization involved directly or indirectly in data processing
    or that has access to the personal data of an EU citizen will be required to comply
    with the legislation, regardless of whether it is outsourced to a third party
    or done in-house. Businesses, particularly data controllers and data processors,
    may incur significant fines for negligence or misunderstanding of these regulations.
    Cloud service providers must be aware of their individual responsibilities and
    tasks under GDPR and keep in mind that compliance with the law and the dangers
    of not doing so must be given top priority.


    # Summary


    In this chapter, we spoke a lot about the cloud, talking about security, risk
    management, the types of cloud, and all the pain points related to it, concluding
    with GDPR. As a consumer, even if you use the cut-down versions of these services,
    usually for free, you''ll find that the main players in the market comply with
    the main standards. From an entity perspective, you could be involved either in
    the adoption of a cloud platform or with a cloud company to create and improve
    a cloud governance program.


    The realm of US privacy will be explored in the next chapter, along with the Federal
    Trade Commission (Section 5) and a review of local privacy laws. Finally, we''ll
    look at two distinct yet related phenomena – **Bring Your Own Device (BYOD)**-
    and remote working.'
  merge: -1
  img_proc: true
