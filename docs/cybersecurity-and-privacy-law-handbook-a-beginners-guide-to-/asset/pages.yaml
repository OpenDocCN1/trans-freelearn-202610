    # 7.5 – Documented information


    Clause 7.5 discusses the obligations for preserving the relevant papers and records
    that support the iSMS’s activities. Formal documentation of when things have been
    approved demonstrates compliance with this provision. For the documented information
    used to develop and manage your iSMS to be useful, it must meet the following
    requirements:


    +   - Be accurate

    +   - Be intelligible to those who use it and assist you in complying with regulatory
    obligations, managing information security risks, and achieving your goals


    Access to documented information is controlled so that it cannot be accidentally
    changed, corrupted, deleted, or accessed by individuals to whom it is not appropriate.
    Information is deleted in a safe way or returned to its owner when this is a requirement,
    and you can track changes to information to ensure that the process is in control.


    Documentation is necessary to guarantee that procedures are executed in accordance
    with the management system’s goals. Documentation defines what you will accomplish
    and gives proof that you have carried out your intentions. The ISO 27001 standard
    does not define the scope of documentation, which is influenced by a variety of
    variables. These consist of the following:


    +   - The complexity and interplay of business processes

    +   - The control environment, sometimes influenced by external duties

    +   - The organization’s size and core activities

    +   - The qualifications of personnel

    +   - Other legal or regulatory requirements


    Always develop documents with the intended audience in mind. The documentation
    must be beneficial to the people who will use it. Organizations are required to
