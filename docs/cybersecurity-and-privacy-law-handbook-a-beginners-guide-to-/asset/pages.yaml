- pgno: 85
  md: '# Security Planning and Risk Management


    After the last few chapters in which we spent lots of time and effort dealing
    with the issue of privacy, it’s time to get back to cybersecurity. This time,
    we are going to move to something called **risk management**. But, before moving
    into risk management, we need to understand the basics by learning a bit of the
    jargon as well as considering what the real menaces to security in an entity can
    be.


    In the next few pages, we will cover topics such as security threats, challenges,
    and risk management in depth. If you want to know more about the subject, I strongly
    suggest you obtain a book specifically focusing on the topic.


    In this chapter, we will explore the following topics:


    +   - Security threats and challenges

    +   - Implementing a risk management program


    # Security threats and challenges


    Information security risk management is the continuous process of identifying,
    resolving, and preventing security problems. Risk assessment is a fundamental
    component of an organization’s risk management method, meant to ensure adequate
    data system and data security levels.


    We can define risk as anything that threatens or restricts an organization’s capacity
    to carry out its objective. Risk management should be a collection of ongoing
    and evolving procedures employed across an organization’s strategies and should
    systematically manage hazards surrounding past, current, and future endeavors.


    The information security threats that a business faces will vary based on the
    characteristics of the processing employed and the sensitivity of the data handled.
    To create a safe computing environment quickly and effectively, it is necessary
    to comprehend risks and the software of risk assessment techniques.'
  merge: -1
  img_proc: true
- pgno: 86
  md: 'Risk assessment is the process of identifying vulnerabilities and threats to
    the data resources used by an organization to achieve its business objectives
    and determining what countermeasures, if any, should be taken to reduce the risk
    to an acceptable level. The value of the data resource to the organization determines
    which countermeasures should be taken. Successful risk management requires the
    effort of all levels of an organization''s management


    # What are the different types of security threats?


    There are several cyber threats that may result in assaults. Malware is among
    the most significant danger vectors. It has drastically developed over the last
    several years, compromising both endpoint and server systems. In addition to giving
    an attacker complete control over a computer, ransomware may encrypt data and
    only unlock it upon payment of a ransom.


    Malware is often a component of an additional prevalent security threat: hacking.
    Hackers obtain access to the internal systems of a corporation, either for a one-time
    assault or for a prolonged campaign in which they lurk for an extended period
    and collect information at their leisure. The latter is regarded as an **Advanced
    Persistent Threat (APT)**.


    Other assaults, such as a **Distributed Denial of Service (DDoS)**, hinder an
    organization''s online operations by sabotaging its resources. As botnets, these
    assaults often originate from millions of hacked machines.


    # What is risk and what is a threat?


    What is the difference between a risk and a threat?


    Risk management is the process of guarding against risks. Risks and threats are
    intertwined, yet it is essential to recognize their major distinctions.


    *A threat is simpler to define* since it pertains to the negative event that might
    occur inside an organization. A *risk*, on the other hand, may be a difficult
    notion to understand; *it is the probability that something will occur*, together
    with its potential consequences. It does not necessarily indicate that the event
    will occur.


    It is advantageous for administrators and **managed security service providers
    (MSSPs)** to be able to quantify the amount and location of a company''s risk.
    Understanding this degree of risk can help you prioritize what to protect inside
    the business and choose how to allocate security expenditures.


    Some security experts utilize a security risk calculation to assist arrive at
    a precise number:


    *Risk = Threat x Vulnerability x Consequence*


    This definitely wouldn''t hold up in a math class, but it provides you with a
    general understanding of how people assess the probability and effect of risks.'
  merge: -1
  img_proc: true
- pgno: 87
  md: 'In this method of calculating a security risk, the vulnerability is the organizational
    flaw that enables an attacker launch an attack on the company. A company’s failure
    to correctly install a firewall, for instance, might make it simpler for a hacking
    attack to succeed. Operating a business on Windows XP, which is no longer supported
    and consequently impossible to patch, might make it simpler for an adversary to
    undertake a malware-related assault.


    Certain vulnerabilities are more susceptible to assault than others. Some vulnerabilities
    may be simpler to find and exploit than others, reducing the barrier for attackers.


    Some vulnerabilities may be less detrimental to the company if exploited than
    others. Each exploit may have a technical effect on the availability, confidentiality,
    and integrity of data. These three elements are referred to as the CIA triad.


    For instance, a DDoS assault may temporarily render data inaccessible, but an
    attacker would likely be unable to modify or take that data. Malware, though,
    may enable an attacker to do all three.


    In turn, the technological impact affects the company. Depending on the nature
    of the vulnerability and the threat, the effect on the company might vary from
    negligible to catastrophic.


    For instance, an assault that temporarily blocks service to a seldom-used and
    isolated portion of a system may go unnoticed. In contrast, an assault that successfully
    steals sensitive customer data might have severe legal, financial, and reputational
    ramifications for a firm. If clients’ social security numbers and health information
    appear on websites similar to Pastebin, regulators and class action attorneys
    will take a keen interest.


    Sometimes, substantial repercussions are far from evident. What damage, for instance,
    might an attacker do by eavesdropping on obscure robotic process data at a manufacturing
    facility? Quite a bit, if they can modify that data to cause robots to generate
    faulty goods.


    The process of determining the degree of risk a business confronts may also be
    automated; some software allows you to assign a monetary value to this risk. It
    does this by scanning for unprotected data throughout a network, including persistent
    storage, and estimating an organization’s potential financial exposure in the
    case of a data breach.


    Companies must take these threats seriously, which necessitates refining their
    IT risk management approach.


    Looking at the multitude of cybersecurity risks without any context may be both
    confusing and intimidating. Instead, businesses may analyze risk probability and
    effect by categorizing and evaluating risks. This entails instituting an IT risk
    management procedure to assist you in assessing cybersecurity threats across the
    whole firm.


    Administrators and MSSPs should begin their study by focusing on high-impact factors,
    such as ransomware, when conducting this kind of evaluation. You must examine
    what would occur if the organization’s security were broken by using ransomware;
    would it be only a little nuisance while they restored everything from a backup
    or a massive catastrophe? Considering attack scenarios in'
  merge: -1
  img_proc: true
- pgno: 88
  md: 'this manner gives a potent point of reference, enables the creation of a risk
    threat vulnerability matrix based on this assessment, and helps in the prioritization
    of investments.


    Dealing with cybersecurity risks may be difficult, but it does not have to be
    as expensive as you might think. By carefully considering the impact of various
    threats on your risk, you can prioritize the protection of your organization’s
    most vital assets and stay one step ahead of attackers.


    This has important ramifications for MSSPs, as it provides them with an important
    starting point for security conversations with prospective clients by examining
    the real business impact of having systems go down or data stolen—and even considers
    whether the business could be used as a conduit to gain access to other partners’
    systems.


    By moving the dialog in this manner from security to risk, MSSPs position themselves
    to have a far more useful and effective conversation with their prospects.


    # Implementing a risk management program


    An effective risk management program assists a business in evaluating the whole
    spectrum of threats it confronts. Risk management also identifies the link between
    risks and the cascading effects they might have on the strategic goals of a company.


    This comprehensive approach to risk management is known as **enterprise risk management
    (ERM)** since it focuses on predicting and comprehending risk throughout a business.
    In addition to a focus on internal and external risks, ERM highlights the need
    to manage positive risks.


    Positive risks are opportunities that, if seized, may increase the value of a
    corporation or, if ignored, can harm it. In fact, the goal of a risk management
    program is not to eliminate all risk, but rather to protect and increase corporate
    value by making prudent risk choices.


    The following categories are the three forms of risk management:


    +   - **Project risks**: Multiple types of financial, scheduling, human, resource,
    and user-related issues constitute project risks. Schedule slippage is a primary
    project risk. Because software is intangible, monitoring and controlling a software
    project is difficult. It is difficult to govern something that cannot be identified.
    For some manufacturing programs, such as the production of automobiles, the plan
    executive may identify the product taking form.

    +   - **Technical risks**: This includes possible difficulties, installation,
    interface, testing, and upkeep challenges. It also consists of a vague specification,
    an incomplete specification, a specification that is constantly changing, technological
    ambiguity, and technical obsolescence. Due to the development team’s lack of project
    expertise, there are a number of technical dangers.

    +   - **Business risks**: This includes the possibility of creating an exceptional
    product that no one wants, failing to meet financial or personnel obligations.'
  merge: -1
  img_proc: true
- pgno: 89
  md: '# Why is risk management so important?


    Possibly, risk management has never been more crucial than it is today. Due to
    the fast speed of globalization, the risks faced by contemporary enterprises have
    become increasingly complicated. Constantly, new threats emerge, often resulting
    from the extensive use of digital technology. Climate change has been termed by
    risk specialists as a *danger multiplier.*


    The coronavirus pandemic, a recent external risk that manifested as a supply chain
    issue at many companies, rapidly evolved into an existential threat, impacting
    the health and safety of their employees, the means of conducting business, the
    ability to interact with customers, and corporate reputations.


    Businesses made swift adaptations in response to the pandemic’s risks. In the
    future, however, they face additional risks, such as whether or not to bring staff
    back to the office and how to make their supply networks less sensitive to disasters.


    As the globe continues to grapple with COVID-19, corporations and their boards
    are reevaluating their risk management systems. They are reevaluating their risk
    exposure and analyzing their risk management methods. They are also reevaluating
    who should participate in risk management. Companies that now use a reactive approach
    to risk management—protecting against previous dangers and modifying processes
    when a new risk causes damage—are evaluating the competitive benefits of a more
    proactive strategy. Supporting sustainability, resilience, and corporate agility
    is gaining popularity. Companies are also investigating how advanced **governance,
    risk, and compliance** (GRC) systems and artificial intelligence technology may
    enhance risk management.


    In financial institutions, for instance, there is the role of the **chief risk
    officer** (CRO), despite the fact that banks and insurance corporations have maintained
    huge risk departments for decades. In addition, the risks faced by financial services
    organizations tend to be anchored in statistics and can thus be quantified and
    successfully examined using established technology and procedures. Risk situations
    in financial institutions may be accurately predicted.


    The need for a thoughtful, rigorous, and consistent approach to risk management
    increases as qualitative risk becomes more difficult to manage in other sectors.
    Enterprise risk management strategies are designed to assist firms to manage risk
    as intelligently as possible.


    Of course, this is still a preamble. But now we can continue with more exciting
    discussions around risk management, starting with the difference between traditional
    risk management and enterprise risk management.


    # Traditional risk management versus enterprise risk management


    Enterprise risk management has a reputation for being superior to traditional
    risk management. Both techniques seek to reduce potential threats to companies.
    Both purchase insurance to protect against a variety of dangers, from fire and
    theft losses to cyber liability. Finally, both correspond to the recommendations
    of the main standards organizations. Experts say that conventional risk management'
  merge: -1
  img_proc: true
- pgno: 90
  md: 'lacks the attitude and processes necessary to comprehend risk as an inherent
    component of corporate strategy and performance.


    In conventional risk management programs, risk has traditionally been the responsibility
    of the company executives in charge of the risk-bearing divisions. For instance,
    the CIO or CTO is accountable for IT risk, the CFO for financial risk, the COO
    for operational risk, and so on. Even if the business divisions have sophisticated
    procedures in place to manage their different sorts of risks, the organization
    might run into difficulties if it fails to see the links between risks or their
    cumulative influence on operations. Traditional risk management is generally reactive
    as opposed to proactive.


    The pandemic is a perfect example of a risk that is simple to overlook if you
    do not have a comprehensive, long-term strategic perspective of the kind of risks
    that might harm your firm. Many businesses will look back and say, “You know,
    we should have known about this or at least considered the financial consequences
    of such an event before it occurred.”


    Risk management in enterprise risk management is a collaborative, cross-functional,
    and holistic endeavor. An ERM team, which may consist of as few as five individuals,
    collaborates with business unit executives and employees to debrief them, assist
    them in using the appropriate tools to evaluate risks, compile the data, and deliver
    it to the organization’s senior leadership and board. Risk leaders of this type
    must have credibility with executives across the organization.


    Increasingly, these sorts of professionals come from consulting experience or
    have a consulting mentality, and possess a profound grasp of the mechanics of
    business. In contrast to traditional risk management, in which the head of risk
    typically reports to the CFO, the heads of enterprise risk management teams—whether
    they hold the title of chief risk officer or another title—report to their CEOs,
    indicating that risk is an integral component of business strategy.


    Another characteristic of conventional risk management groups is an aversion to
    risk. However, businesses that self-identify as risk-averse and have a low-risk
    tolerance are not always accurate in their risk assessment.


    In the following figure, you can see the most important factors related to risk
    exposure:


    | Question | Description |

    |---|---|

    | What is risk exposure? | Risk exposure is the quantified potential loss from
    business activities currently underway or planned |

    | How is calculated? | The level of risk exposure is calculated by multiplying
    the probability of a risk incident occurring by the amount of its potential losses:
    risk exposure = risk impact x probability |

    | Why is risk exposure important? | Risk Exposure in business is used to rank
    the probability of different types of losses and to determine which losses are
    acceptable or unacceptable |

    | What are the most common types of risk exposure? | Brand damage, compliance
    failures, security breaches and liability issues |


    Figure 5.1 – Factors related to risk exposure'
