    for instance, to new starters in the organization as well as at regular intervals
    to existing staff. You should also be able to alter messages and add new messages,
    formats, and channels as the scenario demands. Compared to events or crises, communication
    in regular circumstances might be drastically different.


    # Plan for internal versus external communication


    It is crucial to acknowledge that the communication plan comprises both internal
    and external components. They will require different considerations to the questions
    that follow.


