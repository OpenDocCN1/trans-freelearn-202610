- pgno: 83
  md: 'Moreover, the large players themselves may be compelled by this decision to
    explore a *Europeanization* of their services, bringing them inside the EU, as
    many of them had already done before the Schrems II ruling, and resolving the
    issue of the transmission of personal data upstream.


    In a sense, the principle affirmed by the European Court of Justice is unavoidable,
    according to which, going forward, the effective sovereignty of European citizens’
    data will always be safeguarded against mass data collection by foreign government
    authorities under the guise of security surveillance. Could this be the conclusion
    of Orwell’s 1984?


    # Summary


    In this chapter, I was trying to help you understand the laws around data protection
    and that, even though the GDPR is a good bill, it is quite far from perfection.
    Always remember that bills, laws, frameworks, and so on are made by humans, and,
    therefore, are not perfect. But there is time to get them closer to perfection.
    We have now finished exploring data protection. In the next chapter, we will dive
    into risk management.'
