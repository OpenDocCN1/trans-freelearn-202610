- pgno: 54
  md: 'In this chapter, we will cover the following topics:


    +   - What is privacy (and why do we desperately need it)?

    +   - GDPR and his brothers

    +   - Why deal with data protection?

    +   - The six principles of the GDPR


    # What is privacy (and why do we desperately need it)?


    How were the GDPR and the other privacy laws born? It’s not as if people who write
    European standards decided to govern the subject of personal data processing in
    this way just to make life tough for all European businesses, organizations, and
    experts. No, the history of the protection of personal information begins far
    before the EU, long before the privacy code, and most importantly, begins in the
    late nineteenth century in the United States, when privacy was discussed for the
    first time.


    > **Caution – spoiler**

    > Personal data protection and privacy are not identical. They are commonly thought
    to be essentially equal, but as we will show, this is not the case.


    I am referring to the late 1800s in the US, when two attorneys, Warren and Brandeis,
    wrote the first essay on the right to privacy in the Harvard Law Review.


    Consider Boston at the turn of the century. Carriages can still be found. The
    radio is basically non-existent (Marconi et al. are still working on it). No TV.
    Photography is the most advanced technology in the media industry. The press is
    the most widely used medium of communication.


    Are you imagining it? Good. Newspapers began to publish images of high-society
    women wearing skirts and hats while attending social functions. Is it a coincidence
    that individuals start talking about personal information in this scenario? No,
    because if we look at it from the perspective of data protection, we can see that
    the technical infrastructure and equipment – the press and cameras – existed to
    disseminate photos of individuals through newspapers en masse. Large-scale data
    processing and distribution are what we would call it now.


    Don’t get me wrong – personal data isn’t created by technology. Mankind has been
    generating data since its arrival on the planet. Even cave paintings are personal
    data that we can’t connect to the individuals who created them – there’s no signature,
    at least to our understanding – yet are provided anyhow (anonymously). As a result,
    we create personal data regardless of the circumstances and ensure that it is
    constantly protected.


    What has changed in Boston since the mid-nineteenth century?'
  merge: -1
  img_proc: true
- pgno: 55
  md: 'Technological progress. The diffusion of information is no longer restricted
    to town square, cafes, or gentlemen''s clubs. The photographs of the lovely, stunning
    women are published in the newspaper for everybody to see. Individuals have an
    issue with technology not because of the technology itself, but because of how
    it is used.


    Problems of this kind have arisen as a result of information technology''s ability
    to disseminate data far and wide. Another is the snapshot of the paparazzo who
    exposes the actress''s affair in the press and yet another is the photograph posted
    on social media, which is accessible to millions of people.


    But let us return to Warren and Brandeis.


    As a result of this intrusion into people''s lives, Warren and Brandeis create
    an essay called *The Right to Privacy*, in which they effectively state that everyone
    has the right to their private life and that everyone should respect that right.
    It is an autonomous zone, a closed sphere, that must be defended from outsiders,
    whether they be third parties or the government.


    Based on the preceding assumptions, privacy is linked to confidentiality. There
    is a boundary beyond which you are not permitted to travel and only approved people
    are granted access. Do you wish to come into my garden? You will not be able to
    do this without my permission. It''s a concept that''s comparable to, but not
    identical to, personal data protection.


    Privacy and data protection are not synonymous, since when we speak of privacy
    and confidentiality, we are referring to the preservation of privacy in accordance
    with American tradition, whereas data protection encompasses all the information
    about an individual.


    If Mark goes around his house in his (or someone else''s, for what it''s worth)
    underpants, with a pink shower cap on his head, a baseball bat, and a garter,
    that is his choice and constitutes his privacy. If David purchases a plane ticket
    from Paris to Marseille for work that includes his name, departure time, and seat,
    this is the processing of his personal data.


    As you may imagine, this is a slight but significant distinction, since privacy
    is never mentioned in the text of the GDPR.


    This notion of privacy and the preservation of our personal, private realm eventually
    reaches Europe. However, this scenario is completely different. If in the United
    States the aim is to guard against the encroachment of private persons – media,
    businesses, and other people – in Europe, the objective is to defend against the
    intervention of the state or private industry.


    It is crucial to stress that the right to privacy is not directly addressed in
    the US Constitution, yet this does not prohibit the contention that privacy is
    legally guaranteed. It is equally essential to understand that there is a clear
    separation between the Constitution, which controls the sectors in which the Government
    is permitted to intervene, and the Bill of Rights, which was intended to restrict
    the instances in which such action is permissible. The relationship between different
    needs, such as the power of the democratically elected political majority to dictate
    rules that affect the entire community, and that of the individual to self-determine
    and establish a boundary against the intrusions of public power into his private
    life, is the oldest and most complex relationship between freedom and democracy.'
  merge: -1
  img_proc: true
- pgno: 56
  md: 'It has been suggested in the past that an explicit guarantee of privacy was
    not included in the United States Constitution for two primary reasons: first,
    the notion of privacy was so ingrained into the American spirit that its formal
    inclusion was unnecessary.


    But secondly, because (and this is a more persuasive argument than the first)
    the true threat to privacy emerged when the growth of media and telecommunications
    made the violation of this right tangible, as we pointed out previously. Consequently,
    the notion of privacy as an asset deserving of protection has always been an integral
    part of the pursuit of pleasure, to which the Declaration of Independence speaks.


    In conclusion, we need privacy *because* we are using technology.


    # GDPR and his brothers


    The first *real* privacy law was the **General Data Protection Regulation (GDPR)**,
    which came into the light in 2016 and was enforced in 2018, after an attempt made
    in 1995, known as *Directive 95/46/ec of the European Parliament and of the Council
    of 24 October 1995*, where the Directive wasn''t adopted by member states in the
    same way.


    The GDPR unites data privacy regulations across Europe while preserving and empowering
    the data privacy of the people of the EU. It also affects any organization that
    handles or manages the data of the people of the EU, regardless of location, making
    the GDPR legally obligatory for US corporations with worldwide operations, overseas
    locations, and even remote employees.


    Individual rights are bolstered and new ones are established under the GDPR. These
    include the following (but there are also many more):


    +   - *The right to data portability:* You have the right to get your personal
    information from a company in a frequently used format, allowing you to readily
    share it with another entity

    +   - *The right to not be profiled:* Unless required by law or contract, decisions
    affecting you cannot be based only on automated processing unless it is essential
    to do so

    +   - *The right to erasure (the right to be forgotten):* You may request that
    an organization removes your personal data – for example, if it is no longer required
    for the reasons for which it was gathered or if you have withdrawn your permission


    Although the GDPR is the most important privacy law in the world, it isn''t the
    only one around. Other examples are the **California Consumer Privacy Act (CCPA**,
    limited to California), and **Lei Geral de Proteção de Dados Pessoais (LGPD)**
    in Brazil.


    Let''s examine the fundamental parallels between these three sets of legislation.
    It is crucial to note that while the CCPA is sectoral legislation, the sheer size
    of California''s customer base essentially makes it an omnibus statute.'
  merge: -1
  img_proc: true
- pgno: 57
  md: '# Territorial scope


    In terms of geographical coverage, the GDPR and LGPD have several parallels. However,
    the CCPA has a far narrower reach and a more nuanced definition of the regulated
    parties.


    The GDPR applies to any entity that handles the personal data of EU data subjects,
    regardless of their location. The LGPD also applies to any firm that handles data
    in Brazil, regardless of whether it has a physical presence there. In other words,
    these restrictions apply whether you handle client data in either the EU or Brazil.


    The CCPA applies to any for-profit company that operates in California and handles
    the personal information of California citizens. Additionally, covered parties
    must satisfy one or more of the following requirements:


    +   - Minimum yearly gross sales of $25 million

    +   - Processes the personal information of at least 50,000 users

    +   - 50 percent or more of its earnings are derived from the sale of the personal
    information of Californian citizens


    This implies that practically all enterprises with gross revenues over $25 million
    must comply with the CCPA if they have at least one Californian consumer. However,
    this exception exempts several smaller enterprises from the legislation.


    Let''s look at a few examples:


    +   - *The Daily Bugle* is a huge company with operations across the United States.
    They must comply with CCPA since they do business with Californian citizens and
    are a significant organization with annual revenue of at least $25 million.

    +   - *The Neighbor Post* has less than 50,000 customers in the United States.
    They earn around $18 million every year but do not benefit from selling personal
    information. Smaller entities are exempt from CCPA compliance.

    +   - Both *The Daily Bugle* and *The Neighbor Post* are required to comply with
    the GDPR and LGPD since their websites get visitors from the EU and Brazil.


    There are a few other minor issues, as the CCPA applies only to Californian citizens,
    while the GDPR applies to everyone in the EU, regardless of citizenship status.


    Here are a few tips for you to keep in mind:


    +   - The GDPR and LGPD both have an extraterritorial reach

    +   - The CCPA applies exclusively to entities that either:

    +     - Have minimum yearly gross sales of $25 million'
  merge: -1
  img_proc: true
- pgno: 58
  md: '+   - Process the personal information of at least 50,000 customers

    +   - Receive 50 percent or more of their income from selling information on California
    residents

    +   - Almost all firms must comply with the GDPR and LGPD – however, some may
    not be required to comply with the CCPA


    The GDPR applies to organizations with a presence in the EU, namely those with
    an establishment there. Consequently, the GDPR applies to the processing of personal
    data by EU-based organizations, regardless of whether the processing occurs in
    the EU or not. In terms of its extraterritorial applicability, the GDPR applies
    to the processing operations of non-EU-based organizations that sell products
    or services to EU-based persons. Regarding the concept of establishment, the LGPD
    has no corresponding clause defining it. Nonetheless, the LGPD applies to data
    processing activities conducted in Brazil. Regardless of the location of an entity''s
    headquarters or the location of the data being processed, the LGPD applies if
    the data being processed pertains to Brazilian citizens or if the personal data
    being processed was obtained in Brazil. The definition of data gathered in Brazil
    is data relating to a person who was in Brazil at the time of collection. The
    LGPD also applies, regardless of the location of an entity''s headquarters or
    the location of the data being processed, if an entity''s processing activity
    is intended to provide or supply products or services to Brazilian residents.


    # The GDPR, CCPA, and LGPD each define personal data differently


    As we are getting into privacy, let''s get into on how the different laws behave:


    +   - The GDPR defines personal data as information that may be reasonably attributed
    (directly or indirectly) to an identifiable or identified data subject. This includes
    direct data such as names, social security numbers, and addresses, as well as
    indirect data such as behavioral data and preferences. The GDPR also has specific
    exclusions, such as the use of personal data for certain research purposes.

    +   - The CCPA defines personal data as any information that may be used to identify
    an individual, including social security numbers, residences, and names. Moreover,
    the CCPA includes data that may be used to identify a home or device.

    +   - The LGPD defines personal data as information relating (directly or indirectly)
    to a natural person who is identified or identifiable. However, it provides no
    more information about what constitutes this sort of data. In addition, the LGPD
    considers any behavioral profiling data to be personal data if it may be used
    to identify a real person.


    There are significant variances here. Firstly, the GDPR defines personal data
    solely at the individual level, but the CCPA also includes household data. In
    addition to excluding some publicly accessible data, the CCPA does not necessarily
    encompass behavioral or demographic data.


    +   - The LGPD is straightforward and very inclusive since it contains all sorts
    of data that may be directly or indirectly related to a person or household due
    to the absence of any defining data categories.'
  merge: -1
  img_proc: true
- pgno: 59
  md: 'Here are some of the key points to take away:


    +   - The definitions of personal data under the GDPR and LGPD are unsurprisingly
    similar. Nevertheless, the LGPD’s reach is greater owing to its technological
    simplicity.

    +   - The CCPA is less stringent than both the GDPR and the LGPD since it only
    applies to specific categories of data and only examines data that directly identifies
    a person.


    # The importance of anonymous, pseudonymous, de-identified, and aggregated information


    Let’s give some definitions here to better understand the rest of the text:


    +   - **Anonymization**: The dataset does not contain any identifiable information
    and there is no way to link the information back to any identifiable information.

    +   - **De-identification**: The dataset does not contain any identifiable information,
    but there is a way to link the information back to identifiable information.

    +   - **Pseudonymization**: The dataset cannot be attributed to a specific data
    subject without the use of separately kept *additional information*.

    +   - **Non-identifiable**: The dataset has been compiled, extracted, modified,
    anonymized, or aggregated in such a manner that the individual source of the data
    cannot reasonably be identified.

    +   - **Aggregate data**: The dataset has been removed from any identifying information
    so that the individual data or information of a customer cannot be associated
    with that customer without extraordinary effort. Many datasets of de-identified
    or pseudonymized data streams form an aggregation.


    Numerous businesses acquire, store, and sell data that has been anonymized by
    de-identification algorithms or aggregation. Under the CCPA, corporations are
    permitted to continue using this information without disclosing it. Businesses
    are permitted to utilize anonymous data under the GDPR, but not pseudonymous data.


    There are some more key points to cover here:


    +   - The CCPA permits firms to store, acquire, and sell de-identified, aggregated,
    and anonymous data without disclosing it

    +   - The GDPR only permits organizations to store, gather, and sell non-identifiable
    data

    +   - These forms of data are required to be published since the LGPD has no corresponding
    wording'
  merge: -1
  img_proc: true
- pgno: 60
  md: '# Legal bases for data processing


    There are significant distinctions between how each of these laws permits data
    processing. The GDPR and LGPD both have sections on the *legal basis for processing*.
    This implies that firms may only process data for specified purposes.


    Specifically, the GDPR covers the following:


    +   - Explicit consent

    +   - Legal responsibility

    +   - Legitimate interest

    +   - Public duty

    +   - Vital interest

    +   - Contractual performance


    This is a total of six data processing justifications, while the LGPD consists
    of ten:


    +   - Consent

    +   - Legal duty

    +   - Protection of life

    +   - Utilization of privileges in court proceedings

    +   - Legitimate interest

    +   - Security for credit (likely related to recent reforms to the Positive Credit
    Registry Law)

    +   - Health security

    +   - Public duty

    +   - Investigation by public study agencies

    +   - Contractual performance


    The CCPA lacks any basis for processing data. In other words, the CCPA allows
    firms to handle data of Californian citizens as they see fit. Residents may, of
    course, opt out but there are no constraints on *the reason* why corporations
    handle data.


    Let’s recap the following:


    +   - The GDPR offers six legal justifications for the handling of personal data

    +   - There are ten legal bases for data processing under the LGPA

    +   - The CCPA has no limits on the legal bases for data processing'
  merge: -1
  img_proc: true
- pgno: 61
  md: '# Data access privileges


    The GDPR, CCPA, and LGPD all provide natural persons with data privacy rights.
    Under the CCPA, customers have the right to seek disclosure of their personal
    information in order to find out what information companies hold about them. In
    addition, consumers have the right to obtain information on how companies gather
    and use their data, including how it utilizes third parties with whom it shares
    data.


    Under both the GDPR and the LGPD, consumers are granted comparable but more expansive
    rights. Under the GDPR, for instance, people may seek written or portable disclosure,
    a right that is not inherent to the CCPA.


    The periods for providing this information to consumers also vary across these
    statutes:


    +   - The CCPA permits firms 45 days to respond to access requests for personal
    data

    +   - The GDPR allows firms 30 days to respond to access requests for personal
    data

    +   - The LGPD permits firms 15 days to respond to access requests for personal
    data


    The CCPA grants customers the ability to opt out of the collection of data for
    sale, mandating that websites provide the possibility to opt-out. The GDPR provides
    a right to object that encompasses the ability to object to the consumption of
    data that falls within particular parameters. All three laws provide customers
    with the right to erase or right to be forgotten.


    Overall, the GDPR and LGPD provide consumers with more rights. The LGPD has nine
    basic rights:


    +   - The right to access data

    +   - The right to rectify incorrect information

    +   - The right to data portability

    +   - The right to remove personal data

    +   - The right to knowledge about the sharing of your data

    +   - The right to withdraw consent

    +   - The right to certify data processing presence (process shall be lawful only)

    +   - The right to have access to processed data

    +   - The right to knowledge about rejected consent and its repercussions


    These rights are virtually identical to the eight granted by the GDPR.'
  merge: -1
  img_proc: true
- pgno: 62
  md: 'Let’s touch upon some more crucial differentiations:


    +   - The GDPR, CCPA, and LGPD provide consumers with transparency and access
    rights

    +   - The GDPR, CCPA, and LGPD provide consumers with deletion rights

    +   - The CCPA only permits opt-outs for data intended for sale

    +   - Each bill provides organizations with varying periods of time to respond
    to access requests

    +   - Under some conditions, the GDPR and LGPD provide the right to correction
    and the right to prohibit processing


    **Tip**

    Regarding consumers within EEC boundaries, it must be pointed out that the *Directive
    2002/58/EC of the European Parliament and of the Council of 12 July 2002* concerning
    the processing of personal data and the protection of privacy in the electronic
    communications sector (a directive on privacy and electronic communications) is
    still *alive and kicking*. As already mentioned at the beginning of this chapter,
    because of their nature, directives cannot be taken as laws. Therefore, I am just
    referring to it for the sake of completeness. The entire text can be found here:
    https://eur-lex.europa.eu/legal-content/EN/ALL/?uri=CELEX%3A32002L0058.


    # Fines and penalties


    Rules change a lot in relation to fines.


    GDPR penalties are by far the most severe of the three. The maximum GDPR penalty
    is €20 million or 4% of an entity’s worldwide annual turnover, whichever is greater.
    The LGPD sanctions are 2% of an entity’s worldwide annual sales or 50 million
    reals (about $12 million). The maximum CCPA sanctions are $7,500.


    In the case of security issues, the LGPD does not specify a timetable for informing
    local authorities. Nevertheless, according to the instructions provided by the
    National Authority on 22 February 2021, the notification must be made within 2
    working days of learning of the incident.


    The CCPA, the GDPR, and the LGPD have commonalities, but they also have substantial
    distinctions. These privacy regulations will continue to be implemented in other
    jurisdictions. In the US, the majority of states are developing their own versions
    of the CCPA, and several European nations are complementing the GDPR with their
    own laws. Of course, other countries will enable similar bills too according to
    their needs.


    # Why deal with data protection?


    Data becomes more valuable, as you can imagine, due to technological advances.
    In addition, the ability and opportunity to access various types of personal data
    are rapidly developing. Unauthorized,'
  merge: -1
  img_proc: true
- pgno: 63
  md: 'negligent, or uneducated handling of personal information may cause significant
    damage to individuals and businesses.


    First and foremost, the goal of personal data protection is to safeguard the basic
    rights and liberties of the individuals whose data is being protected. It is feasible
    to secure personal data without violating the rights and liberties of individuals.
    For instance, improper processing of personal data might result in a person being
    ignored for a job opportunity or, even worse, losing their existing employment.


    Second, noncompliance with personal data protection standards may lead to far
    more severe consequences, such as the theft of an individual''s whole bank account
    balance or the manipulation of health information that poses a life-threatening
    risk.


    Third, data protection measures are required to ensure fair and consumer-friendly
    commerce and service delivery. Personal data protection legislation results in
    a system in which, for instance, personal data cannot be sold freely, which gives
    individuals more control over who sends them offers and the nature of those offers.


    Personal data leaks may do substantial harm to a company''s image and incur fines,
    which is why it is essential to adhere to the legislation governing the security
    of personal information.


    To protect the security of personal data, it is essential to understand what data
    is being processed, why it is being handled, and on what legal grounds. Additionally,
    it is essential to determine the safety and security measures in place. All of
    this is feasible via a comprehensive data protection audit that monitors data
    flows and their compliance with data protection standards. It is possible to conduct
    an audit by responding to a series of prepared, audit-specific questions. The
    findings will provide a comprehensive picture of the processes and any data breaches,
    which may then be halted.


    Any company that gathers, processes, or keeps sensitive data must have a data
    protection plan. An effective plan can aid in preventing data loss, theft, or
    corruption, as well as lessening the impact of a security breach or natural catastrophe.


    Data protection principles aid in safeguarding information and making it accessible
    under all conditions. This entails adopting components of data management and
    data availability, as well as operational data backup and **business continuity
    and disaster recovery (BC/DR)**.


    Data availability entails ensuring that users have access to and can use the data
    necessary to do business, even if this data is lost or corrupted.


    Data life cycle management is the automated transportation of vital data to offline
    and online storage.


    Information life cycle management entails the valuation, categorization, and protection
    of information assets against a variety of threats, such as facility failures
    and disturbances, application and user mistakes, equipment failures, and malware
    and virus assaults.


    Data privacy is a guideline for how sensitive and important data should be acquired
    and managed. Typically, data privacy is applied to **protected health information
    (PHI)** and **personally identifiable**'
  merge: -1
  img_proc: true
- pgno: 64
  md: '**information (PII)**. This includes financial data, medical records, social
    security or identification numbers, names, dates of birth, and contact information.


    Concerns over data privacy apply to any sensitive information handled by a firm,
    including that of customers, shareholders, and workers. Frequently, this information
    is crucial to corporate operations, their growth, and finances.


    Data privacy ensures that only authorized parties have access to sensitive data.
    It stops criminals from using data maliciously and aids enterprises in meeting
    the regulatory obligations.


    Certain data types are governed by legislation regarding their collection, transmission,
    and usage. Personal information comprises names, photographs, email addresses,
    bank account information, IP addresses of personal computers, and biometric data,
    among other things.


    Compliance with one set of rules does not ensure adherence to all laws. In addition,
    each legislation has various phrases that may apply in one circumstance but not
    in another, and all laws are susceptible to modification. This amount of complexity
    makes it challenging to execute compliance correctly and consistently.


    As already mentioned both data protection and privacy are essential and are sometimes
    used interchangeably, but they do not refer to the same concept; one deals with
    policy and the other with mechanisms.


    Data privacy is concerned with determining who has access to data, while data
    protection is concerned with enforcing these limitations. Data privacy outlines
    the rules used by data protection instruments and procedures.


    Developing data privacy policies does not guarantee that unauthorized users will
    not gain access. Similarly, it is possible to limit access using data safeguards
    while leaving sensitive data accessible. Both are required to maintain data security;
    users manage its privacy and firms guarantee its protection.


    Another significant difference between privacy and protection is who normally
    exercises control. Typically, consumers may select how much and with whom their
    data is shared. It is the responsibility of firms managing data to preserve its
    confidentiality. This distinction is reflected in the existence of compliance
    standards, which are designed to guarantee that corporations honor the privacy
    concerns of consumers.


    # The six principles of the GDPR


    *Data controller: purpose and means of processing data*


    Article 5 of the EU GDPR stipulates that the controller is accountable for the
    legality, fairness, and openness of information. Data controllers are also expected
    to ensure the accuracy of personal data, storage limits, and confidentiality.
    To avoid fines and penalties, data controllers should only choose data processors
    that comply with the GDPR.'
  merge: -1
  img_proc: true
- pgno: 65
  md: 'In certain instances, a data controller may collaborate with a third party
    or another service to do data analysis, even if it can handle the data using its
    own methods. For instance, a payroll service provider is a third-party data controller
    since it determines how payrolls should be handled.


    # Data processor: maintain a record of activity


    It is not always straightforward to determine what constitutes a data processor.
    Typical data processors include legal businesses, medical offices, and accounting
    firms. A processor must keep a record of all data processing actions. A reasonable
    rule of thumb is that an organization is a data processor if it must adhere to
    data and privacy orders and directions. Organizations that destroy or store data
    may also function as processors.


    Generally, processors can and should strive to move data risk duties to third-party
    suppliers. The primary manner in which the GDPR has altered the responsibilities
    of data processors is by specifying their obligations inside the GDPR''s laws
    and regulations so that they must be severely enforced.


    # The Gray Area


    In the wake of the GDPR, it has also become obvious that certain businesses do
    not fit well into either category. Companies such as courier services exist in
    a gray area since they do not analyze individual-specific data.


    If many organizations share responsibility for the processing of personal information,
    then joint controllers may be appropriate. These responsibilities would need to
    be clearly defined, and processors would serve as the primary contact point.


    According to the regulations, the criteria of lawfulness are only met if at least
    one of the six legal reasons for processing specified in Article 6 is met:


    +   - **Consent**: The data subject has agreed to the processing of their personal
    data for one or more specified purposes

    +   - **Performance of a contract**: The processing is required for the performance
    of a contract to which the data subject is a party or to take action at the data
    subject''s request prior to entering a contract

    +   - **Legal requirement**: The processing is required for the controller to
    comply with a legal obligation to which the controller is subject

    +   - **Vital interests**: The processing is required to safeguard the vital interests
    of the data subject or another natural person

    +   - **Necessity**: It is needed for the fulfillment of a job in the public interest
    or an exercise of official power conferred to the controller'
  merge: -1
  img_proc: true
- pgno: 66
  md: '+   - **Legitimate interests**: The processing is necessary for the purposes
    of the controller''s or a third party''s legitimate interests, except where such
    interests are overridden by the interests or fundamental rights and freedoms of
    the data subject that require the protection of personal data, in particular where
    the data subject is a child


    Except for the processing of certain categories of data (as in, sensitive data),
    which enjoys extra, special standards, all processing of personal data must be
    based on one of these six reasons.


    It is essential to remember that there is no hierarchy between the permissible
    processing justifications.


    Article 9 of the GDPR specifies the legitimate bases for processing special categories
    of data, meaning that anytime one of the special categories of data is handled,
    the Article 9 regulations on authorized uses of sensitive data apply. The Article
    29 Working Party clarified that a controller processing particular categories
    of data can never rely merely on the broad reasons for processing listed in Article
    6 of the existing GDPR. These rules “*will never be overridden, but will always
    apply with the guidelines for processing certain types of data in a cumulative
    manner.*”


    Article 9 of the GDPR contains a comprehensive overview of the specific categories
    of data:


    +   - Information exposing race or ethnicity

    +   - Information exposing political viewpoints

    +   - Information exposing religious beliefs

    +   - Information exposing philosophical convictions

    +   - Information concerning membership in a labor organization

    +   - Genomic data

    +   - Biometric data (for the purpose of uniquely identifying a natural person)

    +   - Information on health

    +   - Information pertaining to sexual activity or orientation


    Article 9, Paragraph 1 of the GDPR prohibits, as a general rule, the processing
    of certain specific categories of data. Their processing is permitted under one
    of the exceptions specified in Article 9’s second paragraph:


    +   - **Consent**: The expressed consent of the data subject is given.

    +   - **Employment and social security legislation**: It fulfills some duties
    under employment and social security protection law (if permitted by law or collective
    agreement).

    +   - **Vital interests**: There is a need to safeguard the vital interests of
    the data subject or another person.'
  merge: -1
  img_proc: true
- pgno: 67
  md: '+   - **Political or religious non-profits:** It is carried out with appropriate
    safeguards by a foundation, association, or any other non-profit body with a political,
    philosophical, religious, or trade union purpose and on the condition that the
    processing relates solely to the members or former members of the body or to persons
    who have regular contact with the body and that the personal data is not disclosed
    outside of this body without consent.

    +   - **Data demonstrably made public:** The processing pertains to personal data
    that the data subject has plainly made public.

    +   - **Rights:** It is required for establishing, exercising, or defending legal
    claims.

    +   - **Substantial public interest:** There is a necessity on the grounds of
    substantial public interest, based on EU or member state legislation.

    +   - **Medical purposes:** There is a necessity for preventative or occupational
    medicine, for the evaluation of an employee''s working capability, medical diagnosis,
    or the provision of medical treatment. The provision of health or social care
    or treatment, or the administration of health or social care systems and services,
    on the basis of Union or Member State legislation or by contract with a health
    professional.

    +   - **Public health:** There is a necessity on the grounds of public interest
    in the domain of public health, such as defending against major cross-border dangers
    to health or guaranteeing high standards of quality and safety in health services,
    pharmaceutical goods, and medical equipment, based on EU or member state legislation.

    +   - **Archiving, scientific or historical research:** There is a necessity for
    reasons of public interest, scientific or historical research purposes, or statistical
    purposes according to Article 89 of the GDPR on the basis of EU or member state
    legislation.


    In addition, member states may establish additional requirements, including restrictions,
    if they pertain to the processing of genetic data, biometric data, or health-related
    data.


    I hope everything is clear, up until now at least. I did my best to avoid legalese
    jargon!


    # Summary


    So, we have discussed the basics (a definition of privacy, why privacy laws are
    important, how the bills assume we can protect data, and the legal principles
    around processing data). You will (or should) now have a good understanding of
    topics such as the differences between data processors and data controllers, which
    data can be set as special or sensitive, how different laws behave differently
    in terms of data protection, extraterritoriality, and many other aspects. We recapped
    a quick history of privacy and set a lot of useful definitions to better understand
    it, while in the next chapter, we''ll get our teeth into the matter a bit more
    while still trying to be as clear as we can.'
  merge: -1
  img_proc: true
