  img_proc: true
- pgno: 141
  md: '# Using the ISO 27001 controls


    The controls outlined in Annex A of ISO 27001 are a vital component of risk treatment
    and must be chosen based on a comprehensive analysis of an organization''s information
    security threats.


    Typically, chosen controls must be justified by one of the following:


    +   - Risk assessment

    +   - Business need or best method

    +   - Legal or contractual requirement


    Once controls have been identified, organizations must submit a **Statement of
    Applicability (SoA)** that must contain, at a minimum, all 114 controls listed
    in Annex A of ISO 27001, along with reasons for inclusions and, preferably, concise
    descriptions of how they have been implemented. The SoA acts as a tool for providing
    senior management with accurate information on the degree of risk to which their
    organizations are exposed and the status of risk treatment efforts.


    # Identification of ISO 27001 controls to implement


    Only after a thorough evaluation of an organization''s inherent information security
    threats can it be determined which measures should be adopted. Once the risks
    are known, the appropriate countermeasures may be determined. Possibly, the greater
    the number of controls adopted, the greater the likelihood that the organization
    can minimize or at least mitigate exposure to recognized risks.


    Nonetheless, Annex A controls may be omitted if deemed irrelevant. An example
    of this would be a company that does not produce software.


    Obviously, there would be no need for a strategy of secure growth. If a control
    is to be omitted, a complete rationale must be included in the SoA.


    # Summary


    This chapter was very discursive, but we talked about risk management, data classification
    (still, as part of risk management) and all the controls within Annex A of ISO
    27001.


    In the next chapter, we will discuss preparing foolproof policies and procedures
    to avoid internal risks. We will examine security systems and devices, cybersecurity
    vulnerabilities, social engineering, common pain points, and critical success
    factors.'
  merge: -1
  img_proc: true
