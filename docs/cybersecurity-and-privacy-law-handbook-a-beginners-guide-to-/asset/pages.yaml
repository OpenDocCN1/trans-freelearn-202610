    # Who is charged for implementing Annex A controls?


    There are two essential considerations for addressing this question.


    Less than forty percent of ISO 27001 Annex A controls are technology-based. Information
    security vulnerabilities are often caused by human behavior. Therefore, contrary
    to popular belief, IT cannot and should not be the only answer.


    Information security is, in reality, about constructing a system of mature, resilient
    rules. The present Annex A framework applies the following percentages to control
    locations inside an organization:


    +   - 37% – Technology

    +   - 36% – Organizational/documentation

    +   - 13% – Physical security

    +   - 5% – Supplier and buyers

    +   - 5% – Human resource management

    +   - 4% – Legal protection


    Consequently, applying the controls stated in Annex A is and must always be the
    responsibility of a number of persons and departments within an organization,
    the number of which is dependent on the size and complexity of the organization.'
