- pgno: 116
  md: '+   - Security incident logs and root cause analysis

    +   - Rectifications and enhancements


    > **Tip**

    > I think you imagine a truckload of documentation to be prepared and ready, but
    a high percentage of the companies I personally assessed needed "only" the paperwork
    required to fulfill the criteria of clauses 4 to 10 consisting of around 25 to
    35 pages in total (excluding title pages and version control, I mean the version
    number). Among them are the outcomes of the management review, the internal audit
    report, the risk assessment, and the performance evaluations. This amount of pages
    for clauses 4 through 10 is generally intended to be independent of the organization''s
    size; nonetheless, bigger organizations have additional paperwork related to,
    for example, performance management and internal auditing.


    The second major sort of documentation is information security policies, which
    are more diverse. 20 to 40 pages of documentation have been required for the ISO
    27001 implementations I''ve performed for smaller organizations (with maybe a
    few thousand users). Larger organizations need more policy-related paperwork,
    although it typically did not exceed 60 pages.


    The third form of documentation is the documentation/records generated as a consequence
    of running the controls/procedures, such as visitor records, change control records,
    and penetration test reports, where the type of documentation generated is highly
    reliant on what is implemented.


    If you have more than this, you may have made things more complicated than necessary.
    Or maybe you do need it all to effectively handle information security concerns.
    But I doubt it.


    So, once everything is in place (policies, controls, procedures, and so on), you
    can have your audit and, if it''s successful, you can obtain your ISO 27001 certification.
    But can you later lose it?


    Yes. Auditors will periodically return on-site (or remotely) and request evidence
    that you are continuing to comply with all regulations. If you cannot provide
    evidence that you are, they will revoke your ISO 27001 certification. So, we must
    ensure that we continue to comply with all ISO 27001 requirements.


    How can you ensure you do so?


    +   - Be familiar with the primary tenets of your information security policy.

    +   - Be familiar with the primary concepts of the content of the intranet''s
    primary information security pages and complete the yearly training on information
    security.

    +   - Know where to locate the organization''s rules and procedures, especially
    those that pertain to information security and apply to you.

    +   - You are not required to grasp every detail, but you should understand the
    fundamentals.'
