    \ them beginning with a question mark, such as, for instance, *What is privacy\
    \ (and why do we desperately need it)?* Then, we can try to get an idea of the\
    \ reason why the word *privacy* is such an important part of our lives nowadays\
    \ (and why it's misused from time to time). Then, we will dive into the surface\
    \ of the most famous privacy laws, such as GDPR, CCPA, and LGPD. Following this,\
    \ we will analyze the common points of these different laws and how these laws\
    \ (and other laws) can give us a reasonable degree of safety when a company uses\
    \ our data. The last topic of the chapter is about the *mechanisms* that allow\
    \ entities to use our data safely.\n\n> **Tip**\n> \n> If you want to become a\
    \ privacy expert, this is not the right book for you – but if you want to understand\
    \ what's under the privacy hood or try to implement it alongside cybersecurity,\
    \ or even better, your business from outside the EU has suddenly become important\
    \ within the EU, I'll try to do my best to help you understand privacy issues\
    \ and even somehow make them fascinating.\n> \n> For sake of clarity (and I am\
    \ referring to the European side here), the difference between a law and a directive\
    \ must be pointed out.\n\nWhile a law, or bill, is something that comes from Europe\
    \ and applies without any difference among the EU member states, a directive is\
