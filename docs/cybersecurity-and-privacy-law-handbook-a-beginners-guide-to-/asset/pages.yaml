    As we have provided a summary of the clause, now we will detail every subclause.


    # 7.5.1 – General


    The term *documented information*, which will be used several times throughout
    this chapter, now encompasses both the *documents* and *records* definitions from
    the previous version of the ISO 27001 standard.


    This modification was intended to assist with the administration of papers and
    records mandated by the standard, as well as those deemed vital to the iSMS''s
    functioning by the organization. It should also be emphasized that the quantity
    and scope of recorded information required by an organization will vary based
