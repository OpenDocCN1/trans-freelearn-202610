    recovery plans. ACME must determine how data will be recovered from the vendor.


    5.5 – A proper risk assessment must be conducted by the applicable Information
    Security Office prior to any third-party hosting or cloud computing service arrangement.


    # 6. INTELLECTUAL PROPERTY AND COPYRIGHT MATERIALS (APPLICABLE ALSO TO PRIVACY
    AND DATA SECURITY)


    Information that has been classified by ACME as Unclassified Public, Proprietary,
    Client Confidential Data, or Company Confidential Data may be used only in accordance
