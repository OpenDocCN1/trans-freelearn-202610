    It’s important to note that, as stated on their website, this document from NIST
    is available for free at https://doi.org/10.6028/NIST.SP.800-53r5.


    However, while NIST is free, ISO 27001 is not. I strongly suggest you buy a copy
    of ISO 27001 standard once you finish reading the book, to better understand both
    the controls and the jargon.


    As you may see, general rules between ISO and NIST are somewhat interchangeable
    and that’s why it is not only possible but also desirable, at least in some cases,
    to use the NIST ones. When it comes to asset disposal, for instance (see the highlighted
    ISO 27001 annex), ISO refers to media only (i.e., USB and hard disk drives), while
    NIST throws out an impressive number of network devices with a very detailed plan
    on how to safely dispose of them (considering that they can retain network configurations
    and a malicious actor can easily copy and use them against our company). The real
    benefit of using ISO instead of NIST, as mentioned elsewhere in the book, is that
    you can prove that you are following a standard and this would be highly beneficial
    for your entity.'
