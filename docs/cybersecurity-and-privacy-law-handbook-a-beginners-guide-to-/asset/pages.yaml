    aims and commitment to information security. The information security policy,
    the team within the organization with the essential roles and duties related to
    security, the awareness strategy, and the general and specialized requirements
    for responding to incidents are some examples of communication. The internal communication
    plan should not, however, be unidirectional. Mediums such as telephone and email,
    for instance, should also be recognized and used to communicate security breaches
    or emerging vulnerabilities in a bottom-up manner, that is, from on-the-ground
