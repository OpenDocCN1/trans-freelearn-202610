    | | |

    | | Reviewing a draft |

    | Stakeholder responsibility | Submitting comments and corrections |

    | | |

    | Writer responsibility | Creating the final draft |

    | | |

    | Manager (business unit) | Approving the final version |


    The department head must approve the final version.


    # Question and answer


    Match frequent procedural questions with the appropriate responses. This style
    is beneficial when methods are unclear or there are several variants. It also
    helps in addressing “what if” concerns.


    *Example:*


    Q: What happens if the columns are not balanced?


    A. Initially, do not panic. Start with the most basic explanations and move backward.
    Calculate each column again. Then, search for faults in transcribing. If this
    does not resolve the issue, examine how you obtained your figures. If you were
    uncertain about any points, verify those numbers again. Then, methodically review
    each figure until the problem is discovered.


    # Matrix


    The table links one variable with another. Where variables intersect, the cell
    displays the corresponding action. Matrix tables are very useful for reference
    reasons since they minimize the need for repeated searching. You can utilize them
    for a variety of purposes, including determining what activities to do and when,
    assisting users in making choices, and determining which forms or reports to use:'
