- pgno: 123
  md: '# Risk heatmaps


    Risk heatmaps are often used in operational risk management and are especially
    beneficial for visually representing a company''s risks and emphasizing those
    that need closer supervision. Typically, while analyzing operational risk, the
    risk manager will utilize a spreadsheet to record the company''s important hazards
    and estimate their effect and likelihood (or probability).


    Some entities still use spreadsheets to manage broader risks and display heatmaps,
    which are typically included in management information reports for senior management
    and other senior executives. Despite the fact that many companies have risk management
    systems that provide this functionality, some companies still rely on spreadsheets
    to manage broader risks and display heatmaps.


    The total risk score is the product of the likelihood (or probability) and effect
    ratings. The formula for calculating the risk score is as follows:


    *Risk Score = Likelihood Score x Impact Score*


    When the list of risks is broad, often spanning many departments or business sectors,
    it is a significant difficulty for the risk manager to plot these risks on a heatmap,
    ensuring that all relevant hazards are shown appropriately. The hazards will be
    shown on a heatmap based on their respective scores. According to their individual
    scores, the hazards on the heatmap will be colored red, amber, or green (RAG).


    The first example demonstrates how a comprehensive variety of hazards may be displayed
    using Excel in an understandable manner (the data sheet feeding into this chart
    has more than 100 risks).


    Risk Assessment Heatmap


    ![](img/60ab32c90068557380d1368a9d3a0d47_123_0.png)


    Figure 7.1 – Risk assessment heatmap'
