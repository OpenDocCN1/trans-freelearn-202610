- pgno: 112
  md: '+   - What should the message be like? To generate what is supposed to be communicated,
    the message should be clear and concise in both form and substance. This section
    considers the kind of communication channel to relay messages. You may use narration,
    visuals, metaphors, or cartoons. Messages must be concise and focused on their
    true objective. You can use any media or way to communicate, but it has to be
    comprehensive.

    +   - Who is allowed to communicate? Organizations should make clear who is permitted
    to communicate, particularly with external parties. Top management, the CISO,
    and the support desk are excellent internal examples. Public relations officers
    are employed by large corporations to connect with external parties. The communicator
    should have the requisite authority to ensure that the message will be received
    with the proper attention and will elicit the desired action or response.

    +   - Who is the recipient? Not all recipients should get every communication.
    Depending on the categorization of the information, the required technical competence,
    and the recipient’s position within the company, messages should be tailored to
    a particular audience. The communication plan should be effective and exclusively
    target those who will benefit from it or must act based on it, such as users,
    partners, internal and external service providers, regulatory authorities, and
    shareholders.

    +   - How should the communication process should be carried out? The first and
    easiest communication method is the security policy and all the papers that specify
    what to do (and how to do it) to achieve the policy’s goals. Particularly in the
    event of accidents and emergencies, messages to any kind of audience (either internal
    or external) should be planned and authorized. Defined channels (and protocols)
    should be used to ensure that the message reaches the target audience at the optimal
    time and with the greatest potential efficacy. Examples include emails, pop-up
    windows, screensavers, posters, audio messages, meetings, regulations, and directives.

    +   - When are we supposed to communicate? Continuous and event-based communication
    is required (in reaction to events). To ensure that the message, any message is
