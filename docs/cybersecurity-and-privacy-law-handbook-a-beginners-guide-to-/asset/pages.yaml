- pgno: 91
  md: "Until now, we have explored just the surface of the topic. Let’s go deeper\
    \ and analyze the whole process.\n\n# What are the steps involved in risk management\
    \ for information security?\n\nRisk management is the examination of hazards associated\
    \ with a certain activity or occurrence. Information technology, projects, security\
    \ issues, and other activities where risks may be analyzed quantitatively and\
    \ qualitatively all use risk management.\n\nRisks are a component of any IT project\
    \ and corporate enterprise. The management of risk should be updated often in\
    \ order to identify new possible risks. Strategic risk management minimizes the\
    \ possibility and impact of future risks.\n\nAlthough many bodies of knowledge\
    \ prepared a framework to manage risk, we will be sticking to ISO 31000 standard,\
    \ Risk management – Guidelines, developed by the already-known ISO.\n\nISO’s five-step\
    \ risk management process comprises the following and can be used by any type\
    \ of entity:\n\n+   1. **Identify the risk** – The first stage is to identify\
    \ the risks that the organization is exposed to in its operational environment.\
    \ There are several forms of risks, such as legal risks, environmental risks,\
    \ industrial risks, and regulatory risks, among others. It is crucial to identify\
    \ as many potential risk factors as possible.\n+   \n+   In a manual setting,\
    \ these hazards may be mitigated manually. If the firm utilizes a risk management\
    \ solution, some data is immediately entered into the system.\n+   \n+   This\
    \ strategy has the benefit that these risks are apparent to all organization stakeholders\
    \ with system access. Anyone who needs to know which risks have been identified\
    \ may access the data in the risk management system, as opposed to this information\
    \ being locked away in a paper that must be requested by email.\n+   \n+   2.\
    \ **Analyze the likelihood and impact of each risk** – Once the risks have been\
    \ calculated and recognized, the process of risk analysis should analyze each\
    \ risk that will manifest, and determine the repercussions associated with each\
    \ risk. It also determines how they may influence the IT project’s objectives.\n\
    +   \n+   When implementing a risk management system, mapping risks to numerous\
    \ documents, rules, procedures, and business processes is one of the most fundamental\
    \ phases. This specifies that the system will have a mapped risk structure that\
    \ computes risks and comprehends the far-reaching consequences of each risk.\n\
    +   \n+   3. **Evaluating the risk** – Following an analysis of the risk that\
    \ supports a concept about which IT assets are valuable and which threats may\
    \ have a negative impact on them, it is possible to develop a plan for risk management\
    \ that generates control recommendations that can be used to mitigate, transfer,\
    \ accept, or prevent the risk."
  merge: -1
  img_proc: true
- pgno: 92
  md: '+   4. **Treating the risk** – The purpose of this stage is to implement the
    steps necessary to eliminate or decrease the risks identified in the analysis.
    It can resolve or at least lessen each risk such that it no longer poses a danger,
    starting with the risk with the highest priority.

    +   5. **Monitoring and reviewing the risk** – This stage is responsible for monitoring
    the security risk on a regular basis in order to identify, evaluate, and manage
    hazards, which should be an integral element of any risk analysis procedure.


    In the following figure, you can see the risk management steps:


    ![](img/60ab32c90068557380d1368a9d3a0d47_92_0.png)


    Figure 5.2 – Risk management steps


    In the last phase of risk identification, companies document their results in
    a risk registry. It facilitates the tracking of risks across the next four phases
    of the risk management process.


    The ideal status is to implement any framework or program in a top-down approach,
    including a risk management framework, of course.


    # From the top-down to the bottom-up


    Many risk committees find it advantageous to employ a top-down, bottom-up strategy
    when considering risk scenarios that might hinder or advance an organization’s
    goals. In the top-down effort, the leadership identifies the organization’s mission-critical
    processes and collaborates with internal and external stakeholders to identify
    the situations that potentially hamper these activities. The bottom-up view evaluates
    the possible effect of threat sources (earthquakes, economic downturns, cyber-attacks,
    etc.) on important assets.


    # Benefits and challenges of risk management


    There are several advantages to effectively managing risks that might have a negative
    or positive effect on capital and profitability. Even for firms with sophisticated
    governance, risk, and compliance procedures, it creates obstacles.'
  merge: -1
  img_proc: true
- pgno: 93
  md: 'Among the advantages of risk management are the following:


    +   - Enhanced risk awareness within the company

    +   - Increased confidence in corporate aims and goals as a result of incorporating
    risk into strategy

    +   - Compliance coordination results in greater and more efficient compliance
    with regulatory and internal compliance regulations

    +   - Enhanced operational efficiency via the implementation of risk protocols
    and control more consistently

    +   - Increased employee and consumer workplace safety and security

    +   - A distinct competitive advantage in the market


    The following are some of the obstacles that risk management teams are likely
    to face:


    +   - Initially, costs increase because risk management strategies often need
    costly software and services

    +   - To comply with the growing focus on governance, business units must also
    devote time and money

    +   - Reaching an agreement on the severity of a danger and how to address it
    may be a tough and controversial task that can lead to analytical paralysis in
    certain cases

    +   - It is difficult to demonstrate the benefit of risk management to executives
    without concrete figures


    # Building and implementing a risk management plan


    A risk management strategy outlines how a company will manage risk. It outlines
    components such as the organization''s risk strategy, the roles and duties of
    the risk management teams, the resources it will employ to manage risk, and the
    rules and procedures for risk management.


    Let''s use the ISO 31000 standard (there are many around, from **Committee of
    Sponsoring Organization**, **COSO** (https://www.coso.org/), to eBIOS (https://www.enisa.europa.eu/topics/threat-risk-management/risk-management/current-risk/risk-management-inventory/rm-ra-methods/m_ebios.html,
    a similar framework sponsored by the European Community) but, for sake of simplicity,
    we are going to utilize something that you have already heard of:


    +   - **Consultation and communication** – Since increasing risk awareness is
    a crucial component of risk management, risk leaders must also design a communication
    strategy to disseminate the organization''s risk policies and procedures to workers
    and other relevant parties. This stage sets the tone for all risk-related choices.
    The audience consists of anybody interested in how the company capitalizes on
    favorable risks and mitigates negative ones.'
  merge: -1
  img_proc: true
- pgno: 94
  md: '+   - **Providing the context** – This phase entails determining the organization''s
    specific risk appetite and risk tolerance (i.e., the extent by which risk may
    deviate from risk appetite). Included in these considerations are corporate goals,
    company culture, regulatory laws, and the political climate.

    +   - **Risk identification** – This stage identifies the risk scenarios that
    may have a favorable or negative effect on the organization''s capacity to do
    business. As stated before, the resultant list should be entered into an up-to-date
    risk registry.

    +   - **Risk analysis** – The probability and severity of each risk are examined
    in order to classify them. The creation of a risk heatmap, which gives a visual
    picture of the nature and effect of a company''s risks, might be beneficial in
    this situation. A worker calling in sick is a high-probability occurrence that
    has little or no influence on the majority of businesses. Depending on its location,
    an earthquake is an example of a low-probability but high-impact danger.

    +   - **Risk assessment** – Here, companies consider how to address the threats
    they confront. Techniques consist of at least one of the following:

    +     - **Risk Avoidance** – The objective of risk avoidance is to remove, withdraw
    from, or avoid possible danger

    +     - **Risk Mitigation** – The process through which an organization minimizes
    or optimizes a risk

    +     - **Risk Sharing** (or **Risk Transfer**) – The organization contracts with
    a third party (e.g., an insurer) to shoulder some or all of the expenses associated
    with a risk that may or may not arise

    +     - **Risk Acceptance** – A risk that fits within the risk appetite and tolerance
    of the company is accepted without action

    +   - **Risk Treatment** – This phase involves implementing the agreed-upon controls
    and procedures and verifying that they function as intended.

    +   - **Monitoring and evaluation** – Are the controls operating properly? Can
    they be made better? Monitoring operations should monitor **key performance indicators
    (KPIs)** and search for **key risk indicators (KRIs)** that might prompt a strategy
    adjustment.


    In the following figure, you can see an example of a risk management heatmap:'
  merge: -1
  img_proc: true
- pgno: 95
  md: '![](img/60ab32c90068557380d1368a9d3a0d47_95_0.png)


    Figure 5.3 – A risk management heatmap


    Now that we have explained a bit of jargon related to risk management, let’s add
    something on top of it.


    # Qualitative risk analysis


    Analyzing risk based on an individual’s perceptions of its severity and probability
    is qualitative risk analysis. The objective of qualitative risk analysis is to
    provide a list of risks that must be prioritized above others.


    Qualitative risk analysis is the first line of defense against risks for a project
    manager. It helps eliminate possible obstacles to the project’s success, such
    as risks that are unlikely to cause major damage. By focusing on the most serious
    risks first, project managers can allocate time and resources more efficiently.


    # Quantitative risk analysis


    Quantitative risk analysis is the calculation of risk based on collected data.
    The objective of quantitative risk analysis is to identify how much the effect
    of the risk will cost the company. This is accomplished by leveraging existing
    knowledge to forecast or estimate a result.'
  merge: -1
  img_proc: true
- pgno: 96
  md: 'For data to be appropriate for quantitative risk analysis, it must have been
    analyzed over an extended period of time or seen in many circumstances. In five
    previous experiments, equipment type A failed after seven hours of usage, for
    instance. With this knowledge, it is reasonable to predict that if a project needs
    employees to utilize equipment type A for eight hours, then it has a one hundred
    percent risk of malfunctioning.


    # Difference between qualitative and quantitative risk analysis


    The fundamental distinction between qualitative and quantitative risk analysis
    is the evaluation foundation. As stated before, qualitative risk analysis is based
    on an individual''s impression or judgment, while quantitative risk analysis is
    based on confirmed and specified facts.


    Another distinction is the corresponding risk levels. This number represents the
    risk rating or score in qualitative risk analysis. A danger may be given a rating
    of Low or a score of 1 to signify that it does not demand urgent action. In quantitative
    risk analysis, the value associated with a risk is often expressed as a percentage
    indicating the likelihood of the risk happening, or of the risk having a particularly
    negative impact on project goals.


    # When to perform a qualitative and quantitative risk analysis


    When the perception of a risk changes and when a new danger is found, a qualitative
    risk analysis should be conducted. Every project should start with a qualitative
    risk assessment, as a general rule. In addition, qualitative risk analysis may
    be performed at any point throughout the project, or whenever the project manager
    feels it is required due to its simplicity, speed, and cheap cost.


    Quantitative risk analysis should be conducted when there is an abundance of data
    on the risk and its effect, and when qualitative risk analysis must be confirmed.
    Since quantitative risk analysis may be complex and time-consuming, most project
    managers do not endorse it until the project''s safety depends on exact risk estimates.
    In such circumstances, a quantitative risk analysis may be mandated by legislation
    or by project stakeholders.


    # Summary


    Well, if you arrived here, you deserve a round of applause. This was a really
    dense chapter, with a lot of new things to explain. Just to let you know, by talking
    about risk management, ISO 31000, and quantitative versus qualitative risk analysis,
    we just landed on the surface of the iceberg. But, considering that risk management
    is an incredibly difficult topic including math, statistics, and so on, I thought
    it was only fitting to give you a longer chapter!


    In the upcoming chapter, our attention will be devoted to our beloved ISO 27001:
    we will be going into great depth and it will be really exciting.'
  merge: -1
  img_proc: true
