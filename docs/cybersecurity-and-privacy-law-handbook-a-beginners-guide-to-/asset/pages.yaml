    \n> Tip\n> \n> The terms in bold are the respective clauses of Annex A of ISO\
    \ 27001. Concerning non-conformance, ISO defines them as “the failure to meet\
    \ one or more requirements that are outlined throughout the mandatory clauses.”\n\
    \nThe distinction between a document and a record is that records are time-stamped\
    \ proof of activity. Periodically, documents are examined and updated. Typically,\
