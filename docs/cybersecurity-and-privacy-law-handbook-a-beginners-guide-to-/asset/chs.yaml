  需要注意的是，正如其网站所述，NIST 的这份文件可在 https://doi.org/10.6028/NIST.SP.800-53r5 免费获取。


  然而，虽然 NIST 是免费的，但 ISO 27001 并非如此。我强烈建议你在读完本书后购买一份 ISO 27001 标准，以更好地理解控制措施和专业术语。


  如你所见，ISO 与 NIST 之间的通用规则在某种程度上可以互换，这就是为什么在某些情况下使用 NIST 的控制措施不仅可行而且是可取的。例如，在资产处置方面（参见高亮的
  ISO 27001 附录），ISO 仅指媒体（即 USB 和硬盘驱动器），而 NIST 则列出了大量网络设备，并提供了非常详细的计划说明如何安全处置它们（考虑到它们可能保留网络配置，而恶意行为者可以轻松复制并利用它们来攻击我们的公司）。正如书中其他地方提到的，使用
  ISO 而非 NIST 的真正好处在于，你可以证明自己遵循的是一个标准，这对你的组织将非常有益。


  ## Summary


  你还记得 *银河系漫游指南* 吗？它是迄今为止最有趣的科幻小说之一。好吧，我们可以将 ISO 27001 想象成《银河系漫游指南》中的著名毛巾：我们可以用毛巾和
  ISO 27001 以多种方式使用它们，与其他框架一起，它们都能让我们安心，有时我们需要清洁它们以避免问题。


  所以，本章结束了。我们介绍了如何正式地（尽管如果你的公司不需要认证，这并非严格必要）编写一个功能齐全的 ISMS，然后转向了解 ISO 27001 在现实世界中的运作方式。然后，我们对
  NIST 框架做了同样的事情，并探讨了 ISO 27001 和 NIST 是否可以共存。


  在下一章中，我们将介绍数据保护，重点关注 GDPR 并将其与其他全球隐私法规进行映射。

