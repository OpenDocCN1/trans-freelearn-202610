  \n我指的是 1800 年代末的美国，当时两位律师 Warren 和 Brandeis 在《哈佛法律评论》上撰写了关于隐私权的首次论文。\n\n设想世纪之交的波士顿。马车仍然可见。无线电基本上不存在（马可尼等人仍在研究中）。没有电视。摄影是媒体行业最先进的技术。报刊是最广泛使用的交流媒介。\n\
