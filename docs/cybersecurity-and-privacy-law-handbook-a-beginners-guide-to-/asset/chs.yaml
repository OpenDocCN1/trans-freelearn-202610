  '
- '## Preparing Policies and Procedures to Avoid Internal Risk


  ## 准备政策和程序以避免内部风险


  In the previous chapter, we''ve been through the main principles for deciding what
  to use and how to use it in terms of controls and risk management related to our
  entity. As already explained, if we buy off-the-shelf software, there is no need
  to implement controls related to software (just remember to keep them beside our
  Statement of Applicability) and so on. However, once we decide to use some controls,
  we will need to prepare (or update) our policy and procedures accordingly.


  在上一章中，我们已经了解了关于与我们实体相关的控制措施和风险管理方面应使用什么以及如何使用的基本原则。如前所述，如果我们购买现成软件，则无需实施与软件相关的控制措施（只需记住将其保留在我们的适用性声明旁边）等等。然而，一旦我们决定使用某些控制措施，我们就需要相应地准备（或更新）我们的政策和程序。


  In this chapter, we will go through all this, with a hands-on flavor: in fact, my
  aim is to also give you a good amount of practical tips on how to write down policies
  (and procedures).


  在本章中，我们将以实践的方式进行：事实上，我的目标是也为您提供大量关于如何撰写政策（和程序）的实用建议。


  We''ll have a (one-way, of course) conversation related to the following topics:


  我们将就以下主题进行（当然是单向的）对话：


  - Company policies

  - 公司政策

  - Policy writing instructions

  - 政策编写说明

  - Company procedures

  - 公司程序


  ## Company policies


  ## 公司政策


  The purpose of company policy is to create and define standards of behavior within
  a business, detailing the duties of both workers and employers. The administration
  of corporate policy and procedures seeks to safeguard both the legal rights of employees
  and the economic interests of employers. Depending on the demands of the company,
  diverse policies and procedures define regulations for employee behavior, attendance,
  dress codes, privacy, and other aspects of the terms and conditions of employment.


  公司政策的目的是在企业内部创建和定义行为标准，详细说明员工和雇主的职责。公司政策和程序的管理旨在保护员工的合法权利和雇主的经济利益。根据公司的需求，不同的政策和程序定义了员工行为、出勤、着装规范、隐私以及雇佣条款和条件其他方面的规章制度。




  ## 如何为您的业务确定适当的政策？


  在以下情况下，公司应制定并应用政策：


  - 全公司范围的行为准则（着装规范、电子邮件、互联网政策或智能手机使用）

  - 处理典型情况的指导（行为标准、差旅费用或公司商品采购）

  - 组织的法律方面（骚扰指控或歧视性招聘和晋升做法）

  - 遵守政府法规和机构（《家庭和医疗休假法》、《美国残疾人法案》、《平等就业机会委员会》或最低工资法规）

  - 建立统一的工作规则、规章和标准（渐进式纪律、安全规则以及休息和吸烟休息的指导方针）

  - 为员工提供公平待遇（福利资格、带薪休假、学费补助、丧假或陪审团豁免）

  - 采用政策可能还有其他原因，但不要让一名员工的可怕行为成为实施会影响他人的规定的动力


  为保持合规和健康的企业文化，员工需要一致的公司政策来指导他们在任务和职责中的行为，以及组织的根本商业价值观、道德和信念。此外，书面规则和程序可保护您的企业免受任何法律诉讼。


  制定书面规则似乎是一项艰巨的任务，特别是如果您同时还要管理其他责任，但以下是一些可供您入门的政策：


  - **人事政策** – 明确规定工作时间、行为准则、雇佣条件（关于招聘和解雇）、收入或薪资（以及如适用时的奖金）、保险和健康福利、带薪与无薪休假日、病假和退休。

  - **纪律处分政策** – 处理诚实、绩效、安全和不当行为问题，并确定构成违反公司政策的行为以及员工违反特定规章时将如何受到惩罚。

  - **安全政策** – 制定规则描述工作场所安全行为的外观、如何使用安全设备、如何报告安全风险等，以行业最佳实践和适用的地方、州和联邦法规作为指导。

  - **技术政策** – 制定工作场所个人原因使用互联网、电子邮件和社交媒体的可接受和不可接受行为的标准。

  - **隐私政策** – 通过实施促进与客户开放和信任的政策来保护您的员工、您的组织和您的客户。

  - **付款政策** – 确定消费者和供应商与您的组织开展业务的条件。设定适当的付款期限并定义逾期或未付款的处罚。

  - **保密政策** – 保护敏感信息并确保包括供应商、客户和其他供应商的联系。

  - **举报人政策** – 确保您有反报复政策以保护您的员工和您的业务。

  - **员工绩效政策** – 定义每位员工的工作，包括其责任程度、决策权、总体目标和具体职责。确定通过培训进行绩效监控和人员发展的明确机制。

  - **文件和记录保留规则** – 根据地方、州和联邦法规制定文件保留和存储的有序政策。请对此格外小心，因为它可能还涉及 GDPR 保留政策。


  ## 政策编写说明


  建立新政策或更新现有政策时，您应遵循以下写作技巧：


  - **保持简单** – 政策需要用通俗易懂的术语表达，而不是法律术语。政策应简单到所有员工（从 CEO 到清洁人员）都能理解。

  - **保持通用** – 政策无法预见所有可想象的情况。政策应以足够的具体性起草，以便适用于各种情况。彻底的帮助可以以常见问题解答或详细的过程规则或标准的形式提供。

  - **使其相关** – 政策应向受众解释其存在的原因、谁会受到影响、其中最重要的规则和限制、何时以及在什么条件下适用，以及应如何实施。*…条款*应在*定义*下为读者明确解释。

  - **验证正确性和一致性** – 确保拟议的政策符合已实施的所有现有政策（如有），以保证一致性。同时，验证这些政策不会违反任何现行的国家、联邦或州法律、监管要求或行业标准。

  - **确保政策可实施** – 如果政策不打算执行或在没有足够资源的情况下做出承诺，则不应制定政策。

  - **明确指定谁负责什么** – 精确定义部门和人员的角色和职责。确保政策明确规定谁有权做出特定选择以及谁应对履行某些职责负责。

  - **少即是多** – 政策不需要很长。在许多情况下，越短越好。政策的目的是简单清晰地传达重要信息。较长的政策可能更难理解、实施和解释。


  到目前为止，我们已将政策定义为组织及其人员为实现特定目标（即合规）而遵循的规则或指示的集合，它们必须回应员工必须或不得做什么，并提供指令、界限、原则和决策指导。政策回应诸如“什么？”和“为什么？”之类的问题。


  ## 那么程序呢？


  程序是政策的对立面；它们规定政策应如何实施。政策概述规则，而程序则规定谁应遵循规则以及如何遵循。程序解决诸如“如何？”、“何时？”和“在哪里？”之类的问题。


  在不审视其目标的情况下，太多企业将规则和程序视为必要的恶。它不是关于最佳实践或成为没有灵魂的公司；政策和程序的目标是描述管理层希望发生什么以及应如何发生。


  我逐渐感到，小型和中型组织之间的关键区别在于管理层是否花时间设计、执行和维护政策和程序。


  拥有成熟政策、流程和系统的公司更容易审计，对其安全态势和风险有更好的把握，并且似乎比那些对治理关注甚少的人运营得更可持续。


  ## 政策和程序的重要性与其痛苦


  一旦管理层了解政策和程序的定义，他们就不再问“政策和流程是什么？”和“政策的目的是什么？”，而是问“为什么我必须制定政策和程序？”小型企业的管理层在记录政策和程序时通常面临相同的一系列障碍，所有这些都与所涉及的复杂性、企业文化和时间限制有关。然而，我们不要忘记：政策和程序的好处超过了其缺点。政策和程序的目标远远超出了简单的文件记录。通常，我对这些优势的描述是这样的。


  起草政策和程序很困难，但也没那么困难。如果大多数组织缺乏完善的规则和流程，它们就不会继续经营。显然，指定


  从一开始就注重安全，但这并不意味着不可能从你今天正在做的事情开始，然后再逐步调整。


  有时，主要争论点并不是记录规则和流程有多困难，而是大多数人对记录自己做事错误的方式感到恐惧。先从现状出发，然后对你想要达到的目标保持现实。在某些情况下，你可能达不到最佳实践水平，但如果你允许那种羞耻感阻止你记录规则，你就错过了重点。精确地知道你现在在做什么，才能让你确定明天应该做什么。这就是你能够制定真实预算、发现真正的业务风险，并在任何事情出错时有效应对的方式。


  如果你的做法并不 *正确*，但你对它诚实，那远比什么都没有记录的问题小。


  例如，关于如何撰写隐私政策的最佳范例之一就来自 Twitter。作为全球最大、最受欢迎的社交网络平台之一，Twitter 的隐私政策是全面但易于获取的政策的绝佳范例。利用颜色编码、超链接和突出显示，它组织良好且易于浏览。然而，该隐私政策的长度是一个明显的缺点。请注意滚动条：这使得用户更难以快速理解
  Twitter 如何收集、使用和保护用户数据（你可以在此处查看：https://twitter.com/en/privacy）。


  政策和程序不会改变你的公司，但它们很可能会改变你的视角！把所有事情写下来、实施正式程序并建立期望，会要求你放弃一定的灵活性。这些新特性可能需要对公司结构、商业文化、收入渠道或
  *非正式但优秀* 的程序进行调整，以满足你所列出的标准。取决于你当前的组织结构，你可能会意识到需要额外人员来承担新职责，或者某些程序可能会变慢。


  例如，随着新规则和流程的实施，你的网络工程师在进行防火墙调整前现在必须获得管理层的批准。你的团队可能不能再简单地打电话请求访问额外的网络段。这难道不会增加一些时间和一些烦躁吗？另一方面，如果你失去了那个精确知道防火墙为何如此配置的人，你会损失多少？如果不记录这些程序，你就会制造巨大的漏洞。人员、培训、标准和应用——如果这点额外开销能保证你牢牢掌握组织内部、网络和企业中发生的事情，它值多少钱？


  然而，你可以通过将公司文化融入其规则和流程中来减少转变的幅度。没有任何规定说规则和程序必须极其正式、枯燥难读且充满法律术语。是什么因素吸引潜在员工？将你的规则和流程适应公司的文化、运营和人际动态。这将减少应用它们的难度并有助于保护组织的身份。


  你还记得《爱丽丝梦游仙境》里的白兔吗——那只戴着大钟、说着“没有时间”的奇怪兔子？情况就是这样。我从未听过“没有时间”作为不编写政策和程序的借口被提及如此多次。在人员精简、流动快、专注于用更少资源完成更多工作的世界里，找到治理时间可能非常困难。因此，这并不重要。我可以给你一本又一本的管理书籍、一篇又一篇的文章和一份又一份的白皮书，说明遵循既定规则和程序将如何在各个层面造福你的组织。


  如果你能致力于实施和执行你的规则，你会被审计变得多么容易的短期收益所震惊，更会被你将获得的长期利益所震惊。你的运营将不那么紧张，你的员工将有更多指导，而且如果做得正确，你最终将精确地理解你在管理什么以及为什么。


  政策和流程的好处超过了它们的缺点。致力于这一过程的回报是巨大的。


  ## 如何实际撰写政策？


  使用模板：建立一致的政策模板可确保每份政策文件都有条理且易于理解。它为所有未来法规的撰写和安排设定了基线，使其易于阅读和导航。


  即使在未来几年你制定了许多额外的法规，格式也很容易复制，因为你今天已经建立了这一标准。这也将促进写作过程并节省大量时间。


  > Tip

  > 如果你的实体尚未建立任何政策，一个好主意可能是制定一份关于如何起草政策的政策。


  以下是一些可放入草案政策中的建议内容：


  - 有关政策的信息，例如政策的标题、生效和修订日期、批准人签名以及适用的部门

  - 引言或目的陈述：它是什么？为什么有必要？

  - 组织对该主题的立场是什么？


  在过程中澄清术语至关重要，特别是含义多样的词语和短语以及行业或工作特定术语。这使规则易于理解，并可能在诉讼发生时帮你避免因术语而争论。


  定义员工行为准则和限制。违反规则的后果是什么？


  事件和违规行为应如何报告？报告的方法是什么？


  基本上，先思考再写作。一旦政策获批，废除它、再次获得管理层批准等可能需要时间。


  ## 选择管理流程的方法


  你可以在你喜欢的文字处理器中创建所有法规，但然后你必须分发文档以便每个人都能批注自己的副本，导致同一页面的多个副本。


  另外，你可以将其上传到基于云的文字处理器，从而减少需要管理的版本数量。每个人都可以编辑同一文档，所有更改都会被保存。然而，你仍然需要一个提供版本控制并能将你的规则与你的认证和许可要求相匹配的解决方案。


  ## 建立政策管理小组


  根据你公司的规模，你可能需要在编写政策和程序时获得帮助。它也有助于获得公司内部利益相关者的更多认同。此外，它能确保你不会忽略重要事实。


  由于你的规则会影响公司中的每个人，你应该征求来自不同部门人员的帮助。请教特定部门或职能运作方面的主题专家。包括那些了解并能帮助你遵守影响该团体运作的任何适用地方、州和联邦法律的人。


  > **Tip**

  > 假设你撰写一份人力资源政策，包括招聘、解雇等所有相关步骤，并且可能适用一些国家、地区或其他法律。因此，与人力资源团队合作以制定更好、更明确的政策至关重要。


  现在你有了管理层的支持、有组织的团队、框架和技术解决方案，你已准备好开始写作。以下是它应如何运作。


  ## 优先制定政策清单


  你不能一次写完所有政策，有些政策比其他政策更重要；因此，列出必须首先完成的政策清单。根据其相对重要性优先考虑新法规和修正案，并为其完成制定时间表和顺序。


  与你的政策团队（如果有的话）协商以确定需要解决的问题。带着最终目标在心中有意识地定义这些优先事项可以帮助你保持正轨。




  进行详尽的研究。审查您现有的流程，以确定事情目前是如何执行的。此外，您还需要评估可能导致政策审查的任何合规问题。


  有很多方法可以分析和研究现有流程：


  - 面试负责日常活动的员工

  - 观察同事以确定现有做法

  - 面试内部和外部专家

  - 查找最新的法律法规、规则和认证标准

  - 识别重叠的规则以确保术语和标准统一


  ## Creating a preliminary draft


  撰写政策和程序是一个持续的过程。初稿需要多次修改。征求利益相关者和同事的意见是明智的，您应根据他们的评论修改文稿。


  让除政策负责人以外的人起草原始文件可能会带来外部视角，使您的流程最终更易于转移到日常运营中。


  这也有助于澄清措辞并消除工作中不必要的技术术语。


  避免使用大量行业特定词汇，特别是如果您的公司涵盖多个许可组、角色和部门。相同的缩写和词语对不同员工群体可能有不同的含义；因此，您需要防止误解。


  此外，限制技术术语可以使不熟悉业务的新员工更容易理解您的规则和流程。


  ## Verifying the processes


  为保证您方法有效性，您必须看到它们在实际运行中；通常最好让执行日常工作的员工来执行这些流程。


  请记住，这仅适用于员工手册中的《程序》部分，而不适用于《政策》和《禁止行为》部分。


  ## Sending a draft out for review


  现在您有了草案，是时候对其进行评估了；如果非专家撰写了第一份文件，您应请专家审阅。这是对您政策成功的关键。您需要在主题专家所需的全面性与非专家所需的清晰简洁之间取得平衡。


  ## Obtaining final approval and signatures


  通常，任何新政策都必须由执行团队成员批准。因为他们最终对政策负责，所以必须正式认可最终文件。这应始终由每个政策的最高层领导来执行。


  例如，新的泄漏清理措施不需要 CEO 批准，但工作场所骚扰和机密信息处理则需要。同样，IT 经理不应批准员工行为准则；该责任在于 CTO 或 CIO，他们最终负责。


  ## Employee Code of Conduct example draft


  员工行为准则手册是最重要的组成部分之一。我们准备了一份行为准则模板，帮助您以直接且体贴的方式向员工传达期望。


  请记住，此模板不是法律文件，可能不符合所有适用的地方和国家法规。请要求您的律师评估最终的政策文件或手册。


  ## Template for the Employee Code of Conduct


  作为员工，您有责任在工作中行为得当。在此，我们概述我们的期望。我们无法涵盖所有可能的行為情况，但我们相信您始终会做出明智的判断。如有任何疑虑或问题，请联系人力资源部门。


  ## The dress code


  我司的正式着装规范为 business/business casual/smart casual/casual。这包括西裤/乐福鞋/衬衫/靴子。然而，员工的职位也可能影响其着装。如果您经常会见客户或潜在客户，请着装更正式。我们希望您保持整洁上班，避免穿着不专业的服装（例如运动服）。


  只要您遵守上述标准，我们对您的着装或配饰没有特别要求。


  我们也允许并尊重宗教信仰、种族或残疾如何影响工作场所的个人护理风格、着装风格和配饰。


  ## Internet security and electronic gadgets


  本节涉及工作场所中的所有数字事物。为维护安全并保护我们的资产，我们希望为计算机、电话、互联网连接和社会媒体的使用建立标准。


  ## Internet use


  我司互联网连接主要用于业务目的。然而，只要不影响您的工作职责，您偶尔可以出于个人原因使用我们的互联网连接。


  如果被要求，我们也期望您暂时停止会减慢互联网连接的个人活动（例如图片上传）。


  以下行为被禁止：


  - 使用我们的互联网连接下载或上传淫秽、冒犯或非法内容

  - 向未经授权的各方传输敏感信息

  - 侵犯他人的隐私并获取敏感信息

  - 下载或上传盗版电影、音乐、资料或软件

  - 访问可能损害网络和电脑安全的潜在有害网站

  - 进行未经授权或非法的行为，例如黑客攻击、欺诈或非法物品的购买或销售


  ## Cell phones


  我们允许在工作中使用手机。然而，我们也希望确保您的设备不会分散您的工作注意力或干扰办公环境。请遵守以下非常基本的规定：


  - 将手机用于工作相关目的（商务电话、生产力应用、日历）

  - 为避免打扰同事，请在空会议室或公共区域接听私人电话

  - 避免玩手机游戏和过度发短信

  - 操作工作用车时绝不使用手机

  - 不要在手机上记录个人信息

  - 使用公司互联网连接时，不要下载或发布不当、非法或淫秽内容

  - 此外，您不得在明确禁止使用手机的场所使用手机（例如实验室）


  ## Corporate email


  电子邮件对我们的业务至关重要。您应主要将工作邮箱用于业务目的，尽管我们允许偶尔的个人使用。关于如何在工作中使用商务电子邮件的指导：


  - 用于工作相关目的。企业邮箱用于工作相关活动没有限制。例如，您可以订阅有助于职业或专业发展的出版物和在线服务。

  - 个人使用。只要您保持其安全并避免发送垃圾邮件和泄露敏感信息，您就可以将电子邮件用于个人目的。例如，您可以向亲友发送电子邮件并下载电子书、手册和其他个人用途的信息。


  ## Our general expectations


  关于您如何使用商务电子邮件，我们希望您避免以下行为：


  - 注册非法、不值得信赖、名声不佳或可疑的网站和服务。

  - 发送未经请求的商业电子邮件或资料。

  - 未经许可注册竞争对手的服务。

  - 发送冒犯性或歧视性的通讯和信息。

  - 发送未经请求的电子邮件，即使是对同事。

  - 总体而言，使用强密码并在检测到恶意或钓鱼邮件时保持警惕。如果您不确定收到的电子邮件是否安全，请咨询我们的安全专家。


  ## Social media


  我们希望提供一些建议，以避免在工作场所中不负责任地使用社交媒体。我们将讨论在工作中使用个人社交媒体以及使用社交媒体代表我们组织的情况。


  ## Personal use of social media at work


  在工作中使用社交媒体的一般指导：


  - 您被授权在工作中使用个人账户。然而，我们希望您根据我们的规则负责任且富有成效地行事。具体而言，我们要求您自律，避免被社交媒体网络分散注意力。

  - 确保人们知道您的个人账户或声明不代表我们的组织。使用免责声明，例如“These are my personal thoughts.”




  - 避免泄露知识产权（如商标）或敏感信息。在分享未宣布的公司新闻之前，请咨询您的主管或公共关系部门。

  - 避免任何诽谤、侮辱或贬低性的信息。如果您向同事、客户或业务合作伙伴发送此类材料，您可能会违反我们公司的反骚扰政策。


  ## 通过社交媒体代表我们的业务


  通过公司管理社交媒体时的指导：


  - 如果您管理我们的社交媒体账号或在公开场合代表我们的公司，我们期望您维护其形象和声誉。具体来说，您必须表现出尊重、礼貌和耐心。

  - 在可能的情况下，避免讨论超出您专业领域的话题。

  - 遵守我们关于保密和数据保护的标准，以及规范版权、商标、抄袭和合理使用的法律。

  - 在分享可能产生重大影响的任何材料之前，请与我们的公关或市场营销部门协调。

  - 避免在没有正当理由的情况下删除或忽视评论。

  - 尽快纠正或删除任何误导性或不准确的材料。


  ## 竞争利益


  当您存在利益冲突时，您的个人目标与您对我们的职责不再一致。例如，持有我们竞争对手的股份即构成利益冲突。


  在其他情况下，您可能会遇到道德困境。例如，接受贿赂在财务上可能有利，但它是违法的，并且违反了我们公司的道德准则。如果我们发现此类行为，您将被解雇并可能面临法律后果。


  因此，利益冲突是我们所有人的重大关注点。我们期望您在识别对您自己或直接下属构成利益冲突的情况时保持谨慎。遵守我们的规则并始终以公司最佳利益行事。尽可能避免让个人或财务问题干扰您的工作。与您的经理或人力资源部门讨论任何道德问题，我们将尽力协助您解决。


  ## 员工互动


  我们旨在确保所有员工互动都合适且友好。请遵守我们的原则并始终以专业态度行事。


  ## 同事交往


  术语 *同事交往* 指的是约会或与同事交友。在本政策中，*约会* 指的是浪漫关系和合意的性接触。非合意的恋爱关系构成性暴力，我们明确禁止此类行为。


  ## 约会同事


  如果您与同事开始浪漫关系，我们希望您保持专业性并将个人对话保持在办公室之外。


  您还必须尊重彼此约会的同事。我们不接受性玩笑、恶意谣言或不当言论。如果您遇到此类行为，请通知人力资源部。


  ## 约会经理


  为防止偏袒、滥用职权和性骚扰的指控，主管禁止与直接下属约会。此限制适用于所有向经理汇报的员工。


  此外，如果您是团队的招聘经理，您不能雇用您的配偶。您可以将他们推荐给您没有管理或招聘权限的其他团队或部门。


  一起工作的员工可能会在工作内外发展友谊。这种同事间的联系是被鼓励的，因为它可能促进沟通和协作。然而，我们期望您优先考虑工作并将个人问题留在办公室之外。


  ## 雇用亲属


  我们组织中的每个人都应基于其能力、品格和工作态度获得雇用、认可或晋升。我们不希望看到裙带关系、偏袒或利益冲突，因此我们对员工的亲属施加了雇佣限制。


  对我们组织而言，*亲属* 是指与员工在三代以内通过血缘或婚姻关系相连的人。这包括以下人员：父母、祖父母、姻亲、配偶或同居伴侣、子女、孙子女、兄弟姐妹、叔伯、姑姨、侄女、侄子、外甥、外甥女、继父母、继子女和养子女。


  作为员工，您可以向我们组织推荐家庭成员。以下是我们唯一的限制：


  - 您不得与亲属存在监督或下属关系

  - 如果您向亲属汇报，则不符合调动、晋升或雇用的条件

  - 如果您的亲属正在接受该职位的面试，您不能担任招聘委员会成员

  - 如果您在加入我们组织后与经理或直接下属建立关系，我们可能需要调动其中一人


  ## 公司访客


  请在邀请客人到我们办公室之前，先获得我们的人力资源经理/安全官/工作场所经理的授权。此外，请通知我们的接待处/大门/前台您客人的到访。访客需要登记并提供身份证明。他们将被发放通行证，并在访问结束时被要求将其归还给接待处/大门/前台：


  - 当您有办公室客人时，您负有义务。您必须始终照顾您的客人（尤其是未成年人）。

  - 将客人带离含有危险机械、化学品、私人文件或敏感设备的场所。

  - 防止您的客人试图在我们的物业范围内向同事传教、索要礼物或寻求参与活动。

  - 任何向我们员工送订单、邮件或交付的人必须在建筑物的接待处或大门等待。如果您正在等待交付，前台工作人员/保安人员会通知您以便您领取。


  ## 分发和招揽


  招揽是指为无关的物品、个人、组织或事业要求任何类型的金钱、支持或参与（例如，宗教传教或征求请愿书签名）。分发是指为商业或政治目的传播材料的行為。


  非员工的招揽和分发在我们的工作场所是禁止的。作为员工，您只能在要求同事协助为另一名员工安排活动时（例如收养或出生、晋升或退休）向同事进行招揽。


  您可以为由我们组织赞助、支持、协调或批准的事业、慈善机构或筹款活动招揽支持。


  您可以邀请同事参加为允许的非业务目的（例如娱乐或志愿服务）举办的员工活动。


  您可以邀请同事加入受法律保护的与就业相关的活动或组织（例如工会）。


  在所有情况下，我们敦促您避免打扰或分散同事的工作注意力。


  ## 云托管政策


  本政策非常具体，并且计划在全球范围内可用。


  > 提示

  > 这是一个政策样本。


  ### 1. 引言：


  信息安全旨在促进 ACME 的使命。ACME 由具有不断变化的信息技术资源和数据需求的多元化群体组成。ACME 管理层致力于在保护和促进业务和行为自由的同时保障这些资源。虽然思想和信息的自由交流与信息安全之间存在内在张力，并且在某些情况下会表现出来，但以下框架已被确定以在信息安全和学术自由之间实现最佳平衡。


  本政策描述了外部托管 ACME 平台和服务适当且经批准使用的要求。


  ### 2. 目的：


  为确保存储在 ACME 所有、租赁或个人拥有的硬件和软件上的受保护数据得到充分保护；本政策制定了实施、转移、移除和处置所有存放此类信息的硬件的要求。


  ### 3. 范围：


  本政策还适用于所有有权访问 ACME 资源的用户，包括所有员工、承包商、访客、顾问、临时员工和其他用户。确定适用于特定数据形式的敏感程度是为该类型数据建立必要保障措施的第一步。


  ### 4. 定义：


  系统和/或数据的云托管可归类为以下模型：


  - **软件即服务 (SaaS)** 是一种软件分发模式，用户可以通过通常为互联网的网络访问由供应商或服务提供商托管的应用程序。

  - 通过 **平台即服务 (PaaS)** 可以在线租用硬件、操作系统、存储和网络带宽。客户可以使用服务交付模式租用虚拟化服务器和相关服务来运行当前应用程序或创建和测试新应用程序。




  一个组织可以使用 **基础设施即服务 (IaaS)** 提供商模式外包支持运营所需的硬件、软件、服务器和网络组件。设备归服务提供商所有，服务提供商也负责其托管、运营和维护。


  为本文件之目的，术语云计算服务用于涵盖 SaaS、PaaS 和 IaaS。


  对于云托管系统（SaaS、PaaS、IaaS 及类似）或数据，每个系统所有者必须确保信息分类政策中所述的系统保护。因此，*在此定义受保护系统及其提供的保护类型很重要。*


  **EU-GDPR**：**通用数据保护条例 (GDPR)**


  **ISO/IEC 31010**：关于风险管理的标准


  **ISO/IEC 27001**：规定旨在将信息安全纳入管理控制的管理体系并给出具体要求


  **HIPAA**：1996 年的**《健康保险流通与责任法案》**


  **HITECH**：HITECH 法案对采用和有意义使用可互操作的**电子健康记录 (EHRs)** 制定了指导方针


  **FISMA**：2002 年的**《联邦信息安全管理法案》**


  **PCI/DSS**：**支付卡行业数据安全标准**


  **FERPA**：允许家长访问其子女的教育记录


  **PIPEDA**：**《个人信息保护和电子文件法》**（加拿大）


  **数据保管人/数据保护官**：负责公司书面或电子记录的人员，同时根据公司的安全政策或公认的 IT 实践保护数据。


  ## 5. 政策


  如果使用云计算服务存储敏感数据和/或机密数据，则这些服务的合同必须经 ACME 采购服务批准，并且适用的信息安全官必须根据风险等级在实施前后评估系统的安全措施。


  除其他 ACME 政策外，使用云计算服务时必须遵循以下要求：


  ### 5.1 – 先决条件要求


  在评估过程中咨询适当的数据所有者、流程所有者、利益相关者和主题专家，或向适用的信息安全官寻求指导。


  ### 5.2 – 合同要求


  - 5.2.1 – ACME 和供应商都必须声明由于其关系可能相互传输的数据类型。合同必须有明确条款定义各方拥有的数据。各方还必须明确定义必须受保护的数据。

  - 5.2.2 – 合同必须明确说明 ACME 拥有哪些数据。它还必须根据 ACME 的数据分类政策要求对合同中共享的数据类型进行分类。部门在云计算服务内共享敏感或机密数据（按
  ACME 的信息分类政策定义）时必须谨慎。

  - 5.2.3 – 合同必须规定供应商可以如何使用 ACME 的数据。供应商不得以任何违反法律或本政策的方式使用 ACME 的数据。


  ### 5.3 – 确保与供应商存在服务水平协议 (SLA)，要求如下：


  - 5.3.1 – 服务的明确定义

  - 5.3.2 – 约定的服务水平

  - 5.3.3 – 绩效测量

  - 5.3.4 – 问题管理

  - 5.3.5 – 客户职责

  - 5.3.6 – 灾难恢复

  - 5.3.7 – 协议终止政策

  - 5.3.8 – 敏感信息和知识产权的保护

  - 5.3.9 – 供应商与客户责任的定义，特别是关于备份、事件响应和数据恢复


  ### 5.4 – 在将服务整合到正常的内部业务实践和/或业务连续性和灾难恢复计划中之前，不应在未制定退出策略以脱离供应商或服务的情况下使用云计算服务。ACME
  必须确定如何从供应商处恢复数据。


  ### 5.5 – 在任何第三方托管或云计算服务安排之前，适用的信息安全办公室必须进行适当的风险评估。


  ## 6. 知识产权和版权材料（也适用于隐私和数据安全）


  ACME 将信息分类为非密公开、专有、客户机密数据或公司机密数据的信息只能根据可在信息分类政策中找到的信息分类相关政策使用。


  ## 7. 个人身份信息 (PII)


  个人身份信息 (PII) 只能在遵守联邦、州或地方法律法规或行业标准保护的信息范围内使用，例如 GDPR、HIPAA、HITECH、FERPA、PIPEDA 和
  PCI-DSS。


  ## 8. 数据可用性和记录保留：


  ### 8.1 – 确保所有学术、行政或研究相关数据根据记录保留和 EU-GDPR 要求进行保留。


  ### 8.2 – 定期备份数据以确保记录在需要时可用，因为许多提供商不对内容数据恢复承担任何责任（有关更多信息，请参阅 ACME 业务连续性和灾难恢复政策）。


  ## 9. 角色和职责：


  ### 9.1 – 安全和数据安全将负责运营，并得到法律和 ERP 部门的支持。


  ## 10. 其他适用政策：


  - P001：信息安全政策

  - P002：在 ACME 办公室内部设备位置的永久性变更

  - P003：设备销售和处置

  - P004：设备捐赠和转移给其他实体（例如，慈善机构）

  - P005：从 ACME 资产中删除设备

  - P006：ACME **可接受使用政策 (AUP)**


  这些只是示例：您可以根据需要对其进行自定义，通过互联网查找其他模板和示例，并且仍然可以在网上以合理的价格购买一些不错的套餐。当然，我的建议一如既往，是聘请第三方咨询公司来完成工作，然后您可以自行更新。


  ## 公司程序


  您是否愿意经历一个复杂的过程来获取一支额外的笔或一本纸垫？当然不！


  程序及其近亲，政策，可能是真正的令人头疼。有时它们过于严格和限制，而有时又过于笼统，缺少具体内容。然而，如果同事请病假而您突然在紧急情况下负责，您只需阅读并理解一个程序即可替代那位生病的同事。因此，有一份写得好、清晰的协议可供遵循是有帮助的。


  如果执行得当，程序可能对组织产生重大影响。当表述清晰正确时，它们可以提高系统和个人的功能。如果您的员工知道该做什么、何时做、如何做以及如何避免犯错，您可以减少烦恼并节省大量时间和精力。


  程序是公司的主力。程序详细说明“如何”完成工作或流程，而政策则概述个人应如何做出选择。


  程序强调行动。它们描述需要执行的操作及其必须采取的顺序。它们通常具有指导性，可用于培训和入职。典型的写得好的流程是扎实、准确、真实、简洁和直接的。


  撰写准确、简洁且易于理解的方法并不总是简单。然而，通过一点信息和经验，您可以培养良好的程序编写能力并认识到许多提高工作质量的机会。


  > **提示**

  >

  > 许多程序似乎是*黑白分明*的，具有明确的阶段和单一方法：“完成 A，然后 B，然后 C。”不过，有时有必要不那么精确并允许个人自由裁量。当方法过于严格时，可能会导致误解。由于生活并不总是简单直接，一些方法必须允许主观性和个人选择。


  ## 程序何时必要？


  如果您为基本工作设计流程，它们将被忽视，因为它们是不必要的。创建程序的第一条准则是要确保它们发挥作用：也许个人忘记完成特定活动，也许他们继续犯错，或者也许工作如此冗长复杂，以至于需要清单才能成功。


  只有当问题严重或澄清方法有实质性优势时，才需要记录程序。在开始之前，请考虑人们是否真的需要或想要知道某事。


  ## 流程何时需要程序


  在一定程度上，流程可以自行运行。但随后，您的公司需要将其写下来，使其清晰：


  - 范围广泛（例如，年终盘点）

  - 复杂（例如，福利管理）

  - 常规，但每个人都必须严格遵守准则（例如，工资单）

  - 需要一致性（例如，处理退款请求）

  - 涉及文件记录（例如，纪律处分员工）

  - 涉及重大变更（例如，安装新的计算机系统）

  - 错误后果严重（例如，安全准则）




  在一个正常的企业中，许多任务都是在没有正式流程的情况下执行的。存在不成文的规范和非正式流程。然而，有时这些不成文的原则必须通过流程加以规范化。以下是可能需要发生这种情况的一些示例：


  - 不断被提出类似的问题

  - 人们似乎感到困惑

  - 该技术的可能解释太多


  ## 如何编写规程


  不仅读者希望知道的内容，也应传达他们必须知道的内容。读者可能需要知道如何更准确、更快或更少浪费地完成任务。他们可能还想知道为什么必须以特定方式执行任务、在哪里可以获得帮助，以及如果出现问题会发生什么。在需要时，确保您的流程同时解决技术和主观因素。


  流程拥有适当的信息量也很重要。这里有一些需要考虑的问题：


  - 用户是否有足够的信息采取行动？

  - 它是否包含足够的信息来帮助用户做出合理的专业判断？

  - 信息程度是否适合主题？

  - 细节程度是否适合受众？

  - 读者对该主题有多熟悉？


  ## 第一步：收集信息


  在开始写作之前，您应该收集有关您正在创建的技术的大量信息。


  与主题专家以及掌握关键知识的人员交谈，包括长期员工、利益相关者、技术人员和流程使用者。


  做好大量笔记，然后在方便时整理材料。作为流程作者，您应该全面了解正在发生的事情。从那里，将信息精简为最终用户完全理解该规程所需的内容（思维导图是整理信息的绝佳工具。这可以帮助您确保已包含并链接了所有必要组件）。


  ## 第二步：开始写作


  在撰写方法初稿时，您不必担心术语和结构的完美性。主要目标是提供必要的信息。之后，您可以专注于措辞和安排。


  这里有一些有用的指导原则：


  - 按发生的顺序记录活动

  - 从第一个动作开始，以最后一个动作结束

  - 避免冗长的措辞

  - 只要明确到足以确保清晰沟通即可

  - 使用项目符号和列表

  - 如果过于简略，您可能会失去清晰度

  - 解释您的假设并确保其准确

  - 谨慎使用行话和俚语


  ## 第三步：评估设计元素


  您可能会发现，仅靠文字不足以描述该技术。有时，额外的功能可能会增强演示效果。以下是一些常见的格式。


  ### 流程图


  这是流程的示意图。您可以使用一系列符号和箭头来显示活动流程，从而概述和简化流程。确保您的图表不包含太多奇怪的符号或过多的文本。如有必要，将其分成多个较小的流程图。


  ### 剧本


  这看起来像是包含许多角色的剧院剧本。然而，在这种情况下，您列出具有不同职责的员工。当多人参与流程时，剧本可能特别有益：


  | 负责人 | 动作 |

  |---|---|

  | | 收集信息 |

  | 作者责任 | 编写流程 |

  | | 与利益相关者分享草案 |

  | | |

  | | 审阅草案 |

  | 利益相关者责任 | 提交评论和更正 |

  | | |

  | 作者责任 | 创建最终草案 |

  | | |

  | 经理（业务部门） | 批准最终版本 |


  部门主管必须批准最终版本。


  ### 问答


  将常见的流程问题与适当的回答匹配。这种风格在方法不明确或存在多种变体时是有益的。它也有助于解决“what if”问题。


  *示例：*


  Q：列不平衡时会发生什么？


  A. 首先，不要惊慌。从最基本的解释开始并向后推算。重新计算每一列。然后，查找转录错误。如果这不能解决问题，请检查您是如何获得数据的。如果您对任何一点不确定，请再次核实这些数字。然后，系统地审查每个数字，直到发现问题。


  ### 矩阵


  表格将一个变量与另一个变量关联起来。变量相交处，单元格显示相应的操作。矩阵表对于参考非常有用，因为它们最大限度地减少了重复搜索的需要。您可以将它们用于各种目的，包括确定要做什么活动以及何时做，帮助用户做出选择，以及确定使用哪些表格或报告：


