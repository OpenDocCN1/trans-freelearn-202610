  ### ISMS、控制措施、承诺、背景、范围政策和目标


  让我们尝试理解 iSMS 是什么以及如何处理它。


  ### ISMS


  你可能从未听说过 iSMS 这个词。


  在 **治理、风险管理、合规 (GRC)** 极客俚语之外，它并不常见，但如果你想成为俱乐部的一员，你应该称之为 **信息安全管理体系**，简称为 iSMS。如果你的公司已经实施（或正在实施）基于风险的信息安全管理政策，请确保它（或将）使用
  iSMS 来完成，以确保事物标准化。


  主要优势在于此类系统有助于遵守多项法规，包括 **通用数据保护条例** (**GDPR**)，并专注于我们已经看到的三个关键要素：*保密性*、*完整性* 和 *可用性*。为了正确性，我们应增加
  *不可否认性*（例如，你不能假装你没有收到一封电子邮件）和 *可靠性*（系统健康时也必须可靠）。在某个时候，NIST 引入了 *真实性* 的概念，即真实且能够被验证和信任的属性；但尽管正确，它引发了一个备受争议的话题。我指的是数字副本的
  *旧* 问题，主要问题是：可以把数字副本（例如 PDF 文件）视为原件或 *真实副本* 吗？当你和另一个人在私人或公共环境中填写表格时，哪一个被视为原件？其中任何一个都可以被视为原件吗？*母版*，即产生所有副本的文件，即使
  *副本* 完全相同，是否应被视为真实的？这在 IT 安全社区中已争论了很久，且没有 *最终答案*。


  针对此信息及其系统的日益复杂、精密和全球性的威胁不断增多，再加上世界各地大量计算机和隐私相关法规的合规要求，迫使组织采取更集成的信息安全方法。个人信息安全问题不再需要硬件、软件或供应商驱动的解决方案。


  事实上，它们单独使用是灾难性地不足的。


  涉及数据安全时，关于黑客、恶意软件和网络欺诈的新闻头条只是冰山一角。由计算机故障、数据和操作系统的大规模中断，或知识产权或重要业务数据的盗窃或丢失造成的企业损失更为严重且成本更高。


  前述策略的实际结果是 iSMS。小型企业不太可能如此称呼它，但它仍然是 iSMS。核心而言，这不过是一组控制措施的集合，可将组织选择 *接受但控制* 的风险降至与其控制标准或风险接受标准相兼容的水平，以及这些控制措施发挥作用的框架。例如，每个信息管理系统都是
  iSMS，但并非旨在获得 ISO27001 认证。


  我建议将你的 iSMS 文档发布在网上，也许在企业内联网或类似的公共目录/共享位置。此技术有各种优势：


  - 任何有权访问企业局域网上 PC 的人都可以访问内联网，从而在整个企业中访问 iSMS 文档。其他部门不仅可以阅读和参考你的资源，还可以直接在自己的规则、程序等中超链接到它们。基本上，想法是将政策、程序和标准集成到正式的方法论中，包括与安全软件开发相关的（如果有的话）。

  - 材料可以很好地格式化和呈现（例如，简短、易读的摘要/介绍页面超链接到提供细节的更详尽的支持页面；嵌入图像，如流程图、思维导图... 还有安全意识内容）。

  - 只要有人有权控制放入内联网 iSMS 部分的内容（意味着某种变更管理流程来审查和发布内容），控制 iSMS 网站比控制印刷/纸质 iSMS 文件更简单。每个人都应理解，内联网上提供的
  iSMS 资源是最新的、活跃的版本。（你可能希望创建一个单独的“试用”或“草案”部分来公开建议的政策修改以供反馈，但要让该区域立即可识别，例如使用不同颜色的页面背景并明确声明这些是草案，不是你政策的实际、实时版本。）


  然而，有两个缺点：


  - 你必须具备创建、制作、发布和管理网站所需的能力和工具，或能方便地获得这样的人。

  - 因为在线页面通常打印效果不佳，你可能需要提供可打印的副本（例如 PDF）供下载和打印，来自同一网站，涵盖人们想要打印、参考、评论或任何其他用途的项目格式和沟通方式。你必须努力发展你的写作风格。虽然
  iSMS 的某些方面必须定义（例如规则），但其他方面可以更用户友好（例如指南）。完全可以对更具创意的安保意识项目有所乐趣，例如测验、填字游戏、研讨会/工作坊和抽奖。目标是通过提供有帮助、易消化的材料吸引人们并让他们参与，而不是用难以穿透的繁文缛节吓跑他们。


  **实施建议**

  针对每种信息采用统一的风格/格式，甚至在所有信息中保持一致的组件，有助于将它们连接成一个连贯、专业的套件。你有可以用来“品牌化”你的文件和其他安全意识材料的 iSMS
  标志吗？你聘请专业作家吗？他们是否定期使用模板和样式？


  当然，你不必使用它们，但就管理层的承诺而言，这类行动很容易被识别为整体的一部分。


  ### 适用性声明、风险处理计划和行动计划


  另一个缩写列表？是的，但这些真的很重要。


  适用性声明 (SoA) 是一份文件，说明你为何不符合 ISO 27001 的全部 18 项附录。它基本上是你 iSMS 适用的 ISO/IEC 27002 控制措施的正式规范。你必须在思考中保持一定的逻辑，以说服审计员重大选择并非随机做出。如果你选择不应用常见控制措施或接受重大风险，请准备好与他们进行激烈的辩论。




  很难在没有示例的情况下解释它。假设你的实体属于零售行业。在这种情况下，A.15 要求（涉及供应商关系）必须是你的首要优先事项，如下表所示：


  | A.15 |  |  |  |

  |---|---|---|---|

  | 供应商关系 |  |  |  |

  | A.15.1 供应商关系中的信息安全 |  |  |  |

  | 目标：确保组织可被供应商访问的资产得到保护 |  |  |  |

  | A.15.1.1 | 供应商关系的信息安全政策 | 控制 |  |

  |  | 针对供应商访问组织资产所带来的风险的信息安全要求应与供应商协商一致并形成文件。 |  |  |

  |  | 在供应商协议中解决安全问题 | 控制 |  |

  | A.15.1.2 | 与可能访问、处理、存储、通信或为组织信息提供 IT 基础设施组件的每个供应商均应建立并协商一致所有相关信息安全要求。 |  |  |

  |  | 信息和通信技术供应链 | 控制 |  |

  | A.15.1.3 | 与供应商的协议应包括要求，以解决与信息和通信技术服务及产品供应链相关的信息安全风险。 |  |  |


  表 2.1 – 供应商关系中控制的示例（来源：ISO 27001）


  在前面的示例中，我们需要确定在处理供应商（内部，即同一公司的一部分，或第三方）时应实施的安全保护方面。


  不必担心术语或所给的通用信息；这是 ISO，他们当然需要尽可能包含尽可能多的信息。记住，这是一个框架，而你是一个决定将什么纳入该框架的个人，你将决定主题和作者。但随后不要抱怨如果你对框架不满意：这完全是你的错。框架不是内容。因此，如果所选框架在某种程度上不起作用，不应责怪框架，而应责怪使用它的人。所以，以尽可能好的方式完善你的框架，这并不意味着使用更昂贵的东西或其他东西：只是以更一致的方式。它必须可靠，并且能够根据你的需求和环境以多种不同的方式使用。我稍后会回到框架；该表只是为了让你对预期有所了解。


  **Action Plan (AP)** 和 **Risk Treatment Plan (RTP)** 初看似乎同义；然而，AP 通常是 RTP 的发展或简化。RTP
  有条不紊地定义了处理风险评估中识别出的每个危害所需的控制措施，而 AP（或计划或项目计划）则说明你希望完成什么——谁来做、何时做、如何做。单个控制措施，特别是基线控制措施，例如物理保护组织的周边，可能处理多个风险，因此在
  RTP 中多次出现，但在 AP 中可能仅出现一次，当它被创建、实施、验证并“operationalized”（一个可怕的术语！）时。


  ISO/IEC 27000 应有助于澄清任何残余的模糊性。


  不要过于纠结于文件缩写和标题。集中于它们记录信息风险、控制目标和控制之间关系的核心目标。


  从 *operational* 的角度来看，我们首先需要理解的是资产清单的重要性。简而言之，了解和理解我们清单中的内容以保护资产免受敌对活动侵害是必不可少的，并且它们可以手动保护或使用软件保护（如果使用自动软件，无需多说，我们就不会忘记事情）。


  ## Controls


  控制是技术、程序和行为组件的组合，共同作用以实现指定的、公认的和记录的控制目标。例如，你的桌面用户系统正受到病毒、蠕虫、特洛伊木马和垃圾邮件的有害组合攻击，这将危及桌面数据的可用性、保密性和完整性。电子邮件、在线浏览和即时消息是攻击向量。其中控制措施包括以下内容：


  - 反病毒和反间谍软件、反垃圾邮件过滤器、防火墙和自动更新是技术进步的例子

  - 包括软件和防火墙配置、升级程序、事件管理程序和可接受使用政策在内的流程

  - 行为——用户在处理这些风险和反应技术方面的意识和培训，例如识别恶意软件何时尝试下载到 PC 中


  这种三管齐下的方法是所有成功控制的典型特征；仅实施其中两种会暴露出实质性的漏洞，可能抵消已采取的所有措施。大多数企业因仅采用部分解决方案而获得的虚假安全感可能非常有害。


  当然，这是在后面我们将深入探讨的内容。


  ## Commitment and project management


  要实现体面的实施，通常有若干要求，通常但不仅记录在纸上。其中 *not on paper* 的一项，而且 arguably 最重要的一项，是管理层的承诺。实体必须相信他们愿意做的事情，高层必须展示他们所有的支持和承诺，同意寻找一个团队（或代表来跟进外部公司的工作），并在内部和外部社交媒体上也展示一些支持（从内联网到社交平台）。此外，从公司角度来看，外部承诺可以被视为在网络上宣传其服务的一种方式，除此之外，当然还能证明公司所做的重大投资是合理的。


  > Tip

  > 管理层的承诺非常重要，必须被视为正式行为，以及对实施团队的支持请求，以免浪费金钱和投入。


  需要注意的是，在这些情况下项目管理的重要性。如果我们想解决公司的安全态势，我们需要处理 18 个附录，因此需要强大的规划能力；而且，如果我们想获得一个包括 NIST
  和其他框架（如 CIS Controls (https://cisecurity.org)）的全面的方案，作战计划就会变得非常有趣。


  ### Scope policy and objectives


  虽然一个或多个标准可以导致认证，但在我们的案例中，如前所述，它帮助我们建立目标和优先事项，在此背景下，我们需要核实公司需要什么。如你所想，某些控制措施比其他控制措施更重要，这取决于我们想要改善安全态势的行业类型，顺便说一下，一些标准是针对特定行业（例如，ISO
  27011 专用于电信）；但这超出了本书的范围，因此只能作为事实来接受。


  ## Identify, Protect, Detect, Respond, and Recover


  在上一章中，我们对 NIST 框架进行了重要的（并且 hopefully 好的）介绍。让我们谈谈最重要的几点。


  还记得上一章中与 NIST 相关的最重要的几点吗？


  ### Identify


  NIST 将 Identify 功能描述为“开发企业知识以管理对系统、资产、数据和能力的网络安全风险”。作为网络安全利益相关者，你可以利用此功能在企业中奠定未来成功使用该框架的基础。Identify
  的重点在于公司及其与网络安全风险的关系，特别是在资源有限的情况下。与此功能相关的一些结果类别如下：


  - 资产管理

  - 业务环境




  -   治理

  -   风险管理

  -   风险管理策略


  Identify 函数的重要性显而易见：它为贵公司未来将采取的网络安全相关活动建立了框架。识别存在的内容、与这些环境相关的风险以及其如何与公司目标相连，对于框架的成功至关重要。


  成功执行 Identify 函数可能会产生多种结果，例如以下内容：


  -   所有资产和环境必须被定义

  -   识别控制措施的现有状态和期望状态

  -   制定关闭这些差距的策略

  -   在商业环境中优先考虑缓解方法

  -   将所有利益相关者和业务领导者的需求放在首位，确定如何向各方传达网络安全问题


  组织必须调整其网络安全流程并实施必要的保护措施，以控制和减轻未来网络安全事件的影响。所有数字和物理资产必须被追踪，并且必须明确责任以及事件和风险的清晰沟通流程。您制定的规则和程序将为网络安全计划在五个功能中推进和发展所需提供稳定性。


  ## 保护


  根据 NIST，该框架的目的是“帮助组织通过组织信息、允许风险管理选择、管理风险并通过从先前运营中学习来改进，从而表达其网络安全风险管理。”


  Protect 函数至关重要，因为其目标是创建并执行必要的保障措施，以确保关键基础设施服务的交付。Protect 函数有助于限制或遏制可能发生的网络安全事件的影响。根据
  NIST，身份管理与访问控制；意识与培训；数据安全；信息保护流程和程序；维护；以及保护技术是该功能下的结果类别示例。


  Protect 涵盖以下类别：


  -   访问控制涉及确认身份并授予对各种系统、设施等的访问权限

  -   教育和培训为员工和其他人员提供参与网络安全战略的能力

  -   数据安全包括根据企业标准管理您的数据，以降低网络安全风险并确保其可用性、完整性和保密性

  -   信息保护流程和程序用于建立监督资产保护所需的政策、流程和程序

  -   维护有助于定期修复和缓解您的信息系统组件

  -   保护技术有助于实施根据业务法规要求保持公司安全的解决方案


  组织必须随着数据泄露日益普遍而进行调整。通过专注于 Protect 函数，您可以建立规则和程序，这些规则和程序将作为网络安全计划在五个功能中演进的坚实基础。


  ## 检测


  Detect 函数需要开发和实施相关操作以检测网络安全事件的存在。


  detect 功能允许及时检测网络安全事件。异常和事件、安全持续监控以及检测流程是该功能下结果类别的示例。


  显然，Detect 函数是最关键的之一，因为识别违规或事件可能是贵公司生死存亡的区别。毫无疑问，使用这些解决方案并遵守这些最佳实践将帮助您扩展计划并减轻网络安全风险。


  ## 响应


  NIST 将 Respond 定义为 *制定并实施适当的行动以应对已识别的网络安全事件。*


  *Respond 函数有助于限制可能发生的网络安全事件的影响。响应规划、沟通、分析、缓解和改进是该功能内结果类别的一些示例。*


  以下是 Respond 函数的组成部分及其重要性：


  -   **响应规划：** 为确保对疑似网络安全事件做出及时响应，响应流程和程序得到实施和维护。

  -   分析是为了确保充分的反应并协助恢复行动而进行的。

  -   **缓解：** 为防止事件蔓延、最小化其影响并消除事件而开展的活动。

  -   **沟通：** 根据需要，响应操作与内部和外部各方（包括执法机构）进行协调。


  通过应用当前和先前检测和响应操作中获得的经验教训，对组织响应活动进行改进。


  当企业发生违规时，事件响应策略对于处理即时后果至关重要。令人惊讶的是，许多公司没有事件响应计划，或未测试他们已有的计划。


  ## 恢复


  NIST 将 Recover 函数定义为 *创建并执行相关操作以维持弹性策略并恢复因网络安全事件而受影响的任何能力或服务的必要性。*


  Recover 函数能够快速恢复正常活动以减轻网络安全事件的后果。恢复规划、改进和沟通是该功能结果的一些示例。


  恢复规划包括测试、执行和维护恢复流程，以便您的计划能够尽快减轻事件的影响。


  当事件发生时，会发现改进机会，开发解决方案，并增强恢复规划和程序。在这种情况下，重要的是在内部和外部进行协调，以改进结构、详细准备步骤和执行。


  Recover 函数对于贵公司或组织从攻击中恢复至关重要，也对您的消费者或市场至关重要。以优雅和谨慎的方式管理的快速恢复将使您在内部和公开方面处于比预期更好的位置。


