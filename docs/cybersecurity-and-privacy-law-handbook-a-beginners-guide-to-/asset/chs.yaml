- '# 第 10 部分：云


  ## 云


  > *没有云；它只是别人的电脑。*


  当然，前一句是一种有点书呆子的笑话，但其实离真相并不远。


  在上一章中，我们深入探讨了社会工程学及其各个方面，现在是时候了解云的工作原理，重点关注云安全和隐私。


  本章将涵盖以下主题：


  - 云是如何出现的？

  - 云计算的七大痛点

  - 云与 GDPR 关注点

  - 针对**云服务提供商 (CSPs)** 的 GDPR 行为准则，即通过互联网提供存储服务的公司


  ### 云是如何出现的？


  由于智能手机、平板电脑和笔记本电脑等小工具的普及，我们现在几乎可以从任何地方访问互联网，这可能带来所有优点和缺点。有时，您可能在家庭电脑上创建了一个文件，但第二天去办公室时却忘了带。有时，您可能会发现自己有同一文件的多个副本，无法确定需要哪个副本。在最坏的情况下，您可能会丢失带有所有信息的智能手机、平板电脑或笔记本电脑，甚至更糟，您喜欢的小工具可能会突然停止工作。所以，协作是这里的关键词。


  ### 云到底是什么？它是如何工作的？


  为了解决这些和其他类似问题，云被创建了。云不过是一个个人存储空间，有时被称为云存储，可以通过互联网连接从任何位置访问。需要注意的是，除了云存储之外，云这个词也可以适用于云计算提供的各种服务。


  从合规角度来看，根据 NIST，“云计算[是]一种使能够实现无处不在、便捷、按需的网络访问共享的、可配置的计算资源池（例如网络、服务器、存储、应用程序和服务）的模型，这些资源可以快速配置和释放，且管理努力或服务提供商交互最少”，而德国政府遵循联邦信息安全办公室（BSI）的认证方案（法国也大致采用）。该标准名为云计算合规控制目录（C5）。他们声称“云计算是信息和通信技术（ICT）中的一种新范式。它由
  IT 服务根据客户需求动态调整并通过网络以计费方式提供组成。”此外，还有新的协会出现以支持云体验（至少在欧洲），例如云安全联盟（CSA）（https://cloudsecurityalliance.org/）以及最近的欧洲云用户联盟（ECUC）（https://ecuc.group/），它“旨在促进云用户、提供商和其他各方之间的结构化对话”，且无成本。


  云存储只需将您所有喜爱的数据同步到一个位置，提供重新下载、更改、删除和/或升级的便利，而无需携带外部硬盘、U盘或任何通常容易丢失或忘记的物品。此外，使用云存储，您可以选择创建备份副本并与您想要的任何人共享您所有喜爱的文件，只要您想要的时间长短，就能带来无可否认的时间和便利方面的好处。当然，有好处的地方也有麻烦；让我们详细了解一下。


  ### 什么是云安全？


  云安全是指允许您在云架构中保护数据和信息的一系列技术、协议和最佳实践。


  云安全是共同责任。一方面，云服务提供商必须保证足够且受保护的基础设施。另一方面，用户也必须正确使用并实施充分的措施，因为他们也负责保护所管理的应用程序和数据。


  云安全可能因云服务类型和部署模型而异。让我们立即澄清一下，看看主要内容的概述。


  ### 云服务类型


  云服务由外部提供商托管的基础设施、平台或软件组成，各种服务通过互联网提供给用户。云计算的类型主要可分为三类：


  - **基础设施即服务 (IaaS)**：服务提供商通过互联网连接代表客户管理基础设施（即物理服务器、网络、虚拟机、数据存储和操作系统）。客户负责保护添加到操作系统中的内容以及管理终端用户的访问、设备和网络。

  - **平台即服务 (PaaS)**：这是为开发人员和程序员设计的。通过此服务，为客户提供主机，他们可以在无需创建和管理服务器、存储、网络和数据库的基础设施的情况下创建和托管自己的应用程序。

  - **软件即服务 (SaaS)**：在此，客户可访问由云服务提供商管理的软件应用程序，而无需计算机或服务器。客户可以通过检查软件配置（而无需在单个用户的计算机上安装应用程序）访问在线服务，但无需管理基础设施（SaaS
  的示例包括 Microsoft Office 365、Dropbox、iCloud 和 Google 的应用程序）。


  ### 分布模型


  除了云服务类型外，还定义了云计算的分布模型。在这种情况下，主要的分布方式如下：


  - **公共模型**：云服务由外部提供商提供，可供任何人免费或付费使用。一些示例包括 Microsoft Azure 和 Amazon Web Services。

  - **私有模型**：云服务可供单个组织通过互联网或专用内部网络访问。私有云可以由外部提供商管理，甚至可以由公司内部自行管理。

  - **混合模型**：云服务通过根据需要将私有云（第三方或自建）与公共云结合提供，利用两种基础设施的优势。

  - **其他模型**：包括社区云、多云、混合云和 HPC 云。无需详细说明，足以说——除了上述之外——还有其他不太受欢迎的解决方案，可根据需要使用。




  ## 云安全 – 可防止风险的措施示例


  云安全，正如预期所言，涉及旨在实现多项目标的一系列策略。这包括对网络进行归档和防护以抵御网络攻击、恢复任何丢失或被盗的数据，以及总体上减少受损系统或个人数据泄露的影响。


  过于频繁地，迁移到云端是在未先评估要迁移哪些数据和流程、也未为特定情况定义合适的网络安全措施的情况下进行的。


  因此，一切必须从对数据迄今为止是如何得到保护的、所使用的基础设施以及需要干预的薄弱环节的认知开始。因此，对当前情况进行快照，以评估哪种云服务提供足够的安全级别并规划适当的迁移策略。


  根据具体情况和需求，公司可以实施不同的工具来实现稳固的云安全。以下是一些示例：


  - 一个 **身份和访问管理 (IAM)** 系统，用于身份和访问管理

  - 微分段，通过该方式云的实现被划分为不同的段，直至单个工作负载的级别，最小化可能攻击者的损害

  - 新一代防火墙——与传统防火墙相比，它们增加了高级功能，例如应用感知过滤器、深度包检测和入侵防御系统

  - 加密，以便数据只能使用特定密钥解密

  - 威胁情报、监控和预防，或旨在分析流量以识别、阻止或至少减轻恶意软件攻击的功能


  ## 云计算的七大痛点


  安全是所有公司的议题，无论它们是否在云端运营。你将面临诸如拒绝服务、恶意软件、SQL 注入、数据泄露和数据丢失等威胁——所有这些都可能严重影响你公司的声誉和财务状况。


  迁移到云端引入了一组新的风险，并改变了其他风险的性质。这并不意味着云计算不安全。事实上，许多云服务提供商提供你原本无法获得的非常先进的安全技术和资源。


  它仅仅意味着你必须意识到不断变化的风险，以便进行管理。因此，让我们审视云计算的特定安全漏洞。


  ### 可见性降低


  大多数企业将通过众多设备、部门和地理位置访问各种云服务。在没有适当工具的情况下，这种云计算安排中的复杂程度可能会导致你失去对基础设施访问的认知。


  如果没有适当的程序，就可能无法追踪谁在使用你的云服务，包括他们访问、发布和下载的信息。


  只要记住，云中的资产可能不可见。而如果不可见，就无法得到保护，从而增加数据丢失和数据泄露的可能性。


  当然，适用于本地的相同或类似控制措施也适用于云。


  ### 合规违规


  随着监管监督的扩大，你必须遵守各种严格的合规标准。如果不谨慎，迁移到云端可能会使你面临合规问题。


  其中许多要求要求你的组织了解数据的所在位置、谁有权访问它、如何处理以及如何保护它。其他要求可能规定你的云服务提供商需要具备某些合规认证。


  不经意地将数据转移到云端或迁移到错误的提供商可能会使你的公司处于不合规状态，带来严重的法律和财务后果（我们已在第 4 章《数据处理》中谈到过数据传输和 Schrems
  II 判决）。


  ### 缺乏云安全策略和架构


  你可以轻松避免这种云安全风险，但许多人并未做到。在急于将系统和数据迁移到云端时，许多公司在用于防御基础设施的安全机制和计划到位之前就开始运营。


  确保在将系统和数据部署到云端之前创建云特定安全策略和架构。


  ### 内部威胁


  你最信任的员工、承包商和业务合作伙伴可能构成最大的安全威胁。这些内部风险即使没有恶意也可能对你的组织造成伤害。事实上，大多数内部事件都是由于培训不足或粗心大意造成的。


  尽管你现在会遇到这种困难，但转向云端会改变风险。当你将数据管理转移给云服务提供商时，你会产生由该公司员工构成的新一层内部威胁。


  ### 合同违规


  你拥有的任何合同关系都会对共享数据的用途、存储和允许访问范围施加限制。未经授权将受限数据无意转移到云提供商可能构成合同违规并导致法律诉讼。


  务必阅读云提供商的条款和条件。即使你有权限将数据转移到云端，多个服务提供商保留共享上传到其基础设施的任何数据的权利。你可能因无知而意外违反保密协议。


  ### 未受保护的用户界面（API）


  在云基础设施上运行系统时，你可以通过 API 实现控制。包含在你的网络或移动应用中的任何 API 都可以被内部和外部访问。


  外部 API 可能会对云造成安全风险。任何未受保护的外部 API 都会为窃贼提供未经授权的访问权限以窃取数据和修改服务。


  Facebook–剑桥分析丑闻是未安全外部 API 的最著名实例。剑桥分析通过 Facebook 未受保护的外部 API 获得了对 Facebook 用户数据的广泛访问。


  ### 云服务配置错误


  另一个可能的云安全问题是云服务配置错误。随着服务范围和复杂性的扩大，这是一个日益增长的问题。云服务的配置错误可能导致数据暴露给公众、被篡改甚至被删除。


  常见原因包括对极其敏感的数据保留默认的安全和访问控制设置。其他原因包括访问管理不匹配，导致未经授权的用户获得访问权限，以及非预期的数据访问，即个人信息的访问未获授权而被遗留开放。


  ### 云与 GDPR 问题


  尽管 GDPR 采用基于风险的数据保护方法，但它并未直接提及云。然而，该法规是技术中立的，即无论使用何种方法处理个人数据均适用。云的碎片化处理环境，其中此类标准可能并不总是适用，使得实施
  GDPR 变得困难。以下各节详细分解了这些挑战。


  ## 云特有的安全问题


  **欧洲数据保护监督员 (EDPS)** 和 **欧洲联盟网络和信息安全局 (ENISA)** 表示，与云基础设施的不同服务和部署模型相关的特定功能和流程，与“传统”本地数据中心相比意味着特定的风险。


  **NIST** 定义了三种服务模型（SaaS、PaaS 和 IaaS）和四种部署模型：公共、私有、社区和混合（前三种模型的组合）云环境。每种都代表不同的外包模式，具有不同的安全和隐私风险。


  其中一些安全任务（例如监控、修补和事件响应）被外包。根据云服务类型，部分任务仍由客户负责，而其他任务仍由提供商负责。责任划分有时会成为问题的重大来源，因为它通常基于假设且记录不完善，导致重叠和空白。例如，在
  IaaS/PaaS 中，客户在其云服务之上运行自己的代码，并且通常仍对该（应用）软件负责。而在 SaaS 中，应用软件通常由提供商控制。


  因此，客户对安全责任感到困惑并不罕见——即哪些安全任务外包给提供商，哪些安全任务仍由其自身负责。


  ## GDPR 对云行业有何影响？


  在该规则颁布近 5 年后，企业仍难以遵守 GDPR 监管标准。此外，由于企业快速使用云服务，组织和云服务提供商都必须修改其业务模式。为了遵守法规，他们必须显著改变业务实践。GDPR
  在第 4 章第 24–43 条中为数据控制者和处理者制定了具体要求。该法规概述了处理个人数据时必须遵循的义务、规范和指南。让我们更深入地研究该部分列出的规范，以便更好地理解
  GDPR 对作为云服务提供商的数据控制者和处理者的影响。


  ## GDPR 对云服务提供商的要求


  当云服务提供商代表数据控制者存储或处理欧盟人员的<|message|> 数据时，据说 *在适用范围内*。根据数据处理的如何和为何，云服务提供商和数据控制者可能成为共同数据控制者，这会为数据处理者带来额外的[content]

