  由于框架和法律的变化，本书的附录是强制性的。我还借此机会简要介绍了一些我在前几章中尚未涉及的相当相关的话题，例如 **漏洞评估和渗透测试（VA/PT）**。我决定将本附录分为不同的主题。


  ### ISO 27002


  ISO 27002 的当前版本于 2013 年发布，现在已经完全过时了。过去 8 年发生了很多变化！让我们希望不必再等 8 年才能看到下一版。


  与上一版一样，ISO 27002 旨在独立，即可以被对 ISO 27001 不感兴趣、只想在其组织内部实施一套信息安全规则的组织使用。在这方面，它与 CSA 的
  NIST CSF 等其他控制框架相同。各取所需！


  新版本可能在未来几个月发布，其中唯一重大变化是附录 A 将与新的 ISO 27002 匹配。这引入了 11 项 *新* 控制措施，分别是：


  - 威胁情报

  - 云服务使用的信息安全

  - 业务连续性的 ICT 就绪

  - 物理安全监控

  - 配置管理

  - 信息删除

  - 数据屏蔽

  - 数据泄露防护

  - 监控活动

  - 网页过滤

  - 安全编码




  请注意，我之前描述的控制措施并不是真正的控制措施。这些是控制措施的名称。控制措施的描述包含在 ISO 27002 中，并在 ISO 27001 更新时将包含在新的附录
  A 中。ISO 27002 还为这些措施提供了实施指南。为更好地理解，在此我需要澄清 ISO 27000 系列中的所有标准都有特定的侧重点：ISO 27001
  旨在为贵组织的信息安全奠定基础并制定其框架；而 ISO 27002 则旨在实施 ISO 27001 附录 A 中命名的控制措施。


  我已经在互联网上阅读了大量关于这些新法规的内容，其中最常见的说法之一是组织将被要求采用它们。我认为这并不正确，原因有以下几点：


  - ISO 27001 不要求采用任何控制措施。是否应用这些措施由组织根据风险评估自行决定。换句话说，这些控制措施可能不是处理一项或多项信息安全风险所必需的。

  - 尽管被标记为 *new*，其中许多内容已由当前附录 A 的限制所涵盖。

  - 此外，很可能组织目前已实施了其中至少一些规则。

  - 绝对有用的是审视这份新控制措施清单并问，*是否应将这些新控制措施中的任何一项作为必需控制措施，以协助管理一项或多项我的信息安全风险？* 在这种情况下，您必须更新风险评估并执行控制措施。在迁移到
  ISO 27001 的新版本时，您将不得不进行此检查。


  然而，不要相信任何说你 *must* 实施这些 *new* 控制措施的人。


  ## 有何不同？


  每个控制措施都以多种方式进行标记，例如它是预防性的还是补救性的，以及它是否涉及保密性、可用性或完整性。是否会有益仍有待观察。


  它包含的控制措施更少（93 项对比 114 项），部分控制措施被合并，其他则被拆分。此外，它还包含各种额外的 *contemporary* 措施，例如 *cloud
  security*、*threat intelligence* 和 *web filtering*；然而，基本概念保持不变。它是一系列潜在的信息安全控制措施，并为每个控制措施提供实施说明。


  ## 它是否优于上一版本？


  取决于情况；它试图涵盖某些当前控制措施，例如与云相关的控制措施。对于提供的控制措施，部分帮助不足，但大多数都很出色。


  ## 它是信息安全的一套标准控制措施吗？


  否，原因在于以下两个主要原因。


  ### 原因 1：控制措施覆盖不平衡


  存在 14 项物理安全控制措施，但只有一项云安全控制措施和 2 项网络安全控制措施。还有其他例子。这只是不平衡。


  ### 原因 2：控制措施缺失


  一些最常见的信息安全措施被埋藏在其他控制措施的详细指南中，或根本未被提及。例如，没有针对 Firewall、IDS、Email security、MFA、VPN、WAF、Cyber
  Insurance、Wireless access 或 Third-party library/software management 的明确控制措施。其中一些在文本中甚至未被提及。


  鉴于在线应用程序中数据验证的必要性，用于验证数据输入的控制措施和指南只有少数。


  对于云计算，只有一个非常高层级的控制措施，尽管我认为应该有许多——例如涵盖合同、安全义务、租户管理和服务管理。是的，您可以参考 ISO 27017；然而，ISO
  27002 本身应至少包含最典型的云安全规则。


  目前没有足够的管理业务连续性的控制措施。存在一些用于业务连续性规划的信息安全措施，但这并非同一回事。缺乏标记为 Business Continuity Plan
  或 Exercise Business Continuity Plans 的控制措施仍然让我困惑。是的，您可以参考 ISO 22301 用于业务连续性和灾难恢复管理，但我认为不具备这些控制措施毫无意义。鉴于勒索软件的普遍性，世界上没有至少一个业务连续性计划的组织不能有太多，而从信息安全角度来看，这一控制措施至关重要。


  鉴于 ISO 27002 应该独立于 ISO 27001 完全使用，它相对缺乏治理规则，例如与风险评估、信息安全委员会和能力相关的规则。


  公平地说，ISO 27002 确实指出组织可能需要额外的控制措施来增强 ISO 27002 控制措施。可悲的是，许多组织不会以这种方式使用 ISO 27002，而是将其视为一个相对完整且常用的控制措施集合，而事实并非如此！


  此外，每个人对经常使用的信息安全规则清单中应包含什么内容都会有自己的看法。


  ## 您现在必须做什么？


  如果您刚刚开始实施 ISO 27001，获取一份副本并将其用作实施控制措施的指南可能有益。然而请谨慎使用，即使在 2023 年期间，可能无需为新版本重新认证贵公司，而只需按照贵公司的认证周期（通常为
  2 年）照常续证即可。然而，我即将为您提供一些策略。


  如果您之前已实施 ISO 27001，您无需采取任何进一步行动；不过，您可能会发现 ISO 27002 的这一更新版本很有趣，因为它包含针对各种控制措施的宝贵实施策略——即作为您工作的某种质量控制。


  ### 当新版 ISO 27001 发布新的附录 A 时，您必须做什么？


  您的认证机构或注册机构将通知您向新版本的过渡安排，尽管您可能有 2 年时间完全过渡到新版本。


  根据您的情况和期望的策略，主要有两种过渡策略。


  ## 过渡方法 1 – 不修改风险评估


  ### 为什么会使用此策略？


  如果您希望以最少的努力过渡到 ISO 27001 的最新版本，此策略是合适的。特别是，您不希望更改风险评估。


  ### 这是什么策略？


  此策略以继续使用之前的 ISO 27001:2013 附录 A 规则为前提。这是可以允许的，因为 ISO 27001 允许控制措施源自任何来源，您可以选择旧附录
  A 控制措施作为来源。不要让任何人说服您这是不可能的。它是可以发生的！该技术的最重要方面是它允许您在不修改风险评估的情况下过渡到 ISO 27001 的新版本。


  为实施此策略，您需要执行以下操作：


  - 将您的控制措施与新的附录 A 进行比较并记录您已执行此操作——例如，通过电子邮件或会议纪要

  - 对适用性声明的格式进行少量更改

  - 这些修改不应需要超过几天的工作


  ## 过渡方法 2 – “完全替换”


  ### 为什么会使用此策略？


  如果您的风险评估包含对旧附录 A 控制措施的引用，并且您愿意对 **信息安全管理体系 (ISMS)** 和风险评估进行所有必要的调整以消除对旧附录 A 的所有引用，此选项是合适的。


  ### 这是什么策略？


  此方法从您的 ISMS 中消除对旧 ISO 27001:2013 附录 A 控制措施的任何引用，并将其替换为新的附录 A 控制措施。此策略比之前的方法劳动密集得多。


