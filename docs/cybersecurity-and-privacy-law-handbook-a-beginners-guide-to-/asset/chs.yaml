  \ GDPR 文本中从未被提及。\n\n这种隐私观念和保护我们个人、私人领域的观念最终传到了欧洲。然而，这种情况完全不同。如果在美国，目标是防止私人人士——媒体、企业和其他人——的侵入，那么在欧洲，目标是抵御国家或私营行业的干预。\n\
  \n必须强调的是，隐私权在美国宪法中并未直接提及，但这并不妨碍认为隐私受到法律保障。同样重要的是要理解，宪法与权利法案之间存在明确的分离，宪法控制政府被允许干预的领域，而权利法案旨在限制此类行动的许可情况。民主选举产生的政治多数有权制定影响整个社区的规则，以及个人有权自我决定并在公共权力侵入其私人生活时设立界限之间的不同需求的关系，是自由与民主之间最古老、最复杂的关系。\n\
  \n过去曾有人提出，隐私的明确保障未被纳入美国宪法有两个主要原因：首先，隐私的概念已深深植根于美国精神中，其正式纳入是不必要的。\n\n但其次，因为（这比第一个论点更有说服力）隐私的真正威胁出现在媒体和电信的增长使这一权利的侵犯变得具体时，正如我们之前指出的。因此，隐私作为应受保护的资产的概念一直是《独立宣言》所说的追求幸福不可分割的一部分。\n\
  \n总之，我们需要隐私 *because* 我们正在使用技术。\n\n## GDPR 及其兄弟法规\n\n第一部 *real* 隐私法是 **General Data\
  \ Protection Regulation (GDPR)**，该条例于 2016 年出台，2018 年生效，此前 1995 年曾尝试过一项被称为 *Directive\
  \ 95/46/EC of the European Parliament and of the Council of 24 October 1995* 的指令，各成员国并未以相同的方式采纳该指令。\n\
  \nGDPR 在保护和增强欧盟人民数据隐私的同时，统一了欧洲的数据隐私法规。它还影响任何处理或管理欧盟人民数据的组织，无论其所在地如何，使 GDPR 对拥有全球运营、海外分支机构甚至远程员工的美国公司具有法律约束力。\n\
  \nGDPR 下个人权利得到加强，并建立了新的权利。其中包括以下内容（但还有更多）：\n\n- *The right to data portability:*\
  \ 你有权以常用格式从公司获取你的个人信息，从而轻松地将其分享给另一个实体\n- *The right to not be profiled:* 除非法律或合同要求，否则影响你的决定不得仅基于自动化处理，除非这样做是必要的\n\
  - *The right to erasure (the right to be forgotten):* 你可以要求组织删除你的个人数据——例如，如果它不再需要用于收集它的原因，或者如果你撤回了你的许可\n\
  \n尽管 GDPR 是世界上最重要的隐私法，但它并不是唯一的一项。其他例子包括仅限加州的 **California Consumer Privacy Act (CCPA)**，以及巴西的\
  \ **Lei Geral de Proteção de Dados Pessoais (LGPD)**。\n\n让我们检查这三套立法之间的基本相似之处。必须注意的是，虽然\
  \ CCPA 是部门立法，但加州客户群的庞大规模使其本质上成为一项综合性法规。\n\n\n\n## 地域适用范围\n\n就地理覆盖范围而言，GDPR 和 LGPD\
  \ 有若干相似之处。然而，CCPA 的适用范围远窄得多，且对受监管主体的定义更为细致。\n\nGDPR 适用于处理欧盟数据主体个人数据的任何实体，无论其所在地。LGPD\
  \ 也适用于在巴西处理数据的任何公司，无论其是否在当地设有实体存在。换句话说，无论你是在欧盟还是巴西处理客户数据，这些限制都适用。\n\nCCPA 适用于在加州运营并处理加州公民个人信息的盈利公司。此外，被涵盖方必须满足以下一项或多项要求：\n\
  \n- 每年最低毛销售额为 $25 million\n- 处理至少 50,000 名用户的个人信息\n- 其收入的 50 percent 或以上来源于出售加州公民的个人信息\n\
  \n这意味着，几乎所有毛收入超过 $25 million 的企业，只要拥有至少一名加州消费者，就必须遵守 CCPA。然而，这一例外条款使若干较小企业免于遵守该立法。\n\
  \n让我们看几个例子：\n\n- *The Daily Bugle* 是一家在美国各地运营的庞大公司。他们必须遵守 CCPA，因为他们与加州公民做生意，并且是一家年收入至少\
  \ $25 million 的大型组织。\n- *The Neighbor Post* 在美国的客户不足 50,000 名。他们每年赚取约 $18 million，但不从出售个人信息中获益。较小实体可免于遵守\
  \ CCPA。\n- *The Daily Bugle* 和 *The Neighbor Post* 都必须遵守 GDPR 和 LGPD，因为它们的网站会收到来自欧盟和巴西的访客。\n\
  \n还有一些其他次要问题，因为 CCPA 仅适用于加州公民，而 GDPR 适用于欧盟所有人，无论其公民身份如何。\n\n这里有一些你需要记住的提示：\n\n-\
  \ GDPR 和 LGPD 都具有域外效力\n- CCPA 仅适用于符合以下任一条件的实体：\n  - 每年最低毛销售额为 $25 million\n  - 处理至少\
  \ 50,000 名客户的个人信息\n  - 其收入的 50 percent 或以上来自出售加州居民的信息\n- 几乎所有公司都必须遵守 GDPR 和 LGPD\
  \ —— 然而，有些公司可能无需遵守 CCPA\n\nGDPR 适用于在欧盟设有存在的组织，即在当地设有机构的组织。因此，无论处理是否发生在欧盟境内，GDPR\
  \ 都适用于欧盟境内组织对个人数据的处理。就其域外适用性而言，GDPR 适用于向欧盟人士销售产品或服务的非欧盟组织的处理操作。关于设立的概念，LGPD 没有相应的条款对其进行定义。尽管如此，LGPD\
  \ 适用于在巴西开展的数据处理活动。无论实体的总部所在地或数据处理的所在地如何，只要所处理的数据涉及巴西公民，或所处理的个人数据是在巴西获取的，LGPD 就适用。在巴西收集的数据的定义是指在收集时身处巴西的人相关的数据。LGPD\
  \ 也适用，无论实体的总部所在地或数据处理的所在地如何，如果实体的处理活动旨在向巴西居民提供或供应产品或服务。\n\n## GDPR、CCPA 和 LGPD 各自对个人数据的定义不同\n\
  \n随着我们深入隐私领域，让我们了解一下不同法律的行为方式：\n\n- GDPR 将个人数据定义为可合理归因（直接或间接）于可识别或已识别数据主体 的信息。这包括姓名、社会安全号码和地址等直接数据，以及行为数据和偏好等间接数据。GDPR\
  \ 也有特定排除，例如将个人数据用于某些研究目的。\n- CCPA 将个人数据定义为可用于识别个人的任何信息，包括社会安全号码、居住地和姓名。此外，CCPA 还包括可用于识别家庭或设备的数据。\n\
  - LGPD 将个人数据定义为与可识别或可被识别的自然人直接或间接相关的信息。然而，它并未提供更多关于此类数据构成的信息。此外，如果行为画像数据可用于识别真实个人，LGPD\
  \ 认为其为个人数据。\n\n这里存在显著差异。首先，GDPR 仅在个人层面定义个人数据，而 CCPA 还包括家庭数据。除了排除某些公开可访问的数据外，CCPA\
  \ 不一定涵盖行为或人口统计数据。\n\n- 由于缺乏任何定义数据类别，LGPD 非常直接且包容广泛，因为它包含可能直接或间接与个人或家庭相关的一切数据。\n\n\
  这里有一些需要记住的关键点：\n\n- GDPR 和 LGPD 下的个人数据定义不出所料地相似。尽管如此，由于其技术上的简洁性，LGPD 的范围更大。\n- CCPA\
  \ 比 GDPR 和 LGPD 都宽松，因为它仅适用于特定类别的数据，并且仅审查可直接识别个人的数据。\n\n## 匿名、假名化、去标识化和汇总信息的重要性\n\
  \n让我们在此给出一些定义，以便更好地理解剩余文本：\n\n- **Anonymization**: 数据集不包含任何可识别信息，并且没有任何方式将信息链接回任何可识别信息。\n\
  - **De-identification**: 数据集不包含任何可识别信息，但存在将信息链接回可识别信息的方式。\n- **Pseudonymization**:\
  \ 如果没有使用单独保存的 *additional information*，数据集无法归属于特定数据主体。\n- **Non-identifiable**:\
  \ 数据集已被编译、提取、修改、匿名化或汇总，以至于数据来源的个人无法合理识别。\n- **Aggregate data**: 数据集已从任何识别信息中移除，因此客户的个人数据或信息无法在不付出非凡努力的情况下与该客户关联。许多去标识化或假名化数据流的数据集形成汇总。\n\
  \n众多企业获取、存储和出售通过去标识化算法或汇总而匿名化的数据。在 CCPA 下，企业被允许继续使用这些信息而无需披露。企业在 GDPR 下被允许使用匿名数据，但不允许使用假名化数据。\n\
  \n这里还有一些需要涵盖的关键点：\n\n- CCPA 允许企业在不披露的情况下存储、获取和出售去标识化、汇总和匿名数据\n- GDPR 仅允许组织存储、收集和出售不可识别数据\n\
  - 由于 LGPD 没有相应的措辞，这些形式的数据需要被公布\n\n## 数据处理的法律依据\n\n这些法律允许数据处理的各有显著区别。GDPR 和 LGPD\
  \ 都对 *legal basis for processing* 有专门章节。这意味着企业只能为特定目的处理数据。\n\n具体而言，GDPR 涵盖以下内容：\n\
  \n- Explicit consent\n- Legal responsibility\n- Legitimate interest\n- Public duty\n\
  - Vital interest\n- Contractual performance\n\n这总共是六项数据处理理由，而 LGPD 包含十项：\n\n- Consent\n\
  - Legal duty\n- Protection of life\n- Utilization of privileges in court proceedings\n\
  - Legitimate interest\n- Security for credit (likely related to recent reforms to\
  \ the Positive Credit Registry Law)\n- Health security\n- Public duty\n- Investigation\
  \ by public study agencies\n- Contractual performance\n\nCCPA 缺乏处理数据的任何依据。换句话说，CCPA\
  \ 允许企业按其意愿处理加州公民的数据。居民当然可以退出，但对企业处理数据的 *reason* 没有任何限制。\n\n让我们回顾以下内容：\n\n- GDPR\
  \ 为处理个人数据提供了六项法律理由\n- LGPD 下有十项数据处理的法律依据\n- CCPA 对数据处理的法律依据没有限制\n\n\n\n## 数据访问权限\n\
  \nGDPR、CCPA 和 LGPD 都为自然人提供数据隐私权。根据 CCPA，客户有权要求披露其个人信息，以便了解公司对其持有哪些信息。此外，消费者有权获得有关公司如何收集和使用其数据的信息，包括其如何利用与之共享数据的第三方。\n\
  \n在 GDPR 和 LGPD 下，消费者被授予可比但更广泛的权利。例如，根据 GDPR，人们可以寻求书面或可移植的披露，而这并不是 CCPA 的固有权利。\n\
  \n向消费者提供这些信息的期限在这些法规中也有所不同：\n\n- CCPA 允许企业在 45 天内对个人数据的访问请求作出回应\n- GDPR 允许企业在 30\
  \ 天内对个人数据的访问请求作出回应\n- LGPD 允许企业在 15 天内对个人数据的访问请求作出回应\n\nCCPA 授予客户选择退出数据出售收集的能力，要求网站提供退出选项的可能性。GDPR\
  \ 提供了反对权，其中包括对属于特定参数范围内的数据处理的反对能力。所有三项法律都为客户提供了删除权或被遗忘权。\n\n总体而言，GDPR 和 LGPD 为消费者提供了更多权利。LGPD\
  \ 有九项基本权利：\n\n- 访问数据的权利\n- 更正不准确信息的权利\n- 数据可 portability 的权利\n- 删除个人数据的权利\n- 了解您的数据共享情况的权利\n\
  - 撤回同意的权利\n- 证明数据处理存在性的权利（处理必须合法）\n- 访问已处理数据的权利\n- 了解被拒绝同意及其后果的权利\n\n这些权利几乎与 GDPR\
  \ 授予的八项权利相同。\n\n让我们探讨一些更关键的区别：\n\n- GDPR、CCPA 和 LGPD 为消费者提供透明度和访问权\n- GDPR、CCPA\
  \ 和 LGPD 为消费者提供删除权\n- CCPA 仅允许对拟出售的数据进行选择退出\n- 每项法案为组织提供不同的时间期限来回应访问请求\n- 在某些条件下，GDPR\
  \ 和 LGPD 提供了更正权和禁止处理的权利\n\n### 提示\n关于 EEC 边界内的消费者，必须指出 *欧洲议会和理事会 2002 年 7 月 12 日第\
  \ 2002/58/EC 号指令* 关于在电子通信部门处理个人数据和保护隐私（隐私和电子通信指令）仍然 *alive and kicking*。正如本章开头已提到的，由于其性质，指令不能被视为法律。因此，我只是为了完整性而提及它。全文可在此处找到：https://eur-lex.europa.eu/legal-content/EN/ALL/?uri=CELEX%3A32002L0058。\n\
  \n## 罚款和处罚\n\n与罚款相关的规则变化很大。\n\nGDPR 的处罚在三者中是最为严厉的。GDPR 的最高罚款为 2,000 万欧元或实体全球年营业额的\
  \ 4%，以较高者为准。LGPD 的制裁为实体全球年销售额的 2% 或 5,000 万雷亚尔（约 1,200 万美元）。CCPA 的最高制裁为 7,500 美元。\n\
  \n在安全问题方面，LGPD 并未规定通知当地当局的时间表。然而，根据国家当局于 2021 年 2 月 22 日提供的指示，通知必须在获知事件后的 2 个工作日内作出。\n\
  \nCCPA、GDPR 和 LGPD 既有共同点，也有实质性区别。这些隐私法规将在其他司法管辖区继续实施。在美国，大多数州正在制定自己的 CCPA 版本，而几个欧洲国家则以自己的法律补充\
  \ GDPR。当然，其他国家也会根据自身需求制定类似法案。\n\n## 为什么要处理数据保护？\n\n正如你所想象的，由于技术进步，数据变得更有价值。此外，访问各种类型个人数据的能力和机会正在迅速发展。未经授权、疏忽或缺乏教育地处理个人信息可能会对个人和企业造成重大损害。\n\
  \n首先，个人数据保护的目标是保护其数据受到保护的个人的基本权利和自由。在不违反个人权利和自由的情况下保护个人数据是可行的。例如，不当处理个人数据可能导致某人被忽视就业机会，甚至更糟，失去现有工作。\n\
  \n其次，不遵守个人数据保护标准可能导致更严重的后果，例如窃取个人整个银行账户余额或操纵可能危及生命的健康信息。\n\n第三，需要数据保护措施来确保公平且以消费者为中心的商业和服务交付。个人数据保护立法产生了一个系统，例如，个人数据不能自由出售，这使个人能够更好地控制谁向他们发送要约以及要约的性质。\n\
  \n个人数据泄露可能会对公司的形象造成实质性损害并招致罚款，这就是为什么必须遵守个人信息安全相关立法的原因。\n\n为了保护个人数据的安全，必须了解正在处理哪些数据、为何处理以及基于何种法律依据。此外，必须确定现有的安全措施。所有这些都可以通过全面的数据保护审计来实现，该审计监控数据流及其与数据保护标准的合规性。可以通过回答一系列准备好的、针对审计的具体问题来进行审计。调查结果将提供流程和任何数据泄露的全面图景，然后可以阻止这些泄露。\n\
  \n任何收集、处理或保存敏感数据的公司都必须制定数据保护计划。有效的计划可以帮助防止数据丢失、盗窃或损坏，并减轻安全漏洞或自然灾害的影响。\n\n数据保护原则有助于保护信息并使其在所有条件下都可访问。这包括采用数据管理和数据可用性的组成部分，以及运营数据备份和\
  \ **业务连续性和灾难恢复 (BC/DR)**。\n\n数据可用性意味着确保用户可以访问并使用开展业务所需的数据，即使这些数据丢失或损坏。\n\n数据生命周期管理是将重要数据自动传输到离线和在线存储。\n\
  \n信息生命周期管理涉及对信息资产进行估值、分类和保护，以抵御各种威胁，例如设施故障和干扰、应用程序和用户错误、设备故障以及恶意软件和病毒攻击。\n\n数据隐私是敏感和重要数据应如何获取和管理的指导方针。通常，数据隐私适用于\
  \ **受保护的健康信息 (PHI)** 和 **个人身份信息 (PII)**。这包括财务数据、医疗记录、社会保障或身份证号码、姓名、出生日期和联系信息。\n\n\
  数据隐私问题适用于公司处理的任何敏感信息，包括客户、股东和员工的信息。经常，这些信息对公司运营、其增长和财务至关重要。\n\n数据隐私确保只有授权方才能访问敏感数据。它阻止罪犯恶意使用数据并帮助企业满足监管义务。\n\
  \n某些数据类型受其收集、传输和使用的立法管辖。个人信息包括姓名、照片、电子邮件地址、银行账户信息、个人计算机的 IP 地址和生物识别数据等。\n\n遵守一套规则并不保证遵守所有法律。此外，每项立法都有各种条款，可能适用于一种情况而不适用于另一种情况，而且所有法律都可能发生变化。这种复杂程度使得正确、一致地执行合规变得具有挑战性。\n\
  \n正如前面提到的，数据保护和隐私都很重要，有时被互换使用，但它们并不指同一概念；一个涉及政策，另一个涉及机制。\n\n数据隐私关注的是谁有权访问数据，而数据保护关注的是执行这些限制。数据隐私概述了数据保护工具和程序所使用的规则。\n\
  \n制定数据隐私政策并不能保证未经授权的用户不会获得访问权限。同样，使用数据保护限制访问，同时仍可能使敏感数据可访问。两者对于维护数据安全都是必需的；用户管理其隐私，企业保证其保护。\n\
  \n隐私与保护之间的另一个重要区别是通常谁行使控制权。通常，消费者可以选择共享多少数据以及与谁共享。管理数据的公司有责任保护其保密性。这种区别反映在合规标准的存在中，这些标准旨在确保公司尊重消费者的隐私问题。\n\
  \n## GDPR 的六项原则\n\n### 数据控制者：处理数据的目的和方式\n\n欧盟 GDPR 第 5 条规定，控制者应对信息的合法性、公平性和开放性负责。数据控制者还应确保个人数据的准确性、存储限制和保密性。为了避免罚款和处罚，数据控制者应仅选择符合\
  \ GDPR 的数据处理者。\n\n\n\n在某些情况下，数据控制者可能会与第三方或另一服务合作进行数据分析，即使它能够使用自己的方法处理数据。例如，工资服务提供商是第三方数据控制者，因为它决定工资应如何处理。\n\
  \n## 数据处理者：维护活动记录\n\n确定何构成数据处理者并不总是直截了当的。典型的 数据处理者包括法律业务、医疗办公室和会计公司。处理者必须保留所有数据处理活动的记录。一个合理的经验法则是，如果一个组织必须遵守数据和隐私的指令和指示，则该组织是数据处理者。销毁或存储数据的组织也可能充当处理者。\n\
  \n通常，处理者可以并且应该努力将数据风险职责转移给第三方供应商。GDPR改变数据处理者责任的主要方式是通过在GDPR的法律和法规中明确其义务，以便必须严格执行。\n\
  \n## 灰色地带\n\n在GDPR出台后，也变得明显的是某些企业并不完全符合任一类别。诸如快递服务之类的公司存在于灰色地带，因为它们不分析个人特定数据。\n\n\
  如果许多组织共同承担个人信息的处理责任，则联合控制者可能是合适的。这些责任需要明确界定，且处理者将作为主要联系点。\n\n根据法规，只有满足《第6条》规定的六项处理法律理由中的至少一项时，才满足合法性标准：\n\
  \n- **同意**：数据主体已同意对其个人数据进行处理，用于一个或多个特定目的\n- **合同履行**：处理是为履行数据主体为其一方订立的合同或根据数据主体在订立合同前的请求采取行动所必需的\n\
  - **法律义务**：处理是为使控制者遵守其适用的法律义务所必需的\n- **重大利益**：处理是为保护数据主体或其他自然人的重大利益所必需的\n- **必要性**：为履行对控制者赋予的公共利益任务或行使官方权力所必需\n\
  - **合法利益**：处理对控制者或第三方合法利益所必需，除非此类利益被需要保护个人数据的相关数据主体利益或基本权利和自由所凌驾，特别是当数据主体为儿童时\n\n\
  除了处理某些类别的数据（如敏感数据）——这些数据享有额外的特殊标准外，所有个人数据的处理都必须基于这六个理由之一。\n\n必须记住，可允许的处理理由之间不存在层级关系。\n\
  \nGDPR第9条规定了处理特殊类别数据的合法依据，这意味着只要处理其中一种特殊类别的数据，就适用第9条关于敏感数据授权使用的规定。第29工作组澄清称，处理特定类别数据的控制者绝不能仅依赖现行GDPR第6条中列出的处理宽泛理由。这些规则“*永远不会被取代，但将始终以累积的方式与处理某些类型数据的指南一起适用。*”\n\
  \nGDPR第9条对特定类别数据的全面概述：\n\n- 揭露种族或民族的信息\n- 揭露政治观点的信息\n- 揭露宗教信仰的信息\n- 揭露哲学信念的信息\n\
  - 有关工会成员资格的信息\n- 基因组数据\n- 生物识别数据（用于唯一识别自然人）\n- 健康信息\n- 有关性活动或性取向的信息\n\nGDPR第9条第1款原则上禁止处理某些特定类别的数据。其处理仅在第9条第二款规定的例外情况之一下允许：\n\
  \n- **同意**：数据主体已给予明确同意。\n- **就业和社会保障立法**：履行就业和社会保障保护法律下的某些职责（如果法律或集体协议允许）。\n- **重大利益**：需要保护数据主体或其他人的重大利益。\n\
  - **政治或宗教非营利组织：** 由具有政治、哲学、宗教或工会目的的基金会、协会或任何其他非营利机构在适当保障措施下进行，且处理仅与该机构的成员或前成员或与该机构有定期联系的人有关，并且个人数据未经同意不得向该机构外披露。\n\
  - **可证明已公开的数据：** 处理涉及数据主体明确公开的个人数据。\n- **权利：** 为建立、行使或捍卫法律主张所必需。\n- **重大公共利益：**\
  \ 基于欧盟或成员国立法，出于重大公共利益的必要性。\n- **医疗目的：** 为预防或职业医学、评估员工工作能力、医学诊断或提供医疗治疗所必需。基于联盟或成员国立法或与医疗专业人员签订的合同，提供健康或社会护理或治疗，或管理健康或社会护理系统和服务。\n\
  - **公共卫生：** 基于欧盟或成员国立法，出于公共卫生领域的公共利益的必要性，例如抵御对健康构成重大跨境危险或保证医疗服务、药品和医疗设备的高质量和安全标准。\n\
  - **归档、科学或历史研究：** 根据GDPR第89条，基于欧盟或成员国立法，出于公共利益、科学或历史研究目的或统计目的的必要性。\n\n此外，成员国可就遗传数据、生物识别数据或健康相关数据的处理制定额外要求，包括限制。\n\
  \n我希望到目前为止一切都很清楚。我尽力避免使用法律术语！\n\n## 摘要\n\n因此，我们已经讨论了基础知识（隐私的定义、隐私法的重要性、法案假设我们能够保护数据，以及处理数据的法律原则）。你现在（或应该）对诸如数据处理者和数据控制者之间的差异、哪些数据可设为特殊或敏感、不同法律在数据保护方面的不同行为、域外适用性等主题有良好的理解。我们回顾了隐私的简要历史并设定了许多有用的定义以更好地理解它，而在下一章中，我们将更深入地探讨这一主题，同时仍尽量保持清晰。\n\
  \n## 数据处理\n\n在上一章中，我们研究了隐私、其重要性、主要现代隐私法案以及数据主体的权利。\n\n我们将继续从那里开始，具体讨论问责制、工具、手段、措施以及**Schrems**（Max\
  \ Schrems是一位奥地利律师；我们将在本章后面详细介绍）。更具体地说，我们将深入探讨数据处理。虽然有些复杂，但这些主题有助于我们破译GDPR的薄弱点以及如何改进它的持续讨论。我想指出，这场讨论不仅仅是学术性的；由于它涉及人员、商品和公司，这是我们必须处理的事情。\n\
  \n问责原则要求你对个人数据的处理方式以及如何遵守其他原则承担责任。你必须有适当的措施和记录，以便能够证明你的合规性。处理数据时，有必要制作、更新和保存充分的文档。但在此之前，我们应该介绍一些定义以更好地理解这一问题。\n\
  \n在本章中，我们将涵盖以下主题：\n\n- 数据控制者\n- 数据处理者\n- 问责制\n- 欧盟–美国隐私盾\n\n## 数据控制者\n\nGDPR和其他隐私法规下，数据控制者对保护数据主体（如网站用户）的隐私和权利负有最大职责。简单地说，数据控制者负责数据利用方法和目标。\n\
  \n简而言之，数据控制者负责规定企业将如何以及为何利用数据。\n\n\n\n数据控制者可以使用自己的方法处理收集到的数据。然而，在某些情况下，数据控制者必须与第三方或外部服务协作才能处理收集到的数据。\n\
  \n数据控制者即使在这种情况下也不会将数据的保管权让渡给第三方提供商。数据控制者将通过规定外部服务如何使用和处理数据来保持权威。\n\n## 数据处理者\n\n\
  数据处理者处理数据控制者提供的任何数据。数据处理者通常是数据控制者选定的用于利用和处理数据的第三方组织。\n\n第三方数据处理者既不拥有也不控制其处理的数据。这意味着数据处理者无法更改数据的目的和使用方式。此外，数据处理者必须遵守数据控制者提供的指令。\n\
  \n例如，《号角日报》（The Daily Bugle）的网站会收集访客所浏览页面的信息。这包括他们进入网站的页面、随后浏览的页面以及在每个页面上花费的时间。在此示例中，《号角日报》是数据控制者，因为他们决定这些信息将如何以及为何被使用和处理。\n\
  \n《号角日报》使用 Google Analytics 来确定其网站上哪些页面最受欢迎，哪些页面导致访客离开。这使企业能够通过揭示每个访客在每个页面上花费的确切时间来更好地设计其内容。除了知道要撰写哪些主题外，《号角日报》还发现可能引起其客户兴趣的新主题。此外，它还有助于他们改进现有材料。\n\
  \n为了从 Google Analytics 获得所需的洞察，《号角日报》必须向 Google 提供其收集的数据。在此实例中，Google Analytics\
  \ 是数据处理者。\n\n## 问责制\n\nGDPR 确立了数据控制者（如实体和公共行政机构）对其直接进行的或由他人代表其进行的任何个人数据处理的一般责任水平。\n\
  \n特别是，数据控制者不仅需要采取充分有效的措施，还必须能够证明其处理活动符合 GDPR 本身。\n\n实际上，在适用辅助性原则时，每个负责人都被要求在其组织内部制定规则（技术和组织方面的）以将\
  \ GDPR 的一般原则整合到业务流程中。例如，他们必须采用内部处理政策并证明这些政策的实施情况。\n\n实体和公共行政机构（PAs）通过自然行使负责人职能的人员来履行这一微妙职能，即通过被赋予个人数据处理目的和手段决策权的高级管理人员或高级公共管理人员。\n\
  \n这些人员在 **数据保护官 (DPO)** 的持续支持下，从充分认识到本领域的<|message|>重要性出发，必须构建一个愿景，将其转化为在上述处理政策中体现的使命。\n\
  \n具体而言，这一使命必须注入到 **隐私管理体系 (PMS)** 中，即一个同质、集成且和谐的文件、规则、培训和控制程序体系。PMS 应根据环境的变化不断更新，同时保证公司流程的有效性和效率。\n\
  \n无论如何，所有个人数据处理行为都必须通过从设计阶段开始创建、维护和保存适当的文档来体现。\n\n首先，需要注意的是，所谓文件是指任何图形、计算机化、摄影、电磁或其他类型的对具有法律相关性的行为、事实或数据的内容的表示。这也包括与特定业务流程、政策和/或行政程序相关的内部或外部文件。\n\
  \n## 推荐文件\n\n评估在公共和私营实体中应提供哪些文件非常重要，确定谁应生成这些文件、如何更新以及如何保存。我们还将指出哪些文件由 GDPR 强制要求，哪些文件被建议作为有价值的治理工具。\n\
  \n## 隐私仪表盘\n\n这是一份 GDPR 未要求的文件，尽管其实用性使其高度推荐。许多人将其称为 **隐私手册**，但我将其命名为 **隐私仪表盘**，以传达该文件的性质和目的，即一个真正的控制工具和一个可供行使负责人任务的高级管理人员和高级公共管理人员访问的运营仪表盘。\n\
  \n它是一份概要性文件，提供对实体内部个人数据保护方面 *谁* 必须做 *什么* 的全面视角。\n\n因此，该文件必须报告隐私组织架构图，并对任务进行总体描述，按公司职能/同质组织区域细分，并仅标明负责这些职能的主要管理人员/官员及其主要任务。\n\
  \n被指定的管理人员必须负责制作、维护和更新隐私职能图表（即正确概述其管理权限下所有实体（如构成不同组织单位的人员）的角色和职责的文件）。由行使负责人权力的人员指定的被任命者/被许可者的所有指定行为以及与被任命者培训相关的所有文件都可以与职能图表关联。\n\
  \n这样就创建了所谓的瀑布模型，这使得 GDPR 规定的组织模型的正确实施易于证明。同时，该文件坚持了这样一个原则：组织内发生的任何活动都必须归属于公司（即可识别的个人）的责任范围。\n\
  \n仍就隐私仪表盘而言，除组织架构图范围外，该文件还必须提供对公司数据处理的适当监控（如与培训、信息、行使权利的表格、计划、处理登记册和具体程序相关的文件）。\n\
  \n> **重要澄清**\n> 负责监控所述活动的经理/官员必须在隐私仪表盘上显示的每份文件通信中被识别。\n\n现在，让我们详细分析组织架构图中每个公司和职能负责生成的隐私仪表盘部分。\n\
  \n## 培训材料\n\n培训是首要且最基本的组织措施，因为它培养了一般知识和敏感性并确保系统的稳定性。它在 GDPR 第 29 条和第 32 条第 4 款中均有规定，后者不出所料地涉及处理的<|message|>安全性。缺乏对运营人员足够培训的任何技术或组织措施注定会失败。\n\
  \n培训在最严格的意义上至关重要：培训活动构成了数据保护体系的基础。\n\n隐私仪表盘必须确定负责培训的自然人。DPO 需要对必须认真对待的培训给予最高程度的关注和重视（即必须可评估和可量化）。因此，必须在培训活动结束时进行评估，以确定培训信息是否以及在何种程度上被接收。\n\
  \n上述培训经理有义务保存所有创建的文件。\n\n## 强制性文件\n\n现在，我们将考虑与数据处理相关的所有文件。\n\n### 信息和法律依据\n\n每次处理个人数据时，都必须向当事人提供信息以实施正确性和透明度原则。\n\
  \n\n\n因此，每个公司流程经理、行政程序或所谓的流程负责人的职责是准备具体信息并将其适配于具体的处理活动，注意插入《通用数据保护条例》第13条和第14条规定的最低内容。该信息必须包含数据的生命周期描述，因此还包括任何接收方或接收方类别、负责人将收集的数据转移到第三国或国际组织的意图，以及是否存在委员会充分性决定的情况。在没有充分性决定的情况下，必须始终明确适当的保障措施、获取此类保障措施副本的方式，或其可获取的地点。还必须始终明确数据的保留期限。如果无法做到，则应使用其他标准。例如，在某些欧盟国家，如果没有强制保留期限，则设定为两年。在其他国家，事实上采用的是其他文件必须保存的相同时间段（税务收据或类似文件）。\n\
  \n还必须指明证明处理的法律依据。特别是，如果处理基于同意或合法利益，则必须准备进一步的具体文件。事实上，《通用数据保护条例》第7条第1款规定，如果处理基于同意，数据控制者必须能够证明数据主体已同意对其个人数据进行处理。\n\
  \n因此，流程负责人必须设计一个程序来收集数据主体的同意，并以安全的方式保存相关记录。\n\n然而，为了将处理基于合法利益，同一流程负责人需要准备一个具体的程序，以进行所谓的平衡测试或比较测试，即在负责人的合法利益与数据主体的利益或基本权利和自由之间进行比较。在这方面，以下指南非常有用，供您参考：https://www.hldataprotection.com/2013/04/articles/international-eu-privacy/article-29-working-party-gives-new-guidance-on-purpose-limitation/。\n\
  \n## 行使权利的程序和表格\n\n数据控制者必须促进数据主体行使有关个人数据保护的权利，并在《通用数据保护条例》第12条规定的时限内履行特定的程序性义务。\n\
  \n因此，有必要定义一个具体的程序，同时为每个被要求适用已识别程序的实体制定单独书面的指定/授权或适当的表格。\n\n## 关于数据处理者的文件\n\n根据《通用数据保护条例》第28条，要求如下：\n\
  \n- 数据控制者的处理必须由合同或其他法律行为规范，该合同或其他法律行为将处理者约束于负责人\n- 数据控制者必须向负责人提供确保遵守《通用数据保护条例》所需的所有信息，并允许同一负责人进行审计以核实指令的正确执行\n\
  \n因此，在实施这些规定期间，行使负责人职能的人员必须准备并保存与处理者之间的合同关系期间制定的合同和所有文件。\n\n## 处理登记册\n\n登记册由《通用数据保护条例》第30条规定，是企业负责人和处理者的强制性文件。处理登记册是最重要的问责工具之一，因为它在监管阶段是隐私监管机构的宝贵信息资源。此外，如果负责人没有配备通用系统治理工具，例如前述的隐私仪表板，登记册就成为负责人/处理者的基本监控工具。\n\
  \n登记册必须包含所执行的所有处理的清单。处理者可能不采用它，因此为了安全，负责人必须始终要求处理者向其发送一份副本。\n\n登记册的准备和管理是分配给负责人的任务，负责人也可以将此任务委托给组织的经理/官员。然而，重要的是他们要意识到该任务的责任仍锚定在其职责范围内。\n\
  \n登记册必须能够识别参与数据处理的主体及其目的、数据主体类别和被处理的数据、谁可以访问数据、数据向谁传达、保存多长时间以及其安全性如何。\n\n虽然《通用数据保护条例》未要求，但我建议插入其他项目以说明每项处理的信息，例如法律依据以及对数据主体基本权利和自由的风险水平。这样就可以突出显示将进行影响评估（或数据保护影响评估）的高风险处理。\n\
  \n需要注意的是，登记册不应被视为仅仅是官僚任务，而应作为真正的运营工具，类似于中型和大型公司强制性的仓库登记册。这就是登记册在进行内部审计和监管机构检查时有用性的原因。\n\
  \n## 关于安全措施的文件\n\n确保组织内部数据安全的措施分为两类：组织措施和技术措施。后者必须在考虑技术发展水平和实施成本以及处理的性质、对象、背景和目的的情况下确定。《通用数据保护条例》第32条建议将假名化和数据加密作为最低技术措施。\n\
  \n在该领域，可证明性的关注主要涉及物理和逻辑组织措施。这些措施旨在永久确保处理系统和服务的保密性、完整性、可用性和弹性。它们还用于在发生物理或技术事故时迅速恢复个人数据的可用性和访问。\n\
  \n为实现这一目的，IT职能负责人必须制定IT安全政策，即一套有机正式规则，定义管理相关公司或机构的IT工具和数据的方法。该政策的组成部分如下：\n\n- 身份验证\n\
  - 内部和外部数据完整性\n- 数据备份\n- 主机安全\n- 网络安全\n- 物理安全\n- 操作安全\n- 配置管理（最低安全配置）\n- 系统激活的警报机制（SIEM及类似）\n\
  - 政策在发生不可预见外部事件时变更的操作程序\n\n> 提示\n> ISO 27001 也要求类似的要求。因此，您可以将所有文件整合在一个地方。\n\n为了将安全政策应用于各实体，每个流程负责人必须根据负责人通过隐私仪表板发布的特定授权，以书面形式作出个人指定。\n\
  \n这些指定必须反映分配给每个协作者的个人任务的主要内容。\n\n它们至少应严格规范《通用数据保护条例》第28条第3款所述事项，或被指定/授权人员所掌握并提供充分保证的事项，例如处理的性质、目的、持续时间和方式。\n\
  \n流程负责人应在活动开始时管理并核实指定行为，并定期（至少每年一次），指定应接受分析和可能修订的过程。系统管理员必须由单独书面文件指定，其中包含根据分配的授权配置允许的操作区域的分析清单。被指定为系统管理员的人员的识别详细信息，连同分配给他们的职能清单，必须记录在内部文件中，以便保持更新并在\n\
  \n隐私监管机构调查事件时。如果系统管理员的活动也间接涉及处理或允许处理员工个人信息的服务或系统，则公共和私营所有者需要在其组织的范围内，根据公司或服务的特征，针对其负责的各种\
  \ IT 服务，使系统管理员的身份公开可查，并利用根据 GDPR 第13条向利益相关方提供的信息。\n\n在实施组织安全措施后，为满足 GDPR 第32条第1款第d)项的要求，所有者职能的运营商或合适的受托人必须制定程序，以测试、验证并定期评估技术和组织措施的有效性，以保证处理的\
  \ fiy.\n\n这是众所周知的渗透测试（或 pen test），由白帽黑客执行，以分析和评估计算机系统的稳健性。\n\n## 数据保护影响评估（DPIA）\n\
  \n正如我们所见，安全评估必须对所有处理进行，而影响评估仅应在处理涉及新技术并可能对个人权利和自由构成高风险时进行。\n\n因此，数据控制者，或在隐私仪表板上特别指定的合适受托人，将必须执行并记录所开发的过程，遵循\
  \ WP29 于 2017 年 10 月 4 日通过的 WP 248 rev.01 指南。\n\n## 涉及任何数据泄露管理的文档\n\n之前描述的安全措施，无论多么准确，都永远无法消除数据或安全泄露的可能性。\n\
  \n发生数据泄露时，所有者必须执行以下操作：\n\n-   根据 GDPR 第33条，在72小时内通知监管机构，如果违规行为对个人权利和自由构成风险\n-  \
  \ 当违规行为可能对个人权利和自由构成高风险时，向利益相关方通报违规行为\n-   记录任何个人数据违规行为（即使未转达给监管机构且未通知利益相关方），包括其相关情况、后果以及采取的补救措施\n\
  \n因此，所有者有义务保存安全泄露登记册，且必须保持最新。\n\n此外，由于有必要及时、有条理且有效地应对数据泄露，似乎适当制定违规管理程序，通过确定特定流程中涉及的实体并以书面形式委托其具体任务。\n\
  \n对于此任务，建议遵循西班牙监管机构（AEPD）于2018年5月发布的 *《个人数据泄露管理与通知指南》*。\n\n数据控制者必须确保数据保护官（DPO）及时且充分地参与所有与个人数据保护相关的问题，以便其履行\
  \ GDPR 赋予 DPO 的咨询数据控制者和监督处理合规性的任务。如有疑问，请记住数据控制者将控制从数据主体收集数据的方式，确保从用户获得所需的同意。此外，他们将任命一名\
  \ DPO，以确保所有信息根据 GDPR 保持保密。简而言之，DPO 和数据控制者不是同一职能。\n\n重要的是要明确指出，所有者在决定不遵循 DPO 提供的指示的情况下，必须起草并保存文件，其中说明其意图做出与收到的指示和建议不同的决定的原因。\n\
  \n因此，在本特定情况下，向第三方传输数据和向欧洲经济区以外出口数据必须得到充分记录，甚至可以通过制定具体程序来明确与第三方沟通和出口数据的条件、背景和方法。如前所述，此类文档必须反映在根据\
  \ GDPR *第13条和第14条* 向利益相关方提供的信息中。\n\n## 数据保护——最后警告\n\n迄今为止讨论的所有要求都代表着必须满足的艰巨组织负担，以有效捍卫人们的基本权利和自由，并促进个人数据自由流动和相应经济增长所必需的信任。\n\
  \n如果这些崇高目标不能为所有者提供足够的激励，请考虑不合规情况下严厉且具有威慑力的制裁的可能性。\n\n*作为警告，请考虑在2021年初对一个重要的公共机构处以的30万欧元的财务制裁，监管机构发现其缺乏足够的文档来证明涉及哪些决策层级、所做的评估以及决策背后的原因。*\n\
  \n该公共机构还未能提供与其个人数据处理相关的已采取措施的充分文件。\n\n此外，尽管根据法规，DPO 应该迅速且适当参与所有与数据保护相关的问题，但 DPO\
  \ 并未及时参与。\n\n## 欧盟-美国隐私盾\n\nGDPR 最具争议的部分之一就是所谓的隐私盾，它继安全港之后出现，并已被 Schrems II 判决无效。\n\
  \n## 简要总结\n\n在爱德华·斯诺登于2013年披露 Facebook 等美国服务提供商参与美国政府 **PRISM** 大规模监控计划后，奥地利活动人士马克斯·施雷姆斯向爱尔兰数据保护专员提出投诉（投诉在爱尔兰提出，因为它是\
  \ Facebook 的欧洲总部），主张其个人数据被非法处理，该数据将被转移到美国并受到美国政府当局的控制，以及数百万其他个人的数据。这将得到2000年欧盟委员会批准的\
  \ **安全港** 协议的便利，该协议在特定情况下允许欧盟和美国之间个人数据不受限制的流动。\n\n此事被提交至欧盟法院后，法院以2015年10月6日的 C-362/14\
  \ 判决（*Schrems I* 判决）接受了施雷姆斯的投诉，宣告2000/520/EC号决定无效，该决定中欧盟委员会认为安全港隐私原则提供的保护水平是充分的，并将此事提交给爱尔兰监管机构以作出新的裁决。\n\
  \n与此同时，应工作党根据 *第29条*（现称为 **欧洲数据保护委员会（EDPB）**）的邀请，该工作党汇集了所有成员国的数据保护机构，欧盟委员会和美国商务部于2016年2月达成了一项名为\
  \ **隐私盾** 的协议。这旨在解决欧盟法院就安全港协议提出的不充分担忧。隐私盾于2016年7月16日由欧盟委员会以2016/1250号决定批准，为进口欧洲公民个人数据的美国公司规定了更严格的义务，包括定期监督遵守这些义务的情况、适用制裁，以及为美国政府和执法目的获取已转移个人数据的公共当局提供保证和透明度义务。\n\
  \n随着 GDPR *《欧盟条例 2016/679 号》* 的出台（其取代了 *《指令 95/46/EC》* 及所有本地转化法规），爱尔兰数据保护专员面前待决的转交程序不可避免地需要对隐私盾提供的保护充分性进行重新评估，以及更一般地对所谓的\
  \ **标准合同条款（SCCs）** 进行重新评估\n\n2018年5月，对该案有管辖权的爱尔兰高等法院向欧洲法院提交了若干问题，涉及 SCCs 和隐私盾数据传输的合法性，强调了可能违反\
  \ *《欧盟基本权利宪章》* 中 *第7条、第8条、第47条和第52条* 的情况。\n\n## Schrems II 判决\n\n在2020年7月16日的判决（*Schrems\
  \ II* 判决）中，法院认为欧盟委员会以2016/1250号决定批准隐私盾对欧盟-美国数据传输的个人数据提供充分保护的做法是不正确的。\n\n\n\n为了更精确地说，欧盟法院（CJEU）在审理过程中根据《通用数据保护条例》（GDPR）的要求调查了欧盟-美国隐私盾的合法性。CJEU\
  \ 认定，由于美国国内法以及美国公共机构对从欧盟获取的个人数据的获取和使用，个人数据的保护受到限制。裁定美国法律规定未达到几乎与欧盟法律规定的标准相同的标准。\n\
  \nCJEU 在其裁决中指出以下内容：\n\n- 比例原则并未对美国政府当局使用或获取欧盟数据的方式设置限制\n- 监察员机制并未给予数据主体针对一个提供至少与欧盟立法要求大致相当的保护的机构的任何救济途径\n\
  \n相比之下，该裁决并未直接影响欧盟委员会批准的用于向非欧盟国家传输数据的标准合同条款（SCCs）的有效性。然而，法院已澄清，除非欧盟委员会通过了关于该国隐私法充分性的有效决定，否则在认为根据具体情况无法通过其他方式保证传输的情况下，每个成员国的监督机构有义务暂停或禁止向非欧盟国家传输个人数据。\n\
  \n尽管如此，爱尔兰等若干监督机构对 Schrems II 裁决提出了正式评论，质疑基于标准合同条款向美国进行的传输的有效性，并敦促其他机构就此问题采取统一立场。意大利数据保护局未对此问题发表评论。\n\
  \n## 欧盟数据保护委员会发布的常见问题\n\n应爱尔兰监督机构的要求，欧洲数据保护委员会（EDPB）准备了一份常见问题解答（FAQs），其中本质上强调，数据出口方，即欧盟数据出口方和欧盟以外的数据进口方，有义务根据法院的关切对标准合同条款内的现有传输进行自身评估（该常见问题解答文件还包括通常规范集团内部传输的约束性企业规则（BCRs））。\n\
  \n常见问题解答意味着，基于标准合同条款传输个人数据的能力将取决于数据出口方对其在进口国（即美国）提供的充分保护保证的评估结果。评估必须考虑传输的实际情况以及为缓解法院关切而采取的任何进一步合同措施。这些程序应保证向欧盟境外传输个人数据不会损害《通用数据保护条例》及相关欧洲法律所要求的保护程度。\n\
  \n除了对个人评估的评论外，最重要的评论与标准合同条款和约束性企业规则的有效性有关。\n\n常见问题解答特别承认，如果引入能够解决法院关切的额外措施，标准合同条款和约束性企业规则仍可被视为适当的工具。具体而言，在重申各方负责评估传输后，他们表示：*欧洲数据保护委员会目前正在分析法院的裁决，以确定除标准合同条款和约束性企业规则之外可提供的额外措施类型，例如法律、技术或组织措施，以便向标准合同条款或约束性企业规则单独无法提供充分保护水平的第三国传输数据。欧洲数据保护委员会正在进一步研究这些新步骤可能涉及的内容，并将提供进一步指导。*\
  \ 在此背景下，与各欧洲当局的非正式讨论显示，欧洲数据保护委员会正在考虑潜在措施，一些涉及技术预防措施（例如加密）的提案已出现。实际上，预计技术人员和工程师将分析技术后果和替代解决方案。\n\
  \n## 接下来会发生什么？实体操作指南\n\n欧洲数据保护委员会尚未正式宣布对向欧盟以外国家，特别是美国传输个人数据的合法性进行调查的暂停。尽管在法院在 Schrems\
  \ 案中首次裁决后发生了什么，该裁决认定安全港非法，避免暂停似乎是所选的方案。事实上，基于法院裁决已开始重新谈判合同的公司是不可能采取行动的。在常见问题解答中，数据保护机构敦促企业采取紧急措施遵守裁决，包括研究其海外数据传输并启动对标准合同条款的充分性评估。\n\
  \n简而言之，这是欧洲数据保护委员会的建议：\n\n- 为避免潜在制裁，更重要的是为避免监督机构阻止个人数据传输的措施，公司应采取适当措施证明欧盟境外的数据传输符合《通用数据保护条例》，并考虑法院在\
  \ Schrems II 决定中表达的关切。为此，出口个人数据的企业最好采取监管机构肯定会重视的具体良好行为。例如，在使用隐私盾作为向美国传输个人数据的法律依据的情况下，他们应评估是否允许更改传输的法律依据，考虑到例如《通用数据保护条例》第49条中所述的假设，例如以下情况：\n\
  \  - 当事人同意（考虑到之前欧洲数据保护委员会关于同意有效性的标准）。\n  - 为履行数据主体与数据控制者之间的合同或应数据主体请求履行合同前措施而必需的传输。\n\
  \  - 为数据控制者与另一自然人或法人之间为当事人利益而订立或履行的合同所必需的传输（如为第三方利益而订立的合同）。\n- 为重大公共利益考虑而必需的传输。该例外范围很广。通常，公共利益由法律或行政法规确定，而不是由个人判断确定。然而，公共利益的存在必须定期评估。\n\
  - 为建立、行使或捍卫法律主张而必需的传输。这是欧洲所有者必须在第三国法院为自己辩护或主张自身权利的情况，在这种情况下，个人数据的传输（可能向顾问、辩护人，然后向第三国的司法当局）是必要的，以便开展辩护活动。在任何情况下，比例限制均适用于所传输数据的实质内容及其存储期限。\n\
  - 为保护数据主体或其他人的重大利益而必需的传输，如果数据主体因身体或法律原因无法提供许可。这是患者在海外接受医疗护理的典型情况。\n- 如果上述假设不能作为传输的有效法律依据，则首先需要检查欧盟委员会关于某些第三国个人数据保护法律充分性的决定。更重要的是，需要检查欧洲数据保护委员会关于基于标准合同条款向某些国家传输数据的合法性的任何声明，特别注意向美国的数据传输。事实上，可以设想（并且可能希望）监督机构将发布操作指南或关于使用标准合同条款以及适用于某些国家的任何其他合同保护的建议。此外，很可能欧盟委员会会预见到任何潜在的欧洲数据保护委员会裁决。\n\
  - 在短期内，然而，如果没有其他法律基础（即标准合同条款已在各方之间声明），最好与数据进口方讨论在标准合同条款保证中纳入额外安全措施，以供参与传输的各方使用，方式如欧洲法院在\
  \ Schrems II 决定中指出的那样。此行动必须先于对进口国提供的保证进行某种尽职调查：\n  - 确定所传输的个人数据流以及在随后向监督机构传输时对相关人员造成的风险程度。\n\
  \  - 分析接收国的当地法律以及其中规定的向公共机构传输数据的义务。就此而言，对于向美国的数据传输，特别相关的是确定数据接收方在多大程度上受《外国情报监视法》第702条和第12333号行政命令的约束。\n\
  - 根据核查结果，与数据进口方共同制定并谈判一系列额外合同措施，以纳入标准合同条款，以便在传输其个人数据时为数据主体提供更好的保证。直到欧洲数据保护委员会发布建议或就最合适的额外步骤提供澄清以保障\n\
  \n\n在通过标准合同条款（SCCs）传输个人数据的情况下，保障数据主体权利需要采取若干技术和组织措施：\n\n-   基于比例原则和隐私设计原则，对必须发送的数据进行预防性审查\n\
  -   应用加密方法\n-   数据假名化\n-   修改访问方式：不向进口方提供数据，而是向进口方人员授予受限访问权限，使用远程访问凭证访问出口方的系统和数据库\n\
  -   访问文档记录\n-   额外条款要求在外国公共机构提出披露请求时出口方事先通知和授权，或出口方限制数据流动并有效禁止进一步传输的权力\n-   规定出口方与进口方之间的合作形式，以便在有关其数据后续传输的透明度之外，利益相关方能够在不产生经济或法律成本的情况下，使用进口国法律规定的程序工具和行动权利以反对披露\n\
  \n## 结论\n\n超出所提议的解决方案，存在产生实际的非欧盟政府黑名单的严重危险，这些政府无法保证欧洲居民隐私的保护，对国际商业和地缘政治有明显影响。对“风险国家”的审查可能会对国际交易和全球服务供应产生重大影响，包括云计算、银行和保险。大多数交易和商业依赖于向包括英国在内的非欧盟国家传输数据。如果个人数据确实是新的黑金，并且庞大数据（所谓的大数据）的积累及其用于商业和市场目的的研究和使用是大型企业（在线服务提供商、云计算、社交媒体、大型科技公司）财富的基础，那么它们中的大多数（如果不是全部）位于美国或其他非欧盟国家，如中国和韩国，也是事实。\n\
  \n因此，人们不禁要问，相关判决是否不是在欧洲新主权主义背景下重新设计未来关系的政治意愿的结果，针对非欧盟供应商的过度权力；如果您想通过使数据在欧盟境外传输变得更加困难来强制数据保留在欧洲边界内，以便诱使利益相关者选择欧洲供应商而不是美国运营，那么欧洲人需要创建一个完整的技术生态系统，从云运营开始，但技术差距将会扩大。\n\
  \n此外，大型参与者本身可能被迫因这一决定而探索其服务的*欧洲化*，将其带入欧盟内部，正如他们中的许多人在 Schrems II 裁决之前已经做过的那样，并解决上游个人数据传输问题。\n\
  \n从某种意义上说，欧洲法院确认的原则是不可避免的，据此，今后欧洲公民数据的有效主权将始终得到保障，以防止外国政府当局以安全监控为幌子进行大规模数据收集。这难道就是奥威尔《1984年》的结论吗？\n\
  \n## 摘要\n\n在本章中，我试图帮助你理解数据保护相关的法律，并且尽管 GDPR 是一项良好的法案，但它离完美还很远。永远记住，法案、法律、框架等等都是由人类制定的，因此并不完美。但有时间让它们更接近完美。我们现在已经完成了对数据保护的探索。在下一章，我们将深入研究风险管理。\n"
- "## 安全规划与风险管理\n\n在过去几章中，我们花费了大量时间和精力处理隐私问题，现在是时候回到网络安全了。这次，我们将转向一个叫做**风险管理**的东西。但在进入风险管理之前，我们需要通过学习一些术语以及考虑实体中真正的威胁来了解基础知识。\n\
  \n在接下来的几页中，我们将深入介绍诸如安全威胁、挑战和风险管理等主题。如果你想了解更多关于该主题的信息，我强烈建议你获得一本专门聚焦该主题的书籍。\n\n在本章中，我们将探讨以下主题：\n\
  \n-   安全威胁和挑战\n-   实施风险管理计划\n\n### 安全威胁和挑战\n\n信息安全风险管理是识别、解决和预防安全问题的持续过程。风险评估是组织风险管理方法的基本组成部分，旨在确保足够的数据系统和数据安全水平。\n\
  \n我们可以将风险定义为威胁或限制组织履行其目标能力的任何事物。风险管理应是一系列在组织战略中采用的持续演进的程序，并应系统地管理过去、当前和未来努力周围的危害。\n\
  \n企业面临的信息安全威胁将根据所采用的处理特征和所处理数据的敏感性而有所不同。为了快速有效地创建安全的计算环境，有必要理解风险和风险评估技术的软件。\n\n\
  风险评估是识别组织为实现其业务目标而使用的数据资源所面临的漏洞和威胁的过程，并确定应采取何种对策（如果有）将风险降低到可接受水平。数据资源对组织的价值决定了应采取哪些对策。成功的风险管理需要组织管理各层级的共同努力。\n\
  \n### 安全威胁有哪些不同类型？\n\n有几种网络威胁可能导致攻击。恶意软件是最重要的危险向量之一。近年来它发展迅速，危及端点和服务器系统。除了让攻击者完全控制计算机外，勒索软件还可能加密数据，并在支付赎金后才解锁。\n\
  \n恶意软件通常是另一种普遍的安全威胁——黑客攻击的组成部分。黑客获取公司内部系统的访问权限，要么进行一次性攻击，要么进行长期活动，在此期间他们潜伏较长时间并随意收集信息。后者被视为**高级持续性威胁（APT）**。\n\
  \n其他攻击，例如**分布式拒绝服务（DDoS）**，通过破坏其资源来阻碍组织的在线运营。这些攻击通常源自数百万台被黑的机器，形成僵尸网络。\n\n### 什么是风险，什么是威胁？\n\
  \n风险和威胁有什么区别？\n\n风险管理是对风险进行防范的过程。风险和威胁相互交织，但认识它们的主要区别至关重要。\n\n*威胁更容易定义*，因为它涉及可能发生在组织内部的负面事件。*风险*，另一方面，可能是一个难以理解的概念；*它是某事发生的概率*，以及其潜在后果。它并不一定表示该事件会发生。\n\
  \n对于管理员和**托管安全服务提供商（MSSPs）**来说，能够量化公司的风险程度和位置是有利的。了解这种风险程度可以帮助你确定企业内部优先保护的内容以及如何分配安全支出。\n\
  \n一些安全专家利用安全风险计算来帮助得出一个精确的数字：\n\n*风险 = 威胁 x 漏洞 x 后果*\n\n这在数学课上肯定站不住脚，但它为你提供了人们如何评估风险的概率和影响的一般理解。\n\
  \n\n\n在这种计算安全风险的方法中，漏洞是指使攻击者能够对公司发起攻击的组织缺陷。例如，公司未能正确安装防火墙，可能会使黑客攻击更容易成功。在不再受支持且因此无法修补的\
  \ Windows XP 上运营业务，可能会使对手更容易发动与恶意软件相关的攻击。\n\n某些漏洞比其他漏洞更容易受到攻击。一些漏洞可能比其他漏洞更容易被发现和利用，从而降低了攻击者的门槛。\n\
  \n如果被利用，一些漏洞对公司的危害可能小于其他漏洞。每次利用都可能对数据的可用性、保密性和完整性产生技术影响。这三个要素被称为 CIA 三元组。\n\n例如，DDoS\
  \ 攻击可能会暂时使数据无法访问，但攻击者可能无法修改或窃取该数据。然而，恶意软件可能会使攻击者能够做到全部三点。\n\n反过来，技术影响会影响公司。根据漏洞和威胁的性质，公司所受影响可能从微不足道到灾难性不等。\n\
  \n例如，暂时阻断系统鲜少使用且隔离部分的服务的攻击可能不会被察觉。相比之下，成功窃取敏感客户数据的攻击可能会对企业造成严重的法律、财务和声誉影响。如果客户的社保号码和健康信息出现在类似\
  \ Pastebin 的网站上，监管机构和集体诉讼律师会高度关注。\n\n有时，重大后果并不明显。例如，攻击者通过窃听制造工厂中晦涩的机器人流程数据可能会造成什么损害？如果他们能够修改该数据导致机器人生产出有缺陷的产品，那影响就很大。\n\
  \n确定企业面临的风险程度的过程也可以被自动化；某些软件允许您为此风险分配货币价值。它通过扫描网络中未受保护的数据（包括持久存储），并估算数据泄露情况下组织的潜在财务风险来实现这一点。\n\
  \n企业必须认真对待这些威胁，这就需要完善其 IT 风险管理方法。\n\n在没有任何背景的情况下审视众多的网络安全风险可能会令人困惑且令人望而生畏。相反，企业可以通过对风险进行分类和评估来分析风险概率和影响。这意味着建立\
  \ IT 风险管理程序，以帮助您评估整个公司的网络安全威胁。\n\n在进行此类评估时，管理员和 MSSP 应首先关注高影响因素，例如勒索软件。您必须研究如果组织的安全被勒索软件攻破会发生什么；这只是恢复备份时的一点小麻烦，还是巨大的灾难？以这种方式考虑攻击场景提供了有力的参考点，使基于此评估创建风险威胁漏洞矩阵成为可能，并有助于投资优先级的确定。\n\
  \n处理网络安全风险可能很困难，但不必像您想象的那样昂贵。通过仔细考虑各种威胁对您风险的影响，您可以优先保护组织最重要的资产，并始终领先攻击者一步。\n\n这对\
  \ MSSP 具有重要意义，因为它通过审视系统宕机或数据被窃的实际业务影响，为其与潜在客户进行安全对话提供了重要起点——甚至还考虑了企业是否可能被用作进入其他合作伙伴系统的通道。\n\
  \n通过以这种方式将对话从安全转向风险，MSSP 可以与潜在客户进行更有用、更有效的对话。\n\n## Implementing a risk management\
  \ program\n\n有效的风险管理计划帮助企业评估其面临的全部威胁范围。风险管理还确定了风险与它们可能对公司战略目标产生的连锁影响之间的联系。\n\n这种全面的风险管理方法被称为\
  \ **enterprise risk management (ERM)**，因为它专注于预测和理解整个企业中的风险。除了关注内部和外部风险外，ERM 还强调管理积极风险的必要性。\n\
  \n积极风险是机会，如果抓住可能增加公司的价值，如果忽视则可能损害它。事实上，风险管理计划的目标不是消除所有风险，而是通过审慎的风险选择来保护和增加企业价值。\n\
  \n以下类别是风险管理的三种形式：\n\n- **Project risks**：多种财务、进度、人力、资源和用户相关问题构成项目风险。进度延误是主要项目风险。由于软件是无形的，监控和控制软件项目很困难。难以管理无法识别的东西。对于某些制造项目，例如汽车生产，工厂主管可以识别产品成形的过程。\n\
  - **Technical risks**：这包括可能出现的困难、安装、接口、测试和维护挑战。它还包括模糊的规范、不完整的规范、不断变化的规范、技术模糊性和技术过时。由于开发团队缺乏项目专业知识，存在许多技术风险。\n\
  - **Business risks**：这包括创造出无人想要的卓越产品、未能履行财务或人员义务的可能性。\n\n## Why is risk management\
  \ so important?\n\n也许，风险管理从未像今天这样重要。由于全球化的快速发展，当代企业面临的风险变得越来越复杂。不断出现新的威胁，通常源于数字技术的广泛使用。气候变化被风险专家称为\
  \ *danger multiplier.*\n\n新冠疫情作为近期外部风险，在许多公司表现为供应链问题，迅速演变为生存威胁，影响员工的健康与安全、开展业务的方式、与客户互动的能力以及企业声誉。\n\
  \n企业对疫情风险做出了迅速调整。然而，未来他们仍面临额外风险，例如是否让员工重返办公室以及如何使供应网络对灾难的敏感度降低。\n\n随着全球继续应对 COVID-19，企业及其董事会正在重新评估其风险管理系统。他们正在重新评估风险敞口并分析风险管理方法。他们也在重新评估谁应参与风险管理。目前采用被动风险管理方法（即防范过去的危险，并在新风险造成损害时修改流程）的公司正在评估更主动策略的竞争优势。支持可持续性、韧性和企业敏捷性正变得越来越受欢迎。公司也在研究先进的\
  \ **governance, risk, and compliance** (GRC) 系统以及人工智能技术如何增强风险管理。\n\n例如，在金融机构中存在\
  \ **chief risk officer** (CRO) 的角色，尽管银行和保险公司几十年来一直维持着庞大的风险部门。此外，金融服务组织面临的风险往往以统计数据为基础，因此可以使用既定技术和程序进行量化并成功审查。金融机构的风险状况可以被准确预测。\n\
  \n随着定性风险在其他行业变得更难以管理，对深思熟虑、严格和一致的风险管理方法的需求也在增加。企业风险管理策略旨在帮助企业尽可能明智地管理风险。\n\n当然，这仍然是一个序言。但现在我们可以继续围绕风险管理进行更激动人心的讨论，从传统风险管理与企业风险管理之间的差异开始。\n\
  \n## Traditional risk management versus enterprise risk management\n\n企业风险管理享有优于传统风险管理的声誉。两种技术都旨在减少对公司的潜在威胁。两者都购买保险以防范各种危险，从火灾和盗窃损失到网络责任。最后，两者都符合主要标准组织的建议。专家说传统风险管理\n\
  \n缺乏理解风险作为企业战略和绩效固有组成部分所需的态度和流程。\n\n在传统的风险管理计划中，风险历来由负责承担风险的部门的公司高管负责。例如，CIO 或 CTO\
  \ 对 IT 风险负责，CFO 对财务风险负责，COO 对运营风险负责，等等。即使业务部门已建立了精细的程序来管理其不同类型的风险，如果组织未能看到风险之间的联系或其对运营的累积影响，仍可能遇到困难。传统风险管理通常是被动的而不是主动的。\n\
  \n大流行病是风险的完美例子，如果你没有对可能损害你公司的风险类型进行全面、长期的战略视角，这种风险很容易被忽视。许多企业回头时会说：“你知道，我们本应该知道这一点，或者至少在事件发生前考虑过此类事件的财务后果。”\n\
  \n企业风险管理中的风险管理是一种协作、跨职能和整体性的工作。一个 ERM 团队，可能仅由五个人组成，与业务部门高管和员工合作，对他们进行简报，帮助他们使用适当的工具评估风险，汇编数据，并将其交付给组织的\
  \ senior 领导层和董事会。这类风险领导者必须在整个组织的高管中具有信誉。\n\n日益增长的是，这些专业人士来自咨询经验或具有咨询思维，并对商业机制有深刻的理解。与传统风险管理相比，传统风险管理中风险负责人通常向\
  \ CFO 汇报，企业风险管理团队的负责人——无论他们是否担任首席风险官或其他头衔——都向其 CEO 汇报，这表明风险是商业战略不可或缺的组成部分。\n\n传统风险管理组的另一个特征是对风险的厌恶。然而，自认为风险厌恶且风险承受能力低的企业在风险评估方面并不总是准确的。\n\
  \n在下面的图中，你可以看到与风险敞口相关的最重要的因素：\n\n| 问题 | 描述 |\n|---|---|\n| 什么是风险敞口？ | 风险敞口是当前进行中或计划中的业务活动所产生的量化潜在损失\
  \ |\n| 如何计算？ | 风险敞口水平通过将风险事件发生的概率乘以其潜在损失金额计算得出：风险敞口 = 风险影响 x 概率 |\n| 为什么风险敞口很重要？\
  \ | 在业务中，风险敞口用于对不同类型损失的概率进行排序，并确定哪些损失是可以接受或不可接受的 |\n| 最常见的风险敞口类型有哪些？ | 品牌损害、合规失败、安全漏洞和责任问题\
  \ |\n\n图 5.1 – 与风险敞口相关的因素\n\n到目前为止，我们只探索了该主题的表面。让我们深入分析整个过程。\n\n## 信息安全风险管理涉及哪些步骤？\n\
  \n风险管理是对特定活动或事件相关危害的审查。信息技术、项目、安全问题以及风险可进行定量和定性分析的其他活动都使用风险管理。\n\n风险是任何 IT 项目和企业企业的组成部分。风险管理应经常更新，以便识别新的潜在风险。战略风险管理最大限度地降低未来风险的可能性和影响。\n\
  \n尽管许多知识体系制定了管理风险的框架，但我们将坚持使用 ISO 31000 标准、风险管理 – 指南，由众所周知的 ISO 制定。\n\nISO 的五步风险管理流程包括以下内容，可由任何类型的实体使用：\n\
  \n- 1. **Identify the risk** – 第一个阶段是识别组织在其运营环境中面临的风险。有几种形式的风险，例如法律风险、环境风险、工业风险和监管风险等。识别尽可能多的潜在风险因素至关重要。\n\
  \n在手动环境中，这些危害可以手动缓解。如果公司使用风险管理解决方案，部分数据会立即输入系统。\n\n这种策略的好处是，这些风险对具有系统访问权限的所有组织利益相关者都是显而易见的。任何需要了解已识别风险的人都可以访问风险管理系统中的数据，而不必像过去那样将此信息锁定在必须通过电子邮件请求的纸质文件中。\n\
  - 2. **Analyze the likelihood and impact of each risk** – 一旦风险被计算并识别，风险分析过程应分析每个将出现的风险，并确定与每个风险相关的后果。它还确定它们可能如何影响\
  \ IT 项目的目标。\n\n在实施风险管理系统时，将风险映射到众多文档、规则、程序和业务流程是其中最基础的阶段之一。这指定系统将具有映射的风险结构，该结构计算风险并理解每个风险的深远后果。\n\
  - 3. **Evaluating the risk** – 在对风险进行分析以支持关于哪些 IT 资产有价值以及哪些威胁可能对其产生负面影响的概念之后，可以制定风险管理计划，该计划生成可用于减轻、转移、接受或防止风险的控制建议。\n\
  - 4. **Treating the risk** – 此阶段的目的是实施消除或减少分析中确定的风险所需的步骤。它可以解决或至少减轻每项风险，使其不再构成危险，从优先级最高的风险开始。\n\
  - 5. **Monitoring and reviewing the risk** – 此阶段负责定期监控安全风险，以便识别、评估和管理危害，这应是任何风险分析程序不可或缺的一部分。\n\
  \n在下面的图中，你可以看到风险管理步骤：\n\n![](img/60ab32c90068557380d1368a9d3a0d47_92_0.png)\n\n\
  图 5.2 – 风险管理步骤\n\n在风险识别的最后阶段，公司将其结果记录在风险登记册中。它有助于在风险管理流程的接下来的四个阶段中跟踪风险。\n\n理想状态是以自上而下的方法实施任何框架或计划，当然包括风险管理框架。\n\
  \n## 从自上而下到自下而上\n\n许多风险委员会发现，在考虑可能阻碍或促进组织目标的风险情景时，采用自上而下、自下而上的策略是有利的。在自上而下的努力中，领导层确定组织的关键任务流程，并与内部和外部利益相关者合作，识别可能阻碍这些活动的状况。自下而上的观点评估威胁源（地震、经济衰退、网络攻击等）对重要资产的可能影响。\n\
  \n## 风险管理的益处与挑战\n\n有效地管理可能对资本和盈利能力产生负面或积极影响的风险有几个优势。即使对于具有复杂治理、风险和合规程序的公司而言，它也带来了障碍。\n\
  \n风险管理的优势包括以下几点：\n\n- 公司内部增强风险意识\n- 将风险纳入战略后，对企业目标和目标的信心增强\n- 合规协调导致对监管和内部合规法规的更大、更高效的合规\n\
  - 通过更一致地实施风险协议和控制，增强运营效率\n- 提高员工和消费者工作场所的安全性和保障\n- 在市场上具有独特的竞争优势\n\n风险管理团队可能面临的障碍如下：\n\
  \n- 最初，成本增加，因为风险管理策略通常需要昂贵的软件和服务\n- 为遵守对治理的日益关注，业务部门还必须投入时间和金钱\n- 就危险的严重程度和如何应对达成一致可能是一项艰难而有争议的任务，在某些情况下可能导致分析瘫痪\n\
  - 在没有具体数据的情况下，很难向高管证明风险管理的益处\n\n## 制定和实施风险管理计划\n\n风险管理策略概述了公司将如何管理风险。它概述了组件，例如组织的风险战略、风险管理团队的角色和职责、其将用于管理风险的资源以及风险管理的规则和程序。\n\
  \n让我们使用 ISO 31000 标准（有很多，从 **Committee of Sponsoring Organization**、**COSO** (https://www.coso.org/)\
  \ 到 eBIOS (https://www.enisa.europa.eu/topics/threat-risk-management/risk-management/current-risk/risk-management-inventory/rm-ra-methods/m_ebios.html,\
  \ 一个由欧洲社区赞助的类似框架），但为了简单起见，我们将使用你已经听说过的东西：\n\n- **Consultation and communication**\
  \ – 由于提高风险意识是风险管理的重要组成部分，风险领导者还必须设计沟通策略，以向员工和其他相关方传达组织的风险政策和程序。此阶段为所有与风险相关的决策定下基调。受众包括任何对公司如何利用有利风险和减轻不利风险感兴趣的人。\n\
  \n\n\n\n- **提供背景** – 此阶段涉及确定组织的特定风险偏好和风险容忍度（即风险可能偏离风险偏好的程度）。这些考虑因素包括公司目标、企业文化、监管法律和政治环境。\n\
  - **风险识别** – 此阶段识别可能对组织开展业务能力产生有利或负面影响的风险情景。如前所述，所得列表应录入最新的风险登记册。\n- **风险分析** –\
  \ 对每个风险的概率和严重程度进行审查以对其进行分类。在这种情况下，创建风险热力图是有益的，该热力图直观地展示了公司风险的性质和影响。员工请病假是一种高概率事件，对大多数企业的影响微乎其微或没有影响。取决于其位置，地震是低概率但高影响危险的例子。\n\
  - **风险评估** – 在此，企业考虑如何应对所面临的威胁。技术包括以下至少一种：\n  - **风险规避** – 风险规避的目标是消除、退出或避免可能发生的危险。\n\
  \  - **风险缓解** – 组织最小化或优化风险的过程。\n  - **风险分担**（或 **风险转移**） – 组织与第三方（如保险公司）签订合同，以承担可能出现或不出现的风险相关的全部或部分费用。\n\
  \  - **风险接受** – 符合公司风险偏好和容忍度的风险将不采取行动而被接受。\n- **风险处理** – 此阶段涉及实施已商定的控制措施和程序，并验证其按预期运行。\n\
  - **监控和评估** – 控制措施是否正常运行？能否改进？监控操作应监控 **关键绩效指标 (KPIs)** 并寻找可能促使策略调整的 **关键风险指标 (KRIs)**。\n\
  \n在以下图中，您可以看到风险管理热力图的示例：\n\n![](img/60ab32c90068557380d1368a9d3a0d47_95_0.png)\n\
  \n图 5.3 – 风险管理热力图\n\n现在我们已经解释了一些与风险管理相关的术语，让我们在其基础上再添加一些内容。\n\n## 定性风险分析\n\n基于个人对其严重程度和概率的感知来分析风险即为定性风险分析。定性风险分析的目标是提供一份必须优先于其他风险的风险清单。\n\
  \n定性风险分析是项目经理抵御风险的第一道防线。它有助于消除项目成功的可能障碍，例如不太可能造成重大损害的风险。通过首先关注最严重的风险，项目经理可以更有效地分配时间和资源。\n\
  \n## 定量风险分析\n\n定量风险分析是基于收集的数据对风险进行计算。定量风险分析的目标是确定风险影响将给公司带来多少成本。这是通过利用现有知识来预测或估计结果来实现的。\n\
  \n要使数据适用于定量风险分析，必须在较长的时间段内进行分析或在许多情况下出现。例如，在之前的五次实验中，A型设备在使用七小时后发生故障。有了这些知识，可以合理预测，如果项目需要员工使用A型设备八小时，那么其发生故障的风险为百分之百。\n\
  \n## 定性与定量风险分析的区别\n\n定性风险分析与定量风险分析之间的根本区别在于评估基础。如前所述，定性风险分析基于个人的印象或判断，而定量风险分析基于已确认和指定的事实。\n\
  \n另一个区别是相应的风险等级。在定性风险分析中，该数字代表风险评级或分数。危险可能被评为低或得分为1，以表示它不需要紧急行动。在定量风险分析中，与风险相关的值通常以百分比表示，表示风险发生的可能性，或风险对项目目标产生特别负面影响的可能性。\n\
  \n## 何时进行定性与定量风险分析\n\n当对风险的感知发生变化并且发现新的危险时，应进行定性风险分析。一般来说，每个项目都应从定性风险评估开始。此外，由于其简单、快速且成本低廉，定性风险分析可在项目全程的任何时间进行，或在项目经理认为需要时进行。\n\
  \n当有关风险及其影响的数据充足，并且需要确认定性风险分析时，应进行定量风险分析。由于定量风险分析可能复杂且耗时，大多数项目经理不会在项目的准确风险估计对项目安全至关重要之前推荐它。在这种情况下，定量风险分析可能由法律或项目利益相关者强制要求。\n\
  \n## 总结\n\n好吧，如果你读到这里，你值得鼓掌。这是一个非常密集的章节，有很多新东西需要解释。只是让你知道，通过谈论风险管理、ISO 31000 以及定量与定性风险分析，我们才刚刚触及冰山一角。但是，考虑到风险管理是一个极其困难的话题，包括数学、统计学等等，我认为给出一个更长的章节是恰当的！\n\
  \n在接下来的章节中，我们的注意力将放在我们钟爱的 ISO 27001 上：我们将深入探讨，这将非常令人兴奋。\n"
