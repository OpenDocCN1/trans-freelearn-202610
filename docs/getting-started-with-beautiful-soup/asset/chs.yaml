- "## 1 安装 Beautiful Soup\n\n在开始使用 Beautiful Soup 之前，我们应确保它已正确安装在我们的机器上。所需步骤非常简单，任何用户都可以迅速完成安装。在本章中，我们将涵盖以下主题：\n\
  \n- 安装 Beautiful Soup\n- 验证 Beautiful Soup 的安装\n\n### 安装 Beautiful Soup\n\nPython\
  \ 支持安装第三方模块，如 Beautiful Soup。在最佳情况下，我们可以期望模块开发者可能已准备好平台特定的安装程序，例如在 Windows 的情况下为可执行安装程序；在\
  \ Red Hat 为基础的 Linux 操作系统（如 Red Hat、Open Suse 等）的情况下为 rpm 包；在 Debian 为基础的操作系统（如\
  \ Debian、Ubuntu 等）的情况下为 Debian 包。但这并不总是如此，如果平台特定的安装程序不可用，我们应了解替代方案。我们将讨论在不同操作系统（如\
  \ Linux、Windows 和 Mac OS X）中可用的不同 Beautiful Soup 安装选项。我们将在后面的示例中使用的 Python 版本为 Python\
  \ 2.7.5，用于安装 Beautiful Soup 的说明可能与 Python 3 不同。你可以直接前往对应操作系统的安装部分。\n\n### 在 Linux\
  \ 中安装 Beautiful Soup\n\n在 Linux 机器上安装 Beautiful Soup 非常简单直接。对于 Debian 或 Ubuntu 的最新版本，Beautiful\
  \ Soup 可作为包提供，我们可以使用系统包管理器进行安装。对于 Debian 或 Ubuntu 的其他版本，如果 Beautiful Soup 不作为包提供，我们可以使用替代方法进行安装。\n\
  \n\n\n\n\n通常，在Linux机器上安装Beautiful Soup有以下三种方式：\n\n- 使用包管理器\n- 使用pip\n- 使用easy_install\n\
  \n这些选择根据复杂程度排序，以避免反复试验。最简单的方法始终是使用包管理器，因为它需要用户付出的努力较少，所以我们将首先介绍这种方法。如果一步安装成功，我们就不需要执行下一步，因为前面提到的三种方式所做的是同一件事。\n\
  \n### 使用包管理器安装Beautiful Soup\n\nLinux机器通常自带包管理器来安装各种软件包。在较新版本的Debian或Ubuntu中，由于Beautiful\
  \ Soup以软件包形式提供，我们将使用系统包管理器进行安装。在Ubuntu和Debian等Linux机器中，默认的包管理器基于apt-get，因此我们将使用apt-get来完成此任务。\n\
  \n只需打开终端并输入以下命令：\n\n```\nsudo apt-get install python-bs4\n```\n\n上述命令将在我们的Linux操作系统中安装Beautiful\
  \ Soup版本4。在系统中安装新软件包通常需要root用户权限，这就是为什么我们在apt-get命令前加上sudo的原因。如果我们没有添加sudo，最终会遇到权限拒绝错误。如果软件包已经更新，我们将在命令行中看到以下成功消息：\n\
  \n![](img/c437561ffd11fadb571896e0a4ca4d18_18_0.png)\n\n由于我们使用的是较新版本的Ubuntu或Debian，`python-bs4`\
  \ 会列在`apt`仓库中。但如果上述命令失败并显示`Package Not Found Error`，则表示软件包列表不是最新的。这通常发生在我们刚刚安装操作系统且尚未从软件包仓库下载软件包列表时。在这种情况下，我们需要首先使用以下命令更新软件包列表：\n\
  \n```\nsudo apt-get update\n```\n\n上述命令将从在线软件包仓库更新必要的软件包列表。之后，我们需要再次尝试前面安装Beautiful\
  \ Soup的命令。\n\n在较旧版本的Linux操作系统中，即使运行了`apt-get update`命令，也可能无法安装Beautiful Soup，因为仓库中可能没有它。在这种情况下，我们可以依靠其他安装方法，使用`pip`或`easy_install`。\n\
  \n### 使用pip或easy_install安装Beautiful Soup\n\n`pip`和`easy_install`是用于管理和安装Python包的工具。两者都可以用来安装Beautiful\
  \ Soup。\n\n### 使用pip安装Beautiful Soup\n\n在终端中，输入以下命令：\n\n```\nsudo pip install beautifulsoup4\n\
  ```\n\n上述命令将从`http://pypi.python.org/`下载必要的软件包后在系统中安装Beautiful Soup版本4。\n\n### 使用easy_install安装Beautiful\
  \ Soup\n\n`easy_install`工具从**Python包索引**（PyPI）安装软件包。因此，在终端中输入以下命令：\n\n```\nsudo\
  \ easy_install beautifulsoup4\n```\n\n### 安装Beautiful Soup\n\n如果你没有有效的网络连接，前面所有在Linux中安装Beautiful\
  \ Soup的方法都将无法工作。所以，如果一切方法都失败，我们仍然可以安装Beautiful Soup。最后一个选项是使用从pypi.python.org下载的每个Python包附带的`setup.py`脚本。这种方法也推荐用于在Windows和Mac\
  \ OS X机器上安装Beautiful Soup。因此，我们将在*在Windows中安装Beautiful Soup*一节中讨论这种方法。\n\n### 在Windows中安装Beautiful\
  \ Soup\n\n在Windows中，我们将使用https://pypi.python.org/packages/source/b/beautifulsoup4/上可用的最新Beautiful\
  \ Soup Python包，并使用`setup.py`脚本来安装Beautiful Soup。但在执行此操作之前，如果将Python的路径添加到系统路径中，操作会更容易。下一节将讨论在Windows机器上设置Python路径。\n\
  \n### 验证Windows中的Python路径\n\n在Windows中，python.exe的路径通常不会默认添加到环境变量中。因此，为了从Windows命令行提示符检查这一点，你需要输入以下命令：\n\
  \n```\npython\n```\n\n如果Python的路径已经添加到环境路径变量中，或者我们已经在Python安装目录内，上述命令将无错误地运行。但是，最好检查一下路径变量中是否有Python目录条目。\n\
  \n如果路径变量中不存在，我们必须找出实际路径，这完全取决于你安装Python的位置。对于Python 2.x，默认路径为C:\\Python2x；对于Python\
  \ 3.x，默认路径为C:\\Python3x。\n\n我们必须将其添加到Windows机器的*Path*环境变量中。为此，右键单击**我的电脑 | 属性 |\
  \ 环境变量 | 系统变量**。\n\n选择Path变量，并将以下内容添加到Path变量中：\n\n```\n;C:\\PythonXY 例如 C:\\Python27\n\
  ```\n\n如下截图所示：\n\n![](img/c437561ffd11fadb571896e0a4ca4d18_21_0.png)\n\n在Windows中添加Python路径（本例中使用Python\
  \ 2.7）\n\nPython路径就绪后，我们就可以按照步骤在Windows机器上安装Beautiful Soup。\n\n> 下一节将讲解的通过`setup.py`安装Beautiful\
  \ Soup的方法在Linux、Windows和Mac OS X操作系统中是相同的。\n\n### 使用setup.py安装Beautiful Soup\n\n\
  我们可以使用`setup.py`脚本来安装Python包，该脚本随从Python包索引网站`https://pypi.python.org/`下载的每个Python包一起提供。以下步骤用于使用`setup.py`安装Beautiful\
  \ Soup：\n\n- 1. 从https://pypi.python.org/packages/source/b/beautifulsoup4/下载最新的tarball。\n\
  - 2. 将其解压到一个文件夹（例如`BeautifulSoup`）。\n- 3. 打开命令行提示符，并导航到解压后的文件夹，如下所示：\n  `cd BeautifulSoup`\n\
  \  `python setup.py install`\n- 4. `python setup.py install`命令将在我们的系统中安装Beautiful\
  \ Soup。\n\n> 我们还没有穷尽使用Beautiful Soup的所有可能选项。即使目前列出的所有选项都失败，我们仍然可以在应用程序中使用Beautiful\
  \ Soup。\n\n### 无需安装即可使用Beautiful Soup\n\n我们迄今讨论的安装过程通常会将模块内容复制到选定的安装目录。这因操作系统而异，在Debian等Linux操作系统中，路径通常是`/usr/local/lib/pythonX.Y/site-packages`，在Windows中则是`C:\\\
  PythonXY\\Lib\\site-packages`（其中X和Y表示相应的版本，如Python 2.7）。当我们在Python解释器或Python脚本中使用import语句时，Python解释器通常会在预定义的Python\
  \ `Path`变量中查找这些目录中的模块。因此，安装实际上就是将模块内容复制到预定义目录，或者将其复制到其他位置并将该位置添加到Python路径中。以下无需安装即可使用Beautiful\
  \ Soup的方法适用于任何操作系统，例如Windows、Linux或Mac OS X：\n\n- 1. 从https://pypi.python.org/packages/source/b/beautifulsoup4/下载最新版本的Beautiful\
  \ Soup包。\n- 2. 解压该软件包。\n- 3. 将`bs4`目录复制到我们希望存放所有Python Beautiful Soup脚本的目录中。\n\n\
  执行完上述所有步骤后，我们就可以使用Beautiful Soup了。在这种情况下，要导入Beautiful Soup，我们需要在包含bs4目录的目录中打开终端，或者将该目录添加到Python\
  \ Path变量中；否则，我们将收到模块未找到的错误。这个额外步骤是必需的，因为该方法特定于包含bs4目录的项目。但对于安装方法，正如我们前面所看到的，Beautiful\
  \ Soup将是全局可用的，可以在任何项目中使用，因此不需要这些额外步骤。\n\n### 验证安装\n\n要验证安装，请执行以下步骤：\n\n- 1. 在终端中使用以下命令打开Python解释器：\n\
  \  `python`\n- 2. 现在，我们可以使用以下命令发出一个简单的import语句来检查我们是否成功安装了Beautiful Soup：\n  `from\
  \ bs4 import BeautifulSoup`\n\n如果我们没有安装Beautiful Soup，而是将bs4目录复制到了工作区，则在使用上述命令之前，我们必须切换到放置bs4目录的目录。\n\
  \n### 快速参考\n\n下表是命令及其含义的概述：\n\n| 命令 | 描述 |\n|---|---|\n| `sudo apt-get install python-bs4`\
  \ | 该命令用于在Linux中使用包管理器安装Python包。 |\n| `sudo pip install beautifulsoup4` | 该命令用于使用pip安装Python包。\
  \ |\n| `sudo easy_install beautifulsoup4` | 该命令用于使用easy_install安装Python包。 |\n| `python\
  \ setup.py install` | 该命令用于使用setup.py安装Python包。 |\n| `from bs4 import BeautifulSoup`\
  \ | 该命令用于验证安装。 |\n\n\n\n"
- "## 2 创建 BeautifulSoup 对象\n\n我们在*第 1 章，安装 Beautiful Soup*中已经了解了如何在 Linux、Windows\
  \ 和 Mac OS X 机器上安装 Beautiful Soup。\n\nBeautiful Soup 广泛用于从网页中获取数据。我们可以使用 Beautiful\
  \ Soup 提取 HTML/XML 文档中的任何数据，例如获取页面中的所有链接或页面内标签中的文本。为了实现这一目标，Beautiful Soup 为我们提供了不同的对象，以及简单的搜索和导航方法。\n\
  \n任何输入的 HTML/XML 文档都会被转换为不同的 Beautiful Soup 对象，基于这些对象的不同属性和方法，我们可以提取所需的数据。Beautiful\
  \ Soup 中的对象列表包括：\n\n- `BeautifulSoup`\n- `Tag`\n- `NavigableString`\n\n### 创建 BeautifulSoup\
  \ 对象\n\n创建 BeautifulSoup 对象是任何 Beautiful Soup 项目的起点。BeautifulSoup 对象表示用于创建它的输入 HTML/XML\
  \ 文档。\n\nBeautifulSoup 通过传递一个字符串或一个类文件对象来创建（这个对象可以是我们机器上本地存储的文件的打开句柄，也可以是一个网页）。\n\
  \n### 从字符串创建 BeautifulSoup 对象\n\n可以将字符串传递给 `BeautifulSoup` 构造函数来创建对象，如下所示：\n\n```\n\
  helloworld = \"<p>Hello World</p>\"\nsoup_string = BeautifulSoup(helloworld)\n```\n\
  \n![](img/c437561ffd11fadb571896e0a4ca4d18_26_0.png)\n\n> **下载示例代码**\n> \n> 你可以从自己的账户中下载所有已购买的\
  \ Packt 图书的示例代码文件，网址为 `http://www.packtpub.com`。如果你从其他渠道购买了本书，可以访问 `http://www.packtpub.com/support`\
  \ 并注册，文件将会直接通过电子邮件发送给你。\n\n上述代码将根据输入字符串 `helloworld` 创建 BeautifulSoup 对象。我们可以看到输入已被当作\
  \ HTML 处理，并可通过 `print(soup_string)` 查看该对象的内容。\n\n```\n<html><body><p>Helloworld</p></body></html>\n\
  ```\n\n![](img/c437561ffd11fadb571896e0a4ca4d18_26_1.png)\n\n> 根据所使用的解析器，上述代码的输出在某些系统中可能会有所不同。这将在本章后面进行解释。\n\
  \n在创建对象的过程中，Beautiful Soup 会使用受支持的解析器将输入标记（HTML/XML）转换为树结构。这样，标记会被表示为不同的 Beautiful\
  \ Soup 对象，例如 `BeautifulSoup`、`Tag` 和 `NavigableString`。\n\n### 从类文件对象创建 BeautifulSoup\
  \ 对象\n\n也可以将类文件对象传递给 BeautifulSoup 构造函数来创建对象。这在解析在线网页时非常有用，这也是 Beautiful Soup 最常见的用途。\n\
  \n例如，假设我们需要获取由 Packt Publishing 出版的所有图书的列表，该列表位于 `http://www.packtpub.com/books`。为了减少通过浏览器访问此\
  \ URL 来获取页面内容为字符串的开销，更合适的做法是提供该 URL 的类文件对象来创建 BeautifulSoup 对象。\n\n```\nimport urllib2\n\
  from bs4 import BeautifulSoup\n```\n\n```\nurl = \"http://www.packtpub.com/books\"\
  \npage = urllib2.urlopen(url)\nsoup_packtpage = BeautifulSoup(page)\n```\n\n在上述\
  \ Python 脚本中，我们使用了 urllib2 模块（Python 原生模块）来打开 http://www.packtpub.com/books 页面。`urllib2.urlopen()`\
  \ 方法会为输入的 URL 返回一个类文件对象。然后我们通过传递该类文件对象来创建 BeautifulSoup 对象 `soup_packtpage`。\n\n\
  > 使用 URL 类文件对象创建 BeautifulSoup 对象是处理在线网页的高效方式。\n\n在上一示例中，我们学习了如何通过为 URL 传递类文件对象来创建\
  \ BeautifulSoup 对象。类似地，我们也可以将本地文件的文件对象传递给 BeautifulSoup 构造函数。\n\n为此，请从终端执行命令 mkdir\
  \ Soup，在机器上创建一个本地文件夹。使用 touch Soup/foo.html 在该文件夹中创建一个 HTML 文件 foo.html。在同一终端中，使用\
  \ cd Soup 切换到刚创建的目录。\n\n现在让我们来看一下使用 foo.html 文件创建 BeautifulSoup 的过程。\n\n```\nwith\
  \ open(\"foo.html\",\"r\") as foo_file:\n    soup_foo = BeautifulSoup(foo_file)\n\
  ```\n\n上面几行代码会根据本地文件 foo.html 的内容创建一个 BeautifulSoup 对象。\n\nBeautifulSoup 有一个基本的警告机制，用于提示我们传入的是文件名而不是文件对象。\n\
  \n让我们看一下下一行代码：\n\n```\nsoup_foo = BeautifulSoup(\"foo.html\")\n```\n\n这将产生以下警告：\n\
  \nUserWarning: \"foo.html\" looks like a filename, not markup. You should probably\
  \ open this file and pass the filehandle into Beautiful Soup.\n\n但仍然会创建一个 BeautifulSoup\
  \ 对象，并假定我们传入的字符串（\"foo.html\"）是 HTML。\n\n`print(soup_foo)` 代码行将给出以下输出：\n\n```html\n\
  <html><body><p>foo.html</p></body></html>\n```\n\n同样的警告机制也会在我们尝试传入 URL 而不是 URL 文件对象时提醒我们。\n\
  \n```python\nsoup_url = BeautifulSoup(\"http://www.packtpub.com/books\")\n```\n\n\
  上一行代码将产生以下警告：\n\n```text\nUserWarning: \"http://www.packtpub.com/books\" looks like\
  \ a URL.\nBeautiful Soup is not an HTTP client. You should probably use\nan HTTP\
  \ client to get the document behind the URL, and feed\nthat document to Beautiful\
  \ Soup\n```\n\n这里同样会创建 BeautifulSoup 对象，并将该字符串（URL）视为 HTML。\n\n```python\nprint(soup_url)\n\
  ```\n\n上述代码将给出以下输出：\n\n```html\n<html><body><p>http://www.packtpub.com/books</p></body></html>\n\
  ```\n\n因此，我们应该向 BeautifulSoup 构造函数传入文件句柄或字符串。\n\n### 创建用于 XML 解析的 BeautifulSoup\
  \ 对象\n\nBeautiful Soup 也可以用于 XML 解析。在创建 BeautifulSoup 对象时，Beautiful Soup 会选择 TreeBuilder\
  \ 类来创建 HTML/XML 树。TreeBuilder 类用于根据输入文档创建 HTML/XML 树。默认行为是选择任意一个使用默认 HTML 解析器的 HTML\
  \ TreeBuilder 对象，从而创建 HTML 树。在前面的示例中，使用字符串 helloworld 时，我们可以验证 soup_string 对象的内容，这表明输入在默认情况下被视为\
  \ HTML。\n\n```python\nsoup_string = BeautifulSoup(helloworld)\nprint(soup_string)\n\
  ```\n\n上述代码片段的输出如下：\n\n```html\n<html><body><p>Hello World</p></body></html>\n```\n\
  \n如果我们希望 Beautiful Soup 转而将输入解析为 XML，则需要使用 `BeautifulSoup` 构造函数中的 `features` 参数来明确指定这一点。通过指定\
  \ `features` 参数，BeautifulSoup 将能够选择满足我们所请求特性的最佳 `TreeBuilder`。\n\n### 理解 features\
  \ 参数\n\n`TreeBuilders` 类使用底层解析器进行输入处理。每个 `TreeBuilder` 会根据其使用的解析器拥有不同的特性集。因此，输入会根据传递给构造函数的\
  \ `features` 参数而以不同的方式处理。Beautiful Soup 中目前由不同 `TreeBuilder` 使用的解析器如下：\n\n- `lxml`\n\
  - `html5lib`\n- `html.parser`\n\n`BeautifulSoup` 构造函数的 `features` 参数可以接受字符串列表或字符串值。每个\
  \ `TreeBuilder` 及其底层解析器当前支持的特性如下表所示：\n\n| 特性 | TreeBuilder | 解析器 |\n|---|---|---|\n\
  | ['lxml','html','fast','permissive'] | LXMLTreeBuilder | lxml |\n| ['html','html5lib','permissive','strict','html5']\
  \ | HTML5TreeBuilder | html5lib |\n| ['html','strict','html.parser'] | HTMLParserTreeBuilder\
  \ | html.parser |\n| ['xml','lxml','permissive','fast'] | LXMLTreeBuilderForXML\
  \ | lxml |\n\n`features` 参数可以指定为字符串列表或字符串值。Beautiful Soup 会选择具有指定特性的最合适的 `TreeBuilder`。对于\
  \ HTML 文档，选择 TreeBuilder 的顺序取决于其构建所基于的解析器的优先级：首先是 `lxml`，其次是 `html5lib`，最后是 `html.parser`。例如，如果我们提供\
  \ `html` 作为特性，Beautiful Soup 会在 `lxml` 解析器可用时选择 `lxmlTreeBuilder`。如果 `lxml` 解析器不可用，它会选择基于\
  \ `html5lib` 解析器的 `HTML5TreeBuilder`；如果 `html5lib` 解析器也不可用，则选择基于 `html.parser` 的\
  \ `HTMLPraserTreeBuilder`。对于 XML，由于 `lxml` 是唯一可用的解析器，所以始终选择 `LXMLTreeBuilderForXML`。\n\
  \n\n\n\n### 创建 BeautifulSoup 对象\n\n我们可以在 BeautifulSoup 构造器中指定 features 参数，将输入视为\
  \ XML 进行处理，如下所示：\n\n```\nsoup_xml = BeautifulSoup(helloworld,features=\"xml\")\n\
  ```\n\n另一种替代方法是使用以下代码行：\n\n```\nsoup_xml = BeautifulSoup(helloworld,\"xml\")\n```\n\
  \n在之前的代码中，我们将 xml 作为 features 参数的值传递并创建了 soup_xml 对象。我们可以看到，相同的 content (\"<p>HelloWorld</p>\"\
  ) 现在被当作 XML 而不是 HTML 来处理。\n\n```\nprint(soup_xml)\n```\n\n```\n#output\n<?xml version=\"\
  1.0\" encoding=\"utf-8\"?>\n<p>Hello World</p>\n```\n\n在之前的示例中，Beautiful Soup 基于\
  \ lxml 解析器选择了 LXMLTreeBuilderForXML 并将输入解析为 XML。\n\n> features 参数帮助我们选择文档的 HTML/XML\
  \ 解析。\n\n通过提供 features 参数，我们是在指定 TreeBuilder 应该具有的功能。如果 Beautiful Soup 无法找到具有给定功能的\
  \ TreeBuilder，则会抛出错误。例如，假设 lxml 是 Beautiful Soup 目前用于 XML 处理的唯一解析器，且未安装在系统中。在这种情况下，如果我们使用以下代码行：\n\
  \n```\nsoup_xml = BeautifulSoup(helloworld,features=\"xml\")\n```\n\n之前的代码将失败并抛出以下错误（因为系统中未安装\
  \ lxml）：\n\n```\nbs4.FeatureNotFound: Couldn't find a tree builder with the\n  \
  \  features you requested: xml. Do you need to install a parser\n    library?\n\
  ```\n\n在这种情况下，我们应该使用 easy_install、pip 或 setup.py install 安装所需的解析器。\n\n在创建 BeautifulSoup\
  \ 对象时始终最好指定要使用的解析器。这是因为不同的解析器会以不同的方式解析内容。这在我们提供无效 HTML 内容进行解析时更为明显。前面讨论的三个解析器在无效\
  \ HTML 的情况下会产生三种类型的 HTML 树。例如：\n\n```\ninvalid_html = '<a invalid content'\n```\n\
  \n这里的 HTML 无效，因为没有闭合的 </a> 标签。使用前面提到的解析器处理此无效 HTML 如下所示：\n\n- 使用 lxml 解析器，如下所示：\n\
  \  - soup_invalid_html = BeautifulSoup(invalid_html, 'lxml')\n  - print(soup_invalid_html)\
  \ 代码行将给出使用 lxml 解析器生成的 HTML 树。\n  - <html><body><a invalid content=\"\"></a></body></html>\n\
  \  - 从输出中可以看出，lxml 解析器已处理了无效 HTML。它添加了闭合的 </a> 标签，并将无效内容视为 <a> 标签的属性。除此之外，它还添加了\
  \ <html> 和 <body> 标签，而这些标签在输入中并不存在。如果使用 lxml，默认情况下会添加 <html> 和 <body> 标签。\n- 使用\
  \ html5lib 解析器，如下所示：\n  - soup_invalid_html = BeautifulSoup(invalid_html, 'html5lib')\n\
  \  - print(soup_invalid_html) 代码行将向我们展示使用 html5lib 解析器生成的 HTML 树。\n  - <html><head></head><body></body></html>\n\
  \  - 从输出中可以看出，html5lib 解析器添加了 <html>、<head> 和 <body> 标签，而这些标签在输入中并不存在。例如，lxml 解析器和\
  \ html5lib 解析器会对任何输入都添加这些标签。但与此同时，它已丢弃了无效的 <a> 标签以生成输入的不同表示。\n- 使用 html.parser，如下所示：\n\
  \  - soup_invalid_html =\n    BeautifulSoup(invalid_html,'html.parser')\n\n`print(soup_invalid_html)`\
  \ 代码行将向我们展示使用 `html.parser` 生成的 HTML 树。\n\n`html.parser` 丢弃了无效 HTML 并生成了空树。与其他解析器不同，它不会添加任何\
  \ `<html>`、`<head>` 或 `<body>` 标签。\n\n因此，通过提供 `features` 参数来指定解析器是很好的，因为这有助于确保输入在不同机器上以相同的方式处理。否则，如果存在无效\
  \ HTML，相同的代码可能会在一台机器上中断，因为 Beautiful Soup 选择的默认解析器会生成不同的树。指定 `features` 参数有助于确保在所有机器上生成的树是相同的。\n\
  \n在创建 BeautifulSoup 对象时，还会创建其他对象，包括以下内容：\n\n- Tag\n- NavigableString\n\n### Tag\n\
  \nTag 对象表示 HTML 和 XML 文档的不同标签。Tag 对象的创建是在解析文档时完成的。解析期间识别的不同 HTML/XML 标签表示为相应的 Tag\
  \ 对象，这些对象将具有 HTML/XML 标签的属性和内容。Tag 对象可用于在 HTML/XML 文档中进行搜索和导航。\n\n### 从 BeautifulSoup\
  \ 访问 Tag 对象\n\nBeautifulSoup 允许我们访问任何 Tag 对象。例如，我们可以通过简单地调用标签名称 `<a>` 来访问下一个示例中\
  \ `<a>` 标签的第一次出现。\n\n```\nhtml_atag = \"\"\"<html><body><p>Test html a tag example</p>\n\
  <a href='http://www.packtpub.com'>Home</a>\n<a href='http://www.packtpub.com/books'>Books</a>\n\
  </body>\n</html>\"\"\"\nsoup  = BeautifulSoup(html_atag,'lxml')\natag  = soup.a\n\
  print(atag)\n```\n\n之前的脚本将打印文档中的第一个 <a> 标签。我们可以看到 type(atag) 是 'bs4.element.Tag'。\n\
  \nHTML/XML 标签具有名称（例如，标签 <a> 的名称是 a，标签 <p> 是 p）和属性（例如，class、id 和 style）。Tag 对象允许我们获取与每个\
  \ HTML 标签关联的名称和属性。\n\n### Tag 对象的名称\n\nTag 对象的名称可通过 .name 属性访问。\n\n```\ntagname\
  \ = atag.name\nprint tagname\n```\n\n之前的代码打印了对象 atag 的名称，即标签 <a> 的名称。\n\n我们可以通过更改\
  \ .name 属性的值来更改标签的名称。\n\n这在以下示例中显示：\n\n```\natag.name = 'p'\nprint(soup)\n\n#output\n\
  <html><body><p>Test html a tag example</p>\n<p href=\"http://www.packtpub.com\"\
  >Home</p>\n<a href=\"http://www.packtpub.com/books\">Books</a>\n</body></html>\n\
  ```\n\n从输出中，我们可以看到第一个 <a> 标签被替换为 <p> 标签。\n\n### Tag 对象的属性\n\n属性为标签提供含义和上下文。在之前的示例中，href\
  \ 属性为 <a> 标签添加了 URL 信息。在 HTML 页面中，标签可能具有不同的属性，例如 class、id 和 style。标签的属性可以通过将 Tag\
  \ 对象视为字典来访问。\n\n```\natag = soup_atag.a\nprint (atag['href'] )\n\n#output\nhttp://www.packtpub.com\n\
  ```\n\n之前的代码通过访问 href 属性的值，打印出与第一个 `<a>` 标签关联的 URL（`http://www.packtpub.com`）。\n\
  \n可以使用 `.attrs` 属性访问与标签关联的不同属性。\n\n`print(atag.attrs)` 代码行给出 `{'href':'http://www.packtpub.com'}`。\n\
  \n除了名称和属性之外，Tag 对象还有用于在文档中导航和搜索的辅助方法，我们将在以下章节中讨论。\n\n### NavigableString 对象\n\n\
  NavigableString 对象保存 HTML 或 XML 标签内的文本。这是一个具有搜索和导航方法的 Python Unicode 字符串。有时我们可能需要根据当前文本导航到\
  \ HTML/XML 文档中的其他标签或文本。使用普通的 Python Unicode 字符串，搜索和导航方法将无法工作。NavigableString 对象将以\
  \ Unicode 字符串的形式为我们提供标签内的文本，同时提供用于搜索和导航树的各种方法。\n\n我们可以使用 `.string` 获取存储在特定标签内的文本。\n\
  \n```\nfirst_a_string = soup_atag.string\n```\n\n在之前的代码中，创建了 NavigableString 对象（`first_a_string`），它保存了第一个\
  \ `<a>` 标签内的字符串，u'Home'。\n\n### 快速参考\n\n您可以查看以下参考资料，以了解创建以下对象的概览：\n\n- BeautifulSoup\n\
  \  - `soup = BeautifulSoup(string)`\n  - `soup = BeautifulSoup(string,features=\"\
  xml\")`  #for xml\n- Tag\n  - `tag = soup.tag`  #accessing a tag\n  - `tag.name`\
  \        #Tag name\n  - `tag['attribute']`  #Tag attribute\n\n\n\n\n- NavigableString\n\
  \  - `soup.tag.string` # 获取标签的字符串\n\n### 小结\n\n在本章中，我们学习了 Beautiful Soup 模块中的不同对象。我们理解了\
  \ HTML/XML 文档在底层 TreeBuilders 的帮助下如何被转换为 BeautifulSoup 对象。我们还研究了通过传递字符串和文件对象（用于本地文件和\
  \ URL）来创建 BeautifulSoup。同时解释了为 XML 解析创建 BeautifulSoup 以及在构造函数中使用 `features` 参数。我们看到了\
  \ HTML/XML 文档中的不同标签和文本如何被表示为 Beautiful Soup 中的 Tag 和 NavigableString 对象。\n\n在下一章中，我们将学习\
  \ Beautiful Soup 提供的不同搜索方法，例如 `find()`、`find_all()` 和 `find_next()`。借助这些搜索方法，我们将能够从\
  \ HTML/XML 文档中提取数据，这确实是 Beautiful Soup 最强大的功能。\n"
- "## 3 使用 Beautiful Soup 搜索\n\n我们在第二章“创建 BeautifulSoup 对象”中看到了 BeautifulSoup 对象以及其他对象（如\
  \ Tag 和 NavigableString）的创建。HTML/XML 文档被转换为这些对象，以便在文档中轻松搜索和导航。\n\n在本章中，我们将学习 Beautiful\
  \ Soup 提供的不同搜索方法，这些方法可以基于标签名称、标签的属性值、文档中的文本、正则表达式等进行搜索。最后，我们将利用这些搜索方法从一个在线网页中抓取数据。\n\
  \n### 在 Beautiful Soup 中搜索\n\nBeautiful Soup 帮助从网页中抓取信息。有用的信息以文本或不同标签的属性值形式分散在网页中。为了抓取此类页面，有必要根据属性值、标签名称或文档中的文本在整个页面中搜索不同的标签。为方便起见，Beautiful\
  \ Soup 内置了以下搜索方法：\n\n- `find()`\n- `find_all()`\n- `find_parent()`\n- `find_parents()`\n\
  - `find_next_sibling()`\n- `find_next_siblings()`\n- `find_previous_sibling()`\n\
  - `find_previous_siblings()`\n- `find_previous()`\n- `find_all_previous()`\n- `find_next()`\n\
  - `find_all_next()`\n\n### 使用 find() 搜索\n\n在本章中，我们将使用以下 HTML 代码来解释使用 Beautiful Soup\
  \ 进行搜索。我们可以将其保存为 HTML 文件 `ecologicalpyramid.html`，放在上一章创建的 Soup 目录中。\n\n```html\n\
  <html>\n  <body>\n  <div class=\"ecopyramid\">\n    <ul id=\"producers\">\n    \
