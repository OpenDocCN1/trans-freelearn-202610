  \   <div class=\"number\">100000</div>\n      </li>\n      <li class=\"producerlist\"\
  >\n        <div class=\"name\">algae</div>\n        <div class=\"number\">100000</div>\n\
  \      </li>\n    </ul>\n    <ul id=\"primaryconsumers\">\n      <li class=\"primaryconsumerlist\"\
  >\n        <div class=\"name\">deer</div>\n        <div class=\"number\">1000</div>\n\
  \      </li>\n      <li class=\"primaryconsumerlist\">\n        <div class=\"name\"\
  >rabbit</div>\n        <div class=\"number\">2000</div>\n      </li>\n    </ul>\n\
  \    <ul id=\"secondaryconsumers\">\n      <li class=\"secondaryconsumerlist\">\n\
  \        <div class=\"name\">fox</div>\n        <div class=\"number\">100</div>\n\
  \      </li>\n      <li class=\"secondaryconsumerlist\">\n        <div class=\"\
  name\">bear</div>\n        <div class=\"number\">100</div>\n      </li>\n    </ul>\n\
  \    <ul id=\"tertiaryconsumers\">\n      <li class=\"tertiaryconsumerlist\">\n\
  \        <div class=\"name\">lion</div>\n        <div class=\"number\">80</div>\n\
  \      </li>\n      <li class=\"tertiaryconsumerlist\">\n        <div class=\"name\"\
  >tiger</div>\n        <div class=\"number\">50</div>\n      </li>\n    </ul>\n \
  \ </div>\n  </body>\n</html>\n```\n\n上述 HTML 是生态金字塔的简单表示。要查找第一个生产者、初级消费者或次级消费者，我们可以使用\
  \ Beautiful Soup 搜索方法。通常，要查找 BeautifulSoup 对象中任何标签的第一次出现，我们可以使用 `find()` 方法。\n\n\
  ### 查找第一个生产者\n\n对于 HTML 内容的生态金字塔示例，我们可以很容易地识别出生产者位于第一个 `<ul>` 标签内。由于生产者在整个 HTML\
  \ 文档中是 `<ul>` 标签的第一个条目，因此使用 `find()` 方法很容易找到第一个生产者。表示第一个生产者的 HTML 树如下图所示：\n\n![](img/c437561ffd11fadb571896e0a4ca4d18_39_0.png)\n\
  \n现在，我们可以使用以下命令切换到 Soup 目录：\n\n```bash\ncd Soup\n```\n\n我们可以将以下代码保存为 `ecologicalpyramid.py`，并使用\
  \ `python ecologicalpyramid.py` 运行它，或者我们可以在 Python 解释器中运行该代码。使用以下代码，我们将使用 `ecologicalpyramid.html`\
  \ 文件创建一个 BeautifulSoup 对象：\n\n```python\nfrom bs4 import BeautifulSoup\nwith open(\"\
  ecologicalpyramid.html\",\"r\") as ecological_pyramid:\n    soup = BeautifulSoup(ecological_pyramid,\"\
  lxml\")\nproducer_entries = soup.find(\"ul\")\nprint(producer_entries.li.div.string)\n\
  ```\n\n输出：\n\n```\nplants\n```\n\n由于生产者是 `<ul>` 标签的第一个条目，我们可以使用 `find()` 方法，它通常只搜索\
  \ BeautifulSoup 对象中特定标签的第一次出现。我们将其存储在 `producer_entries` 中。下一行打印第一个生产者的名称。从前面的 HTML\
  \ 图中，我们可以理解第一个生产者存储紧跟在第一个 `<ul>` 标签之后的第一个 `<li>` 标签内的第一个 `<div>` 标签中，如下代码所示：\n\n\
  ```html\n<ul id=\"producers\">\n    <li class=\"producerlist\">\n        <div class=\"\
  name\">plants</div>\n        <div class=\"number\">100000</div>\n    </li>\n</ul>\n\
  ```\n\n因此，运行上述代码后，我们将得到 `plants`，即第一个生产者，作为输出。\n\n### 解释 find()\n\n此时，我们知道 `find()`\
  \ 用于搜索 BeautifulSoup 对象中任何项目的第一次出现。`find()` 方法的签名如下：\n\n```text\nfind(name,attrs,recursive,text,**kwargs)\n\
  ```\n\n### 搜索文本\n\n如果我们使用 `find()` 方法传递一个字符串进行搜索，默认情况下它将搜索具有给定名称的标签。但是，如果我们只想搜索\
  \ BeautifulSoup 对象中的文本，我们可以像下面这样使用它：\n\n```python\nsearch_for_stringonly = soup.find(text=\"\
  fox\")\n```\n\n输出：\n\n```\nfox\n```\n\n上述代码将搜索生态金字塔中 `fox` 文本的出现。使用 Beautiful Soup\
  \ 搜索文本是区分大小写的。例如，`case_sensitive_string = soup.find(text=\"Fox\")` 将返回 `None`。\n\
  \n### 基于正则表达式搜索\n\n`find()` 方法可以基于正则表达式进行搜索。当我们有一个没有像前面生产者示例那样规律的 HTML 页面时，这通常会派上用场。\n\
  \n让我们举一个例子：给定一个包含电子邮件 ID 的页面，如下代码所述，要求我们找到第一个电子邮件 ID：\n\n```html\n<br/>\n<div>The\
  \ below HTML has the information that has email ids.</div>\n    abc@example.com\n\
  <div>xyz@example.com</div>\n<span>foo@example.com</span>\n```\n\n这里，电子邮件 ID 分散在页面中，一个在\
  \ `<div>` 标签内，另一个在 `<span>` 标签内，第一个则没有被任何标签包围。在这里很难找到第一个电子邮件 ID。但是如果我们可以使用正则表达式来表示电子邮件\
  \ ID，`find()` 就可以基于该表达式进行搜索，从而获得第一个电子邮件 ID。\n\n因此，在这种情况下，我们只需要为电子邮件 ID 构造正则表达式，并将其传递给\
  \ `find()` 方法。`find()` 方法将使用正则表达式的 `match()` 方法来查找与给定正则表达式的匹配。\n\n让我们使用以下代码找到第一个电子邮件\
  \ ID：\n\n```python\nimport re\nfrom bs4 import BeautifulSoup\nemail_id_example =\
  \ \"\"\"<br/>\n<div>The below HTML has the information that has email ids.</div>\n\
  \    abc@example.com\n```\n\n\n\n\n\n<div>xyz@example.com</div>\n<span>foo@example.com</span>\n\
  \"\"\"\nsoup = BeautifulSoup(email_id_example,\"lxml\")\nemailid_regexp = re.compile(\"\
  \\w+@\\w+\\.\\w+\")\nfirst_email_id = soup.find(text=emailid_regexp)\nprint(first_email_id)\n\
  \n#output\nabc@example.com\n```\n\n在前面的代码中，我们在 emailid_regexp 变量中创建了用于电子邮件 ID 的正则表达式。我们之前使用的模式是\
  \ \\w+@\\w+\\.。\\w+ 符号表示一个或多个字母数字字符，后跟 @，然后再次后跟一个或多个字母数字字符，然后是一个 . 符号，以及一个或多个字母数字字符。这与前面的示例中的电子邮件\
  \ ID 相匹配。然后我们将 emailid_regexp 变量传递给 find() 方法，以查找与前面模式匹配的第一个文本。\n\n### 基于标签属性值的搜索\n\
  \n我们可以使用 find() 基于标签的属性值进行搜索。在之前的生态金字塔示例中，我们可以看到初级消费者位于具有 primaryconsumers ID 的\
  \ <ul> 标签内。在这种情况下，很容易使用 find() 并将参数作为我们要查找的属性值。\n\n### 查找第一个初级消费者\n\n查找生产者是一项简单的任务，因为它是\
  \ <ul> 标签的第一个条目。但第一个初级消费者呢？它不在第一个 <ul> 标签内。通过仔细分析，我们可以看到初级消费者位于第二个具有 id=\"primaryconsumers\"\
  \ 属性的 <ul> 标签内。在这种情况下，我们可以使用 Beautiful Soup 基于属性值进行搜索，假设我们已经创建了 soup 对象。在下面的代码中，我们将具有\
  \ id =\"primaryconsumers\" 属性的标签的第一次出现存储在 primary_consumers 中：\n\n```\nprimary_consumers\
  \ = soup.find(id=\"primaryconsumers\")\nprint(primary_consumers.li.div.string)\n\
  \n#output\ndeer\n```\n\n### 使用 Beautiful Soup 搜索\n\n如果我们分析 HTML，我们可以看到第一个初级消费者存储如下：\n\
  \n```html\n<ul id=\"primaryconsumers\">\n    <li class=\"primaryconsumerlist\">\n\
  \        <div class=\"name\">deer</div>\n        <div class=\"number\">1000</div>\n\
  \    </li>\n</ul>\n```\n\n我们可以看到第一个初级消费者存储在第一个 `<li>` 标签的第一个 `<div>` 标签内。第二行打印存储在此\
  \ `<div>` 标签内的字符串，即第一个初级消费者名称，即 deer。\n\n基于属性值的搜索适用于大多数属性，例如 id、style 和 title。但在以下几种属性的情况下存在一些例外：\n\
  \n- 自定义属性\n- Class\n\n在这些情况下，虽然我们不能直接使用基于属性值-搜索，但我们可以使用可以传递给 find() 方法的 attrs 参数。\n\
  \n### 基于自定义属性的搜索\n\n在 HTML5 中，可以向标签添加自定义属性，例如 data-custom。如果我们想让 Beautiful Soup\
  \ 基于这些属性进行搜索，就不可能像在 id 属性的情况下那样使用它。\n\n对于基于 id 属性的搜索，我们使用了以下代码行：\n\n```python\n\
  soup.find(id=\"primaryconsumer\")\n```\n\n但是，如果我们以相同的方式对以下 HTML 使用属性值，代码将抛出错误，因为关键字不能是表达式：\n\
  \n```python\ncustomattr = \"\"\"<p data-custom=\"custom\">custom attribute\n   \
  \ example</p>\"\"\"\ncustomsoup = BeautifulSoup(customattr,'lxml')\ncustomSoup.find(data-custom=\"\
  custom\")\n```\n\n会抛出错误，因为 Python 变量不能包含 - 字符，而我们传递的 data-custom 变量包含了 - 字符。\n\n\
  在这种情况下，我们需要将关键字参数作为字典传递到 `attrs` 参数中，如下所示：\n\n```\nusing_attrs = customsoup.find(attrs={'data-custom':'custom'})\n\
  print(using_attrs)\n\n#output\n'<p data-custom=\"custom\">custom attribute example</p>'\n\
  ```\n\n### 基于 CSS 类的搜索\n\n`class` 参数是 Python 中的保留关键字，因此我们将无法使用关键字参数 `class`。因此在\
  \ CSS 类的情况下，我们也可以使用与自定义属性相同的方法，如以下代码所示：\n\n```\ncss_class = soup.find(attrs={'class':'primaryconsumerlist'})\n\
  print(css_class)\n\n#output\n<li class=\"primaryconsumerlist\">\n    <div class=\"\
  name\">deer</div>\n    <div class=\"number\">1000</div>\n</li>\n```\n\n由于基于 `class`\
  \ 的搜索是很常见的，Beautiful Soup 有一个特殊的关键字参数可以传递以匹配 CSS 类。我们可以使用的是 `class_`，并且由于这不是 Python\
  \ 中的保留关键字，因此不会抛出错误。\n\n第 1 行：\n\n```\ncss_class = soup.find(class_ = \"primaryconsumers\"\
  \ )\n```\n\n第 2 行：\n\n```\ncss_class = soup.find(attrs={'class':'primaryconsumers'})\n\
  ```\n\n前两行代码相同。\n\n### 使用定义的函数搜索\n\n我们可以将函数传递给 `find()` 方法，以便根据函数内定义的条件进行搜索。函数应返回\
  \ true 或 false 值。由函数定义的相应标签将被 BeautifulSoup 对象找到。\n\n让我们以使用 find() 方法中的函数查找次级消费者为例：\n\
  \n```\ndef is_secondary_consumers(tag):\n    return tag.has_attr('id') and tag.get('id')\
  \ ==\n        'secondaryconsumers'\n```\n\n该函数检查标签是否具有 id 属性以及其值是否为 secondaryconsumers。如果满足两个条件，函数将返回\
  \ true，因此我们在以下代码中将获得我们正在寻找的特定标签：\n\n```\nsecondary_consumer = soup.find(is_secondary_consumers)\n\
  print(secondary_consumer.li.div.string)\n\n#output\nfox\n```\n\n我们使用 find() 方法传递返回\
  \ true 或 false 的函数，因此返回 true 的标签将被显示，在我们的例子中，对应于第一个次级消费者。\n\n### 组合应用搜索方法\n\n我们看到了如何基于文本、标签、属性值、正则表达式等进行搜索。Beautiful\
  \ Soup 还帮助我们基于这些方法的任意组合进行搜索。\n\n在前面的示例中，我们讨论了基于属性值的搜索。由于属性值只存在于一种类型的标签上，因此很容易，例如在\
  \ id='secondaryconsumers' 中，值只存在于 <ul> 标签上。\n\n但是，如果有多个标签具有相同的属性值怎么办？例如，参考以下代码：\n\
  \n```\n<p class=\"identical\">\n    Example of p tag with class identical\n</p>\n\
  <div class=\"identical\">\n    Example of div tag with class identical\n</div>\n\
  ```\n\n这里，我们有一个 div 标签和一个 p 标签，其 class 属性值相同，都是 \"identical\"。在这种情况下，如果我们只想搜索 class\
  \ 属性值 = identical 的 div 标签，我们可以结合使用标签和属性值搜索在 find() 方法中使用。\n\n让我们看看如何基于前面的组合进行搜索：\n\
  \n```\nidentical_div= soup.find(\"div\",'class_='identical')\nprint(identical_div)\n\
  \n#output\n<div class=\"identical\">\n    Example of div tag with class identical\n\
  </div>\n```\n\n同样，我们可以有搜索方法的任何组合。\n\n### 使用 find_all() 搜索\n\nfind() 方法用于在应用于 BeautifulSoup\
  \ 对象的特定搜索条件内找到第一个结果。顾名思义，find_all() 将为我们提供与我们定义的搜索条件匹配的所有项目。我们在 find() 中看到的不同过滤器可以在\
  \ find_all() 方法中使用。事实上，这些过滤器可以在任何搜索方法中使用，例如 find_parents() 和 find_siblings()。\n\n\
  让我们考虑一个使用 find_all() 的示例。\n\n### 查找所有三级消费者\n\n我们看到了如何找到第一个和第二个初级消费者。如果我们需要找到所有三级消费者，就不能使用\
  \ find()。在这种情况下，find_all() 会很有用。\n\n```\nall_tertiaryconsumers =\n    soup.find_all(class_=\"\
  tertiaryconsumerslist\")\n```\n\n前面的代码行查找所有具有 = \"tertiaryconsumerlist\" 类的标签。如果对该变量进行类型检查，我们可以看到它只不过是一个标签对象的列表，如下所示：\n\
  \n```\nprint(type(all_tertiaryconsumers))\n\n#output\n<class 'list'>\n```\n\n我们可以通过使用以下代码遍历此列表来显示所有三级消费者名称：\n\
  \n```\nfor tertiaryconsumer in all_tertiaryconsumers:\n    print(tertiaryconsumer.div.string)\n\
  ```\n\n\n### 使用 Beautiful Soup 进行搜索\n\n```\n```text\n#output\nlion\ntiger\n```\n\
  ```\n\n### 了解 find_all() 使用的参数\n\n与 `find()` 类似，`find_all()` 方法也有一组相似的参数，并额外增加了一个参数\
  \ `limit`，如下代码行所示：\n\n```\n```python\nfind_all(name,attrs,recursive,text,limit,**kwargs)\n\
  ```\n```\n\n`limit` 参数用于指定我们获取的结果数量上限。例如，从我们看到的电子邮件 ID 示例中，我们可以使用 `find_all()` 获取所有电子邮件\
  \ ID。请参考以下代码：\n\n```\n```python\nemail_ids = soup.find_all(text=emailid_regexp)\n\
  print(email_ids)\n\n#output\n[u'abc@example.com',u'xyz@example.com',u'foo@example.com']\n\
  ```\n```\n\n这里，如果我们传入 `limit`，它会将结果集限制为我们设定的上限，如以下示例所示：\n\n```\n```python\nemail_ids_limited\
  \ = soup.find_all(text=emailid_regexp,limit=2)\nprint(email_ids_limited)\n\n#output\n\
  [u'abc@example.com',u'xyz@example.com']\n```\n```\n\n从输出中可以看出，结果被限制为两个。\n\n> > \U0001F4A1\
  \ `find()` 方法相当于 `find_all()` 且 `limit=1`。\n\n我们可以向查找方法传递 True 或 False 值。如果向 `find_all()`\
  \ 传递 True，它将返回 soup 对象中的所有标签。对于 `find()` 来说，它将是对象内的第一个标签。`print(soup.find_all(True))`\
  \ 代码行将打印出与 soup 对象关联的所有标签。\n\n在搜索文本时，传递 True 将返回文档中的所有文本，如下所示：\n\n```\nall_texts\
  \ = soup.find_all(text=True)\nprint(all_texts)\n\n#output\n[u'\\n', u'\\n', u'\\\
  n', u'\\n', u'\\n', u'plants', u'\\n', u'100000',\n    u'\\n', u'\\n', u'\\n', u'algae',\
  \ u'\\n', u'100000', u'\\n', u'\\n',\n    u'\\n', u'\\n', u'\\n', u'deer', u'\\\
  n', u'1000', u'\\n', u'\\n',\n    u'\\n', u'rabbit', u'\\n', u'2000', u'\\n', u'\\\
  n', u'\\n',\n    u'\\n', u'\\n', u'fox', u'\\n', u'100', u'\\n', u'\\n', u'\\n',\
  \ u'\\n',\n    u'bear', u'\\n', u'100', u'\\n', u'\\n', u'\\n', u'\\n', u'\\n',\n\
  \    u'\\n', u'lion', u'\\n', u'80', u'\\n', u'\\n', u'\\n',\n    u'tiger', u'\\\
  n', u'50', u'\\n', u'\\n', u'\\n', u'\\n',\n    u'\\n']\n```\n\n前面的输出打印了 soup 对象内的所有文本内容，包括换行符。\n\
  \n此外，在文本的情况下，我们可以传递一个字符串列表，find_all() 将查找列表中定义的每个字符串：\n\n```\nall_texts_in_list\
  \ = soup.find_all(text=[\"plants\",\"algae\"])\nprint(all_texts_in_list)\n\n#output\n\
  [u'plants', u'algae']\n```\n\n在搜索标签、标签属性值、自定义属性和 css 类时也是如此。\n\n要查找所有 div 和 li 标签，我们可以使用以下代码行：\n\
  \n```\ndiv_li_tags = soup.find_all([\"div\",\"li\"])\n```\n\n同样，要查找具有 producerlist\
  \ 和 primaryconsumerlist 类的标签，我们可以使用以下代码行：\n\n```\nall_css_class =\n    soup.find_all(class_=[\"\
  producerlist\",\"primaryconsumerlist\"])\n```\n\n`find()` 和 `find_all()` 都搜索对象的后代（即在树中在其之后出现的所有子节点）、它们的子节点，等等。我们可以通过使用\
  \ recursive 参数来控制此行为。如果 recursive = False，搜索仅在对象的直接子节点上进行。\n\n例如，在以下代码中，搜索仅在 div\
  \ 和 li 标签的直接子节点处进行。由于 soup 对象的直接子节点是 html，以下代码将给出一个空列表：\n\n```\ndiv_li_tags = soup.find_all([\"\
  div\",\"li\"],recursive=False)\nprint(div_li_tags)\n\n#output\n[]\n```\n\n如果 find_all()\
  \ 找不到结果，它将返回一个空列表，而 find() 返回 None。\n\n### 按关系搜索标签\n\n使用 find() 和 find_all() 方法在\
  \ HTML 页面中搜索内容很容易。在复杂的网络抓取项目中，用户很容易访问后续标签或父标签以获取额外信息。\n\n我们打算访问的这些标签将与我们已搜索的标签直接相关。例如，我们可能需要找到特定标签的直接父标签。也有情况需要找到前一个标签、下一个标签、同级标签等。在这些情况下，BeautifulSoup\
  \ 对象提供了搜索方法，例如 find_parents()、find_next_siblings() 等。通常，我们使用这些方法后跟 find() 或 find_all()\
  \ 方法，因为这些方法用于查找特定标签，而我们有兴趣查找与该标签相关的其他标签。\n\n### 搜索父标签\n\n我们可以通过使用 find_parents()\
  \ 或 find_parent() 方法找到与标签关联的父标签。同样，find_all() 和 find() 仅在返回结果数量上有所不同。find_parents()\
  \ 方法返回所有匹配的父标签，而 find_parent() 返回第一个直接父标签。我们在 find() 中讨论的搜索方法可用于 find_parent() 和\
  \ find_parents()。\n\n在初级消费者示例中，我们可以按如下方式找到与 primaryconsumer 关联的直接父标签：\n\n```\nprimaryconsumers\
  \ = soup.find_all(class_=\"primaryconsumerlist\")\nprimaryconsumer = primaryconsumers[0]\n\
  parent_ul = primaryconsumer.find_parents('ul')\nprint(parent_ul)\n```\n\n```\n#output\n\
  <ul id=\"primaryconsumers\">\n\n    <li class=\"primaryconsumerlist\">\n\n     \
  \   <div class=\"name\">deer</div>\n\n        <div class=\"number\">1000</div>\n\
  \n    </li>\n\n    <li class=\"primaryconsumerlist\">\n\n        <div class=\"name\"\
  >rabbit</div>\n\n        <div class=\"number\">2000</div>\n\n    </li>\n\n</ul>\n\
  ```\n\n第一行将把所有初级消费者存储在 primaryconsumers 变量中。我们取第一个条目并将其存储在 primaryconsumer 中。我们试图找到\
  \ <ul> 标签，它们是我们在 primaryconsumer 列表中找到的父标签。从前面的输出中，我们可以理解结果将包含父级的整个结构，这也将包括我们为其找到父级的标签。我们可以使用\
  \ find_parent() 方法找到标签的直接父级。\n\n```\nparent_p = primaryconsumer.find_parent(\"p\"\
  )\n```\n\n前面的代码将搜索第一个 <p> 标签，它是生态金字塔示例中具有 primaryconsumerlist 类的 <li> 标签的直接父级。\n\
  \n获取特定标签的直接父标签的一种简便方法是使用不带任何参数的 find_parent() 方法，如下所示：\n\n```\nimmediateprimary_consumer_parent\
  \ = primary_consumer.find_parent()\n```\n\n结果将与 primary_consumer.find_parent('ul')\
  \ 相同，因为 ul 是直接父标签。\n\n### 搜索同级标签\n\n在特定的 html 文档中，如果标签处于同一级别，我们可以说这些标签是同级标签。例如，在生态金字塔中，所有\
  \ <ul> 标签都在同一级别，如果我们定义关系，它们就是同级。我们可以从以下图表中理解这一点，该图表表示第一个 div 标签与 ul 标签之间的关系：\n\n\
  ![](img/c437561ffd11fadb571896e0a4ca4d18_52_0.png)\n\n这意味着在我们的示例中，具有 classes producers、primaryconsumers、secondaryconsumers\
  \ 和 teritiaryconsumers 的 ul 标签是同级。\n\n此外，在以下生产者的图表中，我们可以看到 plants 值，即第一个生产者，和 algae，即第二个生产者，不能被视为同级，因为它们不在同一级别：\n\
  \n![](img/c437561ffd11fadb571896e0a4ca4d18_52_1.png)\n\n但是，具有值 plants 的 div 和值为\
  \ 10000 的数字可以被视为同级，因为它们处于同一级别。\n\nBeautiful Soup 提供了帮助我们查找同级的方法。\n\n`find_next_siblings()`\
  \ 方法允许查找下一个同级，而 `find_next_sibling()` 允许查找下一个同级。在以下示例中，我们可以找出 producers 的同级：\n\n\
  ```\nproducers= soup.find(id='producers')\nnext_siblings = producers.find_next_siblings()\n\
  print(next_siblings)\n\n#output\n[<ul id=\"primaryconsumers\">\n\n    <li class=\"\
  primaryconsumerlist\">\n\n        <div class=\"name\">deer</div>\n\n        <div\
  \ class=\"number\">1000</div>\n\n    </li>\n\n    <li class=\"primaryconsumerlist\"\
  >\n\n        <div class=\"name\">rabbit</div>\n\n        <div class=\"number\">2000</div>\n\
  \n    </li>\n\n</ul>, <ul id=\"secondaryconsumers\">\n\n    <li class=\"secondaryconsumerlist\"\
  >\n\n        <div class=\"name\">fox</div>\n\n        <div class=\"number\">100</div>\n\
  \n    </li>\n\n    <li class=\"secondaryconsumerlist\">\n\n        <div class=\"\
  name\">bear</div>\n```\n\n\n\n\n\n```html\n<div class=\"number\">100</div>\n\n</li>\n\
  \n</ul>\n<ul id=\"tertiaryconsumers\">\n\n<li class=\"tertiaryconsumerlist\">\n\n\
  <div class=\"name\">lion</div>\n\n<div class=\"number\">80</div>\n\n</li>\n\n<li\
  \ class=\"tertiaryconsumerlist\">\n\n<div class=\"name\">tiger</div>\n\n<div class=\"\
  number\">50</div>\n\n</li>\n\n</ul>\n```\n\n所以，我们找到生产者的下一个兄弟节点，它们是初级消费者、次级消费者和三级消费者。\n\
  \n我们可以使用 `find_previous_siblings()` 和 `find_previous_sibling()` 分别查找之前的兄弟节点和之前的兄弟节点。\n\
  \n与其他查找方法一样，我们可以为这些方法传递不同的过滤器，例如文本、正则表达式、属性值和标签名，以便相应地查找兄弟节点。\n\n### 搜索下一个\n\n对于每个标签，都存在一个下一个元素，它可以是可导航字符串、Tag\
  \ 对象或任何其他 BeautifulSoup 对象。 所谓下一个元素，是指在当前元素之后立即解析的元素。 这与兄弟节点不同。 我们有方法可以为特定 Tag 对象查找下一个对象。\
  \ `find_all_next()` 方法有助于找到标签之后出现的所有对象，而 `find_next()` 找到在 Tag 对象之后出现的第一个对象。 在此方法中，我们也可以像在\
  \ `find()` 中一样使用不同的搜索方法。\n\n例如，我们可以使用以下代码找到第一个 `div` 标签之后出现的所有 `li` 标签：\n\n```python\n\
  first_div = soup.div\nall_li_tags = first_div.find_all_next(\"li\")\n\n#output\n\
  [<li class=\"producerlist\">\n    <div class=\"name\">plants</div>\n    <div class=\"\
  number\">100000</div>\n</li>, <li class=\"producerlist\">\n    <div class=\"name\"\
  >algae</div>\n    <div class=\"number\">100000</div>\n</li>, <li class=\"primaryconsumerlist\"\
  >\n    <div class=\"name\">deer</div>\n    <div class=\"number\">1000</div>\n</li>,\
  \ <li class=\"primaryconsumerlist\">\n    <div class=\"name\">rabbit</div>\n   \
  \ <div class=\"number\">2000</div>\n</li>, <li class=\"secondaryconsumerlist\">\n\
  \    <div class=\"name\">fox</div>\n    <div class=\"number\">100</div>\n</li>,\
  \ <li class=\"secondaryconsumerlist\">\n    <div class=\"name\">bear</div>\n   \
  \ <div class=\"number\">100</div>\n</li>, <li class=\"tertiaryconsumerlist\">\n\
  \    <div class=\"name\">lion</div>\n    <div class=\"number\">80</div>\n</li>,\
  \ <li class=\"tertiaryconsumerlist\">\n    <div class=\"name\">tiger</div>\n   \
  \ <div class=\"number\">50</div>\n</li>]\n```\n\n### 搜索上一个\n\n搜索上一个是下一个的相反情况，我们可以在特定对象关联的上下文中找到上一个对象。\
  \ 我们可以使用 `find_all_previous()` 方法找到与当前对象关联的所有上一个对象，并使用 `find_previous()` 找到与当前对象关联的上一个对象。\n\
  \n### 使用搜索方法从网页抓取信息\n\n在 *第 2 章，创建 BeautifulSoup 对象* 中，我们讨论了获取 Packt Publishing\
  \ 出版的所有书籍的信息，这些书籍可在链接 `http://www.packtpub.com/books` 获取。 在以下练习中，我们将使用 Beautiful\
  \ Soup 搜索方法抓取前述 URL 的所有书籍。 我们将从前述 URL 抓取书籍名称、出版日期和价格。\n\n此练习的第一步是分析 HTML 文档并理解其逻辑结构。\
  \ 这将帮助我们理解所需信息如何在 HTML 文档中存储。\n\n我们可以使用 Google Chrome 开发者工具来理解页面的逻辑结构。 让我们通过执行以下步骤来完成此操作：\n\
  \n1. 在 Google Chrome 浏览器中打开页面。\n2. 右键单击它并选择 **Inspect Element** 选项。\n3. 现在，我们可以在页面底部看到\
  \ **Developer tools** 窗口。\n\n在 Google Chrome 开发者工具下，前述 URL 的内容将如下所示，针对特定书籍标题：\n\n\
  ![](img/c437561ffd11fadb571896e0a4ca4d18_56_0.png)\n\n前述屏幕截图是在撰写本书时前述 URL 的表示。 由于这是一个在线页面，数据将定期更新。\n\
  \n我们可以看到每个书籍标题都存储在具有 `class=\"field-content\"` 的 `<span>` 标签下。 如果仔细观察，我们可以看到出版日期信息和价格信息也存储在具有相同\
  \ `class=\"field-content\"` 的类似 `<span>` 标签内。 为了唯一标识前述数据，我们不能仅取 `<span>` 标签，因为三条信息都存储在具有相同类的\
  \ `<span>` 标签下。 因此，更好地识别每个信息唯一包含的另一个标签。 在这种情况下，我们可以看到对应于书籍标题的 `<span>` 标签存储在具有 `class=\"\
  views-field-title\"` 的 `<div>` 标签内。 同样，对于出版日期信息，对应的 `<span>` 标签存储在具有 `class=\"views-field-field-date-of-publication-value\"\
  ` 的 `<div>` 标签内。 同样，价格的 `<span>` 标签存储在具有 `class=\"views-field-sell-price\"` 的 `<div>`\
  \ 标签内。 从网页源代码中，我们可以看到结构如下，并且支持我们之前的发现：\n\n```html\n<div class=\"views-field-title\"\
  >\n    <span class=\"field-content\">\n        <a href=\"/angularjs-web-application-development/book\"\
  >\n            Mastering Web Application Development with AngularJS</a>\n    </span>\n\
  </div>\n<div class=\"views-field-field-date-of-publication-value\">\n    <span class=\"\
  field-content\">Published: August 2013</span>\n</div>\n<div class=\"views-field-sell-price\"\
  >\n    <label class=\"views-label-sell-price\">\n        Our price:\n    </label>\n\
  \    <span class=\"field-content\">\n        1,386.00</span>\n</div>\n```\n\n4.\
  \ 要找到对应标题的价格，我们应该搜索下一个具有 `class=\"views-field-sell-price\"` 的 `<div>` 标签。 从逻辑结构中，我们可以看到对于出版日期，我们也应该获取\
  \ `<span>` 标签内的字符串。\n\n我们可以对页面内的所有标题应用前述解析策略。 下一步是将此转换为脚本，以便我们从页面获取与书籍标题相关的所有信息。\n\
  \n我们将首先根据上一章的示例，通过以下方式基于网页创建 `BeautifulSoup` 对象：\n\n```python\nimport urllib2\n\
  from bs4 import BeautifulSoup\nurl = \"http://www.packtpub.com/books\"\npage = urllib2.urlopen(url)\n\
  soup_packtpage = BeautifulSoup(page)\npage.close()\n```\n\n首先，我们将搜索具有 `class=\"\
  views-view-grid\"` 的表格，如下所示：\n\n```python\nall_books_table = soup_packtpage.find(\"\
  table\", class_=\"views-view-grid\")\n```\n\n然后，我们将在此表格标签内搜索所有具有 `views-field-title`\
  \ 类的 `div` 标签，如下所示：\n\n```python\nall_book_titles = all_books_table.find_all(\"\
  div\", class_=\"views-field-title\")\n```\n\n作为下一步，我们将遍历这些标签对象，它们代表书籍标题，并为每个标题找到出版日期和价格，如下所示：\n\
  \n```python\nfor book_title in all_book_titles:\n    book_title_span = book_title.span\n\
  \    print(\"Title Name is :\"+book_title_span.a.string)\n    published_date = book_title.find_next(\"\
  div\", class_=\"views-field-field-date-of-publication-value\")\n    print(\"Published\
  \ Date is :\"+published_date.span.string)\n    price = book_title.find_next(\"div\"\
  , class_=\"views-field-sell-price\")\n    print(\"Price is :\"+price.span.string)\n\
  \n#output\nTitle Name is :Mastering Web Application Development with AngularJS\n\
  ```\n\n### 快速参考\n\n在这里，我们将看到 Beautiful Soup 中的以下搜索方法：\n\n- `find()`: 此函数用于查找第一次出现\n\
  - `find('p')`: 此函数用于查找标签的第一次出现\n- `find(text=\"newtext\")`: 此函数用于查找文本的第一次出现\n- `find(attrs={'id':'value'})`:\
  \ 此函数用于根据属性值查找属性的第一次出现\n- `find(class_='value')`: 此函数用于查找具有 CSS 类值的第一次出现\n- `find_all()`:\
  \ 此函数用于根据过滤条件查找所有出现\n- `find_parent()`: 此函数用于在父标签中查找第一次出现\n- `find_parents()`: 此函数用于在父标签中查找所有出现\n\
  - `find_sibling()`: 此函数用于在兄弟标签中查找第一次出现\n- `find_siblings()`: 此函数用于在兄弟标签中查找所有出现\n\
  - `find_next()`: 此函数用于查找在当前标签之后立即解析的标签的第一次出现\n- `find_all_next()`: 此函数用于查找在当前标签之后立即解析的所有标签的出现\n\
  - `find_previous()`: 此函数用于查找在当前标签之前立即解析的标签的第一次出现\n- `find_all_previous()`: 此函数用于查找在当前标签之前立即解析的所有标签的出现\n\
  \n\n\n\n\n### 摘要\n\n在本章中，我们处理了 Beautiful Soup 中的各种搜索方法，例如 `find()`、`find_all()`\
  \ 和 `find_next()`。这些方法可用的不同参数也通过示例代码进行了说明。本章还讨论了搜索方法的不同过滤器的组合以及在关系中查找标签。我们还研究了形成逻辑结构和解析策略，以便使用不同的搜索方法从在线网页中查找与书籍标题相关的所有信息。\n\
  \n在下一章中，我们将学习 Beautiful Soup 中的不同导航方法。\n"
- "## 4 使用 Beautiful Soup 进行导航\n使用\nBeautiful Soup 进行导航\n\n在第 3 章《使用 Beautiful Soup\
  \ 搜索》中，我们看到了如何应用搜索方法在 HTML 文档中搜索标签、文本等。Beautiful Soup 做的远不止搜索。Beautiful Soup 还可用于在\
  \ HTML/XML 文档中导航。Beautiful Soup 提供了有助于导航的属性。我们可以使用搜索方法找到相同的信息直到某个级别，但在某些情况下由于页面的结构，我们必须结合搜索和导航机制才能获得所需的结果。在这些情况下，导航技术非常有用。在本章中，我们将详细了解使用\
  \ Beautiful Soup 进行导航。\n\n### 使用 Beautiful Soup 进行导航\n\nBeautiful Soup 中的导航几乎与搜索方法相同。在导航中，代替方法，有某些属性促进导航。正如我们在第\
  \ 2 章《创建 BeautifulSoup 对象》中已经看到的，Beautiful Soup 使用不同的 TreeBuilder 来构建 HTML/XML 树。因此，每个\
  \ Tag 或 NavigableString 对象都将是 resulting 树的成员，BeautifulSoup 对象位于顶部，其他对象作为树的节点。\n\n\
  以下代码片段是 HTML 树的示例：\n\n```\nhtml_markup = \"\"\"<div class=\"ecopyramid\">\n    <ul\
  \ id=\"producers\">\n        <li class=\"producerlist\">\n            <div class=\"\
  name\">plants</div>\n            <div class=\"number\">100000</div>\n        </li>\n\
  \    </ul>\n</div>\"\"\"\n```\n\n```\n<li class=\"producerlist\">\n    <div class=\"\
  name\">algae</div>\n    <div class=\"number\">100000</div>\n</li>\n</ul>\n</div>\"\
  \"\n```\n\n对于之前的代码片段，形成了以下 HTML 树：\n\n![](img/c437561ffd11fadb571896e0a4ca4d18_64_0.png)\n\
  \n在前一幅图中，我们可以看到 Beautiful Soup 是树的根，Tag 对象构成树的各个节点，而 NavigableString 对象构成树的叶子。\n\
  \nBeautiful Soup 中的导航旨在帮助我们访问此 HTML/XML 树的节点。从特定节点，可以：\n\n- 向下导航到子节点\n- 向上导航到父节点\n\
  - 横向导航到兄弟节点\n- 导航到解析的下一个和上一个对象\n\n我们将使用之前的 html_markup 作为示例来讨论使用 Beautiful Soup\
  \ 的不同导航。\n\n### 向下导航\n\n任何具有子节点的对象，例如 Tag 或 BeautifulSoup，都可以使用此导航。向下导航可以通过两种方式实现。\n\
  \n### 使用子标签的名称\n\nBeautifulSoup 或 Tag 对象可以使用子标签的名称导航到它。即使有多个同名子节点，此方法也只会导航到第一个实例。例如，我们可以考虑生态金字塔示例中讨论的\
  \ BeautifulSoup 对象。\n\n```\nsoup = BeautifulSoup(html_markup,\"lxml\")\nproducer_entries\
  \ = soup.ul\nprint(producer_entries)\n```\n\n在之前的代码中，通过使用 soup.ul，我们导航到 soup 对象子节点中的第一个\
  \ ul 标签的条目。\n\n这也可以通过以下代码对 Tag 对象执行：\n\n```\nfirst_producer = producer_entries.li\n\
  print(first_producer)\n```\n\n```\n#output\n<li class=\"producerlist\">\n<div class=\"\
  name\">plants</div>\n<div class=\"number\">100000</div>\n</li>\n```\n\n之前的代码对标签对象\
  \ producer_entries 使用了导航，以找到 <li> 标签的第一个条目。我们可以从输出中验证这一点。但这不能用于 NavigableString\
  \ 对象，因为它没有任何子节点。\n\n```\nproducer_name = first_producer.div.string\n```\n\n这里我们将\
  \ NavigableString plants 存储在 producer_name 中。从 producer_name 向下导航将导致错误。\n\n```\n\
  producer_name.li\n```\n\n这将抛出以下 AttributeError，因为 NavigableString 不能有任何子对象：\n\n\
  ```\nAttributeError: 'NavigableString' object has no attribute 'li'\n```\n\n###\
  \ 使用预定义属性\n\nBeautiful Soup 将子节点存储在预定义属性中。有两种类型的子节点。\n\n- **直接子节点**：这些在 HTML 树中紧跟在节点之后。例如，在下图中，**html**\
  \ 是 **BeautifulSoup** 的直接子节点。\n\n![](img/c437561ffd11fadb571896e0a4ca4d18_66_0.png)\n\
  \n- **后代**：这些包含特定节点的全部子节点，包括直接子节点。例如，在下面的图像中，我们可以看到 **BeautifulSoup** 的直接子节点和后代。\n\
  \n![](img/c437561ffd11fadb571896e0a4ca4d18_66_1.png)\n\n后代包括 Beautiful Soup 下的所有标签。\n\
  \n基于之前的分类，有以下不同的属性用于导航到子节点：\n\n- `.contents`\n- `.children`\n- `.descendants`\n\n\
  这些属性将存在于所有 Tag 对象和 BeautifulSoup 对象中，以促进对子节点的导航。\n\n### .contents 属性\n\nTag 对象或\
  \ BeautifulSoup 对象的子节点以列表形式存储在属性 `.contents` 中。\n\n```\n```python\nprint(type(soup.contents))\n\
  #output\n<class 'list'>\n```\n```\n\n从输出中，我们知道类型是一个列表，其中保存子节点。在这种情况下，BeautifulSoup\
  \ 对象的子节点数量可以从以下代码片段中了解：\n\n```\n```python\nprint len(soup.contents)\n\n#output\n\
  1\n```\n```\n\n我们也可以在 `.contents` 上使用 Python 中的任何类型的列表导航。例如，我们可以使用以下代码打印所有子节点的名称：\n\
  \n```\n```python\nfor tag in soup.contents:\n    print(tag.name)\n\n#output\nhtml\n\
  ```\n```\n\n现在让我们在 Tag 对象 producer_entries 的情况下使用以下代码片段查看：\n\n```\n```python\nfor\
  \ child in producer_entries.contents:\n    print(child)\n#output\n<li class=\"producerlist\"\
  >\n    <div class=\"name\">plants</div>\n    <div class=\"number\">100000</div>\n\
  ```\n```\n\n```\n</li>\n<li class=\"producerlist\">\n    <div class=\"name\">algae</div>\n\
  \    <div class=\"number\">100000</div>\n```\n\n### .children 属性\n\n.children 属性几乎与\
  \ .contents 属性相同。但它不像 .contents 那样是列表，而是 Python 生成器，我们可以迭代它以获取每个子节点。\n\n```\nprint\
  \ type(soup.children)\n\n#output\n<class 'list_generator'>\n```\n\n我们可以迭代 BeautifulSoup\
  \ 对象的 .children，并像以下示例代码那样获取子节点：\n\n```\nfor tag in soup.children:\n    print(tag.name)\n\
  \n#output\nhtml\n```\n\n### .descendants 属性\n\n.contents 和 .children 属性只考虑直接子节点，即\
  \ soup.contents 或 soup.children 只返回根 HTML 标签。\n\n使用 .descendants 可以导航到特定对象的所有子节点。\n\
  \n```\nprint(len(list(soup.descendants)))\n#output\n13\n```\n\n从输出中，我们可以看到 .descendants\
  \ 给出 13，而 .contents 或 .children 只给出 1。\n\n现在让我们打印此情况下的所有后代。\n\n```\nfrom bs4.element\
  \ import NavigableString\nfor tag in soup.descendants:\n    if isinstance(tag, NavigableString):\n\
  \        print(tag)\n    else:\n        print(tag.name)\n```\n\n```\n```text\n#output\n\
  html\nbody\np\nul\nli\ndiv\nplants\ndiv\n100000\nli\ndiv\nalgae\ndiv\n100000\n```\n\
  ```\n\n这里我们正在迭代 soup 对象的全部后代。由于 `NavigableString` 没有 `.name` 属性，我们正在检查它并在之前的代码中打印字符串本身。但对于\
  \ Tag 对象，我们只打印 `.name` 属性。\n\n使用 `.contents` 或 `.children` 时的代码输出与此完全不同。\n\n###\
  \ 用于向下导航的特殊属性\n\n获取特定标签内的文本数据是 scraping 中的常见用例。Beautiful Soup 提供了特殊属性来使用属性 `.string`\
  \ 和 `.strings` 导航到每个 Tag 对象中包含的字符串。\n\n### .string 属性\n\n如果标签只有 `NavigableString`\
  \ 作为唯一子节点，或者如果它有另一个标签，该标签的子节点是 `NavigableString` 对象，我们可以使用 `.string` 属性导航到 `NavigableString`。正如我们所知，`NavigableString`\
  \ 表示存储在标签内的文本；使用 `.string`，我们导航到存储在标签内的文本。\n\n```\n```python\nfirst_producer = soup.div\n\
  print(first_producer.string)\n\n#output\nplants\n```\n```\n\n\n### .strings 属性\n\
  \n即使存在由字符串和其他标签组成的多个子对象，我们仍然可以使用 `.strings` 生成器获取每个子对象的字符串。在之前的示例中，我们有 `<li>` 标签，其下有两个\
  \ `<div>` 标签作为子元素。这些 `<div>` 标签包含字符串。我们可以使用 `.strings` 生成器从父级 `<li>` 标签获取这些字符串，如下所示：\n\
  \n```\nfor string in li.strings:\n    print(string)\n#output\nplants\n10000\n```\n\
  \n### 向上导航\n\n与向下导航查找子元素类似，Beautiful Soup 允许用户查找特定 Tag/NavigableString 对象的父级。向上导航使用\
  \ `.parent` 和 `.parents`。\n\n### .parent 属性\n\n从第一幅图可知，所有 Tag 和 NavigableString\
  \ 对象都有父级。特定 Tag 对象的父级可通过属性 `.parent` 找到。\n\n```\nproducer_entries = soup.ul\nprint(producer_entries.parent)\n\
  \n#output\ndiv\n```\n\n最顶层 `<html>`/`<xml>` 标签的 `.parent` 属性是 BeautifulSoup 对象本身。\n\
  \n```\nhtml_tag = soup.html\nprint(html_tag.parent.name)\n\n#output\nu' [document]\
  \ '\n```\n\n由于 soup 对象位于树的根部，它没有父级。因此对 soup 对象使用 `.parent` 将返回 None。\n\n```\nprint(soup.parent)\n\
  \n#output\nNone\n```\n\n### `.parents` 属性\n\n`.parents` 属性是一个生成器，包含特定 Tag/`NavigableString`\
  \ 的父级。\n\n```\nthird_div = soup.find_all(\"div\")[2]\n```\n\n在之前的代码中，我们将第三个 `<div>`\
  \ 条目，即 `<div class=\"name\">algae</div>` 存储在 `third_div` 中。\n\n利用它我们可以遍历该标签的父级。\n\
  \n```\nfor parent in third_div.parents:\n    print(parent.name)\n#output\n\nli\n\
  ul\nbody\nhtml\n[document]\n```\n\n在之前的代码中，我们导航到 `<li>` 标签，它是 `third_div` 的直接父对象，然后导航到\
  \ `<li>` 标签的父级 `<ul>` 标签。同样地，导航到 html 标签，最后到 `[document]`，它代表 soup 对象。\n\n### 横向导航到兄弟节点\n\
  \n除了在 HTML 树中上下导航内容外，Beautiful Soup 还提供了查找对象兄弟节点的方法。导航到兄弟节点可使用 `.next_sibling` 和\
  \ `.previous_sibling`。\n\n### .next_sibling 属性\n\n在生产者列表中，我们可以使用以下代码片段获取第一个生产者 plants\
  \ 的兄弟节点：\n\n```\nsoup = BeautifulSoup(html_markup)\nfirst_producer = soup.find(\"\
  li\")\nsecond_producer = first_producer.next_sibling\nsecond_producer_name = second_producer.div.string\n\
  print(second_producer_name)\n\n#output\nu'algae'\n```\n\n这里 second_producer 是通过从\
  \ first_producer 导航到下一个兄弟节点得到的，first_producer 代表页面内的第一个 <li> 标签。\n\n### .previous_sibling\
  \ 属性\n\n`.previous_sibling` 属性用于导航到上一个兄弟节点。为在前一个示例中查找上一个兄弟节点，我们可以使用以下代码片段：\n\n```\n\
  print(second_producer.previous_sibling)\n\n#output\n<li class=\"producerlist\"><div\
  \ class=\"name\">plants</div><div class=\"number\">100000</div></li>\n```\n\n如果一个标签没有上一个兄弟节点，它将返回\
  \ None，即 print(first_producer.previous_sibling) 将给出我们 None，因为该标签没有上一个兄弟节点。\n\n我们有\
  \ next_siblings 和 previous_siblings 生成器来遍历从特定对象开始的下一个和上一个兄弟节点。\n\n```\nfor previous_sibling\
  \ in second_producer.previous_siblings:\n    print(previous_sibling.name)\n```\n\
  \n前面的代码片段只会给出 <li> 标签，它是唯一的上一个兄弟节点。同样的方法可用于 next_siblings 以查找对象之后出现的兄弟节点。\n\n###\
  \ 导航到解析的前一个和后一个对象\n\n我们看到了导航到子节点、兄弟节点和父节点的不同方法。有时我们可能需要导航到与标签没有直接关系的对象，例如子节点、兄弟节点或父节点。因此，为了找到解析后紧跟当前对象的元素，可以使用\
  \ .next_element。\n\n例如，解析在第一个 <li> 标签之后立即出现的元素是 <div> 标签。\n\n```\nfirst_producer\
  \ = soup.li\nprint(first_producer.next_element)\n\n#output\n<div class=\"name\"\
  >plants</div>\n```\n\n前面的代码打印出下一个元素，即 <div class=\"name\">plants</div>。\n\n> .next_element\
  \ 和 .next_sibling 完全不同。 .next_element 指向解析后紧跟当前对象的对象，而 .next_sibling 指向树中同一层级的对象。\n\
  \n同样，`.previous_element` 可用于查找特定标签或字符串之前立即解析的元素。\n\n```\nsecond_div = soup.find_all(\"\
  div\")[1]\nprint(second_div.previous_element)\n\n#output\nplants\n```\n\n从输出可以看出，在第二个\
  \ <div> 标签之前立即解析的是字符串 plants。\n\n### 快速参考\n\n以下命令可帮助您向下导航树：\n\n- tag.name: 这使用名称导航到子节点\n\
  - tag.contents: 这列出子节点\n- tag.children: 这是子节点的生成器\n- `tag.descendants`: 这是后代的生成器\n\
  - `tag.string`: 这使用 `.string` 导航到字符串\n- `tag.strings`: 这是字符串的生成器\n\n以下命令可帮助您向上导航树：\n\
  \n- `tag.parent`: 这导航到父级\n- `tag.parents`: 这是父级的生成器\n\n以下命令可帮助您横向导航：\n\n- `tag.next_sibling`:\
  \ 这导航到下一个兄弟节点\n- `tag.next_siblings`: 这是下一个兄弟节点的生成器\n- `tag.previous_sibling`: 这导航到上一个兄弟节点\n\
  - `tag.previous_siblings`: 这是上一个兄弟节点的生成器\n\n以下命令可帮助您导航到前一个或下一个元素：\n\n- `tag.next_element`:\
  \ 这导航到解析的下一个元素\n- `tag.previous_element`: 这导航到解析的前一个元素\n\n### 总结\n\n在本章中，我们讨论了 Beautiful\
  \ Soup 中的各种导航技术。我们讨论了四种导航方式，即向上、向下、横向导航，以及使用示例导航到下一个和前一个元素。\n\n在下一章中，我们将学习通过添加新内容，例如标签、字符串、修改标签和删除现有内容等，以不同方式修改解析后的\
  \ HTML 树。\n"
- "## 5 使用 Beautiful Soup 修改内容\n### 使用 Beautiful Soup 修改内容\n\nBeautiful Soup 可有效用于在\
  \ HTML/XML 文档中搜索或导航。除此之外，我们还可以使用 Beautiful Soup 来更改 HTML/XML 文档的内容。修改内容意味着添加或删除新标签、更改标签名、修改标签属性值、更改文本内容等。这在需要解析\
  \ HTML/XML 文档、更改其结构并将其写回为修改后的 HTML/XML 文档的情况下很有用。\n\n考虑一种情况，我们有一个包含 <table> 标签的\
  \ HTML 文档，其中包含约 1,000 行或更多行（<tr> 标签），每行现有两列（<td> 标签）。我们希望为每一行添加一组新的两个 <td> 标签。手动为每个\
  \ <tr> 标签添加这些 <td> 标签是不合适的。在这种情况下，我们可以使用 Beautiful Soup 搜索和/或导航每个 <tr> 标签以添加这些 <td>\
  \ 标签。然后我们可以将这些更改保存为新的 HTML 文档，该文档将为每个 <tr> 标签包含四个 <td> 标签。本章通过考虑我们在前几章中使用的生态金字塔示例，介绍使用\
  \ Beautiful Soup 修改内容的各种方法。\n\n### 使用 Beautiful Soup 修改标签\n\nBeautiful Soup 具有完全更改\
  \ HTML/XML 标签不同属性的能力。我们知道 Beautiful Soup 中的每个标签都表示为 Tag 对象，并且可以执行以下任务：\n\n- 修改 Tag\
  \ 的 name 属性\n- 修改 Tag 的属性值\n- 添加新标签\n\n\n\n\n\n- 删除现有标签\n- 修改字符串内容\n\n### 修改 Tag\
  \ 的 name 属性\n\nBeautiful Soup 的 Tag 对象始终与一个 .name 属性相关联；例如 a、div 等。修改 .name 属性的新值将按如下方式修改\
  \ HTML 标签：\n\n```python\nhtml_markup = \"\"\"<div class=\"ecopyramid\">\n<ul id=\"\
  producers\">\n    <li class=\"producerlist\">\n        <div class=\"name\">plants</div>\n\
  \        <div class=\"number\">100000</div>\n    </li>\n    <li class=\"producerlist\"\
  >\n        <div class=\"name\">algae</div>\n        <div class=\"number\">100000</div>\n\
  \    </li>\n</ul>\"\"\"\n\nsoup = BeautifulSoup(html_markup, \"lxml\")\nproducer_entries\
  \ = soup.ul\nprint(producer_entries.name)\n\n#output\n'ul'\n```\n\n从前面的输出中，我们可以看到\
  \ producer_entries 的名称是 ul；我们可以通过修改 .name 属性轻松更改它。\n\nHTML 树的表示在以下图表中给出：\n\n![](img/c437561ffd11fadb571896e0a4ca4d18_77_0.png)\n\
  \n让我们将值修改为 div，如以下代码所示：\n\n```python\nproducer_entries.name = \"div\"\nprint(producer_entries.prettify())\n\
  \n#output\n<html>\n  <body>\n    <div class=\"ecopyramid\">\n      <div id=\"producers\"\
  >\n        <li class=\"producerlist\">\n          <div class=\"name\">\n       \
  \     plants\n          </div>\n          <div class=\"number\">\n            100000\n\
  \          </div>\n        </li>\n        <li class=\"producerlist\">\n        \
  \  <div class=\"name\">\n            algae\n          </div>\n          <div class=\"\
  number\">\n            100000\n          </div>\n        </li>\n      </div>\n \
  \   </div>\n  </body>\n</html>\n```\n\n这也导致 HTML 树发生变化，如以下图表所示：\n\n![](img/c437561ffd11fadb571896e0a4ca4d18_78_0.png)\n\
  \n我们可以使用 prettify() 方法来显示格式化的输出，如前面的代码所示。正如我们所见，更改 Tag 对象的 name 属性也会更改 HTML 树。因此，在重命名标签时应谨慎，因为它可能导致格式错误的\
  \ HTML 标签。\n\n### 修改 Tag 的属性值\n\nBeautiful Soup 还可用于修改与标签关联的属性值，例如 class、id 和 style。由于属性以字典形式存储，因此与处理普通的\
  \ Python 字典一样简单。\n\n### 更新 Tag 的现有属性值\n\n在之前的生态金字塔示例中，ul 标签具有 id 属性，其值为 producers。我们可以按如下方式将其更改为\
  \ producers_new_value：\n\n```python\nproducer_entries['id'] = \"producers_new_value\"\
  \n```\n\n现在，如果我们打印 `producer_entries` 对象，我们可以看到更改已生效，如下所示：\n\n```python\nprint(producer_entries.prettify())\n\
  \n#output\n<div id=\"producers_new_value\">\n    <li class=\"producerlist\">\n \
  \       <div class=\"name\">\n            plants\n        </div>\n        <div class=\"\
  number\">\n            100000\n        </div>\n    </li>\n    <li class=\"producerlist\"\
  >\n        <div class=\"name\">\n            algae\n        </div>\n        <div\
  \ class=\"number\">\n            100000\n        </div>\n    </li>\n</div>\n```\n\
  \n### 向 Tag 添加新的属性值\n\n我们可以向 Tag 对象添加新属性。在前面的示例中，ul 标签没有 class 属性。我们可以按如下方式添加它：\n\
  \n```python\nproducer_entries['class'] = 'newclass'\n```\n\n前面的代码将在属性不存在时添加新属性，或在\
  \ HTML 树中已存在该属性时更新属性值。\n\n```python\nprint(producer_entries.prettify())\n#output\n\
  <div class=\"newclass\" id=\"producers_new_value\">\n    <li class=\"producerlist\"\
  >\n        <div class=\"name\">\n            plants\n        </div>\n        <div\
  \ class=\"number\">\n            100000\n        </div>\n    </li>\n    <li class=\"\
  producerlist\">\n        <div class=\"name\">\n            algae\n        </div>\n\
  \        <div class=\"number\">\n            100000\n        </div>\n    </li>\n\
  </div>\n```\n\n### 添加新标签\n\n我们已经看到了更改 Tag 对象的 .name 属性以及修改 Tag 属性的几种不同方法。Beautiful\
  \ Soup 还允许我们向现有 HTML/XML 文档添加新标签。new_tag() 方法在 soup 对象内创建新标签。然后我们可以使用 append()、insert()、insert_after()\
  \ 或 insert_before() 方法将这些标签添加到树中。\n\n### 使用 new_tag() 和 append() 添加新的生产者\n\n在我们的生态金字塔示例中，我们已经有\
  \ plants 和 algae 作为生产者。让我们再向 HTML 中添加一个生产者，例如 phytoplankton。如果我们分析 HTML，可以看到我们需要先向父\
  \ ul 标签添加一个 li 标签。为此，我们需要先创建 li 标签。\n\n### 使用 new_tag() 创建新标签\n\nBeautiful Soup\
  \ 的 new_tag() 方法将帮助我们创建新标签。new_tag() 方法只能在 BeautifulSoup 对象上调用。因此，这里我们需要创建一个新标签\
  \ li，并带有 producerlist 类。为此，请参考以下代码：\n\n```python\nsoup = BeautifulSoup(html_markup,\
  \ \"lxml\")\nnew_li_tag = soup.new_tag(\"li\")\n```\n\n前面的代码将创建新的 li 标签并将其存储在 new_li_tag\
  \ 变量中。new_tag() 方法只需要标签名作为必需参数。我们可以传递属性值或其他属性作为可选参数。也就是说，我们可以有以下代码：\n\n```python\n\
  new_a_tag = soup.new_tag(\"a\", href=\"www.example.com\")\n```\n\n在前面的示例中，我们通过给出名称以及\
  \ href 属性及其值创建了 <a> 标签。\n\n也可以使用以下代码向之前创建的 li 标签添加新属性值：\n\n```python\nnew_li_tag.attrs\
  \ = {'class': 'producerlist'}\n```\n\n### 使用 append() 添加新标签\n\n我们已经创建了 li 标签，但需要将其固定到正确的位置。Beautiful\
  \ Soup 允许我们使用 append() 方法将标签添加到另一个标签或 soup 对象。append() 方法将新创建的标签添加到 .contents 的末尾。这可以像在\
  \ Python 列表中调用 append() 方法一样调用，如下所示：\n\n```python\nproducer_entries = soup.ul\n\
  producer_entries.append(new_li_tag)\n```\n\n前面的代码将新创建的 li 标签附加到 ul 标签的 .contents。因此，li\
  \ 标签现在将成为 ul 标签的子级。ul 标签结构将如下所示：\n\n```python\nprint(producer_entries.prettify())\n\
  \n#output\n<ul id=\"producers\">\n    <li class=\"producerlist\">\n        <div\
  \ class=\"name\">\n            plants\n        </div>\n        <div class=\"number\"\
  >\n            100000\n        </div>\n    </li>\n    <li class=\"producerlist\"\
  >\n        <div class=\"name\">\n            algae\n        </div>\n        <div\
  \ class=\"number\">\n            100000\n        </div>\n    </li>\n    <li class=\"\
  producerlist\">\n    </li>\n</ul>\n```\n\n从前面的输出中，我们可以看到新创建的 li 标签已作为 ul 的新子级添加。现在，我们必须向此\
  \ li 标签中添加两个 div 标签。\n\n### 使用 insert() 向 li 标签添加新的 div 标签\n\n与 append() 类似，insert()\
  \ 方法也可以用于向 HTML 树中添加新标签。正如我们所知，append() 将新创建的标签添加到 .contents 的末尾。但 insert() 另一方面，并不插入到\
  \ .contents 的末尾；相反，我们需要指定要插入标签的位置。这与 Python 中的列表 insert() 操作相同。请参考以下代码：\n\n```python\n\
  new_div_name_tag = soup.new_tag(\"div\")\nnew_div_name_tag[\"class\"] = \"name\"\
  \nnew_div_number_tag = soup.new_tag(\"div\")\nnew_div_number_tag[\"class\"] = \"\
  number\"\n```\n\n前面的代码行将创建两个新的 div 标签，并带有相应的 class 属性，如下所示：\n\n```python\nnew_li_tag.insert(0,\
  \ new_div_name_tag)\nnew_li_tag.insert(1, new_div_number_tag)\nprint(new_li_tag.prettify())\n\
  \n#output\n<li class=\"producerlist\">\n  <div class=\"name\">\n  </div>\n  <div\
  \ class=\"number\">\n  </div>\n</li>\n```\n\n现在，我们可以看到新标签已插入到 li 标签中。但这些标签中缺少相应的字符串。\n\
  \n### 修改字符串内容\n\n在前面的示例中，我们向 HTML 树添加了两个 div 标签，但没有内容。我们需要在 div 标签的 name 属性中添加相应的字符串，也需要在\
  \ div 标签的 number 属性中添加字符串。这也可以通过多种方式使用 Beautiful Soup 来完成。\n\n\n\n\n\n### 使用 .string\
  \ 修改字符串内容\n\n我们可以使用标签的 `.string` 属性来修改字符串内容。因此，我们可以使用以下代码添加或修改字符串值：\n\n```python\n\
  new_div_name_tag.string=\"phytoplankton\"\nprint(producer_entries.prettify())\n\
  ```\n\n输出：\n\n```html\n<ul id=\"producers\">\n    <li class=\"producerlist\">\n\
  \        <div class=\"name\">\n            plants\n        </div>\n        <div\
  \ class=\"number\">\n            100000\n        </div>\n    </li>\n    <li class=\"\
  producerlist\">\n        <div class=\"name\">\n            algae\n        </div>\n\
  \        <div class=\"number\">\n            100000\n        </div>\n    </li>\n\
  \    <li class=\"producerlist\">\n        <div class=\"name\">\n            phytoplankton\n\
  \        </div>\n        <div class=\"number\">\n        </div>\n    </li>\n</ul>\n\
  ```\n\n我们可以看到，在前面的代码示例中，字符串已经被添加。\n\n### 使用 .append()、insert() 和 new_string() 添加字符串\n\
  \n我们可以使用 `.append()` 或 `.insert()` 方法向现有标签添加更多字符串。它们的行为与添加新标签时相同。对于字符串内容，`append()`\
  \ 方法会追加到 `.string` 的末尾，而 `insert()` 方法则会将字符串插入到 `.string` 的特定位置。例如，我们可以使用以下代码向 `div`\
  \ 标签的 name 属性添加一个新字符串：\n\n```python\nnew_div_name_tag.append(\"producer\")\nprint(soup.prettify())\n\
  ```\n\n输出：\n\n```html\n<html>\n  <body>\n    <div class=\"ecopyramid\">\n      <ul\
  \ id=\"producers\">\n        <li class=\"producerlist\">\n          <div class=\"\
  name\">\n            plants\n          </div>\n          <div class=\"number\">\n\
  \            100000\n          </div>\n        </li>\n        <li class=\"producerlist\"\
  >\n          <div class=\"name\">\n            algae\n          </div>\n       \
  \   <div class=\"number\">\n            100000\n          </div>\n        </li>\n\
  \        <li class=\"producerlist\">\n          <div class=\"name\">\n         \
  \   phytoplankton\n            producer\n          </div>\n          <div class=\"\
  number\">\n          </div>\n        </li>\n      </ul>\n    </div>\n  </body>\n\
  </html>\n```\n\n还有另一种方法，`new_string()`，它可以帮助创建新字符串，如下所示：\n\n```python\nnew_string_toappend\
  \ = soup.new_string(\"producer\")\nnew_div_name_tag.append(new_string_toappend)\n\
  ```\n\n前面的代码会创建新字符串，现在我们可以使用 `append()` 或 `insert()` 将新创建的字符串添加到树中。\n\n与 `append()`\
  \ 类似，我们也可以使用 `insert()` 来插入字符串，如下所示：\n\n```python\nnew_string_toinsert = soup.new_string(\"\
  10000\")\nnew_div_number_tag.insert(0, new_string_toinsert)\n```\n\n添加了 producer\
  \ 之后的树将如下所示：\n\n```html\n<html>\n    <body>\n        <div class=\"ecopyramid\">\n\
  \            <ul id=\"producers\">\n                <li class=\"producerlist\">\n\
  \                    <div class=\"name\">\n                        plants\n    \
  \                </div>\n                    <div class=\"number\">\n          \
  \              100000\n                    </div>\n                </li>\n     \
  \           <li class=\"producerlist\">\n                    <div class=\"name\"\
  >\n                        algae\n                    </div>\n                 \
  \   <div class=\"number\">\n                        100000\n                   \
  \ </div>\n                </li>\n                <li class=\"producerlist\">\n \
  \                   <div class=\"name\">\n                        phytoplankton\n\
  \                        producer\n                    </div>\n                \
  \    <div class=\"number\">\n                        10000\n                   \
  \ </div>\n                </li>\n            </ul>\n        </div>\n    </body>\n\
  </html>\n```\n\n### 从 HTML 文档中删除标签\n\nBeautiful Soup 也允许从文档中移除标签。这可以通过 `decompose()`\
  \ 和 `extract()` 方法实现。\n\n### 使用 decompose() 删除 producer\n\n我们添加了一个新的 producer，即\
  \ phytoplankton。\n\n我们可以通过先移除 `div` 标签，然后再从 `ul` 标签中移除 `li` 标签来删除这个 producer 条目。我们将使用\
  \ `decompose()` 方法移除 `class=\"name\"` 的 `div` 标签。\n\n```python\nthird_producer =\
  \ soup.find_all(\"li\")[2]\ndiv_name = third_producer.div\ndiv_name.decompose()\n\
  print(third_producer.prettify())\n```\n\n输出：\n\n```html\n<li class=\"producerlist\"\
  >\n  <div class=\"number\">\n    10000\n  </div>\n</li>\n```\n\n在前面的代码中，我们使用了 `find_all()`\
  \ 来查找所有的 `li` 条目，并将第三个 producer 存储到 `third_producer` 变量中。然后，我们找到了第一个 `div` 标签，并使用\
  \ `decompose()` 方法将其移除。\n\n> `decompose()` 方法用于从 HTML/XML 文档中移除标签。它会移除该标签及其子节点。\n\
  \n同样，我们也可以移除 `class=\"number\"` 的 `div` 标签。参考以下代码：\n\n```python\nthird_producer\
  \ = soup.find_all(\"li\")[2]\ndiv_number= third_producer.div\ndiv_number.decompose()\n\
  print(third_producer.prettify())\n```\n\n输出：\n\n```html\n<li class=\"producerlist\"\
  >\n</li>\n```\n\n### 使用 extract() 删除 producer\n\n我们已经使用 `decompose()` 方法从 `li` 标签中移除了两个\
  \ `div` 标签。但是仅移除 `div` 标签本身并不能保证第三个 producer 被删除；为此，我们还需要移除 `li` 标签。我们也可以使用 `decompose()`\
  \ 方法来完成。不过，Beautiful Soup 还有另一种有助于移除标签的方法。\n\n`extract()` 方法用于从 HTML 树中移除一个标签或字符串。此外，它还会返回被移除的标签或字符串的句柄。与\
  \ `decompose()` 不同，`extract()` 也可以用于字符串。如下所示：\n\n```python\nthird_producer_removed=third_producer.extract()\n\
  print(soup.prettify())\n```\n\n输出：\n\n```html\n<html>\n<body>\n    <div class=\"\
  ecopyramid\">\n        <ul id=\"producers\">\n            <li class=\"producerlist\"\
  >\n                <div class=\"name\">\n                    plants\n          \
  \      </div>\n                <div class=\"number\">\n                    100000\n\
  \                </div>\n            </li>\n            <li class=\"producerlist\"\
  >\n                <div class=\"name\">\n                    algae\n           \
  \     </div>\n                <div class=\"number\">\n                    100000\n\
  \                </div>\n            </li>\n        </ul>\n    </div>\n</body>\n\
  </html>\n```\n\n执行前面的代码后，我们可以看到，第三个 producer（即 phytoplankton）已从生态金字塔示例中移除。\n\n###\
  \ 使用 Beautiful Soup 删除标签的内容\n\n标签的子节点可以是 `NavigableString` 对象，也可以是 `Tag` 对象。可以使用\
  \ `clear()` 来删除这些子对象。\n\n例如，我们可以使用 `clear()` 方法从 `li` 标签中移除包含 plants 的 `<div>` 标签以及对应的带有\
  \ class number 的 `<div>` 标签；如下所示：\n\n```python\nli_plants=soup.li\n```\n\n由于这是第一个\
  \ `li` 标签，我们可以通过名称来选择它；如下所示：\n\n```python\nli_plants.clear()\n```\n\n这将移除标签的所有 `.contents`。因此，`clear()`\
  \ 会移除特定标签内的所有字符串和子节点。如下所示：\n\n```python\nprint(li_name)\n```\n\n输出：\n\n```html\n\
  <li class=\"producerlist\"></li>\n```\n\n```html\n<div class=\"number\">\n    100000\n\
  </div>\n</li>\n</ul>\n</div>\n</body>\n</html>\n```\n\n在这里，我们创建了一个新的 `div` 标签，并将字符串\
  \ `soil` 追加到其中。我们使用 `insert_after()` 方法将标签插入到正确的位置。同样，我们可以使用 `insert_before()` 在树中的其他内容之前插入一个\
  \ `Tag` 或 `NavigableString` 对象。\n\n- `replace_with()` 方法：\n\n`replace_with()` 方法用于在文档中将一个标签或字符串替换为新的标签或字符串。`replace_with()`\
  \ 方法接受一个标签或字符串对象作为输入。例如，我们可以使用 `replace_with()` 方法将第一个 producer 的字符串更改为 phytoplankton。`replace_with()`\
  \ 方法会返回被替换的标签或字符串。\n\n```python\nsoup = BeautifulSoup(html_markup,\"lxml\")\ndiv_name\
  \ =soup.div\ndiv_name.string.replace_with(\"phytoplankton\")\nprint(soup.prettify())\n\
  ```\n\n输出：\n\n```html\n<html>\n    <body>\n        <div class=\"ecopyramid\">\n\
  \            <ul id=\"producers\">\n                <li class=\"producerlist\">\n\
  \                    <div class=\"name\">\n                        phytoplankton\n\
  \                    </div>\n                    <div class=\"number\">\n      \
  \                  100000\n                    </div>\n                    <div\
  \ class=\"ecosystem\">\n                        soil\n                    </div>\n\
  \                </li>\n```\n\n\n\n```html\n<li class=\"producerlist\">\n    <div\
  \ class=\"name\">\n        algae\n    </div>\n    <div class=\"number\">\n     \
  \   100000\n    </div>\n</li>\n</ul>\n</div>\n</body>\n</html>\n```\n\n`replace_with()`\
  \ 方法也可以用来完全替换一个标签。\n\n### `wrap()` 和 `unwrap()` 方法\n\n`wrap()` 方法用于用我们传入的另一个标签包裹一个标签或字符串。例如，我们可以用下面的示例中的另一个\
  \ `<div>` 标签包裹 `li` 标签中的全部内容：\n\n```python\nli_tags = soup.find_all(\"li\")\nfor\
  \ li in li_tags:\n    new_divtag = soup.new_tag(\"div\")\n    li.wrap(new_divtag)\n\
  print(soup.prettify())\n#output\n<html>\n<body>\n    <div class=\"ecopyramid\">\n\
  \        <ul id=\"producers\">\n            <div>\n                <li class=\"\
  producerlist\">\n                    <div class=\"name\">\n                    \
  \    phytoplankton\n                    </div>\n                    <div class=\"\
  number\">\n                        100000\n                    </div>\n        \
  \            <div class=\"ecosystem\">\n                        soil\n         \
  \           </div>\n                </li>\n            </div>\n            <div>\n\
  \                <li class=\"producerlist\">\n                    <div class=\"\
  name\">\n                        algae\n                    </div>\n           \
  \         <div class=\"number\">\n                        100000\n             \
  \       </div>\n                </li>\n            </div>\n        </ul>\n    </div>\n\
  </body>\n</html>\n```\n\n从前面的输出可以看出，我们用另一个 `div` 标签包裹了 `li` 标签。\n\n`unwrap()` 方法与\
  \ `wrap()` 相反，用于按如下方式解包内容：\n\n```python\nsoup = BeautifulSoup(html_markup,\"lxml\"\
  )\nli_tags = soup.find_all(\"li\")\nfor li in li_tags:\n    li.div.unwrap()\nprint(soup.prettify())\n\
  #output\n<html>\n<body>\n    <div class=\"ecopyramid\">\n        <ul id=\"producers\"\
  >\n            <li class=\"producerlist\">\n                plants\n           \
  \     <div class=\"number\">\n                    100000\n                </div>\n\
  \                <div class=\"ecosystem\">\n                    soil\n         \
  \       </div>\n            </li>\n        </div>\n        <div>\n            <li\
  \ class=\"producerlist\">\n                algae\n                <div class=\"\
  number\">\n                    100000\n                </div>\n            </li>\n\
  \        </div>\n    </ul>\n</div>\n</body>\n</html>\n```\n\n这里，第一个 `div` 标签将被解包，即\
  \ `class=\"name\"` 的 `div` 标签。\n\n> `unwrap()` 方法与 `replace_with()` 类似，会返回被替换的标签。\n\
  \n### 快速参考\n\n- 修改标签名：\n  以下代码行修改 name 属性：\n  - `tag.name = \"newvalue\"`: 此行代码将\
  \ Tag 名称修改为 newvalue\n- 修改标签属性：\n  以下代码行更改属性：\n  - `tag[\"attr\"] = \"newvalue\"\
  `: 此行代码修改 Tag 属性\n  - `del tag[\"attr\"]`: 此行代码删除 Tag 属性\n- 添加新标签：\n  以下代码行对应内容的添加：\n\
  \  - `newtag = soup.new_tag('tagname')`: 此行代码创建 newtag\n  - `oldtag.append(newtag)`:\
  \ 此行代码将 newtag 追加到 oldtag.contents\n  - `oldtag.insert(0,newtag)`: 此行代码将 newtag\
  \ 插入到 oldtag.contents 的索引 0 处\n- 修改字符串内容：\n  以下代码行用于修改字符串内容：\n  - `tag.string =\
  \ \"helloworld\"`: 此行代码修改 `tag.string`\n  - `tag.append(\"helloworld\")`: 此行代码将\
  \ \"helloworld\" 追加到现有的 `tag.string`\n  - `newstring = soup.new_string(\"helloworld\"\
  )`: 此行代码创建一个新的 `NavigableString` 对象\n  - `tag.insert(0,newstring)`: 此行代码将 `newstring`\
  \ 插入到 `tag.string` 的索引 `0` 处\n- 删除现有标签：\n  以下代码行有助于删除现有标签属性：\n  - `tag.decompose()`:\
  \ 此行代码移除标签及其子节点\n  - `tag.extract()`: 此行代码移除并返回标签或字符串\n  - `tag.clear()`: 此行代码移除子节点\n\
  - 特殊函数：\n  以下为用于添加或更改标签的特殊函数：\n  - `oldtag.insert_after(newtag)`: 此函数在 `oldtag`\
  \ 之后插入 `newtag`\n  - `oldtag.insert_before(newtag)`: 此函数在 `oldtag` 之前插入 `newtag`\n\
  \  - `oldtag.replace_with(newtag)`: 此函数用 `newtag` 替换 `oldtag`\n  - `oldtag.wrap(newtag)`:\
  \ 此函数用 `newtag` 包裹 `oldtag`\n  - `oldtag.unwrap(newtag)`: 此函数解包 `oldtag` 内的 `newtag`\n"
- "## 6 Beautiful Soup 中的编码支持\n\n所有网页都会有一个关联的编码。现代网站有不同的编码，如 UTF-8 和 Latin-1。如今，UTF-8\
  \ 是网站使用的编码标准。因此，在抓取此类页面时，抓取器也必须能够理解这些编码。否则，用户会在网页浏览器中看到某些字符，而使用抓取器获得的结果将是乱码字符。例如，考虑来自\
  \ Wikipedia 的一个示例网页内容，我们可以看到西班牙语字符 ñ。\n\n### 字母表\n\n西班牙语使用西班牙字母书写，它是拉丁字母加上一个额外的字母\
  \ ñ，共计 27 个字母。\n\n| Letter | A | B | C | D | E | F | G | H | I | J | K | L | M |\
  \ N | Ñ | O | P | Q | R | S | T | U | V | W | X | Y | Z |\n| --- | --- | --- | ---\
  \ | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | ---\
  \ | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- |\n| Name |\
  \ a | be, be larga, be alta | ce | de | e | efe | ge | hache | i | jota | ka | ele\
  \ | eme | ene | eñe | o | pe | cu | erre | ese | te | u | ve, uve, ve corta, ve\
  \ baja | uve doble, doble ve, doble uve | equis | i griega, ye | zeta |\n| IPA |\
  \ /a/ | /b/ | /k/, /θ/ | /d/ | /e/ | /f/ | /g/, /x/ | silent | /i/ | /x/ | /k/ |\
  \ /l/ | /m/ | /n/ | /ɲ/ | /o/ | /p/ | /k/ | /r/, /ɾ/ | /s/ | /t/ | /u/ | /b/ | /ɡw/,\
  \ /β/ | /ks/, /ɣ/, /s/ | /ʝ/, /ʎ/ | /θ/ |\n\n如果我们将相同的内容通过不支持网站之前使用的编码的抓取器运行，我们可能会得到以下内容：\n\
  \n```\nThe Spanish language is written using the Spanish alphabet, which\nis the\
  \ Latin alphabet with one additional letter,\ne&#21336;e (&#21336;), for a total\
  \ of 27 letters.\n```\n\n我们看到西班牙语字符 ñ 被乱码字符替换。因此，抓取器必须支持不同的编码。Beautiful Soup 处理这些编码非常简洁。在本章中，我们将看到\
  \ Beautiful Soup 中的编码支持。\n\n### Beautiful Soup 中的编码\n\n如前所述，每个 HTML/XML 文档都将以特定的字符集编码编写，例如\
  \ UTF-8 和 Latin-1。在 HTML 页面中，这使用 meta 标签表示，如以下示例所示：\n\n```\n<meta http-equiv=\"\
  Content-Type\" content=\"text/html;charset=UTF-8\">\n```\n\nBeautiful Soup 使用 UnicodeDammit\
  \ 库自动检测文档的编码。Beautiful Soup 在从文档创建 soup 对象时将内容转换为 Unicode。\n\n> Unicode 是一个字符集，即具有唯一数字的字符列表。例如，在\
  \ Unicode 字符集中，字符 B 的数字为 42。UTF-8 编码是一种用于将这些数字转换为二进制表示的算法。\n\n在前面的示例中，Beautiful\
  \ Soup 将文档转换为 Unicode。\n\n```\nhtml_markup = \"\"\"<p> The Spanish language is written\
  \ using the\nSpanish alphabet, which is the Latin alphabet with one\nadditional\
  \ letter, eñe (ñ), for a total of 27 letters.</p>\n\"\"\"\n\nsoup = BeautifulSoup(html_markup,\"\
  lxml\")\nprint(soup.p.string)\n\n#output\nThe Spanish language is written using\
  \ the Spanish alphabet, which\nis the Latin alphabet with one additional letter,\
  \ eñe (ñ), for\na total of 27 letters.\n```\n\n从之前的输出可以看出，额外字母部分（e単e (単)）存在差异，因为实际表示的地方出现了乱码字符。这是由于\
  \ UnicodeDammit 对文档原始编码的错误解释造成的。\n\n### 了解 HTML 文档的原始编码\n\n之前的 HTML 内容原本是 UTF-8\
  \ 编码。但 Beautiful Soup 在生成 soup 对象时使用 UnicodeDammit 库检测编码，我们可以通过 `original_encoding`\
  \ 属性获取此原始编码。\n\n`soup.original_encoding` 将给出原始编码，在前一种情况下为 `euc-jp`。这是错误的，因为 UnicodeDammit\
  \ 将编码检测为 `euc-jp` 而非 `utf-8`。\n\n### 指定 HTML 文档的编码\n\nUnicodeDammit 库在仔细搜索整个文档后检测编码。这耗时且在某些情况下\
  \ UnicodeDammit 库会错误地检测编码，如前所述。这种错误猜测大多发生在内容非常短且编码之间存在相似性的情况下。如果我们事先知道 HTML 文档的编码，我们可以避免这种情况。我们可以将编码传递给\
  \ BeautifulSoup 构造函数，从而避免不必要的耗时和错误猜测。编码作为 `from_encoding` 参数指定在构造函数的一部分中。因此，在前一种情况下，我们可以将编码指定为\
  \ `utf-8`。\n\n```\nsoup = BeautifulSoup(html_markup,\"lxml\",from_encoding=\"utf-8\"\
  )\nprint(soup.prettify())\n```\n\n```\n#output\n<html>\n  <body>\n    <p>\n    \
  \  The Spanish language is written using the Spanish alphabet,\n      which is the\
  \ Latin alphabet with one additional letter,\n      eñe (ñ), for a total of 27 letters.\n\
  \    </p>\n  </body>\n</html>\n```\n\n\n\n不再有乱码字符，因为我们已经指定了正确的编码，并且可以从输出中验证这一点。\n\
  \n我们传递的编码应该是正确的，否则字符编码会错误；例如，如果我们在前面的 HTML 片段中将编码传递为 latin-1，结果会不同。\n\n```\nsoup\
  \ = BeautifulSoup(html_markup,\"lxml\",from_encoding=\"latin-1\")\nprint(soup.prettify())\n\
  \n#output\n'The Spanish language is written using the Spanish alphabet, which\n\
  \  is the Latin alphabet with one additional letter, eñe (ñ), for\na total of 27\
  \ letters.\n```\n\n因此，最好只有在确定文档使用的编码时才传递编码。\n\n### 输出编码\n\nBeautiful Soup 对输出文本也提供编码支持。Beautiful\
  \ Soup 中存在某些输出方法，例如 prettify()，它只会以 UTF-8 编码给出输出。即使编码是不同的东西，比如 ISO 8859-2，输出仍为 UTF-8。例如，以下\
  \ HTML 内容是 ISO8859-2 编码的示例：\n\n```\nhtml_markup = \"\"\"\n<html>\n  <meta http-equiv=\"\
  Content-Type\"\n    content=\"text/html;charset=ISO8859-2\"/>\n  <p>cédille (from\
  \ French), is a hook or tail ( ž )  added under\n    certain letters as a diacritical\
  \ mark to modify their\n    pronunciation\n  </p>\"\"\"\nsoup = BeautifulSoup(html_markup,\"\
  lxml\")\n```\n\nsoup.original_encoding 将会给出 ISO8859-2 的编码，这对于前面的 HTML 代码片段是正确的。但\
  \ print (soup.prettify()) 将会以 utf-8 给出输出。\n\n```\n<html>\n  <head>\n    <meta content=\"\
  text/html;charset=utf-8\" http-equiv=\"Content-Type\"/>\n```\n\n```\n```html\n</head>\n\
  <body>\n  <p>\n    cÃ©dille (from French), is a hook or tail ( Ł ) added under\n\
  \    certain letters as a diacritical mark to modify their\n    pronunciation\n\
  \  </p>\n</body>\n</html>\n```\n```\n\n请注意 meta 标签已更改为 `utf-8` 以反映更改；此外，字符与原始内容不同。\n\
  \n这是 `prettify()` 方法的默认行为。但如果我们不想让编码更改为 UTF-8，我们可以通过在 `prettify()` 方法中传递它来指定输出编码，如以下代码片段所示：\n\
  \n```\n```python\nprint(soup.prettify(\"ISO8859-2\")\n```\n```\n\n前面的代码行将以 ISO8859-2\
  \ 本身给出输出。\n\n```\n```html\n<html>\n  <head>\n    <meta content=\"text/html;charset=ISO-8859-2\"\
  \ http-equiv=\"Content-Type\"/>\n  </head>\n  <body>\n    <p>\n      cédille (from\
  \ French), is a hook or tail ( ž ) added under\n      certain letters as a diacritical\
  \ mark to modify their\n      pronunciation\n    </p>\n  </body>\n</html>\n```\n\
  ```\n\n我们也可以在任何 Beautiful Soup 对象上调用 `encode()` 并将其表示为我们传递的编码。`encode()` 方法默认也考虑\
  \ UTF-8 编码。这在以下代码片段中显示：\n\n```\n```python\nprint(soup.p.encode())\n\n#output\ncÃ©dille\
  \ (from French), is a hook or tail ( Ł ) added under\ncertain letters as a diacritical\
  \ mark to modify their\npronunciation\n```\n```\n\n与 prettify() 类似，encode() 也接受不同的编码作为其参数。\n\
  \n```\nprint(soup.encode(\"ISO-8859-2\")\n\n#output\ncédille (from French), is a\
  \ hook or tail ( ç ) added under certain\nletters as a diacritical mark to modify\
  \ their pronunciation\n```\n\n### 快速参考\n\n您可以查看以下参考资料，以了解本章中代码的概览：\n\n- `soup =\
  \ BeautifulSoup(html_markup,\"lxml\",from_encoding=\"latin-1\")`。这里，from_encoding\
  \ 在创建 BeautifulSoup 时使用，以指定文档编码。\n- `soup.original_encoding`：这会给出 Beautiful Soup\
  \ 检测到的原始编码。\n- 特定编码的输出内容使用以下方法列出：\n  - `soup.prettify()`\n  - `soup.encode()`\n\n\
  ### 总结\n\n在本章中，我们看到了 Beautiful Soup 中的编码支持。我们了解了如何获取 Beautiful Soup 检测到的原始编码。我们还学习了通过显式指定编码来创建\
  \ BeautifulSoup 对象。输出编码也在本章中进行了讨论。下一章将介绍 Beautiful Soup 提供的用于显示内容的各种方法。\n"
- "## 7 Beautiful Soup 中的输出\n### Beautiful Soup 中的输出\n\nBeautiful Soup 不仅搜索、导航和修改\
  \ HTML/XML，还以良好的格式输出内容。Beautiful Soup 可以处理不同类型的打印，例如：\n\n- 格式化打印\n- 非格式化打印\n\n除此之外，Beautiful\
  \ Soup 还提供不同的格式化程序来格式化输出。由于 HTML 树在创建后可能会发生修改，这些输出方法有助于查看修改后的 HTML 树。\n\n此外，本章中我们还将讨论一种从网页中获取仅存储的文本的简单方法。\n\
  \n### 格式化打印\n\nBeautiful Soup 有两种支持的打印方式。第一种是格式化打印，它将当前的 Beautiful Soup 对象打印为格式化的\
  \ Unicode 字符串。每个标签都在单独的行中打印，并带有良好的缩进，这导致了正确的外观和感觉。Beautiful Soup 有内置的 prettify()\
  \ 方法用于格式化打印。例如：\n\n```\nhtml_markup = \"\"\"<p class=\"ecopyramid\">\n<ul id=\"\
  producers\">\n    <li class=\"producerlist\">\n        <div class=\"name\">plants</div>\n\
  \        <div class=\"number\">100000</div>\n    </li>\n    <li class=\"producerlist\"\
  >\n        <div class=\"name\">algae</div>\n```\n\n```\n<div class=\"number\">100000</div>\n\
  </li>\n</ul>\"\"\"\nsoup = BeautifulSoup(html_markup,\"lxml\")\nprint(soup.prettify())\n\
  ```\n\n以下截图显示了输出：\n\n![](img/c437561ffd11fadb571896e0a4ca4d18_104_0.png)\n\n在输出中，我们可以看到\
  \ <html><body> 被附加了。这是因为 Beautiful Soup 使用 lxml 解析器，并且它默认将传递的任何字符串识别为 HTML，并在附加额外标签后执行打印。\n\
  \nprettify() 方法可以调用在 Beautiful Soup 对象或任何标签对象上。例如：\n\n```\nproducer_entry = soup.ul\n\
  print(producer_entry.prettify())\n```\n\n### 非格式化打印\n\nBeautiful Soup 支持 BeautifulSoup\
  \ 和 Tag 对象的纯文本打印。这将仅返回纯字符串而没有任何格式。\n\n这可以通过使用 str() 或 unicode() 方法来完成。\n\n### Beautiful\
  \ Soup 中的输出\n\n```\n<th>&amp;</th>\n    <td align=\"center\">&amp;amp;</td>\n  \
  \  <td align=\"center\">ampersand</td>\n</tr>\n<tr>\n    <th>&cent;</th>\n    <td\
  \ align=\"center\">&amp;cent;</td>\n    <td align=\"center\">cent</td>\n</tr>\n\
  <tr>\n    <th>&copy;</th>\n    <td align=\"center\">&amp;copy;</td>\n    <td align=\"\
  center\">copyright</td>\n</tr>\n<tr>\n    <th>&#247;</th>\n    <td align=\"center\"\
  >&amp;divide;</td>\n    <td align=\"center\">divide</td>\n</tr>\n<tr>\n    <th>&gt;</th>\n\
  \    <td align=\"center\">&amp;gt;</td>\n    <td align=\"center\">greater than</td>\n\
  </tr>\n</table>\n</body>\n</html>\n```\n\n此 HTML 代码将如下所示的截图中所示：\n\n![](img/c437561ffd11fadb571896e0a4ca4d18_106_0.png)\n\
  \n最左边的列代表符号，对应的 HTML 实体在下一列中表示。对于符号 &，对应的 HTML 实体代码是 &amp; 同样对于符号 ©，代码是 &copy;。\n\
  \nBeautiful Soup 中的输出方法仅转义 >, < 和 & 的 HTML 实体，分别转义为 &gt;、&lt; 和 &amp;。其余特殊实体在构建\
  \ BeautifulSoup 对象时被转换为 Unicode，并在使用 prettify() 或其他方法输出时，我们只得到 HTML 实体的 UTF-8 字符串。我们不会得到\
  \ HTML 实体返回（除了 &、> 和 <）。\n\n```\nhtml_markup = \"\"\"<html>\n<body>& &amp; ampersand\n\
  ¢ &cent; cent\n© &copy; copyright\n÷ &divide; divide\n> &gt; greater than\n</body>\n\
  </html>\n\"\"\"\nsoup = BeautifulSoup(html_markup,\"lxml\")\nprint(soup.prettify())\n\
  ```\n\n这里我们基于浏览器中 HTML 页面文本内容创建了 soup 对象，该内容在浏览器中具有 & 符号而不是 &amp; 代码。同样，对于 prettify()\
  \ 方法中的其他实体，输出如下所示：\n\n![](img/c437561ffd11fadb571896e0a4ca4d18_107_0.png)\n\n我们可以理解其他\
  \ HTML 实体被转换为 Unicode 表示。Beautiful Soup 允许输出格式化程序控制此行为。以下是可用的四种格式化程序类型：\n\n- minimal\n\
  - html\n- None\n- function\n\n\n\n\n\n我们可以将不同的格式化器作为参数传递给任何输出方法，例如 `prettify()`、`encode()`\
  \ 和 `decode()`。\n\n### 最小格式化器\n\n在此格式化模式下，字符串将被处理到足以生成有效的 HTML 代码。这是默认的格式化器，被转义的\
  \ HTML 实体是 `&amp;`、`&gt;` 和 `&lt;`。输出将类似于上一张截图中所示的内容。\n\n### html 格式化器\n\n在此格式化模式下，Beautiful\
  \ Soup 将把 Unicode 字符转换为 HTML 实体。\n\n```\nprint(soup.prettify(formatter=\"html\"\
  ))\n```\n\n以下截图显示了使用 `minimal` 和 `html` 格式化器的区别：\n\n![](img/c437561ffd11fadb571896e0a4ca4d18_108_0.png)\n\
  \n从上一张截图我们可以看出，格式化器 `html` 会将尽可能多的 Unicode 字符转换回 HTML 实体。\n\n### None 格式化器\n\n在这种情况下，Beautiful\
  \ Soup 不会修改字符串。这可能导致生成无效的 HTML 代码。\n\n`print(soup.prettify(formatter=None))` 代码行产生的输出类似于以下截图：\n\
  \n![](img/c437561ffd11fadb571896e0a4ca4d18_109_0.png)\n\n### 函数格式化器\n\n我们可以指定一个\
  \ Python 函数来处理每个字符串和属性值。\n\n```\ndef remove_chara(markup):\n    return markup.replace(\"\
  a\", \"\")\n```\n\n这里我们定义一个函数，从传递的字符串中删除字符 a。\n\n```\nprint(soup.prettify(formatter=remove_chara))\n\
  ```\n\n我们使用此函数从输出中删除 a 字符。需要注意的是，这不会转义输出中的三个特殊字符 &amp;、&gt; 和 &lt;，如以下截图所示：\n\n\
  ![](img/c437561ffd11fadb571896e0a4ca4d18_109_1.png)\n\n### 使用 get_text()\n\n从网站获取纯文本是常见的任务。Beautiful\
  \ Soup 为此提供了 `get_text()` 方法。\n\n如果我们只想获取 Beautiful Soup 或 Tag 对象的文本，可以使用 `get_text()`\
  \ 方法。例如：\n\n```\nhtml_markup = \"\"\"<p class=\"ecopyramid\">\n<ul id=\"producers\"\
  >\n    <li class=\"producerlist\">\n        <div class=\"name\">plants</div>\n \
  \       <div class=\"number\">100000</div>\n    </li>\n    <li class=\"producerlist\"\
  >\n        <div class=\"name\">algae</div>\n        <div class=\"number\">100000</div>\n\
  \    </li>\n</ul>\"\"\"\nsoup = BeautifulSoup(html_markup,\"lxml\")\nprint(soup.get_text())\n\
  \n#output\nplants\n100000\n\nalgae\n100000\n```\n\n`get_text()` 方法以单个 Unicode 字符串的形式返回\
  \ Beautiful Soup 或 Tag 对象内部的文本。但 `get_text()` 在处理网页时存在问题。网页通常包含 JavaScript 代码，而\
  \ `get_text()` 方法也会返回 JavaScript 代码。例如，在第 3 章《使用 Beautiful Soup 搜索》中，我们看到了从 packtpub.com\
  \ 抓取图书详情的示例。\n\n```\nimport urllib2\nfrom bs4 import BeautifulSoup\nurl = \"http://www.packtpub.com/books\"\
  \npage = urllib2.urlopen(url)\nsoup_packtpage = BeautifulSoup(page,\"lxml\")\n```\n\
  \n我们可以使用 `get_text()` 打印页面内的文本；这在以下代码片段中显示：\n\n```\nprint(soup_packtpage.get_text())\n\
  ```\n\n使用上一行代码，我们也会在输出中得到 JavaScript 代码，如下所示：\n\n```\n$(window).load(function()\
  \ {\n  $(\"img[data-original]\").addClass(\"lazy\");\n  $(\"img.lazy\").lazyload();\n\
  \  setTimeout(function() {\n    addthis_config = Drupal.settings.addthis.config_default;\n\
  \    addthis_share = Drupal.settings.addthis.share_default;\n    if (typeof pageTracker\
  \ != \"undefined\")\n    {addthis_config.data_ga_tracker = pageTracker;}\n    var\
  \ at = document.createElement(\"script\"); at.type =\n      \"text/javascript\"\
  ; at.async = true;\n    at.src = \"//dgdsbygo8mp3h.cloudfront.net/sites/default/\n\
  \      files/addthis/addthis_widget.js\";\n    var s = document.getElementsByTagName(\"\
  script\")[0];\n    s.parentNode.insertBefore(at, s);\n  }, 5);\n});\n```\n\n删除 JavaScript\
  \ 并仅打印文档中的文本，可以通过以下代码行实现：\n\n```\n[x.extract() for x in soup_packtpage.find_all('script')]\n\
  ```\n\n上一行代码将从文档中删除所有 script 元素。之后，`print(soup_packtpage.get_text())` 代码行将仅打印页面中存储的文本。\n\
  \n### 快速参考\n\n您可以查看以下参考资料以获得概览：\n\n- 格式化打印：以下方法给出格式化输出：\n  - soup.prettify(): 此方法用于带缩进和格式的输出\n\
  - 非格式化打印：这些方法给出不带任何格式或缩进的输出：\n  - str(soup)\n  - soup.encode()\n  - soup.decode()\n\
  - 格式化器：这些方法能够控制输出的行为：\n  - `soup.prettify(formatter=\"minimal\")`\n  - `soup.prettify(formatter=\"\
  html\")`\n  - `soup.prettify(formatter=\"None\")`\n  - `soup.prettify(formatter=already_defined_func)`\n\
  - get_text(): 此方法为您提供对象或标签的所有内容：\n  - `soup.get_text()`: 此方法用于获取 BeautifulSoup 或\
  \ Tag 对象中的所有文本内容\n\n### 总结\n\n本章介绍了 Beautiful Soup 中的不同输出方法。我们看到了 BeautifulSoup\
  \ 对象中的格式化和非格式化打印，以及用于控制输出格式的不同输出格式化器。我们还看到了从网页中仅获取文本的方法。\n\n在下一章中，我们将使用本書迄今为止所研究的搜索、导航和其他技术创建一个网络抓取器。\n\
  \n## 8 创建网络抓取器\n\n### 创建网络抓取器\n\n在本章中，我们将使用前几章研究的不同的搜索和导航技术创建一个网站抓取器。抓取器将访问三个网站，根据\
  \ ISBN 查找图书的售价。我们将首先从 packtpub.com 找到图书列表和售价。我们还将从 packtpub.com 找到图书的 ISBN，并基于此\
  \ ISBN 在 www.amazon.com 和 www.barnesandnoble.com 等其他网站上进行搜索。通过这样做，我们将自动化在三个网站上查找图书售价的过程，并将获得为这些网站实现抓取器的实践经验。由于网站结构可能会在以后发生变化，本章中使用的代码示例和图像也可能变得无效。因此，最好将示例作为参考并相应地更改代码。访问这些网站以获得更好的理解是很好的。\n\
  \n### 从 PacktPub.com 获取图书详情\n\n从 www.packtpub.com 获取图书详情是创建抓取器的第一步。我们需要从 PacktPub.com\
  \ 找到以下详情：\n\n- 书名\n- 售价\n- ISBN\n\n我们在第 3 章《使用 Beautiful Soup 搜索》中看到了如何从 packtpub.com\
  \ 抓取书名和售价。该章中讨论的示例仅考虑了第一页，未包含也包含图书列表的其他页面。因此，在下一个主题中，我们将找到包含图书列表的不同页面。\n\n### 查找包含图书列表的页面\n\
  \nwww.packtpub.com/books 页面上有下一个和上一个导航链接，用于在包含图书列表的页面之间前后移动，如以下截图所示：\n\n![](img/c437561ffd11fadb571896e0a4ca4d18_114_0.png)\n\
  \n因此，我们需要找到一种获取包含图书列表的多个页面的方法。逻辑上，似乎要查看当前页面中 next 元素指向的页面。使用 Google Chrome 开发工具查看\
  \ next 元素，对于第 49 页，我们可以看到它实际上指向下一页链接，即 /books?page=49。如果我们使用 Google Chrome 开发工具观察不同的页面，可以看到下一页的链接实际上具有\
  \ /books?page=n 的模式，对于第 n+1 页，即 n=49 表示第 50 页，如以下截图所示：\n\n![](img/c437561ffd11fadb571896e0a4ca4d18_114_1.png)\n\
  \n从前面的截图中，我们可以进一步理解 next 元素位于 class=\"pager-next last\" 的 <li> 标签内。在 <li> 标签内，有一个\
  \ <a> 标签保存着指向下一页的链接。在这种情况下，对应的值为 /books?page=49，指向第 50 页。我们必须将 www.packtpub.com\
  \ 添加到此值以构成有效的 URL，即 www.packtpub.com/books?page=49。\n\n\n\n\n\n如果我们分析 packtpub.com\
  \ 网站，可以看到已出版书籍的列表在第 50 页结束。因此，我们需要确保我们的程序在此页停止。程序可以在无法找到下一个元素时停止查找更多页面。\n\n例如，如以下屏幕截图所示，对于第\
  \ 50 页，我们没有下一个元素：\n\n![](img/c437561ffd11fadb571896e0a4ca4d18_115_0.png)\n\n因此，在这一点上，我们可以停止查找后续页面。\n\
  \n我们获取页面的逻辑应如下：\n\n+   1. 从第一页开始。\n+   2. 检查它是否有下一个元素：\n+      - 如果有，存储下一个页面 URL\n\
  +      - 如果没有，停止查找后续页面\n+   3. 加载 URL 处的页面并重复前述步骤。\n\n我们可以使用以下代码来查找包含 packtpub.com\
  \ 书籍列表的页面：\n\n```\nimport urllib2\nimport re\nfrom bs4 import BeautifulSoup\npacktpub_url\
  \ = \"http://www.packtpub.com/\"\n```\n\n我们将 http://packtpub.com 存储在 packtpub_url\
  \ 变量中。每个下一个元素链接都应以 packtpub_url 为前缀以形成有效 URL，http://www.packtpub.com/book?page=n，如以下代码所示：\n\
  \n```\ndef get_bookurls(url):\n    page = urllib2.urlopen(url)\n    soup_packtpage\
  \ = BeautifulSoup(page,\"lxml\")\n```\n\n```\npage.close()\nnext_page_li = soup_packtpage.find(\"\
  li\", class_=\"pager-next\n    last\")\nif next_page_li is None :\n    next_page_url\
  \ = None\nelse:\n    next_page_url = packtpub_url+next_page_li.a.get('href')\n\n\
  return next_page_url\n```\n\n前述 get_bookurls() 函数在提供当前页面 URL 时返回下一页 URL。对于最后一页，它返回\
  \ None。\n\n在 get_bookurls() 中，我们基于 URL 输入创建了一个 BeautifulSoup 对象 soup_packtpage，然后搜索具有\
  \ pager-next last 类的 li 标签。如果 find() 返回一个标签，我们可以使用 next_page_li.a.get('href') 获取下一页的链接。我们将此值与\
  \ packtpub_url 前缀并返回。\n\n我们需要此类页面 URL 的列表（例如 www.packtpub.com/books、www.packtpub.com/books?page=2\
  \ 等）来收集这些页面上所有书籍的详细信息。\n\n为了创建此列表以收集这些详细信息，请使用以下代码：\n\n```\nstart_url = \"www.packtpub.com/books\"\
  \ncontinue_scrapping = True\nbooks_url = [start_url]\nwhile continue_scrapping:\n\
  \    next_page_url= get_bookurls(start_url)\n    if next_page_url is None:\n   \
  \     continue_scraping = False\n    else:\n        books_url.append(next_page_url)\n\
  \    start_url = next_page_url\n```\n\n在前述代码中，我们从 URL www.packtpub.com/books 开始并将其存储在\
  \ books_url 列表中。我们使用一个标志 continue_scraping 来控制函数的执行，我们可以看到当 get_bookurls 返回 None\
  \ 时循环将终止。\n\nprint(books_url) 条目打印从 www.packtpub.com/books 到 www.packtpub.com/books?page=49\
  \ 的不同 URL。\n\n### 查找书籍详情\n\n现在，是时候让我们查找每本书的详细信息，例如书名、售价和 ISBN。书名和售价可以从包含书籍列表的主页找到。但\
  \ ISBN 只能在每本书的详情页找到。因此，从主页面，例如 www.packtpub.com/books，我们必须找到相应的链接以获取每本书的详细信息。\n\n\
  我们可以使用以下代码来查找每本书的详细信息：\n\n```\ndef get_bookdetails(url):\n    page = urllib2.urlopen(url)\n\
  \    soup_packtpage = BeautifulSoup(page,\"lxml\")\n    page.close()\n    all_books_table\
  \ = soup_packtpage.find(\"table\",class_=\"views-view-grid\")\n    all_book_titles\
  \ =all_books_table.find_all(\"div\",class_=\"views-field-title\")\n    isbn_list\
  \ = []\n    for book_title in all_book_titles:\n        book_title_span = book_title.span\n\
  \        print(\"Title Name:\"+book_title_span.a.string)\n        print(\"Url:\"\
  +book_title_span.a.get('href'))\n        price = book_title.find_next(\"div\",class_=\"\
  views-field-sell-price\")\n        print(\"Packtpub Price:\"+price.span.string)\n\
  \        isbn_list.append(get_isbn(book_title_span.a.get('href')))\n    return isbn_list\n\
  ```\n\n前述代码与我们在第 3 章《使用 Beautiful Soup 搜索》中用于获取书籍详情的代码相同。增加的是使用 isbn_list 来保存 ISBN\
  \ 号码以及返回特定书籍 ISBN 的 get_isbn 函数。\n\n### 创建网络爬虫\n\n书籍的 ISBN 存储在书籍的详情页中，如以下屏幕截图所示：\n\
  \n![](img/c437561ffd11fadb571896e0a4ca4d18_118_0.png)\n\n在前述 get_bookdetails() 函数中，book_title_span.a.get('href')\
  \ 函数保存了每本书详情页的 URL。我们将前述值传递给 get_isbn() 函数以获取 ISBN。\n\n通过开发者工具查看的书籍详情页具有 ISBN，如以下屏幕截图所示：\n\
  \n![](img/c437561ffd11fadb571896e0a4ca4d18_118_1.png)\n\n从前述屏幕截图中，我们可以看到 **ISBN**\
  \ 号码存储为 b 标签内 ISBN 后跟的文本。\n\n现在，在以下代码中，让我们看看如何使用 `get_isbn()` 函数找到 ISBN：\n\n```\n\
  def get_isbn(url):\n    book_title_url = packtpub_url + url\n    page = urllib.urlopen(book_title_url)\n\
  \    soup_bookpage = BeautifulSoup(page,\"lxml\")\n    page.close()\n    isbn_tag\
  \ = soup_bookpage.find('b',text=re.compile(\"ISBN :\"))\n    return isbn_tag.next_sibling\n\
  ```\n\n在前述代码中，我们搜索了 b 标签，其文本与模式 ISBN : 匹配。ISBN 是 b 标签的 `next_sibling`。\n\n在每个主页面中，将会有书籍列表，对于每本书，将会有\
  \ ISBN。因此，我们需要对 `books_url` 列表中的每个调用 `get_bookdetails()` 方法，如下所示：\n\n```\nisbns\
  \ = []\nfor bookurl in books_url:\n    isbns+= get_bookdetails(bookurl)\n```\n\n\
  `print(isbns)` 函数将打印 packtpub.com 当前出版的所有书籍的 ISBN 列表。\n\n我们从 PacktPub 网站抓取了售价、书名和\
  \ ISBN。我们将使用 ISBN 在 `www.amazon.com` 和 `www.barnesandnoble.com` 两者中搜索相同书籍的售价。这样，我们的爬虫就完成了。\n\
  \n### 从 Amazon 获取售价\n\n我们可以根据其 ISBN 在 Amazon 上搜索书籍。通常，我们将使用 Amazon 上的默认搜索页面并输入 ISBN。我们可以手动执行此操作，但从程序或爬虫中，我们应根据\
  \ ISBN 知道要请求的 URL。让我们转到 Amazon 网站并使用以下屏幕截图所示的 ISBN 搜索此书：\n\n![](img/c437561ffd11fadb571896e0a4ca4d18_119_0.png)\n\
  \nAmazon 搜索后生成的页面将具有如下 URL 结构：\n\n```\nhttp://www.amazon.com/s/ref=nb_sb_noss?url=search-alias%3Daps&field-keywords=1783289554\n\
  ```\n\n如果我们基于另一个 ISBN 搜索，即 http://www.amazon.com/s/ref=nb_sb_noss?url=search-alias%3Daps&field-keywords=1847195164，我们将看到它根据\
  \ 1847195164 ISBN 返回给我们详细信息。\n\n从中，我们可以得出结论，如果我们用相应的 ISBN 替换 URL 的 field-keywords，我们将获得该\
  \ ISBN 的详细信息。\n\n从 http://www.amazon.com/s/ref=nb_sb_noss?url=search-alias%3Daps&field-keywords=1783289554\
  \ 页面，我们必须找到书籍的售价。我们可以遵循相同的方法使用 Google Chrome 开发者工具查看哪个标签保存售价。\n\n![](img/c437561ffd11fadb571896e0a4ca4d18_120_0.png)\n\
  \n从前述屏幕截图中，我们可以看到价格存储在具有 newPrice 类的 div 标签内。我们可以使用以下代码从 Amazon 找到售价：\n\n```\ndef\
  \ get_sellingprice_amazon(isbn):\n    url_foramazon = \"http://www.amazon.com/s/ref=nb_sb_noss?url=search-alias%3Daps&field-keywords=\"\
  \n    url_for_isbn_inamazon = url_foramazon+isbn\n    page = urllib2.urlopen(url_for_isbn_inamazon)\n\
  \    soup_amazon = BeautifulSoup(page, \"lxml\")\n```\n\n```\npage.close()\nselling_price_tag\
  \ = soup_amazon.find('div',class_=\"newPrice\")\nif selling_price_tag:\n    print\
  \ (\"Amazon Price\"+selling_price_tag.span.string)\n```\n\n我们基于 URL 创建了 soup 对象。创建\
  \ soup 对象后，我们找到了具有 newPrice 类的 div 标签。售价存储在 `<span>` 标签内，我们使用 `print (selling_price_tag.span.string)`\
  \ 打印它。\n\n### 从 Barnes and Noble 获取售价\n\n我们必须使用与 Amazon 相同的策略在 Barnes and Noble\
  \ 网站上找到售价。为此，我们需要执行以下步骤：\n\n+   1. 查找每个 ISBN 的 URL\n+   2. 找到一种抓取售价的方法\n\n可用于 Barnes\
  \ and Noble 的 URL 为 `http://www.barnesandnoble.com/s/ISBN`，其中 ISBN 是 ISBN 值，例如 `http://www.barnesandnoble.com/s/1904811590`。\n\
  \n现在，我们必须从页面找到售价。Barnes and Noble 上的页面将在以下屏幕截图所示的具有 price 类的 div 标签中列出售价（突出显示）：\n\
  \n![](img/c437561ffd11fadb571896e0a4ca4d18_121_0.png)\n\n\n\n\n\n### 创建网页抓取器\n\n\
  我们可以使用以下代码从 Barnes and Noble 找到售价：\n\n```python\ndef get_sellingprice_barnes(isbn):\n\
  \    url_forbarnes = \"http://www.barnesandnoble.com/s/\"\n    url_for_isbn_barnes\
  \ = url_forbarnes+isbn\n    page = urllib2.urlopen(url_for_isbn_barnes)\n    soup_barnes\
  \ = BeautifulSoup(page, \"lxml\")\n    page.close()\n    selling_price_tag = soup_barnes.find('div',\
  \ class_=\"price hlight\")\n    if selling_price_tag:\n        print(\"Barnes Price\"\
  \ + selling_price_tag.string)\n```\n\n创建网页抓取器的完整代码可在代码包中找到。\n\n> \U0001F4A1 之前的抓取器可从库中免费下载\n\
