    # Adding a new tag


    We''ve seen some of the different ways to change the Tag object''s .name property
    and to modify the Tag attributes. Beautiful Soup also allows us to add a new tag
    to the existing HTML/XML document. The new_tag() method creates a new tag within
    the soup object. We can then add these tags to the tree by using either the append(),
    insert(), insert_after(), or insert_before() method.


    # Adding a new producer using new_tag() and append()


    In our ecological pyramid example, we already have plants and algae as the producers.
    Let us add one more producer to the HTML, for example, phytoplankton. If we analyze
    the HTML, we can see that we need to first add a li tag to the parent ul tag.
    For this, we need to create the li tag first.


    # Creating a new tag using new_tag()


    The Beautiful Soup''s new_tag() method will help us to create a new tag. The new_tag()
    method can be called only on the BeautifulSoup object. So, here we need to create
    a new tag, li, with the producerlist class. For this, refer to the following code:


    ```

    soup = BeautifulSoup(html_markup,"lxml")

    new_li_tag = soup.new_tag("li")

    ```


    The preceding code will create and store the new li tag in the new_li_tag variable.
    The new_tag() method requires only the tag name as mandatory. We can pass attribute
    values or other properties as optional parameters. That is, we can have the following
    code:


    ```

    new_atag=soup.new_tag("a",href="www.example.com")

    ```


    In the preceding example, we created the <a> tag by giving a name as well as the
    href property and its value.


    It is also possible to add a new attribute value to the previously created li
    tag using the following code:


    ```

    new_li_tag.attrs={''class'':''producerlist''}

    ```'
