    \ find(). In this case, find_all() will become handy.\n\n```\nall_tertiaryconsumers\
    \ =\n    soup.find_all(class_=\"tertiaryconsumerslist\")\n```\n\nThe preceding\
    \ code line finds all the tags with the = \"tertiaryconsumerlist\" class. If given\
    \ a type check on this variable, we can see that it is nothing but a list of tag\
    \ objects as follows:\n\n```\nprint(type(all_tertiaryconsumers))\n\n#output\n\
    <class 'list'>\n```\n\nWe can iterate through this list to display all tertiary\
    \ consumer names by using the following code:\n\n```\nfor tertiaryconsumer in\
    \ all_tertiaryconsumers:\n    print(tertiaryconsumer.div.string)\n```"
