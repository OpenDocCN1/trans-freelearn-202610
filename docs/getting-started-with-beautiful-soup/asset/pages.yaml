    \ code line produces an output similar to the following screenshot:\n\n![](img/c437561ffd11fadb571896e0a4ca4d18_109_0.png)\n\
    \n# The function formatter\n\nWe can specify a Python function and what to do\
    \ with each string and attribute value.\n\n```\ndef remove_chara(markup:\n   \
    \ return markup.replace(\"a\", \"\")\n```\n\nHere we define a function to remove\
