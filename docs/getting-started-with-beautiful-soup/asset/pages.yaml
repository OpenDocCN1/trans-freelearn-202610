  img_proc: true
- pgno: 82
  md: "# Adding a new tag using append()\n\nWe have created the li tag but we need\
    \ to fix it to the correct position. Beautiful Soup allows us to add a tag to\
    \ another tag or the soup object using the append() method. The append() method\
    \ adds a newly created tag to the end of .contents. This can be called in the\
    \ same way as the append() method in a Python list as follows:\n\n```\nproducer_entries\
    \ = soup.ul\nproducer_entries.append(new_li_tag)\n```\n\nThe preceding code will\
    \ append the newly created li tag to .contents of the ul tag. So, the li tag will\
    \ now be the child of the ul tag. The ul tag structure will look like the following\
    \ code:\n\n```\nprint(producer_entries.prettify())\n\n#output\n<ul id=\"producers\"\
    >\n    <li class=\"producerlist\">\n        <div class=\"name\">\n           \
    \ plants\n        </div>\n        <div class=\"number\">\n            100000\n\
    \        </div>\n    </li>\n    <li class=\"producerlist\">\n        <div class=\"\
    name\">\n            algae\n        </div>\n        <div class=\"number\">\n \
    \           100000\n        </div>\n    </li>\n    <li class=\"producerlist\"\
    >\n    </li>\n</ul>\n```\n\nFrom the preceding output, we can see that the newly\
    \ created li tag is added as the new child of ul. Now, we have to add the two\
    \ div tags inside this li tag."
