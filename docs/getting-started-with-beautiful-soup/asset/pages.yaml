- pgno: 56
  md: '# Using search methods to scrape information from a web page


    In *Chapter 2, Creating a BeautifulSoup Object*, we discussed the fetching of
    information related to all books published by Packt Publishing available at the
    link `http://www.packtpub.com/books`. In the following exercise, we will use Beautiful
    Soup searching methods to scrape all books from the preceding URL. We will scrape
    the name of the book, published date, and price from the preceding URL.


