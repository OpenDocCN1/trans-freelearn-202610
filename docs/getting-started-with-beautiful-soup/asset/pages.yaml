- pgno: 107
  md: 'The left-most column represents the symbols and the corresponding HTML entities
    are represented in the next column. For the symbol &, the corresponding HTML entity
    code is &amp; likewise for the symbol ©, the code is &copy;.


    The output methods in Beautiful Soup escape only the HTML entities of >, <, and
    & as &gt;, &lt;, and &amp;. Rest of the special entities are converted to Unicode
    while constructing the BeautifulSoup object, and upon output using prettify()
    or other methods, we get only the UTF-8 string of the HTML entities. We won''t
    get the HTML entities back (except for &, >, and <).


    ```

    html_markup = """<html>

    <body>& &amp; ampersand

    ¢ &cent; cent

    © &copy; copyright

    ÷ &divide; divide

    > &gt; greater than

    </body>

    </html>

    """

    soup = BeautifulSoup(html_markup,"lxml")

    print(soup.prettify())

    ```


    Here we have created the soup object based on the text content for the HTML page
    in a browser that had the & symbol instead of the &amp; code. Likewise for other
    entities in the prettify() method, the output is shown as follows:


    ![](img/c437561ffd11fadb571896e0a4ca4d18_107_0.png)


    We can understand that other HTML entities were converted to Unicode representation.
    Beautiful Soup allows output formatters to have a control over this behavior.
    There are the following four types of formatters available:


    +   - minimal

    +   - html

    +   - None

    +   - function'
  merge: -1
  img_proc: true
- pgno: 108
  md: 'We can pass different formatters as parameters to any of the output methods,
    such as `prettify()`, `encode()`, and `decode()`.


    # The minimal formatter


    In this formatting mode, strings will be processed enough to generate a valid
    HTML code. This is the default formatter and the HTML entities that are escaped
    are `&amp;`, `&gt;` and `&lt;`. The output will be similar to the one shown in
    the previous screenshot.


    # The html formatter


    In this formatting mode, Beautiful Soup will convert the Unicode characters to
    HTML entities.


    ```

    print(soup.prettify(formatter="html"))

    ```


    The following screenshot shows the difference between using the `minimal` and
    `html` formatters:


    ![](img/c437561ffd11fadb571896e0a4ca4d18_108_0.png)


    From the previous screenshot we can identify that the formatter `html` changes
    whatever Unicode characters possible back to HTML entities.'
  merge: -1
  img_proc: true
