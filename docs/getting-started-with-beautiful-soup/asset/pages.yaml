    # # Creating a BeautifulSoup object for XML parsing


    Beautiful Soup can also be used for XML parsing. While creating a BeautifulSoup
    object, the TreeBuilder class is selected by Beautiful Soup for the creation of
    HTML/XML tree. The TreeBuilder class is used for creating the HTML/XML tree from
    the input document. The default behavior is to select any of the HTML TreeBuilder
    objects, which use the default HTML parser, leading to the creation of the HTML
    tree. In the previous example, using the string helloworld, we can verify the
    content of the soup_string object, which shows that the input is treated as HTML
    by default.


    ```

    ```python

    soup_string = BeautifulSoup(helloworld)

    print(soup_string)

    ```

    ```


    The output for the previous code snippet is as follows:


    ```

    ```html

    <html><body><p>Hello World</p></body></html>

    ```

    ```'
