- pgno: 63
  md: "# 4\nNavigation Using\nBeautiful Soup\n\nIn Chapter 3, Search Using Beautiful\
    \ Soup, we saw how to apply searching methods to search tags, texts, and more\
    \ in an HTML document. Beautiful Soup does much more than just searching. Beautiful\
    \ Soup can also be used to navigate through the HTML/XML document. Beautiful Soup\
    \ comes with attributes to help in the case of navigation. We can find the same\
    \ information up to some level using the searching methods, but in some cases\
    \ due to the structure of the page, we have to combine both searching and navigation\
    \ mechanisms to get the desired result. Navigation techniques come in handy in\
    \ those cases. In this chapter, we will get into navigation using Beautiful Soup\
    \ in detail.\n\n# Navigation using Beautiful Soup\n\nNavigation in Beautiful Soup\
    \ is almost the same as the searching methods. In navigating, instead of methods,\
    \ there are certain attributes that facilitate the navigation. As we already saw\
    \ in Chapter 2, Creating a BeautifulSoup Object, Beautiful Soup uses a different\
    \ TreeBuilder to build the HTML/XML tree. So each Tag or NavigableString object\
    \ will be a member of the resulting tree with the Beautiful Soup object placed\
    \ at the top and other objects as the nodes of the tree.\n\nThe following code\
    \ snippet is an example for an HTML tree:\n\n```\nhtml_markup = \"\"\"<div class=\"\
    ecopyramid\">\n    <ul id=\"producers\">\n        <li class=\"producerlist\">\n\
    \            <div class=\"name\">plants</div>\n            <div class=\"number\"\
    >100000</div>\n        </li>\n    </ul>\n</div>\"\"\"\n```"
  merge: -1
  img_proc: true
- pgno: 64
  md: "```\n<li class=\"producerlist\">\n    <div class=\"name\">algae</div>\n   \
    \ <div class=\"number\">100000</div>\n</li>\n</ul>\n</div>\"\"\n```\n\nFor the\
    \ previous code snippet, the following HTML tree is formed:\n\n![](img/c437561ffd11fadb571896e0a4ca4d18_64_0.png)\n\
    \nIn the previous figure, we can see that Beautiful Soup is the root of the tree,\
    \ the Tag objects make up the different nodes of the tree, while NavigableString\
    \ objects make up the leaves of the tree.\n\nNavigation in Beautiful Soup is intended\
    \ to help us visit the nodes of this HTML/ XML tree. From a particular node, it\
    \ is possible to:\n\n+   - Navigate down to the children\n+   - Navigate up to\
    \ the parent\n+   - Navigate sideways to the siblings\n+   - Navigate to the next\
    \ and previous objects parsed\n\nWe will be using the previous html_markup as\
    \ an example to discuss the different navigations using Beautiful Soup."
  merge: -1
  img_proc: true
- pgno: 65
  md: '# Navigating down


    Any object, such as Tag or BeautifulSoup, that has children can use this navigation.
    Navigating down can be achieved in two ways.


    # Using the name of the child tag


    A BeautifulSoup or a Tag object can use the name of a child tag to navigate to
    it. Even if there are multiple child nodes with the same name, this method will
    navigate to the first instance only. For example, we can consider the BeautifulSoup
    object on the ecological pyramid example discussed in the previous example.


    ```

    soup = BeautifulSoup(html_markup,"lxml")

    producer_entries = soup.ul

    print(producer_entries)

    ```


    In the previous code, by using soup.ul, we navigate to the first entry of the
    ul tag within the soup object''s children.


    This can also be done for Tag objects by using the following code:


    ```

    first_producer = producer_entries.li

    print(first_producer)

    ```


    ```

    #output

    <li class="producerlist">

    <div class="name">plants</div>

    <div class="number">100000</div>

    </li>

    ```


    The previous code used navigation on the tag object, producer_entries, to find
    the first entry of the <li> tag. We can verify this from the output. But this
    cannot be used on a NavigableString object, as it doesn''t have any children.


    ```

    producer_name = first_producer.div.string

    ```


    Here we stored the NavigableString plants in producer_name. Trying to navigate
    down from producer_name will result in an error.


    ```

    producer_name.li

    ```


    This will throw the following AttributeError since NavigableString can''t have
    any child objects:


    ```

    AttributeError: ''NavigableString'' object has no attribute ''li''

    ```'
  merge: -1
  img_proc: true
- pgno: 66
  md: '# # Using predefined attributes


    Beautiful Soup stores children in predefined attributes. There are two types of
    children.


    +   - **Direct children**: These come immediately after a node in an HTML tree.
    For example, in the following figure, **html** is the direct child of **BeautifulSoup**.


    ![](img/c437561ffd11fadb571896e0a4ca4d18_66_0.png)


    +   - **Descendants**: These contain all the children of a particular node including
    the direct child. For example, in the following image, we can see the direct child
    and the descendants of **BeautifulSoup**.


    ![](img/c437561ffd11fadb571896e0a4ca4d18_66_1.png)


    Descendants include all tags coming under Beautiful Soup.'
  merge: -1
  img_proc: true
- pgno: 67
  md: "Based on the previous categorization, there are the following different attributes\
    \ for navigating to the children:\n\n+   - `.contents`\n+   - `.children`\n+ \
    \  - `.descendants`\n\nThese attributes will be present in all Tag objects and\
    \ the BeautifulSoup object that facilitates navigation to the children.\n\n# The\
    \ .contents attribute\n\nThe children of a Tag object or a BeautifulSoup object\
    \ are stored as a list in the attribute `.contents`.\n\n```\n```python\nprint(type(soup.contents))\n\
    #output\n<class 'list'>\n```\n```\n\nFrom the output, we know that type is a list\
    \ that holds the children. In this case, the number of children of the BeautifulSoup\
    \ object can be understood from the following code snippet:\n\n```\n```python\n\
    print len(soup.contents)\n\n#output\n1\n```\n```\n\nWe can use any type of list\
    \ navigation in Python on `.contents` too. For example, we can print the name\
    \ of all children using the following code:\n\n```\n```python\nfor tag in soup.contents:\n\
    \    print(tag.name)\n\n#output\nhtml\n```\n```\n\nNow let us see that in the\
    \ case of the Tag object producer_entries using the following code snippet:\n\n\
    ```\n```python\nfor child in producer_entries.contents:\n    print(child)\n#output\n\
    <li class=\"producerlist\">\n    <div class=\"name\">plants</div>\n    <div class=\"\
    number\">100000</div>\n```\n```"
  merge: -1
  img_proc: true
- pgno: 68
  md: "```\n</li>\n<li class=\"producerlist\">\n    <div class=\"name\">algae</div>\n\
    \    <div class=\"number\">100000</div>\n```\n\n# The .children attribute\n\n\
    The .children attribute is almost the same as the .contents attribute. But it\
    \ is not a list like .contents, instead it is a Python generator and we can iterate\
    \ over this to get each child.\n\n```\nprint type(soup.children)\n\n#output\n\
    <class 'list_generator'>\n```\n\nWe can iterate over .children of the BeautifulSoup\
    \ object, and get the children as in the example code given as follows:\n\n```\n\
    for tag in soup.children:\n    print(tag.name)\n\n#output\nhtml\n```\n\n# The\
    \ .descendants attribute\n\nThe .contents and .children attributes consider the\
    \ immediate children only, that is, soup.contents or soup.children returned only\
    \ the root HTML tag.\n\nNavigation to all children of a particular object is possible\
    \ using .descendants.\n\n```\nprint(len(list(soup.descendants)))\n#output\n13\n\
    ```\n\nFrom the output, we can see that .descendants gives 13, whereas .contents\
    \ or .children gave only 1.\n\nNow let us print all descendants in this case.\n\
    \n```\nfrom bs4.element import NavigableString\nfor tag in soup.descendants:\n\
    \    if isinstance(tag, NavigableString):\n        print(tag)\n    else:\n   \
    \     print(tag.name)\n```"
  merge: -1
  img_proc: true
