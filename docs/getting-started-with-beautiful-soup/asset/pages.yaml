    In the preceding code, we created the regular expression for the e-mail ID in
    the emailid_regexp variable. The pattern we used previously is \w+@\w+\. The \w+
    symbol represents one or more alphanumeric characters followed by @, and then
    again followed by one or more alphanumeric character, then a . symbol, and one
    or more alphanumeric character. This matches the e-mail ID in the preceding example.
    We then passed the emailid_regexp variable to the find() method to find the first
    text that matches the preceding pattern.


    # Searching based on attribute values of a tag


    We can use find() to search based on the attribute values of a tag. In the previous
    ecological pyramid example, we can see that primary consumers are within the <ul>
    tag with the primaryconsumers ID. In this case, it is easy to use find() with
    the argument as the attribute value that we are looking for.


    # Finding the first primary consumer


    Finding the producer was an easy task, since it was the first entry for the <ul>
    tag. But what about the first primary consumer? It is not inside the first <ul>
    tag. By careful analysis, we can see that primary consumers are inside the second
    <ul> tag with the id="primaryconsumers" attribute. In this case, we can use Beautiful
    Soup to search based on the attribute value, assuming we already created the soup
    object. In the following code, we are storing the first occurrence of the tag
    with the id ="primaryconsumers" attribute in primary_consumers:


    ```

    primary_consumers = soup.find(id="primaryconsumers")

    print(primary_consumers.li.div.string)


    #output

    deer

    ```'
