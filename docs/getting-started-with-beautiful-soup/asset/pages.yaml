- pgno: 98
  md: 'If we run the same content through a scraper with no support for the previous
    encoding used by the website, we might end up with the following content:


    ```

    The Spanish language is written using the Spanish alphabet, which

    is the Latin alphabet with one additional letter,

    e&#21336;e (&#21336;), for a total of 27 letters.

    ```


    We see the Spanish character ñ is replaced with gibberish characters. So it is
    important that a scraper should support different encodings. Beautiful Soup handles
    these encodings pretty neatly. In this chapter, we will see the encoding support
    in Beautiful Soup.


    # Encoding in Beautiful Soup


    As already explained, every HTML/XML document will be written in a specific character
    set encoding, for example, UTF-8, and Latin-1. In an HTML page, this is represented
    using the meta tag as shown in the following example:


    ```

    <meta http-equiv="Content-Type" content="text/html;charset=UTF-8">

    ```


    Beautiful Soup uses the UnicodeDammit library to automatically detect the encoding
    of the document. Beautiful Soup converts the content to Unicode while creating
    soup objects from the document.


    > Unicode is a character set, which is a list of characters with unique numbers.
    For example, in the Unicode character set, the number for the character B is 42.
    UTF-8 encoding is an algorithm that is used to convert these numbers into a binary
    representation.


    In the previous example, Beautiful Soup converts the document to Unicode.


    ```

    html_markup = """<p> The Spanish language is written using the

    Spanish alphabet, which is the Latin alphabet with one

    additional letter, eñe (ñ), for a total of 27 letters.</p>

    """


    soup = BeautifulSoup(html_markup,"lxml")

    print(soup.p.string)


    #output

    The Spanish language is written using the Spanish alphabet, which

    is the Latin alphabet with one additional letter, eñe (ñ), for

    a total of 27 letters.

    ```'
  merge: -1
  img_proc: true
- pgno: 99
  md: "From the previous output, we can see that there is a difference in the additional\
    \ letter part (e単e (単,)) because there is a gibberish character instead of the\
    \ actual representation. This is due to the wrong interpretation of the original\
    \ encoding in the document by UnicodeDammit.\n\n# Understanding the original encoding\
    \ of the HTML document\n\nThe previous HTML content was originally of UTF-8 encoding.\
    \ But Beautiful Soup, while generating the soup object, detects encoding using\
    \ the UnicodeDammit library and we can get hold of this original encoding using\
    \ the attribute original_encoding.\n\nThe soup.original_encoding will give us\
    \ the original encoding, which is euc-jp in the previous case. This is wrong because\
    \ UnicodeDammit detected the encoding as euc-jp instead of utf-8.\n\n# Specifying\
    \ the encoding of the HTML document\n\nThe UnicodeDammit library detects the encoding\
    \ after a careful search of the entire document. This is time consuming and there\
    \ are cases where the UnicodeDammit library detects the encoding as wrong, as\
    \ observed previously. This wrong guess happens mostly when the content is very\
    \ short and there are similarities between the encodings. We can avoid these if\
    \ we know the encoding of the HTML document upfront. We can pass the encoding\
    \ to the BeautifulSoup constructor so that the excess time consumption and wrong\
    \ guesses can be avoided. The encoding is specified as a part of the constructor\
    \ in the from_encoding parameter. So in the previous case, we can specify the\
    \ encoding as utf-8.\n\n```\nsoup = BeautifulSoup(html_markup,\"lxml\",from_encoding=\"\
    utf-8\")\nprint(soup.prettify())\n```\n\n```\n#output\n<html>\n  <body>\n    <p>\n\
    \      The Spanish language is written using the Spanish alphabet,\n      which\
    \ is the Latin alphabet with one additional letter,\n      eñe (ñ), for a total\
    \ of 27 letters.\n    </p>\n  </body>\n</html>\n```"
  merge: -1
  img_proc: true
- pgno: 100
  md: "There are no longer gibberish characters because we have specified the correct\
    \ encoding and we can verify this from the output.\n\nThe encoding that we pass\
    \ should be correct, otherwise the character encoding will be wrong; for example,\
    \ if we pass the encoding as latin-1 in the preceding HTML fragment, the result\
    \ will be different.\n\n```\nsoup = BeautifulSoup(html_markup,\"lxml\",from_encoding=\"\
    latin-1\")\nprint(soup.prettify())\n\n#output\n'The Spanish language is written\
    \ using the Spanish alphabet, which\n  is the Latin alphabet with one additional\
    \ letter, eñe (ñ), for\na total of 27 letters.\n```\n\nSo it is better to pass\
    \ the encoding only if we are sure about the encoding used in the document.\n\n\
    # Output encoding\n\nEncoding support is also present for the output text from\
    \ Beautiful Soup. There are certain output methods in Beautiful Soup, for example,\
    \ prettify(), which will give the output only in the UTF-8 encoding. Even though\
    \ the encoding was something different like ISO 8859-2, the output will be in\
    \ UTF-8. For example, the following HTML content is an example of ISO8859-2 encoding:\n\
    \n```\nhtml_markup = \"\"\"\n<html>\n  <meta http-equiv=\"Content-Type\"\n   \
    \ content=\"text/html;charset=ISO8859-2\"/>\n  <p>cédille (from French), is a\
    \ hook or tail ( ž )  added under\n    certain letters as a diacritical mark to\
    \ modify their\n    pronunciation\n  </p>\"\"\"\nsoup = BeautifulSoup(html_markup,\"\
    lxml\")\n```\n\nThe soup.original_encoding will give us the encoding as ISO8859-2,\
    \ which is true for the preceding HTML code snippet. But print (soup.prettify())\
    \ will give the output in utf-8.\n\n```\n<html>\n  <head>\n    <meta content=\"\
    text/html;charset=utf-8\" http-equiv=\"Content-Type\"/>\n```"
  merge: -1
  img_proc: true
- pgno: 101
  md: "```\n```html\n</head>\n<body>\n  <p>\n    cÃ©dille (from French), is a hook\
    \ or tail ( Ł ) added under\n    certain letters as a diacritical mark to modify\
    \ their\n    pronunciation\n  </p>\n</body>\n</html>\n```\n```\n\nNote that the\
