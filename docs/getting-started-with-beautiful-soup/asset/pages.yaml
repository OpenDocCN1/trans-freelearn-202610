    # Special attributes for navigating down


    Getting text data within a particular tag is one of the common use cases in scraping.
    Beautiful Soup provides special attributes to navigate to the string contained
    within each Tag object using the attributes `.string` and `.strings`.


    # The .string attribute


    If a tag has `NavigableString` as the only child or if it has another tag that
    has a `NavigableString` object as a child, we can navigate to `NavigableString`
    using the `.string` attribute. As we know, `NavigableString` represents the text
    stored inside the tag; using `.string`, we navigate to the text stored inside
    the tag.


    ```

    ```python

    first_producer = soup.div

    print(first_producer.string)


    #output

    plants

    ```

    ```'
