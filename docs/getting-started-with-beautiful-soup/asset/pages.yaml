  md: '# # Encoding Support in Beautiful Soup


    All web pages will have an encoding associated with it. Modern websites have different
    encodings such as UTF-8, and Latin-1. Nowadays, UTF-8 is the encoding standard
    used in websites. So, while dealing with the scraping of such pages, it is important
    that the scraper should also be capable of understanding those encodings. Otherwise,
    the user will see certain characters in the web browser whereas the result you
    would get after using a scraper would be gibberish characters. For example, consider
    a sample web content from Wikipedia where we are able to see the Spanish character
    ñ.


    ### Alphabet


    The Spanish language is written using the Spanish alphabet, which is the Latin
    alphabet with one additional letter, ñ, for a total of 27 letters.


    | Letter | A | B | C | D | E | F | G | H | I |

    |---|---|---|---|---|---|---|---|---|---|

    | Name | a | be, be larga, be alta | ce | de | e | efe | ge | hache | i |

    | IPA | /a/ | /b/ | /k/, /θ/ | /d/ | /e/ | /f/ | /g/, /x/ | silent | /i/ |

    | Letter | J | K | L | M | N | Ñ | O | P | Q |

    | Name | jota | ka | ele | eme | ene | eñe | o | pe | cu |

    | IPA | /x/ | /k/ | /l/ | /m/ | /n/ | /ɲ/ | /o/ | /p/ | /k/ |

    | Letter | R | S | T | U | V | W | X | Y | Z |

    | Name | erre | ese | te | u | ve, uve, ve corta, ve baja | uve doble, doble ve,
    doble uve | equis | i griega, ye | zeta |

    | IPA | /r/, /ɾ/ | /s/ | /t/ | /u/ | /b/ | /ɡw/, /β/ | /ks/, /ɣ/, /s/ | /ʝ/, /ʎ/
    | /θ/ |'
