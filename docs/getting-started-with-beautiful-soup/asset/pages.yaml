  md: "# Search Using Beautiful Soup\n\nNow, we can change to the Soup directory using\
    \ the following command:\n\n```\n```bash\ncd Soup.\n```\n```\n\nWe can save the\
    \ following code as `ecologicalpyramid.py` and use python `ecologicalpyramid.py`\
