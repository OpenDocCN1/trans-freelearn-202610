- pgno: 44
  md: "# Search Using Beautiful Soup\n\nIf we analyze the HTML, we can see that the\
    \ first primary consumer is stored as follows:\n\n```\n```html\n<ul id=\"primaryconsumers\"\
    >\n    <li class=\"primaryconsumerlist\">\n        <div class=\"name\">deer</div>\n\
    \        <div class=\"number\">1000</div>\n    </li>\n</ul>\n```\n```\n\nWe can\
    \ see that the first primary consumer is stored inside the first `<div>` tag of\
    \ the first `<li>` tag. The second line prints the string stored inside this `<div>`\
    \ tag, which is the first primary consumer name, which is deer.\n\nSearching based\
    \ on attribute values will work for most of the attributes, such as id, style,\
    \ and title. But, there are some exceptions in the case of a couple of attributes\
    \ as follows:\n\n+   - Custom attributes\n+   - Class\n\nIn these cases, although\
    \ we can't go directly with the attribute-value-based search, we can use the attrs\
    \ argument that can be passed into the find() method.\n\n# Searching based on\
    \ custom attributes\n\nIn HTML5, it is possible to add custom attributes such\
    \ as data-custom to a tag. If we want Beautiful Soup to search based on these\
    \ attributes, it will not be possible to use it like we did in the case of the\
    \ id attribute.\n\nFor searching based on the id attribute, we used the following\
    \ code line:\n\n```\n```python\nsoup.find(id=\"primaryconsumer\")\n```\n```\n\n\
    But, if we use the attribute value the same way for the following HTML, the code\
    \ will throw an error as keyword can't be an expression:\n\n```\n```python\ncustomattr\
    \ = \"\"\"<p data-custom=\"custom\">custom attribute\n    example</p>\"\"\"\n\
    customsoup = BeautifulSoup(customattr,'lxml')\ncustomSoup.find(data-custom=\"\
    custom\")\n```\n```\n\nThe error is thrown because Python variables cannot contain\
    \ a - character and the data-custom variable that we passed contained a - character."
  merge: -1
  img_proc: true
- pgno: 45
  md: "In such cases, we need to pass in the keyword arguments as a dictionary in\
    \ the `attrs` argument as follows:\n\n```\nusing_attrs = customsoup.find(attrs={'data-custom':'custom'})\n\
    print(using_attrs)\n\n#output\n'<p data-custom=\"custom\">custom attribute example</p>'\n\
    ```\n\n# Searching based on the CSS class\n\nThe `class` argument is a reserved\
    \ keyword in Python and so, we will not be able to use the keyword argument `class`.\
    \ So in the case of the CSS classes also, we can use the same process as we did\
    \ for custom attributes, as shown in the following code:\n\n```\ncss_class = soup.find(attrs={'class':'primaryconsumerlist'})\n\
    print(css_class)\n\n#output\n<li class=\"primaryconsumerlist\">\n    <div class=\"\
    name\">deer</div>\n    <div class=\"number\">1000</div>\n</li>\n```\n\nSince searching\
    \ based on `class` is a common thing, Beautiful Soup has a special keyword argument\
    \ that can be passed for matching the CSS class. The keyword argument that we\
    \ can use is `class_` and since this is not a reserved keyword in Python, it won't\
    \ throw an error.\n\nLine 1:\n\n```\ncss_class = soup.find(class_ = \"primaryconsumers\"\
    \ )\n```\n\nLine 2:\n\n```\ncss_class = soup.find(attrs={'class':'primaryconsumers'})\n\
    ```\n\nThe preceding two code lines are same.\n\n# Searching using functions defined\n\
    \nWe can pass functions to the `find()` method for searching based on the conditions\
    \ defined within the function. The function should return a true or false value.\
    \ The corresponding tag, as defined by the function, will be found by the BeautifulSoup\
    \ object."
  merge: -1
  img_proc: true
- pgno: 46
  md: "Let's take an example of finding the secondary consumers using functions within\
    \ the find() method:\n\n```\ndef is_secondary_consumers(tag):\n    return tag.has_attr('id')\
    \ and tag.get('id') ==\n        'secondaryconsumers'\n```\n\nThe function checks\
    \ whether the tag has the id attribute and if its value is secondaryconsumers.\
    \ If the two conditions are met, the function will return true, and so, we will\
    \ get the particular tag we were looking for in the following code:\n\n```\nsecondary_consumer\
    \ = soup.find(is_secondary_consumers)\nprint(secondary_consumer.li.div.string)\n\
    \n#output\nfox\n```\n\nWe use the find() method by passing the function that returns\
    \ either true or false, and so, the tag for which the function returns true is\
    \ displayed, which in our case, corresponds to the first secondary consumer.\n\
    \n# Applying searching methods in combination\n\nWe saw how to search based on\
    \ text, tag, attribute value, regular expression, and so on. Beautiful Soup also\
    \ helps in searching based on the combination of any of these methods.\n\nIn the\
    \ preceding example, we discussed searching based on the attribute value. It was\
    \ easy since the attribute value was present on only one type of tag (for example,\
    \ in id='secondaryconsumers', the value was present only on the <ul> tag).\n\n\
    But, what if there were multiple tags with the same attribute value? For example,\
    \ refer to the following code:\n\n```\n<p class=\"identical\">\n    Example of\
    \ p tag with class identical\n</p>\n<div class=\"identical\">\n    Example of\
    \ div tag with class identical\n</div>\n```\n\nHere, we have a div tag and a p\
    \ tag with the same class attribute value \"identical\". In this case, if we want\
    \ to search only for the div tag with the class attribute's value = identical,\
    \ we can use a combination of search using a tag and attribute value within the\
    \ find() method."
  merge: -1
  img_proc: true
- pgno: 47
  md: "Let us see how we can search based on the preceding combination:\n\n```\nidentical_div=\
