    \ class=\"identical\">\n    Example of div tag with class identical\n</div>\n\
    ```\n\nSimilarly, we can have any combination of the searching methods.\n\n# Searching\
    \ with find_all()\n\nThe find() method was used to find the first result within\
    \ a particular search criteria that we applied on a BeautifulSoup object. As the\
    \ name implies, find_all() will give us all the items matching the search criteria\
    \ we defined. The different filters that we see in find() can be used in the find_all()\
    \ method. In fact, these filters can be used in any searching methods, such as\
    \ find_parents() and find_siblings().\n\nLet us consider an example of using find_all().\n\
    \n# Finding all tertiary consumers\n\nWe saw how to find the first and second\
