- pgno: 29
  md: 'If we want Beautiful Soup to consider the input to be parsed as XML instead,
    we need to explicitly specify this using the `features` argument in the `BeautifulSoup`
    constructor. By specifying the `features` argument, BeautifulSoup will be able
    to pick up the best suitable `TreeBuilder` that satisfies the features we requested.


    # Understanding the features argument


    The `TreeBuilders` class use an underlying parser for input processing. Each `TreeBuilder`
    will have a different set of features based on the parser it uses. So the input
    is treated differently based on the features argument being passed to the constructor.
    The parsers currently used by different `TreeBuilders` in Beautiful Soup are as
    follows:


    +   - `lxml`

    +   - `html5lib`

    +   - `html.parser`


    The `features` argument of the `BeautifulSoup` constructor can accept either a
    list of strings or a string value. The currently supported features by each `TreeBuilder`
    and the underlying parsers are described in the following table:


    | Features | TreeBuilder | Parser |

    |---|---|---|

    | [''lxml'',''html'',''fast'',''permissive''] | LXMLTreeBuilder | lxml |

    | [''html'',''html5lib'',''permissive'',''strict'',''html5''] | HTML5TreeBuilder
    | html5lib |

    | [''html'',''strict'',''html.parser''] | HTMLParserTreeBuilder | html.parser
    |

    | [''xml'',''lxml'',''permissive'',''fast''] | LXMLTreeBuilderForXML | lxml |


    The `features` argument can be specified as a list of strings or a string value.
    Beautiful Soup picks the best suitable `TreeBuilder`, which has the feature(s)
    specified. The order of picking a `Treebuilder` in the case of an HTML document
    is based on the priority of the parsers upon which they are built. The first being
    `lxml`, followed by `html5lib`, and at last `html.parser`. For example, if we
    provide `html` as the feature, Beautiful Soup will pick `lxmlTreeBuilder`, if
    the `lxml` parser is available. If the `lxml` parser is not available, it picks
    `HTML5TreeBuilder` based on the `html5lib` parser, and if the `html5lib` parser
    is also not available, then `HTMLPraserTreeBuilder` is picked based on the `html.parser`.
    For XML, since `lxml` is the only available parser, `LXMLTreeBuilderForXML` is
    always selected.'
  merge: -1
  img_proc: true
- pgno: 30
  md: "# Creating a BeautifulSoup Object\n\nWe can specify the features argument in\
    \ the BeautifulSoup constructor for considering the input for XML processing as\
    \ follows:\n\n```\nsoup_xml = BeautifulSoup(helloworld,features=\"xml\")\n```\n\
    \nAnother alternative is by using the following code line:\n\n```\nsoup_xml =\
    \ BeautifulSoup(helloworld,\"xml\")\n```\n\nIn the previous code, we passed xml\
    \ as the value for the features argument and created the soup_xml object. We can\
    \ see that the same content (\"<p>HelloWorld</p>\") is now being treated as XML\
    \ instead of HTML.\n\n```\nprint(soup_xml)\n```\n\n```\n#output\n<?xml version=\"\
    1.0\" encoding=\"utf-8\"?>\n<p>Hello World</p>\n```\n\nIn the previous example,\
    \ Beautiful Soup has picked LXMLTreeBuilderForXML based on the lxml parser and\
    \ parsed the input as XML.\n\n> The features argument helps us to choose between\
    \ HTML/XML parsing for the document.\n\nBy providing the features argument we\
    \ are specifying the features that a TreeBuilder should have. In case Beautiful\
    \ Soup is unable to find a TreeBuilder with the given features, an error is thrown.\
    \ For example, assume that lxml, which is the only parser currently used by Beautiful\
    \ Soup for XML processing, is not present in the system. In this case, if we use\
    \ the following line of code:\n\n```\nsoup_xml = BeautifulSoup(helloworld,features=\"\
    xml\")\n```\n\nThe previous code will fail and throw the following error (since\
    \ lxml is not installed in the system):\n\n```\nbs4.FeatureNotFound: Couldn't\
    \ find a tree builder with the\n    features you requested: xml. Do you need to\
    \ install a parser\n    library?\n```\n\nIn this case, we should install the required\
    \ parsers using easy_install, pip, or setup.py install."
  merge: -1
  img_proc: true
- pgno: 31
  md: 'It is always a better practice to specify the parser to be used while creating
    a BeautifulSoup object. This is due to the fact that different parsers parse the
    content differently. This is more evident in cases where we give invalid HTML
    content to parse. The three parsers discussed previously produce three types of
    HTML trees in the case of an invalid HTML. For example:


    ```

    invalid_html = ''<a invalid content''

    ```


    Here the HTML is invalid since there is no closing </a> tag. The processing of
    this invalid HTML using the previously mentioned parsers is given as follows:


    +   - By using the lxml parser, which is shown as follows:

    +     soup_invalid_html = BeautifulSoup(invalid_html, ''lxml'')

    +     The print(soup_invalid_html) code line will give the HTML tree produced
    using the lxml parser.

    +     <html><body><a invalid content=""></a></body></html>

    +     From the output, it is clear that the lxml parser has processed the invalid
    HTML. It added the closing </a> tag and also considered the invalid content as
    an attribute of the <a> tag. Apart from this, it has also added the <html> and
    <body> tags, which was not present in the input. Addition of the <html> and <body>
    tags will be done by default if we use lxml.

    +   - By using the html5lib parser, which is shown as follows:

    +     soup_invalid_html = BeautifulSoup(invalid_html, ''html5lib'')

    +     The print(soup_invalid_html) code line will show us the HTML tree produced
    using the html5lib parser.

    +     <html><head></head><body></body></html>

    +     From the output, it is clear that the html5lib parser has added the <html>,
    <head>, and <body> tags, which was not present in the input. For example, the
    lxml parser and the html5lib parser will also add these tags for any input. But
    at the same time, it has discarded the invalid <a> tag to produce a different
    representation of the input.

    +   - By using the html.parser, which is shown as follows:

    +     soup_invalid_html =

    +       BeautifulSoup(invalid_html,''html.parser'')'
  merge: -1
  img_proc: true
- pgno: 32
  md: '# Creating a BeautifulSoup Object


    The `print(soup_invalid_html)` code line will show us the HTML tree produced using
    the `html.parser`.


    The `html.parser` has discarded the invalid HTML and produced an empty tree. Unlike
    the other parsers, it doesn''t add any of the `<html>`, `<head>`, or `<body>`
    tags.


    So it is good to specify the parser by giving the `features` argument because
    this helps to ensure that the input is processed in the same manner across different
    machines. Otherwise, there is a possibility that the same code will break in one
    of the machines if some invalid HTML is present, as the default parser that is
    picked up by Beautiful Soup will produce a different tree. Specifying the `features`
    argument helps to ensure that the tree generated is identical across all machines.


    While creating the BeautifulSoup object, other objects are also created, which
    include the following:


    +   - Tag

    +   - NavigableString


    # Tag


    The Tag object represents different tags of HTML and XML documents. The creation
    of Tag objects is done when parsing the documents. The different HTML/XML tags
    identified during parsing are represented as corresponding Tag objects and these
    objects will have attributes and contents of the HTML/XML tag. The Tag objects
    can be used for searching and navigation within the HTML/XML document.


    # Accessing the Tag object from BeautifulSoup


    BeautifulSoup allows us to access any Tag object. For example, we can access the
    first occurrence of the `<a>` tag in the next example by simply calling the name
    of the tag `<a>`.


    ```

    html_atag = """<html><body><p>Test html a tag example</p>

    <a href=''http://www.packtpub.com''>Home</a>

    <a href=''http://www.packtpub.com/books''>Books</a>

    </body>

    </html>"""

    soup  = BeautifulSoup(html_atag,''lxml'')

    atag  = soup.a

    print(atag)

    ```'
  merge: -1
  img_proc: true
- pgno: 33
  md: 'The previous script will print the first <a> tag in the document. We can see
    that type(atag) is ''bs4.element.Tag''.


    HTML/XML tags have names (for example, the name for the tag <a> is a and the tag
    <p> is p) and attributes (for example, class, id, and style). The Tag object allows
    us to get the name and attributes associated with each HTML tag.


    # Name of the Tag object


    The name of the Tag object is accessible via the .name property.


    ```

    tagname = atag.name

    print tagname

    ```


    The previous code prints the name of the object atag, which is nothing but the
    name of the tag <a>.


    We can change the name of the tag by changing the value of the .name property.


    This is shown in the following example:


    ```

    atag.name = ''p''

    print(soup)


    #output

    <html><body><p>Test html a tag example</p>

    <p href="http://www.packtpub.com">Home</p>

    <a href="http://www.packtpub.com/books">Books</a>

    </body></html>

    ```


    From the output, we can see that first the <a> tag was replaced with the <p> tag.


    # Attributes of a Tag object


    Attributes give a tag meaning and context. In the previous example, the href attribute
    adds the URL information for the <a> tag. In HTML pages, the tags might have different
    attributes, for example, class, id, and style. The attributes of a tag can be
    accessed by considering the Tag object as a dictionary.


    ```

    atag = soup_atag.a

    print (atag[''href''] )


    #output

    http://www.packtpub.com

    ```'
  merge: -1
  img_proc: true
- pgno: 34
  md: '# Creating a BeautifulSoup Object


    The previous code prints the URL (`http://www.packtpub.com`) associated with the
    first `<a>` tag by accessing the value of the href attribute.


    Different attributes associated with a tag can be accessed using the `.attrs`
    property.


    The `print(atag.attrs)` code line gives `{''href'':''http://www.packtpub.com''}`.


    Apart from the name and attributes, a Tag object has helper methods for navigating
    and searching through the document, which we will discuss in the following chapters.


    # The NavigableString object


    A NavigableString object holds the text within an HTML or an XML tag. This is
    a Python Unicode string with methods for searching and navigation. Sometimes we
    may need to navigate to other tags or text within an HTML/XML document based on
    the current text. With a normal Python Unicode string, the searching and navigation
    methods will not work. The NavigableString object will give us the text within
    a tag as a Unicode string, together with the different methods for searching and
    navigating the tree.


    We can get the text stored inside a particular tag by using `.string`.


    ```

    first_a_string = soup_atag.string

    ```


    In the previous code, the NavigableString object (`first_a_string`) is created
    and this holds the string inside the first `<a>` tag, u''Home''.


    # Quick reference


    You can view the following references to get an overview of creating the following
    objects:


    +   - BeautifulSoup

    +     - `soup = BeautifulSoup(string)`

    +     - `soup = BeautifulSoup(string,features="xml")`  #for xml

    +   - Tag

    +     - `tag = soup.tag`  #accessing a tag

    +     - `tag.name`        #Tag name

    +     - `tag[''attribute'']`  #Tag attribute'
