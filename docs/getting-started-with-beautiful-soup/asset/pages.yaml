    # Searching for Tags in relation


    Searching for contents within an HTML page is easy using the find() and find_all()
    methods. During complex web scraping projects, it will be very easy for a user
    to visit the subsequent tags or the parent tags for extra information.


    These tags that we intend to visit will be in a direct relationship with the tag
    we already searched. For example, we may need to find the immediate parent tag
    of a particular tag. Also, there will be situations to find the previous tag,
    next tag, tags that are in the same level (siblings), and so on. In these cases,
    there are searching methods provided within the BeautifulSoup object, for example,
    find_parents(), find_next_siblings(), and so on. Normally, we use these methods
    followed by a find() or find_all() method since these methods are used for finding
    one particular tag and we are interested in finding the other tags, which are
    in relation with this tag.


    # Searching for the parent tags


    We can find the parent tags associated with a tag by using the find_parents()
    or find_parent() methods. Likewise, find_all() and find() differ only in the number
    of results they return. The find_parents() method returns the entire matching
    parent tags, whereas find_parent() returns the first immediate parent. The searching
    methods that we discussed in find() can be used for find_parent() and find_parents().


    In the primary consumer example, we can find the immediate parent tag associated
    with primaryconsumer as follows:


    ```

    primaryconsumers = soup.find_all(class_="primaryconsumerlist")

    primaryconsumer = primaryconsumers[0]

    parent_ul = primaryconsumer.find_parents(''ul'')

    print(parent_ul)

    ```'
