    \        <div class=\"number\">100000</div>\n    </li>\n    <li class=\"producerlist\"\
    >\n        <div class=\"name\">algae</div>\n        <div class=\"number\">100000</div>\n\
    \    </li>\n</ul>\"\"\"\nsoup = BeautifulSoup(html_markup,\"lxml\")\nprint(soup.get_text())\n\
    \n#output\nplants\n100000\n\nalgae\n100000\n```\n\nThe get_text() method returns\
    \ the text inside the Beautiful Soup or Tag object as a single Unicode string.\
    \ But get_text() has issues when dealing with web pages. Web pages often have\
    \ JavaScript code, and the get_text() method returns the JavaScript code as well.\
    \ For example, in Chapter 3, Search Using Beautiful Soup, we saw the example of\
    \ scraping book details from packtpub.com.\n\n```\nimport urllib2\nfrom bs4 import\
    \ BeautifulSoup\nurl = \"http://www.packtpub.com/books\"\npage = urllib2.urlopen(url)\n\
    soup_packtpage = BeautifulSoup(page,\"lxml\")\n```\n\nWe can print the text inside\
    \ the page using get_text(); this is shown in the following code snippet:\n\n\
    ```\nprint(soup_packtpage.get_text())\n```"
