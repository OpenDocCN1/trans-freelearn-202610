  md: "# Using get_text()\n\nGetting just text from websites is a common task. Beautiful\
    \ Soup provides the method get_text() for this purpose.\n\nIf we want to get only\
    \ the text of a Beautiful Soup or a Tag object, we can use the get_text() method.\
    \ For example:\n\n```\nhtml_markup = \"\"\"<p class=\"ecopyramid\">\n<ul id=\"\
