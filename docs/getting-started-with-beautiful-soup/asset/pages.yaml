  md: '# Searching for siblings


    In a particular html document, we can say that particular tags are siblings, if
    they are at the same level. For example, in the ecological pyramid, all of the
    <ul> tags are on the same level and they are siblings if we define a relationship.
    We can understand this from the following diagram, which is a representation of
    the relationship between the first div tag and the ul tags:


    ![](img/c437561ffd11fadb571896e0a4ca4d18_52_0.png)


    This means that in our example, the ul tags with the classes producers, primaryconsumers,
    secondaryconsumers, and teritiaryconsumers are siblings.


    Also, in the following diagram for producers, we can see that the plants value,
    which is the first producer and algae, which is the second producer, cannot be
    treated as siblings, since they are not at the same level:


    ![](img/c437561ffd11fadb571896e0a4ca4d18_52_1.png)


    But, both div with the value plants and the value for number 10000 can be considered
    as siblings, as they are at the same level.'
