- pgno: 113
  md: '# 8


    # Creating a Web Scraper


    In this chapter, we will create a website scraper using the different searching
    and navigation techniques we studied in the previous chapters. The scraper will
    visit three websites to find the selling price of books based on the ISBN. We
    will first find out the book list and selling price from packtpub.com. We will
    also find the ISBN of the books from packtpub.com and search other websites such
    as www.amazon.com and www.barnesandnoble.com based on this ISBN. By doing this,
    we will automate the process of finding the selling price of the books on three
    websites and will also get a hands-on experience in implementing scrapers for
    these websites. Since the website structure may change later, the code examples
    and images used in this chapter may also become invalid. So, it is better to take
    the examples as a reference and change the code accordingly. It is good to visit
    these websites for a better understanding.


    # Getting book details from PacktPub.com


    Getting book details from www.packtpub.com is the first step in the creation of
    the scraper. We need to find the following details from PacktPub.com:


    +   - Book title name

    +   - Selling price

    +   - ISBN


    We have seen how to scrape the book title and the selling price from packtpub.com
    in Chapter 3, Search Using Beautiful Soup. The example we discussed in that chapter
    considered only the first page and didn''t include the other pages that also had
    the list of books. So in the next topic, we will find different pages containing
    a list of books.'
  merge: -1
  img_proc: true
- pgno: 114
  md: '# Finding pages with a list of books


    The page at www.packtpub.com/books has the next and previous navigation links
    to go back and forth between the pages containing a list of books, as shown in
    the following screenshot:


    ![](img/c437561ffd11fadb571896e0a4ca4d18_114_0.png)


    So, we need to find out a method for getting multiple pages that contain the list
    of books. Logically, it seems to look at the page being pointed at by the next
    element in the current page. Taking a look at the next element, for page 49, using
    the Google Chrome developer tools, we can see that it actually points to the next
    page link, that is, /books?page=49. If we observe different pages using the Google
    Chrome developer tools, we can see that the link to the next page''s actually
    has a pattern of /books?page=n for the n+1 page, that is, n=49 for the 50th page,
    as shown in the following screenshot:


    ![](img/c437561ffd11fadb571896e0a4ca4d18_114_1.png)


    From the preceding screenshot, we can further understand that the next element
    is within the <li> tag with class="pager-next last". Inside the <li> tag, there
    is an <a> tag that holds the link to the next page. In this case, the corresponding
    value is /books?page=49, which points to the 50th page. We have to add www.packtpub.com
    to this value to make a valid URL, as www.packtpub.com/books?page=49.'
  merge: -1
  img_proc: true
- pgno: 115
  md: "If we analyze the packtpub.com website, we can see that the list of published\
    \ books ends at page 50. So, we need to ensure that our program stops at this\
    \ page. The program can stop looking for more pages if it is unable to find the\
    \ next element.\n\nFor example, as shown in the following screenshot, for page\
    \ 50, we don't have the next element:\n\n![](img/c437561ffd11fadb571896e0a4ca4d18_115_0.png)\n\
    \nSo at this point, we can stop looking for further pages.\n\nOur logic for getting\
    \ pages should be as follows:\n\n+   1. Start with the first page.\n+   2. Check\
    \ if it has a next element:\n+      - If yes, store the next page URL\n+     \
    \ - If no, stop looking for further pages\n+   3. Load page at URL and repeat\
    \ the preceding step.\n\nWe can use the following code to find pages containing\
    \ a list of books from packtpub.com:\n\n```\nimport urllib2\nimport re\nfrom bs4\
    \ import BeautifulSoup\npacktpub_url = \"http://www.packtpub.com/\"\n```\n\nWe\
    \ stored http://packtpub.com in the packtpub_url variable. Each next element link\
    \ should be prefixed with packtpub_url to form a valid URL, http://www.packtpub.com/book?page=n,\
    \ as shown in the following code:\n\n```\ndef get_bookurls(url):\n    page = urllib2.urlopen(url)\n\
    \    soup_packtpage = BeautifulSoup(page,\"lxml\")\n```"
  merge: -1
  img_proc: true
- pgno: 116
  md: "```\npage.close()\nnext_page_li = soup_packtpage.find(\"li\", class_=\"pager-next\n\
    \    last\")\nif next_page_li is None :\n    next_page_url = None\nelse:\n   \
    \ next_page_url = packtpub_url+next_page_li.a.get('href')\n\nreturn next_page_url\n\
    ```\n\nThe preceding get_bookurls() function returns the next page URL if we provide\
    \ the current page URL. For the last page, it returns None.\n\nIn get_bookurls(),\
    \ we created a BeautifulSoup object, soup_packtpage, based on the URL input and\
    \ then searched for the li tag with the pager-next last class. If find() returns\
    \ a tag, we can get the link to the next page using next_page_li.a.get('href').\
    \ We prefixed this value with packtpub_url and it is returned.\n\nWe need a list\
    \ of such page URLs (for example www.packtpub.com/books, www.packtpub.com/books?page=2,\
    \ and so on) to collect details of all the books on those pages.\n\nIn order to\
    \ create this list to collect these details, use the following code:\n\n```\n\
    start_url = \"www.packtpub.com/books\"\ncontinue_scrapping = True\nbooks_url =\
    \ [start_url]\nwhile continue_scrapping:\n    next_page_url= get_bookurls(start_url)\n\
    \    if next_page_url is None:\n        continue_scraping = False\n    else:\n\
    \        books_url.append(next_page_url)\n    start_url = next_page_url\n```\n\
    \nIn the preceding code, we started with the URL www.packtpub.com/books and stored\
    \ it in the books_url list. We used a flag, continue_scraping, to control the\
    \ execution of the function and we can see that the loop will terminate when get_bookurls\
    \ returns None.\n\nThe print(books_url) entry prints the different URL from www.packtpub.com/books\
    \ to www.packtpub.com/books?page=49."
  merge: -1
  img_proc: true
- pgno: 117
  md: "# Finding book details\n\nNow, it is time for us to find the details of each\
    \ book, such as the book title, selling price, and ISBN. The book title and selling\
    \ price can be found from the main page with the list of books. But the ISBN can\
    \ be found only on the details page of each book. So from the main pages, for\
    \ example, www.packtpub.com/books, we have to find the corresponding link to fetch\
    \ the details of each book.\n\nWe can use the following code to find the details\
    \ of each book:\n\n```\ndef get_bookdetails(url):\n    page = urllib2.urlopen(url)\n\
    \    soup_packtpage = BeautifulSoup(page,\"lxml\")\n    page.close()\n    all_books_table\
    \ = soup_packtpage.find(\"table\",class_=\"views-view-grid\")\n    all_book_titles\
    \ =all_books_table.find_all(\"div\",class_=\"views-field-title\")\n    isbn_list\
    \ = []\n    for book_title in all_book_titles:\n        book_title_span = book_title.span\n\
    \        print(\"Title Name:\"+book_title_span.a.string)\n        print(\"Url:\"\
    +book_title_span.a.get('href'))\n        price = book_title.find_next(\"div\"\
    ,class_=\"views-field-sell-price\")\n        print(\"Packtpub Price:\"+price.span.string)\n\
    \        isbn_list.append(get_isbn(book_title_span.a.get('href')))\n    return\
    \ isbn_list\n```\n\nThe preceding code is the same as the code we used in Chapter\
    \ 3, Search Using Beautiful Soup, to get the book details. An addition is the\
    \ use of isbn_list to hold the ISBN numbers and the get_isbn function that returns\
    \ the ISBN for a particular book."
  merge: -1
  img_proc: true
- pgno: 118
  md: '# Creating a Web Scraper


    The ISBN of a book is stored in the book''s details page, as shown in the following
    screenshot:


    ![](img/c437561ffd11fadb571896e0a4ca4d18_118_0.png)


    In the preceding get_bookdetails() function, the book_title_span.a.get(''href'')
    function holds the URL to the details page of each book. We pass the preceding
    value to the get_isbn() function to get the ISBN.


    The details page of a book when viewing through the developer tools has the ISBN,
    as shown in the following screenshot:


    ![](img/c437561ffd11fadb571896e0a4ca4d18_118_1.png)'
  merge: -1
  img_proc: true
- pgno: 119
  md: "From the preceding screenshot, we can see that the **ISBN** number is stored\
    \ as text followed by the ISBN inside the b tag.\n\nNow, in the following code,\
    \ let us see how we can find the ISBN using the `get_isbn()` function:\n\n```\n\
    def get_isbn(url):\n    book_title_url = packtpub_url + url\n    page = urllib.urlopen(book_title_url)\n\
    \    soup_bookpage = BeautifulSoup(page,\"lxml\")\n    page.close()\n    isbn_tag\
    \ = soup_bookpage.find('b',text=re.compile(\"ISBN :\"))\n    return isbn_tag.next_sibling\n\
    ```\n\nIn the preceding code, we searched for the b tag with the text that matches\
    \ the pattern ISBN :. The ISBN is `next_sibling` of the b tag.\n\nIn each main\
    \ page, there will be a list of books, and for each book, there will be an ISBN.\
    \ So we need to call the `get_bookdetails()` method for each of the `books_url`\
    \ lists as follows:\n\n```\nisbns = []\nfor bookurl in books_url:\n    isbns+=\
    \ get_bookdetails(bookurl)\n```\n\nThe `print(isbns)` function will print the\
    \ list of ISBNs for all the books that are currently published by packtpub.com.\n\
    \nWe scraped the selling price, book title, and ISBN from the PacktPub website.\
    \ We will use the ISBN to search for the selling price of the same books in both\
    \ `www.amazon.com` and `www.barnesandnoble.com`. With that, our scraper will be\
    \ complete.\n\n# Getting selling prices from Amazon\n\nWe can search on Amazon\
    \ for books based on their ISBNs. Normally, we will use the default search page\
    \ on Amazon and enter the ISBN. We can do this manually, but from a program or\
    \ scraper, we should know the URL to request based on the ISBN. Let us go to the\
    \ Amazon site and search for this book with the ISBN, as shown in the following\
    \ screenshot:\n\n![](img/c437561ffd11fadb571896e0a4ca4d18_119_0.png)"
  merge: -1
  img_proc: true
- pgno: 120
  md: "The page generated after the search in Amazon will have a URL structure as\
    \ follows:\n\n```\nhttp://www.amazon.com/s/ref=nb_sb_noss?url=search-alias%3Daps&field-keywords=1783289554\n\
    ```\n\nIf we search based on another ISBN, that is, http://www.amazon.com/s/ref=nb_sb_noss?url=search-alias%3Daps&field-keywords=1847195164,\
    \ we will see that it gives us back the details based on the 1847195164 ISBN.\n\
    \nFrom this, we can conclude that if we substitute field-keywords of the URL with\
    \ the corresponding ISBN, we will be getting the details for that ISBN.\n\nFrom\
    \ the http://www.amazon.com/s/ref=nb_sb_noss?url=search-alias%3Daps&field-keywords=1783289554\
    \ page, we have to find the selling price for the book. We can follow the same\
    \ method to use the Google Chrome developer tools to see which tag holds the selling\
    \ price.\n\n![](img/c437561ffd11fadb571896e0a4ca4d18_120_0.png)\n\nFrom the preceding\
    \ screenshot, we can see that the price is stored inside the div tag with the\
    \ newPrice class. We can find the selling price from Amazon using the following\
    \ code:\n\n```\ndef get_sellingprice_amazon(isbn):\n    url_foramazon = \"http://www.amazon.com/s/ref=nb_sb_noss?url=search-alias%3Daps&field-keywords=\"\
    \n    url_for_isbn_inamazon = url_foramazon+isbn\n    page = urllib2.urlopen(url_for_isbn_inamazon)\n\
    \    soup_amazon = BeautifulSoup(page, \"lxml\")\n```"
  merge: -1
  img_proc: true
- pgno: 121
  md: '```

    page.close()\nselling_price_tag = soup_amazon.find(''div'',class_="newPrice")\nif
    selling_price_tag:\n    print ("Amazon Price"+selling_price_tag.span.string)

    ```


    We created the soup object based on the URL. After creating the soup object, we
    found the div tags with the newPrice class. The selling price is stored inside
    the `<span>` tag and we print it using `print (selling_price_tag.span.string)`.


    # Getting the selling price from Barnes and Noble


    We have to use the same strategy we used for Amazon to find the selling price
    on the Barnes and Noble website. For this, we need to perform the following steps:


    +   1. Find the URL for each ISBN

    +   2. Find a way to scrape the selling price


    The URL that can be used for Barnes and Noble is `http://www.barnesandnoble.com/s/ISBN`,
    where ISBN is the ISBN value, for example, `http://www.barnesandnoble.com/s/1904811590`.


    Now, we have to find the selling price from the page. The page at Barnes and Noble
    will have the selling price listed in a div tag with the price class (highlighted)
    in the following screenshot:


    ![](img/c437561ffd11fadb571896e0a4ca4d18_121_0.png)'
  merge: -1
  img_proc: true
- pgno: 122
  md: "# Creating a Web Scraper\n\nWe can find the selling price from Barnes and Noble\
    \ using the following code:\n\n```\n```python\ndef get_sellingprice_barnes(isbn):\n\
    \    url_forbarnes = http://www.barnesandnoble.com/s/\n    url_for_isbn_barnes\
    \ = url_forbarnes+isbn\n    page = urllib2.urlopen(url_for_isbn_inbarnes,\"lxml\"\
    )\n    soup_barnes = BeautifulSoup(page,\"lxml\")\n    page.close()\n    selling_price_tag\
    \ = soup_barnes.find('div',class_=\"price\n        hlight\")\n    if selling_price_tag:\n\
    \        print (\"Barnes Price\"+selling_price_tag.string)\n```\n```\n\nThe entire\
    \ code for creating a web scrapper would be available at the code bundle\n\n>\
    \ \U0001F4A1 The previous scraper can be freely download from the library\n\n\
    # Summary\n\nIn this chapter, we created a sample scraper using Beautiful Soup.\
    \ We used the search and navigation methods of Beautiful Soup to get information\
    \ from packetpub.com, amazon.com, and barnesandnoble.com."
