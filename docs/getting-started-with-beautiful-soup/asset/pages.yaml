- pgno: 70
  md: "# The .strings attribute\n\nEven if there are multiple child objects comprising\
    \ of string and other tags, we can still get the string of each child using the\
    \ `.strings` generator. In the previous example, we have the `<li>` tag with two\
    \ `<div>` tags as children. These `<div>` tags contain strings. We can get these\
    \ strings from the parent `<li>` tag using the `.strings` generator, which is\
    \ shown as follows:\n\n```\nfor string in li.strings:\n    print(string)\n#output\n\
    plants\n10000\n```\n\n# Navigating up\n\nLike navigating down to find children,\
    \ Beautiful Soup allows users to find the parents of a particular Tag/NavigableString\
    \ object. Navigating up is done using `.parent` and `.parents`.\n\n# The .parent\
    \ attribute\n\nFrom the first figure, we understand that all Tag and NavigableString\
    \ objects have a parent. The parent of a particular Tag object can be found using\
    \ the attribute `.parent`.\n\n```\nproducer_entries = soup.ul\nprint(producer_entries.parent)\n\
    \n#output\ndiv\n```\n\nThe `.parent` attribute of the top most `<html>`/`<xml>`\
    \ tag is the BeautifulSoup object itself.\n\n```\nhtml_tag = soup.html\nprint(html_tag.parent.name)\n\
    \n#output\nu' [document] '\n```"
  merge: -1
  img_proc: true
- pgno: 71
  md: "Since the soup object is at the root of the tree, it didn't have a parent.\
    \ So `.parent` on the soup object will return None.\n\n```\nprint(soup.parent)\n\
    \n#output\nNone\n```\n\n# The `.parents` attribute\n\nThe `.parents` attribute\
    \ is a generator that holds parents of a particular Tag/`NavigableString`.\n\n\
    ```\nthird_div = soup.find_all(\"div\")[2]\n```\n\nIn the previous code, we store\
    \ the third `<div>` entry, which is `<div class=\"name\">algae</div>` in `third_div`.\n\
    \nUsing this we iterate through the parents of this tag.\n\n```\nfor parent in\
    \ third_div.parents:\n    print(parent.name)\n#output\n\nli\nul\nbody\nhtml\n\
    [document]\n```\n\nIn the previous code, we navigate to the `<li>` tag, which\
    \ is the immediate parent object of `third_div`, then to the `<ul>` tag, which\
    \ is the parent of the `<li>` tag. Likewise, navigation to the html tag and finally\
    \ `[document]`, which represents the soup object, is done.\n\n# Navigating sideways\
    \ to the siblings\n\nApart from navigating through the content up and down the\
    \ HTML tree, Beautiful Soup also provides navigation methods to find the siblings\
    \ of an object. Navigating to the siblings is possible using `.next_sibling` and\
    \ `.previous_sibling`."
  merge: -1
  img_proc: true
- pgno: 72
  md: "# The .next_sibling attribute\n\nIn the producer list, we can get the sibling\
    \ of the first producer plants using the following code snippet:\n\n```\nsoup\
    \ = BeautifulSoup(html_markup)\nfirst_producer = soup.find(\"li\")\nsecond_producer\
    \ = first_producer.next_sibling\nsecond_producer_name = second_producer.div.string\n\
    print(second_producer_name)\n\n#output\nu'algae'\n```\n\nHere second_producer\
    \ is reached by navigating to the next sibling from first_producer, which represents\
    \ the first <li> tag within the page.\n\n# The .previous_sibling attribute\n\n\
    The .previous_sibling attribute is used to navigate to the previous sibling. For\
    \ finding the previous sibling in the previous example, we can use the following\
    \ code snippet:\n\n```\nprint(second_producer.previuos_sibling)\n\n#output\n<li\
    \ class=\"producerlist\"><div class=\"name\">plants</div><div class=\"number\"\
    >100000</div></li>\n```\n\nIf a tag doesn't have a previous sibling, it will return\
    \ None, that is print(first_producer.previous_sibling) will give us None since\
    \ there are no previous sibling for this tag.\n\nWe have next_siblings and previous_siblings\
    \ generators to iterate over the next and previous siblings from a particular\
    \ object.\n\n```\nfor previous_sibling in second_producer.previous_siblings:\n\
    \    print(previous_sibling.name)\n```\n\nThe previous code snippet will give\
    \ only the <li> tag, which is the only previous sibling. The same iteration can\
    \ be used for next_siblings to find the siblings coming after an object."
  merge: -1
  img_proc: true
- pgno: 73
  md: '# Navigating to the previous and next objects parsed


    We saw different ways of navigating to the children, siblings, and parents. Sometimes
    we may need to navigate to objects that may not be in direct relation with the
    tag such as the children, siblings, or parent. So, in order to find the immediate
    element that is parsed after, our object can be found using .next_element.


    For example, the immediate element parsed after the first <li> tag is the <div>
    tag.


    ```

    first_producer = soup.li

    print(first_producer.next_element)


    #output

    <div class="name">plants</div>

    ```


    The previous code prints the next element, which is <div class="name">plants</div>.


    > .next_element and .next_sibling are entirely different. .next_element points
    to the object that is parsed immediately after the current object, whereas .next_sibling
    points to the object that is at the same level in the tree.


    In the same way, .previous_element can be used to find the immediate element parsed
    before a particular tag or string.


    ```

    second_div = soup.find_all("("div")")[1]

    print(second_div.previous_element)


    #output

    plants

    ```


    From the output, it is clear that the one parsed immediately before the second
    <div> tag is the string plants.


    # Quick reference


    The following commands will help you to navigate down the tree:


    +   - tag.name: This navigates to the child using the name

    +   - tag.contents: This lists the children

    +   - tag.children: This is a generator for children'
  merge: -1
  img_proc: true
- pgno: 74
  md: '+   - `tag.descendants`: This is a generator for descendants

    +   - `tag.string`: This navigates to a string using `.string`

    +   - `tag.strings`: This is a generator for strings


    The following commands will help you to navigate up the tree:


    +   - `tag.parent`: This navigates to the parent

    +   - `tag.parents`: This is a generator for parents


    The following commands will help you to navigate sideways:


    +   - `tag.next_sibling`: This navigates to the next sibling

    +   - `tag.next_siblings`: This is a generator for next siblings

    +   - `tag.previous_sibling`: This navigates to the previous sibling

    +   - `tag.previous_siblings`: This is a generator for previous siblings


    The following commands help you to navigate to the previous or next element:


    +   - `tag.next_element`: This navigates to the next element parsed

    +   - `tag.previous_element`: This navigates to the previous element parsed


    # Summary


    In this chapter, we discussed the various navigation techniques in Beautiful Soup.
    We have discussed four ways of navigation, that is, navigating up, down, sideways,
    next, and before elements with the help of examples.


    In the next chapter, we will learn about the different ways to modify the parsed
    HTML tree by adding new contents, for example, tags, strings, modifying tags,
    and deleting existing ones.'
  merge: -1
  img_proc: true
- pgno: 75
  md: '# 5

    Modifying Content Using Beautiful Soup


    Beautiful Soup can be used effectively to search or navigate within an HTML/XML
    document. Apart from this, we can also use Beautiful Soup to change the content
    of an HTML/XML document. Modification of the content means the addition or deletion
    of a new tag, changing the tag name, altering tag attribute values, changing text
    content, and so on. This is useful in situations where we need to parse the HTML/XML
    document, change its structure, and write it back as an HTML/XML document with
    the modification.


    Consider a case where we have an HTML document with a <table> tag holding around
    1,000 or more rows (the <tr> tag ) with an existing set of two columns (the <td>
    tag ) per row. We want to add a new set of the two <td> tags to each row. It would
    be highly inappropriate to manually add these <td> tags for each of the <tr> tags.
    In this case, we can use Beautiful Soup to search or/and navigate through each
    of the <tr> tags to add these <td> tags. We can then save these changes as a new
    HTML document, which will then have the four <td> tags per <tr> tag. This chapter
    deals with the different methods to modify content using Beautiful Soup by considering
    the ecological pyramid example that we used in the previous chapters.


    # Modifying Tag using Beautiful Soup


    Beautiful Soup has the capability of altering completely different properties
    of the HTML/XML tags. We know that each tag in Beautiful Soup is represented as
    a Tag object and it is possible to perform the following tasks:


    +   - Modifying the name property of Tag

    +   - Modifying the attribute values of Tag

    +   - Adding new tags'
  merge: -1
  img_proc: true
- pgno: 76
  md: "+   - Deleting existing tags\n+   - Modifying string contents\n\n# Modifying\
    \ the name property of Tag\n\nA Beautiful Soup Tag object is always associated\
    \ with a .name property; for example, a, div, and so on. Modifying the .name property\
    \ with a new value will modify the HTML tag as follows:\n\n```\nhtml_markup =\
