  md: "# Searching for text\n\nIf we pass a string to search using the find() method,\
    \ it will search for tags with the given name by default. But, if we want to search\
    \ only for text within the BeautifulSoup object, we can use it as follows:\n\n\
    ```\nsearch_for_stringonly = soup.find(text=\"fox\")\n\n#output\n    fox\n```\n\
    \nThe preceding code will search for the occurrence of the fox text within the\
    \ ecological pyramid. Searching for the text using Beautiful Soup is case sensitive.\
    \ For example, case_sensitive_string = soup.find(text=\"Fox\") will return None.\n\
    \n# Searching based on regular expressions\n\nThe find() method can search based\
    \ on a regular expression. This normally comes in handy when we have an HTML page\
    \ with no pattern like the preceding producer example.\n\nLet us take an example\
    \ where we are given a page with e-mail IDs, as mentioned in the following code,\
    \ and we are asked to find the first e-mail ID:\n\n```\n<br/>\n<div>The below\
    \ HTML has the information that has email ids.</div>\n    abc@example.com\n<div>xyz@example.com</div>\n\
    <span>foo@example.com</span>\n```\n\nHere, the e-mail IDs are scattered across\
    \ the page with one inside the <div> tag, another inside the <span> tag, and the\
    \ first one, which is not enclosed by any tag. It is difficult here to find the\
    \ first e-mail ID. But if we can represent the e-mail ID using regular expression,\
    \ find() can search based on the expression to get the first e-mail ID.\n\nSo\
    \ in this case, we just need to form the regular expression for the e-mail ID\
    \ and pass it to the find() method. The find() method will use the regular expression,\
    \ the match() method, to find a match for the given regular expression.\n\nLet\
    \ us find the first e-mail ID using the following code:\n\n```\nimport re\nfrom\
    \ bs4 import BeautifulSoup\nemail_id_example = \"\"\"<br/>\n<div>The below HTML\
    \ has the information that has email ids.</div>\n    abc@example.com\n```"
  merge: -1
