- pgno: 103
  md: "# 7\nOutput in Beautiful Soup\n\nBeautiful Soup not only searches, navigates,\
    \ and modifies the HTML/XML, but also the output content in a good format. Beautiful\
    \ Soup can deal with different types of printing such as:\n\n+   - Formatted printing\n\
    +   - Unformatted printing\n\nApart from these, Beautiful Soup provides different\
    \ formatters to format the output. Since the HTML tree can undergo modification\
    \ after creation, these output methods will help in viewing the modified HTML\
    \ tree.\n\nAlso in this chapter, we will discuss a simple method of getting only\
    \ the text stored within a web page.\n\n# Formatted printing\n\nBeautiful Soup\
    \ has two supported ways of printing. The first one is formatted printing that\
    \ prints the current Beautiful Soup object into the formatted Unicode strings.\
    \ Each tag is printed in a separate line with good indentation and this leads\
    \ to the right look and feel. Beautiful Soup has the built-in method prettify()\
    \ for formatted printing. For example:\n\n```\nhtml_markup = \"\"\"<p class=\"\
    ecopyramid\">\n<ul id=\"producers\">\n    <li class=\"producerlist\">\n      \
    \  <div class=\"name\">plants</div>\n        <div class=\"number\">100000</div>\n\
    \    </li>\n    <li class=\"producerlist\">\n        <div class=\"name\">algae</div>\n\
    ```"
