- pgno: 25
  md: '# # Creating a BeautifulSoup Object


    We saw how to install Beautiful Soup in Linux, Windows, and Mac OS X machines
    in *Chapter 1, Installing Beautiful Soup*.


    Beautiful Soup is widely used for getting data from web pages. We can use Beautiful
    Soup to extract any data in an HTML/XML document, for example, to get all links
    in a page or to get text inside tags on the page. In order to achieve this, Beautiful
    Soup offers us different objects, and simple searching and navigation methods.


    Any input HTML/XML document is converted to different Beautiful Soup objects,
    and based on the different properties and methods of these objects, we can extract
    the required data. The list of objects in Beautiful Soup includes the following:


    +   - `BeautifulSoup`

    +   - `Tag`

    +   - `NavigableString`


    # ## Creating a BeautifulSoup object


    Creating a BeautifulSoup object is the starting point of any Beautiful Soup project.
    A BeautifulSoup object represents the input HTML/XML document used for its creation.


    BeautifulSoup is created by passing a string or a file-like object (this can be
    an open handle to the files stored locally in our machine or a web page).'
  merge: -1
  img_proc: true
- pgno: 26
  md: "# Creating a BeautifulSoup object from a string\n\nA string can be passed to\
    \ the `BeautifulSoup` constructor to create an object as follows:\n\n```\nhelloworld\
    \ = \"<p>Hello World</p>\"\nsoup_string = BeautifulSoup(helloworld)\n```\n\n![](img/c437561ffd11fadb571896e0a4ca4d18_26_0.png)\n\
    \n> **Downloading the example code**\n> \n> You can download the example code\
    \ files for all Packt books you have purchased from your account at `http://www.packtpub.com`.\
    \ If you purchased this book elsewhere, you can visit `http://www.packtpub.com/support`\
    \ and register to have the files e-mailed directly to you.\n\nThe previous code\
    \ will create the BeautifulSoup object based on the input string `helloworld`.\
    \ We can see that the input has been treated as HTML and the content of the object\
    \ can be viewed by `print(soup_string)`.\n\n```\n<html><body><p>Helloworld</p></body></html>\n\
    ```\n\n![](img/c437561ffd11fadb571896e0a4ca4d18_26_1.png)\n\n> The output of the\
    \ previous code can be different in some systems based on the parser used. This\
    \ is explained later in this chapter.\n\nDuring the creation of the object, Beautiful\
    \ Soup converts the input markup (HTML/XML) to a tree structure using the supported\
    \ parsers. While doing so, the markup will be represented as different Beautiful\
    \ Soup objects such as `BeautifulSoup`, `Tag`, and `NavigableString`.\n\n# Creating\
    \ a BeautifulSoup object from a file-like object\n\nA file-like object can also\
    \ be passed to the BeautifulSoup constructor to create the object. This is useful\
