    # About the Author


    **Vineeth G. Nair** completed his bachelors in Computer Science and Engineering
    from Model Engineering College, Cochin, Kerala. He is currently working with Oracle
    India Pvt. Ltd. as a Senior Applications Engineer.


    He developed an interest in Python during his college days and began working as
    a freelance programmer. This led him to work on several web scraping projects
    using Beautiful Soup. It helped him gain a fair level of mastery on the technology
    and a good reputation in the freelance arena. He can be reached at `vineethgnair.mec@gmail.com`.
    You can visit his website at `www.kochi-coders.com`.


    My sincere thanks to Leonard Richardson, the primary author of Beautiful Soup.
    I would like to thank my friends and family for their great support and encouragement
    for writing this book. My special thanks to Vijitha S. Menon, for always keeping
    my spirits up, providing valuable comments, and showing me the best ways to bring
    this book up. My sincere thanks to all the reviewers for their suggestions, corrections,
    and points of improvement.


    I extend my gratitude to the team at Packt Publishing who helped me in making
    this book happen.'
  - '[PAGE 5]


    # About the Reviewers


    **John J. Czaplewski** is a Madison, Wisconsin-based mapper and web developer
    who specializes in web-based mapping, GIS, and data manipulation and visualization.
    He attended the University of Wisconsin - Madison, where he received his BA in
    Political Science and a graduate certificate in GIS. He is currently a Programmer
    Analyst for the UW-Madison Department of Geoscience working on data visualization,
    database, and web application development. When not sitting behind a computer,
    he enjoys rock climbing, cycling, hiking, traveling, cartography, languages, and
    nearly anything technology related.


    **Christian S. Perone** is an experienced Pythonista, open source collaborator,
    and the project leader of PyEvolve, a very popular evolutionary computation framework
    chosen to be part of OpenMDAO, which is an effort by the NASA Glenn Research Center.
    He has been a programmer for 12 years, using a variety of languages including
    C, C++, Java, and Python. He has contributed to many open source projects and
    loves web scraping, open data, web development, machine learning, and evolutionary
    computation. Currently, he lives in Porto Alegre, Brazil.


    **Zhang Xiang** is an engineer working for the Sina Corporation.


    > I''d like to thank my girlfriend, who supports me all the time.'
