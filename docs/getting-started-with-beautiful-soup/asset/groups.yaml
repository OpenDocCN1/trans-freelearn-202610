    </html>\n```\n\n## 从 HTML 文档中删除标签\n\nBeautiful Soup 也允许从文档中移除标签。这可以通过 `decompose()`\
    \ 和 `extract()` 方法实现。\n\n### 使用 decompose() 删除 producer\n\n我们添加了一个新的 producer，即\
