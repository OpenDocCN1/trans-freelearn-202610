    This is shown in the following screenshot:


    ![](img/c437561ffd11fadb571896e0a4ca4d18_21_0.png)


    Adding Python path in Windows (Python 2.7 is used in this example)


    After the Python path is ready, we can follow the steps for installing Beautiful
    Soup on a Windows machine.


    > The method, which will be explained in the next section, of installing Beautiful
    Soup using `setup.py` is the same for Linux, Windows, and Mac OS X operating systems.'
  - '[PAGE 22]


    # Installing Beautiful Soup using setup.py


    We can install Python packages using the `setup.py` script that comes with every
    Python package downloaded from the Python package index website: `https://pypi.python.org/`.
    The following steps are used to install the Beautiful Soup using `setup.py`:


    +   1. Download the latest tarball from https://pypi.python.org/packages/source/b/beautifulsoup4/.

    +   2. Unzip it to a folder (for example, `BeautifulSoup`).

    +   3. Open up the command-line prompt and navigate to the folder where you have
    unzipped the folder as follows:

    +      `cd BeautifulSoup`

    +      `python setup.py install.`

    +   4. The `python setup.py install` line will install Beautiful Soup in our system.


    > We are not done with the list of possible options to use Beautiful Soup. We
    can use Beautiful Soup in our applications even if all of the options outlined
    until now fail.


    # Using Beautiful Soup without installation


    The installation processes that we have discussed till now normally copy the module
    contents to a chosen installation directory. This varies from operating system
    to operating system and the path is normally `/usr/local/lib/pythonX.Y/site-packages`
    in Linux operating systems such as Debian and `C:\PythonXY\Lib\site-packages`
    in Windows (where X and Y represent the corresponding versions, such as Python
    2.7). When we use import statements in the Python interpreter or as a part of
    a Python script, normally what the Python interpreter does is look in the predefined
    Python `Path` variable and look for the module in those directories. So, installing
    actually means copying the module contents into the predefined directory or copying
    this to some other location and adding the location into the Python path. The
    following method of using Beautiful Soup without going through the installation
    can be used in any operating system, such as Windows, Linux, or Mac OS X:


    +   1. Download the latest version of Beautiful Soup package from https://pypi.python.org/packages/source/b/beautifulsoup4/.

    +   2. Unzip the package.

    +   3. Copy the `bs4` directory into the directory where we want to place all
    our Python Beautiful Soup scripts.'
  - '[PAGE 23]


    After we perform all the preceding steps, we are good to use Beautiful Soup. In
    order to import Beautiful Soup in this case, either we need to open the terminal
    in the directory where the bs4 directory exists or add this directory to the Python
    Path variable; otherwise, we will get the module not found error. This extra step
    is required because the method is specific to a project where the bs4 directory
    is included. But in the case of installing methods, as we have seen previously,
    Beautiful Soup will be available globally and can be used in any of the projects,
    and so the additional steps are not required.


    # Verifying the installation


    To verify the installation, perform the following steps:


    +   1. Open up the Python interpreter in a terminal by using the following command:

    +      `python`

    +   2. Now, we can issue a simple import statement to see whether we have successfully
    installed Beautiful Soup or not by using the following command:

    +      `from bs4 import BeautifulSoup`


    If we did not install Beautiful Soup and instead copied the bs4 directory in the
    workspace, we have to change to the directory where we have placed the bs4 directory
    before using the preceding commands.


    # Quick reference


    The following table is an overview of commands and their implications:


    | Command | Description |

    |---|---|

    | `sudo apt-get install python-bs4` | This command is used for installing Python
    using a package manger in Linux. |

    | `sudo pip install beautifulsoup4` | This command is used for installing Python
    using pip. |

    | `sudo easy_install beautifulsoup4` | This command is used for installing Python
    using easy_install. |

    | `python setup.py install` | This command is used for installing Python using
    setup.py. |

    | `from bs4 import BeautifulSoup` | This command is used for verifying installation.
    |'
