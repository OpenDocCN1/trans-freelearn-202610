    \ be passed to the `BeautifulSoup` constructor to create an object as follows:\n\
    \n```\nhelloworld = \"<p>Hello World</p>\"\nsoup_string = BeautifulSoup(helloworld)\n\
    ```\n\n![](img/c437561ffd11fadb571896e0a4ca4d18_26_0.png)\n\n> **Downloading the\
    \ example code**\n> \n> You can download the example code files for all Packt\
    \ books you have purchased from your account at `http://www.packtpub.com`. If\
    \ you purchased this book elsewhere, you can visit `http://www.packtpub.com/support`\
    \ and register to have the files e-mailed directly to you.\n\nThe previous code\
    \ will create the BeautifulSoup object based on the input string `helloworld`.\
    \ We can see that the input has been treated as HTML and the content of the object\
    \ can be viewed by `print(soup_string)`.\n\n```\n<html><body><p>Helloworld</p></body></html>\n\
    ```\n\n![](img/c437561ffd11fadb571896e0a4ca4d18_26_1.png)\n\n> The output of the\
    \ previous code can be different in some systems based on the parser used. This\
    \ is explained later in this chapter.\n\nDuring the creation of the object, Beautiful\
    \ Soup converts the input markup (HTML/XML) to a tree structure using the supported\
    \ parsers. While doing so, the markup will be represented as different Beautiful\
    \ Soup objects such as `BeautifulSoup`, `Tag`, and `NavigableString`.\n\n# Creating\
    \ a BeautifulSoup object from a file-like object\n\nA file-like object can also\
    \ be passed to the BeautifulSoup constructor to create the object. This is useful\
    \ in parsing an online web page, which is the most common use of Beautiful Soup.\n\
    \nFor example, consider the case where we need to get a list of all the books\
    \ published by Packt Publishing, which is available at `http://www.packtpub.com/books`.\
    \ In order to reduce the overhead of visiting this URL from our browser to get\
    \ the page content as String, it is appropriate to create the BeautifulSoup object\
    \ by providing the file-like object of the URL.\n\n```\nimport urllib2\nfrom bs4\
    \ import BeautifulSoup\n```"
