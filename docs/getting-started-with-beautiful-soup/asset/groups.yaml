    \n首次出版：2014 年 1 月\n\n生产参考编号：1170114\n\n由 Packt Publishing Ltd. 出版\n\nLivery Place\n\
    35 Livery Street\nBirmingham B3 2PB, UK.\n\nISBN 978-1-78328-955-4\n\nwww.packtpub.com\n\
    \n封面图片由 Mohamed Raoof 提供（raoofpmajeed@gmail.com）\n\n## 致谢\n\n- **作者**：Vineeth\
    \ G. Nair\n- **项目协调员**：Jomin Varghese\n- **评审人员**：John J. Czaplewski、Christian\
    \ S. Perone、张翔\n- **校对**：Maria Gould\n- **索引编制**：Hemangini Bari\n- **策划编辑**：Nikhil\
    \ Karkal\n- **美术设计**：Sheetal Aute、Abhinash Sahu\n- **高级委托编辑**：Kunal Parikh\n-\
    \ **制作协调员**：Adonia Jones\n- **委托编辑**：Manasi Pandire\n- **封面制作**：Adonia Jones\n\
    - **技术编辑**：Novina Kewalramani、Pooja Nair\n- **文字编辑**：Janbal Dharmaraj\n\n## 关于作者\n\
    \n**Vineeth G. Nair** 毕业于喀拉拉邦科钦的 Model Engineering College，获得计算机科学与工程学士学位。目前他担任\
    \ Oracle India Pvt. Ltd. 的高级应用工程师。\n\n他在大学期间对 Python 产生了兴趣，并开始做自由程序员。这使他参与了一些使用\
    \ Beautiful Soup 的网页抓取项目，帮助他在该技术上达到相当熟练的程度，并在自由职业领域赢得了良好声誉。他可通过 `vineethgnair.mec@gmail.com`\
    \ 联系，也可访问他的网站 `www.kochi-coders.com`。\n\n我衷心感谢 Beautiful Soup 的主要作者 Leonard Richardson。感谢我的朋友和家人对编写本书的大力支持和鼓励。特别感谢\
    \ Vijitha S. Menon，她总是让我保持高昂的情绪，提供宝贵的意见，并指导我以最佳方式完善本书。也衷心感谢所有评审人员的建议、纠正和改进意见。\n\
    \n我对 Packt Publishing 团队的帮助表示感激，正是他们促成了本书的出版。\n\n## 关于评审人员\n\n**John J. Czaplewski**\
    \ 是威斯康星州麦迪逊市的一名制图师和 Web 开发人员，专门从事基于 Web 的制图、GIS、数据处理与可视化。他曾就读于威斯康星大学麦迪逊分校，获得政治学文学学士学位和\
    \ GIS 研究生证书。目前他是 UW-Madison 地球科学系的程序员分析师，致力于数据可视化、数据库和 Web 应用程序开发。在不坐在电脑前时，他喜欢攀岩、骑行、徒步、旅行、制图、语言学习以及几乎所有与技术相关的事物。\n\
    \n**Christian S. Perone** 是一位经验丰富的 Python 开发者、开源协作贡献者，同时也是 PyEvolve 的项目负责人。PyEvolve\
    \ 是一个非常流行的进化计算框架，被选为 OpenMDAO 的一部分，而 OpenMDAO 是 NASA 格伦研究中心的项目。他做程序员已有 12 年，使用过包括\
