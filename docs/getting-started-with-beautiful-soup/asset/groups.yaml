    soup_packtpage = BeautifulSoup(page)\n```\n\nIn the previous Python script, we\
    \ have used the urllib2 module, which is a native Python module, to open the http://www.packtpub.com/books\
    \ page. The urllib2.urlopen() method returns a file-like object for the input\
    \ URL. Then we create the BeautifulSoup object, soup_packtpage, by passing the\
