    \ up and down the HTML tree, Beautiful Soup also provides navigation methods to\
    \ find the siblings of an object. Navigating to the siblings is possible using\
    \ `.next_sibling` and `.previous_sibling`.\n\n### The .next_sibling attribute\n\
    \nIn the producer list, we can get the sibling of the first producer plants using\
    \ the following code snippet:\n\n```\nsoup = BeautifulSoup(html_markup)\nfirst_producer\
    \ = soup.find(\"li\")\nsecond_producer = first_producer.next_sibling\nsecond_producer_name\
    \ = second_producer.div.string\nprint(second_producer_name)\n\n#output\nu'algae'\n\
    ```\n\nHere second_producer is reached by navigating to the next sibling from\
    \ first_producer, which represents the first <li> tag within the page.\n\n###\
    \ The .previous_sibling attribute\n\nThe .previous_sibling attribute is used to\
    \ navigate to the previous sibling. For finding the previous sibling in the previous\
    \ example, we can use the following code snippet:\n\n```\nprint(second_producer.previous_sibling)\n\
    \n#output\n<li class=\"producerlist\"><div class=\"name\">plants</div><div class=\"\
    number\">100000</div></li>\n```\n\nIf a tag doesn't have a previous sibling, it\
    \ will return None, that is print(first_producer.previous_sibling) will give us\
    \ None since there are no previous sibling for this tag.\n\nWe have next_siblings\
    \ and previous_siblings generators to iterate over the next and previous siblings\
    \ from a particular object.\n\n```\nfor previous_sibling in second_producer.previous_siblings:\n\
    \    print(previous_sibling.name)\n```\n\nThe previous code snippet will give\
    \ only the <li> tag, which is the only previous sibling. The same iteration can\
    \ be used for next_siblings to find the siblings coming after an object.\n\n##\
    \ Navigating to the previous and next objects parsed\n\nWe saw different ways\
    \ of navigating to the children, siblings, and parents. Sometimes we may need\
    \ to navigate to objects that may not be in direct relation with the tag such\
    \ as the children, siblings, or parent. So, in order to find the immediate element\
    \ that is parsed after, our object can be found using .next_element.\n\nFor example,\
    \ the immediate element parsed after the first <li> tag is the <div> tag.\n\n\
    ```\nfirst_producer = soup.li\nprint(first_producer.next_element)\n\n#output\n\
    <div class=\"name\">plants</div>\n```\n\nThe previous code prints the next element,\
    \ which is <div class=\"name\">plants</div>.\n\n> .next_element and .next_sibling\
    \ are entirely different. .next_element points to the object that is parsed immediately\
    \ after the current object, whereas .next_sibling points to the object that is\
    \ at the same level in the tree.\n\nIn the same way, .previous_element can be\
    \ used to find the immediate element parsed before a particular tag or string.\n\
    \n```\nsecond_div = soup.find_all(\"div\")[1]\nprint(second_div.previous_element)\n\
    \n#output\nplants\n```\n\nFrom the output, it is clear that the one parsed immediately\
    \ before the second <div> tag is the string plants.\n\n## Quick reference\n\n\
    The following commands will help you to navigate down the tree:\n\n- tag.name:\
    \ This navigates to the child using the name\n- tag.contents: This lists the children\n\
    - tag.children: This is a generator for children\n- `tag.descendants`: This is\
    \ a generator for descendants\n- `tag.string`: This navigates to a string using\
    \ `.string`\n- `tag.strings`: This is a generator for strings\n\nThe following\
    \ commands will help you to navigate up the tree:\n\n- `tag.parent`: This navigates\
    \ to the parent\n- `tag.parents`: This is a generator for parents\n\nThe following\
    \ commands will help you to navigate sideways:\n\n- `tag.next_sibling`: This navigates\
    \ to the next sibling\n- `tag.next_siblings`: This is a generator for next siblings\n\
    - `tag.previous_sibling`: This navigates to the previous sibling\n- `tag.previous_siblings`:\
    \ This is a generator for previous siblings\n\nThe following commands help you\
    \ to navigate to the previous or next element:\n\n- `tag.next_element`: This navigates\
    \ to the next element parsed\n- `tag.previous_element`: This navigates to the\
    \ previous element parsed\n\n## Summary\n\nIn this chapter, we discussed the various\
    \ navigation techniques in Beautiful Soup. We have discussed four ways of navigation,\
    \ that is, navigating up, down, sideways, next, and before elements with the help\
    \ of examples.\n\nIn the next chapter, we will learn about the different ways\
    \ to modify the parsed HTML tree by adding new contents, for example, tags, strings,\
    \ modifying tags, and deleting existing ones.\n\n## 5\n### Modifying Content Using\
    \ Beautiful Soup\n\nBeautiful Soup can be used effectively to search or navigate\
    \ within an HTML/XML document. Apart from this, we can also use Beautiful Soup\
    \ to change the content of an HTML/XML document. Modification of the content means\
    \ the addition or deletion of a new tag, changing the tag name, altering tag attribute\
    \ values, changing text content, and so on. This is useful in situations where\
    \ we need to parse the HTML/XML document, change its structure, and write it back\
    \ as an HTML/XML document with the modification.\n\nConsider a case where we have\
    \ an HTML document with a <table> tag holding around 1,000 or more rows (the <tr>\
    \ tag ) with an existing set of two columns (the <td> tag ) per row. We want to\
    \ add a new set of the two <td> tags to each row. It would be highly inappropriate\
    \ to manually add these <td> tags for each of the <tr> tags. In this case, we\
    \ can use Beautiful Soup to search or/and navigate through each of the <tr> tags\
    \ to add these <td> tags. We can then save these changes as a new HTML document,\
    \ which will then have the four <td> tags per <tr> tag. This chapter deals with\
    \ the different methods to modify content using Beautiful Soup by considering\
    \ the ecological pyramid example that we used in the previous chapters.\n\n##\
    \ Modifying Tag using Beautiful Soup\n\nBeautiful Soup has the capability of altering\
    \ completely different properties of the HTML/XML tags. We know that each tag\
    \ in Beautiful Soup is represented as a Tag object and it is possible to perform\
    \ the following tasks:\n\n- Modifying the name property of Tag\n- Modifying the\
    \ attribute values of Tag\n- Adding new tags\n"
