    The left-most column represents the symbols and the corresponding HTML entities
    are represented in the next column. For the symbol &, the corresponding HTML entity
    code is &amp; likewise for the symbol ©, the code is &copy;.


    The output methods in Beautiful Soup escape only the HTML entities of >, <, and
    & as &gt;, &lt;, and &amp;. Rest of the special entities are converted to Unicode
    while constructing the BeautifulSoup object, and upon output using prettify()
    or other methods, we get only the UTF-8 string of the HTML entities. We won''t
    get the HTML entities back (except for &, >, and <).


    ```

    html_markup = """<html>

    <body>& &amp; ampersand

    ¢ &cent; cent

    © &copy; copyright

    ÷ &divide; divide

    > &gt; greater than

    </body>

    </html>

    """

    soup = BeautifulSoup(html_markup,"lxml")

    print(soup.prettify())

    ```


    Here we have created the soup object based on the text content for the HTML page
    in a browser that had the & symbol instead of the &amp; code. Likewise for other
    entities in the prettify() method, the output is shown as follows:


    ![](img/c437561ffd11fadb571896e0a4ca4d18_107_0.png)


    We can understand that other HTML entities were converted to Unicode representation.
    Beautiful Soup allows output formatters to have a control over this behavior.
    There are the following four types of formatters available:


    +   - minimal

    +   - html

    +   - None

    +   - function'
