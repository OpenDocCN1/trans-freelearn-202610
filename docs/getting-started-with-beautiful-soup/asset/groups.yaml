    # Navigating down


    Any object, such as Tag or BeautifulSoup, that has children can use this navigation.
    Navigating down can be achieved in two ways.


    # Using the name of the child tag


    A BeautifulSoup or a Tag object can use the name of a child tag to navigate to
    it. Even if there are multiple child nodes with the same name, this method will
    navigate to the first instance only. For example, we can consider the BeautifulSoup
    object on the ecological pyramid example discussed in the previous example.


    ```

    soup = BeautifulSoup(html_markup,"lxml")

    producer_entries = soup.ul

    print(producer_entries)

    ```


    In the previous code, by using soup.ul, we navigate to the first entry of the
    ul tag within the soup object''s children.


    This can also be done for Tag objects by using the following code:


    ```

    first_producer = producer_entries.li

    print(first_producer)

    ```


    ```

    #output

    <li class="producerlist">

    <div class="name">plants</div>

    <div class="number">100000</div>

    </li>

