    \ machine by executing the command mkdir Soup from a terminal. Create an HTML\
    \ file, foo.html, in this folder using touch Soup/foo.html. From the same terminal,\
    \ change to the directory just created using cd Soup.\n\nNow let us see the creation\
    \ of BeautifulSoup using the file foo.html.\n\n```\nwith open(\"foo.html\",\"\
    r\") as foo_file:\n    soup_foo = BeautifulSoup(foo_file)\n```\n\nThe previous\
    \ lines of code create a BeautifulSoup object based on the contents of the local\
    \ file, foo.html.\n\nBeautifulSoup has a basic warning mechanism to notify whether\
    \ we have passed a filename instead of the file object.\n\nLet us look at the\
    \ next code line:\n\n```\nsoup_foo = BeautifulSoup(\"foo.html\")\n```\n\nThis\
    \ will produce the following warning:\n\nUserWarning: \"foo.html\" looks like\
    \ a filename, not markup. You should probably open this file and pass the filehandle\
    \ into Beautiful Soup.\n\nBut still a BeautifulSoup object is created assuming\
    \ the string (\"foo.html\") that we passed as HTML."
