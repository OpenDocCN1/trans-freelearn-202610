    - get_text(): 此方法为您提供对象或标签的所有内容：\n  - `soup.get_text()`: 此方法用于获取 BeautifulSoup\
    \ 或 Tag 对象中的所有文本内容\n\n## 总结\n\n本章介绍了 Beautiful Soup 中的不同输出方法。我们看到了 BeautifulSoup\
    \ 对象中的格式化和非格式化打印，以及用于控制输出格式的不同输出格式化器。我们还看到了从网页中仅获取文本的方法。\n\n在下一章中，我们将使用本書迄今为止所研究的搜索、导航和其他技术创建一个网络抓取器。\n\
    \n## 8\n\n## 创建网络抓取器\n\n在本章中，我们将使用前几章研究的不同的搜索和导航技术创建一个网站抓取器。抓取器将访问三个网站，根据 ISBN\
    \ 查找图书的售价。我们将首先从 packtpub.com 找到图书列表和售价。我们还将从 packtpub.com 找到图书的 ISBN，并基于此 ISBN\
    \ 在 www.amazon.com 和 www.barnesandnoble.com 等其他网站上进行搜索。通过这样做，我们将自动化在三个网站上查找图书售价的过程，并将获得为这些网站实现抓取器的实践经验。由于网站结构可能会在以后发生变化，本章中使用的代码示例和图像也可能变得无效。因此，最好将示例作为参考并相应地更改代码。访问这些网站以获得更好的理解是很好的。\n\
    \n## 从 PacktPub.com 获取图书详情\n\n从 www.packtpub.com 获取图书详情是创建抓取器的第一步。我们需要从 PacktPub.com\
    \ 找到以下详情：\n\n- 书名\n- 售价\n- ISBN\n\n我们在第 3 章《使用 Beautiful Soup 搜索》中看到了如何从 packtpub.com\
    \ 抓取书名和售价。该章中讨论的示例仅考虑了第一页，未包含也包含图书列表的其他页面。因此，在下一个主题中，我们将找到包含图书列表的不同页面。\n\n## 查找包含图书列表的页面\n\
    \nwww.packtpub.com/books 页面上有下一个和上一个导航链接，用于在包含图书列表的页面之间前后移动，如以下截图所示：\n\n![](img/c437561ffd11fadb571896e0a4ca4d18_114_0.png)\n\
    \n因此，我们需要找到一种获取包含图书列表的多个页面的方法。逻辑上，似乎要查看当前页面中 next 元素指向的页面。使用 Google Chrome 开发工具查看\
