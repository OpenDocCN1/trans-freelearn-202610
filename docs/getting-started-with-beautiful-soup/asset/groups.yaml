    name\"\nnew_div_number_tag=soup.new_tag(\"div\")\nnew_div_number_tag[\"class\"\
    ]=\"number\"\n```\n\nThe preceding lines of code will create the two new div tags\
    \ with the corresponding class attributes as follows:\n\n```\nnew_li_tag.insert(0,new_div_name_tag)\n\
    new_li_tag.insert(1,new_div_number_tag)\nprint(new_li_tag.prettify())\n\n#output\n\
    <li class=\"producerlist\">\n  <div class=\"name\">\n  </div>\n  <div class=\"\
    number\">\n  </div>\n</li>\n```\n\nNow, we can see that new tags have been inserted\
    \ into the li tags. But, the respective strings are missing in these tags.\n\n\
    # # Modifying string contents\n\nIn the preceding example, we added the two div\
    \ tags without any contents to the HTML tree. We need to add the corresponding\
    \ string in the name property of the div tag and also into the number property\
    \ of the div tag. This can also be done in multiple ways using Beautiful Soup."
  md: "\n- Deleting existing tags\n- Modifying string contents\n\n## Modifying the\
    \ name property of Tag\n\nA Beautiful Soup Tag object is always associated with\
    \ a .name property; for example, a, div, and so on. Modifying the .name property\
    \ with a new value will modify the HTML tag as follows:\n\n```python\nhtml_markup\
    \ = \"\"\"<div class=\"ecopyramid\">\n<ul id=\"producers\">\n    <li class=\"\
    producerlist\">\n        <div class=\"name\">plants</div>\n        <div class=\"\
    number\">100000</div>\n    </li>\n    <li class=\"producerlist\">\n        <div\
    \ class=\"name\">algae</div>\n        <div class=\"number\">100000</div>\n   \
    \ </li>\n</ul>\"\"\"\n\nsoup = BeautifulSoup(html_markup, \"lxml\")\nproducer_entries\
    \ = soup.ul\nprint(producer_entries.name)\n\n#output\n'ul'\n```\n\nFrom the preceding\
    \ output, we can see that producer_entries has the name ul; we can easily change\
    \ this by modifying the .name property.\n\nThe representation of the HTML tree\
    \ is given in the following diagram:\n\n![](img/c437561ffd11fadb571896e0a4ca4d18_77_0.png)\n\
    \nLet us modify the value to div, as shown in the following code:\n\n```python\n\
    producer_entries.name = \"div\"\nprint(producer_entries.prettify())\n\n#output\n\
    <html>\n  <body>\n    <div class=\"ecopyramid\">\n      <div id=\"producers\"\
    >\n        <li class=\"producerlist\">\n          <div class=\"name\">\n     \
    \       plants\n          </div>\n          <div class=\"number\">\n         \
    \   100000\n          </div>\n        </li>\n        <li class=\"producerlist\"\
    >\n          <div class=\"name\">\n            algae\n          </div>\n     \
    \     <div class=\"number\">\n            100000\n          </div>\n        </li>\n\
    \      </div>\n    </div>\n  </body>\n</html>\n```\n\nThis also causes the HTML\
    \ tree to change as shown in the following diagram:\n\n![](img/c437561ffd11fadb571896e0a4ca4d18_78_0.png)\n\
    \nWe can use the prettify() method to show the formatted output, as shown in the\
    \ preceding code. As we can see, changing the Tag object's name property also\
    \ changes the HTML tree. So, we should be careful when renaming the tags since\
    \ it can lead to malformed HTML tags.\n\n## Modifying the attribute values of\
    \ Tag\n\nBeautiful Soup can also be used to modify the attribute values associated\
    \ with a tag such as class, id, and style. Since the attributes are stored as\
    \ a dictionary, it is as simple as dealing with a normal Python dictionary.\n\n\
    ### Updating the existing attribute value of Tag\n\nIn the previous ecological\
    \ pyramid example, the ul tag has the id attribute with the value producers. We\
    \ can change this value to producers_new_value as follows:\n\n```python\nproducer_entries['id']\
    \ = \"producers_new_value\"\n```\n\nNow, if we print the `producer_entries` object,\
    \ we can see the change in place as follows:\n\n```python\nprint(producer_entries.prettify())\n\
    \n#output\n<div id=\"producers_new_value\">\n    <li class=\"producerlist\">\n\
    \        <div class=\"name\">\n            plants\n        </div>\n        <div\
    \ class=\"number\">\n            100000\n        </div>\n    </li>\n    <li class=\"\
    producerlist\">\n        <div class=\"name\">\n            algae\n        </div>\n\
    \        <div class=\"number\">\n            100000\n        </div>\n    </li>\n\
    </div>\n```\n\n### Adding new attribute values to Tag\n\nWe can add a new attribute\
    \ to a Tag object. In the previous example, the ul tag doesn't have a class attribute.\
    \ We can add this as follows:\n\n```python\nproducer_entries['class'] = 'newclass'\n\
    ```\n\nThe preceding code will add the new attribute if it doesn't exist or will\
    \ update the attribute value if the attribute already existed in the HTML tree.\n\
    \n```python\nprint(producer_entries.prettify())\n#output\n<div class=\"newclass\"\
    \ id=\"producers_new_value\">\n    <li class=\"producerlist\">\n        <div class=\"\
    name\">\n            plants\n        </div>\n        <div class=\"number\">\n\
    \            100000\n        </div>\n    </li>\n    <li class=\"producerlist\"\
    >\n        <div class=\"name\">\n            algae\n        </div>\n        <div\
    \ class=\"number\">\n            100000\n        </div>\n    </li>\n</div>\n```\n\
    \n## Adding a new tag\n\nWe've seen some of the different ways to change the Tag\
    \ object's .name property and to modify the Tag attributes. Beautiful Soup also\
    \ allows us to add a new tag to the existing HTML/XML document. The new_tag()\
    \ method creates a new tag within the soup object. We can then add these tags\
    \ to the tree by using either the append(), insert(), insert_after(), or insert_before()\
    \ method.\n\n### Adding a new producer using new_tag() and append()\n\nIn our\
    \ ecological pyramid example, we already have plants and algae as the producers.\
    \ Let us add one more producer to the HTML, for example, phytoplankton. If we\
    \ analyze the HTML, we can see that we need to first add a li tag to the parent\
    \ ul tag. For this, we need to create the li tag first.\n\n### Creating a new\
    \ tag using new_tag()\n\nThe Beautiful Soup's new_tag() method will help us to\
    \ create a new tag. The new_tag() method can be called only on the BeautifulSoup\
    \ object. So, here we need to create a new tag, li, with the producerlist class.\
    \ For this, refer to the following code:\n\n```python\nsoup = BeautifulSoup(html_markup,\
    \ \"lxml\")\nnew_li_tag = soup.new_tag(\"li\")\n```\n\nThe preceding code will\
    \ create and store the new li tag in the new_li_tag variable. The new_tag() method\
    \ requires only the tag name as mandatory. We can pass attribute values or other\
    \ properties as optional parameters. That is, we can have the following code:\n\
    \n```python\nnew_a_tag = soup.new_tag(\"a\", href=\"www.example.com\")\n```\n\n\
    In the preceding example, we created the <a> tag by giving a name as well as the\
    \ href property and its value.\n\nIt is also possible to add a new attribute value\
    \ to the previously created li tag using the following code:\n\n```python\nnew_li_tag.attrs\
    \ = {'class': 'producerlist'}\n```\n\n### Adding a new tag using append()\n\n\
    We have created the li tag but we need to fix it to the correct position. Beautiful\
    \ Soup allows us to add a tag to another tag or the soup object using the append()\
    \ method. The append() method adds a newly created tag to the end of .contents.\
    \ This can be called in the same way as the append() method in a Python list as\
    \ follows:\n\n```python\nproducer_entries = soup.ul\nproducer_entries.append(new_li_tag)\n\
    ```\n\nThe preceding code will append the newly created li tag to .contents of\
    \ the ul tag. So, the li tag will now be the child of the ul tag. The ul tag structure\
    \ will look like the following code:\n\n```python\nprint(producer_entries.prettify())\n\
    \n#output\n<ul id=\"producers\">\n    <li class=\"producerlist\">\n        <div\
    \ class=\"name\">\n            plants\n        </div>\n        <div class=\"number\"\
    >\n            100000\n        </div>\n    </li>\n    <li class=\"producerlist\"\
    >\n        <div class=\"name\">\n            algae\n        </div>\n        <div\
    \ class=\"number\">\n            100000\n        </div>\n    </li>\n    <li class=\"\
    producerlist\">\n    </li>\n</ul>\n```\n\nFrom the preceding output, we can see\
    \ that the newly created li tag is added as the new child of ul. Now, we have\
    \ to add the two div tags inside this li tag.\n\n### Adding a new div tag to the\
    \ li tag using insert()\n\nLike append(), the insert() method can also be used\
    \ to add a new tag into the HTML tree. As we already know, append() adds a newly\
    \ created tag to the end of .contents. But, insert() on the other hand, doesn't\
    \ insert at the end of .contents; instead, we need to specify the position at\
    \ which the tag has to be inserted. This is the same as the list insert() operation\
    \ in Python. Refer to the following code:\n\n```python\nnew_div_name_tag = soup.new_tag(\"\
    div\")\nnew_div_name_tag[\"class\"] = \"name\"\nnew_div_number_tag = soup.new_tag(\"\
    div\")\nnew_div_number_tag[\"class\"] = \"number\"\n```\n\nThe preceding lines\
    \ of code will create the two new div tags with the corresponding class attributes\
    \ as follows:\n\n```python\nnew_li_tag.insert(0, new_div_name_tag)\nnew_li_tag.insert(1,\
    \ new_div_number_tag)\nprint(new_li_tag.prettify())\n\n#output\n<li class=\"producerlist\"\
    >\n  <div class=\"name\">\n  </div>\n  <div class=\"number\">\n  </div>\n</li>\n\
    ```\n\nNow, we can see that new tags have been inserted into the li tags. But,\
    \ the respective strings are missing in these tags.\n\n### Modifying string contents\n\
    \nIn the preceding example, we added the two div tags without any contents to\
    \ the HTML tree. We need to add the corresponding string in the name property\
    \ of the div tag and also into the number property of the div tag. This can also\
    \ be done in multiple ways using Beautiful Soup.\n"
  mdcn: "\n\n- 删除现有标签\n- 修改字符串内容\n\n## 修改 Tag 的 name 属性\n\nBeautiful Soup 的 Tag 对象始终与一个\
    \ .name 属性相关联；例如 a、div 等。修改 .name 属性的新值将按如下方式修改 HTML 标签：\n\n```python\nhtml_markup\
    \ = \"\"\"<div class=\"ecopyramid\">\n<ul id=\"producers\">\n    <li class=\"\
    producerlist\">\n        <div class=\"name\">plants</div>\n        <div class=\"\
    number\">100000</div>\n    </li>\n    <li class=\"producerlist\">\n        <div\
    \ class=\"name\">algae</div>\n        <div class=\"number\">100000</div>\n   \
    \ </li>\n</ul>\"\"\"\n\nsoup = BeautifulSoup(html_markup, \"lxml\")\nproducer_entries\
    \ = soup.ul\nprint(producer_entries.name)\n\n#output\n'ul'\n```\n\n从前面的输出中，我们可以看到\
    \ producer_entries 的名称是 ul；我们可以通过修改 .name 属性轻松更改它。\n\nHTML 树的表示在以下图表中给出：\n\n![](img/c437561ffd11fadb571896e0a4ca4d18_77_0.png)\n\
    \n让我们将值修改为 div，如以下代码所示：\n\n```python\nproducer_entries.name = \"div\"\nprint(producer_entries.prettify())\n\
    \n#output\n<html>\n  <body>\n    <div class=\"ecopyramid\">\n      <div id=\"\
    producers\">\n        <li class=\"producerlist\">\n          <div class=\"name\"\
    >\n            plants\n          </div>\n          <div class=\"number\">\n  \
    \          100000\n          </div>\n        </li>\n        <li class=\"producerlist\"\
    >\n          <div class=\"name\">\n            algae\n          </div>\n     \
    \     <div class=\"number\">\n            100000\n          </div>\n        </li>\n\
    \      </div>\n    </div>\n  </body>\n</html>\n```\n\n这也导致 HTML 树发生变化，如以下图表所示：\n\
    \n![](img/c437561ffd11fadb571896e0a4ca4d18_78_0.png)\n\n我们可以使用 prettify() 方法来显示格式化的输出，如前面的代码所示。正如我们所见，更改\
    \ Tag 对象的 name 属性也会更改 HTML 树。因此，在重命名标签时应谨慎，因为它可能导致格式错误的 HTML 标签。\n\n## 修改 Tag\
    \ 的属性值\n\nBeautiful Soup 还可用于修改与标签关联的属性值，例如 class、id 和 style。由于属性以字典形式存储，因此与处理普通的\
    \ Python 字典一样简单。\n\n### 更新 Tag 的现有属性值\n\n在之前的生态金字塔示例中，ul 标签具有 id 属性，其值为 producers。我们可以按如下方式将其更改为\
    \ producers_new_value：\n\n```python\nproducer_entries['id'] = \"producers_new_value\"\
    \n```\n\n现在，如果我们打印 `producer_entries` 对象，我们可以看到更改已生效，如下所示：\n\n```python\nprint(producer_entries.prettify())\n\
    \n#output\n<div id=\"producers_new_value\">\n    <li class=\"producerlist\">\n\
    \        <div class=\"name\">\n            plants\n        </div>\n        <div\
    \ class=\"number\">\n            100000\n        </div>\n    </li>\n    <li class=\"\
    producerlist\">\n        <div class=\"name\">\n            algae\n        </div>\n\
    \        <div class=\"number\">\n            100000\n        </div>\n    </li>\n\
    </div>\n```\n\n### 向 Tag 添加新的属性值\n\n我们可以向 Tag 对象添加新属性。在前面的示例中，ul 标签没有 class 属性。我们可以按如下方式添加它：\n\
    \n```python\nproducer_entries['class'] = 'newclass'\n```\n\n前面的代码将在属性不存在时添加新属性，或在\
    \ HTML 树中已存在该属性时更新属性值。\n\n```python\nprint(producer_entries.prettify())\n#output\n\
    <div class=\"newclass\" id=\"producers_new_value\">\n    <li class=\"producerlist\"\
    >\n        <div class=\"name\">\n            plants\n        </div>\n        <div\
    \ class=\"number\">\n            100000\n        </div>\n    </li>\n    <li class=\"\
    producerlist\">\n        <div class=\"name\">\n            algae\n        </div>\n\
    \        <div class=\"number\">\n            100000\n        </div>\n    </li>\n\
    </div>\n```\n\n## 添加新标签\n\n我们已经看到了更改 Tag 对象的 .name 属性以及修改 Tag 属性的几种不同方法。Beautiful\
    \ Soup 还允许我们向现有 HTML/XML 文档添加新标签。new_tag() 方法在 soup 对象内创建新标签。然后我们可以使用 append()、insert()、insert_after()\
    \ 或 insert_before() 方法将这些标签添加到树中。\n\n### 使用 new_tag() 和 append() 添加新的生产者\n\n在我们的生态金字塔示例中，我们已经有\
    \ plants 和 algae 作为生产者。让我们再向 HTML 中添加一个生产者，例如 phytoplankton。如果我们分析 HTML，可以看到我们需要先向父\
    \ ul 标签添加一个 li 标签。为此，我们需要先创建 li 标签。\n\n### 使用 new_tag() 创建新标签\n\nBeautiful Soup\
    \ 的 new_tag() 方法将帮助我们创建新标签。new_tag() 方法只能在 BeautifulSoup 对象上调用。因此，这里我们需要创建一个新标签\
    \ li，并带有 producerlist 类。为此，请参考以下代码：\n\n```python\nsoup = BeautifulSoup(html_markup,\
    \ \"lxml\")\nnew_li_tag = soup.new_tag(\"li\")\n```\n\n前面的代码将创建新的 li 标签并将其存储在\
    \ new_li_tag 变量中。new_tag() 方法只需要标签名作为必需参数。我们可以传递属性值或其他属性作为可选参数。也就是说，我们可以有以下代码：\n\
    \n```python\nnew_a_tag = soup.new_tag(\"a\", href=\"www.example.com\")\n```\n\n\
    在前面的示例中，我们通过给出名称以及 href 属性及其值创建了 <a> 标签。\n\n也可以使用以下代码向之前创建的 li 标签添加新属性值：\n\n```python\n\
    new_li_tag.attrs = {'class': 'producerlist'}\n```\n\n### 使用 append() 添加新标签\n\n\
    我们已经创建了 li 标签，但需要将其固定到正确的位置。Beautiful Soup 允许我们使用 append() 方法将标签添加到另一个标签或 soup\
    \ 对象。append() 方法将新创建的标签添加到 .contents 的末尾。这可以像在 Python 列表中调用 append() 方法一样调用，如下所示：\n\
    \n```python\nproducer_entries = soup.ul\nproducer_entries.append(new_li_tag)\n\
    ```\n\n前面的代码将新创建的 li 标签附加到 ul 标签的 .contents。因此，li 标签现在将成为 ul 标签的子级。ul 标签结构将如下所示：\n\
    \n```python\nprint(producer_entries.prettify())\n\n#output\n<ul id=\"producers\"\
    >\n    <li class=\"producerlist\">\n        <div class=\"name\">\n           \
    \ plants\n        </div>\n        <div class=\"number\">\n            100000\n\
    \        </div>\n    </li>\n    <li class=\"producerlist\">\n        <div class=\"\
    name\">\n            algae\n        </div>\n        <div class=\"number\">\n \
    \           100000\n        </div>\n    </li>\n    <li class=\"producerlist\"\
    >\n    </li>\n</ul>\n```\n\n从前面的输出中，我们可以看到新创建的 li 标签已作为 ul 的新子级添加。现在，我们必须向此 li\
    \ 标签中添加两个 div 标签。\n\n### 使用 insert() 向 li 标签添加新的 div 标签\n\n与 append() 类似，insert()\
    \ 方法也可以用于向 HTML 树中添加新标签。正如我们所知，append() 将新创建的标签添加到 .contents 的末尾。但 insert() 另一方面，并不插入到\
    \ .contents 的末尾；相反，我们需要指定要插入标签的位置。这与 Python 中的列表 insert() 操作相同。请参考以下代码：\n\n```python\n\
    new_div_name_tag = soup.new_tag(\"div\")\nnew_div_name_tag[\"class\"] = \"name\"\
    \nnew_div_number_tag = soup.new_tag(\"div\")\nnew_div_number_tag[\"class\"] =\
    \ \"number\"\n```\n\n前面的代码行将创建两个新的 div 标签，并带有相应的 class 属性，如下所示：\n\n```python\n\
    new_li_tag.insert(0, new_div_name_tag)\nnew_li_tag.insert(1, new_div_number_tag)\n\
    print(new_li_tag.prettify())\n\n#output\n<li class=\"producerlist\">\n  <div class=\"\
    name\">\n  </div>\n  <div class=\"number\">\n  </div>\n</li>\n```\n\n现在，我们可以看到新标签已插入到\
    \ li 标签中。但这些标签中缺少相应的字符串。\n\n### 修改字符串内容\n\n在前面的示例中，我们向 HTML 树添加了两个 div 标签，但没有内容。我们需要在\
    \ div 标签的 name 属性中添加相应的字符串，也需要在 div 标签的 number 属性中添加字符串。这也可以通过多种方式使用 Beautiful\
    \ Soup 来完成。\n\n"
