    \n除了在 HTML 树中上下导航内容外，Beautiful Soup 还提供了查找对象兄弟节点的方法。导航到兄弟节点可使用 `.next_sibling`\
    \ 和 `.previous_sibling`。\n\n### .next_sibling 属性\n\n在生产者列表中，我们可以使用以下代码片段获取第一个生产者\
    \ plants 的兄弟节点：\n\n```\nsoup = BeautifulSoup(html_markup)\nfirst_producer = soup.find(\"\
    li\")\nsecond_producer = first_producer.next_sibling\nsecond_producer_name = second_producer.div.string\n\
    print(second_producer_name)\n\n#output\nu'algae'\n```\n\n这里 second_producer 是通过从\
    \ first_producer 导航到下一个兄弟节点得到的，first_producer 代表页面内的第一个 <li> 标签。\n\n### .previous_sibling\
    \ 属性\n\n`.previous_sibling` 属性用于导航到上一个兄弟节点。为在前一个示例中查找上一个兄弟节点，我们可以使用以下代码片段：\n\n\
    ```\nprint(second_producer.previous_sibling)\n\n#output\n<li class=\"producerlist\"\
    ><div class=\"name\">plants</div><div class=\"number\">100000</div></li>\n```\n\
    \n如果一个标签没有上一个兄弟节点，它将返回 None，即 print(first_producer.previous_sibling) 将给出我们 None，因为该标签没有上一个兄弟节点。\n\
    \n我们有 next_siblings 和 previous_siblings 生成器来遍历从特定对象开始的下一个和上一个兄弟节点。\n\n```\nfor\
    \ previous_sibling in second_producer.previous_siblings:\n    print(previous_sibling.name)\n\
    ```\n\n前面的代码片段只会给出 <li> 标签，它是唯一的上一个兄弟节点。同样的方法可用于 next_siblings 以查找对象之后出现的兄弟节点。\n\
    \n## 导航到解析的前一个和后一个对象\n\n我们看到了导航到子节点、兄弟节点和父节点的不同方法。有时我们可能需要导航到与标签没有直接关系的对象，例如子节点、兄弟节点或父节点。因此，为了找到解析后紧跟当前对象的元素，可以使用\
