    \ and &lt; in the output as shown in the following screenshot:\n\n![](img/c437561ffd11fadb571896e0a4ca4d18_109_1.png)\n\
    \n## Using get_text()\n\nGetting just text from websites is a common task. Beautiful\
    \ Soup provides the method get_text() for this purpose.\n\nIf we want to get only\
    \ the text of a Beautiful Soup or a Tag object, we can use the get_text() method.\
    \ For example:\n\n```\nhtml_markup = \"\"\"<p class=\"ecopyramid\">\n<ul id=\"\
    producers\">\n    <li class=\"producerlist\">\n        <div class=\"name\">plants</div>\n\
    \        <div class=\"number\">100000</div>\n    </li>\n    <li class=\"producerlist\"\
    >\n        <div class=\"name\">algae</div>\n        <div class=\"number\">100000</div>\n\
    \    </li>\n</ul>\"\"\"\nsoup = BeautifulSoup(html_markup,\"lxml\")\nprint(soup.get_text())\n\
    \n#output\nplants\n100000\n\nalgae\n100000\n```\n\nThe get_text() method returns\
    \ the text inside the Beautiful Soup or Tag object as a single Unicode string.\
    \ But get_text() has issues when dealing with web pages. Web pages often have\
    \ JavaScript code, and the get_text() method returns the JavaScript code as well.\
    \ For example, in Chapter 3, Search Using Beautiful Soup, we saw the example of\
    \ scraping book details from packtpub.com.\n\n```\nimport urllib2\nfrom bs4 import\
    \ BeautifulSoup\nurl = \"http://www.packtpub.com/books\"\npage = urllib2.urlopen(url)\n\
    soup_packtpage = BeautifulSoup(page,\"lxml\")\n```\n\nWe can print the text inside\
    \ the page using get_text(); this is shown in the following code snippet:\n\n\
    ```\nprint(soup_packtpage.get_text())\n```\n\nWith the previous code line, we\
    \ will also get JavaScript code in the output as shown:\n\n```\n$(window).load(function()\
    \ {\n  $(\"img[data-original]\").addClass(\"lazy\");\n  $(\"img.lazy\").lazyload();\n\
    \  setTimeout(function() {\n    addthis_config = Drupal.settings.addthis.config_default;\n\
    \    addthis_share = Drupal.settings.addthis.share_default;\n    if (typeof pageTracker\
    \ != \"undefined\")\n    {addthis_config.data_ga_tracker = pageTracker;}\n   \
    \ var at = document.createElement(\"script\"); at.type =\n      \"text/javascript\"\
    ; at.async = true;\n    at.src = \"//dgdsbygo8mp3h.cloudfront.net/sites/default/\n\
    \      files/addthis/addthis_widget.js\";\n    var s = document.getElementsByTagName(\"\
    script\")[0];\n    s.parentNode.insertBefore(at, s);\n  }, 5);\n});\n```\n\nRemoving\
    \ the JavaScript and printing only the text within a document can be achieved\
    \ using the following code line:\n\n```\n[x.extract() for x in soup_packtpage.find_all('script')]\n\
    ```\n\nThe previous code line will remove all the script elements from the document.\
    \ After this, the print(soup_packtpage.get_text()) code line will print only the\
    \ text stored within the page.\n\n## Quick reference\n\nYou can take a look at\
    \ the following references to get an overview:\n\n- Formatted printing: The following\
    \ method gives the formatted output:\n  - soup.prettify(): This method is used\
    \ to output with indentation and formatting\n- Unformatted printing: These methods\
    \ give output without any format or indentation:\n  - str(soup)\n  - soup.encode()\n\
    \  - soup.decode()\n- Formatters: These methods have the ability to control the\
    \ behavior of the output:\n  - `soup.prettify(formatter=\"minimal\")`\n  - `soup.prettify(formatter=\"\
    html\")`\n  - `soup.prettify(formatter=\"None\")`\n  - `soup.prettify(formatter=already_defined_func)`\n\
    - get_text(): This method gives you all the content of an object or a tag:\n \
    \ - `soup.get_text()`: This method is used to get all the text content in BeautifulSoup\
    \ or Tag objects\n\n## Summary\n\nThis chapter dealt with the different output\
    \ methods in Beautiful Soup. We saw the formatted and unformatted printing in\
    \ the BeautifulSoup object and also the different output formatters to control\
    \ the output formatting. We also saw a method of getting only the text from a\
    \ web page.\n\nIn the next chapter, we will create a web scraper using searching,\
    \ navigation, and other techniques we have studied in this book so far.\n\n##\
    \ 8\n\n## Creating a Web Scraper\n\nIn this chapter, we will create a website\
    \ scraper using the different searching and navigation techniques we studied in\
    \ the previous chapters. The scraper will visit three websites to find the selling\
    \ price of books based on the ISBN. We will first find out the book list and selling\
    \ price from packtpub.com. We will also find the ISBN of the books from packtpub.com\
    \ and search other websites such as www.amazon.com and www.barnesandnoble.com\
    \ based on this ISBN. By doing this, we will automate the process of finding the\
    \ selling price of the books on three websites and will also get a hands-on experience\
    \ in implementing scrapers for these websites. Since the website structure may\
    \ change later, the code examples and images used in this chapter may also become\
    \ invalid. So, it is better to take the examples as a reference and change the\
    \ code accordingly. It is good to visit these websites for a better understanding.\n\
    \n## Getting book details from PacktPub.com\n\nGetting book details from www.packtpub.com\
    \ is the first step in the creation of the scraper. We need to find the following\
    \ details from PacktPub.com:\n\n- Book title name\n- Selling price\n- ISBN\n\n\
    We have seen how to scrape the book title and the selling price from packtpub.com\
    \ in Chapter 3, Search Using Beautiful Soup. The example we discussed in that\
    \ chapter considered only the first page and didn't include the other pages that\
    \ also had the list of books. So in the next topic, we will find different pages\
    \ containing a list of books.\n\n## Finding pages with a list of books\n\nThe\
    \ page at www.packtpub.com/books has the next and previous navigation links to\
    \ go back and forth between the pages containing a list of books, as shown in\
    \ the following screenshot:\n\n![](img/c437561ffd11fadb571896e0a4ca4d18_114_0.png)\n\
    \nSo, we need to find out a method for getting multiple pages that contain the\
    \ list of books. Logically, it seems to look at the page being pointed at by the\
    \ next element in the current page. Taking a look at the next element, for page\
    \ 49, using the Google Chrome developer tools, we can see that it actually points\
    \ to the next page link, that is, /books?page=49. If we observe different pages\
    \ using the Google Chrome developer tools, we can see that the link to the next\
    \ page's actually has a pattern of /books?page=n for the n+1 page, that is, n=49\
    \ for the 50th page, as shown in the following screenshot:\n\n![](img/c437561ffd11fadb571896e0a4ca4d18_114_1.png)\n\
    \nFrom the preceding screenshot, we can further understand that the next element\
    \ is within the <li> tag with class=\"pager-next last\". Inside the <li> tag,\
    \ there is an <a> tag that holds the link to the next page. In this case, the\
    \ corresponding value is /books?page=49, which points to the 50th page. We have\
    \ to add www.packtpub.com to this value to make a valid URL, as www.packtpub.com/books?page=49.\n"
  mdcn: "\n\n我们可以将不同的格式化器作为参数传递给任何输出方法，例如 `prettify()`、`encode()` 和 `decode()`。\n\n\
