    \      </li>\n    </ul>\n    <ul id=\"secondaryconsumers\">\n      <li class=\"\
    secondaryconsumerlist\">\n        <div class=\"name\">fox</div>\n        <div\
    \ class=\"number\">100</div>\n      </li>\n      <li class=\"secondaryconsumerlist\"\
    >\n        <div class=\"name\">bear</div>\n        <div class=\"number\">100</div>\n\
