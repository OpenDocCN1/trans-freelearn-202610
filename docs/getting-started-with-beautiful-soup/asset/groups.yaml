    So we should pass either the file handle or string to the BeautifulSoup constructor.


    # # Creating a BeautifulSoup object for XML parsing


    Beautiful Soup can also be used for XML parsing. While creating a BeautifulSoup
    object, the TreeBuilder class is selected by Beautiful Soup for the creation of
    HTML/XML tree. The TreeBuilder class is used for creating the HTML/XML tree from
    the input document. The default behavior is to select any of the HTML TreeBuilder
    objects, which use the default HTML parser, leading to the creation of the HTML
    tree. In the previous example, using the string helloworld, we can verify the
    content of the soup_string object, which shows that the input is treated as HTML
    by default.


    ```

    ```python

    soup_string = BeautifulSoup(helloworld)

    print(soup_string)

    ```

    ```


    The output for the previous code snippet is as follows:


    ```

    ```html

    <html><body><p>Hello World</p></body></html>

    ```

    ```'
  - '[PAGE 29]


    If we want Beautiful Soup to consider the input to be parsed as XML instead, we
    need to explicitly specify this using the `features` argument in the `BeautifulSoup`
    constructor. By specifying the `features` argument, BeautifulSoup will be able
    to pick up the best suitable `TreeBuilder` that satisfies the features we requested.


    # Understanding the features argument


    The `TreeBuilders` class use an underlying parser for input processing. Each `TreeBuilder`
    will have a different set of features based on the parser it uses. So the input
    is treated differently based on the features argument being passed to the constructor.
    The parsers currently used by different `TreeBuilders` in Beautiful Soup are as
    follows:


    +   - `lxml`

    +   - `html5lib`

    +   - `html.parser`


    The `features` argument of the `BeautifulSoup` constructor can accept either a
    list of strings or a string value. The currently supported features by each `TreeBuilder`
    and the underlying parsers are described in the following table:


    | Features | TreeBuilder | Parser |

    |---|---|---|

    | [''lxml'',''html'',''fast'',''permissive''] | LXMLTreeBuilder | lxml |

    | [''html'',''html5lib'',''permissive'',''strict'',''html5''] | HTML5TreeBuilder
    | html5lib |

    | [''html'',''strict'',''html.parser''] | HTMLParserTreeBuilder | html.parser
    |

    | [''xml'',''lxml'',''permissive'',''fast''] | LXMLTreeBuilderForXML | lxml |


    The `features` argument can be specified as a list of strings or a string value.
    Beautiful Soup picks the best suitable `TreeBuilder`, which has the feature(s)
    specified. The order of picking a `Treebuilder` in the case of an HTML document
    is based on the priority of the parsers upon which they are built. The first being
    `lxml`, followed by `html5lib`, and at last `html.parser`. For example, if we
    provide `html` as the feature, Beautiful Soup will pick `lxmlTreeBuilder`, if
    the `lxml` parser is available. If the `lxml` parser is not available, it picks
    `HTML5TreeBuilder` based on the `html5lib` parser, and if the `html5lib` parser
    is also not available, then `HTMLPraserTreeBuilder` is picked based on the `html.parser`.
    For XML, since `lxml` is the only available parser, `LXMLTreeBuilderForXML` is
    always selected.'
