    \ Soup版本4。在系统中安装新软件包通常需要root用户权限，这就是为什么我们在apt-get命令前加上sudo的原因。如果我们没有添加sudo，最终会遇到权限拒绝错误。如果软件包已经更新，我们将在命令行中看到以下成功消息：\n\
    \n![](img/c437561ffd11fadb571896e0a4ca4d18_18_0.png)\n\n由于我们使用的是较新版本的Ubuntu或Debian，`python-bs4`\
    \ 会列在`apt`仓库中。但如果上述命令失败并显示`Package Not Found Error`，则表示软件包列表不是最新的。这通常发生在我们刚刚安装操作系统且尚未从软件包仓库下载软件包列表时。在这种情况下，我们需要首先使用以下命令更新软件包列表：\n\
    \n```\nsudo apt-get update\n```\n\n上述命令将从在线软件包仓库更新必要的软件包列表。之后，我们需要再次尝试前面安装Beautiful\
    \ Soup的命令。\n\n在较旧版本的Linux操作系统中，即使运行了`apt-get update`命令，也可能无法安装Beautiful Soup，因为仓库中可能没有它。在这种情况下，我们可以依靠其他安装方法，使用`pip`或`easy_install`。\n\
    \n## 使用pip或easy_install安装Beautiful Soup\n\n`pip`和`easy_install`是用于管理和安装Python包的工具。两者都可以用来安装Beautiful\
    \ Soup。\n\n### 使用pip安装Beautiful Soup\n\n在终端中，输入以下命令：\n\n```\nsudo pip install\
    \ beautifulsoup4\n```\n\n上述命令将从`http://pypi.python.org/`下载必要的软件包后在系统中安装Beautiful\
    \ Soup版本4。\n\n### 使用easy_install安装Beautiful Soup\n\n`easy_install`工具从**Python包索引**（PyPI）安装软件包。因此，在终端中输入以下命令：\n\
    \n```\nsudo easy_install beautifulsoup4\n```\n\n## 安装Beautiful Soup\n\n如果你没有有效的网络连接，前面所有在Linux中安装Beautiful\
    \ Soup的方法都将无法工作。所以，如果一切方法都失败，我们仍然可以安装Beautiful Soup。最后一个选项是使用从pypi.python.org下载的每个Python包附带的`setup.py`脚本。这种方法也推荐用于在Windows和Mac\
    \ OS X机器上安装Beautiful Soup。因此，我们将在*在Windows中安装Beautiful Soup*一节中讨论这种方法。\n\n## 在Windows中安装Beautiful\
    \ Soup\n\n在Windows中，我们将使用https://pypi.python.org/packages/source/b/beautifulsoup4/上可用的最新Beautiful\
    \ Soup Python包，并使用`setup.py`脚本来安装Beautiful Soup。但在执行此操作之前，如果将Python的路径添加到系统路径中，操作会更容易。下一节将讨论在Windows机器上设置Python路径。\n\
    \n### 验证Windows中的Python路径\n\n在Windows中，python.exe的路径通常不会默认添加到环境变量中。因此，为了从Windows命令行提示符检查这一点，你需要输入以下命令：\n\
    \n```\npython\n```\n\n如果Python的路径已经添加到环境路径变量中，或者我们已经在Python安装目录内，上述命令将无错误地运行。但是，最好检查一下路径变量中是否有Python目录条目。\n\
    \n如果路径变量中不存在，我们必须找出实际路径，这完全取决于你安装Python的位置。对于Python 2.x，默认路径为C:\\Python2x；对于Python\
    \ 3.x，默认路径为C:\\Python3x。\n\n我们必须将其添加到Windows机器的*Path*环境变量中。为此，右键单击**我的电脑 | 属性\
    \ | 环境变量 | 系统变量**。\n\n选择Path变量，并将以下内容添加到Path变量中：\n\n```\n;C:\\PythonXY 例如 C:\\\
    Python27\n```\n\n如下截图所示：\n\n![](img/c437561ffd11fadb571896e0a4ca4d18_21_0.png)\n\
    \n在Windows中添加Python路径（本例中使用Python 2.7）\n\nPython路径就绪后，我们就可以按照步骤在Windows机器上安装Beautiful\
    \ Soup。\n\n> 下一节将讲解的通过`setup.py`安装Beautiful Soup的方法在Linux、Windows和Mac OS X操作系统中是相同的。\n\
    \n## 使用setup.py安装Beautiful Soup\n\n我们可以使用`setup.py`脚本来安装Python包，该脚本随从Python包索引网站`https://pypi.python.org/`下载的每个Python包一起提供。以下步骤用于使用`setup.py`安装Beautiful\
    \ Soup：\n\n- 1. 从https://pypi.python.org/packages/source/b/beautifulsoup4/下载最新的tarball。\n\
    - 2. 将其解压到一个文件夹（例如`BeautifulSoup`）。\n- 3. 打开命令行提示符，并导航到解压后的文件夹，如下所示：\n  `cd BeautifulSoup`\n\
    \  `python setup.py install`\n- 4. `python setup.py install`命令将在我们的系统中安装Beautiful\
    \ Soup。\n\n> 我们还没有穷尽使用Beautiful Soup的所有可能选项。即使目前列出的所有选项都失败，我们仍然可以在应用程序中使用Beautiful\
    \ Soup。\n\n## 无需安装即可使用Beautiful Soup\n\n我们迄今讨论的安装过程通常会将模块内容复制到选定的安装目录。这因操作系统而异，在Debian等Linux操作系统中，路径通常是`/usr/local/lib/pythonX.Y/site-packages`，在Windows中则是`C:\\\
    PythonXY\\Lib\\site-packages`（其中X和Y表示相应的版本，如Python 2.7）。当我们在Python解释器或Python脚本中使用import语句时，Python解释器通常会在预定义的Python\
    \ `Path`变量中查找这些目录中的模块。因此，安装实际上就是将模块内容复制到预定义目录，或者将其复制到其他位置并将该位置添加到Python路径中。以下无需安装即可使用Beautiful\
    \ Soup的方法适用于任何操作系统，例如Windows、Linux或Mac OS X：\n\n- 1. 从https://pypi.python.org/packages/source/b/beautifulsoup4/下载最新版本的Beautiful\
    \ Soup包。\n- 2. 解压该软件包。\n- 3. 将`bs4`目录复制到我们希望存放所有Python Beautiful Soup脚本的目录中。\n\
    \n执行完上述所有步骤后，我们就可以使用Beautiful Soup了。在这种情况下，要导入Beautiful Soup，我们需要在包含bs4目录的目录中打开终端，或者将该目录添加到Python\
    \ Path变量中；否则，我们将收到模块未找到的错误。这个额外步骤是必需的，因为该方法特定于包含bs4目录的项目。但对于安装方法，正如我们前面所看到的，Beautiful\
    \ Soup将是全局可用的，可以在任何项目中使用，因此不需要这些额外步骤。\n\n## 验证安装\n\n要验证安装，请执行以下步骤：\n\n- 1. 在终端中使用以下命令打开Python解释器：\n\
    \  `python`\n- 2. 现在，我们可以使用以下命令发出一个简单的import语句来检查我们是否成功安装了Beautiful Soup：\n  `from\
    \ bs4 import BeautifulSoup`\n\n如果我们没有安装Beautiful Soup，而是将bs4目录复制到了工作区，则在使用上述命令之前，我们必须切换到放置bs4目录的目录。\n\
    \n## 快速参考\n\n下表是命令及其含义的概述：\n\n| 命令 | 描述 |\n|---|---|\n| `sudo apt-get install\
    \ python-bs4` | 该命令用于在Linux中使用包管理器安装Python包。 |\n| `sudo pip install beautifulsoup4`\
    \ | 该命令用于使用pip安装Python包。 |\n| `sudo easy_install beautifulsoup4` | 该命令用于使用easy_install安装Python包。\
    \ |\n| `python setup.py install` | 该命令用于使用setup.py安装Python包。 |\n| `from bs4 import\
    \ BeautifulSoup` | 该命令用于验证安装。 |\n\n"
