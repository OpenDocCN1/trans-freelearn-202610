    \ 下一步是将此转换为脚本，以便我们从页面获取与书籍标题相关的所有信息。\n\n我们将首先根据上一章的示例，通过以下方式基于网页创建 `BeautifulSoup`\
    \ 对象：\n\n```python\nimport urllib2\nfrom bs4 import BeautifulSoup\nurl = \"http://www.packtpub.com/books\"\
