    >\n</li>\n```\n\n### 使用 extract() 删除 producer\n\n我们已经使用 `decompose()` 方法从 `li`\
    \ 标签中移除了两个 `div` 标签。但是仅移除 `div` 标签本身并不能保证第三个 producer 被删除；为此，我们还需要移除 `li` 标签。我们也可以使用\
    \ `decompose()` 方法来完成。不过，Beautiful Soup 还有另一种有助于移除标签的方法。\n\n`extract()` 方法用于从\
    \ HTML 树中移除一个标签或字符串。此外，它还会返回被移除的标签或字符串的句柄。与 `decompose()` 不同，`extract()` 也可以用于字符串。如下所示：\n\
