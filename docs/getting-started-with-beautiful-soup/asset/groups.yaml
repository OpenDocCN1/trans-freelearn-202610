    >\n                    soil\n                </div>\n            </li>\n     \
    \   </div>\n        <div>\n            <li class=\"producerlist\">\n         \
    \       algae\n                <div class=\"number\">\n                    100000\n\
    \                </div>\n            </li>\n        </div>\n    </ul>\n</div>\n\
    </body>\n</html>\n```\n\n这里，第一个 `div` 标签将被解包，即 `class=\"name\"` 的 `div` 标签。\n\n\
    > `unwrap()` 方法与 `replace_with()` 类似，会返回被替换的标签。\n\n## 快速参考\n\n- 修改标签名：\n  以下代码行修改\
    \ name 属性：\n  - `tag.name = \"newvalue\"`: 此行代码将 Tag 名称修改为 newvalue\n- 修改标签属性：\n\
    \  以下代码行更改属性：\n  - `tag[\"attr\"] = \"newvalue\"`: 此行代码修改 Tag 属性\n  - `del tag[\"\
    attr\"]`: 此行代码删除 Tag 属性\n- 添加新标签：\n  以下代码行对应内容的添加：\n  - `newtag = soup.new_tag('tagname')`:\
    \ 此行代码创建 newtag\n  - `oldtag.append(newtag)`: 此行代码将 newtag 追加到 oldtag.contents\n\
    \  - `oldtag.insert(0,newtag)`: 此行代码将 newtag 插入到 oldtag.contents 的索引 0 处\n- 修改字符串内容：\n\
    \  以下代码行用于修改字符串内容：\n  - `tag.string = \"helloworld\"`: 此行代码修改 `tag.string`\n \
    \ - `tag.append(\"helloworld\")`: 此行代码将 \"helloworld\" 追加到现有的 `tag.string`\n \
    \ - `newstring = soup.new_string(\"helloworld\")`: 此行代码创建一个新的 `NavigableString`\
    \ 对象\n  - `tag.insert(0,newstring)`: 此行代码将 `newstring` 插入到 `tag.string` 的索引 `0`\
    \ 处\n- 删除现有标签：\n  以下代码行有助于删除现有标签属性：\n  - `tag.decompose()`: 此行代码移除标签及其子节点\n  -\
    \ `tag.extract()`: 此行代码移除并返回标签或字符串\n  - `tag.clear()`: 此行代码移除子节点\n- 特殊函数：\n  以下为用于添加或更改标签的特殊函数：\n\
    \  - `oldtag.insert_after(newtag)`: 此函数在 `oldtag` 之后插入 `newtag`\n  - `oldtag.insert_before(newtag)`:\
    \ 此函数在 `oldtag` 之前插入 `newtag`\n  - `oldtag.replace_with(newtag)`: 此函数用 `newtag`\
    \ 替换 `oldtag`\n  - `oldtag.wrap(newtag)`: 此函数用 `newtag` 包裹 `oldtag`\n  - `oldtag.unwrap(newtag)`:\
    \ 此函数解包 `oldtag` 内的 `newtag`\n\n## Beautiful Soup 中的编码支持\n\n所有网页都会有一个关联的编码。现代网站有不同的编码，如\
    \ UTF-8 和 Latin-1。如今，UTF-8 是网站使用的编码标准。因此，在抓取此类页面时，抓取器也必须能够理解这些编码。否则，用户会在网页浏览器中看到某些字符，而使用抓取器获得的结果将是乱码字符。例如，考虑来自\
    \ Wikipedia 的一个示例网页内容，我们可以看到西班牙语字符 ñ。\n\n### 字母表\n\n西班牙语使用西班牙字母书写，它是拉丁字母加上一个额外的字母\
    \ ñ，共计 27 个字母。\n\n| Letter | A | B | C | D | E | F | G | H | I | J | K | L | M\
    \ | N | Ñ | O | P | Q | R | S | T | U | V | W | X | Y | Z |\n| --- | --- | ---\
    \ | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | ---\
    \ | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- |\n\
    | Name | a | be, be larga, be alta | ce | de | e | efe | ge | hache | i | jota\
    \ | ka | ele | eme | ene | eñe | o | pe | cu | erre | ese | te | u | ve, uve,\
    \ ve corta, ve baja | uve doble, doble ve, doble uve | equis | i griega, ye |\
    \ zeta |\n| IPA | /a/ | /b/ | /k/, /θ/ | /d/ | /e/ | /f/ | /g/, /x/ | silent |\
    \ /i/ | /x/ | /k/ | /l/ | /m/ | /n/ | /ɲ/ | /o/ | /p/ | /k/ | /r/, /ɾ/ | /s/ |\
    \ /t/ | /u/ | /b/ | /ɡw/, /β/ | /ks/, /ɣ/, /s/ | /ʝ/, /ʎ/ | /θ/ |\n\n如果我们将相同的内容通过不支持网站之前使用的编码的抓取器运行，我们可能会得到以下内容：\n\
    \n```\nThe Spanish language is written using the Spanish alphabet, which\nis the\
    \ Latin alphabet with one additional letter,\ne&#21336;e (&#21336;), for a total\
    \ of 27 letters.\n```\n\n我们看到西班牙语字符 ñ 被乱码字符替换。因此，抓取器必须支持不同的编码。Beautiful Soup 处理这些编码非常简洁。在本章中，我们将看到\
    \ Beautiful Soup 中的编码支持。\n\n## Beautiful Soup 中的编码\n\n如前所述，每个 HTML/XML 文档都将以特定的字符集编码编写，例如\
    \ UTF-8 和 Latin-1。在 HTML 页面中，这使用 meta 标签表示，如以下示例所示：\n\n```\n<meta http-equiv=\"\
    Content-Type\" content=\"text/html;charset=UTF-8\">\n```\n\nBeautiful Soup 使用\
    \ UnicodeDammit 库自动检测文档的编码。Beautiful Soup 在从文档创建 soup 对象时将内容转换为 Unicode。\n\n>\
    \ Unicode 是一个字符集，即具有唯一数字的字符列表。例如，在 Unicode 字符集中，字符 B 的数字为 42。UTF-8 编码是一种用于将这些数字转换为二进制表示的算法。\n\
    \n在前面的示例中，Beautiful Soup 将文档转换为 Unicode。\n\n```\nhtml_markup = \"\"\"<p> The Spanish\
    \ language is written using the\nSpanish alphabet, which is the Latin alphabet\
    \ with one\nadditional letter, eñe (ñ), for a total of 27 letters.</p>\n\"\"\"\
    \n\nsoup = BeautifulSoup(html_markup,\"lxml\")\nprint(soup.p.string)\n\n#output\n\
    The Spanish language is written using the Spanish alphabet, which\nis the Latin\
    \ alphabet with one additional letter, eñe (ñ), for\na total of 27 letters.\n\
    ```\n\n从之前的输出可以看出，额外字母部分（e単e (単)）存在差异，因为实际表示的地方出现了乱码字符。这是由于 UnicodeDammit 对文档原始编码的错误解释造成的。\n\
    \n### 了解 HTML 文档的原始编码\n\n之前的 HTML 内容原本是 UTF-8 编码。但 Beautiful Soup 在生成 soup 对象时使用\
    \ UnicodeDammit 库检测编码，我们可以通过 `original_encoding` 属性获取此原始编码。\n\n`soup.original_encoding`\
    \ 将给出原始编码，在前一种情况下为 `euc-jp`。这是错误的，因为 UnicodeDammit 将编码检测为 `euc-jp` 而非 `utf-8`。\n\
    \n### 指定 HTML 文档的编码\n\nUnicodeDammit 库在仔细搜索整个文档后检测编码。这耗时且在某些情况下 UnicodeDammit\
    \ 库会错误地检测编码，如前所述。这种错误猜测大多发生在内容非常短且编码之间存在相似性的情况下。如果我们事先知道 HTML 文档的编码，我们可以避免这种情况。我们可以将编码传递给\
    \ BeautifulSoup 构造函数，从而避免不必要的耗时和错误猜测。编码作为 `from_encoding` 参数指定在构造函数的一部分中。因此，在前一种情况下，我们可以将编码指定为\
    \ `utf-8`。\n\n```\nsoup = BeautifulSoup(html_markup,\"lxml\",from_encoding=\"\
    utf-8\")\nprint(soup.prettify())\n```\n\n```\n#output\n<html>\n  <body>\n    <p>\n\
    \      The Spanish language is written using the Spanish alphabet,\n      which\
    \ is the Latin alphabet with one additional letter,\n      eñe (ñ), for a total\
    \ of 27 letters.\n    </p>\n  </body>\n</html>\n```\n\n"
