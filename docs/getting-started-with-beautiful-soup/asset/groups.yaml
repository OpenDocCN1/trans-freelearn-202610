    # Understanding parameters used with find_all()


    Like `find()`, the `find_all()` method also has a similar set of parameters with
    an extra parameter, `limit`, as shown in the following code line:


    ```

    ```python

    find_all(name,attrs,recursive,text,limit,**kwargs)

    ```

    ```


    The limit parameter is used to specify a limit to the number of results that we
    get. For example, from the e-mail ID sample we saw, we can use `find_all()` to
    get all the e-mail IDs. Refer to the following code:


    ```

    ```python

    email_ids = soup.find_all(text=emailid_regexp)

    print(email_ids)


    #output

    [u''abc@example.com'',u''xyz@example.com'',u''foo@example.com'']

    ```

    ```


    Here, if we pass `limit`, it will limit the result set to the limit we impose,
    as shown in the following example:


    ```

    ```python

    email_ids_limited = soup.find_all(text=emailid_regexp,limit=2)

    print(email_ids_limited)


    #output

    [u''abc@example.com'',u''xyz@example.com'']

    ```

    ```


    From the output, we can see that the result is limited to two.


    > > 💡 The `find()` method is `find_all()` with `limit=1`.


    We can pass True or False values to find the methods. If we pass True to `find_all()`,
    it will return all tags in the soup object. In the case of `find()`, it will be
    the first tag within the object. The `print(soup.find_all(True))` line of code
    will print out all the tags associated with the soup object.'
