    ```\n```\n\nThe previous code will give the following output:\n\n```\n```html\n\
    <html><body><p>http://www.packtpub.com/books</p></body></html>\n```\n```\n\nSo\
    \ we should pass either the file handle or string to the BeautifulSoup constructor.\n\
    \n## Creating a BeautifulSoup object for XML parsing\n\nBeautiful Soup can also\
    \ be used for XML parsing. While creating a BeautifulSoup object, the TreeBuilder\
    \ class is selected by Beautiful Soup for the creation of HTML/XML tree. The TreeBuilder\
    \ class is used for creating the HTML/XML tree from the input document. The default\
    \ behavior is to select any of the HTML TreeBuilder objects, which use the default\
    \ HTML parser, leading to the creation of the HTML tree. In the previous example,\
    \ using the string helloworld, we can verify the content of the soup_string object,\
    \ which shows that the input is treated as HTML by default.\n\n```\n```python\n\
    soup_string = BeautifulSoup(helloworld)\nprint(soup_string)\n```\n```\n\nThe output\
    \ for the previous code snippet is as follows:\n\n```\n```html\n<html><body><p>Hello\
    \ World</p></body></html>\n```\n```\n\nIf we want Beautiful Soup to consider the\
    \ input to be parsed as XML instead, we need to explicitly specify this using\
    \ the `features` argument in the `BeautifulSoup` constructor. By specifying the\
    \ `features` argument, BeautifulSoup will be able to pick up the best suitable\
    \ `TreeBuilder` that satisfies the features we requested.\n\n## Understanding\
    \ the features argument\n\nThe `TreeBuilders` class use an underlying parser for\
    \ input processing. Each `TreeBuilder` will have a different set of features based\
    \ on the parser it uses. So the input is treated differently based on the features\
    \ argument being passed to the constructor. The parsers currently used by different\
    \ `TreeBuilders` in Beautiful Soup are as follows:\n\n- `lxml`\n- `html5lib`\n\
    - `html.parser`\n\nThe `features` argument of the `BeautifulSoup` constructor\
    \ can accept either a list of strings or a string value. The currently supported\
    \ features by each `TreeBuilder` and the underlying parsers are described in the\
    \ following table:\n\n| Features | TreeBuilder | Parser |\n|---|---|---|\n| ['lxml','html','fast','permissive']\
    \ | LXMLTreeBuilder | lxml |\n| ['html','html5lib','permissive','strict','html5']\
    \ | HTML5TreeBuilder | html5lib |\n| ['html','strict','html.parser'] | HTMLParserTreeBuilder\
    \ | html.parser |\n| ['xml','lxml','permissive','fast'] | LXMLTreeBuilderForXML\
    \ | lxml |\n\nThe `features` argument can be specified as a list of strings or\
    \ a string value. Beautiful Soup picks the best suitable `TreeBuilder`, which\
    \ has the feature(s) specified. The order of picking a Treebuilder in the case\
    \ of an HTML document is based on the priority of the parsers upon which they\
    \ are built. The first being `lxml`, followed by `html5lib`, and at last `html.parser`.\
    \ For example, if we provide `html` as the feature, Beautiful Soup will pick `lxmlTreeBuilder`,\
    \ if the `lxml` parser is available. If the `lxml` parser is not available, it\
    \ picks `HTML5TreeBuilder` based on the `html5lib` parser, and if the `html5lib`\
    \ parser is also not available, then `HTMLPraserTreeBuilder` is picked based on\
    \ the `html.parser`. For XML, since `lxml` is the only available parser, `LXMLTreeBuilderForXML`\
    \ is always selected.\n"
  mdcn: "\n# 创建 BeautifulSoup 对象\n\n我们在*第 1 章，安装 Beautiful Soup*中已经了解了如何在 Linux、Windows\
    \ 和 Mac OS X 机器上安装 Beautiful Soup。\n\nBeautiful Soup 广泛用于从网页中获取数据。我们可以使用 Beautiful\
    \ Soup 提取 HTML/XML 文档中的任何数据，例如获取页面中的所有链接或页面内标签中的文本。为了实现这一目标，Beautiful Soup 为我们提供了不同的对象，以及简单的搜索和导航方法。\n\
    \n任何输入的 HTML/XML 文档都会被转换为不同的 Beautiful Soup 对象，基于这些对象的不同属性和方法，我们可以提取所需的数据。Beautiful\
    \ Soup 中的对象列表包括：\n\n- `BeautifulSoup`\n- `Tag`\n- `NavigableString`\n\n## 创建 BeautifulSoup\
    \ 对象\n\n创建 BeautifulSoup 对象是任何 Beautiful Soup 项目的起点。BeautifulSoup 对象表示用于创建它的输入\
    \ HTML/XML 文档。\n\nBeautifulSoup 通过传递一个字符串或一个类文件对象来创建（这个对象可以是我们机器上本地存储的文件的打开句柄，也可以是一个网页）。\n\
    \n## 从字符串创建 BeautifulSoup 对象\n\n可以将字符串传递给 `BeautifulSoup` 构造函数来创建对象，如下所示：\n\n\
    ```\nhelloworld = \"<p>Hello World</p>\"\nsoup_string = BeautifulSoup(helloworld)\n\
    ```\n\n![](img/c437561ffd11fadb571896e0a4ca4d18_26_0.png)\n\n> **下载示例代码**\n> \n\
    > 你可以从自己的账户中下载所有已购买的 Packt 图书的示例代码文件，网址为 `http://www.packtpub.com`。如果你从其他渠道购买了本书，可以访问\
    \ `http://www.packtpub.com/support` 并注册，文件将会直接通过电子邮件发送给你。\n\n上述代码将根据输入字符串 `helloworld`\
    \ 创建 BeautifulSoup 对象。我们可以看到输入已被当作 HTML 处理，并可通过 `print(soup_string)` 查看该对象的内容。\n\
    \n```\n<html><body><p>Helloworld</p></body></html>\n```\n\n![](img/c437561ffd11fadb571896e0a4ca4d18_26_1.png)\n\
    \n> 根据所使用的解析器，上述代码的输出在某些系统中可能会有所不同。这将在本章后面进行解释。\n\n在创建对象的过程中，Beautiful Soup 会使用受支持的解析器将输入标记（HTML/XML）转换为树结构。这样，标记会被表示为不同的\
    \ Beautiful Soup 对象，例如 `BeautifulSoup`、`Tag` 和 `NavigableString`。\n\n## 从类文件对象创建\
    \ BeautifulSoup 对象\n\n也可以将类文件对象传递给 BeautifulSoup 构造函数来创建对象。这在解析在线网页时非常有用，这也是 Beautiful\
    \ Soup 最常见的用途。\n\n例如，假设我们需要获取由 Packt Publishing 出版的所有图书的列表，该列表位于 `http://www.packtpub.com/books`。为了减少通过浏览器访问此\
    \ URL 来获取页面内容为字符串的开销，更合适的做法是提供该 URL 的类文件对象来创建 BeautifulSoup 对象。\n\n```\nimport\
    \ urllib2\nfrom bs4 import BeautifulSoup\n```\n\n```\nurl = \"http://www.packtpub.com/books\"\
    \npage = urllib2.urlopen(url)\nsoup_packtpage = BeautifulSoup(page)\n```\n\n在上述\
    \ Python 脚本中，我们使用了 urllib2 模块（Python 原生模块）来打开 http://www.packtpub.com/books 页面。`urllib2.urlopen()`\
    \ 方法会为输入的 URL 返回一个类文件对象。然后我们通过传递该类文件对象来创建 BeautifulSoup 对象 `soup_packtpage`。\n\
    \n> 使用 URL 类文件对象创建 BeautifulSoup 对象是处理在线网页的高效方式。\n\n在上一示例中，我们学习了如何通过为 URL 传递类文件对象来创建\
    \ BeautifulSoup 对象。类似地，我们也可以将本地文件的文件对象传递给 BeautifulSoup 构造函数。\n\n为此，请从终端执行命令 mkdir\
    \ Soup，在机器上创建一个本地文件夹。使用 touch Soup/foo.html 在该文件夹中创建一个 HTML 文件 foo.html。在同一终端中，使用\
    \ cd Soup 切换到刚创建的目录。\n\n现在让我们来看一下使用 foo.html 文件创建 BeautifulSoup 的过程。\n\n```\n\
    with open(\"foo.html\",\"r\") as foo_file:\n    soup_foo = BeautifulSoup(foo_file)\n\
    ```\n\n上面几行代码会根据本地文件 foo.html 的内容创建一个 BeautifulSoup 对象。\n\nBeautifulSoup 有一个基本的警告机制，用于提示我们传入的是文件名而不是文件对象。\n\
    \n让我们看一下下一行代码：\n\n```\nsoup_foo = BeautifulSoup(\"foo.html\")\n```\n\n这将产生以下警告：\n\
    \nUserWarning: \"foo.html\" looks like a filename, not markup. You should probably\
    \ open this file and pass the filehandle into Beautiful Soup.\n\n但仍然会创建一个 BeautifulSoup\
    \ 对象，并假定我们传入的字符串（\"foo.html\"）是 HTML。\n\n`print(soup_foo)` 代码行将给出以下输出：\n\n```html\n\
    <html><body><p>foo.html</p></body></html>\n```\n\n同样的警告机制也会在我们尝试传入 URL 而不是 URL\
    \ 文件对象时提醒我们。\n\n```python\nsoup_url = BeautifulSoup(\"http://www.packtpub.com/books\"\
    )\n```\n\n上一行代码将产生以下警告：\n\n```text\nUserWarning: \"http://www.packtpub.com/books\"\
    \ looks like a URL.\nBeautiful Soup is not an HTTP client. You should probably\
    \ use\nan HTTP client to get the document behind the URL, and feed\nthat document\
    \ to Beautiful Soup\n```\n\n这里同样会创建 BeautifulSoup 对象，并将该字符串（URL）视为 HTML。\n\n```python\n\
    print(soup_url)\n```\n\n上述代码将给出以下输出：\n\n```html\n<html><body><p>http://www.packtpub.com/books</p></body></html>\n\
    ```\n\n因此，我们应该向 BeautifulSoup 构造函数传入文件句柄或字符串。\n\n## 创建用于 XML 解析的 BeautifulSoup\
    \ 对象\n\nBeautiful Soup 也可以用于 XML 解析。在创建 BeautifulSoup 对象时，Beautiful Soup 会选择 TreeBuilder\
    \ 类来创建 HTML/XML 树。TreeBuilder 类用于根据输入文档创建 HTML/XML 树。默认行为是选择任意一个使用默认 HTML 解析器的\
    \ HTML TreeBuilder 对象，从而创建 HTML 树。在前面的示例中，使用字符串 helloworld 时，我们可以验证 soup_string\
    \ 对象的内容，这表明输入在默认情况下被视为 HTML。\n\n```python\nsoup_string = BeautifulSoup(helloworld)\n\
    print(soup_string)\n```\n\n上述代码片段的输出如下：\n\n```html\n<html><body><p>Hello World</p></body></html>\n\
    ```\n\n如果我们希望 Beautiful Soup 转而将输入解析为 XML，则需要使用 `BeautifulSoup` 构造函数中的 `features`\
    \ 参数来明确指定这一点。通过指定 `features` 参数，BeautifulSoup 将能够选择满足我们所请求特性的最佳 `TreeBuilder`。\n\
    \n## 理解 features 参数\n\n`TreeBuilders` 类使用底层解析器进行输入处理。每个 `TreeBuilder` 会根据其使用的解析器拥有不同的特性集。因此，输入会根据传递给构造函数的\
    \ `features` 参数而以不同的方式处理。Beautiful Soup 中目前由不同 `TreeBuilder` 使用的解析器如下：\n\n- `lxml`\n\
    - `html5lib`\n- `html.parser`\n\n`BeautifulSoup` 构造函数的 `features` 参数可以接受字符串列表或字符串值。每个\
    \ `TreeBuilder` 及其底层解析器当前支持的特性如下表所示：\n\n| 特性 | TreeBuilder | 解析器 |\n|---|---|---|\n\
    | ['lxml','html','fast','permissive'] | LXMLTreeBuilder | lxml |\n| ['html','html5lib','permissive','strict','html5']\
    \ | HTML5TreeBuilder | html5lib |\n| ['html','strict','html.parser'] | HTMLParserTreeBuilder\
    \ | html.parser |\n| ['xml','lxml','permissive','fast'] | LXMLTreeBuilderForXML\
    \ | lxml |\n\n`features` 参数可以指定为字符串列表或字符串值。Beautiful Soup 会选择具有指定特性的最合适的 `TreeBuilder`。对于\
    \ HTML 文档，选择 TreeBuilder 的顺序取决于其构建所基于的解析器的优先级：首先是 `lxml`，其次是 `html5lib`，最后是 `html.parser`。例如，如果我们提供\
    \ `html` 作为特性，Beautiful Soup 会在 `lxml` 解析器可用时选择 `lxmlTreeBuilder`。如果 `lxml` 解析器不可用，它会选择基于\
    \ `html5lib` 解析器的 `HTML5TreeBuilder`；如果 `html5lib` 解析器也不可用，则选择基于 `html.parser`\
    \ 的 `HTMLPraserTreeBuilder`。对于 XML，由于 `lxml` 是唯一可用的解析器，所以始终选择 `LXMLTreeBuilderForXML`。\n"
