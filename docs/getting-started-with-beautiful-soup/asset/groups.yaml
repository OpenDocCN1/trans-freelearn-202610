    \     </div>\n                <div class=\"number\">\n                    100000\n\
    \                </div>\n            </li>\n        </ul>\n    </div>\n</body>\n\
    </html>\n```\n\n执行前面的代码后，我们可以看到，第三个 producer（即 phytoplankton）已从生态金字塔示例中移除。\n\n\
    ## 使用 Beautiful Soup 删除标签的内容\n\n标签的子节点可以是 `NavigableString` 对象，也可以是 `Tag` 对象。可以使用\
    \ `clear()` 来删除这些子对象。\n\n例如，我们可以使用 `clear()` 方法从 `li` 标签中移除包含 plants 的 `<div>`\
    \ 标签以及对应的带有 class number 的 `<div>` 标签；如下所示：\n\n```python\nli_plants=soup.li\n\
    ```\n\n由于这是第一个 `li` 标签，我们可以通过名称来选择它；如下所示：\n\n```python\nli_plants.clear()\n```\n\
    \n这将移除标签的所有 `.contents`。因此，`clear()` 会移除特定标签内的所有字符串和子节点。如下所示：\n\n```python\nprint(li_name)\n\
