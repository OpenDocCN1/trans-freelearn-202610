    >plants</div>\n```\n\n前面的代码打印出下一个元素，即 <div class=\"name\">plants</div>。\n\n> .next_element\
    \ 和 .next_sibling 完全不同。 .next_element 指向解析后紧跟当前对象的对象，而 .next_sibling 指向树中同一层级的对象。\n\
    \n同样，`.previous_element` 可用于查找特定标签或字符串之前立即解析的元素。\n\n```\nsecond_div = soup.find_all(\"\
    div\")[1]\nprint(second_div.previous_element)\n\n#output\nplants\n```\n\n从输出可以看出，在第二个\
    \ <div> 标签之前立即解析的是字符串 plants。\n\n## 快速参考\n\n以下命令可帮助您向下导航树：\n\n- tag.name: 这使用名称导航到子节点\n\
    - tag.contents: 这列出子节点\n- tag.children: 这是子节点的生成器\n- `tag.descendants`: 这是后代的生成器\n\
    - `tag.string`: 这使用 `.string` 导航到字符串\n- `tag.strings`: 这是字符串的生成器\n\n以下命令可帮助您向上导航树：\n\
    \n- `tag.parent`: 这导航到父级\n- `tag.parents`: 这是父级的生成器\n\n以下命令可帮助您横向导航：\n\n- `tag.next_sibling`:\
    \ 这导航到下一个兄弟节点\n- `tag.next_siblings`: 这是下一个兄弟节点的生成器\n- `tag.previous_sibling`:\
    \ 这导航到上一个兄弟节点\n- `tag.previous_siblings`: 这是上一个兄弟节点的生成器\n\n以下命令可帮助您导航到前一个或下一个元素：\n\
    \n- `tag.next_element`: 这导航到解析的下一个元素\n- `tag.previous_element`: 这导航到解析的前一个元素\n\
    \n## 总结\n\n在本章中，我们讨论了 Beautiful Soup 中的各种导航技术。我们讨论了四种导航方式，即向上、向下、横向导航，以及使用示例导航到下一个和前一个元素。\n\
    \n在下一章中，我们将学习通过添加新内容，例如标签、字符串、修改标签和删除现有内容等，以不同方式修改解析后的 HTML 树。\n\n## 5\n### 使用\
    \ Beautiful Soup 修改内容\n\nBeautiful Soup 可有效用于在 HTML/XML 文档中搜索或导航。除此之外，我们还可以使用\
    \ Beautiful Soup 来更改 HTML/XML 文档的内容。修改内容意味着添加或删除新标签、更改标签名、修改标签属性值、更改文本内容等。这在需要解析\
    \ HTML/XML 文档、更改其结构并将其写回为修改后的 HTML/XML 文档的情况下很有用。\n\n考虑一种情况，我们有一个包含 <table> 标签的\
    \ HTML 文档，其中包含约 1,000 行或更多行（<tr> 标签），每行现有两列（<td> 标签）。我们希望为每一行添加一组新的两个 <td> 标签。手动为每个\
    \ <tr> 标签添加这些 <td> 标签是不合适的。在这种情况下，我们可以使用 Beautiful Soup 搜索和/或导航每个 <tr> 标签以添加这些\
    \ <td> 标签。然后我们可以将这些更改保存为新的 HTML 文档，该文档将为每个 <tr> 标签包含四个 <td> 标签。本章通过考虑我们在前几章中使用的生态金字塔示例，介绍使用\
    \ Beautiful Soup 修改内容的各种方法。\n\n## 使用 Beautiful Soup 修改标签\n\nBeautiful Soup 具有完全更改\
