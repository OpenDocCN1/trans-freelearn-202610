  - "[PAGE 119]\n\nFrom the preceding screenshot, we can see that the **ISBN** number\
    \ is stored as text followed by the ISBN inside the b tag.\n\nNow, in the following\
    \ code, let us see how we can find the ISBN using the `get_isbn()` function:\n\
    \n```\ndef get_isbn(url):\n    book_title_url = packtpub_url + url\n    page =\
    \ urllib.urlopen(book_title_url)\n    soup_bookpage = BeautifulSoup(page,\"lxml\"\
    )\n    page.close()\n    isbn_tag = soup_bookpage.find('b',text=re.compile(\"\
    ISBN :\"))\n    return isbn_tag.next_sibling\n```\n\nIn the preceding code, we\
    \ searched for the b tag with the text that matches the pattern ISBN :. The ISBN\
    \ is `next_sibling` of the b tag.\n\nIn each main page, there will be a list of\
    \ books, and for each book, there will be an ISBN. So we need to call the `get_bookdetails()`\
