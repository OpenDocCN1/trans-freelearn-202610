- 'no': 24156
  overturn_probability: 0.65
  alternative: 第6章正文标题或一级小标题
  counter_evidence:
  - 标题中包含中文句号“。”（“第 6 章。”），违反章标题应无终止标点的格式规范。
  - 与后续第7章标题（行25073，使用“##”）层级不一致：若“#”为最高层级，则“##”不应作为同级新章；若“##”为章层级，则“#”可能并非普通书章。
  - 该行紧接“## 摘要”之后，可能是前一章摘要或格式转换产生的标题行，而非独立章节起点。
  keep_split: false
