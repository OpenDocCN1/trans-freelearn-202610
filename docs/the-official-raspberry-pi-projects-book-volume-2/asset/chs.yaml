  ## TWEET FROM YOUR RASPBERRY PI WITH THE WOLFRAM LANGUAGE\n\nDana Flinn 和 Brett\
  \ Haines 将带你了解如何使用 SendMessage 函数在 Wolfram 语言中轻松发送推文\n\nWolfram 语言是一种功能强大的基于知识的语言，让计算变得人人可及，也是初学者入门编程时容易上手的一门语言。要在\
  \ Raspberry Pi 上从 Twitter 发送推文，你只需要一个函数。我们将使用 SendMessage，它是 Wolfram 语言中的一个多用途函数，可让\
  \ Raspberry Pi 用户无缝地从设备上发推。\n\n使用 SendMessage 函数，我们将带你了解如何应用符号语言并使用 Raspberry Pi\
  \ 发送推文。不过别局限于仅用此函数发推！SendMessage 还可用于生成电子邮件、更新 Facebook 或 LinkedIn 状态，以及生成蜂鸣声。\n\
  \n### >STEP-01\n\n### 准备语法\n\n首先，你需要在 Raspberry Pi 上启动 Mathematica 并打开一个空白笔记本。Wolfram\
  \ 语言内置了超过 5,000 个函数，初看可能会让人望而生畏。然而，使用文档中心可以轻松找到适合项目的正确函数。\n\n在 Wolfram 语言中，所有函数都使用方括号，并且名称以大写字母开头。本项目所需的函数是\
  \ SendMessage，相当直接。它用于向指定频道发送消息，在我们这里是 Twitter。\n\n### PYTHON VS WOLFRAM\n\n与 Python\
  \ 相比，Wolfram 提供了更轻松的 Twitter 访问方式，因此根据你的需求，Wolfram 可能已足够。\n\n## TWEET WITH THE WOLFRAM\
  \ LANGUAGE\n\n### Tutorial\n\n![](img/d8322379620245fcd21eccc3855b8c78_104_0.png)\n\
  \nMORE IN WOLFRAM\n在 Wolfram 网站上找到更多来自 Wolfram 团队的项目：magpi.cc/1SCpu2o\n\nLeft 你可以发送任何你想要的消息推文，它会立即出现——当然，限制为\
  \ 140 个字符！\n\n### >STEP-02\n\n### 设置你的代码\n\n要设置代码，请在 Pi 上打开 Mathematica 并输入 SendMessage\
  \ 函数，然后输入你想要推文的内容。因此，根据文档中心，我们知道它应设置如下：\n\n```\nSendMessage[\"Twitter\", \"Tweet\
  \ text\"]\n```\n\n其中写着“Tweet text”的地方，文本可以更改为你希望发布到 Twitter 账户的任何内容。\n\n### >STEP-03\n\
  \n### 评估你的代码\n\n输入后，按 SHIFT+ENTER。这将在 Mathematica 中运行你的代码，并提示授权对话框以允许 Wolfram 语言代表你发送推文。授权后，推文将被发送到你的账户。输入访问密钥后选择“Done”，推文就会出现在你的\
  \ Twitter 动态中。\n\n### >STEP-04\n\n### 创建变量\n\n之前的示例展示了发送静态字符串的推文。然而，这远非 Wolfram\
  \ 语言所能实现的一切。就像其他编程语言一样，它允许用户设置变量，我们可以在其中存储任何内容。要创建变量，只需输入你想要的名称、等号，然后是你想要赋给变量的内容，如下所示：\n\
  \n```\nmyVariable = \"Some string here!\"\n```\n\n与许多其他编程语言不同，你无需指定变量中存储的数据类型——Wolfram\
  \ 语言足够智能，可以自行判断它是什么以及如何使用！\n\n### >STEP-05\n\n### 使用 StringJoin\n\n你可以使用 StringJoin\
  \ 函数合并字符串。就像 SendMessage 一样，StringJoin 是通过将要连接的字符串放在方括号（[ 和 ]）之间，以逗号分隔来使用的。因此，要连接“Hello\
  \ ”和“world”，你需要输入：\n\n```\nStringJoin[\"Hello \", \"world\"]\n```\n\n这不仅限于静态字符串——变量也可以与字符串连接，如下所示：\n\
  \n```\nStringJoin[\"Hello \", myVariable]\n```\n\n### >STEP-06\n\n### 将其全部组合\n\n\
  现在是时候把所有东西组合起来了。我们可以取一个变量，为其存储一个字符串，将其与另一个字符串连接，然后发送到 Twitter：\n\n```\nmyName =\
  \ \"WolframLanguage\"\nSendMessage[\"Twitter\", StringJoin[\"This tweet brought\
  \ to you by \", myName]]\n```\n\n现在你知道了 Wolfram 语言中函数的工作原理，很容易深入文档并探索内置的数千个函数。现在出发去编码吧！\n\
