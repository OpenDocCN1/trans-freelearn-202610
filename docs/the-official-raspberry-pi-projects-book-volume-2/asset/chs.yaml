  ## 阿空加瓜远征


  此后，Kurt为2016年1月前往安第斯山脉阿空加瓜山的远征制作了另一个模型——海拔6,961米，是美洲的最高峰，也是亚洲以外任何地方的最高峰。虽然Kurt没有参加这次远征，但他之前曾攀登过该山。他的阿空加瓜1:100,000比例模型与乞力马扎罗的模型以类似方式构建，Raspberry
  Pi被封闭在掏空的3D打印模型内。六个LED标记山顶和营地的位置。世界领先的登山向导服务之一Madison Mountaineering正在使用inReach设备传输其实时远征位置——magpi.cc/1J00l3Y。




  ## 平衡机器人


  一个由 Raspberry Pi 驱动的社交型平衡机器人。通过代码平衡机器人有多棘手呢？


  ### KRIS TEMMERMAN


  一名自由开发者，为博物馆和广告机构创建互动展示。他在业余时间建造机器人。

  neuroproductions.be


  ![](img/d8322379620245fcd21eccc3855b8c78_69_0.png)


  一旦检测到人脸，机器人就会在 7" 屏幕上显示表情


  上部增加的重量越多，轮子附近所需的平衡就越多，因此有了这些稳定器


  整机无线运行，最终的自主性水平将高于目前


  ### Quick Facts


  - 机器人目前已花费 20 天建造

  - 它对检测到的人的反应仍需改进

  - 屏幕在检测到人时会显示人脸

  - 机器人计划配备手臂

  - 它使用 Pi 相机进行人脸识别


  这就是为什么很多机器人不使用两轮或两条腿的原因：很简单，它们很难保持平衡。一般来说，拥有三轮（或更多）或四条腿（或更多）要容易得多也更稳固，只是拥有较低的重心就是一件好事。特别是对于两轮来说，你需要某种方式来保持平衡。通常，这个任务留给人类；不过正如
  Kris Temmerman 向我们展示的那样，适量的编程和构造也能实现同样的效果。


  “The idea came after seeing some social robots, like Nao and Pepper,” Kris tells
  us. “Technologically they’re great, but I think they are also kind of boring. Too
  polite, too cute. I wanted to see if I can make a social robot with a little bit
  more character.”


  机器人具有自平衡功能，以便它能达到与这些个人助理机器人相似的外观，并且希望在过程中看起来比《洛基 IV》中的机器人没那么奇怪。它内置了人脸识别功能，因此可以正确地检测和反应人们。


  “For me it’s a sandbox – a way to try all kinds of hardware and software,” Kris
  explains. Since he wanted to do some intensive computations, in combination with
  a display and sound, he opted to use a Raspberry Pi 2. “The quad-core [CPU] came
  in really handy. I have the face recognition running in a separate thread on its
  own core, so the main process that handles the graphics, sound, and motion can run
  smooth and uninterrupted. And I still have two cores left over for future improvements.”


  For the face recognition I use OpenCV, an open-source computer vision library that
  has the hard parts already solved for you.


  Kris 使用尼龙板自行制作了大部分机身和底盘，并配有一些备用电机和驱动器。构建中还包含一层 Arduino，以帮助平衡。


  > 它内置了人脸识别功能，因此可以正确地检测和反应人们


  Kris 说这绝对不是一个适合初学者的项目，但它并没有看起来那么难。“如果你有合理的编程经验，这绝对是你能制作的东西。你可以在网上找到大量关于平衡机器人的信息。”


  这效果很好，你可以在网上观看一些小机器人用两轮疾驰的视频（magpi.cc/1URY7zT）。


  机器人仍有一些工作需要完成。特别是，Kris 正在考虑为其安装激光雷达，以便它能更好地感知环境，从而实现自主移动。


  “This was my first project with a Raspberry Pi, but I really like that it has a
  full-blown Linux distro… I’m definitely going to use it more in the future.”


  ![](img/d8322379620245fcd21eccc3855b8c78_70_1.png)


  ### OPERATE A ROBOT


  ![](img/d8322379620245fcd21eccc3855b8c78_70_0.png)


  表情目前承认有点恐怖，虽然它们确实允许代码进行测试


  ### STEP-01 Balancing act


  一旦打开电源，机器人就会开始自我平衡以保持直立。就像波士顿动力机器人一样，推动它会使其自行矫正。


  ![](img/d8322379620245fcd21eccc3855b8c78_70_2.png)


  ### STEP-02 Remote control


  机器人目前并非完全自主，因此要控制它，你必须使用连接到 Raspberry Pi 的无线键盘。不过在你驾驶它周围时，它会保持平衡。


  ![](img/d8322379620245fcd21eccc3855b8c78_70_3.png)


  ### STEP-03 I see you


  相机可以检测人脸。如果人脸出现在其视线范围内，机器人会朝人脸方向看并发出噪音做出反应。


  ## EYE-PI CAMERA


  别提便携式 Raspberry Pi 相机了——如何用便携式 Pi IR 相机拍摄惊艳独特的照片呢？


  ### KRZYSZTOF JANKOWSKI


  一名像素艺术家和独立游戏开发者，Krzysztof 在业余时间喜欢用 Raspberry Pi 和 Arduino 设备进行改装。

  krzysztofjankowski.com / pzx.in


  由于红外范围主要是热量，天空会比平常更暗，而其他物体则会异常突出


  在白天拍摄超现实的红外照片，以获得对世界略有不同的视角


  它大致像普通相机一样工作——只需对准并拍摄即可拍照！


  ### Quick Facts


  - 它在上午就完成了测试和制作

  - Krzysztof 喜欢使用 Raspberry Pi 制作不同的便携式项目

  - Krzysztof 计划制作一个带有 RSS 订阅源和统计数据的智能墙

  - 他计划下一步使用 Arch

  - 该项目使用 B+，而不是 Pi 2 或 3


  红外（IR）相机传统上用于低光环境。通常，红外用于夜间安防摄像头，你也可以将红外相机植入鸟舍以实时观看雏鸟。然而，在白天用于“正常”照片则相当不寻常。然而，这正是
  Krzysztof Jankowski 决定使用 Raspberry Pi 和 Pi NoIR 相机模块想要做的事情。


  “I’ve been a photographer for many years and I’ve always wanted to take surreal
  (at least to our eye) infrared photos,” Krzysztof tells us, “but there was no commercial
  camera that can do that easily. Also, those cameras for astronomers were always
  pricey. Using filters was too time-consuming and requires using high ISO.


  “When I was ready to buy the [Pi] Camera Module, I chose the NoIR to test how it
  works. After the few first tests, it turned out it works perfectly fine, but using
  it with wires, monitor, keyboard, and making photos by command line was absolutely
  not fun. A camera needs to be small and have a physical button to make photos.”


  Krzysztof 使用“大量胶带”制作了原型并带着它出去散步。它按他希望的那样工作，所以他开始着手制作更坚固、更易用的版本。


  “For me it was very easy as I know Linux, programming, and soldering,” he explains.
  “I think that even for newbies it will still be easy. The whole thing is fairly
  basic to make yourself: connect camera, solder button and LED on, put wires to proper
  GPIO ports, and download my script and install a few required packages.”


  他的自定义脚本使这一切成为可能，可以从 GitHub 下载（magpi.cc/1K2PRgi）。它只有 23 行长，但根据 Krzysztof 的说法，它对拍照方式进行了一些调整以使其看起来像那样，并优化了速度：


  “There’s a small lag like in early digital cameras. For landscape photography it’s
  absolutely acceptable, though. The only downfall is the booting time: as it boots
  the whole of Raspbian, it takes 30-40 seconds. However, it can work for hours on
  my power bank without shutting down.”


  ![](img/d8322379620245fcd21eccc3855b8c78_71_0.png)


  眩光在深入可见光范围之外进入红外时会产生惊人的效果


  目前，相机有点简单，未来计划升级。从软件角度来看，Krzysztof 想要软件关机以防止数据损坏，但他还想添加一个小型 OLED 屏幕用于实时预览和设置。这些设置然后将通过构建上的额外开关进行更改。


  Krzysztof 自己做了很多小 Pi 项目，并不打算就此止步。“我鼓励人们尝试 Raspberry Pi——每个项目都是学习新东西的机会。而且自己制作东西总是很有趣。”


  Mark two 装置具有快门按钮和 LED 来告知你何时准备就绪，虽然将添加预览屏幕


  ### TAKE A SURREAL PHOTO


  ### STEP-01 Boot process


  目前还没有开关，所以插入便携式电池即可打开电源。这会在 Pi 上启动 Raspbian，并且 LED 会亮起，然后在相机准备就绪后熄灭。


  ### STEP-02 Take a photo


  就像任何相机一样，你只需要按下快门按钮即可。这个按钮会激活 Python 脚本来打开 LED、设置相机并拍摄照片。然后它会关闭 LED。


  ### STEP-03 Get the photo


  你可以手动从 SD 卡获取照片。然而，它也设置为可以通过 WiFi 使用 SFTP 检索，以便快速访问。





