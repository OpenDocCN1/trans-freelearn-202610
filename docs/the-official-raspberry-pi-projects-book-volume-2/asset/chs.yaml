  ## RASPBERRY PIP-BOY 3000A

  用定制的手腕佩戴电脑在放射性荒原或镇上阴郁的一天中生存


  Fallout 电子游戏中的 Pip-Boy 如今已成为相当具有标志性的装备。虚构的手腕电脑的功能可能不如该系列在 1990 年代首发时那样令人惊叹，但复古未来主义的外观使其在流行文化的某些角落得以保留。如今，随着
  Fallout 系列兴趣的重新燃起、创客的兴起以及角色扮演的爆炸式流行，时不时会有一个新的自制 Pip-Boy 在网上出现并小范围走红。即使即将发布 Fallout
  4 的特别版附带官方 Pip-Boy，人们仍在制作自己的版本，比如 Jesse Roe。“该项目是尝试制作一个完全功能性的 Pip-Boy 3000A。不是把手机塞进去的东西，而是一个真正工作的设备，”Jesse
  告诉我们，指的是需要智能手机的官方 Pip-Boy。Jesse 从未为他的 Raspberry Pi 找到完美用途，于是决定将其用于为朋友制作的这个项目。使用他自己修改的
  3D 打印机箱，制作并不简单。


  “我总共大约花了 70 小时在这上面，其中很多只是研究，”Jesse 解释了他的制作过程。“关于如何制作 Pip-Boy、从哪里获取铸件、材料等，有很多资料。主要要获取的是
  Pip-Boy 铸件本身，我从 Shapeways 上的 Nakamura Shop 订购了它。“一旦到手，我们将其打磨并用模型漆涂上底色，颜色更深的绿色。”


  ## USE A CUSTOM PIP-BOY

  ![](img/d8322379620245fcd21eccc3855b8c78_28_0.png)

