- "## Pi Zero 集群板\n\n将你的 Raspberry Pi Zero 转变为使用这块定制板打造的算力集群计算机\n\n## 快速概览\n\n- 该板可与任意数量的\
  \ Pi Zero 配合使用\n- 从构想到完成，集群的建造耗时六周\n- Actbulb 中使用了 Compute Module\n- 团队一直在研究 VideoCore\
  \ GPU 以用于未来项目\n- 即使安装了 Pi，板子的尺寸也为 20cm × 20cm × 5cm\n\n## IDEIN, INC\n\nYasuyuki\
  \ Yamada、Koichi Nakamura 和 Yukimasa Sugizaki 组成了 Idein, Inc 的团队，该公司从事 AI 技术研发。\n\
  idein.jp\n\n![](img/d8322379620245fcd21eccc3855b8c78_91_0.png)\n\n![](img/d8322379620245fcd21eccc3855b8c78_91_1.png)\n\
  \n每个 Pi Zero 都连接了一个全尺寸 USB 端口\n\n16 个 Pi Zero 并行工作意味着可获得 16 个 1GHz 内核和 8GB 内存\n\n\
  板子由后方的一个电源供电，可激活全部 16 个 Pi Zero\n\n当 Raspberry Pi Zero 正在研发时，Eben Upton 曾提到一盒 Pi\
  \ Zero 里装有数百个。数百个核心和数百 GB 的内存——如果使用得当，这就是一箱算力。我们从未算出过一盒理论上能处理多少 FLOPS，即使这可能并不现实。然而，一家日本公司也看到了\
  \ Pi Zero 在数量上的威力，并打造了 PiZero Cluster Board，可让多达 16 个 Pi Zero 进行并行计算。\n\n我们就集群板采访了\
  \ Idein, Inc 的代表董事 Koichi Nakamura：\n\n“When I was playing with Raspberry Pi Zero,\
  \ I realised that costs of cables and adapters are relatively expensive, and found\
  \ a solution that used micro USB plugs for cradles. I used this idea to create our\
  \ computer cluster… I think it’s useful for many other projects, [but it was] originally\
  \ designed and developed for our internal purposes.”\n\nIdein 目前正在开发 Actbulb，这是一款基于\
  \ Pi 的传感器套件，可插入标准灯泡插座，按你想要的方式使用。传感器包括麦克风和摄像头；它还具备联网功能并配有音频扬声器。\n\n“Since we are\
  \ developing products using Raspberry Pi, we need a cluster of many Pis for software\
  \ development and tests,” Koichi explains to us. “It’s also useful to set up many\
  \ other devices… We plan to create a cluster to enable setup of hundreds of our\
  \ devices a day.”\n\n## 创建集群\n\n![](img/d8322379620245fcd21eccc3855b8c78_92_0.png)\n\
  \n### >STEP-01\n为自己做好准备\n\n首先，你只需将 Raspberry Pi Zero 插入即可。它一次可使用最少 1 个，最多 16 个。\n\
  \n![](img/d8322379620245fcd21eccc3855b8c78_92_1.png)\n\n### >STEP-02\n连接它\n\n下一步是连接所有部件。应先接入以太网交换机和线缆，然后再接入交流适配器供电。\n\
  \n![](img/d8322379620245fcd21eccc3855b8c78_92_2.png)\n\n### >STEP-03\n并行工作\n\n就这样！打开电源后，你就可以使用\
  \ MPI 或其他任何方法同时利用多个 Pi Zero 进行编程。\n\n![](img/d8322379620245fcd21eccc3855b8c78_92_3.png)\n\
  \n上图 Pi Zero 通过其 micro USB 电源和数据端口插入。每个单元还需配备安装了操作系统的 SD 卡\n\n下图 是促使 Pi Zero 集群板诞生的基于\
  \ Pi 的传感器。它可连接到标准灯具\n\n它在网上引起了巨大反响，许多人对该板子感到兴奋。然而，Koichi 认为这是一个相当简单的项目：\n\n“PiZero\
  \ Cluster Board 只是 16 个相同电路的集合。每个电路都通过 SMSC LAN9512 芯片从[每个]Raspberry Pi Zero 的 micro\
  \ USB 端口引出一个以太网端口和一个 USB 端口。还有 16 个电源电路，可从 12V 单电源为 Raspberry Pi Zero 和 LAN9512\
  \ 生成 5V 和 3.3V。全部 16 个电路都相同。”\n\n> 我们计划创建一个集群，以便每天设置数百台设备\n\n由于 Pi Zero 供应紧张，团队最初无法获得足够数量来完成集群。幸运的是，我们在《The\
  \ MagPi》动用了所有人情，拉动了所有关系，并恳求、哀求和借用，才为他们凑齐了测试所需的剩余 15 个 Pi Zero。\n\n由于板子的受欢迎程度和多种用途，Koichi\
  \ 计划在准备众筹时将其放到 Kickstarter 上。它将是我们在线上看到的原型的改进版。\n\n“In our current plan, the number\
