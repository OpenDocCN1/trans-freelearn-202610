  ![](img/d8322379620245fcd21eccc3855b8c78_74_0.png)


  ![](img/d8322379620245fcd21eccc3855b8c78_74_1.png)


  触控控制通过导电油漆和铜箔的组合嵌入表面。油漆创建触敏垫，而铜箔则与 Raspberry Pi 连接。


  你可能会错过的一个巧妙功能是内置无线充电器。弗雷德里克说：“这是一个我心中的‘小奖励功能’。”魔法灯放在正确位置时会亮起。“无线充电器嵌入在桌面中，当灯放在其上方时，灯就会通电。”该灯由无线充电接收器、微控制器板和一圈
  Adafruit NeoPixels 组成。


