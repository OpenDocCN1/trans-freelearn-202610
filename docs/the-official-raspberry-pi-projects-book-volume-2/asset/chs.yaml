  ## Quick Facts


  - Spy Rover 可运行约 40 分钟

  - 时速约 2mph，它不会打破任何速度记录

  - 建造大约花了三个月

  - 范围受 WiFi 连接限制

  - 通过端口转发，它可以通过互联网控制


  ## REMOTE CONTROL SPY ROVER


  想把旧玩具变成遥控间谍吗？Lucy Hattersley 与 Stratos Botsaris 谈论他的 Spy Rover 项目


  Java 工程师 Stratos Botsaris 黑客化了一个遥控玩具，并将其改造成更酷的 Pi 驱动间谍机器人。如果这还不够令人兴奋，他现在可以从他的 Android
  手机控制它，同时视频显示被投射到屏幕上。像这样的项目值得进一步研究，所以我们联系了 Stratos 询问关于 Spy Rover 的情况。“我不想只建造另一个移动机器人，”他说。“同时，我正在尝试
  Raspberry Pi 的视频录制功能。所以那就是我萌生建造一辆可以拍摄实时视频的漫游车的想法的时候。”“我想利用我的 Android 编程技能开发一个应用程序，可以向用户显示实时视频。”而不是从零开始建造机器人，Stratos
  拆解了一台 Big Bargain King Force Excavator。取下上半部分后，他安装了一台原版 Pi Model B，连接到面包板、WiFi dongle
  和 USB 网络摄像头。L293D 芯片控制电机。“L293D 是一款电机驱动集成电路，可以同时以任意方向控制两个电机，”Stratos 说。“如果我想让漫游车前进，我让两个电机顺时针转动，如果我想让漫游车倒退，我让两个电机逆时针转动。在漫游车需要右转的情况下，我停止右电机并让左电机顺时针转动，左转时逻辑相同。”


  ### Projects


  机械就位后，Stratos 将注意力转向控制器。使用带屏幕的控制器是有意义的，这样他就可以通过网络摄像头看到。最终，他决定为 Android 构建一个控制器应用，并直接从手机控制
  Spy Rover。


  “我业余时间开发了一些 Android 应用，所以为这个项目实现 Android 应用并不困难。”


  正如 Stratos 所发现的，流式传输视频比控制 Spy Rover 更具挑战性。“经过大量研究，我发现我必须在 Android 应用内部使用一些用 C++
  编写的库来完成我的任务。幸运的是，我找到了另一个已解决此问题的项目，所以通过使用部分源代码，我能够完成 Android 应用的实现。”


  > 我想出了切断 USB 电缆并将其电源线连接到 UBEC 电源线的想法


  除视频流传输外，项目最困难的部分是电源。“Raspberry Pi 需要恒定的 5V 电压和最高 3A 电流的电源。经过一些研究，我决定购买一个 UBEC（Universal
  Battery Eliminator Circuit），它可从 5.5V-20V 输入提供 5V，并能提供最高 3A 的电流。然后我买了一个装有六节 AA 电池的电池盒，为
  UBEC 提供足够的电压（9V）。


  “下一个挑战是我面临的是将 UBEC 连接到 Raspberry Pi。我必须找到一种方法将 UBEC 的电源输出线连接到 USB 连接器。幸运的是，我想出了切断
  USB 电缆并将其两根内部电源线连接到 UBEC 输出电源线的想法；这是我真正的顿悟时刻。”Stratos 希望下一个项目更快。“计划是将漫游车转移到带普通轮子的塑料玩具车上。”


  Above 使用面包板连接部件。这使得 Raspberry Pi 能够与 L293D 控制器和电机一起测试


