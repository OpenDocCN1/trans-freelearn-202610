  - 一个机器人被用来测试软件

  - 该系统可用于任何非动力轮椅


  来自德国杜伊斯堡的 Myrijam Stoetzer 和 Paul Foltin 制作了这辆奇妙的眼控轮椅。我们与 Myrijam 聊了聊它。“我们这么做是因为眼动追踪非常有趣，”Myrijam
  说，“然后我们想到也许可以操控某物。”“在寻找构建眼动追踪器的不同方法时，我们偶然发现了涂鸦艺术家 Tony Quan 的 Eyewriter 项目（eyewriter.org）。”


  Tony 患有 ALS（肌萎缩侧索硬化症）只能移动眼睛。“Tony 在朋友们用眼动追踪器帮助他重新绘画和作画之前被孤立了七年，”Myrijam 告诉我们。“我们想帮助像他这样的人重新行动，因为想象自己无法再移动是如此可怕。”


  安装在安全眼镜的框架上。“我们用一块模拟胶片替换了红外阻挡滤光片，该胶片几乎阻挡除红外光以外的所有光，”Myrijam 解释说，“[然后]我们用两个红外 SMD
  LED 替换了白光 LED。这样，眼睛将被红外光照亮，瞳孔会将其反射回来。”摄像头安装在定制的 3D 打印外壳内，并附着在安全眼镜框架上。


  ### Tracking eyes

  眼动追踪器是改装用于红外光的网络摄像头，并且




  ## 眼动追踪轮椅


  ![](img/d8322379620245fcd21eccc3855b8c78_30_0.png)


  ### STEP-01

  红外摄像机


  眼动追踪器由一台改装用于红外（IR）光的网络摄像头组成。IR 滤光片被移除，并使用薄膜阻挡除红外光以外的所有光线。红外 LED 取代了标准 LED。3D 打印外壳用于将设备安装在安全眼镜上。


  ![](img/d8322379620245fcd21eccc3855b8c78_30_1.png)


  ### STEP-02

  瞳孔检测


  Raspberry Pi 2 以每秒 10-12 帧的速度从红外摄像头拍摄用户眼睛的图像。对每张图像应用一系列滤镜，增加对比度，使瞳孔更容易识别。OpenCV
  软件用于映射瞳孔的坐标。


  ![](img/d8322379620245fcd21eccc3855b8c78_30_2.png)


  ### STEP-03

  电机控制


  轮椅由从挡风玻璃雨刷单元拆下的电机控制。这些电机通过定制的 3D 打印轮廓直接连接到轮椅上的车轮（该轮廓设计为与椅子的车轮相匹配）。


  ![](img/d8322379620245fcd21eccc3855b8c78_30_3.png)


  上图 一台挡风玻璃雨刷电机连接到一个小型 3D 打印车轮。该小型车轮驱动主轮椅车轮


  “摄像头拍摄眼睛，软件提取瞳孔的位置并检查它是否在对应四种运动的四个区域范围内，”Myrijam 说。

  在当前版本中，命令通过语音合成读给用户，并需要确认。然后根据方向打开电机。当轮椅移动时，红外测距仪检查路径中的障碍物。


  车轮由从废品场抢救来的挡风玻璃雨刷电机提供动力。“我们希望保持它可以让每个人都自行重建，”Myrijam 告诉我们。这些电机通过一个定制的 3D 打印车轮连接到轮椅车轮，该车轮轮廓设计为贴合轮胎。


  > 我们最大的成就是让追踪器找到瞳孔的坐标


  ### 由 Raspberry Pi 驱动


  Raspberry Pi 用于从网络摄像头捕获图像，而 OpenCV (opencv.org) 用于图像处理。“软件以每秒 10–12 fps 的速度从网络摄像头捕获图像，”Myrijam
  说。图像先转换为灰度，然后模糊并转换为黑白。“OpenCV 提供了一个很棒的滤镜，可以计算给定形状的重心，”她解释道。“我们使用此功能来获取已过滤出的瞳孔的坐标：这是最大的突破。”


  这是一个具有挑战性的项目：“编写代码非常困难，因为这是我们第一次离开乐高 Mindstorms，”Myrijam 说。“我们最大的成就是让追踪器找到瞳孔的坐标。在那之后，我们知道这是可能的。我学会了做
  3D 设计、3D 打印、Linux、Python 和图像处理。看到可以将计算机视觉集成到项目中并与物理计算相结合，真是太棒了。”


