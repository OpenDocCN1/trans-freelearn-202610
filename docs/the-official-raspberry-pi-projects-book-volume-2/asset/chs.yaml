  ## RASPBERRY PI HAUNTED HOUSE


  敢进来就进入这座带家居惊吓自动化的居所


  **STEWART WATKISS**

  数据中心经理，父亲，

  兼职德古拉伯爵

  magpi.cc/2dqEMrU


  ![](img/d8322379620245fcd21eccc3855b8c78_76_0.png)


  上方 真的不能是闹鬼的……对吧？


  已是深夜。夜色渐浓，你快要结束要糖果的旅程——但这是什么？路上出现一座你从未见过的房子。渴望更多糖果，你走向门口。一块闹鬼房屋的招牌迎接你，但你以为它只是装饰。靠近门口时，你按了门铃——结果玻璃破碎，灯光熄灭。门吱呀作响，你曾忽视的招牌闪烁，灯光重新亮起时你听见尖叫。受惊之下，你向右看，意识到怪物正在旁边的车库里开派对，庆祝又一个受害者在他们可怕的夜晚。


  “我一直在想万圣节能做点什么有趣的事，Raspberry Pi 是显而易见的选择，”这座噩梦般房屋的主人斯图尔特告诉我们。“我最近用遥控插座制作了家居自动化电路，并想到了用它自动开关灯。我还花了一些时间逛商店，看看能为项目添加哪些其他万圣节道具。”


  系统看似简单，但包含许多不同组件。专用门铃连接到 PiFace 板，该板直接与 Raspberry Pi 和一些 Python 代码交互。斯图尔特选择 PiFace
  而不是直接焊接到 Raspberry Pi 的 GPIO 引脚，以确保不会向 GPIO 端口发送任何不需要的信号——虽然经过适当的研究和在面包板上仔细布线，你也可以不使用
  PiFace 做到这一点。PiFace 直接控制南瓜灯和闹鬼房屋招牌上的 LED，而门廊灯和怪物派对灯则由他直接焊接进去的无线家居自动化遥控器控制。


  “它们并非设计用于这样使用，”斯图尔特提到。“焊点并不太可靠，虽然在万圣节期间能用，但最终会松脱。自从我制作这个项目后，Energenie 发布了用于其遥控插座的
  Pi-mote Raspberry Pi 板，比焊接到遥控按钮上更容易使用。”


  扬声器播放代码指定的适当音效和音乐，系统还做了防水处理，因为……好吧，斯图尔特住在英国。结果如何？


  “我刚好在万圣节前完成。我们有朋友来参加孩子们的万圣节派对，他们说喜欢它，而要糖果的孩子们也确实被它惊到了。有个小女孩被吓了一点，但大多数人觉得它有趣而不是可怕。”


