  ## RAFTBERRY


  用这艘 Raspberry Pi 驱动的筏子，时尚地与你的排球 BFF 一起逃离荒岛，或只是和朋友们在湖上悠闲航行


  ### 快速事实


  - raftBerry 已规划约两年

  - Yves 自大学以来就没编程了

  - raftBerry 配备了所有必需的航海安全设备

  - Yves 想添加疯狂的灯光和 ''look to steer'' 系统

  - 在军队中，Yves 使用了 22 台 Raspberry Pis


  野餐很有趣。你从橱柜后面拿出一个冷藏袋，里面装着一些从冰格里半被遗忘的冰块，并尽可能多地装入三明治、香肠卷和汽水罐。抓了一些家人或朋友后，你找到一个好地方在户外进食。很棒，除了蚂蚁不可避免的入侵，但仍然很棒。如果能把蚂蚁排除在外呢？你可以，如果你
  somehow 能在湖中央野餐。认识 Yves Daigle 和他的 raftBerry 项目……“这个想法是创建一个完全自主的电动浮动码头，由 Raspberry
  Pi 控制，带我们绕湖行驶，”Yves 告诉我们。正如 Yves 和一些朋友在浮动码头上享用餐点的照片所示，这个想法已经实现。作为在加拿大空军服役的航空航天工程师，Yves
  习惯于创建复杂的设备，所以这个副项目并不简单也就不足为奇了：“控制系统有两个可通过控制台上的开关选择的模式：手动或自主。码头使用两个静态电机进行推进，这些电机还可以通过差速推力来转向码头。”“Pi
  通过 GPIO 从街机摇杆、紧急关闭按钮和模式选择开关读取输入。每个电机都由五个汽车继电器独立控制，其中三个用于设定速度，其余两个用于 H 桥配置以设定电机的正向或反向。GPIO
  输出引脚控制一个小型八通道继电器板，进而控制这十个汽车继电器。整个系统，从电机到控制面板，都设计为每次出行后使用手推车从码头上拆下。”他开始认真工作后一个月就完成了整个项目，还包括
  DVD 播放器、桌子、座位和露营炉。更像是野餐，而更像是一个漂浮的营地。




