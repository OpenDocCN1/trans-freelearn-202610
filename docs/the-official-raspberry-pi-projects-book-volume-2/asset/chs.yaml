  ## 马特·里德


  马特·里德住在田纳西州纳什维尔，是 Redpepper 的创意技术人员。mcreed.com


  信标被附着在项圈上并戴在 Bean 的脖子上


  Bean 是一只与纳什维尔田纳西州的 Redpepper 营销机构一起生活的灰狗


  办公室周围放置了 Raspberry Pi 设备，并利用每个设备与 Bean 之间的距离来定位她


  ## SNIFFUR


  马特总能知道狗 Bean 在哪里，这要归功于他基于信标的 Sniffur 系统 – 文/Lucy Hattersley


  ### 快速事实


  - 信标的电池可使用长达一年

  - 每个信标都有一个唯一的 ID 编号

  - 信号强度用于检测 Bean 的距离

  - 它使用的是三边测量法，而不是三角测量法来检测 Bean

  - Sniffur 可在 50 米范围区域内检测到 Bean


  我们在这里 The MagPi 很爱动物，所以当我们听说有一款名为“Sniffur”的 Raspberry Pi 狗追踪器时，我们不得不进一步了解。Sniffur
  使用名为“信标”的跟踪技术；这些是相对较新的设备，被放置在百货商店中以跟踪顾客的精确位置。Sniffur 将这一想法颠倒过来，通过将信标放在移动物体上并使用三台
  Raspberry Pi 来检测其位置。所指的物体是 Bean，一只被 Redpepper 收养的可爱灰狗，Redpepper 是一家位于田纳西州纳什维尔的营销机构。


  “我们是一家以文化为先的公司，”项目制作者马特·里德说道。“我们很多人以某种形式养狗或养宠物，所以我们幸福的一部分就是知道我们的宠物幸福。我们的 CEO 也有两只狗，这也不无帮助。“Bean
  绝对是最甜的狗。非常害羞、胆怯、充满爱意。她会漫无目的地走进人们的办公室，就站在他们的办公桌旁等待抚摸，然后又漫无目的地走到下一个地方。”但所有狗都喜欢出去玩。“当[猎犬]这样做时，”马特告诉我们，“它们很难抓住，因为它们跑得太快了。”“它们是继猎豹之后陆地上第二快的动物：最高时速
  43 英里。灰狗也有很高的捕猎欲；如果它们看到一只松鼠，那就‘再见了’。”“随时知道她在哪里以及她是否靠近前门是 Sniffur 被建造的原因，”马特继续说道。“我们使用
  Estimotes（estimote.com）做过零售实验，并在实验室里不断储备信标用于实验。“我从实验室拿了一个 Estimote 信标并用扎带把它绑在 Bean
  的项圈上。通常，信标被附着在固定的物理位置，但 Bean 现在是一个移动信标，在她经过的每个地方都传输轮询信号。


  ## 构建 Sniffur 系统


  ![](img/d8322379620245fcd21eccc3855b8c78_64_0.png)


  Estimote 信标会传输一个稳定的 ping，可以被 Raspberry Pi 接收


  “我把一个蓝牙 USB 适配器插入三台 Raspberry Pi 并对它们进行编程，让它们监听 Bean 的唯一信标 ID，”马特透露。


  信标传输的一个值是 RSSI（接收信号强度指示）。这是信标与天线之间的距离。“我一直称之为三角测量，因为每个人都知道这是什么意思，”马特说，“但我最近在 Hackaday
  上了解到‘三边测量’才是正确的术语，因为我计算的是距离而不是几何。”


  马特为 iPad 构建了一个应用程序来显示 Bean 的位置。“它只是一个通过本地 WiFi 网络连接到三台 Raspberry Pi 的 HTML、JavaScript
  和 CSS 页面，”他解释道。


  “我认为这对任何想要熟悉信标的人来说都是一个有趣的项目。更便宜的版本是使用一台 Pi 从该天线生成一个单一的半径距离。


  ![](img/d8322379620245fcd21eccc3855b8c78_64_1.png)


  ### >STEP-01

  信标


  一个 Estimote 信标被附着在项圈上并戴在狗的脖子上。由单节电池供电，它可将她的位置泄露长达一年。


  ![](img/d8322379620245fcd21eccc3855b8c78_64_2.png)


  ### >STEP-02

  三台 Raspberry Pi


  三台 Raspberry Pi 被设置好，配备 WiFi 和蓝牙适配器作为天线。它们测量 Bean 到每台 Raspberry Pi 的距离，这用于确定她的位置。


  > ‘三边测量’是正确的术语，因为我计算的是距离而不是几何


  ![](img/d8322379620245fcd21eccc3855b8c78_64_3.png)


  ### >STEP-03

  追踪应用


  一个网页（包装成 iPad 应用）连接到本地 WiFi 网络并获取每台 Raspberry Pi 的数值。这些数值用于在地图上显示 Bean 的位置。


  你也可以在出口处设置一个天线，只要漫游信标进入范围就触发警报、闪灯或锁门。


  “嗯，”马特沉思道，“这其实不是一个坏主意。我认为 Sniffur 从可视化角度来看很有趣，但从实用角度来看，更主动的东西可能更好。”


