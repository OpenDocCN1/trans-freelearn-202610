  \ / $200\n\n## MAGZOR MECHATRONICS STARTER PACK\n一个模块化机器人，可以按你的规格构建，甚至无需编写任何代码。它是否太好了而不真实？\n\
  \n在 Raspberry Pi 机器人套件向各个方向分支的时代——无论是简单、易用且便宜，还是更高级——看到一个试图弥合初学者到中级水平的尝试是件好事。Magzor\
  \ 系统从一套可以以任何组合相互作用的零件套件开始，并连接到 Raspberry Pi 以创建你自己的机器人或机电项目。该套件的工作方式是让你在网页界面上输入你想要使用的东西，有点像拼图块。界面随后会创建零件应如何组合的自定义配方，甚至提供一些基本代码来让它们全部运行。它相当直观，虽然我们收到的入门套件中没有其中一个更通用的零件。这意味着我们必须弄清楚它在给我们一个可以用现有设备构建的东西之前还需要哪些其他信息。说明本身不错，但我们有时会感到有点困惑；有一点我们正在寻找一个端口，但\
  \ PCB 上并没有按说明描述的方式明确标记。等到我们完成初步构建后，我们基本上弄明白了说明试图使用的语言。与 Raspberry Pi 为中心设备的运作方式大相径庭的是，该套件在\
  \ C++ 中编程。会生成一个基本脚本来激活所有内容，你可以自行修改以达到确切规格。从构建阶段到编程阶段的技能水平跃升很奇怪，要求你手动编译代码，而不是能够实时运行并在进行中进行更改。虽然这种编程水平是值得学习的好东西，但它似乎与这种可以快速迭代和重建的机器人特性略有矛盾。以目前的教程方式，没有创建代码并将其移动到\
  \ Pi 上然后编译和运行的简单逐步指南；需要比一些机器人初学者所拥有的更多直觉和知识。随着对系统这一方面的更多关注，它会好得多，但现在它可能超出了初学者范围。\n\
  \n### 厂商说\n> > Great for experienced users and novices alike\n> \n> Magzor\n\n###\
  \ 相关\n### CAMJAM EDUKIT #3\nAlso reviewed in this issue, the CamJam kit allows you\
  \ to build a robot and then fairly simply program it to perform various tasks. Much\
  \ simpler and aimed towards a very beginner level of robotics, though.\n\n![](img/d8322379620245fcd21eccc3855b8c78_183_1.png)\n\
  \n£17/$26\n\n### 最后的话\n这里有一些很棒的想法，但构建和编程的一些部分有点晦涩。它对于做比简单机器人更高级的机电一体化的人来说相当不错。\n\
  \n\n\n\n## 制作者说\n\n> 创建\n> 你自己的\n> Raspberry\n> Pi驱动的\n> 机器人\n> \n> CamJam\n\n![](img/d8322379620245fcd21eccc3855b8c78_184_0.png)\n\
  \n## CAMJAM 教育套件 #3\n\n### 机器人技术\n\n一款低成本的机器人套件，可以教你如何组装一台 Raspberry Pi 机器人，以及如何对其进行编程\n\
  \n如果你回想起几期前的文章，你可能记得我们曾做过一篇封面专题，介绍如何制作一台价值 50 英镑的 Pi 驱动机器人。该机器人的唯一真正问题是，你需要从许多不同的地方购买大量不同的组件来保持价格低廉。我们当时并没有足够的时间为人们组装一套可购买的套件；不过现在看来这可能没那么重要了，因为最新的\
  \ CamJam EduKit 与我们本会制作的套件非常接近。\n\n一个装满非常标准的机器人组件——以及一块定制板——构成了第三款 CamJam 套件。虽然它确实包含这些标准组件，但它不像乐高或宜家套件那样，有些机器人套件就很像那样。由于它们是无底盘的组件（尽管随附的盒子在紧急情况下也能凑合使用），CamJam\
  \ EduKit #3 的设计旨在让你在创作上拥有更多自由，并真正让你思考自己正在构建的内容。\n\n套件还附带了一个面包板。单独看你可能只会认为它只是另一个面包板，减少了你需要焊接的工作，但它也提供了许多扩展超出原始机器人限制的方法，可添加额外的传感器、组件等等。这使其非常适合在原始机器人范围之外的课外学习。\n\
  \n机器人的在线工作表非常全面，教你如何组装和编写代码。由于 EduKit #3 的发布在一定程度上与 Pi Wars 挂钩，其中还提供了如何为该活动中涉及的一些挑战风格进行编程的提示。的确，我们在\
  \ Pi Wars 上看到了几台由该套件驱动的机器人正在行驶，其中一台在其他机器人失败的循线赛道上表现非常出色。\n\n那么这是一款很棒的入门套件，或者至少是适合那些想要比一些非常简单的套件更进一步的人的套件。它让你更深入地了解\
  \ Raspberry Pi 如何实际控制机器人，并为你提供成长的空间。\n\n## 相关\n\n### PI2GO\n\n价格稍高一些。然而，这也是一款很棒的小型入门套件，可以教你了解\
  \ Pi 的机器人技术。\n\n![](img/d8322379620245fcd21eccc3855b8c78_184_1.png)\n\n£55 / $83\n\
  magpi.cc/1SWFHXi\n\n## 最后的话\n\n对于希望更动手制作自己创建的机器人的初学者来说，这是一款很棒的套件。也有大量出色的文档可供他们顺利入门。\n\
  \n![](img/d8322379620245fcd21eccc3855b8c78_185_0.png)\n\n## 制作者说\n\n> > 为 Pi 制作你能想到的尽可能多的\
  \ Ubuntu 版本\n> > Ubuntu Pi Flavour Makers\n\n## UBUNTU PI FLAVOUR MAKER\n\n为你的 Raspberry\
  \ Pi 提供更多 Ubuntu 版本。Pi 是否有足够的动力来运行它们呢？\n\n## 相关\n\n### UBUNTU MATE\n\n当 Raspberry\
  \ Pi 2 发布时，Ubuntu 终于能够来到 Pi 上，首先是 Ubuntu MATE 的一个版本。\n\n如果你一直关注 Raspberry Pi 的发展，你可能知道在其早期曾呼吁将\
  \ Ubuntu 用作其操作系统。作为家用用户中最受欢迎、如果不是最受欢迎的 Linux 版本之一，许多寻求为他们的新迷你电脑提供熟悉体验的人都希望使用这个发行版。它从未实现。然而，由于\
  \ Ubuntu 基于 Debian，Raspbian 基本上是最好的替代品。当 Raspberry Pi 2 发布时，情况发生了变化，随之发布了适用于 Pi\
  \ 的 Ubuntu MATE，这为更多“版本”的 Ubuntu 打开了大门——或者至少是运行在 Ubuntu 上的不同桌面环境。Ubuntu Pi Flavour\
  \ Maker 就是这一结果之一。其核心，Flavour Maker 是一系列脚本，允许你为 Raspberry Pi 构建一个略微定制的 Ubuntu 版本。它使用对\
  \ Pi 2 上的芯片类型进行优化的至关重要的 armhf 版本的 Ubuntu，为你提供不同的软件和桌面的选项，甚至可以根据需要选择服务器和桌面版本。这对一些更初级的用户来说可能听起来有点复杂，但不用担心——制作该软件的善良人士创建了一系列可安装到\
  \ SD 卡的镜像，就像任何 Raspberry Pi 操作系统一样。可供选择的有两个版本的 Ubuntu Server：一个是为最大速度而设计的极简安装，另一个是如果你需要更多软件的常规安装。还有三个使用不同桌面的“spins”：LXDE、Xfce\
  \ 和 MATE。LXDE 和 Xfce 是在低功耗 PC 上使用的常见轻量级桌面界面；Raspbian 自发布以来一直使用 LXDE，或者至少是其一个版本。\n\
  \n### 启动\n\n那么它们实际运行情况如何？与普通 Ubuntu 类似，首次启动时有几个设置步骤，尽管主要安装已经完成，所以步骤有所简化。诸如区域设置和键盘之类的设置会在启动到桌面之前完成，尽管这需要几分钟时间。每次后续启动要快得多，但仍然远不及启动到\
  \ Raspbian 的速度。与 Raspbian 相比，操作系统呈现方式非常不同。Raspbian 的大部分内容都针对 Raspberry Pi 进行了优化，其中还包含大量教育工具，而\
  \ Ubuntu spins 更像是一个传统的桌面——默认未安装编程工具，也使用常规程序。\n\n![](img/d8322379620245fcd21eccc3855b8c78_186_0.png)\n\
  \n上图 图形化包管理器的选择使安装变得更加容易\n\n与 Raspbian 相比，图形化包管理器的加入是一项新颖之处。Software Centres 和经典的\
  \ Synaptic 都可用，为用户提供搜索他们可能想要的软件的方式，而 Raspbian 目前并不容易做到这一点。由于它基于 Ubuntu armhf，选择范围不如完整版\
  \ Ubuntu 广泛，但仍然非常好。大量主要软件可用，唯一的真正限制是运行 Ubuntu 的 Raspberry Pi 2 的性能和功率。\n\n由于使用了更标准的软件，Ubuntu\
  \ 在 Raspberry Pi 2 上可能会有点滞后。Firefox 是默认浏览器，虽然有像 Midori 这样的轻量级替代品可用，但它并不总是快速且响应灵敏。\n\
  \n它感觉就像原始 Raspberry Pi 上的浏览器那样——功能齐全，但使用一段时间后会有一点令人沮丧。如果你想观看大于 360p 的内容，YouTube\
  \ 上的视频似乎也不可行。\n\n不过并非全部都很慢。选择合适的软件包和合适的用例，它完全可以正常使用。Ubuntu 本身就是比 Debian 更耗资源的基底，所以对于需要额外性能的任何事物，它永远不会是首选的操作系统或发行版。\n\
  \n三者中，Xfce 版本运行最好，但就性能而言，Raspbian 仍然更好。\n\n作为桌面系统，它更好一些。通过对默认应用程序进行少量修改，它完全可用，而且看起来比\
  \ Raspbian 更像样一些。然而，对于项目和更小众的使用，Raspbian 看起来仍然是王者。\n\n![](img/d8322379620245fcd21eccc3855b8c78_186_1.png)\n\
  \n上图 YouTube 的表现时好时坏，尤其是在像 Firefox 这样更耗资源的浏览器上\n\n## 最后的话\n\n它永远不会像 Raspbian 那样快，但这是一项令人惊叹的努力，为\
  \ Raspberry Pi 可用的操作系统增添了更多多样性。\n\n![](img/d8322379620245fcd21eccc3855b8c78_187_0.png)\n\
  \n## 制作者说\n\n> 触摸屏让你实现指尖控制\n> SB Components\n\n## LCD 控制外壳\n\n一个用于迷你 LCD Raspberry\
  \ Pi 屏幕的简单外壳——在正常使用下表现如何？\n\n上一期我们评测了 SB Components 的 SPI-Box，这是一款专为 Raspberry Pi\
  \ 2（和 B+）定制的机箱，允许运动传感器和 Pi Camera Module 从机箱中伸出。借助捆绑的软件，这意味着你拥有一个功能齐全且廉价的安全摄像头，配备大量软件功能使其真正实用。采用类似的设计理念，SB\
  \ Components 还创建了一个特殊机箱，用于在适当的封装中将 3.2 英寸 LCD 触摸屏与 Pi 一起使用。它也很便宜。\n\n该机箱由三部分组成：一个几乎与\
  \ SPI-Box 设计相同的底座，以及一个用于保护 Pi 组件免受屏幕影响的中间层，最后是一个紧密贴合 Pi 和屏幕的顶部部件。与 SPI-Box 一样，底座将\
  \ Pi 牢牢固定到位；可能有点太牢了，因为再次取下它可能会有点麻烦。\n\n将 LCD 屏幕放在中间层上然后用顶部封闭非常容易——许多 Pi 迷你 TFT 屏幕仅使用前\
  \ 26 个 GPIO 引脚，这是源自原始 Raspberry Pi 设计的遗留。中间层仅打开这些引脚，因此不会产生混淆。然后整个屏幕可通过机箱访问，甚至通常的微型开关阵列（如\
  \ Adafruit 屏幕上的）也可通过小针孔访问。想象一下旧电子设备上的复位开关——只是尽量避免使用尖锐的东西。\n\n仅使用该机箱，你就为使用触摸 LCD\
  \ 屏幕的 Raspberry Pi 增加了一个极佳的配件。它坚固、非常易于组装，微型开关的访问也很整洁——通常这类开关在这些机箱中会被忽略。至关重要的是，它还有足够的空间来使用整个屏幕。此外，它还具有类似\
  \ SPI-Box 的墙壁固定支架。由于它技术上只需要电源，也许还需要一个无线适配器，它可以成为一个很棒的便携式 Pi 或墙上的廉价家庭自动化控制器——唯一真正阻碍这一点的是整个单元的深度，尽管这不是机箱的错。\n\
  \n如果你喜欢屏幕和机箱的想法，但对购买屏幕、组装它，然后让整个设置在你的 Raspberry Pi 上工作感到犹豫，那么 SB Components 还提供了一个捆绑套件（magpi.cc/2drz490）。在\
  \ Raspberry Pi 之上仅需 29.99 英镑（43 美元），你基本上就能获得一套创建便携式 Pi 的套件，总价略高于 50 英镑。\n\n## 相关\n\
  \n### PI BOW PITFT+\n\n更新的 PITFT PiBow 允许在 Pi Model 2 和 B+ 上使用 Adafruit 的 PITFT\
  \ 屏幕的稍大第二版本。\n\n![](img/d8322379620245fcd21eccc3855b8c78_187_1.png)\n\n£13.50 /\
  \ $19.95\nmagpi.cc/10Ai31M\n\n![](img/d8322379620245fcd21eccc3855b8c78_188_0.png)\n\
  \n套件附带一个兼容的迷你触摸屏，可与 Pi 和外壳配合使用，还有电源、WiFi 适配器以及预先准备好的 SD 卡。由于是完全相同的外壳，这种尺寸触摸屏的构造也相同，但并非完全无法使用。至少，它为你自行创建自定义界面留下了空间，并且还可以访问\
  \ SPI-Box，这是一个不错的小补充。\n\n> 套件附带一个兼容的迷你触摸屏，可与 Pi 配合使用\n\n相同；然而，真正的亮点是 SD 卡。\n\n过去，将\
  \ Raspbian 配置为与这些触摸屏配合使用并非快速过程。现在由于图像更易获取，稍微容易了一些。即便如此，拥有一个开箱即用的版本也很不错。它仍然运行现代版\
  \ Raspbian，其中包含一年多前发布的界面更新。使用起来有点棘手\n\n这两种 LCD 外壳都物有所值，尤其是它们填补了使用或想要使用这种类型屏幕的人群的略显小众的市场。微动开关孔也很容易进行修改，使其更易于使用，因此只要具备正确的知识就能改进它。无论你想要便携式\
  \ Pi 的雏形还是触摸屏遥控器，这款产品都不会让你失望。\n\n![](img/d8322379620245fcd21eccc3855b8c78_188_1.png)\n\
  \n上图 在屏幕关闭的情况下 Pi 的大部分仍可访问，尽管它主要集中在 GPIO 的前 26 个引脚上\n\n## 最后的话\n\n一个坚固且外观精美的盒子，与其他用于小型触摸屏显示器的产品一样出色，为其他项目和用途打开了无限可能的大门。\n\
  \n## 树莓派畅销书 TAB ELECTRONICS\n\nMcGraw Hill 的小众创客分支推出了几本深受爱好者欢迎的书籍...\n\n### 编程树莓派\n\
  \n作者: Simon Monk\n出版社: Tab Electronics\n价格: £9.99\nISBN: 978-0071807838\nmagpi.cc/2dXcZIC\n\
  \n![](img/d8322379620245fcd21eccc3855b8c78_189_0.png)\n\n一本出色的 Python 入门书，充分发挥了\
  \ Pi 的优势。现在就买一本（但请阅读在线勘误表），然后在十一月购买更新版时转赠给朋友。\n\n### 发明者的实用电子学\n\n作者: Paul Scherz\
  \ & Simon Monk\n出版社: Tab Electronics\n价格: £24.99\nISBN: 978-0071771337\nmagpi.cc/2dXbXgo\n\
  \n![](img/d8322379620245fcd21eccc3855b8c78_189_1.png)\n\n如何使用和理解电子元件，包含关于传感器、微控制器、模块化电子和最新软件工具的更新章节。仅理论章节就物有所值。\n\
  \n### 邪恶天才的树莓派项目\n\n作者: Donald Norris\n出版社: Tab Electronics\n价格: £15.99\nISBN: 978-0071821582\n\
  bit.ly/1GBAHJx\n\n![](img/d8322379620245fcd21eccc3855b8c78_189_2.png)\n\n风格独特的初学者入门指南，介绍如何使用\
  \ Pi 构建硬件项目（基于旧的 B 型号，但大多数项目在当前型号上只需少量修改），从蓝牙控制机器人到气象站。\n\n### 教你的孩子编程\n\n作者: Bryson\
  \ Payne\n出版社: No Starch\n价格: £19.99\nISBN: 978-1593276140\nnostarch.com/teachkids\n\
  \n![](img/d8322379620245fcd21eccc3855b8c78_189_3.png)\n\nDr Payne 承诺“编程如此简单，父母也能做到！”从海龟图形开始，读者被吸引进来，Python\
  \ 显得自然、简单，却仍令人惊叹。学习者被鼓励进行实验，而不是被如何和为什么的细节所淹没——但在需要细节的地方，例如数字类型和运算符，它们会被介绍。随着概念的引入，我们将其融入海龟图形——因此条件语句导致分形螺旋，用户输入选择绘制的形状。每章末尾的编程挑战——将\
  \ High Card 游戏改成 War，或为 Pong 游戏添加音效——引导进一步学习。面向九岁及以上儿童，这里有足够的内容适合每个人——父母可以带年幼的孩子完成一些项目，青少年也不会觉得被轻视。Payne\
  \ 在提供大量有趣的项目以保持兴趣和引入编程概念以几乎通过渗透建立真正的理解之间取得了平衡。Python 和 Pygame 的安装被 banished 到附录中，你在那里也会找到创建自己的模块的说明！而且再次，Miran\
  \ Lipovača 精美的插图将一本已经很优秀的 No Starch 书籍提升到了另一个水平。强烈推荐给所有年龄段的学习者。\n\n评分 ★★★★★\n\n\
  ### JavaScript 机器人学\n\n作者: Edited by Rick Waldron\n出版社: Maker Media\n价格: £19.99\n\
  ISBN: 978-1457186950\noreil.ly/1Gv23Rv\n\n![](img/d8322379620245fcd21eccc3855b8c78_189_4.png)\n\
  \n树莓派是一个很棒的小板，但它并不怎么移动——除非你把它装进机器人。当然。Johnny-Five 机器人库提供了用 JavaScript 在各种平台上轻松编程机器人的机会——在这本书中，“会漫游、游泳、打字、行走、跳舞、发送警报、制作音乐”的机器人等等。在项目中，只有\
  \ PiDuino5 移动机器人平台需要树莓派（结合了 Arduino 广泛的外设范围和 Pi 的高性能软件）——由 Jonathan Beri 制作的出色项目，其中包含硬件新手的有用提示，例如在不将机器人连接到网络的情况下连接到\
  \ Pi，以及提供可构建到项目中的挑战，例如计算机视觉。其他章节都采用不同的板卡，成本也大不相同。有些有现成的零件可用，有些则涉及大量 DIY——特别是关于 Delta\
  \ Bots 的章节，这种工业机器人制造了你的汽车（除非你开的是 Morgan）。这一章还提供了大量灵活性，可插入另一个 Pi 并扩展接口。所有项目都配有清晰的彩色图片以帮助构建。充满乐趣，充满学习，是实用机器人学的绝佳入门。\n\
  \n评分 ★★★★☆\n\n## 使用 Spark 进行机器学习\n\n**作者:** Nick Pentreath\n**出版社:** Packt\n**价格:**\
