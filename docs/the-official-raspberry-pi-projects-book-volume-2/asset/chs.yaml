  使用 PowerBoost 500 为项目供电非常简单方便，但我们强烈建议你参考 Adafruit 在 magpi.cc/1PmIDWL 的优秀指南。你将了解其所有功能和能力，并学习如何正确焊接板子。如图所示，我们需要焊接三个高亮的引脚才能使电源开关正常工作。完成后并连接电池，你会发现当你将开关从靠近地线引脚（棕色）拨到电源引脚（红色）时，设备会开关机。你还会发现
  PowerBoost 板上有一个方便的 micro USB 端口——将其靠在控制器外侧边缘，对塑料雕刻出端口，你就能在玩游戏时为电池充电。


  ![](img/d8322379620245fcd21eccc3855b8c78_151_0.png)


