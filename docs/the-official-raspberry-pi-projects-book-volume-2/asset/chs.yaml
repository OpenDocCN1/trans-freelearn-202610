  \ LED 或其他怕热元件冒烟，那么你就体验过另一面：烙铁提供了过多的热量。\n\n### 温度控制\n\n温控烙铁解决了所有这些问题。你可以为所使用的焊锡设定合适的温度，并且它会被板载控制器跟踪和调整。如果大焊点过快地带走烙铁头热量，输出会增加；如果烙铁头过热，输出会降低。目标是达到一度温度稳定性。这是一项强大的功能，相比更便宜的不会自动调节输出的可变温度烙铁，这是一个明显的提升。作为入门级产品，你会期望在\
