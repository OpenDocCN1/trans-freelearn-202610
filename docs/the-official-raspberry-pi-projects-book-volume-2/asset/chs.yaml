  magpi.cc/2dXeikt\n\n![](img/d8322379620245fcd21eccc3855b8c78_193_5.png)\n\n在网站上以女性身份登录和以男性身份登录之间的差异必须亲身体验才能相信：作者建议在社交媒体网站上注册一个一次性账号来试试。女性在网上是目标，隐私面临来自善意朋友、贪婪公司以及我们都需要采取措施保护自己的人的威胁。该书附带隐私贴纸，以防止他人在你不知情的情况下使用你的设备摄像头录制你。八条“现在就可以使用的隐私提示”提供了将天平大幅倾向你的现成指南，进行隐私检查也是如此。完成之后，Blue\
  \ 展示了为了保持安全不应分享哪些信息。如果你认为这是偏执，请阅读关于（男性）《连线》杂志记者 Mat Honan 的报道，他的数字设备被抹除，Twitter\
  \ 账号被恶意篡改——这一切都源于攻击者查找到 Honan 的地址（简单的 whois 查询）并用它获取 Amazon 账户数据，然后转向 Apple。\n\n\
  Blue 提供了应对所有恐怖和骚扰、从身份盗窃中恢复，同时仍能在网上追求浪漫的实用步骤。可悲的是，这是一本非常必要的书。\n\n![](img/d8322379620245fcd21eccc3855b8c78_193_6.png)\n\
  \n## 软件的工作原理\n作者: V Anton Spraul\n出版社: No Starch\n价格: £19.99\nISBN: 978-1593276669\n\
  magpi.cc/2dXeMH6\n\n“我们生活在一个魔法的时代，”V Anton Spraul 在引言中写道，引用了 Arthur C Clarke 关于先进技术的著名格言。毕竟，我们中的许多人使用技术，却缺乏对计算机内部实际发生的事情的真正理解。从密码哈希和加密等安全主题，到现代生活的其他基础如搜索和地图路线，本书展示了程序内部发生的事情、其局限性以及未来可能的发展。\n\
  加密是许多日常任务的核心，从购物到查看银行余额。Spraul 将我们带回计算机前的加密时代，并以清晰的解释帮助即使是非技术用户也能理解这一过程。特别重要的是 Spraul\
  \ 对每种技术潜在缺陷和弱点的讨论，这将帮助读者对各种安全恐慌的新闻报道做出恰当的判断。\n\n![](img/d8322379620245fcd21eccc3855b8c78_194_0.png)\n\
  \n对游戏图形、计算机动画和图像压缩的见解令人着迷。关于搜索中使用的技术——从快速排序算法到哈希——以及并发编程中的技术解释，将帮助树莓派上的初学者程序员在理解上取得进展，从而真正支持他们正在学习的方法。地图路线是另一章信息丰富的章节，特别是如果你正在从事机器人项目。\n\
