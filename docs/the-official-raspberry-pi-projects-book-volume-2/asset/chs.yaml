  \n学习计算机视觉最好采用实践方法：使用 BSD 许可的 OpenCV 库，可在 C/C++、Java 和 Python 中进行图像和视频处理。Pajankar\
  \ 在特定的 Pi/Python 环境中介绍 OpenCV，但假设没有之前的树莓派知识——幸运的是，他的树莓派介绍简洁得令人钦佩。然而，OpenCV 安装部分却奇怪地缺乏精炼。\n\
  \n假设具备 Python 知识，但仅限基础：NumPy 很早就被介绍，用于使用 OpenCV 所需的数学函数。关于图像和网络摄像头的实用示例，使用 Pi 摄像头模块，能帮助数学基础较弱的读者理解。去噪和边缘检测——对你自己的\
