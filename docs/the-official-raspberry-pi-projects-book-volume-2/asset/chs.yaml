  ## 到目前为止最好的树莓派 Zero 项目


  人们几乎立刻就开始使用全新的 Pi Zero 来驱动更小巧、更酷的项目


  好吧，树莓派 Zero 的发布令人兴奋，不是吗？我们卖光了所有库存，不得不加印第二批，这意味着已经有大量树莓派 Zero 流向用户开始用于项目。几天之内，人们就完成了一些令人难以置信的事情：新黑客、更新的黑客、概念验证……各种优秀作品层出不穷。你可以花上好几个小时翻阅
  #pizero 标签来查看它们全部，但在撰写本杂志时，我们找到了其中一些最好的作品。


  请通过 Twitter @THEMAGPI1 发送你的项目


  ### Xbox 控制器 Pi Zero


  通过将 Doom 内置到控制器中，为 Xbox Media Centre 赋予新意义


  第一代 Xbox 的原装控制器有很多俗称。Duke。熊。火灾隐患。它的尺寸被归因于“适合大美国手”的都市传说；正因其尺寸，它却非常适合 Terence Eden
  的项目。


  “我想要在电视上玩复古游戏，”Terence 告诉我们。“但我不想再买一台放在下面。 我也不想折腾太复杂的东西——我当时想，如果能把整台游戏机塞进控制器里该多好？


  与我们的项目构想类似（最终在这本书中形成了一份完整的教程），Terence


  > 我想要在电视上玩复古游戏


  最初考虑使用标志性的 NES 控制器。然而，他的妻子指出更大的 Xbox 控制器非常适合他的计划。


  “所以，这个项目就是把 Pi 塞进控制器里，用它来玩 Doom！”


  显然即使是树莓派 Zero 也很紧凑，意味着控制器外壳内部的一些部分必须被削掉才能塞进去。“所有端口都在同一侧，这太棒了；这样在狭小空间里安装更容易，”Terence
  补充道。


  组件清单并不花哨：只是让 Zero 工作的标准电缆以及所需的各种工具。


  像其他人一样，Terence 也受到了启发，并思考还能如何利用 Zero。“我很好奇是否可以用它作为门窗传感器。Pi Zero 比 Z-Wave 传感器便宜，所以只要我能为它供电，我就可以把它放在家里的每一扇门和窗上。”


  TERENCE EDEN

  Web developer

  shkspr.mobi


  ![](img/d8322379620245fcd21eccc3855b8c78_84_0.png)


  把 Pi Zero 装进控制器里，你甚至不需要主机


  ![](img/d8322379620245fcd21eccc3855b8c78_84_1.png)


  USB OTG 是对现有 micro-USB 规范的简单扩展。连接器非常便宜：网上不到 1 英镑。话虽如此，如果你对布线和焊接有信心，自己制作也很简单。Terence
  直接把旧的连接器接到控制器线上


  RetroPie 是模拟器爱好者的绝佳资源，Terence 说。他记得当年为了让 MAME 运行而到处折腾的日子，但这是一个包含所有内容的单张磁盘镜像。神奇的是，它甚至通过
  xpad 为 Xbox 控制器提供了内核支持——Terence 以为自己肯定得自己动手搞定！


  LAURA TREVAIL

  Artist and tech explorer

  twitter.com/lhtrevail


  ### 能源监控


  物联网借助能源消耗监控来到 Zero 身上


  > “该项目使用 Pi Zero 作为一个小小的中心，将我家里的电子设备连接到几乎任何东西，”Laura Trevail 谈到 Pi Zero 能源监控时说。“它测量设备的能源消耗并实时发布该数据，其他地方的设备可以找到并与其交互……当我在泡
  [饮料] 时，我可以把我的电水壶变成完全不同的地方的某样东西，如果我愿意的话，有人可以在我喝茶时加入我，如果他们愿意的话，或者使用我推断出的咖啡消费数据（或我分享的任何其他内容）以我从未想象过的方式驱动他们自己的故事。”


  所以，这是一个从简单概念出发却用途无穷的典型物联网设备！据说，Laura 和 Danielle 花了一上午在两个郡里寻找一本《The MagPi》，当她们终于拿到手时，对
  Pi Zero 的小巧感到惊讶。


  该项目使用了 Energenie，具体来说是 Energenie 双向 PiMote 和 Energenie MiHome 监控器，使用了 David Whale
  的 pyenergenie 库（magpi.cc/1jKpQ8L）。


  DANIELLE GRAYSTON

  Software developer

  twitter.com/Bladepanthera


