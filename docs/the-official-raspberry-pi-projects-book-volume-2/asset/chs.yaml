  ## 由 Pi 驱动的 CNC 机器


  如何将对精美木工的热情与对电子产品的兴趣结合起来？Mark Buttle 用一台由 Pi 驱动的 CNC 机器做到了...


  英格兰最寒冷潮湿的地区之一 Rural Shropshire 居住着许多创客和不懈的捣鼓者，有充足的时间待在创客棚里，让灵感酝酿成长。事实上，该郡有着创客和思想家的历史，是查尔斯·达尔文的出生地，也是
  Ironbridge 工业摇篮的所在地。Mark Buttle 是一位热爱木工的工程师。他的家中摆满了精心手工制作的家具，以及像伪装成传统红色电话亭的冰箱冷柜之类的古怪物品（当然，也有计划制作一个熟悉的蓝色警察电话亭）。但
  Mark 白天是软件工程师，也对电子产品感兴趣，因此很乐意将技术与传统工艺技能结合起来。Mark 最初为同事买了 Arduino 作为生日礼物，受其可能性吸引后也为自己买了一块。同事提出挑战，看谁能想出更有趣的项目，Mark
  开始研究为木工建造计算机数控（CNC）机器。不久就显而易见，Arduino 虽然理想用于控制步进电机，但需要额外帮助，而 Mark 显然没有时间自己编写所有软件。网上研究发现了
  Grbl——运行在 Arduino 上的开源控制器代码——以及为 Raspberry Pi 编写的 Zapmaker 控制器软件。“我已经想要一台 Pi 很久了，”Mark
  告诉我们。“这是我用它做的第一件事。它将我对电子产品和木工的热情结合在一起。”


  ## RASPBERRY PI CNC 实际操作


  ![](img/d8322379620245fcd21eccc3855b8c78_48_0.png)


  控制器箱内的 LCD 屏幕向 Mark 显示机器的当前位置，以及切割的整体进度


  一台 Pi 2 运行开源 Zapmaker 软件向控制器板发送 G-code


  Arduino 控制器运行 Grbl 软件通过电机驱动器将 G-code 转换为对三个步进电机的指令


  ### 构建

  “我用海洋胶合板手工制作了完整的 CNC，并安装了一台 DeWalt 雕刻机进行切割，”Mark 透露，“使用 Raspberry Pi 2 作为控制器，运行名为
  CNC Zapmaker 的软件，将 G-code 指令传递给 Arduino Uno。这运行一个版本的 Grbl 控制器，其上连接了 CNC 盾牌，驱动三个
  X Y Z 步进电机。”“这只是个概述，”Mark 承认。“控制器和机器花了大约两个月建造：主要是晚上。”在这段时间里，Mark 还必须建造切割机的物理装置——一个长
  1000mm、宽 500mm、高 700mm 的框架，带有夹紧木材的轨道、用于在每个轴上驱动步进电机的梯形条，以及大量线缆。


  在当前设置下，电机每转 200 步，可实现运动的精确控制。一转移动切割工具 2mm，因此一步仅为 10 微米！——以一 thou（英寸的千分之一）为工程精密公差的传统度量，约等于
  25 微米，这对于木工来说极其精确。理论上重新齿轮步进电机可以再次提高精度，但如此精细的细节会被木材纹理的大小所掩盖。步进电机——中国产每个约 £12——具有
  107oz 的保持扭矩；加上 Mark 使用梯形杆和重型固定杆，而非预算 CNC 自建常用的丝杠和抽屉导轨，我们拥有了一台结构坚固、经久耐用的机器。然而，包括所有电子元件和其他硬件，建造价格约为
  £400。十年前，你会找到类似


  ![](img/d8322379620245fcd21eccc3855b8c78_48_1.png)


  ### >STEP-01

  ### 在绘图板前

  第一步是在你选择的 CAD 软件中完成设计，然后让它生成所需的 G-code。FreeCAD 用户需要 CAM 插件或 HeeksCNC。


  ![](img/d8322379620245fcd21eccc3855b8c78_48_2.png)


  ### >STEP-02

  ### Grbl

  Mark 使用 AutoCAD，这使他能够选择使用的刀具，以及规划切割路径。最近开源的 Blender CAM 是此项的一个可能替代方案。


  ![](img/d8322379620245fcd21eccc3855b8c78_48_3.png)


  ### >STEP-03

  ### MagPi 邂逅木材

  Pi 创建 Arduino 使用的 Grbl 代码，Arduino 处理将路由器放置在正确位置，将我们的 3D 设计变成雕刻或雕刻的木件。




  ![](img/d8322379620245fcd21eccc3855b8c78_49_0.png)


  框架将所有部件连接在一起


  商业机器价格高达五位数——这对创客来说是伟大的时代。事实上，一些过时的商业 CNC 机器正被那些没有时间遵循 Mark 完全 DIY 路线的制造者改装，自制控制器。


  ## 控制


  在控制器中，触摸屏与运行 Zapmaker 软件的 Pi 2 上的 CNC 控制器接口：屏幕上，控制软件灰色、令人愉悦的工业风格面板与用作外壳的电气箱相得益彰。Pi
  通过 Arduino Uno 板通信，该板使用 Grbl 控制步进电机。Arduino 上的 Grbl 处理相当复杂——你可以发送一条单行命令，例如“在这里画一个此直径的圆”，它会为你计算切割路径。


  电源是来自某些 LED 灯的重型 24V 单元。12V 和 5V 降压变压器为 LCD 屏幕、树莓派、步进电机、Arduino 和扩展板供电。控制电机的扩展板会变得非常热，因此使用一个小型风扇对其进行冷却。


  火眼金睛的读者会注意到 Arduino 与控制器扩展板之间的额外板——这是在早期原型不断关机的情况下安装的缓冲板。“有人说你需要在 Arduino 和 CNC
  控制器板之间加一个滤波器，”Mark 说。滤波板阻止电流从电机泄漏到限位开关的继电器并关闭设备。这解决了问题：“我现在检查了限位开关上的电压降；它保持在恒定的
  5 伏。”


  ## 开始切割


  使用前，需要 G 代码来提供切割坐标。图片中的标志被转换为黑白图像，然后转换为矢量——同时优化切割路径和正确的切割头。许多 CNC 制造者使用 FreeCAD，但需要某种
  CAM 插件来生成 G 代码和切割路径。


  G 代码只是坐标的行。CAD/CAM 软件的任务是生成它，以及最合理的切割路径——这是 CNC 机器版的计算机著名旅行商问题，用于在多个目的地之间找到最佳路线。


  ## 搭建 Pi CNC 机器


  ![](img/d8322379620245fcd21eccc3855b8c78_49_1.png)


  ### STEP-01 步进电机

  步进电机——将梯形导杆每次 2mm 的旋转分为 200 步——将 DeWalt 电动工具定位在 X、Y 和 Z 平面，精度为 10 微米。


  ![](img/d8322379620245fcd21eccc3855b8c78_49_2.png)


  ### STEP-02 框架内

  手工切割自 18mm（¾”）船用胶合板，框架牢固地固定梯形导杆、步进电机和电动工具，并通过内置轨道中的夹具将工件固定在原位。


  ![](img/d8322379620245fcd21eccc3855b8c78_49_3.png)


  ### STEP-03 Arduino

  Arduino Uno 运行 Grbl 软件以接受 G 代码中的切割指令并将其转换为电脉冲，以控制步进电机并精确地在三个平面上定位电动工具。


  Mark 是 AutoCAD 的长期用户。虽然对于只为 CNC 机器购买的人来说它价格昂贵，但如果你已经是用户，它能轻松提供你所需的一切：“在我的 Mac 上，我设计任何形状或雕刻并将
  2D 或 3D 模型转换为 G 代码，然后通过 Wi-Fi 或 USB 闪存盘将其传输到树莓派。使用触摸屏，我启动控制器，它就开始工作了。”


  每个梯形导向杆的末端还设有触发开关，以防电动工具被发送到杆的末端时停止。这些开关在缓冲板添加到 Arduino 之前正被电流泄漏触发。


  控制器盒在屏幕旁有四个按钮：开关、panic!、重启和紧急停止。它可以切割 60mm 深的木材。作为完全切割的替代方案，你可以可选地设置控制器留下搭扣，以便更容易地从工作台上一起取出工件。


  > 它将我对电子和木工的热情结合在一起


  嗯，还不完全是：安全功能是任何 CNC 机器必不可少的一部分。在将切割工具与木块对齐、用轨道中的固定螺栓锁住木材并手动校正高度后，必须在控制器上点击安全按钮。机器底座前面还有一个紧急停止按钮。任何动力切割工具都必须设计成能够快速停止，以防出现问题。


  看看照片中《The MagPi》标志（以及 Mark 的 YouTube 频道 – bit.ly/1hZFUmu），你可能会看到侧面的沟槽，与不同的切割深度相对应。这是在三次进给中切割的，大约需要五分钟，以适应铣刀的质量，该铣刀仅花费
  £1.20。如果使用更好的刀具，标志可以在一次进给中完成，耗时不到一分半钟。


  ![](img/d8322379620245fcd21eccc3855b8c78_50_0.png)


  ## 下一步？


  Mark 告诉我们他大部分 CNC 机器的设计都是临时进行的：“我手工切割框架，一边进行一边测试尺寸。”这显然与他通常的工作方式形成对比。“通常我喜欢从一开始就仔细规划好一切。”


  如果他想再造一台，“现在我可以做一个模板，让它切割出自己的新版本。”未来的计划可能包括 Zapmaker 的替代品：“我希望它能做其他事情。我只是喜欢按自己的方式尝试。”也有可能为不同的刀头使用类似的机械和控制装置：可能为
  3D 打印机供电，或将蓝光激光器改装为切割器（当然要适当屏蔽）。


  “我喜欢建造，”Mark 说，这似乎很好地概括了许多创客运动参与者的心态。看到 Mark 的一些其他作品——从可转换为索尼 PS3 赛车控制器的橡木抽屉，到著名的电话亭冰箱——我们确信接下来的任何项目都将是有趣的，同时也是极其精良的工程。


  ![](img/d8322379620245fcd21eccc3855b8c78_50_1.png)


  ### STEP-04 Pi 上

  Zapmaker 的 Grbl 控制器软件最初为配备 256MB RAM 的 Pentium III 优化，很容易过渡到 Pi Model B，几乎没有给 Mark
  CNC 控制器盒中的 Pi 2 带来负担。


  ![](img/d8322379620245fcd21eccc3855b8c78_50_2.png)


  ### STEP-05 Raspbian

  Zapmaker 的 CNC 软件运行在标准的 Raspbian 系统上，zapmaker.org 网站为树莓派奇妙世界的新手提供了完整的说明，以及 Grbl
  信息。


  ![](img/d8322379620245fcd21eccc3855b8c78_50_3.png)


  ### STEP-06 Grbl 控制器

  把所有东西组合起来，屏幕会显示要进行的切割，等待你在安全固定好木块后按下开始按钮。


  ## 弗吉尼亚理工大学


  SeeMore 由弗吉尼亚理工大学的艺术学院和计算机科学系合作创建，分别由 Sam Blanchard 和 Kirk Cameron 领导的团队负责。


  seemoreproject.com


  一件壮观的雕塑，SeeMore 也是一个由 256 台 Raspberry Pi Model B+ 组成的并行计算机


  每台 Pi 都连接到一个伺服电机，该电机根据其工作负载按比例向外移动其臂，从而移动面板


  每个塑料面板上都蚀刻有安装在其上的 Pi 的 IP 地址


  关节臂采用双连杆设计，创造出流畅的“波形”运动


  ![](img/d8322379620245fcd21eccc3855b8c78_51_0.png)


  ## SEEMORE


  ## 由 Pi 驱动的并行计算雕塑


  由 256 台树莓派集群驱动，弗吉尼亚理工大学令人惊叹的动感雕塑直观展示了并行处理的工作原理


  ## 快速事实


  - SeeMore 的建造使用了 580lb（263kg）的高密度塑料

  - 它包含 1,280 个运动部件和 7,312 件硬件

  - 框架使用了 1,320ft（402m）的挤压铝材

  - SeeMore 的建造涉及 60 小时的 CNC 加工和 80 小时的志愿者组装

  - 布线大约需要一天半，使用 1,536ft（468m）的 USB 电缆和 2,200ft（670m）的以太网电缆


  高九英尺半的 SeeMore 雕塑兼超计算机突然嗡嗡启动，其绿色半透明面板在螺旋表面上流畅地向外滑动，形成迷人的波浪，提供了正在进行的计算的物理表现。宛如科幻电影中的事物，SeeMore
  由 256 台 Raspberry Pi Model B+ 网络驱动；一台安装在每个塑料


  面板上，其关节臂在该 Pi 积极进行并行计算任务时向外摆动。SeeMore 的想法起源于 2013 年，当时弗吉尼亚理工大学（vt.edu）计算机科学教授 Kirk
  Cameron 在实验室工作一个 32 节点的树莓派集群。为了帮助更多人理解并行计算的概念，他联系了他的同事雕塑助理教授 Sam Blanchard，


  来帮助为此目的创建一个互动艺术装置。由于 Sam 的主要兴趣领域在于机器人创作，他立即建议制作一个对计算机内部发生的事情做出反应的动感雕塑。“LCD 很酷，”Sam
  解释道，“但通过向他们展示一些正在移动的东西……并在空间中存在的东西，你可以真正引起人们的 visceral 反应。”Sam 告诉我们，SeeMore 的圆柱形设计部分


  ## 构建动能雕塑


  ![](img/d8322379620245fcd21eccc3855b8c78_52_0.png)


  ![](img/d8322379620245fcd21eccc3855b8c78_52_1.png)


  ![](img/d8322379620245fcd21eccc3855b8c78_52_2.png)


  ### >步骤-01


  ### 定制零件


  机制的组件全部由 Sam 使用 PartWorks CAD 定制设计，然后用 ShopBot CNC 机器从亚克力板切割而成。在这张照片中，Sam 正在为雕塑的金属框架制作支撑支架。


  ### >步骤-02


  ### 活动臂


  由多个组件组装而成，SeeMore 全尺寸版本需要 256 个活动臂。每个都具有双连杆结构，使触发时固定 Pi 的塑料面板产生流畅、弯曲的运动。


  ### >步骤-03


  ### 弯曲金属


  由于团队找不到有人能弯曲 T 型槽铝材来制作 SeeMore 框架的弧形，他们为一台弯曲机专门制作了一些滚轮，正如这里由弗吉尼亚理工大学雕塑系学生 Robert
  Redfearn 所使用。


  受 1970 年代中期至后期经典的 Cray-1 超级计算机启发，那是一个计算机远非无聊黑盒子的时代。“它们具有物理存在感，几乎就像雕塑或家具一样，”Sam 说。的确，Cray-1
  甚至周围有一个长凳，这样办公室里的人可以坐下喝咖啡！虽然 SeeMore 没有座位设施，但其占地面积与 Cray-1 成比例，虽然它几乎大两倍，而且还有沙漏形状。此外，早期的设计决策是刻意暴露
  SeeMore 的所有内部构造，包括共计 2,736 英尺（834 米）的布线，与 Cray-1 方式相同。“我非常欣赏那种形式的是它具有内部空间和外部立面，所以它在透明度方面非常出色，你不仅可以字面意义上透视它，还可以绕着它走，看到[所有的电线和内部构造]，”Sam
  透露。


