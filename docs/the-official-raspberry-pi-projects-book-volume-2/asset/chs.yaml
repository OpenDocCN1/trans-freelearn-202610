  \ OS X 或 Linux 中打开终端。对于 Windows，输入 ipconfig；对于 OS X 和 Linux，使用 ifconfig 然后 netstat\
  \ -nr。记下 IP 地址（inet）、广播地址、子网地址、路由器 IP（Destination）和网关地址。之后打开 DHCPD 配置文件（sudo nano\
  \ /etc/dhcpcd.conf）并添加：\n\n```\ninterface wlan0\n\nstatic ip_address=[address]\n\
  static routers=[router IP]\nstatic domain_name_servers=[gateway]\n```\n\n## 树莓派\
  \ Zero\n\n## 从另一台电脑使用您的树莓派\n\n### 使用 Samba 在网络上共享文件\n\n借助名为 RealVNC 的软件，您甚至无需将 Pi\
  \ Zero 插入显示器即可使用其桌面；您可以简单地从另一台电脑控制它。首先，前往 magpi.cc/PiVNC 并将 RealVNC 下载到您的树莓派上。还需获取一个免费许可证密钥（magpi.cc/1O8Hz4J），因为您会用到它。\n\
  \n![](img/d8322379620245fcd21eccc3855b8c78_146_0.png)\n\n上方 在某些版本的 Raspbian 上，Avahi\
  \ 可能已预装\n\n文件在 Pi 上后，打开终端，使用 cd 导航到 Downloads 中的文件（cd Downloads 应该可以），并使用以下两个命令，将方括号替换为适当名称：\n\
  \n```\ntar xvf [VNC file name].tar.gz\nsudo dpkg -i [VNC Server package name].deb\
  \ [VNC Viewer package name].deb\n```\n\n复制您获得的许可证密钥，然后运行 sudo vnclicense -add [Licence\
  \ Key] 并使用您的密钥。在终端或命令行中输入 vncserver 以开始，输入您的树莓派密码（默认为 raspberry）并记下显示器编号。在我们的例子中是\
  \ 1，并且由于已安装 Avahi，我们可以使用 raspberrypi:1 连接。\n\n从此处安装 VNC 查看器：magpi.cc/1M4uzfG，选择您喜欢的平台，然后使用\
  \ raspberrypi:[Number] 连接\n\n### 从命令行远程访问您的 Pi\n\n通过 SSH 协议，您可以从家庭网络上的任何其他电脑访问树莓派。SSH\
  \ 默认应已激活，但为确保其开启，您可以从菜单的“首选项”类别中进入 Raspberry Pi 配置（或在命令行中输入 sudo raspi-config），并确保在“接口”选项卡中已启用\
  \ SSH（或在命令行版本的“高级”菜单下）。如果 SSH 已禁用，请启用它并重新启动。在 OS X 和 Linux 中，您可以从终端使用 SSH；不过在 Windows\
  \ 中，您需要下载 PuTTY（magpi.cc/1Mm5Npi）。\n\n从 OS X 或 Linux 终端，您可以使用以下命令远程访问 Pi：\n\n```\n\
  $ ssh pi@raspberrypi\n```\n\n您需要设置网络名称（参见上一页的框）。输入 yes 以信任连接，然后输入密码 raspberry 登录。如果使用\
  \ PuTTY，只需在地址字段中输入 pi@raspberrypi 并点击 Connect。再次，您必须同意信任 Pi Zero，然后使用密码 raspberry。现在您可以像通常通过命令行一样控制树莓派。\n\
  \n如果您想将树莓派 Zero 用作文件服务器，这尤其好。为此，或只是为了能够从网络上的任何地方访问 Zero 上的文件，您需要使用 Samba。首先，您需要安装它：\n\
  \n```\nsudo apt-get install samba samba-common-bin\n```\n\n您需要配置 Samba 以按预期工作。仍在终端或命令行中，输入：\n\
  \n```\nsudo nano /etc/samba/smb.conf\n```\n\n首先，如果您的网络上有一个 Windows 工作组且具有特定名称，请找到以\
  \ workgroup = WORKGROUP 开头的行，并将大写的 WORKGROUP 更改为您的工作组名称。如果您不知道工作组是什么，可以保留此设置。找到行\
  \ # wins support = no，删除 # 字符，并将 no 更改为 yes。向下滚动到标记为 Share Definitions 的部分并输入以下代码块：\n\
  \n```\n[pihome]\n  comment= Pi Home\n  path=/home/pi\n  browseable=Yes\n  writeable=Yes\n\
  \  only guest=no\n  create mask=0777\n  directory mask=0777\n  public=no\n```\n\n\
  按 CTRL+X，然后按 Y 和 ENTER 保存文件。要开始共享，在终端中输入以下内容并使用您的 Pi 密码（默认为 raspberry）：\n\n```\n\
  smbpasswd -a pi\n```\n\n![](img/d8322379620245fcd21eccc3855b8c78_146_1.png)\n\n\
  上方 配置文件看起来很复杂，但您只需要更改几个部分！\n\n\n"
- '## Pi Zero 配件


  你可以为你的 Raspberry Pi Zero 获取哪些东西来让使用它和创建项目变得更加轻松？


  如今已经形成了一个小小的 Raspberry Pi 经济，当新设备推出时，针对它的新配件的反应速度要快得多。尽管 Raspberry Pi Zero 仅上市几个月，这意味着你已经可以买到一些配件来提升你的
  Pi Zero 使用体验。你还需要一些设备来完成本期中的项目，甚至开始打造你自己的惊人作品。


  ## Zero 外壳


  用这些时尚的外壳让你的 Pi Zero 更具风格


  ### ZEBRA ZERO


  magpi.cc/2dXqMZ9


  由两层木材和厚实的亚克力中心组成坚固的外壳，Zebra Zero 为你的 Raspberry Pi Zero 增添了一丝品味。它还配备了一个巨大的散热片，可能有点多余。你还可以获得带有一个完整面包板的
  Zebra Zero Plus，以便轻松测试。


  ### PIBOW ZERO CASE


  magpi.cc/1KljtQz


  经典激光切割 Pibow 的特殊 Pi Zero 版本现已上市。凭借其独特的贴合芯片设计，它让端口保持非常开放，可用于任何定制项目，甚至一些 Pimoroni
  HAT —— 尽管你需要在组装前插入 SD 卡。


  ### MODMYPI ZERO CASE


  magpi.cc/1KLgEiu


  一款用于 Raspberry Pi Zero 的哑光黑色、激光切割、分层外壳。它保持了四个主要端口的开放以让 Zero 工作（HDMI、SD、USB 和电源），同时也保持
  GPIO 引脚自由。甚至复位和视频输出引脚也可以通过它访问。


  ### ADAFRUIT PI PROTECTOR


  magpi.cc/1ZEZbhn


  与这里介绍的其他外壳相比，Protector 是一个更简单的外壳，它覆盖了 Pi Zero 的底部和顶部的一部分，并没有提供与其竞争对手完全相同的保护。然而，它在
  GPIO 周围留出了更多的空间，从而在你的项目空间紧张时可以更好地访问它。


  ![](img/d8322379620245fcd21eccc3855b8c78_147_0.png)


  ![](img/d8322379620245fcd21eccc3855b8c78_147_1.png)


  ![](img/d8322379620245fcd21eccc3855b8c78_147_2.png)


  ![](img/d8322379620245fcd21eccc3855b8c78_147_3.png)


  ## Zero 外壳


  ## 杂项附加组件


  其他可以提升你的 Raspberry Pi Zero 的零部件


  ### MINI USB OTG ADAPTOR


  magpi.cc/jT9aZc

  有几种这样的适配器可供选择——我们对 meZmory 品牌的适配器有不错的体验，但还有其他几种。它使将单个 USB 设备插入 Pi Zero 变得更加容易——非常适合只需要无线连接而不需要其他功能的项目。


  ![](img/d8322379620245fcd21eccc3855b8c78_148_0.png)


  ### RIGHT-ANGLE GPIO HEADER


  magpi.cc/1ZFoH31

  我们曾向你展示如何将标准 GPIO 排针焊接到 Pi Zero 上，但这个很酷的替代方案允许 GPIO 引脚与电路板平行。这对于空间限制固定的笨拙项目或安装来说是理想的，而且它像任何其他
  GPIO 排针一样焊接。


  ![](img/d8322379620245fcd21eccc3855b8c78_148_1.png)


  ### ESSENTIAL RASPBERRY PI ZERO KIT


  magpi.cc/1RSULPN

  一套可与 Raspberry Pi Zero 一起使用的组件精选，包括额外的适配器、几种 GPIO 排针选项，甚至还有一些可粘贴的小脚垫来抬高 Pi Zero
  离地面。它全部装在一个类似薄荷糖的小盒子里，这个盒子也可以容纳整个 Pi Zero 作为临时便携箱。


  ![](img/d8322379620245fcd21eccc3855b8c78_148_2.png)


  ### SCROLL PHAT


  magpi.cc/1JT9cQT

  这款实际上也适用于其他 Raspberry Pi，但它采用与 Pi Zero 相同的外形尺寸。该板为你提供 55 个 LED 以矩形排列，其工作原理与 Sense
  HAT 上的 LED 矩阵类似。使用 Python 脚本，你可以控制 LED 或让它在板长上滚动文字。


  ![](img/d8322379620245fcd21eccc3855b8c78_148_3.png)


  ### EXPLORER PHAT


  magpi.cc/1Pk5sdN

  这款用于 Zero（和其他 Pi）的扩展板使其能够比直接将它们焊接到 Pi 上更容易地与不同对象通信。这包括电机和传感器——我们曾看到由于这个原因而在机器人中使用
  Explorer。它允许模拟输入以及其他输入和输出，并拥有自己的 Python 库以便快速开发。非常适合微型项目。


  ![](img/d8322379620245fcd21eccc3855b8c78_148_4.png)


  ## 基础套件


  你需要这些基础设备来创建惊人的 Pi Zero 项目


  ### 元件


  LED、导线、电阻，也许还有一些光、热或运动传感器。所有这些在本地电子商店或像 RS Components 这样的分销商的在线商店中都能以非常便宜的价格成捆买到。你也可以在电子入门套件中获得很多，比如
  ModMyPi（magpi.cc/1RvzWta）图片中展示的那种。对于本期中的教程，我们会在你外出购买之前确保你确切知道需要哪种组件。


  ![](img/d8322379620245fcd21eccc3855b8c78_148_5.png)


  ### 烙铁


  制作更高级的项目或组装适用于 Raspberry Pi 的套件时必不可少的一件设备。除了实际的烙铁外，你还需要高质量的焊锡来配合使用。烙铁的合适支架也很理想——一个不太可能烫伤你的支架，配有良好的海绵。焊接可能很危险，所以在他们制作时一定要监督年轻的创客。


  ![](img/d8322379620245fcd21eccc3855b8c78_148_6.png)


  ### 面包板


  原型制作和测试电路的完美工具。如果你从未使用过面包板，它的作用是提供一排排排列的引脚，充当连接器，这样你就不必将组件焊接在一起。这意味着你可以快速更改电路以使其正确，或反复重复使用面包板用于新的和不同的电路。你可能不需要一开始就买一个巨大的面包板，但要选择两侧都有正负导轨的。


  ![](img/d8322379620245fcd21eccc3855b8c78_148_7.png)


  ### 剥线钳


  如果你决定购买一卷电线而不是一堆预先剪好的线，你需要一种从线轴上取线的好方法。用剪刀或刀子慢慢小心地攻击会很快变得极其无聊，投资一副合适的剥线钳，它还能剥掉塑料，会让你的生活改善至少
  10%（不要引用我们的话）。


  ![](img/d8322379620245fcd21eccc3855b8c78_148_8.png)

