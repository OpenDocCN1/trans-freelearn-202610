  \ -16, 1, 512) #Configure pygame sound\npygame.mixer.init() #Initialise pygame mixer\n\
  pygame.mixer.set_num_channels(16)\npianohat.auto_leds(True) # LEDs light when keys\
  \ pressed\n### A dictionary mapping sounds and notes onto keys\nNOTES = {'0':['C','./sounds/piano/39172__jobro__piano-ff-025.wav'],\
