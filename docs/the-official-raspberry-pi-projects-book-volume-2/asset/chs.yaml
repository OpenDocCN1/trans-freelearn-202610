  \ Yo Flow 在线健身房入会。computing4kids.com unop.uk\n"
- "## TIME-LAPSE PHOTOGRAPHY\n\nPhoto by NASA JSC\n\n制作一个设备以定期间隔拍摄照片。然后将这些图像合成为视频\n\
  \n### You'll Need\n- Raspberry Pi 相机模块\n- magpi.cc/1UaFuuW\n\n延时摄影揭示了你 otherwise\
  \ 看不到的有趣事物。那些发生得太慢以至于我们无法察觉的事情：面包发酵和植物生长；云、太阳、月亮和星星穿越天空；影子在土地上移动。在本教程中，我们将制作一个基于\
  \ Raspberry 的设备，让你观察肉眼无法观察到的缓慢事物。为此，我们将拍摄大量静态照片，并使用 FFmpeg/libav 将这些帧合成视频，然后可通过\
  \ Web 浏览器访问。\n\n摄像头的顶部位于排线连接的另一端\n\n排线上的金属触点应背向以太网插槽\n\n![](img/d8322379620245fcd21eccc3855b8c78_105_2.png)\n\
  \n### >STEP-01\n\n### 连接相机模块\n\n首先，使用附带的排线将相机模块连接到 Raspberry Pi。找到正确的插槽；它位于 Raspberry\
  \ Pi 电路板的顶部，是离 micro-USB 电源连接器最远的一个。在较新的 Raspberry Pi 型号上，插槽方便地标有“CAMERA”。抬起插槽外部以释放夹具，然后插入排线，使金属触点朝向\
  \ micro-USB 电源连接器。最后，将排线保持在位置并将插槽外部推回以夹紧电缆。\n\n### >STEP-02\n\n### 启用并测试相机\n\n为\
  \ Raspberry Pi 通电。现在你有选择：启动到命令行、打开终端窗口或建立安全 shell（SSH）连接。通过从终端运行以下命令启动 Raspberry\
  \ Pi 配置工具来启用相机：\n\n```\nsudo raspi-config\n```\n\n然后选择“Enable Camera”选项。你可以通过运行以下命令来测试相机：\n\
  \n```\nraspistill -o testimage.jpg\n```\n\n相机模块上的红色 LED 应亮起 5 秒钟，并且 JPEG 图像将保存到当前目录。如果相机倒置安装，则可以使用垂直和水平翻转命令行开关（-vf\
  \ 和 -hf）。\n\n### >STEP-03\n\n### 安装和配置软件\n\n安装 Web 服务器以远程访问你的图像。运行以下命令安装 Apache：\n\
  \n```\nsudo apt-get install apache2\n```\n\n删除默认页面以查看目录内容：\n\n```\nsudo rm /var/www/index.html\n\
  ```\n\n访问你的 Pi 的 IP 地址（例如 http://192.168.1.45 – 你可以使用 ifconfig 找到它），你应该会看到一个空的目录列表。如果你运行以下命令并刷新页面，你应该会看到一个图像文件列出。你以超级用户身份运行此命令，以便可以写入目录。\n\
  \n```\nsudo raspistill -o /var/www/testimage.jpg\n```\n\n点击文件链接，你将在浏览器中看到图像。\n\n\
  ### >STEP-04\n\n### 捕获图像\n\n设置你的场景并检查相机的定位。\n\n```\nsudo raspistill -w 1920 -h 1080\
  \ -o /var/www/testimageFullHD.jpg\n```\n\n宽度和高度已更改为以 16:9 宽高比捕获较小的图像。这使后续操作更简单。顶部和底部会被裁剪，因此请确保你的主体在画面中。运行以下命令开始捕获：\n\
  \n```\nsudo raspistill -w 1920 -h 1080 -t 10800000 -tl 10000 -o /var/www/frame%04d.jpg\
  \ &\n```\n\n这每十秒（10,000 毫秒）拍摄一张照片，持续三小时（10,800,000 毫秒）。末尾的与号（&）在后台运行该进程。\n\nBelow\
  \ 面包面团准备发酵。在你的视频中观看它发酵。拍摄期间请注意不要移动碗或相机\n\n![](img/d8322379620245fcd21eccc3855b8c78_106_0.png)\n\
  \n![](img/d8322379620245fcd21eccc3855b8c78_106_1.png)\n\nAbove 在 Raspberry Pi 上运行渲染进程的\
  \ Shell。这需要一些时间，因此你可能更喜欢使用更快的机器\n\n### >STEP-05\n\n### 准备制作视频\n\n你可以在 Raspberry\
  \ Pi 上渲染视频，但会非常慢。更好的方法是将文件传输到更强大的计算机。无论如何，你需要在渲染机器上安装工具；对于 Pi，输入：\n\n```\nsudo apt-get\
  \ install libav-tools\n```\n\n这安装了 FFmpeg 的一个分支，但你也可以使用原始的 FFmpeg。要将图像复制到远程机器，你可以使用\
  \ wget 或 curl 从 Web 服务器下载它们。例如：\n\n```\nwget -r -A jpg http://192.168.1.45\n```\n\
