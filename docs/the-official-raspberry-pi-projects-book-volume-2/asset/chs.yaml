  \n## Maker Says\n\n> 基于 Pi 的钢琴，经过 Pimoroni 的标志性润色\n> Pimoroni\n\n![](img/d8322379620245fcd21eccc3855b8c78_165_0.png)\n\
  \npimoroni.com\n\n£15 / $24\n\n## PIANO HAT\n\nLes Pounder 审视了一款基于 HAT 的钢琴键盘，该键盘使用电容式触摸键作为输入\n\
  \n2014 年，一位名叫 Zachary Igielman 的 14 岁少年为他的 Pi Piano 发起了成功的众筹活动。最初使用 MCP23017 GPIO\
  \ 扩展器和一系列瞬时开关创建，Pi Piano 使用压电蜂鸣器模拟音符的音调。Zachary 的顾问之一是来自 Pimoroni 的 Phil Howard，他与\
  \ Zachary 合作创建了这个新改进版本。\n\n## 众筹项目\n\n最新版本现称为 Piano HAT，并使用基于电容触摸的界面模拟传统钢琴键盘的一部分。该板尺寸为\
  \ 64 毫米 x 56 毫米，可整齐地安装在型号 A+、B+ 和 Pi 2 之上。作为 HAT 板，它还连接到全部 40 个 GPIO 引脚。除了键盘之外，我们还可以通过板上的三个额外输入来提高和降低八度音阶并更改乐器。\n\
  \n硬件只是该项目的一部分，支持 Piano HAT 的软件全部基于 Python，这使得在此语言中创建的现有项目可以轻松集成 Piano HAT。Phil Howard\
  \ 编写了一系列示例，使用 Pygame 库演示如何通过一系列音频样本将 Piano HAT 用作典型钢琴，这些音频样本可以根据需要更换为任何类型的声音，以便您构建自己的输入。Piano\
  \ HAT 还附带一个教程，演示如何使用内置 LED 教导演奏一首简单的曲子，即“小星星”。因此，使用此库，我们可以为他人学习编写自己的教程。\n\n## 强大的\
  \ MIDI 合成器\n\n软件不仅限于简单的采样。事实上，Phil 提供了许多方法将 Piano HAT 库连接到 Pi 上运行的 MIDI 服务。这随后将\
  \ Piano HAT 转变为 Yoshimi 和 SunVox 等软件的强大合成器输入，尽管这些应用程序需要 Raspberry Pi 2。\n\nPiano\
  \ HAT 看起来像是一个相当简单的板，但得益于清晰的 Python 库、构建良好的硬件和强大的 MIDI 控制选项，我们拥有一个用于音乐冒险的板。\n\n##\
  \ 相关\n\n## MAKEY MAKEY\n\n这款多功能板已被用于制作楼梯钢琴、使用水作为相机触发器，以及使用意大利面制作键盘。\n\n![](img/d8322379620245fcd21eccc3855b8c78_165_1.png)\n\
  \n£40 / $50\nmakeymakey.com\n\n## 最后的话\n\n如此简单的板，但由于 Python 和 MIDI 的存在，应用无限。这是一个进行音乐实验的绝佳平台，并且可以轻松地与\
  \ Minecraft 和其他项目一起使用。\n★★★★☆\n\nIQaudio.com\n\n£30 / $50\n\n![](img/d8322379620245fcd21eccc3855b8c78_166_0.png)\n\
  \n## Maker Says\n\n> > 具有可变唱机线路输出和专用耳机放大器的卓越音质表现\n> \n> IQAudIO\n\n## IQAUDIO PI-DAC+\n\
  \n任何 Raspberry Pi 都能通过这款高分辨率 DAC 和耳机放大器成为发烧友音乐流媒体设备\n\n## 相关\n\n## AUDIOPHONICS\
  \ I-SABRE DAC ES9023\n\nAudiophonics 的 DAC 与 Pi-DAC+ 价格相似，但它缺少耳机输出。它使用 Sabre ES9023\
  \ DAC 而不是 Pi-DAC+ 中的德州仪器/ Burr Brown DAC，并包括直通 GPIO 连接器，以便您可以堆叠额外的板。\n\n![](img/d8322379620245fcd21eccc3855b8c78_166_1.png)\n\
  \n£30 / $48\nmagpi.cc/2dr8X2d\n\n即使是独立的 Pi 也能成为非常不错的音乐流媒体设备，但添加高质量 DAC 后，它就成为真正的发烧友设备。IQaudio\
  \ Pi-DAC plus 是一款符合 HAT 的板，使用 I²S 接口在 Pi 和 DAC 之间实现数字音频的最佳传输。安装后，您可以从两个唱机插孔获得模拟输出，用于连接到放大器，或\
  \ 3.5 毫米耳机插孔，以及用于添加可选功能的额外引脚。\n\n## 无需焊接\n\n该板不附带任何说明，但您可以在 IQaudio 网站上找到这些说明。无需焊接，并且适用于\
  \ Raspberry Pi A+、B+ 和 2。您需要将提供的支柱拧到 Pi 上以支撑板，然后只需将其连接到 Pi 的 GPIO 板，轻轻拧紧即可。\n\n\
  IQaudIO 还可以提供一个外壳，即一个丙烯酸外壳，具有适合 Pi-DAC+ 端口的合适开口。组装后，您可以下载许多内置 Pi-DAC+ 驱动程序的音频中心发行版——包括\
  \ Volumio、RuneAudio 和 PiCorePlayer——或按照说明在现有安装中添加支持。IQaudio 网站上还有一个预配置的 Raspbian\
  \ 镜像。我们使用了 Volumio 1.55，效果完美。音乐来源可以是 NAS 上的文件、Spotify 等流媒体服务，或直接连接的 USB 硬盘。\n\n\
  ## 极佳音质\n\nDAC 音质出色，由德州仪器 PCM5122 DAC 提供动力，分辨率高达 24 位/192kHz。从音质角度来看，配备此类 DAC 的\
  \ Pi 可以与更奇特、更昂贵的设备相媲美。我们对耳机输出也印象深刻：使用一对 Sennheiser HD600 耳机测试时，声音极佳，具有最佳音频的清晰度和宽敞感。\n\
  \n额外成本的扩展选项包括附加旋转音量控制或用于远程音量控制的红外传感器。Pi-AMP+ 是一款 2×20W 立体声放大器，可连接到板顶部。您还可以使用随附的可选直角排针，设计为焊接在\
  \ Pi-DAC+ 下方以访问 Pi 的 GPIO 信号。\n\n## 最后的话\n\n出色的音质和耳机放大器的加入使 Pi-DAC+ 成为热爱音乐的 Pi 爱好者的推荐配件。\n\
  \n\n\n## 创作者说\n> 易于\n> 安装，\n> 简单\n> 使用，令人愉悦\n> 观看\n> Lightberry\n\n![](img/d8322379620245fcd21eccc3855b8c78_167_0.png)\n\
  \n## LIGHTBERRY\nRussell Barnes 测试了一项旨在为家庭影院体验增添新维度的技术\n\nLightberry 的灵感来自飞利浦开创的一种电视技术，名为\
  \ Ambilight。虽然该技术自然预装在 Ambilight 电视上，但完全可以对任何电视进行改装，以添加其特有的增强氛围的技巧。它有什么作用？原理很简单：你将一圈可变色\
  \ LED 灯环固定在 LCD 电视背面——前提是电视靠墙放置且环境光线较低——LED 上的颜色旨在与屏幕上的画面在颜色和亮度上完美同步，使得光线似乎从屏幕中渗出并在背景的墙面上舞动。正如飞利浦的创作成果一样，Lightberry——它利用\
  \ Raspberry Pi 进行计算——的全部目的就是为你的观看体验增添更多沉浸感。虽然想法很简单，但背后的技术绝对不简单，不过对大多数人来说，结果确实不言自明。\n\
  \nLightberry 以整套套件形式出售，起价略高于 £50 / $80，也可单独购买各个部件。它旨在消除技术方面的烦恼，为你提供尽可能接近即插即用的体验。显然，从屏幕数据中采样数百万像素并在恰当时刻将其转换为正确的\
  \ LED、颜色和亮度并不是最简单的项目，但 Lightberry 让它变得简单。它还设计为可完美配合该技术的最佳软件解决方案，包括 Hyperion 和 Boblight。一旦你挑选了适合自己电视尺寸的合适长度\
  \ LED 灯条并订购了所需的所有套件，一切都会装箱送达并准备组装。虽然我们在盒子里没有找到说明书，但 magpi.cc/2drsyPG 提供了简短但实用的分步说明来帮助你快速上手。过程中最费劲的部分可能是安排和固定\
  \ LED 本身。其余部分只需连接适当的转换盒、下载软件并将其安装到 SD 卡上——任何 Raspberry Pi 用户都应该对此过程非常熟悉。\n\n## 相关\n\
  ## PHILIPS AMBILIGHT\nLightberry 的真正替代品是真正的 Ambilight 电视。我们在撰写时能找到的最便宜的一台是 £350。哎呀。\n\
  \n![](img/d8322379620245fcd21eccc3855b8c78_167_1.png)\n\n£350 / $550 起\nbit.ly/1Ji6m9Y\n\
  \n## 最后的话\n虽然需要一点试错才能找到最佳的 LED 位置，但一旦找到最佳点，我们发现 Lightberry 使用起来令人愉悦。它不是最便宜的 Raspberry\
  \ Pi 项目，但它肯定会让家中的电影迷们满意。\n\n## 创作者说\n> Raspberry Pi 的安全摄像头解决方案\n> \n> SB Components\n\
  \n![](img/d8322379620245fcd21eccc3855b8c78_168_0.png)\n\n## SPI-BOX\n一个非常简单的解决方案，用于创建不会花费过多的运动检测安防设备\n\
  \n这是在科技杂志中关于小型电脑和微控制器的经典教程之一：运动检测摄像头。你可以用多种方式实现——有些比其他方式更容易——而 Raspberry Pi 提供了许多工具，可以让这类项目总体上变得相当简单。\n\
  \nSB Components 推出了一款专为 Raspberry Pi 设计的运动检测摄像头套件。作为一种廉价安防系统，套件中的功能相当标准：一个 PIR 运动探测器、一个专用的整体外壳，甚至还有一个定制版的\
  \ Raspbian，附带发送安全警报的软件。全部价格略高于 £10；加上 Raspberry Pi B+ 或 2 以及 Pi Camera 的费用——在纸面上——你就能以约\
  \ £50 的价格拥有一台相当不错的安全摄像头。组装非常简单。\n\n外壳分为两部分，Raspberry Pi 卡在底部部分，边缘周围所有主要端口均可完全访问。PIR\
  \ 和 Pi Camera 可以拧到盖子上，而一根三线束用于将 PIR 直接连接到 GPIO 端口。插入提供的 SD 卡，你就可以开始使用了。\n\n外壳背面有相当标准的安装孔，可安装在固定在墙上的几颗螺丝上。你需要设置设备上的邮件系统，可通过\
  \ SD 卡上的配置文件访问，你可能可以从另一台电脑上完成；不过之后它只需要一个 WiFi 适配器和电源即可完成工作。\n\n由于代码是用 Python 编写的，如果你需要调整灵敏度或照片/视频的捕获方式，修改起来相当简单。整体效果相当不错，尤其是考虑到价格，不过我们不会依赖它进行任何严肃的安全工作。\n\
  \n说实话，这和任何其他 Raspberry Pi 安全摄像头一样好。它会比你自己拼凑的要好得多，而且可能更便宜、更整洁，所以如果你对增加一点安全性感兴趣，不妨看看。\n\
  \n## 相关\n## NATUREBYTES\nNaturebytes Wildlife Cam Kit 虽然设计用途不同，但可以配置用于安防。它也是防水的。\n\
  \n![](img/d8322379620245fcd21eccc3855b8c78_168_1.png)\n\n## 最后的话\n这是一款很棒的小套件，非常简单地创建了一台可用的\
  \ Pi 驱动安全摄像头，非常适合任何室内应用。它也几乎不超过 £20（带摄像头），是一种廉价的方式来更好地监视某物。\n\n## 创作者说\n> 自己制作 Astro\
  \ Pi！\n> Raspberry Pi\n\n![](img/d8322379620245fcd21eccc3855b8c78_169_0.png)\n\n\
  ## SENSE HAT\n太空：最后的边疆。这是 Sense HAT 的航行。它的使命：让 Raspberry Pi 用户轻松感知环境。勇敢地前往没有 Pi\
  \ 去过的地方……\n\n## 相关\n## ARDUBERRY\n虽然没有什么是完全像 Sense HAT 的，但 Arduberry 允许你将 Arduino\
  \ 板连接到 Pi，从而能够创建自己的定制传感器套件，尽管成本更高。\n\n![](img/d8322379620245fcd21eccc3855b8c78_169_1.png)\n\
  \n$29.99/£19.70\nmagpi.cc/2drt54j\n\n如果你从头到尾阅读过这本杂志（你真的应该这样做，我们这里有一些顶级内容。别担心，我们会在这里等你追上进度。好了？很好！），你就会看到从第\
  \ 6 页开始的 Sense HAT 发布故事。这块小板使 Astro Pi 成为可能，集成了传感器套件以及一个非常简单的 LED 显示屏。它的想法是它坐在你的\
  \ Pi 的 GPIO 引脚顶部，通过几个额外的软件包为你提供来自周围环境的更多数据。\n\n像 Raspberry Pi 基金会生产的所有其他硬件一样，它的价格相当便宜。另一方面，它的价格几乎与\
  \ Raspberry Pi 2 Model B 相当，因此可以被视为对一块扩展板来说有点贵。但从大局来看，考虑到它赋予你的功能，Sense HAT 代表了物超所值的选择。它之所以如此便宜，是因为它被设计为易于构建，并做出了一些妥协以保持价格低廉。\n\
  \n## 便宜如硅芯片\n别误会：Sense HAT 绝对不是廉价产品。它的结构与 Raspberry Pi 相同坚固，没有容易损坏的突出电容器或其他元件。毕竟它是要被发射到太空的，所以需要相当坚固。我们不会开始踩它来测试它的坚韧程度，但它可以承受被粗暴地装上和卸下\
  \ Raspberry Pi。它非常紧密地安装在 GPIO 引脚上（占用全部 40 个引脚），甚至可以用其他 GPIO 接头或连接到各个引脚的导线使用。在编程上没有问题，只要你不是同时尝试使用\
  \ Sense HAT 的功能，尽管如果你知道特定传感器或 LED 矩阵使用的引脚，你可能可以用一点创造性编程来绕过它。\n\nSense HAT 上的具体传感器种类繁多。有通常的环境传感器套件，如温度、压力和湿度，沿\n\
  \n\n![](img/d8322379620245fcd21eccc3855b8c78_170_0.png)\n\n> 使用 Sense HAT，你不能只是为它打开一个图形界面\n\
  \n配备了三组位置传感器，包括加速度计、陀螺仪和磁力计。它们都相当精确，能够在各自领域感知广泛的范围，其输出会即时修改以便使用 Sense HAT 库读取。\n\
  \n## 戴上你的编程帽子\n\n使用 Sense HAT，你不能只是为它打开一个图形界面……至少目前还不行。实际上，创建通用界面或满足你需求的定制界面非常简单，因为坦白说，Sense\
  \ HAT 的编程方面非常直接，使用 Python 的基本语法和一些自身简单的命令结构。因此，你只需几行代码就能轻松从 Sense HAT 获取数据，并且非常容易将数据或图像打印到屏幕上。文本输出由代码处理，因此你不需要做任何荒谬的编码来更改单个图片以使其在屏幕上滚动。\n\
  \n输入和输出的控制也非常全面，Sense HAT 的全部功能都可随时使用。也有大量在线资源（通过 Astro Pi 和 Raspberry Pi 网站）来帮助你学习如何使用它。我们喜欢那个笑脸教程示例；它让我们感到开心。\n\
  \n## 我们嗅到赢家了\n\n总的来说，这是一款出色的设备。它做工精良，功能众多，而且编程也非常容易，得益于为该板提供的出色软件。你可以单独使用它，也可以与其他项目结合使用（我们不久后想把它连接到机器人上），如果它足够好用在国际空间站，那么它肯定足以应付你可能有的任何疯狂想法。\n\
  \n## 最后的话\n\nSense HAT 易于使用，并且不会为此妥协任何功能。它物有所值，是一个很棒的板子，真正扩展了你能用 Pi 完成的事情。\n\n★★★★★\n\
  \n## 制作者说\n\n> > 非常\n> 具有成本效益的\n> 万用表\n> 带有\n> 模拟条\n> \n> Proster\n\n![](img/d8322379620245fcd21eccc3855b8c78_171_0.png)\n\
  \n![](img/d8322379620245fcd21eccc3855b8c78_171_1.png)\n\n## PROSTER VC99\n万用表\n\n\
  万用表 VC 系列能满足爱好者的一切需求，它看起来像个划算的选择吗？\n\n## 相关\n\n## EXTECH EX330 万用表\n\nEX330 拥有 Proster\
  \ VC99 的所有功能，只是将晶体管测试模式换成了非接触式交流电压检测，并且包装更紧凑。可惜的是，它的价格也贵得多。\n\n![](img/d8322379620245fcd21eccc3855b8c78_171_2.png)\n\
  \n£47 / $60\nadafruit.com\n\n多年来，爱好者可负担的万用表与专业级硬件之间一直存在差距。摆脱街头电子商店里 10 英镑的万用表通常意味着要花费\
  \ 100 英镑或更多来购买专业设备。最近，中国万用表开始在不破产的情况下给大牌带来严重竞争——像 Proster VC99 这样的设备就是例子。\n\nVC\
  \ 系列的一部分，Proster VC99 可通过其原始设计制造商（ODM）在不同品牌下获得，旨在为爱好者提供比普通口袋万用表更广泛的功能。当然，通常的功能都齐全且正确——交流电压感应最高可达\
  \ 1,000V，直流最高可达 700V，电流测量最高可达 20A，最长十秒，电容测量，以及带视觉和听觉连续性测试模式的电阻测量。\n\n但 VC99 真正填满了附加功能列表：有一个频率计数器模式，适用于测量最高\
  \ 60MHz，精度为 ±0.5%，一个带捆绑 K 型温度探头的温度感应模式，以及通过内置多极插座为 PNP 和 NPN 晶体管进行电流增益测试（hFE）。对于任何曾经购买过带\
  \ hFE 模式插头适配器的万用表的人来说，只是在购买后不久就丢失了该适配器，仅此一项功能就物有所值。\n\n## 为质量付费\n\n自然，Proster VC99\
  \ 不会花费两倍价格的原因有很多。其中最主要的是其精度：虽然 ±0.5% 的基本精度与即使是昂贵的万用表相比也不错，但电容测量的 ±3.5% 精度评级就明显逊色了。屏幕虽然大，在大多数条件下易于阅读，但没有背光，后壳的支架只能以相当平缓的一个角度支撑万用表。\n\
  \n令人惊讶的是，VC99 并没有在每个角落都偷工减料。随万用表附带的是一个方便的拉链收纳袋，而机身外围的防震橡胶还包括探头的收纳支架。这些也值得一提：与同价位竞争对手相比，VC99\
  \ 随附的探头质量出奇地高。除非你需要特定的东西，比如探头末端带测试钩，否则你不太可能很快考虑升级。\n\n![](img/d8322379620245fcd21eccc3855b8c78_172_0.png)\n\
  \n## 基本功能\n\n为 VC99 设置测量时，很容易忘记它是一款经济型万用表。探头牢固地固定在端口中，模式拨盘切换时带有令人愉悦的触觉咔嗒声。显示屏下方设有按钮用于各种功能，包括在频率和占空比测量之间切换——对于使用软件驱动脉宽调制的\
  \ Pi 项目测试非常方便——以及启用最大和最小读数的记录。还有一个按钮可启用相对测量：例如在测量电阻时，这可用于自动从显示数值中减去测试探头本身的电阻。你在低廉的购买价格中得不到的是任何校准证书的迹象。虽然我们测试单元的测量结果与校准硬件相比是准确的，但不能保证生产线上的下一台型号校准得同样好。如果有可供比较的校准硬件，可以拆下万用表的机壳，通过调整板载电位器手动校准，但这样做会使你可能拥有的任何保修失效。\n\
  \n## 难以阅读\n\nProster VC99 的另一个争议点是随附的手册。小巧且写得令人困惑，它提供了使用设备所需的大部分信息，但不是以最易获取的方式。糟糕的翻译迹象也很明显，包括在万用表正面，其在\
  \ 15 分钟不活动后自动关电的能力自豪地印为‘AUTO OFF POWER’。这些都是小问题。虽然不是每个爱好者都需要比普通口袋万用表更功能丰富的设备，但那些需要的人会发现\
  \ VC99 完全胜任。任何在光线不足的环境中工作的人，都最好把省下的钱花在灯上，以弥补万用表显示屏缺乏照明的不足。\n\n## 最后的话\n\n虽然其精度更适合爱好者而非专业人士，但\
  \ Proster VC99 万用表以口袋友好的价格提供了丰富的功能。\n\n## 制作者说\n\n> > 一个功能强大的迷你可穿戴平台板\n> >\n> >\
  \ Adafruit\n\n![](img/d8322379620245fcd21eccc3855b8c78_173_0.png)\n\n## ADAFRUIT\
  \ GEMMA STARTER PACK\n\n作为可穿戴电子编程的入门，Adafruit 是否组装了完美的套件？\n\n## 相关\n\n## KITRONIK\
  \ ELECTRO FASHION E-TEXTILES DELUXE KIT\n\n在第 37 期中评测过，Kitronik 套件的编程能力比 Adafruit\
  \ 的少，但在英国可以以更便宜的价格买到。\n\n![](img/d8322379620245fcd21eccc3855b8c78_173_1.png)\n\n\
  £15 / $35\ncpc.farnell.com\n\n随着可穿戴计算成为蓬勃发展的业务，找到帮助创客入门的公司也就不足为奇了。由此产生的套件大多数基于导电线，可以缝入织物中以在电气上连接组件。因此，很容易看到\
  \ Adafruit 的 Gemma Starter Pack 中包含的 LED 和导电线线轴，并将其视为又一个跟风产品。但这样做忽略了主角——Gemma。\n\
  \nGemma 由 Arduino 公司合作设计和制造，是为 Atmel 的超紧凑型 ATtiny85 微控制器的智能 breakout 板。ATtiny 微控制器是\
  \ ATmega 芯片的精简版，后者为全尺寸 Arduino 板供电。当低功耗和小型占用比可访问的引脚数量更重要时，ATtiny 微控制器是很好的选择。这使其成为可穿戴项目的明显选择。\n\
  \n使用 ATtiny 与导电线最大的两个障碍——需要特殊编程设备及其封装类型——都被 Gemma 解决了。该芯片放置在一个直径仅 28 毫米的小圆盘上，配有三个可编程\
  \ I/O 引脚、3.3V 供电和地、以及电压输入的连接器。JST 连接器允许电池轻松连接，而 USB 连接器配合专门编写的引导加载程序意味着 Gemma 可以使用标准\
  \ Arduino IDE 和捆绑电缆从任何 PC 编程。\n\nGemma 是明星，但入门套件还有很多其他零件。彩色鳄鱼夹的捆扎使你在用导电线缝制之前可以轻松原型设计你的设计，缝制所需的针也一并提供。有四个\
  \ Adafruit 著名的可编程 RGB NeoPixel LED，采用适合可穿戴的 Flora 形式，以及一个用于捆绑 CR2032 电池的电池架，带集成电源开关。\n\
  \n线本身质量很好，提供了慷慨的 23 米长度。由不锈钢制成的薄双股编织，比竞争对手 Kitronik Electro Fashion 系列中使用的较粗线更容易操作，但附带警告说它不适合组件功耗超过约\
  \ 50mA 的项目。可单独购买的三股替代品可承受高达 100mA；两者均提供在适合任何重型缝纫机的预绕线轴上。\n\n\n\n\n![](img/d8322379620245fcd21eccc3855b8c78_174_0.png)\n\
  \n## Gemma 是主角，但还有很多其他部件\n\n与大多数电子纺织品入门套件一样，毫无疑问重点放在 LED 项目上。 一旦你玩腻了给孩子玩具加上 RGB\
  \ 发光眼睛，就能开始尝试 Gemma 的威力。 虽然三个输入输出引脚感觉有限，但它们提供了惊人的灵活性：其中两个支持脉宽调制 PWM，可用于调光 LED 或驱动小型舵机，而另一个也可以用作模拟输入来读取各种可选传感器。\
  \ 不过，这些必须与 Gemma 使用的 3.3V 逻辑兼容，而这与 Arduino 世界中更常见的 5V 逻辑不同。\n\n对于希望项目能直接迁移的 Arduino\
  \ 爱好者来说，也有令人失望的地方。 除了引脚数量有限外，Gemma 没有可访问的串行端口。 这意味着它无法与例如串行连接的蓝牙或 Wi-Fi 适配器结合，轻松制作联网服装。\
  \ 然而，专注于它不能做什么，就忽略了套件的真正目标。 Adafruit 将 Gemma 套件宣传为初学者入门可编程穿戴式和电子纺织品项目的完美方式，也是其非可编程\
  \ LED 基础套件的明显下一步。 使用可循环切换数百万种颜色的 RGB LED 让事情保持有趣，而套件的低成本使其对仅对电子纺织品项目稍感兴趣的人以及希望在下一次制作中尝试一些不同之物的\
  \ Arduino 用户都具有可及性。 唯一的真正负面是缺乏印刷文档。 虽然 Adafruit 网站上有大量支持信息、教程和项目，但像竞争对手 Kitronik\
  \ 套件那样提供的小册子本会被欢迎，并有助于使这款产品成为真正独立的产品。\n\n上方 套件包含开始所需的一切\n\n### 最后的话\n\n如果你有 Arduino\
  \ 平台的经验并想进入可穿戴电子领域，Gemma 就是正确选择，而这款套件是完美的入门方式。\n\n### 创客说\n\n> 新款 MEDIA PI+ 增强外壳，适用于\
  \ Raspberry Pi 2\n> SB-Components\n\nmagpi.cc/2dVKN2t\n£39.99 / $60\n\n![](img/d8322379620245fcd21eccc3855b8c78_175_0.png)\n\
  \n## MEDIA PI PLUS\n\nA media centre case and remote for your Raspberry Pi: is it\
  \ a necessity for a TV-connected Pi, though?\n\n我们都知道至少有一个人只是把 Raspberry Pi 用作媒体中心，在电视上运行\
  \ Kodi，甚至是能完成工作的古老 XBMC 版本。 长期以来一直缺少的是适合连接电视的 Pi 的外壳——一个可以不显眼地放在电视下方、旁边是 Sky+ 盒子和你多年未碰的\
  \ Wii 的外壳。\n\n虽然 Media Pi Plus 不是第一个，甚至不是第一个 Media Pi 产品，但它们稀少到值得突出讨论。 就 Media Pi\
  \ Plus 而言，它是为 Raspberry Pi B+ 和 Pi 2 的外形尺寸重新发布的。 从美学角度看，它绝对看起来像是你会放在电视下方的东西，具体来说就像\
  \ Freeview 盒子：它低调、黑色，品牌标识非常少。\n\n外壳需要一些组装，因为不包含 Raspberry Pi。 打开外壳，你可以看到它是如何工作的：它向外延伸并在很大程度上空的外壳内重新安置了\
  \ Raspberry Pi 的多个端口。 虽然这看起来有点多余，但它确实为 USB 端口提供了额外电力，允许连接集线器。 你也可以直接将红外接收器连接到 GPIO\
  \ 端口，这与附带的媒体遥控器配合良好，即使你只能用它关闭 Pi 而不能重新打开。\n\n它主要是为 Kodi 设计的，这就是为什么我们的版本附带预格式化的 SD\
  \ 卡上的 OpenELEC，虽然其他 Kodi 版本和分支 我们说的是 OSMC 也能很好地工作。 你可能需要调整一些遥控器设置，但总归没问题。\n\nMedia\
  \ Pi Plus 最好的地方是它非常便宜。 即使算上 Pi 2，整套也只要 70 英镑出头，这对于一个能够长期可靠提供 1080p 的媒体中心来说性价比非常高。\
  \ 组装有点棘手，外壳感觉有点脆弱，不过如果你不打算乱扔或粗暴对待，它是让你的 Pi 媒体中心使用起来更方便的完全可用的方式。\n\n### 相关\n\n###\
  \ MODMYPI MODULAR CASE\n\nThe modular case can be modified to fit in better with\
  \ your lounge, revealing only the ports you need to connect to a TV.\n\n![](img/d8322379620245fcd21eccc3855b8c78_175_1.png)\n\
  \n£5.99 / $9\nbit.ly/1M4gQTi\n\n### 最后的话\n\nThe box is a bit bulky in relation to\
  \ the Pi's size, but it does a good job of making the small jump needed to get the\
  \ Pi better suited for powering a TV.\n\n★★★☆☆\n\n![](img/d8322379620245fcd21eccc3855b8c78_176_0.png)\n\
  \n### 创客说\n\n> 适用于 Raspberry Pi 的超实惠高品质 DAC\n> Pimoroni\n\n## PIMORONI PHAT DAC\n\
  \nIf you’re disappointed by the Pi Zero’s lack of analogue audio output, the pHAT\
  \ DAC may be just the add-on you need\n\n### 相关\n\n### HIFIBERRY DAC+ STANDARD RCA\n\
  \nThe HiFiBerry uses top-quality components and has RCA jacks pre-soldered, but\
  \ its size makes it less suitable for Pi Zero use.\n\n![](img/d8322379620245fcd21eccc3855b8c78_176_1.png)\n\
  \n£23 / $40\nhifiberry.com\n\nPi Zero 的微小尺寸使其非常适合各种任务，除了其功能列表中的一个遗漏：模拟音频。 对于任何试图将\
  \ Pi Zero 嵌入旧收音机或音响系统的人来说，这是一个太大的损失。 幸运的是，Pimoroni 的聪明人提供了 pHAT DAC 解决方案。 pHAT DAC\
  \ 是 pHAT 家族的一部分——该系列硬件附加在顶部 HAT 板专为 Pi Zero 外形尺寸而设计——它为板子添加了高质量的数字模拟转换器 DAC，允许任何\
  \ Pi Zero 输出线路电平音频，准备进行外部放大。 pHAT DAC 的输出不应与全尺寸 Raspberry Pi 系列的模拟输出混淆：pHAT 的德州仪器\
  \ PCM5102A DAC 更胜一筹，提供无噪声 192kHz 24 位线路电平音频。\n\npHAT DAC 随附一个需要焊接到板上才能连接到 Pi Zero\
  \ 的 40 针母头，而 Pi Zero 上需要焊接 40 针公头。 Pimoroni 的做法是有方法的：如果你在制作永久项目，可以去掉母头并将 pHAT DAC\
  \ 直接焊接到 Pi Zero 的引脚上，创建一个超薄的电路板三明治。 你还可以添加一对单独以 1.50 英镑出售的 RCA 连接器，以补充 3.5mm 插孔。\
  \ 焊接完成后，安装并不像它本可以的那样简单。 提供了逐步说明，但不适用于最新的 Raspbian 版本——而且虽然社区成员已提供安装脚本以使其更易于使用，但这尚未链接到产品页面。\
  \ 安装完成后还有另一个问题：没有简单的方法在 pHAT DAC 和 HDMI 输出之间切换。 对于大多数用途来说这不是问题，但如果你计划将 Zero 变成多功能便携式音乐播放器，这可能会造成困扰。\
  \ 一旦运行起来，pHAT 还是有很多值得喜欢的地方——尤其是与优质放大器和不错的音箱搭配时提供的出色音质。\n\n### 最后的话\n\nWhile the\
  \ installation experience needs work, the pHAT DAC certainly fills a hole. If you\
  \ need analogue audio from your Pi Zero, it can’t be beaten – but paying three times\
  \ the cost of the Zero itself may sting a little.\n\n\n\n\n![](img/d8322379620245fcd21eccc3855b8c78_177_0.png)\n\
  \n## PI-TOP\n\n由 Raspberry Pi 构建并由你亲手打造的笔记本电脑。\n\n它是否被 Pi 过度限制，还是一个很棒的小型便携教学工具？\n\
  \n它其实并不算老，但你还记得 One Laptop Per Child（OLPC）项目吗？它是一款使用往昔组件的廉价笔记本电脑，专门为尽可能简化将计算技术带入最贫困的发展中国家而创建。它也非常“绿色”，我们并不是指生态意义上的——虽然它功率也相当低，所以从这个意义上讲它技术上确实是“绿色”的。当我们把\
  \ pi-top 从盒子里拿出来时，这就是首先浮现在我们脑海中的东西，但绝对不是贬义！pi-top 的电梯演讲是，它是一款众筹的笔记本电脑套件，需要用户自行组装，并由附带的\
  \ Raspberry Pi 驱动。当然它远不止于此，我们稍后会深入介绍，但这已经让你对我们所面对的东西有一个基本印象了。\n\n### 抛开第一印象\n\n\
  pi-top 内置了强烈的教育导向。每个 pi-top 用户在登录前必须创建一个云账户，然后设置等内容会同步到该账户。它还会同步来自 CEED Universe\
  \ 的数据，这是一款游戏化学习软件，专门为满足新的 GCSE 课程而定制。除了常规的 Raspberry Pi 教学资源外，这让它在课堂上更具优势，因为学生可以使用任何一台\
  \ pi-top，而不必随身携带太多数据。理论上听起来很棒。不过在讨论其其他优点之前，让我们先回到开箱环节。盒子本身很精美，最先映入眼帘的是分离的笔记本屏幕背面那鲜亮的绿色，上面印有\
  \ pi-top 标志。所有零件分层存放，用柔软的泡沫仔细包装。你需要仔细寻找激光切割的可拆卸电路盖以及所需螺丝和线缆的选件，但它们都在。说明书，以及组装过程，都相当简单。笔记本底壳主要有三个部分，电路板只有两块包括\
  \ Raspberry Pi，所以大部分过程都是准备和装配零件。虽然说明书总体不错，但对两种螺丝的区分并不太好。提示：看起来像主板铜柱的螺丝需要固定到 PCB\
  \ 上；它们头部中央有一道螺纹。另外，其中一个连接方向也不完全清楚。我们在某个时候不得不拆开一点，才能正确组装。\n\n### 相关\n\n### KANO\n\
  \n在游戏化编程教育和搭建方面类似，但它并不是像 pi-top 那样的全能一体产品。\n\n![](img/d8322379620245fcd21eccc3855b8c78_177_1.png)\n\
  \n![](img/d8322379620245fcd21eccc3855b8c78_178_0.png)\n\n### 厂商说\n\n> 用我来玩、学习和创造！\n\
  > Pi-Top\n\n> 它看起来很棒并且完全正常工作，多亏了 Pi 2 处理器带来的额外动力\n\n否则，组装相当迅速。我们打开了 Netflix，看了几集《博杰克历险记》后它就准备好启动了，所以不到一小时，而且如果每分钟不傻笑的话可能更快。确保所有端口和线缆都正确连接，然后就可以第一次开机了。\n\
  \n第一次设置账户非常快速简单，你还可以选择想要从面板快速启动的软件。pi-topOS 是基于 Raspbian Wheezy 的定制界面，提供不同的默认软件，尽管你仍然可以完全访问\
  \ Raspbian 上可获得的标准软件包。\n\n界面大致与普通 Raspbian 相同，但面板位于底部，并且在一些显示特性上更具 OS X 风格。它看起来很棒并且完全正常工作，多亏了\
  \ Pi 2 处理器的额外动力；我们唯一遇到的问题是默认选用的 Chromium 浏览器仍然有点慢。\n\nCEED Universe 在撰写本文时仍处于早期\
  \ alpha 阶段，相当有趣。从 Minecraft 中借鉴资源收集和建造元素，并将其应用于九十年代初期 PC 游戏的俯视美学，以此来教授编程和物理计算，这相当独特。\n\
  \n玩家被要求在游戏中执行 Python 编程任务，从类似 Hello World 的内容开始。它非常游戏化，如果做得好，最终版本会非常出色。\n\n因此，pi-top\
  \ 是一款很棒的设备。虽然它可能不会取代同价位范围内的普通笔记本电脑，但它是一款出色的教育工具。它也是一款便携式 Raspberry Pi，续航时间为十小时，这本身就很棒。希望它能进入课堂，或落入有志青年程序员手中。\n\
  \n### 最后的话\n\n充分利用 Raspberry Pi 创造出一台功能完备的笔记本电脑，由你亲手组装——整个系统对于想要学习的人来说是一次很棒的体验。\n\
