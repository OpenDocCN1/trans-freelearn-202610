  上方 每个面板的伸出程度与其 Pi 的工作负载成比例


  ## 放大规模


  项目起初预算有限，逐步通过三个原型阶段扩大规模，分别使用一台 Raspberry Pi、九台和三十台 Raspberry Pi（见“原型制作过程”框）。随后，国家科学基金会和弗吉尼亚理工大学的创意、艺术与技术研究所提供了额外资金，使其扩大到最终的
  256 节点版本。


  SeeMore 的机制全部由 Sam 定制设计并制作，其设计随时间演变。最显著的是，移动面板安装的 Pis 的活动臂专门设计以创造更流畅的效果。“Raspberry
  Pis 的运动实际上是一条曲线……它不会只是弹出来，而是向外铰接，”Sam 说。“它有一个双连杆，有些人可能会认为这是多余的或过于复杂，但我认为你得到的……是这种波形，它与流畅性这些想法相关，而这正是许多并行计算机要处理的，例如天气模拟或流体动力学。”


  当 SeeMore 最近在纽约市世界创客大会上展出时，它配备了一个本地开源数据库，使用户能够通过定制触摸屏搜索给定地铁站周围的兴趣点。Kirk 告诉我们，这样的任务需要多个步骤。“首先是将此问题分解为更小的子任务，例如让每个
  Pi 搜索一个非常大的兴趣点数据库的一部分。在此示例中，我们集群中的 Pis 将被分配数据库的各部分进行搜索，并且它们都将使用相同的地铁站作为搜索的‘令牌’。这种分而治之的方法是并行计算中常用的算法，此示例与
  Google 搜索中使用的算法以及在 SeeMore 上演示的算法相似。”


  ## 建造继续...


  ![](img/d8322379620245fcd21eccc3855b8c78_53_1.png)


  ### >步骤-04 组装框架


  金属框架的圆形部分由两个弧段组成，便于组装。拧入框架的 Furman 电源块通过带双 USB 端口的墙插适配器为每个 Pi 和舵机单独供电。


  ![](img/d8322379620245fcd21eccc3855b8c78_53_2.png)


  ### >步骤-05 舵机众多


  使用 256 个 Hi-Tec HS-7966HB 舵机来移动活动臂，从而带动附着的 Raspberry Pi 面板。在活动上展出 SeeMore 时，团队会准备备用组件，以防任何部件出现故障。


  ![](img/d8322379620245fcd21eccc3855b8c78_53_3.png)


  ### >步骤-06 塑料面板


  每个塑料面板上都蚀刻有该 Pi 的 IP 地址。将它们联网并不是很大的挑战，因为所有以太网电缆都通向内部底座，在那里可以任意顺序连接到六个 48 端口以太网交换机。


  ## 原型制作过程


  在扩大到 SeeMore 最终全尺寸版本之前，制作了三个原型...


  ![](img/d8322379620245fcd21eccc3855b8c78_54_0.png)


  原型 01

  第一个基础原型配备了一个 Raspberry Pi，连接到由舵机驱动的金属活动臂上。然后将其交给计算机科学系进行软件测试。


  ![](img/d8322379620245fcd21eccc3855b8c78_54_1.png)


  原型 02

  九个 Raspberry Pi 安装在平面框架上，团队必须想办法布线以避免缠绕。计算机科学系创建了一个九节点并行计算算法。


  ![](img/d8322379620245fcd21eccc3855b8c78_54_2.png)


  原型 03

  扩大规模后，30 个 Raspberry Pi 安装在透明 HDPE 面板上，而活动臂、框架和布线系统与最终全尺寸雕塑中使用的一样。


  此外，与触发时直接移动到最大 90 度外向位置不同，每个面板根据相应 Raspberry Pi 使用的计算能力百分比移动。为实现这一点，每个 Pi 通过 GPIO
  引脚连接到其臂的舵机。虽然在原型设计中，舵机也从 Pi 获取电力，但从原始 Pi Model B 切换到 SeeMore 最终版本的 B+ 使得两者必须单独供电。不想用电池组或外部电源使设计过于复杂，Sam
  最终购买了带两个 USB 端口的 PSU，以便为 Raspberry Pi 和其舵机分别布线。


  在软件方面，Kirk 告诉我们，控制舵机并在 Pis 上运行完整操作系统导致了复杂性。“例如，我们通常在整个集群的操作系统之上安装软件堆栈或一系列工具。在 Pi
  环境中，将此堆栈与舵机控制相结合并使 Pis 的运动与运行任务同步具有挑战性……由于从未做过，因此没有太多社区软件支持。因此，我们创建了大量定制软件，使其以视觉上引人注目方式工作。”


  ## 定制组件


  臂本身由多件由 HDPE（高密度聚乙烯）塑料制成的零件组成，在 ShopBot CNC 机器上铣削而成。这些零件插入了青铜轴承，全部使用团队切割的钢轴。“几乎每一件都是定制的：有些人认为我们是从货架上买来的，但我向你保证，我们花了许多小时加工这些零件，”Sam
  笑着说。他告诉我们，这为学生提供了许多铣削经验。塑料面板全部激光切割并在两个位置蚀刻有附着 Pi 的 IP 地址，以便面板平放或移出时都能看到。起初使用蓝色和透明面板，团队后来为纽约创客大会将其改为半透明绿色。“我喜欢为展示地点定制项目的想法。”


  > 在活动上展出 SeeMore 的物流涉及将其运送在六个箱子中


  在活动上展出 SeeMore 的物流涉及将其运送在六个箱子中，然后在现场组装。“我的学生和我提前三天到达，”Sam 说。框架的环——为运输而分成两半，Pi 仍附着其上——重新组装后，需要一天半进行布线。“外面一个人，里面一个人，然后你只是互相传递电线。里面其实很松散，我喜欢保持这种状态：我喜欢电线在结构内部自行移动的方式。”虽然正确布线所有
  USB 电源线是一个主要挑战，但 Sam 告诉我们，连接 Pi 网络并不成问题，因为电缆连接到 SeeMore 底座的六个 48 端口以太网交换机，所以不重要它们插到哪个端口。


  尽管整体组装过程很艰苦，但最终结果确实令人惊艳，在 SeeMore 迄今出现的几场活动中吸引了大量观众。遗憾的是，Sam 告诉我们，弗吉尼亚理工大学没有合适的空间以组装形式保存
  SeeMore，所以它目前仍在箱子里，但计划在 2016 年再次展出。敬请关注更多消息。




  ## 神奇魔镜


  魔镜魔镜在墙上，今天天气会怎样？我应该带伞吗？


  ![](img/d8322379620245fcd21eccc3855b8c78_55_0.png)


  BRADLEY MELTON

  一名网络工程师和 aspiring ‘专业极客’，他喜欢使用并赞颂树莓派。

  imgur.com/A4kjx7w


  ### Quick Facts


  - 项目使用 Google Code 制作

  - 制作框架花了一周时间，代码花了几天

  - 这是布雷德利的首个创意 Pi 项目

  - 过去，他在家里的 Cisco 网络实验室中使用过树莓派

  - 在线社区在使其正常工作方面提供了很大帮助


  铁人电影以其描绘近乎触手可及的技术方式激励了人们令人惊叹。看着有人俯瞰阳光明媚的马里布，同时天气信息直接显示在他们面前，这是一个很棒的视觉效果。这并不是完全全新、从未见过的技术——汽车很久以前就开始将抬头显示器投影到挡风玻璃上了——但它从未在大型商业大片中流行过。虽然我们似乎还没有完全达到托尼·斯塔克卧室中令人难以置信的玻璃技术的阶段，但显然我们已经足够接近让镜子以同样的方式工作，至少布雷德利·梅尔顿用他的魔镜实现了这一点。


  “It’s called a ‘Magic Mirror’, but a more accurate name would be a ‘Smart Mirror’,”
  Bradley tells us. “It’s a mirror that displays the information you need to know
  at a quick glance: the time, the date, the weather, and of course a compliment!”


  这并不是同类中的第一面镜子，布雷德利承认他从 Michael Teeuw 的一个先前项目中汲取了一些灵感（有关更多细节，请参阅 Michael 的博客：magpi.cc/1PzFbWa），他借鉴了这个概念并将其简化到更适合初学者的水平，以便自己能更多地学习网页开发。


  “Plus, because I know what each and every function does and how it works, it makes
  it easier to fix bugs as well as make improvements in the future.”


  它是一面额外实用的镜子，因为它显示了从互联网获取的最新天气信息


  它看起来像一面镜子，但实际上是一个巧妙的伪装——一个显示器，外加一些双面玻璃并被框架覆盖


  ![](img/d8322379620245fcd21eccc3855b8c78_55_1.png)


  当然，一面镜子也应该能够反射你的形象并确保你看起来很棒


  ### A TECH REFLECTION


  ![](img/d8322379620245fcd21eccc3855b8c78_56_0.png)


  ![](img/d8322379620245fcd21eccc3855b8c78_56_1.png)


  ![](img/d8322379620245fcd21eccc3855b8c78_56_2.png)


  ### >STEP-01 Turn the mirror on


  打开显示器会激活树莓派，其电源通过镜子本身上的 USB 端口供电。它启动到 Chromium 网络浏览器，该浏览器显示在屏幕上。


  ### >STEP-02 Getting the data


  天气信息取自 Yahoo，使用 simpleWeather.js jQuery 插件抓取，然后在显示器上显示天气。时间也会显示出来，同时还有一句赞美。


  ### >STEP-03 Keep me updated


  一切都按计时器工作，因此构成显示器的浏览器窗口中的天气和时间每 15 秒更新一次，而赞美每 30 秒更新一次。


  而不是使用真正的镜子并在其上投影数据，魔镜使用的是一个宽屏显示器，其被置于纵向模式并在上方放置了丙烯酸双面镜。通过适当的照明和显示器调整，它可以反射得足够好以用作镜子，同时显示天气数据。电子设备相当简单：它只是一个通过
  HDMI 连接到镜子的 Pi、一个用于检索在线数据的 WiFi 适配器，以及一根连接到显示器的 USB 电缆，这也是它获取电源的方式。为了收尾，布雷德利制作了一个木质框架覆盖在边框上，使整个装置伪装得更好一些。


  “It’s not very complex,” Bradley informs us. “As long as you have a little bit of
  carpentry or DIY skill to build the frame and have a basic understanding of how
  to program, you should be able to build this. I have never used JavaScript or CSS
  before this project, and I only had a little bit of experience with HTML, but this
  webpage is built almost entirely from JavaScript and CSS.” At the time of writing,
  the mirror has been running for a few weeks without any problems. It seems like
  Bradley wants to include some holiday-themed extras to it, starting with some spooky
  additions for the Halloween just past. We’re hoping he will add some jollier ones
  for the Christmas period.


