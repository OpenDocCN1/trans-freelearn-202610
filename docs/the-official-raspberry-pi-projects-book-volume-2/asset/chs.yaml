  ![](img/d8322379620245fcd21eccc3855b8c78_36_1.png)


  ### >步骤-01

  挥动手


  超声波传感器能够相当精确地测量其范围内最近表面的距离。你的手充当这个表面，上下移动会造成测量距离的差异。


