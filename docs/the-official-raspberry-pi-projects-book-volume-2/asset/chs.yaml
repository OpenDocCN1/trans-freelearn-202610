  ## FABSCAN PI


  Mario Lukas 使用 Raspberry Pi 和现成的组件构建 3D 扫描仪。他向 Lucy Hattersley 讲述了制作方法


  ### 快速事实

  - 所有零件总成本不到 100 美元

  - 商用扫描仪的价格约为 3,000 美元

  - FabScan 软件可创建 PLY 和 STL 文件

  - 网格文件可用于 3D 打印物体

  - Mario 正在尝试双激光和绿色激光


  现代生活中很少有比 3D 扫描一个物体然后使用 3D 打印机制作复制品更有趣的事情。但 3D 扫描仪购买起来仍然非常昂贵。FabScan 是由 René Bohne
  和 Mario Lukas 开发的开源 DIY 3D 激光扫描仪。最初，FabScan 连接到外部计算机，但 Mario 和 René 最近创建了 Raspberry
  Pi 版本，将所有所需组件都容纳在一个盒子内。这种由 Raspberry Pi 驱动的版本意味着你可以用不到 100 美元（£65）构建一台完整的 3D 扫描仪。


  FabScan 项目有着悠久的历史。它始于 2011 年 RWTH University 在亚琛（德国）Francis Engelman 的学士论文。2014
  年，开发工作由 Mario 和 René 接手。“没有 Raspberry Pi 的 FabScan 是一款开源的 DIY 3D 激光扫描仪，”Mario 说。“几个月后我意识到人们在各种操作系统和硬件设置上让
  FabScan 软件运行有困难。”“FabScan 使用激光切割的胶合板外壳，”Mario 继续说道。


  中间有一个步进电机连接到转盘。机箱内部有一个 5mW 红色激光和 Logitech C270 网络摄像头。激光和网络摄像头安装在机箱的前部。一个带有 FabScan
  扩展板的 Arduino 控制步进电机和激光。你将物体放在转盘上，使激光横扫其表面。随着转盘旋转，网络摄像头监测激光的移动并创建点云数据。该数据被转换为 3D
  网格，此文件可以导出并在 3D 软件中使用。“自从我将 Raspberry Pi 引入 FabScan 项目以来，网络摄像头已被 Pi Camera Module
  取代，”Mario 告诉我们。“我们也在开发 FabScan Pi HAT 以取代 Arduino 和 FabScan Shield。”


  ![](img/d8322379620245fcd21eccc3855b8c78_33_0.png)


  Raspberry Pi 安装在盒子内部并运行网页界面。你可以远程连接到后者以开始扫描过程


  木质外壳包含一个电动转盘，可旋转被扫描的物体。它目前由 Arduino 控制，尽管正在开发定制的 Pi HAT


  一个 5mW 红色激光固定在 FabScan 的角落。它将一条线直接投射到转盘上。Pi Camera Module 用于在物体旋转时监测激光


  MARIO LUKAS

  Mario Lukas 是来自德国亚琛的硬件黑客、计算机科学家和技术 tinkerer。

  mariolukas.de


  ## 它是如何工作的？


  ![](img/d8322379620245fcd21eccc3855b8c78_34_0.png)


  ![](img/d8322379620245fcd21eccc3855b8c78_34_1.png)


  ![](img/d8322379620245fcd21eccc3855b8c78_34_2.png)


  ### STEP-01 盒体结构


  FabScan 盒由木质零件激光切割而成。由 Arduino 控制的步进电机用于控制木质转盘。激光安装在角落并沿对角线在转盘上发出一条线。


  ### STEP-02 Raspberry Pi


  Raspberry Pi 运行扫描软件，并使用 Raspberry Pi Camera Module 代替网络摄像头。使用 Pi 使 FabScan 成为一台自包含的
  3D 扫描仪。


  ### STEP-03 扫描鸭子


  一个物体（在本例中为橡胶鸭）放在转盘上。使用网页软件连接到 Pi 驱动的 FabScan。随着鸭子旋转，摄像头监测激光并用它来创建扫描。


  你可以使用木板自己制作 FabScan 外壳，完整的物料清单可在 magpi.cc/2dTI8WT 找到。或者，也可以从德国分销商 Watterott（magpi.cc/2dTjSi）订购
  FabScan Cube Kit v2 + Electronics 捆绑包，价格为 €105（£77）。


  “任何想制作 FabScan Pi 的人应该订购零件并制作它，”Mario 坚持说。“我们正试图让事情尽可能简单，而将 Raspberry Pi 引入 FabScan
  项目是提高可用性的一个好方法。”


  “大部分工作是为 FabScan 编写新软件，”Mario 继续说道。“该软件为扫描提供基于 JavaScript 的网页启用用户界面。用户可以在浏览器中调用本地
  FabScan，用户界面就会显示出来。”


  “在软件开发过程中，我扫描了很多不同的橡胶鸭、其他塑料动物、石膏（巴黎石膏）制作的人物，以及我在工作室里随处可见的东西。”


  “扫描后，你将获得与扫描物体一模一样大小的三维模型，”Mario 解释道。“当前的 FabScan Pi 软件可以将模型导出为 STL 文件格式，这是 3D 打印机主要使用的格式。”


  推动 FabScan 项目向前发展是一项挑战，但 Mario 和 René 仍然毫不畏惧。


  “目前，FabScan 项目分散在整个网络上，”Mario 解释道。“在接下来的几周里，我将尝试创建一个网站，让所有相关的讨论都汇聚在一起。”


  “目前我正在为 Raspbian 编写一些 DEB 包，以尽可能简化安装过程，”Mario 透露。“下一步是发布一个预装 FabScan Pi 软件的 Raspbian
  镜像。我还有一个庞大的待办事项清单，其中包含 FabScan 社区提到的新功能。”


  > 将 Raspberry Pi 引入 FabScan 项目是提高可用性的一个好方法


