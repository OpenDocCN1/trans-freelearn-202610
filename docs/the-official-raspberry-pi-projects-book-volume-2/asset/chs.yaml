  \ C++（ouch）引入的。幸运的是，对于今天的学习者来说，Python 已被广泛接受，并且作为一种具有强烈 OOP 倾向的多范式语言，它成为 OOP 的理想入门。\n\
  \nPhillips 的书在你可能通过为 Pi 编写简单的过程式脚本而获得的基础 Python 知识之上构建，并为你提供完整的面向对象讲解。从逻辑上讲，从对象和类开始，这引出了继承；讨论了多重继承（take\
  \ that, Java），然后是第一个案例研究。每章都以一个有用的案例研究和实践导向的练习收尾，通常会产生进一步的思考，供读者带到自己的工作中。\n\n从属性可访问性到设计模式，Phillips\
