  \n当今的硬件初创公司与前辈相比已大不相同，这得益于使用 Pi 和 Arduino 等板子进行原型制作的极低成本、新的硬件制造生态系统（包括小批量生产和 3D\
  \ 打印零件），以及精益技术从软件业务向硬件业务的转移。\n\n在《硬件创业》中，DiResta、Forrest 和 Vinyard 为任何被较低进入成本吸引、希望将副业项目转变为硬件业务的人提供了路线图。从原型制作和制造，到社区参与和法律问题，以及开发和生产产品然后交付给客户的各个方面，都以适当的深度进行了探讨，适合认真考虑将产品创意转变为业务的人。\n\
  \n开源硬件仅被简要提及，而出售用户数据几乎被视为理所当然，但鉴于硬件领域的社区和合作项目比软件领域少，对狭隘的硅谷式初创公司观点的关注不足为奇。然而，树莓派本身就是以社会企业方式运营成功的硬件业务的典范。\n\
  \n评分 ★★★★☆\n\n### 树莓派计算机视觉编程\n作者: Ashwin Pajankar\n出版社: Packt\n价格: £16.99\nISBN:\
