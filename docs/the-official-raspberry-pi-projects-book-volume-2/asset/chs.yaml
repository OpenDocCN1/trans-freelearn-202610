  \n凭借四核和 1GB RAM，树莓派 2 正是运行 Apache Spark 的小型廉价集群的理想选择——该集群计算框架在机器学习算法方面表现出色。Pentreath\
  \ 带来了关于使用 Apache Spark 进行机器学习的示例驱动书籍。适合 Hadoop 生态系统——是研究和开发机器学习算法的绝佳平台。这项工作从在 Amazon\
  \ EC2 上设置开始，但网上有很多帮助可以让 Spark 集群在 Pi 上运行，然后你就可以准备好剩余的章节了。\n\n这些章节涵盖了机器学习的现实用例，这将使任何具有基础或零知识的主题的人走得很远，并帮助具有一些机器学习经验的人在从文本挖掘到降维等方面建立起使用\
  \ Spark 的强大理解。示例几乎全部使用 Scala 和 Python——后者从 Pi 用户的角度来看是本书的受欢迎加分项。推荐给所有有志于成为数据科学家的人。\n\
  \n评分 ★★★★☆\n\n## 从零开始的数据科学\n\n**作者:** Joel Grus\n**出版社:** O'Reilly\n**价格:** £26.50\n\
