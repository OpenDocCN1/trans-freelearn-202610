  开关和 PowerBoost 准备好后，我们可以着手安排 PowerBoost 和 3.7V 500mAh 电池本身的位置。这可能是项目中最棘手的部分。通常这些
  LiPo 电池的电源线相当短，所以你可能需要费点劲才能正确安装。此外，由于我们希望利用 PowerBoost 板的充电功能，micro

  PowerBoost 的部分在机箱内位于 Pi Zero 右边缘下方，我们使用两个双面粘性贴片将 PowerBoost 连接到控制器的电路板上，使其实际位置低于
  Zero。电池本身无需固定，因为其尺寸使其不会移动。在这一点上，明智的做法是确保你仍然可以合上外壳


  ![](img/d8322379620245fcd21eccc3855b8c78_151_1.png)


  ![](img/d8322379620245fcd21eccc3855b8c78_152_0.png)


  ![](img/d8322379620245fcd21eccc3855b8c78_152_1.png)

  并找到需要调整的任何卡住点。我们发现必须移除一些螺丝的支撑支架，但我们确保至少保留两个（最左和最右的）完好无损，以便仍能牢固地固定外壳。


  ## 焊接 micro USB

  就剩下的实际动手工作而言，我们几乎完成了。最后的任务是物理连接 Pi Zero 与 USB 线缆和 PowerBoost。关于供电，直接将 PowerBoost
  的 5V 和地线引脚焊接到 Pi Zero GPIO 上的 5V 和地线引脚是完全可以的，但由于你将来可能想把 Pi Zero 用于其他用途

  ![](img/d8322379620245fcd21eccc3855b8c78_152_2.png)

