  \        # Red off and blink amber 4 times with 0.5 second intervals\n        th.lights.amber.blink(0.5,0.5,4,False)\n\
  except KeyboardInterrupt:\n    exit()\n```\n\n> 一个 GPIO 扩展件，使学习物理计算编程变得更容易一些\n\n\
