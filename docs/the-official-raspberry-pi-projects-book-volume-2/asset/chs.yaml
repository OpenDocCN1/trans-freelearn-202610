  \ HAT 功能。跟随我们学习如何充分利用 HAT 和 GPIO Zero。\n\n你将使用的主要功能是：三个 LED、一个推按钮开关和一个蜂鸣器。\n请务必按照板上的轮廓指南放置它们。蜂鸣器的正极侧在组件上标明，板上也有指南显示应将其安装在哪一侧。LED\
  \ 应焊接，使灯泡的平面边缘与轮廓的平面边缘相遇。\n\n## >STEP-01\n### 准备 Traffic HAT\n\n你可以购买预焊接好的 Traffic\
