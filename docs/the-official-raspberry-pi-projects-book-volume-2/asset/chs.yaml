  \ 如何在命令行连接 WiFi\n\n### 为您的 Pi Zero 设置网络名称\n\n如果您按照本页的无线教程设置静态 IP，那么您将始终能够使用该 IP\
  \ 地址从任何远程服务访问树莓派 Zero。然而，对于想要更简单自动方式的人，您仍然可以通过设置 Zeroconf 使通过网络连接 Zero 变得同样简单。在命令行或终端中，输入以下命令以确保其已安装：\n\
