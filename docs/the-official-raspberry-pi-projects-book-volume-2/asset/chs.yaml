  为 Pi Zero 供电，我们只需要红线和黑线；分别对应电源和地线。它们连接到 micro USB 线上的两个外侧连接器——连接器的最长平边朝上并朝向你时，地线在左侧。只需搜索“micro
  USB 线连接器”即可找到方便的参考图。将地线和电源线简单焊接到 PowerBoost 上的 5V 和地线引脚——真的就是这么简单。将其连接到 Zero 进行测试——假设你的
  Pi Zero 中有一张配置正确的 SD 卡，打开电源开关时它应正常亮起。连接控制器 micro USB 也同样简单。将 micro USB

