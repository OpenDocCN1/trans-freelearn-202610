  ### 快速事实


  - 这是 Chris 的第一个 Raspberry Pi 项目

  - 音量轮来自 Game Boy Advance

  - Chris 为这个项目创建了定制 PCB

  - 不幸的是，它运行 Nintendo 64 游戏效果不佳

  - Chris 在上面最喜欢玩的游戏是 Super Mario Bros 3


  过去几期中，我们报道了各种类型的复古游戏项目：翻新的 SNES、3D 打印的 NES、运行游戏的 Power Glove 等等。虽然这些都是非常酷的项目，你知道什么更酷吗？一台便携式复古游戏机！过去，这个位置通常由非常可破解的索尼
  PSP 占据，但 Chris Duerden 决定走一条更具自制路线的道路，通过使用与这些其他复古游戏项目相同的 Raspberry Pi 从零开始制作自己的机器。


  “我的项目是一款由 Raspberry Pi 2 驱动的类似 Game Boy 的东西，”Chris 告诉我们。“它运行 RetroPie，所以可以玩很多不同系统的游戏。目标是拥有足够的按钮来支持
  PlayStation 游戏，拥有 3.5” 屏幕，并且在比原版 Game Boy 更小的尺寸下拥有七小时的游戏续航时间！”

  七小时的要求是为了让它能够在长途飞机旅行中幸存下来，而现代掌上设备却无法做到这一点。“我喜欢复古游戏，想在旅行时做点什么，”Chris 解释道。“我不想随身携带一箱游戏卡带或
  AA 电池，也希望它一应俱全，任何玩它的人都很容易使用。”

  这个想法是在他了解 RetroPie 后萌生的，他开始摆弄 Raspberry Pi。整个东西都是定制的，从 Raspberry Pi 2 和 3D 打印外壳开始。外壳以
  Game Boy 为基础灵感，增加了更多正面按钮以及肩部按钮，以适应 PlayStation（和其他主机）游戏。有一块 3.5” 屏幕、6000mAh 便携电池、功放、扬声器、插孔、LED
  和各种按钮和


  ## 机械流程


  ![](img/d8322379620245fcd21eccc3855b8c78_44_0.png)


  ![](img/d8322379620245fcd21eccc3855b8c78_44_1.png)


  ### >STEP-01

  待机


  电源开关由一个 ATtiny 芯片控制，该芯片保持睡眠模式，直到电源打开，然后唤醒它以开始为屏幕供电。


  ![](img/d8322379620245fcd21eccc3855b8c78_44_2.png)


  ### >STEP-02

  开机时


  Raspberry Pi 上有一段代码让 ATtiny 知道它已开机，并直接启动到 RetroPie。电源开关开始关机程序。


  ![](img/d8322379620245fcd21eccc3855b8c78_44_3.png)


  ### >STEP-03

  关机


  当 ATtiny 被告知 Pi 正在关机时，它会关闭屏幕并接地电源，在返回睡眠模式之前关闭稳压器。


  ![](img/d8322379620245fcd21eccc3855b8c78_44_4.png)


  背面的按钮非常基础，但 Chris 不确定如何改进它们


  > 续航时间足够进行七小时游戏，同时体积小于原版 Game Boy！


  开关取自 NES 和几台 Game Boy。

  “让所有东西都装下并协同工作很复杂，” Chris 承认。

  “我用 SolidWorks 设计了外壳，用 Python 为 Pi 编写程序，用 C 编程 AVR，设计了定制电路板，做了大量面包板实验，还联系 Adafruit
  了解他们的产品能做什么、不能做什么等等。但相对来说建造起来很容易。”


  结果对 Chris 来说足够好，有电源开关，游戏可从侧面的 USB 端口加载，并且可以通过机箱底部的 micro-USB 线缆为电池充电。

  现在，Chris 正在为他的女朋友制作第二个，并最终会写一份完整的制作指南，包括电路板的稍改进方案。很快你就能让长途旅行更有趣。


  ## MAC MINI PI


  无可否认这是最小、最可爱的经典 Mac 风格项目，Mac Mini Pi 实际上远不止是 Raspberry Pi 的一个漂亮外壳...


  ![](img/d8322379620245fcd21eccc3855b8c78_45_0.png)


  ![](img/d8322379620245fcd21eccc3855b8c78_46_0.png)


  ![](img/d8322379620245fcd21eccc3855b8c78_46_1.png)


  上方 Mac Classic 风格机箱本身的 CAD 设计。你可以将设计发送给 3D 打印服务，或到当地的创客空间打印


  ### A

  Adafruit 在打造令人印象深刻的 Raspberry Pi 项目方面颇有心得，而 Ruiz 兄弟的 Mac Mini Pi——最初受 RetroMacCast
  的 John Badger 启发——当然也不例外。除了设计毫不掩饰地可爱，这个迷你 Mac 远不止是 Raspberry Pi 的一个花哨外壳——它是一个完全功能的模拟器，让你可以重温
  Mac OS 7 的辉煌岁月（或首次体验）。用于模拟的软件是 Mini vMac 的一种变体（magpi.cc/2dq3foj），它完美模拟了运行 Motorola
  680x0 微处理器的早期 Mac。软件也能愉快地与 Raspbian 一起运行。


  Adafruit.com 的指南包含了你自己构建项目所需的一切，包括详细说明和 3D 打印所需的文件（如果你没有自己的打印机，可以使用 3D 打印服务）。在内部，项目使用标准
  Raspberry Pi Model B、320×240 3.2″ PiTFT 屏幕、3.7V 锂离子电池和一个简单的音频放大器等。一些基本的焊接技能是必须的，你可以预计在构建本身上花费整个周末（它很繁琐！）。


  你可以在以下地址查看这个令人惊叹的项目的全部内容：magpi.cc/2dq4eox


