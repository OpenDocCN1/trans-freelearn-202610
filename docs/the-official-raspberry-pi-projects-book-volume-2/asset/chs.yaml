  电机必须非常小，齿轮恰到好处，并且足够强劲


  LED 在循线程序中闪烁两次，在接近测试中闪烁三次，而四次和五次闪烁分别会退出脚本并关闭 Pi


  “它由一个大号火柴盒、两个微型齿轮电机、车轮以及其余部分（电机驱动器、传感器和电池盒）主要来自 CamJam EduKit 3 组成。还有一个 5V 稳压器，这样它就可以使用电机电池为
  Pi 供电。”除了电动轮之外，Matchbot 还配备了超声波测距传感器和循线传感器。把机器人装进火柴盒本身就是一项壮举。然而，Matchbot 的控制界面别出心裁——由于没有
  WiFi 远程连接，Mark 编程让测距传感器根据你把手放在它前面停留的时间长短来切换模式，闪烁的 LED 会提示你激活了哪种模式。在 Pi Wars 当天，它处理循线赛道非常出色！



