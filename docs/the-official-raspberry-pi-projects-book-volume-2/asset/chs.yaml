  \n### 树莓派儿童版\n作者: Richard Wentk\n出版社: Wiley\n价格: £21.99\nISBN: 978-1119049517\n\
  bit.ly/1K7C41E\n\n![](img/d8322379620245fcd21eccc3855b8c78_191_3.png)\n\n节奏良好的入门，从设置到编程和调试，沿途掌握命令行技能。有趣的软件项目——如\
  \ Turtles 和 Minecraft（都用 Python 控制）、简单且动态的网站，以及使用网络摄像头——介绍了许多有用的计算技能。考虑到目标受众，必然的设置章节既必要又恰到好处，提供了有关电缆和其他信息等细节，使年轻创客无需成人帮助即可开始。\n\
  \n忽略“儿童版”品牌，这本书对任何渴望获得树莓派启蒙的紧张成人电脑用户来说都是宝贵的起点。从命令行和 nano，到 Python、选择 Web 服务器和学习编程技能，Wentk\
  \ 使用 Raspbian 进行介绍和教学。他以清晰的风格、温和的幽默以及让每个学习挑战变得易于接近的能力来做到这一点。\n\nPHP 可能正在失去光泽，但它提供了处理数据的最快入门，随后用于运行\
  \ shell 和 Python 命令。在 PHP 中运行 webcam.py 然后引出调试 Web 问题、修复 Unix 文件权限以及测试你的软件——所有这些都是在完成本书后扩展知识所必备的技能。\n\
  \n![](img/d8322379620245fcd21eccc3855b8c78_191_4.png)\n\n### Python 函数式编程\n作者: David\
  \ Mertz\n出版社: O'Reilly\n价格: Free PDF download\noreil.ly/1KcIHgo\n\n![](img/d8322379620245fcd21eccc3855b8c78_191_5.png)\n\
  \n函数式编程“关心要计算什么而不是如何计算”，更倾向于表达式求值而非语句，并将函数视为一等对象（你可以像传递数据一样将一个函数传递给另一个函数）。Python\
  \ 尽管不是函数式编程语言，却是“一种多范式语言，能在需要时轻松进行函数式编程，并易于与其他编程风格混合”。从第一章《（避免）流程控制》开始，作者（Python\
  \ 软件基金会董事兼业余哲学家）就提供了从命令式示例中微妙改动而来的代码，这些改动不会让你感到不安，但会温和地作用于你的大脑，累积起来有助于将焦点从“如何”转移到“什么”。\n\
  \n> “仅仅改变表达形式就能在我们推理代码的方式和理解的难易程度上产生惊人的巨大差异，”Mertz 说，他使用列表推导式、生成器以及字典和集合来抽象“如何”并重新组织我们对数据的思考，逐步推进到惰性求值和高阶函数（那些调用或生成其他函数的函数）。\n\
  \n对于所有希望超越 OOP 的 Python 爱好者来说，这是一本良好、快速的入门书。\n\n![](img/d8322379620245fcd21eccc3855b8c78_191_6.png)\n\
