  “嗯，”马特沉思道，“这其实不是一个坏主意。我认为 Sniffur 从可视化角度来看很有趣，但从实用角度来看，更主动的东西可能更好。”


  ## 项目


  ## 展示


  输入 Blender 的高程数据确保了乞力马扎罗山的准确表现，带有详细的等高线


  ## 柯特·亨特


  柯特将数十年的高科技经验与对高山攀登的热情相结合，联合创立了 Madison Mountaineering，并开发了自己的基于网络的 RainOn 跟踪解决方案。

  rainon.com

  magpi.cc/2dUhfSP


  七个 LED 中的每一个都标记了营地或山顶的位置，并在攀登者接近该点时亮起


  Raspberry Pi 和所有线缆完全封闭在模型内部，该模型在打印后被掏空


  模型后部设有电源和以太网端口的开口，通过延长线缆连接到 Pi


  ### 快速事实


  - 其峰顶海拔 5,895 米，乞力马扎罗山是非洲最高的山峰

  - 创建了两个模型：一个用于柯特的家，另一个用于他的办公室窗户

  - 使用的比例为 1:100,000，因此模型上的 10 毫米相当于 1 公里

  - 柯特之前的登山经历包括阿空加瓜山和丹奈利山

  - 他还在 2014 年的一次大型远征中担任珠穆朗玛峰大本营经理


  ## 位置跟踪山地模型


  当柯特·亨特想要创建一个智能 3D 模型来向家人和同事展示他在攀登乞力马扎罗山时的进展时，他转向了 Raspberry Pi


  一个 LED 在华盛顿州美国厨房柜台上放置的比例模型上亮起，以表示在 9,000 多英里外的坦桑尼亚，柯特·亨特已登上乞力马扎罗山的山顶。攀登非洲最高峰一直是柯特长期以来的抱负。“自从
  20 年前搬到西雅图后，我就会抬头望向雷尼尔山并梦想攀登它，”他告诉我们。“在 2004 年让自己进入状态后，我确实攀登了它并爱上了攀登。那一年我设定了攀登乞力马扎罗山的目标，但直到
  [2015] 才实现。”


  在为期两周的远征准备期间，柯特给自己设定了另一个挑战。他希望以一种有趣的方式结合自己对 3D 打印和编程的热情，以便家人和同事能够以一种有趣、视觉化的体验跟随他的攀登。为此，他着手创建了一个由
  Raspberry Pi 2 驱动的 1:100,000 比例的乞力马扎罗山模型，上面配有 LED 来标记他所有计划的营地以及山顶本身。位置数据将由个人 GPS
  定位设备通过他自己的基于网络的 RainOn 跟踪解决方案提供。


  ### 模型制作


  柯特花了一个周末在 Blender CAD 程序中设计 3D 模型，使用从 Viewfinder Panoramas 获取的乞力马扎罗山精确高程数据（magpi.cc/1Sd7psw）——有关该技术的教程请参阅
  magpi.cc/1J0osv3——并计算出 LED 所需表面孔洞的物理偏移量。模型需要足够高以容纳安装在可拆卸底座面板上的 Raspberry Pi，并包括其电源和以太网连接的开口（通过延长线缆）。最终


  ![](img/d8322379620245fcd21eccc3855b8c78_65_0.png)


  ![](img/d8322379620245fcd21eccc3855b8c78_65_1.png)


  ![](img/d8322379620245fcd21eccc3855b8c78_65_2.png)




  ## 定位追踪山地模型


  150×150毫米的模型随后使用 PrintrBot Metal Simple 进行3D打印，整个过程耗时26.5小时完成。


  一旦支撑脚手架被移除以掏空模型，就轮到布线了。“最大的劳动部分是将单个LED和电阻焊接到GPIO排线缆上，”Kurt透露。“LED通过摩擦和硅胶密封剂固定在模型上。”虽然他没有遇到任何让其工作起来时出现的主要问题，因为他已经用面包板制作了一个简单的原型，Kurt确实发现了Windows
  IoT Core和Raspbian上GPIO引脚分配之间的差异。


  “本质上，系统从个人定位设备（如DeLorme inReach或SPOT）获取实时位置数据，用于预先安排的‘行程’，例如乞力马扎罗探险。然后它提供基于地理围栏的航点接近通知，以及其他功能。”


  每次旅行都是目标（通常是山峰的纬度/经度）、路线（可以包括航点列表）以及开始和结束日期/时间组合。“系统轮询个人定位设备制造商的服务，并检索分配给活跃旅行的每个设备最后报告的位置。该检索到的位置会针对与旅行相关的一组注册航点的地理围栏进行测试。”


  ## 行程追踪


  在为项目开发Pi代码时，Kurt渴望将他为之前的冒险开发的RainOn Adventure Tech (rainon.com)基于网络的追踪系统作为Microsoft
  Azure进行演进


  行程和航点信息是提前创建的。“例如，我们攀登的Machame路线上的乞力马扎罗有六个营地（固定位置）和山顶，加上起点和终点，因此该行程有九个相关航点，其中七个在我3D模型上。所有数据都存储在SQL
  Server数据库中，该数据库还支持空间数据，因此地理围栏测试和其他地理空间计算超级容易。”


  主要基于Microsoft的Blinky示例代码（magpi.cc/1nd0kcN），Kurt的程序每十分钟调用一次RainOn Azure服务API以获取JSON位置数据。如果该位置在设定的200米半径地理围栏内，针对其中一个营地或山顶，对应的LED就会点亮。


