- "## SLACKTIVITY MONITOR\n\n使用此 LED 显示屏跟踪 Slack 聊天活动。你可以一目了然地知道是否有安静、轻度聊天或喧闹的争论\n\
  \n为了在 Raspberry Pi 基金会内部进行沟通，我们使用 Slack，这是一种类似 IRC 的聊天服务。活动可能非常多，人们花了时间来调整通知设置。但我们想要的不仅仅是\
  \ Slack 通知所能提供的。我们希望能够一目了然地看到同事之间有多少聊天。幸运的是，Slack 的 API 和 Python 库功能强大且易于使用。组装简单，材料\
  \ inexpensive，尤其是在使用 Pi Zero 的情况下。\n\n## Initial configuration\n\n要设置自己的 Slacktivity\
  \ Monitor，请从全新的 Raspbian 安装开始。对于 Raspberry Pi Zero，你需要使用 Raspbian Jessie，可以在 NOOBS\
  \ 上找到，或使用 Raspberry Pi 下载页面上的映像写入 SD 卡（raspberrypi.org/downloads）。与其它 Raspberry\
  \ Pi Zero 项目一样，最简单的方法可能是先用 Raspberry Pi 2 或 B+ 配置和安装所有内容，然后在准备好后将 microSD 卡移到 Pi\
  \ Zero。确保通过进入终端并使用以下命令进行必要的更新：\n\n```\nsudo apt-get update\nsudo apt-get upgrade\n\
  ```\n\n你需要设置一些基本配置选项。从桌面进入偏好设置菜单中的 Raspberry Pi 配置。在系统选项卡下，将 Pi 设置为启动到 CLI（命令行界面）并启用“等待网络”。你也可以使用命令行实用程序\
  \ raspi-config 设置这些选项。确保你也已配置 Pi 连接到你的 WiFi 网络。或者，你可以使用 USB 以太网适配器与 Pi Zero 配合使用。\n\
  \n## 所需材料\n- Pi Traffic Light magpi.cc/1VamjoL\n- WiFi 适配器\n- 直角排针\n- 焊接烙铁和焊锡\n\
  - Blu-Tack 或 Command Strips\n\n![](img/d8322379620245fcd21eccc3855b8c78_155_0.png)\n\
  \n使用最适合你所需配置的排针类型\n\n来自 Low Voltage Labs 的 Pi Traffic Light 使连接三个 LED 变得简单\n\nCommand\
  \ Strips 是临时将项目精确安装在你想要的位置的绝佳方式\n\n![](img/d8322379620245fcd21eccc3855b8c78_155_1.png)\n\
  \nSlacktivity Monitor 足够小巧轻便，可以用 Blu-Tack 或 Command Strips 安装到显示器上。\n\n## Software\
  \ setup\n\n从命令行下载 Python Slack 客户端库：\n\n```\nsudo pip install slackclient\n```\n\
  \n下载项目代码：\n\n```\ngit clone https://github.com/mrichardson23/slacktivity-monitor.git\n\
  ```\n\n你需要在项目代码中使用自己的 Slack API 令牌，以便 Slacktivity Monitor 可以验证自身身份。登录 Slack 后，前往\
  \ magpi.cc/1Vai8OF 并为你要监控的用户和团队点击创建令牌。将该令牌代码复制到你的代码中，替换文本 SLACK TOKEN HERE。\n\n\
  代码跟踪大约最近一分钟的活动。如果在此期间没有发送消息，则红色 LED 会点亮。如果在最近一分钟内有消息（但少于 15 条），则黄色 LED 会点亮。如果在最近一分钟内发送了\
  \ 15 条或更多消息，LED 将变绿。你可能需要根据 Slack 团队的典型活动水平调整此阈值。\n\n设置脚本在启动时运行。从命令行执行：\n\n```\n\
  sudo nano /etc/rc.local\n```\n\n在 exit 0 行之前，添加一行以启动你的代码：\n\n```\npython /home/pi/slacktivity-monitor/main.py\
  \ &\n```\n\n![](img/d8322379620245fcd21eccc3855b8c78_156_0.png)\n\n为了将 Pi Traffic\
  \ Light 连接到 Raspberry Pi Zero，你需要焊接排针。\n\n完成后，保存文件并关闭 Pi，以便你可以焊接排针、添加 Pi Traffic\
  \ Light 并将其安装在需要的位置。\n\n## Physical build\n\n在 Pi Zero 上焊接排针并将 Pi Traffic Light\
  \ 连接到这些引脚。代码使用 15 号引脚用于红色，14 号引脚用于黄色，28 号引脚用于绿色。这是因为它们都与一个接地引脚相邻，所以 Pi Traffic Light\
  \ 可以直接插入排针并完美工作。根据你希望如何布置 Slacktivity Monitor，你可能想要更改引脚编号和颜色。\n\n使用 Blu-Tack 或 Command\
  \ Strips 将 Slacktivity Monitor 固定到你的显示器上。\n\n当你为 Pi 通电时，脚本应自动启动并连接到你团队的 Slack 实例。即使没有最近的活动，你最初也可能会看到交通灯变黄，因为当新客户端连接时，Slack\
  \ API 会返回最近的消息。\n\n## Going further\n\n代码忽略除消息之外的所有内容，因此你也可以调整 Slacktivity Monitor\
  \ 以对不同类型的事件做出反应。例如，你可以使用红灯指示你的老板离线，黄灯指示她处于空闲状态，绿灯指示她处于活动状态。\n\n## Main.py\n\n```\n\
  import time\nfrom slackclient import SlackClient\nfrom gpiozero import LED\n\ntoken\
  \ = \"SLACK TOKEN HERE\" # found at\n### https://api.slack.com/web###authentication\n\
  \nred = LED(15)\nyellow = LED(14)\ngreen = LED(18)\n\nred.off()\nyellow.off()\n\
  green.off()\n\nsc = SlackClient(token)\n\nmessage_counts =[]\n\nif sc.rtm_connect():\n\
  \    while True:\n        message_count = 0\n        events = sc.rtm_read()\n  \
  \      for event in events:\n            if event['type'] == 'message':\n      \
  \          message_count = message_count + 1\n                message_counts.insert(0,\
  \ message_count)\n\n            if len(message_counts) > 600:\n                message_counts.pop(600)\n\
  \                total_message_count = 0\n\n            for i in range(0,len(message_counts)):\n\
  \                total_message_count = total_message_count + message_counts[i]\n\
  \n            if total_message_count == 0:\n                red.on()\n         \
  \       yellow.off()\n                green.off()\n\n            if total_message_count\
  \ > 0 and total_message_count < 15:\n                red.off()\n               \
  \ yellow.on()\n                green.off()\n\n            if total_message_count\
  \ >= 15:\n                red.off()\n                yellow.off()\n            \
  \    green.on()\n\n            time.sleep(.1)\nelse:\n    print \"Error. Invalid\
  \ token?\"\n```\n\n\n\n![](img/d8322379620245fcd21eccc3855b8c78_157_0.png)\n\nPi\
  \ Zero 轻松就能放入手柄中，所以即使它也能看起来像那么回事\n\n泳池泡沫棒让这把武器比一些玩具更安全、更结实\n\n除了发光的剑刃，你还可以在点火按钮上方有一个自定义显示屏\n"
- '## PI-SABER


  原力与 Pi Zero 同在，那么何不用它来为你自己的 Pi-Saber 供电呢？


  ### 所需材料

  - Adafruit 双色 8×8 LED 矩阵 magpi.cc/1ZMEBM4

  - 一个大按钮 magpi.cc/1ZMEGPM

  - 电池供电的 3v LED 圣诞灯

  - Adafruit ADXL345 三轴加速度计 magpi.cc/1ZMEMHh

  - 一个游泳泡沫棒/泳池圈

  - 一个充电宝

  - 焊接工具套件、跳线和洞洞板

  - 一些胶水、美工刀、胶带和一些魔术贴条


  重现你最喜欢的绝地武士对战非常有趣，但许多玩具光剑都相当脆弱。这款 Pi-Saber 应该足够坚固，能够承受一些充满活力的重现。产生启动效果的 LED 在 Pi-Saber
  挥舞时亮度也会波动，以最大化兴奋感。我们假设你已连接了 GPIO 接口。然而，为了更坚固的 Pi-Saber，你可以直接将每个连接焊接到 Pi Zero 上。


  ```

  sudo apt-get install git python-pip python-dev python-imaging python-smbus

  sudo pip install gpiozero

  ```


  现在安装并测试加速度计。我们假设你有一个 ADXL345，但有一些替代品在稍作修改后也能工作。首先，安装这个方便的 Python 库：


  ```

  git clone https://github.com/pimoroni/adxl345-python.git

  sudo cp adxl345-python/adxl345.py /usr/local/lib/python2.7/dist-packages/

  ```


  加速度计使用 I²C 总线，因此你需要进入 Raspberry Pi 配置程序并从高级选项中选择“启用 I2C”选项。重新启动后，如图 1 所示将加速度计连接到
  Pi。进入 adxl345 目录并运行：


  ```

  python example.py

  ```


  晃动加速度计并验证 x、y 和 z 的显示值是否相应变化。


  ### 学徒的光

  Pi-Saber 的手柄上会有炫酷的显示屏，按下主按钮时也会亮起。有很多不错的 Adafruit 8×8 LED 矩阵单元自带背包，可使 Python 控制变得简单。测试时，你只需通过面包板连接它们，但对于成品，你需要更稳健的方法。一个简单的选择是使用一块小洞洞板，直接焊接导线或使用公头排针。像往常一样，LED
  矩阵有一个很棒的 Python 库：


  ```

  git clone https://github.com/adafruit/Adafruit_Python_LED_Backpack.git

  ```


  然后进入该目录并运行安装程序：


  ```

  sudo python setup.py install

  ```


  仓库中有几个示例脚本可用于测试。


  Pi-Saber 的其他 LED 组件将覆盖主轴。有很多选择，但圣诞灯是获得一串预接线、低功耗 LED 的绝佳且廉价的方式。显然，LED 越多，Pi-Saber
  效果越震撼。然而，将每个灯安装到泡沫棒中可能相当繁琐耗时，因此 20 个灯串在美观和理智保持之间是一个不错的折中。就在电池座之前剪断导线，剥去绝缘层，并在每根导线末端加上母端跳线座。将它们连接到
  GPIO 上的 3V 和 GND 引脚并检查是否点亮。然后将一根导线从 3V 引脚切换到 GPIO 引脚 17。


  ### 帕达万的第一步

  首先，在 Pi Zero 上准备好 Raspbian，以便我们能正常使用 Python：


  加速度计使用 I²C 总线，因此你需要激活


  ### 绝地大师光剑

  Pi-Saber 的最后一个元素是一个漂亮的大开关按钮。制作一些带合适连接的导线，或直接焊接到按钮触点上。然后如图 1 所示将其连接到 Pi Zero 的 GPIO
  引脚（26 和其中一个 GND）。现在是时候把所有东西组装起来了。检查所有东西是否按 Fig 1 所示接线，然后通电


  ![](img/d8322379620245fcd21eccc3855b8c78_158_0.png)


  给 Pi 通电。下载 PySaber.py 代码（magpi.cc/1ZMFVi3），或将其输入到文本编辑器中并运行。


  ```

  sudo python PiSaber.py

  ```


  按下按钮之前不应该有任何反应：LED 矩阵应显示一个快速图案并


  > 按下按钮之前不应该有任何反应：LED 矩阵应显示一个快速图案然后开始‘闪烁’


  然后开始‘闪烁’。同时，灯串上的 LED 应该全部点亮。拿起加速度计，晃动它，你应该会看到剑身上的 LED 亮度波动。一旦一切正常工作，添加以下行：


  ```

  python /home/pi/PiSaber.py &

  ```


  ...到 /etc/rc.local 文件（“exit 0”行上方），以便 Pi 启动时代码会自动运行。


  现在将泡沫棒切成两半，然后像热狗面包一样纵向切开一半——不要切到底。测量你的泡沫棒并画草图，确定你的充电宝和按钮如何放入内部。弄清楚后，完全去除一半泡沫棒的相应部分，留下一个楔形。然后标记组件位置并切除那些泡沫块。顺便在剩余内侧泡沫棒上沿长度方向切出一条小沟槽用于
  LED 电缆。现在计算 LED 之间的间距，使其环绕均匀，然后将其穿入；先用肉签或类似物打些导孔。一旦所有东西就位且导线整齐，用胶水将切开的剑身沿长度方向粘合回去。用胶带覆盖手柄部件，然后用魔术贴将其绑紧。应该就这样了——现在你已准备好进行史诗般的战斗。


