  \n有一些很棒的书指导你通过框架和库构建数据科学项目，但 Grus 采取了不同的方法来教育对数据好奇的人：从头开始构建工具和实现算法，以阐明特定的要点，使你在完成本书后能更好地利用框架。这里没有\
  \ Python 3。然而，Python 2 非常好，值得坚持用于其他早期的数学课程。关于统计学、概率和线性代数的章节是对我们这些生疏的人的极佳复习，并为接下来要做的事情奠定了坚实的基础。\n\
  \n在涵盖了数学和编程之后——正如 Grus 所说，“做数据科学的原材料”——作者转向了处理数据的科学和艺术，展示了在进行建模和机器学习之前如何探索你所拥有的东西。Grus\
  \ 在必要时深入细节，但在其他情况下信任读者自行查阅参考资料。在所有情况下，这本书都应该能造就更好的数据科学家。\n\n在介绍数据科学之后，我们开始进行 Python\
