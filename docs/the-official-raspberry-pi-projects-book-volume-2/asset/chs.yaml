  ### >STEP-01

  ### Set it up

  你需要穿上完整的避难所服装并配有腰带来容纳 Raspberry Pi，以便将 Pip-Boy 屏幕插入其中，并将 Pi 连接到电源。


  ### >STEP-02

  ### Boot it up

  你可以在扮演角色并前往展会现场展示你完全功能正常的 Pip-Boy 时，欣赏自定义启动信息。


  ### >STEP-03

  ### Show it off

  自定义界面，可从 bitbucket.org/selectnone/raspipboy 获取，具有许多可向感兴趣的人展示的功能：GPS、VATS 模拟器和 Wi-Fi
  信号强度监视器。


  我们用划痕和其他磨损对其进行了细化，使其看起来像使用过的型号。我知道整套服装需要分开。太多人离拥有一个可工作的 Pip-Boy 很近，却在说无法将所有东西装进去时卡住了！我拿了一件机械师连体服，并在背面加上了
  101 标志以及其他细节……我还使用了旧的军用剩余腰带，上面有很多隔间作为服装的一部分，并在服装上开了一个孔，以便所有布线都可以从腰带经过后背通向 Pip-Boy。


  构建中最困难且几乎是最后的部分是屏幕。我最终使用了一块来自 Adafruit 的 3.5 英寸 TFT。顶部边框的下垂方式以及安装屏幕的方式意味着要将其放在覆盖所有内容的东西上，以便边框后面的唇部。然后之后，我必须在屏幕顶部放一块玻璃并将其非常轻微地（但不要太轻）粘在屏幕周围。任何错误你都必须更换新屏幕，因为要么你会将其粘得偏离中心，要么你会粘太多。


  ![](img/d8322379620245fcd21eccc3855b8c78_28_3.png)

  > 我总共大约花了 70 小时在这上面，其中很多只是研究


  “接下来是让 Pip-Boy 在启动时进入略微调整过的‘操作系统’，这相当简单。我最终编辑了代码，使‘BIOS’等有不同的启动信息，以使其更完整，但我没有过多地修改软件。


  由于 Jesse 之前没有做过太多编程，修改和设置对他来说有点棘手，但正如你所见，最后他还是完成了项目并带着一台漂亮的 Raspberry Pi 驱动的手腕电脑四处走动。


