  ## RPIKIDS


  不是一部衍生周六早晨卡通片，RPiKids 是为 Adrian Atwood 的孩子们打造的全新娱乐系统


  我们都见过为孩子娱乐而设的古怪家长控制方法。我们最喜欢的是为 PlayStation 供电的健身自行车，这可能看起来很残酷，但至少意味着他们能玩多久有一个截止点。最好的方法仍然是最简单的：一个密钥代码和一个计时器，这样孩子们就可以做些其他事情，而不是整天盯着屏幕，从而腾出电视让你可以一口气看完《童话镇》第三季。随着树莓派成为运行娱乐中心更强大的选择，难免会有勇敢的黑客为自己的孩子制作终极版本。认识一下
  RPiKids，由 Adrian Atwood 创建。


  “RPiKids is an all-in-one kids’ entertainment centre with integrated parental control
  features,” Adrian explains. “My kids can enjoy 16-bit games, watch movies and more,
  provided an adult has granted them access by entering a password and setting the
  timer.”


  RPiKids 是一种硬件组合；系统本身由树莓派供电，负责娱乐方面的 Kodi、Emulation Station 等。密码和计时器由 Arduino Uno
  使用旋转编码器处理（想想银行保险箱），它可以作为按钮按下以确认选择。所有这些都内置在一个外观精美、蒸汽朋克风格的机箱中，由 Adrian 本人手工用木材制作，并配有
  3D 打印细节。


  前面有 USB 访问端口用于连接控制器和便携式媒体存储，硬件可见于可拆卸的透明 Perspex 面板后面。虽然一切看起来都非常令人印象深刻，但 Adrian 声称整体构建水平为“中级”。


  “I will say the Raspberry Pi configuration was very straightforward and a beginner
  can mirror my configuration,” he tells us. “Coding the firmware for the Arduino
  parental controls, and having the Arduino and Pi 2 communicate with each other,
  was a little more complex. The case is no problem if you’re into woodworking and
  auto body repair. I have access to a 3D printer and laser cutter and enjoy CAD modelling,
  but those parts could be contracted out or replaced.”


  ### ENTERTAINING THE KIDS


  驱动中心的设备都可以通过这块 Perspex 板看到——便于维护和好奇心强的孩子们观察


  ![](img/d8322379620245fcd21eccc3855b8c78_58_0.png)


  ![](img/d8322379620245fcd21eccc3855b8c78_58_1.png)


  ### >STEP-01 Dial it up


  使用数字编码器和 NeoPixel LED 环，用户（家长）输入组合来解锁系统，以便孩子使用。


  ![](img/d8322379620245fcd21eccc3855b8c78_58_2.png)


  ### >STEP-02 Set a time


  解锁后，编码器可用于在系统上设置计时器，从十分钟到无限期。一旦选择，Arduino 就会让树莓派开机。


  ![](img/d8322379620245fcd21eccc3855b8c78_58_3.png)


  ### >STEP-03 Shut it down


  时间用完时（或按下关机按钮时），Arduino 部分会向 Pi 发出关机命令。Pi 然后安全地关闭所有设备，Arduino 稍后会切断电源。


  > RPiKids 是一个集成了家长控制功能的一体化儿童娱乐中心


  虽然他预计会出现“各种”故障，但该系统对他和他的孩子们来说工作得非常好，只需要对与编码器一起使用的 NeoPixel 环的亮度进行少量调整。


  One thing Adrian recommends for anyone trying to replicate the project is an upgrade
  to the sound output: “The Pi definitely needed a DAC (I²S) sound card because there
  was a lot of hissing and artifacts with the onboard sound.”


  孩子们非常喜欢它。虽然它是一个娱乐中心，但他还在锁机制中编程了一个有意的 安全漏洞，希望他的孩子们能从中学习到有关安全系统的知识。我们祝他们好运，希望他们能弄清楚如何解锁“无限模式”！




