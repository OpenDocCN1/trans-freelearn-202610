- "## 使用 Skywriter 进行魔术演示\n\n使用 Skywriter HAT 用令人费解的魔术力量或原力的掌控让你的观众惊叹\n\n## RICHARD\
  \ HAYLER\n\nRichard 是 CoderDojo Ham 的导师。他的学校 CodeClub 是 Primary School Astro Pi\
  \ 竞赛的获胜团队之一。magpi.cc/1ILmeoi coderdojoham.org\n\n![](img/d8322379620245fcd21eccc3855b8c78_119_0.png)\n\
  \n## 你需要\n\n- Skywriter HAT 或板子商店。pimoroni.com\n- Skywriter API 库 magpi.cc/2dXntBn\n\
  - Python AutoPy 库 magpi.cc/2dXmbpZ\n- LibreOffice Impress libreoffice.org\n\n下方\
  \ 如果需要，你可以使用更长的线或排线将 Skywriter 板远离 Pi\n\n说实话：仅仅使用树莓派来运行你的演讲幻灯片就会让观众觉得你很酷。但如果这还不够令人印象深刻，为什么不进一步用你的意念移动能力翻阅演示文稿并通过在空中绘画来注释幻灯片呢？你甚至不需要是霍格沃茨或绝地学院的毕业生：只要拥有一台\
  \ Skywriter 设备和一些简单的 Python，你就可以开始了。Skywriter 设备使用一排发射电极生成在三维空间中传播的电场。当你将手移动到 Skywriter\
  \ 上方时，它会扰乱该场，这些变化会被接收电极网格检测到。这些测量值可用于计算你的手的位置和移动方向。\n\n### >STEP-01\n连接 Skywriter\
  \ 设备\n\n如果你有 Skywriter HAT，它就像其他 HAT 一样直接连接到 GPIO 引脚上。如果你有更大的 Skywriter 板，你需要将六个\
  \ GPIO 引脚连接到顶部的对应引脚上，如下图所示。\n\n![](img/d8322379620245fcd21eccc3855b8c78_119_1.png)\n\
  \n### >STEP-02\n安装软件\n\n确保你拥有最新版本的 Raspbian，并安装了所有更新。像往常一样，那些乐于助人的 Pimoroni 海盗提供了一个单一脚本来处理安装，包括完整的\
  \ Python API。像大多数 HAT 一样，Skywriter 需要 Pi 上的 I²C 总线启用，所以如果你尚未在 Pi 上激活它，你需要在 Skywriter\
  \ 工作前重新启动。\n\n```\ncurl -sSL get.pimoroni.com/skywriter | bash\n```\n\n你还需要 AutoPy\
  \ Python 库及其依赖项，因此使用以下命令安装这些：\n\n```\nsudo apt-get install libx11-dev libxtst-dev\n\
  ```\n\n...然后：\n\n```\nsudo pip install autopy\n```\n\n### >STEP-03\n测试你的 Skywriter\n\
  \nPython API 提供了示例脚本来帮助你熟悉 Skywriter 的工作原理：\n\n```\ncd Pimoroni/skywriter\nsudo\
  \ python test.py\n```\n\n现在在 Skywriter 上方轻轻挥动手臂。你应该会看到三列滚动数字，对应于设备上方三轴（x/y/z）盒子中手的位置。Python\
  \ 库预先配置为识别某些手势：轻扫（在 Skywriter 上滑动）、轻触或触摸（将手降至表面上方一点），以及最棘手的 Airwheel（在 Skywriter\
  \ 上方以圆形模式摆动手指）。需要一段时间才能掌握\n\n为了让这些手势始终被检测到，请花一些时间练习。你可以编辑 test.py 脚本并注释掉 @skywriter.move()\
  \ 函数（它会显示 x/y/z 数字），以便更容易看到你是否掌握了其中一个手势。\n\n## >STEP-04\n### 配置你的演示软件\n\n现在是准备你的演示软件的时候了。LibreOffice\
  \ Impress 与 Microsoft PowerPoint 非常相似，在 Raspberry Pi 上运行良好。如果不需要 LibreOffice 套件中的其他应用程序，你只需使用以下命令安装\
  \ Impress 和核心组件：\n\n```\nsudo apt-get install libreoffice-impress\n```\n\n你将使用 Python\
  \ 代码通过 Skywriter 检测手势并生成键盘敲击来以正常方式控制 Impress。唯一额外的配置是激活允许你用鼠标在幻灯片上绘图的功能。这可以通过选择\
  \ Slide Show>Slide Show Settings 并勾选 ‘Mouse pointer as pen’ 复选框来完成。\n\n## >STEP-05\n\
  ### 使用代码\n\n键入右侧列表中的代码并将其保存为 magic_control.py。你可以使用 IDLE 或你选择的任何其他文本编辑器来完成此操作。启动\
  \ LibreOffice Impress 并打开你的演示文稿。然后最小化 Impress 并通过 Idle 或通过命令行运行你的代码：\n\n```\nsudo\
  \ python magic_control.py\n```\n\n现在切换回 Impress 并准备开始你的演讲或演示。\n\n## >STEP-06\n###\
  \ 惊艳你的观众\n\n通过在 Skywriter 上向上滑动开始幻灯片放映。你可以通过左右滑动（向前）或右向左滑动（向后）在幻灯片之间导航。要结束演示，请在\
  \ Skywriter 上向下滑动。\n\n要注释幻灯片，你需要激活绘图功能。使用 tap/touch 来完成此操作：现在你将用手部动作控制鼠标，在屏幕上留下痕迹，就像用笔绘画一样。这需要练习，所以请确保你提前花了一些时间准备！绘图完成后，再次\
  \ tap/touch 以解除笔功能。\n\n我们都知道，在现场表演的压力下，事情可能会出错。如果你想快速禁用 Skywriter 对演示的控制，请使用双击退出\
  \ Python 程序。\n\n## Magic_Control.py\n\n语言\n>PYTHON\n下载:\nmagpi.cc/\n2dXnBko\n\n\
  ```python\n#!/usr/bin/env python\nimport skywriter\nimport signal\nimport autopy\n\
  import sys\n\nmouse_down = False\n#work out how big the screen we're using is.\n\
  width, height = autopy.screen.get_size()\n\n@skywriter.move()\ndef move(x, y, z):\n\
  \    #print( x, y, z )\n    global mouse_down\n    if mouse_down: # Only run if\
  \ we're in drawing mode\n        x = (x) * width\n        y = (y) * height\n   \
  \     # scale to screen size\n        x = int(x)\n        y = height - int(y)\n\n\
  \        if( y > 799 ):\n            y = 799\n\n        autopy.mouse.move(x, y)\n\
  \        #print( int(x), int(y) )\n\n@skywriter.flick()\ndef flick(start, finish):\n\
  \    print('Got a flick!', start, finish)\n    if start == \"east\":  # Back through\
  \ Impress slides\n        autopy.key.tap(autopy.key.K_LEFT)\n    if start == \"\
  west\":  # Forward through Impress slides\n        autopy.key.tap(autopy.key.K_RIGHT)\n\
  \    if start == \"north\": # Start slideshow\n        autopy.key.tap(autopy.key.K_F5)\n\
  \    if start == \"south\": # Quit slideshow\n        autopy.key.tap(autopy.key.K_ESCAPE)\n\
  \n@skywriter.double_tap()\ndef doubletap(position):\n    print('Double tap!', position)\n\
  \    sys.exit()  # Emergency stop\n\n@skywriter.tap()\ndef tap(position):\n    global\
  \ mouse_down\n    print('Tap!', position)\n    if mouse_down:  # Toggle mouse up/down\n\
  \        autopy.mouse.toggle(False)\n        mouse_down = False\n    else:\n   \
  \     autopy.mouse.toggle(True)\n        mouse_down = True\n\n#@skywriter.touch()\n\
  #def touch(position):\n###  print('Touch!', position)\n\nsignal.pause()\n```\n"
- "## 自制你的 Pi HAT\n\n有一些很棒的 HAT 可用于增强你的 Pi 的硬件功能。是否曾想过如何设计和构建一个原型 HAT？本教程将向你展示如何入门\n\
  \n### 你需要\n\n- 一个 EEPROM（推荐使用 CAT24C32）\n  magpi.cc/1RwAaQP\n- 一个面包板和一些跳线\n  magpi.cc/1RwAdMt\n\
  - 一些 LED\n  magpi.cc/1RwAiQi\n- Pi HAT 规范仓库\n  magpi.cc/10AHAgK\n\nRICHARD HAYLER\n\
  Richard 是 CoderDojo Ham 的导师，他的学校 CodeClub 是 Primary Astro Pi 竞赛的获胜队伍之一，他们的代码现在在国际空间站上。\n\
  magpi.cc/41Lmeoi\n@rdhayler\n\n![](img/d8322379620245fcd21eccc3855b8c78_121_0.png)\n\
  \n一旦准备就绪，就将所有组件焊接到原型 PCB 板上\n\n我们的简单 HAT 只有一个组件——一个 LED\n\n为了符合正式的 HAT 规范，板上必须有一个\
  \ EEPROM\n\nHAT 最早于 2014 年 Raspberry Pi Model B+ 发布时出现。从那时起，出现了一些令人惊叹和美妙的 HAT，其中许多已在《The\
  \ MagPi》的往期中出现：Unicorn HAT、Piano HAT、Sense HAT 和 Explorer HAT。官方上，HAT 代表 ‘Hardware\
  \ Attached on Top,’ 尽管你的专家怀疑这个缩写是在名字之后才出现的。你还能怎样称呼一块放在 Pi 顶部的扩展板呢？虽然你可以制造和销售不符合\
  \ HAT 标准的板子，但这样做有很多优点。具有相同的物理尺寸使得确保你的板子能够\n\n与大多数 Pi 外壳兼容，并且包含 EEPROM 允许操作系统在启动时识别\
  \ HAT 并设置任何所需的硬件。这些说明适用于最新版本的 Raspbian（Jessie）或旧的 Wheezy。如往常一样，开始前运行 sudo apt-get\
  \ update 和 sudo apt-get upgrade。然后使用以下命令启用内核对 I²C 的支持：\n\n```\nsudo raspi-config\n\
  ```\n\n选择 ‘Advanced Options’，然后向下点按并选择 ‘A7 I2C’。确保两个问题的答案都高亮显示为 ‘Yes’。或者，如果你使用的是\
  \ Jessie，也可以通过 GUI 中的 Raspberry Pi 配置工具进行设置。\n\n然后系统会提示你重新启动。Pi 重启后，使用以下命令安装 I²C\
  \ 工具包：\n\n```\nsudo apt-get install i2c-tools\n```\n\n现在是时候在面包板上构建你的 EEPROM 电路了。按照图\
  \ 1 所示组装电路。如果你没有使用 24C32，可能需要连接到 SDA 和 SCL 的不同引脚。检查你的 IC 的数据表以确保正确连接。你还需要为 HAT 提供一些功能：为了保持简单，图\
  \ 1 的电路只包含一个三色 RGB LED，但你可以根据想要 HAT 实现的功能使用任何你想要的组件。\n\n为 Pi 上电。你可能会注意到 LED 已经亮了（也许只是微弱地）。这是因为\
  \ Pi 不知道连接了什么，因此 GPIO 输出处于 ‘floating’ 状态。我们的 HAT 将通过预配置它使用的引脚来处理这个问题。下一页的代码片段（myoh-rgb.py）提供了与\
  \ LED 交互的简单 Python 代码；你需要安装出色的 gpiozero 库才能使用它。\n\n接下来，检查第二个 I²C 总线上检测到了哪些 I²C 设备：\n\
  \n```\ni2cdetect -y 1\n```\n\n![](img/d8322379620245fcd21eccc3855b8c78_122_0.png)\n\
  \n### 什么是 EEPROM？\n\nEEPROM 代表 'Electrically Erasable Programmable Read-Only Memory'\
  \ 并且是一种用于电子设备中存储少量数据的芯片。\n\n左侧 先在面包板或 Explorer HAT 上构建电路以确保其工作正常，以便你可以进行更改\n\n图\
  \ 1 EEPROM 应连接到 SDA 和 SCL 以进行编程。如果你没有使用 24C32，可能需要连接到不同的引脚（检查你的 IC 的数据表）\n\n![](img/d8322379620245fcd21eccc3855b8c78_122_1.png)\n\
  \n图 2 为了测试你的 HAT，请确保重新连接 EEPROM，使其连接到 ID_SC 和 ID_SD。你还需要添加两个上拉电阻\n\n![](img/d8322379620245fcd21eccc3855b8c78_122_2.png)\n\
  \n\n\n\n## 教程\n## 逐步操作\n## 静态警告！\n\nEEPROM 很容易被静电损坏，所以在处理它们之前请尽量使自己接地。理想情况下，佩戴防静电腕带，或者至少把那件尼龙毛衣留在衣柜里。\n\
  \n你应该会看到一个显示 I²C 总线上发现设备的表格。假设你没有连接其他东西，除了一个之外，其余条目都应为空，用两个破折号表示：- -。通常，你的 EEPROM\
  \ 应该在最左侧的列（0）中显示为数字 50，位于水平轴上的 50 旁边。如果看不到此内容或命令返回错误（‘No such file or directory’），请尝试另一个总线：\n\
  \n```\ni2cdetect -y 0\n```\n\n如果你的 EEPROM 仍然没有显示，请检查你的连接以及是否已启用 I²C 支持。现在你需要一些软件。从\
  \ GitHub 克隆 HATs 参考资料和工具（magpi.cc/10AHAgK）。阅读这份文档非常值得，因为它详细解释了 HAT 规范背后的思路。你还将使用便捷的\
  \ EEPROM 工具来刷新你的芯片。首先，编译 eepmake 工具：\n\n```\ncd hats/eepromutils\nmake\n```\n\n\
  然后修改 eepflash 脚本，该脚本假设 EEPROM 在第一个 I²C 总线上；如果你的也是，则可以明显跳过此步骤。复制 eepflash.sh 然后用你喜欢的文本编辑器修改：\n\
  \n```\ncp eepflash.sh eepflash1.sh\nnano eepflash1.sh\n```\n\n将所有 i2c-0 的提及更改为 i2c-1，并将\
  \ i2c-0/0-0050 更改为 i2c-1/1-0050，然后保存文件。现在你需要用自己的设置修改提供的模板。在你喜欢的编辑器中打开 eeprom_settings.txt\
  \ 文件并修改各个字段。大多数都是自解释的，你可以在规范中阅读有关每个字段的更多信息。然而，UUID 特别重要，必须符合 RFC 4122，以便每个 HAT 都能唯一标识，因此可以用作每块板的序列号。它还允许\
  \ HAT 堆叠。完成之后，你需要将可读的文本文件转换为可写入 EEPROM 的二进制数据。\n\n```\n./eepmake eeprom_settings.txt\
  \ eeptest.eep\n```\n\n然后将此数据转储到 EEPROM —— 这是实际的刷新操作，你会看到一个警告询问你是否确定要继续：\n\n```\n\
  ./eepflash1.sh -w -f=eeptest.eep -t=24c32\n```\n\n确保使用我们之前修改过的脚本版本。如果使用不同类型的 EEPROM，请相应更改\
  \ -t 参数。\n\n从面包板运行原型 —— 使用代码列表中的代码进行测试\n\n![](img/d8322379620245fcd21eccc3855b8c78_123_0.png)\n\
  \n![](img/d8322379620245fcd21eccc3855b8c78_124_0.png)\n\n更高级的一步。使用这里的规范焊接 GPIO 排针和其余组件：github.com/topshed/MYOH\n\
  \n![](img/d8322379620245fcd21eccc3855b8c78_124_1.png)\n\n将一些洞洞板切到适合覆盖 Pi 的 HAT 的正确尺寸\n\
  \n## myoh-rgb.py\n\n```\nfrom gpiozero import RGBLED\nfrom time import sleep\n\n\
  led = RGBLED(22,27,17)\n\nled.on()\nsleep(0.5)\nled.off()\nled.red = 1\nsleep(0.5)\n\
  led.red =0\nled.green=1\nsleep(0.5)\nled.green = 0\nled.blue = 1\nsleep(0.5)\nled.blue=0\n\
  ```\n\n语言\n>PYTHON 3\n下载：\nmagpi.cc/1RwC040\n\n要测试你的新作品，你需要修改电路，使 EEPROM 以 HAT 的一部分的方式连接到\
  \ Pi。GPIO 引脚 27 和 28 保留用于 HAT 检测，所以再次断电你的 Pi 并按图 2 所示移动相应的导线。然后添加 3.9kΩ 上拉电阻，以确保引脚不会‘浮空’。\n\
  \n现在重新连接到你的 Pi 并让它启动。如果一切正常，/proc/device-tree/hat 目录应存在，其文件的內容应与默认 eeprom_settings.txt\
  \ 文件中的详细信息相匹配。你还应看到 RGB LED 使用的 GPIO 引脚现在已被预设，因此它根本不应该亮。\n\n恭喜！你现在已经编程了一个 EEPROM，Pi\
  \ 识别其符合 HAT 规范。\n\n作为最终测试，运行 myoh-rgb.py 代码并检查 RGB LED 是否按颜色序列闪烁。显然，这是一个非常基础的 HAT；利用\
  \ Pi 预加载必要驱动程序的能力，有很多可能性可以轻松支持更复杂的硬件。Sense HAT 是这种技术的绝佳示例。\n\n现在你已经制作了一个简单的 HAT\
  \ 并掌握了流程，看看你还能创建哪些其他惊人的附加组件！\n\n如果你想完全遵循整个 HAT 设计流程，现在你可以选择从面包板过渡到真正的电路板。Raspberry\
  \ Pi 基金会的规范还设定了电路板的物理属性，直至圆角的半径和摄像头及显示器电缆插槽的包含。对于原型制作，你可能不必太担心这一点；本教程的 GitHub 仓库中提供了一个简单的洞洞板设计，并在主图像中显示。如果想更进一步，精彩的\
  \ Fritzing CAD 软件内置了 PCB 模板，可帮助你制作适合制造的最终设计。\n\n> 看看你还能创建哪些其他惊人的附加组件！\n\n## 教程\n\
  ## 逐步操作\n## 日常工程\n## 第 8 部分\n## 西蒙·蒙克\n\nSimon Monk 是《Raspberry Pi Cookbook》和《Programming\
  \ the Raspberry Pi: Getting Started with Python》等书籍的作者。\nsimonmonk.org\nmonkmakes.com\n\
  \n![](img/d8322379620245fcd21eccc3855b8c78_125_0.png)\n\n## 基于网络的"
- "## 植物浇水器\n\nAbove 浇水罐遇见物联网\n\n借助知名技术黑客和作者 Simon Monk，使用你的 Raspberry Pi 解决现实世界的电子和工程问题\n\
  \n## 你需要\n\n- 半尺寸面包板\n- 12V 蠕动泵\n- 2x 公对母跳线\n- 2x 公对公跳线\n- 1k 欧姆电阻\n- MPSA14 晶体管\
  \ (CPC: SC10647)\n- 1N4001 二极管\n- DC 圆插座转螺丝适配器 (CPC: CN19646)\n- 12V DC 1A 电源（仅为泵供电）\n\
  - 管子和接头\n\n本项目自动浇灌你的植物。你可以在室内在你不在时照顾室内植物，或与雨水桶和室外容器一起使用。\n界面用于通过本地网络甚至互联网控制你的浇水的持续时间和开始时间。\n\
  \n正如左侧所需组件列表所示，本项目使用面包板上构建的小电路，以及蠕动泵将水从雨水桶输送到容器。\n你可以在 eBay 上找到泵，从中国购买约需 6 英镑，从英国购买约需两倍价格。泵\
  \ intended 用于水族箱。它们消耗约 300mA，对于 2N3904 这样的老式常用晶体管来说有点太多了，因此改用可承受 1A 的 MPSA14 达林顿晶体管。\n\
  泵通常不带引线提供，所以你可能需要焊接引线。如果计划在室外使用泵，请将双芯音箱线或类似线材焊接到泵端子上；长度必须足够让你将泵放在室外，而 Raspberry\
  \ Pi 和其余电子设备在室内。\n泵需要自己的 12V DC 电源，即\n\n![](img/d8322379620245fcd21eccc3855b8c78_125_1.png)\n\
  \n## 构建项目\n\n这是一个相当直接的项目来构建。面包板上只有三个组件。除了电子元件外，你还需要找到一种方法将泵连接到水容器上，如果在露天，还需防止雨水进入泵。\n\
  \n## >STEP-01\n在泵上焊接引线\n\n钟线或音箱线都很好。为了更容易将松散的末端推入面包板，用焊锡将其镀锡，这样在尝试插入面包板时它们不会 bunch\
  \ up。\n\n![](img/d8322379620245fcd21eccc3855b8c78_126_0.png)\n\n## >STEP-02\n构建面包板\n\
  \n插入组件到面包板时，确保晶体管和二极管的方向正确。晶体管有一侧弯曲，应朝向左侧，二极管一端有条纹，需要朝向面包板顶部。电阻可以任意方向连接。为了防止电阻和二极管引线之间意外短路，最好缩短其中一个或两个引线。\n\
  \n![](img/d8322379620245fcd21eccc3855b8c78_126_1.png)\n\n## >STEP-03\n连接面包板\n\n\
  将公对公跳线连接到 barrel 插座适配器的螺丝端子。使用红色和黑色导线，并确保将红色导线连接到标记为 '+' 的螺丝端子。将跳线的另一端插入面包板。\n\n\
  泵电机的导线也应现在安装到面包板上，并使用母对公跳线将面包板连接到 Raspberry Pi GPIO 排针上的 GND 和 18。\n\n![](img/d8322379620245fcd21eccc3855b8c78_126_2.png)\n\
  \n![](img/d8322379620245fcd21eccc3855b8c78_126_3.png)\n\nAbove 通过浏览器控制浇水器\n\n使用\
  \ DC barrel 插座转螺丝适配器和两根公对公跳线连接到面包板。\n\n我们使用的管子和配件来自低成本超市的‘微型灌溉系统’。这包包含几米管子以及用于固定管道的小支架，和用于将泵连接到管子的完美小连接段。\n\
  \n面包板、跳线和电阻最好作为电子入门套件购买。Monk Makes Electronic Starter Kit for Raspberry Pi 包含这些零件。大多数\
  \ Raspberry Pi 入门套件都会包含面包板、跳线和一些电阻。\n\n![](img/d8322379620245fcd21eccc3855b8c78_126_4.png)\n\
  \nAbove 蠕动泵\n\n## 蠕动泵\n\n蠕动泵使用电机驱动齿轮箱，进而驱动一对滚轮挤压柔软但坚固的管道以推动水通过泵。\n\n这些泵的优点是‘自吸’。也就是说，在开始泵水之前你不需要排出进水管中的空气；它们最终会将水抽出。它们另一个优点是电机停止时有效地密封管道，即使水在一定压力下也不会流过。\n\
  \n## 构建你的浇水器\n\n与所有项目一样，最好在零件仍在工作区时测试项目并确保一切正常。一旦确认一切正常，你就可以将项目安装到最终位置。\n\n\n\n\
  ## STEP-04\n测试\n\n在安装项目之前，先使用两根短管连接到泵和两个玻璃杯，其中一个装有水来测试它。跳到软件部分并将开始时间设置为比当前时间提前一分钟。等待泵启动，然后确保它能将水从一个玻璃杯泵到另一个玻璃杯。这也能告诉你哪根管是入口，哪根是出口。\n\
  \n确保软管真的牢固地连接到泵上。如果有任何空气进入，泵将无法正常工作。\n\n![](img/d8322379620245fcd21eccc3855b8c78_127_0.png)\n\
  \n## STEP-05\n安装\n\n我们的示例设置是临时的。树莓派放在室内，泵的导线通过窗户引出。泵的进水管装在水桶盖下并伸入水中。出口管通向植物容器。\n\
  \n![](img/d8322379620245fcd21eccc3855b8c78_127_1.png)\n\n现在项目的硬件部分已完成，我们只需要让软件运行起来。程序用\
  \ Python 编写，并使用名为 Bottle 的库来提供该项目的 Web 服务器功能。如果你制作了《The MagPi》第 32 期和第 33 期的 Web\
  \ 门锁或青少年闹钟，你应该已经安装了 Bottle。如果没有，要安装 Bottle，请确保你的树莓派有互联网连接，然后运行以下命令：\n\n```\nsudo\
  \ apt-get update\nsudo apt-get install python-bottle\n```\n\n## Waterer_Server.py\n\
  \n```\nfrom bottle import route, run, template, request\nimport thread, time\nimport\
  \ RPi.GPIO as GPIO\nimport datetime\n\n### Change these for your setup.\nPUMP_PIN\
  \ = 18\n\n### Configure the GPIO pin\nGPIO.setmode(GPIO.BCM)\nGPIO.setup(PUMP_PIN,\
  \ GPIO.OUT)\nGPIO.output(PUMP_PIN, 0)\n\n### Global variables\nstart_time = \"22:00\"\
  \nduration = \"30\"\n\n### Handler for the home page\n@route('/')\ndef index():\n\
  ```\n\n你可以从树莓派命令行使用以下命令下载本项目的程序：\n\n```\ngit clone https://github.com/simonmonk/pi_magazine.git\n\
  ```\n\n要运行程序，请更改到项目代码所在的目录，然后使用以下命令运行程序：\n\n```\ncd /home/pi/pi_magazine/08_waterer\n\
  sudo python waterer_server.py\n```\n\n这将在你的树莓派上启动一个 Web 服务器。你可以通过在另一台计算机或手机上打开浏览器窗口并输入你的\
  \ Pi 的 IP 地址来检查这一点。打开终端并输入 ifconfig 来找到它。如果一切正常，将显示一个网页，邀请你输入浇水的开始时间和持续时间。\n\n##\
  \ 代码如何工作\n\n该程序的 Python 代码注释非常详细。在我们讲解时，将代码放在编辑器中会很有帮助。\n\n程序首先导入它需要的 Bottle、thread、time、RPi.GPIO\
  \ 和 datetime 库。常量 PUMP_PIN 用于指定用于控制泵的 GPIO 引脚。如果你想使用不同的引脚，请更改此值。\n\n使用了两个全局变量：start_time\
  \ 和 duration。变量 start_time 包含下一次浇水的时刻；其格式为包含小时（24 小时制）的两个数字的字符串，后跟冒号，再跟分钟的两个数字。duration\
  \ 是浇水应持续的分钟数。这两个变量都将通过项目的 Web 界面设置。\n\n```python\nglobal start_time, duration\n\
  ### Change the start_time and duration\n\nlocal_start_time = request.GET.get('start_time',\
  \ '')\nif local_start_time != \"\":\n    start_time = local_start_time\nlocal_duration\
  \ = request.GET.get('duration', '')\nif local_duration != \"\":\n    duration =\
  \ local_duration\nreturn template('home.tpl', start_time=start_time,\nduration=duration)\n\
  \ndef update(thread_name):\n    global start_time, duration\n    watering = False\n\
  \    end_timestamp = 0\n    while True:\n        # Get the time formatted as a string\
  \ for comparison\n        # with the alarm time\n        current_time = time.strftime(\"\
  %H:%M\")\n        # If its time to start watering, do so, but not if\n        #\
  \ you are already watering\n```\n\n```python\nif current_time == start_time \\\n\
  and not watering:\n    print(\"Starting Watering\")\n    watering = True\n    GPIO.output(PUMP_PIN,\
  \ 1)\n    end_timestamp = time.time() + int(duration) * 60\n### Check to see if\
  \ its time to stop watering\nif watering and time.time() > end_timestamp:\n    print(\"\
  End Watering\")\n    watering = False\n    GPIO.output(PUMP_PIN, 0)\n\ntime.sleep(1)\
  \ # allow other threads to run\n\n### start a separate thread to check the time\n\
  thread.start_new_thread(update, (\"update_thread\",))\n\n### Start the webserver\
  \ running on port 80\ntry:\n    run(host=\"0.0.0.0\", port=80)\nfinally:\n    print('Cleaning\
  \ up GPIO')\n    GPIO.cleanup()\n```\n\n由 start_new_thread 命令启动，这会导致 update 函数有效地独立于程序的其余部分运行。update\
  \ 函数将当前时间与开始时间进行比较，如果相同，则通过打开连接到泵的晶体管的 GPIO 引脚来启动浇水过程。\n\n> 由于这个 Python 程序主要充当 Web\
  \ 服务器，检查开始时间的代码在单独的执行线程中运行\n\n代码的下一部分提供 Web 界面。Bottle 使用 @route 指令来指示紧随其后的函数是 Web\
  \ 请求的处理程序。因此，默认路由页面 '/' 由名为 index 的函数处理。index 函数使用 Bottle 的模板机制返回包含在名为 home.tpl\
  \ 的模板文件中的 HTML。你可以在其代码目录中找到项目中使用的 HTML 模板（bit.ly/1NezVHT）。\n\n当你在网页上的开始时间和持续时间字段中输入值时，它们将在表单提交时作为参数传递。这些在\
  \ index 函数中提取，只要它们不为空（空字符串），就会用来设置 start_time 和 duration 的新值。\n\n由于这个 Python 程序主要充当\
  \ Web 服务器，检查开始时间的代码在单独的执行线程中运行。这个线程是\n\n程序的最后几行在端口 80 上启动 Web 服务器。try / finally\
  \ 子句用于在程序使用 CTRL+C 退出时将 GPIO 引脚设置回输入。\n\n## 使用你的浇水器\n\n你可以在计算机上使用 Web 浏览器，或在连接到\
  \ Wi-Fi 网络的智能手机上使用。因此，树莓派需要网络连接，这也允许 Pi 与互联网时间服务器同步。如果你发现你的树莓派时间相差一小时，则可能需要使用 raspi-config\
  \ 工具设置时区。\n\n如果你喜欢一点网页设计，你可能首先想做的是为网页添加一些样式。做到这一点的地方是模板文件 home.tpl。如果你精通网络，你也可以设置端口转发以允许从互联网访问浇水器。\n\
  \n## 教程\n\n## 逐步演示\n\n## 日常工程\n\n## 第 10 部分\n\n## 西蒙·蒙克\n\nSimon Monk 是《Raspberry\
  \ Pi Cookbook》和《Programming the Raspberry Pi: Getting Started with Python》等书籍的作者。\n\
  simonmonk.org\nmonkmakes.com\n\n![](img/d8322379620245fcd21eccc3855b8c78_129_0.png)\n\
  \nUSB WiFi 适配器\n\n一个精确的 DS18B20 温度传感器\n"
- "## 管道温度监测\n\n使用你的树莓派和著名技术黑客及作者 Simon Monk 的帮助解决现实世界的电子和工程问题\n\n## 你需要\n\n- 封装的\
  \ DS18B20（eBay、Adafruit、Proto Pic）\n- 47k 电阻（通常随 DS18B20 提供）\n- 三路螺丝端子排\n- 3x 母对公跳线\n\
  - USB WiFi 适配器\n- 小食品容器作为外壳\n- 电钻\n\n在这一年中，我们的阁楼空间可能会变得相当寒冷，如果那里有管道，就有可能结冰。正如任何把一瓶酒放进冰箱冷却然后忘记的人所知道的那样，冰占据的空间比水大，膨胀时可能会爆裂管道。这通常只有在冰再次融化时才会被发现，而你的卧室天花板上正滴着水。本项目监测你的管道温度，并使用\
  \ If This Then That（IFTTT）网络服务在温度低于你设定的阈值时通过电子邮件或其他你选择的机制提醒你。IFTTT 是一个网络服务，允许你设置触发器然后执行操作。例如，你可以创建一个\
  \ IFTTT‘配方’，在有人在 Twitter 上提到你时（触发器）向你发送电子邮件（操作）。除了各种社交媒体和电子邮件服务的动作和触发器外，IFTTT 还可以设置为与物理事件一起工作，例如温度传感器测量的温度低于某个阈值。\n\
  \n其工作原理是树莓派向 IFTTT 发送 Web 请求作为触发器，然后 IFTTT 执行你为其指定的任何操作。在这种情况下，触发器是发送电子邮件。IFTTT\
  \ 可用的各种渠道通常需要各自的登录，因此 IFTTT 有时会要求你为特定渠道输入用户名和密码。\n\n## 警告！\n\n不要仅依赖此项目来保护你的管道免受霜冻。此\
  \ DIY 项目旨在说明制作温度监测器的原理，绝不能保证保护你的房屋。\n\n\n\n![](img/d8322379620245fcd21eccc3855b8c78_130_0.png)\n\
  \n## 构建项目\n\n这是一个相当直接的项目来构建。无需焊接，不过如果你有烙铁，给传感器引线上的导线末端镀锡使其变粗一些，会更容易将其固定在端子块中。\n\n\
  ![](img/d8322379620245fcd21eccc3855b8c78_130_1.png)\n\n> DS18B20 是一款数字设备，精度为 ±0.5\
  \ 摄氏度\n\n如所需组件清单所示，本项目不需要任何焊接。温度探头的引线通过电气端子块和母对公跳线组合连接到 Raspberry Pi 的 GPIO 引脚。你可在任何销售电气用品的\
  \ DIY 或五金店找到螺钉端子块。\n\n## DS18B20 温度传感器\n\nDS18B20 是一款温度传感器芯片，有标准的三针类似晶体管的封装，或内置于带长引线的封装传感器中。在本项目中我们选择了封装版本，但你也可以在面包板上使用三针封装版本。该芯片需要在其数据引脚和正电源引脚之间连接一个\
  \ 4.7kΩ 电阻。芯片本身可使用 5V 或 3.3V 逻辑，但在使用 Raspberry Pi 时必须将正电源连接到 3.3V，以防止损坏所连接的 Pi GPIO\
  \ 引脚。温度传感器通常相当不准确，但 DS18B20 是一款数字设备，精度为 ±0.5 摄氏度。该 IC 使用 Raspberry Pi 上的单个 GPIO\
  \ 引脚，采用称为 1-wire 的接口。温度读数以串行数据发送到 Raspberry Pi。\n\n## 构建你的管道监控器\n\n与所有项目一样，在零件都放在工作台上时先进行测试并确保一切正常是个好主意。一旦确认一切正常，你就可以将项目安装到其外壳中。\n\
  \n### >STEP-01 连接母头引线\n\n将温度探头上的红色（正电源）、黑色（接地）和黄色（数据）导线插入螺钉端子，电阻的引脚置于红色和黄色导线之间。在拧紧螺钉端子之前，将导线的裸露末端缠绕在电阻引脚上可能会有所帮助。将跳线的公端插入端子块的另一半。你的探头引线可能还带有连接到引线屏蔽层的单独裸线连接器；你无需将其连接到任何东西。\n\
  \n![](img/d8322379620245fcd21eccc3855b8c78_130_2.png)\n\n### >STEP-02 连接温度传感器\n\n\
  将正电源引线连接到 3.3V GPIO 引脚，传感器的黑色接地引线连接到 GPIO 排针上的其中一个 GND 引脚，数据引线连接到 GPIO 4。使用 Raspberry\
  \ Leaf 等 GPIO 引脚模板可以更轻松地找到正确的引脚。我们使用了一个可容纳螺钉端子和 Raspberry Pi 的食品容器，并在其上钻了 USB 电源和传感器引线的孔。传感器引线上的结是为了防止连接被拉脱，而电工胶带则防止电阻引脚意外短路\
  \ GPIO 引脚上的任何东西。\n\n![](img/d8322379620245fcd21eccc3855b8c78_131_0.png)\n\n### >STEP-03\
  \ 在 IFTTT 中新建一个配方\n\n如果你还没有，先在 IFTTT（ifttt.com）上为自己创建一个账户。然后点击“创建配方”按钮。\n\n![](img/d8322379620245fcd21eccc3855b8c78_131_1.png)\n\
  \n### >STEP-04 创建 Maker Channel 触发器\n\n点击新配方的 IF 部分，并在显示的频道图标列表中搜索 Maker Channel。选择唯一可用的触发选项（接收网络请求），并在“事件名称”字段中输入文本\
  \ 'pipe_alert'。\n\n![](img/d8322379620245fcd21eccc3855b8c78_131_2.png)\n\n### >STEP-05\
  \ 选择一个操作\n\n现在进入 IFTTT 的 THAT 部分。点击 THAT 并选择 Email 操作频道，然后选择“发送邮件给我”。这将使用你在注册 IFTTT\
  \ 时指定的电子邮件地址。完成操作字段。\n\n“主题”字段将成为邮件主题，而正文字段将包含邮件的文本。注意 {{ 和 }} 之间包含的特殊名称。这些被称为“成分”，可让你自定义文本。在本例中，“OccurredAt”是触发事件发生时的时间戳，而“value1”将包含温度。\n\
  \n![](img/d8322379620245fcd21eccc3855b8c78_131_3.png)\n\n### >STEP-06 完成配方\n\n完成操作后，你将返回配方的摘要。点击“创建配方”按钮以实际创建配方并使其生效。\n\
  \n![](img/d8322379620245fcd21eccc3855b8c78_131_4.png)\n\n### >STEP-07 查找你的密钥\n\n\
  如果任何人都可以触发 IFTTT 发送邮件，可能会发生坏事。因此，当从 Python 发送网络请求以触发邮件时，必须附带一个密钥。\n\n要找到该密钥，请点击\
  \ IFTTT 网页顶部“频道”标签，然后找到 Maker 频道。过一会儿，你需要将密钥粘贴到你的 Python 程序中。\n\n这类项目你绝对希望使用 SSH，以便使用\
  \ WiFi USB 适配器远程连接到 Raspberry Pi。你可以在官方网站找到设置 Pi 使用 SSH 的说明：magpi.cc/1GULmTr。\n\n\
  在使用 DS18B20 温度传感器之前，你需要启用 Raspberry Pi 的 1-wire 接口。要启用 1-wire，请使用以下命令编辑文件 /boot/config.txt：\n\
  \n```\nsudo nano /boot/config.txt\n```\n\n在文件末尾添加以下行：\n\n```\ndtoverlay=w1-gpio\n\
  ```\n\n现在重启你的 Raspberry Pi，1-wire 应该已启用。\n\n你可以使用以下命令从 Raspberry Pi 命令行下载本项目的程序：\n\
  \n```\ngit clone https://github.com/simonmonk/pi_magazine.git\n```\n\n在运行程序之前，使用\
  \ nano 编辑器打开它并更改以下行：\n\n```\nKEY = ‘cyR3vPNF1P9K32W4NZ B9cd’\n```\n\n将其更改为之前找到的\
  \ IFTTT 密钥。使用以下命令以超级用户身份运行程序：\n\n```\nsudo python pipes.py\n```\n\n运行程序时，你应该在终端中看到“Monitoring”消息，之后温度读数应开始出现。\n\
  \n## 代码如何工作\n\n本程序的 Python 代码已添加注释。在我们讲解时，将代码打开在编辑器中可能会很有帮助。\n\n程序首先导入所需的库：\n\n\
  glob 用于查找温度传感器的设备文件，因为程序需要使用通配符匹配，因为每个 DS18B20 在制造时都会被赋予不同的设备 ID；time 用于延时；urllib\
  \ 和 urllib2 用于向 IFTTT 发送网络请求。\n\n你可能想要更改接下来的常量，尤其是在测试系统时。变量 ALARM_TEMP 设置触发警报的温度，因此将其设置为程序在终端中报告的温度低几度，然后去拿一杯冷水进行测试。\n\
  \n常量 MIN_T_BETWEEN_WARNINGS 防止消息发送频率超过每小时一次。在测试项目时，你可能想要更改它。\n\n下一组变量用于标识特定温度传感器文件的位置。这将在文件夹\
  \ /sys/bus/w1/devices/ 中，但此后的文件夹名称对每个 DS18B20 都是不同的。\n\n函数 read_temp 读取设备文件的内容。这将是来自温度传感器的两行消息，看起来像这样：\n\
  \n```\n28 01 4b 46 7f ff 08 10 4c : crc=4c YES,\n28 01 4b 46 7f ff 08 10 4c t=18500\n\
  ```\n\n两行开头的数字是 DS18B20 的唯一 ID，如果读取成功，第一行以 YES 结尾，温度在第二行末尾报告为摄氏度的千分之一。在本例中，即 18.5°C。函数\
  \ read_temp 从消息中提取温度值并返回它。\n\nsend_notification 函数为 IFTTT Web 服务构造一个 URL，并在请求正文中提供温度。\n\
  \n主循环反复读取温度，以检查其是否已降至足以触发警报的水平。如果是，则调用 send_notification，然后延迟直到 MIN_T_BETWEEN_WARNINGS\
  \ 分钟过去。\n\n## 使用你的管道监控器\n\n在安装之前测试项目时，将 ALARM_TEMP 设置为比环境温度低几度，然后将传感器放入一些冷水中。经过几分钟，温度读数将开始下降，直到你收到一条消息：\n\
  \nTEMPERATURE WARNING\nCongratulations! You’ve fired the pipe_alert event\n\n如果你去检查你的电子邮件收件箱，你应该会看到一条通知消息。\n\
  \n即使是节能的 Raspberry Pi 也会产生足够的热量，导致温度读数产生误导。为避免这种情况，请确保 DS18B20 远离 Raspberry Pi 本身，最好靠近甚至贴在你试图保护的管道上。当然你还需要一个地方连接电源适配器，并确保你的阁楼空间在\
  \ WiFi 路由器的范围内。\n\n这是一个适合其他任务的项目。你可以修改它以定期报告温度，或检查温度过高而不是过低。你还可以从 IFTTT 中选择其他操作，例如发推文或发送\
  \ Facebook 更新。\n\n## Pipes.py\n\n语言\n>PYTHON\n\n```\nimport glob\nimport time\n\
  import urllib, urllib2\n\nALARM_TEMP = 5.0 # degrees C\nMIN_T_BETWEEN_WARNINGS =\
  \ 60 # Minutes\nEVENT = 'pipe_alert'\nBASE_URL = 'https://maker.ifttt.com/trigger/'\n\
  KEY = 'cyR3vPNF1P9K32W4NZ B9cd'  # Place your own key here\n\n### These constants\
  \ used by the 1-wire device\nbase_dir = '/sys/bus/w1/devices/'\ndevice_folder =\
  \ glob.glob(base_dir + '28*')[0]\ndevice_file = device_folder + '/w1_slave'\n\n\
  ### Read the temperature message from the device file\ndef read_temp_raw():\n  \
  \  f = open(device_file, 'r')\n    lines = f.readlines()\n    f.close()\n    return\
  \ lines\n\n### Split the actual temperature out of the message\ndef read_temp():\n\
  \    lines = read_temp_raw()\n    while lines[0].strip()[-3:] != 'YES':\n      \
  \  time.sleep(0.2)\n        lines = read_temp_raw()\n    equals_pos = lines[1].find('t=')\n\
  \    if equals_pos != -1:\n        temp_string = lines[1][equals_pos+2:]\n     \
  \   temp_c = float(temp_string) / 1000.0\n        return temp_c\n\n### Send an IFTTT\
  \ pipe_alert event\ndef send_notification(temp):\n    print(\"TEMPERATURE WARNING\"\
  )\n    data = urllib.urlencode({'value1' : str(temp)})\n    url = BASE_URL + EVENT\
  \ + '/with/key/' + KEY\n    response = urllib2.urlopen(url=url, data=data)\n   \
  \ print(response.read())\n\nprint(\"Monitoring\")\nwhile True:\n    temp = read_temp()\n\
  \    print(temp)\n    if temp < ALARM_TEMP:\n        send_notification(temp)\n \
  \       time.sleep(MIN_T_BETWEEN_WARNINGS * 60)\n```\n\n![](img/d8322379620245fcd21eccc3855b8c78_132_0.png)\n\
