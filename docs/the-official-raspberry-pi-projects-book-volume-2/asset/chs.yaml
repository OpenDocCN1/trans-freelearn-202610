  ## PI SPARK 大数据集群


  一位数据科学家向我们展示如何将六台 Raspberry Pi 连接起来构建超级计算机并进行大数据实验


  ### 快速事实


  - 除 Pis 外，零件仅花费约 60 美元

  - 外壳需要 106 颗螺丝

  - Raspberry Pi 集群也被称为 ''Bramble''

  - GCHQ 拥有最大的 Pi Bramble：66 块板

  - 中国的 Tianhe-2 是最大的超级计算机：3,120,000 个核心


  Raspberry Pi 很适合学习计算机科学，但有一个领域是热门新闻却需要大型计算机，那就是‘大数据’。大数据软件通常在网络计算机集群上运行，共同完成所需的大量工作。这种集群特性使得学习大数据变得棘手，因为你需要多台联网的计算机来练习。来自韩国的软件工程师
  Sung-Taek Kim 决定 Raspberry Pi 非常适合这项任务。“Raspberry Pi 是一个很好的教育平台，可以学习大数据软件的工作原理，”他告诉我们。“它[相对]缓慢且低功率，[所以]当你的数据处理方法按计划执行时，你会有亲身体验。”


  事实上，Raspberry Pi 的轻量性能在学习大数据技术时反而成为优势。“一旦你错过一个小细节，”Sung-Taek 解释说，“你会感觉操作过程变慢了。”“通过[网络]发送数据需要时间，”他补充道。“集群中的所有
  CPU 都在竞争内存或磁盘[空间]等资源，并且一两个节点可能会突然拒绝工作，就像[在]谷歌级数据中心集群中一样。”他解释说，Pi 集群的相对缓慢实际上是一个优势，使你能够为此类事件做好准备。


  Sung-Taek 的集群基于六块 Raspberry Pi 2 板，通过 D-Link 8 端口千兆桌面交换机使用以太网电缆连接。“理论上，你只需要一台 Raspberry
  Pi，”Sung-Taek 说，“因为 Spark 利用了主从方案的[特性]。准备一台 Raspberry Pi 作为从机，你的笔记本作为主机。连接两台 Raspberry
  Pi 设备，你就拥有了一个 Spark 集群。”


  ## 构建 PI SPARK 集群


  ![](img/d8322379620245fcd21eccc3855b8c78_38_0.png)


  ### >步骤-01

  制作外壳

  板子的原理图可以在 Sung-Taek 的网站上找到。你可以使用木材、合成材料或亚克力板来切割形状，只要每块厚度不超过 3 毫米且足够坚固以支撑 USB 充电器即可。


  ![](img/d8322379620245fcd21eccc3855b8c78_38_1.png)


  ### >步骤-02

  集群组装

  Raspberry Pis 使用 M2.5 螺丝固定在板上。然后使用 5 毫米立柱螺丝和六角螺母将板子拧在一起。


  ![](img/d8322379620245fcd21eccc3855b8c78_38_2.png)


  ### >步骤-03

  连接

  六端口路由器被固定在板子的中间。每个 Raspberry Pi 通过以太网连接到路由器。请注意，外壳为每个 Raspberry Pi 留下了足够的电源插座空间。


  Sung-Taek 建议该项目使用三到八块 Raspberry Pi 板。“一旦你拥有超过十台 Raspberry Pi，”他说，“找到合适的电源、安排网络和电源线会很头疼。”


  最困难的部分似乎是制作外壳。Sung-Taek 在 GitHub 上托管原理图（magpi.cc/2dTln4z），但准确性至关重要。他警告说，即使切割模板偏移半毫米，也可能导致其中一个亚克力层失效。


  as well.” Java 也是必备的，所列软件包包括 NumPy、Scipy 和 Scikit-Learn。除此之外，你将学习 MapReduce 编程模型，在那里你会遇到
  Hadoop 和 Spark。


  然而，这些都是值得学习的技能：大数据是计算机科学的前沿领域，是一个有趣的研究和工作领域。“Raspberry Pi 集群让你能够为可能发生在生产环境中的事件做好准备，”Sung-Taek
  说。“此外，集群让你能够轻松找到可以应用优化工作的地方，因为其硬件资源确实有限。”


  > 一旦你拥有超过十台 Raspberry Pi，找到合适的电源就会很头疼


  除 Raspberry Pi 单元外，该项目并不昂贵。电源、网络交换机、电缆、螺丝和外壳总共花费约 60 美元。完整的材料清单可通过 Sung-Taek 撰写的
  Make: 文章（bit.ly/1J2jpDf）获得。


  软件需求相当高。“Python 是必备的，”他说，“为了充分利用 Spark 集群提供的功能，学习 Scala”


  “你可能需要仔细规划并从少量节点开始，”他建议。“注意每一步的细节，并确保你的计划与规格相符。一旦你成功构建了[a cluster]，就做一个更大的。避免代价高昂错误的最佳策略之一就是遵循并观察他人所做的事情。”


