  ## 超声波 Theremin


  一种富有创意的 Raspberry Pi 用法，使用了你在工作坊里可能随处可见的组件


  在《The MagPi》这里，我们喜欢跳出思维定式。Raspberry Pi 如此多才多艺且开放，你可以用它做很多事情，也许其他人根本想不到。所以这里有一个好问题：用
  Raspberry Pi、一些扬声器和用于机器人的超声波测距传感器，你会做什么？Linus Forslid 决定制作一种 theremin。“Theremin
  是一种测量附近物体距离并将其转化为声音的设备，这样当你移动手时就可以产生音乐，”Linus 解释道。但它并不完全像普通的 theremin。“与经典 theremin
  不同，我的项目使用超声波传感器而不是用天线测量电场，而且目前我的项目只有一个传感器，所以你只能控制它产生的音调。最终，我计划再添加一个，这样节拍也可以手动控制。”Theremin
  被用于为经典科幻电影创作诡异、 creepy 的音乐。由于这一点及其不寻常的操作方式，theremin 吸引了许多音乐家和极客，包括 Linus：“我从第一天听说它时就一直想要一个
  theremin。它就是这么酷。事实证明，真正的 theremin 并不是便宜或容易制作的，但这个项目很容易完成，而且我几乎所有组件都在家，所以成本也很低。我决定使用
  PC 扬声器而不是 Pi 自带的音频插孔和外部扬声器，主要是因为我可以，而且它不需要额外的电源。”





  ![](img/d8322379620245fcd21eccc3855b8c78_36_0.png)


  全部都连接到 GPIO 端口，而不是使用任何 USB 扬声器或传感器


  > 我从第一次听说它起就一直想要一个特雷门琴。它就是这么酷的东西


  硬件是一回事，但将其转化为声音，难道在代码上做一点工作才能使其运行吗？“不，我想不是。” Linus 为该项目改编了一些现有的代码。“控制特雷门琴的脚本是用 C
  编写的，使用 wiringPi，花了大概一个小时才使其工作。之后我又花了几个小时只是调整数字来尝试不同的声音并找到我喜欢的声音。我不会说它很复杂，即使调音花了一些时间。”
  那么整个过程看似简单，即使它并不是典型的 Pi 项目。 然而也有一些注意事项，Linus 的 Pi 驱动特雷门琴可以做一些改进，正如他解释的那样：“操作起来出奇地困难，因为你需要非常稳定的手和良好的瞄准才能获得想要的确切音调……我计划添加另一个传感器来控制声音的节拍。现在，它完全由脚本设定，这意味着它基本上是静态的。通过让用户控制节拍，我希望它实际上能作为一种乐器使用。”


