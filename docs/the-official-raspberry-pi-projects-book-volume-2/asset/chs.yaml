  ## RASPIMOWER DALEK


  Ron Ostafichuk 打算建造一台机器人割草机，结果做出了一个全自动的 Dalek（你懂的）


  Daleks 是宇宙中最令人恐惧的种族，那么有什么比建造自己的 Raspberry Pi 驱动 Dalek 更有趣呢？开发者 Ron Ostafichuk 就是这么想的。“自从它发布以来，我就一直在折腾
  Raspberry Pi，”他告诉我们，“我见过很多小型机器人项目，但决定大机器人会更有趣。” The Dalek 最初并不是 Dalek：Ron 想建造一台机器人割草机。“我家院子很大，我想向孩子们展示你可以用备件和废料建造大型机器人。”


  木质底座包含两台 12V 电机，这些电机回收自曾用于调节汽车座椅的用途。这些电机通过 V 型皮带系统连接到大号越野轮上。“一旦我完成了电动底座，我的孩子们就跳了上去，在邻里间骑着它兜风。他们很喜欢，并评论说万圣节时骑着它会很棒。既然我是个相当大的
  Doctor Who 粉丝，脑中冒出的想法就是把它改造成 Dalek！”


  供电方面，Ron 使用了一块旧的 12V 深循环房车电池。“[It] 不再足够强劲用于我的房车，”Ron 说，“[but] 这个万圣节连续运行了大约三小时。”“我在
  Pi 上运行标准的 Raspbian 发行版，”Ron 说，而 Raspimower Dalek 控制代码是用 C++ 编写的（可在 Bitbucket 上获取
  – magpi.cc/1HWN V8j）。Dalek 是一个放置在 Raspimower 底座上方的身体。框架由 ¾ 英寸（19 毫米）刨花板制成，外壳由 ¼
  英寸（6 毫米）板材制成。


  ![](img/d8322379620245fcd21eccc3855b8c78_59_1.png)


  ![](img/d8322379620245fcd21eccc3855b8c78_60_0.png)


  ![](img/d8322379620245fcd21eccc3855b8c78_60_1.png)


  ![](img/d8322379620245fcd21eccc3855b8c78_60_2.png)


  ### >步骤-01

  ### Raspimower base


  Raspimower Dalek 的底座是一个框架，用于容纳 12V 电池和通过 V 型皮带系统连接到车轮的电机。它设计为可作为机器人割草机工作，并由 Raspberry
  Pi 控制。


  ### >步骤-02

  ### Dalek frame


  将 Raspimower 底座改造成 Dalek 需要一个刨花板框架。它由棚屋建造项目剩余的 ¾ 英寸刨花板和 ¼ 英寸板材制成。


  ### >步骤-03

  ### The Dalek


  一个旧垃圾桶、一个吸盘和一根铝管构成了 Dalek 的其余部分，整个东西都涂上了光泽黑漆。


  “这些都是建棚屋剩下的，”Ron 透露道。一个手臂是马桶吸盘，另一个是缠绕电线的铝管，整个东西都涂上了光泽黑漆。


  Dalek 最初是用无线键盘控制的，但 Ron 已为控制 Raspimower Dalek 构建了网页界面。Ron 还以 $60CND（约 £40）的价格买了一辆旧的
  Zappy 代步滑板车，并计划用它来替换 12V 电机。他解释说它更加强大且机械结构更可靠。“[The Dalek] 远未完成且不断变化，因为我有很多计划，想让它实现自主化，这样它真的会‘exterminate’我院子里任何长长的草叶，”Ron
  开玩笑说。说到消灭，没有 Dalek 是完整的，没有它著名的语音指令。“它里面有一些旧电脑扬声器，非常响亮；它们实际上会震动 Dalek 的侧面。它有大约 15
  个来自 Doctor Who 的音效片段，但‘exterminate’是我最喜欢的一个！“这个万圣节大受欢迎，当孩子们靠近时，我会打开所有灯光并将机器人转向他们，同时大喊‘exterminate!’
  或 ‘destroy!’。看着孩子们的反应非常有趣；我最喜欢的反应来自一个小女孩，她转向她爸爸，理所当然地说，‘Well, I guess we know which
  house we will never ever go to again!’ ”


  > 里面旧电脑扬声器如此响亮，实际上会震动 Dalek 的侧面


  Dalek 完成万圣节任务后，底座又变回机器人割草机


  ![](img/d8322379620245fcd21eccc3855b8c78_60_3.png)


  ## STRATOS BOTSARIS


  Stratos 是希腊 Intrasoft International 的高级 Java 软件工程师。

  youtu.be/-WJz6nYgr8c


  ![](img/d8322379620245fcd21eccc3855b8c78_61_0.png)


  一个 Raspberry Pi 连接到 L293D 控制器。这控制着遥控玩具的原装电机


  一个网络摄像头已连接并用于将 Spy Rover 的视频图像发送到 Android 手机


