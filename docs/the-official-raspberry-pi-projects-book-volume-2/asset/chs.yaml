  \ Python 中执行交通灯序列。\n\n## >STEP-05\n### 设置\n\n查看本页的代码，我们通过导入 TrafficHAT 和 time 进行了一个简单的设置。我们需要后者来模拟真实交通灯通常的延迟。将\
  \ Traffic HAT 代码设为变量 th，我们就可以开始循环了。\n\n创建一个会持续运行的简单 while 循环。开始时让绿灯显示，并使用另一个 while\
  \ 循环在按钮被按下之前停止代码。除非你按下按钮或中断程序，否则它会一直保持绿色。\n\n## TrafficLights.py\n\nLanguage\n>PYTHON\n\
  \n```\nfrom gpiozero import TrafficHat\nfrom time import sleep\n\nth = TrafficHat()\n\
  \ntry:\n    while True:\n        # Traffic light code\n        # First, turn the\
