  ## TENMA 60W 数字焊接站\n### 评测\ncpc.farnell.com\n\n£47 / $79\n\n![](img/d8322379620245fcd21eccc3855b8c78_180_0.png)\n\
  \n焊铁本身很轻，因为用于焊接的电子元件位于底座单元中。多极连接器为焊铁供电并提供反馈，焊铁体积小巧轻便，这得益于大部分电子元件位于底座单元中。这里唯一的真正缺点是该设备固定在购买国家的电网——要么是\
  \ 220V 要么是 110V——并且其电源线是集成式的而非可拆卸的。\n\n### 省钱之处\n直到你看到随附的支架时，才开始看出 Tenma 在哪里省钱。虽然支架本身是一个坚固的金属外壳，但它无法充分固定焊铁，很大程度上是因为焊铁缺乏重量，而连接到底座单元的导线相对较重。它可以使用，但需要小心确保焊铁不会掉出来。与此同时，随附的清洁海绵勉强够用，应尽快更换为更厚的海绵——或替代的烙铁头清洁系统。撇开这些问题不谈，Tenma\
  \ 焊接站使用起来令人愉快。其 60W 输出和双加热线圈意味着焊铁的烙铁头——可通过快速拧动固定螺母轻松更换，有各种形状和尺寸可选——能够迅速升温。此外，底座单元上的实时温度读数意味着在判断其是否准备就绪时无需猜测。另一个特点是\
  \ Tenma 对静电放电（ESD）安全性的声明。这意味着——与入门套件和廉价商店中常见的极其便宜的焊铁不同——当你将焊铁的金属烙铁头触及其中一个触点时，静电放电不会损坏任何敏感元件。这种问题不太可能影响大多数爱好者，但未来不会困扰你的保证无疑很不错。\n\
