  输入 Blender 的高程数据确保了乞力马扎罗山的准确表现，带有详细的等高线


  ## 柯特·亨特


  柯特将数十年的高科技经验与对高山攀登的热情相结合，联合创立了 Madison Mountaineering，并开发了自己的基于网络的 RainOn 跟踪解决方案。

  rainon.com

  magpi.cc/2dUhfSP


  七个 LED 中的每一个都标记了营地或山顶的位置，并在攀登者接近该点时亮起


  Raspberry Pi 和所有线缆完全封闭在模型内部，该模型在打印后被掏空


  模型后部设有电源和以太网端口的开口，通过延长线缆连接到 Pi


  ### 快速事实


  - 其峰顶海拔 5,895 米，乞力马扎罗山是非洲最高的山峰

  - 创建了两个模型：一个用于柯特的家，另一个用于他的办公室窗户

  - 使用的比例为 1:100,000，因此模型上的 10 毫米相当于 1 公里

  - 柯特之前的登山经历包括阿空加瓜山和丹奈利山

  - 他还在 2014 年的一次大型远征中担任珠穆朗玛峰大本营经理


  ## 位置跟踪山地模型


  当柯特·亨特想要创建一个智能 3D 模型来向家人和同事展示他在攀登乞力马扎罗山时的进展时，他转向了 Raspberry Pi


  一个 LED 在华盛顿州美国厨房柜台上放置的比例模型上亮起，以表示在 9,000 多英里外的坦桑尼亚，柯特·亨特已登上乞力马扎罗山的山顶。攀登非洲最高峰一直是柯特长期以来的抱负。“自从
  20 年前搬到西雅图后，我就会抬头望向雷尼尔山并梦想攀登它，”他告诉我们。“在 2004 年让自己进入状态后，我确实攀登了它并爱上了攀登。那一年我设定了攀登乞力马扎罗山的[content]

