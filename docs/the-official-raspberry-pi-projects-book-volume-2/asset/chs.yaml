  ## 平行计算的力量


  这种设计透明度与该项目的主要目标完美契合，即帮助公众可视化并行计算的工作原理，并强调高性能计算研究人员的重要工作。正如 Kirk 所指出的，我们每天都从大型系统带来的进步中受益，这些系统是
  Google、Twitter 和 Dropbox 等服务基础设施所必需的。“然而，依赖这些技术的普通大众并不理解其重要性和我们这样的人所做工作的内在优雅。通过美学和可视化，我的想法是传达最基本的信息，例如我们使用大量设备集体并行地解决比单系统能解决的问题更大的问题。你在
  SeeMore 上看到的算法代表了并行代码和系统中常见的同步和异步通信与协作。”


  > SeeMore 部分受 1970 年代中期至后期经典的 Cray-1 超级计算机启发


