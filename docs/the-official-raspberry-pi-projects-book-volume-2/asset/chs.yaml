  \ 非常适合将你的 Pi 用作 CCTV 摄像头。想在外出时检测移动吗？那就继续阅读吧…\n\nMotionEyeOS 的一个优点是能够检测运动并捕捉触发它的图像和视频。你还可以在线访问摄像头的实时流，即使不在家时也很方便，如果你想偶尔查看一下的话。外出时，被通知任何移动情况非常有用，而\
  \ MotionEyeOS 提供了自定义通知的便捷选项。\n\n本指南假设你已经设置并配置了 MotionEyeOS。需要 Pushover 许可，费用为 £3.99/$4.99。如需帮助，请查看此处的\
  \ MotionEyeOS wiki：magpi.cc/1UCvYwV。\n\n### STEP-01\n在 Pushover 中创建应用程序\n\nPushover\
  \ 拥有一个很棒、易于使用的 API。在开始之前，我们需要在其上注册一个应用程序。在 Pushover 网站（pushover.net）上的“Your Applications”标题下点击\
  \ Register Application。为你的应用命名——比如 RaspiMotion——然后确保类型为 Application。为你的应用写一个简短的描述（例如“由我的\
  \ Raspberry Pi 发送的推送通知”），如果有创意，还可以上传一个自定义图标，该图标会在每次发送通知时显示在你的 Pushover 客户端应用中。\n\
  \n右侧 确保打开“Run A Command”，然后包含你的脚本路径！\n\n![](img/d8322379620245fcd21eccc3855b8c78_107_2.png)\n\
  \n### STEP-02\n获取你的 API 令牌和用户密钥\n\n创建应用程序后，你应该可以访问 API 令牌/密钥。这是一串唯一的数字和字母组合——请务必保密！你还需要你的用户密钥，登录\
  \ Pushover 网站后即可看到。好的，现在你有了应用以及 API 和用户密钥。你现在需要下载（或自行重建）一个简单的 Python 脚本，以便在 MotionEyeOS\
  \ 调用该脚本时让你的 Raspberry Pi 施展魔法。\n\n### pushover.py\n```\nimport httplib, urllib\n\
  \nconn = httplib.HTTPSConnection(\"api.pushover.net:443\")\nconn.request(\"POST\"\
  , \"/1/messages.json\",\n    urllib.urlencode({\n        \"token\": \"APP_TOKEN\"\
  ,          # Insert app token here\n        \"user\": \"USER_TOKEN\",         #\
  \ Insert user token here\n        \"html\": \"1\",                  # 1 for HTML,\
  \ 0 to disable\n        \"title\": \"Motion Detected!\",  # Title of the message\n\
  \        \"message\": \"<b>Front Door</b> camera!\", # Content of the message\n\
  \        \"url\": \"http://IP.ADD.RE.SS\", # Link to be included in message\n  \
  \      \"url_title\": \"View live stream\", # Text for the link\n        \"sound\"\
  : \"siren\",             # Define the sound played\n    }), { \"Content-type\":\
  \ \"application/x-www-form-urlencoded\" })\nconn.getresponse()\n```\n\n### STEP-03\n\
  创建你的 Python 脚本\n\nMotionEyeOS 不像 Raspbian。你不能像平常那样使用某些命令，例如 git clone，所以我们必须手动创建\
  \ Python 脚本；如果你喜欢，也可以使用 WinSCP 进行拖放。我们也不需要使用 sudo，因为默认情况下我们已以 root 身份登录。我们的脚本需要位于\
  \ data 文件夹中，所以让我们进入那里并使用 nano 创建 pushover.py：\n\n```\ncd /data\nnano pushover.py\n\
  ```\n\n在这里，你需要复制粘贴或输入代码列表，同时在需要的地方填入你的 API 令牌和用户密钥。\n\n### STEP-04\n使脚本可执行\n\n与任何脚本一样，我们需要确保它可以被执行，否则它只是一堆花哨的文本！你可以通过命令行或\
  \ WinSCP 来完成。从命令行，确保你在 data 文件夹中，然后输入：\n\n```\nchmod +x pushover.py\n```\n\n或者，如果使用\
  \ WinSCP，选择 data 文件夹中的 pushover.py 文件，然后按 F9。在出现的窗口中，将权限更改为 0755，然后点击“OK”确认。\n\n\
  ![](img/d8322379620245fcd21eccc3855b8c78_108_0.png)\n\n左侧：通过 Pushover.net 创建一个应用以开始。非常简单明了\n\
  \n### STEP-05\n配置 MotionEyeOS 使用你的脚本\n\n现在我们有了脚本，需要告诉 MotionEyeOS 在检测到运动时使用它。为此，登录到\
  \ Motion Notifications 菜单并打开“Run A Command”选项。然后你需要指定要运行的命令，这将是你刚刚创建的 Python 脚本——即\
  \ /data/pushover.py。完成后点击 Apply 以确认更改。\n\n### STEP-06\n测试一下！\n\n希望到现在为止，你已经创建了 Python\
  \ 脚本，使其可执行，告诉 MotionEyeOS 在检测到运动时使用你的脚本，并且已在你的智能手机或平板电脑上安装了 Pushover 应用。我们现在需要测试它是否有效！在摄像头前挥挥手（如果你精力充沛，也可以跳舞！），随后不久你应该会通过\
  \ Pushover 收到通知，警告你检测到运动！\n\n随意尝试脚本来自定义 Pushover 中显示的消息和播放的声音。\n\n语言\n>PYTHON\n\
  下载:\nmagpi.cc/2oDHpYw\n\n## 教程\n\n## 逐步操作\n\n## JAMES SINGLETON\n\nJames 是一名开发者、工程师和作者。他通过‘Cleanweb\
  \ Jobs’帮助人们在环境领域找到软件工作：unop.uk cleanwebjobs.com\n\n![](img/d8322379620245fcd21eccc3855b8c78_109_0.png)\n\
  \n全部由 Raspberry Pi 驱动，定时在你需要时启动\n\n慈善商店里丢弃的地球仪是制作唤醒灯的完美材料\n\n闹钟的主灯比 Sense HAT LED\
  \ 亮得多\n\n### 所需材料\n- Sense HAT\n  magpi.cc/1TGGU15\n- BlinkyTape LED 灯带（或 NeoPixel\
  \ / DotStar）\n- 一个不需要的地球仪\n- 塑料瓶\n- 贴纸垫\n- Blu-Tack 或腻子\n"
- "## PI GLOWBE\n\n## 由 Pi 驱动的唤醒灯\n\n将地球仪变成发光球体，并利用它在黑暗的冬季月份帮助你醒来\n\n冬季，或一年中的任何时间，早上起床都可能很困难。如果你黎明前醒来，你的身体仍然认为还是夜晚（因为确实是）。你可以购买唤醒灯，通过模拟人造日出欺骗身体醒来；它们会在闹钟临近时逐渐变亮。这些灯价格可能相当昂贵，所以为什么不使用\
  \ Pi 和一些 LED 自己制作一个呢？为了庆祝国际空间站上的 Astro Pis，我们用慈善商店里找到的地球仪制作了一个，里面装有 Sense HAT——也许是\
  \ unwanted Christmas present，现在被重新利用了！\n\n### STEP-01\n制作 LED 灯泡\n\n通过将 LED 灯带缠绕在塑料瓶周围来制作灯泡。你可以跳过这一步，但\
  \ Sense HAT 不够亮，无法制作灯。剪掉空塑料瓶的顶部，用贴纸垫覆盖它，然后以螺旋方式缠绕 LED 灯带。你可以用胶带进一步固定末端。让连接端位于较宽的开口处，以便将电源线引向\
  \ Pi，然后再从中心引出。我们将在倒置的瓶口顶部安装 Pi，所以确保它平整。\n\n### STEP-02\n毁灭世界\n\n通过将支架的插脚从北极和南极的孔中拉出，将地球从其支架上取下。接下来，沿赤道将其分成两半，拉开两个半球。它应该很容易拆开，只需在正确的位置施加一点力。你需要制作一个新的支架，防止地球仪滚动，同时仍允许电源线从底部孔中退出——你可以使用胶带卷的内侧。你可以用刀切一个小槽，让电线进入。\n\
  \n### STEP-03\n安装在地球仪内部\n\n将新的 LED 灯泡安装在地球仪内部。用 Blu-Tack 或腻子将瓶颈安装在下孔上；它应该足够坚固，可以支撑\
  \ Pi 放在其顶部。安装 Sense HAT 到 Pi 上，然后将两者放在倒置的瓶子上。给 Pi 连接一个 USB WiFi 适配器（除非你使用有线以太网），否则它会在错误的时间唤醒你。这是因为\
  \ Pi 需要互联网访问来设置时钟。\n\n### STEP-04\n布线供电\n\n你可能需要剪断并重新连接电源线以使其穿过孔。官方 Pi 电源使用钟线，这使得用螺丝端子（choc\
  \ block）重新连接变得容易。不幸的是，它提供的电力不足以在全亮度下使用 LED 并同时运行 Pi。剪断电缆并将供电端穿过孔。在电缆上打一个结，防止它被拉回。分离两端的两个电源芯并剥去绝缘层。用\
  \ choc block 重新连接，注意极性。\n\n### STEP-05\n下载代码\n\n将代码从 GitHub 仓库克隆到你的主文件夹：\n\n```\n\
  git clone https://github.com/jpsingleton/pi-glowbe.git\n```\n\n如果你只使用部分硬件或不同的 LED\
  \ 灯带，可以根据需要调整代码。你可能还需要安装 Sense HAT 软件，如果你运行的是较旧版本的 Raspbian——请按照 magpi.cc/1KboHnN\
  \ 的说明进行操作。你可能还想禁用 Pi 上的 LED，以免打扰睡眠。较新的型号可以在软件中完成，否则你可以贴上胶带，甚至如果你足够勇敢，可以将其拆焊。\n\n\
  ### wakeup.py\n\n语言\n>PYTHON 2.7\n下载:\nmagpi.cc/1TUKdz7\n\n```\nfrom BlinkyTape\
  \ import BlinkyTape\nfrom sense_hat import SenseHat\nfrom time import sleep\nimport\
  \ optparse\n\n#### Default Blinky Tape port on Raspberry Pi is /dev/ttyACM0\nparser\
  \ = optparse.OptionParser()\nparser.add_option(\"-p\", \"--port\", dest=\"portname\"\
  ,\n                  help=\"serial port (ex: /dev/ttyACM0)\",\n                \
  \  default=\"/dev/ttyACM0\")\n(options, args) = parser.parse_args()\n\nif options.portname\
  \ is not None:\n    port = options.portname\nelse:\n    print \"Usage: python wakeup.py\
  \ -p <port name>\"\n    print \"(ex.: python wakeup.py -p /dev/ttyACM0)\"\n    exit()\n\
  \nsense = SenseHat()\nbt = BlinkyTape(port)\n\n#### wake phase - gradually get brighter,\
  \ linearly\nsleepTime = 18 # 18 sec for 30 min in 100 steps\nmaxPower = 100 # flickers\
  \ or cuts out above 100\n\nfor y in xrange(maxPower):\n    sense.clear(y * 2, y\
  \ * 2, y * 2)\n    for x in xrange(sleepTime):\n        bt.displayColor(y, y, y)\n\
  \        sleep(1)\n\n#### on phase - at full brightness for the same time\nsense.clear(255,\
  \ 255, 255)\nfor z in xrange(maxPower * sleepTime):\n    bt.displayColor(maxPower,\
  \ maxPower, maxPower)\n    sleep(1)\n\n#### tidy up\nsense.clear()\n```\n\n### STEP-06\n\
  设置你的日程\n\n我们将使用 cron 运行代码。它应该在你起床前约半小时开始，并且可能只在工作日运行。通过在终端中输入以下内容启动 cron 配置：\n\n\
  ```\ncrontab -e\n```\n\n接下来，通过在末尾添加以下行来设置它：\n\n```\n15 6 * * 1-5 python /home/pi/pi-glowbe/wakeup.py\n\
  ```\n\n这将在每个工作日 06:15 运行代码，所以根据你的需要更改它。保存文件并退出编辑器（在默认的 nano 中按 CTRL+X，Y，然后 ENTER）。满意后，重新组装所有东西，等待早晨！\n\
  \n\n"
- "## 使用 Python 3 编程 CodeBug\n\n从 Blocky 编程进阶，并利用 Python 的全部功能控制你的 CodeBug...\n\n\
  所需材料\n- CodeBug magpi.cc/1MelyfA\n- USB Micro B 数据线（包含在内）\n- Python 库：python3-serial\
  \ & python3-codebug-tether\n- CodeBug 脚本：codebug-tether.cbg magpi.cc/1MeiBYR\n\n\
  CodeBug 设置简单，可通过网站上的类似 Scratch 的 Blocky 界面开始编程。一旦你掌握了这一点，你很可能想进入下一阶段，使用像 Python\
  \ 3 这样更强大的语言来完全掌控。这使你能够包含更复杂的结构，如列表和元组，并使用过程构建更大的项目。你的专家开始思考仅用一个 25 个 LED 的方块和一个开关能做出多好的游戏。这是他的第一次尝试。\n\
  \n### >STEP-01 游戏规则\n\n我们需要一个简单的游戏，在目标处于特定位置时按下按钮。在 1970 年代末，你的专家在教授 Commodore PET\
  \ 或 Ohio Scientific Basic 时，曾把‘Zap the Rat’游戏作为家庭作业布置。你需要在移动的‘老鼠’目标经过电路上的某个‘击打点’时点击按钮。在这个版本中，每次成功击中老鼠速度就会加快，你需要在最少的尝试次数内击中三只老鼠。最好在游戏运行期间显示击中次数，并给出最终得分以显示错过目标的次数。所有这些能装进\
  \ 5×5 的 LED 显示屏吗？\n\n![](img/d8322379620245fcd21eccc3855b8c78_111_0.png)\n\n通过 Micro\
  \ USB 数据线连接\n\n这是击打位置\n\n![](img/d8322379620245fcd21eccc3855b8c78_111_1.png)\n\n\
  上图显示老鼠在 (4,0)，击打位置标记，以及击中计数为两次击中\n\n![](img/d8322379620245fcd21eccc3855b8c78_111_2.png)\n\
  \nTONY GOODHEW\n自 1967 年起教授编程（IBM 1130 使用 FORTRAN IV）。BBC Micro 教师培训师，现使用 Raspberry\
  \ Pi 和 Arduino。\n\n![](img/d8322379620245fcd21eccc3855b8c78_112_0.png)\n\n上图 最终得分：错失击打老鼠的机会七次\n\
  \n### >STEP-02 规划显示\n\n电路将是所有外边缘 LED，老鼠从左下角开始运行：(0,0)。击打单元将在 (4,2)，(3,2) 处有一个永久点亮的\
  \ LED 来标记它。击中次数可以用从 (1,1) 到 (1,3) 上升的点亮 LED 列来表示。按钮‘B’将用于击打老鼠。最终得分可以用字符‘O’来显示，表示没有错过的击打机会——相当难以实现——或用点亮的\
  \ LED（0 –25）表示每次失误。要算作‘击中’，必须在击打位置 LED 点亮时按下按钮；一直按住按钮是无效的。\n\n### >STEP-03 设置 CodeBug\n\
  \n要以有线模式运行 CodeBug，你需要下载并安装一个名为 codebug_tether.cbg 的程序。按正常方式安装后，CodeBug 暂时成为 Raspberry\
  \ Pi 的从设备，服从从 Python 3 发送的指令。（这有点像使用 Nanpy 从 Pi 控制 Arduino。）\n\nPi 上还需要安装两个额外的 Python\
  \ 库，python3-serial 和 python3-codebug-tether。将浏览器指向 magpi.cc/1MeIWdR 并按照 Thomas Macpherson-Pope\
  \ 的优秀说明操作。\n\n打开 IDLE 3 并输入 Zap_the_rat.py Python 脚本。保存并运行它。\n\n### >STEP-04 待办事项\n\
  \n你可以对脚本进行以下修改和添加：\n\n- 随机化老鼠的起始位置\n- 随机化老鼠在电路中运行的方向\n- 将零最终得分改进为一个正方形，从位置 (2,2)\
  \ 向边缘扩张和收缩再返回，共五次作为庆祝。\n\n### Zap_the_rat.py\n\nLanguage >PYTHON\n\n```python\n\
  #### Zap the Rat - Python3 Game for Tethered CodeBug\n#### Tony Goodhew - 5 Oct\
  \ 2015\nimport codebug_tether\nimport time\ncb = codebug_tether.CodeBug()\ncb.clear()\n\
  \n#### Circuit LED co-ordinates - round the edge from bottom-left\nLEDx = (0,0,0,0,0,1,2,3,4,4,4,4,4,3,2,1)\n\
  LEDy = (0,1,2,3,4,4,4,4,4,3,2,1,0,0,0,0)\nfor i in range(0,-66,-1):  # Display game\
  \ title\n    cb.write_text(i,0,'Zap the Rat', direction=\"right\")\n    time.sleep(0.1)\n\
  \nscore = 0            # Rats zapped!\nopps = 0             # Zap opportunities\n\
  p = 0                # Position of rat on circuit (0-15)\ndelay = 0.05         #\
  \ Initial delay between rat moves\nold_sw = 0           # Last value of switch B\n\
  running = True       # Loop control variable\ncb.clear()\ncb.set_pixel(3,2,1)  #\
  \ Show Zap position\n\nwhile running:\n    cb.set_pixel(LEDx[p],LEDy[p],1)  # Show\
  \ rat\n    if p == 10: opps = opps +1       # Incr opps - in (4,2)\n    time.sleep(delay\
  \ - score * 0.007) # Wait - gets faster\n    sw = cb.get_input('B')           #\
  \ Read switch B\n    pixel = cb.get_pixel(4,2)        # Rat in Zap position?\n \
  \   cb.set_pixel(LEDx[p],LEDy[p],0)  # Hide rat\n    if old_sw == 0 and sw == 1\
  \ and pixel == 1: # Hit?\n        score = score +1             # Increment hits\n\
  \        cb.set_pixel(1,score,1)      # Show hits\n        if score == 3:      \
  \         # Game over?\n            running = False          # Stop looping\n  \
  \  p = -1                           # Position of next rat\n    old_sw = sw    \
  \                  # Store switch value\n    p = p + 1                        #\
  \ Update rat position\n    if p > 15:                       # Rat pointer out of\
  \ range?\n        p = 0                        # Reset to start position\n\ncb.clear()\
  \  # Game over - display opportunities\nopps = opps - 3  # Remove successful opportunities\n\
  print(\"Missed Opportunities were \",opps)\nif opps > 25:  # Reduce missed opps\
  \ to 25 max\n    opps = 25\nif opps == 0:\n    cb.write_text(0,0,'O') # Zero missed\
  \ opps\nelse:\n    for x in range(0,5):  # Display missed opps\n        for y in\
  \ range(0,5):\n            if opps > 0:\n                cb.set_pixel(x,y,1)\n \
  \           else:\n                cb.set_pixel(x,y,0)\n            opps = opps\
  \ - 1\ntime.sleep(5)\ncb.clear()  # Tidy display\n```\n"
- "## 用 Piano HAT 演奏\n\nPimoroni 最新推出的 HAT 是释放你弹奏欲望的绝佳方式。让我们用它来构建一个相对音高测试器\n\n所需材料\n\
  - 一个 Piano HAT\n  magpi.cc/1OALwNT\n- Piano-HAT 库\n  magpi.cc/2dXkyIM\n- 耳机或外接扬声器\n\
  \n相对音高是指通过与参考音比较来识别给定音乐音符的能力。与绝对音高不同，相对音高可以通过训练得到改善。Piano HAT 是一款多功能硬件，我们可以用它来创建一个有趣的游戏，测试人们识别不同音符的技能。它受到了\
  \ Zachary Igielman 传奇的 PiPiano 的启发，并将你的 Pi 变成一个功能性音乐键盘。16 个电容式按键 each 都有一个 LED，因此你可以创建自己的‘学习演奏’教程，或只是为你的表演增添视觉效果。\n\
  \n### >STEP-01 开始使用 Piano HAT\n\n像大多数 HAT 一样，这个使用起来很简单。只需小心地将其插入 Pi 的 GPIO 引脚。然后安装\
  \ Piano-HAT Python 库。这需要 Pi 上的 I²C 总线启用，网上有很多说明。但为了让生活更轻松，Pimoroni 的那些海盗提供了一个方便的脚本来处理一切：\n\
  \n```\ncurl -sSL get.pimoroni.com/pianohat | bash\n```\n\n### >STEP-02 有线音频\n\n\
  从 Pi 获取音频输出有两种选择。如果使用带内置扬声器的 HDMI 显示器或电视，音频可以通过 HDMI 电缆播放。如果没有，可以切换到使用插入耳机插孔的耳机或扬声器。Pi\
  \ 通常会自动检测可用输出，但有时会判断错误。要强制音频使用特定输出，可以使用此命令：\n\n```\namixer cset numid=3 2\n```\n\
  \n第二个数字决定输出：HDMI = 2，耳机插孔 = 1，自动 = 0。\n\n### >STEP-03 再来一次\n\nPiano-HAT 库有一组不错的演示\
  \ Python 脚本。一个很好的入门脚本让你使用 Piano HAT 作为……钢琴！\n\n```\nsudo python Pimoroni/pianohat/simple-piano.py\n\
  ```\n\n![](img/d8322379620245fcd21eccc3855b8c78_113_0.png)\n\n每个触控面板都有对应的 LED\n\n\
  十六个电容触控面板用作琴键和控制按钮\n\n\n\n\n## Relative_Pitch.py\n\n```\nimport pianohat # import\
