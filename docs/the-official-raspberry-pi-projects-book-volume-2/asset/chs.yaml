  ```\n\n如果你按下乐器键，你会注意到声音从钢琴变成了打击乐。Piano-HAT 库本身不会将任何键映射到特定声音；所有这些都是使用 Python 完成的。声音本身是\
  \ WAV 文件，使用 Pygame 库播放。\n\n让我们将自己的声音映射到 Piano HAT 的其中一个键上。 在网上找一个简短的 WAV 文件（或使用\
  \ Sonic Pi 创建自己的），并将其保存为 mysound.wav。 然后输入 Listing_l1.py（第 52 页）中的代码并运行它：按下 D 键时应该会播放你的声音。\n\
  \n## >STEP-04\n\n## A little light music\n\n你会注意到按下任何键时相关的 LED 灯都会亮起。这是默认行为，但可以使用以下方法禁用：\n\
  \n```\npianohat.auto_leds(False)\n```\n\n在 Listing_l1.py 中立即在 handle_note 函数之前添加这一行。现在我们可以添加代码，使只有\
  \ D 键的 LED 会工作。插入\n\n```\npianohat.set_led(2,True)\n```\n\n...在 pygame.mixer.Sound\
  \ 行之前，以及\n\n```\npianohat.set_led(2,False)\n```\n\n...在它之后。现在重新运行程序以验证只有在敲击时 D 才会亮起。\n\
  \n## >STEP-05\n\n## Use a dictionary\n\n使用一堆 if... 语句将键映射到声音很容易，但相当冗长。对于我们的相对音高测试，我们希望将键（一个整数）与音符（一个文本字符串）和声音关联起来\n\
  \n![](img/d8322379620245fcd21eccc3855b8c78_115_0.png)\n\n![](img/d8322379620245fcd21eccc3855b8c78_115_1.png)\n\
  \n要播放的声音（也是一个字符串）。一个简单的方法是使用 Python 构造的字典。现实世界的字典有单词索引，每个单词都有定义。在 Python 字典中，单词称为‘key’，而定义则是‘values’。Listing_l2.py\
  \ 使用一个简单的两项字典将声音和名称（值）映射到 C 和 D 键（键）上。试试看。\n\n## >STEP-06\n\n## Putting it all together\n\
  \n我们现在已经探索了相对音高测试所需的一切：我们将使用 Piano-HAT 库附带的钢琴声音作为音符。输入 Relative_Pitch.py 清单（第 51\
  \ 页）中的代码并使用 sudo 运行它。参考\n\n## Listing_l1.py\n\n```\nimport pianohat\nimport pygame\n\
  import signal\n\npygame.mixer.pre_init(44100, -16, 1, 512)\npygame.mixer.init()\n\
  pygame.mixer.set_num_channels(16)\n\ndef handle_note(channel, pressed):\n    if\
  \ channel == 2:\n        pygame.mixer.Sound('./mysound.wav').play(loops=0)\n\npianohat.on_note(handle_note)\n\
  signal.pause()\n```\n\n> 在 Python 字典中，单词称为‘key’，而定义则是‘values’\n\n播放一个音符（一个 C）后，经过短暂暂停，会播放需要识别的音符。玩家然后有\
  \ 6 秒时间按下他们刚刚听到的音符的正确键。如果他们答对了，所有 LED 都会闪烁庆祝，否则会被要求再试一次。作为扩展，如何使用不同的、可选的乐器呢？\n\n\
  ## Listing_l2.py\n\n```\nimport pianohat\nimport pygame\nimport signal\n\npygame.mixer.pre_init(44100,\
  \ -16, 1, 512)\npygame.mixer.init()\npygame.mixer.set_num_channels(16)\nNOTES =\
  \ {0:['Sound1', './mysound.wav'],\n         2: ['Sound2', './mysound2.wav']}\n\n\
  def handle_note(channel, pressed):\n    if channel == 0 or channel == 2:\n     \
  \   pygame.mixer.Sound(NOTES[channel][1]).play(loops=0)\n\npianohat.on_note(handle_note)\n\
  signal.pause()\n```\n\n## Tutorial\n\nJASPER HAYLER-GOODALL\n是 AstroPi 获奖作品之一的大脑，也是\
  \ CoderDojo Ham 和 CodeClub 的常客！他十岁。\ncoderdojoham.org\ncranmereprimary.org.uk\n\n\
  使用 8x8 网格动画程序创建你自己的精彩口号动画\n\n只需三根线即可将 Pi 连接到 UnicornHAT\n\n![](img/d8322379620245fcd21eccc3855b8c78_116_0.png)\n\
  \n## You'll Need\n\n-   Unicorn 或 Sense HAT 购买处。 pimoroni.com\n-   一个高 40 针排针（用于\
  \ Sense HAT） shop.pimoroni.com\n-   一些跳线、两个按钮和一个面包板\n-   8x8 网格动画程序 magpi.cc/2dXmlbn\n\
  -   Fuzzy Wuzzy 库 magpi.cc/2dXlOvH\n\n## PHRASE!\n\n制作你自己的流行电视节目 Catchphrase 的版本。你只需要几个组件和一个\
  \ LED 矩阵，在这里是 Unicorn HAT...\n\nCatchphrase 是一档电视游戏节目，参赛者试图猜出在大屏幕上可视化的知名短语或谚语。在这个项目中，你将制作一个类似的游戏，使用\
  \ Sense HAT 或 Unicorn HAT 来显示动画。我们主要为 Unicorn HAT 编写了这个项目，但稍作修改后也可以与 Sense HAT 一起使用。为了使游戏成为双人游戏，我们添加了一些按钮来查看谁最快猜出口号。\n\
  \n如果你有 Sense HAT，请取下已附带的排针并换上一个高的排针。这应该会在 Sense HAT 顶部留下一些引脚伸出，足以连接电线。\n\n## >STEP-01\n\
  Put your hat on\n\n稍后我们将连接一个面包板来使用一些按钮，因此我们需要访问 Pi 的 GPIO 引脚。因此你不应该直接将 Unicorn HAT\
  \ 放置在 GPIO 引脚上；相反，使用跳线连接它。令人惊讶的是，Unicorn HAT 只使用三根引脚（5V、GND 和 GPIO 18），所以这些是我们需要关心的唯一引脚。\n\
  \n## >STEP-02\n\n## Download the animator program and get creating\n\n当你下载 8x8 网格动画程序时，请确保使用适合你的\
  \ HAT 的版本。如果你有 Unicorn HAT，请使用以下命令：\n\n```\nsudo python 8x8grid-unicorn.py\n```\n\
  \n要创建动画，只需从右侧调色板中选择一种颜色，然后点击网格上的一个圆圈将该颜色打开。通过按 >> 按钮添加另一个帧；这将复制当前帧。如果需要清除帧，请按‘clear\
  \ frame’按钮。你也可以在 上播放你的动画\n\n\n## Maingame-Uni.py\n\n```\nimport unicornhat as uh\
  \ #import the necessary modules\nimport time, random,signal\nimport catchphrases_uni\
  \ as cp # the file with our animations\nimport RPi.GPIO as GPIO\nfrom fuzzywuzzy\
  \ import fuzz\n\ndef halfthing(num,colour): #turns on half the LEDS to indicate\
  \ who pressed button first\n    uh.clear()\n    for x in range (num,num+4):\n  \
  \      for y in range(0,8):\n            uh.set_pixel(x,y,colour[0],colour[1],colour[2])\n\
  \    uh.show()\n\ndef pressed(num): # Function to be run when buttons pressed\n\
  \    global running\n    running = False # stops animation from playing\n    halfthing(num,(255,0,0))\n\
  ```\n\n```\nget_answer(3) # call with goes set to 3\n\ndef b21pressed(channel):\
  \ # Run when button on GPIO 21 pressed\n    pressed(0)\n\ndef b16pressed(channel):\
  \ # Run when button on GPIO 16 pressed\n    pressed(4)\n\ndef get_answer(goes):\
  \ # Asks the player for their answer\n    answer = raw_input('Name that catchphrase?\
  \ ')\n    match = fuzz.ratio(answer, picked) # compare answer to catchphrase title\n\
  \    if match >=85:\n        print 'Correct!'\n    elif match >= 60 and match <\
  \ 85: # if it nearly matches\n        goes=goes-1\n        if goes==0:\n       \
  \     print('run out of goes')\n```\n\nLED 灯和删除帧。当你对动画满意时，点击‘export to py’，它将被保存为\
  \ animation8x8.py。\n\n### >STEP-03\n调整动画\n\n然后你需要使用命令行重命名文件（为你自己选择的名称）：\n\n```\n\
  mv animation8x8.py yourchoice.py\n```\n\n![](img/d8322379620245fcd21eccc3855b8c78_117_0.png)\n\
  \n右图 使用 8x8 网格动画程序创建你自己的精彩口号动画\n\n然后你应该重复步骤 02，直到你至少有三个动画。确保在每次导出后重命名它们。\n\n现在我们需要将动画复制到口号代码中。首先，在\
  \ IDLE 中打开 yourchoice.py（或你命名的文件），然后找到带有 frames=[ 的行。一直高亮到最后的 ]，然后将其复制并粘贴到名为 catchphrases.py\
  \ 的新文件中。对其余动画重复相同操作并将它们粘贴到同一文件中。最后，你需要使用 Python 字典和列表将动画与其名称关联起来；一个示例 catchphrases.py\
  \ 已包含在此项目的 GitHub 仓库中。\n\n### >STEP-04\n连接并测试按钮\n\n要将按钮连接到树莓派，你需要三根跳线、一块面包板和两个按钮。要制作电路，请遵循第\
  \ 55 页的图像；要测试按钮，请使用 listing1.py 代码。如果使用 Sense HAT，请确保使用相同的 GPIO 引脚（16 和 21）。\n\n\
  ### >STEP-05\nFuzzywuzzy 匹配\n\n模糊匹配是关于找出一个字符串与另一个字符串有多接近。打开一个 Python shell（使用命令行或\
  \ IDLE），然后导入 fuzzywuzzy 库。\n\n```\n>>>from fuzzywuzzy import fuzz\n```\n\n```\n\
  else:\n    print 'Close.. Try again (' + ( str(goes) + ' guesses remaining)'\n \
  \   get_answer(goes)\nelse:\n    print \"That's not right\"\nprint 'Press ^C to\
  \ exit'\n\ndef show_catchphrase():  # Display an animation on the LED matrix\n \
  \   picked = random.choice(cp.ANSWERS.keys()) # Pick random animation from file\n\
  \    for i in range(3):\n        for x in cp.ANSWERS[picked]:\n            if running:\n\
  \                uh.set_pixels(x) # display a frame from animation\n           \
  \     uh.show()\n                time.sleep(0.25) #pause before next frame\n   \
  \ time.sleep(1) # pause before we play animation again\n```\n\n```\nreturn picked\n\
  \nGPIO.setmode(GPIO.BCM) #set GPIO numbering to BCM\nGPIO.setup(21,GPIO.IN, pull_up_down=GPIO.PUD_UP)\
  \ #Set these pins as inputs\nGPIO.setup(16,GPIO.IN, pull_up_down=GPIO.PUD_UP)\n\
  #set callback functions that are run when button pressed\nGPIO.add_event_detect(21,GPIO.FALLING,callback\
  \ = b21pressed,bouncetime=300)\nGPIO.add_event_detect(16,GPIO.FALLING,callback =\
  \ b16pressed,bouncetime=300)\ntry:\n    running = True # use this to stop animation\
  \ when button pressed\n    picked = 'blank'\n    picked = show_catchphrase()\n \
  \   signal.pause() #stops the code from exiting\nexcept KeyboardInterrupt:  # catch\
  \ ^c\n    exit() #exit the code\n```\n\nFuzzywuzzy 会为两个短语的接近程度给出 100 分制的分数。\n\n\
  ```\n>>>fuzz.ratio('hello world','catchphrase')\n18\n>>>fuzz.ratio('piphra...','pyphase')\n\
  80\n```\n\n我们可以用它来检查玩家的答案与我们的口号有多接近（因为我们不想太苛刻！）。\n\n### >STEP-06\n\n## 最终代码\n\n\
  现在我们需要把学到的所有内容结合起来创建口号游戏。将主列表（上方）中的代码输入到名为 piphra...py 的文件中，然后使用以下命令运行它：\n\n```\n\
  sudo python piphra...py\n```\n\n程序应该在等待有人按下任一按钮的同时在 Unicorn HAT 上播放三次动画。当玩家按下其中一个按钮时，他们一侧的\
  \ Unicorn HAT 会亮起。然后他们需要输入他们认为正在显示的口号。程序随后会告诉他们答案是否正确或不正确。如果玩家的答案根据模糊匹配在 60 到 80\
  \ 之间，他们也可能会看到“再试一次”的消息。\n\n![](img/d8322379620245fcd21eccc3855b8c78_118_0.png)\n\
  \n左图 此项目可与 Sense HAT 或 Unicorn HAT 一起使用。如果使用 Unicorn HAT，应像这样连接\n\n## Listing1.py\n\
