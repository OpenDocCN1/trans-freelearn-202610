  ## MATT REED


  Matt Reed 住在田纳西州纳什维尔，是 RedPepper 的创意技术人员。 mcreed.com


  Raspberry Pi 垂直安装在梅森罐内部


  盖子连接到木质底座，并在其上钻孔以容纳 LED 和电缆


  LED 灯光与 BitTorrent 同步活动同步闪烁，在 Pi 备份文件时产生红色发光效果


  ### 快速事实


  - 梅森罐由铁匠 John L Mason 于 1858 年发明

  - 你可以在英国的 Kilner 购买梅森罐 – kilnerjar.co.uk

  - 不要超频 Raspberry Pi，否则可能会过热

  - 唯一的存储限制是你连接到 Raspberry Pi 的设备

  - Matt 使用 Node.js 使 LED 灯光与 BitTorrent 同步


  ## 梅森罐保存


  Matt Reed 将家庭照片备份在梅森罐中。他告诉 Lucy Hattersley 如何时尚地保存数字记忆


  Matt Reed，这位来自西弗吉尼亚州的专业网页开发者和创客，创建了这个令人惊叹的项目。由 Raspberry Pi 驱动的 Mason Jar Preserve
  是我们见过的最时尚的备份解决方案。此时，《The MagPi》的非美国读者可能会想知道梅森罐到底是什么。“它们是工业级玻璃罐，带可密封盖，最初在家中用于冬季保存食物，”Matt
  说。“梅森罐让夏季收获的食物能保存全年。谁不想在二月吃到美味的炸秋葵呢？“在我曾曾祖母的地下室里，有整排整排各种尺寸的罐子，装满了从腌甜菜到你能想到的各种果酱。”


  但与保存美味食物不同，Matt 的梅森罐保存的是 Matt 的家庭回忆。


  ### 罐装一台 Raspberry Pi


  这个想法在工作中萌生于 Matt：“我周围放着几个不同尺寸的梅森罐。有一天我只是拿起最大的一罐，把 Pi 滑了进去。它很合适，甚至还有一点空余！”制作 Mason
  Jar Preserve 相当直接：“我用锯子把底座切成方形，用砂纸打磨圆角，用钻头制作 LED、以太网和电源孔。去 Home Depot 几次买古董抽屉拉手、一些橡胶脚垫、支架和螺丝，就完成了。”


  ## 保存你的 Pi


  ![](img/d8322379620245fcd21eccc3855b8c78_42_0.png)


  ### STEP-01

  制作底座


  Raspberry Pi 可放入梅森罐内，但需要保持直立。为此，Matt 切割了一个六英寸的底座。然后他将其打磨成圆角，让人联想到 Apple TV。


  ![](img/d8322379620245fcd21eccc3855b8c78_42_1.png)


  ### STEP-02

  给它盖上盖子


  梅森罐的盖子中央钻有一个孔。用螺母和垫圈将其固定。然后再钻四个孔来容纳 LED 灯。电源和以太网电缆穿过另一个孔。


  ![](img/d8322379620245fcd21eccc3855b8c78_42_2.png)


  ### STEP-03

  组装


  安装并设置 BitTorrent 软件以备份其他本地计算机上的文件夹。最后，将梅森罐拧在盖子上方，并由 LED 照亮。


  Matt 的 Mason Jar Preserve 通过以太网连接，但你也可以使用 WiFi。“我仍然好奇玻璃会对信号产生多大影响，”他告诉我们。“最终我选择以太网是因为传输速度、可用性、简单性和可靠性。另外，因为我
  USB WiFi 适配器用完了。像，零个。”


  ### 由 BitTorrent 驱动


  Matt 使用 BitTorrent 创建备份软件。“它类似于 Dropbox，”他说，“但不是通过云中的集中服务器，而是通过 BitTorrent 协议将你自己的两台或更多设备直接连接在一起。就像
  Dropbox 一样，连接的 BitTorrent 同步机器都会同步其系统上的指定文件夹。所以基本上，它是免费的，存储仅限于连接的存储。”


  与 BitTorrent 文件共享不同，Matt 的系统完全是私有的。“每当你创建一个同步文件夹时，它会得到一个唯一的字母和数字字符串，”Matt 解释道。“这个密钥在
  BitTorrent 同步协议上唯一标识它。密钥可以为你提供给它的人提供读写访问或只读访问。你通常希望将其安全保存。如果我公开分享该密钥，那么我就会拥有一个类似大家所熟知和喜爱的
  BitTorrent 的公共文件共享种子。”


  Matt 使用他的 Mason Jar Preserve 备份家庭照片和视频。“我真的只想要对孩子出生、婚纱照和各种家庭相关媒体等事物再多一层冗余备份。它使用
  Raspberry Pi 的 SD 卡进行存储。因此，你放入 Pi 中的 SD 卡越大，就能存储越多。”


  我们认为最终结果辉煌。当 Mason Jar Preserve 正在同步时，它使用 Node.js 脚本、BitTorrent Sync API 和 GPIO
  引脚来动画化 LED。空闲时，它们会发出红色光芒。“我想让它看起来像罐子里装满了红色覆盆子果酱，”Matt 说。“尤其是在夜晚看起来很棒。”


