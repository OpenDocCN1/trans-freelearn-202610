  \ BOARD 入门套件\n外观精美，Touch Board 是否就是 Bare Conductive 所承诺的导电奇迹？\n\n关于 Bare Conductive\
  \ Touch Board 入门套件，首先要讨论的就是其价格。在英国仅略低于 100 英镑，在美国为 150 美元，对预算有限的创客来说绝对不是冲动消费。不过，当你看到其制作所付出的用心和关注时，很难说它物有所值。\n\
  \n盒子体积庞大，根本不可能在你外出时从信箱中溜出来，里面包含令人印象深刻的零件选择。自然而然的亮点是 Touch Board 本身，它还配有一罐导电漆，配有粗刷子，一支同一导电漆的细尖喷嘴管，用于更精确的涂抹，自供电可充电扬声器，USB\
  \ 电缆，microSD 卡读卡器和香蕉夹电缆。此外还有一套卷起来的模板套装（稍后会详细介绍）以及一本令人印象深刻、超大尺寸、全彩的指南手册，涵盖套件的三个主要项目。\n\
  \n指南手册绝非事后才想起，但开始使用时几乎不需要它。Touch Board 本身的包装，一个盒子套在另一个盒子里，同时充当快速入门指南，并揭示了一个非常巧妙的功能：预先录制的教学信息已加载到随附的\
  \ 128MB microSD 卡上。\n\n对于不熟悉的人来说，Touch Board 是一款与 Arduino 兼容的设备，旨在让使用导电漆、导电线甚至 Play-Doh\
  \ 变得尽可能简单。它预先配置为每次触摸其 12 个电极输入之一时播放 SD 卡上的 MP3 文件。\n\n然后用于引导用户入门：连接 micro-USB 电缆和随附的扬声器或一副耳机，用手指触摸输入\
  \ E0，你会听到祝贺信息；按下 E1，你将了解板子的输入。这一过程一直持续到 E11，它会引导你前往 Bare Conductive 网站了解更多信息。\n\n\
  然而，使用入门套件时，你也有离线支持。上述指南手册以逐步的方式引导你完成三个示例项目做得非常出色。每个步骤都有全彩图片，很难迷路或困惑。\n\n第一个建议的项目是最大的：学习如何制作图形传感器。这涉及卷起来的模板和覆盖层，它们配有方便的粘性标签。\n\
  \n### 相关\n### MAKEY MAKEY\nThe device that brought the banana piano to the masses,\
  \ the Makey Makey is a cheaper way to get started with conductive materials.\n\n\
  £40 / $50\nmakeymakey.com\n\n![](img/d8322379620245fcd21eccc3855b8c78_182_0.png)\n\
  \n![](img/d8322379620245fcd21eccc3855b8c78_182_1.png)\n\n![](img/d8322379620245fcd21eccc3855b8c78_182_2.png)\n\
  \n> 指南手册在引导你完成三个示例项目方面做得非常出色\n\n将模板贴在墙上——或者，如果你不确定油漆会成为房屋固定装置的某种永久性，则贴在一张大纸或卡片上——并刷上油漆。用彩色覆盖层装饰，使用较细的油漆管绘制通向\
  \ Touch Board 的导线，将 MP3 复制到 microSD，瞧：一座互动房屋。\n\n剩下的两个项目是主题的变化。第一个为日常物品添加触摸灵敏度，例如提醒你剂量的药瓶，或描述其自身场景的相框。最后一个项目要求你将油漆刷在地板上以创建入侵报警器，尽管它仅在入侵者赤脚时才有效。\n\
  \n这三个项目详细介绍了 Touch Board 的部分功能，但并非全部。指南手册后面的扩展项目页面引导你前往网站了解板子的更高级功能，例如重新编程使其作为非接触式距离传感器或\
  \ Makey Makey 风格的乐器运行。\n\n到目前为止，Touch Board 可能已经吸引了孩子，但可能让更高级的爱好者望而却步。在指南的后面部分，揭示了\
  \ Touch Board 比初看更强大：它是一个功能齐全的 Arduino，与各种 Shield 和附加组件兼容，可提供从蓝牙连接到电机控制的一切。\n\n\
  看一眼板子本身就能看到熟悉的 Arduino 引脚排，尽管没有引脚，但可完全访问这些引脚以进行更高级的创作。这结合 Atmel ATmega 微控制器，使板子能够做\
  \ Arduino 能做的任何事情，包括与外部硬件接口，例如电机、伺服器、传感器，甚至 Raspberry Pi 本身。结合 Bare Conductive 巧妙油漆的灵活性，这使套件在三个捆绑项目完成后仍具有相当大的延展性。\n\
  \n### 最后的话\n它并不便宜，但对于任何想要开始使用导电漆或触摸类项目的人来说，这套套件很容易推荐，而且制作精良，细节关注度很高。\n\n★★★★★\n\n\
