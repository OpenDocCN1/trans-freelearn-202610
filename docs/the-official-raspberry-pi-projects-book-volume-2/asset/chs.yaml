  ## PUMPKIN PI

  通常是一道美味佳肴，你能接受这个版本吗？


  DREW FUSTINI

  element14 社区的软件开发者，南瓜术士

  bit.ly/1ilW2te


  ![](img/d8322379620245fcd21eccc3855b8c78_78_0.png)


  雕刻南瓜和万圣节南瓜灯在许多国家都是万圣节的传统。得益于互联网，越来越多的人想要制作自己的定制南瓜来炫耀，这些南瓜不仅仅是一对眼睛和一个诡异的笑容。如今，你可以打印出几乎任何东西的南瓜雕刻图案，这是一种很好的创意方式，同时还能留下一些果肉也许做成美味的汤或甜点。


  不过，雕刻南瓜并不是表达自我的唯一方式。要真正打造一个“黑客南瓜灯”，我们需要在其内部添加一些电子元件并提升恐怖感。Drew 就是用他的 Pumpkin Pi
  为 element14 社区做的这一点。他创作的一些项目灵感来自即将到来的节日，在这种情况下万圣节即将到来。


  整个系统相当简单：通过从他电脑上的网络界面激活预设脚本，灯光开始有节奏地变色（请查看 YouTube 视频以正确看到其实际效果：youtu.be/Ilv8H7WPfQw）。界面安装在
  Pi 上，如果你为此类项目使用他的程序，你可以在南瓜内激活多种声音和灯光序列。Pumpkin Pi 的构造需要的不只是按一下按钮。取一个预先雕刻好的南瓜（你也可以自己雕刻），Drew
  然后用一个大号塑料食品袋将其衬里，以确保内部的电子元件不会因南瓜的湿气而受潮。南瓜后部的雕刻用于穿过电源线，并且装有所有 LED 等的面包板被放置在 Raspberry
  Pi 上以节省空间。他还在上面放了切碎的吸管，以更好地在南瓜内扩散光线。扬声器被附上，南瓜就完成了并准备测试。如果你想让它更永久一些，你可以使用 Pi Plate
  焊接电路，然后将其安装到 Raspberry Pi 上。


  Pumpkin Pi 很简单，但设计和制作都很用心。如果你要从这些万圣节项目中获得灵感，我们建议从这个开始，只是为了感受为你的窗户或门廊制作一个 creepy  contraption
  的感觉。


