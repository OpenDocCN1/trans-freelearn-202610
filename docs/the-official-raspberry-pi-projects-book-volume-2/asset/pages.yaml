  md: '# >STEP-04

    Testing


    Before installing the project, test it out using two short lengths of tube attached
    to the pump and two glasses, one containing water. Jump ahead to the software
    section and set the start time for a minute ahead of the current time. Wait for
    the pump to start, then make sure that it will pump water from one glass to the
    other. This will also tell you which tube is the inlet and which is the outlet.


    Make sure that the tubes are really well connected to the pump. If any air at
    all can get in, then the pump will not work properly.


    ![](img/d8322379620245fcd21eccc3855b8c78_127_0.png)


    # >STEP-05

    Installation


    Our example setup is temporary. The Raspberry Pi lives indoors, with the lead
    to the pump fed out through a window. The inlet tube to the pump fits under the
    water butt lid and down into the water. The outlet goes off to the plant container.


    ![](img/d8322379620245fcd21eccc3855b8c78_127_1.png)


