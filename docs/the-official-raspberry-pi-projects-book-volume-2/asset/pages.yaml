    # WALKTHROUGH


    # EVERYDAY ENGINEERING


    # PART 8


    # SIMON MONK


    Simon Monk is the author of the Raspberry Pi Cookbook and Programming the Raspberry
    Pi: Getting Started with Python, among others.

    simonmonk.org

    monkmakes.com


    ![](img/d8322379620245fcd21eccc3855b8c78_125_0.png)


    # WEB-ENABLED


    # PLANT WATERER


    Above Watering can meets the Internet of Things


    Solve real-world electronic and engineering problems with your Raspberry Pi and
    the help of renowned technology hacker and author, Simon Monk


    # You''ll Need


    +   - Half-size breadboard

    +   - 12V peristaltic pump

    +   - 2x male-to-female jumper wires

    +   - 2x male-to-male jumper wires

    +   - 1k ohm resistor

    +   - MPSA14 transistor (CPC: SC10647)

    +   - 1N4001 diode

    +   - DC barrel socket to screw adaptor (CPC: CN19646)

    +   - 12V DC 1A power supply (this just supplies power to the pump)

    +   - Tubing and connectors


    This project automates the watering of your plants. You can use it indoors to
    take care of house plants while you are away, or with a water butt and outdoor
    containers.

    The interface is used to control the duration and start time of your watering,
    over your local network or even over the internet.


    As you''ll see from the list of required components on the left, this project
    uses a small circuit built on breadboard, and a peristaltic pump to take water
    from your water butt to your containers.

    You can find a pump on eBay, where it will cost about £6 from China or twice that
    from the UK. The pumps are intended for use in an aquarium. They consume about
    300mA, a little too much for an old favourite transistor like the 2N3904, so a
    MPSA14 Darlington transistor, which can cope with 1A, is used instead.

    The pumps are usually supplied without leads attached, so you will probably need
    to solder leads on. If you plan to use the pump outdoors, then solder twin speaker
    cable or the like to the pump terminals; it must be long enough to allow you to
    have the pump outside, and your Raspberry Pi and the rest of the electronics indoors.

    The pump needs its own 12V DC power supply, which is


