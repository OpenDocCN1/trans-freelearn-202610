    ![](img/d8322379620245fcd21eccc3855b8c78_195_3.png)


    We get to review many good and interesting Python tutorials, but a book placing
    Python learning within the context of programming the Raspberry Pi is always going
    to have an advantage: building quickly towards your own projects on the Pi is
    a great motivator. Nixon’s book makes the link between basic Python learning and
    our favourite small board computer, even in the basics – such as treatment of
    numerical variables to best fit GPIO values.


    Python version on many operating systems.” We suggest it’s time to drop Python
