  md: "# ESSENTIAL PI ZERO TIPS\n\n# HOW TO CONNECT TO WIFI ON THE COMMAND LINE\n\n\
    # GIVE YOUR PI ZERO A NETWORK NAME\n\nIf you set a static IP as shown in the wireless\
    \ tutorial on this page, then you’ll always be able to access the Raspberry Pi\
    \ Zero with that IP address from any remote service. However, for those who want\
    \ the easier automatic way, you can still make it just as easy to connect to the\
    \ Zero over the network by setting up Zeroconf. From the command line or in the\
    \ terminal, type the following to make sure it is installed:\n\n```\nsudo apt-get\
    \ install avahi-daemon\n```\n\nBy default, the Pi will now be accessible via raspberrypi.local\
    \ over the local network.\n\n![](img/d8322379620245fcd21eccc3855b8c78_145_0.png)\n\
    \nLeft On some versions of Raspbian, avahi it may already be installed\n\n![](img/d8322379620245fcd21eccc3855b8c78_145_1.png)\n\
    \nWhile Raspbian makes it dead easy to connect to WiFi on the desktop interface,\
    \ there’s a little more involved in getting it working from the command line.\
    \ Before we begin, there is one trick you can do: if you set up the WiFi at the\
    \ desktop, it will still work while in the command line. That isn’t always possible,\
    \ though, so you may need to use the manual way. First, find out the name of your\
    \ network and the password. In the Raspbian command line, type:\n\n```\nsudo nano\
    \ /etc/wpa_supplicant/wpa_supplicant.conf\n```\n\nThere will already be some information\
    \ but to get the wireless to connect, make sure the file has these lines in it,\
    \ with your network name (SSID) and its password replacing what’s already here:\n\
    \nLeft To set a static IP on the desktop interface, you’ll have to go through\
    \ the same process\n\n```\nnetwork={\n  ssid=\"YourSSID\"\n  psk=\"YourWifiPassword\"\
    \n}\n```\n\nYou can also give the Raspberry Pi a static IP. To do this, you first\
    \ need to do some prep work which requires you to use a computer which is already\
    \ connected to your wireless network. Open the command line in Windows or the\
    \ terminal in OS X or Linux. For Windows, type ipconfig; for OS X and Linux, use\
    \ ifconfig followed by netstat -nr. Note the IP address (inet), the broadcast\
    \ address, the subnet address, the router IP (Destination), and Gateway address.\
    \ After that open the DHCPD conf file (sudo nano /etc/dhcpcd.conf) and add:\n\n\
    ```\ninterface wlan0\n\nstatic ip_address=[address]\nstatic routers=[router IP]\n\
    static domain_name_servers=[gateway]\n```\n\n# RASPBERRY PI ZERO"
  merge: -1
