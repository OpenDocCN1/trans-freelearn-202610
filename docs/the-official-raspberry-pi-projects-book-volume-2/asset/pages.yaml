  md: '![](img/d8322379620245fcd21eccc3855b8c78_174_0.png)


    # The Gemma is the star, but there are plenty of other parts


    As with most electronic textile starter kits, there’s an undeniable focus on LED
    projects. Once you’ve amused yourself adding RGB glowing eyes to kids’ toys, though,
    you can begin to experiment with the power of the Gemma. Although three input-output
    pins feels limited, they offer surprising flexibility: two of the three offer
    pulse-width modulation (PWM) support for dimming LEDs or driving small servos,
    while one can also be used as an analogue input to read a variety of optional
    sensors. These, however, must be compatible with the 3.3V logic used by the Gemma,
    in contrast to the 5V logic more common in the Arduino world.


    There are some disappointments, too, for Arduino fans who were hoping that their
    projects would be directly transferable. Aside from the limited number of pins,
    the Gemma has no accessible serial port. This means it can’t be combined with,
    for example, a serial-connected Bluetooth or Wi-Fi adaptor to easily make connected
    clothing. To focus on what it can’t do is to ignore the kit’s true goal, however.
    Adafruit bills the Gemma kit as the perfect way for beginners to get started with
    programmable wearable and electronic textile projects, and the obvious next step
    from its non-programmable LED-based kit. The use of RGB LEDs,


    which can be cycled through your choice of millions of colours, keeps things interesting
    and the low cost of the kit makes it accessible to those with even a passing curiosity
    in electronic textiles projects, as well as Arduino users keen to try something
    a little different in their next build. The only real negative is the lack of
    printed documentation. While there’s a wealth of supporting information, tutorials,
    and projects on Adafruit’s website, a small booklet like that provided with the
    rival Kitronik kit would have been welcomed and helped to make this bundle a truly
    standalone product.


    Above The kit has everything you need to get started


    # Last word


    If you have experience with the Arduino platform and want to get into wearable
    electronics, the Gemma is the way to go and this kit a perfect way to get started.'
