  md: '# EYE TRACKING WHEELCHAIR


    ![](img/d8322379620245fcd21eccc3855b8c78_30_0.png)


    # >STEP-01

    Infrared camera


    The eye tracker consists of a webcam modified to use infrared (IR) light. The
    IR blocking filter is removed, and a film is used to block everything but IR light.
    IR LEDs replace the standard LEDs. A 3D-printed case is used to mount the device
    on safety glasses.


    ![](img/d8322379620245fcd21eccc3855b8c78_30_1.png)


    # >STEP-02

    Pupil detection


    The Raspberry Pi 2 snaps images of the user''s eye from the IR camera at a rate
    of 10-12fps. A series of filters are applied to each image, increasing the contrast
    and making the pupil more easily identifiable. OpenCV software is used to map
    the coordinates of the pupil.


    ![](img/d8322379620245fcd21eccc3855b8c78_30_2.png)


    # >STEP-03

    Motor control


    The wheelchair is controlled by motors salvaged from a windscreen wiper unit.
    These are connected directly to the wheel on the wheelchair using a custom 3D-printed
    profile (designed to match the wheels of the chair).


    ![](img/d8322379620245fcd21eccc3855b8c78_30_3.png)


    Above A windscreen wiper motor is connected to a small 3D-printed wheel. This
    small wheel drives the main wheelchair wheels


    “The camera films the eye, and the software extracts the position of the pupil
    and checks if it is within the range of four areas corresponding to the four movements,”
    says Myrijam.

    In the current version, the command is read out to the user via speech synthesis,
    and it has to be confirmed. Then the motors are switched on, depending on the
    direction. When the wheelchair is moving, infrared rangefinders check for obstacles
    in the path.


    coordinates of the pupil that has been filtered out so far: this was the biggest
    breakthrough.”

    The wheels are powered by windscreen wiper motors rescued from the scrapyard.
    “We wanted to keep it possible so everybody can simply rebuild it on their own,”
    Myrijam tells us. These motors are connected to the wheelchair wheels using a
    small 3D-printed wheel contoured to fit around the tyre.


    > Our biggest achievement was getting the tracker to find the coordinates of the
    pupil


    # Raspberry Pi-powered


    The Raspberry Pi is used to capture images from the webcam, and OpenCV (opencv.org)
    is used for image manipulation. “The software captures images from the webcam
    with a frame rate of 10–12 fps,” says Myrijam. The image is converted to greyscale,
    before being blurred and converted to black and white. “OpenCV offers a great
    filter that calculates the centre of gravity of a given shape,” she explains.
    “We use this function to get the


    It was a challenging project: “It was very difficult to work on the code because
    this is our first time of leaving Lego Mindstorms behind,” says Myrijam. “Our
    biggest achievement was getting the tracker to find the coordinates of the pupil.
    After that, we knew it was possible. I learned to do 3D design, 3D printing, Linux,
    Python, and image processing. It was amazing to see that you can integrate computer
    vision into your projects and combine that with physical computing.”'
