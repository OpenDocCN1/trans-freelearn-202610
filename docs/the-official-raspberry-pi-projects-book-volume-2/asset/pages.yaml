    enticed by the lower cost of entry to transform their side project into a hardware


    business. From prototyping and manufacturing, to community engagement and legal
    concerns, and every aspect of developing and producing a product then getting
    it to customers, is considered in appropriate depth for those thinking seriously
    of turning a product idea into a business.


    Open-source hardware is only touched on briefly, and selling your users’ data
    is almost taken for granted, but the focus on a narrow, Silicon Valley view of
    what a startup is all about is unsurprising, given the smaller number of community
    and cooperative ventures in hardware than in software. However, the Raspberry
    Pi itself stands as a shining example of a social enterprise approach to running
