  md: '![](img/d8322379620245fcd21eccc3855b8c78_186_0.png)


    Above A selection of graphical package managers makes installation much easier


    are more a traditional desktop – no programming tools installed as standard, and
    using normal programs as well.


    A novelty compared to Raspbian is the addition of a graphical package manager.
    Both Software Centres and classic Synaptic are available, giving users a way to
    search for software they may want, which Raspbian currently doesn’t let you do
    easily. As this is based on Ubuntu armhf, the selection isn’t as broad as in the
    full version of Ubuntu, but it’s still very good. A lot of major software is available,
    with the only real limit being the power and performance of the Raspberry Pi 2
    running Ubuntu.


    Due to its use of more standard software, Ubuntu can lag a bit on the Raspberry
    Pi 2. Firefox is the default browser, and while a lightweight alternative like
    Midori is available, it’s not always fast and responsive.


    It feels like how the browser used to be on the original Raspberry Pi – functional,
    but a little frustrating to use after a while. Video on YouTube seems right out
    as well, if you want to watch anything larger than 360p.


    It’s not all slow, though. With the right selection of packages and the right
    use case, it can be just fine. Ubuntu is a slightly more resource-heavy base than
    Debian as it is, so for anything requiring the extra power, it was never going
    to be the operating system or distro of choice.


    The Xfce version does run the best out of the three, but Raspbian is still better
    in terms of performance.


    As a desktop system, though, it’s better. With a few modifications to the default
    apps, it’s perfectly usable as one, and looks a bit more the part than Raspbian
    as well. For projects and more niche uses, however, it looks like Raspbian is
    still king.


    ![](img/d8322379620245fcd21eccc3855b8c78_186_1.png)


    Above YouTube is hit-and-miss, especially on a more resource-heavy browser like
    Firefox


    # Last word


    It was never going to be as quick as Raspbian, but it’s a fantastic effort that
    adds some more variety to the operating systems available for the Raspberry Pi.'
