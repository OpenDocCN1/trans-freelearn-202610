  md: '# GETTING TO KNOW GPIO


    Discover the joy of electronics by hooking up components, wires, and hardware
    to the pins on a Raspberry Pi board


    One of the most powerful and fun features of the Raspberry Pi is the row of pins
    at the top. Known as ‘GPIO’ (General-Purpose Input/Output), these pins enable
    you to hook up the Raspberry Pi to additional hardware and electronics. There
    are lots of hardware attachments for the Raspberry Pi that connect directly to
    the GPIO pins. Many are known as HATs (Hardware Attached on Top). These connect
    directly to the GPIO and sit on top of the Raspberry Pi. More importantly, HATs
    are designed to work as soon as you connect them to the Raspberry Pi,


    so hardware branded as a HAT is easier to set up. The real joy of GPIO isn’t using
    pre-made hardware, but building your own electronics projects. You can connect
    the GPIO pins to all kinds of electronic circuitry and


    buttons, sensors, buzzers, and all manner of electronic gizmos and widgets. These
    are used to learn all about electronics hardware and circuit building. While it’s
    possible to wire parts directly to the GPIO pins,


    > You can connect the GPIO pins to all kinds of electronic circuitry and control
    it


    control it using the Raspberry Pi. With the right cables, you can hook the GPIO
    pins up to switches,


    most tinkerers place electronic components in a breadboard and connect this to
    the Raspberry Pi.


    # BREADBOARDS AND BREAKOUTS


    ![](img/d8322379620245fcd21eccc3855b8c78_17_0.png)


    Electronic components are plugged into the holes on the breadboard, and components
    in adjacent holes are linked. In this way, you can build up a test circuit without
    having to actually solder components together. If you follow the instructions,
    connecting directly to the GPIO pins on a Raspberry Pi is safe, but randomly plugging
    in wires and power sources to the Raspberry Pi may cause bad things to happen,


    especially plugging in devices that use a lot of power (like motors). Because
    of this, many electronics enthusiasts use a device known as a ‘breakout cable’
    between the Raspberry Pi and breadboard. The breakout cable plugs into the GPIO
    pins, and into the breadboard. There are also devices like the Explorer HAT that
    combine a breakout with a breadboard and enable you to create prototype circuits.'
