  md: '![](img/d8322379620245fcd21eccc3855b8c78_124_0.png)


    A more advanced step. Solder on a GPIO header and the rest of your components
    using the spec here: github.com/topshed/MYOH


    ![](img/d8322379620245fcd21eccc3855b8c78_124_1.png)


    Slice up some stripboard to the correct size for a HAT that fits over the Pi


    # myoh-rgb.py


    ```

    from gpiozero import RGBLED

    from time import sleep


    led = RGBLED(22,27,17)


    led.on()

    sleep(0.5)

    led.off()

    led.red = 1

    sleep(0.5)

    led.red =0

    led.green=1

    sleep(0.5)

    led.green = 0

    led.blue = 1

    sleep(0.5)

    led.blue=0

    ```


    Language

    >PYTHON 3

    DOWNLOAD:

    magpi.cc/

    1RwC040


    To test your new creation, you need to modify your circuit so that the EEPROM
    is connected to the Pi as it would be if it were part of a HAT. GPIO pins 27 and
    28 are reserved for HAT detection, so power down your Pi again and move the appropriate
    wires as shown in Fig 2. Then add the 3.9kΩ pull-up resistors which ensure that
    the pins are not ‘floating’.


    Now reconnect the power to your Pi and let it boot. If everything has worked,
    the directory /proc/device-tree/hat should be present, and the contents


    of its files should match the details in the default eeprom_settings.txt file.
    You should also see that the GPIO pins used by the RGB LED have now been preset,
    so it should not be lit at all.


    Congratulations! You have now programmed an EEPROM that the Pi recognises as meeting
    the specification for a HAT.


    As a final test, run the myoh-rgb.py code and check that the RGB LED flashes through
    its sequence of colours. Clearly, this is a very basic HAT; there are loads more
    possibilities for using the ability to have the Pi preload the necessary drivers,
    so that more complicated hardware can be easily supported. The Sense HAT is a
    great example of this technique.


    Now that you’ve made a simple HAT and got to grips with the process, see what
    other amazing add-ons you can create!


    If you want to completely follow the whole HAT design process, you now have the
    option to make the


    > See what other amazing add-ons you can create!


    transition from breadboard to proper circuit board. The Raspberry Pi Foundation
    specification also sets the physical properties of the board, right down to the
    radius of the rounded corners and the inclusion of slots for the camera and display
    cables. For prototyping, you probably needn’t worry about this too much; a simple
    stripboard design is available in the GitHub repository for this tutorial, and
    is pictured in the main image. If you want to take things even further, the marvellous
    Fritzing CAD software has a built-in PCB template that can help you produce a
    final design suitable for manufacture.'
