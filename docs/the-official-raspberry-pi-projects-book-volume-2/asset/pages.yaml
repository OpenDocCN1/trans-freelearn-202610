    # Maker Says


    > Touch-sensitive screen gives you fingertip control

    > SB Components


    # LCD CONTROL CASE


    A simple case for mini-LCD Raspberry Pi screens - how does it hold up under proper
    use?


    Last issue we reviewed the SPI-Box from SB Components, a custom case for the Raspberry
    Pi 2 (and B+) that allows for a motion sensor and a Pi Camera Module to poke out
    of the case. With the bundled software, this means you have a functional and cheap
    security camera, with plenty of software bells and whistles to make it genuinely
    useful. Using a similar design ethos, SB Components has also created a special
    case for using a 3.2" LCD touchscreen with the Pi in a proper enclosure. It’s
    very inexpensive as well.


    The case comes in three parts: a base that’s near enough identical to the SPI-Box’s
    design, along with an interstitial layer to protect some of the Pi components
    from the screen, and finally a top part that fits snugly over the Pi and screen.
    Like the SPI-Box, the base


    has the Pi snapped very firmly in place; possibly a little too firmly, as removing
    it again can be a little bit of an undertaking.


    Putting an LCD screen over the interstitial layer and then enclosing it with the
    top is very easy – a lot of Pi mini TFT screens only use the first 26 GPIO pins,
    a legacy from the original Raspberry Pi design. The interstitial layer only opens
    up these pins, meaning there’s no confusion. The entire screen is then accessible
    through the case, and even the usual array of microswitches (like on the Adafruit
    screen) can be accessed via little pinprick holes. Think a reset switch on an
    old piece of electronics – just try to avoid using something sharp.


    With the case alone, you have an excellent addition to a Raspberry Pi you’re using
    with a touch LCD screen. It’s sturdy, very easy to construct, and microswitch
    access


    is quite neat as well – normally those sort of switches are forgotten in these
    cases. Crucially, there’s also more than enough room to use the full screen. In
    addition, it has mounts to fix to the wall, much like the SPI-Box does. As it
    technically only needs power and maybe a wireless dongle, it can be a great portable
    Pi or a cheap home automation controller on the wall – the only thing really hampering
    that is the depth of the full unit, although that’s not the case’s fault.


    If you like the idea of the screen and case but are baulking at the idea of buying
    a screen, assembling it, and then making the whole setup work on your Raspberry
    Pi, then SB Components also offers a bundle kit (magpi.cc/2drz490). At only £29.99
    ($43) on top of the Raspberry Pi, you basically get the kit to create a portable
    Pi for just over £50 in total.


    # Related


    # PI BOW PITFT+


    The updated PITFT PiBow allows for the slightly larger second version of Adafruit''s
    PITFT screen on the Pi Model 2 and B+.


    ![](img/d8322379620245fcd21eccc3855b8c78_187_1.png)


    £13.50 / $19.95

