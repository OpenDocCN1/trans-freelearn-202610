    # In control


    In the controller, a touchscreen interfaces to the CNC controller, running on
    a Pi 2 with Zapmaker software: on screen, the control software’s grey, pleasingly
    industrial panel complements the electrical box used as a casing. The Pi communicates
    with an Arduino Uno board, which uses Grbl to control the stepper motors. The
    Grbl handling of the Arduino is quite sophisticated – you can send a one-line
    command such as ‘a circle to here, of this diameter,’ and it will work out the
    cuts for you.


    The power supply is a heavy-duty 24V unit from some LED lights. 12V and 5V step-down
    transformers provide power for the LCD screen, Raspberry Pi, stepper motors, Arduino,
    and shields. The shield controlling the motors can become very hot, and so a small
    fan is used to cool it.


    Eagle-eyed readers will have spotted the extra board between the Arduino and the
    controller shield – this is a buffer board installed after the early prototype
    kept switching off. “Someone said you need a filter between the Arduino and the
    CNC controller board,” says Mark. A filtering board stops current bleeding through
    from the motors to the relays for the end stops and switching off the device.
    This has fixed the problem: “I’ve checked the voltage drop now on the end stops;
    it stays at a constant 5 volts.”


    # Making the cut


    Before use, G-code is needed to give the coordinates for cutting. The logo in
    the pictures was converted into a black and white image, then into vectors – as
    well as optimising the cutting path, and the correct cutting head. FreeCAD is
    used by many CNC makers, but needs some form of CAM plug-in to generate the G-code
    and the cutting path.


    The G-code is just lines of coordinates. The CAD/CAM software has the job of generating
    it, together with the cutting path that makes the most sense – a CNC machine’s
    version of computing’s famous travelling salesman


    # BUILDING A PI CNC MACHINE


