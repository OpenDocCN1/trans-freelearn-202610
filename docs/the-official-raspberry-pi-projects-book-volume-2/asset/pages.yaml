  md: '# Tutorial


    # WALKTHROUGH


    # EVERYDAY ENGINEERING


    # PART 10


    # SIMON MONK


    Simon Monk is the author of the Raspberry Pi Cookbook and Programming the Raspberry
    Pi: Getting Started with Python, among others.

    simonmonk.org

    monkmakes.com


    ![](img/d8322379620245fcd21eccc3855b8c78_129_0.png)


    USB WiFi adaptor


    An accurate DS18B20 temperature sensor


    # PIPE TEMPERATURE MONITOR


    Solve real-world electronic and engineering problems with your Raspberry Pi and
    the help of renowned technology hacker and author, Simon Monk


    # You''ll Need


    +   - Encapsulated DS18B20 (eBay, Adafruit, Proto Pic)

    +   - 47k resistor (often supplied with DS18B20)

    +   - Three-way screw terminal block

    +   - 3x female-to-male jumper wires

    +   - USB WiFi adaptor

    +   - Small food container as an enclosure

    +   - Drill


    At this time of year, our roof spaces can get pretty chilly and if there are pipes
    up there, there is a chance they could freeze. As anyone who’s put a bottle of
    wine in the freezer to cool and then forgotten about it knows, ice takes up more
    space than water and can burst pipes as it expands. This is often only discovered
    when the ice thaws again and your bedroom has water dribbing through the ceiling.
    This project monitors the temperature of your pipe and uses the If This Then That
    (IFTTT) web service to alert you by email or other mechanism of your choice if
    the temperature falls below a threshold that you set. IFTTT is a web service that
    allows you to set up triggers that then cause an action. For example, you could
    create an IFTTT ‘Recipe’ that sends you an email (Action) whenever someone mentions
    you on Twitter (Trigger). As well as actions and triggers from all sorts of social
    media and email services, IFTTT can also be set up to work with physical events
    like the temperature measured by a temperature sensor falling below some threshold.


    The way this works is that the Raspberry Pi sends a web request to IFTTT as a
    trigger and then IFTTT performs whatever action you have specified for it. In
    this case, the trigger is to send an email. The various channels available to
    IFTTT often require their own logins, so IFTTT will from time to time ask you
    to enter a user name and password for a particular channel.


    # WARNING!


    Do not rely solely on this project to protect your pipes from frost. This is a
    DIY project intended to illustrate the principles of making a temperature monitor
    and is in no way guaranteed to protect your home.'
  merge: -1
  img_proc: true
- pgno: 130
  md: '![](img/d8322379620245fcd21eccc3855b8c78_130_0.png)


    # BUILDING THE PROJECT


    This is a pretty straightforward project to build. There is no soldering to be
    done, although if you have a soldering iron, tinning the ends of the wires from
    the sensor leads to make them a bit thicker makes it easier to catch them in the
    terminal block.


    ![](img/d8322379620245fcd21eccc3855b8c78_130_1.png)


    > DS18B20 is a digital device, accurate to ±0.5 degrees C


    As you’ll see from the list of required components, this project does not call
    for any soldering. The leads to the temperature probe are connected to the Raspberry
    Pi GPIO pins using a combination of electrical terminal block and female-to-male
    jumper wires. You will find the screw terminal block at any DIY or hardware store
    that sells electrical supplies.


    # DS18B20 temperature sensor


    The DS18B20 is a sensor temperature chip that is available in a standard 3-pin
    transistor-like package, or built into an encapsulated sensor with a long lead.
    In this project we chose the encapsulated version, but you could also use the
    3-pin package version on a breadboard. The chip requires there to be a 4.7kΩ resistor
    between its data and positive supply pins. The chip itself will work with 5V or
    3.3V logic, but you must connect the positive supply to 3.3V when using it with
    a Raspberry Pi to prevent damage to the Pi GPIO pin that it is connected to. Temperature
    sensors are often quite inaccurate, but the DS18B20 is a digital device that is
    accurate to ±0.5 degrees Celsius. The IC uses a single GPIO pin on the Raspberry
    Pi using an interface called the 1-wire. Temperature readings are sent as serial
    data to the Raspberry Pi.


    # Building your pipe monitor


    As with all projects, it is a good idea to run a test and get everything working
    while the parts are all out on your workspace. Once you know all is well, you
    can install the project in its enclosure.


    # >STEP-01 Connect female header leads


    Put the red (positive supply), black (ground), and yellow (data) wires from the
    temperature probe into the screw terminal, with the leads of the resistor between
    the red and yellow wires. You may find it helps to wrap the bare ends of the wires
    around the resistor leads before tightening up the screw terminals. Fit the male
    ends of the jumper wires into other half of the terminal block. Your probe lead
    may also have a separate bare wire connector to the lead’s screening; you do not
    need to connect this to anything.


    ![](img/d8322379620245fcd21eccc3855b8c78_130_2.png)


    # >STEP-02 Connect the temperature sensor


    Connect the positive supply lead to the 3.3V GPIO pin, the black ground lead of
    the sensor to one of the GND pins on the GPIO header, and the data lead to GPIO
    4. Using a GPIO pin template such as the Raspberry Leaf makes it much easier to
    find the right pins. We used a food container that would hold both the screw terminal
    and the Raspberry Pi and drilled holes for the USB power and sensor leads. The
    knot in the sensor lead is to stop the connections being pulled off, and the electrical
    tape prevents the resistor leads from accidentally shorting anything on the GPIO
    pins.'
