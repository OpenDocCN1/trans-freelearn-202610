  md: '![](img/d8322379620245fcd21eccc3855b8c78_53_0.png)


    Above Each panel moves out in proportion to its Pi''s workload


    # Scaling it up


    Having started out with a modest budget, the project was gradually scaled up via
    three prototype stages, which used first one Raspberry Pi, then nine, and then
    30 (see ‘Prototyping process’ boxout). Extra funding was subsequently provided
    by the National Science Foundation and Virginia Tech’s own Institute for Creativity,
    Arts and Technology, which enabled it to be scaled up to the final 256-node version.


    SeeMore’s mechanisms were all custom-made and designed by Sam, and their design
    evolved over time. Most notably, the articulating arms that move the panel-mounted
    Pis were designed specifically to create a more fluid effect. “The movement of
    the Raspberry Pis is actually a curve… so it doesn’t just flap out, it articulates
    outward,” says Sam. “It has a double linkage that some might see as superfluous,
    or overly complex, but I think that what you get… is this waveform that relates
    to these ideas of fluidity and that springs from what a lot of parallel computers
    are built to process: things like weather simulation or fluid dynamics.”


    When SeeMore was exhibited recently at the World Maker Faire in New York City,
    it was set up with a local open-source database to enable users to search (via
    a custom touchscreen) for points of interest around a given subway stop. Kirk
    tells us that multiple steps are required to for such a task. “The first is to
    break this problem into smaller sub-tasks such as having each Pi search part of
    a very large database of points of interest. In this example, the Pis in our cluster
    would be assigned portions of a database to search and all of them would be given
    the same subway stop as their ‘token’ to use in the search. This divide-and-conquer
    approach is a common algorithm used in parallel computing and this example is
    similar to the algorithm used in Google search and demonstrated on SeeMore.”


    # BUILD CONTINUED...


    ![](img/d8322379620245fcd21eccc3855b8c78_53_1.png)


    # >STEP-04 Assembling the frame


    The metal framework''s circular sections are made up of two arcs for easier assembly.
    Furman power blocks screwed into the frame supply the electricity via wall-warts
    with twin USB ports to power each Pi and servo separately.


    ![](img/d8322379620245fcd21eccc3855b8c78_53_2.png)


    # >STEP-05 Servos galore


    256 Hi-Tec HS-7966HB servos are used to move the articulating arms and therefore
    the attached Raspberry Pi panels. When exhibiting SeeMore at an event, the team
    have spare components on standby just in case anything should fail.


    ![](img/d8322379620245fcd21eccc3855b8c78_53_3.png)


    # >STEP-06 Plastic panels


    Each plastic panel is etched with that Pi''s IP address. Networking them together
    isn''t that great a challenge since all the Ethernet cables run down to the inner
    base, where they can be connected (in any order) to six 48-port Ethernet switches.'
