    # The build


    “I’ve made the complete CNC out of marine ply, all handcrafted, and mounted a
    DeWalt router to do the cutting,” Mark reveals, “using the Raspberry Pi 2 as the
    controller, which runs a bit of software called CNC Zapmaker, which passes the
    instructions in G-code to an Arduino Uno. This runs a version of Grbl controller,
    which has a CNC shield connected to it that drives the three X Y Z stepper motors.”
    “This is just an overview,” admits Mark. “The controller and machine took about
    two months to build: mainly evenings.” In that time, Mark also had to build the
    physical apparatus of the cutting machine – a 1000mm long, 500mm wide, 700mm high
    framework, with tracks for clamping the wood, trapezoidal bars for the stepper
    motors to drive across each axis, and a lot of cabling.


    With 200 steps per revolution (on the current setting), the motors allow precision
    control of movement. One revolution moves the cutting tool 2mm, so one step is
    just 10 micrometres! – with one thou (a thousandth of an inch), the traditional
    measure of fine tolerances in engineering, equaling circa 25 micrometres, this
    is extremely precise for woodcutting. Theoretically re-gearing the stepper motors
    could improve this again, but that fine a level of detail would be lost against
    the size of the grain of the wood. The stepper motors – around £12 each from China
    – have a power of 107oz holding torque; add in Mark’s use of trapezoid rods and
    heavy-duty fixing bars, rather than the threaded rod and drawer rails used in
    budget CNC home-builds, and we have a strongly engineered machine that’s built
    to last. Yet, including all the electronics as well as the other hardware, the
    build price was around £400. A decade ago, you’d find similar


