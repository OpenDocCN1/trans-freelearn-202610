  md: '# Maker Says


    > Easy

    > to install,

    > simple to

    > use, a joy

    > to watch

    > Lightberry


    ![](img/d8322379620245fcd21eccc3855b8c78_167_0.png)


    # LIGHTBERRY


    Russell Barnes tests a technology designed to add a new dimension to your home
    cinema experience


    Lightberry is inspired by a TV technology pioneered by Philips called Ambilight.
    While the tech naturally comes pre-fitted on Ambilight TVs, it''s perfectly possible
    to modify any TV to add its special kind of ambience-enhancing trickery. What
    does it do? The premise is simple: you affix a ring of colour-switching LED lights
    to the back of your LCD TV and – assuming your TV is against a wall and the ambient
    lighting is low – the colours on the LEDs are designed to perfectly sync with
    the action on screen in colour and intensity, so that light appears to bleed out
    of the screen and dance against the wall in the background. As with Philips''
    creation, Lightberry – which harnesses the power of the Raspberry Pi for computation
    – is all about adding a little more immersion into your viewing experience. While
    the idea is simple, the technology behind it certainly isn''t, though for most
    people the results really do speak for themselves.


    Sold either as a full kit starting from just over £50 / $80, or as constituent
    parts available separately, Lightberry is designed to take the pain out of the
    technical aspects, giving you as close to a plug-and-play experience as you could
    hope for. Obviously, sampling millions of pixels of onscreen data and converting
    that to the right LED, colour and brightness at exactly the right moment isn''t
    the simplest project to tackle, but Lightberry manages to make it easy. It''s
    also designed to work perfectly with the best software solutions for this technology,
    too, including Hyperion and Boblight. Once you''ve picked the right length LED
    strip to fit your particular size of TV and ordered all the kit you need, it all
    arrives boxed and ready to assemble. While we found no instructions in our box,


    magpi.cc/2drsyPG offers brief but functional step-by-step instructions to get
    you up and running. Probably the fiddliest part of the process is arranging and
    affixing the LEDs themselves. Elsewhere it simply requires you to connect the
    appropriate converter box, download software and install it onto an SD card –
    a process any Raspberry Pi user should already be intimately aware of.


    # Related


    # PHILIPS AMBILIGHT


    The real alternative to Lightberry is an actual Ambilight TV. The cheapest we
    could find (at the time of writing) was £350. Ouch.


    ![](img/d8322379620245fcd21eccc3855b8c78_167_1.png)


    From £350 / $550

    bit.ly/1Ji6m9Y


    # Last word


    While it can take a little trial and error to best position the LEDs, once you''ve
    hit the sweet spot we found Lightberry a joy to use. It''s not the cheapest Raspberry
    Pi project, but it''s one that is sure to please the movie fans in your household.'
