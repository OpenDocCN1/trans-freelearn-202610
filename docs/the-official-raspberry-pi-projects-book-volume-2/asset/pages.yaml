    git clone https://github.com/simonmonk/pi_magazine.git

    ```


    To run the program, change to the directory where the code for this project lives
    and then run the program using the commands below:


    ```

    cd /home/pi/pi_magazine/08_waterer

    sudo python waterer_server.py

    ```


    This will start a web server running on your Raspberry Pi. You can check this
    by opening a browser window on another computer or your phone and entering the
    IP address of your Pi. Open the terminal and type ifconfig to find yours. If all
    is well, a webpage will be displayed, inviting you to enter a start time and duration
    for the watering.


    # How the code works


    The Python code for this program is pretty heavily commented. You will probably
