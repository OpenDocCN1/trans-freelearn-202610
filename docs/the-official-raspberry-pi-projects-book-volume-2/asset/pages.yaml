  md: '# QUAKE III MOUSE


    Wouldn’t it be great if you could put an entire computer into a gaming mouse?
    Yes. Yes, it would…


    # You''ll Need


    +   - Gaming mouse

    +     – eBay

    +   - Mini HDMI cable

    +     amazon.com

    +   - 2× micro USB-to-USB cables

    +     amazon.com

    +   - Quake III files

    +     (that you own legitimately)


    ![](img/d8322379620245fcd21eccc3855b8c78_159_0.png)


    We''ve used an old Razer mouse from eBay for our project. You''ll need to gut
    some of the plastic housing to make room for your Zero


    This is the mouse USB cable. We''ve snipped it off and soldered a micro USB connector
    on the end, which fits directly into the Pi Zero


    We picked a really slim mini HDMI-to-HDMI cable so we could fit it in the mouse.
    You''ll likely need to remove the connector housing too


    #PiZero


    When the Pi Zero was first announced internally, Raspberry Pi’s Eben Upton came
    up with the idea of putting one in a gaming mouse and installing Quake III on
    it. Our heads exploded. Since modern gaming mice have so many buttons, it’s actually
    pretty trivial to tweak the control settings so that running and jumping can be
    controlled without the need for a keyboard at all. In essence, a lot of what we’re
    doing with this project is an extension of the SNES Consoller project elsewhere
    in this feature: gut a gaming


    mouse (most of it is just empty, ergonomically shaped plastic anyway), connect
    its USB to the Zero internally, and you’re pretty much done and dusted. Of course,
    these things are invariably easier said than done, and it did take a few shopping
    trips on eBay to find a suitable mouse contender. We settled on an old Razer Lachesis
    from around 2009. It has a scroll wheel, two buttons directly behind said wheel,
    and two buttons on each side of the mouse. It also has enough dead space inside
    to fit our Pi Zero and HDMI cable. Perfect.


    Since there’s a lot more going on inside a gaming mouse than a retro controller,
    we had to do away with our plan to battery-power the Quake III mouse quite early
    on. The end result means that along with the HDMI cable coming out of the front
    in place of the original USB connector, we’ve also got a slimline (but ultra-long)
    micro USB-to-USB cable. Said cables are easily sleeved or tape-wrapped together,
    though, and most TVs these days offer USB ports that supply enough power to run
    the Pi Zero. Ultimately, it’s a small compromise.'
