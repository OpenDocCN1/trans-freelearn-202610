    and find any sticking points that need adjustment. We found that we had to remove
    some of the support struts for the screws, but we made sure at least two (the
    far left and right ones) were left intact so we could still securely fasten the
    case.


    # Soldering the micro USBs


    In terms of practical hands-on work left to do, we’re nearly there. The final
    task is to physically connect the Pi Zero to the USB cables and the PowerBoost.
    With the power, it’s perfectly fine to solder the 5V and ground pins from the
    PowerBoost directly to the 5V and ground pins on your Pi Zero’s GPIO, but since
    you’ll likely want to use your Pi Zero for something else in


    ![](img/d8322379620245fcd21eccc3855b8c78_152_2.png)


    the future, we’ve decided to take the less invasive route of ripping up a separate
    micro USB cable and soldering that to the PowerBoost instead. The great thing
    about USB is that the four colour-coded cables are the same, regardless of USB
    size: two for power and two for control.


    > The great thing about USB is that the four colour-coded cables are the same,
    regardless of USB size


    To power the Pi Zero, we only need the red and black cables; power and ground,
    respectively. These go to the two outer connectors on your micro USB cable – with
    the longest flat edge of the connector facing up and towards you, ground is on
    the left. Just search for ‘micro USB cable connectors’ for a handy diagram to
    refer to. Simply solder the ground and power cables to the 5V and ground pins
    on your PowerBoost – it’s really that easy. Connect it to your Zero for testing
    – assuming you have a correctly configured SD card in your Pi Zero, it should
    light up as normal when the power switch is turned on. Connecting the controller
    micro USB is just as easy. With the longest edge of the micro USB


    header facing up and towards you, the colour-coded USB cables you snipped off
    earlier are soldered from left to right as black, green, white, and then red.
    With the micro USB connector soldered, all you need to do now is preconfigure
    your Pi Zero with RetroPie and you’re ready to go!


    # Setting up RetroPie


    That’s it – you’ve done the hard part! Now all you’ve got to do is follow the
    instructions at magpi.cc/Retro-Pie to set it up on the microSD card to slot into
    your Pi Zero. It already has a version that supports Pi Zero. Since there’s no
    room for WiFi in your Consoller, we heartily recommend you set it up using a USB
    hub with keyboard and mouse, making sure you load all the games you want and scraping
    the internet for synopses and images in advance. We can’t help you acquire games
    for obvious reasons, but search engines are most certainly your friend. Once complete,
    simply load it in your project Pi Zero, close up the case and power up for some
    serious retro gaming action!


    Tip

    RETROPIE

    We love RetroPie. It’s the Kodi or openELEC (home theatre front-end) of the retro
    gaming world. Grab it from magpi.cc/Retro-Pie


    Tip

    3.7V 500MAH BATTERY

    You’ll need to carefully check the dimensions of your case against the dimensions
    of your chosen battery to make sure it fits correctly. It’ll be snug, but it’s
    easily done.'
