- pgno: 92
  md: '# CREATE A CLUSTER


    ![](img/d8322379620245fcd21eccc3855b8c78_92_0.png)


    # >STEP-01

    Set yourself up


    To start with, all you need to do is slot in your Raspberry Pi Zeros. It works
    with as few as one and as many as 16 at a time.


    ![](img/d8322379620245fcd21eccc3855b8c78_92_1.png)


    # >STEP-02

    Hook it up


    The next step is to connect it all up. The Ethernet switch and cables should go
    in first, followed by the AC adapter to power it.


    ![](img/d8322379620245fcd21eccc3855b8c78_92_2.png)


    # >STEP-03

    Work in parallel


    That’s it! Turn it on and you can program it using MPI or any other methods that
    utilise multiple Pi Zeros at the same time.


    ![](img/d8322379620245fcd21eccc3855b8c78_92_3.png)


    Above The Pi Zero is plugged in via its micro USB power and data ports. Each unit
    also requires an SD card with an operating system installed


    Below The Pi-powered sensor that necessitated the creation of the Pi Zero Cluster
    board. It attaches to standard light fittings


    It’s had a huge reaction online, with many people excited by the idea of the board.
    However, Koichi believes it’s quite a simple project:


    “PiZero Cluster Board is just a collection of 16 identical circuits. Each circuit
    draws one Ethernet port and one USB port from [each] Raspberry Pi Zero’s micro
    USB port, using an SMSC LAN9512 chip. There are also 16 power supply circuits
    to generate 5V and 3.3V from a 12V single power source for


    ![](img/d8322379620245fcd21eccc3855b8c78_92_4.png)


    ![](img/d8322379620245fcd21eccc3855b8c78_92_5.png)


    > We plan to create a cluster to enable setup of hundreds of our devices a day


    Raspberry Pi Zero and LAN9512. All 16 circuits are the same.”


    With Pi Zeros in short supply, the team were unable to secure enough to complete
    the cluster at first. Fortunately, we at The


    MagPi managed to call in every favour, pull every string, and beg, plead and borrow
    to get them the remaining 15 Pi Zeros they needed for tests.


    Due to the popularity of the board and its many uses, Koichi plans to put it on
    Kickstarter once they’re ready to crowdfund it. It will be an improved version
    of the prototype we’ve seen online.


    “In our current plan, the number of Raspberry Pi Zeros and USB ports is reduced
    to 14,” Koichi tells us. “We’ll also add an on-board Ethernet switch to the board,
    and the number of ports is reduced to two.” This improvement will reduce the number
    of Ethernet ports and cables required, and so lower the board’s overall cost.


    ![](img/d8322379620245fcd21eccc3855b8c78_92_6.png)


    The insides of Actbulb are a lot more complex than a normal light bulb'
