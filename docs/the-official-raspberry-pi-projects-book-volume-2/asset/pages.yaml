    There are now a few books to answer that ‘where do I go next with Python?’ question,
    but Fluent Python makes a persuasive case for a place on your bookshelf or SSD.
    Ramalho delivers all of the good things about Python that you may miss when coming
    from another language, as Python has many features that are unique or only found
    in a few languages. All this without straying far from the core language and standard
    library.


    but poorly documented features in Python, like coroutines, every chapter contains
    something to make you a better programmer. Some will impress straight away, while
    others make subtle improvements to your future code.


    Fluent Python is split into six sections, books-within-the-book. The first gives
    essential insights into the data model, the rest can be read in any order as desired;
    it covers topics such as collections (sequences, mapping, sets), functions as
    first class objects, building classes, generators, concurrency, and much more.
    The REPL is used throughout for hands-on learning, and there are many glimpses
    into the workings of the very welcoming Python community. Destined to be another
    O’Reilly classic.


    From the power of slicing operators on lists, through duck typing on the Vector
    Space Model, to unlocking some of the powerful


    # Score ★★★★★


    # PYTHON PARALLEL PROGRAMMING COOKBOOK


    Author: Giancarlo Zaccone

    Publisher: Packt

    Price: £31.99

    ISBN: 978-1785289583

    magpi.cc/1SN gPYZ


    ![](img/d8322379620245fcd21eccc3855b8c78_197_4.png)


    A cookbook but also a tutorial, teaching parallel programming with the aid of
    Python as much as parallel programming with Python. Python 3 is used in all but
    the GPU programming chapter, which mostly uses Nvidia’s CUDA – not relevant on
    the Pi – but it also covers PyOpenCL.


    The introductory chapter delves into Von Neumann architecture and shared memory
    schemes to build a picture of the parallel programmer’s operating environment,
    then tackles Python’s biggest problem for concurrent programmers, the Global Interpreter
    Lock (GIL). Starting with the threading package for traditional


    multi-threading, Zaccone goes from how to do it to how it works in each example,
    building through semaphores, conditions, and queues.


    He moves onto process-based parallelism, with a useful exploration of collective
    communication; asynchronous programming, including Python 3.2’s concurrent.futures
    module, Asyncio to manage events and coroutines, task manipulation, and the Future
    class; the Celery framework to handle distribution across machines, and other
    useful libraries. Occasional idiosyncrasies in English usage – not the author’s
    first language – could have been tidied up, but technical content is spot on and
    worth the rare need to re-read a sentence for clarity. A good introduction and
    useful reference on parallel programming.


    # Score ★★★★☆'
