  md: '# RASPBERRY PI BESTSELLERS


    # APRESS


    Apress has several practical books for Pi users. Here''s our pick from the most
    popular


    # LEARN RASPBERRY PI PROGRAMMING WITH PYTHON


    Author: Wolfram Donat

    Publisher: Apress

    Price: £17.50

    ISBN: 978-1430264248

    bit.ly/1LeMgN6


    ![](img/d8322379620245fcd21eccc3855b8c78_191_0.png)


    Project-based Python intro for the Pi: make a web spider, a weather station, a
    media server, a home security system, an underwater photography system, and a
    near-space weather balloon with a camera.


    # RASPBERRY PI HARDWARE REFERENCE


    Authors: Warren Gay

    Publisher: Apress

    Price: £11.50

    ISBN: 978-1484208007

    bit.ly/1kWUipn


    ![](img/d8322379620245fcd21eccc3855b8c78_191_1.png)


    Delve deep into the Pi''s workings for your sensor project: power, memory, USB,
    Ethernet, SD cards, I2C, GPIO, and the UART (serial) interface. With test code
    in C.


    # BEGINNING SENSOR NETWORKS WITH ARDUINO AND RASPBERRY PI


    Authors: Charles Bell

    Publisher: Apress

    Price: £23.50

    ISBN: 978-1430258247

    bit.ly/1uu1HaB


    ![](img/d8322379620245fcd21eccc3855b8c78_191_2.png)


    Build a Raspberry Pi-based sensor node, then connect Arduino sensor nodes and
    XBee radio modules to the Pi, and collect data on a Pi-hosted MySQL database server.


    # RASPBERRY PI FOR KIDS


    Author: Richard Wentk

    Publisher: Wiley

    Price: £21.99

    ISBN: 978-111904951-7

    bit.ly/1K7C41E


    ![](img/d8322379620245fcd21eccc3855b8c78_191_3.png)


    A well-paced introduction that goes from setting up to programming and debugging,
    embracing command line skills along the way. Fun software projects – like Turtles
    and Minecraft (controlling both with Python), simple and dynamic websites, and
    using a webcam – introduce many useful computing skills. Remembering the intended
    target audience, the inevitable setting-up chapters are both necessary and well
    judged, with details on cables and other information to enable younger makers
    to get going without adult help.


    Ignoring the ‘For Kids’ branding, this book would be a valuable start for any
    nervous adult computer user keen to gain Pi enlightenment. From command line and
    nano, to Python, choosing a web server and learning programming skills, Wentk
    introduces and teaches using Raspbian. He does so in a clear style with gentle
    humour and an ability to make each learning challenge approachable.


    PHP may be losing its lustre but it gives the quickest start in working with data,
    and is subsequently used for running shell and Python commands. Running webcam.py
    within PHP then leads on to debugging web problems, fixing Unix file permissions,
    and testing your software – all essential skills for growing your knowledge after
    finishing the book.


    ![](img/d8322379620245fcd21eccc3855b8c78_191_4.png)


    # FUNCTIONAL PROGRAMMING IN PYTHON


    Author: David Mertz

    Publisher: O''Reilly

    Price: Free PDF download

    oreil.ly/1KcIHgo


    ![](img/d8322379620245fcd21eccc3855b8c78_191_5.png)


    Functional programming “worries about what is to be computed rather than how it
    is to be computed,” preferring the evaluation of expressions over statements,
    and treating functions as first-class objects (you can pass a function to another
    function as if it were a piece of data). Python, despite not being a functional
    programming language, is “a multiparadigm language that makes functional programming
    easy to do when desired, and easy to mix with other programming styles.” Right
    from the first chapter, ‘(Avoiding) Flow Control’, the author (a Python Software


    Foundation director and sometime philosopher) brings you code that is subtly altered
    from imperative samples, with changes that won’t alarm you but will work softly
    on your brain, cumulatively helping to shift focus from the ‘how’ to the ‘what’.


    > “Simply changing the form of expression can often make a surprisingly large
    difference in how we reason about code and how easy it is to understand,” says
    Mertz, as he uses list comprehensions, generators, and dictionaries and sets to
    abstract the ‘how’ and reorder our thinking on data, working up to lazy evaluation
    and higher-order functions (those that call or generate other functions).


    A good, quick introduction for all Pythonistas looking beyond OOP.


    ![](img/d8322379620245fcd21eccc3855b8c78_191_6.png)'
