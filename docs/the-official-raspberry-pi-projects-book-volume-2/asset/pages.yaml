  md: '# Maker Says


    > A Pi-based piano, transformed with Pimoroni''s signature polish

    > Pimoroni


    ![](img/d8322379620245fcd21eccc3855b8c78_165_0.png)


    pimoroni.com


    £15 / $24


    # PIANO HAT


    Les Pounder looks at a HAT-based piano keyboard which uses capacitive touch keys
    for input


    In 2014, a 14-year-old called Zachary Igielman launched a successful crowdfunding
    campaign for his Pi Piano. Originally created using a MCP23017 GPIO expander and
    a series of momentary switches, the Pi Piano used a piezo buzzer to simulate the
    tone of a note. One of Zachary’s advisors was Phil Howard from Pimoroni, who worked
    with Zachary to create this new and improved version.


    # Crowdfunded project


    The latest incarnation is now known as Piano HAT and uses a capacitive touch-based
    interface to simulate a portion of a traditional piano keyboard. The board measures
    64mm by 56mm and fits neatly on top of the models A+, B+, and Pi 2. Being a HAT
    board, it also attaches to all 40 of the GPIO pins. As well as the keyboard, we
    have the ability to raise and lower the octaves and change instruments via three
    extra inputs on the board.


    Hardware is just one part of this project, and the software which supports Piano
    HAT is all based on Python, which enables existing projects created in this language
    to easily integrate Piano HAT. Phil Howard has written a series of examples which
    use the Pygame library to demonstrate how to use Piano HAT as a typical piano
    via a series of audio samples, which can be swapped for any types of sounds should
    you wish to build your own input. Piano HAT also comes with a tutorial which demonstrates
    using the built-in LEDs to teach playing a simple tune, in this case ‘Twinkle,
    twinkle, little star’. So, using this library, we can code our own tutorial for
    others to learn with.


    # Powerful MIDI synthesiser


    Software is not just limited to simple samples. In fact, Phil has supplied a number
    of methods to connect the Piano HAT library to a MIDI service running on your
    Pi. This then turns the Piano HAT into a powerful synthesiser input for software
    such as Yoshimi and SunVox, although a Raspberry Pi 2 is required for these applications.


    The Piano HAT looks like a rather simple board, but thanks to a clear Python library,
    well-built hardware, and a powerful MIDI control option, we have a board for musical
    adventures.


    # Related


    # MAKEY MAKEY


    This versatile board has been used to build a piano from stairs, a camera trigger
    using water, and a keyboard from pasta.


    ![](img/d8322379620245fcd21eccc3855b8c78_165_1.png)


    £40 / $50

    makeymakey.com


    # Last word


    Such a simple board, but with limitless applications thanks to Python and MIDI.
    This is a great platform for musical experimentation and it can easily be used
    with Minecraft and other projects.

    ★★★★☆'
  merge: -1
