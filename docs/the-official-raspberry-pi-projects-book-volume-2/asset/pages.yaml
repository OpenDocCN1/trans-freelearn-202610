  md: '# Feature

    MORE #PIZERO PROJECTS!


    # SLACKTIVITY MONITOR


    Track Slack chat activity with this LED display. You’ll know at a glance if there’s
    quiet, light chatter, or raucous debate


    To communicate within the Raspberry Pi Foundation we use Slack, the IRC-like chat
    service. There can be a lot of activity, and it’s taken time for people to get
    their notification settings just right. But we wanted more than what Slack’s notifications
    can provide. We wanted to be able to see at a glance how much chatter was going
    on among colleagues. Luckily, Slack’s API and Python libraries are powerful and
    easy to work with. Assembly is easy and the materials inexpensive, especially
    if you use a Pi Zero.


    # Initial configuration


    To set up your own Slacktivity Monitor, start from a fresh install of Raspbian.
    For the Raspberry Pi Zero, you need to use Raspbian Jessie, which can be found
    on NOOBS or be written to the SD card using the image found on the Raspberry Pi
    download page (raspberrypi.org/downloads). Like with other Raspberry Pi Zero projects,
    it’s probably easiest


    to get everything configured and installed with a Raspberry Pi 2 or B+ and then
    move the microSD card to the Pi Zero when you’re ready. Make sure to do the necessary
    updates by going into the terminal and using:


    ```

    sudo apt-get update

    sudo apt-get upgrade

    ```


    You’ll need to set some basic configuration options. From the desktop, go to Raspberry
    Pi Configuration in the Preferences menu. Under the System tab, set your Pi to
    boot to the CLI


    # You’ll Need


    +   - Pi Traffic Light

    +     magpi.cc/1VamjoL

    +   - WiFi adaptor

    +   - Right-angle header pins

    +   - Soldering iron and solder

    +   - Blu-Tack or Command Strips


    ![](img/d8322379620245fcd21eccc3855b8c78_155_0.png)


    Use the type of header pins that work best for your desired configuration


    The Pi Traffic Light from Low Voltage Labs makes connecting the three LEDs easy


    Command Strips are a great way to temporarily mount projects exactly where you
    want them


    ![](img/d8322379620245fcd21eccc3855b8c78_155_1.png)


    The Slacktivity Monitor is small and light enough to be mounted to a display with
    Blu-Tack or Command Strips.'
