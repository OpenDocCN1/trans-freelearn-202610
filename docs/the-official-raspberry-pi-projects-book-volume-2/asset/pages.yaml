- pgno: 110
  md: "# >STEP-02\n\n# Destroy the world\n\nRemove the Earth from its mount by pulling\
    \ the pegs of the holder out of the holes in the Arctic and Antarctic. Next, split\
    \ it in half along the equator by pulling the two hemispheres apart. It should\
    \ disassemble fairly easily with a little force applied in the correct places.\
    \ You’ll want to fashion a new mount to stop the globe rolling around, whilst\
    \ still allowing the power cable to exit from the bottom hole – you could use\
    \ the inside of a roll of tape. You can cut a small slot with a knife to allow\
    \ the wire to enter.\n\n# >STEP-03\n\n# Mount inside globe\n\nAttach your new\
    \ LED bulb to the inside of the globe. Mount the neck of the bottle over the lower\
    \ hole with Blu-Tack or putty; it should be sturdy enough to support the weight\
    \ of the Pi resting on top of it. Mount the Sense HAT on the Pi, and then place\
    \ both on top of the upturned bottle. Attach a USB WiFi dongle to the Pi (unless\
    \ you’re using wired Ethernet), otherwise it will wake you at the wrong time.\
    \ This is because the Pi requires internet access to set its clock.\n\n# >STEP-04\n\
    \n# Route the power\n\nYou’ll probably need to cut and reconnect the power cable\
    \ to fit it through the hole. The official Pi power supply uses bell wire, which\
    \ makes it easy to reconnect with a screw terminal (choc block). Unfortunately,\
    \ it doesn’t supply enough power to use the LEDs at full brightness and also run\
    \ the Pi. Cut the cable and insert the supply end through the hole. Tie a knot\
    \ in the cable to stop it from being pulled back through. Separate the two power\
    \ cores from both ends and strip the insulation. Reconnect with a choc block,\
    \ matching the polarity.\n\n# >STEP-05\n\n# Download the code\n\nClone the code\
    \ from the GitHub repository into your home folder:\n\n```\ngit clone https://github.com/jpsingleton/pi-glowbe.git\n\
    ```\n\nIf you’re only using part of the hardware or a different LED strip, you\
    \ can adapt the code to your needs. You may also need to install the Sense HAT\
    \ software if you’re running an older version of Raspbian – follow the instructions\
    \ at magpi.cc/1KboHnN. You may also want to disable the LEDs on the Pi so they\
    \ don’t disturb your sleep. Newer models can do this in software, otherwise you\
    \ could tape over them, or even de-solder them if you’re brave enough.\n\n# wakeup.py\n\
    \nLanguage\n>PYTHON 2.7\nDOWNLOAD:\nmagpi.cc/1TUKdz7\n\n```\nfrom BlinkyTape import\
    \ BlinkyTape\nfrom sense_hat import SenseHat\nfrom time import sleep\nimport optparse\n\
    \n# Default Blinky Tape port on Raspberry Pi is /dev/ttyACM0\nparser = optparse.OptionParser()\n\
    parser.add_option(\"-p\", \"--port\", dest=\"portname\",\n                  help=\"\
    serial port (ex: /dev/ttyACM0)\",\n                  default=\"/dev/ttyACM0\"\
    )\n(options, args) = parser.parse_args()\n\nif options.portname is not None:\n\
    \    port = options.portname\nelse:\n    print \"Usage: python wakeup.py -p <port\
    \ name>\"\n    print \"(ex.: python wakeup.py -p /dev/ttyACM0)\"\n    exit()\n\
    \nsense = SenseHat()\nbt = BlinkyTape(port)\n\n# wake phase - gradually get brighter,\
    \ linearly\nsleepTime = 18 # 18 sec for 30 min in 100 steps\nmaxPower = 100 #\
    \ flickers or cuts out above 100\n\nfor y in xrange(maxPower):\n    sense.clear(y\
    \ * 2, y * 2, y * 2)\n    for x in xrange(sleepTime):\n        bt.displayColor(y,\
    \ y, y)\n        sleep(1)\n\n# on phase - at full brightness for the same time\n\
    sense.clear(255, 255, 255)\nfor z in xrange(maxPower * sleepTime):\n    bt.displayColor(maxPower,\
    \ maxPower, maxPower)\n    sleep(1)\n\n# tidy up\nsense.clear()\n```\n\n# >STEP-06\n\
    \n# Set up your schedule\n\nWe’ll run the code with cron. It should start about\
    \ half an hour before you get up and probably only on weekdays. Launch the cron\
    \ configuration by typing the following into a terminal:\n\n```\ncrontab -e\n\
    ```\n\nNext, set it up by adding the following line to the end:\n\n```\n15 6 *\
    \ * 1-5 python /home/pi/pi-glowbe/wakeup.py\n```\n\nThis will run the code every\
    \ weekday at 06:15, so change it to meet your needs. Save the file and exit the\
    \ editor (CTRL+X, Y, then ENTER in the default nano). Once happy, reassemble everything\
    \ and wait for morning!"
