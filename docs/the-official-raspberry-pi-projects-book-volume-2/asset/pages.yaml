- pgno: 13
  md: '# USING

    RASPBPIAN


    Getting to grips with the Raspberry Pi’s official operating system


    Raspberry Pi can run many operating systems (OSes), but Raspbian is the official
    OS and the one most newcomers will start with.


    Raspbian is a Linux operating system based on the popular Debian distribution.
    Fully customised for the Raspberry Pi hardware, it’s usually a trouble-free experience
    using a Raspberry Pi with Raspbian.


    One aspect of Linux that will be new to Windows and Mac users is being able to
    choose from different graphical interfaces. Raspbian includes one called LXDE,
    which stands for ‘Lightweight X11 Desktop Environment’.


    This heavily modified version of LXDE enables you to use a Raspberry Pi as you
    would another computer. You have a Menu button,


    which offers access to most of the programs and apps installed. Programs open
    in windows, which you can switch between, minimise, maximise, and close using
    buttons. Many users might be wondering why this is anything special. Well, computers
    didn’t always have windows; instead, most users used a command-line interface
    and entered text commands to start programs.


    # Terminal velocity


    In Raspbian, you’ll probably spend some time working under the hood of the desktop
    in a command-line environment. Next to the Menu button is the terminal, a program
    that enables you to enter Linux text commands. Learning how Linux works, and how
    to create programs that run from the command line, is part of the joy of owning
    a Raspberry Pi. It’s a return to classic computing where you need to learn how
    things actually work.


    Raspbian is a great environment for learning to code. Along with easy access to
    the command line, you get all kinds of programming environments built in: everything
    from MIT’s Scratch to Python and Java.


    ![](img/d8322379620245fcd21eccc3855b8c78_13_0.png)


    It’s possible to buy SD cards pre-formatted with the Raspbian software. This saves
    you from having to install the operating system


    You even get a full working version of Mathematica, a cool maths environment that
    normally costs £190 to buy, with access to real-world data.


    # Office worker


    It isn’t just about programming, though. You can use your Raspberry Pi as a desktop
    computer, and the operating system comes with LibreOffice built in. This is a
    full office suite of programs, similar to Microsoft Office. Its programs include
    Writer (word processing), Calc (spreadsheets),


    You’ll learn how to use the terminal and control your Raspberry Pi computer using
    text commands


    ![](img/d8322379620245fcd21eccc3855b8c78_13_1.png)'
  merge: -1
  img_proc: true
- pgno: 14
  md: '# USING THE RASPBian INTERFACE


    # Programming tools


    Raspbian comes with a selection of coding tools, found under Menu > Programming.
    Scratch makes it easy to learn programming concepts, and popular languages like
    Python and Java are ready to use right out of the box.


    ![](img/d8322379620245fcd21eccc3855b8c78_14_0.png)


    # Web software


    A web browser called Epiphany is built into Raspbian, along with an email program
    called Claws Mail. There are links to Raspberry Pi Resources and The MagPi under
    Menu > Internet.


    ![](img/d8322379620245fcd21eccc3855b8c78_14_1.png)


    # Office suite


    Raspbian features powerful LibreOffice programs like Writer and Impress. These
    are the equivalent of Microsoft Office apps and enable you to create documents
    on your Raspberry Pi.


    ![](img/d8322379620245fcd21eccc3855b8c78_14_2.png)


    Impress (presentations), Draw (vector graphics and flowcharts), Base (databases),
    and Math (formula editing).


    Raspbian connects to the internet and has a built-in web browser called ''Epiphany''.
    You also get an email client called ''Claws Mail''. Both can be accessed under
    Menu > Internet.


    The Raspberry Pi connects to the internet using Ethernet (a cable that runs from
    your Raspberry Pi to a modem/router) or WiFi. It’s easy to connect to a WiFi network,
    and we’ll look at setting up both WiFi and Bluetooth next.


    # Settings and software


    You can adjust the settings for your Raspberry Pi in two ways: using the desktop
    interface or a terminal program called Raspi Config.


    Choose Menu > Preferences to find a collection of different system settings. Add
    / Remove Software can be used to find and remove packages from the Raspberry Pi
    system.


    Appearance Settings, Audio Device Settings, Main Menu Editor and Mouse & Keyboard
    Settings all adjust appearance and interaction


    with Raspbian. Most of the options are self-explanatory.


    The Raspberry Pi Configuration choice provides more in-depth options. Here you
    can change your password (raspberry by default) and the hostname of the Pi on
    the network (raspberrypi by default). You can choose to boot to the desktop or
    the command-line interface (CLI), and enable and disable various hardware interface
    options.


    Raspi Config offers even more detailed options. Open a terminal window and then
    enter sudo raspi-config. A blue screen with options in a grey box appears. Use
    the up and down arrow keys to move between options; press the right and left arrow
    keys to move into an option (and back to the main menu). More information on these
    options can be found at magpi.cc/2bnfuJF.


    The important thing about Raspbian is not to worry about experimenting with different
    options and settings. Feel free to explore the menus, command line, and configuration
    settings. You can always reset your micro SD card with NOOBS and start again.


    The Menu button acts like the Start button in Windows. It''s used to access all
    the programs pre-built into the Raspbian operating system


    Programs open in windows, and a bar for each program appears in the taskbar. Quit
    a program by clicking the Close (X) icon at the top-right of its window


    These Panel items are used to connect to WiFi, set up Bluetooth devices, and control
    settings like Volume. There''s also a CPU monitor that shows how much the Raspberry
    Pi is being used'
  merge: -1
  img_proc: true
- pgno: 15
  md: '# SETTING UP THE

    INTERNET


    # Get online wirelessly and quickly, with this guide to setting up wireless LAN
    on your Raspberry Pi


    The Raspberry Pi is best when connected to the internet. You can use it to browse
    the web, play online videos, and send and receive emails. More importantly, you
    can get the latest updates and install the software packages you need for any
    project.


    To do this, you’ll need to get online. With the Raspberry Pi 3 this is easier
    than ever, because it now has a wireless antenna built into the board.


    Other models of Raspberry Pi, including the Pi Zero, require a WiFi dongle connected
    to a spare USB port.


    ![](img/d8322379620245fcd21eccc3855b8c78_15_0.png)


    A wireless internet connection enables you to get help online and set up apps
    like Claws Mail


    With wireless added to your Raspberry Pi, it’s easy to get online. Boot into the
    Raspbian desktop and look for the WiFi Networks icon in the Panel (on the top-right
    of the display).


    Click WiFi Networks and you’ll see a list of all the local wireless networks.
    Choose your network and (if you have one) enter your password, also called the
    ‘Pre


    Shared Key’. The Raspberry Pi connects to the wireless network, enabling you to
    get online. In this respect it’s pretty much like any other computer that connects
    to WiFi; it will even remember the password for next time.


    Once you’re online, you can use the Epiphany browser to fetch webpages. Click
    Web Browser in the Launch Bar.


    # CONNECTING TO A WIRELESS NETWORK


    # Check for networks


    Click on the Wireless Networks icon in the Panel. Raspbian will display a list
    of all the wireless networks available in your local area. Click on the one that’s
    yours.


    ![](img/d8322379620245fcd21eccc3855b8c78_15_1.png)


    # Enter your password


    Enter your WiFi password in the Pre Shared Key field and click on OK. The network
    symbol will switch to a wireless symbol and you’ll be connected.


    ![](img/d8322379620245fcd21eccc3855b8c78_15_2.png)


    # Test your connection


    Test your internet connection by opening a webpage. Click on Web Browser in the
    Launch Bar and enter www.raspberrypi.org in the URL field. Press RETURN to load
    the page.


    ![](img/d8322379620245fcd21eccc3855b8c78_15_3.png)'
  merge: -1
  img_proc: true
- pgno: 16
  md: '# SETTING UP

    BLUETOOTH


    Connect wirelessly to nearby devices with Bluetooth technology


    Devices connected by Bluetooth work wirelessly with your Raspberry Pi


    ![](img/d8322379620245fcd21eccc3855b8c78_16_0.png)


    Bluetooth is another piece of technology that has been added to the Raspberry
    Pi 3 board. With Bluetooth you can connect wireless devices, such as mice and
    keyboards, directly to your Raspberry Pi.


    As with wireless LAN, if you own an older Raspberry Pi model or a Pi Zero, you’ll
    need to attach a USB dongle to use Bluetooth devices.


    With Bluetooth hardware on your Raspberry Pi board, it’s easy to connect to a
    device wirelessly, a process known as ‘pairing’.


    You can pair wireless gaming controllers, like a PlayStation joypad, or Android
    smartphones. Many Raspberry Pi projects make use of Bluetooth, enabling the Raspberry
    Pi to communicate with nearby electronic components and devices.


    The easiest way to test out Bluetooth is to set up a wireless mouse or keyboard,
    both are fairly easy devices to come by.


    In some ways, the process is similar to connecting to a WiFi network, but the
    Bluetooth device you want to connect to must be set to pairing mode first. This
    is also known as making the device ‘discoverable’. Putting a device into pairing
    mode varies by device; holding down the power button until an LED flashes is fairly
    commonplace, but check with the instructions for your device.


    You then use the Bluetooth icon in the Raspbian desktop Panel to connect to the
    device: choose Bluetooth > Add Device.


    It’s possible to put your Raspberry Pi into pairing mode by choosing Bluetooth
    > Make Discoverable from the Panel. Then you can connect to your Raspberry Pi
    from other Bluetooth devices like mobile phones.


    # SETTING UP

    A BLUETOOTH

    DEVICE


    # Pairing mode


    Start by putting your Bluetooth device in Pairing / Discoverable mode. We''re
    using an Apple wireless keyboard. Hold down the power button until the LED flashes.
    Click Bluetooth in the Panel and choose Add Device.


    ![](img/d8322379620245fcd21eccc3855b8c78_16_1.png)


    # Add new device


    The Add New Device window opens and will scan for nearby Bluetooth devices. Some
    will have names, others just identifying numbers (check on the device). Choose
    a device from the list and click Pair.


    ![](img/d8322379620245fcd21eccc3855b8c78_16_2.png)


    # Enter code


    The Pi now attempts to pair with the Bluetooth device. You''ll be asked to enter
    a code on the keyboard; press the buttons and RETURN. You can now start using
    the Bluetooth device with your Raspberry Pi.


    ![](img/d8322379620245fcd21eccc3855b8c78_16_3.png)'
  merge: -1
  img_proc: true
