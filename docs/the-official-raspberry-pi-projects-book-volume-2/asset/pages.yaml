- pgno: 131
  md: '![](img/d8322379620245fcd21eccc3855b8c78_131_0.png)


    # >STEP-03

    Start a new recipe in IFTTT


    If you don''t have one already, create yourself an account on IFTTT (ifttt.com).
    Then click on the Create a Recipe button.


    ![](img/d8322379620245fcd21eccc3855b8c78_131_1.png)


    # >STEP-04

    Create a Maker Channel Trigger


    Click on the IF part of the new recipe and search for the Maker Channel in the
    list of channel icons that is shown. Select the only trigger option available
    (Receive a web request) and enter the text ''pipe_alert'' into the Event Name
    field.


    ![](img/d8322379620245fcd21eccc3855b8c78_131_2.png)


    # >STEP-05

    Choose an Action


    Now we come to the THAT part of IFTTT. So, click on THAT and select the Email
    action channel, and then select ''Send me an email''. This will use the email
    address that you specified when you signed up to IFTTT. Complete the action fields.


    The ''subject'' field will become the email subject, and the body field will contain
    the text of the email. Notice the use of the special names contained between {{
    and }}. These are called ''ingredients'' and allow you to customise the text.
    In this case, the ''OccurredAt'' is a timestamp for when the trigger event happened,
    and ''value1'' will contain the temperature.


    ![](img/d8322379620245fcd21eccc3855b8c78_131_3.png)


    # >STEP-06

    Complete the Recipe


    After you have completed the Action, you will return to a summary of the Recipe.
    Click the Create a Recipe button to actually create the recipe and make it active.


    ![](img/d8322379620245fcd21eccc3855b8c78_131_4.png)


    # >STEP-07

    Find your secret key


    Bad things could happen if just anyone were allowed to trigger emails to be sent
    using IFTTT. So when the web request is sent from Python to trigger the email,
    it must be accompanied by a secret key.


    To find that key, click on the Channels tab at the top of the IFTTT webpage and
    then find the Maker channel. In a little while, you are going to need to paste
    the secret key into your Python program.


    This is the kind of project that you definitely want to use SSH for, so that you
    can connect to the Raspberry Pi remotely using the WiFi USB dongle. You can find
    instructions on setting up your Pi to use SSH on the official website: magpi.cc/1GULmTr.


    Before you can use the DS18B20 temperature sensor, you need to enable the 1-wire
    interface of the Raspberry Pi. To enable 1-wire, edit the file /boot/config.txt
    using the command:


    ```

    sudo nano /boot/config.txt

    ```


    Add the following line to the end of the file:


    ```

    dtoverlay=w1-gpio

    ```


    Now reboot your Raspberry Pi and 1-wire should be enabled.


    You can download the program for this project from your Raspberry Pi command line
    using:


    ```

    git clone https://github.com/simonmonk/pi_magazine.git

    ```


    Before running the program, open it with the nano editor and change the line:


    ```

    KEY = ‘cyR3vPNF1P9K32W4NZ B9cd’

    ```


    Change this to the IFTTT key that you found earlier. Run the program as superuser
    using the command below:


    ```

    sudo python pipes.py

    ```


    When you run the program, you should see the message ‘Monitoring’ in the terminal,
    after which temperature readings should start appearing.


    # How the code works


    The Python code for this program is commented. You will probably find it handy
    to have the code up in an editor while we go through it.


    The program starts by importing the libraries that it requires:


    glob is used to find the device file for the temperature sensor, as the program
    needs to use wild-card matching because every DS18B20 is given a different device
    ID during manufacture; time is used for delays; urllib and urllib2 are used to
    send the web request to IFTTT.


    You may well want to change the constants that follow this, especially while you
    are testing the system. The variable ALARM_TEMP sets the temperature at which
    an alarm will be triggered, so set this to a few degrees less than the temperature
    reported by the program in the terminal and go and get yourself a glass of cold
    water for testing.'
