    # RASPIMOWER DALEK


    Ron Ostafichuk set out to build a robot lawnmower and ended up with a fully automated
    Dalek (you know how it is)


    Daleks are the most feared race in the universe, so what could be more fun than
    building your own Raspberry Pi-powered Dalek? That’s what developer Ron Ostafichuk
    thought. “I’ve been tinkering with the Raspberry Pi ever since it came out,” he
    tells us, “and I’ve seen many small robot projects, but decided that a big robot
    would be much more fun.” The Dalek didn’t start out as a Dalek: Ron wanted to
    build a robotic lawnmower. “I have a huge lawn and I wanted to show my kids that
    you could build a large robot, using spare parts and scraps.”


    The wooden base contains two 12V motors recycled from a life spent adjusting the
    seats on cars. These motors are connected to the big off-road wheels using a V-belt
    system. “Once I had the motorised base completed, my kids hopped onto it and proceeded
    to ride it around the neighbourhood. They loved it, and remarked how great it
    would be to ride it around for Halloween. Since I am a pretty big Doctor Who fan,
    the idea that came to me was to turn it into a Dalek!”


    For power, Ron is using an old 12V deep-cycle camper battery. “[It] was no longer
    strong enough to use in my camper,” says Ron, “[but] it lasted for around three
    hours of continuous operation this Halloween.” “I am running the standard Raspbian
    distro on the Pi,” says Ron, and the Raspimower Dalek control code is written
    in C++ (available on Bitbucket – magpi.cc/1HWN V8j). The Dalek is a body that
    sits on top of the Raspimower base. The frame was built from ¾-inch (19mm) chipboard,
    and the outside from ¼-inch (6mm) sheeting.'
