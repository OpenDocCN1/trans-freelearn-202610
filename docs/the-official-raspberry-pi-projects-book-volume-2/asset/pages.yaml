  md: '# PI ZERO RETRO GAMING SYSTEM


    Spanner Spencer wasted no time hooking up the Pi Zero’s RCA connection to a classic
    cathode ray tube television. The Pi Zero Retro Gaming system is the real deal...


    # SPANNER SPENCER


    Spanner is the community manager for Element14, an online community for engineers.

    magpi.cc/1m75kkg


    ![](img/d8322379620245fcd21eccc3855b8c78_87_0.png)


    +   Quick Facts

    +   - It works like a dream with Xbox 360 controllers

    +   - The whole project took only two hours to build

    +   - The Pi Zero can be overclocked to 1GHz for gaming

    +   - It uses RetroPie, part of the standard NOOBS installation

    +   - The Pi Zero can even play some original PlayStation games


    It’s fair to say that the Pi Zero caused more than a bit of splash. Our new favourite
    smallest computer topped Twitter and caused chaos at British newsagents when it
    was cover-mounted on The MagPi. Even President Obama got a copy. Those lucky enough
    to get a Zero quickly created some great projects and discovered its nuances.
    That the Pi Zero has RCA output was not lost on Spanner Spencer, community manager
    at Element14, who realised it could be inserted inside an old television.


    > > “I picked up some crummy old Grundig for 20 quid at a charity shop in Huddersfield,”
    says Spanner. “It’s nice to think that the first ever Pi Zero games machine did
    its bit for charity.

    > > “Initially, I soldered a couple of flying leads to the back of the composite
    phono socket,” he continues, “but there was something skewey going on, and I didn’t
    get a picture. Instead, I


    switched to using the composite video in on the SCART socket and then soldering
    the wires onto the PCB underneath to avoid external wiring.

    “The video signal came from the Pi Zero’s composite output, which I soldered directly.
    It’s a tad permanent, and it would have been better to add some pins


    Using RetroPie on a classic CRT television is a great way to play old console
    games


    Attaching a USB joypad (like this Xbox 360 controller) enables you to play games
    with minimal setup


    A USB hub is placed on the side of the television. New games can be then added
    to RetroPie without opening the TV


    ![](img/d8322379620245fcd21eccc3855b8c78_87_1.png)'
