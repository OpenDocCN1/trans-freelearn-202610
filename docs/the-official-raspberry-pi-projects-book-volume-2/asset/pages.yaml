    # >STEP-01

    The console case


    Heavy-duty woodwork supports a laser-cut ply top, retro-futuristic control graphics
    designed in Inkscape, and a fairly thick acrylic top to withstand some heavy use
    by baffled space cadets.


    # >STEP-02

    Inside the console


    The BeagleBone Black is a fairly dumb console, picking up its instructions from
    the controller, displaying instructions sent over MQTT on the LCD, and reporting
    control values.


    # >STEP-03

    Pi controller


    A single B+ Pi board powers the whole game, generating text, as well as sound
    effects, and hosting the game’s MQTT broker. A network switch connects the Pi
    to the consoles, via spacey-looking ducting.


    > Welcome aboard the recently refurbished USS Guppy, once again declared officially
    ‘Good enough for Government work’


    asteroid belt orbiting an unstable Red Giant star near the edge of the Forbidden
    Zone, to investigate some unusual radiation signatures.


    SpaceHack’s control panels have been reconfigured, and as things begin to go wrong
    on the space mission, emergency instructions issued by the ship’s computer – showing
    on the console’s LCD – don’t seem to apply to that console’s switches, dials,
    and buttons. The only way to avert disaster is to shout out the instructions so
    that fellow space cadets at one of the other three consoles can search for the
    right switch to flip, dial to turn, or button to push.


    # In a Jam


    How long can disaster be staved off? There’s no shortage of volunteers to find
    out, whenever the York team brings SpaceHack to an event. If you follow the maker
    events online, you’ll have seen the favourable comments. Spotting a couple of
    familiar faces playing SpaceHack at the MOSI MakeFest, we asked them what they’d
    thought of the experience.


    “I thought playing it was great fun and highly engaging.


    The intentionally confusing instructions add to the madcap antics and to me were
    reminiscent of TV’s The Generation Game challenges, where contestants struggled
    with seemingly simple activities,” Raspberry Jam’s Alan O’Donohue told us. Claire
    Garside invited the York team to Leeds Raspberry Jam, and was enthusiastic about
    SpaceHack’s ability to excite people about STEM in a fun way: “Whether taking
    the challenge myself, or observing the wide range of contestants it entices, SpaceHack
