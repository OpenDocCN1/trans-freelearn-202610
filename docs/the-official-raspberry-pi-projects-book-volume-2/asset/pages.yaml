  md: "own pixel art in something like Swanky Paint. For testing this tutorial, we\
    \ grabbed one of the 100 characters from a sprite sheet created by Johan Vinet\
    \ (twitter.com/johanvinet), which can be found here: bit.ly/1jxaJ3m.\n\n# >STEP-03\n\
    Prepare the art\n\nThe Sense HAT can only display 64 pixels, and our code assumes\
    \ the image you have is going to be exactly that. On a normal computer, use an\
    \ image editor such as the free software GIMP to prepare the image. Remove any\
    \ borders (you may need to zoom right in to make sure) by cropping the image and\
    \ save it to a file name you’ll remember with the extension .png or .gif. This\
    \ is especially important if the 8×8 art you have isn’t actually saved as an 8×8\
    \ image; for instance, if each ‘pixel’ in the art is six pixels wide, like in\
    \ our code.\n\n# >STEP-04\nStudy the pixel art\n\nAs mentioned above, your pixel\
    \ art may not be actually saved by the pixel. In the code we’ve created, it takes\
    \ this into account. The easiest way to check the width of the pixels is to look\
    \ at the resolution of the image. In our case, it’s 48×48, which means that each\
    \ ‘pixel’ is six real pixels wide (and high, because it’s a square). You can check\
    \ this in GIMP by using a square pixel brush and increasing the size until it’s\
    \ the same as the pixels in your image. Alternatively, once you’ve cropped the\
    \ image, you can scale the image to be 8×8; this may not have the desired results,\
    \ though, as it tries to squash everything together.\n\n# >STEP-05\nLoad it all\
    \ on the Raspberry Pi\n\nPut the image on the Raspberry Pi and open it in the\
    \ image viewer to make sure it transferred fine. We did this by plugging the SD\
    \ card directly into the computer we prepared the image on and copied it to a\
    \ directory called ‘SenseHAT’ in the home folder, but you can always put it on\
    \ a USB stick and copy it over from within the Pi or upload it to your cloud storage\
    \ and download it to the Pi.\n\n# >STEP-06\nWrite the code!\n\nFollow along to\
    \ the code listing and tweak it to suit your own pixel art, whether this means\
    \ you need to change the location of the file in the code (our code assumes you’ve\
    \ put it in a folder called ‘SenseHAT’ in Raspbian’s home directory) or if you\
    \ need to change the width of each pixel to 1 or higher. Press F5 to run the code,\
    \ and it will then display the image on the Sense HAT for three seconds before\
    \ turning itself off.\n\n# Pixelart.py\n\n```\nfrom sense_hat import SenseHat\n\
    import time\nfrom PIL import Image\nimport os\n\n# Open image file\nimage_file\
    \ = os.path.join(\nos.sep, \"/home\", \"pi\", \"SenseHAT\", \"pixelart.png\")\n\
    img = Image.open(image_file)\n\n# Generate rgb values for image pixels\nrgb_img\
    \ = img.convert('RGB')\nimage_pixels = list(rgb_img.getdata())\n\n# Get the 64\
    \ pixels you need\npixel_width = 6\nimage_width = pixel_width*8\nsense_pixels\
    \ = []\nstart_pixel = 0\nwhile start_pixel < (image_width*64):\n    sense_pixels.extend(image_pixels[start_pixel:(\n\
    start_pixel+image_width):pixel_width])\n    start_pixel += (image_width*pixel_width)\n\
    \n# Display the image\nsense = SenseHat()\nsense.set_rotation(r=180)\nsense.set_pixels(sense_pixels)\n\
    time.sleep(3)\n\nsense.clear()\n```\n\n![](img/d8322379620245fcd21eccc3855b8c78_100_0.png)\n\
    \nAbove Rob is very vain, and (carefully) cut out an image of his alter-ego M.\
    \ Bison to display on the Sense HAT, taken from Johan's sprite list"
