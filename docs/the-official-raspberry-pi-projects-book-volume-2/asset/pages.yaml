    # LOCATION-TRACKING MOUNTAIN MODEL


    When Kurt Hunter wanted to create a smart 3D model to show family and colleagues
    his progress while climbing Mount Kilimanjaro, he turned to the Raspberry Pi


    An LED lights up on a scale model placed on a kitchen counter in Washington State,
    USA, to signify that over 9,000 miles away in Tanzania, Kurt Hunter has reached
    the summit of Mount Kilimanjaro. Climbing Africa’s highest peak had been a long-held
    ambition for Kurt. “Ever since moving to Seattle 20 years ago, I would look up
    at Mount Rainier and dream of climbing it,” he tells us. “After getting myself
    in shape in 2004, I did indeed climb it and got hooked on climbing. That year
    I set a goal of climbing Kilimanjaro, but never got around to it until [2015].”


    In preparing for the two-week expedition, Kurt set himself another challenge.
    He wanted to combine his passion for 3D printing and programming in an interesting
    way, to enable his family and co-workers to follow along with his climb in a fun,
    visual experience. To this end, he set about creating a Raspberry Pi 2-powered
    1:100,000 scale model of Kilimanjaro, complete with LEDs to mark the spots of
    all his planned camps, along with the summit itself. The location data would be
    supplied by a personal GPS locator device, via his own RainOn web-based tracking
    solution.


    # Model making


    Kurt spent a weekend designing the 3D model in the Blender CAD program, using
    accurate elevation data for Kilimanjaro gleaned from Viewfinder Panoramas (magpi.cc/1Sd7psw)
    – see magpi.cc/1J0osv3 for a tutorial on the technique – and calculating the physical
    offsets for the surface holes required for the LEDs. The model needed to be tall
    enough to contain the Raspberry Pi, mounted on a removable base panel, and include
    cut-outs for its power and Ethernet connections (via extension cables). The final


