    shaft. There are plenty of options, but Christmas lights are a great and cheap
    way of getting a string of pre-wired, low-power LEDs. Obviously, the more LEDs
    you get, the more dramatic the Pi-Saber effect. However, installing each one into
    the noodle can be quite tedious and time-consuming, so a string of 20 is a good
    compromise between aesthetics and sanity preservation. Snip the wires just before
    the battery holder, strip back the insulation, and add a female jumper housing
    to the end of each one. Connect them up to the 3V and GND pins on the GPIO and
    check that they light up. Then switch one wire from the 3V pin to GPIO pin 17.


    # Jedi Master saber


    The final element of the Pi-Saber is a nice big on/off button. Make up some wires
    with suitable connections, or simply solder directly onto the button’s contacts.
    Then connect it up to the Pi Zero’s GPIO pins (26 and one of the GNDs), as shown
    in Fig 1. Now it’s time to put everything together. Check everything is wired
    up as shown in Fig 1 and then power


    ![](img/d8322379620245fcd21eccc3855b8c78_158_0.png)


    up the Pi. Download the PySaber.py code (magpi.cc/1ZMFVi3), or type it into a
    text editor, and run it.


    ```

    sudo python PiSaber.py

    ```


    Nothing should happen until you press the button: the LED matrix should show a
    quick pattern and


    > Nothing should happen until you press the button: the LED matrix should show
    a quick pattern and then start ‘sparkling’


    then start ‘sparkling’. Meanwhile, the LEDs on the string should all light up.
    Pick up the accelerometer, jiggle it around, and you should see the brightness
    of the LEDs fluctuate along the shaft. Once everything is working, add the line:


    ```

    python /home/pi/PiSaber.py &

    ```


    ...to the /etc/rc.local file (above the ‘exit 0’ line) so that the code will run
    whenever the Pi is booted.


    Now chop the noodle in two and then slice one half open lengthways like a hotdog
    bun – don’t cut all


    the way through. Measure your noodle and make a sketch to work out how your particular
    power bank and button will fit inside. Once you’ve got this figured out, completely
    remove that much of one half of the noodle, leaving a wedge. Then mark out where
    the components go and cut away those


    chunks of the noodle. While you’re at it, cut out a small trench all the way along
    the rest of the inner noodle for the LED cable. Now calculate how far apart the
    LEDs should be to give an even spacing all the way round, and then poke them through;
    make some pilot holes first with a meat skewer or something similar. Once everything
    is in place and the wires are tidy, glue the slit shaft back together all the
    way along the length. Cover the handle parts with duct tape and then strap them
    together with some Velcro. That should be it – now you’re all set for some epic
    battles.


    Language >PYTHON 2.7 DOWNLOAD: magpi.cc/1ZMFVi3'
