  md: '# XBOX

    CONTROLLER

    PI ZERO


    Bring new meaning to Xbox Media Centre by playing Doom built into a controller


    There are many colloquial names for the original controller for the first Xbox.
    The Duke. The Bear. The Fire Hazard. Its size is attributed to the urban legend
    of being ergonomic for ‘big American hands’; thanks to its size, however, it ended
    up being pretty perfect for Terence Eden’s project.


    “I wanted to play retro games on my TV,” Terence tells us. “But I didn’t want
    to buy yet another box to sit under there. I also didn’t want to have to faff
    about with anything too complicated – wouldn’t it be great, I thought, if I could
    fit an entire games console inside a controller?


    Similar to our project idea (which ultimately resulted in a full tutorial you
    can find in this book), Terence


    > I wanted to play retro games on my TV


    thought originally about using the iconic NES controller. However, his wife pointed
    out that the larger Xbox controller would be perfect for what he had planned.


    “So, this project was about stuffing a Pi inside a controller and using it to
    play Doom!”


    Apparently it was a tight fit even for the Raspberry Pi Zero, meaning that some
    of the interior of the controller housing had to be shaved off to squeeze it in.
    “It’s great that all the ports are along one side; that makes fitting it into
    tight spots much easier,” Terence adds.


    The component list was nothing fancy: just the standard cables needed to make
    the Zero work and the various assortment of tools needed.


    Like everyone else, Terence has been inspired and is thinking how else he can
    make use of the Zero. “I’m curious as to whether it makes sense to use it as a
    door and window sensor. A Pi Zero is cheaper than a Z-Wave sensor so, as long
    as I can run power to it, I can place one on every door and window at home.”


    TERENCE EDEN

    Web developer

    shkspr.mobi


    ![](img/d8322379620245fcd21eccc3855b8c78_84_0.png)


    Fit a Pi Zero into a controller and you don’t even need a console


    ![](img/d8322379620245fcd21eccc3855b8c78_84_1.png)


    USB OTG is a simple extension to the existing micro-USB spec. The connectors are
    really cheap: under £1 online. That said, it’s pretty simple to make your own
    if you’re confident with wiring and soldering. Terence spliced an old one directly
    into the controller lead


    ![](img/d8322379620245fcd21eccc3855b8c78_84_2.png)


    RetroPie is a brilliant resource for emulator fans, says Terence. He remembers
    the days when you had to scramble around to get MAME to work, but this is a single
    disk image with everything built in. Magically, it even has kernel support for
    the Xbox controller via xpad – Terence thought he’d have to bodge that in for
    sure!'
