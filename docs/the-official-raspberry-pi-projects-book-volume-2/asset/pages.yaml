  md: '# MULDER


    Featured in this very magazine, this spooky skull comes alive


    MIKE COOK

    Writer, bone wizard

    magpi.cc/1NqJnTz


    Zombie head? Too much flesh. Meet Mulder the skull, a very interactive head that
    you can control to scare the living daylights out of anyone who makes the mistake
    of passing by. With full control over his jaw, neck, and eyes, he can move around
    to watch anybody. Not only that, but you can light him up in a variety of colours
    and have him give out deadly screams or creepy owl hoots.


    Mulder was made by Mike Cook as part of the Pi Bakery, and featured as a project
    you can create in issue 38 of The MagPi – head to magpi.cc to get started.


    We won’t spoil the surprise, but it involves a lot of soldering and tweaking as
    you install several servos and motors to articulate the eyes and jaw, along with
    several lights, a speaker system, and a way to control the neck. It’s all controlled
    from an interface written in Python, the code listing and files from which are
    available in the tutorial.


    We suggest you put a hidden camera near the skull so you can track trick-or-treaters
    as they approach your door. That’s sure to scare them off, leaving more chocolate
    for you.


    ![](img/d8322379620245fcd21eccc3855b8c78_82_0.png)


    Left Control Mulder with these simplish keyboard controls


    Above In still images, Mulder looks quite tame and funny. In real life, it’s a
    bit more scary


    ![](img/d8322379620245fcd21eccc3855b8c78_82_1.png)


