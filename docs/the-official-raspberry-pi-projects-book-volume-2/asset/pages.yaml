- pgno: 161
  md: '# Tutorial

    STEP BY STEP


    # ROB ZWETSLOOT


    Tech writer, avid coder, and Raspberry Pi enthusiast with a history of building
    many things with Raspberry Pi.

    magpi.cc


    ![](img/d8322379620245fcd21eccc3855b8c78_161_0.png)


    > The main indication that something is different about this controller, but it''s
    a small price to pay.


    > A standard knock-off USB NES controller works perfectly for what we have planned


    # NES ZERO


    We make last month’s project idea into reality with a NES controller that’s been
    Zero-charged to be able to run NES games…


    # You’ll Need


    +   - USB NES controller (check eBay!)

    +   - A Raspberry Pi Zero - raspberrypi.org

    +   - RetroPie - magpi.cc /z1HVgNba

    +   - A rotary tool (like a Dremel)

    +   - An old micro USB cable

    +   - A screwdriver, soldering iron and a way to strip wires


    Ever since first seeing the Raspberry Pi Zero a few months ago at Pi HQ, we’ve
    spent a lot of time since then thinking about the cool ways that the Pi Zero can
    be used. One of our first ideas was slipping a Pi Zero into a NES controller,
    taking a bit of inspiration from Ben Heck’s great inventions to further miniaturise
    the NES to its most core component.


    We wrote about how you could do this last issue but we have now finally had time
    to make a proof-of-concept, so we’re going to show you how to exactly put a Pi
    Zero inside an NES controller.


    # >STEP-01

    Set up RetroPie


    This is really more for convenience than anything else. Download the RetroPie
    image and write it to a microSD card using your preferred method (check the Raspberry
    Pi guide if you’ve not done this before: magpi.cc/1XTmymk). Once it’s written,
    open it up in your file explorer and navigate to home, pi, RetroPie and put your
    NES ROMs into the nes folder.


    Pop the micro SD card into the Pi Zero and hook the USB NES controller up to it
    before turning it on. You can then do the initial setup and configure the controller.


    ![](img/d8322379620245fcd21eccc3855b8c78_161_1.png)


    # >STEP-02

    Make some space


    It seems that many USB NES controllers have roughly the same internal structure
    (they may be using a mould of the NES controllers, or just a generic one) and
    it is therefore likely that you’ll need to make some space. We used a rotary tool
    to trim the screw holes and a ring on the edge. We wanted to use the original
    USB wire port for our HDMI cable, so we suggest that you lay the Pi Zero (with
    SD card inserted!) inside the back plate and figure out where needs to be trimmed.'
  merge: -1
  img_proc: true
- pgno: 162
  md: '![](img/d8322379620245fcd21eccc3855b8c78_162_0.png)


    We used a Sharpie to mark out the cuts we needed to make by periodically laying
    the Zero over the backplate as we worked


    # >STEP-03


    # Cable holes


    If you’re doing what we did, not only will you need to widen the USB hole to allow
    for plugging in a mini HDMI cable and a new hole for the power port to slot in,
    you’ll also need a space for the micro USB port to jut out. Mark the amount of
    space you’ll need to cut out for the mini HDMI cable to fit in; you can even consider
    cutting a square out of the back plate to help it to slot in more easily. Test
    it as you go, but be careful of plastic shrapnel as you file it up.


    ![](img/d8322379620245fcd21eccc3855b8c78_162_1.png)


    Above Our cutting is a little rough in places; you may also need to open up the
    bottom of the controller to fit the cables in


    > All that’s left is to plug it into a TV and power supply...


    # >STEP-04


    # Wire up the controller


    USB cables are wired up very simply, with four wires providing power, ground and
    data. Luckily, the colouring of the wires inside a cable is standard. Snip off
    the end of the micro USB cable you want to sacrifice and strip off the rubber,
    the braided wire and the foil surrounding the four individual wires. Strip them
    to reveal the core. Do the same with the USB cable on the NES board: on ours the
    wires were accessible before the cable insulated them. Solder the corresponding
    wires together and individually insulate them with electrical tape or heat shrink
    tubing.


    # >STEP-05


    # Assemble it


    We used a bit of Blu Tack to secure our Pi Zero to the inside of the base plate
    while carefully making sure the micro USB connector was plugged in and not obscuring
    any of the screws or clips connecting the controller together. We then carefully
    screwed it in and checked that the connectors fitted. All that’s left is to plug
    it into a TV and power supply and make sure the whole system works.


    # >STEP-06


    # Game on


    As we have noted, our version is simply a proof of concept. It did, however, survive
    a solid six hours of young kids getting very frustrated over old games at Pi Wars,
    so clearly the controller and Pi Zero are robust enough to handle extended play
    sessions. You will need to dismantle the device to get to the SD card and load
    or change ROMs on it. You could, however, probably get it to connect over WiFi
    and transfer files over SSH.


    OTHER CONTROLLERS


    You just have to look at the Xbox controller hack from earlier in the magazine
    to see how this could be done with other controllers'
