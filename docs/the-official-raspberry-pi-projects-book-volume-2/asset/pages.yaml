- pgno: 160
  md: '# >STEP-01

    Gut the mouse


    It sounds gruesome, but it’s actually easier than you think once you can actually
    get into the thing. Our Razer Lachesis had a solitary cross-head screw hidden
    under a sticker on the bottom of the mouse. With that removed, we were able to
    remove the LED light boards from the roof of the mouse, and trim down some of
    the support struts and plastic moulding using side cutters. Razer had conveniently
    used connectors for the LED lights and even for the USB port, so it was trivial
    to remove everything to create space.


    # >STEP-02

    Soldering the micro-USB


    Next, we snipped the USB cable for the mouse, leaving enough play to solder a
    micro USB connector on the end that fits straight into the Pi Zero. It just works.
    The cabling is straightforward – with the longest flat edge of the micro USB connector
    facing up and towards you, the cabling is soldered from left to right – black,
    green, white, and red. Since USB is entirely universal, there’s no way you can
    get it wrong – just search for ‘micro USB cable connector’ for example diagrams.
    It can be fiddly to solder, but with a decent iron and some helping hands to hold
    it steady, it’s pretty straightforward stuff.


    # >STEP-03

    Fitting the Zero and mini HDMI


    Now we want to fit the Pi Zero, taking into account that there’s going to be a
    (comparatively) massive HDMI cable attached to it. Our best advice here is to
    buy the slimmest mini HDMI-to-HDMI cable you can find, but you’ll need to use
    a craft knife to carefully remove the housing without damaging the cable itself.
    With our Razer mouse, we found that the Zero sat nicely at an angle, with the
    HDMI cable snaking around the chassis to the front port where the old USB cable
    was. At this point, it’s probably wise to ensure you can seal up the mouse securely,
    since you might need to carve out a little more of the plastic housing to accommodate
    it.


    # >STEP-04

    Power your Pi Zero


    Sadly, there’s just not enough room in the mouse to house a rechargeable battery
    and accompanying battery controller board. Instead, we’re going to run a slimline
    micro USB cable from the Zero’s power port out of the front of the mouse, alongside
    the HDMI cable. Once the project is complete and working, you can either tape-wrap
    the two cables together or get some decent heat-shrink sleeving to hold them securely
    together. You’ll need to ensure both cables are long enough so that there’s


    ![](img/d8322379620245fcd21eccc3855b8c78_160_0.png)


    plenty of play at the other end, and both the HDMI and USB cables can be plugged
    in.


    # >STEP-05

    Installing the software


    The next step is to set up a Raspbian Jessie image on your SD card; we advise
    taking your Zero out of your mouse to do so, and using a USB hub with connected
    keyboard, mouse, and WiFi dongle. With Raspbian Jessie installed, you need to
    set up your game (in this case, Quake III). Installation isn’t exactly a breeze,
    but you can find full instructions on the process at magpi.cc/QuakeIII. You need
    to recompile the game and acquire the pac files for Quake III from a reputable
    source. Sorry – our lawyers won’t let us be more specific than that!


    ![](img/d8322379620245fcd21eccc3855b8c78_160_1.png)


    # >STEP-06

    The ultimate gaming mouse


    With power and USB connectivity sorted, and an up-to-date install of Raspbian
    Jessie and Quake III set up, all that’s left to do is to pop into the options
    menu and reassign control to as many of the mouse buttons as you can. We opted
    to use the wheel to switch weapons, the left two buttons for forward and back,
    and the opposite two sides for strafing. It takes a while to get used to, but
    you soon get the hang of it.


    # Tip

    QUAKE III


    Raspberry Pi Beginners has a really neat YouTube video showing you an alternative
    method of installing Quake III on your Raspberry Pi.

    youtu.be/

    btSGRnXuaAAA'
