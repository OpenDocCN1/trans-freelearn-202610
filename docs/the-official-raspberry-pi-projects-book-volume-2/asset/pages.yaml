    # RASPBERRY PI LAPTOP – ZERO EDITION


    A classic case for the Pi gets a revamp, thanks to the new size and spec of the
    Raspberry Pi Zero


    PETER HOWKINS

    Software engineer

    marutan.net


    ![](img/d8322379620245fcd21eccc3855b8c78_85_2.png)


    It''s basically a full laptop, albeit very easy to open and maintain


    Lego cases have been a major part of Raspberry Pi since it very first launched
    – especially when there was very little available in the way of cases at the very
    start. Taking that to its logical conclusion in a very short time, a Lego Pi-powered
    laptop was created, and everyone loved it.


    > “It’s a small portable Raspberry Pi system, ideal for carrying to events without
    having to carry around a separate monitor and keyboard,” its creator Peter Howkins
    tells us. “It combines two of my hobbies: Raspberry Pi and Lego. This is the third
    variation of my laptop, it started using an original Model B, then I rebuilt it
    to fit the B+ and Pi 2, and now it’s using the Pi Zero.”


    Peter could not believe the price of the Pi Zero when he found out about it, but
    it really does drive down the cost of the overall Lego laptop build. It contains
    converters, hacked USB ports, a screen, a USB power pack, mini keyboard, cables,
    and an awful lot of Lego.'
