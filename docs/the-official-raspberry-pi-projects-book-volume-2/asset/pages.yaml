  md: '# RASPBERRY PI

    HAUNTED HOUSE


    Enter if you dare to the abode with home scare-tomation


    **STEWART WATKISS**

    Data centre manager, father,

    part-time Count Dracula

    magpi.cc/2dqEMrU


    ![](img/d8322379620245fcd21eccc3855b8c78_76_0.png)


    Above Surely it can''t really be haunted... can it?


    It’s late. The night grows dark and you’re near the end of your trick-or-treat
    run – but what’s this? A house you’ve never seen before on your road. Eager for
    more sweets, you make your way to the door. A haunted house sign greets you, but
    you think it merely decoration. Approaching the door, you press the doorbell –
    only for glass to break and the light to go out. A door creaks, the sign you had
    dismissed flashes, and you hear screams as the lights come back on. Startled,
    you look to your right and realise monsters are partying in the garage next to
    you, celebrating another victim in their night of ghastly fun.


    “I had been trying to think of something fun to do for Halloween and the Raspberry
    Pi was an obvious choice,” the owner of this nightmarish house, Stewart, tells
    us. “I’d recently built a circuit for home automation using remote-control sockets
    and had the idea of using that to turn lights on and off automatically. I also
    spent some time looking around at shops to see what other Halloween props I could
    add to the project.”


    The system is deceptively simple, although there’s a lot of different components
    to it. A dedicated doorbell is hooked up to a PiFace board that interacts directly
    with the Raspberry Pi and some Python code. Stewart chose the PiFace for this,
    instead of wiring up directly to the Raspberry Pi’s GPIO pins, to make sure he
    didn’t send any unwanted signals through the GPIO port – although with the right
    amount of research and careful wiring on a breadboard, you could do this without
    the PiFace. The PiFace directly controls the LEDs on a jack-o’-lantern and the
    haunted house sign, while the porch lights and the monster party lights are controlled
    by a wireless home-automation remote control that he directly soldered into.


    “They are not designed to be used that way,” Stewart mentions. “The solder joints
    were not very reliable and whilst they lasted for Halloween, they eventually came
    loose. Since I made the project, Energenie have released a Pi-mote Raspberry Pi
    board for their remote-control sockets, which is easier to use than having to
    solder onto the remote-control buttons.”


    Speakers play the appropriate sounds and music as dictated by the code, and the
    system is waterproofed as, well… Stewart lives in England. The results?


    “I just managed to finish it in time for Halloween. We had friends coming over
    for our children’s Halloween party who said they liked it, and the trick-or-treaters
    were certainly surprised by it. There was one young girl who was a little scared
    by it, but most thought it was fun rather than scary.”


    # COMPONENTS LIST


    CONJURE UP YOUR OWN VERSION


    +   - PiFace

    +   - Wi-Fi dongle (used during configuration and testing)

    +   - 2× Reed relays (HE751A0G10) – one for the on button, the other for off

    +   - 2× LEDs

    +   - 2× AA batteries with holder

    +   - Doorbell

    +   - Remote control socket with spare remote

    +   - Plastic light-up pumpkin lantern (with test button)

    +   - Plastic haunted house sign

    +   - Waterproof box (or lots of wire to allow the Raspberry Pi to be installed
    indoors)

    +   - Speakers (with amplifier)


    Below A simple box contains the Pi and all the electronics so that it''s kept
    waterproof


    ![](img/d8322379620245fcd21eccc3855b8c78_76_1.png)'
