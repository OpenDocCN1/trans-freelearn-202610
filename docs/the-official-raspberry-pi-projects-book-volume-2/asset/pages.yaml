- pgno: 9
  md: '# EQUIPMENT

    YOU''LL NEED


    # All the kit you need to get a Raspberry Pi up and running for the first time


    You don’t require much to get your Raspberry Pi started: a micro SD card from
    an old camera, a smartphone charger, a recycled HDMI cable, and a keyboard and
    mouse are all you need.


    Most items can be sourced from computer hardware around the house, or begged and
    borrowed from friends and family. If you’re looking for the ultimate in low-cost
    computing; the Raspberry Pi is it.


    You should be able to source, salvage, and scavenge most equipment you need to
    get a Raspberry Pi up and running.


    To get the most out of your Raspberry Pi in the long term, though, you should
    use high-quality components.


    A good micro SD card from a named brand will be faster and more reliable. Not
    all USB power adapters are born equal, either. A reliable branded adapter will
    provide a steady stream of power, even when you attach multiple devices.


    The Raspberry Pi board isn’t shy, and it’ll work just fine naked, but a good case
    keeps the board safer and makes it easier to store. There’s a huge range of cases
    available, and many offer unique features such as waterproofing, stackability,
    or wall mounting.


    The official Raspberry Pi case is a slick piece of kit that’s perfect for any
    Pi user. Made of five parts that click together, it enables you to quickly open
    the case and access the board and GPIO pins.


    Any equipment you can’t recycle can be picked up from the Raspberry Pi Shop (magpi.cc/2bnamFF)
    or from distributors like Element14 (element14.com), Allied Electronics (alliedelec.com),
    and RS Components (magpi.cc/2bnapBI).


    # MICRO SD CARD


    The micro SD card acts as the hard drive for your Raspberry Pi. You install the
    Raspbian operating system onto the card, then all your documents, files, and projects
    are saved to it as you work.


    Raspberry Pi fan Jeff Geerling did a community favour by purchasing over a dozen
    different micro SD cards and benchmarking each one. The results were pretty dramatic,
    with some cards running up to four times as fast as others. Samsung


    Evo+ and SanDisk Extreme are two popular brands worth looking out for, and both
    are fairly cheap. You can read more at magpi.cc/2bncFs3


    ![](img/d8322379620245fcd21eccc3855b8c78_9_0.png)'
  merge: -1
  img_proc: true
- pgno: 10
  md: 'The parts of the official Raspberry Pi case can be individually unclipped,
    offering fast access to the GPIO pins on the board inside


    The case was designed by Kinneir Dufort (magpi.cc/2brbXLu). It''s an award-winning
    design team that has done a great job


    The official case provides easy access to all of the ports on the Raspberry Pi,
    and the micro SD card can be removed without dismantling the case


    # HDMI cable


    An HDMI cable is the easiest way to connect your Raspberry Pi to a computer monitor
    or television. You don''t need an expensive one, and most people recycle one from
    an old games console or DVD player.


    # USB power


    A good 2A or 2.5A power supply provides you with enough power to run a Raspberry
    Pi with all kinds of peripherals connected. You can buy an official Universal
    Power Supply (magpi.cc/2a14pye).


    # Keyboard


    Any standard USB keyboard can be used to enter commands to your Raspberry Pi.
    You can use a Bluetooth keyboard with the Raspberry Pi 3, or any other Pi with
    a Bluetooth dongle attached. A wired keyboard is easier to use when setting up
    your Raspberry Pi.


    # Mouse


    Any standard mouse will work with the Raspberry Pi, although ones with two buttons
    (non-Apple mice) work better. Like keyboards, a Bluetooth mouse will work once
    it''s paired, but a wired mouse works as soon as you plug it in.


