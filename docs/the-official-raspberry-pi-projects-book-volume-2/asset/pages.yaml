- pgno: 148
  md: '# MISCELLANEOUS ADD-ONS


    Other bits and pieces to improve your Raspberry Pi Zero


    # MINI USB OTG ADAPTOR


    magpi.cc/jT9aZc

    There are a few of these available – we''ve had some success with the meZmory
    brand one, but there are several others. It makes plugging in single USB devices
    to the Pi Zero much easier – great for projects that just require wireless and
    nothing else.


    ![](img/d8322379620245fcd21eccc3855b8c78_148_0.png)


    # RIGHT-ANGLE GPIO HEADER


    magpi.cc/1ZFoH31

    We''ve shown you how to solder a standard GPIO header to the Pi Zero, but this
    cool alternative allows for the GPIO pins to be parallel with the board. This
    can be ideal for awkward projects or installations where space restrictions are
    fixed, and it solders in like any other GPIO header.


    ![](img/d8322379620245fcd21eccc3855b8c78_148_1.png)


    # ESSENTIAL RASPBERRY PI ZERO KIT


    magpi.cc/1RSULPN

    A nice selection of components that can be used with the Raspberry Pi Zero, including
    extra adaptors, several GPIO header options, and even little stick-on feet to
    raise the Pi Zero off the ground. It all comes in a little mint-like tin which
    can also fit the whole Pi Zero for a makeshift carry case.


    ![](img/d8322379620245fcd21eccc3855b8c78_148_2.png)


    # SCROLL PHAT


    magpi.cc/1JT9cQT

    This actually works on other Raspberry Pis as well, but it''s designed in the
    same form factor as the Pi Zero. This board gives you 55 LEDs in a rectangular
    formation and works similarly to the LED matrix on the Sense HAT. Using a Python
    script, you can control the LEDs or have it scroll text across the length of the
    board.


    ![](img/d8322379620245fcd21eccc3855b8c78_148_3.png)


    # EXPLORER PHAT


    magpi.cc/1Pk5sdN

    This add-on board for the Zero (and other Pis) allows it to communicate with different
    objects more easily than wiring them directly to the Pi. This includes motors
    and sensors – we''ve seen Explorers used in robots due to this. It allows for
    analogue inputs as well as other inputs and outputs, and has its own Python library
    for quick development. Great for tiny projects.


    ![](img/d8322379620245fcd21eccc3855b8c78_148_4.png)


    # ESSENTIAL KIT


    You''ll need these basics to create amazing Pi Zero projects


    # Components


    LEDs, wires, resistors, and maybe even some light, heat or motion sensors. All
    of these are available for very cheap in bundles from a local electronics store,
    or online from a distributor such as RS Components. You can also get a lot of
    them in an electronics starter kit, like the one pictured from ModMyPi (magpi.cc/1RvzWta).
    For the tutorials in this issue, we''ll make sure you know exactly what sort of
    components you need before you go out and buy them.


    ![](img/d8322379620245fcd21eccc3855b8c78_148_5.png)


    # Soldering iron


    An important piece of equipment for making more advanced projects, or building
    some kits available for the Raspberry Pi. As well as the actual soldering iron,
    you''ll need good quality solder to work with. A decent stand for the soldering
    iron is also ideal – one that you''re not likely to burn yourself with, containing
    a good sponge. Soldering can be dangerous, so make sure to supervise younger makers
    when they''re building.


    ![](img/d8322379620245fcd21eccc3855b8c78_148_6.png)


    # Breadboard


    A perfect tool for prototyping and testing your circuits. If you''ve never used
    a breadboard, what it does is give you a load of pins that are aligned in columns,
    acting as connectors so you don''t have to solder components together. This means
    you can quickly change a circuit to get it right, or reuse the breadboard over
    and over again for new and different circuits. You probably don''t need to start
    with a massive one, but get one with positive and negative rails on each side.


    ![](img/d8322379620245fcd21eccc3855b8c78_148_7.png)


    # Wire stripper


    If you decide to get a spool of wire rather than a load of pre-cut pieces, you''ll
    need a good way of getting wire off the spool. Attacking slowly and carefully
    with a pair of scissors or a knife gets extremely boring fast, and investing in
    a decent pair of wire cutters that will also strip the plastic will improve your
    life by at least 10% (don''t quote us on that).


    ![](img/d8322379620245fcd21eccc3855b8c78_148_8.png)'
  merge: -1
  img_proc: true
- pgno: 149
  md: '# PI ZERO CONSOLLER


    The Pi Zero’s diminutive stature allows us to make an entire retro gaming console
    out of a simple USB controller for the first time. Here’s how…


    # You’ll Need


    +   - USB SNES controller – eBay

    +   - PowerBoost 500 makersify.com

    +   - 3.7V 500mAh LiPo battery – eBay

    +   - RetroPie magpi.cc/ Retro-Pie

    +   - Mini HDMI-to-HDMI cable (3m) amazon.com

    +   - 2x micro USB cables amazon.com


    ![](img/d8322379620245fcd21eccc3855b8c78_149_0.png)


    This USB SNES controller knock-off might look sleek and slender, but it actually
    contains a cavernous wasteland ripe for the hacking…


    The PowerBoost 500 is the star of the show. It safely up-volts the battery to
    output 5V so you can power the Pi Zero, even when it’s charging the battery via
    micro USB


    With 3-4 hours of battery life, this tiny 3.7V LiPo is perfect for this project


    We’re going to carefully hack away at two of these micro USB-to-USB cables to
    steal the connectors. One will power the Pi Zero; the other will connect directly
    to the controller’s USB cable


    # Tip

    SNES CONTROLLER


    Since they’re so cheap, we actually picked up a couple of USB SNES controllers
    from eBay.


    This project was inspired by a similar one undertaken by the magazine’s features
    editor, Rob Zwetsloot, a couple of issues back. Rob took a modern USB version
    of a retro Nintendo Entertainment System controller, opened it up and put the
    Pi Zero inside. While it worked perfectly, running classic NES titles via RetroPie,
    we thought that the project could be taken one step further. Classic controllers
    don’t have two cables coming out of them (in this case HDMI and USB for power),
    so our new target was to create a completely self-contained console in a controller,
    with only one cable coming out to connect to the HDMI port on a TV or monitor.
    Thus the Pi Zero-powered SNES Consoller was born… There’s a surprisingly large
    amount of technology to squeeze inside the controller for this project to work.
    Fortunately, most USB controllers are largely empty on the inside, using just
    four tiny USB colour-coded cables connected to a slender circuit board that deals
    with the inputs (D-pad and six buttons). How do we take inputs from the controller
    and get them to the Pi Zero? It actually couldn’t be easier – all we’re going
    to do is snip off the controller’s USB cable and solder the wires directly to
    a micro USB connector that will slot straight into the USB port of the Pi Zero.
    Since USB cabling is entirely universal, it just works.'
