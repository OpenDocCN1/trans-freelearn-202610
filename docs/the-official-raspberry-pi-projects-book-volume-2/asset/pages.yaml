    # 10 AMAZING NEW YEAR’S PROJECTS


    It’s the start of a new year, and (hopefully) the start of a new you.

    Start 2016 as you mean to go on with these amazing projects…


    We all like making New Year’s resolutions. Sticking to them is another matter,
    and there’s only so many times you can promise to give up cake and fail after
    three days.


    So, rather than resolving not to do something fun, we thought it would be a great
    idea to find the greatest Raspberry Pi-powered tech projects with a healthy, feel-good
    vibe. The makers of these projects have done us proud. What we have here are some
    of the world’s coolest projects to see you into the new year.


    These tech projects will help you live a little healthier, be a better citizen,
    and save some money to boot. Not bad, eh? More importantly, you can do all this
    while having fun.


    Living a little healthier is a great place to start, so our first project is Dot
    Silverman’s Motivational Bathroom Scale. “You type your goal weight into the scales
    using the keypad,” explains Dot, “and the device compares your weight to your
    goal weight.


    “If you’re on target, it’ll give you a flattering compliment. Otherwise, it’ll
    sass you to get back to the gym. Remember that you’re beautiful, no matter what
    the scale might tell you.”'
