    pianohat.auto_leds(True) # LEDs light when keys pressed\n# A dictionary mapping\
    \ sounds and notes onto keys\nNOTES = {'0':['C','./sounds/piano/39172__jobro__piano-ff-025.wav'],\
    \ # C\n'1':['C Sharp','./sounds/piano/39173__jobro__piano-ff-026.wav'], # C sharp\n\
    '2':['D','./sounds/piano/39174__jobro__piano-ff-027.wav'], # D\n'3':['D Sharp','./sounds/piano/39175__jobro__piano-ff-028.wav'],\
    \ # D sharp\n'4':['E','./sounds/piano/39176__jobro__piano-ff-029.wav'], # E\n\
    '5':['F','./sounds/piano/39177__jobro__piano-ff-030.wav'], # F\n'6':['F Sharp','./sounds/piano/39178__jobro__piano-ff-031.wav'],\
    \ # F sharp\n'7':['G','./sounds/piano/39179__jobro__piano-ff-032.wav'], # G\n\
    '8':['G Sharp','./sounds/piano/39180__jobro__piano-ff-033.wav'], # G sharp\n'9':['A','./sounds/piano/39181__jobro__piano-ff-034.wav'],\
    \ # A\n'10':['A Sharp','./sounds/piano/39182__jobro__piano-ff-035.wav'], # A sharp\n\
    '11':['B','./sounds/piano/39183__jobro__piano-ff-036.wav'], # B\n'12':['C','./sounds/piano/39184__jobro__piano-ff-037.wav']\
    \ # C\n}\n\ndef handle_note(channel, pressed): # handler for key presses\n   \
    \ global note\n    global correct\n    if channel < 13 and pressed: # Only for\
    \ note keys\n        if str(channel) == note: # Did the player get it right?\n\
    \            print('correct, it was a ' + str(NOTES[note][0]) )\n            pianohat.auto_leds(False)\n\
    \            for x in range(16): # Flash all the lights to celebrate\n       \
    \         pianohat.set_led(x, True)\n            time.sleep(0.05)\n          \
    \  for x in range(16): # Them turn them off\n                pianohat.set_led(x,False)\n\
    \            pianohat.auto_leds(True)\n            correct = True\n        else:\n\
    \            print('wrong, try again')\n\ndef play(note): # Play a note from the\
    \ dictionary\n    pygame.mixer.Sound(NOTES[note][1]).play(loops=0)\n    time.sleep(1)\n\
    \npianohat.on_note(handle_note) # Set keys to use our handler\n\nwhile True:\n\
    \    print('Here comes a C')\n    time.sleep(1)\n    play('0') # Play a C\n  \
    \  time.sleep(2)\n    correct = False\n    print('Now identify this note')\n \
    \   time.sleep(2)\n    note = random.choice(list(NOTES)) # Pick a random note\n\
    \    play(note)\n    print('press the key for the note you heard')\n    count\
    \ = 6 # Set countdown timer\n    while count > 0 and correct == False:\n     \
    \   time.sleep(1)\n        print(str(count) + ' Seconds remaining')\n        count\
    \ -=1\n    if not correct: # If they didn't get it right, tell them the answer\n\
    \        print(\"time's up, it was a \" + str(NOTES[note][0]))\n```\n\nIf you\
    \ press the Instrument key, you’ll notice that the sounds change from pianos to\
    \ percussion. The Piano-HAT library itself does not map any of the keys to a particular\
    \ sound; that is all done using Python. The sounds themselves are WAV files, which\
    \ are played using the Pygame library.\n\nLet’s map our own sound to one of the\
    \ Piano HAT’s keys. Find a short WAV file online (or create your own using Sonic\
    \ Pi) and save it as mysound.wav. Then type in the code from Listing_l1.py (on\
    \ page 52) and run it: your sound should play when the D key is pressed.\n\n#\
    \ >STEP-04\n\n# A little light music\n\nYou’ll notice that the relevant LED lights\
    \ up when any key is pressed. This is the default behaviour, but can be disabled\
    \ using:\n\n```\npianohat.auto_leds(False)\n```\n\nAdd this line immediately before\
    \ the handle_note function in Listing_l1.py. Now we can add code so that only\
    \ the D key’s LED will work. Insert\n\n```\npianohat.set_led(2,True)\n```\n\n\
    ...before the pygame.mixer.Sound line and\n\n```\npianohat.set_led(2,False)\n\
    ```\n\n...after it. Now rerun the program to verify that only the D lights up\
    \ when tapped.\n\n# >STEP-05\n\n# Use a dictionary\n\nMapping keys to sounds using\
    \ a bunch of if... statements is easy but rather long-winded. For our relative\
    \ pitch test, we want to associate the key (an integer) with the note (a text\
    \ string) and the sound"
