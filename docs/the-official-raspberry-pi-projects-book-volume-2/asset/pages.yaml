    # PI-TOP


    A laptop built from a Raspberry Pi and crafted yourself.


    Is it too limited by the Pi, or is it a great little portable teaching tool?


    It’s really not that old, but do you remember the One Laptop Per Child (OLPC)
    project? It was a cheap laptop with yesteryear’s components, created specifically
    to try to make getting computing into the poorest of developing nations as easy
    as possible. It was also very green, and we don’t mean ecologically – although
    it was also quite low-powered, so it technically is ‘green’ in that sense. When
    we got the pi-top out of its box, that was the first thing that came into our
    minds, but definitely not in a bad way! The elevator pitch for the pi-top is that
    it’s a crowdfunded laptop kit that the user needs to assemble, which is powered
    by an included Raspberry Pi. There’s a lot more to it, though, and we’ll get into
    that shortly, but already this gives you a basic impression of what we’re dealing
    with.


    # Brush away those first impressions


    The pi-top has a big educational focus built into it. Each pi-top user has to
    create a cloud account before logging in, which then syncs settings and such to
    this account. It also syncs data from CEED Universe, the gamified learning software
    that is custom-made to meet the new GCSE curriculum. This, on top of the usual
    Raspberry Pi teaching resources, gives it an edge in the classroom, as students
    can use whatever pi-top they want without having to carry too much in the way
    of data around with them. It sounds great in theory. Let’s first go back to the
    box opening, though, before we start discussing its other merits. The box itself
    is lovely, with the first thing you see being the detached laptop screen’s bright
    green back with the pi-top logo in it. All the parts are stored in layers, carefully
    packed with a soft


    foam. You’ll have to look carefully to find the laser-cut removable circuit cover
    and the selection of required screws and cables, but they’re all there. The instructions,
    and indeed the assembly, are quite simple. There are three main parts of the laptop
    chassis, and only two pieces of circuit board including the Raspberry Pi, so the
    majority of the process is preparing and fitting the parts together. While the
    instructions are generally good, they don’t distinguish very well between the
    two types of screws. Hint: the screws that look like motherboard spaces need to
    be affixed to the PCBs; they have a thread running down the centre of the head.
    Also, one of the connection orientations is not completely clear. We found ourselves
    having to take it apart a bit so we could construct it properly at one point.


    # Related


    # KANO


    Similar in terms of gamifying programming education and building, although it’s
    not the all-in-one product pi-top is.


    ![](img/d8322379620245fcd21eccc3855b8c78_177_1.png)'
