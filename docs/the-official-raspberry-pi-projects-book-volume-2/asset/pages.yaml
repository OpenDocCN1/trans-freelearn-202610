- pgno: 18
  md: '![](img/d8322379620245fcd21eccc3855b8c78_18_0.png)


    Unlike the type used for cutting bread, an electronic breadboard is a plastic
    slab with lots of holes in it.


    Wiring a breadboard (or circuit) directly to the GPIO pins is generally safe,
    as long as you avoid circuits with external power sources. Most tinkerers invest
    in a breakout cable to go with the breadboard (see ‘Breadboards and breakouts’).


    With your circuit set up, you then control the GPIO pins in a programming environment
    like Python or Scratch. GPIO pins are set to input or output mode. GPIO outputs
    are easy because the pin is switched on or off (known as HIGH or LOW in computing
    terms). When the GPIO pin is HIGH, voltage flows through the GPIO pin, lighting
    up an LED or buzzing a buzzer. Set the pin to LOW and the LED goes out, or the
    buzzer goes quiet.


    GPIO input is a bit more tricky. In this case, the GPIO pin is set to HIGH or
    LOW and responds to a change from a circuit. A button (or other electronic component)
    can change the circuit from LOW to HIGH, or HIGH to LOW, with the Raspberry Pi
    coded to respond accordingly.


    This is often referred to as ‘pull up’ or ‘pull down’. Don’t worry: if this all
    sounds complicated, you can get started by using GPIO Zero to make programming
    much easier.


    # GPIO ZERO ESSENTIALS


    Learning to use the GPIO pins is the route to having real fun with a Raspberry
    Pi. It’s a big subject, with lots of tricks and tinkering to discover. Our GPIO
    Zero Essentials book teaches you the basics (and beyond) of using the GPIO port
    with the GPIO Zero Python library. See magpi.cc/GPIOZero-book for more information.


    ![](img/d8322379620245fcd21eccc3855b8c78_18_1.png)


    ![](img/d8322379620245fcd21eccc3855b8c78_18_2.png)


    There are 40 GPIO pins, each with a specific function. Use this image as a handy
    guide whenever you’re programming electronics'
