  md: '# RASPBERRY PI 3


    The Raspberry Pi 3 is the latest model, and the version recommended for most newcomers


    # SD card


    On the underside of the Raspberry Pi 3 board is the SD card slot. You preload
    the operating system onto a micro SD card and use it to boot up the Raspberry
    Pi.


    # Wireless network


    The Pi 3 is the first Raspberry Pi to feature built-in wireless LAN and Bluetooth.
    This enables you to connect to a wireless router and get online without using
    a WiFi dongle.


    # 1.2GHz ARM CPU


    Featuring the latest 1.2GHz quad-core ARM CPU (central processing unit), the Raspberry
    Pi 3 is faster than many smartphones, and powerful enough to be used as a desktop
    computer.


    These pins are known as GPIO (general-purpose input/output). GPIO pins are used
    to connect to hardware and electronics projects


    The Raspberry Pi is powered using a micro USB cable, the same type used by many
    smartphones


    The operating system, ''Raspbian'', is loaded onto a micro SD card and plugged
    into the Raspberry Pi


    A keyboard and mouse are connected via USB. An Ethernet cable can be plugged directly
    into a router to provide network access


    An HDMI socket enables you to connect the Raspberry Pi to a monitor or a modern
    television set


