    # Maker Says


    > > Make as many Ubuntu flavours for the Pi as you can think of

    > > Ubuntu Pi Flavour Makers


    # UBUNTU PI FLAVOUR MAKER


    More flavours of Ubuntu for your Raspberry Pi. Does the Pi provide enough power
    for them, though?


    # Related


    # UBUNTU MATE


    When the Raspberry Pi 2 came out, Ubuntu was finally able to come to the Pi, starting
    with a version of Ubuntu MATE.


    If you’ve been following Raspberry Pi long enough, you may know that early on
    in its life there was a call for Ubuntu to be used as an operating system for
    it. As one of, if not the most popular, version of Linux for home users, this
    distro was wanted by many seeking something familiar for their new tiny computer.
    It never came to be. However, as Ubuntu is based on Debian, Raspbian was basically
    the next best thing. When the Raspberry Pi 2 came out, this changed with the release
    of Ubuntu MATE for the Pi, and this opened the door to more ‘versions’ of Ubuntu
    – or, at least, different desktop environments running on Ubuntu. Ubuntu Pi Flavour
    Maker is one of the results of this. At its core, Flavour Maker is a series of
    scripts that allow you to build a slightly custom version


    of Ubuntu for the Raspberry Pi. It uses the all-important armhf build of Ubuntu
    that’s optimised for the type of chip running on the Pi 2, giving you options
    for different software and desktops, and even the choice between server and desktop
    versions depending on your needs. That may sound a little complicated for some
    more novice users, but don’t worry – the kind folk who make the software have
    created a series of images you can install to an SD card, much like any Raspberry
    Pi operating system. On tap are two versions of Ubuntu Server: one a very minimal
    install for maximum speed, and a regular install if you need more software. There
    are also three ‘spins’ that use different desktops: LXDE, Xfce, and MATE. LXDE
    and Xfce are common lightweight desktop interfaces used on low-powered PCs; Raspbian
    has used LXDE, or at least a version of it, since it came out.


    # Booting up


    How do they actually run, then? Much like the normal Ubuntu, there are a few setup
    steps on your first boot, although the main installation has already occurred
    so it’s a little truncated. Settings such as locale and keyboard are sorted before
    booting you into the desktop, although this does take a few minutes to actually
    occur. Each successive boot is much faster, though, albeit nowhere near the speed
    of booting into Raspbian. The OS is presented in a very different way from Raspbian.
    Whereas much of Raspbian is optimised for the Raspberry Pi, with a lot of educational
    tools in there as well, the Ubuntu spins'
