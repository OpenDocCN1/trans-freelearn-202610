    – we used rbenv to install Gosu on Ruby 2.1.2. That done, turn to chapter three,
    because Ruby Game Programming still has


    plenty to offer on the Pi. This isn’t a book about Gosu, or even solely about
    Ruby, but about the various techniques used in programming 2D games, which encompass
    a wide range of gameplay and perspective. And Python’s expressive and slightly
    less buttoned-up cousin Ruby makes a good


    language for introducing them: it’s concise and easy to read. Introducing sprites,
    interaction, platform gaming and sideways scrolling, Sobkowicz is an able guide
    to all the components and has written a book suitable for early-stage coders of
