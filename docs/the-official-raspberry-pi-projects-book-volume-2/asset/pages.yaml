    \ The highlight, naturally, is the Touch Board itself, which is joined by a generous\
    \ pot of conductive paint with a thick brush, a tube of the same paint with a\
    \ fine-tipped nozzle for more precise application, a self-powered rechargeable\
    \ speaker, USB cables, a microSD card reader, and banana clip cables. This\n\n\
    is in addition to a rolled-up stencil set (about which more later) and an impressive,\
    \ oversize, full-colour guidebook covering the kit’s three primary projects.\n\
    \nThe guidebook is far from an afterthought, but it’s hardly required to get started.\
    \ The packaging of the Touch Board itself, a box within a box, doubles as a quickstart\
    \ guide and reveals a very clever feature: pre-recorded instructional messages\
    \ already loaded onto the bundled 128MB microSD card.\n\nThe Touch Board, for\
    \ those unfamiliar, is an Arduino-compatible device designed to make working with\
    \ conductive paint, thread, and even Play-Doh as simple as possible. It arrives\
    \ preconfigured to play MP3 files from the SD card each time one of its 12 electrode\
    \ inputs is touched.\n\nThis is then used to drive the user’s introduction: connect\
    \ the micro-USB cable and the bundled speaker or a pair of headphones, touch input\
    \ E0 with your finger, and you’ll hear a congratulatory message; press E1 and\
    \ you’ll learn about the board’s inputs. This process continues through to E11,\
    \ which sends you off to the Bare Conductive website to learn more.\n\nWith the\
    \ Starter Kit, though, you have offline support too. The aforementioned guidebook\
    \ does a fantastic job of walking you through three example projects in a step-by-step\
    \ fashion. With full-colour pictures at every step, it’s hard to get lost or confused.\n\
    \nThe first suggested project is the biggest: learning how to make graphical sensors.\
    \ This involves the rolled-up stencil and overlays, which come with handy sticky\
    \ tabs.\n\n# Related\n\n# MAKEY MAKEY\n\nThe device that brought the banana piano\
    \ to the masses, the Makey Makey is a cheaper way to get started with conductive\
    \ materials.\n\n£40 / $50\nmakeymakey.com"
