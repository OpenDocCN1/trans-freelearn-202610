  md: '![](img/d8322379620245fcd21eccc3855b8c78_2_0.png)


    # WELCOME


    When we introduced our last Official Projects book we were excited that seven
    million Raspberry Pis had been sold. Since then, the Raspberry Pi has achieved
    two further milestones: it’s reached ten million sales and has become the best-selling
    British computer of all time. By our calculations that’s quite a few new people
    in the Raspberry Pi community!


    If you’re one of those new people, then we heartily welcome you to the latest
    Raspberry Pi Official Projects Book. With 200 pages of excellent guides, inspiring
    projects, and informative reviews, it should keep you busy learning about all
    the amazing things you can do with your Raspberry Pi. We even have a Getting Started
    guide if you’re trying to figure out where to begin. For Pi veterans, there are
    some truly challenging builds to get stuck into as well.


    I hope you all enjoy this book!

    Rob Zwetsloot


    FIND US ONLINE raspberrypi.org/magpi GET IN TOUCH magpi@raspberrypi.org'
