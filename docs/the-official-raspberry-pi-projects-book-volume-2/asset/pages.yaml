- pgno: 109
  md: '# Tutorial


    # STEP BY STEP


    # JAMES SINGLETON


    James is a developer, engineer, and author. He helps people find software jobs
    in the environmental sector with ‘Cleanweb Jobs’: unop.uk cleanwebjobs.com


    ![](img/d8322379620245fcd21eccc3855b8c78_109_0.png)


    It’s all powered by the Raspberry Pi, timed to go off when you need it to


    A discarded globe from a charity shop is the perfect thing to create the wake-light


    The main light for the alarm is much brighter than the Sense HAT LEDs


    # You’ll Need


    +   - Sense HAT

    +     magpi.cc/1TGGU15

    +   - BlinkyTape LED strip (or NeoPixel / DotStar)

    +   - An unwanted globe

    +   - Plastic bottle

    +   - Sticky pads

    +   - Blu-Tack or putty


    # PI GLOWBE


    # THE PI-POWERED WAKE-LIGHT


    Turn a globe into a glowing orb and use it to help you wake up in the dark winter
    months


    During the winter, or even at any time of the year, it can be difficult to get
    up in the mornings. If you wake before dawn, your body still thinks it’s night
    (because it is). You can buy wake-lights that trick your body into waking up by
    simulating a fake sunrise; they get gradually brighter as your alarm approaches.
    These can be quite expensive, so why not make your own with a Pi and some LEDs?
    To celebrate the Astro Pis on the ISS, we’ve built one using a Sense HAT inside
    a globe that was found in a charity shop – perhaps an unwanted Christmas present,
    now repurposed!


    # >STEP-01


    # Make an LED bulb


    Create a bulb by wrapping an LED strip around a plastic bottle. You could skip
    this, but the Sense HAT is not bright enough to make a lamp. Cut the top off an
    empty plastic bottle, cover it in sticky pads and wrap the LED strip around it
    in a spiral. You can secure the ends further with tape. Have the connection end
    at the wider opening so that you can route the power cable to the Pi and then
    out through the centre. We’ll mount the Pi on top of the upside-down bottle end,
    so ensure it’s flat.'
