- pgno: 116
  md: '# Tutorial


    JASPER HAYLER-GOODALL

    The brains behind one of the winning AstroPi entries and a regular helper at CoderDojo
    Ham and CodeClub! He''s ten.

    coderdojoham.org

    cranmereprimary.org.uk


    Use the 8x8 grid-animator program to create your own exciting catchphrase animations


    Only three wires are needed to connect the Pi to the UnicornHAT


    ![](img/d8322379620245fcd21eccc3855b8c78_116_0.png)


    # You''ll Need


    +   - A Unicorn or Sense HAT shop. pimoroni.com

    +   - A tall 40-pin header (for Sense HAT) shop.pimoroni.com

    +   - Some jumper wires, two buttons, and a breadboard

    +   - The 8x8 grid animator program magpi.cc/2dXmlbn

    +   - The Fuzzy Wuzzy library magpi.cc/2dXlOvH


    # PIPHRAS E!


    Make your own version of the popular TV show, Catchphrase. All you need are a
    few components and a LED matrix, in this case the Unicorn HAT...


    Catchphrase is a TV game show where contestants try to guess the well-known phrase
    or saying being visualised on a big screen. In this project, you will be making
    a similar game, using either a Sense HAT or a Unicorn HAT to display the animation.
    We have mainly written this project for a Unicorn HAT, but with a little modification
    it can work with the Sense HAT. To make the game two-player, we have added some
    buttons to see who is the fastest at guessing the catchphrase.


    If you have a Sense HAT, remove the header already attached and replace it with
    a tall one instead. This should leave some pins sticking out of the top of the
    Sense HAT, which will be enough to attach the wires.


    # >STEP-01

    Put your hat on


    Later on, we will attach a breadboard to use some buttons, so we''ll need access
    to the Pi''s GPIO pins. Therefore you shouldn''t just place the Unicorn HAT directly
    onto the GPIO pins; instead, connect it using jumper wires. Surprisingly, the
    Unicorn HAT only uses three pins (5V, GND, and GPIO 18), so these are the only
    ones we need to worry about.


    # >STEP-02


    # Download the animator program and get creating


    When you download the 8x8 grid animator program, make sure you use the appropriate
    one for your HAT. If you have a Unicorn HAT, use the command:


    ```

    sudo python 8x8grid-unicorn.py

    ```


    To create an animation, simply select a colour from the palette on the right,
    and click on a circle on the grid to turn that colour on. Add another frame by
    pressing the >> button; this will duplicate the current frame. If you need to
    clear the frame, press the ‘clear frame’ button. You can also play your animation
    on'
