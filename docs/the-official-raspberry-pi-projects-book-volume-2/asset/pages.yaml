  md: '# PRESERVING YOUR PI


    ![](img/d8322379620245fcd21eccc3855b8c78_42_0.png)


    # >STEP-01

    Building the base


    The Raspberry Pi fits inside the Mason jar, but it needs to be held upright. For
    this, Matt cut a six-inch base. He then sanded it so it had round edges (reminiscent
    of an Apple TV).


    ![](img/d8322379620245fcd21eccc3855b8c78_42_1.png)


    # >STEP-02

    Put a lid on it


    The lid of the Mason jar has a hole drilled in the centre. This is used to secure
    it with a nut and washer. Then four more holes are drilled to house the LED lights.
    The power and Ethernet cables are run through another hole.


    ![](img/d8322379620245fcd21eccc3855b8c78_42_2.png)


    # >STEP-03

    Putting it together


    The BitTorrent software is installed and set up to back up a folder on other local
    computers. Finally, the Mason jar is screwed on top of the lid and is lit up by
    the LEDs.


    straightforward: “I used a saw to cut the base into a square, a sander to round
    it off, and a drill to make the LED, Ethernet, and power holes. A few trips to
    Home Depot for antique drawer pulls, some rubber feet, brackets and screws, and
    that was it.”


    Matt’s Mason Jar Preserve connects via Ethernet, but you could use WiFi. “I am
    still curious how much glass would affect the signal,” he tells us. “In the end
    I chose Ethernet for transfer speed, availability, simplicity, and reliability.
    Also, because I was low on USB WiFi dongles. Like, zero.”


    # Powered by BitTorrent


    Matt used BitTorrent to create the backup software. “It’s similar to Dropbox,”
    he says, “but instead of a centralised server in the cloud, you connect two or
    more of your own devices directly together over the BitTorrent protocol. Just
    like Dropbox, connected BitTorrent sync machines all sync up a specified folder
    on their system. So basically, it’s free and the storage is only limited to the
    connected storage.”


    Unlike BitTorrent file sharing, Matt’s system is completely


    private. “Whenever you create a sync folder, it gets a unique string of letters
    and numbers,” explains Matt. “This key uniquely identifies it over the BitTorrent
    sync protocol. Keys can provide either read/write access or read-only access to
    anyone you give it to. You generally want to keep them safe. If I shared that
    key publicly, then I’d have a public file-sharing seed similar to the BitTorrent
    everyone knows and loves.”


    Matt uses his the Mason Jar Preserve to back up family photos and videos. “I really
    just wanted one more layer of redundant backup of things like the birth of our
    kids, wedding photos, and various family-related media. It uses the Raspberry
    Pi’s SD card for storage. Therefore, the larger the SD card you put in your Pi,
    the more you can store.”


    We think the end result is glorious. When the Mason Jar Preserve is syncing, it
    animates the LEDs using the Node.js script, BitTorrent Sync API, and the GPIO
    pins. When it sits idle, they glow red. “I wanted it to look like the jar was
    filled with red raspberry preserves,” says Matt. “It especially looks great at
    night.”


    ![](img/d8322379620245fcd21eccc3855b8c78_42_3.png)


    Some furniture fittings from Home Depot were used to embellish the design


    ![](img/d8322379620245fcd21eccc3855b8c78_42_4.png)


    The Mason jar looks especially good in low light when its LEDs are illuminated'
