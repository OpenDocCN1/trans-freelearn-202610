  md: '# ASSEMBLE YOUR ZERO


    It’s simple enough to put your Raspberry Pi Zero together – as easy as 1, 2, 3,
    in fact…


    FREE

    CABLE

    BUNDLE!

    SUBSCRIBE TODAY

    Page 42


    # > STEP ONE

    PLUG IN SD CARD


    You’ll need to install NOOBS (New Out Of Box Software) onto your Raspberry Pi
    Zero, enabling you to choose an operating system. Plug your microSD card into
    another computer and visit the Raspberry Pi download site (magpi.cc/1MYYTMo).
    Download Raspbian and install it via a card writer as described in our getting
    started guide. Pop it in once its written.


    # > STEP TWO

    CONNECT CABLES


    Plug in the mini-HDMI to HDMI connector and make sure it’s properly connected
    between the Raspberry Pi Zero and your display. Now plug in your USB adaptor,
    making sure it’s in the correct micro-USB port, and attach your USB hub. You may
    not need a hub with external power, but make sure one is handy just in case.


    # > STEP THREE

    POWER IT UP


    Plug the power cable into the micro-USB power socket, again checking to make sure
    it’s the correct one – at this point it should be the only one left. Plugging
    the other end of the power supply into a wall socket will immediately turn the
    Raspberry Pi Zero on. You’re now ready to start a new chapter in hacking and making!


    # GRAB YOUR CABLES


    Don’t have a mini-HDMI or micro-USB converter? We’ve got you covered…


    We understand the cables required to get your Raspberry Pi Zero hooked up are
    not particularly common; although you might have a mini-HDMI cable if you’ve bought
    a really nice camera in the last few years, the micro-USB adaptors are much less
    common. With that in mind, Raspberry Pi has put together a cable bundle that will
    help you get your Zero working in no time. Just head over to the Swag Shop (swag.raspberrypi.org)
    to get a bundle today!


    Below These two special cables allow the Pi Zero to be teeny-tiny


