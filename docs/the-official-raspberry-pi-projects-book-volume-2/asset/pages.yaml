  md: '# MATCHBOT


    A great little robot that really shows off how versatile the Pi Zero really is


    ![](img/d8322379620245fcd21eccc3855b8c78_86_0.png)


    MARK CANTRILL

    Electronics design engineer, Maker

    astro-designs.com


    In the last issue, we had an excellent 3D-printed Pi Zero robot, as made by Richard
    Hayler (magpi.cc/1lmeoi). We didn’t think we’d start seeing more robots until
    a few weeks down the line, but only a few days later, Mark’s Zero-powered Matchbot
    crossed our Twitter feed.


    > Matchbot was built in just a couple of days


    “Matchbot, which was built in just a couple of days, is just for a bit of fun
    really,” Mark tells us. “When the Pi Zero came out, I gave myself a challenge
    of building something really tiny. I really wanted a break from other things that
    I’ve been working on recently, and a chance to join in the fun of Pi Wars. Plus,
    as a nice simple robot, I hope to use it to help get our two girls interested
    in the Raspberry Pi and physical computing.”


    While it would have been amazing in itself to use spare robot kit he had lying
    around, Mark actually


    ![](img/d8322379620245fcd21eccc3855b8c78_86_1.png)


    ![](img/d8322379620245fcd21eccc3855b8c78_86_2.png)


    ![](img/d8322379620245fcd21eccc3855b8c78_86_3.png)


    ![](img/d8322379620245fcd21eccc3855b8c78_86_4.png)


    Matchbot fits in a matchbox and uses little more than the CamJam EduKit 3


    The motors had to be tiny, geared just right, and reasonably powerful


    The LED flashes twice for the line-following program, three times for the proximity
    test, while four and five flashes will exit the script and shut down the Pi respectively


    repurposed the parts of a CamJam EduKit 3 to build it. “It’s built from a large
    matchbox, two tiny geared motors, plus wheels, and the rest (motor drivers, sensors,
    and battery box) is mostly from a CamJam EduKit 3. There’s also a 5V regulator
    so that it can use the motor battery to power the Pi.” As well as the motorised
    wheels, the Matchbot features ultrasonic distance sensors and a line-following
    sensor. Fitting the robot inside a matchbox is a feat in itself. However, the
    control interface for the Matchbot is inspired – with no WiFi to talk to it remotely,
    Mark has programmed the distance sensors to change mode depending on how long
    you hold your hand out in front of it, with a flashing LED giving you an indication
    of what mode you’ve activated. On the day, at Pi Wars, it handled the line-following
    course very well!'
