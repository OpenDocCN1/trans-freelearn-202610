    that when you move


    your hands around it, you can generate music,” Linus explains. It’s not exactly
    like a normal theremin, though. “Unlike a classic theremin, my project uses an
    ultrasound sensor rather than measuring electrical fields with antennas, and currently
    my project only has a single sensor, so you can only control the tone it produces.
    Eventually, I plan to add another so that the beat can also be manually controlled.”
    Theremins were used to create the eerie, creepy music for classic sci-fi films.
