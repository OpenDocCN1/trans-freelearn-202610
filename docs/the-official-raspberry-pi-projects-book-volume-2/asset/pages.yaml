    tuning took a while.” The whole process is deceptively simple then, even though
    it’s


    hardly your typical Pi-based project. There are a few caveats, however, and Linus’s
    Pi-powered theremin could do with a few improvements, as he explains: “It’s surprisingly
    hard to operate well, as you need a very steady hand and good aim to get the exact
    tone you are after... I plan to add another sensor to control the beat of the
