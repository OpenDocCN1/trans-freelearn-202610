  md: '![](img/d8322379620245fcd21eccc3855b8c78_154_0.png)


    With male headers in place, wiring up the switch is as simple as slipping the
    female headers over the new pins


    RUN header in step 2. Press the iron against the base of one pin, making sure
    it’s also touching the shiny copper ring or square on the circuit board. Count
    to three then, with your other hand, push some solder against the base of the
    pin without touching the iron’s tip.


    The solder should melt then appear to be ‘sucked’ into the header’s hole. If it
    doesn’t, remove both solder and iron, clean the iron’s tip, adjust your positioning,
    and try again.


    # >STEP-05

    Inspect the joint


    With both pins soldered, inspect your handiwork before trying to use the Pi Zero.
    The solder joints should appear to flow smoothly up from the circuit board to
    the pin, without any gaps. If you can still see copper on the circuit board or
    the solder isn’t sticking to the leg of the pin, apply the iron again to ‘reflow’
    the solder and, if required, add more.


    Make sure you haven’t connected the two pins together with excess solder. If you
    have, use a desoldering pump or braid to remove the excess, otherwise the Pi will
    fail to boot.


    # >STEP-06

    Wire the switch


    If you’re using a reset switch from a PC case, the female header can be inserted
    directly onto the RUN header’s new pins in either orientation. Otherwise, use
    a pair of female-to-female jumper wires to connect the pins to any switch described
    as ‘momentary, normally open’. These can take many forms, from cheap tactile switches
    to more expensive vandal-proof devices.


    Briefly press the switch to reset when the Pi is running, but be warned this can
    cause SD card corruption if the Pi was writing to it at the time. If the Pi has
    been shut down, press the switch to power it back on – this is always safe.


    it doesn’t have any pins inserted. While it’s possible to solder a switch directly
    to the header, doing so will block the GPIO and TV headers; it’s better to solder
    male pins into the header and run wires to the reset switch.


    Take two of the pins in a bundle and snap them off by placing your thumbnail into
    the divot in the plastic between pins and pushing. Insert these into the Pi Zero’s
    RUN header from the top, and secure them with tape or Blu-Tack, ready for soldering.


    # >STEP-03

    Prepare the iron


    Make sure your iron is safely in its stand, then plug it into a socket.


    # >STEP-04

    Solder the pins


    Turn the Pi Zero over to expose the pins you stuck through the socket. If you’re
    using a cleaning sponge, wet this under a running tap before wringing it out so
    it’s damp but not sodden; if you’re using brass shavings, no water is required.


    Give the iron a few minutes to heat up, then wipe the tip on the sponge or brass
    shavings. When clean, ‘tin’ the iron by melting a small amount of solder onto
    the tip, then wiping it on your cleaning material again. The tip should look shiny,
    with no sign of black residue or discolouration.


    # QUICK TIPS


    # KEEP THE TIP CLEAN


    A dirty iron tip will make for difficult soldering. Clean the tip regularly while
    soldering, and re-tin with fresh solder every so often.


    # EMERGENCY USE ONLY


    Just like cutting the power, using the reset switch can cause SD card corruption.
    Use it only when shutting the Pi down another way is impossible!


    ![](img/d8322379620245fcd21eccc3855b8c78_154_1.png)


    A small piece of Blu-Tack or masking tape can help keep a component in position
    while you flip the board for soldering


    ![](img/d8322379620245fcd21eccc3855b8c78_154_2.png)


    Any momentary-type normally open switch will work fine for this project, including
    this high-quality metal anti-vandal switch'
