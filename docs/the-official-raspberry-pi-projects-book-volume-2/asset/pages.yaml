  md: '# GET STARTED WITH SENSE HAT


    The exciting new sensor add-on for the Raspberry Pi is very easy to use once you
    know how. We’ll show you how, then.


    # You''ll Need


    +   - Sense HAT magpi.cc/1TGGUt5

    +   - Sense HAT library

    +   - Raspbian - magpi.cc/1MYYTMo


