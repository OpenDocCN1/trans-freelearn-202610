  md: '# SHOT

    THROUGH THE

    STOMACH


    Take the scares around with you thanks to this gruesomely interactive costume


    LUIS MARTIN

    Maker, R&D engineer, major trauma victim

    bit.ly/1KNZWot


    Scary pumpkins, doors, and houses are one thing, but a good scary costume is a
    big part of Halloween. While you can’t beat the classics of vampires and witches
    and zombies, more imaginative and horrific costumes are popping up every year.
    Luis Martin took his costume to a new level by adding a Pi and some clever coding
    to make it look like he’d been shot right through his stomach, something he’d
    seen on The Walking Dead.


    It’s actually quite a simple and ingenious design. Using a Raspberry Pi as its
    main core, Luis took a Pi Camera Module and a 7-inch screen and had a live feed
    from the camera play onto the screen. By having the Pi and camera on his back,
    he was able to relay the live feed to the screen that was showing through his
    shirt, giving the illusion that there was indeed a hole in his stomach.


    Scary indeed – just don’t ask him to turn around to ruin the effect. It also involves
    a bit more than electronics, though: a later border was created around the edge
    of the screen to simulate the gruesome look of flesh to better create the effect
    through his clothes. With skin-tone paint added along with blood and detailing
    to get the right effect, he also cut up an old T-shirt and stained it with fake
    blood.


    > "You have to be eager to stain your hands," Luis tells us. "Especially blood.
    The more blood in a zombie costume, the more realistic!"


    With the shirt ready, Luis took a GoPro harness and had it hold the screen down
    to his stomach, as well as using it to attach the camera to the correct spot on
    his back for the illusion to work. This is then simply connected to the screen
    via the HDMI port on the Raspberry Pi – switch it on and you’re ready to go!


    It certainly sounds gruesome, and you’d think seeing a zombie walk around with
    a hole in his stomach would make everyone scream and run away. "Everyone wanted
    a picture through the hole, like some kind of blood-coated selfie?" Kids these
    days, eh? You put a hole in your stomach and they’re not even scared.


    # COMPONENTS LIST


    CONJURE UP YOUR OWN VERSION


    +   - Pi Camera Module

    +   - 7-inch touchscreen

    +   - HDMI cable

    +   - GoPro chest mount harness

    +   - Portable battery


    ![](img/d8322379620245fcd21eccc3855b8c78_80_0.png)


    ![](img/d8322379620245fcd21eccc3855b8c78_80_1.png)


    Above Is there anything more indicative of modern culture than this image?


    Left You don’t have to pull a face, but it makes the picture look a bit better


    Below The screen’s fleshy border adds to the effect


    ![](img/d8322379620245fcd21eccc3855b8c78_80_2.png)'
