  md: '# DANA FLINN & BRETT HAINES


    Dana Flinn (left) is a project administrator in Public Relations at Wolfram Research,
    and Brett Haines (right) is a junior software engineer in the Research & Development
    department.

    magpi.cc/10tb5Af


    A single function in the Wolfram Language can send a tweet from your Pi


    Authorisation is only required once for the Wolfram Language to tweet on your
    behalf


    ![](img/d8322379620245fcd21eccc3855b8c78_103_0.png)


    # You''ll Need


    +   - A Twitter account

    +   - The Wolfram Language Documentation Center

    +     magpi.cc/10tbmno

    +   - Internet access


    # TWEET FROM YOUR RASPBERRY PI WITH THE WOLFRAM LANGUAGE


    Dana Flinn and Brett Haines walk you through how to easily send tweets in the
    Wolfram Language, using the SendMessage function


    The Wolfram Language is a powerful knowledge-based language that makes computation
    accessible to everyone, and is an easy language to dip your toes into as a first-time
    programmer. To send tweets from Twitter on your Raspberry Pi, all you need is
    a single function. We’ll be using SendMessage, which is a multipurpose function
    in the Wolfram Language that gives Raspberry Pi users the ability to seamlessly
    tweet from their device.


    Using the SendMessage function, we’ll walk you through how to apply the symbolic
    language and tweet using your Raspberry Pi. Don’t feel limited to just tweeting
    with this function, though! SendMessage can also be used to generate an email,
    update a Facebook or LinkedIn status, and generate a beep.


    # >STEP-01


    # Prepare the syntax


    First, you need to launch your copy of Mathematica on your Raspberry Pi and open
    a blank notebook. With over 5,000 functions built into the Wolfram Language, it
    can seem intimidating at first. However, using the Documentation Center will make
    it simple to find the right function for your project.


    In the Wolfram Language, all functions use square brackets and have names that
    start with capital letters. The function needed for this project is SendMessage,
    which is rather straightforward. It’s used to send a message to a specified channel,
    which in our case is Twitter.


    # PYTHON VS WOLFRAM


    Wolfram allows for much easier access to Twitter compared to Python so, depending
    on your needs, Wolfram may be all you need.'
