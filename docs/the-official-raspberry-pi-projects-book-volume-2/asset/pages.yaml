- pgno: 182
  md: '![](img/d8322379620245fcd21eccc3855b8c78_182_0.png)


    ![](img/d8322379620245fcd21eccc3855b8c78_182_1.png)


    ![](img/d8322379620245fcd21eccc3855b8c78_182_2.png)


    > The guidebook does a fantastic job of walking you through three example projects


    Attach the stencil to a wall – or, if you’re not sure about the somewhat permanent
    nature of the paint becoming a fixture of your house, a large sheet of paper or
    card – and brush on the paint. Decorate with the coloured overlays, use the thinner
    paint tube to draw wires leading to the Touch Board, copy the MP3s to the microSD,
    and voila: an interactive house.


    The remaining two projects are variations on a theme. The first adds touch-sensitivity
    to everyday objects, such as a pill bottle which reminds you of dosages, or a
    photo frame that describes its own scene. The final project has you brushing the
    paint onto the floor to create an intruder alarm, albeit one which only works
    if said intruder is barefoot.


    The three projects detail some, but not all, of the Touch


    Board’s capabilities. A page of extended projects at the back of the guidebook
    points you towards the website to learn about the board’s more advanced capabilities,
    such as reprogramming it to operate as a non-contact distance sensor or a Makey
    Makey-style musical instrument.


    At this point, the Touch Board is likely to have entranced children but potentially
    turned more advanced hobbyists off. Towards the back of the guide, it’s revealed
    that the Touch Board is more powerful than it would first appear: it’s a fully
    functional Arduino, compatible with various Shields and add-ons to provide everything
    from Bluetooth connectivity to motor control.


    A glance at the board itself reveals the familiar Arduino headers, albeit without
    pins,


    with full access to these for more advanced creations. This, combined with an
    Atmel ATmega microcontroller, gives the board the ability to do anything an Arduino
    can do, including interfacing with external hardware, such as motors, servos,
    sensors, or even the Raspberry Pi itself. Combined with the flexibility of Bare
    Conductive’s clever paint, this gives the kit considerable legs when the three
    bundled projects are finished.


    # Last word


    It’s not cheap, but for anyone looking to get started with conductive paint or
    touch-based projects, this kit is easy to recommend and very well put together,
    with considerable attention to detail.


    ★★★★★'
