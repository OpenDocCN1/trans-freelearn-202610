  md: '# PUMPKIN PI


    Usually a delicious dish, can you stomach this version?


    DREW FUSTINI

    Software developer for element14 community, gourd sorcerer

    bit.ly/1ilW2te


    ![](img/d8322379620245fcd21eccc3855b8c78_78_0.png)


    Carved pumpkins and jack-o’-lanterns are a big Halloween tradition in many countries.
    Thanks to the internet, there’s been an explosion in people wanting to make their
    own custom pumpkins to show off, which are a bit more than just a pair of eyes
    and spooky grin. These days, you can print off pumpkin carving patterns for just
    about anything, and it’s a great way to do something a little creative with some
    flesh left over to maybe make a delicious soup or dessert.


    Carving a pumpkin isn’t the only way to express yourself, however. To truly create
    a ‘hack-o’-lantern’, we need to add some electronics to its innards and dial up
    the spook-factor. That’s exactly what Drew did with his Pumpkin Pi for the element14
    community. Some of the projects he creates are inspired by upcoming holidays,
    and in this case Halloween was approaching.


    The whole system is fairly simple: by activating a preset script from a web interface
    on his computer, the lights start rhythmically changing colour (check out the
    YouTube video to properly see it in action: youtu.be/Ilv8H7WPfQw). The interface
    is mounted on the Pi and if you use his program for such a project, you can have
    multiple sounds and light sequences activating within the pumpkin. The construction
    of the Pumpkin Pi requires a little more than just pressing a button, though.
    Taking


    a pre-carved pumpkin (you could carve one yourself), Drew then lined it with a
    large plastic food bag to make sure the electronics inside didn’t get too damp
    from the pumpkin’s moisture. A carving on the rear was used to pass the power
    cables through, and the breadboard with all the LEDs and such on was placed on
    the Raspberry Pi to save space. He also put on chopped-up drinking straws to diffuse
    the light better throughout the pumpkin. A speaker is attached and the pumpkin
    is done and ready for testing. If you want to make it a little more permanent,
    you can make use of a Pi Plate to solder the circuit and then mount it onto the
    Raspberry Pi.


    The Pumpkin Pi is simple, but well thought out and put together. If you’re going
    to be inspired by any of these Halloween projects, we’d recommend starting out
    with this one just to get the feel of creating a creepy contraption for your window
    or porch.


    # COMPONENTS LIST


    CONJURE UP YOUR OWN VERSION


    +   - A carved pumpkin

    +   - Adafruit Pi Plate

    +   - Adafruit Pi Box

    +   - LEDs

    +   - Resistors and transistors


    ![](img/d8322379620245fcd21eccc3855b8c78_78_1.png)


    Above A normal pumpkin, or a lost soul trapped in produce?


    ![](img/d8322379620245fcd21eccc3855b8c78_78_2.png)


    Above All you need to hack your pumpkin are some LEDs and some straws, apparently


    ![](img/d8322379620245fcd21eccc3855b8c78_78_3.png)'
