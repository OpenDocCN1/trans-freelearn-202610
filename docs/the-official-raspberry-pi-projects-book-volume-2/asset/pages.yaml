    sudo rm /var/www/index.html

    ```


    Visit the IP address of your Pi (e.g. http://192.168.1.45 – you can find this
    by using ifconfig) and you should see an empty directory listing. If you run the
    following command and refresh the page, you should see an image file listed. You
    run this as a superuser so you can write to the directory.


    ```

    sudo raspistill -o /var/www/testimage.jpg

    ```


    Click on the file link and you’ll see the image in your browser.


    # >STEP-04

    Capture the images


    Set up your scene and check the positioning of the camera.


    ```

    sudo raspistill -w 1920 -h 1080 -o /var/www/testimageFullHD.jpg

    ```


    The width and height have been changed to capture a smaller image in 16:9 aspect
    ratio. This makes things easier later. The top and bottom are cropped,


    Below Some bread dough ready to prove. Watch it rise in your video. Be careful
    not to move the bowl or camera during filming


    ![](img/d8322379620245fcd21eccc3855b8c78_106_0.png)


    ![](img/d8322379620245fcd21eccc3855b8c78_106_1.png)


    so make sure that your subject is in frame. Run this to start the capture:


    ```

    sudo raspistill -w 1920 -h 1080 -t 10800000 -tl 10000 -o /var/www/frame%04d.jpg
    &

    ```


    Above Shell running the rendering process on the Raspberry Pi. This will take
    some time, so you may prefer to use a faster machine


    This takes a photograph every ten seconds (10,000 milliseconds) for three hours
    (10,800,000 milliseconds). The ampersand (&) at the end runs the process in the
    background.


    # >STEP-05

    Prepare to make the video


    You can render the video on the Raspberry Pi, but it’ll be very slow. A better
    way is to transfer the files to a more powerful computer. In any case, you’ll
    need to install the tools on the rendering machine; for the Pi, enter:


    ```

    sudo apt-get install libav-tools

    ```


    This installs a fork of FFmpeg, but you can also use the original FFmpeg. To copy
    the images to a remote machine, you can download them from the web server using
    wget or curl. For example:


    ```

    wget -r -A jpg http://192.168.1.45

    ```


    Or if you don’t have wget...


    ```

    curl http://192.168.1.45/frame[0001-0766].jpg -O

    ```


    Change the IP address and numbers accordingly.


    # >STEP-06

    Make the video


    The final step is to make the video. Run this command to start the rendering process:


    ```

    sudo avconv -i /var/www/frame%04d.jpg -crf 4 -b:v 10M /var/www/video.webm &

    ```


    When this has finished, you’ll be able to view the video in your browser. The
    default frame rate is 25fps. This compresses three hours of frames at ten-second
    intervals to about forty seconds of video. You can adjust this with the -framerate
    command-line option. The bitrate (-b) has been set high, and the Constant Rate
    Factor (-crf) low, to produce a good-quality video.


    MAKE AN ANIMATED GIF


    Instead of video, make an animated GIF with ImageMagick. Use smaller images, captured
    less frequently.


    sudo convert /var/www/frame*.jpg /var/www/anim.gif &


    OTHER VIDEO FORMATS


    WebM is an open video format that can be displayed directly in most browsers.
    However, other video formats are available.'
