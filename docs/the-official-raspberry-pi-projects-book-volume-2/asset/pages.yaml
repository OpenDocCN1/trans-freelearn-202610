- pgno: 132
  md: "The constant MIN_T_BETWEEN_WARNINGS prevents messages being sent more frequently\
    \ than once every hour. You might want to change this while you are testing the\
    \ project.\n\nThe next set of variables are used to identify the location for\
    \ the file of your particular temperature sensor. This will be in the folder /sys/bus/w1/devices/,\
    \ but then the folder name after this will be different for every DS18B20.\n\n\
    The function read_temp reads the content of the device file. This will be a two-line\
    \ message from the temperature sensor that looks something like this:\n\n```\n\
    28 01 4b 46 7f ff 08 10 4c : crc=4c YES,\n28 01 4b 46 7f ff 08 10 4c t=18500\n\
    ```\n\nThe number at the start of both lines is the unique ID for the DS18B20,\
    \ and the first line ends in YES if the reading was successful, with the temperature\
    \ being reported at the end of the second line as the number of thousandths of\
    \ a degree C. In this case, that’s 18.5°C. The function read_temp extracts the\
    \ temperature value from the message and returns it.\n\nThe send_notification\
    \ function constructs a URL for the IFTTT web service, providing the temperature\
    \ in the request body.\n\nThe main loop repeatedly reads the temperature, to check\
    \ if it has fallen low enough to trigger an alarm. If so, it calls send_notification\
    \ and then delays until MIN_T_BETWEEN_WARNINGS minutes have passed.\n\n# Using\
    \ your pipe monitor\n\nTo test the project before you install it, set ALARM_TEMP\
    \ to a couple of degrees lower than the ambient temperature, then put the sensor\
    \ into some cold water. After a few moments, the temperature readings will start\
    \ to fall until you get a message:\n\nTEMPERATURE WARNING\nCongratulations! You’ve\
    \ fired the pipe_alert event\n\nIf you go and check your email inbox, you should\
    \ see a notification message.\n\nEven the power-efficient Raspberry Pi generates\
    \ enough heat to provide a misleading temperature reading. To avoid this, make\
    \ sure that the DS18B20 is well away from the Raspberry Pi itself, ideally near\
    \ or even taped to the pipes that you are trying to protect. You will of course\
    \ also need somewhere to connect a power adaptor, and make sure that your roof\
    \ space is not out of range of your WiFi router.\n\nThis is a project that lends\
    \ itself to other tasks. You could modify it to just report the temperature at\
    \ regular intervals, or to check for temperatures getting too hot rather than\
    \ too cold. You can also pick other actions from IFTTT, such as tweeting or sending\
    \ a Facebook update.\n\n# Pipes.py\n\nLanguage\n>PYTHON\n\n```\nimport glob\n\
    import time\nimport urllib, urllib2\n\nALARM_TEMP = 5.0 # degrees C\nMIN_T_BETWEEN_WARNINGS\
    \ = 60 # Minutes\nEVENT = 'pipe_alert'\nBASE_URL = 'https://maker.ifttt.com/trigger/'\n\
    KEY = 'cyR3vPNF1P9K32W4NZ B9cd'  # Place your own key here\n\n# These constants\
    \ used by the 1-wire device\nbase_dir = '/sys/bus/w1/devices/'\ndevice_folder\
    \ = glob.glob(base_dir + '28*')[0]\ndevice_file = device_folder + '/w1_slave'\n\
    \n# Read the temperature message from the device file\ndef read_temp_raw():\n\
    \    f = open(device_file, 'r')\n    lines = f.readlines()\n    f.close()\n  \
    \  return lines\n\n# Split the actual temperature out of the message\ndef read_temp():\n\
    \    lines = read_temp_raw()\n    while lines[0].strip()[-3:] != 'YES':\n    \
    \    time.sleep(0.2)\n        lines = read_temp_raw()\n    equals_pos = lines[1].find('t=')\n\
    \    if equals_pos != -1:\n        temp_string = lines[1][equals_pos+2:]\n   \
    \     temp_c = float(temp_string) / 1000.0\n        return temp_c\n\n# Send an\
    \ IFTTT pipe_alert event\ndef send_notification(temp):\n    print(\"TEMPERATURE\
    \ WARNING\")\n    data = urllib.urlencode({'value1' : str(temp)})\n    url = BASE_URL\
    \ + EVENT + '/with/key/' + KEY\n    response = urllib2.urlopen(url=url, data=data)\n\
    \    print(response.read())\n\nprint(\"Monitoring\")\nwhile True:\n    temp =\
    \ read_temp()\n    print(temp)\n    if temp < ALARM_TEMP:\n        send_notification(temp)\n\
    \        time.sleep(MIN_T_BETWEEN_WARNINGS * 60)\n```\n\n![](img/d8322379620245fcd21eccc3855b8c78_132_0.png)"
  merge: -1
  img_proc: true
- pgno: 133
  md: '# Tutorial


    # WALKTHROUGH


    # EVERYDAY ENGINEERING


    # PART 11


    # SIMON MONK


    Simon Monk is the author of the Raspberry Pi Cookbook and Programming the Raspberry
    Pi: Getting Started with Python, among others.

    simonmonk.org

    monkmakes.com


    # PI MI-LIGHT


    Solve real-world electronic and engineering problems with your Raspberry Pi and
    the help of renowned technology hacker and author, Simon Monk


    # You''ll Need


    +   - NRF24L01

    +     2.4GHz wireless radio transceiver module (eBay)

    +   - Mi-Light RGB LED light bulb

    +   - Mi-Light 2.4GHz remote control

    +   - 7 × female-to-female jumper wires


    Mi-Light light bulbs look just like normal LED light bulbs and are available at
    a similar price, but they include a 2.4GHz RF radio link. This can be used with
    an RF remote control to switch lights on and off, with the lights grouped into
    four zones. The remote control also allows you to vary the brightness and colour
    of the light. Mi-Light produces a ready-made module that allows you to link the
    lamps to your WiFi router and then control the lighting with a smartphone app.
    However, by using a £3 ($5) radio module connected to a Raspberry Pi, you can
    let your Raspberry Pi take control of Mi-Light bulbs in your home, opening up
    all sorts of possibilities for home automation.


    One possible use is to have the Raspberry Pi operate as a web server, providing
    you with a web interface that will let you turn lights on and off from the browser
    of any device connected to your network.


    ![](img/d8322379620245fcd21eccc3855b8c78_133_0.png)


    Mi-Light LED bulb


    NRF24L radio transceiver'
  merge: -1
  img_proc: true
- pgno: 134
  md: 'This project is based on an original blog post by Torsten Tränkner that you
    will find in German here: torsten-traenkner.de. The project has only been tested
    on a Raspberry Pi 2, and may need some adaptation for other models of Pi.


    As you’ll see from the list of required components, this project does not involve
    any soldering. The RF module is connected to the Raspberry Pi using female-to-female
    jumper wires. Even though the Raspberry Pi will eventually take over the operation
    of the lights, you do need a Mi-Light remote control to set things up in the first
    place.


    ![](img/d8322379620245fcd21eccc3855b8c78_134_0.png)


    # BUILDING YOUR PI-MI-LIGHT CONTROLLER


    ![](img/d8322379620245fcd21eccc3855b8c78_134_1.png)


    ![](img/d8322379620245fcd21eccc3855b8c78_134_2.png)


    You should wire up the RF module with your Raspberry Pi powered down, and check
    very carefully that the connections are all correct before you power it back up
    again. Using a GPIO template like the Raspberry Leaf (by MonkMakes) will help
    you find the correct connections on the GPIO connector.


    ![](img/d8322379620245fcd21eccc3855b8c78_134_3.png)


    # >STEP-01

    Attach leads to the RF module


    Start by connecting jumper wires to the RF module using the wiring diagram as
    a reference. You will need connections to every pin except the pin in the bottom
    right of the connector (pin 8). Using leads of the same colour as the wiring diagram
    will help you make the correct connections.


    # >STEP-02

    Connect the RF module


    +   Connect the leads from the RF module to the GPIO header as follows:

    +   - Pin 1 (GND) of the RF module to GND on the GPIO header.

    +   - Pin 2 (VCC) of the RF module to 3.3V on the GPIO header.

    +   - Pin 3 (CE) of the RF module to GPIO 25.

    +   - Pin 4 (CSN) of the RF module to GPIO 8.

    +   - Pin 5 (CLK) of the RF module to SCLK (GPIO 11) on the GPIO header.

    +   - Pin 6 (MOSI) of the RF module to MOSI (GPIO 10) on the GPIO header.

    +   - Pin 7 (MISO) of the RF module to MISO (GPIO 9) on the GPIO header.


    ![](img/d8322379620245fcd21eccc3855b8c78_134_4.png)


    # >STEP-03

    Pair the Mi-Light


    For this step, you will need to plug your light bulb into an appropriate light
    socket. Then turn on the normal light switch and immediately press the On button
    for one of the four light zones on the Mi-Light remote. The lamp will blink three
    times as confirmation. Once paired, the remote will be able to turn the light
    on and off and make other adjustments.'
  merge: -1
  img_proc: true
- pgno: 135
  md: 'This project requires quite a lot of software setup before you can go ahead
    and use it.

    The radio module uses the Raspberry Pi’s SPI interface, which needs to be enabled,
    so run raspi-config using the command:


    ```

    sudo raspi-config

    ```


    Scroll down to the Advanced option, select it, and then select SPI. Enable it,
    and when asked if you want


    > This code is all in C++ but can be called from our Python program


    the SPI module to load automatically, say Yes.

    Next, you need to install and build the NRF24 library for the RF module by issuing
    the following commands:


    ```

    git clone https://github.com/TMRh20/RF24

    cd RF24

    make all

    sudo make install

    ```


    After that, you need to download a messaging library that provides a higher-level
    interface to the basic RF module using the following commands:


    ```

    cd ..

    git clone https://github.com/mysensors/Raspberry

    cd Raspberry

    make

    sudo make install

    ```


    Below Turn light zones on/off from a phone browser


    Now download the code that Torsten Tränkner wrote using the following commands:


    ![](img/d8322379620245fcd21eccc3855b8c78_135_0.png)


    ```

    cd ..

    wget http://torsten-traenkner.de/wissen/smart home/openmilight_raspberry_pi.tgz

    tar xzvf openmilight_raspberry_pi.tgz

    ```


    This code is all in C++ and so that we can make use of it in Python, your expert
    has written a C++ program called send_cmd, which is designed to be called from
    Python with a command message to be sent to the Mi-Light. Download this program
    and the Python code for the project from your Pi’s command line, using:


    ```

    git clone https://github.com/simonmonk/pi_magazine.git

    ```


    Copy all the files in the project folder 11_mi_light into the openmilight folder,
    and then compile two of the programs by using the commands:


    ```

    cp pi_magazine/11_mi_light/* openmilight

    cd openmilight

    sh ./comp.sh

    ```


    You also need to install the Python Bottle library that will be used for the web
    server, using the command:


    ```

    sudo apt-get install python-bottle

    ```


    Before you can run the main program, you need to find the ID of the Mi-Light remote
    that you used to pair with the Mi-Light so that your Raspberry Pi can impersonate
    it.

    Run the program openmilight using the command below, and then press the On button
    for Zone 1 on the remote a couple of times. Each time you press the button, you
    should see a stream of hexadecimal number like the ones in the example below.


    ```

    sudo ./openmilight

    in listening mode

    B0 A1 56 41 C1 03 72 .

    B0 A1 56 41 C1 03 73 .

    ```


    The first three digits (in this case B0, A1, and 56) will be different for your
    remote, so quit the program using CTRL+C and edit the file lights.py, changing
    the value of the ID variable at the top of the file to be the three hex digits
    for your remote.

    Finally, you are ready to fire up the web server using the following command:


    ```

    sudo python lights.py

    ```


    Point a convenient web browser at the IP address of your Raspberry Pi and you
    will see a webpage with On and Off buttons for all four zones. Click the buttons
    for Zone 1 and you should be able to turn all the lights connected to that zone
    on and off.'
  merge: -1
  img_proc: true
- pgno: 136
  md: "# Lights.py\n\n```\nbottle import route, run, template, request\nimport os\n\
    \nID = 'B0 A1 56'\nMIDDLE = '06 C9'\n\nZONES = {\n  'zone1': {'on': '03', 'off':\
    \ '04'},\n  'zone2': {'on': '05', 'off': '06'},\n  'zone3': {'on': '07', 'off':\
    \ '08'},\n  'zone4': {'on': '09', 'off': '0A'}\n}\n\ndef light_on(zone):\n  print(zone\
    \ + \"on\")\n  send(ZONES[zone]['on'])\n\ndef light_off(zone):\n  print(zone +\
    \ \"off\")\n  send(ZONES[zone]['off'])\n\nfrom\ndef send(code):\n  global ID,\
    \ MIDDLE\n  for i in range(1, 5):\n    message = ID + MIDDLE + code + '00'\n \
    \   os.system('./send_cmd \"' + message + '\"')\n\n# Handler for the home page\n\
    @route('/')\ndef index():\n  zone = request.GET.get('zone', 'zone1')\n  state\
    \ = request.GET.get('state', 'off')\n  if state == 'on':\n    light_on(zone)\n\
    \  else:\n    light_off(zone)\n  return template('home.tpl')\n\n# Start the webserver\
    \ running on port 80\nrun(host=\"0.0.0.0\", port=80)\n```\n\n# How the code works\n\
    \nYou will probably find it handy to have the code up in an editor while we go\
    \ through it.\n\nThe program starts by importing the bottle and os libraries.\
    \ The os library is needed to invoke the send_cmd C program from Python.\n\nThe\
    \ constant ID needs to be set to the three hex digits for your remote, as described\
    \ earlier. The codes in MIDDLE do not need to change. Note that the spaces in\
    \ both these constants must be kept as they are, so that when the hex message\
    \ is constructed, there are spaces between each hex digit.\n\nThe Mi-Light remote\
    \ control allows up to four zones to be defined, and you can attach multiple lights\
    \ to each zone. There are separate On and Off codes that control each of the zones\
    \ independently. These are stored in the variable ZONES, which is a dictionary\
    \ or dictionaries, making it easy to look up the appropriate hex code for the\
    \ command you want.\n\nTwo functions (light_on and light_off) switch all the lights\
    \ on or off for the zone name specified as their parameter. Both these functions\
    \ use the send function to actually send the command to the RF module via the\
    \ C program (send_cmd). The send function first constructs a message string by\
    \ concatenating the ID, MIDDLE section, command code, and finally 00 into a message\
    \ string. The C program is then called five times, passing the message as a parameter.\
    \ Since it can be a little unreliable, sending the message five times makes it\
    \ almost certain to get through to the light bulb.\n\nNext, there is the web server\
    \ part of the code, contained in the index function. This expects the webpage\
    \ to provide two request parameters: the zone name (zone) and whether it is to\
    \ be turned on or off (state). This information is then used to call either light_on\
    \ or light_off. At the end of the index function, the contents of the template\
    \ home.tpl are returned, to provide the browser with the HTML for the web interface.\n\
    \nThe final line of code starts the web server running. Switch over to a browser\
    \ on the Raspberry Pi, or another computer on your network, and type the IP address\
    \ of your Pi into the address bar. To discover the IP address of your Raspberry\
    \ Pi, type the command below into LXTerminal:\n\nhostname -I\n\nIt will be at\
    \ the start of the response as four numbers separated by dots; for example, 192.168.1.22.\n\
    \n# Using your PiMi-Light Controller\n\nAs well as controlling the lights from\
    \ the browser on your computer, you can just as easily use the browser on your\
    \ smartphone, as long as it is connected to the same network as your Raspberry\
    \ Pi.\n\nYou could also adapt the alarm clock program back in issue 33 of The\
    \ MagPi to turn the lights on and off at certain times.\n\nThis project simply\
    \ turns the lighting on and off. Considerable work has been done in reverse-engineering\
    \ the Mi-Light protocol to figure out what all the codes do. So, if you want to\
    \ extend this project to adjust the colour and brightness of the lights, then\
    \ you might want to look at Henryk Płotz’s work: magpi.cc/1NZfcmt"
  merge: -1
  img_proc: true
- pgno: 137
  md: '# Tutorial


    # WALKTHROUGH


    # EVERYDAY ENGINEERING PART 12


    # SIMON MONK


    Simon Monk is the author of the Raspberry Pi Cookbook and Programming the Raspberry
    Pi: Getting Started with Python, among others.

    simonmonk.org

    monkmakes.com


    ![](img/d8322379620245fcd21eccc3855b8c78_137_0.png)


    # BINARY


    # CLOCK


    # You''ll Need


    +   - Raspberry Pi with 40-pin GPIO header

    +   - Sense HAT or Pimoroni Unicorn HAT

    +   - USB WiFi adaptor or Ethernet connection


    Solve real-world electronic and engineering problems with your Raspberry Pi and
    the help of renowned technology hacker and author, Simon Monk


    This is a very simple project to make. In fact, all you really need to do is plug
    the Sense or Unicorn HAT onto the Raspberry Pi’s GPIO header and install the software.


    This project displays the current time in binary. The rows of the display are
    (from top to bottom) the last two digits of the year (e.g. 15), the month number,
    the day of the month, the hour (24-hour format), the minute, the second, and finally
    hundredths of a second.


    # Reading the binary clock


    To read a binary clock, you either need to be good at recognising binary numbers
    or use a bit of arithmetic to calculate the time, by adding up the binary digit
    values for the LEDs that are lit on a particular row.


    For example, the first row displays the year in two-digit format. So, if LEDs
    at positions 8, 4, 2, and 1 are all lit, then the year is 8+4+2+1 = 15. In 2016,
    just the digit position 16 will be lit.


    The colours of the LEDs have no significance – they are different to make the
    display more interesting. If you’re using the Sense HAT, you may need to install
    the software for the HAT using the following commands:


    ![](img/d8322379620245fcd21eccc3855b8c78_137_1.png)


    ```

    sudo apt-get update

    sudo apt-get install sense-hat

    sudo pip-3.2 install pillow

    ```


    If you’re using a Unicorn HAT, then run the following commands:


    ```

    sudo apt-get install python-pip python-dev

    sudo pip install unicornhat

    ```


    There are two versions of the software for this project – one for the Sense HAT
    and one for the Pimoroni Unicorn HAT – so be sure to use the right version of
    the program for your hardware. The Sense'
