    \nto be played (also a string). A simple way is to use a Python construct called\
    \ a dictionary. A real-world dictionary has an index of words, and each word has\
    \ definitions. In a Python dictionary, the word is called the ‘key’, and the definitions\
    \ the ‘values’. Listing_l2.py uses a simple two-item dictionary to map sounds\
    \ and names (the values) onto the C and D keys (the keys). Give it a try.\n\n\
    # >STEP-06\n\n# Putting it all together\n\nWe’ve now explored everything needed\
    \ for our relative pitch tester: we’ll use the piano sounds that come with the\
    \ Piano-HAT library for our notes. Type up the code from the Relative_Pitch.py\
    \ listing (on page 51) and run it with sudo. A reference\n\n# Listing_l1.py\n\n\
    ```\nimport pianohat\nimport pygame\nimport signal\n\npygame.mixer.pre_init(44100,\
    \ -16, 1, 512)\npygame.mixer.init()\npygame.mixer.set_num_channels(16)\n\ndef\
    \ handle_note(channel, pressed):\n    if channel == 2:\n        pygame.mixer.Sound('./mysound.wav').play(loops=0)\n\
    \npianohat.on_note(handle_note)\nsignal.pause()\n```\n\n> In a Python dictionary,\
    \ the word is called the ‘key’, and the definitions the ‘values’\n\nnote (a C)\
    \ is played, then, after a pause, the note to be identified. The player then has\
    \ 6 seconds to press the correct key for the note they just heard. If they get\
    \ it right, all the LEDs will flash in celebration, otherwise they’re asked to\
    \ try again. As an extension, how about using different, selectable instruments?\n\
    \n# Listing_l2.py\n\n```\nimport pianohat\nimport pygame\nimport signal\n\npygame.mixer.pre_init(44100,\
    \ -16, 1, 512)\npygame.mixer.init()\npygame.mixer.set_num_channels(16)\nNOTES\
    \ = {0:['Sound1', './mysound.wav'],\n         2: ['Sound2', './mysound2.wav']}\n\
    \ndef handle_note(channel, pressed):\n    if channel == 0 or channel == 2:\n \
