    magpi.cc/224f0lh


    ![](img/d8322379620245fcd21eccc3855b8c78_200_0.png)


    This could be the perfect introductory programming book to give to someone who’s
    just got a Raspberry Pi for Christmas. With no wasted words, Monk introduces the
    Pi and its operating system, then teaches both Python and using Python with the
    Pi, in a direct and easily absorbed text that harks back to the best beginner
    guides of the 8-bit era. Skip the first two dozen pages if you are not new to
    the Pi, and dive into Python with an introduction that – through well-chosen examples,
    such as a dice rolling simulation – will have you learning conditionals,


    control flow, and comparison operators before you know it. Next, Hangman introduces
    functions, as well as strings, lists, and dictionaries. OOP is touched on with
    a temperature converter, then file handling and GUI programming (with Tkinter)
    through building on the earlier code examples. The Pygame chapter makes use of
    many of the techniques learned, then moves on to refactoring. The same concise
    style is used to cover the Pi hardware for the rest of the book: GPIO pins, breadboard
    prototyping, connecting an Arduino, then a range of sample projects culminating
    in a Raspberry Pi robot. Unreservedly recommended for confident beginners of all
    ages.


    Score ★★★★★


    # FUNDAMENTALS OF WEARABLE COMPUTERS AND AUGMENTED REALITY


    Author: Woodrow Barfield

    Publisher: CRC Press

    Price: £95.00

    ISBN: 978-1482243505

    magpi.cc/224g3wG


    ![](img/d8322379620245fcd21eccc3855b8c78_200_1.png)


    As computers get small enough to mount on the cover of a magazine, and as sensors
    get better, wearable computing – data where you need it – is within reach of all.
    From Google Glass to Google Cardboard, ubiquitous computing is getting nearer
    and cheaper. Augmented reality is used across many industries, and children solder
    together wearable computers at MakeFests. If you’re a maker or programmer involved
    in an AR project, this collection of essays will broaden your appreciation of
    the field considerably. Barfield presents 25 academic papers, over


    700 pages, split over four sections: Introduction (with some shorter, more philosophical,
    overviews of the topic); The Technology (mostly displays and haptics, but also
    tracking); Augmented Reality (with some fascinating and varied cases); and Wearables.
    The last section particularly highlights integration into textiles and clothing,
    as well as presenting useful research on haptic rendering. This is a collection
    of academic papers: extensive references are given, and the language is academic,
    though mostly quite approachable. The research crosses many disciplines, and non-mathematical
    readers will only be given pause by a couple of chapters. An expensive purchase,
    but perhaps a worthwhile one for the local makerspace library, particularly if
    you have an augmented reality project in development.


    Score ★★★★☆


