    # RPIKIDS


    Not a spin-off Saturday morning cartoon, RPiKids is a new entertainment system
    built for Adrian Atwood’s children


    We’ve all seen wacky parental control methods for kids’ entertainment. Our favourite
    is the exercise bike that powers a PlayStation, which may seem cruel but at least
    means there’s a cut-off point for how much they’re able to play. The best method
    is still the simplest: a key code and a timer so that the kids can then do something
    other than stare at a screen all day, freeing up the TV so you can binge-watch
    the entirety of Once Upon a Time’s third series. With the Raspberry Pi being a
    far more powerful option for operating an entertainment centre, it was only a
    matter of time before an intrepid hacker made the ultimate version for their kids.
    Meet RPiKids, created by Adrian Atwood.


    “RPiKids is an all-in-one kids’ entertainment centre with integrated parental
    control features,” Adrian explains. “My kids can enjoy 16-bit games, watch movies
    and more, provided an adult has granted them access by entering a password and
    setting the timer.”


    The RPiKids is a mix of hardware; the system itself is powered by a Raspberry
    Pi, handling Kodi, Emulation Station and the like for the entertainment side.
    The passcode and timer are handled by an Arduino Uno using a rotary encoder (think
    bank safe), which can be pushed as a button to confirm selections. It’s all built
    into a wonderful-looking, steampunky case that was handcrafted by


    Adrian himself from wood with 3D printed detailing.


    There are USB access ports on the front for connecting controllers and portable
    media storage, and the hardware is visible behind a removable clear Perspex panel.
    While it all looks extremely impressive, Adrian claims it’s an overall ‘intermediate’
    level of build.


    “I will say the Raspberry Pi configuration was very straightforward and a beginner
    can mirror my configuration,” he tells us. “Coding the firmware for the Arduino
    parental controls, and having the Arduino and Pi 2 communicate with each other,
    was a little more complex. The case is no problem if you’re into woodworking and
    auto body repair. I have access'
