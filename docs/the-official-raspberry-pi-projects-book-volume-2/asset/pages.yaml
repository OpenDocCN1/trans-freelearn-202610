    Author: Dusty Phillips

    Publisher: Packt

    Price: £31.99

    ISBN: 978-1784398781

    bit.ly/1LinBQP


    ![](img/d8322379620245fcd21eccc3855b8c78_195_5.png)


    A decade ago, Python was an overlooked scripting language and object-oriented
    programming (OOP) was introduced via Java (kitchen sink attached), Smalltalk (in
    academia at least – and subsequently powering Scratch 1.x), or even C++ (ouch).
    Luckily for learners of today, Python is widely accepted, and as a multi-paradigm
    language with strong OOP leanings it makes an ideal introduction to OOP.


    Phillips’s book builds on basic Python knowledge you may have picked up with simple
    procedural scripts for the Pi, for example, and gives you the full object-oriented
    treatment. Starting, logically, with objects and classes, this leads onto inheritance;
    multiple inheritance is discussed (take that, Java) and then the first case study.
    Each chapter is rounded off with a useful case study and practically oriented
    exercises, often generating further thoughts on the topic to be carried to the
    reader’s own work.


    From attribute accessibility to design patterns, Phillips gives the essence of
    OOP in the context of Python’s way of doing things – along the way stretching
    best practice a little, as some places aren’t a comfortable fit for regular expressions
    – but he keeps pushing the reader to consider each bit of knowledge in the context
    of their own code, making for a very interactive book.


