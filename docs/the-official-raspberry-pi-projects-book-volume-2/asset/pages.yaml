  md: '# FABSCAN PI


    Mario Lukas builds 3D scanners from the Raspberry Pi and off-the-shelf components.
    He tells Lucy Hattersley how it’s done


    +   Quick Facts

    +   - All the parts cost less than $100 in total

    +   - Commercial scanners cost around $3,000

    +   - The FabScan software creates PLY and STL files

    +   - The mesh files can be used to 3D-print objects

    +   - Mario is experimenting with dual and green lasers


    Few things in modern life are more fun than 3D-scanning an object, then using
    a 3D printer to create a copy. But 3D scanners are still very expensive to buy.
    FabScan is an open-source, DIY 3D laser scanner being developed by René Bohne
    and Mario Lukas. Initially, FabScan was connected to an external computer, but
    Mario and René have recently created a Raspberry Pi version that houses all the
    components required inside a single box. This Raspberry Pi-powered edition means
    you can build a complete 3D scanner for under $100 (£65).


    The FabScan project has a long history. It started out as a Bachelor’s thesis
    by Francis Engelman at RWTH University in Aachen (Germany) in 2011. In 2014, development
    was taken over by Mario and René. “The FabScan without the Raspberry Pi is an
    open-source, do-it-yourself 3D laser scanner,” says Mario. “After a few months
    I realised that people had problems [getting] the FabScan software working on
    all the different operating systems and hardware setups. “The FabScan uses a laser
    cut plywood case,” continues Mario.


    There is a stepper motor connected to a turntable in the middle.” Inside the case
    is a 5mW red laser and Logitech Lc270 webcam. The laser and a webcam are mounted
    in the front of the case. An Arduino with a FabScan shield controls the stepper
    motor and laser. You place an object on the turntable so the laser runs across
    its surface. As the turntable rotates, the webcam monitors the movement of the
    laser and creates a point cloud of data. The data is turned into a 3D mesh, and
    this file can be exported and used in 3D software. “Since I introduced the Raspberry
    Pi to the FabScan project, the webcam [has


    ![](img/d8322379620245fcd21eccc3855b8c78_33_0.png)


    The Raspberry Pi is housed inside the box and runs a web interface. You connect
    to the latter remotely to begin the scanning process


    The wooden case contains a motorized turntable that rotates the object being scanned.
    It is currently controlled by an Arduino, although a custom Pi HAT is being developed


    A 5mW red laser is fixed in the corner of the FabScan. It projects a line directly
    across the turntable. A Pi Camera Module is used to monitor the laser as the object
    is rotated


    MARIO LUKAS

    Mario Lukas is a hardware hacker, computer scientist, and technology tinkerer
    from Aachen, Germany.

    mariolukas.de'
