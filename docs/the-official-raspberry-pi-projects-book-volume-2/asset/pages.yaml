    Stan Gibilisco has been writing on, and tinkering with, electronics for a long
    time, so this short reference and introduction benefits from distilling decades
    of experience, showing a clarity of approach that indicates a writer and tinkerer
    with plenty to pass on to newcomers. The opening chapter on ‘Setting up Shop’
    is a pleasingly minimalist alternative to the ‘we assume you have a giant spare
    room and lots of money’ approach of some other maker introductions. Although ideal
    for newcomers – and it can be read linearly – there’s plenty of useful reference
    and tips worth dipping into for


    those who’ve been soldering since the NE555 was a hot new chip. Remaining chapters
    are organised by topic in the expected manner: Resistors, Capacitors, Inductors,
    Transformers, Diodes, Transistors, ICs and Digital Basics, More Components and
    Techniques, followed by useful appendices and further reading.


    What really makes the book stand out, in addition to the clear explanations, is
    the experiments at the end of each chapter, which combine practical use of components
    and tools with demonstrating various bits of electronic theory which would be
    quite dry and dusty if taught only as theory. For example, in testing a JFET,
    you gain understanding of where electrons should and should not flow.


