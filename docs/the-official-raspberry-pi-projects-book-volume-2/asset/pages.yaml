    # ANDY BAKER


    A networking software engineer, Andy is also the co-founder of the Cotswold Raspberry
    Jam.

    pistuffing.co.uk


    All the brains for the quadcopter are here – the Pi Zero and the custom PCBs


    The drone is powered by four motors that are completely controlled by the software,
    not just turned on or off


    A wireless dongle allows the whole setup to be controlled remotely from a computer
    or phone


    # Quick Facts


    +   - Andy claims it''s taken him three years so far

    +   - An older version appeared in The MagPi #19

    +   - It couldn''t actually fly for the cover image, though

    +   - Raspbian Jessie fixed a number of programming errors

    +   - It''s only his second Pi project


    # ZOE THE ZERO


    The first in what will more than likely be a swarm of Pi Zero-powered drones,
    Zoe the Zero is the continuation of a long-held dream


    When we were planning issue 40 of The MagPi with its cover-mounted Pi Zero, we
    had a big brainstorm about the kind of projects we could do for features, and
    maybe also as future covers. One thing that we noted was that the Pi Zero could
    be great for powering quadcopters and other drones. In just over a month since
    the issue hit shelves, Andy Baker managed to start the trend and create his own
    drone.


    “I completed my first Pi project (a wheeled ‘Turtle’ robot) in December 2012,”
    Andy tells us. “I wanted to move on to something that was a real challenge, and
    quadcopters were just starting to appear commercially. I was completely ignorant
    of how they worked, so I wanted to fill that gap in my understanding and have
    some fun at the same time.” Andy has spent the last few years building, testing,
    and


    experimenting to create his very own quadcopter from scratch: “I haven’t finished
    yet, primarily because I actually wanted to work it out all by myself, without
    borrowing anyone else’s code or guidance. There was a lot of experimentation and
    learning involved, including a lot of wasted time taking the wrong direction and
    backing up when I hit a metaphorical brick wall – or, more precisely, when I couldn’t
    stop'
