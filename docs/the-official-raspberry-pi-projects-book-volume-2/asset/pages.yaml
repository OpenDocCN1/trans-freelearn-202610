  md: '# PIZERO

    CLUSTER BOARD


    Turn your Raspberry Pi Zeros into a number-crunching cluster of computers with
    this custom-made board


    # Quick Facts


    +   - The board works with any number of Pi Zeros

    +   - From idea to completion, the cluster took six weeks to build

    +   - A Compute Module is used in the Actbulb

    +   - The team have been studying the VideoCore GPU for future projects

    +   - The board is 20cm × 20cm × 5cm, even with Pis attached


    # IDEIN, INC


    Yasuyuki Yamada, Koichi Nakamura and Yukimasa Sugizaki make up the team at Idein,
    Inc, which works on AI technology.

    idein.jp


    ![](img/d8322379620245fcd21eccc3855b8c78_91_0.png)


    ![](img/d8322379620245fcd21eccc3855b8c78_91_1.png)


    A full-size USB port is wired up to each Pi Zero


    16 Pi Zeros working in parallel means 16 1GHz cores and 8GB of RAM are available


    The board is powered by one supply on the rear that can activate all 16 Pi Zeros


    When the Raspberry Pi Zero was being made, Eben Upton mentioned to us how one
    box of Pi Zeros holds hundreds of them. Hundreds of cores and hundreds of gigabytes
    of RAM – a crate of power, if used correctly. We never managed to work out the
    FLOPS one box could theoretically process, even if that might not be feasible.
    However, a Japanese company also saw the power of the Pi Zero in numbers and has
    created the PiZero Cluster Board, which allows up to 16 Pi Zeros to do parallel
    computing.


    We spoke to Koichi Nakamura, representative director of Idein, Inc, about the
    cluster board:


    “When I was playing with Raspberry Pi Zero, I realised that costs of cables and
    adapters are relatively expensive, and found a solution that used micro USB plugs
    for cradles. I used this idea to create our computer cluster… I think it’s useful
    for many other projects, [but it was] originally designed and developed for our
    internal purposes.”


    Idein is currently developing the Actbulb, a Pi-powered sensor suite that fits
    into standard lightbulb sockets to use in any way you see fit. Sensors include
    a microphone and cameras; it’s also internet-enabled and has an audio speaker.


    “Since we are developing products using Raspberry Pi, we need a cluster of many
    Pis for software development and tests,” Koichi explains to us. “It’s also useful
    to set up many other devices… We plan to create a cluster to enable setup of hundreds
    of our devices a day.”'
