  md: '![](img/d8322379620245fcd21eccc3855b8c78_98_0.png)


    # EASIER PAINTING


    Set colours to specific letters using lists (e.g., red could be r=[255,0,0]).
    You can go even further and create a matrix of letters that can display an image


    Left You can set sensor outputs as variables to then be printed out on the LED,
    combining all the functions of the HAT


    sudo in the command line with:


    ```

    $ sudo idle3 &

    ```


    Open up a new window to start writing a Python script. Each Sense HAT script needs
    to begin with two lines to import the relevant Python module, and then a line
    to turn it into a variable that makes writing the code easier.


    ```

    from sense_hat import SenseHat


    sense = SenseHat()

    ```


    # >STEP-04

    Text and pictures


    The easiest thing to start off with is to get text scrolling along the LED display.
    The library for the Sense HAT will automatically turn a string of words into a
    scrolling banner across the matrix. A line like the following will create it:


    ```

    sense.show_message("Hello World!")

    ```


    You can control the scroll speed and colours as well. You can also manipulate
    the individual LEDs by telling the script which pixel to change, and give it an
    RGB colour variable with something like:


    ```

    sense.set_pixel(0, 0, [0, 0, 255])

    ```


    Put this in a variable set the top left corner pixel as blue


    # >STEP-05

    Environmental sensors


    Using two of Sense HAT’s sensors, you can measure temperature (in degrees C),
    pressure (in millibars) and relative humidity (as a percentage). You can get the
    three individual measurements with:


    ```

    sense.get_temperature()

    sense.get_pressure()

    sense.get_humidity()

    ```


    You’ll have to attach them to a variable thought (e.g., t = sense.get_temperature())
    so that you can print out the reading or display it on the LED matrix.


    # >STEP-06

    Motion sensing


    The gyroscope, accelerometer and magnetometer can be used to detect motion in
    real time. This is a little trickier to use than the other parts, as it involves
    understanding how the three-dimensional values represent the orientation of the
    Raspberry Pi, and then how the accelerometer can be used to figure out the movement
    within space. Both the gyroscope and accelerometer functions (get_orientation().values()
    and get.accelerometer_raw().values() respectively) will return three values from
    which you can use however you please.


    This handy guide will explain all you need to know on the motion sensors: http://bit.ly/1UBdEmA


    # SLOW DOWN THE TEXT


    You can edit your scrolling text speed by adding the scroll_speed option. Use
    something like: sense.show_message("Hello World!", scroll_speed=0.5)


    Below The most basic script you can write, but it’s very useful to get to grips
    with the basic coding of the Sense HAT


