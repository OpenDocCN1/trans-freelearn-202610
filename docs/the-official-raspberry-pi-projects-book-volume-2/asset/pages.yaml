- pgno: 146
  md: "# USE YOUR RASPBERRY PI FROM ANOTHER COMPUTER\n\n# SHARE FILES ON YOUR NETWORK\
    \ WITH SAMBA\n\nThanks to a piece of software called RealVNC, you don’t even need\
    \ to plug your Pi Zero into a monitor to use its desktop; you can simply control\
    \ it from another computer. First of all, go to magpi.cc/PiVNC and download RealVNC\
    \ onto your Raspberry Pi. Also obtain a free licence key (magpi.cc/1O8Hz4J), as\
    \ you’ll be needing it.\n\n![](img/d8322379620245fcd21eccc3855b8c78_146_0.png)\n\
    \nAbove On some versions of Raspbian, Avahi may already be installed\n\nOnce the\
    \ file is on your Pi, open the terminal, use cd to navigate to the file in Downloads\
    \ (cd Downloads should do) and use the following two commands, replacing the square\
    \ brackets with the appropriate names:\n\n```\ntar xvf [VNC file name].tar.gz\n\
    sudo dpkg -i [VNC Server package name].deb [VNC Viewer package name].deb\n```\n\
    \nCopy the licence key you got and then run sudo vnclicense\n\n-add [Licence Key]\
    \ with your key. Type vncserver into the terminal or command line for it to begin,\
    \ type in your Raspberry Pi’s password (it’s raspberry by default) and make a\
    \ note of the display number. In our case it was 1, and as Avahi was installed,\
    \ we can connect using raspberrypi:1.\n\nInstall a VNC viewer from here: magpi.cc/1M4uzfG\
    \ on your platform of choice, and then connect with: raspberrypi:[Number]\n\n\
    # ACCESS YOUR PI REMOTELY FROM THE COMMAND LINE\n\nVia the SSH protocol, you can\
    \ access the Raspberry Pi from any other computer on your home network. SSH should\
    \ be activated by default, but to make sure it is on, you can go to Raspberry\
    \ Pi Configuration from the Preferences category in the Menu (or by typing sudo\
    \ raspi-config from the command line) and ensure SSH is turned on in the Interfaces\
    \ tab (or under the Advanced menu in the command-line version). If SSH was disabled,\
    \ enable it and reboot. In OS X and Linux, you can use SSH from the terminal;\
    \ in Windows, however, you’ll need to download PuTTY (magpi.cc/1Mm5Npi).\n\nFrom\
    \ an OS X or Linux terminal, you can access the Pi remotely with:\n\n```\n$ ssh\
    \ pi@raspberrypi\n```\n\nYou will need to set up a network name (see box on previous\
    \ page). Type yes to trust the connection, then enter the password raspberry to\
    \ log in. If using PuTTY, just type pi@ raspberrypi into the address field and\
    \ click Connect. Again, you’ll have to agree to trust the Pi Zero, then use the\
    \ password raspberry. You can now control the Raspberry Pi in as you would normally\
    \ do via the command-line.\n\nThis is especially good if you want to use your\
    \ Raspberry Pi Zero as a file server. For this, or just generally to be able to\
    \ access the files on your Zero from anywhere on the network, you’ll need to use\
    \ Samba. First, you need to install it:\n\n```\nsudo apt-get install samba samba-common-bin\n\
    ```\n\nYou need to configure Samba to work as intended. Still in the terminal\
    \ or command line, type:\n\n```\nsudo nano /etc/samba/smb.conf\n```\n\nFirst of\
    \ all, if you have a Windows workgroup with a specific name on your network, find\
    \ the line starting workgroup = WORKGROUP and change the uppercase WORKGROUP to\
    \ your workgroup’s name. If you have no idea what a workgroup is, you can leave\
    \ this setting alone. Find the line # wins support = no, delete the # character,\
    \ and change the no to yes. Scroll down to the section labelled Share Definitions\
    \ and enter the following chunk of code:\n\n```\n[pihome]\n  comment= Pi Home\n\
    \  path=/home/pi\n  browseable=Yes\n  writeable=Yes\n  only guest=no\n  create\
    \ mask=0777\n  directory mask=0777\n  public=no\n```\n\nPress CTRL+X, then Y and\
    \ ENTER to save the file. To start the sharing, enter the following in the terminal\
    \ and use your Pi’s password (raspberry by default):\n\n```\nsmbpasswd -a pi\n\
    ```\n\n![](img/d8322379620245fcd21eccc3855b8c78_146_1.png)\n\nAbove The configuration\
    \ file looks complicated, but you only need to change a couple of bits!"
  merge: -1
  img_proc: true
- pgno: 147
  md: '# #PIZERO ACCESSORIES


    What you can get for your Raspberry Pi Zero to make using it and creating projects
    that much easier?


    As there’s a bit of a Raspberry Pi economy now, when new gear comes out there’s
    a much faster reaction when making new accessories for it. Even though the Raspberry
    Pi Zero is only a few months old, this means that


    there are already a few accessories you can get your hands on to improve your
    Pi Zero experience. There’s also a bit of kit you’ll need to make some of the
    projects in this issue, and even start making your own incredible builds.


    # ZERO CASES


    Keep your Pi Zero in style with these trendy cases


    # ZEBRA ZERO


    magpi.cc/2dXqMZ9


    A sturdy case made up of two layers of wood along with a thick acrylic centre,
    the Zebra Zero adds a touch of class to your Raspberry Pi Zero. It also has a
    massive heatsink, which may be a little superfluous. You can also get a Zebra
    Zero Plus with a full breadboard attached for easy testing.


    # PIBOW ZERO CASE


    magpi.cc/1KljtQz


    A special Pi Zero version of the classic laser-cut Pibow is already available.
    With its unique, chip-hugging design, it leaves the ports very open for use with
    any custom project and even some of the Pimoroni HATs – although you’ll have to
    insert the SD card before construction.


    # MODMYPI ZERO CASE


    magpi.cc/1KLgEiu


    A matte black, laser-cut, layered case for the Raspberry Pi Zero. This keeps access
    open to the four main ports to get the Zero working (HDMI, SD, USB, and power),
    as well as keeping the GPIO pins free. Even the reset and video out pins are accessible
    through it.


    # ADAFRUIT PI PROTECTOR


    magpi.cc/1ZEZbhn


    A much simpler case than the others featured here, the Protector covers the bottom
    and part of the top of the Pi Zero, not quite offering the full protection of
    its rivals. It does, however, have more space open around the GPIO than others,
    allowing for greater access to it in case you have tight space in your project.


    ![](img/d8322379620245fcd21eccc3855b8c78_147_0.png)


    ![](img/d8322379620245fcd21eccc3855b8c78_147_1.png)


    ![](img/d8322379620245fcd21eccc3855b8c78_147_2.png)


    ![](img/d8322379620245fcd21eccc3855b8c78_147_3.png)


    # zero cases'
