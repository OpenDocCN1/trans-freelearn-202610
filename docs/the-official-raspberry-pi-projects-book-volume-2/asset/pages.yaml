    in their respective fields, with the outputs instantly modified to be readable
    with the Sense HAT library.


    # Put on your coding hat


    To use the Sense HAT, you can’t just open up a graphical interface for it... at
    least just yet. It would actually be quite simple to create a general interface
    or a custom one for your needs, because frankly the coding side of the Sense HAT
    is very straightforward, making use of Python’s basic syntax and some simple command
    structures of its own. So you can easily get data from the Sense HAT with


