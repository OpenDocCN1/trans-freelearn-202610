  md: '# SCARY DOOR


    # (AND SCARY PORCH)


    Don’t get too close to this door if you value your sanity


    ![](img/d8322379620245fcd21eccc3855b8c78_79_0.png)


    Above left

    Significantly less scary with the lights on, nevertheless you can see the motion
    sensors mounted on crates that make it work


    Above right

    Who’s at the door?


    CABE ATWELL

    Electrical engineer, writer, crafter of cursed objects

    bit.ly/1p6VqPw


    You are entering the vicinity of an area adjacent to a location. The kind of place
    where there might be a monster, or some kind of weird mirror. These are just examples;
    it could also be something much better. Prepare to enter… The Scary Door.


    Or not in this case, as this is not a real door. Or a Twilight Zone parody. While
    the Haunted House we started off this feature with shows the entrance to a spooky
    residence, this kind of project is what you might find inside as you wander around.


    wander around. It’s a peculiar metal door, with a window you can see through.
    A knocking sound is coming from behind it; perhaps someone is lost? As you get
    closer, you see through the window a normal-looking lounge. You can’t see anyone,
    but the knocking is still there and as you reach for the handle, a monstrous face
    appears.


    Cabe’s idea was to create a modern haunted house effect on the cheap that was
    different every time you saw it. As well as the pop-up scares, there’s ghosts
    and monsters flying around in the ‘window’ (actually an LCD screen), and the scares
    and sounds you can create are as many as you can imagine. The knocking sound comes
    from pistons smashing against the door.


    As well as the door, Cabe has previously created a Scary Porch, which he describes
    as “[an] exploration of my idea of consuming someone with light and sound, to
    the point where they wanted to run away.” Unlike our Haunted House project from
    earlier, which was doorbell-activated, the porch could sense how far away you
    were from the door.


    As you started to approach, it would start playing creepy sounds and slowly turn
    on some bright red lights. As you got closer to the door, the louder the sounds
    became and the brighter the lights got, until screams and roars began playing
    when you were in knocking range.


    “The Scary Porch was only set up in my shop,” Cabe explains to us. “But, people
    did see it and did what I thought… they wanted to get away from the sound.”


    Both are quite elaborate projects and if you plan to make anything similar yourself,
    Cabe advises you exercise extreme caution unless you want to make yourself the
    centre of your Halloween display. This year he’s toning it down a bit: “I plan
    to… make a wooded path, or [the] front yard a bit more scary.”


    At Cabe’s house, we’re sure it’ll be more than just a bit scary.


    # COMPONENTS LIST


    CONJURE UP YOUR OWN VERSION

    > Too many to list here! Check out the link in the profile to find out what nearly
    $800 or more can get you in terms of spooky'
