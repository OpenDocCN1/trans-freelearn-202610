    +   - Krzysztof plans to make a smart wall with RSS feeds and stats

    +   - He plans to work with Arch next

    +   - The project uses a B+ and not a Pi 2 or 3


    Infrared (IR) cameras are traditionally used in low-light situations. Typically,
    IR is used in security cameras at night, and you can also implant an IR camera
    into your birdhouse for a live view of some hatchlings. Using it in daytime for
    ‘normal’ photos, though, is something quite unusual. However, it’s what Krzysztof
    Jankowski decided he wanted to do using a Raspberry Pi and the Pi NoIR Camera
    Module.


    “I’ve been a photographer for many years and I’ve always wanted to take surreal
    (at least to our eye) infrared photos,” Krzysztof tells us, “but there was no
    commercial camera that can do that easily. Also, those cameras for astronomers
    were always pricey. Using filters was too time-consuming and requires using high
    ISO.


    “When I was ready to buy the [Pi] Camera Module, I chose the NoIR to test how
    it works. After the few first tests, it turned out it works perfectly fine, but
    using it with wires, monitor, keyboard, and making photos by command line was
    absolutely not fun. A camera needs to be small and have a physical button to make
    photos.”


    Krzysztof made a prototype “using a lot of duct tape” and went for a walk with
    it. It worked as he’d hoped, so he began work on a more robust and easier-to-use
    version.


    “For me it was very easy as I know Linux, programming, and soldering,” he explains.
    “I think that even for newbies it will still be easy. The whole thing is fairly
    basic to make yourself: connect camera, solder button and LED on, put wires to
    proper GPIO ports, and download my script and install a few required packages.”


    His custom script is what makes it possible, and is downloadable from GitHub (magpi.cc/1K2PRgi).
    It’s only 23 lines long, but it has some tweaks to the way photos are taken to
    get them to look the way they do, and to optimise the speed as well, according
    to Krzysztof:


    “There’s a small lag like in early digital cameras. For landscape photography
    it’s absolutely acceptable, though. The only


