    # WHAT IS AN EEPROM?


    EEPROM stands for ''Electrically Erasable Programmable Read-Only Memory'' and
    is a chip used in electronic devices to store small amounts of data.


    Left Build your circuit on a breadboard or Explorer HAT first to make sure it
    works, allowing you to make changes


    answers to both questions. Alternatively, if you’re using Jessie, you can set
    this up using the Raspberry Pi configuration tool available through the GUI.


    You will then be prompted to reboot. Once your Pi has restarted, install the I²C
    tools package with:


    ```

    sudo apt-get install i2c-tools

    ```


    Now it’s time to construct your EEPROM circuit on a breadboard. Put together the
    circuit as shown in Fig 1. If you’re not using a 24C32, you may need to connect
    to different pins for SDA and SCL. Check the data-sheet for your IC to make sure
    you get this correct. You also need to give the HAT some functionality: in the
    interests of keeping things simple, the circuit of Fig 1 just contains a tri-colour
    RGB LED, but you can use whatever components you wish, depending on what you want
    your HAT to do.


    Power up the Pi. You may notice that the LED is already on (perhaps just faintly).
    This is because the Pi doesn’t know what is connected and so the GPIO output is
    ‘floating’. This is something our HAT will deal with by preconfiguring the pins
    that it uses. The code snippet overleaf (myoh-rgb.py) provides some simple Python
    for interacting with the LED; you’ll need to install the wonderful gpiozero library
    to use it.


    Next, check to see what I²C devices have been detected on the second I²C bus:


    ```

    i2cdetect -y 1

    ```


    Fig 1 The EEPROM should be connected to SDA and SCL for programming. If you’re
