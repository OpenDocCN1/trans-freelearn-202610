- pgno: 104
  md: '# TWEET WITH THE WOLFRAM LANGUAGE


    # Tutorial


    ![](img/d8322379620245fcd21eccc3855b8c78_104_0.png)


    MORE IN WOLFRAM

    Find more projects from the Wolfram team over on the Wolfram site: magpi.cc/1SCpu2o


    Left You can tweet whatever message you want and it will appear instantly – limited
    to 140 characters, of course!


    # >STEP-02


    # Setting up your code


    To set up your code, open Mathematica on your Pi and type the SendMessage function,
    then the text you want your tweet to say. So, from the Documentation Center, we
    know it should be set up like this:


    ```

    SendMessage["Twitter", "Tweet text"]

    ```


    Where it says “Tweet text”, the text can be changed to anything you want posted
    to your Twitter account.


    # >STEP-03


    # Evaluate your code


    Once you’ve typed that in, press SHIFT+ENTER. This will run your code in Mathematica
    and prompt an authorisation dialogue to allow the Wolfram Language to send tweets
    on your behalf. Once authorised, a tweet is sent to your account. Select ‘Done’
    after entering the access key, and the tweet will appear in your Twitter stream.


    # >STEP-04


    # Create a variable


    The previous example showed a static string being tweeted. However, this is far
    from all the Wolfram Language is capable of. Much like other programming languages,
    it allows users to set variables, in which we can store whatever we like. To create
    a variable, just type the name you want to give it, an equals sign, then whatever
    you want to assign to the variable, like so:


    ```

    myVariable = "Some string here!"

    ```


    Unlike several other programming languages, you don’t need to specify what kind
    of data is being stored in your variables – the Wolfram Language is smart enough
    to figure out what it is and how to use it on its own!


    # >STEP-05


    # Using StringJoin


    You can combine strings using the StringJoin function. Just like SendMessage,
    StringJoin is used by putting the strings you want to join in between square brackets
    ([ and ]), separated by commas. So, to join “Hello ” and “world”, you’d enter:


    ```

    StringJoin["Hello ", "world"]

    ```


    This isn’t limited to static strings – variables can be joined to strings too,
    like so:


    ```

    StringJoin["Hello ", myVariable]

    ```


    # >STEP-06


    # Combining it all


    Now it’s time to put it all together. We can take a variable, store a string to
    it, join it to another string, then send it to Twitter:


    ```

    myName = "WolframLanguage"

    SendMessage["Twitter", StringJoin["This tweet brought to you by ", myName]]

    ```


    Now that you know how functions work in the Wolfram Language, it’s easy to dive
    into the documentation and explore the thousands of functions built in. Now go
    forth and code!'
  merge: -1
  img_proc: true
