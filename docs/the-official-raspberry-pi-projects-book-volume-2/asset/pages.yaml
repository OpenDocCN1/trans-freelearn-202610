  md: '# GETTING STARTED

    WITH RASPBERRY PI


    Creating amazing projects is easy with a Raspberry Pi, but first you need to plug
    it in and set up Raspbian, the default operating system. This guide will get you
    up and running in no time


    The Raspberry Pi is a wonderful microcomputer that brims with potential. With
    a Raspberry Pi you can build robots, learn to code, and create all kinds of weird
    and wonderful projects. Hackers and enthusiasts have turned Raspberry Pi boards
    into fully automated weather stations, internet-connected beehives, motorised
    skateboards, and much more. The only limit is your imagination. But first, you
    need to start at the beginning. Upon picking up your Raspberry Pi for the first
    time, you’re faced with a small green board of chips and sockets and may have
    no idea what to do with


    it. Before you can start building the project of your dreams, you’ll need to get
    the basics sorted: keyboard, mouse, display, and operating system. Creating projects
    with a Raspberry Pi is fun once you’ve mastered the basics. So in this guide,
    we’re going to take you from newbie zero to Raspberry Pi hero. Grab your Raspberry
    Pi and let’s get going.'
