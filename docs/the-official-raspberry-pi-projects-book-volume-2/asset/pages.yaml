  md: '# OPERATING ZOE


    ![](img/d8322379620245fcd21eccc3855b8c78_90_0.png)


    # >STEP-01


    # Starting flight


    A preprogrammed flight plan begins for Zoe, with targets for what it should do.
    This includes ascending at a specific speed for a specific amount of time, hovering,
    etc.


    ![](img/d8322379620245fcd21eccc3855b8c78_90_1.png)


    # >STEP-02


    # In-flight checks


    The sensors on the drone provide input as to what it''s doing, as a way to make
    sure everything is operating as it should during the plan.


    ![](img/d8322379620245fcd21eccc3855b8c78_90_2.png)


    # >STEP-03


    # Flight corrections


    A lot of maths ''glues'' the flight plan and data input together to make sure
    everything is on track, correcting any mismatch in the props./motors.


    ![](img/d8322379620245fcd21eccc3855b8c78_90_3.png)


    The turtle was Andy''s first Raspberry Pi project back in 2012


    ![](img/d8322379620245fcd21eccc3855b8c78_90_4.png)


    The Pi Zero looks a bit dwarfed by Zoe, but powers it just fine


    the quad from hitting a physical brick wall.”


    The Raspberry Pi Zero helped Andy bring Zoe back and make it operational again
    after a few tweaks. The years-long creation wasn’t always so quick or simple,
    though.


    “Other than having a custom HAT PCB, the physical build is very simple due to
    the off-the-shelf combination of frame, motors, and props,” says Andy. “But the
    software interfacing to hardware was a major challenge and the testing is expensive;
    the innate instability of a quadcopter means any imperfections ultimately end
    with a crash and corresponding hardware damage. Despite it ‘only’ costing about
    £200 to build the Pi Zero quadcopter from scratch,


    it’s cost me more than ten times that over the last few years to reach this stage.”


    Interestingly enough, Andy doesn’t plan to really use the drone as such, instead
    treating it as a challenge to just make it work.


    “If it ever reaches that stage, I’ll almost certainly shelve the project as complete
    and start on something new – perhaps a fusion reactor, or infinite improbability
    drive. But at the moment, there’s plenty of interesting stuff I can add to the
    very basic quad I have now to keep me interested for a long time yet.”


    While it may have taken Andy years, there’s now a lot more info and kits available
    to take a few shortcuts with. Hopefully, in the future, we can show you how to
    create your own quadcopter.'
