    Not sure what to make with your Raspberry Pi for Halloween? Over the month of
    October, all the tech news sites will be inundated with Halloween-based stories,
    so keep an eye on them. Otherwise, you can head over to the Raspberry Pi tag of
    the Adafruit Learning System (bit.ly/1iroRHO), where you can get many great ideas
    for projects, along with the element14 community blogs and the Raspberry Pi Foundation’s
    blog. Be inspired to be spooky!


