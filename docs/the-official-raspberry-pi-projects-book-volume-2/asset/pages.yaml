    >STEP-01

    Stepper motors

    Stepper motors – dividing each 2mm revolution of the trapezoidal bars into 200
    steps – position a DeWalt router in the X, Y, and Z planes, with an accuracy of
    10 micrometres.


    ![](img/d8322379620245fcd21eccc3855b8c78_49_2.png)


    >STEP-02

    In the frame

    Hand-cut from 18mm (¾”) marine ply, the frame rigidly holds the trapezoidal bars,
    stepper motors, and router, as well as keeping the work in place with clamps in
    the built-in tracks.


    ![](img/d8322379620245fcd21eccc3855b8c78_49_3.png)


    >STEP-03

    Arduino

    An Arduino Uno runs Grbl software to accept cutting instructions in G-code and
    turn them into electrical pulses to control the stepper motors and position the
    router precisely in three planes.'
