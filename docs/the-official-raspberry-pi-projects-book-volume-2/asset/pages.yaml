    We all know at least one person who just has a Raspberry Pi for a media centre,
    running their TV on Kodi or even an ancient version of XBMC that does the job.
    One of the things that has been lacking from this equation for the longest time
    is a suitable case for a Pi hooked up to your television – a case that can slip
    in unnoticed under your TV, next to a Sky+ box and that Wii you haven’t touched
    in years.


    While the Media Pi Plus isn’t the first one, or even the first Media Pi product,
    they’re rare enough to highlight and discuss. In the Media Pi Plus’s case, it’s
    a re-release to fit the form factor of the Raspberry Pi B+ and the Pi 2. In aesthetic
    terms, it absolutely looks like something you’d put under your TV, specifically
    something like a Freeview box: it’s unassuming, black, and with very little branding.


    There is some construction required with the case, as a Raspberry Pi is not included.
    Popping the case open, you can see exactly how it works: it extends out and relocates
    a number of the Raspberry Pi’s ports throughout a largely empty box. While this
    may seem slightly redundant, it does provide extra power to the USB ports, allowing
    for hubs to be connected. You can also connect an IR receiver directly to the
    GPIO ports, which works well with the media remote included, even if you have
