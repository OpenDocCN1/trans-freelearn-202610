  md: '# HALLOWEENPI AT 3


    A yearly tradition that will rattle your bones and help out the local food bank


    # CHRIS, PATRICK AND ELISHE


    Solution architect, systems specialist, and artist respectively, purveyors of
    haunted numbers

    on.fb.me/10uScjv


    Scaring people as they come to the door is big business in spooks, it seems. We’ve
    seen porches, doors, and monster parties that give at least some warning or try
    to build a scary atmosphere, but the HalloweenPi is taking the jump-scares approach
    over building suspense.


    To understand HalloweenPi, we need to learn about the history of Halloween at
    3. A yearly tradition from the people at 3 Michelle Court, a display of their
    scariest Halloween-themed ideas is created to wow (and maybe frighten) trick-or-treaters
    or passers-by. Constantly trying to figure out a way to make each year better
    by adding to the


    ![](img/d8322379620245fcd21eccc3855b8c78_81_0.png)


    Below top The team are still hard at work on this year’s project so they can be
    ready for the big day


    Bottom What exactly happens at 3 Michelle Court?


    ![](img/d8322379620245fcd21eccc3855b8c78_81_1.png)


    ![](img/d8322379620245fcd21eccc3855b8c78_81_2.png)


    display, Chris Kyte had a bit of a brainstorm:

    “We were considering how to draw in a few more trick-or-treaters to our haunt.
    We had decided to start collecting canned food donations for our local food bank
    when I remembered the Raspberry Pi B+ I had received as a birthday present earlier
    in the year. I started to wonder if I could build a pneumatic prop or two in order
    to ‘up our game’.”


    Currently, the massive tunnel houses a laboratory of rainbow-coloured mixtures
    in beakers and test tubes that react to black light, a projected puppet that compliments
    kids on their costumes, and all the other trappings of a Halloween-themed display.
    This new addition will have a motion-controller prop attached to it that will
    spring up and scare people as they arrive for Halloween at 3.


    “The HalloweenPi Controlled Pneumatic Prop will be a really spooky piece,” says
    Chris. “It will act as an ambassador to the haunt, reacting to the people who
    walk by: the prop will spread its wings wide and will scream a mighty scream!
    The way we’ve designed the props and pneumatics means that they are modular. They
    don’t have to remain the same each year!”


    The frights are for a good cause, though, as Halloween at 3 takes donations for
    the local food bank. “The extra excitement generated by the pneumatic props should
    make a big difference to the number of people that show up. Hopefully, we’ll see
    an increase in food donations as well.”


    We question how such an endeavour can be truly evil in the Halloween spirit with
    such a wonderful result, but we’ll let it slide this time.


