  md: '# ZERO UNBOXED


    Let’s take a closer look at this miniature Raspberry Pi


    ![](img/d8322379620245fcd21eccc3855b8c78_143_0.png)


    # SD CARD SLOT


    # MINI-HDMI


    # MICRO-USB


    # POWER SUPPLY


    You’ll need a microSD card so you can actually give the Raspberry Pi Zero an operating
    system. Some come with SD adaptors so you can plug it into your PC.


    A mini-HDMI to HDMI cable is required to hook up a monitor to the Raspberry Pi
    Zero – a normal HDMI cable will not fit.


    This micro-USB port is for data; to actually use it to plug in a mouse, keyboard,
    or a wireless dongle, you’ll need a micro-USB to USB adaptor.


    This is the power jack – don’t get it mixed up with the data port! You’ll need
    a mobile phone charger, or one of the official Raspberry Pi power supplies, to
    turn the Zero on.


