  md: "![](img/d8322379620245fcd21eccc3855b8c78_112_0.png)\n\nAbove The final score:\
    \ seven missed opportunities to zap the rats\n\n# >STEP-02\nPlanning the display\n\
    \nThe circuit will be all the outside edge LEDs, with the rats starting their\
    \ run from the bottom-left corner: (0,0). The zap cell will be at (4,2), with\
    \ a permanently lit LED at (3,2) to mark it. Hits can be indicated by a column\
    \ of lit LEDs rising from (1,1) to (1,3). Button ‘B’ will be used to zap the rat.\
    \ The final score can be displayed with either a character ‘O’ to indicate no\
    \ missed zap opportunities – quite difficult to achieve – or lit LEDs (0 –25)\
    \ for each miss. For a ‘hit’ to register, the button must be pressed while the\
    \ zap position LED is lit; holding the button down won’t work.\n\n# >STEP-03\n\
    Setting up the CodeBug\n\nTo run the CodeBug in tethered mode, you'll need to\
    \ download and install a program called codebug_tether.cbg. Once installed in\
    \ the normal way, the CodeBug temporarily becomes a slave device to your Raspberry\
    \ Pi and obeys instructions sent from Python 3. (This is rather like using Nanpy\
    \ to control an Arduino from a Pi.)\n\nTwo additional Python libraries, python3-serial\
    \ and python3-codebug-tether, need to be installed on the Pi. Point your browser\
    \ to magpi.cc/1MeIWdR and follow the excellent instructions from Thomas Macpherson-Pope.\n\
    \nOpen IDLE 3 and type in the Zap_the_rat.py Python script. Save it and run it.\n\
    \n# >STEP-04\nThings to do\n\nThere are several modifications and additions you\
    \ could make to the script:\n\n+   - Randomise the rat’s starting position\n+\
    \   - Randomise the direction in which the rat runs around the circuit\n+   -\
    \ Improve the zero final score to a square, expanding and contracting from position\
    \ (2,2) to the edge and back again five times as a celebration.\n\n# Zap_the_rat.py\n\
    \nLanguage >PYTHON\n\n```\n```python\n# Zap the Rat - Python3 Game for Tethered\
    \ CodeBug\n# Tony Goodhew - 5 Oct 2015\nimport codebug_tether\nimport time\ncb\
    \ = codebug_tether.CodeBug()\ncb.clear()\n\n# Circuit LED co-ordinates - round\
    \ the edge from bottom-left\nLEDx = (0,0,0,0,0,1,2,3,4,4,4,4,4,3,2,1)\nLEDy =\
    \ (0,1,2,3,4,4,4,4,4,3,2,1,0,0,0,0)\nfor i in range(0,-66,-1):  # Display game\
    \ title\n    cb.write_text(i,0,'Zap the Rat', direction=\"right\")\n    time.sleep(0.1)\n\
    \nscore = 0            # Rats zapped!\nopps = 0             # Zap opportunities\n\
    p = 0                # Position of rat on circuit (0-15)\ndelay = 0.05       \
    \  # Initial delay between rat moves\nold_sw = 0           # Last value of switch\
    \ B\nrunning = True       # Loop control variable\ncb.clear()\ncb.set_pixel(3,2,1)\
    \  # Show Zap position\n\nwhile running:\n    cb.set_pixel(LEDx[p],LEDy[p],1)\
    \  # Show rat\n    if p == 10: opps = opps +1       # Incr opps - in (4,2)\n \
    \   time.sleep(delay - score * 0.007) # Wait - gets faster\n    sw = cb.get_input('B')\
    \           # Read switch B\n    pixel = cb.get_pixel(4,2)        # Rat in Zap\
    \ position?\n    cb.set_pixel(LEDx[p],LEDy[p],0)  # Hide rat\n    if old_sw ==\
    \ 0 and sw == 1 and pixel == 1: # Hit?\n        score = score +1             #\
    \ Increment hits\n        cb.set_pixel(1,score,1)      # Show hits\n        if\
    \ score == 3:               # Game over?\n            running = False        \
    \  # Stop looping\n    p = -1                           # Position of next rat\n\
    \    old_sw = sw                      # Store switch value\n    p = p + 1    \
    \                    # Update rat position\n    if p > 15:                   \
    \    # Rat pointer out of range?\n        p = 0                        # Reset\
    \ to start position\n\ncb.clear()  # Game over - display opportunities\nopps =\
    \ opps - 3  # Remove successful opportunities\nprint(\"Missed Opportunities were\
    \ \",opps)\nif opps > 25:  # Reduce missed opps to 25 max\n    opps = 25\nif opps\
    \ == 0:\n    cb.write_text(0,0,'O') # Zero missed opps\nelse:\n    for x in range(0,5):\
    \  # Display missed opps\n        for y in range(0,5):\n            if opps >\
    \ 0:\n                cb.set_pixel(x,y,1)\n            else:\n               \
    \ cb.set_pixel(x,y,0)\n            opps = opps - 1\ntime.sleep(5)\ncb.clear()\
    \  # Tidy display\n```\n```"
