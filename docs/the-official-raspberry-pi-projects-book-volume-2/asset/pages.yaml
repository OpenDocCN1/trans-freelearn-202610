    in control flow and data structures – procedural with a hint of functional flavour.


    Object orientation is then introduced as a concept in a chapter also covering
    threads and locks. The peculiar areas of focus continue with a look at packaging
    in Python, but then the book turns to GPIO and the Camera Module. Data parsing
    and interfaces round out a useful introductory book, which will give confident
    learners enough immersion in Python to move onto their own projects.


    > “this has the widest library support and is still the default


