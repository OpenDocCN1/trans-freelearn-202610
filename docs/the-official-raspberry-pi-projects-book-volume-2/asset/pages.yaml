    \ and see the results. Buzzer and Button are the other functions that you can\
    \ import for the Traffic HAT.\n\n# >STEP-04\nDedicated GPIO Zero\n\nA slightly\
    \ easier way of programming the Traffic HAT with GPIO Zero is by using the actual\
    \ Traffic HAT function built into Zero. You can make use of it by changing the\
    \ first import line to:\n\n```\nfrom gpiozero import TrafficHat\n```\n\nThis makes\
    \ use of buzzer, button, and lights functions to manage those respective parts\
    \ of the HAT. The lights are then described as green, amber, and red in the code,\
    \ for when you want to activate them. We’ll now create a little script to perform\
    \ a traffic light sequence in Python.\n\n# >STEP-05\nSetting up\n\nLooking at\
    \ the code on this page, we have a simple setup by importing TrafficHAT and time.\
    \ We’ll need the latter to simulate the kind of delay you normally get on real\
    \ traffic lights. Set the Traffic HAT code to be known as the variable th and\
    \ we’re ready to begin our loop.\n\nCreate a simple while loop that will continuously\
    \ run. Start it by having the green light show, and use another while loop to\
    \ stop the code until the button is pressed. It will stay green forever unless\
    \ you press the button or interrupt the program.\n\n# TrafficLights.py\n\nLanguage\n\
    >PYTHON\n\n```\nfrom gpiozero import TrafficHat\nfrom time import sleep\n\nth\
    \ = TrafficHat()\n\ntry:\n    while True:\n        # Traffic light code\n    \
    \    # First, turn the green LED on\n        th.lights.green.on()\n        print\
    \ \"Press the button to stop the lights!\"\n        # Next, we want to wait until\
    \ the button is pressed\n        while(th.button.is_pressed == False):\n     \
    \       #While not pressed do nothing\n            pass\n        # Button has\
    \ been pressed!\n        th.lights.green.off()\n        # Amber on for a couple\
    \ of seconds\n        th.lights.amber.on()\n        sleep(2)\n        th.lights.amber.off()\n\
    \        # Turn the red on\n        th.lights.red.on()\n        # Buzz the buzzer\
    \ 20 times with 0.1 second intervals\n        th.buzzer.blink(0.1,0.1,20,False)\n\
    \        sleep(1)\n        th.lights.red.off()\n        # Red off and blink amber\
    \ 4 times with 0.5 second intervals\n        th.lights.amber.blink(0.5,0.5,4,False)\n\
    except KeyboardInterrupt:\n    exit()\n```\n\n> A GPIO add-on that makes learning\
    \ how to program for physical computing a little easier\n\n# >STEP-06\nLight timing\n\
    \nThe bit of code after the button is pressed may seem a little complicated at\
    \ first glance, but under closer inspection it should be fairly straightforward.\
    \ It emulates the way traffic lights work at a pelican crossing, activating the\
    \ amber light for a few seconds before giving a steady red light.\n\nWhen the\
    \ red light appears, the buzzer will beep for a few seconds before the red light\
    \ is turned off and the amber appears, this time flashing itself, before reverting\
    \ back to green. At this point, the while loop starts again, waiting for a button\
