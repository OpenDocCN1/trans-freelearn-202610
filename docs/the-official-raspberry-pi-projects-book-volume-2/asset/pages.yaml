  md: '# RASPBERRY PI

    ZERO


    A new revolution in computing is upon us


    We’d like you to pick up the Raspberry Pi Zero that came with The MagPi 40. You’re
    holding in your hands a fully functional computer that’s going on sale for $5
    and that you could lose in a small purse. It’s quite the amazing feat of engineering
    and we’re very excited to bring it to our readers, along with many pages of content
    that will take you from a Zero Novice to a Zero Master.


    Over the course of our expansive coverage, we talk to the people behind the Raspberry
    Pi Zero’s development, teach you how to hook it up, and also suggest some great
    uses for your Zero. With its even smaller size, there are some amazing things
    you’ll be able to do with it. Check out the contents at the start of this section
