- pgno: 121
  md: '# MAKE YOUR OWN PI HAT


    There are some amazing HATs available to enhance the hardware capability of your
    Pi. Ever wondered how to design and build a prototype HAT? This tutorial will
    show you how to get started


    # You''ll Need


    +   - An EEPROM (a CAT24C32 is recommended)

    +     magpi.cc/1RwAaQP

    +   - A breadboard and some jumper leads

    +     magpi.cc/1RwAdMt

    +   - Some LEDs

    +     magpi.cc/1RwAiQi

    +   - The Pi HAT specification repository

