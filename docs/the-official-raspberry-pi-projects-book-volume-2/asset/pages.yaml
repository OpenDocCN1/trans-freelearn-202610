    # >STEP-01

    Box construction


    The FabScan box is laser-cut from wooden parts. A stepper motor, controlled by
    Arduino, is used to control the wooden turntable. The laser is mounted in the
    corner and emits a line diagonally across the turntable.


    # >STEP-02

    The Raspberry Pi


    The Raspberry Pi runs the scanning software, and a Raspberry Pi Camera Module
    is used instead of a webcam. Using a Pi enables the FabScan to become a self-contained
    3D scanner.


    # >STEP-03

    Scanning the duck


    An object (in this case a rubber duck) is placed on the turntable. The web software
    is used to connect to the Pi-powered FabScan. As the duck rotates, the camera
    monitors the laser and uses it to create the scan.


