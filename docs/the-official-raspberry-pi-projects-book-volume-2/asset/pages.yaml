    ![](img/d8322379620245fcd21eccc3855b8c78_68_1.png)


    When it came to the actual Kilimanjaro climb, everything worked, although Kurt
    admits he could have used more error checking and recovery. “The system worked
    in real-time and the waypoint LEDs stay lit after I had reached that location.
    However, if the power went out then only future waypoints would light up, as I
    didn’t store the previously reached waypoints in the Pi, nor did I report the
    history in my web APIs. So, sometime between camp three and four, this happened
    to the setup I had in my office window, but the one at home worked for the whole
    climb.”


    # Always another mountain


    Kurt admits that a few shortcuts and compromises had to be made in the last-minute
    rush to get the project completed in time for the Kilimanjaro trip. Given more
    time, Kurt says he would have liked to use the Pi’s HDMI output to provide an
    animated map view and real-time data and graph displays. He plans to make improvements
    to the system for future expeditions. “I would very much like to figure out a
    way to show more discrete climbing progress on the model, rather than a single
    LED per day. I’ve thought about a number of ways that I’ve found to be impractical:
    light pipe projector from an LCD panel, laser, tight string of tiny LEDs… I’m
    looking for an idea!”


    As for the experience of climbing Kilimanjaro, Kurt tells us it was awesome. “The
    climb itself takes seven days and you hike through four climatic zones before
    reaching the summit: rainforest, heather and moorland, alpine desert, and finally
    arctic above 5,000m - the summit is 5,895m. It’s really quite amazing and the
    local staff make the experience so enjoyable. Every afternoon, when we reached
    camp, the staff would sing and dance with us… The view from the summit is spectacular
    as you arrive at sunrise, well above the clouds, and can see for miles and miles.”


