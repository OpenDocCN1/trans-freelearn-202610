  md: "![](img/d8322379620245fcd21eccc3855b8c78_102_0.png)\n\nAbove You can also install\
    \ the GPIO Zero software under Python 3; in fact, it's recommended by the creator.\
    \ However, you'll need to change the print lines in our code\n\nand start it with\
