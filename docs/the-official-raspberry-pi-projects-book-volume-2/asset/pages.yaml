    # Maker Says


    > A super affordable high-quality DAC for the Raspberry Pi

    > Pimoroni


    # PIMORONI PHAT DAC


    If you’re disappointed by the Pi Zero’s lack of analogue audio output, the pHAT
    DAC may be just the add-on you need


    # Related


    # HIFIBERRY DAC+ STANDARD RCA


    The HiFiBerry uses top-quality components and has RCA jacks pre-soldered, but
    its size makes it less suitable for Pi Zero use.


    ![](img/d8322379620245fcd21eccc3855b8c78_176_1.png)


    £23 / $40

    hifiberry.com


    The Pi Zero’s minuscule dimensions make it well-suited to a variety of tasks,
    except for one omission from its feature list: analogue audio. For anyone trying
    to embed a Pi Zero into an old radio or speaker system, that’s a loss too far.
    Fortunately, the clever people at Pimoroni have a solution in the form of the
    pHAT DAC. Part of the pHAT family – a range of Hardware Attached on Top (HAT)
    boards built with the Pi Zero form factor in mind – the pHAT DAC adds a high-quality
    digital-to-analogue converter (DAC) to the board, allowing any Pi Zero to output
    line-level audio, ready for external amplification. The output of the pHAT DAC
    shouldn’t be confused with that of the analogue output of the full-size Raspberry
    Pi family, either: the pHAT’s Texas Instruments PCM5102A DAC is a cut above, offering
    noise-free 192kHz 24-bit line-level audio.


    The pHAT DAC is supplied with a 40-pin female header which needs to be soldered
    onto the board before it can be connected to the Pi Zero, to which you’ll need
    to have soldered a 40-pin male header. There’s method in Pimoroni’s madness here:
    if you’re building a permanent project, you can drop the female header and solder
    the pHAT DAC directly to the Pi Zero’s pins to create an ultra-thin circuit board
    sandwich. You can also add a pair of RCA connectors, available separately for
    £1.50, to complement the 3.5mm jack. With the soldering out of the way, installation
    isn’t as straightforward as it could be. Step-by-step instructions are provided,
    but are unsuitable for the latest Raspbian release – and while a community member
    has stepped up and provided an installation script to make things easier, this
    isn’t yet linked from the product page. There’s another fly in the ointment once
    installation is


    complete: there’s no easy way to switch between the pHAT DAC and HDMI outputs.
    For most uses this isn’t a problem, but if you were planning to turn a Zero into
    a multi-function portable music player, it may cause a headache. When you’re up
    and running, there’s plenty to like about the pHAT, though – in particular, the
    superb audio quality when paired with a good-quality amplifier and decent set
    of speakers.


    # Last word


    While the installation experience needs work, the pHAT DAC certainly fills a hole.
    If you need analogue audio from your Pi Zero, it can’t be beaten – but paying
    three times the cost of the Zero itself may sting a little.'
