    creators early on in the mag, and a review of it later on. It’s an amazing piece
    of kit and hopefully by now you’ve been able to snag yourself one.


    While it’s definitely easy to use, there’s a few things you need to learn first
    to get it going as it’s reliant on programming it via Python scripts at the moment.
    The commands are very simple though, so we can show you in only a couple of pages
    how to start getting the most out of your new toy!


    Learn how to use the features of the Sense HAT, and figure out how to make this
    smiley face


    All you need is a Raspberry Pi to use the Sense HAT - no other gadgets!


    ![](img/d8322379620245fcd21eccc3855b8c78_97_0.png)


    # >STEP-01

    Installing the Sense HAT


    Getting the Sense HAT ready to use is quite simple. Turn off your Raspberry Pi
    and make sure your Raspbian SD card is inserted if it isn’t already. Place the
    Sense HAT on the GPIO pins, carefully aligning them before pressing down firmly
    so that it properly attaches to the Raspberry Pi. Once that’s done, turn the Raspberry
    Pi back on. If it’s attached properly, the LEDs on the SenseHAT will light up
    in a rainbow pattern during boot time. When it gets to the desktop, the pattern
    might turn off but that’s normal.


    # >STEP-02

    Sense HAT library


    The Sense HAT won’t work straight away on every Pi. You may need to download a
    custom script that will install the necessary libraries for Python to access it
    if you’re using a much older version of Raspbian, and update some of the core
    kernel code so that it runs properly. You can download and install the update
    by opening the terminal and running these commands:


    ```

    $ sudo apt-get install sense-hat

    $ sudo pip-3.2 install pillow

    ```


    After both commands have run their course (they might take a few minutes each
    to complete) you’ll need to reboot the Raspberry Pi. You might as well do this
    from the command line with:


    ```

    $ sudo reboot

    ```


    # >STEP-03

