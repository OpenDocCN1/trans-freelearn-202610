    # Essential features


    When setting the VC99 up for measurement, it’s easy to forget that it’s a budget
    multimeter. The probes sit securely in their ports, and the mode dial switches
    with a pleasingly tactile click. Buttons are included just below the display for
    various functions, including the ability to switch between frequency and duty
    cycle measurement – handy for testing Pi projects which use software-driven pulse-width
    modulation – and for enabling recording of maximum and minimum readings. There’s
    also a button to enable relative measurements to be taken: when measuring resistance,
    for example, this can be used to automatically subtract the resistance of the
    test probes themselves from the displayed figure. What you don’t get for the low
    purchase price is any sign of a


    calibration certificate. While the measurements on our test unit proved accurate
    against calibrated hardware, there’s no guarantee the next model off the production
    line will be as well-calibrated. It’s possible to remove the casing from the multimeter
    and calibrate manually by adjusting on-board potentiometers, should you have access
    to calibrated hardware against which to compare measurements, but doing so will
    invalidate any warranty you may have had.


    # A tough read


    The only other bone of contention with the Proster VC99 is the bundled manual.
    Small and confusingly written, it provides most of the information you could need
    to get the best from the device, but not in the most accessible manner. Signs
    of poor translation are also


    present, including on the face of the multimeter where its ability to power off
    automatically after 15 minutes of inactivity is proudly emblazoned as ‘AUTO OFF
    POWER’. These are minor niggles. While not every hobbyist will need anything more
    feature-packed than your average pocket multimeter, those who do will find the
    VC99 more than up to the job. Anyone working in an ill-lit environment, though,
    would do well to spend any money saved on a lamp to make up for the lack of illumination
    on the multimeter’s display.


    # Last word


    While its accuracy is definitely more suited to the hobbyist than the professional,
    the Proster VC99 multimeter offers a wealth of functionality at a pocket-friendly
    price.'
