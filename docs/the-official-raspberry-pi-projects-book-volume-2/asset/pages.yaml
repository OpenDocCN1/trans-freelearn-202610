  md: '# RASPBERRY PI ZERO


    Ultra-low-cost, super-tiny, and incredibly powerful, the Pi Zero is the tiniest
    Raspberry Pi computer


    The Pi Zero is an ultra-low-cost and incredibly small microcomputer packed onto
    a single board. It’s roughly a third the size of the Raspberry Pi 3, and has a
    teenie price tag ($5, or around £4).


    For all that, the Pi Zero is packed with enough power to handle demanding computer
    projects. Despite its diminutive stature, the Pi Zero is no toy. The Pi Zero is
    a fully fledged microcomputer with


    a 1GHz ARM CPU and 512MB RAM. It packs enough technology to run the full version
    of Raspbian, just the same as the Raspberry Pi 3.


    The smaller board is more minimalist than other Raspberry Pi units, which makes
    it more challenging to set up. But it’s a rewarding device that’s ideal for creating
    Internet of Things, wearable, and embedded projects.


    To keep the size down, the Pi Zero features a smaller-than-


    normal mini HDMI socket. You’ll almost certainly need a mini HDMI-to-HDMI adapter
    or cable to connect the Raspberry Pi to a television or monitor.


    Alternatively, hackers can hook up an RCA cable directly to the video headers
    on the board. RCA cables are the red, white, and yellow plugs that you find on
    older televisions. This feature makes the Pi Zero a great choice for retro gaming
    enthusiasts.


    # PI ZERO


    # Powerful processor


    The Pi Zero packs a sizzling 1GHz single-core ARM 11 CPU with 512MB RAM. Despite
    its diminutive size, it’s 40 percent faster than the original Raspberry Pi model.


    # Tiny form factor


    The Pi Zero offers a full computer experience, complete with the Raspbian operating
    system, and is only a third the size of the original Raspberry Pi.


    # GPIO to go


    The full GPIO header sits along the side of the Pi Zero board. These holes enable
    makers to attach hardware to the Pi Zero, and you can experiment with electronics
    projects.


    ![](img/d8322379620245fcd21eccc3855b8c78_7_0.png)


    ![](img/d8322379620245fcd21eccc3855b8c78_7_1.png)


    ![](img/d8322379620245fcd21eccc3855b8c78_7_2.png)'
