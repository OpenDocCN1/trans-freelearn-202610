    # TENMA 60W DIGITAL SOLDERING STATION


    Gareth Halfacree sees if degree-accurate temperature control has a place in the
    hobbyist soldering toolkit...


    # Related


    # WELLER SP25N


    For small soldering jobs, a good quality fixed-temperature iron like this Weller
    SP25N is a cheaper alternative to a bulky soldering station.


    ![](img/d8322379620245fcd21eccc3855b8c78_179_1.png)


    £20 / $14


    amazon.co.uk


    Breadboards are all well and good for prototyping, but there comes a time in every
    electronics hobbyist’s life when it’s time to melt some metal and start soldering
    something together. Whether it’s fixing something that’s broken or building something
    new, soldering is an important skill, and one which can be made easier or harder
    depending on the tools you choose. The Tenma 60W Digital Soldering Station is
    designed to bridge the gap between ultra-cheap fixed-temperature irons which are
    the mainstay of hobbyist solders, and the high-end, finely tuned tools you’d find
    at a professional engineer’s workstation. Selling for sub-£50/$70, the feature
    list is nevertheless impressive: the hefty base unit provides control of the iron
    temperature between a minimum of 150°C and a maximum of 450°C, either by flipping
    between three preset temperature levels or by setting your own, and it boasts
    a stability of ±1°C with 60W of power to back it up.


    To get something out of the way early on in this review: no, you almost certainly
    don’t need a highly accurate, temperature-controlled soldering station. It can,
    however, make life easier. If you’ve ever tried soldering and found that sometimes
    the solder just doesn’t want to flow - in particular when making large connections
    - then you’ve experienced the frustration of using an underpowered iron that couldn’t
    supply the heat fast enough. If you’ve watched an LED or other heat-sensitive
    component go up in smoke during soldering, then you’ve experienced the flip side:
    an iron which delivered too much heat.


    # Temperature-controlled


    A temperature-controlled iron solves all that. You can set the temperature just
    right for the solder you’re using, and it will be tracked and adjusted by the
    on-board controller. If a large joint is drawing heat away from the tip too quickly,
    the output is increased; if the tip gets too hot, the output is decreased. The
    aim is temperature stability of a single degree. It’s a powerful feature, and
    a definite step up from cheaper variable-temperature irons which don’t adjust
    their output automatically. As an entry-level example, though, you’d expect to
    see some corners cut in Tenma’s build. Looking at the base unit, they’re not obvious:
    the unit is solidly built and includes a physical power switch, while the large
    backlit LCD display at the front is clear and easy to see while'
