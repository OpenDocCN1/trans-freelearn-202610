  md: '![](img/d8322379620245fcd21eccc3855b8c78_150_0.png)


    # Carving the case


    Before we do anything else, though, we need to create some more space in the controller
    itself. We’ll work on the back plate to snip off the support struts first, your
    mileage may vary depending on which USB controller you buy (there are hundreds),
    but ours has three supports on each side of the controller. Snip them with some
    side cutters or chop them with a craft knife, and then sand down any sharp edges
    so they’re flush to the case.


    We’ll also likely need to remove a couple of the screw hole supports on the controller
    itself, but don’t get carried away yet – you should play it by ear as we try to
    fit everything inside, so we remove as few of the screw holes as possible.


    Once complete, we’ll need to snip off the four USB wires connected to the controller’s
    control board, leaving enough play


    ![](img/d8322379620245fcd21eccc3855b8c78_150_1.png)


    in the cables to ultimately connect the other end to your Pi Zero. To keep things
    really simple, we’re going to connect a slimline mini HDMI-to-HDMI cable to the
    Zero inside the controller. With our controller, it’s actually really easy just
    to line up the HDMI cable with the USB cable exit on the controller itself, but
    you’ll need to use a craft knife to carve a larger opening and carefully strip
    back the housing of the mini HDMI connector to get it to fit snugly.


    # Securing your Pi Zero


    The next thing to do is to secure the Pi Zero in place. Its location in the case
    is decided by the HDMI cable. We want to fix it directly to the controller’s control
    circuit board. There’s a good chance there’s a couple of


    raised components on the back, so we’re using sticky Velcro Command Strips. This
    gives us the clearance we need to steer clear of the components, as well as the
    flexibility to remove or vary the Zero’s placement during the build process. Once
    it’s securely Velcroed in place, we can also work on the placement of the battery
    and the PowerBoost 500, safe in the knowledge everything fits together as it should.
    We plan to position the PowerBoost board just under the right side of the Pi Zero,
    so the micro USB power connector on it sits against the bottom-right straight
    edge at the base of the controller. This allows us to add a power switch in the
    bottom-centre of the controller and place the battery in the right-hand compartment,
    which is currently completely vacant.


    Since the PowerBoost 500 automatically powers on when you connect a battery to
    it, we need to fit a power switch to turn our SNES Consoller on and off. We’re
    using a very standard three-pin switch that we got from a basic electronics kit,
    and three colour-coded male-to-female jumper cables – for power (red), ground
    (brown), and control (orange) – with snipped-off male ends so they can be soldered
    to the PowerBoost board later. Next, tape the female ends of the jumper cables
    together and then simply slot the switch into it. We position


    # Tip


    # TOOLS YOU''LL NEED


    Make sure you have a very sharp craft knife, a decent soldering iron, and a set
    of small screwdrivers to hand – you won’t get far without them.


