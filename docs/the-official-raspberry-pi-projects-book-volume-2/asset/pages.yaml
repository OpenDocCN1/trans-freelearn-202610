  md: "# binary_clock_sh.py\n\n```\n```python\n#!/usr/bin/env python\n\nfrom sense_hat\
    \ import SenseHat\nimport time, datetime\n\nhat = SenseHat()\n\nyear_color = (0,\
    \ 255, 0)\nmonth_color = (0, 0, 255)\nday_color = (255, 0, 0)\nhour_color = (0,\
    \ 255, 0)\nminute_color = (0, 0, 255)\nsecond_color = (255, 0, 0)\nhundredths_color\
    \ = (127, 127, 0)\noff = (0, 0, 0)\n\nhat.clear()\n```\n```\n\n```\n```python\n\
    def display_binary(value, row, color):\n    binary_str = \"{0:08b}\".format(value)\n\
    \    for x in range(0, 8):\n        if binary_str[x] == '1':\n            hat.set_pixel(x,\
    \ row, color)\n        else:\n            hat.set_pixel(x, row, off)\n\nwhile\
    \ True:\n    t = datetime.datetime.now()\n    display_binary(t.year % 100, 0,\
    \ year_color)\n    display_binary(t.month, 1, month_color)\n    display_binary(t.day,\
    \ 2, day_color)\n    display_binary(t.hour, 3, hour_color)\n    display_binary(t.minute,\
    \ 4, minute_color)\n    display_binary(t.second, 5, second_color)\n    display_binary(t.microsecond\
    \ / 10000, 6, hundredths_color)\n    time.sleep(0.0001)\n```\n```\n\nLanguage\n\
    >PYTHON\nDOWNLOAD:\nmagpi.cc/1P1182l\n\n# How the code works\n\nThe two versions\
    \ are actually very similar to each other. Both start by importing the libraries\
    \ that they need for their displays. They then define a number of colour variables\
    \ that you can change, if you like, in order to set different colours for each\
    \ row of the clock.\n\nMost of the action takes place in the display_binary function.\
    \ This takes three parameters. The first is the value to be displayed as binary,\
    \ the second is the row on which it should be displayed (0 to 7), and the final\
    \ parameter is the colour to be displayed.\n\nThe value is converted into a binary\
    \ string representation using String’s format function. The for loop then iterates\
    \ over each column (x value) and if that digit contains a 1, turns on the pixel\
    \ in that row and column to the colour specified, otherwise the pixel is cleared.\n\
    \nThe main loop fetches the current time and then splits it into its component\
    \ parts, displaying each on a separate row. To display the year in two-digit format,\
    \ we use modulo 100 (t.year % 100), which is the remainder after dividing it by\
    \ 100.\n\n# Using your binary clock\n\nHaving a keyboard, mouse and monitor attached\
    \ to your clock is fine while you are constructing it, but it would be better\
    \ to have the program start\n\n> The two versions are actually very similar to\
    \ each other.\n\nautomatically when the Raspberry Pi first boots up. To do this,\
    \ run the following command to make the program executable:\n\n```\n```\nsudo\
    \ chmod +x binary_clock_*.py\n```\n```\n\nThen, edit the file /etc/rc.local with\
    \ the command:\n\n```\n```\nsudo nano /etc/rc.local\n```\n```\n\nAdd the following\
    \ line after the first block of comment lines that begin with #. Change the line\
    \ to the _uni version if you are using a Unicorn HAT.\n\n```\n```\nsudo /home/pi/pi_magazine/12_binary_clock/binary_clock_sh.py\
    \ &\n```\n```\n\nRestart your Raspberry Pi and this time the program should start\
    \ up automatically.\n\nNote that you will still need an internet connection for\
    \ the Pi to pick up the correct time."
