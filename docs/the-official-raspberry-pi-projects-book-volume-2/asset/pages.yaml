  md: '# TENMA 60W DIGITAL SOLDERING STATION


    # Review


    cpc.farnell.com


    £47 / $79


    ![](img/d8322379620245fcd21eccc3855b8c78_180_0.png)


    The iron itself is lightweight, since the electronics are located in the base
    unit


    soldering. A multi-pole connector provides power to and feedback from the iron,
    which is a small and lightweight unit thanks to the bulk of the electronics being
    located in the base unit. The only real negative here is that the unit is fixed
    to the power network of the country of purchase – either 220V or 110V – and its
    power lead is integrated rather than removable.


    # Saving pennies


    It’s not until you look to the bundled stand that you begin to see where Tenma
    has been saving its pennies. While the stand itself is a sturdy metal housing,
    it fails to grip the iron adequately, largely thanks to the lack of weight in
    the iron and the relatively heavy lead which connects it to the base unit. It’s
    functional, but care is needed to make sure the iron doesn’t drop out. The bundled
    cleaning sponge, meanwhile, is barely adequate, and should be replaced with something
    thicker – or an


    alternative tip-cleaning system – as soon as possible. These points aside, though,
    the Tenma soldering station is a joy to use. Its 60W output and dual heating coils
    mean the iron’s tip – which is easily replaceable through a quick twist of a retaining
    nut, with various shapes and sizes available – comes up to temperature rapidly.
    Plus, the live temperature readout on the base unit means there’s no guesswork
    when it comes to seeing whether it’s ready for use or not. Another feature is
    Tenma’s claim to electrostatic discharge (ESD) safety. This is the promise that
    – unlike extremely cheap irons often found in starter kits and from bargain-basement
    shops – there’s no risk that a blast of static electricity will fry any sensitive
    components as you touch the metal tip of the iron to one of their contacts. It’s
    a problem unlikely to have affected most hobbyists, but the reassurance it won’t
    bother you in the future is undeniably nice.


    ![](img/d8322379620245fcd21eccc3855b8c78_180_1.png)


    ![](img/d8322379620245fcd21eccc3855b8c78_180_2.png)


    Above The cleaning sponge isn’t great


    Above top The large LCD is clear and easy to read


    # Last word


    With such a small cost premium over a quality fixed-temperature iron and a fair
    list of advantages, if you fancy treating yourself to an iron upgrade, you could
    do a lot worse than the Tenma.'
