  md: "# binary_clock_uni.py\n\n```\n#!/usr/bin/env python\n\nimport unicornhat as\
    \ hat\nimport time, datetime\n\nyear_color = (0, 255, 0)\nmonth_color = (0, 0,\
    \ 255)\nday_color = (255, 0, 0)\nhour_color = (0, 255, 0)\nminute_color = (0,\
