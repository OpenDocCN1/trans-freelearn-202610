  md: '# PROTOTYPING PROCESS


    Before scaling up to the final full-scale version of SeeMore, three prototypes
    were created...


    ![](img/d8322379620245fcd21eccc3855b8c78_54_0.png)


    Prototype 01

    The first basic prototype featured a single Raspberry Pi connected to a metal
    articulating arm powered by a servo. This was then given to the computer science
    department to test the software.


    ![](img/d8322379620245fcd21eccc3855b8c78_54_1.png)


    Prototype 02

    With nine Raspberry Pis mounted on a flat framework, the team had to figure out
    how to wire them up to avoid any tangling. The computer science department created
    a nine-node parallel computing algorithm.


    ![](img/d8322379620245fcd21eccc3855b8c78_54_2.png)


    Prototype 03

    Scaling things up, 30 Raspberry Pis were mounted on transparent HDPE panels, while
    the articulating arms, framework, and wiring system were similar to those used
    in the final full-scale sculpture.


    Also, rather than moving straight to its maximum 90-degree outward position when
    triggered, each panel moves in proportion to the percentage of computing capacity
    being used by the respective Raspberry Pi. To achieve this, each Pi is linked
    to its arm’s servo via a GPIO pin. While in the prototype designs, the servo also
    received its power from the Pi, a switch from the original Pi Model B to the B+
    for SeeMore’s final version necessitated that both be


    hours machining those pieces,” laughs Sam. He tells us that this provided students
    with many hours of milling experience. The plastic panels are all laser-cut and
    etched with the IP address of the attached Pi in two places, so they can be seen
    whether the panel is flat or has moved out. Having started out with blue and clear
    panels, the team changed them to a translucent green for the New York Maker Faire.
    “I like the idea of customising the project for where we show it.”


    > The logistics of exhibiting SeeMore at an event involve it being transported
    in six crates


    powered separately. Not wanting to overcomplicate the design with battery packs
    or external power supplies, Sam ended up buying PSUs with two USB ports so separate
    cables could be run to the Raspberry Pi and its servo.


    On the software side, Kirk tells us that the combination of controlling the servos
    and running a full OS on the Pis led to complications. “For example, there is
    a software stack or a series of tools that we typically install on top of the
    operating system across the whole cluster. In the Pi environment, combining this
    stack with the servo controls and synchronising the movement of the Pis to running
    tasks was challenging… there is not a lot of community software support available
    since this had never been done. Thus, we created a lot of custom software to make
    this work in a visually compelling way.”


    # Custom components


    The arms themselves comprise a number of pieces made from HDPE (high-density polyethylene)
    plastic, milled out on a ShopBot CNC machine. These had bronze bearings inserted,
    all using steel shafts cut by the team. “Almost every single piece is custom:
    some people assume we bought those off the shelf, but I can assure you we spent
    many


    The logistics of exhibiting SeeMore at an event involve it being transported in
    six crates and then assembled at the location. “My students and I show up three
    days ahead of time,” says Sam. Once the framework’s rings – which are split into
    two for shipping, with Pis still attached – are put back together, there’s a day
    and a half of wiring to be done. “It’s one guy on the outside and one guy on the
    inside, and then you’re just passing wires to each other. It’s actually pretty
    loose in there and I like to keep it that way: I like how the wires move on their
    own inside the structure.” While routing all the USB power lines correctly is
    a major challenge, Sam tells us that getting the Pi network connected is less
    problematic since the cables are connected to six 48-port Ethernet switches in
    SeeMore’s base, so it doesn’t matter which ports they’re plugged into.


