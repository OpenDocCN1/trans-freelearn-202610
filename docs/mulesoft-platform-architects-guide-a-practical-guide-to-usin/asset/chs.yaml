- "# 功能监控、警报和操作监视器\n\n在本章中，我们将讨论如何监控已部署到 CloudHub、本地和 Runtime Fabric 的 MuleSoft 应用程序。应用程序监控对于深入了解应用程序的性能、可用性和正确性至关重要。MuleSoft\
  \ 提供 Anypoint Monitoring，用于监控 MuleSoft 应用程序并提供应用程序性能可见性。\n\n\n\n\n在本章中，我们将涵盖以下主题：\n\
  \n* 什么是 Anypoint Monitoring？\n* Anypoint Monitoring 功能\n* 功能监控\n* API 警报和通知\n* API\
  \ 日志记录和故障排除\n* API Manager 监控\n* Runtime Manager 监控\n\n# 为什么需要 API 监控？\n\nAPI 监控确保\
  \ API 按预期工作且可用。在现代，大多数组织都在进行数字化转型，并依赖 API 来实现这一转型。大多数组织依靠 API 进行关键业务交易。对组织而言，其 API\
  \ 必须始终可用以确保业务连续性，实施稳健的 API 监控系统以确保其性能和正确性至关重要。\n\n监控 API 有助于开发人员在问题升级之前发现问题，并减轻可能导致收入损失的风险。\n\
  \n例如，假设一个与支付相关的 API 无响应，并影响客户从您的电子商务应用程序进行的支付。这可能会给您的业务带来收入损失。监控可以排查问题并快速修复，以防止进一步的收入损失。\n\
  \n# Anypoint Monitoring\n\nAnypoint Monitoring 是 MuleSoft 提供的开箱即用功能，用于监控部署在 CloudHub、本地\
  \ Mule 运行时和 Runtime Fabric 上的 API 或应用程序。该工具可以识别和排查与 MuleSoft API 相关的问题，衡量 API 性能，并快速解决问题。\n\
  \n任何组织的 DevOps 团队都可以使用 Anypoint Monitoring 来快速诊断问题并确定解决方案。使用此工具，识别问题的总体时间将会缩短。它还通过警报、数据可视化工具、聚合指标等帮助解决问题。\n\
  \n## Anypoint API Manager 的监控和分析功能\n\nAnypoint API Manager 提供内置分析仪表板，显示特定时期内的**按位置统计的请求**、**按日期统计的请求**、**按平台统计的请求**和**按应用程序统计的请求**。它们展示了\
  \ API 的性能及其使用情况。策略违规也可以包含在 API 分析仪表板和 API 图表中。API Manager 分析数据保留 30 天：\n\n![Figure\
