  \ API 策略对组织内的用户进行身份验证？\n\n1. 基础认证 – LDAP\n2. 基础认证\n3. JWT 验证\n4. IP 允许列表\n\n## 第\
  \ 4 题\n某组织已将 API 实现永久迁移至新位置。告知客户端请求的资源已永久移动到新位置的最佳方法是什么？\n\n1. 返回状态码 500 和消息 \"\
