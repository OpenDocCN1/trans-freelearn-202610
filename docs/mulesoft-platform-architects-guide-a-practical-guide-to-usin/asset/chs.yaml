  \    *   `CPU bursting`（CPU 突发）的概念\n    *   副本、副本规格和副本集群\n    *   应用程序部署选项\n   \
  \ *   高可用性、容错性和可扩展性\n*   **启用 Anypoint Monitoring：**\n    *   Anypoint Monitoring\
  \ 指标、自定义仪表板、报表等\n\n\n\n\n\n## 考试主题\n\n*   私有和公共端点的功能监控\n*   `Anypoint Monitoring`\
  \ 日志记录选项\n*   本地 `Mule Runtime` 的监控\n*   高 `CPU` 和内存使用率的警报\n\n*   API 治理：\n    *\
  \   为部署到 `Runtime Fabric Manager`、`CloudHub 1.0` 和 `CloudHub 2.0`、本地环境等的应用程序启用 `API\
