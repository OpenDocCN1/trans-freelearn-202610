  # API 治理


  API 治理是 Anypoint Platform 的一个组件，它使您能够将治理规则应用于 API，以确保 API 一致性。它提供了几个默认规则集，例如 OWASP
  API 安全前 10 名、Anypoint API 最佳实践和 OpenAPI 最佳实践治理规则集，这些规则集可以在设计阶段应用于 API 规范，以确保 API
  规范符合组织的 API 标准和指南，并与之保持一致。API 治理将确保整个企业的 API 设计保持一致，并在设计时考虑到 API 最佳实践和指南。这将确保 API
  的安全性并提高 API 的质量。


  ## 实施 API 治理


  实施 API 治理的第一步是在 Anypoint Platform 的 API 治理组件中创建一个配置文件，并选择需要为该配置文件启用的规则集。您可以添加过滤器和通知。过滤器将选择需要根据我们创建的配置文件进行扫描的
  API。如果 API 未根据与配置文件关联的规则集进行设计，通知将向用户发送电子邮件，并将其标记为**不合规**。


  作为 API 治理的一部分，您的 API 维护以下三种状态：


  *   **未验证**：API 未根据 API 治理配置文件进行验证。

  *   **合规**：API 满足了与配置文件关联的规则集。

  *   **不合规**：API 未满足与配置文件关联的规则集。


  开发人员或架构师可以在 Design Center 的 API 设计阶段应用 API 治理，方法是将治理规则集作为依赖项直接添加到 API 规范中，以便开发人员或架构师可以在
  API 设计阶段验证规范的合规性。


