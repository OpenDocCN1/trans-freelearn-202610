  ## API 保护的安全措施


  可以实施以下措施来保护 API 免受安全威胁或攻击：


  *   **API 网关**：`MuleSoft` 的 API 网关可以处理 `OAuth 2.0`、`JWT`、`SAML` 等多种安全协议。通过作为流量管理和
  API 实现之间的屏障，它提供集中式策略管理。

  *   **Anypoint Security**：`MuleSoft` 的 `Anypoint Security` 利用令牌化、速率限制、IP 白名单和黑名单等尖端安全功能，为
  API 提供多层保护。`Anypoint Security` 仅由 `Runtime Fabric` 支持。

  *   **速率限制和节流**：此功能可保护 API 免受突发流量激增的影响，并防范 `DoS` 攻击。

  *   **令牌化**：在处理敏感数据时，`MuleSoft` 可以用令牌替换敏感数据，提供额外的安全层。令牌化仅由 `Runtime Fabric` 支持。

  *   **安全策略**：`MuleSoft` 便于在 API 上实施预制或个性化的安全策略，例如 HTTP 基本身份验证策略和 `OAuth 2.0` 作用域验证策略。

  *   **DataWeave**：为了进一步减少数据暴露，`MuleSoft` 的转换语言有助于在记录活动之前对敏感数据进行匿名化处理。

  *   **安全属性**：`MuleSoft` 提供通过加密应用程序属性内的敏感信息来保护静态数据的能力。使用安全算法（如 `AES256` 或 `Blowfish`）加密应用程序中的所有安全属性。

  *   **审计和监控**：为了识别异常、监控 API 活动并跟踪任何未经授权的访问，`MuleSoft` 自带审计和监控工具。

  *   **传输中的 API 安全**：使用 `传输层安全性` (`TLS`) 等加密协议来保护数据在传输过程中的安全，以防止数据被篡改和拦截。`TLS` 也称为安全套接字层，是保障在线交易和登录在后台安全的标准安全技术。在您所有的
  `Mule` API 中，您的组织可以实施 `TLS` 安全，这将确保网络上消息的机密性和数据的完整性。使用 `Anypoint Secrets Manager`
  添加 `TLS` 上下文将允许您在应用程序或 API 代理级别配置 `TLS` 设置。`Flex Gateway` 也支持此功能。特别是，`TLS` 的实施将最大限度地减少
  API 中的漏洞，如安全错误和不安全的消费。

  *   **在设计阶段保护 API**：`MuleSoft` 提供可在设计阶段应用于 API 的 API 治理规则集。此规则集将扫描 API 以确保质量、合规性、安全性和一致性。我们在本章中已经讨论了
  API 治理。


  请回顾，将这些防御措施集成到设计、实施和部署阶段——而不仅仅是作为事后补救措施添加——是保护 `MuleSoft` API 的最佳方法。适当的安全措施还应遵守行业标准和最佳实践。


  ## 摘要


  在本章中，我们学习了如何使用通用 API 管理来阻止 API 蔓延。为了实现通用 API 管理——允许用户从单一控制平面管理、治理、保护和交互 API——我们讨论了几个组件，包括
  `Flex Gateway`、`API Governance`、开发者门户和 `API Manager`。


  下一章将介绍必须解决的非功能性需求，以提供构建高质量 API 的可靠框架。


