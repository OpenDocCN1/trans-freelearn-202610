  #### 方案 2 – 在本地 Mule Runtime 中部署 API 代理以管理非 MuleSoft API


  将 API 代理部署到可与后端 API 交互的本地 `Mule Runtime` 是管理后端 API 所必需的。在这种情况下，不需要 VPN，因为后端 API
  和 `Mule Runtime` 位于同一个数据中心。


