  作为粗粒度 API 和细粒度 API 差异的一个示例，让我们更详细地看看 `Figure 6.1` 中所示的图书馆管理系统 API。


  ## 粗粒度 API 示例


  单次 API 调用（例如 `GET /members`）可能会返回大量详尽的数据，包括用户的联系详情、地址、当前借阅的书籍列表、借阅历史、任何未缴罚款以及注册的支付方式。


  因为它只需要一次请求就能提供大量数据，其中一些数据可能并不总是被需要或使用，所以这是一个粗粒度 API。


  ## 细粒度 API 示例


  细粒度方法将涉及发出多个 API 查询以获取相同的数据。API 调用（如 `GET /members`（成员基本信息）、`GET /books`（指定成员借阅的书籍）、`GET
  /payments`（支付方式和详情）以及 `GET /books/history`（借阅书籍历史））将彼此区分开来。


  每个 API 调用都是唯一的，并生成一组有针对性的信息。如果你只需要知道借阅了哪些书，则只需提交指定的 `GetBorrowedBooks` 请求。


  > **注意：**

  > 细粒度 API 将导致更多数量的资产。如果您使用 Anypoint Exchange 管理 API 的资产，您将看到细粒度 API 的资产比粗粒度 API
  多。


  在前一节中，我们介绍了细粒度 API 和粗粒度 API 之间的区别。在下一节中，我们将深入探讨 API 并发和 HTTP 动词。


  # API 并发


  API 同时处理多个请求的能力称为 API 并发。这在去中心化系统中尤为重要，在该系统中，许多独立服务通过 API 相互通信。如果系统在没有适当并发控制的情况下过载，可能会导致竞态条件，即多个进程访问和操作相同的数据，从而导致结果不一致。


  以下是处理并发的支持方式：


  *   **多线程**：这可能是处理并发最常见的方式。每个请求由特定线程处理，以便并行处理多个请求。缺点是管理许多线程可能会消耗大量资源。

  *   **速率限制**：这用于控制客户端在指定时间内可发出的 API 请求数量。这可确保您的 API 不会一次性被过多请求淹没。

  *   **排队**：如果并发请求数量超过特定阈值，应用系统可能会创建一个队列。这可确保每个请求最终都会被处理，但如果队列太长，可能会导致延迟。

  *   **缓存**：请求的结果可以被存储并重用于未来的相同请求，从而减少对并发的需求。它可以大幅减轻 API 的负载，但仅适用于幂等（读取）请求或数据不频繁变化的情况。

  *   **负载均衡**：如果请求分布在多个服务器上，负载均衡器可以帮助 API 同时处理大量请求。


  在设计 API 时考虑并发非常重要，因为它会显著影响性能和可用性。


  # HTTP 动词


  HTTP 动词，也称为 HTTP 方法，是指定对特定资源执行所需操作的命令。虽然每种方法实现不同的语义，但所有方法都共享一些通用特性。最常用的 HTTP 方法列在此处：


  *   `GET`：使用给定的 URI，此方法从指定服务器检索数据。它是发送未加密数据最广泛使用的技术。

  *   `POST`：此方法用于将表单数据发送到服务器。通过 `POST` 发送的数据不会被服务器缓存。

  *   `PUT`：此技术上传内容以替换现有资源。

  *   `DELETE`：此命令删除指定资源。

  *   `HEAD`：此方法类似于 `GET`，但它仅返回响应头而非响应体。

  *   `OPTIONS`：此方法返回目标资源的通信选项。

  *   `PATCH`：此功能部分修改资源。

  *   `CONNECT`：客户端使用此方法通过网络连接到 HTTP Web 资源。

  *   `TRACE`：此方法沿通往目标资源的路径执行消息环回测试。


  使用 HTTP 方法，客户端可以通过提交、检索和修改数据与服务器资源进行通信。重要的是要记住，这些事务中的数据可以采用 XML、JSON 甚至 HTML 格式进行编码。客户端和服务器的需求通常决定所选择的方法。


  下表列出了 HTTPS 方法以及它们是否安全、幂等或两者兼具：


  | **HTTP 方法** | | **描述** | | **幂等** | | **安全** |

  | --- | --- | --- | --- | --- | --- | --- |

  | `GET` | | 从指定资源请求数据 | | 是 | | 是 |

  | `POST` | | 创建新资源 | | 否 | | 否 |

  | `PUT` | | 更新现有资源 | | 是 | | 否 |

  | `DELETE` | | 删除指定资源 | | 是 | | 否 |

  | `HEAD` | | 类似于 GET，但仅返回标头部分和状态行；不返回资源本身 | | 是 | | 是 |

  | `OPTIONS` | | 概述目标资源的通信选项 | | 是 | | 是 |

  | `PATCH` | | 应用资源的部分修改 | | 否 | | 否 |

  | `CONNECT` | | 用于通过网络连接到资源（通常用于 SSL 隧道） | | 否 | | 否 |

  | `TRACE` | | 对测试和调试有用；沿通往目标资源的路径向后循环 | | 是 | | 是 |


  表 6.3 - HTTP 动词


  幂等方法和安全方法定义如下：


  *   **幂等方法**：这些方法重复调用时产生的副作用与仅调用一次时相同。

  *   **安全方法**：这些方法被调用时不会更改资源。它们不应有任何其他效果；其唯一目的是检索数据。


  # API 回调


  一种称为回调的异步 API 请求来自 API 服务器，并作为对客户端已发出请求的响应传递给客户端。回调是 API 提供有关有趣事件的信息并识别这些事件的有用工具。


  下图展示了 API 回调的示意图。


  ![Figure 6.2 - API 回调](img/B19922_06_02.jpg)


  图 6.2 - API 回调





  ## API 回调安全


  如图 6.2 所示，假设我们正在开发一个 API 或应用程序，它需要第三方服务执行一些繁重的处理，且这是一个耗时的过程。在这种情况下，我们会将请求提交给服务器，而不会立即等待服务器响应。一旦服务器完成处理，它会将结果通过客户端提供的回调
  URL 发送回客户端。


  可以通过使用 JWT 令牌，或在 API 回调 URL 上实施任何认证机制来保护 API 回调 URL。


  可以使用以下机制来保护 API 回调端点：


  *   在 API 回调端点上实施基本认证

  *   在回调期间向 HTTP 头添加 HMAC 签名

  *   在 API 回调端点上实施双向认证 (mTLS)；该端点可验证客户端证书


  尽管我们讨论了可以实施的几项安全措施，但 API 回调端点还需遵守额外的安全措施。


  当您预期发送到服务器的请求可能需要一段时间，且客户端无法等待响应时，API 回调非常有用。在这种情况下，服务器会确认客户端的请求，并发送一个技术响应，指示请求已被接受。服务器完成对客户端请求的处理后，会使用客户端提供的
  API 回调 URL 将功能性响应发送回客户端。


