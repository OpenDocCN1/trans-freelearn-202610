  \ 1.0 工作节点的默认 DNS 记录列表。它们可用于通过公共或专用网络访问 API。\n\n## 智能修复（单区域灾难恢复）\n\n部署到 CloudHub\
  \ 1.0 的应用程序可以自动从任何故障或崩溃中恢复。MuleSoft 提供了一种称为自修复的机制，当可用区宕机或底层基础设施故障时，应用程序会自动恢复。在这种情况下，应用程序将在另一个可用区中重新启动，或尝试自动恢复。\n\
  \n### 单工作节点部署\n\n*   应用程序将自动部署到所选区域中的一个可用区。\n*   如果可用区发生故障，应用程序将在另一个可用区中重新启动。在应用程序在另一个可用区中重新启动之前，可能会有短暂的停机时间。\n\
  \n![Figure 9.2 - Intelligent healing (single instance of an application)](img/B19922_09_02.jpg)\n\
  \n**图 9.2** - 智能修复（应用程序的单个实例）\n\n### 多工作节点部署\n\n*   部署在多个工作节点上的应用程序意味着该应用程序将部署到所选区域中的多个可用区。\n\
  *   如果可用区发生故障，应用程序将在另一个可用区中重新启动，而另一个可用区中的另一个应用程序实例将继续处理请求。失败的实例将尝试在另一个可用区中重新启动。\n\
  \n![Figure 9.3 - Intelligent healing (multiple instances of an application)](img/B19922_09_03.jpg)\n\
  \n**图 9.3** - 智能修复（应用程序的多个实例）\n\n## 零停机更新\n\n应用程序可以重新部署，或者可以修改应用程序配置（如工作节点大小、工作节点数量或任何其他设置），而无需任何停机时间。在应用程序重新部署的情况下，用户将永远不会遇到任何停机时间。当我们将应用程序重新部署到\
  \ CloudHub 1.0 时，旧的应用程序实例将保持运行，并且域名将指向旧的应用程序实例，直到新应用程序成功部署到 CloudHub 1.0。\n\n##\
  \ 高可用性\n\n部署在 CloudHub 1.0 上的应用程序具有高可用性。为确保应用程序的高可用性，必须将其部署在多个工作节点上。当您在一个工作节点上部署应用程序时，该应用程序将部署到\
  \ AWS 中的一个可用区。如果可用区宕机或应用程序尝试从任何故障中恢复，则可能会出现短暂的停机时间。\n\n当您在多个工作节点上部署应用程序时，该应用程序将在\
  \ AWS 的多个可用区中可用。当其中一个可用区宕机时，将实现零停机时间，因为应用程序在另一个可用区中可用。如果整个区域宕机，您将遇到停机时间，直到该区域中的一个可用区恢复运行。\n\
  \n## 可扩展性\n\n可扩展性对于任何应用程序实现高性能至关重要。部署到 CloudHub 1.0 的应用程序可以通过增加工作节点数量（水平扩展）或工作节点大小（垂直扩展）来轻松扩展。这可以通过零停机时间来实现。\n\
  \nCloudHub 1.0 提供了自动扩展等功能。要在 CloudHub 1.0 中启用自动扩展，您必须拥有企业许可协议。在 Anypoint Platform\
  \ 的 Runtime Manager 控制台中，您可以为应用程序定义策略，以便根据内存和 CPU 使用情况自动扩展。\n\n## 持久队列\n\n持久队列是一项基于云的服务，允许发布到\
  \ VM 队列的消息在应用程序中外部存储。此功能直接与 CloudHub 1.0 应用程序相关联，可在应用程序级别启用。它允许开发人员设计 VM 队列，通过启用持久队列在工作节点之间分配负载；这将确保如果工作节点宕机，消息将持久保存。在多工作节点部署环境中，如果其中一个工作节点失败，则消息将由另一个工作节点读取，以确保服务连续性。\n\
  \n如果部署到 CloudHub 1.0 的应用程序正在使用 VM 队列，则可以启用持久队列。通过启用**加密持久队列**，消息可以作为加密消息存储在持久队列中：\n\
  \n![Figure 9.4 - Enabling Encrypt persistent queues](img/B19922_09_04.jpg)\n\n**图\
  \ 9.4** - 启用加密持久队列\n\n*图 9.4* 显示了如何为部署到 CloudHub 1.0 的应用程序启用持久队列。\n\n持久队列的限制在于，与不使用持久队列相比，它可能会使应用程序性能下降多达\
  \ 10 倍。如果您选择**加密持久队列**选项，性能可能会进一步下降。如果您不使用持久队列，消息将存储在内存或工作节点的本地文件中。在这种情况下，当应用程序重新启动或重新部署时，消息将会丢失。\n\
  \n## 管理计划\n\nCloudHub 1.0 允许您管理和查看部署的应用程序的 Mule 流中配置的调度器组件。在 Runtime Manager 中，您可以使用应用程序中的**计划**选项卡来查看调度器的频率、更改调度器的频率，或启用/禁用调度器，而无需更改或重新部署正在运行的应用程序。\n\
  \n可以在**计划**选项卡上执行以下任务：\n\n*   可随时触发作业，无论应用程序上设置了什么计划，也无需修改调度器\n*   如果调度器应用程序连接的底层系统需要维护，可禁用调度器\n\
  *   可随时更新调度器，无需修改或重新部署应用程序\n\n## Object Store V2\n\nObject Store V2 允许部署到 CloudHub\
  \ 1.0 的应用程序存储数据，并共享批处理流程、Mule 应用程序和组件的状态（在应用程序内部或通过使用 Object Store REST API）。以下是\
  \ Object Store V2 的功能列表：\n\n\n\n\n## 对象存储 V2\n\n* 对象存储 V2 将与您的工作器位于同一区域。\n* 它允许存储无限数量的条目。对对象存储的总大小没有限制。\n\
  * 它可以存储大小高达 10 MB（Base64 编码后）的值。\n* 它在所有区域及区域内的所有可用区均可用。\n* 它提供 MuleSoft 对象存储连接器，用于检索和存储数据。\n\
  * 外部应用程序可以使用对象存储 REST API v2 来访问其他 MuleSoft 应用程序中的对象存储。\n* 对象存储 REST API 支持连接应用程序，以使用\
  \ API 通过 Anypoint Platform 进行身份验证。\n\n![图 9.5 - CloudHub 1.0 与本地 Mule 运行时之间访问对象存储](img/B19922_09_05.jpg)\n\
  \n图 9.5 - CloudHub 1.0 与本地 Mule 运行时之间访问对象存储\n\n图 9.5 展示了一个部署在 CloudHub 1.0 上并正在访问对象存储的\
  \ MuleSoft 应用程序。要在应用程序内部访问对象存储，可以使用对象存储连接器。要从部署在 CloudHub 1.0 或本地的另一个应用程序访问对象存储，可以使用对象存储\
  \ REST API。\n\n## 静态 IP 地址\n\n默认情况下，从 AWS EC2 IP 池中分配一个 IP 地址给部署在 CloudHub 1.0 上的任何应用程序。每次重启或重新部署应用程序时，IP\
  \ 地址都会动态变更。您可以在 <https://docs.aws.amazon.com/vpc/latest/userguide/aws-ip-ranges.html>\
  \ 找到可用的 AWS EC2 IP 池 IP 地址列表。CloudHub 1.0 允许我们在 Runtime Manager UI 的**设置**页面为应用程序配置静态\
  \ IP 地址。\n\n为应用程序配置静态 IP 地址的主要原因是为了让它能被其他服务加入白名单。例如，MuleSoft 想要连接到一个 SFTP 位置，该来源需要将其\
  \ IP 加入白名单才能安全地连接到 SFTP。\n\n分配给任何组织的静态 IP 地址数量 = 2 \\* 生产环境 vCore 数量：\n\n![图 9.6\
  \ - 应用程序使用静态 IP 地址与外部服务通信](img/B19922_09_06.jpg)\n\n图 9.6 - 应用程序使用静态 IP 地址与外部服务通信\n\
  \n仅在以下场景中可以更改静态 IP 地址：\n\n* 如果应用程序被删除并重新部署。删除应用程序将删除分配给该应用程序的静态 IP 地址。每当您部署一个同名应用程序时，都会动态分配一个新的静态\
  \ IP 地址。\n* 如果应用程序被重新部署到不同的区域。\n* 如果应用程序从一个环境移动到另一个环境。\n* 释放未使用的 IP 地址，然后稍后启用**使用静态\
  \ IP**：\n\n![图 9.7 - 为部署在 CloudHub 1.0 上的应用程序启用静态 IP 地址](img/B19922_09_07.jpg)\n\
  \n图 9.7 - 为部署在 CloudHub 1.0 上的应用程序启用静态 IP 地址\n\n图 9.7 展示了如何为部署在 CloudHub 1.0 上的应用程序启用静态\
  \ IP 地址。\n\n在本节中，我们介绍了 CloudHub 1.0 提供的特性和功能，包括可扩展性、高可用性、区域、DNS 记录、静态 IP 地址、工作器、工作器大小等。\n\
  \n默认情况下，CloudHub 1.0 不支持自定义域名和证书或双向认证，也无法连接防火墙后面的资源。但是，CloudHub 1.0 确实允许您创建 Anypoint\
  \ VPC，它支持双向认证、自定义域名和证书等功能。它可以连接防火墙后面的资源，并允许您在 CloudHub 1.0 中创建自己隔离的独立网络段。让我们详细讨论\
  \ Anypoint VPC 及其组件。\n\n# Anypoint VPC\n\nAnypoint VPC 允许您在 CloudHub 1.0 中建立一个安全、隔离、独立且私有的网络，您可以在其中为您的组织托管\
  \ MuleSoft 应用程序。Anypoint VPC 可以在前面提到的 12 个不同的 AWS 区域中创建。创建 Anypoint VPC 时可以选择区域。让我们看一下关于此服务的一些关键点：\n\
  \n* Anypoint VPC 可以安全地连接到您自己的数据中心或公有云\n* 它将 CloudHub 1.0 连接到防火墙后面的资源\n* 支持自定义域名和自定义证书\n\
  * 支持专用负载均衡器，将流量路由到部署在 Anypoint VPC 内的应用程序\n* 支持双向认证\n\n使用 Anypoint VPC，您可以配置特定的入站防火墙规则来控制入站流量。可以在\
  \ Anypoint VPC 上配置的默认防火墙规则如下：\n\n| 变量 | 端口 | 描述 |\n| --- | --- | --- |\n| `${http.port}`\
  \ | 8081 | 这将通过 HTTP 从共享负载均衡器接受公共流量 |\n| `${https.port}` | 8082 | 这将通过 HTTPS 从共享负载均衡器接受公共流量\
  \ |\n| `${http.private.port}` | 8091 | 这将通过 HTTP 从内部 VPC 接受本地网络流量 |\n| `${https.private.port}`\
  \ | 8092 | 这将通过 HTTPS 从内部 VPC 接受本地网络流量 |\n\n表 9.4 - Anypoint VPC 默认入站防火墙规则\n\n##\
  \ Anypoint VPC 架构\n\n下图显示了默认的 Anypoint VPC 架构。在此架构中，端口 8081 (`${http.port}`) 允许接受\
  \ HTTP 流量，端口 8082 (`${https.port}`) 允许从共享负载均衡器接受 HTTPS 流量。端口 8091 允许接受来自内部应用程序或内部用户的\
  \ HTTP 流量，端口 8092 允许接受 HTTPS 流量：\n\n![图 9.8 - 具有共享负载均衡器的 Anypoint VPC 架构](img/B19922_09_08.jpg)\n\
  \n图 9.8 - 具有共享负载均衡器的 Anypoint VPC 架构\n\n本地私有网络云中的应用程序可以使用内部 DNS (`mule-worker-internal-<myapp>.<region_alias>.cloudhub.io:port`)\
  \ 访问在 Anypoint VPC 中运行的 MuleSoft 应用程序。这些内部应用程序或用户必须使用 VPC 对等连接、VPN IPsec 隧道、Direct\
  \ Connect 或 Transit Gateway 与 Anypoint VPC 建立连接。部署在 CloudHub 1.0 上的 Anypoint VPC\
  \ 中的 MuleSoft 应用程序可以访问位于企业数据中心、私有云或本地的服务、应用程序和数据库：\n\n![图 9.9 - 具有专用负载均衡器的 Anypoint\
  \ VPC 架构](img/B19922_09_09.jpg)\n\n图 9.9 - 具有专用负载均衡器的 Anypoint VPC 架构\n\n在图 9.9\
  \ 所示的架构中，我们阻止了来自共享负载均衡器的流量，这意味着我们将不允许端口 8081 和 8082 上的任何流量，并且这些规则将从 Anypoint VPC\
  \ 中移除。这意味着部署在 CloudHub 1.0 上的应用程序位于私有端口 **8091** 或 **8092** 上。要将流量路由到部署在这些私有端口上的应用程序，您需要\
  \ Anypoint VPC 内的专用负载均衡器。\n\n现在，让我们谈谈 VPC 连接方法。根据您的系统所在位置和运行位置，Anypoint VPC 可以使用以下方法之一连接到私有网络：\n\
  \n* VPN IPsec 隧道\n* VPC 对等连接\n* Transit Gateway\n* Direct Connect\n\n## VPN IPsec\
  \ 隧道\n\n**虚拟专用网络 (VPN)** IPsec 隧道允许 Anypoint VPC 连接到本地数据中心。这是连接 Anypoint VPC 到本地数据中心的推荐解决方案之一。它确保\
  \ Anypoint VPC 和本地数据中心之间存在加密且安全的连接：\n\n![图 9.10 - Anypoint VPN](img/B19922_09_10.jpg)\n\
  \n图 9.10 - Anypoint VPN\n\n\n\n\n\n# VPN IPsec 隧道\n\nVPN IPsec 隧道通过互联网经由加密隧道实现 Anypoint\
  \ VPC 与本地数据中心或私有网络之间的连接。Anypoint Platform VPN IPsec 隧道支持两种路由类型：静态和动态。\n\n静态路由是非自适应的，因为它不会自动更新或修改路由表；它需要手动更新。静态路由不使用任何复杂算法，且比动态路由更安全。\n\
  \n动态路由使用复杂算法在网络拓扑中选择最佳路径。动态路由使用 `Border Gateway Protocol` (`BGP`)。\n\n## Anypoint\
  \ VPN 高可用性\n\nAnypoint VPN 创建两条隧道，分别终止于 AWS 区域中两个不同的可用区。这确保了如果其中一条隧道因可用区维护或升级而中断，AWS\
  \ 会将流量路由到另一可用区中的隧道。建议在客户网关中配置这两条隧道以实现冗余。如果其中一条隧道中断，AWS 会将该 VPN 连接的流量路由到另一条隧道：\n\n\
  ![图 9.11 - Anypoint 虚拟专用网络高可用性](img/B19922_09_11.jpg)\n\n图 9.11 说明了具有两条隧道的 VPN 以确保高可用性。\n\
  \n## Anypoint VPN 灾难恢复\n\nAnypoint 允许我们将最多 10 个 VPN 与 Anypoint VPC 关联。Anypoint VPN\
  \ 网关可以配置在与客户相同或不同的物理位置。为避免单点故障，客户网关必须位于不同的位置或城市。建议将第二个位置用作灾难恢复位置：\n\n![图 9.12 -\
  \ Anypoint VPN 灾难恢复](img/B19922_09_12.jpg)\n\n在图 9.12 所示的架构中，VPN 的配置方式决定了发生故障时将按以下顺序使用：\n\
  \n* `VPN-1 Tunnel-1`\n* `VPN-1 Tunnel-2`\n* `VPN-2 Tunnel-1`\n* `VPN-2 Tunnel-2`\n\
  \n这配置为在发生任何故障时自动故障转移到另一条 VPN 隧道或另一个 VPN 连接。此 VPN 解决方案将具有弹性且稳健。动态路由可自动将路由从 `VPN-1`\
  \ 提升至 `VPN-2`，它也支持静态路由，此时 `VPN-2` 将处于待机模式，以防 `VPN-1` 故障。\n\n## VPN IPsec 隧道的示例用例\n\
  \n* 将 Anypoint VPC 与客户的私有数据中心或私有网络连接\n* 将 Anypoint VPC 与非 AWS 云（如 Azure、GCP 或 Oracle\
  \ Cloud）连接\n\n## 配置 VPN 连接的建议\n\n* 始终实施高可用 VPN 解决方案，以防止在 AWS 对 VPN 进行安全更新期间出现任何停机\n\
  * 最佳实践是为生产环境和非生产环境分别设置独立的 VPN 隧道\n\n# VPC 对等连接\n\nVPC 对等连接是 CloudHub 1.0 提供的一种连接选项，用于在同一\
  \ AWS 区域中对等连接两个或多个 VPC。VPC 对等连接是实现 Anypoint VPC 与同一区域中 AWS VPC 之间通信的最快方式，因为它可以通过提交支持工单并提供\
  \ MuleSoft 提供的模板中的网络详细信息来轻松创建。这是 [MuleSoft 官方文档](https://docs.mulesoft.com/cloudhub-1/to-request-vpc-connectivity)，描述了如何提交支持请求。\n\
  \n模板可在 [MuleSoft 官方文档](https://docs.mulesoft.com/runtime-manager/_attachments/VPC-form-v9.3-template.xlsx)\
  \ 中找到。\n\nVPC 对等连接可使用 `IPv4` 或 `IPv6` IP 地址进行配置：\n\n![图 9.13 - Anypoint VPC 对等连接](img/B19922_09_13.jpg)\n\
  \n# Transit Gateway 附件\n\nTransit Gateway 附件是 MuleSoft 提供的另一种连接 AWS Transit Gateway\
  \ 的选项。AWS 中的 Transit Gateway 可以连接到 AWS VPC 或任何公有/私有云或本地数据中心。CloudHub 1.0 可以附加 AWS\
  \ 中可用的 Transit Gateway，以启用与本地数据中心、公有/私有云等的连接。\n\nTransit Gateway 是 AWS 云中的路由器，它简化了网络配置，允许您连接\
  \ AWS 中的 VPC 或 Private Space 以及 Anypoint Platform，并以安全的方式与本地环境、Azure Cloud 或任何第三方私有网络建立\
  \ VPN 连接。\n\nCloudHub 1.0 允许您在组织中附加多个 Transit Gateway，但这取决于您的组织有权使用的 Transit Gateway\
  \ 许可证数量：\n\n![图 9.14: Transit Gateway 附件](img/B19922_09_14.jpg)\n\n在图 9.14 中，我们通过\
  \ AWS 中的 Transit Gateway 将 AWS VPC 连接到本地数据中心，并在 Anypoint Platform 中创建 Transit Gateway\
  \ 附件。通过这种方式，我们可以通过 AWS Transit Gateway 连接 AWS VPC 和本地数据中心。\n\n请注意，Transit Gateway\
  \ 只能在将连接到本地数据中心、公有/私有云等的 AWS 实例中创建。CloudHub 1.0 可以通过与 Anypoint VPC 附加来利用 Transit\
  \ Gateway 连接。\n\n# AWS Direct Connect\n\nAWS Direct Connect 允许您在您的私有网络与一个 Direct\
  \ Connect 位置之间创建专用网络线路。一旦您在 AWS 账户中启用了 Direct Connect 连接，您就可以建立与 AWS VPC 或本地数据中心的连接。这种连接可以在\
  \ MuleSoft 支持团队的帮助下建立。Direct Connect 使用 `BGP` 进行动态路由：\n\n![图 9.15: AWS Direct Connect](img/B19922_09_15.jpg)\n\
  \n# 计算 Anypoint VPC 的 CIDR 掩码\n\n`Classless Inter Dynamic Routing` (`CIDR`) 是一种分配\
  \ IP 地址的方法，它提高了数据路由效率，并取代了基于 A 类、B 类和 C 类网络分配 IP 地址的旧方法。支持的最小块大小为 `/24`，最大块大小为 `/16`：\n\
  \n| CIDR 块大小 | IP 地址数量 |\n| --- | --- |\n| `/24` | 256 |\n| `/23` | 512 |\n| `/22`\
  \ | 1024 |\n| `/21` | 2048 |\n| `/20` | 4096 |\n| `/19` | 8192 |\n| `/18` | 16384\
  \ |\n| `/17` | 32768 |\n| `/16` | 65536 |\n\n表 9.5 - CIDR 块大小\n\n让我们学习如何计算 Anypoint\
  \ VPC 的 CIDR 块。考虑以下需求并计算 CIDR 块大小：\n\n* 两个非生产环境：开发和 UAT\n* 一个生产环境\n* 开发环境中的应用程序将部署在一个\
  \ worker 上\n* UAT 环境中的应用程序将部署在两个 worker 上\n* 生产环境中的应用程序将部署在两个 worker 上\n* 每个环境将部署约\
  \ 10 个应用程序\n* 生产环境和非生产环境需要单独的 Anypoint VPC\n\n始终将应用程序数量乘以 10，以确保我们选择最大的 CIDR 块大小——一旦创建了\
  \ VPC，就无法更新它。增加 Anypoint VPC 的 CIDR 掩码的唯一方法是删除它并重新开始：\n\n| 环境 | 生产 | 非生产 |\n| ---\
  \ | --- | --- |\n| 开发 | | `10 (应用程序) * 10 * 1 (Worker) = 100` |\n| UAT | | `10 (应用程序)\
  \ * 10 * 2 (Worker) = 200` |\n| 生产 | `10 (应用程序) * 10 * 2 (Worker) = 200` | |\n|\
  \ 总计 | 200 | 300 |\n| 额外 IP 地址 (总计的 50%) 用于零停机 | 100 | 150 |\n| 为基础设施保留的 IP 地址 |\
  \ 2 | 2 |\n| IP 总数 | 302 | 452 |\n\n表 9.6 - Anypoint VPC 规模估算\n\n\n\n\n\n# Anypoint\
  \ VPC 和专用负载均衡器\n\n## Anypoint VPC 规模调整和最佳实践\n\n从*表 9.6*中，我们得出生产环境所需的 IP 地址总数为 302\
  \ 个，可以通过 `/23` 的 CIDR 块大小提供。非生产环境所需的 IP 地址总数为 452 个，可以通过 `/22` 的 CIDR 块大小提供。\n\n\
  以下是创建 Anypoint VPC 的建议和最佳实践：\n\n*   **始终选择较大的 CIDR 范围** – Anypoint VPC 不允许您稍后更新\
  \ CIDR 掩码。要修改 CIDR 掩码，必须删除 VPC 并使用新的 CIDR 掩码重新创建。\n*   建议为生产环境和非生产环境分别创建独立的 Anypoint\
  \ VPC。\n*   为 Anypoint VPC 选择的 CIDR 掩码不得与您网络或数据中心中的 IP 范围重叠。\n*   多个环境可以映射到单个 Anypoint\
  \ VPC。\n*   一个环境不能关联多个 Anypoint VPC。\n*   多个业务组可以映射到 Anypoint VPC。建议在父业务组中创建 Anypoint\
  \ VPC，并将其共享给子业务组。\n\n## Anypoint 专用负载均衡器\n\nAnypoint VPC 创建完成且应用程序已部署到 Anypoint\
  \ VPC 的私有端口后，我们需要对其进行访问。要访问部署在 Anypoint VPC 内私有端口上的应用程序，我们需要配置专用负载均衡器。\n\n专用负载均衡器是允许您将流量路由到在\
  \ `CloudHub 1.0` 上运行、位于 Anypoint VPC 私有端口上的 MuleSoft 应用程序的组件。它是一个可选组件，并非总是必需。\n\n\
  专用负载均衡器将暴露两条 `A` 记录，用于接受来自本地私有网络和公共网络的流量。其中一条记录是内部的（`internal-<lb-name>.lb.anypointdns.net`），另一条是外部的（`<lb-name>.lb.anypointdns.net`）。\n\
  \n专用负载均衡器允许您选择多个工作节点。对于通过专用负载均衡器进来的大量请求，您可以在配置专用负载均衡器时选择更多工作节点。您也可以增加工作节点的数量。\n\n\
  可以在企业 DNS 域名服务器中创建 `CNAME` 记录，使用用户友好的域名（如 `api.domainname.com`）来掩盖创建专用负载均衡器时暴露的\
  \ `A` 记录：\n\n| A 记录 | CNAME |\n| --- | --- |\n| `<lb-name>.lb.anypointdns.net` |\
  \ `api.domainname.com` |\n| `internal-<lb-name>.lb.anypointdns.net` | `api-internal.domainname.com`\
  \ |\n\n表 9.7 - 专用负载均衡器 CNAME 和 A 记录映射\n\n部署在 Anypoint VPC 内私有端口（`8091` 和 `8092`）上的应用程序可以接收来自专用负载均衡器的流量。这意味着专用负载均衡器只能将流量路由到\
  \ Anypoint VPC 内私有端口上运行的应用程序：\n\n![图 9.16 - 专用负载均衡器架构](img/B19922_09_16.jpg)\n\n\
  图 9.16 - 专用负载均衡器架构\n\n### 允许列表 CIDR\n\n专用负载均衡器可以通过互联网接受来自外部或第三方应用程序的流量。我们可能需要允许来自某些\
  \ IP 范围的流量通过专用负载均衡器，并丢弃来自未获许可 IP 地址的流量。\n\n我们有 CIDR 允许列表选项，您可以在其中添加允许向专用负载均衡器发送流量的\
  \ IP 地址。默认情况下，允许所有外部流量，因为 CIDR 允许列表为 `0.0.0.0/0`。您需要确保移除默认的 CIDR 块 `0.0.0.0/0`，并添加允许的\
  \ IP 范围，以允许来自特定 IP 地址范围的外部流量：\n\n![图 9.17 - 专用负载均衡器允许列表](img/B19922_09_17.jpg)\n\
  \n图 9.17 - 专用负载均衡器允许列表\n\n在图 9.17 中，专用负载均衡器上允许的 IP 范围是 `192.168.0.0/16`。来自 IP 地址\
  \ `192.168.81.61` 的客户端请求被接受，而来自 `172.168.81.61` 的客户端请求被专用负载均衡器阻止，因为它不在允许列表中。\n\n\
  ### SSL 证书\n\n专用负载均衡器允许您添加多个域证书。专用负载均衡器**必须**至少关联一个域证书。\n\n图 9.18 显示，单个专用负载均衡器可以关联多个域\
  \ SSL 证书，并且在专用负载均衡器上配置的每个 SSL 证书都与一个或多个映射规则关联：\n\n![图 9.18 - 专用负载均衡器 SSL 证书和映射规则](img/B19922_09_18.jpg)\n\
  \n图 9.18 - 专用负载均衡器 SSL 证书和映射规则\n\n专用负载均衡器允许您配置通配符证书，以便支持子域请求。例如，如果专用负载均衡器上允许的域是\
  \ `*.domain.com`，则意味着它将允许任何子域，如 `app1.domain.com`、`app2.domain.com` 等。\n\n有关专用负载均衡器上\
  \ SSL 证书配置的更多详细信息，请参阅 MuleSoft 文档。\n\n### 双向认证\n\n专用负载均衡器提供额外的安全性，您可以上传客户端证书以启用双向认证：\n\
  \n![图 9.19 - 专用负载均衡器 – 双向认证](img/B19922_09_19.jpg)\n\n图 9.19 - 专用负载均衡器 – 双向认证\n\n\
  要允许更多客户端通过专用负载均衡器使用双向认证发送请求，请将客户端证书添加到专用负载均衡器现有的信任库中，如图 9.20 所示：\n\n![图 9.20 - 专用负载均衡器\
  \ – 双向认证](img/B19922_09_20.jpg)\n\n图 9.20 - 专用负载均衡器 – 双向认证\n\n私钥配置在服务端（服务端 `Keystore`）。它永远不会与任何人共享，并用于解密数据。服务端\
  \ `Keystore` 将包含服务端私钥和服务端公钥。公钥配置在客户端（客户端 `Truststore`），通常客户端存储服务端公共证书。它用于加密数据。\n\
  \n同样，`Keystore` 和 `Truststore` 也配置在客户端。`Keystore` 位于客户端，包含客户端私钥和公钥，而 `Truststore`\
  \ 仅包含服务端公钥。\n\n### 专用负载均衡器规模调整\n\n默认情况下，专用负载均衡器以两个工作节点的高可用性配置运行。每个工作节点的规格为 `2 vCores\
  \ + 3.5 GB` 内存。专用负载均衡器的其他规格有 4、6 和 8 个工作节点。使用轮询算法将请求分发给专用负载均衡器的工作节点。有时可能会使用另一种算法，根据流量负载将请求分发给专用负载均衡器的工作节点。\n\
  \n专用负载均衡器默认分配两个工作节点。在调整专用负载均衡器规模时，需要考虑以下几点：\n\n*   发往专用负载均衡器的请求数量。\n*   专用负载均衡器后端的下游\
  \ API 数量。\n*   下游 API 的响应时间。较长的响应时间意味着它将占用专用负载均衡器的资源。\n*   通过专用负载均衡器传递的传入请求中负载的大小。\n\
  \n在大多数情况下，两个工作节点将满足性能要求。然而，在某些情况下，您可能需要为专用负载均衡器配置更多工作节点以应对更高的流量。\n\n### 专用负载均衡器超时\n\
  \n默认情况下，专用负载均衡器响应超时为 `300 秒（5 分钟）`。这可以在 `Runtime Manager` 的专用负载均衡器配置中增加或减少。\n\n\
  ### 专用负载均衡器映射规则\n\n\n\n\n\n# 专用负载均衡器的映射规则\n\n映射规则与已在专用负载均衡器上配置的域证书相关联，每个域证书可以关联多个映射规则。如果存在多个规则匹配，传入专用负载均衡器的请求将始终执行第一个匹配的规则。\n\
  \n映射规则会转换传入请求的 URI，以将请求路由到部署在 Anypoint VPC 内 CloudHub 1.0 中的目标应用程序。在配置映射规则之前，需要了解以下几个参数：\n\
  \n*   **`inputUri` (输入路径)**：这是客户端请求的 URI —— 例如 `/{app}/`。\n*   **`appName` (目标应用)**：这是在\
  \ Anypoint VPC 内 CloudHub 1.0 中运行的 MuleSoft 应用程序。专用负载均衡器将根据传入请求的 URI 将请求路由至此。\n\
  *   **`appUri` (输出路径)**：这是传递给部署在 Anypoint VPC 内的目标应用程序的 URI 字符串。\n*   **`Protocol`\
  \ (协议)** —— 这是目标（下游）应用程序监听所用的协议。可以是 HTTP、HTTPS、WS 等。\n\n映射规则输入路径中花括号 (`{}`) 内定义的值为变量。这些变量不能用于输出路径，但可用于目标应用参数中的应用程序名称。\n\
  \n如果在专用负载均衡器上定义了多个映射规则，无论存在多少匹配规则，它始终会将第一个匹配的规则应用于传入请求。\n\n让我们了解如何在专用负载均衡器上定义映射规则。\n\
  \n## 示例 1\n\n应用程序名称可以包含在传入请求的 URL 中，并可用于将请求路由到部署在 CloudHub 1.0 中的应用程序。输入请求通过 [`api-dev.domainname.com/invoice-app-dev/v1.0/invoices`](https://api-dev.domainname.com/invoice-app-dev/v1.0/invoices)\
  \ 发送以获取发票。以下是配置的映射规则：\n\n| **输入路径** | **目标应用** | **输出路径** | **协议** |\n| --- | ---\
  \ | --- | --- |\n| `/{app}/` | `{app}` | `/` | `https` |\n\n表 9.8 - 专用负载均衡器映射规则\n\
  \n`{app}` 是变量，其值为 `invoice-app-dev`。HTTPS 是下游 API 的协议。因此，专用负载均衡器的映射规则会将 URL 转换为\
  \ [`mule-worker-internal-invoice-app-dev.us-e1.cloudhub.io:8092/v1.0/invoices`](https://mule-worker-internal-invoice-app-dev.us-e1.cloudhub.io:8092/v1.0/invoices)：\n\
  \n![图 9.21：带有映射规则的专用负载均衡器 URL 转换](img/B19922_09_21.jpg)\n\n图 9.21：带有映射规则的专用负载均衡器\
  \ URL 转换\n\n## 示例 2\n\n在*示例 1*中，我们了解了如何通过专用负载均衡器使用应用程序名称路由请求。\n\n在本示例中，我们将学习如何使用子域名路由请求。通常，每个环境都有不同的子域名。所有非生产环境将映射到非生产\
  \ Anypoint VPC，生产环境将映射到生产 Anypoint VPC：\n\n| **域** | **子域名** | **Anypoint VPC**\
  \ | **环境** |\n| --- | --- | --- | --- |\n| api-dev.subdomain.com | api-dev | VPC-1\
  \ | 开发 |\n| api-uat.subdomain.com | api-uat | VPC-1 | UAT |\n| api.subdomain.com\
  \ | api | VPC-2 | 生产 |\n\n表 9.9 - API 域\n\n让我们考虑以下映射规则，它们已配置为将请求路由到部署在 CloudHub\
  \ 1.0 中的应用程序。输入请求通过 [`api-dev.domainname.com/invoice/v1.0/invoices`](https://api-dev.domainname.com/invoice/v1.0/invoices)\
  \ 发送以获取发票。这是配置的映射规则：\n\n| **输入路径** | **目标应用** | **输出路径** | **协议** |\n| --- | ---\
  \ | --- | --- |\n| `/{app}/` | `{app}-{subdomain}` | `/` | `https` |\n\n表 9.10 -\
  \ 专用负载均衡器映射规则\n\n`{app}` 是变量，值为 `invoice`，`{subdomain}` 为 `api-dev`。HTTPS 是下游 API\
  \ 的协议。因此，专用负载均衡器映射规则会将 URL 转换为 [`mule-worker-internal-invoice-api-dev.us-e1.cloudhub.io:8092/v1.0/invoices`](https://mule-worker-internal-invoice-api-dev.us-e1.cloudhub.io:8092/v1.0/invoices)：\n\
  \n![图 9.22 - 带有映射规则的专用负载均衡器 URL 转换](img/B19922_09_22.jpg)\n\n图 9.22 - 带有映射规则的专用负载均衡器\
  \ URL 转换\n\n## HTTP 入站模式\n\n专用负载均衡器上的一项关键配置决定了如何路由传入的 HTTP 请求。它可以接受 HTTP 或 HTTPS\
  \ 请求，静默丢弃 HTTP 请求，或将请求重定向到下游 API 的 HTTPS。\n\n可以在专用负载均衡器上配置以下选项，以确保接受传入流量并将其发送到下游\
  \ API：\n\n*   **`Off` (关闭)**：专用负载均衡器将静默丢弃所有传入的 HTTP 流量，仅接受 HTTPS 请求。\n*   **`On`\
  \ (开启)**：专用负载均衡器将在默认 SSL 端点上接受传入的 HTTP 请求。\n*   **`Redirect` (重定向)**：专用负载均衡器将始终通过\
  \ HTTPS 将流量路由到下游 API。\n\n## 建议\n\n以下是在配置专用负载均衡器时可遵循的一些建议：\n\n*   与 Anypoint VPC\
  \ 关联的所有环境都将映射到专用负载均衡器。这意味着单个专用负载均衡器可以将请求路由到多个环境。\n*   多个 CNAME 可以映射到单个专用负载均衡器或单个\
  \ A 记录，例如开发环境的 `api-dev.domainname.com`、QA 环境的 `api-uat.domainname.com` 和生产环境的 `api.domainname.com`。\n\
  *   始终为生产环境和沙箱环境创建单独的负载均衡器。\n\n让我们看看专用负载均衡器和共享负载均衡器的区别：\n\n| **功能** | **共享负载均衡器**\
  \ | **专用负载均衡器** |\n| --- | --- | --- |\n| 自定义域 | 不支持 | 支持 |\n| 自定义证书 | 不支持 | 支持\
  \ |\n| 双向认证 | 不支持 | 支持 |\n| 白名单 CIDR | 不支持 | 支持 |\n| 速率限制 | 适用 | 不适用 |\n\n表 9.11\
  \ - 共享负载均衡器与专用负载均衡器对比\n\n## 用于公共和私有流量的专用负载均衡器\n\n部署到 Runtime Manager 的 API 可能会接收来自外部和内部消费者的流量。出于安全原因，可能需要保护某些\
  \ API 免受外部消费者访问，或不为这些 API 提供外部访问。建议为私有和公共流量分别设置独立的专用负载均衡器。我们可能需要某些 API 仅内部可访问，或者某些\
  \ API 面向公众。在这里，我们将看到一个 API 主导连接的示例，其中体验 API 必须是公开 API，而流程 API 和系统 API 必须是私有 API。\n\
  \n有多种解决方案可实现这一点：\n\n*   单个专用负载均衡器用于公共和私有 API\n*   单独的专用负载均衡器分别用于公共和私有 API\n\n###\
  \ 方法 1 – 单个专用负载均衡器用于公共和私有 API\n\n在此方法中，我们将设置一个专用负载均衡器，它将提供两个 **A** 记录：`<lb-name>.lb.anypointdns.net`（接受外部流量）和\
  \ `internal-<lb-name>.lb.anypointdns.net`（接受私有本地网络流量）。您可以在专用负载均衡器上上传多个证书，并创建指向这些\
  \ **A** 记录的 CNAME 记录。\n\n以下是 DNS 注册表中 CNAME 和 A 记录映射的示例：\n\n*   `api.domainname.com`\
  \ => `<lb-name>.lb.anypointdns.net` (A 记录)\n\n\n\n\n### 方法 2 – 为公共 API 和私有 API 分别使用专用负载均衡器\n\
  \n`api-internal.domainname.com` => `internal-<lb-name>.lb.anypointdns.net` (A record)\n\
  \n每个证书将拥有其自己的映射规则。您可以创建映射规则，当请求通过 `api.domainname.com` 到达时将流量导向公共应用程序，以及另一组映射规则，当请求通过\
  \ `api-internal.domainname.com` 到达时将流量导向私有应用程序。当专用负载均衡器接收到请求时，它会在请求中查找主机标头，以根据证书端点和后续映射规则匹配请求。例如，假设公共请求通过\
  \ `http://api.domainname.com` 从客户端发送到专用负载均衡器。在这种情况下，标头中的主机值将为 `api.domainname.com`，专用负载均衡器将根据主机匹配证书并应用后续映射规则。流量将被转发给\
  \ API。\n\n为公共和私有流量使用单个专用负载均衡器的问题在于：当恶意行为者使用修改后的主机标头，通过专用负载均衡器的公共域名以此为目标访问私有应用程序时，就会出现该问题。\n\
  \n例如，恶意行为者可以发送请求到 `api-internal.domainname.com`，并将主机标头设置为 `api-internal.domainname.com`。此请求将匹配私有证书并执行后续映射规则，从而允许通过专用负载均衡器的公共域名访问私有应用程序：\n\
  \n![图 9.23 - 用于公共和私有 API 的单个专用负载均衡器](img/B19922_09_23.jpg)\n\n图 9.23 - 用于公共和私有 API\
  \ 的单个专用负载均衡器\n\n在图 9.23 中，您可以看到恶意行为者如何通过发送主机值 `api.domainname.com`，经由专用负载均衡器的公共域名访问私有应用程序。另一个问题是允许列表\
  \ CIDR 对专用负载均衡器是全局的。如果相同的允许列表 CIDR 同时应用于专用负载均衡器的公共域和私有域，则无法添加特定的私有 IP 范围。要做到这一点，您需要移除\
  \ `0.0.0.0/0`，这意味着将不允许公共流量。\n\n为克服使用单个专用负载均衡器的问题，您应该为公共 API 和私有 API 使用单独的专用负载均衡器。采用此方法，您必须在单独的专用负载均衡器中为私有域和公共域配置单独的证书，并使用唯一的映射规则。除此之外，您可以为两个专用负载均衡器配置单独的允许列表\
  \ CIDR：\n\n*   **专用负载均衡器（公共）和允许列表 CIDR (`0.0.0.0/0`)**：允许所有人访问。\n*   **专用负载均衡器（私有）和允许列表\
  \ CIDR (`192.168.1.0/24`, `10.0.1.0/22`)**：允许访问私有 IP 地址范围：\n\n![图 9.24 - 为公共和私有\
  \ API 分别使用专用负载均衡器](img/B19922_09_24.jpg)\n\n图 9.24 - 为公共和私有 API 分别使用专用负载均衡器\n\n\
  恶意行为者使用公共专用负载均衡器访问私有 API 的请求将被阻止，因为没有证书与公共专用负载均衡器的主机标头匹配。公共和私有专用负载均衡器的允许列表 CIDR\
  \ 是分开的。这意味着您可以完全阻止公共流量，并仅允许来自特定私有 IP 地址范围的流量访问私有专用负载均衡器。\n\n# 将 MuleSoft 应用程序部署到\
  \ CloudHub 1.0 Runtime Manager 的不同选项\n\nMuleSoft 提供了多种将应用程序部署到 CloudHub 1.0 的方式，所有这些方式都可以与\
  \ CI/CD 流水线集成，以实现 MuleSoft 应用程序到 CloudHub 1.0 的自动部署。让我们探讨一下将应用程序部署到 CloudHub 1.0\
  \ 的所有方式。\n\n## Mule Maven 插件\n\nMule Maven 插件是用于将 MuleSoft 应用程序部署、取消部署和打包到 CloudHub\
  \ 1.0 的最重要的 Maven 插件之一。让我们更详细地讨论 Mule Maven 插件。可以在应用程序的 `POM.xml` 文件中配置以下插件，其中包含在\
  \ CloudHub 1.0 中部署和运行应用程序所需的所有属性：\n\n```xml\n<plugin>\n  <groupId>org.mule.tools.maven</groupId>\n\
  \  <artifactId>mule-maven-plugin</artifactId>\n  <version>3.8.6</version>\n  <extensions>true</extensions>\n\
  \  <configuration>\n    <cloudHubDeployment>\n      <uri>https://anypoint.mulesoft.com</uri>\n\
  \      <muleVersion>${app.runtime}</muleVersion>\n      <username>${anypoint.username}</username>\n\
  \      <password>${anypoint.password}</password>\n      <applicationName>${application.name}</applicationName>\n\
  \      <environment>${mule.environment}</environment>\n      <region>${mule.region}</region>\n\
  \      <workers>${mule.workers}</workers>\n      <workerType>${mule.workerType}</workerType>\n\
  \      <properties>\n        <key>value</key>\n      </properties>\n    </cloudHubDeployment>\n\
  \  </configuration>\n</plugin>\n```\n\n在前面的 Mule Maven 插件中，使用 `${}` 定义的值是您可以在 `mule\
  \ deploy` 命令中传递的参数，如下所示：\n\n```\nmule deploy –DmuleDeploy -Dapp.runtime=4.3.0 -Danypoint.username=anypointusername\
  \ –Danypoint.password=password -Dapplication.name=music-api-dev –Dmule.environment=Sandbox\
  \ –Dmule.workers=1 –Dmule.workerType=MICRO\n```\n\n以下是在将应用程序部署到 CloudHub 1.0 时可以在\
  \ Mule Maven 插件中配置的属性：\n\n| 属性 | 描述 | 是否必需 | 默认值 / 示例 |\n| --- | --- | --- | ---\
  \ |\n| `cloudHubDeployment` | 根元素。 | 是 | |\n| `uri` | 您的 Anypoint Platform URI。\
  \ | 否 | |\n| `muleVersion` | 在 CloudHub 2.0 实例中运行的 Mule 运行时引擎版本。 | 是 | 例如，`4.3.0`\
  \ |\n| `username` | CloudHub 用户名。 | 仅当使用 Anypoint Platform 凭据登录时 | |\n| `password`\
  \ | CloudHub 密码。 | 仅当使用 Anypoint Platform 凭据登录时 | |\n| `applicationName` | 要在 Runtime\
  \ Manager 中实现的应用程序标题。 | 是 | |\n| `artifact` | 要部署的 JAR 文件的绝对路径。 | 否 | |\n| `environment`\
  \ | 将部署应用程序的 CloudHub 环境。 | 是 | |\n| `properties` | 可以传递在应用程序部署期间需要设置的属性。 | 否 |\
  \ |\n| `workers` | 工作器数量。 | 否 | `1` |\n| `workerType` | 每个工作器的大小。 | 否 | `MICRO`\
  \ |\n| `region` | 工作器云的区域。 | 否 | `us-e1` |\n| `objectStoreV2` | 启用 Object Store\
  \ V2。 | 否 | `true` |\n| `persistentQueues` | 启用持久队列。 | 否 | `false` |\n| `businessGroup`\
  \ | 部署的业务组路径。 | 否 | |\n| `businessGroupId` | 业务组 ID 或组织。 | 否 | |\n| `deploymentTimeout`\
  \ | 部署过程允许的持续时间（以毫秒为单位）。这指的是从部署开始到确认工件成功部署之间的时间。 | 否 | `1000000` |\n| `server` |\
  \ Maven 服务器与 Anypoint Platform 凭据集成。服务器 ID 可以在 `settings.xml` 文件中找到，该文件关联了用户的 Anypoint\
  \ 用户名和密码。 | 否 | |\n| `skip` | 启用时，它会跳过插件的部署目标。 | 否 | `false` |\n| `skipDeploymentVerification`\
  \ | 启用时，它会跳过对已部署应用程序状态的确认。 | 否 | `false` |\n| `authToken` | 指定用于访问平台的授权令牌。 | 仅当使用授权令牌登录时\
  \ | |\n\n\n\n\n### 表 9.12 - Mule Maven 插件属性\n\n| 属性 | 说明 | 条件 | 默认值 |\n| --- | ---\
  \ | --- | --- |\n| `connectedAppClientId` | 指定连接应用 ClientID 值。 | 仅当使用连接应用凭据登录时 |\
  \  |\n| `connectedAppClientSecret` | 指定连接应用客户端密钥。 | 仅当使用连接应用凭据登录时 |  |\n| `connectedAppGrantType`\
  \ | 指定唯一支持的连接类型：客户端凭据。 | 仅当使用连接应用凭据登录时 |  |\n| `applyLatestRuntimePatch` | 启用后，应用程序将首先更新至最新版本的\
  \ Mule Runtime，然后再部署到 CloudHub。 | 否 | `false` |\n| `disableCloudHubLogs` | 设置为 `true`\
  \ 时，此功能将禁用 CloudHub 日志。 | 否 | `false` |\n\n有关 Mule Maven 插件的更多详细信息，请参阅 MuleSoft\
  \ 文档：<https://docs.mulesoft.com/mule-runtime/4.5/mmp-concept>。\n\n可以使用以下命令来部署和取消部署应用程序：\n\
  \n```\nmvn clean deploy –DmuleDeploy\nmvn mule:undeploy\n```\n\nMule Maven 插件可以使用以下身份验证机制之一将应用程序部署到\
  \ CloudHub 1.0：\n\n*   Anypoint Platform 用户名和密码\n*   服务器\n*   Anypoint 连接应用\n* \
  \  认证令牌\n\n## Anypoint CLI\n\nAnypoint CLI 可用于将 MuleSoft 应用程序部署、取消部署或重新部署到 CloudHub\
  \ 1.0。Anypoint CLI 是 Anypoint Platform 的脚本编写和命令行工具。Anypoint CLI 可以管理 Anypoint Platform\
  \ 的各种功能，例如 CloudHub 1.0、API 治理、Anypoint 专用负载均衡器、Anypoint VPC、Exchange、Design Center\
  \ 和 API Manager。要使用 Anypoint CLI，您需要设置 Anypoint CLI 的 npm 包。\n\n以下是 MuleSoft 提供的用于设置\
  \ Anypoint CLI 的文档：<https://docs.mulesoft.com/anypoint-cli/4.x/install>。\n\nAnypoint\
  \ CLI 可以使用以下身份验证机制之一来管理 Anypoint Platform：\n\n*   Anypoint Platform 用户名和密码\n*  \
  \ 客户端 ID 和客户端密钥\n*   Bearer 令牌 – 仅限命令行\n\n可在 MuleSoft 文档中找到用于管理 CloudHub 1.0 的命令列表：<https://docs.mulesoft.com/anypoint-cli/4.x/cloudhub-apps>。\n\
  \n可以使用以下命令将应用程序部署到 CloudHub 1.0：\n\n```\nruntime-mgr:cloudhub-application:deploy\
  \ <name> <zipfile> [flags]\n```\n\n可以将以下标志与此命令一起传递：\n\n### 表 9.13 - 用于将应用程序部署到 CloudHub\
  \ 1.0 的 Anypoint CLI 属性\n\n| 标志 | 说明 | 默认值 |\n| --- | --- | --- |\n| `--runtime`\
  \ | 提供运行时环境的名称和版本。 |  |\n| `--workers` | 工作节点数量。 | `1` |\n| `--workerSize` | 工作节点的大小（以\
  \ vCore 为单位）。 | `0.1` |\n| `--region` | 区域名称。 | `us-east-1` |\n| `--property` |\
  \ 设置属性（`name:value`）——例如，`--property \"https.port:8082\"`。 |  |\n| `--propertiesFile`\
  \ | 此文件中的所有属性都应被其对应的值覆盖。请确保在本地硬盘上指定属性文件的绝对路径。 |  |\n| `--[no-]persistentQueues`\
  \ | 启用或禁用持久队列。 | `disabled` |\n| `--[no-]persistentQueuesEncrypted` | 启用或禁用持久队列加密。\
  \ |  |\n| `--[no-]staticIPsEnabled` | 启用或禁用静态 IP。 | `disabled` |\n| `--[no-]objectStoreV1`\
  \ | 启用或禁用对象存储 V1。 |  |\n| `--[no-]objectStoreV2` | 启用或禁用对象存储 V2。 |  |\n| `--[no-]autoRestart`\
  \ | 应用程序在无响应时将自动重启。 | `enabled` |\n| `--output` | 指定响应所需的格式。可用选项为 `table` 和 `json`。\
  \ | `table` |\n| `--help` | 输出用法信息。 |  |\n| `--timeout` | 设置超时值（以毫秒为单位）。此值应在 `60000`\
  \ 到 `300000` 之间。 |  |\n\n有关用于将应用程序部署到 CloudHub 1.0 的 Anypoint CLI 的更多详细信息，请参阅 MuleSoft\
  \ 文档：<https://docs.mulesoft.com/anypoint-cli/4.x/cloudhub-apps>。\n\n## CloudHub\
  \ 1.0 API\n\nCloudHub 1.0 API 允许您部署和管理 MuleSoft 应用程序。您可以部署 MuleSoft 应用程序、管理计划和队列，并查看有关应用程序的日志。以下是\
  \ MuleSoft 提供的用于将应用程序部署到 CloudHub 1.0 的 REST API：\n\n### 表 9.14 - 用于将应用程序部署到 CloudHub\
  \ 1.0 的 Platform API 属性\n\n| 属性 | 值 |\n| --- | --- |\n| **方法** | `POST` |\n| **API\
  \ 端点** | <https://anypoint.mulesoft.com/cloudhub/api/v2/applications> |\n| **请求体**\
  \ | 请参阅下方的 JSON 示例 |\n| **认证** | Basic 或 OAuth 2.0（连接应用或 Anypoint 用户名和密码） |\n| **请求头**\
  \ | `X-ANYPNT-ENV-ID`（Anypoint Platform 的环境 ID），`Content-Type`（`application/json`）\
  \ |\n\n请求体示例：\n\n```\n{\n  \"domain\": \"api-dev\",\n  \"muleVersion\": {\n    \"\
  version\": \"4.4.0\"\n  },\n  \"region\": \"us-east-1\",\n  \"monitoringEnabled\"\
  : true,\n  \"monitoringAutoRestart\": true,\n  \"workers\": {\n    \"amount\": 2,\n\
  \    \"type\": {\n      \"name\": \"Medium\",\n      \"weight\": 1,\n      \"cpu\"\
  : \"1 vCore\",\n      \"memory\": \"1.5 GB memory\"\n    }\n  },\n  \"loggingNgEnabled\"\
  : true,\n  \"persistentQueues\": true,\n  \"objectStoreV1\": true\n}\n```\n\n有关将应用程序部署到\
  \ CloudHub 1.0 的 API 请求的更多详细信息，请访问 Anypoint Platform 开发者门户：<https://anypoint.mulesoft.com/exchange/portals/anypoint-platform/f1e97bc6-315a-4490-82a7-23abe036327a.anypoint-platform/cloudhub-api/>。\n\
  \n# 摘要\n\n在本章中，我们探讨了 CloudHub 1.0 提供的功能和特性，以及如何利用它们来运行和管理 MuleSoft 应用程序。我们研究了各种功能，例如高可用性、容错性、可扩展性和灾难恢复。此外，我们了解了\
  \ Anypoint VPC，它允许我们在 CloudHub 1.0 内创建隔离且独立的网络段。我们还理解了 Anypoint VPC 的重要性。此外，我们探讨了不同的网络连接选项，包括\
  \ VPC 对等连接、VPN IPsec 隧道、AWS Direct Connect 和传输网关附件，这些选项使我们能够连接防火墙后面或公有/私有云上的资源。此外，我们学习了如何利用\
  \ Mule Maven 插件、Anypoint CLI 和 Platform API 在 CloudHub 1.0 环境中部署 MuleSoft 应用程序。\n\
  \n在下一章中，我们将讨论 CloudHub 2.0，它允许我们在基于 Kubernetes 的容器化环境中运行 MuleSoft 应用程序。\n\n# 延伸阅读\n\
  \nCloudHub 1.0 参考列表包含以下来源：\n\n*   MuleSoft 文档：CloudHub 架构 | MuleSoft 文档\n*   YouTube\
  \ 系列：<https://youtube.com/playlist?list=PL5GwZHHgKcuDQ6vWarTLgVbrPEQipzbOM&si=xKjv6f7f10VRkyjg>\n\
  *   Medium 文章：Anypoint Virtual Private Cloud、Virtual Private Network 和 Dedicated\
  \ Load Balancer 库及资源 | 作者：Jitendra Bafna | Medium\n*   本章中的一些表格参考自 MuleSoft 官方文档：<https://docs.mulesoft.com/>\n"
- "# 10\n\n\n\n\n\n# 使用 Anypoint iPaaS (CloudHub 2.0) 实现无忧部署\n\n在*第 9 章*中，我们了解了 CloudHub\
  \ 1.0 的功能和特性。在本章中，我们将学习 CloudHub 2.0 为管理 MuleSoft 应用程序提供的架构能力。本章还将介绍 CloudHub 2.0\
  \ 与 CloudHub 1.0 的区别。\n\n本章将涵盖以下主题：\n\n*   什么是 CloudHub 2.0？\n*   CloudHub 2.0 提供了哪些不同的能力？\n\
  *   CloudHub 2.0 的架构能力\n*   网络和托管选项，如私有空间和共享空间\n*   使用 CloudHub 2.0 实现高可用性、可扩展性、容错性和灾难恢复\n\
  \n## 什么是 CloudHub 2.0？\n\n我们在*第 9 章*中了解了 CloudHub 1.0。在本章中，我们将学习 MuleSoft 提供的另一种托管选项（即\
  \ CloudHub 2.0），用于独立且安全地运行应用程序。\n\nCloudHub 2.0 是一种基于云的**集成平台即服务**，类似于 CloudHub\
  \ 1.0。它是一种托管的多租户服务，分布在全球 12 个区域，用于在基于 Kubernetes 的容器化环境中运行 MuleSoft 应用程序。\n\nCloudHub\
  \ 2.0 本质上具有弹性；可按需扩展。您可以从较小的工作负载开始，并根据需要进行扩展。这可以在应用程序或 API 不出现任何停机时间的情况下实现。\n\n###\
  \ 为什么选择 CloudHub 2.0？\n\n选择 CloudHub 2.0 有多种原因，列举如下：\n\n*   CloudHub 2.0 采用基于 Kubernetes\
  \ 的架构，使您能够实现基于容器的应用程序隔离。部署到 CloudHub 2.0 的每个应用程序都在单独的容器中运行，且相互独立。\n*   它简化了网络，以实现与本地数据中心、**Amazon\
  \ Virtual Private Cloud (VPC)** 以及 **Azure** 或 **Google Cloud Platform (GCP)** 等其他云的连接。\n\
  *   它支持入站防火墙规则和出站防火墙规则，您可以为每个私有空间设置最多 80 条入站和 80 条出站防火墙规则。它提供了更好的防火墙控制。\n*   它提供开箱即用的安全性，允许所有内部服务安全地相互通信，并使用加密密钥保护敏感数据。\n\
  *   它支持为部署到 CloudHub 2.0 的单个应用程序配置多个公共端点。\n*   它支持开箱即用的入口负载均衡器，将流量路由到部署在 CloudHub\
  \ 2.0 上的应用程序。入口负载均衡器会根据工作负载自动扩展。\n*   它拥有动态可扩展的基础设施，并内置服务以支持大容量。\n\n以下是 CloudHub\
  \ 2.0 提供的功能列表：\n\n*   可部署在私有空间或共享空间中。\n*   提供基于容器的应用程序隔离。\n*   在全球 12 个区域可用。\n*\
  \   可部署在多个副本上以实现高可用性和容错性。\n*   提供更细粒度的虚拟核心 (vCore) 选项；每个副本最多可分配四个 vCore。\n*   支持集群模式部署；启用集群至少需要两个副本。\n\
  *   支持滚动更新和重新创建部署模型。\n*   通过增加副本数量实现水平扩展，通过增加 vCore 数量实现垂直扩展。入口负载均衡器根据工作负载自动扩展。\n\
  *   支持智能修复和零停机更新等功能。\n*   每个配置最多存储 200 MB 的日志数据，或存储长达 30 天，以先达到的限制为准。\n\n让我们更详细地讨论\
  \ CloudHub 2.0 提供的几项功能。\n\n### 副本和副本大小\n\n副本是一个专用实例，您可以在其中于容器化环境中运行 MuleSoft 应用程序。副本大小是在部署期间为应用程序配置的内存和存储量。它有多种规格，如下所列：\n\
  \n| vCore 大小 | 总内存 (GB) | 堆内存 (GB) | 存储 (GB) |\n|------------|-------------------|------------------|--------------|\n\
  | 0.1        | 1.2               | 0.6              | 8            |\n| 0.2    \
  \    | 2                 | 1                | 8            |\n| 0.5        | 2.6\
  \               | 1.3              | 10           |\n| 1          | 4          \
  \       | 2                | 12           |\n| 1.5        | 6                 |\
  \ 3                | 20           |\n| 2          | 8                 | 4      \
  \          | 20           |\n| 2.5        | 9.5               | 4.75           \
  \  | 20           |\n| 3          | 11                | 5.5              | 20  \
  \         |\n| 3.5        | 13                | 6.5              | 20          \
  \ |\n| 4          | 15                | 7.5              | 20           |\n\n表 10.1\
  \ - 副本规格\n\nvCore 少于 1 的副本为小型工作负载提供有限的 CPU 和 I/O。要以稳定的性能处理较大的工作负载，请在应用程序中使用更多的 vCore。\n\
  \n### 区域\n\nCloudHub 2.0 目前允许您在全球 12 个区域部署应用程序。组织可以在靠近其企业数据中心或系统的 CloudHub 2.0 区域部署应用程序。\n\
  \n以下是美国区域控制平面的 DNS 记录：\n\n| 区域 | DNS 记录 |\n|--------|------------|\n| 美国东部 (弗吉尼亚北部)\
  \ | `<appName>-<uniqId>.<shard>.usa-e1.cloudhub.io` |\n| 美国东部 (俄亥俄) | `<appName>-<uniqId>.<shard>.usa-e2.cloudhub.io`\
  \ |\n| 美国西部 (加利福尼亚北部) | `<appName>-<uniqId>.<shard>.usa-w1.cloudhub.io` |\n| 美国西部\
  \ (俄勒冈) | `<appName>-<uniqId>.<shard>.usa-w2.cloudhub.io` |\n| 加拿大 (中部) | `<appName>-<uniqId>.<shard>.can-c1.cloudhub.io`\
  \ |\n| 南美洲 (圣保罗) | `<appName>-<uniqId>.<shard>.bra-s1.cloudhub.io` |\n| 亚太地区 (新加坡)\
  \ | `<appName>-<uniqId>.<shard>.sgp-s1.cloudhub.io` |\n| 亚太地区 (悉尼) | `<appName>-<uniqId>.<shard>.aus-s1.cloudhub.io`\
  \ |\n| 亚太地区 (东京) | `<appName>-<uniqId>.<shard>.jpn-e1.cloudhub.io` |\n| 欧盟 (爱尔兰)\
  \ | `<appName>-<uniqId>.<shard>.irl-e1.cloudhub.io` |\n| 欧盟 (法兰克福) | `<appName>-<uniqId>.<shard>.deu-c1.cloudhub.io`\
  \ |\n| 欧盟 (伦敦) | `<appName>-<uniqId>.<shard>.gbr-e1.cloudhub.io` |\n\n表 10.2 - CloudHub\
  \ 2.0 区域\n\n以下是美国政府区域控制平面的 DNS 记录：\n\n| 区域 | DNS 记录 |\n|--------|------------|\n\
  | 美国政府西部 | `<appName>-<uniqId>.<shard>.usg-w1.gov.cloudhub.io` |\n\n表 10.3 - CloudHub\
  \ 2.0 美国政府区域\n\n以下是欧盟区域控制平面的 DNS 记录：\n\n| 区域 | DNS 记录 |\n|--------|------------|\n\
  | 欧盟 (爱尔兰) | `<appName>-<uniqId>.<shard>.irl-e1.eu1.cloudhub.io` |\n| 欧盟 (法兰克福)\
  \ | `<appName>-<uniqId>.<shard>.deu-c1.eu1.cloudhub.io` |\n\n表 10.4 - CloudHub 2.0\
  \ 欧盟控制平面区域\n\n在这些记录中，`uniq-id` 是附加在应用程序名称后的 6 位数值，以确保唯一性，例如 `b9cdfr`；`shard` 是与应用程序部署所在的私有空间关联的\
  \ 6 位数值，例如 `p7oprc`。但是，对于共享空间，`shard` 将是一个 6 位数值后跟一个连字符 (`-`) 和数字，例如 `r7oprb-2`。\n\
  \n### 集群\n\nCloudHub 2.0 支持集群，并提供可扩展性、工作负载分发和可靠性。部署在多个副本上的应用程序允许我们在将应用程序部署到 CloudHub\
  \ 2.0 时启用集群。启用集群后，同一应用程序的副本可以共享对象存储和 VM 队列，副本可以在同一应用程序内共享数据。在副本之间启用集群至少需要两个副本：\n\
  \n![图 10.1 - CloudHub 2.0 中的 Anypoint 集群](img/B19922_10__1.jpg)\n\n图 10.1 - CloudHub\
  \ 2.0 中的 Anypoint 集群\n\n### 高可用性\n\n\n\n\n# CloudHub 2.0\n\nCloudHub 2.0 允许您部署高可用应用程序并确保业务连续性。在多个副本上部署应用程序将创建多个应用程序实例，这将确保在一个或多个副本崩溃或发生故障时应用程序的高可用性。\n\
  \n## 应用程序隔离\n\nCloudHub 2.0 通过将应用程序部署到单独的容器中来提供应用程序隔离。应用程序的每个副本将在单独的容器中运行。这将确保一个副本中的问题不会影响其他副本，并且所有副本相互独立。\n\
  \n## 智能修复\n\n部署到 CloudHub 2.0 的应用程序可能会因底层硬件故障而失败；在这种情况下，副本会自动恢复，因为它支持自愈合机制。如果副本因代码问题或内存问题而崩溃，平台将自动识别该问题并自动重新部署副本。\n\
  \n## 零停机更新\n\nCloudHub 2.0 支持两种部署模型——滚动更新和重建：\n\n*   滚动更新模型允许您通过增量更新副本，以零停机时间部署应用程序\n\
  *   重建部署模型首先终止旧副本，然后部署新副本\n*   滚动更新模型确保旧应用程序副本可用，直到新应用程序重新部署完成\n*   重建模型比滚动更新模型更快，可用于您可以接受停机时间部署应用程序或部署新应用程序的场景\n\
  \n## 可扩展性\n\n应用程序前端的入口负载均衡器会根据应用程序工作负载自动扩缩容，它是一项完全托管的服务。在 CloudHub 2.0 中运行的应用程序可以通过增加工作节点数量和工作节点规模来分别进行水平和垂直扩展。\n\
  \n## 支持的 Mule 运行时\n\nMule 运行时引擎允许您运行 MuleSoft 应用程序，并支持域和策略。CloudHub 2.0 支持 Mule\
  \ 运行时引擎 4.3x 到 4.4x 版本。不支持 Mule 3.x。在 CloudHub 2.0 上部署应用程序期间，它会自动从存储库中拉取所选版本的 Docker\
  \ 镜像。\n\n## 精细 vCore 选项\n\nCloudHub 2.0 支持在部署应用程序时配置精细的 vCore。可分配给副本的最小 vCore 数为\
  \ 0.1，最大为 4。可分配给副本的其他 vCore 规格有 0.2、0.5、1、1.5、2、2.5、3 和 3.5。\n\n## Object Store\
  \ v2\n\nObject Store v2 允许部署到 CloudHub 2.0 的应用程序存储数据，并共享批处理流程、Mule 应用程序和组件的状态，无论是在应用程序内部还是通过使用\
  \ Object Store REST API。以下是 Object Store v2 提供的功能列表：\n\n*   它将与您的工作节点位于同一区域。\n*\
  \   它允许无限数量的条目。对 Object Store 的总大小没有限制。\n*   每个条目在键值对中存储单个值，大小上限为 10 MB（Base64 编码后）。\n\
  *   它在所有区域和可用区均可用。\n*   它提供 MuleSoft Object Store 连接器用于检索和存储数据。\n*   外部应用程序可以使用\
  \ Object Store REST API v2 访问其他 MuleSoft 应用程序中可用的对象存储。\n*   Object Store REST API\
  \ v2 支持连接应用程序使用 API 向 Anypoint Platform 进行身份验证。\n\n![图 10.2 - CloudHub 2.0 与本地 Mule\
  \ Runtime 之间访问 Object Store v2](img/B19922_10__2.jpg)\n\n图 10.2 - CloudHub 2.0 与本地\
  \ Mule Runtime 之间访问 Object Store v2\n\n在图 10.2 中，部署到 CloudHub 2.0 并带有 Object Store\
  \ v2 的 MuleSoft 应用程序可以使用 Object Store 连接器组件来存储和检索数据。\n\n部署到本地 Mule 运行时的应用程序，或任何外部应用程序，均可使用\
  \ REST API v2 访问 Object Store。\n\n## 管理调度器\n\nCloudHub 2.0 允许您管理和查看已部署应用程序的 Mule\
  \ 流中配置的调度器组件。从 Runtime Manager 中，使用应用程序中的 **Schedule（调度器）** 选项卡来查看调度器的频率、更改调度器的频率，或启用/禁用调度器，而无需更改或重新部署正在运行的应用程序。\n\
  \n可以从 **Schedule（调度器）** 选项卡执行各种其他任务，如下所示：\n\n*   您可以随时触发作业，而不管应用程序上设置了什么计划，也无需修改调度器\n\
  *   如果调度器应用程序连接的底层系统需要维护，可禁用调度器\n*   调度器可随时更新，无需修改或重新部署应用程序\n\n图 10.3 展示了如何在 CloudHub\
  \ 2.0 应用程序设置中更新调度器：\n\n![图 10.3 - 管理 CloudHub 2.0 应用程序的调度器](img/B19922_10__3.jpg)\n\
  \n图 10.3 - 管理 CloudHub 2.0 应用程序的调度器\n\n## 最后一公里安全\n\n部署在共享空间中的应用程序支持最后一公里安全。最后一公里安全可实现入口与部署在工作节点上的应用程序之间通过\
  \ HTTPS 进行通信。部署到 CloudHub 2.0 的应用程序支持 HTTP 流量的单个监听器端口，即 8081，同时用于 HTTP 和 HTTPS 工作负载。该选项可在\
  \ Runtime Manager 控制台的 **Ingress（入口）** 选项卡下启用：\n\n![图 10.4 - CloudHub 2.0 中的最后一公里安全](img/B19922_10__4.jpg)\n\
  \n图 10.4 - CloudHub 2.0 中的最后一公里安全\n\n图 10.5 展示了如何在 Runtime Manager 中为部署到 CloudHub\
  \ 2.0 的应用程序启用最后一公里安全：\n\n![图 10.5 - 在 CloudHub 2.0 中为应用程序启用最后一公里安全](img/B19922_10__5.jpg)\n\
  \n图 10.5 - 在 CloudHub 2.0 中为应用程序启用最后一公里安全\n\nCloudHub 2.0 支持共享空间和私有空间，用于在容器化环境中部署和运行\
  \ MuleSoft 应用程序。让我们探讨一下共享空间和私有空间。\n\n# 共享空间\n\n共享空间使您能够在多租户环境中运行 Mule 实例。CloudHub\
  \ 2.0 在每个区域提供一个共享空间来部署您的 MuleSoft 应用程序。\n\n以下情况适合使用共享空间：\n\n*   您没有使用自定义域名的要求，可以继续使用\
  \ cloudhub.io\n*   您不需要使用自定义证书和自定义域名\n*   您不想访问位于本地数据中心或私有/公有云中的资源、服务或数据库\n*   您没有在与公有云隔离的环境中运行应用程序的要求\n\
  \n如果以下任何情况适用于您，则不应使用共享空间：\n\n*   您希望在单租户环境或隔离模式下运行应用程序\n*   您需要使用自定义域名\n*   您需要自定义证书\n\
  *   您需要私有端点\n*   您需要连接到位于本地数据中心或私有/公有云中的资源、服务或数据库\n\n图 10.6 展示了共享空间的高级架构：\n\n![图\
  \ 10.6 - 共享空间高级架构](img/B19922_10__6.jpg)\n\n图 10.6 - 共享空间高级架构\n\n# 私有空间\n\n私有空间是\
  \ CloudHub 2.0 中一个虚拟、私有且隔离的空间，用于运行您的 MuleSoft 应用程序。您可以在 CloudHub 2.0 的单个或多个区域中为单个或多个业务组创建多个私有空间。需要为私有空间中的应用程序指定一范围允许的\
  \ IP 地址。\n\n以下情况适合使用私有空间：\n\n\n\n# 私有空间架构\n\n*   您想要连接位于本地数据中心或私有/公有云中的一个或多个资源、服务或数据库。您可以使用\
  \ `Anypoint VPN` 或 `transit gateway`；但是，`CloudHub 2.0` 中不支持 `AWS Direct Connect`\
  \ 和 `VPC peering`。\n*   您想要启用私有端点以接受来自私有位置的流量。\n*   您想要配置自定义证书和您自己的自定义域名。\n*   您想要配置入站和出站防火墙规则。\n\
  \n![Figure 10.7 - High-level private space architecture](img/B19922_10__7.jpg)\n\
  \n**图 10.7 - 私有空间高级架构**\n\n您需要 `CIDR mask` 来创建私有空间，我们可以使用 *第 9 章* 中的相同逻辑来计算 `CIDR\
  \ block`。私有空间创建后，将提供 *图 10.8* 中显示的以下信息：\n\n![Figure 10.8 - Private space details](img/B19922_10__8.jpg)\n\
  \n**图 10.8 - 私有空间详情**\n\n让我们更详细地查看 *图 10.8* 中显示的属性：\n\n*   **Region（区域）**：这是创建私有空间所在的区域。\n\
  *   **CIDR block（CIDR 块）**：这是创建私有空间时提供的 IP 范围。\n*   **Internal DNS servers（内部 DNS\
  \ 服务器）**：内部 DNS 服务器允许您进行主机和 IP 地址映射。\n*   **Public DNS target（公共 DNS 目标）和 Private\
  \ DNS target（私有 DNS 目标）**：它将默认提供两个域名；一个用于公共流量，另一个用于内部流量。公共域名可供应用程序用来接受来自外部客户端的流量，而私有域名可用于接受私有网络、`VPN`\
  \ 或 `transit gateway` 内部的流量。\n*   **Inbound Static IPs（入站静态 IP）和 Outbound Static\
  \ IPs（出站静态 IP）**：在 `CloudHub 2.0` 中，入站和出站静态 IP 将在私有空间层面分配，而非应用程序层面。入站静态 IP 分配给您的公共域名，您可以使用它们映射更多公共域名。分配给私有空间的出站静态\
  \ IP 在部署到私有空间的应用程序需要与外部系统（如 `SFTP`）通信时非常有用，因为在这些系统中需要 IP 白名单来启用通信。在这种情况下，所有出站静态\
  \ IP 都可以在外部系统上加入白名单。分配的入站 IP 地址数量取决于区域中可用区的数量。例如，如果 `usa-east-1 region` 有三个可用区，则将分配三个入站和三个出站静态\
  \ IP 地址。\n*   **Route Table（路由表）**：**Route Table** 允许您配置路由以确定流量将从私有空间导向何处。*图 10.9*\
  \ 显示了创建私有空间时将添加的默认路由：\n\n![Figure 10.9 - Route table for a private space](img/B19922_10__9.jpg)\n\
  \n**图 10.9 - 私有空间的路由表**\n\n上图显示允许本地网络内的流量，以及通往互联网的流量。如果您想禁用互联网流量，只需移除可通过 `Internet\
  \ Gateway` 访问的 `0.0.0.0/0` 路由，但请注意 `API Manager`、`Anypoint MQ` 和 `Object Store`\
  \ 需要从私有空间访问互联网。您可以向路由表添加更多可访问的子网路由，或者如果不再希望子网可通过 `transit gateway` 或 `VPN` 连接访问，则从路由表中移除路由。\n\
  \n## AWS 服务角色\n\n服务角色是 `AWS` 服务为执行任务而承担的一种身份。\n\n如果您在 `AWS` 中设置了 **identity and\
  \ access management**（身份和访问管理，**IAM**）角色，则可以将其链接到您的私有空间。`AWS` 中的 `IAM` 角色授予私有空间访问资源和权限的权限。要在\
  \ `AWS` 上设置此功能，请执行以下操作：\n\n*   使用 `Anypoint Platform` 生成的唯一 `AWS IAM` 角色名称。\n* \
  \  使用设置私有区域的公司的组织 ID。\n*   此功能要求启用 `port 443` 上的出站流量。\n\n## 入站和出站流量规则\n\n`CloudHub\
  \ 2.0` 允许您在私有空间中配置入站和出站流量规则。下图显示了私有空间中可用的默认入站和出站规则：\n\n![Figure 10.10 - Inbound\
  \ and outbound firewall rules for a private space](img/B19922_10__10.jpg)\n\n**图\
  \ 10.10 - 私有空间的入站和出站防火墙规则**\n\n在 *图 10.10* 中，我们可以看到允许来自任何位置的 `HTTP` 和 `HTTPS` 入站流量。如果您希望私有空间仅接受\
  \ `HTTPS` 流量，请移除接受 `HTTP` 流量的规则。\n\n如果您想接受来自内部网络的 `HTTPS` 流量，请将 **Source（源）** 更改为\
  \ **Local private network（本地私有网络）**，如下图所示：\n\n![Figure 10.11 - Configuring the inbound\
  \ firewall rule for a private space](img/B19922_10__11.jpg)\n\n**图 10.11 - 配置私有空间的入站防火墙规则**\n\
  \n私有空间允许您根据需求添加新的入站防火墙规则或修改现有的入站防火墙规则。您最多可以添加 80 条入站防火墙规则。\n\n出站流量决定了部署到私有空间的应用程序如何与外部服务通信。默认情况下，它允许通过\
  \ `port 0 to 65535` 进行 `TCP` 连接，并通过 `port 443` 进行 `HTTPS` 连接。\n\n私有空间允许您根据需求添加新的出站防火墙规则或修改现有的出站防火墙规则。您最多可以添加\
  \ 80 条出站防火墙规则。\n\n如果您希望 `TCP` 和 `HTTPS` 仅与您网络内的本地服务通信，请将 **Source（源）** 从 **Anywhere（任何位置）**\
  \ 更改为 **Local private network（本地私有网络）**，如下图所示：\n\n![Figure 10.12 - Configuring the\
  \ outbound firewall rule for a private space](img/B19922_10__12.jpg)\n\n**图 10.12\
  \ - 配置私有空间的出站防火墙规则**\n\n## TLS 上下文和域名\n\n私有空间默认提供带有一个公共域名和一个私有域名的 `TLS` 上下文。如果您希望配置额外的\
  \ `TLS` 上下文以支持自定义域名，可以通过上传 `PEM` 或 `JKS` 格式的域名证书来创建额外的 `TLS` 上下文：\n\n![Figure 10.13\
  \ - Configuring TLS context for a private space](img/B19922_10__13.jpg)\n\n**图 10.13\
  \ - 配置私有空间的 TLS 上下文**\n\n## 公共端点和私有端点\n\n当应用程序部署时，`CloudHub 2.0` 默认会创建两个端点。一个是公共端点，另一个是私有端点。公共端点可以接受来自外部客户端的流量，而私有端点接受来自私有网络、`VPN`\
  \ 或 `transit gateway` 的流量。支持多个公共端点，您需要在私有空间设置中配置 `TLS` 上下文以在应用程序上启用多个公共端点。要禁用来自外部客户端的流量，您需要从部署到\
  \ `CloudHub 2.0` 的应用程序中删除公共端点。\n\n## 入口负载均衡器\n\n`CloudHub 2.0` 支持入口负载均衡器，用于将流量路由到部署在私有空间和共享空间中的应用程序。入口负载均衡器会根据传入的入站请求数量或流量负载自动扩缩。私有空间允许您在需要时下载入口负载均衡器的日志以进行故障排查。入口负载均衡器的默认读取/响应超时时间为\
  \ `300 seconds`，可根据要求增加或减少。\n\n默认日志级别为 **Error**，但也支持 **Debug**、**Trace** 和 **Info**\
  \ 等其他日志级别。\n\n## HTTP 请求\n\n`HTTP requests` `CloudHub 2.0:HTTP requests` 定义了入口负载均衡器如何处理请求。流量将通过以下三种方式之一进行处理：\n\
  \n*   **Redirect to HTTPS（重定向到 HTTPS）**：将传入的 `HTTP` 请求重定向到使用 `HTTPS` 协议的同一 URL\n\
  \n\n\n- `Accept HTTP`：允许使用 HTTP 协议在默认 SSL 端点上接收传入请求\n- `Drop HTTP`：静默丢弃 HTTP 请求，仅接受\
  \ HTTPS 上的流量\n\n图 10.14 展示了如何为私有空间中的入口负载均衡器配置 HTTP 请求、响应超时和日志下载：\n\n![图 10.14 -\
  \ 为私有空间配置 HTTP 请求](img/B19922_10__14.jpg)\n\n图 10.14 - 为私有空间配置 HTTP 请求\n\n## VPN\
  \ 连接\n\n要将私有空间连接到外部网络，可以在它们之间建立 VPN 连接，其中包括本地数据中心。这将在私有空间和本地数据中心之间创建一个安全且高可用的连接：\n\
  \n![图 10.15 - 私有空间的 VPN IPSec 隧道](img/B19922_10__15.jpg)\n\n图 10.15 - 私有空间的 VPN\
  \ IPSec 隧道\n\n### VPN 高可用性\n\n如果您仅创建了一个 VPN 连接，私有空间允许您创建第二个 VPN 连接，这被称为冗余 VPN。强烈建议创建冗余\
  \ VPN，因为它将确保高可用性，并将从初始 VPN 继承某些设置，例如路由类型、`ASN` 等。\n\n建议与客户网关建立两个 VPN 连接，以防其中一个 VPN\
  \ 连接进行任何更新或发生任何故障。在这些情况下，另一个 VPN 连接将确保 Anypoint Platform 与本地数据中心之间的连通性：\n\n![图 10.16\
  \ - VPN 高可用性](img/B19922_10__16.jpg)\n\n图 10.16 - VPN 高可用性\n\n在上述架构中，VPN 的配置方式使其在发生任何故障时按以下顺序使用：\n\
  \n1. `VPN-1 Tunnel-1`\n2. `VPN-1 Tunnel-2`\n3. `VPN-2 Tunnel-1`\n4. `VPN-2 Tunnel-2`\n\
  \n这配置为在发生任何故障时自动故障转移到另一个 VPN 隧道或连接。此 VPN 解决方案将具有弹性和稳健性。动态路由有助于自动将路由从 `VPN-1` 通告到\
  \ `VPN-2`，它还支持静态路由，当 `VPN-1` 发生故障时，`VPN-2` 将处于待机模式。\n\n## 传输网关\n\n`AWS Transit Gateway`\
  \ 就像一个路由器，可帮助您简化网络配置，并允许您连接 AWS 或 Anypoint Platform 中的私有空间，以安全的方式建立通往本地部署、Azure\
  \ 云或任何第三方专用网络的 VPN 连接。\n\n`CloudHub 2.0` 允许您在组织中附加多个传输网关，具体取决于组织的传输网关许可权利数量：\n\n\
  ![图 10.17 - 传输网关附件](img/B19922_10__17.jpg)\n\n图 10.17 - 传输网关附件\n\n在图 10.17 中，我们通过在\
  \ Anypoint Platform 中创建传输网关附件，利用 `AWS Transit Gateway` 将私有空间连接到本地数据中心。\n\n## 私有空间网络架构\n\
  \n下图展示了部署在私有空间中的应用程序如何与外部或本地网络或互联网上的服务或应用程序进行通信。正如我们所讨论的，本地服务可以通过专用端点与部署在私有空间中的应用程序通信，外部客户端可以使用公共端点进行通信。您可以在将应用程序部署到私有空间时配置公共和专用端点：\n\
  \n![图 10.18 - 私有空间网络架构](img/B19922_10__18.jpg)\n\n图 10.18 - 私有空间网络架构\n\n如果您需要自定义域，则需要在私有空间中创建\
  \ `TLS 上下文`，并以 `JKS` 或 `PEM` 格式添加域证书。在下图中，我们有自定义专用域 (`internal-api.domainname.com`)\
  \ 和公共域 (`api.domainname.com`)。要启用流量通过自定义域到达部署在私有空间中的应用程序，请在自有域中创建一条指向您的私有空间**完全限定域名**\
  \ (`FQDN`) 的 `CNAME` 记录：\n\n| `自定义域 (CNAME)` | `FQDN (A 记录)` | `域类型` |\n| --- |\
  \ --- | --- |\n| `internal-api.domainname.com` | `internal-<shard>.usa-e2.cloudhub.io`\
  \ | 专用 |\n| `api.domainname.com` | `<shard>.usa-e2.cloudhub.io` | 公共 |\n\n表 10.5\
  \ - `CNAME` ⇔ `A 记录` 映射\n\n私有空间将根据入站防火墙规则验证传入请求，所有从私有空间发出的传出请求将由出站防火墙规则验证。\n\n##\
  \ 私有空间中的多环境\n\n私有空间允许您将业务组及其子组中的沙箱或生产环境进行映射：\n\n![图 10.19 - 为私有空间映射多个环境](img/B19922_10__19.jpg)\n\
  \n图 10.19 - 为私有空间映射多个环境\n\n如果您想使用同一个私有空间映射生产环境和沙箱环境，可以选择 `Any environment`（任意环境）。但是，建议为沙箱环境和生产环境分别准备独立的私有空间。\n\
  \n## 私有空间中的多域\n\n私有空间允许您创建多个 `TLS 上下文` 以支持多个域。例如，沙箱映射到一个包含两个环境（开发和 QA）的私有空间。\n\n\
  在这种情况下，我们可以配置两个 `TLS 上下文`，分别使用域 `api-dev.domainname.com` 用于开发环境，`api-qa.domainname.com`\
  \ 用于 UAT 环境，如表 10.6 所示。\n\n| `CNAME` | `私有空间 - 公共域目标 (A 记录)` | `环境` | `域类型` |\n\
  | --- | --- | --- | --- |\n| `api-dev.domainname.com` | `<shard>.usa-e2.cloudhub.io`\
  \ | 开发 | 公共 |\n| `api-qa.domainname.com` | `<shard>.usa-e2.cloudhub.io` | QA | 公共\
  \ |\n\n表 10.6 - 多环境的 `CNAME` ⇔ `A 记录` 映射\n\n![图 10.20 - 私有空间的 TLS 上下文](img/B19922_10__20.jpg)\n\
  \n图 10.20 - 私有空间的 TLS 上下文\n\n我们有三个 `TLS 上下文`。一个是在创建私有空间时自动创建的默认 `TLS 上下文`。然后，我们还有两个用于开发和\
  \ QA 环境的 `TLS 上下文`。\n\n现在，每当我们将应用程序部署到开发环境时，可以在与开发相关的 `Ingress`（入口）选项卡下选择主机 (`https://api-dev.domainname.com`)，每当我们将应用程序部署到\
  \ QA 环境时，可以在与 QA 相关的 `Ingress` 选项卡下选择主机 (`https://api-qa.domainname.com`)：\n\n![图\
  \ 10.21 - 私有空间的应用程序端点](img/B19922_10__21.jpg)\n\n图 10.21 - 私有空间的应用程序端点\n\n## 将 MuleSoft\
  \ 应用程序部署到 CloudHub Runtime Manager 的不同选项\n\nMuleSoft 提供了多种将应用程序部署到 CloudHub 的方式，所有选项都可用于与\
  \ CI/CD 流水线集成，以实现 MuleSoft 应用程序到 CloudHub 的自动部署。让我们探讨所有可用于将应用程序部署到 CloudHub 的选项。\n\
  \n### Mule Maven 插件\n\n`Mule Maven 插件` 是用于将 MuleSoft 应用程序部署、取消部署和打包到 `CloudHub 2.0`\
  \ 的重要 Maven 插件之一。让我们更详细地讨论 `Mule Maven 插件`。可以在应用程序的 `POM.xml` 文件中配置以下插件，并包含在 CloudHub\
  \ 中部署和运行应用程序所需的所有必需属性：\n\n\n\n\n# 用于 CloudHub 2.0 部署的 Mule Maven 插件配置\n\n## 插件配置\n\
  \n```xml\n<plugin>\n  <groupId>org.mule.tools.maven</groupId>\n  <artifactId>mule-maven-plugin</artifactId>\n\
  \  <version>3.8.6</version>\n  <extensions>true</extensions>\n  <configuration>\n\
  \    <cloudhub2Deployment>\n      <uri>https://anypoint.mulesoft.com</uri>\n   \
  \   <provider>MC</provider>\n      <environment>${environment}</environment>\n \
  \     <target>${target}</target>\n      <muleVersion>${app.runtime}</muleVersion>\n\
  \      <username>${anypoint.username}</username>\n      <password>${anypoint.password}</password>\n\
  \      <applicationName>${application.name}</applicationName>\n      <replicas>${replicas}</replicas>\n\
  \      <vCores>${replicaSize}</vCores>\n      <deploymentSettings>\n        <http>\n\
  \          <inbound>\n            <publicUrl>${publicURL}</publicUrl>\n        \
  \    <forwardSslSession>true</forwardSslSession>\n            <lastMileSecurity>true</lastMileSecurity>\n\
  \          </inbound>\n        </http>\n      </deploymentSettings>\n    </cloudhub2Deployment>\n\
  \  </configuration>\n</plugin>\n```\n\n在前述 Mule Maven 插件中，使用 `${}` 定义的值是可以从 `mule\
  \ deploy` 命令传递的参数，如下所示：\n\n```\nmule deploy –DmuleDeploy -Dapp.runtime=4.4.0 -Danypoint.username=anypointusername\
  \ –Danypoint.password=password -Dapplication.name=music-api-dev –Denvironment=Sandbox\
  \ –Dworkers=1 –DworkerType=MICRO -Dreplica=1 -DreplicaSize=0.1 -DpublicUrl=https://api-dev.domainname.com\
  \ -Dtarget=jj-dev-ps\n```\n\n## Mule Maven 插件属性（表 10.7）\n\n下表显示了在将应用程序部署到 CloudHub\
  \ 时可以在 Mule Maven 插件上配置的属性：\n\n| 参数 | 说明 | 是否必需 | 默认值/示例 |\n| --- | --- | --- |\
  \ --- |\n| `cloudhub2Deployment` | 这是顶层元素。 | 是 | |\n| `uri` | 这是您的 Anypoint Platform\
  \ URI。 | 否 | `https://anypoint.mulesoft.com` |\n| `muleVersion` | 这是在 CloudHub 2.0\
  \ 实例中运行的 Mule 运行时引擎版本。 | 是 | 例如 `4.3.0` |\n| `username` | 这是您的 Anypoint Platform\
  \ 用户名。 | 是（仅当使用 Anypoint Platform 凭据时） | |\n| `password` | 这是您的 Anypoint Platform\
  \ 密码。 | 是（仅当使用 Anypoint Platform 凭据时） | |\n| `applicationName` | 这是要在 Runtime Manager\
  \ 中实现的应用程序的标题。 | 是 | 例如 `invoice-api-dev` |\n| `scopeLoggingConfigurations` | 这是要使用的日志记录库的包。`logLevel`：是日志级别。允许的值为\
  \ `NONE`、`ERROR`、`WARN`、`INFO`、`DEBUG` 和 `TRACE`。 | 否 | |\n| `target` | 这是要部署应用程序的目标。可以是共享空间或私有空间。\
  \ | 是 | |\n| `provider` | 对于 CloudHub 2.0，设置为 `MC`。 | 是 | `MC` |\n| `environment`\
  \ | 这是要部署应用程序的 CloudHub 2.0 环境。 | 是 | |\n| `replicas` | 这是要为应用程序创建的副本数量。 | 是 | |\n\
  | `vCores` | 这是副本的大小，允许的值为 `0.1`、`0.2`、`0.5`、`1`、`1.5`、`2`、`2.5`、`3`、`3.5` 和 `4`。\
  \ | 否 | `0.1` |\n| `businessGroup` | 这是部署的业务组路径。 | 否 | |\n| `businessGroupId` |\
  \ 这是部署的业务组 ID。 | 否 | |\n| `deploymentTimeout` | 这是部署过程允许的持续时间，以毫秒为单位。这指的是从部署开始到确认工件成功部署之间的时间。\
  \ | 否 | `10,00,000.00` |\n| `server` | Maven 服务器与 Anypoint Platform 凭据集成。服务器的 ID\
  \ 可以在 `settings.xml` 文件中找到，该文件链接到用户的 Anypoint 用户名和密码。 | 否 | |\n| `properties` |\
  \ 可以在应用程序部署期间传递要设置的属性。 | 否 | |\n| `secureProperties` | 可以在应用程序部署期间传递要设置的安全属性。 |\
  \ 否 | |\n| `skip` | 当设置为 `true` 时，它会跳过插件部署目标。 | 否 | `false` |\n| `skipDeploymentVerification`\
  \ | 当设置为 `true` 时，它会跳过已部署应用程序的状态验证。 | 否 | `false` |\n| `authToken` | 指定用于访问平台的授权令牌。\
  \ | 仅当使用授权令牌登录时 | |\n| `connectedAppClientId` | 指定 Connected App 的 clientID 值。 |\
  \ 仅当使用 Connected App 凭据登录时 | |\n| `connectedAppClientSecret` | 指定 Connected App\
  \ 的密钥。 | 仅当使用 Connected App 凭据登录时 | |\n| `connectedAppGrantType` | 指定唯一支持的连接类型：`client_credentials`。\
  \ | 仅当使用 Connected App 凭据登录时 | |\n\n## 部署设置参数（表 10.8)\n\n以下列出了可以在 `deploymentSettings`\
  \ 下传递的其他一些参数：\n\n| 参数 | 说明 |\n| --- | --- |\n| `enforceDeployingReplicasAcrossNodes`\
  \ | 此设置确保副本跨不同节点部署，默认值设置为 `false`。 |\n| `updateStrategy` | `updateStrategy` 的值可以是\
  \ `recreate` 或 `rolling`。 |\n| `clustered` | 此设置允许跨应用程序的多个副本启用集群。默认情况下，它设置为 `false`。\
  \ |\n| `http` | **公共 URL**：这是指已部署应用程序的 Web 地址。<br>**最后一英里安全性**：启用此功能后，HTTPS 连接将被转发并由应用程序解密。<br>**转发\
  \ SSL 会话**：当设置为 `true` 时，此选项在会话期间启用 SSL 转发。默认值为 `false`。 |\n| `generateDefaultPublicUrl`\
  \ | 当选择 `set to true` 选项时，CloudHub 2.0 将为已部署的应用程序生成公共 URL。 |\n\n### 配置示例\n\n**enforceDeployingReplicasAcrossNodes**\n\
  \n```xml\n<deploymentSettings>\n  <enforceDeployingReplicasAcrossNodes>false</enforceDeployingReplicasAcrossNodes>\n\
  </deploymentSettings>\n```\n\n**updateStrategy**\n\n```xml\n<deploymentSettings>\n\
  \  <updateStrategy>recreate</updateStrategy>\n</deploymentSettings>\n```\n\n**clustered**\n\
  \n```xml\n<deploymentSettings>\n  <clustered>true</clustered>\n</deploymentSettings>\n\
  ```\n\n**http**\n\n```xml\n<deploymentSettings>\n  <http>\n    <inbound>\n     \
  \ <publicUrl>https://myapp.anypoint.com</publicUrl>\n      <lastMileSecurity>true</lastMileSecurity>\n\
  \      <forwardSslSession>true</forwardSslSession>\n    </inbound>\n  </http>\n\
  </deploymentSettings>\n```\n\n## 部署和取消部署命令\n\n以下命令用于部署和取消部署应用程序：\n\n```\nmvn clean\
  \ deploy –DmuleDeploy (将应用程序部署到 CloudHub 2.0)\nmvn mule:undeploy (从 CloudHub 2.0\
  \ 取消部署应用程序)\n```\n\n## 身份验证机制\n\nMule Maven 插件可以使用以下身份验证机制之一来将应用程序部署到 CloudHub：\n\
  \n- Anypoint Platform 用户名和密码\n- 服务器\n- Anypoint 连接应用程序\n- 授权令牌\n\n# Anypoint CLI\n\
  \nAnypoint CLI 也可用于将 MuleSoft 应用程序部署、取消部署或重新部署到 CloudHub 2.0。Anypoint CLI 是 Anypoint\
  \ Platform 的脚本和命令行工具。Anypoint CLI 能够管理 Anypoint Platform 的各种功能，例如 CloudHub 1.0、CloudHub\
  \ 2.0、API 治理、Anypoint 专用负载均衡器、Anypoint VPC、Exchange、Design Center、API Manager 等。要使用\
  \ Anypoint CLI，您需要为其设置一个 npm 包。以下是 MuleSoft 提供的用于设置 Anypoint CLI 的文档：\n\n<https://docs.mulesoft.com/anypoint-cli/4.x/install>\n\
  \nAnypoint CLI 可以使用以下身份验证机制之一来管理 Anypoint Platform：\n\n- Anypoint Platform 用户名和密码\n\
  - 客户端 ID 和客户端密钥\n- 持有者令牌（仅限命令行）\n\n\n\n\n## CloudHub 2.0 部署命令\n\n管理 CloudHub 的命令列表可在\
  \ MuleSoft 文档中找到，链接如下：\n\n[`docs.mulesoft.com/anypoint-cli/4.x/cloudhub2-apps`](https://docs.mulesoft.com/anypoint-cli/4.x/cloudhub2-apps)\n\
  \n以下命令可用于将应用程序部署到 CloudHub 2.0：\n\n```\nruntime-mgr:application:deploy <appID> <deploymentTargetID>\
  \ <runtimeVersion> <artifactID> [flags]\n```\n\n您可以使用以下值将应用程序 ID 中提到的应用程序部署到部署目标：\n\
  \n| 值 | 说明 | 示例 |\n|-------|-------------|---------|\n| `--artifactId` | 应用程序的 Artifact\
  \ ID 来源于 Exchange。 | `--artifactId mule-error-plugin` |\n| `--deploymentTargetId`\
  \ | 标识部署目标。 | `--deploymentTargetId cloudhub-us-east-2` |\n| `--name` | 指定需要部署在\
  \ CloudHub 2.0 上的应用程序名称。 | `--name testcloudhubapp` |\n| `--runtimeVersion` | 这是部署应用程序所需的运行时版本。\
  \ | `--runtimeVersion 4.3.0` |\n| `--secureProperty` | 这会设置一个加密属性。 | `--secureProperty\
  \ secureTestProperty:true` |\n\n表 10.9 - Anypoint CLI 应用程序部署值\n\n可随 `runtime-mgr`\
  \ 部署命令传递的标志列表如下：\n\n| 标志 | 说明 | 示例 |\n|------|-------------|---------|\n| `--assetVersion`\
  \ | 这是 Exchange 中的资产版本。 | `--assetVersion 3.0.5` |\n| `--[no-]clustered` | 这启用集群节点的使用，需要至少两个副本。\
  \ | `--no-clustered` |\n| `--[no-]disableAmLogForwarding` | 这会禁用应用程序日志转发到 Anypoint\
  \ Monitoring。 | `--disableAmLogForwarding` |\n| `--[no-]forwardSslSession` | 这启用\
  \ SSL 会话转发。 | `--no-forwardSslSession` |\n| `--groupId` | 这是要部署的资产的组 ID。 | `--groupId\
  \ org.mule.test` |\n| `--[no-]lastMileSecurity` | 这启用最后一公里安全性。 | `--no-lastMileSecurity`\
  \ |\n| `--[no-]objectStoreV2` | 这启用 Object Store v2。 | `--no-objectStoreV2` |\n\
  | `--pathRewrite` | 这为应用程序中的 HTTP 监听器提供预期的基本路径。 | `--pathRewrite /http://localhost:8000`\
  \ |\n| `--property` | 这设置一个属性。 | `--property testproperty:true` |\n| `--propertiesFile`\
  \ | 所有属性均替换为指定文件中的值。 | `--propertiesFile /Users/mule/Documents/dev-properties.txt`\
  \ |\n| `--publicEndpoints` | 这提供可通过万维网访问的接入点。 | `--publicEndpoints my-superapp-example:/status?limit=50`\
  \ |\n| `--replicas` | 这是要部署的副本数量。 | `--replicas 3` |\n| `--replicaSize` | 这是副本的大小（以\
  \ vCore 为单位）。 | `--replicaSize 0.1` |\n| `--scopeLoggingConfig` | 这定义作用域日志记录。 |\
  \ `--scopeLoggingConfig testscope1:WARN,testscope2:DEBUG` |\n| `--scopeLoggingConfigFile`\
  \ | 这上传一个文件以定义作用域日志记录。 | `--scopeLoggingConfigFile /Users/mule/Documents/cert.txt`\
  \ |\n| `--updateStrategy` | 这更新所使用的策略。 | `--updateStrategy recreate` |\n\n表 10.10\
  \ - Anypoint CLI 应用程序部署标志\n\n## 从 CloudHub 1.0 到 CloudHub 2.0 的技术增强\n\n*   允许您为副本数量超过一的部署配置集群。\n\
  *   允许使用容器进行应用程序部署，以控制资源使用、保证应用程序可用性并促进扩展。\n*   允许使用 AWS 服务角色进行资源访问控制。\n*   粒度 vCore\
  \ 分配选项 — CloudHub 2.0 支持在粒度 vCore 上部署应用程序。\n*   允许您配置多个私有或公共端点。\n*   允许您下载入口自助服务日志。可通过私有空间访问。Titanium\
  \ 用户也可通过 Anypoint Monitoring 访问日志。\n*   支持入站和出站防火墙规则。\n*   在 CloudHub 1.0 应用程序中，名称在每个控制平面必须唯一，而在\
  \ CloudHub 2.0 中，应用程序名称在每个私有空间内必须唯一。\n*   VPC 对等连接和 AWS Direct Connect 在 CloudHub\
  \ 2.0 中已弃用。可改用 Transit Gateway 代替 VPC 对等连接和 AWS Direct Connect。\n*   HTTP 和 HTTPS\
  \ 流量使用端口 8081。\n*   您可以根据环境类型（如沙箱和生产环境）将一个私有空间与多个环境关联。这在 Anypoint Virtual Private\
  \ Cloud 中是不可能的，因为您必须将每个单独的环境关联到 Anypoint Virtual Private Cloud。\n*   默认情况下，CloudHub\
  \ 2.0 中 VPN 启用了高可用性。\n*   具有相同 vCore 大小的 CloudHub 1.0 应用程序工作节点和 CloudHub 2.0 应用程序副本在性能指标上可能显示差异，且无法进行比较。\n\
  \n以下是 CloudHub 2.0 **不** 支持的功能或特性：\n\n*   4.3.0 之前的 Mule 版本\n*   CloudHub Connector\n\
  *   不支持 TLS 1.0。请使用 TLS 1.2 或 TLS 1.3\n*   创建自定义通知\n*   Anypoint Functional Monitoring\n\
  *   持久队列；请使用 Anypoint MQ 进行持久队列和其他队列管理\n\n## 总结\n\n在本章中，探讨了 CloudHub 2.0 的所提供能力和特性，重点介绍了其与\
  \ CloudHub 1.0 的差异。讨论涵盖了各种特性，如高可用性、容错性和可扩展架构，所有这些均由 CloudHub 2.0 支持。\n\n此外，还演示了在\
  \ CloudHub 2.0 中利用共享空间和私有空间运行 MuleSoft 应用程序。另外，还解释了利用 Mule Maven Plugin 和 Anypoint\
  \ CLI 等工具在 CloudHub 2.0 环境中部署 MuleSoft 应用程序。\n\n下一章将深入探讨 Runtime Fabric 管理器，它运行在自管理的\
  \ Kubernetes 和裸金属服务器上。该管理器可用于在基于 Kubernetes 的容器化环境中运行 MuleSoft 应用程序。\n\n## 延伸阅读\n\
  \nCloudHub 2.0 参考列表包含以下来源：\n\n*   MuleSoft 文档：[`docs.mulesoft.com/cloudhub-2/ch2-architecture`](https://docs.mulesoft.com/cloudhub-2/ch2-architecture)\n\
  *   YouTube 系列：[`youtube.com/playlist?list=PL5GwZHHgKcuDaUnFQymi85AbUVbvJBtsA&si=GvCy64jOsw3PoYT4`](https://youtube.com/playlist?list=PL5GwZHHgKcuDaUnFQymi85AbUVbvJBtsA&si=GvCy64jOsw3PoYT4)\n\
  *   本章中一些表格引用自 MuleSoft 官方文档：[`docs.mulesoft.com/`](https://docs.mulesoft.com/)\n"
- "# 11. 使用 Runtime Fabric 容器化运行时平面\n\n在本章中，我们将讨论如何在基于 Kubernetes 的容器化环境中运行和管理 MuleSoft\
  \ 应用程序。MuleSoft 提供了用于裸金属服务器/虚拟机（**VM**）的 Runtime Fabric 和用于自管理 Kubernetes 的 Runtime\
  \ Fabric，以便您可以在容器化环境中管理和运行 MuleSoft 应用程序。\n\n在本章中，我们将涵盖以下主题：\n\n*   Kubernetes 架构及其组件\n\
  *   用于裸金属服务器/VM 的 Runtime Fabric\n*   用于自管理 Kubernetes 的 Runtime Fabric\n*   用于\
  \ Red Hat OpenShift 的 Runtime Fabric\n*   Anypoint Security\n\n## 技术要求\n\n本章需要满足以下条件：\n\
  \n*   启用了 Runtime Fabric 的企业版 Anypoint Platform 访问权限。\n*   Runtime Fabric 设置许可证密钥。\n\
  *   如果您计划在自管理 Kubernetes 上设置 Runtime Fabric，则需要 EKS/GKE/AKS。\n\n\n\n\n\n## 先决条件\n\
  \n- `VMs/bare-metal server` 以满足所有先决条件。相关链接可在本章末尾的 `Further reading` 部分找到。\n- `Red\
  \ Hat OpenShift`，以防您计划在 OpenShift 上设置 Runtime Fabric。\n\n# Kubernetes 架构\n\n首先，我们将讨论\
  \ Kubernetes 集群的高层架构，然后再了解由 MuleSoft 提供的 Runtime Fabric。Kubernetes 集群遵循主从架构来运行容器化应用程序，并且比部署在虚拟机上的应用程序更快、更轻量。它们也易于管理和扩展。\n\
  \nKubernetes 由主节点和工作节点组成，用于运行应用程序工作负载和管理容器编排。主节点通常是决策者，负责管理 Kubernetes 集群。它是任何管理任务的入口点，您可以通过\
  \ API、CLI 或 Kubernetes GUI 轻松与主节点通信。为确保架构的高可用性和容错性，集群中必须有不止一个主节点。\n\n## 主节点组件\n\n\
  主节点包含以下组件：\n\n- `kube-apiserver`：API 服务器在主节点上执行所有管理任务。用户可以通过 HTTP REST 调用与 API 服务器交互，此时\
  \ API 服务器会验证并执行请求。客户端可以与 API 服务器交互以利用 Kubernetes 功能。\n- `Etcd`：etcd 是一个高可用的分布式键值存储，用于存储所有集群数据，例如当前状态、期望状态、资源配置和运行时数据。Kubernetes\
  \ 集群使用 etcd 存储所有配置数据、其状态（集群的当前状态和期望状态）以及元数据。etcd 使用 Golang 编写。\n- `kube-scheduler`：调度器监视新创建的、未分配工作节点的\
  \ Pod，并为 Pod 选择节点。简单来说，调度器根据可用资源决定将容器部署在哪个节点上。\n- `Controller manager`：控制器管理器负责管理各种控制器，这些控制器持续监视集群状态，并确保集群的当前状态接近期望状态。可用的控制器包括：\n\
  \    - `Node controller`：节点控制器负责将新节点加入集群并管理节点的期望状态。它处理节点变得不可用的情况，以保持应用程序运行。\n  \
  \  - `Replica controller`：副本控制器监控副本集，并确保副本集中有期望数量的 Pod 可用。如果 Pod 崩溃或终止，它会自动创建一个新\
  \ Pod。它将始终确保期望数量的 Pod，或者至少有一个 Pod 处于运行状态。\n    - `Deployment controller`：部署控制器管理应用程序的部署。它确保\
  \ Pod 在期望的副本数量下运行，并确保不健康的副本被新的健康副本替换。这将保证至少维护一个应用程序实例来提供请求服务。\n    - `Job controller`：作业控制器与\
  \ API 服务器通信以移除或添加新 Pod，并不自行运行作业。作业是在一个或多个 Pod 上运行以执行任务然后终止的 Kubernetes 任务。\n\n![Figure\
  \ 11.1 - Kubernetes master node](img/B19922_11_01.jpg`)\n\n图 11.1 描绘了 Kubernetes\
  \ 控制平面中主节点的组件。\n\n## 工作节点组件\n\n集群中将始终有不止一个工作节点，以确保其高可用性和容错性。工作节点负责运行容器化应用程序。它们包含以下组件：\n\
  \n- `kube-proxy`：这是一个在集群的每个工作节点上运行的网络代理。kube-proxy 管理节点上的网络规则，这些网络规则允许您的 Pod 与集群内部或外部的网络会话进行通信。\n\
  - `kubelet`：kubelet 在每个工作节点上运行，以与集群中的主节点通信。它负责管理 Pod 如何部署到 Kubernetes 集群。它从 API\
  \ 服务器接收命令并指示容器启动或停止。\n- `Container runtime`：容器运行时负责在 Pod 中运行和管理您的应用程序。\n\n![Figure\
  \ 11.2 - Kubernetes worker nodes](img/B19922_11_02.jpg`)\n\n图 11.2 描绘了工作节点中的组件。\n\
  \n![Figure 11.3 - Kubernetes architecture](img/B19922_11_03.jpg`)\n\n图 11.3 描绘了完整的\
  \ Kubernetes 架构。\n\n在本节中，我们了解了 Kubernetes 架构。下一节将介绍 Runtime Fabric。Runtime Fabric\
  \ 运行在 Kubernetes 之上，是 MuleSoft 提供的一项服务，用于运行 Mule 应用程序和代理。\n\n# 什么是 Runtime Fabric？\n\
  \nRuntime Fabric 是由 MuleSoft 基于 Kubernetes 构建的容器服务，用于在云（Azure/AWS/Google）和本地数据中心运行和管理\
  \ MuleSoft 应用程序。Runtime Fabric 可以设置在裸金属服务器/虚拟机、自托管 Kubernetes（如 `Azure Kubernetes\
  \ Service (AKS)`、`Elastic Kubernetes Service (EKS)` 或 `Google Kubernetes Engine\
  \ (GKE)`）以及 Red Hat OpenShift 上。\n\n当我们在自托管 Kubernetes、裸金属服务器/虚拟机或 Red Hat OpenShift\
  \ 上设置 Runtime Fabric 时，客户和 MuleSoft 在管理 Runtime Fabric 方面的责任有所不同。在以下章节中，我们将了解当 Runtime\
  \ Fabric 在上述任何实例中设置时，哪些责任属于 MuleSoft，哪些属于客户。\n\n## 裸金属服务器/虚拟机上的 Runtime Fabric\n\
  \n裸金属服务器/虚拟机上的 Runtime Fabric 由一组用于集群的虚拟机组成。每个虚拟机可以作为控制器节点或工作节点。\n\n控制器节点是用于操作 Runtime\
  \ Fabric 的专用虚拟机，包含编排服务、内部负载均衡器以及允许您从 Anypoint Platform（控制平面）监控集群的服务。工作节点是用于运行 Mule\
  \ 应用程序和 API 网关的专用虚拟机。\n\n以下是具有一个控制器节点和两个工作节点的开发环境中 Runtime Fabric 的典型架构：\n\n![Figure\
  \ 11.4 - Runtime Fabric architecture (development environment)](img/B19922_11_04.jpg`)\n\
  \n图 11.4 - Runtime Fabric 架构（开发环境）\n\n以下是生产环境中 Runtime Fabric 的典型架构，提供高可用性和容错性。Runtime\
  \ Fabric 架构有三个控制器和三个工作节点。三个控制器节点可在丢失一个控制器时实现容错：\n\n![Figure 11.5 - Runtime Fabric\
  \ architecture (production environment)](img/B19922_11_05.jpg`)\n\n图 11.5 - Runtime\
  \ Fabric 架构（生产环境）\n\n\n\n\n\n## 控制器节点和工作节点配置\n\n为了在丢失两个控制器节点的情况下提供进一步的容错能力，应设置总共五个控制器。此配置可用于生产环境。对于开发环境，您可以设置一个控制器节点和两个工作节点。Anypoint\
  \ Platform 与控制器节点上的代理之间的通信始终是出站的。代理始终在控制器上可用，且控制器仅运行内部负载均衡器。Mule 应用程序部署在工作节点上。应用程序的多个副本可以跨工作节点运行。集群中控制节点的最大数量为\
  \ 5 个，工作节点的最大数量为 16 个。对于开发环境，我们可以使用 1 个、3 个或 5 个控制节点。对于生产环境，我们可以使用 3 个或 5 个控制节点。\n\
  \n## 网络架构\n\nTCP 负载均衡器用于在每个控制器节点的内部负载均衡器内对请求进行负载均衡。内部负载均衡器将流量分发到运行在工作节点上的应用程序副本中。外部客户端可以通过公共域名向\
  \ TCP 负载均衡器发送请求：\n\n![图 11.6 - Runtime Fabric 网络架构](img/B19922_11_06.jpg)\n\n图 11.6\
  \ - Runtime Fabric 网络架构\n\n图 11.6 描绘了 Runtime Fabric 的网络架构。\n\n## 客户与 MuleSoft 之间的共同责任\n\
  \n了解客户和 MuleSoft 在管理 Runtime Fabric 方面各自的责任至关重要。下图描绘了客户和 MuleSoft 的责任：\n\n![图 11.7\
  \ - 共同责任模型](img/B19922_11_07.jpg)\n\n图 11.7 - 共同责任模型\n\n图 11.7 描绘了 MuleSoft 与客户之间\
  \ Runtime Fabric 的共同责任模型。\n\n管理基础设施组件（如磁盘、存储、虚拟机、网络端口、所有虚拟机间的系统时间同步以及服务器补丁）是客户的责任。管理\
  \ Mule 运行时、Runtime Fabric 相关组件和 Runtime Fabric 设备是 MuleSoft 的责任。\n\n## Runtime Fabric\
  \ 中 `etcd` 的概念\n\n`etcd` 是一个可靠的分布式键值对数据存储。它维护集群配置数据、当前状态以及与之关联的元数据。`etcd` 可用于 Runtime\
  \ Fabric 的所有控制器节点，并将相同的数据复制到所有控制器节点：\n\n![图 11.8 - etcd 配置](img/B19922_11_08.jpg)\n\
  \n图 11.8 - etcd 配置\n\nRuntime Fabric 信息以 JSON 或 YAML 格式存储。`etcd` 将确保所有节点间信息一致，并且无论您从哪个节点访问信息，都能获得相同的信息。控制器通常对\
  \ `etcd` 文件执行写入或读取操作。读取是一项简单的操作，因为相同的 `etcd` 副本可在所有控制器节点上获得。\n\n写入是一项复杂的操作。例如，如果您同时收到多个写入\
  \ `etcd` 的请求，哪个请求会生效？并非所有控制器都在 `etcd` 集群中执行写入操作；只有一个控制器节点会执行写入操作，该节点称为**领导者节点**。集群中的其他节点称为**追随者节点**。在\
  \ `etcd` 集群中，其中一个节点会被选举为领导者，其余节点为追随者。\n\n如果任何控制器节点收到写入请求，该请求将被转发给领导者节点，由领导者节点对 `etcd`\
  \ 执行写入操作。之后，它将确保追随者节点接收到相同的数据副本。当领导者收到所有追随者的确认时，此过程将被标记为完成。\n\n## 法定人数管理\n\n弄清楚\
  \ Runtime Fabric 集群需要多少控制器节点才能正常运行并成功写入 `etcd` 文件的关键概念之一是法定人数管理。\n\n法定人数管理是指集群中执行\
  \ `etcd` 写入操作并正常运行所需的最少节点数。计算法定人数的公式为 `floor (n/2) + 1`，其中 `n` 是集群中控制器节点的数量。让我们计算法定人数并了解它如何适应\
  \ Runtime Fabric 架构：\n\n- **一个控制器节点**：法定人数将为 `floor (1/2) + 1 = 1`。这意味着当控制节点宕机时，整个系统将瘫痪。此配置仅适用于开发环境。\n\
  - **两个控制器节点**：法定人数将为 `floor (2/2) + 1 = 2`。这意味着当一个控制器宕机时，仍有一个控制器节点可用，但法定人数为 2。在这种情况下，将没有容错能力，且写入操作将无法执行。这意味着单节点控制器和双节点控制器提供的集群可用性相似。因此，拥有两个节点的集群毫无意义。\n\
  - **三个控制器节点**：法定人数将为 `floor (3/2) + 1 = 2`。这意味着当一个控制器宕机时，仍有两个控制器节点可用，且法定人数为 2。在这种情况下，将有两个控制器节点可用，同时满足法定人数。在这种情况下，我们可以容忍一个控制器节点不可用，仍有两个控制器节点继续工作。\n\
  - **四个控制器节点**：法定人数将为 `floor (4/2) + 1 = 3`。这意味着当一个控制器宕机时，有三个控制器节点可用，且法定人数为 3。这意味着集群将继续工作。然而，如果我们再丢失一个控制器，将只剩两个控制器节点可用，而法定人数为\
  \ 3。这意味着三节点控制器和四节点控制器提供的集群可用性相似。没有必要拥有四个节点的集群。\n- **五个控制器节点**：法定人数将为 `floor (5/2)\
  \ + 1 = 3`。这意味着当一个控制器宕机时，有控制器节点可用（原文此处似有漏词，应为 \"four controller nodes available\"\
  ），且法定人数为 3。这意味着集群将继续工作。然而，如果我们再丢失一个控制器，将有三个控制器节点可用，且法定人数为 3。在这种情况下，将有三个控制器节点可用，同时满足法定人数。在这种情况下，我们可以容忍两个控制器节点不可用，因为仍有三个控制器节点继续工作。\n\
  \n通常，建议在集群中设置奇数个控制器节点（即 1 个、3 个或 5 个）。下表说明了特定数量的控制器节点所提供的容错能力：\n\n| 控制器节点数量 | 法定人数\
  \ | 容错能力 |\n| --- | --- | --- |\n| 1 | 1 | 0 |\n| 2 | 2 | 0 |\n| 3 | 2 | 1 |\n|\
  \ 4 | 3 | 1 |\n| 5 | 3 | 2 |\n\n表 11.1 - 法定人数与容错能力的关联\n\n## 可扩展性\n\n扩展可以在基础设施层面和应用程序层面实现。\n\
  \n水平扩展可以通过两种方式完成：\n\n- 在 Runtime Fabric 集群中添加或移除控制器或工作节点\n- 添加或移除应用程序的副本\n\n垂直扩展可以通过两种方式完成：\n\
  \n- 增加或减少集群中节点（控制器和工作节点）的计算资源，如内存或 CPU\n- 增加或减少应用程序副本上的 CPU 资源（预留 CPU 或 CPU 限制）\n\
  \n## 高可用性\n\n如前所述，通过在 Runtime Fabric 架构中运行多个控制器和工作节点，可以实现 Runtime Fabric 的高可用性。\n\
  \n要以高可用性模式运行应用程序，请部署多个应用程序副本。这将确保应用程序的高可用性。\n\n\n\n\n\n## 容错\n\n默认情况下，部署到 Runtime\
  \ Fabric 的应用程序具有容错能力。假设您部署了一个或多个应用程序副本。如果其中一个副本因 `JVM` 故障而崩溃，或因节点宕机而不可用，则该不健康副本将被另一个节点上的新副本替换，如果原节点可用，则在同一节点上替换。我们之前介绍了\
  \ `Kubernetes` 架构，其中控制器可确保集群的期望状态。\n\n## 入站负载均衡器（入口负载均衡器）\n\n所有控制器节点上均提供入站负载均衡器，用于将流量分发至工作节点上的应用程序副本。默认情况下，入站流量处于禁用状态，以避免不必要的资源消耗。可通过\
  \ `Anypoint Runtime Manager` 启用。该负载均衡器负责 `TLS` 终止，扩展负载均衡器所需的资源数量取决于传入请求的数量和每个请求的负载大小。\n\
  \n内部负载均衡器可配置为共享模式或专用模式：\n\n*   `共享模式` 允许您为内部负载均衡器指定 `CPU` 核心数和内存大小。共享模式为默认设置，并分布在所有控制节点中。\n\
  *   `专用模式` 不允许您为内部负载均衡器指定 `CPU` 核心数和内存大小，但它会使用专门分配给内部负载均衡器的所有资源。在此模式下，内部负载均衡器部署在专用的内部负载均衡器节点上。\n\
  \n内部负载均衡器的规格取决于响应时间延迟、请求数量和负载大小：\n\n*   `0.5 GB` 为默认内部负载均衡器规格，最多可处理 500 个活动连接。\n\
  *   `1.5 GB` 可处理 500 个以上的活动连接，且在启用安全策略时需要此规格。\n\n入站负载均衡器可定义如何接受来自客户端的流量并将其转发给运行在\
  \ Runtime Fabric 中的应用程序：\n\n*   `接受 HTTPS 请求`：仅接受 `HTTPS` 协议流量，丢弃所有入站 `HTTP` 流量：\n\
  \    *   `将 HTTP 重定向到 HTTPS`：接受 `HTTPS` 流量并将流量以 `HTTP` 发送至 Runtime Fabric。若流量通过\
  \ `HTTP` 而来，则响应 302 将其重定向至端口 443 上的 `HTTPS`。\n    *   `接受 HTTP 请求`：接受 `HTTPS` 流量并将请求以\
  \ `HTTP` 发送至 Runtime Fabric 端口 80。\n    *   `丢弃 HTTP 请求`：接受 `HTTPS` 流量。发送至 Runtime\
  \ Fabric 的 `HTTP` 流量将被忽略或丢弃。\n*   `仅接受 HTTP 请求`：接受 `HTTP` 流量。这不是允许 `HTTP` 流量的安全方式。\n\
  \n## Anypoint Security\n\nAnypoint Security 使您能够在边缘应用安全策略，并代理所有入站和出站连接，以保护应用程序网络，从而降低任何风险或威胁。可在\
  \ Runtime Fabric 前应用各种边缘策略，以保护应用程序网络免受外部威胁：\n\n*   `拒绝服务 (DoS) 策略`：此策略确保仅接受来自合法来源的流量，防止攻击者用大量请求淹没您的应用程序网络。`DoS`\
  \ 指持续向您的应用程序网络发送大负载请求，以消耗服务器资源和网络带宽。\n*   `IP 允许列表策略`：顾名思义，`IP 允许列表` 策略将允许来自策略中允许的\
  \ `IP` 地址的流量进入应用程序网络，而来自不在允许列表中的 `IP` 地址的流量将被丢弃。\n*   `HTTP 限制策略`：此策略允许您配置应用程序网络上允许的负载大小和标头数量。攻击者会尝试发送大负载以消耗服务器资源，导致\
  \ `DoS`，并消耗网络带宽，从而导致服务器性能下降。通过 `HTTP` 策略，您可以控制传入消息的大小。\n*   `Web 应用程序防火墙 (WAF) 策略`：`WAF`\
  \ 策略将保护请求和响应流量，在 Web 应用程序层面提供安全防护。\n\n## 应用程序性能指标\n\n下图展示了 Mule 应用程序在简单 `10 KB`\
  \ 负载下，不同 `vCPU` 核心数的应用程序性能：\n\n![图 11.9 - Runtime Fabric 应用程序性能指标](img/B19922_11_09.jpg)\n\
  \n图 11.9 - Runtime Fabric 应用程序性能指标\n\n## 内部负载均衡器性能指标\n\n下图展示了控制器节点上内部负载均衡器在 `AWS\
  \ EC2 M4` 实例上的性能：\n\n![图 11.10 - 内部负载均衡器性能指标](img/B19922_11_10.jpg)\n\n图 11.10 -\
  \ 内部负载均衡器性能指标\n\n上述应用程序和负载均衡器性能指标摘自 MuleSoft 官方文档 (`https://docs.mulesoft.com/runtime-fabric/1.13/deploy-resource-allocation`)。\n\
  \n至此，我们已介绍了裸金属服务器和 VM 上 Runtime Fabric 的架构。接下来，我们将了解自管理 Kubernetes 上 Runtime Fabric\
  \ 的架构。\n\n# 自管理 Kubernetes 上的 Runtime Fabric\n\nMuleSoft 提供在自管理 Kubernetes (`EKS`/`AKS`/`GKE`)\
  \ 上设置 Runtime Fabric 的选项。自管理 Kubernetes 上的 Runtime Fabric 允许您将 Mule 应用程序和 API 代理部署并管理到由您创建、配置和管理的\
  \ Kubernetes 集群中。此选项允许您 `自带 Kubernetes` (`BYOK`)，MuleSoft 将提供运行应用程序所需的 Runtime Fabric\
  \ 服务、Mule 运行时和其他组件。在本节中，我们将讨论如何利用 `AWS` 上的 `EKS` 来运行 Runtime Fabric。但在此之前，我们需要了解\
  \ `EKS` 架构及其功能。\n\n## EKS 架构\n\n`EKS` 是 `AWS` 提供的全托管服务，提供 `Kubernetes` 以运行工作负载并管理\
  \ `Kubernetes` 控制平面。\n\n`EKS` 的控制完全由 `AWS` 管理，`AWS` 负责 `Kubernetes` 控制平面的可用性、可扩展性、容错性和持久性。控制平面通常托管在\
  \ `AWS` 托管的 `虚拟私有云` (`VPC`) 中的控制器节点。`Kubernetes` 控制平面通过 `EKS` 托管的 `弹性网络接口` (`ENI`)\
  \ 与集群中的工作节点通信。`ENI` 位于多个可用区中，以提供容错和高可用性架构。\n\n`ENI` 是虚拟网桥，将 `AWS` 虚拟私有云中的实例连接到网络，以允许安全的入站和出站流量。\n\
  \n以下是您可以设置的典型 `EKS` 架构。但并非必须使用类似架构；具体架构将因组织需求而异：\n\n![图 11.11 - 面向 Runtime Fabric\
  \ 的弹性 Kubernetes 架构](img/B19922_11_11.jpg)\n\n图 11.11 - 面向 Runtime Fabric 的弹性 Kubernetes\
  \ 架构\n\n在 `图 11.11` 中，我们选择了需要设置 `Kubernetes` 集群的区域。我们在该区域中设置了 `VPC`，其中包含三个子网，如下所示：\n\
  \n*   `私有子网`：这是托管工作节点 (`AWS EC2` 实例) 的子网，工作节点将跨所有可用区启动，以提供高可用性和容错能力。工作节点的规格取决于您的应用程序工作负载。\n\
  \n\n\n\n\n# EKS 上的 Runtime Fabric 架构\n\n## 网络子网架构\n\n*   `Firewall subnet`（防火墙子网）：此子网将限制来自私有子网的出站流量。默认情况下，如果您已将\
  \ NAT 网关与私有子网关联，则允许来自私有子网的所有出站流量。如果您有需求指定只能连接到互联网上可用的少数应用程序，在这种情况下，您可以在防火墙子网的防火墙策略中允许那些应用程序域名或\
  \ IP 地址。这意味着您不允许来自私有子网的所有流量流向互联网。防火墙子网是可选的，它主要允许您定义有状态和无状态规则。\n\n*   `Public subnet`（公有子网）：此子网与互联网网关关联，允许入站和出站流量进出互联网。NAT\
  \ 网关将在公有子网中设置，以仅允许来自私有子网流向互联网的出站流量。\n\n每个子网都跨所有可用区创建，以确保可扩展、高可用且具备容错能力的架构。与每个子网关联的路由表用于定义流量将从子网导向何处的规则。\n\
  \n完成 EKS 设置后，Kubernetes 控制平面（控制器节点）会自动在 AWS 托管的 VPC 中设置。它由 AWS 管理，负责扩展、高可用性、容错等。它还跨可用区启用\
  \ EKS 托管的 ENI，以建立 Kubernetes 集群中控制平面与工作节点之间的通信。\n\n堡垒主机可以在公有子网中设置，以连接私有子网中的工作节点。\n\
  \n存储在 `etcd` 上的数据使用 Amazon 的 `Key Management Service` (`KMS`) 进行加密。控制器节点分布在各个可用区中，流量由\
  \ `Elastic Load Balancer` (`ELB`) 分发。\n\n## EKS 上的 Runtime Fabric 架构（自管理 Kubernetes）\n\
  \n让我们来看看自管理 Kubernetes 上的 Runtime Fabric 架构。下图展示了该架构及其众多组件如何交互和协调：\n\n![Figure 11.12\
  \ - Runtime Fabric architecture on EKS (self-managed Kubernetes)](img/B19922_11_12.jpg)\n\
  \nFigure 11.12 - EKS 上的 Runtime Fabric 架构（自管理 Kubernetes）\n\n图 11.12 展示了各个组件及其相互交互的方式：\n\
  \n*   **Persistence Gateway**（持久化网关）负责将对象存储数据存储在持久化数据存储中。应用程序必须经过集群化以共享数据，例如在对象存储或跨副本的\
  \ VM 队列中。持久化网关将确保这些数据在应用程序重启或部署时不会消失，并能从任何崩溃中恢复。\n\n*   **Docker Pod**（Docker Pod）是负责从\
  \ Mule Docker 注册表拉取特定版本 Mule 运行时的工作节点。\n\n*   **log forwarder agent**（日志转发代理）将日志转发到外部系统，例如\
  \ Splunk、CloudWatch、ELK 或 Anypoint Monitoring。\n\n*   可以实现两种集群：基础设施级别和应用级别。基础设施集群涉及协同工作在集群中运行\
  \ MuleSoft 应用程序的节点组，确保架构的高可用性、可扩展性和容错性。\n\n*   当我们部署多个应用程序副本时，可以启用应用集群，这可以在应用程序部署期间启用。这将提高应用程序性能，并允许数据在应用程序副本之间共享。\n\
  \n*   部署在 Runtime Fabric 上的应用程序副本具备容错能力。它们会在 `JVM` 崩溃或工作节点宕机后自动恢复。\n\n*   通过向自动扩缩组添加工作节点来支持自动扩缩。它可以根据内存和\
  \ `CPU` 使用率是否超过配置值进行扩缩。\n\n## 在自管理 Kubernetes 上安装 Runtime Fabric\n\n可以使用 `rtfctl`\
  \ 或 `helm` 实用程序在自管理 Kubernetes 上设置 Runtime Fabric。\n\n以下是使用 `rtfctl` 或 `helm` 在自管理\
  \ Kubernetes 上安装 Runtime Fabric 的官方 MuleSoft 文档：\n\n*   `rtfctl`: [`https://docs.mulesoft.com/runtime-fabric/1.13/install-self-managed`](https://docs.mulesoft.com/runtime-fabric/1.13/install-self-managed)\n\
  *   `helm`: [`https://docs.mulesoft.com/runtime-fabric/1.13/install-helm`](https://docs.mulesoft.com/runtime-fabric/1.13/install-helm)\n\
  \n## 客户与 MuleSoft 之间的共同责任\n\n了解客户和 MuleSoft 在管理自管理 Kubernetes 上的 Runtime Fabric\
  \ 方面各自的责任至关重要。下图描述了客户和 MuleSoft 的责任：\n\n![Figure 11.13 - Shared responsibility model](img/B19922_11_13.jpg)\n\
  \nFigure 11.13 - 共同责任模型\n\nMuleSoft 提供 Runtime Fabric 服务、Mule 运行时和其他组件，用于在自管理 Kubernetes\
  \ 上部署和运行 Mule 应用程序。\n\n客户将负责管理 Mule 应用程序、基础设施、Kubernetes、网络、负载均衡器、向外部平台的监控和日志记录等。\n\
  \n## Ingress（入站流量）\n\nRuntime Fabric 允许您使用资源模板为入站流量指定自定义 Ingress 配置。在资源模板中，您可以定义注解、类名以及\
  \ HTTP 和 HTTPS 路由规则。Ingress 负责 TLS 终止和隧道、负载均衡和路由。Ingress 控制器可以是 `NGINX ingress controller`、`AWS\
  \ load balancer controller` 等：\n\n![Figure 11.14 - Ingress-managed load balancer](img/B19922_11_14.jpg)\n\
  \nFigure 11.14 - Ingress 托管的负载均衡器\n\n**Note**（注意）\n\n以下文档解释了如何在自管理 Kubernetes 上的\
  \ Runtime Fabric 上配置 Ingress：[`https://developer.mulesoft.com/tutorials-and-howtos/runtime-fabric/runtime-fabric-aws-elastic-kubernetes-service/`](https://developer.mulesoft.com/tutorials-and-howtos/runtime-fabric/runtime-fabric-aws-elastic-kubernetes-service/)。\n\
  \n## 高可用性和容错性\n\n每当您在自管理 Kubernetes 上设置 Runtime Fabric 时，控制平面完全由云提供商管理，并且具有高可用性，以确保业务连续性和性能。根据法定人数要求，应至少设置三个工作节点，以确保容错和高可用架构。通过部署多个副本和集群，应用程序可以实现高可用性。\n\
  \n部署到自管理 Kubernetes 上的 Runtime Fabric 的应用程序具有容错能力，将自动从任何故障或工作节点宕机中恢复。\n\n## 可扩展性\n\
  \n自管理 Kubernetes 的控制平面可扩展性由云提供商管理。工作节点可以通过添加或移除节点进行水平扩展，并通过添加或移除 `CPU` 或内存等计算资源进行垂直扩展。\n\
  \n可以将工作节点添加到自动扩缩组，以便在内存或 `CPU` 使用率增加或减少时自动扩缩。\n\n部署到自管理 Kubernetes 上的 Runtime Fabric\
  \ 的应用程序可以通过添加或移除副本进行水平扩展，并通过增加或减小副本大小进行垂直扩展。应用程序不支持自动扩缩，但可以通过 `Runtime Manager UI`、`Mule\
  \ Maven plugin` 或 `Platform API` 实现零停机扩缩。\n\n## 部署到自管理 Kubernetes 的应用程序如何与需要 IP\
  \ 白名单的外部服务通信？\n\n您可能会遇到这样的情况：您的应用程序必须与外部服务通信。为了与外部服务建立成功的连接，必须在外部服务上将应用程序的 IP 地址加入白名单。\n\
  \n在这里，我们将考虑部署到 AWS EKS 的应用程序与必须进行 IP 白名单的外部服务进行通信的情况。\n\n### 场景 1 - 工作节点运行在公有子网中\n\
  \n\n\n\n\n# 工作节点子网部署场景\n\n## 场景 1：工作节点运行在公共子网中\n\n在这种情况下，工作节点运行在公共子网中，这意味着工作节点将获得公共\
  \ IP 地址，且 `Pod` 将从公共子网 IP 范围分配一个 IP 地址。\n\n`Pod` 可以使用工作节点的公共 IP 与外部服务通信，因为 `Pod`\
  \ 的 IP 地址将与工作节点 IP 地址进行 `SNAT` 转换。您只需提供集群中所有工作节点的公共 IP 地址以加入白名单，即可实现运行在工作节点上的 `Pod`\
  \ 与外部服务之间的成功通信。`SNAT` 代表 `source network address translation`（源网络地址转换）：\n\n![图 11.15\
  \ - 工作节点运行在公共子网中](img/B19922_11_15.jpg`)\n\n图 11.15 - 工作节点运行在公共子网中\n\n## 场景 2：工作节点运行在私有子网中\n\
  \n在这种情况下，工作节点运行在私有子网中，这意味着工作节点将仅获得私有 IP 地址，且工作节点可以使用 `NAT 网关` 与外部世界通信。\n\n`Pod`\
  \ IP 地址将与 `NAT 网关` 的公共 IP 地址进行 `SNAT` 转换以与外部服务通信；只需在外部系统中将 `NAT 网关` 的 IP 地址加入白名单，即可通过公共子网中的\
  \ `NAT 网关` 建立 `Pod` 与外部应用程序之间的成功通信：\n\n![图 11.16 - 工作节点运行在私有子网中](img/B19922_11_16.jpg`)\n\
  \n图 11.16 - 工作节点运行在私有子网中\n\n简单来说，`Pod` 通过服务抽象与外部应用程序通信。\n\n# Runtime Fabric 部署对比\n\
  \n## 自托管 Kubernetes 上的 Runtime Fabric 与裸金属/虚拟机上的 Runtime Fabric 之间的差异\n\n裸金属/虚拟机上的\
  \ Runtime Fabric 与自托管 Kubernetes 上的 Runtime Fabric 之间的差异如下表所示：\n\n| 属性 | Runtime\
  \ Fabric（裸金属/虚拟机） | Runtime Fabric（EKS/AKS/GKE） |\n| --- | --- | --- |\n| Kubernetes\
  \ | MuleSoft 提供 | `BYOK` |\n| Ingress | 包含 | 不包含 |\n| OpsCenter UI | 包含 | 不包含 |\n\
  | 节点类型 | 裸金属或虚拟机 | 支持基于虚拟机的实例。不支持 `Fargate` |\n| 最后一公里安全 | 支持 | 支持 |\n| 令牌化服务 |\
  \ 支持 | 支持 |\n| Anypoint 集群 | 支持 | 支持 |\n| 持久化网关 | 支持 | 支持 |\n| Anypoint Security\
  \ | 支持 | 不支持 |\n| Runtime Fabric 服务 | 包含 | 包含 |\n| Mule Runtime | 包含 | 包含 |\n| 最大业务组数量\
  \ | 50 | 50 |\n| 最大工作节点数量 | 16 | 30 |\n| 每个应用程序的副本数 | 8 | 8 |\n| 每个工作节点的副本数 | 40\
  \ | 40 |\n| 最大控制器节点数量 | 5 | 自托管控制器节点 |\n| `Kapacitor` 警报 | 包含 | 不包含 |\n| 安装选项 |\
  \ 虚拟机或裸金属服务器 | `EKS`、`GKE`、`AKS` |\n| 控制器节点可访问性 | 可访问控制器节点 | 不可访问 |\n| 每个 Runtime\
  \ Fabric 集群关联的最大环境数量 | 50 | 100 |\n| Docker | MuleSoft 提供 | `自带 Docker (BYOD)` |\n\
  | 应用程序端口 | 8081 | 8081 |\n\n表 11.2 - 自托管 Kubernetes 上的 Runtime Fabric 与裸金属/虚拟机上的\
  \ Runtime Fabric 之间的差异\n\n既然我们已经介绍了自托管 Kubernetes 上的 Runtime Fabric 与裸金属/虚拟机上的 Runtime\
  \ Fabric 之间的架构差异，现在让我们看看一些可用于管理和执行 Runtime Fabric 的实用服务。\n\n## `rtfctl` 实用程序\n\n\
  `rtfctl` 是 MuleSoft 提供的一个实用程序，用于从本地机器、堡垒主机或任何计算机安装和管理 Runtime Fabric。此 `rtfctl`\
  \ 实用程序适用于裸金属服务器/虚拟机上的 Runtime Fabric 和自托管 Kubernetes。\n\n> **注意**\n>\n> 以下 MuleSoft\
  \ 文档解释了如何安装和使用 `rtfctl`：\n>\n> `https://docs.mulesoft.com/runtime-fabric/2.3/install-rtfctl`\n\
  \n# 令牌化服务\n\n令牌化服务允许您保护敏感数据。例如，假设传入消息包含敏感数据，如信用卡号或社会安全号。此数据可使用令牌化服务进行令牌化。MuleSoft\
  \ 提供了令牌化和去令牌化策略，可在 API 网关层面进行配置。\n\n要在 API Manager 中启用令牌化和去令牌化策略，您应在 Runtime Fabric\
  \ 中部署令牌化服务。\n\n下图显示了如何对社会安全号等敏感数据进行令牌化：\n\n![图 11.17 - Runtime Fabric 令牌化](img/B19922_11_17.jpg`)\n\
  \n图 11.17 - Runtime Fabric 令牌化\n\n下图显示了如何对前一个示例中已令牌化的数据进行去令牌化：\n\n![图 11.18 - Runtime\
  \ Fabric 去令牌化](img/B19922_11_18.jpg`)\n\n图 11.18 - Runtime Fabric 去令牌化\n\n# 密钥管理器\n\
  \nAnypoint Security 提供密钥管理器，以便您存储机密、TLS、密钥库和信任库，供您的部署使用。密钥管理器支持 Runtime Fabric Ingress\
  \ 的 TLS 上下文。\n\n# Runtime Fabric 中的 CPU 突发\n\nRuntime Fabric CPU 突发是基于 Kubernetes\
  \ CPU 突发技术的概念。每当我们将应用程序部署到 Runtime Fabric 时，都需要为应用程序分配正确的资源（如 `vCPU` 和内存），以确保其能够处理所需的工作负载。\n\
  \n当我们将应用程序部署到 Runtime Fabric 时，它会部署在隔离的 `Pod` 中。应用程序的每个副本在单独的 `Pod` 中运行。每个副本都有自己的\
  \ Mule Runtime，并且需要为每个副本分配 `vCPU` 和内存等资源。我们还需要确定部署期间需要创建的副本数量。\n\n我们需要在部署应用程序时为副本分配以下资源：\n\
  \n*   `Reserved CPU`（预留 CPU）：可供应用程序副本使用的保证 `vCPU`。\n*   `CPU limit`（CPU 限制）：应用程序副本可使用的最大\
  \ CPU（CPU 可突发的级别）。\n*   `Memory`（内存）：应用程序副本可使用的内存量（以 `GiB` 为单位）。可分配给应用程序副本的最小内存为\
  \ `Mule 4` 上的 0.7 `GiB` 和 `Mule 3` 上的 0.5 `GiB`。\n\n每当预留 CPU 量和 CPU 限制相等时，意味着 CPU\
  \ 以保证模式分配给副本。这将确保应用程序的性能一致。\n\n如果分配给副本的 CPU 限制大于预留 CPU，则意味着 CPU 突发已激活，如果应用程序因请求过载，应用程序副本已准备好消耗更多\
  \ CPU。此 CPU 将从工作节点上可用的备用 CPU 资源中获取。\n\n当您使用 CPU 突发时，最小预留 CPU 必须为 0.02 `vCPUs`，最小\
  \ CPU 限制必须为 0.07 `vCPUs`。高工作负载的应用程序可能需要额外的 CPU 容量以获得更好的性能。如果在使用最小 CPU 限制时应用程序部署失败，则增加\
  \ CPU 限制并重新部署应用程序。\n\n对于具有关键性能要求的应用程序，切勿使用 `vCPU` 突发，因为它不能保证在需要时突发 `vCPU` 可用。在这种情况下，请采用保证\
  \ CPU 模式，您可以在其中保持预留 CPU 等于 CPU 限制。\n\n您需要确保不消耗超过您所付费的 CPU，即使您正在使用 CPU 突发。查看 `https://docs.mulesoft.com/runtime-fabric/1.8/deploy-resource-allocation#cpu-and-licensed-cores`\
  \ 以获取更多详细信息。\n\nCPU 限制受限于工作节点上提供的 CPU 核心数的上限，这意味着提供给副本的 CPU 限制不应超过工作节点的 CPU 核心数。\n\
  \n\n\n\n\n# CPU 突发与 Runtime Fabric 概览\n\n下图展示了应用程序过载期间 CPU 突发的工作原理，以及请求数量的变化，随后在请求数量减少或恢复正常后回到正常状态：\n\
  \n![Figure 11.19 - CPU bursting](img/B19922_11_19.jpg)\n\n图 11.19 - CPU 突发\n\nCPU\
  \ 限制并不总是得到保证，但如果且仅当有空闲 CPU 可用时，它可以突发到定义的限制；部署的应用程序的其他副本也可能在争夺工作节点上未分配的 CPU。\n\n\
  Runtime Fabric 默认会在工作节点上运行一些服务，消耗 `0.3 到 0.5 vCPUs` 的 CPU。\n\n例如，假设你有三个工作节点，每个工作节点有两个\
  \ vCPU，这意味着集群共有六个 vCPU。工作节点将至少使用 `0.3 vCPUs` 用于其他进程，这意味着总共预留了 `0.9 vCPUs` 给工作节点，剩余\
  \ `5.1 vCPUs` 可供使用。\n\n# Pod\n\nPod 可以在 Kubernetes 集群中容纳一个或多个应用程序。Pod 是短暂的；如果 Pod\
  \ 执行失败，Kubernetes 将自动创建一个 Pod 副本来替换不健康的实例。Runtime Fabric Pod 只能包含一个 MuleSoft 应用程序。不允许在一个\
  \ Pod 中部署多个应用程序。下图展示了如何在 Runtime Fabric 中设置 Pod：\n\n![Figure 11.20 - Runtime Fabric\
  \ Pod](img/B19922_11_20.jpg)\n\n图 11.20 - Runtime Fabric Pod\n\n# 最后一公里安全\n\n最后一公里安全允许你在边缘与\
  \ Runtime Fabric 上的应用程序之间启用 HTTP 流量。部署在 Runtime Fabric 上的应用程序始终监听端口 `8081`；不支持其他端口。要启用最后一公里安全，你需要在已部署到\
  \ Runtime Fabric 的应用程序的 HTTPS 监听器上配置带有服务器密钥库的 TLS 上下文（使用 HTTPS 协议），并在 Runtime Manager\
  \ 的应用程序设置的 `Ingress` 选项卡中启用最后一公里安全：\n\n![Figure 11.21 - Last-mile security](img/B19922_11_21.jpg)\n\
  \n图 11.21 - 最后一公里安全\n\n# 内部服务间通信\n\n为部署到集群 `cluster.local` 域中的每个应用程序创建 DNS。完全限定域名为\
  \ `<service>.<namespace>.svc.cluster.local`。\n\n例如，`invoice-sys-api` 应用程序部署到 Runtime\
  \ Fabric 集群，使用 HTTPS 协议监听端口 `8081`。该域名将为 `invoice-sys-api.e893e8e9-f802-4346-9dd8-ce958efb1979.svc.cluster.local`，其中\
  \ `invoice-sys-api` 是应用程序名称，`e893e8e9-f802-4346-9dd8-ce958efb1979` 是 Runtime Fabric\
  \ 的命名空间：\n\n![Figure 11.22 - Internal service-to-service communication](img/B19922_11_22.jpg)\n\
  \n图 11.22 - 内部服务间通信\n\n# 带有 Runtime Fabric 的持久化网关\n\n持久化网关允许 MuleSoft 应用程序存储和共享部署到\
  \ Runtime Fabric 的多个副本之间的数据。有了持久化网关，在应用程序重启或重新部署的情况下，数据不会丢失：\n\n![Figure 11.23 -\
  \ Persistence Gateway with Runtime Fabric](img/B19922_11_23.jpg)\n\n图 11.23 - 带有\
  \ Runtime Fabric 的持久化网关\n\n始终部署多个持久化网关副本以确保高可用性和可扩展性。PostgreSQL 数据库是 Runtime Fabric\
  \ 上持久化网关支持的唯一数据库。\n\n# 部署策略\n\nRuntime Fabric 支持两种部署策略：\n\n- 滚动更新\n- 重建\n\n滚动更新允许你以零停机时间重新部署应用程序。现有的应用程序副本将保持可用，直到新的应用程序副本部署完成，客户端可以继续发送请求。一旦新副本成功部署，旧副本将被终止。\n\
  \n下图描绘了滚动更新的工作原理：\n\n![Figure 11.24 - Rolling Update deployment strategy](img/B19922_11_24.jpg)\n\
  \n图 11.24 - 滚动更新部署策略\n\n重建将终止现有的应用程序副本，然后部署新的应用程序副本。应用程序在部署期间将不可用。\n\n下图描绘了重建的工作原理：\n\
  \n![Figure 11.25 - Recreate deployment strategy](img/B19922_11_25.jpg)\n\n图 11.25\
  \ - 重建部署策略\n\n# 集群\n\n要为部署到 Runtime Fabric 的应用程序启用集群，必须至少有两个副本。可以从 Runtime Manager\
  \ UI 启用集群，也可以在使用 Mule Maven 插件部署应用程序时指定。\n\n## 跨节点部署副本\n\n此选项确保具有多个副本的应用程序部署到集群中的各个节点上。可以从\
  \ Runtime Manager UI 启用此选项，也可以在使用 Mule Maven 插件部署应用程序时指定。\n\n# 备份和恢复 Runtime Fabric\n\
  \n备份 Runtime Fabric 集群至关重要，以便在发生任何故障时能够恢复。Runtime Fabric 中的数据分布在 Kubernetes 集群中。\n\
  \n在发生任何故障时，保留部署到 Runtime Fabric 的应用程序非常重要，以便能够恢复所有应用程序、其配置及其状态：\n\n- 始终将备份存储在 Runtime\
  \ Fabric 之外的外部存储中\n- 最佳实践是每小时备份一次 Runtime Fabric\n\n## 何时使用备份和恢复流程\n\n有几个用例可以使用备份和恢复流程：\n\
  \n- 在 Runtime Fabric 硬件升级期间，你可以添加更多计算资源并迁移到新的操作系统\n- 将 Runtime Fabric 从本地迁移到云，或从一个云提供商迁移到另一个\n\
  - 将 Runtime Fabric 从一个数据中心迁移到另一个\n- 添加更多节点以扩展 Runtime Fabric 集群\n- 在灾难恢复事件中对集群进行故障转移时\n\
  \n## 备份了什么？\n\nRuntime Fabric 备份与 Runtime Fabric 集群相关的服务和组件，但不备份与 Anypoint Platform\
  \ 集群相关的任何内容。以下是备份内容的列表：\n\n- 应用程序详情，包括副本集、Pod、应用程序元数据以及在 Runtime Manager UI 中配置的属性\n\
  - Runtime Fabric 和应用程序中的所有数据，包括入口、密钥、角色和集群绑定、服务和服务账户以及部署\n- Runtime Fabric 集群上运行的当前\
  \ `rtfctl` 版本\n- Runtime Fabric 集群上的当前代理版本\n- 与 MuleSoft 配置相关的数据，如对象存储、Anypoint\
  \ Monitoring 和外部负载转发器\n- 控制器和工作节点配置\n\n## 备份和恢复\n\n通过 `rtfctl` 进行备份和恢复过程非常简单。只需执行一条命令行，即可备份和恢复\
  \ Runtime Fabric。\n\n要备份 Runtime Fabric，请使用以下命令：\n\n```\n./rtfctl backup <path_to_store_backup>\n\
  ```\n\n要恢复 Runtime Fabric，请使用以下命令：\n\n```\n./rtfctl restore <path_to_backup_store>\n\
  ```\n\n# 将 MuleSoft 应用程序部署到 Runtime Fabric 的不同选项\n\nMuleSoft 提供了多种将应用程序部署到 Runtime\
  \ Fabric 的方式。每个选项都可以与 CI/CD 流水线集成，以便自动将 MuleSoft 应用程序部署到 Runtime Fabric。让我们探索所有可用于将应用程序部署到\
  \ CloudHub 的选项。\n\n## Mule Maven 插件\n\n\n\n\n# 面向 Runtime Fabric 的 Mule Maven 插件\n\
  \nMule Maven 插件是一个重要的 Maven 插件，用于将 MuleSoft 应用程序部署、取消部署和打包到 Runtime Fabric 中。可以在应用程序的\
  \ `POM.xml` 文件中配置以下 Mule Maven 插件，其中包含在 Runtime Fabric 中部署和运行应用程序所需的所有属性：\n\n```xml\n\
  <plugin>\n  <groupId>org.mule.tools.maven</groupId>\n  <artifactId>mule-maven-plugin</artifactId>\n\
  \  <version>3.8.6</version>\n  <extensions>true</extensions>\n  <configuration>\n\
  \    <runtimeFabricDeployment>\n      <uri>https://anypoint.mulesoft.com</uri>\n\
  \      <muleVersion>${app.runtime}</muleVersion>\n      <username>${username}</username>\n\
  \      <password>${password}</password>\n      <applicationName>${app.name}</applicationName>\n\
  \      <target>rtf</target>\n      <environment>${environment}</environment>\n \
  \     <provider>MC</provider>\n      <replicas>${replicas}</replicas>\n      <properties>\n\
  \        <key>value</key>\n      </properties>\n      <deploymentSettings>\n   \
  \     <enforceDeployingReplicasAcrossNodes>false</enforceDeployingReplicasAcrossNodes>\n\
  \        <updateStrategy>recreate</updateStrategy>\n        <clustered>false</clustered>\n\
  \        <forwardSslSession>false</forwardSslSession>\n        <lastMileSecurity>false</lastMileSecurity>\n\
  \        <resources>\n          <cpu>\n            <reserved>${reserved.cpu}</reserved>\n\
  \            <limit>${cpu.limit}</limit>\n          </cpu>\n          <memory>\n\
  \            <reserved>${reserved.memory}</reserved>\n          </memory>\n    \
  \    </resources>\n        <http>\n          <inbound>\n            <publicUrl>${public.url}</publicUrl>\n\
  \          </inbound>\n        </http>\n      </deploymentSettings>\n    </runtimeFabricDeployment>\n\
  \  </configuration>\n</plugin>\n```\n\n在前述 Mule Maven 插件配置中，`${}` 下定义的值是可以通过 `mule\
  \ deploy` 命令传递的参数，如下所示：\n\n```\nmule deploy –DmuleDeploy -Dapp.runtime=4.3.0 -Dusername=anypointusername\
  \ –Dpassword=password -Dapp.name=music-api-dev –Denvironment=Sandbox –Dreserved.cpu=20M\
  \ -Dcpu.limit=1500M -Dreserved.memory=700Mi -Dpublic.url=https://api-dev.domainnanme.com\n\
  ```\n\n## Mule Maven 插件属性\n\n部署应用程序到 Runtime Fabric 时，可以在 Mule Maven 插件中配置以下属性：\n\
  \n| 参数 | 说明 | 必填 | 默认值/示例 |\n| --- | --- | --- | --- |\n| `runtimeFabricDeployment`\
  \ | 顶层元素。 | 是 |  |\n| `uri` | 您的 Anypoint Platform URI。 | 否 |  |\n| `muleVersion`\
  \ | 在 Runtime Fabric 实例中运行的 Mule 运行时引擎版本。 | 是 |  |\n| `username` | 您的 Anypoint Platform\
  \ 用户名。 | 仅当使用 Anypoint Platform 凭据登录时 |  |\n| `password` | 您的 Anypoint Platform\
  \ 密码。 | 仅当使用 Anypoint Platform 凭据登录时 |  |\n| `applicationName` | 应用部署后在 Runtime\
  \ Manager 中显示的应用程序名称。 | 是 |  |\n| `target` | 用于部署应用程序的 Runtime Fabric 目标名称。 | 是\
  \ |  |\n| `provider` | 设置为 `MC`，即面向 Runtime Fabric。 | 是 |  |\n| `environment` |\
  \ 目标 Anypoint Platform 环境。 | 是 |  |\n| `replicas` | 这指定了要部署的 Mule 应用程序的副本（实例）数量。每个应用程序的最大副本数为\
  \ 8。 | 是 |  |\n| `businessGroup` | 部署的业务组路径。 | 否 |  |\n| `businessGroupId` | 部署的业务组\
  \ ID。 | 否 |  |\n| `deploymentTimeout` | 部署过程开始与确认构件已部署之间允许的经过时间（以毫秒为单位）。 | 否 | `1000000`\
  \ |\n| `server` | 带有 Anypoint Platform 凭据的 Maven 服务器。 | 否 |  |\n| `properties` |\
  \ 顶层元素。 | 否 |  |\n| `secureProperties` | 顶层元素。 | 否 |  |\n| `skip` | 设置为 `true` 时，跳过插件部署目标。\
  \ | 否 |  |\n| `skipDeploymentVerification` | 设置为 `true` 时，跳过已部署应用程序的状态验证。 | 否 |\
  \  |\n| `authToken` | 指定用于访问平台的授权令牌。您可以使用此身份验证方法代替设置用户名和密码。 | 仅当使用授权令牌登录时 |  |\n\
  | `connectedAppClientId` | 指定连接应用客户端 ID 值。 | 仅当使用 Connected Apps 凭据登录时 |  |\n| `connectedAppClientSecret`\
  \ | 指定连接应用密钥。 | 仅当使用 Connected Apps 凭据登录时 |  |\n| `connectedAppGrantType` | 指定唯一支持的连接类型：`client_credentials`。\
  \ | 仅当使用 Connected Apps 凭据登录时 |  |\n| `deploymentSettings` | 部署设置定义在下表中。 | 否 | \
  \ |\n\n*表 11.3 - Mule Maven 插件属性*\n\n## 部署设置属性\n\n可以在 `deploymentSettings` 下传递其他一些参数，如下所示：\n\
  \n| 参数 | 说明 | 示例 |\n| --- | --- | --- |\n| `enforceDeployingReplicasAcrossNodes`\
  \ | 强制跨不同节点部署副本。默认值为 `false`。 | ```xml\\n<deploymentSettings>\\n    <enforceDeployingReplicasAcrossNodes>false</enforceDeployingReplicasAcrossNodes>\\\
  n</deploymentSettings>\\n``` |\n| `updateStrategy` | `updateStrategy` 值可以是 `recreate`\
  \ 或 `rolling`。 | ```xml\\n<deploymentSettings>\\n  <updateStrategy>recreate</updateStrategy>\\\
  n</deploymentSettings>\\n``` |\n| `clustered` | 启用跨两个或更多应用程序副本的集群。默认值为 `false`。\
  \ | ```xml\\n<deploymentSettings>\\n    <clustered>true</clustered>\\n</deploymentSettings>\\\
  n``` |\n| `http` | 已部署应用程序的 URL。 | ```xml\\n<deploymentSettings>\\n  <http>\\n \
  \   <inbound>\\n      <publicUrl>https://api-dev.domainname.com</publicUrl>\\n \
  \   </inbound>\\n  </http>\\n</deploymentSettings>\\n``` |\n\n*表 11.4 - 部署设置属性*\n\
  \n## 部署和取消部署命令\n\n可以使用以下命令来部署和取消部署应用程序：\n\n*   `mvn clean deploy –DmuleDeploy`（将应用程序部署到\
  \ Runtime Fabric）\n*   `mvn mule:undeploy`（从 Runtime Fabric 取消部署应用程序）\n\n## 身份验证机制\n\
  \nMule Maven 插件可以使用以下身份验证机制之一将应用程序部署到 Runtime Fabric：\n\n*   Anypoint Platform 用户名和密码\n\
  *   Server\n*   Anypoint connected app\n*   Auth token\n\n可以从 Anypoint Platform\
  \ 的 Runtime Manager UI 部署 MuleSoft 应用程序。\n\n# Runtime Fabric 的优势\n\nRuntime Fabric\
  \ 提供以下优势：\n\n*   Runtime Fabric 允许您在轻量级容器中运行 MuleSoft 应用程序。\n*   Runtime Fabric\
  \ 可以在 EKS、AKS、GKE、Red Hat OpenShift 以及本地或任何云中的裸机服务器/VM 上设置。\n*   同一个 Runtime Fabric\
  \ 中支持多个版本的 Mule 运行时。\n*   它支持零停机部署或更新。\n*   Runtime Fabric 上支持的最小副本规模为 0.02 vCores。\n\
  *   它提供基于容器的应用程序隔离。每个容器相互独立。\n*   它支持高可用性、容错性、可扩展性和副本自动恢复等功能。\n*   支持基于 Hazelcast\
  \ 的集群，用于跨副本存储和共享数据。\n*   每个应用程序都可以独立于其他应用程序进行扩展，并且每个应用程序可以部署在不同的副本规模上。\n\n# Red\
  \ Hat OpenShift 上的 Runtime Fabric\n\n如前所述，Runtime Fabric 可以安装在 VM/裸机服务器和自管理的 Kubernetes\
  \ (EKS/AKS/GKE) 上。Runtime Fabric 也可以作为 Kubernetes (K8s) 操作符在 Red Hat OpenShift 上设置。作为\
  \ Kubernetes 操作符的 Runtime Fabric 可以在以下平台上设置：\n\n*   Red Hat OpenShift Service on\
  \ AWS\n\n\n\n- Microsoft Azure Red Hat OpenShift\n- Red Hat OpenShift Dedicated\n\
  - Red Hat OpenShift on IBM Cloud\n- 自管式 Red Hat OpenShift 版本（Performance Plus、OCP\
  \ 和 Kubernetes Engine）\n\n我们不会深入探讨 Runtime Fabric 作为 Red Hat OpenShift 中 Kubernetes\
  \ 操作符的架构，但如果您计划安装 Red Hat OpenShift Runtime Fabric 服务，它支持上述平台。\n\n以下是在 Red Hat OpenShift\
  \ 上设置 Runtime Fabric 的高级架构：\n\n![图 11.26 - Red Hat OpenShift 上的 Runtime Fabric](img/B19922_11_26.jpg)\n\
  \n图 11.26 - Red Hat OpenShift 上的 Runtime Fabric\n\n有关 Red Hat OpenShift 上 Runtime\
  \ Fabric 的更多详细信息，请参阅“延伸阅读”部分提供的链接。\n\n# 概要\n\n本章介绍了 Runtime Fabric 提供的功能，以及它如何与虚拟机/裸金属服务器、自管式\
  \ Kubernetes 和 Red Hat OpenShift 配合使用。我们还涵盖了各种组件，例如入口、最后一公里安全、令牌化服务、部署策略、零停机部署，以及可扩展性、容错性和高可用性等非功能性需求。在下一章中，我们将解释如何在您的数据中心设置\
  \ Mule 运行时，以便您可以运行 Mule 应用程序。\n\n## 延伸阅读\n\n要了解本章涵盖主题的更多信息，请查看以下资源：\n\n- Runtime\
  \ Fabric 概览：`docs.mulesoft.com/runtime-fabric/latest`\n- Runtime Fabric 先决条件（裸金属/虚拟机）：`docs.mulesoft.com/runtime-fabric/1.13/install-prereqs`\n\
  - Runtime Fabric 许可证密钥安装：`docs.mulesoft.com/runtime-fabric/1.13/install-manual`\n\
  - 持久性网关：`docs.mulesoft.com/runtime-fabric/2.3/persistence-gateway`\n- Red Hat OpenShift\
  \ 上的 Runtime Fabric：`docs.mulesoft.com/runtime-fabric/latest/install-openshift`\n"
- "# 第 12 章：部署到您自己的数据中心\n\n在本章中，我们将讨论如何在您自己的数据中心运行、管理和部署 MuleSoft 应用程序。我们还将探讨 Mule\
  \ 运行时在您自己的数据中心运行 MuleSoft 应用程序时提供的不同特性和功能，以及在本地 Mule 运行时上运行和部署应用程序的不同平台架构方法。\n\n\
  在本章中，我们将涵盖以下主题列表：\n\n- 在本地设置 Mule 运行时的硬件和软件要求\n- 从控制平面管理 Mule 服务器\n- Anypoint Private\
  \ Cloud Edition\n- Anypoint 集群和服务器组\n- 高可用性和灾难恢复\n- Mule 运行时有哪些不同的设置方式？\n\n## 技术要求\n\
  \n- 访问 Anypoint Platform – 可在此处创建 30 天免费试用账户：[`anypoint.mulesoft.com/login/signup`](https://anypoint.mulesoft.com/login/signup)\n\
  - 下载 MuleSoft Anypoint Studio（访问 [`www.mulesoft.com/lp/dl/anypoint-mule-studio`](https://www.mulesoft.com/lp/dl/anypoint-mule-studio)）\n\
  \n### 硬件要求\n\n以下是在 Mule 运行时上运行 MuleSoft 应用程序的最低要求，但您可以根据延迟和性能要求进行扩展：\n\n- 2 GHz\
  \ CPU 或虚拟化环境中的 1 个虚拟 CPU\n- 1 GB 内存\n- 4 GB 存储空间\n\nMuleSoft 支持 x64 和 x86 架构，但目前不支持\
  \ ARM。\n\n### 软件要求\n\nMuleSoft 可以在任何启用了受支持 JDK 的 **Java Runtime Engine (JRE)** 的操作系统上运行。\n\
  \n## 为什么选择本地 Mule 运行时？\n\n本地 Mule 运行时被那些对隐私和安全性有高要求、不允许在其组织数据中心之外建立任何设施的组织广泛使用。在这种情况下，您可以利用本地\
  \ Mule 运行时。\n\n使用本地 Mule 运行时，您可以完全控制运行 Mule 应用程序的运行时平面和底层基础设施。您需要完全负责管理底层基础设施、网络、负载均衡器等。\n\
  \n让我们了解一下选择本地 Mule 运行时时，MuleSoft 和客户各自的责任：\n\n- 客户负责设置和配置 Mule 运行时，因为客户对本地实例拥有完全控制权。\n\
  - Mule 运行时将由 MuleSoft 提供。\n- 客户负责管理和配置底层基础设施、负载均衡器、服务器安全、网络等。\n- 运行时平面将由客户管理，控制平面将由\
  \ MuleSoft 管理。如果您不选择 Anypoint Platform **Private Cloud Edition (PCE)**，Anypoint\
  \ Platform 可以作为控制平面。使用 Anypoint Platform PCE，您可以在自己的数据中心设置控制平面。\n\n### 在本地 Mule\
  \ 运行时中运行应用程序\n\n以下是在本地 Mule 运行时中运行 Mule 应用程序的注意事项：\n\n- 本地 Mule 运行时允许您在单个 Mule 运行时中运行多个应用程序。\n\
  - 您可以在同一个 Mule 运行时中部署应用程序的多个版本。\n- Mule 运行时允许您使用域跨多个应用程序共享配置。\n- 运行时支持集群，允许您将服务器分组在一起形成一个集群，该集群可作为一个单元运行。\n\
  - 为了在应用程序的多个实例之间对 HTTP 工作负载进行负载均衡，需要设置外部负载均衡器。\n- 运行时支持服务器组以分布式模式运行应用程序，但应用程序之间完全隔离。当您想要在所有服务器上部署应用程序时，这非常有用。\n\
  \n让我们谈谈如何实现非功能性需求。\n\n### 高可用性\n\n默认情况下，Mule 运行时集群可确保高可用性。如果集群中的任何服务器因计划内停机或故障而不可用，则集群中的其他节点将继续处理现有事件或消息。我们将在本章后面进一步讨论\
  \ Anypoint 集群。\n\n### 可扩展性\n\n本地 Mule 运行时可以水平和垂直扩展。要实现水平扩展，可以向集群或组中添加或移除更多安装了 Mule\
  \ 运行时的服务器。向现有集群或组添加更多服务器会自动将集群或组中现有服务器上可用的所有应用程序部署到新添加的服务器上。\n\n垂直扩展可以通过向现有服务器添加更多计算能力（如内存和存储）来实现。\n\
  \n### 负载均衡器\n\n为了启用 HTTP 工作负载，需要在服务器组或集群前面设置外部负载均衡器。这将确保请求在负载均衡器后面的所有服务器之间进行负载均衡。它将提高性能并为\
  \ HTTP 工作负载启用高可用性。\n\n![图 12.1：本地 Mule 运行时 HTTP 负载均衡](img/B19922_12_1.jpg)\n\n图\
  \ 12.1：本地 Mule 运行时 HTTP 负载均衡\n\n在图 12.1 中，我们有三台安装了 Mule 运行时的服务器，它们使用外部负载均衡器对 HTTP\
  \ 工作负载进行了负载均衡。\n\n在本节中，我们已经了解了本地 Mule 运行时的各种特性，例如高可用性、可扩展性和负载均衡。\n\n在接下来的章节中，我们将介绍本地\
  \ Mule 运行时的各种重要概念，例如 Anypoint 集群、服务器组和域项目。\n\n## Anypoint 集群\n\n\n\n# Anypoint 集群\n\
  \nAnypoint 集群是指在服务器上设置的一组 `Mule` 运行时，它们作为一个单元运行。在 Anypoint 集群中，集群内的所有 `Mule` 运行时相互通信，并通过分布式共享内存网格共享其状态和信息。Anypoint\
  \ 集群使用 `Hazelcast`。\n\n有一个名为 `Hazelcast` 的开源内存数据网格。它提供弹性可扩展的分布式内存计算，这被广泛认为是提升应用程序性能最快、扩展性最强的方法。\n\
  \n`Mule Hazelcast` 服务器实现了一个定制版的 `Hazelcast` 发行版，该版本专为满足 `Mule` 运行时的需求而定制。这种定制实现不会以任何方式修改\
  \ `Hazelcast` 的行为。它只是实现了 `Mule` 运行时所需的基本配置，以及使用 `Log4j` 的默认日志记录配置。\n\n![Figure 12.2:\
  \ On-premises Mule runtime with Anypoint clustering](img/B19922_12_2.jpg)\n\n**图\
  \ 12.2：具有 Anypoint 集群的本地部署 Mule 运行时**\n\n为本地部署 `Mule` 运行时实施集群的好处如下：\n\n*   Anypoint\
  \ 集群将流量分发到集群中的各个节点，从而提高应用程序的整体性能。\n*   通过向集群添加额外节点可以轻松实现水平扩展，它会自动将现有节点上可用的所有应用程序部署到新节点上。\n\
  *   Anypoint 集群支持 `Mule` 运行时对资源（如文件、数据库和 `FTP`）的访问进行自动协调。\n*   它提高了应用程序的整体性能，使用自动故障转移，并支持高可用性以确保业务连续性。\n\
  \nAnypoint 集群支持两种不同类型的集群，可根据组织的网络设置加以利用：\n\n## 单播集群\n\n在单播集群中，您需要配置集群中节点的 IP 地址以建立节点间的通信。在单播集群中，端口从\
  \ `5701` 开始，并从该端口按顺序自动递增以建立节点间的通信。\n\n## 多播集群\n\n在多播集群中，您无需显式配置集群中节点的 IP 地址，因为它会自动检测集群中的其他服务器并启用它们之间的通信。要实施多播集群，需要额外的网络权限，您需要联系网络管理员以确保组织网络支持多播集群。必须在\
  \ IP 地址 `224.2.2.3` 和 `UDP` 端口 `54327` 上启用多播集群才能实施它。在多播集群中，一个集群中的所有节点必须位于同一网段。向集群添加新节点或从集群中移除现有节点不需要重启集群。\n\
  \n# 并发问题\n\nAnypoint 集群可解决以下并发问题：\n\n*   **基于文件的连接器**：所有 `Mule` 实例将访问相同的文件夹，这会导致重复文件处理，或者如果文件被另一个\
  \ `Mule` 应用程序修改或删除，可能会导致处理失败。\n*   **JMS 主题**：所有监听该主题的 `Mule` 实例将收到同一条消息的副本，这会导致消息处理重复。\n\
  *   **JMS 请求/回复队列**：所有 `Mule` 实例可能都在监听同一个回复队列。`Mule` 实例获得的响应可能与其发送的请求无关，这可能导致错误的响应或超时。\n\
  \n启用 Anypoint 集群还可以解决由 `Salesforce Streaming API`、多播连接器等引起的许多其他并发问题。\n\n# 手动设置 Anypoint\
  \ 集群\n\nAnypoint 集群允许您在不注册 Anypoint Platform 的情况下对服务器进行集群化，方法是在所有服务器的 `$MULE_HOME/.mule`\
  \ 中添加具有以下属性的 `mule-cluster.properties`：\n\n```\n...\nmule.cluster.nodes=192.168.11.22,192.168.11.23,192.168.11.24\n\
  mule.cluster.multicastenabled=false\nmule.clusterId=<ClusterId>\nmule.clusterNodeId=<ClusterNodeID>\n\
  ...\n```\n\n以下是可以添加到 `$MULE_HOME/.mule` 中的 `mule-cluster.properties` 的集群配置属性：\n\n\
  | Property Name | Description | Required | Comments |\n| --- | --- | --- | --- |\n\
  | `mule.clusterId` | 集群的唯一标识符。可以是任意字母数字字符串。 | Yes | |\n| `mule.clusterNodeId` |\
  \ 集群内节点的唯一 ID。 | Yes | |\n| `mule.clusterSize` | 属于该集群的节点数量。 | Yes | 可以是 1 到集群节点数之间的任意整数。\
  \ |\n| `mule.cluster.networkinterfaces` | 供 `Hazelcast` 使用的接口的逗号分隔列表。支持通配符。 | No\
  \ | `192.168.2.*`, `192.168.99.99` |\n| `mule.cluster.nodes` | 属于该集群的节点，格式为 `<host:port>`。\
  \ | No | 例如 `172.16.9.24:9000`。仅指定一个 IP 地址即可使服务器加入集群。 |\n| `mule.cluster.quorumsize`\
  \ | 允许您定义集群保持运行状态所需的最少机器数量。 | No | |\n| `mule.cluster.multicastenabled` | (布尔值)\
  \ 启用/禁用多播。如果使用固定 IP 地址进行集群节点发现（请参阅 `mule.cluster.nodes` 选项），则设置为 `false`。 | No |\
  \ 如果设置为 `true`，请勿在 `mule.cluster.nodes` 中设置 IP 地址。 |\n| `mule.cluster.multicastgroup`\
  \ | 要使用的多播组 IP 地址。 | No | |\n| `mule.cluster.multicastport` | 要使用的多播端口号。 | No |\
  \ |\n| `mule.cluster.jdbcstoreurl` | 用于连接数据库的 `JDBC` URL。 | | 仅在存储持久数据时需要。 |\n|\
  \ `mule.cluster.jdbcstoreusername` | 数据库用户名。 | | 仅在存储持久数据时需要。 |\n| `mule.cluster.jdbcstorepassword`\
  \ | 数据库用户密码。 | | 仅在存储持久数据时需要。 |\n| `mule.cluster.jdbcstoredriver` | `JDBC` 驱动程序类名。\
  \ | | 仅在存储持久数据时需要。 |\n| `mule.cluster.jdbcstorequerystrategy` | 用于访问存储对象数据的 SQL\
  \ 方言。 | | 仅在存储持久数据时需要。此属性可取三个不同的值：`mssql`、`mysql` 和 `postgresql`。 |\n| `mule.cluster.jmxenabled`\
  \ | (布尔值) 启用/禁用监控。 | No | |\n| `mule.cluster.listenersenabled` | (布尔值) 启用/禁用成员监听器。\
  \ | | |\n\n**表 12.1：Anypoint 集群配置属性**\n\n## Anypoint 集群中的法定人数管理\n\n当您手动设置 Anypoint\
  \ 集群时，法定人数管理允许您定义集群处于运行状态所需的最少节点数。可以通过在 `$MULE_HOME/.mule` 中的 `mule-cluster.properties`\
  \ 中添加属性 (`mule.cluster.quorumsize`) 来定义法定人数管理所需的集群最小节点数。\n\n设置最小法定人数可以让您获得更好的一致性，并在集群意外丢失节点时保护集群。例如，假设您设置了一个包含七个节点的集群。您将最小法定人数设置为五个节点，这意味着集群要处于运行状态，集群中至少必须有五个节点处于活动状态。\n\
  \n\n\n\n## 法定人数集群\n\n法定人数集群仅适用于使用对象存储的组件。每当发生 `QuorumException` 时，捕获它并执行适当的操作非常重要，例如重试消息、停止进程、发送电子邮件或记录错误详细信息。如果集群中的服务器数量少于法定人数大小，则该操作将被拒绝，并抛出\
  \ `QuorumException`。\n\n## 在 Anypoint Platform 上设置 Anypoint 集群\n\n在这种情况下，Anypoint\
  \ Platform 将充当控制平面，并且可以轻松地从 Runtime Manager 控制台设置 Anypoint 集群，而无需执行任何手动步骤。要设置 Anypoint\
  \ 集群，服务器必须在 Anypoint Platform 上注册。现在，您可以轻松地从 Anypoint Platform 创建集群，并将所有必需的服务器添加为集群的一部分。在创建\
  \ Anypoint 集群时，您可以选择要设置的集群类型，它将自动在集群中所有节点的 `$MULE_HOME/.mule` 下创建包含所有必需属性的 `mule-cluster.properties`。\n\
  \n请确保集群中所有节点上的 Mule 运行时版本相同。\n\n## 持久对象存储\n\n默认情况下，Anypoint 集群是非持久的（瞬态的）。存储在对象存储和\
  \ VM 队列中的数据将在应用程序或 Mule 运行时重新启动时丢失。但 MuleSoft 提供了一个选项，您可以通过使用 JDBC 数据库来设置持久 Anypoint\
  \ 集群。此 JDBC 数据库将在集群中的所有节点之间共享。如果应用程序或 Mule 运行时重新启动，此数据将持久保留。以下是支持的 JDBC 数据库列表：\n\
  \n* MySQL 5.5+\n* PostgreSQL 9\n* Microsoft SQL Server 2014\n\n要启用对象存储，您需要在集群中所有服务器的\
  \ `$MULE_HOME/.mule` 下的 `mule-cluster.properties` 中添加以下属性：\n\n* `mule.cluster.jdbcstoreurl`：JDBC\
  \ URL 连接字符串\n* `mule.cluster.jdbcstoreusername`：数据库用户名\n* `mule.cluster.jdbcstorepassword`：数据库用户密码\n\
  * `mule.cluster.jdbcstoredriver`：JDBC 驱动类名\n* `mule.cluster.jdbcstorequerystrategy`：SQL\
  \ 方言\n\n![图 12.3：Anypoint 集群](img/B19922_12_3.jpg)\n\n图 12.3：Anypoint 集群\n\n## 主节点和从节点\n\
  \nAnypoint 集群具有主节点和从节点的概念，其中集群中的一个节点是主节点，集群中的其他节点是从节点。如果主节点发生故障，其中一个从节点将成为主节点。\n\
  \n每当部署到集群的应用程序具有调度器组件时，调度器轮询仅在主节点上工作。\n\n对于其他源或监听器，如果您希望主节点监听消息，则有 `primaryNodeOnly=true`\
  \ 属性，可在连接器配置期间进行配置：\n\n```\n<flow name=\"jmsListener_flow\">\n    <jms:listener\
  \ config-ref=\"jmsConfig\" destination=\"listen-queue\" primaryNodeOnly=\"true\"\
  />\n    <logger message=\"#[payload]\"/>\n</flow>\n```\n\n在前面的 JMS 监听器连接器配置中，消息将仅由主节点拾取。当您使用主题时，此配置非常方便，因为主题具有将消息传递给所有监听器的属性。通过\
  \ `primaryNodeOnly=true` 属性，它将确保消息传递给主节点上的主题监听器。\n\n![图 12.4：JMS 主题监听器 (primaryNodeOnly=false)](img/B19922_12_4.jpg)\n\
  \n图 12.4：JMS 主题监听器 (primaryNodeOnly=false)\n\n在图 12.4 中，描绘了 JMS 主题监听器，`primaryNodeOnly=false`\
  \ 意味着主题中的同一消息将传递给集群中所有活动的主题监听器。因此，这将导致同一消息被多次处理。主题具有将消息传递给所有活动监听器的属性。\n\n![图 12.5：JMS\
  \ 主题监听器 (primaryNodeOnly=true)](img/B19922_12_5.jpg)\n\n图 12.5：JMS 主题监听器 (primaryNodeOnly=true)\n\
  \n在图 12.5 中，描绘了 JMS 主题监听器，`primaryNodeOnly=true` 意味着主题中的一条消息将传递给集群中主节点上的一个主题监听器。如果主节点发生故障，其中一个从节点将成为主节点并继续处理来自主题的消息。\n\
  \n![图 12.6：JMS 队列监听器 (primaryNodeOnly=false)](img/B19922_12_6.jpg)\n\n图 12.6：JMS\
  \ 队列监听器 (primaryNodeOnly=false)\n\n在图 12.6 中，描绘了 JMS 队列监听器，`primaryNodeOnly=false`\
  \ 意味着消息将在集群中的所有节点之间进行负载均衡，但不会将消息传递给集群中的多个节点。队列具有这样的属性：消息将以轮询方式传递给活动队列监听器中的一个，并提供在集群中的多个节点之间对消息的负载均衡。\n\
  \n![图 12.7：JMS 队列监听器 (primaryNodeOnly=true)](img/B19922_12_7.jpg)\n\n图 12.7：JMS\
  \ 队列监听器 (primaryNodeOnly=true)\n\n在图 12.7 中，描绘了 JMS 队列监听器，`primaryNodeOnly=true`\
  \ 意味着队列中的消息将传递给集群中主节点上的一个队列监听器。如果主节点发生故障，其中一个从节点将成为主节点并继续处理来自队列的消息。\n\n让我们了解如何使用\
  \ Anypoint 集群实现竞争队列消费者模式。竞争队列消费者模式通过同一通道上的多个消费者实现消息的并行处理。多个消费者可以监听同一队列以并行处理消息。\n\
  \n有一个用例，生产者以非常高的速率将消息发送到队列——高于消费者消费消息的速率。为了确保消息以快速速率得到处理，我们可能需要更多消费者实例，它们可以从队列并行消费消息。我们可以通过添加更多消费者（队列监听器）来横向扩展，以提高消息消费速率，这样流量就会分布在多个队列监听器之间。\n\
  \n在 Anypoint 集群中，可以通过在集群中拥有多个设置了 `primaryNodeOnly=false` 的节点来实现此模式。这将确保所有带有队列监听器的节点都在监听队列，并且消息将从监听器并行读取，从而提高整体性能。\n\
  \n竞争队列消费者模式提供以下优势列表：\n\n* **可扩展性**：可以根据发布者发布消息的速率添加或移除消费者。通过增加消费者的数量，消息将分布在消费者之间，以确保消息被独立且更快地处理。\n\
  * **高可用性**：多个消费者监听同一队列。如果其中一个消费者崩溃或关闭，还有其他消费者将继续处理消息。\n* **可靠性和弹性**：如果消息处理在其中一个节点上失败，消息将被传递回队列，确保其可以被重新处理。\n\
  \n## Anypoint 集群中的 VM 队列\n\nVM 队列可用于在集群之间对请求进行负载均衡。例如，您的应用程序包含一系列子流程，集群可以将每个后续子流程分配给集群中空闲且负载较低的\
  \ Mule 运行时。当消息通过 VM 端点传递时，进入集群的消息可以由多个节点处理，如下图所示：\n\n![图 12.8：三节点集群](img/B19922_12_8.jpg)\n\
  \n图 12.8：三节点集群\n\n在图 12.8 中，我们部署了一个包含四个流程的应用程序，每个流程通过 VM 队列进行通信：\n\n\n\n\n* 节点 1\
  \ 上的 Flow 1 接收并处理消息，然后将其发送到 VM 队列\n* 节点 2 上的 Flow 2 可用，从 VM 队列读取消息，完成处理，并将其发布到 VM\
  \ 队列\n* 节点 3 上的 Flow 3 可用，从 VM 队列读取消息，完成处理，并将其发布到 VM 队列\n* 节点 1 上的 Flow 4 可用，从 VM\
  \ 队列读取消息，并完成处理\n\n# Anypoint 服务器组\n\nAnypoint 服务器组是一组服务器，它们作为部署应用程序的单个部署目标，因此您无需在每台服务器上单独部署应用程序。例如，当您想要部署应用程序时，只需选择服务器组作为目标，它就会将应用程序部署到组中的所有服务器。\n\
  \n添加到服务器组的服务器彼此隔离，并且不共享状态。要分配 HTTP 工作负载，您可以使用负载均衡器，它可以在服务器组中的服务器之间分配流量。\n\n![图 12.9：Anypoint\
  \ 服务器组](img/B19922_12_9.jpg)\n\n图 12.9：Anypoint 服务器组\n\n要启用服务器组，请确保所有节点具有相同版本的 Mule\
  \ 运行时，并且节点必须在 Anypoint Platform 上注册。每当存在并发问题时，服务器组都不适用，例如两个节点上的主题监听器接收相同的消息，最终导致消息处理重复。\n\
  \n我们刚了解了 Anypoint 集群和服务器组，它们可以使用本地部署的 Mule 运行时来实现。我们还了解了如何在 Anypoint Platform 中注册由\
  \ MuleSoft 管理的服务器，以及如何从 Anypoint Platform 创建服务器组或集群。\n\n以下是 Anypoint 服务器组和集群之间的比较：\n\
  \n| 比较因素 | Anypoint 服务器组 | Anypoint 集群 |\n| --- | --- | --- |\n| HTTP 流量所需的第三方负载均衡器\
  \ | 是 | 是 |\n| 避免并发问题 | 否 | 是 |\n| 节点相互感知、共享通用信息并同步其状态 | 否 | 是 |\n| 通过在集群节点之间划分工作负载来提高应用程序性能\
  \ | 否 | 是 |\n| 节点相互独立且隔离 | 是 | 否 |\n| 组或集群中的所有节点必须具有相同版本的 Mule 运行时 | 是 | 是 |\n|\
  \ 自动协调对资源（如文件、数据库和 FTP 源）的访问 | 否 | 是 |\n| 集群或组内处理的自动负载均衡 | 否 | 是 |\n\n表 12.2：Anypoint\
  \ 集群与服务器组对比\n\n在下一节中，我们将讨论 Anypoint Platform PCE，它可以在本地数据中心设置，以管理集群、服务器组和服务器。\n\n\
  ## Anypoint Platform 私有云版\n\n借助 Anypoint Platform PCE，您可以在自己的数据中心内设置 Anypoint Platform\
  \ 控制平面，它允许您使用组织的安全策略和合规性要求，在本地服务器上管理、运行或部署 MuleSoft 应用程序。\n\n例如，有一项要求是您希望 MuleSoft\
  \ 控制平面和数据平面都在您自己的数据中心内，并且不想与外部系统或公共互联网连接交互。在这种情况下，您可以使用 Anypoint Platform PCE 在自己的数据中心本地运行\
  \ Anypoint Platform 软件。\n\n所有安全性和其他策略均可在本地获得，并可轻松应用于位于您自己数据中心内的 Anypoint Platform\
  \ PCE 中的应用程序。\n\n以下是 Anypoint Platform PCE 包含的组件：\n\n| 组件 | 包含 | 不包含 | 说明 |\n| ---\
  \ | --- | --- | --- |\n| Anypoint Runtime Manager | X | | 使您能够跟踪和管理已部署的 Mule 应用程序。\
  \ |\n| Runtime Fabric 管理（包括 Security Edge 和令牌化） | | X | 自动化客户托管的 Mule 应用程序和 API\
  \ 网关的部署与编排。 |\n| Anypoint API Manager | X | | 使您能够管理已注册的 API。 |\n| Secrets Manager\
  \ | | X | 为受支持的 Anypoint Platform 服务存储和管理密钥。 |\n| Anypoint Exchange | X | | 使您的组织能够共享各种资产，以便在集成项目中重复使用。\
  \ |\n| 访问管理 | X | | 使您能够创建 Anypoint Platform 账户或配置外部联合身份。 |\n| Anypoint Design Center（不含\
  \ Flow Designer） | X | | 使您能够使用多种建模语言创建 API 规范并创建 RAML API 片段。 |\n| Anypoint Analytics\
  \ – Insights | | X | 提供对部署在 CloudHub 和本地服务器上的 Mule 应用程序上的业务交易和事件的深度可见性。 |\n| Anypoint\
  \ Analytics – Anypoint Visualizer | X | | 使您能够通过应用程序网络图探索应用程序网络。 |\n| Anypoint Analytics\
  \ – API | | X | 提供对 API 使用情况和性能的洞察。 |\n| Anypoint Monitoring | X | | 提供对应用程序网络中集成、Mule\
  \ 流和组件的可见性。 |\n| Object Store | | X | Object Store v2 允许 CloudHub 应用程序跨批处理、Mule\
  \ 组件和应用程序存储数据和状态，无论是从应用程序内部还是通过使用 Object Store REST API。 |\n| Anypoint MQ | | X\
  \ | 一种多租户云消息传递服务，使您能够在租户应用程序之间执行高级异步消息传递场景。 |\n| API 测试 | | X | 提供一个测试框架，使您能够轻松为集成和\
  \ API 构建自动化测试。 |\n\n表 12.3：Anypoint Platform PCE 组件（来源：MuleSoft 官方文档：https://docs.mulesoft.com/）\n\
  \nAnypoint Platform PCE 支持 **4 节点** 和 **7 节点** 配置，以确保高可用性和稳定的性能。**4 节点** 配置是 Anypoint\
  \ Platform PCE 支持的最小配置。这是确保高可用性和故障转移所需的最少节点数。\n\n图 12.10 指的是在启用了 Anypoint 集群的服务器之间，在本地数据中心运行控制平面和数据平面。\n\
  \n![图 12.10：启用 Anypoint 集群的本地数据中心上的 Anypoint 控制平面和运行时平面](img/B19922_12_10.jpg)\n\
  \n图 12.10：启用 Anypoint 集群的本地数据中心上的 Anypoint 控制平面和运行时平面\n\n# 本地运行 Mule 运行时的用例\n\n\
  Mule 运行时可以在本地的单个节点或多个节点上设置。如果您正在寻找更好的性能、高可用性和业务连续性，则不建议在单个节点上运行 Mule 运行时。\n\n设置\
  \ Mule 运行时有多种方法：\n\n* 本地运行时平面，无控制平面\n* 本地运行时平面，控制平面在 Anypoint Platform 上\n* 本地运行时平面，控制平面在\
  \ Anypoint Platform PCE 上（完全本地化）\n\n## 本地 Mule 运行时平面且无控制平面（独立）\n\n在此方法中，Mule 运行时将在本地设置，而无需将服务器注册到\
  \ Anypoint Platform。这意味着我们没有控制平面来管理 Mule 运行时。使用此方法，我们将无法应用任何 API 策略，也无法利用 Anypoint\
  \ Monitoring 来监控部署在本地 Mule 运行时上的应用程序。正如本章前面所讨论的，可以使用手动方法对服务器进行集群。\n\n![图 12.11：本地\
  \ Mule 运行时平面且无控制平面（独立）](img/B19922_12_11.jpg)\n\n图 12.11：本地 Mule 运行时平面且无控制平面（独立）\n\
  \n\n\n前述架构展示了在运行时平面上进行手动集群，而无需将服务器注册到 Anypoint Platform 的控制平面。\n\n## Mule 运行时平面部署在本地，控制平面部署在\
  \ Anypoint Platform（混合模式）\n\n在此方法中，Mule 运行时将在本地设置，所有服务器都将注册到 Anypoint Platform。Anypoint\
  \ Platform 控制平面位于组织防火墙之外，因此需要允许本地服务器与 Anypoint Platform 上的控制平面之间进行通信。本地服务器将向控制平面发送元数据，这将在控制平面上生成诸如\
  \ CPU 利用率和内存利用率之类的指标。通过控制平面，您可以管理本地服务器，例如启动和停止 Mule 运行时及应用程序，以及查看服务器状态。\n\n下图显示了本地\
  \ Mule 运行时如何与 Anypoint Platform 上的控制平面进行通信。\n\n![图 12.12：Mule 运行时平面部署在本地，控制平面部署在\
  \ Anypoint Platform（混合模式）](img/B19922_12_12.jpg)\n\n图 12.12：Mule 运行时平面部署在本地，控制平面部署在\
  \ Anypoint Platform（混合模式）\n\n我们已经讨论了 Anypoint 集群，可以将所有服务器集群化以作为一个单元运行。这可以通过 Anypoint\
  \ Platform 中的 Runtime Manager 轻松完成。`图 12.12` 展示了一个带有控制平面的 Anypoint 集群 Mule Runtime\
  \ 设置。采用这种方法，元数据将离开组织的数据中心，以生成 CPU 和内存利用率等指标，并管理集群、服务器和服务器组。\n\n## Mule 运行时平面部署在本地，控制平面部署在\
  \ Anypoint Platform PCE（完全本地化）\n\n采用这种方法，运行时平面和控制平面均位于您自己的数据中心。我们之前讨论过 Anypoint\
  \ Platform PCE，它可在本地使用，部署在本地 Mule 运行时上的应用程序可以连接到 Anypoint Platform PCE，而无需任何公共互联网连接。以下是\
  \ Anypoint Platform PCE 提供的几项功能：\n\n*   Anypoint Platform PCE 支持使用 Runtime Manager\
  \ 管理部署在本地 Mule 运行时上的应用程序，并设置 Anypoint 集群、服务器组等\n*   Anypoint Platform PCE 支持使用 API\
  \ Manager 管理部署在本地 Mule 运行时上的 API 生命周期，例如应用 API 策略和管理 API 实例\n*   Anypoint Platform\
  \ PCE 支持 Anypoint Monitoring 和 Anypoint Visualizer\n\n![图 12.13：Mule 运行时平面部署在本地，控制平面部署在\
  \ Anypoint Platform（混合模式）](img/B19922_12_13.jpg)\n\n图 12.13：Mule 运行时平面部署在本地，控制平面部署在\
  \ Anypoint Platform（混合模式）\n\n在 `图 12.13` 中，您可以看到控制平面和运行时平面均位于同一个数据中心，无需公共互联网连接即可建立控制平面和运行时平面之间的通信。采用这种方法，您需要管理控制平面和运行时平面的整个基础设施网络，因为两者都在您自己的数据中心中。当您的组织有严格的合规性和安全要求，意味着无法使用基于云的解决方案时，通常会采用此解决方案。\n\
  \n当您的组织有严格的合规策略，要求数据或元数据不得离开托管在本地的组织数据中心，并且您拥有强大的团队来管理底层基础设施和网络时，这种方法非常有用。\n\n#\
  \ 在单个端口上运行多个 MuleSoft 应用程序（Mule 域）\n\nMule 域允许您在部署在本地 Mule 运行时上的应用程序之间共享资源。您可能需要在多个应用程序之间共享连接器配置、共享属性和错误处理程序，而域项目是应用程序之间共享资源的唯一方式。\n\
  \n在本地部署 Mule 时，您可以指定全局配置，例如默认错误处理、共享属性、调度器池和连接器配置，以便在部署在同一域上的所有应用程序之间共享。要使用 Mule，您需要创建一个域，然后从每个应用程序链接到它。这意味着分配给您的\
  \ Mule 域的每个应用程序现在都将有权访问该域中的共享资源。\n\n当您将多个服务部署到同一个本地 Mule 运行时引擎时，域的使用可显著提高性能。由于域为所有共享资源提供了一个中心点，它们使类加载过程更快，特别是因为\
  \ `POM.xml` 中定义的域依赖项也在域应用程序中共享。\n\n以下是可以作为域项目一部分的共享配置：\n\n![图 12.14：域项目](img/B19922_12_14.jpg)\n\
  \n图 12.14：域项目\n\n让我们考虑在具有 HTTP 监听器的本地 Mule 运行时上部署应用程序。每个应用程序必须部署在不同的端口上，并且它们不得与其他应用程序的端口重叠。这增加了管理多个端口的复杂性。为了解决这个问题，我们可以使用域项目，在任意端口（例如\
  \ `8081`）上添加 HTTP 监听器连接配置。应用程序可以引用域项目，并引用域项目中的 HTTP 监听器配置。这样，所有应用程序都可以引用域项目和 HTTP\
  \ 监听器配置——您无需为每个项目配置单独的端口，并且可以轻松地从域项目引用连接器配置。\n\n![图 12.15：使用域项目在单个端口上运行 MuleSoft\
  \ 应用程序](img/B19922_12_15.jpg)\n\n图 12.15：使用域项目在单个端口上运行 MuleSoft 应用程序\n\n在前面的图表中，部署到\
  \ Mule 运行时的每个应用程序都引用域项目以使用 HTTP 监听器连接器配置，因此应用程序可以在单个端口 `8081` 上运行。\n\n## 如何在 API\
  \ 主导的连接架构中使用域项目\n\n正如我们所知，API 主导的连接架构有三层：体验 API、流程 API 和系统 API。我们通常要求不向外部暴露系统 API\
  \ 和流程 API，只有体验 API 可以由外部消费者调用。\n\n为了实现这一点，我们将使用三个域项目：`exp-domain-project-8081`、`prc-domain-project-8082`\
  \ 和 `sys-domain-project-8083`。每个域项目将具有具有不同端口的 HTTP 监听器连接器配置，如下表所示。\n\n| **层** |\
  \ **域项目** | **HTTP 监听器配置 – 端口** | **负载均衡器** |\n| --- | --- | --- | --- |\n| 体验 API\
  \ | `exp-domain-project-8081` | `8081` | 外部负载均衡器 |\n| 流程 API | `prc-domain-project-8082`\
  \ | `8082` | 内部负载均衡器（可选） |\n| 系统 API | `sys-domain-project-8083` | `8083` | 内部负载均衡器（可选）\
  \ |\n\n表 12.4：域项目配置\n\n![图 12.16：带有 API 主导连接的域项目](img/B19922_12_16.jpg)\n\n图 12.16：带有\
  \ API 主导连接的域项目\n\n在 `图 12.16` 中，运行在端口 `8081` 上的体验 API 暴露给外部负载均衡器，而系统 API 和流程 API\
  \ 可以暴露给内部负载均衡器，因此体验 API 可以使用内部 URL 与流程 API 通信，流程 API 可以使用内部 URL 与系统 API 通信。如果在流程\
  \ API 和系统 API 前面设置了内部负载均衡器，则可以使用内部负载均衡器进行内部通信。\n\n# 使用 Mule Maven 插件在本地部署 MuleSoft\
  \ 应用程序\n\n\n\n# Mule Maven 插件\n\nMule Maven 插件是一个重要的 Maven 插件，用于在本地部署、取消部署和打包 MuleSoft\
  \ 应用程序。可以在应用程序的 `POM.xml` 中配置以下插件，其中包含在本地部署和运行应用程序所需的所有属性：\n\n```xml\n<plugin>\n\
  \  <groupId>org.mule.tools.maven</groupId>\n  <artifactId>mule-maven-plugin</artifactId>\n\
  \  <version>3.8.6</version>\n  <extensions>true</extensions>\n  <configuration>\n\
  \    <standaloneDeployment>\n      <muleHome>${mule.home}</muleHome>\n      <muleVersion>${app.runtime}</muleVersion>\n\
  \    </standaloneDeployment>\n  </configuration>\n</plugin>\n```\n\n在前述 Mule Maven\
  \ 插件中，`${}` 下定义的值是可以通过 `mule deploy` 命令传递的参数，如下所示：\n\n```bash\nmule deploy –DmuleDeploy\
  \ -Dapp.runtime=4.3.0 -Dmule.home=/opt/mule/bin\n```\n\n## 本地部署属性\n\n以下是在本地部署应用程序时可以在\
  \ Mule Maven 插件上配置的属性：\n\n| 参数 | 描述 | 是否必需 |\n| --- | --- | --- |\n| `standaloneDeployment`\
  \ | 顶层元素。 | 是 |\n| `applicationName` | 指定部署时使用的应用程序名称。 | 是 |\n| `muleVersion` |\
  \ 本地计算机实例上运行的 Mule 版本。如果此值与部署目标上运行的 Mule 版本不匹配，插件将抛出异常。如果这些值不匹配，Mule Maven 插件不会下载\
  \ Mule 运行时引擎。 | 是 |\n| `muleHome` | 本地计算机上 Mule 实例的位置。 | 是 |\n| `deploymentTimeout`\
  \ | 部署过程开始与确认制品已部署之间允许的经过时间（以毫秒为单位）。默认值为 1,000,000。 | 否 |\n| `skip` | 当设置为 `true`\
  \ 时，跳过插件部署目标。其默认值为 `false`。 | 否 |\n\n*表 12.5：Mule Maven 插件属性*\n\n## ARM 部署\n\nMule\
  \ Maven 插件支持 `Anypoint Runtime Manager` (`ARM`) 部署，以将应用程序部署到目标，例如在 Anypoint Platform\
  \ 上注册的服务器、集群或服务器组。可以在应用程序的 `POM.xml` 中配置以下插件，其中包含使用 ARM 部署和运行应用程序所需的所有属性：\n\n```xml\n\
  <plugin>\n  <groupId>org.mule.tools.maven</groupId>\n  <artifactId>mule-maven-plugin</artifactId>\n\
  \  <version>3.7.1</version>\n  <extensions>true</extensions>\n  <configuration>\n\
  \    <armDeployment>\n      <muleVersion>${app.runtime}</muleVersion>\n      <uri>https://anypoint.mulesoft.com</uri>\n\
  \      <target>${target}</target>\n      <targetType>${target.type}</targetType>\n\
  \      <username>${username}</username>\n      <password>${password}</password>\n\
  \      <environment>${environment}</environment>\n      <properties>\n        <key>value</key>\n\
  \      </properties>\n    </armDeployment>\n  </configuration>\n</plugin>\n```\n\
  \n在前述 Mule Maven 插件中，`${}` 下定义的值是可以通过 `mule deploy` 命令传递的参数，如下所示：\n\n```bash\nmule\
  \ deploy –DmuleDeploy -Dapp.runtime=4.3.0 -Dtarget=test-cluster -Dtarget.type=cluster\
  \ -Dusername=Anypoint_Username -Dpassword=Anypoint_Password -Denvironment=Sandbox\n\
  ```\n\n## ARM 部署属性\n\n以下是使用 ARM 部署应用程序时可以在 Mule Maven 插件上配置的属性。\n\n| 参数 | 描述 | 是否必需\
  \ |\n| --- | --- | --- |\n| `armDeployment` | 顶层元素。 | 是 |\n| `applicationName` |\
  \ 指定部署时使用的应用程序名称。 | 是 |\n| `muleVersion` | 应用程序在部署目标中运行所需的 Mule 版本。 | 是 |\n| `uri`\
  \ | Anypoint Platform URI。 | 否 |\n| `target` | 安装 Mule 实例的服务器名称。 | 是 |\n| `targetType`\
  \ | 要部署到的目标类型。有效值为 `cluster`、`server` 和 `serverGroup`。 | 是 |\n| `username` | 安装\
  \ Mule 实例的服务器的用户名。 | 仅当使用 Anypoint Platform 凭据登录时 |\n| `password` | 安装 Mule 实例的服务器的密码。\
  \ | 仅当使用 Anypoint Platform 凭据登录时 |\n| `environment` | 安装 Mule 实例的服务器的环境名称。此值必须与\
  \ Runtime Manager 帐户中配置的任何环境匹配。 | 是 |\n| `businessGroup` | 部署的业务组路径。 | 否 |\n| `businessGroupId`\
  \ | 部署的业务组 ID。 | 否 |\n| `deploymentTimeout` | 部署过程开始与确认制品已部署之间允许的经过时间（以毫秒为单位）。默认值为\
  \ 1000000。 | 否 |\n| `server` | 具有 Anypoint Platform 凭据的 Maven 服务器。仅当你想要使用存储在 Maven\
  \ `settings.xml` 文件中的凭据时才需要此项。这不是 Mule 服务器名称。 | 否 |\n| `properties` | 顶层元素。 | 否\
  \ |\n| `skip` | 当设置为 `true` 时，跳过插件部署目标。其默认值为 `false`。 | 否 |\n| `skipDeploymentVerification`\
  \ | 当设置为 `true` 时，跳过已部署应用程序的状态验证。其默认值为 `false`。 | 否 |\n| `authToken` | 指定用于访问平台的授权令牌。你可以使用此身份验证方法代替设置用户名和密码。\
  \ | 仅当使用授权令牌登录时 |\n| `connectedAppClientId` | 指定 Connected Apps 的 `clientID` 值。\
  \ | 仅当使用 Connected Apps 凭据登录时 |\n| `connectedAppClientSecret` | 指定 Connected Apps\
  \ 的密钥。 | 仅当使用 Connected Apps 凭据登录时 |\n| `connectedAppGrantType` | 指定唯一支持的连接类型：`client_credentials`。\
  \ | 仅当使用 Connected Apps 凭据登录时 |\n\n*表 12.6：使用 ARM 部署时的 Mule Maven 插件属性*\n\n## 部署和取消部署命令\n\
  \n以下是部署和取消部署应用程序的命令：\n\n```bash\nmvn clean deploy –DmuleDeploy (在本地部署应用程序)\nmvn\
  \ mule:undeploy (从本地取消部署应用程序)\n```\n\n# 使用 Anypoint Runtime Manager (ARM) REST API\
  \ 在本地部署 MuleSoft 应用程序\n\nMuleSoft 提供 ARM API，用于在 Anypoint Platform 上注册的集群、服务器组或服务器上部署应用程序。它还提供用于管理服务器、集群和服务器组的端点，并支持通过\
  \ ARM REST API 进行许多其他操作。以下是完整的操作列表：[`anypoint.mulesoft.com/exchange/portals/anypoint-platform/f1e97bc6-315a-4490-82a7-23abe036327a.anypoint-platform/arm-rest-services/`](https://anypoint.mulesoft.com/exchange/portals/anypoint-platform/f1e97bc6-315a-4490-82a7-23abe036327a.anypoint-platform/arm-rest-services/)。\n\
  \n下表展示了使用 ARM API 将应用程序部署到目标的过程：\n\n| 方法 | POST |\n| --- | --- |\n| API 端点 | `https://anypoint.mulesoft.com/hybrid/api/v1/applications`\
  \ |\n| 请求体 | ```json { \"applicationSource\": { \"source\": \"EXCHANGE\", \"groupId\"\
  : \"com.mulesoft.hybrid\", \"artifactId\": \"platformApp\", \"version\": \"0.0.1\"\
  \ }, \"targetId\": 101, \"artifactName\": \"test-app\" } ``` |\n| 认证 | OAuth 2.0（Connected\
  \ Apps 或 Anypoint 用户名和密码） |\n| 标头 | `X-ANYPNT-ORG-ID`（Anypoint Platform 的组织 ID）、`X-ANYPNT-ENV-ID`（Anypoint\
  \ Platform 的环境 ID）和 `Content-Type`（`application/json`） |\n\n*表 12.7：ARM API*\n\n\
  \n\n\n有关 ARM API 的更多详细信息，请参阅 Anypoint 开发者门户。链接如下：[`anypoint.mulesoft.com/exchange/portals/anypoint-platform/f1e97bc6-315a-4490-82a7-23abe036327a.anypoint-platform/arm-rest-services/minor/1.0/console/method/%231517/`](https://anypoint.mulesoft.com/exchange/portals/anypoint-platform/f1e97bc6-315a-4490-82a7-23abe036327a.anypoint-platform/arm-rest-services/minor/1.0/console/method/%231517/)\n\
  \n# 部署 Mule 以实现高可用性和灾难恢复策略\n\n应用程序停机可能随时发生。这可能是由于应用程序和基础设施维护而计划内的，也可能是由于 JVM 故障或崩溃、硬件故障或网络问题而导致的非计划内停机。由于全球向电子商务的转变，企业希望其应用程序能以\
  \ 100% 的正常运行时间运行，具备高可用性，并能从任何灾难中快速恢复，而不影响业务。\n\n有多种方法可以解决高可用性和灾难恢复策略，其中一种方法是 Anypoint\
  \ 集群，它提供基本的故障转移功能，我们在本章前面已经讨论过。借助 Anypoint 集群，当主节点发生故障时，备用节点将成为主节点以恢复处理。\n\nMuleSoft\
  \ 提供了四种实现高可用性的选项：\n\n- 冷备\n- 温备\n- 热备 - 主备模式\n- 双活模式\n\n## 冷备\n\n在冷备方法中，一个或多个操作系统未运行。这基本上是生产环境或虚拟机的备份。一旦检测到任何中断，备份操作系统和\
  \ Mule 运行时将启动。在启动备份操作系统和 Mule 运行时并将流量重定向到备份期间，将会发生一些停机时间。\n\n![Figure 12.17: Cold\
  \ standby](img/B19922_12_17.jpg)\n\n图 12.17：冷备\n\n## 温备\n\n在温备方法中，备份操作系统正在运行，但 Mule\
  \ 运行时未运行。一旦检测到任何中断，备份 Mule 运行时将启动。在启动运行时并将流量重定向到备份期间，可能会发生少量停机时间。\n\n![Figure 12.18:\
  \ Warm standby](img/B19922_12_18.jpg)\n\n图 12.18：温备\n\n## 热备 - 主备模式\n\n在此方法中，备份\
  \ Mule 运行时和操作系统处于运行状态。但是，它们不处理任何请求。一旦检测到任何中断，备份将开始处理请求。在将流量重定向到备份时，可能会发生最短的停机时间。\n\
  \n![Figure 12.19: Hot standby – active-passive](img/B19922_12_19.jpg)\n\n图 12.19：热备\
  \ - 主备模式\n\n## 双活模式\n\n在此方法中，备份 Mule 运行时和操作系统处于运行状态。环境被集群化，负载均衡器将流量路由到所有环境。此方法下没有停机时间。\n\
  \n![Figure 12.20: Active-active](img/B19922_12_20.jpg)\n\n图 12.20：双活模式\n\n也可以对单集群环境进行负载均衡，这将确保服务零停机时间。要实施此方法，环境之间的网络延迟必须小于\
  \ 10 毫秒。\n\n![Figure 12.21: Active-active – single-cluster](img/B19922_12_21.jpg)\n\
  \n图 12.21：双活模式 - 单集群\n\n## 在零停机时间内升级 Mule 运行时或扩展底层基础设施\n\n我们通常有升级 Mule 运行时或进行硬件更改（如增加内存或存储）的需求，这些操作必须实现零停机时间，以确保业务连续性。确保升级或进行硬件更改后\
  \ Mule 运行时的稳定性也很重要。当前的 Mule 运行时可视为基准生产环境，当运行时配置变更和硬件升级时，将创建一个新环境。\n\n为了对新环境建立信心，我们将使用金丝雀部署方法，即将少量流量发送到新环境，其余流量发送到基准环境。随着我们对新部署应用程序信心的增加，我们将逐渐增加发送到新环境的流量。\n\
  \n一旦 100% 的流量被路由到新环境，基准环境将被终止，新环境将成为基准生产环境。下图说明了流量如何在新环境中缓慢增加，最终终止旧环境。\n\n![Figure\
  \ 12.22: Upgrading a Mule runtime or scaling the underlying infrastructure without\
  \ any downtime](img/B19922_12_22.jpg)\n\n图 12.22：在零停机时间内升级 Mule 运行时或扩展底层基础设施\n\n\
  在此方法中，运行额外实例可能会产生临时成本（这可能持续几分钟、几小时或几天）。\n\n## Mule 本地部署运行时安全性\n\n安全性对任何企业都至关重要，旨在确保通过软件应用程序存储和检索的信息安全受保护，并防止未经授权的用户访问。信用卡详细信息和社会安全号码等信息应以安全方式访问以执行任何交易，且仅可供合法或授权用户访问。\n\
  \nMule 运行时提供了多种用于实施安全性的工具：\n\n- 用于加密和解密数据的加密模块。支持的策略包括 JCE、PGP 和 XML，用于加密和签名数据。\n\
  - 安全配置属性，用于以加密形式将凭据或敏感数据存储在属性文件中。\n- 启用 FIPS 140-2 认证环境\n- 开箱即用的 API 策略，如 JWT 验证令牌、客户端凭据强制执行策略，以及其他可在\
  \ API 上启用以进行授权和身份验证的安全策略。\n- TLS 安全配置 - 通过配置 TLS，可保护 Mule 应用程序的传输安全。支持 TLS 1.1 和\
  \ TLS 1.2。\n- Spring Security，用于启用基本身份验证或带有 LDAP 提供程序的基本身份验证。\n\n## 总结\n\n在本章中，我们对本地部署\
  \ Mule 运行时的属性和功能有了更深入的了解。此外，我们还探讨了 Anypoint 集群、服务器组、域项目以及高可用性、可扩展性和负载均衡等非功能性先决条件等重要主题。另外，我们还探讨了升级\
  \ Mule 运行时、实施安全措施和灾难恢复替代方案等主题。展望未来，下一章将重点关注 Government Cloud（政府云）和 EU Control Plane（欧盟控制平面），并特别关注需要考虑的独特因素。\n\
  \n## 延伸阅读\n\n- Anypoint Platform PCE 支持的配置：[`docs.mulesoft.com/private-cloud/3.2/supported-cluster-config`](https://docs.mulesoft.com/private-cloud/3.2/supported-cluster-config)\n\
  - FIPS 140-2 合规性支持：[`docs.mulesoft.com/mule-runtime/4.5/fips-140-2-compliance-support`](https://docs.mulesoft.com/mule-runtime/4.5/fips-140-2-compliance-support)\n\
  - 安全性：[`docs.mulesoft.com/mule-runtime/4.5/securing`](https://docs.mulesoft.com/mule-runtime/4.5/securing)\n\
  - 集群：[`docs.mulesoft.com/runtime-manager/cluster-about`](https://docs.mulesoft.com/runtime-manager/cluster-about)\n\
  - 本章中的一些表格摘自 MuleSoft 官方文档：[`docs.mulesoft.com/`](https://docs.mulesoft.com/)\n"
- '# 13 Government Cloud 和 EU Control Plane - 特殊考量






  本章将向您展示在使用 Government Cloud 与 EU 控制平面时所涉及的一些重要差异。本章将简要介绍 FedRAMP 合规性。您还将了解 Government
  Cloud 是如何部署在一个符合 FedRAMP 标准的特殊 AWS 区域中的。


  在本章中，我们将涵盖以下主题：


  *   FedRAMP 要求与合规性

  *   Government Cloud 注意事项

  *   EU 控制平面的 EU 合规性


  # FedRAMP 合规性


  **联邦风险和授权管理计划**（**FedRAMP**）是美国的一项全政府计划，它为云产品和服务的安全评估、授权和持续监控提供了一种标准化方法。对于联邦机构内部低风险和中等风险影响级别的云部署和服务模型，这是一项强制性计划。MuleSoft
  Government Cloud 旨在符合 FedRAMP 标准。这意味着：


  *   **安全评估**：为确保 MuleSoft Government Cloud 满足 FedRAMP 要求，其已接受全面的安全评估。这包括证明能有效防御数据泄露和其他安全事件。

  *   **授权**：在成功完成安全评估后，MuleSoft Government Cloud 获得了授权，表明该平台已满足 FedRAMP 要求。

  *   **持续监控**：MuleSoft 持续监控 Government Cloud 的安全性，以确保遵守 FedRAMP 法规。这包括定期报告和安全控制更新。

  *   **数据保护**：MuleSoft Government Cloud 提供强大的数据保护功能，例如安全数据传输、访问控制和数据加密。这些措施旨在满足 FedRAMP
  规定的严格安全要求。

  *   **透明度**：作为致力于维护 FedRAMP 标准的一部分，MuleSoft 保持其安全程序公开透明。这使用户能够验证是否采取了适当的预防措施。


  实际上，FedRAMP 合规性意味着 MuleSoft Government Cloud 是一家值得信赖的云服务提供商，符合严格的安全标准，适合美国政府机构及其合作伙伴使用。


  **第三方评估机构**（**3PAO**）根据 FedRAMP 和 NIST 800-53A 法规进行了安全评估。该评估考察了现有安全控制措施在保护 MuleSoft
  Government Cloud 及其处理、传输和存储的数据的可用性、机密性和完整性方面的有效性。


  MuleSoft 的 Government Cloud 环境设置在 **Amazon Web Services**（**AWS**）的 AWS GovCloud
  上。AWS GovCloud 是一个符合 **国际武器贸易条例 (ITAR)**、经 FedRAMP 高影响级别授权、并拥有 DOD IL2、IM4 和 IA5
  临时授权的环境。为了妥善保护政府数据的机密性、完整性和可用性，MuleSoft Government Cloud 通过确保符合 FedRAMP 特殊要求，加强了其在
  AWS 中的配置。


  # 什么是 MuleSoft Government Cloud？


  MuleSoft 的 Government Cloud 是 Anypoint Platform 的定制版本，专为政府组织而创建。它提供了一个安全、符合 FedRAMP
  标准的环境，用于创建和实施集成与 API。所有数据和应用流量都停留在安全的网络屏障之后，以提高安全性，确保遵守要求限制访问和数据隐私的法律法规。


  以下是 Government Cloud 的主要功能：


  *   **FedRAMP 授权**：MuleSoft 的 Government Cloud 符合政府施加的监管标准，该标准包含复杂的安全防护措施。

  *   **安全、隔离的平台**：为了为敏感信息提供最高级别的数据保护，Government Cloud 运行在隔离的网络中。

  *   **设计、构建、部署和管理 API**：Government Cloud 赋予用户与基础 Anypoint Platform 相同的功能，使他们能够在一个包中规划、开发、实施和监督
  API 与集成。

  *   **连接任何系统**：得益于 Government Cloud，任何系统、服务或数据源都可以安全连接。

  *   **高可用性**：它提供零停机的自动化容量扩展和云数据流管理。


  MuleSoft Government Cloud 包含 Anypoint Platform 的所有运行时平面功能（服务和 Mule 运行时引擎），以及部分控制平面（基于浏览器的
  API 管理和 Mule 运行时引擎实例管理）功能。Government Cloud 支持端到端的 API 生命周期管理和完整的 API 主导连接技术。政府组织可以使用
  MuleSoft 的 Government Cloud 来构建、部署和管理集成与 API，同时遵守严格的安全和合规要求。MuleSoft 的 Government
  Cloud 是一个强大的 API 主导连接工具。


  ## Government Cloud 注意事项


  在考虑 MuleSoft Government Cloud 时，请务必记住以下几点：


  *   **合规性**：美国政府使用的所有云服务都必须符合 FedRAMP，MuleSoft Government Cloud 满足这一要求。

  *   **增强的安全性**：为了保护敏感数据，MuleSoft Government Cloud 提供尖端的安全功能和协议。它们包括数据保护、访问控制和强大的网络安全。

  *   **数据驻留**：所有数据和元数据均位于美国境内，这对于对数据驻留有严格要求的政府组织来说是有利的。

  *   **集成能力**：MuleSoft 提供强大的 API 主导连接功能，例如安全的系统、服务和数据源连接。

  *   **专用环境**：为了确保更高的可靠性和性能，Government Cloud 提供隔离容量的专用环境。

  *   **高可用性**：为了确保正常运行时间，该平台采用多活实例构建，以实现高可用性。

  *   **可扩展性**：该平台提供可扩展的解决方案，包括针对数据量和用户数量变化的调整，以满足机构不断变化的需求和要求。

  *   **频繁更新**：为了保持符合不断变化的安全和监管标准，MuleSoft 定期更新其 Government Cloud 平台。

  *   **非功能性需求**：除了功能性需求外，可能影响用户体验的其他因素包括系统性能、延迟和正常运行时间。


  通过牢记这些因素，政府组织可以在保持法律合规并为公民提供更好的数字服务的同时，充分利用 MuleSoft Government Cloud。


  ## MuleSoft Government Cloud 中的安全性


  如前所述，MuleSoft Government Cloud 满足所有 FedRAMP 安全要求、合规性和标准。MuleSoft Government Cloud
  还遵循以下额外的安全协议：


  *   **联邦信息处理标准**（**FIPS** 140-2）

  *   **传输层安全性**（**TLS**）1.2 加密

  *   **美国国家标准与技术研究院**（**NIST**）800-53

  *   **独立国家联合体**（**CIS**）基准


  ## MuleSoft Government Cloud 中的 Anypoint Virtual Private Cloud 和 Virtual Private
  Network


  MuleSoft 的 Government Cloud 使用 Anypoint **Virtual Private Cloud**（**VPC**）和 **Virtual
  Private Network**（**VPN**）来隔离 Mule 应用程序，并在这些应用程序与本地网络之间提供安全、私密的连接。





  # MuleSoft Government Cloud 概述


  ## Anypoint VPC 和 VPN


  **Anypoint VPC**：这允许您创建一个受您控制的虚拟网络，就像 MuleSoft Government Cloud 内部的一个私有隔离区域。VPC
  允许您创建一个虚拟专用网络，其中包含应用程序和 API 等资源，这些资源与 Government Cloud 中的所有其他资源完全隔离。


  **Anypoint VPN**：VPN 扩展了专用网络，允许资源发送和接收数据，就如同它们直接连接到专用网络一样。Anypoint VPN 保证您的 Anypoint
  VPC 与本地网络之间通过公共互联网传输的所有数据的安全性和加密性。


  通过使用 Anypoint VPC 将应用程序数据与公共视图隔离，增加了一层额外的安全性。Anypoint VPN 安全地将您的本地网络连接到您的 VPC，使您能够从专用网络访问信息，而无需担心数据在传输过程中被拦截。通过提供安全、私密的数据入口和出口点，Anypoint
  VPC 和 VPN 协同工作以提高系统安全性和隐私性。


  它们提供的优势包括改进的网络性能、数据安全性以及更多的网络自定义选项。


  这些工具在 Government Cloud 的背景下尤为重要，因为它们解决了政府组织固有的更高安全性和合规性要求。


  ## MuleSoft Government Cloud 中的专用负载均衡器


  Government Cloud 环境包含一个专用负载均衡器，这是一种基于云的服务，可将传入的网络流量分发到 Government Cloud 中的多个 MuleSoft
  应用程序工作器。这确保了负载在环境中均匀分布，从而促进有效的资源利用、最佳性能和更高的应用程序可用性。


  以下是在 MuleSoft Government Cloud 中拥有专用负载均衡器的主要优势：


  *   **性能提升**：通过均匀分发网络流量，负载均衡器有助于防止任何单个应用程序工作器成为性能瓶颈。

  *   **可靠性和可用性提高**：当操作工作器出现问题时，负载均衡器会将流量重新路由到其他正常运行的服务器，以便您的应用程序保持可用。

  *   **安全套接字层 (SSL) 终止**：由单独的负载均衡器提供 SSL 终止支持。这意味着负载均衡器处理与用户会话的 SSL 握手，从而为后端应用程序工作器释放资源并提高系统性能。

  *   **支持扩展**：专用负载均衡器在可扩展环境中也能有效工作，随着实例投入服务或退出服务，动态地跨多个实例分发网络负载。

  *   **自定义域**：您还可以配置路由规则，允许使用专用负载均衡器将流量定向到特定域或多个域。


  在经常托管任务关键型应用程序的 Government Cloud 中，使用专用负载均衡服务器对于维持高可用性和性能尤为重要。


  Government Cloud 中的专用负载均衡器公开两个 A 记录，以接受来自本地专用网络和公共网络的流量。其中一条记录是内部的（`internal-<lb-name>.lb-gprod-rt.anypointdns.net`），另一条是外部的（`<lb-name>.lb-gprod-rt.anypointdns.net`）。


  ## MuleSoft Government Cloud 控制平面


  MuleSoft Government Cloud 支持作为符合 FedRAMP 标准的控制平面的 Anypoint Platform。控制平面是您设计、部署、共享和管理
  API 及应用程序的地方。


  控制平面包含以下组件：


  *   Anypoint Design Center，用于设计 API 规范

  *   Anypoint Management Center，用于管理用户、API 和集成

  *   Anypoint Exchange，一个用于发布和共享 API 规范、API 和集成的市场

  *   Anypoint Runtime Manager，用于将 API 和集成部署到云或数据中心


  ## MuleSoft Government Cloud 运行时平面


  API 和 Mule 应用程序在 Anypoint Platform 的运行时平面组件上部署并可供用户使用。Mule 运行时服务器、Anypoint 连接器和支持服务是运行平面的一部分。


  ## MuleSoft Government Cloud 中的独立 Mule 支持


  MuleSoft Government Cloud 部署允许将 Mule 运行时引擎实例部署到本地环境中（独立 Mule 实例）。独立 Mule 实例及其 MuleSoft
  支持不在 FedRAMP 范围内。这意味着客户负责确保与 Salesforce 交换的所有数据符合任何适用的数据保护原则、要求和标准。请查看 MuleSoft
  系统安全计划以了解 FedRAMP 范围。


  需要 Mule 运行时版本 `4.1.x` 或更高版本以及运行时代理版本 `2.4.9` 或更高版本以符合 FIPS 合规性。独立 Mule 支持使联邦、州和地方政府客户能够在其私有云或本地环境中部署独立
  Mule 实例，并使用 MuleSoft Government Cloud 控制平面进行管理。


  以下组件不受 MuleSoft Government Cloud 支持：


  *   Anypoint Analytics

  *   Anypoint Code Builder

  *   API Data Gateway

  *   API Governance

  *   Anypoint Flex Gateway

  *   Anypoint Runtime Fabric

  *   Anypoint Security

  *   Anypoint Service Mesh


  ## MuleSoft Government Cloud 的部署模型


  部署 Government Cloud 有两种选择。第一种选择是全托管模型，即控制平面和运行时平面都在云中。第二种选择是控制平面在云中，而运行时平面在客户的数据中心中。如果控制平面在云中，而运行时平面托管在
  MuleSoft 云或客户的数据中心中，您也可以结合使用这两种选择。


  ### 全托管部署模型


  在此部署模型中，控制平面和运行时平面将由 MuleSoft 管理。客户无需担心底层基础设施，且完全符合 FedRAMP 标准。


  `Figure 13.1` 展示了全托管部署模型的架构。


  ![Figure 13.1: The fully managed deployment model](img/B19922_13_1.jpg`)


  Figure 13.1: 全托管部署模型


  以下是全托管部署模型的优势：


  *   支持高可用性、可扩展性和智能修复机制

  *   99.99% 正常运行时间

  *   能够管理多个 Mule 运行时版本

  *   符合 FedRAMP 标准

  *   容错

  *   MuleSoft 负责管理运行 MuleSoft 应用程序的底层基础设施

  *   应用程序隔离

  *   Government Cloud 可以使用 Anypoint VPN 和 VPC 对等连接连接到本地数据中心或私有云


  以下是全托管部署模型的主要局限性：


  *   连接到本地数据源、服务和资源时可能会遇到延迟


  ### 混合部署模型


  通过混合选项，用户可以在自管理环境中托管 Mule 运行时服务器和相关 API，并使用 MuleSoft 控制平面来管理 API。Mule 运行时服务器可以安装在第三方云中，例如
  AWS、Microsoft Azure、GCP、OCI 或其他云基础设施提供商，也可以在物理服务器或虚拟机上运行。


  当使用客户托管的运行时时，客户还负责为高可用性、故障转移、集群和负载均衡提供基础设施和框架。


  `Figure 13.2` 展示了混合托管部署模型的架构。





  ![Figure 13.2: The hybrid managed deployment model](img/B19922_13_2.jpg)


  图 13.2：混合托管部署模型


  以下是混合托管部署模型的优势：


  - 连接本地资源、数据源和服务时延迟低

  - 支持各种服务器和**虚拟机**（**VM**），用于本地和云数据中心的运行时

  - 数据不会离开客户的数据中心

  - 最灵活的部署模型之一


  以下是混合托管部署模型的局限性：


  - 客户负责管理和预配运行 Mule 应用程序的基础设施

  - 客户负责管理非功能性需求，如高可用性、可扩展性以及其他网络和防火墙配置


  我们已经讨论了 Government Cloud，这是 MuleSoft 为政府机构提供的用于管理和运行 API 的平台。在下一节中，我们将探讨 EU 控制平面。


  # EU 控制平面


  MuleSoft 为您提供了在 EU 区域完全托管 Anypoint Platform 的替代方案。出于 EU 基于地理位置的数据存储法规目的，MuleSoft
  提供了一个欧洲 Anypoint Platform 控制平面（EU 控制平面）。受法律强制要求将所有数据处理和存储保存在 EU 境内物理位置的欧洲客户可以使用此平台。


  运行时平面的所有方面，包括管理、集成和 API 控制，均位于 EU 国界内。EU 保留对所有数据的控制，包括运行时管理、控制流量、传输中和静态数据。此外，它保证用户遵守最严格的安全准则和
  EU 的《通用数据保护条例》（GDPR）。


  MuleSoft 在 EU 区域完全托管 Anypoint Platform（数据中心位于都柏林和法兰克福）。这使您能够在 EU 内管理和部署 MuleSoft
  API 及其相关数据。


  除了 EU 控制平面，MuleSoft 还允许您在 EU 区域部署 Mule 应用程序，这意味着您可以在 EU 区域托管运行时平面。这确保您能够满足 EU 的监管要求和合规性。


  **注意：** EU 控制平面可通过 `https://eu1.anypoint.mulesoft.com` 访问。EU 控制平面的使用仅限符合条件的客户，且需要申请。


  ## EU 控制平面注意事项


  在使用 MuleSoft 的 EU 控制平面之前，有多个方面需要考虑，包括以下内容：


  - **合规性**：EU 控制平面有助于确保您的数据符合 GDPR 和其他严格的 EU 数据保护法规。

  - **数据驻留**：应用程序数据在传输中和静态时均保留在 EU 内。对于必须遵守数据主权法规的组织而言，这尤为关键。

  - **安全标准**：MuleSoft 通过遵循最严格的安全标准，确保您的数据得到妥善保护。


  不过，也存在一些劣势，如下所示：


  - **地理覆盖范围受限**：目前，MuleSoft 的 EU 控制平面仅在欧洲联盟内可访问。如果您的公司在 EU 以外开展业务，可能需要探索其他区域或全球控制平面选项。

  - **性能**：选择 EU 控制平面可能会影响延迟，具体取决于您的用户或系统所在位置。

  - **服务可用性**：MuleSoft 的功能和服务可用性可能与 US 控制平面不同，具体取决于该区域提供的基础设施和支持。

  - **成本**：根据您的合同和使用情况，使用 EU 控制平面而非默认的 US 平面可能会产生额外费用。

  - **数据传输**：如果您目前使用 US 控制平面，将数据从 MuleSoft 的 US 控制平面迁移到 EU 控制平面可能既困难又耗时。


  ## 将应用程序部署到 EU 控制平面


  将应用程序部署到 EU 控制平面与部署到 US 控制平面类似。部署期间，您需要确保选择位于 EU 内的区域。支持两个区域：都柏林和法兰克福。关于将应用程序部署到
  `CloudHub 1.0` 和 `CloudHub 2.0` 的主题已在 第 9 章 中介绍，如有需要请参考这些章节以获取更多信息。


  ## EU 控制平面中的 Object Store


  在 EU 控制平面中创建的 Mule 应用程序默认使用 `Object Store V2`。无需进行平台或应用程序配置更改即可使用此版本。EU 控制平面不支持
  `Object Store V1`。


  ## 从 US 控制平面迁移到 EU 控制平面


  对于已经在 US 控制平面部署了应用程序、资源和资产，并希望迁移到 EU 版本的现有客户，没有自动化的迁移流程或工具可将组织从 US 控制平面迁移到 EU 控制平面。


  这些平台被有意相互隔离，因此任何应用程序、资源和其他资产都必须在 EU 控制平面中从头创建。由于在 US 控制平面有大量部署的客户可能会发现这是一项劳动密集型任务，请咨询您的客户主管，了解
  MuleSoft 服务是否可协助迁移规划。


  ## EU 控制平面中的 Anypoint VPC 和 VPN


  EU 控制平面支持使用 Anypoint VPC 创建虚拟隔离网络以运行 MuleSoft 应用程序。EU 控制平面还支持网络连接选项，如 Anypoint VPN，用于从本地数据中心或私有网络访问资源。其他网络连接选项（如
  VPC 对等连接和 AWS Transit Gateway）在 EU 控制平面中也受支持。


  有关 Anypoint VPC 和网络连接选项（如 Anypoint VPN、VPC 对等连接和 Transit Gateway 配置）的更多详细信息，请参阅
  第 9 章。


  ## EU 控制平面中的 Anypoint 专用负载均衡器 (DLB)


  Anypoint DLB 是 EU 控制平面的一个可选组件。它用于将 HTTP/HTTPS 流量路由到部署在 Anypoint VPC 内的应用程序。


  EU 控制平面中的专用负载均衡器暴露两条 A 记录以接受来自本地私有网络和公共网络的流量。其中一条记录是内部的（`internal-<lb-name>.lb-prod-eu-rt.anypointdns.net`），另一条是外部的（`<lb-name>.lb-prod-eu-rt.anypointdns.net`）。


  如有需要，有关 Anypoint DLB 配置的更多详细信息，请参阅 第 9 章。


  # 总结


  在本章中，我们向您介绍了 MuleSoft 提供的 Government Cloud 和 EU 控制平面。我们讨论了围绕 Government Cloud 和
  EU 控制平面的注意事项。我们还了解了 Government Cloud 和 EU 控制平面如何支持多种不同的部署模型。


  在下一章中，我们将探讨 Anypoint 监控和警报。


