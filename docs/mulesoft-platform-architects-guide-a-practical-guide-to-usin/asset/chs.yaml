  | | **API 代理** | **API 自动发现** |

  | --- | --- | --- |




  | **定义** | | API 代理是一种接口，用于向客户端应用隐藏后端服务或 API。它可用于 API 实现的开发、测试和生产阶段。API 代理的主要目标是流量管理和安全。它提供路由、适应性、速率限制和安全等功能。
  | | MuleSoft 的 API 自动发现功能通过在 API 及其已部署的 Mule 应用程序之间建立连接，使已部署的 Mule 应用程序能被 API 管理器识别。这使得可以从
  Anypoint Platform 控制 API 的版本和状态。 |

  | **目的** | | 它能够隐藏和保护后端 API 实现。 | | 它能够将已部署的 MuleSoft API 与 API 管理器实例关联，以管理和保护 API。
  |

  | **管理非 MuleSoft API** | | API 代理可用于管理非 MuleSoft API 以及 MuleSoft API。 | | API 自动发现只能管理
  MuleSoft API。 |

  | **用法** | | 它被用作客户端应用程序与后端服务或 API 通信的接口。 | | 它用于在 Mule 应用程序部署后对 API 进行管理和监控。 |

  | **CloudHub 和 Runtime Fabric 上的 vCore 要求** | | API 代理在运行时平面部署代理应用程序，这需要 vCore。
  | | 不需要额外的 vCore。 |


  表 15.1：API 代理与 API 自动发现对比


  # Anypoint Service Mesh


  服务网格是一种软件架构模式，用于将代理服务器作为微服务部署，并使用边车来促进服务之间安全、快速且持续的通信。大多数服务网格（包括 Istio）都是使用 Kubernetes
  集群部署的。尽管存在大量商业产品和开源服务网格项目，但 Istio 已成为事实上的行业标准。


  为了实现它们，通常会使用边车的代理模式。边车代理伴随每个应用程序，管理所有服务间通信。它负责东西向流量的发现、路由、安全和监管。每个代理实例都连接到一个控制平面，控制平面提供了一种控制网格的方式。您的服务间交互由在控制平面层面管理的安全和通信策略进行管控。现在可以在控制平面层面应用身份验证和授权策略，指示边车在服务间网络调用期间做出适当响应。


  Anypoint Service Mesh 是 MuleSoft 提供的一种产品，可简化微服务的管理和控制。它旨在提供服务网格的优势，同时将 Anypoint
  Platform 的功能扩展到部署在非 Mule 运行时引擎中的任何微服务。


  以下是 Anypoint Service Mesh 的功能：


  *   **服务发现**：跨分布式环境自动发现非 Mule 应用程序和服务

  *   **安全性和可靠性**：一键应用一致的预构建安全性和可靠性策略，无需更新微服务代码

  *   **流量管理**：通过重试、限流和熔断策略控制微服务流量并防止停机

  *   **性能监控**：通过与 Anypoint Monitoring 集成，深入了解微服务的性能和运行状况

  *   **分析和洞察**：通过 API 和集成分析理解和可视化服务性能和依赖关系的元数据

  *   **治理和控制**：将 Anypoint Platform 的治理和控制功能扩展到所有已部署的实例


  使用 Anypoint Service Mesh，组织可以确保其微服务（无论这些服务是使用 MuleSoft 还是其他平台构建的）能够以标准化的方式被发现、管理和保护。


  以下是 Anypoint Service Mesh 架构图：


  ![图 15.5：Anypoint Service Mesh 架构](img/B19922_15_05.jpg)


  图 15.5：Anypoint Service Mesh 架构


  如图 15.5 所示，Anypoint Platform 位于架构的顶层，为使用 Mule 运行时引擎构建的微服务提供完整的生命周期 API 管理功能。这些 Mule
  实例可以在 Runtime Fabric 或 CloudHub 中本地设置。安装在 Kubernetes 集群上的 Istio 使用边车代理来利用 Envoy
  进行服务管理。边车与您的服务位于同一个容器中，并监管其所有通信。即使启用了 Anypoint Service Mesh，您仍可以继续使用 Istio 的原生策略进行安全和流量控制。


  组件通过 MuleSoft 适配器连接到 Anypoint Platform。适配器与代理协作，允许所有网格管理的服务共享元数据，这使得 Anypoint Platform
  能够将 Kubernetes 集群中的当前微服务识别为 API。服务被发现后，Anypoint Exchange 使用元数据自动为每个服务查找并创建 API（HTTP、REST
  或 SOAP）。然后，可以使用 API Manager 来管理这些 API。同样，Anypoint Monitoring 通过元数据从边车代理获取数据，并将其提供给
  API Analytics。


  ## Flex Gateway


  Anypoint Flex Gateway 速度极快，旨在保护和管理随处使用的 API。Anypoint Flex Gateway 在任何环境中提供企业级安全性和可管理性，并具备满足甚至最苛刻应用程序所需的性能。它旨在与
  DevOps 和 CI/CD 工作流无缝集成。


  Flex Gateway 是一个轻量级的、基于 Envoy 的 API 网关，能够在一个统一框架下管理、保护、发现和交互 API。由于它能够管理用任何技术实现的
  API（技术无关）、遵循任何架构（从单体架构到微服务架构）并在任何地方运行（云、本地、混合等），因此该网关可防止 API 蔓延。


  ### Flex Gateway 的优势


  以下是使用 Flex Gateway 的优势：


  *   能够管理和保护位于任何位置的 API

  *   将 Anypoint Platform 的功能扩展到 MuleSoft 和非 MuleSoft API

  *   实现跨任何环境中运行的每个 API 的一致安全性和治理

  *   通过轻量级灵活的 API 网关适应任何架构以管理和保护 API

  *   在单一框架下治理所有 API

  *   Flex Gateway 可设置为 Linux 服务、Docker 容器或 Kubernetes Ingress 控制器

  *   Flex Gateway 可设置为连接模式和本地模式


  ### Flex Gateway 连接模式


  在连接模式下，Flex Gateway 在 Runtime Manager 中注册，我们可以在 API Manager 中查看 API 实例和策略配置。连接模式让您能够访问
  Anypoint Platform 的所有功能，包括通过 Exchange 实现复用和通过 API Analytics 进行监控，同时允许您从单一统一的控制平面管理所有非
  Mule API。下图展示了作为 Kubernetes Ingress 控制器的 Flex Gateway 连接模式：


  ![图 15.6：Flex Gateway 连接模式](img/B19922_15_06.jpg)


  图 15.6：Flex Gateway 连接模式


  在图 15.6 中，我们可以看到连接模式下的 Flex Gateway 可以使用 MuleSoft 提供的开箱即用组件（如 API Manager、Anypoint
  Monitoring 和 Runtime Manager）来管理和保护发布到 Flex Gateway 的 API。


  ### Flex Gateway 本地模式





  # Flex Gateway 本地模式


  在本地模式下，Flex Gateway 与 Anypoint Platform 完全断开连接。在本地模式下控制 Flex Gateway 的主要方式是通过配置文件或
  YAML 文件。我们可以使用此文件控制 API 实例和相关安全策略。非 Mule API 可在本地模式下由 Flex Gateway 管理，而无需 Anypoint
  控制平面的协助（本地保存的声明式配置文件用于处理本地模式下的所有配置和策略应用）。


  下图展示了作为 Kubernetes Ingress 控制器的 Flex Gateway 本地模式：


  ![图 15.7：Flex Gateway 本地模式](img/B19922_15_07.jpg)


  图 15.7：Flex Gateway 本地模式


  在图 15.7 中，我们可以看到本地模式下的 Flex Gateway 由 YAML 描述符文件管理，并且需要 Splunk 和 ELK 栈等第三方工具进行监控和日志记录。当企业有严格策略要求
  API 流量不得离开内部网络，或存在任何合规性或安全要求时，均可将 Flex Gateway 设置为本地模式。


  ## Flex Gateway 部署模型


  Flex Gateway 支持多种部署模型，可在连接模式和本地模式下实施。可实施以下部署来设置 Flex Gateway。


  ### 独立部署模型


  在独立部署模型中，Flex Gateway 作为独立服务运行，以保护企业内的一个或多个 API。下图展示了 Flex Gateway 独立部署：


  ![图 15.8：Flex Gateway 独立部署](img/B19922_15_08.jpg)


  图 15.8：Flex Gateway 独立部署


  在图 15.8 中，我们可以看到所有流量都在组织网络内部。内部流量通过 Flex Gateway 路由至消费者应用程序。


  ### Ingress 部署模型


  Ingress 部署模型作为独立服务运行，保护一个或多个 API。在该模型中，Flex Gateway 通过负载均衡器管理进入内部网络的外部流量。它是广泛使用的部署模型之一，可同时充当入站网关和出站网关。下图展示了
  Flex Gateway Ingress 部署：


  ![图 15.9：Flex Gateway Ingress 部署](img/B19922_15_09.jpg)


  图 15.9：Flex Gateway Ingress 部署


  在图 15.9 中，我们可以看到所有外部流量通过负载均衡器进入内部网络。所有流量均通过 Flex Gateway 传递至消费者应用程序。


  ### Egress 部署模型


  Egress 部署与 Ingress 部署模型相反，作为独立服务运行，保护一个或多个 API。在 Egress 部署模型中，Flex Gateway 管理离开组织以连接非组织拥有的
  API 的内部流量。下图展示了 Flex Gateway Egress 部署：


  ![图 15.10：Flex Gateway Egress 部署](img/B19922_15_10.jpg)


  图 15.10：Flex Gateway Egress 部署


  在图 15.10 中，我们可以看到 Flex Gateway 管理离开组织以连接外部 API 的内部流量，该模型同时充当入站和出站网关。


  ### Sidecar 部署模型


  在 Sidecar 部署模型中，每个 Flex Gateway 部署仅保护其受保护服务所暴露的 API。每当添加一个受保护服务，就会添加一个新的 Flex Gateway
  副本。


  ![图 15.11：Flex Gateway Sidecar 部署](img/B19922_15_11.jpg)


  图 15.11：Flex Gateway Sidecar 部署


  在图 15.11 中，Sidecar 部署中的流量被路由至相应的消费者 API。消费者应用程序可能托管在外部网络或与 Flex Gateway 相同的网络中。


  ## Flex Gateway 的高可用性与可扩展性


  通过运行多个 Flex Gateway 实例，并在 Flex Gateway 实例前配置负载均衡器以分发流量，可实现高可用性，确保即使一个或多个 Flex Gateway
  实例发生故障，仍能保证高可用性和业务连续性。


  在 Kubernetes 集群中运行 Flex Gateway 时，可通过在 Kubernetes 集群中部署多个副本来实现高可用性。使用安装在 Kubernetes
  命名空间中的 `Helm` Chart，可运行以下命令为 Flex Gateway 添加更多副本：


  ```

  helm -n gateway upgrade \

  ingress flex-gateway/flex-gateway \

  --reuse-values \

  --set replicaCount=4

  ```


  通过添加额外副本，Flex Gateway 可水平扩展。Flex Gateway 还支持自动扩展，尽管默认处于关闭状态。


  可使用 Helm Chart 启用自动扩展；默认情况下，支持最少 2 个副本，最多 11 个副本。


  可使用以下 Helm 属性启用 Flex Gateway 的自动扩展功能：


  | 参数 | 描述 | 默认值 |

  | --- | --- | --- |

  | `autoscaling.enabled` | 这是一个布尔值，指示 `Horizontal Pod Autoscaler (HPA)` 是否处于激活状态；默认设置为
  `false`。 | `false` |

  | `autoscaling.minReplicas` | 这显示了 `HPA` 扩缩容器可生成的最小副本数量。 | `2` |

  | `autoscaling.maxReplicas` | 这显示了 `HPA` 扩缩容器可生成的最大副本数量。 | `11` |

  | `autoscaling.targetCPUUtilizationPercentage` | 这是一个资源指标，用于确定每个已部署 `Pod` 平均 `CPU`
  使用率的比例。 | `50` |

  | `autoscaling.targetMemoryUtilizationPercentage` | 这是一个字符串，显示所有已部署 `Pods` 平均内存使用率的百分比。
  | `nil` |

  | `autoscaling.behavior` | 这是一个 Kubernetes 配置，用于启用 `HorizontalPodAutoscaler` 对象。`HPA`
  设置控制自动扩展行为，包括根据工作负载的变化率调整应用程序资源的数量。 |  |

  | `autoscaling.behavior.scaleUp`, `autoscaling.behavior.scaleDown` | 这些是自动扩展行为的配置，当
  `HPA` 扩缩容器增加 (`scaleUp`) 或减少 (`scaleDown`) 副本数量时生效。我们可以使用嵌套参数描述扩展行为：`selectPolicy`：当配置的资源指标指示需要扩展时，此设置控制何时扩展
  `Pods`。由于 `Pods` 可能具有不同数量的副本，因此需要此设置。可接受值为 `Min`、`Max` 和 `Disabled`。默认设置为 `Max`。`stabilizationWindowSeconds`：这给出了在响应工作负载修改之前必须经过的最短秒数，以便重新扩展应用程序。其目的是防止
  `HPA` 在频繁扩展时过于激进或不稳定地响应。`policies`：管辖扩展行为的策略目录：`type`：根据特定策略的值类型为 `Percent` 或 `Pods`；`value`：特定策略的值类型的值；`periodSeconds`：特定策略扩展操作的时间间隔（秒）。
  |  |


  表 15.2：Flex Gateway Helm Chart 设置


  ## Flex Gateway 中的路由


  Flex Gateway 通过多种路由管理请求流量，每种路由均可将流量路由至多个上游服务。Flex Gateway 利用路由顺序和每个路由的特定规则将流量路由至目标。您还可以为路由内的每个上游服务分配加权百分比，以控制发送至上游服务的请求百分比。每个
  API 实例最多支持 50 条路由，每条路由最多支持 10 个上游服务。Flex Gateway 1.5.x 或更高版本支持多个 API 实例通过单个消费者端点暴露不同的上游服务。






  # Flex Gateway


  ## 路由


  在下图中，不同的路由管理对银行信息数据库的请求。路由 1 配置了两个上游服务，将 80% 的流量导向主 API，主 API 随后连接到稳定数据库。20% 的流量导向辅助
  API，该 API 连接到数据库的测试版本。


  ![Figure 15.12: Flex Gateway routing](img/B19922_15_12.jpg)


  图 15.12：Flex Gateway 路由


  通过在单个路由中利用多个上游服务，可以将请求路由到可比较的服务。例如，您可以将一半流量路由到稳定的上游服务，另一半路由到新的上游服务，以测试新测试版上游服务的功能，而无需将所有流量发送到新服务。Flex
  Gateway 还根据页面上路由出现的顺序（从上到下）将请求路由到各个路由。如果请求满足路由规则，Flex Gateway 会将其路由到第一个匹配的路由。


  Flex Gateway 允许您使用端口或路径将请求路由到上游 API。


  图 15.13 展示了 Flex Gateway 基于端口的路由。每当请求通过端口 `8081` 到达 Flex Gateway 时，该请求将被路由到 `Employee
  API`；同样，如果请求通过端口 `8082` 到达 Flex Gateway，它将被路由到 `Order API`。


  ![Figure 15.13: Flex Gateway’s port-based routing](img/B19922_15_13.jpg)


  图 15.13：Flex Gateway 基于端口的路由


  这种方法的局限性在于，每当我们向 Flex Gateway 发布新 API 时，都需要使用一个唯一的端口。当使用 Kubernetes 作为入口控制器时，端口也必须在入口服务上启用。还有另一种方法，我们可以使用路径路由请求，并继续对发布到
  Flex Gateway 的每个 API 使用相同的端口。图 15.14 展示了 Flex Gateway 基于路径的路由：


  ![Figure 15.14: Flex Gateway’s path-based routing](img/B19922_15_14.jpg)


  图 15.14：Flex Gateway 基于路径的路由


  在图 15.14 中，基本路径可以在 API 管理器中创建的 API 实例上配置，并将用于将请求路由到上游 API。在同一端口上发布到 Flex Gateway
  的每个 API 都需要一个唯一的基本路径。


  如图 15.14 所示，带有 `/employees-api` 基本路径的请求到达 Flex Gateway 时将被路由到 `Employee API`。同样，带有
  `/orders-api` 基本路径的请求到达 Flex Gateway 时将被路由到 `Order API`。在此方法中，所有 API 都在同一端口 `8081`
  上发布到 Flex Gateway。


