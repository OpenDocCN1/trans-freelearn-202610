  \    1.  位于企业防火墙后的服务和数据库可通过默认 `CloudHub 1.0` 设置访问。无需自定义平台。\n    2.  在 `CloudHub\
  \ 1.0` 中设置 `Anypoint Virtual Private Cloud`，并在 `Anypoint Virtual Private Cloud`\
  \ 与企业数据中心之间创建 `VPN IPSec` 隧道。\n    3.  在需要连接到企业防火墙后服务的应用程序上使用静态 IP 地址，并在企业数据中心防火墙中将该静态\
  \ IP 地址加入白名单。\n    4.  无法从 `CloudHub 1.0` 连接位于企业防火墙后的服务。您需要在本地设置 Mule Runtime 以连接企业防火墙后的资源。\n\
  \n3.  一个组织部署了一个在 `CloudHub 1.0` 上使用 `Object Store v2` 的 API。另一个 API 部署在本地 `Mule\
  \ Runtime` 上，想要访问 `Object Store v2` 中的数据。从运行在本地 `Mule Runtime` 上的应用程序访问 `CloudHub\
  \ 1.0` 上的 `Object Store v2` 的最佳方式是什么？\n\n    1.  使用 `Anypoint CLI`\n    2.  使用 `Object\
  \ Store Connector`\n    3.  使用 `Object Store v2 REST API`\n    4.  无法从本地 `Mule Runtime`\
  \ 访问 `Object Store v2`\n\n\n\n\n\n## 4. 哪个 API 策略最不可能应用于体验 API？\n\n1. `IP Blocklist`\n\
