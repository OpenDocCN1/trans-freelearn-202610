  ## API 自动发现


  在 MuleSoft 中，将 API 连接到其已部署的 Mule 应用程序实例的过程称为 API 自动发现。API 自动发现过程将已部署的 Mule 应用程序链接到相应的
  Anypoint Platform API，使 API 在平台中可见，并启用版本和状态跟踪。借助此过程，您现在可以从 Anypoint Platform 的 Runtime
  Manager 实时控制、监控和跟踪 API。


  MuleSoft API 自动发现的一些基本功能如下：


  *   实时绑定已部署的 API 实例，以便于跟踪和管理

  *   使用 Anypoint Platform 直接管理和监控已部署的 API

  *   提高 API 的版本和状态可见性


  任何希望保持对其 API 的可见性和控制力的组织都应利用此功能，尤其是那些拥有复杂、大容量 API 环境的组织。值得注意的是，必须应用特定于 API 的策略才能使用
  API 自动发现。


  API 自动发现可针对部署在 `CloudHub 1.0`、`CloudHub 2.0`、`Runtime Fabric` 和本地 `Mule Runtime`
  上的 Mule API 实施。


  下图说明了部署在 `CloudHub`、`Runtime Fabric` 或本地 `Mule Runtime` 上的 MuleSoft API 的 API 自动发现：


  ![图 15.4：API 自动发现](img/B19922_15_04.jpg)


  图 15.4：API 自动发现


  API 自动发现可针对部署在本地 `Mule Runtime`、`Runtime Fabric` 或 `CloudHub` 上的 MuleSoft API 实施。要实施
  API 自动发现，第一步是在 `API Manager` 中创建一个 API 实例，这将生成一个 API ID。我们可以在 Mule 代码的 API 自动发现组件中配置该
  API ID 和主 Mule 流。在部署期间，我们需要传递两个属性：


  *   `anypoint.platform.client_id`

  *   `anypoint.platform.client_secret`


  这两个属性的值因环境而异。对于本地 `Mule Runtime`，这两个属性可以在 `wrapper.conf` 中设置。


