  某组织在 Anypoint Exchange 中拥有资产。由于已在 Anypoint Exchange 中发布了新版本，这些资产的某些版本已不再有用。应如何处理旧资产版本，以便用户知晓它们不再使用？\n\
  \n1. 取消部署资产版本\n2. 退役资产版本\n3. 弃用资产版本\n4. 移除资产版本\n\n## 第 6 题\n细粒度微服务架构如何使应用网络受益？\n\
