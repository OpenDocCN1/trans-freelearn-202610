  \ 使用率、响应大小、HTTP 状态码\n3. 请求大小、请求数、响应大小、响应数\n4. 请求大小、请求数、响应大小、响应时间\n\n## 12. 一个组织拥有私有端点，希望测试和监控这些私有端点，而不消耗额外的\
  \ vCore 来创建私有位置。这可能吗？如果可能，如何实现？\n\n1. 是的，这可行。为监控私有端点创建公共位置。你需要在 `Anypoint Virtual\
  \ Private Cloud` 防火墙规则中允许公共位置的 IP 地址。\n2. 不，这不可行。你将始终需要私有位置来监控私有端点。\n3. 是的，这可行。为监控私有端点创建公共位置。不需要其他配置。\n\
  4. 无法从功能监控中监控私有端点。\n\n## 13. 一个组织在 `CloudHub` 上部署了 `MuleSoft` API。该 API 开始面临性能问题，即无法一次处理更多请求，且响应时间增加了延迟。作为架构师，你会建议什么解决方案来解决性能问题？\n\
  \n1. 通过增加工作器大小或为内存使用启用 `autoscaling policy` 来实现垂直扩展\n2. 通过增加应用程序的工作器数量或为内存使用启用 `autoscaling\
  \ policy` 来实现水平扩展\n3. 通过增加应用程序的工作器数量或为 CPU 使用启用 `autoscaling policy` 来实现水平扩展\n4.\
  \ 通过增加工作器大小或为 CPU 使用启用 `autoscaling policy` 来实现垂直扩展\n\n> **注意**\n> `CloudHub` 默认未启用\
  \ `autoscaling` 功能。请联系您的 `MuleSoft` 客户代表。\n\n## 1. 对于部署到 `CloudHub` 的应用程序，API 策略无法强制执行什么？\n\
  \n1. 记录 HTTP 请求和响应\n2. 允许和阻止来自特定 IP 地址或 IP 地址范围的请求\n3. 对请求和响应负载中的数据进行令牌化和去令牌化\n\
  4. 控制请求数量以避免后端系统过载\n\n## 2. 一个组织希望在 `Runtime Fabric Manager` 上部署应用程序，实现零停机。零停机部署的最佳解决方案是什么？\n\
