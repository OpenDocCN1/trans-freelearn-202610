  \ KPI 和指标传达给整个组织的利益相关者。文中描述了这些利益相关者以及 C4E 团队所需的关键角色。C4E 的人员配置通常是最具挑战性的方面之一，并且需要组织内部项目高级倡导者的支持和资助。\n\
  \n在 Catalyst 架构材料的建立过程中，可以观察和讨论应用网络的自然形成。下一章将更深入地探讨什么是应用网络、其优势是什么，以及如何鼓励其形成。\n\n\
  ## 问题\n\n回答以下问题以测试您对本章的掌握程度：\n\n1. 构成 MuleSoft Catalyst 基础的三大支柱是什么？\n\n2. 为什么在 API\
  \ 交付项目中识别业务成果很重要？\n\n3. Catalyst 知识中心有哪些内容，它对所有人开放吗？\n\n4. C4E 如何支持成功的 API 项目交付？\n\
