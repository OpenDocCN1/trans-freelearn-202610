  ## 用例 2


  Java 用于编写 J&J Music 的 API，这些 API 托管在本地。为了保护、管理、发现和使用这些 API，他们目前正尝试在 API 上激活 API
  管理功能。此外，他们打算逐步将每个 API 迁移到云端。MuleSoft 已经是他们管理和实施 API 的首选平台。


  从用例来看，J&J Music 希望使用 Anypoint Platform 来管理非 MuleSoft API。他们还需要逐步将所有内容迁移到 CloudHub。


  有多种解决方案可用于实现此用例。


  混合实施是一种选择（控制平面在 Anypoint Platform 中，运行时平面在客户数据中心中）。


  我们必须设置一个 API 代理，使其与 Java API 建立对等连接，以便 API 管理能够管理 Java API。尽管本地 Mule 运行时将使该 API
  代理能够更靠近客户的 Java API 运行，但它并不能完全满足客户的要求，因为客户打算很快迁移到云端。根据 J&J Music 的云迁移计划，从长远来看，此解决方案并不切实际。


  为了完全满足 J&J Music 的要求，我们选择了 CloudHub 2.0 作为托管解决方案。要通过运行在 CloudHub 2.0 上的 API 代理连接本地运行的
  Java API，我们还需要在 CloudHub 2.0 上配置私有空间和 Anypoint VPN。关于 CloudHub 2.0 的更多信息请参阅第 10
  章。此选项将更具适应性，并符合客户的需求和长期目标。


  ![图 18.12：带有 API 代理的 CloudHub 2.0](img/B19922_18_12.jpg)


  图 18.12 展示了 J&J Music 使用 Anypoint Platform 管理 Java API 时的架构蓝图。


  > **注意**

  >

  > 与 CloudHub 2.0 一样，CloudHub 1.0 也可以以类似的方式使用。


  Flex Gateway 可用于管理 Java API；第 15 章 中有关于 Flex Gateway 的更多信息。AWS、Azure、Google 和其他云平台可用于设置
  Flex Gateway。


  ## 用例 3


  J&J Music 希望在一个法律和合规要求更严格的国家拓展业务。该国政府通过多项法律法规，将网络安全、数据保护和隐私列为首要任务。该国规定，如果你想在线开展业务，必须在那里托管基础设施，或使用提供在该国托管基础设施选项的云服务提供商。此外，你的数据和元数据不得离开该国。


  尽管 MuleSoft 的控制平面位于美国或欧盟，但我们在希望拓展业务并建立在线业务的国家无法访问它。在这种情况下，我们无法使用 Anypoint Platform
  管理 API 生命周期。我们必须实施 Anypoint PCE，它可以托管在该国的云计算环境或企业数据中心中。


  客户托管的 Anypoint PCE 将用于管理 API，客户托管的 Mule 运行时将用于执行 Mule 应用程序。


  ![图 18.13：Anypoint PCE 和客户托管的 Mule 运行时](img/B19922_18_13.jpg)


  图 18.13 显示运行时平面和控制平面均托管在客户基础设施中。这将使 J&J Music 能够遵守该国制定的法律法规。


  > **注意**

  >

  > 可以实施本地 Mule 运行时来代替 RTF。

  >

  > 如果云服务提供商允许在该国托管必要的基础设施，则控制平面和运行时平面可以托管在那里。


