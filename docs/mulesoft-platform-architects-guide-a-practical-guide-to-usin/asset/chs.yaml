  \ 知识中心按支柱组织，每个支柱包含一个或多个剧本。每个剧本定义了活动及其步骤，涵盖基于产品开发的四个类别：规划成功、建立基础、构建规模和衡量影响。每个步骤都有文档记录和描述，大多数步骤包含支持该活动的资产。这些资产可以是用于沟通的\
