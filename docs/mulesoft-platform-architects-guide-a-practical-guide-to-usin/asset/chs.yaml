  *图 14.10 - Anypoint Monitoring 事件驱动警报*\n\n当消息响应时间在至少 5 个连续的 1 分钟周期内超过 5 毫秒时，将触发警报：\n\
  \n![图 14.11 - Anypoint Monitoring 事件驱动警报](img/B19922_14_11.jpg)\n*图 14.11 - Anypoint\
  \ Monitoring 事件驱动警报*\n\n同样，您可以配置其他警报，例如 **消息计数**、**CPU 利用率**、**内存利用率** 和 **消息错误计数**。\n\
  \n# 为部署到 CloudHub 的应用程序启用 Anypoint Monitoring\n\n为部署到 CloudHub 的应用程序启用 Anypoint\
  \ Monitoring 有两种方式。让我们来看一下。\n\n## 使用 Anypoint Monitoring 控制台\n\n在 Anypoint Monitoring\
  \ 的 **设置** 选项卡上，您可以选择 **CloudHub** 并为已部署到 CloudHub 的新应用程序启用 Anypoint Monitoring。这意味着任何新部署的应用程序都将启用\
  \ Anypoint Monitoring。\n\n对于任何现有应用程序，您只需选择需要启用或禁用 Anypoint Monitoring 的环境和应用程序，即可为单个应用程序启用/禁用\
  \ Anypoint Monitoring。为此，请勾选或取消勾选每个应用程序的复选框：\n\n![图 14.12 - 启用 Anypoint Monitoring\
  \ (CloudHub)](img/B19922_14_12.jpg)\n*图 14.12 - 启用 Anypoint Monitoring (CloudHub)*\n\
  \n## 在 CloudHub 设置中启用 Anypoint Monitoring\n\n可以通过在 CloudHub 的 Runtime Manager 应用程序设置中添加\
  \ `anypoint.platform.config.analytics.agent.enabled=true` 属性来启用 Anypoint Monitoring。要禁用\
  \ Anypoint Monitoring，请将此属性的值更改为 `false`。启用 Anypoint Monitoring 可能会增加应用程序的 CPU 利用率。但请注意，利用率的变化取决于应用程序的行为，例如入站和出站调用速率：\n\
  \n![图 14.13 - 从 Runtime Manager 启用 Anypoint Monitoring (CloudHub)](img/B19922_14_13.jpg)\n\
  *图 14.13 - 从 Runtime Manager 启用 Anypoint Monitoring (CloudHub)*\n\n可以通过将 `anypoint.platform.config.analytics.agent.enabled`\
  \ 设置为 `false` 来禁用已部署到 CloudHub 的应用程序的 Anypoint Monitoring。\n\n# 为部署到 CloudHub 2.0\
  \ 的应用程序启用 Anypoint Monitoring\n\n部署到 CloudHub 2.0 的应用程序默认已启用 Anypoint Monitoring。您无需进行任何额外配置即可为部署到\
  \ CloudHub 2.0 的应用程序启用 Anypoint Monitoring：\n\n![图 14.14 - 启用 Anypoint Monitoring\
  \ (CloudHub 2.0)](img/B19922_14_14.jpg)\n*图 14.14 - 启用 Anypoint Monitoring (CloudHub\
  \ 2.0)*\n\n要为部署到 CloudHub 2.0 的应用程序禁用 Anypoint Monitoring，请在 Runtime Manager 控制台的应用程序设置中添加\
  \ `anypoint.platform.config.analytics.agent.enabled=false` 属性：\n\n![图 14.15 - 从\
  \ Runtime Manager 禁用 Anypoint Monitoring (CloudHub 2.0)](img/B19922_14_15.jpg)\n\
  *图 14.15 - 从 Runtime Manager 禁用 Anypoint Monitoring (CloudHub 2.0)*\n\n# 为部署到 Runtime\
  \ Fabric 的应用程序启用 Anypoint Monitoring\n\n部署到 Runtime Fabric 的应用程序默认已启用 Anypoint Monitoring：\n\
  \n![图 14.16 - 启用 Anypoint Monitoring (Runtime Fabric)](img/B19922_14_16.jpg)\n*图\
  \ 14.16 - 启用 Anypoint Monitoring (Runtime Fabric)*\n\n要为部署到 Runtime Fabric 的应用程序禁用\
  \ Anypoint Monitoring，请在 Runtime Fabric 控制台的应用程序设置中添加 `anypoint.platform.config.analytics.agent.enabled=false`\
  \ 属性。\n\n# 为部署在混合环境中的应用程序启用 Anypoint Monitoring\n\n此处的混合环境是指运行时平面位于您的数据中心，而控制平面位于\
  \ Anypoint Platform。要为部署在混合环境中的应用程序启用 Anypoint Monitoring，需要在运行时平面上设置 Anypoint Monitoring\
  \ 代理，以便其将监控数据发送到 Anypoint Monitoring API 端点。\n\n要启用 Anypoint Monitoring，请通过选择环境和服务器、服务器组或集群，从\
  \ Anypoint Monitoring 控制台下载 `am.zip` 文件，并按照控制台上给出的说明在运行时平面上设置 Anypoint Monitoring\
  \ 代理：\n\n![图 14.17 - 启用 Anypoint Monitoring (混合环境)](img/B19922_14_17.jpg)\n*图 14.17\
  \ - 启用 Anypoint Monitoring (混合环境)*\n\n代理设置完成后，重启 Mule 运行时。在 5-10 分钟内，应用程序指标将开始出现在\
  \ Anypoint Monitoring 的内置仪表板上：\n\n![图 14.18 - Anypoint Monitoring 架构 (混合环境)](img/B19922_14_18.jpg)\n\
  *图 14.18 - Anypoint Monitoring 架构 (混合环境)*\n\n启用 Anypoint Monitoring 可能会增加应用程序的 CPU\
  \ 利用率，但利用率的任何变化取决于应用程序的行为，例如入站和出站调用速率。\n\n通常，对应用程序的 CPU 利用率影响将小于 5%。但是，要得出准确的数字，必须通过在不同环境中执行应用程序测试来进行影响分析。您可以通过启用和禁用\
  \ Anypoint Monitoring 来执行此操作。\n\n# 数据保留策略和限制\n\n下表描述了 Anypoint Monitoring 的数据保留策略和限制：\n\
  \n### 黄金和白金订阅\n\n| 功能 | 限制 |\n| --- | --- |\n| 日志 | 30 天或 100 MB。 |\n| 应用程序指标 |\
  \ 30 天。 |\n| 增强 API 指标 | 30 天。客户端应用程序中数据的限制为 30 天。 |\n| Mule 应用程序和服务器的基本警报 | 50\
  \ 个警报。 |\n| API 的基本警报 | 每个实例六个基本警报。 |\n\n### 钛金订阅\n\n| 功能 | 限制 |\n| --- | --- |\n\
  | 日志 | 以原始格式存储，您的日志可占用随钛金订阅接收的存储空间大小。 |\n| 应用程序指标 | 365 天。 |\n| 可搜索日志 | 额外存储空间为购买的用于可搜索日志索引存储大小的\
  \ 10%。 |\n| 增强 API 指标 | 30 天。客户端应用程序中数据的限制为 30 天。 |\n| 自定义指标 | 365 天。 |\n| 高级警报\
  \ | 每个父组织 20 个。 |\n| Mule 应用程序和服务器的基本警报 | 组织中生产环境 vCore 数量的 50 倍再加 100。 |\n| API\
  \ 的基本警报 | 每个实例 10 个基本警报。 |\n\n*表 14.1 - Anypoint Monitoring 数据保留策略和限制*\n\n# 监控连接器\n\
  \nAnypoint 为 Anypoint 连接器提供了内置仪表板，包括数据库、Salesforce、Anypoint MQ、JMS、SMTP、HTTP 以及所有其他\
  \ Anypoint 连接器。每个连接器提供三个指标：\n\n- **请求数**：连接器的平均请求数，按自动时间间隔分组\n- **响应时间**：连接器的平均响应时间，按自动时间间隔分组\n\
  - **失败数**：连接器的平均请求失败数，按自动时间间隔分组\n\n![图 14.19 - Anypoint Monitoring 连接器指标](img/B19922_14_19.jpg)\n\
  *图 14.19 - Anypoint Monitoring 连接器指标*\n\n图 14.19 显示了数据库和 Salesforce 连接器的指标。\n\n\
  # 混合环境的服务器信息\n\n\n\n\n\n当我们在 Anypoint Platform（控制平面）中注册服务器时，它会提供该服务器的 **CPU 利用率\
  \ (%)** 和 **堆内存 (MB)** 指标，以及在该服务器上运行的应用程序的状态，以及每个应用程序的 Mule 消息数量、响应时间和错误数：\n\n![Figure\
  \ 14.20 - Server CPU and memory utilization](img/B19922_14_20.jpg`)\n\nFigure 14.20\
  \ - 服务器 CPU 和内存利用率\n\nFigure 14.20 显示了特定时间间隔的 CPU 和内存利用率。您可以选择 **3 Hours**、**24\
  \ Hours**、**7 Days** 或 **2 Weeks**。\n\n## 使用 Runtime Manager 为混合环境启用警报\n\nMuleSoft\
  \ 提供开箱即用的警报，可在服务器、服务器组和集群上进行配置。警报可在 Runtime Manager **Alerts** 控制台中配置。API Manager\
  \ 警报没有速率限制。\n\n可以轻松配置各种警报。\n\n### 可以为服务器配置以下警报：\n\n*   **Agent version changed**（代理版本已更改）\n\
  *   **Runtime version changed**（运行时版本已更改）\n*   **Server CPU usage**（服务器 CPU 使用率）\n\
  *   **Server load average**（服务器负载平均值）\n*   **Server memory usage**（服务器内存使用率）\n*\
  \   **Server thread count**（服务器线程计数）\n*   **Server connected**（服务器已连接）\n*   **Server\
  \ deleted**（服务器已删除）\n*   **Server disconnected**（服务器已断开连接）\n\n### 可以为服务器组配置以下警报：\n\
  \n*   **Server group connected**（服务器组已连接）\n*   **Server group deleted**（服务器组已删除）\n\
  *   **Server group disconnected**（服务器组已断开连接）\n*   **Server group’s node CPU Usage**（服务器组节点\
  \ CPU 使用率）\n*   **Server group’s node Load average**（服务器组节点负载平均值）\n*   **Server\
  \ group’s node Memory Usage**（服务器组节点内存使用率）\n*   **Server group’s node Thread count**（服务器组节点线程计数）\n\
  *   **Server group’s node connected**（服务器组节点已连接）\n*   **Server group’s node disconnected**（服务器组节点已断开连接）\n\
  *   **Server added to server group**（服务器已添加到服务器组）\n*   **Server removed from server\
  \ group**（服务器已从服务器组移除）\n\n### 可以为集群配置以下警报：\n\n*   **Cluster connected**（集群已连接）\n\
  *   **Cluster deleted**（集群已删除）\n*   **Cluster disconnected**（集群已断开连接）\n*   **Cluster\
  \ presents visibility issues**（集群出现可见性问题）\n*   **Cluster’s node CPU usage**（集群节点\
  \ CPU 使用率）\n*   **Cluster’s node load average**（集群节点负载平均值）\n*   **Cluster’s node\
  \ memory usage**（集群节点内存使用率）\n*   **Cluster’s node thread count**（集群节点线程计数）\n*  \
  \ **Cluster’s node connected**（集群节点已连接）\n*   **Cluster’s node disconnected**（集群节点已断开连接）\n\
  *   **Server added to cluster**（服务器已添加到集群）\n*   **Server removed from cluster**（服务器已从集群移除）\n\
  \n### 可以为部署在混合环境中的应用程序配置以下警报：\n\n*   **Application undeployed**（应用程序已取消部署）\n*  \
  \ **Deployment failure**（部署失败）\n*   **Deployment success**（部署成功）\n*   **Number of\
  \ Mule messages**（Mule 消息数量）\n*   **Number of errors**（错误数量）\n*   **Response time**（响应时间）\n\
  \n## 使用 Runtime Manager 为 CloudHub 启用警报\n\nMuleSoft 提供开箱即用的警报，可在 CloudHub 上进行配置。警报可在\
  \ Runtime Manager **Alerts** 控制台中配置。API Manager 警报没有速率限制。\n\n### 可以为部署在 CloudHub\
  \ 上的应用程序配置以下警报：\n\n*   CPU usage（CPU 使用率）\n*   Custom application notification（自定义应用程序通知）\n\
  *   Deployment failed（部署失败）\n*   Deployment success（部署成功）\n*   Exceeds event traffic\
  \ threshold（超过事件流量阈值）\n*   Memory usage – Cloudhub（内存使用率 – CloudHub）\n*   Secure\
  \ data gateway connected（安全数据网关已连接）\n*   Secure data gateway disconnected（安全数据网关已断开连接）\n\
  *   Worker not responding（Worker 无响应）\n\n## 使用 Runtime Manager 为 CloudHub 2.0 启用警报\n\
  \nMuleSoft 提供开箱即用的警报，可在 CloudHub 2.0 上进行配置。警报可在 Runtime Manager **Alerts** 控制台中配置。API\
  \ Manager 警报没有速率限制。\n\n### 可以为部署在 CloudHub 2.0 上的应用程序配置以下警报：\n\n*   Deployment failed（部署失败）\n\
  *   Deployment success（部署成功）\n\n警报的严重级别为 `Critical`、`Warning` 和 `Info`。警报可在服务器和应用程序上配置。对于部署在\
  \ Runtime Fabric 上的应用程序，没有可用的开箱即用警报。\n\n# 功能监控\n\n功能监控使您能够监控作为应用程序网络一部分的公共 API 和私有\
  \ API 的可用性和可靠性。启用功能监控后，您可以持续测试 API，以衡量其在生产和非生产环境中的性能和功能行为。\n\n您可以在 Anypoint Monitoring\
  \ 的功能监控控制台中设置功能监控。\n\n在功能监控中创建监视器有两种方法：\n\n*   使用 Anypoint Monitoring GUI\n*   使用\
  \ `BAT CLI`\n\n### 在功能监控控制台上使用 Anypoint Monitoring GUI，您可以创建一个监视器。请遵循以下步骤：\n\n1.\
  \  **Set up the monitor**（设置监视器）：提供监视器的名称，选择要创建监视器的位置，并安排监视器计划：\n\n    ![Figure\
  \ 14.21 - Step 1 (Set up the monitor)](img/B19922_14_21.jpg`)\n\n    Figure 14.21\
  \ - 步骤 1（设置监视器）\n\n2.  **Select endpoints**（选择端点）：添加一个或多个需要监控的端点。您可以提供需要监控的 API\
  \ 端点，以及可选的任何 Header。您可以添加一个或多个断言来验证 HTTP 状态码、响应体或响应 Header：\n\n    ![Figure 14.22\
  \ - Step 2 (Select endpoints)](img/B19922_14_22.jpg`)\n\n    Figure 14.22 - 步骤 2（选择端点）\n\
  \n3.  **Set notifications**（设置通知）：功能监控支持五种类型的 **Notifier** – **Slack**、**PagerDuty**、**NewRelic**、**SumoLogic**\
  \ 和 **Email**：\n\n    ![Figure 14.23 - Step 3 (Select notifications)](img/B19922_14_23.jpg`)\n\
  \n    Figure 14.23 - 步骤 3（选择通知）\n\n选择您想要使用的 Notifier 并单击 **Create Monitor**。这将创建一个监视器，它将持续监控和测试\
  \ API。创建监视器后，它将根据计划持续监控 API 端点。您可以向同一个监视器添加更多计划：\n\n![Figure 14.24 - API Functional\
  \ Monitoring Dashboard](img/B19922_14_24.jpg`)\n\nFigure 14.24 - API 功能监控仪表板\n\n\
  ### 监视器提供以下信息：\n\n*   平均响应时间（毫秒）\n*   最后一次执行的状态\n*   最近几次执行的摘要，例如 `Assertions Status`\n\
  *   计划信息，如下次运行、计划、执行位置和位置状态\n*   添加更多计划的选项\n*   监视器的测试持续时间\n\n## 监控公共 API 的端点\n\n\
  功能监控允许您在公共位置监控公共 API。公共 API 拥有通过互联网公开可用的端点。公共位置是与其他 MuleSoft 客户共享的区域。公共位置可以与一个或多个监视器的一个或多个计划相关联。\n\
  \n下图描述了如何监控公共端点，这些端点可以与 API、计划、公共位置和环境建立关系：\n\n![Figure 14.25 - Monitoring the endpoints\
  \ of public APIs](img/B19922_14_25.jpg`)\n\nFigure 14.25 - 监控公共 API 的端点\n\n以下监视器已在公共位置创建，用于监控公共端点：\n\
  \n*   **Monitor 1（单一计划、单一公共位置和单一环境）**：`Monitor 1` 在单一计划 (`Schedule 1`) 上运行，该计划与\
  \ `Public Location 1` 相关联。`Monitor 1` 设置为在单一环境中测试公共 `API 1` 和公共 `API 2`。\n*   **Monitor\
  \ 2（多个计划、单一公共位置和单一环境）**：`Monitor 2` 在多个计划 (`Schedule 2` 和 `Schedule 3`) 上运行，它们与\
  \ `Public Location 1` 相关联。`Monitor 2` 设置为在单一环境中测试公共 `API 3` 和公共 `API 4`。\n\n\n\n\
  \n## 监控公共 API 的端点\n\n- `Monitor 3 (multiple schedules, multiple public locations,\
  \ and multiple environments)`：`Monitor 3` 在多个计划上运行（`Schedule 4` 和 `Schedule 5`），并关联多个公共位置（`Public\
  \ Location 1` 和 `Public Location 2`）。`Monitor 3` 设置为在多个环境中测试公共 `API 5` 和公共 `API\
  \ 6`。\n\n- `Monitor 4 (multiple schedules, single location, and single environment)`：`Monitor\
  \ 4` 在多个计划上运行（`Schedule 6` 和 `Schedule 7`），并关联 `Public Location 2`。`Monitor 4` 设置为在单个环境中测试公共\
  \ `API 7` 和公共 `API 8`。\n\n- `Monitor 5 (multiple schedules, multiple locations,\
  \ and single environment)`：`Monitor 5` 在多个计划上运行（`Schedule 8` 和 `Schedule 9`），并关联多个公共位置（`Public\
  \ Location 2` 和 `Public Location 3`）。`Monitor 5` 设置为在单个环境中测试公共 `API 9` 和公共 `API\
  \ 10`。\n\n- `Monitor 6 (multiple schedules, single location, and the World Wide\
  \ Web)`：`Monitor 6` 在多个计划上运行（`Schedule 10` 和 `Schedule 11`），并关联单个公共位置（`Public Location\
  \ 3`）。`Monitor 6` 设置为测试 `API 11` 和 `API 12`，它们可通过万维网访问。\n\n## 监控私有 API 的端点\n\nFunctional\
  \ Monitoring 允许您监控可通过 Anypoint Virtual Private Cloud 访问的私有端点。私有 API 可在 Anypoint\
  \ Virtual Private Cloud 内部的网络中访问。测试只能针对可在私有位置访问的私有 API 运行。可以在单个 Anypoint Virtual\
  \ Private Cloud 中创建多个私有位置，以及与 Anypoint Virtual Private Cloud 关联的私有位置。\n\n要为在 Anypoint\
  \ Virtual Private Cloud 中运行的私有端点设置监控，我们需要在 Functional Monitoring 中创建一个私有位置，这将在 Anypoint\
  \ Virtual Private Cloud 中创建应用程序以监控私有 API。这将默认消耗 `0.2 vCores`。此配置可根据您的需求进行更改，例如更多工作节点和工作节点大小。要创建私有位置，请在创建监控时从\
  \ `Select location` 下拉菜单中选择 `Create new location`。为您的私有位置提供 `Name` 和 `Environment`\
  \ 详细信息：\n\n![图 14.26 - 在 Functional Monitoring 中创建私有位置和监控](img/B19922_14_26.jpg)\n\
  \n图 14.26 - 在 Functional Monitoring 中创建私有位置和监控\n\n创建私有位置后，它将在 Anypoint Virtual Private\
  \ Cloud 内的 CloudHub 中部署应用程序，以便您可以监控私有端点：\n\n![图 14.27 - 私有位置应用程序部署到 CloudHub](img/B19922_14_27.jpg)\n\
  \n图 14.27 - 私有位置应用程序部署到 CloudHub\n\n在图 14.27 中，我们可以看到应用程序已部署到 Anypoint Virtual Private\
  \ Cloud 内的 CloudHub，以便我们可以监控私有端点。它也能够监控公共端点。\n\n下图显示了如何监控与 API、计划、私有位置和环境具有关系的私有端点：\n\
  \n![图 14.28 - 监控私有 API 的端点](img/B19922_14_28.jpg)\n\n图 14.28 - 监控私有 API 的端点\n\n\
  以下监控已在公共位置创建，用于监控私有端点：\n\n- `Monitor 1 (single schedule, single private location,\
  \ and single environment)`：`Monitor 1` 在单个计划上运行（`Schedule 1`），关联 `Private Location\
  \ 1`。`Monitor 1` 设置为在单个环境中测试私有 `API 1`。\n\n- `Monitor 2 (multiple schedules, single\
  \ private location, and single environment)`：`Monitor 2` 在多个计划上运行（`Schedule 2` 和\
  \ `Schedule 3`），关联 `Private Location 1`。`Monitor 2` 设置为在单个环境中测试私有 `API 2` 和私有 `API\
  \ 3`。\n\n- `Monitor 3 (multiple schedules, multiple private locations, and single\
  \ environment)`：`Monitor 3` 在多个计划上运行（`Schedule 4` 和 `Schedule 5`），关联多个私有位置（`Private\
  \ Location 1` 和 `Private Location 2`）。Monitor 3 设置为在多个环境中测试公共 `API 5` 和公共 `API 6`。\n\
  \n- `Monitor 4 (multiple schedules, multiple private locations, and multiple environments)`：`Monitor\
  \ 4` 在多个计划上运行（`Schedule 6` 和 `Schedule 7`），关联多个私有位置（`Public Location 1` 和 `Private\
  \ Location 2`）。`Monitor 4` 设置为在多个环境中测试公共 `API 6` 和公共 `API 7`。\n\n- `Monitor 5 (multiple\
  \ schedules, single private location, and single environment)`：`Monitor 5` 在多个计划上运行（`Schedule\
  \ 8` 和 `Schedule 9`），关联单个私有位置（`Private Location 3`）。`Monitor 5` 设置为在单个环境中测试公共 `API\
  \ 8` 和公共 `API 9`。\n\n- `Monitor 6 (multiple schedules, single private location,\
  \ and the World Wide Web)`：`Monitor 6` 在多个计划上运行（`Schedule 10` 和 `Schedule 11`），关联单个私有位置（`Public\
  \ Location 3`）。`Monitor 6` 设置为测试 `API 10` 和 `API 11`，它们可通过万维网访问。\n\nMuleSoft 提供选项，以便您可以从公共位置监控私有端点。这可以通过向\
  \ Anypoint Virtual Private Cloud 添加防火墙规则轻松实现。\n\n在 Anypoint Virtual Private Cloud\
  \ 防火墙规则中，`Type` 必须设置为 `https.port`，`Source` 可以自定义，`Port Range` 必须为 `8082`。对于自定义源，根据您的公共位置，添加表\
  \ 14.2 中显示的以下 IP 地址之一：\n\n![图 14.29 - 用于监控私有端点的 Anypoint Virtual Private Cloud 防火墙规则](img/B19922_14_29.jpg)\n\
  \n图 14.29 - 用于监控私有端点的 Anypoint Virtual Private Cloud 防火墙规则\n\n使用这种方法，您无需创建私有位置即可监控私有端点。这将节省运行应用程序所需的\
  \ vCores，以便您可以从私有位置监控私有端点：\n\n| 公共位置 | IP 地址 |\n| --- | --- |\n| us-east-1 | 3.82.89.58\
  \ |\n| us-east-2 | 3.128.151.139 |\n| eu-central-1 | 18.156.106.167 |\n\n表 14.2\
  \ - IP 地址（公共位置）\n\n表 14.2 显示了公共位置的各种 IP 地址。\n\n# 为什么日志记录很重要？\n\n日志记录对于任何应用程序都至关重要，用于事件和消息跟踪、故障排除、衡量应用程序性能以及识别应用程序中发生的错误。日志记录对于任何开发人员和运维人员快速识别和排查问题都至关重要。\n\
  \nMuleSoft 提供应用程序和运行时日志，以排查与应用程序和 Mule 运行时相关的问题。记录器组件可用于您的应用程序中，以进行监控和故障排除。它记录错误信息、负载和任何其他信息。此组件可在流中的任何位置使用，以记录字符串或\
  \ DataWeave 表达式，或字符串和 DataWeave 表达式的组合。\n\n## Anypoint Monitoring 中的日志\n\n\n\n\n\
  要在 Anypoint Monitoring 中启用日志，您需要 Titanium 订阅。Anypoint Monitoring 会聚合日志文件，随后您可以对其进行管理、搜索、筛选或分析。日志可按应用程序、环境、日志级别、环境类型、类、时间戳、工作器等进行筛选。Anypoint\
  \ Monitoring 允许您以表格或 JSON 格式查看日志，并且您可以使用高级搜索查询来搜索日志。\n\n## 了解部署到 CloudHub 的 MuleSoft\
  \ 应用程序的日志记录\n\n每当应用程序部署到 CloudHub 时，它都会提供部署日志，包括该应用程序的系统日志和工作器日志。日志将保留 30 天（约 4\
  \ 周半）或 100 MB 数据，以先达到的限制为准：\n\n![图 14.30 - CloudHub 部署日志](img/B19922_14_30.jpg)\n\
  \n图 14.30 - CloudHub 部署日志\n\n如前图所示，CloudHub 提供了下载 `Logs`（日志）、`Diagnostics`（诊断）和\
  \ `Mule Logs`（Mule 日志）的选项：\n\n![图 14.31 - CloudHub 日志搜索](img/B19922_14_31.jpg)\n\
  \n图 14.31 - CloudHub 日志搜索\n\n图 14.31 显示日志可以根据其周期和优先级进行搜索。\n\n### 将 CloudHub 应用程序日志发送到外部系统\n\
  \n部署到 CloudHub 的应用程序可以使用 `log4j2.xml` 与 ELK 或 Splunk 等外部日志记录系统集成。如果我们想将日志发送到外部系统，需要禁用\
  \ CloudHub 日志设置。默认情况下，您将看不到禁用 CloudHub 日志的选项。要使其在 CloudHub 的应用程序设置中可见，您需要联系 MuleSoft\
  \ 支持团队：\n\n![图 14.32 - 在 CloudHub 上禁用 CloudHub 日志](img/B19922_14_32.jpg)\n\n图 14.32\
  \ - 在 CloudHub 上禁用 CloudHub 日志\n\n一旦该选项如图 14.32 所示变得可见，您可以勾选 `Disable CloudHub logs`（禁用\
  \ CloudHub 日志）以将日志发送到 Splunk 和 ELK 等外部系统。请注意，您还需要向 `log4j2.xml` 文件添加一个 appender（附加器）以将日志发送到外部系统。\n\
  \n要将日志发送到 Splunk，您可以向部署到 CloudHub 的应用程序的 `log4j2.xml` 文件添加 Splunk 或 HTTP appender：\n\
  \n这是 Splunk appender：\n\n```xml\n<SplunkHttp name=\"SPLUNK-CLOUD\" source=\"mule-cloudhub-app\"\
  \ url=\"http://localhost:8088/\"\n            token=\"b3a34eabd-b5f4-471431-97d2-e5b234af5bae9e\"\
  \            index=\"main\"\n            disableCertificateValidation=\"true\">\n\
  \            <PatternLayout pattern=\"[%d{MM-dd HH:mm:ss}] %-5p %c{1}          \
  \  [%t]: %m%n\" />\n</SplunkHttp>\n```\n\n这是 HTTP appender：\n\n```xml\n<Http name=\"\
  Splunk\" url=\"http://localhost:8088/services/collector/raw\">\n  <Property name=\"\
  Authorization\" value=\"Splunk eert8e102-5f55-40ad-   a047-b55a82245419\"></Property>\n\
  \  <PatternLayout pattern=\"%-5p %d [%t] [event: %X{correlationId}] %c:  %m%n\"\
  ></PatternLayout>\n</Http>\n```\n\n要将日志发送到 ELK，您可以向部署到 CloudHub 的应用程序的 `log4j2.xml`\
  \ 文件添加 socket appender。\n\n这是 socket appender：\n\n```xml\n<Socket name=\"socket\"\
  \ host=\"${sys:elk.host}\" port=\"${sys:elk.port}\" protocol=\"TCP\">\n  <PatternLayout\
  \ pattern=\"%-5p %d [%t] [event: %X{correlationId}] %c:  %m%n\"></PatternLayout>\n\
  </Socket>\n```\n\n如果您禁用了 CloudHub 日志但仍可将日志发送到 CloudHub，请在 `log4j2.xml` 中使用 `Log4J2CloudhubLogAppender`。`Log4J2CloudhubLogAppender`\
  \ 将日志数据发送到 CloudHub。这是 log4j2 CloudHub appender：\n\n```xml\n<Log4J2CloudhubLogAppender\
  \ name=\"CLOUDHUB\"\n            addressProvider=\"com.mulesoft.ch.logging.    \
  \        DefaultAggregatorAddressProvider\"\n            applicationContext=\"com.mulesoft.ch.logging.\
  \            DefaultApplicationContext\"\n            appendRetryIntervalMs=\"${sys:logging.appendRetryInterval}\"\
  \n            appendMaxAttempts=\"${sys:logging.appendMaxAttempts}\"\n         \
  \   batchSendIntervalMs=\"${sys:logging.batchSendInterval}\"\n            batchMaxRecords=\"\
  ${sys:logging.batchMaxRecords}\"\n            memBufferMaxSize=\"${sys:logging.memBufferMaxSize}\"\
  \n            journalMaxWriteBatchSize=\"${sys:logging.            journalMaxBatchSize}\"\
  \n            journalMaxFileSize=\"${sys:logging.journalMaxFileSize}\"\n       \
  \     clientMaxPacketSize=\"${sys:logging.clientMaxPacketSize}\"\n            clientConnectTimeoutMs=\"\
  ${sys:logging.            clientConnectTimeout}\"\n            clientSocketTimeoutMs=\"\
  ${sys:logging.clientSocketTimeout}\"\n            serverAddressPollIntervalMs=\"\
  ${sys:logging.            serverAddressPollInterval}\"\n            serverHeartbeatSendIntervalMs=\"\
  ${sys:logging.            serverHeartbeatSendIntervalMs}\"\n            statisticsPrintIntervalMs=\"\
  ${sys:logging.            statisticsPrintIntervalMs}\">\n            <PatternLayout\
  \ pattern=\"%-5p %d [%t] [event:            %X{correlationId}] %c: %m%n\"/>\n</Log4J2CloudhubLogAppender>\n\
  ```\n\n## 了解部署到 CloudHub 2.0 的 MuleSoft 应用程序的日志记录\n\n每当应用程序部署到 CloudHub 2.0 时，它将提供运行时日志和应用程序日志。在\
  \ CloudHub 2.0 中，应用程序日志和运行时日志会被合并。它们可以从 Runtime Manager GUI 下载。\n\n这些日志将保留 30 天（约\
  \ 4 周半）或 200 MB 数据，以先达到的限制为准。\n\n如果在应用程序设置中未勾选 `Enable application logs`（启用应用程序日志），日志将不会转发到\
  \ Anypoint Monitoring 和 Anypoint Runtime Manager：\n\n![图 14.33 - 在 CloudHub 2.0\
  \ 中启用应用程序日志](img/B19922_14_33.jpg)\n\n图 14.33 - 在 CloudHub 2.0 中启用应用程序日志\n\n部署到\
  \ CloudHub 2.0 的应用程序可以通过在应用程序的 `log4j2.xml` 文件中配置相关 appender 来与外部日志记录系统集成，正如本章前面所讨论的那样。\n\
  \n## 了解部署到本地/混合环境的 MuleSoft 应用程序的日志记录\n\n部署到本地 Mule 运行时的应用程序的日志可以在 `MULE_HOME/logs`\
  \ 文件夹中找到，您可以在其中找到特定于应用程序的日志和运行时日志。也可以通过向 `log4j2.xml` 文件添加适当的 appender 将日志发送到外部系统。\n\
  \n正如我们已经讨论的，我们可以使用 Splunk 和 HTTP appender 将日志发送到 Splunk，并使用 socket appender 将日志发送到\
  \ ELK。\n\n每当应用程序部署在混合环境中时，可以配置 Splunk 或 ELK 将事件跟踪或 API 分析发送到 Splunk 或 ELK。这可以在 Runtime\
  \ Manager 的 Server Plugin（服务器插件）控制台中启用：\n\n![图 14.34 - 为部署在混合环境中的本地应用程序启用日志记录](img/B19922_14_34.jpg)\n\
  \n图 14.34 - 为部署在混合环境中的本地应用程序启用日志记录\n\n图 14.34 显示了 API 分析和事件跟踪，可为混合环境中的 Splunk 和\
  \ ELK 启用这些功能：\n\n![图 14.35 - 为混合环境配置 Splunk 事件跟踪](img/B19922_14_35.jpg)\n\n图 14.35\
  \ - 为混合环境配置 Splunk 事件跟踪\n\n图 14.35 展示了如何为混合环境配置 Splunk 事件跟踪。\n\n## 了解部署到裸金属系统/VM\
  \ 上的 Runtime Fabric 的 MuleSoft 应用程序的日志记录\n\n部署到 Runtime Fabric 的应用程序会为应用程序、Runtime\
  \ Fabric 服务、API 代理和 Kubernetes 服务生成日志。托管在裸金属服务器或 VM 上的 Runtime Fabric 的日志在 OpsCenter\
  \ 中可见。\n\n您可以将 Runtime Fabric 配置为将日志转发到 Splunk、ELK、CloudWatch、Data Dog 或 Syslog\
  \ 等外部日志记录系统，也可以配置为将日志转发到 Anypoint Monitoring。要将日志转发到 Anypoint Monitoring，您需要 Titanium\
  \ 订阅。\n\n可以通过在部署到 Runtime Fabric 的应用程序的 `log4j2.xml` 文件中配置 appender，将日志转发到 Splunk\
  \ 或 ELK 等外部系统。我们在本章前面讨论了如何在 `log4j2.xml` 文件中配置 appender。\n\n\n\n\n# 第 14 章：使用 Anypoint\
  \ Platform 进行监控和日志记录\n\n## OpsCenter\n\nOpsCenter 是一个基于 Web 的工具，可用于监控裸金属服务器或虚拟机上的\
  \ Runtime Fabric。OpsCenter 允许我们将日志转发到外部系统和 Anypoint Monitoring，提供 SSO 集成，并提供 Runtime\
  \ Fabric 的健康报告。它还提供仪表板以查看 CPU 核心使用率、Pod 指标、入口指标等。\n\nRuntime Fabric 自带各种内置警报，并且可以使用\
  \ `Kapacitor` 配置自定义警报。\n\n## Mule 应用程序的 JSON 日志记录\n\nMuleSoft 提供了一个开箱即用的记录器组件，可用于应用程序中记录信息、错误、负载和状态通知。这在调试和排查任何问题时非常有用。记录器组件可用于\
  \ Mule 流中的任何位置，它允许您记录字符串数据、`DataWeave` 表达式的输出，或字符串数据和表达式的组合。\n\n还有另一个可用于日志记录的组件，称为\
  \ `JSON Logger`，这是一个开源自定义连接器，允许您以 JSON 格式记录日志。由于它是自定义连接器，因此不受 MuleSoft 官方支持或管理。该组件提供以下功能：\n\
  \n*   日志采用 JSON 格式。\n*   在记录前对敏感数据进行掩码处理。\n*   隐藏不应记录的字段。\n*   将日志发送到外部系统，如 `JMS`、`Anypoint\
  \ MQ`、`AMQP` 等。\n*   作用域记录器允许您计算一个或多个组件的耗时。可用于衡量 Mule 流中一个或多个组件的性能。\n*   一个 `DataWeave`\
  \ 函数，用于适应所需的日志格式。\n*   `JSON Logger` 可根据您的要求和需求进行定制。\n*   记录位置信息。\n*   `JSON Logger`\
  \ 可以添加到 Mule 流中的任何位置，它会异步记录日志。\n\n## Anypoint Visualizer\n\nAnypoint Visualizer\
  \ 提供了正在运行和发现的 API 及 Mule 应用程序的实时图形化表示。它还显示了 Mule API、代理或应用程序网络中的应用程序所调用的第三方系统。\n\
  \nAnypoint Visualizer 收集部署在 `CloudHub` 上的 Mule 应用程序、API 和代理的数据，独立于 Mule 运行时引擎（Mule\
  \ 实例），或在 `Runtime Fabric` 中收集数据，以定位所有传入和传出连接。如果应用程序、API 或代理在受支持的 Mule 实例上运行，则会连同所有依赖项一起被发现：\n\
  \n![Figure 14.36 - Anypoint Visualizer](img/B19922_14_36.jpg)\n\n图 14.36 - Anypoint\
  \ Visualizer\n\n## 总结\n\nAnypoint Monitoring 提供开箱即用的仪表板并支持自定义仪表板。它还允许您为各种条件配置警报，例如超过\
  \ CPU 使用率或内存使用率。\n\n功能监控可配置为监控和测试公共和私有端点。Runtime Manager 为部署在 `CloudHub` 或混合环境中的应用程序提供开箱即用的警报。\n\
  \n部署在 `CloudHub`、混合环境和 `Runtime Fabric` 上的应用程序可以将日志转发到外部系统，如 `Splunk`、`ELK`、`Data\
  \ Dog` 和 `Syslog`。API Manager 提供 API 分析信息，并允许您配置自定义仪表板和设置 API 警报。\n\n在下一章中，我们将学习如何通过通用\
  \ API 管理控制 API 蔓延。\n\n## 延伸阅读\n\n要了解本章涵盖主题的更多信息，请查看以下资源：\n\n*   *MuleSoft 文档*：CloudHub\
  \ Architecture | MuleSoft Documentation\n*   *本章中引用的几个表格来自 MuleSoft 官方文档*：[`docs.mulesoft.com/`](https://docs.mulesoft.com/)\n\
  *   *Anypoint Monitoring*：[`docs.mulesoft.com/monitoring/`](https://docs.mulesoft.com/monitoring/)\n\
  *   *日志*：[`docs.mulesoft.com/monitoring/logs`](https://docs.mulesoft.com/monitoring/logs)\n\
  *   *JSON Logger*：[`blogs.mulesoft.com/dev-guides/how-to-tutorials/json-logging-mule-4/`](https://blogs.mulesoft.com/dev-guides/how-to-tutorials/json-logging-mule-4/)\n"
- '# 第 15 章：使用通用 API 管理控制 API 蔓延


  本章将演示如何使用 API Manager 管理 MuleSoft 和非 MuleSoft API 的生命周期。本章将解决 API 蔓延的成因，并概述如何使用通用
  API 管理来控制 API 蔓延。


  在本章中，我们将涵盖以下主题：


  *   API 蔓延

  *   通用 API 管理

  *   API 网关

  *   治理和保护 API

  *   在 API 上启用 API 策略

  *   管理 API 警报和分析

  *   API 治理和安全


  ## API 蔓延


  API 蔓延是用于描述企业内部 API 无序增长的概念。当组织内的团队或部门在缺乏足够监控或控制的情况下，为满足自身目的开发自己的 API 时，可能会导致 API
  蔓延。这可能导致大量维护不善、无文档或不安全的 API。从 API 安全的角度来看，API 蔓延带来了严重的安全漏洞，必须加以解决。


  以下原因可能导致 API 蔓延：


  *   **缺乏集中式治理**：如果公司内的多个团队或部门在没有集中式治理框架的情况下创建自己的 API，可能会导致重复、重叠或不兼容的 API。

  *   **非计划性增长**：为了适应新技术的采用和组织需求的变化，会开发新的 API。如果缺乏充分的准备，这可能会导致无法管理的 API 激增。

  *   **供应商锁定**：如果组织过度依赖单一供应商来满足其技术需求，可能会开发出大量与其他系统不兼容的供应商专用 API。

  *   **收购和合并**：收购或与其他企业合并的公司可能会接管被收购企业开发的一系列 API。这些 API 与组织现有 API 之间可能存在不兼容性，从而导致
  API 蔓延。

  *   **缺乏标准和文档**：当 API 没有良好的文档或不遵循行业标准时，开发人员可能难以理解如何高效使用 API。这可能导致额外的、冗余的 API 被创建出来，从而加剧
  API 蔓延。


  ## 如何防止 API 蔓延


  组织采用 API 最佳实践并实施清晰的 API 治理策略以防止 API 蔓延至关重要。防止 API 蔓延的第一步是盘点组织内的 API，确定哪些 API 对业务至关重要，并淘汰不再使用或不再需要的
  API。


  一旦创建了对业务至关重要的 API 清单，您就可以开始制定防止 API 蔓延的策略。以下是可以防止 API 蔓延的策略：


  *   **使用单一来源进行 API 发现**：如果没有单一的事实来源，开发人员很难找到 API 并弄清其功能。例如，多条业务线可能会创建其他团队不知情的 API。这将在组织内部产生冗余
  API，从而降低 API 在组织内的可重用性。一个可以在单一位置存储所有 API 的集中式平台将允许开发人员发现组织内的 API。开发者门户可用于发现 API，并将成为开发人员了解和发现组织内
  API 的中心场所。






  # 防止 API 蔓延


  * **建立 API 治理**：组织应建立强有力的 API 治理来控制或防止 API 蔓延。这将确保 API 设计为可复用且易于扩展。API 治理是在组织内定义
  API 最佳实践指南和标准的过程，旨在促进 API 复用，并推动 API 一致性和安全性。API 治理是采用 **API 优先策略** 的关键，在该策略中，API
  是产品创建的基础。在 API 优先策略中，所有利益相关者、开发人员、设计师、架构师和产品经理在 API 创建之前就已知晓其存在。为实现这一点，建立 API 治理策略至关重要。


  * **使用合适的 API 版本控制**：API 版本控制至关重要，因为大多数 API 都会超出其原始范围，或需要修复缺陷，这意味着 API 功能很可能会发生变更。API
  版本控制将确保 API 的**向后兼容性**，因此变更不会影响现有的 API 消费者，他们可以逐步迁移到最新版本的 API。


  * **限制创建的 API 数量**：限制创建的 API 数量是防止 API 蔓延的一种策略。这可以通过制定严格的指南来确定何时需要新 API，并确保所有相关方都认同其必要性来实现。此外，这应传达给开发团队和
  CISO 团队，以便跨所有开发团队协调任务。


  * **实施通用 API 管理**：API 的使用将随着时间的推移而不断增长。因此，最好现在就处理 API 蔓延问题，而不是等到它失控。通过开发一种通用化解决方案，确保所有
  API 都可被发现且能够相互交互，可以阻止 API 蔓延并解决许多其他问题。我们将在本章进一步讨论通用 API 管理。


  * **设计 API 规范**：API 规范是防止 API 蔓延的宝贵工具。在 API 规范的帮助下，开发人员可以查看 API 及其所有组成部分。它是一种自动生成的文档，易于人类阅读，解释了
  API 的功能、来自 API 的请求和响应格式，以及 API 所需的其他参数（如标头）。API 规范可以用 **REST API 建模语言** (**RAML**)、**Open
  API 规范** (**OAS**) 或其他语言编写。


  本节涵盖了 API 蔓延及其预防主题。下一节将介绍有助于阻止 API 蔓延的通用 API 管理理念。


  # 通用 API 管理


  无论 API 的设计、托管环境或开发地点如何，为其提供完整生命周期管理能力的能力被称为**通用 API 管理**。


  借助通用 API 管理，您可以从单一控制平面控制、监管和保护多个 API。无论 API 是 Mule 还是非 Mule，无论它们托管在何处（本地、云端或其他地方），均可在以下领域实现这一点。


  企业可利用的通用 API 管理优势如下：


  * **适用于任何架构**：企业正在采用或实施多种架构风格，从微服务架构到单体架构。通过基于平台的安全性和管理，通用 API 管理允许企业使用任何架构风格或模式。


  * **适用于任何来源的 API**：由于采用了微服务架构，企业正在将 AsyncAPI 和 GraphQL 等新协议纳入其 RESTful 技术栈。得益于通用
  API 管理，组织可以使用任何 API，无论其开发地点或所用协议如何。


  * **适用于任何环境**：在通用 API 管理的帮助下，您可以发现、管理、保护并与在任何类型环境中运行的 API 进行交互——本地、云、混合或其他环境。


  * **适用于任何技术**：通用 API 管理使企业能够从单一控制面板处理 API 生命周期，独立于用于实现 API 的技术平台。


  * **面向任何受众**：通用 API 管理为组织的所有 API 提供了一个中央存储库，使内部和外部受众能够以多种角色参与并增加价值。这包括建立新的联盟、增强最终用户体验和创造新的业务策略。


  让我们讨论 MuleSoft 提供的用于实现通用 API 管理的各个组件：


  * **设计中心**：设计中心是 Anypoint Platform 的一部分，允许开发人员用 OAS、RAML 和 AsyncAPI 编写 API 规范。


  * **Anypoint CLI**：Anypoint CLI 允许开发人员自动编目、发现或复用 Anypoint Exchange 中的 API。


  * **API 管理器**：API 管理器将管理 API 的整个生命周期。它是一个统一的单一平台，允许您管理所有 API。API 管理器使您能够应用安全策略，如
  IP 允许列表、IP 阻止列表、客户端 ID 强制策略和 JWT 验证策略，以保护 API。


  * **Flex 网关**：这是一个超快的 API 网关，使您能够以更快的响应和更低的占用来管理和保护 API。


  * **Anypoint Exchange**：Anypoint Exchange 是可复用资产的存储库。Anypoint Exchange 允许您在企业内存储连接器、模板、API、片段、自定义资产等。您可以对资产进行编目（发布）、共享、搜索、发现和复用，以促进标准化、提高生产力和促进协作。


  * **Anypoint 社区管理器** (**ACM**)：您可以使用 Anypoint API 社区管理器为公司内外的合作伙伴和开发人员创建和管理围绕 API
  的社区。它创建利用您 API 的应用程序。借助 Salesforce Experience Cloud，API 社区管理器可以定制、品牌化、推广和互动，以满足您开发者受众的各种需求。除了为
  Anypoint Exchange 中编目的 API 提供丰富的 API 展示外，还可使用 API 社区管理器管理客户端应用、API 访问凭证和消费分析。


  * **API 体验中心**：您可以借助 Anypoint API 体验中心构建动态生态系统并增加 API 产品的参与度。使用现成的模板，您可以快速简便地创建自定义
  API 门户，以将在任何平台或技术上开发的 API 产品化和发布。


  我们已经讨论了通用 API 管理的优势以及如何防止 API 蔓延。现在我们将详细研究 MuleSoft 提供的 API 管理功能和组件，以监督完整的 API 生命周期。


  # API 管理


  为企业创建、设计、测试、监控、保护和分析 API 的过程称为 **API 管理**。API 管理平台提供一套全面的软件解决方案和流程，可托管在混合环境、云端或本地。通过
  API 管理，企业可以确保内部或公开暴露的 API 是安全的、可消费的和可扩展的。


  ## 完整 API 管理生命周期


  管理 API 从创建到退役的整个生命周期的过程称为**完整 API 生命周期管理**。这涵盖了创建、传播、记录、保护和评估 API 的各个方面。一个促进 API
  发现和复用，同时确保适当治理和安全性的 API 管理系统，是任何成功 API 战略的基本组成部分。






  # API 生命周期管理


  MuleSoft 的 Anypoint Platform 为端到端 API 生命周期管理提供了强大的解决方案。清晰了解每个阶段有助于您提高 API 有效性并更快地解决潜在问题。API
  生命周期的每个阶段如下：


  ## 1. 设计


  使用 API Designer，您可以指定 API 的功能。例如，如果您正在为银行网站开发 API，您需要指定用于获取账户信息、创建账户和客户等的端点。创建功能测试和文档，以及为
  `REST` API 设计 `RAML` 或 `OAS` 规范、为事件驱动架构设计 `AsyncAPI`，都是该阶段的内容。设计阶段是 API 生命周期的第一个阶段，也是最重要的阶段之一。在开发和实施之前，必须在此阶段规划和设计
  API 结构：


  ### 1.1 创建 API 规范


  这包括定义 API 将做什么、将处理什么数据以及将执行什么业务逻辑。规范使用 `RAML` 或 `OAS` 等语言创建。


  ### 1.2 定义端点和方法


  设计 API 资源 URI 以及将对这些资源进行操作的 `HTTP` 方法（`GET`、`POST`、`PUT`、`DELETE` 等）。


  ### 1.3 设计数据模型


  定义 API 将发送和接收的数据。这涉及规划 `JSON` 或 `XML` 消息结构、数据类型和数据元素。


  ### 1.4 创建模拟服务


  MuleSoft 允许您在设计阶段创建模拟服务。这使 API 消费者能够在 API 完全实现之前与其进行交互。


  ### 1.5 文档


  从 API 规范自动生成 API 文档。文档详细说明如何使用 API 并提供示例。


  ### 1.6 协作与评审


  与利益相关者和 API 消费者共享设计以进行评审和反馈。这可以直接通过 Anypoint Platform 中的 Anypoint Exchange 完成。


  请记住，API 的成功最终取决于其为用户设计得有多好。在设计阶段，确保 API 易于使用且易于理解，并确保其准确满足其设计初衷的业务需求和目标，至关重要。


  ## 2. 开发


  Anypoint Studio 允许您将设计转换为功能代码。开发人员利用预制的连接器和组件创建 Mule 应用程序。例如，在银行场景中，您可以定义一个流来分别处理账户信息的
  `GET` 和 `POST` 请求，并使用 `HTTP` 监听器作为源。


  ## 3. 安全


  在此阶段，您可以使用基于策略的安全模型（如 `OAuth` 和 `JWT` 验证）来保护您的 API。例如，您可以将策略应用于 API 代理以保护您的银行 API
  端点，包括 `IP` 白名单或速率限制。


  ## 4. 部署


  API 可以使用 Anypoint Runtime Manager 部署在云端、本地或混合环境中。例如，您的银行 API 可以部署到 CloudHub，确保在购物高峰期的可用性和可扩展性。


  ## 5. 运营


  Anypoint Monitoring 和 Anypoint Visualizer 对 API 进行管理、监控、分析和可视化。在银行 API 示例中，Anypoint
  Monitoring 监控 API 的响应时间和请求数量。此外，Anypoint Visualizer 可以创建所有 API 和集成的实时视图，实时描绘应用程序网络。


  ## 6. 管理


  Anypoint Exchange 和 Anypoint API Manager 提供了一个用于管理、治理和发布 API 的环境。假设您的银行有多个 API。API
  Manager 将从单一位置管理这些 API，设置 `SLA` 和策略，并控制访问。


  ## 7. 版本控制与弃用


  Anypoint Platform 简化了 API 版本控制。每当需要更改时，您可以引入新版本并弃用旧版本。在我们的银行示例中，如果订单处理方式发生变化，可以引入
  API 的新版本。


  ## 8. 互动


  这是 API 用户可以探索和试用 API、提供反馈以及在 Anypoint Exchange 中发现资产的地方。在我们的银行示例中，第三方开发者可以访问 Anypoint
  Exchange，找到您的 API 文档，了解其功能，并学习如何将其集成到他们的应用程序中。


  通过这些阶段，API 不断演进。生命周期管理确保这种演进不会影响所提供的服务，并确保阶段之间的过渡平滑，从而提高 API 的整体实用性、可靠性和盈利能力。


  本节展示了用于设置和维护 API 的 API 管理生命周期。我们将在下一节讨论用于管理和保护 API 的 MuleSoft API 网关。


  # API 网关


  API 网关是一个典型元素，有助于路由 API 调用、聚合 API 响应，并通过速率限制等功能强制执行 `SLA`。它充当传入消息和请求的入口点，使其成为 API
  管理系统的关键组件或工具。


  组织的 API 由 API 网关保护，后者也充当安全访问点。它们实施行业标准的加密和访问控制，赋予 API 开发者授予访问权限并将用户引导至正确方向的能力。网关将您构建的后端服务和
  API 隔离在一个可由您的 API 管理解决方案控制的层中。


  ## 为什么需要 API 网关？


  API 网关在保护和控制 API 流量方面发挥着重要作用。API 网关隐藏 API 的实际实现，并在 API 消费者和 API 实现之间提供隔离。


  API 网关提供以下功能：


  *   **流量控制**：通过应用 `rate-limiting` 策略可以限制流量，这有助于减少 `分布式拒绝服务 (DDoS)` 和 `拒绝服务 (DoS)`
  攻击。例如，每个客户端每分钟可调用 API 20 次。

  *   **API 分析**：依赖 API 的企业必须投资于 API 分析，因为它提供了关于客户行为和 API 性能的全面洞察，这直接关系到数字战略的有效性。

  *   **API 警报**：可以为响应时间、请求计数、策略违规和响应代码启用 API 警报。

  *   **身份验证和授权**：通过应用基本身份验证、`JWT` 验证策略和 `OAuth` 策略等安全策略，可以对 API 进行授权和身份验证。

  *   **高效且富有成效的 API 开发**：运行多个 API 版本以促进新版本的快速迭代、测试和交付。转换协议以支持使用单个 API 的各种客户端。


  MuleSoft 支持三种类型的 API 网关，可用于管理 API 的不同目的：


  *   `Mule Gateway`

  *   `Service Mesh`

  *   `Flex Gateway`


  # Mule Gateway


  `Mule Runtime` 包含一个嵌入式 API 网关，它允许您通过在 API 之上应用安全 API 策略来保护 API，丰富传入和传出的 API 消息，并使用
  `IP allowlist` 或 `blocklist` 策略丢弃来自不受信任来源的请求。`Mule Gateway` 允许您在后端 API 或服务之上添加一个编排层，这将把编排层与实现层隔离开来。





  Mule Gateway 是 Anypoint Platform API Manager 的组件，用于控制 API 流量和 API 访问、强制执行使用策略，以及收集和整理
  API 分析数据。它充当所有 API 的守门人，将访问权限仅限于经过授权和验证的用户或应用程序。API 网关负责强制执行 SLA、身份验证和授权，以及请求路由、组合和协议转换。它为用户应用程序与您的
  API 或微服务之间，以及您的网络上提供安全保障。


  现在，我们将讨论利用 API 自动发现 和 API 代理 在 MuleSoft 和非 MuleSoft API 上提供 API 管理功能的两个关键概念。


  ## API 代理


  一种称为 API 代理 的 MuleSoft 功能充当应用程序和后端 API 之间的桥梁。MuleSoft 的 API 代理使您能够更高效地管理 API，确保其具有可扩展性、安全性和处理流量的能力。


  以下是 API 代理的优势：


  *   **安全性**：可以设置 API 代理以提供权限和身份验证等安全功能，保护后端 API 免受未经授权的访问。

  *   **限流**：API 代理允许我们控制发送到后端 API 或服务的请求数量。简单来说，API 代理可以限制发送到后端 API 或服务的请求数量，防止后端
  API 因一次性接收过多请求而不堪重负。

  *   **监控和分析**：出于监控和调试目的，API 代理可以跟踪请求和响应，并提供有价值的数据。

  *   **缓存**：代理可以保存后端 API 的响应，用于回复相同的请求，从而减轻后端负载并缩短响应时间。

  *   **隐藏 API 实现**：API 代理通过不直接暴露后端 API 的 URL 来隐藏后端 API 的实现。


  MuleSoft API 代理可以部署在 `CloudHub 1.0`、`CloudHub 2.0`、本地 `Mule Runtime` 和 `Anypoint
  Runtime Fabric` 上。每当您使用 `API Manager` 创建 API 代理时，它都会在所选平台上创建一个代理应用程序。例如，在 `CloudHub
  1.0` 上创建 API 代理至少需要 0.1 个 vCore 和一个工作节点。


  ## 何时使用 API 代理


  以下是使用 API 代理的原因：


  *   当您的 API 是非 MuleSoft API，并且您希望为非 MuleSoft API 启用 MuleSoft API 管理功能时

  *   当您希望使用 `RAML`、`OAS` 或 `SOAP` API 验证 API 时

  *   当您的 Mule 应用程序是闭源代码，且您无法访问以应用 API 自动发现时


