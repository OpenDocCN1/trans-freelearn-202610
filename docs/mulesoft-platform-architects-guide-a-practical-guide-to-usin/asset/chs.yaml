- "# 第 2 章：平台基础组件与底层架构\n\nMuleSoft 平台不断扩展和演进，为架构师和设计师提供越来越多的能力、特性和功能。一些变化很微妙，而另一些则引入了全新的能力。这甚至还不包括触手可用的所有新连接器。\n\
  \n例如，仅在过去几年中，我们就有了以下变化：\n\n*   容器化运行时 – 基于 `Kubernetes` 的运行时引擎\n*   Composer 流程\
  \ – 由 Salesforce 平台驱动的 `无代码` 集成和开发能力\n*   API Community Manager – 一个用户界面驱动的门户，用于管理使用组织\
  \ `API` 的内部和外部开发人员\n*   API Experience Hub – 下一代 Community Manager，集成了 `Anypoint\
  \ Exchange` 和 `Salesforce Experience Cloud`\n*   DataWeave 模块 – 支持使用数组、二进制、日期、数学、加密等进行开发的附加功能库\n\
  \n\n\n\n\n## MuleSoft Anypoint Platform 架构\n\n### MuleSoft 生态系统中的新功能\n\n*   **DataGraph**\
  \ – 一种用于**应用网络**中数据的低代码/无代码用户界面工具和查询功能，允许开发者通过 GraphQL 请求从数据服务中消费多个 API\n*   **ServiceMesh**\
  \ – 一个网关，提供在 Mule 和非 Mule 应用程序的扩展**微服务**网络中管理和保护 API 的能力\n*   **Flex Gateway** –\
  \ 一种轻量级**API 网关**，用于管理和保护在任何平台上运行的 API\n*   **API Governance** – 一种自动化工具，确保 API\
  \ 规范的开发人员遵循架构团队规定的标准、最佳实践和规则\n*   **Robotic Process Automation (RPA)** – 一种低代码/无代码功能，使企业能够使用“机器人”自动化需要人工输入的流程和任务\n\
  *   **Anypoint Code Builder (ACB)** – 一款面向设计和构建 MuleSoft API 的开发人员的下一代**集成开发环境 (IDE)**\n\
  \n此列表仅代表 MuleSoft 生态系统中提供的最新功能和能力的一小部分。\n\n### 平台组织与章节主题\n\n从根本上说，平台的组织结构保持一致。正如上一章所述，MuleSoft\
  \ Anypoint Platform 由控制平面和运行时平面定义。在本章中，我们将涵盖以下主要主题及其随附的 Anypoint 核心服务：\n\n*   控制平面功能\n\
  *   运行时平面概述\n\n我们将概述您作为架构师需要审查和理解的注意事项，以帮助组织选择合适的控制平面和运行时平面组合。我们还将初步了解平台的一些核心服务。\n\
  \n平台提供了极大的灵活性。集成平台架构师需要了解其组织的技术限制、法规责任、短期和长期目标，以及特定项目的业务需求和技术非功能性需求。我们将在本章中审视这些因素，以了解它们对\
  \ Anypoint Platform 架构的影响。\n\n### 技术要求\n\n在本章中，我们将使用在第 1 章中配置的 Anypoint Platform。\n\
  \n### Anypoint 控制平面\n\nAnypoint 控制平面是一系列产品、工具和服务的集合，它们共同作为管理和治理 MuleSoft 应用程序运行时部署和\
  \ API 的中央枢纽。该控制平面被架构为一组微服务，使该中央枢纽具有可扩展性、高可用性和容错性。此外，这些服务采用 API 优先设计构建。这意味着开发团队和运维团队可以使用\
  \ API 与 Anypoint Platform 进行交互。事实上，与 Anypoint 控制平面中的服务和组件交互有三种方式：\n\n*   标准 Web\
  \ 前端\n*   Anypoint Platform APIs\n*   Anypoint Platform **命令行界面 (CLI)**\n\n这些服务可以纳入您的\
  \ CI/CD 流水线，并通过警报和审计日志提供对其流程和性能的洞察。在本书中，我们将主要使用控制平面的用户界面 Web 前端。对 CLI 工具和平台 API\
  \ 的深入探讨超出了本书的范围。\n\n作为架构师，在设计 Anypoint Platform 架构时，我们需要考虑关于控制平面的三件事：\n\n*   我们将在哪里托管它？\n\
  *   我们将如何保护对它的访问？\n*   我们将如何组织它？\n\n这些服务和管理工具必须运行在某处，所以在下一节中，让我们看看控制平面的托管选项。\n\n\
  #### 控制平面托管选项\n\n架构师的工作之一是审视和了解组织系统现状的当前状态。组织是否采用了基于云的托管服务方法？组织是否仍在自己的数据中心拥有关键系统？上市时间有多重要？是否有需要注意的法规问题？有时我们自以为已经知道终点在哪里。业务告诉我们他们想要现代化，我们知道什么是现代系统，那么为什么不直接去构建它呢？但如果我们在架构过程中试图走捷径；如果我们不花时间去发现事物目前是如何布局的；如果我们不了解起跑线，我们将无法识别出将我们与未来状态架构分隔开的实际差距。这些差距将有助于识别，例如，MuleSoft\
  \ 控制平面应解决什么数据和元数据问题。\n\n目前，MuleSoft 提供了两种运行控制平面的部署选项。第一个选项有三个部署位置：\n\n*   **由 MuleSoft\
  \ 托管和管理：**\n    *   美国 AWS 云，美国东部（弗吉尼亚北部）区域\n    *   欧盟 AWS 云，欧盟（法兰克福）区域\n    *\
  \   AWS GovCloud（仅限美国）\n*   **由客户托管和管理：**\n    *   这涉及在组织自己的硬件/基础设施上本地运行控制平面功能，由组织托管和管理。\n\
  \    *   在组织自己的基础设施上运行控制平面使用一个称为 Anypoint Platform **Private Cloud Edition (PCE)**\
  \ 的产品。安装此产品需要在安装期间与 MuleSoft 专业服务合作。\n\n让我们考虑一些可能影响控制平面放置位置决策的问题：\n\n*   **组织是否采用了基于云的托管服务方法？**\
  \ 如果是，这通常使利用 MuleSoft 托管基础设施的选择变得简单直接。然而，如果组织尚未完全采用基于云的托管服务方法，这将是一个机会，让它开始了解这对其员工、运营和\
  \ IT 能力意味着什么。这本身当然并不自动指向 PCE。\n*   **是否有需要注意的法规问题？** 欧洲的**通用数据保护条例 (GDPR)** 和美国的**联邦风险和授权管理计划\
  \ (FedRAMP)** 对信息技术安全要求产生了深远影响。此外，企业不断面临数据泄露和勒索软件的威胁，导致运营中断和声誉受损。如果您的组织需要 FedRAMP\
  \ 合规，您将需要考虑 Government Cloud 或自托管选项。GDPR 可能要求将所有数据保留在欧盟，因此在某些情况下，同样可能需要基于欧盟的控制平面托管。\n\
  *   **上市时间有多重要？** 当然，没有任何选项能在关键的上市时间场景下击败 MuleSoft 托管的控制平面与 MuleSoft 托管的运行时平面相结合。\n\
  *   **组织是否有自己的策略，要求所有关键系统和数据保留在自己的数据中心，与外界隔离？** PCE 可以满足这一要求。请注意，虽然可以在 AWS、Azure\
  \ 或 Rackspace 等云基础设施上安装 PCE，但这不满足将系统保留在组织数据中心并受其直接控制的要求。\n\n其中一些问题可能会导致相互冲突的答案（例如上市时间非常重要，但组织需要内部数据中心解决方案）。架构师必须与业务和\
  \ IT 团队合作，了解任何相互竞争的优先级，并在推荐控制平面方法之前确认他们的假设。例如，可能会假设美国政府或州机构需要 FedRAMP 合规。然而，这并不总是如此，允许机构使用\
  \ **Runtime Fabric (RTF)** 或 CloudHub 1.0/2.0 的标准美国控制平面可能是最优解决方案。\n\n\n\n\n在确定了控制平面的托管要求并完成了带有权利和许可的预配后，我们接下来需要了解如何保护对平台的访问。我们将在下一节中探讨这一点。\n\
  \n### 保护 Anypoint 控制平面\n\nAnypoint 安全性在 Management Center（管理中心）的 Access Management（访问管理）中进行管理。在这里，管理员可以管理用户、业务组和审核日志。管理\
  \ Anypoint Platform 用户主要有两种方式：\n\n*   Anypoint 托管用户（GovCloud 实现不可用）\n*   外部 **身份提供商**\
  \ 和 **单点登录 (SSO)**\n\n在 Access Management 中，可以邀请用户加入 Anypoint Platform。使用此方法时，Anypoint\
  \ 管理用户安全性。请注意，虽然用户可以使用注册其他 Anypoint Platform 实例时使用的相同电子邮件，但用户名对于每个帐户必须唯一。接受帐户邀请后，最佳做法是让用户启用\
  \ **多因素认证 (MFA)**，事实上，从 2023 年 8 月 1 日起，这已成为强制要求。\n\n**注意**\n\nMFA 在用户的个人资料页面中配置，而不是在\
  \ Access Management 的 **User（用户）** 选项卡中。\n\n每个用户对平台所有资产、权利、功能和能力的访问均通过团队和权限进行控制，这些取代了现已弃用的角色功能。\n\
  \n我们可以创建团队以与特定团队成员负责的活动保持一致。然后，我们可以向每个团队授予权限，以访问平台的不同功能和能力，以及他们被允许执行这些活动的环境。我们将在下一节中探讨业务组和环境。\n\
  \n图 2.1 展示了一个名为 **API Developers（API 开发人员）** 的示例团队，它是 API 设计人员团队的子团队，并拥有 JJ Music\
  \ Back Office 中某些活动和资源的权限。\n\n![Figure 2.1 – Team permissions in Anypoint](img/B19922_2_01.jpg)\n\
  \n*图 2.1 – Anypoint 中的团队权限*\n\n您也可以在前图中看到，权限是从团队的父级继承的。\n\n**注意**\n\n团队权限是在确定要应用权限的业务组之前选择的。\n\
  \n用户也可以使用组织的 IdP 进行管理。将组织的 IdP 作为可验证应用程序连接到 Anypoint Platform 的设置位于 Access Management\
  \ 的 **Identity Providers（身份提供商）** 菜单选项下。Anypoint 支持 OpenID Connect 和 SAML 2.0。每个提供商所需的信息会略有不同。使用\
  \ Okta 或 Microsoft **Active Directory (AD)** 等外部提供商会将用户管理的负担转移到单独的安全平台上，该平台负责验证用户身份并确认其对资产的访问权限。\n\
  \n下图摘自 MuleSoft Identity Providers 文档，展示了 SAML 流程：要求用户向 IdP 验证其凭据，IdP 随后向 Anypoint\
  \ Platform 提供断言，告知平台用户是否被授权访问请求的资源。\n\n![Figure 2.2 – SAML flow with Anypoint Platform](img/B19922_2_02.jpg)\n\
  \n*图 2.2 – Anypoint Platform 的 SAML 流程*\n\n设置 Anypoint 的 SSO 需要与组织的安全团队协调。获取设置双方所需的某些信息可能类似于“鸡生蛋、蛋生鸡”的两难境地。通常，IdP\
  \ 需要先完成其连接的设置，并将所需的公钥、元数据、登录和注销 URL 以及颁发者 ID 提供给 Anypoint 管理员。\n\nIdP 还可用于将用户映射到\
  \ Anypoint 内的团队。团队仍必须在 Anypoint 中设置并配置适当的权限。但是，向 Anypoint 添加新用户的业务流程现在包括确定某人应被分配到哪个团队，从而决定其拥有何种访问权限。\n\
  \n**注意**\n\nAccess Management 中有两个外观相似的选项：**Identity Providers（身份提供商）** 和 **Client\
  \ Providers（客户端提供商）**。Client Providers 允许架构师使用 OpenAM、PingFederate 或 OpenID Connect\
  \ 设置 IdP，以授权访问 API 的客户端应用程序。IdPs 使用 OpenAM、PingFederate 或 OpenID 来授权对 Anypoint Platform\
  \ 的访问。\n\n现在正确的人员已获得 Anypoint 的访问权限，让我们看看用于组织和管理 Anypoint 控制平面的选项。\n\n### 组织 Anypoint\
  \ 控制平面\n\n组织 Anypoint 有两种主要机制：业务组和环境。首先，让我们考虑业务组。\n\n#### 业务组\n\n业务组是 MuleSoft 资源的逻辑划分，允许将\
  \ vCore 和 VPC 等资源分配到部门业务单元级别。此外，使用上一节中提到的团队，业务组允许我们创建设计人员、开发人员、运维人员和管理员组，以管理特定部门内的资源。\n\
  \n然而，Anypoint 权利（通过许可证提供的组件和功能）是在根业务组级别管理的。假设一个组织购买了 10 个沙箱 vCore 和 5 个生产 vCore。这些\
  \ vCore 会分配给首次预配 Anypoint Platform 时创建的根组织。我们可以在图 2.3 中看到，当 JJ Music Store 的所有者将\
  \ MuleSoft 预配为其集成平台时，创建了根业务组。\n\n![Figure 2.3 – Management Center control plane\
  \ – Access Management](img/B19922_2_03.jpg)\n\n*图 2.3 – Management Center 控制平面 –\
  \ Access Management*\n\n**注意**\n\n只有拥有 Organizational Administrator（组织管理员）权限（以前称为角色）的用户才能打开\
  \ Business Units（业务单元）页面。\n\n我们还可以在图 2.3 中看到业务组 ID、客户端 ID 和客户端密钥。组织的客户端 ID 和客户端密钥仅为支持向后兼容性而包含。应改用每个创建的环境的客户端\
  \ ID 和密钥，供非组织管理员的用户访问组织的资产。向下滚动，您还将看到任何 CloudHub 部署的默认区域。\n\n**注意**\n\n在试用帐户中，此默认值始终为\
  \ US-East（俄亥俄州）。\n\n从组织角度来看，建立至少一个子业务组并从根业务组向该组分配资源和权利是一种良好的做法。在图 2.4 中，我们可以看到新组的详细信息已填写完毕，在本例中，JJ\
  \ Music Store 组的所有 1 个 vCore 和 1 个设计 vCore 都已分配给子业务组。\n\n![Figure 2.4 – Creating\
  \ a child business group](img/B19922_2_04.jpg)\n\n*图 2.4 – 创建子业务组*\n\n此时，JJ Music\
  \ Store 业务组将有 0 个可用 vCore，因此无法部署任何应用程序。同样，这通常是作为最佳实践的首选。部署应与负责该部署的子业务组关联。如果需要并采购更多核心，vCore\
  \ 将最初由 MuleSoft 分配给 JJ Music Store 业务组。\n\n现在让我们看看环境在 Anypoint Platform 中的作用。\n\n\
  #### 环境\n\n环境是用于分离部署和应用程序的逻辑分组，是在业务组的上下文中创建的。正如前面 *Business groups（业务组）* 一节中提到的，每个环境都有自己的客户端\
  \ ID 和客户端密钥。CI/CD 流水线可以使用这些来指导部署，开发人员也可以在 Anypoint Studio 中使用它们来标识 API Manager 环境。\n\
  \n最佳做法是定义环境以与组织的开发和测试方法保持一致。\n\n\n\n例如，测试的一种常见方法论使用四个环境：开发、系统集成测试、用户验收测试或预发布，以及生产。通过建立环境以对应这些测试阶段中的每一个，我们现在可以在每个应用程序中开发环境属性文件，从而使我们能够对齐数据源和系统访问。当所有应用程序以相同的方式遵循测试方法论时，我们还可以避免当集成将来自一个环境的数据与连接到不同环境的另一个系统共享时导致的任何数据相关错误。\n\
  \n我们可以创建两种环境类型：\n\n*   `Production`（生产环境）– 用于在生产实时环境中部署应用程序（使用生产 `vCores`）\n*  \
  \ `Sandbox`（沙箱环境）– 用于创建开发和测试环境（使用沙箱 `vCores`）\n\n在图 2.5 中，我们可以看到为与 JJ Music 后台部门的测试方法保持一致而创建的环境列表。请注意，Design\
  \ 类型的环境（连同 design `vCores`）用于使用 Flow Designer 从 Design Center 部署应用程序，该功能已被标记为生命周期结束。\n\
  \n![图 2.5 – 与公司测试方法匹配的环境](img/B19922_2_05.jpg)\n\n图 2.5 – 与公司测试方法匹配的环境\n\n在本节中，我们了解了控制平面的不同托管选项、使用控制平面保护平台的选项，以及允许我们跨不同部门和业务单元以及跨组织中使用的不同测试方法来组织平台的机制。这些环境还代表了\
  \ `vCores` 的分配、用于测试的应用程序分组以及将这些应用程序实际部署到 MuleSoft 运行时引擎之间的桥梁。这些运行时引擎在称为运行时平面的第二个平面内运行。下一节将介绍我们在\
  \ Anypoint Platform 中管理运行时平面的一些选项。\n\n## 运行时平面概述\n\n如前所述，运行时平面是您的程序运行的地方。这是您添加到流中的\
  \ HTTP 连接器监听您指定的端口的地方。这是 DataWeave 转换逻辑等待有效载荷以重塑形状的地方。它也是 Anypoint Object Store\
  \ V2 和 Anypoint MQ 的领域。为了运行这些组件，我们必须拥有计算、内存、存储和网络资源。简而言之，运行时平面是用于运行您的应用程序的服务器或服务器集合。\n\
  \n> **注意**\n>\n> Anypoint Object Store V2 和 Anypoint MQ 的设置是从控制平面配置的。\n\n平台架构师在设计运行时平面架构时必须考虑几个因素。让我们首先看看运行时部署选项。\n\
  \n### 运行时部署选项\n\nMuleSoft 提供了四个用于执行 MuleSoft 运行时引擎的选项：\n\n*   `CloudHub` – 运行在 MuleSoft\
  \ 所属 AWS 组织中的 MuleSoft 托管基础设施\n*   `CloudHub 2.0` – MuleSoft 托管的容器化基础设施\n*   `Runtime\
  \ Fabric (RTF)` – 共享责任的 Kubernetes 集群\n*   `Standalone MuleSoft runtime engine`（独立\
  \ MuleSoft 运行时引擎）– 客户托管的基础设施\n\n后续章节将更深入地探讨这些运行时托管选项中的每一项的功能。在第 9 章和第 10 章中，我们将介绍\
  \ MuleSoft 托管的选项 CloudHub 和 CloudHub 2.0。在第 11 章中，我们将探讨使用 Runtime Fabric 将运行时平面容器化的细微差别。最后，在第\
  \ 12 章中，我们将介绍在组织获取并管理的基础设施上部署 MuleSoft 运行时引擎的自托管独立选项。\n\n接下来，让我们考虑一下托管运行时平面的位置选项。\n\
  \n### 运行时平面托管\n\n与控制平面一样，在托管 MuleSoft 运行时引擎的位置和方式方面，有两个选项：\n\n*   由 MuleSoft 托管和管理：\n\
  \    *   使用 `CloudHub` 和 `CloudHub 2.0` 在 MuleSoft 的 AWS 云上\n    *   在 AWS VPC 上\n\
  \    *   在 AWS GovCloud 上\n*   由客户托管和管理：\n    *   在组织的裸机基础设施、虚拟机、其数据中心或其自己的云平台基础设施（Azure、AWS\
  \ 等）上手动设置 MuleSoft 运行时引擎\n    *   Mule 运行时：\n        *   客户托管 Kubernetes 上的 `RTF`\n\
  \        *   VM/裸机上的 `RTF` 作为 MuleSoft 设备\n\n当使用 MuleSoft 托管的 AWS 选项（`CloudHub`\
  \ 或 `CloudHub 2.0`）时，AWS 区域取决于控制平面的托管位置（如前所述）：\n\n*   美国控制平面允许使用以下 AWS 区域（假设未勾选全球部署）：美国东部和西部、加拿大、亚太地区、欧盟和南美洲，或包括\
  \ `RTF` 在内的独立 MuleSoft 运行时引擎\n*   欧盟控制平面将部署限制在欧盟（法兰克福和爱尔兰）区域或包括 `RTF` 在内的独立 MuleSoft\
  \ 运行时引擎\n*   AWS GovCloud 控制平面将部署限制在 AWS GovCloud 区域或独立（非 `RTF`）MuleSoft 运行时引擎\n\
  *   PCE 控制平面需要独立 MuleSoft 运行时引擎，无法部署到 MuleSoft 托管的运行时选项\n\n> **注意**\n>\n> 全球部署选项在美国控制平面中可用。要启用它，您可能需要联系您的\
  \ MuleSoft 客户经理。\n\n接下来，让我们回顾一下这些运行时部署选项如何与核心 Anypoint 组件配合工作。\n\n### 运行时平面中的核心组件\n\
  \n有几个核心组件和功能是 MuleSoft 的一部分并在运行时平面中运行：\n\n*   Mule 运行时引擎\n*   Anypoint MQ（单独授权的消息服务）\n\
  *   Object Store V2\n*   DataGraph\n*   Connectors（连接器）\n\n> **注意**\n>\n> 虽然 MQ、DataGraph\
  \ 和 Object Store 等组件在运行时平面中运行和操作，但这些组件的管理和配置发生在控制平面中。\n\n这些核心组件中的一些的可用性取决于运行时的托管位置。下表是一个矩阵，显示了运行时平面每个托管选项可用的运行时组件。\n\
  \n![](img/Table_B19922_2_01.jpg)\n\n表 2.1 – 运行时平面组件的托管选项\n\n在前面的表格中，我们可以看到 DataGraph\
  \ 在 CloudHub 2.0、Runtime Fabric 或独立服务器上不可用。我们还可以看到 Object Store v2 在 Runtime Fabric\
  \ 或独立服务器上不可用。我们还可以看到最灵活的运行时托管选项是 CloudHub 和 CloudHub 2.0。\n\n在下一节中，我们将看到这些运行时托管选项的哪些组合可以与不同的控制平面选项一起使用。\n\
  \n### 结合控制平面主机和运行时主机\n\n如前所述，控制平面负责管理我们在运行时平面中运行的所有内容。因此，我们为托管控制平面所做的部署选择将影响我们可以在哪里托管运行时平面。\n\
  \n表 2.2 是一个矩阵，显示了控制平面托管选项和运行时托管选项之间的关系。\n\n![](img/Table_B19922_2_02.jpg)\n\n表 2.2\
  \ – 控制平面部署和运行时托管选项矩阵\n\n正如我们在前面的表格中所看到的，如果我们在美国或欧盟托管控制平面，我们可以使用前面确定的四个托管选项中的任何一个来托管运行时平面。但是，如果我们在\
  \ GovCloud 中托管控制平面，唯一的托管选项是 CloudHub 或独立服务器。CloudHub 2.0 和 Runtime Fabric 在 GovCloud\
  \ 中不可用。如果您必须在自己的服务器和基础设施上托管控制平面（PCE），那么您只能在自己的服务器和基础设施上托管运行时平面。\n\n\n\n## 控制平面和运行时平面的部署选择\n\
  \n有时，组织在决定部署 `control plane` 和 `runtime plane` 的位置时，必须做出艰难的选择。\n\n联邦和州政府通常需要遵守法规，并可能要求软件解决方案符合\
  \ `FedRAMP` 标准。\n\nMuleSoft 为此提供了一个名为 `Government Cloud` 的解决方案，但它也伴随着其他限制因素，且成本可能更高。\n\
  \n使用 `Government Cloud` 时，所选的 `runtime plane` 必须是 `CloudHub`、独立 MuleSoft 运行时，或两者的组合（`hybrid`）。\n\
  \n同样，欧洲组织可能需要将所有软件完全保留在欧盟数据中心内。\n\nMuleSoft 提供了一个使用 `EU-hosted control plane` 的选项。\n\
  \n此 `control plane` 还会将 `CloudHub` 部署限制在欧盟区域和 `EU Availability Zones` 内。\n\n`GovCloud`\
  \ 和 `EU control planes` 将在后续章节中进行更详细的探讨。\n\n对于有授权将所有 IT 基础设施和系统保留在其直接控制下且位于自身数据中心内的组织，可以选择安装\
  \ `PCE` 并在自己的硬件上运行 `control plane` 和 `runtime plane`。\n\n在这种情况下，架构师的工作是理解如何应对这些差异。\n\
  \n如果 `runtime host` 不支持 `Anypoint DataGraph` 或 `Object Store v2`，我们还有什么替代选项？\n\n\
  我们到底需不需要 `DataGraph` 或 `Object Store v2`？\n\n`Object Store v2` 可以通过 `APIs` 访问，但考虑到需求和法规，是否允许这样做？\n\
  \n此外，如果组织在 `US` 或 `EU control plane` 上运行且拥有所有可用选项，什么业务标准、IT 政策、组织资源限制或其他众多环境变量会促使架构师选择\
  \ `CloudHub` 而非 `RTF`？\n\n是什么因素会驱使架构师推荐将 `CloudHub 2.0` 与 `runtime engine` 的独立实例相结合？\n\
  \n为了回答这些问题，我们需要更详细地了解每种 `MuleSoft` 交付方法，并看看它们能做什么、不能做什么。\n\n我们的应用程序将在哪里执行以及将有哪些\
  \ `runtime plane` 功能可用，这些都是重要问题。\n\n*稍后在*本书中，我们将详细探讨这些 `runtime deployment` 选项，以便我们作为架构师能够回答这些问题并提出建议。\n\
  \n在下一节中，我们将初步了解 `control plane` 中可用的具体核心功能和组件。\n\n## Anypoint 核心服务\n\n正如我们已经看到的，`Anypoint\
  \ Platform` 提供了设计、部署和管理我们构建的 `APIs` 所需的组件。\n\n该平台还提供了运行或执行这些应用程序所需的组件，在许多情况下还提供基础设施。\n\
  \n让我们快速了解一下支持 `API development` 生命周期中每个阶段的不同组件。\n\n### 管理能力\n\n如前所述，我们将 `Anypoint\
  \ Management Center`，特别是 `Access Management`，确定为用户管理和平台组织的核心服务。\n\n`Management Center`\
  \ 还是我们可以找到专注于平台运营和管理以及任何正在运行的 `API applications` 的核心服务的地方。\n\n`Figure 2.6` 中的屏幕显示了\
  \ `Management Center` 中的选项。\n\n![Figure 2.6 – Anypoint Management Center](img/B19922_2_06.jpg)\n\
  \n图 2.6 – Anypoint Management Center\n\n`Figure 2.6` 中的管理能力详述如下：\n\n*   `Access\
  \ Management`：这在前面的 `control plane` 部分已有描述。\n*   `API Manager`：这提供了应用策略、设置 `service-level\
  \ agreements (SLAs)` 和保护 `APIs` 的能力。\n*   `API Manager` 还用于管理两类 `API` 警报：`API` 请求/响应/策略警报，以及合同变更或违规警报。\n\
  *   `API Manager` 还管理并部署您需要与 `API` 关联以对其进行管理的任何 `proxy API` 运行时。\n*   `Runtime Manager`：这提供了跨不同环境管理\
  \ `Anypoint VPCs`、`Anypoint VPNs` 或 `Private Spaces`、`MuleSoft` 应用程序、负载均衡器、独立服务器和\
  \ `Flex Gateways` 的能力。\n*   此外，应用程序部署、设置和管理都可以从 `Runtime Manager` 控制。\n*   `API\
  \ Governance`：这赋予架构师定义 `API` 一致性规则集、监控合规性并向开发人员发送通知以解决合规问题的能力。\n*   `Visualizer`：这提供了部署到\
  \ `runtime plane` 的 `APIs` 的图形视图，通过三个视角观察：`Architecture`、`Troubleshooting` 和 `Policies`。\n\
  *   应用程序视图显示应用程序网络中应用程序（节点）之间的关系。\n*   `Troubleshooting` 视图包含应用程序网络中所有节点的指标。\n*\
  \   `Policy` 视图允许您查看应用于网络中 `MuleSoft` 应用程序的策略概览。\n*   `Monitoring`：这提供了查看性能仪表板、查看日志和\
  \ CPU/内存/磁盘消耗，以及跨已部署 `APIs` 寻找趋势的能力。\n*   `Monitoring` 还允许运维人员根据性能和使用情况发现，检查任何 `APIs`\
  \ 中的稳定性问题。\n*   `Secrets Manager`：这提供了一个安全的保管库，用于妥善保存证书、密钥库、信任库以及用户名/密码键值对。\n* \
  \  `Security Manager` 是支持 `Runtime Fabric` `runtime plane` 中边缘策略和令牌化的安全功能的一部分。\n\
  \n### 设计能力\n\n`API` 设计始于 `API specification`。\n\n无论组织使用标准化的 `Open API Specification\
  \ (OAS, 以前称为 Swagger)` 还是 `RESTful API Modeling Language (RAML)`，都可以在 `Anypoint\
  \ Platform Design Center` 中创建规范。\n\n`Design Center` 允许您设计规范、片段和 `AsyncAPI` 规范，如\
  \ `Figure 2.7` 所示。\n\n![Figure 2.7 – Design Center API specification](img/B19922_2_07.jpg)\n\
  \n图 2.7 – Design Center API 规范\n\n在前面的屏幕截图中，`MuleSoft` 提供了一个指南或“脚手架”，允许对规范进行 `low-code/no-code`\
  \ 开发。\n\n此功能也在云端，因此设计人员无需在笔记本电脑或台式机上安装任何内容即可开始工作。\n\n`API` 设计规范也可以在两个主要开发工具 `Anypoint\
  \ Studio` 和 `Anypoint Code Builder (ACB)` 中创建。\n\n这两个工具都允许您将 `API specification`\
  \ 与 `Design Center` 同步。\n\n同样，对于在 `Design Center` 中开始的任何 `API` 规范，您可以在 `Studio`\
  \ 或 `ACB` 中打开并处理它们。\n\n您投入了大量工作来确保契约看起来正确、参数定义良好、负载示例可靠，且 `mocking service` 似乎能让\
  \ `API` 按预期工作。\n\n这里设计的 `APIs` 现在需要共享，以便其他人可以利用这些 `APIs` 做更大、更好的事情，而无需重新构建您已经构建的内容！\n\
  \n共享工作的地方称为 `Anypoint Exchange`，我们可以直接从 `Design Center` 发布到 `Exchange`。\n\n在下一节中，我们将了解\
  \ `Exchange`。\n\n### 发现能力\n\n`Anypoint Exchange` 可被视为解决方案中可用的所有不同可重用组件或资产的目录或注册表。\n\
  \n可以搜索特定短语，或根据预定义的资产类型或资产类别对此目录进行筛选。\n\n您可以列出自己组织的资产或 `MuleSoft` 开发的资产。\n\n您甚至可以根据资产所处的生命周期阶段进行筛选。\n\
  \n在下面的屏幕截图中，我们可以看到 `Exchange` 显示了 `MuleSoft` 提供的一系列资产。\n\n![Figure 2.8 – Anypoint\
  \ Exchange assets from MuleSoft](img/B19922_2_08.jpg)\n\n图 2.8 – Anypoint Exchange\
  \ 来自 MuleSoft 的资产\n\n\n\n### 摘要\n\n在本章中，我们详细探讨了构成 Anypoint Platform 的控制平面和运行时平面。我们考虑了需要做出的一些架构决策，以及为这些决策提供依据的业务需求。\n\
  \n我们查看了控制平面和运行时平面的托管位置，并发现了两种控制平台访问的不同方式。我们还考虑了控制平面选项与这些选项对运行时平面的影响之间的关系。\n\n然后我们快速浏览了\
  \ Anypoint Platform 中用于设计、管理和编目 API 的核心服务。\n\n在下一章中，我们将了解 Catalyst 和 MuleSoft Knowledge\
  \ Hub，并探讨如何利用 Catalyst 方法提高 API 项目的效率。\n\n### 问题\n\n1.  运行时平面有哪四种托管选项？\n2.  能否说出使用\
  \ Runtime Fabric 托管运行时平面时不可用的两项功能？\n3.  Anypoint Exchange 用于什么？\n4.  在确定控制平面和运行时平面的托管位置时，需要考虑哪些因素？\n\
  5.  描述在 Anypoint Platform 中组织资源的最佳实践。\n\n### 延伸阅读\n\n*   MuleSoft 业务组文档：[`docs.mulesoft.com/access-management/business-groups`](https://docs.mulesoft.com/access-management/business-groups)\n\
  \n### 答案\n\n1.  CloudHub、CloudHub 2.0、RTF 和独立服务器是托管 MuleSoft 运行时平面的当前选项。\n2.  使用\
  \ RTF 时，Object Store v2 和 Anypoint DataGraph 不可用。\n3.  Anypoint Exchange 作为可复用资产的目录，包含\
  \ API、连接器、加速器、DataWeave、RAML 片段等。\n4.  数据法规、数据邻近性和云就绪度。\n5.  创建子业务组并与这些组共享资源。为项目中包含的每个测试阶段和/或对应您的测试方法创建一个环境。\n"
- "# 3. 利用 Catalyst 和 MuleSoft Knowledge Hub\n\n如果您的组织已经拥有数千个 MuleSoft 实施项目，您从中研究了成功与失败的经验，整理了有效和无效的做法，收集了数百份文档并记录了数十个最佳实践，并将所有内容标记、打标签并组织成与产品开发相一致的类别，那么您可能想跳过本章。如果没有，MuleSoft\
  \ Catalyst Knowledge Hub 中可能有一些值得挖掘的宝贵经验，能让您和您的公司更轻松地交付成功的 MuleSoft API 项目。\n\n\
  MuleSoft 客户和合作伙伴可以访问一项重要的 MuleSoft 资源，该资源有助于为其集成和转型计划提供加速和提升，并为项目开发带来一致性。该资源就是 Catalyst\
  \ 和 Catalyst Knowledge Hub。简单来说，Catalyst 是 MuleSoft 交付成功企业集成计划的方法。\n\nCatalyst 所描述的方法及其配套框架并非旨在取代任何项目交付方法论。相反，它指导在规划不同业务时应包含的活动类型和步骤。Catalyst\
  \ Knowledge Hub 包含即用型（可复用）资产、最佳实践和交付方法，这些均源自多年来数千位 MuleSoft 客户的实施经验，且均以业务目标为中心。\n\
  \n在本书中，我们探讨了企业系统集成的一些历史背景，以及 MuleSoft 平台本身是如何从这一背景中发展而来的。我们还了解了平台本身的核心组件和结构。本书的大部分剩余内容侧重于平台技术细节和项目设计细节。Catalyst\
  \ 有助于为架构工作提供结构和框架，本书其余部分将进一步对此进行描述。\n\n在本章中，我们将涵盖以下主题：\n\n*   Catalyst、其核心原则及其业务\n\
  *   利用 Catalyst Knowledge Hub\n*   在 **赋能中心 (C4E)** 中寻找价值\n\n## 探索 Catalyst、其核心原则及其业务\n\
  \n我们进行了一项非常不科学的调查，我询问了几位经验丰富的 MuleSoft 专业人士 Catalyst 是什么，以及它为组织提供了什么益处。尽管样本量很小，但结果很有趣。几乎所有人都认为\
  \ Catalyst 是一项重要资源。一些人认为它是项目蓝图；其他人认为它是项目方法论；我询问的少数人认为它是模板和工件的存储库，能给他们提供一个良好的起点。所有人对它的看法都不同。\n\
  \n参加 **MuleSoft Certified Platform Architecture (MCPA)** 课程的架构师将在很高层面上接触 Catalyst，在那里它被描述为一个*框架*和一种企业集成交付*方法论*，采用全局视角来交付业务成果、技术和组织赋能。它指向*行动指南*，讲师几乎总会指出\
  \ Catalyst Knowledge Hub 中的模板、文档、问卷和其他资产。\n\n因此，从某种意义上说，所有受访者都在正确的轨道上。他们每个人都使用了\
  \ Catalyst 的不同部分并从中发现了价值。事实上，作为一个交付框架，Catalyst 旨在被引入并定制，以适应任何特定组织的组织方式。\n\n但让我们更深入地了解一下\
  \ Catalyst 是什么、其基础构成、组织方式，以及为什么它可以成为架构师的有用工具。\n\n### 什么是 Catalyst？\n\n\n\n\n## Catalyst：MuleSoft\
  \ 的交付方法\n\n简单来说，Catalyst 是 MuleSoft 的交付方法，它从整体视角出发以实现客户成功，将基于成果的技术交付与组织赋能相结合。名字里有什么含义呢？最初，Catalyst\
  \ 称为 Outcome-Based Delivery（基于成果的交付），这名字太拗口了。Catalyst 让人联想到一种物质，它能引起加速或反应，而自身不受影响。我喜欢这个意象和名字，因为这正是架构师，乃至整个组织，应该了解的关于\
  \ Catalyst 的核心。它是任何 MuleSoft 计划的加速器，事实上，也是任何 IT 组织的加速器。\n\nCatalyst 包含六个不同的主要实施指南，我们稍后将逐一回顾。这些实施指南包含活动和步骤，以确保重点领域取得成功。这些步骤大多包含工件、最佳实践、模板和文档作为工件，以支持步骤的执行。\n\
  \n但当我们谈论 Catalyst 作为一种方法论时，意味着什么？这是另一种用于 IT 架构工作的项目管理方法吗？组织目前已在使用许多不同的架构框架和许多项目管理方法论。开放组架构框架\
  \ (TOGAF) 和 Zachman Framework© 都是流行的企业架构方法。项目管理协会 (PMI) 的项目管理知识体系指南 (PMBOK) 可能是项目方法论的主要典范，此外还有敏捷、Scrum、瀑布、关键路径法和极限编程。除了这些之外，许多其他方法已被组织采用，以帮助管理项目、识别风险、规划活动、提供阶段评审门、记录当前状态架构、构想未来状态架构、确定差距，并构建路线图以解决上述所有问题。\n\
  \nCatalyst 并非旨在取代这些方法论。相反，它旨在补充、加速和丰富这些方法论。理想情况下，组织将利用 Catalyst 来丰富其现有的项目方法论和企业架构。例如，Catalyst\
  \ 并不试图概述管理任务的方法。它确实包含步骤、活动和交付物，所有这些都与敏捷项目方法论或方法非常契合。然而，它不包含关于 Scrum 会议的建议、不提倡特定的仪式、不指示演示的必要性，也不建议演示时间表。所有这些都很重要，且应该已经就绪。\n\
  \n同样，Catalyst 也不规定架构偏好或方法。您将找到示例模式、解决方案架构模板和设计考量文档，许多其他架构框架也指向这些内容。然而，Catalyst 并不规定所需的图表，也不规定为通过阶段门应完成哪些资产。\n\
  \n现在我们对 Catalyst 有了更多了解，让我们看看它的基础以及它是如何组织的。\n\n### Catalyst 的基础\n\nCatalyst 围绕三大核心支柱组织，每个支柱由一个或多个实施指南支撑：\n\
  \n*   **业务成果支柱**\n    *   业务成果实施指南\n*   **技术交付支柱**\n    *   平台实施指南（及交付方法）\n    *\
  \   项目实施指南（及交付方法）\n*   **组织赋能支柱**\n    *   C4E（及交付方法）\n    *   内部支持\n    *   培训\n\
  \nCatalyst 通过更具指导性的交付方法来增强其中三个实施指南。Anypoint Platform、Anypoint 项目和 C4E 都有相应的交付方法。这些方法明确定义了跨各个步骤要交付的工作产品。例如，项目交付方法包含一个设计解决方案的步骤，描述了使用\
  \ Philippe Kruchten 的软件架构 4+1 视图模型。这种视图常见于许多架构方法论中，并经常被纳入 TOGAF 交付物中。\n\n交付方法还概述了要执行的活动流程，以及每个活动的执行/负责/咨询/知情\
  \ (RACI) 矩阵。然而，即使采用特定的交付方法，每个组织也应了解这些交付方法包含的内容，然后采取措施定制处方以适应其机构方法论。\n\n根据 MuleSoft\
  \ 的 Catalyst 认证课程，Catalyst 实施指南与 Catalyst 交付方法的区别不仅在于结构，还在于受众。两者对所有 Anypoint Platform\
  \ 订阅者均可用；然而，实施指南是从专门供客户采用的视角编写的，而交付方法的受众则是为系统集成商 (SI) 和交付组织量身定制的。\n\n实施指南及其相关工件是在知识中心开发和维护的，旨在供\
  \ MuleSoft 客户采用。但请记住，它们不特定于个别产品或产品套件。它们涵盖 Catalyst 的“规划成功”、“奠定基础”、“构建规模”和“衡量影响”阶段。各个实施指南提供高层级活动以及单个步骤。\n\
  \n在深入探讨其相关实施指南和交付方法之前，让我们简要了解一下这些核心支柱。\n\n#### 业务成果\n\n业务成果是指路明灯，也是告知和塑造未来工作的主要支柱。组织有目标，通常还有企业愿景声明。当公司着手任何新业务时，都怀揣着一个成果——即有助于实现这一愿景或目标的某种未来状态。许多（如果不是全部）组织在承担支持目标或愿景的大型工作计划之前，都需要一个价值主张。价值主张可能包含定性和定量价值。业务成果支柱及其支持的实施指南活动记录了如何与这些业务目标对齐、如何通过关键绩效指标\
  \ (KPI) 识别成功、这些报告将是什么样子，以及如何在成功的基础上再接再厉。稍后在本书中，我们将更仔细地研究业务成果及其与功能需求的关系。\n\n####\
  \ 技术交付\n\n技术交付也非常重要。您今天构建的平台和应用程序将成为明天的遗留平台和应用程序。此支柱分为两条路径或实施指南：\n\n*   平台\n*  \
  \ 项目\n\n平台实施指南始于制定目标 MuleSoft 平台应有的愿景。在此，平台架构师不仅应了解 MuleSoft 产品及其协同工作方式，还必须了解以下方面：\n\
  \n*   我们之前描述的业务成果\n*   推动计划的业务战略\n*   企业标准\n*   企业架构原则和治理\n\n通过理解业务成果主张，我们可以通过展示平台愿景如何支持业务成果来描述该愿景。\n\
  \n一旦规划了平台的未来状态，我们就可以开始安装平台和支持服务，例如通用日志记录、警报和错误处理。我们还可以建立构建和发布管道以支持 CI/CD DevOps\
  \ 需求。也许最重要的是，我们可以开始衡量作为业务成果工作一部分而开发的 KPI 的影响，从而让我们能够优化平台并确定增长和改进领域。\n\n\n\n\n\n\
  ## Catalyst Foundation\n\n项目手册描述了基于高业务价值和/或可复用 API 的快速获胜，识别并创建待办事项列表所需的活动和步骤。这项工作通常是项目或项目经理的责任，但应在平台架构师和解决方案架构师的参与下完成。项目手册还定义了设计、开发、测试、部署和发布项目或解决方案的活动和步骤。很多时候，这标志着组织项目的结束。然而，Catalyst\
  \ 包含了扩展以及监控和衡量已完成项目影响的活动。通常，平台架构师可能会发现他们有一个服务每季度只被调用一两次甚至更少。如果是这样，了解原因并确定是否有其他更合适的服务至关重要。\n\
  \n本书的大部分内容都是关于理解这些平台能力以及它们如何支持不同的架构愿景。但如果在真空环境下进行，缺乏对业务愿景、目标和成果的完整理解，你今天构建的平台和应用程序不仅会成为明天的遗留应用程序，还可能成为新的、昂贵的技术债务。\n\
  \n### Organizational Enablement（组织赋能）\n\n组织赋能是关于让人员和流程就绪以创造成功。这项活动可能会让人感到不适，因为它可能涉及变革。为了支持这种变革，该支柱分为三本手册：\n\
  \n*   C4E\n*   Internal Support（内部支持）\n*   Training（培训）\n\n组织工作之所以如此困难且必要，原因之一是康威定律对系统集成的影响。康威定律假设组织中的沟通结构将反映在系统设计中。如果一家公司组织为位于中心位置的一个大团队，那么软件很可能会被设计为大型单体架构。同样，如果一家公司组织为分布在不同地点的小团队，软件很可能是模块化和分布式的。\n\
  \nCatalyst 最佳实践中推荐的最大变革之一是建立 C4E。在许多情况下（如果不是大多数），创建 C4E 将需要对角色和人员进行一些重组，并可能增加新资源。我们将在本章后面更仔细地研究\
  \ C4E。\n\n除了 C4E，我们还必须确定监控、支持和排查 MuleSoft 平台及其支持的所有 API 和应用程序所需的框架和流程。这里有一个警示：Catalyst\
  \ 中 Internal Support 手册的一些材料、活动和步骤是从 MuleSoft 专业服务或 SI（系统集成商）的角度编写的，包含诸如“与客户设置介绍会议”之类的活动。如前所述，Catalyst\
  \ 和这些手册应被视为对组织内现有人员、流程和技术的补充。IT 组织可能决定利用其现有的内部支持团队指南，仅添加本手册中专门支持识别和监控与 MuleSoft\
  \ 平台支持相关的 KPI 的活动。\n\nTraining 手册是组织赋能中的第三本，与 Internal Support 一样，它也带有浓重的 SI 视角。然而，对于组织的长期成功至关重要的是，确保\
  \ IT 团队具备支持并持续构建 MuleSoft 组件所需的技能，特别是当第三方 SI 被聘请交付初始平台和支持特定业务成果的快速获胜 API 时。该手册还确定了通过其他\
  \ MuleSoft 计划（如 Ambassador 计划、开发者研讨会、峰会和会议，以及博客、论坛和聚会小组等在线资源）扩展传统课程作业的活动。\n\n###\
  \ Playbook Organization（手册组织）\n\n这些支柱还有第二个维度，它有助于进一步组织每本手册中的材料。Catalyst 采用了设计-构建-扩展-优化的开发方法，并对每个阶段使用以下名称：\n\
  \n*   Plan for Success（规划成功）\n*   Establish the Foundation（奠定基础）\n*   Build to Scale（构建以扩展）\n\
  *   Measure Impact（衡量影响）\n\n表 3.1 显示了支柱、手册和这些阶段之间的关系：\n\n![](img/Table_B19922_03_1.jpg)\n\
  \n表 3.1 – 按开发阶段划分的 Catalyst 基础活动\n\n在此矩阵中，每个阶段所需的活动列在每个阶段下方。每个支柱中的每本手册都包含成功交付项目该阶段所需的活动和步骤。例如，在\
  \ Technology Delivery（技术交付）支柱的 Platform（平台）手册中，可以找到与 **Plan for Success** 阶段相关的活动：定义平台愿景和路线图，以及设计架构和实施计划。\n\
  \n每个活动被分解为具体步骤，并详细描述，同时包含该步骤将产生的任何工件和交付物，包括启动该步骤的前置步骤，以及交付团队和客户团队中哪些角色应以某种形式参与该步骤。最后，许多步骤会识别并提供可供下载并供项目团队使用的实体资产链接。\n\
  \nMuleSoft 还通过所谓的 Catalyst Engagements（Catalyst 交付服务）为成功项目提供指导。\n\n### Catalyst\
  \ Engagements（Catalyst 交付服务）\n\n关于 Catalyst 基础的最后一点说明：MuleSoft 服务产品包括与 MuleSoft\
  \ 或合作伙伴合作，执行围绕 Catalyst 阶段组织的预定义活动。\n\nCatalyst Launch（启动）交付服务对于刚开始引入 MuleSoft 平台并开发\
  \ API 应用程序的组织非常有用。Launch 结合了所有六本手册中 **Plan for Success** 和 **Establish Foundation**\
  \ 下的活动。此交付服务旨在帮助实现业务成果。它在 Anypoint Platform 的初始配置和设置以及组装首批用例以进行交付方面也很有用。此外，它建立了一个培训计划，通过针对其工作和日常活动的特定课程，赋能组织确定的员工。\n\
  \nCatalyst Scale（扩展）交付服务使用 **Build to Scale** 的活动交付一个计划。因此，此交付服务专注于允许企业和组织开始推动复用的活动。此交付服务有助于识别新用例的潜在候选者，特别是那些可以从最初开发的可复用组件中受益的用例。在此交付服务中，参与组织赋能的团队开始通过额外培训增加他们的技能，并学习运营和支持\
  \ API 及 MuleSoft 平台。\n\nCatalyst Optimize（优化）使用 **Measure Impact** 活动。顾名思义，它可以被视为帮助组织在能力成熟度模型量表上迈向更高层级。诸如通过新创建的仪表板进行\
  \ KPI 监控、报告和复用加速等活动融入了组织的文化中。\n\n这些交付服务专门利用不同的 Catalyst 产品交付生命周期阶段，采用指导性方法和长期努力，跨越三个\
  \ Catalyst 支柱：Business Initiatives（业务倡议）、Technology Delivery（技术交付）和 Organizational\
  \ Enablement（组织赋能），以实现业务成果。多个项目可能在单个 Catalyst 交付服务的背景下启动并完成。\n\n现在，让我们考虑如何利用 Catalyst\
  \ Knowledge Hub（知识中心）来加速和/或增强组织的现有方法论。\n\n## Leveraging the Catalyst Knowledge Hub（利用\
  \ Catalyst 知识中心）\n\n\n\n\n\n### Catalyst 知识中心\n\nCatalyst 知识中心是一个可搜索的文档存储库，包含 MuleSoft\
  \ 精选的资产和内容，供 Catalyst 交付项目使用。本章前面我们将 Catalyst 描述为一种加速器和交付成功企业集成项目的方法；它不是一个项目或架构方法论。\n\
  \n**注意**\n\n除了 Catalyst 中的剧本和交付方法外，MuleSoft 还有一个 GitHub 账号，截至撰写本文时，拥有 158 个代码库。这些代码库包含从功能监控演示到指标工具包再到熔断器策略等模式的实现示例。浏览和使用该账号和代码库不需要\
  \ MuleSoft 许可证。该 GitHub 账号向任何寻找示例、演示和启动项目开发的起始框架的人开放。地址如下：`https://github.com/orgs/mulesoft-catalyst/repositories`。\n\
  \n#### 搜索知识中心\n\n利用 Catalyst 知识中心的一种方式是按需搜索示例。仅在平台剧本中，跨阶段和活动就多达 250 个资产页面，其中许多页面附带多个文件。这些文件包括模板、示例、矩阵、视频、PDF、幻灯片等。\n\
  \n例如，作为一名架构师，你可能被要求开发 Anypoint Platform 参考架构。你在 Catalyst 中搜索 Anypoint Platform 并找到\
  \ 347 个结果。你加入架构关键字将其缩小到 117 个。专门检查**设计架构与实施**，如*图 3.1*所示，我们找到了一个可能有用的剧本步骤：\n\n![图\
  \ 3.1 – 搜索 Catalyst 知识中心示例](img/B19922_03_1.jpg)\n\n*图 3.1 – 搜索 Catalyst 知识中心示例*\n\
  \n我们发现该剧本页面上有 25 个可用资产，其中之一是一个包含架构模板的参考架构文档。页面上排名前四的资产如*图 3.2*所示：\n\n![图 3.2 – 搜索结果](img/B19922_03_2.jpg)\n\
  \n*图 3.2 – 搜索结果*\n\n**注意**\n\n剧本条目本身不仅仅是页面底部的可复用资产列表。在*图 3.1*的示例文档中，可以找到对 4+1 架构视图的回顾。\n\
  \n虽然定期搜索特定资产当然是使用 Catalyst 知识中心的一种方式，但杠杆率更高的做法是将该方法本身融入组织已采用的项目和架构方法论中，通过活动和步骤填充项目看板、Scrum\
  \ 看板或项目计划，并利用资产来加速和丰富你的架构方法。\n\n#### 与架构方法论对齐\n\nCatalyst 方法与通用架构很好地对齐。由于约 80% 的组织使用\
  \ TOGAF，它可以作为将 Catalyst 的原则和概念与 TOGAF 相结合的良好示例。\n\n*图 3.3*所示的 TOGAF **架构开发方法**（**ADM**）已通过\
  \ Catalyst 方法的剧本进行了增强：\n\n![图 3.3 – Catalyst 方法与 TOGAF ADM 阶段对齐](img/B19922_03_3.jpg)\n\
  \n*图 3.3 – Catalyst 方法与 TOGAF ADM 阶段对齐*\n\n在*图 3.3*所示示例中，Catalyst 业务成果已与 TOGAF 架构愿景和业务架构对齐。在\
  \ TOGAF 的架构愿景和业务架构步骤中，我们有以下内容：\n\n*   识别利益相关者、关注点和业务需求\n*   确认并详述业务目标、业务驱动因素和约束\n\
  *   选择参考模型、视点和工具\n*   开发当前和目标业务架构描述\n\n通过业务成果增强这些步骤或工件，使 MuleSoft 项目能够沿着 Catalyst\
  \ 定义的活动与企业架构对齐：\n\n*   就业务成果达成一致\n*   识别并对齐关键利益相关者\n*   识别成功的依赖关系和风险\n\n同样，当我们定义技术架构和机会与解决方案时，TOGAF\
  \ 旨在交付架构愿景、架构工作声明、基线和目标业务、数据、应用和技术架构，以及能力评估，这些可以为 Catalyst 平台和项目剧本提供信息，步骤如下：\n\n\
  *   建立平台架构\n*   定义通用服务\n*   验证架构的合规性\n\nCatalyst 培训与支持剧本已与实施治理和变更管理对齐。这些可以贯穿 ADM\
  \ 的所有阶段，类似于 C4E 定位为环绕并汲取完整 ADM 生命周期。\n\n*图 3.3* 只是与预先存在的架构方法论对齐的一个示例。重要的是要了解现有的内容，以及可以扩展哪些构建块来支持\
  \ API 主导集成计划的产品生命周期。\n\n一般来说，当业务和 IT 之间存在协调时，集成效果会好得多。将 Catalyst 流程与 TOGAF（或任何其他企业架构方法）集成也不例外；跨部门打破孤岛共享是关键。帮助推动集成能力、鼓励复用并衡量\
  \ API 在整个组织中的有效性的最佳方式之一，是建立 C4E。在下一节中，我们将探讨 C4E 的构成要素，以及建立 C4E 为组织带来的价值。\n\n## 在\
  \ C4E 中寻找价值\n\n通常，MuleSoft 从业者、架构师和交付组织要么忽视 C4E，要么——最好的情况——将其视为次要甚至第三位的考量。在以下情况下，原因很容易理解：\n\
  \n*   工作说明书中确定了更高优先级的事项\n*   预算已在年度财务会议中设定并固定\n*   财务部门要求不高；他们只想要可包含在薪资报告中的良好数据\n\
  \n这些短期项目、战术性的救火演练、闪亮新事物的诱惑，以及**又一个治理项目**（**YAGP**）的枯燥乏味，足以让组织分心，不再投入精力去关注任何以“中心”开头的事物。\n\
  \n具有讽刺意味的是，当公司忽视不仅是 C4E，还有其推荐的活动和行动时，组织可能会加剧他们原本寻求通过采用 API 方法和崭新的 MuleSoft 平台来解决的问题。他们非但没有减少对\
  \ IT 的需求，反而增加了需求；非但没有利用为复用而设计的平台，反而发现自己在缺乏培训和支持的情况下维护和运营另一个平台；非但没有创新和加速刚刚启动的数字化转型计划，业务反而倒退回影子\
  \ IT，将关键业务职能放在电子表格中。\n\n正如 Catalyst 中所定义，C4E 首先不是一个治理项目。它不旨在增加阻止项目推进的额外流程关卡。它也不必对每个组织都长得一样。相反，C4E\
  \ 是一个计划和方法，旨在使团队能够有效管理 Anypoint Platform，促进应用复用以加速创新，传达整体能力，并通过合规性降低风险。\n\n如果缺乏长期平台增长的愿景、良好的资源组织和布道，公司会迅速开始产出不是良好构建块的资产，无法获得应有的复用以实现价值主张。让我们看看建立\
  \ C4E 的几个关键要素，包括团队赋能、度量和人员配置。\n\n### 团队赋能\n\n\n\n\n\n### 通过基础组件赋能团队\n\nC4E 的核心能力和主要活动之一是赋能团队。实现这一目标最有效的方法之一是提供基础组件、模板、示例和\
  \ API。模板和示例可以发布到 Exchange，以便那些希望开始开发新 API 的团队能够发现它们。\n\n模板还可以支持最佳实践的编纂，从而有助于确保资产的使用者将遵循既定的最佳实践。C4E\
  \ 计划的集成架构师与企业架构师协调，识别最佳实践，特别是针对系统通用的基础组件。这可能包括以下内容：\n\n- 日志记录\n- 错误处理\n- 安全性\n-\
  \ 队列管理\n- 警报、监控和健康检查\n\n通常，组织可能已经为某些基础组件确定了最佳实践。例如，组织可能已经规定了日志记录标准，要求将所有应用程序日志和审计日志发送到标准日志记录服务（如\
  \ ELK 或 Splunk）。这很好，但通常意味着每个开发人员最终都要自行摸索将日志发送到聚合器的流程。\n\n然而，另一项最佳实践是“一次构建，多处复用”。这些最佳实践可以推动通用框架的开发，这些框架本身就可以被其他项目使用。例如，可以设计并构建一个日志框架来处理任何通用的日志记录需求。然后，这些通用框架可以被纳入针对特定集成设计模式的模板中，例如\
  \ API、发布/订阅事件处理器、批处理和 SOAP 服务/消费者。并且，如前所述，这些都可以在 Exchange 中发布并附带完整文档。\n\n许多 MuleSoft\
  \ 开发人员和架构师都能讲出他们曾多次构建日志服务、安全组件或全局异常处理器的经历。对于负责为多个客户交付 MuleSoft 平台的咨询公司、系统集成商或其他合作伙伴来说，这并不奇怪，但在一个组织内部，这不应成为常态。\n\
  \n#### 指标和 KPI\n\n收集 C4E KPI 的指标可以为您的组织增加价值，无论您是否已启动 C4E 计划。它们告诉您组织相对于业务目标的表现如何。这些信息可以帮助团队根据\
  \ API 的使用情况，确定是否需要对平台或 API 进行更改。\n\nCatalyst 建议跟踪以下 KPI，以深入了解平台的成功程度：\n\n- Exchange\
  \ 中的资产数量\n- Design Center 中的资产数量\n- 生产环境中的 API 数量\n- 开发人员参与度\n- 平均评分\n- API 复用百分比\n\
  - 核心使用量\n\n本章前面提到的 GitHub 账户中较受欢迎的代码库之一包含一个在此处可能有用的工具：`https://github.com/mulesoft-catalyst/metrics-toolkit`\n\
  \n该工具包有助于收集和聚合性能指标，提供仪表板和图表，展示此处描述的许多 KPI。\n\n> **注意：** 根据我们的经验，在 Exchange 中对资产进行评分的情况很少见，即使存在评分，特定资产的评分数量也无法提供有意义的统计反馈。\n\
  \n*图 3.4* 所示的仪表板展示了关于 Exchange 和 Design Center 中资产数量的报表示例：\n\n![图 3.4 – 显示 Anypoint\
  \ Platform 中可用资产数量的 KPI 仪表板](img/B19922_03_4.jpg)\n\n*图 3.4 – 显示 Anypoint Platform\
  \ 中可用资产数量的 KPI 仪表板*\n\n*图 3.4* 中的仪表板可以开始讲述一个故事，尽管单靠它还不完整，关于哪个业务组最多地利用了该平台。然而，它也可能表明工作停滞，或者某些团队正在开发\
  \ API 但未将其发布到 Exchange。\n\n这些指标绝非详尽列表。获取 KPI 并对其进行衡量可以帮助架构师了解平台的稳定性和采用情况、项目交付的效率，以及最佳实践和治理是否得到遵循。\n\
  \n#### 人员配置\n\n首先，必须始终有一位计划的**倡导者**，即能够赞助工作并跨组织推广（传播）能力的人。C4E 旨在跨职能领域运作。这意味着人员配置应组织为能够与组织内的不同团队和群体协作。由于每个组织都不同，且许多组织在不同能力上的成熟度各异，C4E\
  \ 不必对每个组织都长得一样；这也延伸到 C4E 的人员配置方式。视组织规模而定，某些定义的角色可能是兼职的。以下职能领域列表在大多数中大型公司中很常见：\n\n\
  - **项目团队**：通常与业务或部门中的产品或解决方案对齐。他们负责新功能、应用程序或计划。\n- **架构**：一个跨职能群体，可能包括企业、应用、数据和基础设施架构师。他们负责组织的架构路线图、治理和合规性。\n\
  - **变更控制/QA**：他们负责确保对运行环境的更改被理解、记录和测试。这是生产环境变更的最后一道防线。\n- **运维**：在基础设施上保持运行的团队。它可能细分为本地和云计算支持。\n\
  - **安全**：保护公司可能拥有的最重要、最有价值的资产：其数据和系统。这可能包含在架构团队或运维团队中，并以矩阵式分配给项目团队。\n- **CI/CD**：一个相对较新的职能，负责组织范围内的软件开发生命周期。它有时包含在变更控制/QA\
  \ 团队中。\n\n理想情况下，C4E 的人员配置将包括来自任何中央 IT 组织和不同业务部门的人员。这不仅将为平台中包含的能力提供更好的可见性，而且因为这些团队中的每一个都利益相关，所以也应该能创造更好的认同感。\n\
  \n除了人员来源外，Catalyst 确定了对任何 C4E 计划至关重要的三个主要角色：\n\n- **赞助人**：计划的倡导者。他们理解并跟踪业务价值，是主要的传播者。\n\
  - **C4E 负责人**：他们对 C4E 和集成的成功负责，提供平台资产的管理，并处理与利益相关者的所有沟通。\n- **集成架构师**：他们负责整体集成架构愿景和路线图，制定标准和最佳实践，并与架构团队以及项目团队联络。如果需要\
  \ API 开发团队，他们负责架构决策和方向。\n\n除了这些角色外，还应考虑包含与前面确定的不同职能领域相对应的角色。以下是一些示例：\n\n- **平台联络人**：他们将与运维团队（特别是基础设施）联系，并负责控制平面和运行时平面的稳定运行。\n\
  - **DevOps 联络人**：他们将与项目管理团队和 CI/CD 团队联系。此外，他们将负责软件生命周期和项目方法，并拥有 API 生命周期的所有权。\n\n\
  此处显示的角色可能不适合每个组织和每种情况。许多组织依赖个人身兼数职来完成工作，而其他组织则对个人或群体的预期活动有非常具体的规定。\n\n\n\n\n\n##\
  \ 摘要\n\n在从业者中，我发现关于 MuleSoft Catalyst 存在许多不同的观点。本章所做的工作是为您提供一个基础，帮助您确定 Catalyst\
  \ 方法如何以及在何处能为您提供帮助。本章概述了 Catalyst 的基础、它是什么，以及重要的是它不是什么。您了解了 Catalyst 的结构、其原则，以及其基础如何支撑三大支柱：业务成果、技术交付和组织赋能。\n\
  \n我们发现 Catalyst 中包含许多资产，范围涵盖从模板到模式再到示例，所有这些都包裹在创建组织变革以支持工作的最佳实践中。对于刚开始采用 API 方式进行集成的组织，剧本中的行动可以帮助指导组织的项目管理方法，而参考架构资产和\
  \ Catalyst 原则可以塑造并解决业务、数据、应用和技术方面的架构关注点。\n\n本章还简要探讨了 C4E，它是组织赋能支柱的关键部分。我们专门考察了 C4E\
