  # Anypoint API Manager 警报


  Anypoint API Manager 警报是您可以在 MuleSoft 的 Anypoint Platform 中设置的通知，用于监控与 API 相关的特定活动或变更。这些警报帮助企业主动识别并缓解其
  API 的潜在问题。


  可以根据不同因素配置以下 API Manager 警报以发送警报：


  *   **响应时间**：如果您的 API 响应时间超过特定阈值，将触发警报以通知您。

  *   **请求量**：如果 API 请求数量在特定时间段内超过特定限制，您可以设置警报。

  *   **失败请求**：如果失败 API 请求的比率激增超过特定百分比，请配置警报。

  *   **策略违规**：如果发生策略违规，您可以收到策略违规警报。


  您可以在 Anypoint Platform 的 Runtime Manager 中设置这些警报。该过程包括指定警报类型、设置警报条件，然后指定警报通知的接收者。您可以通过多种渠道接收这些警报，例如电子邮件、第三方应用程序（如
  Slack）和 Webhook，具体取决于您如何设置警报。通过使用 API Manager 警报，企业可以采取主动的 API 管理方法，快速高效地排查和解决出现的任何问题。


  # API 安全威胁


  API 安全威胁是指危及数据和服务的机密性、可用性和完整性的潜在风险或漏洞。


  以下是一些 API 安全威胁：


  *   **注入攻击**：当恶意命令或数据被输入到 API 中，目的是访问、破坏或篡改私有数据时，称为注入。

  *   **身份认证失效**：如果 API 无法正确验证用户身份，攻击者可能冒充授权用户并获得未经授权的访问。

  *   **不安全的直接对象引用**（**IDOR**）：不安全的直接对象引用 (IDOR) 是一种漏洞，当攻击者操纵 Web 应用程序 URL 或参数中使用的
  ID 时会发生，允许他们访问或编辑对象。

  *   **安全配置错误**：如果 API 的服务器或代码具有不正确的安全设置，攻击者可能能够访问敏感数据。

  *   **过度数据暴露**：过度透明的 API 可能被用于在未经授权的情况下获取敏感数据。





  ## OWASP 十大安全威胁


  *   **缺乏速率限制**：在没有适当速率限制的情况下，API 容易遭受 `DoS` 和暴力破解攻击。

  *   **函数级授权失效**：在这种情况下，由于 API 未能正确授权仅应向特定角色提供的功能，导致未经授权的访问。

  *   **批量赋值**：攻击者对 API 请求的组成进行合理猜测，以更改其不应有权更改的对象属性。

  *   **XML 外部实体** (`XXE`)：如果攻击者可以上传 XML 或在 XML 文档中包含恶意内容，他们可以利用脆弱的 XML 处理器，这可能导致内部文件泄露、`DoS`
  或远程代码执行。

  *   **跨站脚本攻击** (`XSS`)：如果 API 在未编码或验证的情况下将用户输入发送回 Web 浏览器，允许浏览器将其作为脚本运行，则可能发生 `XSS`
  攻击。


  在讨论了 OWASP 十大安全威胁之后，我们现在将讨论 `DoS` 攻击。


  ## DoS


  `DoS` 是一种网络攻击，涉及攻击者向目标计算机系统、网络或服务发送过量的请求，以耗尽其资源和带宽。因此，系统对其预期用户变得不可访问。典型的 `DoS` 攻击包括用流量饱和网络、中断连接或迫使系统使用过量资源，这可能会减慢其速度甚至导致其停止运行。


  `DDoS` 是一种更强大、更复杂的 `DoS` 攻击。`DDoS` 攻击利用多个被攻陷或受控的源（通常分布在互联网各处）对目标发起攻击。在一个称为 **僵尸网络**
  的设备网络中，每个设备都充当一个僵尸程序。这些僵尸程序的数量可达数千甚至数百万，它们同时向目标网络发送大量请求，导致 `DoS`。由于攻击源来自许多不同的地方，阻止一个源无法阻止其他源，因此很难阻止此类攻击。


