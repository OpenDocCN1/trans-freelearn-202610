  前面实施 API 代理来管理非 MuleSoft API。


  ### 管理托管在本地数据中心的非 MuleSoft API


  J&J Music 的 API 托管在一个无法通过公共互联网直接访问的本地数据中心中。为了管理、保护、治理和使用这些 API，他们希望利用 API 管理功能。为了实施其
  API 管理，他们选择了 Anypoint Platform。


  有两种方法来处理此场景。要在本地数据中心运行的后端 API 上实施 API 管理功能，我们需要一个 API 代理。我们需要一个 `Mule Runtime`（可以是
  `CloudHub` 或本地 `Mule Runtime`）来配置和部署 API 代理。


  #### 方案 1 – 在 CloudHub 中部署 API 代理以管理非 MuleSoft API


  要在 `CloudHub` 上实施 API 代理以管理后端非 MuleSoft API，我们需要设置 Anypoint `虚拟私有云` (`VPC`) 和 `虚拟专用网络`
  (`VPN`)。Anypoint VPN 允许部署在 `CloudHub` 上的 API 代理与托管在本地数据中心的后端 API 进行通信。以下是在 `CloudHub`
  上为托管在本地数据中心的后端 API 实施 API 代理的示意图：


