  \ Access 2 (WPA2)`（Wi-Fi 保护访问 2）\n4. `Wi-Fi Protected Setup (WPS)`（Wi-Fi 保护设置）\n\
  \n## 85. 客户的计算机在启动时显示“未找到可启动设备”错误。你应该首先检查以下哪项？\n\n1. `Boot sequence in BIOS`（BIOS\
  \ 中的启动顺序）\n2. `RAM modules`（内存模块）\n3. `Graphics card drivers`（显卡驱动程序）\n4. `Internet\
  \ connectivity`（互联网连接）\n\n## 86. 用户的智能手机无法连接到公司的 Wi-Fi 网络。其他设备连接正常。你应该首先检查什么？\n\n\
  1. `Bluetooth settings`（蓝牙设置）\n2. `Network password`（网络密码）\n3. `Cellular data usage`（蜂窝数据使用量）\n\
  4. `App updates`（应用更新）\n\n## 87. 你正在 Microsoft Outlook 中为用户设置一个新的电子邮件账户。如果你希望电子邮件可从多台设备访问，并在它们之间保持邮件同步，应该使用哪种协议？\n\
  \n1. `Post Office Protocol 3 (POP3)`（邮局协议 3）\n2. `Simple Mail Transfer Protocol\
  \ (SMTP)`（简单邮件传输协议）\n3. `Internet Message Access Protocol (IMAP)`（互联网消息访问协议）\n4.\
  \ `Hypertext Transfer Protocol (HTTP)`（超文本传输协议）\n\n## 88. 你收到一位移动设备用户的报告，抱怨响应时间迟缓，并且在其\
  \ Android 设备上使用各种应用程序时出现异常大量的广告。导致这些症状最可能的安全问题是什么？\n\n1. `Developer mode enabled`（已启用开发者模式）\n\
  2. `Bootleg/malicious application`（盗版/恶意应用程序）\n3. `Limited internet connectivity`（受限的互联网连接）\n\
  4. `Unexpected application behavior`（意外的应用程序行为）\n\n## 89. 用户的 Android 设备突然显示虚假安全警告，即使未使用任何特定应用程序时也是如此。最可能导致此问题的安全问题是什么？\n\
  \n1. `Android package (APK) source`（Android 安装包 [APK] 来源）\n2. `Data-usage limit\
  \ notification`（数据用量限制通知）\n3. `Root access/jailbreak`（Root 权限/越狱）\n4. `Application\
  \ spoofing`（应用程序欺骗）\n\n## 90. 移动设备用户报告无法连接到互联网，尽管他们拥有稳定的 Wi-Fi 连接。可能导致此问题的安全顾虑是什么？\n\
  \n1. `Developer mode enabled`（已启用开发者模式）\n2. `Limited internet connectivity`（受限的互联网连接）\n\
  3. `High network traffic`（高网络流量）\n4. `Leaked personal files/data`（泄露的个人文件/数据）\n\n\
  ## 91. 用户的 Android 设备频繁显示意外的应用程序行为，例如应用崩溃或冻结。最可能的安全问题是什么？\n\n1. `High network traffic`（高网络流量）\n\
  2. `No internet connectivity`（无互联网连接）\n3. `Security concerns related to the Android\
  \ package (APK) source`（与 Android 安装包 [APK] 来源相关的安全顾虑）\n4. `Root access/jailbreak`（Root\
  \ 权限/越狱）\n\n## 92. 移动设备用户持续收到虚假安全警告，并注意到大量广告，即使在未使用任何应用程序时也是如此。最可能的安全问题是什么？\n\n\
  1. `Limited internet connectivity`（受限的互联网连接）\n2. `Unexpected application behavior`（意外的应用程序行为）\n\
  3. `Developer mode enabled`（已启用开发者模式）\n4. `Bootleg/malicious application`（盗版/恶意应用程序）\n\
  \n## 93. 用户的移动设备不断超出其数据使用量限制，尽管未使用数据密集型应用程序。最可能的安全问题是什么？\n\n1. `High network traffic`（高网络流量）\n\
  2. `Data-usage limit notification`（数据用量限制通知）\n3. `Root access/jailbreak`（Root 权限/越狱）\n\
  4. `Application spoofing`（应用程序欺骗）\n\n# 解答\n\n## 1.1 给定场景，安装和配置笔记本硬件和组件\n\n### 1.\
  \ 正确答案是 `A`。生物识别读取器应仅为该设备的用户在每台笔记本或台式机上进行设置。在会计部门，每台设备应仅有一人拥有访问权限。所有其他答案均不正确。会计部门的某些用户可能处理更敏感的数据，因此建议不要让所有人都能访问他们的笔记本/台式机。其他部门的员工不应被允许访问任何会计部门的设备。访客是来自其他公司的人员，不应被授予访问任何公司资源的权限。\n\
  \n### 2. 正确答案是 `B`。`RAM` 易失性，你需要佩戴静电放电带以保护 `RAM` 免受静电影响。所有其他答案均不正确。`DDR RAM` 用于台式机，而\
  \ `SODIMM` 用于笔记本电脑。只有在遇到电源问题时才会检查电源电压。操作系统更新与 `RAM` 升级无关。\n\n### 3. 正确答案是 `D`。当笔记本在工作中使用时，电源线很可能插在电源插座上并从市电取电。因此，此场景中问题最可能的来源是电池。所有其他答案均不正确。如果设备在插入市电时工作正常，问题不太可能是电源适配器。如果操作系统损坏，笔记本仍会通电但显示蓝屏死机。如果系统风扇作为辅助气流的冷却装置，其故障会导致计算机过热并崩溃，而不是无法启动。\n\
  \n### 4. 正确答案是 `D`。`Small Outline Dual In-Line Memory Module (SODIMM)`（小型双列直插内存模块）体积更小、更薄，以便安装在空间受限的笔记本电脑中。所有其他答案均不正确。`Dual\
  \ In-Line Memory Module (DIMM)`（双列直插内存模块）通常称为 `RAM` 条，尺寸约为 `SODIMM` 的两倍，用于台式计算机、工作站和服务器。`Double\
  \ Data Rate 3 (DDR3) RAM`（双倍数据率 3 内存）比笔记本电脑常用的 `SODIMM` 更大，尽管现在也有 `SODIMM` 版本。`Synchronous\
  \ Dynamic Random Access Memory (SDRAM)`（同步动态随机存取存储器）比 `SODIMM` 更大，用于台式计算机。\n\n###\
  \ 5. 正确答案是 `B`、`C`、`D` 和 `E`。将 `Solid-State Drive (SSD)`（固态硬盘）安装到笔记本电脑时，必须先关闭系统，然后断开电源线并取出电池。你必须通过佩戴\
  \ `Electrostatic Discharge (ESD)`（静电放电）腕带来为自己接地，以保护组件免受身体静电的影响。其余答案选项不正确。清理桌面虽好，但不是安全预防措施。\n\
  \n### 6. 正确答案是 `B` 和 `C`。iPhone 10 使用 `Touch ID`（触控 ID），iPhone 11 使用 `Face ID`（面容\
  \ ID）。所有其他答案均不正确。iPhone 无法使用指纹或静脉 ID，后者是掌纹扫描的另一种叫法。\n\n### 7. 正确答案是 `C`。当电池寿命终结时，它将无法充满电，也无法长时间保持电量。它也会有过热的倾向。所有其他答案均不正确。数字化屏是手机前面用于触摸屏的玻璃，即使损坏也不会导致手机发热。如果数据线故障，将无法充电，但手机也不会发热。当\
  \ iPhone 电池设置为低电量模式时，耗电量减少，手机因此应更凉爽。\n\n### 8. 正确答案是 `B`。只有当 `DHCP` 客户端无法从 `DHCP`\
  \ 服务器获取 IP 地址时，才会获得 `Automatic Private IP Address (APIPA)`（自动专用 IP 地址）。这可能是由于联系\
  \ `DHCP` 服务器的网络问题，或服务器 IP 地址耗尽所致。所有其他答案均不正确。`DNS` 用于主机名到 IP 地址的名称解析。`NETBIOS` 是一种遗留的\
  \ Microsoft 名称解析协议。如果他们使用的是静态 IP 地址，则 `DHCP Enabled`（已启用 DHCP）将设置为 No。\n\n### 9.\
  \ 所有答案选项均正确。第一阶段是对 `HDD` 进行完整备份，以防万一出现问题。此后，你将移除不打算迁移的任何冗余数据，调整数据分区大小使其小于 `SSD`\
  \ 的大小，克隆旧的 `HDD` 分区，关闭笔记本电脑并移除旧的 `HDD`，安装并初始化 `SSD`，最后将克隆的数据恢复到 `SSD` 上。\n\n\n\n\
  \n# 移动设备模拟考试答案\n\n## 1.1 移动设备连接与硬件\n\n10. 正确答案是 **D**。`RFID` 应用使用 `13.56-MHz` 频率。这包括\
  \ `Near-Field Communication (NFC)`，这是一种用于门禁和刷卡支付系统的扫描仪类型。所有其他答案均不正确。`Biometrics`\
  \ 不会将手机用作接口。你只需使用指纹或面部识别即可获得访问权限。`Certificates` 用于加密，而非访问控制。`Open Authentication\
  \ (OAuth)` 仅用于基于互联网的身份验证。\n\n11. 正确答案是 **B**。大多数 `Solid-State Drives (SSDs)` 采用\
  \ `2.5-inch` 标准规格。所有其他答案均不正确。`3.5-inch` 是将 `SSD` 安装到计算机中的转接架尺寸。`5.25-inch` 和 `8-inch`\
  \ 是第一代软盘的尺寸。\n\n12. 正确答案是 **C**。他应首先确认充电器的额定功率，这很可能太低而无法为手机充电，因此是导致该问题最可能的原因。所有其他答案均不正确。删除不需要的应用会减少手机占用的资源，但不会阻止其充电。将手机恢复出厂设置无法解决电源问题。将电池设置为低电量模式会在手机充满电后减少电量消耗，但无法解决当前的问题。\n\
  \n13. 正确答案是 **A** 和 **D**。可用选项中最简单的是使用支持 `Bluetooth` 的键盘连接到 `Android` 平板。你也可以使用\
  \ `USB-C` 接口，然后将其连接到 `DVI` 或最好是 `HDMI`。所有其他答案均不正确。没有平板具有 `Ethernet` 连接，因为这些设备太薄。`Lightning`\
  \ 数据线仅用于 `Apple` 手机和平板。\n\n14. 正确答案是 **A**。`Near-Field Communication (NFC)` 通常用于刷卡支付。所有其他答案均不正确。`Tethering`\
  \ 是创建个人热点的过程。`digitizer` 提供触摸屏技术。专用 `VPN` 软件创建 `VPN`。\n\n## 1.2 比较和对比移动设备的显示组件\n\
  \n1. 正确答案是 **D**。`digitizer` 是一块实现触摸屏技术的玻璃。所有其他答案均不正确。`inverter` 将 `DC` 转换为 `AC`\
  \ 电源。`Vertical Alignment (VA)` 支持 `2000:1` 的对比度。`backlight` 控制 `LCD` 显示器的亮度。\n\n\
  2. 正确答案是 **D**。`gyroscope` 用于在你扭转手机时旋转屏幕。所有其他答案均不正确。`bezel` 是手机边框与屏幕之间的边框。`digitizer`\
  \ 是一层实现触摸屏功能的玻璃。`accelerometer` 跟踪手机的运动并调整屏幕尺寸。\n\n3. 正确答案是 **C**。由于 `webcam` 未显示图像，这很可能是设置问题。在这种情况下，重新安装\
  \ `webcam` 是最佳解决方案。所有其他答案均不正确。重启计算机无法解决图像问题。购买新的 `webcam` 是不必要的。将 `webcam` 插入另一个端口不太可能解决图像问题。\n\
  \n4. 正确答案是 **C**。`inverter` 将 `DC` 电源转换为 `AC` 电源。所有其他答案均不正确。`inverter` 不会将 `AC`\
  \ 转换为 `DC` 电源。`digitizer` 是一块提供触摸屏功能的玻璃。`backlight` 提高弱光条件下的可读性。\n\n5. 正确答案是 **A**。`Twisted\
  \ Nematic (TN)` 显示器使用液晶分子，它们根据电压等级扭曲或恢复。与其他 `TFT` 显示器相比，它支持快速响应时间。所有其他答案均不正确。现代\
  \ `In-Plane Switching (IPS)` 显示器具有与 `TN` 相似的响应时间，但液晶分子是旋转而非扭曲。`VA` 面板容易出现模糊和残影。`Cathode\
  \ Ray Tube (CRT)` 显示器容易因屏幕非均匀使用而导致屏幕烧屏和残影。\n\n6. 正确答案是 **C**。在 `Windows` 中，如果麦克风无法正常工作，你应该进入\
  \ `Privacy`，选择 `Microphone`，然后确保 `Allow apps to access your microphone` 功能已开启。所有其他答案均不正确。重启笔记本电脑不太可能解决该问题。如果你未启用应用对麦克风的访问权限，获取最新驱动程序不太可能解决该问题。如果在隐私设置中未启用语音识别，购买额外的语音识别软件将无法解决该问题。\n\
  \n7. 正确答案是 **C**。`LCD` 显示器的亮度来自 `backlight`，因此如果它故障，屏幕可能会非常暗甚至变黑。所有其他答案均不正确。`backlight`\
  \ 故障与亮度设置无关。你可以将亮度设置为最高，但如果 `backlight` 出现故障，屏幕仍会很暗。`digitizer` 用于触摸屏技术，而传统 `LCD`\
  \ 显示器不支持触摸。如果 `VGA` 线缆损坏，屏幕会变黑。\n\n8. 正确答案是 **D**。`digitizer` 是一层将模拟触摸转换为数字信号的薄玻璃，在此场景下，出现黑色区域最可能的原因是\
  \ `digitizer` 损坏。所有其他答案均不正确。`iPhone` 上的 `Liquid Contact Indicators (LCIs)` 通常为白色或银色，如果手机遭受水损，这些指示器会变红。用带灯的放大镜观察手机侧面即可查看。`Inverters`\
  \ 用于较旧的笔记本电脑，将来自主板的 `DC` 电源转换为 `AC` 电源。如果手机亮度太低，整个屏幕会均匀变暗，不会出现深色斑块。\n\n9. 正确答案是\
  \ **D**。`In-Plane Switching (IPS)` 使用旋转而非扭曲的液晶分子。这意味着它能产生更好的色彩表现和更宽的可视角度范围，使其既适合游戏也适合平面设计。所有其他答案均不正确。`LEDs`\
  \ 可用于低预算游戏，但不适合平面设计。`LCDs` 的色彩准确度低于 `LED` 显示器，这使它们成为较差的选择。`CRTs` 是传统显示技术，既不适合游戏也不适合平面设计。\n\
  \n10. 正确答案是 **B**。`Vertical Alignment (VA)` 使用倾斜而非扭曲或旋转的液晶分子，支持更广的色域和 `2000:1` 或\
  \ `3000:1` 的对比度。然而，其可视角度不如 `In-Plane Switching (IPS)`，使其更容易出现模糊和残影。所有其他答案均不正确。`OLED`\
  \ 可被描述为具有无限对比度，并可支持 `1,000,000:1`。`IPS` 仅支持高达 `1200:1` 的对比度。`VGA` 的宽高比为 `4:3`。\n\
  \n11. 正确答案是 **C**。在 `Organic Light-Emitting Diode (OLED)` 显示器中，每个像素由单独的 `LED` 产生。因此，该屏幕不需要单独的\
  \ `backlight`。`OLEDs` 用于现代电视、智能手机、显示器和平板电脑。所有其他答案均不正确。`Cathode Ray Tube (CRT)` 是传统显示器并使用\
  \ `backlight`。`Liquid Crystal Displays (LCDs)` 使用荧光 `backlight`。`Light-Emitting\
  \ Diode (LED)` 显示器也使用各种 `backlight` 配置。\n\n12. 正确答案是 **D**。当用户连接了双显示器但无图像时，他们需要通过转到\
  \ `Settings` > `Home` > `Display` > `Multiple Displays` 调整显示设置，然后选择 `Extend these\
  \ displays`。这将启用双显示器。所有其他答案均不正确。如果他们选择 `Duplicate these displays` 选项，两个屏幕上的图像将相同。他们无法使用\
  \ `Projecting to this PC` 选项创建双显示器设置。\n\n13. 正确答案是 **A** 和 **D**。`iPhone` 必须在扬声器\
  \ `10 meters` 范围内，且必须在用户 `Settings` 中启用 `Bluetooth`。所有其他答案均不正确。`General` 设置下没有 `Bluetooth`\
  \ 选项，且 `20 meters` 超出了 `Bluetooth` 设备的范围。\n\n\n\n\n\n## 1.2 移动设备组件（推断）\n\n### 14.\
  \ 无线天线位置\n正确答案是 **C**。无线天线通常位于笔记本电脑顶部边框上。其他所有答案均不正确。笔记本电脑的前面或后面没有接口卡；它们通常位于两侧。如果无线天线在底部，将没有信号。\n\
  \n### 15. 数字化仪与触摸屏功能\n正确答案是 **A**。数字化仪是一块覆盖在手机屏幕上的玻璃，用于实现触摸屏功能。当你能完美看到图标却无法打开它们时，这极有可能意味着数字化仪损坏，需要更换。其他所有答案均不正确。如果没有电源，屏幕会是黑的。CPU\
  \ 损坏意味着每个应用程序虽然能响应，但速度会比正常慢得多。“以上皆是”不是正确解决方案，因为某些答案互不兼容。\n\n### 16. 触控板故障排除\n正确答案是\
  \ **B** 和 **C**。触控板（有时称为轨迹板）可代替鼠标使用。如果它无响应，第一步是移除外接鼠标。如果这不起作用，则需要更新驱动程序。其他所有答案均不正确。重启笔记本电脑无法解决此问题。陀螺仪被手机和平板电脑用于在你改变设备方向时旋转屏幕。\n\
  \n## 1.3 给定场景，设置和配置移动设备的配件与端口\n\n### 1. iPhone 10 充电线类型\n正确答案是 **D**。iPhone 10 的充电器使用\
  \ Lightning 数据线。其他所有答案均不正确。USB-A 用于电脑、电视和游戏主机。USB-B 用于打印机，而 USB-C 用于安卓手机和大多数其他新设备，如游戏手柄和耳机充电盒。\n\
  \n### 2. 老旧笔记本电脑 USB 端口问题\n正确答案是 **A** 和 **C**。老旧笔记本电脑不会有 USB 3.0 端口。也可能是 USB 插槽的外形规格不对。其他所有答案均不正确。U\
  \ 盘倒插导致问题的可能性极小，因为任何用户都会尝试正反两面插入，从而轻松解决问题。U 盘接口端损坏的可能性不大，因为它非常坚固。更有可能是外壳损坏。\n\n\
  ### 3. 三星 Galaxy 连接器类型\n正确答案是 **B**。三星 Galaxy 使用 USB-C 连接器。其他所有答案均不正确。没有手机使用标准 USB\
  \ 连接器。Micro USB 用于充电宝、耳机和游戏手柄等小型设备。Mini USB 接口曾用于早期智能手机和 PDA 的数据传输。\n\n### 4. 充电口异物清除\n\
  正确答案是 **A**。当数据线无法完全插入充电口时，最可能的原因是绒毛或其他异物卡在接口内。清除绒毛的最佳方法是用压缩空气猛吹一通。其他所有答案均不正确。你不应对着接口吹气，因为呼吸中含有水分，可能损坏电子元件。切勿使用\
  \ WD-40，因为它是液体，喷洒电子元件属于电气隐患。干燥后会留下油性残留物。你也可以用牙签完成这项工作，但使用别针或针等金属物体有造成短路的风险，可能损坏手机。\n\
  \n### 5. 蓝牙配对过程\n正确答案是 **B** 和 **C**。在使用任何蓝牙产品之前，必须先在手机上启用蓝牙，然后对两个设备进行配对。其他所有答案均不正确。内置蓝牙功能的智能手机无需安装驱动程序。在设备配对之前，播放的任何音乐都将通过手机扬声器输出，而非耳机。\n\
  \n### 6. 扩展坞与端口复制器功能\n正确答案是 **A**、**D** 和 **E**。扩展坞是一种复杂的端口复制器，结合 DisplayPort 接口，可提供键盘鼠标、扬声器和双显示器功能。其他所有答案均不正确。Wi-Fi\
  \ 通常内置，但如果笔记本电脑较旧，可能需要购买 Wi-Fi 网卡。笔记本电脑通常自带以太网端口，但对于旧款机型，你需要购买网卡。\n\n### 7. 个人热点用于上网\n\
  正确答案是 **C**。使用智能手机创建个人热点是让他们的笔记本电脑获取互联网接入的最快方式。其他所有答案均不正确。行驶 10 英里可能因交通拥堵而错过会议通话，即使赶到星巴克也会被其他顾客听到通话内容。将以太网线直接连接到无连接的无线路由器无法解决问题。重启无线路由器无法获得互联网连接。\n\
  \n### 8. 端口复制器与 KVM 切换器及集线器的区别\n正确答案是 **B**。端口复制器可插在笔记本电脑背部，为用户提供各种额外端口。其他所有答案均不正确。KVM\
  \ 切换器用于连接键盘、鼠标和显示器，当有多台显示器或电脑连接时使用。双显示器仅提供第二个显示器；无法满足其他需求。集线器是用于连接多台电脑的内部设备。\n\n\
  ### 9. 触摸屏异常行为故障排除\n正确答案是 **A**、**C** 和 **D**。当触摸屏出现问题并表现出任何异常行为时，首先应检查屏幕是否损坏。然后，检查是否干净。之后，应重新校准屏幕。剩余答案不正确。触控笔电池寿命与光标异常行为无关。如果电量低，触控笔只会变得无响应。\n\
  \n### 10. Micro USB 被 USB-C 取代\n正确答案是 **C**。Micro USB 接口已被 USB-C 数据线取代。其他所有答案均不正确。串行线缆是使用\
  \ RS232 端口的传统线缆。Lightning 数据线仅用于苹果设备。并行线缆是打印机使用的旧式线缆，现已被 USB 取代。\n\n### 11. iPhone\
  \ 14 充电器类型\n正确答案是 **C**。iPhone 14 使用 USB-C 充电器。其他所有答案均不正确。iPhone 11 充电器使用 Lightning\
  \ 数据线，而 iPhone 12 和 13 型号附带 Lightning 转 USB-C 连接器。USB-A 用于电脑、电视和游戏主机。USB-B 用于打印机，而\
  \ USB-C 用于安卓手机和大多数新设备，如游戏手柄和耳机充电盒。\n\n### 12. 串行设备与 RS-232 端口\n正确答案是 **D**。使用九针\
  \ RS-232 硬件端口的串行设备包括传统鼠标、打印机和调制解调器。其他所有答案均不正确。RJ45 用于以太网线缆。RJ11 曾用于将调制解调器连接到电话线。并行连接用于传统打印机。\n\
  \n### 13. 摄像头隐私设置与软件冲突\n正确答案是 **A** 和 **C**。网络摄像头一次只能向一种类型的软件提供输入。如果摄像头隐私设置未设为“允许应用访问此摄像头”，则摄像头将无法工作。其他所有答案均不正确。换一个端口插入摄像头不太可能解决问题，因为它昨天还能用。购买另一个摄像头无法解决软件冲突，也无法启用允许应用使用摄像头的设置。\n\
  \n### 14. Windows 触摸屏设置与校准\n正确答案是 **B**。Windows 设备具有触摸屏的灵敏度和触控模式等功能。你可以在计算机设置下调整触摸屏设置并校准屏幕。其他所有答案均不正确。设置触摸屏时会安装数字化仪。安装时，技术人员必须确保没有气泡。然而，由于屏幕之前工作正常（即初始安装后），玻璃下的气泡不太可能是当前的问题。显示设置影响屏幕本身，而非触摸屏。触摸屏仅需\
  \ 0.1 到 2 瓦特；它是设备中功耗极低的部分。\n\n\n\n\n\n## 练习题 (15-18)\n\n### 15. 正确答案是 C\n当网络摄像头停止工作时，首先要尝试的是拔下它然后再插回去。如果这不起作用，则应彻底卸载它，并从制造商网站重新安装网络摄像头软件及任何最新更新。所有其他答案均不正确。当操作系统应用更新时，计算机很可能已作为更新的一部分重新启动过，因此再次重启不太可能有帮助。网络摄像头极有可能没有任何问题，而且用户可能没有足够时间去商店购买、设置新设备以赶在\
  \ Zoom 会议开始前准备好。无需更新操作系统，因为这已经完成了，且正是导致此问题的根本原因。\n\n### 16. 正确答案是 C\nNFC 用于银行卡支付类型，要求卡片必须在读卡器四英寸范围内，因此它会是所描述问题的根源。所有其他答案均不正确。蓝牙对于金融交易来说不够安全。非接触式卡不使用无线网络。红外线要求两个设备之间视线通道且无安全性；因此，它不用于金融交易。\n\
  \n### 17. 正确答案是 B、C 和 E\n当手机发热时，可能是由于过度使用，例如长时间作为 Wi-Fi 热点使用。当电池接近使用寿命末期时，手机也会过热，此时电池也无法充满电，且电量会流失得非常快。同时打开太多应用程序会迫使\
