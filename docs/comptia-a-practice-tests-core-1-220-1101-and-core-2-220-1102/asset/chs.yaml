  \ 注入\n4.  跨站脚本 (XSS)\n\n---\n\n## 8.5 场景题：管理和配置 Microsoft Windows OS 基本安全设置\n\n\
  ## 1. 文件夹共享权限配置\n\n**管理员的任务是在用户的 Windows 10 笔记本电脑上配置 marketing 文件夹的权限。权限应允许营销团队对该文件夹拥有读取权限。管理员应配置什么以允许营销用户通过网络访问该文件夹？**\n\
  \n1.  将营销组的 NTFS 权限设置为读取\n2.  选择共享文件夹并授予营销组读取网络访问权限\n3.  选择文件夹属性并确保选中只读\n4.  将营销组的\
  \ NTFS 权限设置为修改\n\n## 2. 跨设备同步设置\n\n**服务台接到一位家庭用户的来电，该用户希望在登录不同 Windows 设备时同步其偏好设置、主题和浏览器快捷方式。目前，用户在每台设备上都配置了唯一的本地账户。用户还希望所有设备使用单一账户。什么功能能满足用户的请求？**\n\
  \n1.  让用户创建一个 Microsoft 账户并在每台设备上启用它\n2.  在当前设备上创建一个本地账户并将该账户复制到所有设备\n3.  让用户在每台设备上使用默认来宾账户登录\n\
  4.  让用户登录 Edge 浏览器并启用同步选项\n\n## 3. 特权账户最佳实践\n\n**为一名标准用户分配了第二个特权账户，可在需要时用于重置其他用户的密码。该用户有权访问\
  \ Active Directory 用户和计算机 (ADUC) 控制台。在考虑使用这两个账户时，推荐的最佳安全实践是什么？(选择两项。)**\n\n1.  始终使用标准用户账户登录工作站\n\
  2.  使用特权账户时使用“以管理员身份运行”选项\n3.  始终使用特权用户账户登录工作站\n4.  使用特权账户时使用“以标准用户身份运行”选项\n\n##\
  \ 4. 移动存储加密\n\n**用户请求在可移动 USB 驱动器上存储敏感信息。公司政策规定所有可移动存储必须支持数据加密，且所有静态数据必须加密。可以使用什么\
  \ Windows 功能来满足公司政策？**\n\n1.  Pretty Good Privacy (PGP)\n2.  BitLocker To Go\n3.\
