  \ Directory 服务故障`\n6. `DNS 服务故障`\n\n### 问题 3\n一名用户提交支持工单，称无法共享新安装的部门打印机。该用户已被分配共享文件夹和打印机的权限。该用户属于一个工作组，**而非**\
