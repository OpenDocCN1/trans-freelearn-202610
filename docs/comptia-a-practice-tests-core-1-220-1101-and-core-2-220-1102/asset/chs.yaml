  \    3. 社区云\n    4. 公有云\n\n18. 以下哪些仅是 SaaS 产品？（选择两项）\n\n    1. Office 365\n    2.\
  \ 开发工具\n    3. Home Depot\n    4. Spotify\n\n19. 受 COVID 影响，一家金融公司将所有员工转为居家办公模式。公司必须确保始终执行严格的金融法规，并能控制用户桌面、防止数据泄露。公司将实施以下哪种解决方案？\n\
