  ### 14. 正确答案是 **A** 和 **C**。该场景中描述的问题是 `virtual machine sprawl`，即将未受管理的虚拟机部署到网络上的过程。顾问可能会推荐一个两步解决方案。第一步是使用模板部署虚拟机。这将确保保持一致的基线，且镜像已打补丁。第二步是使用
  `SolarWinds Virtualization Manager` 来防止 `virtual machine sprawl`，因为它具有内置的蔓延管理功能。所有其他答案均不正确。在未受管理的虚拟机上安装
  `anti-virus` 将是徒劳的。这些未受管理的虚拟机可能不仅存在 `anti-virus` 这一漏洞。移除这些未受管理的机器是向前迈出的一步，但无法防止再次发生。


  ### 15. 正确答案是 **C**。`Virtual Technology for Directed Inputs/Output (VT-d)` 允许虚拟机访问位于宿主机上的底层硬件。所有其他答案均不正确。当您准备运行
  `hypervisor` 时，您将在 `BIOS` 中看到一个启用 Intel `VT-d` 的选项。这是一个您可以参考的链接：[`https://packt.link/POvT5`](https://packt.link/POvT5)。`Virtual
  Technology Extensions (VT-x)` 用于 `x86` 平台，允许虚拟机访问硬件。使用超过 4 GB RAM 的宿主机（如所述）是 64
  位的，需要 `VT-d`。`Multi-cores` 允许处理器提供更好的性能。`Intel Graphics Virtual Technology (Intel
  GVT)` 在虚拟机上提供接近原生的图形性能。这些都无法解决当前的问题。





  16. 正确答案是 **B** 和 **C**。不间断电源（UPS）类似于电池，因为它能储存电量，并且在发生极短暂的停电时，可以为公司的服务器供电。如果断电超过几秒钟，UPS
  可用于正常关闭虚拟主机。所有其他答案均不正确。如果发生完全断电，UPS 无法维持主机运行；那需要发电机。UPS 是备用电源，不能用于启动计算机、服务器或其他设备。


  17. 正确答案是 **C**。容器虚拟化的一个例子是 Docker。它仅虚拟化应用层并位于操作系统之上。这使得编写应用程序和测试代码更加高效。所有其他答案均不正确。虚拟机备份称为快照。沙箱用于测试恶意软件。虚拟机逃逸是指管理程序、宿主机或客户虚拟机受到攻击时发生的情况。


  18. 正确答案是 **D**。应用程序虚拟化是一个过程，允许你从远程服务器运行应用程序，但其表现得像在本地运行一样。当虚拟机没有足够的资源在本地运行应用程序时，这非常有用。所有其他答案均不正确。沙箱不是实时环境。它是一个隔离的虚拟机，用于测试应用程序和软件补丁以及调查恶意软件。在虚拟机上本地安装应用程序不是执行应用程序虚拟化的方式。像
  Docker 这样的容器用于应用程序开发，不属于应用程序虚拟化的一部分。

