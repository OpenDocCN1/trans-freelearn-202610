  `User Configuration\\Administrative Templates\\System\\Folder Redirection`（用户配置\\管理模板\\系统\\文件夹重定向）下。`Login
  scripts`（登录脚本）不用于配置文件夹重定向。`Organizational units`（组织单位）可用于将设置定向到特定用户，但不会实际推送配置设置。`home
  folder`（主文件夹）是通过登录脚本分配给用户的默认文件夹。


