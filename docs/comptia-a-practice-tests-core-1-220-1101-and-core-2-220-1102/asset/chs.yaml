  正确答案是 **A**。`Active Directory` `security groups`（安全组）主要用于向共享资源（如文件、文件夹、打印机和其他网络资源）分配权限。通过将用户或其他组分配到安全组，您可以轻松管理网络中各种资源的访问控制。此选项正确，因为它准确描述了
  `Active Directory` 中安全组的主要用途。选项 B 不正确，因为虽然安全组有助于组织用户账户，但其主要目的是管理访问控制和权限。选项 C 不正确，因为
  `email distribution lists`（电子邮件分发列表）通常在 `Active Directory` 中使用 `distribution groups`（通讯组/分发组）实现，而不是安全组。选项
  D 不正确，因为控制网络连接通常通过网络安全机制（如 `firewalls`（防火墙）和 `network access control lists (ACLs)`（网络访问控制列表））实现，而不是
  `Active Directory` 安全组。


