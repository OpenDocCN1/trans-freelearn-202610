  8. 正确答案是 **B**。Windows 10 将密钥和生物识别数据存储在本地 TPM 中；因此，如果指纹无法识别，我们需要清除 TPM。还原系统映像无法修复生物识别错误。更新
  BIOS 无法防止生物识别指纹问题。


