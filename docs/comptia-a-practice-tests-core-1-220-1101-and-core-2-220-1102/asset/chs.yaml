  private network` 是一个允许客户虚拟机拥有自己隔离网络的网络。


  ### 10. 正确答案是 **B** 和 **E**。实现教授目标的最简单方法是使用 `Virtual Desktop Infrastructure (VDI)`，这样每个学生的虚拟机都可以将其虚拟桌面体验设置为非永久性。这样，当学生注销时，镜像将恢复到原始镜像，而不保存任何更改。另一种方法是构建虚拟机并创建
