  3.  使用系统还原恢复到上一个还原点\n4.  擦除系统并执行全新的 Windows 安装\n\n## 8. 防火墙规则配置 (MySQL 端口)\n\n**最近安装的数据库应用程序已在部门服务器上配置并测试完成。部门用户无法通过网络连接到该应用程序。技术人员对服务器执行端口扫描并观察到以下输出：**\n\
