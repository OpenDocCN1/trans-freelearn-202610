  \ 灾难恢复由云提供商提供\n\n22. 一家 IT 公司将把 10 台服务器和 50 台桌面迁移到云端。他们将迁移到以下哪种云服务？\n\n    1. PaaS\n\
  \    2. SaaS\n    3. MaaS\n    4. IaaS\n\n23. 新西兰刚刚赢得橄榄球世界杯决赛，官方 All Blacks 在线商店无法应对想要购买世界杯纪念品的新西兰人的数量。商店经理联系其云提供商获取额外资源，云提供商在\
