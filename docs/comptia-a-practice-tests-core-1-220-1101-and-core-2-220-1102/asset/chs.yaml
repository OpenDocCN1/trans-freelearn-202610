- "# 安全\n\n## 简介\n\n本章将测试考生对安全概念、程序和安全最佳实践的了解。威胁和威胁行为者不断变化，安全专业人员必须了解如何以不同方式识别和缓解威胁。需要保护的常见环境包括无线网络、**小型办公室/家庭办公室\
  \ (SOHO)** 网络、企业网络，以及保护远程访问至关重要的情况。移动设备和对 IoT 的支持也给安全专业人员带来了许多挑战。了解社会工程学带来的威胁很重要，这通常被称为黑客攻击人类（即以用户为目标）。为了缓解这些威胁，识别需要启用的正确控制并了解对特定威胁的正确响应非常重要。\n\
  \n为了在 CompTIA A+ Core 2 (220-1102) 认证考试中取得成功，考生必须熟悉以下目标：\n\n*   8.1 总结各种安全措施及其目的\n\
