  标签对齐或定位不正确会导致打印标签上出现间隙。标签上的间隙通常与墨水或碳粉液位低无关。卡纸会导致标签出现间隙，过时的打印机驱动程序或固件可能导致各种打印问题，但标签上的间隙通常与对齐或定位有关。


