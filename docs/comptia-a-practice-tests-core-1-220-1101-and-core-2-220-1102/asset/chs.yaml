  ### 16. 正确答案是 **D**

  如果新安装的打印机中纸张卡在定影器上，最好联系打印机制造商或技术人员寻求帮助。他们可以提供针对您打印机型号的具体指导，并帮助解决问题，而不会造成进一步损坏。使用镊子或钳子可能会损坏定影器或其他打印机组件，因此不建议这样做。如果新安装的打印机中纸张卡在定影器上，请关闭打印机并让它冷却。不要自行取出纸张，请查阅打印机手册或联系制造商获取具体说明。手册可以提供指导或建议联系技术人员以避免潜在损坏。忽略问题并继续打印可能导致更多卡纸，甚至损坏打印机。


  ### 17. 正确答案是 **D**

  使用不兼容的（第三方）碳粉会导致打印质量差，并专门导致复印页面上出现条纹。打印头堵塞会导致复印页和直接打印页上的打印输出不一致或失真。定影器过热通常会同时影响复印页和直接打印页，而不是仅导致复印页出现条纹。扫描玻璃损坏通常会导致复印页和直接打印页上的图像不一致或失真。






