  9. 正确答案是 **A**、**B** 和 **E**。移除所有保护胶带和包装材料至关重要，以确保打印设备准备好使用，并防止运行期间发生任何阻塞或损坏。将设备拆箱并断电放置几小时，以降低因设备从冷藏/运输环境移至较暖和的安装环境而导致设备内部形成冷凝水的风险。打印设备很重，所以请确保使用安全的搬运技术。可能需要两人才能安全搬运。


  10. 正确答案是 **A** 和 **C**。将挤出机加热到特定温度是更换 3D 打印机耗材的常见步骤。通过加热挤出机，耗材变软并可被手动取出，从而方便地更换新耗材。尽可能多地拉出旧耗材，然后推入新耗材。


  11. 正确答案是 **A**。熔融沉积建模 (FDM) 是一种使用丝材材料的 3D 打印技术，通常为 ABS 或 PLA 等热塑性塑料。丝材被熔化并通过喷嘴挤出，逐层构建物体。光固化立体成型
  (SLA) 使用液态树脂材料而非丝材材料进行 3D 打印。选择性激光烧结 (SLS) 涉及使用粉末材料（如塑料或金属），而非丝材。数字光处理 (DLP) 也使用液态树脂材料，与
  SLA 类似，但使用不同的光源进行固化。它不使用丝材材料。


  12. 正确答案是 **B**。打印机创建自己的 Wi-Fi 网络供设备连接并无线打印。Wi-Fi Direct 是一种允许设备彼此建立直接无线连接的技术，无需传统
  Wi-Fi 网络。在 Wi-Fi Direct 打印的情况下，打印机充当 Wi-Fi 接入点并创建自己的网络。设备随后可连接到此网络并无线向打印机发送打印作业。Wi-Fi
  Direct 打印不需要现有的 Wi-Fi 网络即可连接。Wi-Fi Direct 打印不使用线缆。Wi-Fi Direct 和蓝牙是独立的无线技术，因此无法使用蓝牙。


  13. 正确答案是 **A**。打印机维护套件通常包含一个新的定影组件，这是套件的主要组件。此外，它还包括转印/二次充电辊和每个纸盒的纸张传输辊，其中包含拾取辊和新的分离垫。这些组件对于维持打印机的正常运行至关重要。碳粉盒、墨盒、打印头和额外纸盒等其他物品通常不包含在维护套件中。所有其他选项均不正确。


  14. 正确答案是 **A**。PostScript 是一种页面描述语言，擅长渲染复杂的图形和图像。它提供先进功能，可准确呈现矢量图形、渐变和阴影等图形元素。打印机控制语言
  (PCL) 通常用于打印不带复杂格式的基于文本的文档，例如简单的文字处理文档或基本的办公文档。

