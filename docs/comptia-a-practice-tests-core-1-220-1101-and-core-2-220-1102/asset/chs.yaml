  IoT` 和 `Linux Lite`，据传 `Apple` 正在为 iPad 测试 `macOS` 的精简版。然而，这些都不是基于浏览器界面的。


  ### 问题 4

  正确答案是 **C**。`Windows` 为跨单一供应商操作系统标准化所有服务器、工作站和移动设备提供了最佳解决方案。`Windows Server` 提供集中式数据中心服务，`Windows
  11 Enterprise` 可用于托管桌面，`Windows Mobile` 可用于手持设备。`Linux` 用于提供数据中心服务，是一个非常强大的基于服务器的平台。也有用户友好的桌面版本，如
  `Ubuntu`/`Red Hat`，但这些版本不支持智能手机或平板电脑。`iOS` 是 `Apple` 用于 iPhone 和 iPad 的操作系统。`ChromeOS`
  仅限桌面端。


  ### 问题 5

  正确答案是 **D**。`Linux` 操作系统使用扩展文件系统 (`ext`)，其第一版创建于 1992 年左右，支持 `2GB` 的存储限制。`ext2`
  之后是 2001 年的 `ext3`，支持最大 `16TB` 的分区大小。`ext4` 于 2008 年左右推出，支持最大 `1EB` (`1,000,000
  TB`) 的分区大小。`ext4` 文件系统还支持联机碎片整理，这对于维护高效的文件访问非常重要。`FAT32` 不用作 `Linux` 的核心文件系统。它用于可移动介质，最大卷大小为
  `32GB`。`ext3` 不支持联机碎片整理或所需的卷大小。`NTFS` 是 `Windows` 文件系统。






  ## 6. Android 操作系统概述


  正确答案是 **C**。Android 是由 Google 开发的开源（即免版税）操作系统。它于 2008 年首次发布，截至 2023 年，当前版本为 13（代号
  Tiramisu）。Android OS 基于 Linux 内核，并支持主流 Linux 发行版中使用的许多安全功能。iOS 是一种专有的基于 Apple 的移动操作系统，最初仅用于
  Apple 硬件，具体来说是 iPhone、iPod 和 iPad 的代码库。SUSE Linux 不用于移动设备或智能手机；它主要部署在数据中心服务器上。Windows
  Mobile 使用的是 Windows 桌面操作系统的修改版本。


  ## 7.9 给定场景，在多样化的操作系统环境中执行操作系统安装和升级


  ### 问题 1


  正确答案是 **D**。预启动执行环境 (PXE) 允许计算机从网络接口卡 (NIC) 启动并访问网络上的服务。在这种情况下，技术人员可以使用介质创建 Windows
  部署服务器，并从中心位置执行升级。从固态硬盘 (SSD) 启动不满足通过网络安装的要求。光驱和闪存驱动器可用于安装单个镜像，但无法解决跨网络升级多台计算机的问题。


  ### 问题 2


  正确答案是 **D**。无人值守安装允许提供一个集中部署镜像，以及一个自动化设置文件（或无人值守脚本）。安装开始后，技术人员可以离开，让其自行完成。远程网络安装不满足自动化安装的要求。修复安装允许将有故障的计算机重新镜像回标准构建配置。全新安装不描述自动化过程。


  ### 问题 3


  正确答案是 **C**。GUID 分区表 (GPT) 磁盘格式允许高达 18 EB（即 1880 万 TB）的分区大小。GPT 驱动器最多还可包含 128 个独立分区。ext4
  在 Windows 上不受支持；它用于 Linux 文件系统。主引导记录 (MBR) 分区最大限制为 2TB，且每个磁盘最多支持四个分区。Apple 文件系统
  (APFS) 在 Windows 计算机上不受原生支持。


