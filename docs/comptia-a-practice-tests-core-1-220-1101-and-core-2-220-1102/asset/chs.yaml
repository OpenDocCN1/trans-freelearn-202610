  \ CPU 和内存。如何实现这一点？\n\n   1. 资源池\n   2. 系统蔓延\n   3. 网络分段\n   4. 按量计费\n\n3. 攻击者访问了一个易受攻击的客户机计算机，并设法攻击了管理程序，导致虚拟网络完全故障。进行了哪种类型的攻击？\n\
