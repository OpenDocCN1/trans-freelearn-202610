  \  `802.11g`\n4.  `802.11n`\n\n## 2.4 总结网络主机提供的服务\n\n### 问题 1\n服务台被大量网络用户淹没，称他们无法访问任何网络资源。服务台应确保哪台服务器正常运行？\n\
