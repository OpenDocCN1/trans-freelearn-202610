  \ 处终结的地方\n    3.  配线架的正面有预接线的 `RJ45` 端口\n    4.  配线架的背面有预接线的 `RJ45` 端口\n\n2.  云服务提供商\
  \ (`CSP`) 需要能够使用脚本快速预配服务器和网络。哪种网络类型提供此功能？\n    1.  广域网 (`WAN`)\n    2.  局域网 (`LAN`)\n\
