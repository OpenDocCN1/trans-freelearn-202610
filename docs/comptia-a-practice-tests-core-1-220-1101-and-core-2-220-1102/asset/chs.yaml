  \n2.  一名硬件工程师将升级笔记本电脑的内存。在安装新内存之前，硬件工程师应首先完成以下哪项任务？\n\n    1.  购买 `256 GB DDR3 RAM`\n\
  \    2.  佩戴静电放电带采取防静电预防措施\n    3.  检查主板的供电电压\n    4.  为笔记本电脑的操作系统下载任何操作系统更新\n\n\
