  \n为了解决应用程序无法启动并显示指示需要修复的错误消息的问题，技术人员应在 Windows 10 中使用“程序和功能”实用程序。该实用程序允许用户管理已安装的程序，包括修复或卸载有问题的应用程序。通过访问“程序和功能”，技术人员可以启动相关应用程序的修复过程，从而解决启动问题。\n\
