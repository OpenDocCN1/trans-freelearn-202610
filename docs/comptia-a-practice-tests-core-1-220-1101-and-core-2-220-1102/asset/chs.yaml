  \ IP 地址\n2. 尝试使用 `ipconfig /all` 获取 IP 地址\n3. 尝试使用 `ipconfig /renew` 获取 IP 地址\n\
  4. 尝试使用 `ipconfig /flushdhcp` 获取 IP 地址\n\n\n\n\n## 练习题\n\n### 7. 远程办公数据限制\n一家公司最近切换到远程办公模式。该公司通过昂贵的蜂窝和卫星连接支持许多位于偏远地区的用户。为了最小化这些链路的成本，公司希望限制每月数据使用量。哪**两个**配置选项能**最好地**允许组织限制数据使用？\n\
  \n1.  `设置 | 系统 | 存储设置`\n2.  `高级网络设置 | 数据使用情况`\n3.  `高级网络设置 | 网络接口 | 计量连接 – 开启`\n\
  4.  `高级网络设置 | 高级共享`\n5.  `高级网络设置 | 网络接口 | 飞行模式 – 开启`\n\n### 8. 网络打印机配置\n某业务单元新安装了一台网络打印机，并直接连接到局域网（`LAN`）交换机，技术人员现在必须配置多台工作站以直接连接到该网络打印机。在客户端工作站上添加打印机时，以下哪个选项允许技术人员连接网络打印机？\n\
