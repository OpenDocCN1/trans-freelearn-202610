  \n1. 销毁证明\n2. 保密协议（`NDA`）\n3. 焚烧证明\n4. 服务级别协议\n\n### 4. 经理必须确保纸质文档变得不可读。这些文档包含机密级数据。哪两种方法结合使用可确保机密文档变得不可读？\n\
  \n1. 粉碎\n2. 退磁\n3. 焚烧\n4. 擦除\n\n## 8.9 给定场景，在小型办公室/家庭办公室（`SOHO`）无线和有线网络上配置适当的安全设置\n\
