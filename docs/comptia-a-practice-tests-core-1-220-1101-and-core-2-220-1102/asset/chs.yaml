  \n\n\n\n\n## 练习题 5-12\n\n### 5. CISO 正在为公司员工准备关于密码管理器使用的指导。密码管理器的用途是什么？\n\n1. 生成安全密码\n\
  2. 存储和整理密码\n3. 加密您的密码\n4. 以上皆是\n\n### 6. 管理员必须确保薪资团队受聘的合同人员仅在其他员工在场时才能登录网络。确保强制执行这一点的最有效方法是什么？\n\
