  4.  `netstat -s`\n\n### 问题 13：验证组策略强制执行\n\n管理员创建了一个新的组策略并将其部署到生产环境。管理员现在想验证新的组策略设置是否已下载并在用户工作站上强制执行。以下哪个命令将允许管理员验证组策略是否生效？\n\
  \n1.  `shutdown -r`\n2.  `dcdiag`\n3.  `gpresult`\n4.  `gpmc.msc`\n5.  `gpupdate`\n\
  \n---\n\n## 7.3 给定场景，使用 Microsoft Windows 10 操作系统 (OS) 的功能和工具\n\n### 问题 1：结束阻塞的后台应用程序\n\
  \n在开始在线认证考试前，用户必须运行代理程序以管理在线考试。代理报告名为“Dell Diagnostics”的应用程序正在阻止在线考试启动。用户如何快速识别该后台应用程序并结束任务？\n\
  \n1.  转到 **任务管理器** | **进程** 并 **结束任务**\n2.  转到 **任务管理器** | **启动** 并禁用启动项\n3.  转到\
  \ **任务管理器** | **性能** 并 **结束任务**\n4.  运行 **注册表编辑器** 并修改 `Computer\\HKEY_CURRENT_USER`\n\
  \n\n\n\n## 7.3 给定场景，使用适当的 Microsoft Windows 10 操作系统工具\n\n### 2. 蓝屏故障排除\n技术人员正在维修一台计算机，突然电脑出现\
  \ Windows 蓝屏并重新启动，表面上看似正常。为了解决该问题，技术人员需要确定蓝屏事件期间显示的错误消息。技术人员应使用以下哪项来帮助排查问题？\n\n\
  1.  `sfc`\n2.  `msconfig`\n3.  `regedit32`\n4.  `eventvwr`\n5.  `msinfo32`\n\n###\
  \ 3. 修复未记录的更改\n一名最近离职的员工对经理的笔记本电脑进行了多项未记录的更改。这些更改导致 Office 365 应用程序无法及时接收更新，并停止了自动磁盘碎片整理服务。为确保这些服务自动运行，哪个工具能**最好地**修复这些问题？\n\
  \n1.  任务计划程序 (`taskschd.msc`)\n2.  设备管理器 (`devmgmt.msc`)\n3.  性能监视器 (`perfmon.msc`)\n\
  4.  证书管理器 (`certmgr.msc`)\n\n### 4. 监控系统性能\n薪资经理 Ann 抱怨其公司笔记本电脑的系统性能不佳。应用程序在一天中的特定时段运行缓慢，偶尔在她加班完成任务的晚上也会变慢。受理工单的支持技术人员希望监控\
  \ Ann 的电脑以识别问题。技术人员应使用以下哪种工具来**最好地**分析计算机的行为？\n\n1.  计算机管理\n2.  事件查看器\n3.  性能监视器\n\
  4.  任务管理器\n\n### 5. 检查 BIOS 更新\n一名员工从为期六个月的外派业务合作伙伴任务中返回。计算机技术人员想检查在六个月期间，硬件供应商的\
  \ BIOS 更新是否已安装在该员工的笔记本电脑上。哪个工具能**最好地**显示此信息？\n\n1.  系统信息 (`msinfo32.exe`)\n2.  资源监视器\
  \ (`resmon.exe`)\n3.  系统配置 (`msconfig.exe`)\n4.  注册表编辑器 (`regedit.exe`)\n\n### 6.\
  \ 释放磁盘空间并优化访问\n服务台技术人员接到工单，用户的 Windows 工作站运行缓慢。计算机启动缓慢，执行大文件时有长时间的延迟。检查本地硬盘后，发现其接近容量上限。技术人员需要释放空间并优化大文件的访问时间。哪两条命令能**最好地**满足此要求？（选择两项。）\n\
  \n1.  进入安全模式启动\n2.  重启计算机\n3.  对硬盘进行碎片整理\n4.  安装设备驱动程序\n5.  运行磁盘清理\n\n### 7. 管理磁盘分区\n\
  由于工作站构建模板配置错误，销售团队使用的工作站可用存储空间非常少。技术人员希望查看主操作系统驱动器当前分配的空间，并尽可能扩大驱动器大小。哪种基于图形界面的工具**最适合**此任务？\n\
  \n1.  `Diskpart`\n2.  磁盘管理\n3.  设备管理器\n4.  磁盘清理\n\n### 8. 减少启动等待时间\n支持技术人员正在排查销售主管提交的服务台工单。Windows\
  \ 启动时加载的应用程序导致用户在近五分钟内无法使用计算机。可以采取什么措施帮助用户避免这种漫长的等待时间？\n\n1.  使用系统配置 | 启动选项来禁用启动应用程序\n\
  2.  删除注册表项 `HKEY_LOCAL_MACHINE\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Run`\
  \ 下列出的条目\n3.  使用任务管理器禁用所有当前设置为已启用的启动任务，然后重新启动计算机以确保问题已解决\n4.  打开任务管理器 | 启动，识别具有**高**启动影响的应用程序。禁用这些导致启动时过度引导时间的应用程序。\n\
  \n### 9. 诊断运行缓慢\n人力资源部的一名用户提交了支持工单。原因是他们的台式机运行缓慢。用户报告称未对电脑进行任何更改。支持技术人员应使用以下哪种工具来确定速度下降的原因？\n\
  \n1.  任务计划程序\n2.  Windows 内存诊断\n3.  任务管理器中的**性能**选项卡\n4.  磁盘碎片整理程序\n\n### 10. 管理受信任的根证书\n\
  一位部门经理被意外分配了权限，允许其对公司笔记本电脑进行多项未经授权的更改。其中一项更改是向笔记本电脑的“受信任的根证书颁发机构”存储区添加了额外的证书。该公司是政府承包商，这些新证书不受信任，因为它们不符合政府合规法规。支持技术人员如何确保这些证书颁发机构不会被经理笔记本电脑上运行的应用程序所信任？\n\
  \n1.  在笔记本电脑上使用 `certmgr.msc` 从“受信任的根证书颁发机构”存储区中删除证书\n2.  在笔记本电脑上使用 `regedit.msc`\
  \ 从“受信任的根证书颁发机构”存储区中删除证书\n3.  在笔记本电脑上使用 `devmgmt.msc` 从“受信任的根证书颁发机构”存储区中删除证书\n4.\
  \  要求外部证书颁发机构将其所有证书放入证书吊销列表 (CRL)\n\n## 7.4 给定场景，使用适当的 Microsoft Windows 10 控制面板实用程序\n\
  \n### 1. 禁用打印机\n支持技术人员正在帮助用户解决其台式机上的打印问题。为测试可能的修复方法，技术人员有必要禁用打印机。技术人员应使用以下哪种工具来执行此操作？\n\
  \n1.  设备和打印机\n2.  同步中心\n3.  设备管理器\n4.  电源选项\n\n### 2. 修复文件关联\n用户致电服务台，发现无法打开图片文件夹中的\
