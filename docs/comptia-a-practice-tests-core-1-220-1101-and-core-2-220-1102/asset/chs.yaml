  \ 的文件中\n\n### 12. 为了保留证据以备潜在诉讼，事件处理人员最可能采取什么行动？\n\n1.  对文件应用加密\n2.  创建任何受影响硬盘的副本\n\
  3.  联系网络保险公司\n4.  通知执法部门\n\n### 13. 重要业务数据必须备份以满足行业法规，技术人员正在寻找最合适的备份方法。要求是定期仅修改少数文件，同时考虑到有限的存储空间。技术人员应选择哪种备份方法？\n\
  \n1.  完全备份\n2.  增量备份\n3.  基于云的备份\n4.  磁带轮换\n\n### 14. 为什么支持技术人员在拜访客户前会将手机设为静音？\n\
  \n1.  以避免干扰客户的环境\n2.  以在拜访期间节省电池续航\n3.  以防止来电被录音\n4.  以启用位置跟踪以便记录服务记录\n\n### 15.\
  \ 技术人员必须确定一种解决方案来复制大量文件，这可能需要数小时。过去他们经历过连接中断和网络中断。如果源机器和目标机器之间的网络连接不稳定或遇到暂时中断，什么可以让文件复制过程得以恢复？\n\
  \n1.  系统文件检查器 (`sfc`)\n2.  检查磁盘 (`chkdsk`)\n3.  Git 克隆 (`git clone`)\n4.  `Robocopy`\n\
  \n### 16. 一名为大型区域银行工作的技术人员正在配置新的磁带备份系统。在服务器机房安装系统后，哪种备份类型需要**首先**完成？\n\n1.  复制备份\n\
  2.  镜像备份\n3.  差异备份\n4.  完全备份\n\n### 17. 用户在其 Web 浏览器上遇到频繁弹窗。什么能提供**最佳**解决方案来修复此问题？（选择两项。）\n\
  \n1.  安装信誉良好的广告拦截扩展\n2.  将浏览器更新到最新版本\n3.  禁用计算机的防火墙\n4.  忽略弹窗；它们无害\n5.  下载并运行注册表清理工具\n\
  6.  将计算机重置为出厂设置\n\n### 18. 在 macOS 计算机上安装新软件时，技术人员最常使用以下哪种文件扩展名？\n\n1.  `.pkg`\n\
  2.  `.bat`\n3.  `.msi`\n4.  `.dmg`\n\n### 19. 用户报告其智能手机在未使用时过热，且新启动的应用程序频繁崩溃。哪些操作能**最好地**解决这些问题，且对用户影响最小？（选择两项。）\n\
  \n1.  清除应用缓存和数据，更新应用，并确保通风良好\n2.  执行出厂重置并安装第三方降温应用\n3.  禁用自动更新并限制应用后台进程\n4.  购买硬件性能更好的新智能手机\n\
  5.  忽略这些问题，因为它们在旧智能手机上很常见\n6.  关闭不需要的应用程序\n\n### 20. 用户的台式机在夜间自动重启，现在系统无法运行某些 Windows\
  \ 应用程序。修复该问题的推荐操作是什么？\n\n1.  执行系统还原到之前的正常工作状态\n2.  重新安装 Windows\n3.  删除受影响的应用程序并重新安装它们\n\
  4.  忽略该问题；它最终会自行解决\n\n### 21. 以下哪个选项可用于建立对数据中心的安全物理访问？\n\n1.  周界屏障\n2.  入侵检测系统\n\
  3.  接近卡读取器\n4.  监控摄像头\n\n### 22. 用户通知技术人员计算机性能迟缓。以下哪种工具可以帮助技术人员确定问题的根本原因？\n\n1.\
  \  系统优化器\n2.  性能监视器\n3.  注册表编辑器\n4.  任务计划程序\n\n### 23. 从 GitHub 仓库下载了一个开源软件构建版本。在安装软件映像之前，技术人员遇到以下字符串：\n\
  \n```\n7d3bb8e188cd9154e99b7ea8db38a24181efb2d1\n```\n\n哪个选项**最准确地**描述了该字符串的预期用途？\n\
  \n1.  用于验证下载完整性的校验和\n2.  加密密钥\n3.  产品许可证密钥\n4.  网络端口号\n\n### 24. 用户在手机上安装了未经批准的实用程序和应用程序。公司最近部署了\
  \ `MDM` 工具，并希望防止用户旁路加载未经批准的应用程序。哪两项 `MDM` 策略将防止未来用户旁路加载未经批准的应用程序？\n\n1.  应用白名单\n\
  2.  强制执行应用商店限制\n3.  启用 USB 调试控制\n4.  实施全设备加密\n5.  启用远程擦除\n6.  实施地理围栏\n\n### 25.\
  \ 技术人员在尝试将销售经理的个人笔记本电脑添加到公司的 `Active Directory` 域时遇到问题。技术人员无法将 Windows 10 笔记本电脑加入\
  \ `Active Directory` 域的最可能原因是什么？\n\n1.  计算机处理器是 AMD 版本\n2.  笔记本电脑预装了 Windows 10\
  \ 家庭版\n3.  笔记本电脑没有触摸屏\n4.  笔记本电脑连接到了扩展坞\n\n### 26. 一家工程公司正在考虑实施其计算机辅助设计 (CAD) 软件的最新版本，该版本包含一项功能，要求将所有\
  \ CAD 文件的备份外部存储在软件供应商的数据中心。以下哪项**最有可能**引起 IT 经理的担忧？\n\n\n\n\n\n### 场景需求\n\n1.  必须对更新后的软件与所有系统类型及配件进行全面的兼容性测试\n\
  2.  需确保在更新安装期间为额外员工工时分配充足的预算\n3.  由于备份的 CAD 文件体积较大，网络利用率预计将显著增加\n4.  由于更新和安装文件的大小，本地硬盘可能会过载\n\
  \n### 问题 27\n\n公司员工接到一个自称代表抵押贷款公司的个人来电，但该身份为虚假。以下哪项最能描述此事件？\n\n1.  `Social engineering`（社会工程学）\n\
  2.  `Phishing`（网络钓鱼）\n3.  `Impersonation`（冒充）\n4.  `Identity theft`（身份盗窃）\n\n###\
  \ 问题 28\n\n发生夜间网络入侵后，安全日志显示字典攻击在 400 次尝试后成功攻破了单个用户账户。以下哪项措施对缓解这一特定威胁**最**有效？\n\n\
  1.  `Two-factor authentication`（双因素认证）\n2.  `Intrusion detection system`（入侵检测系统）\n\
  3.  `Password complexity requirements`（密码复杂性要求）\n4.  `Network segmentation`（网络分段）\n\
  5.  `Account lockout`（账户锁定）\n\n### 问题 29\n\n薪资经理在共享驱动器上创建了一个文件，希望防止其他团队成员意外删除。技术人员应推荐以下哪个应用程序来协助经理隐藏该文件？\n\
  \n1.  `Disk Cleanup`（磁盘清理）\n2.  `Task Scheduler`（任务计划程序）\n3.  `File Properties`（文件属性）\n\
  4.  `Control Panel`（控制面板）\n\n### 问题 30\n\n技术人员花费数小时为公司首席执行官（CEO）排查计算机问题，现因时间紧迫需尽快解决。技术人员下一步应采取什么行动？\n\
  \n1.  继续深入研究以解决问题\n2.  从头重新开始诊断流程\n3.  通知 CEO 维修可能需要几周时间\n4.  将支持工单升级给高级技术人员\n\n\
  ### 问题 31\n\n配置 `SOHO` 设备时，技术人员需确保服务器始终保持一致的 IP 地址，但公司政策禁止使用静态 IP 地址。技术人员应选择以下哪项来满足此要求？\n\
  \n1.  `IP address reservation via DHCP`（通过 DHCP 保留 IP 地址）\n2.  `Network address\
  \ translation (NAT)`（网络地址转换）\n3.  `Dynamic Name System (DNS) record`（动态域名系统记录）\n\
  4.  `Virtual private network (VPN) configuration`（虚拟专用网络配置）\n\n### 问题 32\n\n研究科学家需访问仅支持\
  \ `Linux OS` 的专业应用程序，但目前仅有 `Windows OS` 可用。科学家需在白天无外部网络访问的远程实验室工作。以下哪项为科学家访问该专业应用提供的**最佳**解决方案？\n\
  \n1.  付费使用运行 `Linux OS` 的远程桌面\n2.  在受支持的 `Windows Linux subsystem`（Windows Linux\
  \ 子系统）中安装该 Linux 应用程序\n3.  安装 `Linux` 作为主操作系统，并购买第二台计算机处理 Windows 应用程序\n4.  启用 `Windows\
  \ Hyper-V client`（Windows Hyper-V 客户端）并安装 `Linux OS` 及 Linux 应用程序\n\n### 问题 33\n\
  \n多台台式机需升级以支持新软件安装，升级涉及更换处理器和增加内存。为确保升级过程中不发生损坏，应采取以下哪项措施？\n\n1.  在处理任何组件前，使用 `anti-static\
  \ wrist strap`（防静电腕带）接地\n2.  先升级处理器，再添加内存模块\n3.  升级过程中保持计算机通电\n4.  跳过防静电预防措施，因为台式机升级不需要\n\
  \n### 问题 34\n\n客户致电服务台，希望在其 `Windows 10 Home` 电脑上激活语音识别功能。用户应使用 Windows 设置中的哪个工具启用此功能？\n\
  \n1.  `Regional Settings`（区域设置）\n2.  `Accessibility`（辅助功能/轻松使用）\n3.  `Appearance`（外观）\n\
  4.  `Privacy`（隐私）\n\n### 问题 35\n\n近期安全审计发现员工桌面广泛使用多款未经授权的软件应用程序，员工利用这些应用从事社交媒体活动，违反公司政策。针对这一违规行为，应修改以下哪项以反映新要求？\n\
  \n1.  `EMM`（企业移动性管理）\n2.  `SLA`（服务级别协议）\n3.  `DLP`（数据丢失防护）\n4.  `AUP`（可接受使用政策）\n\
  \n### 问题 36\n\n部门经理提议为设计团队工作站升级 32 GB `RAM`，并将操作系统从 `32-bit` 升级至 `64-bit`。迁移至 `64-bit\
  \ OS` 的主要优势是什么？\n\n1.  `64-bit OS` 能更高效地利用更多 `RAM`，允许应用程序访问更大量的内存\n2.  `64-bit OS`\
  \ 的处理速度比 `32-bit OS` 更快\n3.  `64-bit OS` 能提升图形性能和渲染能力\n4.  `64-bit OS` 能增强网络连接和数据传输速率\n\
  \n### 问题 37\n\n用户无法使用台式机登录域，但同一网络上的笔记本电脑运行正常，且技术人员无法访问用于故障排查的安全内部网站站点。此问题最可能的原因是什么？\n\
  \n1.  `Network connectivity issues`（网络连接问题）\n2.  `Incorrect domain credentials`（域凭据错误）\n\
  3.  `Browser compatibility problems`（浏览器兼容性问题）\n4.  `Firewall restrictions`（防火墙限制）\n\
  \n### 问题 38\n\n网络技术人员在 `SOHO` 环境中部署新台式机，需配置使该用户能与网络上其他 Windows 用户共享文件夹。技术人员应实施以下哪项配置？\n\
  \n1.  将网络配置设为 `private`（专用）\n2.  建立 `proxy server connection`（代理服务器连接）\n3.  赋予用户\
  \ `network administrator privileges`（网络管理员权限）\n4.  创建指向共享驱动器公共文档的快捷方式\n\n### 问题\
  \ 39\n\n要调整运行 `macOS` 计算机内部存储驱动器的分区大小，技术人员应使用哪个工具？\n\n1.  `Activity Monitor`（活动监视器）\n\
  2.  `Disk Utility`（磁盘工具）\n3.  `Time Machine`（时间机器）\n4.  `Terminal`（终端）\n\n### 问题\
  \ 40\n\n某开发公司员工流动率高，希望利用 `Microsoft Windows 10` 功能在笔记本电脑重新分配给新员工时最高效地安装全新的 Windows\
  \ 操作系统。以下哪项最合适？\n\n1.  从安装介质手动重装 `Windows 10`\n2.  使用 `Windows 10` 的 `Reset This\
  \ PC`（重置此电脑）功能\n3.  克隆笔记本电脑硬盘\n4.  使用 `Windows 10 System Restore`（系统还原）\n\n### 问题\
  \ 41\n\n高管在飞机上使用 `iPhone` 连接机载 Wi-Fi 看电影时，在无任何联系记录的情况下收到意外图片。为有效解决此问题，高管应采取以下哪项行动？\n\
  \n1.  将 `AirDrop` 配置为仅接受已知联系人的传输\n2.  在整个飞行过程中完全禁用所有无线系统\n3.  停止使用 `iMessage`，改用安全通讯应用\n\
  4.  将消息和通话限制为仅限已保存的联系人\n\n### 问题 42\n\n某高街珠宝店因同类企业接连遭遇冲撞抢劫（ram-raids），需改善物理安保措施。为在不影响行人通行的前提下提升建筑安防并防止车辆冲入场内，以下哪项**最**有效？\n\
  \n1.  `Security personnel`（安保人员）\n2.  `Protective barriers`（防护栏杆/路障）\n3.  `Motion\
  \ detection systems`（动作检测系统）\n4.  `Controlled entryway`（受控入口）\n\n### 问题 43\n\n某小型零售店新建无线网络，但遭遇附近其他无线网络的干扰。以下哪项行动能以**最小**干扰**最有效**地解决该干扰？\n\
  \n\n\n\n\n### 无线网络故障排查选项\n\n1.  选择当前未被使用的无线频率\n2.  使用以太网线缆和交换机替换无线设备\n3.  定期对设备进行断电重启\n\
  4.  重命名接入点\n\n### 44. 备份策略选择\n\n鉴于首席财务官对在勒索软件爆发时维持对工作站上敏感、遗留、未维护的个人身份信息（`PII`）的访问感到担忧，且考虑到长期保留此数据的监管要求，以下哪种备份方法**最**合适？\n\
  \n1.  每日增量备份，安全存储在外部硬盘驱动器上\n2.  定期拍摄快照并存储在网络附属存储（`NAS`）设备上\n3.  将数据完整备份传输到离线加密磁带存储中\n\
  4.  每周差异备份，安全传输到异地备份服务\n\n### 45. 工作站快速锁定\n\n当医生需要短暂离开工作站时，以下哪种方法能**最**有效地快速保护工作站安全？\n\
  \n1.  实施离开时按键组合锁定计算机\n2.  确认附近无未授权人员\n3.  设置屏幕保护程序，在约 30 分钟无活动后自动锁定计算机\n4.  关闭显示器电源以防止未授权访问显示的信息\n\
  \n### 46. 配置会议室计算机自动启动应用\n\n技术人员会利用以下哪些选项来实现登录会议室计算机时应用程序自动启动？（选择两项。）\n\n1.  `Windows\
  \ Explorer`\n2.  `Startup Folder`\n3.  `System Overview`\n4.  `Programs and Features`\n\
  5.  `Task Scheduler`\n6.  `Device Manager`\n\n### 47. 重置密码后的安全措施\n\n系统管理员需要因用户忘记密码而重置其密码。创建新密码后，管理员希望实施额外安全措施以保护用户账户。系统管理员应采取以下哪项操作？\n\
  \n1.  启用下次登录时更改密码的要求\n2.  禁止用户更改密码\n3.  停用用户账户\n4.  设置永不过期的密码\n\n### 48. 最终用户许可协议\n\
  \n家庭用户从在线游戏网站下载了免费软件。安装下载的软件时，系统提示用户阅读一份包含法律措辞和术语的冗长文档。为完成下载，系统提示用户同意文档中规定的使用条款。此场景向用户呈现的是什么？\n\
  \n1.  服务等级协议（`SLA`）\n2.  保密协议（`NDA`）\n3.  最终用户许可协议（`EULA`）\n4.  谅解备忘录（`MOU`）\n\n\
  ### 49. 部署多因素认证\n\n监管审计后，管理员受命增加认证过程的安全性。审计建议部署多因素认证（`MFA`）。哪种方法能**最**好地满足此要求？\n\
  \n1.  语音识别和面部识别\n2.  用户名和密码\n3.  一次性密码（`OTP`）和指纹扫描\n4.  密码和 `PIN`\n\n### 50. 经常出差员工的笔记本安全配置\n\
  \n为经常出差的员工配置新笔记本电脑时，哪种安全做法能**最**有效地确保数据保护？\n\n1.  实施基于 `PIN` 的登录认证\n2.  强制每季度更改密码以增强安全性\n\
  3.  启用硬盘加密以保护敏感信息\n4.  使用物理笔记本锁防止盗窃\n\n### 51. 无法连接员工网络故障排查\n\n一位无法连接到员工网络的大学教授提交了服务台工单。指派的服务台技术人员询问是否有近期变更。教授报告称，因学院放假，周围办公室有大量施工活动。服务台技术人员尝试\
  \ `ping` 用户的桌面，但无响应。以下哪项是该问题**最**可能的原因？\n\n1.  `DHCP` 服务器离线\n2.  防火墙阻止网络访问\n3. \
  \ 用户账户被锁定\n4.  网线已断开\n\n### 52. 网站访问故障排查\n\n销售经理无法访问某网站并提交了服务台工单。经理遇到问题的该网站已验证为在线。以下哪个故障排查步骤**最**有可能解决问题？\n\
  \n1.  删除浏览器历史记录\n2.  清除 `DNS` 缓存\n3.  刷新 `ARP` 缓存\n4.  在浏览器中启用 `JavaScript`\n\n\
  ### 53. Windows 就地升级\n\n支持技术人员应选择哪种方法执行从 `Windows 8.1` 到 `Windows 10` 的本地升级，迁移文件和用户首选项，同时确保每个系统单独升级？\n\
  \n1.  母版镜像\n2.  全新安装\n3.  就地升级\n4.  `Windows Deployment Services`（`WDS`）\n\n###\
  \ 54. 笔记本数据丢失风险缓解\n\n最近的安全审计指出，笔记本电脑丢失或被盗导致数据丢失的风险很高。为了在最大程度减少对用户体验影响的同时降低 `Windows`\
  \ 笔记本用户的此类风险，以下哪项措施**最**有效？\n\n1.  实施全盘加密\n2.  强制定期笔记本备份\n3.  实施生物识别认证\n4.  强制安装笔记本追踪软件\n\
  \n### 55. 薪资办公室无线路由器安全配置\n\n技术人员受命为薪资办公室配置新无线路由器，必须确保配置最佳安全性。为实现最高级别的无线网络保护，技术人员应实施以下哪项安全措施？\n\
  \n1.  `Wi-Fi Protected Setup`（`WPS`）\n2.  `Temporal Key Integrity Protocol`（`TKIP`）\n\
  3.  `Wi-Fi Protected Access 3`（`WPA3`）\n4.  `Wired Equivalent Privacy`（`WEP`）\n\
  5.  `Media Access Control`（`MAC`）过滤\n\n### 56. 杀毒软件导致电脑变慢\n\n支持技术人员在用户的家用电脑上安装了防病毒应用程序。用户随后报告电脑运行缓慢，硬盘活动指示灯持续常亮。解决此问题的**第一步**应该是什么？\n\
