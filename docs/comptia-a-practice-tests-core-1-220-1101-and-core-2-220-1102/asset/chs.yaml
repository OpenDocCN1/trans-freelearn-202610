  sprawl` 发生在服务器在虚拟环境中过度消耗宿主资源时。`sandbox` 是一种隔离的虚拟机，用于测试应用程序和软件补丁以及调查恶意软件。


  ### 12. 正确答案是 **C**。`Fiber Channel` 为 `Storage Area Network (SAN)` 提供非常快速的连接，是该场景下的最佳选择。`SAN`
