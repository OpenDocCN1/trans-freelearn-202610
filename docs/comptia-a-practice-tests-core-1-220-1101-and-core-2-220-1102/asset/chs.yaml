  \ Go\n4.  确保财务团队的 NTFS 权限设置为读取\n\n## 6. 用户账户控制 (UAC)\n\n**技术人员尝试在服务器的网络接口卡上手动设置\
  \ IP 地址。系统提示一个安全对话框，询问是否批准该应用程序对计算机进行更改。是什么可能需要此额外验证？**\n\n1.  Windows Defender\
  \ 防病毒\n2.  用户账户控制 (UAC)\n3.  多因素身份验证 (MFA)\n4.  Windows Defender 防火墙\n\n## 7. 恶意软件处理流程\n\
  \n**技术人员在系统上发现未知进程运行后，隔离了用户的 Windows 10 笔记本电脑。该进程被识别为恶意软件，并在许多防病毒供应商网站上有记录。用户已在一个无互联网访问的网络上使用该笔记本电脑\
