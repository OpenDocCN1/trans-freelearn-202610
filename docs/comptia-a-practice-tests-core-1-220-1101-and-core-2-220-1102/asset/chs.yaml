  4.  将客户的机密文件存储在公开可访问的文件夹中以便于协作\n\n## 10.8 识别脚本编写基础\n\n### 1. 开发人员必须确定 Web 开发社区使用的脚本语言。哪种脚本语言将是最佳选择？\n\
