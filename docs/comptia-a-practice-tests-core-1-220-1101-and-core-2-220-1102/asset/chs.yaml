- '# 第 5 章：硬件和网络故障排除


  ## 5.1 给定场景，应用最佳实践方法论来解决问题


  1. 正确答案是 **C**。第一阶段是确定打印机的问题，并忽略用户提供的任何解决方案。之后，你将建立可能的原因，然后测试理论并实施行动计划。


  2. 正确答案是 **C**。初级管理员违反了公司政策。标准操作程序会规定任何服务器更新都应在非工作时间进行。他们没有执行补丁管理，因为那将是一个企业级解决方案。他们只是将单个更新应用到了单台服务器上。他们没有与用户沟通，这是一种不良做法，但不是事件的主要原因。既然在给服务器打补丁之前没有发生事件，我们要关注的不是故障排除过程；因此，我们可以排除它并制定行动计划。


  3. 正确答案是 **B** 和 **C**。支持技术人员的首要任务是确定问题。他们会询问用户在问题发生前做了什么，以及是否对笔记本电脑进行了任何更改，例如操作系统更新。在确定问题后，他们应该在进行任何更改之前备份数据。搜索供应商网站属于“制定行动计划”的一部分，这在流程的后期进行。


  4. 正确答案是 **C**。事件解决后，系统管理员应记录调查结果、采取的行动和结果。所有其他选项均发生在事件解决之前。


  5. 正确答案是 **A**。他们刚刚建立了一个可能原因的理论。他们认为原因是最近的 Windows 更新。下一阶段将是测试该理论，随后制定行动计划。问题在他们开始调查问题时就已确定。


  ## 5.2 给定场景，排查与主板、内存、CPU 和电源相关的问题


  1. 正确答案是 **B** 和 **D**。更换内存时，应始终关闭服务器电源并佩戴防静电腕带。这将防止你损坏内存。让机器进入待机模式或尝试热插拔内存都不是好主意，因为两者都可能损坏内存。


  2. 正确答案是 **C**。持续的蜂鸣声意味着问题出在内存模块或内存控制器上。主板问题可能表现为无蜂鸣声或 1 长 2 短蜂鸣声。电源问题会没有蜂鸣声。显示适配器错误可能是
  1 长蜂鸣声后跟 2、3 或 4 短蜂鸣声。


  3. 正确答案是 **B**。在升级服务器 CPU 之前，你应该查阅制造商网站以确定主板的插槽类型。然后，搜索该插槽类型是否可以升级到更快的 CPU。备份数据、关闭电源和佩戴防静电腕带应在升级前完成。


  4. 正确答案是 **A** 和 **D**。安装内存模块后，如果未被检测到，请检查 BIOS。如果在 BIOS 中看不到它们，计算机就无法读取它们；因此，重新插拔内存模块以查看是否可以被检测到。重启计算机无济于事，佩戴防静电腕带虽应遵守但无法检测内存。


  5. 正确答案是 **A** 和 **D**。如果进行过维护，存储适配器线缆可能以错误的方向插入。尽管技术人员能听到风扇转动的声音，但电源（PSU）可能存在故障，导致无法向
  CPU 发送“电源正常”信号。这两种故障都会阻止计算机执行开机自检（POST）。主板问题可能表现为无蜂鸣声或 1 长 2 短蜂鸣声。计算机技术人员在启动计算机时不连接显示器的可能性极小。


  6. 正确答案是 **C**。计算机上的时钟时间使用芯片组的一部分实时时钟来保持时间、日期和日历的准确。实时时钟由 CMOS 电池供电，如果时钟不断走时不准，则需要更换电池。连接到计算机的电源线电源不影响计算机时钟。电源（PSU）不为实时时钟供电。获取
  BIOS 更新不影响实时时钟。


