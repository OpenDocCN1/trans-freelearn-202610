  ### 13. 正确答案是 **B**。`Isolation` 意味着您将虚拟机与客户机或另一个虚拟机分离。这是一个您可以参考的链接：[`https://packt.link/URHYE`](https://packt.link/URHYE)。所有其他答案均不正确。`DMZ`
  是一个位于 `Local Area Network (LAN)` 和 `Wide Area Network (WAN)` 之间的物理网络。`Docker` 用于将应用程序与基础设施分离，对创建软件的开发人员特别有用。`snapshot`
