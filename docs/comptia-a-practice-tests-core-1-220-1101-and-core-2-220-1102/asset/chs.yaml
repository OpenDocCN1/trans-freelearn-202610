  \  `Control Panel`（控制面板）\n\n### 问题 5\n研究部门最近为部门用户购买了 `MacBook` 计算机。由于这些计算机上存储着高度敏感的数据，管理层要求对本地存储的内容提供额外的安全保护。哪个功能是保护本地数据驱动器的好选择？\n\
