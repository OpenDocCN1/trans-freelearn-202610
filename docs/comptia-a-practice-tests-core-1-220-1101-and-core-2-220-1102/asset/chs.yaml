  1.  电脑运行的是 Linux\n2.  电脑运行的是 **Windows 10 企业版**\n3.  电脑运行的是 **Windows 10 家庭版**\n\
  4.  电脑注册表损坏\n\n### 问题 5：网络资源访问故障排除\n\n客户打开笔记本电脑，发现虽然设备显示正常的 Windows 桌面，但无法访问任何基于网络的资源。应在命令行使用以下哪种工具来排查此场景？\n\
  \n1.  `ping`\n2.  `msconfig`\n3.  `nbtstat`\n4.  `nslookup`\n\n### 问题 6：通过 IP 解析计算机名\n\
