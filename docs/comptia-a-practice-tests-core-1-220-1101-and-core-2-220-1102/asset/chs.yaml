  \ IP 地址以保护网络流量。选项 D，SSH，是一种提供对系统的安全远程访问和安全文件传输的加密网络协议。虽然 SSH 为远程访问提供加密和安全性，但它不像\
  \ VPN 那样专门建立用于隐藏 IP 地址和保护所有网络流量的隧道。\n\n\n\n\n## 77. 正确答案：`B`\n\n在该场景中，技术人员必须查阅企业关于敏感信息处理和异地维修的政策。企业政策提供了指导方针和程序，以确保在此类情况下敏感数据的保护。通过检查政策，技术人员可以在维护敏感信息安全性和完整性的前提下，就如何推进维修流程做出明智决策。\n\
  \n- **选项 A**：移除硬盘驱动器（HDD）再送修，可能导致必要数据丢失，或使问题难以有效诊断和修复。遵循既定程序以保护数据非常重要。\n- **选项 C**：在计算机离开大楼前删除敏感信息，在某些情况下可行，但必须参考企业政策以确定应采取的适当行动。\n\
