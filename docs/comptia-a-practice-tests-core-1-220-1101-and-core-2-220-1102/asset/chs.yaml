  \ GPO 有关。以下哪个命令行工具对管理员验证正在向会计部门部署哪些 GPO **最有用**？\n\n1.  `nbtstat`\n2.  `gpresult`\n\
  3.  `nslookup`\n4.  `gpupdate`\n5.  `tasklist`\n\n### 问题 11：通过登录脚本映射网络驱动器\n\n技术人员正在创建一个登录脚本，需要自动将共享在\
