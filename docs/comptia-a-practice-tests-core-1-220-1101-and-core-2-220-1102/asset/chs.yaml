  3. 频繁更改密码\n4. 将密码写在纸上并放在显眼的地方\n\n### 11. CISO 必须确保公司遵守推荐的最佳安全实践。CISO 发现有时用户的笔记本电脑在用户不在工位时会显示个人身份信息（`PII`）和知识产权（`IP`）。保护工作站最有效的控制措施是什么？\n\
