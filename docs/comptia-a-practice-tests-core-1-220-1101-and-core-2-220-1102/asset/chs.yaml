  \ PII（个人身份信息）的担忧以及长期数据保留的法规要求，最佳方法是对数据执行完整备份。将此备份存储在离线的加密磁带存储中，可确保数据保持安全并受到保护，免受勒索软件攻击。将数据传输到离线存储可为防止潜在数据丢失提供额外的保护层。选项\
