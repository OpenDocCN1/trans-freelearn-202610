  \n## 79. 正确答案：`D`\n\n该场景中的用户正遭受一种称为 **vishing**（语音钓鱼）的社会工程学攻击。Vishing 是攻击者通过电话欺骗个人，冒充银行代表等可信实体，旨在从不知情受害者处窃取账户详情或个人数据等敏感信息。用户应保持警惕，除非能验证来电者合法性，切勿通过电话提供个人信息。\n\
  \n- **选项 A**：Phishing（网络钓鱼），通常通过电子邮件或欺诈网站进行，旨在诱使用户泄露敏感信息。\n- **选项 B**：Smishing（短信钓鱼），通过短信（SMS）进行，攻击者诱骗用户泄露个人信息或点击恶意链接。\n\
  - **选项 C**：Whaling（鲸钓），是针对组织内高知名度个人或高管的特定网络钓鱼攻击，旨在获取敏感信息或访问宝贵资源。\n\n## 80. 正确答案：`B`\n\
  \n要在运行 macOS 的计算机上手动设置 IP 地址，技术人员应使用 `ifconfig` 命令。`ifconfig` 命令允许配置和管理网络接口，包括分配\
  \ IP 地址。\n\n- **选项 A**：`ipconfig` 是 Windows 操作系统中用于查看和管理 IP 配置的命令，不适用于 macOS。\n\
  - **选项 C**：`arpa` 是地址和路由参数区域（ARPA），用于域名系统（DNS）上下文，不用于手动设置 IP 地址。\n- **选项 D**：`ping`\
  \ 用于通过发送 ICMP 回显请求数据包检查网络连通性和延迟，不配置 IP 地址。\n\n## 81. 正确答案：`C`\n\n表示供应商不再支持某产品（包括停止补丁和更新）的正确术语是\
  \ **end of life (EOL)**。产品达到 EOL 时，供应商停止提供进一步支持，用户将无法获得补丁、更新或技术援助，表明该产品不再被积极维护或开发。\n\
  \n- **选项 A**：AUP 代表可接受使用政策，指使用特定服务或资源时可接受行为的规则或准则集，不表示产品供应商支持的结束。\n- **选项 B**：EULA\
  \ 代表最终用户许可协议，是软件供应商与最终用户之间的法律合同，规定软件使用条款和条件，不表示产品供应商支持的结束。\n- **选项 D**：UAC 代表用户账户控制，是\
  \ Windows 操作系统中的安全功能，在执行某些系统级更改时提示用户权限，不表示产品供应商支持的结束。\n\n## 82. 正确答案：`B`\n\nWPA2\
  \ 在向后兼容性方面优于 WPA3。WPA2 已被广泛采用并应用于大量设备（包括旧设备）。升级到 WPA3 时，某些旧设备可能不支持新协议，导致连接问题。因此选择\
  \ WPA2 可确保更广泛的设备仍能安全连接网络。\n\n- **选项 A**：不准确。与 WPA2 相比，WPA3 因其增强的加密方法和针对某些漏洞的防护，提供更高安全级别。\n\
  - **选项 C**：WPA3 通过 Simultaneous Authentication of Equals (SAE) 等功能提高了对暴力攻击的抵抗力，比\
  \ WPA2 更安全。\n- **选项 D**：这不是 WPA2 相对于 WPA3 的主要优势。支持更大设备网络不是比较这两种协议安全优势时的决定性特征。\n\n\
  ## 83. 正确答案：`A`\n\n无特定应用程序的高磁盘使用率可能表明存在恶意软件或病毒。运行完整的防病毒扫描是解决此问题的第一步。\n\n- **选项 B**：更新显卡驱动程序可能改善图形相关性能问题，但不太可能解决高磁盘使用率。\n\
  - **选项 C**：增加虚拟内存大小不是排查高磁盘使用率的第一步。\n- **选项 D**：清除浏览器缓存可能改善网页浏览性能，但不太可能解决系统范围的高磁盘使用率。\n\
  \n## 84. 正确答案：`C`\n\nWPA2 是此处列出的最安全选项。它提供强加密，推荐用于保护无线网络。\n\n- **选项 A**：WEP 已过时且被认为不安全。\n\
  - **选项 B**：WPA 是对 WEP 的改进，但不如 WPA2 安全。\n- **选项 D**：WPS 是便利功能，非加密方法，且可能存在安全漏洞。\n\n\
  \n\n# 练习题与解析\n\n## 第 85-93 题\n\n**85.** 正确答案是 **A**。“未找到可启动设备”错误表明计算机无法找到可启动的操作系统。在\
  \ BIOS 中检查启动顺序以确保选择了正确的启动设备，是解决此问题的第一步。选项 B：内存问题可能导致启动问题，但不太可能导致此特定错误消息。选项 C：显卡驱动程序通常不影响启动过程。选项\
  \ D：互联网连接与启动错误无关。\n\n**86.** 正确答案是 **B**。当设备无法连接到 Wi-Fi 网络时，首先要检查的是网络密码。用户可能输入了错误的密码。选项\
  \ A：蓝牙设置通常不影响 Wi-Fi 连接。选项 C：蜂窝数据使用与 Wi-Fi 连接无关。选项 D：应用更新不影响 Wi-Fi 网络连接。\n\n**87.**\
  \ 正确答案是 **C**。IMAP 旨在从多台设备访问电子邮件并保持同步。它是此场景的首选。选项 A：POP3 将电子邮件下载到单台设备且不同步。选项 B：SMTP\
  \ 用于发送而非接收电子邮件。选项 D：HTTP 用于网页浏览，而非电子邮件访问。\n\n**88.** 正确答案是 **B**。响应迟缓和大量广告等症状表明\
  \ Android 设备上存在盗版/恶意应用程序。此类应用程序通常包含广告软件或恶意软件，会降低设备速度并显示不需要的广告。识别并移除此类应用程序对于解决这些问题至关重要。选项\
  \ A，启用开发者模式，通常不会导致迟缓或过多广告。它更多与应用开发和调试相关。选项 C，有限的互联网连接，可能会导致某些问题，但不会直接导致迟缓和过多广告。选项\
  \ D，意外的应用程序行为，可能是恶意应用程序的结果，但无法直接解释大量广告和迟缓的响应时间。\n\n**89.** 正确答案是 **A**。Android 设备上出现虚假安全警告可能是由于从不受信任的来源安装应用程序，或从不可靠的网站下载\
  \ APK 文件所致。此类来源可能包含触发虚假安全警报的恶意软件或广告软件。仅从 Google Play 商店等可信来源安装应用以防止此问题至关重要。选项 B，数据使用限制通知，与虚假安全警告无关。选项\
  \ C，Root 权限/越狱，可能引入安全风险，但与虚假安全警告无直接关系。选项 D，应用欺骗，指与应用身份相关的欺骗行为，而非虚假安全警告。\n\n**90.**\
  \ 正确答案是 **B**。有限的互联网连接可能由多种原因导致，例如网络问题或不正确的 Wi-Fi 设置。虽然安全顾虑可能相关，但此处的主要问题是连接性，而非特定的安全威胁。选项\
  \ A，启用开发者模式，不太可能直接导致有限的互联网连接。选项 C，高网络流量，可能会降低连接速度，但不是有限连接的主要原因。选项 D，个人文件/数据泄露，与有限的互联网连接无关。\n\
  \n**91.** 正确答案是 **C**。意外的应用程序行为可能由与 Android 安装包 (APK) 来源相关的安全顾虑引起。如果用户从不受信任的来源下载并安装\
  \ APK，他们就有安装恶意或开发不善的应用程序的风险，这可能导致崩溃和其他问题。选项 A，高网络流量，可能影响应用性能，但不是意外行为的主要原因。选项 B，无互联网连接，与意外的应用程序行为无关。选项\
  \ D，Root 权限/越狱，可能引入安全风险，但不是意外应用行为的主要原因。\n\n**92.** 正确答案是 **D**。即使在未使用任何应用程序时，虚假安全警告和大量广告持续出现，表明设备上存在盗版或恶意应用程序。此类应用程序通常会显示广告并触发虚假安全警报，作为其恶意活动的一部分。选项\
  \ A，有限的互联网连接，不会直接导致虚假安全警告和过多广告。选项 B，意外的应用程序行为，可能是恶意应用程序的结果，但无法直接解释大量广告和虚假安全警告。选项\
  \ C，启用开发者模式，不太可能在未使用应用程序时直接导致虚假安全警告和广告。\n\n**93.** 正确答案是 **D**。在未使用数据密集型应用时超出数据使用限制，可能表明存在应用欺骗。恶意应用或恶意软件可能在后台消耗数据，模拟合法应用使用。识别并移除此类欺骗性应用对于解决此问题至关重要。选项\
  \ A，高网络流量，可能会增加数据使用量，但不是超出数据限制的主要原因。选项 B，数据使用限制通知，是一项通知功能，而非过度数据使用的原因。选项 C，Root\
  \ 权限/越狱，可能引入安全风险，但在此背景下不是数据过度使用的主要原因。\n\n## Packt Publishing\n\n![](img/Packt_Logo_New_\\\
