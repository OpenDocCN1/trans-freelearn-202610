  ## 恶意软件清除与预防练习题


  ### 第 4 题


  正确答案是 **A**。定期更新防病毒软件对于防范新的恶意软件威胁至关重要。更新通常包含最新的病毒定义、改进的检测算法和安全增强功能，确保防病毒软件能有效识别并清除最新的恶意软件变种。选项
  B，禁用系统的用户账户控制 (UAC) 功能，会移除一层防止未经授权系统更改的重要防线，并可能使系统更易受恶意软件感染。建议保持 UAC 启用。选项 C，与受信任的同事共享用户凭据，可能导致未经授权的访问，从而危及系统安全并增加恶意软件感染的风险。用户凭据应保密，切勿共享。选项
  D，默认启用所有浏览器扩展和插件，会增加攻击面和潜在漏洞，使系统更容易受到恶意软件感染。建议审查并禁用不必要或不受信任的扩展和插件以降低风险。


