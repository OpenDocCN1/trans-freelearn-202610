  \   3. 键盘记录器\n     4. 引导扇区病毒\n\n## 8.4 解释常见的社会工程学攻击、威胁和漏洞\n\n1. **首席信息官（`CIO`）收到首席执行官（`CEO`）发来的电子邮件，要求提供机密信息。该邮件似乎源自\
