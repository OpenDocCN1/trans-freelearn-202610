  \ `MBR`\n3.  `GPT`\n4.  `APFS`\n\n### 4. 保留应用和设置的升级方式\n一名技术人员正在帮助远程客户将其 `Windows`\
  \ 工作站升级到最新版本。客户希望保留其所有应用程序和设置。哪个选项将升级系统并满足客户要求？\n\n1.  全新安装\n2.  修复安装\n3.  无人值守安装\n\
  4.  就地升级\n\n\n\n\n## Windows 部署与升级问题\n\n### 问题 5\n哪个是第一个强制要求功能升级的 Microsoft Windows\
