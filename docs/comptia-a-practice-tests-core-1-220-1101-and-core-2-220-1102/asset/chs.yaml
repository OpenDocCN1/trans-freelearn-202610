  1.  为专用网络中的设备分配全球可路由的 `IP` 地址

  2.  自动为网络中的设备分配公共 `IP` 地址

  3.  当 `DHCP` 服务器不可用时提供临时 `IP` 地址

  4.  实现不同专用网络中设备之间的通信

