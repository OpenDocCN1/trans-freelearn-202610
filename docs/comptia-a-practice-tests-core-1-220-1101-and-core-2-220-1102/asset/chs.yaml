- "# 第 7 章：操作系统\n\n## 简介\n\n考生必须了解不同主流操作系统和专用移动操作系统的典型使用场景。在企业环境中，支持技术人员必须能够支持和排查多种不同设备的故障。现代企业网络需要针对许多不同的最终用户场景量身定制方法，从本地支持到远程和移动用户。设备可能使用各种网络介质连接到应用程序和服务，包括\
  \ `蓝牙`、蜂窝网络、有线连接和 `Wi-Fi`。\n\n技术人员必须能够配置和排查所有类型的网络连接。随着时间的推移，需要升级硬件和软件解决方案，在规划升级时了解任何限制或要求非常重要。为了快速响应客户支持请求，技术人员应能够选择正确的工具或技术，因此深入了解不同的配置设置和菜单选项非常重要。\n\
  \n为了在 CompTIA A+ Core 2 (`220-1102`) 认证考试中取得成功，考生必须确保熟悉以下目标：\n\n## 考试目标\n\n*   **7.1**\
