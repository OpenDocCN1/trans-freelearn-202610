  \    1.  负载均衡器\n    2.  交换机\n    3.  路由器\n    4.  集线器\n\n\n\n\n# CompTIA Network+\
  \ 练习题\n\n## 2.1-2.2 通用网络问题\n\n### 问题 11\n如果基于网络的防火墙设置为允许 `HTTP` 和 `HTTPS` 流量，当用户尝试使用\
