  \ 默认 GUI 与文件管理器\n\n市场团队负责人正帮助新入职员工熟悉其 `iMac` 台式电脑。在 `macOS` 中，通常将哪个图形用户界面（`GUI`）和文件管理器设置为管理文件和文件夹的默认项？\n\
