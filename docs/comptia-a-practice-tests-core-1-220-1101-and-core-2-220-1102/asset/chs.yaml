  正确答案是 **D**。就地升级将允许客户保留所有受支持的应用程序并保留其设置。重要的是要检查他们当前使用的 Windows 版本是否支持就地升级。全新安装将不保留应用程序或设置。修复安装会将镜像重置为客户系统上当前
  Windows 版本的默认值，旨在作为一种故障排除选项。无人值守安装不一定意味着将选择升级。


  ### 问题 5


  正确答案是 **C**。Windows 10 是第一个支持功能升级的 Windows 操作系统（Windows 11 也支持功能升级）。功能升级通常每六个月发布一次，包含额外的功能和特性。在之前的
  Windows 版本中，新功能和特性是通过 Service Pack 或临时版本交付的，例如从 Windows 8.0 升级到 8.1。Windows 7 和
  Windows 8.1 不支持功能升级。


