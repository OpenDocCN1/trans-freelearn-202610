  \    1.  无状态防火墙\n    2.  基于主机的防火墙\n    3.  有状态防火墙\n    4.  统一威胁管理 (`UTM`)\n\n4.\
  \  安装在客户家中的光网络终端 (`ONT`) 的用途是什么？\n    1.  它提供光纤到路边 (`FTTC`)\n    2.  `ONT` 将光信号转换为电信号\n\
  \    3.  `ONT` 将电信号转换为光信号\n    4.  `ONT` 位于街边机柜中\n\n5.  以下哪项允许主机通过插入交换机的以太网线为设备供电？\n\
  \    1.  `PoE`\n    2.  `Thunderbolt`\n    3.  管理型交换机\n    4.  屏蔽双绞线\n\n6.  以下哪种网络设备用于减小\
  \ `LAN` 中广播域的大小？\n    1.  负载均衡器\n    2.  管理型交换机\n    3.  路由器\n    4.  集线器\n\n7.\
  \  以下哪种技术允许虚拟服务器连接到高速存储？\n    1.  `SAN`\n    2.  `PAN`\n    3.  集群\n    4.  `RAID\
  \ 0`\n\n8.  公司想使用 `PoE`，因为给交换机供电比使用交流适配器更高效，并有助于降低电费。然而，有两台交换机不支持 `PoE`。考虑到成本因素，网络工程师可以采取什么措施解决此问题？\n\
