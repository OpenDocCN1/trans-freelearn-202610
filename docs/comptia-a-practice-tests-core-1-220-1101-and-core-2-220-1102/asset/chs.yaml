  ## 28. 正确答案是 **E**\n\n账户锁定是计算机系统通常实施的一项安全措施，旨在防止未经授权或恶意访问用户账户。如果用户多次输入错误的登录凭据，其账户可能会被锁定一段时间，或直到由管理员手动解锁。这有助于防范字典攻击或暴力破解攻击，攻击者会反复尝试猜测登录凭据以获取账户访问权限。\n\
  \n选项 A（双因素认证）并非专门缓解字典攻击的最佳选择。虽然双因素认证能整体增强安全性，但它并不直接解决字典攻击问题。\n\n选项 B：IDS 监控网络流量并检测任何可疑活动或未经授权的访问尝试。通过分析与字典攻击相关的模式和特征，IDS\
  \ 可以及时提醒网络管理员，使其能够立即采取行动并防止进一步的未经授权访问。由于这是在夜间发生，很可能没有员工响应威胁。\n\n选项 C 可以提高密码强度，但仅靠它无法防止字典攻击。如果复杂密码存在于字典中，攻击者仍可猜测出来。\n\
  \n选项 D（网络分段）是一种隔离网络不同部分的安全措施，但它可能无法直接缓解针对特定用户账户的字典攻击。\n\n## 29. 正确答案是 **C**\n\n\
