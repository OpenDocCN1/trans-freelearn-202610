  \ + Spacebar`（空格键）\n\n## 7.11 识别 Linux 客户端/桌面操作系统的常见功能和工具\n\n### 问题 1\n技术人员正在协助人力资源经理保护保存在人力资源文档文件夹中的许多敏感文件。技术人员能够看到以下输出：\n\
