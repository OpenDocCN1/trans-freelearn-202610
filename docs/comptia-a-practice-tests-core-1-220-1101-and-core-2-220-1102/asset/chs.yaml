  \ `OS` 的常见功能和工具\n*   **7.11** 识别 `Linux` 客户端/桌面 `OS` 的常见功能和工具\n\n本章其余部分专注于实践。针对上述定义的每个概念，您将获得一系列问题，旨在测试您对官方认证考试指南中定义的每个\
