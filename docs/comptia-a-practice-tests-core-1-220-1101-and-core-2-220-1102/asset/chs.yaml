  \n1.  在镜头前进食\n2.  不发言时保持麦克风静音\n3.  在聊天消息中使用非正式语言和缩写\n4.  分享无关的个人轶事\n\n### 10. 与客户沟通时，以下哪项是管理其预期的专业方法？\n\
  \n1.  过度承诺以确保客户满意\n2.  设定切合实际的预期并提供进度更新\n3.  忽略客户请求以避免冲突\n4.  将客户转介至不同的支持渠道\n\n\
  ### 11. 技术人员应采取以下哪项行动，以妥善处理存储在台式计算机上的客户机密和私人资料？\n\n1.  定期与同事共享客户数据以供协作\n2.  使用强加密算法加密客户的敏感文件和文件夹\n\
  3.  将客户的机密数据上传至云存储服务以进行备份\n4.  在未安全擦除硬盘的情况下处置客户的计算机\n\n### 12. 在处理打印机上的客户机密材料时，技术人员应采取以下哪项措施以维护安全？\n\
