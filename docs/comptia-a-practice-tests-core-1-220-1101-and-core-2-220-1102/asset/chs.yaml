  正确答案是 **C**。镜像部署允许创建操作系统的自定义构建（以及任何所需的应用程序）。该镜像可以托管在 Windows 部署服务器上，所有新安装都将使用标准的集中式镜像。升级将保留当前的应用程序和设置（一些现有的台式机可能安装了不同的应用程序并配置不同）。全新安装并不总能确保应用相同的设置。修复安装用于将
  Windows 计算机恢复到标准镜像，作为故障排除步骤。


  ### 问题 7


  正确答案是 **B**。当从中央服务器通过网络安装镜像时，预计网络段上的总体流量会增加。重要的是要识别网络上任何不可接受的负载。只有当网络因额外流量而不堪重负时，对用户的影响才会成为问题。DHCP
  需要在构建期间一次为 30 个工作站提供 IP 地址，因此这不应给 DHCP 服务器带来任何巨大负担。只有当网络在构建过程中遇到不可接受的额外流量时，对生产工作站的影响才会成为负面问题。


  ### 问题 8


  正确答案是 **B, C**。统一可扩展固件接口 (UEFI) 取代了自 1980 年代原始 PC 系统以来在计算机系统中见到的原始基本输入输出系统 (BIOS)。支持
  GPT 磁盘需要 UEFI。Windows 11 安装需要可信平台模块 (TPM) 的存在，以支持操作系统中现已标准化的某些安全功能。Windows 11 除需要
  TPM 2.0 和 UEFI 支持外，还需要 4GB 内存和 1GHz 64 位处理器。


  ### 问题 9


  正确答案是 **B**。修复安装允许修复启动问题，例如丢失或损坏的启动文件。如果 Windows 无法启动且自动修复功能失败，技术人员将看到高级选项菜单。此菜单提供的选项包括系统还原、系统映像恢复（如果您有备份）或运行启动修复。无人值守安装、镜像部署和远程安装不作为故障排除步骤。


