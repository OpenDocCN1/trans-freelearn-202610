  操作系统免受恶意软件侵害。存在合法的 P2P 文件共享应用程序，它们不会被视为恶意软件。`Windows Secure Boot`（Windows 安全启动）旨在确保私钥不被篡改。`Windows
  BitLocker Drive Encryption`（Windows BitLocker 驱动器加密）可防止未经授权访问 `Windows` 硬盘驱动器。


