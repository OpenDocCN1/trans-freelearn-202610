  \ \\\\server1\\public`\n2.  `tracert \\\\server1\\public local drive P:`\n3.  `net\
  \ use \\\\P = Server\\public`\n4.  `tracert P: \\\\server1\\public`\n\n### 问题 12：恶意软件事件后验证操作系统文件完整性\n\
