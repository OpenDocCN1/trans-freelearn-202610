  \ USB 适配器连接问题。\n\n\n\n\n\n## 71. 正确答案：**D**\n\n在该场景中，最可能使用的恶意软件类型是键盘记录器。键盘记录器旨在秘密记录用户的击键操作，捕获密码、信用卡详细信息和其他机密数据等敏感信息。通过隐秘地记录用户输入，键盘记录器使恶意行为者能够未经授权地访问有价值的信息。\n\
  \n选项 A，加密货币挖掘程序，是利用计算机资源挖掘加密货币的恶意软件。虽然它们会影响系统性能，但不直接涉及捕获用户输入。选项 B，Rootkit，是一种隐秘的恶意软件，允许未经授权地访问和控制系统，同时隐藏其存在。虽然它们可以提供未经授权的访问，但并不专门专注于捕获用户输入。选项\
