- "# 2. 网络\n\n## 简介\n\n现代技术的特点日益体现为设备间的互联互通。这意味着，为了跟上这一进步并提供一致且有效的支持，IT 专业人员必须具备网络概念的实用知识，范围涵盖从\
  \ `IP` 地址到不同类型的无线网络。\n\n你需要知道不同应用程序使用哪些端口，以便在防火墙上打开这些端口并允许它们通信。IT 管理员还需要知道如何在用户无法连接到网络时排查故障，无论问题源头是\
  \ `DNS` 还是 `IP` 错误。无线网络是日常生活的常见组成部分，拥有知识和经验以确定哪种类型的无线网络最适合特定场景至关重要。本章的练习测试将检验你应用前期学习所获信息的能力。\n\
  \n在 CompTIA A+ Core 1 (`220-1101`) 认证考试中，领域 2.0 网络占评估的 20%，因此是学生成功备考的关键组成部分。该领域进一步细分为以下核心目标：\n\
  \n*   **2.1** 对比传输控制协议 (`TCP`) 和用户数据报协议 (`UDP`) 的端口、协议及其用途\n*   **2.2** 对比常见网络硬件\n\
  *   **2.3** 对比无线网络协议\n*   **2.4** 总结网络主机提供的服务\n*   **2.5** 给定场景，安装和配置基本的有线/无线小型办公室/家庭办公室\
  \ (`SOHO`) 网络\n*   **2.6** 对比常见网络配置概念\n*   **2.7** 对比互联网连接类型、网络类型及其特性\n*   **2.8**\
  \ 给定场景，使用网络工具\n\n本章其余部分专注于实践。针对上述定义的每个概念，你将获得一系列问题，旨在测试你对该领域官方认证考试指南所定义的每个核心 1 目标的掌握程度。完成这些问题并确保理解其背后的概念后，你应该已完全准备好应对\
  \ CompTIA A+ Core 1 (`220-1101`) 考试中的同类题目。\n\n## 练习考试题目\n\n## 2.1 对比 TCP 和 UDP 端口、协议及其用途\n\
  \n1.  系统管理员需要使用一种协议对网络设备进行安全远程访问。他们应该使用以下哪项？\n    1.  `Telnet` `TCP port 23`\n \
  \   2.  `SSH` `TCP port 22`\n    3.  `RDP` `TCP port 3389`\n    4.  `SNMP` `UDP\
  \ port 161`\n\n2.  当在线商店提醒你正被重定向到安全服务器时，URL 中应显示什么协议？\n    1.  `TFTP`\n    2.  `HTTPS`\n\
  \    3.  `HTTP`\n    4.  `SSH`\n\n3.  以下哪种邮件客户端会下载邮件、将其存储在本地计算机上，且不在邮件服务器上保留副本？\n\
  \    1.  `POP`\n    2.  `IMAP`\n    3.  `SMTP`\n    4.  `SSH`\n\n4.  Windows 操作系统中用于文件和打印共享的应用程序协议是以下哪项？\n\
  \    1.  `137-139`\n    2.  `67/68`\n    3.  `445`\n    4.  `389`\n\n5.  以下哪个标准端口由安全邮局协议\
  \ (`POP`) 使用？\n    1.  `110`\n    2.  `995`\n    3.  `993`\n    4.  `143`\n\n6.\
  \  以下哪种协议是无连接的，并用于流式传输视频或音频？\n    1.  `TCP`\n    2.  `RDP`\n    3.  `UDP`\n    4.\
  \  `TFTP`\n\n7.  以下哪个端口由可提供所有网络设备状态和报告的协议的安全版本使用？\n    1.  `161`\n    2.  `389`\n\
  \    3.  `110`\n    4.  `162`\n\n8.  以下哪种协议使用 `TCP ports 20/21` 并以明文传输数据？\n    1.\
  \  `TFTP`\n    2.  `FTP`\n    3.  `SSH`\n    4.  `FTPS`\n\n9.  以下哪些是 `HTTP` 和 `HTTPS`\
  \ 流量的默认端口？（选择两项）\n    1.  `23`\n    2.  `80`\n    3.  `110`\n    4.  `443`\n   \
  \ 5.  `445`\n\n10. `TCP` 是面向连接的，并使用三次握手。握手的正确顺序是什么？\n    1.  `SYN`, `ACK`, and `SYN-ACK`\n\
  \    2.  `SIGNAL`, `CONNECT`, `ACKNOWLEDGE`\n    3.  `SYN-ACK`, `ACK`, and `SYN`\n\
  \    4.  `SYN`, `SYN-ACK`, and `ACK`\n\n11. 系统管理员正在设置新防火墙，需要允许 `SMTP` 流量通过。必须为入站流量启用以下哪个\
  \ `TCP` 端口？\n    1.  `21`\n    2.  `22`\n    3.  `23`\n    4.  `25`\n\n12. 以下哪个标准端口由安全\
  \ `IMAP` 使用？\n    1.  `993`\n    2.  `110`\n    3.  `995`\n    4.  `143`\n\n13.\
  \ 以下哪项是不安全的远程访问协议，其密码可能被协议分析器窃取？\n    1.  `SSL`\n    2.  `SSH`\n    3.  `Telnet`\n\
  \    4.  `RDP`\n\n## 2.2 对比常见网络硬件\n\n`QTYPE: MCQ-MULTI_ANSWER`\n\n1.  初级网络管理员被要求识别配线架的正面和背面。以下哪项描述是正确的？（选择两项）\n\
