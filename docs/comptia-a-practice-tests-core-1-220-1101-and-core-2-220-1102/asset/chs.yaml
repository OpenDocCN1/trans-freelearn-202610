  `179.16.0.0 – 179.30.255.255` 和 `179.16.0.0 – 179.30.255.255` 是公网 IP 地址。`169.254.0.0
  – 169.254.255.255` 是自动专用 IP 寻址 (APIPA)，它是网络协议（如 IPv4）的一项功能，允许设备在 DHCP（动态主机配置协议）服务器不可用时自动为自己分配
  IP 地址。


  ### 50. 正确答案是 **C**。使用 APIPA 的设备将从范围 `169.254.0.0 - 169.254.255.255` 中为自己分配一个 IP
  地址，确保在本地网络内的临时连接。

