  \ 给定场景，使用适当的 Microsoft 命令行工具\n\n### 问题 1：工作站配置故障排除\n\n网络工程师必须排查企业网络的某个部分，市场部用户无法访问打印机、电子邮件或网站。网络基础设施设备似乎工作正常，因此工程师希望排除用户工作站配置错误作为导致问题的可能原因。哪个命令行工具能提供关于工作站配置的最佳信息？\n\
