  \n1.  设备管理器\n2.  系统\n3.  轻松使用中心\n4.  程序和功能\n\n### 5. 故障排除硬件驱动程序\n支持技术人员安装了一个新网络摄像头并从制造商网站下载了驱动程序，但网络摄像头无法按预期工作。以下哪个选项将**最好地**允许技术人员排查新安装硬件相关的问题？\n\
