  A 不正确，因为物理位置通常由 `IP address`（IP 地址）或 `network subnet`（网络子网）等属性决定。选项 B 不正确，因为安全策略是在域级别或组级别定义的，而不是在
  OU 级别。选项 D 不正确，因为 `domain name resolution`（域名解析）服务由 `Domain Name System (DNS)`（域名系统）提供，而不是由
  OU 提供。


  ## 8.2 比较和对比无线安全协议和认证方法


  ### 1.

  正确答案是 **B**。`Wi-Fi Protected Access 3 (WPA3)` 使用一种称为 `Simultaneous Authentication
  of Equals (SAE)`（对等实体同时认证）的安全握手过程。这取代了之前称为 `Preshared Key (PSK)`（预共享密钥）的方法。`WPA2`
  使用基于 PSK 的旧安全标准。`Temporal Key Integrity Protocol (TKIP)`（临时密钥完整性协议）旨在在使用 `WPA` 和
  `RC4` 加密时提高安全性。`Advanced Encryption Standard (AES)`（高级加密标准）是用于保护无线数据的默认加密强度。


  ### 2.

  正确答案是 **C**。`Remote Authentication Dial-In User Service (RADIUS)`（远程认证拨号用户服务）也称为
  `Authentication, Authorization, and Accounting (AAA)`（认证、授权和计费）服务。`RADIUS` 服务器允许
  `Wi-Fi` 控制器转发来自客户端设备的认证请求。这些认证请求随后将被转发到目录服务。`WPS` 允许设备与 `Wi-Fi` 路由器配对，无需共享密钥或密码。`WEP
  Open` 不需要账户或密码（任何人都可以连接）。`WPA-PSK` 不使用 `Active Directory` 账户。


  ### 3.

  正确答案是 **C**。`WPA2-AES` 提供最高级别的安全性。它使用 `AES 128-bit` 加密。`Wired Equivalent Privacy
  (WEP)`（有线等效保密）在 `WPA` 之前使用，现已不再使用。它已有 20 多年历史，关键在于它不安全。`WPA2-TKIP` 使用较旧的 `RC4` 加密算法。`Open
  Wi-Fi`（开放 Wi-Fi）网络不使用加密。


  ## 8.3 给定场景，使用适当的工具和方法检测、移除和预防恶意软件


  ### 1.

  正确答案是 **B**。`Boot sector viruses`（引导扇区病毒）感染计算机系统硬盘的 `Master Boot Record (MBR)`（主引导记录）或引导扇区。当受感染的计算机启动时，病毒变为活动状态并可传播到系统的其他部分。选项
  A 不正确，因为这种类型的驱动器不用于引导 `OS`（操作系统）。选项 C `network routers and switches`（网络路由器和交换机）不是引导扇区病毒的攻击目标。选项
  D 更可能与社会工程学或密码攻击相关。


  ### 2.

  正确答案是 **D**。`Keyloggers`（键盘记录器）能够记录用户在目标系统上敲击的每一个按键。攻击者利用它窃取登录凭据、敏感信息和支付卡号。选项 A、B
  和 C 描述的是其他类型的恶意软件或攻击，因此它们是不正确的。


  ### 3.

  正确答案是 **C**。`Ransomware`（勒索软件）是一种加密受害者数据文件使其无法访问的恶意软件。随后会勒索付款以换取解密密钥。选项 A、B 和 D
  描述的是其他类型的攻击，因此它们是不正确的。


  ### 4.

  正确答案是 **B**。`Rootkit`（Rootkit）会替换受权的 `OS` 可执行文件，从而能够阻止和干扰 `OS` 进程。当使用特权账户配置 `OS`
  功能或服务时，Rootkit 可以覆盖这些操作。选项 A `Trojan`（特洛伊木马）通常不专注于像场景描述那样操纵或反转系统设置。虽然选项 C `Viruses`（病毒）会对计算机系统造成损害，包括干扰其正常运行，但它通常不以
  `Windows Defender` 等安全设置为目标。病毒倾向于专注于复制和传播。虽然选项 D `Spyware`（间谍软件）可以禁用安全功能以便于其隐蔽活动，但间谍软件的主要目标是数据收集，而不是主动操纵系统设置。选项
  E `Ransomware`（勒索软件）更关注加密文件并向受害者勒索钱财。


  ### 5.

  正确答案是 **B**。`Rootkits`（Rootkit）难以移除，因为它们会替换关键系统文件并阻止移除恶意文件的尝试。完全擦除硬盘可确保不留下恶意文件。`Trojans`（特洛伊木马）、`Viruses`（病毒）和
  `Spyware`（间谍软件）不需要擦除并重装 `OS` 驱动器。有效的反恶意软件套件应能检测并移除这些恶意文件和进程。


  ### 6.

  正确答案是 **E**。`Ransomware`（勒索软件）要求支付费用以访问数据。勒索软件通常强迫用户或组织付款，因为重要的个人或业务数据已被攻击者加密。`Trojan`（特洛伊木马）随有用应用程序一起安装，隐藏在应用程序内部。`Rootkit`（Rootkit）会替换受权的
  `OS` 可执行文件，从而能够阻止和干扰 `OS` 进程。`Virus`（病毒）是通常由用户点击电子邮件附件引入的恶意软件。`Spyware`（间谍软件）将在后台运行，窃取用户信息，包括密码。


  ### 7.

  正确答案是 **C**。由于未提及特定的恶意软件类型，最佳方法是推广用户安全意识培训以涵盖广泛的威胁。所有其他选项仅涵盖特定的单一威胁类型。


  ### 8.

  正确答案是 **B**。由于 `web browser`（Web 浏览器）是事件源头且有权访问网站，因此确保该活动非恶意是合理的。如果活动无害，则 `anti-virus`（防病毒）扫描可以确认这一点。禁用
  Web 浏览器将造成极大干扰且无法解决问题。阻止 `ports 80 and 443`（端口 80 和 443）将造成极大干扰，因为所有 Web 流量均被阻断。重装
  `OS`（操作系统）干扰极大，仅应作为最后手段使用。






  ## 8.3 练习题（续：9–12）


  ### 9. 答案：**B**

  正确答案是 **B**。电子邮件中发送的链接属于网络钓鱼攻击。在这种情况下，专门针对这类攻击的特定培训是最佳解决方案。防火墙不会阻止嵌入在电子邮件中的内容。关于常见威胁的用户教育不如专门针对网络钓鱼攻击的培训有效。`OS`
  重装不是一个选项，因为 `OS` 并未被攻破。


  ### 10. 答案：**A**

  正确答案是 **A**。`Windows 安全模式` 将允许系统使用最少的一组驱动程序启动。如果新安装的视频驱动程序已损坏或出现故障，则 `Windows 安全模式`
  应能启动进入稳定的桌面环境。使用最新定义文件的防病毒扫描可能会揭示是否存在恶意代码。然而，在这种情况下，驱动程序损坏或不兼容的可能性存在。`Windows 防火墙`
  可用于阻止传入和传出的网络连接，但无法验证驱动程序是否稳定。


  ### 11. 答案：**C**

  正确答案是 **C**。由于受损账户与特定数量的工作站相关联，硬件可能是攻击载体。由于账户密码已重置，这将无效，因为 `键盘记录器` 会泄露新密码。`远程访问木马`
  将允许攻击者保持对工作站的 `命令与控制` 访问，并可用于窃取信息。`Rootkit` 旨在拦截对系统服务的调用。`加密货币挖矿程序` 使用 `CPU`/`GPU`
  周期来挖掘加密货币。


  ### 12. 答案：**B**

  正确答案是 **B**。恶意 `加密货币挖矿程序` 可能通过 Web 浏览器或作为移动应用下载。该软件会窃取计算机资源以生成新的加密货币。这将针对高级显卡上的中央处理器
  (`CPU`) 和图形处理器 (`GPU`)。`间谍软件` 用于收集用户或组织的私人信息。它可能会降低计算机速度，但不会专门针对 `CPU`/`GPU`。`键盘记录器`
  将记录所有输入的按键并将它们存储在日志文件中。`引导扇区病毒` 将替换 `OS` 引导文件，在引导过程中启动恶意软件。


  ## 8.4 解释常见的社会工程学攻击、威胁和漏洞


  ### 1. 答案：**D**

  正确答案是 **D**。当单个个体被锁定目标且该个体担任高级管理职位时，他们被视为“大鱼”。因此，`鲸钓攻击` 基于 `网络钓鱼`，但它是针对大鱼（担任高级职位的用户）的定向攻击。在这种情况下
  `网络钓鱼` 不正确。选项 B 指从垃圾桶或垃圾罐中窃取可能包含有用情报的文档 (`翻垃圾桶`)。选项 C 指某人试目睹用户输入密码或 `PIN` 码 (`肩窥`)。


  ### 2. 答案：**C**

  正确答案是 **C**。`肩窥` 很可能发生在拥挤的空间，当时攻击者可以近距离观察用户输入密码。选项 A 和 D 通常使用电子邮件链接强迫用户共享机密数据 (`网络钓鱼`/`短信钓鱼`)。选项
  B 指从语音通话中获取信息 (`语音钓鱼`)。


  ### 3. 答案：**B**

  正确答案是 **B**。由于承包商未通知就到达，这可能构成威胁。在这种情况下，他们通过穿着使其看起来像真正的支持承包商的服装来进行 `冒充`。选项 A 是指未经授权的人紧跟在有效用户后面，通过物理控制（如由
  `RFID` 门禁卡控制的锁门）进入 (`尾随`)。选项 C 指从垃圾桶窃取文档 (`翻垃圾桶`)。选项 D 指放置恶意 `Wi-Fi` 接入点 (`邪恶双子`/`流氓接入点`)。


  ### 4. 答案：**D**

  正确答案是 **D**。`邪恶双子` 指一种欺骗性的恶意无线网络，旨在模仿合法网络。它本质上是一个 `流氓接入点`，看起来像受信任的 `Wi-Fi` 网络，但由攻击者建立，意图拦截敏感信息或进行其他恶意活动。由于该接入点未连接到合法的受信任网络，`映射驱动器`
  和 `共享打印机` 将无法访问。选项 A、B 和 C 是其他社会工程学攻击的示例。


  ### 5. 答案：**A**

  正确答案是 **A**。`尾随` 是指未经授权的人假装成员工、送货员或访客，试图通过紧跟授权员工通过受控访问点（如带门禁卡的门或安检站）进入安全区域。选项 B、C
  和 D 是其他类型的社会工程学。


  ### 6. 答案：**A**

  正确答案是 **A**。在 `DDoS` 攻击中，目标网络或系统变得过载，无法处理合法用户请求，从而有效地拒绝为合法用户提供服务。`DDoS` 攻击可能涉及数千个连接。`僵尸网络`
  可用于生成大量流量。选项 B 不涉及数千个连接，因为 `DoS` 可能由单个恶意主机创建。选项 C 指没有补救措施或补丁的漏洞 (`零日漏洞`)。选项 D 涉及攻击者伪造另一真实主机的电子邮件地址、`IP`
  地址或 `MAC` 地址 (`欺骗`)。


  ### 7. 答案：**A**

  正确答案是 **A**。`中间人攻击` 指一种网络攻击，攻击者获得控制权或将自己插入两个网络实体之间的通信路径中。这使他们能够拦截、修改或阻断在这些实体之间流动的网络流量，从而窃听敏感信息、操纵数据或中断通信。这种攻击也称为
  `中间人攻击` (`MiTM`)。选项 B 指为组织工作、怀有恶意或培训不足从而构成威胁的用户 (`内部威胁`)。选项 C 和 D 用于攻击者针对 `Web 应用服务器`
  上传脚本或操纵 `数据库服务器` 时（通常试图未经授权访问系统）。


  ### 8. 答案：**C**

  正确答案是 **C**。`XSS` 攻击的主要目标是操纵网站内容并与用户会话交互。如果脚本可以上传到 `Web 服务器`，则其他用户在使用 `浏览器` 访问该网站时将自动运行该脚本。恶意载荷通过尖括号
  `<>` 来识别。选项 A 涉及使用伪造的网络身份 (`欺骗`)。选项 B 将使用 `SQL` 语言特有的不同语法 (`SQL 注入`)。`零日攻击` 描述的是没有可用补丁的漏洞。


  ### 9. 答案：**D**

  正确答案是 **D**。`零日攻击` 用于描述没有可用补丁的漏洞。选项 A、B 和 C 在本章的其他问题中有描述。


