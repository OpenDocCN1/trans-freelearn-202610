  \n## 72. 正确答案：**C**\n\n物理销毁包含敏感信息的 SSD 的最佳方法是粉碎。粉碎涉及使用专用设备将 SSD 物理粉碎成微小碎片，使数据完全无法恢复。这种方法确保了最高级别的数据销毁，并降低了未经授权访问或数据恢复尝试的风险。这是处理敏感信息并需要遵守数据隐私法规的组织的推荐做法。\n\
  \n选项 A，覆写，是通过用随机或预定义模式覆写存储设备上的数据来安全擦除数据的方法。虽然覆写对传统硬盘可能有效，但对 SSD 并不那么可靠，因为 SSD 采用磨损均衡和其他技术，使得难以确保彻底清除数据。选项\
