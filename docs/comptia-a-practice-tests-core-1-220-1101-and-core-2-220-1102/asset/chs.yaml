  \ `通行密钥` 打印在销售小票上，以便客户可以访问免费 `Wi-Fi`。技术人员受命保护网络安全，以便只有合法客户能够安全地使用该网络。哪项安全设置最符合这些要求？\n\
  \n    1. 启用 `WPA3-SAE`\n    2. 启用 `WEP-PSK`\n    3. 启用 `WPA2-TKIP`\n    4. 启用 `WPA2-AES`\n\
  \n## 8.10 给定场景，安装和配置浏览器及相关安全设置\n\n1. 一名技术人员正在建议一位需要协助安装 Web 浏览器的客户。为便于使用，用户倾向于下载并安装一个随默认操作系统未预装的浏览器。技术人员可以向用户提供哪两条建议以确保安全安装？\n\
  \n    1. 确保从可信来源下载浏览器\n    2. 下载后，检查文件大小是否与供应商网站上的文件大小相同\n    3. 确保下载带有密码管理器的浏览器\n\
  \    4. 下载后，检查 `哈希值` 是否与供应商网站上发布的值相同\n\n2. 一家公司希望允许用户查看未自动翻译成用户母语的网站。目前，用户抱怨需要将内容复制粘贴到文字处理应用程序中进行翻译。公司可以做些什么来最好地帮助用户？\n\
  \n    1. 添加 `语言翻译器` 作为 `浏览器扩展`\n    2. 安装支持语言翻译的新浏览器\n    3. 确保浏览器支持 `HTML5`\n \
  \   4. 在 `Windows 设置菜单` 中添加对其他语言的支持\n\n3. 一名服务台操作员被分配了一张由用户提交的支持工单，用户抱怨网页加载时间过长，且页面内似乎显示了大量广告内容。什么将是加快用户浏览器显示网页速度的最佳解决方案？\n\
  \n    1. 启用 `弹出窗口拦截器`\n    2. 清除 `浏览数据缓存`\n    3. 启用 `隐私浏览模式`\n    4. 启用 `广告拦截器`\n\
  \n4. 一位客户询问支持技术人员如何确定银行网站值得信任。他们被告知可以制作模仿真实网站的假冒网站。什么能确保网站值得信任？\n\n    1. 使用 `HTTPS`\
  \ 连接时，网站将显示 `挂锁` 图标\n    2. 使用 `HTTP` 连接时，确保存在 `受信任证书`\n    3. 使用 `HTTPS` 连接时，网站将显示\
  \ `安全评级`\n    4. 确保始终使用 `隐私浏览模式` 进行连接\n"
- "# 9 软件故障排除\n\n## 简介\n\n为了成功通过 A+ 认证考试，考生必须了解用于执行有效软件故障排除的最佳实践方法。\n\n在排查桌面环境故障时，对\
  \ Windows 操作系统有扎实的理解是关键要求。技术人员必须能够解读系统消息，并使用正确的技术响应常见错误和事件。台式计算机仍然是现代办公环境的主力，在支持这些平台上的用户时，应遵循正确的故障排除方法。\n\
  \n技术人员必须了解正确的主动方法，以确保系统保持优化且无恶意软件。这包括及时部署操作系统补丁和操作系统更新。\n\n对移动操作系统上支持软件应用程序的透彻理解也非常重要。\n\
  \n为了在 CompTIA A+ Core 2 (220-1102) 认证考试中取得成功，考生必须确保熟悉以下目标：\n\n*   9.1 给定场景，排查常见\
  \ Windows 操作系统问题\n*   9.2 给定场景，排查常见个人计算机 (PC) 安全问题\n*   9.3 给定场景，使用恶意软件清除的最佳实践程序\n\
  *   9.4 给定场景，排查常见移动操作系统和应用程序问题\n*   9.5 给定场景，排查常见移动操作系统和应用程序安全问题\n\n本章其余部分致力于实践。对于前面定义的每个概念，您将获得一系列问题，旨在测试您对官方认证考试指南中定义的每个核心二代目标的了解。这些问题将评估考生关于如何支持和排查软件应用程序故障的知识。\n\
  \n## 9.1 给定场景，排查常见 Windows 操作系统问题\n\n1. 以下哪项是 Windows 中 `BSOD` (蓝屏死机) 错误的常见原因？\n\
  \n    1. 过时的 `设备驱动程序`\n    2. 超频的 `CPU`\n    3. 磁盘空间不足\n    4. 不正确的 `BIOS 设置`\n\n\
  2. 以下哪项操作有助于解决由故障 `RAM` 引起的 `BSOD` 错误？\n\n    1. 清洁计算机的 `散热风扇`\n    2. 更新 `防病毒软件`\n\
  \    3. 更换 `RAM 模块`\n    4. 重新安装 `操作系统`\n\n3. `BSOD` 上显示的 `STOP 错误代码` 的目的是什么？\n\n\
  \    1. 指示错误的 `严重程度`\n    2. 识别错误的具体 `原因`\n    3. 告知用户可用的 `系统更新`\n\n\n\n\n\n## 9.1\
  \ 排查常见操作系统问题（第 4-21 题）\n\n### 第 4 题\n提供数据恢复说明\n\n### 第 5 题\n用户提交支持工单，称其 Windows\
  \ 计算机在使用几分钟后持续关机，且未显示任何错误消息。以下哪项是导致此问题**最可能**的原因？\n\n1.  电源故障\n2.  过热\n3.  病毒或恶意软件感染\n\
  4.  主板故障\n\n### 第 6 题\n用户致电服务台，称遇到一个错误，提示某 Windows 服务未启动。以下哪项是 Windows 服务无法启动的**最可能**原因？\n\
  \n1.  磁盘空间不足\n2.  设备驱动程序过时\n3.  服务配置不正确\n4.  软件安装不兼容\n\n### 第 7 题\n技术人员正在响应用户支持工单。用户遇到与内存可用性低相关的错误消息。以下哪些操作有助于解决\
  \ Windows 中的低内存警告？（选择两项。）\n\n1.  关闭不必要的应用程序\n2.  删除临时文件\n3.  向系统添加更多 RAM\n4.  升级处理器\n\
  \n### 第 8 题\n以下哪项警告**最可能**表明 Windows 计算机存在系统不稳定？\n\n1.  `The system has detected\
  \ a critical error and will shut down in 1 minute.`\n2.  `Your anti-virus software\
  \ has expired. Please renew your subscription.`\n3.  `A new update is available\
  \ for your web browser. Click here to install.`\n4.  `Low disk space. Free up some\
  \ space to optimize system performance.`\n\n### 第 9 题\n技术人员正在排查一台 Windows 台式计算机，该计算机在启动期间显示错误消息\
  \ `No OS found`。最可能的原因是什么？\n\n1.  Windows 操作系统丢失或损坏\n2.  硬盘未正确连接或已损坏\n3.  计算机的 BIOS\
  \ 设置不正确\n4.  计算机感染了病毒\n\n### 第 10 题\n用户报告登录 Windows 计算机时配置文件加载缓慢。以下哪项可能是原因？\n\n\
  1.  系统资源不足\n2.  用户配置文件损坏\n3.  网络连接问题\n4.  设备驱动程序过时\n\n### 第 11 题\n以下哪些因素可能导致 Windows\
  \ 中的时间漂移问题？\n\n1.  时区设置不正确\n2.  恶意软件感染\n3.  硬件时钟故障\n4.  断电\n\n### 第 12 题\n应使用以下哪种方法通过\
  \ Windows 服务管理控制台重启服务？\n\n1.  右键单击服务，选择“停止”，然后选择“启动”\n2.  右键单击服务，选择“重新启动”\n3.  双击服务，从工具栏中选择“重新启动”\n\
  4.  右键单击服务，选择“暂停”，然后选择“继续”\n\n### 第 13 题\n关于重启对无响应应用程序的影响，以下哪项陈述是正确的？\n\n1.  重启系统会将所有正在运行的应用程序重置为默认配置设置\n\
  2.  重启系统对无响应的应用程序没有影响\n3.  重启系统**可能会强制关闭**无响应的应用程序\n4.  重启系统会自动修复无响应应用程序的任何问题\n\n\
  ### 第 14 题\n如果应用程序启动后立即崩溃，应首先检查什么？\n\n1.  应用程序的系统要求\n2.  计算机上的可用磁盘空间\n3.  杀毒软件设置\n\
  4.  兼容性模式设置\n\n### 第 15 题\n在最近的操作系统更新后，用户的计算机无法启动并显示 `boot device not found` 错误消息。以下哪项是导致故障的**最可能**原因？\n\
  \n1.  引导加载程序损坏\n2.  CPU 过热\n3.  硬盘空间不足\n4.  BIOS 设置不正确\n\n### 第 16 题\n用户的计算机在安装新的杀毒软件后频繁出现蓝屏死机\
  \ (BSOD) 错误。为排查该问题，应采取以下哪项操作？\n\n1.  卸载杀毒软件\n2.  升级计算机的 RAM\n3.  重新安装操作系统\n4.  更换显卡\n\
  \n### 第 17 题\n用户的计算机反复提示安装最新的操作系统更新，但在安装过程中遇到错误。可采取以下哪些步骤来解决操作系统更新失败的问题？\n\n1. \
  \ 清除临时文件并重试更新\n2.  安装不同的 Web 浏览器\n3.  升级计算机的电源\n4.  提高屏幕分辨率\n\n### 第 18 题\n如果技术人员需要回滚不成功的更新，执行以下哪项操作很重要？\n\
  \n1.  重新安装最新更新\n2.  禁用自动更新\n3.  创建系统还原点\n4.  增加系统资源\n\n### 第 19 题\n当 Windows 计算机无法启动并显示蓝屏死机\
  \ (BSOD) 时，技术人员应采取什么排查步骤？\n\n1.  重启计算机并再次尝试\n2.  使用系统还原回滚到之前的正常工作状态\n3.  重新安装所有第三方应用程序\n\
  4.  更新计算机的 BIOS\n\n### 第 20 题\n计算机技术人员应在何时考虑运行 Windows 系统文件检查器？\n\n1.  遇到硬件驱动程序问题时\n\
  2.  安装新软件更新后\n3.  遇到频繁的应用程序崩溃时\n4.  执行磁盘碎片整理前\n\n### 第 21 题\n在命令提示符中用于启动 Windows\
  \ 系统文件检查器的命令是什么？\n\n1.  `sfc /scanfile`\n2.  `sfc /verifyonly`\n3.  `sfc /scannow`\n\
  4.  `sfc /restorehealth`\n\n### 第 22 题\n技术人员何时可能考虑使用 Windows 重置映像作为排查步骤？\n\n1. \
  \ 当特定软件应用程序无法正常启动时\n2.  当计算机的互联网连接不稳定时\n3.  当计算机频繁崩溃并出现蓝屏错误时\n4.  当需要调整计算机的显示分辨率时\n\
  \n## 9.2 给定场景，排查常见个人计算机 (PC) 安全问题\n\n### 第 1 题\n用户无法从其个人计算机 (PC) 访问网络。服务台技术人员应采取以下哪项步骤来排查此问题？\n\
  \n1.  检查物理网络连接和线缆\n2.  更新杀毒软件\n3.  重新安装操作系统 (OS)\n4.  增加 PC 的 RAM\n\n### 第 2 题\n\
  用户频繁收到桌面警报，警告潜在的安全威胁，但这些警报均为误报。技术人员应采取以下哪项步骤来解决此问题？\n\n1.  更新杀毒软件\n2.  调整防火墙设置\n\
  3.  使用杀毒程序运行全面系统扫描\n4.  将误报文件从杀毒扫描中排除\n\n### 第 3 题\n用户报告其 PC 上的个人文件被篡改、丢失或重命名。以下哪项安全问题**最可能**导致此情况？\n\
  \n1.  网络钓鱼攻击\n2.  勒索软件感染\n3.  Rootkit 安装\n4.  网络入侵者未经授权的访问\n\n### 第 4 题\n用户提交服务工单，称在其\
  \ PC 的操作系统 (OS) 中遇到不需要的通知。技术人员应采取以下哪项步骤来排查此问题？\n\n1.  禁用启动程序\n2.  更新 BIOS\n3.  重新安装操作系统\n\
  4.  使用注册表清理工具清理注册表\n\n### 第 5 题\n用户在尝试为其 PC 安装操作系统 (OS) 更新时遇到失败。技术人员应采取以下哪项步骤来解决此问题？\n\
  \n1.  暂时禁用杀毒软件\n2.  重启 PC 并尝试再次安装更新\n3.  从头重新安装操作系统\n\n\n\n\n\n## 9.2 浏览器相关症状故障排除\n\
  \n4. 清除浏览器缓存并重试。\n\n6. 以下哪种浏览器相关症状通常与广告软件或恶意软件感染有关？\n\n    1. 随机/频繁弹窗\n    2. 证书警告\n\
  \    3. 重定向\n    4. 网速变慢\n\n7. 访问安全网站时反复收到证书警告，最可能的原因是什么？\n\n    1. 浏览器过时\n    2.\
  \ 防火墙阻止安全连接\n    3. 安全证书过期\n    4. DNS 缓存投毒\n\n8. 哪种浏览器相关症状通常与浏览器劫持有关？\n\n    1.\
  \ 随机/频繁弹窗\n    2. 证书警告\n    3. 重定向\n    4. 网速变慢\n\n## 9.3 给定场景，使用恶意软件清除的最佳实践程序\n\
  \n### 1. 恶意软件清除最佳实践程序\n用户的计算机运行缓慢、频繁弹出广告并意外重启。经调查，你怀疑存在恶意软件。从计算机中清除恶意软件的最佳实践程序是什么？\n\
  \n    1. 将计算机从网络断开，使用更新的反恶意软件执行全系统扫描，并清除检测到的任何恶意软件\n    2. 从计算机手动删除可疑文件和文件夹，然后重启以检查是否有进一步问题\n\
  \    3. 重新安装操作系统以确保彻底清除所有恶意软件\n    4. 忽略该问题，因为它可能只是系统的暂时故障\n\n### 2. 更新反恶意软件的推荐做法\n\
  以下哪项是更新反恶意软件的推荐做法？\n\n    1. 禁用自动更新以防止在重要任务期间中断\n    2. 仅在操作系统提示时手动更新软件\n    3.\
  \ 将软件配置为自动且定期更新\n    4. 卸载并重新安装软件以确保安装了最新版本\n\n### 3. 调查恶意软件症状的重要性\n为什么在进行清除过程之前调查和验证恶意软件症状很重要？\n\
  \n    1. 有助于确定恶意软件清除过程的成本\n    2. 允许更准确地识别并选择适当的清除技术。\n    3. 有助于估算清除恶意软件所需的时间\n\
  \    4. 确保最终用户了解恶意软件的潜在风险\n\n### 4. 预防未来恶意软件感染的最佳实践\n技术人员必须遵循最佳实践程序以**最好地**预防未来的恶意软件感染。应遵循哪项最佳实践？\n\
  \n    1. 定期更新防病毒软件\n    2. 禁用系统的用户账户控制 (UAC) 功能\n    3. 与受信任的同事共享用户凭据\n    4. 默认启用所有浏览器扩展和插件\n\
  \n### 5. 隔离受感染系统的目的\n为什么在恶意软件清除过程中需要隔离受感染的系统？\n\n    1. 防止恶意软件传播到其他系统\n    2. 在\
  \ Windows 中禁用系统还原\n    3. 为将来创建还原点\n    4. 安排扫描并运行更新\n\n### 6. 禁用系统还原的目的\n在恶意软件清除期间在\
  \ Windows 中禁用系统还原的目的是什么？\n\n    1. 防止恶意软件传播到其他系统\n    2. 删除任何受感染的还原点\n    3. 确保恶意软件在清除后无法再次感染系统\n\
  \    4. 加快恶意软件清除过程\n\n### 7. 禁用系统还原的效果\n在恶意软件清除期间禁用系统还原会发生什么？\n\n    1. 恶意软件立即从系统中删除\n\
  \    2. 所有现有的还原点被删除\n    3. 恶意软件被隔离并阻止执行\n    4. 系统对进一步的恶意软件感染免疫\n\n### 8. 最终用户教育的重要性\n\
  为什么在恶意软件清除过程中教育最终用户很重要？\n\n    1. 将恶意软件清除的责任转移给最终用户\n    2. 提高最终用户的技术技能\n    3.\
  \ 最大限度地降低再次感染的风险并预防未来的恶意软件事件\n    4. 在最终用户中制造恐慌和紧迫感\n\n### 9. 教育最终用户的益处\n以下哪项是教育最终用户了解恶意软件清除的潜在益处？\n\
  \n    1. 用户生产力下降\n    2. 对 IT 支持的依赖增加\n    3. 事件响应时间改善\n    4. 数据泄露的可能性增加\n\n###\
  \ 10. 忽视最终用户教育的后果\n忽视教育最终用户了解恶意软件清除的一个潜在后果是什么？\n\n    1. IT 预算分配增加\n    2. 系统性能下降\n\
  \    3. 成功的恶意软件攻击发生率更高\n    4. 网络带宽减少\n\n## 9.4 给定场景，排查常见移动操作系统和应用程序问题\n\n### 1.\
  \ 智能手机电池耗尽原因\nSara 的智能手机电池耗电很快，即使她没有大量使用。以下哪项可能是导致该问题的原因？\n\n    1. 后台应用刷新\n   \
  \ 2. 屏幕亮度低\n    3. 移动数据使用\n    4. 设备过度充电\n\n### 2. AirDrop 描述\nDavid 正准备使用 AirDrop\
