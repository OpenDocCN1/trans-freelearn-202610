  \n## 7.7 给定场景，应用应用程序安装和配置概念\n\n### 1. 内存升级建议\n一名技术人员正在支持一位使用 `Windows 10` `x86`\
  \ 计算机（`4GB` `RAM`）的客户。客户需要将可用内存增加到 `16GB RAM` 以安装一款工程应用程序。技术人员应向客户推荐什么以满足此要求？\n\n\
  1.  安装 `Ubuntu Linux`\n2.  安装更大容量的 `SSD`\n3.  使用 `64 位架构`\n4.  安装 `16GB DDR4 RAM`\n\
  \n### 2. CAD 应用性能优化\n工程设计团队的几名成员因使用计算机辅助设计（`CAD`）应用程序时出现延迟问题和性能不佳而提交了服务工单。对工作站的硬件扫描显示如下：\n\
  \n*   `64GB DDR4 内存`\n*   `2GB 集成显卡`\n*   `1TB SSD HDD`\n*   `Intel XEON 3.4GHZ\
  \ 16 核 CPU`\n\n工程师们可以做出什么改变，在使用 `CAD` 应用程序时获益最大？\n\n1.  增加内存\n2.  安装独立显卡\n3.  安装更快的\
  \ `CPU`\n4.  安装更快的 `HDD`\n\n### 3. 32 位应用在 64 位系统上的限制\n市场团队在其 `32 位` `Windows 8.1`\
  \ 工作站上使用客户关系管理（`CRM`）系统。将工作站升级到 `Windows 11` `64 位` 版本后，团队希望继续使用相同的 `CRM` 应用程序。在\
  \ `64 位` 操作系统上使用 `32 位` 应用程序时，他们将遇到以下哪种限制？\n\n1.  `32 位` 应用程序将被限制为 `32GB` `RAM`\n\
  2.  `32 位` 应用程序不支持多线程\n3.  `32 位` 应用程序将被限制为 `4GB` `RAM`\n4.  `32 位` 应用程序不支持多任务\n\
  \n### 4. 应用兼容性快速修复\n在将客户的 `Windows 8` 操作系统升级到 `Windows 10` 后，某应用程序无法启动。系统显示一条错误消息，指出该应用程序是为\
  \ `Windows 8` 编写的，与当前操作系统不兼容。支持技术人员可以提供什么作为该问题的快速修复？\n\n1.  联系应用程序供应商，调查是否可以购买更新版本\n\
  2.  将应用程序兼容性设置为 `Windows 8`\n3.  将 `Windows` 启动进入安全模式以运行该应用程序\n4.  将应用程序兼容性设置为 `Windows\
  \ 7`\n\n### 5. 保护 CAD 应用免遭盗版\n一家软件开发公司花费巨资设计了一款计算机辅助设计（`CAD`）应用程序。他们需要一种控制措施，以确保应用程序的每个副本仅在获得许可的工作站上运行。保护应用程序免遭盗版的**最有效**方法是什么？\n\
  \n1.  要求每位客户在安装期间同意严格的许可要求\n2.  为应用程序的每个副本部署外部硬件令牌\n3.  要求每位客户签署可接受使用策略（`AUP`）\n\
  4.  仅向值得信赖的客户销售应用程序\n\n## 7.8 解释常见操作系统类型及其用途\n\n### 1. 跨平台 U 盘文件系统选择\n一名工程师需要格式化一个\
  \ `USB` 存储设备，以准备将 `20GB` 数据从 `Ubuntu Linux` 服务器复制到 `Windows` 系统。工程师**最可能**使用以下哪种文件系统？\n\
  \n1.  `FAT32`\n2.  `ext4`\n3.  `NTFS`\n4.  `exFAT`\n\n### 2. 终止生命周期操作系统\n最近的风险评估凸显了一个安全问题：旧设备嵌入了\
  \ `32 位` 版 `Windows XP` 作为其操作系统。公司不再为此操作系统接收任何质量或安全更新。哪个术语**最能**描述此操作系统？\n\n1. \
  \ 生命周期结束（`EOL`）\n2.  不兼容的操作系统\n3.  `32 位` 操作系统\n4.  供商支持的操作系统\n\n### 3. 学生工作站操作系统选择\n\
  一所学校希望投资易于支持的学生工作站技术。选定的设备将运行基于浏览器界面的轻量级操作系统。满足这些要求的**最佳**选择是什么？\n\n1.  `Linux`\n\
  2.  `macOS`\n3.  `ChromeOS`\n4.  `Windows`\n\n### 4. 统一操作系统平台\n一家公司希望在最近的库存评估报告称服务器、工作站和移动设备使用了四种不同的操作系统后，简化其客户支持。更复杂的是，还有五种不同版本的\
  \ `Android OS` 和三种不同版本的 `iOS` 在使用。公司希望选择单一操作系统来支持服务器、工作站和手持设备。以下哪项是**最佳**选择？\n\n\
  1.  `Linux`\n2.  `iOS`\n3.  `Windows`\n4.  `ChromeOS`\n\n### 5. 大容量存储文件系统选择\n在数据中心服务器上安装最新版\
  \ `Red Hat Linux` 后，添加了额外存储。新硬盘必须使用支持 `40TB` 存储的文件系统进行格式化，并且预计需要定期进行碎片整理。以下哪项是**最佳**文件系统选择？\n\
  \n1.  `FAT32`\n2.  `ext3`\n3.  `NTFS`\n4.  `ext4`\n\n### 6. 基于 Linux 的智能手机操作系统\n\
  一家营销公司希望为其员工部署智能手机。智能手机必须支持基于 `Linux` 的操作系统，因为开发人员将为公司创建应用程序，并具有 `Linux` 操作系统经验。以下哪种操作系统是**最佳**选择？\n\
  \n1.  `iOS`\n2.  `SUSE Linux`\n3.  `Android OS`\n4.  `Windows Mobile`\n\n## 7.9\
  \ 给定场景，在多样化操作系统环境中执行操作系统安装和升级\n\n### 1. 网络启动升级方式\n一名支持工程师的任务是将多台台式机升级到 `Windows\
  \ 10`。然而，他们只能获得一份安装介质副本，因此提议通过网络执行升级。以下哪种启动方法允许这种升级？\n\n1.  `SSD`\n2.  光驱\n3.  U\
