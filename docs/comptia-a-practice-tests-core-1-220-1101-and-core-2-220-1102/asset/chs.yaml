  正确答案是 **B, C**。`Voice call verification`（语音通话验证）要求用户接听来自电话（包括手机）的呼叫，而 `SMS`（短信）要求用户验证发送到其移动设备的代码。`email
  verification`（电子邮件验证）链接无需访问手机即可接收。`hard token`（硬件令牌）指特定的安全设备，例如 `USB security key`（USB
  安全密钥）或 `RSA key fob`（RSA 密钥扣）。


