  3.  `Keychain`（钥匙串）\n4.  `Dock`（程序坞）\n\n### 问题 8\n技术人员被要求卸载管理人员 `MacBook Pro` 上不再使用的大型应用程序。他们如何卸载该应用程序？\n\
