  \n## 70. 正确答案：**C**\n\n为了排查第三方 USB 适配器的连接问题，技术人员应使用 `devmgmt.msc` 工具。`devmgmt.msc`\
  \ 也称为设备管理器，允许技术人员查看和管理连接到计算机的硬件设备。通过打开设备管理器，技术人员可以验证 USB 适配器是否被系统识别，并检查是否存在任何相关的驱动程序问题。然后他们可以继续更新或重装适当的驱动程序，确保兼容性并解决任何连接问题。\n\
