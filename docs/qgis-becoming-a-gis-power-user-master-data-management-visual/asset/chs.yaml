  \    <option value=\"15\">2013-06-15</option>\n    <option value=\"16\">2013-06-16</option>\n\
  \    <option value=\"17\">2013-06-17</option>\n    <option value=\"18\">2013-06-18</option>\n\
  \    <option value=\"19\">2013-06-19</option>\n    <option value=\"20\">2013-06-20</option>\n\
  \    <option value=\"21\">2013-06-21</option>\n    <option value=\"22\">2013-06-22</option>\n\
  \    <option value=\"23\">2013-06-23</option>\n    <option value=\"24\">2013-06-24</option>\n\
  \    <option value=\"25\">2013-06-25</option>\n    <option value=\"26\">2013-06-26</option>\n\
  \    <option value=\"27\">2013-06-27</option>\n    <option value=\"28\">2013-06-28</option>\n\
  \    <option value=\"29\">2013-06-29</option>\n    <option value=\"30\">2013-06-30</option>\n\
  </select>\n```\n```\n\n此后该元素将通过 `div#id` 引用由 jQuery 访问。\n\n## AJAX – 前端与后端之间的粘合剂\n\
  \nAJAX 是一个松散的术语，特指使用 XML 对象在客户端和服务器软件之间进行异步交互。这使得可以在不使用经典的提交按钮交互的情况下从服务器检索数据，而该交互会带你进入基于结果构建的页面。如今，AJAX\
  \ 通常使用 JSON 而不是 XML 来实现相同的效果；它不需要生成新页面来捕获服务器端处理的结果。\n\njQuery 是一个 JavaScript 库，提供了许多有用的跨浏览器实用工具，尤其侧重于\
  \ DOM 操作。jQuery 以发送、接收和渲染 AJAX 调用的结果而闻名。AJAX 调用过去可以在 OpenLayers 中实现；然而，在 OpenLayers\
  \ 3 中，需要外部库。幸运的是，jQuery 已包含在 QGIS 导出的基础 OpenLayers 3 Web 应用程序中。\n\n## 向 singleclick\
  \ 事件处理程序添加 AJAX 调用\n\n要在我们的 CGI 脚本中添加 jQuery AJAX 调用，请将以下代码添加到 SingleClick 上的 \"\
  singleclick\" 事件处理程序中。这是当用户点击前端地图时触发的自定义函数。\n\n此 AJAX 调用引用 CGI 脚本 URL。data 对象包含我们希望传递给服务器的所有参数。jQuery\
  \ 将负责将 data 对象编码为 URL 查询字符串。执行以下代码：\n\n```\njQuery.ajax({\n    url: http://localhost:8000/cgi-bin/get_json.py,\n\
  \    data: {\"longitude\": newCoord[0], \"latitude\": newCoord[1], \"day\":\n  \
  \  day}\n})\nAdd a callback function to the jquery ajax call by inserting the\n\
  following lines directly after it.\n.done(function(response) {\npopupText = 'Vulnerability\
  \ Index (1=Least Vulnerable, 10=Most\nVulnerable): ' + response.index_value;\n```\n\
  \n## 从回调函数填充并触发弹出窗口\n\n现在，要在点击后将脚本响应显示在弹出窗口中，请注释掉以下行：\n\n```\n/* var popupField;\n\
  \nvar currentFeature;\nvar currentFeatureKeys;\nmap.forEachFeatureAtPixel(pixel,\
  \ function(feature, layer) {\n    currentFeature = feature;\n    currentFeatureKeys\
  \ = currentFeature.getKeys();\n    var field = popupLayers[layersList.indexOf(layer)\
  \ - 1];\n    if (field == NO_POPUP) {\n    }\n    else if (field == ALL_FIELDS)\
  \ {\n        for ( var i=0; i<currentFeatureKeys.length;i++) {\n            if (currentFeatureKeys[i]\
  \ != 'geometry') {\n```\n\n```\npopupField = currentFeatureKeys[i] + ': ' +\n  \
  \  currentFeature.get(currentFeatureKeys[i]);\n    popupText = popupText + popupField\
  \ + '<br>';\n}\n}\n}\nelse{\n    var value = feature.get(field);\n    if (value){\n\
  \        popupText = field + ': ' + value;\n    }\n}\n}); /*\n```\n\n最后，将实际触发弹出窗口的部分复制并粘贴到\
  \ .done 回调函数中。.done 回调在 AJAX 调用返回服务器的数据响应时触发（数据响应存储在 response 对象变量中）。执行以下代码：\n\n\
  ```\n.done(function(response) {\n    popupText = 'Vulnerability Index (1=Least Vulnerable,\
  \ 10=Most Vulnerable): ' + response.index_value;\n    if (popupText) {\n       \
  \ overlayPopup.setPosition(coord);\n        content.innerHTML = popupText;\n   \
  \     container.style.display = 'block';\n    } else {\n        container.style.display\
  \ = 'none';\n        closer.blur();\n    }\n}\n```\n\n## 测试应用程序\n\n现在，应用程序应该已完成。你可以在浏览器中通过\
  \ http://localhost:8000 查看它。\n\n你需要通过从选择菜单中选择一个日期并点击地图上的不同位置来进行测试。你将看到类似以下图像的内容，显示研究范围（特拉华州）内地图上任何位置的易感性评分。\n\
  \n![](img/2e88bf5938bf48a409c0a534a8775b21_397_0.png)\n\n## 总结\n\n在本章中，使用农业脆弱性建模示例，我们介绍了插值和使用空间查询的动态后端处理。最终的应用程序允许最终用户点击研究区域内的任何位置，并查看从插值点数据和代数模型计算得出的评分，该模型使用动态\
  \ Python CGI 代码查询 SQLite 数据库。在下一章中，我们将继续探索动态网站，并举例说明提供简单的客户端编辑功能以及使用切片和 UTFGrid\
  \ 方法来提高复杂数据集性能。\n\n## 7\n"
- "## 面向企业和社区的制图\n\n在本章中，我们将使用多种 Web 服务来提供可编辑的协作数据系统。\n\n虽然迄今为止我们所看到的可视化和数据查看功能是触达受众的有力手段，但我们可以利用受众——无论是组织成员、社区利益相关者，还是网络上的感兴趣人士——为我们的地理对象贡献改进的几何和属性数据。在本章中，你将学习如何为大学社区构建提供这些功能的\
  \ Web 服务系统。就可编辑系统而言，这属于较为简单的一端。使用诸如 GeoServer 之类的地图服务器，你可以根据复杂的用户访问管理扩展更广泛的几何编辑功能。\n\
  \n在本章中，我们将涵盖以下主题：\n\n- Google Sheets 用于协作数据管理和服务\n- AJAX 用于 Web 服务处理\n- OpenStreetMap\
  \ 用于协作数据贡献\n- MBTiles 和 UTFGrid 数据格式\n- 通过 Mapbox 进行交互式数据托管\n- 将 JSON 解析并映射到对象\n\
  - 混合 Web 服务数据\n- 使用 Vagrant 设置 Ubuntu 虚拟机\n- TileStream 用于本地 MBTiles 托管\n\n## Google\
  \ Sheets 用于数据管理\n\nGoogle Sheets 为我们提供了一个基本数据管理平台所需的一切——它是基于 Web 的，可通过电子表格界面轻松编辑，具有细粒度的编辑控制和\
  \ API 选项，并且可通过简单的 JSON Web 服务使用——在大多数情况下是免费的。\n\n## 创建新的 Google 文档\n\n要创建新的 Google\
  \ 文档，你需要在 https://accounts.google.com 注册一个 Google 账户。执行以下步骤：\n\n- 1. 在 https://docs.google.com/spreadsheets\
  \ 创建一个新的 Google Sheets 文档。\n- 2. 从 Excel 文件导入数据。\n  - 1. 导航到 文件 | 导入。\n  - 2. 然后，导航到\
  \ 上传 | c7/data/original/building_export.xlsx。\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_400_0.png)\n\
  \n\n\n\n\n## 在网络上发布 Google Sheets\n\n默认情况下，Google Sheets 不会公开可见。此外，没有暴露任何网络服务源。要使我们的网络应用程序能够访问由\
  \ Google Sheets 托管的数据，我们必须发布该表格。请执行以下步骤：\n\n- 1. 导航到 **File | Publish to the web**。\n\
  - 2. 复制并粘贴 URL（在点击 **Published** 后出现）到你可以稍后参考的位置（例如，你喜欢的文本编辑器中）。\n- 3. 如果尚未选中，请选中\
  \ **Automatically republish when changes are made** 复选框，如以下屏幕截图所示：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_401_0.png)\n\
  \n你需要 d/ 之后的部分（这里以 1xAc8w 开始）。这是唯一标识你的表格的标识符（或在文档中有时被称为 \"key\"）。\n\n## 预览 JSON\n\
  \n现在我们已经发布了表格，我们的源以 JSON 形式暴露。我们可以通过将 KEY 替换为我们的工作表唯一标识符的 URL 格式 https://spreadsheets.google.com/feeds/list/KEY/1/public/basic?alt=json\
  \ 来查看 JSON 源。例如，它看起来类似于以下 URL：\n\n```\nhttps://spreadsheets.google.com/feeds/list/1xAc8wpgLgTZpvZmZau2o1O1dhA_31ojKS1BmlG6FMzQ/1/public/basic?alt=json\n\
