  5. 从属性表的下拉菜单中选择新列，并在值框中输入 1：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_248_0.png)\n\
  \n+   6. 点击 更新全部。\n+   7. 导航到 图层 | 切换编辑。\n+   8. 最后，保存。\n\n## 提取（筛选）要素\n\n假设我们的条件只包括\
  \ roads 图层中的一部分要素——主要非限制通行道路（但不包括高速公路），即由分类代码（CFCC）确定的要素子集。为了临时提取这个子集，我们将通过以下步骤执行图层查询：\n\
