  \ ); // initial map\n\nwindow.onresize = resize;\n    resize();\n\nd3.select(\"\
  #loader\").remove();\n    })\n});\n```\n\n## 输出\n\n最终产品——你可以在网络浏览器中打开 `index.html`\
  \ 来查看——是一个由时间线控制的动态点集，展示了按人口普查区划分的白人人口变化。该数据叠加显示在众议院选区之上，其颜色根据每年白人人口的变化从冷色到暖色渐变，并在三个变化时期（2010-11、2011-12\
  \ 和 2012-13）上取平均值。我们的地图应用输出带有时间线动画，效果类似于下图：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_363_0.png)\n\
  \n## 6\n\n## 估计未知值\n\n在本章中，我们将使用插值方法，根据其他位置的已知值来估计某一位置的未知值。\n\n插值是一种完全基于未知位置与已知位置之间的地理关系来估计未知值的技术。由于空间可以被无限精度地测量，数据测量总是受到数据收集者有限资源的制约。插值和其他更复杂的空间估计技术，可用于估计那些尚未被测量位置的值。在本章中，你将学习如何对气象站数据中的值进行插值，这些值将被评分并用于一个针对特定农业条件——霉病——的脆弱性模型中。我们将气象数据做了一个子集，以提供一年中历史上脆弱性通常较高的月份。最终用户可以使用此应用对模型进行地面真值验证，即将预测的高或低脆弱性与霉病存在与否进行匹配。如果模型扩展到历史数据或接近实时，该应用可用于观察脆弱性随时间的趋势，或提示种植者需要采取行动预防霉病。包括降水量、相对湿度和温度在内的参数，已被选用于预测田间和作物霉病脆弱性的实际模型中。\n\
  \n在本章中，我们将介绍以下主题：\n\n- 从 MySQL 添加数据\n- 使用 NetCDF 多维数据格式\n- 插值未知值以用于可视化和报告\n- 应用简单的代数风险模型\n\
  - 使用 Python GDAL 包装器通过 SQLite 查询进行过滤和更新\n- 插值\n- 地图代数建模\n- 用网格点图层对栅格网格进行采样\n- Python\
  \ CGI 托管\n- CGI 开发过程中的测试与调试\n- Python SpatiaLite/SQLite3 包装器\n- 使用 QGIS 插件生成 **OpenLayers3\
  \ (OL3)** 地图\n- 为 OL3 地图添加 AJAX 交互\n- OL3 像素弹出窗口中的动态响应\n\n## 导入数据\n\n通常，用于高度交互式动态\
  \ Web 应用的数据存储在企业现有数据库中。尽管这些并非通常意义上的空间数据库，但它们包含坐标位置，可以很容易地在空间应用中被利用。\n\n## 在 QGIS\
  \ 中连接并从 MySQL 导入\n\n以下部分仅作为演示提供——数据库安装和设置对于简短的使用演示来说过于耗时。\n\n> 如果你确实希望安装并设置 MySQL，可以从\
  \ http://dev.mysql.com/downloads/ 下载。MySQL Community Server 在开源 GPL 许可下免费提供。你可能需要安装\
  \ MySQL Workbench 和 MySQL Utilities，它们也可在此位置获得，以便与新的 MySQL Community Server 实例进行交互。然后，你可以使用\
  \ MySQL Workbench 中的数据导入/恢复命令，并配合提供的备份文件（c6/original/packt.sql）来恢复本演示所用的数据库。\n\n\
  \n\n\n\n要将 MySQL 数据库中的数据连接到你的 QGIS 项目并添加数据，需要执行以下操作（再次说明，仅用于演示，不需要数据库安装和设置）：\n\n\
  1. 导航到 **图层 | 添加图层 | 添加矢量图层**。\n   - **源类型：数据库**\n   - **类型：MySQL**，如下图所示：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_367_0.png)\n\
  \n2. 一旦你表明希望添加 MySQL 数据库图层，你将有创建新连接的选项。在 **连接** 中，点击 **新建**。在打开的对话框中，输入以下参数，这些参数是我们创建\
  \ MySQL 数据库并导入 packt 架构的 `.sql` 备份时最初设置的：\n   - **名称：** packt\n   - **主机：** localhost\n\
  \   - **数据库：** packt\n   - **端口：** 3306\n   - **用户名：** packt\n   - **密码：** packt\n\
  \n如下图所示：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_368_0.png)\n\n3. 点击 **测试连接**。\n\
  4. 点击 **确定**。\n5. 点击 **打开**，**选择要添加的矢量图层** 对话框将会出现。\n6. 从 **选择矢量图层** 对话框中，点击 **全选**。这包括以下图层：\n\
  \   - fields\n   - precipitation\n   - relative_humidity\n   - temperature\n7. 点击\
  \ **确定**。\n\n来自 MySQL 数据库的图层（实际上只是数据表）现在将出现在你的项目 QGIS 图层面板中。\n\n## 估算未知值\n\n现在，要导入包含被识别为地理空间数据的坐标字段的\
  \ CSV 并绘制位置，请执行以下步骤：\n\n1. 从图层菜单导航到 **添加图层 | 添加分隔文本图层**。\n2. 在 **从分隔文本文件创建图层** 对话框中，执行以下步骤：\n\
  \   1. 点击 **浏览...** 按钮浏览你之前保存 `fields.csv` 文件的位置（例如，`c6/data/output/fields.csv`）。\n\
  \   2. 其他所有参数应默认正确填充。查看以下图像。\n   3. 点击 **确定** 在你的 QGIS 项目中创建新图层。\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_370_0.png)\n\
  \n你将收到一条通知，提示由于此文件中未检测到坐标系统，已分配 WGS 1984。这是我们情况下正确的坐标系统，因此无需进一步干预。关闭此消息后，你将看到字段位置绘制在地图上。如果没有，请右键单击新图层并选择\
  \ **缩放至图层**。\n\n请注意，此新图层不会在文件系统中反映为新文件，而仅存储在此 QGIS 项目中。现在是保存项目的合适时机。\n\n最后，使用每个表的\
  \ `field_id` 字段一次一个地将其他表（`precipitation`、`relative_humidity` 和 `temperature`）连接到新绘制的图层（fields）。有关如何执行此操作的复习，请参阅\
  \ *第 1 章，探索地点 – 从概念到界面* 的 *表连接* 部分。要将每个图层导出为单独的 shapefile，请右键单击每个（`precipitation`、`relative_humidity`\
  \ 和 `temperature`），点击 **另存为**，填充你想要保存的路径，然后保存它们。\n\n## 图层/表关系\n\nQGIS 的较新版本支持图层/表关系，这将允许我们模拟位置与其抽象测量类之间的一对多关系，该类将包含所有参数。然而，表关系的用途仅限于对图层对象与表之间关系的初步探索。图层/表关系不被任何处理函数识别。执行以下步骤以探索多对多图层/表关系：\n\
  \n1. 通过导航到 **项目 | 项目属性 | 关系** 添加关系。建立了与三个表的关联后，你将看到以下图像：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_371_0.png)\n\
  \n2. 要添加关系，请在 **引用图层（子）** 字段中选择一个非图层表（例如，**precipitation**），并在 **被引用图层（父）** 字段中选择一个位置表（例如，**fields**）。使用公共\
  \ Id 字段（例如，`field_id`）将表关联起来，该字段引用图层。名称字段可以任意填写，如下图所示：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_372_0.png)\n\
  \n3. 现在，要使用关系，请使用识别工具点击父图层中的地理对象（你需要在识别工具选项面板中勾选 **自动打开表单**）。你将看到与此对象连接的所有子实体（行）。\n\
  \n## NetCDF\n\n网络通用数据格式（NetCDF）是一种标准且强大的环境数据格式，例如气象数据。NetCDF 的优势在于保存多维数据。凭借其抽象的维度概念，NetCDF\
  \ 可以以同样的方式处理纬度、经度和时间的维度，就像处理其他通常物理的、连续的和序数数据尺度，例如气压层。\n\n## *估算未知值*\n\n对于本项目，我们使用了\
  \ 1901-2010 年的月度全球网格化高分辨率站点（陆地）空气温度和降水数据，NetCDF 大学特拉华大学作为与 NOAA 合作的一部分维护。你可以从 `http://www.esrl.noaa.gov/psd/data/gridded/data.Udel_AirT_Precip.html`\
  \ 此来源下载更多数据。\n\n### 在 QGIS 中查看 NetCDF\n\n虽然有插件可用，但 NetCDF 可以直接在 QGIS 中、通过命令行 GDAL\
  \ 以及在 QGIS Python 控制台中查看。执行以下步骤：\n\n1. 导航到 **图层 | 添加栅格图层**。\n2. 浏览到 `c6/data/original/air.mon.mean.v301.nc`\
  \ 并添加此图层。\n3. 使用路径 **栅格 | 杂项 > 信息** 查找波段中的值范围。在初始对话框中，点击 **确定** 进入信息对话框，然后查找 `air_valid_range`。你可以在以下图像中看到此信息高亮显示。虽然\
  \ QGIS 的分类器会为你计算范围，但它通常会被数值 nodata 值干扰，这通常会使范围偏向低端。\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_374_0.png)\n\
  \n4. 将范围信息（-90 到 50）输入到 **图层属性** 选项卡的 **样式** 选项卡中。\n5. 点击 **反转** 以显示从少到多的冷到热的颜色，就像温度预期那样。\n\
  6. 点击 **分类** 根据数量和颜色范围创建新的分箱。以下屏幕截图显示了理想的分箱和颜色选择的外观：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_375_0.png)\n\
  \n7. 点击 **确定**。最终结果将类似于以下图像：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_376_0.png)\n\
  \n为了使网格化 NetCDF 数据可供某些模型、数据库和网络交互访问，你可以在对每个时间段的网格值进行采样并将其附加到点之后编写类似以下的工作流程序。\n\n\
  ## 插值模型值\n\n在本节中，我们将介绍从之前提到的 MySQL 数据库中获得的有限气象站数据创建新的全州、基于点的脆弱性指数数据。\n\n### Python\
  \ 用于工作流自动化\n\n凭借 Python 大量且不断增长的包装器，允许独立的（通常用 C 编写并编译的）库直接调用到 Python 中，它是与其它软件通信的自然选择。除了直接的\
  \ API 和库使用外，Python 还提供对系统自动化任务的访问。\n\n### 了解你的环境\n\n在用 Python 开发时，一个看似简单却具有欺骗性的挑战是知道哪些路径和依赖项已加载到你的开发环境中。\n\
  \n\n\n\n\n要输出你的路径，请在 QGIS Python 控制台（导航到**插件 | Python 控制台**）或 QGIS 随附的 OSGeo4W Shell\
  \ 中键入以下内容：\n\n```\nimport os\ntry:\n    user_paths = os.environ['PYTHONPATH'].split(os.pathsep)\n\
  except KeyError:\n    user_paths = []\nprint user_paths\n```\n\n为了列出所有模块，以便我们知道哪些已经可用，请键入以下内容：\n\
  \n```\nimport sys\nsys.modules.keys()\n```\n\n一旦我们知道哪些模块可供 Python 使用，我们就可以查找这些模块及其可能公开的可编程对象的文档。\n\
  \n> 请记住，在您使用的任何文本编辑器或 IDE 中查看所有特殊字符（包括空白）。Python 对代码块的缩进很敏感！您可以将文本编辑器设置为默认输入一定数量的空格来代替制表符。例如，当我按一次制表符缩进时，我将得到四个空格，而不是一个特殊的制表符字符。\n\
  \n![](img/2e88bf5938bf48a409c0a534a8775b21_377_0.png)\n\n## 为每个时间段生成参数栅格\n\n现在，我们将转入非评估代码。您可能希望借此机会退出\
  \ QGIS，尤其是在您一直在 Python 命令窗格中工作时。如果我已在命令窗格中工作，我喜欢使用 Python 语法退出，代码如下：\n\n```\nquit()\n\
  ```\n\n退出后，重新启动 QGIS。Python 控制台可以在**插件 | Python 控制台**下找到。\n\n通过在 Python 中运行下一个代码片段，您将生成一段命令行代码，我们将依次运行该代码来为这个\
  \ Web 应用程序生成中间数据。\n\n## 这段代码的作用\n\n我们将运行一段 Python 代码来生成一个更详细的脚本，该脚本将执行一个冗长的工作流程。\n\
  \n- 对于每个参数（因子），它将遍历日期范围内的每一天。该范围实际上将限制为 06/10/15 至 06/30/15，因为模型需要 10 天的回溯期。\n-\
  \ 我们将通过 ogr2ogr——GDAL 强大的矢量数据转换工具——运行它，并使用 SQLite 语法，根据相对时间段选择适当的聚合值（计数、总和和平均值）。\n\
  - 它将根据阈值将每个结果转换为用于计算霉病易感性的分数。换句话说，利用数据中的一些（可能是任意的）断点，我们将真实测量值转换为与我们的研究相关的较小整数分数。\n\
  - 它将对分数进行插值，生成整数栅格。\n\n## 在 Python 中运行代码\n\n将以下行复制并粘贴到 Python 解释器中。如果粘贴后代码未执行，请按*回车*键。该代码还假定数据位于以下位置硬编码的位置（C:/packt/c6/data/prep/ogr.sqlite）中。如果这些文件不在给定位置，您可能需要移动这些文件或更改代码。您还需要根据您的文件系统修改以下代码；以下代码使用\
  \ Windows 文件系统约定：\n\n```python\n# first variable to store commands\nstrCmds = 'del\
  \ /F C:\\\\packt\\\\c6\\\\data\\\\prep\\\\ogr.* \\\\n'\n# list of factors\nfactors\
  \ = ['temperature','relative_humidity','precipitation']\n# iterate through each\
  \ factor, appending commands for each\nfor factor in factors:\n    for i in range(10,\
  \ 31):\n        j = i - 5\n        k = i - 9\n        if factor == 'temperature':\n\
  \            # commands use ogr2ogr executable from gdal project\n            #\
  \ you can run help on this from command line for more\n            # information\
  \ on syntax\n            strOgr = 'ogr2ogr -f sqlite -sql \"SELECT div_field_, GEOMETRY,\
  \ AVG(o_value) AS o_value FROM (SELECT div_field_, GEOMETRY, MAX(value) AS o_value,\
  \ date(time_measu) as date_f FROM {2} WHERE date_f BETWEEN date(\\\\'2013-06-{0:02d}\\\
  \\') AND date(\\\\'2013-06-{1:02d}\\\\') GROUP BY div_field_, date(time_measu))\
  \ GROUP BY div_field_\" -dialect sqlite -nln ogr -dsco SPATIALITE=yes -lco SPATIAL_INDEX=yes\
  \ -overwrite C:/packt/c6/data/prep/ogr.sqlite C:/packt/c6/data/prep/temperature.shp\
  \ \\\\n'.format(j,i,factor)\n```\n\n```\nstrOgr += 'ogr2ogr -sql \"UPDATE ogr SET\
  \ o_value = 0 WHERE o_value <=15.55\" -dialect sqlite -update C:/packt/c6/data/prep/ogr.sqlite\
  \ C:/packt/c6/data/prep/ogr.sqlite \\n'\n    strOgr += 'ogr2ogr -sql \"UPDATE ogr\
  \ SET o_value = 3 WHERE o_value > 25.55\" -dialect sqlite -update C:/packt/c6/data/prep/ogr.sqlite\
  \ C:/packt/c6/data/prep/ogr.sqlite \\n'\n    strOgr += 'ogr2ogr -sql \"UPDATE ogr\
  \ SET o_value = 2 WHERE o_value > 20.55 AND o_value <= 25.55\" -dialect sqlite -update\
  \ C:/packt/c6/data/prep/ogr.sqlite C:/packt/c6/data/prep/ogr.sqlite \\n'\n    strOgr\
  \ += 'ogr2ogr -sql \"UPDATE ogr SET o_value = 1 WHERE o_value > 15.55 AND o_value\
  \ <= 20.55\" -dialect sqlite -update C:/packt/c6/data/prep/ogr.sqlite C:/packt/c6/data/prep/ogr.sqlite\
  \ \\n'\n    elif factor == 'relative_humidity':\n        strOgr = 'ogr2ogr -f sqlite\
  \ -sql \"SELECT GEOMETRY, COUNT(value) AS o_value, date(time_measu) as date_f FROM\
  \ relative_humidity WHERE value > 96 AND date_f BETWEEN date(\\'2013-06-{0:02d}\\\
  ') AND date(\\'2013-06-{1:02d}\\') GROUP BY div_field\" -dialect sqlite -nln ogr\
  \ -dsco SPATIALITE=yes -lco SPATIAL_INDEX=yes -overwrite C:/packt/c6/data/prep/ogr.sqlite\
  \ C:/packt/c6/data/prep/relative_humidity.shp \\n'.format(j,i)\n    strOgr += 'ogr2ogr\
  \ -sql \"UPDATE ogr SET o_value = 0 WHERE o_value <= 1\" -dialect sqlite -update\
  \ C:/packt/c6/data/prep/ogr.sqlite C:/packt/c6/data/prep/ogr.sqlite \\n'\n    strOgr\
  \ += 'ogr2ogr -sql \"UPDATE ogr SET o_value = 3 WHERE o_value > 40\" -dialect sqlite\
  \ -update C:/packt/c6/data/prep/ogr.sqlite C:/packt/c6/data/prep/ogr.sqlite \\n'\n\
  \    strOgr += 'ogr2ogr -sql \"UPDATE ogr SET o_value = 2 WHERE o_value > 20 AND\
  \ o_value <= 40\" -dialect sqlite -update C:/packt/c6/data/prep/ogr.sqlite C:/packt/c6/data/prep/ogr.sqlite\
  \ \\n'\n    strOgr += 'ogr2ogr -sql \"UPDATE ogr SET o_value = 1 WHERE o_value >\
  \ 10 AND o_value <= 20\" -dialect sqlite -update C:/packt/c6/data/prep/ogr.sqlite\
  \ C:/packt/c6/data/prep/ogr.sqlite \\n'\n    strOgr += 'ogr2ogr -sql \"UPDATE ogr\
  \ SET o_value = 1 WHERE o_value > 1 AND o_value <= 10\" -dialect sqlite -update\
  \ C:/packt/c6/data/prep/ogr.sqlite C:/packt/c6/data/prep/ogr.sqlite \\n'\n    elif\
  \ factor == 'precipitation':\n        strOgr = 'ogr2ogr -f sqlite -sql \"SELECT\
  \ GEOMETRY, SUM(value) AS o_value, date(time_measu) as date_f FROM precipitation\
  \ WHERE date_f BETWEEN date(\\'2013-06-{0:02d}\\') AND date(\\'2013-06-{1:02d}\\\
  ') GROUP BY div_field\" -dialect sqlite -nln ogr -dsco SPATIALITE=yes -lco SPATIAL_INDEX=yes\
  \ -overwrite C:/packt/c6/data/prep/ogr.sqlite C:/packt/c6/data/prep/precipitation.shp\
  \ \\n'.format(k,i)\n    strOgr += 'ogr2ogr -sql \"UPDATE ogr SET o_value = 0 WHERE\
  \ o_value < 25.4\" -dialect sqlite -update C:/packt/c6/data/prep/ogr.sqlite C:/packt/c6/data/prep/ogr.sqlite\
  \ \\n'\n    strOgr += 'ogr2ogr -sql \"UPDATE ogr SET o_value = 3 WHERE o_value >\
  \ 76.2\" -dialect sqlite -update C:/packt/c6/data/prep/ogr.sqlite C:/packt/c6/data/prep/ogr.sqlite\
  \ \\n'\n```\n\n## 估算未知值\n\n```\nstrOgr += 'ogr2ogr -sql \"UPDATE ogr SET o_value\
  \ = 2 WHERE o_value > 50.8 AND o_value <= 76.2\" -dialect sqlite -update C:/packt/c6/data/prep/ogr.sqlite\
  \ C:/packt/c6/data/prep/ogr.sqlite \\\\n'\nstrOgr += 'ogr2ogr -sql \"UPDATE ogr\
  \ SET o_value = 1 WHERE o_value > 30.48 AND o_value <= 50.8\" -dialect sqlite -update\
  \ C:/packt/c6/data/prep/ogr.sqlite C:/packt/c6/data/prep/ogr.sqlite \\\\n'\nstrOgr\
  \ += 'ogr2ogr -sql \"UPDATE ogr SET o_value = 1 WHERE o_value > 25.4 AND o_value\
  \ <= 30.48\" -dialect sqlite -update C:/packt/c6/data/prep/ogr.sqlite C:/packt/c6/data/prep/ogr.sqlite\
  \ \\\\n'\nstrGrid = 'gdal_grid -ot UInt16 -zfield o_value -l ogr -of GTiff C:/packt/c6/data/prep/ogr.sqlite\
  \ C:/packt/c6/data/prep/{0} Integer{1}.tif'.format(factor,i)\nstrCmds = strCmds\
  \ + strOgr + '\\\\n' + strGrid + '\\\\n' + 'del /F C:\\\\packt\\\\c6\\\\data\\\\\
  prep\\\\ogr.*' + '\\\\n'\n\nprint strCmds\n```\n\n## 在 Windows 命令控制台中运行打印的命令\n\n\
  通过将上一部分输出的代码复制并粘贴到 Windows 命令控制台中来运行它。您还可以在 `c6/data/output/generate_values.bat`\
  \ 中找到要复制的代码输出。\n\n## subprocess 模块\n\nsubprocess 模块允许您使用相关的命令行语法打开系统上的任何可执行文件。\n\
  \n虽然我们也可以通过 subprocess 模块来运行刚刚生成的代码，但在这种情况下，直接在命令行中运行更为简单。对于较短、顺序性较弱的过程，您绝对应该使用\
  \ subprocess。\n\n要使用 subprocess，只需（最好）在程序开头导入它，然后使用 Popen 方法调用您的命令行代码。执行以下代码：\n\n\
