- "## 模块 1\n\n# 学习 QGIS，第三版\n\n使用 QGIS 2.14 创建精美地图并轻松执行地理处理任务的最新指南\n\n## 1\n\n###\
  \ 开始使用 QGIS\n\n在本章中，我们将安装和配置 **QGIS** 地理信息系统。我们还将熟悉用户界面以及如何对其进行自定义。到本章结束时，您将使 QGIS\
  \ 在您的机器上运行并准备好开始教程。\n\n### 安装 QGIS\n\nQGIS 运行于 **Windows**、各种 **Linux** 发行版、**Unix**、**Mac\
  \ OS X** 和 **Android**。QGIS 项目提供即用型软件包以及从源代码构建的说明，网址为 http://download.qgis.org。我们将介绍如何在两个系统\
  \ Windows 和 Ubuntu 上安装 QGIS，以及如何避免最常见的陷阱。\n\n> 其他受支持操作系统的进一步安装说明可在 http://www.qgis.org/en/site/forusers/alldownloads.html\
  \ 获取。\n\n像许多其他开源项目一样，QGIS 为您提供不同版本的选择。对于本书中的教程，我们将使用 **QGIS 2.14 LTR** 版本。以下选项可用：\n\
  \n- **长期发布版 (LTR)：** LTR 版本推荐用于企业和学术用途。它目前每年二月底发布一次。至少提供一年的错误修复更新，且功能和用户界面保持不变。这使其成为培训材料最佳选择，因为不会在几个月后过时。\n\
  - **最新发布版 (LR)**：LR 版本包含新开发并经过测试的功能。它目前每四个月发布一次（除非发布 LTR 版本）。如果您想跟上最新发展，包括新功能和用户界面更改，但不习惯使用\
  \ DEV 版本，请使用此版本。\n- **开发者版本 (DEV、master 或 testing)**：前沿的 DEV 版本包含最新最好的开发成果，但请注意，在某些日子里，它可能不如您希望的那样可靠。\n\
  \n> 您可以在 http://www.qgis.org/en/site/getinvolved/development/roadmap.html#release-schedule\
  \ 找到有关发布以及未来发布计划的更多信息。要了解发布之间的更改，请查看 http://www.qgis.org/en/site/forusers/visualchangelogs.html\
  \ 上的视觉更改日志。\n\n#### 在 Windows 上安装 QGIS\n\n在 Windows 上，我们有两种不同的安装 QGIS 的选项，独立安装程序和\
  \ **OSGeo4W** 安装程序：\n\n- **独立安装程序** 是一个大文件可供下载（约 280 MB）；它包含 QGIS 发布版、**地理资源分析支持系统\
  \ (GRASS)** GIS 以及 **地理科学自动化分析系统 (SAGA)** GIS 在一个软件包中。\n- **OSGeo4W 安装程序** 是一个小巧灵活的安装工具，可下载和安装\
  \ QGIS 以及许多其他 OSGeo 工具及其所有依赖项。此安装程序相对于独立安装程序的主要优势是使其更新 QGIS 及其依赖项变得非常容易。您可以始终同时访问当前发布版和开发者版本，如果您选择的话，但当然，您永远不会被强制更新。这就是我推荐您使用\
  \ **OSGeo4W** 的原因。您可以从 http://osgeo4w.osgeo.org 下载 32 位和 64 位 OSGeo4W 安装程序（或直接从\
  \ http://download.osgeo.org/osgeo4w/osgeo4w-setup-x86.exe 下载 32 位版本，或 http://download.osgeo.org/osgeo4w/osgeo4w-setup-x86_64.exe\
  \ 如果您使用的是 64 位 Windows）。下载与您的操作系统匹配的版本并保留它！将来，每当您想要更改或更新系统时，只需再次运行它即可。\n\n> \U0001F4A1\
  \ 无论您选择哪个安装程序，请确保在安装路径中避免使用特殊字符，例如德语变音符号或除默认拉丁字母以外的其他字母表中的字母（详情请参阅 `https://en.wikipedia.org/wiki/ISO_basic_Latin_alphabet`），因为它们以后可能会导致问题，例如在插件安装期间。\n\
  \n当 OSGeo4W 安装程序启动时，我们可以选择 **Express Desktop Install**、**Express Web-GIS Install**\
  \ 和 **Advanced Install**。要安装 QGIS LTR 版本，我们只需选择 **Express Desktop Install** 选项，下一个对话框将列出可用的桌面应用程序，例如\
  \ **QGIS**、**uDig** 和 **GRASS GIS**。我们只需选择 **QGIS**，点击 **Next**，然后通过再次点击 **Next**\
  \ 确认必要的依赖项。然后下载和安装将自动开始。安装完成后，将为 OSGeo4W 和 QGIS 创建桌面快捷方式和开始菜单条目。\n\n要安装 QGIS LTR（或\
  \ DEV），我们需要通过 **Advanced Install** 选项，如下图所示：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_23_0.png)\n\
  \n此安装路径提供许多选项，例如 **Download Without Installing** 和 **Install from Local Directory**，可用于在一台机器上下载所有必要软件包，然后在没有\
  \ Internet 访问的机器上安装。我们只需选择 **Install from Internet**，如下图所示：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_24_0.png)\n\
  \n选择安装 **Root Directory** 时，如下图所示，避免在安装路径中使用特殊字符，例如德语变音符号或除默认拉丁字母以外的其他字母表中的字母（如前所述），因为它们以后可能会导致问题，例如在插件安装期间：\n\
  \n![](img/2e88bf5938bf48a409c0a534a8775b21_24_1.png)\n\n然后您可以指定文件夹（**Local Package\
  \ Directory**），设置过程将在其中存储安装文件，以及自定义 **Start menu name**。我建议您保留默认设置，类似于此屏幕截图中所示：\n\
  \n![](img/2e88bf5938bf48a409c0a534a8775b21_25_0.png)\n\n在 Internet 连接设置中，通常无需更改默认设置，但如果您的机器例如隐藏在\
  \ **proxy** 后面，您可以在此处指定它：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_25_1.png)\n\
  \n\n\n\n\n然后我们可以选择下载站点。在撰写本书时，只有一个下载服务器可用，正如你在以下截图中所看到的那样：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_26_0.png)\n\
  \n在安装程序从 OSGeo 的服务器获取最新的软件包信息后，我们就可以选择要安装的软件包。QGIS LTR 在桌面类别中列为 qgis-ltr（开发版列为 qgis-dev）。要选择\
  \ LTR 版本进行安装，请点击显示为 Skip 的文字，它会改变并显示版本号，如本截图所示：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_26_1.png)\n\
  \n正如你在以下截图中所看到的，安装程序会自动选择所有必要的依赖项（如 GDAL、SAGA、OTB 和 GRASS），因此我们无需担心此事：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_27_0.png)\n\
  \n点击 Next 后，下载和安装会自动开始，就像在 Express 版本中一样。\n\n你可能已经注意到其他可用的 QGIS 软件包，称为 qgis-ltr-dev\
  \ 和 qgis-rel-dev。它们包含最新的更改（分别针对 LTR 和 LR 版本），这些更改将根据发布计划作为错误修复版本发布。如果你在发布版本中遇到问题，而该问题最近已被修复但错误修复版本尚未发布，那么这些软件包是一个不错的选择。\n\
  \n> 如果你尝试运行 QGIS 并弹出提示说，无法在动态链接库 <some-name>.dll 中定位过程入口点 <some-name>，这意味着你在 Windows\
  \ 系统上遇到了常见的 DLL 冲突问题。此错误很容易修复；只需将错误消息中提到的 DLL 文件从 C:\\OSGeo4W\\bin\\ 复制到 C:\\OSGeo4W\\\
  apps\\qgis\\bin\\（如有必要请调整路径）。\n\n## 在 Ubuntu 上安装\n\n在 Ubuntu 上，QGIS 项目为 LTR、LR 和\
  \ DEV 版本提供软件包。在撰写本书时，支持的 Ubuntu 版本为 Precise、Trusty、Vivid 和 Wily，但你可以从 http://www.qgis.org/en/site/forusers/alldownloads.html#debian-ubuntu\
  \ 获取最新信息。请注意，你一次只能安装一个版本。这些软件包未列在默认的 Ubuntu 仓库中。因此，我们必须将适当的仓库添加到 Ubuntu 的源列表中，该列表位于\
  \ /etc/apt/sources.list。你可以用任何文本编辑器打开该文件。确保你拥有超级用户权限，因为保存修改时需要此权限。一个选择是使用 gedit，它已默认安装在\
  \ Ubuntu 中。要编辑 sources.list 文件，请使用以下命令：\n\n```\nsudo gedit /etc/apt/sources.list\n\
  ```\n\n下载示例代码\n你可以在 http://www.packtpub.com 上使用你的账户下载本书的示例代码文件。如果你是在其他地方购买本书，可以访问\
  \ http://www.packtpub.com/support 并注册以直接收到文件。\n\n请确保只添加以下软件包源选项之一，以避免因不兼容的软件包而产生冲突。你需要添加到源列表中的具体行取决于你的\
  \ Ubuntu 版本：\n\n- 1. 第一个选项，也是默认选项，是安装 LR 版本。要在 Trusty 上安装 QGIS LR 发布版，请将以下行添加到你的文件中：\n\
  - deb http://qgis.org/debian trusty main\n- deb-src http://qgis.org/debian trusty\
  \ main\n\n如有必要，将 trusty 替换为 precise、vivid 或 wily 以适应你的系统。要获取受支持的 Ubuntu 版本的最新列表，请查看\
  \ http://www.qgis.org/en/site/forusers/alldownloads.html#debian-ubuntu。\n\n- 2.\
  \ 第二个选项是通过添加以下行到你的文件中来安装 QGIS LTR：\n- deb http://qgis.org/debian-ltr trusty main\n\
  - deb-src http://qgis.org/debian-ltr trusty main\n\n3. 第三个选项是通过添加以下行来安装 QGIS DEV：\n\
  \n```\ndeb http://qgis.org/debian-nightly trusty main\ndeb-src http://qgis.org/debian-nightly\
  \ trusty main\n```\n\n> 前述版本依赖于 GDAL 和 proj4 等其他软件包，这些软件包可在 Ubuntu 仓库中找到。值得一提的是，这些软件包通常相当陈旧。\n\
  \n4. 第四个选项是安装带有更新依赖项的 QGIS LR，这些依赖项由 ubuntugis 仓库提供。将以下行添加到你的文件中：\n\n```\ndeb http://qgis.org/ubuntugis\
  \ trusty main\ndeb-src http://qgis.org/ubuntugis trusty main\ndeb http://ppa.launchpad.net/ubuntugis/ubuntugis-unstable/\n\
  ubuntu trusty main\n```\n\n5. 第五个选项是带有更新依赖项的 QGIS LTR。将以下行添加到你的文件中：\n\n```\ndeb\
  \ http://qgis.org/ubuntugis-ltr trusty main\ndeb-src http://qgis.org/ubuntugis-ltr\
  \ trusty main\ndeb http://ppa.launchpad.net/ubuntugis/ubuntugis-unstable/\nubuntu\
  \ trusty main\n```\n\n6. 第六个选项是带有更新依赖项的 QGIS master。将以下行添加到你的文件中：\n\n```\ndeb http://qgis.org/ubuntugis-nightly\
  \ trusty main\ndeb-src http://qgis.org/ubuntugis-nightly trusty main\ndeb http://ppa.launchpad.net/ubuntugis/ubuntugis-unstable/\n\
  ubuntu trusty main\n```\n\n> 为了跟随本书中的教程，建议你安装 QGIS 2.14 LTR 并带有更新的依赖项（第五个选项）。\n\n\
  选择仓库后，我们将把 qgis.org 仓库的公钥添加到 apt 密钥环中。这将避免在从非默认仓库安装时可能出现的警告。在终端中运行以下命令：\n\n```\n\
  sudo apt-key adv --keyserver keyserver.ubuntu.com --recv-key 3FF5FFCAD71472C4\n\
  ```\n\n> 到本书印刷时，密钥信息可能已更改。请参考 http://www.qgis.org/en/site/forusers/alldownloads.html#debian-ubuntu\
  \ 获取最新更新。\n\n最后，要安装 QGIS，请运行以下命令：\n\n```\nsudo apt-get update\n```\n\n```\nsudo\
  \ apt-get install qgis python-qgis qgis-plugin-grass\n```\n\n## 首次运行 QGIS\n\n安装\
  \ QGIS 后，你将获得两个应用程序：QGIS Desktop 和 QGIS Browser。如果你熟悉 ArcGIS，可以将 QGIS Browser 视为类似于\
  \ ArcCatalog 的东西。它是一个用于预览空间数据及其相关元数据的小型应用程序。本书其余部分我们将专注于 QGIS Desktop。\n\n默认情况下，QGIS\
  \ 将使用操作系统的默认语言。为了跟随本书中的教程，我建议你通过 Settings | Options | Locale 将语言更改为英语。\n\n首次运行时，工具栏的排列方式可能会隐藏一些按钮。为了能够高效工作，我建议你重新排列工具栏（为完整起见，我已在\
  \ View 菜单中的 Toolbars 中启用了所有工具栏）。我喜欢将一些工具栏放在左右屏幕边框上，以节省垂直屏幕空间，尤其是在宽屏显示器上。\n\n此外，我们将通过导航到\
  \ View | Panels | Browser Panel 来激活文件浏览器。它将为我们提供快速访问空间数据的方式。最后，你屏幕上的 QGIS 窗口应类似于以下截图：\n\
  \n![](img/2e88bf5938bf48a409c0a534a8775b21_31_0.png)\n\n接下来，我们将通过导航到 **Plugins |\
  \ Manage and Install Plugins** 来激活一些必备插件。插件通过勾选其名称旁边的复选框来激活。起初，我推荐以下插件：\n\n- **Coordinate\
  \ Capture:** 此插件用于在地图上拾取坐标\n- **DB Manager:** 此插件帮助你管理 SpatiaLite 和 PostGIS 数据库\n\
  - **fTools:** 此插件提供矢量分析和管理工具\n- **GdalTools:** 此插件提供栅格分析和管理工具\n- **Processing:**\
  \ 此插件提供许多有用的栅格和矢量分析工具，以及用于任务自动化的模型构建器\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_33_0.png)\n\
  \n地图下方，我们找到重要信息，例如（从左到右）当前地图坐标、地图比例尺，以及（当前未激活的）项目坐标参考系统（CRS），例如本截图中的 EPSG:4326：\n\
  \n![](img/2e88bf5938bf48a409c0a534a8775b21_33_1.png)\n\n接下来，有多个工具栏可供探索。如果你按上一节所示排列它们，顶行包含以下工具栏：\n\
  \n- **File**: 此工具栏包含创建、打开、保存和打印项目的工具\n\n- **Map Navigation**: 此工具栏包含平移和缩放工具\n\n\
  - **Attributes**: 这些工具用于*识别、选择、打开属性表、测量*等，看起来如下：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_33_2.png)\n\
  \n第二行包含以下工具栏：\n\n- **Label**: 这些工具用于添加、配置和修改标签\n\n- **Plugins**: 目前这仅包含 **Python\
  \ Console** 工具，但会随着安装额外的 Python 插件而填充\n\n- **Database**: 目前，此工具栏仅包含 DB Manager，但其他数据库相关工具（例如\
  \ **OfflineEditing** 插件，允许我们离线编辑并与数据库同步）在安装后会出现于此\n\n\n\n\n\n- **栅格**：此工具栏包含直方图拉伸、亮度和对比度控制\n\
  - **矢量**：此工具栏目前仅包含 **坐标捕获** 工具，但将由额外的 Python 插件填充\n- **Web**：此工具栏目前为空，但也将由额外的 Python\
  \ 插件填充\n- **帮助**：此工具栏指向下载用户手册的选项，外观如下：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_34_0.png)\n\
  \n在左侧屏幕边框，我们放置了 **管理图层** 工具栏。此工具栏包含从 *矢量或栅格文件、数据库、网络服务、文本文件添加图层* 或创建新图层的工具：\n\n\
  ![](img/2e88bf5938bf48a409c0a534a8775b21_34_1.png)\n\n最后，在右侧屏幕边框，我们还有两个工具栏：\n\n\
  - **数字化**：此工具栏中的工具 **启用编辑**、基本要素创建和编辑\n- **高级数字化**：此工具栏包含 **撤销/重做** 选项、**高级编辑工具、几何简化工具**\
  \ 等，外观如下：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_34_2.png)\n\n> 所有数字化工具（除 **启用高级数字化工具**\
  \ 按钮外）目前均处于非活动状态。它们只有在我们开始编辑矢量图层时才会变为活动状态。\n\n工具栏和面板可通过 **视图** 菜单的 **面板** 和 **工具栏**\
  \ 条目激活和停用，也可通过右键单击菜单或工具栏激活和停用，这将打开一个包含所有可用工具栏和面板的上下文菜单。工具栏上的所有工具也可以通过菜单访问。如果你停用\
  \ **管理图层工具栏**，例如，你仍然可以使用 **图层** 菜单添加图层。\n\n正如你现在可能已经猜到的那样，QGIS 具有高度的可定制性。你可以通过前往\
  \ **设置 | 配置快捷方式** 为常用工具分配快捷方式来提高生产力。同样，如果你发现自己从不使用某个工具栏按钮或菜单项，可以通过前往 **设置 | 自定义**\
  \ 来隐藏它。例如，如果你无法访问 Oracle Spatial 数据库，你可能希望隐藏相关按钮以减少杂乱并节省屏幕空间，如以下屏幕截图所示：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_35_0.png)\n\
  \n## 查找帮助和报告问题\n\nQGIS 社区提供多种基于社区的支持选项。包括以下内容：\n\n- **GIS StackExchange**：最受欢迎的支持渠道之一是\
  \ http://gis.stackexchange.com/。这是一个通用 GIS 问答网站。如果你使用标签 qgis，你将在 http://gis.stackexchange.com/questions/tagged/qgis\
  \ 上看到所有与 QGIS 相关的问答。\n- **邮件列表**：最重要的用户问题邮件列表是 qgis-user。有关可用邮件列表的完整列表和注册链接，请访问\
  \ http://www.qgis.org/en/site/getinvolved/mailinglists.html#qgis-mailinglists。为了更舒适地搜索现有的邮件列表线程，你可以使用\
  \ Nabble（http://osgeo-org.1560.x6.nabble.com/Quantum-GIS-User-f4125267.html）。\n\
  - **聊天**：大量开发者通信通过 IRC 进行。www.freenode.net 上有一个 #qgis 频道。你可以使用例如 http://webchat.freenode.net/?channels=#qgis\
  \ 的网页界面访问它。\n\n> 在联系社区支持之前，建议先查看 http://docs.qgis.org 上的文档。\n\n如果你更喜欢商业支持，你可以在 http://www.qgis.org/en/site/forusers/commercial_support.html#qgis-commercial-support\
  \ 上找到提供支持和定制开发的公司列表。\n\n如果你发现了错误，请报告它，因为 QGIS 开发者只能修复他们已知的问题。有关如何报告错误的信息，请访问 http://www.qgis.org/en/site/getinvolved/development/bugreporting.html。\n\
  \n## 摘要\n\n在本章中，我们安装了 QGIS 并通过选择有用的默认值和排列用户界面元素对其进行了配置。然后我们探索了构成 QGIS 用户界面的面板、工具栏和菜单，并学习了如何自定义它们以提高生产力。在下一章中，我们将使用\
  \ QGIS 从文件、数据库和网络服务等不同数据源查看空间数据，以便创建我们的第一张地图。\n\n## 2\n查看空间数据\n\n在本章中，我们将介绍如何从不同数据源查看空间数据。QGIS\
  \ 支持许多文件和数据库格式以及标准化的开放地理空间联盟（OGC）网络服务。我们首先介绍如何从这些不同数据源加载图层。然后我们将研究矢量和栅格图层样式的基础知识，并创建我们的第一张地图，你可以在以下屏幕截图中看到：\n\
  \n![](img/2e88bf5938bf48a409c0a534a8775b21_37_0.png)\n\n我们将以从在线服务加载背景地图的示例结束本章。\n\
  \n## 查看空间数据\n\n在本章的示例中，我们将使用 QGIS 项目提供的示例数据，可从 `http://qgis.org/downloads/data/qgis_sample_data.zip`（21\
  \ MB）下载。下载并解压它。\n\n## 从文件加载矢量数据\n\n在本节中，我们将讨论从 GIS 文件格式（如 **shapefiles**）以及从文本文件加载矢量数据。\n\
  \n我们可以通过前往 **图层 | 添加图层 | 添加矢量图层** 以及使用 **添加矢量图层** 工具栏按钮来加载矢量文件。如果你喜欢快捷方式，使用 *Ctrl\
  \ + Shift + V*。在 **添加矢量图层** 对话框中，如以下屏幕截图所示，我们会找到一个下拉列表，允许我们指定输入文件的编码。如果我们处理包含特殊字符的文件，例如德语变音符号或与默认拉丁字母不同的字母表中的字母，此选项很重要。\n\
  \n![](img/2e88bf5938bf48a409c0a534a8775b21_38_0.png)\n\n我们现在最感兴趣的是 **浏览** 按钮，它打开文件打开对话框。请注意对话框右下角的文件类型筛选器下拉列表。我们可以打开它以查看支持的矢量文件类型的列表。此筛选器有助于通过隐藏不同类型的文件更快地找到特定文件，但请注意筛选器设置会被保存，并在下次打开文件打开对话框时再次应用。如果以后尝试查找不同文件时它恰好被筛选器隐藏，这可能会导致混淆，因此如果定位文件有困难，请记得检查筛选器设置。\n\
  \n我们可以通过一次选择多个文件（在 Windows/Ubuntu 上按住 *Ctrl* 或在 Mac 上按住 *cmd*）一次加载多个文件。让我们试试：\n\n\
  1. 首先，我们从 shapefiles 示例数据文件夹中选择 `alaska.shp` 和 `airports.shp`。\n2. 接下来，我们通过单击 **打开**\
  \ 确认选择，并返回到 **添加矢量图层** 对话框。\n3. 在再次单击 **打开** 后，所选文件将被加载。你会注意到每个矢量图层都以随机颜色显示，这很可能与你在以下屏幕截图中看到的颜色不同。别担心，现在不用担心；我们将在本章后面处理图层样式。\n\
  \n![](img/2e88bf5938bf48a409c0a534a8775b21_39_0.png)\n\n即使我们没有使用任何空间分析工具，这些可视化空间数据集的简单步骤也使我们能够找到，例如，阿拉斯加本土最南端的机场。\n\
  \n> 有多种技巧可以使加载数据更快；例如，你可以简单地将文件从操作系统的文件浏览器拖放到 QGIS 中。\n> \n> 快速访问空间数据的另一种方法是使用 QGIS\
  \ 内置的文件 *浏览器*。如果你已按照 *第 1 章，开始使用 QGIS* 中的说明设置 QGIS，你将在图层列表正下方左侧找到浏览器。导航到你的数据文件夹，你可以再次将文件从浏览器拖放到地图上。\n\
  > \n> 此外，你可以通过右键单击文件夹并选择 **添加为收藏夹** 将文件夹标记为 *收藏夹*。这样，你可以更快地访问数据文件夹，因为它们会被添加到浏览器列表顶部\
  \ **收藏夹** 部分。\n\n\n\n\n\n## 查看空间数据\n\n另一种流行的空间数据源是 **分隔文本（CSV）** 文件。QGIS 可以通过菜单项进入\
  \ **图层 | 添加图层 | 添加分隔文本图层** 或对应的工具栏按钮，使用 **添加分隔文本图层** 选项加载 CSV 文件。点击 **浏览** 并从示例数据中选择\
  \ `elevp.csv`。CSV 文件包含各种分隔符。正如以下截图中所示，插件允许您从最常见的分隔符中选择（**逗号、制表符等等**），但您也可以指定任何其他纯文本或正则表达式分隔符：\n\
  \n![](img/2e88bf5938bf48a409c0a534a8775b21_40_0.png)\n\n如果您的 CSV 文件包含引号，例如 \" 或\
  \ '，您可以使用 **引号** 选项将其删除。 **丢弃的标题行数** 选项允许我们跳过文本文件开头可能存在的额外行。以下 **字段选项** 包括从字段值中修剪多余空格或重新定义小数分隔符为逗号的功能。空间信息本身可以提供在包含点\
  \ X 和 Y 坐标的两个列中，或使用 **众所周知的文本（WKT）** 格式。WKT 字段可以包含点、线或多边形。例如，一个点可以指定为 `POINT (30\
  \ 10)`，一条包含三个节点<|message|> 的简单线条将是 `LINESTRING (30 10, 10 30, 40 40)`，而一个包含四个节点的\
  \ fio 多边形将是 `POLYGON ((30 10, 40 40, 20 40, 10 20, 30 10))`。\n\n> 请注意，多边形中第一个和最后一个坐标对必须相同。\n\
  > WKT 是一种非常有用且灵活的格式。如果您不熟悉该概念，您可以在 http://en.wikipedia.org/wiki/Well-known_text\
  \ 上找到包含示例的详细介绍。\n\n在我们点击 **确定** 后，QGIS 会提示我们指定图层的坐标参考系统（CRS）。我们将在下一节讨论处理 CRS。\n\n\
  ## 处理坐标参考系统\n\n每当我们加载数据源时，QGIS 都会查找可用的 CRS 信息，例如 shapefile 的 `.prj` 文件中。如果 QGIS\
  \ 找不到任何可用信息，默认情况下，它会要求您手动指定 CRS。此行为可以通过进入 **设置 | 选项 | CRS** 来更改，以始终使用项目 CRS 或默认\
  \ CRS。\n\nQGIS **坐标参考系统选择器** 提供了一个过滤器，使查找 CRS 变得更容易。它可以根据名称或 ID（例如 EPSG 代码）进行过滤。只需开始输入，潜在\
  \ CRS 的列表就会变短。实际上有两个独立的列表；上面的列表包含我们最近使用的 CRS，而下面的列表更长，包含所有可用的 CRS。对于 `elevp.csv`\
  \ 文件，我们选择 **NAD27 / Alaska Albers**。使用正确的 CRS 后，`elevp` 图层将显示如下截图中所示：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_41_0.png)\n\
  \n## 查看空间数据\n\n如果我们想检查图层的 CRS，我们可以在图层属性的 **常规** 部分找到此信息，可以通过进入 **图层 | 属性** 或在图层列表中双击图层名称来访问。如果您认为\
  \ QGIS 选择了错误的 CRS 或您在指定 CRS 时犯了错误，您可以使用 **指定 CRS** 来更正 CRS 设置。请注意，这不会更改底层数据或对其进行重投影。我们将在\
  \ *第 3 章，数据创建和编辑* 中讨论矢量和栅格文件的重投影。\n\n在 QGIS 中，即使每个数据集都使用不同的 CRS 存储，我们也可以从多个图层创建地图。QGIS\
  \ 通过启用一种称为 **即时重投影** 的机制自动处理必要的重投影，可以通过进入 **项目 | 项目属性** 来访问，如以下截图中所示。或者，您可以点击 QGIS\
  \ 窗口右下角的 **CRS 状态** 按钮（带有地球符号和旁边的 EPSG 代码）来打开此对话框：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_42_0.png)\n\
  \n所有图层都会即时重投影到项目 CRS，这意味着 QGIS 会动态计算这些重投影，仅用于渲染地图的目的。这也意味着如果您使用需要重投影的大型数据集，可能会减慢您的机器速度。底层数据不会被更改，空间分析也不会受到影响。例如，下图显示了阿拉斯加在默认的\
  \ NAD27 / Alaska Albers 投影中的情况（左侧），即时重投影到 WGS84 EPSG:4326（中间），以及 Web Mercator EPSG:3857（右侧）。尽管地图表示发生了很大变化，但每个版本的分析结果都是相同的，因为即时重投影功能不会更改数据。\n\
  \n![](img/2e88bf5938bf48a409c0a534a8775b21_43_0.png)\n\n在某些情况下，您可能需要指定一个不在 QGIS\
  \ CRS 数据库中的 CRS。您可以通过进入 设置 | 自定义 CRS 来添加 CRS 定义。点击 添加新 CRS 按钮创建新条目，为新 CRS 输入名称，并在\
  \ 参数 输入字段中粘贴 proj4 定义字符串。此定义字符串由 Proj4 投影引擎使用，以确定正确的坐标转换。完成后，只需点击 确定 关闭对话框即可。\n\n\
  > 如果您正在寻找特定的投影 proj4 定义，http://spatialreference.org 是获取此类信息的好来源。\n\n## 加载栅格文件\n\n\
  加载栅格文件与加载矢量文件并没有太大区别。进入 图层 | 添加图层 | 添加栅格图层，点击 添加栅格图层 按钮，或按 Ctrl + Shift + R 快捷键将直接带您到文件打开对话框。同样，您可以检查文件类型过滤器以查看支持的文件类型列表。\n\
  \n## 查看空间数据\n\n让我们试试并从栅格示例数据文件夹加载 `landcover.img`。与矢量文件类似，您可以通过从操作系统或内置文件浏览器将栅格拖放到\
  \ QGIS 中来加载栅格。以下截图显示了已加载的栅格图层：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_44_0.png)\n\
  \n> QGIS 对所有这些不同的矢量和栅格文件类型的支持由强大的 GDAL/OGR 包处理。您可以在 `www.gdal.org/formats_list.html`（栅格）和\
  \ `http://www.gdal.org/ogr_formats.html`（矢量）查看完整支持的格式列表。\n\n## 地理配准栅格地图\n\n一些栅格数据源，例如简单的扫描地图，缺乏适当的空间参考，我们必须在\
  \ GIS 中使用它们之前对其进行地理配准。在 QGIS 中，我们可以使用 **Georeferencer GDAL** 插件进行栅格地理配准，可以通过进入 **栅格\
  \ | 地理配准器** 来访问。（如果您在 **栅格** 菜单中找不到它，请通过 **插件 | 管理和安装插件** 启用它）。\n\n地理配准器插件涵盖以下用例：\n\
  \n- 我们可以为栅格文件创建世界文件，而不更改原始栅格。\n- 如果我们有一张包含已知坐标点的地图图像，我们可以设置 **地面控制点（GCPs）** 并输入已知坐标。\n\
  - 最后，如果我们不知道地图上任何点的坐标，我们仍然有机会使用同一区域的第二张已地理配准的地图手动放置 GCP。我们可以使用在两张地图上都可见的对象来在我们想要地理配准的地图上选取点，并从参考地图中计算出它们的坐标。\n\
  \n通过进入 **文件 | 打开栅格** 或使用 **打开栅格** 工具栏按钮加载栅格到地理配准器后，我们会被要求指定我们计划添加的地面控制点的 CRS。接下来，我们可以通过进入\
  \ **编辑 | 添加点** 开始添加地面控制点。我们可以使用平移和缩放工具进行导航，并通过点击地图放置 GCP。然后会提示我们插入新点的坐标或从主 QGIS\
  \ 窗口中的参考地图中选取。放置的 GCP 在地理配准器和 QGIS 窗口中都显示为红色圆圈，如以下截图中所示：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_45_0.png)\n\
  \n地理配准器显示了 OCM 景观地图的截图 © Thunderforest，数据 © OpenStreetMap 贡献者 (http://www.opencyclemap.org/?zoom=4&lat=62.50806&lon=-145.01953&layers=0B000)\n\
  \n放置 GCP 后，我们可以通过进入 **设置 | 转换设置** 来定义转换算法。您选择的算法取决于输入数据和您希望允许的几何失真程度。最常用的算法是 1 到\
  \ 3 次多项式。 **一阶多项式转换** 仅允许缩放、平移和旋转。\n\n\n\n\n\n## 查看空间数据\n\n**二阶多项式变换**可以处理一定的弯曲，而**三阶多项式变换**因此能够应对更高程度的畸变。**薄板样条**算法可以处理地图中的局部变形，因此在处理质量极低的地图扫描件时非常有用。**投影变换**提供坐标的旋转和平移。另一方面，**线性**选项仅用于创建世界文件，如前所述，它实际上并不变换栅格。\n\
  \n**重采样方法**取决于您的输入数据和想要实现的结果。三次重采样会生成平滑的结果，但如果您不想更改栅格值，请选择最近邻法。\n\n在开始地理配准过程之前，我们必须指定输出文件名和目标CRS。确保**完成后在QGIS中加载**选项已激活，并启用**需要时使用0作为透明度**选项，以避免输出图像周围出现黑色边框。然后，我们可以关闭**转换设置**对话框，进入**文件\
  \ | 开始地理配准**。配准后的栅格将自动加载到QGIS的主地图窗口中。在下面的截图中，您可以看到使用五个指定的GCP应用投影变换的结果：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_46_0.png)\n\
  \n### 从数据库加载数据\n\nQGIS支持PostGIS、SpatiaLite、MSSQL和Oracle Spatial数据库。我们将介绍两种开源选项：SpatiaLite和PostGIS。两者都像QGIS一样支持跨平台。\n\
  \nSpatiaLite是SQLite数据库的空间扩展。SQLite是一个自包含、无需服务器、零配置且支持事务的SQL数据库引擎（www.sqlite.org）。这基本上意味着SQLite数据库（因此也包括SpatiaLite数据库）不需要安装服务器，并且可以像任何普通文件一样被复制和交换。\n\
  \n您可以从www.gaia-gis.it/spatialite-2.3.1/test-2.3.zip（4 MB）下载示例数据库。解压该文件后，您可以通过“图层\
  \ | 添加图层 | 添加SpatiaLite图层”菜单，使用“添加SpatiaLite图层”工具栏按钮，或按Ctrl + Shift + L连接它。点击“新建”以选择test-2.3.sqlite数据库文件。QGIS将保存所有连接并将它们添加到顶部的下拉列表中。点击“连接”后，您将看到存储在数据库中的图层列表，如以下截图所示：\n\
  \n![](img/2e88bf5938bf48a409c0a534a8775b21_47_0.png)\n\n与文件一样，您可以从列表中选择一个或多个表，然后点击“添加”将其加载到地图中。此外，您可以使用“设置过滤器”仅加载特定的要素。\n\
  \nQGIS中的过滤器使用类似SQL的语法，例如，\"Name\" = 'EMILIA-ROMAGNA' 仅选择名为 EMILIA-ROMAGNA 的区域，或\
  \ \"Name\" LIKE 'ISOLA%' 选择所有名称以 ISOLA 开头的区域。过滤查询会传递给底层数据提供者（例如SpatiaLite或OGR）。基本过滤器查询的提供者语法在不同提供者之间是一致的，但在使用更特殊的功能时可能会有所不同。您可以在\
  \ http://www.gdal.org/ogr_sql.html 阅读OGR SQL的详细信息。\n\n在*第4章“空间分析”*中，我们将使用这个数据库来探索如何利用SpatiaLite的空间分析功能。\n\
  \n**PostGIS**是PostgreSQL数据库系统的空间扩展。安装和配置数据库不在本书的讨论范围内，但有适用于Windows的安装程序以及适用于许多Linux发行版和Mac的软件包（详情请访问\
  \ http://www.postgresql.org/download/）。要从PostGIS数据库加载数据，请前往**图层 | 添加图层 | 添加PostGIS图层**，使用**添加PostGIS图层**工具栏按钮，或按*Ctrl\
  \ + Shift + D*。\n\n首次使用数据库时，点击**新建**以建立新的数据库连接。这将打开以下截图所示的对话框，您可以在其中创建新连接，例如连接到名为`postgis`的数据库：\n\
  \n![](img/2e88bf5938bf48a409c0a534a8775b21_48_0.png)\n\n需要填写的字段如下：\n\n- **名称：**\
  \ 为新连接输入名称。您可以使用任意喜欢的名称。\n- **主机：** 在此字段中插入服务器的IP地址。如果PostGIS在本地运行，可以使用`localhost`。\n\
  - **端口：** PostGIS默认端口为`5432`。如果连接数据库有困难，建议您检查服务器防火墙对此端口的设置。\n- **数据库：** 这是您要连接的PostGIS数据库的名称。\n\
  - **用户名和密码：** 为方便起见，您可以告诉QGIS保存这些信息。\n\n连接建立后，您可以加载和过滤表，就像我们讨论SpatiaLite时一样。\n\n\
  ### 从OGC Web服务加载数据\n\n越来越多的数据提供商通过符合OGC标准的Web服务提供对其数据集的访问，例如**Web地图服务（WMS）**、**Web覆盖服务（WCS）**或**Web要素服务（WFS）**。QGIS开箱即用地支持这些服务。\n\
  \n> 如果您想了解更多可用的不同OGC Web服务，请访问 http://live.osgeo.org/en/standards/standards.html\
  \ 查看概览。\n\n您可以通过**图层 | 添加WMS/WMTS图层**菜单、点击**添加WMS/WMTS图层**按钮或按*Ctrl + Shift + W*来加载**WMS**图层。如果您知道WMS服务器，可以点击**新建**并填写名称和URL来连接它。所有其他字段都是可选的。如果您不知道任何WMS服务器，也不用担心，因为您只需点击**添加默认服务器**按钮，即可获得管理员与QGIS项目协作的服务器访问信息。其中一台服务器称为**Lizardtech服务器**。从下拉框中选择**Lizardtech服务器**或任何其他服务器，然后点击**连接**以查看服务器可用的图层列表，如下所示：\n\
  \n![](img/2e88bf5938bf48a409c0a534a8775b21_50_0.png)\n\n现在，您可以从图层列表中选择一个或多个图层进行下载。值得注意的是，选择图层的顺序很重要，因为图层将在服务器端合并，QGIS只会收到合并后的图像作为结果图层。如果您希望单独使用这些图层，则必须逐一下载。一旦点击**添加**，数据下载随即开始。对话框将保持打开状态，以便您从服务器添加更多图层。\n\
  \n许多WMS服务器以多种不同的CRS提供其图层。您可以通过点击对话框底部的**更改**按钮查看可用CRS列表。这将打开一个CRS选择器对话框，该对话框仅限于WMS服务器的CRS能力。\n\
  \n从**WCS**或**WFS**服务器加载数据的方式相同，但公共服务器相当稀少。少数可靠的公共WFS服务器之一由奥地利维也纳市运营。以下截图显示了如何配置到data.wien.gv.at\
  \ WFS的连接，以及我们点击**连接**按钮时加载的可用数据集列表：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_51_0.png)\n\
  \n> 使用**WFS**而非**WMS**的主要优势在于，**Web要素服务**返回矢量要素（包括其所有属性），而不仅仅是地图图像。当然，这也意味着WFS图层通常需要更长的下载时间，并给服务器带来更大的负载。\n\
  \n### 栅格图层样式设置\n\n在介绍了数据源之后，我们可以创建第一张地图。我们将自下而上构建地图，首先加载一些背景栅格（山体阴影和土地覆盖），然后在其上叠加点、线和面图层。\n\
  \n让我们首先从`landcover.img`和`SR_50M_alaska_nad.tif`加载土地覆盖和山体阴影，然后打开图层属性中的**样式**部分（通过**图层\
  \ | 属性**或双击图层名称）。QGIS会自动为两个栅格图层选择合理的默认渲染类型。除了这些默认值外，栅格图层还可使用以下样式选项：\n\n- **多波段颜色：**\
  \ 如果栅格具有多个波段，则使用此样式。多波段的卫星图像通常属于这种情况。\n- **调色板：** 如果单波段栅格带有索引调色板，则使用此样式。\n- **单波段灰度：**\
  \ 如果栅格既没有多个波段也没有索引调色板（例如，高程模型栅格或山体阴影栅格），则将使用此样式渲染。\n- **单波段伪彩色：** 此样式不限于灰度，而是允许我们使用自选的色彩映射来渲染栅格波段。\n\
  \n`SR_50M_alaska_nad.tif`山体阴影栅格以**单波段灰度渲染类型**加载，如下面的截图所示。如果我们想用颜色而非灰度渲染山体阴影栅格，可以将**渲染类型**更改为**单波段伪彩色**。在伪彩色模式下，我们可以手动创建色彩映射，或者选择预制的色彩渐变之一。不过，让我们暂时对山体阴影坚持使用**单波段灰度**。\n\
  \n\n\n\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_53_0.png)\n\n**Singleband gray**\
  \ 渲染器提供 **Black to white Color gradient** 以及 **White to black gradient**。当我们使用 **Black\
  \ to white gradient** 时，最小值（在 **Min** 中指定）将被绘制为黑色，最大值（在 **Max** 中指定）将被绘制为白色，中间的所有值则以灰度显示。你可以手动指定这些最小值和最大值，或使用\
  \ **Load min/max values** 接口让 QGIS 计算这些值。\n\n> > 请注意，QGIS 提供了从整个栅格（**Full Extent**）或仅当前可见的栅格部分（**Current\
  \ Extent**）计算值的不同选项。一个常见的困惑来源是 **Estimate (faster)** 选项，它可能导致的值与别处记录的值不同，例如在栅格的元数据中。该选项的明显优势是计算速度更快，因此请谨慎使用！\n\
  \n# Viewing Spatial Data\n\n在颜色设置下方，我们找到一个包含更多高级选项的区域，这些选项控制栅格的 Resampling、Brightness、Contrast、Saturation\
  \ 和 Hue——这些选项你可能在图像处理软件中见过。默认情况下，重采样设置为快速的 Nearest neighbour 选项。为了获得更美观、更平滑的结果，我们可以改为\
  \ Bilinear 或 Cubic 方法。\n\n点击 OK 或 Apply 以确认。在这两种情况下，地图都将使用新的图层样式重绘。如果点击 Apply，图层属性对话框将保持打开状态，你可以继续微调图层样式。如果点击\
  \ OK，图层属性对话框将被关闭。\n\nlandcover.img 栅格是调色板栅格的一个很好的例子。每个单元格值都映射到特定颜色。要更改颜色，我们只需双击\
  \ Color 预览，一个颜色选择器就会打开。调色板栅格的样式部分如下图所示：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_54_0.png)\n\
  \n如果我们想将 hillshade 和土地覆盖组合成一个美观的背景，可以使用 **Blending mode** 和图层 **Transparency** 的组合。混合模式是图像处理软件中常见的另一项功能。混合模式相对于透明度的主要优势在于，我们可以避免仅使用透明度组合栅格时通常出现的暗淡、低对比度的外观。如果你没有混合的经验，花点时间尝试不同的效果。对于本示例，我使用了上一个截图中突出显示的\
  \ **Darken** 混合模式，并结合了全局图层透明度 **50 %**，如下图所示：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_55_0.png)\n\
  \n# Styling vector layers\n\n当我们加载矢量图层时，QGIS 使用默认样式和随机颜色渲染它们。当然，我们希望自定义这些样式以更好地反映我们的数据。在以下练习中，我们将对点、线和面图层进行样式设置，你也会熟悉最常见的矢量样式选项。\n\
  \n无论图层的几何类型如何，我们总会在 **Style** 对话框左上角找到一个包含可用样式选项的下拉列表。矢量图层可用的样式选项如下：\n\n- **Single\
  \ Symbol**：这是最简单的选项。当我们使用 **Single Symbol** 样式时，所有点都将以相同的符号显示。\n- **Categorized**：如果图层包含不同类别的点，例如包含不同动物目击地点的图层，这是首选样式。\n\
  - **Graduated**：如果我们想可视化数值，例如温度测量值，此样式非常好。\n- **Rule-based**：这是最先进的选项。基于规则的样式非常灵活，因为它允许我们为一个图层编写多个规则。\n\
  - **Point displacement**：此选项仅适用于点图层。这些样式在需要可视化同一坐标下有多个点的点图层时很有用，例如住在同一地址的学校学生。\n\
  - **Inverted polygons**：此选项仅适用于面图层。使用此选项，定义的符号将应用于多边形边界外的区域，而不是填充多边形内部的区域。\n- **Heatmap**：此选项仅适用于点图层。它使我们能够创建动态热力图样式。\n\
  - **2.5D**：此选项仅适用于面图层。它使我们能够创建 2.5 维的挤出多边形。\n\n# Creating point styles – an example\
  \ of an airport style\n\n让我们从一个点图层开始！从你的示例数据中加载 `airport.shp`。在 **Style** 对话框左上角，下拉列表下方，我们找到符号预览。在此下方，有一个符号图层列表，显示符号由哪些不同图层组成。右侧提供符号大小和大小单位、颜色和透明度以及旋转的选项。最后，右下角包含一个带有已保存符号的预览区域。\n\
  \n点图层默认使用简单的圆形符号显示。我们希望改用飞机符号。要更改符号，请在对话框左侧的符号图层列表中选择 **Simple marker** 条目。注意对话框右侧如何发生变化。我们现在可以看到简单标记可用的选项：**Colors,\
  \ Size, Rotation, Form** 等等。然而，我们不是在寻找圆形、星形或方形符号——我们想要一架飞机。这就是为什么我们需要将 **Symbol\
  \ layer type** 选项从 **Simple marker** 改为 **SVG marker**。许多选项仍然相似，但在底部，我们现在可以从中选择的\
  \ SVG 图像集合。滚动列表并选择飞机符号，如下图所示：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_57_0.png)\n\
  \n在我们继续进行线条样式之前，让我们先看看点的其他符号图层类型，包括以下内容：\n\n- **Simple marker**：包括几何形状，如圆形、星形和方形\n\
  - **Font marker**：提供对你符号字体的访问\n- **SVG marker**：每个 QGIS 安装都附带一组默认 SVG 符号；通过前往 **Settings\
  \ | Options | System | SVG Paths** 添加包含 SVG 图像的你自己的文件夹\n- **Ellipse marker**：包括可自定义的椭圆、矩形、十字和三角形\n\
  - **Vector Field marker**：这是一个可自定义的矢量场可视化工具\n- **Geometry Generator**：这使我们能够使用内置表达式引擎操作几何体，甚至创建全新的几何体\n\
  \n# Viewing Spatial Data\n\n**Simple marker** 图层可以具有不同的几何形状、大小、轮廓和角度（方向），如下图所示，我们创建了一个没有轮廓（使用\
  \ **No Pen** 选项）的红色正方形：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_58_0.png)\n\n\
  **Font marker** 图层对于添加来自计算机上安装的字体中的字母或其他符号很有用。例如，此屏幕截图显示了如何从 **Wingdings** 字体中添加阴阳符号：\n\
  \n![](img/2e88bf5938bf48a409c0a534a8775b21_58_1.png)\n\n**Ellipse marker** 图层使绘制不同的椭圆、矩形、十字和三角形成为可能，其中宽度和高度可以分别控制。此符号图层类型在与稍后我们将讨论的\
  \ *data-defined overrides* 结合使用时尤其有用。以下屏幕截图显示了如何创建一个长 5 毫米、高 2 毫米、旋转 45 度的椭圆：\n\n\
  ![](img/2e88bf5938bf48a409c0a534a8775b21_59_0.png)\n\n# Creating line styles – an\
  \ example of river or road styles\n\n在本练习中，我们为示例数据中的 majoriver.shp 文件创建河流样式。目标是创建一个具有两种颜色的线样式：线的中心填充色和轮廓色。这种技术非常有用，因为它也可以用于创建道路样式。\n\
  \n要创建此类样式，我们组合两条简单线条。默认符号是一条简单线条。点击符号图层列表下方左下角的绿色 + 符号以添加另一条简单线条。下方的线条将作为轮廓，上方的线条将作为填充。选择上方的简单线条并将颜色更改为蓝色，宽度更改为\
  \ 0.3 毫米。接下来，选择下方的简单线条并将其颜色更改为灰色，宽度更改为 0.6 毫米，略宽于另一条线条。检查预览并点击 Apply 以测试样式应用于河流图层时的效果。\n\
  \n\n\n\n你会注意到，样式看起来还不太完美。这是因为每个线要素都是单独绘制的，一个接一个，导致外观看起来相当不连贯。幸运的是，这很容易修复；我们只需启用所谓的符号级别。为此，请在符号图层列表中选择“线”条目，并在“高级”部分的“符号级别”对话框中勾选复选框（样式对话框右下角的按钮），如下面的截图所示。点击“应用”以测试结果。\n\
  \n![](img/2e88bf5938bf48a409c0a534a8775b21_60_0.png)\n\n在继续设计多边形样式之前，让我们看看线的其他符号图层类型，包括以下内容：\n\
  \n- **简单线**：这是一种实线或虚线\n- **标记线**：该线由位于线顶点或按固定间隔分布的点标记组成\n- **几何生成器**：这使我们能够操纵几何图形，甚至使用内置表达式引擎创建全新的几何图形。\n\
  \n每当我们创建了可能要在其他地图中重复使用的符号时，都可以通过单击符号预览区域下方的“保存”按钮来保存它。我们可以为新符号指定名称，保存后，它将添加到右侧的已保存符号预览区域中。\n\
  \n## 创建多边形样式——以陆地块样式为例\n\n在本练习中，我们将为 alaska.shp 文件创建一种样式。目标是创建带蓝色光晕的简单填充。与之前的河流样式示例一样，我们将组合两个符号图层来创建此样式：一个定义主填充颜色（白色）并带有细边框（灰色）的简单填充图层，以及一个用于（浅蓝色）光晕的附加简单线轮廓图层。光晕应具有漂亮的圆角。要实现这些效果，请将“简单线”符号图层的“连接样式”选项更改为“圆角”。与前面的示例类似，我们再次启用符号级别；为了防止此陆地块样式遮挡背景地图，我们选择“正片叠底”混合模式，如下面的截图所示：\n\
  \n![](img/2e88bf5938bf48a409c0a534a8775b21_62_0.png)\n\n在继续之前，让我们看看多边形的其他符号图层类型，包括以下内容：\n\
  \n- **简单填充**：这定义了填充和轮廓颜色以及基本填充样式\n- **质心填充**：这允许我们在多边形的中心放置点标记\n- **线/点图案填充**：这支持用户自定义的线和点图案，且间距灵活\n\
  - **SVG填充**：使用SVG填充多边形\n- **渐变填充**：这允许我们使用线性、径向或圆锥渐变填充多边形\n- **形状爆发填充**：这会创建一种从多边形边界开始并向中心流动的渐变\n\
  - **轮廓：简单线或标记线**：这可以使用线样式勾勒区域轮廓\n- **几何生成器**：这使我们能够操纵几何图形，甚至使用内置表达式引擎创建全新的几何图形。\n\
  \n点图案填充符号图层的一个常见用例是不同植被类型的地形符号，这些符号通常由简单填充图层和点图案填充组成，如下面的截图所示：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_63_0.png)\n\
  \n## 查看空间数据\n\n在设计点图案填充时，我们当然不限于简单的标记。我们可以使用任何其他标记类型。例如，下面的截图显示了如何使用**字体**标记图案创建多边形填充样式，该图案显示了来自**Webdings**字体的重复外星人脸：\n\
  \n![](img/2e88bf5938bf48a409c0a534a8775b21_64_0.png)\n\n作为仅使用单一颜色的简单填充的替代方案，我们可以创建**渐变**填充符号图层。渐变可以通过**两种颜色**定义，如下面的截图所示，也可以通过包含多种不同颜色的**色带**定义。通常，渐变从上到下运行，但我们可以更改这一点，例如，通过将**角度**设置为270度，使渐变从右到左运行，如下所示：\n\
  \n![](img/2e88bf5938bf48a409c0a534a8775b21_64_1.png)\n\n**形状爆发填充**符号图层类型，也称为“缓冲”渐变填充，通常用于样式化水域，使用从多边形边界向内流动的平滑渐变。下面的截图显示了使用**按设定距离着色**选项的固定距离着色。如果我们改为选择**为整个形状着色**，渐变将从多边形边界一直绘制到中心。\n\
  \n![](img/2e88bf5938bf48a409c0a534a8775b21_65_0.png)\n\n## 加载背景地图\n\n背景地图对于快速检查和提供方向非常有用，尤其是在无法访问任何其他基础图层的情况下。借助**QuickMapServices**插件，添加背景地图很容易。该插件提供了来自不同提供商的卫星地图、街道地图和混合地图。\n\
  \n如果你加载OSM TF Landscape图层，你的地图将如下面的截图所示：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_67_0.png)\n\
  \nQuickMapServices插件的替代方案是OpenLayers插件，它提供非常相似的功能，但提供的背景地图种类较少。\n\n## 处理项目文件\n\n\
  QGIS项目文件是可读的XML文件，文件名以 .qgs 结尾。你可以在任何文本编辑器（如Windows上的Notepad++或Ubuntu上的gedit）中打开它们，并读取甚至更改文件内容。\n\
  \n当你保存项目文件时，你会注意到QGIS会创建一个同名且以 .qgs~ 结尾的第二个文件，如下一个截图所示。这是项目文件的简单备份副本，内容相同。如果你的项目文件因任何原因损坏，你可以直接复制备份文件，从文件结尾删除\
  \ ~，然后继续使用它。\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_68_0.png)\n\n默认情况下，QGIS在项目文件中存储数据集的相对路径。如果你将项目文件（不包括关联的数据文件）移动到其他位置，QGIS将无法再定位数据文件，因此会显示以下“处理错误图层”对话框：\n\
  \n![](img/2e88bf5938bf48a409c0a534a8775b21_68_1.png)\n\n> 如果你处理的数据文件存储在网络驱动器上，而不是本地机器上，那么将存储相对路径改为存储绝对路径可能会很有用。你可以通过转到“项目\
  \ | 项目属性 | 常规”来更改此设置。\n\n要修复图层，你需要在**数据源**列中更正路径。这可以通过双击路径文本并输入正确路径来完成，也可以通过单击对话框底部的**浏览**按钮并在打开的文件对话框中选择新文件位置来完成。\n\
  \n> **QConsolidate**插件提供了一种将QGIS项目复制到其他计算机或与其他用户共享QGIS项目及相关文件的便捷方式。该插件收集项目中使用的所有数据集，并将它们保存到一个目录中，然后你可以轻松移动这些文件，而不会破坏任何路径。\n\
  \n![](img/2e88bf5938bf48a409c0a534a8775b21_69_0.png)\n\n## 总结\n\n在本章中，你学习了如何从文件、数据库和Web服务加载空间数据。我们了解了QGIS如何处理坐标参考系统，并介绍了矢量图层和栅格图层的样式设置，我们将在*第5章：创建精美地图*中更详细地讨论这一主题。我们还安装了第一个Python插件——QuickMapServices插件，并使用它将背景地图加载到项目中。最后，我们了解了QGIS项目文件以及如何高效地处理它们。在下一章中，我们将更详细地介绍如何创建和编辑栅格和矢量数据。\n\
  \n\n\n\n\n# 3\n\n## 数据创建与编辑\n\n在本章中，我们将首先创建一些新的矢量图层并解释如何选择要素和进行测量。随后我们将继续编辑要素几何和属性。之后，我们将对矢量和栅格数据进行重投影并在不同文件格式之间转换。我们还将讨论如何将文本文件和电子表格中的数据连接至我们的空间数据，以及如何使用临时草稿图层进行快速编辑工作。此外，我们还将查看常见的几何拓扑问题以及如何检测和修复它们，然后在本章结束时介绍如何将数据添加到空间数据库。\n\
  \n### 创建新的矢量图层\n\n在本练习中，我们将从头创建一个新图层。QGIS 提供了创建不同图层的广泛功能。图层下的新建菜单列出了创建新的 Shapefile\
  \ 和 SpatiaLite 图层所需的函数，但我们也可以使用 DB Manager 插件创建新的数据库表。界面略有不同，以便适应每种格式支持的功能。\n\n\
  让我们创建一些新的 Shapefile 来看看其工作原理：\n\n- 1. 新建 Shapefile 图层，可通过前往 图层 | 创建图层 或按 Ctrl +\
  \ Shift + N 访问，会打开新建矢量图层对话框，其中包含不同几何类型、CRS 和属性的选项。\n\n- 创建新的 Shapefile 非常快速，因为所有必填字段都已有默认值。默认情况下，该工具将在\
  \ WGS84（EPSG:4326）CRS 中创建一个新的点图层（除非在 设置 | 选项 | CRS 中另有指定）以及一个名为 id 的整数字段。\n\n- 2.\
  \ 保持所有默认值不变，我们只需单击 **OK** 并指定文件名即可。这将创建一个新的 Shapefile，新建的点图层会出现在图层列表中。\n- 3. 接下来，我们再创建一个线图层和一个面图层。我们将为这些图层添加一些额外字段。除了整数字段（仅用于整数）外，Shapefile\
  \ 还支持字符串（用于文本）、十进制数字（也称为实数）以及日期（采用 ISO 8601 格式，即 2016-12-24 表示 2016 年平安夜）。\n- 4.\
  \ 要添加字段，我们只需插入名称、选择类型和宽度，然后单击 **Add to fields list。**\n\n> 对于十进制数字，我们还必须定义 **Precision**\
  \ 值，该值决定小数点后的位数。**Length** 值为 3 且 **Precision** 值为 1 将允许的值范围为 -99.9 到 +99.9。\n\n\
  5. 下一截图左侧显示了用于创建我的示例面图层的 **New Vector Layer** 对话框，我将其命名为 `new_polygons`：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_72_0.png)\n\
  \n6. 所有新图层目前都是空的，但我们现在将创建一些要素。如果我们想向图层添加要素，首先必须为该特定图层启用编辑。编辑可以通过以下任一方式打开和关闭：前往 **Layer\
  \ | Toggle editing**，在图层名称上下文菜单中使用 **Toggle editing**，或单击 **Digitizing** 工具栏中的 **Toggle\
  \ editing** 按钮。\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_73_0.png)\n\n> 你会注意到图层列表中图层的图标会发生变化以反映编辑是否开启或关闭。当我们为图层打开编辑时，QGIS\
  \ 会自动启用适合该图层几何类型的数字化工具。\n\n7. 现在，我们可以使用编辑工具栏中的 **Add Feature** 工具创建新要素。要放置点，只需在地图上单击即可。然后会提示我们填写属性表单，你可以在上一张截图的右侧看到该表单，一旦我们单击\
  \ **OK**，新要素就会被创建。\n\n8. 与点类似，我们可以通过在地图上放置节点来创建新的线和面。要完成线或面，只需在地图上右键单击即可。在每个图层中创建一些要素，然后保存更改。我们可以在即将进行的练习中重用这些测试图层。\n\
  \n![](img/2e88bf5938bf48a409c0a534a8775b21_73_1.png)\n\n> 新要素和要素编辑只有在我们单击 **Digitizing**\
  \ 工具栏中的 **Save Layer Edits** 按钮后，或在完成编辑并确认要保存更改后才会永久保存。\n\n### 使用要素选择工具\n\n选择要素是任何\
  \ GIS 的核心功能之一，在我们进入编辑几何和属性之前，了解它们很有用。根据使用场景，**选择工具** 有多种不同类型。QGIS 提供了三种不同类型的工具，可使用鼠标、表达式或另一个图层来选择要素。\n\
  \n### 使用鼠标选择要素\n\n**Attributes** 工具栏中的第一组工具允许我们使用鼠标在地图上选择要素。以下截图显示了 **Select Feature(s)**\
  \ 工具。我们可以通过单击来选择单个要素，或通过绘制矩形来选择多个要素。其他工具可用于通过绘制不同形状（多边形、自由手绘区域或圆）围绕要素来选择要素。所有与绘制形状相交的要素都会被选中。\n\
  \n![](img/2e88bf5938bf48a409c0a534a8775b21_74_0.png)\n\n### 使用表达式选择要素\n\n第二种选择工具称为\
  \ **Select by Expression**，它也可在 **Attribute** 工具栏中使用。它基于可包含引用和函数的表达式来选择要素，这些引用和函数使用要素属性和/或几何。对话框中央可用函数的列表很长，但我们可以使用列表顶部的搜索框按名称过滤它，更快地找到所需函数。在窗口右侧，我们可以找到函数帮助，解释功能以及如何在表达式中使用函数。函数列表还显示图层属性字段，通过单击\
  \ **all unique** 或 **10 samples**，我们可以轻松访问其内容。我们可以选择创建新选择，或向现有选择添加或从中删除。此外，我们还可以选择仅从现有选择中选择要素。让我们看一些示例表达式，你可以基于这些表达式构建并在自己的工作中使用：\n\
  \n- 使用我们示例数据中的 `lakes.shp` 文件，我们例如可以通过使用简单的 `\"AREA_MI\" > 1000.0` 属性查询来选择面积大于 1,000\
  \ 平方英里的湖泊，如以下截图所示。或者，我们可以使用几何函数，例如 `$area > (1000.0 * 27878400)`。请注意，`lakes.shp`\
  \ CRS 使用英尺，因此我们必须乘以 27,878,400 将平方英尺转换为平方英里。\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_75_0.png)\n\
  \n- 我们也可以使用字符串函数，例如查找名称较长的湖泊（例如 length (\"NAMES\") > 12）或名称中包含 s 或 s 的湖泊（例如 lower\
  \ (\"NAMES\") LIKE '%s%'）；该函数首先将名称转换为小写，然后查找 s 的任何出现。\n\n### 使用空间查询选择要素\n\n第三种工具称为\
  \ Spatial Query，允许我们根据一个图层中要素相对于第二个图层中要素的位置来选择要素。这些工具可通过前往 Vector | Research Tools\
  \ | Select by location 和 Vector | Spatial Query | Spatial Query 访问。如果在 Vector 菜单中找不到它，请在插件管理器中启用它。一般来说，我们希望使用\
  \ Spatial Query 插件，因为它支持多种空间操作，例如 Crosses、Equals、Intersects、Is disjoint、Overlaps、Touches\
  \ 和 Contains，具体取决于图层几何类型。\n\n## 数据创建与编辑\n\n让我们使用示例数据中的 `railroads.shp` 和 `pipelines.shp`\
  \ 测试 Spatial Query 插件。例如，我们可能想要找到所有穿越管道的铁路要素；因此，我们选择 **railroads** 图层、**Crosses**\
  \ 操作和 **pipelines** 图层。单击 **Apply** 后，插件会向我们展示查询结果。窗口右侧有一个结果要素 ID 的列表，如下一张截图所示。在此列表下方，我们可以勾选\
  \ **Zoom to item** 框，QGIS 将放大到属于所选 ID 的要素。此外，插件还提供直接将所有结果要素保存到新图层的按钮：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_76_0.png)\n\
  \n\n\n\n## 编辑矢量几何\n\n既然我们已经知道如何创建和选择要素，现在可以更仔细地研究**数字化**工具栏和**高级数字化**工具栏中的其他工具。\n\
  \n### 使用基础数字化工具\n\n这是基本的数字化工具栏：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_77_0.png)\n\
  \n数字化工具栏包含用于创建和移动要素与节点，以及删除、复制、剪切和粘贴要素的工具，如下所示：\n\n- “添加要素”工具允许我们通过在地图上放置要素节点来创建新要素，这些节点由直线连接。\n\
  - 类似地，“添加圆弧”工具允许我们创建由曲线连接连续节点的要素。\n- 使用“移动要素”工具，可以轻松地一次将一个或多个要素拖到新位置。\n- 类似地，“节点”工具允许我们移动同一要素的一个或多个节点。第一次单击激活要素，第二次单击选择节点。按住鼠标按键将节点拖到新位置。除了只移动一个节点外，我们还可以通过单击并拖拽线段来移动边。最后，按住\
  \ Ctrl 键可以选中并移动多个节点。\n- “删除选中”、“剪切要素”和“复制要素”工具仅在一个或多个图层要素被选中时才可用。类似地，“粘贴要素”也仅在要素被剪切或复制之后才生效。\n\
  \n### 使用高级数字化工具\n\n**高级数字化**工具栏提供了非常有用的**撤销**和**重做**功能，以及用于更复杂几何编辑的附加工具，如下面的截图所示：\n\
  \n![](img/2e88bf5938bf48a409c0a534a8775b21_78_0.png)\n\n**高级数字化**工具包括以下内容：\n\n-\
  \ **旋转要素**使我们能够围绕中心点旋转一个或多个选定的要素。\n- 使用**简化要素**工具，我们只需单击要素并在弹出窗口中指定所需的容差，即可简化/概括要素几何形状，如下面的截图所示，在截图中可以看到左侧是原始几何，右侧是简化后的几何：\n\
  - 以下工具可用于修改多边形。它们允许我们在现有多边形中添加环（也称为*孔洞*），或为其添加部分。**填充环**工具与**添加环**类似，但它不只是创建一个孔洞，还会创建一个新要素来填充该孔洞。当然，也有用于删除环和部分的工具。\n\
  - **重塑要素**工具可用于通过剪切或添加片段来更改要素的几何形状。你可以通过在原要素内部开始绘制新形状来添加片段，或在外部开始绘制来剪切片段，从而控制该行为，如下面的示例图所示：\n\
  \n![](img/2e88bf5938bf48a409c0a534a8775b21_78_1.png)\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_78_2.png)\n\
  \n- **偏移曲线**工具仅适用于线，允许我们按给定的偏移量移动线几何。\n- **分割要素**工具允许我们沿剪切线将一个或多个要素分割为多个要素。类似地，**分割部分**允许我们将一个要素分割为多个部分，这些部分仍然属于同一个多多边形或多线段。\n\
  - **合并所选要素**工具使我们能够合并多个要素，同时控制输出要素中将保留哪些要素的属性。\n- 类似地，**合并所选要素的属性**也允许我们合并多个要素的属性，但不会将它们合并为一个要素。相反，所有原始要素保持原样；只是属性值得到更新。\n\
  - 最后，**旋转点符号**仅适用于启用了**旋转字段**功能的点图层（我们将在*第5章 创建精彩地图*中介绍此功能）。\n\n### 使用捕捉来确保拓扑正确的编辑\n\
  \n手动数字化要素时的挑战之一是避免出现不想要的间隙或要素重叠。为了更容易避免这些问题，QGIS 提供了**捕捉**功能。要配置捕捉，我们前往**设置 | 捕捉选项**。下面的截图显示了如何为**当前图层**启用捕捉。类似地，你可以为**所有图层**选择捕捉模式，或选择**高级**模式，在该模式中可以分别控制每个图层的设置。在下面截图的示例中，我们启用了**按顶点**捕捉。这意味着数字化工具将自动捕捉到当前图层中现有要素的顶点/节点。类似地，你可以启用**按线段**或**按顶点和线段**捕捉。在数字化过程中启用捕捉后，每当靠近可以捕捉的顶点或线段时，你都会注意到出现粗体的十字形标记：\n\
  \n![](img/2e88bf5938bf48a409c0a534a8775b21_79_0.png)\n\n### 使用测量工具\n\n任何 GIS 的另一个核心功能由**测量工具**提供。在\
  \ QGIS 中，我们可以在**属性**工具栏中找到测量线、面积和角度所需的工具，如下面的截图所示：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_80_0.png)\n\
  \n当我们绘制测量线、面积或角度时，测量值会不断更新。当我们绘制一条包含多个线段的线时，工具会显示每个线段的长度以及所有线段的总长度。要停止测量，只需右键单击即可。如果我们想将测量单位从米改为英尺，或从度改为弧度，可以通过前往**设置\
  \ | 选项 | 地图工具**来完成。\n\n### 编辑属性\n\n属性编辑主要有三种用例：\n\n- 首先，我们可能希望编辑特定要素的属性，例如修正错误的名称。\n\
  - 其次，我们可能希望编辑一组要素的属性。\n- 第三，我们可能希望更改图层中所有要素的属性。\n\n### 在属性表中编辑属性\n\n这三种用例都可以通过**属性表**提供的功能来满足。我们可以通过前往**图层\
  \ | 打开属性表**、使用**属性**工具栏中的**打开属性表**按钮，或通过图层名称的上下文菜单来访问它。\n\n1. 要更改属性值，我们必须首先启用编辑。\n\
  2. 然后，我们可以双击属性表中的任意单元格来激活输入模式，如下面的截图上方对话框所示，我正在编辑第一个要素的 NAME_2：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_81_0.png)\n\
  \n3. 按 Enter 键确认更改，但要永久保存新值，我们还需要单击“保存编辑”按钮或按 Ctrl + S。\n\n除了经典的属性表视图外，QGIS 还支持表单视图，您可以在上图的底部对话框中看到它。您可以使用属性表对话框右下角的按钮在这两种视图之间切换。\n\
  \n> 在属性表中，我们还可以找到用于处理选择的工具（从左到右，从第四个按钮开始）：**删除所选要素**、**使用表达式选择要素**、**取消全选**、**将选择项移到顶部**、**反转选择**、**将地图平移到所选行**、**将地图缩放到所选行**，以及**将所选行复制到剪贴板**。在属性表中选择要素的另一种方法是单击行号。\n\
  >\n> 接下来的两个按钮允许我们添加和删除列。当我们单击**删除列**按钮时，会出现一个列列表供我们选择。类似地，**新建列**按钮会弹出一个对话框，我们可以使用该对话框指定新列的名称和数据类型。\n\
  \n### 在要素表单中编辑属性\n\n另一种编辑单个要素属性的方法是使用**识别工具**直接单击地图上的要素来打开**属性表单**。默认情况下，**识别工具**以只读模式显示属性值，但我们可以在**识别结果**面板中启用**自动打开表单**选项，如下所示：\n\
  \n![](img/2e88bf5938bf48a409c0a534a8775b21_82_0.png)\n\n在上面的截图中看到的是 QGIS 自动创建的默认要素属性表单，但我们并不局限于这个基本表单。通过前往**图层属性\
  \ | 字段**部分，我们可以更详细地配置表单的外观和感觉。**属性编辑器布局**选项（按复杂程度递增）包括**自动生成**、**拖放设计器**以及提供**.ui**文件。这些选项将在下面详细描述。\n\
  \n\n\n## 使用自动生成创建要素表单\n\n自动生成是最基本的选项。你可以为每个字段指定特定的编辑控件和别名；这将替换表单中的默认输入字段和标签。在本例中，我们使用以下编辑控件类型：\n\
  \n- **文本编辑**支持插入一行或多行文本。\n- **唯一值**创建下拉列表，允许用户选择属性表中已使用过的值之一。如果启用了**可编辑**选项，下拉列表将被替换为支持自动补全的文本编辑控件。\n\
  - **范围**为特定范围内的数值创建编辑控件。\n\n> 有关可用编辑控件类型的完整列表，请参阅用户手册：http://docs.qgis.org/2.2/en/docs/user_manual/working_with_vector/vector_properties.html#fields-menu。\n\
  \n## 使用拖放设计器设计要素表单\n\n这样可以更好地控制表单布局。正如下一张截图所示，设计器允许我们在表单内创建选项卡，并且还可以改变表单字段的顺序。工作流程如下：\n\
  \n1. 点击加号按钮添加一个或多个选项卡（例如，一个**区域**选项卡，如下图所示）。\n2. 在对话框左侧，选择要添加到表单的字段。\n3. 在右侧，选择要添加字段的选项卡。\n\
  4. 点击带有指向右侧箭头的图标按钮，将所选字段添加到所选选项卡中。\n\n5. 你可以使用向上和向下箭头按钮重新排序表单中的字段，或者，顾名思义，通过向上或向下拖放字段来重新排序：\n\
  \n![](img/2e88bf5938bf48a409c0a534a8775b21_84_0.png)\n\n## 使用 .ui 文件设计要素表单\n\n这是最高级的选项。它允许你使用\
  \ Qt 用户界面，例如使用 Qt Designer 软件设计的界面。这为设计表单布局和行为提供了极大的自由度。\n\n> 创建 .ui 文件超出了本书的范围，但你可以在\
  \ http://docs.qgis.org/2.2/en/docs/training_manual/create_vector_data/forms.html#hard-fa-creating-a-new-form\
  \ 找到更多相关信息。\n\n## 计算新属性值\n\n如果我们想要更改图层中多个或全部要素的属性，通常手动编辑不可行。这正是**字段计算器**的用武之地。我们可以通过属性表中的**打开字段计算器**按钮访问它，或按\
  \ *Ctrl + I* 快捷键。在**字段计算器**中，我们可以选择仅更新所选要素或更新图层中的所有要素。除了更新现有字段，我们还可以创建新字段。函数列表与之前通过表达式选择要素时探索的列表相同。我们可以使用该列表中的任何函数和变量来填充新字段或更新现有字段。以下是一些常用示例表达式：\n\
  \n- 我们可以使用 `@row_number` 变量创建一个连续的 `id` 列，它会用行号填充列，如下一张截图所示：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_85_0.png)\n\
  \n- 另一个常见用例是分别使用 `$length` 和 `$area` 几何函数计算线段的长度或多边形的面积\n- 类似地，我们可以使用 `$x` 和 `$y`\
  \ 获取点的坐标\n- 如果我们想获取线段的起点或终点，可以分别使用 `$x_at(0)` 和 `$y_at(0)`，或 `$x_at(-1)` 和 `$y_at(-1)`）\n\
  \n**字段计算器**的替代方案——特别是当你已经知道要使用的公式时——是字段计算器栏，它直接位于**属性表**对话框的工具栏下方。在下一张截图中，你可以看到一个计算所有人口普查区域面积的示例（首先使用**新建字段**按钮添加一个名为\
  \ `CENSUSAREA` 的**十进制数字字段**）。此示例使用 `CASE WHEN – THEN – END` 表达式来检查 `TYPE_2` 的值是否为\
  \ `Census Area`：\n\n```\nCASE WHEN TYPE_2 = 'Census Area' THEN $area / 27878400\
  \ END\n```\n\n> 另一种替代方案是使用 `if()` 函数。如果你将 `CENSUSAREA` 属性作为第三个参数（该参数定义条件评估为 false\
  \ 时返回的值），则该表达式将仅更新 `TYPE_2` 为 Census Area 的行，并保持其他行不变：\n> \n> ```text\n> if(TYPE_2\
  \ = 'Census Area', $area / 27878400, CENSUSAREA)\n> ```\n> \n> 或者，你可以使用 `NULL` 作为第三个参数，这将用\
  \ `NULL` 覆盖所有 `TYPE_2` 不等于 Census Area 的行：\n> \n> ```text\n> if(TYPE_2 = 'Census\
  \ Area', $area / 27878400, NULL)\n> ```\n\n输入公式并点击**更新全部**按钮执行它：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_86_0.png)\n\
  \n由于无法直接在 Shapefile 或 SpatiaLite 属性表中*更改字段数据类型*，因此字段计算器和计算器栏也用于创建具有所需属性的新字段，然后使用原始列中的值填充它们。\n\
  \n## 重投影和转换矢量及栅格数据\n\n在*第 2 章，查看空间数据*中，我们讨论了 CRS，以及 QGIS 提供即时重投影，从而将存储在不同 CRS 中的空间数据集显示在同一地图上。尽管如此，在某些情况下，我们可能希望永久重投影数据集，例如以便后续进行地理处理。\n\
  \n在 QGIS 中，重投影矢量或栅格图层只需使用新的 CRS 保存即可。我们可以通过转到**图层 | 另存为...**或使用图层名称上下文菜单中的**另存为...**来保存图层。选择目标文件格式和文件名，然后点击\
  \ CRS 下拉字段旁边的**选择 CRS**按钮来选取新的 CRS。\n\n除了更改 CRS 外，**保存矢量/栅格图层**对话框的主要用途（如下图所示）是不同文件格式之间的转换。例如，我们可以加载\
  \ Shapefile 并将其导出为 GeoJSON、MapInfo MIF、CSV 等，反之亦然。\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_87_0.png)\n\
  \n**保存栅格图层**对话框也是通过边界框裁剪/剪裁栅格的便捷方式，因为我们可以指定要保存的**范围**。\n\n此外，**保存矢量图层**对话框具有**仅保存所选要素**选项，该选项允许我们只保存所选要素，而不是图层中的所有要素（仅当图层中确实存在所选要素时，此选项才会激活）。\n\
  \n> \U0001F4A1 启用**将保存的文件添加到地图**非常方便，因为这省去了保存后手动加载新文件的麻烦。\n\n## 连接表格数据\n\n在许多实际场景中，我们会以电子表格或文本文件的形式获得额外的非空间数据。好消息是，我们可以通过将\
  \ XLS 文件从文件浏览器中拖入 QGIS，或使用**添加矢量图层**来加载它们。不要被这个措辞迷惑！即使文件中没有任何几何数据，它也确实有效。文件甚至可以包含多个表。你将看到以下对话框，它让你选择要加载的表：\n\
  \n![](img/2e88bf5938bf48a409c0a534a8775b21_88_0.png)\n\nQGIS 会自动识别 XLS 表中列的名称和数据类型。这很容易判断，因为数值在属性表中右对齐，如以下截图所示：\n\
  \n![](img/2e88bf5938bf48a409c0a534a8775b21_88_1.png)\n\n我们也可以从带分隔符的文本文件加载表格数据，如我们在第\
  \ 2 章“查看空间数据”中所见，当时我们从带分隔符的文本文件加载了一个点图层。要加载仅包含表格数据但没有几何信息的带分隔符文本文件，我们只需启用“无几何图形（仅属性表）”选项。\n\
  \n## 在图层属性中设置连接\n\n在从电子表格或文本文件加载表格数据后，我们可以继续将此非空间数据连接到矢量图层（例如，我们示例中的 airports.shp\
  \ 数据集）。为此，我们进入矢量的图层属性 | 连接部分。在这里，我们可以通过点击绿色加号按钮添加新的连接。我们只需选择表格连接图层和连接字段（来自表格图层），其值将与目标字段（来自矢量图层）中的值匹配。此外，如果需要，我们可以通过启用“选择要连接的字段”选项来选择要连接的字段子集。例如，以下截图中的设置将只添加“some\
  \ value”字段。此外，我们使用自定义字段名前缀，而不是使用整个连接图层名称（默认选项）。\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_89_0.png)\n\
  \n\n\n\n## 在属性表中检查连接结果\n\n连接添加后，我们可以看到扩展后的属性表，并使用新添加的属性（如以下屏幕截图所示）进行样式设置和标注。QGIS\
  \ 中连接的工作方式如下：连接图层的属性会被追加到原始图层的属性表中。原始图层中的要素数量不会改变。每当连接字段与目标字段匹配时，属性值会被填入；否则，你会看到\
  \ NULL 条目。\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_90_0.png)\n\n你可以使用另存为...永久保存已连接的图层以创建新文件。\n\
  \n## 使用临时草图图层\n\n当你只是想快速在地图上绘制一些要素时，临时草图图层是无需担心临时数据的文件格式和位置即可实现此目的的绝佳方式。转到图层 | 创建图层\
  \ | 新建临时草图图层...即可创建新的临时草图图层。如以下屏幕截图所示，我们配置此临时图层所需做的全部就是选择几何图形的类型、图层名称和 CRS。一旦图层创建完成，我们就可以像处理任何其他矢量图层一样添加要素和属性：\n\
  \n![](img/2e88bf5938bf48a409c0a534a8775b21_91_0.png)\n\n顾名思义，临时草图图层是临时的。这意味着在你关闭项目时它们会消失。\n\
  \n如果你想保留临时图层的数据，可以使用另存为...创建文件，或安装 Memory Layer Saver 插件，该插件会使具有内存数据源的图层（如临时草图图层）持久化，以便在关闭并重新打开项目时恢复。内存提供者数据以便携式二进制格式保存，并以\
  \ .mldata 扩展名与项目文件一起保存。\n\n## 检查拓扑错误并修复它们\n\n有时，我们从不同来源接收的数据或由一系列空间处理步骤产生的数据可能会存在问题。拓扑错误尤其令人烦恼，因为它们在使用数据进行分析和进一步空间处理时可能导致多种不同的问题。因此，拥有能够检查数据拓扑错误的工具并知道如何修复发现的错误非常重要。\n\
  \n### 使用拓扑检查器查找错误\n\n在 QGIS 中，我们可以使用 **Topology Checker** 插件；它默认已安装，可通过 **Vector**\
  \ 菜单 **Topology Checker** 条目访问（如果找不到菜单条目，你可能需要在 **Plugin Manager** 中启用该插件）。激活插件后，它会在\
  \ QGIS 窗口中添加一个 **Topology Checker Panel**。此面板可用于配置和运行不同的拓扑检查，并列出检测到的错误。\n\n为了演示\
  \ **Topology Checker** 的使用，我们创建一个具有多边形几何的临时草图图层并数字化一些多边形，如以下屏幕截图所示。请确保使用捕捉功能创建相触但不重叠的多边形。这些例如可以代表一组排屋。当多边形准备就绪后，我们可以设置想要检查的拓扑规则。点击\
  \ **Topology Checker Panel** 中的 **Configure** 按钮打开 **Topology Rule Settings** 对话框。在这里，我们可以管理项目数据的所有拓扑规则。例如，在以下屏幕截图中，你可以看到我们可能为多边形图层配置的规则，包括：\n\
  \n- 多边形 *不得重叠*\n- 多边形之间不得有间隙\n- 不应有重复的几何图形\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_92_0.png)\n\
  \n设置好规则后，我们可以关闭设置对话框并点击 **Topology Checker Panel** 中的 **Validate All** 按钮开始运行 **topology**\
  \ 规则检查。如果你创建多边形时足够仔细，检查器将找不到任何错误，**Topology Checker Panel** 底部的状态将显示此消息：**0 errors\
  \ were found**。让我们通过引入一些 **topology errors** 来改变这种情况。\n\n例如，如果我们移动一个顶点使两个多边形重叠，然后点击\
  \ **Validate All**，我们会得到下一张屏幕截图中显示的错误。请注意，错误类型以及受影响的图层和要素会显示在 **Topology Checker\
  \ Panel** 中。此外，由于启用了 **Show errors** 选项，有问题的几何部分会在地图上以红色高亮显示：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_93_0.png)\n\
  \n当然，也可以创建描述不同图层中要素之间关系的规则。例如，以下屏幕截图显示了一个点图层和一个多边形图层，其中规则规定每个点都应位于多边形内部，每个多边形都应包含一个点：\n\
  \n![](img/2e88bf5938bf48a409c0a534a8775b21_93_1.png)\n\n### 修复无效几何错误\n\n从面板中的错误列表中选择一个错误，地图会居中到有问题的区域，以便我们可以开始修复它，例如，通过将孤立点移动到空多边形中。\n\
  \n有时，手动修复所有错误可能需要大量工作。幸运的是，某些错误可以自动处理。例如，常见的 **self-intersecting polygons** 错误会导致\
  \ *invalid geometry* 错误（如以下屏幕截图所示），通常是由于多边形节点或边相交造成的。这些问题通常可以使用缓冲区工具解决，例如 **Processing\
  \ Toolbox** 中的 **Fixed distance buffer**，我们将在 *Chapter 4, Spatial Analysis* 中更详细地讨论，缓冲区\
  \ **Distance** 设置为 0。缓冲例如会修复以下屏幕截图左侧的自相交多边形，通过移除自相交节点并构建一个带孔的有效多边形（如右侧所示）：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_94_0.png)\n\
  \n另一个可以自动修复的常见问题是所谓的 **sliver polygons**。这些是面积很小且通常很薄的多边形，可能是空间处理过程（如相交操作）的结果。为了消除这些细长多边形，我们可以使用\
  \ **v.clean** 工具，并将 **Cleaning tool** 选项设置为 **rmarea**（意为“移除面积”），该工具也可通过 **Processing\
  \ Toolbox** 使用。在本屏幕截图所示的示例中，**Threshold** 值 10000 指示工具移除面积小于 10,000 平方米的所有多边形，并将其与具有最长公共边界的相邻多边形合并：\n\
  \n![](img/2e88bf5938bf48a409c0a534a8775b21_95_0.png)\n\n> 有关 **Processing Toolbox**\
  \ 的全面介绍和更多详细信息，请参阅 *Chapter 4, Spatial Analysis.*\n\n## 向空间数据库添加数据\n\n在 *Chapter\
  \ 2, Viewing Spatial Data* 中，我们看到了如何查看来自空间数据库的数据。当然，我们也希望能够向数据库中添加数据。这时 DB Manager\
  \ 插件就派上用场了。DB Manager 默认已安装，你可以在数据库菜单中找到它（如果数据库菜单中看不到 DB Manager，你可能需要在插件管理器中激活它）。\n\
  \nDB Manager 对话框左侧的树形面板列出了迄今为止配置的所有可用数据库连接。由于我们在 *Chapter 2, Viewing Spatial Data*\
  \ 中添加了对 test-2.3.sqlite SpatiaLite 数据库的连接，因此该连接在 DB Manager 中列出，如下一张屏幕截图所示。\n\n\
  要向此数据库添加新数据，我们只需从可用连接列表中选择该连接，然后转到表 | 导入图层/文件。这将打开导入矢量图层对话框，在此我们可以配置导入设置，例如要创建的表的名称以及其他选项，包括输入数据\
  \ CRS（源 SRID 选项）和表 CRS（目标 SRID 选项）。通过启用这些 CRS 选项，我们可以在导入时重投影数据。在以下屏幕截图所示的示例中，我们从\
  \ Shapefile 导入城市区域，并将数据从 EPSG:4326（WGS84）重投影到 EPSG:32632（WGS 84 / UTM zone 32N），因为这是已存在表所使用的\
  \ CRS：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_96_0.png)\n\n\n\n\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_97_0.png)\n\
  \n将数据导入数据库的一个便捷快捷方式是将文件从主窗口的**浏览器**面板直接拖放到**数据库管理器**中列出的数据库。这甚至支持一次拖放多个选中的文件（在Windows/Ubuntu上按住*Ctrl*键，或在Mac上按住*cmd*键，可以在**浏览器**面板中选择多个文件）。将文件拖放到目标数据库后，会出现**导入矢量图层**对话框，您可以在其中配置导入。\n\
  \n## 小结\n\n在本章中，您学习了如何从零开始创建新图层。我们使用了一系列工具，以不同方式创建和编辑要素几何。然后，我们深入探讨了编辑单个要素、要素选择和整个图层的属性。接下来，我们重新投影了矢量和栅格图层，并学习了如何在不同文件格式之间转换。我们还介绍了表格数据以及如何将其加载并连接到空间数据。此外，我们探讨了临时草稿图层的使用，并讨论了如何检查数据中的拓扑错误并修复它们。最后，我们以将新数据导入数据库的示例结束了本章。\n\
  \n在下一章中，我们将充分利用数据，了解如何对栅格和矢量数据执行不同类型的空间分析。我们还将更仔细地了解**处理工具箱**，它在本章中首次出现。您将学习如何使用这些工具并将其组合以创建自动化工作流。\n\
  \n## 空间分析\n\n在本章中，我们将使用 QGIS 执行许多典型的地理处理与空间分析任务。我们将从栅格处理和分析任务开始，例如裁剪和地形分析。我们将介绍栅格与矢量格式转换的基本要素，然后继续讨论常见的矢量地理处理任务，例如生成热力图和计算区域内面积占比。我们还将使用处理建模器创建自动化的地理处理工作流。最后，本章将以示例结束，展示如何利用空间数据库的强大功能在\
  \ QGIS 中分析空间数据。\n\n### 分析栅格数据\n\n栅格数据（包括但不限于高程模型或遥感影像）常用于许多分析中。以下练习展示了常见的栅格处理与分析任务，例如裁剪到特定范围或掩膜、从数字高程模型创建晕渲和坡度栅格，以及使用栅格计算器。\n\
  \n### 裁剪栅格\n\n栅格处理中的一项常见任务是使用多边形裁剪栅格。**栅格 | 提取 | 裁剪器**中的**裁剪器**工具可以很好地完成此任务。该工具支持裁剪到指定的**范围**以及使用多边形**掩膜**图层进行裁剪，如下所示：\n\
  \n- **范围**可以手动设置，也可以通过在地图中进行选择来设置。为此，我们只需单击并拖动鼠标，在主 QGIS 窗口的地图区域中绘制一个矩形。\n- 掩膜图层可以是项目中当前加载的任何多边形图层，也可以是任何其他多边形图层，可通过**掩膜图层**下拉列表右侧的**选择...**来指定。\n\
  \n如果我们只想将栅格裁剪到某个范围（当前地图视图范围或任何其他范围），还可以使用栅格的**另存为...**功能，如*第3章“数据创建与编辑”*所示。\n\n\
  为了快速练习，我们将使用阿拉斯加 Shapefile（两者均来自我们的示例数据）作为掩膜图层来裁剪山体阴影栅格（`SR_50M_alaska_nad.tif`）。如下图所示，在窗口底部我们可以看到\
  \ QGIS 用于裁剪栅格的具体 `gdalwarp` 命令。如果您还想学习如何使用 **GDAL**，这将非常有用。\n\n在*第2章“查看空间数据”*中，我们讨论了\
  \ GDAL 是 QGIS 用于读取和处理栅格数据的库之一。您可以在 http://www.gdal.org/gdal_utilities.html 找到 gdalwarp\
  \ 以及所有其他 GDAL 实用程序的文档。\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_100_0.png)\n\n\
  默认的**无数据值**是输入数据集中使用的无数据值，如果未指定则为**0**，但如有必要我们可以覆盖它。另一个好选项是**创建输出 alpha 波段**，这将把掩膜之外的所有区域设置为透明。这会为输出栅格添加一个额外的波段，用于控制渲染栅格单元的透明度。\n\
  \n一个常见的错误来源是忘记在输出文件路径中添加文件格式扩展名（在我们的示例中，GeoTIFF 使用 .tif）。同样，如果您尝试覆盖现有文件，也可能会出错。在这种情况下，修复错误的最佳方法是选择不同的文件名，或先删除现有文件。\n\
  \n由于我们启用了“完成后加载到画布”选项，生成的图层将自动加载。QGIS 还应自动识别我们创建的 alpha 图层，并且落在阿拉斯加陆地之外的栅格区域应透明，如前面截图的右侧所示。如果由于某种原因\
  \ QGIS 无法自动识别 alpha 图层，我们可以使用栅格图层属性“透明度”部分中的“透明度波段”选项手动启用它，如下一张截图所示。此对话框也是指定我们可能想要使用的任何“无数据值”的正确位置：\n\
  \n![](img/2e88bf5938bf48a409c0a534a8775b21_101_0.png)\n\n### 分析高程/地形数据\n\n要使用地形分析工具，我们需要一个高程栅格。如果您手头没有，可以直接从\
  \ NASA 航天飞机雷达地形测绘任务（SRTM）使用 http://dwtkns.com/srtm/ 或任何其他 SRTM 下载服务下载数据集。\n\n如果您想精确复现以下练习中的结果，请获取名为\
  \ srtm_05_01.zip 的数据集，它覆盖阿拉斯加的一小部分。\n\n虽然晕渲图主要是用于可视化目的的三波段栅格，但坡度栅格则是空间分析工作流中常见的中间步骤。我们现在将创建一个坡度栅格，以便在以下各节的示例工作流中使用。生成的坡度栅格将自动以灰度加载，如以下截图所示：\n\
  \n![](img/2e88bf5938bf48a409c0a534a8775b21_104_0.png)\n\n### 使用栅格计算器\n\n使用栅格计算器，我们可以根据当前\
  \ QGIS 项目中加载的一个或多个栅格中的值创建新的栅格图层。要访问它，请转到“栅格 | 栅格计算器”。对话框中左上角的列表中会显示所有可用的栅格波段，格式为\
  \ 栅格_名称@波段_编号。\n\n继续我们之前创建坡度栅格的练习，例如，我们可以使用以下表达式找到海拔超过 1,000 米且坡度小于 5 度的区域：\n\n\
  ```\n\"srtm_05_01@1\" > 1000 AND \"slope@1\" < 5\n```\n\n> 根据您使用的数据集，您可能需要调整这些值。请参阅本章后面的“访问栅格和矢量图层统计信息”一节，了解如何查找栅格中的最小值和最大值。\n\
  \n同时满足高海拔和坡度平缓这两个条件的像元，在生成的栅格中将被赋值为 1，而只要不满足任一条件的像元将被设置为 0。值为 1 的较大区域仅出现在栅格图层的南部。您可以在以下截图的右侧看到结果栅格的一部分（以黑色显示在晕渲图层上）：\n\
  \n![](img/2e88bf5938bf48a409c0a534a8775b21_105_0.png)\n\n另一个典型用例是重分类栅格。例如，我们可能希望重分类示例数据中的\
  \ landcover.img 栅格，使所有 landcover 类别为 1 到 5 的区域获得值 100，6 到 10 的区域获得 101，11 以上的区域获得新值\
  \ 102。我们将使用以下代码：\n\n```\n(\"landcover@1\" > 0 AND \"landcover@1\" <= 6 ) * 100\n\
  + (\"landcover@1\" >= 7 AND \"landcover@1\" <= 10 ) * 101\n+ (\"landcover@1\" >=\
  \ 11 ) * 102\n```\n\n\n\n\n\n前面的栅格计算器表达式包含三个部分，每部分都由一个检查和一个乘法组成。对于每个像元，三个检查中只有一项可以为真，而真表示为\
  \ 1。因此，如果一个土地覆盖像元的值为 4，则第一个检查为真，表达式的计算结果为 1*100 + 0*101 + 0*102 = 100。\n\n## 结合栅格和矢量数据\n\
  \n某些分析需要栅格和矢量数据的结合。在下面的练习中，我们将同时使用栅格和矢量数据集来说明如何在这些不同数据类型之间转换、如何访问图层和区域统计信息，以及最后如何从点创建栅格热力图。\n\
  \n## 在栅格和矢量之间转换\n\n用于在栅格和矢量格式之间转换的工具可以通过进入 Raster | Conversion 来访问。这些工具称为 Rasterize（矢量转栅格）和\
  \ Polygonize（栅格转矢量）。与之前使用的栅格裁剪工具一样，这些工具也基于 GDAL，并在对话框底部显示命令。\n\nPolygonize 将栅格转换为多边形图层。根据栅格的大小，转换可能需要一些时间。处理完成后，QGIS\
  \ 会通过弹出窗口通知我们。作为快速测试，我们可以例如将重分类的土地覆盖栅格转换为多边形。 resulting 矢量多边形图层包含多个多边形要素，具有一个单一属性，我们将其命名为\
  \ lc；它取决于原始栅格值，如以下屏幕截图所示：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_106_0.png)\n\
  \n使用 **Rasterize** 工具与使用 **Polygonize** 工具非常相似。唯一的区别是我们可以在像素/像元中指定 resulting 栅格的大小。我们还可以指定属性字段，该字段将为栅格像元值提供输入，如下一张屏幕截图所示。在这种情况下，我们的\
  \ alaska.shp 数据集的 cat 属性意义不大，但你已经了解了该工具的工作原理：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_107_0.png)\n\
  \n## 访问栅格和矢量图层统计信息\n\n每当我们获得一个新数据集时，检查图层统计信息以了解其包含的数据，例如最小值和最大值、要素数量等，这很有用。QGIS\
  \ 提供了多种工具来探索这些值。\n\n**栅格图层统计信息** 在 **图层属性** 对话框中 readily 可用，具体在以下选项卡中：\n\n- **Metadata**：此选项卡显示像元值的最小值和最大值以及像元值的平均值和标准差。\n\
  \n## 空间分析\n\n- **Histogram**：此选项卡呈现栅格值的分布。使用鼠标放大直方图以查看细节。例如，以下屏幕截图显示了我们 `landcover`\
  \ 数据集直方图的放大版本：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_108_0.png)\n\n对于 **矢量图层**，我们可以使用\
  \ **Vector | Analysis Tools** 中的两个工具获取汇总统计信息：\n\n- **Basics statistics** 对于数值字段非常有用。它计算诸如平均值和中位数、最小值和最大值、要素计数\
  \ *n*、唯一值数量等参数，适用于图层的全部要素或仅选定要素。\n\n- **List unique values** 用于获取某个字段的所有唯一值。\n\n\
  在这两个工具中，我们可以轻松使用 *Ctrl + C* 复制结果并粘贴到文本文件或电子表格中。以下图像显示了探索我们的 airports 示例数据集内容的示例：\n\
  \n![](img/2e88bf5938bf48a409c0a534a8775b21_109_0.png)\n\n**Basics statistics** 工具的替代方案是\
  \ **Statistics Panel**，你可以通过进入 **View | Panels | Statistics Panel** 来激活它。如以下屏幕截图所示，此面板可自定义以显示你感兴趣的统计信息：\n\
  \n![](img/2e88bf5938bf48a409c0a534a8775b21_110_0.png)\n\n## 计算区域统计信息\n\n与其为整个图层计算栅格统计信息，有时有必要为选定区域计算统计信息。这正是\
  \ **Zonal statistics plugin** 的用途。该插件默认已安装，可在 **Plugin Manager** 中启用。\n\n例如，我们可以使用示例数据中的\
  \ `srtm_05_01.tif` 和 `airports.shp` 为每个机场周围的区域计算高程统计信息：\n\n- 1. 首先，我们使用 **Vector\
  \ | Geoprocessing Tools | Buffer(s)** 工具和 10,000 英尺的缓冲区大小在每个机场周围创建分析区域。\n\n- 2.\
  \ 在使用 **Zonal statistics plugin** 之前，重要的是要注意缓冲区图层和高程栅格使用两种不同的 CRS（**Coordinate Reference\
  \ System** 的缩写）。如果我们直接进行，结果统计信息将为空或错误。因此，我们需要将缓冲区图层重新投影到栅格 CRS（WGS84 EPSG:4326，有关如何更改图层\
  \ CRS 的详细信息，请参阅 *第 3 章，数据创建和编辑* 中的 *重新投影和转换矢量和栅格数据* 部分）。\n\n- 3. 现在我们可以使用 **Zonal\
  \ Statistics** 工具为分析区域计算统计信息，该工具可通过进入 **Raster | Zonal statistics** 访问。在这里，我们可以配置所需的\
  \ **Output column prefix**（在我们的示例中，我们选择了 elev，即 elevation 的缩写）和要计算的 **Statistics**（例如\
  \ Mean、Minimum 和 Maximum），如以下屏幕截图所示：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_111_0.png)\n\
  \n4. 单击 OK 后，所选统计信息将附加到多边形图层属性表中，如以下屏幕截图所示。我们可以看到 Big Mountain AFS 是在我们的高程栅格范围内落入的四个机场中平均高程最高的机场：\n\
  \n![](img/2e88bf5938bf48a409c0a534a8775b21_112_0.png)\n\n## 从点创建热力图\n\n热力图非常适合可视化点的分布。要创建它们，QGIS\
  \ 提供了简单易用的 Heatmap Plugin，我们需要在 Plugin Manager 中激活它，然后可以通过进入 Raster | Heatmap |\
  \ Heatmap 访问它。该插件提供多种 Kernel 形状可供选择。核是一个特定大小和形状的移动窗口，它在点区域上移动以计算其局部密度。此外，该插件允许我们控制输出热力图栅格的大小（使用\
  \ Rows 和 Columns 设置）以及像元大小。\n\n> Radius 决定了点在其周围产生影响的距离。因此，较小的半径值会导致热力图显示更精细、更小的细节，而较大的值会导致热力图更平滑、细节更少。\n\
  > \n> 此外，Kernel shape 控制点的影响随距离增加而减小的速率。Heatmap 插件中可用的核形状列在以下屏幕截图中。例如，Triweight\
  \ 核比 Epanechnikov 核产生更小的热点。有关核函数的正式定义，请参阅 http://en.wikipedia.org/wiki/Kernel_(statistics)。\n\
  \n以下屏幕截图显示了如何使用核半径为 300,000 层单位创建我们的 airports.shp 示例的热力图，在我们的机场数据的情况下，这以英尺为单位：\n\
  \n![](img/2e88bf5938bf48a409c0a534a8775b21_113_0.png)\n\n默认情况下，热力图输出将使用 Singleband\
  \ gray 渲染类型进行渲染（栅格值低为黑色，高为白色）。要将其样式更改为与上一张屏幕截图中类似的内容，可以执行以下操作：\n\n- 1. 将热力图栅格图层渲染类型更改为\
  \ Singleband pseudocolor。\n- 2. 在对话框右侧的 Generate new color map 部分，选择你喜欢的颜色图，例如 PuRd\
  \ 颜色图，如下一张屏幕截图所示。\n- 3. 你可以手动输入颜色图的 Min 和 Max 值，或通过单击 Load in the Load min/max values\
  \ 部分让其计算。\n\n> 加载栅格 min/max 值时，请注意设置。要获取栅格图层的实际 min/max 值，请启用 Min/max、Full Extent\
  \ 和 Actual（slower）Accuracy。如果只想获取地图上当前显示的栅格部分的 min/max 值，请改用 Current Extent。\n\n\
  \n\n\n\n# 空间分析\n\n+   4. 点击**分类（Classify）**，将色带分类添加到对话框左侧的列表中。\n\n+   5. 也可以选择将第一个条目（值为\
  \ 0）的颜色改为白色（双击列表中的颜色），从而在地图的白色背景与热力图之间实现平滑过渡。\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_114_0.png)\n\
  \n## 使用处理（Processing）进行矢量和栅格分析\n\n最全面的空间分析工具集可通过**处理插件（Processing plugin）**访问，该插件可以在**插件管理器（Plugin\
  \ Manager）**中启用。启用该插件后，我们会看到一个**处理（Processing）**菜单，在其中可以激活**工具箱（Toolbox）**，如下面的截图所示。在工具箱中，借助顶部的**搜索（Search）**框，按名称查找空间分析工具非常容易。这使得在工具箱中查找工具比在**矢量（Vector）**或**栅格（Raster）**菜单中更容易。熟悉处理工具的另一个优点是，它们可以用\
  \ Python 和地理处理模型实现自动化。\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_115_0.png)\n\n\
  在接下来的章节中，我们将介绍一些可用的地理处理工具，并了解如何使用建模器来自动化我们的任务。\n\n## 查找最近邻\n\n查找**最近邻**，例如距离居民点最近的机场，是地理处理中的常见任务。要查找最近邻并创建输入要素与另一图层中其最近邻之间的连接，我们可以使用**“到最近枢纽的距离（Distance\
  \ to nearest hub）”**工具。\n\n如下一张截图所示，我们将居民点用作**源点图层（Source points layer）**，将机场用作**目标枢纽图层（Destination\
  \ hubs layer）**。**枢纽图层名称属性（Hub layer name attribute）**将被添加到`result`的属性表中，以标识最近的要素。因此，我们选择`NAME`将机场名称添加到居民点。**输出形状类型（Output\
  \ shape type）**有两个选项：\n\n- **点（Point）：**此选项创建一个点输出图层，包含源点图层的所有点，并带有最近枢纽要素及其距离的新属性。\n\
  - **到枢纽的线（Line to hub）：**此选项创建一个线输出图层，包含源点图层所有点与其对应最近枢纽要素之间的连接。\n\n建议使用**图层单位（Layer\
  \ units）**作为**测量单位（Measurement unit）**，以避免出现错误测量的潜在问题：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_116_0.png)\n\
  \n## 点、线和多边形之间的转换\n\n通常需要在点、线和多边形之间进行转换，例如从一系列点创建线，或者提取多边形的节点并从中创建新的点图层。有许多工具涵盖这些不同使用场景。下表概述了处理工具箱中可用于点、线和多边形转换的工具：\n\
  \n| | 转为点 | 转为线 | 转为面 |\n|---|---|---|---|\n| 从点 | | 点转路径 | 凸包<br>凹包 |\n| 从线 | 提取节点\
  \ | | 线转多边形<br>凸包 |\n| 从面 | 提取节点<br>多边形质心<br>多边形内随机点 | 面转线 | |\n\n通常，将更复杂的表示转换为更简单的表示（面转线、面转点或线转点）比反向转换（点转线、点转面或线转面）更容易。以下是这些工具的简要说明：\n\
  \n- **提取节点：**这是一个非常直接的工具。它接受一个包含线或多边形的输入图层，并创建一个包含所有输入几何节点的点图层。生成的点包含原始线或面要素的所有属性。\n\
  - **多边形质心：**此工具为每个多边形或多重多边形创建一个质心。需要注意的是，它并不确保质心位于多边形内部。对于凹多边形、多重多边形和带孔多边形，质心可能落在多边形之外。\n\
  - **多边形内随机点：**此工具在多边形内部的随机位置创建指定数量的点。\n- **点转路径：**要从点创建线，点图层需要具备标识线的属性（**组字段（Group\
  \ field）**）以及标识线中点顺序的属性（**顺序字段（Order field）**），如下面的截图所示：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_117_0.png)\n\
  \n- **凸包：**此工具在输入点或线周围创建凸包。凸包可以想象为包含所有输入点以及输入点之间所有连接的区域。\n- **凹包：**此工具在输入点周围创建凹包。凹包是一个表示输入点所占区域的多边形。凹包小于或等于凸包。在此工具中，我们可以通过将**阈值**参数在\
  \ 0（非常详细）和 1（等效于凸包）之间调整来控制凹包的详细程度。下面的截图显示了我们机场数据周围的凸包和凹包（阈值设置为 0.3）的对比：\n- **线转多边形：**最后，此工具可以从包围一个区域的线创建多边形。确保线之间没有间隙，否则它将无法工作。\n\
  \n![](img/2e88bf5938bf48a409c0a534a8775b21_118_0.png)\n\n## 识别其他要素附近的要素\n\n一项常见的空间分析任务是识别某些其他要素附近的要素。例如，查找所有靠近河流的机场。使用示例数据中的\
  \ airports.shp 和 majrivers.shp，我们可以通过组合使用固定距离缓冲区（Fixed distance buffer）和按位置选择（Select\
  \ by location）工具，找到距离河流 5,000 英尺以内的机场。使用搜索框在处理工具箱中查找这些工具。此示例的工具配置如下图所示：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_119_0.png)\n\
  \n对机场点位置建立缓冲区后，**按位置选择（Select by location）**工具会选择所有与河流相交的机场缓冲区。最终，76 个机场中有 14 个被选中。此信息显示在\
  \ QGIS 主窗口底部的信息区域中，如下面的截图所示：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_119_1.png)\n\
  \n## 在点位置对栅格进行采样\n\n另一项常见任务是在特定点位置对栅格进行采样。使用处理（Processing），我们可以通过名为 v.sample 的 GRASS\
  \ 工具解决此问题。要使用 GRASS 工具，请确保已安装 GRASS，并在处理 | 选项和配置下正确配置处理。在 OSGeo4W 默认系统上，配置将如下图所示：\n\
  \n![](img/2e88bf5938bf48a409c0a534a8775b21_121_0.png)\n\n在撰写本书时，OSGeo4W 中提供了 GRASS\
  \ 7.0.3RC1。如前一张截图所示，还支持以前的 GRASS 6.x 版本，并且可以将处理配置为也使用其算法。在工具箱中，您可以在 GRASS GIS 7\
  \ 命令和 GRASS 命令（适用于 GRASS 6.x）下找到这些算法。\n\n## 空间分析\n\n在本练习中，假设我们要对示例数据机场位置处的**土地覆盖（landcover）**图层进行采样。我们要做的就是指定包含采样点的矢量图层和需要采样的栅格图层。对于此示例，我们可以将所有其他设置保留默认值，如下面的截图所示。该工具不仅对栅格进行采样，还会将点属性与采样后的栅格值进行比较。但在当前示例中，我们不需要这种比较：\n\
  \n![](img/2e88bf5938bf48a409c0a534a8775b21_122_0.png)\n\n## 使用六边形网格绘制密度图\n\n使用六边形网格绘制点密度已成为创建热力图之外颇受欢迎的替代方案。处理为我们提供了一种快速进行此类分析的方法。已经有一个名为**“从图层边界生成六边形网格（Hex\
  \ grid from layer bounds）”**的预置脚本，可通过处理脚本集合获取，并可借助**“从在线脚本集合获取脚本（Get scripts from\
  \ on-line scripts collection）”**工具下载。如下面的截图所示，您只需勾选复选框并单击“确定”即可启用脚本：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_123_0.png)\n\
  \n然后，我们可以使用此脚本创建一个覆盖输入图层中所有点的六边形网格。居民点数据集（popp.shp）是此练习的合适示例数据。网格准备好后，我们可以运行**“统计多边形中的点（Count\
  \ points in polygon）”**来计算统计数据。如果使用下图所示的设置，点的数量将存储在**NUMPOINTS**列中：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_123_1.png)\n\
  \n\n\n\n\n# 计算区域内的面积占比\n\n我们经常遇到的另一个空间分析任务是计算某个区域内的面积占比，例如，某条河流沿线的土地覆盖占比。使用 `majrivers.shp`\
  \ 和 `trees.shp`，我们可以计算苏西特纳河沿岸 10,000 英尺宽地带内的林地面积占比：\n\n- 1. 我们首先通过选择河流并为其建立缓冲区来定义分析区域。\n\
  \n> QGIS 处理工具默认只对输入图层的选中要素应用缓冲区。此默认行为可以在“处理”|“选项和配置”中，通过禁用“仅使用选中要素”选项来更改。对于以下示例，请保持该选项启用。\n\
  \n要选择苏西特纳河，我们使用“按属性选择”工具。运行该工具后，您应该会看到我们感兴趣的河流被选中并高亮显示。\n\n- 2. 然后，我们可以使用“固定距离缓冲区”工具来获取河流沿线\
  \ 5,000 英尺范围内的区域。请注意，应启用“融合结果”选项，以确保缓冲区结果是一个连续的单个多边形，如下面的屏幕截图所示：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_124_0.png)\n\
  \n- 3. 接下来，我们计算河流周围地带的面积。这可以使用“导出/添加几何列”工具完成，该工具会将面积和周长添加到属性表中。\n- 4. 然后，我们可以计算河流沿线区域与\
  \ `trees.shp` 中林地区域之间的“相交”结果，如下面的屏幕截图所示。此操作的结果是一个仅包含河流缓冲区范围内林地区域的图层。\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_125_0.png)\n\
  \n- 5. 使用“融合”工具，我们可以将相交结果中的所有区域重新组合成一个大的多边形，该多边形代表河流周围的总林地区域。请注意，我们使用唯一 ID 字段 `VEGDESC`\
  \ 仅合并具有相同植被类型的区域，以免混淆落叶林和混交林。\n\n- 6. 最后，我们可以使用 **高级 Python 字段计算器** 计算最终的林地面积占比。公式\
  \ `value = $geom.area() / <area>` 将最终多边形的面积（`$geom.area()`）除以面积属性（`<area>`）中的值，该值是我们之前通过运行\
  \ **导出/添加几何列** 创建的。如下面的屏幕截图所示，此计算得出 **落叶林** 的林地占比为 **0.31601**，**混交林** 的林地占比为 **0.09666**。因此，我们可以得出结论：苏西特纳河沿岸总共有\
  \ 41.27% 的土地被林地覆盖：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_126_0.png)\n\n# 批量处理多个数据集\n\
  \n有时，我们希望重复运行同一个工具，但使用略有不同的设置。针对这种用例，“处理”提供了“批量处理”功能。让我们使用此工具，通过“随机抽取”工具从机场图层中提取一些样本：\n\
  \n- 1. 要访问批量处理功能，请在工具箱中右键单击“随机抽取”工具，然后选择“作为批处理过程执行”。这将打开“批量处理”对话框。\n- 2. 接下来，我们通过单击“...”按钮并选择“从打开的图层中选择”来配置输入图层，如下面的屏幕截图所示：\n\
  \n![](img/2e88bf5938bf48a409c0a534a8775b21_127_0.png)\n\n- 3. 这将打开一个小对话框，我们可以在其中选择机场图层，然后单击“确定”。\n\
  - 4. 要自动用相同的输入图层填充其他行，我们可以双击相应列的列标题（显示为“输入图层”）。\n- 5. 接下来，我们通过选择“选中要素的百分比”选项并再次双击相应的列标题来自动填充其余行，从而配置“方法”。\n\
  - 6. 下一个参数控制“选中要素的数量/百分比”。对于我们的练习，我们配置为 10、20 和 30 个百分点。\n- 7. 最后但同样重要的是，我们需要在“提取的（随机）”列中配置输出文件。单击“...”按钮，这将打开一个文件对话框。在那里，您可以选择保存位置和文件名（例如，extract），然后单击“保存”。\n\
  \n- 8. 这将打开“自动填充设置”对话框，它可以帮助我们为每次运行自动创建不同的文件名。使用“使用参数值填充”模式并选择“选中要素的数量/百分比”参数，将自动把我们的参数值（分别为\
  \ 10、20 和 30）追加到文件名中。这将生成 `extract10`、`extract20` 和 `extract30`，如下面的屏幕截图所示：\n\n\
  ![](img/2e88bf5938bf48a409c0a534a8775b21_128_0.png)\n\n- 9. 一切配置完成后，单击“运行”按钮，等待所有批处理指令被处理，并将结果加载到项目中。\n\
  \n# 使用图形化建模器实现自动化地理处理\n\n使用图形化建模器，我们可以将整个地理处理和分析工作流转变为自动化模型。然后，我们可以使用这些模型一键运行涉及多个不同工具的复杂地理处理任务。要创建模型，我们转到“处理”|“图形化建模器”以打开建模器，在其中我们可以为模型选择不同的“输入”和“算法”。\n\
  \n让我们创建一个自动生成六边形热力图的模型！\n\n- 1. 通过双击 **输入** 列表中的 **矢量图层** 条目，我们可以为点图层添加一个输入字段。使用描述性参数名称（例如，用\
  \ `hex cell size` 而不是只用 `size` 来控制六边形网格单元的大小）是一个好主意，这样我们可以识别模型中哪个输入在前、哪个在后。在适当的地方限制\
  \ **形状类型** 字段也很有用。在我们的示例中，我们将输入限制为 **点** 图层。这将使“处理”能够预先过滤可用的图层，只向我们展示类型正确的图层。\n\n\
  - 2. 我们需要的第二个输入是一个 **数字** 字段，用于指定所需的六边形单元大小，如下面的屏幕截图所示：\n\n- 3. 添加输入后，我们现在可以通过组合算法来继续创建模型。在\
  \ **算法** 部分，我们可以使用顶部的过滤器来缩小搜索范围，找到正确的算法。要将算法添加到模型中，我们只需双击算法列表中的条目。这会打开算法对话框，我们必须在其中指定输入以及进一步的算法特定参数。\n\
  \n![](img/2e88bf5938bf48a409c0a534a8775b21_129_0.png)\n\n- 4. 在我们的示例中，我们希望将点矢量图层用作\
  \ **输入** 图层，并将数字输入 **hex cell size** 用作 **像元大小** 参数。我们可以通过下拉列表访问可用的输入，如下面的屏幕截图所示。或者，也可以通过在输入字段中键入所需值来硬编码参数（例如像元大小）：\n\
  \n![](img/2e88bf5938bf48a409c0a534a8775b21_130_0.png)\n\n> 在添加以下算法时，务必始终根据上一步处理步骤选择正确的输入图层。我们可以通过建模器自动绘制的模型图中的连接来验证工作流。\n\
  \n- 5. 最终的模型将如下所示：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_131_0.png)\n\n- 6.\
  \ 要完成模型，我们需要输入模型名称（例如，Create hexagonal heatmap）和组名称（例如，Learning QGIS）。“处理”将使用组名称把我们创建的所有模型组织到不同的工具箱组中。一旦我们选择了名称和组，就可以保存模型并运行它。\n\
  \n- 7. 关闭建模器后，我们可以像使用任何其他工具一样从工具箱中运行已保存的模型。甚至可以一个模型作为另一个模型的构建模块。\n\n另一个有用的功能是，我们可以指定一个图层样式，该样式会自动应用于处理结果。此默认样式可以在工具箱中右键单击已创建的模型，然后选择\
  \ **为输出设置编辑渲染样式** 来设置，如下面的屏幕截图所示：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_132_0.png)\n\
  \n# 记录和共享模型\n\n模型可以轻松地从一台 QGIS 安装复制到另一台，并与其他用户共享。为了确保模型的可用性，编写简短文档是一个好主意。**处理**\
  \ 提供了一个方便的 **帮助编辑器**；可以通过单击 **处理建模器** 中的 **编辑模型帮助** 按钮来访问，如下面的屏幕截图所示：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_132_1.png)\n\
  \n\n\n默认情况下，.model 文件存储在你的用户目录中。在 Windows 上，路径为 `C:\\Users\\<your_user_name>\\.qgis2\\\
  processing\\models`；在 Linux 和 OS X 上，路径为 `~/.qgis2/processing/models`。\n\n你可以复制这些文件并与其他人分享。要从文件加载模型，请使用加载工具，进入\
  \ **Processing Toolbox**（处理工具箱），然后选择 **Models | Tools | Add model from file**（模型\
  \ | 工具 | 从文件添加模型）。\n\n## 利用空间数据库的强大功能\n\n地理处理的另一种方法是使用空间数据库（如 PostGIS 和 SpatiaLite）提供的功能。在\
  \ *Chapter 2, Viewing Spatial Data*（第 2 章，查看空间数据）中的 *Loading data from databases*（从数据库加载数据）部分，我们讨论了如何从\
  \ SpatiaLite 数据库加载数据。在本练习中，我们将使用 SpatiaLite 内置的地理处理函数，直接在数据库中进行空间分析，并在 QGIS 中可视化结果。我们将使用在\
  \ *Chapter 2, Viewing Spatial Data*（第 2 章，查看空间数据）中从 www.gaia-gis.it/spatialite-2.3.1/test-2.3.zip（4\
  \ MB）下载的同一个 SpatiaLite 数据库。\n\n### 在 SpatiaLite 中按位置选择\n\n作为示例，我们将使用 SpatiaLite\
  \ 的空间函数来获取距离 Firenze 市 1 公里范围内所有高速公路：\n\n1. 为了与数据库交互，我们使用 **DB Manager**（数据库管理器）插件，该插件可以在\
  \ **Plugin Manager**（插件管理器）中启用，并且可通过 **Database**（数据库）菜单访问。\n\n> 如果你已经完成了 *Chapter\
  \ 2, Viewing Spatial Data*（第 2 章，查看空间数据）中的 *Loading data from databases*（从数据库加载数据）部分，你会看到\
  \ `test-2.3.sqlite` 列在 **DB Manager**（数据库管理器）对话框左侧树视图中的 SpatiaLite 下面，如下一个屏幕截图所示。如果数据库未列出，请参阅前面提到的部分以设置数据库连接。\n\
  \n2. 接下来，我们可以打开 **Query**（查询）标签页，方法是使用 **SQL window**（SQL 窗口）工具栏按钮，进入 **Database\
  \ | SQL window**（数据库 | SQL 窗口），或者按 F2 键。以下 **SQL** 查询将选择距离 Firenze 市 1 公里范围内所有高速公路：\n\
  \n```\nSELECT *\nFROM HighWays\nWHERE PtDistWithin(\n    HighWays.Geometry,\n  \
  \  (SELECT Geometry FROM Towns WHERE Name = 'Firenze'),\n    1000\n)\n```\n\n介绍\
  \ SQL 超出了本书的范围，但你可以在 http://www.gaia-gis.it/gaia-sins/spatialite-cookbook/index.html\
  \ 找到关于使用 SpatiaLite 的详尽教程。此外，要了解 SpatiaLite 提供的所有空间功能概览，请访问 http://www.gaia-gis.it/gaia-sins/spatialite-sql-4.2.0.html。\n\
  \n3. 输入查询后，我们可以点击 Execute（F5）（执行）来运行查询。查询结果将以表格形式显示在 SQL 查询输入区域下方的结果部分，如下一个屏幕截图所示：\n\
  \n![](img/2e88bf5938bf48a409c0a534a8775b21_134_0.png)\n\n4. 要在地图上显示查询结果，我们需要激活结果表格下方的\
  \ **Load as new layer**（作为新图层加载）选项。请确保你选择了正确的 **Geometry column**（几何列）（`Geometry`）。\n\
  5. 配置好这些设置后，你可以点击 **Load now!**（立即加载）将查询结果作为新的地图图层加载。正如你在前面的屏幕截图中所见，只有一条高速公路（由宽蓝线表示）位于\
  \ Firenze 市 1 公里范围内。\n\n### 在 SpatiaLite 中聚合数据\n\n数据库非常擅长的另一件事是聚合数据。例如，以下 SQL 查询将统计每个地区的城镇数量：\n\
  \n```\nSELECT Regions.Name, Regions.Geometry, count(*) as Count\nFROM Regions\n\
  JOIN Towns\n  ON Within(Towns.Geometry,Regions.Geometry)\nGROUP BY Regions.Name\n\
  ```\n\n这可以用于创建一个包含 Count（计数）属性的新地区图层。这显示了该地区内城镇的数量，如下一个屏幕截图所示：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_135_0.png)\n\
  \n虽然我们在本示例中使用了 SpatiaLite，但这里展示的工具和工作流程同样适用于 PostGIS 数据库。然而，值得注意的是，SpatiaLite 和\
  \ PostGIS 经常使用略有不同的函数名称。因此，通常需要根据情况调整 SQL 查询。\n\n## 摘要\n\n在本章中，我们介绍了各种栅格和矢量地理处理与分析工具，以及如何在常见任务中应用它们。我们看到了如何使用\
  \ Processing toolbox（处理工具箱）运行单个工具，以及如何利用 modeler（模型器）从多个工具创建复杂的地理处理模型。使用模型器，我们可以自动化工作流程并提高生产力，特别是针对重复性任务。最后，我们还简要了解了如何利用空间数据库的强大功能来进行空间分析。\n\
  \n在下一章中，我们将看到如何将我们所有的知识结合起来，使用高级样式和打印地图构图功能来创建精美的地图。\n"
- "## 5 创建出色的地图\n\n在本章中，我们将介绍那些使我们能够创建出色地图的重要功能。我们将首先深入了解高级矢量样式，建立在我们在 *Chapter 2,\
  \ Viewing Spatial Data*（第 2 章，查看空间数据）中介绍的基础上。然后，你将学习如何对要素进行标注，通过示例了解点标注以及更具先进性的带有道路盾牌图形的道路标注。我们还将介绍如何手动调整标注。接下来，你将了解打印制图仪（print\
  \ composer）以及如何用它来创建可打印的地图和地图册。最后，我们将解释如何直接在 QGIS 中创建网络地图，以便在线展示我们的结果。\n\n> 如果你想知道使用\
  \ QGIS 可以创建什么样的地图，请访问 https://www.flickr.com/groups/qgis/ 上的 QGIS Map Showcase（QGIS\
  \ 地图展示）Flickr 小组，该小组专门展示使用 QGIS 创建且未经进一步后期处理的地图。\n\n## 高级矢量样式\n\n本节介绍更高级的矢量样式功能，建立在我们在\
  \ *Chapter 2, Viewing Spatial Data*（第 2 章，查看空间数据）中介绍的基础之上。我们将介绍如何使用以下功能创建详细的自定义可视化：\n\
  \n- 分级样式\n- 分类样式\n- 基于规则的样式\n- 数据定义样式\n- 热力图样式\n- 2.5D 样式\n- 图层效果\n\n### 创建分级样式\n\
  \n分级样式非常适合可视化分级统计图（choropleth）或类似地图中数值的分布。分级渲染器支持两种方法：\n\n- **Color**（颜色）：此方法根据配置的属性改变要素的颜色\n\
  - **Size**（大小）：此方法根据配置的属性改变要素的符号大小（此选项仅对点和线图层可用）\n\n在我们的示例数据中，有一个 `climate.shp`\
  \ 文件，其中包含位置和平均温度值。我们可以使用分级样式来可视化这些数据，只需为 **Column**（列）字段选择 **T_F_MEAN** 值，然后点击 **Classify**（分类）。使用\
  \ **Color**（颜色）方法，如下一个屏幕截图所示，我们可以从相应的下拉列表中选择一个 **Color ramp**（色带）。此外，我们可以使用 **Invert**（反转）选项来反转色带中颜色的顺序：\n\
  \n![](img/2e88bf5938bf48a409c0a534a8775b21_138_0.png)\n\n分级样式有不同的分类模式，如下所示：\n\n\
  - **Equal Interval**（等间隔）：此模式通过在指定列中发现的最大值和最小值之间以相等的间隔拆分来创建类别。\n- **Quantile (Equal\
  \ Count)**（分位数（等数量））：此模式创建的类别使得每个类别包含相等数量的要素。\n- **Natural Breaks (Jenks)**（自然断点（Jenks））：此模式使用\
  \ Jenks 自然断点算法创建类别，通过减少类内方差并最大化类间方差来创建类别。\n- **Standard Deviation**（标准差）：此模式使用列值的标准差来创建类别。\n\
  - **Pretty Breaks**（美观断点）：此模式是唯一一种不严格创建指定数量类别的分类。相反，其主要目标是创建数值为整数（round numbers）的类别边界。\n\
  \n我们可以通过双击列表中的值并更改类别边界来手动编辑类别值。编辑类别的一种更便捷方式是 **Histogram**（直方图）视图，如下一个屏幕截图所示。切换到\
  \ **Histogram**（直方图）标签页，然后点击右下角的 **Load values**（加载值）按钮以启用直方图。你现在可以通过用鼠标移动垂直线来编辑类别边界。你还可以通过添加新的垂直线来添加新类别，这可以通过点击直方图中的空白区域来完成：\n\
  \n![](img/2e88bf5938bf48a409c0a534a8775b21_139_0.png)\n\n除了地图上绘制的符号外，样式化的另一个重要方面是与其配套的\
  \ **legend**（图例）。为了自定义图例，我们可以定义 **Legend Format**（图例格式）以及应显示的 **Precision**（精度，即小数位数）。在\
  \ **Legend Format**（图例格式）字符串中，$1 将被替换为类别的下限，$2 将被替换为上限。你可以将此字符串更改为适合你的需求，例如：`from\
  \ $1 to $2`。如果你激活 **Trim**（修剪）选项，多余的尾部零也将被移除。\n\n\n\n\n\n当我们使用Size方法时，如下面的截图所示，对话框会略有变化，我们现在可以配置所需的符号尺寸：\n\
  \n![](img/2e88bf5938bf48a409c0a534a8775b21_140_0.png)\n\n下一个截图显示了使用“分级（Graduated）”渲染器选项，采用“等间隔分类”模式并分为五个类别的结果。左侧显示“颜色”方法的结果（符号颜色根据T_F_MEAN值变化），右侧显示“大小”方法的结果（符号大小根据T_F_MEAN值变化）。\n\
  \n注意每个符号旁边的复选框。它们可用于选择性地隐藏或显示属于相应类别的要素。\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_140_1.png)\n\
  \n## 创建和使用颜色渐变\n\n在前面的示例中，我们使用现有的颜色渐变来设置图层样式。当然，我们也可以创建自己的颜色渐变。要创建新的颜色渐变，我们可以向下滚动颜色渐变列表到“New\
  \ color ramp...”条目。我们可以从四种不同的颜色渐变类型中选择：\n\n- **渐变（Gradient）**：使用此类型，我们可以创建包含两种或更多颜色的颜色映射。生成的颜色映射可以是平滑渐变（使用“连续”类型选项）或不同颜色（使用“离散”类型选项），如下面的截图所示：\n\
  \n![](img/2e88bf5938bf48a409c0a534a8775b21_141_0.png)\n\n- **随机（Random）**：此类型允许我们创建包含指定数量随机颜色的渐变。\n\
  \n- **ColorBrewer**：此类型提供对ColorBrewer配色方案的访问。\n\n- **cpt-city**：此类型提供对各种预配置配色方案的访问，包括用于排版和水深主题的方案，如下面的截图所示：\n\
  \n![](img/2e88bf5938bf48a409c0a534a8775b21_142_0.png)\n\n要管理我们所有的颜色渐变和符号，我们可以前往“设置\
  \ | 样式管理器”。在这里，我们可以使用对话框右侧相应的按钮添加、删除、编辑、导出或导入颜色渐变和样式，如下面的截图所示：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_142_1.png)\n\
  \n## 使用分类样式处理名义数据\n\n正如分级样式非常适合可视化数值一样，分类样式也非常适合文本值，或者更一般地说，适合名义尺度上的各种值。在我们的示例数据中的trees.shp文件中可以找到这类数据的一个很好的例子。每个区域都有一个VEGDESC值，用于描述该区域发现的森林类型。使用分类样式，我们可以轻松生成一个样式，为VEGDESC列中的每个唯一值分配一个符号，如下面的截图所示。一旦我们点击“确定”，该样式将应用于我们的树木图层，以可视化该地区不同树木类型的分布：\n\
  \n![](img/2e88bf5938bf48a409c0a534a8775b21_143_0.png)\n\n当然，每个符号都是可编辑的，并且可以进行自定义。只需双击符号预览即可打开“符号选择器”对话框，该对话框允许您选择和组合不同的符号。\n\
  \n## 为道路图层创建基于规则的样式\n\n使用基于规则的样式，我们可以创建一个具有规则层次结构的图层样式。规则可以考虑从属性值到比例尺以及诸如面积或长度等几何属性的任何内容。在本示例中，我们将为来自Natural\
  \ Earth的ne_10m_roads.shp文件创建一个基于规则的渲染器（您可以从http://www.naturalearthdata.com/downloads/10m-cultural-vectors/roads/下载）。正如您在这里看到的，我们的样式将包含主要和次要高速公路的不同道路样式，以及与比例尺相关的样式：\n\
  \n![](img/2e88bf5938bf48a409c0a534a8775b21_144_0.png)\n\n如前面的截图所示，在规则的第一层，我们区分“type”=\
  \ 'Major Highway' 的道路和“type”= 'Secondary Highway' 的道路。下一层规则处理比例尺依赖性。要添加第二层规则，我们可以使用“细化所选规则”按钮，然后选择“为规则添加比例尺”。我们只需输入一个或多个希望规则拆分处的比例尺值。\n\
  \n> 请注意，第一级规则中没有指定符号。如果我们在第一级也指定了符号，渲染器会在彼此之上绘制两个符号。虽然这在某些情况下可能有用，但我们目前不需要这种效果。符号可以在“规则属性”中停用，可以通过双击规则或单击规则树视图下方的编辑按钮（加号和减号按钮之间的按钮）来访问该属性。\n\
  \n在下面的截图中，我们可以看到基于规则的渲染器和比例尺规则的实际效果。左侧显示较宽的白色道路，带有灰色轮廓，用于次要公路；右侧显示更简单的符号体系，使用细灰色线条：\n\
  \n![](img/2e88bf5938bf48a409c0a534a8775b21_145_0.png)\n\n您可以通过转到“设置 | 样式管理器”，单击对话框右下角的共享按钮，然后选择“导入”来下载此样式使用的符号。URL\
  \ 是 `https://raw.githubusercontent.com/anitagraser/QGIS-resources/master/qgis1.8/symbols/osm_symbols.xml`。将\
  \ URL 粘贴到“位置”文本框中，单击“获取符号”，然后点击“全选”，最后点击“导入”。该对话框将如下图所示：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_145_1.png)\n\
  \n## 创建数据定义的符号体系\n\n在前面的示例中，我们创建了类别或规则来定义要素在地图上的绘制方式。另一种方法是使用图层属性表中的值来定义样式。这可以通过QGIS中称为**数据定义覆盖**的功能来实现。这些覆盖可以通过每个符号属性旁边的相应按钮进行配置，如下面的示例所述。\n\
  \n在本示例中，我们将再次使用来自Natural Earth的`ne_10m_roads.shp`文件。下面的截图显示了一种配置，该配置创建了一种样式，其中线条的**画笔宽度**取决于要素的`scalesrank`，线条**颜色**取决于`toll`属性。要为符号属性设置数据定义覆盖，您需要单击属性旁边的相应按钮，然后选择**编辑**。使用了以下两个表达式：\n\
  \n- CASE WHEN toll = 1 THEN 'red' ELSE 'lightgray' END：此表达式计算`toll`值。如果为1，则线条以红色绘制；否则以灰色绘制。\n\
  \n- 2.5 / scalesrank：此表达式计算**画笔宽度**。由于低的比例尺等级应该用更宽的线条表示，我们使用除法运算而不是乘法。\n\n当数据定义覆盖处于活动状态时，相应的按钮会以黄色高亮显示，并带有ε符号，如下面的截图所示：\n\
  \n![](img/2e88bf5938bf48a409c0a534a8775b21_146_0.png)\n\n## 创建动态热力图样式\n\n在*第4章“空间分析”*中，您学习了如何创建热力图栅格。但是，如果您只需要一个用于显示目的（而不是用于进一步的空间分析）的热力图，有一种更快、更方便的方法可以达到这种效果——即**热力图**渲染器选项。\n\
  \n下面的截图显示了一个为我们的居民点数据集*popp.shp*设置的**热力图**渲染器。我们可以指定一个颜色渐变，该渐变将应用于结果热力图数值在0到定义的**最大值**之间的部分。如果将**最大值**设置为**自动**，QGIS会自动计算热力图的最大值。与前面讨论的热力图工具一样，我们可以定义点权重以及核**半径**（关于此术语的解释，请参阅*第4章“空间分析”*中的*从点创建热力图*）。最后的**渲染质量**选项控制渲染输出的质量，**最快**选项使用粗糙、较大的栅格单元，而设置为**最佳**时则呈现细粒度的外观：\n\
  \n![](img/2e88bf5938bf48a409c0a534a8775b21_148_0.png)\n\n\n\n\n\n## 创建 2.5D 样式\n\
  \n如果你想创建伪 3D 外观，例如为建筑物要素设置样式或创建专题地图，可以尝试使用 2.5D 渲染器。下一张截图显示了当前的配置选项，包括要素高度（以图层单位为单位）、视角和颜色的控件。由于在编写本书时，此渲染器仍在改进中，因此当你亲眼看到时，可能会在此对话框中看到更多选项。\n\
  \n![](img/2e88bf5938bf48a409c0a534a8775b21_149_0.png)\n\n一旦按你的喜好配置好 2.5D 渲染器，就可以切换到另一个渲染器，例如创建分类或分级符号版本。\n\
  \n## 添加实时图层特效\n\n借助**图层特效**，我们可以进一步改变符号的外观。如下面的截图所示，选中符号对话框底部的**绘制效果**复选框，即可添加特效。要配置特效，请单击对话框右下角的星形按钮。**特效属性**对话框提供了多种**特效类型**：\n\
  \n- **模糊（Blur）**：此效果会创建符号的模糊、朦胧版本。\n- **着色（Colorise）**：此效果会更改符号的颜色。\n- **源（Source）**：这是原始未更改的符号。\n\
  - **投影（Drop Shadow）**：此效果会创建阴影。\n- **内发光（Inner Glow）**：此效果会创建从符号边界开始向内延伸的发光渐变。\n\
  - **内阴影（Inner Shadow）**：此效果会创建仅限于符号内部的阴影。\n- **外发光（Outer Glow）**：此效果会创建从符号向外辐射的发光。\n\
  - **变换（Transform）**：此效果可用于变换符号。可用的变换包括反射、剪切、缩放、旋转和平移：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_150_0.png)\n\
  \n如上面的截图所示，我们可以组合多个图层特效，它们会在**特效属性**对话框左下角的列表中按特效图层组织。\n\n## 使用不同样式\n\n当我们创建精细的样式时，可能希望保存它们，以便在其他项目中重用或与其他用户共享。要保存样式，请单击样式对话框左下角的**样式**按钮，然后转到**保存样式\
  \ | QGIS 图层样式文件...**，如下面的截图所示。这将创建一个 .qml 文件，你可以将其保存在任何位置、复制并与他人共享。同样，要使用 .qml 文件，请单击**样式**按钮并选择**加载样式**：\n\
  \n![](img/2e88bf5938bf48a409c0a534a8775b21_151_0.png)\n\n我们还可以为一个图层保存多种不同的样式。例如，对于我们的机场图层，我们可能希望一种样式使用飞机符号显示机场，另一种样式渲染热力图。要实现这一点，可以执行以下操作：\n\
  \n1. 配置飞机符号样式。\n2. 单击**样式**按钮，然后选择**添加**，将当前样式添加到该图层的样式列表中。\n3. 在弹出的对话框中，为新样式输入名称，例如\
  \ `planes`。\n4. 通过单击**样式**和**添加**来添加另一种样式，并将其命名为 `heatmap`。\n5. 现在，你可以将渲染器更改为**热力图**并对其进行配置。准备好后，单击**应用**按钮。\n\
  6. 在**样式**按钮菜单中，你现在可以看到这两种样式，如下一张截图所示。现在，只需从菜单底部的列表中选择两个条目之一，即可在两种样式之间切换：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_152_0.png)\n\
  \n最后，我们还可以通过**图层面板**中图层上下文菜单的**样式**条目访问这些图层样式，如下面的截图所示。该上下文菜单还提供了在图层之间复制和粘贴样式的方法，分别使用**复制样式**和**粘贴样式**条目。此外，该上下文菜单还提供了一个快捷方式，可以通过色轮或从**最近使用的颜色**部分选取颜色来快速更改符号颜色：\n\
  \n![](img/2e88bf5938bf48a409c0a534a8775b21_153_0.png)\n\n## 标注\n\n我们可以通过转到“图层属性\
  \ | 标注”，选中“显示此图层的标注”，并选择要用于标注的属性字段来激活标注。这就是使用默认设置显示标注所需的全部操作。虽然默认标注非常适合快速预览，但在为报告或独立地图创建可视化时，我们通常需要自定义标注。\n\
  \n使用表达式（属性下拉列表旁边的按钮），我们可以根据需要格式化标注文本。例如，示例 airports.shp 文件中的 NAME 字段包含大写文本。为了改以混合大小写显示机场名称，我们可以设置\
  \ title(NAME) 表达式，该表达式将以标题大小写重新格式化名称文本。我们还可以使用多个字段创建标注，例如，使用串联运算符 (||) 将名称和括号中的高程组合起来，如下所示：\n\
  \n```\ntitle(NAME) || ' (' || \"ELEV\" || ')'\n```\n\n请注意文本周围使用的单引号（例如 ' ('）和字段名周围使用的双引号（例如\
  \ \"ELEV\"）。对话框将如下面的截图所示：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_154_0.png)\n\
  \n对话框顶部的大预览区标题为“文本/缓冲区示例”，显示当前设置的预览。可以调整背景颜色，以测试在不同背景下的可读性。在预览区域下方，我们可以找到不同的标注设置，这些设置将在后续章节中详细描述。\n\
  \n### 自定义标注文本样式\n\n在**文本**部分（见上一张截图），我们可以配置文本样式。除了更改**字体**、**样式**、**大小**、**颜色**和**透明度**外，我们还可以修改**字母**和**单词**之间的**间距**，以及**混合模式**，其工作原理类似于我们在*第\
  \ 2 章，查看空间数据*中介绍的图层混合模式。\n\n请注意每个设置右侧的一列按钮。单击这些按钮可以创建数据定义的覆盖，类似于我们在本章开头讨论高级矢量样式时提到的那些覆盖。例如，这些数据定义的覆盖可用于定义不同的标注颜色，或根据单个要素的属性值或表达式更改标注大小。\n\
  \n### 控制标注格式\n\n在**格式**部分（如下面的截图所示），我们可以通过指定**按字符换行**来启用**多行标注**。此外，我们还可以控制**行高**和**对齐方式**。除了典型的对齐选项外，QGIS\
  \ 标注引擎还提供**跟随标注放置**选项，该选项可确保多行标注与标注所属符号保持同一侧对齐：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_155_0.png)\n\
  \n最后，**格式化数字**选项提供了一种快捷方式，可将数值格式化为指定数量的**小数位数**。\n\n按特定字符换行的另一种方法是自动换行函数，该函数可在表达式中使用。它会将输入字符串换行为指定的最大或最小字符数。下面的截图显示了一个示例，将较长的文本每行最多换行\
  \ 22 个字符：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_156_0.png)\n\n### 配置标注缓冲区、背景和阴影\n\
  \n在缓冲区部分，我们可以调整缓冲区的大小、颜色和透明度，以及笔连接样式和混合模式。通过透明度和混合，我们可以提高标注的可读性，而不会过多遮挡底层地图，如下面的截图所示。\n\
  \n在背景部分，我们可以添加矩形、正方形、圆形、椭圆或 SVG 形式的背景形状。SVG 背景非常适合创建诸如公路标识牌之类的效果，稍后我们将讨论这些效果。\n\n\
  类似地，在阴影部分，我们可以为标注添加阴影。我们可以控制从阴影方向到颜色、模糊半径、缩放和透明度的所有内容。\n\n### 控制标注放置\n\n在放置部分，我们可以配置应使用哪些规则来确定标注的放置位置。可用的自动标注放置选项取决于图层几何类型。\n\
  \n\n\n\n\n## 配置点标签\n\n对于*点图层*，我们可以从以下选项中选择：\n\n- 灵活的**围绕点**选项通过在不重叠的情况下将标签分布在点周围来寻找标签的最佳位置。正如你在下图中看到的那样，一些标签被放置在点符号的右上角，而其他标签则出现在左侧（例如，**安克雷奇国际机场\
  \ (129)**）或右侧（例如，**大湖 (135)**）的不同位置。\n\n- **偏离点**选项强制将所有标签放置在某个特定位置；例如，所有标签都可以放置在点符号的上方。\n\
  \n下图显示了使用**围绕点**方式放置的机场标签，带有 50% 透明度的**缓冲区**和**阴影**。**标签距离**为 1 毫米。\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_157_0.png)\n\
  \n## 配置线标签\n\n对于*线图层*，我们可以从以下放置选项中选择：\n\n- **平行**，用于根据线的方向旋转的直标签\n\n- **弯曲**，用于遵循线形状的标签\n\
  \n- **水平**，用于保持水平方向的标签，无论线的方向如何\n\n为了进一步微调，我们可以定义标签应放置在**线的上方**、**线上**还是**线的下方**，并使用**标签距离**定义其距离上方或下方多远。\n\
  \n## 配置多边形标签\n\n对于*多边形图层*，放置选项如下：\n\n- **偏离质心**使用多边形质心作为锚点，其工作方式类似于点图层的**偏离点**\n\
  \n- **围绕质心**的工作方式类似于**围绕点**\n\n- **水平**将水平标签放置在多边形内的某处，独立于质心\n\n- **自由**将自由旋转的标签放置在多边形内部\n\
  \n- **使用周长**将标签放置在多边形的轮廓上\n\n下图显示了湖泊标签（lakes.shp），使用多行功能在空格字符处换行、居中对齐、字间距为 2，并使用**自由**选项进行定位：\n\
  \n![](img/2e88bf5938bf48a409c0a534a8775b21_158_0.png)\n\n## 手动放置标签\n\n除了自动标签放置外，我们还可以选择使用数据定义的放置方式来精确地将标签定位在我们需要的位置。在标注工具栏中，我们找到了手动移动和旋转标签的工具。这些工具仅对至少设置了\
  \ X 和 Y 坐标数据定义放置的图层处于激活和可用状态：\n\n- 要开始使用这些工具，我们只需为例如 airports.shp 文件添加三个新列：label_x、label_y\
  \ 和 label_rot。我们目前不需要在属性表中输入任何值。标注引擎会检查值，如果它发现属性字段为空，它会自动放置标签。\n\n- 然后，我们可以将指定这些列在标签的**放置**部分中。通过单击\
  \ **X 坐标**、**Y 坐标** 和 **旋转** 旁边的按钮来配置数据定义覆盖，如下所示：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_159_0.png)\n\
  \n3. 通过指定数据定义的放置，标注工具栏中的工具现在可用（注意必须开启编辑模式），我们可以使用**移动标签**和**旋转标签**工具来操作地图上的标签。更改内容会写回到属性表中。\n\
  \n4. 尝试移动一些标签，特别是那些紧密放置在一起的标签，观察自动放置的标签如何适应你的更改。\n\n## 控制标签渲染\n\n在**渲染**部分，我们可以定义基于比例的显示限制，以仅在特定比例下显示标签，以及基于像素大小的可见性，以隐藏小要素的标签。在这里，我们还可以告诉标注引擎**显示此图层的所有标签**（包括碰撞的标签），这些标签默认情况下是隐藏的。\n\
  \n以下示例显示了带有道路盾牌的标签。你可以从 http://upload.wikimedia.org/wikipedia/commons/c/c3/Blank_shield.svg\
  \ 下载一个空白道路盾牌 SVG。注意只有州际公路被标注了。这可以通过使用**渲染**部分中的**数据定义显示标签**设置并配合以下表达式来实现：\n\n```\n\
  \"level\" = 'Interstate'\n```\n\n标签使用**水平**选项进行定位（在**放置**部分中）。此外，启用了**合并相连线**以避免重复标签以及**抑制小于特定尺寸要素的标注**；例如，设置为\
  \ 5 毫米有助于避免杂乱的标注，因为它不会标注在当前比例下短于 5 毫米的道路片段。\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_160_0.png)\n\
  \n要设置道路盾牌，请前往**背景**部分，并从你下载文件的文件夹中选择空白盾牌 SVG。为了确保标签能很好地适应盾牌内部，我们额外将**大小类型**字段指定为带有\
  \ 1 毫米**大小**的缓冲区。这使盾牌比它包含的标签稍大一点。\n\n如果你点击**应用**，你会注意到标签没有完全居中于盾牌内部。为了修复这个问题，我们对盾牌位置施加了一个小的\
  \ Y 方向**偏移**，如下所示。此外，建议停用任何标签缓冲区，因为它们往往会遮挡盾牌的部分区域，而且我们本来也不需要它们。\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_160_1.png)\n\
  \n## 设计印刷地图\n\n在 QGIS 中，**印刷地图**是在打印布局器中设计的。一个 QGIS 项目可以包含多个布局器，因此选择一个描述性的名称是有意义的。布局器在每次保存项目时自动保存。要查看项目中所有可用布局的列表，请前往**项目\
  \ | 布局管理器**。\n\n我们可以通过前往**项目 | 新建打印布局**或使用*Ctrl + P* 打开一个新的布局。布局窗口包括以下内容：\n\n- 地图组成的预览区域，在创建新布局时显示空白页面\n\
  - 用于配置**组成**、**项目属性**和**制图图集生成**的面板，以及用于快速撤销和重做操作的**命令历史**面板\n- 用于管理、保存和导出布局的工具栏；在预览区域中导航；以及添加和排列不同的布局项目\n\
  \n一旦你按照意愿设计好了印刷地图，你可以通过前往**布局 | 另存为模板**将模板保存为**布局模板** .qpt 文件，并可以通过前往**布局 | 从模板添加项目**在其他项目中重用它。\n\
  \n## 创建基本地图\n\n在这个示例中，我们将创建一个基本地图，包含比例尺、指北针、一些说明性文字和图例。\n\n当我们启动打印布局时，我们首先在右侧看到**组成**面板。此面板提供了纸张选项，如大小、方向和页数。它也是配置捕捉行为和输出分辨率的地方。\n\
  \n首先，我们使用**添加新地图**按钮或在**布局 | 添加地图**中在纸上绘制地图矩形来将地图项目添加到纸张上。点击纸张，按住鼠标左键并拖动打开矩形。我们可以使用鼠标和**选择/移动项目**工具来移动和调整地图大小。或者，也可以在**项目属性**面板中配置所有地图设置。\n\
  \n## 创建精美地图\n\n**项目属性**面板的内容取决于当前选定的组成项目。如果选中了地图项目，我们可以调整地图的**比例**和**范围**，以及地图项目本身的**位置和大小**工具。在\
  \ 10,000,000 的**比例**下（CRS 设置为 EPSG:2964），我们基本上可以在 A4 大小的纸张上放置阿拉斯加的地图，如下所示。为了移动地图项目中显示的地理区域并更改地图比例，我们可以使用**移动项目内容**工具。\n\
  \n![](img/2e88bf5938bf48a409c0a534a8775b21_162_0.png)\n\n\n\n\n\n## 添加比例尺\n\n当地图看起来符合我们的要求后，我们可以使用**添加新比例尺**按钮，或通过**布局\
  \ | 添加比例尺**并单击地图来添加比例尺。**项目属性**面板现在会显示比例尺的属性，这些属性与下一条截图中的内容相似。由于我们可以向一个构图添加多个地图项目，因此指定比例尺属于哪个地图非常重要。第二个主要属性是比例尺**样式**，它允许我们在不同的比例尺类型之间进行选择，或者选择**数字**类型以进行简单的文本表示，例如\
  \ 1:10,000,000。使用**单位**属性，我们可以将英尺或米为单位的地图单位转换为更易管理的单位，例如英里或千米。**分段**属性控制比例尺中的分段数量和单个分段的大小。此外，这些属性还控制比例尺的颜色、字体、背景等。\n\
  \n![](img/2e88bf5938bf48a409c0a534a8775b21_163_0.png)\n\n## 添加指北针图片\n\n可以使用**添加图片**按钮，或通过**布局\
  \ | 添加图片**并单击纸张来向构图添加指北针。要使用 QGIS 安装中自带的 SVG 之一，请打开**项目属性**面板中的**搜索目录**部分。QGIS 加载\
  \ SVG 文件夹中的图片预览可能需要一些时间。您可以从图片列表中选择一个指北针，或者通过单击**图片来源**输入框旁边的按钮选择自己的图片。更多的地图装饰，例如箭头、矩形、三角形和椭圆形，可以使用相应的工具栏按钮添加：**添加箭头**、**添加矩形**等。\n\
  \n![](img/2e88bf5938bf48a409c0a534a8775b21_164_0.png)\n\n## 添加图例\n\n图例是另一个重要的地图元素。我们可以使用**添加新图例**按钮，或通过**布局\
  \ | 添加图例**来添加一个默认图例，其中包含所有当前可见地图图层的条目。图例条目可以在图例项目属性中重新组织（排序或添加到组）、编辑和移除。使用**文本换行**选项，我们可以将长标签拆分为多行。下面的截图显示了允许我们更改条目样式（隐藏、组或子组）的上下文菜单。相应的字体、大小和颜色可在**字体**部分配置。此外，此示例中的图例分为三**列**，如下方截图的右下部分所示。默认情况下，QGIS\
  \ 会尝试将一个图层的所有条目保留在单列中，但我们可以通过启用**拆分图层**来覆盖此行为。\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_165_0.png)\n\
  \n## 向地图添加说明文字\n\n要向地图添加文本，我们可以使用**添加新标签**按钮，或通过**布局 | 添加标签**。简单的标签使用相同的字体显示所有文本。通过启用**渲染为\
  \ HTML**，我们可以使用普通的 HTML 标记创建更精细的标签，包含标题、列表、不同颜色以及粗体或斜体高亮。以下是一个示例：\n\n```\n<h1>Alaska</h1>\n\
  <p>The name <i>\"Alaska\"</i> means \"the mainland\".</p>\n<ul><li>one list entry</li><li>another\
  \ entry</li></ul>\n<p style=\"font-size:70%;\">[% format_date( $now , 'yyyy-mm-dd'\
  \ ) %]</p>\n```\n\n标签还可以包含如下表达式：\n\n- [% $now %]：此表达式插入当前时间戳，可以使用 format_date 函数格式化，如下面的截图所示\n\
  - [% $page %] / [% $numpages %]：此表达式可用于在多页构图中插入页码\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_166_0.png)\n\
  \n## 添加地图网格和边框\n\n地图的其他常见要素是网格和边框。每个地图项目可以有一个或多个网格。单击**网格**部分中的 + 按钮以添加网格。**间隔**和**偏移**值必须以地图单位指定。我们可以在以下**网格类型**之间进行选择：\n\
  \n- 具有可自定义线条的普通**实线**网格\n- 以指定间隔绘制的**十字线**，样式可自定义\n- 以指定间隔绘制的可自定义**标记**\n- **仅边框和标注**将隐藏网格，同时仍显示边框和坐标标注\n\
  \n对于**网格边框**，我们可以从以下**边框样式**中选择：\n\n- **斑马纹**，具有可自定义的线条和填充颜色，如下面的截图所示\n- **内部刻度**、**外部刻度**或**内部和外部刻度**，用于指向地图内部、外部或两个方向的刻度线\n\
  - **线框**用于简单的线条边框\n\n使用**绘制坐标**，我们可以用相应的坐标标记网格。标签可以水平或垂直对齐，并放置在边框内部或外部，如下所示：\n\n\
  ![](img/2e88bf5938bf48a409c0a534a8775b21_167_0.png)\n\n## 创建总览图\n\n显示局部区域的地图通常伴随第二幅地图，告知读者该区域在更大上下文中的位置。要创建这样的总览图，我们添加第二个地图项目，并通过单击**总览**部分中的\
  \ + 按钮添加一个总览。通过设置**地图框**，我们可以定义应高亮显示的详细地图的范围。再次单击 + 按钮，我们可以向总览图添加更多地图框。下面的截图显示了一个示例，其中两个详细地图都添加到了总览图中。为了区分这两幅地图，总览高亮使用了颜色编码（通过更改总览**边框样式**），以匹配详细地图边框的颜色。\n\
  \n![](img/2e88bf5938bf48a409c0a534a8775b21_168_0.png)\n\n> 构图中的每个地图项目都可以显示不同的图层组合。通常，作曲者中的地图项目与主\
  \ QGIS 窗口中的地图同步。因此，如果我们在主窗口中关闭一个图层，它也会从打印作曲者的地图中移除。但是，我们可以通过在地图项目的属性中启用**锁定图层**来停止这种自动同步。\n\
  \n## 使用属性表和 HTML 框架添加更多细节\n\n要向地图插入更多细节，作曲者还提供了使用**添加属性表**按钮或通过**布局 | 添加属性表**向构图添加**属性表**的选项。通过启用**仅显示地图内可见要素**，我们可以过滤表格并仅显示相关结果。可以使用**使用过滤器**选项设置其他过滤表达式。可以通过**属性**按钮进行排序（例如，按名称排序，如下面的截图所示）和重命名列。要自定义具有粗体和居中文本的标题行，请转到**字体和文本样式**部分并更改**表格标题**设置。\n\
  \n![](img/2e88bf5938bf48a409c0a534a8775b21_169_0.png)\n\n甚至可以使用**添加 HTML 框架**按钮添加更高级的内容。我们可以将项目的\
  \ URL 引用指向本地机器或在线上的任何 HTML 页面，其内容（文本和图像，如同在 Web 浏览器中显示的一样）将显示在作曲者页面上。\n\n## 使用 Atlas\
  \ 功能创建地图系列\n\n使用打印作曲者的 Atlas 功能，我们可以使用一个打印构图创建一系列地图。该工具将为所谓的**覆盖图层**中的每个要素创建一个输出（可以是图像文件、PDF\
  \ 或一个 PDF 中的多个页面）。\n\nAtlas 可以控制并更新一个构图中的多个地图项目。要为地图项目启用 Atlas，我们必须在地图项目的**项目属性**中启用**由\
  \ Atlas 控制**选项。当我们在**由 Atlas 控制**部分使用**固定比例**选项时，所有地图将使用相同的比例渲染。如果我们需要更灵活的输出，我们可以切换到**要素周围边距**选项，该选项会缩放到每个**覆盖图层**要素，并在指定的边距周围区域之外渲染它。\n\
  \n![](img/2e88bf5938bf48a409c0a534a8775b21_170_0.png)\n\n要完成配置，我们切换到**Atlas 生成**面板。如前所述，Atlas\
  \ 将为**覆盖图层**下拉菜单中配置的图层中的每个要素创建一幅地图。覆盖图层中的要素可以像普通要素一样显示，也可以通过启用**隐藏覆盖图层**来隐藏。向**要素过滤**选项添加表达式或启用**排序依据**选项可以进一步微调结果。**输出**字段可以是每个覆盖图层要素的一幅图像或一个\
  \ PDF，或者您可以通过在**作曲者 | 导出为 PDF** 之前启用**尽可能单文件导出**来创建多页 PDF。\n\n一旦这些配置完成，我们可以通过启用**预览\
  \ Atlas**按钮来预览地图系列，您可以在下一条截图的左上角看到该按钮。预览按钮旁边的箭头按钮用于在 Atlas 地图之间导航。\n\n\n\n\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_171_0.png)\n\
  \n## 在线展示地图\n\n除了印刷地图外，网络地图也是发布地图的另一种流行方式。在本节中，我们将使用不同的 QGIS 插件创建不同类型的网络地图。\n\n\
  ### 导出网络地图\n\n要在 QGIS 中创建网络地图，我们可以使用 **qgis2web** 插件，该插件需要通过 **插件管理器** 安装。安装后，转到\
  \ **Web | qgis2web | 创建网络地图** 即可启动。**qgis2web** 支持两种最流行的开源网络制图库：**OpenLayers 3**\
  \ 和 **Leaflet**。\n\n以下屏幕截图显示了我们机场数据集的一个示例。在此示例中，我们使用的是 **Leaflet** 库（如下图所示左下角的配置），因为在撰写本书时，只有\
  \ **Leaflet** 支持 SVG 标记：\n\n- 1. 在左上角，您可以配置项目中要在网络地图上显示的图层，以及 **信息弹出内容**，当用户单击或悬停在要素上时（取决于\
  \ **悬停时显示弹出窗口** 设置）会显示该内容。\n- 2. 在右下角，您可以为网络地图选择背景地图。选择一个并单击 **更新预览** 按钮查看结果。\n\n\
  ![](img/2e88bf5938bf48a409c0a534a8775b21_172_0.png)\n\n3. 在左下角，您可以进一步配置网络地图。所有可用设置都记录在帮助选项卡中，因此此处不重复其内容。同样，在进行更改时，请不要忘记单击更新预览按钮。\n\
  \n配置满意后，单击导出按钮。这将把网络地图保存到指定为导出文件夹的位置，并在网络浏览器中打开生成的网络地图。您可以将导出文件夹中的内容复制到网络服务器以发布地图。\n\
  \n## 创建地图瓦片\n\n在网络上共享地图的另一种流行方式是 **地图瓦片**。这些基本上只是图像集合。这些图像瓦片通常为 256 × 256 像素，并并排放置以营造出一个非常大、无缝的地图图像的错觉。每个瓦片都有一个\
  \ z 坐标来描述其缩放级别，以及 x 和 y 坐标来描述其在该缩放级别的正方形网格中的位置。在缩放级别 0（z0）时，整个世界都适合一个瓦片。从那以后，每个连续的缩放级别都与前一个缩放级别以\
  \ 4 的幂相关。这意味着 z0 包含 1 个瓦片，z1 包含 4 个瓦片，z2 包含 16 个瓦片，以此类推。\n\n在 QGIS 中，我们可以使用 **QTiles**\
  \ 插件通过 **插件管理器** 安装来为我们的项目创建地图瓦片。安装后，您可以转到 **插件 | QTiles** 启动它。以下屏幕截图显示了插件对话框，我们可以在其中配置\
  \ **输出** 位置、我们要导出为瓦片的地图的 **范围**，以及我们要创建瓦片的 **缩放** 级别。\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_173_0.png)\n\
  \n单击确定后，插件将创建一个包含所有瓦片的 .zip 文件。在网络制图库中使用地图瓦片超出了本书的范围。请参阅您使用的网络制图库的文档，了解如何嵌入瓦片的说明。例如，如果您使用\
  \ Leaflet，可以参考 https://switch2osm.org/using-tiles/getting-started-with-leaflet 获取详细说明。\n\
  \n## 导出 3D 网络地图\n\n要创建令人惊艳的 3D 网络地图，我们需要 Qgis2threejs 插件，可以通过插件管理器安装。\n\n例如，我们可以使用\
  \ srtm_05_01.tif 高程数据集创建阿拉斯加该部分的 3D 视图。以下屏幕截图显示了 Qgis2threejs 对话框中 DEM 层的配置。通过将显示类型选择为地图画布图像，我们进一步定义当前地图图像（在对话框右侧显示）将被覆盖在\
  \ 3D 表面上：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_174_0.png)\n\n除了创建 3D 表面外，此插件还可以标注要素。例如，我们可以添加我们的机场并用其名称标注它们，如下一张屏幕截图所示。通过将标签高度设置为点高度，我们让插件自动确定标签放置的位置，但当然，您也可以通过更改为固定值或要素属性之一手动覆盖此设置。\n\
  \n![](img/2e88bf5938bf48a409c0a534a8775b21_175_0.png)\n\n如果单击立即运行，插件将创建导出并在网络浏览器中打开\
  \ 3D 地图。第一次尝试时，表面看起来过于平坦的可能性很大。幸运的是，这可以通过调整插件配置世界部分中的垂直夸大设置轻松更改。以下示例使用垂直夸大 10 创建：\n\
  \n![](img/2e88bf5938bf48a409c0a534a8775b21_175_1.png)\n\nQgis2threejs 将所有文件导出到输出\
  \ HTML 文件路径指定的位置。您可以将该文件夹中的内容复制到网络服务器以发布地图。\n\n## 总结\n\n在本章中，我们更详细地了解了如何使用高级矢量图层样式（例如分类或基于规则的样式）创建更复杂的地图。我们还介绍了\
  \ QGIS 中可用的自动和手动要素标注选项。本章还向您展示了如何使用打印布局创建可打印地图，并介绍了用于创建地图集的地图集功能。最后，我们创建了可以在线发布的网络地图。\n\
  \n恭喜！到目前为止的章节中，您已经学习了如何安装和使用 QGIS 来创建、编辑和分析空间数据，以及如何以有效的方式呈现它。在接下来的最后一章中，我们将研究使用\
  \ Python 扩展 QGIS 功能。\n\n## 6\n\n## 使用 Python 扩展 QGIS\n\n本章是使用 Python 脚本化 QGIS 的介绍。当然，完整的\
  \ Python 教程超出了本书的范围。因此，此处的示例假定您具备使用 Python 的最低熟练程度。Python 是一种非常易于访问的编程语言，即使您刚刚入门，它在开源和专有\
  \ GIS 世界中也获得了很大的人气，例如 ESRI 的 ArcPy 或 PyQGIS。QGIS 目前支持 Python 2.7，但计划在即将推出的 QGIS\
  \ 3.x 系列中支持 Python 3。我们将从介绍操作开始，然后转向 QGIS Python 控制台，然后进入处理工具箱自定义工具的更高级开发，并解释如何创建自己的插件。\n\
  \n## 使用操作添加功能\n\n操作是为 QGIS 添加自定义功能的便捷方式。操作是为特定图层创建的，例如我们的居民点数据集 popp.shp。因此，要创建操作，我们转到图层属性\
  \ | 操作。有不同类型的操作，例如以下：\n\n- - **通用操作** 启动外部进程；例如，您运行命令行应用程序，如 ogr2ogr\n\n> ogr2ogr\
  \ 是一个命令行工具，可用于转换文件格式，同时执行空间或属性选择和重投影等操作。\n\n- - **Python 操作** 执行 Python 脚本\n\n-\
  \ **打开操作** 使用计算机配置的默认应用程序打开文件，即 `.pdf` 文件的 PDF 查看应用程序或网站的浏览器\n\n- 操作系统（Mac、Windows\
  \ 和 Unix）操作的工作方式类似于通用操作，但仅限于各自的操作系统\n\n### 配置您的第一个 Python 操作\n\n单击对话框右侧的 **添加默认操作**\
  \ 按钮，为您的 popp 图层添加一些示例操作。这对于开始使用操作非常方便。例如，名为 **所选字段的值** 的 Python 操作将在我们使用操作工具时显示指定的属性值。在尝试此操作之前，我们需要做的全部工作就是更新它，使其访问图层有效属性。例如，我们可以使其在消息框中显示\
  \ popp 图层的 `TYPE` 属性值，如下一张屏幕截图所示：\n\n- 1. 在 **操作列表** 中选择 **所选字段的值** 操作。\n- 2. 编辑对话框底部的\
  \ **操作代码**。您可以手动输入属性名称或从下拉列表中选择它并单击 **插入字段**。\n- 3. 要保存更改，请单击 **更新所选操作**。\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_178_0.png)\n\
  \n\n\n\n要使用此操作，请关闭**图层属性**对话框，并单击**运行要素操作**按钮旁边的下拉箭头。这将展开可用图层操作列表，如下面的屏幕截图所示：\n\n\
  ![](img/2e88bf5938bf48a409c0a534a8775b21_179_0.png)\n\n单击**所选字段的值**条目，然后点击一个图层要素。这将打开一个弹出对话框，操作将在其中输出该要素的**TYPE**值。当然，我们也可以让此操作输出更多信息，例如，将其扩展为这样：\n\
  \n```\nQtGui.QMessageBox.information(None, \"Current field's value\",\n\"Type: [%\
  \ \"TYPE\" %] \\n[% \"F_CODEDESC\" %]\")\n```\n\n这将显示第一行上的TYPE值和第二行上的F_CODEDESC值。\n\
  \n![](img/2e88bf5938bf48a409c0a534a8775b21_179_1.png)\n\n## 使用操作打开文件\n\n要从QGIS内部直接打开文件，我们使用“打开”操作。如果你在之前的练习中添加了默认操作，你的图层将已经有一个打开文件操作。该操作就像[%\
  \ \"PATH\" %]一样简单，用于打开图层路径属性中指定的文件路径。由于我们的示例数据集都不包含路径属性，我们现在添加一个来测试此功能。如果你需要了解如何添加新属性的详细信息，请参阅第3章“数据创建与编辑”。例如，下图中添加的路径将分别打开默认图像查看器和PDF查看器应用程序：\n\
  \n![](img/2e88bf5938bf48a409c0a534a8775b21_180_0.png)\n\n前面的示例使用存储在属性中的绝对路径，但你也可以通过更改操作代码来使用相对路径，以补全存储在属性值中的部分路径；例如，你可以使用C:\\\
  temp\\[% \"TYPE\" %].png打开根据TYPE属性值命名的.png文件。\n\n## 使用操作打开网页浏览器\n\n另一种有用的“打开”操作是打开网页浏览器并访问特定网站。例如，考虑此操作：\n\
  \n```\nhttp://www.google.com/search?q=[% \"TYPE\" %]\n```\n\n它将打开你的默认网页浏览器，并使用Google搜索TYPE值；而此操作：\n\
  \n```\nhttps://en.wikipedia.org/w/index.php?search=[% \"TYPE\" %]\n```\n\n将在维基百科上进行搜索。\n\
  \n## 认识Python控制台\n\n与QGIS API（**应用程序编程接口**的缩写）交互最直接的方式是通过**Python控制台**，你可以通过进入**插件\
  \ | Python控制台**来打开它。如下面的屏幕截图所示，**Python控制台**显示在地图下方的新面板中：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_181_0.png)\n\
  \n我们与应用程序、项目和数据进行交互的入口是`iface`对象。要获取`iface`可用函数的列表，请键入`help(iface)`。或者，这些信息也可以在线获取，位于**API文档**的`http://qgis.org/api/classQgisInterface.html`。\n\
  \n## 加载和探索数据集\n\n我们首先要做的事情之一就是加载一些数据。例如，要加载矢量图层，我们使用`iface`的`addVectorLayer()`函数：\n\
  \n```\nv_layer = iface.addVectorLayer('C:/Users/anita/Documents/Geodata/qgis_sample_data/shapefiles/airports.shp','airports','ogr')\n\
  ```\n\n你可能已经注意到，attributes()向我们显示了属性值，但我们还不知道字段名。要获取字段名，我们使用以下代码：\n\n```\nfor field\
  \ in v_layer.fields():\n    print field.name()\n```\n\n输出如下：\n\nID\nfk_region\n\
  ELEV\nNAME\nUSE\n\n一旦我们知道了字段名，就可以访问特定的要素属性，例如NAME：\n\n```\nfor feature in v_layer.getFeatures():\n\
  \    print feature.attribute('NAME')\n```\n\n输出如下：\n\nNOATAK\nAMBLER\nBETTLES\n\
  ...\n\n例如，要快速求和海拔值，一种解决方案如下：\n\n```\nsum([feature.attribute('ELEV') for feature\
  \ in v_layer.getFeatures()])\n```\n\n输出如下：\n\n22758.0\n\n> 在前面的示例中，我们利用了Python允许我们在方括号内编写for循环来创建列表这一特性。这被称为列表推导式，你可以访问https://docs.python.org/2/tutorial/data\
  \ structures.html#list-comprehensions了解更多信息。\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_183_0.png)\n\
  \n加载栅格数据与加载矢量数据非常相似，可以使用addRasterLayer()来完成：\n\n```\nr_layer = iface.addRasterLayer('C:/Users/anita/Documents/Geodata/qgis_sample_data/raster/SR_50M_alaska_nad.tif','hillshade')\n\
  r_layer.name()\n```\n\n输出如下：\n\n```\nu'hillshade'\n```\n\n要获取栅格图层的像素大小，我们可以使用width()和height()函数，如下所示：\n\
  \n```\nr_layer.width(), r_layer.height()\n```\n\n输出如下：\n\n```\n(1754, 1394)\n```\n\
  \n如果我们想了解更多关于栅格值的信息，可以使用图层的数据提供者（data provider）对象，它提供了对栅格波段统计信息的访问。值得注意的是，我们必须使用bandStatistics(1)而不是bandStatistics(0)来访问单波段栅格（例如我们的山体阴影图层）的统计信息（例如，获取最大值）：\n\
  \n```\nr_layer.dataProvider().bandStatistics(1).maximumValue\n```\n\n输出如下：\n\n```\n\
  251.0\n```\n\n其他可以这样访问的值包括minimumValue、range、stdDev和sum。要获取完整列表，请使用以下代码行：\n\n```\n\
  help(r_layer.dataProvider().bandStatistics(1))\n```\n\n## 设置图层样式\n\n既然我们现在知道如何加载数据，就可以继续设置图层样式了。最简单的选项是加载预先制作好的样式（一个.qml文件）：\n\
  \n```\nv_layer.loadNamedStyle('C:/temp/planes.qml')\nv_layer.triggerRepaint()\n\
  ```\n\n请确保调用triggerRepaint()，以确保地图被重新绘制以反映你的更改。\n\n> 你可以通过保存在第2章“查看空间数据”中创建的机场样式来创建planes.qml（通过进入“图层属性\
  \ | 样式 | 保存样式 | QGIS图层样式文件”），或者使用你喜欢的任何其他样式。\n\n当然，我们也可以使用代码创建样式。让我们来看一个基本的单一符号渲染器。我们创建一个具有一个图层的简单符号，例如，一个黄色菱形：\n\
  \n```\nfrom PyQt4.QtGui import QColor\nsymbol = QgsMarkerSymbolV2()\nsymbol.symbolLayer(0).setName('diamond')\n\
  symbol.symbolLayer(0).setSize(10)\nsymbol.symbolLayer(0).setColor(QColor('#ffff00'))\n\
  v_layer.rendererV2().setSymbol(symbol)\nv_layer.triggerRepaint()\n```\n\n更高级的方法是创建基于规则的渲染器。我们在第5章“创建精美地图”中讨论了基于规则渲染器的基础知识。以下示例创建两个规则：一个用于民用机场，另一个用于所有其他机场。由于此脚本较长，我建议你使用Python控制台编辑器，你可以通过单击“显示编辑器”按钮打开它，如下面的屏幕截图所示：\n\
  \n![](img/2e88bf5938bf48a409c0a534a8775b21_185_0.png)\n\n此示例中的每条规则都有一个名称、一个过滤表达式和一个符号颜色。请注意规则是如何附加到渲染器的根规则上的：\n\
  \n```\nfrom PyQt4.QtGui import QColor\nrules = [['\"Civil\" LIKE \\'%Civil%\\'',\
  \ 'green'], ['Other', 'USE NOT LIKE \\'%Civil%\\'', 'red']]\nsymbol = QgsSymbolV2.defaultSymbol(v_layer.geometryType())\n\
  renderer = QgsRuleBasedRendererV2(symbol)\nroot_rule = renderer.rootRule()\nfor\
  \ label, expression, color_name in rules:\n    rule = root_rule.children()[0].clone()\n\
  \    rule.setLabel(label)\n    rule.setFilterExpression(expression)\n    rule.symbol().setColor(QColor(color_name))\n\
  \    root_rule.appendChild(rule)\nroot_rule.removeChildAt(0)\nv_layer.setRendererV2(renderer)\n\
  v_layer.triggerRepaint()\n```\n\n要运行脚本，请单击编辑器工具栏底部的**运行脚本**按钮。\n\n> 如果你有兴趣阅读更多关于设置矢量图层样式的内容，我推荐Joshua\
  \ Arnott在http://snorf.net/blog/2014/03/04/symbology-of-vector-layers-in-qgis-python-plugins/上的文章。\n\
  \n## 过滤数据\n\n要以编程方式过滤矢量图层要素，我们可以指定一个子集字符串。这等同于在**图层属性 | 常规**部分中定义**要素子集**查询。例如，我们可以选择仅在机场名称以A开头时才显示它们：\n\
  \n```\nv_layer.setSubsetString(\"NAME LIKE 'A%'\")\n```\n\n要移除此过滤器，只需设置一个空的子集字符串：\n\
  \n```\nv_layer.setSubsetString(\"\")\n```\n\n\n\n# 创建内存图层\n\n创建临时矢量图层的一种好方法是使用所谓的**内存图层**。内存图层是临时分析输出或可视化的一个不错选择。它们是临时草图图层的脚本等价物，我们在\
  \ *第 3 章，数据创建与编辑* 中使用过它。与临时草图图层一样，内存图层存在于 QGIS 会话中，并在关闭 QGIS 时被销毁。在下面的示例中，我们创建一个内存图层并向其中添加一个面要素。\n\
  \n基本上，内存图层是一个 `QgsVectorLayer`，与其他图层一样。然而，提供者（第三个参数）不是上一个加载文件示例中的 'ogr'，而是 'memory'。第一个参数不是文件路径，而是一个定义字符串，指定几何类型、CRS\
  \ 以及属性表字段（本例中为一个名为 `MYNUM` 的整数字段和一个名为 `MYTXT` 的字符串字段）：\n\n```\nmem_layer =\nQgsVectorLayer(\"\
  polygon?crs=epsg:4326&field=MYNUM:integer&field=MYTXT:string\", \"temp_layer\",\
  \ \"memory\")\nif not mem_layer.isValid():\n    raise Exception(\"Failed to create\
  \ memory layer\")\n```\n\n一旦我们创建了 `QgsVectorLayer` 对象，我们就可以开始向其数据提供者添加要素：\n\n```\n\
  mem_layer_provider = mem_layer.dataProvider()\nmy_polygon = QgsFeature()\nmy_polygon.setGeometry(\n\
  \    QgsGeometry.fromRect(QgsRectangle(16,48,17,49)))\nmy_polygon.setAttributes([10,\"\
  hello world\"])\nmem_layer_provider.addFeatures([my_polygon])\nQgsMapLayerRegistry.instance().addMapLayer(mem_layer)\n\
  ```\n\n> 注意我们首先创建一个空白的 `QgsFeature`，然后分别使用 `setGeometry()` 和 `setAttributes()` 为其添加几何和属性。当我们将图层添加到\
  \ `QgsMapLayerRegistry` 时，图层会在地图上渲染。\n\n# 导出地图图像\n\n保存当前地图的最简单选项是使用与项目下“另存为图像”相同的脚本等价物。这将以\
  \ QGIS 应用程序窗口中地图区域相同的分辨率将当前地图导出为图像文件：\n\n```\niface.mapCanvas().saveAsImage('C:/temp/simple_export.png')\n\
  ```\n\n如果我们想要对导出的图像的尺寸和分辨率有更多控制，则需要几行额外的代码。下面的示例展示了如何创建自己的 QgsMapRendererCustomPainterJob\
  \ 对象，并使用自定义的 QgsMapSettings 配置尺寸（宽度和高度）、分辨率（dpi）、地图范围和地图图层：\n\n```\nfrom PyQt4.QtGui\
  \ import QImage, QPainter\nfrom PyQt4.QtCore import QSize\n# configure the output\
  \ image\nwidth = 800\nheight = 600\ndpi = 92\nimg = QImage(QSize(width, height),\
  \ QImage.Format_RGB32)\nimg.setDotsPerMeterX(dpi / 25.4 * 1000)\nimg.setDotsPerMeterY(dpi\
  \ / 25.4 * 1000)\n# get the map layers and extent\nlayers = [ layer.id() for layer\
  \ in iface.legendInterface().layers() ]\nextent = iface.mapCanvas().extent()\n#\
  \ configure map settings for export\nmapSettings = QgsMapSettings()\nmapSettings.setMapUnits(0)\n\
  mapSettings.setExtent(extent)\nmapSettings.setOutputDpi(dpi)\nmapSettings.setOutputSize(QSize(width,\
  \ height))\nmapSettings.setLayers(layers)\nmapSettings.setFlags(QgsMapSettings.Antialiasing\
  \ | QgsMapSettings.UseAdvancedEffects | QgsMapSettings.ForceVectorOutput | QgsMapSettings.DrawLabeling)\n\
  # configure and run painter\np = QPainter()\np.begin(img)\nmapRenderer = QgsMapRendererCustomPainterJob(mapSettings,\
  \ p)\nmapRenderer.start()\nmapRenderer.waitForFinished()\np.end()\n# save the result\n\
  img.save(\"C:/temp/custom_export.png\",\"png\")\n```\n\n## 使用 Python 创建自定义地理处理脚本\n\
  \n在 *第 4 章，空间分析* 中，我们使用 **Processing Toolbox** 的工具来分析数据，但我们并不局限于这些工具。我们可以用自己的脚本扩展\
  \ *processing*。*processing* 脚本相对于上一节中看到的普通 Python 脚本的优势如下：\n\n- Processing 会自动为脚本生成图形用户界面以配置脚本参数\n\
  - Processing 脚本可用于 **Graphical modeler** 以创建地理处理模型\n\n如下截图所示，**Scripts** 部分最初是空的，除了一些用于添加和创建新脚本的\
  \ **Tools**：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_189_0.png)\n\n### 编写你的第一个\
  \ Processing 脚本\n\n我们将创建第一个简单的脚本；它获取一些图层信息。开始时，双击 Scripts | Tools 中的 Create new\
  \ script 条目。这将打开一个空的 Script editor 对话框。下面的截图显示了 Script editor，其中包含一个简短的脚本，该脚本会在\
  \ Python Console 上打印输入图层的名称：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_190_0.png)\n\
  \n第一行表示我们的脚本将被放入 Learning QGIS 脚本组中，如下截图所示。双哈希（##）是 Processing 语法，表示该行包含 Processing\
  \ 特定信息而不是 Python 代码。脚本名称由保存脚本时选择的文件名创建。对于本示例，我将脚本保存为 my_first_script.py。第二行定义了脚本输入，本例中为矢量图层。在下一行，我们使用\
  \ Processing 的 getObject() 函数来访问输入图层对象，最后图层名称会打印在 Python Console 上。\n\n你可以直接从编辑器中通过点击\
  \ Run algorithm 按钮运行脚本，或通过在 Processing Toolbox 中双击条目运行。如果想更改代码，请使用条目上下文菜单中的 Edit\
  \ script，如此截图所示：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_190_1.png)\n\n> 学习如何为\
  \ Processing 编写自定义脚本的一个好方法是查看现有脚本，例如 https://github.com/qgis/QGIS-Processing/tree/master/scripts。这是官方脚本仓库，你也可以使用\
  \ Processing Toolbox 中的内置 **Get scripts from on-line scripts collection** 工具下载脚本。\n\
  \n### 编写具有矢量图层输出的脚本\n\n当然，在大多数情况下，我们不想只在 **Python Console** 上输出内容。因此，下面的示例展示了如何创建矢量图层。更具体地说，脚本会在输入图层中的点周围创建正方形面要素。数值\
  \ `size` 输入参数控制输出矢量图层中正方形的大小。自动生成的对话框中显示的默认大小设置为 `1000000`：\n\n```\n##Learning QGIS=group\n\
  ##input_layer=vector\n##size=number 1000000\n##squares=output vector\nfrom qgis.core\
  \ import *\nfrom processing.tools.vector import VectorWriter\n# get the input layer\
  \ and its fields\nmy_layer = processing.getObject(input_layer)\nfields = my_layer.dataProvider().fields()\n\
  # create the output vector writer with the same fields\nwriter = VectorWriter(squares,\
  \ None, fields, QGis.WKBPolygon,\nmy_layer.crs())\n# create output features\nfeat\
  \ = QgsFeature()\nfor input_feature in my_layer.getFeatures():\n    # copy attributes\
  \ from the input point feature\n    attributes = input_feature.attributes()\n  \
  \  feat.setAttributes(attributes)\n    # create square polygons\n    point = input_feature.geometry().asPoint()\n\
  \    xmin = point.x() - size/2\n    ymin = point.y() - size/2\n    square = QgsRectangle(xmin,ymin,xmin+size,ymin+size)\n\
  \    feat.setGeometry(QgsGeometry.fromRect(square))\n    writer.addFeature(feat)\n\
  del writer\n```\n\n在此脚本中，我们使用 VectorWriter 来写入输出矢量图层。创建 VectorWriter 对象的参数为 fileName、encoding、fields、geometryType\
  \ 和 crs。\n\n> 可用的几何类型为 QGIS.WKBPoint、QGIS.WKBLineString、QGIS.WKBPolygon、QGIS.WKBMultiPoint、QGIS.WKBMultiLineString\
  \ 和 QGIS.WKBMultiPolygon。你也可以在 Python Console 中输入 VectorWriter.TYPE_MAP 来获取此几何类型列表。\n\
  \n注意我们使用输入图层的字段（my_layer.dataProvider().fields()）来创建 VectorWriter。这确保输出图层具有与输入图层相同的字段（属性表列）。同样，对于输入图层中的每个要素，我们将其属性值（input_feature.attributes()）复制到对应的输出要素中。\n\
  \n运行脚本后，结果图层将被加载到 QGIS 中，并使用输出参数名称列出；本例中图层名为 squares。下面的截图显示了自动生成的输入对话框以及将脚本应用于样本数据集中机场时的输出：\n\
  \n![](img/2e88bf5938bf48a409c0a534a8775b21_192_0.png)\n\n\n\n\n\n## 可视化脚本进度\n\n\
  尤其是在执行需要花费一段时间才能完成的复杂脚本时，在进度条中显示脚本执行的进度是良好的做法。要为之前的脚本添加进度条，我们可以在遍历输入要素的 for 循环之前和内部添加以下代码行：\n\
  \n```\ni = 0\nn = my_layer.featureCount()\nfor input_feature in my_layer.getFeatures():\n\
  \    progress.setPercentage(int(100*i/n))\n    i+=1\n```\n\n> 请注意，我们在循环之前初始化 i 计数器，并在使用\
  \ `progress.setPercentage()` 更新进度条后在循环内部递增它。\n\n## 开发你的第一个插件\n\n当你想要实现交互式工具或非常特定的图形用户界面时，就该研究插件开发了。在之前的练习中，我们介绍了\
  \ QGIS Python API。因此，我们现在可以专注于启动我们第一个 QGIS 插件所需的步骤。创建 QGIS 插件的好处在于，有一个专门用于此的插件！它叫做\
  \ Plugin Builder。而且顺便说一下，也安装 Plugin Reloader，它对插件开发者非常有用。因为它让你在每次修改代码时无需每次都重新启动\
  \ QGIS 即可快速重新加载插件。当你安装了这两个插件后，你的插件工具栏将如下所示：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_193_0.png)\n\
  \n在开始之前，我们还需要安装 Qt Designer，这是我们将用来设计用户界面的应用程序。如果你使用的是 Windows，我推荐 WinPython (http://winpython.github.io/)\
  \ 版本 2.7.10.3（截至本书撰写时 Python 2.7 的最新版本），它提供了 Qt Designer 和 Spyder（Python 的集成开发环境）。在\
  \ Ubuntu 上，你可以使用 `sudo apt-get install qt4-designer` 安装 Qt Designer。在 Mac 上，你可以从\
  \ http://qt-project.org/downloads 获取 Qt Creator 安装程序（其中包含 Qt Designer）。\n\n## 使用\
  \ Plugin Builder 创建插件模板\n\nPlugin Builder 将为我们的插件创建所需的所有文件。要创建插件模板，请按照以下步骤操作：\n\n\
  - 1. 启动 Plugin Builder 并输入基本插件信息，包括：\n  - 类名（驼峰命名的一个词；即每个单词以大写字母开头）\n  - 插件名称（简短描述）\n\
  \  - 模块名（插件的 Python 模块名）\n\n当你在 Plugin Builder 对话框中将鼠标悬停在输入字段上时，它会显示帮助信息，如以下屏幕截图所示：\n\
  \n![](img/2e88bf5938bf48a409c0a534a8775b21_194_0.png)\n\n- 2. 点击 Next 进入 About 对话框，在其中可以输入插件功能的更详细描述。由于我们计划仅为学习目的创建第一个插件，我们可以在这里输入一些随机文本，然后点击\
  \ Next。\n\n- 3. 现在我们可以选择一个插件 **Template** 并指定 **Text for the menu item** 以及插件应列出的\
  \ **Menu**，如以下屏幕截图所示。可用模板包括 **Tool button with dialog**、**Tool button with dock\
  \ widget** 和 **Processing provider**。在本练习中，我们将创建一个 **Tool button with dialog** 并点击\
  \ **Next**：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_195_0.png)\n\n- 4. 下一个对话框显示复选框，我们可以在其中选择应创建哪些非必要的插件文件。你可以选择提供的任何子集并点击\
  \ **Next**。\n\n- 5. 在下一个对话框中，我们需要指定插件的 **Bug tracker** 和代码 **Repository**。同样，由于我们仅为学习目的创建此插件，我在下图中只是编造了一些\
  \ URL，但如果你计划将插件公开可用，则应使用适当的跟踪器和代码存储库：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_196_0.png)\n\
  \n- 6. 点击 **Next** 后，你将被要求选择一个用于存储插件的文件夹。你可以直接保存在 QGIS 插件文件夹中，Windows 上为 `~\\.qgis2\\\
  python\\plugins`，Linux 和 Mac 上为 `~/.qgis2/python/plugins`。\n\n- 7. 选择插件文件夹后，它会显示一个\
  \ **Plugin Builder Results** 确认对话框，确认你的插件文件夹位置以及你的 QGIS 插件文件夹位置。如前所述，我直接保存在 QGIS\
  \ 插件文件夹中，如以下屏幕截图所示。如果你保存在其他位置，现在可以将插件文件夹移入 QGIS 插件文件夹，以确保 QGIS 能找到并加载它：\n\n### Plugin\
  \ Builder Results\n\n恭喜！你刚刚为 QGIS 构建了一个插件！\n\n你的插件 **MyFirstPlugin** 已创建于：\n`C:\\\
  Users\\anita\\.qgis2\\python\\plugins\\MyFirstPlugin`\n\n你的 QGIS 插件目录位于：\n`C:\\\
  Users\\anita\\.qgis2\\python\\plugins`\n\n### What's Next\n\n- 1. 在你的插件目录中，使用 pyrcc4\
  \ 编译资源文件（如果有 automake，只需运行 **make** 或使用 **pb_tool**）\n- 2. 使用 **make test** 测试生成的源代码（或从你的\
  \ IDE 运行测试）\n- 3. 将包含新插件的整个目录复制到 QGIS 插件目录（见下面的说明）\n- 4. 通过在 QGIS 插件管理器中启用它来测试插件\n\
  \n我们仍然需要做的一件事是为插件工具栏准备图标。这需要我们编译 `resources.qrc` 文件，**Plugin Builder** 已自动创建它，以将图标转换为可用的\
  \ Python 代码。这是在命令行上完成的。在 Windows 上，我推荐使用 **OSGeo4W shell**，因为它确保环境变量被设置成能够找到必要工具的方式。导航到插件文件夹并运行以下命令：\n\
  \n```\npyrcc4 -o resources_rc.py resources.qrc\n```\n\n> 你可以替换默认图标（`icon.png`）以添加你自己的插件图标。之后，你只需如上所示重新编译\
  \ `resources.qrc` 即可。\n\n重新启动 QGIS，你现在应该能在插件管理器中看到你的插件，如下所示：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_198_0.png)\n\
  \n在插件管理器中激活你的插件，你应该能在插件菜单中看到它。当你启动插件时，它会显示一个空白对话框，等待你对其进行自定义。\n\n## 自定义插件 GUI\n\n\
  要自定义空白的默认插件对话框，我们使用 Qt Designer。你可以在插件文件夹中找到对话框文件。在我的例子中，它叫做 `my_first_plugin_dialog_base.ui`（源自我在\
  \ Plugin Builder 中指定的模块名）。当你在 Qt Designer 中打开插件的 `.ui` 文件时，你会看到空白对话框。现在你可以从 Qt Designer\
  \ 窗口左侧的 Widget Box 开始通过拖放添加控件。在以下屏幕截图中，你可以看到我添加了一个标签和一个下拉列表控件（在 Widget Box 中列为 Combo\
  \ Box）。你可以通过双击默认标签文本将标签文本更改为 Layer。此外，为控件对象分配描述性名称是良好的做法；例如，我将组合框重命名为 `layerCombo`，你可以在这里的右下角看到：\n\
  \n![](img/2e88bf5938bf48a409c0a534a8775b21_199_0.png)\n\n完成对插件对话框的更改后，你可以保存它们。然后你可以返回到\
  \ QGIS。在 QGIS 中，你现在可以通过点击插件工具栏中的 Choose a plugin to be reloaded 按钮并选择你的插件来配置 Plugin\
  \ Reloader。如果你现在点击 Reload Plugin 按钮，然后按下你的插件按钮，你的新插件对话框将被显示。\n\n## 实现插件功能\n\n正如你一定注意到的那样，图层组合框仍然是空的。为了用已加载图层的列表填充组合框，我们需要在\
  \ `my_first_plugin.py`（位于插件文件夹中）中添加几行代码。更具体地说，我们扩展 `run()` 方法：\n\n```\ndef run(self):\n\
  \    \"\"\"Run method that performs all the real work\"\"\"\n    # show the dialog\n\
  \    self.dlg.show()\n    # clear the combo box to list only current layers\n  \
  \  self.dlg.layerCombo.clear()\n    # get the layers and add them to the combo box\n\
  \    layers = QgsMapLayerRegistry.instance().mapLayers().values()\n    for layer\
  \ in layers:\n        if layer.type() == QgsMapLayer.VectorLayer:\n            self.dlg.layerCombo.addItem(\
  \ layer.name(), layer )\n    # Run the dialog event loop\n    result = self.dlg.exec_()\n\
  ```\n\n\n\n\n\n```python\n# See if OK was pressed\nif result:\n    # Check which\
  \ layer was selected\n    index = self.dlg.layerCombo.currentIndex()\n    layer\
  \ = self.dlg.layerCombo.itemData(index)\n    # Display information about the layer\n\
  \    QMessageBox.information(self.iface.mainWindow(), \"Learning QGIS\", \"%s has\
  \ %d features.\" % (layer.name(), layer.featureCount()))\n```\n```\n\n你还需要在脚本顶部添加以下导入行，以避免关于\
  \ QgsMapLayerRegistry 和 QMessageBox 的 NameError：\n\n```python\nfrom qgis.core import\
  \ *\nfrom PyQt4.QtGui import QMessageBox\n```\n```\n\n完成对 my_first_plugin.py 的修改后，你可以保存文件并在\
  \ QGIS 中使用 **Reload Plugin** 按钮重新加载插件。现在启动插件时，组合框将被填充为当前 QGIS 项目中的所有图层列表，并且当你点击确定时，将显示一个消息框，显示所选图层中的要素数量。\n\
  \n## 创建自定义地图工具\n\n之前的练习展示了如何创建自定义 GUI 以使用户能够与 QGIS 交互，在本练习中，我们将更进一步，实现我们自己的自定义 **地图工具**，类似于默认的\
  \ **识别工具**。这意味着用户可以点击地图，工具会报告地图上被点击的要素。\n\n为此，我们创建另一个名为 MyFirstMapTool 的 **带对话框的工具按钮**\
  \ 插件模板。对于此工具，我们不需要创建对话框。相反，我们需要编写比前一个示例更多的代码。首先，我们创建自定义地图工具类，我们称之为 IdentifyFeatureTool。除了\
  \ __init__() 构造函数之外，此工具还有一个名为 canvasReleaseEvent() 的函数，该函数定义了在释放鼠标按钮时（即在按下鼠标按钮后松开时）工具的动作：\n\
  \n```python\nclass IdentifyFeatureTool(QgsMapToolIdentify):\n    def __init__(self,\
  \ canvas):\n        QgsMapToolIdentify.__init__(self, canvas)\n    def canvasReleaseEvent(self,\
  \ mouseEvent):\n        print \"canvasReleaseEvent\"\n        # get features at\
  \ the current mouse position\n        results = self.identify(mouseEvent.x(), mouseEvent.y(),\n\
  \                                self.TopDownStopAtFirst, self.VectorLayer)\n```\n\
  ```\n\n```python\nif len(results) > 0:\n    # signal that a feature was identified\n\
  \    self.emit( SIGNAL(\"geomIdentified\"),\n               results[0].mLayer, results[0].mFeature)\n\
  ```\n```\n\n你可以将上述代码粘贴到 my_first_map_tool.py 代码的末尾。当然，我们现在必须让我们的新地图工具发挥作用。在 initGui()\
  \ 函数中，我们用新的 map_tool_init() 函数替换 run() 方法。此外，我们定义我们的地图工具是可检查的；这意味着用户可以点击工具图标来激活它，再次点击即可停用它：\n\
  \n```python\ndef initGui(self):\n    # create the toolbar icon and menu entry\n\
  \    icon_path = ': /plugins/MyFirstMapTool/icon.png'\n    self.map_tool_action=self.add_action(\n\
  \        icon_path,\n        text=self.tr(u'My 1st Map Tool'),\n        callback=self.map_tool_init,\n\
  \        parent=self.iface.mainWindow())\n    self.map_tool_action.setCheckable(True)\n\
  ```\n```\n\n新的 map_tool_init() 函数负责在点击按钮时激活或停用我们的地图工具。在激活期间，它会创建我们自定义 IdentifyFeatureTool\
  \ 的实例，并且以下行将地图工具的 geomIdentified 信号连接到我们稍后将讨论的 do_something() 函数。同样，当地图工具被停用时，我们断开信号连接并恢复之前的地图工具：\n\
  \n```python\ndef map_tool_init(self):\n    # this function is called when the map\
  \ tool icon is clicked\n    print \"maptoolinit\"\n    canvas = self.iface.mapCanvas()\n\
  \    if self.map_tool_action.isChecked():\n        # when the user activates the\
  \ tool\n        self.prev_tool = canvas.mapTool()\n        self.map_tool_action.setChecked(\
  \ True )\n        self.map_tool = IdentifyFeatureTool(canvas)\n        QObject.connect(self.map_tool,SIGNAL(\"\
  geomIdentified\"),\n                        self.do_something)\n        canvas.setMapTool(self.map_tool)\n\
  \        QObject.connect(canvas,SIGNAL(\"mapToolSet (QgsMapTool *)\"),\n       \
  \                 self.map_tool_changed)\n    else:\n        # when the user deactivates\
  \ the tool\n```\n```\n\n```python\nQObject.disconnect(canvas,SIGNAL(\"mapToolSet\
  \ (QgsMapTool *)\")\n    ),self.map_tool_changed)\ncanvas.unsetMapTool(self.map_tool)\n\
  print \"restore prev tool %s\" %(self.prev_tool)\ncanvas.setMapTool(self.prev_tool)\n\
  ```\n\n我们的新自定义 do_something() 函数在我们的地图工具成功识别要素时被调用。对于此示例，我们只是在 Python 控制台上打印要素的属性。当然，你可以在这里发挥创意并添加你想要的自定义功能：\n\
  \n```\ndef do_something(self, layer, feature):\n    print feature.attributes()\n\
  ```\n\n最后，我们还必须处理用户切换到不同地图工具的情况。这与用户在 map_tool_init() 函数中停用我们的工具的情况类似：\n\n```\n\
  def map_tool_changed(self):\n    print \"maptoolchanged\"\n    canvas = self.iface.mapCanvas()\n\
  \    QObject.disconnect(canvas,SIGNAL(\"mapToolSet (QgsMapTool *)\"),\n        self.map_tool_changed)\n\
  \    canvas.unsetMapTool(self.map_tool)\n    self.map_tool_action.setChecked(False)\n\
  ```\n\n你还需要在脚本顶部添加以下导入行，以避免关于 QObject、QgsMapTool 等的错误：\n\n```python\nfrom qgis.core\
  \ import *\nfrom qgis.gui import *\nfrom PyQt4.QtCore import *\n```\n\n准备就绪后，你可以重新加载插件并尝试使用。你应该打开\
  \ Python 控制台以便能够跟随插件的输出。当你在工具栏中激活插件时，你会看到它在控制台上打印 maptoolinit。然后，如果你点击地图，它将打印 canvasReleaseEvent，如果你点击要素，它还将显示要素的属性。最后，如果你更改为另一个地图工具（例如平移地图工具），它将在控制台上打印\
  \ maptoolchanged，并且插件工具栏中的图标将被取消选中。\n\n## 总结\n\n在本章中，我们介绍了使用操作和 Python 脚本扩展 QGIS\
  \ 的不同方法。我们从不同类型的操作开始，然后继续到 **Python Console**，它提供了一种直接、交互式的方式与 QGIS Python API 交互。我们还使用了\
  \ **Python Console** 面板的一部分编辑器，它为包含循环甚至多个类和函数定义的较长脚本提供了一种更好的工作方式。接下来，我们将 PyQGIS\
  \ 的知识应用于为 **Processing Toolbox** 开发自定义工具。这些工具受益于 Processing 的自动 GUI 生成功能，并且可以在 **Graphical\
  \ modeler** 中用于创建地理处理模型。最后但同样重要的是，我们基于 **Plugin Builder** 模板开发了一个基本插件。\n\n有了这些背景知识，你现在可以开始自己的\
  \ PyQGIS 实验。有多个网络和印刷资源可供你了解更多关于 QGIS Python 脚本的知识。有关更新的 QGIS API 文档，请查看 http://qgis.org/api/。如果你对更多\
  \ PyQGIS 配方感兴趣，请查看 *PyQGIS Developer Cookbook* at http://docs.qgis.org/testing/en/docs/pyqgis_developer_cookbook\
  \ 以及 *Packt Publishing* 出版的 QGIS 编程书籍，以及 Gary Sherman 的书籍 *The PyQGIS Programmer's\
  \ Guide, Locate Press.*\n"
- "## Module 2\n\n## QGIS Blueprints\n\n使用 QGIS 开发基于位置的分析型 Web 应用\n\n## 1\n探索地点 —\
  \ 从概念到界面\n\n我们如何将我们的想法转变为基于位置的 Web 应用？如果你以前听过这个问题或自己问过这个问题，你就会知道这个看似简单的问题可以有无数种答案。在本书中，我们将通过为其通用适用性而选定的具体用例来考虑\
  \ QGIS 的应用。这里提供的蓝图很可能会为你的应用的这个问题及其解决方案带来启发。\n\n在本書中，你将学习如何利用这一生态系统，让现有软件承担繁重的工作，并构建满足你需求的\
  \ Web 地图应用。当集成软件在 QGIS 中无缝可用时，太棒了！当它不可用时，我们将看看如何将其引入。\n\n在本章中，我们将查看数据如何从各种来源和格式获取并通过\
  \ QGIS 可视化。我们将重点关注我们应用的相对静态的部分：底图。我们将使用以美国城市特拉华州纽瓦克为重点的数据。例如，历史温度按区域、按地址的点数据和历史地图图像等数据集合可用于数字人文项目，如果有人想查看城市某部分观察到的较低温度的历史证据。\n\
  \n在本章中，我们将涵盖以下主题：\n\n- 软件\n- 提取、传输和加载\n- 地理配准\n\n\n\n\n\n- 表连接\n- 地理编码\n- 正射校正\n\
  - 空间参考操作\n- 空间参考分配\n- 投影\n- 转换\n- 基底地图的创建与配置\n- 图层比例依赖\n- 标签\n- 瓦片创建\n\n## 开发社区与依赖\n\
  \n由于 QGIS 是开源的，没有任何单一实体拥有该项目；它由一个成熟的社区支持。该项目由 QGIS 项目指导委员会（PSC）指导，委员会选出经理来监督开发、测试、打包以及其他基础设施等各个领域，以保持项目的运行。开源地理空间基金会（OSGeo）是软件开发的主要贡献者之一，QGIS\
  \ 被视为 OSGeo 的官方项目。QGIS 的许多依赖项和互补软件也是 OSGeo 项目，这种集体地位使得可以将其视为一个平台而实现一定程度的集成。开放地理信息系统联盟（OGC）负责审议并制定数据和元数据格式的标准。QGIS\
  \ 支持一系列 OGC 标准——从网络服务到数据格式。\n\n当 QGIS 处于最佳状态时，这一丰富的平台提供了无缝的功能，其生态系统中的开源或可直接获取的软件随时可供使用。在其他时候，底层依赖项和生态系统软件需要更多关注。由于它是开源软件，贡献始终在进行中，你也可以选择对代码进行自定义甚至贡献！\n\
  \n## 数据格式读写\n\nOSGeo 生态系统通过 **OGR 简单要素库**（OGR，最初用于 OpenGIS 简单要素参考实现）和 **地理空间数据抽象库（GDAL）**\
  \ 库提供数据格式读写能力，支持约 220 种格式。\n\n## 地理空间坐标转换\n\n坐标所指的地球模型统称为 **坐标参考系统（CRSs）**。系统之间的空间参考转换以及投影——从线性坐标系统到角度坐标系统——由\
  \ PROJ.4 库支持，约有 2,700 个系统。这些系统以 PROJ.4 定义的纯文本格式表达，即 **众所周知文本（WKT）**。PROJ.4 WKT 实际上非常易读，包含制图投影学生所熟悉的信息，如子午线、椭球体等。\n\
  \n## 分析\n\n分析，或将算法函数应用于数据，很少能由 QGIS 无缝处理。更常见的是，它是之前列出的依赖项之一的扩展，或由 **系统化地球科学分析系统（SAGA）**\
  \ 提供。许多其他分析操作由众多 QGIS Python 插件提供。\n\n总体而言，这些库可以无缝地在我们需要的格式之间转换。然而，在某些情况下，需要获取额外的依赖项，并自行构建和配置，或在它们周围构建代码。\n\
  \n## Web 发布\n\nQGIS 能够通过集成和不太直接的方式发布到 Web 主机。\n\n## 安装\n\nOSGeo 项目二进制文件有时会被打包以简化安装过程，鉴于项目之间存在大量相互依赖。本书中的教程基于使用\
  \ Windows 的 QGIS 独立安装程序进行安装。\n\n## Linux\n\nQGIS 为 Debian/Ubuntu 主持了最新版本的仓库，并为其他主要\
  \ Linux 发行版提供捆绑包；然而，这些仓库通常落后很多版本。你会发现即使使用发行版的额外仓库（例如 RHEL 系列的 EPEL）也是如此。寻找其他仓库是值得的。当然，另一个选择是尝试从头构建；但这可能非常困难。\n\
  \n## Mac\n\nMac OS 没有捆绑的包安装程序，不过你应该能够仅通过网络上 readily 可用的二进制文件进行一到两次额外安装来安装 QGIS——KyngChaos\
  \ Wiki 长期以来一直是此方面的首选来源。\n\n## Windows\n\n目前在 Windows 上安装比其他平台更简单。最新版本的 QGIS，连同 GDAL\
  \ 等基本依赖项，可通过典型的可执行安装程序安装：即“独立”安装程序。此外，OSGeo4W（OSGeo for Windows）包安装程序对于扩展依赖项非常有用。你可能会发现，除了简单安装\
  \ QGIS 之外，你会返回此安装程序以添加更多软件，将 QGIS 扩展到其生态系统中。你可以从 Windows 开始菜单中 QGIS 子菜单下的 Setup\
  \ 快捷方式启动安装程序。\n\n## OSGeo-Live\n\nOSGeo 软件最全面的体现是 OSGeo-Live，即一个预装了所有 OSGeo 软件的\
  \ Lubuntu 虚拟机（VM）。它在此单独列出，因为它会启动到自己的操作系统，与主机平台无关。\n\nOSGeo Live 的更新通常与 FOSS4G 同步发布，FOSS4G\
  \ 是 OSGeo 自 2006 年以来主办的年度全球活动。鉴于这些活动举办不那么规律且与 OSGeo 软件开发不同步，打包版本通常落后几个版本。尽管如此，OSGeo-Live\
  \ 仍是快速入门的好方法。\n\n现在你已经准备好了本地机器，让我们回到本书将重点关注的通用化 Web 应用的想法。我们可以在开发 Web 制图应用的过程中识别出几个要素。\n\
  \n## 获取地理空间应用的数据\n\n在任何初步规划之后——该步骤应至少仔细考虑我们应用的使用案例——我们必须获取数据。获取不仅涉及数据的物理传输，还包括将数据处理为特定格式并导入我们开发的数据存储方案中。这通常称为提取、转换和加载（ETL）。\n\
  \n尽管 ETL 是开发 Web 应用的第一步，但不应掉以轻心。如同任何基于信息项目一样，数据往往以不可立即使用形式提供给我们——无论是因为格式不统一、元数据不确定，还是字段映射未知。虽然这些都可能影响\
  \ GIS 项目，但由于 GIS 围绕制图坐标系统组织，主要关注点通常是数据必须以统一的方式进行空间描述，即由单一 CRS，如前所述。为此，数据通常需要地理配准和空间参考操作。\n\
  \n对于某些数据集，ETL 工作流是不必要的，因为数据已通过 Web 服务提供。使用存储在远程服务器上的托管数据并由你的应用直接从 Web 读取，这纯粹从开发便利性角度看是一个非常有吸引力的选择。然而，你可能需要更改本地数据的\
  \ CRS，以及可能的其他格式，以匹配托管数据，因为托管服务很少提供多种 CRS。你还必须考虑托管数据是否提供支持你的应用界面的功能。你可以在本章的操作层部分找到有关此主题的更多信息。\n\
  \n## 通过地理配准生成地理空间数据\n\n通过地理配准，或将我们的数据附加到坐标，我们断言数据中每个对象的地理位置。一旦数据被地理配准，我们就可以称其为地理空间。地理配准是根据数据中的字段和某些地理空间参考源中可用的字段进行的。\n\
  \n最简单的例子是当数据字段实际上与某些现有地理空间数据中的字段匹配时。该数据字段通常是 ID 号或名称。这种地理配准称为表连接。\n\n\n\n\n\n##\
  \ 表连接\n\n在本示例中，我们将通过一个表连接来查看一些来自未知来源的温度数据与美国人口普查的人口普查区边界。人口普查的 TIGER/Line 文件通常是查找各种美国全国边界文件（不仅仅是人口普查汇总区）的首选位置。\n\
  \n将通过表连接进行地理参照的温度数据如下所示：\n\n```\ntract,date,mean_temp\n014501,2010-06-01,73\n014402,2010-06-01,75\n\
  014703,2010-06-01,75\n014100,2010-06-01,76\n014502,2010-06-01,75\n014403,2010-06-01,75\n\
  014300,2010-06-01,71\n014200,2010-06-01,72\n013610,2010-06-01,68\n```\n\n温度数据元数据如下所示：\n\
  \n```\n\"String\",\"Date\",\"Integer\"\n```\n\n## 下载示例代码\n\n您可以从 http://www.packtpub.com\
  \ 在您的账户中下载您购买的所有 Packt 书籍的示例代码文件。如果您在其他地方购买了本书，您可以访问 http://www.packtpub.com/support\
  \ 并注册以便将文件直接发送到您的电子邮件。\n\n要执行表连接，请执行以下步骤：\n\n- 1. 复制第一个信息框中的代码到一个文本文件并保存为 temperature.csv。\n\
  \nCSVT 格式是与同名 CSV 文件一起提供的元数据文件。它定义了列数据类型。\n\n- 2. 复制第二个信息框中的代码到一个文本文件并保存为 `temperature.csvt`。否则，QGIS\
  \ 将不知道每列包含什么类型的数据。\n\n> 所有章节的数据都可以在每个章节的数据目录下找到。您可以使用 `c1/data/original` 下包含的数据以及前面给出的文件名。除了选择浏览菜单，您还可以直接将文件从打开的操作系统窗口拖入\
  \ **图层** 面板。您可以在每个章节数据目录的输出目录下找到练习期间的数据输出示例。这也是说明中作为输出目录给出的目录。您可能希望为输出创建一个新目录并将数据保存在那里，以避免覆盖包含的参考数据。\n\
  \n- 3. 导航到 **图层 | 添加图层 | 添加矢量图层 | 浏览到**，并选择 `temperature.csv`。\n\n> CSV 数据也可以通过\
  \ **图层 | 添加图层 | 添加分隔文本** 添加。这对于在 CSV 中绘制坐标特别有用，如您稍后会看到。\n\n- 4. 下载 **Tract** 边界数据：\n\
  \  - 1. 访问 http://www.census.gov/geo/maps-data/data/tiger-line.html。\n  - 2. 点击您想要查找的年份的选项卡。\n\
  \  - 3. 下载网络界面。\n  - 4. 这将带我们到 http://www.census.gov/cgi-bin/geo/shapefiles2014/main。\n\
  \  - 5. 导航到 **图层类型 | 人口普查区** 并点击 **提交** 按钮。现在，从 **人口普查区（2010）** 下拉菜单中选择 **特拉华州**。再次点击\
  \ **提交**。现在从此页面显示的下拉菜单中选择 **所有县在一个基于州的文件中**，最后点击 **下载**。\n  - 6. 解压下载的文件夹。\n\n-\
  \ 5. 导航到 **图层 | 添加图层 | 添加矢量图层 | 浏览到**，并选择解压目录中的 `t1_2010_10_tract10.shp` 文件。\n\n\
  - 6. 在 **图层** 面板中右键点击 `t1_2010_10_tract10`，然后导航到 **属性 | 连接**。点击带有绿色加号 (+) 的按钮以添加连接。\n\
  \n7. 选择 **temperature** 作为 **连接图层** 选项，**tract** 作为 **连接字段** 选项，**TRACTCE10** 作为\
  \ **目标字段** 选项，并点击此处的 **确定** 以及属性对话框中的 **确定**：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_214_0.png)\n\
  \n要验证连接是否完成，请打开目标图层的属性表（例如在此案例中的地理空间参考，`tl_2010_10`）并按新的 `temperature_mean_temp`\
  \ 字段排序。注意连接图层的字段和值现在已包含在目标图层中。\n\n- 1. 从 **图层** 面板中选择目标图层 `tl_2010_10_tract10`。\n\
  - 2. 导航到 **图层 | 打开属性表**。\n- 3. 点击 `temperature_mean_temp` 列标题按此列对普查区进行排序。您可能需要点击两次以将排序顺序从升序切换到降序。\n\
  \n![](img/2e88bf5938bf48a409c0a534a8775b21_215_0.png)\n\n## 地理编码\n\n如果我们的数据以地址、交叉路口或其他众所周知的地点表示，我们可以对其进行地理编码（即与坐标匹配），方法是使用为我们特定字段集配置的本地或远程地理编码器，例如地址中的标准字段。\n\
  \n在本示例中，我们将使用 Google 提供的远程地理编码器进行地理编码。请执行以下步骤：\n\n- 1. 安装 MMQGIS 插件。\n- 2. 如果您还没有可用的地址数据，您可以制作一个包含一些标准地址字段的分隔文件，例如街道、城市、州和县（此插件不使用邮政编码）。我使用的数据来自特拉华州纽卡斯尔县的\
  \ GIS 网站（http://gis.nccde.org/gis_viewer/）。\n\n- 3. 无论您是下载了地址数据还是自行制作，都请确保创建标题行。否则，MMQGIS\
  \ 无法进行地理编码。\n\n以下是 MMQGIS 友好的地址数据的示例：\n\n```\nid,address,city,state,zip,country\n\
  1801300170,44 W CLEVELAND AV,NEWARK,DE,19711,USA\n1801400045,85 N COLLEGE AV,NEWARK,DE,19711,USA\n\
  1802600068,501 ACADEMY ST,NEWARK,DE,19716,USA\n```\n\n- 4. 通过导航到 **MMQGIS | 地理编码\
  \ | 使用 Google/OpenStreetMap 地理编码 CSV** 打开 MMQGIS 地理编码对话框。\n\n- 5. 在将您的字段与可用的地址输入字段匹配后，您可以选择\
  \ Google Maps 或 OpenStreetMap。Google Maps 通常具有更高的成功率，而 OpenStreetMap 的价值在于没有每天可地理编码地址数量的限制。此时，OSM\
  \ 地理编码器产生的结果很差，几乎没有用处。\n\n- 6. 您希望手动选择或输入 `notfound.csv` 文件的最终文件系统路径。默认文件位置可能有问题。\n\
  \n- 7. 地理编码完成后，您会看到地理编码地址文本与我们的地理编码参考匹配的程度。您可能希望更改 `notfound.csv` 文件中的地址并再次尝试地理编码这些地址。\n\
  \n![](img/2e88bf5938bf48a409c0a534a8775b21_216_0.png)\n\n## 正射校正\n\n最后，如果我们的数据是图像或栅格，我们可以将图像中的位置与参考地图中的已知位置匹配。这些配对的配准和随后的栅格变换称为正射校正，有时也称为更通用的术语地理配准（尽管该术语适用于更广泛的操作范围）。\n\
  \n- 1. 添加用作参考的基础地图：\n  - 1. 添加 OpenLayers 插件。导航到 **插件 | 管理 | 安装插件**；选择 **OpenLayers\
  \ 插件** 并点击 **安装**。\n  - 2. 导航到 **网络 | OpenLayers 插件**，并选择您选择的基础地图。MapQuest-OSM 是一个不错的选择。\n\
  \n- 2. 获取地图图像：\n  - 1. 我已从 David Rumsey 地图收藏、MapRank 搜索（http://rumsey.mapranksearch.com/）下载了一张高分辨率图像（c1/data/original/4622009.jpg），该网站是美国历史地图图像的优秀来源。\n\
  \  - 2. 按位置搜索，按时间、比例和其他属性进行筛选。您可以通过搜索特拉华州纽瓦克找到我们使用的图像。\n  - 3. 找到地图后，导航到它。然后在右上角找到\
  \ **导出**，并导出超高分辨率图像。\n  - 4. 解压下载的文件夹。\n\n- 3. 使用以下步骤对图像进行正射校正/地理配准：\n  - 1. 安装并启用\
  \ Georeferencer GDAL 插件。\n  - 2. 导航到 **栅格 | 地理配准器 | 地理配准**。\n  - 3. 在画布上平移和缩放参考基础地图到您在地图图像中识别的位置。\n\
  \  - 4. 平移和缩放地图图像。\n  - 5. 如果尚未选择，请选择 **添加控制点**。\n  - 6. 点击您在第三步中在地图图像中识别的位置。\n\
  \  - 7. 点击 **铅笔** 图标以从地图画布中选择控制点。\n  - 8. 点击参考基础地图中的位置。\n  - 9. 点击 **确定**。\n\n\n\
  \n\n## 探索地点——从概念到界面\n\n- 10. 添加这三个控制点，如下图所示：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_218_0.png)\n\
  \n- 11. 点击播放按钮开始地理配准。\n\n- 12. 输入变换设置信息，如下图所示：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_219_0.png)\n\
  \n- 13. 现在，再次点击播放按钮开始地理配准。\n\n图像完成地理配准后，您应该会看到它与地图上的其他数据对齐。您可以在 **图层属性** | **透明度**\
  \ 下调整图层的透明度：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_220_0.png)\n\n## 空间参考处理——使坐标对齐\n\
  \nQGIS 有时会对添加到画布上的所有数据以项目 CRS（在 **项目 | 项目属性 | CRS** 下定义）进行 **动态 (OTF)** 投影。对于要用于\
  \ Web 应用程序的项目，您可能需要禁用 OTF 投影，因为所有图层都应具有独立定义的空间参考，并在需要时转换或投影到相同的 CRS。\n\n### 设置 CRS\n\
  \n当收到的地理空间数据没有描述其坐标的空间参考系统的元数据时，有必要指定一个系统。可以通过右键单击“图层面板”中的图层，选择“另存为”，然后选择新的 CRS\
  \ 来完成。\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_221_0.png)\n\n### 变换与投影\n\n在其他情况下，收到的数据可能使用与项目中其他数据不同的\
  \ CRS。当 CRS 不同时，应小心考虑是更改新的不符合数据的 CRS，还是更改现有数据的 CRS。当然，我们希望选择一个支持我们精度或范围需求的系统；在其他情况下，当我们已经有合适的底图时，我们会希望操作图层符合底图的系统。当已有合适的底图可供我们的\
  \ Web 应用程序使用时，我们通常可以在项目中采用底图的系统。所有主要的第三方底图提供商都使用 Web 墨卡托投影，现在称为 EPSG:3857。\n\n##\
  \ 探索地点——从概念到界面\n\n您可以将数据从地理坐标投影到投影坐标，或者从一种投影转换到另一种投影。这可以通过与定义投影相同的方式完成：右键单击“图层面板”中的图层，选择“另存为”，然后选择新的\
  \ CRS。默认情况下通常会应用适当的变换。\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_222_0.png)\n\n\
  CRS 选择器中有些功能您应该注意。通过从“最近使用的坐标系”中选择，您通常可以轻松地将新 CRS 与工作区中已有的 CRS 匹配。您还可以通过在“过滤器”输入框中输入内容来搜索可用系统。您会在对话框底部看到所选\
  \ CRS 的 PROJ.4 WKT 表示。\n\n## 可视化 GIS 数据\n\n虽然数据已通过 ETL 流程添加到 GIS 中，但如果不添加一些可视化增强功能，其价值有限。\n\
  \n### 图层样式\n\n图层样式通过“图层属性”对话框中的“样式”选项卡配置。“单一符号”样式是默认样式类型，它仅使用相同的基本符号显示所有地理图层对象。这种设置除了对象明显的空间特征外，不提供对象之间的任何视觉差异。“分类”和“渐变”样式类型可根据您选择的属性表字段提供不同的样式。“渐变”适用于定量数据，在将颜色和符号大小映射到数值标度方面特别强大。所有这些均通过“图层属性”|“样式”选项卡完成。\n\
  \n要为数据配置简单的渐变图层样式，请执行以下步骤：\n\n- 1. 在“图层属性”|“样式”选项卡下，选择“渐变”作为样式类型。\n- 2. 在“列”中选择定量字段（例如\
  \ temperature_mean_temp）。\n- 3. 点击“分类”将数据分组为指定数量的类别（默认情况下为 5 个），并选择分类模式（默认情况下为“等间距”）：\n\
  \n![](img/2e88bf5938bf48a409c0a534a8775b21_223_0.png)\n\n- 4. 现在，点击“应用”。\n\n如果您对已连接的区块/温度图层应用上述步骤，您将看到类似于下图的内容：\n\
  \n![](img/2e88bf5938bf48a409c0a534a8775b21_224_0.png)\n\n- 5. 如果您想同时查看其他图层，可以在此处添加一些图层透明度。如果该图层要包含在底图中，这将非常合适。\n\
  \n> 您可以使用“图层属性”|“样式”选项卡底部的“样式”菜单来保存和加载图层样式。例如，如果您希望将相同的样式应用于不同的图层，这很有用。\n\n- 6.\
  \ 现在，点击“确定”。\n\n您现在将看到以下输出：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_225_0.png)\n\
  \n也许城市北部较低的温度与城市其他部分的历史发展有关。\n\n## 标签\n\n标签可以在不需要弹出窗口或图例的情况下在地图中提供重要信息。由于标签由软件自动放置（它们在空间中不具有实际物理位置），因此会遇到特定的放置问题。此外，标签文本过多的地图很快就会变得混乱。有时，可以通过集成的\
  \ QGIS 操作轻松地将标签渲染到切片中；其他时候，这需要外部渲染引擎或地图服务器。这些问题将在本章后面讨论。\n\n要为示例中的地址点添加标签，请转到该图层的“图层属性”|“标签”选项卡。执行以下步骤：\n\
  \n- 1. 在“用于标注此图层的字段”中选择 address。请注意，此选择旁边的复选框将被切换。所有其他标签样式选项将保持不变，如下图所示：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_226_0.png)\n\
  \n- 2. 打开“缓冲”子选项卡，并切换“绘制文本缓冲”：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_227_0.png)\n\
  \n- 3. 点击“确定”后，您将看到类似以下截图的内容：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_227_1.png)\n\
  \n## 底图\n\n在 Web 地图应用程序中，底图的含义有时不同于打印地图中的底图。底图是地图可视化中不变的、通常缓存的图层，往往出现在支持交互的图层后面。在我们的示例中，底图可以是经过地理配准的历史图像，单独使用或与其他图层一起使用。\n\
  \n如果适合您的项目，您应考虑使用公共底图服务。您可以使用 QGIS 中的 OpenLayers 插件浏览其中一些选项。\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_228_0.png)\n\
  \n如果满足以下条件，请使用底图服务：\n\n- 地理要素为操作图层提供足够的上下文\n- 范围适合您的地图界面\n- 比例级别适合您的地图界面，尤其是最小和最大比例\n\
  - 底图标签和符号不遮挡操作图层\n- 地图服务提供与预期用途一致的使用条款\n- 您不需要在断开互联网时也能查看底图\n\n如果我们的底图不能像示例中那样通过\
  \ Web 服务获得，我们就必须将注意力转向其生产。重要的是考虑什么是底图，以及它与操作图层有何不同。\n\n底图中包含的地理参考要素根据地图的预期用途和受众进行选择。通常，这包括某些边界、道路、地形、水系等。\n\
  \n![](img/2e88bf5938bf48a409c0a534a8775b21_228_1.png)\n\n除了这些参考要素之外，如果您不需要以下功能，可将地理对象类别包含在底图中：\n\
  \n- 定期更新几何数据\n- 提供样式更改功能\n- 允许类别对象的可见性独立于其他数据而变化\n- 将类别中的对象暴露给界面控件\n\n假设我们将使用某种缓存机制来存储和提供底图，那么我们将通过在底图中尽可能多地包含对象来优化性能。\n\
  \n\n\n## 使用OpenStreetMap作为底图数据\n\n获取底图数据并非一项简单的任务。如果通过Web服务可以获得合适的地图服务，则会大大简化这一任务。否则，您必须从本地系统获取支持数据，并将其渲染为合适的制图格式。\n\
  \n创建底图并使其保持更新所面临的一个挑战是与不同数据提供商的交互。对于不同类别的地理对象，不同的组织往往被认为是首选提供商。由于不同组织的参与，必然会产生不同的数据格式约定。\n\
  \n**OpenStreetMap (OSM)** 是一个用于地理参考数据的开放数据存储库，既提供地图服务，也提供数据。除了OSM自身的地图服务外，该数据存储库还是许多提供免费底图服务的其他项目的来源。\n\
  \nOpenStreetMap 使用比大多数数据提供商更抽象、更具可扩展性的模式。OSM 数据包含一些系统字段，例如 `osm_id`、`user_id`、`osm_version`\
  \ 和 `way`。`osm_id` 字段对于每个地理对象都是唯一的，`user_id` 对于最后修改该对象的用户是唯一的，`osm_version` 对于该对象的版本是唯一的，而\
  \ `way` 是对象的几何形状。\n\n通过允许在之前提到的系统字段之外添加理论上无限数量的键值对，OSM 数据模式可以潜在地容纳任何类型的数据，同时保持合理有序。键是数据编辑者添加到他们上传到存储库的数据中的内容。成熟的键在\
  \ OSM 网站上有文档记录，并且与社区制作的渲染样式兼容。如果社区制作的样式不包含您需要或您创建的键，您可以简单地将它添加到自己的渲染样式中。在导入阶段，列不会使本地数据库不堪重负。只有本地配置文件中添加的键才会被添加到数据库模式中并进行填充。\n\
  \n使用 OSM 数据制作高质量地图是一个持续的挑战。CloudMade 以基于云的 OSM 数据渲染编辑器为基础开展业务，尽管该编辑器功能有限，但也能提供地图服务。实际上，CloudMade\
  \ 是 OSM 数据云服务的优秀来源，并且提供了许多视觉上吸引人的样式。由海德堡大学一个研究小组制作的 OpenMapSurfer 展示了使用 OSM 数据进行高质量制图的一些最佳实践，包括复杂的标注放置、对象级比例依赖、精心选择的颜色，以及带阴影的地形起伏和等深线。\n\
  \n要在本地获取 OpenStreetMap 数据以生成您自己的底图，请执行以下步骤：\n\n1. 如果尚未安装 OpenLayers 和 OSMDownloader\
  \ QGIS 插件，请先安装它们。\n2. 创建一个新的 SpatiaLite 数据库。\n3. 打开 OSM：\n   1. 导航到 Web | OpenLayers\
  \ | OpenStreetMap | OpenStreetMap。\n4. 浏览您感兴趣的区域。\n5. 下载您感兴趣的区域：\n   1. 导航到 Vector\
  \ | OpenStreetMap | Download Data：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_230_0.png)\n\
  \n6. 将下载的 XML 数据导入拓扑 SQLite 数据库。该数据库不包含 SpatiaLite 地理对象，而是以表中对象之间的拓扑关系来表达。拓扑关系将在*第4章“找到最佳路线”*和*第5章“展示变化”*中更深入地探讨。\n\
  \   1. 导航到 **Vector | OpenStreetMap | Import Topology from XML**。\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_231_0.png)\n\
  \n7. 通过以下步骤将拓扑转换为 SpatiaLite 空间表：\n   1. 导航到 **Vector | OpenStreetMap | Export Topology\
  \ to SpatiaLite**。\n   2. 选择要导出的点、折线或多边形。\n   3. 然后，选择您可能希望用于样式设置目的的字段。您可以通过单击 **Load\
  \ from DB** 来填充可能字段的列表。\n   4. 您可以重复此步骤以导出其他几何类型，如以下屏幕截图所示：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_232_0.png)\n\
  \n8. 现在，您可以按照自己的喜好为此设置样式，并将其导出为瓦片底图。然后，您可以将其保存为 Mapnik 或 SLD 样式，以便在外部瓦片缓存软件中进行渲染。\n\
  \n以下是一个 OSM 数据以基本的单一符号样式叠加到其他图层上的示例：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_233_0.png)\n\
  \n## 避免模糊与混乱\n\n当然，在底图中堆积数据并非没有缺点。除了因设计而造成的功能相对损失外，底图可能很快变得杂乱无章且不清晰。图层和标注的比例依赖关系会动态改变信息的显示，以避免底图地理类别的混淆。\n\
  \n### 图层比例依赖\n\n当某些地理对象类别在特定比例下不需要可视化时，可以使用整个图层比例依赖来隐藏该图层。例如，在上图中，我们可以在较小的比例下看到所有图层，包括地理编码地址，即使它们可能不清晰可见。为了简化信息，我们可以应用图层比例依赖，使该图层不显示这些小比例。\n\
  \n![](img/2e88bf5938bf48a409c0a534a8775b21_234_0.png)\n\n在此比例下，某些对象并不清晰可见。使用图层比例依赖，我们可以让这些对象在此比例下不可见。\n\
  \n还可以在图层内的地理对象级别上通过比例来改变可见性。例如，您可能希望在较小的比例下仅显示主要道路。然而，这通常需要更多的努力来制作。对象级可见性可以由已经存在的属性或专门为比例依赖而创建的属性来驱动。它也可以根据对象的几何特征（例如其面积）来定义。一般来说，较小的要素在较低比例下不应可见。\n\
  \n使用整个图层依赖来实现对象级图层依赖的一种常见方法是选择符合给定条件的对象，并从中创建新图层。比例依赖可以应用于现在包含在此单独图层中的对象类别子集。\n\n\
  您需要按照与常用比例一致的比例比来设置图层比例依赖。这些比例基于一些假设，包括关于瓦片图像分辨率（96 dpi）和瓦片尺寸（256px x 256px）的假设。\n\
  \n| 缩放级别 | 对象范围 | 96 dpi 下的比例尺 |\n|------|---------------|-----------------|\n|\
  \ 0 | 整个星球 | 1 : 59165752759.16 |\n| 1 |  | 1 : 295,829,355.45 |\n| 2 |  | 1 : 147,914,677.73\
  \ |\n| 3 |  | 1 : 73,957,338.86 |\n| 4 |  | 1 : 36,978,669.43 |\n| 5 | 国家 | 1 :\
  \ 18,489,334.72 |\n| 6 |  | 1 : 9,244,667.36 |\n| 7 |  | 1 : 4,622,333.68 |\n| 8\
  \ | 州 | 1 : 2,311,166.84 |\n| 9 |  | 1 : 1,155,583.42 |\n| 10 | 大都市 | 1 : 577,791.71\
  \ |\n| 11 |  | 1 : 288,895.85 |\n| 12 | 城市 | 1 : 144,447.93 |\n| 13 |  | 1 : 72,223.96\
  \ |\n| 14 | 城镇 | 1 : 36,111.98 |\n| 15 |  | 1 : 18,055.99 |\n| 16 | 次要道路 | 1 : 9,028.00\
  \ |\n| 17 |  | 1 : 4,514.00 |\n| 18 | 人行道 | 1 : 2,257.00 |\n\n### 标注冲突\n\n标注通常与底图图层本身分离。原因之一是，如果标注包含在底图图层中，它们会被显示在其上方的操作图层遮挡。另一个原因是，瓦片缓存有时不能妥善处理标注，导致标注碎片缺失。标注还应该按照其自身的比例依赖来显示，在较小比例下仅过滤出最重要的标注。如果您有许多需要标注的图层和对象，这可能是使用地图服务器或至少像\
  \ Mapnik 这样的渲染引擎的一个很好的用例。\n\n### 多边形标注冲突解决\n\n为了在地图输出中实现标注图层之间的冲突解决，我们将把要标注的地理对象转换为质心——即每个对象中间的点——然后与标注字段一起作为标注图层显示。\n\
  \n1. 通过以下步骤将对象转换为点：\n   1. 导航到 Vector | Geometry Tools | Polygon Centroids。\n  \
  \ 2. 如果多边形存储在数据库中，请创建一个 SQL 视图，其中存储了多边形，如下面的代码所示：\n2. 在地图服务器或渲染器中创建一个与标注对应的图层。\n\
  3. 通过 SLD 或您将使用的任何样式标记添加调整。GeoServer 实现在解决冲突和改进位置放置方面特别出色。\n\n```\nCREATE VIEW AS\n\
  SELECT polygon_class.label, st_centroid\n    (polygon_class.geography) AS geography\n\
  FROM polygon_class;\n```\n\n第7章“为企业与社区进行地图绘制”包含一个更详细的蓝图，用于在 GeoServer 中使用 SLD 创建具有制图增强放置和冲突解决的标注图层。\n\
  \n底图的特征将影响地图界面中的交互、平移和缩放范围。您需要一个能够覆盖地图界面上要显示区域范围的底图，并可能将界面限制在感兴趣区域内。这样，查看某个州一角的建筑集合的人就不会在平移时迷失到另一个州的相反角落！当您缓存底图时，您需要指明希望缓存到此范围。同样，可查看的比例尺将在缓存底图时配置，您需要指明哪些比例尺是需要的。这会影响增量步长，即缩放工具增大或减小地图比例尺的步长。\n\
  \n\n\n\n\n## 瓦片缓存\n\n缓存底图数据以使其快速加载的最佳方法是将其保存为单个图像。无需浏览器对许多几何要素进行可能复杂的渲染，只需将与查看比例和范围相对应的少量图像从客户端快速传输到服务器并显示即可。这些预渲染图像被称为瓦片，因为当请求底图时，这些方形图像将无缝显示。现在，这是准备Web制图数据的标准方法。在本书中，我们将介绍两种创建瓦片缓存的工具：QTiles插件（第1章，探索地点——从概念到界面）和TileMill/MBTiles（第7章，为企业与社区制图）。\n\
  \n|  | 配置时间 | 执行时间 | 视觉质量 | 存储在单个文件中 | 存储为图像目录 | 适合标注 |\n|---|---|---|---|---|---|---|\n\
  | QTiles插件 | 1 | 3 | 3 | 否 | 是 | 否 |\n| GDAL2Tiles.py | 2 | 1 | 2 | 否 | 是 | 否 |\n\
  | TileMill/MBTiles | 3 | 2 | 1 | 是 | 否 | 是 |\n| GeoServer/GWC | 3 | 2 | 1 | 否 |\
  \ 否 | 是 |\n\n您需要特别注意所使用的瓦片存储方案。TileMill使用的.mbtiles格式是一个SQLite数据库，需要借助支持它的地图界面（如Leaflet）来读取。QTiles插件和GDAL2Tiles.py使用XYZ瓦片方案，其分层目录分别基于行（X）、列（Y）和缩放级别（Z），原点位于地图左上角。这是最流行的瓦片方案。TMS瓦片方案有时被GeoServer开源地图服务器使用（它支持多种方案/服务规范），OSGeo也接受该方案，两者几乎相同；但原点位于地图左下角。这常常导致一些令人困惑的结果。请注意，缩放级别是根据瓦片方案的瓦片尺寸和分辨率标准化的（例如，256\
  \ x 256像素）。\n\n## 生成并测试简单的基于目录的瓦片缓存结构\n\n我们现在将使用QTiles插件生成基于目录的ZYX瓦片方案缓存。执行以下步骤：\n\
  \n- 1. 安装QTiles和TileLayer插件。\n  - QTiles列在实验性插件下。您必须修改插件设置以显示实验性插件。导航到“插件 | 管理和安装插件\
  \ | 设置 | ‘同时显示实验性插件’”。\n- 2. 运行QTiles，创建一个新的mytiles瓦片集，最小缩放级别为14，最大为16。\n- 3. 在下一个示例中，您将体会到该目录的价值。\n\
  \n![](img/2e88bf5938bf48a409c0a534a8775b21_238_0.png)\n\n4. 您可以通过查看创建它们的目录来测试并确认瓦片是否已生成。它们位于瓦片方案中由Z、X、Y网格位置指定的编号子目录下。例如，此处有一个瓦片位于`15/9489/12442.png`。即缩放级别15，网格方案中的经度9489，网格方案中的纬度12442。\n\
  \n您现在将看到以下输出：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_239_0.png)\n\n## 为TileLayer插件创建图层描述文件\n\
  \n创建一个扩展名为`tsv`（制表符分隔）且采用UTF-8编码的图层描述文件。这是一种通用文本编码，在Web上广泛使用，有时出于兼容性需要。\n\n> 请注意，后六个参数是可选的，可以避免瓦片缺失。在以下示例中，我只使用与地图缩放级别相关的z参数，即zmin和zmax。\n\
  \n- 1. 将包含所有瓦片参数的以下形式文本添加到新文件：\n  \n  `title credit url yOriginTop [zmin zmax xmin\
  \ ymin xmax ymax]`\n  \n  - 例如，`mytiles me file:///c:/packt/c1/data/output/tiles/mytiles/{z}/{x}/{y}.png\
  \ 1 14 16.`\n  - 在上面的示例中，描述文件引用了一个本地Windows文件系统路径，其中存储了瓦片化的`.png`图像。\n\n- 2. 将mytiles.tsv保存到以下路径：\n\
  \  [你的主目录]/.qgis2///python/plugins/\n  TileLayerPlugin/layers\n\n  对我来说，在Windows上，路径是C:\\\
  Users\\[user]\\ .qgis2\\python\\plugins\\TileLayerPlugin\\layers。\n\n> 请注意，.qgis2在某些系统上可能是隐藏目录。请确保显示隐藏的目录/文件。\n\
  \n保存TSV文件的位置路径可以在“Web | TileLayer Plugin | 添加瓦片图层 | 设置 | 外部图层定义目录”下找到或设置。\n\n使用TileLayer插件预览它。您应该能够从TilerLayerPlugin对话框中添加图层。既然图层描述文件已添加到正确位置，让我们前往Web\
  \ TileLayerPlugin | 添加瓦片图层：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_240_0.png)\n\
  \n选择图层后，点击**添加**。您的瓦片将类似于下图所示：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_241_0.png)\n\
  \n> 请注意每个瓦片右下角的署名值。\n\n## 总结\n\n在本章中，您学习了必要的背景知识，并采取了步骤来启动并运行QGIS。我们对基于位置的数据执行了ETL，以将其与GIS项目进行地理空间集成。您学习了围绕图层样式和标注的基本GIS可视化技术。最后，在考虑底图特性之后，我们生成了一个可以在QGIS中预览的瓦片缓存。在下一章中，我们将使用栅格分析来生成一个操作图层，以便在简单的Web地图应用程序中进行交互。\n\
  \n## 识别最佳地点\n\n在本章中，我们将了解如何对栅格数据进行分析、增强并用于地图制作。具体来说，您将学习如何利用栅格分析和地图代数，根据其他栅格中的标准值生成适宜位置网格。然后，使用该网格，我们将制作一个简单的基于点击的地图。最终结果将是一个具有基于点击发现功能的场地适宜性Web应用程序。我们将研究耕地保护选址的适宜性。\n\
  \n在本章中，我们将涵盖以下主题：\n\n- 用于栅格分析的矢量数据ETL\n- 批处理\n- 栅格分析概念\n- 地图代数\n- 累加建模\n- 邻近分析\n\
  - 用于矢量发布的栅格数据ETL\n- 使用qgis2leaf发布Leaflet地图应用程序\n\n## 矢量数据 – 提取、转换和加载\n\n我们的适宜性分析使用地图代数和标准网格，为每个地方的某种活动给出一个适宜性值。这要求数据以栅格（网格）格式表示。因此，让我们执行其他必要的ETL步骤，然后将矢量数据转换为栅格。\n\
  \n我们将执行以下操作：\n\n- 确保我们的数据具有相同的空间参考系统。例如，我们可能使用由州交通部门维护的道路图层，以及由自然资源部门维护的土地利用图层。这些图层必须具有相同的空间参考系统，或者被转换为具有相同的系统。\n\
  - 如果我们希望在矢量形式下对地理对象进行操作，则根据某个属性表字段中定义的类别提取地理对象。\n- 如果不需要进一步分析，则转换为栅格。\n\n## 加载数据并建立CRS一致性\n\
  \n对于该项目中的图层而言，将其转换或投影到相同的地理或投影坐标系非常重要。这对于准确分析和发布为Web格式是必要的。为此执行以下步骤：\n\n- 1. 如果启用了“即时”投影，请将其禁用。否则，“即时”将自动重新投影您的数据，以便与画布中已有的图层一起显示。\n\
  \  1. 导航到“设置 | 选项”，然后配置以下屏幕截图中显示的设置：\n\n\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_245_0.png)\n\
  \n+   2. 添加项目图层：\n+      2. 导航到 图层 | 添加图层 | 矢量图层。\n+      3. 从 c2/data/original\
  \ 中添加以下图层。\n+         Applicants\n+         County\n+         Easements\n+     \
  \    Land use\n+         Roads\n\n## 确定最佳位置\n\n> \U0001F4A1 您可以按住 **Shift** 并点击连续文件，或按住\
