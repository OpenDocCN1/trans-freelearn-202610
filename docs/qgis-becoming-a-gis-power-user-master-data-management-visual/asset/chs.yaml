  \ width:100%; }\n</style>\n</head>\n<body>\n<div id='map'></div>\n<script>\n// changed\
  \ token and center coordinate pair/zoom below\nL.mapbox.accessToken = 'YOURMAPBOXTOKEN';\n\
  var map = L.mapbox.map('map', 'mapbox.streets')\n.setView([39.87240,-75.75367],\
  \ 15);\n\n// change variable names as appropriate (optional)\n// changed mapbox\
  \ id to refer to our layer/service\nvar c7Tiles = L.mapbox.tileLayer('bmearns.c7').addTo(map);\n\
