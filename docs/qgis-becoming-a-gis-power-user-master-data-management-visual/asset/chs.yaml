  }]}, ...}]}\n```\n\n## 解析 JSON 数据\n\n要处理来自此网络服务的数据，我们将使用 jQuery 的 AJAX 功能。利用 JSON\
  \ 元素的属性，我们可以查看数据作为简单网页在 HTML 中呈现的方式。\n\n## 启动服务器\n\n在 Windows 命令行上，使用以下命令在端口 8000\
  \ 上为 c:\\data\\web 启动 SimpleHTTPServer：\n\n```\ncd c:\\packt\\c7\\data\\web\npython\
  \ -m SimpleHTTPServer 8000\n```\n\n## 使用 jQuery 测试解析\n\n你可以在文件系统上查看以下代码（位于 c7\\\
  data\\web\\gsheet.html）来测试我们解析 JSON 数据的能力：\n\n```\n<html>\n<body>\n<div class=\"\
  results\"></div>\n</body>\n<script src=\"http://code.jquery.com/jquery-1.11.3.min.js\"\
  >\n</script>\n<script>\n// ID of the Google Spreadsheet\nvar spreadsheetID = \"\
  1xAc8wpgLgT2zpvZmZau2oiOIuhA_31ojKSI8miL6FM6Mzq\";\n// Make sure it is public or\
  \ set to Anyone with link can view\nvar url = \"https://spreadsheets.google.com/feeds/list/\"\
  \ + spreadsheetID + \"/1/public/values?alt=json\";\n$.getJSON(url, function(data)\
  \ {\nvar entry = data.feed.entry;\n$(entry).each(function() {\n// Column names are\
  \ name, type, etc.\n$('.results').prepend('<h2>'+$this.gs$x$name.$t+'</h2><p>'+$this.gs$x$type.$t+'</p>');\n\
  });\n});\n</script>\n```\n\n你可以在网络浏览器中预览 http://localhost:8000/gsheet.html。你将看到建筑名称后跟类型，如以下图像所示：\n\
