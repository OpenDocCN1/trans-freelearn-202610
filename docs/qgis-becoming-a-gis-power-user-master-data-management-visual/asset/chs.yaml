  \ Lecture Hall\nInstruction\n\nPurnell Hall\nInstruction\n\nMunroe Hall\nInstruction\n\
  \nRodney Commons A/B\nStudent Activities\n\nRodney Hall C\nResidence Hall\n\nRodney\
  \ Dining Hall\nDining Hall\n\nFred Rust Ice Arena\n\n## 推广\n\n现在让我们看看如何将此系统运营化以实现协作数据编辑。\n\
  \n## 为其他用户分配权限\n\n在表格中，点击右上角的蓝色 **Share** 按钮。或者，从 Drive 中，选择文件并点击它，然后点击看起来像带加号的人的图标。确保任何人都可以找到并查看文档。最后，添加你希望能够编辑文档的人的地址并赋予他们编辑权限，如以下屏幕截图所示：\n\
  \n![](img/2e88bf5938bf48a409c0a534a8775b21_405_0.png)\n\n## 编辑工作流程\n\n现在你的协作者收到了编辑表格的邀请，他们只需使用其\
  \ Google 凭据登录并对表格进行更改——更改将自动保存。当然，如果他们没有 Google 凭据，他们需要创建一个帐户。\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_406_0.png)\n\
  \n要进入表格，你的协作者只需点击 Open in Sheets。表格现在也应出现在其 Drive 的“与我共享”下。\n\n你可以根据需要通过修订历史记录回滚更改。请执行以下步骤：\n\
  \n- 1. 进入你的表格。\n- 2. 导航到 **File | See revision history**。\n- 3. 你可以按默认颜色编码查看所有更改，如以下屏幕截图所示：\n\
  \n![](img/2e88bf5938bf48a409c0a534a8775b21_408_0.png)\n\n4. 如果你点击某个特定更改，你将有选项恢复到该点的修订，如以下屏幕截图所示：\n\
  \n![](img/2e88bf5938bf48a409c0a534a8775b21_409_0.png)\n\n## 在你的 JSON 源中查看更改\n\n\
  再次访问 `http://localhost:8000/gsheet.html` 以查看对表格的更改如何影响你的 JSON 源。注意以下图像中我们对 **Christiana\
  \ East Tower**、**Kirkbride Lecture Hall** 和 **Purnell Hall** 的 type 字段所做的更改：\n\n\
  ![](img/2e88bf5938bf48a409c0a534a8775b21_410_0.png)\n\n在本章的最后一节中，我们还将看看如何在地图界面中预览此内容。\n\
  \n### 地理空间数据的制图渲染 – MBTiles 和 UTFGrid\n\n到目前为止，你可能会想，地图呢？到目前为止，我们还没有包含任何地理空间数据或可视化。我们将把管理和提供地理空间数据和服务的部分工作外包给\
  \ OpenStreetMap——我们最喜欢的公共开源地理空间数据存储库！\n\n- 为什么我们使用 OpenStreetMap？\n  \n  - OSM 已经为基地图中的快速复制提供了镜像地图服务\n\
  \  - OSM 为校园中可能找到的地理特征提供了一个非常广泛且可扩展的模式\n  - 各种网络、移动和桌面客户端已经编写用于与 OSM API 交互\n  -\
  \ OSM 提供数据库和其他基础设施，因此我们不必提供\n  - OSM 有一种细粒度且可靠的方式来跟踪更改，使用 `osm_version` 和 `osm_user`\
  \ 字段，这与 `osm_id` 唯一 ID 字段相辅相成\n\n## OpenStreetMap 到 SpatiaLite\n\n要使用 OSM 数据，我们需要将其转换为可与其他\
  \ GIS 软件组件互操作的格式。一个快速而强大的解决方案是将 OSM 数据存储在 SQLite SpatiaLite 数据库实例中，如果你还记得的话，这是一个具有完整空间和\
  \ SQL 功能的单个文件。\n\n要使用 QGIS 下载并将 OSM 转换为 SQLite，请执行以下步骤：\n\n- 1. 以我们在 *Chapter 4,\
  \ Finding the Best Way to Get There* 中所做的方式获取 OSM 数据。使用 OpenLayers 插件放大 Newark,\
  \ DE（或使用范围 `39.7009,-75.7195,39.6542,-75.7784`，从对话框顶部顺时针开始，在下一步中）：\n  - 1. 导航到 **Vector\
  \ | OpenStreetMap | Download Data** 以下载此范围的 OSM 数据。\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_411_0.png)\n\
  \n\n\n\n\n- **2.** 接下来，将 `.osm` 文件中的 XML 数据导出到拓扑 SQLite 数据库中。这可能可用于路由；不过，在这里我们不会这样做。\n\
  \  - **1.** 导航到 **Vector | OpenStreetMap | Import Topology from XML**。\n\n  ![](img/2e88bf5938bf48a409c0a534a8775b21_412_0.png)\n\
  \n- **3.** 接下来，将拓扑数据导出为普通地理空间数据——本例中为多边形。\n  - **1.** 导航到 **Vector | OpenStreetMap\
  \ | Export topology to SpatiaLite**。\n  - **2.** **Export type: Polygons (closed\
  \ ways)**。\n  - **3.** 点击 **Load from DB** 以填充数据中的字段列表。选择字段 **amenity, building,\
  \ name,** 和 **leisure**，如下图所示：\n\n  ![](img/2e88bf5938bf48a409c0a534a8775b21_413_0.png)\n\
  \n- **4.** 使用 DB Manager 显示大学建筑。\n  - **1.** 导航到 Database | DB Manager | DB Manager。\n\
  \  - **2.** 突出显示 c7 SQLite 数据库。\n  - **3.** 执行以下查询，确保选择了 **Load as new layer**：\n\
  \n```sql\nSELECT * FROM c7_polygons WHERE building = 'yes' and amenity = 'university'\n\
  ```\n\n  ![](img/2e88bf5938bf48a409c0a534a8775b21_414_0.png)\n\n- **5.** 将查询图层导出到\
  \ `c7/data/original/delaware-latest-3875/buildings.shp`，投影为 EPSG:3857。\n\n## To\
  \ tile and use UTFGrid with TileMill\n\n尽管 TileMill 已不再由其创建者 Mapbox 积极生产，但它仍然可用于我们使用\
  \ CartoCSS 和 UTFGrid 交互图层通过 Mapnik 渲染的 MBTiles 瓦片图像。\n\n### Preparing a basemap\
  \ from OSM\n\nTileMill 要求所有数据一起渲染和切片，因此仅支持矢量数据输入，包括 JSON、shapefile、SpatiaLite 和\
  \ PostGIS。\n\n在以下步骤中，我们将作为 `.mbtiles`（基于单文件）瓦片缓存渲染出一个地图学上令人愉悦的地图：\n\n- **1.** 安装并打开\
  \ TileMill。\n- **2.** 从 Geofabrik OSM 提取站点的北美部分下载特拉华州数据（`http://download.geofabrik.de/north-america.html`）作为\
  \ shapefile。或者，你也可以直接从 `http://download.geofabrik.de/north-america/us/delaware-latest.shp.zip`\
  \ 下载。确保在下载后将 zip 归档解压并复制到你的项目目录中。\n- **3.** 将所有数据从 EPSG:4326 重投影到 EPSG:3875。如果你还记得，QGIS\
  \ 可以像其他 **Processing Toolbox** 算法一样批量执行此操作，就像你在 *Chapter 2, Identifying the Best\
  \ Places* 中学到的那样，使此过程更快一些。\n  - 将所有图层输出到 `c7/data/original/delaware-latest-3875`。\n\
  \n  ![](img/2e88bf5938bf48a409c0a534a8775b21_415_0.png)\n\n- **4.** 将 DC 示例复制到新项目中。\n\
  \  - 你可以在 `C:\\Program Files (x86)\\TileMill-v0.10.1\\tilemill\\examples\\open-streets-dc`\
  \ 找到它\n  - 复制到 `C:\\Users\\[YOURUSERNAME]\\Documents\\MapBox\\project\\c7`\n- **5.**\
  \ 删除 **layers** 目录中的所有文件。\n- **6.** 复制并解压 `c7/data/original/delaware-latest-3875`\
  \ 中的所有 shapefiles 到项目目录 `c7` 的 layers 目录中，可在 `C:\\Users\\[YOURUSERNAME]\\Documents\\\
  MapBox\\project\\c7\\layers` 找到。\n- **7.** 编辑 `project.mml` 文件。\n  - **1.** 将所有\
  \ `open-streets-dc` 字符串的实例更改为 `c7`。\n  - **2.** 将 `Open Streets, DC` 的单个实例更改为 `c7`。\n\
  \  - **3.** 替换以下 bounds 和 center：\n\n```json\n\"bounds\": [\n    -75.7845,\n   \
  \ 39.6586,\n    -75.7187,\n    39.71\n],\n\"center\": [\n    -75.7538,\n    39.6827,\n\
  \    14\n],\n```\n\n  - **4.** 将以下图层引用更改为文件：\n    - land uses: 将此图层从 `osm-landusages.shp`\
  \ 更改为 `landuse.shp`\n    - ocean: 删除此图层或忽略\n    - water: 将此图层从 `osm-waterareas.shp`\
  \ 更改为 `waterways.shp`\n    - tunnels: 将此图层从 `osm-roads.shp` 更改为 `roads.shp`\n  \
  \  - roads: 将此图层从 `osm-roads.shp` 更改为 `roads.shp`\n    - mainroads: 将此图层从 `osm-mainroads.shp`\
  \ 更改为 `roads.shp`\n    - motorways: 将此图层从 `osm-motorways.shp` 更改为 `roads.shp`\n\
  \    - bridges: 将此图层从 `osm-roads.shp` 更改为 `roads.shp`\n    - places: 将此图层从 `osm-places.shp`\
  \ 更改为 `places.shp`\n    - road-label: 将此图层从 `osm-roads.shp` 更改为 `roads.shp`\n- **8.**\
  \ 打开 TileMill 并从 Projects 对话框中选择 c7 项目，如下图所示：\n\n  ![](img/2e88bf5938bf48a409c0a534a8775b21_417_0.png)\n\
  \n### Preparing the operational layer in TileMill\n\n- **1.** 从左下角最底部的按钮打开 Layers\
  \ 面板。参考下一张图片。\n- **2.** 点击 + Add layer。\n- **3.** 使用以下值填充参数：\n  - ID: buildings.\n\
  \  - Datasource: c7/data/original/delaware-latest-3875/buildings.shp.\n  - 点击 Save\
  \ & Style。你可以稍后通过在 Layers 面板中点击 Editor 按钮（铅笔图标）旁边的 #c7 图层返回此对话框，如下一张图片所示。\n- **4.**\
  \ 如果你还没有看到图层，请确保在右侧标签中为图层定义了一些样式（默认情况下应已填充最小样式）。然后，点击右上角的 Save。\n- **5.** 使用 CartoCSS\
  \ 语法更改 style.mss 中的样式。TileMill 提供了一个颜色选择器，我们可以通过点击 CartoCSS/style 面板底部颜色样本访问。更改颜色后，你可以在那里查看十六进制代码。只需选择一种颜色，将十六进制代码放在你的\
  \ CartoCSS 中并保存它。例如，考虑以下代码：\n\n```css\n#buildings {\n  line-color:#eb8f65;\n  line-width:0.5;\n\
  \  polygon-opacity:1;\n  polygon-fill:#fdedc9;\n}\n```\n\n- **6.** 点击主屏幕右上角的 Save（铅笔图标），位于\
  \ CartoCSS 输入框上方，以查看更改，如下图所示：\n\n  ![](img/2e88bf5938bf48a409c0a534a8775b21_418_0.png)\n\
  \n- **7.** 通过点击左下角最上面的按钮进入 **Templates** 标签，并更改 **Teaser** 和 **Full** 交互类型以使用来自\
  \ buildings 的 `{{ {id} }}`，如下图所示：\n\n  ![](img/2e88bf5938bf48a409c0a534a8775b21_419_0.png)\n\
  \n## Exporting MBTiles\n\nMBTiles 是 Mapbox 开发的一种格式，用于存储地理信息。此格式除了与 Mapbox 开发的小而令人印象深刻的一套软件和服务交互外，还有两个引人注目的方面：首先，MBTiles\
  \ 将整个瓦片存储保存在单个文件中，易于传输和维护，其次，此格式启用了 UTFGrid，即使用 UTF 字符进行高性能数据交互。\n\n### Uploading\
  \ to Mapbox\n\n执行以下步骤：\n\n- **1.** 在 mapbox.com 创建一个账户。\n- **2.** 从右上角的 **Export**\
  \ 按钮访问 **Export** 对话框。从此菜单中选择 **Upload**。\n- **3.** 通过点击对话框顶部的按钮登录到你的 Mapbox 账户。\n\
  - **4.** 按住 *Shift*，点击并拖动以在地图上定义一个范围。\n- **5.** 缩放到比你预期最小缩放高一级的级别以预览范围。\n- **6.**\
  \ 在导出对话框中填写描述信息。\n  - **Name:** c7\n  - **Zoom:** 11 to 16\n- **7.** 点击地图以建立 **Center**\
  \ 坐标。\n- **8.** 选择 **Save settings to project**。\n- **9.** 上传，如下图所示：\n\n  ![](img/2e88bf5938bf48a409c0a534a8775b21_420_0.png)\n\
  \n### The MBTiles file\n\n导出直接到 MBTiles 文件的步骤与之前的程序类似。此格式可以上传到 mapbox.com 或使用支持该格式的软件（如\
  \ TileStream）提供。当然，无需登录。\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_421_0.png)\n\
  \n### Interacting with Mapbox services\n\n在上一节的最后一部分，我们以 MBTiles 格式将渲染的地图上传到 Mapbox。\n\
  \n要查看 Mapbox 为我们的 MBTiles 生成的 HTML 页面，请导航到 Export | View Exports。你会在那里找到上传。点击 View\
  \ 在网络浏览器中打开它。\n\n\n\n\n\n例如，考虑以下 URL：http://a.tiles.mapbox.com/v3/bmearns.c7/page.html#11/39.8715/-75.7514。\n\
  \n![](img/2e88bf5938bf48a409c0a534a8775b21_422_0.png)\n\n你可能还想预览连接到你数据的 TileJSON\
  \ 网络服务。你可以通过在你的网络地图 ID 后添加 .json 来实现；例如，这在 http://a.tiles.mapbox.com/v3/bmearns.c7.json\
  \ 中完成，它执行以下操作：\n\n```\n{\"attribution\":\"\",\"bounds\":[-75.8537,39.7943,-75.6519,39.9376],\"\
  center\":[-75.7514,39.8715,11],\"description\":\"packt, qgis, c7\",\"download\"\
  :\"http://a.tiles.mapbox.com/v3/bmearns.c7.mbtiles\",\"embed\":\"http://a.tiles.mapbox.com/v3/bmearns.c7.html\"\
  ,\"filesize\":15349760,\"format\":\"png\",\"grids\":[\"http://a.tiles.mapbox.com/v3/bmearns.c7/{z}/{x}/{y}.grid.json\"\
  ,\"http://b.tiles.mapbox.com/v3/bmearns.c7/{z}/{x}/{y}.grid.json\"],\"id\":\"bmearns.c7\"\
  ,\"legend\":\"\",\"maxzoom\":16,\"minzoom\":11,\"modified\":1435689144009,\"name\"\
  :\"c7\",\"private\":true,\"scheme\":\"xyz\",\"template\":\"{{#_location_}}{{/ _location_}}{{#_teaser_}}{{{id}}}{{/\
  \ _teaser_}}{{#_full_}}{{{id}}}{{/ _full_}}\",\"tilejson\":\"2.0.0\",\"tiles\":[\"\
  http://a.tiles.mapbox.com/v3/bmearns.c7/{z}/{x}/{y}.png\",\"http://b.tiles.mapbox.com/v3/bmearns.c7/{z}/{x}/{y}.png\"\
  ],\"version\":\"1.0.0\",\"webpage\":\"http://a.tiles.mapbox.com/v3/bmearns.c7/page.html\"\
  }\n```\n\n## 将本地应用与托管服务连接\n\n现在我们可以通过 Mapbox 生成的 HTML 和 JSON 查看瓦片服务器，让我们看看如何将其与我们可以自定义的本地\
  \ HTML 连接起来。\n\n### API 令牌\n\n首先，你需要从 Mapbox 获取 API 令牌。令牌标识你的 Web 应用与 Mapbox，并启用你创建的\
  \ Web 服务的使用。由于你将把此令牌添加到应用的前端代码中，它将是公开的并且容易被滥用。鉴于 Mapbox 每月的视图使用限制，你可能希望考虑定期进行令牌轮换（包括创建、代码修改和删除）。这也是考虑使用类似\
  \ TileStream 的东西在本地托管你的服务的一个好理由，该内容在以下 *更进一步 – 使用 TileStream 进行本地 MBTiles 托管* 部分中介绍。\n\
  \n![](img/2e88bf5938bf48a409c0a534a8775b21_423_0.png)\n\n### Mapbox.js\n\nMapbox.js\
  \ 是 Mapbox 开发的用于与其服务交互的地图库。由于其核心是 Leaflet，代码看起来会很熟悉。我们将查看对你可以从 https://www.mapbox.com/mapbox.js/example/v1.0.0/utfgrid-data-popup/\
  \ 获取的创建弹出窗口的 UTFGrid 数据示例应用代码所做的修改。\n\n## 简单的 UTFGrid 修改\n\n在下面的示例中，我们将仅修改直接引用示例数据的代码部分。当然，我们希望将这些部分更改为引用我们的数据：\n\
