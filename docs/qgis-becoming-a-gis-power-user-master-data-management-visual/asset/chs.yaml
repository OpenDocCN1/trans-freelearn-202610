  \ TileStream 进行本地 MBTiles 托管\n\n尽管 Mapbox 托管因其相对简便而颇具吸引力，但你可能希望托管自己的 MBTiles，例如为了降低成本。TileStream\
  \ 是 Mapbox 托管服务的开源基础。它运行在 Node.js 环境下。\n\n虽然 TileStream 在技术上可以通过 Node.js 安装在 Windows\
  \ 上，但有些依赖项可能无法安装。建议你在 Linux 环境中执行以下安装。如果你的组织服务器已经运行 Linux，那就太好了！你可以直接跳到安装 Node.js\
  \ 和 TileStream 的部分。幸运的是，借助 Virtual Box 和 Vagrant，可以在 Windows 系统上搭建一个 Linux 虚拟机。\n\
  \n### 设置 Vagrant 虚拟 Linux 实例\n\n- 1. 安装 Virtual Box。你可以从 https://www.virtualbox.org/wiki/Downloads\
  \ 下载 Virtual Box。\n- 2. 安装 Vagrant。你可以从 https://www.vagrantup.com/ 下载 Vagrant。\n\
  - 3. 为你的 Vagrant 实例创建一个新目录（例如 c:\\packt\\c7\\vagrant）。\n- 4. 在 Windows 命令行中运行以下命令：\n\
  \  `cd c:\\packt\\c7\\vagrant`\n- 5. 在 Windows 命令行中运行以下命令来创建你的 vagrant 实例：\n  `vagrant\
  \ init hashicorp/precise32`\n  `vagrant up`\n- 6. 现在，你应该会在 Windows 命令行的当前工作目录中看到一个名为\
  \ Vagrantfile 的文件（例如 c:\\packt\\c7\\vagrant）。Vagrantfile 是控制 Vagrant 配置的纯文本文件。请在\
  \ Vagrantfile 中添加以下行，将（尚未创建的）Node.js 端口转发到你的 Windows localhost：\n  `config.vm.network\
  \ \"forwarded_port\", guest: 8888, host: 8088`\n- 7. 在 Windows 命令行中运行以下命令来重新加载 Vagrant：\n\
  \  `vagrant reload`\n- 8. 通过 Windows SSH 客户端连接到 Vagrant 实例。\n\n- - 如果 PATH 环境中已有\
  \ SSH 客户端，`vagrant ssh` 命令应该会启动它并连接到此目录中的实例。\n- - 如果没有，你只需在自选的 Windows SSH 客户端（如\
  \ Putty）中设置以下连接参数：\n  **主机：** `127.0.0.1`\n  **端口：** `2222`\n  **用户名：** `vagrant`\n\
  \  **密码（如果需要）：** `vagrant`\n  **私钥：** `c:/packt/c7/vagrant/.vagrant/machines/default/virtualbox/private_key`\n\
  \n## 安装 Node.js 和 TileStream\n\n使用以下命令从 `chris-lea` 软件包存档安装 Node.js。这是 Mapbox 推荐的\
  \ Node.js 源。前面的 Vagrant 设置步骤可以确保 apt 等依赖项按需配置完成。否则，你可能需要自行安装一些其他依赖项。另外请注意，在不支持 GNU/Debian\
  \ 的系统上，这种方法行不通；你需要在 yum 上搜索相关仓库、查找 RPM，或者从源代码构建。不过，我不确定这些方法是否都能行得通。\n\n请注意，以下所有命令都需要在\
  \ Linux 实例中运行。如果你遵循了前面的步骤，你需要通过 SSH 客户端（如 Putty）来运行这些命令：\n\n```\nsudo apt-add-repository\
  \ ppa:chris-lea/node.js\nsudo apt-get update\nsudo apt-get install nodejs\n```\n\
  \n安装 Git，并将 TileStream 源代码克隆到一个新目录。运行以下命令行：\n\n```\ngit clone https://github.com/mapbox/tilestream.git\n\
  cd tilestream\nnpm install\n```\n\n## 设置并启动 TileStream\n\n你必须将自己的 MBTiles 文件放到 `/home/vagrant/Documents/MapBox/tiles`\
  \ 下。你可以使用自己习惯的文件传输客户端来完成；我喜欢用 WinSCP。只需使用你之前用于 SSH 的相同连接信息即可。\n\n最后，启动 TileStream：\n\
  \n```\n./index.js\n```\n\n现在，你可以在 http://localhost:8088 预览 TileStream 服务。\n\n点击\
  \ info 按钮获取 PNG 瓦片的地址。你可以修改这个地址：移除对 x、y、z 瓦片的引用，并添加 .json 扩展名，即可获得 TileJSON，例如 http://localhost:8088/v2/c7_8b4e46.json。\n\
  \n现在，只需修改 OpenLayers 示例，使其引用这个 .json 地址而不是 Mapbox，你就拥有了完全不依赖 Mapbox 的 MBTiles 用法。\n\
  \n演示此用法的代码位于 http://localhost:8000/utfgrid-ts.html。\n\n## 小结\n\n在最后一章中，我们研究了一个基于\
  \ Web 服务构建的 Web 应用，它为我们的用户提供了编辑能力。这在协作式地理数据系统中属于较简单的一端，但借助 TileMill（以及 Mapnik）提供的出色制图渲染能力，以及通过\
  \ MBTiles 和 UTFGrid 实现的高性能数据发布能力，它仍然颇具吸引力。\n\n## 模块 3\n\n## QGIS 2 Cookbook\n\n\
  成为 QGIS 高级用户，掌握 QGIS 数据管理、可视化和空间分析技术。\n\n\n\n\n\n# 1\n\n## 数据输入与输出\n\n在本章中，我们将介绍以下配方：\n\
  \n- 在计算机上查找地理空间数据\n- 描述数据源\n- 从文本文件导入数据\n- 导入 KML/KMZ 文件\n- 导入 DXF/DWG 文件\n- 打开\
  \ NetCDF 文件\n- 保存矢量图层\n- 保存栅格图层\n- 重投影图层\n- 批量格式转换\n- 批量重投影\n- 将矢量图层加载到 SpatiaLite\n\
  - 将矢量图层加载到 PostGIS\n\n## 引言\n\n如果你想使用 QGIS，第一件事就是需要空间数据。无论你想制作精美的地图布局还是进行空间分析，都需要打开一些数据来工作。本章介绍基本的数据输入和输出命令，这将使你能够使用多种不同格式的数据，并在需要将其用于不同应用程序或与他人共享时导出到最方便的格式。\n\
  \n本食谱中看到的许多操作都可以通过自动化实现。本章包含一些使用自动化处理一组输入文件的配方。\n\n## 在计算机上查找地理空间数据\n\n本配方展示了如何使用\
  \ QGIS 浏览器定位和打开空间数据。\n\n### 准备工作\n\n开始工作之前，请确保你已将示例数据集复制到文件系统并已定位。\n\n### 操作方法...\n\
  \n有几种方法可以定位并在 QGIS 中打开数据文件，但其中最方便的是 QGIS 浏览器：\n\n- 1. 要启用它，请转到 View | Panels 菜单并启用其中的\
  \ Browser 复选框。浏览器默认会显示在 QGIS 窗口的左侧，如以下屏幕截图所示：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_438_0.png)\n\
  \n浏览器包含一个包含所有可用空间数据源的树。这包括文件系统中的数据文件、数据库和远程服务。\n\n- 2. 导航到你复制示例数据集的文件夹，你将看到可用数据文件的列表，如以下屏幕截图所示：\n\
  \n![](img/2e88bf5938bf48a409c0a534a8775b21_439_0.png)\n\n> 并非所有文件都显示，只有被识别为有效数据源的文件才会显示。\n\
  \n- 3. 要将文件添加到项目中，只需右键单击它并选择 Add Layer：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_439_1.png)\n\
  \n- 4. 允许多选。在这种情况下，选择 **Add selected layer** 菜单。\n\n另一种打开文件的方法是直接将其拖放到 QGIS 画布中。同样允许拖放多个文件，如以下屏幕截图所示：\n\
  \n![](img/2e88bf5938bf48a409c0a534a8775b21_440_0.png)\n\n### 工作原理...\n\n浏览器充当直接链接到\
  \ QGIS 的文件资源管理器，它只显示有效的数据文件，并且可以轻松地将它们添加到 QGIS 项目中。\n\n### 还有更多...\n\n与本配方相关的还有一些你需要了解的事情。它们在以下各节中进行了说明。\n\
  \n### 使用图层菜单添加图层\n\n作为浏览器的替代方案，**Layer** 菜单包含一组条目。它们中的每一个都处理不同类型的数据。它们为你提供了一些额外的选项，并且可能允许你使用浏览器不支持的格式。\n\
  \n### 将文件夹添加到收藏夹\n\n导航到数据所在的文件夹可能很麻烦。如果你经常使用某个文件夹，可以右键单击它并选择 **Add as favorite**。该文件夹将出现在浏览器树顶部的\
  \ **Favorites** 部分。\n\n### 非文件数据源\n\n浏览器还显示非文件数据，例如远程服务。服务必须在浏览器相应部分出现之前定义。要添加服务，请右键单击服务名称并选择\
  \ New connection.... 将出现一个对话框来定义服务连接参数。\n\n例如，尝试使用浏览器中的 WMS 条目添加以下 WMS 服务，如以下屏幕截图所示：\n\
  \n![](img/2e88bf5938bf48a409c0a534a8775b21_441_0.png)\n\n将出现一个新条目，其中包含服务提供的图层，如以下屏幕截图所示：\n\
  \n![](img/2e88bf5938bf48a409c0a534a8775b21_442_0.png)\n\n## 描述数据源\n\n在打开数据文件之前，你可以获取有关其附加信息。本配方展示了如何探索数据来源的属性。\n\
  \n### 准备工作\n\n开始工作之前，请确保你已将示例数据集复制到文件系统并已定位。\n\n### 操作方法...\n\n- 1. 在 QGIS 浏览器中，导航到包含示例数据集的文件夹。选择\
  \ `elev_lid792_1m` 文件并右键单击它。在上下文菜单中选择 **Properties**。将出现如下屏幕截图中的对话框：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_443_0.png)\n\
  \n此对话框显示栅格图层的属性。\n\n2. 现在，让我们选择一个矢量图层。选择 elev_lid792_randpts.shp 文件，右键单击它并选择 Properties。信息对话框将如下所示：\n\
  \n![](img/2e88bf5938bf48a409c0a534a8775b21_444_0.png)\n\n### 工作原理...\n\n在描述窗口的上部，你会看到一个名为\
  \ Provider 的字段。Provider 定义数据类型或数据来源以及谁负责读取数据并将其传递给 QGIS。对于栅格图层，你会看到 Provider 为 gdal。对于大多数基于文件的矢量图层，ogr\
  \ 将是出现的提供者。它们指的是 GDAL 和 OGR 库，这两个开源库被许多 GIS 程序用于访问栅格和矢量数据。\n\n### 还有更多...\n\n如果数据已加载到\
  \ QGIS 中，你可以在图层的 **Properties** 部分访问有关其的信息（右键单击图层名称以在上下文菜单中选择 **Properties** 条目）。在左侧显示的部分中，选择\
  \ **Metadata** 部分。你将看到一个框，其中包含与图层数据来源对应的所有信息：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_445_0.png)\n\
  \n## 数据输入与输出\n\nGDAL 库提供的功能（前面提到过，它充当栅格图层的提供者）也在 Raster 菜单中可用。这包括处理和数据分析方法，但也包括用于描述栅格数据源的信息工具。你可以通过导航到\
  \ Raster | Miscellaneous | Info 找到它：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_446_0.png)\n\
  \n### 另请参阅\n\n- 这是一种更复杂的方式来检索属性，因为你可以通过调整参数以更详细的方式调用工具以获取附加信息。要了解更多信息，请查看 http://www.gdal.org/gdalinfo.html\
  \ 上的 gdalinfo 帮助页面。\n\n## 从文本文件导入数据\n\n数据可以从文本文件导入，提供有关几何信息如何在文本中存储的一些附加信息。本配方展示了如何基于文本文件创建新的点图层。\n\
  \n### 操作方法...\n\n- 1. 从 **Layer** 菜单中选择 **Add delimited text layer** 菜单项。你将看到如下对话框：\n\
  \n![](img/2e88bf5938bf48a409c0a534a8775b21_447_0.png)\n\n- 2. 在上部字段中，输入示例数据集中 `elev_lid792_randpts.csv`\
  \ 文件的路径。该文件包含作为文本的点图层。\n\n## 数据输入与输出\n\n- 3. 一旦你输入文件路径或通过单击 **Browse** 按钮打开的文件浏览器中选择它，对话框下半部分中的字段将被填充，如以下屏幕截图所示：\n\
  \n![](img/2e88bf5938bf48a409c0a534a8775b21_448_0.png)\n\n> 我们使用的是以逗号分隔值的 CSV 文件，因此你必须在\
  \ **Format** 字段中选择 **CSV** 选项。\n\n**X field** 和 **Y field** 下拉列表将填充可用字段，这些字段在文本文件的第一行中描述。选择\
  \ **X** 作为 **X field**，选择 **Y** 作为 **Y field**。现在，QGIS 知道如何创建几何图形，并且有足够的信息从文本文件创建新图层。\n\
  \n\n\n\n4. 在**图层名称**字段中输入图层名称，然后点击**确定**。该图层将被添加到QGIS项目中，如以下截图所示：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_449_0.png)\n\
  \n5. 文本文件中不包含有关CRS的信息，也未在参数对话框中输入，因此必须手动添加。在本例中，使用的CRS是EPSG:3358。要将此设置为图层的CRS，请右键单击图层名称并选择“设置图层CRS”：\n\
  \n![](img/2e88bf5938bf48a409c0a534a8775b21_450_0.png)\n\n6. 在CRS选择对话框中，选择EPSG:3358\
  \ CRS并点击**确定**。该图层现在具有正确的CRS。\n\n## 工作原理...\n\n从文本文件中读取数据并处理以创建几何图形。表中的所有字段（文本文件中一行的所有数据）也会被添加，包括用于创建几何图形的字段，您可以通过右键单击图层并选择“打开属性表”来查看，如以下截图所示：\n\
  \n![](img/2e88bf5938bf48a409c0a534a8775b21_451_0.png)\n\n与CSV文件一起，此文件可能包含一个CSVT文件，该文件描述了字段的类型。QGIS使用它来为图层的属性表设置适当的类型。如果CSVT文件缺失（如本例所示），QGIS将尝试根据每个字段的值来确定类型。\n\
  \n## 更多内容...\n\n从文本文件创建的图层不仅限于点文件。可以从文本数据创建任何几何图形。但是，如果不是点，则不能选择两列，而必须将所有几何信息放在一个列中，并输入几何图形的文本表示。QGIS使用熟知文本（WKT）格式（一种用于矢量几何图形的文本标记语言）将几何图形描述为字符串。以下是一个非常简单的CSV文件示例，其中包含线要素和两个属性：\n\
  \n```\ngeom,id,elevation\nLINESTRING(0 1, 0 2, 1 3),1,50\nLINESTRING(0 -1, 0 -2,\
  \ 1 -3),2,60\nLINESTRING(0 1, 0 3, 5 4),3,70\n```\n\n## 另请参阅\n\n- 要了解有关WKT格式的更多信息，您可以访问\
  \ http://en.wikipedia.org/wiki/Well-known_text\n\n## 导入KML/KMZ文件\n\nKML和KMZ文件由Google\
  \ Earth使用和生成，是一种流行的格式。本教程向您展示如何使用QGIS打开它们。\n\n## 操作步骤...\n\n- 1. 要打开KML图层，请选择**图层/添加矢量图层...**。在打开的对话框中，点击**浏览**按钮打开文件选择对话框。选择**Keyhole标记语言（KML）**格式，然后选择要加载的文件。在示例数据集中，您可以找到多个KML文件。选择`elcontour1m.kml`文件。在矢量图层选择对话框中点击**确定**，该图层将被添加到您的项目中，如以下截图所示：\n\
  \n![](img/2e88bf5938bf48a409c0a534a8775b21_452_0.png)\n\n> KMZ文件也可以在QGIS中打开。\n\n\
  - 2. 转到**图层 | 添加矢量图层...**。在打开的对话框中，点击**浏览**按钮打开文件选择对话框。选择**所有文件**选项以查看所有文件，然后选择`elcontourlm.kmz`文件。QGIS中没有定义KMZ文件类型，但QGIS支持它，因为底层的OGR库也可以读取KMZ文件。\n\
  - 3. 在打开图层对话框中点击**确定**以打开所选图层。\n\n从KMZ文件包含的图层中，您必须选择一个。在本例中，`elcontourlm.kmz`文件中只包含一个图层，因此它会自动加载。该图层将被添加到您的QGIS项目中。\n\
  \n## 工作原理...\n\nKMZ文件是包含一组图层的压缩文件。当您选择它时，OGR库将解压缩此文件的内容，然后打开其中包含的图层。\n\n如果只包含一个图层，您将不会看到图层选择对话框。QGIS将自动打开KMZ文件中唯一的图层。\n\
  \n## 更多内容...\n\n由于KMZ不被识别为受支持的格式，KMZ文件不会出现在QGIS浏览器中。但是，浏览器支持压缩文件，而KMZ文件实际上是一个包含KML文件的压缩文件。将其解压缩到文件夹中，然后您就可以使用QGIS浏览器打开其中包含的图层。\n\
  \n## 导入DXF/DWG文件\n\nCAD文件（如DXF和DWG文件）可以使用QGIS打开。本教程向您展示如何操作。\n\n## 操作步骤...\n\n-\
  \ 1. 要打开DXF图层，请在**图层**菜单中选择**添加矢量图层...**。在打开的对话框中，点击**浏览**按钮打开文件选择对话框。选择**Autocad\
  \ DXF**格式，然后选择要加载的文件。\n\n2. 在示例数据集中，您可以找到多个DXF文件。选择`wake_ ApproxContour_100.dxf`文件。在矢量图层选择对话框中点击**确定**，该图层将被添加到您的项目中，如以下截图所示：\n\
  \n![](img/2e88bf5938bf48a409c0a534a8775b21_454_0.png)\n\n## 工作原理...\n\nDXF文件作为普通矢量图层读取，尽管它们与常规矢量图层的结构不同，因为它们不允许向每个几何图形添加任意属性。\n\
  \n## 更多内容...\n\n您打开的示例DXF文件只包含一种类型的几何图形。但是，DXF文件可以包含多种几何图形：在这种情况下，它们无法在一个图层中添加到QGIS。发生这种情况时，QGIS将要求您选择要打开的几何图形类型。\n\
  \n在示例数据集中，您会找到一个名为`css-SITE-CIV.dxf`的文件。打开它，您将看到以下对话框：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_455_0.png)\n\
  \n选择可用的几何图形之一，一个图层将被添加到您的QGIS项目中。\n\n## 打开DWG文件\n\nDWG是Autodesk的封闭格式。这意味着该格式的规范不可用。因此，与其他开源应用程序一样，QGIS不支持DWG文件。要在QGIS中打开DWG文件，您需要对其进行转换。将其转换为DXF文件是一个不错的选择，因为这样可以让您毫无问题地在QGIS中打开文件。有许多工具可以做到这一点。Teigha转换器可以在\
  \ http://opendesign.com/guestfiles/TeighaFileConverter 找到，它是一个流行且可靠的选择。\n\n另一种选择是使用Autodesk提供的免费服务，称为Autocad\
  \ 360，可以在 https://www.autocad360.com/ 找到。\n\n## 打开NetCDF文件\n\nNetCDF数据是一种数据格式，设计用于面向数组的科学数据，并且经常用于气候或海洋数据等。本教程向您展示如何在QGIS中打开NetCDF文件。\n\
  \n## 操作步骤...\n\nNetCDF文件是栅格文件，可以使用“添加栅格图层”菜单打开。在您将看到的文件选择对话框中，选择“NGMT NetCDF Grid\
  \ for CDF”作为文件格式，然后从示例数据集中选择`rx5dayETCCDI_yr_MIROC5_rcp45_r2i1p1_2006-2100.nc`文件。点击**确定**。\n\
  \n## 工作原理...\n\n该NetCDF文件包含一个单个变量，该变量作为常规栅格图层打开。\n\n## 更多内容...\n\n一个NetCDF文件可以包含多个图层。在这种情况下，QGIS将提示您从指定文件包含的图层中选择要添加的图层。\n\
  \n当只有一个图层可用时，它会直接打开，如前面描述的示例所示。\n\n## NetCDF浏览器插件\n\n打开NetCDF文件的另一种方法是使用NetCDF浏览器插件。选择**管理并安装插件...**菜单以打开插件管理器。转到**未安装**部分，并在搜索字段中输入`netcdf`以筛选可用插件列表。选择**NetCDF浏览器**插件并点击**安装插件**进行安装。关闭插件管理器。\n\
  \n该插件现已安装，您可以通过在**插件**菜单中选择**NetCDF浏览器**来打开它：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_456_0.png)\n\
  \n在上方字段中选择**NetCDF**文件。其他字段将更新为所选文件的内容。从可用图层中选择一个图层，然后点击**添加**将该图层添加到您的QGIS项目中。\n\
  \n## 保存矢量图层\n\nQGIS支持多种格式，不仅用于读取矢量图层，还可以保存它们。本教程向您展示如何导出矢量图层，并将其转换为不同格式。\n\n## 准备工作\n\
  \n在本教程中，您将使用名为`poi_names_wake.shp`的图层。确保它已加载到您的QGIS项目中。\n\n## 操作步骤...\n\n- 1. 在QGIS图层列表中右键单击点图层的名称，然后选择**另存为...**菜单。您将看到以下窗口：\n\
  \n![](img/2e88bf5938bf48a409c0a534a8775b21_457_0.png)\n\n\n\n\n\n## 数据输入与输出\n\n\
  - 2. 假设您希望使用此图层创建一个网络地图。Leaflet 或 OpenLayers 3 等库支持的一种流行格式是 GeoJSON 格式。在格式字段中选择\
  \ **GeoJSON**，并在 **另存为** 字段中键入路径和文件名。\n\n- 3. 在 **另存为** 对话框中，点击 **确定**。GeoJSON 文件将被创建。\n\
  \n## 工作原理...\n\nQGIS 用于读取和打开文件的 OGR 库也用于写入文件。并非所有支持读取的格式都支持写入。\n\n您可以将原本不是基于文件的图层导出到文件中，例如来自\
  \ PostGIS 数据库或 WFS 连接的图层。只需在目录中选中该图层，然后按照上述说明操作即可。\n\n## 更多信息...\n\n**另存为** 对话框允许进行比本食谱示例中展示的更多额外配置。\n\
  \n## 微调导出操作\n\n根据您选定的导出图层格式，有可供配置图层导出方式的不同选项。\n\n点击 **更多选项** 按钮即可显示这些选项。选择 **GeoJSON**\
  \ 作为导出格式，然后显示该特定格式的选项。**坐标精度** 选项控制写入输出 GeoJSON 文件中的小数位数。对于几乎所有情况，默认的精度都太高了，大多数时候，拥有三或四个小数位就足够了。将精度设置为\
  \ 4，键入有效的路径和文件名，然后点击 **确定** 导出图层。您的点图层现在将保存在一个较小的 GeoJSON 文件中。您可以使用文本编辑器打开该文件，以验证坐标是否以选定的精度表示，或者将其大小与未指定精度值时创建的文件进行比较。\n\
  \n## 创建后打开图层\n\n如果您希望在创建图层后对其进行操作，请勾选 **将保存的文件添加到地图** 复选框。输出图层将被打开并添加到您当前的 QGIS\
  \ 项目中。\n\n## 保存栅格图层\n\n栅格图层可以导出到不同的文件。导出过程可用于裁剪图层或执行重采样，从而创建修改后的图层。本食谱向您展示如何执行此操作。\n\
  \n## 准备工作\n\n在您的 QGIS 项目中打开 `elev_lid792_1m` 图层。\n\n## 操作步骤...\n\n- 1. 在 QGIS 目录中右键单击栅格图层的名称，然后选择\
  \ **另存为...** 菜单。您将看到如下窗口：\n- 2. 在 **分辨率** 字段中，将两个值都替换为 2。正如您在之前的食谱中所见，原始分辨率（单元格大小）为\
  \ 1。\n- 3. 在 **另存为** 字段中键入输出文件路径。\n- 4. 点击 **确定**。图层将以比原始分辨率更粗的分辨率保存。\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_459_0.png)\n\
  \n## 数据输入与输出\n\n## 工作原理...\n\n保存文件时使用的是 GDAL 库。并非所有支持输入格式都支持输出，但大多数常见格式都支持这两种操作。\n\
  \n## 更多信息...\n\n图层可以导出为范围缩减的版本。在 QGIS 画布中，缩放至栅格图层的一小部分。然后打开 **另存为** 对话框。在 **范围**\
  \ 部分，点击 **地图视图范围** 按钮。当前地图视图的边界坐标将被填入四个坐标字段中。\n\n键入保存文件的路径并点击 **确定**。将导出一个范围缩减的图层，仅覆盖地图视图中显示的区域。\n\
  \n## 重投影图层\n\n图层的坐标参考系统（CRS）可能并非最适合特定任务的 CRS。尽管 QGIS 在渲染时支持即时重投影，但其他任务，如执行空间分析，可能要求使用特定的\
  \ CRS 或要求所有输入图层使用相同的 CRS。本食谱向您展示如何重投影矢量图层。\n\n## 准备工作\n\n从示例数据集中打开名为 `Davis_DBO_centerline.shp`\
  \ 的图层。\n\n## 操作步骤...\n\n`Davis_DBO_centerline.shp` 图层使用以英尺为单位的 CRS，这使得它不适合某些操作。我们计划在未来的食谱中使用此图层来计算路线并工作在公制单位下，因此将其包含在公制\
  \ CRS 中是一个更好的选择：\n\n- 1. 在目录中右键单击图层名称，然后选择 **另存为...**\n- 2. 在下拉列表中选择 **所选 CRS**，以指定不同的输出\
  \ CRS。点击 **浏览** 按钮选择 CRS。您将看到 **CRS 选择器** 对话框。\n- 3. 您将把点转换到 **EPSG:26911** CRS。使用过滤框在可用\
  \ CRS 列表中查找并选择它。然后点击 **确定**。\n- 4. 在 *另存为* 对话框中点击 **确定** 以创建图层。将创建一个包含投影线的新 shapefile。\n\
  \n## 工作原理...\n\n重投影由 OGR 库在保存文件时执行，因为这是它支持的选项之一。\n\n## 更多信息...\n\n栅格图层可以以类似的方式重投影：\n\
  \n- 1. 在 *另存为* 对话框中，对于栅格图层，您可以找到一个带有 **浏览** 按钮的 CRS 字段。\n- 2. 点击它以打开 CRS 选择器，并选择目标\
  \ CRS。\n- 3. 当您点击 **确定** 时，栅格图层将使用选定的 CRS 而不是原始 CRS 导出。\n\n## 批量格式转换\n\n*另存为* 对话框可用于转换单个图层的格式。当需要转换多个图层时，使用一些自动化手段是更好的想法。本食谱向您展示如何轻松转换任意数量的图层。\n\
  \n## 准备工作\n\n无需之前的准备工作。批量转换不是基于打开的图层执行的，而是直接基于文件执行的，因此无需在转换之前在 QGIS 中打开图层。\n\n##\
  \ 操作步骤...\n\n- 1. 通过在 **处理** 菜单中选择 **工具箱** 来打开 **处理工具箱** 菜单。**处理工具箱** 菜单是 QGIS 处理框架的主要元素，用于调用其算法：\n\
  \n![](img/2e88bf5938bf48a409c0a534a8775b21_462_0.png)\n\n- 5. 在第一个字段中选择 **使用参数值填充**，在第二个字段中选择\
  \ **输入图层**。点击 **确定**。表格中的所有行现在都将具有一个输出值，该值是使用输入文件名作为前缀，后跟输入图层名称创建的。\n\n- 6. 为了避免在创建后加载图层，请将\
  \ **加载到 QGIS** 列中的第一个单元格设置为 **否**。然后，双击列标题以自动将此值复制到下方的所有行。\n\n- 7. 当表格已经完整时，您可以通过点击\
  \ **运行** 启动批量转换过程。GeoJSON 文件将在指定路径中创建。\n\n## 工作原理...\n\n转换由 QGIS 处理框架中的一个算法执行。处理算法可以作为单个算法运行，或者在本例中，作为批量过程运行。\n\
  \n处理算法的输出可以创建为 QGIS 支持的所有格式。格式通过使用文件名中相应的扩展名来选择，与保存单个图层的情况不同，无需在字段或列表中进行选择。使用 `.geojson`\
  \ 作为输出文件的扩展名，您告诉处理程序您希望生成此格式的文件。\n\n尽管该算法仅保存图层中选定的要素，但如果没有任何选择，它将使用图层的所有要素。这是处理中所有算法的默认行为。由于您所转换的图层中没有选择，因此其所有要素都将被使用。\n\
  \n以这种方式转换文件时，**另存为** 对话框中的附加选项不可用，并且使用默认配置值。\n\n## 更多信息...\n\n您还可以使用 **处理工具箱** 菜单中另一个更复杂的算法来转换矢量图层，该算法允许您输入由底层负责该过程的\
  \ OGR 库使用的配置参数。它被称为 **导出矢量**。在工具箱中找到它，右键单击并选择 **作为批量过程执行**：\n\n\n\n\n\n## 如何操作...\n\
  \n- 1. 在 **Processing Toolbox** 菜单的过滤框中，输入 `Reproject` 以过滤可用算法的列表。找到 **Reproject\
  \ layer** 算法，右键单击它并选择 **Execute as batch process**。将显示批处理界面，如下所示：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_466_0.png)\n\
  \n- 2. 在 **Input layer** 列的上方单元格中，单击 ... 按钮并选择 **Select from filesystem**。文件选择对话框将会出现。选择数据集中的\
  \ `davis` 文件夹的内容并将文件添加到表格中。\n\n- 3. 在 **Target CRS** 列的第一个单元格中，单击 ... 按钮。将会出现一个\
  \ CRS 选择器。选择 `EPSG:26911` CRS，就像你在之前将单个图层转换时的配方中所做的那样。通过双击列标题将该值复制到该列的其余行中。\n\n\
  - 4. 设置 **Reprojected layer** 列中的所有值。选择第一个单元格中的文件，然后使用 **Fill with parameter value**\
  \ 选项自动填充其余行。\n\n- 5. 表格完成后，单击 **Run** 以重新投影图层。\n\n## 其工作原理...\n\n重投影算法是 Processing\
  \ 框架的一部分，因此你可以通过更改输出文件扩展名来选择输出格式。你可以用此方法不仅重新投影一组输入图层，还可以在单一步骤中转换其格式。\n\n## 还有更多...\n\
  \n栅格图层也可以使用 **Processing Toolbox** 菜单中的另一个名为 **Warp (reproject)** 的算法进行重投影。这些输入与用于矢量图层的重投影工具中的输入相当相似，但有一些额外的特定于栅格图层的参数。选择该算法，右键单击它并选择\
  \ **Execute as batch process** 以运行它并转换一组栅格图层。\n\n## 将矢量图层加载到 SpatiaLite\n\n**SpatiaLite**\
  \ 是一个单文件关系数据库，建立在广为人知的 SQLite 数据库之上。它可以存储多种类型的图层，包括非空间表。对该格式的接口也允许运行各种空间查询。这是一种高度灵活且便携的格式，非常适合日常使用，尤其是在处理独立项目或一次只有一个用户时。SpatiaLite\
  \ 的工作方式与 PostGIS 相似，但无需配置或运行数据库服务器。\n\n## 准备工作\n\n选择一个矢量图层并在 QGIS 中加载它。此步骤是可选的，因为你可以在后面的对话框中从文件系统中选择源图层。\n\
  \n## 如何操作...\n\n- 1. 如果你还没有，请创建一个 SpatiaLite 数据库并将其命名为 `cookbook.db`。最简单的方法是使用 **Browser**\
  \ 选项卡，如以下屏幕截图所示：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_467_0.png)\n\n- 2.\
  \ 然后，选择以下方法之一导入你的数据。第一个选项更快，但第二个选项可以让你更好地控制导入设置：\n\n### 导入方法 1——快速方法\n\n- 1. 在 QGIS\
  \ Browser 选项卡中，找到你想要复制到数据库的图层。\n\n- 2. 将此图层拖放到 Spatialite DB 条目上。\n\n如果你列出了很多文件，这会相当困难，因为在拖动操作期间浏览器不会滚动。你可以\
  \ optionally 打开第二个浏览器窗口并跨窗口拖动图层。另外，请注意这默认为多类型几何。如果需要控制选项，请使用下一种方法。\n\n### 导入方法 2——标准方法\n\
  \n- 1. 从 Database 菜单打开 DB Manager。\n\n- 2. 展开 Spatialite 项目以列出你的数据库。展开你想要连接的数据库。\n\
  \n- 3. 单击以下导入图层图标：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_468_0.png)\n\n- 4.\
  \ 将弹出一个对话框，提供导入选项。\n\nSQL 数据库通常不区分大小写，因此你可以使用全小写字符。另外，永远不要在表名中使用空格或特殊字符；这只会导致以后出现麻烦。偶尔使用下划线是可以的。\n\
  \n- 5. 从下拉列表中选择要导入的图层。\n\n- 6. 为新表填写一个名称。\n\n- 7. 在大多数情况下，剩下的唯一要做的事情是选中 Create spatial\
  \ index 复选框。\n\n- 8. 如果这有效，很好。现在，你可以将图层加载到地图上并验证它是否与输入相同。\n\n这种方法更类似于传统的数据库导入，并且与本章后面\
  \ PostGIS 配方非常相似。\n\n## 其工作原理...\n\nQGIS 将你的几何图形转换为与 SpatiaLite 兼容的格式并插入它，同时插入属性表。之后，它会更新\
  \ SpatiaLite 中的元数据表以注册几何列并在其上构建空间索引。这两个后处理步骤使数据库表对 QGIS 来说表现为一个空间图层，并在平移和缩放时加快从表中加载数据的速度。\n\
  \n## 还有更多...\n\n导入对话框包含了一些通常有用的其他功能。你可以在导入过程中重新投影数据，如果你愿意的话，或者如果你 QGIS 未能正确检测到，你可以指定投影。你还可以将几何列命名为不同于默认的\
  \ geom 的名称；例如，utmZ10n8（这通常不推荐）。你可以在文本未正确处理的情况下指定文本的字符编码。\n\n你甚至可以使用该对话框将数据追加到现有表中；例如，你有多个具有相同数据结构的县，它们作为两个单独的文件出现，但你希望它们都在一个图层中。\n\
  \n如果由于某种原因图层没有按你想要的方式导入，请删除它并重新导入。如果删除图层，请务必学习如何真空数据库以恢复文件中现在空闲的空间并缩小其总大小（这不是自动的）。\n\
  \n![](img/2e88bf5938bf48a409c0a534a8775b21_469_0.png)\n\n> 在许多图形工具中查找 **Vacuum**\
  \ 选项作为按钮。如果看不到它也没关系，只需运行 SQL，`VACUUM;`。\n\n如果失败会怎样？数据库有时真的很挑剔。以下是一些常见问题和解决方案：\n\n\
  - 它可能是字符编码（重音符号，非拉丁语言），这需要你指定编码。\n- 它可能挑剔混合多图层和常规图层。多图层是指一个记录中包含多个独立几何图形。例如，夏威夷实际上是许多岛屿。因此，如果你只有一行代表夏威夷，你需要将所有岛屿多边形塞进一个几何字段中。然而，如果你将其与仅为多边形的北达科他州混合，导入将失败。如果你有这个问题，你需要使用命令行使用\
  \ `ogr2ogr` 并使用其较新的功能 `-nlt PROMOTE_TO_MULTI` 进行导入，该功能将所有单项转换为多项以修复此问题。\n- 根据你的原始来源，你可能有点的、线的和多边形的混合。你要么需要将其转换为几何集合，要么需要将每种类型的几何图形拆分为单独的图层。几何集合目前在许多\
  \ GIS 查看器中支持较差，因此这仅推荐给高级用户。\n\n## 另请参阅\n\n如果你需要更高级的设置或无法让 QGIS 工具工作，你可能需要使用 QspatialLite\
  \ 插件（使用 Plugins 菜单下的 Manage Python Plugins 安装此插件），spatialite-gui（从 https://www.gaia-gis.it/fossil/spatialite_gui/index\
  \ 下载此应用程序），或 ogr2ogr 命令行（此随 QGIS 一起提供，在 Windows 上是 OSGeo4w shell 的一部分，或 Mac 或 Linux\
  \ 上的终端）。\n\n## 将矢量图层加载到 PostGIS\n\nPostGIS 是流行的 PostgreSQL 数据库的空间扩展。它是一种服务器风格的数据库，具有身份验证、权限、模式和同时用户处理。当你想要存储大量矢量数据并高效查询它们时，尤其是在多计算机网络环境中，请考虑\
  \ PostGIS。这对于小数据也很好，但许多用户发现其配置工作太多，而 SpatiaLite 可能更合适。\n\n## 准备工作\n\n选择一个矢量图层并在\
  \ QGIS 中加载它。你还需要有一个正在运行的 Postgres/PostGIS 副本、一个创建的 PostGIS 数据库，以及允许创建表的帐户。\n\n>\
  \ BostonGIS 维护了一个关于 Windows 安装的体面教程，以及为每个人设置 PostGIS。你可以在 http://www.bostongis.com/?content_name=postgis_tut01#316\
  \ 找到它。\n\n你应该配置 QGIS 以了解你的数据库及其连接参数，通过在 PostGIS 加载对话框中创建新的数据库项，或通过在 Browser 选项卡中右键单击\
  \ PostGIS 并选择 New Connection 来完成：\n\n你可以在 http://docs.qgis.org/2.8/en/docs/user_manual/working_with_vector/supported_data.html#postgis-layers\
  \ 找到有关 PostGIS 的更多信息。\n\n## 如何操作...\n\n现在你已经可以连接到 PostGIS 数据库，你就可以尝试导入数据了：\n\n-\
  \ 1. 从 Database 菜单打开 DB Manager。\n- 2. 展开 PostGIS 项目以列出你的数据库。展开你想要连接的数据库，如果你没有在设置中保存密码，则会提示你进行身份验证。\n\
  - 3. 展开列表并选择 Public 模式。\n\n\n\n\n\n一般而言，除非你在执行高级操作并且了解 Postgres 模式（schema）的工作原理，否则请将图层放在\
  \ **public** 模式中。这是所有人都期望的默认设置。\n\n+   4. 点击以下导入图层图标：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_471_0.png)\n\
  \n+   5. 将弹出一个对话框，为你提供导入选项。\n\nSQL 数据库通常不区分大小写，因此你可以全部使用小写。此外，切勿在表名中使用空格或特殊字符；否则以后只会带来麻烦。偶尔使用下划线是可以的。\n\
  \n+   6. 从下拉列表中选择要导入的图层。\n+   7. 为新表填写一个名称。\n+   8. 检查 **schema** 是否设置为 **public**。\n\
  +   9. 在大多数情况下，剩下要做的唯一事情就是勾选 **创建空间索引** 复选框：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_471_1.png)\n\
  \n## 另请参阅\n\n有关 PostGIS 安装和设置的更多信息，请参阅 `http://postgis.net/install`。\n\n如需更深入地了解\
  \ PostGIS 的使用，有许多相关书籍可供参考，包括 Packt Publishing 出版的 *PostGIS Cookbook*。\n"
- "## 2\n数据管理\n\n在本章中，我们将介绍以下操作：\n\n+   - 连接图层数据\n+   - 清理属性表\n+   - 配置关系\n+   - 在数据库中连接表\n\
  +   - 在 SpatiaLite 中创建视图\n+   - 在 PostGIS 中创建视图\n+   - 创建空间索引\n+   - 栅格地理配准\n+ \
  \  - 矢量图层地理配准\n+   - 创建栅格概览（金字塔）\n+   - 构建虚拟栅格（目录）\n\n## 简介\n\n使用 QGIS 的原因之一是其众多功能，这些功能使你能够以可视化方式管理和分析空间数据。本章重点介绍用户为使数据可用于其他用途（如分析、制图或输入到其他程序）而需要执行的常见操作。\n\
  \n在本章中，你将找到管理矢量数据和栅格数据的操作方法。这些操作涵盖了处理来自文件和数据库源的数据。\n\n## 连接图层数据\n\n我们经常以不同格式获取数据，并且信息分散在多个文件中。因此，一项重要的技能是知道如何连接来自不同图层的属性数据。连接数据是一种基于共同值（如\
  \ ID 或类别）将多个表中的数据组合起来的方法。\n\n本练习演示如何使用 **图层属性** 中的连接功能将地理人口普查区数据连接到表格形式的人口数据，以及如何将结果保存到新文件。\n\
  \n### 准备工作\n\n要完成本练习，请使用 **添加矢量图层** 加载 `census_wake2000.shp`（你也可以将 shapefile 从文件浏览器拖放到\
  \ QGIS 中），并使用 **添加分隔文本图层** 加载 `census_wake2000_pop.csv` 人口数据。\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_476_0.png)\n\
  \n> 你也可以使用 **添加矢量图层** 加载 `.csv` 文本文件，但这会将所有数据加载为文本列，因为 `.csv` 文件没有附带用于指定数据类型的 `.csvt`\
  \ 文件。相反，**添加分隔文本图层** 工具会扫描数据并为每列确定最合适的数据类型。\n\n### 操作步骤...\n\n要连接两个图层，必须存在一个两个图层共同拥有的值/ID\
  \ 列。如果我们检查刚加载的两个图层的属性表，我们会发现两者都有 `STFID` 字段。因此，要将人口数据连接到人口普查区，请执行以下步骤：\n\n+   1.\
  \ 打开 `census_wake2000` 图层的 **图层属性** 选项（例如，双击 **图层** 列表中的图层名称）并转到 **连接**。\n+   2.\
  \ 要设置新的连接操作，请按对话框左下角的绿色 **+** 按钮。\n+   3. 以下截图显示了 **添加矢量连接** 对话框，你可以通过选择 **连接图层**（即要用于连接人口普查区的图层）以及包含共同值/ID\
  \ 的列（**连接字段** 和 **目标字段**）来配置连接：\n\n默认情况下，新列的名称由连接图层名称、下划线以及连接图层列名组成。例如，`census_wake2000_pop`\
  \ 的 `STATE` 列将变为 `census_wake2000_pop_STATE`。你可以通过启用 **自定义字段名前缀** 选项来更改此默认行为，如上面的截图所示。使用这些设置，`STATE`\
  \ 列将变为 `pop_STATE`，这明显更短，因此更容易处理。\n\n### 扩展...\n\n你现在创建的连接仅存在于内存中。原始文件均未被更改。但是，可以从已连接的图层创建新文件。为此，只需使用\
  \ **图层** 菜单或 **上下文** 菜单中的 **另存为...**。你可以选择多种数据格式，包括 ESRI shapefile、Mapinfo MIF 或\
  \ GML。\n\nShapefile 是一种非常常见的选择，因为它仍然是事实上的标准 GIS 数据交换格式，但如果你熟悉 GIS 数据格式，你会注意到连接列的名称对于\
  \ shapefile 格式的 10 个字符名称长度限制来说太长了。QGIS 确保导出的 shapefile 中的所有列在名称被缩短为仅 10 个字符后仍具有唯一名称。为此，QGIS\
  \ 会在原本重复的列名末尾添加递增数字。如果你将此示例中的连接保存为 shapefile，你会看到列名被修改为 `census_w_1`、`census_w_2`\
  \ 等。当然，这些名称对于继续处理数据来说并不理想。如本操作的 *工作原理...* 中所述，连接列的名称是连接图层名称和列名的组合。因此，如果我们想从连接结果创建\
  \ shapefile，可以使用以下技巧：我们可以缩短图层名称。只需在图层列表中重命名图层即可。你甚至可以使用完全空的图层名称！如果将连接图层名称更改为空字符串，连接列名称将变为\
  \ `_STATE`、`_COUNTY` 等，而不是 `census_wake2000_pop_STATE` 和 `census_wake2000_pop_COUNTY`。无论如何，记录数据并在元数据中提供属性表列的描述是一种良好的做法。\n\
  \n无论如何，你很可能希望清理新数据集的属性表，这正是我们将在下一个练习中要做的事情。\n\n## 清理属性表\n\n我们时常需要清理属性表的原因有很多。可能是因为我们从外部来源接收到结构不良或命名不佳的数据，也可能是因为数据处理（例如我们在上一个练习中执行的图层连接）需要一些后期处理。本操作向我们展示了如何使用属性表和\
  \ **Table Manager** 插件来重命名、删除和重新排序列，以及如何使用 **字段计算器** 在不同数据类型之间进行转换。\n\n### 准备工作\n\
  \n如果你已执行了上一个操作，请将连接后的图层保存为一个新的 shapefile；否则，加载 `census_wake2000_pop.shp`。无论如何，你会注意到数据集包含大量重复信息，并且列名也需要一些优化。要完成本操作，你还应通过导航到\
  \ **插件 | 管理并安装插件** 来安装并启用 **Table Manager** 插件。\n\n### 操作步骤...\n\n+   1. 清理此数据集的第一步是删除重复的信息。从所有可用列中，我们只想保留\
  \ `_STATE`、`_COUNTY`、`_TRACT`、`FIPSSTCO`、`TRT2000`、`STFID`、`_POP2000`、`AREA` 和 `PERIMETER`。\n\
  +   \n+   2. 要删除其他列，请使用属性表左上角的 **切换编辑模式** 按钮启用编辑，或按 *Ctrl + E*。这将激活 **删除列** 按钮。\n\
  +   \n+   3. 或者，你也可以按 *Ctrl + L* 打开 **删除属性** 对话框。此对话框允许你一次删除多列。只需选择所有要删除的列，按 **确定**，QGIS\
  \ 就会显示缩减后的属性表。\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_479_0.png)\n\n> 值得注意的是，只有当你使用\
  \ **保存编辑** 按钮或禁用编辑模式并确认要保存更改时，更改才会永久生效。\n\n+   4. 接下来，我们将重命名列，以删除某些列名中的前导下划线。这可以使用\
  \ **Table Manager** 插件完成。\n+   \n+   5. 当你启动该插件时（应禁用编辑模式），你将看到图层列的列表。该插件允许你更改列的顺序，以及重命名、插入、克隆和删除列。\n\
  +   \n+   6. 要重命名列，只需在列表中选择它并按 **重命名** 按钮。然后系统会要求你提供新名称。继续删除 `_STATE`、`_COUNTY`、`_TRACT`\
  \ 和 `_POP2000` 中的前导下划线。\n+   \n+   7. 最后，使用 **上移** 和 **下移** 按钮，你还可以将列顺序重新排列为更直观的顺序。我们建议将\
  \ `STFID` 移到第一位，并将 `AREA` 和 `PERIMETER` 移到最后。\n+   \n+   8. 如果按 **保存**，更改将保存回图层源文件。或者，你也可以使用\
  \ **另存为...** 创建新文件。\n\n\n\n\n## 配置关系\n\n在 *连接图层数据方法* 中，我们讨论了连接仅向现有要素追加额外列（1:1或n:1关系）。因此，使用连接无法建模1:n关系，例如“一个邮政编码区域包含n所学校”。这些类型的关系可以使用关系（relations）来建模。本方法介绍关系的概念，并展示如何使用它们。\n\
  \n### 准备工作\n\n要跟随本练习，请从 `zipcodes_wake.shp` 和 `schools_wake.shp` 加载邮政编码区域和学校。\n\n\
  ### 操作方法...\n\n关系在 **项目属性** 中配置。该对话框与连接对话框非常相似：\n\n1. 定义两个图层（**引用/子图层** 和 **被引用/父图层**），以及包含公共值/ID的字段。由于您想要建模“一个邮政编码区域包含n所学校”，邮政编码数据集是父图层，学校数据集是子图层。两个数据集之间的连接基于邮政编码字段（**ADDRZIPCOD**\
  \ 和 **ZIPNUM**）建立，如以下截图所示：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_481_0.png)\n\
  \n2. 要验证关系已设置并正常工作，您可以检查表单视图中的属性表（右下角的按钮），如以下截图所示，或打开单个要素表单。您会发现关系信息已追加到表单的末尾：\n\
  \n![](img/2e88bf5938bf48a409c0a534a8775b21_482_0.png)\n\n如上图所示，设置此关系使您能够非常方便地访问特定邮政编码内的所有学校。如编辑按钮所示，您甚至可以从此视图编辑学校数据。您可以直接在表视图中编辑值。您可以使用\
  \ + 和 X 按钮从数据集中添加和删除学校。接下来的两个按钮使您能够快速向关系添加新条目或从关系中移除它们。\n\n### 工作原理...\n\n在此示例中，从数据集中移除学校效果很好，但通过此对话框添加学校意义不大，因为您无法通过此过程创建点几何。\n\
  \n如果您按下按钮添加到关系，您将看到一个对话框，允许您选择要添加的现有学校。在后台，学校的 ADDRZIPCOD 值会更新为与我们刚分配的邮政编码匹配。\n\n\
  同样，如果您选择一所学校并按下按钮移除关系，实际发生的是该学校的 ADDRZIPCOD 值被设置为 NULL。\n\n## 在数据库中连接表\n\n如果您使用数据库（SpatiaLite\
  \ 或 PostGIS）存储数据（矢量和非空间），那么您还可以选择使用数据库和 SQL 来执行表连接。此方法的主要优点包括能够在加载到地图之前过滤数据、执行多表连接（三个或更多），以及通过查询完全控制连接的细节。\n\
  \n### 准备工作\n\n您需要在 SpatiaLite 或 PostGIS 数据库中至少有两个图层。这两个图层至少需要一个公共列，并且公共列在至少一个表中应包含唯一值。在本例中，我们使用\
  \ `census_wake_2000` 多边形图层和 `census_wake_2000_pop.csv`。\n\n### 操作方法...\n\n1. 打开\
  \ QGIS 自带的 **DB Manager** 插件。您可以在 **数据库** 菜单中找到它。\n2. 从左侧树中选择您的数据库，使用 **SpatiaLite**\
  \ 中的 `cookbook.db`（在 *第1章，数据输入与输出* 中创建）。\n3. 现在，打开 SQL 窗口（插件窗口顶部工具栏左起第二个图标）。\n4.\
  \ 输入以下 SQL 代码来查询和连接表：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_483_0.png)\n\n\
  ```sql\nSELECT *\nFROM census_wake2000 AS a\nJOIN census_wake2000_pop AS b\nON a.stfid\
  \ = b.stfid;\n```\n\n### 工作原理...\n\nSELECT 列出您想要从源表中获取的所有列；在本例中，* 表示所有内容。FROM 是第一个（左）表，a\
  \ 是别名，用于减少后续输入。JOIN 是第二个（右）表，ON 指示要在两个表之间匹配哪些列。关于关系数据库理论的其余内容，最好在其他书籍中解释。\n\n###\
  \ 更多内容...\n\n在数据库中，连接类型不止一种。您可以执行仅保留两个表中匹配项的内连接，或者保留左（第一个表）所有内容以及右表匹配项的外连接。您还可以控制一对多关系的汇总方式，或选择特定记录而不是聚合。\n\
  \n如果要保存查询结果，您有两个选项。您可以创建视图（view）或新表（table）。视图是您查询的已保存副本。每次打开它时，都会重新运行查询。如果您的数据发生变化，这非常有用，因为它始终是最新的，并且不占用额外的磁盘空间。另一方面，表类似于保存新文件；它是结果的静态新副本。这对于重复访问相同答案很有用，并且通常使用更快，尤其是对于大型表。\n\
  \n### 另请参阅\n\n- 参考本章的 *在 SpatiaLite 中创建视图* 和 *在 PostGIS 中创建视图* 部分，了解如何创建查询结果的视图。\n\
  - 有关编写 SQL 查询的更多通用信息，请参阅 http://sqlzoo.net/\n- 参考 *第1章，数据输入与输出,* 关于使用 `cookbook.db`\
  \ 数据库\n\n## 在 SpatiaLite 中创建视图\n\n在数据库中，视图是存储的查询。每次打开它时，查询都会运行并生成新结果。要将视图用作 QGIS\
  \ 中的图层，需要几个步骤。\n\n### 准备工作\n\n对于本方法，您需要一个返回包含几何结果的查询。我们将使用的示例是来自 *在数据库中连接表* 方法（上一个方法）的查询，其中普查多边形与人口\
  \ CSV 之间进行了1:1属性连接。建议使用 QSpatiaLite 插件来完成本方法。\n\n### 操作方法...\n\nGUI 方法如下：\n\n1.\
  \ 使用 **QspatialLite** 插件（如果您已激活它，它位于 **数据库** 菜单中）输入以下查询：\n\n```sql\nSELECT *\nFROM\
  \ census_wake2000 as a\nJOIN census_wake2000_pop as b\nON a.stfid = b.stfid;\n```\n\
  \n2. 从 Option 下拉菜单中选择最后一项 Create Spatial View & Load in QGIS，并将 Geometry field 框的值设置为空间图层中的几何字段名称。在此示例中，这是\
  \ geom。\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_485_0.png)\n\n> 您可以在左侧浏览数据表字段，以检查所需字段的名称。\n\
  \nSQL 方法如下：\n\n1. 在 数据库 | DB Manager 中，打开 SQL 窗口。\n2. 编写查询。在本例中，这是上一个方法中的连接查询。\n\
  3. 通过添加 CREATE VIEW <名称> as SELECT 将此查询转换为视图：\n\n```sql\nCREATE VIEW census_wake2000_pop_join\
  \ AS\nSELECT *\nFROM census_wake2000 as a\nJOIN census_wake2000_pop as b\nON a.stfid\
  \ = b.stfid;\n```\n\n4. 使用后续查询在 SpatiaLite 元数据后端注册视图。此函数区分大小写：\n\n```sql\nINSERT\
  \ INTO views_geometry_columns\n(view_name, view_geometry, view_rowid, f_table_name,\n\
  f_geometry_column,read_only)\nVALUES ('census_wake2000_pop_join', 'geom', 'rowid',\n\
  'census_wake2000', 'geom',1);\n```\n\n5. 模式是（'视图名称'，'视图几何字段名称'，'唯一ID'，'视图获取几何的原始表名称'，'原始表中的几何字段名称'，'只读(1)或可写(0)'）。\n\
  \n6. 运行第二个查询后，您应该能够在 QGIS 中加载该视图，并看到与连接查询相同的字段。\n\n### 工作原理...\n\n视图实际上存储在数据库中，并在您加载时被触发。这样，如果您更改原始数据表，视图将始终是最新的。相比之下，创建新表会复制现有数据，存储在新位置，或创建该时刻值的快照或冻结。它还会通过复制数据来增大数据库的大小。而视图只是\
  \ SQL 文本本身，不存储任何额外数据。\n\nQGIS 读取 SpatiaLite 的元数据表，以确定哪些图层包含空间数据、它们包含哪种空间数据，以及哪一列包含几何定义。如果不在元数据中创建条目，表将显示为普通\
  \ SQLite 表，您只能加载没有空间表示的属性数据。\n\n由于它是视图，实际上是从原始表读取几何。因此，对原始表的任何编辑都会显示出来。SpatiaLite\
  \ 4.x 系列中的新功能使创建可写视图更加容易。如果您使用 spatialite-gui 独立应用程序，它会注册所有必要的数据库触发器以使其工作，所做的更改将影响原始表。\n\
  \n\n\n\n## 数据管理\n\n- 3. 现在，通过点击 **执行 (F5)** 按钮来执行查询：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_488_0.png)\n\
  \n- 4. 执行查询后，若要将其加载到地图中，请勾选 **作为新图层加载** 复选框，这将展开一些额外的选项。在 **包含唯一整数值列** 中选择一个唯一的整数\
  \ (id_0)，并在 **几何列** 中选择一个 geom。在 **图层名称 (前缀)** 文本框中命名你的结果，然后点击 **立即加载！**\n\n> 如果你只需要在这个特定的\
  \ QGIS 项目中查看这些数据，你可以在此处停止。为了让数据库为其他项目和用户存储此查询，请继续执行此食谱。\n\n- 5. 通过添加 `CREATE VIEW\
  \ <name> AS SELECT:` 将此查询转换为视图：\n\n```sql\nCREATE VIEW census_wake2000_pop_join\
  \ AS SELECT *\nFROM census_wake2000 as a\nJOIN census_wake2000_pop as b\nON a.stfid\
  \ = b.\"STFID\";\n```\n\n- 6. 返回 **数据库管理器**，点击 **刷新** 按钮（在左侧）。此时你应该能看到新的视图被列出，并且可以将其添加到地图中。\n\
  \n## 工作原理...\n\nQGIS 通过读取 PostGIS 的元数据表或视图来确定哪些图层包含空间数据、它们包含何种类型的空间数据，以及哪一列包含几何定义。如果不创建元数据条目，表格将显示为普通的\
  \ PostgreSQL 表，你只能加载属性数据而无法显示空间表示。\n\n由于这是一个视图，它实际上是从原始表中读取几何图形。因此，对原始表的任何编辑都会显示出来。\n\
  \n## 更多知识...\n\nQGIS 对于 PostGIS 表和视图拥有唯一 ID 的要求非常严格。有几个技巧可以确保其始终有效工作。始终包含一个数字型唯一\
  \ ID（推荐作为第一列，但不是必须的，ID 必须是整数列，通常是 int4，但现在 int8 也应该有效）。自增 ID 是个好主意。当你没有一个来自底层表的\
  \ ID 字段可供使用时，你可以使用以下方法即时添加一个 ID：\n\n```\nSELECT row_number() OVER() AS id_qgis,\
  \ <在此添加你想要使用的其他字段> FROM table;\n```\n\n缺点是，你现在必须列出想要在视图中使用的所有字段，而不是使用 *。在创建表时，如果你计划添加记录，最好将这个\
  \ id_qgis 字段转换为自增字段。\n\n另一个主要的陷阱是，如果你通过操纵现有几何图形来创建新的几何图形，QGIS 并不总能意识到结果。在之前的示例中，几何图形从原始表到视图保持不变地传递，因此它在\
  \ PostGIS 的 geometry_columns 元数据中正确注册。然而，新几何图形不存在于原始表中，所以技巧是对几何图形结果进行类型转换，如下所示：\n\
  \n```\nCREATE VIEW census_wake2000_4326 AS\nSELECT id_0,\nstfid,tractid,ST_Transform(geom,4326)::geometry(GeometryZ,\
  \ 4326)\nAS geom\nFROM census_wake2000;\n```\n\nQGIS 并不总是认为这是一个有效的空间图层，但将其添加到画布应该可以正常工作。\n\
  \n![](img/2e88bf5938bf48a409c0a534a8775b21_489_0.png)\n\n> 你指定的越具体越好。如果你不确定是什么类型的几何图形，或者是否有\
  \ 3D（即 Z），请检查 `geometry_columns` 视图中的条目。\n\n此外，请密切关注 Postgres 的一项相对较新的特性，称为物化视图。这是一种缓存视图结果的方法，这些结果不会自动更新，但它们也不需要全新的表。\n\
  \n## 参见\n\n- 关于 PostGIS 手册的更多细节可以在 http://postgis.refractions.net/docs/using_postgis_dbmanagement.html#Manual_Register_Spatial_Column\
  \ 阅读。此食谱与之前的一个极其相似，并展示了如果你了解细微差异，这两个是多么可以互换。\n- 有关 *物化视图* 的更多信息，请参阅 http://www.postgresql.org/docs/9.3/static/rules-materializedviews.html\n\
  \n## 创建空间索引\n\n空间索引是加速几何图形查询的方法。这包括加速 QGIS 中数据库图层的显示当你放大查看时（它对于查看整个图层没有影响）。\n\n\
  此食谱适用于 SpatiaLite 和 PostGIS 数据库。如果你创建了一个新表，或者导入了某些数据而没有创建空间索引，通常是一个好主意来添加它。\n\n\
  > 你也可以为 shapefile 图层创建空间索引。查看 **图层属性 | 常规** 中的 **创建空间索引** 按钮。这将创建一个 .qix 文件，可与 QGIS、Mapserver、GDAL/OGR\
  \ 和其他开源应用程序配合使用。参考 https://en.wikipedia.org/wiki/Shapefile。\n\n## 准备工作\n\n你需要一个\
  \ SpatiaLite 和一个 Postgis 数据库。为了方便，从提供的示例数据中导入矢量图层，并在导入时不选择 **创建空间索引** 选项。（不确定如何导入数据？请参阅\
  \ *第 1 章，数据输入和输出*，了解如何操作。）\n\n## 具体步骤...\n\n使用 **数据库管理器** 插件（在 **数据库** 菜单中），执行以下步骤：\n\
  \n- 1. 检查索引是否存在。在 **数据库管理器** 中，打开数据库，然后打开你要检查的表。查看右侧的属性，你应该会在 **字段** 上方看到一条消息，如下所示：\n\
  \n⚠ 未定义空间索引（创建它）\n\n## 数据管理\n\n当运行涉及位置的查询时，会对框进行比较，这是一种简单的数学比较。然后，选择与相关区域匹配的框所在的行，以便基于其真实几何图形进行深入测试以进行精确匹配。这种查找交集的方法比逐个测试复杂几何图形更快，因为它可以迅速排除明显不在感兴趣区域附近的项。\n\
  \n## 更多知识...\n\n空间索引对于加速 QGIS 中数据库空间图层的加载时间非常重要。它们在空间查询（如 intersects）的速度中也起着关键作用。注意，如果存在空间索引，PostGIS\
  \ 会自动使用它。SpatiaLite 需要你编写查询以有意调用特定的空间索引（请参考《SpatiaLite 烹饪书》中的 Haute Cuisine 示例）。\n\
  \n此外，请记住，单个查询中只能使用每表的一个空间索引。如果你碰巧有超过一个空间列，或者在不同于几何图形的投影中创建空间索引，这一点将真正发挥作用（参阅 Packt\
  \ Publishing 出版的《PostGIS 烹饪书》以获取更多信息）。\n\n> 如果你计划向具有现有空间索引的表中插入大量记录，你可能希望在导入完成后禁用或删除该索引并重新创建它。否则，索引将在每次插入行后重新计算。这也适用于非空间索引。\n\
  \n你想一次检查很多表吗？你可以一次性列出 PostGIS 中的所有 GIST 索引：\n\n```\nSELECT i.relname as indexname,\
  \ idx.indrelid::regclass as\n    tablename,\n    am.amname as typename,\nARRAY(SELECT\
  \ pg_get_indexdef(idx.indexrelid, k + 1, true)\n    FROM generate_subscripts(idx.indkey,\
  \ 1) as k\n    ORDER BY k\n    ) as indkey_names\nFROM pg_index as idx\nJOIN pg_class\
  \ as i  ON  i.oid = idx.indexrelid\nJOIN pg_am as am  ON  i.relam = am.oid\nJOIN\
  \ pg_namespace as ns  ON  ns.oid = i.relnamespace\nAND ns.nspname = ANY(current_schemas(false))\n\
  Where am.amname Like 'gist';\n```\n\n要在 SpatiaLite 中做类似的事情，请使用以下方法：\n\n```\nSELECT\
  \ * FROM geometry_columns WHERE spatial_index_enabled = 1;\n```\n\n## 参见\n\n- 关于\
  \ SpatiaLite 空间索引实现的信息可以在 https://www.gaia-gis.it/fossil/libspatialite/wiki?name=SpatialIndex\
  \ 找到\n- 有关使用空间索引的更多细节可以在 https://www.gaia-gis.it/fossil/libspatialite/wiki?name=SpatialIndex\
  \ 找到\n- 关于 PostGIS 实现的信息位于 http://postgis.net/docs/manual-2.0/using_postgis_dbmanagement.html#gist_indexes\n\
  - 你还可以查看 Packt Publishing 出版的 PostGIS 烹饪书的第 10 章“维护、优化和性能调优”。\n\n## 栅格地理参考\n\n有时，你有一张纸质地图、一张来自互联网的地图图像，甚至是一个包含投影数据的栅格文件。在处理这些类型的数据时，你需要做的第一件事是将它们参考到现有的空间数据，以便它们能与你的其他数据和\
  \ GIS 工具一起工作。此食谱将引导你完成参考你的栅格（图像）数据的过程，称为地理参考。\n\n## 准备工作\n\n你需要一个缺乏空间参考信息的栅格；也就是说，根据\
  \ QGIS，其投影未知。你还需要一个已知且可用于参考点的第二图层（参考地图）。例外情况是，如果你有一张标记了坐标的纸质地图，或者一个没有附带参考文件但你恰好知道其\
  \ CRS/SRS 定义的空间数据集。在 QGIS 中加载你的参考地图。\n\n本书的数据包括一张扫描的美国地质调查局（USGS）地形图，该图缺少其 o38121e7.tif\
  \ 投影信息。此地图来自加利福尼亚州戴维斯市，因此示例数据中有许多其他可能的参考图层你可以使用，例如，街道是一个很好的选择。\n\n> 实际上，世界文件只是被重命名为\
  \ o38121e7.tfw.orig，以便 QGIS 不会检测到它。你可以稍后使用它来比较你的地理参考质量。\n\n\n\n\n## 操作方法...\n\n\
  在栅格菜单中，打开地理配准工具，并执行以下步骤：\n\n1. 使用文件对话框在地理配准工具中打开你的未知地图。\n2. 在你的起始坐标和结束坐标之间创建一个地面控制点（GCP）匹配。\n\
  3. 使用 GCP 添加（+）按钮在你的未知地图上添加一个点。现在你可以输入坐标（即，如果这是一张标有已知坐标的纸质地图），或者你可以从主 QGIS 窗口的参考图层中选择一个匹配点。\n\
  4. 重复此过程以找到至少四个匹配点。如果你想获得很好的拟合效果，请建立 10 到 20 个匹配点。\n5. （可选）将你的 GCP 保存为文本文件，以便日后参考和故障排除：\n\
  \n> 建筑物的角落、街道交叉口，以及线状要素相交处或主要边缘特征所在的位置。\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_494_0.png)\n\
  \n> 尽量分散你的控制点，以确保对整张地图有良好的覆盖范围。关键在于对差异进行平均化。\n\n6. 现在，选择**变换设置**，如下所示：\n7. 这里有一个选择。通常，你希望使用二次多项式（Polynomial\
  \ 2）。如果你为一阶设置了 4 个以上的点，为二阶设置了 6 个以上的点，为三阶设置了 10 个以上的点，那么二阶是目前推荐的。这将在本食谱的*更多内容...*部分中讨论。\n\
  8. 将**目标 SRS** 设置为与参考图层相同的投影（在这种情况下，这是**EPSG:26910 UTM Zone 10N**）。\n9. **输出栅格**\
  \ 应使用与原始文件不同的名称，以便你 easily 识别它。\n\n> 将你的 GCP 列表保存到文件。如果你对结果不满意，请回来尝试不同的算法或更改使用的\
  \ GCP 数量。如果你需要参考进行比较，请查看本书数据文件夹中的文本文件 `o381216.tif.points`。\n\n10. 当你满意你的 GCP 列表时，点击**文件**中的**开始地理配准**，或点击绿色三角形按钮。\n\
  \n## 工作原理...\n\n基于你两组点之间的差异创建一个数学函数。然后，该函数应用于整个图像，通过拉伸来尝试使其贴合。这基本上是从一个坐标系到另一个坐标系的转换或投影。\n\
  \n## 更多内容...\n\n选择变换类型可能有点棘手；QGIS 中的列表目前是按字母顺序排列的，而不是推荐顺序。二次多项式（Polynomial 2）和薄板样条（Thin-plate-spline,\
  \ TPS）可能是两种最常见的选择。当只有轻微的平移、缩放（比例）和旋转时，一次多项式（Polynomial 1）非常好。当你在一致的投影中拥有古老的、制作精良的地图时，这将应用最少的变化。二次多项式从这里开始处理一致的失真。这两种方法都会提供误差估计，即残差或\
  \ **RMSE（均方根误差）**。TPS 处理可变失真，围绕每个控制点改变其校正。这几乎总是会产生最佳拟合，至少通过你提供的 GCP 来看。然而，由于它在每个\
  \ GCP 位置都变化，因此无法计算误差估计，并且实际上可能会过度拟合（产生新的失真）。TPS 最适合手绘地图、非平面扫描地图或具有可变失真的其他来源。多项式方法适用于具有高准确度和参考标记的来源。\n\
  \n### 数据管理\n\n如果你真的想要一个好的匹配，一旦你拥有了所有的点，请检查表格底部的 RMSE 值。通常，你希望这个值接近或小于 1。如果有一个点的值很大，请考虑删除或重新执行它。你可以移动现有的点，并且会沿估计误差的方向画一条线。所以，回到高值，放大得非常近，并使用\
  \ GCP 移动选项。\n\n有时，仅仅改变你的变换类型会有帮助，如下面比较同一组 GCP 的一次多项式和二次多项式的截图所示：\n\n| 开/关 | id |\
  \ srcX | srcY | dstX | dstY | dX[像素] | dY[像素] | 残差[像素] |\n|---|---:|---:|---:|---:|---:|---:|---:|---:|\n\
  | ✓ | 0 | -162100.01 | 68464.42 | 599000.00 | 4275000.00 | -1.27 | 1.65 | 2.08 |\n\
  | ✓ | 1 | -161099.60 | 68430.25 | 600000.00 | 4275000.00 | -2.41 | 0.22 | 2.42 |\n\
  | ✓ | 2 | -154113.88 | 68203.95 | 607000.00 | 4275000.00 | 0.76 | -1.33 | 1.53 |\n\
  | ✓ | 3 | -161493.07 | 56413.39 | 600000.00 | 4263000.00 | 1.82 | -1.25 | 2.20 |\n\
  | ✓ | 4 | -153496.71 | 56161.93 | 608000.00 | 4263000.00 | -2.87 | 1.67 | 3.32 |\n\
  | ✓ | 5 | -159301.27 | 62357.43 | 602000.00 | 4269000.00 | 1.16 | -0.79 | 1.40 |\n\
  | ✓ | 6 | -156178.82 | 66267.28 | 605000.00 | 4273000.00 | 2.81 | -0.16 | 2.81 |\n\
  \n一次多项式\n\n注意切换到二次多项式时残差值的变化（假设你拥有使用二次多项式所需的最少点数）：\n\n| 开/关 | id | srcX | srcY |\
  \ dstX | dstY | dX[像素] | dY[像素] | 残差[像素] |\n|---|---:|---:|---:|---:|---:|---:|---:|---:|\n\
  | ✓ | 0 | -162100.01 | 68464.42 | 599000.00 | 4275000.00 | 0.79 | 0.36 | 0.87 |\n\
  | ✓ | 1 | -161099.60 | 68430.25 | 600000.00 | 4275000.00 | -0.96 | -0.43 | 1.05\
  \ |\n| ✓ | 2 | -154113.88 | 68203.95 | 607000.00 | 4275000.00 | -0.58 | -0.26 |\
  \ 0.63 |\n| ✓ | 3 | -161493.07 | 56413.39 | 600000.00 | 4263000.00 | 0.19 | 0.09\
  \ | 0.21 |\n| ✓ | 4 | -153496.71 | 56161.93 | 608000.00 | 4263000.00 | -0.05 | -0.02\
  \ | 0.05 |\n| ✓ | 5 | -159301.27 | 62357.43 | 602000.00 | 4269000.00 | -0.74 | -0.33\
  \ | 0.81 |\n| ✓ | 6 | -156178.82 | 66267.28 | 605000.00 | 4273000.00 | 1.34 | 0.60\
  \ | 1.46 |\n\n二次多项式\n\n> 重采样方法也会严重影响输出外观。一些方法更激进地尝试平滑失真。如果你不确定，请坚持使用默认的最近邻法。这会将原始最近像素的值复制到输出中的新方形像素中。\n\
  \n## 另请参阅\n\n- 在需要非常准确地理配准的设置中（如科学和测量），你应该阅读不同的变换以及适合你数据类型的良好 RMSE 值。请查阅一般的 GIS\
  \ 或遥感教科书以获取更多详细信息。\n- 有关 QGIS 地理配准器所有功能的详细信息，请参考在线手册 [http://docs.qgis.org/2.8/en/docs/user_manual/plugins/plugins_georeferencer.html](http://docs.qgis.org/2.8/en/docs/user_manual/plugins/plugins_georeferencer.html)。\n\
  - QGIS 文档包含一些关于如何选择变换类型的基本信息，位于 [http://docs.qgis.org/2.8/en/docs/user_manual/plugins/plugins_georeferencer.html#available-transformation-algorithms](http://docs.qgis.org/2.8/en/docs/user_manual/plugins/plugins_georeferencer.html#available-transformation-algorithms)。\n\
  \n## 矢量的地理配准\n\n由于各种原因，有时你会有一个缺乏投影信息的矢量图层。这在仅以局部坐标创建的 CAD 图层中很常见。在可能的时候，请尝试追溯原始的投影信息。作为最后的手段，你可以尝试使用这里描述的食谱将矢量图层扭曲以匹配已知的参考图层。\n\
  \n### 准备工作\n\n你可以打开两个 QGIS 实例（或者使用一个，因为你会经常来回缩放）。在一个实例中，加载一个参考图层，该图层的投影是你希望你的数据所在的投影。从**插件管理**菜单中激活**坐标捕获插件**。\n\
  \n![](img/2e88bf5938bf48a409c0a534a8775b21_497_0.png)\n\n此示例使用 `cad-lines-only.shp`，这是从\
  \ `CSS-SITE-CIV.dxf` 文件中提取的线图层。该文件是位于北卡罗来纳州韦克县凯里市学院街（Academy St.）设计方案的 CAD 渲染图。\n\
  \n### 操作方法...\n\n1. 在你的未知图层（`cad-lines-only.shp`）和参考图层（`CarystreetsND83NC.shp`）之间创建一组\
  \ GCP 匹配列表。\n\n2. 以下是一些具体的调整，以帮助将 `cad-lines-only.shp` 参照到 `CarystreetsND83NC.shp`。这将更容易在两个图层之间找到匹配点：\n\
  \n   1. 加载 `cad-lines-only.shp`，并使用基于规则的风格调整其样式属性。使用“图层”= 'C-ROAD-CNTR' 规则，这将只显示街道中心线。\n\
  \   2. 在你的另一个 QGIS 会话中，加载 `CarystreetsND83NC.shp` 以查找匹配区域，打开属性表，并应用以下选择表达式：\"Street\"\
  \ LIKE '%N ACADEMY%' OR \"Street\" LIKE '%S ACADEMY%' OR \"Street\" LIKE '%CHATHAM%'。这里的筛选器突出显示了原始项目的三条主要街道，这些街道位于镇中心\
  \ Chatham 和 N/S Academy 街道的交叉口。这可能也有助于更改选中要素的颜色，以便更容易找到。项目两端的交通环岛是很好的地标：\n\n   ![](img/2e88bf5938bf48a409c0a534a8775b21_498_0.png)\n\
  \n3. 寻找一个易于识别且在两个图层中都匹配的特征（街道交叉口）。\n\n\n\n\n\n+   4. 使用坐标捕获插件复制两层中该点的 x,y 值。\n+\
  \   5. 在工作时将坐标保存到文本编辑器中。\n+   6. 重复此过程，直到你至少有四对点。尽量选择分布在整个图层上的点：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_499_0.png)\n\
  \n> 目前 QGIS 中没有用于下一步的图形界面，该步骤使用随 QGIS 提供的 OGR 库。获取点列表后，使用 ogr2ogr 命令行，你将把 GCP 应用到未知图层。\n\
  \n+   3. 每组坐标对将如下所示：\n+   \n+      `-gcp sourceX sourceY destinationX destinationY`\n\
  \n+   4. 打开终端（Mac 或 Linux）或 OSGeo4w shell（Windows）。\n\n5. 切换到存放数据的目录（提示：cd /home/user/Qgis2Cookbook/）：\n\
  \n```\nogr2ogr -a_srs EPSG:3358 -gcp 2064886.09740 741552.90836 629378.595 226024.853\
  \ -gcp 2066610.97021 741674.39817 629903.420 226064.049 -gcp 2064904.46214 743055.63847\
  \ 629384.784 226485.725 -gcp 2062863.85707 741337.65243 628762.587 225960.900 cad_lines_nd83nc.shp\
  \ cad-lines-only.shp\n```\n\n-a_srs 是参考图层的投影代码。\n\n命令模式为 ogr2ogr <options> <destination>\
  \ <source>。\n\n> 其他有用的高级选项包括 -order <n> 来指示多项式级别（默认为基于 GCP 数量）或 -tps 使用 Thin-plate-spline\
  \ 而不是多项式。更多选项请参考 http://www.gdal.org/ogr2ogr.html。\n\n6. 现在，在同一个项目中加载你的新 cad_lines_nd83nc.shp\
  \ 文件，作为 CarystreetsND83NC.shp。它们应该在无需启用投影即时重投影的情况下对齐：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_500_0.png)\n\
  \n## How it works...\n\n给定输入坐标列表和匹配的输出坐标，将推导出一个在两组之间转换的数学公式。然后该公式应用于原始数据中的所有点。其结果是将数据集从未知投影重投影到已知投影。\n\
  \n> 原始数据实际上是 EPSG:102719，但我们假装我们没有这条信息以演示此示例。\n\n## There's more...\n\n选择参考图层时，尽量选择你希望用于地图和分析的投影中的图层。这样你只需重投影一次，因为每次额外的转换都可能增加误差。完成此任务的方法不止一种，包括手动移动数据。\n\
  \n在此特定示例中，转换是根据 GCP 点对的数量自动选择的。4-5 个为一次多项式，6-9 个为二次多项式，10+ 个为三次多项式。请参考本章之前的配方了解更多信息。\n\
  \n一个相关主题是 *Affine transformations*，当你只是想按已知量平移或旋转矢量图层时。QgsAffine 插件很棒，如果你已经知道参数，或大致知道想要旋转和移动矢量图层的距离，因为它只需要一些数学运算即可获得参数。\n\
  \n> 也许等你读到这里时，这里所有的困难事情都将在插件中实现。保持关注，并尝试实验性插件 Vector Bender、vectorgeoref 和 Affine\
  \ Transformations。\n\n## See also\n\n+   - 此方法与 *Georeferencing Rasters* 配方非常相似，许多相同的提示也适用于两者。\n\
  +   - 如果你想了解我们最初是如何将 CAD 文件导入为 SHP 的，请查看 *Chapter 1, Data Input and Output* 中的 *Importing\
  \ DXF/DWG files*\n+   - 请参阅 *Chapter 10, Cartography Tips* 中的 *Using Rule Based\
  \ Rendering* 配方，了解如何通过应用基于属性的规则过滤更好地可视化生成的 CAD 导入的提示\n\n+   ▸ 太懒得做数学了？你也可以直接使用 GvSig\
  \ 来做数学并制作世界文件；请参考 http://foss4gis.blogspot.com/2011/05/computing-and-applying-affine.html\n\
  +   ▸ 如果你想自己做数学运算，请参阅 http://press.underdiverwaterman.com/rotating-a-point-grid-in-qgis/\n\
  \n## Creating raster overviews (pyramids)\n\n概览或金字塔以及重采样都是关于在地图画布中缩放和平移时使栅格图层加载更快，通过在未完全缩放时减少加载的数据量。\n\
  \n## Getting ready\n\n你需要一个大的栅格图像。\n\n> 通常，你希望复制数据，因为如果选择创建“内部”金字塔，此方法可能会更改原始文件（很容易意外发生）。\n\
  \n## How to do it...\n\n+   1. 在 QGIS 中加载你的栅格。elev_lid792_1m.tif 对于此示例效果很好。\n+ \
  \  2. 右键单击图层名称并打开属性。\n+   3. 在左侧转到金字塔项：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_503_0.png)\n\
  \n+   4. 选择你想要创建金字塔的图像尺寸：\n+      - 可选，选择是否存储在外部（更安全）或内部（文件更少）。\n+      - 可选，选择重采样算法；**Nearest\
  \ Neighbor** 最简单，但其他方法可能看起来更平滑，但代价是更多的数据处理和计算时间。\n+   5. 单击 **Build pyramids**。\n\
  +   6. 完成后，你会注意到你选择的尺寸上的红色 X 现在显示为金字塔。\n\n## How it works...\n\n生成金字塔本质上是为不同缩放级别制作原始数据的副本。随着你缩小缩放，原始数据会被重采样以适应屏幕大小。金字塔做同样的事情，但它们让你决定使用什么重采样方法并提前生成此概览。通过提前生成，QGIS\
  \ 在更改缩放级别时可以更快地加载图像。\n\n## There's more...\n\n重采样是说在每个缩放级别上，现在的 1 个像素来自原始数据的多个像素，因此它们需要以某种方式平均并将结果分配给现在可用的\
  \ 1 个像素。每种不同的方法都使用不同的数学公式来决定新值以及如何用相邻像素平滑该值（使其在视觉上令人愉悦）。这与你缩小图片以便通过电子邮件发送给朋友的概念相同。\n\
  \n如果你选择外部保存，你的概览存储在 `elev_lid792_lm.tif.ovr` 中。一些其他程序将相同的内容存储在 `.aux` 文件中；然而，金字塔格式在\
  \ GIS 应用程序之间并不通用。\n\n## See also\n\n+   - 这与使用 GDAL `gdaladdo` 命令的效果相同；请参考 `http://gdal.org/gdaladdo.html`\n\
  +   - 可以在 `https://docs.qgis.org/2.8/en/docs/user_manual/working_with_raster/raster_properties.html`\
  \ 找到 QGIS 文档中的更多详细信息\n\n## Building virtual rasters (catalogs)\n\n当你有很多栅格（而不是一个大栅格）并且它们都是同一数据集的一部分（通常彼此相邻），你不想单独加载每个文件然后对其进行样式设置。加载一个文件并将其视为一个图层要容易得多。此配方让你在不实际创建单个庞大栅格的情况下做到这一点，这可能难以处理。\n\
  \n## Getting ready\n\n你需要两个或更多具有相邻范围或仅在边缘部分重叠并且使用相同投影的栅格文件。理想情况下，文件应为相同类型，例如全部为高程、全部为空中照片等。对于此配方，OSGeo\
  \ EDU（北卡罗来纳州）数据集中的高程栅格将适用。\n\n## How to do it...\n\n+   1. （可选）将高程栅格加载到当前地图中。\n\
  +   2. 转到 **Raster Menu | Miscellanous | Build Virtual Raster (Catalog)**。\n+  \
  \ 3. 勾选 **Use visible raster layers** 复选框或选择 **SELECT**，浏览到示例数据并选择全部四个。\n\n+   4.\
  \ **SELECT** 并使用 `.vrt` 扩展命名输出文件。\n\n+   5. （可选）如果想立即查看结果，请勾选 **Load into canvas\
  \ when finished** 复选框：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_505_0.png)\n\n\
  > GDAL 命令行等效：<command> <output.vrt>\n> <list of inputs... space between each...>\n\
  > 例如，gdalbuildvrt elevlid.vrt elevlid_D782_6.tif elevlid_D783_6m.tif elevlid_D792_6m.tif\
  \ elevlid_D793_6m.tif。\n\n## How it works...\n\nGDAL VRT 格式是一个 XML 文件，定义了每个栅格文件相对于锚定文件的位置。它使用栅格的现有空间范围信息来确定它们彼此之间的位置，然后将该集合锚定在给定的坐标系统中。\n\
  \n\n\n\n\n## 更多内容...\n\n使用虚拟栅格（VRT）旨在节省时间。当您为某个特定数据集拥有数百个栅格文件时，可以将它们合并为一个文件。然而，这个文件可能过于庞大，以至于几乎无法处理。这是一种快速将这些文件用作无缝背景图层的方法。如果您需要执行分析，很可能需要要么合并图层，要么逐个循环处理它们。\n\
  \n您还可以生成**瓦片索引**（也在**杂项**菜单中），它会生成一个包含栅格外轮廓的shapefile，并将栅格的ID和路径放入属性表中。这样，您就可以确定要为给定地图加载哪个影像，而无需加载所有影像。\n\
  \n最后，如果您确实希望将所有文件合并为一个大文件，可以使用上下文菜单（右键单击加载的VRT图层并选择**另存为**）。如果您有重叠、更复杂的情况，或者希望在不加载文件的情况下进行合并，请先使用**合并**工具（也在**杂项**菜单中）。如果您的文件重叠，这可能会很棘手，您需要决定如何处理重复数据。\n\
  \n## 另请参阅\n\n- * 有关另一个示例，请参阅 `http://manual.linfiniti.com/en/rasters/data_manipulation.html#basic-fa-create-a-virtual-raster`\n\
  - * GDAL的gdalbuildvrt是底层工具；其文档可在 `http://gdal.org/gdalbuildvrt.html` 找到。\n"
- "## 第3章\n常见数据\n预处理步骤\n\n在本章中，我们将介绍以下食谱：\n\n- - 将点转换为线、多边形，再转回 – QGIS\n- - 将点转换为线、多边形，再转回\
  \ – SpatiaLite\n- - 将点转换为线、多边形，再转回 – PostGIS\n- - 裁剪栅格\n- - 剪裁矢量\n- - 提取矢量\n- -\
  \ 将栅格转换为矢量\n- - 将矢量转换为栅格\n- - 构建日期时间字符串\n- - 地理标记照片\n\n## 简介\n\n在处理其他人的数据时，其格式往往并非特定用途所需的精确格式。本章主要介绍如何获取现有数据并将其转换为实际所需的数据。内容涵盖不同类型矢量（点、线和多边形）之间的转换、矢量与多边形之间的转换，以及仅裁剪出所需部分。将从获得的数据转换为工作需要的数据格式和布局通常被称为“数据预处理”。\n\
  \n## 常见数据预处理步骤\n\n## 将点转换为线、多边形，再转回 – QGIS\n\n有时您的数据采用矢量格式（点、线或多边形），但对于特定类型的分析而言，它并非正确的矢量类型。或者您可能需要以特定方式拆分矢量，以促进某些分析或制图。幸运的是，所有矢量格式都是相关的：线是两个或多个相连的点，多边形是首尾点相同的线，多多边形是同一记录的多个多边形，环是嵌套多边形，其中内部多边形勾勒出要排除的区域。本食谱将介绍如何使用QGIS内置方法在不同矢量类型之间进行转换。\n\
  \n## 准备工作\n\n要将点转换为线或多边形，您需要一个shapefile，其ID列具有同一线或多边形各点之间共享的单一值。在以下示例中，我们将使用 `census_wake_2000_points.shp`。\n\
  \n您还需要安装并激活Points2One插件。有关如何安装插件，请参阅以下网站：`http://docs.qgis.org/2.8/en/docs/user_manual/plugins/plugins.html`。\n\
  \n## 操作方法...\n\n以下说明根据起始数据和最终数据类型展示了四种不同的转换方法。所有工具都在**矢量**菜单中：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_508_0.png)\n\
  \n首先加载 `census_wake_2000_points.shp` 图层。\n\n## 将点转换为线（或多边形）\n\n- 1. 转到 **矢量 | Points2One**。\n\
  - 2. 选择创建线或多边形。\n- 3. 选择分组ID；在本例中为STFID。\n- 4. 创建输出文件名：`census_wake_2000_pt2lines.shp`：\n\
  \n![](img/2e88bf5938bf48a409c0a534a8775b21_509_0.png)\n\n## 将线转换为多边形\n\n- 1. 转到\
  \ **矢量 | 几何工具 | 线转多边形**。\n- 2. 创建输出文件名：`census_wake_2000_lines2poly.shp`。\n\n##\
  \ 将多边形转换为线\n\n- 1. 转到 **矢量 | 几何工具 | 多边形转线**。\n- 2. 创建输出文件名：`census_wake_2000_poly2lines.shp`。\n\
  \n## 将多边形或线转换为点\n\n- 1. 转到 **矢量 | 几何工具 | 提取节点**。\n- 2. 创建输出文件名：`census_wake_2000_poly2pts.shp`。\n\
  \n## 工作原理...\n\n在简单情况下，从较复杂的类型转换为较简单的类型相当直接。线只是多个点连接在一起，多边形是起点和终点相同的线。因此，很容易理解如何将一种几何体分解为更简单的几何体。\n\
  \n但从点构建起来，会稍微棘手一些。在具有三个或更多点的线中，您需要确保它们的顺序正确；否则，最终会得到一条弯曲的线。当转换为多边形时，这可能会带来更大的问题，导致生成自相交的无效多边形。因此，按它们将合并的顺序对源表中的点进行排序非常重要。重新排列数据可能有些棘手。Points2One插件现在包含排序选项；要使用此功能，请确保属性表包含一个数字列，指定每个组内点的顺序（可以为每个不同的分组从1开始重新编号）。\n\
  \n## 更多内容...\n\n您还可以使用**单部分转多部分**和**多部分转单部分**命令来拆分或合并多多边形。\n\n当情况变得非常棘手时，您可能需要转为手动编辑形状或使用自定义脚本。一个很好的例子是当您想要一个中间有孔的多边形时。如果您选择手动编辑，请务必启用捕捉，以便您的线自动捕捉到现有点。有关捕捉的官方文档可在\
  \ http://docs.qgis.org/2.8/en/docs/user_manual/working_with_vector/editing_geometry_attributes.html#setting-the-snapping-tolerance-and-search-radius\
  \ 找到。\n\n**编辑**和**高级编辑**工具栏以及额外的编辑相关插件，提供了逐一处理特别棘手几何体的能力，如果您需要的话。\n\n## 将点转换为线、多边形，再转回\
  \ – SpatiaLite\n\n本食谱的目标与上一食谱相同，但介绍如何在SpatiaLite数据库中处理数据。您将把点转换为线，并将线转换为多边形。\n\n\
  并非所有方法都可用；对于不可用的方法，您可以使用上一食谱。它也适用于数据库图层；只是不会将结果保存到数据库。因此，结果完成后需要导入到数据库中。\n\n## 准备工作\n\
  \n您需要加载一个点矢量图层，其中包含指示顺序的数字ID，以及一个标识唯一线或多边形的标识符，该标识符在同一几何体的各点之间共享。例如，您可以使用加载到SpatiaLite中的\
  \ `census_wake_2000_points`，其几何字段名为geom。\n\n## 操作方法...\n\n使用**DB Manager插件**（随QGIS提供，位于**数据库**菜单中）、**QspatiaLite**插件或替代的SpatiaLite\
  \ SQL应用（命令行或GUI），以下SQL示例将执行矢量类型之间的转换。\n\n## 点转线\n\n- 1. 创建一个按公共ID分组点的表：\n\n```\n\
  --Create table grouping points with shared stfid into lines\nCREATE Table census_pts2lines\
  \ AS\nSELECT stfid,Make_Line(geom) as geom\nFROM census_wake_2000_points\nGROUP\
  \ BY stfid;\n```\n\n以下截图显示了屏幕的外观：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_511_0.png)\n\
  \n\n\n\n\n## 从线到多边形\n\n- 1. 创建一个表，按公共 ID 分组线：\n- 2. 将新表注册为空间表：\n\n```\n--Create\
  \ table grouping lines with shared stfid into polygons\nCREATE Table census_line2poly\
  \ AS\nSELECT stfid,ST_Polygonize(geom) as geom\nFROM census_pts2lines\nGROUP BY\
  \ stfid;\n```\n\n```\n--Register the new table's geometry so QGIS knows its a spatial\
  \ layer\nSELECT\nRecoverGeometryColumn('census_line2poly','geom',3358,'POLYGON',2);\n\
  ```\n\n> 某些 SQL 接口可以一次运行多条 SQL 语句，语句之间用分号分隔。然而，也有许多接口一次只能执行一个查询。通常，除非你确定自己的软件支持多条查询，否则请一次运行一个查询；否则，这可能会失败或只在静默中运行第一个查询。\n\
  \n> 双破折号（--）是 SQL 中注释行的标志字符。它用于添加描述性文本，这些文本在查询中会被忽略。\n\n## 工作原理...\n\n根据 GROUP BY\
  \ 中指定的公共标识符，SQL 语句将多个点聚合为指定类型的新几何体。创建新几何体并将结果保存到表后，注册空间元数据可使 Spatialite 和 QGIS 识别该表为空间图层。\n\
  \n```\n--Register the new table's geometry so QGIS knows its a spatial layer\nSELECT\n\
  RecoverGeometryColumn('census_pts2lines','geom',3358,'LINESTRING',2);\n```\n\n2.\
  \ 将新表注册为空间表：\n\n## 更多内容...\n\n在第二个示例中，线被转换为多边形。你也可以使用 ST_Polygonize(ST_MakeLine(geom))\
  \ 直接从点生成多边形。\n\n在当前版本的 SpatiaLite 中，仅完全支持向更高级别的聚合。如果你希望拆分几何体，可以使用上一节中的 QGIS 矢量工具。\n\
  \n## 另请参阅\n\n- SpatiaLite 确实具有按第一个、最后一个或 ID 逐一导出指定点的函数。详情请参阅在线函数索引（参考指南）：https://www.gaia-gis.it/fossil/libspatialite/index\n\
  - 本章中的“将点、线、多边形互相转换 – QGIS”一节提供了非数据库方法。\n\n## 将点、线、多边形互相转换 – PostGIS\n\n本节的目标与前两节完全相同，但介绍如何使用\
  \ PostGIS 数据库中的数据执行该过程。你将用它把点转换为线，把线转换为多边形。\n\n并非所有方法都可用；对于不可用的方法，可以使用上一节。它同样适用于数据库图层；只是不会将结果保存到数据库。因此，完成后需要将结果导入数据库。\n\
  \n## 准备工作\n\n你需要加载一个点矢量图层，其中包含表示顺序的数字 ID，以及同一几何体的点之间共享的唯一线或多边形标识符。例如，可以使用加载到 PostGIS\
  \ 的 census_wake_2000_points，其几何字段名为 geom。（请参阅第 1 章“数据输入与输出”中的“将矢量数据加载到 PostGIS”一节，了解如何将数据加载到\
  \ PostGIS。）\n\n请以单一几何体而非多几何体导入。否则，你需要在查询中执行一些额外的步骤来拆分多几何体，然后才能进行转换。\n\n## 常见数据预处理步骤\n\
  \n## 如何操作...\n\n使用 **DB Manager 插件**（QGIS 自带，位于**数据库**菜单中）或其他 PostGIS SQL 应用程序（命令行——psql\
  \ 或 GUI——pgAdmin III），以下 SQL 示例将在矢量类型之间执行转换。\n\n## 将点转换为线\n\n- 1. 运行以下查询：\n\n```\n\
  CREATE VIEW pts2line AS\nSELECT ROW_NUMBER() over (order by census_wake_2000_points.stfid)\
  \ as id, ST_MakeLine(geom) as geom\nFROM census_wake_2000_points\nGROUP BY stfid;\n\
  ```\n\n以下截图展示了屏幕显示效果：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_514_0.png)\n\n\
  > 要测试新几何体的创建，请按照第 2 章“数据管理”中的演示，将查询封装在 `CREATE VIEW` 中。如果数据量较大或对结果满意，可以改用 `CREATE\
  \ TABLE` 创建一个新表，以进行更持久地存储。\n\n## 将线转换为多边形\n\n运行以下查询：\n\n```\nCREATE VIEW line2poly\
  \ AS\nSELECT id,stid,ST_MakePolygon(geom) as geom\nFROM pts2line;\n```\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_515_0.png)\n\
  \n> 想直接从点生成多边形？试试 ST_MakePolygon(ST_MakeLine(geom))；其余步骤如第一个示例（点转线查询）所示。\n\n## 将线或多边形转换为点\n\
  \n运行以下查询：\n\n```\nCREATE VIEW pts AS\nSELECT ROW_NUMBER() over (order by a.id_0)\
  \ as id,id_0 as grid,(a.a_geom).path[2] as path,\nST_GeometryType((a.a_geom).geom),\
  \ ((a.a_geom).geom) as geom\nFROM (SELECT id_0, (ST_DumpPoints(geom)) as a_geom\
  \ FROM \"census_wake2000\") as a;\n```\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_515_1.png)\n\
  \n> ROW_NUMBER() 有什么用？这是确保每一行都有唯一整数的技巧。如果没有它，某些工具会报错；例如，DB Manager 将无法预览或加载图层，尽管在\
  \ QGIS 中直接加载没有问题。\n\n## 工作原理...\n\n根据 GROUP BY 中指定的公共标识符，SQL 语句将多个点聚合为指定类型的新几何体。\n\
  \n当把几何体转储为点时，PostGIS 实际转储的是一个包含 ID 信息的数组。这就是示例查询实际上是一组嵌套查询的原因。第一个查询用于转储几何信息数组，第二个查询用于以我们想要的格式提取结果的相关部分。\n\
  \n## 更多内容...\n\nPostGIS 有几个用途不同的转储函数。拆分几何体对数据库来说显然是一个困难的概念，因为聚合通常是函数在逻辑上唯一可行的方向。有些人认为，拆分与\
  \ SQL 的概念工作方式相悖，需要非 SQL 逻辑。\n\n## 另请参阅\n\n- 有关 PostGIS 转储函数（`ST_Dump`、`ST_DumpPoints`\
  \ 和 `ST_DumpRings`）的更多详情，请参阅 PostGIS 手册：http://postgis.net/docs/manual-2.1/reference.html\n\
  - 非数据库方法请参阅本章中的“将点、线、多边形互相转换 – QGIS”一节。\n\n## 裁剪栅格\n\n有时，某个主题的栅格数据远大于研究区或地图的实际范围。或者，对于扫描地图，边缘周围会有额外的非地图信息。在这些情况下，你需要裁切出栅格的一部分。\n\
  \n## 准备工作\n\n你需要一个想要裁切一部分的栅格文件。在本示例中，我们将使用北卡罗来纳州全州高程模型（`elev_state_500m.tif`），并使用\
  \ Wake 县的轮廓（`county_wake.shp`）进行裁切。在新建的 QGIS 项目中加载这两个文件。\n\n## 如何操作...\n\n最简单的方法是使用多边形掩膜图层。矢量掩膜可以是矩形，但不一定非得是矩形。不过，使用单个多边形的轮廓效果最好。\n\
  \n![](img/2e88bf5938bf48a409c0a534a8775b21_516_0.png)\n\n另一种方法是使用“捕获坐标”工具确定所需范围的边界框（bbox）坐标，或直接在地图上绘制矩形。\n\
  \n- 1. 转到 **栅格 | 提取 | 裁剪器**。\n- 2. 将**输入文件（栅格）**设置为 `elev_state_500m.tif`。\n- 3.\
  \ 使用**选择**按钮设置**输出文件**，选择一个目录，并将输出命名为 `elev_wake_500m.tif`。\n- 4. 将**无数据值**设置为 **-9999**。\n\
  \n> 为什么是 -9999？将**无数据值**设置为一个不可能的值，以后对其他用户来说会更明显。0 的值确实是个糟糕的选择，因为数据中完全可能合法地包含零。由于某些栅格格式只支持数字，尤其是整数，所以一个大的负数通常是常见选择。\n\
  \n- 5. 现在将**裁剪模式**更改为**掩膜图层**，并选择 `county_wake.shp` 作为**掩膜图层**：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_517_0.png)\n\
  \n## 工作原理...\n\n掩膜的形状和源数据中栅格单元的大小将决定结果栅格的像素化程度。放大结果并将新栅格的边缘与县的矢量轮廓进行比较。你会注意到，由于像素宽度为\
  \ 500 米，很难用完整像素精确匹配县的边缘。\n\n请注意，此工具与 GDAL 工具菜单中的所有其他工具一样，实际上是 GDAL 命令行工具的图形界面。\n\
  \n\n\n\n\n### 更多内容……\n\n你会发现，在这个特定示例中，将栅格转换为非矩形形状时会出现一个问题：边缘相对于矢量来说呈锯齿状。如果你需要它非常平滑，有几种选择。你可以减小像素尺寸，使用\
  \ `-tr` 选项将当前像素拆分为多个像素。与其他栅格工具一样，你可以使用铅笔图标覆盖 GDAL 命令行选项，以添加界面中未包含的功能。在这种情况下，`-tr`\
  \ 选项已内联在其余格式化命令中：\n\n```\ngdalwarp -tr 100 100\n```\n\n这将使每个像素变为 100 x 100 单位，而不是当前的\
  \ 500 x 500。\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_518_0.png)\n\n> 使用 GDAL\
  \ 保存 TIFF 文件时需要记住的一些重要选项包括数字类型（整数与浮点数）和压缩。这两者都会对最终文件大小产生很大影响。请参阅本章后面的“将矢量转换为栅格”配方中的示例。此外，如果你有多核\
  \ CPU，请添加 `-multi` 以利用 CPU 核数来加速大多数栅格操作的处理。\n\n### 另请参阅\n\n- 有关 gdalwarp 选项的完整列表，请参阅\
  \ http://gdal.org/gdalwarp.html\n\n## 裁剪矢量\n\n与栅格一样，有时你只需要矢量数据覆盖某个研究区域（感兴趣区域）。同样，与栅格类似，你可以使用一个图层来定义范围，仅选择矢量图层的一部分来创建新图层。用于此任务的工具是\
  \ Clip（裁剪）；也就是“饼干模具”，因为结果看起来就像被模具切过一样。\n\n### 准备工作\n\n在本配方的示例中，我们将使用 `geology.shp`，并使用\
  \ `census_wake2000.shp` 将其裁剪到 Wake County 的范围。任何包含覆盖整个县的聚合多边形的矢量图层都可以。\n\n### 操作步骤……\n\
  \n1. 加载两个图层：`geology.shp` 和 `census_wake2000.shp`。\n2. 从 **矢量 | 地理处理工具 | 裁剪** 打开裁剪工具：\n\
  \n![](img/2e88bf5938bf48a409c0a534a8775b21_519_0.png)\n\n3. 输入图层是要被切割的图层，这里是 `geology.shp`。\n\
  4. 裁剪图层定义了要切割的边界。\n\n   > 裁剪图层不要求是连续的。你可以切割任意想要的形状组合，圆形、正方形、三角形等。它们只需要是多边形。\n\n\
  5. （可选）勾选 **将结果添加到画布**，以便立即查看结果。\n6. 点击 **确定** 运行工具：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_520_0.png)\n\
  \n### 工作原理……\n\n所有裁剪都基于相交要素的原理。对于输入中的每个要素，工具会检查其是否与裁剪图层的整体形状相交。如果相交，算法会检查是否有任何部分落在相交区域之外。如果有部分落在外部，就会被切掉。\n\
  \n### 更多内容……\n\n使用裁剪时必须小心。如果原始表格中包含面积、周长等测量值的列，这些值会从原始数据中复制过来。因此，它们可能无法反映被切割后的新尺寸和形状。\n\
  \n通常，所有几何操作和分析都应在相同投影的图层上进行，以确保结果一致。此外，许多工具并不感知投影，也不会补偿两个源图层处于不同投影的情况。\n\n创建对象相交结果的工具（例如\
  \ PostGIS 和 SpatiaLite 中的 `ST_Intersection`）可以为你提供类似的结果。但是，你可能需要执行多个步骤：先进行相交，然后通过包含或相交来选择以消除不需要的数据。\n\
  \n### 另请参阅\n\n如果你想在不改变原始空间数据的情况下限制要素，请参阅本章的下一个配方。\n\n## 提取矢量\n\n裁剪很好用，但如果你不想改变原始几何，例如想选择重叠要素时，它就不适用了。或者在其他情况下，你只想根据非空间属性筛选几何。要实现这两种结果，你可以利用选择工具结合\
  \ **图层另存为...** 来仅提取感兴趣的要素。本配方使用空间选择方法提取原始多边形的一个子集，而无需更改它们。\n\n### 准备工作\n\n我们将使用与上一个配方相同的数据：`geology.shp`\
  \ 和 `census_wake2000.shp`。\n\n### 操作步骤……\n\n1. 通过导航到 **矢量 | 研究工具 | 按位置选择**，从 `geology.shp`\
  \ 中选择与 Wake County（`census_wake2000.shp`）重叠的多边形。\n2. 选择 **geology** 中的要素。\n3. 与\
  \ `census_wake2000` 中的要素相交。\n4. 通过创建新选择来修改当前选择。\n5. 点击 **确定**：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_522_0.png)\n\
  \n6. 现在，你会看到匹配的要素被高亮显示（默认是黄色）：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_522_1.png)\n\
  \n7. 如果选择看起来没问题，使用 **图层上下文菜单**（右键单击）并点击 **另存为...** 来创建一个仅包含所选要素的文件。\n\n> 在 **另存为...**\
  \ 对话框中（如 *第1章，数据输入与输出* 所述），确保勾选 **仅保存所选要素** 复选框。\n\n### 工作原理……\n\n这实际上回到了大多数矢量分析所依赖的相交这一基本概念。当你能够测试两个要素是否重叠时，基于答案可以有多种不同的操作。你可以选择、取消选择，或者像上一个配方那样，先选择再裁剪以适配。在这些情况下，每个多边形都会被测试是否存在至少部分相交，然后匹配的要素会作为结果被高亮显示。\n\
  \n### 更多内容……\n\n虽然本配方演示了如何基于位置选择数据子集，但你也可以通过属性表上的查询，基于要素的属性来做同样的事情。或者，你可以在图形上组合基于属性的选择、空间选择以及手动选择——任何你想要的组合选择都可以另存为新图层。\n\
  \n你可能还会注意到，在 **按位置选择** 工具中，矢量也可以添加到现有选择或从现有选择中移除，以防你需要执行涉及多种条件类型的更复杂操作。\n\n### 另请参阅\n\
  \n- 有关如何在 PostGIS 中使用 SQL 执行类似操作的文档，请参阅 PostGIS、SpatiaLite 或 Packt Publishing 出版的《PostGIS\
  \ Cookbook》（SpatiaLite 查询非常相似）。\n\n## 将栅格转换为矢量\n\n有时，你需要将原本是栅格格式的数据转换为矢量格式，以便执行基于矢量的分析方法。一般来说，由于栅格是连续数据集，将它们转换为多边形比转换为线或点更为常见。\n\
  \n### 准备工作\n\n你需要一个栅格图层，最好是具有相邻相同值像素群组的图层。在本示例中，我们将使用 `geology_30m.tif`，因为 30 米\
  \ x 30 米的像素应该能给出不错的结果。\n\n> 像素越小，缩小后生成的矢量边缘看起来越平滑。\n\n### 操作步骤……\n\n1. 加载 `geology_30m.tif`。\n\
  2. 转到 **栅格 | 转换 | 多边形化**：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_524_0.png)\n\
  \n3. 将输出命名为 `geology_30m.shp`。\n4. （可选）将输出列命名为 `geology`、`class` 或 `value`。\n5.\
  \ 点击 **确定** 运行该过程。\n6. 比较结果（颜色相近但比例略有不同）：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_525_0.png)\n\
  \n### 工作原理……\n\n对于每个像素，系统会将其值与相邻像素进行比较（存在不同的相邻算法）。当相邻两个像素具有相同值时，它们会被合并为一个多边形。周围同值的像素会继续被添加到该多边形中，直到遇到不同值的像素。由于这是基于像素的，结果的边缘通常会沿着像素轮廓，形成锯齿状边缘。这个边缘可以通过附加选项或其他工具（如\
  \ QGIS 平滑工具）平滑为直线。\n\n### 更多内容……\n\n可以改变生成多边形所需的最小像素数，或者可被计为相同的最大允许值差异，以便丢弃孤立像素或允许一定范围的值被合并计数。\n\
  \n请注意，如果每个像素与其相邻像素相比都是唯一值，那么最终每个像素只会生成一个多边形。或者，如果你的栅格足够大且变化多样，此过程可能需要数天时间。你可能需要重新考虑是否真的需要转换，或者你的分析是否可以在栅格中完成。另一个选择是先将栅格重采样或重分类为更大的像素，以降低数据密度。或者，你可能需要研究遥感类工具，这些工具会基于相似性执行分类，将像素分组为相关的群组。\n\
  \n如果你想把栅格数据转换为点，那么你可能需要使用点采样工具。如果你想将栅格的某些部分转换为线，那么你可能需要更复杂的特征提取工具，例如在 SAGA 和 GRASS\
  \ 中找到的那些工具，可以通过处理工具箱或作为独立软件使用。或者，你甚至可能需要结合像素提取和手动数字化。\n\n\n\n\n\n# 另请参阅\n\n- 有关更多栅格方法，请参阅第\
  \ 7 章“栅格分析 I”和第 8 章“栅格分析 II”\n\n# 将矢量转换为栅格\n\n有时，您需要将矢量转换为栅格，以便使用诸如栅格计算器等栅格分析工具。\n\
  \n# 准备工作\n\n您需要一个矢量图层；它可以是点、线或面图层。通常，从面图层获得的最佳结果最多。我们将使用 `geology_wake2000reclass.shp`。该文件是之前“矢量裁剪”食谱的结果，并添加了新列，将地质类型编码为整数。作为参考，您还将使用\
  \ `elev_wake_500m.tif` 作为感兴趣区域的匹配栅格。\n\n# 操作步骤\n\n为了在分析中发挥作用，这里有一个检查清单：\n\n- 1.\
  \ 矢量数据是否与其余栅格分析数据具有相同的投影？如果没有，请先对其进行重投影。查看以下网址以获取帮助，`https://docs.qgis.org/2.8/en/docs/training_manual/vector_analysis/reproject_transform.html`。\n\
  - 2. 将矢量数据裁剪到分析范围。您可能需要将栅格转换为面掩膜以进行裁剪（请参阅本章之前提到的矢量裁剪食谱）。\n- 3. 加载 `geology_wake2000reclass.shp`\
  \ 和 `elev_wake_500m.tif`。\n\n> 由于栅格格式每个单元仅存储一个数值，因此只能选择数值字段作为栅格格式。为了保留您想要的属性，您可能需要使用字段计算器创建一个新的字段，将文本类别重新分类为数值方案（例如，1\
  \ = 水，2 = 陆地等），然后再执行转换。如果您将唯一 ID 复制为属性，随后的一些工具允许您将原始属性表作为值属性表重新连接（请参阅 **处理工具箱**\
  \ 中的 GRASS 函数）。\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_526_0.png)\n\n- 4. 打开\
  \ `elev_wake_500m.tif` 的 **属性**：\n  1. 在 **元数据** 部分，向下滚动到 **尺寸**。您需要匹配尺寸或分辨率，以便您的新栅格能够与现有的高程数据像素相匹配。\n\
  \  2. 请注意，**尺寸** 为 X: **134**, Y: **124**，**波段** 为 **1**。分辨率为 499.637,-498.342 像素大小。\n\
  \  3. 关闭对话框。\n\n- 5. 现在，通过导航到 **栅格 | 转换 | 栅格化** 打开转换对话框，并按照以下步骤操作：\n  1. 输入文件为 `geology_wake2000reclass`。\n\
  \  2. 将输出命名为 `geology_wake.tif`（您会收到设置尺寸或分辨率的警告）。\n  3. 设置栅格大小：**宽度** 为 **134**，**高度**\
  \ 为 **124**。\n  4. 点击 **确定** 运行该过程。\n\n以下屏幕截图显示了屏幕的外观：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_527_0.png)\n\
  \n# 常见的数据预处理步骤\n\n# 工作原理...\n\n在指定的宽度、高度和范围内创建像素网格。对于每个单元，都会执行与底层矢量图层的交集运算。如果单元的\
  \ 50% 以上与矢量相交，则其指定属性会被分配给该单元。\n\n# 更多内容...\n\n在转换为栅格之前，匹配投影和范围非常重要。如果您未能做到这一点，那么不同栅格图层中的像素将无法完美对齐，工具要么无法工作，要么会引入重采样误差。如果这对于您来说看起来像素化（方形）过头了，请考虑以更高的像素密度创建栅格。\n\
  \n如果您将矢量版本与新栅格进行比较，您会注意到中间的区域呈现出相似的色调。这是由于用于分类的值所致，地质类型以相同的主成分开始时被赋予了相同的起始值（例如，PZ\
  \ 都以 40 开始，最后一个数字根据 PZ 后面的字母而变化）。\n\n查看新图层并想要去除真实数据周围的黑色？该区域是无数据，请参阅 *第 8 章，栅格分析\
  \ II*。\n\n# 另请参阅\n\n- 还有其他方法可以计算像素的新值，以便在多个多边形位于同一像素时进行平滑过渡或中间值。请参阅处理工具箱中的 GRASS\
  \ 和 SAGA 方法，了解更多更精细的替代方案。\n\n# 构建 DateTime 字符串\n\n日期和时间数据以各种方式存储。其中一个令人沮丧的问题是，某些常见的\
  \ GIS 格式（如 Shapefiles）无法在同一字段中存储日期和时间，除非将其作为字符串。这对于视觉显示没问题，但对于使用 DateTime 作为其功能基础的工具（如\
  \ TimeManager 插件，请参阅 *第 4 章，数据探索*）来说则非常糟糕。\n\n# 准备工作\n\n使用 `datetime-example.shp`，其中包含各种日期和时间表示形式供您操作。\n\
  \n# 操作步骤\n\n- 1. 加载 `datetime-example.shp`。\n- 2. 打开 `datetime-example` 的属性表。\n\
  - 3. 创建一个新字段。由于这是 shapefile，我们需要使用长度为 30 的字符串（或者可以使用名为 `calculated` 的空字段）。\n- 4.\
  \ 开启图层编辑（这是铅笔图标，位于窗口工具栏左侧的第一个图标）。\n- 5. 从下拉列表中，选择 **计算**。\n- 6. 现在按下 **计算** 按钮。\n\
  \n> 在旧版本的 QGIS 中，您需要打开字段计算器，这在较新的版本中也起作用，但步骤稍微多一些。\n\n7. 在计算器中，我们将使用 `substr` 字符串操作（即子字符串）并结合\
  \ `||` 连接符来重新排列现有字段中的值，以形成有效的 `DateTime`：\n\n- 1. 最简单的变体只是将 `shpDate` 与 `Time` 结合，并在中间加一个空格：\n\
  \  \n  `\"shpdate\" || ' ' || \"Time\"`\n\n- 2. 为了多一点挑战，使用 `Date`：\n  \n  `substr(\"\
  Date\",7,4) || '-' || substr(\"Date\",1,2) || '-' || substr(\"Date\",4,2) || ' '\
  \ || \"Time\"`\n\n> 注意使用单引号 ('') 来表示字符串，而双引号 (\") 则表示字段名。\n\n8. 尝试这些公式，通过底部的计算器预览检查结果。满意后，选择确定，然后点击更新所有按钮：\n\
  \n![](img/2e88bf5938bf48a409c0a534a8775b21_530_0.png)\n\n9. 如果您对结果满意，保存编辑；如果不满意，关闭编辑并选择不保存并关闭。\n\
  \n# 工作原理...\n\nSubstr 接受三个参数：字段名、起始位置以及要包含的紧随其后的字符数。位置索引从 1 开始。\n\n# 更多内容...\n\n\
  通过字符串操作，我们将多个字段组合成了 ISO 标准的 DateTime 格式，其他工具可以识别并利用这一格式。\n\n此示例数据中包含的字段如下：\n\n|\
  \ 字段 | 类型 | 说明 |\n|---|---|---|\n| `Time` | String | 这是 24 小时制的时间：时:分:秒。 |\n| `datetime`\
  \ | String | 这是来自典型 GPS GPX 文件的 DateTime 字符串。 |\n| `calculated` | String | 这是一个足够长的字符串，可以容纳带填充字符和时区\
  \ UTC 偏移的日期和时间。 |\n| `Date` | String | 这是从电子表格中输出的典型日期格式。 |\n| `shpdate` | Date\
  \ | 这是 shapefile 内部 `Date` 类型的日期格式，它无法容纳时间。 |\n\n# 另请参阅\n\n- 如果使用数据库图层，这一切都可以使用\
  \ SpatiaLite 或 PostGIS 中的 SQL 来执行。ISO 日期时间标准是 8601，可以在 `http://en.wikipedia.org/wiki/ISO_8601`\
  \ 找到。\n\n# 为照片添加地理标签\n\n具有内置 GPS 的新款相机和手机可以是数据采集的绝佳工具，因为它们有助于精确跟踪照片拍摄的具体地点和时间。然而，并非所有相机都具备内置\
  \ GPS。您可以稍后添加地理标签，可以使用单独 GPS 单元的 GPS 日志，或者仅使用参考地图以及您的记忆或笔记。\n\n# 准备工作\n\n对于这个食谱，您需要一些照片以及\
  \ GPS 日志（`*.gpx`）、参考矢量、参考栅格或坐标。我们已在 geotag 文件夹中提供了 `centerofcalifornia.jpg`，坐标既在图像本身中，也作为点包含在\
  \ `centerofcalifornia.shp` 中。\n\n您还需要 Geotag photos 插件，该插件要求系统上安装 exiftool 程序。如果\
  \ exiftool 未随您的安装附带，您可以轻松地通过 Web 在 `http://www.sno.phy.queensu.ca/~phil/exiftool/`\
  \ 或软件包仓库（Linux）获取它。\n\n\n\n\n\n## 常见数据预处理步骤\n\n### 如何操作...\n\n此插件按文件夹分配位置，因此文件夹中的所有照片将获得相同的坐标。这非常适合批量分配通用坐标：\n\
  \n1. 首先加载你的 GPS 日志，或创建一个新的矢量图层并数字化你想要分配给照片的点。在本例中，加载 `centerofcalifornia.shp`。\n\
  \n![](img/2e88bf5938bf48a409c0a534a8775b21_532_0.png)\n\n> 没有很多位置或只是手写了坐标？ 你可以在没有现有图层的情况下手动将信息输入到插件界面。\n\
  \n2. （可选）加载一个背景参考图层。\n\n3. 现在你有了要与照片关联的图层，在 **Vector | Geotag and import photos\
  \ | Geotag photos** 中打开插件。\n\n4. 选择图层，然后选择要用作标签的字段（位置）。\n\n5. 现在，点击 **Populate Table**。\
  \ 界面中应该已添加一行。\n\n6. 现在，通过点击要分配的行中 **Path to Folder** 下方的空白框来选择照片：\n\n   1. 你可以输入路径或点击\
  \ **...** 浏览。\n   2. 选择 `geotag` 文件夹。\n   3. 确保在返回主屏幕后按 **Enter** 或点击框外：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_533_0.png)\n\
  \n7. （可选）如果希望地理标记的版本是文件的全新副本而不是修改原始文件，请勾选重命名地理标记文件的复选框（务必保留原始备份）。\n\n8. 点击确定。\n\n\
  ### 其工作原理...\n\nExifTool 将写入图像文件的内置元数据中的一个部分，称为 EXIF。 在摄影中，将额外数据存储在照片中是标准做法，许多软件管理工具可以轻松读取。\
  \ WGS 84 坐标中的纬度和经度是 EXIF 部分中编码 GPS 数据的标准方法。\n\n### 还有更多...\n\n现在你有了地理标记的照片，你可以将其上传到\
  \ Flickr 等网站，该网站会将其显示在地图上，或者跳到第 4 章《数据探索》中的食谱《Viewing Geotagged Photos》，了解如何在 QGIS\
  \ 中制作地图的方法。\n\n此插件非常手动，并且按文件夹分配位置，因为它是为了专门与相机陷阱一起使用而创建的。 相反，如果你在每张照片位置之间移动并且有 GPS\
  \ 日志，还有其他非 QGIS 工具可以帮助你将 GPS 点与照片匹配。 Digikam（摄影管理工具）具有根据时间戳匹配进行地理标记的功能。\n\n### 另请参阅\n\
  \n- OpenStreetMap wiki 在 http://wiki.openstreetmap.org/wiki/Geotagging_Source_Photos\
  \ 列出了其他免费和付费选项\n"
- "## 4 数据探索\n\n在本章中，我们将介绍以下食谱：\n\n- 列出列中的唯一值\n- 探索列中数值分布\n- 使用 Time Manager 探索时空数据\n\
  - 使用 Time Manager 创建动画\n- 设计时间依赖样式\n- 使用 QuickMapServices 插件加载底图\n- 使用 OpenLayers\
  \ 插件加载底图\n- 查看地理标记照片\n\n### 引言\n\n本章重点介绍食谱，这些食谱将帮助你直观检查并更好地理解你的数据。 本章中的食谱包括基于空间和时间属性对数据进行汇总、检查、过滤和样式化的方法，以便在执行分析之前让你更好地了解数据。\
  \ 主要目标是创建一些数据可视化或摘要，让你作为人类能够利用大脑识别感兴趣模式的能力。 你对数据的理解越好，后续选择合适的分析方法就越容易。\n\n### 列出列中的唯一值\n\
  \n在调查新数据集时，能够快速检查列包含哪些值非常有帮助。 在本食谱中，我们将使用 GUI 和 Python 控制台的两种不同方法来列出我们示例 POI 数据集中\
  \ POI 类别的唯一值。\n\n#### 准备工作\n\n要遵循本食谱，请加载 poi_names_wake.shp。\n\n#### 如何操作...\n\n\
  如果你只是寻找基于 GUI 的解决方案，List unique values 工具同时可在 Vector | Analysis Tools 以及 Processing\
  \ Toolbox 菜单中使用。 你可以使用其中任何一个来获取列中唯一值的列表。 该工具在 Processing Toolbox 菜单中可用，这使得它可以包含在处理模型中，从而实现流程自动化。\
  \ 以下列出唯一值的步骤使用 Processing Toolbox 菜单：\n\n1. 从 Processing Toolbox 菜单启动 List unique\
  \ values。\n2. 选择 poi_names_wake 图层作为输入图层，并将 class 属性作为目标字段。\n3. 点击运行并等待工具完成。 结果将显示在结果视图中，结果视图将自动打开。\n\
  \n如果你想进一步自定义此任务，例如统计该数据集中值的出现次数，是时候启动 Python 控制台了：\n\n1. 启动 Python Console，你可以在插件菜单中找到它，并点击显示编辑器按钮（在\
  \ Python 控制台左侧的工具栏中）打开编辑器窗口。\n2. 将以下简短脚本粘贴到编辑器中，保存它，然后点击运行脚本按钮。 （确保在图层列表中选择了 POI\
  \ 图层。）它遍历活动图层中的所有要素并创建一个字典对象，其中包含所有唯一值和相应的计数：\n\n```python\nimport processing\n\
  layer = iface.activeLayer()\nclasses = {}\nfeatures = processing.features(layer)\n\
  for f in features:\n    attrs = f.attributes()\n    class_value = f['class']\n \
  \   if class_value in classes:\n        classes[class_value] += 1\n    else:\n \
  \       classes[class_value] = 1\nprint classes\n```\n\n以下屏幕截图显示了屏幕的样子：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_537_0.png)\n\
  \n#### 其工作原理...\n\n在第一行，我们使用 `import processing`，因为它提供了一个非常方便且实用的函数 `processing.features()`\
  \ 来访问图层要素，我们在第 7 行使用它。 值得注意的是，如果存在选择，`processing.features()` 只会返回所选要素的迭代器。\n\n第\
  \ 3 行获取当前活动图层对象。 第 5 行创建空的字典对象，我们将用唯一值和相应计数填充它。\n\n从第 5 行开始的 `for` 循环遍历图层的所有要素。\
  \ 对于每个要素，我们获取分类字段中的值（第 7 行）。 你可以更改列名以分析其他列。 然后，我们只需要检查该值是否已存在于 `classes` 字典中（第 8\
  \ 行），还是需要添加它（第 11 行）。\n\n#### 还有更多...\n\n如果你使用的是 SQL 数据库，例如 Spatialite 或 PostGIS，你可以使用\
  \ COUNT 和 GROUP BY 函数的查询来实现类似结果，以按类别统计要素或记录的数量：\n\n```sql\nSELECT class, COUNT(*)\n\
  FROM poi_names_wake\nGROUP BY class\n```\n\n### 探索列中数值的分布\n\n在本食谱中，我们将了解如何探索数值列的属性。\
  \ 我们将查看 QGIS 提供的工具并将其应用于分析我们示例 POI 数据集中的高程值。\n\n#### 准备工作\n\n要遵循本食谱，请加载 `poi_names_wake.shp`。\
  \ 如果你遵循了之前的食谱 *Listing unique values in a column*，你可以直接继续。\n\n#### 如何操作...\n\n了解数值列属性的第一印象的好方法是使用\
  \ **Vector** 中的 **Basic Statistics** 工具。 这允许你计算统计值，例如最小值和最大值、平均值和中位数、标准差和总和。\n\n\
  如果你想检查高程值的分布，有方便的 Statist 插件。 Statist 生成值分布的交互式直方图表示：\n\n1. 使用 **Plugin Manager**\
  \ 安装 **Statist**。\n2. 从 **Vector** 菜单启动 **Statist**。\n3. 指定 **Input vector layer**\
  \ 和你想要分析的属性（**Target field**），然后点击 **OK** 计算统计信息。\n4. 使用图表下方的按钮，你可以缩放和平移图表，以及保存图表图像。\n\
  5. 你甚至可以通过更改标题和轴标签及范围来自定义图表。 只需使用最右边的绿色勾号按钮打开自定义对话框即可：\n\n\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_539_0.png)\n\
  \n## How it works...\n\n得益于 **Python Console** 和编辑器，我们并不局限于现有的工具和插件。相反，我们可以创建自己的专用脚本，例如以下脚本。该脚本使用\
  \ HTML 和 Google Charts Javascript API 创建一份简短的图层统计报告 [有关更多信息和 API 文档请参考 `https://developers.google.com/chart/`]，然后在\
  \ `QWebView` 窗口中显示该报告。当然，你也可以使用任何其他 JavaScript 图表 API。 [注意：此脚本需要连接到互联网才能工作，因为它必须下载\
  \ Javascript。] 我们建议使用上一条食谱中介绍的编辑器。不要忘记在图例中选择图层：\n\n```\nimport processing\nfrom\
  \ PyQt4.QtWebKit import QWebView\nlayer = iface.activeLayer()\nvalues = []\nfeatures\
  \ = processing.features(layer)\nfor f in features:\n    values.append( f['elev_m'])\n\
  myWV = QWebView(None)\nhtml='<html><head><script type=\"text/javascript\"'\nhtml+='\
  \ src=\"https://www.google.com/jsapi\"></script>'\nhtml+='<script type=\"text/javascript\"\
  >'\nhtml+='google.load(\"visualization\",\"1\",{packages:[\"corechart\"]});'\nhtml+='google.setOnLoadCallback(drawChart);'\n\
  ```\n\n```\nhtml+='function drawChart() { '\n    html+='var data = google.visualization.arrayToDataTable([\
  \ '\n        html+='[\"%s\"],' % (field_name)\n        for value in values:\n  \
  \          html+='[%f],' % (value)\n    html+='] );'\n    html+='var chart = new\
  \ google.visualization.Histogram('\n        html+='document.getElementById(\"chart_div\"\
  ));'\n    html+='chart.draw(data, {title: \"Histogram\"});</script></head>'\n  \
  \  html+=' <body><h1>Layer: %s</h1>' % (layer.name())\n    html+=' <p>Values for\
  \ %s range from: ' % (field_name)\n    html+='%d to %d</p> ' % (min(values),max(values))\n\
  \    html+='<div id=\"chart_div\"style=\"width:900px; height:500px;\">'\n    html+='</div></body></html>'\n\
  \    myWV.setHtml(html)\n    myWV.show()\n```\n\n当然，这样的自定义报告非常适合添加更多细节。例如，我们可以为每个\
  \ POI 类创建单独的直方图，或添加其他类型的图表，例如散点图：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_540_0.png)\n\
  \n第一部分 [第 1 至 12 行] 与上一条食谱中解释的脚本非常相似，*Listing unique values in a column:* 我们获取活动图层并将所有高程值收集到\
  \ values 列表中。\n\n第 14 行创建的 `QWebView` 使我们能够显示 HTML 内容，我们随后在下一节 [第 16 至 34 行] 中生成该内容。首先，我们加载\
  \ Google Charts Javascript。真正的魔力发生在第 21 行开始的 `drawChart()` 函数中。第 22 至 26 行创建 data\
  \ 对象，该对象用来自 `values` 列表的高程值填充。函数的最后三行 [第 27 至 29 行] 最终创建并绘制直方图。最后，第 30 至 34 行包含\
  \ HTML 正文定义，其中包含标明图层名称的标题和一段简短的介绍文字，说明最小和最大高程值。\n\n## See also\n\n- 对于想要进行更高级的图形和数值分析的人来说，可以考虑使用\
  \ matplotlib python 库，或将数据源读入 R。SpatialLite 或 PostGIS 中的聚合函数也可以为你提供最小值、最大值、平均值、总和和其他汇总函数。对于\
  \ PostGIS，请参考 `http://www.postgresql.org/docs/9.1/static/functions-aggregate.html`。\n\
  \n## Exploring spatiotemporal vector data using Time Manager\n\n在本食谱中，我们将使用 Time\
  \ Manager 插件探索时空矢量数据。我们将使用来自 **ACLED [Armed Conflict Location and Event Data Project]**\
  \ 的事件数据，网址为 `http://www.acleddata.com/about-acled/`。\n\n## Getting ready\n\n要遵循本食谱，请加载\
  \ `ACLED_africa_fatalities_dec2013.shp`。你在以下屏幕截图中看到的图层样式由 50% 透明度的简单圆形标记组成，数据定义的尺寸设置为事件的死亡人数。\
  \ [你可以在 Packt Publishing 出版的 *Chapter 10, Cartography Tips, and Learning QGIS* 书中阅读有关样式的更多信息。]\
  \ 如果你想要一些额外的地理背景信息，还可以加载 `NE_africa.shp`，其中包含非洲的轮廓。\n\n## Data Exploration\n\n##\
  \ How to do it...\n\n加载数据后，所有事件位置都将显示出来。默认的过滤事件方式，例如仅查看 12 月 1 日的事件，是使用 Layer |\
  \ Query 并输入过滤表达式或查询，例如以下内容：\n\n```\n\"EVENT_DATE\" >= '2013-12-01' AND \"EVENT_DATE\"\
  \ < '2013-12-02'\n```\n\n- 1. 很容易看出，手动为每一天更新此查询并不是探索时空数据的一种方便方式。因此，我们将使用 Time Manager\
  \ 插件 [使用插件管理器安装]。\n- 2. 插件安装后，Time Manager 面板将添加到 QGIS 窗口底部。点击 **Settings** 按钮打开\
  \ **Time manager settings** 对话框。我们可以在此处配置 Time Manager。\n- 3. 点击 **Add Layer** 打开\
  \ **Select layer and column(s)** 对话框。\n- 4. 选择 **ACLED_africa_fatalities_dec2013**\
  \ 图层和 **EVENT_DATE** 作为开始时间，然后点击 **OK** 将事件点图层添加到受管理的图层列表中，如以下屏幕截图所示：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_542_0.png)\n\
  \n> 可选地，你可以启用 **display frame start time on map** 以在渲染的地图上添加一个带有相应时间戳的小标签。\n\n5.\
  \ 完成后点击 **OK**。此时，Time Manager 会将时间过滤器应用于数据集，这可能需要一些时间，具体取决于所使用数据集的大小。\n\n6. 默认情况下，在添加第一个图层后，Time\
  \ Manager 将显示数据集中第一天发生的所有事件。可以通过更改 **Time frame size** 设置轻松调整过滤器。你可以增加应显示的天数，或更改为其他时间单位，包括秒、分钟、小时、周和月，如以下屏幕截图所示：\n\
  \n![](img/2e88bf5938bf48a409c0a534a8775b21_543_0.png)\n\n7. 一旦对设置满意，你有多种浏览时间的方式：\n\
  \n- 点击 Time Manager 面板左下角的播放按钮开始自动动画\n- 像在视频或音乐播放器应用程序中一样，将时间滑块移动到面板中央以进行导航\n- 点击滑块两侧的前进或后退按钮，按一个时间帧前进或后退\n\
  - 当然，你也可以直接编辑 **Time frame start** 设置\n\n## Data Exploration\n\n## How it works...\n\
  \n出于性能原因，Time Manager 依赖于 QGIS 的图层查询/过滤表达式功能。这带来了以下限制：\n\n- Time Manager 只能与支持图层查询或过滤表达式的数据源一起使用。最值得注意的是，这意味着它不能与分隔文本图层一起使用。\n\
  - 由于图层查询或过滤表达式必须使用字符串工作，因此必须能够使用文本排序正确排序日期时间值。因此，值必须存储在以下格式之一中：\n\n```\n%Y-%m-%d\
  \ %H:%M:%S.%f\n%Y-%m-%d %H:%M:%S\n%Y-%m-%d %H:%M\n%Y-%m-%dT%H:%M:%S\n%Y-%m-%dT%H:%M:%SZ\n\
  %Y-%m-%dT%H:%MZ\n%Y-%m-%d\n%Y/%m/%d %H:%M:%S.%f\n%Y/%m/%d %H:%M:%S\n%Y/%m/%d %H:%M\n\
  %Y/%m/%d\n%H:%M:%S\n%H:%M:%S.%f\n%Y.%m.%d %H:%M:%S.%f\n%Y.%m.%d %H:%M:%S\n%Y.%m.%d\
  \ %H:%M\n%Y.%m.%d\n%Y%m%d%H%M%S\n```\n\n> 如果你的数据使用另一种格式，但也能正确排序，你可以将其添加到 `timevectorlayer.py`\
  \ 或使用字段计算器更改格式。\n\n## See also\n\n- 以下食谱将向你展示如何使用 Time Manager 创建视频和更复杂的时变样式。\n\n\
  ## Creating animations using Time Manager\n\n在本食谱中，我们将使用 Time Manager 插件从我们的时空 QGIS\
  \ 项目中创建图像序列，并将其转换为视频，该视频可使用易于获得且免费的工具上传到 Youtube 或添加到演示文稿中。\n\n\n\n\n\n## 准备工作\n\
  \n要按照本教程操作，建议你先完成上一教程 *使用 Time Manager 探索时空矢量数据*，以设置本项目。\n\n要将 Time Manager 导出的图像序列转为视频，我们可以使用外部程序，例如命令行工具\
  \ Mencoder，或免费的 Windows Movie Maker。\n\nMencoder 是一个非常有用的命令行视频编码工具，可从许多 Linux 发行版的仓库中获得，也适用于\
  \ Mac。Windows 用户可以从 Gianluigi Tiesi 的网站 http://oss.netfarm.it/mplayer-win32.php\
  \ 下载。\n\n如果你使用 Windows，也可以使用免费的 Windows Movie Maker 应用程序创建视频，可从 http://windows.microsoft.com/en-us/windows/get-movie-maker-download\
  \ 下载。\n\n### 如何操作...\n\n在开始导出之前，最好先检查所有设置，如下所示：\n\n- 1. 时间滑块应移动到时间线的开头，并设置合适的 **Time\
  \ frame size**。\n- 2. 此外，如果你在上一教程中尚未启用，可以启用 **display frame start time on map**（请参考上一教程中的截图），否则导出的动画帧将不包含显示事件的时间信息。\n\
  - 3. 当你为数据集找到最佳设置后，点击 **Export Video** 按钮。将会打开一个对话框，允许你选择要导出视频的文件夹。点击 **Select Folder**\
  \ 按钮后，Time Manager 将自动开始导出视频帧。如 **Export video** 信息弹出窗口所示，你现在应等待导出完成。完成后会出现另一个弹出窗口，其外观如下图所示：\n\
  \n![](img/2e88bf5938bf48a409c0a534a8775b21_545_0.png)\n\n- 4. 如果打开 `export` 文件夹，你会看到\
  \ Time Manager 刚刚创建的动画帧。\n- 5. 这是如何使用 Mencoder 从当前工作目录中的所有 `.png` 图像创建 `.avi` 视频。请确保在运行以下命令前已进入包含图像的文件夹：\n\
  ```\nmencoder \"mf://*.png\" -mf fps=10 -o output.avi -ovc lavc -lavcopts vcodec=mpeg4\n\
  ```\n- 6. 你可以使用每秒帧数 (`fps`) 参数控制动画速度。数值越高，动画越快。\n\n如果你使用 Windows Movie Maker，请执行以下步骤：\n\
  \n- 1. 加载动画帧图像。\n- 2. 要调整动画速度，请转到 **Video Tools | Edit**，并减小 **Duration** 值。注意，如果你想同时对所有图像应用相同的持续时间，应先选中所有图像。\n\
  - 3. 要保存动画，只需转到 **File | Save Movie** 并选择你喜欢的分辨率和质量。\n\n### 工作原理...\n\nTime Manager\
  \ 的 Export Video 功能使用 `QgsMapCanvas.saveAsImage()` 函数导出图像序列。这意味着图像的大小将与你在点击 **Export\
  \ Video** 按钮时 QGIS 窗口中地图画布的大小相同。\n\n## 设计时态依赖样式\n\n在本教程中，我们将使用 Time Manager 提供的\
  \ `animation_datetime()` 函数，为动画创建时态依赖样式。该样式将表示事件要素的年龄：事件标记的填充颜色会随着事件变老而逐渐淡为灰色。\n\
  \n## 准备工作\n\n要按照本教程操作，请加载 `ACLED_africa_fatalities_dec2013.shp` 并按 *使用 Time Manager\
  \ 探索时空矢量数据* 教程中的说明配置 Time Manager，唯一例外是：在将图层添加到 Time Manager 时，将 **End time** 值设置为\
  \ `FOREVER` 属性。\n\n### 如何操作...\n\n要创建时态依赖样式，我们使用简单标记的 Data defined properties 选项：\n\
  \n- 1. 在 *使用 Time Manager 探索时空矢量数据* 教程中，我们提到已使用 FATALITIES 属性来缩放标记大小。对于时态依赖样式，我们将按以下截图所示，为\
  \ Fill color 属性添加新的定义：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_547_0.png)\n\n\
  - 2. 确认更改并启动动画以观看效果。\n\n### 工作原理...\n\n以下是我们的颜色表达式的详细说明：\n\n```\ncolor_hsla(\n \
  \   0,\n    scale_linear(\n        day(age(todatetime(animation_datetime()),\n \
  \       todatetime(\"EVENT_DATE\"))),\n        0,31,\n```\n\n```\ncolor_hsla(\n\
  \  100,\n  50,\n  128\n)\n```\n\n该表达式由多个部分组成，如下所示：\n\n- - `day(age(todatetime(animation_datetime()),todatetime(\"\
  EVENT_DATE\")))`: 这计算了由 `animation_datetime()` 给出的当前动画时间与 `EVENT_DATE` 计算之间的天数\n\
  - - `scale_linear`: 这将年龄值（0 到 31 天之间）转换为 100 到 0 之间的值，适用于以下颜色函数的饱和度参数\n- - `color_hsla`:\
  \ 这是 QGIS 中可用于创建颜色的众多函数之一。它返回颜色的字符串表示，基于其色相（0 等于红色）、饱和度（根据我们的年龄函数在 0 到 100 之间）、亮度（50\
  \ 等于中等亮度）和 alpha（128 等于 50% 透明度）属性\n\n你可以通过将 `scale_linear` 参数 `domain_max` 从 31\
  \ 天减小到更小的值，例如 7，来加快淡出效果，以在一周内完全淡为灰色。\n\n## 另请参阅\n\n- - 如果你有兴趣了解更多关于颜色模型的信息，例如本教程中使用的\
  \ HSL 颜色模型，我们推荐阅读 Wikibook 上的颜色模型章节 `http://en.wikibooks.org/wiki/Color_Models:_RGB,_HSV,_HSL`\n\
  \n## 使用 QuickMapServices 插件加载底图\n\n在探索数据时，你可能会感到有些迷失。没有已知世界的上下文，图层看起来就像漂浮在空间中的信息块。通过添加地图集风格的地图、航空照片或其他底图，你可以开始了解你的数据如何融入实地现实。然而，添加此类图层通常需要大量的预处理工作；有时，你只是不想在确定需要之前就进行这些操作。解决方案是什么？使用预制的图层，最好是快速加载的瓦片，从网络服务获取。\n\
  \n### 工作原理...\n\nQuickMapServices 插件是一个基于网络的工具。所有底图都来自互联网，随着你的平移和缩放加载；没有任何数据来自你的计算机或\
  \ QGIS 本身。\n\n使用 QuickMapServices 插件时，有几件事需要谨慎。它的对齐并不总是完全正确，尤其是在放大到大区域时。首先，检查你的其他图层的投影是否定义正确，然后尝试通过稍微平移地图来重置地图。需要记住的关键点是，瓦片服务通常仅存在于\
  \ EPSG:3857 且在非常特定的比例尺集上。QGIS 会尝试选择最接近匹配的比例尺并重新采样比例尺以使其适配。这也解释了为什么加载此类图层有时会很慢。\n\
  \n### 还有更多...\n\n要添加更多受限服务，例如 Google、Bing 等，请执行以下步骤：\n\n- 1. 转到 **Web** | **QuickMapServices**\
  \ | **Settings** | **Contributed Services**。\n- 2. 点击 **Get contributed pack** 按钮：\n\
  \n![](img/2e88bf5938bf48a409c0a534a8775b21_551_0.png)\n\n虽然查看地图在大多数情况下可能是合法的，但根据所选图层，基于它们数字化地图、打印它们或以其他方式将其保存以供离线使用可能并不合法。许可因数据源而异。因此，请务必通过在线访问其网站并阅读其服务条款来检查你想要使用的来源。如果你的用例超出了一般快速参考的查看范围，你可能需要花费一些时间获取使用许可或授权。\n\
  \n\n\n\n\n## 数据探索\n\n基于 OpenStreetMap 的数据源通常是不错的选择，因为其许可证通常仅要求署名且对使用没有限制。插件自带的图层之所以存在，是因为它们具有更宽松的许可证。\n\
  \n最后，你可能会想知道 QuickMapServices 与下一节食谱中提到的 OpenLayers 插件有何不同。首先，这个插件更新且目前仍在支持。它还解决了长期存在的问题，尤其是在打印方面。还有一个贡献图层\
  \ GitHub 仓库，这应该会让人们更容易贡献新的图层定义。\n\n## 另请参阅\n\n- 可以通过修改插件代码或使用 GDAL TMS 图层来添加额外的瓦片服务（请参阅\
  \ *第 9 章，QGIS 与 Web*）。你也可以用 WMS 服务替代，以发挥类似作用而没有瓦片的一些限制。请参阅 *第 9 章，QGIS 与 Web*，了解有关创建自己的\
  \ Web 服务的信息。\n\n## 使用 OpenLayers 插件加载底图\n\n在探索数据时，你常常会感到有些迷失。没有已知世界的上下文，一层数据看起来就像漂浮在空间中的信息块。通过添加地图集风格的地图、航拍照片或其他底图，你就可以开始了解你的数据如何融入实地现实。然而，添加此类图层通常需要大量的预处理工作；有时，你只是不想在确定需要之前就进行这些操作。解决方案是什么？使用来自\
  \ Web 服务的预制图层。\n\n> 本食谱几乎与上一食谱相同。QuickMapServices 是 OpenLayers 插件的替代品，后者已被弃用（已废弃）。我们保留本食谱是因为它仍然是一个常被提及的插件，并且工作方式略有不同。但是，请考虑使用\
  \ QuickMapServices。\n\n## 准备工作\n\nOpenlayers 插件在你有另一个想要提供额外上下文的数据集时效果最佳。首先加载此类图层，然后放大到其范围。\n\
  \n你需要以下内容：\n\n- 一个感兴趣的图层用于叠加（你可以使用 `Davis_DBO_Centerline-ugs84.shp`）\n- 一个活跃的互联网连接（在企业代理后面可能无法工作）\n\
  - 你需要安装并激活 OpenLayers 插件\n\n## 如何操作...\n\n从一个新 QGIS 项目开始，按照以下说明使用 Openlayers 插件从\
  \ Web 加载底图：\n\n- 1. 首先加载你的本地地图图层。\n- 2. 验证 QGIS 是否正确识别了投影定义。\n\n> 插件会为你设置并打开动态投影。在\
  \ QGIS 中大多数瓦片服务能够工作时，必须启用并设置为 EPSG:3857 伪/网络/流行墨卡托的动态投影。如果其投影未被 QGIS 定义或正确读取，其他数据将无法对齐。\n\
  \n- 3. 转到 Vector | OpenLayers Plugin 并选择一个要从 Web 加载的图层。等待几秒钟让瓦片加载。\n- 4. （可选）暂时禁用渲染（底部面板中的复选框），以避免在重新排列图层顺序时不断重绘。\n\
  - 5. 重新排列你的图层，将新的 OpenLayers 添加的图层移到底部的图层列表。\n- 6. 放大到你原始图层的范围。\n- 7. （可选）如果你关闭了渲染，现在重新激活渲染。\n\
  \n> 东西没有对齐？尝试再放大一点或稍微平移一下。最重要的是要有耐心！根据你的互联网连接，检索瓦片可能需要一段时间。\n\n## 数据探索\n\n以下屏幕截图显示了屏幕的外观：\n\
  \n![](img/2e88bf5938bf48a409c0a534a8775b21_554_0.png)\n\n## 工作原理...\n\nOpenLayers\
  \ 插件是一个基于 Web 的工具，基于同名 OpenLayers 库在互联网浏览器中创建基于 Web 的地图。然而，与其在浏览器中显示地图，该插件将其渲染到活动\
  \ QGIS 画布中（即地图）。\n\n使用 OpenLayers 插件时，有几件事需要谨慎。它并不总是完全对齐，尤其是在放大到大区域时。首先，检查你的其他图层的投影是否定义正确，然后尝试通过稍微向侧面平移来重置地图。需要记住的关键思想是，瓦片服务通常仅存在于\
  \ EPSG:3857 且在非常特定的比例尺集上。QGIS 会尝试选择最接近匹配的比例尺并重新采样比例尺以使其适配。这也解释了为什么加载此类图层有时会很慢。\n\
  \n## 还有更多...\n\n虽然查看地图可能是合法的，具体取决于所选图层，但基于它们进行数字化、打印或以其他方式保存以供离线使用可能是不合法的。许可证因数据源而异。因此，请务必通过在线访问其网站并阅读其服务条款来检查你想要使用的来源。如果你的用例超出了一般快速参考的查看范围，你可能需要花一些时间获得使用许可或授权。基于\
  \ OpenStreetMap 的数据源通常是不错的选择，因为其许可证通常仅要求署名。\n\n## 另请参阅\n\n- 可以通过修改插件代码或使用 GDAL TMS\
  \ 图层来添加额外的瓦片服务（请参阅 Chapter 9, QGIS and the Web）。你也可以用 WMS 服务替代，以发挥类似作用而没有瓦片的一些限制。请参阅\
  \ Chapter 9, QGIS and the Web，获取有关创建自己的 Web 服务的信息。\n\n## 查看地理标记照片\n\n通过位置跟踪照片可以是一个非常有用的工具，使你能够轻松调出某个地点和时间的相关照片。它们为同一地点收集的其他数据提供了本地上下文，并且可以让办公室工作人员看到实地人员所见。你可以将其视为你自己的个人街景，只是比\
  \ Google 的版本更专注。\n\n## 准备工作\n\n对于本食谱，你需要一组地理标记照片。我们已在本书的数据中包含了一组照片供你学习。这是来自戴维斯市中心的照片集，突出了几个街区内公共艺术的密度和多样性。\n\
  \n本食谱还利用了多个插件，如下：\n\n- 安装并激活 Photo2Shape\n- 激活核心插件 eVis（事件可视化）\n- （可选）安装并激活 OpenLayers\
  \ Plugin\n\n## 数据探索\n\n## 如何操作...\n\n按照以下步骤在 QGIS 中查看地理标记照片位置：\n\n- 1. 在 QGIS 项目中，启用\
  \ *Getting ready* 部分中列出的插件。\n- 2. （可选）加载参考图层以帮助你看到本地上下文（`Davis_DBO_Centerline.shp`\
  \ 和/或通过 OpenLayers Plugin 的 OpenStreetMap/Google Streets。）\n\n> 请记住，GPS 位置和地理标记照片几乎总是在纬度和经度\
  \ WGS84 坐标中（即 EPSG:4326）。因此，你需要打开动态投影以使它们与参考图层对齐。\n\n- 3. 转到 **Vector** 菜单或在工具栏上找到\
  \ **Photo2Shape** 的图标：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_556_0.png)\n\n\
  - 4. 这将要求你选择包含地理标记照片的目录并设置输出 shapefile。（使用 `davis-art` 文件夹作为输入目录。）\n- 5. 你现在应该得到一个包含照片点位置的新\
  \ shapefile 加载到地图中。使用 **Zoom to Layer Extent** 放大到这些位置。你应该在每张照片的位置看到一个相机图标。\n\n\
  6. 查看属性表，你可以看到提取到表中的有关照片的所有信息，包括照片在你计算机上的路径：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_557_0.png)\n\
  \n## 再进一步\n\n如果你想在 QGIS 中看到实际照片而不只是位置，请继续执行下一节步骤：\n\n- 1. 启用 **eVis** 插件。\n- 2.\
  \ 激活后转到 **Database | eVis | eVis Event Browser**。\n- 3. 在弹出的新窗口中，你可以在底部框中看到照片的属性：\n\
  - 1. 如果此为空，请转到 **Options** 选项卡并检查是否已为照片路径选择了正确的字段，在本例中为 **filepath**。\n\n\n\n\n\n\
  # 数据探索\n\n2. 为了让工具记住此更改，请勾选**记住此选项（Remember This）**复选框，并点击底部的**保存（Save）**按钮：\n\n\
  ![](img/2e88bf5938bf48a409c0a534a8775b21_558_0.png)\n\n## 工作原理...\n\n在摄影领域，大多数相机会写入一种名为\
  \ Exif 的标准元数据格式，该格式作为图像文件格式的一部分存储。通常，所有图像都会存储时间戳、相机型号、相机设置以及其他关于图像的常规信息。当你使用带有 GPS\
  \ 功能的相机拍照时，相机会将纬度和经度写入照片的元数据中。其他支持元数据的程序可以随时读取这些信息。如果你碰巧对这些照片进行修饰，请确保告诉你的软件保留或复制原始照片中的元数据，以便保留位置信息。\n\
  \n## 扩展内容...\n\n没有带内置地理标记功能的相机或手机？这不是问题。有很多方法可以自行添加位置信息。其中一种方法是使用**地理标记并导入照片（Geotag\
  \ and import photos）**插件，它允许你将照片数据与已知位置关联起来，该插件可在 http://hub.qgis.org/projects/geotagphotos/wiki\
  \ 找到。\n\n如果你需要更复杂的工具，还有很多其他选择。Digikam 是一个开源照片管理程序，它包含一个地理标记工具，该工具会根据时间戳，尝试将来自 GPS\
  \ 的 GPX 文件与你的照片自动匹配。\n\n许多在线照片服务也支持带地理标记的照片，因此你可以轻松浏览已上传照片的地图。Flickr 可能是其中最知名的，它还引入了地理围栏的概念，你可以通过它排除某些不希望被公开的位置。\n\
  \n另一方面，如果你不想在在线分享照片时暴露其位置，你现在也知道了如何从照片中移除地理标签。\n\n## 另请参阅\n\n-   除了 eVis 之外，还有其他在地图中查看照片的方法，包括\
  \ HTML 地图提示。请参阅 Nathan 的博客：http://nathanw.net/2012/08/05/html-map-tips-in-qgis/。\n\
  -   有关使用 Digikam 进行地理标记的更多信息，请访问 http://docs.kde.org/development/en/extragear-graphics/kipi-plugins/geolocation.html。\n\
  -   你也可以使用 Flickr 对图像进行地理标记并重新导出，或者使用其 API 创建在线地图混搭。\n\n# 经典矢量分析\n\n在本章中，我们将介绍以下操作指南：\n\
  \n-   选择最佳位置\n-   非密度制图\n-   计算区域统计量\n-   使用热力图估算密度\n-   基于样本估算数值\n\n## 简介\n\n本章将向你介绍一些最常见的\
  \ GIS 分析用例。这些操作指南侧重于分步说明，并详细解释用于实现预期分析结果的工具。本章包括最佳位置选择、使用插值法、创建热力图以及计算区域统计量的操作指南。\n\
  \n## 选择最佳位置\n\n最佳位置选择是一个相当常见的问题，例如，在规划商店或仓库位置，或寻找新公寓时。在本操作指南中，你将学习如何使用**处理工具箱（Processing\
  \ Toolbox）**中的工具手动执行最佳位置选择，同时也会了解如何通过创建处理模型来自动化此工作流程。\n\n在本操作指南的最佳位置选择中，我们将结合不同的矢量分析工具，以查找韦克县（Wake\
  \ County）中符合以下标准的潜在位置：\n\n-   位置靠近大湖（500 米以内）\n-   位置靠近小学（500 米以内）\n-   位置与高中的距离合理（2\
  \ 公里以内）\n-   位置距离主干道至少 1 公里\n\n### 准备工作\n\n要执行此练习，请加载以下数据集：`lakes.shp`、`schools_wake.shp`\
  \ 和 `roadsmajor.shp`。\n\n由于我们测试数据中的所有数据集已使用相同的 CRS，因此我们可以直接开始分析。如果你使用不同的数据，则可能需要先将所有数据集转换为相同的\
  \ CRS。在这种情况下，请参阅第 1 章“数据输入与输出”。\n\n### 操作步骤...\n\n以下步骤向你展示如何使用**处理工具箱**选项执行最佳位置选择：\n\
  \n1.  首先，我们必须过滤湖泊图层以找出大湖。为此，我们使用处理工具箱中的**按表达式选择（Select by expression）**工具，选择湖泊图层，并在**表达式**文本框中输入\
  \ `\"AREA\" > 1000000 AND \"FTYPE\" = 'LAKE/POND'`，如下面的截图所示：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_562_0.png)\n\
  \n2.  接下来，我们创建表示湖泊、学校和道路周围邻近区域的缓冲区。使用**处理工具箱**选项中的**固定距离缓冲区（Fixed distance buffer）**创建以下缓冲区：\n\
  \n-   对于湖泊，选择**距离（Distance）**为 500 米，并通过勾选复选框来设置**融合结果（Dissolve result）**，如下面的截图所示。通过融合结果，我们可以确保重叠的缓冲区区域合并为一个多边形。否则，每个缓冲区都将作为结果图层中的独立要素保留：\n\
  \n![](img/2e88bf5938bf48a409c0a534a8775b21_563_0.png)\n\n> 你可以选择通过指定输出文件来永久保存缓冲区结果，也可以将**缓冲区输出文件**字段留空，仅使用临时文件。\n\
  \n-   要创建小学缓冲区，首先像我们为湖泊缓冲区所做的那样，使用**按表达式选择（Select by Expression）**工具仅选择 `\"GLEVEL\"\
  \ = 'E'` 的学校。然后，像刚才为湖泊缓冲区所做的那样使用缓冲区工具。\n-   对于高中，重复该过程，使用 `\"GLEVEL\" = 'H'` 和 2,000\
  \ 米的缓冲区距离。\n-   最后，对于道路，创建距离为 1,000 米的缓冲区。\n\n3.  准备好所有这些缓冲区后，我们现在可以组合它们以满足以下规则：\n\
  \    1.  对小学和高中周围的缓冲区使用**处理工具箱**选项中的**交集（Intersection）**工具，以获取靠近两种学校类型的区域。\n   \
  \ 2.  对湖泊周围的缓冲区以及上一步的结果使用**交集**工具，将结果限制在湖滨区域。使用**差异（Difference）**工具，从上一步（交集）结果中移除主要道路（即缓冲后的道路图层）周围的区域。\n\
  \n4.  检查结果图层，查看符合我们之前指定的所有标准的潜在位置。你会发现，只有一个靠近**韦克菲尔德小学（WAKEFIELD ELEMENTARY）**和**韦克菲尔德高中（WAKEFIELD\
  \ HIGH）**的区域符合要求，如下面的截图所示：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_564_0.png)\n\
  \n## 工作原理...\n\n在第 1 步中，我们使用**交集**来模拟我们的首选位置需要同时靠近小学和高中这一要求。随后在第 3 步中，**差异**工具使我们能够移除靠近主要道路的区域。下图概述了可用于类似分析的各种矢量分析工具。例如，**并集（Union）**可用于模拟诸如“靠近至少一所小学或高中”的要求。另一方面，**对称差异（Symmetrical\
  \ Difference）**将得出“靠近一所小学或高中，但不能同时靠近两者”的结果，如下图所示：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_565_0.png)\n\
  \n## 扩展内容...\n\n我们很幸运地找到了一个符合所有标准的潜在位置。当然，情况并非总是如此，你需要尝试调整你的标准，以找到匹配的位置。可以想象，使用不同的设置一遍又一遍地重复这些步骤会非常繁琐且耗时。因此，创建一个处理模型来自动化此任务是个好主意。\n\
  \n该模型（如下面的截图所示）基本上包含我们手动过程中使用的相同工具，具体如下：\n\n-   使用两个“按表达式选择”实例来选择小学和高中。如下面的截图所示，我们使用描述\
  \ `Select \"GLEVEL\" = 'E'` 和 `Select \"GLEVEL\" = 'H'` 来命名这些模型步骤。\n-   对于小学，计算\
  \ 500 米的固定距离缓冲区。此步骤称为 `Buffer \"GLEVEL\" = 'E'`。\n-   对于高中，计算 2,000 米的固定距离缓冲区。此步骤称为\
  \ `Buffer \"GLEVEL\" = 'H'`。\n-   使用“按表达式选择”来选择大湖（请参阅“Select big lakes”步骤），并使用 500\
  \ 米的固定距离缓冲区对其进行缓冲（请参阅“Buffer lakes”步骤）。\n\n\n\n\n## 经典矢量分析\n\n- 使用**固定距离缓冲**对道路进行缓冲（参考**缓冲道路**步骤）。缓冲区大小由名为**road_buffer_size**的数值模型输入控制。你可以将这种通过额外输入控制模型参数的方法扩展到本模型中所有其他缓冲步骤。（我们选择只展示一个示例，以保持模型截图的清晰度。）\n\
  - 使用**相交**获取学校附近的区域（参考**相交：学校附近**步骤）。\n- 使用**相交**获取学校和湖泊附近的区域（参考**相交：学校和湖泊**步骤）。\n\
  - 使用**差集**移除道路附近的区域（参考**差集：避开道路**步骤）。\n\n最终模型如下所示：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_566_0.png)\n\
  \n你可以从**处理工具箱**选项中运行此模型，甚至可以在其他模型中将其用作构建模块。值得注意的是，该模型会以缓冲结果（near_elementary、near_highschool\
  \ 等）的形式生成中间结果。虽然这些中间结果在开发和调试模型时很有用，但你最终可能希望移除它们。这可以通过编辑缓冲步骤并移除**缓冲 <OutputVector>**名称来实现。\n\
  \n## 分区密度制图\n\n分区密度制图是一种常用于改进人口分布地图的技术。默认情况下，人口数据使用人口普查数据来显示，这些数据通常按地理单元（如人口普查区）提供，而后者的边界不一定反映实际的人口分布。为了更好地模拟人口分布，分区密度制图使我们可以根据土地利用来绘制人口密度。例如，按人口普查区组织的人口数量可以通过从人口普查区中移除无人居住的区域（如水体或空地）来更准确地进行分布。\n\
  \n在本教程中，我们将使用有关已有人口居住的城市区域以及水体的数据来改进我们的人口普查区人口数据。\n\n### 准备就绪\n\n要完成本练习，请从 `census_wake2000_pop.shp`\
  \ 加载人口数据（我们在第2章“数据管理”中创建的文件），以及从 `urbanarea.shp` 加载城市区域，从 `lakes.shp` 加载湖泊数据。\n\n\
  由于示例数据中的所有数据集已经使用相同的 CRS，我们可以直接开始分析。如果你使用不同的数据，则可能需要先将所有数据集转换为相同的 CRS。在这种情况下，请参阅第1章“数据输入与输出”了解详细信息。\n\
  \n### 操作步骤...\n\n要创建一幅新的、改进后的人口分布图，我们首先从人口普查区中移除无人居住的区域。然后，我们重新计算人口密度值，以反映区域几何形状的变化，具体步骤如下：\n\
  \n1. 对人口普查区和城市区域图层使用**处理工具箱**选项中的**裁剪**（如果你更喜欢此选项，也可以通过导航到**矢量 | 地理处理工具**来使用**裁剪**——结果完全相同），以创建一个新数据集，其中仅包含人口普查区位于城市区域内的部分。\n\
  2. 使用差集工具进一步移除水体（湖泊图层），以细化上一步的结果。下面的截图显示了目前的结果：\n\n   ![](img/2e88bf5938bf48a409c0a534a8775b21_568_0.png)\n\
  \n3. 现在，我们可以按如下所示计算所得区域的人口密度：\n\n   1. 启用编辑。\n   2. 打开字段计算器。\n   3. 使用公式 **\"_POP2000\"\
  \ / ($area / 1000000)** 计算新的人口密度（每平方千米居民数）。\n\n      ![](img/2e88bf5938bf48a409c0a534a8775b21_569_0.png)\n\
  \n   4. 禁用编辑并保存更改。\n\n> 值得注意的是，你不一定非要新建一列。如果只想将密度值用于样式设置，也可以直接在样式配置中输入该表达式。另一方面，如果你创建新列，则可以在属性表中检查密度值、导出或进一步分析它们。\n\
  \n完成后，你现在可以使用分级渲染器可视化结果，例如使用自然间断点（Jenks）分类模式。Jenks 自然间断点分类法旨在通过最大化不同类别之间的方差，同时减小所生成类别内部的方差，将值划分为“自然”类别。下图显示了基于原始人口普查数据的人口密度（左侧）以及经过分区密度制图后的结果（右侧）：\n\
  \n![](img/2e88bf5938bf48a409c0a534a8775b21_570_0.png)\n\n### 工作原理...\n\n在本教程的第一步中，我们使用了裁剪操作。你很可能已经注意到，裁剪操作的结果与本章节上一个教程“选择最佳位置”中使用的相交工具结果非常相似。比较两者结果，你会发现以下差异：\n\
  \n- 相交操作生成的图层包含两个输入图层的属性，而裁剪操作的结果仅包含第一个输入图层的属性。\n- 这也意味着使用裁剪时图层顺序很重要，但这不会改变相交操作的输出（属性表中的属性顺序除外）。\n\
  - 相交操作的结果也很可能比裁剪操作结果包含更多要素（如果使用我们的示例数据人口普查区和城市区域，则为164个而不是105个）。这是因为相交工具需要为人口普查区和城市区域相交的每一种组合创建一个新要素，而裁剪工具仅移除人口普查区中不位于任何城市区域内的部分。\n\
  \n关于裁剪操作，一个常见的理解方式是将一个图层想象成饼干模具，将另一个图层想象成饼干面团。\n\n## 计算区域统计\n\n另一种经典的空间分析任务是计算区域内特定类型的面积，例如，一个县内被某些土地利用类型覆盖的面积，或在特定城市种植的不同作物的份额。\n\
  \n在本教程中，我们将计算邮政编码区域的地质数据统计。具体而言，我们将计算每个邮政编码区域内每种岩石类型的总面积。\n\n### 准备就绪\n\n要学习本教程，请从示例数据中加载\
  \ `zipcodes_wake.shp` 和 `geology.shp`。此外，使用插件管理器安装并激活 Group Stats 插件。\n\n### 操作步骤...\n\
  \n使用以下步骤，我们可以计算每个邮政编码区域中某些岩石类型的面积：\n\n1. 使用**处理工具箱**选项中的**相交**工具或从**矢量**菜单中计算邮政编码区域与地质区域之间的交集。\n\
  2. 现在，使用 **Group Stats** 插件，可以按岩石类型和邮政编码区域计算总面积，如下所示：\n   1. 选择**相交**结果图层作为输入**图层**。\n\
  \   2. 将 **ZIPCODE** 字段拖到**行**输入区域，将 **GEO_NAME** 字段拖到**列**输入区域。\n   3. 将求和函数和 **Area**\
  \ 值拖到**值**输入区域。\n   4. 点击**计算**开始计算。\n\n下面的截图显示了完整的配置以及结果：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_572_0.png)\n\
  \n### 工作原理...\n\nGroup Stats 插件为 QGIS 带来了通常称为数据透视表的功能。数据透视表是一种数据汇总工具，常见于电子表格或商业智能软件等应用程序中。如本示例所示，数据透视表可以聚合来自输入表的数据。此外，Group\
  \ Stats 插件还提供了扩展的几何函数，例如用于多边形输入图层的面积和周长，或用于线图层的长度。这使得使用该插件更加方便，因为不必先使用字段计算器将这些几何值添加到属性表中。\n\
  \n\n\n\n\n值得注意的是，你始终需要在 **Value** 输入区域中填入以下两个条目：\n\n- 一个聚合函数，例如 sum、average 或 count\n\
  - 一个值字段（来自输入图层的属性表）或几何函数，该值需要被聚合\n\n## 估算密度热力图\n\n无论是动物目击地点、事故位置，还是一般兴趣点，许多点数据集都可以通过使用热力图可视化点密度来更轻松地解读。在本教程中，我们将估算\
  \ Wake 县中 POI 的密度，以找到密度较高的区域。\n\n## 准备工作\n\n从示例数据中加载 `poi_names_wake.shp` POI 数据集。确保默认随\
  \ QGIS 一起提供的 **Heatmap** 插件已在 **Plugin Manager** 中启用。\n\n## 如何操作...\n\n使用以下步骤，我们可以计算\
  \ POI 热力图：\n\n1. 从 **Raster** 菜单启动 **Heatmap** 插件。\n2. 确保 **poi_names_wake** 已被选为\
  \ **Input point layer**。\n3. 为 **Output raster** 选择位置和文件名。你无需指定文件扩展名，因为这将根据所选的 **Output\
  \ format** 自动添加。GeoTIFF 通常是首选。\n4. 选择搜索 **Radius** 为 `1000` 米。\n5. **Add generated\
  \ file to map** 选项应默认处于激活状态。点击 **OK** 以创建默认热力图。\n6. 默认情况下，热力图图层将使用 **Singleband\
  \ gray** 渲染类型进行渲染。将渲染类型更改为 **Singleband pseudocolor** 并应用你喜欢的颜色渐变以改善可视化效果，如下图所示：\n\
  \n![](img/2e88bf5938bf48a409c0a534a8775b21_574_0.png)\n\n> 如果你想控制输出栅格的大小，只需启用 **Advanced**\
  \ 部分并相应地调整 **Rows** 和 **Columns** 或 **Cell size X** 和 **Cell size Y**。请注意，更改行和列会自动重新计算单元格大小，反之亦然。\n\
  \n## 其工作原理...\n\n搜索半径，也称为核带宽，决定了热力图看起来有多平滑，因为它设置了每个点周围的影响范围。因此，较小的半径值会导致热力图显示更精细的细节，而较大的值则会导致更平滑的热力图。\n\
  \n除了核带宽之外，还有不同的核形状可供选择。核形状控制着点的影响力随距离点增加而下降的速率。Heatmap 插件中可用的核形状如下图所示。例如，Triweight\
  \ 核（底部第一行第一个）比 Epanechnikov 核（底部第二行第二个）产生的热点更小，因为 Triweight 形状使特征在更接近点的距离上具有更高的影响力：\n\
  \n![](img/2e88bf5938bf48a409c0a534a8775b21_575_0.png)\n\n三角核形状还可使用 Decay ratio 设置进一步调整。在前一图中，你可以看到比率为\
  \ 0（实心红线）、0.5（虚线黑线）和 1（点线黑线）的形状，后者等于均匀核形状。你甚至可以指定大于 1 的值。在这种情况下，特征的影响力会随着距离点的增加而增加。\n\
  \n## 基于样本估算值\n\n插值是指在已知一组值的情况下，可以根据这些已知值的邻近程度来估算额外点的数值。本教程将展示如何使用点位置的已知值来创建连续的表面（栅格）值估算。经典示例包括基于气象站数据（例如气温或降雨量地图）的天气数据估算、基于田间采样部分的作物产量估算，以及像本教程示例中一样，基于采样点的海拔估算。\n\
  \n## 准备工作\n\n通过 Plugin Manager 激活 Interpolation Plugin。\n\n加载包含数值列的点图层，表示感兴趣的特征。对于本教程，使用\
  \ `poi_names_wake.shp`，以及 `elev_m` 列，其中包含每个点的以米为单位的海拔。\n\n## 如何操作...\n\n1. 首先加载\
  \ `poi_names_wake`。\n2. 缩放到图层范围。\n3. 通过导航到 **Raster** | **Interpolation** | **Interpolation**\
  \ 打开 Interpolation 工具。\n4. 为 **Input** 选择 `poi_names_wake`。\n5. 为 **Interpolation\
  \ attribute** 选择 `elev_m`。\n6. 点击 **Add** 按钮，你的选择应出现在左侧的框中。\n7. 为 **Interpolation\
  \ Method** 选择 **Inverse Distance Weighted (IDW)**。\n8. 现在，设置 **Extent** 和 **Cell\
  \ Size** 属性。在 **Cellsize X** 和 **Cellsize Y** 中输入 100 和 100。这会强制输出单元为当前投影的 100x100\
  \ 单位。\n9. 点击中间的 **Set to current extent** 按钮。\n10. 在 **Output file box** 旁边，点击标有\
  \ ... 的按钮以设置保存结果的输出路径：\n11. 选择文件夹并输入一个名称且不带文件扩展名，例如 `idw100m`（结果将是 ASCII 栅格 `.asc`\
  \ 文件），如下图所示：\n\n> 是的，它在 **Raster** 菜单上；源数据必须是矢量，但结果是栅格。\n\n> 通常，如果这是用于分析，你会尝试匹配感兴趣区域或其他栅格图层。在本例中，我们只是希望获得合理大小的单元。由于地图使用\
  \ UTM，我们希望单元为代表公制单位的整数；100 米乘 100 米使结果解释更容易。\n\n## 其工作原理...\n\n基本思路是，在给定单元处，你取所有附近点的平均值，并按其与单元的距离加权，以估算当前位置的值。**Inverse\
  \ Distance Weighted (IDW)** 在此基础上更进一步，对更接近给定单元的值给予更大权重，对更远的值给予更小权重。该函数使用指数因子 *P*\
  \ 以大幅提高近点相对于远点的作用。\n\n## 更多内容...\n\n结果与预期不符？有一些参数可以调整；主要的是 *P* 值和单元大小。如果这样仍然达不到你想要的效果？在\
  \ Processing 下的 SAGA、GRASS 和 GDAL 工具箱中还有其他几种插值工具，可让你操作更多公式参数以优化结果。\n\n最后，取决于你的数据，IDW\
  \ 可能无法很好地进行插值。在这里的示例中，你实际上可以看到孤立点周围有明显的圆圈。这通常不是一个好的结果，需要更平滑地过渡到附近点。如果你在最初进行野外采样时有任何控制权，请记住，规则间隔的网格通常会提供更好的结果。\n\
  \n你无法控制源数据或没有得到好的结果？那么，你可能需要研究其他更复杂的公式，以补偿偏差、强方向性、障碍物和样本非规则间距，例如 Spline 或 Kriging，或\
  \ **Triangulated Irregular Networks (TINs)**。这些方法背后有大量的科学和统计知识，以及确定最佳参数的诊断工具。这对于本教程来说过于复杂，但已在地统计学书籍中得到充分介绍。\n\
  \n## 另请参阅\n\n- `http://docs.qgis.org/2.2/en/docs/user_manual/plugins/plugins_interpolation.html`\n\
  - `http://en.wikipedia.org/wiki/Inverse_distance_weighting`\n\n# Classic Vector\
  \ Analysis\n"
- "## 6\n网络分析\n\n在本章中，我们将介绍以下教程：\n\n- 创建简单的路由网络\n- 使用 Road graph 插件计算最短路径\n- 在 Road\
  \ graph 插件中使用单向街道进行路由\n- 使用 QGIS 网络分析库计算最短路径\n- 路由点序列\n- 使用批处理自动化多条路线计算\n- 将点匹配到最近的线\n\
  - 为 pgRouting 创建网络\n- 在 QGIS 中可视化 pgRouting 结果\n- 为方便使用 pgRoutingLayer 插件\n- 从 OSM\
  \ 获取网络数据\n\n## 简介\n\n本章重点介绍与网络内路由相关的常见用例。迄今为止，用于路由的最常见网络是街道网络。其他较少见的情况包括室内路由网络，即在建筑物内部房间之间，或航运路线网络。\n\
  \n\n\n\n\nNetworks and routing are in no way a GIS-only topic. You will find a lot\
  \ of math literature related to this, called **Graph Theory**. In this chapter,\
  \ we will use the following terms to talk about networks:\n\n- A **network** (also\
  \ known as **graph**) is a collection of connected objects\n- These objects are\
  \ called **nodes** (also known as vertices)\n- The connections between nodes are\
  \ called **links** (also known as **edges**)\n\nThe following figure explains these\
  \ terms:\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_580_0.png)\n\nThe two routing\
  \ tools that are commonly used with QGIS are as follows:\n\n- The Road graph plugin,\
  \ which is one of the QGIS core plugins; that is, this plugin is available in every\
  \ QGIS installation, but you may have to activate it in Plugin Manager\n- The PostGIS\
  \ extension pgRouting, which can be used directly through the QGIS DB Manager, or\
  \ more comfortably through the pgRoutingLayer plugin, which can be installed from\
  \ the QGIS plugin repository using Plugin Manager\n\n## Creating a simple routing\
  \ network\n\nIn this recipe, we will create a routing network from scratch using\
  \ the QGIS editing tools. Even though more and more open network data is available,\
  \ there will still be numerous use cases where necessary network data does not exist\
  \ or is not available for use. Therefore, it is good to know how to create a network\
  \ and what to pay attention to in order to avoid common pitfalls.\n\nFor the task\
  \ of network creation, the main difference between the Road graph plugin and pgRouting\
  \ is that pgRouting needs a network node (that is, link start or end node) at each\
  \ intersection while the Road graph plugin will also use intermediate link geometry\
  \ nodes to infer intersections if two links share a node. In this recipe, we will\
  \ create a network, which can be used in both tools.\n\n### Getting ready\n\nTo\
  \ follow this recipe, you only need a new empty QGIS project. Additionally, make\
  \ sure you have the **Digitizing** toolbar enabled (as shown in the following screenshot).\
  \ We will create an imaginary network, but if you want you can load a background\
  \ map and digitize this:\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_581_0.png)\n\
  \n### How to do it...\n\nBefore we can start to create the network, there are a\
  \ few things that need to be set up first:\n\n- 1. Create a new shapefile line layer\
  \ for the network. You don't need to add any extra attributes besides the default\
  \ ID attribute yet.\n\n> You can read more about creating new shapefiles in the\
  \ *Learning QGIS* book by Packt Publishing and the QGIS user guide at `http://docs.qgis.org/2.2/en/docs/user_manual/working_with_vector/editing_geometry_attributes.html#creating-a-new-shapefile-layer`.\n\
  \n- 2. To ensure that we can digitize the network with valid topology, we'll activate\
  \ snapping next. Go to **Settings | Snapping Options** and activate snapping for\
  \ your line layer by enabling the checkbox to the left of it. Additionally, set\
  \ the mode to **to vertex** and choose a tolerance of at least **5.00000** pixels:\n\
  \n![](img/2e88bf5938bf48a409c0a534a8775b21_581_1.png)\n\n- 3. Now, we can enable\
  \ editing for the line layer and then select the **Add Feature** tool from the **Digitizing**\
  \ toolbar to start digitizing.\n\n- 4. Create the first line feature now, and give\
  \ it the ID number 1. The line can have as many nodes as you wish. We'll create\
  \ a line with four nodes, as shown in the following screenshot:\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_582_0.png)\n\
  \n- 5. To draw the second line feature, start at the first or the last node of line\
  \ 1. As we have activated snapping, you will see that the node is being highlighted\
  \ if you hover over it with the mouse cursor. Draw a second line and give it the\
  \ ID number 2.\n\n> The line in the preceding screenshot is drawn with a style that\
  \ has circles on the starting and ending points. You can reproduce this style by\
  \ adding the Marker line symbol levels to the line style or load network_links.qml\
  \ from our sample data. For more details about styling features, please refer to\
  \ Chapter 10, Cartography Tips.\n\n- 6. Draw a few more lines (around 12 in total)\
  \ forming a network. Make sure to pay attention to the snapping and assign link\
  \ IDs:\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_582_1.png)\n\n- 7. Disable editing,\
  \ and confirm that you want to save the changes.\n\nWe will use this basic network\
  \ as a starting point for the remaining recipes in this chapter.\n\n### How it works...\n\
  \nBy setting the snapping mode to **to vertex**, we made it possible to digitize\
  \ the line network in a way that ensures that lines, which should be connected,\
  \ really contain a node at the exact same position.\n\n### There's more...\n\nYou\
  \ can validate the network topology by running the Topology Checker plugin, which\
  \ is installed with QGIS by default (you can read more about Topology Checker in\
  \ Chapter 12, *Up and Coming*):\n\n- 1. Start **Topology Checker** from the **Vector**\
  \ menu.\n- 2. Click **Configure** to set up a topology rule, as shown in the following\
  \ screenshot, and click on **Add Rule** to add it to the list of rules to check.\
  \ Then, close the settings by clicking on **OK**:\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_583_0.png)\n\
  \n- 3. Once this tool is configured, click on **Validate All** (the button with\
  \ the checkmark) to initiate the check. You will see the list of discovered errors\
  \ displayed in the list above the buttons, as shown in the following screenshot.\
  \ Additionally, the dangling ends are highlighted in red in the map:\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_583_1.png)\n\
  \n- 4. You can select the error entries in the list to jump to the line features\
  \ that failed the check. In our network, only lines with dead-ends should be listed.\
  \ If you see an error at an intersection, you should zoom closer and try to correct\
  \ the node positions.\n\n## Calculating the shortest paths using the Road graph\
  \ plugin\n\nThis recipe shows you how to use the built-in Road graph plugin to calculate\
  \ the shortest paths in a network.\n\n### Getting ready\n\nTo follow this recipe,\
  \ load network_pgr.shp from the sample data. Additionally, make sure that the Road\
  \ graph plugin is enabled in Plugin Manager.\n\n### How to do it...\n\nThe Road\
  \ graph plugin enables us to route between two points that are selected on the map.\
  \ Before we can use this, we have to configure it first, as follows:\n\n- 1. Enable\
  \ the Shortest path panel by navigating to View | Panels. This should add the plugin\
  \ panel to the user interface.\n- 2. Go to Vector | Road graph | Settings to get\
  \ to the configuration dialog. For now, the default settings, as shown in the following\
  \ screenshot, should be fine. Note that the network layer is selected as Transportation\
  \ layer. Click on OK to confirm the settings:\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_584_0.png)\n\
  \n- 3. Once the settings are configured, we can calculate our first route. Select\
  \ the **Start** and **Stop** locations using the buttons marked with crosshair icons.\
  \ Activate the crosshair button and then click in the map to select a location.\
  \ This location will be marked on the map, and the coordinates will be automatically\
  \ inserted into the **Start** or **Stop** input field.\n- 4. Click on **Calculate**\
  \ to initiate route computation. Depending on the size of the network used, this\
  \ step will either be very fast or it can take much more time. The route will be\
  \ highlighted in the map, and the route length and travel time will be displayed,\
  \ as shown in the following screenshot:\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_585_0.png)\n\
  \n- 5. If you want to store the computed shortest path, click on **Export** and\
  \ you will be able to choose whether you want to create a new layer for the path\
  \ or add the route to an existing line layer.\n- 6. To compute a new route, simply\
  \ change the start and stop locations and click on **Calculate** again.\n- 7. Click\
  \ on **Clear** to remove the route highlights when you are done.\n\n### How it works...\n\
  \nThe Road graph plugin uses the QGIS network analysis library, which implements\
  \ Dijkstra's algorithm. For a given starting node, the algorithm finds the path\
  \ with the lowest cost (that is, the shortest path if the cost criterion is length\
  \ or the fastest path if the cost criterion is time) between this node and every\
  \ other node in the network. This can also be used to find costs of the shortest\
  \ paths from a start node to a destination node by stopping the algorithm once the\
  \ shortest path to the destination node has been determined.\n\n\n\n\n\n与许多简单的路由工具不同，Road\
  \ graph 插件能够自动构建网络拓扑。由于我们的网络数据集在拓扑上是健全的（即网络边相交处没有细小的间隙），我们可以将 Road graph 插件设置中的\
  \ **Topology tolerance** 设置为 0。如果您使用的是来自其他来源的网络，则可能没有以同样的细致程度创建，您可能需要增加 **Topology\
  \ tolerance** 才能使路由工作。\n\n## See also\n- 如果您有兴趣了解更多关于此算法的信息，可以从 `http://wiki.gis.com/wiki/index.php/Dijkstra's_algorithm`\
  \ 开始\n\n## Routing with one-way streets in the Road graph plugin\n\n在车辆路由方面，通常有必要进行更详细的考虑并考虑驾驶限制，例如单行道。本教程将向您展示如何使用单行道信息通过\
  \ Road graph 插件进行路由。\n\n### Getting ready\n\n要遵循本教程，请从示例数据中加载 `network_pgr.shp`。此外，请确保在插件管理器中启用了\
  \ Road graph 插件。\n\n### How to do it...\n\n为了演示使用单行道信息进行路由，我们将首先可视化单行道值，然后配置 Road\
  \ graph 插件以使用单行道信息，具体如下：\n\n- 1. 在开始使用单行道信息进行路由之前，可视化单行道会很有帮助。值得注意的是，单行道方向将取决于链接几何的方向（即链接数字化时的方向）。可视化链接方向的最佳方式是分配箭头符号，如以下屏幕截图所示。您可以从我们的示例数据中加载\
  \ `network_pgr.qml` 来获取样式：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_587_0.png)\n\
  \n编码单行道信息的方式有很多种。在我们的数据集中，正向方向编码为 FT 表示“from-to”，反向方向编码为 TF 表示“to-from”，双向编码为 B\
  \ 表示“both”。\n\n- 2. 然后，我们可以配置 Road graph 插件以使用单行道信息。为此，我们必须选择 dir 属性作为 Direction\
  \ field，并输入正向（在链接几何中）和反向（与链接几何相反）方向的值：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_587_1.png)\n\
  \n3. 配置插件后，您可以按照上一教程 Calculating the shortest paths using the Road graph plugin\
  \ 中描述的方法计算最短路径。您将看到生成的路线与正常（无单行道限制）路径不同，如以下屏幕截图所示，其中算法避开了直线上的一段单行道链接，而是选择了更长的路线：\n\
  \n![](img/2e88bf5938bf48a409c0a534a8775b21_588_0.png)\n\n### How it works...\n\n\
  当我们使用默认的双向设置时，每个网络链接都被解释为从起始节点到结束节点的连接，以及从结束节点到起始节点的连接。通过添加单行道限制，这会发生变化，链接现在仅被解释为一个连接。\n\
  \n除了 **FT**、**TF** 和 **B** 之外，编码单行道的另一种常见方式是 **1** 表示链接方向内，**-1** 表示与链接方向相反，**0**\
  \ 表示双向。在 OpenStreetMap 中，您会找到 **yes** 表示链接方向内，**no** 表示双向以及 **-1** 表示与链接方向相反（有关更多详细信息，请参阅\
  \ `http://wiki.openstreetmap.org/wiki/Key:oneway`）。\n\n## Calculating the shortest\
  \ paths with the QGIS network analysis library\n\n如教程 Calculating the shortest paths\
  \ using the Road graph plugin 中所述，QGIS 附带了一个网络分析库，可以从 Python 控制台、插件、处理脚本以及您能想到的任何其他地方使用。在本教程中，我们将介绍如何在\
  \ Python 控制台中使用网络分析来计算最短路径。\n\n### Getting ready\n\n要遵循本教程，请从示例数据中加载 network_pgr.shp。\n\
  \n### How to do it...\n\n我们建议不要直接在 Python 控制台中键入或复制以下脚本，而是使用 Python 控制台左侧的 Show\
  \ editor 按钮打开 Python 控制台编辑器：\n\n- 1. 将以下脚本粘贴到编辑器中：\n\n```\nimport processing\nfrom\
  \ processing.tools.vector import VectorWriter\nfrom PyQt4.QtCore import *\nfrom\
  \ qgis.core import *\nfrom qgis.networkanalysis import *\n\n# create the graph\n\
  layer = processing.getObject('network_pgr')\ndirector = QgsLineVectorLayerDirector(layer,-1,'','',\
  \ '',3)\ndirector.addProperter(QgsDistanceArcProperter())\nbuilder = QgsGraphBuilder(layer.crs())\n\
  from_point = QgsPoint(2.73343,3.00581)\nto_point = QgsPoint(0.483584,2.01487)\n\
  tied_points = \n    director.makeGraph(builder,[from_point,to_point])\ngraph = builder.graph()\n\
  \n# compute the route from from_id to to_id\nfrom_id = graph.findVertex(tied_points[0])\n\
  to_id = graph.findVertex(tied_points[1])\n(tree,cost) = QgsGraphAnalyzer.dijkstra(graph,from_id,0)\n\
  \n# assemble the route\nroute_points = []\ncurPos = to_id\nwhile (curPos != from_id):\n\
  \    in_vertex = graph.arc(tree[curPos]).inVertex()\n    route_points.append(graph.vertex(in_vertex).point())\n\
  \    curPos = graph.arc(tree[curPos]).outVertex()\nroute_points.append(from_point)\n\
  ```\n\n```\n```python\n# write the results to a Shapefile\nresult = 'C:\\\\temp\\\
  \\route.shp'\nwriter = VectorWriter(result,None,[],2,layer.crs())\nfet = QgsFeature()\n\
  fet.setGeometry(QgsGeometry.fromPolyline(route_points))\nwriter.addFeature(fet)\n\
  del writer\nprocessing.load(result)\n```\n```\n\n- 2. 如果您使用的是自己的网络数据集而不是随本书提供的 `network_pgr.shp`，请调整\
  \ `from_point` 和 `to_point` 的坐标以对应路线的起点和终点。\n- 3. 根据您的操作系统更改结果图层的路径。\n- 4. 确保网络图层已加载并在\
  \ QGIS 图层列表中被选中。\n- 5. 保存脚本并运行它。\n\n### How it works...\n\n第 8 行，我们创建了一个 `QgsLineVectorLayerDirector`\
  \ 对象（http://qgis.org/api/classQgsLineVectorLayerDirector.html），其中包含网络配置。构造函数（`QgsLineVectorLayerDirector(layer,-1,'','','',3)`）参数如下：\n\
  \n- 网络线图层\n- 方向字段的 ID：我们将其设置为 -1，因为此脚本不考虑单行道\n- 以下三个参数是链接方向内的值：反向链接方向和双向\n- 最后一个参数是默认方向：1\
  \ 表示链接方向内，2 表示反向方向，3 表示双向\n\n第 10 行创建了 `QgsGraphBuilder`（http://qgis.org/api/classQgsGraphBuilder.html）实例，该实例将在第\
  \ 14 行用于创建路由图。\n\n第 11 行和第 12 行，我们定义了路线的起点和终点。为了能够在这两个点之间路由，它们必须与最近的网络链接匹配。这发生在第\
  \ 13 行的 `makeGraph()` 函数中，该函数返回所谓的 `tied_points`。\n\n实际的路线计算发生在第 18 行的 `QgsGraphAnalyzer.dijkstra()`（http://qgis.org/api/classQgsGraphAnalyzer.html）函数中。\n\
  \n从第 22 行开始的 while 循环是脚本遍历 Dijkstra 算法创建的树以收集路径上的所有顶点并将它们添加到 route_points 列表中的位置，该列表在第\
  \ 31 行成为生成的路线几何。\n\n输出路线线图层的写入器在第 29 行创建，我们传递文件路径、None 表示默认编码、[] 表示空字段列表，以及 2 表示几何类型，等同于线以及结果图层\
  \ CRS。接下来的第 30 到 32 行创建路线要素并将其添加到写入器中。\n\n最后，最后一条语句加载生成的 shapefile，并在地图上显示，如以下屏幕截图所示：\n\
  \n![](img/2e88bf5938bf48a409c0a534a8775b21_591_0.png)\n\n## See also\n\n您可以在 PyQGIS\
  \ Developer Cookbook 中在线阅读有关 QGIS 网络分析库的更多信息，网址为 http://docs.qgis.org/testing/en/docs/pyqgis_developer_cookbook/network_analysis.html。\n\
  \n\n\n\n\n## 路由点序列\n\n在之前的配方中，我们从一个起点路由到一个目的地。另一个用例是当我们想要计算连接一系列点的路线时，例如 GPS 轨迹中的点。在本配方中，我们将使用点图层路由处理脚本来为点序列计算路线。其核心使用的是在上一配方《使用\
  \ QGIS 网络分析库计算最短路径》中介绍的相同思路，但这里是依次计算多条最短路径。\n\n### 准备工作\n\n要遵循本配方，请加载 network_pgr.shp\
  \ 和 sample_pts_for_routing.shp，其中包含应从示例数据集中路由的点图层。\n\n此外，您需要从 https://raw.githubusercontent.com/anitagraser/QGIS-Processing-tools/master/2.6/scripts/point_layer_to_route.py\
  \ 获取点图层路由脚本并将其保存到 Processing 脚本文件夹中，该文件夹在 Windows 上默认为 C:\\Users\\youruser\\qgis2\\\
  processing\\scripts，在 Linux 上默认为 /home/youruser/.qgis2/processing/scripts，在 Mac\
  \ 上默认为 /Users/youruser/.qgis2/processing/scripts。或者，将点图层路由保存到 Processing 菜单下选项 |\
  \ 脚本 | 脚本文件夹 中配置的文件夹。\n\n### 操作方法...\n\n要计算输入点之间的路线，您需要执行以下任务：\n\n- 1. 加载网络和点图层。\n\
  - 2. 如果您使用的是自己的数据，请确保两个图层使用相同的 CRS。如果它们使用不同的 CRS，您需要在继续之前重新投影它们（例如，使用 Processing\
  \ 工具箱选项中的重投影图层工具）。\n- 3. 从 Processing 工具箱选项启动点图层路由工具。\n- 4. 选择点和网络输入图层，确保已激活运行算法后打开输出文件选项，然后单击运行开始路线计算。生成的路线图层将自动加载：\n\
  \n![](img/2e88bf5938bf48a409c0a534a8775b21_593_0.png)\n\n### 工作原理...\n\n**点图层路由**\
  \ 工具使用 QGIS 网络分析库。我们已在上一配方 *使用 QGIS 网络分析库计算最短路径* 中讨论过该库的基本用法。主要区别在于我们现在必须处理多于两个点。因此，脚本从输入点图层获取所有点并将它们绑定或匹配到图上：\n\
  \n```\npoints = []\nfeatures = processing.features(point_layer)\nfor f in features:\n\
  \    points.append(f.geometry().asPoint())\ntiedPoints = director.makeGraph(builder,\
  \ points)\n```\n\n对于每对连续点，脚本然后像在 *使用 QGIS 网络分析库计算最短路径* 配方中那样计算两点之间的路线：\n\n```\n\
  point_count = point_layer.featureCount()\nfor i in range(0,point_count-1):\n   \
  \ # compute the route between two consecutive points\n```\n\n生成的路线线图层包含每个连续点对的一个线要素。\n\
  \n### 还有更多...\n\n当然，您也可以使用 **点图层路由** 工具在仅两个点之间进行路由。\n\n### 另请参阅\n\n还有一个脚本版本，可考虑单向信息，网址为\
  \ https://raw.githubusercontent.com/anitagraser/QGIS-Processing-tools/master/2.2/scripts/point_layer_to_route_with_oneways.py。\n\
  \n## 使用批处理自动化多条路线计算\n\n如果您有多个输入点图层，可以使用 Processing 的批处理功能来加快处理速度。在本配方中，我们将同时为两个输入点图层计算路线，但同样的方法可以应用于更多图层。\n\
  \n### 准备工作\n\n要遵循本配方，请加载 network_pgr.shp 和两个点图层，sample_pts_for_routing.shp 和 sample_pts_for_routing2.shp。\n\
  \n### 操作方法...\n\n首先，在 Processing 工具箱选项中右键单击点图层路由工具并选择作为批处理执行。然后执行以下步骤：\n\n- 1. 在\
  \ points 列中，单击 ... 按钮并使用从打开图层中选择选项选择 sample_pts_for_routing 和 sample_pts_for_routing2。\n\
  - 2. 使用对话框底部的删除行按钮选择并删除第三行。\n- 3. 在 network 列中，单击 ... 按钮并使用从打开图层中选择选项选择 network_pgr。您可以通过双击表头项（其中显示\
  \ network）来避免重复选择文件。这将使用相同的网络文件路径自动填充所有行。\n- 4. 在 routes 列中，您需要为生成的路线文件选择一个路径。在单击\
  \ ... 按钮时打开的另存为文件对话框中，您可以指定一个基本文件名并单击保存。以下自动填充设置对话框让您指定是否以及如何填充行。使用自动填充模式用数字填充，Processing\
  \ 将自动在您指定的文件名后附加递增编号。您可以在以下屏幕截图中看到一个示例，其中我们将 route 指定为基本文件名。\n\n5. 单击运行以执行批处理。两条路线都将被计算并自动加载：\n\
  \n![](img/2e88bf5938bf48a409c0a534a8775b21_595_0.png)\n\n## 将点匹配到最近的线\n\n在本配方中，我们将使用\
  \ Python 控制台中的 QGIS 网络分析库将点匹配到最近的线。这是也称为地图匹配的最简单形式。\n\n### 准备工作\n\n要遵循本配方，请从示例数据加载\
  \ network_pgr.shp。\n\n### 操作方法...\n\n以下脚本将匹配三个点，QgsPoint(3.63715,3.60401)、QgsPoint(3.86250,1.58906)\
  \ 和 QgsPoint(0.42913,2.26512)，到网络上：\n\n- 1. 打开 Python 控制台及其编辑器，然后加载或粘贴以下 network_analysis_match_points.py\
  \ 脚本：\n\n```\nimport processing\nfrom processing.tools.vector import VectorWriter\n\
  from PyQt4.QtCore import *\nfrom qgis.core import *\nfrom qgis.networkanalysis import\
  \ *\n\nlayer = processing.getObject('network_pgr')\ndirector = QgsLineVectorLayerDirector(layer,-1,'','','',3)\n\
  director.addProperter(QgsDistanceArcProperter())\nbuilder = QgsGraphBuilder(layer.crs())\n\
  additional_points =\n[QgsPoint(3.63715,3.60401),QgsPoint(3.86250,1.58906),QgsPoint(0.42913,2.26512)]\n\
  ```\n\n```\ntied_points = director.makeGraph(builder,additional_points)\n\nresult\
  \ = 'C:\\\\temp\\\\matched_pts.shp'\nwriter = VectorWriter(result,None,[],1,layer.crs())\n\
  fet = QgsFeature()\n\nfor pt in tied_points:\n    fet.setGeometry(QgsGeometry.fromPoint(pt))\n\
  \    writer.addFeature(fet)\n\ndel writer\nprocessing.load(result)\n```\n\n- 2.\
  \ 确保网络图层在图层列表中被选中。\n- 3. 运行脚本。结果应自动加载。\n\n### 工作原理...\n\n此脚本使用 QGIS 网络分析库的 makeGraph()\
  \ 函数将点匹配到线的能力。生成的 tied_points 列表包含最接近输入点的网络上点的坐标。\n\n第 15 行上的 1 选项指定输出图层为点类型。\n\n\
  for 循环最后遍历 tied_points 列表中的所有点并创建点要素，然后将它们添加到结果写入器中。\n\n## 为 pgRouting 创建路由网络\n\n\
  本配方向您展示如何将线图层导入 PostGIS 并从中创建一个可路由网络，该网络可被 PostGIS 的路由库 pgRouting 使用。有关 pgRouting\
  \ 的详细信息，请访问项目网站 http://docs.pgrouting.org。\n\n此处不会详细介绍 PostGIS 和 pgRouting 的安装，因为不同操作系统的说明可在项目网站\
  \ http://docs.pgrouting.org/2.0/en/doc/src/installation/index.html 上找到。\n\n如果您使用\
  \ Windows，PostGIS 和 pgRouting 都可以直接从 Stack Builder 应用程序安装，该应用程序由标准 PostgreSQL 安装提供，如\
  \ http://anitagraser.com/2013/07/06/pgrouting-2-0-for-windows-quick-guide/ 中所述。\n\
  \n\n\n\n\n## 准备工作\n\n要跟随本练习，你需要一个启用了 pgRouting 的 PostGIS 数据库。在 QGIS 中，你应该使用 **Add\
  \ PostGIS Layers** 对话框中的 **New** 按钮设置到数据库的连接。此外，你还应从示例数据中加载 `network_pgr.shp`。\n\
  \n## 如何操作...\n\n以下步骤将在你的 PostGIS 数据库中创建一个可路由的网络表：\n\n- 1. 通过导航到 **Database | DB\
  \ Manager** 打开 **DB Manager**。\n- 2. 在对话框左侧的 **Tree** 中，选择你想要加载网络的数据库。\n- 3. 转到\
  \ **Table | Import Layer/File** 以将 `network_pgr`图层加载到你的数据库中，如以下截图所示：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_597_0.png)\n\
  \n## 网络分析\n\n- 4. 在 `network_pgr` 成功导入后，通过按 *F2*、点击相应的工具栏按钮，或在 **Database** 菜单中打开\
  \ DB Manager 的 SQL 窗口。\n- 5. pgRouting 在列数据类型方面有点挑剔。当你看到 **Error, columns 'source',\
  \ 'target' must be of type int4, 'cost' must be of type float8.** 时就会注意到这一点。当我们使用\
  \ QGIS 的 DB Manager 导入 `network_pgr` 时，它会将 cost 列创建为 numeric。由于 pgRouting 不接受 numeric，我们将使用\
  \ **Table | Edit Table in DB Manager** 来编辑 cost 列。点击 **Edit column** 按钮并将 **Type**\
  \ 从 *numeric* 改为 *double precision*（相当于所需的 float8）。\n- 6. 现在数据已加载并就绪，我们可以构建网络拓扑。这将创建一个新的\
  \ `network_pgr_vertices_pgr` 表，其中包含计算出的网络节点。\n\n```\nSELECT pgr_createTopology('network_pgr',0.001);\n\
  ```\n\n- 7. 一旦拓扑就绪，我们可以通过计算从节点编号 16 到节点编号 9 的简单最短路径来测试网络：\n\n```\nSELECT pgr_dijkstra('SELECT\
  \ id, source, target, cost\n  FROM network_pgr', 16, 9, false, false);\n```\n\n\
  这将得到以下结果：\n\n```\n(0,16,6,1)\n(1,17,7,1)\n(2,5,8,1)\n(3,6,9,1)\n(4,11,15,1)\n(5,9,-1,0)\n\
  ```\n\n## 其工作原理...\n\n前面的 `pgr_dijkstra` 查询由以下几部分组成：\n\n- `'SELECT id, source, target,\
  \ cost FROM network_pgr'`: 这是一个 SQL 查询，返回包含以下列的行集：\n- `id`: 这是唯一的边 ID（类型 int4）\n\
  - `source`: 这是边源节点的 ID（类型 int4）\n- `target`: 这是边目标节点的 ID（类型 int4）\n- `cost`: 这是边遍历的成本（类型\
  \ float8）\n- `16, 9`: 这些是路线源节点和目标节点的 ID（类型 int4）\n- `false`: 如果图是有向的，则为 `true`\n\
  - `false`: 如果为 `true`，则 SQL 生成的行集的 `reverse_cost` 列将用于边反向遍历的成本\n\n`pgr_dijkstra`\
  \ 的结果包含我们的路线从起点到目的地所使用的网络链路列表。结果行中的四个值如下：\n\n- `seq`: 这是序列号，告诉我们路线中链路的顺序，从 0 开始\n\
  - `id1`: 这是节点 ID\n- `id2`: 这是边 ID\n- `cost`: 这是链路的成本（可以是距离、行驶时间、货币价值或你选择的任何其他度量）\n\
  \n## 另请参阅\n\n在接下来的配方 *Visualizing pgRouting results in QGIS* 中，我们将看到如何使用 `pgr_dijkstra`\
  \ 的结果在地图上可视化路线。\n\n如果你对更多 pgRouting SQL 配方感兴趣，你可以在 Packt Publishing 出版的 *PostGIS\
  \ Cookbook* 中找到关于此主题的整整一章。\n\n## 在 QGIS 中可视化 pgRouting 结果\n\n在之前的配方 *Creating a\
  \ routing network for pgRouting* 中，我们导入了网络图层，构建了拓扑，并最终测试了路由。在这些结果的基础上，本配方将向你展示如何在\
  \ QGIS 中将路由结果可视化到地图上。\n\n## 准备工作\n\n你应该先完成之前的配方 *Creating a routing network for\
  \ pgRouting*，以设置必要的 PostGIS 表。或者，你也可以使用自己的网络表，但请注意，如果你的表使用不同的列名，你可能需要更改一些 SQL 语句。\n\
  \n## 如何操作...\n\n要在 QGIS 中可视化结果，我们可以使用 DB Manager SQL 窗口，如以下截图所示。我们在此使用的扩展查询将路由结果连接回原始网络表，以获取我们想要在地图上显示的路线链路几何：\n\
  \n- 1. 通过导航到 Database | DB Manager 打开 DB Manager。\n- 2. 在对话框左侧的 Tree 中，选择你想要加载网络的数据库。\n\
  - 3. 打开 DB Manager 的 SQL 窗口并按以下截图所示进行配置：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_600_0.png)\n\
  \n> \U0001F4A1 请注意，SQL 语句末尾不能有分号。否则，将结果加载为新图层将失败。\n\n- 4. 确保 **Geometry** 列已正确选择，然后点击\
  \ **Load now!** 按钮将查询结果加载为新图层，如以下截图所示：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_601_0.png)\n\
  \n## 其工作原理...\n\n由于 pgr_dijkstra 只返回路线边 ID 的列表，我们需要从原始网络表中获取边几何以便在地图上显示路线。因此，我们将路由结果与网络表在\
  \ id2（包含边 ID）和网络表的 id 列上进行连接。\n\n## 另请参阅\n\n为了更方便地在 QGIS 中使用 pgRouting，pgRoutingLayer\
  \ 插件提供了一个 GUI 来访问 pgRouting 的许多函数。你可以在 *Using the pgRoutingLayer plugin for convenience*\
  \ 配方中找到该插件的介绍。\n\n## 使用 pgRoutingLayer 插件以提高便利性\n\n之前的配方 *Visualizing pgRouting\
  \ results in QGIS* 向你展示了如何手动将 pgRouting 结果添加到地图。在本章中，我们将使用 pgRoutingLayer 插件更方便地访问\
  \ pgRouting 提供的函数，包括我们迄今为止使用过的基本算法，如 Dijkstra 算法，以及更复杂的算法，如 `drivingDistance` 和\
  \ `alphashape`，可用于可视化服务区，也称为服务范围。\n\n## 准备工作\n\n你应该先完成之前的配方 *Creating a routing\
  \ network for pgRouting*，以设置必要的 PostGIS 表。或者，你也可以使用自己的网络表，但请注意，如果你的表使用不同的列名，你可能需要更改一些\
  \ SQL 语句。\n\n此外，从 Plugin Installer 安装 pgRoutingLayer 插件。你需要启用实验性插件才能查看它。\n\n## 如何操作...\n\
  \npgRoutingLayer 插件在 QGIS GUI 中添加了一个新面板，允许方便地访问可用的路由函数。以下步骤向你展示如何使用此插件：\n\n- 1.\
  \ 首先，你应该从 **Database** 字段中选择一个包含路由网络表的数据库。下拉列表包含所有配置的 PostGIS 连接。\n- 2. 接下来，你可以从\
  \ **Function** 字段中选择想要使用的函数。让我们先尝试 Dijkstra 算法；选择 `dijkstra` 函数。你会从之前的配方中认出这些参数，我们在其中手动编写了\
  \ pgRouting SQL 查询。\n- 3. 指定网络表 (`edge_table`) 的参数以及 **geometry**、**id**、**source**、**target**\
  \ 和 **cost** 列，如以下截图所示：\n\n## 网络分析\n\n## 其工作原理...\n\n当我们点击 **Run** 按钮时，查询结果会作为临时覆盖层可视化在地图上。如果你想永久保存输出，可以点击\
  \ **Export** 按钮。目前，**Export** 按钮仅适用于路由函数，而不适用于服务区函数。\n\n## 另请参阅\n\n有关 pgRouting\
  \ 算法的详细文档，请参阅项目文档网站 `http://docs.pgrouting.org/2.0/en/doc/index.html`。\n\n## 从 OSM\
  \ 获取网络数据\n\n一个流行的真实世界路由应用数据源是 **OpenStreetMap (OSM)**。本配方向你展示如何使用 osm2po 命令行工具为\
  \ pgRouting 准备 OSM 数据，将 OSM 数据转换为 PostGIS 的插入脚本。最后，我们将使用 pgRoutingLayer 插件测试数据导入。\n\
  \n## 准备工作\n\n从 `http://osm2po.de` 下载 osm2po 并解压下载内容。请注意，osm2po 要求你的机器上安装了 Java。\n\
  \n你还需要一个启用了 pgRouting 的数据库来跟随本配方。\n\n此外，你应该安装并启用 pgRoutingLayer 插件，因为我们将使用它来测试 OSM\
  \ 数据导入。\n\n你可以使用我们示例数据中的 `wake.pbf` OSM 文件，或从 `http://download.geofabrik.de` 等服务下载自己的数据。\n\
  \n## 如何操作...\n\n打开命令行执行以下步骤。如果你正在 Windows 上工作，我们建议使用 osgeo4W Shell：\n\n- 1. 进入 `osm2po`\
  \ 文件夹并在文本编辑器中打开 `osm2po.config`。查找以下配置行并删除行首的 `#` 以激活 pgRouting 导出：\n- `postp.0.class\
  \ = de.cm.osm2po.plugins.postp.PgRoutingWriter`\n\n\n\n\n\n2. 现在使用 osm2po 将 OSM\
  \ .pbf 文件转换为 SQL。请针对你的系统调整文件路径，如下所示：\n\n```text\nD:\\osm2po-5.1.0>java -jar osm2po-core-5.1.0-signed.jar\
  \ prefix=wake\n\"C:\\tmp\\OSM_NorthCarolina\\wake.pbf\"\n```\n\n3. 当 osm2po 运行完成后，你应该会看到以下内容：\n\
  \n```text\nINFO Services started. Waiting for requests at\nhttp://localhost:8888/osm2poService\n\
  ```\n\n4. 现在你应该会在 osm2po 文件夹内找到一个以前缀（即 wake）命名的文件夹。其中包含一个日志文件，该文件又提供了一个用于将 OSM 网络导入\
  \ PostGIS 的命令行模板：\n\n```text\nINFO command line template:\npsql -U [username] -d\
  \ [dbname] -q -f\n\"D:\\osm2po-5.1.0\\wake\\wake_2po_4pgr.sql\"\n```\n\n5. 使用这个模板，我们可以轻松地将\
  \ .sql 文件导入现有数据库，如下所示：\n\n```text\nD:\\osm2po-5.1.0\\wake>psql -U [username] -d\
  \ cookbook -q -f D:\\\nosm2po-5.1.0\\wake\\wake_2po_4pgr.sql\n```\n\n6. 现在，数据已准备好可以在\
  \ QGIS 中使用。当我们连接到 cookbook 数据库时，可以看到 wake_2po_4pgr 表：\n\n7. 最后，我们可以使用 **pgRouting\
  \ Layer** 插件，通过计算 **43679**（**source_id**）源节点编号周围 **0.1** 小时（**distance** 值）的服务区来测试\
  \ OSM 数据导入：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_605_0.png)\n\n## 工作原理...\n\
  \nosm2po 创建的网络表包含以下有用的列（以及其他列）：\n\n- `km`：这是网络边的长度\n- `kmh`：这是边上的速度，取决于街道等级和 osm2po\
  \ 配置中指定的值\n- `cost`：这是使用 km/kmh 计算出的行驶时间\n\n# 7"
- "## 栅格分析 I\n\n在本章中，我们将介绍以下内容：\n\n- 使用栅格计算器\n- 准备高程数据\n- 计算坡度\n- 计算山体阴影图层\n- 分析水文\n\
  - 计算地形指数\n- 使用图形建模器自动化分析任务\n\n# 引言\n\n栅格分析是 GIS 分析中的一个经典领域。本章将向你展示栅格分析中一些最重要且常见的任务。高程数据通常以栅格图层形式存储，而这种格式特别适合进行多种分析。因此，地形分析传统上一直是栅格分析的主要领域之一，我们将向你展示一些与数字高程模型（DEM）相关的常见操作，从简单的分析（如坡度计算）到更复杂的分析（如排水网络勾画或流域提取）。\n\
  \n# 使用栅格计算器\n\n栅格计算器是 QGIS 中最灵活、最通用的工具之一。它允许你基于栅格图层执行代数运算，并计算新图层。本操作指南将向你展示如何使用它。\n\
  \n# 准备工作\n\n打开 `catchment_area.tif` 文件。该文件应类似于以下截图：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_608_0.png)\n\
  \n# 操作步骤...\n\n1. 打开 **处理工具箱** 选项，通过搜索框搜索名为 **栅格计算器** 的算法。双击该算法项以执行它，如下面的截图所示：\n\
  \n这个界面类似于真正的计算器，更加直观和用户友好。另一方面，它缺少处理工具箱栅格计算器中可用的许多函数（例如，我们之前计算的对数不可用）。它也不能用于自动化过程，如脚本或图形模型，这些只能用于处理算法。\n\
  \n另一方面，QGIS 内置计算器支持多波段图层，而处理工具箱中的计算器仅限于单波段图层。\n\n# 另请参阅\n\n- QGIS 栅格计算器在 QGIS 手册中有更详细的描述，请参见\
  \ http://docs.qgis.org/2.8/en/docs/user_manual/working_with_raster/raster_calculator.html\n\
  \n# 准备高程数据\n\n在本操作指南中，我们将向你展示如何在 QGIS 中执行地形分析。地形分析算法假定用作输入的 DEM 具有某些特征，因此了解这些特征并在需要时准备这些\
  \ DEM 非常重要。本操作指南将向你展示如何做到这一点。\n\n# 准备工作\n\n打开 `dem_to_prepare.tif` 图层。该图层包含一个 EPSG:4326\
  \ 坐标系中的 DEM，且高程数据以英尺为单位。这些特征不适合运行大多数地形分析算法，因此我们将修改该图层以获得合适的图层。\n\n# 操作步骤...\n\n\
  1. 使用右键单击图层名称后出现的上下文菜单中的 **另存为...** 条目，将图层重新投影到 EPSG:3857 坐标系。\n2. 打开生成的已重新投影的图层。\n\
  3. 打开处理栅格计算器，在 **输入图层** 字段中将重新投影后的图层作为唯一的栅格输入。在 **公式** 字段中输入 `* 0.3048`。运行该算法。\n\
  \n![](img/2e88bf5938bf48a409c0a534a8775b21_613_0.png)\n\n# 计算坡度\n\n坡度是可以通过 DEM 派生的最基础参数之一。它对应于\
  \ DEM 的一阶导数，表示高程的变化率。它的计算方法是分析每个单元格的高程，并将其与周围单元格的高程进行比较。本操作指南将向你展示如何在 QGIS 中计算坡度。\n\
  \n## 准备工作\n\n打开我们在上一个操作指南中准备的 DEM。\n\n# 栅格分析\n\n# 操作步骤...\n\n1. 在 **处理工具箱** 选项中找到\
  \ **坡度** 算法，双击打开它：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_614_0.png)\n\n2.\
  \ 在 **输入图层** 字段中选择 DEM。\n3. 点击 **运行** 运行算法。\n\n坡度图层将被添加到 QGIS 项目中。\n\n# 工作原理...\n\
  \n坡度是通过分析某个单元格周围的单元格，从 DEM 高程模型中计算得出的。\n该分析由 GDAL 库中的坡度算法执行。\n\n# 更多内容...\n\n在 QGIS\
  \ 中使用坡度算法有几种方法。这里有一些关于此的评论和想法。\n\n# 使用高程值的比率\n\n如果高程单位与水平单位不同，你可以使用栅格计算器进行转换，如上一个操作指南中那样。但是，坡度模块包含一个选项，可以在\
  \ **比例** 字段中输入转换因子来实时转换它们。请注意，此选项在我们将要使用的其他地形分析模块中不可用，因此创建具有正确单位的图层仍然是一种良好的实践，可以在无需任何进一步处理的情况下使用。\n\
  \n# 其他坡度算法\n\n处理框架包含依赖于多个外部应用程序和库的算法。这些库有时包含类似的算法，因此对于给定的分析，有不止一种选择。\n\n如果你使用下拉列表底部的选项将工具箱的显示模式从“简化”切换为“高级”，然后在搜索框中输入\
  \ slope，你会看到类似下面的截图：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_615_0.png)\n\n\
  # 计算坡度\n\n尝试使用 GRASS 或 SAGA 算法来计算坡度。它们每个都有不同的参数和选项，但都执行类似的计算并创建坡度图层。\n\n除了处理框架之外，你还可以使用栅格地形分析插件进行分析。\n\
  \n2. 在 **输入图层** 字段中选择 **DEM**。将其余参数保留为默认值。\n3. 点击 **运行** 运行算法。\n\n山体阴影图层将被添加到 QGIS\
  \ 项目中，如下所示：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_617_0.png)\n\n# 工作原理...\n\
  \n与坡度的情况一样，该算法是 GDAL 库的一部分。你会看到参数与坡度的情况非常相似。这是因为坡度用于计算山体阴影图层。该算法基于每个单元格中的坡度和坡向，并使用由\
  \ **方位角** 和 **高度角** 字段定义的太阳位置，计算该单元格将接收的照明。这是基于焦点分析，因此不考虑阴影，也不是真实的照明值，但它们可用于渲染和显示地形的地形起伏。\n\
  \n你可以尝试更改这些参数的值来改变图层的外观。\n\n# 更多内容...\n\n与坡度的情况一样，还有其他选项可以计算山体阴影。**处理工具箱** 选项中的\
  \ SAGA 算法有一个值得一提的功能。\n\nSAGA 山体阴影算法包含一个名为 **方法** 的字段。该字段用于选择计算山体阴影值的方法，以及可用的最后一种方法。**光线追踪**\
  \ 与其他方法不同，因为它模拟了光的真实行为，进行的分析不是局部的，而是使用 DEM 的完整信息。相反，因为它考虑了周围地形投射的阴影。这会生成更精确的山体阴影图层，但处理时间可能会显著增加。\n\
  \n\n\n\n\n## 使用山体阴影图层增强地图视图\n\n您可以将山体阴影图层与其他图层组合，以增强其外观。\n\n由于您使用DEM计算了山体阴影图层，因此它应该已经与山体阴影本身一起位于QGIS项目中。然而，由于Processing生成的新图层会添加到图层列表中的现有图层之上，DEM将被山体阴影覆盖。将其移动到图层列表顶部，以便您可以看到DEM（而不是山体阴影图层），并对其进行样式设置，使其类似于以下屏幕截图：\n\
  \n![](img/2e88bf5938bf48a409c0a534a8775b21_618_0.png)\n\n让我们看看使用山体阴影图层增强地图视图的步骤：\n\
  \n- 1. 在图层的**属性**对话框中，进入**透明度**部分，并将**全局透明度**值设置为**50%**，如下面的屏幕截图所示：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_618_1.png)\n\
  \n## 如何操作...\n\n- 1. 在**处理工具箱**选项中，找到**填洼**算法并双击打开它：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_620_0.png)\n\
  \n- 2. 在**DEM**字段中选择DEM并运行该算法。这将生成一个新的过滤后的DEM图层。从现在开始，我们将只使用这个DEM，而不是原始DEM。\n\n\
  3. 打开**汇水面积**，并在**高程**字段中选择过滤后的DEM：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_621_0.png)\n\
  \n4. 运行该算法。这将生成一个汇水面积图层：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_621_1.png)\n\
  \n5. 打开**河网**算法并填写，如下面的屏幕截图所示：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_622_0.png)\n\
  \n6. 运行该算法。这将基于汇水面积从DEM中提取河网，然后将其生成为栅格图层和矢量图层：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_623_0.png)\n\
  \n7. 打开**流域盆地**算法并填写，如下面的屏幕截图所示：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_623_1.png)\n\
  \n## 栅格分析 I\n\n8. 运行该算法。这将生成一个栅格图层，其中流域是根据DEM和河网计算出来的。每个流域是一个水文单元，代表流入由河网定义的汇流点的区域：\n\
  \n![](img/2e88bf5938bf48a409c0a534a8775b21_624_0.png)\n\n## 工作原理...\n\n从DEM开始，前面的步骤遵循了水文分析的典型工作流程：\n\
  \n- 首先，填洼。每当您计划进行水文分析时，这是必需的准备。DEM可能包含无法计算流向的洼地，这对模拟水流穿过这些单元的运动来说是一个问题。移除这些洼地可以解决此问题。\n\
  - 汇水面积是从DEM计算的。汇水面积图层中的值代表每个单元上游的区域。也就是说，如果水滴落在该区域内，最终将流过该单元。\n- 汇水面积值高的单元可能包含河流，而值较低的单元则会有坡面流。通过设置汇水面积值的阈值，我们可以将河流单元（高于阈值的单元）与其余单元分开，并提取河网。\n\
  - 最后，我们计算与上一步提取的河网中每个汇流点相关联的流域。\n\n## 扩展...\n\n前面工作流程中的关键参数是汇水面积阈值。如果使用较大的阈值，较少的单元将被视为河流单元，生成的河网将更稀疏。由于流域是基于河网计算的，这将导致流域数量减少。\n\
  \n您可以使用不同的汇水面积阈值自行尝试。在下图中，您可以看到阈值等于1,000,000时的结果：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_625_0.png)\n\
  \n已添加河网，以帮助您理解结果流域集合的结构。\n\n在下图中，您可以看到阈值为50,000,000时的结果：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_625_1.png)\n\
  \n## 栅格分析 I\n\n请注意，在最后一种情况下，由于阈值更高，结果图层中只有一个流域。\n\n阈值以汇水面积的单位表示，由于假设单元格大小为米，因此单位为平方米。\n\
  \n## 计算地形指数\n\n由于地形定义并影响了给定地形中发生的大多数过程，因此可以使用DEM提取许多不同的参数，这些参数为我们提供了有关这些过程的信息。本教程向您展示如何计算一个流行的参数，即地形湿度指数，它基于地形估算土壤湿度。\n\
  \n### 准备工作\n\n打开我们在*准备高程数据*教程中准备的DEM。\n\n### 如何操作...\n\n- 1. 使用**处理工具箱**选项中的SAGA的**坡度、坡向、曲率**算法计算坡度图层。使用**处理工具箱**选项中的**汇水面积**算法计算汇水面积图层。请注意，您必须使用无洼地的DEM，例如我们在上一步骤中使用**填洼**算法生成的DEM。\n\
  \  \n- 打开**处理工具箱**选项中的**地形湿度指数**算法并填写，如下面的屏幕截图所示：\n\n## 工作原理...\n\n该指数结合了影响土壤湿度的两个参数：坡度和汇水面积。如果汇水面积值高，这意味着更多的水将流入该单元，从而增加其土壤湿度。低坡度值也会产生类似效果，因为流入该单元的水不会很快流出。\n\
  \n该算法期望坡度以弧度表示。这就是为什么必须使用**坡度、坡向、曲率**算法的原因，因为它的坡度输出以弧度为单位。您会发现的另一个基于GDAL库的**坡度**算法创建的坡度图层值以度为单位。如果您使用栅格计算器转换其单位，则可以使用该图层。\n\
  \n## 扩展...\n\n在**处理工具箱**选项中的不同算法中可以找到其他基于相同输入图层的指数。水流动力指数和LS因子也都使用坡度和汇水面积作为输入，并且它们可能与潜在侵蚀有关。\n\
  \n## 使用图形建模器自动化分析任务\n\n大多数分析任务涉及使用多个算法。使用不同的数据集或不同的输入参数重复相同的分析需要逐一使用它们，这使得任务繁琐且容易出错。您可以使用Processing图形建模器自动化分析工作流，该建模器允许您以图形方式定义工作流并将其封装在单个算法中。本教程介绍建模器的主要思想，并创建一个简单模型作为示例。\n\
  \n## 准备工作\n\n本教程无需QGIS中的特殊准备，但请确保您已阅读了之前关于计算地形指数的教程。本教程将基于该教程中的工作流创建模型，因此理解它非常重要。\n\
  \n## 栅格分析\n\n3. 单击**确定**将输入添加到画布：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_630_0.png)\n\
  \n4. 切换到**算法**选项卡。双击**坡度、坡向、曲率**算法并设置算法定义，如下面的屏幕截图所示：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_630_1.png)\n\
  \n\n5. 单击“确定”按钮关闭对话框。该算法将被添加到建模器画布中，如下所示：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_631_0.png)\n\
  \n6. 在算法列表中双击“集水区”算法并填写对话框，将其添加到模型中，如以下截图所示：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_631_1.png)\n\
  \n7. 最后，添加“地形湿度指数”算法，并按以下截图所示进行定义：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_632_0.png)\n\
  \n8. 最终模型应类似于以下截图：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_632_1.png)\n"
- "# 8\n\n# 栅格分析 II\n\n在本章中，我们将介绍以下操作步骤：\n\n- 计算 NDVI\n- 处理空值\n- 使用掩膜设置范围\n- 对栅格图层进行采样\n\
  - 可视化多光谱图层\n- 修改并重分类栅格图层中的值\n- 对栅格图层执行监督分类\n\n## 简介\n\n继上一章之后，本章将介绍一些额外的栅格分析技术。本章将展示如何处理图像、如何修改栅格值并进行分类，以及如何将栅格图层与矢量图层结合使用，从而扩展上一章操作步骤中引入的工具集。\n\
  \n## 计算 NDVI\n\n**归一化差分植被指数**是一种非常流行的植被指数，它能为我们提供关于活绿色植被存在与否的有用信息。\n\n### 准备工作\n\
  \nNDVI 的计算使用一个具有红色光谱反射率值的波段，以及另一个具有近红外反射率值的波段。在示例数据集中，您会找到两个名为 `red.tif` 和 `nir.tif`\
  \ 的图像文件，可用于计算 NDVI。还有一个名为 `ndvi.qgs` 的项目，其中包含这两个图层以及与该区域对应的 landsat 影像。请打开此项目。\n\
  \n### 如何操作...\n\n1. 打开“处理工具箱”菜单，找到名为“植被指数[基于坡度]”的算法。双击该算法项以执行它：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_636_0.png)\n\
  \n2. 在“红波段”字段中选择 `red.tif` 图层，在“近红外波段”字段中选择 `nir.tif` 图层。单击“运行”以运行该算法。\n\n3. 该算法将生成一组包含不同植被指数的图层，NDVI\
  \ 就在其中：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_637_0.png)\n\n### 工作原理...\n\n\
  该算法计算的所有植被指数都基于红光与近红外反射率之间的关系。叶片细胞会散射近红外波段的太阳辐射，并吸收红光波段的辐射，因此可根据这两个值预测健康绿色植被的位置。\n\
  \nNDVI 使用下一节给出的公式计算。\n\n### 更多内容...\n\n由于 NDVI 的公式相当简单，您无需使用特定算法，只需打开栅格计算器即可计算。您可以使用处理框架中集成的栅格计算器，或\
  \ QGIS 内置的栅格计算器。以下截图显示了如何基于两个示例图层，在 QGIS 栅格计算器中填写参数以计算 NDVI：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_637_1.png)\n\
  \n## 提取波段\n\n植被指数算法要求红光和红外值位于两个独立的图层中，且每个图层都是单波段。然而，通常它们会出现在同一幅多波段影像中。为了使用这些波段，您必须将它们分离，提取到两个独立的文件中。\n\
  \n这可以使用 GDAL 的 Translate（转换）算法来完成。项目中包含一幅名为 `landsat.tif` 的多波段影像，其中红波段位于第 3 波段，红外波段位于第\
  \ 4 波段：\n\n1. 在“处理工具箱”菜单中打开“Translate（转换）”算法。\n2. 按照以下截图所示填写其参数，以导出红外波段：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_638_0.png)\n\
  \n3. 再次运行，如以下截图所示，以导出红波段：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_639_0.png)\n\
  \nTranslate（转换）算法底层使用 GDAL 库。您也可以从控制台将该库作为独立工具使用。在算法对话框的下方，您会看到一个文本字段，其中会显示与当前算法配置等价的控制台调用。\n\
  \n## 处理空值\n\n空值是一种特殊的值，用于表示给定图层中未定义值的像元。理解如何使用空值非常重要，既可以避免在分析时得到错误结果，也可以将其作为一种工具来获得更好、更正确的结果。本操作步骤解释了栅格图层中空值的一些基本概念。\n\
  \n### 如何操作...\n\n`watershed.tif` 图层包含一个流域的范围。流域内部的像元是水最终会流入流域出口点的像元。其余像元属于另一个流域。要使用流域掩膜对\
  \ DEM 进行掩膜，请按照以下步骤操作：\n\n1. 打开 `watershed.tif` 图层。\n2. 打开识别工具，检查属于流域的像元值是否为 1，而外部的像元值是否为\
  \ `no data`。\n3. 尝试在流域内部和外部单击；在**识别结果**对话框中，您将看到结果，如以下截图所示：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_640_0.png)\n\
  \n4. 现在，让我们计算栅格图层的一些统计数据。在**处理工具箱**菜单中打开**栅格图层统计**算法。\n5. 在**输入图层**字段中选择流域图层，并单击**确定**运行该算法。结果是一段简短的文本输出，类似于以下截图：\n\
  \n![](img/2e88bf5938bf48a409c0a534a8775b21_641_0.png)\n\n仅考虑了值为 1 的像元，图层中的平均值等于\
  \ 1。\n\n该图层有 610 列和 401 行，但有效像元的总数远低于 610 × 410。这些有效像元才是用于计算统计数据的像元。\n\n### 工作原理...\n\
  \n栅格图层总是覆盖一个矩形区域。然而，在某些情况下，图层所代表的地物对象可能不是矩形的。这可能是纯粹的地球物理原因（想象一个包含非水体像元的水温图层）、政治原因（一个国家\
  \ DEM 图层，而邻国没有可用数据），或其他许多原因。无论如何，这些像元都需要一个值来指示没有可用数据。于是选择并使用一个任意值。因此，该值通常是一个对于图层中存储的变量来说不合逻辑和/或不可行的值。\n\
  \n以示例图层为例，使用的值是 -99999，这是为无数据值设置的默认值。这意味着，当识别工具显示 `no data` 时，它实际上在这种情况下选择了 -99999\
  \ 这个值。\n\n处理框架中的算法会系统地忽略无数据像元，不使用它们的值。您可以在前面的示例中清楚地看到这一点。图层中大部分像元的值为 1（属于流域的像元），但其中许多像元的值为\
  \ -99999。因此，像元的平均值本应不等于 1，但由于 -99999 被定义为无数据值，所有值为该值的像元都会被忽略。因此，图层的平均值等于 1。\n\n\
  ### 更多内容...\n\n空值不仅在执行分析时需要考虑，在我们只是想要渲染包含空值的图层时也需要考虑。\n\n## 控制空值的渲染\n\n在渲染栅格图层时，空值也会被单独考虑。您可以选择使用给定颜色（由当前调色板设置）来显示它们，或者完全不渲染它们。要使所有空值像元透明，请打开图层属性并转到“透明度”部分。确保“无数据值”复选框已勾选，如以下截图所示：\n\
  \n![](img/2e88bf5938bf48a409c0a534a8775b21_642_0.png)\n\n\n\n\n\n## 使用掩膜设置范围\n\n\
  可以使用第二个图层作为掩膜来设置图层的范围。本教程将向您展示如何操作。\n\n## 如何操作...\n\n要使用流域掩膜对 DEM 进行掩膜，请按照以下步骤操作：\n\
  \n- 1. 打开 `watershed.tif` 图层和 `dem.tif` 图层。\n- 2. 打开 **Processing Toolbox** 菜单中的\
  \ **Raster Calculator** 算法。\n- 3. 在 **Main input layer** 中选择 DEM，并在 **Additional\
  \ layers** 字段中选择流域图层。\n- 4. 在 **Formula** 字段中输入公式 a*b。\n- 5. 点击 **Run** 运行算法。您将得到一个被掩膜的\
  \ DEM，如下所示：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_643_0.png)\n\n## 其工作原理...\n\
  \n使用栅格计算器时，涉及无数据值的任何运算都会产生另一个无数据值。这意味着，当将 DEM 图层和掩膜图层相乘时，在掩膜图层中包含无数据值的单元格中，结果图层中的值将为无数据值，无论该单元格在\
  \ DEM 图层中的高程值是多少。\n\n由于掩膜图层中流域内的单元格值为 1，因此结果是一个具有流域单元格高程值且其余单元格为无数据值的图层。\n\n## 还有更多...\n\
  \n以下是有关掩膜的一些额外思路。\n\n## 将分析限制在给定区域\n\n一旦我们对感兴趣的区域进行了掩膜，例如本例中的流域，我们执行的所有分析都将限制在此范围内。例如，让我们计算流域的平均高程：\n\
  \n- 1. 打开 **Basic statistics for raster layers** 算法。\n- 2. 在 **Input layer** 字段中选择被掩膜的\
  \ DEM，然后点击 **Run** 运行算法。您将在 **Results** 窗口中获得统计信息：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_644_0.png)\n\
  \n这些值仅使用有效单元格值计算，并忽略无数据值，这意味着它们指的是流域而不是栅格图层的完整范围。\n\n## 移除多余的无数据值\n\n有时，栅格图层中可能存在比所需更多的无数据值，就像所提出的流域图层的情况一样。为了减小图层的范围并仅保留覆盖有效数据的最小范围，您可以使用\
  \ Crop to data 算法：\n\n- 1. 在 Processing Toolbox 菜单中打开 Crop to data 算法。\n- 2. 在 Input\
  \ layer 字段中输入被掩膜的 DEM，然后点击 Run 运行算法。禁用无数据值的透明度后，结果图层应如下所示：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_645_0.png)\n\
  \n> 请注意，如果您选择将无数据单元格渲染为透明像素，则原始图层和裁剪后的图层在视觉上将没有区别。\n\n## 使用矢量掩膜进行掩膜\n\n栅格图层也可以使用多边形矢量图层进行掩膜。watershed.shp\
  \ 文件包含一个多边形，其中包含我们已用于掩膜 DEM 的流域区域。以下是如何在不使用栅格掩膜的情况下使用它来掩膜该 DEM 的方法：\n\n- 1. 打开 Clip\
  \ grid with the polygon 算法。\n- 2. 在 Input 字段中选择 DEM。\n- 3. 在 Polygons 字段中选择矢量图层。\n\
  - 4. 点击 Run 运行算法。裁剪后的图层将被添加到 QGIS 项目中。\n\n在这种情况下，clip 算法会自动将输出图层的范围减少到由多边形图层定义的最小范围，因此之后无需再运行\
  \ Crop to data 算法。\n\n## 采样栅格图层\n\n可以通过查询点坐标处图层的值，将栅格图层的数据添加到点图层中。此过程称为采样，本教程将解释如何执行此操作。\n\
  \n## 准备工作\n\n打开 `dem.tif` 栅格图层和 `dem_points.shp` 矢量图层：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_646_0.png)\n\
  \n## 如何操作...\n\n- 1. 在 **Processing Toolbox** 菜单中，找到 **Add grid values to points**\
  \ 算法并双击打开它：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_646_1.png)\n\n## Raster\
  \ Analysis II\n\n## 还有更多...\n\n这里您可以找到有关在不同情况下如何组合栅格和矢量图层的一些思路。\n\n## 其他栅格-矢量数据传输操作\n\
  \n来自栅格图层的数据也可以添加到其他类型的矢量图层中。对于包含多边形的矢量图层，可以使用 **Grid statistics for polygons** 算法，方法如下：\n\
  \n- 1. 打开我们在上一教程中使用的 `watershed.shp` 文件。\n- 2. 打开 **Grid** statistics in the **Polygons**\
  \ field。\n- 3. 在 **Grids** 字段中选择要裁剪的栅格图层。\n- 4. 在 **Polygons** 字段中选择带有掩膜的多边形图层。\n\
  - 5. 从剩余参数中选择要计算的统计信息。例如，要仅计算平均高程，请保留 **Mean** 字段选中并取消选中其他字段。\n- 6. 点击 **Run** 运行算法。\n\
  \n结果图层是一个新的多边形图层，其中包含流域，并在属性表中添加了一个字段，其中包含每个多边形的平均高程值。\n\n如果选择更多统计信息，结果将添加更多附加字段，每个新计算的参数和每个选定的栅格各一个。\n\
  \n## 可视化多光谱图层\n\n多光谱图层可以根据波段的使用方式以不同方式渲染。本教程将向您展示如何操作并讨论其背后的理论。\n\n## 准备工作\n\n打开\
  \ `landsat.qgs` 项目。\n\n## 如何操作...\n\n- 1. Landsat 影像在默认配置下打开时，看起来类似于以下屏幕截图：\n\n\
  ![](img/2e88bf5938bf48a409c0a534a8775b21_649_0.png)\n\n- 2. 双击图层打开其属性并移动到 **Style**\
  \ 部分：\n  - 1. 在 **Red band** 字段中选择波段号 4。\n  - 2. 在 **Green band** 字段中选择波段号 3。\n\
  \  - 3. 在 **Blue band** 字段中选择波段号 2。\n\n您的样式配置应如下所示：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_649_1.png)\n\
  \n- 3. 点击 **OK**。\n\n## Raster Analysis II\n\n图像现在应如下所示：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_650_0.png)\n\
  \n## 其工作原理...\n\n表示给定像素的颜色使用 RGB 颜色空间定义，需要三个不同的分量。普通图像，例如从数码相机获得的图像，具有包含这三个分量强度——红、绿、蓝——的三个波段。\n\
  \n多光谱波段，例如本教程中使用的波段，具有超过三个波段，并在电磁谱的不同区域提供更多细节。为了可视化这些波段，需要从可用波段总数中选择三个波段，并将其强度用作基本红、绿、蓝分量的强度，尽管它们可能对应于不同的光谱区域，甚至超出可见范围。这被称为\
  \ *假彩色图像*。\n\n根据所使用的波段组合，结果图像将传达不同类型的信息。所选组合经常用于植被研究，因为它可以区分针叶林和阔叶林，并提供有关植被健康的信息。\n\
  \n在此情况下，该组合应用于 Landsat 7 影像，该影像使用 ETM+ 传感器拍摄。每个波段覆盖的波长如下所示，单位为微米：\n\n- **Band 1:**\
  \ 0.45 - 0.515\n- **Band 2:** 0.525 - 0.605\n- **Band 3:** 0.63 - 0.69\n- **Band\
  \ 4:** 0.75 - 0.90\n- **Band 5:** 1.55 - 1.75\n- **Band 6:** 10.40 - 12.5\n- **Band\
  \ 7:** 2.09 - 2.35\n\n## 还有更多...\n\nLandsat 图层经常使用不同的组合。其中之一如下：\n\n- 在 **Red band**\
  \ 字段中选择波段号 3\n- 在 **Green band** 字段中选择波段号 2\n- 在 **Blue band** 字段中选择波段号 1\n\n这是一种自然色组合，因为用于\
  \ **R**、**G** 和 **B** 分量的波段实际上具有对应于颜色 **红**、**绿** 和 **蓝** 的波长：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_651_0.png)\n\
  \n如果您使用的是非 Landsat 7 影像，每个波段将具有不同的含义，使用相同的波段号组合会产生不同的结果。必须检查每个波段的含义以了解渲染图像所显示的信息。\n\
  \n## 另请参阅\n\n- Landsat 数据可免费获取。如果您想下载对应于给定区域的 Landsat 数据，请访问 http://landsat.gsfc.nasa.gov/。在这里，您可以找到有关在哪里以及如何下载它的更多信息。\n\
  \n\n\n\n\n## 修改和重新分类栅格图层中的值\n\n处理栅格数据时非常有用的技术之一是更改其值或将其分组到类别中。在本教程中，我们将了解如何执行此操作。\n\
  \n### 准备工作\n\n打开我们在之前教程中使用的 DEM 文件。\n\n### 操作方法...\n\n我们将把高程分为三组：\n\n- 低于 1,000m\n\
  - 在 1,000 到 2,000m 之间\n- 高于 2,000m\n\n为此，请按照以下步骤操作：\n\n1. 从 **Processing Toolbox**\
  \ 菜单打开 **Change grid values** 算法。将 **Replace condition** 参数设置为 **Low Value <= Grid\
  \ Value < High Value**。\n2. 点击 **Lookup table** 参数中的按钮并填写出现的表格，如以下屏幕截图所示：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_652_0.png)\n\
  \n3. 运行算法。这将创建重新分类的图层：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_653_0.png)\n\n\
  ### 工作原理...\n\n每个单元的值都会与查找表中的范围限制进行比较，并考虑指定的比较条件。每当某个值落入给定范围时，该范围指定的类别值将被用于输出图层。\n\
  \n### 还有更多...\n\n可以使用其他策略来自动化重新分类，尤其是在这涉及将栅格图层值划分为具有某些恒定属性的类别时。在此，我们展示其中两种情况。\n\n\
  #### 重新分类为等振幅类别\n\n重新分类的典型情况是将图层值的总范围划分为给定数量的类别。这类似于将其切片，如果应用于 DEM，例如我们的示例数据，其结果将类似于以规则间隔定义等高线的结果（尽管在这种情况下结果不是具有线的矢量图层，而是新的栅格图层）。\n\
  \n要按等间隔重新分类，请按照以下步骤操作：\n\n1. 从 Processing Toolbox 菜单打开 Raster calculator。\n2. 选择\
  \ DEM 作为唯一要使用的图层。\n3. 输入公式，int((a-514)/(2410-514) * 5)。\n\n重新分类的图层将如下所示：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_654_0.png)\n\
  \n公式中的数值对应于图层的最小值和最大值。您可以在图层的属性窗口中找到这些值。\n\n要创建不同数量的类别，只需在公式中使用 5 以外的其他值即可。\n\n\
  #### 重新分类为等面积类别\n\n没有工具可以将栅格重新分类为 *n* 个类别，使得每个类别占据相同的面积，但可以使用其他算法获得类似的结果。为了向您展示如何操作，让我们将\
  \ DEM 重新分类为五个面积相同的类别：\n\n1. 打开 **Sort grid** 算法并输入 DEM 作为输入图层。点击 **Run** 运行算法。\n\
  \n   生成的图层按 DEM 中的值对单元进行排序，因此值为 1 的单元代表最低高程值，2 是第二低，依此类推。\n\n2. 使用前面描述的程序将排序后的图层重新分类为五个等振幅类别。最终图层应如下所示：\n\
  \n![](img/2e88bf5938bf48a409c0a534a8775b21_654_1.png)\n\n### 另请参阅\n\n- **Processing\
  \ Toolbox** 菜单包含额外的分类算法，其中大多数基于 SAGA。其中一种采用不同方法的算法是 **Cluster analysis for grids**。它将创建给定数量的类别，使组内的方差最小化，力求使其尽可能同质。这也称为无监督分类。\n\
  \n## 对栅格图层进行监督分类\n\n在之前的教程中，我们看到了如何更改栅格图层的值并创建类别。当您有多个图层时，分类可能并不那么容易，并且定义执行此分类的模式可能并不明显。在这种情况下可以使用不同的技术，即定义具有共同特征的区域，并让相应的算法提取定义它们的统计值，以便之后可以将其应用于执行分类本身。这称为\
  \ **Supervised classification**，本教程解释了如何在 QGIS 中执行此操作。\n\n### 准备工作\n\n打开 `classification.qgs`\
  \ 项目。它包含一个 RGB 图像和一个包含多边形的矢量图层。\n\n### 操作方法...\n\n1. 图像必须分离为单独的波段。使用提供的图像作为输入运行\
  \ **Split RGB bands**，您将获得三个名为 R、G 和 B 的图层。\n2. 从 **Processing Toolbox** 菜单打开 **Supervised\
  \ classification** 算法。\n3. 填写其参数窗口，如以下屏幕截图所示：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_656_0.png)\n\
  \n4. 在第一个字段中，您应选择上一步生成的三个图层（R、G 和 B）。\n5. 点击 **OK** 运行算法。将创建两个图层和一个表格。名为 **Classification**\
  \ 的图层包含分类后的栅格图层：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_657_0.png)\n\n### 工作原理...\n\
  \n监督分类需要一组栅格图层和一个包含定义不同类别的多边形的矢量图层。类别的标识符在属性表中的 **Class** 字段中定义。如果您打开属性表，您会看到它看起来像这样：\n\
  \n| ID | BOTYP |\n|---|---|\n| 0 | 1 Forest |\n| 1 | 2 Wheat |\n| 2 | 3 Urban |\n\
  | 3 | 4 Crop |\n| 4 | 5 Crop-clear |\n\n有五个不同的类别，每个类别都由一个要素表示，并带有文本 ID 和数值 ID。分类算法分析落在每个类别多边形内的像素并为其计算统计数据。利用这些统计数据为图像中的每个像素分配一个类别，尝试分配在矢量图层中定义的类别中最统计相似的类别。数值\
  \ ID 用于在生成的栅格图层中标识类别。\n\n### 还有更多...\n\n在 QGIS 中执行监督分类还有其他方法。其中一种允许对过程中的不同元素进行更多控制的方法是使用\
  \ **QGIS semi-automatic classification** 插件。\n\n可以从 **Processing Toolbox** 菜单使用其他更复杂的分类方法。它们可以在工具箱的\
  \ **Advanced** 界面中找到，在 **Orfeo Toolbox** 组下，如以下屏幕截图所示：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_658_0.png)\n\
  \n### 另请参阅\n\n- 您可以使用 QGIS 插件管理器下载并安装它。有关如何使用插件的更多信息，您可以查看其页面 `http://fromgistors.blogspot.fr/p/semi-automatic-classification-plugin.html`。\n"
- "## 9 QGIS 与 Web\n\n在本章中我们将介绍以下教程：\n\n- 使用网络服务\n- 使用 WFS 和 WFS-T\n- 搜索 CSW\n- 使用\
  \ WMS 和 WMS Tiles\n- 使用 WCS\n- 使用 GDAL\n- 使用 QGIS 服务器提供网络地图\n- 基于比例的渲染\n- 连接网络客户端\n\
  - 从 QGIS 管理 GeoServer\n\n### 简介\n\nQGIS 是一个经典的桌面 **地理信息系统 (GIS)**。然而，如今仅处理本地数据是不够的。您希望能够自由使用来自网络的数据，而无需花费数天下载这些数据。同时，您希望能够将地图在线发布给比纸质地图或\
  \ PDF 更广泛的受众。这就是网络服务发挥作用的地方。QGIS 既可以作为网络服务客户端，也可以作为网络服务器，为您提供使用和共享地理数据的许多选项。本章介绍使用地理数据开放网络服务的基础知识以及将地图在线发布的一些方法。\n\
  \n\n\n\n\n# 使用网络服务\n\n有相当多的不同类型的基于网络的地图服务可以在 QGIS 中加载。每种类型的网络服务都提供数据；通常，这是以不同方式提供的相同数据。本教程旨在帮助你确定想要使用哪种类型的网络服务，以及反过来，你可能想要为他人使用而创建哪种类型的网络服务。\n\
  \n## 准备工作\n\n本教程完全是关于思考的，所以你不需要任何特别的东西来开始。如果你有一个项目在考虑中，以及一些你感兴趣使用或创建的数据类型，那就更好了。大多数，如果不是全部，这些方法都需要互联网连接或提供这些服务的本地服务器。当然，如果你有本地数据，你可能最好直接加载它。\n\
  \n为了帮助下面的部分，这里有一个缩写列表：\n\n- **CSW**：这是 **Catalog Service for the Web**\n- **WFS**：这是\
  \ **Web Feature Service**\n- **WFS-T**：这是 **Web Feature Service, Transactional**\n\
  - **WCS**：这是 **Web Coverage Service**\n- **WMS**：这是 **Web Map Service**\n- **WMTS**：这是\
  \ **Web Map Tile Service**\n- **TMS**：这是 **Tile Map Service**\n- **XYZ**：这是一个“X\
  \ Y Z”服务（这个其实没有正式名称，因为它不是官方标准）\n\n## 如何操作...\n\n1. 首先针对通过网络服务使用数据回答以下问题：\n   - 你是否已经知道在哪里找到想要的数据？\n\
  \   - 你是否需要编辑或对该数据应用自定义样式？\n   - 你是否在乎数据是矢量还是栅格？\n   - 你是否需要以原始分辨率或质量获取数据？\n   -\
  \ 你是否需要在特定分辨率或特定投影下获取数据？\n\n2. 使用以下决策矩阵来选择适合你使用场景的服务：\n\n| 判定标准 | CSW | WFS | WFS-T\
  \ | WCS | WMS | 瓦片 (WMTS, XYZ, TMS) |\n|---|---|---|---|---|---|---|\n| 你是否已经知道在哪里找到想要的数据？\
  \ | 否 | 是 | 是 | 是 | 是 | 是 |\n| 你是否需要编辑或对数据应用自定义样式？ |  | 是 | 是 | 是 | 否 | 否 |\n| 你是否在乎数据是矢量还是栅格？\
  \ |  | 矢量 | 矢量 | 栅格 | 栅格 | 栅格 |\n| 你是否需要以原始分辨率或质量获取数据？ |  | 是 | 是 | 是 | 否 | 否 |\n\
  | 你是否需要在特定分辨率或特定投影下获取数据？ |  | 是 | 是 | 是 | 是 | 否 |\n| 本章中的教程编号。 | 3 | 2 | 2 | 5 |\
  \ 4 | 4, 6 |\n\n现在你已经找到了想要使用的网络服务的合适教程，稍后在本章中跳转到该教程。如果你仍然不确定，请继续阅读以获取更多如何选择正确服务的提示。本教程既适用于你如何使用网络服务，也适用于如何决定提供哪些网络服务（如果你为他人提供网络服务）。\n\
  \n总体而言，从左（WFS）到右（瓦片），服务的速度会增加。瓦片以最少的限制为终端用户提供最快的数据服务。\n\n## 其工作原理...\n\n对于每种服务，都有一个\
  \ QGIS 工具（内置或插件）。该工具存储你的网络服务器列表以及每种服务的连接设置。当你去从特定协议的选定网络服务器加载图层时，会从服务器请求最新的图层列表（即\
  \ GetCapabilities XML）。然后你就可以从该列表中挑选想要添加到地图画布上的图层（并且根据服务类型、投影和文件类型不同）。\n\n## 还有更多...\n\
  \n矢量通常较慢，因为随着数据的增长，需要传输的数据更多。栅格格式在屏幕上是固定数量的像素，因此每次屏幕加载的数据量大致相同。\n\nWMS、WMTS、WFS\
  \ 和 WCS 有时被称为 W*S，作为一组行为相似的相关服务的统称。\n\n每个情况都会有额外的考虑。例如，如果你需要特定投影，你可能无法使用瓦片服务，因为这些服务通常只在非常特定的投影中（Web/Spherical\
  \ Mercator）。或者，也许你想要打印大张纸质地图。那么，你可能希望使用 WFS 或 WCS 以获得整个区域的最大可能分辨率。\n\n最常见的错误之一是认为你需要矢量数据，而实际上你只需要一个包含矢量数据的背景瓦片。一个很好的例子是道路数据。如果你实际上不需要样式化、选择或单独操作道路数据，那么瓦片或\
  \ WMS 类型的图层会快得多。\n\n## 另请参阅\n\n- 如需更多信息，请阅读 OGC 网站上的标准，http://opengeospatial.org\n\
  \n# 使用 WFS 和 WFS-T\n\nWeb Feature Services（WFS）是 OGC 的标准方法，用于通过互联网访问并在某些情况下编辑（WFS-T）矢量数据。当你需要完整的属性表、本地样式控制或编辑功能时，WFS\
  \ 是最佳选择。与大多数其他网络服务一样，与本地图层相比最大的优势是你不必一次复制或加载整个图层。\n\n如果你只是需要查看图层，通常 WMS 或瓦片服务（在本章其他教程中描述）更有效。\n\
  \n## 准备工作\n\n你需要一个 WFS 服务的 URL 以及一个可用的互联网连接。我们将使用公共的 Mapserver 演示网站（http://demo.mapserver.org/）。\n\
  \n要尝试涉及编辑的 WFS-T，你需要获得对服务的访问权限（通常受密码保护）或自己搭建一个。你需要一个 WFS-T 测试服务器吗？这是一个 OSGeo-Live\
  \ 派上用场的好例子，因为你可以在虚拟机中运行自己的 WFS-T 服务器，网址为 http://live.osgeo.org。\n\n## 如何操作...\n\n\
  1. 找到你想要使用的 WFS 服务并复制 GetCapabilities URL。对于本示例，我们将使用 Mapserver 演示网站，`http://demo.mapserver.org/`。\n\
  \n> 与其他网络服务一样，如果你先加载本地图层并缩放至其范围，则更有效。这可以让你避免为超出你感兴趣区域的范围加载网络服务数据而浪费时间。\n\n2. 通过点击以下图标打开添加\
  \ WFS 对话框：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_663_0.png)\n\n3. 创建一个 **New**\
  \ 连接。\n\n4. 分配你选择的 **Name** 并将 WFS 服务的 **URL** 粘贴到字段中，（`http://demo.mapserver.org/cgi-bin/wfs?SERVICE=WFS&VERSION=1.0.0&REQUEST=GetCapabilities`）；\n\
  \n![](img/2e88bf5938bf48a409c0a534a8775b21_663_1.png)\n\n> 在未来再次使用同一服务时，它将已在你的服务列表中，因此你只需添加一次。\n\
  \n5. 通过点击 **OK** 按钮保存你的编辑。\n\n6. 现在从下拉菜单中选择该服务。\n\n7. 通过点击 **Connect** 按钮查询图层列表。\n\
  \n8. 选择你想要添加到地图的图层或图层；对于本示例，`continents` 或 `cities` 都可以：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_664_0.png)\n\
  \n9. 选择完成后，使用 Add 按钮将图层放置到地图中。\n\n10. 通过在列表中上下拖动图层来重新排列地图的渲染顺序。\n\n11. 平移和缩放以对视图加载\
  \ WFS 数据发出新的请求。\n\n> WFS 图层可以用标准图层属性重新样式化。此外，信息工具和属性表将像其他矢量图层一样出现。\n\n## 其工作原理...\n\
  \n对于每个网络服务，都有一个主 URL。当你浏览到此 URL 并添加 GetCapabilities 参数（QGIS 会为你完成），返回的结果是一个 XML\
  \ 文件，其中描述了服务器提供的服务。客户端 QGIS 会为你解析图层列表以供选择，一旦你选择了图层（们），就会使用 XML 中的额外信息在特定 URL 上查找数据。\n\
  \n数据请求仅限于地图画布的可见边界框。这限制了请求的数据量。至少应该是这样工作。然而，超出屏幕的要素可能会完整包含以保持几何完整性。因此，预计通过 WFS 加载大型矢量图层可能会极其缓慢。\n\
  \n\n\n\n## 更多内容...\n\nWFS-T 服务通常需要密码，并设计为通过互联网工作。如果你在本地网络中工作，可以考虑直接使用 PostGIS 图层。无论如何，还应注意版本控制和冲突解决不是自动的，需要将服务后端配置为支持这些功能。\n\
  \n## 搜索 CSW\n\nCSW 是一种目录 Web 服务。其主要功能是提供地理数据的可发现性，并通过下载或本章提到的任何其他 Web 服务链接到可用数据。\n\
  \n## 准备工作\n\n本方法使用 MetaSearch 插件。它需要你的系统 Python 中安装 pycsw 和 owslib 库。如果你不知道如何安装\
  \ pycsw 和 owslib，请参阅第 11 章“扩展 QGIS”中的“添加带有 Python 依赖的插件”方法。\n\n## 操作方法...\n\n- 1.\
  \ 通过导航到 Web | MetaSearch | MetaSearch 打开 MetaSearch 插件。\n- 2. 从右侧的下拉菜单中选择一个服务：英国位置目录发布服务（UK\
  \ Location Catalogue Publishing Service）。\n- 3. 在左侧的框中输入搜索词：Park。\n\n> 如果你看不到 Web\
  \ 菜单，请检查插件管理器并确保 MetaSearch 已启用（勾选）。\n\n> 如果下拉列表中没有显示任何服务，请单击“服务”选项卡，并使用“添加默认服务”按钮。\n\
  \n## QGIS 与 Web\n\n- 4. （可选）设置范围以限制搜索。在这种情况下，使用**地图范围**。\n\n> 全局搜索通常会返回过多结果，或者在等待所有结果时导致连接超时。与其他\
  \ Web 服务一样，建议先加载参考图层并缩放到感兴趣区域，然后再尝试搜索它们。第三个选项卡**设置**允许你调整超时时间。如果遇到太多超时错误，请增大此值。\n\
  \n- 5. 单击**搜索**按钮并等待结果：\n\n- 1. 双击任意结果以查看其他详细信息。\n- 2. 如果所选结果可作为可加载图层，则屏幕底部的一个或多个服务按钮将启用。要了解更多关于如何使用这些选项的信息，请参阅本章中关于\
  \ WMS、WFS 和 WCS 的其他方法：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_666_0.png)\n\n\
  ## QGIS 与 Web\n\n## 准备工作\n\nWMS 有多种迭代版本，QGIS 支持其中的大多数。要使用 WMS，你需要向 QGIS 提供要查看数据服务的\
  \ GetCapabilities URL。\n\n## 操作方法....\n\n- 1. 找到一个你想要使用的 WMS 服务，并复制 GetCapabilities\
  \ URL。在本方法中，我们可以使用 Geoserver 演示网站（`http://demo.opengeo.org/geoserver/web/`）。\n\n\
  > 与其他 Web 服务一样，如果你先加载本地图层并缩放到它们的范围，效率会更高。这样你就不会浪费时间从 Web 服务加载感兴趣区域之外的数据。\n\n- 2.\
  \ 打开**添加 WMS** 对话框。\n- 3. 创建一个**新连接**。\n- 4. 指定一个你选择的**名称**，并将**URL**（`http://demo.opengeo.org/geoserver/ows?service=wms&version=1.3.0&request=GetCapabilities`）粘贴到其中：\n\
  \n![](img/2e88bf5938bf48a409c0a534a8775b21_668_0.png)\n\n## QGIS 与 Web\n\n- - 选择投影时，如果可以使用数据的原始投影（如果你知道），你会得到最少的重采样。否则，请选择与你计划与\
  \ WMS 结合使用的其他数据相匹配的投影。\n\n> 并非所有图像类型和投影都可用；这取决于服务器提供的内容。如果一种图像类型似乎不起作用，请在报告服务器故障之前尝试另一种。\n\
  \n- 10. 当你的选择完成后，使用**添加**按钮将图层放到地图中。\n- 11. 通过上下拖动列表中的图层来重新排列地图的渲染顺序。\n- 12. 平移和缩放以发出新的请求，将\
  \ WMS 数据加载到视图中。\n\n## 工作原理...\n\n当你平移和缩放地图时，一个带有可见范围和比例边界框的请求被发送到服务。然后服务器渲染一个与请求匹配的图像，并将其传回客户端（在本例中为\
  \ QGIS）。\n\n## 更多内容...\n\n现在一些 WMS 服务还支持在 **Web 地图瓦片服务（WMTS）** 协议下进行瓦片化。从客户端的角度来看，在使用上与\
  \ WMS 没有太大区别。在服务器端，每次请求后结果都会被缓存，所以如果请求相同的范围和比例，可以传递缓存版本，而不是从头创建结果。对你这个最终用户来说，如果服务提供\
  \ WMTS，这应该会带来更快的加载速度。\n\n配置 WMTS 时，使用 WMTS URL 而不是 WMS URL。一个例子是 Geoserver 演示网站的\
  \ WMTS：\n\n```\nhttp://demo.opengeo.org/geoserver/gwc/service/\nwmts?REQUEST=GetCapabilities\n\
  ```\n\n一旦成功，你将进入**瓦片集**选项卡，在那里可以选择要加载的可用选项中的图层和投影。由于瓦片是预制的或缓存的，你通常无法同时组合多个图层，需要一次加载一个：\n\
  \n![](img/2e88bf5938bf48a409c0a534a8775b21_671_0.png)\n\n> \U0001F4A1 WMS-C 是 WMTS\
  \ 标准的早期版本。在使用上几乎相同，尽管 URL 模式可能看起来更像 WMS。\n\n## 另请参阅\n\n- - 有关 QGIS 的 WMS 功能的更多信息，请参阅\
  \ QGIS 文档，网址为 `http://docs.qgis.org/2.8/en/docs/user_manual/working_with_ogc/ogc_client_support.html#ogc-wms`\n\
  \n## 使用 WCS\n\n**Web 覆盖服务（WCS）** 在用例上与其他服务有很大不同，但行为非常相似。WCS 的目标是允许用户从远程托管的大型栅格数据中提取感兴趣区域。与\
  \ WMS 或瓦片集不同，WCS 是原始数据的裁剪，具有完整分辨率，通常采用原始投影。如果你需要栅格数据用于分析目的而不仅仅是可视化，这种格式非常理想。\n\n\
  - 7. 现在，你将回到**从 WCS 服务器添加图层**对话框：\n  - 1. 单击**连接**按钮。\n  - 2. 列表填充后，选择要添加到地图的图层。单击**添加**按钮。尝试使用\
  \ Blue Marble 图层。\n  - 3. 现在，单击**关闭**按钮返回你的地图：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_673_0.png)\n\
  \n- 8. 你现在应该看到 Blue Marble 图层已加载。\n\n> > 如果你放大到美国州或欧洲国家的级别，你会看到图像开始像素化。Blue Marble\
  \ 是美国国家航空航天局（NASA）制作的低分辨率图像，大致展示了从太空中看到的无云地球全貌。它旨在提供整个世界的一般视图，不包含精细细节。\n\n- 9. （可选）使用**另存为**选项以完整的原始分辨率下载部分或整个\
  \ WCS 图层。\n\n## 工作原理...\n\nWCS 与其他 Web 服务一样，向服务器发送边界框请求，服务器再将栅格数据传递给 QGIS。与 WMS\
  \ 不同，服务器端不进行渲染，发送的是原始栅格数据。这可能意味着：\n\n- - 图像在发送前没有进行重采样\n- - 你可以对传递的数据应用自己的样式\n\n\
  请记住，请求高分辨率栅格的完整范围将导致大量数据传输。这与瓦片或 WMS 不同，后者最多以请求的分辨率返回可视区域中的确切像素数。\n\n> 与其他 Web 服务一样，建议在加载\
  \ WCS 之前先缩放到你的感兴趣区域。\n\n## 更多内容...\n\nWCS 相较于 WMS 的另一个好处是，由于 WCS 传递原始数据，它不局限于 3\
  \ 波段 RGB 图像。你可以使用 WCS 查看和下载多光谱或高光谱数据（4+ 波段，在遥感应用中很常见）。\n\n> 目前，QGIS 仅支持 1.0.x 和\
  \ 1.1.x，不支持 WCS 2.x；至少目前还不支持！\n\n## 使用 GDAL\n\n正如第 4 章“数据探索”中的“使用 QuickMapServices\
  \ 插件加载底图”和“使用 OpenLayers 插件加载底图”方法所述，QuickMapsServices 和 OpenLayers 插件非常棒，因为它们会在你的地图会话中放置参考图层。然而，一个缺点是添加新图层很麻烦。所以，如果你遇到或构建自己的瓦片服务并想在\
  \ QGIS 中使用它，本方法将让你使用几乎任何瓦片服务。\n\n## 准备工作\n\n你需要一个 Web 浏览器、文本编辑器，以及一个基于 Web 的 XYZ（有时称为\
  \ TMS）服务的 URL——一种允许你无需 API 密钥即可发出请求的服务。我们将使用 http://www.opencyclemap.org/ 上的地图。\n\
  \n```\nhttp://www.opencyclemap.org/\n```\n\n查看 JavaScript 源码（一个好的工具是 Firebug，或其他浏览器\
  \ Web 开发工具），我们可以查看瓦片的源 URL。\n\n\n\n\n\n## 如何操作...\n\n+   1. 在网页浏览器中打开 http://www.opencyclemap.org/。\n\
  +   2. 现在，通过查看源代码来找出瓦片的 URL：\n+      1. 查看 map.js，你会看到图层定义：\n+      2. 或者，你可以查看浏览器下载的图像文件。如果你将\
  \ https://a.tile.thunderforest.com/cycle/13/1325/3143.png 放入浏览器，它会加载那一个瓦片。\n+  \
  \ 3. 模式相当直接：\n+      <server name>/<layer>/<zoom>/<tile index X>/<tile index Y>.<image\
  \ format>\n+   4. 要将其转换为 QGIS 中的图层，打开一个文本编辑器并粘贴以下定义。此定义告诉 GDAL 使用哪个驱动程序以及带有 z、x\
  \ 和 y 作为变量的服务器 URL 模式。将文件保存为 opencyclemap.xml：\n\n```\nvar cycle = new OpenLayers.Layer.OSM(\"\
  OpenCycleMap\",\n  [\"https://a.tile.thunderforest.com/cycle/${z}/${x}/${y}.png\"\
  ,\n  \"https://b.tile.thunderforest.com/cycle/${z}/${x}/${y}.png\",\n  \"https://c.tile.thunderforest.com/cycle/${z}/${x}/${y}.png\"\
  ],\n  { displayOutsideMaxExtent: true,\n    attribution: cycleattrib, transitionEffect:\
  \ 'resize'}\n);\n```\n\n```\nhttps://a.tile.thunderforest.com/cycle/13/1325/3143.png\n\
  ```\n\n```\n<server name>/<layer>/<zoom>/<tile index X>/<tile index Y>.<image format>\n\
  ```\n\n> 在这种特定情况下，Tile Index 模式是 TMS 样式；请参阅 http://www.maptiler.org/google-maps-coordinates-tile-bounds-projection/。\n\
  \n```\n<GDAL_WMS>\n  <Service name=\"TMS\">\n    <ServerUrl>http://c.tile.thunderforest.com/cycle/${z}/${x}/${y}.png</ServerUrl>\n\
  \  </Service>\n  <DataWindow>\n    <UpperLeftX>-20037508.34</UpperLeftX>\n    <UpperLeftY>20037508.34</UpperLeftY>\n\
  \    <LowerRightX>20037508.34</LowerRightX>\n    <LowerRightY>-20037508.34</LowerRightY>\n\
  \    <TileLevel>18</TileLevel>\n    <TileCountX>1</TileCountX>\n<TileCountY>1</TileCountY>\n\
  <YOrigin>top</YOrigin>\n</DataWindow>\n<Projection>EPSG:3785</Projection>\n<BlockSizeX>256</BlockSizeX>\n\
  <BlockSizeY>256</BlockSizeY>\n<BandsCount>3</BandsCount>\n<Cache />\n</GDAL_WMS>\n\
  ```\n\n5. 你现在可以使用栅格对话框或浏览器加载该图层：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_676_0.png)\n\
  \n> 注意 opencyclemap.xml 有两个列表；只有带方形图标的那个才有效，即栅格，因为瓦片是栅格格式。\n\n这种技术不仅限于瓦片服务。GDAL\
  \ 支持的许多其他格式都可以被封装，以便在 QGIS 中更易于使用。这与 *第 2 章 数据管理* 中 *创建栅格概览金字塔* 食谱中提到的 **虚拟栅格表 VRT**\
  \ 图层的方法类似。\n\n最后，你可能会问为什么不使用这种方法创建一个新插件来取代 OpenLayers 插件。这种想法已经讨论了一段时间；关键的障碍是，使用这种方法访问某些图层，如\
  \ Google、Bing 等，可能会违反服务条款，因为它们没有将版权、商标和标志放在正确的位置。此外，缓存和打印此类图层可能不合法。总的来说，尽可能避免使用专有数据以减少许可问题。\n\
  \n## 另见\n\n+   - 本食谱和方法实际上已在许多 QGIS 渠道中为人所知并被讨论过。最常引用的示例可在 http://www.3liz.com/blog/rldhont/index.php?post/2012/07/17/OpenStreetMap-Tiles-in-QGIS\
  \ 获取。\n+   - GDAL 选项的完整说明可在 http://www.gdal.org/frmt_wms.html 找到。\n\n## 使用 QGIS\
  \ 服务器提供网络地图\n\nQGIS 和网络不仅仅是消费数据，还可以用来通过网络为他人提供数据，以便在线查看或在其他网络客户端中使用，例如 QGIS。请记住，设置自己的网络服务并不是制作网络地图最简单的方法，请参阅本章中的\
  \ *连接网络客户端* 食谱。然而，这是一个很好的方法，可以将你投入到 QGIS 项目文件中的大量工作转变为其他人可以查看和使用的东西。\n\n## 准备工作\n\
  \n对于本食谱，你需要一个正在运行的 QGIS 服务器安装。这涉及运行一个标准的网络服务器，例如 Apache 或 Nginx。有许多设置服务器的方法，因此请参阅\
  \ http://hub.qgis.org/projects/quantum-gis/wiki/QGIS_Server_Tutorial 上的官方文档。\n\n\
  一旦 QGIS 服务器运行起来，你只需要一个具有本食谱中所述配置的 QGIS 项目即可。\n\n## 如何操作...\n\n+   1. 打开 QGIS。\n\
  +   2. 加载并设置样式图层：\n+      - 你需要至少一个矢量图层以提供 WFS。\n+      - 你需要至少一个栅格图层以提供 WCS。\n\
  +      - WMS 可以是任何图层组合，你可以选择将其作为独立图层或组合图层提供。\n+   3. 在 **文件 | 项目属性** 中编辑 **项目**\
  \ 属性：\n+      1. 打开 **OWS 服务器** 选项卡。\n+      2. 勾选 **服务功能** 框以启用 GetCapabilities。\n\
  +      3. 填写一些框，以便最终用户了解你的服务器是关于什么的、谁运行它以及如何联系你：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_679_0.png)\n\
  \n4. 现在检查 WMS 功能部分：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_680_0.png)\n\n>\
  \ 这些功能大多是可选的优化。选择适合你需求的功能。\n\n5. 在这里，你可以设置客户端应期望的最大范围。\n\n6. CRS 限制选项让你限制允许的投影。\n\
  \n7. 排除图层允许你在项目中有不显示在网络上的图层。\n\n8. 添加几何到要素响应是一个可选增强功能，如果你正在构建网络地图并且希望能够使用实际的矢量数据。\n\
  \n+   9. **GetFeatureInfo** 精度是指用户查询位置时需要点击的接近程度。如果你有大量数据，你可能希望这个数字很小；但如果你只有几个要素，使其更大可以让最终用户更轻松。\n\
  +   10. 如果你想通过限制用户一次可以请求的数据量来减少服务器负载，请设置 **GetMap 请求的最大值**。对于公共服务器来说这是一个好主意。屏幕截图中显示的\
  \ 2560 x 2048 足够让 HD 分辨率屏幕在一次请求中填满。\n+   11. 接下来，查看 **WFS 功能** 部分：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_681_0.png)\n\
  \n> 只有当你希望用户能够以矢量形式请求矢量数据时才启用 WFS。这可能比 WMS 更消耗你的带宽。此外，除非你将服务器保护为仅允许用户，否则不要启用 WFS-T\
  \ 功能。\n\n+   1. 勾选你希望通过 WFS 可用的任何矢量图层旁边的 **已发布** 框。\n+   2. 要启用 WFS-T，请勾选 **更新**、**插入**\
  \ 和 **删除** 复选框。由于它们是分开的，你可以选择只允许新数据 **插入**、只允许编辑现有数据 **更新**，或只允许删除数据 **删除**。**插入**\
  \ 是最安全选项，因为它可防止编辑或删除现有数据。\n\n12. 最后，查看 **WCS 功能**：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_682_0.png)\n\
  \n> 这是一个全有或全无的功能。除非你希望用户能够下载原始栅格数据，否则不要启用它。\n\n13. 设置完选项后，单击 **确定** 按钮。\n\n14. 现在，将项目保存在\
  \ QGIS 服务器可以访问的位置。\n\n> 在 Apache 中，这通常是像 `/var/www/` 这样的文件夹。\n\n15. 保存后，你可以从任何 OGC\
  \ 兼容的网络客户端测试访问：\n\n+   1. 对于简单测试，使用一个全新的 QGIS 项目和 **添加 WMS** 对话框。\n+   2. GetCapabilities\
  \ URL 将类似于 `http://localhost/cgi-bin/qgis_mapserv.fcgi?map=/usr/local/share/qgis/QGIS-NaturalEarth-Example.qgs`。\n\
  \n> 该 URL 中有些独特于 QGIS 服务器的关键部分是 map 参数，后面跟随 QGIS 项目文件的完整系统路径。\n> \n> 这可能看起来很奇怪，但在\
  \ QGIS 中将你的 QGIS 服务器添加为 WMS 是测试它是否正常工作的好方法。\n\n## 它是如何工作的...\n\nQGIS 服务器是一个中间人，它接收网络服务请求并将其翻译为\
  \ QGIS 内部调用，返回请求的数据或渲染的图像，通过网络服务器传递给最终用户。\n\n\n\n\n\n## 更多内容...\n\nQGIS 服务器包含许多选项，允许你控制提供服务器的类型、通过每种服务提供哪些图层，以及如何为这些服务设置样式。QGIS\
  \ 服务器的替代方案包括 MapServer 和 GeoServer（参见本章的“从 QGIS 管理 GeoServer”部分）。\n\n## 另请参阅\n\n\
  - 更多详细信息，请参阅 QGIS 服务器的主要文档，网址为 http://hub.qgis.org/projects/quantum-gis/wiki/QGIS_Server_Tutorial。\n\
  - 创建服务后，通过将服务添加到 QGIS 项目中进行测试。有关如何添加 WMS、WFS 或 WCS 服务，请参阅本章前面的教程。\n\n## 基于比例尺的渲染\n\
  \n尽管这些功能并非专门针对 Web 服务，但根据地图比例尺更改数据的样式和存在性，可以对 Web 服务的速度和可读性产生巨大影响。与打印地图不同，Web 地图以多种比例尺进行查看。这种比例尺的变化通常需要不同的制图方式来保持地图的清晰可用。\n\
  \n## 准备工作\n\n你需要一个 QGIS 项目，最好是数据密度高或包含不同信息级别的项目。一个很好的例子是道路数据，其中有主要道路、次要道路、地方道路和其他类型的道路分类。前一章中从\
  \ CAD 转换而来的 `caryStreets.shp` 就是一个很好的例子。\n\n## 操作步骤...\n\n- 1. 打开 QGIS 并加载 `caryStreets.shp`。\n\
  - 2. 现在，打开属性表并查找用于过滤的属性。在 `caryStreets.shp` 中，有几个可用的列，例如 `StreetType`、`Major_Road`\
  \ 和 `Main_Road`。\n\n> `StreetType` 似乎是类别，而其他两列似乎是 True 或 False 标志。这些列中的任何一个都是过滤规则的不错候选。\n\
  \n- 3. 现在，打开图层的**属性**部分：\n  - 1. 切换到**样式**选项卡以编辑符号系统。\n  - 2. 将右上角的下拉菜单更改为**基于规则的渲染**。\n\
  \  - 3. 创建一个新规则（绿色加号按钮）。\n- 4. 在弹出对话框中，将**标签**设置为**主要道路**，将**过滤器**设置为 `\"Major_Road\"\
  \ = 't'`。\n- 5. （可选）你可以使用表达式构建器来构建过滤语句并测试它。点击 **...** 按钮打开对话框。\n\n> 你可以创建两个主要道路的副本，并设置不同的比例尺范围，这样当你放大时，主要道路会变粗，同时次要道路会被启用。\n\
  \n这是你创建第一个规则前后图层的样子：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_684_0.png)\n\n\
  - 6. 现在，通过过滤 `\"Major_Road\" = 'f'` 为次要道路添加另一个规则。\n- 7. 这次，你将启用**比例尺范围**选项。\n- 8.\
  \ 将**最小值（不含）**设置为 **1:100,000**。对于任何大于此比例尺的缩放级别，要素将被隐藏。对于**最大值（含）**，输入 **1:0**，这将禁用**最大**过滤器。\n\
  \n> 你不必打开**编辑规则**对话框；可以直接在**基于规则的渲染**页面中修改规则的各个部分。\n\n11. 返回地图，缩放到 **1:50,000**，然后缩小到\
  \ **1:250,000**。当你跨越 **1:100,000** 比例尺时，次要道路应该会出现和消失：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_686_0.png)\n\
  \n## 工作原理...\n\n基于比例尺的渲染目标通常是使你的地图在许多不同的缩放级别下都能保持可读性。通过为每个图层或图层内的子要素设置**最小**和**最大**比例尺，你可以简化地图以提高可读性。渲染引擎在决定渲染什么之前，会根据每个规则检查比例尺。\n\
  \n## 更多内容...\n\n基于比例尺的渲染可以用多种方式使用。它可以用于根据缩放级别更改样式，或根据缩放级别隐藏或显示数据。然而，它不仅仅限于更改样式或图层。你还可以执行基于比例尺的标注，这是本书第\
  \ 10 章“制图技巧”中“配置数据定义标注”教程所描述的数据驱动标注的一部分。\n\n比例尺规则也适用于栅格图层；但是，这仅允许你打开或关闭栅格。它不允许你更改其外观。\n\
  \n如果你在本章前面设置了 QGIS 服务器，则缩放规则应该适用于你的 Web 服务（WMS 和 WFS）。\n\n> 你可能不想在 Web 浏览器中通过 WFS\
  \ 使用像街道图层这样复杂的内容，因为它几乎肯定会崩溃。建议将此类复杂图层作为 Tiles 或 WMS 推送。\n\n## 另请参阅\n\n基于规则的渲染包含许多功能。然而，这还不是对其所有功能的全面指南，因此你需要自行探索并进行网络搜索。\n\
  \n## 连接 Web 客户端\n\n有时，共享地图的最佳方式是构建一个嵌入地图的网站。有许多方法可以实现这一目标，从简单转储几个图层到基于 Web 服务的高度交互式地图。有许多\
  \ Web 客户端可以与标准的 OGC 服务配合使用。本教程将演示如何使用 Leaflet（一个用于创建 Web 地图的流行 JavaScript 库）来构建一个简单的\
  \ Web 地图。\n\n## 准备工作\n\n你需要 qgis2leaf 插件和一些示例数据。`schools_wake.shp`（点）和 `census_wake_2000.shp`\
  \ 文件是不错的示例。\n\n## 操作步骤...\n\n- 1. 安装并启用 qgis2leaf 插件。\n\n> 一定要查看 qgis2web 插件，它是一个较新的变体，工作方式类似，但有一些不同的选项。\n\
  \n- 2. 加载一些图层以构建地图组成。\n\n> 复制你的图层，并删除不需要在 Web 地图上显示的多余列。减小属性表的大小将使弹出窗口中的信息更易于阅读，并加快网页加载速度。\n\
  \n- 3. 按照你希望它在线显示的方式设置地图样式。\n\n> 样式设置可能非常棘手。Leaflet 和其他 Web 地图库并不支持 QGIS 中 100%\
  \ 相同的选项。尝试制作几个地图、更改设置并重新导出这些地图几次，以了解如何获得你想要的效果。在某些情况下，在 QGIS 中看起来可能不好，但在导出后看起来不错。\n\
  \n- 4. （可选）配置标注。在此示例中，标注学校名称。\n\n> 目前仅支持黑色标注。如果你需要不同样式的标注，可能在导出后可以自定义 CSS 和 JavaScript（js）。\n\
  \n- 5. 从工具栏上的图标或“Web”菜单打开 qgis2leaf 插件：\n  - 1. 点击“GetLayers”按钮，将地图中的图层添加到导出列表。\n\
  \  - 2. 这里有很多选项，而且都是可选的。继续勾选“Create Legend”。如果你制作了标注，也勾选“Export Labels”和“labels\
  \ on hover”。\n\n> 如果你在地图上有许多点，“Create Cluster”是一个很棒的选择。它将点分组到一个带有数字的圆圈中，该数字表示附近有多少个点。当你放大时，它们会分成更小的组，直到在某个缩放级别，所有点都位于其原始位置。\n\
  \n  - 3. 对于框架大小，你可以选择希望地图占用的页面大小（以像素为单位）。但是，如果你只关心地图本身，全屏效果会很好。\n  - 4. 继续添加基于瓦片的底图；Stamen\
  \ Terrain 是一个有趣的选择。请记住，你一次只能激活其中一个，但你可以在它们之间切换。\n  - 5. 选择输出文件夹位置，并填写剩余的地图信息，描述你希望它如何在结果中显示。\n\
  \  - 6. 导出项目：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_689_0.png)\n\n- 6. 导出后，地图应该会在你的\
  \ Web 浏览器中打开。如果没有，请打开操作系统文件资源管理器（或 Web 浏览器）并导航到输出文件夹。你应该会看到一个名为 export_年_月_日_时_分_秒\
  \ 的新文件夹（例如，export_2015_02_19_11_34_05）。此文件夹内是 index.html。使用 Web 浏览器打开此文件以查看你的地图：\n\
  \n![](img/2e88bf5938bf48a409c0a534a8775b21_690_0.png)\n\n- 7. 请注意，所有矢量都是可点击的，弹出窗口将显示属性表信息。如果你开启了标注和悬停，那么将鼠标悬停在某个点上将显示名称。\n\
  \n## 工作原理...\n\nqgis2leaf 插件将你的地图转换为与 Web 兼容的内容。通常，这意味着将矢量数据转换为 GeoJSON 格式，并生成一个带有一些\
  \ JavaScript 的 HTML 页面（网页），以创建并显示地图。\n\n\n\n\n栅格图层处理起来较为棘手，如果可能的话，尽量坚持使用 Tile 或\
  \ WMS 服务来提供这些图层。请参考下一节了解如何使用 Tiles 或 WMS。\n\n> 如果你需要在本地托管瓦片，可以尝试使用 QTiles 插件来生成它们。\n\
  \n## 更多内容...\n\n下一步自然是基于 Web 服务使地图动态化。为此，你可以将静态文件替换为 Web 服务：\n\n- 1. 向地图添加一个 WMS\
  \ 图层（如果你的 QGIS 服务器正在运行，可以使用本章前面的 QGIS 服务器相关教程）。添加一个外部源 WMS，例如 USGS NAIP 航空影像。（这是\
  \ GetCapabilities URL：`http://isse.cr.usgs.gov/arcgis/services/Orthom imagery/USGS_EROS_Ortho_NAIP/ImageServer/WMSServer?request=GetCapabilities&service=WMS`）。\n\
  - 2. 使用相同的设置重新导出：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_691_0.png)\n\n> 既然你已经创建了\
  \ Leaflet 地图，如果你想开始 JavaScript 编程，你需要的所有代码都在生成的目录中，要么直接在 `index.html` 中，要么在 `js`\
  \ 文件夹中。特别是，你可以清楚地看到图层是如何设置样式并添加到地图中的。\n\n栅格图层不一定要使用 Tiles 或 WMS，但这是推荐的做法。如果你确实想使用本地文件，请注意目前存在一个\
  \ bug：除非你的栅格被转换为 EPSG:4326 投影下的 `.jpg` 格式图像，否则某些导出会失败。\n\n## 另请参阅\n\n- 别忘了查看 Leaflet\
  \ JavaScript 库的文档，了解导出后如何自定义结果：http://leafletjs.com/。\n- qgis2web 插件旨在结合 qgis2leaflet\
  \ 和 qgis2ol3 插件（https://plugins.qgis.org/plugins/qgis2web/），这意味着它还包括导出到 OpenLayers\
  \ 3，OpenLayers 3 与 Leaflet 非常相似，但使用 OpenLayers JavaScript 库。Lizmap（http://www.3liz.com/en/lizmap.html）和\
  \ QGIS Web Client（https://github.com/qgis/QGIS-Web-Client）是两个更流行的选项，它们提供了更精细的预构建界面，但需要更多的设置。\n\
  \n## 从 QGIS 管理 GeoServer\n\nQGIS 不仅是 QGIS 服务器的前端，也可以作为其他类似服务器的前端。GeoServer 是最流行的服务器之一，你可以从\
  \ QGIS 中配置它、上传图层，甚至可以使用 QGIS 的符号系统工具编辑 GeoServer 图层的样式。\n\n## 准备工作\n\n对于本教程，你需要\
  \ GeoServer Explorer 插件。可以通过插件管理器安装它。\n\n你还需要一个正在运行的 GeoServer 实例。我们假设你在本地 8080\
  \ 端口运行了一个实例，但你可以将相应的 URL 替换为你可用的 GeoServer 实例的 URL，无论是本地还是远程。\n\n## 操作方法...\n\n\
  - 1. 通过导航到 **Web | GeoServer | Geoserver Explorer** 打开 **GeoServer Explorer**。资源管理器将出现在\
  \ QGIS 窗口的右侧。\n- 2. 单击资源管理器树中的 **GeoServer Catalogs** 项，然后选择 **New catalog** 按钮。\n\
  - 3. 在出现的对话框中填写字段以定义新目录，然后单击 **确定**：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_693_0.png)\n\
  \n- 4. 新目录将添加到资源管理器树中，你现在可以浏览其内容。\n- 5. 打开 `zipcodes_wake.shp` 图层并为其设置样式。\n- 6.\
  \ 在 QGIS 图层列表中，将对应于 `zipcode_wake.shp` 图层的条目拖放到 GeoServer Explorer 中的目录项上。该图层将被上传并添加到目录的默认工作区中。\n\
  - 7. 你可以通过打开 Web 浏览器并访问 `http://localhost:8080/geoserver/web/` 上的 GeoServer Web\
  \ 界面来检查该图层是否已在目录中。\n\n## 工作原理...\n\nGeoServer Suite 插件使用其 REST API 与 GeoServer 通信。通过将\
  \ QGIS 与 GeoServer REST API 连接，你可以轻松配置许多本需要手动配置的元素，例如图层的样式。\n\n## 更多内容...\n\nGeoserver\
  \ Explorer 插件具有许多用于处理 GeoServer 的功能。这里有一些额外的思路供你探索。更多信息，请查看插件帮助：http://boundlessgeo.github.io/qgis-geoserver-plugin/。\n\
  \n## 编辑远程样式\n\n一旦图层位于 GeoServer 目录中，你就可以编辑其样式，而无需重新上传图层。只需在资源管理器树中打开相应目录下的 Styles\
  \ 分支，然后双击要编辑的样式，或者在右键单击元素时出现的上下文菜单中选择“编辑...”项：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_694_0.png)\n\
  \n将打开 QGIS 符号系统对话框，你可以在此处编辑样式。关闭对话框后，样式将被上传并更新到目录中。\n\n## 支持多种格式\n\nGeoServer REST\
  \ API 仅支持 shapefile 格式的矢量图层，但你可以拖放 QGIS 支持的任何格式的图层。如有需要，该插件会在上传前负责进行转换。\n\n## 另请参阅\n\
  \n如果没有 GeoServer 实例，设置一个用于测试非常简单。详情请参见 http://geoserver.org/。\n"
- "## 10 个制图技巧\n\n在本章中，我们将介绍以下教程：\n\n- 使用基于规则的渲染\n- 处理透明度\n- 理解要素和图层混合模式\n- 保存和加载样式\n\
  - 配置数据定义的标注\n- 创建自定义 SVG 图形\n- 在任何投影中制作精美的经纬网\n- 在打印地图中制作有用的经纬网\n- 使用 Atlas 创建地图系列\n\
  \n### 简介\n\n在过去的十年中，制图学发生了相当大的变化，越来越多的人转向在设备或 Web 上使用纯电子地图产品。虽然某些类型的可视化更适合不同的媒介，但许多底层工具和技术实际上可以广泛应用于各种场景。本章涵盖了各种工具，使作为\
  \ QGIS 用户的你能够最大限度地提高地图的可读性和美观性。\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_697_0.png)\n\
  \n> \U0001F4A1 你可以对对象应用多条规则，渲染结果是规则和渲染顺序的组合。\n\n- 5. 现在，为了让效果更有趣，让我们添加另一条相反的规则：\n\
  \  - 1. 使用规则列表下方绿色的 **+** 按钮添加一条新规则。\n  - 2. 对于过滤器，使用 `$length > 2000`（别忘了测试一下）。\n\
  \  - 3. 选择一些差异较大的其他符号，以便容易区分它们（例如不同的线型）。单击 **确定**，然后单击 **应用** 查看两条规则的效果。\n\n## 制图技巧\n\
  \n6. 现在，事情变得非常有趣了。我们可以通过右键单击规则或突出显示规则并单击“细化当前规则”下拉菜单来添加子规则：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_698_0.png)\n\
  \n- 7. 选择 **向规则添加类别**：\n  - 1. 在子对话框中，选择 **路线**。\n  - 2. 选择一种颜色渐变和/或线型，单击 **分类**，然后点击\
  \ **确定**。\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_699_0.png)\n\n- 3. 在单击 **应用**\
  \ 之前，编辑主规则并取消选中 **符号** 复选框（否则，**规则** 和 **子规则** 列表将是叠加的，这在某些情况下可能很有用）。\n- 8. 现在，当你查看\
  \ **规则** 列表时，你会看到父规则下的子规则。\n\n11. 最后，地图看起来如下：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_701_0.png)\n\
  \n## 工作原理...\n\n每条规则按从上到下指定的渲染顺序处理，最后一条规则最后绘制，因此位于顶部。规则会添加到已应用于要素的任何现有样式中。你可以通过更改规则顺序或应用渲染顺序来更改渲染顺序。过滤器的工作方式与字段计算器或表搜索中的属性过滤器完全相同。所有符号系统选项都可用于矢量，并且可以应用于一条或多条规则。你还可以通过比例渲染规则对规则进行分组。\n\
  \n## 更多内容...\n\n基于规则的渲染的使用方式数不胜数，这里无法一一描述。你可以创建渲染组，继承其父级的规则并应用自己的规则。每个具有唯一 ID 的要素都可以拥有完全不同的外观。与使用传统的单一符号、分类符号或渐变符号相比，最大的改进是你不必编辑所有可能的组，并且可以更轻松地叠加规则，混合搭配所有原始方法。\n\
  \n不过也有一些问题。并非所有使用基于规则的渲染完成的操作都能在 Web 服务中实现；因此，在过于投入之前，请考虑你的输出格式，并在花费太多时间之前测试你的想法。\n\
  \n\n\n\n\n## 处理透明度\n\n透明度是指缺乏色素或颜色，使得你可以看到一个要素下面的要素。可以将其视为类似于有色或染色玻璃；部分光线被允许穿过并反射内部的事物。当使用得当，透明度可以帮助强调或弱化地图构图中要素。它也可以用于混合两个图层，使其看起来像一个图层。\n\
  \n## 准备工作\n\n本教程演示了矢量和栅格的透明度，因此我们需要各一个示例。lakes.shp 和 elevlid_D782_6.tif 图层非常适合演示目的。在一个全新项目中加载这两个图层，将\
  \ lake.shp 置于上方。\n\n## 如何操作...\n\n- 1. 加载一个矢量图层后，打开属性并切换到样式选项卡。\n- 2. 在对话框右侧，你会看到透明度滑块，值为\
  \ 0%（这意味着 100% 实心或不透明）。\n- 3. 向右调整滑块并应用更改以在地图中查看效果：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_702_0.png)\n\
  \n使用粗体或深色会更容易注意到变化。你还会注意到简单填充选项显示原始颜色。\n\n- 4. 现在要在栅格上演示，首先将 lakes 重置为 0%。\n- 5.\
  \ 在图层列表中交换顺序，使 elevlid 置于上方。\n- 6. 现在，打开 elevlid 的属性并切换到透明度选项卡。\n- 7. 全局透明度选项会均匀改变整个栅格的值。将其设置为\
  \ 50% 并应用。你现在应该可以看到下方被隐藏的 lakes 图层：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_703_0.png)\n\
  \n无论全局透明度设置为多少，无数据值始终为 100% 透明。利用此功能可轻松消除你完全不想显示的值。\n\n- 8. （可选）你可能注意到在全局透明度滑块下方有自定义透明度选项。这将允许你使特定值比其他值更透明。你可以为特定透明度分配特定值，或者你可以为栅格添加一个波段（或使用多波段栅格），该波段指定要应用于栅格其余部分的透明度量（某些数据格式，如\
  \ GeoTiff，称之为 Alpha 透明度波段）：\n  - 将全局透明度重置回 0%（否则，这也会被应用）\n  - 使用绿色 + 号添加一些值\n\n\
  ## 如何操作...\n\n使用两个栅格图层，我们可以尝试不同的混合模式。当然，这也适用于矢量图层：\n\n- 1. 双击效果图层以打开图层属性。\n- 2.\
  \ 你可以通过进入图层属性 | 样式 | 与亮度、对比度、饱和度等其他有用的控件一起的色彩渲染来找到混合设置，如下图所示：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_706_0.png)\n\
  \n- 3. 更改混合模式并点击应用以查看结果。\n- 4. 同样，对于矢量图层，例如我们的混合图层，我们通过进入图层属性 | 样式 | 图层渲染找到混合模式设置，如下图所示：\n\
  \n![](img/2e88bf5938bf48a409c0a534a8775b21_706_1.png)\n\n主要区别在于，对于矢量图层，我们可以控制要素如何相互混合，以及结果如何与底层图层混合，分别使用要素混合和图层混合模式。要素混合模式按要素为基础应用。\n\
  \n## 制图技巧\n\n- - **Dodge**：**Dodge** 模式会根据上层图层的亮度提亮并饱和下层图层。这意味着上层图层中较亮的颜色会导致下层图层的饱和度和亮度增加。如果顶部像素不太亮，此效果最佳；否则效果会非常极端。\n\
  - - **Addition**：**Addition** 模式将两个图层的像素值相加。如果结果超过 1（在 RGB 的情况下），相应区域将显示为白色。\n-\
  \ - **Darken**：**Darken** 模式创建的结果保留两个图层的最小 RGB 分量。因此，这是 Lighten 模式的相反模式，并且与 Lighten\
  \ 一样，结果往往是锯齿状和生硬的。\n- - **Multiply**：**Multiply** 模式将两个图层的值相乘，从而导致图像变暗。\n- - **Burn**：**Burn**\
  \ 模式会导致上层图层中的较暗颜色使下层图层变暗。**Burn** 可用于调整和着色底层图层。\n- - **Overlay**：**Overlay** 模式结合了\
  \ **Multiply** 和 **Screen 混合**模式。因此，亮的部分变得更亮，暗的部分变得更暗。\n- - **Soft light**：**Soft\
  \ light** 模式与 **Overlay** 非常相似，但它使用 **Burn** 和 **Dodge** 的组合。这旨在模拟在图像上照射柔和光线。\n\
  - - **Hard light**：**Hard light** 模式也与 **Overlay** 非常相似。它旨在模拟在图像上投射非常强烈的光线。\n- -\
  \ **Difference**：**Difference** 模式从下层图层中减去上层图层的值（或反之）以始终得到正值。与黑色（RGB 值为 0,0,0）混合不会产生变化。\n\
  - - **Subtract**：**Subtract** 模式从一个图层中减去另一个图层的值。在负值的情况下，显示黑色：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_709_0.png)\n\
  \n12 种混合模式的概述（背景地图“Watercolor”和“Toner”由 Stamen Design 提供，采用 CC BY 3.0。数据由 OpenStreetMap\
  \ 提供，采用 CC BY SA）：第一行：Lighten、Screen 和 Dodge；第二行：Addition、Darken 和 Multiply；第三行：Burn、Overlay\
  \ 和 Soft light；第四行：Hard light、Difference 和 Subtract。\n\n## 保存和加载样式\n\n有什么比为要素图层制作出色的样式更好的呢？能够轻松共享和重用它们。矢量和栅格样式都可以保存和重用——不过方式略有不同。\n\
  \n## 准备工作\n\n对于本教程，你需要两个相似的矢量图层和一组两个相似的栅格图层。在提供的示例数据中，使用两个公交线路 shapefile 和两个高程栅格（例如，elevlid_D782_6.tif）。\n\
  \n```\nelevlid_D782_6.tif\n```\n\n## 如何操作...\n\n首先我们开始复制和粘贴矢量图层的样式：\n\n- 1. 加载两个公交线路\
  \ shapefile 和两个 elevlid 栅格。\n- 2. 最简单的方法是复制矢量或栅格的样式。只需在列表中右键单击图层名称并从 **Style** 菜单中选择\
  \ **Copy Style**。然后，右键单击你想要应用此样式的图层并从 **Style** 菜单中选择 **Paste Style**。你只能在相同类型的图层之间复制样式（例如，**Point\
  \ to Point**）：\n\n尝试使用右键菜单将一条公交线路的样式复制并粘贴到第二条公交线路：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_710_0.png)\n\
  \n- 3. 现在要导出样式以供以后使用，右键单击一个图层并导航到属性 | 符号系统。\n- 4. 在右下角，样式菜单中有保存样式按钮。输出选项为 QGIS 图层样式文件...（即\
  \ .qml）或 SLD 文件...。两种格式都是 XML 文本文件，QGIS 图层样式... 推荐用于最大兼容性：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_711_0.png)\n\
  \n- 5. SLD 与某些其他网络地图系统兼容，但在最简单的情况之外，它不会 100% 捕获你的 QGIS 样式（SLD 中并不存在所有相同的选项）。QML\
  \ 是原生的 QGIS 样式文件。注意稍后使用的加载样式选项。\n- 6. 继续为其中一个公交线路图层应用新样式。\n- 7. 然后，将符号系统保存为 QGIS\
  \ 图层样式文件（qml）。\n- 8. 在第二个公交线路文件的属性对话框中，点击加载样式... 并选择你刚刚保存的文件。\n\n> 你可以在文本编辑器中打开此文件进行自定义，或例如批量查找和替换值。\n\
  \n\n\n\n\n## 制图技巧\n\n栅格稍微复杂一些，因为你可以保存一个符号系统文件，也可以保存一个颜色表。颜色表是一个文本文件，列出了栅格值范围和关联的颜色代码。它是一种比\
  \ XML（QGIS 图层样式文件）更简单易于手工编辑的格式，但不保留透明度或分类设置等内容：\n\n1. 随便给其中一个 elevlid 图层应用一个新的颜色渐变。\n\
  2. 使用磁盘按钮将颜色表仅保存为 .txt 文件（在按钮行右端的颜色表上方；请参考截图）。\n3. 在第二个 elevlid 文件的 属性 中，加载颜色表并选择你刚刚保存的文件。\n\
  4. 将更改应用到你的图层样式：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_712_0.png)\n\n> 请注意，与矢量属性中一样，Style\
  \ 菜单也可用。你可以用它来保存和加载 QGIS 图层样式文件（.qml），就像我们之前做的那样。\n\n### 它是如何工作的...\n\n通常图层的样式信息保存在\
  \ .qgs（如果你保存项目）项目文件中。各种导出方法只是以通用方式将图层的样式信息打包到一个单独的文件中（与原始数据无关）。这让你可以将相似的样式应用到相似的数据源。\n\
  \n矢量符号系统存储在一个以 .qml 扩展名结尾的特殊 XML 文件中。你可以阅读或编辑该文件，如果你愿意的话，它也可以通过脚本生成或复制粘贴来创建多个样式的混合。\n\
  \n栅格符号系统也可以存储在 .qml 文件中。然而，还有一个额外的选项可以将分类范围和颜色导出到一个简单的文本文件，每行一个值或值范围和一个颜色代码。\n\n\
  ### 还有更多...\n\n第二种格式 **SLD（Style Layer Descriptor）** 在网络服务中非常常见。虽然 QGIS 样式并非所有功能在\
  \ SLD 中都有对应，但它仍然是一个很好的起点，可以在 MapServer 或 GeoServer 等软件平台之间共享你的样式。\n\n### 配置数据定义标签\n\
  \n如果列出 QGIS 的顶级功能，数据定义标签会名列前茅。它们提供了自动标注的便捷性和自由标注的定制性。你可以混合使用自动和自定义编辑，并将值存储在表中以供以后参考。\n\
  \n### 准备工作\n\n有几个有用的插件可用于数据定义标签，它们会为现有图层添加所需的额外属性字段，或仅为标签创建一个新图层。下载并安装 **Layer to\
  \ labeled layer** 和 **Create labeled layer**。\n\n### 如何操作...\n\n1. 打开 QGIS 并加载 `census_wake2000.shp`。\n\
  2. 使用 **Save As** 对话框创建图层的副本，并将图层保存为 `census_wake2000_label.shp`。 （你不一定总是要这样做，但此过程会修改表，因此最好先备份。）\n\
  3. 在图层列表中突出显示 `census_wake2000_label.shp`。\n4. 运行 **Layer to labeled layer** 插件（**Plugins\
  \ | Layer to Labeled layer** 插件）：\n   1. 将 **Label Field** 设置为 `STFID`。\n   2. 点击\
  \ **OK**。\n\n   ![](img/2e88bf5938bf48a409c0a534a8775b21_714_0.png)\n5. 如果你现在查看属性表，你会看到一大堆新的字段，以\
  \ **Lbl** 为前缀，它们都是 `NULL`。\n\n   ![](img/2e88bf5938bf48a409c0a534a8775b21_714_1.png)\n\
  6. 现在，确保你已打开 **Label** 工具栏（**View | Toolbars | Label**）：\n\n   ![](img/2e88bf5938bf48a409c0a534a8775b21_714_2.png)\n\
  7. 要么在图层属性中（导航到 Properties | Labels）要么使用标签工具栏上的第一个按钮，图层标签选项，打开标签管理对话框。\n8. 在整个对话框中，你会看到每个字段旁边的标记。黄色标记表示数据定义属性，白色标记表示所有设置相同：\n\
  \n   ![](img/2e88bf5938bf48a409c0a534a8775b21_715_0.png)\n\n   如果你想在此阶段控制其他属性，请向图层添加一个新字段。然后返回此对话框并选择白色图标以选择要使用的字段名称。\n\
  9. 现在，你可以对各种标签进行自定义编辑，并让表格存储设置。根据设置，有几种方法可以进行编辑。请注意，你必须先切换图层的编辑模式，然后才能更改标签：\n  \
  \ - 你可以直接在表中手工编辑字段，或者你可以使用字段计算器来自动化重复模式（例如，给所有主要道路相同的字体和颜色标签）。\n   - 对于某些属性，如 X、Y\
  \ 和旋转，你也可以使用标签工具栏选项在地图上手工编辑。\n\n### 示例：移动和旋转标签\n\n1. 通过点击以下图标切换编辑模式：\n\n   ![](img/2e88bf5938bf48a409c0a534a8775b21_716_0.png)\n\
  \n2. 在 **Label Toolbar** 菜单中，选择 **Move Label** 按钮。现在，点击一个标签并将其拖动到新位置，在完成移动标签时释放鼠标按钮。请注意，你必须确保步骤\
  \ 8 中的 X 和 Y 字段已设置，此工具才可用：\n\n   ![](img/2e88bf5938bf48a409c0a534a8775b21_716_1.png)\n\
  \n### 它是如何工作的...\n\n基本前提是你在表中保留一套额外的属性，通常作为现有表的附加字段。\n\n> 你可以通过手工方式向属性表添加字段，并将它们分配给标签属性。使用\
  \ **Layer to Labeled Layer** 插件会为你完成此操作。\n\n如果设置了这些字段，它们将用于确定给定行的标签位置、大小、字体、颜色、角度等。如果未设置它们，则保留标注引擎的自动设置。\n\
  \n### 还有更多...\n\n数据定义标签的强大之处在于你可以结合自动化、计算和自定义编辑的值。它们由内置的标注引擎自动生成，并使用字段计算器计算以填充数据定义字段（例如，使用\
  \ if 语句或基于其他属性的计算）。最后，通过进行这些小幅手工调整，你可以修复几个行为不佳的标签。\n\n请注意，你不必在现有图层上使用数据定义标注。你可以使用\
  \ **Create labeled layer** 插件仅创建一个标签图层。在其他软件中，用户定义的标注通常称为注释图层。QGIS 也有注释图层。这些是图层，你可以在地图上点击添加标签，然后随意编写和设置其样式。最大的问题是这些图层与它们标注的数据没有关联。你很难将它们交给其他人，如果标签名称或样式发生变化，你必须追踪并手工编辑每个修复。在\
  \ QGIS 中，数据定义标注解决了注释图层的几乎所有缺点，因为它实际上将所有属性作为字段保存到 shapefile 中。\n\n### 创建自定义 SVG 图像\n\
  \n本教程的全部内容是让你通过创建自定义图标、指北针，甚至填充图案使地图独一无二。\n\n### 准备工作\n\n你需要一个矢量插图程序（例如 Inkscape\
  \ 或 Adobe Illustrator）。\n\n> 没有吗？所有平台上都有多个免费和开源选项可用。许多 QGIS 社区成员使用 Inkscape（http://inkscape.org），但你也可以使用\
  \ LibreOffice Draw 或 OpenOffice Draw。最常见的专有软件等价物是 Adobe Illustrator。\n\n你还需要一个文本编辑器，例如\
  \ TextEdit（Mac）、Notepad、Notepad++（Windows）。\n\n### 如何操作...\n\n1. 打开你的矢量插图程序。\n2.\
  \ 将画布设置为一个合理的尺寸。方形比例通常效果很好，因为图标最终将在 QGIS 中用于标记点；100x100 像素就足够了。\n3. 绘制一个简单的形状，如正方形、圆形或星形。确保你尽可能接近边缘并填满整个页面。\n\
  \n> 请记住，你将在 8-32 像素左右的尺寸下使用此绘图；在创建和编辑插图时以这些比例工作真的很烦人。\n\n4. 将绘图保存为 .svg 文件。\n5.\
  \ 现在，在文本编辑器中打开 .svg 文件，搜索并找到对象的样式行，并将其替换为以下行：\n\n```\nstroke-width=\"param(outline-width)\
  \ 1\"\nstroke=\"param(outline) #000\"\nfill=\"param(fill) #FFF\"\n```\n\n> 如果使用复杂的图标，请将线条设置为与绘图中所有其他颜色都不同的特定颜色代码。记下颜色代码，以便在文本编辑器中用于搜索\
  \ .svg 文件。\n\n\n\n\n\n代码合并后前后场景如下表所示：\n\n| Before | After |\n|---|---|\n| `<rect`\
  \ `style=\"color:#000000;display:inline;overflow:visible;visibility:visible;opacity:1;fill:\"\
  param(fill)` `#000000\";fill-` `opacity:1;stroke:\"param(outline)` `#ff0000\";stroke-`\
  \ `width:\"param(outline-width)` `4\";stroke-` `miterlimit:4;stroke-` `dasharray:none;stroke-`\
  \ `opacity:1;marker:none;enable-` `background:accumulate\"` `id=\"rect3336\"` `width=\"\
  301.61023\"` `height=\"308.96658\"` `x=\"30.651445\"` `y=\"725.00476\" />` | `<rect`\
  \ `stroke-width=\"param(outline-` `width) 1\"` `stroke=\"param(outline)` `#000\"\
  \ fill=\"param(fill)` `#FFF\" id=\"rect3336\"` `width=\"301.61023\"` `height=\"\
  308.96658\"` `x=\"30.651445\"` `y=\"725.00476\" />` |\n\n- 6. 保存你的更改。\n- 7. 现在，启动\
  \ QGIS 并加载一个点图层。\n- 8. 进入 **属性 | 样式**。\n- 9. 在符号选项中，有两个层级的对象组成一个符号：标记，然后是组合成它的实际符号的子层级。\n\
  - 10. 选择子对象，默认通常标记为 **简单标记**。\n- 11. 现在，将右上角的下拉菜单更改为 SVG 标记。\n- 12. 在显示符号选项的框下方查找\
  \ ... 按钮并选择从文件加载 SVG。使用它来选择你之前创建的 .svg 文件。\n\n- 13. 导入后，如果你执行了步骤 5，你应该能够更改符号的填充颜色：\n\
  \n![](img/2e88bf5938bf48a409c0a534a8775b21_721_0.png)\n\n> 你可能需要大幅调整大小和宽度才能使更改明显。善用\
  \ **应用** 按钮在地图中查看更改，但保持对话框打开以便轻松调整。\n\n## 如何工作...\n\n你添加到 `.svg` 文件中的特殊文本是一个标记或占位符。QGIS\
  \ 会查找这些特定单词，然后在 SVG 被读入程序时利用它们即时插入符号更改。\n\n## 还有更多...\n\n虽然本教程演示了一个非常简单的 SVG，但此方法适用于更复杂的符号。\n\
  \n另请注意，在 **设置 | 选项 | 系统** 中，你可以设置 SVG 文件夹的路径，这样它们将始终在符号对话框中可用。\n\n## 另请参阅\n\nQGIS\
  \ 还允许你使用 SVG 符号自定义填充图案。QGIS *培训手册* 在 http://docs.qgis.org/2.8/en/docs/training_manual/basic_map/symbology.html#hard-fa-creating-a-custom-svg-fill\
  \ 中对此有一个很好的示例。\n\n## 在任意投影中制作漂亮的经纬线\n\n经纬线是地图上的一组参考线，有助于为地图阅读者提供方向。它们通常按坐标设置并标注。棘手的部分在于使用经纬线时的投影。如果你没有正确制作，经线交点之间的平滑曲线就会变成笨拙的异常形状（大多是直线）。默认的\
  \ QGIS 经纬线创建器不利于投影，因此在本教程中，你将看到一个执行此操作的附加处理算法。本教程的重点是确保你获得漂亮、平滑且标注正确的经纬线。\n\n##\
  \ 准备工作\n\n对于本教程，你只需要一个边界框和你想要间隔线的坐标间隔。通常，这些将是纬度、经度 WGS 84（EPSG:4326），以及十进制度数，因为经纬线的全部目的就是添加有助于用户定向的参考线。\n\
  \n## 如何操作...\n\n- 1. 首先下载一个专门用于此任务的 **处理工具箱** 算法，称为 **Lines Graticule**：\n  - 1.\
  \ 打开 **处理工具箱**。\n  - 2. 进入 **脚本 | 工具 | 从在线脚本集合获取脚本**：\n- 3. 在 **未安装** 部分，勾选 **Lines\
  \ Graticule** 算法。\n- 4. 点击 **确定** 按钮安装算法。\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_723_0.png)\n\
  \n> 每次使用工具时，最好检查更新。\n\n你将看到类似以下截图的内容：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_723_1.png)\n\
  \n- 下载算法后，通过导航到 **脚本 | 向量** 打开它（它被称为 **Lines graticule**，尽管代码实际上是 pygraticule.py）：\n\
  \n![](img/2e88bf5938bf48a409c0a534a8775b21_724_0.png)\n\n- 你可以手动填写参数，如果你知道它们，或者使用\
  \ **...** 按钮从现有项目获取值。\n- 目前，你可以使用将为整个世界制作经纬线的默认值。输出由 outfile 和 graticule 决定。这些参数是可选的，你可以选择其一、两者或都不选。如果你想要\
  \ GeoJSON 文件，请设置 outfile。如果你想要 shapefile，请设置 graticule（如果你希望结果之后自动加载，请确保第二个输出设置为临时或真实文件，不要留空）。请参考\
  \ **帮助** 选项卡了解每个参数的详细信息。有两个非常重要的值可以控制经纬线：\n- **spacing** 值表示绘制线的频率（对于世界范围的地图，20\
  \ 或 30 度效果很好）。\n- **density** 值表示放置节点的频率：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_724_1.png)\n\
  \n> 节点越多，曲线越平滑；但是文件越大，制作时间越长。选择合适的密度可能需要反复试验，以找到在给定地图比例下线条停止平滑弯曲前的最大密度。\n\n- 5.\
  \ 选择设置后，点击 **运行**。\n- 6. 运行后，应该会加载一个包含结果的矢量图层。这看起来不会很令人兴奋，只是形成网格的直线。\n- 7. 真正的魔法是现在启用即时投影，例如使用众多不错的世界投影之一，如“World\
  \ Robinson（EPSG:54030）：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_725_0.png)\n\
  \n8. （可选）如果它看起来不像图像，而是仍然有间隔异常的直线，你需要禁用 QGIS 渲染简化：\n  - 1. 从 属性 | 渲染 中选择图层。\n  -\
  \ 2. 确保已禁用 简化几何：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_726_0.png)\n\n9. （奖励）从\
  \ 向量 | 研究工具 生成矢量网格。区别如下所示：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_726_1.png)\n\
  \n## 如何工作...\n\n经纬线基本上是线图层（有时也是多边形）。如果你只在两条线相交的点绘制网格节点，你可以很容易地看到网格变形会导致块状形状。平滑经纬线的关键是在交点之间添加额外的线节点（即增加节点密度）。\n\
  \n需要注意的是，使用不覆盖整个世界的投影时（例如极地或正射投影），请选择落在投影限制范围内的边界框值；否则，在尝试重新投影时可能会出现错误。\n\n## 还有更多...\n\
  \n经纬线在主地图画布上的主要优势是，你可以在 QGIS 中工作时将其用作参考，将其包含在网络和数字地图中，并完全控制标签和符号。这里使用的方法与 QGIS 中的其他经纬线（网格）工具不同，因为它专注于将具有平滑曲线的纬度/经度线作为参考放入任何投影中。其他网格工具更专注于在地图上制作规则的正方形以细分区域。\n\
  \n打印版面方法（下一个教程）的主要优势是能够轻松制作多个坐标系统，并在地图外部边缘添加刻度线。刻度线是你在导航导向地图上常见看到的，例如 USGS 地形图象限和其他印刷地图。\n\
  \n## 另请参阅\n\nLines graticule（又名 Pygraticule）也可以用作纯 Python 脚本；有关更新和更多信息，请参阅 https://github.com/wildintellect/pyGraticule。\n\
  \n要学习如何编写自己的处理工具箱算法，请参阅第 11 章《扩展 QGIS》中的 编写处理算法 教程。\n\n## 在印刷地图中制作有用的经纬线\n\n经纬线是地图上的一组参考线，有助于为地图阅读者提供方向。它们通常按坐标设置并标注。对于传统印刷地图，旨在用于导航和测绘任务，在这些任务中你希望在多个坐标系统中标记地理坐标。本教程是关于向版面地图中添加此类参考线。\n\
  \n\n\n\n\n## 准备工作\n\n你需要一张地图，通常是小范围的（跨度为数英里或公里）。对于本教程，elevlid_D782_6.tif 效果很好。\n\
  \n## 如何操作...\n\n- 1. 加载 elevlid_D782_6.tif。\n- 2. 通过选择 UTM Zone 17 N, WGS 84 (EPSG:32617)\
  \ 打开实时投影。\n- 3. 现在创建 新打印布局。\n- 4. 在打印布局中，选择 添加新地图，然后在画布上绘制一个矩形。\n- 5. 现在有了地图后，在屏幕右侧的对话框中选择\
  \ 项目属性 选项卡。\n- 6. 向下滚动或折叠各部分，直到看到 网格 部分。\n- 7. 使用绿色加号 (+) 符号添加一个新的网格。\n- 8. 现在，将\
  \ 间隔 X 和 间隔 Y 编辑为 1,000 地图单位。 （确保切换到下一个字段或点击 Enter 使数值生效。）:\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_728_0.png)\n\
  \n> 当前的地图单位基于 UTM，单位为米，这意味着线条间隔为 1,000 米或 1 公里。\n\n- 9. 在 间隔 部分下方，修改 线样式 并将线条设为红色以便更易于查看。\n\
  - 10. 现在，进一步向下滚动到 绘制坐标 部分并勾选启用网格线标签的复选框：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_729_0.png)\n\
  \n- 11. 启用后，将顶部和底部的方向改为垂直，并将字体颜色改为红色。\n- 12. 现在，要创建第二个网格，滚动回 网格 部分并再次点击绿色加号 (+)\
  \ 添加第二个网格。\n- 13. 这次，将 CRS（坐标参考系统）更改为 WGS 84 (EPSG:4326)，这是人们最常用的纬度和经度系统。\n- 14.\
  \ 使此网格间隔为 0.01 地图单位（即本例中的度），并将样式改为蓝色以与另一个网格形成对比。\n- 15. 现在，向下滚动并添加 **绘制坐标**。同时，使顶部和底部为垂直方向以避免与第一个网格重叠。你也可以将字体颜色改为与线条一致：\n\
  \n![](img/2e88bf5938bf48a409c0a534a8775b21_730_0.png)\n\n## 其工作原理...\n\n参考格网是等距的带坐标标记的线条。根据你的设置，布局会根据地图数据的坐标计算线条的位置。在打印布局中创建有用的格网的关键在于选择合适的间隔：间隔要足够频繁以提供参考，但又不能过于密集而覆盖地图的大部分区域。选择具有整齐的四舍五入数字的间隔也很重要，这样便于计算两条线之间的中间值。\n\
  \n## 还有更多...\n\n在 QGIS 中制作网格/格网有两种方法：一种是用于印刷地图的打印布局，另一种是作为 QGIS 中的图层用于印刷网络地图的内部使用。\n\
  \n## 制图技巧\n\n- 3. **固定比例尺：** 这可使系列中所有地图保持相同的比例尺；比例尺在地图的 **主属性** 中配置，即以下截图中的 100,000：\n\
  \n![](img/2e88bf5938bf48a409c0a534a8775b21_732_0.png)\n\n- 4. 接下来，我们使用 **添加新标签**\
  \ 按钮添加标题标签。此标题标签将显示邮政编码多边形要素的 NAME 值，并将由 Atlas 自动为系列中的每张地图更新。为实现此目的，我们在标签项的 **主属性**\
  \ 输入字段中插入以下表达式。\n\n```\n[%attribute( @atlas_feature, 'NAME' ) %]\n```\n\n- 5. 为了完成\
  \ Atlas 配置，我们需要进入 **Atlas 生成** 选项卡。在那里，我们首先必须启用 **生成一个图集** 复选框。这会激活 **配置** 部分，我们可以在其中选择\
  \ **覆盖** 图层并将其设置为 zipcodes_wake 图层，如以下截图所示。\n- 6. 要预览 Atlas 输出，我们现在可以点击 **预览图集**\
  \ 按钮。此按钮只有在 **Atlas 生成** 选项卡中启用了 **生成一个图集** 复选框时才处于活动状态。预览模式激活后，你可以使用 **预览图集** 按钮旁边的箭头按钮浏览地图系列。\n\
  - 7. 当我们对预览满意时，可以导出地图系列。输出行为由 **Atlas 生成** 选项卡的 **输出** 部分中的配置控制，你也可以在以下截图中看到。Atlas\
  \ 支持导出为单独的图像、SVG 或 PDF 文件。激活 **尽可能单文件导出** 选项以将所有地图合并为一个 PDF，然后点击 **导出图集为 PDF** 按钮，如以下截图所示：\n\
  \n![](img/2e88bf5938bf48a409c0a534a8775b21_733_0.png)\n\n## 其工作原理...\n\nAtlas 功能提供了与当前要素相关的系列变量的访问权限。我们已使用\
  \ `{@attribute( @atlas_feature, 'NAME' ) }` 表达式将当前要素的 _NAME_ 值显示在标题标签中。除 `@atlas_feature`\
  \ 外，你还可以访问以下变量：\n\n- `@atlas_feature`：这是当前 Atlas 要素的要素 ID。这使得可以在规则中使用此信息，例如根据 ID\
  \ 隐藏或突出显示要素。\n- `@atlas_geometry`：这是当前 Atlas 要素的几何，可在规则中使用，例如仅在其他图层的要素几何与 Atlas\
  \ 要素几何相交时显示。\n- `@atlas_featurenumber`：这是当前 Atlas 要素的编号。\n- `@atlas_totalfeatures`：这是\
  \ Atlas 覆盖图层中的要素总数。\n\n## 还有更多...\n\n概览地图是为更详细的地图提供上下文的绝佳方式。要添加概览地图（如以下截图中构图中右上角所示），你需要在构图中添加第二个地图项。要将此地图项转换为概览地图，请进入\
  \ **项目属性** | **概览** 并点击带有绿色加号的按钮。这将添加一个 `Overview 1` 条目并启用 **绘制 \"Overview 1\" 概览**\
  \ 配置 GUI：\n\n- **地图框架**：**地图框架** 下拉列表使我们能够定义应由概览地图引用的主地图。默认情况下，地图项按添加到构图中的顺序命名为\
  \ `Map 0`、`Map 1`、`Map 2` 等。因此，如果主地图是第一个添加到构图中的项，我们将选择 `Map 0` 条目。\n- **框架样式**：**更改\
  \ ...** 按钮可用于选择概览框架的样式。通常这将是带透明度的简单填充。\n- **混合模式**：概览框架支持这些模式，如 *理解要素和图层混合模式* 教程中详细解释。\n\
  - **反转概览**：如果希望将概览框架样式应用于主地图范围之外的区域，请启用 **反转概览** 复选框。\n- **以概览为中心**：如果希望概览地图自动平移以居中显示主地图的范围，请启用\
  \ **以概览为中心** 复选框。\n"
- "## 11\n扩展 QGIS\n\n在本章中，我们将涵盖以下主题：\n\n- 定义自定义投影\n- 在日期变更线附近工作\n- 离线工作\n- 使用 QSpatiaLite\
  \ 插件\n- 添加具有 Python 依赖项的插件\n- 使用 Python 控制台\n- 编写处理算法\n- 编写 QGIS 插件\n- 使用外部工具\n\n\
  ## 引言\n\nQGIS 本身可以做很多事情。然而，与所有软件一样，其默认能力存在局限。好消息是，通过内置的自定义选项、现有的附加插件、创建新的分析算法、创建自己的插件以及使用与\
  \ QGIS 互补的外部软件，有许多方法可以扩展 QGIS 的功能。本章涵盖了在其他章节中未提及的一些常见自定义和插件，以及如何开始制作自己的附加组件与他人分享。\n\
  \n\n\n\n## 定义自定义投影\n\n地图投影在 GIS 职业生涯的某个阶段会让几乎每个人都感到困惑，如果不是更频繁的话。如果你幸运的话，你只需坚持使用人人皆知的常用投影，你的生活就会很简单。有时，不过，对于特定位置或自定义地图，你只需要一个在\
  \ QGIS 投影数据库中已有的庞大列表中没有的略有不同的投影。（通常，这些也被称为 **坐标参考系统 (CRS)** 或 **空间参考系统 (SRS)**。）\n\
  \n我不会介绍投影、投影坐标系统和坐标系统之间的区别是什么。从 QGIS 的实际角度来看，你可以选择与你的数据或预期输出相匹配的那个。这其中有很多小 caveats，但一本书或课程是更好地掌握它的地方。\n\
  \n### 准备工作\n\n对于本配方，我们将使用一个自定义经纬网，一个每 10 度一条线的网格（`10d_graticule.json.geojson`），以及\
  \ Natural Earth 1:1000 万海岸线（`ne_10m_coastline.shp`）。\n\n### 如何操作...\n\n- 1. 确定你的数据当前使用什么投影。在本例中，我们从\
  \ EPSG:4326 开始，也称为 Lat/Lon WGS84。\n- 2. 确定你想要制作地图的投影。在本示例中，我们将制作以爱尔兰为中心的斜轴等距投影。\n\
  - 3. 在现有的 QGIS 投影列表中搜索匹配或相似的投影。如果你打开 **Projection** 对话框并输入 `Stereographic`，这是一个不错的开始。\n\
  - 4. 如果你找到了相似的投影并且只想对其进行自定义，请突出显示 `proj4` 字符串并复制信息。**NAD83(CSRS) / Prince Edward\
  \ Isl. Stereographic (NAD83)** 是一个足够相似的投影。\n\n> 如果你在 QGIS 投影数据库中找不到任何内容，请在网上搜索你想要使用的投影的\
  \ proj4 字符串。有时，你会找到投影 WKT。通过一些工作，你可以利用 https://github.com/OSGeo/proj.4/wiki/GenParms\
  \ 上的文档弄清楚 WKT 参数中的每一个对应 proj4 槽位。本配方的末尾提供了研究投影的一个好地方。\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_736_0.png)\n\
  \n- 5. 在 **Settings** 下，打开 **Custom CRS** 选项。\n- 6. 点击 + 符号添加一个新定义。\n- 7. 输入名称并粘贴你的投影字符串，在本例中对其进行修改以使中心位于爱尔兰。将\
  \ `lat_0` 和 `lon_0` 参数的值更改为以下示例。将此特定类型的投影仅采用一个参考点。对于具有多个标准平行线和子午线的投影，你会看到下划线后的数字递增：\n\
  \n```\n+proj=sterea +lat_0=53.5 +lon_0=-7.8 +k=0.999912\n+x_0=400000 +y_0=800000\
  \ +ellps=GRS80 +towgs84=0,0,0,0,0,0,0\n+units=m +no_defs\n```\n\n以下屏幕截图显示了屏幕的外观：\n\
  \n![](img/2e88bf5938bf48a409c0a534a8775b21_737_0.png)\n\n8. 现在，点击自定义投影列表中的另一个投影。目前有一个怪癖，如果你不切换到另一个投影，然后点击\
  \ OK，它就不会保存。\n\n9. 现在，前往地图，打开投影管理器并应用你的新投影并打开 OTF 以检查是否正确。你将在第三部分“User Defined Coordinate\
  \ Systems”中找到你的新投影：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_738_0.png)\n\n以下屏幕截图显示了该投影：\n\
  \n![](img/2e88bf5938bf48a409c0a534a8775b21_739_0.png)\n\n## 其工作原理...\n\n投影信息（在本例中为\
  \ proj4 字符串）编码了计算机所需的参数，以选择正确的数学公式（投影类型）和变量（各种参数，例如平行线和中心线）将数据从当前状态转换为所需的平面地图。此信息库包括地球形状的近似值以及将其压平成平面视觉的不同方式。\n\
  \n你可以真正更改大多数参数来改变地图外观，但通常，坚持使用已知定义，以便你的地图与其他以相同方式制作的地图相匹配。\n\n## 还有更多...\n\nQGIS\
  \ 仅允许正向/反向转换投影。制图正向仅投影（例如，Natural Earth、Winkel Tripel (III) 和 Van der Grinten）目前不在投影列表中；这是因为这些重投影不是纯数学公式，而是从一个到另一个的近似映射，并且逆向并不总是存在。你可以通过使用\
  \ ogr2ogr 和 gdal_transform 命令行将数据重投影到所需投影，然后在禁用投影即时转换的情况下将其加载到 QGIS 中来解决此问题。虽然这些投影的\
  \ proj4 字符串存在，但如果你尝试输入它们，QGIS 会拒绝它们。\n\n## 扩展 QGIS\n\n> 如果你禁用 **Projection-on-the-fly**，请确保所有图层都在同一投影中；否则，它们将无法对齐。此外，在转换为用于制图的投影之前执行所有分析步骤，因为测量单位可能会变得混乱。\n\
  \n跨越投影外边缘的几何图形并不总是能很好地截断。你经常会将其视为地图上意外的多边形带。在这种情况下，最简单的方法是删除超出预期映射区域的数据。你可以使用裁剪功能或简单地选择要保留的内容并\
  \ **Save Selection As** 一个新图层。\n\n还有其他常见的投影描述格式（`prj`、`WKT` 和 `proj4`）。幸运的是，有几个网站可以帮助你进行转换。有几个不错的网站可以查找现有的\
  \ Proj4 风格投影信息，网址为 `http://spatialreference.org` 和 `http://epsg.io`。\n\n## 另请参阅\n\
  \n- 需要更多关于如何为你制作的地图类型选择适当投影的信息？请参考 USGS 经典地图投影海报，网址为 `http://egsc.usgs.gov/isb/pubs/MapProjections/projections.html`。其中大部分也用于主题的\
  \ Wikipedia 文章，网址为 `http://en.wikipedia.org/wiki/Map_projection`。`https://www.mapthematics.com/ProjectionsList.php`\
  \ 链接也提供了大量投影列表，包括不寻常的带图片的投影。\n\n## 在日期变更线附近工作\n\n如果你阅读了上一条关于自定义投影的配方，你可能会注意到关于跨越投影边缘的数据以及它通常无法正确渲染的注释。在处理接近\
  \ -180 或 180 度经线的数据时，你会遇到这个问题。显示远东俄罗斯、斐济、新西兰和南太平洋等地的地图，举几个例子，通常会遇到这个问题。\n\n所需的解决方案实际上取决于你想要做什么。如果你只需要此类区域的地图，请选择一个在当地合适的投影。如果你有来自其他来源的现有数据，它可能沿边缘被切割，你可能需要将其重新拼接。对于世界地图，有时你必须修剪数据边缘的\
  \ .01 度，以免其显示异常。\n\n### 准备工作\n\n要遵循本配方，你需要示例数据中的 `honolulu-flights.shp` 图层和 SpatiaLite\
  \ 数据库 `new-zealand.sqlite`。\n\n### 如何操作...\n\n在 QGIS 中加载 `honolulu-flights.shp`\
  \ 图层。该图层代表从檀香山机场出发的大圆飞行线。正如你所见，它以非常奇怪的方式显示，因为一些飞行线跨越了日期变更线子午线：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_741_0.png)\n\
  \n要正确显示该图层，我们可以选择适合你地图的投影。为此，请执行以下步骤：\n\n- 1. 通过点击 *Ctrl + Shift + P* 键盘快捷键或导航到\
  \ **Project | Project Properties** 打开 **Project Properties** 对话框。\n- 2. 转到 **CRS**\
  \ 选项卡并激活 **Enable 'on the fly' CRS transformation** 复选框。\n- 3. 选择适合位置的投影。在我们的例子中，这是\
  \ WGS84/PDC Mercator (EPSG:3832)。\n\n> 请注意，对于不同位置，应使用不同的投影。\n\n\n\n\n4. 点击**确定**按钮保存更改并关闭对话框。现在，我们的数据将正确显示：\n\
  \n![](img/2e88bf5938bf48a409c0a534a8775b21_742_0.png)\n\n另一种选择是将数据裁剪到日期变更线。这可以使用\
  \ GDAL 工具集中的 `ogr2ogr` 工具完成。为此，请执行以下步骤：\n\n- 1. 如果您是 Windows 用户，请打开 OSGeo4W 命令提示符；如果您是\
  \ Linux 或 Mac OS 用户，请打开终端窗口。\n- 2. 将目录更改为 `honolulu-flights.shp` 所在的文件夹，例如以下目录：\n\
  \n  `cd c:\\data`\n\n- 3. 在命令提示符中输入以下命令。注意，我们先指定输出文件，再指定输入文件：\n\n  `ogr2ogr -wrapdateline\
  \ honolulu-flights-wrapped.shp honolulu-flights.shp`\n\n4. 将新创建的 `honolulu-flights-wrapped.shp`\
  \ 图层加载到 QGIS 中后，您将看到包裹在日期变更线上的航班正确显示：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_743_0.png)\n\
  \n5. 现在从 `new-zealand.sqlite` 数据库加载 `nz-coastlines-and-islands` 图层。您应该会看到两组相距很远的多边形。这就是新西兰岛和查塔姆群岛，它们本应位于附近。\n\
  \n![](img/2e88bf5938bf48a409c0a534a8775b21_743_1.png)\n\n为了正确显示它们，我们可以使用 SpatiaLite\
  \ 中提供的 `ST_Shift_Longitude` 函数。为此，请执行以下步骤：\n\n- 1. 通过单击工具栏上的按钮或导航到**数据库 | DB Manager\
  \ | DB Manager**，打开 **DB Manager** 插件。\n- 2. 在对话框左侧的连接树中展开 **SpatiaLite** 组，然后选择\
  \ `new-zealand` 数据库。\n- 3. 打开 **SQL 窗口**并运行以下查询：\n\n```\nUPDATE \"nz-coastlines-and-islands\"\
  \ SET\nGeometry=ST_Shift_Longitude(Geometry)\n```\n\n4. 从 QGIS 中移除 `nz-coastlines-and-islands`\
  \ 图层并重新添加。现在，新西兰岛和查塔姆群岛将正确显示，如下所示：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_744_0.png)\n\
  \n值得一提的是，`ST_Shift_Longitude` 函数在 PostGIS 中也可用。\n\n## 工作原理\n\n当我们启用“即时”CRS 变换时，每个几何图形都会被重新投影到给定的\
  \ CRS（在我们的示例中是以太平洋为中心），因此坐标现在具有相同的符号。\n\n带有 `-wrapdateline` 选项的 `ogr2ogr` 工具会将所有跨越日期变更线的几何图形分割并写入输出文件。不跨越日期变更线的几何图形将原样复制。\n\
  \n`ST_Shift_Longitude` 函数将负经度平移 360 度，因此所有数据将位于 0-360 度范围内，并正确显示。\n\n## 另请参阅\n\n\
  - http://docs.qgis.org/2.2/en/docs/user_manual/working_with_vector/supported_data.html#vector-layers-crossing-180-degrees-longitude\n\
  \n## 离线工作\n\n互联网是一种极好的资源，但有时你就是无法访问。对于野外作业、服务不稳定的地区、飞机上，甚至是会议室里，你也许无法获得所需的所有资料。这里的资料指的是文档（用户文档和开发文档），但更重要的是数据库图层（例如\
  \ PostGIS）和基于 Web 服务的图层（例如 WMS、WFS、OpenLayers 插件等）。\n\n本方案介绍如何在前往无网络连接的地方之前，将所需文件的本地副本缓存到计算机上。\n\
  \n### 准备工作\n\n对于本方案，您需要打开一个 PostGIS 数据库或 WFS，并启用 QGIS 附带的**离线编辑**插件。\n\n### 操作方法\n\
  \n- 1. 从 PostGIS 或 WFS 加载您的图层。\n- 2. 确保激活**离线编辑**选项。\n- 3. 在**数据库**菜单中，您应该会看到**离线编辑**，选择**转换为离线项目**：\n\
  \n![](img/2e88bf5938bf48a409c0a534a8775b21_745_0.png)\n\n- 4. 选择用于存储数据的本地文件。\n-\
  \ 5. 然后，选择要转换的所有图层（仅限矢量图层）：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_745_1.png)\n\
  \n- 6. 现在，您可以在不连接在线数据库的情况下使用您的 PostGIS 图层。请尝试进行一些编辑。（我们建议您在数据库或表的一个副本上执行此操作，直到您完全熟悉为止。）\n\
  - 7. 当您重新连接到网络时，您可以通过选择**同步**选项将更改发送到数据库：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_746_0.png)\n\
  \n## 工作原理\n\n基本原理很简单：您数据的副本会保存在您计算机本地的 SpatiaLite 数据库中。项目文件会记录更改，一切就绪，因为 SpatiaLite\
  \ 可以执行 QGIS 中任何其他矢量数据源可以执行的任何操作。\n\n在多用户环境中工作时请务必小心，如果多个用户独立修改同一数据集，此方法不处理编辑冲突。\n\
  \n## 更多内容\n\n此外，还有多种方法可以为栅格数据集（网络文件或 Web 服务）创建离线缓存，包括 `gdalwmscaching` 或 `mbtiles`。如果您计划有一段时间需要在没有互联网的情况下工作，请提前规划，并在真正需要离线之前测试解决方案。再多的插件也无法替代良好的规划。\n\
  \n请记住，在缓存 Web 服务（例如 Google 和 Bing）之前，请检查其合法性。OpenStreetMap 是离线使用的可靠瓦片来源，且不受限制。\n\
  \n## 另请参阅\n\n- GDAL WMS 缓存选项可在 http://www.gdal.org/frmt_wms.html 获取\n- 关于 mbtiles\
  \ 用法的讨论可在 http://blogs.terrorware.com/geoff/2012/11/17/offline-map-tiles-in-qgis/\
  \ 获取\n- 一个可帮助您进行设置的新插件可在 https://plugins.qgis.org/plugins/MBTiles2img/ 获取\n\n##\
  \ 使用 QspatiaLite 插件\n\n有时，您可能不需要将整个图层加载到 QGIS 中，而只需要其中的某个子集，或者动态执行一些计算。在这种情况下，运行复杂\
  \ SQL 查询并在 QGIS 中显示其结果的能力将非常有用。\n\n本方案介绍如何使用 QspatiaLite 插件执行 SQL 代码并在 QGIS 中加载数据。\n\
  \n### 准备工作\n\n要遵循本方案，您需要创建到 cookbook.db 数据库的连接，该数据库是在第 1 章“数据输入与输出”中的“将矢量图层加载到 SpatiaLite”方案中创建的。或者，您可以使用自己的\
  \ SpatiaLite 数据库，但请注意，您可能需要修改下面的一些 SQL 语句以匹配您的表。\n\n此外，从插件管理器安装 QspatiaLite 插件。\n\
  \n### 操作方法\n\n确保您已创建到 cookbook.db 的连接。通过导航到 数据库 | SpatiaLite | QspatiaLite 启动 QspatiaLite\
  \ 插件：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_747_0.png)\n\n要执行 SQL 查询，请执行以下步骤：\n\
  \n- 1. 从插件对话框左上角的组合框中选择要使用的数据库。\n- 2. 在 **SQL** 选项卡中，输入以下查询：\n\n```\nSELECT \"census_wake2000\"\
  .'pk' AS id,\n\"census_wake2000\".'geom' AS Geometry,\n\"census_wake2000\".'area',\
  \ \"census_wake2000\".'perimeter'\nFROM \"census_wake2000\" WHERE \"census_wake2000\"\
  .'perimeter' > 100000;\n```\n\n在对话框左侧的**表**树中双击表名和列名，即可轻松插入它们。\n\n- 3. 单击对话框底部的**运行**按钮执行查询。**结果**选项卡将自动打开，您可以以表格形式查看查询结果，如下所示：\n\
  \n![](img/2e88bf5938bf48a409c0a534a8775b21_748_0.png)\n\n如果查询结果包含几何信息（即所谓的几何列），您可以在\
  \ QGIS 中显示它们。为此，请执行以下步骤：\n\n- 1. 切换回 **SQL** 选项卡。\n- 2. 在**选项**组合框中，选择要执行的操作，例如**创建空间视图并加载到\
  \ QGIS**。\n- 3. 在**表**字段中，输入结果视图的名称，例如 `above100k`。\n\n\n\n\n-   4. 确保在 **几何** 字段中输入了几何列的正确名称。\n\
  -   5. 单击对话框底部的 **运行** 按钮。\n-   6. 将弹出一个对话框，询问源几何表。选择您在查询中使用的表，然后单击 **确定**。\n- \
  \  7. 将创建一个新视图，并作为新图层添加到 QGIS 中。\n\n## 工作原理...\n\n当我们单击 **运行** 按钮时，查询会被传递给 SpatiaLite\
  \ 数据库引擎执行，结果会返回到插件并显示在表格中。如果您想永久存储结果，可以使用插件对话框中的相应按钮将结果导出为文本文件或 OGR 兼容格式。\n\n##\
  \ 更多内容...\n\n您还可以使用 **DB Manager** 插件（随 QGIS 一起提供）直接执行 SQL 查询并将其加载为图层。\n\n## 另请参阅\n\
  \n-   ➤ 关于 SpatiaLite 和 SQL 的一篇很好的介绍可以在这里找到：`https://www.gaia-gis.it/fossil/libspatialite/wiki?name=misc-docs`。此外，受支持的空间\
  \ SQL 函数的完整列表可在 `http://www.gaia-gis.it/gaia-sins/spatialite-sql-4.3.0.html` 获取。\n\
  \n## 添加具有 Python 依赖项的插件\n\n虽然最常见的且广泛使用的 Python 包随 QGIS 一起提供，并且插件无需任何额外操作即可使用它们，但有些\
  \ QGIS 插件需要第三方 Python 包，而这些包在默认的 QGIS 安装中是不可用的。\n\n本教程将向您展示如何将缺失的 Python 包添加到 QGIS\
  \ 安装中。\n\n## 准备工作\n\n要遵循本教程，如果您是 Windows 用户并且 QGIS 安装在系统驱动器上，您可能需要管理员权限。\n\n## 操作步骤...\n\
  \n以下步骤将安装 pip——一个 Python 包管理工具：\n\n-   1. 从 https://raw.githubusercontent.com/pypa/pip/master/contrib/get-pip.py\
  \ 下载 `get-pip.py` 文件，并将其保存到硬盘的某个位置，例如 D:\\Downloads。\n-   2. 以管理员身份打开 OSGeo4W 命令提示符。右键单击桌面上的\
  \ **OSGeo4W Shell** 快捷方式，然后从上下文菜单中选择 **以管理员身份运行**。如果您在桌面上找不到此快捷方式，请在 Windows **开始**\
  \ 菜单中查找。\n-   3. 在 OSGeo4W 命令提示符中，输入 `python D:\\Downloads\\get-pip.py`。不要忘记将 D:\\\
  Downloads 替换为 `get-pip.py` 文件的正确路径。等待命令执行完成。\n\n现在，当 pip 准备好后，您就可以轻松地下载并安装第三方 Python\
  \ 包。为此，请执行以下步骤：\n\n-   1. 以管理员身份打开 OSGeo4W 命令提示符。右键单击桌面上的 **OSGeo4W Shell** 快捷方式，然后从上下文菜单中选择\
  \ **以管理员身份运行**。如果您在桌面上找不到此快捷方式，请在 Windows **开始** 菜单中查找。\n-   2. 在 OSGeo4W 命令提示符中，输入\
  \ `pip install package_name`。不要忘记将 `package_name` 替换为您要安装的包的名称。例如，如果您想安装 PySAL 包，请使用此命令：`pip\
  \ install pysal`。\n\n如果您是 Linux 用户，请使用您的包管理器安装 pip。例如，在 Debian 和 Ubuntu 下，使用 `sudo\
  \ apt-get install python-pip` 命令安装 pip。完成此操作后，您就可以按照上一段所述使用 pip 下载和安装包。\n\nMac OS\
  \ 用户可以通过 Homebrew 使用 `brew install pip` 命令安装 pip。\n\n使用 pip，您还可以查看已安装的包、更新它们以及移除它们。有关更多信息，请查看位于\
  \ https://pip.pypa.io/en/stable/ 的 pip 文档。\n\n## 工作原理...\n\npip 会从 Python 包索引（https://pypi.python.org/）下载所请求的包及其所有必要的依赖项，并将它们安装到与\
  \ QGIS 捆绑的 Python 中。\n\n## 更多内容...\n\n您还可以将在 Windows 注册表中将与 QGIS 捆绑的 Python 注册为系统默认\
  \ Python 版本。之后，您可以使用常规的 Windows 安装程序来安装所需的包。有关此主题的更多信息，请访问 https://trac.osgeo.org/osgeo4w/ticket/114。\n\
  \n## 使用 Python 控制台\n\nQGIS 内置了一个 Python 控制台，您可以在其中输入 Python 编程语言的命令并获得结果。这对于快速数据处理非常有用。\n\
  \n## 准备工作\n\n要遵循本教程，您应该熟悉 Python 编程语言。您可以在 https://docs.python.org/2.7/tutorial/index.html\
  \ 的官方 Python 文档中找到一份简短但详细的教程。\n\n另外，从示例数据中加载 `poi_names_wake.shp` 文件。\n\n## 操作步骤...\n\
  \n可以通过单击工具栏上的 **Python 控制台** 按钮，或者导航到 **插件 | Python 控制台** 来打开 QGIS Python 控制台。控制台将以非模态浮动窗口的形式打开，如下面的截图所示：\n\
  \n![](img/2e88bf5938bf48a409c0a534a8775b21_751_0.png)\n\n让我们看一下如何使用 QGIS Python\
  \ 控制台执行一些数据探索：\n\n-   1. 首先，有必要获取对活动图层（在图层树中选中的图层）的引用，并将其存储在变量中，以便后续使用。运行以下命令：\n\
  \    ```\n    layer = iface.activeLayer()\n    ```\n\n-   2. 获取到图层的引用后，我们可以检查它的一些属性。例如，要获取图层中的要素数量，请执行以下命令：\n\
  \    ```\n    layer.featureCount()\n    ```\n\n> 在任何时候，您都可以使用 dir() 函数列出对象所有可用的方法。尝试执行\
  \ dir(layer) 或 dir(QgsFeature)。\n\n-   3. 您还可以使用以下代码片段遍历图层要素并打印它们的属性：\n    ```\n\
  \    for f in layer.getFeatures():\n        print f[\"featurename\"], f[\"elev_m\"\
  ]\n    ```\n\n> 请注意，输入此代码后，您需要按两次 Enter 键以退出循环定义并开始执行命令。\n\n您还可以使用 Python 控制台执行更复杂的任务，例如将具有某些属性的要素导出到文本文件。具体操作如下：\n\
  \n-   1. 使用 Python 控制台左侧的 **显示编辑器** 按钮打开 Python 控制台编辑器。\n\n-   2. 将以下代码粘贴到编辑器中（请确保根据您的系统更改文件路径）：\n\
  \    ```\n    import csv\n    layer = iface.activeLayer()\n    with open('c:\\\\\
  temp\\\\export.csv', 'wb') as outputFile:\n        writer = csv.writer(outputFile)\n\
  \        for feature in layer.getFeatures():\n            geom = feature.geometry().exportToWkt()\n\
  \            writer.writerow([geom, feature[\"featurename\"], feature['elev_m']])\n\
  \    ```\n\n-   3. 如果您使用的是自己的矢量图层，而不是本书提供的 poi_names_wake.shp，请调整第 8 行中的属性名称。\n\n\
  -   4. 根据您的操作系统更改第 4 行中结果文件的文件路径。\n-   5. 保存脚本并运行它。在运行脚本之前，不要忘记在 QGIS 图层树中选择矢量图层。\n\
  \n## 工作原理...\n\n在第 1 行，我们从标准 Python 库中导入了 csv 模块。该模块提供了一种读写逗号分隔文件的便捷方式。在第 3 行，我们获取了当前选中图层的引用，该引用将在后续用于访问图层要素。\n\
  \n在第 3 行，打开了一个输出文件。请注意，这里我们使用了 with 语句，这样之后就不需要显式关闭文件，上下文管理器会为我们完成这项工作。在第 5 行，我们设置了所谓的\
  \ writer 对象，它将使用指定的格式设置将数据写入 CSV 文件。\n\n在第 6 行，我们开始遍历活动图层的要素。对于每个要素，我们提取了它的几何图形，并将其转换为\
  \ Well-Known Text（WKT）格式（第 7 行）。然后，我们将要素几何图形的这种文本表示形式连同一些属性写入输出文件（第 8 行）。\n\n有必要说明一下，我们的脚本非常简单，仅适用于具有\
  \ ASCII 编码的属性。为了处理非拉丁字符，有必要在将输出数据写入文件之前将其转换为 unicode。\n\n## 更多内容...\n\n使用 Python\
  \ 控制台，您还可以调用处理算法来创建用于自动分析和/或数据准备的复杂脚本。\n\n为了让 Python 控制台更加有用，请查看 Script Runner 插件。有关此插件的详细信息及一些使用示例，请访问\
  \ http://spatialgalaxy.net/2012/01/29/script-runner-a-plugin-to-run-python-scripts-in-qgis/。\n\
  \n## 另请参阅\n\n-   如果您是 Python 和 QGIS API 的新手，请不要忘记查看以下文档：\n    -   官方 Python 文档和教程可在\
  \ https://docs.python.org/2/ 找到\n    -   QGIS API 文档可在 http://qgis.org/api/2.8/\
  \ 找到\n    -   PyQGIS 开发者食谱可在 http://docs.qgis.org/2.8/en/docs/pyqgis_developer_cookbook/\
  \ 找到\n\n\n+   另一个学习使用 QGIS 进行编程的极佳资源是 *《QGIS Python 编程食谱》（Joel Lawhead 著）*，由 Packt\
  \ Publishing 出版。\n\n## 编写处理算法\n\n您可以通过添加可在 Processing 框架内使用的脚本，来扩展 QGIS 的功能。这将使您能够创建自己的分析算法，然后从工具箱或任何生产力工具（例如批处理界面或图形化建模器）中高效地运行它们。\n\
  \n本节介绍如何创建 Processing 算法的基本概念。\n\n## 准备工作\n\n理解本节需要具备一定的 Python 基础知识。此外，由于本节使用 Processing\
  \ 框架，在学习之前您应该熟悉该框架。\n\n## 操作步骤...\n\n我们将添加一个新流程，用来筛选图层的多边形，生成一个新图层，其中仅包含面积大于给定值的多边形。具体操作如下：\n\
  \n-   1. 在**处理工具箱**菜单中，转到**脚本/工具**组，然后双击**创建新脚本**项。您将看到以下对话框：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_754_0.png)\n\
  \n2. 在对话框的文本编辑器中，粘贴以下代码：\n\n```\n##Cookbook=group\n##Filter polygons by size=name\n\
  ##Vector_layer=vector\n##Area=number 1\n##Output=output vector\n\nlayer = processing.getObject(Vector_layer)\n\
  provider = layer.dataProvider()\nwriter = processing.VectorWriter(Output, None,\n\
  \    provider.fields(), provider.geometryType(), layer.crs())\nfor feature in processing.features(layer):\n\
  \    print feature.geometry().area()\n    if feature.geometry().area() > Area:\n\
  \        writer.addFeature(feature)\ndel writer\n```\n\n3. 选择“保存”按钮以保存脚本。在出现的文件选择器中，输入扩展名为\
  \ .py 的文件名。不要将其移动到其他文件夹。请确保使用文件选择器打开时默认选中的文件夹。\n\n4. 关闭编辑器。\n\n5. 转到工具箱中的“脚本”组，您将看到一个新的名为“Cookbook”的组，其中包含一个名为“Filter\
  \ polygons by size”的算法。\n\n6. 双击它将其打开，您将看到以下参数对话框，与您在其他任何 Processing 算法中看到的类似：\n\
  \n![](img/2e88bf5938bf48a409c0a534a8775b21_755_0.png)\n\n## 工作原理...\n\n该脚本主要包含两部分：\n\
  \n-   一部分用于定义算法的特征。这部分用于定义算法的语义，以及一些附加信息，例如算法的名称和所属组。\n-   另一部分接收用户输入的参数，并对其进行处理以生成输出。算法本身的功能就在这里实现。\n\
  \n在我们的示例中，第一部分如下所示：\n\n```\n##Cookbook=group\n##Filter polygons by size=name\n##Vector_layer=vector\n\
  ##Area=number 1\n##Output=output vector\n```\n\n我们定义了两个输入（图层和面积值），并声明一个输出（过滤后的图层）。这些元素是使用带有双\
  \ Python 注释符（#）的 Python 注释来定义的。\n\n第二部分包含代码本身，如下所示：\n\n```\nlayer = processing.getObject(Vector_layer)\n\
  provider = layer.dataProvider()\nwriter = processing.VectorWriter(Output, None,\n\
  \    provider.fields(), provider.geometryType(), layer.crs())\nfor feature in processing.features(layer):\n\
  \    print feature.geometry().area()\n    if feature.geometry().area() > Area:\n\
  \        writer.addFeature(feature)\ndel writer\n```\n\n我们在第一部分中定义的输入在这里将可用，我们可以使用它们。对于面积，我们将有一个名为\
  \ Area 的变量，包含一个数字。对于矢量图层，我们将有一个 Layer 变量，包含所选图层的源字符串。\n\n利用这些值，我们使用 PyQGIS API 进行计算并创建新图层。该图层保存在\
  \ Output 变量所包含的文件路径中，该路径是用户在运行算法时选择的路径。\n\n除了使用常规的 Python 和 PyQGIS 接口外，Processing\
  \ 还包含一些类和函数，这样更容易编写脚本，并且这些类和函数封装了 QGIS 一些最常见的功能。\n\n特别是 `processing.features(layer)`\
  \ 方法很重要。它提供了一个图层中要素的迭代器，但只考虑选中的要素。如果没有选中项，它会遍历图层中的所有要素。这是任何 Processing 算法的预期行为，因此必须使用此方法，以便在您的脚本中提供一致的行为。\n\
  \n## 更多内容...\n\nProcessing 提供的一些核心算法实际上也是脚本，比如我们刚刚创建的脚本，但它们不会出现在“脚本”部分。相反，它们出现在**QGIS\
  \ 算法**部分，因为它们是 Processing 的核心组成部分。\n\n其他脚本不属于 Processing 本身，但可以轻松地从工具箱中使用**工具/从在线集合获取脚本**菜单进行安装：\n\
  \n您将看到一个如下所示的窗口：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_757_0.png)\n\n只需选择您要安装的脚本，然后点击**确定**。所选脚本现在会出现在工具箱中。您可以像使用任何其他\
  \ Processing 算法一样使用它们。\n\n## 编写 QGIS 插件\n\nQGIS 广受欢迎的主要原因之一是其可扩展性。利用 QGIS API 提供的基本工具和功能，可以实现新的功能并将其作为新插件添加，还可以通过将其贡献到\
  \ QGIS 插件库来实现共享。\n\n## 另请参阅\n\n-   - 关于创建脚本和从 QGIS Python 控制台运行 Processing 代码的所有信息，都可以在\
  \ QGIS 手册的相应章节中找到。\n\n## 准备工作\n\n要开发新的 QGIS 插件，您应该熟悉 Python 编程语言。如果插件带有图形界面，您还需要具备一些\
  \ Qt 框架的知识，因为所有 UI 元素（如对话框）都使用 Qt。要访问 QGIS 功能，您需要了解 QGIS API。\n\n一个非常有用的资源（还有其他一些）是\
  \ GeoAPIs 网站，它由 SourcePole 创建，网址为 `http://geoapis.sourcepole.com/`。\n\n为了简化插件的创建，我们将使用一个名为\
  \ Plugin Builder 的附加插件。它应该已安装在您的 QGIS 应用程序中。\n\n## 操作步骤...\n\n以下步骤将创建一个新插件，用于打印当前\
  \ QGIS 项目中加载的图层的详细信息：\n\n-   1. 通过导航到**插件 | Plugin Builder**打开 Plugin Builder。\n\
  -   2. 填写将出现的对话框，如下面的截图所示：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_759_0.png)\n\
  \n3. 点击“确定”。\n\n4. 在出现的文件夹选择对话框中，选择要存储插件的文件夹。点击“确定”，插件骨架将被创建。在所选文件夹中，您现在会看到一个名为\
  \ LayerInfoPlugin 的子文件夹，其中包含以下内容（方括号中的项表示文件夹）：\n\n```\n[help]\n[i18n]\n[scripts]\n\
  [test]\nicon.png\nlayerinfo.py\nlayerinfo_dialog.py\nlayerinfo_dialog_base.ui\n\
  Makefile\nmetadata.txt\npb_tool.cfg\n```\n\nplugin_upload.py\npylintrc\nREADME.html\n\
  README.txt\nresources.qrc\n__init__.py\n\n5. 在文本编辑器中打开 layerinfo.py 文件。在文件末尾，您会找到\
  \ run() 方法，代码如下：\n\n```\ndef run(self):\n    \"\"\"Run method that performs all\
  \ the real work\"\"\"\n    # show the dialog\n    self.dlg.show()\n    # Run the\
  \ dialog event loop\n    result = self.dlg.exec_()\n    # See if OK was pressed\n\
  \    if result: pass\n```\n\n6. 将 run 方法替换为以下代码：\n\n```\ndef run(self):\n    layers\
  \ = self.iface.legendInterface().layers()\n    print \"---LAYERS INFO---\"\n   \
  \ for layer in layers:\n        print \"Layer name: \" + layer.name()\n        print\
  \ \"Layer source \" + layer.source()\n        print \"Extent: \" + layer.extent().asWktCoordinates()\n\
  \        print\n```\n\n7. 打开终端并运行 easy_install pb_tool 来安装 pb_tool 应用程序（您也可以使用 pip\
  \ install pb_tool 或任何其他从 PyPI 安装库的方式）。\n\n8. 在包含插件代码的文件夹中打开终端，运行 pb_tool 并编译。然后，运行\
  \ pb_tool deploy 以将插件安装到您的本地 QGIS 中。\n\n9. 打开 QGIS。转到插件管理器，确保我们创建的新插件存在并且已启用：\n\n\
  ![](img/2e88bf5938bf48a409c0a534a8775b21_760_0.png)\n\n\n\n\n\n10. 在“插件”菜单中，现在将出现与插件对应的条目：\n\
  \n![](img/2e88bf5938bf48a409c0a534a8775b21_761_0.png)\n\n11. 向项目中添加一些图层，以便插件能够显示关于它们的信息。\n\
  \n12. 打开 QGIS Python 控制台。\n\n13. 通过选择其菜单条目来运行插件。项目中各图层的信息将显示在控制台中：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_761_1.png)\n\
  \n## 工作原理...\n\nPlugin Builder 插件会获取一些关于待创建插件的基本信息，并使用这些信息创建其骨架。默认情况下，它包含一个菜单条目，该条目成为从\
  \ QGIS 界面进入插件的入口点。\n\n当选择该菜单项时，插件代码中的相应操作会被执行。在本例中，它运行了我们添加代码的 `run()` 方法。\n\n该插件始终持有对\
  \ QGIS 实例（`QgsInterface` 类的对象）的引用，该实例可用于访问 QGIS API 并与当前 QGIS 会话中的元素交互。在我们的案例中，它被用来访问图例（legend），图例中包含当前项目中加载的所有图层列表。通过分别调用这些图层的相应方法，可检索并打印出关于它们的信息。\n\
  \n标准输出被重定向到 QGIS Python 控制台，因此使用 Python 内置的 `print` 命令打印文本时，若控制台已打开，文本将显示在控制台中。\n\
  \nQGIS 将插件存储在当前用户文件夹下的 `.qgis2/python/plugin` 文件夹中。例如，使用 Plugin Manager 下载新插件时就会放到这里。每次启动\
  \ QGIS 时，它都会在该文件夹中查找插件并加载它们。复制该文件夹是由我们运行的 deploy 任务完成的，这使得 QGIS 能够发现插件，并在 QGIS 启动时将其添加到可用插件列表中。\n\
  \n## 更多内容...\n\n以下是一些创建更佳插件并管理它们的想法。\n\n## 创建具有更复杂 UI 元素的插件\n\n我们创建的插件没有 UI 元素。不过，在插件生成器创建的文件中，你可以找到一个带有\
  \ `.ui` 扩展名的基础对话框文件。你可以对其进行编辑以创建一个对话框，之后在插件代码中调用即可使用。要了解更多关于如何创建和使用 Qt 框架（QGIS 构建于该框架之上）中的\
  \ UI 元素，请查阅 PyQt 文档。\n\n## 为你的插件编写文档\n\n插件生成器创建的另一个内容是 Sphinx 文档项目，你可以使用 RestructuredText\
  \ 编写插件的使用文档。要了解更多关于 Sphinx 的信息，请访问 Sphinx 官方网站：http://www.sphinx-doc.org/en/stable/。\n\
  \n文档项目会在运行 deploy 任务时构建，并生成 HTML 文件放置到插件文件夹中。\n\n## 发布你的插件\n\n当你的插件完成后，将其分享出去供他人使用会是一个好主意。如果将插件上传到\
  \ QGIS 插件服务器，所有 QGIS 用户都能轻松地通过 Plugin Manager 获取它，并获得最新更新。\n\n要上传插件，你首先需要创建一个包含其所有代码和资源的\
  \ ZIP 文件。有一个 `pb_tool` 任务可以完成此操作，你只需在终端运行 `pb_tool zip`。使用生成的 ZIP 文件，你就可以开始发布流程。更多相关信息可参阅\
  \ http://docs.qgis.org/2.6/en/docs/pyqgis_developer_cookbook/releasing.html。\n\n\
  ## 使用外部工具\n\n虽然 QGIS 本身是一个优秀且功能丰富的程序，但有时使用更合适的工具来执行一些简单或复杂的操作会更好。本方法向你展示如何使用其中一些第三方工具。\n\
  \n## 准备工作\n\n要遵循本方法，你需要书附数据集中的 `btnmeatrack_2014-05-22_13-35-40.nmea` 文件。我们还将使用在第1章“数据输入与输出”的“将矢量图层加载到\
  \ SpatiaLite”一节中创建的 `cookbook.db` SpatiaLite 数据库，以及在第6章“网络分析”中开发的 PostgreSQL 数据库。\n\
  \n此外，别忘了安装 GPSBabel（通常与 QGIS 一起提供）、spatialite-gui 和 pgAdmin（这些需要手动安装）。\n\n## 操作步骤...\n\
  \n首先，我们将使用 GPSBabel 将 NMEA 数据转换为 GPX 格式，然后学习如何使用 SpatiaLite GUI 工具和 pgAdmin 来处理数据库。\n\
  \n## GPSBabel\n\nGPSBabel 是一个命令行工具，用于以不同格式操作、转换和处理 GPS 数据（航点、轨迹和路线）。\n\n要将文件从 NMEA\
  \ 格式转换为更常见的 GPX 格式，请按以下步骤操作：\n\n- 1. 打开命令提示符，转到 `btnmeatrack_2014-05-22_13-35-40.nmea`\
  \ 文件所在的目录。通常，可以使用 `cd` 命令完成，例如，如果文件位于 `C:` 盘的 `data` 目录中，请使用以下命令：\n- \n- `cd c:\\\
  data`\n\n- 2. 在命令提示符中，输入以下命令将 NMEA 文件转换为 GPX 文件：\n- \n- `gpsbabel -i nmea -f btnmeatrack_2014-05-22_13-35-40.nmea\
  \ -o gpx -F 2014-05-22_13_35-40.gpx`\n\n## spatialite-gui\n\nspatialite-gui 是一个支持\
  \ SpatiaLite 的 GUI 工具。它非常轻量，当需要快速执行一些查询或只想检查 SQLite/SpatiaLite 数据库的内容时非常有用。\n\n\
  要浏览 SpatiaLite 数据库中的空间表或非空间表，请执行以下步骤：\n\n- 1. 双击 `spatialite-gui` 的可执行文件来启动它。\n\n\
  - 2. 通过导航到 **文件 | 连接现有 SQLite 数据库**，或单击工具栏上的相应按钮，连接到要浏览的数据库。\n\n- 3. 在 spatialite-gui\
  \ 对话框左侧的表格树中选择要浏览的表，单击鼠标右键打开其上下文菜单，然后选择“编辑表行”菜单项。\n\n- 4. 如果表包含空间数据，则可以查看不同表示的几何图形。在行中选择带有几何信息的字段，单击鼠标右键打开上下文菜单，然后选择“BLOB\
  \ 浏览”菜单项：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_764_0.png)\n\n在进行大规模编辑后，尤其是当表被修改或删除时，建议运行\
  \ VACUUM 命令来重建数据库。为此，请执行以下步骤：\n\n- 1. 双击 `spatialite-gui` 的可执行文件来启动它。\n\n- 2. 通过导航到\
  \ **文件 | 连接现有 SQLite 数据库**，或单击工具栏上的相应按钮，连接到要浏览的数据库。\n\n- 3. 导航到 **文件 | 优化当前 SQLite\
  \ 数据库 [VACUUM]**，或单击工具栏上的相应按钮。\n\n## pgAdmin\n\npgAdmin 是一个用于 PostgreSQL 数据库的管理工具和开发平台。它允许你执行管理任务（如备份和恢复）、运行简单查询以及从零开始开发新数据库。\n\
  \n要使用 pgAdmin 创建数据库备份，请按以下步骤操作：\n\n- 1. 通过单击桌面快捷方式或在 **开始** 菜单中找到 pgAdmin 来启动它。\n\
  \n- 2. 如果数据库服务器连接尚不存在，请通过导航到 **文件 | 添加服务器...** 或单击工具栏上的相应按钮来创建连接。\n\n- 3. 在 **pgAdmin**\
  \ 窗口左侧的 **对象浏览器** 中双击数据库服务器的名称，连接到你的数据库所在的服务器。\n\n- 4. 选择要备份的数据库，单击鼠标右键打开其上下文菜单，然后选择\
  \ **备份**。将打开备份设置对话框，如下面的截图所示：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_765_0.png)\n\
  \n- 5. 选择备份保存的位置，根据需要调整备份选项，然后点击 **备份** 按钮开始备份过程。进度将显示在 **消息** 选项卡中。\n\n要从备份中恢复数据库，请执行以下步骤：\n\
  \n- 1. 通过单击桌面快捷方式或在 **开始** 菜单中找到 pgAdmin 来启动它。\n\n- 2. 如果数据库服务器连接尚不存在，请通过导航到 **文件\
  \ | 添加服务器...** 或单击工具栏上的相应按钮来创建连接。\n\n- 3. 连接到要恢复备份的数据库服务器，并在 pgAdmin 窗口左侧的 **对象浏览器**\
  \ 中双击其名称。\n\n- 4. 选择要恢复的数据库，单击鼠标右键打开其上下文菜单，然后选择 **恢复**。将打开恢复选项对话框，如下面的截图所示：\n\n\
  ![](img/2e88bf5938bf48a409c0a534a8775b21_766_0.png)\n\n> 值得一提的是，pgAdmin 用于恢复的 pg_restore\
  \ 工具无法创建需要恢复的数据库。必须先手动创建一个新的空数据库，然后使用这个新创建的数据库开始恢复。\n\n\n\n\n\n+   5. 选择备份文件的存储位置并根据需要调整恢复选项。\n\
  \n![](img/2e88bf5938bf48a409c0a534a8775b21_767_0.png)\n\n请注意，你可以恢复单个表或模式，只需在选择备份文件后点击\
  \ **Display objects** 按钮，并在 **Objects** 选项卡中选择所需对象。\n\n+   6. 点击 **Restore** 按钮开始恢复。进度将在\
  \ **Messages** 选项卡中显示。\n\n## How it works...\n\n这里的所有工具都使用与 QGIS 相同的档案格式。这使得在工作时具有更大的灵活性，可以在合适的时间使用最佳工具。\n\
  \n## There's more...\n\n还有许多其他不同的工具在各种情况下可能很有用，例如，exiv2 可用于操作照片的 EXIF 标签，ImageMagick\
  \ 用于处理栅格，等等。\n"
