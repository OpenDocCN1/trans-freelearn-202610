  \n# 一个动态 Web 应用程序 – OpenLayers AJAX 与 Python 和 SpatiaLite\n\n在本节中，我们将制作我们的 Web 应用程序，与迄今为止的任何应用程序不同，它涉及客户端和服务器之间的动态交互。我们还将使用不同的\
  \ Web 地图客户端 API——OpenLayers。OpenLayers 长期以来一直是 Web 制图的领导者；然而，最近它已被 Leaflet 等较小的客户端所掩盖。随着最新版本\
  \ OpenLayers 3 的发布，OpenLayers 已精简，但仍在大多数领域保留了相对于其更新同行的功能优势。\n\n# 服务器端 – CGI in Python\n\
  \n**Common Gateway Interface (CGI)** 也许是运行动态 Web 使用的服务器端代码的最简单方法。这使其非常适合进行概念验证学习。CGI\
  \ 最典型的用途是在数据处理和通过 HTTP POST 从 Web 表单接收后将其传递到数据库。最常见的攻击向量是 SQL 注入。再进一步，类似 CGI 的动态处理通常通过最小框架实现，例如\
  \ Bottle、CherryPy 或 Flask，以处理路由和有时模板等常见任务，从而提供更安全的环境。\n\n不要忘记 Python 对缩进敏感。缩进始终以空格表示，每个层级使用统一数量。例如，if\
  \ 块可能包含以四个空格为前缀的行。如果 if 块位于 for 循环内，同一行应以 8 个空格为前缀。\n\n## Python CGI 开发\n\n接下来，我们将通过单独的\
  \ Windows 控制台会话启动一个 CGIHTTPServer 主机实例。然后，我们将通过 QGIS Python 控制台主要进行服务器端代码的开发。\n\n\
  ### 启动 CGI 主机\n\n启动 CGI 会话很简单——你只需直接使用 Python 的 -m 命令行开关，它会像加载脚本一样加载模块。以下代码在端口 8000\
  \ 启动 CGIHTTPServer。当前工作目录将被作为公共 Web 目录提供服务；在本例中，这是 `C:\\packt\\c6\\data\\web`。\n\
  \n在新的 Windows 控制台会话中运行以下命令：\n\n```\ncd C:\\packt\\c6\\data\\web\npython -m CGIHTTPServer\
  \ 8000\n```\n\n### 测试 CGI 主机\n\nPython（.py）CGI 文件只能从名为 cgi 或 cgi-bin 的目录中运行。这是确保我们有意将此目录中的文件设为可公开执行的一项预防措施。\n\
  \n为此，在 `c6/data/web/cgi-bin/simple_test.py` 创建一个文件，内容如下：\n\n> 第一行是我们的 shebang，它允许此文件通过\
  \ Unix 系统路径中列出的解释器独立执行。虽然这对 Windows 系统没有影响，在 Windows 系统中执行通过文件关联处理，但我们仍将其保留在此处以实现互操作性。\n\
  \n```\n#!/usr/bin/python\n\n# Import the cgi, and system modules\nimport cgi, sys\n\
  \n# Required header that tells the browser how to render the HTML.\nprint \"Content-Type:\
  \ text/html\\n\"\nprint \"Hello world\"\n```\n\n现在，当你在浏览器中访问 `http://localhost:8000/cgi-bin/simple_test.py`\
  \ 时，你应该会看到 \"Hello world\" 消息。为了在客户端进行调试，请确保你使用基于浏览器的 Web 开发视图、插件或扩展，例如 Chrome 的\
  \ Developer Tools 工具栏或 Firefox 的 Firebug 扩展。\n\n\n\n\n\n## 调试服务器端代码\n\n以下是在 Python\
  \ CGI 开发过程中进行调试的几种方式：\n\n- 使用 QGIS 中的 Python 控制台（导航至**插件 | Python 控制台**）。你可以直接在此处运行\
  \ Python CGI 脚本中的代码；但是，对于依赖 HTTP 传递信息的脚本，这种方式可能会失败，但你至少可以捕获语法错误，也可以用预期的值填充这些变量，以便与在浏览器中获得的结果进行比较。有时，你需要退出\
  \ QGIS 以清除 Python 解释器的内存。\n- 更快捷的方式是在命令行中使用 `-d`（详细调试）参数运行脚本。这样可以捕获交互式使用中可能不会出现的问题，避免可能在同一交互会话中无意设置的变量（将\
  \ `index.py` 替换为你的 Python 脚本名称）。在命令行 shell 中运行以下命令：\n  `python -d C:\\packt\\c6\\\
  data\\web\\cgi-bin\\index.py`\n- 如果你的 Python CGI 脚本与数据库交互，一定要通过 DB Manager SQL 窗口（或你喜欢的任何数据库接口）测试查询。通常，将预期值填充到查询中会有帮助。\n\
  - 在浏览器中访问以下地址（将 `index.py` 替换为你的 Python 脚本名称）：\n  `localhost:8000/cgi-bin/index.py`\n\
  \n## 我们的 Python 服务器端数据库驱动代码\n\n现在，让我们来创建一个 Python 代码，为我们的 SQLite 数据库提供动态 Web 访问。\n\
  \n### PySpatiaLite\n\nPySpatiaLite 模块提供对 SpatiaLite 数据库的 dbapi2 访问。Dbapi2 是与 Python\
  \ 数据库交互的标准库。这非常幸运，因为如果您仅使用 sqlite3 模块中的 dbapi2 连接器，任何使用空间类型或函数的查询都会失败。sqlite3 模块并非为支持\
  \ SpatiaLite 而构建。\n\n将以下内容添加到前面的代码中。这将执行以下功能：\n\n- 导入 PySpatiaLite 模块并连接到我们的 sqlite3/SpatiaLite\
  \ 数据库。\n- 使用连接作为上下文管理器，该管理器会自动提交已执行的查询，并在出错时回滚。\n- 若要测试连接是否有效，请在 `SELECT` 查询中使用\
  \ `SQLITE_VERSION()` 函数并打印结果。\n\n以下代码追加到前面的代码中，可以在 `c6/data/web/cgi-bin/db_test.py`\
  \ 找到。请确保代码中 SQLite 数据库文件的路径与您系统上的实际位置一致。\n\n```python\n# Import the pySpatiaLite\
  \ module\nfrom pySpatiaLite import dbapi2 as sqlite3\nconn = sqlite3.connect('C:\\\
  packt\\c6\\data\\web\\cgi-bin\\c6.sqlite')\n\n# Use connection handler as context\n\
  with conn:\n    c = conn.cursor()\n    c.execute('SELECT SQLITE_VERSION()')\n\n\
  \    data = c.fetchone()\n    print data\n    print 'SQLite version:{0}'.format(data[0])\n\
  ```\n\n您可以在浏览器中通过 `http://localhost:8000/cgi-bin/db_test.py` 查看以下结果。\n\n```\n(u'3.7.17',)\
  \ SQLite version:3.7.17\n```\n\n第一次打印数据时，该数据以 `u` 为前缀，并用单引号括起来。这表示这是一个 unicode 字符串（因为我们的数据库使用\
  \ unicode 编码）。如果我们访问此字符串中的元素 0，则会得到一个不带引号的结果。\n\n### 通过 JSON 实现 SQLite 的 Web 访问的\
  \ Python 代码\n\n以下代码执行以下功能：\n\n- 它连接到数据库。\n- 它发出查询，以在给定指定位置和日期的情况下，查找最小距离的位置和字段。\n\
  - 它根据数据库结果字段的名称和值，返回带有字段/值对的 JSON。\n\n您可以在 `c6/data/web/cgi-bin/get_json.py` 找到该代码：\n\
  \n```python\n#!/usr/bin/python\n\nimport cgi, cgitb, json, sys\nfrom pyspatialite\
  \ import dbapi2 as sqlite3\n\n# Enables some debugging functionality\ncgitb.enable()\n\
  \n# Creating row factory function so that we can get field names\n# in dict returned\
  \ from query\ndef dict_factory(cursor, row):\n    d = {}\n    for idx, col in enumerate(cursor.description):\n\
  \        d[col[0]] = row[idx]\n    return d\n\n# Connect to DB and setup row_factory\n\
  conn = sqlite3.connect('C:\\\\packt\\\\c6\\\\data\\\\web\\\\cgi-bin\\\\c6.sqlite')\n\
  conn.row_factory = dict_factory\n\n# Print json headers, so response type is recognized\
  \ and correctly\n# decoded\nprint 'Content-Type: application/json\\n\\n'\n\n# Use\
  \ CGI FieldStorage object to retrieve data passed by HTTP GET\n# Using numeric datatype\
  \ casts to eliminate special characters\nfs = cgi.FieldStorage()\nlongitude = float(fs.getfirst('longitude'))\n\
  latitude = float(fs.getfirst('latitude'))\nday = int(fs.getfirst('day'))\n\n# Use\
  \ user selected location and days to find nearest location\n# (minimum distance)\
  \ and correct date column\nquery = 'SELECT pk, calc{2} as index_value, min(Distance(PointFromText(\\\
  'POINT ({0} {1})\\'),geom)) as min_dist FROM vulnerability'.format(longitude, latitude,\
  \ day)\n\n# Use connection as context manager, output first/only result row as json\n\
  with conn:\n    c = conn.cursor()\n    c.execute(query)\n    data = c.fetchone()\n\
  \    print json.dumps(data)\n```\n\n您可以通过注释掉上述代码中从 HTTP 请求获取参数的部分，并任意设置这些参数来测试上述代码。\n\
  \n完整代码位于 `c6/data/web/cgi-bin/json_test.py`：\n\n```python\n# longitude = float(fs.getfirst('longitude'))\n\
  # latitude = float(fs.getfirst('latitude'))\n# day = int(fs.getfirst('day'))\nlongitude\
  \ = -75.28075\nlatitude = 39.47785\nday = 15\n```\n\n如果您浏览到 `http://localhost:8000/cgi-bin/json_test.py`，您将在浏览器中看到打印出的字面\
  \ JSON。您也可以浏览包含这些参数的以下 URL 来完成相同的操作： `http://localhost:8000/cgi-bin/get_json.py?longitude=-75.28075&latitude=39.47785&day=15`。\n\
  \n```\n{\"pk\": 260, \"min_dist\": 161.77454362713507, \"index_value\": 7}\n```\n\
  \n## OpenLayers/jQuery 客户端代码\n\n现在我们的后端代码和依赖都已就绪，是时候将其集成到我们的前端界面中了。\n\n### 使用 QGIS\
