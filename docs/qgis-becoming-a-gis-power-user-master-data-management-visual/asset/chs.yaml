  \n## 摘要\n\n在本章中，我们通过一个物理栅格分析示例：水文分析，创建了一个动态 Web 应用程序。为此，我们首先准备用于水文分析的栅格高程数据，然后执行了分析。我们探讨了如何使用模型器工作流自动化工具来自动化该工作流。接下来，我们使用\
  \ NNJoin 在一些水文输出之间创建空间连接，以生成适合 Web 交互和查询的数据源。最后，我们将这些数据发布到外部云平台 CartoDB，并在 JavaScript\
  \ 函数中实现其 SQL API，以根据 Leaflet Web 客户端交互，查找位于某地点上游的有毒站点。在下一章中，我们将使用网络分析和众包交互来创建一个\
  \ Web 应用程序。\n"
- "## 4 寻找最佳路径\n\n在本章中，我们将探索正式的类网络地理矢量对象关系。拓扑关系在地理数据管理和分析中有很多用途，但也许最重要的应用是最优路径搜索。具体来说，你将学习如何创建与最优路径相关的几个可视化：等时圈多边形和累积交通线。以这些视觉元素为背景，我们将在我们的\
  \ Web 地图应用程序中通过 Twitter 融入社交媒体反馈。最终结果将是一个能与利益相关者就安全上学路线进行双向交流的应用程序。\n\n在本章中，我们将涵盖以下主题：\n\
  \n- 下载 OpenStreetMap 数据\n- 空间查询\n- 安装 Postgres/PostGIS/pgRouting\n- 构建拓扑网络\n- DB\
  \ 管理器\n- 使用最短路径插件测试拓扑\n- 生成到达每个路段的代价\n- 创建等时圈等高线\n- 生成所有学生的最短路径\n- 通过 Python 添加\
  \ Twitter 数据\n\n\n\n\n# Postgres、PostGIS 与 pgRouting\n\n基于矢量的 GIS——即便不是按定义，至少在实际操作中——是围绕地理对象数据库来组织的，存储其几何定义、地理元数据、对象关系及其他属性。Postgres\
  \ 是领先的开源关系数据库平台。与 SQLite 不同，它不是基于文件的系统，而是需要在可用机器（如 localhost 或可访问的服务器）上运行服务。Postgres\
  \ 的空间扩展 PostGIS 提供了围绕地理空间数据的所有功能，如空间参考、地理变换、空间关系等。最近，PostGIS 已开始支持拓扑——几何对象之间的正式关系。pgRouting\
  \ 是一个围绕最优路径查找构建的拓扑分析引擎。方便的是，PostGIS 现在已捆绑 pgRouting。以下内容适用于 Postgres 9.3。\n\n##\
  \ 安装 Postgres/PostGIS/pgRouting\n\n在 Windows 上，您可以使用 Postgres 安装程序将 PostGIS 和 pgRouting\
  \ 与 Postgres 一起安装。在 Mac 上，您可以使用 http://www.kyngchaos.com/software/postgres 上提供的\
  \ Kyngchaos 二进制安装程序。在 Linux 上，您可以参考 http://postgis.net/install/ 上针对您的发行版的 PostGIS\
  \ 安装文档。\n\nWindows 的安装说明如下：\n\n- 1. 从 http://www.postgresql.org/download/windows/\
  \ 下载 Postgres 安装程序并启动它。\n- 2. 按照提示操作；选择一个密码。\n- 3. 在退出时点击 Launch Stack Builder，然后点击\
  \ Finish。\n- 4. 在 Stack Builder 中，选择刚创建的 PostgreSQL 实例。\n- 5. 在 Spatial Extensions\
  \ 下勾选 PostGIS 2.1 Bundle。\n- 6. 在 Choose Components 对话框中选择 PostGIS 和 Create spatial\
  \ database。\n- 7. 完成安装，跳过容易失败的数据库创建步骤。\n\n## 创建新的 Postgres 数据库\n\n现在我们已经安装了 Postgres\
  \ 数据库服务器，以及 PostGIS、pgRouting 扩展和 pgAdmin III 客户端程序，接下来要创建一个可以使用的数据库。请执行以下步骤：\n\n\
  - 1. 打开 pgAdmin III 程序。\n- 2. 右键单击 **Servers** 树中的 **Databases** 部分，然后点击 **New Database...**\
  \ 创建数据库，如下面的截图所示：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_303_0.png)\n\n- 3.\
  \ 输入新数据库的名称 **packt**，然后点击 **OK**。\n\n## 注册 PostGIS 和 pgRouting 扩展\n\n接下来，我们需要告诉\
  \ Postgres，我们要在新数据库中使用 PostGIS 和 pgRouting 扩展。请执行以下步骤：\n\n- 1. 如果尚未打开 pgAdmin III，请打开它。\n\
  - 2. 导航到 **Tools | Query**。\n- 3. 在 **SQL Editor** 区域输入以下 SQL：\n\n```\nCREATE EXTENSION\
  \ postgis;\nCREATE EXTENSION pgrouting;\n```\n\n- 4. 从 **Query** 菜单中选择 **Execute**。\n\
  \n## 用于拓扑的 OpenStreetMap 数据\n\n拓扑网络指定了几何对象之间的正式关系，要在实际物理空间中发挥作用，需要真实的地理数据。因此，接下来我们将获取一些地理数据，以构建一个遵循网络内嵌入的某些规则、提供物理空间各点之间最短路径的网络。一个适合此目的以及许多其他用途的绝佳数据源是\
  \ OpenStreetMap。\n\n## 下载 OSM 数据\n\n现在，让我们回到 QGIS 获取 OpenStreetMap 数据，我们将用这些数据创建拓扑网络：\n\
  \n- 1. 导航到 Vector | OpenStreetMap | Download Data。\n- 2. 选择 newark_boundaries 文件作为\
  \ From layer extent。\n- 3. 输入 c4/data/output/newark_osm.osm 作为 Output file，然后点击\
  \ OK，如下面的截图所示：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_304_0.png)\n\n## 将数据添加到地图\n\
  \n必须将下载的数据添加到 QGIS 项目中，以验证其已成功下载，并方便在 QGIS 中进一步处理该数据。请执行以下步骤：\n\n- 1. 导航到 **Layer**\
  \ | **Add Layer** | **Add Vector Layer**。\n- 2. 选择 `c4/data/output/newark_osm.osm`\
  \ 作为 **Source**。\n- 3. 在 **Select vector layers...** 对话框中点击 **Select All**。\n- 4.\
  \ 点击 **OK**。\n- 5. 现在您应该会看到数据显示出来，类似于下图：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_305_0.png)\n\
  \n## 投影 OSM 数据\n\n我们将把 OSM 数据投影到项目中其他数据（即学生位置）所使用的投影上。我们希望这两个数据集使用相同的投影系统；否则，在构建拓扑网络和分析网络时会出现问题。请执行以下步骤：\n\
  \n- 1. 从 **Layers** 面板中选择 **lines** 图层。\n- 2. 前往 **Layer | Save as**。\n- 3. 输入以下参数：\n\
  \  - 1. **Save as:** `c4/data/output/newark_osm.shp`。\n  - 2. 选择 **CRS EPSG:2880**（Delaware\
  \ Ft/HARN）。\n  - 3. 点击 **OK**。\n\n## 在交点处分割所有线\n\n必须使要创建的拓扑边与地理数据顶点共端点。这称为**拓扑正确**的数据集。我们将使用\
  \ **Split lines with lines** 来满足这一要求。请执行以下步骤：\n\n- 1. 在 **Processing Toolbox** 面板中搜索\
  \ **Split lines with lines**。\n- 2. 选择投影后的 OSM 线文件 `c4/data/output/newark_osm.shp`，同时作为\
  \ **Input layer** 和 **Split layer**。\n- 3. 点击 **Run**，如下面的截图所示：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_307_0.png)\n\
  \n## 数据库导入与拓扑关系\n\n既然我们已经准备好了 OSM 数据，就需要将其实际加载到数据库中。在这里，我们可以基于 PostGIS 确定的地理关系生成拓扑关系。\n\
  \n## 连接数据库\n\n虽然在 QGIS 中处理数据库时我们会在 Database Manager 中工作，但首先需要通过常规的 “Add Layer” 对话框连接到数据库。请执行以下步骤：\n\
  \n- 1. 导航到 **Layer** | **Add Layer** | **Add PostGIS Layers**。\n- 2. 点击 **New**。\n\
  \n## 使用 DB Manager 导入 PostGIS\n\n添加数据库连接后，DB Manager 就是我们将与数据库交互的地方。DB Manager 通过\
  \ SQL 语法提供查询访问，也提供将结果添加为虚拟（内存中，而非磁盘上）图层的功能。必要时，我们还可以使用 DB Manager 将数据导入数据库或从数据库导出。请执行以下步骤：\n\
  \n- 1. 转到 **Database | DB Manager | DB Manager.** \n- 2. 您可能需要导航到 **Database | Refresh**\
  \ 以使新数据库出现。\n- 3. 选择要更新的数据库（例如，*packt_c4*）。以下是 Database Manager 和表的图像，这些表是在您创建新的\
  \ PostGIS 数据库时生成的：\n- 4. 导航到 **Table | Import layer/file.** \n\n![](img/2e88bf5938bf48a409c0a534a8775b21_309_0.png)\n\
  \n对 **students** 图层重复这些步骤：\n\n- 1. 从 c4/data/original/students.shp 添加 **students**\
  \ 图层。\n- 2. 对 **students** 图层重复之前的 **Import vector layer** 步骤，如下面的截图所示：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_311_0.png)\n\
  \n## 创建拓扑网络数据\n\n接下来，运行一个查询，向 newark_osm 表添加必要字段，用拓扑信息更新这些字段，并创建网络顶点的相关表 newark_osm_vertices。pgRouting\
  \ 所期望的这些字段名称和类型由 alter 查询添加，并由 pgr_createTopology pgRouting 函数填充。length_m 字段通过使用\
  \ st_length 函数（这里还使用 st_transform 来控制空间参考）的更新查询填充线段长度。该字段将用于帮助确定最短路径（最低成本）路由的成本。请执行以下步骤：\n\
  \n- 1. 导航到 Database | DB Manager | DB Manager。\n- 2. 选择要更新的数据库。\n- 3. 转到 Database\
  \ | SQL window。输入以下代码：\n\n```\nalter table newark_osm add column source integer;\n\
  alter table newark_osm add column target integer;\nselect pgr_createTopology('newark_osm',\
  \ 0.0001, 'geom', 'id');\n\nalter table newark_osm add column length_m float8;\n\
  update newark_osm set length_m = st_length\n  (st_transform(geom,2880));\n```\n\n\
  ## 备选工作流：使用 osm2po 构建拓扑\n\nosm2po 程序可以执行许多拓扑数据集准备任务，否则这些任务可能需要更长的工作流——例如前述任务。顾名思义，它专门用于\
  \ OpenStreetMap 数据。必须从 osm2po 网站 http://osm2po.de 单独下载并安装 osm2po 程序。程序安装后，使用方法如下：\n\
  \n```\n[..] > cd c:\\packt\\c4\\data\\output\nc:\\packt\\c4\\data\\output>java -jar\
  \ osm2po-5.0.0\\osm2po-core-5.0.0-signed.jar cmd=tj\n  sp newark_osm.osm\n```\n\n\
  该命令将创建一个 .sql 文件，您可以在数据库中运行该文件，将拓扑表添加到数据库中，生成的结果与我们在上一节中所做的非常相似。\n\n\n\n\n\n## 使用\
  \ pgRouting Layer 插件进行测试\n\n让我们使用 pgRouting Layer 插件来测试到目前为止我们执行的操作是否生成了一个可工作的拓扑网络，以便查找最短路径。我们将查找网络上两个任意点\
  \ 1 和 1000 之间的最短路径。请执行以下步骤：\n\n- 1. 安装 pgRoutingLayer 插件。\n- 2. 如果未显示最短路径面板，请在 视图\
  \ | 面板 | pgRouting Layer 下将其打开。\n- 3. 输入以下参数：\n  - 数据库：packt_c4。\n  - 确保您已连接到数据库，如上一节所示。您可能需要重启\
  \ QGIS 才能在此处显示新的数据库连接。\n  - edge_table：newark_osm\n  - geometry：geom\n  - id：id\n\
  \  - source：source\n  - target：target\n  - cost：length_m\n  - source_id：1\n  - target_id：1000\n\
  \n您的输出将类似于以下图像：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_314_0.png)\n\n## 寻找到达目的地的最佳方式\n\
  \n8. 点击 **Load now!** 按钮，如下图所示：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_316_0.png)\n\
  \n现在，您可以按照从该位置到学校所需的时间对线段进行符号化。为此，请使用 `traveltime_min` 字段配合 **Graduated**（分级）样式类型。您将看到，数值较低的线段（表示通行速度较快）更接近顶点\
  \ 1，而数值较高的线段则相反。该方法受网络对真实条件建模程度的限制；例如，铁路会与其他的路段一起显示通行时间。然而，铁路可能会在我们的网络中造成不连续性——因为学生上学时无法“通行”铁路。\n\
  \n![](img/2e88bf5938bf48a409c0a534a8775b21_317_0.png)\n\n## 创建等时线多边形\n\n接下来，我们将创建多边形以可视化学生可以在特定时间范围内步行到达学校的区域。我们可以使用此技术来表征一般的通行时间，同时隐藏学生的具体位置。\n\
  \n### 将通行时间线转换为点\n\n我们需要首先利用多边形作为中间步骤，将当前的基于线的通行时间图层转换为点（质心）。请执行以下步骤：\n\n- 1. 将查询图层保存为\
  \ shapefile：`c4/data/output/newark_isochrone.shp`。\n- 2. 导航至 **Vector | Geometry\
  \ Tools | Line to polygons**（矢量 | 几何工具 | 线转面）。输入以下参数：\n  - **输入线矢量图层：** isochron\
  \ lines\n  - **输出多边形 shapefile：** `c4/data/output/isochron_polygon.shp`\n  - 点击\
  \ **OK**\n- 3. 导航至 **Vector | Geometry Tools | Polygons to centroid**（矢量 | 几何工具\
  \ | 面转质心）。输入以下参数：\n  - **输入多边形矢量图层：** `c4/data/output/isochron_polygon.shp`\n  -\
  \ **输出点 shapefile：** `c4/data/output/isochrons_centroids.shp`\n  - 点击 **OK**\n\n\
  ### 选择点中的通行时间范围并创建凸包\n\n接下来，我们将为每个时间区间创建实际的等时线多边形。我们必须使用过滤表达式为三个时间段选择每组通行时间点：15\
  \ 分钟或更短、30 分钟或更短，以及 45 分钟或更短。然后，我们将对每个选集运行 **Concave hull**（凹包）工具。这将在每组点周围创建一个多边形特征。\n\
  \n对于每个三个断点值（15、30 和 45），您都需要执行以下三个步骤：\n\n- 1. 从 **Layers**（图层）面板中选择 **isochron_centroids**。\n\
  - 2. 导航至 **Layer | Query**（图层 | 查询）。\n- 3. 如果查询对话框的过滤表达式字段中已显示过滤表达式，请点击 **Clear**（清除）。\n\
  - 4. 提供特定的字段表达式：`cost < [break value]`（例如，`cost < 15`）。\n- 5. 点击 OK 以选择图层中匹配该表达式的对象。\n\
  - 6. 导航至 **Processing Toolbox | Concave hull**（处理工具箱 | 凹包）。\n- 7. 输入 **Concave hull**\
  \ 的以下参数。其他所有参数均可保持默认值：\n  - **输入点图层：isochron_centroids**\n  - 选择 **Split multipart\
  \ geometry into singleparts geometries**（将多重几何拆分为单一部分几何）\n  - **Concave hull**（输出文件）可以是\
  \ `c4/data/output/isochrone45.shp`\n  - 点击 Run（运行），如下图所示：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_319_0.png)\n\
  \n显示所有凹包时，其外观将类似于以下图像。凹包的“尖刺程度”反映了用于计算这些通行时间多边形的道路线段（点）相对较少：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_320_0.png)\n\
  \n## 为所有学生生成最短路径\n\n到目前为止，我们只查看了城市中所有给定道路线段之间的最短路径。现在，给定学生位置，让我们看看学生流量会累积在哪里。\n\n\
  ### 查找与学生位置相关的线段\n\n通过以下步骤，我们将把最近道路线段的属性——包括相关的拓扑和通行属性——合并到每个学生位置中。请执行以下步骤：\n\n\
  - 1. 安装 NNJoin 插件。\n- 2. 导航至 **Plugins | NNJoin | NNJoin**（插件 | NNJoin | NNJoin）。\n\
  - 3. 输入以下参数：\n  - **输入矢量图层：** **students**\n  - **连接矢量图层：** **newark_osm**\n  -\
  \ **输出图层：** `students_topology`\n- 4. 点击 **OK**。\n- 5. 使用 Database Manager（数据库管理器）将\
  \ `students_topology` 导入 `packt_c4` 数据库。\n\n以下图像显示了输入到 NNJoin 插件中的参数：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_322_0.png)\n\
  \n### 按线段计算累积最短路径\n\n我们要找出给定学生位置、网络特征和学校位置的情况下，哪些路线最热门。以下步骤将生成沿每个网络线段的学生流量累积计数：\n\
  \n- 1. 转到 **Database | DB Manager | DB Manager**（数据库 | DB Manager | DB Manager）。\n\
  - 2. 选择要更新的数据库。\n- 3. 导航至 **Database | SQL window**（数据库 | SQL 窗口）。\n- 4. 我们要运行一个\
  \ SQL 命令，为每个学生执行最短路径计算，并找到在每条道路线段上通行的学生总数。此查询可能非常慢。输入以下代码：\n```\nSELECT id, geom,\
  \ count(id1)\nFROM\n(SELECT *\n    FROM pgr_kdijkstraPath(\n'SELECT id, source,\
  \ target, traveltime_min as cost FROM newark_osm',\n    1, (SELECT array_agg(join_target)\
  \ FROM students_topology),\n    false, false\n) a,\n    newark_osm b\nWHERE a.id3=b.id)\
  \ x\nGROUP BY id, geom\n```\n- 5. 选择 Load as new layer（作为新图层加载）选项。\n- 6. 选择 id 作为具有唯一整数值列，geom\
  \ 作为几何列，如下图所示：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_323_0.png)\n\n## 流量符号化\n\
  \n我们希望以一种真正突出显示学生数量较多的线段的方式来可视化每条线段上的学生人数。使用符号化表达式来实现这一点效果很好。这会产生与其他 GIS 软件包中常见的分级符号。请执行以下步骤：\n\
  \n- 1. 导航至 **Layer | Properties | Style**（图层 | 属性 | 样式）。\n- 2. 点击 **Simple line**（简单线）以访问符号化表达式，如下图所示：\n\
  - 3. 在 **Pen width**（笔宽）部分，点击高级菜单以编辑符号化表达式。\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_324_0.png)\n\
  \n4. 对数函数（Natural log）是一个很好的函数，当数值呈指数增长时，它有助于获得更线性的增长率。这有助于我们产生一种视觉上更美观的符号化变化方式。在\
  \ **Expression** 字符串构建器对话框中输入以下表达式：\n\n```\nln(\"count\")\n```\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_325_0.png)\n\
  \n\n\n\n\n既然我们已经将可变大小的符号映射为每条路段上学生数量的自然对数，就能看到学生沿每条道路路段“流动”的悦目可视化效果。学生图层显示了学生位置，与流动图一同展示，以便更好地说明流动可视化所呈现的内容。\n\
  \n![](img/2e88bf5938bf48a409c0a534a8775b21_326_0.png)\n\n### Web 应用——创建安全通道\n\n\
  决策者可以利用累积的最短路径输出来识别通往学校最繁忙的路径。他们可以利用这些信息与监护人沟通，告知哪些路线对孩子最安全。\n\n规划者还可以更进一步，为最常用的路径投资建设安全基础设施。例如，规划者可以利用查询图层中的“count”属性（及可视化）和newark_osm中的“highways”属性，识别跨越高速公路的繁忙交叉口。\n\
  \n当然，与利益相关者的沟通理想情况下应是双向过程。为实现这一目标，规划者可以为家长和学生建立社交媒体账号（如 Twitter 账号），让他们报告步行路线的问题或特色。规划者很可能也会查看这些数据，以便根据问题点或便利设施调整安全路线。这个高度简化的模型还应根据数据中可捕获并建模的其他变量（如高交通流量道路等）进行调整。\n\
  \n#### 注册 Twitter 账号并获取 API 访问权限\n\n以下说明将指导你如何在浏览器中设置新的 Twitter 账号，并让社区发布带地理标记的推文：\n\
  \n1. 为此目的创建一个 Twitter 账号（非个人账号）。该账号需要绑定一个唯一的手机号和邮箱。如果你的邮箱和手机号已经绑定了其他账号，下一节会提供一些解决提示。\n\
  \n2. 访问 https://apps.twitter.com/ 并创建一个新应用。\n\n3. 如果你的手机号已注册到另一个账号，你需要注销该手机号（Twitter\
  \ 会对此发出警告）。\n\n4. 在“Application Settings”中，找到“manage keys and access tokens”。在这里，你将找到你的\
  \ consumer key 和 secret。\n\n5. 你还必须通过点击“Create my Access Token”来创建访问令牌。\n\n6. 希望其推文被添加到系统中的用户，应被引导使用你的\
  \ Twitter 用户名（@YOURNAME）。转发你希望添加到地图中的推文。若想采用更被动的方式，你也可以关注所有你想抓取的用户；不过，你需要找到某种方法来过滤掉他们不相关的推文。\n\
  \n#### 设置 Twitter Tools API\n\n现在，我们必须下载并安装基于 Python 的 Twitter Tools，它利用了 Twitter\
  \ API。这将允许我们从 Twitter 账号拉取 GeoJSON。执行以下步骤：\n\n1. 从 GitHub 下载 Twitter Tools API：https://github.com/sixohsix/twitter。\n\
  \n2. 通过上下文菜单使用 **以管理员身份运行** 命令打开 OSGeo4W shell，或者如果你使用的是 Mac 或 Linux，请使用 `sudo`\
  \ 以完整权限运行。你的操作系统账号必须具有管理员权限。导航到 `C:\\Program Files\\QGIS Wien\\OSGeo4W.bat`。\n\n\
  3. 解压 Twitter Tools API 代码，并使用以下命令行将目录更改（`cd`）到你解压到的目录（例如，`C:\\Users\\[YOURUSERNAME]\\\
  Downloads\\twitter-master\\twitter-master`）：\n\n```\n> cd C:\\Users\\[YOURUSERNAME]\\\
  Downloads\\twitter-master\\twitter-master\n```\n\n4. 在命令行中运行以下命令以安装 Twitter Tools\
  \ 软件及其依赖项：\n\n```\n> python setup.py install\n> twitter\n```\n\n5. 接受命令行工具的授权。你需要将浏览器中给出的\
  \ PIN 码复制并粘贴到命令行中。\n\n6. 退出命令行 shell，并在你的普通账号下启动另一个 OSGeo4W shell。\n\n7. 你可以使用 `twitter\
  \ --help` 查看更多选项。在命令行中执行以下操作：\n\n```\n> twitter --format json 1> \"C:\\packt\\c4\\\
  data\\output\\twitter.json\"\n> cd c:\\packt\\c4\n> python\n```\n\n> 在包含 `setup.py`\
  \ 文件的目录中运行 `python setup.py install`（该目录路径中包含 Python 可执行文件）是构建（安装）Python 程序的常规方式。你需要事先安装\
  \ `setuptools` 模块。相关安装说明可访问此网站：https://pypi.python.org/pypi/setuptools。\n\n8. 在解释器中运行以下内容（有关非交互式运行，请参阅下一节）：\n\
  \n```\nimport json\nf = open('./output/twitter.json', 'r')\njsonStr = f.read()\n\
  f.close()\njpy = json.loads(jsonStr)\ngeojson = ''\nfor x in jpy['safe']:\n    if\
  \ x['geo'] :\n        geojson += '{\"type\": \"Feature\",\"geometry\": {\"type\"\
  : \"Point\", \"coordinates\": [' + str(x['geo']['coordinates'][1]) + ',' + str(x['geo']['coordinates'][0])\
  \ + ']}', \"properties\": {\"id\": \"' + str(x['id']) + '\", \"text\": \"' + x['text']\
  \ + '\"}}',\ngeojson = geojson[:-1]\ngeojson += '}'\ngeojson = '{\"type\": \"FeatureCollection\"\
  ,\"features\": [' + geojson\nf = open('./data/output/twitter.geojson', 'w')\nf.write(geojson)\n\
  f.close()\n```\n\n或者运行以下命令：\n\n```\n> python twitterJson2GeoJson.py\n```\n\n以下是\
  \ GeoJSON 格式输出的示例：\n\n```\n{\"type\": \"FeatureCollection\",\"features\": [{\"type\"\
  : \"Feature\",\"geometry\": {\"type\": \"Point\", \"coordinates\": [-75.75451,39.67434]},\
  \ \"properties\": {\"id\": \"606454366212530177\", \"text\": \"Hello world\"}},{\"\
  type\": \"Feature\",\"geometry\": {\"type\": \"Point\", \"coordinates\": [-75.73968,39.68139]},\
  \ \"properties\": {\"id\": \"606454626456473600\", \"text\": \"Testing\"}},{\"type\"\
  : \"Feature\", \"geometry\": {\"type\": \"Point\", \"coordinates\": [-75.76838,39.69243]},\
  \ \"properties\": {\"id\": \"606479472271826944\", \"text\": \"Test\"}}]}\n```\n\
  \n用文本编辑器将其保存为 c4/output/twitter.geojson，并将该文件作为矢量图层导入 QGIS，以便与其他图层一起预览。当这些图层符号化后，你可能会看到类似于下图的内容：\n\
  \n![](img/2e88bf5938bf48a409c0a534a8775b21_330_0.png)\n"
- "## 5 展示变化\n\n在本章中，我们将探讨地点与时间之间、以及地点本身之间关系的可视化与分析技术。\n\n从时间和空间关系中得出的数据，有助于更深入地了解我们正在研究的地理对象——从水文要素到人口单元。当感兴趣的地理对象没有直接可用的数据时尤其如此：无论是某个变量、某个特定时间，还是完全没有任何数据。\n\
  \n在本示例中，我们将把美国人口普查的人口统计数据应用于州众议院选区，以服务选举目的。民选官员通常希望了解其选区内的社区在人口统计上如何变化。他们的选民是变得更年轻还是更富裕？失业率是否在上升？人口统计因素可用于预测潜在选民可能关心的问题，从而可用于竞选活动的宣传目的。\n\
  \n在本章中，我们将涵盖以下主题：\n\n- 利用空间关系来利用数据\n- 为静态生产准备数据关系\n- 矢量简化\n- 使用 TopoJSON 减小矢量数据大小并提高性能\n\
  - 用于 API 的 D3 数据可视化\n- 动态时间序列地图\n\n### 利用空间关系\n\n到目前为止，我们已经研究了利用栅格数据的网格连续性或拓扑网络数据的几何规范性的分析方法。\n\
  \n对于普通矢量数据，我们需要一种更抽象的分析方法，即基于几何对象空间排列中的条件建立形式化关系。\n\n在本节的大部分内容中，我们将以熟悉的方式收集和准备数据。当我们开始准备边界数据时，即利用人口普查区中的州众议院选区数据，我们将触及新的领域——使用空间关系为给定地理单元构建数据。\n\
  \n### 收集数据\n\n首先，我们将从美国人口普查网站的各部分收集数据。虽然这个工作流对于处理美国人口统计数据的人特别有用，但对于处理与地理边界相关的任何类型数据的人也有指导意义。\n\
  \n首先，获取带有唯一标识符的边界数据。完成后，获取具有相同唯一标识符的表格数据，然后基于该标识符进行连接。\n\n#### 边界\n\n从美国人口普查网站 https://www.census.gov/geo/maps-data/data/tiger-line.html\
  \ 下载 2014 TIGER/Line 人口普查区和州国会选区数据。\n\n1. 在显示的选项卡中选择 2014；这应该是默认年份。\n\n2. 点击“Download”手风琴标题，然后点击“Web\
  \ interface”。\n\n3. 在“Select a layer type”下，选择“Census Tracts”并点击提交；在“Census Tract”下，选择“Pennsylvania”并点击“Download”。\n\
  \n\n\n\n\n+   4. 如有必要，使用后退箭头选择 **State Legislative Districts**，然后点击 **submit**；为\
  \ **State Legislative Districts - Lower Chamber (current)** 选择 **Pennsylvania**\
  \ 并点击 **Download**。\n+   5. 将两个目录都移动到 `c5/data/original` 并解压它们。\n\n> 我们仅为本次练习下载了一份边界数据集。由于边界每年并不一致，在实际项目中你需要下载并进一步处理每个单独的年度边界文件。\n\
  \n## Tabular data from American FactFinder\n\n美国社区调查 FactFinder 网站上提供了许多不同的人口统计数据集。这些数据集与前面提到的\
  \ TIGER/Line 数据相辅相成，为 TIGER/Line 地理边界提供了属性数据。主要技巧是选择属性数据与地理边界数据之间匹配的地理边界层级和范围。请执行以下步骤：\n\
  \n+   1. 前往美国人口普查局 American FactFinder 网站 http://factfinder.census.gov。\n+   2.\
  \ 点击 **ADVANCED SEARCH** 选项卡。\n+   3. 在 **topic or table name** 输入框中输入 `White` 并在建议选项中选择\
  \ **B02008: WHITE ALONE OR IN COMBINATION WITH ONE OR MORE RACES**。然后，点击 **GO**。\n\
  +   4. 从侧边栏中，在 **Geographies** 部分的 **Select a geographic type:** 下拉菜单中，选择 **Census\
  \ Tract - 140**。\n+   5. 在 **select a state** 下，选择 **Pennsylvania**；在 **Select a\
  \ county** 下，选择 **Philadelphia**；在 **Select one or more geographic areas and click\
  \ Add to Your Selections;** 下，选择 **All Census Tracts within Philadelphia County,\
  \ Pennsylvania**。然后，点击 **ADD TO YOUR SELECTIONS**。\n+   6. 从侧边栏进入 **Topics** 部分。在此，在\
  \ **Year** 下的 **Select Topics to add to 'Your Selections'** 中，点击从 **2009** 到 **2013**\
  \ 的每个可用年份，将其逐一添加到 **Your Selections** 以便后续下载。\n\n## Demonstrating Change\n\n7. 检查\
  \ **Search Results** 选项卡下提供的五个数据集。所有已勾选的数据集都会被添加到待下载的选择中，如以下屏幕截图所示：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_336_0.png)\n\
  \n8. 现在，从页面左上角显示选择的搜索筛选器中移除 **B02008: WHITE ALONE OR IN COMBINATION WITH ONE OR\
  \ MORE OTHER RACES**。\n\n9. 在 **topic or table name** 字段中输入 **total**，从建议的数据集中选择\
  \ **B01003: TOTAL POPULATION**，然后点击 **GO**。\n\n10. 选择 2009 至 2013 年的总人口 5 年估计值，然后点击\
  \ GO。\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_337_0.png)\n\n11. 点击 Download\
  \ 下载这 10 个数据集，如前一屏幕截图所示。\n\n12. 一旦看到 Your file is complete 消息，再次点击 DOWNLOAD 下载文件。这些文件将作为\
  \ aff_download.zip 目录下载。\n\n13. 将此目录移动到 c5/data/original 然后解压它。\n\n## Preparing\
  \ and exporting the data\n\n首先，我们将介绍表格数据准备和导出的步骤，这与我们之前做过的步骤相当相似。接下来，我们将介绍边界数据准备的步骤，这将更为新颖。我们需要基于图层之间的空间关系来准备此数据，这需要使用\
  \ SQLite，因为这无法通过 QGIS 的开箱即用或插件功能轻松完成。\n\n## The tabular data\n\n我们的表格数据是人口普查区白人人口。我们只需要在此数据中具有可解析的经纬度字段以便稍后绘图，因此可以将其保留在此通用表格格式中。\n\
  \n## Combining it yearly\n\n要将此年度数据合并，我们可以在 QGIS 中基于共同的 GEO ID 字段连接每个表。请执行以下步骤：\n\
  \n+   1. 打开 QGIS 并导入所有边界 shapefile（普查区和州众议院边界）以及数据表（所有下载的人口普查区年份）。单个边界 shapefile\
  \ 将在其解压目录中，扩展名为 .shp。数据表将命名为类似 x_with_ann.csv 的格式。你需要以与之前相同的方式添加它们，即通过图层菜单下的 Add\
  \ Vector Layer。以下是要添加的所有文件列表：\n+      - t1_2014_42_tract.shp\n+      - ACS_09_5YR\
  \ B01003_with_ann.csv\n+      - ACS_10_5YR B01003_with_ann.csv\n+      - ACS_11_5YR\
  \ B01003_with_ann.csv\n+      - ACS_12_5YR B01003_with_ann.csv\n+      - ACS_13_5YR\
  \ B01003_with_ann.csv\n+   2. 从图层面板中选择普查区边界 shapefile，t1_2014_42_tract。\n+   3.\
  \ 导航到 Layers | Properties。\n+   4. 对于每个白人人口数据表（以 x_B02008_with_ann 结尾），执行以下步骤：\n\
  +      1. 在 Joins 选项卡上，点击绿色加号 (+) 添加连接。\n+      2. 选择数据表作为 Join layer。\n+      3.\
  \ 在 Join field 选项卡中选择 GEO.id2。\n+      4. Target field: GEO ID\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_339_0.png)\n\
  \n连接所有表后，你会在属性表中发现许多包含空值的行。如果对它们按年份排序，你会发现我们为较近年份填充的行数与费城普查区图层中的行数相同。然而，2009 年（ACS_09_5YR_B01003_with_ann.csv）有许多行无法填充，这是由于\
  \ 2014 边界数据中使用的唯一标识符发生了变化所致。因此，我们将从分析中排除 2009 年。你可以从已连接的表中移除 2009 年数据表，这样以后就不会出现问题。\n\
  \n## Demonstrating Change\n\n现在，将已连接的图层导出为新的 DBF 数据库文件，我们需要这样做以便进行最后的更改：\n\n+  \
  \ 1. 确保仅在普查区图层中选择了具有填充数据列的行。归因于该表（你可以通过在该字段上对属性表进行排序来完成，例如）。\n+   2. 从 **Layers**\
  \ 面板中选择普查区图层。\n+   3. 导航到 **Layer | Save as**，满足以下参数：\n+      - **Format: DBF File**\n\
  +      - Save only the selected features\n+      - Add the saved file to the map\n\
  +      - **Save as:** `c5/data/output/whites.dbf`\n+      - 将其他选项保持为默认设置\n\n## Updating\
  \ and removing fields\n\nQGIS 允许我们计算地理要素的坐标并将其填充到属性字段中。在新 DBF 图层的图层上，按预期格式计算经纬度字段并通过执行以下步骤消除不必要的字段：\n\
  \n+   1. 打开 whites DBF 图层的 **Attribute table** 并点击 **Open Field Calculator** 按钮。\n\
  +   2. 计算新的 lon 字段并满足以下参数：\n+      - **Output field name:** `lon`\n+      - **Output\
  \ field type:** Decimal number (real).\n+      - **Output field width:** 10.\n+\
  \      - **Precision:** 7.\n+      - **Expression:** `\"INTPLON\"`. 你可以从 **Functions**\
  \ 面板下 **Fields and Values** 部分的树中选择此项。\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_341_0.png)\n\
  \n3. 重复这些步骤处理纬度，从 INTPLAT 创建 lat 字段。\n\n4. 使用字段计算器和右侧的表达式创建以下字段：\n\n+   - Output\
  \ field name: name; Output field type: Text; Output field width: 50; Expression:\
  \ NAMESLAD\n+   - Output field name: Jan-11; Output field type: Whole number (integer);\
  \ Expression: \"ACS_11_5_2\" - \"ACS_10_5_2\"\n+   - Output field name: Jan-12;\
  \ Output field type: Whole number (integer); Expression: \"ACS_12_5_2\" - \"ACS_11_5_2\"\
  \n+   - Output field name: Jan-13; Output field type: Whole number (integer); Expression:\
  \ \"ACS_13_5_2\" - \"ACS_12_5_2\"\n\n## Demonstrating Change\n\n+   5. 移除所有旧字段（除\
  \ name、Jan-11、Jan-12、Jan-13、lat 和 lon 外）。这将从表中移除所有不必要的标识字段和误差范围字段。\n\n+   6. 切换编辑模式并在提示时保存。\n\
  \n![](img/2e88bf5938bf48a409c0a534a8775b21_342_0.png)\n\n\n\n\n最后，将修改后的表导出为一个新的\
  \ CSV 数据表，我们将从该表创建地图可视化。执行以下步骤：\n\n- 1. 从图层面板中选择 whites DBF 图层。\n- 2. 导航到图层 | 另存为，并填写以下参数：\n\
  \  - 格式：逗号分隔值 [CSV]\n  - 另存为：c5/data/output/whites.csv\n  - 其他选项保持默认\n\n## 边界数据\n\
  \n虽然我们拥有普查区的边界数据，但我们的应用只对可视化州众议院选区感兴趣。我们的利益相关者希望可视化这些选区的变化。然而，由于我们没有按种族划分的边界单元人口数据，更不用说按年度人口了，我们需要利用州众议院选区与普查区之间的空间关系来推导这一信息。当你的数据所处的层级与你希望可视化或查询的地理单元不同时，这是一个有用的工作流程。\n\
  \n## 计算每个普查区的平均白人人口变化\n\n现在，我们将构建一个字段，其中包含 2010 年至 2013 年间白人人口的平均年度变化。执行以下步骤：\n\n\
  - 1. 如前所述，将总人口表（以 B01003_with_ann 结尾）连接到已连接的普查区图层 t1_2014_42_tract，连接字段分别使用新总人口表中的\
  \ GEO.id2、GEO 字段以及普查区图层中对应的字段。不要连接 2009 年的表，因为我们发现该表的仅白人版本在连接字段中有许多空值。\n- 2. 像之前一样，在属性表中选择具有已填充连接列的\
  \ 384 行。只保存选中的行，将保存的 shapefile 数据集命名为 tract_change，并将其添加到地图中。\n- 3. 打开属性表，然后打开字段计算器。\n\
  \  - 创建一个新字段。\n  - 输出字段名：avg_change。\n  - 输出字段类型：十进制数（实数）。\n  - 输出字段宽度：4，精度：2。\n\
  \n## 演示变化\n\n- 以下表达式是每一年相对于前一年的差值除以前一年的值，以求得分数变化。然后将其除以三，得到三年间的平均值，最后乘以 100 得到百分比，如下所示：\n\
  \n```text\n(((\"ACS_11_5_2\" - \"ACS_10_5_2\") / \"ACS_10_5_2\") +\n ((\"ACS_12_5_2\"\
  \ - \"ACS_11_5_2\") / \"ACS_11_5_2\") +\n ((\"ACS_13_5_2\" - \"ACS_12_5_2\") / \"\
  ACS_12_5_2\")) / 3 * 100\n```\n\n- 4. 之后，点击**确定**。\n\n## SpatiaLite 中的空间连接\n\n现在，我们已经有了按普查区划分的白人人口平均变化值，接下来将其附加到我们关注的单元——州众议院选区。我们将通过空间连接来实现这一点，具体而言，将所有与我们的众议院选区边界相交的记录连接到该选区。由于每个州众议院选区会与多个普查区相交，因此我们需要聚合相交普查区的属性数据，以匹配普查区将连接到的单个选区。\n\
  \n我们将使用 SpatiaLite 来完成这一操作。与 Postgres 的 PostGIS 类似，SpatiaLite 是 SQLite 的空间扩展。它是基于文件的；不需要持续监听连接的服务器，数据库存储在文件中，客户端程序直接连接。此外，SpatiaLite\
  \ 随 QGIS 开箱即用，非常易于使用。与 PostGIS 一样，SpatiaLite 提供了丰富的空间关系函数，当现有插件不支持我们试图建模的关系时，它是一个很好的选择。\n\
  \n> SpatiaLite 通常不会作为实时网站的后端数据库，因为它在多用户事务方面存在一些限制——这就是 CartoDB 使用 Postgres 作为其后端数据库的原因。\n\
  \n## 创建 SpatiaLite 数据库\n\n为此，请执行以下步骤：\n\n- 1. 创建一个新的 SpatiaLite 数据库。\n- 2. 导航到**图层\
  \ | 创建图层 | 新建 SpatiaLite 图层**。\n- 3. 使用省略号按钮（...），浏览到并创建一个数据库，位于 `c5/data/output/district_join.sqlite`。\n\
  - 4. 点击**保存**后，您会收到一个新数据库已注册的通知。现在您已创建了一个新的 SpatiaLite 数据库。现在可以关闭此对话框了。\n\n- 6.\
  \ 选中**创建空间索引**。\n- 7. 点击**确定**完成将表导入数据库（您可能需要再次点击刷新按钮，以显示表已导入）。\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_346_0.png)\n\
  \n现在，对州众议院选区图层（t1_2014_42_s1d1）重复这些步骤，并取消选中**创建单部件几何而不是多部件**，因为该选项似乎会导致此文件出错，可能是由于多部件要素的某些部分无法在\
  \ SpatiaLite 数据要求下独立存在。\n\n## 从 DB 管理器查询并加载 SpatiaLite 图层\n\n接下来，我们使用 DB 管理器查询 SpatiaLite\
  \ 数据库，并将结果添加到 QGIS 图层面板中。\n\n这里我们将使用 MBRIntersects 条件，它只检查范围（边界框）的相交情况，因此比常规的 Intersects\
  \ 函数更有性能优势。在本例中，我们处理的要素数量少、复杂度有限，并且不是在网络请求期间动态完成的，因此这种捷径不会带来显著优势——我们在这里这样做是为了演示它在更复杂数据集上的用法。\n\
  \n- 1. 如果尚未打开，请打开 DB 管理器。\n- 2. 导航到数据库 | SQL 窗口。\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_347_0.png)\n\
  \n在 SQL 查询对话框中填写相应的输入字段：\n\n## 演示变化\n\n- 以下 SQL 查询从 `tract_change` 和 `tl_2014_42_sldl`（州立法选区）表中选择相互重叠区域的字段。它还按覆盖普查区边界的州立法选区对变化进行聚合（平均）：\n\
  \n```text\nSELECT t1.pk, t1.nameIsad, t1.geom, avg(t2.avg_change)*1.0 as avg_change\n\
  FROM tl_2014_42_sldl AS t1, tract_change AS t2\nWHERE MbrIntersects(t1.geom, t2.geom)\
  \ = 1\nGROUP BY t1.pk;\n```\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_348_0.png)\n\
  \n- 3. 然后，点击“立即加载!”。\n\n- 4. 系统会提示您为**具有唯一整数值的列**字段选择一个值。为此，请选择**pk**。\n- 5. 系统还会提示您为**几何列**字段选择一个值；为此，请选择**geom**。\n\
  \n空间关系连接的结果符号化后，显示州众议院选区与普查区相交部分在4年期间的白人人口平均变化，看起来将与下图类似：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_349_0.png)\n\
  \n## TopoJSON\n\n接下来，我们将继续为 Web 及其时空可视化准备这种数据关系。\n\nTopoJSON 是 JSON 的一种变体，它利用几何要素之间的拓扑关系来大幅减小矢量数据的体积，从而提升浏览器的渲染性能，并降低数据传输延迟的风险。\n\
  \n## GeoJSON 示例\n\n以下代码是 GeoJSON 的一个示例，显示了我们两个州众议院选区。该格式是熟悉的——基于我们之前使用 JSON 的经验——由一组组坐标定义多边形区域并组合在一起。重复部分用省略号（...）标示。\n\
  \n```text\n{\n  \"type\": \"FeatureCollection\",\n  \"crs\": { \"type\": \"name\"\
  , \"properties\": { \"name\": \"urn:ogc:def:crs:OGC:1.3:CRS84\" } },\n  \"features\"\
  : [\n    { \"type\": \"Feature\", \"properties\": { \"STATEFP\": \"42\", \"SLDLST\"\
  : \"181\", \"GEOID\": \"42181\", \"NAMELSAD\": \"State House District 181\", \"\
  LSAD\": \"LL\", \"LSY\": \"2014\", \"MTFCC\": \"G5220\", \"FUNCSTAT\": \"N\", \"\
  ALAND\": 8587447.000000, \"AWATER\": 0.000000, \"INTPTLAT\": \"+39.9796799\", \"\
  INTPTLON\": \"-075.1533540\" }, \"geometry\": { \"type\": \"Polygon\", \"coordinates\"\
  : [ [ [ -75.176782, 39.987337 ], [ ... ] ] ] } },\n    {...}]\n}\n```\n\n## TopoJSON\
  \ 示例\n\n以下代码是前文讨论过的同样的两个州众议院选区在 TopoJSON 中的对应表示。\n\n尽管此示例使用了与之前相同的坐标系（WGS84/EPSG:4326），但它被表示为简单的抽象空间坐标对。最终，这些坐标利用数据\
  \ transform 部分中的 scale 和 translate 数据转换为 WGS 坐标系。\n\n\n\n\n\n通过利用几何对象之间共享的拓扑关系，数据量可以从\
  \ 21K 急剧减少到 7K。这减少了 2/3！你将在下面的代码中看到，每个多边形本身并不是单独明确表示的，而是通过这些拓扑关系表示的。重复的部分用省略号 (...)\
  \ 标记。\n\n```\n{\"type\":\"Topology\",\"objects\":{\"geojson\":{\"type\":\"GeometryCollection\"\
  ,\"crs\":{\"type\":\"name\",\"properties\":{\"name\":\"urn:ogc:def:crs:OGC:1.3:CRS84\"\
  }},\"geometries\":[{\"type\":\"Polygon\",\"properties\":{\"STATEFP\":\"42\",\"SLDLST\"\
  :\"181\",\"GEOID\":\"42181\",\"NAMELSAD\":\"State House District 181\",\"LSAD\"\
  :\"LL\",\"LSY\":\"2014\",\"MTFCC\":\"G5220\",\"FUNCSTAT\":\"N\",\"ALAND\":8587447,\"\
  AWATER\":0,\"INTPTLAT\":+39.9796799,\"INTPTLON\":-075.1533540},\"arcs\":[[[0,1]]]},{\"\
  type\":\"Polygon\",\"properties\":{\"STATEFP\":\"42\",\"SLDLST\":\"197\",\"GEOID\"\
  :\"42197\",\"NAMELSAD\":\"State House District 197\",\"LSAD\":\"LL\",\"LSY\":\"\
  2014\",\"MTFCC\":\"G5220\",\"FUNCSTAT\":\"N\",\"ALAND\":8251026,\"AWATER\":23964,\"\
  INTPTLAT\":+40.0054726,\"INTPTLON\":-075.1405813},\"arcs\":[[-1,2]]}]},\"arcs\"\
  :[[[903,5300],[...]]],\"transform\":{\"scale\":[0.000006659365936593659349884,0.00000665943594359435944118],\"\
  translate\":[-75.176782,39.961088]}}\n```\n\n## 向量简化\n\n与 TopoJSON 类似，向量简化会移除线或多边形图层中的节点，并且通常会极大地提高浏览器的渲染性能，同时减少文件大小和网络传输时间。\n\
  \n由于向量形状可以具有无限的复杂程度，理论上，简化方法可以在仍保留几何形状可感知形状的情况下将复杂程度降低超过 99%。实际上，感知开始显著受影响的复杂程度几乎永远不会这么高；然而，在\
  \ 90% 的复杂程度损失下获得非常可接受的感知变化是很常见的。更复杂的简化方法效果更好。\n\n## 简化方法\n\n有多种简化方法被广泛使用，每种方法对特定数据特征和结果都有优势。如果一种方法没有产生良好的结果，你可以随时尝试另一种。除了方法本身之外，你通常还会被要求定义一个阈值参数，用于可接受的复杂程度损失量，按复杂程度损失的百分比、面积或其他度量来定义。\n\
  \n- Douglas-Peucker：在这种方法中，阈值影响原始线和多边形边缘允许变化的距离。这在需要简化的节点密集分布时很有用，但可能导致“尖锐”的简化结果。\n\
  - **Visvalingam / 有效面积：** 在这种方法中，形成与两个相邻点面积最小的三角形的点将被移除。阈值影响该标准的适用次数。这已被 Mike Bostock，即\
  \ TopoJSON 等的创建者之一，描述为以最小感知变化为标准的简化。\n- **Visvalingam / 加权面积：** 在这种方法中，形成顶点角度最尖锐的点将被移除。阈值影响该标准的适用次数。该方法提供了“最平滑”的结果，因为它专门针对“尖峰”。\n\
  \nVisvalingam 有效面积方法是我们在使用的 TopoJSON 命令行工具中提供的唯一简化方法。Mapshaper 是一款我们将要查看的基于网络的工具，它提供了这三种方法，但默认使用加权面积方法。\n\
  \n## 其他选项\n\n影响数据大小的其他选项通常与简化方法一起提供。\n\n- **修复相交：** 此选项将修复导致线或多边形边缘相交的简化。\n- **防止形状移除：**\
  \ 此选项将防止导致（通常较小的）多边形形状被移除的简化。\n- **量化：** 量化控制坐标的精度。当我们处理线性单位中的坐标时，这更容易理解。出于明显的原因，你可能希望将精度扩展到每英里\
  \ 1/5000 —— 获得近似英尺精度。同样明显的是，较高的精度会带来更大的数据大小，因此你不应在应用程序或源不支持此类精度的情况下过度量化。\n\n## 为\
  \ TopoJSON 简化\n\n我们将使用的 Web 和桌面 TopoJSON 转换工具都支持这些简化选项。这样，你就可以在通过拓扑关系表示法减少数据大小的同时简化多边形。\n\
  \n## 为其他输出简化\n\n如果你希望生成除 TopoJSON 之外的其他数据，你需要找到另一种简化方法。\n\nQGIS 原生提供简化几何功能（导航至 Vector\
  \ | Geometry Tools | Simplify Geometries），它执行 Douglas-Peucker 简化。虽然它是流行的方法，但可能不是最有效的方法（请参阅下一节了解更多信息）。\n\
  \nSimplify 插件除了 Douglas-Peucker 外还提供 Visvalingam 方法。\n\n## 转换为 TopoJSON\n\n有几种编写\
  \ TopoJSON 的选项。我们将查看一个桌面选项，需要软件安装，以及一个通过网络浏览器进行的选项。正如你可能想象的那样，桌面选项在以自定义方式执行任何操作时更稳定，网络浏览器不支持此功能，并且在处理更复杂的特征集时也更稳定。网络浏览器具有无需安装的优势。\n\
  \n## Web mapshaper\n\n你可以使用基于网络的 mapshaper 软件从 http://www.mapshaper.org/ 将 shapefile\
  \ 和其他格式转换为 TopoJSON，反之亦然。执行以下步骤将州立法区 shapefile 转换为 TopoJSON：\n\n- 1. 打开浏览器并导航到 mapshaper\
  \ 网站。\n- 2. 可选，选择不同的简化方法或尝试其他选项。这对本示例不是必需的。\n- 3. 浏览以选择你本地计算机上的费城州立法区 shapefile（c5/data/original/tl_2014_42_sldl/tl_2014_42_sldl.shp）或拖入文件。正如页面所示，Shapefile、GeoJSON\
  \ 和 TopoJSON 都受支持。\n- 4. 可选，从滑块栏中选择一个简化比例（同样，这对本示例不是必需的）。\n- 5. 通过点击顶部导出按钮导出为 TopoJSON。\n\
  \n你将在浏览器中看到以下屏幕：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_354_0.png)\n\n## 命令行工具\n\
  \n命令行工具在处理更大或更复杂的数据集时很有用。缺点是它需要你安装 Node.js，因为它是一个 node 包。对于我们的目的，Node.js 类似于 Python。它是\
  \ JavaScript 的解释器环境，允许用 JavaScript 编写的程序在本地运行。此外，它还包括一个包管理器来安装所需的依赖项。它还包括一个 Web\
  \ 服务器——本质上是将 JavaScript 作为服务器端语言运行。\n\n执行以下步骤：\n\n- 1. 从 https://nodejs.org/ 安装\
  \ Node.js。\n- 2. 打开你的操作系统命令行（例如，在 Windows 上运行 cmd）。\n- 3. 在命令行中输入以下内容：\n  >npm install\
  \ -g topojson\n- 4. 导航到 cd c:\\packt\\c5\\data\\output 并输入以下内容：\n  >topojson -p\
  \ -o house_district.json house_district.shp\n\n你现在将得到以下输出：\n\n```\nc:\\packt\\c5\\\
  data\\temp>topojson -p -o house_district.json house_district.shp\nbounds: -75.463053\
  \ 39.848782 -74.869303 40.22473499999995 (spherical)\npre-quantization: 0.0660m\
  \ (5.94e-7°) 0.0418m (3.76e-7°)\ntopology: 105 arcs, 16475 points\npost-quantization:\
  \ 6.60m (0.0000594°) 4.18m (0.0000376°)\nprune: retained 105 / 105 arcs (100%)\n\
  ```\n\nMapshaper 也有一个命令行工具，我们在此未评估。\n\n## D3 数据可视化库\n\nD3 是一个用于从所有现代网络浏览器中存在的文档对象模型（DOM）构建可视化的\
  \ JavaScript 库。\n\n## 什么是 D3？\n\n更详细地说，D3 将 DOM 操作为抽象的矢量可视化组件，其中一些已进一步定制为特定可视化类型，例如地图。它为我们提供了从一些常见数据源解析并绑定到\
  \ SVG 和 canvas 元素的能力，这些元素设计用于矢量图形操作。\n\n## 一些基础知识\n\n在开始之前，有几个 D3 的基本方面对你理解很有用。由于\
  \ D3 不是专门为地理数据构建的，而是为通用数据可视化构建的，它倾向于更抽象地看待地理数据可视化。数据必须从其原始格式解析为 D3 对象并渲染为图形空间中的\
  \ SVG 或 canvas 元素矢量形状类型。然后必须使用图形空间与地理坐标系统之间的相对映射对其进行投影，相对于图形空间和地理范围进行缩放，并绑定到 Web\
  \ 对象。所有这些都必须相对于某种 D3 游标完成，该游标处理 D3 当前正在工作的范围，使用诸如“begin”和“end”之类的关键字。\n\n## 解析\n\
  \n我们将通过 d3.json 和 d3.csv 方法进行解析。我们使用这些方法的回调来包装我们希望在外部数据解析为 JavaScript 对象后执行的代码。\n\
  \n\n\n\n\n## 比例尺\n\n比例尺允许你将真实数据的定义域映射到值域，例如，假设你有一组 1 到 100 的值，以及一个可能取值的范围，并希望将所有值映射到\
  \ 1 到 5 的数字。比例尺在映射中最有用的用途是将一组数值与一组颜色关联起来。以下代码将一组值映射到一组颜色，并将中间值映射为过渡颜色：\n\n```\n\
  var color = d3.scale.linear()\n    .domain([- .5, 0, 2.66])\n    .range([\"#FFEBEB\"\
  , \"#FFFFFF\", \"#E6FFFF\"]);\n```\n\n## 绑定\n\n数据对象被解析到 DOM 后，可以通过其 `data` 或 `datum`\
  \ 属性绑定到 D3 对象。\n\n## Select、Select All、Enter、Return、Exit、Insert 和 Append\n\n为了选择可能已存在的元素，你将使用\
  \ Select 和 Select All 关键字。然后，根据你预期元素是否已经存在，你将使用 Enter（如果尚不存在）、Return（如果已存在）以及 Exit（如果你希望移除它）关键字来改变与元素的交互。\n\
  \n以下是一个使用 Enter 关键字的 Select All 示例。来自此前解析过的 house_district JSON 的数据，通过 path 元素的\
  \ `d` 属性加载，并赋给路径形状生成器。此外，在 `fill` 属性上设置了一个函数，该函数从线性颜色比例尺返回一种颜色：\n\n```\nmap.selectAll(\"\
  path\")\n    .data(topojson.feature(phila, phila.objects.house_district)\n     \
  \   .features)\n    .enter()\n    .append(\"path\")\n    .attr(\"vector-effect\"\
  ,\"non-scaling-stroke\")\n    .style(\"fill\", function(d) { return color\n    \
  \    (d.properties.d_avg_change); })\n    .attr(\"d\", path);\n```\n\n## main.js\n\
  \n以下所有 JavaScript 代码都位于 `./js/main.js` 中。我们对此代码的所有自定义都将在该文件中完成：\n\n```\nvar width\
  \ = 960,\n    height = 600;\n\n//sets up the transformation from map coordinates\
  \ to DOM\n  coordinates\nvar projection = d3.geo.mercator()\n    .center([-75.166667,40.03])\n\
