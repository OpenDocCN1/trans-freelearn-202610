  \nvar svg = d3.select(\"#map-container\").append(\"svg\")\n    .attr(\"width\",\
  \ width)\n    .attr(\"height\", height);\n\nvar g = svg.append(\"g\");\n\ng.append(\
  \ \"rect\" )\n    .attr(\"width\",width)\n    .attr(\"height\",height)\n    .attr(\"\
  fill\",\"white\")\n    .attr(\"opacity\",0)\n    .on(\"mouseover\",function(){\n\
  \      hoverData = null;\n      if ( probe ) probe.style(\"display\",\"none\");\n\
  \    })\n\nvar map = g.append(\"g\")\n    .attr(\"id\",\"map\");\n\nvar probe,\n\
  \    hoverData;\n\nvar dateScale, sliderScale, slider;\n\nvar format = d3.format(\"\
  ,\");\n\n  var months = [\"Jan\"],\n```\n\n```\n```javascript\n.append(\"div\")\n\
  .attr(\"id\",\"loader\")\n.style(\"top\",d3.select(\"#play\").node().offsetTop +\
  \ \"px\")\n.style(\"height\",d3.select(\"#date\").node().offsetHeight +\n    d3.select(\"\
  #map-container\").node().offsetHeight + \"px\");\n\n//load and parse whites.csv\n\
  d3.csv(\"csv/whites.csv\",function(data){\n  var first = data[0];\n  // get columns\n\
