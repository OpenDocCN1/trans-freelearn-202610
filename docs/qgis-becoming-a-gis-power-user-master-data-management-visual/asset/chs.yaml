  \ A63（用于高速公路上匝道）。\n\n8. 您的选择代码将类似于以下内容：\n\n```\n\"CFCC\" = 'A21' OR \"CFCC\" = 'A25'\
  \ OR \"CFCC\" = 'A31' OR \"CFCC\" = 'A35' OR \"CFCC\" = 'A63'\n```\n\n9. 点击 确定，如下面的截图所示：\n\
  \n![](img/2e88bf5938bf48a409c0a534a8775b21_249_0.png)\n\n2. 将 roads 图层保存为一个新图层，仅包含所选要素（major_roads），存放到\
  \ c2/data/output。\n\n> 要清除图层过滤器，请返回已应用图层的查询对话框（在“图层”窗格中高亮显示该图层；导航到 图层 | 查询，然后点击\
  \ 清除）。\n\n+   3. 对 `landuse` 图层中的 `developed (LULC1 = 1)` 和 `agriculture (LULC1\
  \ = 2)` 土地利用（分别）重复这些步骤。\n\n## 转换为栅格\n\n在本节中，我们将把所有需要的矢量图层转换为栅格。我们将以批处理方式进行转换，这样就可以在多个图层上多次重复相同操作。\n\
  \n## 一次完成更多操作——批处理\n\nQGIS 处理框架提供了在不同数据上多次运行相同操作的功能。这称为**批处理**。批处理过程从**处理工具箱**中某个操作的上下文菜单中调用。批处理对话框要求为每次迭代填充每个图层参数。执行以下步骤：\n\
  \n+   1. 将矢量图层转换为栅格。\n+      1. 导航到 **处理工具箱**。\n+      2. 从 **处理工具箱** 底部的下拉菜单中选择\
  \ **高级界面**（如果未选中，它将显示为 **简单界面**）。\n+      3. 输入 `rasterize` 以搜索 **栅格化** 工具。\n+ \
  \     4. 右键点击 **栅格化** 工具，然后选择 **作为批处理过程执行**：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_250_0.png)\n\
  \n5. 填写批处理对话框，确保指定参数如下：\n\n| 参数 | 值 |\n|---|---|\n| 输入图层 | （例如，roads） |\n| 属性字段\
  \ | value |\n| 输出栅格大小 | 输出分辨率（地图单位/像素） |\n| 水平 | 30 |\n| 垂直 | 30 |\n| 栅格类型 | Int16\
  \ |\n| 输出图层 | （例如，roads） |\n\n下图显示了在 QGIS 中的效果：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_251_0.png)\n\
  \n6. 向右滚动以完成参数值的输入。\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_251_1.png)\n\n+\
  \   2. 组织新图层（可选步骤）。\n+     - 批处理有时会因对话框中的某些错误而给出不友好的名称。\n+     - 通过以下操作更改批处理创建的每个图层的名称：\n\
  +       1. 高亮显示该图层。\n+       2. 导航到 **图层 | 属性**。\n+       3. 将图层名称更改为用于创建该图层的矢量图层的名称（例如\
  \ `applicants`）。您应该能够在图层源（`.tif` 文件的名称）中通过图层属性找到该值的线索。\n+       4. 对图层进行分组：\n+ \
  \         在 **图层** 面板中，按住 *Shift* 并点击批处理创建的所有图层以及之前的 `roads` 栅格。\n+          右键点击选中的图层，然后点击\
  \ **分组所选**。\n\n## 栅格分析\n\n栅格数据通过将数据组织在均匀网格中，有助于分析连续现象或在子对象级别查找某些信息。在本例中，我们将使用连续的高程和邻近度数据，并从子申请者对象级别——即\
  \ 30 米见方的像元级别——进行查看。您需要根据数据源的分辨率（例如，传感器大约相隔 30 米）、分析的粗糙度（区域还是局部）以及任何硬件限制来选择像元大小。\n\
  \n首先，让我们对栅格数据做几点说明：\n\n+   - Nodata 指的是包含在栅格网格中的像元，因为网格不能有完全未定义的像元；但是，这些像元实际上应被视为*不在图层上*。\n\
  +   - QGIS 的栅格渲染器比其专有竞争对手的渲染器更有限。您需要使用**识别**工具以及自定义样式（**单波段伪彩色**）来理解输出。\n+   - 在本例中，我们将大量依赖已封装到\
  \ QGIS 中的 GDAL 和 SAGA 库。这些库可以直接通过处理框架使用，无需在常规栅格 ETL 之外进行额外准备。如需其他功能，您需要考虑 GRASS\
  \ 库。这些库也已封装并提供给 QGIS，但需要额外准备 GRASS 工作区。\n\n现在，我们的所有数据都已转换为栅格格式，我们可以着手研究如何从这些图层中提取信息，并将这些信息结合起来，以选择最佳位置。\n\
  \n## 地图代数\n\n地图代数是一种用于处理多个栅格图层和分析步骤的有用概念，它在对齐网格中的像元之间提供算术运算。这些运算会生成一个输出栅格，其中每组像元对应一个算术解的值。在本例中，我们将使用地图代数进行叠加建模。\n\
  \n## 叠加建模\n\n现在，我们的所有数据都已转换为栅格格式，我们可以开始为选址目的进行建模。我们希望根据一组标准找出哪些像元最适合；这些标准要么已按惯例为该领域（例如农业保护区选址）确定，要么在建模时选定。叠加建模指的是将所有标准及相应权重相加，以找到最具价值的最佳区域的过程。\n\
  \n在本例中，我们选择了一些大致已知会影响农业保护区选址的标准，如下表所示：\n\n| 图层 | 标准 | 规则 |\n|---|---|---|\n| applicants\
  \ | 是否为申请者 | |\n| easements | 邻近度 | < 2000 m |\n| landuse (agriculture) | 土地利用，邻近度\
  \ | < 100 m |\n| dem | 坡度 | >= 2 且 <= 5，平均值 |\n| landuse (developed) | 土地利用，邻近度\
  \ | > 500 m |\n| roads | 邻近度 | > 100m |\n\n## 邻近度\n\n邻近度网格工具将生成一个像元图层，每个像元的值等于其距另一个网格中最近的非\
  \ nodata 像元的距离。距离值以另一个网格的 CRS 单位给出。它还会生成方向网格和分配网格，其中包含最近 nodata 像元的方向和 ID。\n\n\n\
  \n\n\n# 创建与地役权网格的邻近关系\n\n执行以下步骤：\n\n+   1. 导航到 **Processing Toolbox**。\n+   2. 在此工具箱中搜索\
  \ `proximity`。确保已选择 **Advanced Interface**。\n+   3. 找到 **SAGA** 下的 **Proximity**\
  \ 网格工具后，双击运行它。\n+   4. 为 **Features** 字段选择 **easements**。\n+   5. 为 **Distance**\
  \ 指定输出文件为 `c2/data/output/easements_prox.tif`。\n+   6. 对其他两个输出取消选中 **Open output\
  \ file after running algorithm**，如下图所示：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_254_0.png)\n\
  \n生成的网格为到最近地役权单元的距离。\n\n4. 将输出保存在 c2/data/output 中。你可以保持其他输入为默认值。\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_256_0.png)\n\
  \n5. 输出将是每个单元的坡度，以垂直高程相对于水平距离的百分比表示（“上升/运行”）。\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_256_1.png)\n\
  \n# 使用 Map Calculator 组合标准\n\n1. 确保所有标准网格（proximity、agriculture、developed、road 和\
  \ slope）都出现在图层面板中。如果没有，请添加它们。\n\n+   2. 打开栅格计算器对话框。\n+     1. 导航到 Raster | Raster\
  \ calculator\n\n+   3. 输入地图代数表达式。\n\n+   - 通过在栅格波段选择区域中双击它们来添加栅格图层\n+   - 通过键入或点击运算符区域中的按钮来添加运算符\n\
  +   - 输入的表达式应如下所示：\n\n```\n(\"slope@1\" < 8) + (\"applicants@1\" = 1) +\n  (\"easement_prox@1\"\
  <2000) + (\"roads_prox@1\">100) +\n  (\"developed_prox@1\" > 500) + (\"agriculture@1\"\
  \ < 100)\n```\n\n> [ \U0001F4A1 @1 指栅格的第一个也是唯一一个波段。 ]\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_257_0.png)\n\
  \n+   4. 为输出文件添加名称和路径并按 *Enter*。\n+   5. 如果似乎什么都没发生，你可能需要设置样式。默认情况下，非零值设置为白色显示（与我们的背景颜色相同）。\n\
  \n![](img/2e88bf5938bf48a409c0a534a8775b21_258_0.png)\n\n以下是前面地图图像的特写，以便你可以看到适宜性变化：\n\
  \n![](img/2e88bf5938bf48a409c0a534a8775b21_259_0.png)\n\n在前面的屏幕截图中，单元的评分如下：\n\n\
  +   - Green = 5（高）\n+   - Yellow = 4（中）\n+   - Red = 3（低）\n\n+   4. 创建一个 `rank`\
  \ 字段，根据区域统计步骤创建的 `_mean` 字段手动编辑每个值。这是每个单元平均适宜性的度量。我们将使用此字段作为标签，向普通受众传达相对适宜性；因此，我们需要排名而不是粗略的平均值。\n\
  \n+   5. 现在，标记图层。\n\n+   1. 在 **Layer Properties** 下，激活 **Labels** 选项卡。\n+   2.\
  \ 选择 `rank` 字段作为要标记的字段。\n+   3. 添加其他格式，例如标签放置和缓冲区（光晕），使用标签选项卡对话框内的内部选项卡，如下图所示：\n\
  \n![](img/2e88bf5938bf48a409c0a534a8775b21_261_0.png)\n\n# 识别最佳地点\n\n6. 为图层添加样式。\n\
  \n+   1. 选择 **Graduated** 样式。\n+   2. 选择合适的颜色渐变、分类数量和分类类型。\n+   3. 点击 **Classify**\
  \ 按钮，如下图所示：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_262_0.png)\n\n完成这些步骤后，你的地图将看起来类似于以下内容：\n\
  \n![](img/2e88bf5938bf48a409c0a534a8775b21_263_0.png)\n\n# 将结果作为 Web 应用程序发布\n\n\
  现在我们已经完成了农田保护选址的建模，让我们采取步骤将其发布到 Web。\n\n# qgis2leaf\n\nqgis2leaf 允许我们使用 Leaflet\
  \ 地图 API 将 QGIS 地图导出为 Web 地图格式（JavaScript、HTML 和 CSS）。Leaflet 是一个非常轻量、可扩展且响应迅速（且时尚）的\
  \ Web 映射界面。\n\nqgis2leaf 将我们所有的矢量图层转换为 GeoJSON，这是表达地理 JavaScript 对象的最常见文本方式。由于我们的操作图层位于\
  \ GeoJSON 中，Leaflet 的点击交互得到支持，我们可以通过点击访问图层中的信息。它是一个完全可编辑的 HTML 和 JavaScript 文件。你可以自定义并上传到可访问的\
  \ Web 位置，如后续章节中所述。\n\n只要到目前为止图层已正确准备（例如关于 CRS），qgis2leaf 就非常简单易用。它在为我们的 Leaflet\
  \ Web 地图创建良好的起始应用程序，包括 GeoJSON、HTML 和 JavaScript 方面也非常强大。执行以下步骤：\n\n+   1. 如果尚未安装，请确保安装\
  \ qgis2leaf 插件。\n+   2. 导航到 Web | qgis2leaf | Exports a QGIS Project to a working\
  \ Leaflet webmap。\n+   3. 点击 Get Layers 按钮，将当前显示的图层添加到 qgis2leaf 将导出的集合中。\n\n+ \
  \  4. 选择底图并在需要时输入其他详细信息。\n+   5. 选择 **Encode to JSON**。\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_265_0.png)\n\
  \n# 识别最佳地点\n\n这些步骤将生成一个类似于以下内容的地图应用程序。我们将在下一章中查看如何恢复标签：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_266_0.png)\n\
  \n# 总结\n\n在本章中，使用选址示例，我们涵盖了基本矢量数据 ETL、栅格分析和 Web 地图创建。我们从矢量数据开始，在统一 CRS 后准备属性表。然后我们使用批量处理对其进行筛选并转换为栅格网格。我们还在应用邻近和地形分析时考虑了一些基本的栅格概念。通过地图代数，我们组合了这些结果用于加性建模选址。我们准备了结果，这需要转换为矢量、样式化和标记。最后，我们使用\
  \ qgis2leaf 将准备好的矢量输出发布为简单的 Leaflet Web 地图应用程序，为扩展奠定了坚实的基础。在下一章中，你将通过水文建模示例了解更多关于栅格分析和\
  \ Web 应用程序发布的内容。\n\n# 3\n## 发现物理\n## 关系\n\n在本章中，我们将为栅格物理建模示例创建一个应用程序。首先，我们将使用栅格分析对一些基本水文分析的物理条件进行建模。接下来，我们将使用模型自动化工具重做这些步骤。然后，我们将栅格值附加到矢量对象，以便在\
  \ Web 应用程序中高效查找。最后，我们将使用云平台实现从客户端应用程序代码进行动态查询。我们将查看一个环境规划案例，提供能力让利益相关者发现上游有毒地点。\n\
  \n在本章中，我们将涵盖以下主题：\n\n+   - Hydrological modeling\n+   - Workflow automation with\
  \ graphical models\n+   - Spatial relationships for a performant access to information\n\
  +   - The NNJoin plugin\n+   - The CartoDB cloud platform\n+   - Leaflet SQLQueries\
  \ using an external API:CartoDB\n\n此功能在某些版本的 Mac OS QGIS 中不可用。\n\n**Clip by mask\
  \ layer** 工具的输出，显示裁剪到县多边形的网格，将看起来类似于以下图像（黑白颜色渐变或映射到空值的映射可能被反转）：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_271_0.png)\n\
  \n# 基于高程建模水文网络\n\n现在我们的高程网格已经准备好，是时候真正建模水文网络位置和方向了。为此，我们将使用 **Channel network and\
  \ drainage basins**，它只需要一个输入：已填充和裁剪的高程模型。该工具将使用 Strahler Order 阈值生成水文线，这与返回的河流的分层级别有关（例如，排除非常小的沟渠）。默认值为\
  \ 5，对我们的目的来说是完美的，包括足够的水文线但不过多。结果看起来非常逼真。该工具还生成许多其他相关的网格，我们在本项目中不需要。执行以下步骤：\n\n+\
  \   1. 导航到 **Processing Toolbox (Advanced Interface)**。\n+   2. 搜索 **Channel network\
  \ and drainage basins**（在 **SAGA | Terrain Analysis | Hydrology** 下）。\n+   3. 运行\
  \ **Channel network and drainage basins** 工具。\n+   4. 在 **Elevation** 字段中，输入已填充和裁剪的\
  \ DEM，即上一节中的输出。\n+   5. 在 **Threshold** 字段中，保持默认值（5.0）。\n+   6. 在 **Channels** 字段中，输入\
  \ `c3/data/output/channels.shp`。确保选中 **Open output file after running algorithm**\n\
  +   7. 对所有其他输出取消选择 **Open output file after running algorithm**。\n\n\n\n\n\n8. 点击\
  \ **Run**，如下图所示：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_273_0.png)\n\n**Channel\
  \ network and drainage basins** 的输出，显示水文线位置，将类似于以下图像：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_274_0.png)\n\
  \n## 使用图形模型进行工作流自动化\n\nGraphical Modeler 是 QGIS 中的一个工具，用于建模和自动化工作流。它与批处理不同之处在于，你可以将许多独立的操作连接成一个处理序列。它被视为处理框架的一部分。Graphical\
  \ Modeler 对于包含许多需要重复的步骤的工作流特别有用。\n\n通过构建图形模型，我们可以将水文建模过程操作化。这提供了以下几个好处：\n\n- 我们的建模过程以图形方式记录并得以保留\n\
  - 模型可以在几乎无需交互的情况下整体重新运行\n- 模型可以重新分发\n- 模型是参数化的，因此我们可以在不同的数据图层上重新运行相同的过程\n\n## 创建图形模型\n\
  \n- 1. 从 Processing 菜单调出 Graphical Modeler 对话框。\n  - 1. 导航到 Processing | Graphical\
  \ Modeler。\n- 2. 输入模型名称和组名称。\n- 3. 将你的模型保存到 `c3/data/output/c3.model` 下。\n- 该对话框是模态的，在关闭之前你无法返回\
  \ QGIS 中的其他工作，因此尽早保存会很有用。\n\n## 添加输入参数\n\n你模型算法的一些输入将是其他模型算法的输出；对于其他输入，你需要添加相应的输入参数。\n\
  \n## 添加栅格参数 – 高程\n\n我们将向模型添加第一个数据输入参数，以便模型算法可以使用它。它是我们原始的 DEM 高程数据。请执行以下步骤：\n\n\
  - 1. 从 Processing 模型器显示的左下角选择 Inputs 选项卡。\n- 2. 将 Raster layer 从参数列表拖到模型器窗格中。此参数将代表我们的高程网格（DEM）。\n\
  \n3. 为 **Parameter name** 输入 `elevation`。\n\n4. 点击 **OK**，如下图所示：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_276_0.png)\n\
  \n## 添加矢量参数 – 范围\n\n我们将向模型添加下一个数据输入参数，以便模型算法可以使用它。它是我们矢量县数据，也是我们研究的范围。\n\n- 1. 为我们的范围多边形（县）添加一个矢量图层。确保选择\
  \ **Polygon** 作为类型，并将此参数命名为 `extent`。\n\n4. 为 DEM 参数选择 **elevation** 并点击 **OK**，如下图所示：\n\
  \n![](img/2e88bf5938bf48a409c0a534a8775b21_278_0.png)\n\n## 裁剪栅格\n\n我们将添加的下一个算法是\
  \ **Clip raster by mask layer**，我们已使用它来限制后续栅格处理的范围。请执行以下步骤：\n\n- 1. 使用搜索输入定位 **Clip\
  \ raster by mask layer**。\n- 2. 从算法 '**Fill Sinks**' 中选择 '**Filled DEM**' 作为 **Input\
  \ layer** 参数。\n- 3. 为 **Mask layer** 参数选择 **extent**。\n\n4. 点击 OK，接受其他参数默认值，如下图所示：\n\
  \n![](img/2e88bf5938bf48a409c0a534a8775b21_279_0.png)\n\n## 河道网络和流域\n\n我们将添加的最后一个算法是\
  \ Channel network and drainage basins，它生成我们水文网络的模型。请执行以下步骤：\n\n- 1. 使用搜索输入定位 Channel\
  \ network and drainage basins。\n- 2. 从算法 'Clip raster by mask layer' 的 'Output Layer'\
  \ 选择作为 Elevation 参数。\n- 3. 点击 OK，接受其他参数默认值。\n\n2. 你将被提示为之前定义的高程和范围输入图层参数选择值。分别选择\
  \ dem 和 county 图层作为这些输入，如下图所示：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_281_0.png)\n\
  \n3. 在你定义并运行模型后，你之前定义的所有输出都将被生成。这些将位于你在参数对话框中或模型算法本身中定义<|message|> 的路径。\n\n> 如果你未指定输出目录，数据将保存到处理框架的临时目录，例如：\n\
  > C:\\Users\\[YOURUSERNAME]\\AppData\\Local\\Temp\\processing\\\n\n现在我们已完成水文建模，我们将查看一种为输出准备以实现动态\
  \ Web 交互的技术。\n\n## 用于高效操作图层交互的空间连接\n\n空间连接基于地理对象之间的某种地理关系，永久关联两个地理对象图层。以这种方式执行空间连接并在可能时保存到磁盘是明智的，因为空间查询会显著增加数据库请求的时间。这对于记录数量庞大的表或你的请求涉及多个空间或聚合函数时尤其如此。在本例中，我们执行空间连接，以便最终用户可以根据其选择的地点查询水文数据。\n\
  \nQGIS 对空间连接条件的选项比 ArcGIS 少。QGIS 中默认的空间连接方法可通过 Vector | Data Management Tools |\
  \ Join attributes by location 访问。然而，在撰写本文时，此操作仅限于相交要素，并且不提供附近要素的功能。NNJoin 插件 – NN\
  \ 代表最近邻 – 实现了我们想要的功能；它根据它们彼此最近的标准，将两个图层中的地理对象连接起来。\n\n## NNJoin 插件\n\n请执行以下步骤：\n\
  \n- 1. 安装 NNJoin 插件。\n- 2. 从 Vector 菜单打开 NNJoin 插件（导航到 Vector | NNJoin）。\n- 3. 指定以下参数：\n\
  \  - Input vector layer: 选择此项为 toxic – 有毒站点图层。\n  - Join vector layer: 选择此项为 Channels\
  \ – 水文线。\n  - Output layer: 选择此项为 toxic_channels。此操作仅支持输出到内存。你需要在运行后点击 Save as 将其保存到磁盘。\n\
  \n4. 点击 OK，如下图所示：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_283_0.png)\n\n现在，在\
  \ **Layers** 面板中，右键单击新创建的 **toxic_channels** 图层，然后点击 **Save as**。你应将此新文件保存到以下路径：\n\
  \n```\nc3/data/output/toxic_channels.shp\n```\n\n这些步骤的结果将是 toxic 图层的副本，其中包含 channels\
  \ 图层中最近要素的列。\n\n我们现在已完成所有数据处理步骤。现在是时候查看我们将如何使用外部云平台托管此数据以实现动态 Web 查询。\n\n## CartoDB\
  \ 平台\n\n**CartoDB** 是一个基于云的 GIS 平台，提供数据管理、查询和可视化功能。CartoDB 后端基于 Postgres/PostGIS，其最令人兴奋的功能之一是通过\
  \ URL 和 HTTP API 使用 PostGIS 语法传递空间查询的能力。\n\n## 发布数据到 CartoDB\n\n要将数据发布到 CartoDB，你首先需要建立一个账户。你可以使用\
  \ Google 单点登录轻松完成此操作，或使用用户名和密码创建自己的账户。CartoDB 提供免费账户，可无限期使用。你最多可存储 50 MB 的数据，并且所有发布的数据都可公开查看。注册后，你可以上传上一节中生成的图层。请执行以下步骤：\n\
  \n- 1. 将 shapefile 相关文件 `c3/data/output/channels.*` 和 `c3/data/output/toxic_channels.*`\
  \ 压缩，以便上传到 CartoDB。\n- 2. 如果尚未登录，请在 `https://cartodb.com/login` 登录。\n- 3. 登录后你应被重定向到你的仪表板页面。从此页面选择\
  \ **New Map**。\n- 4. 点击 **Create New Map** 从头开始创建新地图。\n- 5. 在 **Add dataset** 下点击\
  \ **Connect dataset** 以添加来自本地计算机的数据集。\n- 6. 浏览 `c3/data/output/channels.zip` 和 `c3/data/output/toxic_channels.zip`\
  \ 并将它们添加到地图。\n- 7. 选择你想要添加到地图的数据集。\n- 8. 选择 **Create Map**。\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_284_0.png)\n\
  \n\n\n\n\n## 准备 CartoDB SQL 查询\n\nSQL 是数据库查询的通用语言，通过它你可以完成从过滤、空间操作到操纵数据库中数据的一切操作。不同数据库系统之间\
  \ SQL 的工作方式略有差异。CartoDB SQL 查询使用有效的 Postgres/PostGIS 语法。有关 Postgres/PostGIS SQL\
  \ 的更多信息，请参阅 Postgres 手册中的参考章节（http://www.postgresql.org/docs/9.4/interactive/reference.html）以了解一般函数，以及\
  \ PostGIS（http://postgis.net/docs/manual-2.1/reference.html）以了解空间函数。\n\n有几种不同的方式可以针对\
  \ CartoDB 测试你的查询——每种方式的输入便利性不同，并产生不同类型的结果。\n\n### 生成测试数据\n\n我们的 SQL 查询只需要一个我们事先不知道的参数：用户所选点击位置的坐标。为了在\
  \ QGIS 中模拟这种交互并生成一个坐标对，我们将使用 Coordinate Capture 插件。请执行以下步骤：\n\n1. 如果尚未安装 Coordinate\
  \ Capture 插件，请先安装。\n2. 从 Vector 菜单中显示 Coordinate Capture 面板（导航到 Vector | Coordinate\
  \ Capture | Coordinate Capture）。\n3. 从 Coordinate Capture 面板中选择 Start capture。\n\
  4. 在地图上点击一个你期望看到上游结果的位置。换句话说，基于高程表面，选择一条水文线附近的低洼点；其他水文对象应汇入该点，如下图所示：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_286_0.png)\n\
  \n5. 记录 Coordinate Capture 面板中显示的坐标，如下一个截图所示：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_286_1.png)\n\
  \n### CartoDB SQL 视图选项卡\n\n现在，我们将返回 Web 浏览器中的 CartoDB 来运行我们的第一次测试。\n\n虽然这种方法在数据输入方面可能是最直接的，但它仅限于通过地图产生结果。除了错误之外，不会产生任何文本结果，这限制了你的测试和调试能力。请执行以下步骤：\n\
  \n1. 在地图上，点击与 **toxic_channels** 图层对应的选项卡。这通常可以在右侧标记为 2 的选项卡上访问。\n2. 你应该会看到默认显示的\
  \ SQL 视图选项卡，其中有一个 SQL 输入区域。\n3. 下一节给出的 SQL 查询从我们的连接表中选择所有记录，该表包含有毒地点的位置及其最近的水文流域和河流等级，这些记录基于我们传递的坐标满足以下条件：\n\
  \   - 与传递的坐标位于同一水文流域。\n   - 其水文河流等级低于距离传递坐标最近的河流。\n\n回想一下，我们在上一步中使用 **Coordinate\
  \ Capture** 插件生成了要传递的测试坐标。在 SQL 区域中输入以下内容。该查询将使用各种子查询、连接和空间操作，通过通配符 (*) 选择 **toxic_channels**\
  \ 中的所有字段。最终结果将显示其流域中位于点击点上游的所有有毒地点（代码在 `c3/data/original/query1.sql` 中）。执行以下代码：\n\
  \n```sql\nSELECT toxic_channels.* FROM toxic_channels\nINNER JOIN channels\nON toxic_channels.join_BASIN\
  \ = channels.basin\nWHERE toxic_channels.join_order <\n\n(SELECT channels._order\n\
  FROM channels\nWHERE\nst_distance(the_geom, ST_GeomFromText\n('POINT(-75.56111 39.72583)',4326))\n\
  IN (SELECT MIN(st_distance(the_geom,\nST_GeomFromText('POINT(-75.56111 39.72583)',4326)))\n\
  FROM channels x))\n\nAND toxic_channels.join_basin =\n\n(SELECT channels.basin\n\
  FROM channels\nWHERE\nst_distance(the_geom, ST_GeomFromText\n('POINT(-75.56111 39.72583)',4326))\n\
  IN (SELECT MIN(st_distance(the_geom,\nST_GeomFromText('POINT(-75.56111 39.72583)',4326)))\n\
  FROM channels x))\nGROUP BY toxic_channels.cartodb_id\n```\n\n4. 选择 Apply Query\
  \ 以运行查询。\n\n如果查询成功运行，你应该会看到类似于以下图片的输出：\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_288_0.png)\n\
  \n以下错误可能会妨碍你通过 CartoDB SQL 选项卡进行调试和测试：\n\n- 语句末尾出错：分号虽然是有效的，但在此接口中会导致错误。\n- 不包含\
  \ cartodb_id：语句必须显式包含 cartodb_id 字段，以免产生此错误。但是，此错误通常不会影响通过 API 或 URL 参数的使用。\n- 不包含\
  \ the_geom：语句必须显式包含对 the_geom 列的引用，即使该列在你的 cartodb 表中不可见，以便映射结果。\n\n有时，SQL 输入区域会“粘滞”。如果发生这种情况，只需“清除视图”。\n\
  \n### QGIS CartoDB 插件\n\n接下来，让我们在 QGIS 中使用 QGIS CartoDB 插件测试 SQL。请执行以下步骤：\n\n1.\
  \ 安装 QGIS CartoDB 插件，即 QGIS CartoDB。\n2. 打开 SQL CartoDB 对话框，并导航到 **Web | CartoDB\
  \ Plugin | Add SQL CartoDB Layer**。\n3. 建立与你的 CartoDB 账户的连接：\n   1. 点击 **New**。\n\
  \   2. 在浏览器中从你的账户中找到并输入你的用户名和 API 密钥。你之前运行的查询将被保存，因此如果你在打开的选项卡中（如果它仍然打开），可以直接在这里操作。否则，导航回到\
  \ **CartoDB**。当你登录 CartoDB 时，你的账户名可以在 URL 中找到，用户名位于 `username.cartodb.com/*` 中。你可以通过点击仪表板上的头像并选择\
  \ **Your API keys** 来找到你的 API 密钥。\n   3. 点击 **Save**，如下一个截图所示：\n4. 现在，你已经连接到你的 CartoDB\
  \ 账户，从 CartoDB SQL Layer 对话框加载表。\n\n![](img/2e88bf5938bf48a409c0a534a8775b21_289_0.png)\n\
  \n5. 在 SQL Query 区域输入前面的 SQL 语句。你可以使用 Add CartoDB SQL Layer 对话框的 Tables 部分查看查询中的字段名称和数据类型。\n\
  \n![](img/2e88bf5938bf48a409c0a534a8775b21_290_0.png)\n\n6. 点击 Test Query 以针对 CartoDB\
  \ 测试语法。请参阅前面测试部分中的信息框，了解你使用 CartoDB SQL 接口时可能遇到的一些常见易混淆错误。\n\n7. 点击 Add Layer 将结果添加到\
  \ QGIS。\n\n通过这些步骤添加的图层将为你提供所选坐标上游有毒地点的位置。如果你根据上游/下游等级用星号和小溪对这些位置进行符号化，你会看到类似于下图的内容：\n\
  \n![](img/2e88bf5938bf48a409c0a534a8775b21_291_0.png)\n\n### CartoDB SQL API\n\n\
  如果你想查看 CartoDB SQL 查询以 JSON 格式返回的实际内容，最好的方法是将你的 SQL 语句发送到位于 http://[YOURUSERNAME].cartodb.com/api/v2/sql\
  \ 的 CartoDB SQL API 端点。这对于调试与 Web 应用程序的交互问题尤其有用。\n\n浏览器字符串使用编码后的 URL，它会用字符序列替代某些特殊字符。例如，你可以使用一个在\
  \ Web 上容易找到的 URL 编码器/解码器来生成这样的字符串。\n\n使用以下说明查看 CartoDB 针对特定 SQL 查询返回的结果 JSON。URL\
  \ 字符串也包含在 `c3/data/original/url_query1.txt` 中。\n\n1. 在浏览器中输入以下 URL 字符串，将 [USERNAME]\
  \ 替换为你的 CartoDB 用户名，将 [APIKEY] 替换为你的 API 密钥：\n\n```\nhttp://[USERNAME].cartodb.com/api/v2/sql?q=%20SELECT%20toxic_channels.*%20FROM%20toxic_channels%20INNER%20JOIN%20channels%20ON%20toxic_channels.join_BASIN%20=%20channels.basin%20WHERE%20toxic_channels.join_order%20%3C%20(SELECT%20channels._order%20FROM%20channels%20WHERE%20st_distance(the_geom,%20ST_GeomFromText(%20(%27POINT(-75.5611%2039.72583)%27,4326))%20IN%20(SELECT%20MIN(st_distance(the_geom,%20ST_GeomFromText(%27POINT(-75.5611%2039.72583)%27,4326))%20FROM%20channels%20x))%20AND%20toxic_channels.join_basin%20=%20(SELECT%20channels.basin%20FROM%20channels%20WHERE%20st_distance(the_geom,%20ST_GeomFromText(%20(%27POINT(-75.5611%2039.72583)%27,4326))%20IN%20(SELECT%20MIN(st_distance(the_geom,%20ST_GeomFromText(%27POINT(-75.5611%2039.72583)%27,4326))%20FROM%20channels%20x))%20GROUP%20BY%20toxic_channels.cartodb_id%20&api_key=[APIKEY]\n\
  ```\n\n2. 提交浏览器请求。\n\n3. 你将看到类似于以下内容的结果：\n\n```\n{'rows': [{'the_geom':'0101000020E61000005699AA6A64352C0B23A9C05D48B4340',\
