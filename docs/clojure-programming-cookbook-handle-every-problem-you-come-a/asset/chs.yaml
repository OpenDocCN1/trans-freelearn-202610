  \n你可以在浏览器中看到你请求的请求历史，如下图所示：\n\n## Liberator 请求追踪\n\nget /customer at Mon Jun 27\
  \ 10:52:09 JST 2016 (242s ago)\nget /customer at Mon Jun 27 10:44:54 JST 2016 (677s\
