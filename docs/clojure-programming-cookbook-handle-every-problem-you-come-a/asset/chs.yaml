  \n## 参见\n\n请参见以下相关网站：\n\n- - 有关与 Clojure 的差异，请参阅 https://github.com/clojure/clojurescript/wiki/Differences-from-Clojure。\n\
  - - 要在线试用 ClojureScript，请参阅 http://himera.herokuapp.com/index.html。\n- - 关于 Quil，请参阅\
  \ http://quil.info/。\n\n## 使用 REPL 进行实时共享开发\n\n面对现实吧，你大部分 Clojure 时间都会花在 REPL 中，而那种从编写代码中获得即时反馈的满足感会让你彻夜难眠。\n\
  \n在本教程中，你将看到一些 REPL 技巧和诀窍，让你的编码更轻松，并帮助你创建属于自己的编码工作流。\n\n我们首先介绍如何使用共享 REPL 的基础知识，然后在此基础上介绍即时反馈以及编写自定义\
  \ REPL 的想法。\n\n### 准备工作\n\n本教程的第一部分将展示如何使用 Atom 编辑器进行连接。请确保你之前已经安装它，如果没有，请前往 https://atom.io：\n\
  \n![](img/d7b631352a782ee50160cf8eb995152f_476_0.png)\n\n### 提示\n\n默认设置不需要任何额外设置，但在你阅读的过程中，你需要向\
  \ project.clj 文件添加依赖项。\n\n### 如何操作...\n\n你会记得如何用以下命令启动一个简单的 REPL：\n\n```\nlein repl\n\
  ```\n\n但让我们更进一步，启动一个可以很好地与他人共享的 REPL。\n\n### 共享 REPL\n\n为了获得极致的 DIY 共享体验，现在是时候拿出你的\
  \ Raspberry Pi（或另一台机器或本地虚拟机）了。我们现在快速了解一下如何在 Raspberry Pi 上共享 REPL。请注意，它可以是任何计算机，但\
  \ Raspberry Pi 使这一点更加明显，并且流程更易于理解：\n\n![](img/d7b631352a782ee50160cf8eb995152f_478_0.png)\n\
  \n你可以使用以下命令启动一个无头 REPL，甚至可以在 Clojure 项目之外：\n\n```\nlein repl :headless :host 0.0.0.0\
  \ :port 9000\n```\n\n绑定到 `0.0.0.0` 或其 IPv6 等价地址非常重要，否则无法远程访问 REPL。为了避免选择随机端口，我们在这里也将其强制设为\
  \ 9000。现在，连接到那个远程 REPL，我们将使用 `:connect` 指令来完成。考虑到 Raspberry Pi 的 IP 为 192.168.1.9，以下是连接方法：\n\
  \n```\nlein repl :connect 192.168.1.9:9000\n```\n\n现在，为了在 Raspberry Pi 上演示一个小例子，让我们试着操作\
  \ HDD LED。让我们用以下命令移除该 LED 的保护：\n\n```\nsudo \"echo none > /sys/class/leds/led0/trigger\"\
  \n```\n\n趁此机会，让我们也修改 brightness 的权限：\n\n```\nsudo chmod 777 /sys/class/leds/led0/brightness\n\
  ```\n\n这将允许我们使用标准用户访问它。现在，通过简单的 shell 交互，让我们发送以下命令使其闪烁：\n\n```\n(use '[clojure.java.shell])\n\
  ; set this to 0 (off) or 1 (on)\n(defn set-led [n]\n  (sh \"sh\" \"-c\"\n  (str\
  \ \"echo \" n \" > /sys/class/leds/led0/brightness\")))\n\n; now some looping\n\
  (dotimes [i 10] (set-led 0) (Thread/sleep 1000) (set-led 1))\n```\n\n圣诞节已经到来了！\n\
  \n### 使用 Atom 和 proto-repl\n\n好吧，使用 REPL 很有趣，但你肯定会怀念一些文本编辑器的乐趣。进入 Atom 后，让我们一次性安装所有需要的包，享受一些\
  \ Clojure 的乐趣：\n\n![](img/d7b631352a782ee50160cf8eb995152f_480_0.png)\n\n安装完前面截图所示的全部三个包后，让我们立即连接到已经运行的\
  \ REPL：\n\n- 1. 打开“远程 Nrepl 连接”对话框，使用：\n\n![](img/d7b631352a782ee50160cf8eb995152f_480_1.png)\n\
  \n\n\n\n\n2. And open the connection itself with:\n\n![](img/d7b631352a782ee50160cf8eb995152f_481_0.png)\n\
  \n3. In the text editor area, let's type and execute the same code:\n\n![](img/d7b631352a782ee50160cf8eb995152f_481_1.png)\n\
  \nAnd yes, it is still Christmas on the Raspberry Pi (blink, blink)! If you have\
  \ noticed, some messages are complaining about the lack of a dependency:\n\n```\n\
  clojure.tools.namespace.repl not available. Add as a dependency to allow refresh.\n\
  Refresh Warning: IllegalArgumentException\nNo such namespace:\nclojure.tools.namespace.repl\n\
  clojure.lang.Var.find (Var.java:141)\n```\n\nLet's add the two following ones in\
  \ a new Leiningen project:\n\n```\n:dependencies [\n[proto-repl-charts \"0.2.0\"\
  ]\n[org.clojure/tools.namespace \"0.2.11\"]\n\n[cheshire \"5.6.1\"]\n[org.clojure/clojure\
  \ \"1.8.0\"]]\n```\n\nNow, after starting a new REPL in this project, with the same\
  \ command, you now have access to quite a few bonuses. First, you can use something\
  \ similar to Light Table's instant evaluation. Open the command box and use the\
  \ following auto eval command:\n\n![](img/d7b631352a782ee50160cf8eb995152f_482_0.png)\n\
  \nNow back to the text editor section, to see that the code is evaluated\n\ninstantly\
  \ in the opened file. This saves a lot of extra key send to REPL shortcuts:\n\n\
  ![](img/d7b631352a782ee50160cf8eb995152f_483_0.png)\n\nRemember this is still running\
  \ on the Raspberry Pi, or wherever you started, so anyone else can contribute to\
  \ the work.\n\nIf you remember, we have installed a package named proto REPL graph\
  \ and added a dependency in the project as well for it. Let's try it out!\n\nThe\
  \ dependency adds a prc namespace that does the integration for you. The default\
  \ sample graph is already pretty impressive by itself:\n\n![](img/d7b631352a782ee50160cf8eb995152f_484_0.png)\n\
  \n## Real-time chart alongside Clojure code\n\nBut let's go and do some integration\
  \ by fetching quotes from Microsoft, and display them in real time in that graph\
  \ preview:\n\n```\n(ns withatom.quotes\n  (:require [cheshire.core :refer :all]))\n\
  \n(defn get-quotes\n  [label start end]\n  (let [query\n        (str\n         \
  \ \"https://query.yahooapis.com/v1/public/yql\"\n          \"?q=select%20*%20from%20yahoo.finance.historicaldata%20\"\
  \n          \"where%20symbol%20%3D%20%22\"\n          label\n          \"%22%20and%20startDate%20%3D%20%22\"\
  \n          start\n          \"%22%20and%20endDate%20%3D%20%22\"\n          end\n\
  \          \"%22&format=json&env=store%3A%2F%2Fdatatables.org%2Falltableswithkeys\"\
  )]\n    (reverse\n      (get-in\n```\n\n```\n(parse-string\n  (slurp query))\n[\"\
  query\" \"results\" \"quote\"]))))\n```\n\n```\n(let[ result\n  (get-quotes \"MSFT\"\
  \ \"2016-02-10\" \"2016-03-20\")]\n(prc/line-chart\n  \"MSFT\"\n  {\"quote\" (map\
  \ #(% \"Open\") result)}\n  {:labels (map #(% \"Date\") result)})\n```\n\n![](img/d7b631352a782ee50160cf8eb995152f_485_0.png)\n\
  \nAs a reminder, the Raspberry Pi was still fetching the quotes for you! And only\
  \ the final rendering was done within the Atom editor!\n\n## Using an embedded NREPL\n\
  \nYou have seen how to use NREPL, which is a very powerful library for REPLing.\
  \ Let's go one step beyond that and see how to embed your own REPL into your code\
  \ using that library. First some project.clj tweaking:\n\n```\n[org.clojure/tools.nrepl\
  \ \"0.2.11\"]\n```\n\nThen, this is how you start and bind a new REPL server within\
  \ your code:\n\n```\n(use '[clojure.tools.nrepl.server :only\n(start-server stop-server)])\n\
  (def server (start-server :bind \"0.0.0.0\" :port 7888))\n```\n\nJust for the fun\
  \ of it, and if you were running this embedded REPL within Atom connected to the\
  \ Raspberry Pi (!!), then the blinking code would still work!\n\nKeep blinking.\n\
  \n## There's more...\n\nNow that we have seen how to connect to a remote shared\
  \ REPL and have quite a bit of fun with remote berries, let's go beyond and see\
  \ how to write your own REPL.\n\n## Custom REPL using Java interop\n\nHere we will\
  \ have a look at how to write a simple REPL server and a client, with standard Java\
  \ interop code and regular socket connections.\n\n### Server\n\nThe following server\
  \ will be your point of entry to open a socket, send some Clojure forms for evaluation,\
  \ eval or execute the code on the server, and send the result to the client.\n\n\
  Let's see how this is done:\n\n```\n(ns custom-repl.server\n  (:import [java.net\
  \ InetAddress ServerSocket Socket]\n           [java.io InputStreamReader OutputStreamWriter]\n\
  \           [clojure.lang LineNumberingPushbackReader]))\n```\n\n```\n(defn on-thread\
  \ [f]\n  (doto (new Thread f) (.start)))\n```\n\n```\n(defn create-server\n  [accept-socket\
  \ bind port]\n```\n\n```\n(let [address (InetAddress/getByName bind)\n      ss (new\
  \ ServerSocket port)]\n  (on-thread\n    #(when-not (. ss (isClosed))\n        \
  \ (try (accept-socket (. ss (accept)))\n              (catch Exception e))\n   \
  \      (recur)))\n    ss))\n\n(defn repl\n  [ins outs]\n  ; set some bindings for\
  \ the evaluation\n  (binding [*ns* (create-ns 'user)\n            *warn-on-reflection*\
  \ false\n            *out* (new OutputStreamWriter outs)]\n    (let [eof (new Object)\n\
  \          r (new LineNumberingPushbackReader\n              (new InputStreamReader\
  \ ins))]\n      (loop [e (read r false eof)]\n        (when-not (= e eof)\n    \
  \      (prn (eval e))\n          (flush)\n          (recur (read r false eof)))))))\n\
  \n(defn socket-repl\n  [s] (on-thread\n       #(repl (. s (getInputStream)) (. s\
  \ (getOutputStream)))))\n\n(def server\n  (create-server socket-repl \"0.0.0.0\"\
  \ 9001))\n\n; (. server (close))\n```\n\nYou can see from the previous code, we\
  \ create a set of local bindings in the repl function. The first binding *ns* create\
  \ a user namespace to use for evaluation of the different forms. Another binding\
  \ is *out* which simply pipes the output of the evaluation to the socket used for\
  \ output.\n\nFinally, each connection creates a thread, with input and output used\
  \ as bindings in the eval function call.\n\n### Client\n\nWriting a simple client\
  \ that would connect to the preceding server is also\n\nquite simple. Say you want\
  \ to programmatically send code to be evaluated remotely; this is how to do it,\
  \ again with straightforward Java interop:\n\n```\n(ns custom-repl.client\n  (:import\
  \ [java.net Socket]\n           [java.io InputStreamReader OutputStreamWriter]\n\
  \           [clojure.lang LineNumberingPushbackReader]))\n\n(def client\n  (new\
  \ Socket \"localhost\" 9001))\n\n(def rdr (new LineNumberingPushbackReader\n   \
  \           (new InputStreamReader (. client\n(getInputStream)))))\n(def wtr (new\
  \ OutputStreamWriter (. client (getOutputStream))))\n\n(binding [*out* wtr]\n  (prn\
  \ '(+ 1 2 3))\n  (flush)\n  (read rdr))\n\n(. client (close))\n```\n\nThis can,\
  \ of course, be used for regular REPLs as well and eventually any kind of socket\
  \ connectivity.\n\n## The async custom REPL server\n\nJava interop is cool but is\
  \ also a bit passe when you can use core.async. You will need one more dependency\
  \ in your project.clj file:\n\n```\n[com.hellonico.gearswithingears/async-sockets\
  \ \"0.1.0\"]\n```\n\nA dumb REPL will go on using core.async to handle the request\
  \ and simply eval the string that has been sent to the server. This is very similar\
  \ to what we saw in the async chapters applied to something practical!\n\n```\n\
  (ns custom-repl.async\n  (:require [com.gearswithingears.async-sockets :refer :all]\n\
  \            [clojure.core.async :as async]))\n```\n\n```\n(defn eval-everything\
  \ [socket]\n  (async/go-loop []\n    (when-let [line (async/<! (:in socket))]\n\
  \      (async/>! (:out socket) (eval (read-string line)))\n      (recur))))\n```\n\
  \n```\n(let [server (socket-server 12349)]\n  (async/go-loop []\n    (when-let [connection\
  \ (async/<!! (:connections server))]\n      (eval-everything connection)\n     \
  \ (recur))))\n```\n\nThe async code is nicely shorter and more readable.\n\n## Server\
  \ REPL or more on real-time work on production code\n\nNow, onto one of the good\
  \ news about the recently released Clojure 1.8! One of the new features that many\
  \ of us have been waiting for a long time is the ability to just start a server\
  \ REPL with ease.\n\nNow it just became possible by simply declaring a parameter\
  \ when starting the virtual machine, being able to connect to it using a simple\
  \ socket, and having full access to an REPL.\n\nUsing the standard JAR file, for\
  \ example, the one you build in the Clojure source code recipe, we will be using\
  \ the following JVM parameter when starting clojure.main:\n\n```\n-Dclojure.server.repl=\"\
  {:port 5555 :accept clojure.main/repl}\"\n```\n\nThis tells the Clojure runtime\
  \ to start an repl on port 555, and when a socket connect request is about to be\
  \ accepted, use the clojure.main/repl function to handle the call. Now, for the\
  \ simplest of cases, this translates into the following command:\n\n```\njava \\\
  \n-cp clojure-1.8.0.jar \\\n-Dclojure.server.repl=\"{:port 5555 :accept clojure.main/repl}\"\
  \ \\\nclojure.main\n```\n\n\n\n\n\n并且有效地，Clojure 将简单地输出通常的反馈消息：\n\n```\nClojure\
  \ 1.8.0\nuser=>\n```\n\n但现在，我们可以使用 __telnet__ 连接到它。我们将端口定义为 5555，所以让我们 telnet 到它：\n\
  \n```\nniko> telnet 127.0.0.1 5555\n\nTrying 127.0.0.1...\nConnected to localhost.\n\
  Escape character is '^]'.\nclojure.core=>\n```\n\n并且我们拥有对 REPL 和我们提供给正在运行应用程序的类路径的完全访问权限。所以如果我们重用我们之前看到的代码，比如说：\n\
  \n```\n(def msg \"I left a message here\")\n; #'clojure.core/msg\n```\n\n然后断开连接并重新连接，我们会看到在同一个命名空间中\
  \ def 的内容仍然存在并且已持久化：\n\n```\nniko> telnet 127.0.0.1 5555\n\nTrying 127.0.0.1...\n\
  Connected to localhost.\nEscape character is '^]'.\nclojure.core=> msg\n\"I left\
  \ a message here\"\n```\n\n运行了多少个会话可以通过使用以下全局变量简单地看到：\n\n```\nclojure.core=> clojure.core.server/*session*\n\
  ; {:server \"repl\", :client \"5\"}\n```\n\n启动 REPL 服务器的参数完整映射如下：\n\n```\n{:address\
  \ \"localhost\" ;; host or dotted name, ipv4 or ipv6\n:port 5555\n:name \"repl\"\
  \n:accept clojure.main/repl\n:args []\n:bind-err true\n:server-daemon true\n:client-daemon\
  \ true}\n```\n\n并且也可以从文件中读取配置。\n\n## 使用 plumatic/schema 进行声明式数据描述和验证\n\nClojure\
  \ 是动态类型语言，通常在你独自开发或在小型团队中时提供生产力。然而，在大型团队中的开发有时需要成员之间对数据有了解。prismatic/schema 提供了针对上述问题的解决方案。\n\
  \n在本教程中，我们将学习如何在 Clojure 中添加描述性表达式和验证。我们将使用 prismatic/schema 为各种数据类型定义模式并用模式验证它们。prismatic/schema\
  \ 可以定义定义输入参数和返回的模式的函数。我们将然后学习如何将一种数据类型强制转换为另一种数据类型。\n\n最后，我们将学习其他解决方案。我们将介绍 core/typed\
  \ 尝试提供类似于 Scala 的类型推断系统。core/spec 是一个新功能，并在 Clojure 1.9 中引入。\n\n## 准备工作\n\n让我们使用\
  \ prismatic/schema 创建一个项目。prismatic/schema 支持 Clojure 和 ClojureScript。所以，让我们使用 Figwheel\
  \ 创建一个项目：\n\n```\n$ lein new figwheel schema-example\n$ cd schema-example\n```\n\
  \n我们将在 project.clj 中添加 prismatic/schema 的库依赖：\n\n```\n:dependencies [[org.clojure/clojure\
  \ \"1.8.0\"]\n                [org.clojure/clojurescript \"1.8.51\"]\n         \
  \       [org.clojure/core.async \"0.2.374\"\n                 :exclusions [org.clojure/tools.reader]]\n\
  \                [prismatic/schema \"1.1.1\"]\n[prismatic/schema-generators \"0.1.0\"\
  ]\n]]\n```\n\n启动 REPL，然后创建 src/schema-example/cljexample.clj 并声明要使用的 _prismatic/schema\
  \ 库：\n\n```\n(ns schema-example.clj-example\n  (:require [schema.core :as s]))\n\
  ;;=> nil\n```\n\n## 如何做...\n\n我们将在这里学习 prismatic/schema 的基本用法。让我们从书籍的简单模式开始。\n\n\
  ### 我的第一个模式\n\n让我们为书籍定义一个模式。Book 是一个映射，模式如下：\n\n| Name | Data type |\n|------|-----------|\n\
  | name | String |\n| author | Array of String |\n| category | Set of keyword |\n\
  | publisher | String |\n\n现在，让我们使用 prismatic/schema 定义前述模式：\n\n```\n(def Book\n\
  \  {\n    :name s/Str\n    :author [s/Str]\n    :category #{s/Keyword}\n    :publisher\
  \ s/Str})\n;;=> #'schema-example.clj-example/Book\n```\n\n然后，让我们通过使用以下方式验证来检查给定数据是否正确\n\
  \n```\n(s/validate {s/Keyword s/Int} {:year 2016})\n;; => {:year 2016}\n(s/validate\
  \ #{s/Keyword} #{:lisp :functional})\n;; => #{:lisp :functional}\n```\n\n我们将验证任意类型和枚举类型：\n\
  \n```\n(s/validate s/Any \"Makoto\")\n;;=> \"Makoto\"\n(s/validate s/Any 1.0)\n\
  ;;=> 1.0\n(s/validate s/Regex #\".*\")\n;;=> #\".*\"\n(s/validate (s/enum \"01\"\
  \ \"02\" \"03\") \"01\")\n;;=> \"01\"\n(s/validate (s/enum \"01\" \"02\" \"03\"\
  ) \"05\")\n;;=> ExceptionInfo Value does not match schema: (not (#{ \"03\" \"02\"\
  \ \"01\"} \"05\"))  schema.core/validator/fn--38164\n(core.clj:155)\n```\n\n## 使用模式进行记录和其他类型\n\
  \n我们可以使用模式进行记录。让我们定义 Order 类型并验证其实例：\n\n```\n(s/defrecord Order\n  [name :- s/Str\n\
  \   price :- s/Num\n   qty :- s/Int])\n;;=> #'schema-example.clj-example/strict-map->Order\n\
  (s/explain Order)\n;;=> (record schema_example.clj_example.Order {:name Str,\n:price\
  \ Num, :qty Int})\n(s/validate Order (map->Order {:name \"Clojure Programming Cookbook\"\
  \ :price 32.00 :qty 10}))\n;;=> #schema_example.clj_example.Order{:name \"Clojure\
  \ Programming Cookbook\", :price 32.0, :qty 10}\n```\n\nOrder 记录具有 name、price 和\
  \ qty 属性，它们的类型分别为字符串、数字和整数。prismatic/schema 提供了值的范围验证。下一段代码验证数字的范围：\n\n```\n(s/validate\
  \ (s/pred #(and (< 0 %) (> 10 %))) 5)\n```\n\n```\n;;=> 5\n```\n\nschema.core/maybe\
  \ 检查值是否为指定类型或 nil：\n\n```\n(s/validate (s/maybe s/Keyword) :price)\n;;=> :price\n\
  (s/validate (s/maybe s/Keyword) nil)\n;;=> nil\n(s/validate (s/maybe s/Keyword)\
  \ 1)\n;;=> ExceptionInfo Value does not match schema: (not (keyword? 1))  schema.core/validator/fn--38164\
  \ (core.clj:155)\n```\n\n在前面的示例中，关键字和 nil 是有效的，但整数无效。以下 NumMapOrSetOrList 验证检查的数据应为其键为关键字的映射、数字的集合或数字的数组：\n\
  \n```\n(def NumMapOrSetOrList (s/conditional map? {s/Keyword s/Num} set? #{s/Num}\
  \ :else [s/Num]))\n;;=> #'schema-example.clj-example/NumMapOrSetOrList\n(s/validate\
  \ NumMapOrSetOrList {:qty 1.0})\n;;=> {:qty 1.0}\n(s/validate NumMapOrSetOrList\
  \ #{1 2 3})\n;;=> #{1 3 2}\n(s/validate NumMapOrSetOrList [1 2 3])\n;;=> [1 2 3]\n\
  ```\n\n```\n(def SmallInt (s/constrained long #(and (<= -32768 %) (>= 32767 %))))\n\
  ;;=> #'schema-example.clj-example/SmallInt\n(s/validate SmallInt 10)\n;;=> 10\n\
  (s/validate SmallInt 500000)\n;;=> ExceptionInfo Value does not match schema: (not\
  \ (schema-example.clj-example/fn--39713 500000))\nschema.core/validator/fn--38164\
  \ (core.clj:155)\n```\n\nprismatic/schema 提供了递归数据类型：\n\n```\n(def Recursive {:key\
  \ s/Int :value s/Str :children [(s/recursive #'Recursive)]})\n;;=> #'schema-example.clj-example/Recursive\n\
  (s/validate Recursive\n  {:key 1 :value \"test\", :children\n   [{:key 2 :value\
  \ \"test2\", :children [] }\n{:key 3 :value \"test3\", :children [{:key 4 :value\
  \ \"test4\" :children []}]}}\n;;=> {:key 100, :value \"test\", :children [{:key\
  \ 2, :value \"test2\", :children []} {:key 3, :value \"test3\", :children [{:key\
  \ 4, :value \"test4\", :children []}]}]}\n```\n\n## 使用验证定义函数\n\nschema.core/defn\
  \ 验证输入参数和返回类型。以下示例定义 int-add 以添加整数加法。让我们定义 int-add，其参数和返回类型都是整数：\n\n```\n(s/defn\
  \ int-add :- s/Int\n  [& x :- [s/Int]]\n  (reduce + x))\n;;=> #'schema-example.clj-example/int-add\n\
  ```\n\n让我们测试该函数：\n\n```\n(int-add 1 1 2 3)\n;;=> 7\n(int-add 1 1.0 4)\n;;=> 6.0\n\
  ```\n\n默认情况下没有模式检查。schema.core/set-fn-validation! 将模式检查设置为如下：\n\n```\n(s/set-fn-validation!\
  \ true)\n;;=> nil\n(int-add 1 1.0 4)\n;;=> ExceptionInfo Input to int-add does not\
  \ match schema: [nil (not (integer? 1.0))]  schema-example.clj-example/eval49222/int-add--49227\
  \ (form-init3277965317664434982.clj:262)\n(s/set-fn-validation! false)\n;;=> nil\n\
  (int-add 1 1.0 4)\n;;=> 6.0\n```\n\n所以，让我们检查如果返回类型无效。^:always-validate 总是验证模式类型：\n\
  \n```\n(s/defn ^:always-validate wrong-int-add :- s/Int\n  [& x :- [s/Int]]\n(bigdec\
  \ (reduce + x)))\n;;=> #'schema-example.clj-example/wrong-int-add\n(wrong-int-add\
  \ 1 1)\n;;=> ExceptionInfo Output of wrong-int-add does not match schema: (not (integer?\
  \ 2M))  schema-example.clj-example/eval49476/wrong-int-add--49481 (form-init3277965317664434982.clj:284)\n\
  ```\n\n在前面的情况下，wrong-int-add 返回 BigDecimal，这导致错误。\n\n## 它是如何工作的...\n\n在本教程中，我们将检查\
  \ prismatic schema 的性能以及如何使用 schema 生成测试数据。\n\n## 性能考虑\n\n在这里，我们将使用 int-add 检查性能。让我们比较\
  \ schema.core/with-fn-validation 和 schema.core/without-fn-validation 的性能：\n\n```\n\
  (time\n  (dotimes [n 100000]\n    (s/with-fn-validation\n      (int-add 1 2))))\n\
  ;;\"Elapsed time: 587.858912 msecs\"\n;;=> nil\n(time\n  (dotimes [n 100000]\n \
  \   (s/without-fn-validation\n      (int-add 1 2))))\n;;=> \"Elapsed time: 150.847882\
  \ msecs\"\n;;=> nil\n```\n\n没有模式检查更快。然后，我们将测试 (s/set-fn-validation! true) 和 (s/set-fn-validation!\
  \ false) 的性能：\n\n```\n(s/set-fn-validation! true)\n;;=> nil\n(time\n  (dotimes [n\
  \ 100000]\n    (int-add 1 2)))\n```\n\n\n\n\n\n```\n; ;=> \"Elapsed time: 140.624018\
  \ msecs\"\n; ;=> nil\n(s/set-fn-validation! false)\n; ;=> nil\n(time\n  (dotimes\
  \ [n 100000]\n    (int-add 1 2)))\n; ;=> \"Elapsed time: 28.948555 msecs\"\n; ;=>\
  \ nil\n```\n\n就性能而言，使用 set-fn-validation 比使用 with-fn-validation/without-fn-validation\
  \ 来切换验证更快。最后，我们将测试原生 + 函数的性能：\n\n```\n(time\n  (dotimes [n 100000]\n    (+ 1 2)))\n\
  ; ;=> \"Elapsed time: 7.058001 msecs\"\n; ;=> nil\n```\n\n两个数字的加法太小，无法评估 prismatic/schema\
  \ 的性能。让我们通过计算一百个数字的加法来衡量性能：\n\n```\n(time\n  (dotimes [n 1000000]\n    (apply int-add\
  \ (range 100))))\n\"Elapsed time: 3387.52923 msecs\"\n; ;=> nil\n```\n\n```\n(time\n\
  \  (dotimes [n 1000000]\n    (apply + (range 100))))\n\"Elapsed time: 3681.930561\
  \ msecs\"\n; ;=> nil\n```\n\n似乎使用 schema 和不使用 schema 之间没有区别。\n\n## 生成测试数据\n\nprismatic/schema\
  \ 可用于生成测试数据。prismatic/schema-generators 可从模式生成测试数据。prismatic/schema-generators 仍处于\
  \ alpha 版本，但非常有用，可以生成测试数据并理解数据结构。所以，让我们看看它是如何工作的。\n\n首先，我们将 schema-generators.generators\
  \ 添加到命名空间声明的 :require 部分：\n\n```\n(ns schema-example.clj-example\n  (:require [schema.core\
  \ :as s]\n            [schema.coerce :as coerce :include-macros true]\n        \
  \    [schema-generators.complete :as c :include-macros true]\n            [schema-generators.generators\
  \ :as g :include-macros true]\n            [schema-generators.complete :as gc]\n\
  \  ))\n;;=> nil\n```\n\n让我们再添加一个映射键，其值是枚举类型：\n\n```\n(def Book\n  {\n    :name s/Str\n\
  \    :author [s/Str]\n    :keyword #{s/Keyword}\n    :publisher s/Str\n    :category\
  \ (s/enum :it :romance :business-money)})\n;;=> #'schema-example.clj-example/Book\n\
  ```\n\n然后，我们将从 Book 创建测试数据：\n\n```\n(g/generate Book)\n;;=> {:name \"gWTFZ>'\",\
  \ :author [\"ECg5Q\" \" i>Y8z\\\\2\"], :keyword #{}, :publisher \"s@\", :category\
  \ :it}\n```\n\n以下代码将生成 100 条数据：\n\n```\n(g/sample 100 Book)\n;;=> ({:name \"\",\
  \ :author [], :keyword #{}, :publisher \"\", :category :business-money}\n;;=> {:name\
  \ \"\", :author [\"\"], :keyword #{:Wt}, :publisher \">\", :category :it}\n;;=>\
  \ {:name \"z\", :author [], :keyword #{:j}, :publisher \"jK\", :category :business-money}\n\
  ;;=> ......\n```\n\n生成随机数据很容易：\n\n```\n(g/sample 10 s/Str)\n;;=> (\"\" \"'\" \"\
  ##\" \"r8\" \"\" \"'Uqn3\" \"\" \"F8602B1\" \"AR~2,\" \"\")\n(g/sample 10 s/Int)\n\
  ;;=> (-1 -1 -2 1N 0N -9 -1N 23 2 -6)\n(g/sample 10 s/Num)\n;;=> (0 0.75 0 1 -1 2.0\
  \ -4 -2 2.0 0.5)\n```\n\nschema-generators.complete 为定义的模式创建完整数据：\n\n```\n(gc/complete\
  \ {:name \"foo\" :keyword #{:bar}} Book)\n;;=> {:name \"foo\", :author [\"ft?\"\
  \ \"yY31\"], :keyword #{:bar},\n:publisher \"kw\", :category :romance}\n```\n\n\
  ## 还有更多...\n\nprismatic/schema 运行在 ClojureScript 上。我们将运行 Figwheel 来测试它。\n\n## 使用\
  \ prismatic/schema 进行数据强制转换\n\n在学习本节之前，让我们运行 Figwheel REPL：\n\n```\n$ lein figwheel\n\
  ```\n\n然后，定义 schema-example.cljs-example 命名空间并按如下方式声明 schema 库：\n\n```\n(ns schema-example.cljs-example\n\
  \  (:require [schema.core :as s :include-macros true]\n            [schema.coerce\
  \ :as coerce :include-macros true]\n            [schema-generators.complete :as\
  \ c :include-macros true]\n            [schema-generators.generators :as g :include-macros\
  \ true]\n            [schema-generators.complete :as gc :include-macros true]))\n\
  ;;=> nil\n```\n\n使用 ClojureScript，:include-macros 选项是必要的。假设一个订单有两个产品。defschema 是定义模式并在元数据中记录模式名称的宏：\n\
  \n```\n(s/defschema RequestOrder\n  { :id s/Str\n    :product s/Str\n    :qty s/Int\n\
  \    :unit-price s/Num\n    :product2 s/Str\n    :qty2 s/Int\n    :unit-price2 s/Num})\n\
  ;;=> #'schema-example.cljs-example/RequestOrder\n```\n\n我们将定义 ReplyOrder，其格式与 RequestOrder\
  \ 略有不同：\n\n```\n(s/defschema ReplyOrder\n  { :order-id s/Str\n    :ordered-product\
  \ [[(s/one s/Str \"s\") (s/one s/Int \"s\") (s/one s/Num \"s\")]]\n    })\n;;=>\
  \ #'schema-example.cljs-example/ReplyOrder\n```\n\n两个订单被分组到 :order-product 中，值的类型是数组的数组。prismatic/schema/one\
  \ 限制了数组序列的顺序。之前的模式限制每个产品是 [String, Integer, Number]。\n\n我们将按如下方式编写 RequestOrder\
  \ 到 ReplyOrder 的映射：\n\n```\n(defn RequestOrder->ReplyOrder\n  [{:keys [id product\
  \ qty unit-price product2 qty2 unit-price2]\n    :as request-params}]\n  {:order-id\
  \ id :ordered-product [[product qty unit-price]\n                              \
  \     [product2 qty2 unit-price2]]})\n;;=> #'schema-example.cljs-example/RequestOrder->ReplyOrder\n\
  ```\n\n然后，让我们定义 order-coercer 并测试它：\n\n```\n(def order-coercer\n  (coerce/coercer\
  \ ReplyOrder\n                   {ReplyOrder RequestOrder->ReplyOrder}))\n;;=> #'schema-example.cljs-example/order-coercer\n\
  (order-coercer\n\n```\n{:id \"10\" :product \"pencil\" :qty 5 :unit-price 1.0 :product2\
  \ \"note\" :qty2 5 :unit-price2 3.0})\n    ; ;=> {:order-id \"10\", :ordered-product\
  \ [[\"pencil\" 5 1] [\"note\" 5 3]]}\n```\n\n我们可以看到输入映射被转换成了数组的数组。接下来，我们将尝试另一个 coercer。以下\
  \ coercer 将产品转换为映射的数组：\n\n```\n(s/defschema ReplyOrder2\n  { :order-id s/Str\n \
  \   :ordered-product\n    [{(s/required-key :product-name) s/Str\n      (s/required-key\
  \ :qty) s/Int\n      (s/required-key :unit-price) s/Num}]})\n;;=> #'schema-example.cljs-example/RequestOrder\n\
  (defn RequestOrder->ReplyOrder2\n  [{:keys [id product qty unit-price product2 qty2\
  \ unit-price2]\n    :as request-params}]\n  {:order-id id\n   :ordered-product [\n\
  \                    {:product-name product :qty qty :unit-price unit-price}\n \
  \                   {:product-name product2 :qty qty2 :unit-price unit-price2}]})\n\
  ;;=> #'schema-example.cljs-example/RequestOrder->ReplyOrder2\n```\n\n然后，让我们测试它：\n\
  \n```\n(def order-coercer2\n  (coerce/coercer ReplyOrder2\n                   {ReplyOrder2\
  \ RequestOrder->ReplyOrder2}))\n;;=> #'schema-example.clj-example/order-coercer2\n\
  (order-coercer2\n  {:id \"10\" :product \"pencil\" :qty 5 :unit-price 1.0 :product2\
  \ \"note\" :qty2 5 :unit-price2 3.0})\n;;=> {:order-id \"10\", :ordered-product\
  \ [{:product-name \"pencil\", :qty 5, :unit-price 1} {:product-name \"note\", :qty\
  \ 5, :unit-price 3}]}\n```\n\n## 使用 core.typed\n\n这里，我们将简要介绍 core.typed，它与 prismatic/schema\
  \ 不同。core.typed 是 Clojure 中的可选类型系统，能够在编译时对变量、函数参数和宏进行静态类型检查。还可能对协议和数据类型进行注解。\n\n\
  要开始使用 core.typed，让我们按如下方式修改 project.clj 并重新启动 REPL：\n\n```\n:dependencies [[org.clojure/clojure\
  \ \"1.8.0\"]\n                [org.clojure/core.typed \"0.3.21\"]]\n:repositories\
  \ {\"sonatype-oss-public\"\n\"https://oss.sonatype.org/content/groups/public/\"\
  }\n:injections [(require 'clojure.core.typed)\n            (clojure.core.typed/install)]\n\
  ```\n\n创建 src/typed_example/core.clj 并按如下方式声明命名空间：\n\n```\n(ns typed-example.core\n\
  \  {:lang :core.typed}\n  (:require [clojure.core.typed :as t]))\n```\n\n然后，让我们使用\
  \ clojure.core.typed/ann 定义 my-add 的注解：\n\n```\n(t/ann my-add [Number Number ->\
  \ Number])\n;;=> nil\n```\n\n我们将使用 clojure.core/defn 定义 my-add 并测试它：\n\n```\n(defn\
  \ my-add [a b] (+ a b))\n;;=> #'typed-example.core/my-add\n(my-add 1 2)\n;;=> 3\n\
  ```\n\n它有效！现在，我们将测试一个失败的案例，给出一个字符串参数：\n\n```\n(my-add 1 \"a\")\n;;=> Type Error\
  \ (*cider-repl typed-example:49585*:459:20)\nFunction add could not be applied to\
  \ arguments:\n;;=> Domains:\n;;=>     Number Number\n;;=> Arguments:\n;;=>     (t/Val\
  \ 1) (t/Val \"a\")\n```\n\n\n\n\n\n```\n; ;=> Ranges:\n; ;=>     Number\n; ;=> in:\
  \ (my-add 1 \"a\")\n; ;=> ExceptionInfo Type Checker: Found 1 error\nclojure.core/ex-info\
  \ (core.clj:4617)\n```\n\n我们可以按如下方式在 vars 中定义类型：\n\n```\n(t/ann d-value BigDecimal)\n\
  ; ;=> nil\n```\n\n让我们按如下方式测试前面的内容：\n\n```\n(def d-value 10.0M)\n; ;=> #'typed-example.core/d-value\n\
  (def d-value 1)\n; ;=> Type Error (*cider-repl typed-example:49585*:584:20) Type\
  \ mismatch:\n; ;=> Expected:     BigDecimal\n; ;=> Actual:       (t/Val 1)\n; ;=>\
  \ in: 1\n; ;=> ExceptionInfo Type Checker: Found 1 error\nclojure.core/ex-info (core.clj:4617)\n\
  ```\n\n它无法将 1 赋给 d-value。\n\n## core.spec\n\nClojure 1.9 支持 spec 库，用于通过 spec_ 按规范支持数据结构、验证和生成。它类似于\
  \ prismatic/schema_，但它包含在 Clojure 中，无需加载额外的库。\n\n让我们创建一个名为 spec-example 的新项目：\n\n\
  ```\n$ lein new spec-example\n```\n\n然后替换 Clojure 的版本：\n\n```\n:dependencies [[org.clojure/clojure\
  \ \"1.9.0-alpha7\"]]\n```\n\n我们将按如下方式声明使用 clojure.spec：\n\n```\n(ns spec-example.core\n\
  ```\n\n```\n(:require [clojure.spec :as s])\n)\n```\n\n我们使用 core.spec 按如下方式定义字符串序列：\n\
  \n```\n(s/def ::seq-of-names (s/* string?))\n;;=> :spec-example.core/seq-of-names\n\
  ```\n\n要查看定义，请使用 core.spec/describe：\n\n```\n(s/describe ::seq-of-names)\n;;=> (*\
  \ string?)\n```\n\n让我们测试一下：\n\n```\n(s/conform ::seq-of-names [\"Makoto Hashimoto\"\
  \ \"Nicolas Modrzyk\"])\n;;=> [\"Makoto Hashimoto\" \"Nicolas Modrzyk\"]\n```\n\n\
  它工作正常，但以下检查失败：\n\n```\n(s/conform ::seq-of-names [:Makoto-Hashimoto \"Nicolas Modrzyk\"\
  ])\n;;=> :clojure.spec/invalid\n```\n\n以下代码与本教程中 prismatic/schema 部分中的代码相同：\n\n\
  ```\n(s/def ::date (s/map-of keyword? integer?))\n;;=> :spec-example.core/date\n\
  (s/conform ::date {:year 2016})\n;;=> {:year 2016}\n(s/conform ::date {:year 2016\
  \ :date 10 :month 7})\n;;=> {:year 2016, :date 10, :month 7}\n(s/valid? #{\"01\"\
  \ \"02\" \"03\"} \"01\")\n;;=> true\n(s/valid? #{\"01\" \"02\" \"03\"} \"04\")\n\
  ;;=> false\n(s/valid? (s/nilable string?) \"test\")\n;;=> true\n(s/valid? (s/nilable\
  \ string?) nil)\n;;=> true\n(s/valid? (s/nilable string?) 1)\n;;=> false\n(s/def\
  \ ::small-int #(<=-32768 % 32767))\n```\n\n```\n; ;=> :spec-example.core/small-int\n\
  (s/conform ::small-int 10)\n; ;=> 10\n(s/conform ::small-int 50000)\n; ;=> :clojure.spec/invalid\n\
  ```\n\n要为函数定义函数规范，请使用 core.spec/fdef。我们将定义一个非常简单的函数，该函数限制参数值为整数且为正。首先，我们将使用 defn\
  \ 定义 positive-int-add：\n\n```\n(defn positive-int-add [x  y]\n  (+ x y))\n; ;=>\
  \ #'spec-example.core/positive-int-add\n```\n\n然后，我们将使用 core.spec/fdef 检查两个参数是否为整数且大于\
  \ 0：\n\n```\n(s/fdef positive-int-add\n  :args (s/and (s/cat :x integer? :y integer?)\n\
  \              #(and (< 0 (:x %)) (< 0 (:y %))))\n  :ret integer?)\n; ;=> spec-example.core/positive-int-add\n\
  ```\n\n让我们检查 positive-int-add 函数：\n\n```\n(positive-int-add 1 10)\n; ;=> 11\n(positive-int-add\
  \ 1 -20)\n; ;=> -19\n```\n\n糟糕，函数没有检查参数 -20。要使其成为 core.spec/fdef 可用，我们必须按如下方式操作：\n\
  \n```\n(s/instrument #'positive-int-add)\n; ;=> #'spec-example.core/positive-int-add\n\
  ```\n\n让我们再试一次！\n\n```\n(positive-int-add 1 -20)\n; ;=> ExceptionInfo Call to #'spec-example.core/positive-int-add\
  \ did not conform to spec:\n; ;=> val: {:x 1, :y -20} fails at: [:args] predicate:\
  \ (and (< 0 (:x %)) (< 0 (:y %)))\n; ;=> :clojure.spec/args  (1 -20)\n```\n\n; ;=>\
  \  clojure.core/ex-info (core.clj:4703)\n\n在这里，`fdef` 对 `positive-int-add` 正确工作，就这样！\n"
- "# 第 8 章. Web 应用程序\n\n在本章中，我们将介绍：\n\n- Clojure with Vaadin - 轻松的 Web 小部件\n- 使用 Liberator\
  \ 快速创建 REST API\n- 使用 Immutant 工作 - 重用基础设施\n- 使用 om.next 开发，该库是下一代 ClojureScript\
  \ 库\n\n## 引言\n\n在本章中，我们将使用 Clojure 学习 Web 应用程序开发。首先，我们将学习如何使用 Vaadin 进行基于小部件的开发。我们将学习使用\
  \ Vaadin 通过 Clojure 进行基于小部件的开发是多么容易。\n\n然后，我们将看一下 Liberator。Liberator 是一个用于在 REST\
  \ 中开发资源的库。我们将首先使用 Liberator 开发一个简单的 REST API，但我们将学习使用 Liberator 的更高级用法。\n\n接下来，我们将学习\
  \ Immutant，这是一个基于 Undertow 用于 Web、HornetQ 用于消息传递、Infinispan 用于缓存、Quartz 用于调度和 Narayama\
  \ 用于事务的 Clojure 库套件。使用 Immutant 进行应用程序开发时，我们可以部署到 WildFly 或 JBoss EAP 集群以获得增强功能。在本教程中，我们将学习如何使用\
  \ Immutant 开发高级 Web 应用程序。我们还将学习如何打包和部署我们的应用程序。\n\n最后，我们来看一下 David Nolen 的 om.next。Om.next\
  \ 是受 Facebook 的 Relay、Netflix 的 Falcor 和 Cognitect 的 Datomic 启发的 om 的继任者。它仍处于 alpha\
  \ 阶段，但具有用于开发应用程序的新概念。在教程中，我们将学习 om.next 的基本功能。\n\n## Clojure with Vaadin - 轻松的 Web\
  \ 小部件\n\nVaadin 已存在相当一段时间，以其全代码式 UI 框架而闻名于 Web 应用程序。当然，还有许多框架可用于 Web 工作，甚至在本章中我们也介绍了基于\
  \ JavaScript 库的一些著名框架。\n\nVaadin 提出了一套一致的易于使用的通常用 Java 编写的 widgets。通过一点 Clojure\
  \ 魔法，但主要是通过在编译代码和脚本之间架起桥梁的方式，你现在可以使用你喜欢的语言来脚本化 UI，使用这些 widgets 并实时查看更新。在本教程中，你还将被再次介绍\
  \ Vaadin 与 Clojure 相关的响应式编程概念的范围。享受吧！\n\n## 开始准备\n\n要开始使用 Clojure/Vaadin 编程，你将通过设置\
  \ `project.clj` 文件并使用一些简单但特定的设置开始。让我们看看里面有什么。\n\n## 项目设置\n\n要使用 Vaadin 类，我们将导入必要的库到我们的项目中。Vaadin\
  \ 库将作为常规依赖项包含。`project.clj` 文件还引入了 `lein-servlet` 插件，这是一个插件，它插入了通常基于 Java 的服务器端编程环境，名为\
  \ `servlet`。该插件还嵌入了一个轻量级应用程序服务器，名为 Jetty。\n\n最后，`project.clj` 文件通过启动 Jetty 服务器并指定参数来帮助将事物连接起来，即一个绑定到根路径\
  \ \"/\" 的 Web 应用程序，并将使用\n\nweb.xml 文件的内容进行配置，这曾经是通过 XML 文件配置 Java Web 应用程序的通常方式。\n\
  \n让我们开始将依赖项放在 project.clj 文件中：\n\n```\n(defproject vaadin2 \"0.1.0-SNAPSHOT\"\n\
  \  :dependencies [\n    [org.clojure/clojure \"1.8.0\"]\n    [com.vaadin/vaadin-server\
  \ \"7.6.6\"]\n    [com.vaadin/vaadin-client-compiled \"7.6.6\"]\n    [com.vaadin/vaadin-themes\
  \ \"7.6.6\"]\n    [javax.servlet/javax.servlet-api \"3.1.0\"]]\n  :resource-paths\
  \ [\"example00\"]\n\n  :plugins [[lein-servlet \"0.4.1\"]]\n    :servlet {:deps\
  \ [[lein-servlet/adapter-jetty8 \"0.4.1\"]]\n              :config {:engine :jetty\
  \ :host \"localhost\"}\n              :webapps\n              {\"/\"\n         \
  \      {:public \"resources\"\n                :web-xml \"src/main/webapp/WEB-INF/web.xml\"\
  }}})\n```\n\n## Clojure/Vaadin 流程\n\n配置的最后一部分可能仍然有点晦涩，所以让我们分解这些步骤：\n\n- 1. Vaadin\
  \ 框架以通用的 Vaadin servlet 开始，它基本上是服务器端 Web 编程的 Java 请求处理器。\n- 2. 这个 Vaadin servlet\
  \ 需要一个参数才能启动，那就是调用扩展 com.vaadin.ui.UI Java 类。\n- 3. 该 Java 类有一个方法 init，它将接收一次性的请求参数和应用程序\
  \ UI 对象。\n- 4. 前面的 UI 类将负责编写或委托描述应用程序的所有 Java 代码。\n- 5. 最后，在本教程的上下文中，UI Java 类将使用在\
  \ Java 应用中插入 Clojure 脚本的通常方式，使处理动态化，并在每次请求时刷新。\n\n这在 Clojure 中意味着什么呢？你希望在这里有 Clojure\
  \ 代码实现 UI 类的 init 方法，其中该 init\n\n\n\nmethod 加载一个 Clojure 脚本，并执行给定的方法；这里，我们将调用命名空间\
  \ ex1，以及方法 main：\n\n```\n(ns vaadin2.vaadin2ui\n  (:gen-class\n    :name vaadin2.vaadin2ui\n\
  \    :extends com.vaadin.ui.UI))\n(defn -init\n  [main-ui request]\n  (clojure.lang.RT/loadResourceScript\
  \ \"ex1.clj\")\n  (.setContent\n    main-ui\n    (.invoke (clojure.lang.RT/var \"\
  ex1\" \"main\") main-ui)))\n```\n\n最后，你需要编写 ex1/main 函数，其中 main 函数设置主占位符的内容。\n\n\
  在这里，你可以随意使用 Vaadin 类；这就是开始的地方。一个应用程序通常需要一个布局，我们的第一个标签将说一些类似法语的 hello：\n\n```\n(ns\
  \ ex1\n  (:import [com.vaadin.ui VerticalLayout Label]))\n(defn main[ui]\n  (let\
  \ [\n    layout  (VerticalLayout.)\n    label   (Label. \"Bonjour le monde!\")]\n\
  \    (.addComponent layout label)))\n```\n\n所有元素都已就位；Leiningen servlet 插件会为你提供一个\
  \ servlet 子命令，包括一个用于启动服务器的 run 命令：\n\n```\nlein servlet run\n```\n\n在默认的开发模式下，该命令还会打开一个浏览器页面并显示正确的\
  \ URL，就这样，一些法语的 hello world！\n\n## 如何操作...\n\n在本节中，你将被介绍到新的小部件，并逐步学习如何使用 Vaadin\
  \ 事件与小部件进行交互。\n\n### 使用 Calendar 小部件\n\n使用 `Calendar` 小部件是通过标准的 Java 互操作完成的。Calendar\
  \ 的官方 Vaadin 文档可以在以下 URL 找到：https://vaadin.com/docs/-/part/framework/components/components-calendar.html。\n\
  \n将前一个链接中的示例翻译成 Clojure 得到：\n\n```\n(defn calendar []\n  (let[ cal (Calendar. \"\
  Today Calendar\")]\n    (doto cal\n      (.setWidth \"600px\")\n      (.setHeight\
  \ \"500px\")\n      (.setStartDate (Date.))\n      (.setEndDate (Date.)))))\n```\n\
  \n你可以使用第一部分中介绍的方法将 `Calendar` 挂载到应用程序中：\n\n```\n(defn main [app]\n  (let [layout\
  \  (VerticalLayout.)\n    calendar (calendar)]\n    (doto layout\n      (.addComponent\
  \ calendar))))\n```\n\n在 `project.clj` 文件中，对于每个示例，我们将更改 Clojure 资源路径；因此，例如，对于日历示例，添加以下内容：\n\
  \n```\n:resource-paths [\"example01-calendar\"]\n```\n\n这将使 `loadResourceScript`\
  \ 函数在正确的文件夹中查找文件。使用 `lein servlet run` 启动应用程序，然后：\n\n### Today Calendar\n\n### Sunday\
  \ 6/19/16\n\n- 1 AM\n- 2 AM\n- 3 AM\n- 4 AM\n- 5 AM\n- 6 AM\n- 7 AM\n- 8 AM\n- 9\
  \ AM\n- 10 AM\n- 11 AM\n- 12 PM\n- 1 PM\n- 2 PM\n- 3 PM\n- 4 PM\n- 5 PM\n- 6 PM\n\
  - 7 PM\n- 8 PM\n- 9 PM\n- 10 PM\n- 11 PM\n\n看起来你今天没什么可做的，所以让我们加点乐趣。你可能忘了那个生日聚会，所以现在让我们添加它：\n\
  \n```\n(def sample-event\n  (let [\n  start (GregorianCalendar.)\n  end (GregorianCalendar.)]\n\
  \  (.add end java.util.Calendar/HOUR 2)\n  (doto\n    (BasicEvent.\n      \"Birthday\
  \ Part7\"\n```\n\n```\n\"At Ren's place\"\n(.getTime start)\n(.getTime end)) )))\n\
  ```\n\n并且在日历方法中，你需要再添加一行来添加事件：\n\n```\n(defn calendar []\n  (let[ cal (Calendar.\
  \ \"Today Calendar\")] \n    (doto cal\n...\n      (.addEvent sample-event))))\n\
  ```\n\n刷新页面后事件会立即显示：\n\n![](img/d7b631352a782ee50160cf8eb995152f_516_0.png)\n\n\
  日历事件会响应 UI 的交互，例如拖放。\n\n### 响应事件\n\n使用 Vaadin 进行大量 UI 事件编程的方式是相似的，即实现事件监听器。当你移动日历事件时将被触发的\
  \ UI 事件是：\n\nCalendarEvent$EventChangeListener。\n\n你可以使用 `proxy` 或 `reify` 来实现接口：\n\
  \n```\n; using proxy\n(def event-change-fn\n  (proxy [CalendarEvent$EventChangeListener]\
  \ []\n    (eventChange [eventChangeEvent]\n      (println eventChangeEvent))))\n\
  ```\n\n```\n; using reify\n(def event-change-fn\n  (reify CalendarEvent$EventChangeListener\n\
  \    (eventChange [this eventChangeEvent]\n      (println eventChangeEvent))))\n\
  ```\n\n选择权在你，但不要忘记在日历构造函数中添加处理器：\n\n```\n( .addEventChangeListener event-change-fn\
  \ )\n```\n\n刷新页面后，拖动日历事件上下会触发处理器，并在命令行打印更新后事件的一些信息。\n\n这种使用 `proxy` 或 `reify` 的方式将在本食谱中广泛使用，所以在继续之前请确保多加练习以掌握它。这是一个非常重要的构建块，所以让我们再看一个按钮处理器的例子。\n\
  \n### 点击按钮\n\n点击按钮是关于实现 `ClickListener` 接口。让我们一起过一遍：\n\n```\n(defn main [ui]\n \
  \ (let [layout (VerticalLayout.)\n        first-name (TextField.)\n        submit-button\
  \ (Button. \"Submit\")]\n    (.addComponent layout (Label. \"First Name\"))\n  \
  \  (.addComponent layout first-name)\n    (.addComponent layout submit-button)\n\
  \    (.addListener submit-button\n```\n\n```\n(proxy [Button$ClickListener] []\n\
  \    (buttonClick [event]\n        (println (.getValue first-name))))\nlayout))\n\
  ```\n\n前面的片段向垂直布局添加了一个标签、一个字段和一个按钮。然后按钮会获得一个事件处理器来响应点击事件，因此在点击时将打印文本字段的值：\n\n![](img/d7b631352a782ee50160cf8eb995152f_518_0.png)\n\
  \n掌握了基础知识后，是时候开始稍微组织一下代码了；让我们看看如何将代码组织到不同的命名空间中，并在刷新后仍然看到更新。\n\n### 使用和重新加载命名空间\n\
  \n在这个示例中，你将看到如何将 Vaadin 相关代码分离到不同的命名空间中。假设你有一个基本的布局，其中包含一个标签和一个按钮：\n\n```\n(defn-\
  \ main-layout []\n    (doto (VerticalLayout.)\n        (.addComponent (Label. \"\
  Hello Clojure!\"))\n        (.addComponent (button \"Press me\" show-message))))\n\
  \n(defn main [ui]\n(main-layout))\n```\n\n你现在希望将与按钮相关的代码放在单独的文件中，\n\n```\nbuttons.clj:\n\
  \n(ns buttons\n  (:import [com.vaadin.ui\nButton\nButton$ClickListener\nNotification]))\n\
  \n(defn button-click-listener\n  [action]\n  (reify Button$ClickListener\n    (buttonClick\
  \ [_ evt] (action))))\n\n(defn listener [button action]\n  (.addListener button\
  \ (button-click-listener action)))\n\n(defn show-message []\n  (Notification/show\
  \ \"clicked\"))\n\n(defn button [caption action]\n  (doto (Button. caption) (listener\
  \ action)))\n```\n\n第一个文件将通过以下方式引用 buttons 命名空间：\n\n```\n(ns ex1\n  (:require [buttons\
  \ :as b])\n  (:import...))\n```\n\n加载服务器后，你可以看到应用程序和按钮显示：\n\n![](img/d7b631352a782ee50160cf8eb995152f_519_0.png)\n\
  \n并且通过调用\nNotification/show 出现了漂亮的 Vaadin 通知：\n\n![](img/d7b631352a782ee50160cf8eb995152f_520_0.png)\n\
  \n现在如果你尝试更改 buttons.clj 中的代码，并将显示 Vaadin 通知的函数更新为：\n\n```\n(defn show-message []\n\
  \  (Notification/show \"clicked again!\"))\n```\n\n刷新页面并再次点击按钮可惜仍然显示之前的消息。事实上，命名空间的代码似乎没有在运行的容器中更新。\n\
  \n为了恢复更友好的开发工作流程，你可以在命名空间 require 指令中使用 reload-all 指令，如下所示：\n\n```\n(:require :reload-all\
  \ [buttons :as b])\n```\n\n现在刷新页面将获得原始的重新加载行为，就像所有内容都在一个文件中一样。\n\n### 服务器端推送\n\n\
  到目前为止，你一直在处理的 UI 是直接用 Vaadin 代码编写的，或者是通过用户交互和\n响应式代码与监听器进行更新。要异步发送消息，而不响应用户交互，你将使用一种名为服务器端推送的东西。服务器端推送要求你做以下几件事：\n\
  \n- 设置一个额外的特定 Vaadin 库\n- 设置应用程序以支持推送，并启动推送 WebSocket 框架\n- 添加一些异步 UI 更新代码\n\n让我们通过查看如何在应用程序启动后几秒钟向客户端发送消息的示例来了解。\n\
  \n首先，额外的库不出所料，名为 vaadin-push 并进入你的 project.clj 文件：\n\n```\n[com.vaadin/vaadin-push\
  \ \"7.6.6\"]\n```\n\n其次，应用程序中 Clojure 代码的第一行将设置推送机制：\n\n```\n( .setPushMode\n  (.getPushConfiguration\
  \ ui)\n  (com.vaadin.shared.communication.PushMode/AUTOMATIC))\n```\n\n这有点晦涩，但基本上这只是将推送机制设置为启动。第三，或者实际上在第三之前，让我们尝试编写一个异步\
  \ UI 更新：\n\n```\n(defn runme []\n  (reify Runnable\n    (run [_]\n      (Thread/sleep\
  \ 3000)\n      ; (Notification/show \"Does not work\"))))\n    (-> (UI/getCurrent)\
  \ (.access async-ui-update))))\n```\n\n```\n(defn main[ui]\n  (.setPushMode\n  \
  \  (.getPushConfiguration ui)\n    (com.vaadin.shared.communication.PushMode/AUTOMATIC))\n\
  ```\n\n\n\n\n```\n(let [layout (VerticalLayout.)]\n    (.addComponent layout (Label.\
  \ \"I am getting sleepy ~~~\"))\n    (.start (Thread. (runme)))\n    layout\n)\n\
  ```\n\n代码通过执行简单的布局、启动线程，并在 3 秒后显示通知来读取。自己运行代码... 你会很快注意到... 线程启动，等待 3 秒，然后... 什么也没做。仔细阅读后，它不起作用。问题出在哪里？\n\
  \n视觉更新缺乏的原因是已创建的线程不再是 UI 线程，因此刷新无法链接到现有 UI 对象，更新失败。\n\n要执行异步更新，我们将实现一个新的 Runnable，并要求\
  \ UI 线程执行异步更新。这是通过 UI/getCurrent 获取 UI 线程，并使用 .access 执行异步更新来完成的。\n\n因此，经过这些小的更新后，你现在有了以下代码：\n\
  \n```\n(def async-ui-update\n    (reify Runnable\n      (run [_]\n        (Notification/show\
  \ \"Let's sleep\"))))\n\n(defn runme []\n    (reify Runnable\n      (run [_]\n \
  \       (Thread/sleep 3000)\n        ; (Notification/show \"Does not work\"))))\n\
  \    (-> (UI/getCurrent) (.access async-ui-update))))\n```\n\n最后，通知显示如下：\n\n![](img/d7b631352a782ee50160cf8eb995152f_523_0.png)\n\
  \n## 还有更多...\n\n砖块已铺好，可以用 Vaadin 做一些响应式编程。让我们看一些案例。\n\n## Reactive Vaadin - 思路\n\
  \n我们将在此处添加一个标准的 Clojure atom 作为响应点，再加上一个监听该 atom 以执行异步 UI 更新的监听器。\n\n此示例添加了一个响应式文本字段，当其值被更新时会显示通知：\n\
  \n```\n(def last-value\n  (atom \"\"))\n\n(defn runme [msg]\n  (let [async-ui-update\n\
  \        (proxy [Runnable] [] (run [] (Notification/show msg)))]\n    (-> (UI/getCurrent)\
  \ (.access async-ui-update))))\n```\n\n```\n(defn my-layout [layout]\n  (.addComponent\
  \ layout (Label. \"Write something\"))\n\n  (let [first-name (TextField.)]\n   \
  \ (.addComponent layout first-name)\n\n    (.addValueChangeListener first-name\n\
  \      (proxy [Property$ValueChangeListener] []\n        (valueChange [event]\n\
  \          (dosync (reset! last-value\n            (-> event (.getSource) (.getValue))))))))\n\
  \n(defn main [ui]\n  (.setPushMode\n    (.getPushConfiguration ui)\n    (com.vaadin.shared.communication.PushMode/AUTOMATIC))\n\
  \  (let [base (VerticalLayout.)]\n    (my-layout base)\n\n    (add-watch last-value\
  \ :listener\n      (fn [key atom old-state new-state]\n        (runme new-state)))\n\
  \  base))\n```\n\n你已经看到了异步 UI 更新机制。这里，将被监听的新事件是 Property$ValueChangeListener，当文本字段在用户输入后获得不同值时触发。atom\
  \ 然后将保存文本字段的最后和当前值。最后，atom 上的监听器将在 atom 值被更新时触发异步 UI 更新：\n\n![](img/d7b631352a782ee50160cf8eb995152f_525_0.png)\n\
  \n## Reactive Vaadin - CPU 监控\n\nVaadin 的一个明显优势是，你编写服务器端代码，其中一部分会被翻译到浏览器端。\n\n因此，我们可以监控\
  \ Raspberry Pi 的 CPU 使用率并显示其 CPU 使用情况。我们将使用一个方便的调度库 hara.ui 来实现服务器端的 CPU 轮询，然后重用\
  \ atom + atom 监听器的技术在客户端显示更新。\n\n要在项目中添加 hara.io，让我们在 project.clj 中添加一行：\n\n```\n\
  [im.chit/hara.io.scheduler \"2.3.6\"]\n```\n\n然后扩展示例代码：\n\n```\n(ns ex1\n  (:use\
  \ [clojure.java.shell :only [sh]])\n  (:use [hara.io.scheduler]))\n```\n\n```\n\
  ...)\n\n(def last-value\n  (atom \"\"))\n\n(defn collect-cpu-fn[t params]\n  (let\
  \ [\n    ; linux\n    command \"grep 'cpu ' /proc/stat | awk '{usage=($2+$4)*100/($2+$4+$5)}\
  \ END {print usage \\\"%\\\"}'\"\n    ; macos\n    ; command \"top -l 1 | head -n\
  \ 10 | grep CPU | awk '{print $2}'\"\n    cpu (:out (sh \"bash\" \"-c\" command))]\n\
  \    (dosync (reset! last-value cpu))))\n\n(def cpu-task\n  {:handler collect-cpu-fn\n\
  \   :schedule \"/3 * * * * * *\"\n   :params {}})\n\n(def sch1 (scheduler {:print-task\
  \ cpu-task}))\n(start! sch1)\n```\n\natom 值将每 3 秒更新一次，使用最新的轮询 CPU 使用率值。监控原始 CPU\
  \ 使用率的命令在不同平台上略有不同；不幸的是，这几乎无法从 Java 访问。幸运的是，我们可以退回到 shell 来获取我们想要的信息。\n\n以下是应用程序在\
  \ Raspberry Pi 上运行的屏幕截图：\n\n![](img/d7b631352a782ee50160cf8eb995152f_527_0.png)\n\
  \n最后，Vaadin 应用程序是从访问 Raspberry Pi 的本地浏览器访问的。\n\n安全提示：无。\n\n## Reactive Vaadin -\
  \ Raspberry Pi 上的 Telegram\n\n本食谱的最后一个示例将 Telegram 机器人带到你的本地 Raspberry Pi。\n\n库\
  \ morse，一个 Telegram API 的包装器，用于注册通过你注册的机器人传来的事件，这意味着基于 Vaadin 的应用程序将在 Raspberry\
  \ Pi 上运行，并会监听由 morse 轮询引擎捕获的机器人消息。\n\n在你的 project.clj 中，添加以下行：\n\n```\n[morse \"\
  0.1.1\"]\n```\n\n然后 Vaadin/Clojure 代码基本上与我们迄今为止看到的相同，当向机器人发送新消息时更新 Clojure atom：\n\
  \n```\n(ns ex1\n```\n\n```\n(:use [clojure.java.shell :only [sh]])\n(:require [morse.polling\
  \ :as p])\n(:require [morse.handlers :refer :all])\n...)\n\n(def token \"<your bot\
  \ token here ...>\")\n\n(def last-value\n  (atom \"\"))\n\n; telegram bot handler:\
  \ update the atom when a message is received\n(defhandler bot-api\n  (message\n\
  \    message\n    (dosync (reset! last-value (:text message)))))\n\n; for this example,\
  \ simply start a polling method to get events\n(def channel\n  (p/start token bot-api))\n\
  ...\n```\n\n从那里，发送给机器人的消息将被 Raspberry Pi 接收并显示在连接到 Vaadin 应用程序的浏览器上：\n\n![](img/d7b631352a782ee50160cf8eb995152f_529_0.png)\n\
  \n显然，事情并不止于此，本食谱应该激发了你的想象力并让你想要更多。这很好！\n\n## 部署奖励\n\n`lein servlet` 插件增加了额外的奖励，允许创建\
  \ Web Java 归档，即 WAR 文件。命令有两种模式：\n\n```\nlein servlet war\nlein servlet uberwar\n\
  ```\n\n第一个版本只会包含与你的应用程序直接相关的代码，而第二个版本还会包含所有依赖项，具体取决于你的部署策略。显然，第二个 `uberwar` 更容易但占用更多磁盘空间，而第一个\
  \ `war` 需要一些思考。\n\n无论哪种方式，都允许你随意部署到 Java Web 服务器，如果要求在 Java 环境中运行，这也是覆盖你的 Clojure\
  \ 使用的一种不错方式！\n\n## 快速使用 Liberator 创建 REST API\n\nLiberator 是一个用于开发 REST Web 服务资源的\
  \ Clojure 库。REST 是 Representational State Transfer 的缩写，它是一种设计 Web 网络应用程序的架构风格。\n\
  \nLiberator 受到了 Erlang 的 Webmachine 的启发。Webmachine 由 Justin Sheehy 开发，他是 Basho Technologies\
  \ 的 CTO，开发了 Riak。Webmachine 是一个用于编写行为良好的 HTTP 应用程序的 RESTful 工具包，帮助开发人员处理基于 HTTP\
  \ 的应用程序的复杂性。\n\n同样，使用 Liberator 使 Web API 开发变得更简单，但提供了 HTTP 丰富的特性，如内容协商和缓存。\n\n\
  ## 准备就绪\n\n在学习 Liberator 之前，我们将创建一个名为 liberator-example 的新项目。为此，使用 lein new 创建一个新的\
  \ Clojure 项目：\n\n```\n$ lein new liberator-example\n```\n\n然后，我们将修改生成的 project.clj\
  \ 以使用 Liberator。除了 Liberator 库之外，我们还需要 ring 和 compojure 库。我们还需要 clj-http 和 cheshire\
  \ 用于 HTTP 客户端以进行 REST API 调用：\n\n```\n:dependencies [[org.clojure/clojure \"1.8.0\"\
  ]\n                [liberator \"0.14.1\"]\n                [compojure \"1.3.4\"\
  ]\n                [ring \"1.5.0-RC1\"]\n                [ring/ring-core \"1.5.0-RC1\"\
  ]\n                [buddy \"0.13.0\"]\n                [ring/ring-jetty-adapter\
  \ \"1.4.0\"]\n                [clj-http \"2.2.0\"]]\n```\n\n\n\n[cheshire \"5.6.1\"\
  ]\n\nRing 服务器提供了一个简单的 Web 服务器，使测试变得更容易。我们将在 project.clj 中按如下方式添加一个 ring 插件：\n\n\
  ```\n:ring {:handler liberator-example.example/handler}\n:plugins [[lein-ring \"\
  0.9.7\"]]\n```\n\n## How to do it...\n\n是时候尝试 Liberator 了。这里，我们将学习如何使用 Liberator\
  \ 实现 GET、POST、PUT 和 DELETE。但让我们先使用 Liberator 创建一个简单的 hello Clojure 服务器！\n\n## Your\
  \ first Liberator\n\n首先，我们将声明所需的库。我们还将使用 ring 服务器和 Compojure。Ring 服务器是用 Clojure\
  \ 编写的著名 Web 服务器。Compojure 是一个用于将 Web 请求分派到目标资源的路由器。\n\nclj.http 和 cheshire.core\
  \ 使客户端能够向 Liberator 提供的 REST API 服务发出请求：\n\n```\n(ns liberator-example.example\n\
  \  (:require\n    [liberator.core :refer [resource defresource]]\n    [ring.adapter.jetty\
  \ :refer [run-jetty]]\n    [ring.middleware.params :refer [wrap-params]]\n    [compojure.core\
  \ :refer\n      [defroutes ANY GET PUT POST DELETE OPTIONS]]\n    [clj-http.client\
  \ :as client]\n    [cheshire.core :refer [parse-string generate-string]]))\n;;=>\
  \ nil\n```\n\n以下代码为客户端生成静态 HTML 内容：\n\n```\n(defroutes app\n  (ANY \"/hello\" []\n\
  \    (resource :available-media-types [\"text/html\"]\n              :handle-ok\
  \ \"<html><h1>Hello Clojure !</h1></html>\"))\n  (route/not-found \"Not Found !\"\
  ))\n;;=> #'liberator-example.example/app\n```\n\n在之前的代码中，我们使用 compojure.core/defroutes\
  \ 定义了 /hello 上下文，而 liberator.core/resource 定义了一个资源。\n\n然后，让我们定义一个处理器并运行它。ring.middleware.params/wrap-params\
  \ 解析请求的查询字符串和表单主体：\n\n```\n(def handler\n  (-> app\n      wrap-params))\n;;=> #'liberator-example.example/handler\n\
  ```\n\n然后，启动服务器并从浏览器发出请求：\n\n```\n(def server (run-jetty handler {:port 3000 :join?\
  \ false}))\n;;=> #'liberator-example.example/server\n```\n\n使用 http://localhost:3000/hello\
  \ 打开浏览器。你将在浏览器中看到以下字符串：\n\n![](img/d7b631352a782ee50160cf8eb995152f_532_0.png)\n\
  \n要从命令行发出请求，请使用 curl 命令：\n\n```\n$ curl -X GET http://localhost:3000/hello\n```\n\
  \n下一张图片展示了 curl 命令的工作方式：\n\n![](img/d7b631352a782ee50160cf8eb995152f_533_0.png)\n\
  \n如果测试成功，让我们停止服务器以进行食谱中的后续主题：\n\n```\n(.stop server)\n;;=> nil\n```\n\n## Using\
  \ defresource\n\n这里，我们将使用 defresource 宏来定义资源：\n\n```\n(defresource hello :available-media-types\
  \ [\"text/html\"]\n  :handle-ok \"<html><h1>Hello Clojure from defresource\n!</h1></html>\"\
  )\n;;=> #'liberator-example.example/hello\n```\n\n使用 defresource，你可以按如下方式使用任何路由重用资源：\n\
  \n```\n(defroutes app\n  (ANY \"/hello\" [] hello)\n  (route/not-found \"Not Found\
  \ !\"))\n;;=> #'liberator-example.example/app\n```\n\n让我们按如下方式定义一个处理器并启动服务器：\n\n\
  ```\n(def handler\n  (-> app\n      wrap-params))\n;;=> #'liberator-example.example/handler\n\
  (def server (run-jetty handler {:port 3000 :join? false}))\n;;=> #'liberator-example.example/server\n\
  ```\n\n你将看到与第一个 Liberator 示例类似的结果。在完成对 defresource 的测试后，让我们停止服务器：\n\n```\n(.stop\
  \ server)\n;;=> nil\n```\n\n## Parameterized resources\n\n我们将学习如何定义带参数的 REST API。因此，让我们按如下方式定义一个具有参数\
  \ x 的 parameterized-hello 资源：\n\n```\n(defresource parameterized-hello [x]\n  :available-media-types\
  \ [\"text/html\"]\n  :handle-ok (format \"<html><h1>Hello Clojure from %s !</h1>\n\
  </html>\" x)\n)\n;;=> #'liberator-example.example/parameterized-hello\n```\n\n前面的示例使我们能够将任意字符串设置为\
  \ HTML 内容。\n\ndefroutes 也有参数 x 并传递给 parameterized-hello：\n\n```\n(defroutes parameterized-hello-app\n\
  \  (ANY \"/hello/:x\" [x] (parameterized-hello x))\n  (route/not-found \"Not Found\
  \ !\"))\n;;=> #'liberator-example.example/parameterized-hello-app\n```\n\n定义你的处理器并启动服务器：\n\
  \n```\n(def handler\n  (-> parameterized-hello-app\n      wrap-params))\n;;=> #'liberator-example.example/handler\n\
  (def server (run-jetty handler {:port 3000 :join? false}))\n;;=> #'liberator-example.example/server\n\
  ```\n\n现在，使用以下 URL 打开浏览器：\n\n```\nhttp://localhost:3000/hello/your-name:\n```\n\n\
  ![](img/d7b631352a782ee50160cf8eb995152f_535_0.png)\n\n```\n(.stop server)\n;;=>\
  \ nil\n```\n\n## Defining GET/POST/PUT/DELETE methods for REST APIs\n\n这里，我们将为资源定义\
  \ HTTP 方法。我们将为客户定义一个资源，并在以下表格中为其定义五种方法：\n\n| Method | Action | Parameter | URL |\n\
  | GET | Returns a list of customers | --- | http://localhost:3000/customer |\n|\
  \ POST | Creates a new customer | --- | http://localhost:3000/customer |\n| GET\
  \ | Gets a customer | Customer ID | http://localhost:3000/customer/id |\n| PUT |\
  \ Updates a customer | Customer ID | http://localhost:3000/customer/id |\n| DELETE\
  \ | Deletes a customer | Customer ID | http://localhost:3000/customer/id |\n\n因此，让我们定义一个客户的\
  \ ref，其属性为 name 和 country：\n\n```\n(def customer-ref\n  (ref\n    {:makoto {:name\
  \ \"Makoto Hashimoto\" :country \"Japan\"}\n     :nico {:name \"Nicolas Modrzyk\"\
  \ :country \"France\"}}))\n;;=> #'liberator-example.example/customer-ref\n```\n\n\
  资源 customer-list 没有参数。我们将定义 GET 和 POST 方法：\n\n```\n(defresource customer-list\n\
  \  :allowed-methods [:get :post]\n  :available-media-types [\"application/json\"\
  ]\n  :exists? (fn [_]\n            (let [result @customer-ref]\n              (if-not\
  \ (nil? result)\n                {::entry result})))\n  :post! (fn [ctx]\n     \
  \      (let [body (parse-string (slurp (get-in ctx [:request :body])) true)]\n \
  \            (dosync\n               (alter customer-ref assoc (keyword (:id body))\n\
  \                 (dissoc body :id)))))\n  :handle-ok ::entry\n  :handle-not-found\
  \ {:error \"id is not found\"})\n;;=> #'liberator-example.example/customer-list\n\
  ```\n\nget 方法返回 customer-ref 的值。get 的回复由 :exists? 条目的匿名函数处理，如果 customer-ref 的值不为\
  \ nil，则返回一个带有 ::entry 键的映射。在这种情况下，:handle-ok? 的条目被应用并返回结果，状态代码为 200。否则，:handle-not-found\
  \ 的函数被应用并返回 404 状态代码。\n\npost 请求由与 :post? 关联的函数处理，该函数将 post 的主体添加到 customer-ref。post\
  \ 请求的请求主体的格式如下：\n\n```\n{\"id\":\"some-id\",\"name\":\"some-name\",\"country\":\"\
  country-name\"}\n```\n\n下一个名为 customer-entity 的资源用于参数化请求。此资源具有 GET、PUT 和 DELETE\
  \ 方法：\n\n```\n(defresource customer-entity [id]\n  :allowed-methods [:get :put :delete]\n\
  \  :available-media-types [\"application/json\"]\n  :exists? (fn [_]\n         \
  \   (let [result (get @customer-ref (keyword id))]\n              (if-not (nil?\
  \ result)\n                {::entry result})))\n```\n\n```\n:put!  (fn [ctx]\n \
  \   (let [body (parse-string (slurp (get-in ctx [:request :body])) ) true)]\n  \
  \    (dosync\n        (alter customer-ref assoc (keyword id) (dissoc body :id)))))\n\
  :delete!  (fn [_]\n    (dosync\n      (alter customer-ref dissoc (keyword id))))\n\
  :existed? (fn [_] (nil? (get @customer-ref id ::sentinel)))\n:new? (fn [_] (nil?\
  \ (get @customer-ref id ::sentinel)))\n:handle-ok ::entry\n:handle-not-found {:error\
  \ \"id is not found\"}\n;;=> #'liberator-example.example/customer-entity\n```\n\n\
  然后，让我们使用 defroutes 按如下方式为 /customer 和 /customer/id 定义路径：\n\n```\n(defroutes customer\n\
  \  (ANY \"/customer\" [] customer-list)\n  (ANY \"/customer/:id\" [id] (customer-entity\
  \ id)))\n;;=> #'liberator-example.example/app\n```\n\n我们将定义一个处理器并启动 Jetty 服务器：\n\
  \n```\n(def handler\n  (-> customer\n      wrap-params))\n;;=> #'liberator-example.example/handler\n\
  (def server (run-jetty handler {:port 3000 :join? false}))\n;;=> #'liberator-example.example/server\n\
  ```\n\n这里，我们将使用基于 Clojure 的 HTTP 客户端来测试客户 REST 服务。clj-http.client 对 GET、POST、PUT\
  \ 和 DELETE 发出调用。\n\n使用 http://localhost:3000/customer 的 get 方法检索 customer-ref 中的所有客户：\n\
  \n```\n(client/get \"http://localhost:3000/customer\")\n;;=> {:status 200, :headers\
  \ {\"Date\" \"Sun, 26 Jun 2016 20:14:34 GMT\",\n;;=> \"Content-Type\" \"application/json;charset=UTF-8\"\
  , \"Vary\" \"Accept\",\n\n\n```\n; ;=> \"Connection\" \"close\", \"Server\" \"Jetty(9.2.10.v20150310)\"\
  },\n; ;=> :body \"{\\\"makoto\\\":{\\\"name\\\":\\\"Makoto Hashimoto\\\",\\\"country\\\
  \":\\\"Japan\\\"},\n; ;=> \\\"nico\\\":{\\\"name\\\":\\\"Nicolas Modrzyk\\\",\\\"\
  country\\\":\\\"France\\\"}}\\\n```\n\n然后，我们将测试 POST：\n\n```\n(client/post \"http://localhost:3000/customer\"\
  \n        {:body (generate-string {:id \"rh\" :name \"Rich Hickey\" :country \"\
  United States\"})})\n; ;=> {:status 201, :headers {\"Date\" \"Sun, 26 Jun 2016 14:33:28\
  \ GMT\",\n; ;=> \"Content-Type\" \"application/json\", \"Vary\" \"Accept\",\n\"\
  Connection\" \"close\",\n; ;=> \"Server\" \"Jetty(9.2.10.v20150310)\"}, :body \"\
  \", :request-time 8,\n; ;=> :trace-redirects [\"http://localhost:3000/customer\"\
  ],\n:orig-content-encoding nil}\n```\n\n让我们检查之前的条目是否存在。我们只需要响应的 body：\n\n```\n(->\n\
  \  (client/get \"http://localhost:3000/customer/rh\" )  :body\n  (parse-string true))\n\
  ; ;=> {:name \"Rich Hickey\", :country \"United States\"}\n```\n\n我们将检查 PUT 方法是否有效：\n\
  \n```\n(client/put \"http://localhost:3000/customer/rh\"\n        {:body (generate-string\
  \ {:name \"Rich Hickey\" :country \"USA\"})})\n; ;=> {:status 204, :headers {\"\
  Date\" \"Sun, 26 Jun 2016 22:04:35 GMT\",\n; ;=> \"Content-Type\" \"application/json\"\
  , \"Vary\" \"Accept\",\n\"Connection\" \"close\",\n; ;=> \"Server\" \"Jetty(9.2.10.v20150310)\"\
  }, :body nil, :request-time 9,\n; ;=> :trace-redirects [\"http://localhost:3000/customer/rh\"\
  ],\n:orig-content-encoding nil}\n```\n\n因此，让我们验证更新是否成功：\n\n```\n(->\n  (client/get\
  \ \"http://localhost:3000/customer/rh\")\n    :body\n      (parse-string true))\n\
  ;;=> {:name \"Rich Hickey\", :country \"USA\"}\n```\n\n最后，我们将测试 DELETE 方法：\n\n```\n\
  (client/delete \"http://localhost:3000/customer/rh\")\n;;=> {:status 204, :headers\
  \ {\"Date\" \"Sun, 26 Jun 2016 14:38:58 GMT\",\n;;=> \"Content-Type\" \"application/json\"\
  , \"Vary\" \"Accept\",\n\"Connection\" \"close\",\n;;=> \"Server\" \"Jetty(9.2.10.v20150310)\"\
  }, :body nil, :request-time 8,\n;;=> :trace-redirects [\"http://localhost:3000/customer/rh\"\
  ],\n:orig-content-encoding nil}\n(.stop server)\n;;=> nil\n```\n\n## 它是如何工作的...\n\
  \n在这里，我们将回顾主要的 HTTP 响应代码，然后学习如何使用 Liberator 调试和追踪应用程序。\n\n## HTTP 的方法和状态码\n\n下表显示了主要的方法，以及它们在\
  \ Liberator 中的描述和操作：\n\n| 方法 | 描述 |  |\n|---|---|---|\n| GET | 对资源的只读访问 | exists?\
  \ |\n| PUT | 创建新资源 | put! |\n| DELETE | 用于删除资源 | delete! |\n| POST | 更新现有资源或创建新资源\
  \ | post! |\n| PATCH | 与 PUT 类似但只发送差异 | patch! |\n\n主要的 HTTP 状态码如下：\n\n| 处理键 | 状态码\
  \ |\n|---|---|\n| handle-ok | 200 |\n| handle-created | 201 |\n| handle-no-content\
  \ | 204 |\n| handle-moved-permanently | 301 |\n| handle-malformed | 400 |\n| handle-unauthorized\
  \ | 401 |\n| handle-forbidden | 403 |\n| handle-not-found | 404 |\n| handle-method-not-allowed\
  \ | 405 |\n| handle-not-acceptable | 406 |\n| handle-exception | 500 |\n| handle-not-implemented\
  \ | 501 |\n| handle-unknown-method | 501 |\n| handle-service-not-available | 503\
  \ |\n\n## 追踪请求\n\nLiberator 具有追踪和调试功能。在下面的代码中，我们将使用 liberator.dev/wrap-trace 重新定义一个处理器，以显示追踪文本和追踪图：\n\
  \n```\n(def handler\n  (-> customer\n    wrap-params\n    (wrap-trace :header :ui)))\n\
  ```\n\n```\n; ;=> #'liberator-example.example/handler\n```\n\n让我们再次启动服务器：\n\n```\n\
  (def server (run-jetty handler {:port 3000 :join? false}))\n; ;=> #'liberator-example.example/server\n\
  ```\n\n现在让我们发起一次调用并查看 X-Liberator-Trace 头中的决策追踪，如下所示：\n\n```\n(client/get \"http://localhost:3000/customer\"\
