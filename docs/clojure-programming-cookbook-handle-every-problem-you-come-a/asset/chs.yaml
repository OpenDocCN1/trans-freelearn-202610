  \ 和 Scala。我们将使用 Leiningen 配置一个混合项目。\n\n# 准备工作\n\n我们通过 `lein new clojure-scala` 创建一个项目，并按如下方式配置\
  \ `project.clj`：\n\n```\n(defproject clojure-scala \"0.1.0-SNAPSHOT\"\n  :description\
  \ \"FIXME: write description\"\n  :url \"http://example.com/FIXME\"\n  :license\
  \ {:name \"Eclipse Public License\"\n            :url \"http://www.eclipse.org/legal/epl-v10.html\"\
  }\n  :dependencies [[org.clojure/clojure \"1.8.0\"]\n                 [org.scala-lang/scala-library\
  \ \"2.11.7\"]]\n  :plugins [[io.tomw/lein-scala \"0.1.2\"]]\n  :scala-source-path\
  \ \"src/scala\"\n  :scala-version \"2.11.7\"\n  :prep-tasks [\"scalac\"]\n  :main\
  \ clojure-scala.core\n)\n```\n\n修改 `project.clj` 后，启动 REPL。\n\n# 如何操作...\n\n我们将解释\
  \ Clojure 代码如何调用 Scala 方法以及如何访问 Scala 中定义字段。我们将使用 Leiningen 和 Scala 插件。这假设使用 Leiningen\
  \ 的 Clojure 项目会使用现有的 Scala 库，如 Kafka 和 Spark。\n\n# 使用 Leiningen 开发 Scala 和 Clojure\n\
  \n在 `src/scala` 目录下创建 `Main.scala`：\n\n```\npackage chapter05\nobject Main {\n \
  \ def hello(txt: String) = {\n    \"hello from Scala: \" + txt + \" !\"\n\n}\n}\n\
  class Calculation {\n  def factorial(n: BigInt): BigInt = {\n    if (n <= 1) 1 \
  \ else  n * factorial(n - 1)\n  }\n  def add(a:Int, b:Int):Int = a + b\n}\n```\n\
  \n```\nclass MyTuple {\n  def tuple(x:Int, y:Int) = (x,y)\n}\n```\n\n要编译 Scala 源代码，请执行以下操作：\n\
  \n```\n$ lein scalac\n```\n\n![](img/d7b631352a782ee50160cf8eb995152f_319_0.png)\n\
  \n修改并编译 Scala 源代码后，我们需要重新启动 REPL 以便从 Clojure 进行测试。\n\n# 导入 Scala 类\n\n然后我们将从 Clojure\
  \ 的 REPL 测试 Scala 代码。以下代码导入 Scala 类：\n\n```\n(ns clojure-scala.core)\n;;=> nil\n\
  ```\n\n# 调用实例方法\n\n让我们从 Scala 调用实例方法开始。这与调用 Java 的实例方法相同：\n\n```\n(import 'chapter05.Calculation)\n\
  ;;=> chapter05.Calculation\n(.add calc 10 2)\n;;=> 12\n```\n\n```\n(import 'scala.math.BigInt)\n\
  ;;=> scala.math.BigInt\n(import 'java.math.BigInteger)\n;;=> java.math.BigInteger\n\
  (.factorial calc (BigInt. (BigInteger. \"25\")))\n;;=> 15511210043330985984000000\n\
  ```\n\n调用 factorial 有点复杂。代码将其转换为 Scala 的 scala.math.BigInt。\n\n# 调用单例方法\n\n调用 Scala\
  \ 的单例方法与调用 Java 的静态方法相同：\n\n```\n(import 'chapter05.Main)\n;;=> chapter05.Main\n\
  (Main/hello \"Makoto\")\n;;=> \"hello from Scala: Makoto !\"\n(import 'chapter05.MyTuple)\n\
  ;;=> chapter05.MyTuple\n(def tuple1 (MyTuple/tuple 1 5))\n;;=> #'clojure-scala.core/tuple1\n\
  ```\n\n# 访问元组\n\n要访问元组，请使用 _1、_2 等：\n\n```\n(. _1 tuple1)\n;;=> 1\n(. _2 tuple1)\n\
  ;;=> 5\n```\n\n# 访问 Scala 字段\n\n让我们从 Clojure 访问 Scala 字段。在 Scala 中，声明字段会自动生成访问器方法，但方法名称与\
  \ Java 不同：\n\n```\npackage chapter05\nimport scala.beans.BeanProperty\n\nclass Student\
  \ {\n  var name = new String(\"\")\n  var address = new String(\"\")\n}\n\nclass\
  \ Person {\n    @BeanProperty var name : String = _\n    @BeanProperty var address\
  \ : String = _\n}\n```\n\n要为 Java 生成 getter/setter 方法，请在前面的代码中使用 BeanProperty 注解。以下代码展示了如何从\
  \ Clojure 访问 Scala 字段。要访问 Scala 类的默认字段，请分别使用 .field_name 和 .fieldname$eq 作为 getter\
  \ 和 setter：\n\n```\n(import 'chapter05.Person)\n;;=> chapter05.Person\n(import 'chapter05.Student)\n\
  ;;=> chapter05.Student\n(def s (Student.))\n;;=> #'clojure-scala.core/s\n(.name_$eq\
  \ s \"Nico\")\n;;=> nil\n(.name s)\n;;=> \"Nico\"\n(def p (Person.))\n;;=> #'clojure-scala.core/person\n\
  (.setName p \"Makoto\")\n;;=> nil\n(.getName p)\n;;=> \"Makoto\"\n(.address_$eq\
  \ p \"Japan\")\n;;=> nil\n(.address p)\n;;=> \"Japan\"\n```\n\n# 它是如何工作的...\n\n\
  在 project.clj 中，我们按如下方式添加了 Scala 库：\n\n```\n:dependencies [[org.clojure/clojure\
  \ \"1.8.0\"]\n                [org.scala-lang/scala-library \"2.11.7\"]]\n```\n\n\
  以下插件使 lein-scalac 能够编译 Scala 源代码：\n\n```\n:plugins [[io.tomw/lein-scala \"0.1.2\"\
  ]]\n```\n\n我们分别通过 :scala-source-path 和 :scala-version 指定了 Scala 源路径和 Scala 版本：\n\
  \n```\n:scala-source-path \"src/scala\"\n:scala-version \"2.11.7\"\n```\n\n我们使用\
  \ :prep-tasks 在编译 Clojure 代码之前预先编译 Scala 源代码：\n\n```\n:prep-tasks [\"scalac\"]\n\
  ```\n\n# 还有更多...\n\nSBT 是 Scala 的事实标准构建工具，许多 Scala 项目使用 SBT。我们使用 Scala DSL 来描述 SBT\
  \ 的项目配置。在这里，我们将学习如何在 SBT 项目中让 Scala 调用 Clojure。我们将使用 SBT 的 Clojure 插件。在本示例中，我们将学习如何使用\
  \ SBT 为使用 Scala 和 Clojure 语言的混合项目。\n\n# 使用 SBT\n\n我们将演示如何创建基于 SBT 的项目。在示例中，Scala\
  \ 代码调用 Clojure 定义的方法。那就开始吧！\n\n# 创建基于 SBT 的项目\n\n让我们先创建一个 SBT 项目：\n\n```\n$ mkdir\
  \ sbt-scala-clojure\n$ cd sbt-scala-clojure\n$ mkdir project\n```\n\n按如下方式创建 build.sbt：\n\
  \n```\nseq(clojure.settings :_*)\nlibraryDependencies += \"org.clojure\" % \"clojure\"\
  \ % \"1.8.0\"\n```\n\nproject/plugins.sbt 指定了 sbt-clojure 插件：\n\n\n\n// Comment\
  \ to get more information during initialization\n//logLevel := Level.Debug\nlogLevel\
  \ := Level.Info\n//lazy val root =\nproject.in(file(\".\")).dependsOn(clojurePlugin)\n\
  \n//lazy val clojurePlugin = file(\"../../sbt-clojure\")\naddSbtPlugin(\"com.unhandlederexpression\"\
  \ % \"sbt-clojure\" % \"0.1\")\n\n## 编写源代码\n\n我们将在 src/main/clojure 下创建 Clojure\
  \ 源代码：\n\n```\n(ns helloworld)\n(gen-class\n  :name cljbook.chapter05.HelloWorld\n\
  \  :methods [#^{:static true} [sayHello [] void]])\n(defn -sayHello []\n  (println\
  \ \"Hello world from Clojure!\"))\n(gen-class\n  :name cljbook.chapter05.Calculator\n\
  \  :methods\n  [#^{:static false} [add [long long] long]\n   #^{:static false} [sub\
  \ [long long] long]])\n(defn -add [this a b]\n  (+ a b))\n(defn -sub [this a b]\n\
  \  (- a b))\n```\n\n前面的 Clojure 代码有两个类：\ncljbook.chapter05.HelloWorld 和 cljbook.chapter05.Calculator。\n\
  然后，我们将查看 Scala 代码。以下是调用 Clojure 中定义的类的 Scala 代码：\n\n```\nimport cljbook.chapter05.HelloWorld\n\
  import cljbook.chapter05.Calculator\nobject Main {\n  def main(args: Array[String])\
  \ = {\n    println(\"I'm calling methods defined by Clojure from Scala.\")\n   \
  \ HelloWorld.sayHello();\n    val calc = new Calculator\n    println(\"add: \"+calc.add(1,2))\n\
  \    println(\"sub: \"+calc.sub(10,5))\n  }\n```\n\n以下是此项目的目录截图：\n\n![](img/d7b631352a782ee50160cf8eb995152f_324_0.png)\n\
  \n然后运行以下命令：\n\n```\n$ sbt run\n```\n\n![](img/d7b631352a782ee50160cf8eb995152f_324_1.png)\n\
  \n## ClojureCLR\n\nClojureCLR 是一种将你的 Clojure 代码使用和移植到 .NET 运行时的途径。实现这种集成有不同层次；你希望在\
  \ CLR 上运行 Clojure 代码的原因将成为你使用方式及其不同模式的根源。你可能只是偶然发现了一些看起来很棒的 Clojure 代码，但由于那些括号，你不确定是否能调试它，所以你只想嵌入\
  \ clj 算法并能够在命令行或通过 Windows 原生界面运行它。你可能想从通常的 Clojure REPL 创建 Windows 用户界面，这也是使用 ClojureCLR\
  \ 可以实现的。你可能还想将你的 Clojure 代码分发到 Windows 动态链接库 DLL 中并交给客户，以便他可以原生调用它。\n\n在本教程中，我们将查看所有这些不同的选项，并学习如何在\
  \ CLR 上保持生产力。\n\n在完成本教程的过程中，你还会再次意识到，.NET 程序的内存占用通常低于其 Java VM 对应程序，这为在内存受限环境中运行\
  \ Clojure 提供了很好的论据。\n\n编写本教程时，作者很想写更多 C# 和其他相关的 .NET 代码，甚至写一些移动应用。现在轮到你兴奋了。\n\n\
