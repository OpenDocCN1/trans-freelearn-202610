  \ '{{ .NetworkSettings.IPAddress }}' dockercouchbase41_couchbase1_1\n172.17.0.3\n\
  $ docker inspect --format '{{ .NetworkSettings.IPAddress }}' dockercouchbase41_couchbase2_1\n\
  172.17.0.5\n$ docker inspect --format '{{ .NetworkSettings.IPAddress }}' dockercouchbase41_couchbase3_1\n\
  172.17.0.4\n$\n```\n\n## Couchbase 集群摘要\n\n我们总结了 Couchbase 集群的节点名称、Docker 进程名称、IP地址和\
  \ Couchbase 安装目录，如下表所示：\n\n| 节点 | Docker 进程名称 | IP 地址 | Couchbase 安装目录 |\n|---|---|---|---|\n\
  | couchbase1 | dockercouchbase41_couchbase1_1 | 172.17.0.3 | /export/var/couchbase/node41-1\
  \ |\n| couchbase2 | dockercouchbase41_couchbase1_2 | 172.17.0.5 | /export/var/couchbase/node41-2\
  \ |\n| couchbase3 | dockercouchbase41_couchbase1_3 | 172.17.0.4 | /export/var/couchbase/node41-3\
  \ |\n\n## 使用 Couchbase Web 管理员控制台\n\n让我们设置一个由三个节点组成的集群。\n\n## 登录 Web 控制台\n\n如果你成功启动\
  \ Couchbase，你可以通过打开以下 URL 访问 Web 管理员控制台：\nhttp://localhost:8091\n\n系统会要求你输入用户名和密码，因此分别输入\
  \ Administrator 和 password，如以下屏幕截图所示：\n\n![](img/d7b631352a782ee50160cf8eb995152f_403_0.png)\n\
  \n如果你能登录控制台，则会出现以下页面。如果登录失败，请检查用户名和密码是否正确：\n\n![](img/d7b631352a782ee50160cf8eb995152f_403_1.png)\n\
  \n## 向集群添加节点\n\n我们将向集群添加两个节点。点击浏览器中的 Server Nodes 进入服务器节点标签，如以下屏幕截图所示：\n\n![](img/d7b631352a782ee50160cf8eb995152f_404_0.png)\n\
  \n在前一页中，只有 IP 为 172.17.0.4 的节点加入了集群。\n\n## 添加集群\n\n让我们添加节点 172.17.0.3 和 172.17.0.5。点击\
  \ Add Server 并输入 172.17.0.3 作为 Server IP Address，password 作为 Password，如以下屏幕截图所示：\n\
  \n\n\n![](img/d7b631352a782ee50160cf8eb995152f_405_0.png)\n\n点击 **Add Server** 并输入\
  \ 172.17.0.5 作为 **Server IP Address**，密码作为 **Password**，如下一个截图所示：\n\n![](img/d7b631352a782ee50160cf8eb995152f_405_1.png)\n\
  \n添加两个服务器后，我们会看到以下页面，显示需要进行rebalance。Rebalance 将相同数量的数据在集群节点之间进行分配。\n\n点击 Rebalance\
  \ 选项并等待 rebalance 完成：\n\n![](img/d7b631352a782ee50160cf8eb995152f_406_0.png)\n\n\
  以下截图显示 rebalance 正在进行中：\n\n![](img/d7b631352a782ee50160cf8eb995152f_406_1.png)\n\
  \n## 定义 Memcached bucket\n\n进入 **Data Bucket** 选项卡并点击 **Create New Data Bucket**\
  \ 选项：\n\n![](img/d7b631352a782ee50160cf8eb995152f_407_0.png)\n\n让我们为新的 Memcached\
  \ bucket 指定参数：\n\n## 创建 Bucket\n\n### Bucket 设置\n\nBucket Name: memcached-1\nBucket\
  \ Type: Couchbase\nMemcached\n\n### 内存大小\n\nPer Node RAM Quota: 128 MB\nCluster\
  \ quota (900 MB)\nOther Buckets (300 MB)  This Bucket (384 MB)  Free (216 MB)\n\
  Total bucket size = 384 MB (128 MB x 3 nodes)\n\n### 访问控制\n\nStandard port (TCP\
  \ port 11211. Needs SASL auth.)\nEnter password:\nDedicated port (supports ASCII\
  \ protocol and is auth-less)\nProtocol Port: 11212\n\n### Flush\n\nEnable  What's\
  \ this?\n\n我们将在下表中回顾参数：\n\n| Parameter | Value |\n|---|---|\n| Bucket Name | memcached-1\
  \ |\n| Bucket Type | Memcached |\n| Per Node Ram Quota | 128 or higher |\n| Access\
  \ Control | Dedicated port |\n| Protocol Port | 11212 |\n\n在以下截图中，我们可以看到 memcached-1\
  \ bucket 已被创建：\n\n![](img/d7b631352a782ee50160cf8eb995152f_409_0.png)\n\n现在，我们可以用\
  \ Couchbase Server 作为 Memcached 服务器！\n\n## 如何操作...\n\n那么，让我们尝试使用 Spyglass 来操作我们之前定义的\
  \ Couchbase 上的 Memcached。\n\n### 定义使用 Spyglass 库\n\n让我们先定义 clojurewerkz.spyglass.client：\n\
  \n```\n(ns spyglass-example.core\n  (:require [clojurewerkz.spyglass.client :as\
  \ c]))\n```\n\n### 连接服务器\n\n要连接 Memcached 服务器，使用 clojurewerkz.spyglass.client/text-connection：\n\
  \n```\n(def tc (c/text-connection\n\"172.17.0.3:11212 172.17.0.4:11212 172.17.0.5:11212\"\
  ))\n;;=> #'spyglass-example.core/tc\n```\n\ntext-connection 参数是一个字符串，可能包含多个由空格分隔的地址，如前所示。\n\
  \n### 设置值\n\n设置值的语法如下：\n\n```\n(clojurewerkz.spyglass.client/text-connection connection\
  \ key time-to-live-in-second value)\n```\n\n让我们为不同数据类型设置键：\n\n```\n(c/set tc \"\
  key-1\" 0 \"Hello !\")\n;;=> #clojurewerkz.spyglass.OperationFuture[{ :status :ready,\n\
  :val true} 0x50b6f787]\n(c/set tc \"key-1\" 0 \"Hello !\")\n;;=> #clojurewerkz.spyglass.OperationFuture[{\
  \ :status :ready,\n:val true} 0x50b6f787]\n(c/set tc \"key-2\" 0 1)\n;;=> #clojurewerkz.spyglass.OperationFuture[{\
  \ :status :ready,\n:val true} 0x81bbd8a]\n(c/set tc \"key-3\" 0  [1 2 3])\n;;=>\
  \ #clojurewerkz.spyglass.OperationFuture[{ :status :ready,\n:val true} 0x2e6b1c50]\n\
  ```\n\n### 从另一个 REPL 获取值\n\n让我们启动另一个 REPL，以便我们可以在 JVM 之间共享内存中的数据：\n\n```\n$ lein\
  \ repl\n```\n\nREPL 就绪后，让我们获取值：\n\n```\n(ns spyglass-example.core\n  (:require [clojurewerkz.spyglass.client\
  \ :as c]))\n;;=> nil\n(def tc (c/text-connection\n\"172.17.0.3:11212 172.17.0.4:11212\
  \ 172.17.0.5:11212\"))\n;;=> #'spyglass-example.core/tc\n```\n\n```\n(c/get tc \"\
  key-1\")\n;;=> \"Hello !\"\n(c/get tc \"key-2\")\n;;=> 1\n(c/get tc \"key-3\")\n\
  ;;=> [1 2 3]\n```\n\n### 测试生存时间\n\n以下代码显示生存时间参数工作正确。我们将该参数设置为 3 秒并检查值在 3 秒后是否过期：\n\
  \n```\n(let [tc (c/text-connection\n\"172.17.0.3:11212 172.17.0.4:11212\n172.17.0.5:11212\"\
  )]\n  (c/set tc \"key-1\" 3  \"Hello !\")\n  (println (c/get tc \"key-1\"))\n  (println\
  \ \"sleeping ....\")\n  (Thread/sleep 3100)\n  (println (c/get tc \"key-1\"))\n\
  \  (c/shutdown tc))\n;;=> Hello !\n;;=> sleeping ....\n;;=> nil\n```\n\n### 断开连接\n\
  \n要断开连接，使用 clojurewerkz.spyglass.client/shutdown：\n\n```\n(c/shutdown tc)\n;;=>\
  \ nil\n```\n\n## 它是如何工作的...\n\n我们将简要描述 Memcached 和 Couchbase。\n\n### 什么是 Memcached？\n\
  \nMemcached 是一个常用的分布式键值系统。它经常被用来通过将数据和对象缓存到内存中来提高性能，加速网站，减少对数据库的访问。\n\nMemcached\
  \ 最初由 Danga Interactive 为 LiveJournal 开发，但现在被许多其他系统使用，包括 Google、Facebook、Twitter\
  \ 和其他知名公司。\n\nMemcached 的 API 提供了一个跨多台机器分布的非常大的哈希表。当表已满时，后续的插入会导致旧数据按最近最少使用顺序被清除。\n\
  \n### 从 Telnet 访问 Memcached\n\nMemcached 支持 Telnet 访问来操作缓存数据。让我们试试。如果已关闭，请在 REPL\
  \ 中重新启动连接：\n\n```\n(def tc (c/text-connection\n\"172.17.0.3:11212 172.17.0.4:11212\
  \ 172.17.0.5:11212\"))\n;;=> #'spyglass-example.core/tc\n```\n\n让我们进入终端并发出 Telnet\
  \ 以连接到 Memcached 服务器：\n\n```\n$ telnet 172.17.0.3 11212\nset key-1 0 60 5\ntest!\n\
  STORED\nget key-1\nVALUE key-1 0 5\ntest!\nEND\n```\n\n前面的命令使用 Telnet 访问 Memcached，进入你的\
  \ REPL 并设置 key-1 的值并获取它。到目前为止，让我们进入 REPL 获取 key-1 的值：\n\n```\n(c/get tc \"key-1\"\
  )\n;;=> \"test!\"\n(c/set tc \"key-2\" 100 \"Hello !\")\n;;=> #clojurewerkz.spyglass.OperationFuture[{:status\
  \ :ready,\n:val true} 0x171ca0f1]\n;;=> 1\n```\n\n再次切换到终端并发出以下命令：\n\n```\nget key-2\n\
  VALUE key-2 0 7\nHello !\nEND\n\nquit\nConnection closed by foreign host.\n```\n\
  \n![](img/d7b631352a782ee50160cf8eb995152f_413_0.png)\n\n### Couchbase Server\n\n\
  Couchbase Server 是一个具有高性能、高可扩展性和高可用性的分布式 NoSQL 文档数据库服务器。Couchbase 集群可以由多达数百个节点组成以提供超高性能。Couchbase\
  \ 中的 bucket 是类似于 DBMS 数据库或模式的一组文档。\n\n有两种类型的 bucket：\n\n- 一种是 Couchbase bucket 类型，提供基于\
  \ JSON 的文档数据库\n- 另一种是 Memcached bucket 类型\n\n我们使用后者类型。以下图表是我们运行在 Docker 容器上的 Couchbase\
  \ 集群：\n\n![](img/d7b631352a782ee50160cf8eb995152f_414_0.png)\n\n## 还有更多...\n\nspyglass\
  \ 有三个高级主题。让我们试试！\n\n### 使用 get-multi\n\nget-multi 一次获取多个值。让我们测试以下代码：\n\n```\n(doseq\
  \ [x (range 1 11)]\n  (c/set tc (str \"key-\" x) 300 (str \"Hello \" x \" !\")))\n\
  ;;=> nil\n```\n\n我们将在不同的 REPL（JVM）中测试以下代码以获取结果：\n\n```\n(def x\n  (c/get-multi tc\
  \ (mapv #(str \"key-\" %) (range 1 11))))\n;;=> #'spyglass-example.core/x\n(println\
  \ x)\n;;=> {key-2 Hello 2 !, key-9 Hello 9 !, key-8 Hello 8 !, key-3\nHello 3 !,\
  \ key-4 Hello 4 !, key-5 Hello 5 !, key-1 Hello 1 !, key-7 Hello 7 !, key-6 Hello\
  \ 6 !}\n;;=> nil\n```\n\n### 使用 async-get\n\nasync-get 将结果异步获取到 future 中。要获取结果，使用\
  \ deref 或 @：\n\n```\n(c/set tc \"key-1\" 300 \"Hello !\")\n;;=> #clojurewerkz.spyglass.OperationFuture[{:status\
  \ :ready, :val true} 0x3a7b844e]\n(def x (c/async-get tc \"key-1\"))\n;;=> #'spyglass-example.core/x\n\
  (c/replace tc \"key-1\" 300 \"Good bye !\")\n;;=> #clojurewerkz.spyglass.OperationFuture[{:status\
  \ :ready, :val true} 0xf0bd936]\n(def x (c/async-get tc \"key-1\"))\n;;=> #'spyglass-example.core/x\n\
  @x\n;;=> Good bye!\n```\n\n在前面的代码中，replace 是用新值替换现有键的值。\n\n### 使用 CAS 操作\n\nMemcached\
  \ 支持 CAS 操作以解决多线程或多进程环境中的并发问题。Spyglass 也支持它。\n\n下一个语句定义并将 \"key-1\" 设置为 0：\n\n```\n\
  (c/set tc \"key-1\" 0 0)\n;;=> #clojurewerkz.spyglass.OperationFuture[{:status :ready,\
  \ :val true} 0x4dc54398]\n```\n\n我们需要使用以下命令启动两个 REPL：\n\n```\nREPL-1\n$ lein repl\n\
  REPL-2\n$ lein repl\n```\n\n我们将测试对单个值 \"key-1\" 的并发更新。因此我们运行\n\n\n\n以下代码来自两个 REPL。\n\
  \n在 REPL-1 中：\n\n```\n(require '(clojurewerkz.spyglass [client :as c]))\n;;=> nil\n\
  (defn apply-fn [tc k fn]\n  (let [ret (c/get tc k)\n        v (fn ret)]\n    (c/replace\
  \ tc k 0 v)))\n;;=> #'spyglass-example.core/apply-fn\n(def tc (c/text-connection\n\
  \         \"172.17.0.3:11212 172.17.0.4:11212 172.17.0.5:11212\"))\n;;=> #'spyglass-example.core/tc\n\
  ```\n\n在 REPL-2 中：\n\n```\n(require '(clojurewerkz.spyglass [client :as c]))\n;;=>\
  \ nil\n(defn apply-fn [tc k fn]\n  (let [ret (c/get tc k)\n        v (fn ret)]\n\
  \    (c/replace tc k 0 v)))\n;;=> #'spyglass-example.core/apply-fn\n(def tc (c/text-connection\n\
  \         \"172.17.0.3:11212 172.17.0.4:11212 172.17.0.5:11212\"))\n;;=> #'spyglass-example.core/tc\n\
  ```\n\n现在让我们同时从两个 REPL 对 \"key-1\" 进行 10,000 次递增。\n\n在 REPL-1 中：\n\n```\n(time\n\
  \  (dotimes [_ 10000]\n    (apply-fn tc \"key-1\" inc)\n    ))\n;;=> \"Elapsed time:\
  \ 2472.73951 msecs\"\n;;=> nil\n```\n\n在 REPL-2 中：\n\n```\n(time\n  (dotimes [_\
  \ 10000]\n```\n\n```\n(apply-fn tc \"key-1\" inc)))\n;;=> \"Elapsed time: 2467.011652\
  \ msecs\"\n;;=> nil\n```\n\n让我们在 REPL-1 或 REPL-2 中检查 \"key-1\"。它应该是 20,000：\n\n\
  ```\n(c/get tc \"key-1\")\n;;=> 17258\n```\n\n错误！存在并发问题。\n\n所以让我们使用 CAS 函数做同样的测试。我们将学习\
  \ CAS 如何工作。我们将在 REPL-1 或 REPL-2 中运行以下代码。\n\n首先，让我们用简单的代码看看 CAS 如何工作。\n\nclojurewerkz.spyglass.client/gets\
  \ 获取当前值，而 clojurewerkz.spyglass.client/cas 使用 CAS 更新值。如果 CAS 更新成功，cas 返回 :ok。如果失败，它返回\
  \ :exists。\n\n让我们将 \"key-1\" 设置为 0 并获取其 CAS 值：\n\n```\n(c/set tc \"key-1\" 0 0)\n\
  ;;=> #clojurewerkz.spyglass.OperationFuture[{:status :ready, :val true} 0x7e0e69e5]\n\
  \  (def cas-value (:cas (c/gets tc \"key-1\")))\n  ;;=> 80010\n  #'user/cas-value\n\
  ```\n\n前述情况下 CAS 值为 80010。然后我们将使用 cas 函数更新 \"key-1\"：\n\n```\n(c/cas tc \"key-1\"\
  \ cas-value 1)\n;;=> ok\n(c/get tc \"key-1\")\n;;=> 1\n```\n\n前述 CAS 操作更新了 CAS 值，并且使用之前的\
  \ CAS 值更新失败：\n\n```\n(:cas (c/gets tc \"key-1\"))\n;;=> 80011\n```\n\n```\n(c/cas\
  \ tc \"key-1\" cas-value 1)\n;;=> :exists\n```\n\n因此，让我们定义一个名为 apply-fn-with-cas\
  \ 的修改版函数，该函数使用 CAS 更新 Memcached 值。我们将在两个 REPL 中定义 apply-fn-with-cas。\n\n# 在 REPL-1\
  \ 中：\n\n```\n(defn apply-fn-with-cas [tc k fn]\n  (loop []\n    (let [ret (c/gets\
  \ tc k)\n          v (fn (:value ret))]\n      (when\n        (= (c/cas tc k (:cas\
  \ ret) v)  :exists)\n        (recur)))))\n;;=> #'spyglass-example.core/apply-fn-with-cas\n\
  ```\n\n# 在 REPL-2 中：\n\n```\n(defn apply-fn-with-cas [tc k fn]\n  (loop []\n   \
  \ (let [ret (c/gets tc k)\n          v (fn (:value ret))]\n      (when\n       \
  \ (= (c/cas tc k (:cas ret) v)  :exists)\n        (recur)))))\n;;=> #'spyglass-example.core/apply-fn-with-cas\n\
  ```\n\n在后一种情况下，apply-fn-with-cas 会重试更新。\n\n让我们再次同时从两个 REPL 对 \"key-1\" 进行 10,000\
  \ 次递增。\n\n# 在 REPL-1 中：\n\n```\n(time\n  (dotimes [_ 10000]\n    (apply-fn-with-cas\
  \ tc \"key-1\"  inc)))\n;;=> \"Elapsed time: 4287.262212 msecs\"\n;;=> nil\n```\n\
  \n# 在 REPL-2 中：\n\n```\n(time\n  (dotimes [_ 10000]\n    (apply-fn-with-cas tc \"\
  key-1\" inc)))\n;;=> \"Elapsed time: 4559.814013 msecs\"\n;;=> nil\n```\n\n由于并发更新和重试，似乎存在很多冲突并且完成时间较长。但结果是正确的：\n\
  \n```\n(c/get tc \"key-1\")\n;;=> 20000\n```\n\n最后，让我们停止 Couchbase 集群的容器。\n\n```\n\
  $ docker-compose stop\n```\n\n## 另请参阅\n\n如需进一步阅读，请参考以下 Couchbase 和 Memcached 协议的链接：\n\
  \n- Couchbase 官方网站 http://www.couchbase.com/\n- Memcached 协议 https://github.com/memcached/memcached/blob/master/doc/protocol\n\
  \n## 使用 meltdown 进行响应式编程\n\nMeltdown 为 Clojure 带来了响应式编程的简便性。你的代码现在被转换为一组事件定义和对这些事件的监听器。你的运行代码现在绑定到一个状态（或一组多个状态），并且代码的每个部分现在都可以根据状态的值做出反应。事件流从代码中抽象出来。\n\
  \n假设你正在实现一个全新的邮件软件；屏幕上显示的消息将绑定到一个状态或状态的一部分。电子邮件的可视化表示是对状态本身的直接翻译。如果你需要替换或引入新的电子邮件，你只需向该状态列表添加一些消息。\n\
  \nMeltdown 也可以用作流处理工具包，这意味着你可以以某种方式管道化消息的处理，我们将在本食谱的最后一部分查看它。\n\n## 准备工作\n\n这里再次，为本食谱做准备并没有太多事情要做，我们只需将\
  \ meltdown 坐标添加到项目依赖列表中。我们稍后还将使用 MQTT 连接来展示响应式编程与远程服务之间的交互，所以现在一起添加它：\n\n```\n:dependencies\
  \ [\n  [org.clojure/clojure \"1.8.0\"]\n  [clojurewerkz/meltdown \"1.1.0\"]\n  [clojurewerkz/machine_head\
  \ \"1.0.0-beta8\"]\n  [org.slf4j/slf4j-simple \"1.6.1\"]\n]\n```\n\n我们恢复使用 slf4j-simple\
  \ 以避免关于日志记录器的烦人警告消息。\n\n## 如何操作...\n\n响应式编程围绕着单一的事件接收点和事件分发点展开，在 meltdown 术语中，这被称为\
  \ reactor。首先，我们将看到与 reactor 的基本交互。\n\n### 定义一个 reactor\n\n定义一个 reactor 是通过使用 def\
  \ 对 meltdown 命名空间的适当 create 函数进行简单绑定完成的，如下所示：\n\n```\n(require '[clojurewerkz.meltdown.reactor\
  \ :as mr])\n(def reactor (mr/create))\n```\n\n这个响应点可以被视为与多个参与者进行对话的共同通信点。它也可以被视为一个主题。\n\
  \n现在假设你想对发送到该通信点的消息做出反应，或者更准确地说，你想要一个函数来对发送到 reactor 的消息或一组消息做出反应。\n\n该函数将在消息发送到\
  \ reactor 时执行，并且可以通过我们的选择器选择消息键。\n\n这如下所示，我们首先从 meltdown 要求选择器的正确命名空间，然后定义一个选择器和一个如果需要将被调用的函数：\n\
  \n```\n(require '[clojurewerkz.meltdown.selectors :refer [$]])\n```\n\n```\n; 在响应点上创建一个响应函数\n\
  (mr/on reactor\n  ; 选择器\n  ($ \"key\")\n  ; 当选择器匹配时将被执行的函数\n  (fn [event]\n    (println\
  \ event)))\n```\n\n### 向 reactor 发送消息\n\n现在发送消息到 reactor 的部分，希望它会执行带有 println 块的函数。要发送消息，你将使用主\
  \ meltdown 命名空间的 notify 函数，后跟 reactor、键和消息本身，消息可以是任何类型，但这里我们将使用一个简单的映射：\n\n```\n\
  ; 发送消息\n(mr/notify reactor \"key\" {:my \"payload\"})\n```\n\n因此，如果你一直在 REPL 中输入以上内容并在控制台中检查，你会看到\
  \ println 函数被调用并且事件被打印：\n\n```\n{:data {:my payload}, :reply-to nil, :headers {},\
  \ :key key, :id #uuid \"42d33831-110b-11e6-f3e1-5dbaf4ef3e34\"}\n```\n\n我们可以看到消息由一个负载组成，包含在\
  \ :data 键中，这是我们发送的消息相关的数据。消息显然有一个唯一的 ID，并附带一组头信息。\n\n### 走同步方式\n\n现在这种第二种发送消息的方式意味着我们希望消息与发送的消息进行一种\
  \ ping-pong。receive-event 调用也使用选择器和 reactor，但也会对数据进行一些处理：\n\n```\n(mr/receive-event\n\
  \  ; 我们绑定到一个 reactor\n  reactor\n  ; 定义一个选择器\n  ($ \"hello-key\")\n  ; 做一些处理。并发送一些数据回来，这里是\
  \ \"response\"\n  (fn [_] (Thread/sleep 2000)  \"response\"))\n```\n\n第二部分涉及使用 send-event\
  \ 函数发送消息本身。前三个参数与使用 notify 函数时相同。最后一个参数是一个回调函数，该函数被调用\n\n\n\n在消息事务的最后：\n\n```\n\
  (mr/send-event\nreactor\n\"hello-key\"\n\"data\"\n(fn [event]\n; print the data\
  \ that was send by the receive-event\n; definition above, so most likely \"response\"\
  \n(println (:data event))\n(println \"done\")))\n```\n\n由于我们添加了回调，你会注意到在控制台打印 \"\
  done\" 消息之前会有轻微的延迟。还请注意，回调中的 (:data event) 部分正确地接收了来自前面定义的 data。\n\n## How it works...\n\
  \n你已经看到了 reactor 的基本用法以及如何发送消息。在本节中，我们将快速回顾如何使用选择器工作，并随后介绍如何通过组合或管道化回调函数来构建处理流。\n\
  \n## Selectors\n\n到目前为止，你已经看到如何使用美元 $ 选择器选择给定的 key：\n\n```\n(require '[clojurewerkz.meltdown.selectors\
  \ :refer [$]])\n```\n\n选择器可以使用通配符来实现类似基于正则表达式的选择。\n\n假设你想基于食物和选项发送和接收消息，那么你可以使用\
  \ R 定义选择器，如下所示：\n\n```\n(require '[clojurewerkz.meltdown.selectors :as s :refer\
  \ [R]])\n```\n\n```\n(mr/on reactor\n(R \"Burger.*\")\n(fn [event] (println \"Delicious\
  \ Burger:\" event)))\n```\n\n现在你可以在对 reactor 的 notify 调用上进行通配模式匹配：\n\n```\n(mr/notify\
  \ reactor \"Burger.withbacon\" {:teh :payload})\n(mr/notify reactor \"Burger.withcheese\"\
  \ {:das :payload})\n```\n\n请注意，以下消息显然不会对 reactor 产生任何调用，也不会调用回调：\n\n```\n(mr/notify\
  \ reactor \"Sushi.salmon\" {:das :payload})\n```\n\n继续尝试，看看你是否能让一些美味的寿司上桌。\n\n##\
  \ Streams\n\nStreams 是一种抽象，基于响应式编程的概念，允许你对流经 streams 的消息或值应用实时转换。\n\nmeltdown 中的\
  \ Streams 可以被视为一个根 channel 和应用于该 channel 的函数。\n\nStreams 有四个主要函数：\n\n- `create`:\
  \ 这就是一切的开始，你可以用它来定义一个新的 channel。\n- `map*`: 这是一个辅助函数，其作用就像 Clojure 核心的 map 函数，但作用于从\
  \ channel 中来的值。\n- `consume`: 这是组合函数中作用于值的最后一个函数。它将使用 `map*` 或类似函数的管道。\n- `accept`:\
  \ 这会向 channel 发送值。\n\n下面的简单示例展示了如何简单地将 1 加到通过 channel 传输的整数值上：\n\n```\n(require\
  \ '[clojurewerkz.meltdown.streams :as ms :refer [create consume accept map*]])\n\
  ```\n\n```\n(def channel (ms/create))\n(def incremented-values (map* inc channel))\n\
  ```\n\n```\n(consume incremented-values (fn [i] (println \"Incremented: \" i)))\n\
  (accept channel 1)\n; 2\n(accept channel 2)\n; 3\n\n(ms/flush channel)\n```\n\n\
  Streams 的有趣之处在于你可以组合应用于 channel 中值的函数。在这里我们重用了几乎相同的上一个示例，但你已经可以看到函数是如何通过使用基于 map*\
  \ 的函数作为另一个基于 map* 的函数的输入而相互组合的：\n\n```\n(def channel (ms/create))\n(def incremented-values\
  \ (map* inc channel))\n(def incremented-twice (map* inc incremented-values))\n\n\
  (consume incremented-twice\n  (fn [i] (println \"Incremented twice: \" i)))\n\n\
  (accept channel 1)\n; 3\n(accept channel 2)\n; 4\n\n(ms/flush channel)\n```\n\n\
  ## Streams and reduce\n\n使用同一个 ms meltdown 命名空间中的 reduce* 函数，将归约函数应用于 stream 也非常容易：\n\
  \n```\n(require '[clojurewerkz.meltdown.streams :as ms :refer [create consume accept\
  \ reduce*]])\n\n(def channel2 (ms/create))\n(def res (atom nil))\n(def sum (reduce*\
  \ #(+ %1 %2) 0 channel2))\n(ms/consume sum #(reset! res %))\n\n(ms/accept channel2\
  \ 1)\n```\n\n```\n(ms/accept channel2 2)\n(ms/accept channel2 3)\n(ms/flush channel2)\n\
  \n@res\n; 6\n```\n\n前面的示例也突出了 flush 的使用，到目前为止它并没有真正被需要。正如大多数 Clojure 代码一样，评估大多是惰性的。因此，flush\
  \ 会强制 channel 中的所有值被使用并经过应用于 streams 的所有函数。\n\n## Combining functions with a graph\n\
  \nMeltdown 还提供了一个命名空间，称为 stream-graph。可以把它看作是当你需要组合应用于你的 channels 的函数时易于使用的语法糖：\n\
  \n```\n(require '[clojurewerkz.meltdown.stream-graph :refer :all])\n\n(def res (atom\
  \ 0))\n(def channel (graph  (create)\n                    (map* inc\n          \
  \          (reduce* #(+ %1 %2) 0\n                    (consume #(reset! res %)))))\n\
  (accept channel 1)\n(accept channel 2)\n(accept channel 3)\n\n(ms/flush channel)\n\
  @res\n; 6\n```\n\n## Custom streams\n\n这是一个非常酷的解决方案，用于一个常见问题，即你想要检查流经 stream 的值。假设你想在温度流持续传入时，如果温度过高就发出警报。你可以定义一个自定义\
  \ stream，它从上游获取值，并且只有当这些值高于 40 摄氏度时才将值发送到下游。\n\n```\n(def reactor\n  (mr/create))\n\
  \n; function to proxy messages from mqtt to\n; the above created reactive point\n\
  (defn proxy-to-meltdown\n  [^String topic _ ^bytes payload]\n  (mr/notify reactor\
  \ topic (String. payload)))\n\n; subcribe to mqtt messages and proxy\n; all message\
  \ to the function defined\n(mh/subscribe\n  conn\n  [\"#\"]\n  proxy-to-meltdown)\n\
  \n; lastly, when the reactor receives any message\n; print the event\n(mr/on reactor\n\
  \  (sel/match-all)\n  (fn [event]\n    (println (:data event))))\n```\n\n## Bridging\
  \ core.async\n\nClojure 的 `core.async` 是让你爱上异步编程的 Clojure 特性之一。虽然不包含在 Clojure 核心中，但它直接且易于使用，使得\
  \ Clojure 的 STM 变得轻而易举。不幸的是，大多数可以在 `core.async` 上找到的示例使得很难看出如何将其连接并与你当前的代码和其它框架集成。\n\
  \n本食谱希望弥合这一差距，帮助你将更多的 `core.async` 代码带出来。\n\n## Getting ready\n\n本食谱很大程度上基于 `core.async`，但我们将使用一些其它库。以下是\
  \ `project.clj` 文件的示例 dependencies 部分：\n\n```\n:dependencies [\n[org.clojure/clojure\
  \ \"1.8.0\"]\n[org.clojure/core.async \"0.2.374\"]\n\n[com.hellonico.gearswithingears/async-sockets\
  \ \"0.1.0\"]\n[jarohen/chime \"0.1.9\"]\n\n; there's more\n[com.keminglabs/jetty7-websockets-async\
  \ \"0.1.0\"]\n[ring \"1.2.0\"]\n\n]\n```\n\ncore async 库显然是必需的。其它示例还将展示与其它库集成的同步性，因此\
  \ async sockets 将帮助我们从 socket 消息创建 channels，而 chime 将为我们提供可与 `core.async` 一起使用的\
  \ timer channel。\n\n请注意，`com.hellonico.gearswithingears` 只是 `async-sockets` 库的一个自定义版本，带有小的代码修复。\n\
  \n## Memories - reviewing core.async basics\n\n首先，我们将通过一个简短的示例回顾 core.async 的工作原理。此示例将异步地从\
  \ core.async channel 读取摄氏温度值并将其转换为华氏度。\n\n你可以把它想象成一些 Clojure 代码从传感器读取值，并且你需要将传感器值在准实时中转换：\n\
  \n```\n(ns asyncing.simple\n  (:require [clojure.core.async :refer :all]))\n\n;\
  \ convert Celsius to Fahrenheit\n(defn c-to-f [c]\n  (+ (* 1.8 c) 32))\n\n; create\
  \ an out channel that reads Celsius values from a\n; channel\n; and convert them\
  \ to Fahrenheit asynchronously.\n; remember that >! And <! can only be called within\
  \ a go block,\n; which is, simply said, an asynchronous block of code.\n(defn c-to-fer\n\
  \  [in]\n  (let [out (chan)]\n    (go (while true (>! out (c-to-f (<! in)))))\n\
  \    out))\n\n; the in channel that reads Celsius values\n(def in-chan (chan))\n\
  \n; the out channel that output Fahrenheit values\n(def c-to-fer-out (c-to-fer in-chan))\n\
  \n; a helper method that will print out values coming from the in\n; channel.\n\
  ; This is a simple go loop that reads value forever from the\n; channel and prints\
  \ them.\n(defn printer\n  [in]\n  (go (while true (println (<! in)))))\n\n; start\
  \ the printer go loop on the Fahrenheit channel\n(printer c-to-fer-out)\n\n\n\n\n\
  ```\n; put some Celsius values in the original channel\n(>!! in-chan 30)\n; 86\n\
  \n; remember that >!! runs on the main thread, and so if you want to\n; make the\
  \ code async as well, you can use go and >! As above.\n(go (>! in-chan 10))\n```\n\
  \n## Pub/sub\n\nWhile we are looking at known stuff, a less famous pattern of core\
  \ async is the included, easy-to-use pub/sub mechanism.\n\nLet's have a look at\
  \ some sushis and burgers. Create a publisher from a channel using pub, the channel,\
  \ and a message key:\n\n```\n; publish\n(def input-chan (chan))\n(def our-pub (pub\
  \ input-chan :food))\n```\n\nYou can then define subscribers to this publisher using\
  \ sub, the pub just defined, and an output channel:\n\n```\n; subscribe\n(def burger-chan\
  \ (chan))\n(sub our-pub :burger burger-chan)\n\n(def sushi-chan (chan))\n(sub our-pub\
  \ :sushi sushi-chan)\n```\n\nFinally, with some glue code to print the values from\
  \ subscribers from different channels:\n\n```\n(defn print-loop [channel prefix]\n\
  \  (go-loop []\n    (let [{:keys [option]} (<! channel)]\n      (println prefix\
  \ \" \" option)\n      (recur))))\n(print-loop sushi-chan :sushi)\n(print-loop burger-chan\
  \ :burger)\n```\n\nYou can know dispatch food at will and have a great lunch:\n\n\
  ```\n(>!! input-chan {:food :burger :option \"with cheese\"})\n(>!! input-chan {:food\
  \ :burger :option \"with avocado\"})\n```\n\nAlso remember that thread can be used\
  \ to spawn a separate thread and run its own inline code block:\n\n```\n(thread\n\
  \  (>!! input-chan {:food :sushi :option \"salmon\"}))\n```\n\nNow that we have\
  \ all this async code in mind, let's see how to integrate it nicely with other tools.\n\
  \n## How to do it...\n\nLet's get back to the simple Celsius to Fahrenheit example\
  \ and see how we can enhance things a bit using regular sockets, combined with core\
  \ async channels. Remember you included the com.gearswithingears.async-sockets library\
  \ in the project; we will make use of that just now.\n\n### Async socket server\n\
  \nThe idea here is to delegate the handling of connections to a channel, which itself\
  \ will handle values coming to it through another channel.\n\nLet's start with the\
  \ glue code to include the library in the namespace, and the Celsius to Fahrenheit\
  \ conversion code:\n\n```\n(ns asyncing.withsockets\n  (:require [com.gearswithingears.async-sockets\
  \ :refer :all]\n            [clojure.core.async :as async]))\n```\n\n```\n(defn\
  \ c-to-f [c]\n  (+ (* 1.8 (Integer/parseInt c)) 32))\n```\n\nThen, let's go to the\
  \ connection handling block. On the socket connection, this function creates a new\
  \ async loop that repeatedly reads lines of input. Each input is supposed to be\
  \ an integer and the value is then simply converted to Fahrenheit and returned to\
  \ the client:\n\n```\n(defn handle-connection [socket]\n```\n\n```\n(async/go-loop\
  \ []\n    (when-let [line (async/<! (:in socket))]\n(async/>! (:out socket)\n(str\
  \ \"FAHRENHEIT: \" (c-to-f line)))\n(recur)))\n```\n\nFinally, the main server loop\
  \ is just accepting connections and adding them to a regular core async channel:\n\
  \n```\n(let [server (socket-server 12345)]\n    (async/go-loop []\n        (when-let\
  \ [connection (async/<! (:connections server))]\n            (handle-connection\
  \ connection)\n            (recur))))\n```\n\n![](img/d7b631352a782ee50160cf8eb995152f_433_0.png)\n\
  \nA bit of Telnet to talk to the socket and converts values. Note that for the purpose\
  \ of this book, the socket server is actually running on a simple Raspberry Pi.\n\
  \n### Async socket client\n\nThe example would not be complete if there was not\
  \ a client version of this. Since all this code is asynchronous, you can use the\
  \ following code in the same REPL you were using until now. This is also using an\
  \ async channel to put values on the socket connection and reads quite nicely:\n\
  \n```\n```clojure\n(def socket (socket-client 12345 \"localhost\")\n(async/>!! (:out\
  \ socket) \"10\")\n(println (async/<! (:in socket)))\n; CELCIUS TO FAHRENHEIT: 50.0\n\
  \n; close the socket.\n(close-socket-client socket)\n```\n```\n\n### Chiming\n\n\
  Sockets are nice, but a simple and fun way of showing that async's work is to deal\
  \ with sound. Chime is a simple timer library that provides a channel around timed\
  \ events. So, to play a short audio clip after a few seconds, you can pass init\
  \ values to chime and it will push messages on the async channel, always on time,\
  \ just like a Japanese train.\n\nThis example will do just that by asking chime\
  \ to send a message to a core async channel after two seconds. The handling block\
  \ will then, without blocking, play the sample audio clip in the background.\n\n\
  Let's start with the usual namespaces declarations:\n\n```\n```clojure\n(ns asyncing.withchime\n\
  \  (:import [javax.sound.sampled AudioSystem])\n  (:require [chime :refer [chime-ch]]\n\
  \            [clj-time.core :as t]\n            [clojure.java.io :as io]\n     \
  \       [clojure.core.async :as a :refer [<! go-loop]]))\n```\n```\n\nThis is nothing\
  \ more than a simple Java interop code block that will play a sound from a wav file:\n\
  \n```\n```clojure\n(defn play-sound [file]\n  (let[\n    sound (io/as-file file)\n\
  \    input (AudioSystem/getAudioInputStream sound)\n    clip (AudioSystem/getClip)]\n\
  \    (doto clip\n      (.open input)\n      (.start))))\n```\n```\n\nFinally, the\
  \ chime channel takes a vector of clj-time inputs, here two\n\nseconds from now,\
  \ and creates what can be seen as a simple cron channel:\n\n```\n(let [chimes (chime-ch\
  \ [ (-> 2 t/seconds t/from-now) ])]\n  (a/<!! (go-loop []\n    (when-let [msg (<!!\
  \ chimes)]\n      (play-sound \"resources/pendolino.wav\")\n      (recur)))))\n\
  ```\n\nAt the REPL, and after two seconds, you can hear the sound of a bullet train\
  \ passing by and you can still keep on typing code.\n\n## There's more...\n\nTo\
  \ close this recipe, we will cover more on sockets, this time using WebSockets,\
  \ with a bit of a mix with Python code.\n\n### Client to Python WebSockets\n\nWith\
  \ pip, the Python library manager installed, we will install the tornado server\
  \ that has WebSocket support:\n\n```\nsudo pip install tornado\n```\n\nThen a simple\
  \ WebSocket server can be written as follows. Since we do not want to go deep into\
  \ Python details, it's best to simply copy and paste the following in a file named\
  \ websockets.py for now:\n\n```\nimport tornado.httpserver\nimport tornado.websocket\n\
  import tornado.ioloop\nimport tornado.web\nimport socket\n```\n\n```\nclass WSHandler(tornado.websocket.WebSocketHandler):\n\
  \    def open(self):\n        print 'new connection'\n\n    def on_message(self,\
  \ message):\n        print 'sending back message: %s' % message\n        self.write_message(message)\n\
  \n    def on_close(self):\n```\n\n```\nprint 'connection closed'\n\ndef check_origin(self,\
  \ origin):\n    return True\n\napplication = tornado.web.Application([\n    (r'/ws',\
  \ WSHandler),\n])\n\nif __name__ == \"__main__\":\n    http_server = tornado.httpserver.HTTPServer(application)\n\
  \    http_server.listen(8888)\n    myIP = socket.gethostbyname(socket.gethostname())\n\
  \    print '*** Websocket Server Started at %s***' % myIP\n    tornado.ioloop.IOLoop.instance().start()\n\
  ```\n\nBasically, we implemented a WebSocket handler at path /ws and we hook this\
  \ into a simple Tornado application. Running the server is then simply done through:\n\
  \n```\npython websockets.py\n```\n\nNow that we have this, we can write some WebSocket\
  \ client code from Clojure using the jetty-websocket-async library:\n\n```\n(require\
  \ '[com.keminglabs.jetty7-websockets-async.core :refer [connect!]]\n        '[clojure.core.async\
  \ :refer [chan go >! <! >!! <!!]])\n\n(def c (chan))\n(connect! c \"ws://localhost:8888/ws\"\
  )\n```\n\nThe core async chan contains the connection and we can then retrieve it\
  \ to send messages to the Python WebSocket server with:\n\n```\n(go\n  (loop []\n\
  \    (when-let [ws-req (<! c)]\n      (>! (:in ws-req) \"Hello remote websocket\
  \ server!\")\n      (recur))))\n```\n\nTo make it more obvious that we can reuse\
  \ those WebSockets connections, we confirm that we have two channels, in and out,\
  \ to the\n\n### WebSocket server:\n\n```\n(def in (atom nil))\n(def out (atom nil))\n\
  ```\n\nHere, notice that both in and out are core async channel, as prepared for\
  \ us by the Jetty WebSocket library:\n\n```\n(go\n  (let [ws-req (<! c)]\n    (reset!\
  \ in (:in ws-req))\n    (reset! out (:out ws-req))))\n```\n\n```\n(defn printer\n\
  \  [in]\n  (go (while true (println (<! in)))))\n```\n\n```\n(printer @out)\n(>!!\
  \ @in \"sushi please\")\n```\n\n### Clojure WebSocket server\n\nThis has been covered\
  \ in other places, so we will quickly glance at this Clojure WebSocket server. You\
  \ can already see that contrary to the Python code, this feels naturally integrated\
  \ into our async programming code:\n\n```\n(require '[com.keminglabs.jetty7-websockets-async.core\
  \ :refer [configurator]]\n        '[clojure.core.async :refer [chan go >! <!]]\n\
  \        '[ring.adapter.jetty :refer [run-jetty]])\n```\n\n```\n(defn http-handler\n\
  \  [req]\n  {:response 200 :body \"HTTP hello\" :headers {}})\n```\n\n```\n; this\
  \ is the channel where new connections will be put in\n(def c (chan))\n```\n\n```\n\
  (def ws-configurator (configurator c {:path \"/ws\"}))\n```\n\n```\n(def server\n\
  \  (run-jetty http-handler {:configurator ws-configurator\n                    \
  \        :port 8888, :join? false}))\n```\n\n\n\n\n; 这是 websocket 连接处理器。\n; 它在通道\
  \ :out 上读取消息并仅在核心\n; 异步通道 :in 上回显它们\n(defn websocket-echo-handler [ws-req]\n  (println\
  \ \"new websocket connection...\")\n  (go (loop []\n    (when-let [msg (<! (:out\
  \ ws-req))]\n      (println \"MSG:\" msg)\n      (>! (:in ws-req) \"ECHO: \" msg)\n\
  \      (recur)))))\n\n; 请注意，此 go-loop 的生命周期与\n服务器生命周期分离。\n(go (loop []\n  (let [ws-req\
  \ (<! c)]\n    (websocket-echo-handler ws-req)\n    (recur))))\n\n## On Quasar/Pulsar\n\
  \nPulsar 是 Quasar 库的 Clojure 包装器，Quasar 是一个面向 JVM 的基于 Actor 的编程工具包。在使用 Actor 库时，Actor\
  \ 通常与线程一一映射，因此可能消耗比处理它们需要处理的有时很简单的代码更多的资源。\n\nQuasar 和 Pulsar 引入了纤程的概念，或真正轻量级的处理单元，它们可以相互发送消息。这导致了一组易于阅读和使用的处理单元，将异步编程提升到了新的水平。\n\
  \n## Getting ready\n\n需要对新的 `project.clj` 文件进行轻微更新以添加依赖项。还请注意添加 Quasar core 到运行时编织集合的\
  \ `java-agent` 指令。\n\n请注意，代理的目的是为应用程序提供编织能力，换句话说，是在运行时重新定义类文件的签名的能力。花哨的细节需要阅读 Quasar\
  \ 代码，但可以说 Quasar 通过一些字节码操作来创建和管理其纤程。\n\n以下是 `project.clj` 文件：\n\n```\n(defproject\
  \ quasarland \"0.1.0-SNAPSHOT\"\n  :java-agents [[co.paralleluniverse/quasar-core\
  \ \"0.7.5\"]]\n  :dependencies [\n    [org.clojure/clojure \"1.8.0\"]\n    [co.paralleluniverse/quasar-core\
  \ \"0.7.5\"]\n    [co.paralleluniverse/pulsar \"0.7.5\"]\n  ])\n```\n\n## How to\
  \ do it...\n\n本节简短地介绍如何定义、实例化这些 Actor 并使它们相互通信。\n\n我们的命名空间声明将需要 Pulsar 的 core 和\
  \ actor 命名空间。请注意这里使用 refer-clojure 来避免 promise 和 await 的冲突：\n\n```\n(ns quasarland.firststeps\n\
  \  (:use [co.paralleluniverse.pulsar core actors])\n  (:refer-clojure :exclude [promise\
  \ await]))\n```\n\n开始你的第一个 Actor，它们老实说会休息放松：\n\n```\n(defsf n relaxing-afternoon\
  \ []\n  (println \"I am relaxing ...\"))\n```\n\ndefsf n 定义了一个可挂起函数，可以被纤程或 Actor\
  \ 使用，并且使用方式与通常的 defn 完全相同。\n\n现在我们基本上只是定义了一个函数，我们可以调用它作为常规函数：\n\n```\n(relaxing-afternoon)\n\
  ;I am relaxing ...\n```\n\n我们想要的不是一个函数，而是作为独立处理单元的东西。这是通过使用 spawn 来完成的，它实例化一个 Pulsar\
  \ Actor：\n\n```\n(spawn relaxing-afternoon)\n; #object[co.paralleluniverse.actors.ActorRef\
  \ 0x130599b8 \"ActorRef@130599b8{PulsarActor@1fac12d3[owner: fiber-10000002]}\"\
  ]\n    ; I am relaxing ...\n```\n\n你仍然会在控制台上看到放松的消息，但你也会得到一个 Actor 的引用。我们的 Actor\
  \ 仍然很懒惰，除了在星期日下午懒惰之外，并没有做太多事情。为了让他过一段时间醒来，我们可以使用一些睡眠代码：\n\n```\n(defsf n relaxing-afternoon-2\
  \ []\n  (println \"I am relaxing ...\")\n  ; (Thread/sleep 2000) fails here !\n\
  ```\n\n```\n(sleep 2000)\n(println \"I am waking up ...\")\n)\n```\n\n```\n(spawn\
  \ relaxing-afternoon-2)\n```\n\n两秒后，你的放松下午开始有些动作。如注释所述，请确保你没有使用 Thread/sleep 的调用，这是\
  \ Quasar 无法编织的东西，并且会在定义时导致异常。\n\n现在假设你想能够向 Actor 发送一个提示，让他醒来，而不是等待他自己去做。\n\n为此，你可以使用\
  \ receive 函数，使用一个键，以及在消息到达时异步执行的代码块：\n\n```\n(defsf n relaxing-afternoon-3 []\n\
  \  (println \"I am relaxing ...\")\n  (receive\n    :wakeup (println \"Hey ! Someone\
  \ woke me up!\")))\n```\n\n生成这个下一个 Actor 后，你现在能够通过使用 ! 调用向它发送消息：\n\n```\n(def me\n\
  \  (spawn relaxing-afternoon-3))\n```\n\n```\n(! me :wakeup)\n; Hey ! Someone woke\
  \ me up!\n```\n\n酷！消息传递。现在发生了一些奇怪的事情，当你想再次唤醒 Actor 并发送相同的消息时：\n\n```\n(! me :wakeup)\n\
  ```\n\n什么都没有发生。这是因为 defsfn 的主体充当一个循环，一旦收到消息，循环自然会结束，除非我们用 recur 告诉它不要结束：\n\n```\n\
  (defsf n relaxing-afternoon-4 []\n  (println \"I am relaxing ...\")\n```\n\n```\n\
  (receive\n    :bump (do (println \"Hey ! Stop bumping me!\") (recur)))\n```\n\n\
  ```\n(def me\n    (spawn relaxing-afternoon-4))\n```\n\n```\n(! me :bump)\n    ;\
  \ Hey ! Stop bumping me!\n; I am relaxing ...\n```\n\n```\n(! me :bump)\n    ; Hey\
  \ ! Stop bumping me!\n; I am relaxing ...\n```\n\n所有这些反复的碰撞一定很累人。recur 调用要求整个块再次被调用，以便\
  \ Actor 继续放松，这在如此阳光明媚的一天之后可能并不是问题！\n\n我们的 Actor 有点自虐，并希望能够撞自己。幸运的是，defsfn 宏公开了一个自引用，可以用来指向自己：\n\
  \n```\n(defsfn relaxing-afternoon-5 []\n    (println \"I am relaxing ...\")\n  \
  \  (sleep 5000)\n    (! @self :bump)\n    (receive\n        :bump\n        (println\
  \ \"bumping myself!\")))\n```\n\n```\n(spawn relaxing-afternoon-5)\n```\n\n五秒后，放松的下午将开始向自己发送消息并对其做出反应。@self\
  \ 非常有用，并且是不同 Actor 之间交换消息的广泛使用的模式。以下示例代码通过增强消息接收部分使其更加清晰，这样你就可以看到谁发送了消息。请注意，receive\
  \ 部分现在接收的是向量而不是简单的消息关键字，并且还请注意消息发送部分也是发送向量：\n\n```\n(defsfn relaxing-afternoon-6\
  \ []\n    (println \"I am relaxing ...\")\n    (sleep 1000)\n```\n\n```\n(! @self\
  \ [:bump @self])\n(receive\n  [:bump who]\n  (println who \" is bumping!\"))\n\n\
  (spawn relaxing-afternoon-6)\n; ... ActorRef@32c9c341...  is bumping!\n```\n\n现在发送，人们通常不会撞自己，所以我们需要引入某个人来做这项艰苦的工作。\n\
  \n下一个示例采用两个 Actor，一个睡眠，一个发送唤醒提示。我们的两个 Actor，sleeping man 和 someone，可以很容易地定义如下：\n\
  \n```\n(defsf n sleeping-man []\n  (println \"I keep on sleeping ...\")\n  (receive\n\
  \    [:wakeup who]\n    (do\n      (println \"Someone is telling me to wakeup!\"\
  )\n      (println \"but ...\")\n      (recur))))\n```\n\n```\n(defsf n someone [man]\n\
  \  (sleep 1000)\n  (! man [:wakeup @self]))\n```\n\n然后我们可以看到这两个人之间的交互。请注意，someone\
  \ 接受对 man 的引用，以便能够向其发送消息。\n\n生成 sleeping man 与平常一样：\n\n```\n(def man-asleep (spawn\
  \ sleeping-man))\n```\n\n生成 someone 稍有不同，因为对 sleeping man 的引用被添加为 spawn 的第二个参数：\n\
  \n```\n(spawn someone man-asleep)\n;  Someone is telling me to wakeup!\n; but ...\n\
  ; I keep on sleeping ...\n```\n\n```\n(spawn someone man-asleep)\n; ... many people\
  \ ...\n; many more sleeping\n```\n\n现在你已经看到了如何在 Actor 之间发送消息，你已经完全准备好玩乒乓球了。\n\n\
  ## How it works...\n\n这个示例主要是 Pulsar 示例的直接复制，如果你已经跟随了本食谱的第一部分，应该很容易理解。\n\n在这里我们声明了两个\
  \ Actor，ping 和 pong，它们相互递归调用一段时间，直到 ping 漏球并宣布游戏结束：\n\n```\n(ns quasarland.pingpong\n\
  \  (:use [co.paralleluniverse.pulsar core actors])\n  (:refer-clojure :exclude [promise\
  \ await]))\n\n(defsfn ping [pong]\n  (if (>= (rand-int 10) 9)\n    (do\n      (!\
  \ pong :gameover)\n      (println \"Missed the ball. Ping Finished\"))\n    (do\n\
  \      (! pong [:ping @self])\n      (receive\n        :pong (println \"Ping\"))\n\
  \      (recur pong))))\n\n(defsfn pong []\n  (receive\n    :finished (println \"\
  Pong finished\")\n    [:ping ping] (do\n      (println \"Pong\")\n      (! ping\
  \ :pong)\n  (recur))))\n```\n\n## Let's start the game!\n\n```\n(let [a1 (spawn\
  \ pong)\n      b1 (spawn ping a1)])\n;Pong\n```\n\n\n\n\n;Ping\n;Pong\n;Ping\n;Pong\n\
  ;Ping\n;Missed the ball. Ping finished\n;Pong finished\n\n这种乒乓来回很不错，但同意，如果在 spawn\
  \ 时能避免把另一个乒乓者作为引用传递会更好。是的！这可以通过 register! 和一个关键字来实现。让我们重写 ping，使其能够使用关键字而不是引用发送消息：\n\
  \n```\n(defsf n ping []\n  (if (>= (rand-int 10) 9)\n    (do\n      (! :pong :finished)\n\
  \      (println \"Missed the ball. Ping finished\"))\n    (do\n      (! :pong [:ping\
  \ @self])\n      (receive\n        :pong (println \"Ping\"))\n      (recur))))\n\
  ```\n\n现在，在开始游戏之前，我们使用 register! 将 pong 注册为 :pong 到 Quasar 系统，然后依次 spawn ping 和\
  \ pong。注意 ping 知道存在 :pong，并且需要它被注册：\n\n```\n(register! :pong (spawn pong))\n(spawn\
  \ pong)\n(spawn ping)\n; a new game begins !\n```\n\n## Watching over other actors\
  \ lifecycles\n\n现在 actors 可以从其他 actor 生命周期获得自动通知，例如，某个 actor 即将结束其生命周期。你可以使用 watch!\
  \ 来接收消息：\n\n```\n(let [actor1 (spawn #(sleep 1000))\n      actor2 (spawn\n     \
  \          (fn []\n                 (let [w (watch! actor1)]\n                 \
  \  (receive\n```\n\n```\nch (channel)\nfiber (spawn-fiber\n    (fn []\n      (let\
  \ [m1 (rcv ch)\n            m2 (rcv ch)]\n        (+ m1 m2))))]\n(sleep 200)\n(snd\
  \ ch 10)\n(sleep 200)\n(snd ch 10)\n(join fiber))\n; 20\n```\n\n通道可以在不同的 fibers\
  \ 之间使用和共享：\n\n```\n(let [ch (channel 0 :block true true)\n      f #(rcv ch)\n  \
  \    fiber1 (spawn-fiber f)\n      fiber2 (spawn-fiber f)]\n  (snd ch \"m1\")\n\
  \  (snd ch \"m2\")\n  (close! ch)\n  #{(join fiber1) (join fiber2)})\n; #{\"m1\"\
  \ \"m2\"})\n```\n\n最后，通道可以用突发模式使用 rcv-into 和 snd-seq：\n\n```\n(let [ch (channel)\n\
  \      fiber (spawn-fiber #(rcv-into [] ch 1000))]\n  (snd-seq ch (range 200))\n\
  \  (close! ch)\n  (join fiber))\n; [0 1 2 3 4 ...])\n```\n\n## Blazar\n\n事情发展到你想知道如何将\
  \ fibers 和 socket 服务器链接起来，这里就是 Blazar，一个基于 fibers 构建的超快 HTTP 服务器框架，同时支持 WebSocket。该项目没有最近的提交，但与新版本的\
  \ Pulsar 配合得很好，其核心思想很巧妙。\n\nproject.clj 文件需要一点注意：\n\n```\n(defproject blazarland\
  \ \"0.1.0-SNAPSHOT\"\n  :java-agents [[co.paralleluniverse/quasar-core \"0.7.5\"\
  ]]\n  :profiles {\n    :dev {\n      :resource-paths [\"resources\" \"profiles/dev/resources\"\
  ]\n      :source-paths [\"src\" \"profiles/dev/src\"]}}\n  :dependencies [[org.clojure/clojure\
  \ \"1.8.0\"]\n  [blazar \"0.1.1\"]\n  [co.paralleluniverse/pulsar \"0.7.5\"]])\n\
  ```\n\n但随后你的基于 fiber 的服务器可以用几行代码编写！\n\n```\n(ns quasarland.blazar\n  (:require\n\
  \    [co.paralleluniverse.pulsar.core :as pc]\n    [blazar.http.server :as bs]))\n\
  (pc/join\n  (pc/spawn-fiber\n    # (bs/start-fiber-ring-adapter\n      \"0.0.0.0\"\
  \n      8080\n      (fn [req] \"Hello fiber world!\"))))\n```\n\n为了本书的目的，这在标准 Raspberry\
  \ Pi 上扩展得相当不错。\n"
- "# Chapter 7. Advanced Tips\n\n在本章中，我们将涵盖以下主题：\n\n- Hacking the Clojure code\n-\
  \ Using Reader Conditionals, compile to Clojure, and ClojureScript\n- Real-time\
  \ shared development with an REPL\n- Declarative data descriptions and validations\
  \ with plumatic/schema\n\n## Introduction\n\n我们将在本章学习更高级的技巧。首先我们将 hack Clojure 代码以了解\
  \ Clojure 代码的工作原理。我们将从 Clojure 代码生成类文件然后反编译 Java 代码。理解 Clojure 代码很有趣且有用。\n\n接下来，我们将看看如何编写在\
  \ Clojure 和 ClojureScript 之间保持兼容的源代码，并在两种环境中运行。随着 ClojureScript 如今越来越流行，单份代码在两种环境中运行可提高可维护性，尤其是在编写库时。\n\
  \n然后，我们将尝试从远程客户端实时共享 REPL。使用此机制，我们将尝试从你的 PC 控制 Raspberry Pi。\n\n最后，我们将学习 prismatic\
  \ schema，它使我们能够为数据定义和验证模式。此库非常有用，可用于定义数据形状和验证。我们将介绍 `core.types` 和 `clojure.spec`，它们是\
  \ Clojure 1.9 的最主要特性。\n\n## Hacking the Clojure code\n\n在你运行的大量代码中，如果你遇到过 Clojure\
  \ 本身的 bug 会非常惊讶。\n\n可能缺少一些特性，但核心令人印象深刻地健壮和稳定。\n\n在幕后，Clojure 本身将字节码生成委托给一个名为 ASM\
  \ 的库。ASM 生成 Java 机器可以执行的字节码。这在 Clojure 程序运行时实时完成，也可以在提前完成，例如当你想打包代码时。\n\n这个非常简短的配方将查看如何编译\
  \ Clojure 代码并查看生成的 Java 字节码。\n\n## Getting ready\n\nClojure 代码托管在 GitHub 上，因此要检索代码，请前往\
  \ https://github.com/clojure/clojure。执行 git checkout，请使用以下命令：\n\n```\ngit clone\
  \ https://github.com/clojure/clojure.git\n```\n\n要构建你自己的 Clojure 版本，你需要一个主要的 Java\
  \ 构建工具，称为 maven，截至本文撰写时版本为 3。下载并将二进制文件 mvn 放在你的终端可访问的位置：\n\n```\nmvn package -Dmaven.test.skip=true\n\
  ```\n\nClojure 令人惊讶地非常精简且编译速度很快。打包只需几秒钟。完成后，你可以在 target 文件夹中找到以下两个重要文件：\n\n```\n\
  clojure-1.9.0-master-SNAPSHOT-slim.jar\n```\n\n## clojure-1.9.0-master-SNAPSHOT.jar\n\
  \n第一个 JAR 包含编译的 Java 类和未编译的 Clojure 代码，而第二个还包含编译的 Clojure 源代码。这使得 slim JAR 约为 1\
  \ MB，而普通 JAR 约为 3.5 MB。\n\n拥有编译的 Clojure 文件的优点是启动虚拟机和 Clojure 环境时等待时间更少。\n\n作为提醒，你可以像这样轻松启动\
  \ Clojure Server REPL：\n\n```\njava -cp \\\ntarget/clojure-1.9.0-master-SNAPSHOT-slim.jar\
  \ \\\n-Dclojure.server.repl=\"{:port 5555 :accept clojure.main/repl}\" \\\nclojure.main\n\
  ```\n\n或使用传统 REPL：\n\n```\njava -cp target/clojure-1.9.0-master-SNAPSHOT-slim.jar\n\
  clojure.main\n```\n\n我们将在几分钟后使用前面生成的 Clojure JAR，所以请记住它生成的位置。\n\n现在来看生成的字节码。\n\n\
  ## How to do it...\n\n假设我们有一个非常简单的 Clojure 程序如下：\n\n```\n(ns gen3\n  (:gen-class\
  \ [:main true]))\n\n(defn -main[]\n  (println \"hello world\"))\n```\n\n前面的代码除了打印一些问候语外什么都不做，但它会使生成的代码更容易看到。\n\
  \n在解释这里使用的所有函数和单词之前，让我们先走一遍流程：\n\n- 源文件需要在 Clojure 项目的通常源文件夹中，所以使用 Leiningen，这将是\
  \ `src/gen3.clj`\n- 我们现在启动一个 REPL，再次使用 Leiningen，通过：\n\n  `lein repl`\n- 当 REPL\
  \ 启动后，我们现在使用 compile 指令：\n\n  ```\n  (compile 'gen3)\n  ; gen3\n  ```\n\n你会看到即使\
  \ REPL 很安静，类文件已被生成：\n\n```\nNicolass-MacBook% ls -l target/classes\ntotal 40\ndrwxr-xr-x@\
  \ 3 niko  staff    102 May 25 11:41 META-INF\n-rw-r--r--@ 1 niko  staff    831 May\
  \ 25 11:41 gen3$_main.class\n-rw-r--r--@ 1 niko  staff   1302 May 25 11:41\ngen3$fn__1248.class\n\
  -rw-r--r--@ 1 niko  staff   1494 May 25 11:41\ngen3$loading__5569_auto___1246.class\n\
  -rw-r--r--@ 1 niko  staff   1788 May 25 11:41 gen3.class\n-rw-r--r--@ 1 niko  staff\
  \   2372 May 25 11:41 gen3__init.class\n```\n\n那是生成了五个类，可能是最容易看到的是 `gen3.class`\
  \ 文件。这是包含程序入口点的文件。让我们使用我们之前生成的 Clojure JAR 和新生成的类：\n\n```\njava -cp ../clojure/target/clojure-1.9.0-master-SNAPSHOT.jar:target/classes\
  \ gen3\n```\n\n执行前面的命令将打印出预期的消息：\n\n```\nhello world\n```\n\n不错。所以我们现在可以看到 Clojure\
  \ 代码正在被编译为字节\n\n\n\ncode in class files and can be executed as standard Java, through\
  \ the use of only `clojure.jar` in the classpath.\n\n## How it works...\n\nIf we\
  \ look at the files generated from the previous command, we can see five classes,\
  \ as shown in the following screenshot:\n\n![](img/d7b631352a782ee50160cf8eb995152f_453_0.png)\n\
  \nWe will use a software called JD GUI, which you can download from http://jd.benow.ca/,\
  \ to examine in detail the Java class files generated by the Clojure compiler.\n\
  \nEach function in Clojure is actually compiled to a separate class file, making\
  \ it easier for class reloading. For example, the `-main` function that we defined,\
  \ just like any other function, is compiled to a class.\n\nSee the following:\n\n\
  ```\nimport clojure.lang.AFunction;\nimport clojure.lang.IFn;\nimport clojure.lang.RT;\n\
  import clojure.lang.Var;\n\npublic final class gen3$_main\n    extends AFunction\n\
  {\n```\n\n```\npublic Object invoke()\n{\n    return invokeStatic();\n}\n\npublic\
  \ static final Var const__0 =\n(Var)RT.var(\"clojure.core\", \"println\");\n\npublic\
  \ static Object invokeStatic()\n{\n    return ((IFn)const__0.getRawRoot()).invoke(\"\
  hello world\");\n}\n}\n```\n\nThe main Java objects being used in Clojure are as\
  \ follows:\n\n- `clojure.lang.IFn`: This is Clojure function, something that can\
  \ be invoked.\n- `clojure.lang.AFunction`: This function is mostly an annotated\
  \ Clojure function.\n- `clojure.lang.RT`: This is the Clojure runtime.\n- `clojure.lang.Var`:\
  \ This is a variable, a threaded reference, that is also a IFn and so can be invoked.\n\
  \nWith this in mind, we can see that the Clojure `println` function from `clojure.core`\
  \ is being kept as a `Var` from within the `gen3` class:\n\n```\npublic static final\
  \ Var const__0 = (Var)RT.var(\"clojure.core\", \"println\");\n```\n\nThe `Var` is\
  \ retrieved through questioning the runtime for a var through `RT.var`, a namespace,\
  \ and a function.\n\nWhat happens when the `-main` method is called is simply a\
  \ static call to `invokeStatic`. This is rather generic, and calls invoke on an\
  \ `IFn` object:\n\n```\n((IFn)const__0.getRawRoot()).invoke(\"hello world\")\n```\n\
  \n`const__0` is here a generated reference to the `println` function in the namespace\
  \ `clojure.core`. Calling `-main` results in executing the body of `invokeStatic`,\
  \ which, in turn, invokes the `println` function with parameters \"hello world\"\
  .\n\nThe class gen3 contains a reference to the -main function in namespace gen3:\n\
  \n```\nprivate static final Var main__var = Var.internPrivate(\"gen3\", \"-main\"\
  );\n```\n\nAnd this is invoked in a similar way as previously. gen3__init is a side\
  \ class responsible for namespace loading, and registering the function under namespaces.\
  \ This is what is generated for the namespace definition. This allows for easy namespace\
  \ redefinition and easy reloading of functions.\n\nIn simple words, the remaining\
  \ two classes, gen3$fn and gen3$loading, are a different way of loading the preceding\
  \ namespace definition and can be bypassed for now.\n\nBack to the Clojure code,\
  \ you may remember the namespace had some metadata in it:\n\n```\n(:gen-class [:main\
  \ true])\n```\n\nThis is so that the generated entry point class for this Clojure\
  \ namespace is customized for easier interaction with Java. In particular, the :main\
  \ true directive tells the compiler to generate a static Java method. Remember you\
  \ can also customize constructors, getters, setters, and so on here.\n\n## There's\
  \ more...\n\nNow that you are used to it, you can have a look at some more complex\
  \ Clojure to byte code generation:\n\n```\n(ns gen2)\n\n(defn hello [b]\n  (let[\
  \ a 1]\n    (+ b a)))\n\n(defn -main[]\n  (println (hello 1)))\n```\n\nThe preceding\
  \ code compiles nicely to a few classes, one for each function. Let's look at the\
  \ class corresponding to the hello function:\n\n```\nimport clojure.lang.AFunction;\n\
  import clojure.lang.Numbers;\n\npublic final class gen2$hello\n    extends AFunction\n\
  {\n...\n\n    public static Object invokeStatic(Object b)\n    {\n        long a\
  \ = 1L;b = null;\n\n        return Numbers.add(b, a);\n    }\n}\n```\n\nIn namespace\
  \ gen2, the hello function is a class extending AFunction, so it can be invoked\
  \ through invoke, and the calling main function:\n\n```\nimport clojure.lang.AFunction;\n\
  import clojure.lang.IFn;\nimport clojure.lang.RT;\nimport clojure.lang.Var;\n\n\
  public final class gen2$_main\n    extends AFunction\n{\n...\n\n    public static\
  \ final Object const__2 = Long.valueOf(1L);\n    public static final Var const__1\
  \ = (Var)RT.var(\"gen2\",\n\"hello\");\n    public static final Var const__0 =\n\
  (Var)RT.var(\"clojure.core\", \"println\");\n\n    public static Object invokeStatic()\n\
  \    {\n        return\n((IFn)const__0.getRawRoot()).invoke(((IFn)const__1.getRawRoot()\n\
  ).invoke(const__2));\n    }\n}\n```\n\nAccess `var` that has been registered (loaded)\
  \ by the `__init` class and call it with the proper parameters.\n\nWe already saw\
  \ macro in the previous recipe, so a good exercise for the reader would be to see\
  \ that the Clojure code compile is actually the code after macro expansion. You\
  \ should be able to do this!\n\n## Using Reader Conditionals, compile to Clojure,\
  \ and ClojureScript\n\nCodes in Clojure and ClojureScript are almost the same but\
  \ there are few differences. For instance, libraries provided by Java and JavaScript\
  \ are quite different. Host environments between JVM and JavaScript runtimes are\
  \ also different.\n\nBefore the version 1.7, we use the cljx plugin to keep compatibility\
  \ between them. However, it requires a tooling and the style is not clean.\n\nFor\
  \ such a situation, Clojure 1.7 introduced Reader Conditionals are introduced. Reader\
  \ Conditionals have richer semantics than cljx, such as default expressions and\
  \ form splicing and no preprocessing.\n\nUsing Reader Conditionals, we can share\
  \ source code among Clojure, ClojureScript, and ClojureCLR. In this recipe, we will\
  \ demonstrate how we can share single source files between Clojure and ClojureScript.\n\
  \n## Getting ready\n\nWe will use the Figwheel template to generate a Clojure and\
  \ ClojureScript project:\n\n```\n$ lein new figwheel cljc-example -- --om\n```\n\
  \n![](img/d7b631352a782ee50160cf8eb995152f_459_0.png)\n\nThe generated directory\
  \ structure is as follows:\n\n![](img/d7b631352a782ee50160cf8eb995152f_459_1.png)\n\
  \nWe will move the project directory:\n\n```\n$ cd cljc-example\n$ lein figwheel\n\
  ```\n\nWe can see the following output to run lein figwheel:\n\n![](img/d7b631352a782ee50160cf8eb995152f_460_0.png)\n\
  \nThen, open your browser and go to the following URL:\n\nhttp://localhost:3449:\n\
  \n![](img/d7b631352a782ee50160cf8eb995152f_460_1.png)\n\nYou can see the message\
  \ in the browser. After seeing it, let's test the ClojureScript code in the REPL\
  \ to show an alert dialog on your browser, as shown in the following screenshot:\n\
  \n```\n(js/alert \"hello !\")\nnil\n```\n\n![](img/d7b631352a782ee50160cf8eb995152f_461_0.png)\n\
  \n## How to do it...\n\nFirst, we will create demo.cljc under the src/cljc_example\
  \ in the project as follows:\n\n![](img/d7b631352a782ee50160cf8eb995152f_461_1.png)\n\
  \n## Your first Reader Conditional\n\nLet's start with a simple Reader Conditional\
  \ expression. Reader Conditional start with #? as follows:\n\n```\n#?(:clj\n```\n\
  \n```\n\"Hello Clojure !\"\n:cljs\n\"Hello Clojurescript !\")\n```\n\n:clj is for\
  \ Clojure code, and :cljs is for ClojureScript code. So, the results of REPLs are\
  \ as follows:\n\n- Clojure REPL\n\n  ;;=> Hello Clojure !\n- Figwheel REPL\n\n \
  \ ;;=> Hello Clojurescript !\n\n```\n;;=> Hello Clojure !\n```\n\n```\n;;=> Hello\
  \ Clojurescript !\n```\n\n## Using Reader Conditionals in namespaces\n\nYou can\
  \ use :require in the namespace in the following way:\n\n```\n(ns cljc-example.demo\n\
  \  #?(:clj\n    (:require [quil.core :as q])\n    :cljs\n    (:require [quil.core\
  \ :as q :include-macros true])))\n;;=> nil\n```\n\nWe will use the quil library\
  \ for both Clojure and ClojureScript. Using ClojureScript, we need to add :include-macros\
  \ true. There are differences in handling exceptions in Clojure and ClojureScript.\
  \ We use Reader Conditionals as follows:\n\n```\n(try\n  (/ 1 0)\n  (catch\n   \
  \ #?(\n      :clj java.lang.Exception\n      :cljs ;default\n      ) e\n    (.getMessage\
  \ e)))\n```\n\nIn JVM, dividing by zero causes an exception, java.lang.Exception;\
  \ however, dividing by zero only returns Infinity:\n\n- Clojure REPL\n\n\n\n\n\n\
  \"Divide by zero\"\n\n+   - Figwheel REPL\n\nInfinity\n\nThe next code is another\
  \ example of Reader Conditionals for try and catch. The check-range checks whether\
  \ the given value v is between the lower l and higher h. If the value is out of\
  \ range, this function throws an exception or error:\n\n```\n(defn check-range [v\
  \ l u]\n  (if-not (and (>= v l) (<= v u))\n    #?(:clj (throw (Exception. \"out\
  \ of range\"))\n       :cljs (throw (js/Error. \"out of range\")))\n    v))\n```\n\
  \nWe will use js/Error in ClojureScript instead of _Exception in Clojure:\n\n```\n\
  (try\n  (check-range 0 1 10)\n  (catch\n    #?(\n      :clj Exception\n      :cljs\
  \ js/Error\n      ) e\n    #?(:clj (println (.getMessage e))\n       :cljs (println\
  \ (.-message e)))))\n```\n\nIn ClojureScript, (.-message e) retrieves the error\
  \ message. .-function calls host JavaScript functions.\n\n## How it works...\n\n\
  Here, we will explain the form of Reader Conditionals and Splice macros.\n\n## The\
  \ form of Reader Conditionals and Splice macros\n\nThe form of Reader Conditionals\
  \ is as follows:\n\n```\n#?(:clj  (Clojure expression)\n:cljs (ClojureScript expression)\n\
  :clr (Clojure CLR expression))\n```\n\nWhen the preceding code runs on Clojure,\
  \ (Clojure expression) is evaluated. When the code runs on ClojureScript, (ClojureScript\
  \ expression) is evaluated and vice versa.\n\nSplice Reader Conditional macros are\
  \ the same as Reader Conditional macros, but an expression must be a vector. The\
  \ expression will be spliced into the resulting read.\n\nWe will write the following\
  \ code:\n\n```\n(defn test-splicing-hello []\n  #?@(:clj [(print \"hello \") (print\
  \ \"world !\") (print \"\\n\")])\n;;=> #'cljc-example.demo/test-splicing-hello\n\
  ```\n\nThe expression for the Splice Reader Conditional macro is a vector, and the\
  \ result of executing the method is as follows:\n\n```\n(test-splicing-hello)\n\
  ;;=> hello world !\n;;=> nil\n```\n\nThe preceding code is equivalent to the following\
  \ one:\n\n```\n(defn test-hello []\n  (print \"hello \") (print \"world !\") (print\
  \ \"\\n\"))\n;;=> #'cljc-example.demo/test-hello\n```\n\nSplice Reader Conditional\
  \ macros cannot be located at top level. If we do that, an exception like the following\
  \ is thrown:\n\n```\n#?@(:clj\n  [(print \"hello \") (print \"world !\") (print\
  \ \"\\n\")])\n;;=> RuntimeException Reader conditional splicing not allowed at the\
  \ top level. clojure.lang.Util.runtimeException (Util.java:221)\n```\n\nSplice Reader\
  \ Conditional macros are often used in require/import. We will show an example in\
  \ this recipe.\n\n## Macros in ClojureScript\n\nClojureScript's macros are different\
  \ from those of Clojure. In ClojureScript, macros are defined in a different compilation\
  \ stage rather than the one from where they are consumed.\n\nSo, we need to use\
  \ the `:include-macros` or `:require-macros` keyword in namespace declarations for\
  \ ClojureScript.\n\nThe `:include-macros` is a sugar for `:require-macros`:\n\n\
  ```\n(:require [quil.core :as q :include-macros true])\n```\n\nThe preceding code\
  \ is the equivalent to the following one:\n\n```\n(:require [quil.core :as q])\n\
  (:require-macros [quil.core :as q])\n```\n\n## There's more...\n\nWe will use Quil,\
  \ which is an interactive library for drawings and animations. Quil supports both\
  \ Clojure and ClojureScript. We will learn how our single source code runs on two\
  \ different environments.\n\n## Building an application for Clojure and ClojureScript\n\
  \nWe will learn a more complex usage of Reader Conditionals. We will develop a graphical\
  \ demonstration for Clojure and ClojureScript.\n\nSo, we will create runtimes for\
  \ Clojure and ClojureScript with a single source file (.cljc). We will use Quil,\
  \ which is a Clojure/ClojureScript library for interactive graphics. It provides\
  \ over 200 functions that allows it to draw in 2D, 3D, and even in PDF.\n\nThe original\
  \ demo is in the home page in Quil, so let's see how to run it in both Clojure and\
  \ ClojureScript.\n\nAlthough the steps here are rather long, we will not only learn\
  \ how to write code for Clojure and ClojureScript using Reader Conditionals, but\n\
  \nwe will also learn steps for building and running the two different environments\
  \ from single source code.\n\n## Adding a cljc file for demonstrating Quil\n\nLet's\
  \ add the quil_demo.cljc file, which shows the Quil demo for Clojure and ClojureScript.\
  \ The location of the file is under the src/cljc_example directory, as shown in\
  \ the following screenshot:\n\n![](img/d7b631352a782ee50160cf8eb995152f_466_0.png)\n\
  \nWe will modify the generated project.clj. We will add the quil library as follows:\n\
  \n```\n:dependencies [[org.clojure/clojure \"1.8.0\"]\n                [org.clojure/clojurescript\
  \ \"1.8.51\"]\n                [org.clojure/core.async \"0.2.374\"\n           \
  \      :exclusions [org.clojure/tools.reader]]\n                [sablono \"0.3.6\"\
  ]\n                [org.omcljs/om \"0.9.0\"]\n                [quil \"2.4.0\"]]\n\
  ```\n\nIn the dependency section, we have added [quil \"2.4.0\"]. Then we will replace\
  \ the main namespace from cljc-example.core to cljc-example.quil-demo in the cljsbuild\
  \ section as follows:\n\n```\n:cljsbuild {:builds\n```\n\n```\n[{:id \"dev\"\n \
  \ :source-paths [\"src\"]\n  ;; If no code is to be run, set :figwheel true\nfor\
  \ continued automagical reloading\n  :figwheel {:on-jsload \"cljc-example.quil-demo/on-js-reload\"\
  }\n  :compiler {:main cljc-example.quil-demo\n             :asset-path \"js/compiled/out\"\
  \n             :output-to\n\"resources/public/js/compiled/cljc_example.js\"\n  \
  \           :output-dir\n\"resources/public/js/compiled/out\"\n             :source-map-timestamp\
  \ true}}\n  ;; This next build is an compressed minified\nbuild for\n  ;; production.\
  \ You can build this with:\n  ;; lein cljsbuild once min\n  {:id \"min\"\n   :source-paths\
  \ [\"src\"]\n   :compiler {:output-to\n\"resources/public/js/compiled/cljc_example.js\"\
  \n              :main cljc-example.quil-demo\n              :optimizations :advanced\n\
  \              :pretty-print false}}]\n```\n\nAfter we finish the preceding modifications,\
  \ let's restart REPL and Figwheel REPL. We will declare quil and om libraries for\
  \ Clojure and ClojureScript:\n\n```\n(ns cljc-example.quil-demo\n  (:require\n \
  \  #?@(\n     :clj\n     [[quil.core :as q]\n      [quil.middleware :as m]]\n  \
  \   :cljs\n     [[quil.core :as q :include-macros true]\n      [quil.middleware\
  \ :as m]\n      [om.core :as om :include-macros true]\n      [om.dom :as dom :include-macros\
  \ true]]\n     ))\n  #?(:clj (:gen-class)))\n```\n\nThe following code is for ClojureScript\
  \ to add the canvas tag for drawing graphics used by Quil:\n\n```\n#?( :cljs (defn\
  \ on-js-reload [] ;; optionally touch your app-state to force rerendering depending\
  \ on ;; your application ;; (swap! app-state update-in [:__figwheel_counter] inc)\
  \ )) #?( :cljs (def app-state (atom {:text \"Hello quil demo !\"}))) #?( :cljs (enable-console-print!))\
  \ #?( :clj (println \"Using Clojure !\") :cljs (println \"Using Clojurescript !\"\
  )) #?( :cljs (om/root (fn [data owner] (reify om/IRender (render [_] (dom/canvas\
  \ #js {:id \"my-sketch\" :height 400 :width 400}))) ) app-state {:target (. js/document\
  \ (getElementById \"app\"))}))\n```\n\nCode here is animating a circle for Clojure\
  \ and ClojureScript. Fortunately, code is the same in them:\n\n```\n(defn setup\
  \ [] (q/frame-rate 60) (q/color-mode :hsb) {:color 0 :angle 0}) (defn update-state\
  \ [state] {:color (mod (+ (:color state) 0.7) 255) :angle (+ (:angle state) 0.1)})\
  \ (defn draw-state [state] (q/background 240) (q/fill (:color state) 255 255) (let\
  \ [angle (:angle state) x (* 150 (q/cos angle))\n```\n\n```\ny (* 150 (q/sin angle))]\n\
  (q/with-translation [(/ (q/width) 2)\n                    (/ (q/height) 2)]\n  (q/ellipse\
  \ x y 50 50)))\n```\n\n```\n(defn run[]\n  (q/defsketch my-sketch\n    :host \"\
  my-sketch\"\n    :size [500 500]\n    :setup setup\n    :update update-state\n \
  \   :draw draw-state\n    :middleware [m/fun-mode]))\n```\n\nsetup is the initial\
  \ setup function, and update - state updates the current state.\n\n## Testing cljc\
  \ code in both Clojure and ClojureScript\n\nWe will test the preceding code in REPLs\
  \ in both Clojure and ClojureScript. Let's test it in the Clojure REPL first. Let's\
  \ type the following:\n\n```\n(run)\n```\n\nThen, a new window will open and you\
  \ can see the following:\n\n![](img/d7b631352a782ee50160cf8eb995152f_469_0.png)\n\
  \n\n\n\n\n然后，我们将在 Figwheel REPL 下的 ClojureScript 中测试它。Figwheel 会检查代码更新并刷新浏览器。因此，让我们保存代码，就可以看到如下动画：\n\
  \n![](img/d7b631352a782ee50160cf8eb995152f_470_0.png)\n\n## 构建并运行演示\n\n现在，让我们为 Clojure\
  \ 和 ClojureScript 生成运行时代码，以便在没有 REPL 开发环境的情况下运行它们。我们将添加以下代码来在没有 REPL 的情况下运行演示：\n\
  \n```\n#? (\n  :clj\n  (defn -main [& args] (run)\n    )\n  :cljs (run))\n```\n\n\
  在 Clojure 中，需要从 REPL 外部调用名为 `-main` 的函数。另一方面，调用 `(run)` 会为 ClojureScript 启动动画。以下步骤是在\
  \ REPL 外部设置和测试 Clojure 演示。为此，让我们在 project.clj 中添加 main 部分：\n\n```\n:main cljc-example.quil-demo\n\
  ```\n\n然后，输入以下内容：\n\n```\n$ lein run\n```\n\n`lein run` 会调用 project.clj 的 `:main`\
  \ 部分中声明的命名空间中的 `-main` 函数，并启动演示。现在，是时候在没有 REPL 的情况下运行演示了。我们必须修改 uberjar 的主类命名空间，如下所示：\n\
  \n```\n:profiles {\n    :uberjar {\n        :aot [cljc-example.quil-demo]\n    \
  \    :main cljc-example.quil-demo\n    }\n    :dev {:dependencies [[figwheel-sidecar\
  \ \"0.5.3-1\"]\n                          [com.cemerick/piggieback\n           \
  \                \"0.2.1\"]]\n          ;; need to add dev source path here to get\
  \ user.clj loaded\n          :source-paths [\"src\" \"dev\"]\n          ;; for CIDER\n\
  \          ;; :plugins [[cider/cider-nrepl \"0.12.0\"]]\n          :repl-options\
  \ {; for nREPL dev you really need to limit output\n                          :init\
  \ (set! *print-length* 50)\n                          :nrepl-middleware [cemerick.piggieback/wrap-cljs-repl]}}}\n\
  ```\n\n然后，我们将执行以下命令来生成 uberjar 文件：\n\n```\n$ lein uberjar\n```\n\n![](img/d7b631352a782ee50160cf8eb995152f_472_0.png)\n\
  \n由 uberjar 生成的 JAR 文件包含 project.clj 的依赖部分中定义的所有类。它还包含 Clojure 核心类。因此，JAR 文件很大，生成需要时间。让我们在\
  \ JVM 下运行演示。以下命令行启动演示：\n\n```\n$ java -jar target/cljc-example-0.1.0-SNAPSHOT-standalone.jar\n\
  ```\n\n我们将为你的浏览器构建运行时。执行以下命令会将 ClojureScript 编译为 JavaScript：\n\n```\n$ lein cljsbuild\
  \ once min\n```\n\n在下面的截图中，检查编译是否成功：\n\n![](img/d7b631352a782ee50160cf8eb995152f_472_1.png)\n\
  \n我们可以在 `:cljsbuild` 部分中指定 `dev` 或 `min` 作为构建选项：\n\n```\n:cljsbuild {:builds\n \
  \ [{:id \"dev\"\n    :source-paths [\"src\"]\n    ......\n    {:id \"min\"\n   \
  \ :source-paths [\"src\"]\n    :compiler {:output-to\n\"resources/public/js/compiled/cljc_example.js\"\
  \n```\n\n```\n:main cljc-example.quil-demo\n:optimizations :advanced\n:pretty-print\
  \ false}]]}\n```\n\n`min` 选项以最高优化程度提升性能，并生成最小的 JavaScript 代码，将其打包到单个文件中。它会将变量和函数的名称改为更短的名称。`min`\
  \ 选项会生成混淆代码。另一方面，`dev` 选项不进行优化，用于开发和调试；然而，它的性能较慢。`resources/public/js/compiled/cljc_example.js`\
  \ 是从 ClojureScript 生成的单个 JavaScript 代码。\n\n`auto` 选项会在 ClojureScript 代码被修改时自动生成\
  \ JavaScript 代码。以下选项对调试很有用：\n\n```\n$ lein cljsbuild auto min\n```\n\n现在，我们将在你的浏览器中运行演示。以下命令会打开一个新的浏览器会话并启动演示：\n\
  \n```\n$ browser resources/public/index.html\n```\n\n运行 ClojureScript 演示只需要以下文件：\n\
