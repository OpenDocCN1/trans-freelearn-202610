    \   4. The previous UI class will be responsible for writing or delegating all\
    \ the Java code describing the application.\n+   5. Finally, in the context of\
    \ this recipe, the UI Java class will make use of the usual way of plugging Clojure\
    \ scripts in a Java app, making the processing dynamic, and refreshing on each\
    \ request.\n\nWhat does that give in Clojure then? You want here to have Clojure\
    \ code implementing the init method of the UI class, where that init"
