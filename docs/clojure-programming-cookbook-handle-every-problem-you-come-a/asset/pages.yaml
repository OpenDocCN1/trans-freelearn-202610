- pgno: 165
  md: "It makes more sense with an example, so let's do it:\n\n```\n(defmacro hello2d\
    \ [arg]\n  `(+ 1 ~arg))\n```\n\nWe are now introducing two different characters:\
    \ unquote, or ~, and unquote splicing, or ~@. Think of unquote and unquote splicing\
    \ as copy and paste, where you can insert the form directly in the generated code.\
    \ So in the preceding code, the generated code should expand to the actual value\
    \ of the arg, and not simply the arg string:\n\n```\n(macroexpand-1 '(hello2d\
    \ 3))\n; (clojure.core/+ 1 3)\n```\n\nWow! This feels way better, doesn't it.\
    \ Let's just confirm if it can be evaluated properly:\n\n```\n(hello2d 3)\n; 4\n\
    ```\n\nFinally, unquote splicing makes sense with list, maps, and so on, but the\
    \ copy/paste idea stays the same. One copy and pastes the list as is, while the\
    \ other copies the forms one by one into the template:\n\n```\n(defmacro hello2e\
    \ [& body ]\n  `(apply str ~body))\n```\n\n```\n(defmacro hello2f [& body ]\n\
    \  `(apply str ~@body))\n```\n\n```\n(macroexpand-1 '(hello2e \"1\" \"2\" \"3\"\
    ))\n; (clojure.core/apply clojure.core/str (\"1\" \"2\" \"3\"))\n```\n\n```\n\
    (macroexpand-1 '(hello2f  \"1\" \"2\" \"3\"))\n; (clojure.core/apply clojure.core/str\
    \ \"1\" \"2\" \"3\")\n```\n\n# Macros everywhere\n\nIn this recipe, we have seen\
    \ how to create our very first macro, and moved along to grasping what compiled\
    \ code is and when it occurs in the code lifecycle. We saw that Clojure was a\
    \ homogenic language,"
