  md: '# Macros in ClojureScript


    ClojureScript''s macros are different from those of Clojure. In ClojureScript,
    macros are defined in a different compilation stage rather than the one from where
    they are consumed.


    So, we need to use the `:include-macros` or `:require-macros` keyword in namespace
    declarations for ClojureScript.


    The `:include-macros` is a sugar for `:require-macros`:


    ```

    (:require [quil.core :as q :include-macros true])

    ```


    The preceding code is the equivalent to the following one:


    ```

    (:require [quil.core :as q])

    (:require-macros [quil.core :as q])

    ```


    # There''s more...


    We will use Quil, which is an interactive library for drawings and animations.
    Quil supports both Clojure and ClojureScript. We will learn how our single source
    code runs on two different environments.


    # Building an application for Clojure and ClojureScript


    We will learn a more complex usage of Reader Conditionals. We will develop a graphical
    demonstration for Clojure and ClojureScript.


    So, we will create runtimes for Clojure and ClojureScript with a single source
    file (.cljc). We will use Quil, which is a Clojure/ClojureScript library for interactive
    graphics. It provides over 200 functions that allows it to draw in 2D, 3D, and
    even in PDF.


    The original demo is in the home page in Quil, so let''s see how to run it in
    both Clojure and ClojureScript.


    Although the steps here are rather long, we will not only learn how to write code
    for Clojure and ClojureScript using Reader Conditionals, but'
