    \ {:content-type \"text/plain\" :type \"message\"})))\n;;=> #'chapter04.rabbitmq/simple-producer\n\
    ```\n\nFirst, the producer connects to the RabbitMQ server using langohr.core/connect.\
    \ Then it opens a channel of the connection using langohr.channel/open.\n\nAfter\
    \ that, the producer declares a queue by langohr.queue/declare and publishes a\
    \ message by langohr.basic/publish.\n\n# Defining a message handler and consumer\n\
    \nWe will define a message handler used by consumer:\n\n```\n(defn message-handler\n\
    \  [ch {:keys [content-type delivery-tag type] :as meta} ^bytes payload]\n  (println\n\
    \    (str \"Received a message payload : \" (String. payload \"UTF-8\") \" , tag\
