    \ for :c\n\nRunning the previous Herbert generators gives you:\n\n```\n; {:c \"\
    \", :b (*mt), :a 0}\n; {:c \"\", :b [_... !.Z _B3.], :a 0}\n; {:c \"}\", :b (.14\
    \ .), :a 9223372036854775807})\n```\n\nAnd obviously running it twice gives different\
    \ values, but all the values are according to the grammar.\n\nAnother example,\
    \ this time generating one map with more details:\n\n```\n(hg/sample '{:a num\
    \ :b pos :c neg :d (vec int+ zero+)} 1)\n; ({:c -2.0, :b 1, :d [9223372036854775807\
    \ 0], :a 1.5E-5})\n```\n\nYou now have reviewed how to use generators and how\
    \ to create random values according to specific patterns. Let's put this into\
    \ action.\n\n# How to do it...\n\nQuickCheck, random-based testing takes the random\
    \ generator we have seen and uses it for testing.\n\nTo achieve this, you will:\n\
    \n+   - Write a specification, with a name\n+   - Write the size of the number\
    \ of sampling iterations\n+   - Define random patterns for inputs to the specification\n\
    +   - Define a set of properties to check for each random value\n\n# Your first\
    \ test.check specification\n\nKeeping this in mind, let's go through a first specification\
    \ and a first example. Let's import some namespaces for properties, generators,\
    \ and a test helper named defspec:\n\n```\n(ns quickchecks.core\n  (:require \
    \ [clojure.test.check.properties :as prop])\n```"
