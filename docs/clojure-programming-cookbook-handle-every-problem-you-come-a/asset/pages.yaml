- pgno: 631
  md: "tufte is much simpler and no warm-up is necessary. Additionally, it measures\
    \ multiple expressions at a time and generates comparison reports.\n\nWe will\
    \ use taoensso.tufte/profile and taoensso.tufte/p to run benchmarks and get reports\
    \ of them. The following is how we make use of profile. Let's assume we'd like\
    \ to compare three expressions:\n\n```\n(tufte/add-basic-println-handler! {})\n\
    ;;=> #{:basic-println}\n(profile {}\n  (dotimes [_ 10]\n    (p :apply  (apply\
    \ + (map #(* % %) (range 1 1000001))))\n    (p :map  (reduce + (map #(* % %) (range\
    \ 1 1000001))))\n    (p :reducers (r/fold + (r/map #(* % %) (range 1 1000001))))))\n\
    ;;=>          pId      nCalls      Min        Max        MAD\nMean  Time% Time\n\
    ;;=>        :map        10     97.0ms   148.02ms   17.27ms\n113.45ms    37 1.13s\n\
    ;;=>        :apply      10     95.26ms  149.86ms   13.86ms\n106.6ms     35 1.07s\n\
    ;;=>  :reducers      10     75.67ms  106.29ms   9.25ms\n84.31ms     28 843.07ms\n\
    ;;=>    Clock Time\n100 3.05s\n;;=>Accounted Time\n100 3.04s\n;;=> nil\n```\n\n\
    # Using jvisualvm\n\njvisualvm is included in Oracle's JDK. Using jvisualvm, you\
    \ can see a lot of JVM activities which Clojure is running. Let's run jvisualvm\
    \ and connect to your Clojure REPL.\n\nTo run jvisualvm, you need to install Oracle's\
    \ JDK. jvisualvm exists in the $JAVA_HOME/bin. You need to add that path to $PATH\
    \ and start jvisualvm as follows:\n\n```\n$ jvisualvm\n```"
