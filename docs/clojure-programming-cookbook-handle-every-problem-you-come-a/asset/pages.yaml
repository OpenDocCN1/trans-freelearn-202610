- pgno: 242
  md: "```\n; ;=> #'chapter04.rabbitmq/message-handler\n```\n\nThe message handler\
    \ has three parameters: channel, metadata, and payload. The example message handler\
    \ simply prints metadata and payload.\n\nThen, we will define a consumer. The\
    \ consumer gets a connection, opens a channel, and then consumes messages published\
    \ by the producer. The langohr.consumers/subscribe is used to obtain messages:\n\
    \n```\n(defn simple-consumer [qname]\n  (with-open\n    [conn (core/connect {:host\
    \ *host*})*}\n    ch (channel/open conn)]\n    (println (str \"simple-consumer\
    \ is connected with id: \"\n (.getChannelNumber ch)))\n    (consumers/subscribe\
    \ ch qname message-handler {:auto-ack true})))\n```\n\n```\n; ;=> #'chapter04.rabbitmq/simple-consumer\n\
    ```\n\n# Testing producer and consumer\n\nLet's test how the producer and consumer\
