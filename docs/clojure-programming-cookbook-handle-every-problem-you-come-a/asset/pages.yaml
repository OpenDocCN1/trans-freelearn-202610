- pgno: 196
  md: "on core.logic itself:\n\n```\n[org.clojure/core.logic \"0.8.10\"]\n```\n\n\
    To check if everything is set up properly, we can already copy and paste our first\
    \ logic program as follows:\n\n```\n(ns chapter03.logic\n(:use [clojure.core.logic])\n\
    (:require [clojure.core.logic.fd :as fd]))\n\n(run* [q]\n    (== q 1))\n; (1)\n\
    ```\n\nTwo Clojure imports, and our first goal!!! Find all the values of q that\
    \ equal 1. No need for a computer or a book to find the answer. Let's look at\
    \ the wording used here instead:\n\n+   - run* tells the logic engine to find\
    \ all the values.\n+   - q is the goal. There may be intermediate goals in the\
    \ logic program, but we are only interested in q, which is called a logic var\
    \ here, or lvar.\n+   - (== q 1) is the constraint. This says to find all the\
    \ values that are equal to 1.\n\nOur first baby steps; many more coming.\n\n#\
    \ Getting to know the \"o\" vocabulary\n\nFor some reason, out of scope here,\
    \ core.logic uses function naming. Apart from the naming, their usage is actually\
    \ pretty straightforward, so let's review the main ones. We will go quickly through\
    \ them, so make sure you type them in the REPL and experiment a bit to get accustomed\
    \ to the language.\n\n# conso: check for vector association\n\nHere we look for\
    \ a list of items q, such that q results from 1 concatenated to a list of items\
    \ (2 3):\n\n```\n(run* [q]\n```"
  merge: -1
  img_proc: true
- pgno: 197
  md: "```\n(conso 1 [2 3] q)\n; ((1 2 3))\n```\n\nNote that this is one result, and\
    \ that result is (1 2 3).\n\n# resto: check for the rest of a vector\n\nHere we\
    \ look for a var, such that this var equals the rest of vector [1 2 3 4]:\n\n\
    ```\n(run* [q]\n  (resto [1 2 3 4] q))\n; ((2 3 4))\n```\n\nNote that this is\
    \ one result, and that result is (2 3 4).\n\n# membero\n\nKeep going on. We want\
    \ to find a value q, such that 7 is a member of [1 3 8 q]:\n\n```\n(run* [q]\n\
    \  (membero 7 [1 3 8 q]))\n; (7)\n```\n\nOf course, we can have multiple statements\
    \ while looking for a result. Let's say we want to find q such that q is a member\
    \ of [1 2 3] and a member of [2 3 4]. This is pretty much a vector intersection:\n\
    \n```\n(run* [q]\n  (membero q [1 2 3])\n  (membero q [2 3 4]))\n; (2 3)\n```\n\
    \nThat gives us two solutions: q can either be 2 or 3.\n\nStatements can be mixed,\
    \ of course. Say we want to find members of [1 2 3] that are not 2:\n\n```\n(run*\
    \ [q]\n  (!= q 2)\n  (membero q [1 2 3]))\n; (1 3)\n```"
  merge: -1
  img_proc: true
- pgno: 198
  md: "As seen here, both 1 and 3 are valid solutions.\n\n# appendo: appending list\n\
    \nSee how we look for q such that the concatenation of two known lists results\
    \ in q, or the concatenation of a known list and q returns a known list:\n\n```\n\
    (run* [q] (appendo [1 2] [3 4] q))\n; ((1 2 3 4))\n(run* [q] (appendo [1 2] q\
    \ [1 2 3 4]))\n; ((3 4))\n```\n\nNote, there is only one solution each time, and\
    \ each time it is a list.\n\n# conde\n\nThe logic function conde does not end\
    \ in o, but it is quite useful. It works like OR. See how we check that q is either\
    \ 1 or 2:\n\n```\n(run* [q]\n    (conde\n      [(== q 1)]\n      [(== q 2)]))\n\
    ; (1 2)\n```\n\n# Matche\n\nMatche does all your pattern matching magic. In this\
    \ example, we want to do pattern matching against an array of five elements [1\
    \ 2 3 4 5]. We want to find q such that it is similar to [1 q], where a is any\
    \ value, and q denotes a subarray, and [1 * q] is equal to [1 2 3 4 5]. The underscore\
    \ sign is a wildcard, and the dot sign denotes that what is coming after is, or\
    \ should, be a subarray:\n\n```\n(run* [q]\n  (fresh [a]\n    (== a [1 2 3 4 5])\n\
    \    (matche [a]\n      ([ [1 _ . q ]]))))\n; ((3 4 5))\n```\n\nItem 2 of the\
    \ array is being ellipsed by the wildcard; the only possible"
