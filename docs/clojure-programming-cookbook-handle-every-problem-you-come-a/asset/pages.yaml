- pgno: 487
  md: "```\n(let [address (InetAddress/getByName bind)\n      ss (new ServerSocket\
    \ port)]\n  (on-thread\n    #(when-not (. ss (isClosed))\n         (try (accept-socket\
    \ (. ss (accept)))\n              (catch Exception e))\n         (recur)))\n \
    \   ss))\n\n(defn repl\n  [ins outs]\n  ; set some bindings for the evaluation\n\
    \  (binding [*ns* (create-ns 'user)\n            *warn-on-reflection* false\n\
    \            *out* (new OutputStreamWriter outs)]\n    (let [eof (new Object)\n\
    \          r (new LineNumberingPushbackReader\n              (new InputStreamReader\
    \ ins))]\n      (loop [e (read r false eof)]\n        (when-not (= e eof)\n  \
    \        (prn (eval e))\n          (flush)\n          (recur (read r false eof)))))))\n\
    \n(defn socket-repl\n  [s] (on-thread\n       #(repl (. s (getInputStream)) (.\
    \ s (getOutputStream)))))\n\n(def server\n  (create-server socket-repl \"0.0.0.0\"\
    \ 9001))\n\n; (. server (close))\n```\n\nYou can see from the previous code, we\
    \ create a set of local bindings in the repl function. The first binding *ns*\
    \ create a user namespace to use for evaluation of the different forms. Another\
    \ binding is *out* which simply pipes the output of the evaluation to the socket\
    \ used for output.\n\nFinally, each connection creates a thread, with input and\
    \ output used as bindings in the eval function call.\n\n# Client\n\nWriting a\
    \ simple client that would connect to the preceding server is also"
