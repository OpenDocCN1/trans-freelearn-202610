- pgno: 325
  md: '# ClojureCLR


    ClojureCLR is a way to use and port your Clojure code to a .NET runtime. There
    are different levels in achieving this integration; why you want to run your Clojure
    code on the CLR is going to be at the root of your usage and of its different
    patterns. You may simply have stumbled upon some fantastic looking Clojure code,
    but with all those brackets you are not sure if you can debug it or not yet, so
    you just want to embed the clj algorithm and be able to run this on the command
    line or through a Windows native interface. You may be tempted to create Windows
    User Interfaces from the usual Clojure REPL, which is also possible using ClojureCLR.
    You may also want to distribute you Clojure code into a Windows Dynamic-link Library
    (DLL) and give it to a customer so he can call it natively.


    In this recipe, we will look at all those different options and will also learn
    how to be productive on the CLR.


    While working through this recipe, you will also realize, again, how the memory
    footprint of .NET programs is often lower than their Java VM counterparts, which
    makes a nice argument for Clojure when running on memory-limited environments.


    Writing this recipe made the author wanting to write more C# and other related
    .NET code and even to write some mobile apps. Now it''s your turn to get excited.


    # Getting ready


    There is actually quite a lot we need to do to get ready for this recipe. Also,
    make sure to not go around the web and try to combine indications from other web
    sources with this one. Things have gotten a lot better over time with regard to
    installation and integration, so there is no need to revert to outdated instructions.


    First, on Windows, it is recommended you install Visual Studio.'
  merge: -1
  img_proc: true
