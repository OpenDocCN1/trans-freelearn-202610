  md: "```\n`(-> 2\n    (+ 1)\n    (+ 2)))\n; (clojure.core/+ (clojure.core/+ 2 1)\
    \ 2)\n```\n\nSimilarly, with the ->> macros, the code generated would look like\
    \ a simple code reorganization, where the first function call is the innermost\
    \ call, and then we build more and more beautiful brackets around it:\n\n```\n\
    (macroexpand-1\n  `(->> 5\n        (- 1)\n        (- 2)))\n; (clojure.core/- 2\
    \ (clojure.core/- 1 5))\n```\n\nAs we have seen when introducing some->, the nil\
    \ guard shows clearly when expanding a sum macro:\n\n```\n(macroexpand-1 '  (some->\
    \ {:speed [50 90]}\n    :speed\n    ))\n; (clojure.core/let [G__12916 {:speed\
    \ [50 90]}] (if\n(clojure.core/nil? G__12916) nil (clojure.core/-> G__12916\n\
    :speed)))\n```\n\nHow it works is pretty easy to grasp, but I am pretty sure you'll\
    \ be okay with skipping a few autogenerated function names at this stage, so let's\
    \ see what's more!\n\n# There's more...\n\nWe actually left out one of those threading\
    \ macros for the end because historically, it has been added slightly later and\
    \ because it somehow combines both the -> and the ->> ways.\n\n# Introducing as->\n\
    \nThe main difference with as-> is that it is the only one where you can position\
    \ the parameter for threading at will. -> passes the value as the first parameter,\
    \ ->>, as the last parameter, and as-> does both through a clever but very simple\
    \ name binding."
