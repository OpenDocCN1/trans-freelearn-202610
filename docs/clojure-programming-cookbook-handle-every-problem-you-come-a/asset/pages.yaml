- pgno: 521
  md: "reactive code with listeners. To send messages asynchronously, not reacting\
    \ to user interaction, you will use something named server-side push. Server-side\
    \ push requires you to do a few things:\n\n+   - Set up an additional specific\
    \ Vaadin library\n+   - Set up the application to support push, and start the\
    \ push WebSocket framework\n+   - Add some asynchronous UI update code\n\nLet's\
    \ go through an example by looking at how to send a message to the client a few\
    \ seconds after the application has started.\n\nFirst, the additional library,\
    \ unsurprisingly, is named vaadin-push and goes into your project.clj file:\n\n\
    ```\n[com.vaadin/vaadin-push \"7.6.6\"]\n```\n\nSecond, the first line of Clojure\
    \ code in the application will set up the push mechanism:\n\n```\n( .setPushMode\n\
    \  (.getPushConfiguration ui)\n  (com.vaadin.shared.communication.PushMode/AUTOMATIC))\n\
    ```\n\nThis is a bit cryptic, but basically this just sets the push mechanism\
    \ to start. Third, or actually before third, let's try to write an async update\
    \ of the UI:\n\n```\n(defn runme []\n  (reify Runnable\n    (run [_]\n      (Thread/sleep\
    \ 3000)\n      ; (Notification/show \"Does not work\"))))\n    (-> (UI/getCurrent)\
    \ (.access async-ui-update))))\n```\n\n```\n(defn main[ui]\n  (.setPushMode\n\
    \    (.getPushConfiguration ui)\n    (com.vaadin.shared.communication.PushMode/AUTOMATIC))\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 522
  md: "```\n(let [layout (VerticalLayout.)]\n    (.addComponent layout (Label. \"\
    I am getting sleepy ~~~\"))\n    (.start (Thread. (runme)))\n    layout\n)\n```\n\
    \nThe code reads by doing a simple layout, starting a thread, and, after 3 seconds,\
    \ displaying the notification. Running the code by yourself... You will notice\
    \ very quickly that...the thread starts, waits for 3 seconds and...does nothing.\
    \ As you read it properly, it doesn't work. What's wrong?\n\nThe reason behind\
    \ the lack of visual update is that the thread that was spawned is not the UI\
    \ thread anymore, so the refresh does not link to existing UI objects and the\
    \ update fails.\n\nTo perform an async update, we will implement a new Runnable,\
    \ and ask the UI thread to perform the async update. This is done with UI/getCurrent\
    \ to retrieve the UI thread, and .access to perform the async update.\n\nSo, with\
    \ those few updates, you now have the following code:\n\n```\n(def async-ui-update\n\
    \    (reify Runnable\n      (run [_]\n        (Notification/show \"Let's sleep\"\
    ))))\n\n(defn runme []\n    (reify Runnable\n      (run [_]\n        (Thread/sleep\
    \ 3000)\n        ; (Notification/show \"Does not work\"))))\n    (-> (UI/getCurrent)\
    \ (.access async-ui-update))))\n```\n\nAnd finally, the notification shows the\
    \ following:"
  merge: -1
  img_proc: true
- pgno: 523
  md: "![](img/d7b631352a782ee50160cf8eb995152f_523_0.png)\n\n# There's more...\n\n\
    The bricks are laid to do a bit of reactive programming with Vaadin. Let's look\
    \ at some cases.\n\n# Reactive Vaadin - ideas\n\nWe will add a standard Clojure\
    \ atom here to be the reactive point, plus a listener on that atom to perform\
    \ the async UI updates.\n\nThis example adds a reactive text field that shows\
    \ a notification when its value has been updated:\n\n```\n(def last-value\n  (atom\
    \ \"\"))\n\n(defn runme [msg]\n  (let [async-ui-update\n        (proxy [Runnable]\
    \ [] (run [] (Notification/show msg)))]\n    (-> (UI/getCurrent) (.access async-ui-update))))\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 524
  md: "```\n(defn my-layout [layout]\n  (.addComponent layout (Label. \"Write something\"\
    ))\n\n  (let [first-name (TextField.)]\n    (.addComponent layout first-name)\n\
    \n    (.addValueChangeListener first-name\n      (proxy [Property$ValueChangeListener]\
    \ []\n        (valueChange [event]\n          (dosync (reset! last-value\n   \
    \         (-> event (.getSource) (.getValue))))))))\n\n(defn main [ui]\n  (.setPushMode\n\
    \    (.getPushConfiguration ui)\n    (com.vaadin.shared.communication.PushMode/AUTOMATIC))\n\
    \  (let [base (VerticalLayout.)]\n    (my-layout base)\n\n    (add-watch last-value\
    \ :listener\n      (fn [key atom old-state new-state]\n        (runme new-state)))\n\
    \  base))\n```\n\nYou already saw the async UI update mechanism. Here, the new\
    \ event that will be listened to is Property$ValueChangeListener, which is fired\
    \ when the text field gets a different value after user input. The atom will then\
    \ hold the last and current value of the text field. Finally, a listener on the\
    \ atom will fire the async UI update on the atom value being updated:"
  merge: -1
  img_proc: true
- pgno: 525
  md: "![](img/d7b631352a782ee50160cf8eb995152f_525_0.png)\n\n# Reactive Vaadin -\
    \ CPU monitoring\n\nOne of the obvious advantages of Vaadin-ing is that you write\
    \ server-side code, and some of it gets translated to the browser side.\n\nSo\
    \ we could monitor the CPU usage of a Raspberry Pi, and display its CPU usage.\
    \ We will use a convenient scheduling library, hara.ui, to achieve the CPU polling\
    \ on the server side, and then reuse the technique of the atom + atom listener\
    \ to display the updates on the client side.\n\nTo add hara.io to the project,\
    \ let's add a line to project.clj:\n\n```\n[im.chit/hara.io.scheduler \"2.3.6\"\
    ]\n```\n\nThen expand on the example code:\n\n```\n(ns ex1\n  (:use [clojure.java.shell\
    \ :only [sh]])\n  (:use [hara.io.scheduler]))\n```"
  merge: -1
