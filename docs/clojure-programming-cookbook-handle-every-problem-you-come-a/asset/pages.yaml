    (def our-pub (pub input-chan :food))\n```\n\nYou can then define subscribers to\
    \ this publisher using sub, the pub just defined, and an output channel:\n\n```\n\
    ; subscribe\n(def burger-chan (chan))\n(sub our-pub :burger burger-chan)\n\n(def\
    \ sushi-chan (chan))\n(sub our-pub :sushi sushi-chan)\n```\n\nFinally, with some\
