- pgno: 554
  md: "# Working with Immutant - reusing infrastructure\n\nImmutant is not your usual\
    \ Clojure web framework. Immutant allows you to build into existing and robust\
    \ middleware, WildFly, aka JBoss, and deploy your software in an elegant fashion.\
    \ In this recipe, you will see how to enhance your ring application with the wide\
    \ range of services available through the Immutant framework.\n\nWhile Immutant\
    \ makes it easy to deploy to WildFly, the development environment is entirely\
    \ contained and can be done without extra download or installation. Let's have\
    \ a look!\n\n# Getting ready\n\nThis first section will probably be totally disappointing;\
    \ at this stage, we are fully in the domain of Clojure and things work out of\
    \ the box. Terrible, huh?\n\nHere is the project.clj file, with the full list\
    \ of libraries required:\n\n```\n(defproject mutant1 \"0.1.0-SNAPSHOT\"\n  :dependencies\
    \ [\n    [org.clojure/clojure \"1.8.0\"]\n    [org.immutant/immutant \"2.1.4\"\
    ]\n    [ring/ring-devel \"1.5.0\"]])\n```\n\nring-devel is added to the mix to\
    \ allow for development mode and a refresh on reload workflow.\n\nThe code to\
    \ build the web app follows the ring routing patterns, so most of the following\
    \ is pretty standard:\n\n```\n(ns mutant1.core\n  (:require [immutant.web :as\
    \ web]))\n\n(defn app [request]\n  {:status 200\n```"
