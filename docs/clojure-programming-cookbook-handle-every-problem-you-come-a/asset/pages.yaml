- pgno: 220
  md: "round-tripping encoding/decoding functions. As we will see, all the libraries\
    \ eventually convert the input format to Clojure, and so we can work directly\
    \ on the Clojure structures to retrieve the information we need.\n\n# XML\n\n\
    This may be the most famous or infamous data format. XML is the most verbose of\
    \ all the presented formats, but it has the advantage of being present in most\
    \ environments.\n\nParsing is done through the data.xml library:\n\n```\n(use\
    \ 'clojure.data.xml)\n```\n\nHere, we will access the remote weather.gov service\
    \ to send us the latest weather updates from the US. KSFO stands for San Francisco\
    \ because it is always so sunny in the bay:\n\n```\n(def input-xml\n  (slurp \"\
    http://w1.weather.gov/xml/current_obs/KSFO.rss\"))\n```\n\n```\n(def xml\n  (parse\
    \ (java.io.StringReader. input-xml)))\n```\n\nThe XML var contains a lazy sequence\
    \ on the elements of the parsed XML input. Every parsed element will look like\
    \ the following structure:\n\n```\n#clojure.data.xml.node.Element{:tag :channel,\
    \ :attrs {},\n:content ...}\n```\n\nAn XML element is a set of a tag, attributes,\
    \ and content.\n\nThe returned Clojure data structure corresponds directly to\
    \ the parsed XML, without the extra verboseness, so now we can use our beloved\
    \ threading macros to navigate the parsed document:\n\n```\n(->> xml\n  (:content)\n\
    \  first\n  (:content)\n  (map #(:content %)))\n```"
  merge: -1
  img_proc: true
- pgno: 221
  md: "```\nfirst)\n; (\"Weather at San Francisco, San Francisco International Airport...\"\
    )\n```\n\nGenerating XML works the other way around, where we use the element\
    \ function to create elements in the same data structure as previously:\n\n```\n\
    (element :friend {\"age\" 23} \"Chris\")\n; #clojure.data.xml.node.Element{:tag\
    \ :friend, :attrs {\"age\" 23}, :content (\"Chris\")}\n```\n\nWe can, of course,\
    \ construct more complex data structures, with the body of each element being\
    \ simply the last parameter of the element function:\n\n```\n(let [tags\n    \
    \  (element :friends {}\n        (element :friend {\"age\" 23} \"Chris\")\n  \
