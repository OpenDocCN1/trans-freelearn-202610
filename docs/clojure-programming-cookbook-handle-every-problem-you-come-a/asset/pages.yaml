- pgno: 486
  md: "Then, this is how you start and bind a new REPL server within your code:\n\n\
    ```\n(use '[clojure.tools.nrepl.server :only\n(start-server stop-server)])\n(def\
    \ server (start-server :bind \"0.0.0.0\" :port 7888))\n```\n\nJust for the fun\
    \ of it, and if you were running this embedded REPL within Atom connected to the\
    \ Raspberry Pi (!!), then the blinking code would still work!\n\nKeep blinking.\n\
    \n# There's more...\n\nNow that we have seen how to connect to a remote shared\
    \ REPL and have quite a bit of fun with remote berries, let's go beyond and see\
    \ how to write your own REPL.\n\n# Custom REPL using Java interop\n\nHere we will\
    \ have a look at how to write a simple REPL server and a client, with standard\
    \ Java interop code and regular socket connections.\n\n# Server\n\nThe following\
    \ server will be your point of entry to open a socket, send some Clojure forms\
    \ for evaluation, eval or execute the code on the server, and send the result\
    \ to the client.\n\nLet's see how this is done:\n\n```\n(ns custom-repl.server\n\
    \  (:import [java.net InetAddress ServerSocket Socket]\n           [java.io InputStreamReader\
    \ OutputStreamWriter]\n           [clojure.lang LineNumberingPushbackReader]))\n\
    ```\n\n```\n(defn on-thread [f]\n  (doto (new Thread f) (.start)))\n```\n\n```\n\
    (defn create-server\n  [accept-socket bind port]\n```"
