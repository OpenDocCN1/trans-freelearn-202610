    \ using either `proxy` or `reify`:\n\n```\n; using proxy\n(def event-change-fn\n\
    \  (proxy [CalendarEvent$EventChangeListener] []\n    (eventChange [eventChangeEvent]\n\
    \      (println eventChangeEvent))))\n```\n\n```\n; using reify\n(def event-change-fn\n\
    \  (reify CalendarEvent$EventChangeListener\n    (eventChange [this eventChangeEvent]\n\
    \      (println eventChangeEvent))))\n```\n\nThe choice is up to you, but do not\
    \ forget to add the handler in the calendar construction function:\n\n```\n( .addEventChangeListener\
    \ event-change-fn )\n```\n\nAfter refreshing the page, dragging the calendar event\
    \ up or down will trigger the handler, and prints some information for the updated\
    \ event on the command line.\n\nThis way of using `proxy` or `reify` will be widely\
    \ used in this recipe so make sure to play around a bit to master it before moving\
    \ on. It's a very important building block, so let's go through one more example\
    \ with a button handler.\n\n# Clicking a button\n\nClicking a button is about\
    \ implementing the `ClickListener` interface. Let's go through this together:\n\
    \n```\n(defn main [ui]\n  (let [layout (VerticalLayout.)\n        first-name (TextField.)\n\
    \        submit-button (Button. \"Submit\")]\n    (.addComponent layout (Label.\
    \ \"First Name\"))\n    (.addComponent layout first-name)\n    (.addComponent\
    \ layout submit-button)\n    (.addListener submit-button\n```"
