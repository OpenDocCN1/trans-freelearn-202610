- pgno: 125
  md: "# How to become lazy\n\nAs you may know, laziness is a simple concept. It is\
    \ the act of only doing the minimum required, or to postpone work until the very\
    \ last moment. This is a conscious choice, and therefore must be applied with\
    \ care.\n\nOne of the reasons Clojure is enjoyable as a programming language is\
    \ because it makes it easy to be lazy; or, in simple computing terms, it only\
    \ evaluates the minimum needed, when it is needed. Nothing extra.\n\nSo, why would\
    \ you want to be lazy, or in other words, build lazy sequences? Obviously, to\
    \ avoid unnecessary computations. An example of this is, say, if you have a mathematical\
    \ formula or a repeating function defining a list of elements and you only want\
    \ to use some of those elements. This is when you want to write a lazy sequence,\
    \ and not evaluate all the elements of the list up front but only those that will\
    \ be accessed and used at runtime.\n\nIn this recipe, we will see first how to\
    \ use lazy sequences in Clojure, as well as create our own.\n\n# Getting ready\n\
    \nFor this section, we do not need anything else but a running REPL. To prepare\
    \ for laziness, though, we can have look at the source of the lazy-seq macro,\
    \ which is the way we can create lazy collections:\n\n```\n(defmacro lazy-seq\n\
    \  [& body]\n  (list 'new 'clojure.lang.LazySeq (list* '^{:once true} fn* []\n\
    body)))\n```\n\nWithout going into too much detail, we can see the Clojure code\
    \ delegates calls to a Java object, LazySeq, https://github.com/clojure/clojure/blob/master/src/jvm/clojure/lang/LazySeq\
    \ defined from a single function."
  merge: -1
  img_proc: true
- pgno: 126
  md: 'The object itself holds a reference to the first object and to the next function
    call. The main implemented interface is ISeq. See https://github.com/clojure/clojure/blob/master/src/jvm/clojure/lang/ISeq.j
    for more details.


    # How to do it...


    We will progressively see how laziness is put into action, then see how to create
    our own lazy sequences.


    # The iterate function


    The iterate function is a simple way to get into lazy sequences. iterate builds
    a lazy sequence from a function and a starting value. For example, here we build
    an infinite sequence of integers, starting from zero, adding one at each iteration:


    ```

    (iterate inc 0)

    ; (0 1 2 3 4 ....

    ; note the above will hang your REPL, if you don''t use

    ; (set! *print-length* 50)

    ; to set the max number of items to print from collections.

    ```


    This applies a function, inc, to the first element, 0, which gives 1. 1 is then
    the new seed of the sequence, and the realized sequence is made up of (0 1). At
    the next step, we apply inc to the new seed, 1, which gives 2, which is appended
    to the realized portion of the sequence to give (0 1 2) and the new seed is 2,
    and so on. The sequence produced will be as follows:


    ```

    ((inc 0) (inc (inc 0)) (inc (inc (inc 0))) ...

    ; (1 (inc 1) (inc (inc 1) ...)

    ; (1 2 (inc 2))

    ; and so on

    ```


    We also compute (or we use the term realize), only when needed. Thus, from the
    full lazy-seq of iterate here, we only take the first five elements:


    ```

    (take 5 (iterate inc 0))

    (0 1 2 3 4)

    ```'
