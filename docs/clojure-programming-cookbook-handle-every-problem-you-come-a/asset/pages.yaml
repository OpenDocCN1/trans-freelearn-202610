- pgno: 229
  md: "# add-field function:\n\n```\n(b/update friend\n  [:birth :year] 1986)\n; {:name\
    \ \"Nick\", :birth {:year 1986, :place \"Japan\"}, :nickname \"nickthegreat\"\
    }\n```\n\nEach path directive, if it defines a function, gets passed the data\
    \ structure as input, so you can make data-dependent computations. For example,\
    \ to add an age field, we will make use of the mk-path function and an anonymous\
    \ function that does some simple arithmetic:\n\n```\n(b/update friend\n  (b/mk-path\
    \ [:age]) #(- 2016 (-> % :birth :year)))\n; {:name \"Nick\", :birth {:year 1985,\
    \ :place \"Japan\"}, :nickname \"nickthegreat\", :age 31}\n```\n\nRemoving a field\
    \ is also quite easy, again using path and an associated function:\n\n```\n(b/update\
    \ friend\n  [] (b/remove-field :nickname))\n; {:name \"Nick\", :birth {:year 1985,\
    \ :place \"Japan\"}}\n```\n\nAnd, as you notice, this works with a slightly more\
    \ complicated path as well:\n\n```\n(b/update friend\n  [:birth] (b/remove-field\
    \ :place))\n; {:name \"Nick\", :birth {:year 1985}, :nickname \"nickthegreat\"\
    }\n```\n\nThat's it! The cycle is closed. We can parse data in a format, update\
    \ it, and convert it to another format at will.\n\n# There's more...\n\nOne more\
    \ thing...what we have not done yet in this recipe is convert from Clojure to\
    \ Clojure.\n\n# Extensible Data Notation\n\nExtensible Data Notation, EDN in short,\
    \ is a subset of the Clojure"
  merge: -1
  img_proc: true
- pgno: 230
  md: "language that helps transporting Clojure data structure as standard text. Datomic,\
    \ the Cognitect functional database, is making use of EDN to transfer data from\
    \ its storage to the client. You can also use EDN to send data between a ClojureScript\
    \ client and a Clojure server, making every part of your infrastructure be in\
    \ Clojure.\n\nThe standard `read-string` function from `clojure.core` works fine:\n\
    \n```\n(read-string\n  \"{:friends [{:friend {:name \\\"Nick\\\" :age 23}}]}\"\
    )\n; {:friends [{:friend {:name \\\"Nick\\\" :age 23}}]}\n```\n\nBut there is\
    \ also a `tools.reader` available for both Clojure and ClojureScript that can\
    \ read text to Clojure data structure:\n\n```\n(require '[clojure.tools.reader.edn\
    \ :as edn])\n\n(edn/read-string\n\"{:friends [{:friend {:name \\\"Nick\\\" :age\
    \ 33}}]}\")\n; {:friends [{:friend {:name \\\"Nick\\\", :age 23}}]}\n```\n\nRound-tripping\
    \ is easy as well:\n\n```\n(edn/read-string\n  (str\n    {:friends [{:friend {:name\
    \ \\\"Nick\\\" :age 23}}]}))\n; {:friends [{:friend {:name \\\"Nick\\\", :age\
    \ 23}}]}\n```\n\nNote that this also works with Clojure records. If we define\
    \ a list of friends through record:\n\n```\n(defrecord Friend [name])\n(def friends\n\
    \  [(Friend. \"Nico\")\n   (Friend. \"Makoto\")\n   (Friend. \"Nick\")])\n```\n\
    \nWe can confirm that the type is maintained even after round-tripping:\n\n```\n\
    (pr-str friends)\n(read-string (pr-str friends))\n```"
