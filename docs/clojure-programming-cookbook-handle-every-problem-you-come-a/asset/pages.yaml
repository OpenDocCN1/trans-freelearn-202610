    # There''s more...


    To conclude this recipe, there is one more thing we will look at: asynchronous
    requests. And yes, let''s plug this with core.async to show where Clojure really
    shines.


    # async HTTP and core async


    http-kit supports one more mode of sending requests, and this is through the use
    of a call back instead of blocking while waiting for the result call. For example,
    taking the previous example to the requestb.in call, we had the following:


    ```

    (let [{:keys [status headers body error] :as resp} @(http/get "http://requestb.in/tp6d3jtp"
    {:keepalive 120000 :query-params {:a 1}})] (println body))

    ```


    The request function has a support for a different arity and a different number
    of parameters, and the last one is providing a callback for the call:


    ```

    (http/get ; endpoint "http://requestb.in/tp6d3jtp" ; options {:keepalive 120000
    :query-params {:a 1}} ; callback (fn [{:keys [status headers body error opts]}]
    (println body)))

    ```


    The callback will be called whenever the request has returned.'
