- pgno: 162
  md: "Now, our second macro should not feel so different, and seeing what code is\
    \ actually being compiled does not bring a lot of surprises:\n\n```\n(macroexpand-1\
    \ '(x3 2))\n; (clojure.core/* 3 2)\n```\n\nJust to make it clear, all of the following\
    \ are equivalent:\n\n```\n; evaluate the macro directly\n(x3 2)\n; 6\n```\n\n\
    ```\n; eval the non compiled version of the macro.\n(eval (quote (x3 2)))\n; 6\n\
    ```\n\n```\n; same with the quote version\n(eval '(x3 2))\n; 6\n```\n\n```\n;\
    \ eval the code generated by the macro\n(eval (macroexpand-1 '(x3 2)))\n; 6\n\
    ```\n\nSo, now this is all making sense! We understand the two phases between\
    \ the generated and evaluated Clojure code. Remember that code is data, but code,\
    \ through macros, can generate more data, well, code.\n\nWe call this homoiconicity\
    \ of a language due to the fact that the internal representation of a program\
    \ is a data structure understood by the language itself.\n\n# There's more...\n\
    \n> \"Be careful--with quotations, you can damn anything.\"\n> \n> --Andre Malraux\n\
    \nSometimes you want to manipulate or return forms using their current structure\
    \ and not their valued content. This is where quote comes into play."
