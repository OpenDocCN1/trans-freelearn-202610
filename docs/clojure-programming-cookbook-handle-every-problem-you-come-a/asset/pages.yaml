- pgno: 534
  md: "```\n(.stop server)\n;;=> nil\n```\n\n# Parameterized resources\n\nWe will\
    \ learn how to define a REST API with parameters. So, let's define a parameterized-hello\
    \ resource that has a parameter x as follows:\n\n```\n(defresource parameterized-hello\
    \ [x]\n  :available-media-types [\"text/html\"]\n  :handle-ok (format \"<html><h1>Hello\
    \ Clojure from %s !</h1>\n</html>\" x)\n)\n;;=> #'liberator-example.example/parameterized-hello\n\
    ```\n\nThe previous example enables us to set an arbitrary string to the HTML\
    \ content.\n\ndefroutes also has a parameter x and passes to parameterized-hello:\n\
    \n```\n(defroutes parameterized-hello-app\n  (ANY \"/hello/:x\" [x] (parameterized-hello\
    \ x))\n  (route/not-found \"Not Found !\"))\n;;=> #'liberator-example.example/parameterized-hello-app\n\
    ```\n\nDefine your handler and start your server:\n\n```\n(def handler\n  (->\
    \ parameterized-hello-app\n      wrap-params))\n;;=> #'liberator-example.example/handler\n\
    (def server (run-jetty handler {:port 3000 :join? false}))\n;;=> #'liberator-example.example/server\n\
    ```\n\nNow, open your browser with the following URL:\n\n```\nhttp://localhost:3000/hello/your-name:\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 535
  md: "![](img/d7b631352a782ee50160cf8eb995152f_535_0.png)\n\n```\n(.stop server)\n\
    ;;=> nil\n```\n\n# Defining GET/POST/PUT/DELETE methods for REST APIs\n\nHere,\
    \ we will define HTTP methods for a resource. We will define a resource for a\
    \ customer and define five methods for it in the following table:\n\n| Method\
    \ | Action | Parameter | URL |\n| GET | Returns a list of customers | --- | http://localhost:3000/customer\
    \ |\n| POST | Creates a new customer | --- | http://localhost:3000/customer |\n\
    | GET | Gets a customer | Customer ID | http://localhost:3000/customer/id |\n\
    | PUT | Updates a customer | Customer ID | http://localhost:3000/customer/id |\n\
    | DELETE | Deletes a customer | Customer ID | http://localhost:3000/customer/id\
    \ |\n\nSo, let's define a ref for a customer whose attributes are name and country:\n\
    \n```\n(def customer-ref\n  (ref\n    {:makoto {:name \"Makoto Hashimoto\" :country\
    \ \"Japan\"}\n     :nico {:name \"Nicolas Modrzyk\" :country \"France\"}}))\n\
    ;;=> #'liberator-example.example/customer-ref\n```"
  merge: -1
  img_proc: true
- pgno: 536
  md: "The resource customer-list does not have a parameter. We will define GET and\
    \ POST methods:\n\n```\n(defresource customer-list\n  :allowed-methods [:get :post]\n\
    \  :available-media-types [\"application/json\"]\n  :exists? (fn [_]\n       \
    \     (let [result @customer-ref]\n              (if-not (nil? result)\n     \
    \           {::entry result})))\n  :post! (fn [ctx]\n           (let [body (parse-string\
    \ (slurp (get-in ctx [:request :body])) true)]\n             (dosync\n       \
    \        (alter customer-ref assoc (keyword (:id body))\n                 (dissoc\
    \ body :id)))))\n  :handle-ok ::entry\n  :handle-not-found {:error \"id is not\
    \ found\"})\n;;=> #'liberator-example.example/customer-list\n```\n\nThe get method\
    \ returns the value of customer-ref. The reply of the get is handled by the anonymous\
    \ function of the :exists? entry and returns a map with the ::entry key if the\
    \ value of the customer-ref is not nil. In this case, the entry of :handle-ok?\
    \ is applied and returns the result with a 200 status code. Otherwise, the function\
    \ of :handle-not-found is applied and returns with a 404 status code.\n\nThe post\
    \ requests are processed with the function associates with :post? that adds the\
    \ body of the post to the customer-ref. The format of the requested body of the\
    \ post is as follows:\n\n```\n{\"id\":\"some-id\",\"name\":\"some-name\",\"country\"\
    :\"country-name\"}\n```\n\nThe next resource, named customer-entity, is for parameterized\
    \ requests. This resource has GET, PUT, and DELETE methods:\n\n```\n(defresource\
    \ customer-entity [id]\n  :allowed-methods [:get :put :delete]\n  :available-media-types\
    \ [\"application/json\"]\n  :exists? (fn [_]\n            (let [result (get @customer-ref\
    \ (keyword id))]\n              (if-not (nil? result)\n                {::entry\
    \ result})))\n```"
  merge: -1
