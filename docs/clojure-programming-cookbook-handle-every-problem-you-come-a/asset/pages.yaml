    \  >\n  [{:price 10 :product :apple}\n   {:price 30 :product :tomato}\n   {:price\
    \ 5 :product :peanuts}])\n```\n\nBefore you know it, we will recall the Clojure\
    \ function juxt, which can create a combination of two functions. Calling juxt\
    \ on a single entry map will return a vector containing the result of each call\
    \ of fn1, fn2 on the same structure, here, a map:\n\n```\n((juxt :price :quantity)\n\
    \  {:price 10 :quantity 2})\n; [10 2]\n```\n\nThe result may look surprising at\
    \ first, but when you look at it in detail,"
