  md: '# Chapter 7. Advanced Tips


    In this chapter, we will cover the following topics:


    +   - Hacking the Clojure code

    +   - Using Reader Conditionals, compile to Clojure, and ClojureScript

    +   - Real-time shared development with an REPL

    +   - Declarative data descriptions and validations with plumatic/schema


    # Introduction


    We will learn more advanced tips in this chapter. First we will hack the Clojure
    code to understand how Clojure code works. We will generate class files from Clojure
    code and then decompile Java code. Understanding how Clojure code is a lot of
    fun and useful.


    Next, we will look at how to write source code that keeps the compatibility between
    Clojure and ClojureScript and runs on both environments. As ClojureScript is getting
    more popular nowadays, single code running on both environments improves maintainability,
    especially writing libraries.


    Then, we will try to share REPL real time from a remote client. Using this mechanism,
    we will try to control the Raspberry Pi from your PC.


    Lastly, we will learn prismatic schema, which enables us to define and validate
    schemas for data. This library is very useful to define data shapes and validate.
    We will introduce `core.types` and `clojure.spec`, which are the most major features
    of Clojure 1.9.'
