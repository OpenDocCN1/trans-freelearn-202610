  md: "Then, the following transfer! function executes a transaction moving the amount\
    \ of money between the from account and the to account:\n\n```\n(defn transfer!\
    \ [from to amount]\n  (dosync\n    (println \"transfer money from \" (:name @from)\
    \ \" to \" (:name @to) \" amount = \" amount \" begins\")\n    (alter from assoc\
    \ :amount (- (:amount @from) amount))\n    (Thread/sleep 500)\n    (alter to assoc\
    \ :amount (+ (:amount @to) amount))\n    (println \"Now, \" (:name @from) \" amount\
    \ is \" (:amount @from) \" and \" (:name @to) \" amount is \" (:amount @to))\n\
    \    ))\n;;=> #'chapter06.concurrency/transfer!\n```\n\nThere are a couple of\
    \ alter calls inside the dosync in the transfer! function that form a transaction.\
    \ Let's test to transfer 10 dollars from Makoto to Nicolas:\n\n```\n(transfer!\
    \ makoto-account nico-account 10)\n;;=> transfer money from Makoto to Nicolas\
    \ amount = 10 begins\n::=> Now, Makoto amount is 990 and Nicolas amount is 2010\n\
    ;;=> nil\n@nico-account\n;;=> {:name \"Nicolas Modrzyk\", :amount 2010}\n(deref\
    \ makoto-account)\n;;=> {:name \"Makoto Hashimoto\", :amount 990}\n```\n\nGreat!\
    \ It works correctly.\n\nThen, let's run two transactions concurrently and see\
