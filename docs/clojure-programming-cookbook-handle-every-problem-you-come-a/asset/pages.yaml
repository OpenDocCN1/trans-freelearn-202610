    \ (3 4)]\n```\n\nUnderscore (_) represents unused arguments explicitly:\n\n```\n\
    (let [[x _ z] [1 2 3]]\n  [x z]\n)\n;;=> [1 3]\n```\n\n# Using map destructuring\n\
    \nThe map destructuring extracts desired values from maps. In the following example,\
    \ the x, y, and z bind to 1, 2, and 3:\n\n```\n(let\n  [{x :x y :y z :z} {:x 1\
    \ :y 2 :z 3}]\n  [x y z])\n;;=> [1 2 3]\n```\n\nThe preceding expression looks\
    \ a bit verbose. There is a simpler, shortcut expression of map destructuring,\
    \ as follows:\n\n```\n(let\n  [{:keys [x y z]} {:x 1 :y 2 :z 3}]\n  [x y z])\n\
    ;;=> [1 2 3]\n```\n\nIf keys of maps are strings or symbols, use the :strs or\
    \ :syms instead:\n\n```\n(let\n  [{:strs [x y z]} {\"x\" 1 \"y\" 2 \"z\" 3}]\n\
    \  [x y z])\n;;=> [1 2 3]\n```"
