    # There''s more...


    In the previous section, we saw that having a namespace for the public API of
    your library is important, so the following will describe, with the potemkin library
    as an example, how to extract just what you need from your code to present the
    API you want to present:


    ```

    tools.namespace, potemkin

    ```


    # Namespace for public API


    potemkin has a very interesting method, named import-vars, that allows something
    like a copy/paste of a function from a different namespace to a current one. If
    we remember the previous recipe, we can simply try the potemkin dependency as
    follows:


    ```

    lein try potemkin "0.4.1"

    ```


    Then we can select on-demand functions and clean up our public-facing namespace:


    ```

    user=> (require ''potemkin)

    (potemkin/import-vars [clojure.string reverse])

    (user/reverse "hello")

    ```


    This makes selecting functions for our namespace clean, without any code, mostly
    documentation.


    This also makes a case for versioning our namespace, in case some breaking changes
    are introduced but there is no need to make a completely new version of your code.


    # tools.namespace'
