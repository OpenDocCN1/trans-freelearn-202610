- pgno: 519
  md: "```\nbuttons.clj:\n\n(ns buttons\n  (:import [com.vaadin.ui\nButton\nButton$ClickListener\n\
    Notification]))\n\n(defn button-click-listener\n  [action]\n  (reify Button$ClickListener\n\
    \    (buttonClick [_ evt] (action))))\n\n(defn listener [button action]\n  (.addListener\
    \ button (button-click-listener action)))\n\n(defn show-message []\n  (Notification/show\
    \ \"clicked\"))\n\n(defn button [caption action]\n  (doto (Button. caption) (listener\
    \ action)))\n```\n\nThe first file will reference the buttons namespace with:\n\
    \n```\n(ns ex1\n  (:require [buttons :as b])\n  (:import...))\n```\n\nLoading\
    \ the server, you can see the application and the button showing:\n\n![](img/d7b631352a782ee50160cf8eb995152f_519_0.png)\n\
    \nAnd even nice Vaadin notifications entering the scene, through calls to"
