    (line-seq rdr) (cycle "\n"))) ))) (println e)

    ```


    This shows that functions that have side effects, such as requiring a state and
    access to data that is not shown in the code, need to be cautiously used with
    lazy-seq.


    Apart from this particular example, lazy-seq is full steam ahead for efficiency.


