    # Serverless Clojure with AWS Lambda


    Lambda is an AWS product that allows you to run Clojure code without the hassle
    and expense of setting up and maintaining a server environment. Behind the scenes,
    there are still servers involved, but as far as you are concerned it is a serverless
    environment. Upload a JAR and you are good to go. Code running on Lambda is invoked
    in response to an event, such as a file being uploaded to S3, or according to
    a specified schedule. In production environments, Lambda is normally used in wider
    AWS deployment that includes standard server environments to handle discrete computational
    tasks.


    Particularly, it''s very easy to scale out according to concurrent requests. For
    Clojurian working on a personal project, Lambda is a wonderful combination of
    power and limitation. Just how far can you hack Lambda given the constraints imposed
    by AWS?


    # Clojure namespace helloworld


    Start off with a clean empty projected generated using lein new. From there, in
    your IDE of choice, configure and package and a new Clojure source file. In the
    following example, the package is com.sakkam and the'
