- pgno: 612
  md: "Note that it is pretty useful to at least show some sample output through println,\
    \ and also note that you have just generated randomized inputs of 1,000 entries,\
    \ with quite a simple random definition.\n\nThe last example here checks that\
    \ the arithmetic still works:\n\n```\n(defn my-eq [a b]\n  (> 1e10 (- b a)))\n\
    (defn my-tan [v]\n  (/ (Math/sin v) (Math/cos v)))\n\n(defspec cosintan\n  1000\n\
    \  (prop/for-all [v (gen/elements (range 1 10000))]\n    (my-eq (Math/tan v) (my-tan\
    \ v) )))\n```\n\nObviously, you could perform something similar using tests, but\
    \ you have to admit the previous version is nicely readable.\n\n# Generators and\
    \ de-structuring\n\nYou have seen before the gen' namespace. Here, we will see\
    \ another useful utility from test.chuck, de-structuring of the generators.\n\n\
    One of the previous examples was showing how to use apply for parameters, but\
    \ this is making it easier:\n\n```\n...\n; in the namespace definition\n(:require\
    \ [com.gfredericks.test.chuck.properties :as prop'])\n...\n(defn my-len [n]\n\
    \  (count (str n)))\n\n(defspec split-n-spec\n  10\n  (prop'/for-all [ [ele ele2]\
    \ (gen/tuple gen/int gen/int)]\n    (< 0 (my-len (+ ele ele2)))))\n```\n\nSee\
    \ how ele and ele2 are assigned to each value of the tuple. Be careful, we use\
    \ prop'/for-all from the test.chuck namespace, which is different from the usual\
    \ prop from test.check."
