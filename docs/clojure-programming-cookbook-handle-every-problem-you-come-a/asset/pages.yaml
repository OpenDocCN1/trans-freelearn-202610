  md: "```\n(proxy [Button$ClickListener] []\n    (buttonClick [event]\n        (println\
    \ (.getValue first-name))))\nlayout))\n```\n\nThe preceding snippet adds a label,\
    \ a field, and a button to a vertical layout. The button then gets an event handler\
    \ to react to a click event, and so will print the value of the text field when\
