    Now, we will explain more exchange types such as fanout exchange and topic exchange.\n\
    \n# Using fanout exchange\n\nThe fanout exchange distributes messages to multiple\
    \ queues at a time. We will define `fanout-producer` and `fanout-consumer`. The\
    \ `langohr.exchange/fanout` specifies the fanout exchange type for both the producer\
    \ and consumer:\n\n![](img/d7b631352a782ee50160cf8eb995152f_247_0.png)\n\n# fanout-producer\n\
    \nHere we will define the `fanout-producer`. The `langohr.exchange/declare` declared\
    \ the exchange to be the fanout"
