- pgno: 452
  md: "Before explaining all the functions and words used here, let's go through the\
    \ process first:\n\n+   - The source file needs to be in the usual source folder\
    \ in a Clojure project, so with Leiningen, this would be `src/gen3.clj`\n+   -\
    \ We now start an REPL, again with Leiningen, through:\n+   \n+     `lein repl`\n\
    +   - When the REPL has started, we now use the compile directive:\n+   \n+  \
    \   ```\n+     (compile 'gen3)\n+     ; gen3\n+     ```\n\nYou will see that even\
    \ though the REPL is pretty silent, class files have been generated:\n\n```\n\
    Nicolass-MacBook% ls -l target/classes\ntotal 40\ndrwxr-xr-x@ 3 niko  staff  \
    \  102 May 25 11:41 META-INF\n-rw-r--r--@ 1 niko  staff    831 May 25 11:41 gen3$_main.class\n\
    -rw-r--r--@ 1 niko  staff   1302 May 25 11:41\ngen3$fn__1248.class\n-rw-r--r--@\
    \ 1 niko  staff   1494 May 25 11:41\ngen3$loading__5569_auto___1246.class\n-rw-r--r--@\
    \ 1 niko  staff   1788 May 25 11:41 gen3.class\n-rw-r--r--@ 1 niko  staff   2372\
    \ May 25 11:41 gen3__init.class\n```\n\nThat is five classes generated, and probably\
    \ the easier one to see is the `gen3.class` file. This is the file containing\
    \ the entry point for the program. Let's use the Clojure JAR we have generated\
    \ previously and the newly generated classes:\n\n```\njava -cp ../clojure/target/clojure-1.9.0-master-SNAPSHOT.jar:target/classes\
    \ gen3\n```\n\nExecuting the preceding command will print out the expected message:\n\
    \n```\nhello world\n```\n\nNice. So we can see now that the Clojure code is being\
    \ compiled to byte"
