  md: "# Using Spyglass and Couchbase to share state between JVMs\n\nSpyglass is a\
    \ very fast Memcached client to share states between JVMs.\n\nSpyglass is a future\
    \ complete client to support almost all of the Memcached protocol operations,\
    \ as well as binary and text protocols. Spyglass supports not only synchronous\
    \ accesses to Memcached but also asynchronous accesses to it.\n\nWe will use a\
    \ Couchbase Server as a Memcached server and access it using Spyglass.\n\n# Getting\
    \ ready\n\nInstalling Couchbase and setting up Memcached takes several steps.\
    \ We will instruct you how to do them.\n\n# Setting up dependencies in project.clj\n\
    \nYou need to add the spyglass to your project.clj file to run samples (or any\
    \ other dependency management you are using):\n\n```\n:dependencies\n  [[org.clojure/clojure\
    \ \"1.8.0\"]\n   [clojurewerkz/spyglass \"1.0.0\"]]\n```\n\n# Setting up Couchbase\
    \ Server as a Memcached server\n\nCouchbase Server is an awesome ultrascale document-oriented\
    \ NoSQL Server. Couchbase Server can be set up as a Memcached server. We will\
    \ set up Couchbase Server using docker-compose.\n\n# Using docker-compose to start\
