  md: '# # Chapter 6. Concurrency and Parallelism


    In this chapter, we will cover the following topics:


    +   - Solving concurrent problems using Clojure

    +   - Distributed actor-based dev with Akka

    +   - Using Spyglass and Couchbase to share state between JVMs

    +   - Reactive programming with meltdown

    +   - Bridging core.async

    +   - On Quasar/Pulsar


    # ## Introduction


    In this chapter, we will learn about the concurrency and parallelism that Clojure
    provides. First, we will take a look at concurrency and parallelism features.
    Next, we will try to use Scala''s Akka library and Spyglass. Then we will learn
    Quasar/Pulsar, which are fibers, channels, and actors for Clojure and Java used
    in Netflix. Finally, we will have a look at meltdown, a nice Clojure wrapper for
    Reactor, which is a toolkit for asynchronous programming, event passing, and stream
    processing.'
