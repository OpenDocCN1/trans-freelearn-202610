    \ #{1 2 3})\n; ;=> #{1 3 2}\n(s/validate NumMapOrSetOrList [1 2 3])\n; ;=> [1\
    \ 2 3]\n```\n\n```\n(def SmallInt (s/constrained long #(and (<= -32768 %) (>=\
