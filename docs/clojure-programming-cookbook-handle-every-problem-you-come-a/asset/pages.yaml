- pgno: 625
  md: "# Primitive arrays\n\nLet's consider using primitive arrays in Clojure. The\
    \ following code is to calculate 2 + 2^2 + 3^2 + ... + n ^2 using vector:\n\n\
    ```\n(def array1 (into [] (repeatedly 1000 #(rand 10))))\n;;=> #'performance-example.performance-tips/array1\n\
    (defn my-calc1[ar]\n  (reduce +\n    (map (fn [x] (* x x))\n      ar)))\n;;=>\
    \ #'performance-example.performance-tips/my-calc1\n```\n\nWe will define array2\
    \ that is a primitive array of double:\n\n```\n(def array2 (double-array (repeatedly\
    \ 1000 #(rand 10))))\n;;=> #'performance-example.performance-tips/array2\n```\n\
    \nThis is equivalent to the following:\n\n```\ndouble[] array2;\n```\n\nLet's\
    \ check the array is created correctly:\n\n```\n(alength ^doubles array2)\n;;=>\
    \ 1000\nTry to get the first element.\n(aget ^doubles array2 0)\n;;=> 7.069889039765091\n\
    ```\n\nWe will define my-calc2 using amap and areduce:\n\n```\n(defn my-calc2[ar]\n\
    \  (let [xs\n    (amap ^doubles ar\n      idx ret\n      (let [x (aget ^doubles\
    \ ar idx)]\n        (* x x)))]\n    (areduce xs i ret (double 0)\n      (+ ret\
    \ (aget ^doubles xs i)))))\n#'performance-example.performance-tips/my-calc2\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 626
  md: "Let's test the performance of both cases:\n\n```\n(bench (my-calc1 array1))\n\
    (bench (my-calc2 array2))\nUsing a primitive type is faster.\nExecution time mean\
    \ : 69.387426 Âµs\nExecution time mean : 54.874642 Âµs\n```\n\n# Working with\
    \ transient data structures\n\nClojure's `transient` is a data structure which\
    \ allows mutable updates. We will learn how we use it and compare the performance\
    \ with Clojure's persistent data structure.\n\nThe following code is using `transient`:\n\
    \n```\n(defn rand-seq1 [n m]\n  (loop [i 0 s (transient [])]\n    (if (< i n)\n\
    \      (recur (inc i) (conj! s (rand m)))\n      (persistent! s))))\n```\n\nThe\
    \ `transient` data structure allows mutable functions such as `conj!`, `disj!`,\
    \ `pop!`, `assoc!`, and `dissoc!`. We cannot use these functions for persistent\
    \ data structures. To get persistent data, use `persistent!`.\n\nWe will define\
    \ the same function not using `transient`:\n\n```\n(defn rand-seq2 [n m]\n  (loop\
    \ [i 0 s []]\n    (if (< i n)\n      (recur (inc i) (conj s (rand m)))\n     \
    \ s)))\n```\n\nThen, let's run benchmarks:\n\n```\n(bench (rand-seq1 1000000 10))\n\
    (bench (rand-seq2 1000000 10))\n```\n\nWe got the following results and using\
    \ a primitive array was faster:\n\n```\ntransient => Execution time mean : 86.779352\
    \ ms\nnon-transient => Execution time mean : 128.905613 ms\n```"
  merge: -1
  img_proc: true
- pgno: 627
  md: "# Memoize functions\n\nWe introduce you to memoize, which caches the arguments\
    \ and results of function calls. Memoize improves performance if a function calls\
    \ with the same arguments repeatedly; on the other hand, the use of memoize consumes\
    \ memory.\n\nWe will define a factorial function in the following:\n\n```\n(defn\
    \ factorial [num]\n  (if (= num 1)\n    num\n    (* num (factorial (dec num))))\n\
    ```\n\nThen, we will define the memoize version of factorial:\n\n```\n(def memoize-factorial\
    \ (memoize factorial))\n```\n\nNow, let's measure the performance of the non-memoize\
    \ version and the memoize version:\n\n```\n(time (factorial 3000N))\n;;=> \"Elapsed\
    \ time: 11.111595 msecs\"\n;;=> 4149359603......\n(time (factorial 3000N))\n\"\
    Elapsed time: 11.260317 msecs\"\n;;=> 4149359603......\n```\n\nWe ran the non-memoize\
    \ version of factorial twice. The execution times are almost the same. Next, we\
    \ will test the memoize version of factorial:\n\n```\n(time (memoize-factorial\
    \ 3000N))\n\"Elapsed time: 11.258368 msecs\"\n;;=> 4149359603......\n(time (memoize-factorial\
    \ 3000N))\n\"Elapsed time: 0.084887 msecs\"\n;;=> 4149359603......\n```\n\nThe\
    \ first execution is almost the same as the non-memoize version. But the second\
    \ call is quite fast.\n\n# There's more..."
  merge: -1
  img_proc: true
- pgno: 628
  md: "Here, we will show you other tools for profiling performance.\n\n# Logging\
    \ with timbre and profiling with tufte\n\nptaoussanis/timbre is a logging API\
    \ for Clojure/Script. timbre is fast, flexible, and easy to configure with map.\
    \ ptaoussanis/tufte is a simple profiling and performance monitoring tool for\
    \ Clojure/Clojurescript.\n\nTo enable timbre and tufte, we will add their libraries\
    \ to your project.clj and restart your REPL:\n\n```\n(defproject performance-example\
    \ \"0.1.0-SNAPSHOT\"\n  :description \"FIXME: write description\"\n  :url \"http://example.com/FIXME\"\
    \n  :license {:name \"Eclipse Public License\"\n            :url \"http://www.eclipse.org/legal/epl-v10.html\"\
    }\n  :dependencies [[org.clojure/clojure \"1.8.0\"]\n                 [criterium\
    \ \"0.4.4\"]\n                 [com.taoensso/timbre \"4.6.0\"]\n             \
    \    [com.taoensso/tufte \"1.0.0-RC1\"]])\n```\n\nThen, let's create src/performance_example/timbre\
    \ example.clj_. We will add the namespace and library to use:\n\n```\n(ns performance-example.timble-example\n\
    \  (:require\n    [clojure.core.reducers :as r]\n    [taoensso.timbre :as timbre\n\
    \     :refer (log trace debug info warn error fatal report\n             logf\
    \ tracef debugf infof warnf errorf fatallf\n             reportf\n           \
    \  spy get-env log-env)]\n    [taoensso.tufte :as tufte :refer (defnp p profiled\
    \ profile)]))\n;;=> nil\n```\n\nNow, let's test logs:\n\n```\n(error \"timbre\
    \ error\")\n;;=> 16-07-18 14:40:12 phenix ERROR [performance-example.timble-example:15]\
    \ - timbre error\n;;=> nil\n(info \"timble info\")\n```"
