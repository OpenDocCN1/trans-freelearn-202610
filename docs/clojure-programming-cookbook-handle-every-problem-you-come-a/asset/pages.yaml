- pgno: 228
  md: "As a side feature, if you use those data structures to do some configuration,\
    \ balagan can actually trigger functions based on selectors by using the with-paths\
    \ function:\n\n```\n(b/with-paths\n  friend\n  [:birth]  (fn [value path]\n  \
    \  (println \"I am born in \" (value :place))))\n```\n\nThe preceding function\
    \ will print the following in the console:\n\n```\nI am born in Japan\n```\n\n\
    with-paths also supports multiple paths:\n\n```\n(b/with-paths\n  friend\n  [:name]\n\
    \    (fn [value _]\n      (println \"My name is \" value)))\n  [:birth]\n    (fn\
    \ [value path]\n      (println \"I am born in \" (value :place))))\n```\n\nWhile\
    \ dispatching calls is also nice, our main goal is actually to update those data\
    \ structures. This is done in the exact same way by calling the balagan function\
    \ update. The function gets a data structure, a series of vectorized paths, and\
    \ a value or a function for each path.\n\nIn its simplest form, we may just want\
    \ to add a new field to confirm that our friend is a cool dude:\n\n```\n(b/update\
    \ friend\n  [] (b/add-field :nice-friend true) )\n; {:name \"Nick\", :birth {:year\
    \ 1985, :place \"Japan\"}, :nickname \"nickthegreat\", :nice-friend true}\n```\n\
    \nNote that in pure Clojure tradition, a new data structure is returned and the\
    \ original is not touched.\n\nIf you've just realized you got the birth date wrong,\
    \ you may want to update it. This is done by setting directly a value instead\
    \ of using the"
  merge: -1
