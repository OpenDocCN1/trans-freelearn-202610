- pgno: 173
  md: "What is surprising here is that the only thing the `deftest` macro is actually\
    \ doing is creating functions through `def`, with simply some metadata attached\
    \ to it. The new function is simply defined in the current namespace.\n\nTo run\
    \ tests then, the `run-tests` function will actually look for those macro-defined\
    \ functions that have the proper metadata, and will then execute them.\n\nAs a\
    \ quick reminder, to create and run tests from the REPL, we simply need to call\
    \ `deftest`:\n\n```\n(require '[clojure.test :refer :all])\n\n(deftest my-test\
    \ []\n  (is (= 1 1)))\n\n(run-tests)\n\n;macro.clj:\n;Testing my-very-first-macro\n\
    ;macro.clj:\n;Ran 1 tests containing 1 assertions.\n;macro.clj:\n;0 failures,\
    \ 0 errors.\n```\n\nHopefully that gives you new ideas for creating macros and\
    \ how to put them in context!"
