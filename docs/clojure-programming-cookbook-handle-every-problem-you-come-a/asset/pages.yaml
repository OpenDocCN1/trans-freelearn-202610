    \ the basics in, it is about time to start organizing the code just a bit; let's\
    \ see how to organize code into a different namespace, and still see the updates\
    \ after a refresh.\n\n# Using and reloading namespaces\n\nIn this example, you\
    \ will see how to separate Vaadin-related code into different namespaces. Let's\
    \ say you have a basic layout, with a label and a button:\n\n```\n(defn- main-layout\
    \ []\n    (doto (VerticalLayout.)\n        (.addComponent (Label. \"Hello Clojure!\"\
    ))\n        (.addComponent (button \"Press me\" show-message))))\n\n(defn main\
    \ [ui]\n(main-layout))\n```\n\nYou now want to have the code related to buttons\
    \ in a separate file,"
