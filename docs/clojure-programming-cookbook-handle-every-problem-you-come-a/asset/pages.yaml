- pgno: 488
  md: "quite simple. Say you want to programmatically send code to be evaluated remotely;\
    \ this is how to do it, again with straightforward Java interop:\n\n```\n(ns custom-repl.client\n\
    \  (:import [java.net Socket]\n           [java.io InputStreamReader OutputStreamWriter]\n\
    \           [clojure.lang LineNumberingPushbackReader]))\n\n(def client\n  (new\
    \ Socket \"localhost\" 9001))\n\n(def rdr (new LineNumberingPushbackReader\n \
    \             (new InputStreamReader (. client\n(getInputStream)))))\n(def wtr\
    \ (new OutputStreamWriter (. client (getOutputStream))))\n\n(binding [*out* wtr]\n\
    \  (prn '(+ 1 2 3))\n  (flush)\n  (read rdr))\n\n(. client (close))\n```\n\nThis\
    \ can, of course, be used for regular REPLs as well and eventually any kind of\
    \ socket connectivity.\n\n# The async custom REPL server\n\nJava interop is cool\
    \ but is also a bit passe when you can use core.async. You will need one more\
    \ dependency in your project.clj file:\n\n```\n[com.hellonico.gearswithingears/async-sockets\
    \ \"0.1.0\"]\n```\n\nA dumb REPL will go on using core.async to handle the request\
    \ and simply eval the string that has been sent to the server. This is very similar\
    \ to what we saw in the async chapters applied to something practical!\n\n```\n\
    (ns custom-repl.async\n  (:require [com.gearswithingears.async-sockets :refer\
    \ :all]\n            [clojure.core.async :as async]))\n```"
  merge: -1
