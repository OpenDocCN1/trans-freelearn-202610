- pgno: 44
  md: '# REPL up!


    REPL is the interpreter of Clojure, and it is an acronym of **Read Evaluate Print
    Loop**. Unlike other interpreter languages, such as Python or Ruby, Clojure REPL
    automatically compiles into Java''s byte code after the reading expression. Then,
    REPL evaluates the expression and returns the result of the expression. This dynamic
    compilation feature of REPL makes Clojure code execution as fast as executing
    pre-compiled code.


    # Getting ready


    Before you set up your Clojure environment, the **Java Development Kit (JDK)**
    is necessary. The JDK version should be 1.6 or later. Throughout the book, we
    will use JDK 1.8 to develop and test the code.


    This is how the command-line result will look, once you type `java -version`:


    ![](img/d7b631352a782ee50160cf8eb995152f_44_0.png)


    # How to do it...


    Leiningen is a standard build tool for Clojure. It simplifies the Clojure development,
    including setting up your project, compiling and testing code, and creating libraries
    for deployment.


    It''s easy to set up a Clojure environment using Leiningen. There are only'
  merge: -1
  img_proc: true
