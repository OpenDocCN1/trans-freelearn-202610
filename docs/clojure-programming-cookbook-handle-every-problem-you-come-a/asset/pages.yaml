  md: "# Using destructuring techniques\n\nDestructuring can be used in `defn` and\
    \ `let`. This technique provides flexible ways to extract values for bodies of\
    \ functions or `let` expressions. Though destructuring looks a bit unusual for\
    \ beginners of Clojure and programmers of other languages, it is effective for\
    \ extracting desired values from the structural data of arguments and binding\
    \ values.\n\n# Getting ready\n\nThis recipe uses the `math.numeric-tower` and\
    \ `core.match` functions, so change the `:dependency` in the `project.clj` file\
    \ as follows and restart the REPL, and be ready:\n\n```\n:dependencies\n[[org.clojure/clojure\
    \ \"1.8.0\"]\n[org.clojure/math.numeric-tower \"0.0.4\"]\n[org.clojure/core.match\
    \ \"0.3.0-alpha4\"]\n]\n```\n\n# How to do it...\n\nHere, let's learn how to do\
    \ sequential destructing and map destructing.\n\n# Sequential destructuring\n\n\
    Sequential destructuring is for extracting desired elements from sequence collections.\
    \ In the following code, variables `x`, `y`, `z` bind to `1`, `2`, `3`:\n\n```\n\
    (let [[x y z] [1 2 3]]\n  [x y z]\n)\n;;=> [1 2 3]\n```\n\nSimilarly, `x`, `y`,\
    \ and `z` bind to `1`, `2`, and `3`, and `a`, `b`, and `c` bind to \"a\", \"b\"\
    , and \"c\":\n\n```\n(let [[x y z] [1 2 3] [a b c] [\"a\" \"b\" \"c\"]]\n```"
