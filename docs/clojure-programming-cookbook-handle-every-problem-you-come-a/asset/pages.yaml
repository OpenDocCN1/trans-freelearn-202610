  md: "```\n(! @self [:bump @self])\n(receive\n  [:bump who]\n  (println who \" is\
    \ bumping!\"))\n\n(spawn relaxing-afternoon-6)\n; ... ActorRef@32c9c341...  is\
    \ bumping!\n```\n\nNow sending, people don't usually bump themselves, so we need\
    \ to introduce someone to do this hard job.\n\nThe next example takes two actors,\
    \ one that sleeps and one that sends a hint of waking up. Our two actors, sleeping\
    \ man and someone, can be defined easily as follows:\n\n```\n(defsf n sleeping-man\
    \ []\n  (println \"I keep on sleeping ...\")\n  (receive\n    [:wakeup who]\n\
    \    (do\n      (println \"Someone is telling me to wakeup!\")\n      (println\
    \ \"but ...\")\n      (recur))))\n```\n\n```\n(defsf n someone [man]\n  (sleep\
    \ 1000)\n  (! man [:wakeup @self]))\n```\n\nAnd then we can see the interaction\
    \ between the two people. Note that someone takes a reference to a man so as to\
    \ be able to send messages to it.\n\nSpawning the sleeping man is just as usual:\n\
    \n```\n(def man-asleep (spawn sleeping-man))\n```\n\nSpawning someone is slightly\
    \ different, as the reference to the sleeping man is added as a second parameter\
    \ to spawn:\n\n```\n(spawn someone man-asleep)\n;  Someone is telling me to wakeup!\n\
    ; but ...\n; I keep on sleeping ...\n```"
