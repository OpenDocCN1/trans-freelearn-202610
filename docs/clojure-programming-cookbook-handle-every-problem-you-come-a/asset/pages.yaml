- pgno: 363
  md: "![](img/d7b631352a782ee50160cf8eb995152f_363_0.png)\n\nNote that if we want\
    \ to make it look like a bit more jQuery-like, we can bind the js/jQuery object\
    \ to the dollar sign again:\n\n```\n(def $ js/jQuery)\n\n(defn click-slide-fn[]\n\
    \    (if (.is ($ \"div:first\") \":hidden\")\n        (. ($ \"div\") slideDown\
