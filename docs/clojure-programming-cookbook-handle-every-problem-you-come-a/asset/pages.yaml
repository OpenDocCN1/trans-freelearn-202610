  md: "# Clojure does not inherit Java's checked exception\n\nIn Java, checked exceptions\
    \ are checked at compile time. Using Java, checked exceptions should be handled\
    \ by a try-catch block or methods should declare the exception using the throws\
    \ keyword. Otherwise the program will give an error at compile time.\n\nThe following\
    \ Java code causes an error at compile time:\n\n```\nclass CheckedException\n\
    {\n    public static void main(String args[])\n    {\n    Thread.sleep(1000);\n\
    \    }\n}\n```\n\n```\n$ javac CheckedException.java\nCheckedException.java:3:\
    \ error: unreported exception\nInterruptedException; must be caught or declared\
    \ to be thrown\n    Thread.sleep(10000);\n                ^\n1 error\n```\n\n\
    To avoid the preceding error, we need to modify the code as follows:\n\n```\n\
    public class CheckedException {\n    public static void main(String args[])  {\n\
    \    try {\n        Thread.sleep(10000);\n    } catch (InterruptedException e)\
    \ {\n        System.out.println(\"Interrupt occured\");\n    }\n    }\n}\n```\n\
    \nGenerally, checked exceptions tend to not be liked. Scala also does not inherit\
    \ checked exceptions. Clojure is the same, and the following code works fine:\n\
    \n```\n(Thread/sleep 1000)\n```"
  merge: -1
  img_proc: true
