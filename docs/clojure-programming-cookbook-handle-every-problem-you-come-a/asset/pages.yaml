  md: "including value-based equality and hashCode.\n\nRecord implements a lot of\
    \ Clojure interfaces, whereas type implements only the clojure.lang.IType:\n\n\
    ```\n(supers Author)\n;;=> #{clojure.lang.IKeywordLookup clojure.lang.ILookup\
    \ clojure.lang.Seqable java.lang.Object java.lang.Iterable clojure.lang.IMeta\
    \ clojure.lang.IHashEq clojure.lang.IPersistentMap clojure.lang.Counted java.io.Serializable\
    \ java.util.Map clojure.lang.IPersistentCollection clojure.lang.Obj clojure.lang.Associative\
    \ clojure.lang.IRecord}\n(supers Point3D)\n;;=> #{java.lang.Object clojure.lang.IType}\n\
    (def x (Point. 1 1))\n;;=> #'chapter03.protocols/x\n(def y (Point. 1 1))\n;;=>\
    \ #'chapter03.protocols/y\n(= x y)\n;;=> true\n```\n\nRecord supports a value-based\
    \ equality and hashCode. See the following code:\n\n```\n(defrecord PointRecord\
    \ [x y])\n;;=> chapter03.protocols.PointRecord\n(= (PointRecord. 10 5)\n   (PointRecord.\
    \ 10 5)\n   )\n;;=> true\n(deftype PointType [x y])\n;;=> chapter03.protocols.PointType\n\
    (= (PointType. 10 5)\n   (PointType. 10 5)\n   )\n;;=> false\n```\n\nRecords are\
    \ immutable and persistent. Clojure's record implements the clojure.lang.IPersistentMap,\
    \ we can access records using functions for map. Fields of types can be mutable.\
    \ We will show a technique for this later in this recipe."
