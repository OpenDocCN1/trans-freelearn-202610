- pgno: 412
  md: 'Memcached was originally developed by Danga Interactive for LiveJournal, but
    is now used by many other systems, including Google, Facebook, Twitter, and other
    famous companies.


    Memcached''s APIs provide a very large hash table distributed across multiple
    machines. When the table is full, subsequent inserts cause older data to be purged
    in least recently used order.


    # Access Memcached from Telnet


    Memcached supports Telnet access to manipulate cached data. Let''s try it. Start
    the connection again in your REPL if you have shut it down:


    ```

    (def tc (c/text-connection

    "172.17.0.3:11212 172.17.0.4:11212 172.17.0.5:11212"))

    ;;=> #''spyglass-example.core/tc

    ```


    Let''s go to your terminal and issue the Telnet to connect to the Memcached server:


    ```

    $ telnet 172.17.0.3 11212

    set key-1 0 60 5

    test!

    STORED

    get key-1

    VALUE key-1 0 5

    test!

    END

    ```


    The preceding commands access Memcached using Telnet, go to your REPL and set
    a key-1 to a value and get it. So far, let''s go to REPL get a value of the key-1:


    ```

    (c/get tc "key-1")

    ;;=> "test!"

    (c/set tc "key-2" 100 "Hello !")

    ;;=> #clojurewerkz.spyglass.OperationFuture[{:status :ready,

    :val true} 0x171ca0f1]

    ;;=> 1

    ```


    Switch to your terminal again and issue the following:'
