  md: "```\nch (channel)\nfiber (spawn-fiber\n    (fn []\n      (let [m1 (rcv ch)\n\
    \            m2 (rcv ch)]\n        (+ m1 m2))))]\n(sleep 200)\n(snd ch 10)\n(sleep\
    \ 200)\n(snd ch 10)\n(join fiber))\n; 20\n```\n\nChannels can be used and shared\
    \ between different fibers:\n\n```\n(let [ch (channel 0 :block true true)\n  \
    \    f #(rcv ch)\n      fiber1 (spawn-fiber f)\n      fiber2 (spawn-fiber f)]\n\
    \  (snd ch \"m1\")\n  (snd ch \"m2\")\n  (close! ch)\n  #{(join fiber1) (join\
    \ fiber2)})\n; #{\"m1\" \"m2\"})\n```\n\nFinally, channels can be used in burst\
    \ mode with rcv-into and snd-seq:\n\n```\n(let [ch (channel)\n      fiber (spawn-fiber\
    \ #(rcv-into [] ch 1000))]\n  (snd-seq ch (range 200))\n  (close! ch)\n  (join\
    \ fiber))\n; [0 1 2 3 4 ...])\n```\n\n# Blazar\n\nThings get to the point where\
    \ you would like to know how to link fibers and a socket server, so here is Blazar,\
