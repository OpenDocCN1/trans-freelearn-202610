    \ |\n\n# There's more...\n\nLet's define a very simple processor that transforms\
    \ messages between the file endpoints. To write a processor, we have to implement\
    \ a process method in the org.apache.camel Processor class. We will use the Clojure\
    \ proxy function to implement this method. Our simple processor echoes an inbound\
    \ string and adds a string \"Hello \" on it and sends it to the outbound:\n\n\
    ```\n(defn get-payload-as-string [ex]\n  (-> ex .getIn (.getBody (class \"\"))))\n\
    ;;=> #'chapter04.camel/get-payload-as-string\n(def simple-processor\n  (proxy\
