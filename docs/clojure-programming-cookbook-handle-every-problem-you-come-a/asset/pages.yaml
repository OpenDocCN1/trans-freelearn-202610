- pgno: 226
  md: "```\n(let [data-input (java.io.DataInputStream. i)]\n    (msg/unpack-stream\
    \ data-input))\n; {:friends {:friend \"Nick\" :age 15}}\n```\n\nThis actually\
    \ means that very big Clojure data structures can be saved this way, without using\
    \ as much memory. Another feature is to allow you to use your own custom encoders,\
    \ for example, to encode Clojure records you may have defined. Custom encoders\
    \ are available in the macros namespace:\n\n```\n(require '[msgpack.macros :refer\
    \ [extend-msgpack]])\n```\n\nNow let's define a record, Friend that has one attribute,\
    \ name:\n\n```\n(defrecord Friend [name])\n```\n\nWe will tell msgpack that this\
    \ special Friend structure will be encoded using the byte equivalent of the name\
    \ attribute. Similarly, to retrieve a Friend record from bytes, we will pass the\
    \ byte value to the ->Friend function:\n\n```\n(extend-msgpack\n  Friend\n  100\n\
    \  [p] (.getBytes (:name p))\n  [bytes] (->Friend (String. bytes)))\n```\n\nWe\
    \ can now round-trip through our friend Nick:\n\n```\n(msg/unpack\n  (msg/pack\n\
    \    [(->Friend \"Nick\") 5 \"test\"]))\n; (#chapter04.somemsgpack.Friend{:name\
    \ \"Nick\"} 5 \"test\")\n```\n\nMessagePack is one of the new kids on the block\
    \ for data serialization, but it sure is getting more and more attention. Redis\
    \ has native support for MessagePack, making the format really attractive to be\
    \ used from Clojure to dispatch job to other systems.\n\nNow we have learnt quite\
    \ extensively how to convert back and forth to different serialization formats,\
    \ so let's have a look at how we can"
