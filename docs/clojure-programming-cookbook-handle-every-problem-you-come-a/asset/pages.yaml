- pgno: 156
  md: "Back to your speed collection example, we bind the input map to the variable\
    \ name s and then thread that s through different functions:\n\n```\n(as-> {:speed\
    \ [50 70 100]} s\n  (get s :speed)\n  (take 2 s)\n  (average s)\n)\n; 60\n```\n\
    \nNote that this is the part that makes as-> stand out, and we can specify the\
    \ position where s appears in each function call.\n\nSo, s is the first parameter\
    \ of get, but the result of that get function is then passed as the last parameter\
    \ of the next functions, take, and so on.\n\nAnother simple example, where we\
    \ conj, map, and into like Clojure freaks:\n\n```\n(as-> [1 2 3] $\n  (conj $\
    \ 5)\n  (map inc $)\n  (into [] $)\n)\n; [2 3 4 6]\n```\n\nBreak the limits and\
    \ build the impossible.\n\n# Flambo preview\n\nWe will come back to it in a later\
    \ recipe, but let's have a quick look at flambo, a Clojure-friendly way of writing\
    \ Apache Spark jobs. Just like Hadoop in the early days, Spark aims to make large\
    \ computation tasks a breeze, and this is made even simpler through Clojure. flambo\
    \ uses threading pretty much all over the place.\n\nFollowing is how to create\
    \ a simple character count job in flambo:\n\n```\n(ns com.fire.kingdom.flambit\n\
    \  (:require [flambo.api :as f]))\n  (->\n    (f/text-file sc \"data.txt\")\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 157
  md: "```\n;sc here means spark context, basically the reference to spark\n  (f/map\
    \ (f/fn [s] (count s)))\n  (f/reduce (f/fn [x y] (+ x y))))\n```\n\nYou see how\
    \ short and brief this is. We will not look into the Flambo API in detail, so\
    \ let's translate the preceding superb code into standard Clojure. We want to\
    \ do a word count, so we build two helper functions, one to split text into words\
    \ and the other to calculate frequencies:\n\n```\n(defn split-words [text]\n \
    \ \"split text into a list of words\"\n  (re-seq #\"\\w+\" text))\n```\n\n```\n\
    (defn calculate-frequencies [words]\n  \"convert list of words to a word-frequency\
    \ hash\"\n  (reduce (fn [words word] (assoc words word (inc (get words word 0))))\n\
    \    {}\n    words))\n```\n\nThe threading macro now comes into action and we\
    \ can pipeline all this with what we have seen so far:\n\n```\n(->\n  (slurp \"\
    LICENSE\")\n  (split-words)\n  (count))\n; 1711 ... as far as the current license\
    \ file goes ;)\n```\n\nAlready in plain simple Clojure code, we've seen how this\
    \ is put in action. The slurp call reads the text into a string, which is then\
    \ split into words, and finally, we count the number of words through a simple\
    \ call to count.\n\nFlambo uses the exact same kind of threading syntax that make\
    \ distributed jobs so easy to write.\n\nIn this recipe, we have presented the\
    \ different Clojure threading macros and have seen how they pass an initial and\
    \ moving data structure through a set of functions, sometimes given test conditions."
