- pgno: 90
  md: '# Clojure collections and their basic functions


    There are four collection types in Clojure:


    +   - Lists

    +   - Vectors

    +   - Maps

    +   - Sets


    In this recipe, we will describe what these types are and some basic functions
    for them.


    # Getting ready


    You only need REPL described in the recipe *Repl up!* in Chapter 1, *Live Programming
    with Clojure*, and no additional libraries. Start REPL so that you can review
    the sample code in this recipe.


    # How to do it...


    We will learn collection types in Clojure including lists, vectors, maps, and
    sets. We will learn how to create them and use basic functions for them.


    # Lists


    Lists are commonly used in Lisp. Clojure also supports the list data type. Lists
    are internally implemented as a linked list. To create a list, begin with quote
    ('') and then enclose elements with (). If you want to create an empty list, use
    '' (), or (list):


    ```

    ''("A Study in Scarlet"

    "The Sign of the Four"

    "The Hound of the Baskervilles"

    "The Valley of Fear")

    ;;=> ("A Study in Scarlet" "The Sign of the Four" "The Hound of the Baskervilles"
    "The Valley of Fear")

    ```'
  merge: -1
  img_proc: true
- pgno: 91
  md: "```\n' ()\n;;=> ()\n(list)\n;;=> ()\n```\n\nThere are three basic functions,\
    \ car, cdr, and cons, to manipulate lists in traditional Lisp. Instead of them,\
    \ Clojure uses first, rest, and conj. Let's see how they work:\n\n+   - first\
    \ takes the head element from a list:\n+   \n+     (first '(1 2 3 4 5))\n+   \
    \  ;;=> 1\n+     (first '())\n+     ;;=> nil\n+     (first nil)\n+     ;;=> nil\n\
    \n+   - The first of an empty list or nil returns nil.\n\n+   - rest returns a\
    \ list after the first element:\n+   \n+     (rest '(1 2 3 4 5))\n+     ;;=> (2\
    \ 3 4 5)\n+     (rest '())\n+     ;;=> ()\n+     (rest nil)\n+     ;;=> ()\n\n\
    +   - The rest of an empty list or nil returns an empty list.\n\n+   - conj adds\
    \ elements at the beginning:\n+   \n+     (conj '(2 3 4 5) 1)\n+     ;;=> (1 2\
    \ 3 4 5)\n\n+   - conj is a variadic function and can take multiple elements as\
    \ its arguments:\n+   \n+     ```clj\n+     (conj '(\"d\" \"e\" \"f\") \"c\" \"\
    b\" \"a\")\n+     ;;=> (\"a\" \"b\" \"c\" \"d\" \"e\" \"f\")\n\n# Vectors\n\n\
    A vector also represents a sequence of elements, like list, but it supports efficient\
    \ access to its elements by index."
