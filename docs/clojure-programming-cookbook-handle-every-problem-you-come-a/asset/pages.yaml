  md: "# Benchmarking with Criterium, performance tips, and other tools\n\nIn this\
    \ recipe, we will learn how to test, measure, and improve the performance of your\
    \ application. We will show you a Clojure-based benchmark tool.\n\n# Getting ready\n\
    \nTo use Criterium, we need to add the `criterium` library in your `project.clj`\
    \ as follows:\n\n```\n(defproject performance-example \"0.1.0-SNAPSHOT\"\n  :description\
    \ \"FIXME: write description\"\n  :url \"http://example.com/FIXME\"\n  :license\
    \ {:name \"Eclipse Public License\"\n            :url \"http://www.eclipse.org/legal/epl-v10.html\"\
    }\n  :dependencies [[org.clojure/clojure \"1.8.0\"]\n                 [criterium\
    \ \"0.4.4\"]])\n```\n\nThen, restart your REPL.\n\n# How to do it...\n\nHere,\
    \ we will show you how to test the performance of your code using Criterium.\n\
    \n# Using Criterium\n\nCriterium is a micro benchmark tool for measuring the computation\
    \ time of Clojure expressions.\n\nIt performs given expressions multiple times\
    \ and reports statistical information including means and std-deviations of execution\
    \ time. Criterium also considers JVM characteristics such as the optimization\
    \ of JIT compiler and effects of GC.\n\nLet's assume we will measure performances\
    \ for `apply`, `reduce`, and"
  merge: -1
