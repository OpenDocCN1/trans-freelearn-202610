  md: "# Listing files and directories in a directory\n\nJava's method `listFile`\
    \ in the `java.io.File` class lists files and directories directly under the specified\
    \ directory:\n\n```\n(doseq [x (.listFiles (clojure.java.io/file \".\"))]\n  (if\
    \ (.isDirectory x) (print \"[D] \") (print \"[F] \"))\n  (println (.getPath x))\n\
    )\n[F] ./CHANGELOG.md\n[D] ./images\n[F] ./.nrepl-port\n[F] ./README.md\n[D] ./test\n\
    [F] ./project.clj\n[F] ./chapter04.md\n[D] ./src\n[D] ./doc\n[D] ./dev-resources\n\
    [F] ./.gitignore\n[D] ./target\n[F] ./.hgignore\n[D] ./resources\n[F] ./LICENSE\n\
    nil\n```\n\nClojure's function `file-seq` lists files recursively:\n\n```\n(doseq\
    \ [x (file-seq (clojure.java.io/file \".\"))]\n  (if (.isDirectory x) (print \"\
    [D] \") (print \"[F] \"))\n  (println (.getPath x))\n)\n[D] .\n[F] ./CHANGELOG.md\n\
    [D] ./images\n[F] ./images/rabbitmq.png\n[F] ./images/kafka-topic.png\n[F] ./images/kafka.png\n\
    [F] ./images/zookeeper.png\n[F] ./.nrepl-port\n[F] ./README.md\n[D] ./test\n[D]\
    \ ./test/chapter04\n[F] ./test/chapter04/core_test.clj\n[F] ./project.clj\n```"
  merge: -1
