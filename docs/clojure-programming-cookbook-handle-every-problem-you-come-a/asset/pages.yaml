  md: "# Reading HTTP resource\n\nThe slurp, spit, clojure.java.io/reader, and clojure.java.io/writer\
    \ can make use not only for files but also of HTTP and network sockets.\n\nThe\
    \ following code reads from a Clojure document site:\n\n```\n(slurp \"http://clojuredocs.org\"\
    )\n;;=> <!DOCTYPE html>\n;;=> <html><head><meta content=\"width=device-width,\
    \ maximum-scale=1.0\" name=\"viewport\">\n;;=> <meta content=\"yes\" name=\"apple-mobile-web-app-capable\"\
    >\n;;=> .....\n;;=> </script></body></html>\n```\n\nThe next code counts the number\
    \ of bytes of the website. Since the line-seq eliminates newline, we add 1 to\
    \ the byte size:\n\n```\n(with-open [rdr (clojure.java.io/reader \"http://clojuredocs.org\"\
    )]\n  (->> (line-seq rdr)\n       (map (fn [s] (inc (count (.getBytes s \"UTF-8\"\
    )))))\n       (reduce +)))\n;;=> 40261\n```\n\n# Examining the source code\n\n\
    Now we will show you a little complex example. In this example, we will list the\
    \ names of source files of Clojure and count the numbers of lines of these files.\n\
    \nThe get-source-files returns the sequence of file objects (java.io.File) whose\
    \ file name has the specific extension. The re-matches tests whether a file name\
    \ matches a regular expression pattern. Such a regular expression is generated\
    \ by the re-pattern as follows:\n\n```\n(re-pattern (str \".*\\\\.\" \"clj\"))\n\
    ;;=> #\".*\\.clj\"\n(re-matches #\".*\\.clj\" \"foo.clj\")\n;;=> \"foo.clj\"\n\
    (re-matches #\".*\\.clj\" \"foo.java\")\n```"
