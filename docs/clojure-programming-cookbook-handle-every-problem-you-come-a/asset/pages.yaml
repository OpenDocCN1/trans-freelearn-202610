- pgno: 429
  md: '# Bridging core.async


    Clojure''s `core.async` is one of those Clojure features that makes you love asynchronous
    programming. While not included in Clojure core, it is straight and easy to put
    into use and makes Clojure''s STM a breeze to use. Unfortunately, most of the
    examples that can be found on `core.async` make it a bit hard to see how to connect
    it and plug things together with the rest of your current code and other frameworks.


    This recipe wants to close the gap and help you bring out more `core.async` code
    out there.


    # Getting ready


    This recipe is largely based on `core.async`, but we will use a few other libraries.
    Here''s a sample dependencies section for your `project.clj` file:


    ```

    :dependencies [

    [org.clojure/clojure "1.8.0"]

    [org.clojure/core.async "0.2.374"]


    [com.hellonico.gearswithingears/async-sockets "0.1.0"]

    [jarohen/chime "0.1.9"]


    ; there''s more

    [com.keminglabs/jetty7-websockets-async "0.1.0"]

    [ring "1.2.0"]


    ]

    ```


    The core async library is obviously required. Other samples will also show a synchronicity
    integrated with other libraries, so async sockets will help us create channels
    from socket messages, and chime will give us a timer channel that can be used
    with `core.async`.


    Note that `com.hellonico.gearswithingears` is just a custom version of the `async-sockets`
    library with a small code fix.'
