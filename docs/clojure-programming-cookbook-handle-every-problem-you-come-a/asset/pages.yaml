- pgno: 200
  md: "# Finding only one result\n\nBack to the preceding example, instead of finding\
    \ all the possible answers, we may just be looking for one. In this case, we use\
    \ a slightly different version of run, not run**, but run 1*:\n\n```\n(run 1 [q]\n\
    \    (conde\n      [(== q 2)]\n      [(== q 3)]))\n; (2)\n```\n\nThe 1 is indeed\
    \ the number of answers we are looking for.\n\n# Mature logic\n\nLogic power increases\
    \ with age and usage of the fd namespace.\n\n# Range of values\n\nWe can define\
    \ a range of constraints for our answer through fd/in, fd/domain, and fd/interval.\n\
    \nThe following searches for q such that q is one of 1, 2, 3, 4 ,5 and q*q = r,\
    \ with r being in between 1 and 10. This is shown in the following example:\n\n\
    ```\n(run* [q]\n    (fresh [r]\n      (fd/in q (fd/domain 1 2 3 4 5))\n      (fd/in\
    \ r (fd/interval 1 10))\n      (fd/* q q r)))\n; (1 2 3)\n```\n\ndomain is a list\
    \ of values, interval is a Clojure range, and in defines appartenance. fd/ then\
    \ does a logic __ operation.\n\nIn the following, we use fd/eq to define equality,\
    \ but the applied concepts are the same:\n\n```\n(run 1 [q]\n  (fresh [a b]\n\
    ```"
