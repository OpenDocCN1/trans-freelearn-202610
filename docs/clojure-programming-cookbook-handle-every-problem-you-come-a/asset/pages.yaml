- pgno: 520
  md: "Notification/show:\n\n![](img/d7b631352a782ee50160cf8eb995152f_520_0.png)\n\
    \nNow if you try to change the code in buttons.clj, and update the function that\
    \ shows a Vaadin notification to:\n\n```\n(defn show-message []\n  (Notification/show\
    \ \"clicked again!\"))\n```\n\nRefreshing the page and clicking the button again\
    \ sadly shows the previous message. In fact, none of the code of the namespace\
    \ seems to have been updated in the running container.\n\nTo get back to a friendlier\
    \ development workflow, you can use the reload-all directive in the namespace\
    \ require directive, as follows:\n\n```\n(:require :reload-all [buttons :as b])\n\
    ```\n\nAnd now refreshing the page will get you the original reloading behavior,\
    \ as if everything was in one file.\n\n# Server-side push\n\nUp to now, the UI\
    \ you have been working on was directly coded in Vaadin code, or was updated through\
