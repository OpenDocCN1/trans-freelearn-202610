- pgno: 489
  md: "```\n(defn eval-everything [socket]\n  (async/go-loop []\n    (when-let [line\
    \ (async/<! (:in socket))]\n      (async/>! (:out socket) (eval (read-string line)))\n\
    \      (recur))))\n```\n\n```\n(let [server (socket-server 12349)]\n  (async/go-loop\
    \ []\n    (when-let [connection (async/<!! (:connections server))]\n      (eval-everything\
    \ connection)\n      (recur))))\n```\n\nThe async code is nicely shorter and more\
    \ readable.\n\n# Server REPL or more on real-time work on production code\n\n\
    Now, onto one of the good news about the recently released Clojure 1.8! One of\
    \ the new features that many of us have been waiting for a long time is the ability\
    \ to just start a server REPL with ease.\n\nNow it just became possible by simply\
    \ declaring a parameter when starting the virtual machine, being able to connect\
    \ to it using a simple socket, and having full access to an REPL.\n\nUsing the\
    \ standard JAR file, for example, the one you build in the Clojure source code\
    \ recipe, we will be using the following JVM parameter when starting clojure.main:\n\
    \n```\n-Dclojure.server.repl=\"{:port 5555 :accept clojure.main/repl}\"\n```\n\
    \nThis tells the Clojure runtime to start an repl on port 555, and when a socket\
    \ connect request is about to be accepted, use the clojure.main/repl function\
    \ to handle the call. Now, for the simplest of cases, this translates into the\
    \ following command:\n\n```\njava \\\n-cp clojure-1.8.0.jar \\\n-Dclojure.server.repl=\"\
    {:port 5555 :accept clojure.main/repl}\" \\\nclojure.main\n```"
