  md: "# Using protocols\n\nProtocols provide polymorphism between different data\
    \ types. Defining protocols are defining Java's interfaces in fact. We can define\
    \ protocols for Clojure's records and types. It is also possible to define protocols\
    \ for Java classes.\n\n# Getting ready\n\nThis section does not make use of any\
    \ external library, so you can just start a REPL and be ready.\n\n# How to do\
    \ it...\n\nLet's start with defining records and types, and then look at how to\
    \ define and use protocols.\n\n# Defining a record\n\nHere, we will define a record\
    \ of the author. We have shown how to express the author Sir Conan Doyle using\
    \ a map in Chapter 2, Interacting with Collections:\n\n```\n{:name \"Arthur Ignatius\
    \ Conan Doyle\"\n  :born \"22-May-1859\"\n  :died \"7-July-1930\"\n  :occupation\
    \ [\"novelist\" \"short story writer\" \"poet\" \"physician\"]\n  :nationality\
    \ \"scottish\"\n  :citizenship \"United Kingdom\"\n  :genre [\"Detective fiction\"\
    , \"fantasy\", \"science fiction\", \"historical novels\", \"non-fiction\"]\n\
    \  :notable-works [\"Stories of Sherlock Holmes\" \"The Lost World\"]\n  :spouse\
    \ [\"Louisa Hawkins\" \"Jean Leckie\"]\n  :no-of-children 5\n}\n```\n\nNow we\
    \ will define the preceding map using a record. To define a record, use the defrecord\
    \ and specify the record name and its attributes as fields. Here we defined the\
    \ Author record, which has 10 fields:"
  merge: -1
