  md: '# Using third-party libraries


    So, you have found someone else''s code that you would like to use, and you are
    trying to take their work and use it in your project, great! This is what this
    recipe is all about. There are a few ways to get the code closer to you.


    # Getting ready


    This recipe will introduce you to the art of adding dependencies, packaged as
