  md: "```\n(s/validate {s/Keyword s/Int} {:year 2016})\n;; => {:year 2016}\n(s/validate\
    \ #{s/Keyword} #{:lisp :functional})\n;; => #{:lisp :functional}\n```\n\nWe will\
    \ validate an any and an enumeration type:\n\n```\n(s/validate s/Any \"Makoto\"\
    )\n;;=> \"Makoto\"\n(s/validate s/Any 1.0)\n;;=> 1.0\n(s/validate s/Regex #\"\
    .*\")\n;;=> #\".*\"\n(s/validate (s/enum \"01\" \"02\" \"03\") \"01\")\n;;=> \"\
    01\"\n(s/validate (s/enum \"01\" \"02\" \"03\") \"05\")\n;;=> ExceptionInfo Value\
    \ does not match schema: (not (#{ \"03\" \"02\" \"01\"} \"05\"))  schema.core/validator/fn--38164\n\
    (core.clj:155)\n```\n\n# Using schema for records and other types\n\nWe can use\
    \ schema for records. Let's define Order type and validate it's instance:\n\n\
    ```\n(s/defrecord Order\n  [name :- s/Str\n   price :- s/Num\n   qty :- s/Int])\n\
    ll=> #'schema-example.clj-example/strict-map->Order\n(s/explain Order)\n;;=> (record\
    \ schema_example.clj_example.Order {:name Str,\n:price Num, :qty Int})\n(s/validate\
    \ Order (map->Order {:name \"Clojure Programming Cookbook\" :price 32.00 :qty\
    \ 10}))\n;;=> #schema_example.clj_example.Order{:name \"Clojure Programming Cookbook\"\
    , :price 32.0, :qty 10}\n```\n\nThe Order record has name, price, and qty attributes\
    \ and their types are string, number, and integer, respectively. prismatic/schema\
    \ provides validations for ranges of values. The next code validates the range\
    \ of a number:\n\n```\n(s/validate (s/pred #(and (< 0 %) (> 10 %))) 5)\n```"
