- pgno: 206
  md: "Two final usages of core.logic that we would like to present are the validation\
    \ of results of a function over which we have no control, and also how to work\
    \ with external data.\n\n# Validating the results of a function\n\nSo we have\
    \ this function where we know the output, but we want to figure out what the input\
    \ could have been, knowing the range of possible inputs.\n\nThis is the function\
    \ we want to test in regular Clojure code:\n\n```\n(defn test-me [ x ]\n  (* x\
    \ x))\n```\n\nThe interval of values is as follows:\n\n```\n(def interval (range\
    \ 10))\n```\n\nNow we are looking for possible values, where the function to test\
    \ returns either 9 or 16 and some made-on-the-spot constraints on the input.\n\
    \nHere, we use membero to limit possible solutions to a finite domain and project\
    \ to work on values:\n\n```\n(run* [c1 c2 c3]\n\n  (membero c1 interval)\n  (membero\
    \ c2 interval)\n  (membero c3 interval)\n\n  (fd/eq\n    (= (- c2 c1) c3))\n\n\
    \  (project [c3]\n    (conde\n      [(== (test-me c3) 16)]\n      [(== (test-me\
    \ c3) 9)])))\n```\n\n```\n; ([0 3 3] [0 4 4] [1 4 3] [1 5 4] [2 5 3] [2 6 4] [3\
    \ 6 3] [3 7 4] [4 7 3] [4 8 4] [5 8 3] [5 9 4] [6 9 3])\n```"
  merge: -1
  img_proc: true
- pgno: 207
  md: "Note that this is also a nice way to generate data.\n\n# Working with external\
    \ data\n\nHere we will load data from a CSV file, but it could very well be from\
    \ a database or an external API. The file contains the following three rows:\n\
    \n```\n1,2,3\n2,3,5\n6,2,2\n```\n\nWe can skip the boring part of parsing the\
    \ CSV file to Clojure code:\n\n```\n(use '[clojure.string :only (split)])\n(defn\
    \ parse-rows\n  [file]\n  (let [rows (split (slurp file) #\"\\n\" )]\n    (map\
    \ (fn[x]\n      (map #(Integer/parseInt %)\n        (split x #\",\"))) rows)))\n\
    ```\n\nNow, our function to convert from data to something `core.logic` can understand\
    \ will be `unify`:\n\n```\n(defn query [q file]\n  (fn [b]\n    (to-stream\n \
    \     (map (fn [result] (unify b q result))\n        (parse-rows file)))))\n```\n\
    \nNote that unify does the same as ==, yes, the same == we have seen up to now.\n\
    \nBefore moving on, make sure the `resources/logic-rows.csv` file contains data,\
    \ as seen previously:\n\n```\n1,2,3\n2,3,5\n6,2,2\n```\n\nHaving our custom data\
    \ structure ready, we can run some constraints on the input CSV file and find\
    \ some instances of q:"
