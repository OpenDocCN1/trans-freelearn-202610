- pgno: 232
  md: "# Making use of Clojure HTTP client\n\nFor retrieving simple HTTP requests,\
    \ http-kit is a library of choice when the simple slurp function from clojure.core\
    \ does not provide enough flexibility. While http-kit is both a server and a client,\
    \ this recipe will only look at the client side of things.\n\n# Getting ready\n\
    \nIncluding the http-kit library into our project is now relatively straightforward.\
    \ Let's add the following line to the project.clj file:\n\n```\n[http-kit \"2.1.18\"\
    ]\n```\n\n# How to do it...\n\nA simple request to retrieve the weather data,\
    \ as we have seen before in the parsing JSON section, is quite simply done by\
    \ calling the get function of http-kit. The function returns a promise by default,\
    \ meaning the call will run in the background and block when trying to get the\
    \ result by calling deref or @.\n\nLet's get set quickly with the namespace and\
    \ the target URL to retrieve weather data from the openweathermap API endpoint:\n\
    \n```\n(ns chapter04.somehttp1\n  (:require [org.httpkit.client :as http]))\n\n\
    (def url\n  (str\n\"http://api.openweathermap.org/data/2.5/box/city?\"\n\"bbox=12,32,15,37,10\"\
    \n\"&\"\n\"cluster=yes\"\n\"&\"\n\"appid=2de143494c0b295cca9337e1e96b00e0\"))\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 233
  md: "A get request with http-kit is straightforwardly done through the get function:\n\
    \n```\n(http/get url)\n```\n\nNow, the returned var from get is not a result,\
    \ but a promise on the result. This means that to synchronously get the result\
    \ from http get, we actually need to call the preceding request prefixed with\
    \ @:\n\n```\n@(http/get url)\n```\n\nThis request will actually be made and the\
    \ main thread will block until you get either an answer or a timeout.\n\nThe request\
    \ returns a different map depending on success or error:\n\n```\n{:opts ... :status\
    \ ... :headers.... :body ...}\n{:opts ... :error ...}\n```\n\n| :opts | These\
    \ are the details of the sent HTTP request |\n| :status | This is the HTTP status\
    \ |\n| :headers | These are the HTTP headers |\n| :body | This is the content\
    \ of the response |\n| :error | This is the error message and is only present\
    \ if the request failed |\n\nUsually, you would want to destructure on the keys\
    \ to make it easy to process the different parts of the response:\n\n```\n(let\
    \ [{:keys [status headers body error] :as resp} @(http/get url)]\n  (println status))\n\
    ; 200\n```\n\nRetrieving the content of body works about the same, so go ahead\
    \ and have a few tries on your favorite website. http-kit supports the whole set\
    \ of HTTP request types and a full set of options for sending those"
  merge: -1
  img_proc: true
- pgno: 234
  md: "requests.\n\n# How it works...\n\nOn top of default parameters when sending\
    \ a request, one of the hidden treasures is to be able to reuse the underlying\
    \ TCP connection through the settings of the keepalive parameter:\n\n```\n(time\n\
    \  (let [resp @(http/get url {:keepalive 60000})]\n    (println (:opts resp))))\n\
    ```\n\nCalling the same code twice in a row will produce significant speed increase\
    \ due to the fact that we do not need to open another TCP connection the second\
    \ time. See for yourself!\n\n```\n; first time\n; \"Elapsed time: 514.686061 msecs\"\
    \n; second time\n; \"Elapsed time: 77.74604 msecs\"\n```\n\nThe get function,\
    \ and its more generic request implementation, supports a wide range of options;\
    \ the main ones are shown in the following snippet:\n\n```\n(http/request\n{:url\
    \ ... ; the url to send the request to\n:method :get              ; :post :put\
    \ :head or other\n:user-agent \"User-Agent string\"\n:oauth-token \"your-token\"\
    \n:headers {\"X-header\" \"value\" \"ApiToken\" \"123\"}\n:query-params {\"param1\"\
    \ \"foo, bar\"} ; those are added to the URL\n:form-params {\"param2\" \"foo,\
    \ bar\"} ; those parameters are send in the body of the request\n:body (json/encode\
    \ {\"key\" \"value\"}) ; you can set your serialization strategy, here json\n\
    :basic-auth [\"user\" \"pass\"] ; add your basic credentials here\n:keepalive\
    \ 3000             ; As we have seen, allow to reuse the TCP connection\n:timeout\
    \ 1000               ; set the reading timeout\n:insecure? true ; Need to contact\
    \ a server with an untrusted SSL cert?\n```"
  merge: -1
  img_proc: true
- pgno: 235
  md: "```\n:multipart [] ; files to upload, see below\n:max-redirects 10 ; Max number\
    \ of redirects to follow\n:follow-redirects false ; do we allow being redirected\
    \ ? no !\n})\n```\n\nThrough the request function, you, of course, have access\
    \ to all the different HTTP request types:\n\n```\nget,delete,head,\npost,put,options,patch,propfind,proppatch,lock,unlock,report,ac\n\
    l,copy,move\n```\n\nTo easily see the content of your HTTP request, you can use\
    \ a service-like requestb.in that shows the content of your last 20 requests to\
    \ a given endpoint.\n\nRegister an endpoint in the service and replace the ID\
    \ in the following examples.\n\nTrying what we have seen so far, a simple request\
    \ would look like the following:\n\n```\n(let [{:keys [status headers body error]\
    \ :as resp}\n  @(http/get \"http://requestb.in/tp6d3jtp\"\n    {:keepalive 120000\
    \ :query-params {:a 1}})]\n  (println body))\n```\n\nNice! Let's reuse the same\
    \ service to upload our file content. In this case, we use the :multipart element\
    \ in the map request to specify the filename, the content of the file, and the\
    \ name of the HTTP parameter in the body of the request:\n\n```\n(let [{:keys\
    \ [status headers body error] :as resp}\n  @(http/get \"http://requestb.in/tp6d3jtp\"\
    \n    {:multipart [\n        {:name \"file\"\n         :content (clojure.java.io/file\n\
    \"resources/test1.json\")\n         :filename \"test1.json\"}]\n     :keepalive\
    \ 120000})]\n  (println body))\n```"
