- pgno: 214
  md: "```\n[F] ./chapter04.md\n[D] ./src\n[D] ./src/chapter04\n[F] ./src/chapter04/kafka.clj\n\
    [F] ./src/chapter04/core.clj\n[F] ./src/chapter04/files.clj\n[F] ./src/chapter04/rabbitmq.clj\n\
    ```\n\n# How it works...\n\nLet's look at how `slurp` and `spit` work and then\
    \ see how `with-open` works.\n\n# slurp and spit\n\nAs the `slurp` reads the whole\
    \ file content into a string, it consumes a lot of memory if the file is very\
    \ large. Similarly, as the `spit` writes a file from a string one at a time, it\
    \ consumes a large amount of memory if the target file is very large. In such\
    \ cases, use reader or writer with sequence read/sequence write instead.\n\n#\
    \ with-open macro\n\nThe `with-open` macro uses `try` and `finally`. Reader or\
    \ writer is closed by the `close` method in the `finally` clause. The object used\
    \ in the `with-open` must have `open` and `close` methods. We can understand how\
    \ the `with-open` works using the `macroexpand-1` as follows:\n\n```\n(macroexpand-1\n\
    \  '(with-open [rdr (clojure.java.io/reader \"/etc/passwd\")]\n    (count (line-seq\
    \ rdr))\n    ))\n;;=> (clojure.core/let\n;;=>   [rdr (clojure.java.io/reader \"\
    /etc/passwd\")]\n;;=>   (try\n;;=>     (clojure.core/with-open [] (count (line-seq\
    \ rdr)))\n;;=>     (finally (. rdr clojure.core/close))))\n```\n\n# There's more...\n\
    \nLet's learn how to read web contents via HTTP. Then, we will have a look at\
    \ a small application to examine Clojure source files."
