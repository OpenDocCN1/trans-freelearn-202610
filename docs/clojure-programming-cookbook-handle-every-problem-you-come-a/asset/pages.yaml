- pgno: 567
  md: "# Developing with om.next, the next-generation ClojureScript library\n\nIn\
    \ this recipe, we will learn David Nolen's om to build a ClojureScript application.\
    \ Om is a ClojureScript library to interact with React. React is a very famous\
    \ JavaScript library developed by Facebook. React enables developments of user\
    \ interfaces simpler and reusable UI components.\n\nRecently, Nolen started to\
    \ develop om.next. It's a successor of om and inspired by Facebook's Relay, Netflix's\
    \ Falcor, and Cognitect's Datomic. It is still alpha but it is worth digging it.\
    \ The project.clj of om.next is as follows:\n\nhttps://github.com/omcljs/om/blob/master/project.clj\n\
    \n# Getting ready\n\nBefore learning om.next, we will create and set up a new\
    \ project named om-next-example.\n\n# Creating a new project for om.next\n\nTo\
    \ create a new project for om.next, issue the following command:\n\n```\n$ lein\
    \ new figwheel om-next-example -- --om\n```\n\n# Updating the om version\n\nGo\
    \ to the om-next-example directory and update the om version in your project.clj\
    \ to enable om.next as follows:\n\n```\n:dependencies [[org.clojure/clojure \"\
    1.8.0\"]\n                [org.clojure/clojurescript \"1.8.51\"]\n           \
    \     [org.clojure/core.async \"0.2.374\"\n                 :exclusions [org.clojure/tools.reader]]\n\
    \                [sablono \"0.3.6\"\n```"
  merge: -1
  img_proc: true
- pgno: 568
  md: "```\n:exclusions [cljsjs/react]]\n[org.omcljs/om \"1.0.0-alpha37\"]\n```\n\n\
    # Tips for dependencies\n\nIn this recipe, we will use version 1.0.0-alpha37 of\
    \ om, which supports om.next. However, using the figwheel template generates version\
    \ 0.3.6 of the sablono dependency and it uses the older version of react, which\
    \ causes a runtime problem of om.next.\n\nTo solve this problem, we have checked\
    \ the dependencies of libraries. The \\ command finds confusing dependencies as\
    \ follows:\n\n```\nPossibly confusing dependencies found:\n[sablono \"0.3.6\"\
    ] -> [cljsjs/react \"0.13.3-0\"]\noverrides\n[org.omcljs/om \"1.0.0-alpha37\"\
    ] -> [cljsjs/react-dom \"15.0.1-1\"] -> [cljsjs/react \"15.0.1-1\"]\nand\n[org.omcljs/om\
    \ \"1.0.0-alpha37\"] -> [cljsjs/react \"15.0.1-1\"]\n.....\n[org.omcljs/om \"\
    1.0.0-alpha37\"]\n[cljsjs/react-dom \"15.0.1-1\"]\n.....\n[sablono \"0.3.6\"]\n\
    [cljsjs/react \"0.13.3-0\"]\n.....\n```\n\nThat is the reason why we have excluded\
    \ cljsjs/react from the sablono dependency as follows:\n\n```\n[sablono \"0.3.6\"\
    \n    :exclusions [cljsjs/react]]\n```\n\n# Starting figwheel\n\nStart the following\
    \ command and wait for a prompt for ClojureScript code:\n\n```\n$ lein figwheel\n\
    ```\n\n# How to do it..."
