    # Other lazy-seq-producing functions


    We have seen two functions, `iterate` and `repeatedly`, and the more generic `lazy-seq`
    macro to generate lazy sequences in a generic way. As much as possible, Clojure
    sequences are lazy.


    For example, the following table shows a list of lazy sequence-producing functions:


    | Name | Usage | Example |

    |---|---|---|

    | `cycle` | Cycles through a sequence or vector and generates an infinite sequence
    | `(cycle [1 2 3])` |

    | `repeat` | Produces an infinite sequence of the same element | `(repeat 1)`
    |

    | `iterate` | As we have seen, produces an infinite sequence of x, (f x) (f (f
    x)) | `(iterate inc 0)` |

    | `range` | Produces an infinite lazy sequence from a starting point | `(range
    10)` |'
