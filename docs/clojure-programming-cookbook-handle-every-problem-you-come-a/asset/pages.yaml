- pgno: 530
  md: "# Quickly create a REST API with Liberator\n\nLiberator is a Clojure library\
    \ for developing resources for REST web services. REST is an abbreviation for\
    \ Representational State Transfer and it's an architectural style for designing\
    \ web network applications.\n\nLiberator was inspired by Erlang's Webmachine.\
    \ Webmachine was developed by Justin Sheehy, who is the CTO of Basho Technologies,\
    \ has developed Riak. Webmachine is a RESTful toolkit for writing well-behaved\
    \ HTTP applications and helping developers to handle the complexities of an HTTP-based\
    \ application.\n\nSimilarly, using Liberator makes web API developments simpler\
    \ but provides HTTP rich features such as content negotiation and caching.\n\n\
    # Getting ready\n\nBefore we learn Liberator, we will create a new project named\
    \ liberator-example. To do this, use lein new to create a new Clojure project:\n\
    \n```\n$ lein new liberator-example\n```\n\nThen, we will modify the generated\
    \ project.clj to make use of Liberator. In addition to a Liberator library, we\
    \ need the ring and compojure libraries. We will also need clj-http and cheshire\
    \ for the HTTP client to make REST API calls:\n\n```\n:dependencies [[org.clojure/clojure\
    \ \"1.8.0\"]\n                [liberator \"0.14.1\"]\n                [compojure\
    \ \"1.3.4\"]\n                [ring \"1.5.0-RC1\"]\n                [ring/ring-core\
    \ \"1.5.0-RC1\"]\n                [buddy \"0.13.0\"]\n                [ring/ring-jetty-adapter\
    \ \"1.4.0\"]\n                [clj-http \"2.2.0\"]]\n```"
  merge: -1
  img_proc: true
- pgno: 531
  md: "[cheshire \"5.6.1\"]\n\nRing server provides a simple web server and it makes\
    \ testing easier. We will add a ring plugin in the project.clj as follows:\n\n\
    ```\n:ring {:handler liberator-example.example/handler}\n:plugins [[lein-ring\
    \ \"0.9.7\"]]\n```\n\n# How to do it...\n\nIt's time to try Liberator. Here, we\
    \ will learn how to implement GET, POST, PUT, and DELETE using Liberator. But\
    \ let's start with making a simple hello Clojure server using Liberator!\n\n#\
    \ Your first Liberator\n\nFirst, we will declare the required libraries. We also\
    \ will use ring server and Compojure. Ring server is a famous web server written\
    \ in Clojure. Compojure is a router for dispatching web requests to target resources.\n\
    \nclj.http and cheshire.core enable clients to make requests to REST API services\
    \ provided by Liberator:\n\n```\n(ns liberator-example.example\n  (:require\n\
    \    [liberator.core :refer [resource defresource]]\n    [ring.adapter.jetty :refer\
    \ [run-jetty]]\n    [ring.middleware.params :refer [wrap-params]]\n    [compojure.core\
    \ :refer\n      [defroutes ANY GET PUT POST DELETE OPTIONS]]\n    [clj-http.client\
    \ :as client]\n    [cheshire.core :refer [parse-string generate-string]]))\n;;=>\
    \ nil\n```\n\nThe following code generates a static HTML content for clients:\n\
    \n```\n(defroutes app\n  (ANY \"/hello\" []\n    (resource :available-media-types\
    \ [\"text/html\"]\n              :handle-ok \"<html><h1>Hello Clojure !</h1></html>\"\
    ))\n  (route/not-found \"Not Found !\"))\n;;=> #'liberator-example.example/app\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 532
  md: "In the previous code, we used compojure.core/defroutes to define a context\
    \ as /hello and liberator.core/resource defines a resource.\n\nThen, let's define\
    \ a handler and run it. ring.middleware.params/wrap-params parses query strings\
    \ for requests and form bodies:\n\n```\n(def handler\n  (-> app\n      wrap-params))\n\
    ;;=> #'liberator-example.example/handler\n```\n\nThen, start the server and make\
    \ requests from your browser:\n\n```\n(def server (run-jetty handler {:port 3000\
    \ :join? false}))\n;;=> #'liberator-example.example/server\n```\n\nOpen your browser\
    \ with http://localhost:3000/hello. You can see the following string in your browser:\n\
    \n![](img/d7b631352a782ee50160cf8eb995152f_532_0.png)\n\nTo make requests from\
    \ the command line, use the curl command:\n\n```\n$ curl -X GET http://localhost:3000/hello\n\
    ```\n\nThe next image shows you how the curl command works:"
