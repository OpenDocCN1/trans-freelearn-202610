    \ class for superclasses and interfaces. In the previous recipe, we used the java.lang.Thread\
    \ class. We will implement java.lang.Runnable when we instantiate:\n\n```\n(def\
    \ t\n  (Thread.\n    (proxy [java.lang.Runnable] []\n      (run [] (println \"\
