    \ c1 c3) 5))\n; clojure.core.logic.LVar cannot be cast to java.lang.Number\n```\n\
    \nThis is because c1 and c3 are logic variables and we ask them to compare to\
    \ an integer. When called from within the fd/eq directive, as was done previously,\
    \ this does not show up. If you want to do it outside fd/eq, you can use project\
    \ to enforce a logic var to be turned into its value:\n\n```\n(run* [a b c]\n\
    \    (fd/in a b c (fd/interval 0 3))\n    (fd/distinct [a b c])\n    (project\
    \ [a]\n      (== 2 a)))\n; ([2 0 1] [2 1 0] [2 0 3] [2 3 0] [2 1 3] [2 3 1])\n\
    ```\n\n# How it works...\n\nDavid Nolen, author of core.logic, has gone into superb\
    \ detailed programming to make sure this implementation of logic programming was\
    \ showing superb performance.\n\nIn the test cases, we actually found a reference\
    \ to Finite Domain Constraint Programming in Oz. A Tutorial (http://zeus.inf.ucv.cl/~jrubio/docs/2010-2/ICI%20662/Material/FiniteDomainProgramming.pdf),\
    \ and the relevant code is as follows:\n\n```\n(run* [c1 c2 c3 c4 c5 c6 c7 c8\
    \ c9 :as vs]\n    (everyg #(fd/in % (fd/interval 1 9)) vs)\n    (fd/distinct vs)\n\
    \    (fd/eq\n      (= (- c4 c6) c7)\n      (= (* c1 c2 c3) (+ c8 c9))\n      (<\
    \ (+ c2 c3 c6) c8)\n      (< c9 c8)))\n```"
