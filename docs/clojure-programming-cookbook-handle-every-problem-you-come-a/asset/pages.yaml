- pgno: 224
  md: "```\n(require '[clj-yaml.core :as yaml])\n```\n\nThen pass a generic Clojure\
    \ data structure to the `generate-string` function:\n\n```\n(yaml/generate-string\n\
    \  [{:name \"John\", :age 33}\n   {:name \"Nick\", :age 27}])\n```\n\nQuite straightforwardly,\
    \ the function returns the following:\n\n```\n- {name: John, age: 33}\n- {name:\
    \ Nick, age: 27}\n```\n\nThe `parse-string` function allows us to get some YAML\
    \ text turned into Clojure data structure:\n\n```\n(yaml/parse-string \"\n- {name:\
    \ John, age: 33}\n- name: Nick\n  age: 27\n\")\n```\n\nThis will give you a familiar\
    \ sequence of elements:\n\n```\n({:name \"John\", :age 33} {:name \"Nick\", :age\
    \ 27})\n```\n\nYAML is quite useful in the DevOps configuration world, and is\
    \ able to parse those files and do some preliminary checks from Clojure.\n\n#\
    \ MessagePack, Clojure library\n\nMessagePack is described as being like JSON,\
    \ but light and small. It is actually in a binary serialization format and is\
    \ impressively fast and small. The Clojure library itself has no third-party dependency.\n\
    \nWe start by requiring the `msgpack.core` namespace:\n\n```\n(ns chapter04.somemsgpack\n\
    \  (:require [msgpack.core :as msg])\n  (:require msgpack.clojure-extensions))\n\
    ```\n\nWe can now use the `pack` and `unpack` methods to turn Clojure data"
