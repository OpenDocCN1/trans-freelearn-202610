    # Packaging the application into a JAR file


    You would have seen this before, but the preceding application can also be run
    by creating a JAR file with all the dependencies, and running the main method
    of the main class of that JAR file:


    ```

    lein uberjar

    java -jar target/withdocker-0.1.0-SNAPSHOT-standalone.jar

    ```


    The main entry point is auto-generated for you by Leiningen, by generating the
    META-INF/MANIFEST.MF file, located in the JAR file, where the main-Class entry
    is taken from the project.clj, :main withdocker.handler:


    ```

    Manifest-Version: 1.0

    Built-By: niko

    Created-By: Leiningen 2.6.1

    Build-Jdk: 1.8.0_66

    Main-Class: withdocker.handler

    ```


    # Creating the Docker container


    This idea of creating a JAR file and running it as a standalone is actually what
    you will do to create the standalone Docker image.


    We are assuming here that you have seen a Dockerfile before, but if not do not
    fear! All is good. A Dockerfile is just like the good ''ole Makefile, describing
    a series of steps. The Dockerfile should be placed at the root of the project
    folder.


    Here is a commented Dockerfile:


    ```

    # a base image for the container, here something that has the java executable

    FROM java:openjdk-8-jre

    # copy the jar file inside the container to /app/withdocker.jar

    COPY target/withdocker-0.1.0-SNAPSHOT-standalone.jar /app/withdocker.jar

    # say the container will be exposing an app on port 8080

    ```'
