- pgno: 250
  md: "![](img/d7b631352a782ee50160cf8eb995152f_250_0.png)\n\n# Topic-publisher\n\n\
    We will show you the topic-producer as follows:\n\n```\n(defn topic-producer [ex\
    \ key payload]\n  (with-open\n    [conn (core/connect {:host *host*})*}\n    ch\
    \ (channel/open conn)]\n    (println \"producing message to exchange \" ex \"\
    /\" key \"\n    payload = \" payload)\n    (exchange/declare ch ex \"topic\" {:durable\
    \ false :auto-delete false})\n    (basic/publish ch ex key payload)\n    )\n \
    \ )\n;;=> #'chapter04.rabbitmq/topic-publisher\n```\n\nThe langohr.exchange/declare\
    \ declares the exchange to be the topic exchange type. Then, the langohr.basic/publish\
    \ publishes messages to"
  merge: -1
  img_proc: true
- pgno: 251
  md: "the exchange with a routing key.\n\n# Topic-consumer\n\nThe `topic-consumer`\
    \ is as follows:\n\n```\n(defn topic-consumer [ex topic qname & {:keys [num] :or\
    \ {num 1}}]\n  (let [handler\n        (fn [ch {:keys [delivery-tag]} payload]\n\
    \          (println (format \" [%d-%d] %s\" (.getChannelNumber ch) delivery-tag\
    \ (String. payload \"UTF-8\"))))]\n    (with-open [conn (core/connect)\n     \
    \           ch (channel/open conn num)]\n      (println \"starting consumer ...\"\
    )\n      (queue/declare ch qname {:durable false :auto-delete false})\n      (exchange/declare\
    \ ch ex \"topic\" {:durable false :auto-delete false})\n      (queue/bind ch qname\
    \ ex {:routing-key topic})\n      (consumers/blocking-subscribe ch qname handler\
    \ {:auto-ack true}))))\n;;=> #'chapter04.rabbitmq/topic-consumer\n```\n\nThe preceding\
    \ code is the `topic-consumer`. The `langohr.exchange/declare` declares the exchange\
    \ to be the topic exchange type. Then, the `langohr.queue/declare` declares a\
    \ consumer queue, and the `_langohr.queue/bind` binds the exchange and queue.\n\
    \n# Running the topic consumers\n\nWe will run four topic consumers, and each\
    \ consumer accepts different routing key patterns as follows:\n\n| Thread no.\
    \ | Routing key pattern | Queue name |\n|---|---|---|\n| 1 | p1.group1.jp | my.queue1\
    \ |\n| 2 | p2.group1.jp | my.queue2 |\n| 3 | #.group1.jp | my.queue3 |\n|  | #.group2.jp\
    \ | my.queue4 |"
  merge: -1
  img_proc: true
- pgno: 252
  md: 'Each routing key pattern of topic consumer matches with a routing key in a
    message that is distributed to a queue of the consumer. The character # matches
    any number of characters.


    We are using the future to run four consumers concurrently:


    ```

    (def f1 (future (topic-consumer "topic.exchange1" "p1.group1.jp" "my.queue1" :num
    1)))

    ;;=> starting consumer ...

    ;;=> #''chapter04.rabbitmq/f1

    (def f2 (future (topic-consumer "topic.exchange1" "p2.group1.jp" "my.queue2" :num
    2)))

    ;;=> starting consumer ...

    ;;=> #''chapter04.rabbitmq/f2

    (def f3 (future (topic-consumer "topic.exchange1" "#.group1.jp" "my.queue3" :num
    3)))

    ;;=> starting consumer ...

    ;;=> #''chapter04.rabbitmq/f3

    (def f4 (future (topic-consumer "topic.exchange1" "#.group2.jp" "my.queue4" :num
    4)))

    ;;=> starting consumer ...

    ;;=> #''chapter04.rabbitmq/f4

    ```


    # Testing the topic consumers


    We will test topic consumers by publishing messages. In the following case, the
    message of the routing key is p1.group1.jp. So, it matches p1.group1.jp and #.group1.jp:


    ```

    (topic-producer "topic.exchange1" "p1.group1.jp" "hello p1.group1.jp")

    ;;=> producing message to exchange topic.exchange1 / p1.group1.jp payload = hello
    p1.group1.jp

    ;;=> [3-1] hello p1.group1.jp

    ;;=> [1-1] hello p1.group1.jp

    ```


    Similarly, the routing key p2.group1.jp matches p2.group1.jp and #.group1.jp since
    # is a wildcard:


    ```

    (topic-producer "topic.exchange1" "p2.group1.jp" "hello p2.group1.jp 1")

    ```'
