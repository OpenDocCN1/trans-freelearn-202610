- pgno: 163
  md: "# Using quotes\n\nQuote, or ', is the friendly brother of eval. It is something\
    \ that tells the compiler to not evaluate the code coming after it, but instead\
    \ return data in its current form.\n\nLet's see how that works with a short example:\n\
    \n```\n(quote (* 3 3))\n; (* 3 3)\n```\n\n```\n(str '(* 3 3))\n; \"(clojure.core/*\
    \ 3 3)\"\n```\n\nThe quote tells the compiler to return the data structure (*\
    \ 3 3) as is and not evaluate it. So, we write (* 3 3) and we get (* 3 3), not\
    \ its evaluated form, which in this case would be 9*.\n\nThis comes in handy in\
    \ the case of macros because we do want to generate a form that is a list of nonevaluated\
    \ code.\n\nSo, a tricky question would be: what is the difference between those\
    \ two macro definitions? Take a look at the following:\n\n```\n(defmacro hello2a[]\n\
    \  ' (+ 1 1))\n\n(defmacro hello2b[]\n  (+ 1 1))\n```\n\nAs we can see, one has\
    \ a quote and the other does not, but if we call eval on each of them, we do get\
    \ the same result, no? Let's see:\n\n```\n(hello2a)\n; 2\n(hello2b)\n; 2\n```\n\
    \nWhat's up with this? So, we do remember we can use macroexpand-1 to see the\
    \ code that is generated by each macro. Let's not wait for Christmas and let's\
    \ try it:"
  merge: -1
  img_proc: true
- pgno: 164
  md: "```\n(macroexpand-1 '(hello2a))\n; (+ 1 1)\n\n(macroexpand-1 '(hello2b))\n\
    ; 2\n```\n\nThat's right. The generated code is very different. The first macro\
    \ call returns a list of three elements, +, 1, and 1, while the second macro simply\
    \ returns an integer, 2. Calling eval on each of those two forms returns the same\
    \ result indeed, but their original form is completely different.\n\nWe are almost\
    \ there. One last thing! We saw previously that we could write macros with arguments,\
    \ and we can quickly write this with a quote, like the following:\n\n```\n(defmacro\
    \ hello2c [arg]\n  '(+ 1 arg))\n```\n\nEasy! Now look at the following:\n\n```\n\
    (hello2c 3)\n; clojure.lang.Compiler$CompilerException:\njava.lang.RuntimeException:\
    \ Unable to resolve symbol: arg in\nthis context,\n```\n\nWhat happened here?\
    \ Umm. Let's expand on that a bit more again:\n\n```\n(macroexpand-1 '(hello2c\
    \ 3))\n; (+ 1 arg)\n```\n\nThe generated form is (+ 1 arg). But wait. We have\
    \ not defined arg anywhere, so that cannot work. We want to generate code that\
    \ is the value of arg, not arg itself. arg made sense in the context of generating\
    \ code, but once the code has been generated, arg does not point to anything relevant.\n\
    \nIn this case, we use a different quote: the backquote. The backquote gives us\
    \ access to a templated version of the given form, to which we can apply customization."
