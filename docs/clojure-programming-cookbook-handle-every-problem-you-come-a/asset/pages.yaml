    On the command line, the standard: `lein run -m mutant1.core` is enough to get
    you started, and to see the beautiful page coming to you:


    ![](img/d7b631352a782ee50160cf8eb995152f_555_0.png)


    # How to do it...


    We have seen the basics, and how to get ready; now let''s see how to interact
    with the different middleware frameworks available when using Immutant.


    # Simple messaging with Artemis


    This example will show how to spawn a messaging server, and create a messaging
    context and a queue, as well as sending and listening to that queue through Clojure
    code.


    What is presented here is actually wildly unofficial, not because it is of alpha
    quality, but because some parts and namespaces that make things easy have been
    changed recently.


    So instead of using the `hornetq` framework as noted in a lot of'
  merge: -1
  img_proc: true
- pgno: 556
  md: "documentation around the Interweb, we will use the new library messaging framework\
    \ Artemis, included in the latest releases of WildFly.\n\nThe project.clj file\
    \ gets just a bit complicated, due to the fact we want to avoid including the\
    \ hornetq library, but this should be fixed soon:\n\n```\n(defproject mutant2\
    \ \"0.1.0-SNAPSHOT\"\n  :dependencies [\n    [org.clojure/clojure \"1.8.0\"]\n\
    \    [org.immutant/immutant \"2.1.4\"\n      :exclusions [org.projectodd.wunderboss/wunderboss-messaging-hornetq]]\n\
    \    [org.projectodd.wunderboss/wunderboss-artemis \"0.2.0\"]\n    [ring/ring-devel\
    \ \"1.5.0\"]\n    [compojure \"1.5.0\"]])\n```\n\nYou can also note the (re-)introduction\
    \ of Compojure and you are ready to go!\n\nThe following snippet actually asks\
    \ the framework to create a new messaging server, through the slightly misleading\
    \ msg/context function:\n\n```\n(require '[immutant.web :as web] '[immutant.messaging\
    \ :as msg])\n(def messaging-server\n  (msg/context :remote-type :hornetq-standalone))\n\
    ```\n\nOnce the messaging server has been programmatically started, we can create\
    \ a context that will be used to look up queues and topics.\n\nHere, we connect\
    \ to the messaging server just started, and look up the hello queue. This will\
    \ actually create the queue if it does not exist, or simply connect to it if another\
    \ service has already registered it:\n\n```\n(def mycontext\n  (msg/context :host\
    \ \"localhost\"))\n\n(def queue\n  (msg/queue \"hello\" :context mycontext))\n\
    ```\n\nMost of the new function calls are done using the immutant.messaging namespace,\
    \ labelled as msg."
  merge: -1
  img_proc: true
- pgno: 557
  md: "Now that you have the queue, it is time to listen to it, and send messages.\
    \ The listen function takes a queue or a topic as well as a callback, as a simple\
    \ Clojure function:\n\n```\n(msg/listen queue\n  (fn[msg]\n    (println msg)))\n\
    ```\n\nThen some regular Compojure routing will allow you to send messages to\
    \ the same queue:\n\n```\n(require '[compojure.core :refer :all]\n        '[compojure.route\
    \ :as route])\n(defroutes app\n  (GET \"/\" [] \"<h1>Hello Compojure World</h1><br/><a\
    \ href=\\\"/msg\\\">Send a message</a>\")\n  (GET \"/msg\" [] (msg/publish queue\
    \ \"world\") \"OK\")\n  (route/not-found \"<h1>Page not found</h1>\"))\n```\n\n\
    Here we go:\n\n```\n(defn -main []\n  (web/run-dmc app :host \"0.0.0.0\" :port\
    \ 8080))\n```\n\nNow we can open the page served by the server on port 8080:\n\
    \n![](img/d7b631352a782ee50160cf8eb995152f_557_0.png)"
  merge: -1
  img_proc: true
- pgno: 558
  md: 'Anyway, where in your application you can now use this messaging mechanism?
    By registering to messages coming from the messaging system.


    It would not be a proper messaging system if it could only talk to itself, so
    let''s see how to set up to connect remotely!


    # Remote messaging


    Now we want to set up two servers talking to each other using WildFly messaging
    queues.


    The first server setup is almost identical to the previous example, except that
    to connect remotely, we need to bind to a different IP address, externally accessible.
    This is done by adding JVM settings to the Leiningen JVM option, so in project.clj,
    we will add the following:


    ```

    :jvm-opts ["-Dactivemq.netty.host=0.0.0.0"]

    ```


    And if you look carefully in the console logs, you will notice that indeed the
    messaging system is bound using the preceding settings:


    ```

    22:46:55.000 INFO [org.apache.activemq.artemis.core.server]

    (main) AMQ221020: Started Acceptor at 0.0.0.0:5445 for

    protocols [CORE]

    22:46:55.003 INFO [org.apache.activemq.artemis.core.server]

    (main) AMQ221007: Server is now live

    ```


    Wonderful. Now on to setting up the second server. In the context of this book,
    the second server is actually running on a Raspberry Pi again, and the most difficult
    thing is actually to get the IP addresses in the proper order.


    This second server uses Clojure code similar to what you have seen up to now.
    Queue lookup and ring handler routing are basically the same. What changes is
    the way to retrieve the queue from a remote location.


    The first serer was on IP 192.168.1.3, so the following example will'
  merge: -1
  img_proc: true
- pgno: 559
  md: "make use of that. We also give a number of reconnects up to 30, so that if\
    \ the first server goes down, this will still wait and try to get a connection.\
    \ (Try it!!)\n\nOff you go:\n\n```\n(def mycontext\n  (msg/context\n    :host\
    \ \"192.168.1.3\" :port 5445 :reconnect-attempts 30))\n\n(def queue\n  (msg/queue\
    \ \"hello\" :context mycontext))\n\n(defroutes app\n(GET \"/\" [] (msg/publish\
    \ queue \"world\") \"OK\"))\n```\n\nThe second server is started with the same\
    \ command:\n\n```\nlein run -m mutant3.core\n```\n\nThe Raspberry Pi here has\
    \ IP address 192.168.1.7, so let's connect to it:\n\n![](img/d7b631352a782ee50160cf8eb995152f_559_0.png)\n\
    \nNot very talkative for a web application, but the first server would have received\
    \ a love message accordingly, and hello world would show up in the console logs.\
    \ Yeah! Remoting.\n\n# Remote procedure call with queues"
  merge: -1
