- pgno: 201
  md: "```\n(fd/in a (fd/interval 0 10000))\n(fd/eq (= 4 (* a a)))\n(== q a))\n; (2)\n\
    ```\n\nNote that membero can also be used in a similar way, so to mark a range\
    \ constraint with membero, you would use regular Clojure code, as seen in the\
    \ following:\n\n```\n(run* [q]\n  (fresh [r]\n    (fd/in q (fd/domain 1 2 3 4\
    \ 5))\n    (membero r (range 1 10))\n    (fd/* q q r)))\n```\n\nAlright, we have\
    \ seen an impressive amount already! One more shot of tequila and let's move on\
    \ to generating some fun data!\n\n# How to do it...\n\nNow that we have had enough\
    \ tequila and we have seen a lot of the building blocks of core.logic, we are\
    \ ready to put some code together and be able to generate data. We will start\
    \ with some simple examples and build up along the way, so be sure to try everything\
    \ at the REPL yourself.\n\n# Generating data\n\nSo, we want to generate a set\
    \ of data of vectors [a b], such that a and b are in between 0 and 10, and a -\
    \ b = 2. With what we have seen previously, this becomes:\n\n```\n(run* [q]\n\
    \      (fresh [a b]\n        (fd/in a b (fd/interval 0 10))\n        (fd/eq (=\
    \ 2 (- a b)))\n        (== q [a b])))\n; ([2 0] [3 1] [4 2] [5 3] [6 4] [7 5]\
    \ [8 6] [9 7] [10 8])\n```\n\nNote that we have generated all the possible permutations,\
    \ which is quite cool!"
