    \ code shows you a dialog before and after displaying the \"Hello Clojure !\"\
    \ string in your browser. We summarize methods for the life cycle of components\
    \ in the following table:\n\n| Lifecycle method | Life cycle | Description |\n\
    |---|---|---|\n| componentWillMount | Mounting | Invoked once, both on the client\
    \ and server, immediately before the initial rendering occurs. |\n| componentDidMount\
    \ | Mounting | Invoked once, only on the client (not on the server), immediately\
    \ after the initial rendering occurs. |\n| componentWillReceiveProps | Updating\
    \ | Invoked when a component is receiving new props. This method is not called\
    \ for the initial render. |\n| shouldComponentUpdate | Updating | Invoked before\
    \ rendering when new props or state are being received. This method is not called\
    \ for the initial render or when forceUpdate is used. |\n| componentWillUpdate\
    \ | Updating | Invoked immediately before rendering when new props or state are\
    \ being received. This method is not called for the initial render. |\n| componentDidUpdate\
    \ | Updating | Invoked immediately after the component's updates are flushed to\
    \ the DOM. This method is not called for the initial render. |\n| componentWillUnmount\
    \ | Unmounting | Invoked immediately before a component is unmounted from the\
    \ DOM. |"
