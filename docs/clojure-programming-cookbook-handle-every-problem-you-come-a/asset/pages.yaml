  md: "```\n(consume incremented-values (fn [i] (println \"Incremented: \" i)))\n\
    (accept channel 1)\n; 2\n(accept channel 2)\n; 3\n\n(ms/flush channel)\n```\n\n\
    The interesting part with streams is that you can combine functions that are applied\
    \ to the values in the channel. Here we reuse the almost same preceding example,\
    \ but you can already see how functions are combined with each other by using\
    \ a function based on map* as the input of another function based on map*:\n\n\
    ```\n(def channel (ms/create))\n(def incremented-values (map* inc channel))\n\
    (def incremented-twice (map* inc incremented-values))\n\n(consume incremented-twice\n\
    \  (fn [i] (println \"Incremented twice: \" i)))\n\n(accept channel 1)\n; 3\n\
    (accept channel 2)\n; 4\n\n(ms/flush channel)\n```\n\n# Streams and reduce\n\n\
    It is also very easy to apply some reducing function to the stream using the reduce*\
    \ function in the same ms meltdown namespace:\n\n```\n(require '[clojurewerkz.meltdown.streams\
    \ :as ms :refer [create consume accept reduce*]])\n\n(def channel2 (ms/create))\n\
    (def res (atom nil))\n(def sum (reduce* #(+ %1 %2) 0 channel2))\n(ms/consume sum\
    \ #(reset! res %))\n\n(ms/accept channel2 1)\n```"
