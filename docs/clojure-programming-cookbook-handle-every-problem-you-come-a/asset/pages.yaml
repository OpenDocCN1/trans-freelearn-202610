- pgno: 361
  md: "simply try to grab mouse clicks and print some messages. So, this would be\
    \ the following jQuery part:\n\n```\n$(document.body).click(function () {\n  ..\n\
    })\n```\n\nThe print click function we define as follows, in standard Clojure\
    \ code:\n\n```\n(defn click-fn[]\n  (println \"Clicked!\"))\n```\n\nNow that you\
    \ have the handler, let's react on mouse clicks. The DOM element we are targeting\
    \ is body. We access the JavaScript exposed jQuery object from ClojureScript via\
    \ js/jQuery and we call it with the parameter \"body\":\n\n```\n(js/jQuery \"\
    body\")\n```\n\nWe have the body element as a jQuery object, so let's use the\
    \ click function. In usual Clojure interop, the .click dispatching can be used:\n\
    \n```\n(.click\n  (js/jQuery \"body\")\n  click-fn)\n```\n\nSuppose you have some\
    \ text in the index.html page, say:\n\n```\n<body>\nClick me!\n...\n</body>\n\
    ```\n\nThat's right, now is the time to show some mouse-clicking power !! And\
