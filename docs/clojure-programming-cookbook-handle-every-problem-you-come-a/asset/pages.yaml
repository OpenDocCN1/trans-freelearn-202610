- pgno: 28
  md: '# About the Authors


    **Makoto Hashimoto** is a technical enthusiast in Japan. He has been involved
    in a lot of projects as an IT architect and led them successfully with his technical
    leadership. Makoto loves programming, especially with functional programming languages.
    Thus, he became an enthusiast of Clojure since his first encounter with this language.
    Recently, he is often involved in projects of the big data domain, and he constantly
    thinks up new ways to use Clojure for this domain. He loves spending time with
    his family during weekends and apart from that he loves cooking, classical music,
    arts and sports.


    Makoto has also written two books in Japanese. You can find them at http://amzn.to/2e0jySv
    and http://amzn.to/2eg3gq8.


    > *To my coauthor, Nicolas, working with you has been a great honor for me. Many
    thanks for your valuable advices and encouragements. To my family, I would like
    to thank my family and friends for their constant encouragements and support.
    Without you, there is no way that I would have been able to complete this work.*


    **Nicolas Modrzyk** has many years of experience in the field of IT and has spent
    many years in Asia. He loves making ideas a reality and the fact that this reality
    brings people from all around the planet together. He''s been involved in many
    IT projects, helping customers reach their goal and in general trying to make
    IT easier to reach for everyone.


    Nicolas fell into the Clojure soup 5 years ago; it helped him become more focused,
    and stop wasting time on the things that are not worth it. Clojure is more than
    just a fantastic programming language; it is a life full of adventure. Hopefully,
