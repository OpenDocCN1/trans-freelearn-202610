- pgno: 169
  md: "# Tracking when code was started\n\nThe first sample will be a macro that generates\
    \ things for us, the time `init` was called, and a function that tells us how\
    \ long the system has been up.\n\nThe macro is making use of two calls to `def`\
    \ - one for a simple value and the other for a function:\n\n```\n(defmacro track-init[]\n\
    \  `(do\n    (def init (System/currentTimeMillis))\n    (def up (fn [] (- (System/currentTimeMillis)\
    \ init))))\n  )\n```\n\nThe call to the Java platform's `System` class is a bit\
    \ overwhelming, but basically we just want to access the current time. Expand\
    \ the generated code as follows:\n\n```\n(macroexpand-1\n  '(track-init))\n```\n\
    \nWe see what looks like standard Clojure, defining one value and a function:\n\
    \n```\n(do\n  (def my-very-first-macro/init\n    (java.lang.System/currentTimeMillis))\n\
    \  (def my-very-first-macro/up\n    (clojure.core/fn []\n      (clojure.core/-\n\
    \        (java.lang.System/currentTimeMillis)\n        my-very-first-macro/init))))\n\
    ```\n\nExcept you did not write this code, the only thing you wrote in the first\
    \ place was that call to `track-init` macro:\n\n```\n(track-init)\n```\n\nNow,\
    \ in the namespace, the macro was called, therefore in the same namespace we have\
    \ `init` and `(up)` :"
  merge: -1
  img_proc: true
- pgno: 170
  md: "```\ninit\n; 1449641148783\n\n(up)\n; 596928\n```\n\nThis kind of macro, which\
    \ generates code for you, can be very helpful during development, so be careful\
    \ as this kind of macro can also leave some def-ed symbols about the place!\n\n\
    # Logging a message with macro\n\nIn the second example, we will simply look at\
    \ a dumb log macro that gives an output message when the log level is sufficient\
    \ and doesn't if not. Umm. Yes. I miss the days of 20 logging frameworks to rule\
    \ none of them. (But that is history.)\n\nSo, the following defines a top log\
    \ level that could be automatically loaded from a file, but I leave that to the\
    \ reader. We also define the log macro that gives output of the code only if the\
    \ log level is set to DEBUG:\n\n```\n(def LOG_LEVEL \"INFO\")\n\n(defmacro log\
    \ [msg]\n  (if (= LOG_LEVEL \"DEBUG\")\n    `(println ~msg)))\n```\n\nIn this\
    \ case, when we call the macro using the following statement:\n\n```\n(log \"\
    hello3\")\n; ...\n```\n\nYou got it right. Nothing is printed in the console.\
    \ Now, let's say we def the log level again, (hmmm ... this is not the recommended\
    \ way of doing things but bear with us here):\n\n```\n(def LOG_LEVEL \"DEBUG\"\
    )\n```\n\nWhen calling the log macro again, messages are shown in the console:\n\
    \n```\n(log \"hello3\")\n; .. hello3 in the console\n```"
