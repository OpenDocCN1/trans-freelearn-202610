- pgno: 171
  md: "We will let the reader check the code generated for each case with macroexpand-1,\
    \ as usual:\n\n```\n(macroexpand-1\n  ' (log \"hello3\"))\n; (println \"hello3\"\
    )\n```\n\n# How it works...\n\nI guess we have seen quite a bit on what the underlying\
    \ process is when playing with macros. Let's have a look at one of the macros\
    \ that is all over the Internet to create an iterative language looking for loop.\n\
    \nThe code for the loop macro is only slightly more difficult than what you have\
    \ seen so far. Notice how the return form of the macro is a list, through backquote,\
    \ and how the body steps are wrapped in a do:\n\n```\n(defmacro my-for-loop [\
    \ [sym init check change] & steps]\n  `(loop [~sym ~init value# nil]\n     (if\
    \ ~check\n       (let [new-value# (do ~@steps)]\n         (recur ~change new-value#))\n\
    \       value#)))\n```\n\nThe one new thing you may have noticed is the # sign\
    \ here and there, for example, new-value#. The sharp sign is an indication that\
    \ you would like to get a generated, qualified name for a variable or a function:\n\
    \n```\ngensym is the longer version of this #.\n(gensym \"hello\")\n; hello6075\n\
    ```\n\nIf we were not using gensym or #, we would try to get the value of, say,\
    \ new-value, which is not defined when the macro code is generated and thus would\
    \ throw an error.\n\nTo generate your own loop, you would then call the macro\
    \ as defined, with four parameters and a body:\n\n```\n(my-for-loop\n  [ i 0 (<\
    \ i 10) (inc i) ]\n```"
