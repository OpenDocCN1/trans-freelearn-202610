- pgno: 569
  md: "Let's start with very simple om.next code.\n\n# Getting started with om.next\n\
    \nLet's open src/om_next_example/core.cljs and modify as follows:\n\n```\n(ns\
    \ om-next-example.core\n  (:require [goog.dom :as gdom]\n            [om.next\
    \ :as om :refer-macros [defui]]\n            [om.dom :as dom]))\n(enable-console-print!)\n\
    (defui HelloClojure\n  Object\n  (render [this]\n    (dom/h1 nil \"Hello Clojure\
    \ !\")))\n\n(def hello (om/factory HelloClojure))\n(js/ReactDOM.render (hello)\
    \ (gdom/getElement \"app\"))\n```\n\nLet's save the file and open your browser\
    \ with http://localhost:3449. You can see Hello Clojure ! as in the following\
    \ screenshot:\n\n![](img/d7b631352a782ee50160cf8eb995152f_569_0.png)\n\nThen let's\
    \ modify it as follows and save it:\n\n```\n(defui HelloClojure\n  Object\n  (render\
    \ [this]\n    (dom/h1 nil \"Hello Clojurescript !\")))\n```\n\nYou can see the\
    \ following change in your browser:"
  merge: -1
  img_proc: true
- pgno: 570
  md: "![](img/d7b631352a782ee50160cf8eb995152f_570_0.png)\n\n# Using states\n\nWe\
    \ will learn to handle states in om.next. We will use REPL to develop the ClojureScript\
    \ application more interactive like live coding. Let's define the namespace and\
    \ libraries to use:\n\n```\n(ns om-next-example.core\n  (:require [goog.dom :as\
    \ gdom]\n            [om.next :as om :refer-macros [defui]]\n            [om.dom\
    \ :as dom]\n            [cljs-time.core :as t]\n            [cljs-time.local :as\
    \ l]\n            [cljs-time.format :as f]))\n;;=> nil\n(enable-console-print!)\n\
    ;;=> nil\n```\n\nLet's define get-local-now-string to generate a local time string:\n\
    \n```\n(defn get-local-now-string []\n  (f/unparse\n    ;; (f/formatters :date-hour-minute-second-ms)\n\
    \    (f/formatters :date-time-no-ms)\n    (l/local-now)))\n;;=> #'om-next-example.core/get-local-now-string\n\
    ```\n\nIt returns a local date and time:\n\n```\n(get-local-now-string)\n;;=>\
    \ \"2016-07-04T00:25:31+09:00\"\n```\n\nNow we will define an atom which is a\
    \ string of local date:"
  merge: -1
  img_proc: true
- pgno: 571
  md: "```\n(def app-state-date (atom {:date (get-local-now-string)}))\n;;=> #'om-next-example.core/app-state-date\n\
    ```\n\ndefui is a macro to define components. It creates a js class, inheriting\
    \ from React.Component. The next DateDisplay defines an HTML page for rendering\
    \ a button and a current date/time:\n\n```\n(defui DateDisplay\n  Object\n  (render\
    \ [this]\n    (let [{:keys [date]} (om/props this)]\n      (dom/div nil\n    \
    \    (dom/button\n          #js {:onClick\n               (fn [e]\n          \
    \       (swap! app-state-date update-in [:date]\n          get-local-now-string))}\n\
    \          \"Get current time \")\n        (dom/h2 nil (str \"Date : \" date))\n\
    \      ))))\n;;=> #object[Function \"function ....\n```\n\nLet's define a reconciler\
    \ that holds app-state-date as a state:\n\n```\n(def reconciler-date\n  (om/reconciler\
    \ {:state app-state-date}))\n;;=> #'om-next-example.core/reconciler-date\n```\n\
    \nLet's add a DOM root for the reconciler to control. The first parameter is a\
    \ reconciler, the second one is a component, and the last is a target DOM node:\n\
    \n```\n(om/add-root! reconciler-date\n              DateDisplay (gdom/getElement\
    \ \"app\"))\n;;=> #object[om-next-example.core.DateDisplay]\n```\n\nTo open the\
    \ http://localhost:3449, we can see the following screen:"
  merge: -1
  img_proc: true
- pgno: 572
  md: "![](img/d7b631352a782ee50160cf8eb995152f_572_0.png)\n\nThe preceding code is\
    \ quite straightforward; we will learn a more sophisticated way. First, we will\
    \ define an atom for the current date and time in the following code:\n\n```\n\
    (def app-state-date2 (atom {:date (get-local-now-string)}))\n;;=> #'om-next-example.core/app-state-date\n\
    ```\n\nThen, we will write a code using readers and mutators in om.next. Readers\
    \ are functions for reading data from states:\n\n```\n(defn read-date [{:keys\
    \ [state] :as env} key params]\n  (let [st @state]\n    (if-let [[_ value] (find\
    \ st key)]\n      {:value value}\n      {:value :not-found})))\n;;=> #'om-next-example.core/read-date\n\
    ```\n\nOn the other hand, mutators are functions for updating data in states as\
    \ follows:\n\n```\n(defn mutate-date [{:keys [state] :as env} key params]\n  (if\
    \ (= 'get-current-time key)\n    {:value {:keys [:date]}\n     :action #(swap!\
