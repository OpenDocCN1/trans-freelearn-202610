- pgno: 154
  md: "Yes, of course, keywords are functions). The keyword call does not return nil,\
    \ so some-> keeps on threading and moves on to the count function, which returns\
    \ 2. Also note that some-> helps guard against nil values, as the threading stops\
    \ as soon as the function called returns nil.\n\nSimilarly, we can thread through\
    \ ->> with some->> and apply a map function:\n\n```\n(some->> {:speed [50 90]}\n\
    \  :speed\n  (map inc)\n  average\n)\n; 71\n```\n\nA longer some->> threading\
    \ example could include calls to take, and filter as well:\n\n```\n(some->> {:speed\
    \ [50 90 100]}\n  :speed\n  (take 2)\n  (map inc)\n  (filter (fn[x] (> x 60)))\n\
    \  average\n)\n; 91\n```\n\nAgain, as said previously, this is really nice to\
    \ present very readable code. You know what each steps is doing - it is passing\
    \ the data from one step to the other.\n\nSweet, isn't it?\n\n# How it works...\n\
    \nSo what happens under the hood of those macros? As surprising as it is, not\
    \ much; the macros simply reorder each function call. See what happens when we\
    \ use macroexpand-1 to show us the code generated by the -> macro:\n\n```\n(macroexpand-1\n\
    ```"
