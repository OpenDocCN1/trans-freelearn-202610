  md: "We will use `apache/derby` and `org.clojure/java.jdbc` to access a derby which\
    \ is a small rdb library. So, we will add these libraries in the `project.clj`:\n\
    \n```\n```clojure\n:dependencies [[org.clojure/clojure \"1.8.0\"]\n          \
    \     [liberator \"0.14.1\"]\n               [compojure \"1.3.4\"]\n         \
    \      [ring \"1.5.0-RC1\"]\n               [ring/ring-core \"1.5.0-RC1\"]\n \
    \              [buddy \"0.13.0\"]\n               [ring/ring-jetty-adapter \"\
    1.4.0\"]\n               [clj-http \"2.2.0\"]\n               [cheshire \"5.6.1\"\
    ]\n               [org.clojure/java.jdbc \"0.6.1\"]\n               [org.apache.derby/derby\
    \ \"10.12.1.1\"]]]\n```\n```\n\nAfter adding entries, restart your REPL.\n\n#\
    \ Our service spec\n\nWe will create a small application to handle product info\
    \ as follows:\n\n| Product | Name | Description | Clock | RAM | Price |\n|---|---|---|---|---|---|\n\
    | macbook air 11.6 | Apple | Apple MacBook Air MVM2JLL/A 11.6-Inch laptop | 1.6\
    \ | 4 | 797.00 |\n| thinkpad x260 | Levovo | Lenovo ThinkPad X260 20F6005HUS 12.5\"\
    \ Ultrabook | 2.3 | 8 | 1,009.00 |\n| ASUS VivoBook | ASUS | ASUS VivoBook E200HA-US01-GD\
    \ Portable 11.6 | 1.8 | 2 | 199.99 |\n| Dell Inspiron | DELL | Dell Inspiron 11.6-Inch\
    \ 2 in 1 Convertible Touchscreen Laptop | 2.16 | 4 | 279.99 |\n\nTo store the\
    \ previous entries in your database, we will create the following table in Apache\
    \ Derby:\n\n| id | name | maker | description | clock | ram | price |\n|---|---|---|---|---|---|---|\n\
    | int | varchar(20) | varchar(10) | varchar(100) | float | Integer | BigDecimal\
    \ |"
