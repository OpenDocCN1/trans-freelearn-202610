  md: '# Using queues and topics in the RabbitMQ


    RabbitMQ is a multiprotocol message broker and one of the most popular brokers.
    RabbitMQ is written in Erlang; however, it provides client libraries for some
    major language such as Java, .NET, Ruby, and Erlang. In this recipe, we will show
    you producers and consumers using Langoh r, which supports AMQP 0-9.1.


    # Getting ready


    Here we will look at how to set up RabbitMQ server and Langoh r in the project.


    # Installing RabbitMQ


    You need to install RabbitMQ, a multiprotocol messaging broker first. We will
    use a Docker image for RabbitMQ:


    ```

    $ docker run -d --hostname my-rabbit --name some-rabbit

    rabbitmq:3

    ```


