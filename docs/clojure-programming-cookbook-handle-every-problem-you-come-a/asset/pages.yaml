- pgno: 562
  md: "```\n(ns mutant4.pipes\n  (:require [immutant.messaging.pipeline :as pl]))\n\
    (defn barme [m]\n  (map inc m))\n```\n\n```\n(defonce bar-pipeline\n  (pl/pipeline\
    \ \"bar\"\n    (pl/step barme)\n    (pl/step barme)\n  :concurrency 4))\n```\n\
    \nThe pipeline uses a specific queue and can only be defined once. Getting the\
    \ result of the pipeline on a data structure is just like calling a regular function.\
    \ The result is again a future, so to get the result directly you need to use\
    \ deref here again:\n\n```\n(deref\n  (bar-pipeline (take 1000 (repeat 1))))\n\
    ```\n\nWoohoo...multithreads for your many cores.\n\n# Using WebSockets made easy\n\
    \nImmutant would not be a framework if it did not have at least some WebSocket\
    \ support.\n\nFor plain and pure WebSocket support, Immutant provides a wrap-websocket\
    \ support that will take the request and callback definitions to create an async\
    \ channel.\n\nThis small demo will wait for WebSocket connections, send a message\
    \ to the queue when a client connects, and send some async simple messages to\
    \ the client:\n\n```\n    (require '[immutant.web.async :as async])\n(def callbacks\n\
    \  { :on-open (fn [ch] (println \"open!\"))\n    :on-message (fn [ch msg]\n  \
    \    (dotimes [msg 10]\n        (async/send! ch (str msg) {:close? (= msg 9)})\n\
    \      (Thread/sleep 100)))} )\n```"
  merge: -1
  img_proc: true
- pgno: 563
  md: "The main app just waits for requests:\n\n```\n(defn app [request]\n  (async/as-channel\
    \ request callbacks))\n```\n\nThe usual main code adds an extra wrapper for the\
    \ socket connections:\n\n```\n(require '[immutant.web.middleware :as me])\n(defn\
    \ -main []\n  (web/run-dmc (-> app\n                   (me/wrap-websocket callbacks))\n\
    \    :host \"0.0.0.0\"\n    :port 8000))\n```\n\nFor testing, you can write your\
    \ own client, or use the Chrome Simple Web Socket Client plugin:"
