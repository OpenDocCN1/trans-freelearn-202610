- pgno: 114
  md: "A very frequent usage of sorted-set is composing with into. into converts a\
    \ data structure, taking all the elements of the input, to another one of a given\
    \ type. You do remember basic usage of the into function, as follows:\n\n```\n\
    (into [] (range 5))\n; [0 1 2 3 4]\n(into {} [[:a :b] [:c :d]])\n; {:a :b, :c\
    \ :d}\n```\n\nCreating a new tree with sorted-set and adding elements to it via\
    \ into is therefore nicely suited and bird-friendly:\n\n```\n(into (sorted-set)\
    \ [3 2 9])\n; #{2 3 9}\n```\n\nFinally, as its name would tend to indicate, sorted-set\
    \ returns a set. This means there will be no duplicate values in the resulting\
    \ collection:\n\n```\n#{1 2 2 3}\n; java.lang.IllegalArgumentException: Duplicate\
    \ key: 2\n```\n\n# Working with sorted collection subsets\n\nTwo functions from\
    \ clojure.core are a great extension to sorted-set; they are subseq and rsubseq\
    \ for, as you just found, creating sub-sequences or reverse sub-sequences from\
    \ sorted sets. Both functions need a sorted set and will benefit from the internal\
    \ data structure being extremely fast.\n\nFor example, let's say we want to find\
    \ an element greater than 500 in a random list, and I am sure you do. We create\
    \ the sorted set with a call to sorted-set then pass this as a parameter to subseq\
    \ along with the test, <, and the key, 500:\n\n```\n(subseq\n  (apply sorted-set\n\
    \    (take 10\n      (repeatedly\n        #(rand-int 1000))))\n  > 500)\n; (537\
    \ 598 817 818 953 965)\n```"
