    \ 1 2 3))\n```\n\n# Removing odd values from a sequence\n\nHere, we generate five\
    \ random even integers lower than 100. remove will indeed remove all the elements\
    \ that are odd:\n\n```\n(take 5\n      (remove\n        odd?\n        (repeatedly\
