  md: "```\n:cljs (ClojureScript expression)\n:clr (Clojure CLR expression))\n```\n\
    \nWhen the preceding code runs on Clojure, (Clojure expression) is evaluated.\
    \ When the code runs on ClojureScript, (ClojureScript expression) is evaluated\
    \ and vice versa.\n\nSplice Reader Conditional macros are the same as Reader Conditional\
    \ macros, but an expression must be a vector. The expression will be spliced into\
    \ the resulting read.\n\nWe will write the following code:\n\n```\n(defn test-splicing-hello\
    \ []\n  #?@(:clj [(print \"hello \") (print \"world !\") (print \"\\n\")])\n;;=>\
    \ #'cljc-example.demo/test-splicing-hello\n```\n\nThe expression for the Splice\
    \ Reader Conditional macro is a vector, and the result of executing the method\
    \ is as follows:\n\n```\n(test-splicing-hello)\n;;=> hello world !\n;;=> nil\n\
    ```\n\nThe preceding code is equivalent to the following one:\n\n```\n(defn test-hello\
    \ []\n  (print \"hello \") (print \"world !\") (print \"\\n\"))\n;;=> #'cljc-example.demo/test-hello\n\
    ```\n\nSplice Reader Conditional macros cannot be located at top level. If we\
    \ do that, an exception like the following is thrown:\n\n```\n#?@(:clj\n  [(print\
    \ \"hello \") (print \"world !\") (print \"\\n\")])\n;;=> RuntimeException Reader\
    \ conditional splicing not allowed at the top level. clojure.lang.Util.runtimeException\
    \ (Util.java:221)\n```\n\nSplice Reader Conditional macros are often used in require/import.\
    \ We will show an example in this recipe."
