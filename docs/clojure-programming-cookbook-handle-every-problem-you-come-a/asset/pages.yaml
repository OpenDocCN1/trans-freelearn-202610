- pgno: 263
  md: '# Using MQTT


    As they say these days, the **Internet of things (IoT)** is bringing up a third
    industrial revolution. Devices will be talking to each other more and more to
    share information, real time, and the need for a low power, secure protocol to
    connect those devices together is greater than ever.


    What is MQTT? It is an OASIS-approved standard, machine-to-machine super lightweight
    transport protocol for publishing and subscribing activities.


    MQTT client are always connected to what is called an MQTT broker, never to each
    other.


    The MQTT protocol itself is based on top of TCP/IP, and both the MQTT client and
    the MQTT broker require a TCP/IP stack.


    MQTT has been designed specifically for IoT and is well suited for a wide range
    of scenarios such as:


    +   - Ad hoc social networking

    +   - Hospitals in need of immediate analysis on real-time data collected from
    patients going through

    +   - Environmental monitoring through the use of sensors in remote and rural
    areas such as seaside or mountains

    +   - Internal monitoring of cars to collect and send information on the different
    parts of the car in real time

    +   - Gambling machines distributed around a casino but that must regularly communicate
    with a central server

    +   - Cashier that sends transaction information and receives price updates over
    slow networks


    As you can see, the MQTT protocol has been designed with low memory and low processing
    power devices, and a restricted networking environment.


    # Getting ready'
  merge: -1
  img_proc: true
- pgno: 264
  md: 'We need a few things to get ready for this recipe, so we will install the broker,
    install a UI for our machine to check visually messages, and, lastly, configure
    our Clojure environment to be ready to talk to all those components.


    # Installing the MQTT broker


    To be ready to try and get a sense of the protocol, we need a small broker, meaning
    a component that will receive and broadcast messages according to their topics.


    While a few brokers are available, we recommend you use Mosquitto. It has an easy
    installer, or you can also compile it easily from the source code. On Macintosh,
    the following should do it for you:


    ```

    brew install mosquitto

    ```


    Of course, there are Linux packages and Windows installers also available. Once
    installed, start the broker simply from the command line with the following:


    ```

    mosquitto

    ```


    And observe something along those lines:


    ```

    1452329996: Using default config.

    1452329996: Opening ipv4 listen socket on port 1883.

    1452329996: Opening ipv6 listen socket on port 1883.

    ```


    While we are at it and before we start to send any message, let''s also install
    a helper graphical client.


    # MQTT graphical client


    Again there are quite a few available clients, so make sure you get something
    that works for you. But here we will recommend the one named MQTT-spy, which a
    Java-based client, doesn''t get in the way, and lets us see the different messages
    going through the broker.'
  merge: -1
  img_proc: true
