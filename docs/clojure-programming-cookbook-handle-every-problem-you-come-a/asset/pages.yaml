    \ !\")\n; ;=> producing message to exchange  queue1.cookbook  payload = Hello\
    \ !\n; ;=> nil\n```\n\nThen, let's run the consumer to obtain messages from the\
    \ queue. The message handler in the consumer prints the channel properties and\
    \ the message payload:\n\n```\n(simple-consumer \"queue1.cookbook\")\n; ;=> simple-consumer\
    \ is connected with id: 1\n; ;=> Received a message payload : Hello ! , tag :\
