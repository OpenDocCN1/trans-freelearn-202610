    \ since handleRequest is specified as part of the interface):\n\n```\n(ns aws-examples.lambda-example\n\
    \  (:gen-class\n    :implements\n    [com.amazonaws.services.lambda.runtime.RequestStreamHandler])\n\
    \  (:require [clojure.java.io :as io]\n            [clojure.data.json :as json]\n\
    \            [clojure.string :as str]))\n(defn -handleRequest [this is os context]\n\
    \  (let [w (io/writer os)\n        parameters (json/read (io/reader is) :key-fn\
    \ keyword)]\n    (println \"Lambda Hello Stream Output \")\n    (println \"this\
    \ class: \" (class this))\n    (println \"is class:\" (class is))\n    (println\
    \ \"os class:\" (class os))\n    (println \"context class:\" (class context))\n\
    \    (println \"Parameters are \" parameters))\n    (.flush w)))\n```\n\nUse lein\
    \ uberjar again to create a JAR file. Since we have an existing Lambda function\
    \ in AWS, we can overwrite the JAR used in the Hello World example. Since the\
    \ handler function name has changed, we must modify our Lambda configuration to\
    \ match. This time, the default test that provides parameters in JSON format should\
    \ work as-is.\n\nWe can very easily get a more interesting test of Hello Stream\
