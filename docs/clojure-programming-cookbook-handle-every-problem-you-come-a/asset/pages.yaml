  md: "```\n(defmacro x3 [ arg ]\n  (list * 3 arg ))\n```\n\nTo use it, we use that\
    \ as a regular code `eval` with the following:\n\n```\n(x3 2)\n```\n\n```\n; 6\n\
    ```\n\nWe do understand that the code generated is a list of three elements:\n\
    \n```\n(* 3 arg)\n```\n\nThe call to the macro will generate code and then evaluate\
    \ it:\n\n```\n; 6\n```\n\nMacros allow you to evolve the language in some ways\
    \ not previously thought of. You can recreate control flows and make things behave\
    \ in completely new ways. Superb, but let's go back a few steps to see what's\
    \ going on behind the scenes.\n\n# How it works...\n\nWe have already seen in\
    \ the previous recipe on threading macros that we can use `macroexpand-1` to see\
