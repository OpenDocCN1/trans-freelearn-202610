- pgno: 209
  md: '# Chapter 4. File Access and the Network


    In this chapter, we will cover the following topics:


    +   - Manipulating files and directories

    +   - Manipulating various formats of files - XML, JSON, YAML, and EDN

    +   - Making use of Clojure HTTP client

    +   - Using queues and topics in the RabbitMQ

    +   - Using Kafka

    +   - Using MQTT

    +   - Streaming access to provide high performance

    +   - Using Apache Camel to connect everything


    # Introduction


    In this chapter, we will learn about file access and network. First, we will have
    a look at how to manipulate files and directories. Then, we will learn how to
    read and write various file formats. Later, we will learn to access messaging
    middleware and protocols such as HTTP, AMQP, MQTT, RabbitMQ, and Kafka. Finally,
    we will learn Apache Camel, which is a mediation framework.'
