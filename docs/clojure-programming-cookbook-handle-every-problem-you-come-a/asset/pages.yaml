    \ by step.\n\nWe are looking at vectors of logic variables, marked as c1...c9,\
    \ and we will further reference this vector as vs:\n\n```\n(run* [c1 c2 c3 c4\
    \ c5 c6 c7 c8 c9 :as vs]\n```\n\nThe first constraint is that each logic variable\
    \ of the set will be in the interval 1 to 9. Here, everyg applies the same constraint\
    \ to all the lvars of vector vs:\n\n```\n(everyg\n  #(fd/in % (fd/interval 1 9))\n\
    \  vs)\n```\n\nWe want to make sure all lvars are distinct; we have seen this\
    \ fd/distinct previously:\n\n```\n(fd/distinct vs)\n```\n\nNow that we have a\
    \ set of relational constraints to apply, we use fd/eq to achieve this:\n\n```\n\
    (fd/eq\n  (= (- c4 c6) c7)\n  (= (* c1 c2 c3) (+ c8 c9))\n  (< (+ c2 c3 c6) c8)\n\
    \  (< c9 c8))\n```\n\nBefore the last part, a quick reminder on a forgotten usage\
