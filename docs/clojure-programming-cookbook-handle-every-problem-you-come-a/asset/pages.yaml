  md: "```\n(def f2 (future (fanout-consumer \"fanout.exchange\" \"my.queue2\" :num\
    \ 2)))\n;;=> starting consumer ...\n;;=> #'chapter04.rabbitmq/f2\n(def f3 (future\
    \ (fanout-consumer \"fanout.exchange\" \"my.queue3\" :num 3)))\n;;=> starting\
    \ consumer ...\n;;=> #'chapter04.rabbitmq/f3\n```\n\n# Testing fanout consumers\n\
    \nThen, the `fanout-publisher` publishes a message; three consumers receive the\
    \ message published by the producer:\n\n```\n(fanout-producer \"fanout.exchange\"\
    \ \"hello world !\")\n;;=> producing message to exchange  my.exchange  payload\
    \ = hello world !\n;= >  [1-1] hello world !\n;= >  [2-1] hello world !\n;= >\
    \  [3-1] hello world !\n;;=> nil\n```\n\nLastly, we will clean up the background\
    \ threads:\n\n```\n(for [x [f1 f2 f3]]\n  (future-cancel x))\n;;=> [true true\
    \ true]\n```\n\n# Using topic exchange\n\nThe fanout exchange distributes messages\
    \ to multiple queues at a time. We will define `topic-publisher` and `topic-consumer`.\
    \ Topic exchange routes messages by routing key patterns:"
