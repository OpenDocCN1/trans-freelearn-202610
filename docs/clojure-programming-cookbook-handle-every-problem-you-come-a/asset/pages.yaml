  md: '# Chapter 10. Deployment and DevOps


    In this chapter we will cover the following topics:


    +   - Riemann - monitoring deliverance and slacking

    +   - Deploying Clojure with Docker

    +   - Clojure on Amazon Web Services


    # Introduction


    This chapter will focus on deploying and monitoring your Clojure code. The first
    part will delve into deploying Clojure code with Docker containers, locally, remotely,
    and then to a platform as a service. Then you will have a look at how to monitor
    your application and, by extension, the servers where your code is running, using
    a Clojure-written monitoring tool named Riemann.


    Lastly, we will look at how we can make use of AWS services, including EC2, S3,
    and Lambda.'
  merge: -1
  img_proc: true
- pgno: 639
  md: '# Riemann - monitoring deliverance and slacking


    It always seems like a real pain to use monitoring in production. The only thing
    that should be important is to get the information you want when you want it,
    in the same way that you can pick up this book when you need to take your daily
    Clojure shot.


    In this recipe, we will look at Riemann, http://riemann.io, a stream-based monitoring
    framework. Riemann comes with easy client APIs, simple setup, an interactive dashboard,
    and simple interaction with other notification frameworks, such as the new kid
    on the block and Slack.


    The Riemann service, at its core, is written in Clojure and configured in Clojure.
    Event handling through streams concepts feels and acts very functional.


    Eventually, it should also become a breeze to set this up for your cluster of
    Raspberry Pi''s, and collect IoT knowledge in real time.


    # Getting ready


    This recipe is a bit different from the other ones as the main point of interaction
    is a service, so we will quickly go through installing the daemon, configuring
    it, preparing the client, and reviewing the dashboard.


    # Installing the Riemann service


    The package comes as an installer for a variety of platforms. The default installer
    for Raspberry Raspian and a few other Linux distributions is a deb file, which
    can be downloaded from the Riemann website, http://riemann.io:


    ```

    dpkg -I riemann_0.2.11_all.deb

    ```'
  merge: -1
  img_proc: true
- pgno: 640
  md: "Once Riemann is installed, you can start it with the following:\n\n```\nsudo\
    \ systemctl start riemann\n```\n\nYou can also control the daemon with the usual\
    \ systemd commands.\n\nGetting the daemon started is half the battle, so we will\
    \ also have a quick look at steps to configure the daemon for remote access.\n\
    \n# Configuring the Riemann daemon\n\nWhile many crustier configuration details\
    \ will be coming later on in this recipe, let's review the basics of configuring\
    \ the daemon.\n\nThe default configuration file is located at\n/etc/riemann/riemann.config,\
    \ and, in its original form, is pretty short.\nThis places the daemon logs in\
    \ the /var/log folder, and instructs them to listen to TCP, UDP, and WebSocket\
    \ connection (yes! Websockets...):\n\n```\n(logging/init {:file \"/var/log/riemann/riemann.log\"\
    })\n\n; Listen over TCP (5555), UDP (5555), and websockets\n; (5556)\n(let [host\
    \ \"0.0.0.0\"]\n  (tcp-server {:host host})\n  (udp-server {:host host})\n  (ws-server\
    \  {:host host}))\n```\n\nNote that the default host is not 0.0.0.0, but localhost,\
    \ so make sure you change it before going ahead so that you can send events from\
    \ remote machines.\n\n# The Riemann dashboard\n\nThe dashboard itself has been\
    \ developed in the Ruby language, using the Sinatra framework, but I am sure that\
    \ you'll go and implement a Riemann dashboard in Clojure and ClojureScript in\
    \ no time.\n\nNow, on to installing the dashboard, packaged as a Ruby gem:"
