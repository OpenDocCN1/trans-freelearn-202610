    \ the modified version of function named apply-fn-with-cas, which updates a Memcached\
    \ value using CAS. We will define apply-fn-with-cas in two REPLs.\n\n# In REPL-1:\n\
    \n```\n(defn apply-fn-with-cas [tc k fn]\n  (loop []\n    (let [ret (c/gets tc\
    \ k)\n          v (fn (:value ret))]\n      (when\n        (= (c/cas tc k (:cas\
    \ ret) v)  :exists)\n        (recur)))))\n;;=> #'spyglasbvs-example.core/apply-fn-with-cas\n\
