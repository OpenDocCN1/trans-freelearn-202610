  md: "```\n(generate-string {:friends {:friend \"nico\" :age 15}} {:pretty true})\n\
    ```\n\nCalling generate-string with the {:pretty true} parameter will return a\
    \ nicely indented and readable JSON document:\n\n```\n{\n  \"friends\" : {\n \
    \   \"friend\" : \"nico\",\n    \"age\" : 15\n  }\n}\n```\n\nAlso, when you generate\
    \ a JSON document, a function parameter is available to modify keys as needed,\
    \ most of the time to convert between Clojure keywords and regular strings. Here\
    \ we simply convert all the keys to uppercase:\n\n```\n(parse-string\n  \"{\\\"\
    friends\\\":{\\\"friend\\\":\\\"nico\\\",\\\"age\\\":15}}\"\n  (fn [k] (keyword\
    \ (.toUpperCase k))))\n; {:FRIENDS {:FRIEND \"nico\", :AGE 15}}\n```\n\nJSON is\
    \ quite ubiquitous in the API world, and being able to parse data from remote\
    \ services using it, it is always quite useful. JSON also fits well when you need\
    \ it to be human readable so as to make your API very explicit and easy to understand.\
    \ To connect to other systems out there, JSON seems like a welcome de facto choice.\n\
    \n# YAML isn't a markup language\n\nAt this point, you might start to notice that\
    \ most data formats work in a similar fashion in Clojure. Basically, you give\
    \ a generic Clojure data structure to a generator or a parser, and convert back\
    \ and forth to the required format.\n\nLet's have a quick look at how YAML, which\
    \ is not a markup language, can be generated from Clojure using the wrapper clj-yaml.\n\
    \nFirst, let's require the namespace:"
