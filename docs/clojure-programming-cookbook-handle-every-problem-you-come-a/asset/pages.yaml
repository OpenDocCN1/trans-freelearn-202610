- pgno: 613
  md: "# Herbert\n\nFrom the first part of the recipe, you remember Herbert, which\
    \ allows random inputs to be generated using a grammar.\n\nTo use Herbert's property\
    \ with defspec, you have to do a bit of parameter gymnastics from what you have\
    \ seen up to now.\n\nHere the checks come first, and the template for generation\
    \ comes second.\n\nThe example generates a map of two key-value pairs, :a and\
    \ :b, and checks that the first value of :a contains a map integer of value 0\
    \ in its second parameter:\n\n```\n(defspec hello-again\n  10\n  (hg/property\n\
    \    (fn [m] (== (get-in m [:a 1 :int]) 0))\n    '{:a (vec kw {:int 0}) :b str}))\n\
    ```\n\nThis technique is very useful when you want to have and generate large\
    \ maps or large vectors of inputs according to some data structure coming from\
    \ the outside world.\n\n# There's more...\n\nThe last part of this recipe would\
    \ like to show briefly how to apply the concepts introduced to API testing, and\
    \ in this context, compojure routing.\n\nSay you have a set of routes in an API;\
    \ it would be great to generate random inputs and make sure the logic is well\
    \ contained, and at least does not break the fundamentals of your application.\n\
    \nWe will consider the very simple routing, where a request with an ID reaches\
    \ the application, and the application always returns \"Hello Foo\".\n\nObviously,\
    \ this is not a great application to generate millions of dollars,"
  merge: -1
  img_proc: true
- pgno: 614
  md: "but there might be something in there:\n\n```\n(def my-routes\n  (routes\n\
    (GET \"/:id\" [] \"Hello Foo\")))\n```\n\nThe route is simple, but you would like\
    \ to generate random inputs and send requests to those compojure apps to verify\
    \ the returned results.\n\nHere is a simple utility method that shows the map\
    \ sent to the routing function. As you will have noticed, this simply sends a\
    \ map with the request type, the uri, headers and some parameters:\n\n```\n(defn\
    \ request [uri app & params]\n  (app {:request-method :get\n        :headers {\"\
    content-type\" \"text/plain\"}\n        :uri uri\n        :params params}))\n\
    ```\n\nWith this in your toolkit, let's use the application my-routes, and the\
    \ utility method to write a spec that tests our application:\n\n```\n(defspec\
    \ ringing\n  10\n  (prop/for-all [a gen/int]\n    (= \"Hello Foo\"\n       (:body\
    \ (request (str \"/\" a) my-routes [])))))\n```\n\nThe generator gives you a random\
    \ int, that is then used to create the uri for the request. Finally, we make sure\
    \ the returned result from the application is pretty rock solid, always returning\
    \ some nice Foo greetings.\n\nThe first example is pretty static, so what if you\
    \ want to actually have dynamically generated routing?\n\nIt works pretty much\
    \ all the same, and the only new thing is using a let block to bind the routing\
    \ within the test scope:\n\n```\n(defspec ringing-2\n  100\n  (prop'/for-all [a\
    \ gen/int]\n```"
  merge: -1
