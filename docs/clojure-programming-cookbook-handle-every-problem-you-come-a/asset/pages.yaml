- pgno: 360
  md: "the reference js. Let's try it with the ever-fashionable alert dialog box:\n\
    \n```\n(js/alert \"I'm home!\")\n```\n\nProvided that the Leiningen cljsbuild\
    \ command is still running, reloading the HTML page will bring you the familiar:\n\
    \n![](img/d7b631352a782ee50160cf8eb995152f_360_0.png)\n\n# Using jQuery from ClojureScript\n\
    \nSo let's say you want to convert some jQuery code to ClojureScript. Since we\
    \ have the js element available to us, we should be able to do that more or less\
    \ smoothly. A standard jQuery div toggling example could look the following:\n\
    \n```\n$(document.body).click(function () {\n  if ($(\"div:first\").is(\":hidden\"\
    )) {\n    $(\"div\").slideDown(\"slow\");\n  } else {\n    $(\"div\").hide();\n\
    \  }\n});\n```\n\nIn the preceding code, we show and hide div elements based on\
    \ clicks on the HTML body element. First, of all, let's add the script import\
    \ directive in the HTML file as usual:\n\n```\n<script src=\"http://ajax.aspnetcdn.com/ajax/jQuery/jquery-2.2.0.min.js\"\
    \ type=\"text/javascript\"></script>\n```\n\nActually, before converting the whole\
    \ piece of code together, let's"
