- pgno: 159
  md: "# Defining simple macros\n\nMacros in Clojure allow you to redefine the processing\
    \ flow and generate code through a simple but very Clojure-esque defmacro construct.\n\
    \nThis section will guide us through writing some of those building blocks and\
    \ reading some macro code from the original from Clojure.\n\n# Getting ready\n\
    \nMacro-biotics and a spoon are all you need for this recipe. No other agricultural\
    \ produce required.\n\n# How to do it...\n\nAll you ever wanted to know about\
    \ writing simple Clojure macros is in this section. Keep on writing those simple\
    \ macros until it finally makes sense.\n\n# Your first macro\n\nWell, here you\
    \ go. Your first macro is here:\n\n```\n(defmacro my-very-first-macro []\n  (list\
    \ println \"FIRST\"))\n```\n\nOkay, that was kind of a fast introduction to something\
    \ that deserves description; it's time to bring you upto speed.\n\nFirst, the\
    \ defmacro routine requires a name and some parameters. There you go, we give\
    \ it the name my-very-first-macro and, being a bit on the greedy side, no parameter\
    \ whatsoever.\n\nNow to the body of the macro itself. A macro should return a\
    \ list. Why a list? Remember that with Clojure, data is code. That returned list\
    \ will be what the code will be expanded or pre-compiled to by the Clojure compiler."
  merge: -1
  img_proc: true
