    \ this recipe would be a good mood document. It is obviously another example too!\n\
    \n# EEP for BDD\n\nYou may have heard of the EEP library for BDD. EEP stands for\
    \ Embedded Event Processing. This is obviously a very useful library on its own,\
    \ but how to use it in the context of Cucumber and BDD is also pretty interesting\
    \ too.\n\nBasically, you start by creating an emitter, which is the centralized\
    \ place that receives events. Then you register a listener on that emitter, here\
    \ :accumulator, and assign a function that is being called whenever some new event\
    \ is being sent to the emitter, along with data:\n\n```\n(def emitter\n  (eem/create\
    \ {}))\n```\n\n```\n(When #\"^the emitter is created$\" [])\n```\n\n```\n(When\
    \ #\"^the aggregator is created$\" []\n  (eem/defaggregator\n    emitter\n   \
    \ :accumulator ;; the event type to attach to\n    (fn [acc i] (+ acc i)) ;; the\
    \ function to apply to the stream\n    0) ;; the initial state\n  )\n```\n\nDefinitions\
    \ are in the bag, so during your test, you can send data to the aggregator at\
    \ given times, using notify:\n\n```\n(When #\"^some data is emitted to the aggregator$\"\
    \ []\n  ;; send 0-9 down the stream\n  (doseq [i (range 10)]\n    (eem/notify\
    \ emitter :accumulator i)))\n```\n\nFinally, whenever you need data, you can use\
    \ eem/get-handler that will finalize the event stream and return the computed\
    \ current result:"
