    \n```\n(def *host* \"172.17.0.2\")\n```\n\n# Defining a producer function\n\n\
    The following is the code of the function to produce a message:\n\n```\n(defn\
    \ simple-producer [qname payload]\n  (with-open\n    [conn (core/connect {:host\
    \ *host*})*]\n    ch (channel/open conn)]\n    (println \"producing message to\
    \ exchange \" qname \" payload = \" payload)\n    (queue/declare ch qname {:exclusive\
