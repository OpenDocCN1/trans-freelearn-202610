  md: "# Type hints\n\nType hints are there to assist the compiler in avoiding reflections\
    \ that decrease the performance. Type hints are Clojure's metadata tags placed\
    \ on symbols for function parameters, let-bound names, var names, or expressions,\
    \ and they are used by the compiler.\n\nLet's show some examples to reduce overheads\
    \ of reflections. The following code returns the length of the string using the\
    \ length method in the String class:\n\n```\n(def str \"This is a String\")\n\
    ;;=> #'performance-example.performance-tips/str\n(time (dotimes [_ 100000]\n \
    \     (.length str)))\n;;=> \"Elapsed time: 660.444886 msecs\"\n;;=> nil\n```\n\
    \nTo improve the performance, add a type hint ^String for str:\n\n```\n(def ^String\
    \ str \"This is a String\")\n;;=> #'performance-example.performance-tips/s\n(time\
    \ (dotimes [_ 100000]\n      (.length str)))\n;;=> \"Elapsed time: 14.516152 msecs\"\
    \n;;=> nil\n```\n\nThe next example shows type hinting for the function parameters\
    \ and how it improves the performance:\n\n```\n(defn my-concat [s1 s2]\n  (.concat\
    \ s1 s2))\n;;=> #'performance-example.performance-tips/my-concat\n(time\n  (dotimes\
    \ [_ 100000]\n    (my-concat \"Hello \" \"World !\")))\n;;=> \"Elapsed time: 653.67418\
    \ msecs\"\n;;=> nil\n(defn my-concat2 [^String s1 ^String s2]\n  (.concat s1 s2))\n\
    ;;=> #'performance-example.performance-tips/my-concat2\n(time\n  (dotimes [_ 100000]\n\
    ```"
