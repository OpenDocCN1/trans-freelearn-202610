  img_proc: true
- pgno: 451
  md: "# clojure-1.9.0-master-SNAPSHOT.jar\n\nThe first JAR contains compiled Java\
    \ classes and noncompiled Clojure code, while the second also contains the compiled\
    \ Clojure sources. This makes the slim JAR at around 1 MB and the normal JAR at\
    \ around 3.5 MB.\n\nThe advantage of having the Clojure files compiled is that\
    \ you wait less time when starting the virtual machine and the Clojure environment.\n\
    \nAs a reminder, you can start the Clojure Server REPL as easy as:\n\n```\njava\
    \ -cp \\\ntarget/clojure-1.9.0-master-SNAPSHOT-slim.jar \\\n-Dclojure.server.repl=\"\
    {:port 5555 :accept clojure.main/repl}\" \\\nclojure.main\n```\n\nOr the traditional\
    \ REPL with:\n\n```\njava -cp target/clojure-1.9.0-master-SNAPSHOT-slim.jar\n\
    clojure.main\n```\n\nWe will use the preceding generated Clojure JAR in a few\
    \ minutes, so keep the place it was generated in mind.\n\nNow on to see the generated\
    \ byte code.\n\n# How to do it...\n\nSay we have a very simple Clojure program\
    \ like the following one:\n\n```\n(ns gen3\n  (:gen-class [:main true]))\n\n(defn\
    \ -main[]\n  (println \"hello world\"))\n```\n\nThe preceding code does nothing\
    \ but print some greetings, but it will make it easier to see what is generated."
