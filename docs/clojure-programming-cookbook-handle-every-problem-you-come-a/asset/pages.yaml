- pgno: 450
  md: '# Hacking the Clojure code


    Along the great amount of code you have been running, it would be very surprising
    if you had come along a bug in Clojure itself.


    There may be features missing, but the core is impressively robust and stable.


    Under the hood, Clojure itself delegates byte code generation to a library named
    ASM. ASM produces the byte code that the Java machine can execute. This is done
    in real time when a Clojure program is running or can be done ahead of time, for
    example, when you want to package your code.


    This very short recipe will to look at how to compile the Clojure code and see
    the generated Java byte code.


    # Getting ready


    The Clojure code is hosted on GitHub, so to retrieve the code, head to https://github.com/clojure/clojure.
    To do a git checkout, use the following:


    ```

    git clone https://github.com/clojure/clojure.git

    ```


    To build your own version of Clojure, you will need one of the main Java build
    tools, called maven, which as of this writing is at version 3. Download and put
    the binary, mvn, accessible to your terminal:


    ```

    mvn package -Dmaven.test.skip=true

    ```


    Clojure is surprisingly very contained and fast to compile. The packaging only
    takes a few seconds. Once finished, you can find in the target folder the following
    two important files:


    ```

    clojure-1.9.0-master-SNAPSHOT-slim.jar

    ```'
