    \ Encoding/UTF8 (.DownloadData (WebClient.) uri))\n    reader (XmlReader/Create\
    \ (StringReader. res))\n  ]\n  (doto reader\n    (.ReadToFollowing \"astronomy\"\
    \ \"http://xml.weather.yahoo.com/ns/rss/1.0\")\n    (.MoveToAttribute \"sunset\"\
    ))\n  (str (.Value reader))))\n```\n\nThis comes up nicely, and we now have a\
    \ method to query sunset time from everywhere. So let's travel to Paris in a bit!\n\
    \n```\n(get-sunset \"Paris\" \"France\")\n; 6:00pm, at the time of the book writing\
    \ ;\n```\n\n# UI Prototyping\n\nNow to wrap this all up, we will go the extra\
    \ step of setting up a basic user interface (UI) to our wonderful function that\
    \ calls the Yahoo API. First, we will build a very simple UI and then we will\
    \ enhance our example to call the API based on a ComboBox! Excited? Sure you are!\n\
    \nWe start by loading and referring to the usual set of classes:\n\n```\n(System.Reflection.Assembly/LoadWithPartialName\
    \ \"System.Windows.Forms\")\n\n(ns hello.simpleui\n  (:import [System.Windows.Forms\
    \ Button Form Label])\n  (:import [System.Drawing Size Point]))\n```\n\nThen,\
    \ we define a new component for the overall UI using a let block:\n\n```\n(let\
    \ [\n  form (Form.)\n  load-btn (Button.)\n```"
