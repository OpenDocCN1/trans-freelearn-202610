  md: '# Realized?


    To partner with lazy sequences, we have the realized? function, which tells us
    whether a sequence or subsequence has been evaluated or not. Take the following
    example, which takes the first five elements of the previous lazy sequence:


    ```

    (def a (take 5 (iterate inc 0)))

    ; ''#a

    (realized? a)

    ; false

    (println a)

    ; console shows: (0 1 2 3 4)

    (realized? a)

    ; true

    ```


    We see that a has the possibility to be computed, but has not been evaluated until
    we actually refer to its value through the println function. realized? is very
    useful for checking whether a sequence has been fully computed or not.


    # Random sequences with repeatedly


    Now, let''s say we want to build a sequence of random integers. We similarly use
    another lazy sequence, producing a function named repeatedly. This function always
    calls to the same function, and does not depend on a current or previous seed:


    ```

    (repeatedly #(rand-int 10))

    ; (5 7 2 10 9 2 10 9 8 10 5 0 7 7 10 ...)

    ```


    # Using the macro lazy-seq


    To build a more generic lazy sequence, we can use the macro lazy-seq.


    From the Clojure lazy page, lazy-seq takes a body of expressions that returns
    an ISeq or nil, and yields a seqable object that will invoke the body only the
    first time seq is called, and will cache the result and return it on all subsequent
    seq calls.


    With this in mind, we can re-implement our random int to generate lazy'
