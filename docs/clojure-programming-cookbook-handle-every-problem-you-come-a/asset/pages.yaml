- pgno: 237
  md: "We can plug this to a core.async channel so that the response will be pushed\
    \ to a channel whenever the response is retrieved:\n\n```\n(ns chapter04.async\n\
    \  (:require [org.httpkit.client :as http])\n  (:require [clojure.core.async :as\
    \ async]))\n\n(defn async-get [url result]\n  (http/get url {:keepalive 60000}\n\
    \    #(async/go (async/>! result %))))\n```\n\nWe can then go through the finish\
    \ line, send async HTTP request, pipe the result to a channel, and then, finally,\
    \ do some simple reading from the same channel:\n\n```\n(time\n  (let [c (async/chan)\
    \ res (atom [])]\n\n    ;; send requests\n    (doseq [i (range 1 3)]\n      (async-get\n\
    \        (format\n          \"http://requestb.in/tp6d3jtp?requestnumber=%d\" i)\
    \ c))\n    ;; gather results\n    (doseq [_ (range 1 3)]\n      (swap! res conj\
    \ (async/<!! c)))\n    @res\n  ))\n```\n\nOf course, we could do some more processing\
    \ and encoding, but we will leave it as an exercise for you."
