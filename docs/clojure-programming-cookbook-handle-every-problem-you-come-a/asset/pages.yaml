- pgno: 117
  md: "```\n(into (sorted-map) {2 :b 3 :a})\n; {2 :b, 3 :a}\n```\n\nTo define our\
    \ own comparator, we will make use of `sorted-map-by`, which accepts a comparator\
    \ as the first argument. Here, we see how to sort the entries based on their values:\n\
    \n```\n(let [to-sort {:a 3 :b 5 :c 7 :d 2 :e 10 :f 1}]\n  (into\n    (sorted-map-by\n\
    \      #(compare\n          (get to-sort %1)\n          (get to-sort %2)))\n \
    \   to-sort))\n; {:f 1, :d 2, :a 3, :b 5, :c 7, :e 10}\n```\n\n# Are you sorted\
    \ yet?\n\n`sorted-map` and `sorted-set` are examples of sorted collections. Those\
    \ are actually implemented as Java data structures, and implement the `Sorted`\
    \ interface. To know if a collection is sorted or not, we refer to the `sorted?`\
    \ method, which delegates its result to the simple fact of whether the data structure\
    \ is implementing the `Sorted` interface or not. This is the Clojure snippet code\
    \ for sorted:\n\n```\n(instance? clojure.lang.Sorted coll)\n```\n\nThus, you can\
    \ sort a map and check if it is indeed sorted:\n\n```\n(sorted?\n  (sorted-map\
    \ :a 2 :b 3))\n; true\n```\n\nAs we have seen, a sorted collection can be used\
    \ as a parameter to `subseq` and `rsubseq`.\n\nBe aware that just because a collection\
    \ seems to be sorted, it does not mean `sorted?` will return true:\n\n```\n(sorted?\
    \ [1 2 3])\n; false\n```"
