  md: 'Now you can have wild pattern matching on notify calls to the reactor:


    ```

    (mr/notify reactor "Burger.withbacon" {:teh :payload})

    (mr/notify reactor "Burger.withcheese" {:das :payload})

    ```


    Note that the following message will obviously not call for anything on the reactor
    and no callback will be called:


    ```

    (mr/notify reactor "Sushi.salmon" {:das :payload})

    ```


    Keep playing around and see if you can get some nice sushi to your plate.


    # Streams


    Streams are an abstraction, building on the concept of reactive programming that
    allows you to apply real-time transformations to messages or values coming to
    the streams.


    Streams in meltdown can be seen as a root channel and functions applied to the
    channel.


    There are four main functions for streams:


    +   - `create`: This is where it all starts and you can define a new channel with
    it.

    +   - `map*`: This is a helper function that acts just like the Clojure core map
    function but acts on values coming from the channel.

    +   - `consume`: This is the last function of the composed function that acts
    on values. It will make use of the piping of functions using `map*` or something
    similar.

    +   - `accept`: This sends values to the channel.


    The following simple example shows you how to simply add 1 to integer values coming
    through the channel:


    ```

    (require ''[clojurewerkz.meltdown.streams :as ms :refer [create consume accept
    map*]])

    ```


    ```

    (def channel (ms/create))

    (def incremented-values (map* inc channel))

    ```'
