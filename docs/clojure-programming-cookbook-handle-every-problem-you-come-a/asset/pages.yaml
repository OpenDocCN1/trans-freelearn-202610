- pgno: 225
  md: "structure to and from bytes. Let's turn our friend Nick to bytes first:\n\n\
    ```\n(msg/pack\n  {:friends {:friend \"Nick\" :age 15}})\n; #<byte[] [B@60280b2e>\n\
    ```\n\nNow let's free our friend from its byte form through a simple round-tripping\
    \ example using pack/unpack:\n\n```\n(msg/unpack\n  (msg/pack\n    {:friends {:friend\
    \ \"Nick\" :age 15}}))\n; {:friends {:friend \"Nick\" :age 15}}\n```\n\nThis MessagePack\
    \ library also works smoothly with streams to read through very large binary files.\
    \ We will make use of Java classes DataInputStream and DataOutputStream to handle\
    \ the large streaming, and see that we can use those stream with the pack-stream\
    \ and unpack-stream functions.\n\nWe start by importing the necessary Java classes\
    \ and the io namespace:\n\n```\n(use 'clojure.java.io)\n(import\n  '(java.io.DataOutputStream)\n\
    \  '(java.io.DataInputStream))\n```\n\nNow we can write the content of our list\
    \ of friends to a file named pack.dat:\n\n```\n(with-open [o (output-stream \"\
    pack.dat\")]\n  (let [data-output (java.io.DataOutputStream. o)]\n    (msg/pack-stream\n\
    \      {:friends {:friend \"Nick\" :age 15}} data-output)))\n```\n\nAs a quick\
    \ reminder, by using with-open, we make sure the stream is properly closed when\
    \ we are finished processing.\n\nNow reviving our list of friends to Clojure,\
    \ we can use the unpack-stream function:\n\n```\n(with-open [i (input-stream \"\
    pack.dat\")]\n```"
