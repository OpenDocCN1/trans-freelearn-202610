    # Amazon S3


    Amazon S3 is Cloud storage. It provides a simple web interface that allows you
    to store and retrieve data. S3 API is easy to use but ensures security. S3 provides
    Cloud storage services and is scalable, reliable, fast, and inexpensive.


    # Buckets and keys


    Buckets are containers for objects stored in Amazon S3. Objects are stored in
    buckets. Bucket names are unique among all regions in the world. So, names of
    buckets are the top-level identities of S3, charge units, and access controls.


    Keys are the unique identifiers for an object within a bucket. Every object in
    a bucket has exactly one key. Keys are the second-level identifiers and should
    be unique in a bucket. To identify an object, you use a combination of the bucket
    name and key name.


    # Objects


    Objects are accessed by a bucket name and keys. Objects consist of data and metadata.
    Metadata is a set of name-value pairs that describe the characteristics of object.
    Examples of metadata are the date last modified and content type. Objects can
    have multiple versions of data.'
