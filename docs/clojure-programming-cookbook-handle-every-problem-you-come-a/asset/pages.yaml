    # pmap, pcalls, and pvalues


    Let''s learn about pmap, pcalls, and pvalues here. All three functions are related
    to parallelism and use multicores. The pmap function is the multithreaded version
    of map. The pcalls and pvalues functions create, execute, and join multithreads
    easily.


    The pmap function makes use of multicores effectively. It assigns threads per
    processing of an element. However, to assign too small a task to a thread causes
    overhead and is slower than the original map:


    Let''s study the performance aspect of pmap. In the following code, it calculates
    the volume of the cube from the length of the side:


    ```

    (time (doall (map #(* % % %) (repeatedly 100 rand))))

    ;;=> "Elapsed time: 78.548941 msecs"

    (time (doall (pmap #(* % % %) (repeatedly 100 rand))))

    ;;=> "Elapsed time: 184.195486 msecs"

    ```


    For the preceding example, the original map is faster. Assuming that the calculation
    takes more time, pmap is faster:


    ```

    (time (doall (map #(do (Thread/sleep 10) (* % % %)) (repeatedly 100 rand))))

    ;;=> "Elapsed time: 1012.360687 msecs"

    (time (doall (pmap #(do (Thread/sleep 10) (* % % %)) (repeatedly 100 rand))))

    ;;=> "Elapsed time: 156.927029 msecs"

    ```


    # pcalls


    pcalls executes functions in parallel and returns a lazy sequence of their values:


    ```

    (pcalls fn-1 fn-2 fn-3 ...)

    ```


    The following code calls a sum of 0 - 9999999 and 10000000 - 19999999 concurrently
    and waits for the results as a sequence:


    ```

    (time

    ```'
