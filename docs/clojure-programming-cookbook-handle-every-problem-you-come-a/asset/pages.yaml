- pgno: 362
  md: "Now the full ClojureScript version of the preceding jQuery code becomes easy\
    \ to write. Let's create a new callback function click-slide-fn:\n\n```\n(defn\
    \ click-slide-fn[]\n    (if (.is (js/jQuery \"div:first\") \":hidden\")\n    \
    \  (.slideDown (js/jQuery \"div\") \"slow\")\n      (.hide (js/jQuery \"div\"\
    ))))\n```\n\nAnd let's replace the code handling the click with the new callback:\n\
    \n```\n(.click\n  (js/jQuery \"body\")\n  click-slide-fn)\n```\n\nTo check the\
    \ div are playing with us nicely, let's add some colors and some div elements,\
    \ the whole HTML page looks like this:\n\n```\n<html>\n<head>\n  <style>\n   \
    \ div {\n      background:#ccff55; margin:3px; width:80px;\n      height:40px;\
    \ display:none; float:left;\n    }\n  </style>\n</head>\n<body>\n  Click me!\n\
    \  <div></div>\n  <div></div>\n  <div></div>\n  <script src=\"http://ajax.aspnetcdn.com/ajax/jQuery/jquery-2.2.0.min.js\"\
    \ type=\"text/javascript\"></script>\n  <script src=\"out/goog/base.js\" type=\"\
    text/javascript\">\n</script>\n  <script src=\"out/one.js\" type=\"text/javascript\"\
    ></script>\n  <script type=\"text/javascript\">goog.require(\"core\");</script>\n\
    </body>\n```"
  merge: -1
