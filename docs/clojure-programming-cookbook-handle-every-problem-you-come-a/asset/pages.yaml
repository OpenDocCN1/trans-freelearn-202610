  md: "+   - `reify` does not support extending superclasses, but proxy does\n+  \
    \ - `reify` requires object references for the parameter list, but proxy doesn't\n\
    +   - The performance of `reify` is better than that of proxy\n\n# There's more...\n\
    \nWhen we are writing Java code, we sometimes define anonymous classes to define\
    \ methods for specific purposes but not used by others. We can do the same thing\
    \ in Clojure.\n\n# Defining anonymous classes in Clojure\n\nInline definition\
    \ of anonymous classes is a common technique in Java:\n\n```\nimport java.util.List;\n\
    import java.util.Arrays;\nimport java.util.Collections;\nimport java.util.Comparator;\n\
    \npublic class ComparatorTest {\n    public static void main(String [] args) {\n\
    \        List<Integer> list = Arrays.asList(1, 3, 2, 5, 8);\n        Collections.sort(list,\
    \ new Comparator<Integer>() {\n            @Override\n            public int compare(Integer\
    \ o1, Integer o2) {\n                return Integer.compare(o1, o2);\n       \
    \     }\n        });\n        System.out.println(list);\n    }\n}\n```\n\nWe will\
    \ try to write the equivalent code in Clojure as follows:\n\n```\n(defn list-sort\
    \ [li]\n  (java.util.Collections/sort li\n    (reify java.util.Comparator\n  \
    \    (compare [this x y]\n        (Integer/compare x y)))))\n;;=> #'chapter05.proxy/list-sort\n\
    (def l1 (java.util.ArrayList. [3 1 5 2 4]))\n;;=> #'chapter05.proxy/l1\n(clojure.pprint/pprint\
    \ l1)\n;;=> [3 1 5 2 4]\n;;=> nil\n```"
