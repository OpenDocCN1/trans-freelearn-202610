  md: '# Chapter 5. Working with Other Languages


    In this chapter, we will cover the following topics:


    +   - Calling Java methods and accessing Java objects from Clojure

    +   - Extending Java superclasses and implementing Java interfaces

    +   - Calling Clojure from Java

    +   - Calling Scala from Clojure

    +   - ClojureCLR

    +   - ClojureScript


    # Introduction


    Clojure runs on the **Java Virtual Machine (JVM)**, and the Clojure language provides
    full access to Java. Java has huge assets and we can use all of them from Clojure.
    This is one of the great advantages of Clojure, which is also callable from Java.


    In this chapter, you will see how to instantiate objects from classes and how
    to access Java objects, including methods and fields, and also learn ways to inherit
    superclasses and ways to implement interfaces.


    You will also learn how to use Clojure on Microsoft''s .Net and JavaScript, using
    ClojureCLR and ClojureScript. This chapter will introduce to you how to set up
    ClojureCLR and ClojureScript environments and how to smoothly write code on them.'
