    # How it works...


    All collection types in Clojure are persistent and immutable. A persistent data
    structure preserves the previous versions of itself when it is modified. Clojure
    has efficient implementation to create modified versions of collections so it
    doesn''t simply copy the entire data structure, but shares the original data.


    # Clojure collections


    All collection types implement the `clojure.lang.Seqable` interface and its `seq`
    method returns `clojure.lang.ISeq`. `ISeq` has the `cons`, `first`, `more`, and
    `next` functions:'
