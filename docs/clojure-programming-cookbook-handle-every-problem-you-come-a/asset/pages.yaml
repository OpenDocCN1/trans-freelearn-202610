    # Couchbase Server


    Couchbase Server is a distributed NoSQL document database server with high performance,
    high scalability, and high availability. Couchbase cluster can consist up to hundreds
    of nodes to provide ultrahigh performance. A bucket in Couchbase is a set of documents
    similar to the DBMS database or schema.


    There are two types of buckets:


    +   - One is a Couchbase bucket type, which provides a JSON-based document database

    +   - The other is a Memcached bucket type


    We use the latter type. The following diagram is our Couchbase cluster running
    on Docker containers:'
