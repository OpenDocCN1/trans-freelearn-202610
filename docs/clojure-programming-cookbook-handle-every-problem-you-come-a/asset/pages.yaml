- pgno: 526
  md: "```\n...)\n\n(def last-value\n  (atom \"\"))\n\n(defn collect-cpu-fn[t params]\n\
    \  (let [\n    ; linux\n    command \"grep 'cpu ' /proc/stat | awk '{usage=($2+$4)*100/($2+$4+$5)}\
    \ END {print usage \\\"%\\\"}'\"\n    ; macos\n    ; command \"top -l 1 | head\
    \ -n 10 | grep CPU | awk '{print $2}'\"\n    cpu (:out (sh \"bash\" \"-c\" command))]\n\
    \    (dosync (reset! last-value cpu))))\n\n(def cpu-task\n  {:handler collect-cpu-fn\n\
    \   :schedule \"/3 * * * * * *\"\n   :params {}})\n\n(def sch1 (scheduler {:print-task\
    \ cpu-task}))\n(start! sch1)\n```\n\nThe atom value will be updated every 3 seconds,\
    \ with the latest polled value for CPU usage. The command to monitor the raw CPU\
    \ usage is slightly different from platform to platform; unfortunately, this is\
    \ hardly accessible from Java. Fortunately, we can revert to shell to get the\
    \ information we want.\n\nFollowing is a screenshot of the application, running\
    \ on a Raspberry Pi:"
