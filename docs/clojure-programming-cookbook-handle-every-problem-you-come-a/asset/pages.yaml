- pgno: 509
  md: '# Chapter 8. Web Applications


    In this chapter, we will cover:


    +   - Clojure with Vaadin - easy web widgets

    +   - Quickly create a REST API with Liberator

    +   - Working with Immutant - reusing infrastructure

    +   - Developing with om.next, the next-generation ClojureScript library


    # Introduction


    In this chapter, we will learn web application developments using Clojure. First,
    we will learn how to develop widget-based developments using Vaadin. We will learn
    how easy widget-based development is, using Vaadin through Clojure.


    Then, we will take a look at Liberator. Liberator is a library for developing
    resources in REST. We will develop a simple REST API with Liberator at the beginning
    but we will learn more advanced usages using Liberator.


    Next, we will learn about Immutant, a suite of Clojure libraries based on Undertow
    for web, HornetQ for messaging, Infinispan for caching, Quartz for scheduling
    and Narayama for transactions. Using Immutant for application developments, we
    can deploy to a WildFly or JBoss EAP cluster for enhanced features. In this recipe,
    we will learn to develop advanced web applications using Immutant. We will also
    learn to how to package and deploy our application.


    Finally, we take a look at David Nolen''s om.next. Om.next is a successor of om
    inspired by Facebook''s Relay, Netflix''s Falcor, and Cognitect''s Datomic. It''s
    still alpha but has new concepts for developing applications. In the recipe, we
    will learn the basic features of om.next.'
  merge: -1
  img_proc: true
- pgno: 510
  md: '# Clojure with Vaadin - easy web widgets


    Vaadin has been around for quite some time and is known to be an all coding-based
    UI framework for web applications. There are many frameworks out there for just
    doing web work of course, and even in this chapter we introduce some of the famous
    ones based on JavaScript libraries.


    Vaadin proposes to have a consistent set of easy-to-use widgets, that usually
    would be Java written. With a bit of Clojure magic, but mostly some ways of bridging
    the gap between compiled code and scripting, you can now use your favorite language
    to script the UI using those widgets and see updates in real time. In this recipe,
    you will also be introduced again to some reactive programming concepts in the
    scope of Vaadin with Clojure. Enjoy!


    # Getting ready


    To begin with programming in Clojure/Vaadin, you will start by setting up the
    `project.clj` file with some easy but specific settings. Let''s see what is inside.


    # Project settings


    To use the Vaadin classes, we will import the necessary libraries into our project.
    The Vaadin libraries will be included as regular dependencies. The `project.clj`
    file is also introducing the `lein-servlet` plugin, which is a plugin that plugs
    the usual Java-based server-side programming environment named `servlet`. The
    plugin also embeds a lightweight application server named Jetty.


    Finally, the `project.clj` file helps plug things together by starting the Jetty
    server, with the specified arguments, namely a web application that is bounded
    to the root path "/" and will be configured with the content'
  merge: -1
