- pgno: 167
  md: "# Defining more advanced macros\n\nWhen we started thinking about the structure\
    \ of the book, it all kind of made sense to talk about simple macros and advanced\
    \ macros. Now, arriving at the topic, the author has to admit it is not so clear\
    \ anymore. So, what do we mean when we talk about advanced macros? We tried to\
    \ ask Canon, but they would not give us a proper answer.\n\nIn this recipe, we\
    \ will therefore state that an advance macro is a macro that generates a form\
    \ that changes the flow of the evaluation of the resulting code. In the previous\
    \ recipe on simple macros, the macros were, well, simple, because the form generated\
    \ was always the same. This recipe will expose macros that always generate the\
    \ same code or where the control flow gets slightly more complicated. The goal\
    \ of course is to easily be able to write convenient macro in your code.\n\n#\
    \ Getting ready\n\nWhile there is no specific preparation for this recipe, let's\
    \ have a look at the clojure.core when we have a macro to guide us:\n\n```\n(defmacro\
    \ when\n  \"Evaluates test. If logical true, evaluates body in an implicit do.\"\
    \n  {:added \"1.0\"}\n  [test & body]\n  (list 'if test (cons 'do body)))\n```\n\
    \nWith what we learned, we can rewrite it in a slightly more concise form with\
    \ the backquote character:\n\n```\n(defmacro my-when\n  [test & body]\n  `(if\
    \ ~test (do ~@body)))\n```\n\nThe code generated is according to the plan:\n\n\
    ```\n(macroexpand-1\n  '(my-when (odd? (rand-int 2))\n```"
  merge: -1
  img_proc: true
- pgno: 168
  md: "```\n(println \"hello\")))\n; (if (odd? (rand-int 2)) (do (println \"hello\"\
    )))\n```\n\nGood. Now the thing we are interested in doing for advanced macros\
    \ is to generate more advanced code. So, following through this example, we will\
    \ write a macro that randomly generates code.\n\nThe macro in the following code\
    \ does not take a test as an input parameter anymore, just a body. We mostly moved\
    \ code around, but look! The unquote symbol is no longer at start of the body\
    \ of the macro, it is now nested inside the if statement.\n\nRemember the macro\
    \ body needs to return a Clojure form. The macro in the following code will randomly\
    \ return either the passed body list wrapped in a do, or an empty list:\n\n```\n\
    (defmacro random-when\n  [& body]\n  (if (odd? (rand-int 2))\n    `(do ~@body)\n\
    \    (list)\n    ))\n```\n\nTry the following a few times in your REPL and you\
    \ will see that the code generated is not always the same:\n\n```\n(macroexpand-1\n\
    \  '(random-when\n     (println \"Hello\")))\n; ()\n; OR\n; (do (println \"Hello\"\
    ))\n```\n\nA very silly example it is, but that should open your mind to new tracks\
    \ and adventures for ever more advanced macros!\n\n# How to do it...\n\nWe will\
    \ look at two small examples to see how some slightly advanced macros can facilitate\
    \ your developer's life and make your evening glass of wine easier to grasp."
  merge: -1
