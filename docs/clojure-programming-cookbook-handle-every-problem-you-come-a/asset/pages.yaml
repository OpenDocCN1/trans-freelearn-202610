  md: "# Using agents\n\nAgents mutate states asynchronously. Here, we will learn\
    \ how to create agents and update their values.\n\n# Creating agents\n\nTo create\
    \ an agent, we will use `agent` with an initial value. We will define `simple-agent`,\
    \ whose state is zero and is going to be updated asynchronously:\n\n```\n(def\
    \ simple-agent (agent 0))\n;;=> #'chapter06.concurrency/simple-agent\nsimple-agent\n\
    ;;=> #agent[{:status :ready, :val 0} 0x3aa1d3cc]\n```\n\n# Updating agents\n\n\
    To update the existing agents, use `send` with an update function. The following\
    \ example shows updating `simple-agent` with `inc` and the result of the agent\
    \ value will be 1:\n\n```\n(send simple-agent inc)\n;;=> #agent[{:status :ready,\
    \ :val 0} 0x3aa1d3cc]\n@simple-agent\n;;=> 1\n```\n\nLet's see the next example\
