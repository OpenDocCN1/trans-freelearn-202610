  md: '```

    @:


    (deref x)

    ;;=> 1

    @x

    ;;=> 1

    ```


    # Updating atom


    There are a couple of ways to update atoms. The swap atomically applies a function
    to the original value and sets the atom to it:


    ```

    (swap! x inc)

    ;;=> 2

    @x

    ;;=> 2

    (swap! x (partial + 1))

    ;;=> 3

    ```


    The following image shows how the atom value changes by swap:


    ![](img/d7b631352a782ee50160cf8eb995152f_370_0.png)


    The reset! function sets the value of atom regardless of the current value of
    atom:


    ```

    (reset! x 1)

    ;;=> 1

    x

    ;;=> #<Atom@541e8f8d: 1>

    ```'
