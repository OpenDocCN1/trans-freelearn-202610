- pgno: 260
  md: '| zookeeper.connect | "" | Zookeeper connection string in the form hostname:port.
    |

    | group.id | "" | A string that uniquely identifies the group of consumer processes
    to which this consumer belongs. |

    | auto.offset.reset | largest | What to do when there is no initial offset in
    ZooKeeper or if an offset is out of range:


    smallest - automatically resets the offset to the smallest offset


    largest - automatically resets the offset to the largest offset


    anything else - throws an exception to the consumer |

    | zookeeper.connection.timeout.ms | 6000 | The max time that the client waits
    while establishing a connection to ZooKeeper. |

    | consumer.timeout.ms | -1 | Throws a timeout exception to the consumer if no
    message is available for consumption after the specified interval. |

    | auto.commit.enable | true | If true, periodically commits to ZooKeeper the offset
    of messages already fetched by the consumer. This committed offset will be used
    when the process fails as the position from which the new consumer will begin.
    |


    The clj-kafka.consumer.zk/messages returns a lazy sequence of the clj_kafka.core.KafkaMessage.
    The KafkaMessage is defined as follows:


    ```

    (defrecord KafkaMessage [topic offset partition key value])

    ```


    The clj-kafka.core/with-resource is a macro and takes the following three parameters:


    +   - binding: This is a binding of the consumer connection

    +   - close function: This is called when function exits

    +   - body: This is the function body'
  merge: -1
  img_proc: true
- pgno: 261
  md: "As ZooKeeper remembers offsets where each consumer has the same group ID, consuming\
    \ a topic with the same group ID increments its offset as follows:\n\n```\n(core/with-resource\
    \ [c (zk/consumer consumer-config)]\n    zk/shutdown\n    (doall (take 1 (zk/messages\
    \ c \"test\"))))\n;;=> (#clj_kafka.core.KafkaMessage{:topic \"test\", :offset\
    \ 1,\n:partition 0, :key nil, :value #object[[\"B\" 0x2076f724 \"\n[B@2076f724\"\
    ]]})\n(core/with-resource [c (zk/consumer consumer-config)]\n    zk/shutdown\n\
    \    (doall (take 1 (zk/messages c \"test\"))))\n;;=> (#clj_kafka.core.KafkaMessage{:topic\
    \ \"test\", :offset 2,\n:partition 0, :key nil, :value #object[[\"B\" 0x4d0d3a0b\
    \ \"\n[B@4d0d3a0b\"]]})\n(core/with-resource [c (zk/consumer consumer-config)]\n\
    \    zk/shutdown\n    (doall (take 1 (zk/messages c \"test\"))))\n;;=> (#clj_kafka.core.KafkaMessage{:topic\
    \ \"test\", :offset 3,\n:partition 0, :key nil, :value #object[[\"B\" 0x125f8cd0\
    \ \"\n[B@125f8cd0\"]]})\n```\n\n# There's more...\n\nHere, we will learn how to\
    \ create a new topic.\n\n# Creating a new topic\n\nThe following code creates\
    \ a new topic named \"test-topic\":\n\n```\n(with-open [zk (admin/zk-client \"\
    127.0.0.1:2181\")]\n    (let [topic \"test-topic\"]\n      (if-not (admin/topic-exists?\
    \ zk topic)\n        (admin/create-topic zk topic\n                          \
    \  {:partitions 1\n                             :replication-factor 1\n      \
    \                       :config {\"cleanup.policy\"\n                        \
    \              \"compact\"}})))\n)\n;;=> nil\n```\n\n# See also"
