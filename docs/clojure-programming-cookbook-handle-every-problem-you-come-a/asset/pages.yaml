- pgno: 659
  md: '# Deploying Clojure with Docker


    It''s hard to not hear people talk about Docker in the IT world these days. The
    idea that you can describe how to build a consistent image and are then able to
    run it on different servers makes it a great step forward in the world of component-based
    applications.


    In this recipe, you will see how you can turn a standard Clojure web app into
    a Docker container, basically making sure that you can distribute your code to
    as many locations as possible.


    # Tip


    It is also a great way to keep multiple machines up to date! Using `latest` as
    a tag, you can also make sure different machines always get the latest version
    of your software running.


    # Getting ready


    In this recipe, we assume there is a main guest, the dev machine running either
    Mac OS or Windows, and another machine running a Debian system.


    # Installing Docker on OS X or Windows


    At the time of writing, Docker for Mac is just out, and makes it so very easy
    to install Docker on your machine; it is a huge step forward.


    https://docs.docker.com/engine/installation/mac/#/docker-for-mac


    Basically, download the installer, run the installer, and...there''s the Docker
    admin icon showing in the top bar:'
  merge: -1
  img_proc: true
