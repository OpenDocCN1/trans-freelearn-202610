    # How it works...


    Maps, sets, and vectors implement clojure.lang.IFn. Clojure functions such as
    + implement IFn. This is the reason why maps and sets can be functions. ifn? tests
    whether an argument implements clojure.lang.IFn:


    ```

    (ifn? +)

    ; ;=> true

    (ifn? [])

    ; ;=> true

    (ifn? {})

    ; ;=> true

    (ifn? #{})

    ; ;=> true

    (ifn? :a)

    ; ;=> true

    (ifn? ''())

    ; ;=> false

    (ifn? 1)

    ; ;=> false

    ```


    Vectors and maps are functions, but lists and integers are not functions.'
