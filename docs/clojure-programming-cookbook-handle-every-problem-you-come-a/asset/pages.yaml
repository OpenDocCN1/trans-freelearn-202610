  md: "# REPL.\n\nGiven takes a regexp, bindings, and a body. This will set the assumptions;\
    \ here, we gather two bindings, a and b, through pattern matching in the Given\
    \ sentence:\n\n+   - a will eventually be bound to the value 50\n+   - b will\
    \ eventually be bound to the value 100\n\nThe body of Given sets the result atom\
    \ to the addition of a and b. Then will be where to put the clojure.test assertions\
    \ (or any other test framework for that matter). Here, assert validates the value\
    \ given in the sentence, with the addition previously:\n\n```\n(use 'clojure.test)\n\
    (def result (atom 0))\n(Given #\"^I add (\\d+) and (\\d+)$\" [a b]\n      (reset!\
    \ result (+ (bigdec a) (bigdec b))))\n(Then #\"^the result is (\\d+)$\" [expected]\n\
    \      (assert (= (bigdec expected) @result)))\n```\n\nLet's run this features00\
