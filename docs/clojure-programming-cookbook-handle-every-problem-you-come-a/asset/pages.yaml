- pgno: 580
  md: "The following method is for creating a map for a new task and inserting it\
    \ into the task-state:\n\n```\n(defmethod mutate-task 'task/new [env key params]\n\
    \  (let [\n    state (:state env)\n    id (get-next-id (:task @state))\n    new-task\
    \ (assoc params :id id)]\n    {:action\n     (fn []\n       (swap! state update\
    \ :task conj new-task))}))\n;;=> #object[cljs.core.MultiFn]\n```\n\nThen, we will\
    \ define a method for toggling the state between finished/not finished for tasks.\
    \ The get-index-for-id is to get an array position for id:\n\n```\n(defn get-index-for-id\n\
    \  [id task]\n  (-> (for [[index task] (map-indexed vector task)\n           \
    \ :when (= id (:id task))]\n        index) first))\n;;=> #'om-next-example.task/get-index\n\
    ```\n\nThe following method toggles the state of tasks between finished/not finished:\n\
    \n```\n(defmethod mutate-task 'task/toggle\n  [env key params]\n  (let [state\
    \ (:state env)\n        id (:id params)\n        index (get-index-for-id id (:task\
    \ @state))]\n    {:action\n     (fn []\n       (swap! state update-in [:task index\
    \ :finished] not))}))\n;;=> #object[cljs.core.bMultiFn]\n```\n\nFinally, we will\
    \ define a method for deleting tasks:\n\n```\n(defn delete-task\n  [task id]\n\
    \  (-> (remove #(= id (:id %)) task) vec))\n;;=> #'om-next-example.task/delete-task\n\
    (defmethod mutate-task 'task/delete\n  [env key params]\n```"
