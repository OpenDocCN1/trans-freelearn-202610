  md: '# Using bindings of vars, conditions, loops, and error handling


    In this recipe, we will review Clojure programming control structures related
    to vars and values, conditions, iterations, and loops. We will use the following
    special forms, macros, and functions:


    +   - `def` and `let`

    +   - `if` and `if-not`

    +   - `when` and `when-not`

    +   - `case` and `cond`

    +   - `do` and `dotimes`

    +   - `loop` and `recur`

    +   - `try... catch... throw`


    # Getting ready


    You only need REPL, as described in the first recipe in this chapter, and no additional
    libraries. Start REPL so that you can test the sample code immediately in this
    recipe.


    # How to do it...


    Let''s start with how to use `def` and `let` to bind vars.


    # def and let


    `def` is a special form that binds symbols in the global scope in their namespace.
    `def` requires var and value:


    ```

    (def var val)

    ```


    This sample binds x to 100:


    ```

    (def x 100)

    ;;=> 100

    ```'
