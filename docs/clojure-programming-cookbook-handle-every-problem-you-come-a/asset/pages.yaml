  md: '# How STM works in Clojure


    STM supports concurrent access to shared resources. STM does not use a lock-based
    synchronization. Instead, it uses **Multiversion of Concurrency Control** (**MVCC**)
    for solving concurrent updates to shared resources.


    Using MVCC, each transaction has a private copy of the state and checks whether
    the state is not updated by another transaction. If there is no update by another
    transaction, the transaction commits, otherwise that transaction rolls back and
    retries.


    Traditional transactions of a database mechanism have the property of **ACID**
    (**Atomicity, Consistency, Isolation, and Durability**). However, since STM does
    not persist states, it does not have the Durability characteristic.


    # Alter and commute


    The `commute` is faster than the `alter` when the order of updates does not matter.
    It makes no difference to when concurrent processes update a counter, the result
    is the same. You can use `commute` in such cases.


    # There''s more...


    We will show functions related to parallelism here. Let''s start with `promise`
    and `deliver`.


    # promise and deliver


    `promise` delays it''s execution until `deliver` sets it value. Let see a simple
    example. There are x, y, and z defined by `promise`:


    ```

    (def x (promise))

    ;;=> #''chapter06.concurrency/x

    (def y (promise))

    ;;=> #''chapter06.concurrency/y

    (def z (promise))

    ;;=> #''chapter06.concurrency/z

    ```'
  merge: -1
  img_proc: true
