    ```\n(defn print-loop [channel prefix]\n  (go-loop []\n    (let [{:keys [option]}\
    \ (<! channel)]\n      (println prefix \" \" option)\n      (recur))))\n(print-loop\
    \ sushi-chan :sushi)\n(print-loop burger-chan :burger)\n```\n\nYou can know dispatch\
    \ food at will and have a great lunch:"
