- pgno: 439
  md: "# On Quasar/Pulsar\n\nPulsar is a Clojure wrapper for the Quasar library, which\
    \ is an actor-based programming toolkit for the JVM. When using actor libraries,\
    \ actors usually map one on one to a thread, and therefore may take more resources\
    \ than necessary to handle the sometimes simple code they need to process.\n\n\
    Quasar and Pulsar introduce the concept of fibers, or really lightweight processing\
    \ units, which can send messages to each other. This results in a simple to read\
    \ and use set of processing units that facilitate asynchronous programming to\
    \ a new level.\n\n# Getting ready\n\nA new `project.clj` file needs to be slightly\
    \ updated with dependencies. Also note the `java-agent` directive that adds Quasar\
    \ core to the set of runtime instrumentation.\n\nNote that the purpose of an agent\
    \ is to provide instrumentation capabilities to the application, in other words,\
    \ the capability to redefine the signature of the class files during run-time.\
    \ The juicy details would need a reading of the Quasar code, but let's just say\
    \ that Quasar does a bit of byte code manipulation to create and manage its fibers.\n\
    \nThe following is the `project.clj` file:\n\n```\n(defproject quasarland \"0.1.0-SNAPSHOT\"\
    \n  :java-agents [[co.paralleluniverse/quasar-core \"0.7.5\"]]\n  :dependencies\
    \ [\n    [org.clojure/clojure \"1.8.0\"]\n    [co.paralleluniverse/quasar-core\
    \ \"0.7.5\"]\n    [co.paralleluniverse/pulsar \"0.7.5\"]\n  ])\n```\n\n# How to\
    \ do it...\n\nThis short section will have a look at how to define, instantiate,\
    \ and"
  merge: -1
  img_proc: true
- pgno: 440
  md: "make those actors communicate with each other.\n\nOur namespace declaration\
    \ will require Pulsar's core and actor namespaces. Note here the usage of refer-clojure\
    \ to avoid conflicts on promise and await:\n\n```\n(ns quasarland.firststeps\n\
    \  (:use [co.paralleluniverse.pulsar core actors])\n  (:refer-clojure :exclude\
    \ [promise await]))\n```\n\nOn to your first actors, which, to be honest, will\
    \ go on a rest and relax:\n\n```\n(defsf n relaxing-afternoon []\n  (println \"\
    I am relaxing ...\"))\n```\n\ndefsf n defines a suspendable function that can\
    \ be used by a fiber or actor and is used exactly like the usual defn.\n\nNow\
    \ we mostly just defined a function, which we can call a regular function:\n\n\
    ```\n(relaxing-afternoon)\n;I am relaxing ...\n```\n\nWhat we want though is not\
    \ a function, but something that acts as a standalone processing unit. This is\
    \ done through the use of spawn, which instantiates a Pulsar actor:\n\n```\n(spawn\
    \ relaxing-afternoon)\n; #object[co.paralleluniverse.actors.ActorRef 0x130599b8\
    \ \"ActorRef@130599b8{PulsarActor@1fac12d3[owner: fiber-10000002]}\"]\n    ; I\
    \ am relaxing ...\n```\n\nYou still get the relaxing message on the console, but\
    \ you also get a reference to an actor. Our actor is still quite lazy and, apart\
    \ from being lazy on a Sunday afternoon, is not doing much. To make him wake up\
    \ after a while, we can use some sleeping code:\n\n```\n(defsf n relaxing-afternoon-2\
    \ []\n  (println \"I am relaxing ...\")\n  ; (Thread/sleep 2000) fails here !\n\
    ```"
