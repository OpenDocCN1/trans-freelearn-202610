- pgno: 172
  md: "```\n(println\n  (str \"- \" (rand-int i)))\n; this is the part where you look\
    \ at the console\n```\n\nAfter just a bit of clean up, the generated code looks\
    \ like the following, which is mostly a simple loop, but we'll admit that the\
    \ preceding was easier on the eyes:\n\n```\n(loop [i 0 value nil]\n  (if (< i\
    \ 10)\n    (let [new-value\n          (do (println (str \"- \" (rand-int i))))]\n\
    \      (recur (inc i) new-value))\n    value))\n```\n\nA nice way to write your\
    \ own macro is actually to first write what you want the generated code from the\
    \ macro to be like, then work your way backward to the defmacro exercise.\n\n\
    Voila!\n\n# There's more...\n\nThere's more, but not much as far as macros are\
    \ concerned. Macros are fast, so be sure to use them when you can.\n\nTo finish\
    \ on my favorite example, we will quickly have a look at the deftest macro from\
    \ clojure.test.\n\n# deftest\n\nWithout all the boilerplate, this is how the deftest\
    \ macro looks. You have to admit that you are not surprised by the macro-specific\
    \ syntax anymore, are you?\n\n```\n(defmacro deftest\n  [name & body]\n  (when\
    \ *load-tests*\n    `(def ~(vary-meta name assoc :test `(fn [] ~@body))\n    \
    \   (fn [] (test-var (var ~name))))))\n```"
