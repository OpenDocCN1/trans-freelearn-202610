    They both use a similar set of parameters, so it is also easy to just try sending
    messages over different connection settings.


    To publish a message, we will use the mosquitto_pub script and tell it to connect
    to localhost, and then indicate the topic and, finally, the message:


    ```

    mosquitto_pub -h localhost -t topic/hello -m "one more cup of coffee?"

