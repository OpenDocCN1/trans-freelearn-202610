    \  (let [ret (c/gets tc k)\n          v (fn (:value ret))]\n      (when\n    \
    \    (= (c/cas tc k (:cas ret) v)  :exists)\n        (recur)))))\n;;=> #'spyglasbvs-example.core/apply-fn-with-cas\n\
    ```\n\nIn the latter case, apply-fn-with-cas retries an update.\n\nLet's increment\
