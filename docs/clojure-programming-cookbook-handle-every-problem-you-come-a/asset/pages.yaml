    (defresource product-list\n  :allowed-methods [:get :post]\n  :available-media-types\
    \ [\"application/json\"]\n  :exists? (fn [ctx]\n            (let [params (-> ctx\n\
    \                             (get-in [:request :params])\n                  \
    \           to-keyword-map)\n```"
