- pgno: 426
  md: "```\n(ms/accept channel2 2)\n(ms/accept channel2 3)\n(ms/flush channel2)\n\n\
    @res\n; 6\n```\n\nThe preceding example also highlights the usage of flush, which\
    \ has not really been required up to now. As with most Clojure code, evaluation\
    \ is mostly lazy. So, flush forces all the values in the channel to be used and\
    \ to go through all the functions applied on the streams.\n\n# Combining functions\
    \ with a graph\n\nMeltdown also has a namespace that offers what is called stream-graph.\
    \ Think of it as easy-to-use syntactic sugar when you need to combine functions\
    \ applied to your channels:\n\n```\n(require '[clojurewerkz.meltdown.stream-graph\
    \ :refer :all])\n\n(def res (atom 0))\n(def channel (graph  (create)\n       \
    \             (map* inc\n                    (reduce* #(+ %1 %2) 0\n         \
    \           (consume #(reset! res %)))))\n(accept channel 1)\n(accept channel\
    \ 2)\n(accept channel 3)\n\n(ms/flush channel)\n@res\n; 6\n```\n\n# Custom streams\n\
    \nThis is a very cool solution for a constant problem where you want to check\
    \ values coming through a stream. Say you want to raise an alert if the temperature\
    \ is too high from a stream of constantly in coming temperature values. You can\
    \ define a custom stream that gets values from an upstream and only send values\
    \ to a downstream if those are higher than 40 degrees Celsius."
