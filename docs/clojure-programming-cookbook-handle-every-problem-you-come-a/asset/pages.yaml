  md: "# How to do it...\n\nReactive programming is based around a single point of\
    \ event receiving and event dispatching, which, in meltdown terms, is named a\
    \ reactor. First, we will see the basic interactions with a reactor.\n\n# Defining\
    \ a reactor\n\nDefining a reactor is done through a simple binding using a call\
    \ to def to the proper create function of meltdown namespace, as shown in the\
    \ following:\n\n```\n(require '[clojurewerkz.meltdown.reactor :as mr])\n(def reactor\
    \ (mr/create))\n```\n\nThis reactive point can be seen as a common point of communication\
    \ to a conversation with multiple participants. It could also be seen as a topic.\n\
    \nNow let's say you want to react to a message being sent to that point of communication\
    \ or more precisely you want to have a function that will react to a message or\
    \ a group of messages sent to the reactor.\n\nThe function will be executed when\
    \ a message is sent to the reactor and a message key can be selected by our selector.\n\
    \nThis is done as follows, where we start by requiring the proper namespace for\
    \ selectors from meltdown and then define a selector and a function that will\
    \ be called if needed:\n\n```\n(require '[clojurewerkz.meltdown.selectors :refer\
    \ [$]])\n```\n\n```\n; create a reactive function on a reactive point\n(mr/on\
    \ reactor\n  ; selector\n  ($ \"key\")\n  ; function that will be executed when\
    \ the selector has matched\n  (fn [event]\n    (println event)))\n```"
  merge: -1
  img_proc: true
- pgno: 422
  md: "# Sending a message to a reactor\n\nNow to the part where you send a message\
    \ to the reactor, hope it will execute the function with the println block. To\
    \ send a message, you will use the notify function of the main meltdown namespace\
    \ followed by the reactor, the key, and the message itself, which can be of any\
    \ type, but here we will use a simple map:\n\n```\n; send a message\n(mr/notify\
    \ reactor \"key\" {:my \"payload\"})\n```\n\nAnd so, if you had been typing all\
    \ the preceding at the REPL and were checking at the console, you would see the\
    \ println function being called and the event being printed:\n\n```\n{:data {:my\
    \ payload}, :reply-to nil, :headers {}, :key key, :id #uuid \"42d33831-110b-11e6-f3e1-5dbaf4ef3e34\"\
    }\n```\n\nWe can see that a message is made of a payload, contained in the :data\
    \ key, which is the data associated with the message that we send. The message\
    \ obviously has a unique ID and comes with a set of headers.\n\n# Going the sync\
    \ way\n\nNow this second way of sending message means that we want the message\
    \ to do a kind of ping-pong with the sent message. A receive-event call is also\
    \ using a selector and a reactor, but will also do some processing on the data:\n\
    \n```\n(mr/receive-event\n  ; we bind to a reactor\n  reactor\n  ; define a selector\n\
    \  ($ \"hello-key\")\n  ; do some processing. And send some data back, here \"\
    response\"\n  (fn [_] (Thread/sleep 2000)  \"response\"))\n```\n\nThe second part\
    \ involves sending the message itself using the send-event function. The first\
    \ three arguments are the same as when using the notify function. The last parameter\
    \ is a callback function that is called"
