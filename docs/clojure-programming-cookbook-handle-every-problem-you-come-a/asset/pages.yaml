    ```\n\nWe get the code that is generated by the macro:\n\n```\n(#object[clojure.core$println\
    \ 0xe1e81f5 \"clojure.core$println@e1e81f5\"] \"FIRST\")\n```\n\nFeels extremely\
    \ familiar, right? And so it should be, this is the code we saw in detail when\
    \ we wrote the following:\n\n```\n(list println \"FIRST\")\n; ...\n```"
