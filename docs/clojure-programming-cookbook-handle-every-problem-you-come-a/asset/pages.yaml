  md: "# How it works...\n\nWe have been keeping this secret so far, but yes, functions\
    \ in Clojure are all implementing an abstract class named AFunction. (At least\
    \ on the JVM ....):\n\n```\npublic abstract class AFunction extends AFn implements\
    \ IObj,\nComparator, Fn, Serializable {\n..\n}\n```\n\nAs we can see, AFunction\
    \ implements the Java interface java.util.Comparator, and what that means in simple\
    \ terms is that any Clojure function can be used directly as a comparator.\n\n\
    Let's see that again in action:\n\n```\n(sort\n#(< %1 %2)\n[1 2 3 0 -1])\n(-1\
    \ 0 1 2 3)\n```\n\nIf we want to keep things as they are, or reverse them, we\
    \ can always return true or false:\n\n```\n(sort\n(fn[_ _] true)\n[1 2 3 0 -1])\n\
    ; (-1 0 3 2 1)\n```\n\n```\n(sort\n(fn[_ _] false)\n[1 2 3 0 -1])\n; (1 2 3 0\
    \ -1)\n```\n\nThe compare function of any function, AFunction, simply checks the\
    \ return value by invoking itself with two items:\n\n```\npublic int compare(Object\
    \ o1, Object o2){\n    Object o = invoke(o1, o2);\n    if(o instanceof Boolean)\n\
    \    {\n```"
  merge: -1
  img_proc: true
- pgno: 119
  md: "```\nif(RT.booleanCast(o))\n    return -1;\n  return RT.booleanCast(invoke(o2,o1))?\
    \ 1 : 0;\n}\nNumber n = (Number) o;\nreturn n.intValue();\n}\n```\n\nSo, if the\
    \ function returns a Boolean and that Boolean is true, we suppose the first object\
    \ is smaller. Then we compare the Boolean value of the reverse invoke call to\
    \ find out if the values are equal or not.\n\nFinally, if we're not in the Boolean\
    \ domain, we use numeric values to compare:\n\n```\n(sort\n  (fn[_ _] -1)\n  [1\
    \ 2 3 0 -1])\n; (-1 0 3 2 1)\n```\n\nClojure sort calls on the JVM eventually\
    \ rely on the JVM's own sort implementation, which is a modified version of the\
    \ merge sort algorithm.\n\nThere is more to explain about sorting on the JVM,\
    \ but we'll leave it for now as it is out of the scope of this recipe.\n\nIn any\
    \ case, sort in Clojure should be as fast as sort on Java collections.\n\n# There's\
    \ more...\n\nSorting is a fun sport on its own and we could go through all sorts\
    \ of algorithms. Here, we will focus on how to use sorting in day-to-day tasks.\n\
    \n# Sorting lines of a file\n\nIn this small example, we will learn how to sort\
