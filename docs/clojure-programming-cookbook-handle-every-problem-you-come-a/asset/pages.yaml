- pgno: 283
  md: "Now streaming can easily be made even better through the usual usage of core.async.\
    \ At this stage, you should be getting used to deal with the channels, so let's\
    \ go quickly through the setup of the namespace and the two core async channels\
    \ we will use:\n\n```\n(use 'clojure.data.xml)\n(use '[clojure.java.io :only [writer\
    \ reader input-stream output-stream]])\n(require '[clojure.core.async :as async])\n\
    \n(def in-chan (async/chan))\n(def out-chan (async/chan))\n```\n\nNow the resulting\
    \ thread, the one that will show the data, will simply be printing data coming\
    \ from the out channel. This translates to a core.async thread as follows:\n\n\
    ```\n(async/thread\n  (while true\n    (let [data (async/<!! out-chan)]\n    \
    \  (println data))))\n```\n\nWe will use a second thread that will parse and filter\
    \ data coming from the input channel. The parsing we have seen in the previous\
    \ section, and the code stays the same. We just wrap all this in a similar fashion\
    \ into a core.async thread:\n\n```\n(async/thread\n  (while true\n    (let [data\
    \ (async/<!! in-chan)]\n      (if (= \"Friend1\" (first (:content (parse (java.io.StringReader.\
    \ data)))))\n        (async/>!! out-chan data)))))\n```\n\nAfter reading from\
    \ the input channel, if the data is matching, we will put it onto the out channel,\
    \ the one that the previous thread should read from.\n\nLastly, we reuse pmap\
    \ and line-seq to do the simple reading from the\n\n```\n(with-open [in (reader\
    \ (input-stream \"test_1.xml\"))]\n  (doall\n```"
