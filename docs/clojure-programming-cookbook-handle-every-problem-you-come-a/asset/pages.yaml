    # How it works...


    You saw the basic usage of reactors and how to send messages. In this section,
    we will quickly review how to work with selectors and follow up with a part showing
    how to build streams of processing by assembling or piping callback functions
    together.


    # Selectors


    Till now you have seen how to select a given key using the dollar $ selector:


    ```

    (require ''[clojurewerkz.meltdown.selectors :refer [$]])

    ```


    Selector can make use of a wild card to achieve something similar to a selection
    based on regular expressions.


    Say you want to send and receive messages based on food and options, so you can
    define selectors using R as follows:


    ```

    (require ''[clojurewerkz.meltdown.selectors :as s :refer [R]])

    ```


    ```

    (mr/on reactor

    (R "Burger.*")

    (fn [event] (println "Delicious Burger:" event)))

    ```'
