- pgno: 441
  md: "```\n(sleep 2000)\n(println \"I am waking up ...\")\n)\n```\n\n```\n(spawn\
    \ relaxing-afternoon-2)\n```\n\nAfter two seconds, your relaxing afternoon starts\
    \ to get some action. As noted in the comments, make sure you are not using a\
    \ call to Thread/sleep, which is something that Quasar cannot instrument and will\
    \ result in an exception at definition time.\n\nNow let's say you want to be able\
    \ to send a hint to the actor that he should wake up, instead of waiting for him\
    \ to do it.\n\nFor this purpose, you can use the receive function, with a key,\
    \ and code block to execute asynchronously when the message arrives:\n\n```\n\
    (defsf n relaxing-afternoon-3 []\n  (println \"I am relaxing ...\")\n  (receive\n\
    \    :wakeup (println \"Hey ! Someone woke me up!\")))\n```\n\nSpawning this next\
    \ actor, you are now able to send messages to it through the use of the ! call:\n\
    \n```\n(def me\n  (spawn relaxing-afternoon-3))\n```\n\n```\n(! me :wakeup)\n\
    ; Hey ! Someone woke me up!\n```\n\nCool! Message passing. Now something weird\
    \ is happening, when you want to wake the actor again and send the same message:\n\
    \n```\n(! me :wakeup)\n```\n\nNothing is happening. This is because the body of\
    \ the defsfn acts as a loop, and once a message is received, the loop naturally\
    \ ends unless we tell it not to with recur:\n\n```\n(defsf n relaxing-afternoon-4\
    \ []\n  (println \"I am relaxing ...\")\n```"
