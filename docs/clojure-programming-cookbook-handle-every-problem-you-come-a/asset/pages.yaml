  md: "In the following code, the thread is waiting for realizations of x and y by\
    \ deliver:\n\n```\n(future\n  (do (deliver z (+ @x @y))\n    (println \"z value\
    \ : \" @z)))\n```\n\nThe var z is not still realized:\n\n```\n(realized? z)\n\
    ;;=> false\n```\n\nThen we will realize x and y by deliver:\n\n```\n(deliver x\
    \ 1)\n;;=> #promise[{:status :ready, :val 1} 0x2f5df579]\n(deliver y 1)\n;;=>\
    \ #promise[{:status :ready, :val 1} 0x1614985]\n;;=> z value :  2\n```\n\nWhen\
    \ both values of x and y are set, z is calculated, and thread created by future\
