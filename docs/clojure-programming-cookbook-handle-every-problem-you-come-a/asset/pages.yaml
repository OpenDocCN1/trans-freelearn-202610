- pgno: 149
  md: "# Using threading macros\n\nThreading macros are the cherry on the pie of your\
    \ Clojure code. We use them all the time, and for one very simple reason: they\
    \ make your code more readable. We can think of threading macros as a way to directly\
    \ see how the data flows through our well-crafted functions.\n\nThreading macros,\
    \ as the name suggests, are macros. The code you write is being rearranged before\
    \ being compiled and evaluated.\n\nIn this short section, we will see how to use\
    \ the two threading macros, -> and ->>, so that you can use and abuse them while\
    \ having some Clojure fun.\n\nThis will also be used as a bridge to learn how\
    \ to write our own macros in the following two recipes.\n\nFinally, we will also\
    \ see how this is used in context for a full-fledged Apache Spark integration.\n\
    \n# Getting ready\n\nFor this recipe, nothing but a plain Clojure REPL is needed.\n\
    \n# How to do it...\n\nIn this short section, we will review the main threading\
    \ macros of the Clojure language.\n\n# Introducing the -> macro\n\nIn pseudo-code,\
    \ we can use the -> macro as seen in the following, create something, and make\
    \ it flow through a set of functions:\n\n```\n(-> something\n  (function1)\n \
    \ (function2)\n  ...\n```"
  merge: -1
  img_proc: true
- pgno: 150
  md: "So, let's say we want to add 1 to a random integer. To do so, we would write\
    \ the following:\n\n```\n(->\n  (rand-int 10)\n  (+ 1))\n; 5\n```\n\nThe rand-int\
    \ function gives us a new integer between 0 and 10 exclusive. In the preceding\
    \ code, if that integer had been 4, then we call this 4 as the first parameter\
    \ of the next function, which is (+ 1).\n\nSo, (+ 1) actually turns into (+ 4\
    \ 1).\n\nIf we want to make a string of the final result, we would just add one\
    \ more line using the most famous str function, as follows:\n\n```\n(->\n  2\n\
    \  (+ 1)\n  (str))\n; \"3\"\n```\n\nThe brackets can be avoided when there is\
    \ only one argument to the function:\n\n```\n(->\n  2\n  (+ 1)\n  str)\n; \"3\"\
    \n```\n\n# Introducing the ->> macro\n\nThe partner in crime of the -> macro is\
    \ the ->> macro, which similarly threads function calls one after the other, but\
    \ instead of applying the result of the previous function result as the first\
    \ parameter, it is used as the last parameter.\n\nIn the following code, a value\
    \ of 2 is passed as the second parameter of the minus function:\n\n```\n(->> 2\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 151
  md: "```\n(- 1))\n; -1\n```\n\nYou can see the difference right away by comparing\
    \ it with the previous macro:\n\n```\n(-> 2\n    (- 1))\n; 1\n```\n\nA few common\
    \ Clojure functions are particularly well adapted to this second macro, in particular,\
    \ map:\n\n```\n(->> [1 2 3]\n    (map inc))\n; (2 3 4)\n```\n\nThe into function\
    \ is another function that is very well suited and can be used to convert easily\
    \ to a vector again at the end of the chain:\n\n```\n(->> [1 2 3]\n    (map inc)\n\
    \    (into []))\n; [2 3 4]\n```\n\n# Introducing the cond-> and the cond->> macros\n\
    \nNow that we have seen the basics of two threading macros, we can build and expand\
    \ on them with two other pretty useful ones, cond-> and cond->>.\n\nFirst let's\
    \ quickly remind ourselves how to use cond, which takes a set of conditions and\
    \ returns the value with the first matching test:\n\n```\n(let [speed 110]\n \
    \   (cond\n        (>= speed 130) \"Too fast for love\"\n        (>= speed 100)\
    \ \"How many miles to babylon ...\"\n        (>= speed 80) \"Your grand ma is\
    \ calling\"\n        (>= speed 50) \"City center\"\n        :else \"Falling asleep\"\
    ))\n```\n\nThe cond-> macro works in a similar way to matching clauses, but it"
  merge: -1
  img_proc: true
- pgno: 152
  md: "does not stop after the first match and keeps on going until the end of the\
    \ conditions:\n\n```\n(let [speed 110 count 0]\n    (cond-> count\n      (>= speed\
    \ 130) inc\n      (>= speed 100) inc\n      (>= speed 80) inc\n      (>= speed\
    \ 50) inc\n    ))\n; number of matches\n; 3\n```\n\nAs you will have noticed in\
    \ the preceding code, the inc function on each line is applied with the current\
    \ value of count for each matching statement.\n\nSimilarly, cond->> does something\
    \ similar, but the function for each matching statement behaves like ->>:\n\n\
    ```\n(let [speed 110 count 0]\n    (cond->> count\n      (>= speed 130) inc\n\
    \      (>= speed 100) inc\n      (>= speed 80) inc\n      (>= speed 50) inc\n\
    \    ))\n; 3\n```\n\nIt returns the same result, but it becomes interesting when\
    \ you want to apply a set of functions to a collection.\n\nLet's say we want to\
    \ compute the average speed of a set of speed records. We start by defining a\
    \ simple average function:\n\n```\n(def average (fn [coll]\n  (/ (reduce + coll)\
    \ (count coll))))\n```\n\nThen our compute method will make use of cond->>, as\
    \ follows:\n\n```\n(defn compute\n  [speeds {:keys [apply-fn limit-to]}]\n   \
    \ (cond->> speeds\n```"
  merge: -1
  img_proc: true
