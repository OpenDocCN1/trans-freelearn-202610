    # Clojure functions are first-class functions


    The first-class function can provide a high-level abstraction of code. High-level
    abstraction using first-class functions makes code compact and good perspective.
    It also increases productivity and extensibility compared to imperative languages
    such as Java.


    Let''s review how Clojure functions are first-class functions:


    +   - Functions can be arguments of functions. Functions such as map, reduce,
    and filter take a function as the first argument.

    +   - Functions can be returns of functions. The functions comp and partial return
    a function.

    +   - Functions can be anonymous. Anonymous functions can be defined using fn
    or function literals.

    +   - Functions can be assigned to variables or in data structures. def and fn
    can assign functions to variables.


    # Pure functions


    The characteristics of pure functions are as follows:


    +   - Referential transparency: The function always returns the same result with
    the same arguments.

    +   - No side effects: The function doesn''t cause any side effects.


