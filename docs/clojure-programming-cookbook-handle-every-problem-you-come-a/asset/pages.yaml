  md: 'Here, we will learn how records and types are implemented and how they differ.


    # Records and types are Java classes


    Clojure''s records are Java classes. In the example of the Author, the Author
    defined is a Java class. The ->Author and map->Author are factory classes, and
    doyle and christie are instances of the class:


    ```

    (class Author)

    ;;=> java.lang.Class

    (class Point)

    ;;=> java.lang.Class

    ```


    We can use field accessors of java-inter-op, which we will describe in depth in
    a later chapter:


    ```

    (.-occupation christie)

    ;;=> ["novelist" "short story writer" "playwright" "poetnovelist"]

    (.-x (Point. 10 2))

    ;;=> 10

    ```


    The defrecord and deftype generate accessors for their elements. So, we can also
    use them for records and types:


    ```

    ( .y (Point. 10 2))

    ;;=> 2

    (.nationality doyle)

    ;;=> "scottish"

    ```


    Access to fields of records or types is faster than access to values by hash search,
    and it''s better to use records or types for performance-sensitive cases.


    # Differentiating between records and types


    There are some differences between records and types. Records provide more features
    than types do. Type provides no functionality other than a constructor with fields.


    defrecord provides a complete implementation of a persistent map,'
