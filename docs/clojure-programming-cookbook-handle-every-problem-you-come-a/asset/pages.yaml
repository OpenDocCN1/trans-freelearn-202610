    methods from Clojure. In the following example, the code calls the concat method
    in Java''s String class:


    ```

    (.concat "Hello " "world !")

    ;;=> "Hello world !"

    ```


    The following syntax is how to call Java''s member methods from Clojure:


    ```

    (.method-name object arg1 arg2 ...)

    ```


