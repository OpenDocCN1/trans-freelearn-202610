- pgno: 547
  md: "# Creating a product table and defining access functions\n\nLet's create a\
    \ file named using_db.clj under src/liberator_example and define the namespace\
    \ and declare the libraries to use in it:\n\n```\n(ns liberator-example.using-db\n\
    \  (:require\n    [ring.adapter.jetty :refer [run-jetty]]\n    [liberator.core\
    \ :refer [resource defresource]]\n    [ liberator.dev :refer [wrap-trace]]\n \
    \   [ring.middleware.params :refer [wrap-params]]\n    [compojure.route :as route]\n\
    \    [compojure.core :refer\n      [defroutes ANY GET PUT POST DELETE OPTIONS]]\n\
    \    [clj-http.client :as client]\n    [cheshire.core :refer [parse-string generate-string]]\n\
    \    [clojure.java.jdbc :as j]))\n```\n\nHere, we will create a derby table named\
    \ product. We will use java.jdbc/create-table-ddl to create a table:\n\n```\n\
    (def db-path \"/tmp/db/products\")\n;;=> #'liberator-example.using-db/db-path\n\
    (def db {\n  :classname \"org.apache.derby.jdbc.EmbeddedDriver\"\n  :subprotocol\
    \ \"derby\"\n  :subname db-path\n  :create true})\n;;=> #'liberator-example.using-db/db\n\
    (j/db-do-commands db\n  (j/create-table-ddl\n    :product\n    [[:id :int \"primary\
    \ key\"\n      \"generated always as identity\n      (start with 1, increment\
    \ by 1)\"]\n     [:name \"varchar(20)\" \"not null\"]\n     [:maker \"varchar(10)\"\
    \ \"not null\"]\n     [:description \"varchar(100)\" ]\n     [:clock :float]\n\
    \     [:ram :int]\n     [:price \"decimal(7,2)\"]]))\n;;=> (0)\n```\n\nNow we\
    \ will define insert-product!, update-product!, and delete-"
  merge: -1
  img_proc: true
- pgno: 548
  md: "product! in the following code:\n\n```\n(defn insert-product! [db product]\n\
    \  (j/insert! db :product product))\n;;=> #'liberator-example.using-db/insert-product!\n\
    (defn update-product! [db id product]\n  (j/update! db :product product [\"id\
    \ = ?\" id]))\n;;=> #'liberator-example.using-db/update-product!\n(defn delete-product!\
    \ [db id]\n  (j/delete! db :product  [\"id = ?\" id]))\n;;=> #'liberator-example.using-db/delete-product!\n\
    (defn select-product-by-id [db id]\n  (first (j/query db [\"select * from product\
    \ where id = ?\" id])))\n;;=> #'liberator-example.using-db/select-product-by-id\n\
    ```\n\nWe will also define select functions select-product-by-id and select-products.\
    \ select-product-by-id returns single map associates with id. select-products\
    \ returns all products by an array of maps:\n\n```\n(defn make-query-string [m]\n\
    \  (str (apply str\n              (interpose \" like ? and \"\n              \
    \  (map name (keys m))))) \" like ? \"))\n;;=> #'liberator-example.using-db/make-query-string\n\
    (make-query-string {:var-1 \"a\" :var-2 \"b\" :var-3 \"c\"})\n;;=> \"var-1 like\
    \ ? and var-2 like ? and var-3 like ? \"\n(defn select-products [db & params]\n\
    \  (let [qs\n        (if-not params\n          \"select * from product\"\n   \
    \       (str \"select * from product where \" (make-query-\nstring (first params))))\n\
    \        v (vals (first params))]\n    (println (vec (cons qs v)))\n    (j/query\
    \ db (vec (cons qs v)))))\n;;=> #'liberator-example.using-db/select-products\n\
    ```\n\nWe will test insert-product! to add two products for mac and thinkpad:\n\
    \n```\n(insert-product! db\n                {:name \"macbook air 11.6\" :maker\
    \ \"Apple\"\n                 :description \"Apple MacBook Air MJVM2LL/A\n11.6-Inch\
    \ laptop\"\n                 :clock 1.6 :ram 4 :price 797.00})\n```"
