    # Running Clojure code using Clojure.RT


    There is actually another slightly different method to call the Clojure code using
    the clojure.lang.RT class. This call has a load method that works as a require
    directive. This works very much in the same way as the regular Java interop if
    you remember:


    ```

    RT.load("hello.net");

    IFn output = RT.var("hello.net", "get-sunset");

    Console.WriteLine("Second method {0}", output.invoke("Tokyo", "jp"));

    ```


    So, we create an IFn object, which works or maps to a Clojure function through
    the RT.var call. Then, you can invoke this resulting IFn object, with the desired
    parameter, here Tokyo.


