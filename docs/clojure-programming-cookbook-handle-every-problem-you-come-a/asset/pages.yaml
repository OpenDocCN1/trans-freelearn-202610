- pgno: 227
  md: "actually transform Clojure data structure through a query.\n\n# How it works...\n\
    \nSo, now that we can turn all sorts of data in the Clojure landscape, we will\
    \ make use of another trick to modify those structures.\n\nUsually Clojure favors\
    \ zippers to navigate up and down data structures. Now balagan is a library that\
    \ helps you navigate and modify structures through a path-like query system:\n\
    \nPromptly, let's require it into our running namespace:\n\n```\n(require '[clojurewerkz.balagan.core\
    \ :as b])\n```\n\nNow supposing our friend Nick still wants to play around with\
    \ us, we are going to bring him back in and add some bits of information. This\
    \ is going to look like a simple, but not too simple, Clojure map:\n\n```\n(def\
    \ friend\n  {:name \"Nick\"\n   :birth {:year 1985 :place \"Japan\"}\n   :nickname\
    \ \"nickthegreat\"})\n```\n\nNow, let's say we would like to retrieve the year\
    \ our friend Nick was born. We will construct a vector that will describe a path\
    \ to go and fetch it. We are going to make use of the select function here:\n\n\
    ```\n(b/select friend\n        [:birth :year])\n; (1985)\n```\n\nThat is pretty\
    \ straightforward. Now, for some more fun, we can actually use wildcards throughout\
    \ the :* path directive. So, replacing :birth with the wildcard gives the following:\n\
    \n```\n(b/select friend\n        [:* :year])\n; (1985)\n```\n\nThis is sweet as\
    \ well."
