  md: "```\n(project [vs]\n  (everyg\n    (fn [[v n]] (fd/!= v n) )\n    (map\n  \
    \    vector\n      vs\n      (range 1 10))))\n```\n\nThis is actually the piece\
    \ of code that inspired me. I hope it has the same impact on the reader! We have\
