  md: '# Clojure on Amazon Web Services


    This recipe is a standalone dish where you can learn how to combine the elegance
    of Clojure with Amazon Web Services (AWS).


    AWS was started in 2006 and is used by many businesses as easy to use web services.
    This style of serverless service is becoming more and more popular. You can use
    computer resources and software services on demand, without the need to prepare
    hardware or install software by yourself.


    You will mostly make use of the `amazonica` library, which is a comprehensive
    Clojure client for the entire Amazon AWS set of APIs. This library wraps the Amazon
    AWS APIs and supports most AWS services including EC2, S3, Lambda, Kinesis, Elastic
    Beanstalk, Elastic MapReduce, and RedShift.


    This recipe has received a lot of its content and love from Robin Birtle, a leading
    member of the Clojure Community in Japan.


    # Getting ready


    You need an AWS account and credentials to use AWS, so this recipe starts by showing
    you how to do the setup and acquire the necessary keys to get started.


    # Signing up on AWS


    You need to sign up to AWS if you don''t have an account in AWS yet. In this case,
    go to https://aws.amazon.com, click on Sign In to the Console, and follow the
    instructions for creating your account:'
  merge: -1
  img_proc: true
- pgno: 674
  md: '![](img/d7b631352a782ee50160cf8eb995152f_674_0.png)


