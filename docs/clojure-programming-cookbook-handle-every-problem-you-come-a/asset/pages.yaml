  md: '# Using namespaces


    Clojure organizes code via namespaces, or small units of code. Each namespace
    contains a set of define functions. One of the recurring questions is to figure
    out how to do the layout of your namespaces, and how to organize your different
    namespaces so they relate to each other in a clean way. This is what this recipe
    will go through.


    # Getting ready


    This recipe does not require any special installation steps apart from a running
    REPL. Also, it is recommended to keep the Clojure namespaces page open so we can
    refer to it quickly.


    # How to do it...


    We will go through the steps of creating a Clojure namespace, referencing code
    from other namespaces, as well as loading and reloading namespaces on demand.
    Lastly, we will go briefly through a few concepts of how to organize those namespaces
    properly.


    # Creating a new namespace


    We start here by looking at how namespaces are created. While working in the REPL,
    making changes to or creating a namespace mostly resorts to using the in-ns function
    from clojure.core:


    ```

    (in-ns ''hello)

    ```


    And next time we define a var using def, we see it bound to that namespace:


    ```

    hello=> (in-ns ''hello)

    #object[clojure.lang.Namespace 0x3b5fad2d "hello"]

    hello=> (def a 1)

    #''hello/a

    ```


    Great. Now, since the function resolves to var as well, we can define the'
  merge: -1
  img_proc: true
- pgno: 82
  md: 'function in our namespace. We need to give the full path to fn now to define
    the definition, so clojure.core/fn:


    ```

    hello=> (def b (clojure.core/fn[c] (clojure.core/inc c)))

    #''hello/b

    hello=> (b 2)

    3

    ```


    # Inspecting namespaces


    Namespaces are regular objects, so on the JVM we can see their internals very
    easily. find-ns tells us what the object is, and on the JVM we then call .getMappings
    from the namespace object:


    ```

    (find-ns ''hello)

    ; #object[clojure.lang.Namespace 0x3b5fad2d "hello"]

    (.getMappings *1)

    ....

    ```


    Namespaces are listed and retained statically in a static field of this class
    on the JVM so we can refer to things later.


    While in-ns helps us define namespaces, we will actually use a higher-level function
    named ns:


    ```

    helloagain=> (ns helloagain)

    nil

    helloagain=>

    ```


    If you want to go and have a look, ns actually does quite a bit for us. The two
    main keywords that can be used are imports and refers.


    # Adding functions with :import and :refer


    :import will import classes from the hosting virtual machine (JVM, JavascriptVM,
    and .NET VM for now). Say in Java we want to use the raw Random Java object directly,
    we will import it in the namespace with the following:


    ```

    (ns helloagain (:import [java.util Random]))

    (Random.)

    ; #object[java.util.Random 0x6337c201

    ```'
