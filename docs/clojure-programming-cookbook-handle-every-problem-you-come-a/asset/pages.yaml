  md: 'named line-seq, which you know produces a lazy sequence of each line of the
    opened file. interleave then appends an end-of-line character between lines.


    So, with all confidence, you rush to the following:


    ```

    (println c)

    ; and ...

    ; java.io.IOException: Stream closed

    ```


    What has just happened? The with-open call actually also wraps a close stream
    call so that by the time the call returns c, the stream has already been closed.
    Eventually, println asks for the sequence to be realized, but with the stream
    being closed, things are going wonky.


    A quick way to go around the problem is to simply force the execution:


    ```

    (def e (with-open [rdr (clojure.java.io/reader "project.clj")] (apply str (interleave
    (line-seq rdr) (cycle "\n")))))

    ```


