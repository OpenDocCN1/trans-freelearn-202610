- pgno: 280
  md: '# Streaming access to provide high performance


    This recipe will take a look at how to parse and write large amount of data. Since
    XML is probably the most verbose of data formats, we will look briefly at how
    to generate large amount of junk data and then how to process those in a memory
    efficient way.


    # Getting ready


    The `data.xml` library is our library of choice here, so let''s add it to the
    `project.clj` if it is not already:


    ```

    [org.clojure/data.xml "0.1.0-beta1"]

    ```


    We will also make use of the core Java streaming and zipping functions that are
    available in the JVM. We know we can access host functions just by importing them
    in the current namespace, so nothing more to prepare here.


    # How to do it...


    So that''s it. Let''s go for a large dump of data onto our file system. We will
    create an XML element.


    # Streaming out


    We get ready by pulling the proper namespaces for XML and for writing to streams:


    ```

    (use ''clojure.data.xml)

    (use ''[clojure.java.io :only [writer output-stream]])

    ```


    Now, we can generate XML elements and emit them directly into a text file. This
    is done by opening a `write` on the file and then emitting the XML:'
  merge: -1
  img_proc: true
- pgno: 281
  md: "```\n(with-open [o (writer \"data-set-1.xml\")]\n  (doseq [i (range 1 10)]\n\
    \    (.write o (str (element :friend {\"age\" \"23\"} (str \"Friend\" i))))\n\
    \    (.write o \"\\n\")))\n```\n\nNote that this can also be done in parallel\
    \ with a basic pmap call. While the data order is lost in a way, the data is generated\
    \ way more rapidly:\n\n```\n(with-open [o (writer \"test_1.xml\")]\n  (doall\n\
    \    (pmap\n      #(.write o\n        (str\n          (element :friend\n     \
    \       {\"age\" \"23\"}\n            (str \"Friend\" %)) \"\\n\"))\n      (range\
    \ 1 10))))\n```\n\nNote that in this case, we need to use doall to force the execution\
    \ before getting out of the scope of with-open, otherwise we will get a stream\
    \ closed exception.\n\nWhile this is generating a large file with one XML per\
    \ line, a proper XML file would look like the following:\n\n```\n(with-open [o\
    \ (writer \"test_2.xml\")]\n(.write o \"<friends>\\n\")\n(doseq [i (range 1 10)]\n\
    \  (.write o\n    (str\n      (element :friend\n        {\"age\" \"23\"}\n   \
    \     (str \"Friend\" i))\n      \"\\n\"))))\n(.write o \"</friends>\\n\"))\n\
    ```\n\nNow increase the range value to about 10,000,000 to get a nice 500 MB file\
    \ of data. You can also note that the memory usage did not increase so much and\
    \ stayed relatively stable.\n\nLet's now analyze the data back in!"
  merge: -1
  img_proc: true
- pgno: 282
  md: "# Streaming in\n\n```\n(use '[clojure.java.io :only [reader input-stream]])\n\
    \n(with-open [in (reader (input-stream \"test_2.xml\"))]\n  (doall\n    (filter\n\
    \      #(= \"Friend3\" (first (:content %)))\n      (:content (clojure.data.xml/parse\
    \ in)))))\n\n; (#clojure.data.xml.node.Element{:tag :friend, :attrs {:age \"23\"\
    }, :content (\"Friend3\")})\n```\n\nAgain, we need to call doall again to make\
    \ sure we do the processing while the file is still opened. How big the file is\
    \ does not seem to much affect memory consumption, and we are streaming the file\
    \ properly directly through the data.xml parse method, which returns a lazy sequence\
    \ of XML elements.\n\n# Streaming with line-seq\n\nIn the case where line-by-line\
    \ processing is possible, we can make use of the line-seq function, which will\
    \ build a lazy sequence of items.\n\nWhen we generated sample data files, we had\
    \ a file that had a not-so-XML version; it was one XML element per line:\n\n```\n\
    (with-open [in (reader (input-stream \"test_1.xml\"))]\n  (doall\n\n    (filter\n\
    \      #(= \"Friend1\"\n        (first (:content (parse\n          (java.io.StringReader.\
    \ %)))))\n\n    (line-seq in))))\n```\n\nIn this case, we line-seq reads one line\
    \ at a time from the buffered reader, and the processing is then lazily one, meaning\
    \ one element at a time.\n\n# How it works..."
