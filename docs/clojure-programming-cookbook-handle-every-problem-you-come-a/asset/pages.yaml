- pgno: 444
  md: "```\n(spawn someone man-asleep)\n; ... many people ...\n; many more sleeping\n\
    ```\n\nNow that you have seen how to send messages between actors, you are now\
    \ more than ready to play ping-pong.\n\n# How it works...\n\nThis example is mostly\
    \ a direct copy of the Pulsar samples, and should be a no brainer if you have\
    \ followed the first part of this recipe.\n\nHere we declare two actors, a ping\
    \ and a pong, that call each other recursively for a while until ping misses the\
    \ ball and declares gameover:\n\n```\n(ns quasarland.pingpong\n  (:use [co.paralleluniverse.pulsar\
    \ core actors])\n  (:refer-clojure :exclude [promise await]))\n\n(defsfn ping\
    \ [pong]\n  (if (>= (rand-int 10) 9)\n    (do\n      (! pong :gameover)\n    \
    \  (println \"Missed the ball. Ping Finished\"))\n    (do\n      (! pong [:ping\
    \ @self])\n      (receive\n        :pong (println \"Ping\"))\n      (recur pong))))\n\
    \n(defsfn pong []\n  (receive\n    :finished (println \"Pong finished\")\n   \
    \ [:ping ping] (do\n      (println \"Pong\")\n      (! ping :pong)\n  (recur))))\n\
    ```\n\n# Let's start the game!\n\n```\n(let [a1 (spawn pong)\n      b1 (spawn\
    \ ping a1)])\n;Pong\n```"
