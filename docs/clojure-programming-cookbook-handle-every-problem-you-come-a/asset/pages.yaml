  md: "we called :price on the map, got 10, then called :quantity on the map, and\
    \ got 2.\n\nThis juxt-ed combination can be use to sort again through sort-by:\n\
    \n```\n(sort-by\n  (juxt :price :quantity)\n  [{:price 10 :quantity 2}\n   {:price\
    \ 10 :quantity 1}\n   {:price 5 :quantity 10}])\n\n; ({:price 5, :quantity 10}\n\
    \  {:price 10, :quantity 1}\n  {:price 10, :quantity 2})\n```\n\nSince records\
    \ also behave like maps, I am sure you will have some fun when applying the preceding\
    \ sort-by to records:\n\n```\n(defrecord Person [first-name])\n(sort-by\n    \
    \    :first-name\n  [(->Person \"nico\")\n   (->Person \"Makoto\")\n   (->Person\
    \ \"Princess Peach\")])\n\n; (#chapter02.sorting.Person{:first-name \"Makoto\"\
    }\n  #chapter02.sorting.Person{:first-name \"Princess Peach\"}\n  #chapter02.sorting.Person{:first-name\
    \ \"nico\"})\n```\n\n# Sorted map structure\n\nsorted-map is the equivalent sorted\
    \ data structure to sorted-set. We can use those two functions in very similar\
    \ ways, and again, the preferred way here is to use them in conjunction with into,\
    \ to convert from a regular map to a sorted map data structure.\n\nThe default\
    \ compare behavior for sorted-map is to sort by keys:\n\n```\n(sorted-map :a 2\
    \ :b 3)\n; {:a 2, :b 3}\n\n(into (sorted-map) {:a 2 :b 3})\n; {:a 2, :b 3}\n```"
