- pgno: 560
  md: "Extending the previous example, Immutant also provides a way to easily do **remote\
    \ procedure calls (RPCs)** via the queuing system.\n\nThis can be a great way\
    \ to distribute the load to different Raspberry Pis!\n\nLet's go through a distributed\
    \ hello world using this RPC framework.\n\nThe first setup needs to be set up\
    \ just as in the previous recipe. We will make use of a new queue, `queue2` (creative\
    \ naming is all the rage these days...). This `queue2` will then be used from\
    \ a respond handler, which is the entrance of the procedure call as seen here:\n\
    \n```\n(def queue2 (msg/queue \"hello2\" :context mycontext))\n```\n\n```\n(msg/respond\n\
    \  queue2\n  (fn[msg] (str \"hello \" msg)))\n```\n\nHere, the handler receives\
    \ one parameter, and sends some polite greeting message.\n\nNote that each respond\
    \ handler needs a dedicated queue.\n\nOn the second server, we will look up `queue2`,\
    \ and create a Compojure route to send the RPC request. The `msg/request` function\
    \ call actually returns a future, so if we want to do a synchronous answer, we\
    \ will use the @ symbol to wait until the result of the execution.\n\nThis translates\
    \ into:\n\n```\n(def queue2\n  (msg/queue \"hello2\" :context mycontext))\n```\n\
    \n```\n(defroutes app\n  (GET \"/req\" [] @(msg/request queue2 \"world\")))\n\
    ```\n\nThis second server is again running on the Raspberry Pi. A request to it\
    \ will post a message to the queue, that message will be picked up by the first\
    \ server, the callback will be executed, and the result sent back to the second\
    \ server:"
  merge: -1
  img_proc: true
