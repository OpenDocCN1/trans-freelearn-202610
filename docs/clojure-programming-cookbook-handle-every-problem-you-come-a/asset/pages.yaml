- pgno: 454
  md: "```\npublic Object invoke()\n{\n    return invokeStatic();\n}\n\npublic static\
    \ final Var const__0 =\n(Var)RT.var(\"clojure.core\", \"println\");\n\npublic\
    \ static Object invokeStatic()\n{\n    return ((IFn)const__0.getRawRoot()).invoke(\"\
    hello world\");\n}\n}\n```\n\nThe main Java objects being used in Clojure are\
    \ as follows:\n\n+   - `clojure.lang.IFn`: This is Clojure function, something\
    \ that can be invoked.\n+   - `clojure.lang.A`: This function is mostly an annotated\
    \ Clojure function.\n+   - `clojure.lang.RT`: This is the Clojure runtime.\n+\
    \   - `clojure.lang.Var`: This is a variable, a threaded reference, that is also\
    \ a IFn and so can be invoked.\n\nWith this in mind, we can see that the Clojure\
    \ `println` function from `clojure.core` is being kept as a `Var` from within\
    \ the `gen3` class:\n\n```\npublic static final Var const__0 = (Var)RT.var(\"\
    clojure.core\", \"println\");\n```\n\nThe `Var` is retrieved through questioning\
    \ the runtime for a var through `RT.var`, a namespace, and a function.\n\nWhat\
    \ happens when the `-main` method is called is simply a static call to `invokeStatic`.\
    \ This is rather generic, and calls invoke on an `IFn` object:\n\n```\n((IFn)const__0.getRawRoot()).invoke(\"\
    hello world\")\n```\n\n`const__0` is here a generated reference to the `println`\
    \ function in the namespace `clojure.core`. Calling `-main` results in executing\
    \ the body of `invokeStatic`, which, in turn, invokes the `println` function with\
    \ parameters \"hello world\"."
