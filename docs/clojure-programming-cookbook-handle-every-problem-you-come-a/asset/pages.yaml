- pgno: 336
  md: '# Lein CLR


    Leiningen has a basic plugin that supports developing Clojure code that can be
    compiled and used from .NET, or vice versa, helping us use .NET code from Clojure.
    To create a new CLR-based project, the Leiningen CLR plugin can be used transparently
    using the `lein clr` template. So, to create a new project, supposing you have
    Leiningen installed at this stage, you can simply type the command:


    ```

    lein new lein-clr bonjour-clr

    ```


    A new Clojure project will be created, but before you can run any of the CLR-based
    commands, you need to define a system variable `CLRCLR14_40`, which should point
    to the downloaded Clojure .NET binaries, as seen earlier in the Xamarin section:'
  merge: -1
  img_proc: true
- pgno: 337
  md: 'There are other ways to do this, but you will probably agree with me that this
    was the fastest one. At this point, if you are not on Windows, you will need to
    point some PATH variables to the Mono Framework, which should be downloaded with
    the Xamarin Studio install; if not, now is a good time to do it. On MacOS, something
    like the following, should get you sorted:


    ```

    export PATH=$PATH:/Library/Frameworks/Mono.framework/Home/bin

    ```


    That''s it. Now that you are all set, let''s just quickly run the code loaded
    by default using the following command prompt:


    ```

    lein clr run -m bonjour-clr.core "this is a test"

    ```'
