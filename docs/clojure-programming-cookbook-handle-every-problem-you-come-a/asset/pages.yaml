    \    :name s/Str\n    :author [s/Str]\n    :category #{s/Keyword}\n    :publisher\
    \ s/Str})\n;;=> #'schema-example.clj-example/Book\n```\n\nThen, let's check whether\
    \ a given data is correct by validating with the"
