- pgno: 492
  md: "# Declarative data descriptions and validations with plumatic/schema\n\nClojure\
    \ is dynamically typed language and often provides productivity when you develop\
    \ alone or in a small team. However, developments in larger teams sometimes require\
    \ knowledge about data between members. prismatic/schema provides the solution\
    \ for the aforementioned problems.\n\nIn this recipe, we will learn how to add\
    \ descriptive expressions and validations in Clojure. We will use prismatic/schema\
    \ to define schemas for various data types and validate them with schemas. prismatic/schema\
    \ can define functions that define schemas for input parameters and a return.\
    \ We will then learn how to coerce one data type to another.\n\nFinally, we will\
    \ learn other solutions. We will introduce core/typed tries to provide a type\
    \ inferences system similar to Scala. core/spec is a new feature and introduced\
    \ in Clojure 1.9.\n\n# Getting ready\n\nLet's create a project using prismatic/schema.\
    \ prismatic/schema, which supports both Clojure and ClojureScript. So, let's create\
    \ a project using Figwheel:\n\n```\n$ lein new figwheel schema-example\n$ cd schema-example\n\
    ```\n\nWe will add the library dependency for prismatic/schema in the project.clj:\n\
    \n```\n:dependencies [[org.clojure/clojure \"1.8.0\"]\n                [org.clojure/clojurescript\
    \ \"1.8.51\"]\n                [org.clojure/core.async \"0.2.374\"\n         \
    \        :exclusions [org.clojure/tools.reader]]\n                [prismatic/schema\
    \ \"1.1.1\"]]\n```"
  merge: -1
  img_proc: true
- pgno: 493
  md: "[prismatic/schema-generators \"0.1.0\"]\n]]\n\nStart REPL, and then create\
    \ src/schema-example/cljexample.clj and declare the _prismatic/schema library\
    \ to use:\n\n```\n(ns schema-example.clj-example\n  (:require [schema.core :as\
    \ s]))\n;;=> nil\n```\n\n# How to do it...\n\nWe will learn basic usages of prismatic/schema\
    \ here. Let's start with a simple schema for books.\n\n# My first schema\n\nLet's\
