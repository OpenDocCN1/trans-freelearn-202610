    \ []\n    (println \"I am relaxing ...\")\n    (sleep 5000)\n    (! @self :bump)\n\
    \    (receive\n        :bump\n        (println \"bumping myself!\")))\n```\n\n\
    ```\n(spawn relaxing-afternoon-5)\n```\n\nAfter five seconds, the relaxing afternoon\
    \ will start sending a message to itself and react to it. @self is very useful\
    \ and a widely used pattern for exchanging messages between different actors.\
    \ The following sample code brings this to a better light by enhancing the message\
    \ receiving part so that you can see who has been sending the message. Note that\
