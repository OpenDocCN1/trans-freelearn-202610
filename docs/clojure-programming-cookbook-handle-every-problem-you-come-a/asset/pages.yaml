- pgno: 243
  md: "It's very nice to receive a message!\n\n# Using blocking consumer\n\nIn the\
    \ previous example, the simple-consumer exits after consuming all messages in\
    \ the specified queue using the langohr.consumers/subscribe. This is a nonblocking\
    \ consumer. We will now define a blocking consumer, which consumes messages in\
    \ a queue forever until it will be terminated by others. Let's see the blocking\
    \ consumer as follows:\n\n```\n(defn blocking-consumer [qname]\n  (with-open\n\
    \    [conn (core/connect {:host *host*})*}\n    ch (channel/open conn)]\n    (println\
    \ (str \"simple-consumer is connected with id: \"\n      (.getChannelNumber ch)))\n\
    \    (consumers/blocking-subscribe ch qname message-handler\n      {:auto-ack\
    \ true})))\n;;=> #'chapter04.rabbitmq/blocking-consumer\n```\n\nThe preceding\
    \ blocking consumer code is similar to the nonblocking consumer code defined in\
    \ the previous section. We will use the langohr.consumers/blocking-subscribe instead.\
    \ When we run the blocking-consumer, we use future to run it on a background thread:\n\
    \n```\n(def f (future (blocking-consumer \"queue1.cookbook\")))\n;;=> Consumer\
    \ is connected with id: 1\n;;=> #'chapter04.rabbitmq/f\n```\n\nLet's run the producer.\
    \ We will run the producer function three times, and these invocations generate\
    \ three messages. So, the blocking-consumer receives three messages in the background:\n\
    \n```\n(simple-producer \"queue1.cookbook\" \"Hello !\")\n;;=> produced a message\
    \ =>  Hello !\n;;=> nil\n;;=> Received a message payload : Hello ! , tag : 1\n\
    (simple-producer \"queue1.cookbook\" \"Hello !\")\n;;=> produced a message =>\
    \  Hello !\n;;=> nil\n;;=> Received a message payload : Hello ! , tag : 2\n(simple-producer\
    \ \"queue1.cookbook\" \"Hello !\")\n```"
  merge: -1
  img_proc: true
- pgno: 244
  md: "```\n; ;=> produced a message => Hello !\n; ;=> nil\n; ;=> Received a message\
    \ payload : Hello ! , tag : 3\n```\n\nTo cancel the background thread, use the\
    \ `future-cancel`.\n\n```\n(future-cancel f)\n; ;=> true\n```\n\n# How it works...\n\
    \nAMQP stands for Advanced Message Queuing Protocol. It is an open standard for\
    \ business messages between application and organization. RabbitMQ is the multiprotocol\
    \ message broker and supports AMQP 0-9-1.\n\n# Connect to broker and open channel\n\
    \nIn the preceding example, the `simple-producer` and `simple-consumer` connect\
    \ to the broker and open a channel:\n\n```\n(with-open\n  [conn (core/connect\
    \ {:host *host*})*])\n    ch (channel/open conn)]\n....\n)\n```\n\nThe `langohr.core/connect`\
    \ connects to the broker, and the `langohr.channel/open` opens a channel for publishing\
    \ and subscribing.\n\nThe `langohr.core/connect` can specify additional parameters\
    \ using a map structure:\n\n```\n(core/connect {:host *host* :port 5672 :username\
    \ \"guest\"\n:password \"guest\" :vhost \"/\"})`\n```\n\nThe `langohr.channel/open`\
    \ takes the optional parameter of channel number to identify channels by numbers:\n\
    \n```\n(channel/open conn 1)\n```\n\n# How producer works"
  merge: -1
  img_proc: true
- pgno: 245
  md: "Let's walk through code to learn how producer works.\n\n# Declaring queue\n\
    \nAfter connecting to a broker and opening a channel, producer declares an exchange\
    \ to publish.\n\nThe `langohr.queue/declare` declares a queue to use and associates\
    \ with a channel:\n\n```\n(queue/declare ch qname {:durable false :exclusive false\
    \ :auto-delete false})\n```\n\nMandatory parameters are a channel and a queue\
    \ name. Additional parameters are the following queue properties:\n\n+   - `:durable\
    \ true`: This creates a durable queue, which enables the queue and messages in\
    \ the queue survive after the event of broker reboot\n+   - `:exclusive true`:\
    \ This creates an exclusive queue, which can only be accessed by the current connection,\
    \ and is deleted when the connection closes\n+   - `:auto-delete true`: This deletes\
    \ the queue after the application ends\n\n# Producing messages\n\nProducer produces\
    \ messages to the exchange. The `langohr.basic/publish` publishes messages to\
    \ exchange. Parameters are a channel, exchange type, routing-key, payload, and\
    \ optional properties. In the preceding example, the default exchange type(=\"\
    \") is used:\n\n```\n(basic/publish\n  ch \"\" key payload {:content-type \"text/plain\"\
    \ :type \"message\"})\n```\n\n# How consumer works\n\nThe following diagram depicts\
    \ an exchange and queue as examples:"
  merge: -1
  img_proc: true
- pgno: 246
  md: "![](img/d7b631352a782ee50160cf8eb995152f_246_0.png)\n\n# Consumer messages\n\
    \nAfter connecting to a broker and opening a channel, consumer subscribes messages\
    \ from queue:\n\n```\n(consumers/subscribe ch qname message-handler {:auto-ack\
    \ true})\n```\n\nMessage handler is a function that is called when a message arrives.\
    \ If :auto-ack is true, the broker remains messages until consumer confirms the\
    \ message. If :auto-ack is false, the broker removes a message, when the broker\
    \ sends to consumers.\n\n# Defining message handler\n\nMessage handler is a function\
    \ when consumer receives messages. There are two parameters for message handler.\
    \ The first parameter is a metadata of the message. The second one is a payload\
    \ of the message. Since payload is a byte array, we convert it to a string:\n\n\
    ```\n(defn message-handler\n  [ch {:keys [content-type delivery-tag type] :as\
    \ meta} ^bytes\n```"
  merge: -1
  img_proc: true
