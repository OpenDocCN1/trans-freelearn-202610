- pgno: 181
  md: "# There's more...\n\nHere, we will show you a mutable protocol and type to\
    \ update these field mutably.\n\n# Defining a mutable protocol and type\n\nHere,\
    \ we will show a mutable type to update a field mutably. We use the `IEditPoint`\
    \ protocol and define four methods. The `setX` and `setY` do destructive updates:\n\
    \n```\n(defprotocol IEditPoint\n  (getX [this])\n  (setX! [this val])\n  (getY\
    \ [this])\n  (setY! [this val])\n)\n;;=> IEditPoint\n```\n\nThen we will define\
    \ the `MutablePoint` type and implement four methods. The keyword `^:volatile-mutable`\
    \ defines mutable variables. The `set!` performs a destructive update:\n\n```\n\
    (deftype MutablePoint [^:volatile-mutable x ^:volatile-mutable y]\n  IEditPoint\n\
    \  (getX [this] (. this x))\n  (setX! [this val] (set! x val))\n  (getY [this]\
    \ (. this y))\n  (setY! [this val] (set! y val))\n)\n;;=> chapter03.protocols.MutablePoint\n\
    ```\n\nNow we will test how mutable updates work. The initial value of the `mutable-point`\
    \ is `(5, 3)`. We will change it to `(10, 1)`:\n\n```\n(def mutable-point (MutablePoint.\
    \ 5 3))\n;;=> #'chapter03.protocols/mutable-point\n(.getX mutable-point)\n;;=>\
    \ 5\n(.getY mutable-point)\n;;=> 3\n(.setX! mutable-point 10)\n```"
  merge: -1
  img_proc: true
