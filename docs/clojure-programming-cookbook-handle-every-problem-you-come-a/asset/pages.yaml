- pgno: 455
  md: "The class gen3 contains a reference to the -main function in namespace gen3:\n\
    \n```\nprivate static final Var main__var = Var.internPrivate(\"gen3\", \"-main\"\
    );\n```\n\nAnd this is invoked in a similar way as previously. gen3__init is a\
    \ side class responsible for namespace loading, and registering the function under\
    \ namespaces. This is what is generated for the namespace definition. This allows\
    \ for easy namespace redefinition and easy reloading of functions.\n\nIn simple\
    \ worlds, the remaining two classes, gen3$fn and gen3$loading, are a different\
    \ way of loading the preceding namespace definition and can be bypassed for now.\n\
    \nBack to the Clojure code, you may remember the namespace had some metadata in\
    \ it:\n\n```\n(:gen-class [:main true])\n```\n\nThis is so that the generated\
    \ entry point class for this Clojure namespace is customized for easier interaction\
    \ with Java. In particular, the :main true directive tells the compiler to generate\
