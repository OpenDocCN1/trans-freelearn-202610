    \ \"1.8.0\"]\n  [org.clojure/core.async \"0.2.371\"]]\n```\n\n# How to do it...\n\
    \nThere are four main functions to filter elements:\n\n+   - filter\n+   - keep\
    \ and keep-indexed\n+   - remove\n+   - take and take-while\n\nLet's go through\
    \ a few simple examples.\n\n# Filtering multiples of three\n\nThe following code\
    \ filters numbers that are multiples of three:\n\n```\n(filter\n  #(= 0 (rem %\
    \ 3))\n  (range 1 10))\n; (3 6 9)\n```\n\n# Filtering items of a map\n\nThis filters\
