- pgno: 101
  md: '# Accessing maps or sets using get


    get accesses maps and sets using a key, and if there is a corresponding key in
    a map or set, it returns its value. If there is not the same key in a map or set,
    it returns nil or the third argument:


    ```

    (get {:a 1 :b 2 :c 3 :d 4 :e 5} :c)

    ;;=> 3

    (get {:a 1 :b 2 :c 3 :d 4 :e 5} :f)

    ;;=> nil

    (get {:a 1 :b 2 :c 3 :d 4 :e 5} :f :not-found)

    ;;=> :not-found


    (get #{:a :b :c} :c)

    ;;=> :c

    (get #{:a :b :c} :d)

    ;;=> nil

    (get #{:a :b :c} :d :not-found)

    ;;=> :not-found

    ```


    # Maps, sets, and keywords are functions to access collections


    It is an idiomatic Clojure approach to use maps or sets as the first argument.
    The following code is the same as using get:


    ```

    `

    ;;=> :not-found

    ```


    Using keywords is also Clojure-idiomatic. This is the same as get:


    ```

    (:c {:a 1 :b 2 :c 3 :d 4 :e 5})

    ;;=> 3

    (:f {:a 1 :b 2 :c 3 :d 4 :e 5})

    ;;=> nil

    (:f {:a 1 :b 2 :c 3 :d 4 :e 5} :not-found)

    ;;=> :not-found

    ```


    get for maps returns the key if the key exists in the elements. It returns nil
    if there is no matching key:


    ```

    (get #{:banana :apple :strawberry :orange :melon} :orange)

    ;;=> :orange

    ```'
