    \ let's stop the server for further topics in the recipe:\n\n```\n(.stop server)\n\
    ;;=> nil\n```\n\n# Using defresource\n\nHere, we will use defresource macro to\
    \ define resources:\n\n```\n(defresource hello :available-media-types [\"text/html\"\
