- pgno: 651
  md: "you may have noticed the value tends to disappear. This is because the default\
    \ Riemann daemon configuration expires events on a regular basis, as seen here.\n\
    \nHave a quick look at the Riemann configuration file at `/etc/riemann/riemann.config`,\
    \ shown at the bottom:\n\n```\n(periodically-expire 5)\n\n(let [index (index)]\n\
    \  ; Inbound events will be passed to these streams:\n  (streams\n    (default\
    \ :ttl 60\n      ; Index all events immediately.\n      index\n\n      ; Log expired\
    \ events.\n      (expired\n        (fn [event] (info \"expired\" event))))))\n\
    ```\n\nWhat this does is expire the event after a 60 second ttl, and send a new\
    \ expired event derived from the event that has expired. If you still have the\
    \ log widget running, it will show up as in the following screenshot:\n\n| Host\
    \ | service | state | metric | description |\n| host |  |  |  |  |\n| Nicolass-MacBook.local\
    \ | first-service | ok | 100 | first description |\n| Nicolass-MacBook.local |\
    \ first-service | expired |  |  |\n\nThis is your first encounter with the concept\
    \ of Riemann streams, so let's see how they work.\n\n# How it works...\n\nAs shown\
    \ in the Riemann documentation, streams typically do one or more of the following:\n\
    \n+   1. Filter events.\n+   2. Transform events."
  merge: -1
  img_proc: true
- pgno: 652
  md: '+   3. Combine events over time.

    +   4. Apply events to other streams.

    +   5. Forward events to other services.


    For a nice, simple example, let''s look at how to forward an event to another
    service.


    Let''s say you want to receive an e-mail when one of your services goes into a
    weird state. To achieve this, you will take the following steps:


    +   1. Configure the Riemann system with e-mail settings.

    +   2. Define a stream in the Riemann config that filters on events that have
    a state set to error.

    +   3. Forward the selected events to e-mails.


    Alright! The e-mail configuration itself is using the Clojure postal library behind
    the scenes, and so Google Mail settings would look like the binding shown here:


    ```

    (def email (mailer {:from "riemann@gmail.com"

    :host "smtp.gmail.com"

    :ss1 :yes!!!!11

    :user "yourusername"

    :pass "yourpassword"}))

    ```


    The only surprising part in the preceding snippet is the mailer, which you can
    actually think about as a mail stream. Everything you pass through it will be
    mailed.


    The rest of the recipe is now focused on filtering events with state set to error.
    This is done through streams, which creates a stream of events through filtering
    based on a query.


    Here, the query is to select events that have their state set to error:


    ```

    (streams (where (state "error")

    ...))

    ```'
  merge: -1
  img_proc: true
- pgno: 653
  md: "Try filling the blanks now! You can use the mailer stream inside the parent\
    \ stream made up of selected events:\n\n```\n(streams\n  (where (state \"error\"\
    )\n    (email \"seriouserror@gmail.com\")))\n```\n\nWe have already looked at\
    \ how to send events, so the following is a re-hash and will send an event with\
    \ state set to error, and some additional description:\n\n```\n(-> c (r/send-event\
    \ {:service \"first-service\" :state \"error\" :metric 100 :description \"serious\
    \ error description\"}))\n```\n\nIf you paid your mail provider properly, you\
