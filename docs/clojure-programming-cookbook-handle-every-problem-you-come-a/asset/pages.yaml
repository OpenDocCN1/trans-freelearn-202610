  md: "# Using validator\n\nThere is a validation mechanism for atom. Atom's validators\
    \ check values of atoms. The following code checks the atom value should be less\
    \ than 5:\n\n```\n(def y (atom 1 :validator (partial > 5)))\n;;=> #'chapter06.concurrency/y\n\
    (swap! y (partial + 2))\n;;=> 3\n(swap! y (partial + 2))\n;;=> IllegalStateException\
    \ Invalid reference state\nclojure.lang.ARef.validate (ARef.java:33)\n```\n\n\
    # Using CAS operation\n\n**Compare-and-swap (CAS)** is an atomic instruction used\
    \ in concurrent environments and achieves synchronization between race conditions.\
    \ In Clojure, the `compare-and-set!` function updates the value of the `new-value`\
    \ atom if the current value of the atom equals the `old-value`. The syntax is\
    \ as follows:\n\n```\n(compare-and-set! atom old-value new-value)\n```\n\nThe\
    \ next function we define gets the current value of the atom, sleeps for the interval,\
    \ and updates the value of atom using the `compare-and-set!`:\n\n```\n(defn cas-test!\
    \ [my-atom interval]\n  (let [v @my-atom u (inc @my-atom)]\n    (println \"current\
    \ value = \" v \", updated value = \" u)\n    (Thread/sleep interval)\n    (println\
    \ \"updated \" (compare-and-set! my-atom v u))))\n;;=> #'chapter06.concurrency/cas-test!\n\
    ```\n\nLet's define an atom and see how `compare-and-set!` works:\n\n```\n(def\
    \ x (atom 1))\n;;=> #'chapter06.concurrency/x\n```\n\nThe following test code\
    \ updates twice by CAS operations, but both updates are successful since two updates\
    \ occur sequentially and no race"
