  md: '```

    (- 1 2 3)

    ;;=> -4

    (- 1)

    ;;=> -1

    ```


    The * function returns the product of numbers:


    ```

    (* 5 2)

    ;;=> 10

    (* 1 2 3 4 5)

    ;;=> 120

    ```


    The / function returns the numerator divided by all of the denominators. It is
    surprising for beginners of Clojure that if the numerator is not indivisible by
    the denominators, it returns a simple fraction. You can check the name of the
    class by the class function.


    In the following example, 10 divided by 3 returns 10/3 and not 3.3333333...


    ```

    (/ 10 5)

    ;;=> 2

    (/ 10 3)

    ;;=> 10/3

    ```


    To obtain numerical figures after a decimal point, cast the result by a float
    or double function:


    ```

    (float (/ 10 3))

    ;;=> 3.3333333

    (double (/ 10 3))

    ;;=> 3.333333333333333

    ```


    The quot function returns the quotient of dividing the numerator by the denominator,
    and the decimal point is suppressed. rem returns the remainder of dividing the
    numerator by the denominator:


    ```

    (quot 10 3)

    ;;=> 3

    (rem 10 3)

    ;;=> 1

    ```


