- pgno: 565
  md: 'So you have seen all this coding framework, and it was nice to develop with,
    but how to distribute your app now? It sounds complicated... Let''s see if something
    can be done about it...


    # Packaging as standalone


    Well, there''s good news: to create a distributable JAR file, you have nothing
    to do! That''s right. Nothing out of the ordinary.


    Provided you use the gen-class directive to your main namespace, and define your
    main namespace in project.clj, you can package all this in a single JAR file using:


    ```

    lein uberjar

    ```


    Any of the examples presented in this recipe will make it smoothly. So, after
    calling uberjar, the WebSocket server can be started with:


    ```

    java -jar target/mutant7-0.1.0-SNAPSHOT-standalone.jar

    ```


    And the Chrome WebSocket client will work all the same.


    # Packaging as a deployable web archive (WAR file)


    For deployment, the lein immutant plugin allows you to take the Immutant code
    and package it as a WAR, and deploy it directly into the WildFly server, using
    a simple command. WAR is a web archive, and is essentially the Java way of packaging
    a web application for deployment:


    ```

    NicolassMacBook% lein immutant war

    Created /Users/niko/Downloads/wildfly-10.0.0.Final/standalone/deployments/mutant7-dev.war

    ```


    This is useful to verify the code runs as expected, and to automate deployment.
    The plugin and the plugin configuration are added directly to the project.clj
    file. You control where the WAR file is created, as well as the context path:


    ```

    :main mutant7.core

    :plugins [[lein-immutant "2.1.0"]]

    :immutant {

    ```'
