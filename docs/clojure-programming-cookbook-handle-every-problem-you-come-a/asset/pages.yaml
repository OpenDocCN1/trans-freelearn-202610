  md: "case, the first parameter function of map receives multiple inputs. map will\
    \ then be called step by step until one of the 2...n parameters runs out of elements:\n\
    \n```\n(map # (hash-map %1 %2)\n    (take 5 (range 0 10))\n    (range 1 10))\n\
    \n; ({0 1} {1 2} {2 3} {3 4} {4 5})\n```\n\n# OK!\n\nThe last part is quite overwhelming\
