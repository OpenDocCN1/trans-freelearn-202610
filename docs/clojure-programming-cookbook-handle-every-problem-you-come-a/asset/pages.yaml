    # Deployment bonus


    The `lein servlet` plugin adds the extra bonus of allowing the creation of web
    Java archives, or WAR files. The command has two patterns:


    ```

    lein servlet war

    lein servlet uberwar

    ```


    The first version will only include code related directly to your application,
    while the second one will also include all the dependencies, depending on your
    deployment strategy. Obviously, the second one, `uberwar`, is easier but takes
    more disk space, while the first one, `war`, takes a bit of thinking.


    Both ways, though, allow you to deploy to Java web servers at will, and if the
    requirements are to run in a Java context, this is also a nice way to cover your
    Clojure usage!'
