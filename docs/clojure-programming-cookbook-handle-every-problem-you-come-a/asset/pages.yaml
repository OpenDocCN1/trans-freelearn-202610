- pgno: 183
  md: "# Defining multimethods\n\nDefining multimethods is another way to realize\
    \ polymorphism. The multimethod has a strong dispatch mechanism for polymorphism.\
    \ Let's see how it works.\n\n# Getting ready\n\nYou need to add the `math.numeric-tower`\
    \ to your `project.clj` file to run samples (or any other dependency management\
    \ you are using):\n\n```\n:dependencies\n  [[org.clojure/clojure \"1.8.0\"]\n\
    \   [org.clojure/math.numeric-tower \"0.0.4\"]\n   ]\n```\n\n# How to do it...\n\
    \nLet's see how to define and use multimethods.\n\n# Defining a multimethod\n\n\
    The `defmulti` creates new multimethods, and the `defmethod` creates and implements\
    \ a new method of multimethod associated with a dispatch value.\n\nThe following\
    \ code shows an example of the `defmulti` of the calculation of the volume of\
    \ shapes. The first argument is the name of the multimethod and the second argument\
    \ is the dispatch function:\n\n```\n(defmulti volume :shape)\n;;=> nil\n```\n\n\
    Now we will define a method for the calculation of cube:\n\n```\n(defmethod volume\
    \ :cube [shape]\n  (* (:length shape) (:length shape) (:length shape))\n)\n;;=>\
    \ #multifn[volume 0x4f6134c8]\n(volume {:shape :cube :length 10})\n```"
  merge: -1
  img_proc: true
- pgno: 184
  md: "```\n; ;=> 1000\n```\n\nThen we will define a method for the rectangular parallelepiped.\
    \ It calculates a cubic capacity:\n\n```\n(defmethod volume :rectangular-parallelepiped\
    \ [shape]\n  (* (:length shape) (:width shape) (:height shape))\n)\n; ;=> #multifn[volume\
    \ 0x3695e4a4]\n(volume {:shape :rectangular-parallelepiped :length 2 :width 3\n\
    :height 4})\n; ;=> 24\n```\n\nWe will define another shape ball. The calculation\
    \ is 4 / 3 (Pi radius **3):\n\n```\n(defmethod volume :ball [shape]\n  (/ (* (.\
    \ Math PI) (:radius shape) (:radius shape) (:radius shape)) 4.0) 3.0)\n)\n; ;=>\
    \ #multifn[volume 0x3695e4a4]\n(volume {:shape :ball :radius 2})\n; ;=> 33.510321638291124\n\
    ```\n\n# How it works...\n\nMultimethods dispatch by function specified as the\
    \ first argument. In the preceding example, the :shape is a function to dispatch.\n\
    \nWhen the expression (volume {:shape :cube :length 10}) is called, the function\
    \ :shape is applied as follows:\n\n```\n(:shape {:shape :cube :length 10})\n;\
    \ ;=> :cube\n```\n\nThen the following method is called.\n\n```\n(defmethod volume\
    \ :cube [shape]\n  (* (:length shape) (:length shape) (:length shape))\n)\n; ;=>\
    \ #multifn[volume 0x4f6134c8]\n```\n\n# There's more..."
