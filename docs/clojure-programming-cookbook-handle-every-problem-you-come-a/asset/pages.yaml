  md: "```\nlimit-to (take limit-to)\napply-fn average\n))\n```\n\nOur `compute` function\
    \ takes a collection of speed records and a map of parameters. Note that the second\
    \ parameter is using a nice way of deconstructing the map and accessing the values\
    \ of the map directly, through their key name.\n\nOur first call will compute\
    \ the average speed of the whole set:\n\n```\n(compute\n  [110 90 150 10]\n  {:apply-fn\
    \ average})\n;  90\n```\n\nOur second run will nicely compute the average of the\
    \ first two:\n\n```\n(compute\n  [110 90 150 10]\n    {:apply-fn average :limit-to\
    \ 2})\n; 100\n```\n\nWe could replace the `:apply-fn` with compute max or min,\
    \ but since you still have a REPL opened, you can do this as an exercise.\n\n\
    # Introducing some-> and some->>\n\nThe `some->` and `some->>` macros keep on\
    \ building on our knowledge of those threading macros. They are mostly used to\
    \ apply a series of steps to maps.\n\nFor example, let's say we want to check\
    \ the size of the collection mapped to the `:speed` key:\n\n```\n(some-> {:speed\
    \ [50 90]}\n      :speed\n      count\n)\n; 2\n```\n\n`some->` applies the first\
    \ function; here, this is a keyword (Remember?"
