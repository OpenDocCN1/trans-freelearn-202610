- pgno: 610
  md: "```\n(:require [clojure.test.check.generators :as gen])\n(:require [clojure.test.check.clojure-test\
    \ :refer [defspec]])\n```\n\nYour first specification will be as follows:\n\n\
    +   - Given a name, `some-ones`\n+   - Will be set how many times to call the\
    \ generators, here 5\n+   - Validate a property for all values of the generator\
    \ using `prop/for-all`\n+   - Always generate the value 1, using the `gen/return`\
    \ you have seen before\n\nThe validation is an assertion on the value of the generator,\
    \ here 1:\n\n```\n(defspec some-ones\n  5\n  (prop/for-all [v (gen/return 1)]\n\
    \    (= v 1)))\n```\n\nWe should be pretty safe with that one and this is a test\
    \ that should pass pretty often.\n\n# Auto-running tests\n\nTo run the test automatically,\
    \ a good option is to use `autotest` of `midje`, using:\n\n```\nlein midje :autotest\n\
    ```\n\nThis reloads and reruns the needed test namespaces and the dependent code.\
    \ A sample output would be:\n\n```\n================================================================================\n\
    ===\nLoading (quickchecks.core0)\n{:result true, :num-tests 5, :seed 1466917660382,\
    \ :test-var \"some-ones\"}\n>>> Output from clojure.test tests:\n\n0 failures,\
    \ 0 errors.\n>>> Midje summary:\n```"
