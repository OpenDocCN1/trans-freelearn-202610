    ])

    ```


    The :java-source-paths keyword declares Java source code paths, and the Java source
    files are located under the src/java directory in our case. The :aot keyword declares
    Clojure source files to apply the AOT compilation. We declare the file chapter05/calling-from-java.clj
    should be compiled and generates a class file for callers. This is necessary for
    the callers to invoke classes written in Clojure.


    The :prep-tasks keyword controls the order of compilation. Our definition is as
    follows:


    ```

    :prep-tasks [

    ["compile" "chapter05.calling-from-java"]

    "javac" "compile" ]

    ```


    In the preceding example, tasks will be executed in the following order:


    +   1. The compilation of chapter05.calling-from-java first compiled by javac
    second.

    +   2. Then, all Java source files are compiled by javac.


    The rest of the Clojure files are then compiled.


    # AOT compilation


    By default, Clojure compiles all source code when it loads into JVM bytecode on-the-fly.
    But AOT compilation is used in the following situations:


    +   - To generate named class files for use by Java

    +   - When we don''t want to deliver source code

    +   - To reduce application startup times


    We use the AOT option for generating a named class to be called by Java code in
    this recipe.


