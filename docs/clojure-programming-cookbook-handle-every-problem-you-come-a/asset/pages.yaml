- pgno: 617
  md: "reducers.\n\nIn the recipe, we will measure performances with a small benchmark\
    \ that calculates the sum of the square from 1 to 1 million:\n\n```\n1^2 + 2 ^2\
    \ + 3 ^3 + ..... + 1,000,000 ^2\n```\n\nFirst of all, let's declare the namespace\
    \ and library to use as follows:\n\n```\n(ns performance-example.criterium-example\n\
    \  (:require [criterium.core :refer\n              [bench with-progress-reporting\
    \ report-result\nquick-bench benchmark quick-benchmark]]\n            [clojure.core.reducers\
    \ :as r]\n            [criterium.stats :as stats]\n            ))\n```\n\nWe will\
    \ measure execution time for benchmark for apply, reduce, and reducers. We will\
    \ run each three times as follows:\n\n```\n(dotimes [_x 3]\n  (time (apply + (map\
    \ #(* % %) (range 1 1000001)))))\n;;=> \"Elapsed time: 158.034419 msecs\"\n;;=>\
    \ \"Elapsed time: 98.81966 msecs\"\n;;=> \"Elapsed time: 92.167793 msecs\"\n(dotimes\
    \ [_x 3]\n  (time (reduce + (map #(* % %) (range 1 1000001)))))\n;;=> \"Elapsed\
    \ time: 165.243023 msecs\"\n;;=> \"Elapsed time: 103.53534 msecs\"\n;;=> \"Elapsed\
    \ time: 157.971972 msecs\"\n(dotimes [_x 3]\n  (time (r/fold + (r/map #(* % %)\
    \ (range 1 1000001)))))\n;;=> \"Elapsed time: 144.123838 msecs\"\n;;=> \"Elapsed\
    \ time: 89.670486 msecs\"\n;;=> \"Elapsed time: 81.810268 msecs\"\n```\n\nIn the\
    \ preceding tests, the results of performance tests varies in the same expression.\
    \ We'd like to know the performance more accurately. Criterium is used for such\
    \ a requirement. Now we will run benchmarks using Criterium for apply, map, and\
    \ reducers:\n\n```\n(bench (apply + (map #(* % %) (range 1 1000001))))\nEvaluation\
    \ count : 660 in 60 samples of 11 calls.\n    Execution time mean : 92.660075\
    \ ms\n```"
