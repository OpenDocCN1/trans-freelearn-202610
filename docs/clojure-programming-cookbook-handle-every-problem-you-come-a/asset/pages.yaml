  md: "# Memories - reviewing core.async basics\n\nFirst, we will start by remembering\
    \ how core.async works in a short example. This example will read temperature\
    \ values in Celsius asynchronously from a core.async channel and will convert\
    \ those values to Fahrenheit.\n\nYou can think of this as some Clojure code reading\
    \ values from a sensor, and you need to convert values from the sensor in pseudo\
    \ real-time:\n\n```\n(ns asyncing.simple\n  (:require [clojure.core.async :refer\
    \ :all]))\n\n; convert Celsius to Fahrenheit\n(defn c-to-f [c]\n  (+ (* 1.8 c)\
    \ 32))\n\n; create an out channel that reads Celsius values from a\n; channel\n\
    ; and convert them to Fahrenheit asynchronously.\n; remember that >! And <! can\
    \ only be called within a go block,\n; which is, simply said, an asynchronous\
    \ block of code.\n(defn c-to-fer\n  [in]\n  (let [out (chan)]\n    (go (while\
    \ true (>! out (c-to-f (<! in)))))\n    out))\n\n; the in channel that reads Celsius\
    \ values\n(def in-chan (chan))\n\n; the out channel that output Fahrenheit values\n\
    (def c-to-fer-out (c-to-fer in-chan))\n\n; a helper method that will print out\
    \ values coming from the in\n; channel.\n; This is a simple go loop that reads\
    \ value forever from the\n; channel and prints them.\n(defn printer\n  [in]\n\
    \  (go (while true (println (<! in)))))\n\n; start the printer go loop on the\
    \ Fahrenheit channel\n(printer c-to-fer-out)\n```"
