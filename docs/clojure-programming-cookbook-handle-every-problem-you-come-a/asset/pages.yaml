  md: '![](img/d7b631352a782ee50160cf8eb995152f_478_0.png)


    You can start a headless REPL, even outside a Clojure project using the following:


    ```

    lein repl :headless :host 0.0.0.0 :port 9000

    ```


    It is important to bind on 0.0.0.0 or its IPv6 equivalent, otherwise the REPL
    cannot be accessed remotely. To avoid a random port being chosen, let''s force
    it to be 9000 here as well. Now, connecting to that remote REPL, we will be done
    using the :connect directive.

    Considering that the Raspberry Pi had an IP of 192.168.1.9, here is how to connect
    to it:


    ```

    lein repl :connect 192.168.1.9:9000

    ```


