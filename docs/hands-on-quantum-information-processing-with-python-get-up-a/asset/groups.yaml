    # Exploring quantum error correction


    Before delving into quantum error correction, it is prudent to first consider
    error correction in the classical/conventional information and coding theory.


    In classical information and coding theory, error-correction codes are used to
    mitigate the effects of noise in digital systems. The key idea of error-correction
    codes is to ensure that errors are detected and corrected from the received data.
    In essence, error correction is realized by encoding the message in such a way
    that the redundant information is added to the message. The addition of redundancy
    to the message is to ensure that even if such a message is affected by noise,
    there would be enough information that can be used in order to recover/decode
    the original message.


    One of the basic classical error-correction codes is the **majority vote** code.
    This code is also referred to as the **repetition code**. The objective of majority
    vote error correction is to detect and correct a single-bit flip. As an example,
    using a three-bit majority vote error-correction code, bits ''0'' and ''1'' can
    be encoded by the computer as follows:


    ```

    ''0'' (physical bit) -> ''000'' (logical ''0'')

    ''1'' (physical bit) -> ''111'' (logical ''1'')

    ```


    It is clear to see that the coding can correct a single-bit flip. For instance,
    the bit sequences ''001'', ''010'', and ''100'' can be error-corrected using the
    majority vote to ''000'', which, in turn, can be decoded to ''0''. On the other
    hand, using the majority vote error-correction code, the bit sequence ''110'',
    ''101'', and ''011'' can be error-corrected to ''111'', which, in turn, can be
    decoded to ''1''.


    The task of the error-correction code is to consider the bits, and decide, based
    on the majority rule, whether the encoding message should be ''000'' or ''111''.
    If there are more zeros than ones, then the coded message becomes ''000''. On
    the other hand, if there are more ones than zeros, then the coded message becomes
    ''111''.


    Just like in classical information theory and coding, there is also a need to
    detect and correct errors in quantum information theory and coding. Quantum error
    correction codes generalize the classical repetition codes. However, since quantum
    states are also sensitive to the phase. The quantum repetition codes can correct
    either the qubit flip or the phase flip.


    The circuit diagram of a qubit-flip quantum error-correction encoding circuit
    is shown in the following diagram:'
