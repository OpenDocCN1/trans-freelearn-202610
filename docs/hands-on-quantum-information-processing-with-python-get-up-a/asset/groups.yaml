    , v_01)\n```\n\n```\nprint(\"v_10 is:\", v_10)\nprint(\"v_11 is:\", v_11)\n```\n\
    \n前述代码片段演示了使用 qutip 中的 bell_state() 函数生成四个贝尔态。\n\n最后，创建贝尔态的简单量子电路如下所示（量子电路将在第\
