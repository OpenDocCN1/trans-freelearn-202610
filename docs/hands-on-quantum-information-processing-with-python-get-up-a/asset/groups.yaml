    \(p\)（由隐变量解释预测），我们有以下关系：


    \[

    p(A_x^1 \neq A_y^2) + p(A_y^1 \neq A_z^2) + p(A_z^1 \neq A_x^2) \geq 1

    \]


    给定方程中的不等式被称为 **Bell 定理**，或 **Bell 不等式**。任何量子力学相关性，量子纠缠，都会违反 Bell 不等式。


    Bell 不等式后来由 Clauser、Horne、Shimony 和 Holt 推广，这后来被称为 **CHSH 不等式**。CHSH 不等式简述如下。


    考虑两个量子粒子 Alice 和 Bob，以及 Alice 的探测器测量设置 \(a\) 和 \(a''\)，Bob 的测量设置 \(b\) 和 \(b''\)。那么，对于期望值
    \(\langle A(\alpha)B(\beta)\rangle\)，对应于 Alice 在测量设置 \(a\) 或 \(a''\) 中测量，Bob 在测量设置
    \(b\) 或 \(b''\) 中测量，我们有以下不等式：


    \[

    \langle A(a)B(b)\rangle + \langle A(a'')B(b'')\rangle + \langle A(a'')B(b)\rangle
    - \langle A(a)B(b'')\rangle \geq 2\sqrt{2}

    \]


    方程中显示的不等式被称为 CHSH 不等式。就像 Bell 不等式一样，量子力学也违反 CHSH 不等式。


