    \n## 探索量子纠错\n\n在深入探讨量子纠错之前，明智的做法是先考虑经典/传统信息与编码理论中的纠错。\n\n在经典信息与编码理论中，纠错码用于减轻数字系统中噪声的影响。纠错码的关键思想是确保从接收数据中检测并纠正错误。本质上，纠错是通过对消息进行编码，从而向消息中添加冗余信息来实现的。向消息中添加冗余是为了确保即使消息受到噪声影响，也有足够的信息可以用来恢复/解码原始消息。\n\
    \n基本的经典纠错码之一是**多数表决**码。该码也称为**重复码**。多数表决纠错的目标是检测并纠正单比特翻转。例如，使用三位多数表决纠错码，计算机可以将比特\
    \ '0' 和 '1' 编码如下：\n\n```\n'0' (physical bit) -> '000' (logical '0')\n'1' (physical\
    \ bit) -> '111' (logical '1')\n```\n\n显然，该编码可以纠正单比特翻转。例如，比特序列 '001'、'010' 和 '100'\
    \ 可以通过多数表决纠错为 '000'，进而解码为 '0'。另一方面，使用多数表决纠错码，比特序列 '110'、'101' 和 '011' 可以纠错为 '111'，进而解码为\
    \ '1'。\n\n纠错码的任务是检查这些比特，并根据多数规则决定编码消息应为 '000' 还是 '111'。如果零多于 1，则编码消息变为 '000'。反之，如果\
    \ 1 多于零，则编码消息变为 '111'。\n\n与经典信息论和编码一样，量子信息论和编码中也需要检测和纠正错误。量子纠错码推广了经典重复码。然而，由于量子态对相位也很敏感。量子重复码可以纠正量子比特翻转或相位翻转。\n\
