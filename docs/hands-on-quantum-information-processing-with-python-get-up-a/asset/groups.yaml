    Figure 7.2 – A schematic diagram of a typical QKD scheme


    Typically, a QKD protocol should address some or all of the following issues:
    security, feasibility, and communication distance.


    QKD protocols, which will be discussed later in this chapter, can be broadly divided
    into two categories, namely:


    +   - *Prepare-and-measure QKD protocols.* The BB84 discussed earlier is an example
    of this category.

    +   - *Entanglement-based QKD protocols.* The E91 protocol is an example of this
    category.'
