    让我们现在继续下一节并学习有关贝尔态的知识。\n\n## 理解贝尔态\n\n正如我们已经提到的，*理解贝尔定理和 CHSH 不等式* 部分中的 |w₂> 态是贝尔态的一个示例。还有其他贝尔态示例（实际上有四个贝尔态）。贝尔态是通过将哈达玛门应用于第一个输入量子比特，然后将\
