    \ + α₁β₁|11⟩\n\nSince the composite system |u⟩ is separable, it is possible to\
    \ factorize (decompose) it into its constituent quantum states, namely, |u₁⟩ and\
    \ |u₂⟩. However, this decomposition is not always possible. For instance, consider\
    \ the following composite system:\n\n|v⟩ = 1/√2 (|00⟩ + |11⟩)\n\nNow, we want\
    \ to see whether it is possible to decompose |v⟩ into its constituent quantum\
    \ states, say |v₁⟩ and |v₂⟩. Recall that states |v₁⟩ and |v₂⟩ can be written as\
    \ follows:\n\n|v₁⟩ = α₀|0⟩ + α₁|1⟩\n\nand\n\n|v₂⟩ = β₀|0⟩ + β₁|1⟩\n\nNow, if |v⟩\
    \ is a product state, it means the following:\n\n$|v\\rangle = \\alpha_0\\beta_0|00\\\
    rangle + \\alpha_0\\beta_1|01\\rangle + \\alpha_1\\beta_0|10\\rangle + \\alpha_1\\\
    beta_1|11\\rangle = \\frac{1}{\\sqrt{2}}(|00\\rangle + |11\\rangle)$\n\nThis can\
