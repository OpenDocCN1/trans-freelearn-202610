    \ Three years later, QKD was used to secure communications in Durban, South Africa,\
    \ during the soccer World Cup. This project was spearheaded by the University\
    \ of KwaZulu-Natal.\n\nThese two implementations of QKD (the 2007 Geneva implementation\
    \ of QKD and the 2010 Durban implementation of QKD) propelled the cybersecurity\
    \ community to seriously consider the significance and viability of quantum cryptography.\
    \ However, the research in QKD was mainly limited to university campuses.\n\n\
    With the successful demonstration of QKD networks across various university campuses,\
    \ the need arose for spin-off companies to commercialize QKD. One of the leading\
    \ QKD spin-off companies is ID Quantique from Switzerland, which is a spin-off\
    \ company from the University of Geneva.\n\nAnother current key area of interest\
    \ in quantum cryptography is the use of QKD for communication between parties\
    \ separated by long distances. One project of note in this respect is one pursued\
    \ by China. The objective of this project is to enable QKD communication between\
    \ the ground and satellites in space. Ultimately, the project would make it possible\
    \ to have secure inter-continental communication that implements QKD.\n\nQKD can\
    \ also be implemented using higher-dimensional discrete quantum systems. These\
    \ systems are generally called **qudits**. It should be easy to observe that a\
    \ qubit is an example of a qudit in two-dimensional Hilbert space.\n\nIn essence,\
    \ a qudit is a generalization of a qubit. Recall that in *Chapter 1, Getting Started\
    \ with Quantum Information Processing*, we stated that a qubit is a unit of quantum\
    \ information that exists in two-dimensional Hilbert space. On the other hand,\
    \ a qudit exists in any finite-dimensional Hilbert space. This means that a qubit\
    \ is a special case of a qudit, with a dimension of two (since it exists in two-dimensional\
    \ Hilbert space).\n\nHaving stated that QKD can also be implemented using qudit\
    \ systems instead of just the normal qubit systems, let's now briefly explore\
    \ why and how this can be done. The use of higher-dimensional quantum systems\
    \ (as opposed to qubits) in order to implement QKD has a few benefits. These benefits\
    \ include improved information capacity per quantum system, a high key generation\
    \ rate, improved security, and improved robustness against noise. Typically, a\
    \ photon's orbital angular momentum is used for the implementation of higher-dimensional\
    \ QKD.\n\nThe quantum cryptography trends covered thus far are concerned with\
    \ the implementation aspect of QKD. However, as already stated, the trends in\
    \ QKD are not only limited to the implementation part of QKD but also involve\
    \ the theoretical advances in QKD. Therefore, it is important to also discuss\
    \ the current trends in the theoretical aspects of QKD.\n\nThe security aspect\
    \ of QKD is concerned with the analysis of the security of the QKD protocols under\
    \ various assumptions. The current approach is to make assumptions about the devices\
    \ to be used in QKD to be as realistic as possible, and then assess the security\
    \ of the QKD protocols based on such assumptions.\n\nIn this section, we have\
    \ briefly explored the current trends in quantum cryptography. The discussion\
    \ was limited to QKD since it is the most successful and advanced primitive of\
    \ quantum cryptography. In the next section, we will explore the trends in quantum\
    \ communication.\n\n## Exploring current trends in quantum communication\n\nAnother\
