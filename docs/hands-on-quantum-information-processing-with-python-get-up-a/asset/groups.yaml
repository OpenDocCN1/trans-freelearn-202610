    As already stated, Shor’s algorithm efficiently finds the period of a periodic
    function. A periodic function, f(x), is given as follows:


    ```

    f(x) = a^x mod N

    ```


    Here, mod is a modulo operator, a and N are positive integers that have no common
    factors (thus a and N are co-prime), and the following applies:


    ```

    a < N

    ```


    Additionally, a period, r, is the smallest non-zero integer such that the following
    applies:


    ```

    a^r mod N = 1

