    Now that we have covered the Deutsch-Jozsa algorithm, the next step is to explore
    another algorithm that can in essence be viewed as an extension of the Deutsch-Jozsa
    algorithm. This algorithm is called the **Bernstein-Vazirani algorithm**.


    # # Exploring the Bernstein-Vazirani algorithm


    The Bernstein-Vazirani algorithm is in a sense similar to the *Deutsch-Jozsa algorithm*
    discussed previously. Thus, the oracle still uses the following function:


    $$f(x): \{0,1\}^n \to \{0,1\}$$


    On the other hand, unlike the Deutsch-Jozsa algorithm, where the objective is
    to determine whether the given function is **constant** or **balanced**, the objective
    of the Bernstein-Vazirani algorithm is to find the secret string $s$:


    $$s: s \in \{0,1\}^n$$


    Given the promise that:


    $$f(x)=\left(\sum_{i=1}^{n}s_i x_i\right)\operatorname{mod}2$$


    The Bernstein-Vazirani algorithm works as follows. First, two registers, one the
    input register with $n$ qubits and the other the output register with a single
    qubit, are initialized to state $|0\rangle$. Thus, the state of the system is
    given as follows:


    $$\psi_0\rangle = 0 \otimes \cdots \otimes 0\rangle \otimes 0\rangle$$'
  - '[PAGE 130]


    Then, the qubit in the second register is flipped, with the new state of the system
    being the following:


    $\psi_1\rangle = 0 \otimes \cdots \otimes 0\rangle \otimes 1\rangle$


    The next step in the algorithm is to apply the Hadamard gate to each of the qubits
    in both registers. Then, we end up with the following state:


    $\psi_2\rangle = \frac{1}{\sqrt{2^n}} \sum_{x=1}^{n} x\rangle \otimes \left(\frac{1}{\sqrt{2}}[0\rangle
    - 0\rangle]\right)$


    This step is then followed by the querying of the oracle, and then applying the
    Hadamard gate to each of the qubits on the input register. Finally, the measurement
    is applied to the input register in order to retrieve the secret string.


