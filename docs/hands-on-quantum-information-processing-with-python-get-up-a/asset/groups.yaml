    目前，尚未实现完全成熟且高度可扩展的量子计算机。然而，较小的量子计算机已经开始构建。这些中小规模的量子计算机通常不使用一些复杂的纠错技术，被称为噪声中等规模量子（NISQ）计算机。NISQ
    计算机通常用于小规模量子计算，因为它们仍然不具备纠错能力。因此，NISQ 计算机主要用于展示量子计算的某些有限能力，因为它们不是全规模量子计算机。


    现在我们已经介绍了量子计算子领域，下一步是探索 QIP 的另一个子领域，即量子游戏。因此，接下来将简要讨论量子游戏的设计。


    ## 量子游戏的设计


    除了量子密码学和量子计算之外，QIP 的另一个子领域是量子游戏的设计。在传统安排中，博弈论关注冲突环境中的理性决策。量子博弈论将传统博弈论推广到量子领域。与其他
    QIP 子领域一样，量子游戏利用量子现象，尤其是纠缠，作为资源，其目标是超越其经典对应物。


    到目前为止，我们已经对 QIP 进行了简要介绍。我们介绍了量子密码学、量子计算和量子游戏的子领域。本章提供的信息将使您能够轻松跟进本书后续章节提供的信息。本书后续章节将进一步阐述本章介绍的内容。


    下一小节提供了使用 Python 进行 QIP 的理由。


    ## 理解选择 Python 用于 QIP 的理由


    本书将使用的首选编程语言是 Python。


    Python 可被认为是最受欢迎的编程语言之一。这是因为 Python 是一种非常通用、高级的编程语言，并且拥有非常活跃且强大的开发者和开源社区。


    Python 的通用性和简洁性使其成为嵌入式系统、游戏、网站开发、图形设计、数据科学、人工智能以及复杂科学和数值计算等多样化应用的首选语言。


    选择 Python 作为本书的首选语言的另一个原因是，本书后面将部署的大多数量子信息框架都基于 Python。这些 QIP 框架包括 Google 和 IBM
    等知名公司开发的框架，以及来自加拿大 Xanadu 等较少人知的 QIP 初创公司的框架（Xanadu 的官方网站为 https://www.xanadu.ai）。


    ## 安装 Python 和其他包


    Python 是一种跨平台编程语言，意味着它可以在至少三种主要操作系统中使用，即 Microsoft Windows、Apple 的 macOS 和开源 Linux。


    Python 的安装程序和文档可在 Python 官方网站 https://www.python.org/ 上免费获得，并显示在图 1.2 中：


    ![](img/2508606813a9204c61e8132ec0695cc1_30_0.png)


    图 1.2 – Python 编程语言的官方网站


    进入网站主页后，很容易导航到 Downloads 或 Documentation 选项卡。就本书而言，我们建议您下载 Python 版本 3.8.2。


    另一种下载 Python 安装程序的方法是通过使用 Continuum Analytics 的 Anaconda 跨平台 Python 发行版。与官方 Python
    安装程序不同，Anaconda 安装程序默认附带额外的 Python 包。这使得包管理比前者更不繁琐。Anaconda 的官方网站为 https://www.anaconda.com/。


    下载适当的 Python 安装程序后，可以根据所使用的操作系统类型将其安装在目标机器上。


    > **注意**

    > 在本书的准备过程中，使用了 64 位 Ubuntu 20.04 LTS 操作系统。


    此外，为了安装额外的 Python 包，可以使用 **pip Python 安装程序**。pip 命令从计算机的终端运行。pip 包安装的语法如下所示：


    ```

    pip install PackageName

    ```


    为了使用 pip 更新已安装的包，使用以下命令：


    ```

    pip install PackageName --upgrade

    ```


    本书需要包含的 QIP 框架如下：


    - **IBM 的 Qiskit**：https://qiskit.org/

    - **Google 的 Cirq**：https://cirq.readthedocs.io/en/stable/

    - **Xanadu 的 PennyLane**：https://pennylane.ai/

    - **Xanadu 的 Strawberry Fields**：https://strawberryfields.readthedocs.io/en/stable/

    - **QuTiP**：http://qutip.org/


    作为在本地计算机上安装 Python 包的替代方案，可以使用 Google 的 **Colaboratory** 或 **Colab** 环境。Google
    Colab 的官方网站为 https://colab.research.google.com。


    在 Google Colab 上安装 Python 包使用的命令与 pip 命令类似，不同之处在于与 pip 命令不同，Google Colab 命令前面加上了
    ! 符号。因此，用于安装名为 PackageName 的包的 Google Colab 命令如下：


    ```

    !pip install PackageName

    ```


    用于更新已存在的 Python 包的命令如下：


    ```

    ```python

    !pip install PackageName --upgrade

    ```

    ```


    现在我们已经了解了 Python 包的安装过程，让我们来探索 `pipenv`。


    ## pipenv 和创建环境


    Python 包可以使用 pip 等安装工具进行安装。在某些情况下，可能有必要将某些 Python 包与主 Python 安装分开。这样做的原因可能包括避免安装冲突并保护主
    Python 安装免受不稳定包的安装。用于以此意义隔离主 Python 安装的工具示例包括 `virtualenv` 和 `venv`。


    通常，为了管理 Python 包和依赖项，会使用不同的 Python 库。例如，`pip` 用于包的安装、更新和卸载，而另一个工具如 `venv` 用于管理虚拟环境。这些包通常单独使用。这在实践中使得
    Python 项目的管理非常繁琐。解决办法是使用一个可以执行包管理（安装、更新和卸载）以及虚拟环境创建和支持任务的工具。合适的工具是 `pipenv`。


    `pipenv` 是一个 Python 打包工具。该工具用于管理和简化 Python 包依赖项。


    它可以使用以下命令进行安装：


    ```

    ```bash

    pip install pipenv

    ```

    ```


    一旦安装了 `pipenv`，它将取代 pip 作为包管理工具。此外，它将负责所有包依赖任务。它还创建两个新文件，即以下文件：


    - `pipfile`：列出所有已安装的包

    - `pipfile.lock`：用于管理复杂依赖项


    至此，我们已到达本章的结尾。


    ## 总结


    在本介绍性章节中，我们提供了 QIP 的概述。我们介绍了量子密码学、量子计算和量子游戏设计。


    我们还讨论了离散变量 QIP 与连续变量 QIP 之间的区别。此外，我们介绍了量子比特的概念，它类似于传统计算机使用的传统比特（二进制数字）。


    此外，我们讨论了使用 Python 编程语言进行 QIP 的好处。此外，我们讨论了在本地机器和基于云的 Google Colab 环境中安装 Python
    编程语言和 Python 包。我们还讨论了如何使用 `pipenv` 工具进行包管理。


    在介绍了 QIP 和 QIP 的所有必要工具之后，下一章将涵盖理解后续章节所需的基本数学。Python 将被用作讨论概念的动手演示的工具。


    ## 进一步阅读


    - Nielsen, M. A., & Chuang, I. L. (2011). *Quantum computation and quantum information:
    10th Edition.* New York, NY, USA: Cambridge University Press, 1107002176, 9781107002173.

    - Wilde, M. M. (2017). *Quantum information theory.* Cambridge University Press.

    - Khan, F. S., Solmeyer, N., Balu, R., & Humble, T. S. (2018). *Quantum games:
    a review of the history, current state, and interpretation.* Quantum Information
    Processing, 17 (11), 309.


