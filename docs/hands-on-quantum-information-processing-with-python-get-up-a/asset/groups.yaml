    \ quantum states |v₁⟩ and |v₂⟩ are said to be entangled.\n\nIn this section, we\
    \ have shown how quantum states can be entangled, instead of being separable states.\
    \ The next section discusses how the **CNOT gate** is used as an entangling gate.\
    \ The CNOT gate is used to entangle two quantum states.\n\n## Understanding the\
    \ CNOT gate – the entangling gate\n\nIn *Chapter 2, Quantum States, Operations,\
    \ and Measurements*, we gave a brief overview of a two-qubit gate called the **controlled-NOT\
