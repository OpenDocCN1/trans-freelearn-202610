  mdcn: "\n\n## 延伸阅读\n\n- Nielsen, M. A 和 Chuang, I. L. (2011) *量子计算与量子信息：第10版。* 纽约，纽约州，美国：剑桥大学出版社，1107002176，9781107002173。\n\
