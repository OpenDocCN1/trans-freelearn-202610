  mdcn: "\n\n在本节中，我们提供了量子力学中的两个关键不等式，即贝尔不等式和 CHSH 不等式。我们也在本节中指出量子力学违反了这两个不等式。下一节将介绍复合量子系统和纠缠量子系统。\n\
    \n## 理解复合系统和纠缠\n\n我们在第 2 章《量子态、操作和测量》中看到，复合量子系统可以是可分离的，也可以是不可分离的。让我们考虑两个量子比特：\n\
    \n|u₁⟩ = α₀|0⟩ + α₁|1⟩\n\n和\n\n|u₂⟩ = β₀|0⟩ + β₁|1⟩\n\n正如我们在上一节中已经看到的，如果这两个态是可分离的，那么这些量子比特的复合系统将如下所示：\n\
    \n|u⟩ = α₀β₀|00⟩ + α₀β₁|01⟩ + α₁β₀|10⟩ + α₁β₁|11⟩\n\n由于复合系统 |u⟩ 是可分离的，因此可以将其分解为其构成的量子态，即\
    \ |u₁⟩ 和 |u₂⟩。然而，这种分解并非总是可能。例如，考虑以下复合系统：\n\n|v⟩ = 1/√2 (|00⟩ + |11⟩)\n\n现在，我们想看看是否可以将\
    \ |v⟩ 分解为其构成的量子态，例如 |v₁⟩ 和 |v₂⟩。回想一下，态 |v₁⟩ 和 |v₂⟩ 可以写成如下形式：\n\n|v₁⟩ = α₀|0⟩ +\
    \ α₁|1⟩\n\n和\n\n|v₂⟩ = β₀|0⟩ + β₁|1⟩\n\n现在，如果 |v⟩ 是一个乘积态，则意味着以下内容：\n\n$|v\\rangle\
    \ = \\alpha_0\\beta_0|00\\rangle + \\alpha_0\\beta_1|01\\rangle + \\alpha_1\\\
    beta_0|10\\rangle + \\alpha_1\\beta_1|11\\rangle = \\frac{1}{\\sqrt{2}}(|00\\\
    rangle + |11\\rangle)$\n\n这只有在以下条件成立时才可能成立：\n\n$\\alpha_0\\beta_1 = \\alpha_1\\\
    beta_0 = 0$\n\n和\n\n$\\alpha_0\\beta_0 = \\alpha_1\\beta_1 = \\frac{1}{\\sqrt{2}}$\n\
    \n然而，上述两个等式不能同时成立。第一个等式的含义是概率幅 $\\alpha_0$、$\\alpha_1$、$\\beta_0$ 或 $\\beta_1$\
    \ 中至少有一个为零，而第二个等式意味着概率幅都不为零。这导致了矛盾。因此，复合态 |v⟩ 不能分解为其构成的量子态 |v₁⟩ 和 |v₂⟩。因此，|v⟩\
    \ 是不可分离的，量子态 |v₁⟩ 和 |v₂⟩ 称为纠缠。\n\n在本节中，我们展示了量子态如何纠缠，而不是可分离态。下一节讨论 **CNOT 门** 如何用作纠缠门。CNOT\
    \ 门用于纠缠两个量子态。\n\n## 理解 CNOT 门 – 纠缠门\n\n在 *第 2 章，量子态、操作和测量* 中，我们简要概述了称为受控非门（CNOT\
    \ 门）的两量子比特门。CNOT 门可用于纠缠量子态。它也被称为纠缠量子比特。作为示例，考虑两个量子比特 $|w_1\\rangle$ 和 $|w_2\\\
    rangle$，两者均处于 |0⟩ 态。现在，当我们将哈达玛门（哈达玛门在 *第 2 章，量子态、操作和测量* 中引入）应用于 $|w_1\\rangle$\
    \ 时，我们得到以下结果：\n\n$|w_1\\rangle \\rightarrow H|0\\rangle = \\frac{1}{\\sqrt{2}}[|0\\\
    rangle + |1\\rangle]$\n\n此外，通过将 CNOT 门应用于方程中的 |w₁⟩ 和 |w₂⟩（仍处于 |0⟩ 态），我们得到以下结果：\n\
    \n$|w_2\\rangle \\rightarrow \\text{CNOT}(|w_1\\rangle, |0\\rangle) = \\frac{1}{\\\
    sqrt{2}} (|00\\rangle + |11\\rangle)$\n\n这，正如我们已经观察到的，是一个纠缠态。该态是众所周知的贝尔态、贝尔基态或\
    \ EPR 态的纠缠量子态的一个示例。\n\n使用 qutip 生成此贝尔态的 Python 代码如下所示：\n\n```\nfrom qutip import\
