    图 3.1 – 创建贝尔态的量子电路\n\n在前述电路中，哈达玛门作用于第一个量子比特（|a⟩），CNOT 门作用于 H|a⟩ 的输出和第二个输入量子比特（|b⟩）。作为练习，证明前述电路实际上在第一个量子比特\
