    \ 1/√2 (|00⟩ + |11⟩)\n|ψ₀₁⟩ = CNOT(H|0⟩, |1⟩) = 1/√2 (|00⟩ − |11⟩)\n|ψ₁₀⟩ = CNOT(H|1⟩,\
    \ |0⟩) = 1/√2 (|01⟩ + |10⟩)\n|ψ₁₁⟩ = CNOT(H|1⟩, |1⟩) = 1/√2 (|01⟩ − |10⟩)\n```\n\
    \n请将证明所提供的等式是否正确作为练习。\n\n让我们讨论四个贝尔态：\n\n- 如可见，第一个贝尔态 |ψ₀₀⟩ 是在两个输入量子比特都处于 |0⟩ 态时创建的。\n\
    - 此外，贝尔态 |ψ₀₁⟩ 是在第一个输入量子比特处于 |0⟩ 态且第二个输入量子比特处于 |1⟩ 态时创建的。\n- 此外，贝尔态 |ψ₁₀⟩ 是在第一个输入量子比特处于\
    \ |1⟩ 态且第二个输入量子比特处于 |1⟩ 态时创建的。\n- 最后，贝尔态 |ψ₁₁⟩ 是在两个输入量子比特都处于 |1⟩ 态时创建的。\n\n使用\
    \ qutip 生成这些贝尔态的 Python 代码如下所示：\n\n```\nfrom qutip import *\n\nv_00 = bell_state(state=\"\
