    \n## 探索超密编码\n\n在第 3 章《纠缠与量子隐形传态》中，我们接触了量子隐形传态协议。另一个与量子隐形传态密切相关的协议是超密编码。虽然量子隐形传态旨在使用两个经典比特的过程将一个未知的量子态从一个通信方（通常称为发送方\
    \ Alice）发送到另一个通信方（通常称为接收方 Bob），但超密编码旨在使用单个量子态将两个经典比特从一个通信方发送到另一个通信方。\n\n超密编码的操作如下：\n\
    \n+   1. 首先，创建一个 EPR 对，并且该对由 Alice 和 Bob 共享。\n+   2. 然后，根据 Alice 希望发送给 Bob 的比特，她对其量子比特（EPR\
    \ 对的一部分）应用以下操作：\n\n| 要发送的比特对 | 量子操作 |\n|---|---|\n| 00 | I |\n| 01 | Z |\n| 10\
    \ | X |\n| 11 | ZX |\n\n表 4.10 – Alice 可以根据她想要传达给 Bob 的比特对而执行的一组量子操作\n\n+   3.\
    \ 在接收端，Bob 首先应用 CNOT 门，然后是 Hadamard 门。这本质上是 Alice 在其侧面应用操作的逆过程。\n+   4. 最后，Bob\
    \ 执行测量以恢复 Alice 发送的两个经典比特。\n\n作为示例，使用超密编码发送经典比特 '01' 的框图如下所示：\n\n![](img/2508606813a9204c61e8132ec0695cc1_110_0.png)\n\
    \n图 4.11 – 使用超密编码发送经典比特 '01' 的量子电路\n\n同样，其他对经典比特也可以通过用适当的操作门替换前面的泡利 Z 门来发送，如前表所示。\n\
    \n使用 IBM 的 Circuit Composer，超密编码用于传输经典比特 '01' 如下所示：\n\n![](img/2508606813a9204c61e8132ec0695cc1_110_1.png)\n\
    \n图 4.12 – 发送经典比特 '01' 的超密编码电路\n\n注意\n该电路使用 IBM 的 Circuit Composer 生成。\n\n前图中超密编码电路中的虚线垂直线是屏障。屏障在\
    \ Circuit Composer 上用于提供清晰度并改善电路的可视化。在这种情况下，电路最左侧部分的大门用于生成 EPR 对。然后，泡利 Z 门是 Alice\
    \ 对其 EPR 对部分执行的操作。此外，下一个门集用于解码。然后，最后，Alice 和 Bob 对其量子比特执行测量。\n\n最后，使用 qiskit 平台，实现超密编码的\
    \ Python 代码如下。在此代码中，传输的量子比特为 '11'：\n\n+   1. 第一步涉及导入实现超密编码所需的模块：\n\n```\n#Import\
    \ modules\nfrom qiskit import *\nfrom qiskit.visualization import plot_histogram\n\
    import matplotlib.pyplot as plt\nimport numpy as np\n\nnp.random.seed(42)\n```\n\
    \n+   2. 下一步是创建贝尔态，并且该纠缠态由 Alice 和 Bob 共享：\n\n```\ndef create_bell_pair(qc, a,\
    \ b):\n    q.h(a)\n    qc.cx(a,b)\n```\n\n+   3. 随后是 Alice 对要发送给 Bob 的经典比特进行编码，以及\
    \ Bob 对此类比特进行解码：\n\n```\ndef encode_message(qc, qubit, msg):\n    if msg == \"\
    00\":\n        pass\n    elif msg == \"10\":\n        qc.x(qubit)\n    elif msg\
    \ == \"01\":\n        qc.z(qubit)\n    elif msg == \"11\":\n        qc.z(qubit)\n\
    \        qc.x(qubit)\n\ndef decode_message(qc,a, b):\n    qc.cx(a,b)\n    qc.h(a)\n\
    ```\n\n4. 下一步是定义用于实现超密编码的量子电路：\n\n```\nqc = QuantumCircuit(2)\n\ncreate_bell_pair(qc,\
    \ 0, 1)\nqc.barrier()\n\nmessage = \"11\"\nencode_message(qc, 0, message)\nqc.barrier()\n\
    \ndecode_message(qc, 0, 1)\n\nqc.measure_all()\n\nqc.draw(output = \"mpl\")\n\
    #plt.show()\n```\n\n5. 然后使用 IBM 的 'qasm_simulator' 对超密编码电路进行模拟，并显示获得的结果：\n\n```\n\
    backend = Aer.get_backend('qasm_simulator')\njob_sim = execute(qc, backend, shots=1024)\n\
    sim_result = job_sim.result()\n\nmeasurement_result = sim_result.get_counts(qc)\n\
    print(measurement_result)\nplot_histogram(measurement_result)\nplt.show()\n```\n\
    \n现在，让我简要介绍一下代码：\n\n+   1. 首先，如同总是那样，导入所有所需模块。\n+   2. 然后，创建用于创建贝尔态的函数。\n+   3.\
    \ 随后是定义要发送的经典消息编码的函数。\n+   4. 此外，还创建了解码发送的经典消息的电路。\n\nDeutsch 算法用于确定未知二元函数 f(x)\
    \ 是 **常数** 还是 **平衡** 的。在说明什么是常数或平衡函数之前，让我们稍微退一步，讨论二元函数。二元函数是一个函数，它以一个比特作为输入并给出一个比特作为输出。因此，一元二元函数\
    \ f(x) 如下所示：\n\nf(x): {0,1} → {0,1}\n\n存在四种可能的二元函数，如下表所示：\n\n| 输入 | f₁ | f₂ |\
    \ f₃ | f₄ |\n|---|---|---|---|---|\n| 0 | 0 | 0 | 1 | 1 |\n| 1 | 0 | 1 | 0 | 1\
    \ |\n\n图 5.1 – 函数 f(x) 的四种可能的二元函数\n\n正如您从图 5.1 中看到的那样，第一个函数，函数 f1，无论输入如何都给出 0\
    \ 的输出。另一方面，函数 f2 给出的输出与输入相同。此外，函数 f3 给出输入的逆。最后，函数 f4 的输出无论输入如何都是 1。\n\n前表中函数 f1\
    \ 和 f4 被称为 **常数** 二元函数，而函数 f2 和 f3 被称为 **平衡** 二元函数。本质上，常数二元函数无论输入如何都给出相同的输出（0\
    \ 或 1）。因此，对于常数二元函数，输出不依赖于输入。另一方面，平衡二元函数产生相等数量的 0 或 1。也就是说，对于平衡二元函数，输出取决于输入。\n\n\
    常数和平衡二元函数的另一种解释如下。二元函数 f 是常数，如果适用以下条件：\n\nf(0) ⊕ f(1) = 0\n\n另一方面，二元函数 f 是平衡的，如果适用以下条件：\n\
    \nf(0) ⊕ f(1) = 1\n\n现在我们已经简要解释了平衡和常数函数，让我们进一步探究 Deutsch 算法。如前所述，该算法的目的是评估给定函数是常数函数还是平衡函数。此评估是通过查询“黑箱”（即预言机）完成的。\n\
    \n"
