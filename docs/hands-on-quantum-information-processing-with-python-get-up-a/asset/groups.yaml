    # Y gate


    The Y gate is another single-qubit Pauli gate. It is defined by the following
    matrix:


    Y = [[0, -i], [i, 0]]


    The assessment of the effect of the Y gate on a qubit, and the corresponding Python
    code to implement the Y gate using Python, are left as an exercise for you to
    do.


    Another single-qubit quantum gate is the Hadamard gate, which is denoted by H.
    The Hadamard gate is defined by the following matrix:


    H = 1/√2 [[1, 1], [1, -1]]


    It should be noted that the Hadamard gate can also be written in terms of the
    X and the Z Pauli gates. This is given as:


    H = 1/√2 [X + Z]


    Lastly, another group of the single-qubit gates is the phase-shift group, which
    is denoted by R, with the R gate being defined by the following matrix:


    R = [[1, 0], [0, e^{iφ}]]


    with


    0 ≤ φ ≤ π.


    It is left as an exercise for you to show that the Z gate is a special type of
    the R group of quantum gates.'
