    Deutsch''s algorithm is used to determine whether an unknown binary function,
    f(x), is **constant** or **balanced**. Before stating what a constant or a balanced
    function is, let''s take a slight step back, to discuss a binary function. A binary
    function is a function that takes a bit as an input and gives out a bit as an
    output. Thus, a univariate binary function, f(x), is given as follows:


    f(x): {0,1} → {0,1}


    There are four possible binary functions, which are summarized as shown in the
    following table:


    | Input | f₁ | f₂ | f₃ | f₄ |

    |---|---|---|---|---|

    | 0 | 0 | 0 | 1 | 1 |

    | 1 | 0 | 1 | 0 | 1 |


    Figure 5.1 – Four possible binary functions for function f(x)


    As you can see from Figure 5.1, the first function, function f1, gives an output
    of 0 regardless of the input. On the other hand, function f2 gives the same output
    as the input. Furthermore, function f3 gives the inverse of an input. Finally,
    the output of function f4 is 1, regardless of the input.


    Functions f1 and f4 from the preceding table are called **constant** binary functions
    while functions f2 and f3 are called **balanced** binary functions. In essence,
    constant binary functions give the same output (either 0 or 1) regardless of the
    input. Thus, for a constant binary function, the outputs do not depend on the
    input. On the other hand, a balanced binary function produces an equal number
    of 0s or 1s. That is, for a balanced binary function, the outputs depend on the
    inputs.


    An alternative explanation of constant and balanced binary functions is given
    as follows. A binary function, f, is constant if the following applies:


    f(0) ⊕ f(1) = 0


    On the other hand, a binary function, f, is balanced if the following applies:


    f(0) ⊕ f(1) = 1


    Now that we have briefly explained the balanced and constant functions, let''s
    probe Deutsch''s algorithm even further. As stated earlier, the aim of this algorithm
    is to evaluate whether a given function is a constant or balanced function. This
    evaluation is done by querying a "blackbox" (an oracle).'
