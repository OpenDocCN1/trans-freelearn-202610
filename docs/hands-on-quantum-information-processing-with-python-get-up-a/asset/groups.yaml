    # Quantum key distribution


    **Quantum Key Distribution (QKD)** is the key distribution scheme that employs
    quantum mechanical concepts in order to enable sharing of the cryptographic key
    between the legitimate communicating parties, Alice and Bob. The use of quantum
    mechanics ensures that the presence of an eavesdropper, Eve, could be revealed
    to Alice and Bob.


    QKD uses two communication channels, namely, the quantum channel and the classical
    channel. The quantum channel is used for quantum communication, while the classical
    channel is used for classical post-processing. The following diagram shows the
    schematic diagram of a typical QKD scheme:


