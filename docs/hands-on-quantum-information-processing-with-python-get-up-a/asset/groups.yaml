    \ 量子信息处理的当前趋势\n\n在本章中，本书的最后一章，我们将关注 **量子信息处理 (QIP)** 的当前趋势。这将涵盖 QIP 各领域的趋势。此外，我们还将探讨\
    \ QIP 各领域的未来前景。\n\n在本章结束时，你将对 QIP 的发展方向有一个大致的了解。此外，你应该能够充分欣赏 QIP 各领域的当前趋势。\n\n\
    在本章中，我们将涵盖以下主题：\n\n- 探索量子密码学的当前趋势\n- 探索量子通信的当前趋势\n- 了解量子算法设计的当前趋势\n- 探索量子机器学习的当前趋势\n\
    - 了解量子计算硬件技术的当前趋势\n- QIP 的未来前景\n\n## 探索量子密码学的当前趋势\n\n量子密码学的关键进展主要集中在 **量子密钥分发**\
    \ (QKD) 上。该进展既体现在实际实现方面，也体现在 QKD 的理论安全性分析方面。在本节中，我们将重点介绍其中一些趋势。\n\nQKD 的一个重要进展在于其在现实世界问题中的应用。2007\
    \ 年，QKD 用于保护瑞士日内瓦的选举。该 QKD 实现项目由日内瓦大学主导。三年后，在 2010 年南非德班足球世界杯期间，QKD 用于保护通信。该项目由夸祖鲁-纳塔尔大学牵头。\n\
    \n这两种 QKD 实现（2007 年日内瓦的 QKD 实现和 2010 年德班的 QKD 实现）促使网络安全社区认真考虑量子密码学的意义和可行性。然而，QKD\
    \ 的研究主要局限于大学校园。\n\n随着在各个大学校园成功展示了 QKD 网络，出现了需要衍生公司将 QKD 商业化的需求。领先的 QKD 衍生公司之一是来自瑞士的\
    \ ID Quantique，它是日内瓦大学的衍生公司。\n\n量子密码学中另一个当前的关键兴趣领域是使用 QKD 进行远距离分离的各方之间的通信。在这方面值得注意的一个项目是由中国推动的。该项目的目标是实现地面与太空卫星之间的\
    \ QKD 通信。最终，该项目将使实现洲际 QKD 安全通信成为可能。\n\nQKD 也可以使用更高维度的离散量子系统实现。这些系统通常称为 **qudits**。很容易观察到，量子比特是二维希尔伯特空间中\
    \ qudit 的一个例子。\n\n本质上，qudit 是量子比特的推广。回想一下，在 *第 1 章，量子信息处理入门* 中，我们指出量子比特是存在于二维希尔伯特空间中的量子信息单位。另一方面，qudit\
    \ 存在于任何有限维希尔伯特空间中。这意味着量子比特是 qudit 的特例，其维度为二（因为它存在于二维希尔伯特空间中）。\n\n既然我们已经指出 QKD\
    \ 也可以使用 qudit 系统而不是仅使用普通的量子比特系统来实现，那么让我们简要探讨一下为什么以及如何做到这一点。为了实现 QKD，使用更高维度的量子系统（而不是量子比特）有几个好处。这些好处包括每个量子系统的信息容量提高、密钥生成速率高、安全性提高以及对噪声的鲁棒性提高。通常，光子的轨道角动量用于实现高维\
    \ QKD。\n\n迄今为止所涵盖的量子密码学趋势关注的是 QKD 的实现方面。然而，正如前面所说，QKD 的趋势不仅限于 QKD 的实现部分，还涉及 QKD\
    \ 的理论进展。因此，有必要也讨论 QKD 理论方面的当前趋势。\n\nQKD 的安全方面关注的是在各种假设下对 QKD 协议的安全性分析。目前的方法是对\
    \ QKD 中使用的设备做出尽可能现实的假设，然后基于此类假设评估 QKD 协议的安全性。\n\n在本节中，我们简要探讨了量子密码学的当前趋势。讨论仅限于\
    \ QKD，因为它是量子密码学中最成功和最先进的原语。在下一节中，我们将探讨量子通信的趋势。\n\n## 探索量子通信的当前趋势\n\n吸引大量关注的 QIP\
    \ 的另一个方面是量子通信。在本节中，我们的重点将放在量子网络上，也称为量子互联网。\n\n量子互联网的关键目标是通过使用各种纠缠的中介节点，将量子态从源传输到目的地。这些中介节点称为\
    \ **量子中继器**。量子中继器是量子互联网正常运行的核心。\n\n在非常基础的层面上，量子互联网可以被视为一个网络，它将各种潜在异构的量子网络连接成一个量子网络，以实现各种量子网络之间的通信。值得注意的是，目前没有任何量子互联网的实际实现。因此，量子互联网目前是从理论角度而不是从实现角度来研究的。\n\
    \n"
