    Equation 1 can be written as follows:


    $[x_1\ \ x_2\ \ \cdots\ \ x_n]^T = \begin{bmatrix} x_1 \\ x_2 \\ \vdots \\ x_n
    \end{bmatrix}$


    Equation 2 can be written as follows:


    $\begin{bmatrix} x_1 \\ x_2 \\ \vdots \\ x_n \end{bmatrix}^T = [x_1\ \ x_2\ \
    \cdots\ \ x_n]$


    The first equation indicates that the elements of a row vector (represented by
    a row) are transformed into the column vector (represented by the column) when
    the transpose is applied to it. On the other hand, the second equation is the
    opposite of the first equation. In the second equation, the transpose is applied
    to the column vector in order to transform it into the row vector:


