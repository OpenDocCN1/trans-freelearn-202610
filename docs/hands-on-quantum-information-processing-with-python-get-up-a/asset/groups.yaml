  - '[PAGE 175]


    Cryptography is carried out by first converting an ordinary piece of information
    (referred to as plaintext) into an unintelligible string of characters (referred
    to as ciphertext). This conversion process is done so that the information transmitted
    from the transmitter (conventionally called Alice) is not intercepted by an eavesdropper
    (conventionally called Eve) on its way to the receiver (conventionally called
    Bob).


    Once the plaintext has been converted to ciphertext, it can then be transmitted
    over the channel to Bob. In the channel, Eve can have access to such a ciphertext,
    but cannot make sense of such information (ciphertext), since it is unintelligible.
    On the receiver''s side (Bob''s side), the ciphertext is then converted back to
    plaintext.


    From the details discussed previously, it can be observed that cryptography can
    be divided into two processes. These processes are encryption and decryption.
    The former (encryption) consists of the conversion of plaintext to ciphertext,
    using a cryptographic key. On the other hand, the latter (decryption) consists
    of the conversion of ciphertext to plaintext, with the help of a cryptographic
    key.


    A schematic diagram of the cryptographic system (cryptosystem) is shown here:


    ![](img/2508606813a9204c61e8132ec0695cc1_175_0.png)


    The main goals of cryptography can be summarized as follows:


    +   - **Confidentiality (secrecy)**: To ensure that information is rendered inaccessible
    to the illegitimate communicating parties. Thus, secrecy ensures that there is
    no unauthorized access to the information.

    +   - **Data integrity**: To ensure that information is not modified by illegitimate
    communicating parties during transmission.

    +   - **Authentication**: To guarantee that the sender of the information is who
    they claim to be. This, in turn, ensures that the only parties that can legitimately
    communicate are those that are verified as genuine.

    +   - **Non-repudiation**: To provide protection against one of the entities involved
    in a communication from denying having participated in such a communication.'
  - '[PAGE 176]


    Based on the nature of the cryptographic key being used, cryptography can be broadly
    divided into two branches, namely:


    +   - Symmetric cryptography (secret-key cryptography)

    +   - Asymmetric cryptography (public-key cryptography)


    Symmetric cryptography uses a single cryptographic key that is shared by both
    Alice and Bob (recall that Alice and Bob are the legitimate communicating parties).
    In order to guarantee the protection of the information being shared between Alice
    and Bob, the cryptographic key used must be kept secret for as long as the information
    is kept secret.


    Now that we have provided a brief description of symmetric cryptography, it is
    time to turn our attention to asymmetric cryptography. In this branch of cryptography,
    two separate but related cryptographic keys are used. One key, known as the private
    key, is kept secret, while the other key, known as the public key, is made public
    (and hence can be transmitted over an insecure but authenticated communication
    channel).


    Having provided some background information on cryptography, it is now time to
    briefly explore the history of cryptography. Therefore, the next subsection will
    cover the history of cryptography.


    # A history of classical cryptography


    Throughout history, cryptography has been used for various purposes, such as the
    following:


    +   - Diplomatic communications

    +   - Military operations

    +   - Commercial activities

    +   - Private communications

    +   - Religious applications


    Earlier implementations of cryptography, which is known as classical cryptography,
    were primarily concerned with the substitution of characters in a message. One
    of the most prominent schemes in classical cryptography is Caesar''s substitution
    cipher.


    # Caesar''s cipher


    The Caesar''s cipher cryptographic scheme uses a cyclic alphabet and substitutes
    a character with another three places later in the alphabet. Thus, a character
    *a* will be substituted with a character *d*.'
