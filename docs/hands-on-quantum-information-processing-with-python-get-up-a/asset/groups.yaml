    The preceding examples can be generalized to any separable joint state. Thus,
    any n-qubit joint quantum state can be given as:


    $$\sum_{i=0}^{2^{n}-1} \alpha_i \, i\rangle$$


    with the condition that:


    $$\sum_{i=0}^{2^{n}-1} |\alpha_i|^2 = 1.$$


    Just like in the case of single-qubit quantum states, quantum operations can also
    be applied to a composite quantum state. As already stated, these quantum operations
    are also referred to as quantum gates, and they can either be unitary or non-unitary
    (measurement).


    # Quantum gates on multiple qubit systems


    Quantum gates can be applied either on a single qubit or on more than one qubit
    of the composite. As an example, let''s consider a three-qubit state, |000>. This
    state, as can be seen, is a tensor product of three qubits in the |0> state. Thus,
    we have the following:


    $$|000\rangle = |0\rangle \otimes |0\rangle \otimes |0\rangle.$$


    On the other hand, the tensor products of three qubits in the |1> state is given
    as:


    $$|111\rangle = |1\rangle \otimes |1\rangle \otimes |1\rangle.$$


    As an exercise for you, write the tensor products of the following three-qubit
    quantum systems:


    +   - |0>, |0>, and |1>

    +   - |0>, |1>, and |0>

    +   - |1>, |1>, and |0>

    +   - |1>, |0>, and |0>'
