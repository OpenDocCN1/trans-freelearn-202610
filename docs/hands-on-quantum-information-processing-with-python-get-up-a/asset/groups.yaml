    The MD5 is not the only hash function that can be implemented in Python. Several
    others, including SHA and BLAKE, can also be implemented. The following code shows
    the Python implementation of the SHA scheme using the hashlib module:


    ```

    import hashlib


    AliceMessage = hashlib.sha3_512()

    Alice = "This is Alice"

    Alice = Alice.encode(encoding=''utf-8'')

    AliceMessage.update(Alice)

    print("Alice''s SHA digest is: \n", AliceMessage.hexdigest())


    print("Alice''s digest size is: \n", AliceMessage.digest_size)

    print("Alice''s block size is: \n", AliceMessage.block_size)


    BobMessage = hashlib.sha3_512()

    Bob = "This is Bob"

    Bob = Bob.encode(encoding=''utf-8'')

    BobMessage.update(Bob)

    print("Bob''s SHA digest is: \n", BobMessage.hexdigest())


    print("Bob''s digest size is: \n", BobMessage.digest_size)

    print("Bob''s block size is: \n", BobMessage.block_size)

    ```


    Just like the code snippet of the previous example (the MD5 code snippet), the
    preceding code snippet computes the hash function for both Alice and Bob''s messages.
    The only difference is that instead of using the MD5 algorithm, the Python code
    provided above uses the Secure Hash Algorithm (SHA). Therefore, the function used
    in this case is the hashlib.sha3_512() function, which uses SHA-3 and has a 512-bit
    hash value.


    So far, we have considered two cryptographic primitives, namely, PRNGs and hash
    functions. The final cryptographic primitive to consider in this chapter is secret
    sharing. This primitive is explored next.


    # Secret sharing


    So far, we have considered cryptography from an angle where two communicating
    parties want to share a secret message. However, this communication can involve
    more than two communicating parties. In such cases, a suitable cryptographic primitive
    is secret sharing.'
  - '[PAGE 185]


    Secret sharing is a cryptographic primitive that is used to distribute a secret
    value among multiple communicating parties. This distribution is done by splitting/fragmenting
    the original message into various small fragments, and sending each fragment to
    each communicating party.


    In order to recover the original message that was shared, the communicating parties
    would have to collaborate so that they can combine their fragments into the original
    message. The security of this cryptographic primitive lies in the fact that in
    order to recover the original message, the communicating parties would have to
    collaborate with other parties and recombine the various fragments of the message.
    This way, no individual can have access to the entire message without first collaborating
    with other communicating parties.


    The secret sharing cryptographic primitive was independently proposed by Adi Shamir
    and George Blakley in 1979. Here, we focus only on the Shamir version of the secret
    sharing primitive.


    The Shamir version of the secret sharing cryptographic primitive can be summarized
    as follows. Consider a secret message denoted by S, which is then divided into
    n parts, such that:


    S = s₁, s₂, ⋯, sₙ


    Then, a number k is chosen such that if


    sᵢ ≥ k


    the message S could be successfully recovered. However, if the parts of the messages
    combined together are


    sᵢ ≤ (k − 1)


    then the original message S could not be successfully recovered.


    We have covered the cryptographic primitives. Furthermore, we have provided a
    brief introduction to classical cryptography and modern cryptography. In the next
    section, we will cover quantum cryptography.'
  - '[PAGE 186]


    # Quantum cryptography


    We have learned in the previous section that modern cryptography makes assumptions
    about the computational capabilities of an eavesdropper. Although this cryptographic
    approach is still widely used, it faces a serious challenge in that its security
    cannot be proven theoretically.


    As an alternative to modern cryptography, there is another approach to data protection.
    This approach provides an information-theoretic security guarantee instead of
    the computational security guarantee provided by modern cryptography. This approach
    is known as quantum cryptography.


    In essence, quantum cryptography is a cryptographic approach that uses quantum
    mechanical concepts such as quantum entanglement, superposition, and the quantum
    no-cloning theorem (these concepts were discussed earlier in Chapter 2, Quantum
    States, Operations, and Measurements) in order to protect data.


    # A history of quantum cryptography


    The history of quantum cryptography can be traced back to the 1970s, when Stephen
    Wiesner proposed a scheme that can be used to provide secure quantum money. The
    ideas from Wiesner’s work were then expanded by Charles Bennett and Gilles Brassard
    in order to propose the first ever quantum key distribution (QKD) protocol in
    1984. This QKD protocol would later be referred to as the BB84 protocol.


    Another major breakthrough in quantum cryptography came in 1991, when Artur Ekert
    proposed another QKD protocol based on quantum entanglement. This QKD protocol
    proposed by Ekert would later be referred to as the E91 protocol.


    Since its inception some decades back, quantum cryptography has enjoyed a massive
    growth over the years. It is now arguably the most successful field of quantum
    information processing.


    In this subsection, we have just covered a brief history of quantum cryptography.
    In the next subsection, we will cover quantum cryptography primitives.


    # Quantum cryptography primitives


    Earlier in this chapter, we explored the cryptographic primitives for modern cryptography.
    Here, we explore some of quantum cryptography primitives. The cryptographic primitives
    to be explored include the following:


    +   - Quantum random number generator (QRNG)

    +   - Quantum key distribution (QKD)'
