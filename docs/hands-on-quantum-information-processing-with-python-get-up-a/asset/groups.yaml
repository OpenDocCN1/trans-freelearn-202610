    # Providing an overview of QIP


    The field of QIP arose in response to the limits imposed on conventional information
    processing by the fundamental laws of physics. These limits were initially investigated
    in the 1960s by Rolf Landauer. Landauer''s work was later extended by his colleague,
    Charles Bennett, in the 1970s.


    Initially, the focus of QIP was to determine the physical limits that are imposed
    on conventional information processing. However, as time progressed, the scope
    of QIP was expanded in order to explore such ideas as quantum cryptography, quantum
    computing, and quantum communication. These ideas will be discussed later in this
    book.'
