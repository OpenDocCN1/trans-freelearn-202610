    # Leaning about strategies in game theory


    As already stated in this chapter, a strategy is a set of actions that each player
    takes in the game. Strategies are a significant component of game theory. A strategy
    gives a complete specification of a player''s behavior. This (complete) specification
    describes actions that a player would take at each of their decision points (information
    sets).


    In essence, for an n-player game, a strategy is a function that assigns each of
    the players'' information sets (places where a player makes decisions) to an action
    available to said player at that information set. Therefore, it can be seen that
    a strategy can be thought of as a prescription for how to play a game in all possible
    scenarios.


    Consider an n-player game. In such a setting, each player, i, has their own set
    of possible strategies, denoted as S_i. In order to play a game, each player,
    i, then selects the strategy:


    s_i ∈ S_i


    In such a setting, a vector of strategies (strategy set) selected by a player
    i is given by:


    s = (s_1, ⋯, s_n)


    It is worth noting that a vector of strategies selected by the players in an n-player
    game ultimately determines the outcome for each player in the game.


    A strategy that results in the player having the best outcome regardless of the
    strategies from other players is called the dominant strategy. On the other hand,
    a strategy that results in the worst outcome regardless of the strategies of other
    players is known as the dominated strategy.


    Another comparison of strategies in game theory involves whether the strategy
    is deterministic. If the strategy of a player involves a deterministic set of
    actions, it is said to be a pure strategy. On the other hand, if the strategy
    is stochastic (in which case, the player chooses randomly among a set of possible
    actions), then the strategy is said to be a mixed strategy.


    In this subsection, we have covered the strategies used in game theory. Furthermore,
    we have briefly discussed the dominant strategy. Finally, we have contrasted the
    pure and mixed states. The following section will explore the differences between
    cooperative games and the non-cooperative games.'
