  - '[PAGE 169]


    In essence, the setup for the GHZ game is similar to that of the CHSH game, except
    that in the former, there are three players (Alice, Bob, and Charlie) who initially
    share the entanglement (tripartite entanglement), while in the latter, there are
    only two players (Alice and Bob) who share the entanglement (bipartite entanglement).


    The three-player GHZ quantum game be summarized as follows. Consider three players,
    namely, Alice, Bob, and Charlie. The referee sends the bits x, y, and z to Alice,
    Bob, and Charlie, respectively. In response, the players Alice, Bob, and Charlie
    output the bits a, b, and c, respectively. The players win if:


    a ⊕ b ⊕ c = x ∨ y ∨ z


    The following procedure summarizes the implementation of the GHZ quantum game:


    +   - Before the start of the game, ensure that all three players share the tripartite
    entanglement.

    +   - Each player applies the Hadamard gate to their qubit when they receive 1.

    +   - Each player measures their qubit state.


    The following steps show the implementation of the GHZ quantum game using Python:


    1. The first step entails the importing of the required modules:


    ```

    from qiskit import *

    from qiskit.visualization import plot_histogram

    import numpy as np


    np.random.seed(42)

    ```


    2. The next step involves defining the quantum circuit that is used to implement
    the three-qubit GHZ game:


    ```

    circ = QuantumCircuit(3,3)

    circ.h(0)

    circ.cx(0,1)

    circ.cx(0,2)

    circ.h(0)

    circ.h(1)

    circ.h(2)

    circ.measure([0,1,2], [0,1,2])

    ```'
