    \n在量子博弈论中，诸如态的量子叠加和纠缠等量子力学概念可以通过以下方式使用：\n\n- 初始态的量子叠加\n- 初始态的量子纠缠\n- 策略的量子叠加\n\
    \n如前所述，量子博弈论将经典博弈量子化。量子化经典博弈有以下几点原因：\n\n- 利用已有的经典博弈来发展新的博弈论框架。这是因为经典博弈和量子力学都基于概率论。\n\
    - 研究博弈论效应是否能在量子力学支配规则的亚原子层面被观察到。\n- 研究博弈论与量子通信理论之间的联系。\n- 探索量子力学是否能提供优势，以赢得一些特殊设计的非合作博弈。\n\
    \n第一个量子博弈由 Meyer 于 1999 年提出。在这项工作中，Meyer 提出了一个称为“便士翻转硬币”（penny flip coin）的量子博弈。该博弈与之前讨论过的“匹配便士博弈”（matching\
    \ penny game）密切相关。此外，Meyer 在这项工作中证明，通过使用量子策略，玩家可以提高他们的期望收益。\n\n继 Meyer 的工作之后，Eisert\
    \ 等人也很快开展了相关工作，他们进一步引入了量子博弈和量子策略。自这些早期贡献以来，量子博弈论框架的发展取得了重大进展。\n\n到目前为止，我们已经对量子博弈论进行了简要介绍。在下一小节中，我们将通过探索非局部量子博弈来进一步深入量子博弈论。\n\
    \n### 理解非局部量子博弈\n\n非局部量子博弈是指量子玩家在参与博弈时位于不同地点的博弈。非局部博弈通常用于检验量子系统中的非局域性。一个双人非局部博弈涉及两名玩家（Alice\
    \ 和 Bob）以及一个裁判。\n\n在这种情况下，裁判的角色是确保任何一方玩家（Alice 或 Bob）在博弈过程中都不与另一方通信。然而，Alice 和\
    \ Bob 可以将他们的量子比特纠缠在一起（以共享关联）。通常，在非局部量子博弈中，玩家被允许在完全了解输入分布的情况下确定联合策略。\n\n在本小节中，我们介绍了量子非局部博弈。在下一小节中，我们将简要探讨非局部量子博弈中的量子策略。\n\
    \n### 探索非局部量子博弈中的量子策略\n\n在经典博弈论中，策略可以是纯策略（确定性的）或混合策略（概率性的）。另一方面，在量子博弈论中，策略只能是概率性的。\n\
    \n每个玩家的量子策略（记为 s_i）是玩家根据自身信息决定采取何种行动的过程。量子策略空间 S = {s_j} 是玩家可用的策略集合。\n\n为了进一步探究量子策略，考虑一个如下特征描述的双人量子博弈\
    \ τ：\n\nτ = (H, ρ, S_A, S_B, P_A, P_B)\n\n其中 H 是希尔伯特空间，ρ 是初始量子态，S_A 和 S_B 是两位玩家的策略，P_A\
    \ 和 P_B 是这些玩家的收益泛函。在这种情况下，量子策略 s_A 和 s_B（可表示为 s_A ∈ S_A 和 s_B ∈ S_B）是量子操作。\n\n\
    如果对于所有量子策略对，期望收益总和为零，则双人量子博弈被称为零和量子博弈。否则（如果不是这种情况），则称为非零和量子博弈。\n\n进一步，考虑策略 s_A、s'_A、s_B\
    \ 和 s'_B，其中 s_A、s'_A ∈ S_A，s_B、s'_B ∈ S_B。\n\n此外，如果对于所有 s_B，P_A(s_A, s_B) = P_A(s'_A,\
    \ s_B) 且 P_B(s_A, s_B) = P_B(s'_A, s_B)，则量子策略 s_A 和 s'_A 是等价的。\n\n类似地，如果对于所有 s_A，P_B(s_A,\
    \ s_B) = P_B(s_A, s'_B) 且 P_A(s_A, s_B) = P_A(s_A, s'_B)，则量子策略 s_B 和 s'_B 是等价的。\n\
    \n此外，如果满足以下条件，则量子策略 s_A 称为支配策略：\n\nP_A(s_A, s'_B) ≥ P_A(s'_A, s'_B)\n\n类似地，如果满足以下条件，则量子策略\
    \ s_B 称为支配策略：\n\nP_B(s'_A, s_B) ≥ P_B(s'_A, s'_B)\n\n在此，值得注意的是，如果 s_A 和 s_B 分别是这个双人量子博弈中两位玩家的支配策略，则称量子策略对\
    \ (s_A, s_B) 为策略均衡。\n\n最后，如果 P_A(s_A, s'_B) ≥ P_A(s'_A, s'_B) 且 P_B(s'_A, s_B)\
    \ ≥ P_B(s'_A, s'_B)，则量子策略对 (s_A, s_B) 称为纳什均衡。\n\n在本小节中，我们对非局部量子策略进行了简要阐述。在下一小节中，我们将讨论非局部量子博弈的一个例子，即克劳泽-霍恩-希莫尼-霍尔特（CHSH）量子博弈。\n\
    \n### 理解 CHSH 博弈\n\nCHSH 量子博弈是非局部量子博弈的一个例子。它利用本书前面第 3 章“纠缠与隐形传态”中讨论过的 CHSH 不等式。它将不等式转化为一个由\
    \ Alice 和 Bob 在裁判在场的情况下进行的量子博弈。\n\nCHSH 量子博弈可应用于见证量子系统中的二分纠缠。\n\nCHSH 量子博弈可概述如下。考虑两位玩家\
    \ Alice 和 Bob。他们分别从裁判那里收到比特 x 和 y，并且必须分别以比特 a 和 b 作为回应。此外，如果满足以下条件，则 Alice 和 Bob\
    \ 获胜：\n\n$a \\oplus b = x \\cdot y$\n\n并且 Alice 和 Bob 在博弈开始前就联合策略进行沟通，但在博弈过程中不允许通信。\n\
    \n以下步骤总结了实现 CHSH 博弈所使用的过程：\n\n- 在博弈开始前，Alice 和 Bob 共享一个贝尔态（Bell pair）。\n- 如果 Alice\
    \ 收到 x = 0，她测量自己的量子比特并输出结果。\n- 如果她收到 x = 1，她沿 y 轴施加 π/2 的旋转门 Ry(π/2)，并测量自己的量子比特。\n\
    - 如果 Bob 收到 y = 0，他施加旋转门 Ry(π/4)，然后测量自己的量子比特。\n- 如果 Bob 收到 y = 1，他施加旋转门 Ry(-π/4)，然后测量自己的量子比特。\n\
    \n以下步骤演示了使用 Python 实现 CHSH 博弈：\n\n1. 导入必要的模块：\n\n```\nfrom qiskit import *\nimport\
    \ numpy as np\n\nnp.random.seed(42)\n```\n"
