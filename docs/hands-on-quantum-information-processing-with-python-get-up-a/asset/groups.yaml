  - '[PAGE 47]


    Quantum mechanics is a conceptual framework that is used to describe the microscopic
    physical reality. The development of quantum theory started at the beginning of
    the 20th century, and this development was led by physicists including Niels Bohr,
    Albert Einstein, and Max Planck.


    The development of quantum mechanics was motivated in part by the failure of classical
    physics to adequately account for the behavior of sub-atomic objects such as electrons.
    The understanding of nature at a sub-atomic level led to the massive success of
    the electronics and conventional computing industries. This technological achievement
    is referred to as the **first quantum revolution.**


    Quantum information processing is billed as the **second quantum revolution**,
    since it follows the success of the first quantum revolution just discussed.


    Quantum information processing arose in response to the limitations imposed on
    conventional computers by the fundamental laws of physics. The first person to
    explore these limitations on conventional computing was Rolf Landauer, who was
    working at IBM at the time. He started these investigations in the early 1960s.
    Landauer''s work focused on the application of the laws of thermodynamics to the
    field of computing.


    In the 1970s, Landauer''s work was extended by Charles Bennett, who was his (Landauer''s)
    colleague at IBM. Bennett demonstrated that it is possible to perform a two-way
    reversible computation. A two-way reversible computation means that given the
    outputs of a computation, it is possible to use those outputs and the circuit
    used for computation in order to obtain the inputs of the computation.


    It is worth noting that a two-way reversible computation implies that information
    is not lost during the computation. As we will see later, there is a set of quantum
    operations that is reversible. Also, the set of quantum operations that is not
    reversible is a quantum measurement. This will also be discussed later in this
    chapter.


    Besides the focus on the limitations imposed on conventional information processing,
    the earlier stages of quantum information processing also focused on the use of
    quantum theory for applications in the security sector.


    In the 1960s, Stephen Wiesner explored the use of quantum mechanics in order to
    make banknotes that would be impossible to counterfeit. Unfortunately, Wiesner''s
    idea did not gain any acceptance within the scientific community. It was not until
    the 1980s that his idea was used as an inspiration to pursue another field of
    quantum information processing.'
  - '[PAGE 48]


    In the 1980s, inspired by Wiesner''s idea of banknotes that cannot be counterfeited,
    Charles Bennett and Gilles Brassard developed a cryptographic scheme that uses
    the laws of quantum mechanics to securely communicate information. This security
    scheme later came to be known as the **Bennett Brassard 1984 (BB84) quantum key
    distribution (QKD) protocol**. The QKD protocol is used to securely share the
    cryptographic key between the legitimate communicating parties, with the guarantee
    that the presence of an eavesdropper would be detected.


    In 1991, quite independently from the work of Bennett and Brassard, Artur Ekert
    used quantum theory to develop a new QKD protocol, which was later to be known
    as the **E91 protocol**. Although the BB84 and E91 QKD protocols are based on
    the different aspects of quantum theory, it was established in 1992 by Charles
    Bennett, Gilles Brassard, and David Mermin that the two QKD protocols are mathematically
    equivalent.


    The idea of a quantum computer was pursued in earnest in the 1980s by the likes
    of Yuri Manin, Paul Benioff, and Richard Feynman. Due to his popularity, especially
    in the 1980s, Feynman’s ideas of using the laws of quantum mechanics to perform
    computing were widely accepted in the scientific community, especially in physics.


    In 1985, David Deutsch proposed the first ever computational model for quantum
    computing and demonstrated that such a quantum computing machine could theoretically
    outperform the conventional quantum computing machine.


    For the remainder of the 1980s, quantum computation was just regarded as an area
    of academic curiosity, without any practical relevance. However, this view would
    be challenged and eventually defeated in 1994, when Peter Shor proposed a quantum
    algorithm that could potentially compromise the conventional cryptosystems that
    were widely used at the time.


    Two years later, in 1996, Lov Grover proposed a quantum search algorithm that
    outperformed any known conventional search algorithm. These two key results renewed
    interest in quantum computing by the scientific community.


    Even though there was a renewed interest in quantum computing, one major obstacle
    remained. Quantum systems are very fragile. They can easily interact with the
    environment, and hence easily lose their *quantumness* before completing the computation.


    It is worth noting that this interaction with the environment by the quantum system
    can induce errors in the computation, rendering the possibility of physically
    implementing a quantum computer virtually impossible. However, this virtual impossibility
    changed with the independent development of **quantum error correction (QEC)**
    schemes by Peter Shor and Andrew Steane in 1995 and 1996, respectively.'
  - '[PAGE 49]


    At the turn of the 21st century, encouraged by the development of QEC schemes,
    the attention of the quantum information processing community switched to the
    physical technologies that can be used to implement quantum computing. Various
    technologies were explored.


    These technologies include nuclear magnetic resonance, trapped atoms and ions,
    photonic devices, quantum dots, and superconducting circuits. To date, no single
    physical technology has proven to be the best among the rest. Therefore, different
    technologies are still pursued, with varying degrees of preference.


    Building a full-scale quantum computer is still a challenge that is yet to be
    overcome. Currently, quantum computers with limited computational capabilities
    are already in use. These quantum computers are known as **noisy, intermediate-scale
    quantum (NISQ)** computers. They are called *noisy* because they do not implement
    error correction.


    The lack of error correction in NISQ computers means that the circuits that can
    be implemented on them are very shallow. NISQ computers are currently being used
    to tackle various computational tasks, with applications in materials science,
    drug discovery, machine learning, and exploration of tasks where a NISQ computer
    offers a *quantum super-advantage*.


    Having provided a brief history of quantum information processing, it is now imperative
    to provide information on the basic unit of quantum information. This, I will
    do in the next section.


    # Understanding the qubit


    Just like in conventional information processing, where the **binary digit (bit)**
    is the basic unit of information, the **qubit (quantum bit)**, which is a quantum
    analogue of a bit, is also the basic unit of quantum information.


    Unlike a bit, which exists in either of two states (*0 or 1*), a qubit can exist
    in a superposition of these two states. It is defined as a vector in a two-dimensional
    complex **Hilbert space**, with the Hilbert space being defined as a vector space
    equipped with an inner product.


    As already stated in the previous chapter, a qubit |ψ⟩ is mathematically written
    as:


    $$|\psi\rangle = \alpha|0\rangle + \beta|1\rangle,$$


    with the complex coefficients **α** and **β** satisfying the relation:


    $$|\alpha|^2 + |\beta|^2 = 1.$$'
