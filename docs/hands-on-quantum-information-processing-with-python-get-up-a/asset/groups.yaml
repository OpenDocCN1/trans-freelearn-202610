    ## Preface


    Quantum information processing is a field of study that is a subclass of information
    processing. It exploits the laws of quantum mechanics to enable information processing
    in a manner that offers some advantages over conventional, non-quantum information
    processing. Quantum information processing has various sub-fields. These include
    quantum communication, quantum cryptography, quantum computing, and quantum error
    correction. This book provides a hands-on introduction to quantum information
    processing using the Python programming language.


    In this book, you will find step-by-step explanations of essential concepts, practical
    examples, and self-assessment questions. You will begin by exploring the introductory
    notions of quantum information, including an overview of the prerequisite mathematical
    tools. Furthermore, you will learn how to use the Python programming language
    to implement some of the quantum information processing concepts. Finally, you
    will learn how to use various Python-based quantum information processing frameworks,
    such as QuTiP, Qiskit, Cirq, Strawberry Fields, and PennyLane.


    By the end of this Hands-On Quantum Information Processing with Python book, you
    will have a deeper understanding and appreciation of the subject of quantum information
    and how various quantum information processing concepts can be implemented using
    Python.


    ## Who this book is for


    This book is for software developers, physicists, and mathematicians who are interested
    in quantum information processing. An understanding of the Python programming
    language would be beneficial. Furthermore, a basic understanding of mathematics,
    especially linear algebra, would be beneficial.


