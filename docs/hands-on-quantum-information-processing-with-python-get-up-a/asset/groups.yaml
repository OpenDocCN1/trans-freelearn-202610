    - Chapter 4, Working with Quantum Circuits

    - Chapter 5, Quantum Algorithms


    ## 理解 Bell 定理和 CHSH 不等式


    如前一节所述，Bell 定理使 EPR 悖论中使用的量子力学解释过时。这种哲学解释被称为 **局域实在论**。这里的 *实在论* 认为物体即使未被观测/测量也存在。例如，月亮无论你是否看着它都存在。另一方面，*局域*
    在 *局域实在论* 中认为一个点的事件不能瞬间对另一个点产生影响。这种解释也被称为量子力学的 **隐变量** 解释。


    为了应对隐变量论证，Bell 提出了一个思想实验来检验该解释的有效性。该思想实验后来由物理学家 David Bohm 重新表述，他使用了电子等量子力学系统的自旋性质。


    考虑两个量子变量，各自具有自旋角动量。现在，考虑随机变量 \(A_\alpha^1\) 和 \(A_\alpha^2\) 为沿轴 \(\alpha = x,
