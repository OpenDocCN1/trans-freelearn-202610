    # Post-quantum cryptography


    Post-quantum cryptography is concerned with the development of cryptographic algorithms
    that are believed to be resistant to code breaking by quantum computers. Currently,
    most modern cryptography algorithms are known to be vulnerable to attacks using
    quantum computers.


    Post-quantum cryptography makes use of the some of the mathematical concepts in
    order to design cryptographic systems that appear to be difficult to break, even
    for a cryptanalyst with access to a powerful quantum computer. Like modern cryptography
    systems discussed earlier, post-quantum cryptography systems provide computational
    security instead of the information-theoretic security provided by quantum cryptography.


    Post-quantum cryptography can be implemented using any of the following approaches/classes:


    +   - Lattice-based cryptography, which can be used to develop digital signatures
    and key exchange cryptographic schemes

    +   - Multivariate quadratic equations cryptography, which is typically used to
    develop digital signature cryptographic schemes

    +   - Hash-based cryptography, which is typically used to develop digital signatures

    +   - Code-based cryptography, which is typically used to develop key exchange
    cryptographic schemes

    +   - Supersingular elliptic curve isogeny cryptography, which can be used to
    develop encryption schemes


    Now that we have provided a brief introduction to post-quantum cryptography, the
    next subsections will cover some of the post-quantum cryptographic technics. In
    the next subsection, we will explore a lattice-based key exchange technique called
    the **NewHope key exchange scheme**.


    # The NewHope key exchange scheme


    One of the best examples of post-quantum cryptographic tools is the NewHope key
    exchange scheme. This scheme uses the lattice-based approach. As a lattice-based
    approach, the NewHope cryptographic technique offers resistance to all known quantum
    algorithms. Furthermore, the NewHope key exchange technique is one of the fastest
    and, hence, most efficient lattice-based techniques.'
