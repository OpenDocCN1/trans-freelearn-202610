    \ In this section, our focus will be on quantum networking, which is also referred\
    \ to as the quantum internet.\n\nThe key objective of the quantum internet is\
    \ to enable the transfer of the quantum state from the source to the destination,\
    \ through the use of various intermediary nodes, which are entangled. These intermediary\
    \ nodes are called **quantum repeaters**. Quantum repeaters are central to the\
    \ proper operation of the quantum internet.\n\nAt a very basic level, the quantum\
