    ## 9

    Continuous-Variable Quantum Information Processing


    Quantum systems can have either a discrete-variable or continuous-variable spectrum.


    In this chapter, we begin by introducing the continuous-variable quantum information
    processing (QIP) field. Furthermore, we will also cover the key concepts and ideas
    in continuous-variable QIP.


    We will cover the following topics in this chapter:


    - Introducing continuous-variable quantum information processing

    - Understanding the theory of continuous-variable quantum systems

    - Exploring continuous-variable quantum teleportation

    - Continuous-variable quantum key distribution

    - Understanding continuous-variable quantum machine learning


    At the end of this chapter, you should be able to do the following:


    - Differentiate between discrete-variable QIP and continuous-variable QIP.

    - Understand key ideas and concepts in continuous-variable QIP.


    In the next section, we will cover the necessary technical requirements that will
    make it possible for you to follow this chapter.


    ## Technical requirements


    The requirements for this chapter are the following:


    - A basic understanding of the Python programming language

    - Navigation of Google''s Colab environment


    The GitHub link for this chapter can be found here:


    ```

    https://github.com/PacktPublishing/Hands-On-Quantum-Information-Processing-with-Python/tree/master/Chapter09

    ```


    The next section provides an introduction to continuous-variable QIP.


    ## Introducing continuous-variable quantum information processing


    So far, we have only focused on QIP using qubits. As we stated earlier in this
    book, a qubit can exist in a two-dimensional (finite) Hilbert space (refer to
    Chapter 2, Quantum States, Operations, and Measurements, for further details on
    qubits). This implies that QIP using qubits is an example of a discrete-variable
    QIP.


    Another approach to QIP involves the use of quantum systems that exist in infinite-dimensional
    Hilbert space. That is, unlike the discrete-variable QIP – where information is
    in discrete quantum systems such as qubits, in continuous-variable QIP Hilbert
    space (and hence quantum states with a continuous basis).


    Let''s recall that for quantum systems in two-dimensional Hilbert space, the unit
    of quantum information is the qubit. On the other hand, the unit of information
    for a continuous-variable quantum system is the qumode.


    ## Exploring continuous-variable quantum teleportation


    We shall recall that quantum teleportation is used to transfer/transport an arbitrary
    quantum state (either a qubit or qumode) from Alice to Bob, who are separated
    by an arbitrary distance. Earlier in this book (Chapter 3, Entanglement and Quantum
    Teleportation), we discussed quantum teleportation in the context of discrete-variable
    QIP.


    In this section, we will discuss quantum teleportation using the continuous-variable
    QIP framework. Let''s recall that quantum teleportation requires the use of entangled
    quantum states and the classical channel. The entanglement required is possible
    in the discrete-variable QIP framework, but not practical in continuous-variable
    QIP.


    In the continuous-variable QIP setting, quantum teleportation is realized through
    the following procedure, depicted by the circuit:


    ![](img/2508606813a9204c61e8132ec0695cc1_220_0.png)


    Figure 9.1 – A circuit diagram for the implementation of continuous-variable quantum
    teleportation


    The preceding circuit can be summarized by the series of steps, and these steps
    are stated as follows:


    - 1. First, the objective is to transmit the arbitrary qumode |ψ> using two qumodes
    |ψ>ₚ and |ψ>ₓ for Alice and Bob respectively.

    - 2. After initializing Alice''s and Bob''s qumodes, these qumodes are then maximally
    entangled using a beam-splitter. This is labeled as BS1 in Figure 9.1.

    - 3. The next step after entangling the two qumodes to the maximum degree from
    Alice to Bob is to separate Alice and Bob by an arbitrary distance. However, just
    as in the case of discrete-variable quantum teleportation, Alice and Bob are still
    able to communicate using the classical channel. This step is then followed by
    the actual teleportation of an arbitrary qumode state from Alice to Bob. In order
    to do this, Alice entangles the part of an entangled pair to the maximum degree
    on her side with the arbitrary state to be teleported. This is also done through
    the use of the beam-splitter (labeled BS2 in Figure 9.1). Once this is done, Alice
    then performs a measurement on her side.


    ```

