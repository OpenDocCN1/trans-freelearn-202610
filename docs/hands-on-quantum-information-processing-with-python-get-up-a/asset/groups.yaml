    # Understanding the Bell theorem and CHSH inequality


    As already stated in the previous section, Bell''s theorem renders the quantum
    mechanical interpretation used in the EPR paradox obsolete. This philosophical
    interpretation is known as **local realism**. The *realism* in this case posits
    that objects exist even when they are not observed/measured. For instance, the
    moon does exist regardless of whether you are looking at it. On the other hand,
    *local* in *local realism* posits that an event at one point cannot instantaneously
    have an effect at another point. This interpretation is also known as **the hidden
    variables** interpretation of quantum mechanics.


    In order to address the hidden variables argument, Bell came up with a thought
    experiment that would test the validity of this interpretation. This thought experiment
    was later reformulated by the physicist David Bohm, who used the spin properties
    of quantum mechanical systems such as electrons.


    Consider two quantum variables, each with a spin angular momentum. Now, consider
    the random variables $A^{1\alpha}$ $A^{2\alpha}$ to be the outcomes of the spin
    measurements made along the axes $\alpha = x, y,$ and $z,$ and taking the values
    -1 or 1. Then, if the correlations from these measurements are not quantum mechanical
    (there is no quantum entanglement), and if the aforementioned random variables
    are anti-correlated, then for probability $p$ (as predicted by the hidden variables
    interpretation), we have the following:


    $$p(A_x^1 \neq A_y^2) + p(A_y^1 \neq A_z^2) + p(A_z^1 \neq A_x^2) \geq 1$$


    The inequality in the given equation is known as the **Bell theorem**, or **Bell''s
    inequality**. Any quantum mechanical correlation, quantum entanglement, violates
    Bell''s inequality.


    Bell''s inequality was later generalized by Clauser, Horne, Shimony, and Holt,
    in what would later be known as the **CHSH inequality**. The CHSH inequality is
    briefly summarized as follows.


    Consider two quantum particles, Alice and Bob, and the detector measurement settings
    $a$ and $a^1$ for Alice, and $b$ and $b^1$ for Bob. Then, for expectation values
    $\langle A(\alpha)B(\beta)\rangle$ corresponding to Alice measuring in either
    measurement setting $a$ or $a^1$, and Bob measuring in measurement setting $b$
    or $b^1$, then we have the following inequality:


    $$\langle A(a)B(b)\rangle + \langle A(a^1)B(b^1)\rangle + \langle A(a^1)B(b)\rangle
    - \langle A(a)B(b^1)\rangle \geq 2\sqrt{2}$$


    The inequality shown in the equation is known as the CHSH inequality. Just like
    with Bell''s inequality, quantum mechanics also violates CHSH inequality.'
