  我们还讨论了离散变量 QIP 与连续变量 QIP 之间的区别。此外，我们介绍了量子比特的概念，它类似于传统计算机使用的传统比特（二进制数字）。


  此外，我们讨论了使用 Python 编程语言进行 QIP 的好处。此外，我们讨论了在本地机器和基于云的 Google Colab 环境中安装 Python 编程语言和
  Python 包。我们还讨论了如何使用 `pipenv` 工具进行包管理。


