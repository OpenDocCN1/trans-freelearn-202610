  \ 对其 EPR 对部分执行的操作。此外，下一个门集用于解码。然后，最后，Alice 和 Bob 对其量子比特执行测量。\n\n最后，使用 qiskit 平台，实现超密编码的\
  \ Python 代码如下。在此代码中，传输的量子比特为 '11'：\n\n+   1. 第一步涉及导入实现超密编码所需的模块：\n\n```\n#Import\
  \ modules\nfrom qiskit import *\nfrom qiskit.visualization import plot_histogram\n\
  import matplotlib.pyplot as plt\nimport numpy as np\n\nnp.random.seed(42)\n```\n\
  \n+   2. 下一步是创建贝尔态，并且该纠缠态由 Alice 和 Bob 共享：\n\n```\ndef create_bell_pair(qc, a, b):\n\
  \    q.h(a)\n    qc.cx(a,b)\n```\n\n+   3. 随后是 Alice 对要发送给 Bob 的经典比特进行编码，以及 Bob\
  \ 对此类比特进行解码：\n\n```\ndef encode_message(qc, qubit, msg):\n    if msg == \"00\":\n\
  \        pass\n    elif msg == \"10\":\n        qc.x(qubit)\n    elif msg == \"\
  01\":\n        qc.z(qubit)\n    elif msg == \"11\":\n        qc.z(qubit)\n     \
  \   qc.x(qubit)\n\ndef decode_message(qc,a, b):\n    qc.cx(a,b)\n    qc.h(a)\n```\n\
  \n4. 下一步是定义用于实现超密编码的量子电路：\n\n```\nqc = QuantumCircuit(2)\n\ncreate_bell_pair(qc,\
  \ 0, 1)\nqc.barrier()\n\nmessage = \"11\"\nencode_message(qc, 0, message)\nqc.barrier()\n\
  \ndecode_message(qc, 0, 1)\n\nqc.measure_all()\n\nqc.draw(output = \"mpl\")\n#plt.show()\n\
  ```\n\n5. 然后使用 IBM 的 'qasm_simulator' 对超密编码电路进行模拟，并显示获得的结果：\n\n```\nbackend = Aer.get_backend('qasm_simulator')\n\
  job_sim = execute(qc, backend, shots=1024)\nsim_result = job_sim.result()\n\nmeasurement_result\
  \ = sim_result.get_counts(qc)\nprint(measurement_result)\nplot_histogram(measurement_result)\n\
  plt.show()\n```\n\n现在，让我简要介绍一下代码：\n\n+   1. 首先，如同总是那样，导入所有所需模块。\n+   2. 然后，创建用于创建贝尔态的函数。\n\
  +   3. 随后是定义要发送的经典消息编码的函数。\n+   4. 此外，还创建了解码发送的经典消息的电路。\n\nDeutsch 算法用于确定未知二元函数\
  \ f(x) 是 **常数** 还是 **平衡** 的。在说明什么是常数或平衡函数之前，让我们稍微退一步，讨论二元函数。二元函数是一个函数，它以一个比特作为输入并给出一个比特作为输出。因此，一元二元函数\
  \ f(x) 如下所示：\n\nf(x): {0,1} → {0,1}\n\n存在四种可能的二元函数，如下表所示：\n\n| 输入 | f₁ | f₂ | f₃\
  \ | f₄ |\n|---|---|---|---|---|\n| 0 | 0 | 0 | 1 | 1 |\n| 1 | 0 | 1 | 0 | 1 |\n\n\
  图 5.1 – 函数 f(x) 的四种可能的二元函数\n\n正如您从图 5.1 中看到的那样，第一个函数，函数 f1，无论输入如何都给出 0 的输出。另一方面，函数\
  \ f2 给出的输出与输入相同。此外，函数 f3 给出输入的逆。最后，函数 f4 的输出无论输入如何都是 1。\n\n前表中函数 f1 和 f4 被称为 **常数**\
  \ 二元函数，而函数 f2 和 f3 被称为 **平衡** 二元函数。本质上，常数二元函数无论输入如何都给出相同的输出（0 或 1）。因此，对于常数二元函数，输出不依赖于输入。另一方面，平衡二元函数产生相等数量的\
  \ 0 或 1。也就是说，对于平衡二元函数，输出取决于输入。\n\n常数和平衡二元函数的另一种解释如下。二元函数 f 是常数，如果适用以下条件：\n\nf(0)\
  \ ⊕ f(1) = 0\n\n另一方面，二元函数 f 是平衡的，如果适用以下条件：\n\nf(0) ⊕ f(1) = 1\n\n现在我们已经简要解释了平衡和常数函数，让我们进一步探究\
  \ Deutsch 算法。如前所述，该算法的目的是评估给定函数是常数函数还是平衡函数。此评估是通过查询“黑箱”（即预言机）完成的。\n\n\n\n\n多伊奇问题可以这样表述。假设你有一个预言机，它会对你发送的任何查询给出响应。在这种情况下，假设预言机的响应要么是0，要么是1。现在，假设你想确定一个给定的二元函数是常函数还是平衡函数。那么，为了令人信服地确定这一点，你应该向预言机发送多少次查询？\n\
  \n在提出多伊奇问题后，现在让我们看看经典计算机完成此任务需要多少次函数求值。为了解决这个问题，我们将使用前面给出的表格。现在考虑这样一个场景：如果你发送0作为输入，得到的输出是0，你能判断该函数是常函数还是平衡函数吗？显然不能，因为函数f₁和f₂在输入为0时输出都为0，而我们已经知道函数f₁是常函数，函数f₂是平衡函数。为了令人信服地做出这一判断，我们需要第二次函数求值。\n\
  \n从前面的场景可以看出，对于经典计算机，一次函数求值不足以确定函数是常函数还是平衡函数。这个确定至少需要两次函数求值。现在的问题是，使用量子计算机是否能更好地完成这种求值。幸运的是，这个问题的答案是肯定的，并且构成了多伊奇算法的基础。\n\
  \n为了实现多伊奇算法，关键步骤是实现酉算子F，使得该算子作用于输入|x⟩和|y⟩的结果如下：\n\nF(|x⟩ ⊗ |y⟩) = |x⟩ ⊗ |y ⊕ f(x)⟩\n\
  \n在图形上，这个酉门（F）可以表示如下：\n\n![](img/2508606813a9204c61e8132ec0695cc1_118_0.png)\n\n\
  图5.2 – 酉门（F）\n\n既然我们已经提供了可用于多伊奇算法的酉变换，那么探索可用于实现该算法的完整电路就很重要。该电路的图示如下：\n\n![](img/2508606813a9204c61e8132ec0695cc1_118_1.png)\n\
  \n图5.3 – 实现多伊奇算法的完整电路\n\n从前面的图可以看出，量子位首先被初始化为|0⟩态。因此，前述系统的第一个状态如下：\n\n|ψ₀⟩ = |0⟩\
  \ ⊗ |0⟩\n\n然后，通过翻转第二个量子位来演化这个状态。这是通过将X门应用于第二个量子位来实现的。系统的新状态变为：\n\n|ψ₁⟩ = |0⟩ ⊗ |1⟩\n\
  \n这一步之后，对每个量子位应用哈达玛门，结果如下：\n\n|ψ₂⟩ = H|0⟩ ⊗ H|1⟩\n\n这也可以表示如下：\n\n|ψ₂⟩ = 1/2 (|00⟩\
  \ − |01⟩ + |10⟩ − |11⟩)\n\n现在，下一步是将酉变换F应用于前述状态。这会产生以下状态：\n\n|ψ₃⟩ = 1/2 (|0⟩ ⊗ |f(0)⟩\
  \ − |0⟩ ⊗ |1 ⊕ f(0)⟩ + |1⟩ ⊗ |f(1)⟩ − |1⟩ ⊗ |1 ⊕ f(1)⟩)\n\n现在我们必须考虑两种情况。第一种情况是所评估的函数是常函数。正如我们已经看到的，这意味着f(0)\
  \ = f(1)。因此，前述状态将简化为：\n\n|ψ₃⟩ = 1/2 [(|0⟩ + |1⟩) ⊗ (|f(0)⟩ − |1 ⊕ f(0)⟩)]\n\n多伊奇算法的下一步涉及将哈达玛门应用于前述状态的第一个量子位。结果如下：\n\
  \n|ψ₄⟩ = 1/√2 [|0⟩ ⊗ (|f(0)⟩ − |1 ⊕ f(0)⟩)]\n\n最后，对第一个量子位进行测量，得到比特0。这与函数是常函数的事实一致，因为我们现在知道对于常函数，以下等式成立：\n\
  \nf(0) ⊕ f(1) = 0\n\n当f(0) = 1时，我们得到：\n\n|f(0)⟩ − |1 ⊕ f(0)⟩ = |1⟩ − |0⟩\n\n于是可以观察到：\n\
  \n|f(0)⟩ − |1 ⊕ f(0)⟩ = (−1)^{f(0)}(|0⟩ − |1⟩)\n\n同样的分析也适用于函数f(1)。请参考本章末尾的测验来完成这个练习。\n\
  \n现在，有了这种直觉，我们可以将应用酉变换F后的状态表示为：\n\n|ψ₃⟩ = 1/2 [|0⟩ ⊗ (−1)^{f(0)}(|0⟩ − |1⟩) + |1⟩\
  \ ⊗ (−1)^{f(1)}(|0⟩ − |1⟩)]\n\n这可以简化为：\n\n|ψ₃⟩ = 1/2 [(−1)^{f(0)}|0⟩ + (−1)^{f(1)}|1⟩]\
  \ ⊗ [|0⟩ − |1⟩]\n\n下一步是对第一个量子位应用哈达玛门。结果如下：\n\n|ψ₄⟩ = 1/2 [((−1)^{f(0)} + (−1)^{f(1)})|0⟩\
  \ + ((−1)^{f(0)} − (−1)^{f(1)})|1⟩] ⊗ (|0⟩ − |1⟩)\n\n最后，对第一个量子位进行测量。到现在应该很清楚，如果函数是常函数，则测量到的状态将为0；而如果函数是平衡函数，则测量到的状态将为1。\n\
  \n在概述了多伊奇算法之后，现在是时候探索如何实现该算法了。\n\n**注意**\n\n此代码取自 https://github.com/quantumlib/Cirq/blob/master/examples/deutsch.py。\n\
  \n此代码的链接可以在这里找到：https://github.com/PacktPublishing/Hands-On-Quantum-Information-Processing-with-Python/tree/master/Chapter05。\n\
  \n使用Cirq实现多伊奇算法的Python代码如下：\n\n1. 第一步是引入必要的模块：\n\n```python\nimport random\nimport\
  \ numpy as np\nimport cirq\nfrom cirq import H, X, CNOT, measure\n```\n\n2. 导入必要的模块后，下一步是为该算法选择要使用的量子位：\n\
  \n```python\nq0, q1 = cirq.LineQubit.range(2)\nsecret_function = [random.randint(0,1)\
  \ for _ in range(2)]\n```\n\n3. 定义用于实现预言机电路和完整多伊奇算法的函数：\n\n```python\ndef make_oracle(a,\
  \ b, c):\n    if c[0]:\n        yield [CNOT(a, b), X(b)]\n    if c[1]:\n       \
  \ yield CNOT(a, b)\n\ndef make_deutsch_circuit(d, e, f):\n    c = cirq.Circuit()\n\
  \    c.append([X(e), H(e), H(d)])\n    c.append(f)\n    c.append([H(d), measure(d,\
  \ key='result')])\n    return c\n\noracle = make_oracle(q0, q1, secret_function)\n\
  circuit = make_deutsch_circuit(q0, q1, oracle)\nprint(circuit)\n```\n\n4. 最后，模拟用于实现多伊奇算法的量子电路：\n\
  \n```python\nsimulator = cirq.Simulator()\nresult = simulator.run(circuit)\nprint(result)\n\
  ```\n\n用于实现多伊奇-约萨算法的电路如下所示：\n\n![](img/2508606813a9204c61e8132ec0695cc1_124_0.png)\n\
  \n图5.5 – 用于实现多伊奇-约萨算法的电路\n\n电路的上半部分显示了一个包含n个量子位的寄存器，而下半部分显示了一个包含单个量子位的寄存器。\n\n与多伊奇-约萨算法一样，量子位被初始化为|0⟩态。因此，系统的状态如下：\n\
  \n|ψ₀⟩ = |0⟩ ⊗ ⋯ ⊗ |0⟩\n\n然后，下一步涉及翻转最后一个量子位（即底部寄存器中的量子位），系统的最终状态如下：\n\n|ψ₁⟩ = |0⟩\
  \ ⊗ ⋯ ⊗ |1⟩\n\n现在，对处于|0⟩态的n个量子位中的每一个应用哈达玛门，并对最后一个量子位（现在处于|1⟩态）应用另一个哈达玛门。系统的最终状态如下：\n\
  \n|ψ₂⟩ = (H ⊗ ⋯ ⊗ H)(|0⟩ ⊗ ⋯ ⊗ |0⟩) ⊗ H(|1⟩)\n\n以下等式成立：\n\n(H ⊗ ⋯ ⊗ H)(|0⟩ ⊗ ⋯ ⊗\
  \ |0⟩) = 1/√(2ⁿ) Σ_{x=0}^{2ⁿ−1} |x⟩\n\n不难看出，化简后，前述状态可以表示如下：\n\n|ψ₂⟩ = 1/√(2ⁿ) Σ_{x=0}^{2ⁿ−1}\
  \ |x⟩ [1/√2 (|0⟩ − |1⟩)]\n\n4. 然后定义并绘制平衡预言机：\n\n```python\nbalanced_oracle = QuantumCircuit(n+1)\n\
  b_str = \"101\"\n\nfor qubit in range(len(b_str)):\n    if b_str[qubit] == '1':\n\
  \        balanced_oracle.x(qubit)\n\nbalanced_oracle.barrier()\n\nfor qubit in range(n):\n\
  \    balanced_oracle.cx(qubit, n)\n\nbalanced_oracle.barrier()\n\nfor qubit in range(len(b_str)):\n\
  \    if b_str[qubit] == '1':\n        balanced_oracle.x(qubit)\n\nbalanced_oracle.draw()\n\
  ```\n\n5. 构建预言机之后，下一步是构建可用于实现多伊奇-约萨算法的完整量子电路：\n\n```python\ndj_circuit = QuantumCircuit(n+1,\
  \ n)\n\nfor qubit in range(n):\n    dj_circuit.h(qubit)\n\ndj_circuit.x(n)\ndj_circuit.h(n)\n\
  \ndj_circuit += balanced_oracle\n\nfor qubit in range(n):\n    dj_circuit.h(qubit)\n\
  ```\n\n\n\n\n```\ndj_circuit.barrier()\n\nfor i in range(n):\n    dj_circuit.measure(i,\
  \ i)\n\ndj_circuit.draw()\n```\n\n6. 最后，使用 `qasm_simulator` 模拟 Deutsch-Josza 算法的量子电路：\n\
  \n```\nbackend = BasicAer.get_backend('qasm_simulator')\nshots = 1024\nresults =\
  \ execute(dj_circuit,\n                  backend=backend,\n                  shots=shots).result()\n\
  answer = results.get_counts()\nplot_histogram(answer)\n```\n\n模拟量子电路的输出如下所示：\n\n\
  ![](img/2508606813a9204c61e8132ec0695cc1_128_0.png)\n\n图5.6 – Deutsch-Josza 三量子比特算法的输出\n\
  \n上述代码可以总结如下。与往常一样，第一步是导入实现 Deutsch-Jozsa 算法时要用到的模块。该代码针对一个三量子比特函数实现了 Deutsch-Jozsa\
  \ 算法。代码的下一步是构造常值 oracle，然后是构造平衡 oracle。接下来是实际实现 Deutsch-Jozsa 算法。最后，使用 `qasm_simulator`\
  \ 对该算法进行模拟。值得注意的是，`qasm_simulator` 是一个本地模拟器，用于在经典计算机上模拟量子电路，而不是在真正的量子计算机上运行此类电路。\n\
  \n既然我们已经介绍了 Deutsch-Jozsa 算法，下一步是探索另一种本质上可以看作是 Deutsch-Jozsa 算法扩展的算法。该算法被称为 **Bernstein-Vazirani\
  \ 算法**。\n\n## 探索 Bernstein-Vazirani 算法\n\nBernstein-Vazirani 算法在某种意义上与前面讨论过的 *Deutsch-Jozsa\
  \ 算法* 相似。因此，oracle 仍然使用以下函数：\n\n$$f(x): \\{0,1\\}^n \\to \\{0,1\\}$$\n\n另一方面，与 Deutsch-Jozsa\
  \ 算法旨在确定给定函数是**常数**还是**平衡**不同，Bernstein-Vazirani 算法的目标是找到秘密字符串 $s$：\n\n$$s: s \\\
  in \\{0,1\\}^n$$\n\n在给定以下承诺的情况下：\n\n$$f(x)=\\left(\\sum_{i=1}^{n}s_i x_i\\right)\\\
  operatorname{mod}2$$\n\nBernstein-Vazirani 算法的工作原理如下。首先，两个寄存器——一个是由 $n$ 个量子比特组成的输入寄存器，另一个是单个量子比特的输出寄存器——被初始化为状态\
  \ $|0\\rangle$。因此，系统的状态如下所示：\n\n$$\\psi_0\\rangle = 0 \\otimes \\cdots \\otimes\
  \ 0\\rangle \\otimes 0\\rangle$$\n\n然后，第二个寄存器中的量子比特被翻转，系统的新状态如下：\n\n$\\psi_1\\rangle\
  \ = 0 \\otimes \\cdots \\otimes 0\\rangle \\otimes 1\\rangle$\n\n算法的下一步是对两个寄存器中的每个量子比特应用\
  \ Hadamard 门。然后，我们得到以下状态：\n\n$\\psi_2\\rangle = \\frac{1}{\\sqrt{2^n}} \\sum_{x=1}^{n}\
  \ x\\rangle \\otimes \\left(\\frac{1}{\\sqrt{2}}[0\\rangle - 0\\rangle]\\right)$\n\
  \n接下来是查询 oracle，然后对输入寄存器中的每个量子比特应用 Hadamard 门。最后，对输入寄存器进行测量，以检索秘密字符串。\n\n> 注意\n\
  > 本代码摘自 https://github.com/qiskit-community/qiskit-community-tutorials/blob/master/Coding_With_Qiskit/ep6_Bernstein-Vazirani_Algorithm.ipynb。\n\
  > 此代码的链接可以在这里找到：https://github.com/PacktPublishing/Hands-On-Quantum-Information-Processing-with-Python/tree/master/Chapter05。\n\
  \n使用 Qiskit，实现 Bernstein-Vazirani 算法的 Python 代码如下所示：\n\n- 1. 第一步是引入实现 Bernstein-Vazirani\
  \ 算法所需的模块：\n\n```\nimport numpy as np\nfrom qiskit import *\nfrom qiskit.visualization\
  \ import plot_histogram\n\nnp.random.seed(42)\n\ns = input(\"Enter the secret bit\
  \ string:\\n\")\n\nn = len(s)\n```\n\n2. 接下来是构建量子电路，该电路将用于构造 Bernstein-Vazirani\
  \ 算法：\n\n```\ncircuit = QuantumCircuit(n+1,n)\n```\n\n由于所有量子比特都初始化为状态 |0>，步骤0涉及通过应用\
  \ X 门来翻转这些量子比特：\n\n```\ncircuit.x(n)\n```\n\n```\ncircuit.barrier()\n```\n\n3. 下一步是对所有量子比特应用\
  \ Hadamard 门：\n\n```\ncircuit.h(range(n+1))\n```\n\n```\ncircuit.barrier()\n```\n\
  \n4. 下一步是在量子比特上应用受控门：\n\n```\nfor ii, yesno in enumerate(reversed(s)):\n```\n\n\
  ```\n    if yesno == '1':\n```\n\n```\n        circuit.cx(ii, n)\n```\n\n```\ncircuit.barrier()\n\
  ```\n\n5. 下一步涉及对量子比特应用 Hadamard 门，然后对这些量子比特进行测量：\n\n```\ncircuit.h(range(n+1))\n\
  ```\n\n```\ncircuit.barrier()\n```\n\n```\ncircuit.measure(range(n), range(n))\n\
  ```\n\n```\n%matplotlib inline\n```\n\n```\ncircuit.draw(output='mpl')\n```\n\n\
  - 6. 最后，使用 qasm_simulator 模拟 Bernstein-Vazirani 算法的操作：\n\n```\nsimulator = Aer.get_backend('qasm_simulator')\n\
  result = execute(circuit, backend=simulator,\n    shots=1024).result()\nplot_histogram(result.get_counts(circuit))\n\
  ```\n\n上述代码包含四个关键阶段。第一阶段初始化两个寄存器中的量子比特。然后，对两个寄存器中的所有量子比特应用 Hadamard 门。此外，第三阶段涉及实现由\
  \ CNOT 门组成的 oracle。最后，最后一个阶段测量输入寄存器中的所有量子比特。\n\nBernstein-Vazirani 算法（使用输入比特字符串\
  \ 100）的输出如下所示：\n\n![](img/2508606813a9204c61e8132ec0695cc1_132_0.png)\n\n图5.7 –\
  \ 输入比特字符串为 100 时 Bernstein-Vazirani 算法的输出\n\n到目前为止，我们已经在本章中介绍了三个量子算法。在本节中，我们学习了\
  \ Bernstein-Vazirani 算法，并了解了如何使用这种算法来找到秘密比特字符串。在下一节中，我们将介绍另外两种技术，它们将在本章稍后讨论的量子算法中发挥关键作用。这两种技术是量子傅里叶变换（QFT）和量子相位估计。\n\
  \n## 介绍量子傅里叶变换和量子相位估计\n\n如前所述，本节要讨论的量子技术将在本章稍后讨论的量子算法中发挥关键作用。因此，有必要在本节中介绍以下技术：\n\
  \n- QFT\n- 量子相位估计\n\n首先，让我们介绍并探索 QFT。\n\n### 量子傅里叶变换（QFT）\n\n已经发现，QFT 在量子计算机上的计算速度比在经典计算机上更快。QFT\
  \ 是离散傅里叶变换的量子模拟。我们将回顾一个离散傅里叶变换，该变换将输入向量\n\n$$x = \\sum_{i=0}^{N-1} x_i$$\n\n映射到输出向量\n\
  \n$$y_k = \\frac{1}{\\sqrt{N}} \\sum_{j=0}^{N-1} x_j w_N^{jk};$$\n\n其中\n\n$$w_N^{jk}\
  \ = e^{2\\pi i \\frac{jk}{N}}$$\n\n如前所述，QFT 是前面讨论的离散傅里叶变换的量子模拟。因此，QFT 将输入量子系统 |x>\
  \ 变换为输出量子系统 |y>，使得以下成立：\n\n$$|x\\rangle \\rightarrow \\frac{1}{\\sqrt{N}} \\sum_{y=0}^{N-1}\
  \ W_N^{xy} |y\\rangle$$\n\n2. 现在，我们构建用于实现量子相位估计技术的量子电路。这个量子电路随后将用于执行两个、四个和八个量子比特的量子相位估计：\n\
  \n```\ndef run_estimate(unknown_gate, qnum, repetitions):\n    ancilla = cirq.LineQu-1)\n\
  \    qubits = cirq.LineQubit.rangem)\n\n    oracle_raised_to_power= [\n        unknown_gate.on(ancilla).controlled_by\\\
  \n        (qubits[i])**i\n        for i in range(qnum)\n    ]\n    circuit = cirq.Circuit(cirq.H.on_each(*qubits),\n\
  \                           oracle_raised_to_power,\n                          \
  \ cirq.QFT(*qubits,\n                                   without_reverse=True)**-1,\n\
  \                           cirq.measure(*qubits,\n                            \
  \            key='phase'))\n    return cirq.sample(circuit, repetitions=repetitions)\n\
  \ndef experiment(qnum, repetitions):\n    def example_gate(phi):\n        gate =\
  \ cirq.MatrixGate(\n            matrix=np.array([\n                [np.exp(2 * np.pi\
  \ * 1.0j * phi), 0],\n                [0, 1]]))\n        return gate\n```\n\n3.\
  \ 下一步是使用均方根（RMS）误差作为指标来测试量子相位估计的准确性。RMS 越低，估计越好：\n\n```\nprint(f'Testing with {qnum}\
  \ qubits.')\nerrors = []\nfor target in np.arange(0, 1, 0.1):\n    result = run_estimate(example_gate(target),\n\
  \                          qnum, repetitions)\n```\n\n\n\nmode = result.data['phase'].mode()[0]\n\
  guess = mode / 2**qnum\nprint(f'target={target:0.4f}, '\nf'estimate={guess:0.4f}={mode}/{2**qnum}')\n\
  errors.append((target - guess)**2)\nrms = np.sqrt(sum(errors) / len(errors))\nprint(f'RMS\
  \ Error: {rms:0.4f}\\n')\n\n4. 对两个、四个和八个量子比特执行量子相位估计：\n\n```\ndef main(qnums = (2,\
  \ 4, 8), repetitions=100):\n    for qnum in qnums:\n        experiment(qnum, repetitions=repetitions)\n\
  \nif __name__ == '__main__':\n    main()\n```\n\n前述代码实现了对两个、四个和八个量子比特的量子相位估计。此外，为了获得结果，相位估计电路（experiment）总共运行\
  \ 100 次重复。\n\n在本节中，我们已经介绍了两种在某些量子算法中起关键作用的量子技术。这些技术是 QFT 和量子相位估计。在下一节中，我们将介绍另一种已被证明比其经典对应方法更强大的量子算法。该算法是\
  \ Simon 算法。\n\n## 介绍 Simon 算法\n\nSimon's algorithm 建立在 Bernstein-Vazirani 算法的基础上，该算法已在本章前面讨论过。对于\
  \ Simon 算法，假设对于 n 个量子比特，我们有以下函数：\n\nf: {0,1}^n → {0,1}^n\n\n这伴随着一个承诺，即对于某个非零比特串\
  \ s，使得：\n\ns ∈ {0,1}^n\n\n并且对于所有 x、y 值，使得：\n\nx, y ∈ {0,1}^n\n\n则：\n\n```\n$$f(x)\
  \ = f(y)$$\n```\n\n当且仅当：\n\n```\n$$x \\oplus y \\in \\{0^n, s\\}$$\n```\n\nSimon's\
  \ algorithm 可以总结如下。首先，使用两个寄存器，每个寄存器有 n 个量子比特。因此，量子系统的初始状态如下所示：\n\n```\n$$|\\psi_0\\\
  rangle = |0 \\otimes \\cdots \\otimes 0\\rangle \\otimes |0 \\otimes \\cdots \\\
  otimes 0\\rangle$$\n```\n\n此步骤随后是对第一寄存器中每个量子比特应用 Hadamard 门。这导致以下量子状态：\n\n```\n\
  $$|\\psi_1\\rangle = H|0 \\otimes \\cdots \\otimes 0\\rangle \\otimes (|0 \\otimes\
  \ \\cdots \\otimes 0\\rangle)$$\n```\n\nSimon's algorithm 实现中的下一步是应用酉变换 F（oracle\
  \ 函数），使得系统的新的状态变为以下：\n\n```\n$$|\\psi_2\\rangle = \\frac{1}{\\sqrt{2^n}} \\sum_{x\
  \ \\in \\{0,1\\}^n} |x\\rangle \\otimes |f(x)\\rangle$$\n```\n\n此外，我们测量第二个寄存器。此步骤随后是对第一寄存器上的所有量子比特应用\
  \ Hadamard 门，然后测量这些量子比特。\n\n> **注意**\n> 此代码取自 https://qiskit.org/textbook/ch-algorithms/simon.html。\n\
  > \n> 此代码的链接可以在这里找到：https://github.com/PacktPublishing/Hands-On-Quantum-Information-Processing-with-Python/tree/master/Chapter05。\n\
  \n正如前面所说，Shor’s algorithm 高效地找到周期函数的周期。周期函数 f(x) 给出如下：\n\n```\nf(x) = a^x mod N\n\
  ```\n\n这里，mod 是模运算符，a 和 N 是没有共同因子的正整数（因此 a 和 N 互质），并且以下适用：\n\n```\na < N\n```\n\n\
  此外，周期 r 是使以下条件成立的最小非零整数：\n\n```\na^r mod N = 1\n```\n\nShor’s algorithm 的实现可以总结如下：\n\
  \n- 1. 首先，使用两个寄存器。\n- 第一个寄存器由 m 个量子比特组成，而第二个寄存器由 n 个量子比特组成，其中以下适用：\n\n```\nm = 2n\n\
  ```\n\n实现 Shor’s algorithm 的电路如下图所示：\n\n![](img/2508606813a9204c61e8132ec0695cc1_141_0.png)\n\
  \n图 5.9 – 实现 n 量子比特 Shor 算法的量子电路\n\nShor 算法的两个寄存器都初始化为所有量子比特的 |0> 状态。因此，初始状态如下：\n\
  \n```\nψ₀⟩ = |0⟩ₘ ⊗ |0⟩ₙ\n```\n\n- 2. 此步骤随后是对第一个寄存器中的 m 个量子比特中的每一个应用 Hadamard 门。量子系统的状态然后变为以下：\n\
  \n```\nψ₁⟩ = H|0⟩ ⊗ ⋯ ⊗ |0⟩ ⊗ |0⟩ₙ\n```\n\n3. 在对第一个寄存器中的量子比特应用 Hadamard 门之后，Shor\
  \ 算法中的下一步是应用酉变换 F，将系统的状态变换为以下：\n\n$$\\psi_2\\rangle = \\frac{1}{\\sqrt{2^m}} \\\
  sum_{x\\in\\{0,1\\}^m} |x\\rangle \\otimes |a^x \\bmod N\\rangle$$\n\n4. 此步骤随后是对顶部寄存器应用逆\
  \ QFT。这随后是对第二个寄存器中的量子比特进行测量。最后，第一寄存器中的量子比特也被测量。\n\n> **注意**\n> 此代码的链接可以在这里找到：https://github.com/PacktPublishing/Hands-On-Quantum-Information-Processing-with-Python/tree/master/Chapter05。\n\
  \n使用 Qiskit 实现 Shor 算法的 Python 代码如下所示：\n\n- 1. 第一步涉及导入实现 Shor 算法所需的模块：\n\n```\n\
  from qiskit import BasicAer\nfrom qiskit.aqua import QuantumInstance\nfrom qiskit.aqua.algorithms\
  \ import Shor\n```\n\n- 2. 下一步涉及使用 qasm_simulator 实际实现 Shor 算法并对其进行模拟：\n\n```\n\
  number = Shor(N=15, a=7)\nsimulator = BasicAer.get_backend('qasm_simulator')\nresults_dictionary\
  \ = number.run(QuantumInstance(\n                                    backend=simulator,\n\
  \                                    shots=5))\n#result = results_dictionary['number']\n\
  print(results_dictionary)\n```\n\n前述代码可以总结如下。\n\n在导入必要的模块和类之后，使用 Qiskit 的 Aqua 元素中的\
  \ Shor 类构建用于计算 Shor 算法的电路。\n\n3. 在对元素和 oracle 进行编码之后，Grover 算法实现的下一步是初始化 n 个量子比特。因此，系统状态\
  \ |s> 在此阶段将如下所示：\n\n```\n$\\psi_0\\rangle = 0 \\otimes \\cdots \\otimes 0\\rangle$\n\
  ```\n\n4. 下一步是对所有 n 个量子比特应用 Hadamard 门，使得 |s> 变为以下：\n\n```\n$\\psi_1\\rangle = H0\
  \ \\otimes \\cdots \\otimes 0\\rangle$\n```\n\n5. 此步骤随后是对状态应用 F1。下一步是应用另一个变换 F2。对于状态\
  \ |s>，该变换如下所示：\n\n```\n$F_2(s) = 2s\\langle s - I$\n```\n\n这里，I 是单位矩阵。因此，量子系统的新的状态将如下所示：\n\
  \n```\n$\\psi_2\\rangle = F_2 F_1 \\psi_1\\rangle$\n```\n\n6. 上一步重复 t 次，使得最终量子系统的状态变为以下：\n\
  \n```\n$\\psi_t\\rangle = (F_2 F_1)^t \\psi_1\\rangle$\n```\n\n7. 最后，对 n 个量子比特执行测量。\n\
  \n> 注意\n> 此代码的链接可以在这里找到：https://github.com/PacktPublishing/Hands-On-Quantum-Information-Processing-with-Python/tree/master/Chapter05。\n\
  \n使用 Qiskit 实现 Grover 算法的 Python 代码如下所示：\n\n- 1. 第一步涉及导入实现 Grover 算法所需的模块：\n\n```\n\
  from qiskit import QuantumRegister, ClassicalRegister, \\\nQuantumCircuit, execute,\
