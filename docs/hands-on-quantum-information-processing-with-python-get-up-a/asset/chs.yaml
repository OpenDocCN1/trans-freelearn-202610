  \ ANN 做了基本介绍，下一步是介绍另一种机器学习算法，即支持向量机（SVM）。\n\n## 探索 SVM\n\nSVM 适用于复杂但小型或中型的数据集。它们利用最大间隔分离器的特性来线性分离数据点。如果无法进行线性分离，则将数据点投影到更高维度，在那里可以实现线性可分性。这种将数据点投影到更高维度的操作是通过核函数完成的。\n\
