- '## 1 量子信息处理入门


  本章介绍量子信息处理（QIP）。然而，要理解 QIP，有必要重新审视 QIP 所源自的经典/传统信息处理。


  因此，本章将首先简要介绍经典信息处理，随后再简要介绍 QIP。


  经典信息处理的诞生归功于克劳德·香农（Claude Shannon），他在 20 世纪 40 年代关于信息论的思想为后来的信息革命铺平了道路。香农的思想利用经典物理学定律来实现信息处理。


  此外，传统信息处理使用**二进制数字**（**bit**）的概念作为信息单位。正如我们将在本书后面看到的，这个信息单位有其对应的量子版本，称为**量子比特（qubit）**。我们稍后会了解到，量子比特是量子信息的基本单位。我们还将了解到，量子比特是比经典比特更基本的信息单位。


  传统信息处理的另一个关键方面是香农提出的熵的概念。本质上，熵是对不确定性的一种度量。香农版本的熵可用于量化存储信息所需的资源。对于随机变量 X 和概率 p，其中事件
  i 发生的概率记为 p_i，香农熵 H(X) 如下所示：


  H(X) = H(P₁ ⋯ Pₙ) = − ∑ₓ p(x) log p(x)


  其中适用以下约定：


  lim_{x→0} x log x = 0


  本章讨论以下主题：


  - 概述 QIP

  - 理解选择 Python 进行 QIP 的理由

  - 安装 Python 和其他软件包

  - pipenv 及创建环境


  ### 概述 QIP


  QIP 领域的出现是为了应对基本物理定律对传统信息处理所施加的限制。这些限制最初由罗尔夫·兰道尔（Rolf Landauer）在 20 世纪 60 年代进行研究。兰道尔的工作后来由他的同事查尔斯·贝内特（Charles
  Bennett）在 20 世纪 70 年代加以拓展。


  最初，QIP 的重点是确定传统信息处理所受到的物理限制。然而，随着时间的推移，QIP 的范围不断扩大，以探索量子密码学、量子计算和量子通信等思想。这些思想将在本书后面讨论。


  到目前为止所讨论的 QIP 范式被称为**离散变量 QIP**。它使用离散的、有限维的复希尔伯特空间。


  另一方面，还有另一种 QIP 范式使用无限维复希尔伯特空间。这种范式被称为**连续变量 QIP**。打个比方，离散变量 QIP 可以看作*数字* QIP，而连续变量
  QIP 可以看作*模拟* QIP。


  到目前为止，本节已概述了**QIP**。在下一小节中，我们将探讨 QIP 的各个子领域。


  ### QIP 的子领域


  在介绍了 QIP 的基本原理之后，现在我们将注意力转向 QIP 的子领域。我们将首先探索量子密码学子领域。


  #### 量子密码学


  QIP 中第一个被认真研究的子领域是量子密码学。最初的量子密码学概念由*斯蒂芬·威斯纳*（Stephen Wiesner）在 20 世纪 60 年代探索。


  威斯纳的想法是利用量子力学制造基于物理定律无法伪造的钞票，并利用这些定律来实现*不经意传输*密码协议。


  斯蒂芬·威斯纳关于无法伪造钞票的想法启发了*查尔斯·贝内特*（贝内特是威斯纳的朋友）和*吉勒·布拉萨德*（Gilles Brassard）在 1984 年提出了史上第一个**量子密钥分发（QKD）**协议。该
  QKD 协议后来被称为**BB84 协议**。


  在 20 世纪 90 年代初，*阿图尔·埃克特*（Artur Ekert）基于纠缠独立提出了另一个 QKD 协议。该 QKD 协议后来被发现与 BB84 协议在数学上等价，被称为**E91
  协议**。目前，量子密码学可以说是 QIP 中最成功的子领域之一。


  下面提供几个 QKD 协议实际应用的例子。2007 年，它被用于瑞士保护选举数据的安全。此外，2010 年在南非德班，它被用于保障 2010 年足球世界杯比赛期间的通信数据安全。最后，就在最近（2020
  年），它被用于保护洲际通信的安全，通信双方分别位于中国和奥地利。


  既然我们已经介绍了量子密码学这一 QIP 的子领域，下一步就是探索 QIP 的另一个子领域，即量子计算。


  #### 量子计算


  QIP 的另一个快速发展的子领域是**量子计算**。量子计算利用**纠缠**等量子力学概念来高效解决一些传统计算机难以处理的计算问题。


  量子计算机预计将提供远超传统计算机的能力。因此，量子计算机应比其传统对应物具有*超级优势*。与偶尔使用的更具冒犯性的*量子霸权*相比，*量子超级优势*这一表述更为可取。我确实相信，量子超级优势能够充分传达量子计算能力远超传统计算机这一信息。量子超级优势在做到这一点的同时，不会像量子霸权那样听起来具有冒犯性。


  量子计算的历史始于 20 世纪 80 年代，*尤里·马宁*（Yuri Manin）在**苏维埃社会主义共和国联盟（USSR）**，以及*理查德·费曼*（Richard
  Feynman）和*保罗·贝尼奥夫*（Paul Benioff）在**美利坚合众国（USA）**提出了相关思想。这些思想后来由*大卫·多伊奇*（David Deutsch）进一步发展，他于
  1985 年提出了史上第一台通用量子计算机。


  然而，在 20 世纪 80 年代的剩余时间里，人们对量子计算的兴趣似乎正在减弱。量子计算仅被视为一个纯粹出于学术好奇心的领域，没有任何实际意义。20 世纪 90
  年代，人们对量子计算的兴趣重新燃起。这种复兴源于量子计算的两项关键突破。


  第一项突破得益于*彼得·肖尔*（Peter Shor）的量子算法，该算法可用于分解大数。肖尔算法证明了原则上量子计算机可以用来破解传统密码系统的安全性。


  另一项重要的量子计算突破是*洛夫·格罗弗*（Lov Grover）在 1996 年设计的量子搜索算法。该算法旨在在非结构化数据库中搜索元素，已被证明与当时最著名的传统算法相比可提供二次加速。这种加速意味着，如果传统算法在非结构化数据库中搜索一个元素最多需要
  *n* 步，那么格罗弗算法最多只需 *√n* 步即可完成。


  尽管量子计算有望提供相对于传统计算的量子超级优势，但功能完备的量子计算机尚未实现。实现全尺寸量子计算机的主要障碍在于，量子系统非常脆弱，要将其与环境（它们与环境相互作用）隔离开来非常困难。






  量子系统与环境的相互作用可能会导致一些需要纠正的错误。自 1990 年代以来，已经提出了大量量子纠错技术。


  目前，尚未实现完全成熟且高度可扩展的量子计算机。然而，较小的量子计算机已经开始构建。这些中小规模的量子计算机通常不使用一些复杂的纠错技术，被称为噪声中等规模量子（NISQ）计算机。NISQ
  计算机通常用于小规模量子计算，因为它们仍然不具备纠错能力。因此，NISQ 计算机主要用于展示量子计算的某些有限能力，因为它们不是全规模量子计算机。


  现在我们已经介绍了量子计算子领域，下一步是探索 QIP 的另一个子领域，即量子游戏。因此，接下来将简要讨论量子游戏的设计。


  ## 量子游戏的设计


  除了量子密码学和量子计算之外，QIP 的另一个子领域是量子游戏的设计。在传统安排中，博弈论关注冲突环境中的理性决策。量子博弈论将传统博弈论推广到量子领域。与其他
  QIP 子领域一样，量子游戏利用量子现象，尤其是纠缠，作为资源，其目标是超越其经典对应物。


  到目前为止，我们已经对 QIP 进行了简要介绍。我们介绍了量子密码学、量子计算和量子游戏的子领域。本章提供的信息将使您能够轻松跟进本书后续章节提供的信息。本书后续章节将进一步阐述本章介绍的内容。


  下一小节提供了使用 Python 进行 QIP 的理由。


  ## 理解选择 Python 用于 QIP 的理由


  本书将使用的首选编程语言是 Python。


  Python 可被认为是最受欢迎的编程语言之一。这是因为 Python 是一种非常通用、高级的编程语言，并且拥有非常活跃且强大的开发者和开源社区。


  Python 的通用性和简洁性使其成为嵌入式系统、游戏、网站开发、图形设计、数据科学、人工智能以及复杂科学和数值计算等多样化应用的首选语言。


  选择 Python 作为本书的首选语言的另一个原因是，本书后面将部署的大多数量子信息框架都基于 Python。这些 QIP 框架包括 Google 和 IBM
  等知名公司开发的框架，以及来自加拿大 Xanadu 等较少人知的 QIP 初创公司的框架（Xanadu 的官方网站为 https://www.xanadu.ai）。


