- "## 9\n连续变量量子信息处理\n\n量子系统既可以具有离散变量谱，也可以具有连续变量谱。\n\n在本章中，我们首先介绍连续变量量子信息处理（QIP）领域。此外，我们还将涵盖连续变量QIP中的关键概念和思想。\n\
  \n我们将在本章中涵盖以下主题：\n\n- 介绍连续变量量子信息处理\n- 理解连续变量量子系统的理论\n- 探索连续变量量子隐形传态\n- 连续变量量子密钥分发\n\
  - 理解连续变量量子机器学习\n\n在本章结束时，你应该能够做到以下几点：\n\n- 区分离散变量QIP和连续变量QIP。\n- 理解连续变量QIP中的关键思想和概念。\n\
  \n在下一节中，我们将介绍必要的技术要求，以便你能够学习本章。\n\n## 技术要求\n\n本章的要求如下：\n\n- 对Python编程语言有基本理解\n-\
  \ 能够使用Google的Colab环境\n\n本章的GitHub链接可以在这里找到：\n\n```\nhttps://github.com/PacktPublishing/Hands-On-Quantum-Information-Processing-with-Python/tree/master/Chapter09\n\
  ```\n\n下一节将介绍连续变量QIP。\n\n## 介绍连续变量量子信息处理\n\n到目前为止，我们只关注了使用量子比特的QIP。正如我们在本书前面所述，量子比特可以存在于二维（有限）希尔伯特空间中（关于量子比特的更多细节，请参阅第2章“量子态、操作与测量”）。这意味着使用量子比特的QIP是离散变量QIP的一个例子。\n\
  \n另一种QIP方法涉及使用存在于无限维希尔伯特空间中的量子系统。也就是说，与离散变量QIP——信息存储在量子比特等离散量子系统中——不同，连续变量QIP使用希尔伯特空间（因此量子态具有连续基）。\n\
  \n让我们回顾一下，对于二维希尔伯特空间中的量子系统，量子信息的单位是量子比特。另一方面，连续变量量子系统的信息单位是qumode。\n\n## 探索连续变量量子隐形传态\n\
  \n我们记得，量子隐形传态用于将任意量子态（无论是量子比特还是qumode）从爱丽丝传输/传送到任意距离外的鲍勃。在本书前面（第3章“纠缠与量子隐形传态”），我们在离散变量QIP的背景下讨论了量子隐形传态。\n\
  \n在本节中，我们将讨论使用连续变量QIP框架的量子隐形传态。让我们回顾一下，量子隐形传态需要使用纠缠量子态和经典信道。所需的纠缠在离散变量QIP框架中是可能的，但在连续变量QIP中并不实际。\n\
  \n在连续变量QIP设置中，量子隐形传态通过以下过程实现，如电路所示：\n\n![](img/2508606813a9204c61e8132ec0695cc1_220_0.png)\n\
  \n图9.1 – 用于实现连续变量量子隐形传态的电路图\n\n上述电路可以通过一系列步骤来总结，这些步骤如下：\n\n- 1. 首先，目标是使用分别属于爱丽丝和鲍勃的两个qumode\
  \ |ψ>ₚ和|ψ>ₓ来传输任意qumode |ψ>。\n- 2. 在初始化爱丽丝和鲍勃的qumode之后，使用分束器将这些qumode最大程度地纠缠起来。这在图9.1中标记为BS1。\n\
  - 3. 在将两个qumode从爱丽丝到鲍勃最大程度地纠缠之后，下一步是将爱丽丝和鲍勃分隔任意距离。然而，就像离散变量量子隐形传态的情况一样，爱丽丝和鲍勃仍然可以通过经典信道进行通信。这一步之后，实际的任意qumode态从爱丽丝到鲍勃的隐形传态开始。为了实现这一点，爱丽丝在她自己那一侧，将纠缠对的一部分与被传送的任意态进行最大程度的纠缠。这也是通过使用分束器（在图9.1中标记为BS2）完成的。一旦完成，爱丽丝就在她那一侧进行测量。\n\
  \n```\nplt.title('Mode 2')\nplt.show()\nfock_probs = state.all_fock_probs()\nfock_probs.shape\n\
  np.sum(fock_probs, axis=(0,1))\n```\n\n我们现在已经讨论了连续变量量子隐形传态的实现。此外，我们还探索了如何使用Strawberry\
  \ Fields框架实现连续变量量子隐形传态。下一节将涵盖连续变量量子博弈论。\n\n## 理解连续变量量子博弈论\n\n在本书前面（第6章“非局部量子博弈”），我们介绍了将传统博弈量子化为离散变量量子博弈。现在是时候介绍另一种实现量子博弈的方式了。然而，这次我们的重点将放在使用连续变量方法实现量子博弈上。因此，在本节中，我们将探索传统博弈的量子化，但这次是将它们量子化为连续变量量子博弈。\n\
  \n离散变量量子博弈方法与连续变量量子博弈方法之间的关键区别在于每种方法中使用的策略（玩家可用的策略空间）。在前一种方法中，玩家可以使用的策略数量是有限的。另一方面，在后一种方法中，玩家可以从连续统的策略中进行选择。因此，由于连续变量量子博弈中的玩家可以使用连续统的策略，这样的博弈可以使用无限维量子系统（qumode），而不是像量子比特这样的有限维系统。\n\
  \n连续变量量子博弈方法比离散变量对应方法提供了对传统博弈更现实的量子化。这是因为在现实生活环境中，许多情况可以用玩家具有连续统策略的博弈来表示。\n\n爱丽丝和鲍勃之间的连续变量QKD交换操作可以总结如下：\n\
  \n- 1. 爱丽丝首先随机选择位置和动量变量。然后她使用这些随机变量来制备相干态。\n- 2. 然后，爱丽丝通过噪声信道将制备好的相干态发送给鲍勃。\n- 3.\
  \ 在另一边，鲍勃执行零差或外差测量，随机选择位置和动量基。\n- 4. 最后，爱丽丝和鲍勃通过经典信道进行通信，以执行经典后处理。\n\n在本节中，我们提供了连续变量QKD的背景信息。在下一节中，我们将探索连续变量QIP的另一个领域，即连续变量量子机器学习。\n\
  \n## 理解连续变量量子机器学习\n\n在本节中，我们讨论量子机器学习的连续变量版本。正如我们已经了解到的，这种机器学习方法使用连续变量量子系统，而不是诸如量子比特之类的离散变量量子系统。\n\
  \n可用于实现连续变量量子机器学习的软件工具包之一是PennyLane框架。该框架同时支持离散变量量子机器学习和连续变量量子机器学习。此外，基于Python编程语言的PennyLane软件工具包还支持经典-量子混合算法，如变分算法。\n\
  \n\n\n\n\n以下代码片段展示了 Python 和 PennyLane 框架在量子变分算法设计中的使用，该算法用于寻找氢分子的基态：\n\n> Note\n\
  > 以下代码取自 www.pennylane.ai。\n> 本章的 GitHub 链接可在此处找到：\n> https://github.com/PacktPublishing/Hands-On-Quantum-Information-Processing-with-Python/tree/master/Chapter09\n\
  \n+   1. 第一步是导入必要的模块：\n\n```\n#hydrogen variational quantum eigensolver\nimport\
  \ pennylane as qml\nfrom pennylane import numpy as np\n```\n\n+   2. 下一步涉及对本算法中使用的氢分子的描述/规范：\n\
  \n```\ngeometry = 'h2.xyz'\nname ='h2'\ncharge = 0\nmultiplicity=1\nbasis= 'sto-3g'\n\
  h, nr_qubits = qml.qchem.generate_hamiltonian(\n    name,\n    geometry,\n    charge,\n\
  \    multiplicity,\n    basis,\n    mapping='jordan_wigner',\n    n_active_orbitals=2,\n\
  \    n_active_electrons=2,\n)\nprint(\"Hamiltonian is: \\n\", h)\nprint(\"Number\
  \ of qubits is: \\n\", nr_qubits)\n```\n\n3. 在指定氢分子之后，下一步是构建一个 ansatz。Ansatz 是对氢分子状态的粗略猜测。它用作量子变分算法的起点，然后从那里对氢系统进行优化，直到找到基态（最低能量态）：\n\
  \n```\ndev = qml.device('default.qubit', wires=nr_qubits)\n\ndef ansatz(params,\
  \ wires):\n    qml.BasisState(np.array([1, 1, 0, 0]), wires=wires)\n    for i in\
  \ wires:\n        qml.Rot(*params[i], wires=i)\n    qml.CNOT(wires=[2, 3])\n   \
  \ qml.CNOT(wires=[2, 0])\n    qml.CNOT(wires=[3, 1])\n\ncost_fn = qml.VQECost(ansatz,\
  \ h, dev)\n```\n\n4. 随后是量子变分算法的实现：\n\n```\nopt = qml.GradientDescentOptimizer(stepsize=0.4)\n\
  np.random.seed(42)\nparams = np.random.normal(0, np.pi, (nr_qubits, 3))\n\nprint(params)\n\
  \nmax_iterations = 250\nstep_size = 0.05\nconv_tol = 1e-06\n\nprev_energy = cost_fn(params)\n\
  for n in range(max_iterations):\n    params = opt.step(cost_fn, params)\n    energy\
  \ = cost_fn(params)\n    conv = np.abs(energy - prev_energy)\n\n    if n % 20 ==\
  \ 0:\n```\n\n```\nprint('Iteration = {:}',\n    Ground-state energy = {:.8f} Ha,\n\
  \    Convergence parameter = '{:.8f} Ha'\\\n    .format(n, energy, conv))\n\nif\
  \ conv <= conv_tol:\n    break\n\nprev_energy = energy\n```\n\n5. 最后，显示获得的结果：\n\n\
  ```\nprint()\nprint('Final convergence parameter = {:.8f} Ha'\\\n    .format(conv))\n\
  print('Final value of the ground-state energy = \\\n    {:.8f} Ha'.format(energy))\n\
  print('Accuracy with respect to the FCI energy: \\\n    {:.8f} Ha ({:.8f} kcal/mol)'.format(\n\
  \    np.abs(energy - (-1.136189454088)), \\\n    np.abs(energy - (-1.136189454088))*627.503))\n\
  print()\nprint('Final circuit parameters = \\n', params)\n```\n\n该 VQE 算法的实现始于 ansatz\
  \ 的初始化，然后对其进行训练，目标是找到氢分子的基态。最后，对 VQE 电路进行优化，优化运行 250 步。然后给出获得的结果。\n\n执行该 VQE 算法获得的结果显示在下图中：\n\
  \n```\nFinal convergence parameter = 0.00000564 Ha\nFinal value of the ground-state\
  \ energy = -1.13600250 Ha\nAccuracy with respect to the FCI energy: 0.00018695 Ha\
  \ (0.11731347 kcal/mol)\n\nFinal circuit parameters =\n[[ 1.56047353e+00 -1.04676705e-14\
  \  2.03477355e+00]\n [ 4.78473941e+00 -3.14789937e-14 -7.35562944e-01]\n [ 4.96124338e+00\
  \ -2.08614783e-01 -1.00326059e-01]\n [ 1.70450265e+00 -9.33663429e-17 -1.46313317e+00]]\n\
  ```\n\n图 9.2 – 实现 VQE 算法获得的结果\n"
- "# 10\n## 量子信息处理的当前趋势\n\n在本章中，本书的最后一章，我们将关注 **量子信息处理 (QIP)** 的当前趋势。这将涵盖 QIP 各领域的趋势。此外，我们还将探讨\
  \ QIP 各领域的未来前景。\n\n在本章结束时，你将对 QIP 的发展方向有一个大致的了解。此外，你应该能够充分欣赏 QIP 各领域的当前趋势。\n\n在本章中，我们将涵盖以下主题：\n\
  \n- 探索量子密码学的当前趋势\n- 探索量子通信的当前趋势\n- 了解量子算法设计的当前趋势\n- 探索量子机器学习的当前趋势\n- 了解量子计算硬件技术的当前趋势\n\
  - QIP 的未来前景\n\n## 探索量子密码学的当前趋势\n\n量子密码学的关键进展主要集中在 **量子密钥分发** (QKD) 上。该进展既体现在实际实现方面，也体现在\
  \ QKD 的理论安全性分析方面。在本节中，我们将重点介绍其中一些趋势。\n\nQKD 的一个重要进展在于其在现实世界问题中的应用。2007 年，QKD 用于保护瑞士日内瓦的选举。该\
  \ QKD 实现项目由日内瓦大学主导。三年后，在 2010 年南非德班足球世界杯期间，QKD 用于保护通信。该项目由夸祖鲁-纳塔尔大学牵头。\n\n这两种 QKD\
  \ 实现（2007 年日内瓦的 QKD 实现和 2010 年德班的 QKD 实现）促使网络安全社区认真考虑量子密码学的意义和可行性。然而，QKD 的研究主要局限于大学校园。\n\
  \n随着在各个大学校园成功展示了 QKD 网络，出现了需要衍生公司将 QKD 商业化的需求。领先的 QKD 衍生公司之一是来自瑞士的 ID Quantique，它是日内瓦大学的衍生公司。\n\
  \n量子密码学中另一个当前的关键兴趣领域是使用 QKD 进行远距离分离的各方之间的通信。在这方面值得注意的一个项目是由中国推动的。该项目的目标是实现地面与太空卫星之间的\
  \ QKD 通信。最终，该项目将使实现洲际 QKD 安全通信成为可能。\n\nQKD 也可以使用更高维度的离散量子系统实现。这些系统通常称为 **qudits**。很容易观察到，量子比特是二维希尔伯特空间中\
  \ qudit 的一个例子。\n\n本质上，qudit 是量子比特的推广。回想一下，在 *第 1 章，量子信息处理入门* 中，我们指出量子比特是存在于二维希尔伯特空间中的量子信息单位。另一方面，qudit\
  \ 存在于任何有限维希尔伯特空间中。这意味着量子比特是 qudit 的特例，其维度为二（因为它存在于二维希尔伯特空间中）。\n\n既然我们已经指出 QKD 也可以使用\
  \ qudit 系统而不是仅使用普通的量子比特系统来实现，那么让我们简要探讨一下为什么以及如何做到这一点。为了实现 QKD，使用更高维度的量子系统（而不是量子比特）有几个好处。这些好处包括每个量子系统的信息容量提高、密钥生成速率高、安全性提高以及对噪声的鲁棒性提高。通常，光子的轨道角动量用于实现高维\
  \ QKD。\n\n迄今为止所涵盖的量子密码学趋势关注的是 QKD 的实现方面。然而，正如前面所说，QKD 的趋势不仅限于 QKD 的实现部分，还涉及 QKD\
  \ 的理论进展。因此，有必要也讨论 QKD 理论方面的当前趋势。\n\nQKD 的安全方面关注的是在各种假设下对 QKD 协议的安全性分析。目前的方法是对 QKD\
  \ 中使用的设备做出尽可能现实的假设，然后基于此类假设评估 QKD 协议的安全性。\n\n在本节中，我们简要探讨了量子密码学的当前趋势。讨论仅限于 QKD，因为它是量子密码学中最成功和最先进的原语。在下一节中，我们将探讨量子通信的趋势。\n\
  \n## 探索量子通信的当前趋势\n\n吸引大量关注的 QIP 的另一个方面是量子通信。在本节中，我们的重点将放在量子网络上，也称为量子互联网。\n\n量子互联网的关键目标是通过使用各种纠缠的中介节点，将量子态从源传输到目的地。这些中介节点称为\
  \ **量子中继器**。量子中继器是量子互联网正常运行的核心。\n\n在非常基础的层面上，量子互联网可以被视为一个网络，它将各种潜在异构的量子网络连接成一个量子网络，以实现各种量子网络之间的通信。值得注意的是，目前没有任何量子互联网的实际实现。因此，量子互联网目前是从理论角度而不是从实现角度来研究的。\n\
  \n\n\n\n\n在简要介绍了量子互联网之后，下一节将探讨量子算法设计的当前趋势。\n\n## 理解量子算法设计的当前趋势\n\n探索量子算法的关键目标之一是设计利用量子力学优势、性能超越非量子算法的算法。目前，量子算法设计是一个活跃的研究领域。在本节中，我们将探讨量子算法设计的当前趋势。\n\
  \n量子计算算法可应用于以下领域：\n\n- **密码学**：用于开发比传统密码方案提供更好安全性的密码方案\n- **搜索与优化**：用于开发比传统优化系统更高效的量子优化系统\n\
  - **模拟量子系统**：用于更好地理解量子系统的行为\n- **求解大型线性方程组**：用于开发在性能上超越传统算法的数学算法\n\n在下一节中，我们将讨论量子机器学习的当前趋势。\n\
  \n## 探索量子机器学习的当前趋势\n\n像QIP的其他领域一样，量子机器学习在理论和实践方面也日益受到关注。在本节中，我们将首先探讨量子机器学习的理论方面，然后转向其实际应用。\n\
  \n量子机器学习的理论方面涉及设计量子机器学习算法，如量子支持向量机和量子神经网络。此外，这一方面还涉及对所设计的量子机器学习算法进行评估，以确定它们是否比经典算法具有量子优势。目前，文献中已经提出了多种量子机器学习算法。\n\
  \n在本节中，我们简要讨论了量子计算硬件技术的当前趋势。在下一节中，我们将介绍QIP的未来前景。\n\n## 探索QIP的未来前景\n\nQIP的各个领域最近都受到了关注。这些领域的未来提供了若干机遇。例如，在量子密码学方面，该技术有可能应用于安全至关重要的领域。这些领域包括彩票和银行业。\n\
  \n此外，未来QIP研究人员可能会研究除QKD之外的更多量子密码原语。同时，将更加注重实现长距离量子密码网络。这之后很可能会尝试物理实现量子互联网，用于连接各种可能异构的量子网络。\n\
  \n关于量子计算，我们期待在更强大的量子计算算法设计方面取得更多进展。我们还期待在容错量子计算设计方面取得更多进展，以取代当前使用的**嘈杂中型量子（NISQ）**计算机。此外，我们应该看到量子计算作为**第四次工业革命（4IR）**的关键驱动技术进一步主流化。\n\
  \n量子机器学习很可能会受到QIP研究人员的关注。我们很可能会看到更多量子机器学习算法来解决各种现实世界的问题。由于量子机器学习中使用的数据集可能很敏感，我预计将更加重视隐私保护量子机器学习算法的开发。\n\
  \n最后，QIP的进展有可能催生出可在传统计算机上实现的量子启发算法。\n\n## 总结\n\n恭喜你读完了这一章和这本书！我希望这本书对你有所价值。既然我们已接近本书结尾，让我简要总结本章内容，以及你在读完本书各章节后应做的事情。\n\
  \n在本章中，我们探讨和讨论了不同研究人员所追求的不同研究路径，以及与QIP领域相关的各种技术进步。此外，在本章中，我们讨论了QIP的未来前景。我们探讨了量子密码学、量子计算和量子机器学习可能的发展前景。\n\
  \n本章为本书画上了句号。我希望你喜欢读这本书！我坚信你会运用本书提供的知识，为本书所涵盖的QIP各个领域做出贡献。\n\n## 扩展阅读\n\n- Van Meter,\
