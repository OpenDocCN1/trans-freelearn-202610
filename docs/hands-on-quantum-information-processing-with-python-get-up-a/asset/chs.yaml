  \n输入节点将输入数据编码到 ANN 算法中。另一方面，除输入节点外的每个其他节点都包含两个函数：\n\n- 传递函数\n- 激活函数\n\n\n\n\n2.\
  \ 随后加载用于实现 ANN 算法的数据，然后将数据集划分为训练集和测试集。20% 的数据用于测试算法的准确性，80% 的数据用于训练模型：\n\n```\n\
