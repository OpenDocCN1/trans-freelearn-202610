- pgno: 95
  md: 'We discussed a few single-qubit quantum gates back in Chapter 2, Quantum States,
    Operations, and Measurements. One of the single-qubit quantum gates discussed
    was the Pauli X (NOT) gate. For the computational basis states |0> and |1>, the
    Truth table of the X gate is given as follows:


    | Input | Output (X Gate) |

    |---|---|

    | |0> | |1> |

    | |1> | |0> |


    Table 4.8 – A Truth table of the X gate


    On the other hand, for the same computational states |0> and |1>, and the input
    states x and y, the Truth table of a two-qubit CNOT gate (recall that CNOT is
    the entangling qubit) is given as follows:


    | Inputs | | Outputs | |

    |---|---|---|---|

    | x | y | x | X XOR y |

    | |0> | |0> | |0> | |0> |

    | |0> | |1> | |0> | |1> |

    | |1> | |0> | |1> | |1> |

    | |1> | |1> | |1> | |0> |


    Table 4.9 – A Truth table of a two-qubit CNOT gate


    It is important to note that since quantum computing is reversible, the number
    of inputs is the same as the number of outputs. This then ensures that there is
    no information that is lost during the computation. Additionally, it can be seen
    from the CNOT table in Figure 4.9 that the operation of a CNOT gate is analogous
    to the operation of the XOR classical logic gate. The key difference though is
    that in the case of quantum computing, the input x also forms part of the output,
    so there is no information lost (due to the reversibility of computation).


    We have discussed universal gates in the context of classical computing, whereby
    we established that both NOR and NAND logic gates are universal gates for classical
    computing. Analogous to classical computing, in quantum computing, the CNOT gate
    and any single-qubit gate form a set of universal quantum gates.'
