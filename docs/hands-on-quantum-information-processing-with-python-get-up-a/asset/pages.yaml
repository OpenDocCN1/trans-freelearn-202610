- pgno: 39
  md: '# Exploring vector spaces


    A **vector space** is a collection of vectors. Let V be a set of vectors on which
    two arithmetic operations of addition and scalar multiplication are defined. Then,
    for vectors x, y, z and scalars a, b, the following axioms hold for a vector space,
    V:


    +   - x + y ∈ V

    +   - x + y = y + x

    +   - x + (y + z) = (x + y) + z

    +   - V has a zero vector such that for x ∈ V, x + 0 = x

    +   - For every x ∈ V, there is a vector in V denoted by -x such that x + (-x)
    = 0

    +   - ax ∈ V

    +   - a(x + y) = ax + ay

    +   - (a + b)x = ax + bx

    +   - a(bx) = (ab)x

    +   - 1x = x


    Another feature of a vector space is the concept called the **basis**. A set of
    vectors, B, forms a basis in vector space V, if the following conditions are satisfied:


    +   - Every vector x ∈ V can be represented as a linear combination of vectors
    in B.

    +   - All the vectors in B are linearly independent.


    Finally, the field of scalars in V is either the real numbers (R) or the complex
    numbers (C). A complex number is the number z that can be written in the following
    form:


    z = a + ib


    Here, both a and b are real numbers, and


    i = √-1


    The expression ib is called the *imaginary number*. The (complex) conjugate of
    a complex number is the same complex number with the + sign replaced by the –
    sign, or vice versa. Thus, the complex conjugate of z = a + ib


    is z1 = a − ib


    while the complex conjugate of z = c − id is z1 = c + id.'
