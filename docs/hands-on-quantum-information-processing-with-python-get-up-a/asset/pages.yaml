    We have now discussed the implementation of continuous-variable quantum teleportation.
    Furthermore, we have explored how continuous-variable quantum teleportation can
    be implemented using the Strawberry Fields framework. The next section will cover
    continuous-variable quantum game theory.


    # Understanding continuous-variable quantum game theory


    Earlier in this book (Chapter 6, Non-Local Quantum Games), we covered the quantization
    of conventional games into discrete-variable quantum games. Now it is time to
    introduce yet another way of implementing quantum games. However, this time around,
    our focus will be on the implementation of quantum games using the continuous-variable
    approach. Therefore, in this section, we will explore the quantization of conventional
    games, but this time around, quantizing them into continuous-variable quantum
    games.


    The key difference between the discrete-variable approach to quantum games and
    the continuous-variable approach to quantum games lies in the strategy used in
    each approach (access to strategic space for the players). In the former approach,
    the number of strategies that the players can use is finite. On the other hand,
    in the latter approach, there is a continuum of strategies that the players can
    choose from. Therefore, since the players in the continuous-variable quantum games
    have access to a continuum of strategies, such games can use infinite-dimensional
    quantum systems (qumodes) instead of finite-dimensional systems such as qubits.


    The continuous-variable quantum games approach provides a more realistic quantization
    of the conventional games than its discrete-variable counterpart. This is due
    to the fact that in real-life settings, several cases are represented by the games
    in which players have access to a continuum of strategies.'
