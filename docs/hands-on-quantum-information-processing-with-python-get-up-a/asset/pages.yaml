- pgno: 218
  md: 'At the end of this chapter, you should be able to do the following:


    +   - Differentiate between discrete-variable QIP and continuous-variable QIP.

    +   - Understand key ideas and concepts in continuous-variable QIP.


    In the next section, we will cover the necessary technical requirements that will
    make it possible for you to follow this chapter.


    # Technical requirements


    The requirements for this chapter are the following:


    +   - A basic understanding of the Python programming language

    +   - Navigation of Google''s Colab environment


    The GitHub link for this chapter can be found here:


    ```

    https://github.com/PacktPublishing/Hands-On-Quantum-Information-Processing-with-Python/tree/master/Chapter09

    ```


    The next section provides an introduction to continuous-variable QIP.


    # Introducing continuous-variable quantum information processing


    So far, we have only focused on QIP using qubits. As we stated earlier in this
    book, a qubit can exist in a two-dimensional (finite) Hilbert space (refer to
    Chapter 2, Quantum States, Operations, and Measurements, for further details on
    qubits). This implies that QIP using qubits is an example of a discrete-variable
    QIP.


    Another approach to QIP involves the use of quantum systems that exist in infinite-dimensional
    Hilbert space. That is, unlike the discrete-variable QIP – where information is
    in discrete quantum systems such as qubits, in continuous-variable QIP Hilbert
    space (and hence quantum states with a continuous basis).


    Let''s recall that for quantum systems in two-dimensional Hilbert space, the unit
    of quantum information is the qubit. On the other hand, the unit of information
    for a continuous-variable quantum system is the qumode.'
