- pgno: 130
  md: 'Then, the qubit in the second register is flipped, with the new state of the
    system being the following:


    $\psi_1\rangle = 0 \otimes \cdots \otimes 0\rangle \otimes 1\rangle$


    The next step in the algorithm is to apply the Hadamard gate to each of the qubits
    in both registers. Then, we end up with the following state:


    $\psi_2\rangle = \frac{1}{\sqrt{2^n}} \sum_{x=1}^{n} x\rangle \otimes \left(\frac{1}{\sqrt{2}}[0\rangle
    - 0\rangle]\right)$


    This step is then followed by the querying of the oracle, and then applying the
    Hadamard gate to each of the qubits on the input register. Finally, the measurement
    is applied to the input register in order to retrieve the secret string.


    > Note

    > This code is adopted from https://github.com/qiskit-community/qiskit-community-tutorials/blob/master/Coding_With_Qiskit/ep6_Bernstein-Vazirani_Algorithm.ipynb.

    > The link for this code can be found here: https://github.com/PacktPublishing/Hands-On-Quantum-Information-Processing-with-Python/tree/master/Chapter05.


