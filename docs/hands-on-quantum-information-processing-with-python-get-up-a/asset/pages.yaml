- pgno: 211
  md: '# Data encoding


    There are various ways of encoding classical data so that it can be processed
    on a quantum computer. These data encoding techniques are discussed in brief in
    this section. They are basis encoding, amplitude encoding, and Hamiltonian encoding.


    # Basic encoding


    In basic encoding, data is encoded in the basic (computational) states of a quantum
    computer. That is, each data point is represented as the superposition of the
    basic states. This form of encoding is limited to binary data.


    # Amplitude encoding


    On the other hand, in amplitude encoding, data is encoded on the amplitudes of
    a quantum state. Unlike basis encoding, amplitude encoding is not limited to binary
    data. However, amplitude encoding is vulnerable to noise, as the information is
    encoded in the amplitude, which might vary with noise.


    # Hamiltonian encoding


    Finally, in Hamiltonian encoding, data is encoded using the Hamiltonian of the
    system. That is, in this data encoding scheme, the Hamiltonian of the system is
    associated with a Hermitian matrix that represents the data.


    We have briefly gone through some of the data encoding techniques. The next subsection
    will cover quantum SVMs.


    # Quantum SVMs


    Quantum SVMs form a class of prominent quantum machine learning algorithms. In
    essence, quantum SVMs are the quantum analogs of the conventional SVMs introduced
    in the previous section. Quantum computers can speed up learning in SVMs.'
