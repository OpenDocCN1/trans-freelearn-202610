  md: 'We will cover the following main topics in this chapter:


    +   - Introducing classical logic gates

    +   - Introducing single-qubit and multi-qubit gates

    +   - Introducing quantum circuits

    +   - Exploring quantum error correction

    +   - Exploring superdense coding


    # Technical requirements


    The requirements for this chapter are the following:


    +   - A basic understanding of the Python programming language

    +   - Navigation of Google''s Colab environment


    The GitHub link for this chapter can be found here:


    ```

    https://github.com/PacktPublishing/Hands-On-Quantum-Information-Processing-with-Python/tree/master/Chapter04

    ```


    # Introducing classical logic gates


    Let''s briefly detour from quantum computing and focus on classical computing.
    You will recall that the basic unit of information in classical computing is a
    binary digit (bit). Furthermore, you will recall that a bit can be in a state
    of either a zero (0) or one (1). Just as a bit is a basic unit of classical information,
    a logic gate is a basic unit of classical computation.


    There are two single-bit logic gates. These gates are the Identity (wire) gate
    and the NOT gate. The former leaves the input unchanged, while the latter inverts/negates
    the input. The Truth table for the single-bit identity gate is given as follows:


    | Input | Output (Identity) |

    | --- | --- |

    | 0 | 0 |

    | 1 | 1 |


    Table 4.1 – The Truth table for a single-bit identity gate'
