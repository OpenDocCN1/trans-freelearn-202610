  md: "2. Now, we construct the quantum circuit for implementing the quantum phase\
    \ estimation technique. This quantum circuit will then be used to execute the\
    \ quantum phase estimation for two, four, and eight qubits:\n\n```\ndef run_estimate(unknown_gate,\
    \ qnum, repetitions):\n    ancilla = cirq.LineQu-1)\n    qubits = cirq.LineQubit.rangem)\n\
    \n    oracle_raised_to_power= [\n        unknown_gate.on(ancilla).controlled_by\\\
    \n        (qubits[i])**i\n        for i in range(qnum)\n    ]\n    circuit = cirq.Circuit(cirq.H.on_each(*qubits),\n\
    \                           oracle_raised_to_power,\n                        \
    \   cirq.QFT(*qubits,\n                                   without_reverse=True)**-1,\n\
    \                           cirq.measure(*qubits,\n                          \
    \              key='phase'))\n    return cirq.sample(circuit, repetitions=repetitions)\n\
    \ndef experiment(qnum, repetitions):\n    def example_gate(phi):\n        gate\
    \ = cirq.MatrixGate(\n            matrix=np.array([\n                [np.exp(2\
    \ * np.pi * 1.0j * phi), 0],\n                [0, 1]]))\n        return gate\n\
    ```\n\n3. The next step is to test the accuracy of the quantum phase estimation\
    \ using the root mean square (RMS) error as the metric. The lower the RMS, the\
    \ better the estimation:\n\n```\nprint(f'Testing with {qnum} qubits.')\nerrors\
    \ = []\nfor target in np.arange(0, 1, 0.1):\n    result = run_estimate(example_gate(target),\n\
    \                          qnum, repetitions)\n```"
