- pgno: 82
  md: '# Understanding entanglement as a resource – quantum teleportation


    In quantum information processing, entanglement is a crucial resource that is
    used to provide information processing advantages over conventional information
    processing. As such, quantum entanglement is typically used in various fields
    of quantum information processing, such as quantum cryptography, quantum computing,
    and quantum communication.


    In quantum communication, quantum entanglement is used as a resource in applications
    such as **superdense coding** and **quantum teleportation**. Superdense coding
    will be covered in the next chapter (*Chapter 4, Working with Quantum Circuits*),
    while quantum teleportation is covered in this section. It is imperative to note
    that the teleportation that will be covered here is that of a quantum state, not
    the one that is normally talked about in sci-fi (science fiction) movies.


    # Quantum teleportation


    Quantum teleportation involves transmitting an arbitrary quantum state from one
    location to another, with the assistance of an entangled EPR pair. In this quantum
    communication protocol, quantum entanglement is used as a key resource. As already
    mentioned earlier, what is teleported in this protocol is a quantum state, and
    not a classical object such as a human body, as is normally depicted in popular
    culture.


    In quantum teleportation, the objective is to transfer an unknown quantum state
    from one point to another. This transfer is made possible through the use of an
    EPR pair, which is shared by Alice and Bob (remote quantum particles) and a conventional
    communication circuit. Therefore, the objective of quantum teleportation is to
    enable Alice to transmit an arbitrary quantum state to Bob. In order to achieve
    this, both Alice and Bob use classical communication to communicate.


    The procedure for a quantum teleportation circuit can be summarized by the following
    circuit. This circuit uses four unitary quantum gates, namely, the Hadamard gate,
    the X gate, the Z gate, and the CNOT gate, together with two measurement gates:


    ![](img/2508606813a9204c61e8132ec0695cc1_82_0.png)'
  merge: -1
  img_proc: true
- pgno: 83
  md: 'As can be observed from the diagram, Alice has the unknown state |ψ> and one
    half of the EPR pair that she shares with Bob. She then performs a measurement
    on the two qubits at her disposal, and sends the results of the measurement to
    Bob through a classical channel. Since she is measuring two qubit states, Alice''s
    possible measurement outcomes m₁ (from the qubit to be transmitted) and m₂ (from
    one half of the EPR pair) are 00, 01, 10, or 11.


    Based on the value of the measurement outcome received from Alice, Bob can perform
    any of the operations shown in the following table in order to reconstruct the
    state |ψ>:


    | m₁ | m₂ | Z^m₁ X^m₂ | Bob''s Operation |

    |---|---|---|---|

    | 0 | 0 | I | I |

    | 0 | 1 | X | X |

    | 1 | 0 | Z | Z |

    | 1 | 1 | ZX | ZX |


    Figure 3.4 – Table showing operations that can be performed by Bob based on the
    value of measurement outcome received from Alice


    Using IBM''s Qiskit platform and Google''s Colab environment, the following Python
    code can be used to implement quantum teleportation:


    ```

    #!pip install qiskit

    from qiskit import *

    from qiskit.visualization import plot_histogram


    circuit = QuantumCircuit(3,3)


    circuit.h(0)


    circuit.h(1)

    circuit.cx(1,2)


    circuit.cx(0,1)

    circuit.h(0)


    circuit.measure([0, 1], [0, 1])


    circuit.cx(1, 2)

    circuit.cz(0, 2)

    ```'
