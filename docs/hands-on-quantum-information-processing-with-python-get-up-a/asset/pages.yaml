- pgno: 21
  md: '# 1

    Getting Started

    with Quantum

    Information

    Processing


    This chapter provides an introduction to quantum information processing (QIP).
    However, in order to understand QIP, it is important to revisit classical/conventional
    information processing, from which QIP is derived.


    Therefore, this chapter will first provide a brief introduction to classical information
    processing. This will then be followed by a brief introduction to QIP.


    The birth of classical information processing can be attributed to Claude Shannon,
    whose ideas in the 1940s on information theory paved the way for the information
    revolution that would later follow. Shannon''s ideas made use of the laws of classical
    physics in order to enable information processing.'
  merge: -1
  img_proc: true
- pgno: 22
  md: 'Furthermore, conventional information processing uses the concept of the **binary
    digit** (**bit**) as a unit of information. As we will see later in this book,
    this unit of information has its quantum counterpart, called a **quantum bit (qubit)**.
    A qubit, as we will later learn, is the basic unit of quantum information. We
    will also later learn that a qubit is a more fundamental unit of information than
    a classical bit.


    Another key aspect of conventional information processing is the notion of entropy,
    which was proposed by Shannon. In essence, entropy is a measure of uncertainty.
    Shannon''s version of entropy can be used to quantify resources that are required
    to store information. For a random variable, X, and probability p, where the probability
    of an event, i, occurring is denoted by p_i, the Shannon entropy, H(X), is given
    as follows:


    H(x) = H(P₁ ⋯ Pₙ) = − ∑ₓ p(x) log p(x)


    The following applies:


    limₓ x log x = 0


    This chapter discusses the following topics:


    +   - Providing an overview of QIP

    +   - Understanding the rationale for choosing Python for QIP

    +   - Installing Python and other packages

    +   - pipenv and creating the environment


    # Providing an overview of QIP


    The field of QIP arose in response to the limits imposed on conventional information
    processing by the fundamental laws of physics. These limits were initially investigated
    in the 1960s by Rolf Landauer. Landauer''s work was later extended by his colleague,
    Charles Bennett, in the 1970s.


    Initially, the focus of QIP was to determine the physical limits that are imposed
    on conventional information processing. However, as time progressed, the scope
    of QIP was expanded in order to explore such ideas as quantum cryptography, quantum
    computing, and quantum communication. These ideas will be discussed later in this
    book.'
  merge: -1
  img_proc: true
