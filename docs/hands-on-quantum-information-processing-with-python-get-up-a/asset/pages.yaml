- pgno: 64
  md: 'Now, taking the inner product of |ψ> and |φ>, we end up with:


    ⟨ψ|φ⟩ = (⟨ψ|φ⟩)².


    This implies that either:


    ⟨ψ|φ⟩ = 1


    or


    ⟨ψ|φ⟩ = 0.


    The preceding conditions are met only when |ψ> = |φ> or |ψ> and |φ> are orthogonal,
    respectively, and not for any arbitrary quantum state. This completes the proof
    of the quantum no-cloning theorem.


    The next section discusses quantum computing models beyond the gate model.


    # Quantum computing models – beyond the gate model


    Although it is the most prominent in quantum computing, the quantum gate model
    discussed thus far is not the only model of quantum computing. There are other
    models of quantum computing that were proven to be computationally equivalent
    to the quantum model of quantum computing, up to a polynomial factor.


    The quantum computing models to be discussed in this section include the **cluster-based
    model**, **adiabatic quantum computing model**, and **hybrid quantum computing
    model**.


    # Cluster-based quantum computing


    Cluster-based quantum computing uses entangled states, which are also known as
    cluster states, as the physical resources for quantum computation. This quantum
    computing model is universal for quantum computation. Cluster-based quantum computing
    is also known as **one-way quantum computing**.


    The operation of a cluster-based quantum computing model is as follows. First,
    a cluster state of a large number of entangled quantum states is prepared. This
    is then followed by the actual quantum computation. The quantum computation consists
    of a sequence of one-qubit quantum measurements on this cluster state. The sequence
    of measurements will be determined by the computing task that is being performed.
    Therefore, this model of quantum computing uses measurement as a tool to perform
    quantum computing.'
