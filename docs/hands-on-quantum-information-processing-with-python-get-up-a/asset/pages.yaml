- pgno: 231
  md: '# 10

    Current Trends

    in Quantum

    Information

    Processing


    In this chapter, which concludes this book, we will focus on the current trends
    in **quantum information processing (QIP)**. This will cover trends in various
    fields of QIP. Furthermore, we will explore the future prospects of various fields
    of QIP.


    At the end of this chapter, you will have a rough picture of the direction that
    QIP is taking. Furthermore, you should be in a position to fully appreciate the
    current trends in various fields of QIP.


    In this chapter, we will cover the following topics:


    +   - Exploring current trends in quantum cryptography

    +   - Exploring current trends in quantum communication

    +   - Understanding current trends in quantum algorithm design'
  merge: -1
  img_proc: true
- pgno: 232
  md: '+   - Exploring current trends in quantum machine learning

    +   - Understanding current trends in quantum computing hardware technologies

    +   - Future prospects of QIP


    # Exploring current trends in quantum cryptography


    The key progress in quantum cryptography is mainly in **quantum key distribution**
    (QKD). This progress is both on the practical implementation side and in the theoretical
    security analysis of QKD. In this section, we will highlight some of these trends.


    One of the serious advances of QKD is in its application to real-world problems.
    In 2007, QKD was used to secure elections in Geneva, Switzerland. This QKD implementation
    project was led by the University of Geneva. Three years later, QKD was used to
    secure communications in Durban, South Africa, during the soccer World Cup. This
    project was spearheaded by the University of KwaZulu-Natal.


    These two implementations of QKD (the 2007 Geneva implementation of QKD and the
    2010 Durban implementation of QKD) propelled the cybersecurity community to seriously
    consider the significance and viability of quantum cryptography. However, the
    research in QKD was mainly limited to university campuses.


    With the successful demonstration of QKD networks across various university campuses,
    the need arose for spin-off companies to commercialize QKD. One of the leading
    QKD spin-off companies is ID Quantique from Switzerland, which is a spin-off company
    from the University of Geneva.


    Another current key area of interest in quantum cryptography is the use of QKD
    for communication between parties separated by long distances. One project of
    note in this respect is one pursued by China. The objective of this project is
    to enable QKD communication between the ground and satellites in space. Ultimately,
    the project would make it possible to have secure inter-continental communication
    that implements QKD.


    QKD can also be implemented using higher-dimensional discrete quantum systems.
    These systems are generally called **qudits**. It should be easy to observe that
    a qubit is an example of a qudit in two-dimensional Hilbert space.


    In essence, a qudit is a generalization of a qubit. Recall that in *Chapter 1,
    Getting Started with Quantum Information Processing*, we stated that a qubit is
    a unit of quantum information that exists in two-dimensional Hilbert space. On
    the other hand, a qudit exists in any finite-dimensional Hilbert space. This means
    that a qubit is a special case of a qudit, with a dimension of two (since it exists
    in two-dimensional Hilbert space).'
  merge: -1
  img_proc: true
- pgno: 233
  md: 'Having stated that QKD can also be implemented using qudit systems instead
    of just the normal qubit systems, let''s now briefly explore why and how this
    can be done. The use of higher-dimensional quantum systems (as opposed to qubits)
    in order to implement QKD has a few benefits. These benefits include improved
    information capacity per quantum system, a high key generation rate, improved
    security, and improved robustness against noise. Typically, a photon''s orbital
    angular momentum is used for the implementation of higher-dimensional QKD.


    The quantum cryptography trends covered thus far are concerned with the implementation
    aspect of QKD. However, as already stated, the trends in QKD are not only limited
    to the implementation part of QKD but also involve the theoretical advances in
    QKD. Therefore, it is important to also discuss the current trends in the theoretical
    aspects of QKD.


    The security aspect of QKD is concerned with the analysis of the security of the
    QKD protocols under various assumptions. The current approach is to make assumptions
    about the devices to be used in QKD to be as realistic as possible, and then assess
    the security of the QKD protocols based on such assumptions.


    In this section, we have briefly explored the current trends in quantum cryptography.
    The discussion was limited to QKD since it is the most successful and advanced
    primitive of quantum cryptography. In the next section, we will explore the trends
    in quantum communication.


    # Exploring current trends in quantum communication


    Another aspect of QIP that is attracting a lot of attention is quantum communication.
    In this section, our focus will be on quantum networking, which is also referred
    to as the quantum internet.


    The key objective of the quantum internet is to enable the transfer of the quantum
    state from the source to the destination, through the use of various intermediary
    nodes, which are entangled. These intermediary nodes are called **quantum repeaters**.
    Quantum repeaters are central to the proper operation of the quantum internet.


    At a very basic level, the quantum internet can be thought of as a network that
    connects various potentially heterogeneous quantum networks into one quantum network,
    to enable communication among various quantum networks. It is worth noting that
    currently, there is no practical implementation of any quantum internet. Thus,
    the quantum internet is currently approached from a theoretical perspective, not
    from an implementation perspective.'
  merge: -1
  img_proc: true
- pgno: 234
  md: 'Now that we have provided a brief exposition of the quantum internet in this
    section, the next section will explore the current trends in quantum algorithm
    design.


    # Understanding current trends in quantum algorithm design


    One of the key objectives of exploring quantum algorithms is to design algorithms
    that make use of quantum mechanics to outperform their non-quantum counterparts.
    Currently, quantum algorithm design is an active area of research. In this section,
    we will explore the current trends in quantum algorithm design.


    Quantum computing algorithms can be implemented in the following fields:


    +   - **Cryptography**: For developing cryptographic schemes that provide better
    security than their conventional counterparts

    +   - **Search and optimization**: For developing quantum optimization systems
    that are more efficient than their conventional counterparts

    +   - **Simulating quantum systems**: For better understanding the behavior of
    quantum systems

    +   - **Solving large systems of linear equations**: For developing mathematical
    algorithms for systems that outweigh their conventional counterparts in terms
    of performance


    In the next section, we will discuss the current trends in quantum machine learning.


    # Exploring current trends in quantum machine learning


    Like other fields of QIP, quantum machine learning is also gaining traction, both
    in the theoretical and the practical aspects of it. In this section, we will first
    explore the theoretical aspects of quantum machine learning and then move on to
    its practical aspects.


    The theoretical aspect of quantum machine learning concerns the design of quantum
    machine learning algorithms such as quantum support vector machines and quantum
    neural networks. Furthermore, this aspect involves the assessment of the designed
    quantum machine learning algorithms in order to ascertain whether they offer a
    quantum advantage over their classical counterparts. Currently, a variety of quantum
    machine learning algorithms have been proposed in the literature.'
