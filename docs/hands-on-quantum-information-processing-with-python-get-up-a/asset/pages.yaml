- pgno: 188
  md: 'The preceding code snippet shows how a five-qubit QRNG can be implemented using
    Python and qiskit. The five qubits are, by default, initialized to the quantum
    state, |0>. So, what we did was to apply the Hadamard gate in odd-numbered qubits
    while applying the X gate followed by the Hadamard gate for all the even-numbered
    qubits. The next step is then to apply the measurement to each of the five qubits.
    Finally, ''qasm_simulator'' was used to simulate the results.


    Now that we have covered the first quantum cryptography primitive, it is time
    to shift our focus to another primitive, namely, the key exchange primitive. This
    key exchange primitive in quantum settings is known as quantum key distribution.


    # Quantum key distribution


    **Quantum Key Distribution (QKD)** is the key distribution scheme that employs
    quantum mechanical concepts in order to enable sharing of the cryptographic key
    between the legitimate communicating parties, Alice and Bob. The use of quantum
    mechanics ensures that the presence of an eavesdropper, Eve, could be revealed
    to Alice and Bob.


    QKD uses two communication channels, namely, the quantum channel and the classical
    channel. The quantum channel is used for quantum communication, while the classical
    channel is used for classical post-processing. The following diagram shows the
    schematic diagram of a typical QKD scheme:


    ![](img/2508606813a9204c61e8132ec0695cc1_188_0.png)


    Figure 7.2 – A schematic diagram of a typical QKD scheme


    Typically, a QKD protocol should address some or all of the following issues:
    security, feasibility, and communication distance.


    QKD protocols, which will be discussed later in this chapter, can be broadly divided
    into two categories, namely:


    +   - *Prepare-and-measure QKD protocols.* The BB84 discussed earlier is an example
    of this category.

    +   - *Entanglement-based QKD protocols.* The E91 protocol is an example of this
    category.'
  merge: -1
  img_proc: true
- pgno: 189
  md: 'A typical QKD protocol is implemented through the phases summarized in the
    following diagram:


    ![](img/2508606813a9204c61e8132ec0695cc1_189_0.png)


    Figure 7.3 – A diagram of a typical QKD protocol implementation


    We have so far covered another quantum cryptographic primitive, and this primitive
    is referred to as the QKD. Having provided the background information on QKD,
    it is now time to focus on some of the QKD protocols. This will be discussed in
    the next subsection.


    # Quantum key distribution protocols


    In this subsection, we will cover some of the QKD protocols. The protocols to
    be covered in this subsection include the following:


    +   - The BB84 QKD protocol

    +   - The B92 QKD protocol'
