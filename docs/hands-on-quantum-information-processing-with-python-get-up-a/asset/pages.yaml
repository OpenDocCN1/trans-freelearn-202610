  md: "13. Finally, we calculate the probability that the qubit was flipped/garbled:\n\
    \n```\nP = lookuptable_decoding(raw_results,\n    table_results)\nprint('P =',P)\n\
    plt.show()\n```\n\nThis section provided a brief introduction to quantum error\
    \ correction. In the next section, I will cover one of the most important protocols\
    \ in quantum information processing, namely, superdense coding. Superdense coding\
    \ is used to transmit more classical bits than is possible classically, using\
    \ quantum systems.\n\n# Exploring superdense coding\n\nIn Chapter 3, Entanglement\
    \ and Quantum Teleportation, we were exposed to the quantum teleportation protocol.\
    \ Another protocol that is closely related to quantum teleportation is superdense\
    \ coding. While quantum teleportation is intended to send an unknown quantum state\
    \ from one communicating party (the sender, normally called Alice) to another\
    \ (the receiver, normally called Bob), using two classical bits in the process,\
    \ superdense coding is intended to send two classical bits from one communicating\
    \ party to another, using a single quantum state.\n\nThe operation of superdense\
    \ coding is as follows:\n\n+   1. First, an EPR pair is created, and this pair\
    \ is shared by both Alice and Bob.\n+   2. Then, depending on which bits Alice\
    \ intends to send to Bob, she applies the following operations to her qubit (part\
    \ of the EPR pair):\n\n| Bit Pair to Send | Quantum Operation |\n|---|---|\n|\
    \ 00 | I |\n| 01 | Z |\n| 10 | X |\n| 11 | ZX |\n\nTable 4.10 – A set of quantum\
    \ operations that Alice can perform based on the pair of bits she wants to communicate\
    \ to Bob\n\n+   3. On the receiving side, Bob first applies the CNOT gate, followed\
    \ by the Hadamard gate. This is, in essence, the reverse of what Alice applied\
    \ on her side.\n+   4. Finally, Bob performs a measurement in order to recover\
    \ the two classical bits that Alice sent."
