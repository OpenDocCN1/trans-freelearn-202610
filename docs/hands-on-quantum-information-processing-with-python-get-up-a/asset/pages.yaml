  md: 'and the projection operators:


    $P_1 = |0\rangle\langle 0$


    and


    $P_2 = |1\rangle\langle 1.$


    It is worth noting that in this case:


    $P_1 = P_1^\dagger$


    and


    $P_2 = P_2^\dagger.$


    Then, the probabilities of measuring 0 (denoted by $p(0)$) and 1 (denoted by $p(1)$)
    are given by:


    $p(0) = \langle\psi|P_1^\dagger P_1|\psi\rangle = \frac{1}{2}$


    and


    $p(1) = \langle\psi|P_2^\dagger P_2|\psi\rangle = \frac{1}{2}.$


    Another basic type of quantum measurement is the **positive operator valued measurement
    (POVM)**. It is more powerful and general than the projective measurement. Furthermore,
    POVM is the most widely used type of measurement in quantum information processing.


    Let {$E_m$} be a set of measurement operators that do not necessarily have to
    be projectors, such that for any {$E_m$} and a normalized quantum state $|\psi>$,
    we have the following:


    $\langle\psi|E_m|\psi\rangle \ge 0.$


    These Hermitian operators also satisfy the completeness relation:


    $\sum_m E_m = I.$'
