- pgno: 63
  md: '# The quantum no-cloning theorem


    The quantum no-cloning theorem is one of the features of quantum mechanics that
    are harnessed for quantum information processing. In order to fully appreciate
    the significance of this theorem, it is imperative to contrast the quantum mechanical
    world with the macroscopic world that we live in.


    In a macroscopic world, it is possible to make perfect copies of classical information
    such as images and text. However, this is not the case in the quantum world, thanks
    to the quantum no-cloning theorem.


    As we are dealing with the quantum no-cloning theorem, it is important to clear
    up one misconception about the theorem that some people might have. This misconception
    asserts that it is impossible to clone a quantum state. However, this claim is
    misleading, since two orthogonal quantum states can be cloned.


    On the other hand, the quantum no-cloning theorem is concerned with any unknown
    arbitrary quantum state. Additionally, what is prohibited is the perfect cloning
    of the unknown state; the imperfect cloning of a quantum state is possible.


    In essence, the quantum no-cloning theorem asserts that an unknown quantum state
    cannot be perfectly copied. That is, it is impossible to create an identical quantum
    copy of an unknown arbitrary quantum state. This theorem is made possible thanks
    to the linearity of quantum mechanics and the unitarity of quantum evolutions.


    The proof of the no-cloning theorem is as follows. Let |ψ> be a pure state to
    be cloned, and |e> be the initial state of the copy. Then, the initial state will
    be represented as follows:


    ψ⟩ ⊗ e⟩.


    Now, consider the possibility that the perfect quantum state copier exists. This
    would imply that for a unitary U:


    U(ψ⟩ ⊗ e⟩)ψ⟩ ⊗ ψ⟩.


    Therefore, for two quantum states, |ψ> and |φ>:'
