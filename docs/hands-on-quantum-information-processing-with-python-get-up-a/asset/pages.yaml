    \ the next subsection, we will explore the GHZ game.\n\n# Understanding the GHZ\
    \ game\n\nJust like the CHSH quantum game discussed previously, the **Greenberger-Horne-Zeilinger\
    \ (GHZ)** quantum game is also an example of a non-local quantum game. It is used\
