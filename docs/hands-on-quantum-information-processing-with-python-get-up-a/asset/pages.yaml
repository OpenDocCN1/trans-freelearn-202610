- pgno: 76
  md: 'Now, if |v⟩ is a product state, it means the following:


    $|v\rangle = \alpha_0\beta_0|00\rangle + \alpha_0\beta_1|01\rangle + \alpha_1\beta_0|10\rangle
    + \alpha_1\beta_1|11\rangle = \frac{1}{\sqrt{2}}(|00\rangle + |11\rangle)$


    This can only be the case if the following apply:


    $\alpha_0\beta_1 = \alpha_1\beta_0 = 0$


    and


    $\alpha_0\beta_0 = \alpha_1\beta_1 = \frac{1}{\sqrt{2}}$


    However, the two aforementioned equations cannot both be true. The implication
    of the first equation is that at least one of the probability amplitudes $\alpha_0$,
    $\alpha_1$, $\beta_0$, or $\beta_1$ is zero, while the second equation implies
    that neither of the probability amplitudes is zero. This leads to a contradiction.
    Therefore, the composite state |v⟩ cannot be decomposed to its constituent quantum
    states, |v₁⟩ and |v₂⟩. Therefore, |v⟩ is not separable and quantum states |v₁⟩
    and |v₂⟩ are said to be entangled.


    In this section, we have shown how quantum states can be entangled, instead of
    being separable states. The next section discusses how the **CNOT gate** is used
    as an entangling gate. The CNOT gate is used to entangle two quantum states.


    # Understanding the CNOT gate – the entangling gate


    In *Chapter 2, Quantum States, Operations, and Measurements*, we gave a brief
    overview of a two-qubit gate called the **controlled-NOT (CNOT) gate**. The CNOT
    gate can be used for entangling quantum states. It is also referred to as the
    entangling qubit. As an example, consider two qubits, $|w_1\rangle$ and $|w_2\rangle$,
    both in state |0⟩. Now, when we apply the Hadamard gate (the Hadamard gate was
    introduced in *Chapter 2, Quantum States, Operations, and Measurements*) to $|w_1\rangle$,
    we get the following:


    $|w_1\rangle \rightarrow H|0\rangle = \frac{1}{\sqrt{2}}[|0\rangle + |1\rangle]$'
