  md: 'Generally, depending on the kind of dataset (classical or quantum) being used
    and the computing platform/algorithm (classical or quantum) used, machine learning
    can be summarized as shown in the following figure:


    |  | Type of Algorithm |  |

    |---|---|---|

    | Type of Data | Classical | Classical | Quantum |

    | Classical | CC | CQ |

    | Quantum | QC | QQ |


    Figure 8.2 – A summary of machine learning approaches


    In the preceding diagram, the CC approach denotes the use of a classical dataset
    on classical hardware, while the QC approach denotes the use of a quantum dataset
    on a classical computer. On the other hand, the CQ approach denotes the use of
    a classical dataset on a quantum computer, while the QQ approach denotes the use
    of a quantum dataset on a quantum computer.


    Both the CQ and QQ approaches can be considered as quantum machine learning. In
    this chapter, our focus will be on the CQ approach – the use of classical datasets
    on quantum computers.


    So far, a variety of quantum machine learning algorithms have been developed.
    These include the following:


    +   - Quantum neural networks

    +   - Quantum principal component analysis

    +   - Quantum SVMs

    +   - Variational quantum machine learning algorithms such as the **variational
    quantum eigensolver (VQE)** and **quantum approximate optimization algorithm (QAOA)**


    So far, we have provided a brief introduction to quantum machine learning. We
    have also seen that in the CQ approach, a classical dataset can be used on a quantum
    computer. Next, we will discuss how classical data can be encoded so that it can
    be processed by a quantum computer.'
