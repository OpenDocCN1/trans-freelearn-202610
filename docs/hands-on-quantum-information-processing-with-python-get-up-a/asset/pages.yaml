  md: '# Unsupervised learning


    In unsupervised learning, only the training data is provided, while the target
    data is not provided. The objective, in this case, is not to use the training
    data to make the predictions. Rather, unsupervised learning learns and/or discovers
    the distribution of the input (training) data.


    Examples of unsupervised learning algorithms include the following:


    +   - Clustering

    +   - Recommendation

    +   - Dimensionality reduction

    +   - Principal component analysis

    +   - Anomaly detection


    # Reinforcement learning


    Finally, in reinforcement learning algorithms, the computer is induced to learn
    from a series of reinforcements, namely punishments or rewards. If an algorithm
    succeeds in taking a correct action, it is rewarded. However, if an algorithm
    fails in taking a correct action, it is punished.


    The notion of reward and punishment in reinforcement learning can be summarized
    as follows. A computer takes a series of steps, and these steps can either lead
    to the desired outcomes or not. If the steps lead to the desired outcome, then
    the computer is rewarded so that it knows which steps to take to arrive at the
    desired outcome. If the steps do not lead to the desired outcome, then the computer
    is punished so that it does not repeat those steps in the future.


    Examples of reinforcement learning algorithms include the following:


    +   - Q-learning

    +   - Sarsa


    As already stated, machine learning algorithms are used to enable computers to
    accurately make predictions. In order to measure the performance of such algorithms,
    various performance metrics can be used. These include the following:


    +   - Accuracy

    +   - Precision and recall'
