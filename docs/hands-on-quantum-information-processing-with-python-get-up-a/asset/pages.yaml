    Just like the Deutsch-Josza algorithm, the qubits are initialized to the |0> state.
    Thus, the state of the system is given as follows:


    ψ₀⟩ = |0⟩ ⊗ ⋯ ⊗ |0⟩


    Then, the next step involves flipping the last qubit, which is the qubit in the
    bottom register, with the resulting state of the system being the following:


    ψ₁⟩ = |0⟩ ⊗ ⋯ ⊗ |1⟩


    Now, apply the Hadamard gate on each of the n qubits in state |0>, and another
    Hadamard gate to the last qubit, which now has state |1>. The resulting state
    of the system is given as follows:


    ψ₂⟩ = H ⊗ ⋯ ⊗ H(|0⟩ ⊗ ⋯ ⊗ |0⟩) ⊗ H(|1⟩)


    The following applies:


    H ⊗ ⋯ ⊗ H |0⟩ ⊗ ⋯ ⊗ |0⟩ = 1/√(2ⁿ) Σ_{x=1}^{2ⁿ} |x⟩


    It is not difficult to see that upon simplification, the preceding state can be
    given as follows:


    ψ₂⟩ = 1/√(2ⁿ) Σ_{x=1}^{2ⁿ} |x⟩ [1/√2 (|0⟩ − |1⟩)]'
