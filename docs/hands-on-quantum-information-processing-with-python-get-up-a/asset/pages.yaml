- pgno: 236
  md: 'In this section, we have briefly discussed the current trends in quantum computing
    hardware technologies. In the next section, we will cover the future prospects
    of QIP.


    # Exploring the future prospects of QIP


    Various fields of QIP have gained traction lately. The future of these fields
    offers several opportunities. For instance, with quantum cryptography, there is
    a possibility that the technology can have applications in areas where security
    is an absolute necessity. These areas include lotteries and banking.


    Furthermore, in the future, more quantum cryptography primitives beyond QKD are
    likely to be the subject of investigation by QIP researchers. Additionally, more
    emphasis will be put on the implementation of long-distance quantum cryptography
    networks. This will likely be followed by attempts to physically implement the
    quantum internet, which will be used to connect various potentially heterogeneous
    quantum networks.


    Concerning quantum computing, we should expect more strides into the design of
    more powerful quantum computing algorithms. We should also expect more progress
    to be made with the design of fault-tolerant quantum computing that will replace
    the currently used **noisy intermediate-scale quantum (NISQ)** computers. Furthermore,
    we should see the further mainstreaming of quantum computing as a key driving
    technology of the **fourth industrial revolution (4IR)**.


    Quantum machine learning is likely to receive the attention of researchers in
    QIP. We are likely to see more quantum machine learning algorithms to address
    various real-world problems. Since the datasets that would be used in quantum
    machine learning might be sensitive, I anticipate that there will be more emphasis
    on the development of privacy-preserving quantum machine learning algorithms.


    Finally, there is a possibility that advances in QIP might lead to quantum-inspired
    algorithms that can be implemented on conventional computers.


    # Summary


    Congratulations on making it to the end of this chapter and this book! I hope
    this book was worth your while. Now that we are nearing the end of this book,
    let me provide a brief summary of this chapter, and what is expected of you now
    that you have gone through the various chapters of this book.


    In this chapter, we explored and discussed the different research paths pursued
    by various researchers and the various technological advancements related to the
    field of QIP.'
  merge: -1
  img_proc: true
