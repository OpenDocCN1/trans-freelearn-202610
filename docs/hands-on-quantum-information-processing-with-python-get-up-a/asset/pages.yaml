  md: '2. The next step is to define the quantum circuit to implement Grover''s algorithms.
    In this case, the circuit to be used includes a two-qubit quantum register and
    a two-bit classical register:


    ```

    c = ClassicalRegister(2, ''c'')

    q = QuantumRegister(2,''q'')

    qc = QuantumCircuit(q,c)

    ```


    3. Then, the quantum gates are implemented in order to realize this circuit:


    ```

    qc.h([q[0]])

    qc.h([q[1]])

    qc.x([q[0]])

    qc.x([q[1]])

    qc.cz(0,1)

    qc.x([q[0]])

    qc.x([q[1]])

    qc.h([q[0]])

    qc.h([q[1]])

    qc.z(q[0])

    qc.z(q[1])

    qc.cz(0,1)

    qc.h([q[0]])

    qc.h([q[1]])

    ```'
