- pgno: 117
  md: 'Deutsch''s algorithm is used to determine whether an unknown binary function,
    f(x), is **constant** or **balanced**. Before stating what a constant or a balanced
    function is, let''s take a slight step back, to discuss a binary function. A binary
    function is a function that takes a bit as an input and gives out a bit as an
    output. Thus, a univariate binary function, f(x), is given as follows:


    f(x): {0,1} → {0,1}


    There are four possible binary functions, which are summarized as shown in the
    following table:


    | Input | f₁ | f₂ | f₃ | f₄ |

    |---|---|---|---|---|

    | 0 | 0 | 0 | 1 | 1 |

    | 1 | 0 | 1 | 0 | 1 |


    Figure 5.1 – Four possible binary functions for function f(x)


    As you can see from Figure 5.1, the first function, function f1, gives an output
    of 0 regardless of the input. On the other hand, function f2 gives the same output
    as the input. Furthermore, function f3 gives the inverse of an input. Finally,
    the output of function f4 is 1, regardless of the input.


    Functions f1 and f4 from the preceding table are called **constant** binary functions
    while functions f2 and f3 are called **balanced** binary functions. In essence,
    constant binary functions give the same output (either 0 or 1) regardless of the
    input. Thus, for a constant binary function, the outputs do not depend on the
    input. On the other hand, a balanced binary function produces an equal number
    of 0s or 1s. That is, for a balanced binary function, the outputs depend on the
    inputs.


    An alternative explanation of constant and balanced binary functions is given
    as follows. A binary function, f, is constant if the following applies:


    f(0) ⊕ f(1) = 0


    On the other hand, a binary function, f, is balanced if the following applies:


    f(0) ⊕ f(1) = 1


    Now that we have briefly explained the balanced and constant functions, let''s
    probe Deutsch''s algorithm even further. As stated earlier, the aim of this algorithm
    is to evaluate whether a given function is a constant or balanced function. This
    evaluation is done by querying a "blackbox" (an oracle).'
  merge: -1
  img_proc: true
- pgno: 118
  md: 'Deutsch''s problem can be framed as follows. Imagine that you have an oracle
    that gives a response to any query sent to it. In this case, imagine that the
    oracle gives either a 0 or a 1 as a response. Now imagine that you want to determine
    whether a given binary function is constant or balanced. Then, how many queries
    should you send to the oracle in order to convincingly determine this?


    Having framed Deutsch''s problem, now let''s see how many function evaluations
    are required by a classical computer in order to achieve this task. To address
    this, we will use the table given earlier. Now consider this scenario. If you
    send 0 as an input, and you get an output of 0, can you tell whether the function
    is constant or balanced? Clearly not, since both functions f1 and f2 have an output
    of 0 when the input is 0, and we have seen that function f1 is constant while
    function f2 is balanced. We will need a second function evaluation in order to
    convincingly make this determination.


    We can see from the previous scenario that given a classical computer, a single
    function evaluation would not be enough to determine whether the function is constant
    or balanced. This determination would take at least two function evaluations.
    Now the question is whether this evaluation can be done better using a quantum
    computer. Fortunately for us, the answer to this question is affirmative and forms
    the basis of Deutsch''s algorithms.


    In order to realize the Deutsch algorithm, the key step is to realize the unitary
    operator F such that the application of this operator to the inputs |x> and |y>
    is given as follows:


    ```

    F(x ⊗ y⟩) = |x⟩ ⊗ |y ⊕ f(x)⟩

    ```


    Pictorially, this unitary gate (F) can be shown as follows:


    ![](img/2508606813a9204c61e8132ec0695cc1_118_0.png)


    Figure 5.2 – Unitary gate (F)


    Now that we have provided a unitary transformation that can be used for the Deutsch
    algorithm, it is important to explore the complete circuit that can be used to
    implement this algorithm. This circuit is diagrammatically given as follows:


    ![](img/2508606813a9204c61e8132ec0695cc1_118_1.png)


    Figure 5.3 – A complete circuit to implement Deutsch''s algorithm'
