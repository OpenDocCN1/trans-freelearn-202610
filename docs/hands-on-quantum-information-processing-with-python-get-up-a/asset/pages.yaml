  img_proc: true
- pgno: 40
  md: '# Understanding the properties of a vector


    Now let''s discuss the properties of a vector. At this point, it is worth noting
    that a vector can either be a row vector or a column vector. In the former, the
    elements of a vector are represented by a row, while in the latter, the elements
    of such a vector are represented by a column:


    +   - **Transpose**: One of the properties of a vector is a transpose. A transpose
    of a vector, denoted by $T$, transforms a column vector into a row vector, and
    a row vector into a column vector. Thus, for a vector $x$ with $n$ components,
    here are the two equations:


    Equation 1 can be written as follows:


    $[x_1\ \ x_2\ \ \cdots\ \ x_n]^T = \begin{bmatrix} x_1 \\ x_2 \\ \vdots \\ x_n
    \end{bmatrix}$


    Equation 2 can be written as follows:


    $\begin{bmatrix} x_1 \\ x_2 \\ \vdots \\ x_n \end{bmatrix}^T = [x_1\ \ x_2\ \
    \cdots\ \ x_n]$


    The first equation indicates that the elements of a row vector (represented by
    a row) are transformed into the column vector (represented by the column) when
    the transpose is applied to it. On the other hand, the second equation is the
    opposite of the first equation. In the second equation, the transpose is applied
    to the column vector in order to transform it into the row vector:


    +   - **Dot product**: Another property of a vector is a dot product, which is
    also called an **inner product**. For vectors $x$ and $y$, each with $n$ components
    (elements), the dot product (denoted by $\langle x,y\rangle$) is given as:


    $\langle x, y \rangle = \sum_i n i x_i y_i = x1y1 + x2y2 + \cdots + xnyn$'
