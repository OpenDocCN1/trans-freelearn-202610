    \ of a matrix $A$, denoted by $A^T$, swaps the row elements of $A$ with its column\
    \ elements. Hence, the following applies:\n+   \n+   $$[A_{m\\times n}]^T = [A_{n\\\
    times m}].$$\n+   \n+   A Python code for a matrix transpose is shown as follows,\
    \ using numpy:\n\n```\nimport numpy as np\n\nA = np.array([[1,2,3], [4,5,9], [5,2,1]])\
    \ # a 3x3 matrix.\ndet_A = np.linalg.det(A)\nnp.transpose(A)\n```\n\nThe preceding\
    \ code uses the transpose() function from numpy in order to compute the transpose\
    \ of the matrix A.\n\n+   - **Eigenvalues and Eigenvectors**: The last property\
    \ of matrices worth discussing is that of eigenvalues and eigenvectors. Let $V$\
    \ be the vector space over a field. Also, let $A$ be a matrix. Then, a scalar,\
    \ $\\lambda \\in \\mathbb{F}$, is called an eigenvalue of $A$ if there exists\
    \ a non-zero vector, $x \\in V$, such that:\n+   \n+   $$Ax = \\lambda x,$$\n\
    +   \n+   with vector $x$ being called the eigenvector of $A$.\n\nNow, let's focus\
    \ on various types of matrices. These types are discussed as follows:\n\n+   -\
    \ **Identity matrix**: One of the examples of matrices is the identity matrix,\
    \ denoted by $I$. An identity matrix has a property such that, for any matrix\
    \ $A$, multiplication by $I$ does not change $A$. That is:\n+   \n+   $$A * I\
    \ = I * A = A$$\n+   \n+   The diagonal elements of an identity matrix are $1$'s,\
    \ while the off-diagonal elements are $0$'s. Another example of a matrix is an\
    \ inverse matrix:\n\n+   - **Inverse matrix**: A matrix $A$ has an inverse matrix,\
    \ denoted by $A^{-1}$, such that:\n+   \n+   $$A * A^{-1} = A^{-1} * A = I$$\n\
    +   \n+   The inverse of a matrix $A$ exists only if the determinant of $A$ is\
    \ not $0$."
