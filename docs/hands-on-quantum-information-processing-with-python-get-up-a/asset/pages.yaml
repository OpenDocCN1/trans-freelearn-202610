- pgno: 57
  md: 'The operators Em are called the POVM elements, and the complete set { Em }
    is called the positive operator valued measurement.


    In this section, I introduced single-qubit operations. I also introduced single-qubit
    quantum gates. In the next section, I will focus on multiple qubits, instead of
    the single qubit.


    # Dealing with multiple qubits


    Recall that a qubit is a vector in a two-dimensional complex Hilbert space. Therefore,
    a quantum system with two or more qubits, say n qubits, can also be represented
    as a vector in a 2n-dimensional complex Hilbert space.


    Quantum states made up of two or more qubits are said to be composite quantum
    states. Additionally, a composite quantum state of two or more qubits is a tensor
    product of such states. Thus, if |ψ> is the composite state of n qubits, then
    we have the following:


    $|\psi\rangle = |\psi_1\rangle \otimes |\psi_2\rangle \otimes \cdots \otimes |\psi_n\rangle.$


    The preceding state |ψ> is also called the joint state of n qubits. If the joint
    state can be expressed as a tensor product of the qubits as previously, it is
    said to be **separable**.


    On the other hand, if the composite quantum state is not separable, it is said
    to be **entangled**. This section will only focus on separable composite states,
    and entanglement will be covered in the next chapter (Chapter 3, Entanglement
    and Quantum Teleportation).


    The dimension of the Hilbert space, H, of a joint state of n qubits is mathematically
    expressed as:


    $dim(H) = dim(H1) \times \cdots \times dim(Hn)$


    Since a qubit is in a two-dimensional Hilbert space, it follows then that the
    joint state of n qubits will be in 2n-dimensional Hilbert space.'
