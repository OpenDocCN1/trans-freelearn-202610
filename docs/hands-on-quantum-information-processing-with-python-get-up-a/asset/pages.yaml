- pgno: 122
  md: "The Python code for Deutsch's algorithm using cirq is given as follows:\n\n\
    1. The first step is to introduce the necessary modules:\n\n```\nimport random\n\
    import numpy as np\nimport cirq\nfrom cirq import H, X, CNOT, measure\n```\n\n\
    2. After importing the necessary modules, the next step is to choose the qubits\
    \ to use for this algorithm:\n\n```\nq0, q1 = cirq.LineQubit.range(2)\nsecret_function\
    \ = [random.randint(0,1) for _ in range(2)]\n```\n\n3. Define the functions for\
    \ realizing the oracle circuit and the complete Deutsch's algorithm:\n\n```\n\
    def make_oracle(a, b, c):\n    if c[0]:\n        yield [CNOT(a,b), X(b)]\n   \
    \ if c[1]:\n        yield CNOT(a,b)\n\ndef make_deutsch_circuit(d,e,f):\n    c\
    \ = cirq.Circuit()\n    c.append([H(e), H(e), H(d)])\n    c.append(f)\n    c.append([H(d),\
    \ measure(d, key='result')])\n    return c\n\noracle = make_oracle(q0, q1, secret_function)\n\
    circuit = make_deutsch_circuit(q0, q1, oracle)\nprint(circuit)\n```\n\n4. Finally,\
    \ simulate the quantum circuit that is used to implement Deutsch's algorithm:\n\
    \n```\nsimulator = cirq.Simulator()\nresult = simulator.run(circuit)\nprint(result)\n\
    ```"
  merge: -1
