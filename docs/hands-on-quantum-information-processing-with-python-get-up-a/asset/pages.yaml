- pgno: 190
  md: '+   - The SARG04 QKD protocol

    +   - The E91 QKD protocol


    # The BB84 protocol


    The BB84 protocol was the first QKD protocol to be invented by Bennett and Brassard.
    It uses four quantum states, which comprise any pair of conjugate states. The
    BB84 protocol functions as follows. Alice randomly chooses a quantum state and
    sends it over to Bob. On the receiving side, Bob then randomly chooses a measurement
    basis, and performs the measurement.


    Once the quantum communication is done, Alice and Bob both use a classical channel
    to compare their values. Where they used similar bases for state preparation (Alice)
    and measurement (Bob), they keep bit values corresponding to such cases. Otherwise,
    they discard the values.


    The Python code snippet for implementing the BB84 protocol is shown as follows:


    +   1. The first step involves importing the necessary modules:


    ```

    from qiskit import QuantumCircuit, execute, Aer

    from qiskit.visualization import *

    import matplotlib.pyplot as plt

    import numpy as np

    np.random.seed(42)

    ```


    +   2. The next step is to define the circuit for generating a random sequence
    of bit strings:


    ```

    circ = QuantumCircuit(1,1)

    circ.x(0)

    circ.barrier()

    circ.h(0)

    circ.barrier()

    circ.measure(0,0)

    circ.barrier()

    backend = Aer.get_backend(''qasm_simulator'')

    ```'
