  md: '# Understanding Bell states


    As we have already mentioned, the |w₂> state in the *Understanding the Bell theorem
    and CHSH inequality* section is an example of a Bell state. There are other examples
    of Bell states too (there are actually four Bell states). The Bell states are
    prepared by applying the Hadamard gate to the first input qubit, and then applying
    the CNOT gate on the result to the first qubit and the second qubit input. This
    can be summarized as follows:


    ```

    ψ₀₀⟩ = CNOT(H|0⟩, 0⟩) = 1/√2 (|00⟩ + |11⟩)

    ψ₀₁⟩ = CNOT(H|0⟩, 1⟩) = 1/√2 (|00⟩ − |11⟩)

    ψ₁₀⟩ = CNOT(H|1⟩, 0⟩) = 1/√2 (|01⟩ + |10⟩)

    ψ₁₁⟩ = CNOT(H|1⟩, 1⟩) = 1/√2 (|01⟩ − |10⟩)

    ```


    It is left as an exercise for you to prove that the equations provided are correct.


    Let''s discuss the four Bell states:


    +   - As can be seen, the first Bell state, |ψ₀₀⟩, is created when the two input
    qubits are in state |0⟩.

    +   - Furthermore, the Bell state |ψ₀₁⟩ is created when the first input qubit
    is in state |0⟩ and the second input qubit is in state |1⟩.

    +   - Additionally, the Bell state |ψ₁₀⟩ is created when the first input qubit
    is in state |1⟩ and the second input qubit is in state |1⟩.

    +   - Finally, the Bell state |ψ₁₁⟩ is created when both input qubits are in state
    |1⟩.


    The Python code for generating these Bell states using qutip is shown as follows:


    ```

    from qutip import *


    v_00 = bell_state(state="00")

    v_01 = bell_state(state="01")

    v_10 = bell_state(state="10")

    v_11 = bell_state(state="11")


    print("v_00 is:", v_00)

    print("v_01 is:", v_01)

    ```'
