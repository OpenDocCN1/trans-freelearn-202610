  \n## 提交流程\n\n在规划和准备方面的辛勤工作之后，你现在已准备好提交你的应用！前往 Salesforce Partner Community，登录并导航至\
  \ **Security Review Wizard**。你会在 Partner Community 的 **Listing** 部分的新标签页（恰如其名地命名为\
  \ **Security Review**）中看到该向导。\n\n如果你是首次提交应用进行评审，你需要将上传的包连接到一个列表，这在 **App** 标签页进行。在这里，你还将回答一些基本问题；然后，你可以启动提交。\n\
  \n以下是需要在向导中完成的必要步骤：\n\n- 1. **联系信息：** 在此指定将就更多信息或失败/通过通知联系的对象。确保你的联系选项之一是分发列表。\n\
  - 2. **合规性：** 在此部分，你将提供有关公司安全就绪情况的信息。如果你的应用与 **支付卡行业 (PCI)** 交互，信用卡信息（如果你集成信用卡网关），**健康保险可移植性和**\n\
  \n《问责法》（**HIPAA**）等，在此提供此信息。如果这些方面均不适用于您的应用，只需勾选 **N/A** 即可继续。\n\n- 3. **Questionnaire:**\
  \ 在此，您将详细介绍打包解决方案的架构以及其集成的任何第三方服务。基本上，您是在描述打包应用程序所需的通用架构环境。\n- 4. **Docs:** 在此您将上传代码扫描、误报、解决方案架构以及您准备的使用案例文档。\n\
  - 5. **Test Environments:** 在此，您将提交演示环境以及任何集成的平台外服务、客户端、移动或桌面应用程序的凭据。您需要提交打包解决方案的完全配置的代表性演示环境。\n\
  \n## 安全审查操作验证\n\n安全审查操作验证阶段是 Salesforce 安全审查流程中的关键步骤。此阶段包括检查演示组织中相关包的存在性和正确性，确保提交的版本准确，验证使用案例文档的完整性，并评估扫描和误报文档的有效性。这些方面的任何差异都可能导致审查过程延迟。一旦验证完成，您将收到一封电子邮件，确认您的应用程序已进入安全审查队列，或详细说明需要解决的任何问题：\n\
