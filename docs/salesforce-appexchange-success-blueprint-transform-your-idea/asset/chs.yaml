  ## 提升列表的可发现性


  在优化列表时，请牢记上述因素的重要性。对于关键词相关性，重点关注您的应用解决的业务问题并选择相关关键词。通过确保列表包含屏幕截图、视频和演示来增强参与度，鼓励用户互动。通过及时回复反馈、定期更新列表内容并紧跟
  Salesforce 的发布来改善列表体验。


  总之，在 AppExchange 上取得稳固的搜索排名并非一蹴而就，而是需要承诺和持续努力，不断审查和调整列表元素以符合 ML 和客户偏好。


  ## AppExchange 应用分析


  在 AppExchange 领域中导航通常意味着尝试各种角色，这证明了 AppExchange 合作伙伴所需的灵活性。在成熟的企业中，称职的 ISV 产品经理可能会承担解码应用程序使用情况和用户流程的责任。然而，如果您正在领导一家蓬勃发展的初创公司，您可能会发现“产品经理”的徽章经常别在您的创业绶带上。


  在本节中，让我们换上新的角色扮演服装。再次忘记您指定的职位头衔或您在 LinkedIn 上认可的角色；我们将化身为产品经理。如果您选择接受任务，您的使命涉及发掘功能使用的细微差别、优化
  UX 以及评估新功能的接受度。听起来要求很高？别担心——Salesforce 已通过先进的 AppExchange App Analytics 平台为您提供支持。


  作为我们的驻场产品经理，您将探索的关键领域如下：


  - **了解采用情况：** 识别应用的低使用（潜在流失风险）和过度使用（可能的合同重新谈判机会）模式

  - **跟踪使用情况：** 了解哪些功能被用户接受或被忽视，从而指导未来的开发和优先级排序

  - **优化您的应用：** 分析应用内的用户旅程，突出 UX 改进领域，并确定产生最佳结果的行为


  为了支持此处概述的领域，App Analytics 数据可以在功能级别使用，以为与团队和订阅者关于功能的对话提供信息。数据围绕 `custom_entity`
  概念展开，它代表了托管软件包中包含的组件。


  例如，如果您引入了管理新闻通讯订阅的新功能，您的开发人员可能添加了新的自定义对象、新的 Lightning 页面、新的 Lightning 组件和新的 Apex
  类。随着用户与这些组件互动，App Analytics 将捕获数据，提供宝贵的见解，可指导未来的功能增强。这种在细粒度级别分析和理解应用使用情况的能力是使用 AppExchange
  App Analytics 成功进行产品管理的基石。


  开始这段旅程，您还会发现 App Analytics 可以在产品管理之外发挥作用，以惠及组织的各个领域，例如以下内容：


  - **销售和试用**：App Analytics 可以跟踪试用使用情况，了解潜在客户测试了哪些功能，并提供量身定制的建议，以获得更优质的试用体验，从而提高交易达成率。

  - **客户成功**：使用 App Analytics 推广功能采用并最大限度地减少订阅者流失。通过提供全面的使用数据，App Analytics 让您了解用户如何使用您的解决方案，从而能够提供个性化建议以推动功能采用、识别交叉销售机会并预测流失风险。

  - **软件开发**：App Analytics 提供关键的 Apex 使用数据。通过单独或与其他来源结合使用这些数据，您可以优化代码，增强其性能和可靠性。


  在此过程中，您将享受值得信赖、安全且 Salesforce 认可的工具带来的好处，这些工具可精确洞察客户如何与您的应用程序互动。道路可能看起来充满挑战，但有了
  AppExchange App Analytics 作为您的指南针，您完全有能力掌舵您应用程序成功的航船。


  ## 启用 AppExchange 应用分析


  无论您刚刚踏上 AppExchange 之旅还是已在途中，您可以做出的最明智的举措之一就是申请 AppExchange App Analytics。“为什么这么急？”您可能会问。好吧，您的应用程序通过安全审查后越早申请，您就越快开始积累有关应用使用情况的宝贵信息。


  请记住，某些日志仅从客户的组织中收集，因此最初，您的资料库可能看起来像一张空白画布。但请记住——罗马不是一天建成的。随着时间的推移和使用的增加，画布将被各种数据填满，为您提供丰富的分析信息。


  要激活对 AppExchange App Analytics 软件包使用日志和订阅者快照的访问权限，请运行 SF CLI 命令：


  ```

  sf package update --package "Your Package Alias" --enable-app-analytics

  ```


  您可以随时通过 SF CLI 命令停用这些日志：


  ```

  sf package update --package "Your Package Alias" --no-enable-app-analytics

  ```




  你只能开启套件使用日志和订阅者快照。套件使用汇总会自动提供。


  一旦启用 App Analytics，你将拥有触手可及的丰富可操作数据。现在，这对你的应用在 AppExchange 市场上的成功来说是朝着正确方向迈出的一步！


  ## AppExchange App Analytics 中的数据类型


  在 AppExchange 领域，数据就像指南针，指引你穿越决策过程的迷宫。AppExchange App Analytics 提供了三大主要数据类型类别，揭示了你的应用程序的性能和用户交互情况，帮助你优化策略。这些数据类型包括以下内容：


  - 套件使用日志

  - 套件使用汇总

  - 订阅者快照


  让我们深入探讨每个类别。


  ### 套件使用日志


  套件使用日志为你提供了有关用户在应用程序内的行为和交互的全面数据。这些日志封装了用户与应用程序中每个打包组件交互的信息，包括每一次 UI、基于 API、基于 Lightning
  和 Apex 的操作。此外，它们还会记录对套件中组件和自定义对象的每次 **创建、读取、更新、删除** (**CRUD**) 操作。这不包括来自 scratch
  组织的事件。有了套件使用日志，你可以分析用户交互和采用率，从而就功能开发做出明智的决策。


  这些数据从日志事件发生之日起仅可保留 45 天的短暂窗口。如果组织希望归档或分析这些数据，则需要迅速行动。


  然而，读取套件使用日志数据需要特定方法。日志中的每一行都描述了用户与其中一个打包组件的交互。因此，要理解该交互，需要仔细检查每一行日志，识别被访问的打包组件、与其交互的人员以及交互的性质。


  ### 套件使用汇总


  套件使用汇总是按日历月组织的顶层指标的首选。它们为你提供了对用户访问套件以及所执行操作的了解。这些汇总捕获 UI、基于 API、基于 Lightning 和 Apex
  的操作，记录套件中组件和自定义对象的每次 CRUD 操作。然而，它们排除了来自沙盒、scratch 和试用组织的事件。


  套件使用汇总从汇总文件日志日期起可下载长达 10 年之久。这一较长的时间段确保组织能够进行纵向研究并跟踪套件使用趋势。


  这些汇总通常在次月开始时即可供合作伙伴和订阅者访问。例如，你可以在六月初获取五月的用量汇总。作为 AppExchange 合作伙伴，你可以使用拥有该套件的 LMO
  在 SOAP API 中使用 **AppAnalyticsQueryRequest** 对象请求月度使用汇总。


  ### 订阅者快照


  订阅者快照为你提供了订阅者活动的即时概览。它们提供了在 00:00 UTC 记录的组织、套件和自定义实体数据的每日快照，并可立即下载。你可以请求特定日期和时间或日期时间范围的快照，每个有效请求日期和时间将获得一个快照。


  通过检查这些快照，你可以按组织和套件识别使用趋势。这些数据使你能够了解订阅者的倾向，并做出明智的决策以改进你的套件。与套件使用日志类似，快照数据可在快照日期起
  45 天内下载。鉴于其性质，及时捕获和分析这些数据对于了解特定时刻的订阅者行为和属性至关重要。


  还有一件事。并非所有 App Analytics 数据都会在每种类型的 Salesforce 环境中收集。数据收集的具体情况会根据组织类型和状态而有很大差异，如下表所示：


  | 数据类型 | 生产环境 | 沙盒 | Scratch 组织 | 试用 |

  |-----------|------------|---------|-------------|-------|

  | 套件使用日志 | 是 | 是 | 否 | 是 |

  | 套件使用汇总 | 是 | 否 | 否 | 否 |

  | 订阅者快照 | 是 | 否 | 否 | 是 |


  表 10.1：不同组织类型的 App Analytics 数据收集


  ## 如何请求数据


  在 AppExchange App Analytics 中处理数据时，效率是关键。虽然手动数据请求可能适用于临时需求，但从长远来看可能会变得繁琐。Package
  Visualizer 是此类即时数据请求的实用工具，详情请参阅本指南第 2 章。然而，为了简化操作并确保持续获得洞察，你应考虑安排自动化查询。


  ### 安排和自动化你的查询


  自动化的核心是编写代码，按计划创建查询请求记录、监控它们、检索数据并存储你的 AppExchange App Analytics 数据以便轻松访问。例如，你可以将数据存储在
  PBO 中的自定义对象中。


  你可以使用多种自动化选项，包括以下内容：


  - 使用 REST 或 SOAP API 调用的自定义 API 集成

  - 使用 CLI 的 Salesforce DX 自动化

  - Salesforce 流程

  - Apex


  例如，你可以使用 Apex 计划作业自动检索套件使用汇总。在起步阶段，使用 Apex 在 PBO 组织中存储日志是一种足够的方法。然而，当你决定自动化套件使用日志数据的检索时，其数据量会随时间显著增加，你应考虑更可扩展的存储解决方案，例如
  Heroku 或 **亚马逊网络服务 (AWS)**。


  ### 使用 Apex 自动化日志下载


  为了简化下载日志的过程，你可以使用 Apex 创建一个自动流程。这需要你开发一个简单的解决方案，能够完成以下任务：


  - **定期发出 AppAnalyticsQueryRequest 请求：** 这可以通过实现一个可调度 Apex 类来实现。该类允许你指定这些请求应发出的时间，从而帮助自动化流程。

  - **下载日志**：这涉及执行 **HttpRequest**。这将从服务器检索日志并将其下载到你指定的位置。

  - **解析检索到的 CSV 文件**：一旦包含日志的 CSV 文件被下载，下一步就是解析它们。这涉及解释数据并将其转换为更易管理的格式。

  - **创建 PackageUsageSummary__c 记录**：解析 CSV 文件后，你将使用这些信息创建 **PackageUsageSummary__c**
  记录。然后这些记录可以存储并用于进一步分析。

  - **编写 Apex 单元测试**：在 Apex 中编写单元测试对于确保解决方案的健壮性和可靠性至关重要。这有助于你及早发现和解决问题，从而提高软件质量。


  为了帮助你启动此开发，以下 GitHub 仓库提供了上述步骤的示例：

  https://github.com/developerforce/partner-intelligence-basics。 在这里，你可以找到示例和指南，用于设置自动日志下载的
  Apex 实现。


  ### 管理数据存储和使用外部解决方案


  随着数据量的增长，将所有数据存储在你的 PBO 中可能会变得具有挑战性。在你的基础 Salesforce 设置中，不购买任何额外许可证或附加组件，你将获得 10
  GB 的数据存储空间。这听起来很多，对吧？好吧，为了说明问题，这大约允许 500 万条记录。那算很多吗？让我们想一想。仅考虑来自单个大客户的 1 年套件使用汇总日志


  可能累积到超过 100 万条记录。请记住，软件包使用日志的粒度要细得多。此外，你很可能不止有一个客户。因此，虽然 500 万听起来像是一个很大的数字，但在整体来看，它填满的速度可能比你想象的更快！


  在这种情况下，你应该考虑使用外部解决方案。例如，你可以利用 AWS 来存储和管理数据。AWS 提供了可扩展且安全的环境用于数据存储，在处理大量数据时尤其有用。


  **PI-Labapp**，也称为 **Partner Intelligence Starter Pack**，是通过 Salesforce Labs 计划提供的免费应用程序。它为
  ISV 合作伙伴提供有关用户如何与其 AppExchange 解决方案交互的使用数据。这些数据对于做出有关功能开发的明智决策和识别潜在流失风险至关重要。你可以在
  AppExchange 上找到它：https://appexchange.salesforce.com/appxListingDetail?listingId=a0N4V00000GmRaNUAV。


  要使用 PI-LabApp 应用程序，你需要一个启用了 API 的 Salesforce PBO 用户名以及现有的 AWS 账户。该应用程序包含一个用于存储日志拉取配置的
  **Log pull Config** 对象和一个用于跟踪日志拉取活动的 **Log pull Activity** 对象。


  设置 PI-LabApp 的过程涉及在你的 PBO 组织中安装软件包、向用户分配权限集以及配置日志拉取记录。设置完 Salesforce 后，你需要配置 AWS，其中包括安装堆栈并使用
  PBO 登录凭据更新密钥。


  设置完成后，你应进行手动测试以确保一切按预期工作。这涉及在 Salesforce 中手动创建日志请求记录并在 AWS 中运行步骤函数。测试成功后，你可以启用 Daily
  Log Pull 作业，该作业可自动将每日日志文件拉取到 AWS **Simple Storage Service** **(S3)** 存储桶中。


  最后，要可视化数据，你需要设置 AWS Athena。这涉及运行 Glue 爬虫以从 S3 存储桶中检测 Parquet 表、运行 Athena 查询并创建视图。


  ## 规划你的 App Analytics 查询策略


  你的查询策略的具体细节在很大程度上取决于业务的规模和范围，以及你查询的数据类型。你选择的策略必须与业务需求和目标保持一致。它应高效地为你提供所需的洞察，以便就改进用户体验、优化用户流程和增强功能采用做出数据驱动的决策。最终目标是从
  AppExchange App Analytics 中提取最大价值，而一个规划良好且自动化的查询策略是实现这一目标的关键步骤。


  ## 如果 App Analytics 不够用怎么办？


  随着业务的增长，其数据和分析需求也在不断演变。Salesforce 的 App Analytics 是所有旨在了解其应用程序性能和用户行为的 ISV 的绝佳起点。然而，总有一天，开箱即用的分析工具可能无法提供所需的粒度深度和洞察深度。


  在这种情况下，你可以设想制定自己的精细粒度产品使用分析，深入挖掘传统工具无法提供的深度。但打造定制的分析解决方案总是答案吗？


  确实，有一些知名的大型 ISV 选择创建自己的日志机制，利用外部系统。这样的举措很有雄心壮志，可以开启详细的洞察宝库。然而，它们也伴随着自身的一系列挑战：


  - **复杂性和耗时：** 打造定制的分析解决方案绝非小事。设计、开发和实施定制系统可能耗时且充满不可预见的挑战。

  - **安全审查顾虑：** Salesforce 拥有严格的安全审查协议。定制的分析解决方案需要遵守这些协议，而通过安全审查可能是一个严格的过程。

  - **数据隐私和合规：** Salesforce 强调数据隐私。ISV 需要谨慎并了解数据隐私方面的规则，尤其是在详细跟踪用户行为时。


  鉴于这些考虑，在着手开发定制解决方案之前，权衡收益与成本和潜在风险至关重要。


  如果你正在考虑定制解决方案，一个有价值的第一步是寻求外部专业知识。与 **Product Development Outsourcer (PDO)** 合作伙伴合作可以提供一个全新的视角，判断
  App Analytics 是否真的无法满足你的需求。有关与 PDO 合作的更多细节将在第 12 章中探讨。


  ## CRM Analytics


  ![](img/44ed632038957e4c80220676e84c5109_514_0.png)


  作为 ISV 合作伙伴，你常常感觉自己像是在 AppExchange 沙丘中独自穿行的贝都因人，每一堆沙子都代表着你的应用程序产生的数据堆积。说实话：原始日志对数据科学家来说可能像是隐藏的宝藏，但对我们大多数人来说，它们更像是沙漠中的海市蜃楼——绝不是我们所追求的兴奋绿洲。


  但 Salesforce 出现了，你值得信赖的向导，骑着骆驼穿越这片数据沙漠。认识你在本次旅程中的新夏尔巴人——面向 AppExchange App Analytics
  的 CRM Analytics。手握这枚指南针，你之前令人望而生畏的原始数据堆现在可以转变为可导航的小径，通向充满洞察力和可操作智能的泉源。


  CRM Analytics 不仅仅是沙漠中的一粒沙；它建立在 Salesforce 的 AI 驱动分析平台之上，是一个强大的海市蜃楼粉碎者。有了 CRM Analytics，你不仅仅看到
  AppExchange 应用使用数据的表面；你正在发掘隐藏的文物，追踪关键指标的足迹，并获得客户行为的全景视图。


  要加入这支商队，只需向星星发出信号，或者在我们这里，向 Salesforce 合作伙伴社区提交一个案例。Salesforce 以两张免费的 CRM Analytics
  许可证奖励你的主动性，就像在你的行囊中发现两个冰凉的水壶一样，方便地提供在你的 PBO 上。


  ## 了解 CRM Analytics


  CRM Analytics 是一款复杂的 BI 产品，有助于将原始数据转化为可操作的洞察。本指南不会让你成为 BI 或 CRM Analytics 专家，但它会让你一窥
  CRM Analytics 能为你作为 ISV 合作伙伴提供的功能。在深入了解流程之前，让我们先熟悉一些重要的 CRM Analytics 术语：


  - **Analytics Studio**：这是你的 CRM Analytics 控制中心，你可以在此管理和创建数据集、透镜、仪表板和数据流

  - **Dataset**：你导入 CRM Analytics 的相关数据集合，数据集可以源自 Salesforce 数据或外部文件

  - **Dataflows**：用于准备数据集的一系列转换，能够连接、过滤和增强来自多个数据集或数据流的数据

  - **CRM Analytics dashboard**：由小部件组成的数据可视化显示，小部件由透镜创建

  - **Lens**：数据集的已保存探索，提供数据的特定视图，可用于构建仪表板小部件


  ## 集成和可视化你的数据


  在收集了你的 App Analytics 数据后，下一步涉及在 CRM Analytics 中将其与你的 LMA 数据集成。这要求你在 **License Management
  Org (LMO)** 中建立一个权限集，授予 CRM Analytics 集成用户访问 LMA 数据的权限。


  ## 创建 CRM Analytics 应用


  为了高效组织并控制数据集、透镜和仪表板的共享，你应该在你的 LMO 中创建一个 CRM Analytics 应用。


  ## 将 App Analytics 数据导入 CRM Analytics


  要存储你的 App Analytics CSV 文件，你可以创建一个专用数据集。接下来，可以构建一个 CRM Analytics 数据流来连接你的 LMA 软件包与
  App Analytics 日志。


  ## 使用 CRM Analytics 可视化你的数据


  CRM Analytics 使你能够创建透镜、**key performance indicators** (**KPIs**)，和仪表板用于数据可视化。透镜提供对数据集中数据的图形化探索，并构成仪表板查询的构建块。


  ## 创建 CRM Analytics 仪表板


  可以使用你的数据集和透镜创建仪表板，提供数据的可视化表示，简化解释和理解。


