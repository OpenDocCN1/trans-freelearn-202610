  ## 创建清晰且引人注目的应用名称和标题


  应用名称和标题往往是潜在客户首先接触到的内容，因此选择清晰、易记且能反映核心功能的名字至关重要。选得好的名称和标题应准确描述应用主要功能，易于理解，并在市场中脱颖而出。此外，避免使用可能让客户困惑的行业特定术语或缩写。在最终确定名称和标题前，请与目标受众测试，确保其产生共鸣并准确传达应用价值主张。


  ## 编写引人入胜的应用描述和首张幻灯片


  引人入胜的应用描述和首张幻灯片是 AppExchange 列表的关键组成部分，它们为潜在客户提供应用功能、优势和用例的概览。撰写时应聚焦应用为客户提供的价值，突出其解决的问题和带来的好处。使用简单直白的语言，并加入与功能和目标市场相关的关键词以提升搜索可见度。还要展示真实案例，说明应用如何解决特定痛点或实现期望结果。首张幻灯片可考虑加入免门槛演示，或清晰简洁地说明你解决的问题、解决方案的价值、为什么是你以及为什么是现在。如果观众不理解你的解决方案，他们可能会立即离开。


  ## 设计引人注目的应用图片、视频和幻灯片


  图片、视频和幻灯片等视觉元素能显著提升 AppExchange 列表，为潜在客户提供更具吸引力和信息量的体验。投资高分辨率图片展示应用 UI、关键功能和优势。应尽早测试幻灯片格式和分辨率，因为
  AppExchange 对尺寸、分辨率和格式有严格要求。


  制作一段简短专业的视频，演示应用实际运行，突出其 **独特卖点 (USPs)**，并展示客户证言。确保图片、视频和幻灯片针对移动设备优化，因为许多客户会从智能手机或平板访问
  AppExchange。设计幻灯片时应聚焦解决的问题、其重要性以及为什么是现在。幻灯片不应只是功能/功能列表。如果没有人理解你解决的问题及其重要性，截图 alone
  也无济于事。


  ## 展示客户证言、评价和信任建立


  客户证言和评价在影响潜在客户决策并建立对应用的信任方面发挥重要作用。鼓励满意客户在 AppExchange 列表上留下评价，并在应用描述或其他营销材料中展示突出证言。主动联系现有客户，邀请他们在
  AppExchange 市场分享使用体验。与留下评价的客户互动，感谢反馈并解决可能存在的顾虑。在列表上突出客户成功案例，展示应用如何帮助客户实现目标。评价是决定
  AppExchange 搜索结果排序的重要因素，因此通过评价、案例研究和客户视频建立信任至关重要。


  ## AppExchange 上可信评价的重要性


  AppExchange 上的可信评价使客户能够了解哪些评价由精选 Trailblazer 撰写，从而更具影响力。它们让客户轻松识别来自社区最活跃、最有知识和最有帮助成员的反馈，更容易为其业务做出明智决策。


  在 AppExchange 列表上拥有健康的评价集合对客户成功和你作为合作伙伴的业务成功都至关重要。可信评价可以影响并可能推动对应用更大需求，而更近期的正面评价可以积极影响你在
  AppExchange 合作伙伴计划中的表现。


  ## 提升正面列表评价的顶级策略


  要积累评价，必须以公平透明的方式进行。营销与面向客户的角色如销售和客户成功之间的协作是关键，可为每个角色创建正式职责，包括成功奖励。通过设定具体目标，如目标评价数量，可将评价生成纳入正式员工考核。请记住，只有评分
  4.0 及以上的评价才应计入目标。


  不要犹豫向客户征求评价，尤其是 Trailhead Rangers、Salesforce MVP 和顶级评价者等特殊 Trailblazer 群体。如果销售或客户成功经理与客户有积极互动，可利用该机会实时共同生成评价。可请客户登录，引导其完成流程，并在
  3 分钟内完成评价。


  保持评价新鲜对影响 Partner Trailblazer Score 中的客户成功支柱很重要。确保最新评价不过时。鼓励客户发布分享对其应用的真实看法以及具体使用方式的评价，因为通用评价既无帮助也不被鼓励。


  最后，通过回复评价与评价者互动，尤其是负面评价，以解决顾虑并对正面反馈表示感谢。这表明真人正在为你的应用提供优质客户成功。遵循这些策略，你可以在 AppExchange
  列表上建立可信评价集合，使客户能够做出明智决策并提升合作伙伴计划表现。这最终将有助于你的应用在竞争激烈的 Salesforce AppExchange 生态系统中取得成功。




  ## 提供清晰的价格、支持信息并证明您的价值


  透明的价格和支持信息是有效 AppExchange 列表的重要组成部分，因为它们有助于潜在客户了解使用您的应用相关的成本和资源。在您的 AppExchange
  列表中包含详细的价格信息，说明您可能提供的任何价格层级、捆绑包或折扣。清晰地传达客户可用的支持资源，例如文档、培训材料或客户支持渠道。您的列表还应解释您为何是首选供应商，尤其是在
  AppExchange 市场上与其他应用竞争时。


  ## 通过关键词和可搜索性优化您的列表


  确保您了解人们会如何搜索您所在类别的解决方案或解决方案，并确保这些关键词在您的列表中得到体现。合作伙伴分析仪表板上的 **AppExchange 热门搜索**
  功能可以帮助您完成此任务。它显示客户在找到您的列表之前搜索了什么，有助于您确定应关注哪些关键词。在应用名称、描述和其他内容中融入相关关键词将提高搜索可见性，并帮助客户在拥挤的
  AppExchange 市场中更轻松地找到您的应用。


  通过遵循这些指南并结合提供的额外提示，您可以打造一个有效的 AppExchange 列表，展示您应用的 **独特价值主张 (UVP)**，吸引潜在客户，并最终推动销售。拥有引人注目的列表后，您的应用将在竞争激烈的
  Salesforce AppExchange 生态系统中占据有利地位以取得成功。


  ## 更新 AppExchange 列表以适应新托管包版本的重要性


  作为 Salesforce ISV 合作伙伴，保持 AppExchange 列表的最新状态对于维护客户信任并展示您应用的最新功能和改进至关重要。当您发布托管包的新版本时，必须相应地更新您的列表。在本节中，我们将讨论在发布托管包新版本时更新
  AppExchange 列表的重要性，并提供有效执行此操作的指导。


  ## 更新 AppExchange 列表的重要性


  定期使用托管包的最新版本更新 AppExchange 列表至关重要，原因有以下几点。首先，它展示了您对持续改进和客户成功的承诺，有助于建立对您解决方案的信任和信心。它还允许您展示新功能、增强功能或错误修复，确保潜在客户了解您应用的全部功能。在
  Salesforce AppExchange 生态系统中保持竞争力至关重要，而保持列表更新表明您的应用正在不断发展并领先于竞争对手。最后，最新状态的列表可以积极影响您在
  AppExchange 市场上的搜索排名，因为它可能被视为对潜在客户更相关、更有价值。


  ## 有效更新 AppExchange 列表


  在为托管包新版本更新 AppExchange 列表时，首先确保您的列表显示正确的版本号和发布日期。接下来，修改您的应用描述和功能列表，以反映托管包最新版本中引入的任何新功能、增强功能或错误修复。务必使用清晰简洁的语言，便于潜在客户理解。


  此外，用展示您应用最新功能和改进的更新版本替换过时的图像、视频或文档。这包括更新屏幕截图、演示视频和用户指南以反映托管包的最新版本。最后，鼓励体验托管包最新版本成功客户在您的
  AppExchange 列表上留下评论或分享他们的成功案例。这不仅增加了您应用的可信度，还帮助潜在客户了解使用最新版本的好处。


  ## 公开或私有


  在 AppExchange 市场上推出应用时，每个合作伙伴都需要做出一个关键决定：是将列表设置为公开还是私有。此选择不仅影响您产品的可见性，还在确定您的销售策略方面发挥着重要作用。


  AppExchange 上的列表代表客户可以搜索并通过点击给定 URL 直接安装托管包的条目。具有 SEO 合规性的这些列表提供了易于搜索和客户评分的功能，并作为强大的营销存在。每个列表与一个包具有
  1:1 的关系，意味着一个列表指向单个包。然而，该包可以互换。例如，如果您有一个与 *包 A* 关联的 *列表 A*，完全可以切换并让 *列表 A* 指向不同的包——比如
  *包 B*。


  公开列表是 AppExchange 市场上可搜索的条目。它们允许您的产品具有广泛的可见性，让潜在客户能够独立找到它。通过使用此功能，您可能会增加新用户在浏览 AppExchange
  市场时找到您应用的可能性。


  相比之下，私有列表在 AppExchange 市场上不可搜索。但是，它们可以通过唯一 URL 与选定客户共享。此类列表允许更专注和量身定制的分发策略，让您可以直接联系目标客户并分享您应用的链接。


  公开和私有列表之间的决定在很大程度上取决于您的销售和分发策略。如果您旨在扩大覆盖范围并允许客户有机地发现您的产品，公开列表将更有利。然而，如果您想要更具针对性的方法，直接联系潜在客户并为他们提供唯一
  URL，那么私有列表将更合适。


  ## 客户入职的艺术


  您是否曾在不试驾的情况下买车？或在未先见面就收养宠物？可能不会。当客户考虑在 AppExchange 市场上购买应用程序时，同样的原则也适用。他们需要在做出决定之前先尝一尝、先瞥一眼、先进行“试驾”。可以这样想——我们的旅程就像烘焙最美味的糕点，而现在，我们正处于让客户品尝第一口令人垂涎的时刻。


  我们的第一步是什么？录制一个引人入胜的演示视频。演示视频相当于您应用的电影预告片。这是您围绕应用程序打造引人入胜叙事的机会，突出其功能并展示其价值。请记住——一个制作精良的演示视频可以营造出对您应用的好奇、兴趣甚至兴奋感。此外，在设置良好的
  AppExchange 列表中，随着潜在用户与演示互动，线索会无缝填充到 **许可管理应用 (LMA)** 中。


  接下来，我们有“试驾”。试驾类似于在指定赛道上由车主陪同进行短暂试驾，您无法探索其所有功能，但可以感受其性能。同样，**试驾** 功能也会在 LMA 中填充线索。


  然后，我们转向 Trialforce，即扩展的动手体验。想象一下让客户在周末试驾那辆新车。Trialforce 允许客户快速轻松地申请您提供的免费试用。这让他们有机会在自己的环境中与您的应用互动，体验其感受。并且在他们试水期间，Trialforce
  也在幕后默默工作，为您创建线索。这意味着在客户权衡时，您正在获得宝贵的洞察来跟踪使用情况并将潜在客户转化为付费客户。




  所以，随着我们深入本章，请记住，引导新客户入驻是一场微妙的舞蹈。它需要策略与创意相结合来保持趣味性。让我们穿上舞鞋，登上舞池。


  ## 录制引人入胜的演示视频


  制作引人入胜的演示视频就像编写一个引人入胜的故事。你本质上是在带观众参观你的应用程序，展示其独特功能，突出其优势——最重要的是——演示它如何解决他们的问题。


  首先确定你想要展示的关键功能。请记住——你不仅仅是在演示你的应用能做什么，还要演示它如何为客户带来价值。思考客户的痛点以及你的应用如何解决它们。确保这些方面构成视频叙事的核心。


  接下来，规划你的脚本。一个没有计划的视频就像一艘没有舵的船——它可能充满能量，但缺乏方向。你的脚本应提供对应用程序、其优势以及其工作原理的清晰简洁概述。避免使用行话和过于复杂的语言；相反，力求采用易于理解的对话语气。记得以强有力的
  **行动号召 (CTA)** 作结，邀请观众采取下一步行动，无论是开始免费试用还是联系你的团队获取更多信息。


  在实际录制时，质量很重要。使用好的屏幕录制工具并投资 decent 音频设备——观众会欣赏清晰的画面和清晰的声音。可以考虑使用诸如 [demoboost.com](demoboost.com)
  或 [guidde.com](guidde.com) 这样的软件。这些工具不仅能促进高质量录制，还提供有助于突出应用程序重要部分、引导观众注意力和创造更具互动性体验的功能。


  保持视频简洁且引人入胜。冗长拖沓的视频有失去观众注意力的风险，因此目标时长约为 1-3 分钟。然而，如果你的应用程序有很多需要更多时间演示的复杂功能，请考虑制作一系列较短的视频，而不是一个长视频。


  最后，请记住，你的演示视频不是一次性内容。随着应用的演进，演示视频也应随之更新。定期更新视频以反映新功能、改进以及 UI 的变化。


  精心制作的演示视频可以显著提升应用的可见度和吸引力。这是你留下强大第一印象的机会，因此花时间规划、录制和完善你的演示视频。记住——最好的演示视频讲述一个故事：你的应用如何让客户的生活更轻松、更美好的故事。祝录制愉快！


  ## 在 AppExchange 宇宙中推出试驾


  ![](img/44ed632038957e4c80220676e84c5109_408_0.png)


  **试驾** 是 Salesforce AppExchange 市场的标志性功能，充当你的发射平台，让潜在的宇航员（我的意思是客户）体验指挥你的宇宙飞船——呃，应用程序的感觉！它配备了装满样本数据的模块，就像准备升空的宇宙飞船一样就绪。


  想象一下 AppExchange 市场是一个高科技的太空港展厅，你的时尚闪亮的宇宙飞船（你的应用）已准备好在最近的星云周围进行一次短途旅行。这里的不同之处在于，这艘闪亮的宇宙飞船不仅仅是远观欣赏——它是让他们跳进去驾驶，穿梭于其特定需求的宇宙中！


  本质上，试驾组织是你设置的一个只读组织。这个组织是你的潜在客户探索你的应用程序而不更改任何记录的共享游乐场。鉴于其性质，你的应用应针对这些限制进行优化，以展示结果。让我们看看如何设置此体验：


  - 1. **启用试驾**：首先登录合作伙伴社区，找到你想要提供试驾的列表，点击它打开 AppExchange 发布控制台，选择 **试用** 选项卡，并勾选
  **提供试驾**。

  - 2. **创建试驾组织**：点击 **创建试驾** 并填写详细信息，确保关联包含你的应用的包。Salesforce 将创建一个组织并向你发送管理员和评估用户的登录凭据。

  - 3. **配置试驾组织**：以管理员身份登录以添加样本数据并执行其他设置任务。然后，以评估用户身份登录以定义密码。

  - 4. **将试驾组织连接到你的 AppExchange 列表**：返回发布控制台中的 **试用** 选项卡，点击 **连接组织**，输入评估用户的登录凭据，点击
  **提交**，然后最后 **保存**。


  就是这样！你的试驾已准备就绪。潜在客户可以在你的 AppExchange 列表上选择 **试驾** 按钮，并以只读参与者的身份访问试驾组织。此功能对于无需插入或更新记录即可有效传达其价值的应用尤其有益。


  为了实现成功的试驾，至关重要的是你的样本数据和场景能够引起典型应用的共鸣，并在不可编辑的上下文中让潜在客户看到应用的全部范围。目标是打造一个丰富、引人入胜的体验，吸引潜在客户，让他们渴望更多。


  ## 应用内指导，实现更具互动性的试驾


  **应用内指导** 是 Salesforce 的一项功能，可以丰富客户的试驾体验。此功能在应用程序内充当交互式指南，帮助用户浏览应用并了解其功能和特性。


  要配置 **应用内指导**，你只需在试驾组织中访问设置页面，导航到 **应用内指导**，然后点击 **添加提示**。从那里，你可以选择想要提供的指导类型（如浮动提示或停靠提示）、它将出现的页面、显示时长以及出现频率。


  利用 **应用内指导** 可以为潜在客户提供应用的演练。此工具特别适用于突出关键功能、解释复杂功能以及引导用户完成特定工作流程。就像有一位虚拟导游帮助你的客户探索应用的每个角落和缝隙。


  ## 释放 Trialforce 的力量


  还记得试驾那艘宇宙飞船有多令人兴奋吗？现在，想象一下把宇宙飞船的控制权交给你的客户。是的——我们说的是 Trialforce，你的 AppExchange 解决方案的典型超光速体验。可以把它看作是客户获得完全沉浸式“掌舵”体验的“银河超能力”。


  那么，为什么要拥抱 Trialforce 的宇宙呢？


  嗯，Trialforce 就像你手头的工具星座，不仅让你能够在宇宙中疾驰，还能帮助你优雅地导航。随着你提供试用，你正在 LMA 中创建线索。想象一下这是在创建潜在新星球（客户）的地图，准备好供探索。


  以下是 Trialforce 如何成为你应用成功的“超驱动”的原因：


  - 它是你的营销活动的最佳伙伴，使你能够扩大客户覆盖面和采用率

  - 它允许你留下个性化印象，从品牌到功能、数据和试用体验都可以自定义

  - 它是管理不同产品、版本和版次试用的“一站式商店”

  - 它让你的客户，即使没有管理员权限，也可以在无需登录其生产环境的情况下试用你的应用


  有几个主要组件支撑着 Trialforce——**Trialforce 管理组织 (TMO)**、**Trialforce 源组织 (TSO)** 和 Trialforce
  模板。它们是如何配合工作的：


  - **TMO**：Trialforce 的起点，TMO 是你在设置后管理一切的地方。在这里，你可以创建 TSO 并为自定义品牌打造模板。

  - **TSO**：TSO 充当客户收到的试用组织的模具。你可以安装你的产品、添加样本数据，并配置 TSO 以提供最佳客户体验。品牌也可以个性化，从 TMO 中设置的模板中选择。

  - **Trialforce 模板**：可以把它看作是在特定时间点的 TSO 快照。一旦你的产品安装完成且配置就绪，你就可以创建模板。此模板定义了每次客户注册试用时提供的试用组织。


  ## 与 Trialforce 一同启航


  要让 Trialforce 运行起来，你需要遵循以下一系列步骤：


  - 开发受管包

  - 通过安全审查

  - 设置 **许可管理组织 (LMO)** 以监督客户访问

  - 将版本与 LMO 关联并确定许可默认值

  - 请求一个 TMO

  - 可选地，在 TMO 中制作自定义品牌登录页面和电子邮件

  - 从 TMO 生成 TSO

  - 在 TSO 中安装受管包并按需自定义




  - 从 TSO 创建一个新的 Trialforce 模板

  - 将 Trialforce 模板与 AppExchange 市场关联


  为宇宙之旅点燃飞船并不是一蹴而就的——它需要仔细的准备和一系列细致的步骤。就像我们的太空比喻一样，设置 Trialforce 也需要时间和精确度。在你能够踏上旅程之前可能需要几天时间，但一旦你通过了所有检查点，一切就绪，你就可以让自己的“Trialforce
  飞船”翱翔。


  ## 推出免费试用


  你有几种向潜在客户提供免费试用的选择，如下所示：


  - **From Salesforce, through AppExchange**: 客户可以直接从 AppExchange 列表启动试用。

  - **Using HTML forms on your external website**: 潜在客户提交表单后，Salesforce 会基于 Trialforce
  模板提供试用。使用此类表单时，你可以采用 `SignupRequest` API。

  - **Employing the SignupRequest API independently**: 这适用于寻求更精细自定义的人。试用可以以编程方式激活。


  好了， fellow space travelers！有了这些路线在你的星图上，你现在就可以将你的应用送入轨道，以多样且动态的方式与潜在客户建立联系，就像我们银河系中的星星一样。


  请记住，随着你的产品不断发展，你的试用模板也应随之发展。任何更新或品牌变更都需要在试用中体现。


  ## 在网页上集成试用


  将免费试用直接展示在你的网站上，是扩展 AppExchange 解决方案覆盖范围的有效方法。利用 HTML 表单结合 SignupRequest API 不仅能推动用户参与你的业务，还能向潜在客户全面展示你的解决方案。提交表单后，Salesforce
  会分配一个与你预定义的 Trialforce 模板相符的试用。


  ## 了解 SignupRequest API


  SignupRequest API 在激活网站上的免费试用时作为工具。执行对 SignupRequest 对象的 API 调用使你能够为潜在客户生成注册，收集深入的注册数据，分析这些信息，并将注册数据与你现有的业务运营同步。


  ## 在网站上实施试用


  要在你的网站上实施试用，请执行以下步骤：


  - 1. **Activation of SignupRequest API**: 要激活 **SignupRequest** API，请使用你的 **Partner
  Business Org (PBO)** 凭据在 Salesforce Partner Community 中打开一个支持案例。这将使 API 在你的组织中运行。

  - 2. **Selection of a sign-up form hosting option:** 评估并选择适合你的注册表单的托管解决方案。这可能从托管在
  Heroku 上的 Node.js 和 React 应用，到托管在 Experience Cloud 网站上的 Lightning 组件、托管在 Sites 上的
  Visualforce 页面或 Web-to-Lead 表单不等。

  - 3. **Creating sign-ups through the API:** 实现对 `SignupRequest` 对象的 API 调用以创建面向潜在客户的注册，从而让你自定义注册流程。

  - 4. **Generating proxy sign-ups for OAuth and API access:** `SignupRequest` 对象允许你以编程方式创建组织，而不会向用户发送任何系统生成的电子邮件。因此，你可以获取
  OAuth 访问令牌登录该组织并从中执行 API 请求，而无需任何用户操作。

  - 5. **Provisioning trial orgs:** 利用 Trialforce 为潜在客户提供你解决方案的免费试用。


  遵循这些步骤，你可以将 AppExchange 解决方案的免费试用顺畅地集成到你的网站中，从而提升潜在客户体验并放大你的产品提供的可见性和采用率。


  ## 通过从 AppExchange 直接安装来促进应用试用


  有时，对潜在客户最有效的试用体验可能只是允许他们直接从你的 AppExchange 列表获取你的应用程序。这种即时的动手体验让客户能够在他们的 Salesforce
  环境中评估你的应用程序，从而真实地了解你的解决方案如何融入他们的工作流程。


  这一过程的关键在于 LMA。当客户从 AppExchange 市场安装你的应用时，你的 LMA 中会自动创建一个许可证。默认情况下，该许可证将在预定的试用期后过期，你可以根据业务需求定义该期限。


  要指定默认试用期，请按照以下步骤操作：


  - 1. 导航到你的 LMA。

  - 2. 点击 **Packages** 选项卡。

  - 3. 选择相关的托管包。

  - 4. 在 **Package Detail** 页面，编辑 **Default Trial Length (Days)** 字段。

  - 5. 保存更改。


  此设置允许你定义试用期的标准持续时间（通常设置为 30 天）。潜在客户安装你的应用的那一刻，其试用期就开始了，在此期限结束时，除非他们购买完整许可证，否则许可证将自动过期。


  当你的应用程序的配置过程得到精简和自动化时，直接安装策略效果最佳。客户通常欣赏流畅、无忧的设置流程，让他们无需大量技术帮助或阅读复杂的设置手册即可开始使用你的应用。


  然而，创建无缝的安装流程通常需要你进行相当多的规划、设计和测试。在下一节中，我们将深入探讨优化安装体验的策略和技术，使其尽可能流畅且以客户为中心。这些对安装流程的改进可以显著影响客户对你的应用的最初印象，影响他们从试用用户转变为付费客户的决定。


  ## 将试用转化为付费客户


  将这些试用转化为真实客户的关键在于有效管理试用期并与潜在客户进行战略性互动。在试用期间，保持与潜在客户的密切联系至关重要。推荐的做法是在试用开始后一天联系他们，以解答他们可能有的任何问题。在试用结束前联系也很重要，以便你的销售团队能有效地引导他们成为付费客户。


  在第 2 章中，我们探讨了使用你的 PBO 来实施自动化流程的知识。这在设计你的试用流程时特别有用。一个关键的考虑因素是试用期的持续时间。默认情况下设置为 30
  天，但根据我的经验，14 天的试用期通常足以让客户对你的产品形成看法。此外，更短的试用期有助于保持更高效的销售周期。


  ## 安装你的应用程序的穴人指南


  ![](img/44ed632038957e4c80220676e84c5109_419_0.png)


  把 Salesforce 生态系统想象成一家国际家居建材商店，你的应用就是一套等待客户取用的巧妙工具包。现在，想象你的客户更像 *Fred Flintstone*
  而不是 *Bob the Builder*。Yabba dabba doo！本节的全部内容就是让这套工具包变得如此易于组装，以至于我们亲爱的穴人也不会大汗淋漓。


  尤其是如果你的应用是在 ISVforce 计划中开发的，很可能有相当一部分客户会光顾 AppExchange 市场并挑选你的应用。第一印象很重要，而初始安装过程就是你应用的握手。确保我们做对这一点至关重要，因为说实话，没有人想要一个摇摇晃晃、尴尬的握手。


  在本节中，我们将强调流畅快速的安装和升级流程的重要性，以及提供易于遵循的安装指南，就像连点成画拼图一样。目标是什么？确保你的客户，无论是 Bob 还是 Fred，从一开始就能拥有无缝的体验。


  ## 系统管理员 – 关键角色


  在大多数组织中，安装过程通常由系统管理员处理。此人对采用或卸载你的应用的决定起着关键作用。因此，在设计你的安装流程时，考虑他们的体验至关重要。


  设计你的应用安装过程使其直观，并确保说明清晰、易于理解，并适合各种技术技能水平。通过提供用户友好的指南、工具提示和演练，你可以帮助系统管理员，从而积极影响他们对你的应用的印象。




  ## 快速安装与升级——必不可少


  速度和简洁性在安装过程中至关重要。冗长或复杂的安装过程会让客户感到沮丧，并给他们留下应用程序存在缺陷的印象。因此，将安装流程优化得尽可能快速和直接，是给人留下良好第一印象的必要步骤。


  同样的原则也适用于您应用的升级流程。定期升级是客户使用您应用旅程中不可或缺的一部分。确保这些升级过程顺畅且不会破坏现有功能，将有助于您保持客户满意度。


  ## 高质量的安装指南


  编写高质量的安装指南与应用本身的开发同样重要。该文档应提供安装和配置过程中所有手动步骤的详细描述。请记住，撰写有效的文档本身就是一项技能。


  为了确保指南的质量和可用性，应对其进行彻底测试。这意味着让一位不熟悉您应用安装和配置的人员按照指南操作。通过这样做，您可以发现文档中任何潜在的模糊之处或复杂性，并对其进行改进以提高清晰度和简洁性。


  ## 使用安装后脚本增强安装


  对于希望简化其托管包安装或升级流程的开发人员而言，安装后脚本提供了一个有用的工具。这些脚本是指定的 Apex 类，在订阅者安装或升级托管包后会自动运行。它们允许开发人员根据订阅者组织的特定情况自定义安装或升级流程，从而增强用户体验。


  安装后脚本可以执行各种功能，例如填充自定义设置、生成示例数据、通知外部系统，或启动批处理操作以在大量数据集中填充新字段。需要记住的是，脚本是以代表您包的特殊系统用户身份执行的，这意味着所有操作都似乎由您的包完成。


  这些脚本有能力启动批处理、计划和 future 作业。然而，它们无法访问 Session ID，并且只能使用异步操作执行调用。调用发生在脚本运行完毕且安装完成并提交之后。为了避免安装问题，脚本不得使用
  `with sharing` 关键字调用包中的另一个 Apex 类。


  安装后脚本是一个实现 `InstallHandler` 接口的 Apex 类，该接口只有一个方法 `onInstall`。该方法指定在安装时要执行的操作。它接收一个
  `context` 对象作为参数，该对象提供诸如安装发生的组织 ID、发起安装的用户 ID、之前安装的包的版本号以及安装是升级还是推送等信息。


  请注意，如果脚本失败，安装或升级过程将被中止。脚本中的任何错误都会通过电子邮件发送给您包的 **Notify on Apex Error** 字段中指定的用户。因此，脚本必须经过精心设计并彻底测试。


  您可以使用 Apex **Test** 类的 **testInstall** 方法来测试安装后脚本。创建并测试脚本后，可以在 **Package Detail**
  页面上的 **Post Install Script** 查找字段中指定它。


  安装后脚本对于促进顺畅的设置过程至关重要。当有效实施和测试时，它们可以促进您应用的成功采用，因为无缝的设置过程给用户留下积极的印象。然而，它们必须谨慎处理，并附带详细的文档和广泛的测试，以确保它们按预期运行，而不会对用户的环境造成非预期的更改。


  ## 实施自动化入职——迈向可扩展的安装


  AppExchange 应用的安装有时可能是一个复杂的过程，特别是当应用需要全面配置或与外部系统集成时。尽管安装后脚本很有用，但它们可能并不总是足以确保无缝设置。在这种情况下，一个实用的解决方案是设计一个自动入职流程，引导系统管理员完成必要的步骤。


  创建一个引人入胜且直观的入职流程的一种方法是开发一个自定义的 **Lightning Web Components (LWC)** 界面，通常称为“配置向导”。此工具可以引导系统管理员完成配置应用程序、授予权限等所需的所有步骤。


  但是，为什么要投入时间和资源构建自定义界面，而所有这些配置步骤都可以在 Salesforce 设置中直接执行呢？


  答案在于用户体验。作为购买应用决策过程中的关键角色，系统管理员应获得尽可能简化和直接的体验。一个构建良好的入职流程不仅简化了设置，还可以帮助管理员了解您应用的功能以及如何利用它们获得最大价值。


  请记住——客户与您的产品进行的每一次互动都会影响他们对它的看法。一个高效、用户友好的入职流程，使您的应用程序的安装和配置变得简单，可以显著提高客户满意度，并最终增加购买的可能性。


  在这种情况下，为可扩展性设计自动化入职流程不仅仅是一个技术挑战——它是您客户参与策略的一个重要方面。始终优先考虑客户的需求，并考虑如何让他们的旅程更轻松、更高效。这种对细节的关注将在客户忠诚度和您应用的整体成功方面带来回报。


  ## 当客户进行本地自定义时保持冷静


  ![](img/44ed632038957e4c80220676e84c5109_425_0.png)


  将 Salesforce 平台视为一个建筑风格多样的社区，而您的应用程序是其中一栋现代、吸引人的房屋。您的客户被设计所吸引，搬了进来。但随着他们逐渐适应，他们开始移动家具。他们甚至可能会拆掉一面墙或把天花板漆成鲜艳的颜色。本质上，他们正在做出改变，就像任何真正的房屋居住者一样，以使其成为自己的。


  这正是 Salesforce 平台的本质，一个为定制和适应性而设计的社区。当您的客户熟悉新的环境后，他们不可避免地会寻求扩展和修改已安装的应用程序，包括您的托管包。本节将带您走过这个有时混乱但总是令人兴奋的室内设计过程。我们将讨论如何在保持您“房屋”完整性的同时管理这些变化并支持客户的创造性努力。


  ## 拥抱客户定制


  客户扩展您应用程序的动机实际上可能对您的业务有益。如果客户在托管包之上构建额外的定制，这会使您的解决方案与他们的业务流程更深度集成，使他们更难停止使用您的应用。


  ## 为本地更改定义支持级别


  为因本地更改而破坏应用核心功能的客户提供支持可能具有挑战性且成本高昂。明确您可以提供何种类型的支持并考虑不同的支持级别至关重要。例如，您可以创建提供不同程度本地更改协助的
  **Silver**、**Gold** 和 **Platinum** 支持级别。


  ## 提供文档


  提供包含官方支持的本地更改示例的详细文档。该文档不仅能指导客户完成定制过程，还能帮助他们避免可能导致未来问题的潜在陷阱。


  ## 建立知识库


  随着因本地更改而出现问题，开始建立关于客户定制已知模式和有效支持策略的内部知识库。这不仅能简化您的支持流程，还能提供有关客户如何使用和扩展您应用的宝贵见解。


  为此，您可以利用您的 PBO。此外，请考虑使用标准 Salesforce 功能，例如知识文章和 Communities。知识文章允许您记录和分享常见问题的解决方案，使您的团队和客户更容易找到问题的答案。Communities
  则为用户提供了一个分享经验、提问和相互交流的平台。这不仅培养了社区感，还可能导致发现您应用的新颖用途和扩展。




  通过将这些资源整合到您的策略中，您可以建立一个全面的知识库，从而提升支持流程并提供有价值的客户洞察。


  ## 定期审查与学习


  定期审查知识库。如果您注意到许多客户都在开发类似的本地定制，这可能表明某项特定功能或功能需求旺盛。您可以考虑将这些流行的定制作为新功能整合到您的应用中，从而将客户需求产品化并提升解决方案的整体价值主张。


  请记住——关键在于找到合适的平衡。您希望鼓励客户充分利用您的应用和 Salesforce 平台，但同时也需要有效地管理和支持这些定制。通过正确的方法，您可以将这一挑战转化为提升客户满意度并加强产品市场地位的机会。


  ## 驶向产品采用


  ![](img/44ed632038957e4c80220676e84c5109_429_0.png)


  系好安全带，亲爱的 App 开发宇航员们，因为我们即将踏上从“认知”星球到星光熠熠的“集成”领域的不可思议之旅。这不仅仅是前往“安装”的往返旅行。不——我们的目标是“持续使用和付费”星云的最远处。我们宇宙之旅的这一部分为您提供了一张星图来指导您的探险，该星图汇集了深入研究和实践应用中最明亮的见解。那么，设定您的应用坐标，保持目光关注客户满意度的星座，让我们扬帆驶向深空“产品采用”！


  ## 理解产品采用


  产品采用策略有助于识别潜在障碍并制定有效策略来鼓励用户采用新技术。这些策略在数字产品领域尤为重要，因为它们有助于预测用户行为，即使没有专门的研究团队或进行全面用户研究所需的资源。


  ## 产品采用的关键因素


  有几个要素会影响产品采用，其中最关键的五个如下：


  - **相对优势**：您的产品是否比竞争对手具有优势？

  - **兼容性**：您的产品是否与用户的现有系统和工作流程保持一致？

  - **简易性**：您的产品是否用户友好且易于导航？

  - **可试用性**：用户能否在做出承诺前轻松试用您的产品？

  - **可观察性**：使用您的产品的益处是否清晰且可感知？


  有效地衡量和理解这些因素可以显著提高产品采用的可能性。


  ## 采用者类别 – 不同阶段，不同需求


  在 AppExchange 应用的背景下，采用通常发生在不同阶段。通常涉及三个主要角色：批准或购买产品的经理、安装产品的管理员以及每天使用产品的终端用户。这些角色的需求各不相同，与产品的互动方式也不同，从而影响其采用之旅。


  为了设计有效的产品采用策略，了解每个采用者类别的具体需求至关重要。下表应有助于我们做到这一点：


  | 采用因素 | 管理者 | 管理员 | 终端用户 |

  |---|---|---|---|

  | 相对优势 | 对产品解决业务问题和提高效率的能力感兴趣 | 寻找配置简单的产品 | 希望工具能减轻工作负担 |

  | 兼容性 | 评估产品是否符合业务需求和现有系统 | 评估其与其他系统无缝集成的程度 | 偏好按预期运行的产品 |

  | 简易性 | 查看产品对团队工作量的影响 | 偏好易于实施的解决方案 | 选择使用起来直接的产品 |

  | 可试用性 | 需要在完全投入前测试产品 | 关注设置时间 | 偏好无风险试用 |

  | 可观察性 | 关注产品对收入和效率的影响 | 需要跟踪工具来监控性能 | 需要看到即时收益 |


  通过应用前表中概述的多元视角，您可以量身定制采用策略，以有效满足管理者、管理员和终端用户的不同需求。


  ## 构建产品采用框架


  在了解了不同的用户需求和影响采用的因素后，您可以创建一套指导方针或启发式规则。这些规则可能因上下文而异，但将作为指导您采用产品方法的基石。


  例如，在 *相对优势* 下，终端用户可能会检查产品解决常见问题（粘性）的能力并提供改进的功能。在 *兼容性* 下，他们可能会评估软件兼容性和可定制性。每个因素的启发式规则可以类似地定义。


  虽然该框架并非适用于所有上下文，但它为构建满足您独特用户需求的产品采用策略提供了坚实的基础。通过理解和增强产品采用，您的 AppExchange 应用可以在竞争激烈的数字市场中蓬勃发展。


  ## 在新客户入职中整合产品驱动增长策略


  **产品驱动增长 (PLG)** 是一种商业方法，其中产品本身是客户获取、转化和扩展的主要驱动力。通过专注于 UX，产品成为公司增长战略的核心，从而带来满意的客户，他们不仅留存时间更长，还会向其网络推广产品。以下是
  Salesforce AppExchange 合作伙伴可以采用的一些策略来推动 PLG。


  ## 专注于用户体验


  PLG 策略的核心是 UX。为了推动采用和使用，您的产品必须直观、易于使用，并在首次互动时提供价值。努力消除摩擦点并使入职流程尽可能顺畅。用户与产品互动越多，他们越有可能看到其价值并成为付费客户。


  ## 实施 Freemium 或免费试用模式


  允许用户在购买前试用产品可以降低感知风险并推动采用。Freemium 模式免费提供产品的基础版本，同时为付费客户保留高级功能。免费试用允许用户在有限时间内体验完整产品。无论哪种方式，都要确保您的免费产品足够吸引人，能够吸引用户并鼓励他们升级。


  ## 优先考虑客户成功


  在 PLG 中，每个用户都可能成为付费客户。因此，从一开始就优先考虑客户成功至关重要。这可能涉及创建全面的自助服务资源、提供响应迅速的客户支持，以及主动联系可能遇到困难的用户。满意的用户不仅更有可能转化，还会成为产品的倡导者。


  ## 利用分析


  通过跟踪每日活跃用户、会话时长和功能使用等关键指标，了解用户如何与产品互动。这些洞察可以帮助您识别产品对用户最有价值的部分以及可能改进的机会。利用这些信息指导产品开发，专注于推动用户满意度和留存的功能。我们将在
  *第 10 章* 中详细讨论这一方面。


  ## 鼓励病毒式传播


  口碑推荐是极其强大的增长驱动力。通过在产品中直接构建分享功能，鼓励用户邀请他人使用您的产品。对于 B2B 产品，这可能简单到允许用户在应用内与同事协作。激励措施，例如额外的功能或存储空间，也能鼓励用户进行推荐。


  ## 使用专业版迎接新客户


  Salesforce CRM 提供几种不同的版本：**Professional Edition (PE)**、**Enterprise Edition (EE)**
  和 **Unlimited Edition (UE)**。虽然后两种版本配备了强大的功能，但本节的重点是 PE，它通常被小型企业使用。需要注意的是，此处讨论的功能和特性默认适用于
  EE 和 UE。


  了解这些版本之间的差异在向现有 Salesforce 客户销售您的应用时至关重要，因为它会影响您应用的设计和功能。Salesforce 版本可以分为两类


  为了便于理解，分为集群：PE 和 EE/UE。每个集群内的版本共享相似的功能。


  对于使用 scratch org 进行开发的人员来说，scratch org 定义文件中的“edition”属性是你确定该 scratch org 的 Salesforce
  版本的工具。通过创建多样化的 scratch org 定义蓝图，你可以轻松创建配置各异的 scratch org 以供检查。务必考虑将此文件加入你的项目书签并与你的版本系统同步。请记住——PE
  缺少其他版本中存在的一定功能。因此，基于主要开发 scratch org 定义文件构建的应用可能与 PE 组织不兼容。面向 PE 设计？认识这些区别并使用 PE
  组织进行评估至关重要。


  要了解特定版本中可用的功能和对象，请查阅版本比较表¹或在线帮助。建议通过在 PE 测试组织中安装应用来测试你的应用，以确保一切按预期运行。你可以使用 Environment
  Hub 创建 PE 测试组织，详情请参阅 *第 2 章*。


  1 https://www.salesforce.com/editions-pricing/sales-cloud/


  所有 Salesforce 版本都有限制，限制可使用的应用、对象和标签的数量。然而，幸运的是，对于 ISV 合作伙伴而言，任何在 AppExchange 市场上公开发布的托管包不再计入这些限制。


  就 API 访问而言，通常在 PE 组织中不受支持。但是，通过安全审查后，你有资格使用某些 API 来构建复合应用。


  支持多个 Salesforce 版本提供了提供更丰富应用版本的機會。这可以通过使用扩展包或利用 Dynamic Apex 实现，详情请参阅 *第 4 章*。


