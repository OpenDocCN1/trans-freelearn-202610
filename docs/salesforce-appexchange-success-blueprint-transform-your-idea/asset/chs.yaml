  \ *Salesforce AppExchange 合作伙伴计划政策* 中所述。该政策每年更新，因此细节不会包含在本书中。为确保你拥有政策的最新版本，请参阅合作伙伴门户²。确实，值得强调的是，对计划支柱有扎实理解可以帮助你做出明智的决策并为公司指明正确方向。\n\
  \n2 https://partners.salesforce.com/s/education/appinnovators/AppExchange_Partner_Program\n\
