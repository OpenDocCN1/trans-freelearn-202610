  - 如何制定针对 Salesforce 生态系统量身定制的全面业务计划，确保您作为 AppExchange 开拓者的成功

  - 利用 AppExchange 合作伙伴工具包作为您可靠的指南针来支持和发展合作伙伴关系的重要性


  掌握这些知识后，您将能够自信地驾驭 Salesforce 生态系统，并为繁荣的 AppExchange 合作伙伴关系奠定基础。那么，让我们继续踏上 Salesforce
  和 AppExchange 的荒野之旅，发掘征服合作伙伴关系版图的秘诀！


  ## Overview of the AppExchange Partner Program


  ![](img/44ed632038957e4c80220676e84c5109_85_0.png)


  成为 AppExchange 合作伙伴提供了丰富的优势，可以帮助您的应用程序在竞争激烈的 Salesforce 生态系统中蓬勃发展。在本节中，您将找到加入 AppExchange
  市场后可以期待的一些关键优势，如下所示：


  - **访问庞大的客户群：** 作为合作伙伴，您的应用程序可接触到 Salesforce 庞大且多元的客户网络，增加销售和互动的潜力。

  - **合作伙伴生态系统协作：** 加入 AppExchange 市场可开启与其他 Salesforce 合作伙伴的协作机会，让您拓展网络、分享知识并产生潜在客户。

  - **全面的开发工具和资源：** Salesforce 提供多种工具和资源，支持平台上的应用程序开发、测试和部署。

  - **平台安全与信任：** 通过在 Salesforce 平台上构建应用程序，您可受益于其强大的安全基础设施并赢得客户信任。

  - **上市支持（GTM）：** Salesforce 提供资源和支持，帮助合作伙伴有效营销其应用程序，包括营销最佳实践、联合营销机会以及参加 Salesforce
  活动。

  - **技术支持和培训：** AppExchange 合作伙伴可访问 Salesforce 的技术支持资源，如文档、网络研讨会和专属支持团队，帮助他们保持最新并克服技术挑战。

  - **收入分成机会：** 在 AppExchange 市场上销售您的应用程序可在利用广泛的 Salesforce 生态系统的同时产生额外收入。

  - **应用知名度：** Salesforce 提供各种提升应用程序可见度的机会，如 AppExchange 列表、赞助和客座博客投稿，帮助您触达更广泛的受众并建立品牌声誉。

  - **业务管理**：Salesforce 提供一系列工具和资源，包括 Environment Hub、**Channel Order App (COA)**、**License
  Management App (LMA)**、**Partner Business Org (PBO)** 和 Marketplace Analytics，帮助您有效管理
  AppExchange 业务。

  - **需求生成**：通过成为 AppExchange 合作伙伴，您可获得资源和项目，如 **AppExchange Marketing Program (AMP)**，支持您为应用程序创造需求并推动转化。我们将在
  [第12章](Chapter 12) 中讨论 AMP。


  作为 ISV 合作伙伴加入 AppExchange 市场可提供众多优势，有助于您的应用程序在 Salesforce 生态系统中取得成功。从获得庞大的客户群访问权限到利用
  Salesforce 的品牌声誉和全面的支持资源，与 Salesforce 在 AppExchange 市场上合作的好处是显著的，可为您的应用程序的成长和成功铺平道路。


  ## Navigating the AppExchange Partner onboarding lifecycle


  成为 AppExchange 合作伙伴可能看起来像一场令人望而生畏的舞蹈，但我在这里引导您完成三个主要轨道，以确保您作为 ISV 合作伙伴的成功：技术轨道、GTM
  轨道和业务轨道。将这些轨道视为您的舞蹈教练，引导您完成通往 AppExchange 明星之路的每一步。




  ## 技术轨道


  穿上你的编程鞋，深入了解应用的开发和安全方面。本轨道中的关键里程碑包括以下内容：


  - **发现**：揭开您应用和 Salesforce 平台技术要求的神秘面纱

  - **制定策略**：编排您的开发和安全流程，以创建和谐的应用

  - **启动安全审查**：启动安全审查流程，确保您的应用符合 Salesforce 的严格标准

  - **通过安全审查**：通过成功完成安全审查并解决任何已识别问题来赢得金星


  ## GTM 轨道


  准备好用您应用的营销和销售策略惊艳众人。本轨道通常由 Salesforce 合作伙伴客户经理主导，涉及以下两个里程碑：


  - **制定整体 GTM 策略**：制定推广和向渴望的客户销售应用的主计划

  - **实施营销计划**：执行营销举措，例如在线推广、活动以及与 Salesforce 的联合营销，让您的应用成为焦点


  ## 业务轨道


  最后，专注于成为 AppExchange 合作伙伴的运营和合同方面，确保您的业务像舞蹈动作一样顺畅。本轨道中的关键里程碑包括以下内容：


  - **合作伙伴机会注册**：通过注册并提交申请，使您成为 Salesforce 合作伙伴的意向正式化

  - **加入合作伙伴社区**：获得 Salesforce 合作伙伴社区的独家访问权限，在那里有资源、支持和网络机会等待着您

  - **签署协议**：审阅并签署必要的合同，例如 **Salesforce 合作伙伴计划协议 (SPPA)** 和 **合作伙伴应用分发协议 (PADA)**

  - **起草技术策略**：规划您的技术路线图和未来演出的开发计划

  - **在 AppExchange 市场发布应用**：通过在 AppExchange 市场发布您的应用并使其可供 Salesforce 客户使用，从而成为焦点


  虽然入职流程可能并不总是遵循此确切顺序，但这些里程碑将作为导航您作为 Salesforce 合作伙伴旅程的实用指南。通过专注于成为 AppExchange 合作伙伴的技术、GTM
  和业务方面，您可以在 Salesforce 生态系统中建立成功且蓬勃发展的业务——同时看起来像一名舞蹈专业人士。下面的图表提供了三个主要轨道的视觉表示，以确保您作为
