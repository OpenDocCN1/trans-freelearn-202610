  图 1.1：Salesforce Partners 格局


  深入探讨协作动态，本书第 12 章将介绍你如何有效地与 PDO 和 SI 协作。


  ## 评估 Salesforce 平台对你的应用想法的适用性


  Salesforce 平台是否是你应用想法的理想巢穴？毕竟，即使是超级英雄也需要完美的行动基地来发挥其能力。


  Salesforce 是一个功能强大的平台，拥有构建和部署自定义应用程序的丰富工具和功能。然而，并非所有解决方案想法都能在 Salesforce 中找到完美的搭档。穿上装备，在评估
  Salesforce 是否适合你时请考虑以下因素：


  - **应用需求**：考虑你应用的具体功能，例如功能、可扩展性和集成需求。评估 Salesforce 的工具和功能 arsenal 是否能满足这些需求，还是需要寻求不同平台或技术的帮助。


  - **用户体验 (UX)**：确定 Salesforce 平台能否提供你的应用拯救局面所需的 UX。Salesforce 提供了大量用于打造自定义 **用户界面
  (UIs)** 的工具，但你可能需要借助额外技术来创建真正非凡且独特的 UX。另一方面，Salesforce 应用在外观和功能上与标准 Salesforce 界面相呼应时往往表现出色，提供无缝的
  UX。


  - **集成需求**：评估 Salesforce 是否能与你现有的系统和数据源形成无缝联盟。Salesforce 提供了各种集成选项，例如 API 和连接器，但你可能需要动用其他工具或技术来实现完全的集成和谐。


  - **安全性和合规性：** 思考你应用的安全性和合规性需求。Salesforce 拥有强大的安全性和合规性措施，但你可能需要采取额外步骤以确保你的应用符合你所在行业或地区的特定要求。此外，你需要考虑应用在
  Salesforce 认为安全的环境中运行的要求。这可能会导致某些应用想法被完全取消资格。


  - **时间和资源限制：** 权衡在 Salesforce 上构建你的应用是否符合你的时间和资源限制。为 Salesforce 构建应用可能需要大量投资，因此必须评估它是否与你的业务目标和优先事项保持一致。


  通过检查这些因素，你可以确定 Salesforce 平台是否是你想法的理想选择。


