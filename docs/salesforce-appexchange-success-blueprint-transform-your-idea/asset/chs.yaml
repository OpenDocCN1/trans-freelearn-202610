  例如，Salesforce AppExchange 合作伙伴开发了一款销售赋能应用。他们将市场细分为小型企业、中型公司和大型企业，每个细分具有不同的销售团队结构、工作流程和预算。


  ### Setting prices for different segments


  为不同细分设定价格


  Once you have segmented your market, you can set different prices for each segment
  based on their unique needs and price sensitivities. This approach, known as price
  discrimination, can help you capture more value from customers who are willing to
  pay more while still appealing to price-sensitive segments. To set prices for different
  segments, consider the following steps:

  一旦您细分了市场，您就可以根据每个细分的独特需求和价格敏感度为其设定不同价格。这种被称为价格歧视的方法可以帮助您从愿意支付更多费用的客户那里获取更多价值，同时仍然吸引价格敏感的细分。设定不同细分的价格时，请考虑以下步骤：


  - 1. Determine the value your app provides to each segment and their willingness
  to pay.

  - 1. 确定您的应用为每个细分提供的价值及其支付意愿。

  - 2. Set prices that reflect the value that your app delivers to each segment and
  align this with their price sensitivities.

  - 2. 设定反映应用为每个细分提供的价值的价格，并将其与他们的价格敏感度保持一致。

  - 3. Communicate the benefits and pricing of your app clearly to each segment, highlighting
  the features and value that are most relevant to their needs.

  - 3. 明确向每个细分传达应用的优势和定价，突出与其需求最相关的功能和价值。


  For example, a Salesforce AppExchange partner offers a customer support app with
  three pricing tiers: a basic tier for small businesses, a professional tier for
  mid-sized companies, and an enterprise tier for large organizations. Each tier is
  priced based on the value it provides to the respective segment and their willingness
  to pay.

  例如，Salesforce AppExchange 合作伙伴提供了一款客户支持应用，包含三个定价层级：面向小型企业的基础版、面向中型公司的专业版以及面向大型组织的企业版。每个层级的定价均基于其为相应细分提供的价值及其支付意愿。


  In conclusion, setting prices for different market segments can help you optimize
  your pricing plan and capture more value from your AppExchange app. By segmenting
  your market and setting prices based on the unique needs and price sensitivities
  of each segment, you can appeal to a broader range of customers

  总之，为不同市场细分设定价格可以帮助您优化定价方案并从 AppExchange 应用中获取更多价值。通过细分市场并根据每个细分的独特需求和价格敏感度设定价格，您可以吸引更广泛的客户群体


  ## Discounting for nonprofits


  非营利组织折扣


  Nonprofit organizations are an important segment to consider. Nonprofits often have
  unique needs and budget constraints that may not align with traditional business
  models. Given this, offering special nonprofit discounts can be a valuable strategy
  to cater to this segment.

  非营利组织是一个需要考虑的重要细分。非营利组织通常具有独特的需要和预算限制，可能与传统商业模式不一致。因此，提供特殊的非营利折扣可以成为满足该细分的宝贵策略。


  To effectively offer nonprofit discounts, consider doing the following:

  为了有效提供非营利折扣，请考虑执行以下操作：


  - Identify and understand the specific needs of nonprofit organizations

  - 识别并了解非营利组织的特定需求

  - Design special packages or tiers tailored to nonprofit requirements

  - 设计针对非营利需求量身定制的特殊套餐或层级

  - Clearly communicate the availability and benefits of nonprofit discounts to attract
  this segment

  - 明确传达非营利折扣的可用性和优势以吸引该细分


  It’s worth noting that on the Salesforce AppExchange, it’s possible to filter apps
  that offer such nonprofit discounts, making it easier for these organizations to
  identify solutions that cater to their needs.

  值得注意的是，在 Salesforce AppExchange 上，可以筛选提供此类非营利折扣的应用，从而使这些组织更容易找到满足其需求的解决方案。


  ## Reviewing and revising your pricing plan


  审查和修订您的定价方案


  As you already know, pricing your AppExchange app is a complex, ongoing process,
  similar to assembling a piece of IKEA furniture. It’s not a one-off task, but a
  recurring one that requires regular adjustments to align with your evolving business
  strategy and the competitive landscape. This involves revisiting your pricing strategy,
  which can be likened to adding a fresh coat of paint or tightening a few screws
  on your IKEA furniture.

  正如您所知，为您的 AppExchange 应用定价是一个复杂且持续的过程，类似于组装一件 IKEA 家具。这不是一次性任务，而是一个需要定期调整以符合您不断发展的业务战略和竞争格局的反复任务。这涉及重新审视定价策略，这可以比作为您的
  IKEA 家具重新涂上一层新漆或拧紧几个螺丝。


  Actively seek customer feedback about your app’s pricing, value, and overall satisfaction.
  This can be done through surveys, customer interviews, or monitoring online reviews
  and social media discussions. For instance, if users find your pricing structure
  too complicated, consider simplifying it.

  积极寻求客户对应用定价、价值和整体满意度的反馈。这可以通过调查、客户访谈或监控在线评论和社交媒体讨论来完成。例如，如果用户认为您的定价结构过于复杂，请考虑简化它。


  Keep an eye on changes in the competitive landscape, including new entrants, competitor
  pricing changes, and market trends. If new competitors enter the market with similar
  offerings at lower prices, you may need to re-evaluate your pricing strategy or
  highlight your unique value proposition to justify your current pricing.

  关注竞争格局的变化，包括新进入者、竞争对手价格变化和市场趋势。如果新竞争对手以更低的价格进入市场提供类似产品，您可能需要重新评估定价策略或突出您的独特价值主张以证明当前定价的合理性。


  As your business evolves, your pricing plan may need to be revised to align with
  new strategic objectives, such as expanding into new markets, targeting new customer
  segments, or launching new product features. For instance, when Salesforce started,
  they had one product with multiple editions and a single price per user. Now, Salesforce
  offers multiple products addressing diverse user needs, with various editions and
  pricing structures that include per-user and transactional costs.

  随着业务的发展，您的定价方案可能需要修订以符合新的战略目标，例如拓展新市场、瞄准新客户细分或推出新产品功能。例如，Salesforce 起步时只有一个产品，包含多个版本和单一的每用户价格。现在，Salesforce
  提供多种产品来满足多样化的用户需求，具有各种版本和定价结构，包括按用户和交易成本。


  Regularly analyze your app’s performance and usage data to identify trends or patterns
  that may indicate the need for pricing adjustments. If you notice a high churn rate
  among users who have signed up for the highest pricing tier, this could be a sign
  that the value delivered at that price point is not meeting customer expectations,
  prompting you to re-evaluate the features and pricing of that tier. You are going
  to learn how to do this in Chapter 10.

  定期分析应用的性能和使用数据，以识别可能表明需要调整定价的趋势或模式。如果您注意到订阅最高定价层级用户的流失率很高，这可能是该价格点提供的价值未达到客户期望的迹象，促使您重新评估该层级的功能和定价。您将在第
  10 章学习如何做到这一点。


  Finally, establish a regular schedule for reviewing and revising your pricing plan,
  such as quarterly or semi-annually. This helps ensure that your pricing remains
  relevant, competitive, and aligned with your business objectives. For Salesforce,
  while they don’t alter their prices frequently, they showcase innovation in their
  approach; new features might be launched as free additions in a new release or initially
  as paid features that may later become free.

  最后，建立定期审查和修订定价方案的时间表，例如每季度或每半年一次。这有助于确保您的定价保持相关性、竞争力并与业务目标保持一致。对于 Salesforce 来说，虽然他们不经常更改价格，但他们在方法上展示了创新；新功能可能作为新版本中的免费增项推出，或最初作为付费功能推出，后来可能变为免费。


  By regularly reviewing and revising your pricing plan, you can ensure that it remains
  aligned with your customers’ needs, the competitive landscape, and your business
  strategy. This proactive approach to pricing management will help you capture the
  maximum value from your app, ensure fair pricing for your customers, and contribute
  to your app’s long-term success in the Salesforce AppExchange ecosystem.

  通过定期审查和修订定价方案，您可以确保其与客户需求、竞争格局和业务战略保持一致。这种积极的定价管理方法将帮助您从应用中获取最大价值，为客户提供公平的定价，并促进应用在
  Salesforce AppExchange 生态系统中的长期成功。


