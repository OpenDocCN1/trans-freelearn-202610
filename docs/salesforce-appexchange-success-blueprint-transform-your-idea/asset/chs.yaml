  网站 https://partners.salesforce.com。


  ## Marginal PNR Program


  过去，ISV 为每种许可类型支付固定的版税费率：OEM 为 25%，ISVforce 为 15%。然而，2020 年带来了改变游戏规则的更新，奖励规模更大、更成功的应用开发者以降低的版税费率。通常，2020
  年 3 月 1 日后加入 AppExchange Partner Program¹⁴ 的合作伙伴将自动获得此福利，而现有合作伙伴也可以申请。


  14

  https://partners.salesforce.com/s/education/appinnovators/AppExchange_Partner_Program?language=en


  当合作伙伴的 **年度订单价值 (AOV)** 达到或超过 $1,000,000 时，他们有资格在未来的订单和附加订单上享受降低的 PNR 费率。随着合作伙伴在
  AOV 区间中的进展，其 PNR 费率相应降低。截至今天（FY24），边际 PNR 计划在下面的表格中概述。然而，重要的是要注意 Salesforce 有权自行决定更新或更改边际
  PNR 计划福利，而不一定提供事先通知。边际 PNR 计划福利是根据 **Salesforce 合作伙伴计划协议 (SPPA)** 提供的计划福利之一，您将在下一章中更全面地了解它：


  | AOV band | OEM Program PNR rate | ISVforce Program PNR rate |

  |---|---|---|

  | <$1,000,000 | 25% | 15% |

  | $1,000,001 - $2,500,000 | 23% | 14% |

  | $2,500,001 - $5,000,000 | 21% | 13% |

  | $5,000,001 - $10,000,000 | 19% | 12% |

  | $10,000,001 - $20,000,000 | 17% | 11% |

  | $20,000,001+ | 15% | 10% |


  请注意，只有 AOV 超过 $1,000,000 的合作伙伴才会对其新业务和附加业务的 PNR 费率进行降低。某些非标准条款可能会使合作伙伴无法加入边际 PNR
  计划福利。


  ## Choosing the right contract for your business


  ![](img/44ed632038957e4c80220676e84c5109_78_0.png)


  欢迎来到伟大的冰淇淋辩论：ISVforce 与 OEM 合同！现在您已经品尝了两种口味，是时候为您的业务选择完美的一勺了。让我们权衡每个选项的糖屑和樱桃，以便您做出明智的决定，选择最适合您的合同。


  首先，让我们考虑您的应用的性质和目标受众。如果您的应用是 Salesforce 圣代上的樱桃，主要面向现有 Salesforce 客户，那么经典的 ISVforce
  合同就是您的首选口味。作为 ISVforce 客户，您可以在 AppExchange 上制作和销售您的甜点创作，利用各种 Salesforce 技术和资源。此外，由于收入分享要求较低以及产品开发和支持方面的灵活性更高，ISVforce
  路线是一个诱人的选择。


  但如果您的应用并非严格的 Salesforce 配料呢？如果您的目标受众包括尚未品尝过 Salesforce 美味的人，那么 OEM——我们的可定制曲奇面团冰淇淋——可能就是适合您的选择。OEM
  可以转售更广泛的技术和附加组件，制作定制品牌解决方案直接销售给客户。然而，这种独特的口味以收入分享要求和合同糖屑的形式带来了更高的价格标签。当针对尚未使用 Salesforce
  的客户时，重要的是要考虑组织和环境设置与维护所带来的额外责任。


  当您思考要采用哪种合作模式时，请考虑所需的定制和集成程度、支持和维护要求，以及 Salesforce 提供的营销和销售资源。仔细品尝每种模式的利弊以及收入分享义务和合同条款至关重要。





  最终，理想的合作伙伴模式并非静态选择，而是一项根据您不断变化的业务目标、需求和资源量身定制的动态决策。随着您了解应用程序的性质、目标受众以及所需的定制和支持程度，您可以采用最能推动业务发展的合作伙伴模式。值得注意的是，合作伙伴关系并非僵化的结构。它们可以，并且有时确实会随着时间的推移而演变。有些合作伙伴被观察到会将其合同从一种模式转移到另一种模式，例如从
  OEM 转向 ISVforce 或反之，甚至同时采用两种合同，以更好地与业务需求保持一致。正如在冰淇淋帝国中一样，成功成长和扩张的关键在于适应不断变化的口味和需求的灵活性。


  ## Blended model


  有时，当您面临 ISVforce 与 OEM Embedded 合同之间的艰难抉择时，您可能会觉得必须在巧克力榛果酱和焦糖漩涡之间做出选择。但如果我告诉您，您可以在一个美味的冰淇淋筒中同时拥有两者呢？


  事实上，ISVforce 和 OEM Embedded 合作伙伴关系可以和谐地协同工作，为您的业务提供全面的解决方案（如果您的应用程序的技术设计满足两种模式的限制）。通过利用两种合作伙伴模式的优势，您可以创建定制的解决方案，满足现有
  Salesforce 客户和平台新用户的需求。


  在做出决定之前，仔细考虑每种合作伙伴模式的技术影响非常重要。此外，强烈建议就此问题与 Salesforce ISV 销售团队进行对话，因为他们拥有宝贵的见解，并且在选择合同时可以提供有用的指导。最终，合适的合作伙伴模式将取决于您的业务目标、需求和资源，并且可能以独特的方式影响您的技术架构和应用程序设计。


