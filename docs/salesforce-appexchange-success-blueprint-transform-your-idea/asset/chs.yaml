  ## AppExchange 的最佳定位 – 应用蓬勃发展的所在


  基于本章的示例和讨论，AppExchange 的理想应用是那些执行以下操作的应用程序：


  -   为 Salesforce 用户提供独特解决方案和优势。你不能仅仅构建 Sales Cloud 或 Service Cloud 的克隆！

  -   简化业务流程，提高效率并改善客户满意度。

  -   利用 Salesforce 平台和生态系统为各规模和行业的企业提供定制化解决方案。

  -   符合 Salesforce 的安全、隐私和可用性标准。

  -   与 Salesforce 平台的优势和局限性保持一致，例如基于 Web 的应用程序、与其他系统的集成以及基于云的解决方案。


  通过构建符合这些标准的应用程序，你可以利用成为 ISV 合作伙伴的好处，并利用 AppExchange 的潜力来扩大客户群、产生经常性收入流，并在 Salesforce
  生态系统中获得可见性和信誉。


  ## 不适合 Salesforce 平台的应用示例


  虽然 Salesforce 提供了构建自定义应用程序的各种工具和功能，但某些应用类型可能与 Salesforce 平台的优势或局限性不一致。以下是一些示例：


  -   **游戏应用：** Salesforce 平台主要为业务应用设计，可能不适合需要高性能图形和处理能力的游戏应用。

  -   **资源密集型应用：** Salesforce 平台可能不适合需要大量计算资源或实时处理的应用，例如复杂的 **机器学习 (ML)** 或数据分析应用。AppExchange
  产品不应尝试在平台上执行此处理，而应与更适合处理复杂处理用例的系统集成。顺便说一下，在 Salesforce 生态系统中，还有其他可用选项。例如，Heroku
  提供了一个专门设计用于处理资源密集型计算任务的强大平台。此外，Salesforce 还提供自己的专有 AI 解决方案，能够有效应对高级数据处理需求。

  -   **独立桌面应用：** Salesforce 平台基于云，主要为基于 Web 的应用设计。需要离线功能的独立桌面应用可能不适合 Salesforce 平台。

  -   **定制硬件应用：** 需要定制硬件或与物理设备集成的应用可能不适合 Salesforce 平台，因为它主要专注于基于软件的解决方案。


  通过了解 Salesforce 平台的局限性，你可以就你的应用创意是否适合做出明智的决定。如果你的应用超出了 Salesforce 平台的范围，你可能需要探索更符合你需求的替代技术或平台。


  ## 面向 Salesforce 客户的软件即服务产品


  此外，AppExchange 市场接受与 Salesforce 集成并为 Salesforce 用户提供独特解决方案的 **软件即服务** (**SaaS**)
  产品。这些 SaaS 公司也可以成为 AppExchange 合作伙伴，并在市场上列出其产品，突出其与 Salesforce 的合作伙伴关系以及其应用的安全性。然而，成为拥有付费应用列表的
  AppExchange 合作伙伴需要与 Salesforce 分享 **净收入百分比 (PNR)**，这也是一些公司选择不成为合作伙伴的原因。公司需要在通过安全审查这一直接的技术方面之外评估成为合作伙伴的业务影响。虽然本书重点介绍在
  Salesforce 平台上构建应用程序，但通过 SaaS 产品与 Salesforce 集成，为企业提供了各种解决方案和应用，既在平台上也在平台外，以根据其独特需求定制和扩展其
  Salesforce 实例。


  ## 了解 ISVforce 与 OEM 的差异


  ![](img/44ed632038957e4c80220676e84c5109_68_0.png)


  Salesforce ISV 合作伙伴世界就像一家冰淇淋店，而你在这里为你的业务选择完美的口味。一边是 ISVforce 合同，另一边是 OEM 合同。两者都很美味，但哪一个最适合你的味蕾？让我们深入细节，帮助你做出正确的选择。


  ### 程序构建类型 – ISVforce


  ISVforce 合作伙伴就像 Salesforce 甜点世界中的经典香草味。他们制作在 Salesforce 平台上构建的应用程序，准备在 AppExchange
  菜单上品尝。ISVforce 合作伙伴可以撒上美味的配料（想想第三方集成）并提供愉快的客户体验。然而，他们必须与 Salesforce 分享一部分收入并遵守平台的开发指南。


  ISVforce 涵盖了几个关键方面，包括以下内容：


  -   在 Salesforce 平台上为 *现有* Salesforce 用户制作和销售美味的应用

  -   在 Salesforce 生态系统中定制和扩展应用

  -   与 Salesforce 分享 PNR

  -   遵守 Salesforce 的开发指南和最佳实践


  ### 为什么选择 ISVforce？


  ISVforce 就像 Salesforce 盛宴中深受喜爱的招牌主菜。这些应用通常以某种方式扩展 Salesforce 的功能——也就是说，它们是生态系统中与主菜相得益彰的美味配菜。许多应用创建者意识到，他们的众多客户和潜在客户已经在
  Salesforce 的餐桌上用餐，他们希望将自己的烹饪创作带到目标市场所在的地方。通常，这涉及以有利于合作伙伴和 Salesforce 的方式增强 Salesforce
  Cloud 提供的服务（例如 Sales、Service、Community 或 Industry Clouds）。


  ISVforce 的另一个诱人之处在于，ISVforce 的客户可以通过自定义对象扩展其应用，从而制作自己的创意混合物。这种额外的灵活性和可扩展性充当了秘密配料，显著扩大了你的总市场机会，提供了一种通常无法通过
  OEM Embedded 解决方案实现的灵活性。虽然 OEM 客户可以为集成目的创建最多 10 个自定义对象，但这些自定义对象的使用受到严格监管，以确保 OEM
  客户不会在既定边界之外构建自定义应用。


  如果你正在制作一个依赖于特定许可证内功能的应用（例如 Customer Communities），客户必须先从 Salesforce 购买许可证，然后才能品尝你的应用。


  ### 程序构建类型 – OEM Embedded


  OEM 就像一种独特的、可定制的曲奇面团冰淇淋。这些合作伙伴将 Salesforce 技术嵌入到自己的解决方案中，为客户创建定制品牌产品。OEM 合作伙伴关系的美妙之处在于可以自由创建独特的
  UX 并直接销售解决方案，而无需在 AppExchange 上列出。然而，需要注意的是，虽然 ISV 合作伙伴没有义务在 AppExchange 市场上发布，但一些
  OEM 合作伙伴确实选择将其应用列在 AppExchange 上。无论列出状态如何，OEM 合作伙伴仍需要与 Salesforce 分享其收入的一部分。


  OEM Embedded 涵盖了几个关键方面，包括以下内容：


  -   将 Salesforce 技术嵌入到定制品牌解决方案中

  -   在 Salesforce 平台之上构建，*不提及* Sales、Service、Marketing、Commerce 或 Industry 云等其他产品

  -   直接向客户销售（即使没有 AppExchange 上架！）

  -   与 Salesforce 分享更高的 PNR


  在品尝这两种口味时，请牢记您的业务目标和需求。例如，一些成功的 Salesforce 合作伙伴选择了 OEM 口味，从而获得了转售经典 ISVforce 不可用的额外技术和附加组件的机会。


  ## Why choose OEM Embedded?


  OEM Embedded 应用主要专注于革新医疗、金融、制造等特定行业垂直领域的基础设施。这些应用能够吸引多样化的客户，无论他们是否正在使用 Salesforce
  平台。需要强调的是，OEM Embedded 解决方案还能在现有 Salesforce 客户组织内部吸引新用户。例如，人力资源部门目前可能未使用 Salesforce，但可能会选择购买
  OEM 产品以满足其特定需求，而销售等其他部门可能已经是 Sales Cloud 的常规用户。


  OEM 嵌入式应用的好处在于可以自由地向现有 Salesforce 客户以及更广泛的受众销售。现有 Salesforce 客户可以像使用 ISVforce 应用一样，轻松地在
  AppExchange 市场中发现、购买和安装 OEM Embedded 应用。此外，对于新客户，可以使用 Trialforce 技术为其配置新的 Salesforce
  组织，而无需直接将他们连接到 Salesforce。需要注意的是，OEM 客户会获得 OEM Salesforce 平台许可，该许可专门用于 OEM 应用的使用。


  与需要从 Salesforce 购买额外许可的 ISVforce 解决方案不同，OEM Embedded 应用仅有两种特定类型的许可可供客户使用，具体如下：


  -   **Lightning 平台（必需）**：允许客户使用 Salesforce 平台，也称为 Salesforce Platform 许可。然而，需要注意的是，从
  OEM 合作伙伴获得的许可专门用于访问和使用合作伙伴解决方案。为了扩展合作伙伴解决方案的功能，最终用户被允许为每个解决方案创建、访问和使用额外的 10 个自定义对象。然而，这些自定义对象仅限于与合作伙伴解决方案一起使用。请注意，这些合同限制不会自动执行。客户有责任确保他们没有设置超过
  10 个自定义对象或以不允许的方式使用它们。

  -   **客户社区（可选）**：使 OEM 客户的客户或合作伙伴能够访问 OEM 应用的指定部分，促进他们与其数据的交互。


  最终，ISVforce 与 OEM 合同之间的选择取决于多种因素，包括您业务对定制的渴望、对额外技术的访问、收入分享以及您 **进入市场 (GTM)** 策略中的现有用户群。必须考虑目标用户是否已拥有
  Salesforce 许可，因为这会显著影响任一选项与业务目标的适用性和一致性。然而，这一决定伴随着权衡：与 ISVforce 相比，OEM 合作伙伴需要与 Salesforce
  分享更高的 PNR。


