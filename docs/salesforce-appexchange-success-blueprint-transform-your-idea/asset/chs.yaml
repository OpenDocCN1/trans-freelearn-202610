  ### Activity summary


  AppExchange Marketplace Analytics 中的活动摘要部分提供有关您列表的关键指标。它包括磁贴浏览、磁贴悬停、访问者、线索事件和安装的摘要。趋势指标将指标表现与之前的时间段进行比较。默认情况下，Marketplace
  Analytics 显示过去 30 天的指标，但您可以选择其他固定时间段或定义自定义日期范围。


  ### Filters


  AppExchange Marketplace Analytics 提供全局和本地过滤器以聚焦相关数据。全局过滤器适用于活动摘要和所有可视化中的数据，而本地过滤器仅适用于单个可视化中的数据。您可以选择特定列表或固定时间段进行分析，选择要在可视化中显示的流量来源，选择要显示的活动指标、要显示的线索事件类型或要显示的
  AMP 推广活动。


  ### Visualizations


  AppExchange Marketplace Analytics 提供各种可视化以跟踪趋势并为您的列表识别机会。其中一种可视化是活动来源时间线，它显示在指定时间段内内部和外部流量来源如何为您的列表活动做出贡献。


  ### Accessing and navigating AppExchange Marketplace Analytics


  访问 AppExchange Marketplace Analytics 通过 Salesforce Partner Community 授予。为了让您的团队获得访问权限，必须在
  Salesforce Partner Community 中分配 **管理列表** 权限。此权限不仅启用对 AppExchange Marketplace Analytics
  的访问，还可访问所有 Partner Console 功能，包括创建、编辑和发布列表的能力。


  一旦分配了必要的权限，导航到 AppExchange Marketplace Analytics 非常简单。登录 Salesforce Partner Community
  后，您应前往 Partner Console。从那里，选择 **发布**，然后 **主页** > **分析**。这将向您展示一个列表列表，您可以从中选择要查看的列表。


  ### Exporting data for further analysis


  AppExchange Marketplace Analytics 允许您导出数据以在 Salesforce 或其他工具中进行进一步分析。数据以 **逗号分隔值
  (CSV)** 格式导出，并应用全局和本地过滤器。


  AppExchange Marketplace Analytics 提供的数据适用于 2019 年 8 月起在您的列表上发生的活动。它仅


  提供与您已发布列表相关的数据。虽然 AppExchange Marketplace Analytics 没有 API，但您可以以 CSV 格式导出原始数据以供其他工具处理。


  AppExchange Marketplace Analytics 不支持导入外部数据。但是，您可以导出数据并使用其他工具将其与外部数据合并。还需要注意的是，安装、演示和试用次数的总和可能与
  AppExchange Marketplace Analytics 中的潜在客户数量不匹配。这种差异可能是由于贵组织中 **Web-to-Lead** 设置存在问题所致。


  ## 自定义可视化


  尽管仪表板的布局以及单个可视化的样式或格式无法修改，但 AppExchange Marketplace Analytics 仍允许进行一些自定义。从全局筛选菜单中，您可以调整可视化中显示的时间段。在可视化内部，您可以选择要显示的活动指标，并且对于某些可视化，还可以更改时间尺度。


  ## 了解客户互动


  AppExchange Marketplace Analytics 在客户安装您的解决方案时会记录多个互动。例如，当客户在您的列表上点击 **立即获取** 时，这会被记录为一次
  **立即获取** 点击。客户选择软件包的目标位置并同意条款和条件后，点击 **确认并安装** 会被记录为一次安装。然而，LMA 中的许可证记录数量可能并不总是与
  AppExchange Marketplace Analytics 中显示的安装次数一致，因为这取决于客户是否完成安装过程。


  ## AppExchange 搜索机制


  可发现性对您在 AppExchange 上的产品成功至关重要，而这通常始于对搜索机制的充分理解。AppExchange 搜索由关键词相关性、参与度、列表体验和
  **机器学习**（ML）驱动，提供符合客户需求的搜索结果。理解这些因素可以帮助您优化列表并提高可见性。


  ## 关键词相关性


  列表中的文本与客户搜索词的匹配程度决定了其关键词相关性。匹配度越高——尤其是在标题、标语和简短描述中——列表的可见性就越高。适当使用反映潜在客户需求的关键词至关重要。


  ## 参与度


  参与度是根据客户活动（如查看屏幕截图、试用和安装应用）衡量的列表受欢迎程度。参与度更高的列表，由于客户互动更多，在搜索结果中的排名会更高。


  ## 列表体验


  列表体验考虑了关键词相关性和参与度之外的因素。这些包括您与 Salesforce 合作的各个方面，例如参与特定计划、评论的数量和质量，以及解决方案更新的及时性。


  要充分利用 AppExchange 搜索机制，您可以使用 AppExchange Marketplace Analytics。该工具提供有价值的数据，可帮助您了解列表在搜索结果中的表现，从而做出明智的改进。以下屏幕截图展示了该工具，展示了
