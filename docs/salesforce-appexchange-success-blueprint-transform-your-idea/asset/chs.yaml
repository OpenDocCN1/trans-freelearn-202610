  \n当我们准备踏上这场激动人心的远征时，请记住，各位探险家，旅程可能艰难，但山顶的景色值得每一步。所以，系紧靴带，背好背包，让我们踏上通往运营卓越的激动人心之旅！\n\
  \n## Building efficient processes and workflows\n\n![](img/44ed632038957e4c80220676e84c5109_441_0.png)\n\
  \n就像经验丰富的探险家踏入未开垦的森林的第一步，踏上 Salesforce AppExchange 之旅的 ISV 必须规划出清晰的前进道路。这些道路不仅仅是写在旧羊皮纸上的潦草方向——它们代表着你的结构化流程和工作流，是保持运营生命血液顺畅流动的重要血管。设置得当时，它们能确保每个任务和职责都像拼图块一样完美契合你的生态系统。\n\
  \n没有这些道路，你的丛林探险可能会变成混乱的奔跑，每个人都像喝了咖啡的猴子一样到处乱窜。任务会变得杂乱无章，灌木丛（角色和职责）会绊倒你，眨眼间你就会面朝下摔进困惑和低效的泥坑。泥面膜对皮肤可能很好，但对你的业务健康绝对不利！\n\
  \n为了确保我们的运营像潜行的丛林猫一样敏捷，而不是像初学走路的小象一样笨拙，我们需要手持信赖的砍刀（流程工具），深入运营流程的灌木丛中。\n\n创造新产品最令人兴奋的部分往往是体验的新鲜感。第一次做某事不仅是创新的机会，也是建立围绕其功能流程的机会。如果某种方法被证明成功，将其记录为正式流程就能创建一个可复制的框架。此文档随后成为流程的初始版本，你可以在此基础上不断迭代改进。要更深入地了解如何实施高效的工作流和流程，让我们在下一节中探索关键策略和技术。\n\
  \n## Process implementation\n\n在设计和执行高效工作流的过程中，管理基础课程中的某些原则可能非常宝贵。以下是你如何在 ISV 之旅中运用它们的方法：\n\
  \n- **流程映射**：该技术涉及概述执行任务或实现特定结果所涉及的每个步骤。通过创建事件序列的可视化表示，你可以更好地理解工作流，识别潜在的低效之处，并突出改进机会。\n\
  - **利用自动化**：借助 Salesforce 的自动化工具套件，如 Flow Builder，你可以自动化重复性任务。这不仅提高了运营效率，还能让你的团队专注于战略性和复杂性问题。\n\
  - **标准化和文档化**：通过标准化流程来创建执行任务的统一方法。文档确保这些标准化流程被理解并为所有人所用，保证一致性，并在人员变动期间提供参考点。\n-\
  \ **持续改进**：培养持续改进的心态。定期根据反馈、不断变化的业务需求以及 Salesforce 技术的进步来审查和完善你的流程和工作流。\n- **绩效指标**：定义关键绩效指标以衡量流程的有效性。定期使用这些指标进行评估可以找出需要关注的领域并跟踪已实施更改的成功情况。\n\
  \n\n\n-   **包容性决策：** 让你的团队参与到设计和完善工作流程的过程中。他们的独特见解和集体认同可以带来更稳健、更有效且可持续的流程。\n\n创建高效的流程和工作流是一个持续不断的努力。它需要持续的分析和适应性，以确保与不断变化的业务需求和行业趋势保持一致。作为\
  \ ISV，您在 Salesforce AppExchange 生态系统中的运营成功的基础在于有效、敏捷且有韧性的流程和工作流。\n\n## 示例 – 客户试用结论\n\
  \n假设您利用 Trialforce 为潜在客户提供产品的试用期。此试用阶段是潜在客户体验产品并评估其价值的关键时期。因此，对于 ISV 来说，建立有效的流程来管理这一时期至关重要。ISV\
  \ 常用的流程包括在试用期临近结束时管理沟通、必要时延长试用期，以及在 **合作伙伴业务组织（PBO）** 中更新商机记录的状态。\n\n### 流程概述\n\n\
  例如，作为 ISV，您可以使用 Salesforce 的 Flow 创建一个自动化流程。该流程可以在试用期结束前若干天向与客户试用相关的客户经理触发通知。此提醒可以促使客户经理联系客户，解答任何待处理的疑问，并在客户决定继续使用产品时帮助他们转为付费订阅。\n\
  \n该流程的另一个关键部分可以是在需要时延长试用期。有时，客户可能需要在做出购买决定前有更多时间探索产品。\n\n### 申请试用组织延期\n\nSalesforce\
  \ 为合作伙伴提供申请其 **Trialforce 源组织（TSO）**、演示或测试组织或客户试用组织延期的机制。以下是流程：\n\n-   1. 登录 **帮助与培训**。\n\
  -   2. 选择 **创建案例**。\n-   3. 填写 **主题** 和 **描述** 字段。\n-   4. 等待几秒钟后，选择 **选择不同的产品/主题**。\n\
  -   5. 选择 **合作伙伴计划与权益** > **试用组织延期**。\n-   6. 在指定字段中输入所需信息并提交。延期将自动应用于该组织。\n\n客户试用组织每次申请可延长最多\
  \ 90 天。请确保每个组织 ID 仅提交一次申请。\n\n最后，您流程的最后一步可以是更新 PBO 中相关商机记录的状态。这样，您的销售团队可以跟踪客户的旅程，从试用阶段到可能转为付费客户。\n\
  \n通过实施这种系统化的方法，您可以更高效地管理试用期的结束。这增强了客户在关键试用阶段的体验，并提高了将他们转化为长期付费客户的机会。\n\n除了高效管理试用期之外，建立健全的客户支持流程也至关重要。在下一节中，我们将探讨确保高质量客户支持的策略和最佳实践，这在客户满意度和业务增长中发挥着至关重要的作用。\n\
  \n## 确保高质量的客户支持\n\n![](img/44ed632038957e4c80220676e84c5109_447_0.png)\n\n在我们的 Salesforce\
  \ AppExchange 探险中，将技术支持视为一艘可靠的河船，载着我们穿越客户查询的汹涌水流。它不仅仅是用于故障排除的谦逊工具——它更是指引我们驶向业务成功彼岸的战略指南针。尤其当您在订阅软件的水域中划桨时，这段旅程不是一次性的巡游，而是一系列续订，乘客（即客户）的满意度才是让河船保持航行的关键。\n\
  \n想象每一次客户查询都是一波冲击我们船只的湍流。若处理不当，它可能会使船倾覆，让我们珍贵的货物（客户满意度）沉入深渊。但在专家桨手（我们熟练的支持主管）手中，每一波浪都可以用技巧和自信来驾驭，让乘客保持干燥，船只保持航向。\n\
  \n技术支持的作用在客户旅程的初始阶段尤其关键。负面体验会留下持久印象，并可能影响 AppExchange 评价。这些评价提供了公众对您公司及其产品服务的认知，塑造了品牌在市场中的形象。\n\
  \nSalesforce 生态系统中的技术问题可能源于多种地方，包括您应用程序的复杂性、Salesforce 平台本身或单个客户组织。鉴于这些领域的复杂性，挖掘问题的根本原因可能具有挑战性。因此，拥有一个有能力的团队和正确的工具来分析和解决问题至关重要。\n\
  \n随着 Salesforce 平台定期推出更新和新功能，ISV 必须保持最新状态以避免累积技术债务。忽视这些变化可能导致技术支持团队面临更大的挑战。诸如回归测试、安全扫描和\
  \ API 交互等常规活动可以帮助维护应用程序的健康状况并减轻支持挑战。\n\n领先的 ISV 在高管层面整合其产品开发、客户成功和技术支持团队。他们仔细监控\
  \ AppExchange 评价并及时响应。对团队技术能力的评估以及确保问题解决所需工具的可用性也同样被优先考虑。\n\n不要忘记，技术支持的角色远不止解决技术问题。它关乎确保客户成功并推动业务增长。一个结构良好且有效的技术支持团队是\
  \ Salesforce AppExchange 生态系统中成功商业配方中的关键成分。\n\n### 支持 RACI 矩阵\n\n将 **负责**、**问责**、**咨询**、**知情**\
  \ (**RACI**) 矩阵应用于您的技术支持流程可以带来变革。这种角色和职责的清晰度有利于高效的决策和资源利用。\n\n让我们通过一些示例来分解：\n\n\
  -   **负责**：这些是执行活动或做出决策的个人或团队。例如，应用程序工程师可能负责解决客户报告的技术问题。他们是冲在第一线的人，亲力亲为以确保问题得到及时解决。\n\
  -   **问责**：这些是拥有决策或活动结果的人。例如，支持主管可能对支持团队的整体绩效负责问责，确保问题在约定的 **服务等级协议（SLAs）** 内得到解决并令客户满意。\n\
  -   **咨询**：那些征求意见并进行双向沟通的人。例如，产品开发团队可能会被咨询关于多个客户报告的持续性错误。他们的专业知识对于制定解决方案或变通方法至关重要。\n\
  -   **知情**：那些被告知进展的人，通常仅在任务或决策完成后才会被告知。他们通常不需要被咨询，也不直接参与任务或决策。在 ISV 的背景下，销售团队可能会被告知可能影响其客户关系或潜在交易的重要问题。\n\
  \n为了说明这在现实场景中如何运作，请考虑一位客户报告了您应用的严重问题。应用程序工程师（*负责*）着手解决问题，如有必要会与产品开发团队（*咨询*）密切合作。支持主管（*问责*）监督整个流程，确保一切顺利进行并及时解决问题。一旦问题解决，销售团队（*知情*）会收到解决情况的更新，以确保其能够向客户通报并有效管理关系。\n\
  \n在技术支持流程中实施 RACI 矩阵可确保清晰的沟通、有效的决策，并最终提高客户满意度。\n\n### 在技术支持中平衡主动与被动方法\n\n\n\n驾驭动态的\
  \ Salesforce AppExchange 生态系统，要求 ISV 在技术支持中保持主动与被动技术的平衡。\n\n## 主动技术支持\n\n主动技术支持旨在预见并在问题影响客户前加以纠正。这涉及跟上可能影响您应用程序的\
  \ Salesforce 生态系统中的变化和更新。\n\n定期针对 Salesforce 更新对您的应用程序进行回归测试就是一个例子。通过及早发现潜在问题，您可以保护客户免受未来的并发症。领先于即将到来的\
  \ Salesforce 变化并培训团队应对这些变化，可以防止许多被动支持需求。\n\n应用程序使用情况和客户行为监控也可以提供潜在问题区域的见解。例如，识别某些应用功能反复出现的问题可以促使创建有针对性的教育内容，甚至激发功能重新设计以获得更好的用户体验。\n\
  \n## 被动技术支持\n\n当客户遇到问题并寻求帮助时，被动技术支持就会介入。这种方法侧重于处理紧急案例，虽然必要，但不应成为您支持策略的全部。\n\n快速有效地解决客户问题可以显著提升他们对您服务的认知。然而，完全依赖被动支持可能会导致未解决问题的积压和潜在的不满客户，尤其是在您的应用程序服务于大量用户或具有复杂功能的情况下。\n\
  \n被动支持还提供了有关客户体验的丰富数据。对被动支持事件的分析可以揭示应用程序中持续存在的问题和改进机会。\n\n## 沟通与支持工具\n\n在被动技术支持中，沟通是关键组成部分之一。使用您的\
  \ PBO 可以帮助集中支持案例的相关信息。如果您使用 Communities，它具有允许客户创建自己的案例的优势，从而赋予他们权力并确保透明度。采用标准的 Service\
  \ Cloud 功能可让您定义案例里程碑，确保客户获得高质量的支持体验。\n\n对于关键问题，即使没有太多进展可报告，定期向客户更新也很重要。这里“no-update\
  \ update”概念至关重要。本质上，这涉及告知客户问题仍在处理中，并设定下次更新提供的预期。这种透明的沟通可以在问题解决期间增强客户的信任和耐心。\n\n\
  ## 取得平衡\n\n最佳技术支持策略兼顾主动和被动措施。主动性最大限度地减少了被动支持需求，使您的团队在需要时能够提供即时有效的帮助。通过高效处理被动支持事件，您可以提升客户满意度并收集主动举措所需的关键信息。\n\
  \n## SLA、服务等级目标和支持管理\n\nSLA 是 **服务提供商 (SP)** 与其客户之间的合同，规定了客户可以期望的服务标准。然而，嵌入在 SLA\
  \ 中的是 **服务等级目标 (SLOs)**，即服务必须实现的具体、可衡量的绩效目标。虽然 SLA 提供了总体承诺，但 SLO 指定了该承诺内的详细期望。在\
  \ Salesforce AppExchange 生态系统中，ISV 通常与其客户签订 SLA，规定不同类型支持请求的商定解决时间。\n\n作为 AppExchange\
  \ 合作伙伴，您的客户很可能会询问您的 SLA。客户需要知道他们可以依靠您及时有效地解决问题，而 SLA 为他们提供了必要的保证。\n\n## 设计您的支持流程\n\
  \n您提供的支持类型以及您可以承诺的相应 SLA 将在很大程度上取决于支持团队的结构。一些组织拥有全天候 24/7 的专职团队来处理和解决客户查询，这使他们能够承诺更快的响应时间。其他组织可能仅在单个时区的标准工作时间内运营，这可能导致更长的解决时间。\n\
  \n无论支持团队的结构如何，明确定义您的支持流程并将其传达给客户都至关重要。它有助于设定切合实际的期望并为事件解决提供清晰的路线图。\n\n## Salesforce\
  \ 平台影响\n\n对于利用 Salesforce 平台的 AppExchange OEM 合作伙伴而言，了解 Salesforce 的一些固有 SLA 限制非常重要。例如，虽然\
  \ Salesforce 承诺高可用性，但仍可能出现停机或性能下降的情况。了解这些细微差别可以帮助您更好地管理客户期望。\n\nSalesforce 不使用标准\
  \ SLA，而是使用主订阅协议¹。它承诺使用“商业上合理的努力”全天候 24/7 提供服务。Salesforce 的正常运行时间记录超过 99.9%²，并提供社区页面以获取实时系统性能信息。\n\
  \n1\nhttps://www.salesforce.com/content/dam/web/en_us/www/documents/legal/Salesforce_MSA.pdf\n\
  \n2 https://engineering.salesforce.com/the-salesforce-trusted-infrastructure-3cfdd72e270/\n\
  \nSalesforce 的停机时间可以是计划内的（用于维护）或非计划内的（由于系统故障或不可预见的情况）。计划性停机对于系统升级和检查是必要的，通常会提前公告。然而，Salesforce\
  \ 可根据需要更改这些日期。非计划性停机可能具有破坏性，因为它会毫无通知发生。尽管 Salesforce 承诺在这些期间保留数据，但体验可能令人不安。\n\n\
  Salesforce 停机时间对企业可能产生重大影响。计划性停机可能会破坏业务流程，尤其是在维护日期更改时。非计划性停机可能导致业务中断、财务损失和客户信任丧失。即使数据安全，在这些期间缺乏访问权限也可能造成危害，尤其对严重依赖\
  \ Salesforce 的企业而言。\n\n## 支持流程 KPI\n\n**关键绩效指标 (KPIs)** 在任何支持环境中都是必不可少的，因为它们有助于衡量支持流程的有效性。以下是与\
  \ AppExchange 合作伙伴相关的一些关键支持 KPI：\n\n- **首次响应时间 (FRT)**: 此指标衡量从客户提交请求到支持代理首次响应的时间。较低的\
  \ FRT 可以极大地提升客户满意度。\n- **解决时间**: 此指标衡量支持问题在报告后解决的速度。SLA 通常会定义解决时间。\n- **客户满意度评分\
  \ (CSAT)**: 此评分衡量客户对支持服务的满意程度。可以在每个已解决案例后发送 CSAT 调查来衡量此指标。\n- **工单量**: 此指标衡量特定时间范围内收到的支持工单数量。它可以帮助识别支持高峰时段或可能需要更全面解决方案的反复出现的问题。\n\
  - **首次联系解决率 (FCR)**: 此指标衡量客户问题在首次互动中无需进一步跟进即可解决的频率。\n\n## 利用 Service Cloud 功能\n\n\
  您的 PBO 为管理和跟踪客户案例提供了出色的平台，确保遵守 SLA。Salesforce Service Cloud 提供了多种有效案例管理的功能，包括以下内容：\n\
  \n- **案例管理**: 跟踪所有客户案例，捕获所有必要细节，并根据特定标准自动分配案例。它允许快速高效地解决客户问题。\n- **里程碑**: 在客户时间表中设置并监控关键案例解决里程碑。这些可以帮助确保您的团队满足\
  \ SLA 中设定的期望。\n- **授权**: 根据客户的合同或许可定义和管理客户有权获得的支持服务。\n\n## 订阅者支持控制台\n\n订阅者支持控制台是一个强大的平台，允许\
  \ ISV 获得有关其订阅者的详细见解。它使您的技术支持团队能够查看订阅者的配置、许可状态和数据等有价值的信息，从而简化故障排除过程。此外，如果需要，订阅者可以授予您的团队登录访问权限，以便深入其组织并解决您应用程序中的问题。\n\
  \n## 运营订阅者支持控制台\n\n使用订阅者支持控制台，您可以完成以下几个关键功能：\n\n- **访问订阅者信息**: 要快速查看订阅者详细信息，您可以从\
  \ **许可管理应用 (LMA)** 中的 **订阅者** 标签点击订阅者的组织名称以导航到 **订阅者概览** 页面，或者您可以在账户或许可级别添加直接按钮。这种替代方法允许您绕过\n\
  \n搜索并可能提供更好的访问控制。在这里，您可以查看有关订阅者和其组织设置的详细细节。\n\n- **请求并获取登录访问权限**：如果为了解决问题需要直接登录订阅者的组织，您可以使用控制台请求访问权限。订阅者也可以主动在其自己的组织内授予访问权限，方法是导航到\
  \ **设置 -> 我的个人信息 -> 授予账户登录访问权限** 并选择您的 AppExchange 产品名称。出于安全原因，授予 ISV 合作伙伴访问权限的最长期限为\
  \ 1 个月。获得授权后，您可以以订阅者身份登录并查看其配置和数据以协助解决问题。\n- **登录订阅者组织**：登录订阅者组织受用户权限管控，可能需要 **多因素身份验证\
  \ (MFA)**。此要求通过验证访问订阅者组织的用户的身份来增强安全性。\n\n在利用订阅者支持控制台提供的广泛功能时，以下某些最佳实践可以提高其效能并确保安全的故障排除过程：\n\
  \n- **创建审计跟踪**：在每次登录订阅者组织之前在 **许可管理组织 (LMO)** 中记录一个案例将创建可追踪的记录。此跟踪提供了有关何时以及为何需要访问订阅者组织的问责和透明度。\n\
  - **访问控制**：为保护客户数据和配置的安全性，请将登录访问权限限制在受信任的支持和工程人员。此做法可保护订阅者组织，因为登录会授予对客户数据和配置的完全读写访问权限。\n\
  - **利用调试工具：** 使用 Apex 调试日志来排查特定问题。您可以生成这些日志以查看托管包的输出，这有助于排查特定于该订阅者的问题。此外，以用户身份登录时，您可以查看和编辑托管包中受保护的自定义设置所包含的数据。\n\
  \n## 通过 AppExchange Checkout 最大化收入\n\n![](img/44ed632038957e4c80220676e84c5109_459_0.png)\n\
  \n在我们继续探索 Salesforce AppExchange 领域时，想象一下偶然发现 AppExchange Checkout 之谷，一个点缀着自动收银机的如画场景。这些并不是普通的收银机；它们是复杂的工具，可直接从您的\
  \ AppExchange 列表中顺畅并自动化客户的购买流程。就好像我们在这个庞大的生态系统中中间设立了一个繁忙的露天市场。\n\n但与任何市场设置一样，了解地形至关重要。您必须确保您的产品包装整齐（作为托管包分发），并且您的摊位符合一般市场设置，因为\
  \ Checkout 不能与 OEM 应用一起使用。本节是您的导游，带领您穿过市场摊位，指出 AppExchange Checkout 的细微差别，并提供技巧，使您的商店成为所有人的首选目的地。\n\
  \n所以，卷起袖子，拿起收银机，让我们在 AppExchange Checkout 之谷搭建最好的市场摊位，让我们亲爱的客户的购买过程变得轻松自如。您说呢？准备好开始设置了吗？\n\
  \n## AppExchange Checkout – 通过自动化实现运营效率\n\n建立在 Stripe 领先的行业平台之上，AppExchange Checkout\
  \ 使客户能够通过信用卡或银行转账支付您的解决方案，从而提升他们的购买体验。除此之外，您还可以使用优惠券和试用版激励购买，同时管理 **增值税 (VAT)**\
  \ 和美国销售税。\n\n一个显著的功能是自动许可配置。每次通过 Checkout 完成的购买都会在 LMA 中触发许可证记录的创建。所有操作，包括升级、续订或取消，都会自动更新到许可证中，减少了人工干预和潜在错误。\n\
  \n将 AppExchange Checkout 与 CMA 配对可提供进一步的运营优势。CMA 将 Salesforce CRM 的功能带到 Checkout，提供有关收入、订阅状态等的洞察。它还能够为关键事件发送可自定义的通知，例如试用期到期和付款被拒。\n\
  \n## 财务影响和收入分成\n\n截至 2023 年³，与 Salesforce 的收入分成根据付款方式而有所不同。对于银行转账，通常为 15%，取决于您是否参与\
  \ *第 1 章* 中描述的 Marginal PNR 计划。对于信用卡付款，在撰写本书时，为 15% 加上 Stripe 征收的每笔交易 0.30 美元的费用。例如，如果您以每月每用户\
  \ 50 美元的价格出售应用，并且客户通过银行转账购买 10 个许可证，您与 Salesforce 的分成将为每月 75 美元，占每月总交易额 500 美元。\n\
  \n3 您可以在此链接确认 Checkout 定价是否保持不变：https://developer.salesforce.com/docs/atlas.en-us.packagingGuide.meta/packagingGuide/appexchange_checkout_rev_share.htm\n\
  \nCheckout 支持一次性付款和订阅付款计划。您可以按每用户或按公司收费，为您的定价策略提供灵活性。虽然一次性付款在购买时向客户收取一次费用，但订阅计划按月或按年定期向客户收费。\n\
  \n## 将 AppExchange Checkout 应用于您的业务\n\n实施 AppExchange Checkout 需要某些步骤。首先，您需要使用 Stripe\
  \ 设置一个账户。接下来，应在您的 Stripe 控制面板中创建产品和定价计划，设置解决方案的费用、货币和计费频率。可以通过在 Stripe 中请求付款方式来启用银行转账。获得批准后，您可以开始接收银行付款。\n\
  \n然后，您可以在 AppExchange 列表上启用 Checkout。您还可以通过修改 AppExchange 列表 URL 来预览客户体验。为了满足国际客户的需求，请确保您的公司位于\
  \ Stripe 支持的国家/地区。如果当地税务机关要求，请在发布控制台中启用增值税。\n\n为了提高安全性，Checkout 支持 **强客户认证 (SCA)**，这是\
  \ **欧洲经济区 (EEA)** 在线付款所需的身份验证步骤。\n\n## 有效管理订阅\n\nAppExchange Checkout 使您能够有效管理订阅。您可以处理与\
  \ Checkout 订阅相关的客户请求，例如查看付款历史、添加或删除许可证以及取消订阅。这有助于改善客户服务和满意度。\n\n## 使用 AppExchange\
  \ Checkout 的限制\n\n虽然 AppExchange Checkout 提供了一种简化和自动化的解决方案来简化客户的购买体验，但认识其局限性至关重要。这些包括以下内容：\n\
  \n- **单个列表不支持多种价格点**：AppExchange Checkout 最显著的限制之一是无法为单个列表支持多种价格点。这对采用免费增值模式或具有多个定价层级的企业构成挑战。希望提供各种套餐或层级的企业需要找到替代方式来展示定价，或考虑为每个价格点创建单独的列表。\n\
  - **交易定制不灵活**：虽然 AppExchange Checkout 自动化了付款流程，但这种自动化是以灵活性为代价的。根据客户的独特情况定制交易变得具有挑战性。例如，您会遇到以下限制：\n\
  \  - **延迟计费**：您无法提供将计费推迟到未来日期的协议。\n  - **合同修改**：如果客户的法务部门有特定要求，通过 Checkout 修改合同条款可能不可行。\n\
  \  - **附加功能或支持级别**：直接为单个客户 upselling 或自定义功能和支持级别不受支持。\n\n\n\n-   **多年合同：** Checkout\
  \ 不原生支持通过多年合同建立的长期关系。\n-   **地理限制：** AppExchange Checkout 依赖于 Stripe，这意味着您的业务必须位于\
  \ Stripe 支持的国家/地区。虽然 Stripe 覆盖范围广泛，但仍有许多国家/地区不可用。此限制可能会阻碍以全球受众为目标的企业。\n-   **复杂的税务影响：**\
  \ 尽管系统管理增值税和美国销售税，但对于税务要求复杂或在税务制度复杂的国家运营的企业而言，自动化解决方案可能不足。\n-   **过度依赖 Stripe：**\
  \ 由于 Checkout 建立在 Stripe 平台上，Stripe 的任何更改、更新或问题都可能直接影响您的 Checkout 体验。及时了解 Stripe\
  \ 的政策和更新至关重要。\n\n虽然 AppExchange Checkout 提供了许多优势，但企业必须权衡这些优势与限制。根据您的业务模式、客户群和地理重点，AppExchange\
  \ Checkout 可能是完美的解决方案，或者您可能需要考虑本章后面描述的替代方法，或补充方法以满足您的特定需求。\n\n## 利用 CMA 实现运营卓越\n\
  \n作为 ISV 合作伙伴，运营卓越的重要组成部分是对产品供应进行有效管理和监控。Salesforce 为此提供了一个强大的工具：**结账管理应用（CMA）**。CMA\
  \ 与 AppExchange Checkout 集成，在用户友好的仪表板上展示有价值的数据，并为关键活动启用自动电子邮件通知。在这里，我们深入探讨 CMA。\n\
  \n## 利用 CMA 仪表板的强大功能\n\nCMA 仪表板提供您 AppExchange Checkout 数据的全面视图。预配置的显示包括以下内容：\n\n\
  -   **月收入**：跟踪财务绩效变得轻而易举，有助于财务预测和规划\n-   **每月新订阅用户**：增长趋势变得清晰可见，为营销策略和客户获取工作提供参考\n\
  -   **按单位的订阅计划**：揭示客户偏好，为产品开发提供洞察\n-   **月度订阅状态**：监控试用、购买和续订，实现主动客户互动\n\nCMA 仪表板可使用标准\
  \ Salesforce 工具进行自定义，让您深入挖掘客户数据、订阅计划、发票和交易，以获得更精确的分析。\n\n## 通过电子邮件通知简化沟通\n\nCMA\
  \ 为典型的合作伙伴情况启用自动电子邮件通知，包括续订通知。您可以根据需要启用、自定义和使用这些通知，体现公司的品牌和身份，同时与客户和团队成员保持联系。\n\n\
  ## 开始使用并自定义 CMA\n\n实施 CMA 涉及将其安装到您的 PBO 中，配置数据访问级别，并根据需要启用电子邮件通知。然后您可以进一步自定义 CMA\
  \ 以满足您的特定需求。例如，通知可以增加指向额外资源的链接，例如设置文档，或报告可以修改为显示特定产品的年度收入，而不是默认的月收入。\n\n## 管理 CMA\
  \ 设置以增强控制\n\n管理员用户有权管理 CMA 何时向谁发送电子邮件，更改关联的 Stripe 账户，并手动将数据重新导入 Salesforce 组织。此外，您可以在\
  \ CMA 中配置日志以协助故障排除，提供额外的控制层。\n\n## 使用 COA 实现高效的渠道订单管理\n\n![](img/44ed632038957e4c80220676e84c5109_467_0.png)\n\
  \n踏上运营卓越之旅，AppExchange 合作伙伴的道路就像一位雄心勃勃的登山者穿越 COA 山脉的跋涉。想象 COA 是我们的攀爬装备——可靠、可信赖，对于攀登这些雄伟的高峰至关重要。这款工具不仅仅是徒步者的配件；它是管理订单的高效指挥中心。\n\
  \n本节是夏尔巴人，引导您穿越高效订单管理常常崎岖但回报丰厚的地形。我们将指导您如何搭建大本营（创建订单）、如何规划攀登（管理订单），以及何时呼叫支援（修复订单错误）。正如登顶的激动在于克服复杂的攀爬挑战，我们在途中也会解开复杂的运营难题。\n\
  \n所以，系好安全带，检查攀爬装备，准备攀登 COA 山脉，从那里您的运营将展现在您脚下，有条不紊且令人惊叹，如同从山顶俯瞰的景色。\n\n## 什么是渠道订单应用（COA）？\n\
  \nCOA 是预装在您的 PBO 中的应用程序，可实现高效的订单处理。其用途因合作伙伴类型而异，如下所述：\n\n-   **面向 OEM：** COA 有助于提供\
  \ Salesforce 许可证并进行收入分成安排\n-   **面向 ISVforce：** COA 主要支持收入分成\n\n需要注意的是，使用 AppExchange\
  \ Checkout 管理客户付款的合作伙伴不应使用 COA，因为在这种情况下，收入报告会在客户购买您的 AppExchange 解决方案时自动处理。\n\n\
  ## 培训和访问权限\n\n鉴于 COA 在订单管理中的关键作用，Salesforce 要求所有 AppExchange 合作伙伴在使用前接受培训。此培训由合作伙伴运营团队提供，确保\
  \ ISV 了解如何充分利用 COA 的全部功能。因此，使用 COA 的初始步骤包括获取您的 PBO，通过解决方案安全审查，并报名参加 COA 培训。本章假设您已熟悉强制培训中的基础知识，并旨在深入探讨\
  \ COA 处理复杂场景的潜力以及将其集成到当前工作流程中。\n\n## COA 的重要性\n\n在向终端客户完成销售后，所有订单都需要通过 COA 传递给 Salesforce。该平台允许合作伙伴下达客户订单并向\
  \ Salesforce 报告其销售情况。在收到您的订单后，Salesforce 负责在客户组织中激活或配置产品。此过程确保收入分成按照 Salesforce\
  \ 合作伙伴协议的条款进行跟踪。\n\n## COA 中的订单类型\n\n每个向终端客户销售的应用程序订阅都要求通过 COA 向 Salesforce 提交订单。此类订单必须在收到相应客户订单后一天内提交。COA\
  \ 根据各种客户场景提供一系列订单类型。包括以下内容：\n\n-   **初始订单：** 这是为新客户提交的第一份订单\n-   **附加：** 这涉及为现有客户添加产品或增加许可证数量\n\
  -   **升级：** 这涉及在合同中期提高现有许可证的成本，或在合同期间将客户升级到更昂贵的产品\n-   **续订：** 这适用于不设为自动续订的现有合同续订，或涉及合同续订时现有许可证价格的更改\n\
  -   **减少：** 这涉及从客户合同中移除一个或多个产品或减少许可证数量\n-   **取消：** 这是指在客户合同结束时永久移除所有产品\n-   **新云：**\
  \ 这涉及为已建立的客户下单订购额外的、不同的云服务\n\n## 选择正确的订单类型\n\n以下问题将帮助您根据关键变量（如客户状态、许可证数量调整、生效日期和价格修改）确定正确的订单类型：\n\
  \n-   您的订单是针对新客户还是现有客户？\n-   您希望订单何时生效？\n-   您如何调整许可证数量？\n-   新的许可证价格是多少？\n-   您如何调整当前许可证价格？\n\
  \n\n\n通过回答这些问题并利用回复来指导您的决策，您可以准确识别要提交的正确订单类型。\n\n下表提供了根据关键变量确定正确订单类型的指导，包括客户状态、许可证数量调整、生效日期和价格修改。通过回答问题并将回复作为指导，您可以准确识别要提交的适当订单类型：\n\
  \n| 客户 | 生效开始日期 | 许可证数量 | 许可证价格（每个许可证） | 订单类型 |\n|---|---|---|---|---|\n| 新客户 |\
  \ 服务开始日期 | 增加 | 任意 | 初始 |\n| 现有/新云 | 服务开始日期 | 增加 | 任意 | 新云 |\n| 现有/附加 | 服务开始日期 |\
  \ 增加 | 无变化 | 附加 |\n\n| 产品 |  |  |  |  |\n|---|---|---|---|---|\n| 现有 | 合同期中 | 无变化\
  \ | 增加 | **升级** |\n|  |  | 增加 | 无变化 |  |\n|  |  |  | 增加 |  |\n|  | 合同续订日期 | 减少 |\
  \ 无变化 | **减少** |\n|  |  | 终止 | 不适用 | **取消** |\n|  |  | 无变化 | 增加 | **续订** |\n\n|\
  \  |  |\n|---|---|\n|  | 减少 |\n| 增加 | 增加 |\n|  | 减少 |\n| 减少 | 增加 |\n|  | 减少 |\n\n\
  表 9.1：基于关键变量的订单类型确定\n\n在 COA 中理解升级和续订之间的差异可能会令人困惑，但对于适当的订单提交而言非常重要。两种类型的订单都必须包含客户未来预计拥有的所有产品和许可证。\n\
  \n升级通常在合同期中发生，并涉及整体合同价值的增加。它们源于价格或许可证数量的增加，并会替换所有当前客户信息。升级订单带来的更改将在服务开始日期生效。\n\n\
  另一方面，续订可以增加或减少合同价值，但仅在客户续订日期生效。它们涉及价格变化而数量不变。任何导致年度合同价值（ACV）减少的续订必须在服务日期前 30 天或更长时间提交。\n\
  \n如果您客户合同的唯一更改是许可证数量的变化，请提交附加或减少订单。需要注意的是，升级相当于“提前续订”，会替换所有当前客户信息。\n\n## 提交后监控您的订单\n\
  \n提交订单后，您可以在 COA 的“服务订单”选项卡中监控其状态。这提供了汇总概览，列出订单号、客户名称、客户组织 ID、订单价值、订单类型和订单状态。要查看更详细的信息，包括订单条款和日期，您可以选择单个订单。一旦\
  \ Salesforce 收到并审查了您的订单，他们将为其客户激活产品和许可证。\n\n## 合作伙伴订单错误和修订\n\n错误难免发生，而在 COA 中提交订单时是可以纠正的。合作伙伴可以在原始提交后的\
  \ 2 小时内召回任何 COA 订单。此宽限期后发现的任何错误都需要通过案例进行人工干预。\n\n以下是通过案例启动更正流程的步骤：\n\n- **记录案例：**\
  \ 通过在合作伙伴社区中记录案例开始流程。\n- **选择主题和子主题：** 将主题选择为 **通道订单应用程序与活跃组织配置**，子主题选择为 **合作伙伴订单错误和修订**。\n\
  - **提供订单详情：** 您需要提供错误提交的服务订单号。\n- **识别错误：** 明确指出订单中的错误，并说明您希望在订单中看到的正确更改。\n- **说明更改理由：**\
  \ 提供说明此订单为何需要更正的理由。请记住，编辑须经 Salesforce 批准。\n\n订单提交中的常见错误可能涉及输入错误的价格、数量、产品或未来日期。\n\
  \n## 使用 COA 自动化 ISV 订单提交流程\n\n对于许多合作伙伴而言，每月手动提交几笔订单可能不会造成重大负担。然而，对于每月需要提交数百甚至数千笔订单的大型\
  \ ISV 来说，自动化此流程可以带来真正的改变。\n\n正如您所知，COA 是安装在您的 PBO 上的托管包，使您能够利用标准 Salesforce 工具来自动化订单提交流程。COA\
  \ 所需的大部分信息，例如客户详情和已售产品，通常在交易谈判过程中捕获。与为每个订单手动重新输入这些信息相比，自动化流程提供了更高效的替代方案。\n\n以下是流行的自动化方法：\n\
  \n- **快速操作**：您可以在机会记录上创建快速操作以创建新客户，并为 **附加** 和 **续订** 定义变体。此方法通过使必要操作随时可用，简化了提交新订单的任务。\n\
  - **Apex 批处理**：您可以设置 Apex 批处理流程，以便在夜间自动提交所有处于 **草稿** 状态的订单。这种方法对于大批量订单尤其有益，因为它消除了手动提交的需求。\n\
  - **通道订单 Apex API**：您可以使用通道订单 Apex API 以编程方式提交订单。通过利用 **CHANNEL_ORDERS** 命名空间中的类，此技术为订单提交提供自动化，使其非常适合应用程序逻辑集成或纳入其他自动化工作流。\n\
  \n通过利用这些自动化选项，您可以大大简化订单提交流程，减少人工错误，并确保客户更高效地上线。\n\n## 许可证转移和交换\n\n当您需要在两个组织之间转移许可证或为同一客户交换许可证时，您应在合作伙伴社区中记录案例。请确保将产品选择为\
  \ **ISV 计费与订单支持**，主题选择为 **许可证交换/转移**。在描述中提供所有必要详情，包括源组织 ID 和目标组织 ID、数量、许可证、待转移的附加项以及任何其他相关详情。\n\
  \n## 了解交换和转移\n\n为了确保您正确处理每个场景，让我们深入探讨交换和转移的定义和要求。\n\n### 许可证交换\n\n当合作伙伴希望将其客户合同上的产品更换为另一款等效产品时，需要交换案例。您只能在同一客户合同上将产品与类似产品交换。交换订单的条件，包括组织版、续订日期、价格和数量，不得更改。如果交换导致价格变化，应在\
  \ COA 中作为续订提交。交换只能在具有有效组织 ID 的活跃客户合同上进行。\n\n### 许可证转移\n\n另一方面，当为同一客户将许可证从一个组织转移到另一个组织时，需要转移案例。转移条件必须与原始订单保持一致——这包括客户、续订日期、价格和数量。转移的许可证必须处于\
  \ **活跃** 状态，并且属于活跃的转售合同。它们必须从活跃组织转移，并且可以转移到活跃组织或试用组织，但不能转移到演示组织或免费组织。\n\n## 案例指南\n\
  \n无论是执行交换还是转移，所有案例提交都应包括组织 ID、任何相关产品名称、数量、价格和开始日期。遵循这些指南并了解交换和转移之间的差异将确保您的许可证调整得以顺利处理。\n\
  \n## CMA 与 COA – 为您的 AppExchange 业务选择合适的订单解决方案\n\n现在，您是一位经验丰富的冒险者，站在岔路口。一侧的道路标记为“CMA”，另一侧的路标写着“COA”。每条小径都承诺通向同一宝藏——运营卓越的光亮黄金。但棘手之处在于——您不能一分为二同时探索两者。您必须做出选择。\n\
  \nCMA 路径类似于穿过森林的风景路线，非常适合那些喜欢在欣赏可爱鹿群（读作：以直接方式管理付款）的同时进行轻松旅程的人。另一方面，COA 小径适合那些不介意爬一点上坡以享受更广阔视野（读作：全面的订单管理）的人。\n\
  \n\n\n所以，ISV 厂商们，现在是决策时刻。无需恐惧！在这条十字路口，你不会孤单。本指南是您值得信赖的指南针，突出每条道路的独特特点，并指导您选择最符合业务旅程的方案。\n\
  \n## 使用 OEM 嵌入式应用的限制\n\n必须牢记一个重要限制：OEM 应用无法使用 Checkout。因此，致力于开发 OEM 嵌入式应用的 ISV 别无选择，只能选择\
  \ COA 作为唯一可行的方案。这一决定为 OEM 合作伙伴提供了必要的工具，可直接向客户分发其 Salesforce 许可证。\n\n## ISVforce\
  \ 应用的决策点\n\n对于 ISVforce 来说，决策并不那么明确，因为两种解决方案都可供使用。正如本章所述，以下是您的选择：\n\n- **CMA**：该解决方案直接与\
  \ Stripe 链接用于支付处理，并允许通过 AppExchange Checkout 管理订单\n- **COA**：使用 COA，您需要手动向 Salesforce\
  \ 提交订单，这可以提供处理复杂或大型客户交易所需的控制水平\n\n总体而言，对于服务小型企业的 ISV 来说，CMA 可以成为首选解决方案，尤其是那些采用与本章前面讨论的限制相符的简单定价模式的企业。它可与\
  \ LMA 和 Stripe 无缝集成，自动化升级、付款订阅变更和收入分成等关键流程。CMA 简化的功能和免维护方式往往使其成为首选。需要注意的是，大多数合作伙伴服务于中型和企业客户，对于这些客户而言，通过\
  \ Stripe 进行强制付款可能是个阻碍。\n\nCOA 虽然常被视为较老且更劳动密集的解决方案，但仍保持其相关性，尤其对于经常处理大型客户合同、希望获得全面方案的企业而言。随着\
  \ COA 自动化的出现，一些手动流程可以得到简化，使其更易于使用且更高效。在需要全面方法的情况下，COA 变得不可或缺。它允许您将 Salesforce 方案纳入更广泛的客户协议中。然而，即使有自动化，也必须注意某些修改仍可能需要人工干预，这可能非常耗时。\n\
  \n在 CMA 和 COA 之间进行选择时，请考虑您的商业模式、客户需求以及交易的复杂性。如果您优先考虑简化和自动化，并且所有客户都接受通过 Stripe 付款，那么\
  \ CMA 很可能是最佳选择。如果您需要对大型复杂交易有更多控制权，COA 可能是您的首选。别忘了，如果您不确定，始终可以联系您的 **Partner Account\
  \ Manager (PAM)** 讨论此事。请记住——这是一个二选一的决定，因此请选择最能支持您业务目标的方案。\n\n## 摘要\n\n![](img/44ed632038957e4c80220676e84c5109_481_0.png)\n\
  \n恭喜，勇敢的旅行者！我们已成功穿越运营卓越的复杂地形。就像熟练的制图师一样，我们细致地绘制了高效流程和工作流的广阔版图，为成功的远征奠定了基础。在客户支持的茂密丛林中，我们开辟出卓越服务的道路，确保将每个挑战转化为客户满意的机会。\n\
  \n站在 AppExchange Checkout 和 COA 这两座双峰之巅，我们学会了征服运营障碍并简化订单管理。而在 CMA 和 COA 的十字路口，我们运用智慧自信地为我们的事业选择最合适的支付解决方案。这次航行不仅为我们提供了重要的工具，也赋予我们塑造运营卓越的知识。\n\
  \n然而， fellow 冒险者们，我们的旅程仍在继续。我们离开了熟悉的运营领域，将罗盘指向新的前沿——分析和洞察的领域。在下一章中，我们将深入 AppExchange\
  \ 应用分析的深处。我们将学习了解订阅者互动、利用分析做出明智决策、请求和分析数据，并利用这些知识进行产品开发。所以，休息一下吧，我们旅程的下一阶段在等待，承诺着发现的激情和数据驱动决策的智慧。\n"
- '# 第 4 部分：为成功而扩展


  扩展业务就像计划一次攀登珠穆朗玛峰的远征，只是没有冻伤，也没有你知道的体力消耗。攀登始于一阵肾上腺素的激增。你兴奋不已，怀揣着与你的应用一起在山顶自拍的梦想。然而，正如任何登山者（或创始人）所知，攀得越高，地形越棘手。氧气变得稀薄，牦牛开始显得评头论足，突然间，你开始怀疑为什么不选择沙滩排球。


  无需恐惧！这一部分不是关于在高海拔生存，而是关于在其中蓬勃发展。我将引导您穿越数据的暴风雪，避开技术债务的冰裂缝，并确保您最终站在 AppExchange 峰顶取得胜利。到这一部分结束时，您将准备好将想法转化为盈利且可扩展的
