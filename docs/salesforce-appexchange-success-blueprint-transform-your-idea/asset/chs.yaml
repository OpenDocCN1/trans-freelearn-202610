  \ **Developer Hub** (**Dev Hub**) 管理 2GP 包的好处。\n\n## Managed packages – safeguarding\
  \ your IP\n![](img/44ed632038957e4c80220676e84c5109_184_0.png)\n\n托管包充当保护层，确保在将\
  \ Salesforce 应用交付给客户时你的 IP 保持安全无虞。它们帮助你做到以下几点：\n\n- **隐藏你的 Apex 代码：** 就像隐藏宝箱的钥匙一样，托管包隐藏了你的\
  \ Apex 类和触发器的源代码，确保订阅者无法查看或修改它\n- **保护自定义设置和自定义元数据：** 托管包为自定义设置和自定义元数据提供额外的安全层，保护应用程序数据的保密性和完整性\n\
  - **控制组件可见性**：就像可定制的锁一样，托管包允许你定义组件（如对象、字段和 Visualforce 页面）的可见性和可访问性，防止订阅者进行不必要的修改\n\
  \n## 1GP managed packages\n1GP 托管包是 Salesforce 打包技术的先驱。虽然它们为应用的安全交付奠定了基础，但它们缺乏现代开发实践所需的灵活性和效率。因此，新项目应使用并拥抱\
  \ 2GP 托管包改进的功能。\n\n## 2GP managed packages\n2GP 托管包代表了 Salesforce 打包的下一代，提供了一种更敏捷、更精简的方法来开发和分发\
  \ Salesforce 应用。它们能够为客户提供无缝的更新和升级，同时保留保护你的 IP 的核心功能。\n\n## Namespace – the unique\
  \ identifier of your treasure chest\n把命名空间想象成宝箱外部的精美雕刻，使其在无数其他宝箱中易于区分且独一无二。在 Salesforce\
  \ 托管包的世界里，命名空间充当唯一标识符，确保你的应用组件不会与客户 Salesforce 组织中的其他组件发生冲突。\n\n在托管包的整体架构中，命名空间发挥着至关重要的作用。它们充当你应用的结构、组织和保护的蓝图。让我们看看它们是如何实现的：\n\
  \n- **组件隔离：** 命名空间通过为每个组件的名称添加唯一前缀，为你的组件（如对象、Apex 类和 Visualforce 页面）提供额外的隔离层。这可防止命名冲突，并确保你的应用组件与客户组织中其他托管包或自定义组件和谐共存。\n\
  - **代码保护：** 命名空间通过使他人在未明确允许的情况下直接在代码中引用你的组件变得更加困难，从而有助于保护你的 IP。这种额外的保障有助于维护你的应用程序及其组件的完整性。\n\
  - **品牌和识别：** 命名空间，就像宝箱上的精美雕刻一样，也可作为品牌元素，为你的应用在庞大的 Salesforce 生态系统中提供独特的身份。通过选择有意义且独特的命名空间，你可以使你的应用脱颖而出，并让客户易于识别。\n\
  \n\n\n## 包扩展 – 为多个产品和版本定制应用程序\n\n包扩展为 AppExchange 合作伙伴提供了一种灵活的方法，用于构建面向使用不同 Salesforce\
  \ 产品（如 Health Cloud 和 Financial Services Cloud）以及不同 Salesforce 版本（如 Professional）的客户的应用程序。通过使用基础托管包和扩展包，您可以创建一个模块化应用程序，满足多样化的客户需求，而无需维护多个代码库。\n\
  \n将您的应用程序视为一个多面拼图，其中基础托管包构成中心拼块，形成适用于所有客户的核心功能。另一方面，扩展包就像专门的拼图块，可以通过附加功能和功能增强基础包，并针对特定的\
  \ Salesforce 产品或版本进行定制。\n\n在 2GP 的上下文中，您可以创建一个包含核心功能的 2GP 基础包，然后开发一个或多个依赖于基础包的扩展\
  \ 2GP 包。根据组织结构和需求，这些扩展包可以包含分层功能，从数据模型和逻辑到 UI。这些包还可能包含特定于某些 Salesforce 产品或版本的功能，使合作伙伴能够有效地探索和扩展其产品。这种模块化方法使您能够维护单一代码库，同时为不同客户提供定制解决方案。\n\
  \n在设计应用程序和包之间的接口时，请考虑整个应用程序生命周期。必须确保对基础包的更新不会破坏扩展包。在添加新功能时，将其包含在适当的包中，并在扩展包引用的情况下使必要的组件成为\
  \ `@namespaceAccessible` 组件。\n\n利用 2GP 中的包扩展，您可以创建可扩展且模块化的应用程序，以满足多样化客户的需求，同时简化升级过程。随着客户需求的增长，您可以通过引入适当的扩展包来增强其应用程序体验，从而轻松地向他们进行\
  \ upsell。\n\n## 包扩展与功能参数\n\n在 Salesforce AppExchange 市场上开发时，您可能会经常面临两难选择：应该构建扩展包还是使用\
  \ **功能管理应用 (FMA)**，所述于 *第 2 章*？这两种方法各有其优势和用途。以下是实用的比较：\n\n| Criteria | Package extensions\
  \ | Feature parameters |\n|---|---|---|\n| Scope | These are designed to extend\
  \ the functionality of a base package. They have a dependency on the base package\
  \ and can’t be installed independently. | This is more about controlling the visibility\
  \ and access to specific features within a package. It doesn’t add new functionality\
  \ but rather manages existing ones. |\n| Flexibility | This approach provides a\
  \ great deal of flexibility because it enables you to add new objects, fields, logic,\
  \ and dependencies on Salesforce features that are not required by your base package.\
  \ It’s like building a new app but with a dependency on the base package. | Limited\
  \ to toggling features on or off. New components must be added to the base package.\
  \ |\n| Use case | Ideal for scenarios where you have different versions of your\
  \ app for different industries or when you have add-on modules that not every customer\
  \ might need. | This approach is ideal for beta testing features or for gradually\
  \ introducing new features to your customers. It also allows for control over usage\
  \ allowance allocations and the disabling of features in a freemium or tiered-access\
  \ model. |\n|  | Requires more development and testing effort as you’re essentially\
  \ building a new (albeit smaller) app. | Easier to implement as you’re just controlling\
  \ access to existing features. |\n| Complexity |  |  |\n| Technical debt | Can reduce\
  \ technical debt due to better **separation of concerns** (**SoC**). | Can increase\
  \ technical debt due to added complexity in the core code base. |\n\n功能参数特别适合于渐进式功能部署，通过\
  \ A/B 测试获得洞察，允许最终用户动态自定义产品功能，并在增强与核心产品紧密相关时确保高效维护。重要的是，它们不会引入维护和发布单独包的开销，使其成为在核心包内管理功能的简化解决方案。然而，这种方法虽然在功能演进方面提供了灵活性，但会增加核心代码库的复杂性。\n\
  \n相反，包扩展旨在通过创建单独的包来增强现有产品的功能。当需要模块化功能、管理可能干扰核心产品的复杂性，或新功能需要不同的版本和发布节奏时，它们是首选。包扩展虽然促进了更好的\
  \ SoC 并由于其模块化特性而减少了技术债务，但也带来了一些挑战。它们需要创建、维护和发布单独的包，这可能会带来额外的开销。其隔间化设计确保了更干净的代码库，但需要更严格的管理。\n\
  \n在做出决定时，您应权衡产品的性质、其战略目标和技术挑战。虽然包扩展适用于模块化和复杂的增强，但功能参数具有适应性和多功能性。最终决定应与您的独特轨迹和目标产生共鸣。\n\
  \n## Dev Hub\n\nDev Hub 是 Salesforce 开发人员和 AppExchange 合作伙伴的重要工具，提供集中环境来管理、开发和部署\
  \ Salesforce 应用程序，特别是 2GP 托管包。在本节中，我们将讨论 Dev Hub 与 2GP 托管包之间的关系，强调您需要了解的关键信息。\n\n\
  2GP 打包模型中的托管包由 Dev Hub 拥有，但打包的元数据并不存储在其中。要使用 2GP 包，建议在您的 **合作伙伴业务组织 (PBO)** 中启用\
  \ Dev Hub。在 2GP 打包模型中，单个 Dev Hub 实例可以拥有一个或多个包，从而简化多个应用程序的管理流程。\n\n建议在单独的 Developer\
  \ Edition 组织中注册命名空间，然后将其链接到您的 Dev Hub 实例。此过程允许您使用命名空间并将多个命名空间与单个 Dev Hub 实例关联，从而增强组织和灵活性。要实现此目的，您需要执行以下操作：\n\
  \n- 1. 如果您还没有带有已注册命名空间的组织，请创建一个单独的 Developer Edition 组织。\n- 2. 在 Developer Edition\
  \ 组织中注册命名空间。选择命名空间时要谨慎，因为一旦与组织关联，就无法更改或重用。\n- 3. 以系统管理员或具有 Salesforce DX 命名空间注册权限的用户身份登录到您的\
  \ Dev Hub 组织。\n- 4. 在 Dev Hub 组织的 **App Launcher** 菜单中，选择 **Namespace Registries**。\n\
  - 5. 单击 **Link Namespace** 并使用系统管理员凭据登录到 Developer Edition 组织。\n\n请注意，在您可以链接命名空间之前，有必要在\
  \ Dev Hub 组织中定义并部署 **My Domain** 名称（如果尚未完成）。\n\n## 托管包的本地化最佳实践\n\n在动态的 Salesforce\
  \ ISV 开发世界中，一切都应实现本地化。这包括从屏幕流文本、自定义选项卡、对象和字段到可能向用户展示的异常消息的所有内容。\n\n## 管理冗余和依赖关系\n\
  \n您可能会在标签中遇到冗余，尤其是在应用程序较大时。然而，不必对此过于担心。同一短语在不同语言中可能有不同的含义，而在一种语言中似乎冗余的内容在另一种语言中可能并非如此。因此，将每个标签视为唯一并为其提供适当的上下文是有益的。\n\
  \n## 模块化标签和版本控制\n\n标签理想情况下应保存在每个包的单个 `CustomLabels` XML 文件中，按 API 名称按字母顺序维护。您应手动将新标签合并到包元数据中，具体在\
  \ `CustomLabels.labels-meta.xml` 文件中。这需要使用 **集成开发环境 (IDE)**，而不是依赖 Salesforce UI。\n\
  \n在每个标签 API 名称上使用前缀来定义其所属的模块，并使用类别对标签进行分组，可以进一步帮助组织。\n\n## 翻译工具\n\n翻译过程可以外包给专业的翻译服务。将标签导出为\
  \ XLF 格式可以简化他们的流程，他们将维护已翻译内容的目录，使每次识别新条目或修改条目变得更容易。\n\n## 允许订阅者调整您的翻译\n\n在命名空间包中，最终客户可以覆盖自定义对象的元数据翻译。例如，他们可以使用\
  \ Translation Workbench 覆盖自定义字段或工作流任务上的标签。如果他们这样做，对应用程序的更新将不会覆盖本地翻译。虽然您\n\ncan’t\
  \ restrict subscribers from providing translations, this feature allows them to\
  \ tailor your app to their specific context and needs.\n\n## Apex – 可定制 Salesforce\
  \ 应用的支柱\n\nApex 是一种功能强大、强类型的编程语言，用于在 Salesforce 平台上开发自定义业务逻辑。它旨在执行服务器端操作，使开发人员能够创建动态且多功能的\
  \ Salesforce 应用，以满足特定的业务需求。\n\nAppExchange 合作伙伴面临的挑战之一是创建能够满足客户独特需求的应用。作为受管包，Salesforce\
  \ 应用的核心在安装后无法由订阅者修改。然而，最终客户可能有不同的需求，从而需要定制和可扩展性。Forbes 报道称，71% 的客户对应用缺乏定制选项感到沮丧。\n\
  \n为解决这一复杂性，Salesforce 平台即使在受管包中也提供了大量的定制机会。最终客户可以通过 Salesforce 平台广泛调整合作伙伴应用以符合其业务需求。他们可以利用自定义字段、流程、Apex\
  \ 和其他工具来个性化应用。此外，Dynamic Apex 使开发人员能够创建具有固定核心但提供额外定制空间的应用，从而提升最终用户的体验并满足其特定需求。\n\
  \n## Dynamic Apex – AppExchange 应用中适应性的力量\n\nDynamic Apex 是 Apex 编程的一个关键方面，为 Salesforce\
  \ 开发人员提供了一套工具，用于构建高度可定制和可适应的应用。它包括 **动态 Salesforce 对象查询语言** (**动态 SOQL**)、**动态 Salesforce\
  \ 对象搜索语言** (**动态 SOSL**)，以及 **动态数据操作语言** (**动态 DML**)，所有这些都是解决 AppExchange 开发中独特业务需求和复杂性的关键。\n\
  \n### What is Dynamic Apex?\n\nApex 是 Salesforce 的专有强类型编程语言，主要用于构建自定义业务逻辑。传统的 Apex\
  \ 提供了用于开发应用的强大功能集，但通常不支持基于动态条件的运行时更改。Dynamic Apex 正填补了这一空白。\n\n从本质上讲，Dynamic Apex¹\
  \ 允许开发人员构建能够在运行时引用 SOQL、SOSL 和 DML 字符串的应用，从而实现可适应的查询、搜索和数据操作的创建。\n\n1 https://developer.salesforce.com/docs/atlas.en-us.apexcode.meta/apexcode/apex_dynamic.htm\n\
  \nThe components of Dynamic Apex are set out here:\n\n- **动态 SOQL**：动态 SOQL 允许您使用\
  \ Apex 代码在运行时构建 SOQL 字符串。这允许根据特定的运行时条件或参数创建复杂、灵活的查询，从而使应用能够以多变和适应性强的方式与数据交互。\n-\
  \ **动态 SOSL：** 与动态 SOQL 类似，动态 SOSL 允许您使用 Apex 代码在运行时创建 SOSL 搜索字符串。此功能有助于根据用户输入或其他动态参数创建搜索策略，从而实现更定制化、更强大的搜索功能。\n\
  - **动态 DML：** 动态 DML 操作允许开发人员动态构建和执行数据操作任务。这可以包括 insert、update、delete 和 upsert 操作。因此，动态\
  \ DML 支持 Salesforce 应用中的高度自适应数据处理。\n\n### The importance of Dynamic Apex in AppExchange\
  \ development\n\n为 Salesforce AppExchange 市场开发应用通常需要高度的定制以满足不同的客户需求。在此，Dynamic Apex\
  \ 的固有灵活性和适应性具有极大价值。\n\nDynamic Apex 可帮助您构建应用，使其根据客户组织的具体配置支持各种 Salesforce 功能。例如，一些组织可能启用了\
  \ Person Accounts，而其他组织可能未启用。基于 Dynamic Apex 构建的应用可以动态检查 Person Accounts 的存在情况并相应调整其功能。\n\
  \n这种灵活性不仅限于标准的 Salesforce 功能。Dynamic Apex 为应用与订阅者的本地自定义对象和字段无缝集成打开了大门。这意味着，与其受预定义配置限制，您的产品现在可以构建为与组织在受管包之上构建的独特定制和谐协作。\n\
  \n同样，像 Advanced Currency Management 这样的功能，可能在某些组织中启用而在其他组织中未启用，可以使用 Dynamic Apex\
  \ 动态支持。应用可以检测组织中此类功能的状态并修改其操作以与可用功能保持一致。\n\n### Dynamic SOQL example\n\nLookupController\
  \ 类是 Formula Debugger 受管包的一个组件，体现了 Dynamic SOQL 的多功能性。此控制器使用户能够使用动态查询从标准 Salesforce\
  \ 对象和本地自定义对象中搜索和检索记录。您可以在此处看到其使用示例：\n\n```\npublic with sharing class LookupController\
  \ {\n    public static List<sObject> search(String searchTerm, string searchObject)\
  \ {\n        String searchCondition = '%' +\nString.escapeSingleQuotes(searchTerm)\
  \ + '%';\n        String searchQuery = 'SELECT Id, Name FROM ';\n        searchQuery+=String.escapeSingleQuotes(searchObject);\n\
  \        searchQuery+=' WHERE Name LIKE :searchCondition ';\n        searchQuery+='WITH\
  \ SECURITY_ENFORCED ORDER BY Name LIMIT 5';\n        return Database.query(searchQuery);\n\
  \    }\n}\n```\n\n必须注意的是，虽然使用 Dynamic SOQL 增加了灵活性，但也引入了潜在的漏洞，尤其是 SOQL 注入。此攻击允许恶意行为者将其\
  \ SOQL 代码“注入”到查询中。为防止这种情况，LookupController 类使用 `String.escapeSingleQuotes` 方法确保用户输入得到清理，转义单引号并防止潜在的\
  \ SOQL 注入威胁。您将在 *第 6 章* 中了解更多关于此漏洞的信息。\n\n## Dynamic Apex or extension package?\n\
  \nSalesforce ISV 开发人员经常面临将特定功能集成到并非所有客户组织中都启用的挑战。在这些情况下，一个重要的决策是是否在核心包中利用 Dynamic\
  \ Apex，还是开发额外的扩展包。这两种方法各有其独特的优点和缺点，选择取决于各种因素，例如具体用例、可扩展性预期和应用复杂性。\n\n### The need\
  \ for this decision\n\n让我们以同时支持 Person Accounts 和 Business Accounts 为例。Person Accounts\
  \ 是主要用于 B2C 场景的特定 Salesforce 功能，而 Business Accounts 适用于 B2B 关系。并非所有 Salesforce 组织都启用\
  \ Person Accounts 功能。\n\n如果您的解决方案需要同时满足这两种账户类型，一个关键挑战是避免在 Person Accounts 上创建包依赖，因为这会限制包的兼容性。因此，您必须开发一个无论\
  \ Person Accounts 功能是否启用都能有效运行的包。这就是在 Dynamic Apex 和创建扩展包之间做出决策变得至关重要的时刻。\n\nLet’s\
  \ look at the pros and cons of each option in a tabular format, as follows:\n\n\
  | Method | Advantages | Disadvantages |\n|---|---|---|\n| Extension packages | Clear\
  \ segregation of business logic<br>Facilitates standard SOQL queries<br>Allows incremental\
  \ updates specific to the added feature<br>A single security review can include\
  \ one base | Additional security reviews are required if more than four extension\
  \ packages are created<br>Extra security reviews may be required for extension packages\
  \ developed after the initial review of the base package<br>Increased management\
  \ effort due to separate packages |\n\n|  | 包和最多四个扩展包 |  |\n|---|---|---|\n| Dynamic\
  \ Apex | 支持核心包内的附加功能<br>单次安全审查<br>提供动态 SOQL、动态 SOSL 和动态 DML 的灵活性 | 无法创建动态声明式组件<br>随着功能增长而出现的可扩展性问题<br>由于动态\
  \ SOQL 查询缺乏预编译而可能导致性能影响<br>与 SOQL 注入和 SOSL 注入相关的风险，详见 *第 6 章* |\n\n在特定需求和情况下仔细考虑后，应在动态\
  \ Apex 或扩展包之间做出选择。务必通过尝试在未启用附加功能（例如 Person Accounts）的组织中安装你的包来测试依赖关系。如果安装成功，你就成功避免了对特定功能的包依赖。这种决策过程是\
  \ Salesforce ISV 开发的一个不可或缺的部分，可显著影响解决方案的兼容性和适应性。\n\n## 依赖注入模式 – 自定义的灵活方法\n\n**依赖注入\
  \ (DI)** 模式是一种流行的软件设计模式，可促进 Apex 应用中的定制和可扩展性。此模式允许开发人员解耦应用程序的不同组件，使客户更容易修改应用的特定部分，而不会影响其核心功能。\n\
  \n例如，假设你有一个托管包应用程序，可与外部系统集成以获取数据。默认情况下，你的应用程序连接到一个公开可用的基于云的现成系统，但你的某个客户可能需要与其内部系统集成。使用\
  \ DI 模式，你可以创建一个接口来定义与外部系统交互的通用方法，然后为基于云的系统开发默认类，并让你的新客户为其内部系统开发新的本地类。两个类都实现相同的接口，这样客户就可以选择要集成的系统，而无需修改核心应用程序代码。\n\
  \n另一个例子是为客户计算税费的应用程序。不同客户可能有不同的税费规则和计算方法。通过实现 DI 模式，你可以创建税费计算接口，然后为每个客户的特定税费规则开发单独的类。这使客户能够使用其自定义税费逻辑，同时保持核心应用程序的完整性。\n\
  \n## 接口、虚拟基类和自定义元数据在 DI 中的作用\n\n为了在 Salesforce 应用程序中有效实现 DI，使用了某些构造和功能，例如接口、虚拟基类和自定义元数据。这些元素各自具有独特的属性和功能，在将客户特定的定制注入托管包中发挥着重要作用。让我们在下表中阐明它们的作用：\n\
  \n| 功能 | 角色 |\n|---|---|\n| 接口 | 接口允许代码与一组定义好的方法进行交互，而这些方法的实际实现可以因客户而异。这使得托管包在开发期间可以依赖接口，但不会对客户的具体实现产生直接依赖。\
  \ |\n| 虚拟基类 | 这些类允许开发人员定义一组可被客户覆盖以自定义应用程序行为的基础方法。通过使用虚拟基类，客户可以在不修改其源代码的情况下扩展托管包的核心功能。\
  \ |\n\n## 自定义元数据\n\n自定义元数据为 Salesforce 应用程序存储配置数据提供了一种便捷的方式。当与 Apex 反射结合使用时，自定义元数据可用于动态实例化接口或虚拟基类的客户特定实现，从而允许客户在不直接修改包源代码的情况下将其自定义逻辑注入托管包。\n\
  \n需要考虑的一个重要方面是订阅者可编辑和开发人员控制的自定义元数据之间的区别，如下所述：\n\n- **可由订阅者编辑的自定义元数据**：这允许订阅者（即客户）在部署后修改元数据记录。当你希望授予客户根据其独特需求调整配置的灵活性而无需重新部署时，这尤其有用。\n\
  - **开发人员控制的自定义元数据**：相比之下，此类型严格由包开发人员控制。部署后，订阅者无法修改这些记录。这对于应保持在所有订阅者组织中一致的配置而言是理想的。\n\
  \n## 实现税费计算 – 分步示例\n\n让我们深入研究我们的税费计算场景。我们将看到如何使用 Apex DI 来支持用户定义的地方规则。\n\n### 1.\
  \ 接口\n\n首先，我们将按如下方式定义一个用于税费计算的全局接口：\n\n```\nglobal interface ITaxCalculator {\n\
  \    Decimal calculateTax(Decimal amount);\n}\n```\n\n### 2. 默认类（托管包的一部分）\n\n接下来，我们将创建一个实现接口的默认类。此类将是托管包的一部分：\n\
  \n```\npublic class DefaultTaxCalculator implements ITaxCalculator {\n    public\
  \ Decimal calculateTax(Decimal amount) {\n        return amount * 0.05; // 5% default\
  \ tax\n    }\n}\n```\n\n### 3. 自定义元数据\n\n在你的托管包中，引入一个新的订阅者可编辑自定义元数据文件，名为 TaxCalculatorMapping__mdt。为了本示例的简单性，我们将使用默认字段，如下所示：\n\
  \n- MasterLabel 用于存储国家代码（例如 US）\n- DeveloperName 用于捕获类名（例如 DefaultTaxCalculator）\n\
  \n在实际场景中，更合适的做法是创建针对这些特定需求量身定制的自定义字段。\n\n### 4. DI 实际应用\n\n现在，让我们看看如何使用 DI 为给定国家/地区获取适当的税费计算器：\n\
  \n```\nglobal class TaxService {\n    public static ITaxCalculator getTaxCalculatorForCountry(String\
  \ countryName) {\n        // Fetch the tax calculator class name from Custom Metadata\n\
  \        String taxCalculatorClassName = [SELECT DeveloperName FROM TaxCalculatorMapping__mdt\
  \ WHERE MasterLabel = :countryName LIMIT 1].DeveloperName;\n        // Use dynamic\
  \ Apex to instantiate the appropriate tax calculator\n        ITaxCalculator taxCalculator\
  \ = (ITaxCalculator) Type.forName(taxCalculatorClassName).newInstance();\n     \
  \   return taxCalculator;\n    }\n    global static Decimal calculateCountryTax(String\
  \ countryName, Decimal amount) {\n        ITaxCalculator taxCalculator = getTaxCalculatorForCountry(countryName);\n\
  \        return taxCalculator.calculateTax(amount);\n    }\n}\n```\n\n### 5. 适应本地需求\n\
  \n假设你已成功将应用程序销售给在波兰的第一位客户。凭借应用程序提供的灵活性，客户现在可以开发自己的自定义税费类，以适应当地税费法规，如下所示：\n\n```\n\
  public class PolandTaxCalculator implements ITaxCalculator {\n    public Decimal\
  \ calculateTax(Decimal amount) {\n        // Custom tax logic for Poland\n     \
  \   return amount * 0.23; // 23% VAT for Poland\n    }\n}\n```\n\n此设置的灵活性在于，借助 DI，他们的自定义类可无缝集成到你的核心包中，而无需对原始代码进行任何更改。他们只需配置一个新的自定义元数据类型（将\
  \ **MasterLabel** 设置为 **PL**，将 **DeveloperName** 设置为 **PolandTaxCalculator**），你的\
  \ **TaxService** 类就会自动运行本地代码。下面的图表说明了该过程：\n\n![](img/44ed632038957e4c80220676e84c5109_210_0.png)\n\
  \n图 3.1：此 UML 图展示了 DI 的实际应用。TaxService、ITaxCalculator、\n\n和 DefaultTaxCalculator\
  \ 类是托管包的组成部分。另一方面，PolandTaxCalculator 是一个定制类，在客户组织内部本地创建。\n\n你可能会想，“为什么不直接将波兰税规则纳入包中呢？”首先，波兰的税务法规相当复杂。跟上每个国家的税务计算逻辑是一项繁重的工作。如果你没有计划在某个特定地区扩张，这可能无法证明时间和资源的投入是合理的。\n\
  \n最重要的是，这只是一个示例场景。除了税务计算之外，请考虑每个应用用户可能拥有的独特业务流程。这关乎提供灵活性以满足那些不同的需求。\n\n## 警告 – 全局意味着永久\n\
  \n在 Salesforce 托管包中实现 DI 时，有一个至关重要的方面需要注意：全局类的永久性。\n\n为了使您的接口或虚拟基类能够在托管包外部访问，它们必须声明为\
  \ global。这确保了它们可以在订阅者组织中进行扩展或实现，从而实现所需的灵活性和定制性。然而，这种可访问性带来了重大影响，如下所述：\n\n- **稳定性承诺：**\
  \ 一旦您将类或接口指定为 global，这就是一项具有约束力的承诺。您之后无法将其访问级别更改为 public 或 private。这意味着任何全局组件都成为您包的公共\
  \ API 的一部分。\n- **设计定稿：** 鉴于 global 的不可逆性，在发布之前完成设计至关重要。虽然您可以在未来版本中向全局类或接口添加内容，但不能删除或更改现有的方法或变量。任何更改都可能破坏依赖它们的实现。\n\
  - **删除不在选项中：** 一旦发布，全局类或接口将永久存在。它不能从托管包的后续版本中删除。\n\n初看之下，这些似乎像是严格的限制。但请考虑更广阔的图景：想象一下订阅者基于您的全局接口构建了一个本地类的场景。如果您更改或删除该接口，它将直接影响并可能破坏订阅者的本地定制。global\
  \ 的刚性本质上是一种保护措施，确保所有相关方的稳定性和可靠性。\n\n鉴于这些考虑，请以极大的尊重对待 global 关键字。在规划 DI 时，请确保在将其标记为\
  \ global 之前，您的接口和类是健壮且经过深思熟虑的。这不仅仅关乎灵活性；这是对订阅者的一致性和可靠性的承诺。\n\n## 确保对自定义实现的无缝支持\n\
  \n当允许客户纳入其自定义扩展时，提供默认实现和强大的支持以确保顺畅的体验至关重要。在客户遇到与性能、 governor 限制或其他实现问题相关的问题时，支持人员应能够帮助他们恢复到已知、可靠且受支持的默认实现。快速识别问题源自\
  \ ISV 还是客户，是保持客户满意度的关键。\n\n通过利用接口、虚拟基类和自定义元数据，AppExchange 合作伙伴可以构建灵活且可定制的 Apex 应用程序，以满足客户的独特需求。提供强大的支持和可靠的默认实现可确保客户能够充分利用定制选项，而不会损害应用程序的整体性能和稳定性。\n\
  \n## 使用 ISV 客户调试器进行故障排除\n\n![](img/44ed632038957e4c80220676e84c5109_214_0.png)\n\
  \n哦，调试的乐趣！这从来不是轻松的散步，尤其是当路径带你进入由客户控制且具有其独特本地定制的 Salesforce 组织时。这就像在大海捞针，不同的是干草堆由代码组成，而针是一只拒绝露面的狡猾的\
  \ bug。\n\n但别怕，亲爱的开发者！ISV 客户调试器来拯救这一天了，这是一款改变游戏规则的工具，赐予那些勇敢通过安全审查流程的优秀 AppExchange\
  \ 合作伙伴。这款强大的调试器，一个值得信赖的副手，使您能够直接在客户的领地内诊断和调试托管包中的问题，同时保持安全并保护您珍贵的 IP。\n\n你可能会问，“这神奇的\
  \ ISV 客户调试器是什么？”让我告诉你！这个调试器无非是 Apex 调试器的扩展，专门为你这位非凡的 AppExchange 合作伙伴量身定制。它使您能够在客户组织内调试\
  \ Apex 代码，而无需暴露托管包的源代码或损害安全。\n\n## ISV 客户调试器的主要优势\n\n对于通过安全审查的 AppExchange 合作伙伴，ISV\
  \ 客户调试器提供以下几个优势：\n\n- **实时调试：** 直接在客户组织中调试 Apex 代码，从而更快地识别和解决问题\n- **上下文分析：** 深入了解客户特定的配置和数据如何影响您的托管包，帮助您解决客户特定的问题\n\
  - **安全性和 IP 保护：** 在不向客户透露托管包源代码或 IP 的情况下调试 Apex 代码\n- **增强的客户支持：** 为客户提供更快、更有效的支持，提升他们对托管包的整体体验\n\
  \n## 保护客户的知识产权\n\n尊重和保护客户的知识产权至关重要。请始终注意，调试日志可能不仅包含元数据，还包含客户的数据。完成调试后，请从设置过程中存储它的位置删除整个项目。切勿将客户的数据或元数据存储在您的\
  \ **version control system (VCS)** 中。\n\n## ISV 客户调试器注意事项\n\n使用 ISV 客户调试器时，请牢记以下额外注意事项：\n\
  \n- 您只能调试沙盒组织。\n- 您一次只能调试一个客户，但购买 Apex Debugger 许可证后，您可以同时调试多个客户，还可以在沙盒和 scratch\
  \ 组织中进行调试。\n- 当您点击 **Return to subscriber overview** 时，调试会话将终止。在调试期间保持登录到客户的组织，仅在完成调试后返回您的\
  \ **License Management Org (LMO)**。\n\n的确，这些注意事项构成了有效利用 ISV 客户调试器的基石。虽然此工具被证明非常有帮助，但其正确使用需要意识到并理解这些关键点。因此，在进行调试会话时，请始终牢记这些准则。\n\
  \n## 使用 Flow 增强您的应用程序\n\nSalesforce Flow 为 ISV 提供了一种强大而灵活的方式来扩展其应用程序的功能并使客户能够定制业务流程。在本节中，我们将探讨\
  \ ISV 可以在其应用程序中支持流程的各种方式，并讨论最佳实践和限制。\n\n## 使您的功能和功能支持 Flow\n\n作为 ISV，您可以使应用程序的功能和功能在客户的自定义流程中可用。通过使您的\
  \ **Lightning Web Components (LWC)** 和 Apex 方法支持 Flow，您可以将它们集成到客户的自定义流程中，使您的应用更具价值和粘性。\n\
  \n为此，请考虑客户可能希望在其自定义流程中包含哪些功能或功能。例如，提供信用检查功能的 AppExchange 解决方案既可用于交互式屏幕流程，也可用于无头记录触发流程。\n\
  \n## 提供流程模板和可覆盖流程\n\n流程模板和可覆盖流程使您能够提供通用业务流程，客户可将其用作自定义流程逻辑的起点。通过将行业专业知识打包到流程模板中，您可以帮助客户启动自己的自定义流程。\n\
  \n流程模板和可覆盖流程之间的主要区别在于，流程模板要求客户更新对模板的所有引用\n\n创建新流程时，可覆盖的流程会在创建“覆盖流程”时自动更新引用。\n\n\
  ## 最佳实践提示\n\n*在流程模板或可覆盖流程中包含对您打包的 LWC 或可调用 Apex 方法的引用，以指导客户如何使用您的功能和函数构建自己的流程。*\n\
  \n## 提供受 IP 保护的流程\n\n受 IP 保护的流程既不可覆盖也不是模板，有助于防止客户查看或编辑流程、保护知识产权，或防止对应用程序行为进行更改。客户仍可停用这些流程，因此请考虑对必须始终运行的逻辑采用基于代码的方法。\n\
  \n## 控制流程的执行顺序 – 触发顺序功能的优势\n\n您可以使用 **触发顺序** 功能为记录触发流程设置执行顺序，从而更好地控制自动化流程。此功能不适用于\
  \ Apex 触发器，这可能会导致问题，当您的包在某个对象上有一个触发器且客户也在该对象上编写触发器时，就会出现这种情况，因为触发器的运行顺序变得不确定。\n\n\
  ## 在流程上设置触发顺序\n\n**触发顺序** 选项允许您为特定对象优先执行记录触发流程。保存流程时，您可以设置 **触发顺序** 数字字段以确定执行顺序。您可以输入\
  \ 1 到 2,000 之间的数字，这决定了具有相同对象的流程被触发的顺序。\n\n例如，您可以优先让 Account 对象的 after-save 流程在其他\
  \ after-save 流程之前运行。但是，您无法将 after-save 流程优先于任何 before-save 流程或 Apex 触发器之前运行。\n\n\
  ## 打包触发顺序功能\n\n**触发顺序** 功能完全可打包，这意味着最佳做法是为客户在您的打包流程之间创建自己的流程并插入其中留出空间，如果他们愿意的话。这种灵活性使客户能够更好地控制其自动化流程。\n\
  \n## 使用流程触发器资源管理器进行自定义\n\n**流程触发器资源管理器** 是一种独特的用于确定流程触发器运行顺序的功能。如果客户克隆您的模板或可覆盖流程，他们可以编辑克隆上的触发顺序，从而进一步根据其特定需求定制应用程序。\n\
  \n## 最佳实践和限制\n\n打包流程时，请考虑以下几点：\n\n- 每个流程在组织中最多只能有 50 个版本，这会影响客户和开发人员。对于客户，请将他们引导至有关从包中安装的流程版本删除的帮助页面。对于\
  \ ISV，请根据使用 1GP 或 2GP 打包流程来不同地管理版本。\n\n2 https://help.salesforce.com/s/articleView?id=sf.flow_considerations_limit.htm&type=5\n\
  \n- 客户可以停用托管包中的流程。如果在下一个版本中包含了一个新的活动流程版本，它将在客户的组织中创建并执行，可能导致意外行为。如果您有不能被停用的逻辑，请考虑使用基于代码的方法。\n\
  - 如果客户有可能决定停用流程，最好不要将其设为 IP 受限。当这些流程在升级后自行重新打开时，可能会让客户感到困惑。此外，这还会使实施稳健的发布管理策略变得复杂，我们将在\
  \ *第 7 章* 中深入探讨。\n\n通过提供流程模板和可覆盖流程，ISV 可以让客户进行自己的自定义并满足其特定的业务需求，从而增强 ISV 应用程序的价值。\n\
  \n## 融合 Flow 与 Apex\n\n![](img/44ed632038957e4c80220676e84c5109_221_0.png)\n\n啊，永恒的问题：Apex\
  \ 还是 Flow？这就像在选择一把可靠的锤子和一把多功能的瑞士军刀。在上一节中，我们进入了 Apex 的世界，见证了它通过 DI 模式、接口、虚拟基类和自定义元数据实现可定制\
  \ Salesforce 应用程序的原始力量。Apex 就像一把强大的锤子，为打造定制化应用程序提供了稳健的解决方案，但需要一定的编程专业知识才能有效发挥其力量。\n\
  \n现在，让我们谈谈 Flow，Salesforce 定制的瑞士军刀。Flow 为终端客户提供了一种更简单的方式来自定义业务流程，而无需掌握 Apex 代码的艺术。这就像从锤子切换到一个多功能的工具，拥有各种功能。\n\
  \n你知道那句老话：“如果你只有一把锤子，一切看起来都像钉子”吗？在 AppExchange 开发的世界里也是如此。如果你只知道 Apex 或只知道 Flow，你可能会做出次优的决策，例如用锤子切割木头或用刀钉钉子。要真正精通\
  \ Salesforce 定制的领域，必须同时拥有 Apex 和 Flow 在你的工具箱中，掌握每项技术并知道何时使用合适的工具。就像一位熟练的工匠一样，你将能够自信而精确地应对任何定制挑战。\n\
  \n所以，亲爱的读者，让我们踏上探索 Flow 与 Apex 和谐融合的旅程，其中一种工具的优势弥补了另一种工具的不足。一起，这些强大的工具将帮助你构建量身定制的应用程序交响曲，完美契合客户的独特需求。\n\
  \n## 作为更易自定义的 Apex 替代方案的 Flow\n\nFlow 允许终端客户克隆并使用流程模板和可覆盖流程，使他们能够在不为 DI 编写 Apex\
  \ 代码的情况下轻松修改业务逻辑。这为客户根据其独特需求定制应用程序提供了一种更易访问的方式。\n\n## 优先使用流程和可调用操作而非 Apex 触发器\n\n\
  在自动化领域，流程相比 Apex 触发器具有显著优势，得益于其灵活性和适应性。虽然流程无法涵盖触发器处理的每个场景，但它们通过使客户能够排查、停用和自定义其应用程序中打包的自动化，从而赋予客户权力。这种灵活性对于标准对象的自动化尤其重要，因为客户的自动化项目设置超出其控制范围。\n\
  \n必须认识到，您的自动化代码可能在一个组织中无缝运行，但与其他触发器、流程和验证规则结合时，可能在不同组织中导致错误。托管触发器的挑战在于其代码隐藏且不可编辑，使其难以调试且无法停用。此外，触发器代码会为实施需要自定义样板代码的触发器框架的组织带来额外的麻烦。\n\
  \n随着每次 Salesforce 版本的发布，Flow 变得更加强大，可调用操作为复杂操作提供了访问 Apex 的途径。谈到打包自动化时，我的初始建议是倾向于使用流程和可调用操作作为首选选择。然而，必须牢记指定部分中详细说明的限制，特别是关于停用和升级行为。这些考虑因素将有助于确定使用此默认建议是否存在任何障碍。\n\
  \n在最佳情况下，流程和可调用操作为客户的管理员提供了一个多功能工具包，也是解决方案架构师根据其特定需求定制您的应用的宝贵资源。通过优先使用流程和可调用操作而非触发器，您将增强\
  \ AppExchange 应用程序的适应性和易用性，进一步满足客户的独特需求。\n\n## 自定义属性编辑器 (CPEs)\n\n某些操作和组件可能相当复杂，需要管理员参考文档进行正确配置。CPE\
  \ 提供了解决方案，用于为管理员处理自定义 Flow 屏幕组件和 Apex 操作创建量身定制的 UI。要充分了解 CPE 的好处，我们必须首先检查它们是什么以及它们如何工作。\n\
  \nCPE 是 LWC，可与自定义 Apex 操作或 Flow 屏幕组件集成。这些编辑器可以根据要求和设计愿景复杂到所需的程度。\n\nISV 可以利用 CPE\
  \ 为复杂的屏幕组件和 Apex 操作创建动态、紧凑、响应迅速、用户友好且视觉上吸引人的 UI。可以使用 CPE 强制执行自定义验证，这对于实现基于输入的条件验证特别有用。这减少了因设置不完整和数据不足而导致的错误，从而减少了\
  \ Flow 元数据错误。在 CPE 的帮助下，终端用户主要是管理员，配置组件或操作变得更容易。\n\n\n\nCPE 可以被设计为创建自文档化 UI，消除了用户查阅单独参考文档的需求。\n\
  \n## 构建 CPE\n\n构建 CPE 的过程包含三个主要步骤：创建 Apex 操作、创建 CPE 本身，以及将 Apex 操作连接到属性编辑器。以下是每个步骤的简要概述：\n\
  \n- 1. **创建 Apex 操作：** 使用 Apex 代码定义自定义操作的逻辑，包括输入和输出变量。\n- 2. **创建 CPE：** 开发一个 LWC\
  \ 作为配置 Apex 操作的自定义 UI。这涉及为 UI 结构创建 HTML 文件、为处理用户交互创建 JavaScript 控制器，以及为元数据配置创建 XML\
  \ 文件。\n- 3. **将 Apex 操作连接到属性编辑器：** 使用指定 CPE 的 LWC 的 `@InvocableMethod` 注解更新 Apex\
  \ 操作。此连接允许自定义 UI 覆盖 Apex 操作的默认编辑器、UI 和输入参数。\n\n## 利用 Platform Cache 提升托管包的性能\n\n\
  ![](img/44ed632038957e4c80220676e84c5109_226_0.png)\n\n想象一下你回到老式个人电脑的时代，坐在笨重的机器前，拼命寻找那个难以捉摸的涡轮按钮。你知道的——那个承诺只需一次点击就能神奇地提升电脑速度和性能的按钮。但这里有一件事会让你微笑：就\
  \ Salesforce 中的 Platform Cache 而言，你不需要寻找按钮或寄希望于某种古老的电脑巫术。哦不，我亲爱的读者——它比那简单得多。你只需将\
  \ Platform Cache 添加到你的托管包中，瞧！你的应用程序就被注入了性能提升的涡轮增压。无需点击按钮。\n\nPlatform Cache 是 Salesforce\
  \ 提供的一项强大功能，允许开发人员快速高效地存储和访问数据。它提供了一种优化 Salesforce 应用程序性能的方法，通过减少数据检索操作所花费的时间。作为\
  \ AppExchange 合作伙伴，在你的托管包通过 Salesforce 安全审查后，你可以将 3 MB 的免费 Platform Cache 包含在其中。在本节中，我们将讨论如何在托管包中启用和利用此免费缓存分配，并通过一个具体用例来说明。\n\
  \n## Platform Cache – 概述\n\nPlatform Cache 是 Salesforce 平台内的一个内存层，存储频繁使用的数据，使开发人员能够比查询数据库更快地访问它。它运行在两个层级：Org\
  \ Cache 和 Session Cache。Org Cache 存储组织内所有用户共享的数据，而 Session Cache 存储特定于单个用户会话的数据。通过在这些层级缓存数据，开发人员可以显著减少访问常用信息所需的时间和资源。\n\
  \n值得注意的是，Platform Cache 可在从 Enterprise Edition 及以上版本的 Salesforce 版本中使用。将 Platform\
  \ Cache 整合到包中会引入版本依赖性，导致使用 Professional Edition 的组织无法使用该包。\n\n## 在托管包中启用免费 Platform\
  \ Cache\n\n要在托管包中利用 Platform Cache，请在包中定义命名空间的缓存分区，并在代码中引用它们。将免费缓存分配给所需的分区并上传应用程序的新版本。对于在\
  \ Spring ’21 发布之前已通过安全审查的现有包，当在托管包中设置分配时，缓存将在安装时自动配置。\n\n## 使用 Platform Cache 提升托管包性能\n\
  \nPlatform Cache 对于严重依赖数据检索操作的托管包尤其有益，因为它可以帮助减少延迟并改善整体性能。例如，考虑一个频繁访问配置数据或经常使用的元数据的托管包。通过将此数据存储在\
  \ Platform Cache 中，托管包可以比每次需要数据时查询数据库更快地访问它。这可以带来更快的响应时间、改进的应用程序性能以及更好的客户 UX。\n\n\
  ## 案例研究 – 使用 Platform Cache 提升 Formula Debugger 的性能\n\n如果你仍对如何使用 Platform Cache\
  \ 感到困惑，不必担心！我们即将通过深入探讨 Platform Cache 在 Formula Debugger 中的应用来阐明这个问题，该应用我们在 *第 1\
  \ 章* 中曾介绍过。这是为了解决在大型 Salesforce 组织中审查元数据架构时出现的性能问题。\n\nFormula Debugger 应用旨在帮助用户识别和解决\
  \ Salesforce 组织中公式字段的问题。该工具面临的主要挑战之一是高效地找到组织内的所有公式字段，这需要分析大量的元数据。在非常大的 Salesforce\
  \ 组织中，此操作可能耗时且可能对 UX 产生负面影响。\n\n为克服这一挑战，Formula Debugger 应用利用 Platform Cache 来增强性能并提供无缝的\
  \ UX。以下是其工作原理：\n\n- **即时访问：** 如果在应用启动期间平台缓存已填充，存储的值会立即提供给用户。这使得应用可以即时使用，消除了通常与繁重计算相关的等待时间。\n\
  - **缓存为空时的实时检索：** 如果平台缓存未填充，Formula Debugger 会尝试实时检索所有公式字段。然而，随着元数据的增多，可能会发生超时。如果发生这种情况，Formula\
  \ Debugger 仅会显示初始可用的公式字段。用户将看到一条消息，内容为：**由于您组织元数据的庞大，仅初始公式字段可立即用于调试。我们正在后台处理元数据。请稍等片刻并刷新页面，如果您需要调试当前未列出的字段。**\n\
  - **异步缓存更新：** 每次启动应用时，都会在后台启动一个异步计算过程（以 Apex `Queueable` 类实现）。此过程可确保缓存值使用最新数据进行更新。\n\
  - **在平台缓存中存储公式字段：** 在异步过程识别出公式字段后，它们会被存储在平台缓存中。此方法可确保更快访问，因为后续对公式字段的请求直接从缓存获取，消除了持续元数据分析的需求。这有助于避免在元数据量大的情况下达到\
  \ Apex 超时限制。\n- **无缝 UX：** 由于公式字段已随时可用在 Platform Cache 中，Formula Debugger 应用的用户可以在使用该工具时享受流畅、无中断的体验。缓存数据使应用程序即使在具有大量元数据的大型\
  \ Salesforce 组织中也能最佳运行。\n\n下图说明了该过程：\n\n![](img/44ed632038957e4c80220676e84c5109_231_0.png)\n\
  \n图 3.2：流程图展示 Formula Debugger 如何使用 Platform Cache 提升性能\n\n需要注意的是，缓存每次启动应用时都会重新计算。这意味着如果用户添加了新的公式字段并希望立即在应用中看到它，他们可能需要等待缓存完成重新计算。在\
  \ Formula Debugger 的上下文中，这不是一个重要问题。如果你刚刚创建了一个公式字段，很可能你还没有问题，因此立即调试可能不是必要的。然而，这种关于缓存刷新方面的权衡可能会影响你的设计决策。\n\
  \n总之，Platform Cache 是 ISV 优化其托管包性能的宝贵资源。通过利用此功能，该功能对通过 Salesforce 安全审查的应用免费提供，你可以显著减少数据检索时间并增强整体\
  \ UX。\n\n## 使用 SLDS 打造 UI 和 UX\n\n从上一章开始，你现在知道你的应用应该做什么。随着我们开始将这一愿景变为现实，请记住这不仅仅是功能问题。视觉上吸引人且流畅的\
  \ UX 同样重要。\n\n记住——精心设计的 UI 和卓越的 UX 是成功应用的心跳。它们不仅满足用户的需求和痛点；我们准备将我们的应用构建为不仅仅是一个工具，而是用户实现目标道路上的伴侣。\n\
  \n\n\n本节的重点在于打造一套 UI 和 UX，能够将我们的用户需求与 SLDS 精致、一致的美学无缝结合。这一全面的设计框架将使我们的应用程序与 Salesforce\
  \ 生态系统熟悉、用户友好的外观和感觉产生共鸣，确保用户在浏览您的应用程序时感到宾至如归。\n\n## 了解 Salesforce Lightning 设计系统\
  \ (SLDS)\n\nSLDS 是一个全面的设计框架，为在 Salesforce 应用程序中创建一致且引人入胜的 UI 提供了丰富的指南、组件和资源。由 Salesforce\
  \ 开发，SLDS 允许开发人员和设计师使用一套遵循 UX 和可访问性最佳实践的预建 UI 组件和模式来构建自定义应用程序。通过利用 SLDS，您可以确保您的应用程序与\
  \ Salesforce 平台保持一致的外观和感觉，使用户能够更直观地导航和与您的应用程序交互。\n\n## SLDS 的关键组件和功能\n\nSLDS 包含多个关键组件和功能，可促进顺畅高效的开发流程，同时确保高质量的\
  \ UX，具体如下：\n\n- **设计指南：** SLDS 提供了详细的 UI 设计指南，涵盖颜色、排版、布局和图标等各个方面。这些指南有助于在整个应用程序中保持一致性，并与整体\
  \ Salesforce 生态系统保持一致。\n- **预建组件：** SLDS 提供了一个全面的预建、可重用 UI 组件库，遵循 UX 和可访问性的最佳实践。这些组件可以轻松定制并集成到您的应用程序中，在开发过程中为您节省时间和精力。\n\
  - **设计令牌：** 设计令牌是存储设计相关值的变量，例如颜色、字体和间距。它们使您能够更高效、一致地管理应用程序的设计，使您能够轻松地在多个平台和设备上更新设计。\n\
  - **可访问性：** SLDS 在设计时充分考虑了可访问性，确保您的应用程序可供残疾人士使用。通过遵循 SLDS 指南并使用预建组件，您可以创建符合可访问性标准和最佳实践的包容性应用程序。\n\
  \n## 利用设计原则实现一致性和效率\n\nSLDS 建立在一套核心设计原则之上，促进所有应用程序的一致性、效率和可用性，具体如下：\n\n- **清晰性：**\
  \ SLDS 通过使用简洁的布局、简洁的语言和适当的视觉提示来强调简单性和清晰的沟通\n- **效率：** 该系统旨在帮助用户通过最小化点击次数、优化工作流程并在上下文中提供相关信息来快速高效地完成任务\n\
  - **一致性：** SLDS 通过提供统一的设计指南和组件集，确保应用程序之间的一致外观和感觉，使用户能够轻松理解和与 Salesforce 平台上的不同应用程序交互\n\
  - **灵活性：** SLDS 旨在灵活且可适应，允许您自定义和扩展设计以满足特定的应用程序要求，同时保持与 Salesforce 生态系统的一致性\n\n通过采用这些设计原则，您可以创建不仅满足客户需求的\
  \ UI，而且还能提供与 Salesforce 平台一致的卓越 UX。\n\n## LWC 标准组件库\n\n在深入 SLDS 时，了解 LWC 标准组件库³\
  \ 也至关重要。该库是一套全面的预建组件，可轻松集成到任何 LWC 开发中。\n\n3 https://developer.salesforce.com/docs/component-library/overview/components\n\
  \n为什么优先考虑 LWC 标准组件而不是 SLDS 标签？让我们看看这样做的原因：\n\n- **一致性和最佳实践：** 使用标准组件可确保您遵循 Salesforce\
  \ 对 UI 和 UX 的最佳实践。这些组件以最终用户为出发点设计，确保所有 Salesforce 应用程序的一致体验。\n- **快速开发：** 借助预建组件，开发人员可以加快开发流程。当合适的组件已经可用时，就无需从头开始构建。\n\
  - **维护和更新：** Salesforce 不断更新和维护 LWC 标准组件库。通过使用这些组件，您可以确保您的应用程序始终保持最新功能和最佳实践。\n-\
  \ **兼容性：** 标准组件旨在与其他 Salesforce 服务和工具无缝协作。这可确保在您扩展或集成其他服务时，您的应用程序保持兼容。\n\n虽然 LWC\
  \ 标准组件库应成为大多数开发任务的首选，但在以下情况下 SLDS 标签可能更合适：\n\n- **自定义：** 如果您需要标准库中不可用的组件或需要大量自定义，SLDS\
  \ 标签可以提供更大的灵活性\n- **高级功能：** 对于超出标准组件功能的功能或设计，SLDS 提供了打造独特 UX 的工具\n\n总之，虽然 SLDS 提供了构建独特\
  \ UI 的强大工具集，但 LWC 标准组件库应成为大多数前端开发任务的首选。这种方法可确保应用程序一致、可维护且用户友好。\n\n## 构建卓越的应用程序\n\
  \n创建出色的 UX 并不是一个人的工作，也不会在部署后结束——它是一个协作的、持续的过程，从构思到实施及以后都体现了用户的声音。UI 和 UX 设计师以及研究人员确保这种声音在产品开发的各个阶段都能得到体现，将用户需求与业务目标和技术要求相协调。\n\
  \n捷豹路虎首席执行官 Ralf Speth 博士曾名言，“如果你认为好的设计很昂贵，你应该看看糟糕设计的成本。” 这种智慧与我们的旅程高度共鸣。忽视 UX 可能会产生巨大的成本，从增加客户支持到额外的开发工作（和返工），甚至可能导致产品失败。这就像在没有检查泄漏的情况下下水——风险很大，很可能灾难性。\n\
  \n## 摘要\n\n![](img/44ed632038957e4c80220676e84c5109_238_0.png)\n\n亲爱的读者，随着我们穿越 Salesforce\
  \ 生态系统的精彩旅程继续，我必须强调本章是掌握关键 Salesforce 技术的关键。我们刚刚结束了对塑造 AppExchange 格局的鲜为人知却极其宝贵的\
  \ ISV 专属功能的激动人心的探索。我们揭示了托管包、Apex、Flow、Platform Cache、CPEs 以及打造 UI 和 UX 的深层奥秘。我邀请您在积累经验的过程中定期重温本章，确保这些见解保持新鲜和相关。您不必记住所有技术的实现细节，但能够解释它们的功能以及最适合的场景，将使您在规划即将到来的开发工作时能够做出明智的技术选择。\n\
  \n您现在手握解锁这些强大技术全部潜力的钥匙，这些技术在传统的 Salesforce 开发中常被忽视，却对 ISV 至关重要。您在这段旅程中积累的智慧对于熟练实施您的托管包至关重要。您对这些不同方面的掌握将使您能够打造创新、量身定制且高效的应用程序，精美地满足客户需求的多样性。将您新获得的技能作为垫脚石，助您迈向我们冒险的下一个激动人心的篇章。\n\
  \n在下一章中，我们将深入探讨与外部系统的无缝集成。我们将探索各种技术架构和一系列集成模式。我们将穿越 Salesforce APIs、Salesforce Connect、Canvas\
  \ SDK 和 Connected Apps。想象一下成为集成巫师，创建满足客户需求并提供顶级 UX 的应用程序。\n\n所以，准备好吧，读者。我们 Salesforce\
  \ 之旅的下一章甚至更加令人兴奋，因为我们将进一步深入 Salesforce 宇宙，磨练我们的技能以实现 AppExchange 成功！\n\n\n\n## 进一步阅读\n\
  \n如果您渴望深入了解托管包的技术细节，我建议您查阅由 Andrew Fawcett 所著的书籍 *Salesforce 平台企业架构*。该资源有助于培养对 Salesforce\
  \ 平台所提供功能更深刻的理解，并发掘有效利用这些功能进行应用程序开发的方法。\n"
- "## 与外部系统的无缝集成\n\n![](img/44ed632038957e4c80220676e84c5109_241_0.png)\n\n欢迎，各位开拓者，踏上我们的下一段冒险：Salesforce\
  \ 中与外部系统无缝集成的激动人心的领域！如果迄今为止我们的旅程是关于了解 Salesforce 领域的布局，那么本章将教我们如何搭建桥梁，将我们的创作与更广阔的世界连接起来。\n\
  \n您即将在本章中学到的不仅仅是一套必备技能；它是打造能够灵活跨越不同系统之间鸿沟的强大应用程序的基石。在充满活力的 Salesforce 生态系统中，您掌握的每个元素都是冒险者工具包中的又一件工具。那么，让我们回顾一下本章将要添加的工具：\n\
  \n- 技术架构：将其视为不同类型桥梁的蓝图。我们将探讨 ISV 可用的两种主要蓝图，以及它们如何影响您所搭建的桥梁。\n- 集成模式：这些模式就像您值得信赖的指南。就像培育充满活力的花园需要了解不同植物的独特需求一样，将您的\
  \ AppExchange 应用程序与其他系统集成也需要了解不同的集成模式。\n- Salesforce API：API 就像您构建桥梁所需的材料，使您的应用程序与外部平台之间建立连接。\n\
  - Salesforce Connect：想象一下此功能就像一辆魔毯，可以将来自遥远之地（外部源）的数据直接飞入您的 Salesforce 实例。\n- Canvas\
  \ SDK：此工具包就像一支熟练的工匠团队，帮助您在 Salesforce 界面中嵌入第三方 Web 应用程序。\n- 已连接应用：这些定制构建的应用程序就像安全通行证，在\
  \ Salesforce 与外部系统之间授予访问权限。\n\n到本章结束时，您将熟练掌握使用 Salesforce 的卓越工具在应用程序与外部系统之间搭建桥梁。收拾好装备吧，各位冒险者，让我们继续对\
  \ Salesforce 荒野进行令人振奋的探索！继续前进，获得更深入的理解、集成，以及，是的，冒险！\n\n## 技术架构\n\n开展与 Salesforce\
  \ 协作构建应用程序的旅程，可能有点像站在大都市的十字路口。您有两个主要起点可供选择，每个起点都通向一种独特的应用程序类型。\n\n第一条道路通向原生应用，这些应用主要在\
  \ Salesforce 生态系统内构建，并且不与外部系统集成。第二条道路通向复合应用，这些应用旨在与 Salesforce 之外的其他系统无缝集成。\n\n\
  这些道路的区别在于构建应用程序时所使用的 Salesforce 技术数量。然而，值得注意的是，这些路径并非严格线性。有时，合作伙伴会发现自己从原生应用转向复合应用，反之亦然，这表明这些道路可能会随着时间的推移而相交和交叉。\n\
  \n正如城市的建筑可以赋予其独特的风味，应用程序类型的选择对其设计有着深远的影响。每个应用程序都经过精心打造，可无缝融入客户的 Salesforce 景观，就像一座新建筑与城市天际线和谐地融合在一起。但关键部分来了。这种选择不仅仅是关于\
  \ Salesforce 生态系统内的美观或功能。对于复合应用而言，考虑与外部系统的集成至关重要，这可能需要使用上一章中未涵盖的技术和概念。\n\n就像城市规划者在设计新城区时考虑道路连接一样，您对应用程序类型的决策会影响与外部系统的集成路径。这不仅仅是构建一个独立实体，而是构建一个更大网络中相互连接、交互的组件。因此，当您开始绘制应用程序蓝图时，请记住这一点：您所构建的应用程序类型不仅定义了其独立结构，还定义了它与\
  \ Salesforce 之外的世界互动、集成的方式，并可能引入复杂性。\n\n## 原生应用程序\n\n原生应用程序完全构建在 Salesforce 平台上，并充分利用\
  \ Salesforce 的基础设施管理、核心功能和创新。此类应用程序受益于市场上最强大的功能，因为它们 100% 建立在 Salesforce 平台之上。\n\
  \n原生应用程序的关键方面包括以下内容：\n\n- 完全构建在 Salesforce 平台上\n- 受益于 Salesforce 的基础设施管理和核心功能\n\
  - 与客户的 Salesforce 实例无缝集成\n- 快速开发和创新\n- 无需担心数据驻留——所有数据都托管在客户 Salesforce 实例所在的位置\n\
  \n## 复合应用程序\n\n复合应用程序是 ISV 构建的最常见的应用程序类型。这些应用程序主要在平台外构建，但包含部分构建在 Salesforce 平台上的功能。通过利用\
  \ Salesforce 技术，复合应用程序可以更无缝地融入客户的 Salesforce 实例，从而提高可见性和采用率。\n\n复合应用程序的关键方面包括以下内容：\n\
  \n- 应用程序的部分构建在平台外\n- 部分功能构建在 Salesforce 平台上\n- 与客户的 Salesforce 实例无缝集成\n- 更高的可见性和更高的采用率\n\
  \n## 集成的扩展包\n\n在将 Salesforce 与外部系统集成时，确保产品的核心功能不受影响至关重要。如果集成不是核心产品的主要组成部分，请考虑将其作为扩展包交付，您可能在\
  \ *第 4 章* 中回忆起这一概念。\n\n保持集成在核心包之外的想法源于解耦的需求。这种分离确保集成模块中的任何潜在问题或更改都不会影响核心产品的性能或功能。\n\
  \n此外，客户通常具有多样化的集成需求。有些人可能希望与常用的外部系统连接，而其他人可能具有根据其运营量身定制的具体要求。通过采用扩展包，您可以在不使核心产品复杂化的情况下满足这些不同的需求。\n\
  \n本质上，虽然集成在增强产品功能方面发挥着至关重要的作用，但以模块化思维方法对待它们至关重要。扩展包提供了一种结构化解决方案，确保核心产品精简，同时提供灵活性以满足不同的集成要求。\n\
  \n## 集成模式\n\n![](img/44ed632038957e4c80220676e84c5109_247_0.png)\n\n创建 AppExchange\
  \ 应用程序类似于培育美丽的花园。每种集成模式都是一种不同的植物或花朵，为花园的丰富性和多样性做出贡献。有些植物可能需要更多的水（数据），其他植物需要更多的阳光（API），还有一些植物需要更多的养分（用户交互）。这全都在于了解它们独特的需要并相应地培育它们，以便您的花园（应用程序）蓬勃发展。Salesforce\
  \ 在定义这些集成模式方面取得了显著进展，这些模式涵盖在其备受推崇的认证之一中：Integration Architect¹。Integration Architect\
  \ 认证为专业人士提供知识和专业知识，使其能够有效地驾驭应用程序集成的复杂性。对于严重依赖集成的组织，强烈建议确保技术团队中至少有一名个人获得此资格。通过这样做，他们可以利用从\
  \ Salesforce 全面的集成模式框架中获得的见解，从而优化其集成流程并提高整体应用程序性能。\n\n1 https://trailhead.salesforce.com/help?article=Salesforce-Certified-Integration-Architect-Exam-Guide\n\
  \n## 远程过程调用——请求和回复\n\n此模式涉及客户端应用程序向远程服务发出请求并等待响应。客户端在收到响应或发生超时之前处于阻塞状态。此模式通常用于客户端需要在继续之前处理响应时使用。\n\
  \n例如，ISV 可能会使用此模式将第三方支付处理服务集成到其 AppExchange 应用程序中。当客户付款时，应用程序向支付服务发送请求，并在继续之前等待确认响应。\n\
  \n## 远程过程调用——即发即弃\n\n在此模式中，客户端应用程序向远程服务发送请求，但不等待响应。当客户端不需要\n\n立即处理响应，或根本不处理。\n\n\
  例如，ISV 可以使用此模式将来自其 AppExchange 应用的使用数据发送到远程分析服务。应用程序可以在不等待分析服务响应的情况下继续运行。\n\n##\
  \ 批量数据同步\n\n批量数据同步涉及在计划的间隔内传输大量数据。当不需要实时数据时，此模式很有用，对于大型数据集而言，其比实时传输数据更高效。\n\n一个例子可能是\
  \ ISV 需要每晚在 AppExchange 应用程序和远程数据库之间同步数据。应用程序全天收集数据，然后在非高峰时段以单批方式全部发送到数据库。\n\n##\
  \ 远程调用\n\n远程调用模式涉及远程服务向客户端应用程序发出请求。这与远程过程调用模式相反，在该模式中客户端向服务发出请求。\n\n一个例子是 ISV 将其\
  \ AppExchange 应用与外部地址验证服务集成。当用户在应用程序中输入地址时，AppExchange 应用会发送请求以验证地址的准确性和格式。外部地址验证服务随后检查地址并返回验证结果，确保数据的准确性和一致性。\n\
  \n## 基于数据变化的 UI 更新\n\n此模式涉及根据托管在平台外的底层数据的变化来更新应用程序的用户界面。这使应用程序能够向用户提供实时反馈。\n\n例如，ISV\
  \ 可以使用此模式在托管在其 AWS 实例中的底层数据发生变化时更新其 AppExchange 应用程序中的驾驶舱。一旦检测到更改，应用程序就会更新 Salesforce\
  \ 驾驶舱以反映新数据。\n\n## 数据虚拟化\n\n数据虚拟化是一种数据管理方法，允许应用程序在无需了解数据的技术细节（例如其在源处的格式或物理位置）的情况下检索和操作数据。这降低了数据错误的风险以及移动可能永远不会使用的数据的工作量，并且不会试图对数据强加单一的数据模型。\n\
  \n例如，ISV 可能会使用数据虚拟化在其 AppExchange 应用程序中提供来自多个来源的数据的统一视图。应用程序可以像所有数据都在单个位置一样访问和操作数据，即使实际上数据分布在多个数据库中。\n\
  \n## 选择合适的集成模式\n\n为您的应用程序选择合适的集成模式是一个关键决策，会显著影响其性能、用户体验和整体成功。在深入编码细节之前，请花点时间进行深思熟虑。通过自问以下问题，您可以简化开发流程，并通过确保选择最合适的设计模式来可能节省数周的努力。\n\
  请记住，少量的前期规划在创建稳健高效的集成解决方案方面可以大有裨益。\n\n### 1. 需要什么交互级别？\n\n考虑客户端应用程序与远程服务之间所需的交互程度。您需要立即响应，还是应用程序可以在等待响应的同时独立运行？如果实时交互至关重要，则同步模式可能最佳。另一方面，如果应用程序可以在没有即时反馈的情况下继续运行，您可以探索不会阻塞应用程序进度的异步模式。\n\
  \n### 2. 数据一致性有多重要？\n\n思考在应用程序和远程服务之间保持一致数据的重要性。如果数据准确性至关重要，则促进同步通信和即时反馈的模式可能是合适的选择。然而，如果可以容忍数据中的细微差异，异步模式可能提供更多灵活性。\n\
  \n### 3. 真的需要实时响应吗？\n\n考虑客户端应用程序是否必须在继续之前等待远程服务的响应。如果不是，允许非阻塞通信的模式，例如“即发即弃”，可能更有优势。这种方法可以防止应用程序工作流程和响应能力的延迟。\n\
  \n### 4. 数据量是多少？\n\n评估需要传输的数据量。对于大型数据集，批量数据同步模式可能比实时传输更高效、更实用。这可以帮助您管理网络资源并保持应用程序的性能。\n\
  \n### 5. 谁发起请求？\n\n检查远程服务是否需要向客户端应用程序发起请求。根据通信方向，您可能需要选择特定的调用模式，例如“远程调用”模式，以适应这些场景。\n\
  \n### 6. 是否需要实时 UI 更新？\n\n思考应用程序的用户界面是否应根据外部数据变化实时更新。如果是，则“基于数据变化的 UI 更新”等模式可以帮助您提供动态且响应迅速的用户体验。\n\
  \n### 7. 是否涉及不同的数据源？\n\n如果您的应用程序需要在不强加单一数据模型的情况下处理来自各种来源的数据，请考虑“数据虚拟化”模式。这种方法可以在无需大量数据转换工作的情况下统一数据。\n\
  \n通过花时间思考这些问题，您为集成解决方案奠定了坚实的基础。请记住，一个小时的深思熟虑的规划可以转化为开发过程中节省的数周时间，从而实现更高效、更有效、更成功的\
  \ AppExchange 应用程序。因此，在编写第一行代码之前，请参与这一关键的最优模式选择阶段。\n\n## 外发集成的可用技术\n\nSalesforce\
  \ 提供了一系列工具和方法来促进与外部系统的外发集成。在本节中，我们将探讨 Salesforce 平台提供的最流行和最广泛使用的外发集成技术。\n\n### 使用\
  \ Flow 的声明式\n\nSalesforce 中的声明式外发集成主要通过使用 Flow 实现。Salesforce Flow 是一款强大的工具，允许用户无需编写代码即可自动化业务流程。在外发集成的领域中，Flow\
  \ 提供两种主要方法：外发消息和外部服务。\n\n外发消息是 Salesforce 在满足特定条件时发送给外部系统的 SOAP 消息。它们旨在通知外部系统 Salesforce\
  \ 数据的变化。另一方面，外部服务为流程直接集成第三方 API 提供了一种方式，支持使用 GET、POST、PUT、PATCH 和 DELETE 等方法的 HTTP\
  \ 调用。在创建外部服务包时，开发人员可以向外部服务注册包添加命名凭据组件，或者订阅者可以在其组织中建立与外部服务注册中指示的命名凭据匹配的命名凭据。\n\n\
  ### 使用 Lightning Web Components 的编程方式\n\nLightning Web Components (LWC) 虽然主要设计用于在\
  \ Salesforce 平台上构建动态用户界面，但也能够执行编程外发集成。\n\nLWC 利用现代 Fetch API 向外部服务进行调用。此 API 提供了一种灵活高效的方式来获取资源，无论是通过\
  \ HTTP 还是 HTTPS。LWC 中的 Fetch API 允许开发人员向外部服务发出异步请求。开发人员可以指定请求方法（GET、POST、PUT、DELETE）、标头和请求正文，然后在收到响应后进行处理。\n\
  \n在从 LWC 进行调用之前，将 API 端点的基本 URL 添加到 Salesforce 中的内容安全策略 (CSP) 受信任站点至关重要。\n\n###\
  \ 使用 Apex 的编程方式\n\nApex 是 Salesforce 的专有编程语言，是希望以编程方式进行外发集成的开发人员的基石。它提供了一套全面的工具和方法来促进与外部系统的通信。\n\
  \nHTTP 和 HTTPS 调用：Apex 提供了内置类来执行向外部服务的 HTTP 和 HTTPS 调用。这些调用允许 Salesforce 与几乎任何 Web\
  \ 服务集成，无论是 RESTful 还是基于 SOAP。\n\nHttpRequest 和 HttpResponse 类：Apex 调用的核心是 **HttpRequest**\
  \ 和 **HttpResponse** 类。**HttpRequest** 类允许开发人员设置请求的各种参数，例如端点 URL、方法（GET、POST、PUT、DELETE）、标头和请求正文。一旦调用完成，外部服务的响应将被捕获在\n\
  \n一个 **HttpResponse** 类的实例，它提供了检索响应状态、头信息和正文的方法。\n\n## 你应该使用哪一个？\n\n选择 Salesforce\
  \ 中出站集成的适当技术取决于几个关键因素：所采用的集成模式、外部系统的功能以及特定的安全要求。必须将即将到来的 *集成密钥管理* 部分中强调的限制与每种技术的独特要求（如对命名凭据的需求）进行对比。根据我的经验，大多数\
  \ ISV 在构建出站集成时倾向于使用 Apex。这种偏好的理由很明确：Apex 提供了无与伦比的适应性。它赋予开发人员调整集成的每个方面的自由，从微调请求头到设计定制的错误处理策略。总而言之，虽然前方有多条道路，但集成的旅程往往在\
  \ Apex 中找到最可靠的指引。\n\n## API 还是事件？\n\n在考虑 Salesforce 与外部系统的集成时，可能还会想到另外两种技术：平台事件和变更数据捕获。\n\
  \n平台事件² 是 Salesforce 事件驱动架构的一部分。它们允许您在 Salesforce 中创建和监听自定义通知和事件。这些事件可以由 Salesforce\
  \ 和外部系统发布和订阅。\n\n2 [https://developer.salesforce.com/docs/atlas.en-us.platform_events.meta/platform_events/platform_events_intro.htm](https://developer.salesforce.com/docs/atlas.en-us.platform_events.meta/platform_events/platform_events_intro.htm)\n\
  \n变更数据捕获³ 另一方面，旨在捕获 Salesforce 数据中的更改，从而能够高效地将数据更改与外部系统同步。值得注意的是，变更数据捕获建立在平台事件的基础上，使其成为专门针对数据更改的平台事件类型。\n\
  \n3 [https://developer.salesforce.com/docs/atlas.en-us.change_data_capture.meta/change_data_capture/cdc_intro.htm](https://developer.salesforce.com/docs/atlas.en-us.change_data_capture.meta/change_data_capture/cdc_intro.htm)\n\
  \n虽然这两种技术都为集成提供了强大的解决方案，但我不会深入探讨每一个细节。我通常倾向于由于其多功能性而在大多数集成中使用 API。然而，值得注意的是，事件可能特别适合日志记录和遥测场景，尤其是在保证交付并非首要因素时。如果您有兴趣更深入地了解这些技术，有大量参考资料可供全面理解。\n\
  \n## 平台事件的挑战和限制\n\n平台事件存在若干挑战和限制⁴。主要考虑因素是它们不提供保证交付⁵，这意味着在基础设施出现问题的情况下，事件可能会丢失，使其不适合传输不可替代的数据。此外，像\
  \ CometD 这样的传输方式存在重大限制，这可能会阻碍集成的扩展。一些用户还报告了可靠性问题，指出由于网络波动，在与外部系统集成时他们错过了大约 5% 的消息。此外，在出站集成的上下文中，外部系统必须能够订阅和处理事件。这意味着它需要实现\
  \ CometD 协议并不断监听传入事件。\n\n4 https://developer.salesforce.com/docs/atlas.en-us.210.0.platform_events.meta/platform_events/platform_event_limits.htm\n\
  \n5 https://developer.salesforce.com/docs/atlas.en-us.platform_events.meta/platform_events/platform_events_considerations.htm\n\
  \n考虑到这些限制，让我们通过下表比较 API 和事件：\n\n| 准则 | API | 事件（平台事件和变更数据捕获） |\n|---|---|---|\n\
  | 可靠性 | 具有错误处理的高度可靠性。 | 存在事件丢失风险；无保证交付。 |\n| 可扩展性 | 更高限制，适合高容量集成。 | 对 CometD 等传输方式的限制。\
  \ |\n| 灵活性 | 支持推送和拉取机制。 | 主要基于推送。 |\n| 复杂性 | 简单的请求-响应方法。 | 处理遗漏事件时可能存在复杂性。 |\n|\
  \ 数据完整性 | 即时反馈确保数据完整性。 | 存在数据丢失或事件乱序的风险。 |\n\n总之，虽然平台事件和变更数据捕获为 Salesforce 客户提供了独特的优势，但从\
  \ ISV 的角度来看，API 作为将 Salesforce 与外部系统集成的更可靠、可扩展且更直接的解决方案脱颖而出。\n\n## 集成密钥管理\n\n在创建托管包时，保护集成密钥是优先事项。不同的\
  \ Salesforce 元数据类型提供了存储和管理这些密钥的方法，包括命名凭据、外部凭据和受保护的自定义元数据类型。在本节中，我们将探讨这些选项中的每一个，并提供有关为什么受保护的自定义元数据类型是大多数托管包最安全且最合适的选择的信息。\n\
  \n从命名凭据开始，它们提供了一种简化的方式来管理和验证对外部系统的调用。然而，对于托管包开发人员而言，其使用存在重大注意事项。最重要的是，命名凭据可以被订阅组织中的任何代码使用。这一事实固有地增加了您打包的密钥暴露和被滥用的风险。此外，命名凭据存在实际限制，例如由于安全原因无法在元数据中包含密钥值——元数据可以以纯文本\
  \ XML 访问。此外，远程端点详细信息通常无法在打包时确定，导致复杂性增加。因此，我不建议在托管包中分发密钥时使用命名凭据。\n\n同样，外部凭据虽然旨在安全地存储外部系统的密钥，但并非没有限制。根据\
  \ Salesforce 元数据覆盖报告，截至我撰写本书的 2023 年，其目前不支持 2GP 打包是主要问题。这种缺乏支持在考虑托管包的外部凭据时构成了相当大的限制。要获取有关\
  \ Salesforce 元数据支持的最最新信息，您可以查看官方 Salesforce 元数据覆盖报告 https://developer.salesforce.com/docs/metadata-coverage。该资源将允许您验证上述限制是否已得到缓解。\n\
  \n这就引出了受保护的自定义元数据类型。它们是存储 Salesforce 中密钥的高度安全选项，因为它们只能在同一命名空间内访问。这意味着它们对托管包之外的任何代码的访问或使用具有免疫力，从而增加了一层至关重要的安全保护。因此，如果您的托管包包含密钥，我建议使用受保护的自定义元数据类型。此选项还提供了存储各种配置或环境的多个密钥的灵活性。\n\
  \n然而，存储在订阅者之间有所不同且需要在每个组织中配置的密钥需要不同的方法。您可以提供创建命名凭据（新版或旧版）的说明，或开发自定义界面以安全地修改受保护的自定义元数据。\n\
  \n总之，虽然命名凭据和外部凭据各有其用例，但它们的限制通常使它们不适合在托管包中存储密钥。相反，受保护的自定义元数据类型的安全性和灵活性通常使其成为此目的的理想选择。\n\
  \n## 配置受保护的自定义元数据\n\n在使用 Salesforce 或任何类似平台时，保护元数据变得至关重要，特别是如果它包含可能影响应用程序或其用户的安全性和隐私的敏感数据。\n\
  \n受保护的自定义元数据，顾名思义，为您的元数据提供了一层保护。一旦纳入，客户组织中的用户无法读取或修改信息。这在防止未经授权的更改或潜在数据泄露方面非常有效。\n\
  \n然而，可能存在这样的场景，您可能希望受信任的人员（例如客户的管理员）在不向其提供所有元数据访问权限的情况下配置某些信息。一个常见的用例是当您希望允许配置集成所需的消费者密钥和消费者密钥时。\n\
  \n\n\n为满足此类需求，最优解决方案是设计一个配置向导。通常，这是一个简单的 Lightning Web Components (LWC) 界面，为管理员提供更新或配置必要细节的途径，而无需访问完整的元数据。有了此界面，管理员提供必要的数据，然后您的\
  \ Apex 代码会安全地将这些信息保存到受保护的自定义元数据中。\n\n## Security pitfalls\n\n虽然配置向导为管理员提供了增强的灵活性，但仍需谨慎注意潜在的安全陷阱。开发人员和管理员应了解的一个关键问题是被称为“password\
  \ echo”的漏洞。密码或任何敏感数据在输入后绝不应回显给用户，因为这是存储不安全的一个明显迹象。理想情况下，密码应使用涉及哈希和加盐的方法进行存储，确保即使系统本身也不知道明文版本，从而使密码回显实际上不可能。此外，包含敏感数据的字段，例如\
  \ **Consumer Key** 和 **Consumer Secret**，应保持隐藏。管理员在配置向导中首次输入时可能需要查看这些值，但在后续交互或编辑过程中不应能够访问它们。此外，务必始终警惕数据的记录位置。确保敏感细节不会意外出现在\
  \ debug logs、JavaScript logs 或其他非预期存储点中，对于维护系统的安全完整性至关重要。此类漏洞可能是导致安全审查失败的原因，我们将在下一章深入探讨这一主题。\n\
  \n## Utilizing Salesforce APIs for inbound integrations\n\n你可能在想，API 到底是什么？好吧，让我们拆解一下。你可以把\
  \ Application Programming Interface（API）想象成一个勤奋而有礼的管家，总是准备好将你的消息（请求）从一个房间（一个应用程序）递送到另一个房间（服务器），取回答案再带回来给你。这一切都很有《唐顿庄园》的感觉，只是我们面对的不是\
  \ Dowager Countess，而是数据。\n\n在 Salesforce 领域，API 就像高效的桥梁建造者，在你的 Salesforce Org 与其他功能之间构建坚固的连接，拓展你在商业生态系统中的版图。\n\
  \n## Types of Salesforce APIs\n\n好吧，Salesforce 拥有一个完整的 API 自助餐——每种都有其独特的风味和用途。这简直就是一场\
  \ API 拼盘聚会！\n\nSOAP and REST APIs：可将它们视为 Salesforce 提供的每项丰富 API 功能的基础。它们就像 API 世界中必不可少的面包和黄油。\n\
  \nConnect REST API：这类似于为移动应用程序提供的个人礼宾服务，擅长从推送通知到展示你的 Chatter 动态等一切事务。\n\nMetadata\
  \ API：它为你提供进入 Salesforce Org 后台的通道。它处理设置的方式就像舞台经理一样——管理自定义和构建工具，而不是舞台设备。\n\nUser\
  \ Interface API：此 API 让你可以编排一场独特的舞台表演——在这种情况下，打造一个按你设想方式呈现 Salesforce 数据或元数据的用户界面。\n\
  \nGraphQL API：将其想象为 API 乐团的指挥，通过允许客户端请求所需内容来协调和谐的交互。GraphQL 作为单一端点，根据查询动态塑造响应，而不是多个端点返回固定的数据结构。\n\
  \nBulk API：想象它是一个超级英雄助手，能够在一举之间处理庞大的数据量并以强力扫荡的方式操作记录。\n\nStreaming API：这是你的专属新闻播报员，提供实时更新流，让你随时了解\
  \ Salesforce Org 中每一次细微变化。\n\nTooling API：当复杂元数据类型需要专家之手时，Tooling API 便会介入，以精湛的技巧处理它们。\n\
  \nAnalytics REST API：最后，Analytics API 充当你的可靠间谍，深入特定数据集、筛选器和仪表板以获取宝贵的情报。\n\n## Choosing\
  \ the right Salesforce API for integration\n\n![](img/44ed632038957e4c80220676e84c5109_264_0.png)\n\
  \n选择 API 有点像速配活动——你希望能迅速找到合适的匹配。你需要实时查看数据变化吗？Streaming API 听起来不错。处理海量数据？Bulk API\
  \ 可能是你的英雄。如果你想把 Salesforce Apex 代码开放给世界，Apex SOAP 和 REST API 可能就会俘获你的心。\n\n在 API\
  \ 世界中，了解它们独特的个性和特征是建立成功关系的关键。明智选择，你将打造出一套推动生产力和创新同时始终将用户体验放在首位的强大工具组合。\n\n## Developing\
  \ an Apex REST endpoint\n\n标准 API 提供了广泛的功能并满足许多常见用例。然而，有时这些标准方案无法满足 ISV 对灵活性的需求或不符合其特定要求。这就需要构建自定义\
  \ Apex REST 端点。\n\nApex REST 方法使开发人员能够使用 Apex 编程语言构建自定义 RESTful Web 服务。这些服务在外部调用时，填补了标准\
  \ Salesforce API 可能不足的能力鸿沟。方法提供了灵活性，使开发人员能够设计符合特定需求的 API。此外，Apex REST 方法与标准 HTTP\
  \ 方法无缝集成，便于执行 CRUD 操作和各种其他操作。\n\n要使一个 Apex 类成为外部服务的灯塔，它需要被 **global** 注解装饰。这不仅将该类公开为\
  \ RESTful Web 服务，还确保其可从 Salesforce 域外部访问。\n\n## Best practices for designing your\
  \ APIs\n\nAPI 设计是一个细致的过程，遵循行业最佳实践可确保其稳健、可理解且安全：\n\n- Consistency：命名约定以及请求和响应结构的一致性可增强可用性。\n\
  - Versioning：在初始阶段进行版本控制可促进变更管理，防止潜在中断。\n- HTTP Status Codes：使用合适的 HTTP 状态码描述 API\
  \ 调用的结果至关重要。\n- Error Handling：清晰且有意义的错误消息有助于用户进行故障排除。\n- Security：纳入强大的身份验证和授权层。在\
  \ Salesforce 上下文中，OAuth 通常是首选。此外，建立输入清理和验证以防止注入和 XSS 攻击至关重要。我们将在下一章更详细地探讨这些安全要素。\n\
  - Pagination：为数据密集型端点实现分页，将结果分割为易于消化的部分。\n- Rate Limiting：执行速率限制，确保公平使用并减轻潜在滥用。\n\
  - Documentation：详细的文档，涵盖请求-响应结构、错误和示例等方面，可提升用户体验。\n\n## Potential pitfalls\n\n在\
  \ API 开发和部署的迷宫中导航时，某些陷阱会挑战旅程：\n\n- Versioning Issues：明显缺少版本控制会引发重大挑战，尤其是在产品演进且 REST\
  \ 端点修改不可避免时。当现有用户绑定到旧版本时，可能导致创建近乎相同的 REST 端点。一种补救措施是在 urlMapping 中嵌入版本号，例如 `@RestResource(urlMapping='/AccountsList/v1/*')`。从初始版本起就采用此模式可避免未来的复杂问题。\n\
  - Information Disclosure Vulnerability：诸如披露系统或调试数据之类的细微泄漏可为对手提供洞察，可能促进攻击策略。此类泄漏通常发生在系统或调试数据意外通过输出流或日志机制渗出时。为防范此问题，请创建自定义错误消息，细心地掩盖诸如堆栈跟踪、路径信息或任何调试数据等复杂细节。必须在所有\
  \ API 中修复此类漏洞。此漏洞可能是导致安全审查失败的原因，我们将在下一章深入探讨这一主题。\n\n## API rate limit management\
  \ – ensuring efficient usage\n\nAPI 速率限制是 Salesforce 管理其资源需求的机制。它在 24 小时内设置了应用程序可进行的\
  \ API 调用次数的最大限制。此功能旨在\n\n防止单个应用过度消耗资源，从而确保所有应用的资源分配均衡和系统性能最优。\n\n## API 调用限制的原理与方式\n\
  \nSalesforce 制定了 API 调用限制，其额度根据组织类型、许可证数量以及额外购买的授权而有所不同。请注意，计入这些限制的 API 调用不仅包括你的\
  \ AppExchange 应用直接发出的调用，还包括应用内任何集成服务和自动化流程发起的调用。\n\n## 高效使用 API 调用：一种战略方法\n\n妥善管理\
  \ API 调用是确保你的 AppExchange 应用平稳运行而不触及速率限制的关键。你可以考虑一些策略，例如批量处理，它允许将多条记录打包成一次 API 调用。在处理海量数据时这一点尤为重要。目标是以最少的\
  \ API 调用消耗获得最大结果——这就是效率的本质。\n\n## 预估与监控 API 使用情况\n\n不要仅仅被动应对 API 使用情况，你需要主动预防。在托管包的设计阶段，计算包中使用的每个\
  \ API 的预期使用量。这种前瞻性思考可确保你的终端客户不会意外触及限制。应用上线后，使用 Salesforce 的“API 使用通知”以及 REST API\
  \ 中的 limits 资源来密切监控你的 API 调用消耗。这些措施有助于你发现趋势并相应调整使用模式。\n\n## 处理“请求过多”错误：救援方案\n\n\
  你的应用可能会超出分配的 API 调用限制，出现“请求过多”错误。这时你需要一个稳健的方案来处理速率限制错误。实施带有指数退避的重试机制是推荐的策略，以度过这一小插曲。它在尝试下一次\
  \ API 调用前为你的应用提供超时时间。\n\n总之，熟练掌握 API 速率限制管理是精通 AppExchange 应用开发不可或缺的一部分。\n\n## Salesforce\
  \ Connect\n\nSalesforce Connect 是一项云集成服务，允许 Salesforce 用户直接在 Salesforce 内访问和管理外部应用中的数据。它使用\
  \ OData（开放数据协议）进行数据集成，使 Salesforce 能够通过 RESTful API 与外部系统中的数据交互。\n\nOData 是一种开放标准协议，以简单标准的方式允许创建和消费可查询且互操作的\
  \ RESTful API。它使 Salesforce 能够对外部系统提供完整的 CRUD 支持（创建、读取、更新、删除）。\n\n## 面向 ISV 的 Salesforce\
  \ Connect\n\n对于 ISV 而言，Salesforce Connect 提供了显著优势。它作为 ISV 合作伙伴的福利免费提供，每个合作伙伴可为每个客户获得三个许可证来连接合作伙伴拥有的数据源。这意味着\
  \ ISV 可以零额外成本将自己的外部数据源集成到 Salesforce 应用中。\n\n然而，需要注意的是该福利存在限制。免费许可证仅用于连接合作伙伴拥有的数据源，任何用于其他目的的额外\
  \ Salesforce Connect 许可证将作为附加组件额外收费。\n\n## Salesforce Connect 如何帮助降低开发成本？\n\nSalesforce\
  \ Connect 可以通过以下几种方式帮助 ISV 降低开发成本：\n\n- 简化集成：Salesforce Connect 简化了将外部数据源集成到 Salesforce\
  \ 的流程。这可以显著减少集成所需的时间和精力，从而降低开发成本。\n- 实时访问：Salesforce Connect 提供对外部数据的实时访问。这消除了数据复制的需求，而数据复制可能成本高昂且耗时。\n\
  - 易用性：Salesforce Connect 使用 OData，这是一种广泛使用且易于理解的协议。这使得开发人员更容易使用，减少学习曲线并加快开发速度。\n\
  - 降低维护成本：通过提供无缝的集成解决方案，Salesforce Connect 减少了对自定义集成解决方案的持续维护需求，从而降低长期成本。\n\n总之，Salesforce\
  \ Connect 是 ISV 的有用工具。它提供了一种简单、经济的方式将外部数据源集成到 Salesforce，增强应用的功能和多功能性。要获取 Salesforce\
  \ Connect 访问权限，ISV 可以在合作伙伴社区中以 **提交帮助案例** 类型提交案例，以便将其添加到产品目录中。\n\n## 连接的应用\n\n![](img/44ed632038957e4c80220676e84c5109_271_0.png)\n\
  \n连接的应用本质上是外部应用与 Salesforce 之间的桥梁。它使用标准协议进行身份验证、授权并为外部应用提供单点登录（SSO）。与 Salesforce\
  \ 集成的外部应用可在各种平台、设备或 SaaS 订阅上运行。\n\n例如，当你登录 Salesforce 移动应用并查看来自 Salesforce 组织的 数据时，你正在使用连接的应用。Salesforce\
  \ 移动应用是一个连接应用，它与你的 Salesforce 组织集成，为你提供数据访问权限。\n\n## 了解 Salesforce 连接应用和会话 ID\n\n\
  在 Salesforce 的互联生态系统中，连接的应用充当关键的授权工具，允许外部系统安全地“借用”会话 ID 用于特定用途。必须认识到会话 ID 所具有的强大权限——将会话\
  \ ID 授予第三方相当于递上一把上膛的枪，提供无限制的访问权限并可能延长过期时间。\n\n对于内部 Salesforce 开发，共享会话 ID 可能是可行的选择，但必须遵循严格的安全措施。相比之下，对于\
  \ AppExchange 开发，如果需要与外部系统共享会话 ID，连接的应用不仅是建议，而且由于 Salesforce 的安全审查要求而是强制性的。为了确保安全集成，ISV\
  \ 必须使用连接的应用。\n\n请允许我重复：如果你查阅的是面向 Salesforce 开发人员的资料，而不是专门针对 AppExchange 开发的资料，你会发现连接的应用并非总是授权所必需的。在某些情况下，尤其是在内部开发中，可以在没有连接的应用的情况下进行授权，包括以下情况：\n\
  \n- 一个传出消息操作，为选定用户创建会话 ID。\n- 一个交互式 Visualforce 页面使用其自身的会话 ID 调用 REST API。\n- 一个内部公司系统使用存储的用户名、安全令牌或密码登录\
  \ Salesforce 并获取会话 ID。\n\n然而，这些替代方法缺乏连接的应用所提供的先进安全措施和受控访问范围，这凸显了使用连接的应用进行安全、高效和受控集成的价值。\n\
  \n## Salesforce 连接应用的优势\n\n连接的应用提供多个关键优势。它们促进使用情况的跟踪和审计，从而提高透明度和控制力。授予的访问级别可以自定义，确保外部应用仅具有必要的权限。访问时长也灵活，且授予的访问权限可以轻松撤销，而无需更改你的\
  \ Salesforce 密码。\n\nSalesforce 本身在其产品中也使用连接的应用，例如 Workbench、Salesforce Mobile 和\
  \ Environment Hub，遵循最佳实践并展示了不直接处理原始登录凭据的重要性。\n\n## 访问令牌、刷新令牌和 Salesforce 连接应用\n\n\
  与会话 ID 类似，访问令牌和刷新令牌也提供重要访问权限，但它们设计时增加了额外的安全保障——它们可以被撤销并且权限可以受限，从而为数据管理增加另一层安全保障。\n\
  \n## 连接应用与托管包\n\nISV 通常会疑惑连接的应用是否需要成为包的一部分。虽然开发人员通常可以在没有安装包的情况下进行断言并获取访问令牌，但在某些情况下安装是必要的。这些情况包括管理员希望在没有用户交互的情况下预先授权连接的应用，或组织特定策略（如登录\
  \ IP 限制）需要为该应用放宽的情况。\n\n然而，连接的应用可以在不需要托管或非托管包的情况下安装。因此，ISV 可能不希望将连接的应用包含在托管包中。这对于托管或离平台集成尤其相关。此外，将应用包含在包中可能会因需要全局唯一的客户端\
  \ ID 或消费者密钥而使包开发复杂化。\n\n在决定是否将连接的应用纳入托管包时，有几个关键因素需要权衡。以下是主要考虑因素的分解：\n\n- 打包类型限制：连接的应用仅限于\
  \ 1GP（第一代打包）。如果你使用的是 2GP，则需要为连接的应用创建单独的包。\n- 分发范围：当你打包连接的应用时，它将对所有客户可用。这意味着每个安装\n\
  \n您的软件包将有权访问此应用。\n\n- 一致的身份验证：打包带来的优势之一是其统一性。通过打包您的连接应用，您可以确保在所有 Salesforce 组织中使用相同的消费者密钥和密钥。\n\
  - 双层身份验证：连接应用采用双层身份验证系统。第一组凭据位于用户级别，第二组位于消费者或应用级别。这种双重身份验证同时使用消费者密钥/密钥和用户令牌/密钥，增强了安全性。从本质上讲，它类似于拥有两套用户名/密码组合。虽然这看起来可能很复杂，但它并不会使部署过程变得复杂。此外，如果需要，可以在用户级别或应用级别撤销访问权限。\n\
  - 跨平台应用身份验证：在创建时，连接应用会被分配唯一的消费者密钥和密钥。这允许应用在 Salesforce 平台上进行身份验证，确保其合法性。\n- 回调 URL\
  \ 的灵活性：连接应用的一个显著优势是其支持多个回调 URL 的能力。此功能在需要指定不同环境（如生产环境和测试环境）时特别有益。通过使用多个回调 URL 打包连接应用，客户可以根据需要无缝地在生产环境和测试环境之间切换。\n\
  \n通过了解这些注意事项，您可以就连接应用是否适合您的托管软件包做出明智的决定。\n\n如果您决定在软件包中包含连接应用，一种推荐的配置连接应用以实现安全集成的方法是使用\
  \ OAuth 2.0 JWT Bearer Flow。这种稳健且安全的工作流允许应用程序自行向 Salesforce 进行身份验证，而无需共享密码或安全令牌等敏感信息。\n\
  \n## 如何（以及为什么）您的客户可以安装您的连接应用\n\n安装连接应用不仅仅是为了促进 Salesforce 与外部平台之间的集成。对于您的客户的系统管理员而言，这关乎获得控制权和增强安全性。通过安装和配置连接应用，管理员可以定义谁可以使用应用、从何处访问以及在什么条件下访问。这包括设置配置文件、权限集、IP\
  \ 范围限制，甚至实施多因素身份验证 (MFA) 以加强安全性。\n\n在深入安装过程之前，务必向您的客户的系统管理员介绍安装连接应用的重要性和方法论。此步骤可确保他们了解应用的重要性，并在必要时能够协助或接管安装。\n\
  \n在客户的 Salesforce 组织上安装连接应用有几种方法：\n\n- 通过托管软件包：这是一种最简单的方法之一，在此，系统管理员安装一个固有包含连接应用的托管软件包。\n\
  - 直接安装 URL：在连接应用未捆绑在软件包中的情况下，可以使用专用链接直接安装。此链接应在相关文档中 readily available，例如配置指南。以下是如何获取此链接的方法：\n\
  \  - 登录您设置连接应用的 Salesforce 组织。\n  - 转到 **Setup**，然后选择 **Apps**，接着选择 **App Manager**。从那里找到您的连接应用。\n\
  \  - 查找 **id** URL 参数（它将以 0Ci 开头）。找到后，将其复制并粘贴到以下链接中：\n    https://login.salesforce.com/identity/app/AppInstallApprovalPage.apex?app_id=0CiXXXXXXXXXXXX\n\
  - 使用连接应用 OAuth 使用页面：此平台列出当前链接到您组织中用户的全部 OAuth 连接应用。如果用户正在访问某个应用但尚未安装，则该应用旁边会出现 **Install**\
  \ 按钮。\n  - 转到 **Setup**，然后选择 **Apps**，接着选择 **Connected Apps**，最后选择 **Connected Apps\
  \ OAuth Usage**。从列表中选择您想要的应用，然后点击 **Install**。\n\n无论您如何安装连接应用，系统管理员都可以简单地导航到 **Setup**，然后选择\
  \ **Apps**，接着选择 **Connected Apps**，最后选择 **Manage Connected Apps**。从那里，您可以调整应用的本地访问权限。\n\
  \n## Canvas SDK\n\nSalesforce Canvas SDK 是一款成熟且强大的工具，旨在将外部 Web 应用与 Salesforce 无缝集成。该技术在\
  \ Salesforce 与其他平台之间建立了桥梁，提供多种有效的 UI 集成选项。虽然 canvas 应用提供了大量机会，但了解其优势、局限性和适用用例是充分发挥其潜力的关键。\n\
  \n## Canvas SDK 的固有挑战和优势\n\nCanvas SDK 尽管是一款强大的工具，但面临着关于 UI 和 UX 一致性的重大挑战。由于它将外部系统的用户界面带入\
  \ Salesforce，这可能并不总是能与 Salesforce 原生的 UI 和 UX 规范无缝对齐。这种差异可能会阻碍希望在应用中实现一致用户界面体验的\
  \ ISV。因此，尽管 Canvas SDK 是一款成熟且功能强大的技术，但其在 ISV 中的采用率并未像预期那样广泛。\n\n然而，Canvas SDK 提供了多个显著优势，在合适的条件下使其成为一个有吸引力的选择。主要优势之一是开发成本可能更低，尤其是在外部系统已有界面的情况下。与在托管软件包中构建自定义用户界面并通过\
  \ API 集成相比，这一优势可能非常显著。\n\n此外，Canvas SDK 可以简化连接应用框架内的操作，消除了维护两个相关代码库的需求——一个用于托管软件包，另一个用于外部系统。通过减少代码库数量，开发人员可以简化工作流程并降低系统的整体复杂性。\n\
  \n## Aura 与 Visualforce 与 LWC\n\n开发人员在 Salesforce 中展示 canvas 应用时主要有两个选择：Aura 组件和\
  \ Visualforce，各自具有独特的优势和局限性。Visualforce 允许导入 Canvas JavaScript SDK 来处理 Canvas 事件。另一方面，Aura\
  \ 组件可以使用 `lightning:isUrlAddressable` 功能维护 Salesforce 全局导航标题。需要注意的是，截至 2023 年，**Lightning\
  \ Web Components (LWC)** 不支持 Canvas，限制了在 Salesforce 生态系统中使用该技术的选项。\n\n## Canvas\
  \ 应用配置和打包困境\n\nCanvas 应用的关键配置，例如 OAuth 启用、canvas 应用 URL、访问方法和位置，均在连接应用中管理。开发人员还可以使用\
  \ Canvas 生命周期处理程序在运行时管理 canvas 应用的额外方面。\n\nCanvas 应用虽然提供多种优势，但由于其在保持 UI 一致性方面的局限性以及缺乏对\
  \ LWC 的支持，并不常被使用。还需要注意的是，Salesforce 倾向于劝阻 ISV 使用 Canvas，并非出于安全问题——事实上，与 IFrame 解决方案相比，Canvas\
  \ 更安全——而是出于认知问题。使用 Canvas 可能会被视为缺乏与 Salesforce 集成方面的认真承诺。当 ISV 在 AppExchange 上发布面向\
  \ Salesforce 的基于 Canvas 的解决方案时，他们可能会忽视 Canvas 通常意味着两种不同的用户体验这一事实。这可能会让客户措手不及，并可能降低成功销售的机会。Canvas\
  \ 可能还存在额外的技术缺陷，这可能会使合作伙伴关系和应用成功变得不太可能。\n\n如果您正在考虑使用 canvas 应用，建议与 Salesforce 或其中一家\
  \ **Product Development Outsourcer (PDO)** 合作伙伴讨论您的用例，该合作伙伴在 *Chapter 12* 中有描述。他们的专业指导可以帮助确保您的\
  \ Salesforce 集成符合最佳实践并取得成功。\n\n## 通过 REST API 与 Canvas SDK 集成比较\n\n在 Salesforce\
  \ 中开发轻量级应用时，选择使用 REST API 集成还是 Canvas SDK 应由多个因素指导，每个因素都对开发的便捷性、灵活性以及集成的最终成功产生影响。在下面的表格中，我们从多个角度对比\
  \ REST API 和 Canvas SDK，以帮助您做出明智的决定。\n\n|  | REST API 集成 | Canvas 应用 |\n|---|---|---|\n\
  \n| 因素 |  |  |\n|---|---|---|\n| 交互性和集成深度 | 易于实现交互功能和更深层次的集成，提供更丰富的用户体验。 | 由于 Canvas\
  \ SDK 的专有性质，实现交互性和更深层次的集成可能具有挑战性。 |\n| 标准合规性 | 使用得到良好支持且广为人知的互联网标准，简化开发流程。 | 依赖专有\
  \ SDK 和技术，可能无法被普遍理解，造成潜在的学习曲线和集成挑战。 |\n| 后端和前端分离 | 在后端和前端之间保持清晰的分离，促进代码更清洁、更易维护。\
  \ | 通常导致后端和浏览器脚本混合，复杂化代码管理和关注点分离。 |\n| **连接应用的要求** | 无需连接应用，简化设置并减少管理开销。 | 需要连接应用，这增加了打包和设置的复杂性。\
  \ |\n| **对 Lightning 和 SLDS 的支持** | 完全支持 Salesforce Lightning 和 Salesforce Lightning\
  \ 设计系统 (SLDS)，确保与 Salesforce 环境一致的 UI 和 UX。 | 对 Lightning 和 SLDS 的支持有限，可能导致与标准 Salesforce\
  \ 环境相比 UI 和 UX 不一致。 |\n| 启动和扩展 | 允许从简单应用开始，并根据需求逐步扩展功能。 | 初始设置可能复杂，通过添加功能扩展可能需要大量重构。\
  \ |\n\n对于开发轻量级应用程序，REST API 集成似乎比 Canvas 应用提供更多优势，尤其是在标准合规性、设置简易性和对 Lightning 和\
  \ SLDS 的支持方面。\n\n此外，REST API 对迭代开发的支持使其成为满足不断变化的应用需求的更灵活选择。\n\n## Summary\n\n![](img/44ed632038957e4c80220676e84c5109_285_0.png)\n\
  \n幹得好，英勇的探险者们！你们已成功完成我们冒险的这一阶段，深入探索了 Salesforce 中与外部系统无缝集成的世界。你们英勇地破解技术架构之谜，并致力于培育各种集成模式，就像一位尽职的园丁一样，为你们带来了丰硕的知识。\n\
  \n你们大胆的探索带领你们穿越了 Salesforce API 的领域，犹如发掘隐藏的宝藏。你们发现了 Salesforce Connect 的魔力，它是你们的个人传送装置，准备将来自遥远土地的数据带入你们的\
  \ Salesforce 王国。Canvas SDK 展现为你们忠诚的工匠，将第三方应用程序无缝嵌入 Salesforce，而连接应用则作为警惕的守门人，确保\
  \ Salesforce 与外部系统之间安全通行。\n\n当我们告别这一章节时，请记住你们所收集的见解对于构建能够与外部系统轻松集成的稳健应用程序是无价的。但请保留你们的探险者帽子，因为我们的下一场冒险将我们带入安全审查流程。我们将解读\
  \ Apex 和 LWC 代码要求的神秘卷轴，并学习如何调查外部系统和端点以寻找潜在威胁。你们将掌握行业工具 Salesforce Code Analyzer\
  \ 和 Checkmarx，以确保代码的安全性和合规性。我们还将准备文档并识别误报，这对于成功通过安全审查至关重要。因此，请紧握冒险者的指南针，让我们继续这段令人激动的旅程，迈向\
  \ AppExchange 成功！\n"
- "## Security Review\n\n![](img/44ed632038957e4c80220676e84c5109_287_0.png)\n\n问候，数字领域的勇敢冒险者们！当我们穿越不断发展的\
  \ Salesforce 格局时，我们面临一个关键挑战——被称为“安全审查”的凶猛巨龙。啊，这是一只可怕的野兽，但不必害怕！我们高尚的使命，凭借正确的知识和工具，是驯服这条巨龙，赢得它的信任，并最终确保我们珍贵宝藏——客户数据的安全。\n\
  \n为以下领域的旅程做好准备：\n\n- 安全审查流程的重要性及其在维护 Salesforce 应用高安全标准中的作用\n- 确保符合 Salesforce 安全要求并避免常见陷阱\n\
  - 扫描外部系统和端点的工具和技术\n- 准备误报文档以实现更顺畅的安全审查流程\n- 作为 AppExchange 合作伙伴，拥抱持续安全改进的旅程\n\n\
  在本章结束时，你将成为安全审查流程的熟练导航者，能够与你的 Salesforce 用户建立信任，并确保你的应用程序在 AppExchange 的宏大王国中蓬勃发展。\n\
  \n紧紧系好靴子， fellow 探险者们！我们的旅程继续，动力来自 Salesforce 首席技术官 Parker Harris 的名言，“没有什么比我们公司客户数据的隐私更重要。”因此我们前进，迈向安全的\
  \ Salesforce 冒险的未来！\n\n## Understanding the security review process\n\n![](img/44ed632038957e4c80220676e84c5109_289_0.png)\n\
  \n欢迎来到开发你的第一个 AppExchange 应用程序的激动人心的马拉松！你正系紧鞋带，站在起点线上，在这里创新的冲刺与安全的耐力携手并进。Salesforce，作为\
  \ **客户关系管理** (**CRM**) 平台马拉松中的世界级赛事组织者，将其声誉押在了一件事之上——信任。而在这场信任马拉松中的一个重要补给站？安全审查流程——每个应用程序必须通过的详尽审查，类似于我们马拉松的严格检查点，然后才能抵达\
  \ Salesforce AppExchange 市场的终点线。\n\n将安全审查流程想象成你的个人马拉松教练，深入研究你应用程序的设计、架构和数据处理实践的细节。它的使命？发现那些狡猾的潜在安全抽筋，并确保你的应用程序足够健康，能够跑完\
  \ Salesforce 高安全标准马拉松。这是在起跑线上的彻底搜身，从应用程序的跑步装备（源代码）和能量胶（数据存储）到其补水策略（传输方法）无所不查。\n\n\
  作为这场 AppExchange 比赛中的坚定马拉松选手，了解安全审查流程及其比赛规则不是“锦上添花”——它是你的比赛日策略。它不仅仅是一座令人望而生畏的山丘，而是配速指南，帮助你避免那些残酷的撞墙时刻。它的工作？帮助你在训练周期早期发现潜在的安全侧刺，给你充足的时间调整步伐、补水或做任何必要的事情，以防止这些问题拖慢你的速度。这种对安全的战略性方法不仅是你安全成功比赛日（读作：应用程序）的门票，也是你在与用户建立信任的比赛中个人的最佳成绩。\n\
  \n将安全放在首位进行训练，就像勤奋地遵循一个精心规划的马拉松训练计划——它很艰难，需要奉献，但回报巨大！它让你远离那些讨厌的、耗时的伤害（读作：修订），并提高你在第一次尝试时轻松通过安全审查检查点的几率。此外，它向你的用户表明，他们的安全对你来说不是最后一刻的碳水化合物加载尝试，而是你训练计划中深思熟虑的一部分。谁知道呢，这可能是促使他们在比赛日为你的应用程序加油的秘密调味料！\n\
  \n## Fees and timeline\n\n安全审查流程涉及以下几个关键步骤：\n\n- 1. 你通过 Partner Community 提交应用程序进行安全审查。\n\
  - 2. 安全审查运营团队验证你的提交，该过程通常需要 1-2 天。\n- 3. 你的提交随后被添加到产品安全队列中。\n- 4. 产品安全团队对你的应用程序进行测试并验证结果。\n\
  - 5. 最后，安全审查运营团队通知你结果。\n\n*步骤* 3-5 的时间线通常跨度为 4-6 周。然而，值得注意的是，大多数 ISV 在第一次尝试时无法通过安全审查。虽然一些应用程序可能在第一次或第二次尝试时获得批准，但其他应用程序可能需要第三次尝试甚至更多。因此，你可以乐观地预计你的应用程序在初始提交后至少\
  \ 4 周内上线 AppExchange 市场。然而，\n\n整个流程也可能延长至 3 个月或更久。哦，顺便提醒一下！如果您计划在高峰期发布应用，例如在 *Dreamforce*（你知道的——那场大规模的年度\
  \ Salesforce 大会）前后，可能会有一些额外的提交截止日期需要您留意，以便及时获得结果。\n\n![](img/44ed632038957e4c80220676e84c5109_292_0.png)\n\
  \n图 6.1：安全审查时间线\n\n就费用而言，对于 Freemium、付费或需要付费附加组件的解决方案，安全审查费用为每次 999 美元，具体适用于以下情况：初始安全审查、解决前次安全审查发现的问题后的重新提交、对之前已批准解决方案的定期复审，以及合作伙伴请求对其解决方案新版本进行审计时。您可以在一次提交中提交最多四个具有相同命名空间的软件包，每次尝试只需支付一次\
  \ 999 美元。\n\n鉴于提交通常需要两次尝试才能通过，使您的应用程序通过安全审查流程的平均总成本为 1,998 美元。\n\n然而，需要注意的是，免费解决方案的安全审查费用将被免除。这意味着无论是初始安全审查、解决前次安全审查中发现的问题后的重新提交、列出之前已获批准的解决方案的新版本，还是对之前已获批准的解决方案进行定期复审，均不收取费用。\n\
  \n费用可能会发生变化，且所列数据截至 2023 年有效。您可以在 https://developer.salesforce.com/docs/atlas.en-us.packagingGuide.meta/packagingGuide/security_review_fees.htm\
  \ 查看最新费用。\n\n## 测试您的应用程序\n\n在提交 Salesforce 安全审查之前，确保您的应用程序安全至关重要。此流程不仅涉及对应用程序架构和组件的审查，还涉及其潜在漏洞。在以下小节中，您将了解一些指导您测试应用程序的关键实践。\n\
  \n### 预评估\n\n在提交应用程序进行安全审查之前，请对解决方案进行内部评估，以确认其架构安全。评估所有方面，例如对象权限、包含的组件、自定义代码、使用的\
  \ Web 服务和第三方服务。目标是保护所有可能被利用以访问数据的入口点和漏洞。\n\n您的应用程序应具有健壮性，遵循 Salesforce 最佳实践，例如在触发器中处理记录时对\
  \ Apex 代码进行批量处理，并在 **Salesforce 对象查询语言 (SOQL)**、Apex 或跨脚本中避免代码注入。\n\n### 对抗性测试\n\
  \n在解决所有已知安全问题后，尝试寻找更多问题！鼓励您的测试团队像黑客一样思考，攻击您的产品以尝试窃取其数据。这种对抗性测试方法在与团队安全倡导者协调下进行，可能揭示被忽视的漏洞。*OWASP\
  \ Web 安全测试指南* 是帮助您制定对抗性测试计划的优秀资源。您可以在 **开放世界应用安全项目 (OWASP)** 网页上找到它：https://owasp.org/www-project-web-security-testing-guide/。\n\
  \n通过遵循这些策略，您可以满怀信心地提交应用程序进行安全审查，确信您已尽一切可能确保应用程序安全。您对潜在漏洞的细致关注不仅能确保更顺畅的安全审查流程，还将为用户带来更安全、更可靠的产品。\n\
  \n## AppExchange 安全审查流程所需的组件\n\n在 AppExchange 上运行成功的安全审查流程就像为一场大城市马拉松做准备——它需要合适的装备、对赛道的透彻理解，当然还有坚持到底的韧性。本章是您的私人健身教练，规划这场马拉松必备的组件，同时解释为什么您需要系紧鞋带、穿透气面料、携带能量棒。或者用\
  \ AppExchange 的术语来说，为什么您需要可靠的测试环境、组织良好的文档、有效的静态代码分析结果以及清晰的误报文档。\n\n### 使用已安装和配置的管理软件包准备测试环境\n\
  \n您的测试环境就像这场马拉松中的跑鞋。正如经验丰富的跑者需要提供支撑并防止受伤的合适鞋子一样，一个良好的测试环境为您的应用程序奠定了坚实的基础，有助于识别任何错误或漏洞。\n\
  \n![](img/44ed632038957e4c80220676e84c5109_295_0.png)\n\n一个准备充分的测试环境对于安全审查流程至关重要。请使用\
  \ *第 2 章* 中描述的 Environment Hub 创建测试环境，然后安装您的管理软件包并进行配置。此环境应为完全配置并经过身份验证的演示组织，包含示例数据以帮助审查员了解您的应用如何工作。拥有适当的测试环境可确保审查员能够有效评估您应用的安全性和功能。\n\
  \nSalesforce 的 Environment Hub 为创建和配置新的 Salesforce 组织提供了一种简化解决方案，您可以将其用作安全审查测试环境。\n\
  \n您可以使用 Salesforce Trialforce 模板 ID 0TT3t000002nvUr¹ 创建预配置的安全审查测试组织。设置完成后，在测试组织中安装并配置软件包的最新版本。\n\
  \n1 https://salesforce.quip.com/pfqeA8kRTraY\n\n另外，您也可以利用 Environment Hub 创建一个空组织并手动配置它。为了实现无缝访问和操作，至关重要的是将\
  \ Salesforce 的 IP 范围列入安全列表。虽然您可以在配置文件级别设置这些登录范围，但如果在网络级别设置，可能会限制您允许设置的 IP 范围大小。为了确保您组织的\
  \ 安全性和可访问性，请将官方文档² 中提供的 Salesforce IP 范围列入安全列表。此外，为了让 Salesforce 员工能够无缝登录您的组织，请包含以下特定\
  \ IP 和范围：\n\n2 https://salesforce.quip.com/XaCHAb5Yo15Y\n\n- 13.108.0.0 - 13.111.255.255\n\
  - 62.17.146.0 - 62.17.146.255\n- 85.222.134.0 - 85.222.134.255\n- 104.161.246.0\
  \ - 104.161.246.255\n- 122.15.249.154, 59.144.126.115\n- 182.71.125.154 - 182.71.125.155\n\
  - 182.72.29.238 and 136.232.119.246\n\n如果启用了 **双因素身份验证 (2FA)**，您还应在审查流程中将其禁用。\n\n\
  请记住——您安装的软件包必须与您提交进行安全审查的版本相匹配，并且不应处于 Beta 状态。如果使用您的应用需要额外的组织设置，请确保也进行该设置。\n\n如果您的测试组织未正确配置，安全审查运营团队将通过电子邮件通知您并说明下一步操作：\n\
  \nDear Partner,\n\n感谢您最近提交的 Formula Debugger 安全审查。在我们开始审查之前，您的提交中存在一些必须解决的问题：\n\n\
  ### 关于您的提交：\n\n- **您的组织已启用身份验证挑战。**\n  - 您需要将 Salesforce IP 范围列入安全列表。您可以在配置文件级别设置登录范围（也可以在网络级别设置，但它会限制您可设置的\
  \ IP 范围大小。\n  - 请将以下 Salesforce IP 范围（https://help.salesforce.com/articleView?id=000321501&language=en_US&type=1&mode=1）以及以下内容列入安全列表：\n\
