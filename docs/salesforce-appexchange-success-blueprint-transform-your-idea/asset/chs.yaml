  安全审查运营\n\n\n\n图 6.11： 一封宣布安全审查成功完成的电子邮件截图，传达积极的结果并确保符合所需的安全标准\n\n## 定期安全复审\n\n在\
  \ Salesforce AppExchange 的世界里，生活并非全是风平浪静。偶尔，你会被邀请进行安全复审。把它想成是对你的应用程序进行例行检查，以确保其保持健康和安全。\n\
  \n当你升级一个已经通过安全审查的管理型包时，你很幸运。无需进行另一次全面审查。只需将新版本链接到你的 AppExchange 列表即可。\n\nSalesforce\
  \ 密切关注 AppExchange 格局。它评估潜在风险以及解决方案上架以来的时间，以确定是否需要复审。不过无需恐慌。这只是确保持续安全的标准程序。\n\n\
  为了确定哪些已列出的解决方案需要复审，Salesforce 会评估潜在风险并考虑解决方案上架以来的时间长短。会生成风险因素报告以评估潜在威胁。如果你的解决方案发生重大变化，更可能接受复审。然而，如果风险因素较低，你的解决方案可能不会被标记为需要复审。根据我的经验，大多数应用程序在初始安全审查后的前\
  \ 2 年内不会被标记为需要复审，但官方来说，这可能发生在 6 个月到 2 年之间的任何时间。\n\n你的解决方案需要复审吗？只需在 Salesforce Partner\
  \ Console 中查看 **Listing Readiness** 区域。如果显示 **Security Review Required**，那么是时候重新审视了。如果显示\
  \ **Ready to List**，复审不是强制性的，但如果你愿意，可以随时请求一次。\n\n如果你的解决方案未达到 Salesforce 的安全标准，Salesforce\
  \ 会联系你。通常会给你 60 天时间解决这些问题。在极端情况下，你的 AppExchange 列表可能会被暂时移除。修复安全问题，通过后续审查，你很快就会重返公众舞台。\n\
  \n要提交定期安全复审，只需在 Salesforce Partner Console 中按照之前的相同步骤操作即可。\n\n## 总结\n\n![](img/44ed632038957e4c80220676e84c5109_345_0.png)\n\
