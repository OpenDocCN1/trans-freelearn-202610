- '## 利用分析和洞察


  ![](img/44ed632038957e4c80220676e84c5109_484_0.png)


  围拢过来，我的 fellow 开拓者们！我们正深入 AppExchange 废墟，发掘隐藏在数字海洋中的古老智慧。


  将数据视为您的考古工具包：重点不在于刷子的大小（虽然数据越大，刷子越大！），而在于如何扫去晦涩的沙粒，揭示下面的金色象形文字。这些象形文字不是随意的鸡爪划痕；它们是您产品成功的脉搏。有一点神秘，我同意，但没有什么是一个
  *Indiana Jones* 式的数字专家无法处理的。


  现在，我们的挖掘现场分为几个区域：


  - **Partner Intelligence 的纸莎草卷轴：** 就像一件古老的羊皮纸一样，Partner Intelligence 层层展开智慧——从揭开用户模式到揭示隐藏趋势，并在
  AppExchange 沙尘地平线上发现迫近的竞争对手。

  - **Marketplace Analytics：** 一套优化您的 AppExchange 列表的工具。

  - **App Analytics：** 您将导航 AppExchange 应用分析的领域，以理解功能使用情况、改善 UX 并评估新功能接受度，从而使销售、客户成功和软件开发等领域受益，进而让您自信地掌控应用的成功。

  - **CRM Analytics 的绿洲：** 在这里，我们将内部数据与 Salesforce 的洞察绿洲相结合。期待一次令人耳目一新的知识爆发！

  - **数据驱动决策的商队：** 在洞察地图的指引下，我们将驾驶商队穿越竞争的沙漠，一路前往 AppExchange 成功的应许之地。


  在我们的考古学会中有一句话——我们不仅仅是发现者，我们还是历史学家，一粒数据一粒数据地书写着 AppExchange 的故事。地形可能看起来炎热多沙，但只要撒上一点幽默，再带上一桶数据，就没有我们不能探索的金字塔。


  那么，让我们掸去刷子上的灰尘，装满水袋，为这次远征做好准备。 fellow 数据考古学家们，我们即将深入数据驱动决策的沙海。让挖掘开始吧！


  ## AppExchange 合作伙伴情报


  ![](img/44ed632038957e4c80220676e84c5109_487_0.png)


  将导航 AppExchange 生态系统想象成在古埃及的沙尘景观中跋涉，只是没有鞋子里沙子的不便。你不会想在没有地图的情况下在沙漠中漫无目的地游荡吧？同样，在不利用数据的情况下穿越
  AppExchange 景观，就像蒙着眼睛驾驶骆驼——对旁观者来说很有趣，但对骆驼及其骑手来说并不那么有效。




  AppExchange Partner Intelligence 概念在此发挥核心作用。

  超越传统的 **商业智能 (BI)**，Partner Intelligence 精准聚焦 AppExchange 合作伙伴的特定数据需求，提供以下内容：


  - 您 AppExchange 列表的详细性能指标

  - 对潜在客户和客户行为的洞察

  - 对托管包及其内容的消费情况的全面了解


  您可以使用多种工具来利用 Partner Intelligence 的优势：Marketplace Analytics、AppExchange App Analytics
  和 CRM Analytics。每种工具都有其特定的功能和用例，让我们更详细地了解一下：


  - **Marketplace Analytics**：此工具可让您了解潜在客户和线索如何与您的 AppExchange 列表互动。要访问它，只需登录 Salesforce
  Partner Community，导航至 **发布** 选项卡，然后点击 **分析**。所有在合作伙伴社区中拥有已列出解决方案并具备 **管理列表** 权限的
  AppExchange 合作伙伴均可使用此工具。

  - **AppExchange App Analytics**：此工具可深入了解客户如何使用您的托管包及其内容。此工具适用于通过安全审查并注册到 **许可证管理应用
  (LMA)** 的包。

  - **CRM Analytics**：这是将贵公司内部数据与解决方案的 App Analytics 数据在您的 Salesforce org 中整合的首选工具。CRM
  Analytics 许可证可以直接在您的 **合作伙伴业务组织 (PBO)** 中启用。


  虽然您可以使用任何报表工具进行数据可视化，但使用 CRM Analytics 将提供增强且集成的体验。


  借助 Partner Intelligence 及其工具组合，您可以赋能业务做出明智的数据驱动决策，推动您的 AppExchange 产品取得更大成功。还记得考古学家如何细致地刷去数个世纪的尘土以发掘罗塞塔石碑吗？好吧，这正是我们在本章中要做的事情。我们将细致地清理这些工具的细节并揭示它们所提供的诸多益处。


  那么，系好安全带，抓紧你的礼帽吧，因为我们即将踏上 AppExchange 生态系统中的激动人心的数据驱动决策之旅。希望我们途中不会遇到任何木乃伊！


  ## AppExchange Marketplace Analytics


  ![](img/44ed632038957e4c80220676e84c5109_490_0.png)


  在 AppExchange 合作伙伴的旅程中，您会经常发现自己的角色并不局限于名片上的描述。对于领导成熟初创公司的您，可能有一名 ISV 数字营销专家或 ISV
  数字营销总监在引领您的 AppExchange 之旅。如果您刚刚启航 AppExchange 之旅，您可能会发现自己的创始人帽子经常被换成“Marketing
  Specialist”帽子。这有点像角色扮演，只是赌注更高，而服装是比喻性的。


  无论您 LinkedIn 资料上的头衔是什么，在本节中，让我们假设您就是我们的营销专家，我们无畏的英雄，踏上优化 AppExchange 列表的征程。无需畏惧，勇敢的冒险者——Salesforce
  为您准备了合适的装备。认识一下您的新搭档——AppExchange Marketplace Analytics。


  ### Mastering marketing impact


  将您的 AppExchange 列表想象成您正在举办的派对。作为我们的营销专家，您的职责是确保您的客人（潜在转化）找到派对（您的列表）并在那里玩得开心（转化！）。AppExchange
  Marketplace Analytics 是您的派对策划助手，为您提供举办镇上最佳派对所需的洞察。


  您是否树立了正确的路标来引导客人参加您的派对？您的派对主题是否足够吸引人以吸引合适的群体？Marketplace Analytics 为您提供优化列表性能并使其成为众人谈论焦点所需的数据。


  ### Understanding your guests


  想象一下，如果您能了解客人最喜欢您派对的哪些部分以及跳过了哪些部分。那正是 Marketplace Analytics 所做的。它帮助您了解列表中哪些方面是派对的亮点，哪些方面可能需要稍作润色。


  ### Making data-driven decisions


  您的工作是确保派对持续进行并不断改进。您可以使用 Marketplace Analytics 提供的可操作数据，根据渠道、活动和关键词搜索数据改进您的列表。


  ### Key features


  AppExchange Marketplace Analytics 允许 Salesforce 合作伙伴深入了解客户与其列表互动的各个方面。包括以下内容：


  - 客户在 AppExchange 首页和搜索结果页面查看您的列表磁贴的频率

  - 流量来源（如 Google Ads）对您列表客户活动的贡献

  - 引导客户访问您列表的热门 AppExchange 搜索词

  - 客户参与的列表资源，例如截图和白皮书

  - 您的 **AppExchange 营销计划 (AMP)** 推广活动表现，我们将在 [第12章](Chapter 12) 中详细讨论


  这些洞察可以帮助塑造您的 AppExchange 业务战略并识别增加线索、安装和购买的机会。在此背景下，我们将检查以下截图，其中展示了 Formula Debugger
  Marketplace Analytics 的快照：


