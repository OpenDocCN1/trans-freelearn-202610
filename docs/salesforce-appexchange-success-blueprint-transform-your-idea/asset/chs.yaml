  \n## 使用试用 PBO 提交安全审查申请\n\n对于有意提交 **second-generation package** **(2GP)** 进行安全审查且仍在试用\
  \ PBO 上运行的 Salesforce 合作伙伴，需要遵循某些指南和做法。这是为了确保顺利的安全审查流程并防止潜在的延迟或运营问题。\n\n在 *Chapter\
  \ 2* 中描述的 **Partner Application Development Agreement** **(PADA)** 和 **Salesforce\
  \ Partner Program Agreement (SPPA)** 的背景下，需要注意的是，完成 PADA 是将 PBO 从试用模式激活的关键要求。然而，新的安全审查程序允许在未先完成\
  \ PADA 的情况下提交应用程序。\n\n为避免使用试用 Dev Hub 组织进行安全审查时可能出现的问题，安全审查团队实施了默认政策，阻止在试用 Dev Hub\
  \ 组织上构建的 2GP 进入安全审查。该政策旨在防止因试用 Dev Hub 组织过期和清除导致 2GP 成为孤立而可能发生的并发症。\n\n对于面临此限制的合作伙伴，可以选择与\
  \ Salesforce 专家预约补救会议以审查其提交的内容。在这些会议中，会解释使用非活跃 Dev Hub 组织相关的风险，并提供明确的指导以纠正发现的任何问题。如果在补救会议中确认合作伙伴计划在执行\
  \ PADA 后激活其 PBO，则可能授予“禁止试用 Dev Hub 组织”政策的例外。这使合作伙伴能够在与 Salesforce ISV 销售团队同时完成合同的同时推进安全审查流程。\n\
  \n为了优化安全审查流程，没有 PADA 的合作伙伴可在提交安全审查前主动安排补救会议。\n\n## 未通过安全审查\n\n![](img/44ed632038957e4c80220676e84c5109_311_0.png)\n\
  \n好吧，亲爱的读者，深呼吸，让我们来一次推心置腹的聊天。想象一下你正走在 AppExchange 明星的红毯上，然后……你绊倒了。用更专业的说法，你的应用程序未通过安全审查。但在你将其视为小报丑闻之前，我希望你跟我一起重复：“这不是世界末日。”\n\
  \n当然——重新提交你的应用程序意味着你必须支付费用（准确来说是 999 美元），并且你需要再等待几周，但把它想成是为了更宏大的亮相而推迟你的出场。关键是，这段通往\
  \ AppExchange 成名的旅程中的这个小挫折可能会影响你的 **go-to-market (GTM)** 时间表，但远非致命打击。\n\n现在，关于“失败”。这个词听起来相当戏剧化，不是吗？让人联想到末日和阴郁。但等等——让我们把这种心态抛诸脑后。不要把它想成失败，而更像是……学习。Salesforce，AppExchange\
  \ 的仁慈教父，真正希望你蓬勃发展。然而，它也必须考虑到其客户的利益，而他们正是你精彩应用的潜在观众。\n\n那么，如果在你最终通过之前需要对你的包进行几次迭代怎么办？不要把\
  \ Salesforce 想成才艺秀上严厉的评委，对你的表现做出裁决。它更像是一位友好的导师，给你建设性的批评，希望你改进并闪耀。如果你挣扎，他们准备在办公时间与你坐下来给你需要的帮助。\n\
  \n安全审查流程？好吧，让我们称之为它真正的名字：安全加固冲刺。你从 Salesforce 获得的反馈基本上就是你的私人教练，帮助你把你的应用雕塑成完美的形状。所以，拍拍灰尘，准备再来一轮——每一个障碍都是迈向更安全应用的一步。\n\
  \n为什么安全审查不能在第一轮就发现所有漏洞？好吧，每次审查就像电视剧的一集——有时间限制且结构化。优势？它能让你保持成本可控并减少审查队列时间。但就像任何优秀的系列一样，也可能有一些悬念。并非所有问题都能在一集内被发现或完全解决。\n\
  \n为什么你的应用可能通过了初始扫描却未能通过更深入的审查？把初始扫描想成一般的健康检查，而更深入的审查更像是全面的医学检查。后者需要更详细的评估和人工专业知识，能发现更细微的问题。\n\
  \n如果你已修复了所有发现但仍未通过安全审查怎么办？想象你烤了一个蛋糕，食谱要求你去除面糊中的结块。你找到了并移除了一些，但并非全部。安全审查报告指出了结块（安全问题），但可能不会突出显示每一个。毕竟，制作光滑的面糊（安全代码）是你食谱（开发流程）的一部分。\n\
  \n记住——这段旅程不是关于勾选框。安全不是你待办清单上的一项任务。它是一种心态，一种哲学——如果愿意的话，一种生活方式。所以，准备好全心全意地拥抱它，不久之后，你就会迎来你的盛大亮相。\n\
  \n以下屏幕截图中显示的电子邮件包含一份报告，其中描述了在未通过的安全审查中发现的漏洞：\n\n## Formula Debugger：安全审查 - 您的应用未通过\n\
