  \ Salesforce 在全面安全审查期间发现的漏洞\n\n## 应对挑战并推进开发\n首次安全审查失败并不 uncommon 且不应被视为灾难。相反，开发人员应将其视为学习经验，认真对待安全审查团队的反馈，以对应用程序进行必要的改进。快速分拣已识别问题、在团队成员之间明确分配任务，以及在审查失败后迅速修复问题，都是至关重要的步骤。与管理层保持沟通渠道畅通很重要，以确保每个人都了解纠正问题所需的计划和行动。为了避免潜在的失误并保持顺利流程，我建议在安全审查获得绿灯之前，将任何新代码与主分支分开。这种分离确保通过打包组织时通道清晰有序，并促进安全问题的有效有序解决。\n\
  \n## 合作伙伴办公时间\n合作伙伴办公时间是 Salesforce 免费提供给 AppExchange 合作伙伴的有用机会，帮助他们理解和 navigating\
  \ 安全审查流程。提供两种格式，运营和技术，这些会议提供直接访问 Salesforce 安全审查团队成员的途径，提供从提交后勤到解决特定技术问题的指导。让我们仔细看看：\n\
  \n- **运营办公时间：** 这些会议专门用于回答有关安全审查后勤和要求的问题。如果您不确定解决方案的哪些组件属于审查范围、需要您提供哪些报告和扫描结果，或如果您的解决方案未通过审查会发生什么情况，则这些会议尤其有帮助。\n\
  - **技术办公时间：** 这些会议旨在提供具体的与安全相关的技术帮助。当您需要帮助 navigating AppExchange 安全要求、在解决方案中实施安全设计元素、理解和处理自动安全扫描工具检测到的问题、解释安全审查报告中的发现、区分真正问题和误报，以及弄清如何在安全审查报告中解决被标记的问题时，它们非常宝贵。\n\
  \n鉴于其受欢迎程度，建议尽早安排您的办公时间。您可以通过 Partner Security Portal 预订这些会议。在 intake 表单中提供有关您的问题或疑虑的详细信息将使会议更具成效和针对性。\n\
  \n## 安全要求\n\n![](img/44ed632038957e4c80220676e84c5109_319_0.png)\n\n当您作为 AppExchange\
  \ 合作伙伴计划的一部分踏上令人兴奋的旅程时，您必须遵循一个基本路线图——安全要求。这些义务不仅适用于所有 AppExchange 合作伙伴及其应用程序，而且还针对与某些技术或行业特定用途密切相关的应用程序量身定制。\n\
  \n每次您创建或修改 AppExchange 列表时，就相当于签署了一份虚拟契约，表明您已遵守这些要求。尽管本文档力求全面，但它并不能涵盖每一种可能的安全场景。因此，合作伙伴始终被敦促遵守适用于他们的行业安全规范。\n\
  \n在您的解决方案进入 AppExchange 市场之前，有一份待勾选的清单。它包括以下项目：\n\n- 1. **指定安全专家：** 安全不是事后考虑，而是开发生命周期的一个组成部分。在团队中拥有专职安全专家不仅能确保遵守安全指南，还能防止在编码期间发生不必要的安全漏洞。\n\
  - 2. **实施安全策略：** 创建一个健全的安全策略，阐明贵公司如何保护客户数据。同时告知客户他们在保护解决方案方面的作用。\n- 3. **盘点第三方库：**\
  \ 维护所有第三方库及其版本清单，这些库对于您的解决方案正常运行是必要的。\n- 4. **创建架构图：** 提供描绘数据接触点、信息流、身份验证、授权和其他安全控制的图表。\n\
  - 5. **列出认证**：分享所有相关认证，例如 HIPAA、**支付卡行业数据安全标准 (PCI DSS)**、**系统和组织控制 2 (SOC 2)**，以及\
  \ **国际标准化组织 (ISO)** 27001。\n- 6. **记录安全保证活动**：记录活动，包括软件开发生命周期方法、漏洞管理、补救 **服务等级协议\
  \ (SLAs)**、供应商和依赖项安全计划、安全意识培训以及安全漏洞响应程序。\n- 7. **列出敏感数据**：提供您的解决方案处理或存储的敏感数据的全面清单。\n\
  - 8. **披露数据存储位置和提供商**：如果您处理受监管数据，请披露数据存储位置，提及国家和提供商，例如 **亚马逊网络服务 (AWS)**、Azure 和\
  \ **Google 云平台 (GCP)**。\n- 9. **识别第三方数据共享**：列出您与之共享客户数据的所有第三方供应商。\n- 10. **共享联系信息**：发布无缝客户支持和事件报告的联系信息。\n\
  \n当您履行这些要求时，请记住它们是您 AppExchange 之旅的信任建立工具。\n\n## 开发安全应用程序\n构建安全应用程序是每个开发人员的关键责任。本节提供了安全应用程序开发实践的高层次概述，借鉴了\
  \ Salesforce 的 *安全编码指南* 和 OWASP 提供的资源。然而，这些准则仅触及应用程序安全的表面。有关深入信息和详细指导，开发人员应深入研究\
  \ OWASP 和 Salesforce 全面的 *安全编码指南* 提供的资源。\n\n## 安全控制概述\nSalesforce 提供了强大的内置安全控制，例如对象级（**创建、读取、更新、删除—CRUD**）、**字段级安全\
  \ (FLS)** 和共享规则。开发人员应熟悉这些控制并利用它们在不同层级上强制执行访问限制并保护数据。\n\n## 使用 HTTPS 进行安全通信\n从您的\
  \ Salesforce 应用程序到外部端点的所有连接都应使用 HTTPS。这可确保在您的应用程序与端点之间交换的所有数据都已加密，提供防止数据拦截和篡改的基本安全级别。\n\
  \n## 实现安全的 JavaScript 和 CSS\n安全地使用 JavaScript 和 CSS 至关重要，以防止常见的 Web 漏洞。建议使用现代框架，例如\
  \ Salesforce 的 Lightning 用于 JavaScript，并在 CSS 中避免内联样式以符合 Salesforce 的 **内容安全策略 (CSP)**。\n\
  \n## 了解 CSP\n\n\n\nSalesforce 在 Lightning Framework 中采用 CSP 来缓解 **跨站脚本攻击 (XSS)**\
  \ 和其他代码注入攻击。开发人员应了解 CSP 并遵守其安全应用程序开发的指南。\n\n## 避免常见的 Web 漏洞\n\n开发人员需要警惕常见的 Web 漏洞，例如\
  \ XSS、**跨站请求伪造 (CSRF)** 和不安全的会话 Cookie 处理。对这些漏洞及其预防技术的深入理解对于开发安全应用程序至关重要。\n\n##\
  \ 采用安全编码实践\n\nSalesforce 建议采用安全编码实践，例如在 Apex 中使用 **WITH** **USER_MODE** 并避免在 **FOR**\
  \ 循环中使用 SOQL 查询。\n\n将这些实践纳入开发流程可以帮助防止安全漏洞。\n\n## 处理敏感数据\n\n处理敏感数据时应格外谨慎。切勿以明文存储敏感信息；不要将其输出到调试日志、写入平台缓存或存储在\
  \ Cookie 中。始终使用 Salesforce 提供的安全存储机制\n\n## XSS\n\nXSS 是一种广泛存在的漏洞，其中攻击者向网页注入未经授权的\
  \ JavaScript、VBScript、HTML 或其他活动内容，从而影响查看该页面的其他用户。这些未经授权的脚本可以劫持用户会话、提交未经授权的交易、窃取机密信息或破坏网页。开发人员可以通过验证输入数据、编码输出数据以及利用安全库和框架来抵御\
  \ XSS 攻击。\n\n## SOQL/SOSL 注入\n\n**Salesforce 对象查询语言 (SOQL)**/**Salesforce 对象搜索语言\
  \ (SOSL)** 注入是一种攻击形式，其中恶意的 SOQL 或 SOSL 语句被插入到输入字段中然后由数据库执行。这可能会暴露敏感数据或修改数据库内容。\n\
  \nSOQL/SOSL 注入攻击通常由于输入数据验证不足以及开发人员使用动态 SOQL/SOSL 语句而成功。为了缓解这种情况，开发人员应使用参数化查询或存储过程而不是动态\
  \ SOQL/SOSL 语句。\n\n## 跨站请求伪造 (CSRF)\n\nCSRF 是一种攻击类型，其中攻击者欺骗用户在未经其同意的情况下在网站上执行操作。这使得攻击者能够执行诸如更改密码或进行未经授权的购买等操作。\n\
  \nCSRF 攻击之所以经常成功，是因为开发人员没有充分验证请求或使用反 CSRF 令牌。为了抵御 CSRF 攻击，开发人员应实施反 CSRF 令牌并确保在处理请求之前验证所有请求。\n\
  \n## 任意重定向\n\n任意重定向是一种漏洞，攻击者可借此在用户不知情或未同意的情况下将用户重定向到恶意网站。这可能导致敏感信息被窃取，例如登录凭据，或在用户计算机上安装恶意软件。任意重定向攻击通常由于输入数据验证不足或开发人员未使用\
  \ URL 白名单而成功。为了避免任意重定向攻击，开发人员应使用 URL 白名单并验证所有输入数据。\n\n## 不安全通信\n\n不安全通信是一种漏洞，其中敏感信息通过未加密的通道传输。这为攻击者拦截和读取数据打开了窗口，导致诸如登录凭据或信用卡号码等敏感信息被窃取。此类攻击之所以经常成功，是因为开发人员要么不使用加密，要么采用了弱加密算法。为了防止不安全通信攻击，开发人员应采用诸如\
  \ **安全套接层/传输层安全 (SSL/TLS)** 之类的强加密算法，并确保所有敏感数据通过安全通道传输。\n\n## 避免常见陷阱\n\n在整个开发过程中，可能会出现某些陷阱。了解这些问题可以帮助防止它们发生并增强应用程序的安全性。在以下小节中，我们将探讨在开发过程中可能出现的潜在陷阱的应对方法。通过了解这些问题，您可以有效防止它们并提高应用程序的整体安全性。\n\
  \n### 在生产环境中使用示例代码\n\n互联网上可用的示例代码可以是极好的学习工具，但绝不应直接包含在生产包中。重用此类代码可能会在整个包中传播漏洞，即使是示例代码作者无意为之。因此，请始终为生产环境编写自己的代码。\n\
  \n### 不安全地存储敏感数据\n\n不安全地存储敏感数据，例如 API 密钥、加密密钥、密码等，可能会使您的应用程序暴露于潜在威胁之下。\n\n在从 Salesforce\
  \ 平台导出客户数据并在平台内存储敏感数据时，请遵守企业安全标准。由您解决方案中的漏洞导致的数据泄露或丢失可能会危及您与 Salesforce 的关系。\n\n\
  ### 如果包安装访问组织的元数据则通知用户\n\n可能存在您的包需要在安装或更新期间获取或修改元数据的情况。Apex 中的 **Metadata** 命名空间配备了象征元数据类型的类。此外，它还提供类以便于直接向订阅组织检索和部署元数据组件。以下是有关\
  \ Apex 中元数据的一些关键注意事项：\n\n- 使用 Apex 代码可以创建、检索和更新元数据组件。但是，不支持删除这些组件。\n- 目前，自定义元数据类型和页面布局的记录可在\
  \ Apex 中访问。\n- 未获得 Salesforce 批准的管理包被限制访问订阅组织中的元数据。例外情况是当订阅组织激活 **Allow metadata\
  \ deploy by Apex from non-certified Apex package version** 组织设置时。此设置在管理包的测试阶段或 Beta\
  \ 版本中很有用。\n\n如果您的包在安装或更新期间与元数据交互，或如果它包含一个利用元数据的自定义设置界面，则必须通知用户。对于涉及元数据的安装，应在包描述中通知用户。该通知应透明地告知客户，您的包具有修改订阅组织元数据的能力。\n\
  \n寻求通知模板的人，Salesforce 提供了一个示例⁴：\n\n4 https://developer.salesforce.com/docs/atlas.en-us.packagingGuide.meta/packagingGuide/packaging_metadata_in_apex.htm?q=metadata\n\
  \n```\nThis package can access and change metadata outside its namespace in the\
  \ Salesforce org where it's installed.\n```\n\n### 包含未压缩的源文件\n\n在静态资源中包含与所有压缩文件对应的未压缩源文件，以便审查自定义\
  \ JavaScript。确保这些文件具有相同的名称（除 .min 外），以便扫描。此外，为所有转译为 JavaScript 的语言提供源文件，例如 JSX。\n\
  \n### 确保静态资源没有已知漏洞\n\n确保静态资源中包含的所有库都没有已知漏洞。这可以通过搜索 **通用漏洞和暴露 (CVE)** 数据库或使用 Snyk\
  \ 或 RetireJS 等安全工具来实现。\n\n### 版本控制\n\n提交应用程序进行安全审查时，请提交点发布（例如，8.5 → 9.0 等），而不是补丁发布。安全审查系统设计用于处理主要和次要版本；不支持补丁发布。\n\
  \n### 在调试语句和 URL 中泄露敏感信息\n\n避免在调试语句和 URL 中泄露敏感信息。敏感信息，例如 **个人身份信息 (PII)**、密码、密钥和堆栈跟踪，可能会暴露潜在的攻击向量。URL\
  \ 可能无意中在服务器日志、浏览器历史记录或搜索引擎索引中存储敏感信息。\n\n### TLS/SSL 配置\n\n确保您的服务器支持并配置为使用安全加密选项。不应支持\
  \ SSLv2/SSLv3/TLSv1.0 等弱密码。在撰写本文时，低于 TLSv1.2 的版本应被禁用。\n\n### 注释代码\n\n虽然在注释中允许少量片段和示例，但应删除被注释掉的完整函数和类。\n\
  \n### 密码回显\n\n避免在应用程序的源代码中存储敏感信息。任何有权访问的人都可以轻松以明文访问此信息\n\n源代码。\n\n通过意识到这些陷阱并采取必要的措施来避免它们，您可以显著提高\
  \ Salesforce 应用程序的安全性和完整性。\n\n## 扫描外部系统和端点\n\n如果你以为 Salesforce 解决方案构建的马拉松只是关于 Salesforce\
  \ 赛道，那就准备好拥抱那些绕路吧。想象一下——你的应用程序在比赛中途，转向外部应用程序或与第三方服务集成。令人兴奋？绝对是的。具有挑战性？绝对如此。这就是外部应用程序扫描发挥作用的地方。它就像你信赖的地图，确保你的应用程序即使偏离主路线也能保持在安全的路径上。\n\
  \n因此，你已经集成了外部应用程序或使用了第三方服务。所有涉及的端点都需要像顶级跑鞋一样安全。并且每个连接都必须经过身份验证，就像在比赛日核实马拉松号码布一样。存储\
  \ Salesforce 凭据，例如刷新令牌和访问令牌？它们必须像你最珍贵的马拉松奖牌一样安全地存放在加密数据库中。\n\n更进一步说，假设你的应用程序与一个网站联动，也许在比赛途中重定向到另一个网站。正如你必须了解马拉松路线上的每一个转弯、弯道和坡度一样，你需要扫描网站上的所有页面。发现坑洼或急转弯？修复它就是你的责任。毕竟，没有人喜欢在比赛日遇到意外的惊喜！\n\
  \n这些外部应用程序扫描类似于为大赛做准备的那些艰苦的爬坡训练——它们很艰难，但它们在增强应用程序的耐力和持久力方面大有帮助，从而带来更安全的用户体验。正如马拉松一样，训练越艰苦，你变得越强壮，比赛日表现就越好。所以，让我们做好准备，拥抱这些绕路——它们不仅仅是旅程的一部分；它们正是让比赛变得值得的原因。\n\
  \n## 扫描外部系统和端点的工具\n\nSalesforce 鼓励你使用特定的工具来扫描你的应用程序。Chimera 扫描器是 Partner Security\
  \ Portal⁵ 上直接提供的工具之一。其他工具是你可能需要在某些场景下使用的独立工具。以下是快速概述。\n\n5 https://security.my.salesforce-sites.com/sourcescanner/\n\
  \n### Chimera\n\nChimera 检查你解决方案的外部端点中的安全漏洞。它从 Salesforce IP 地址扫描解决方案，并且不需要下载。如果你使用的是你不拥有的域上的端点，你需要使用\
  \ OWASP ZAP 或 Burp Suite，因为 Chimera 要求将令牌上传到外部服务器的根目录。\n\n![](img/44ed632038957e4c80220676e84c5109_331_0.png)\n\
  \n### CHIMERA 汇总报告\n\nhttps://appexchange.successblueprint.sh/\n\n下文报告概述了通过自动扫描发现的漏洞和信息性发现。可能存在在自动扫描期间未发现的其他漏洞，因此未包含在此报告中。你应始终用手动安全测试补充自动扫描。也有可能这些发现中的一些或全部是误报。因此，所有报告的项目都应手动验证。\n\
  \n每个项目的攻击向量和漏洞证据都列出了漏洞的描述。还提供了每类漏洞的建议修复步骤和额外的教育资源。\n\n请注意，这不是你应用程序中漏洞的全面列表。此报告之外可能存在类似的和额外的漏洞。请检查你的整个代码库以查找额外的安全问题。\n\
  \n### 目录\n\n- 1. 未完整设置或未设置 Cache-control 头\n  - 1. https://appexchange.successblueprint.sh/dashboard.html\n\
  \  - 2. https://appexchange.successblueprint.sh/robots.txt\n- 2. CSP：通配符指令\n  -\
  \ 1. https://appexchange.successblueprint.sh/dashboard.html\n  - 2. https://appexchange.successblueprint.sh/assets/vendor-4f0d2d94506a73a18dec5d6f7d38151d.js\n\
  \  - 3. https://appexchange.successblueprint.sh/assets/vendor-4f0d2d94506a73a18dec5d6f7d38151d.js\n\
  \n图 6.8：由 Chimera 扫描器生成的示例安全报告，突出显示系统或应用程序中已识别的漏洞和潜在安全风险\n\n### OWASP ZAP\n\nZAP\
  \ 是一个免费的、由社区驱动的 Web 应用安全测试代理。它用于扫描外部端点并需要下载。由于 ZAP 不需要在外部服务器的根目录上传令牌，因此可用于你不拥有的域上的端点。\n\
  \n### Burp Suite\n\nBurp Suite 是用于扫描外部端点的另一款工具。它需要下载，并且 Salesforce 不为安全审查提供 Burp\
  \ Suite 许可证。如果你需要使用它，你将需要独立购买许可证。\n\n然而，请记住，不同的工具可能会为已识别的漏洞分配不同的严重级别。任何标记为 High+\
  \ 严重级别的漏洞都应得到解决或记录，解释为何它不会作为误报文档的一部分得到修复。\n\n## 使用商业 API 的挑战\n\n在为安全审查准备托管包时，使用\
  \ Chimera、ZAP 或 Burp 等工具评估外部系统是惯例。然而，如果你不拥有外部系统而使用其中一个商业 API，此过程会带来几个挑战。首先，嵌入 Chimera\
  \ 令牌或获得扫描的明确许可通常不可行。其次，许多商业 API 提供商被认为已具备严格的安全措施。最后，要求这些提供商解决个人开发人员指出的安全问题可能不切实际，尤其是当这些\
  \ API 对于增强 Salesforce 应用的功能至关重要时。\n\n根据 Salesforce 的 *安全审查概述*⁶，即使 ISV 不直接拥有其应用集成的外部端点或服务，它们仍在安全审查的范围内。Salesforce\
  \ 采用整体方法，确保提供的每个组件都经过测试以保护客户及其数据。这包括与应用链接的任何第三方 Web 应用程序或服务。此外，ISV 必须获得第三方的书面同意，授权\
  \ Salesforce 测试其端点。\n\n6 https://partners.salesforce.com/pdx/s/learn/article/isv-security-review-overview-MC4QVWO6S2FVFD5MNRMLIEF3UBGQ?language=en_US#media\n\
  \n对于这种方法似乎过于严格的情况，建议合作伙伴直接联系 Salesforce，也许通过一次办公时间通话。这可以促进讨论，关于可能将某些外部系统排除在审查范围之外，并在提交中提供声明。\n\
  \n## Salesforce 的受信任列表\n\nSalesforce 维护着一份非官方的公共 API 名单，这些 API 基于之前的评估被认为安全。如果应用集成了其中一个\
  \ API，则在安全审查期间无需提供 Chimera/ZAP 扫描证据。Stripe 和 Google 等 API 提供商是包含在此列表中的示例。例如，如果你的应用利用\
  \ Google API 进行地址验证，你就无需对 Google 的端点执行安全扫描。\n\n然而，此列表不公开。鼓励 ISV 与其技术解决方案团队成员、**合作伙伴客户经理**\
  \ (**PAM**)，或 **技术顾问** (**TA**)，沟通以确定特定 API 是否在此名单上。或者，启动安全审查支持案例也可以提供明确性。\n\n##\
  \ 准备误报文档\n\n在为你的应用程序进行安全扫描的过程中，你可能会遇到所谓的“误报”。这些是安全工具报告潜在漏洞的情况，但在进一步调查后，发现已识别的问题在你的应用程序的上下文中并不构成实际安全风险。\n\
  \n彻底记录这些误报至关重要。文档应为你归类为误报的每个报告的漏洞提供详细解释。你的解释应提供明确的原因，说明已识别的问题为何不代表你的应用程序的安全风险。它还应包括任何缓解因素或已实施的安全措施，这些措施可防止报告的漏洞被利用。\n\
  \n误报文档在安全审查过程中作为参考。它为 Salesforce 安全团队提供你的观点，并帮助他们理解你将某些报告的漏洞归类为误报的理由。\n\n以下是准备误报文档时应遵循的一些步骤：\n\
  \n- **识别潜在误报**：首先在安全扫描报告中识别潜在的误报。并非所有报告的漏洞在您的特定环境中都是实际的安全风险。\n- **分析和确认**：彻底分析每个潜在的误报。确认所报告的问题在应用程序的实际使用中不会构成安全风险。\n\
  - **记录您的发现**：对于每个已确认的误报，请在文档中提供详细的解释。包括有关报告问题、您的分析和为何它不是安全风险的信息。\n- **包含缓解因素**：如果存在防止利用所报告问题的缓解因素或安全措施，请将其包含在文档中。\n\
  - **审查和验证**：审查您的误报文档以确保其清晰、简洁且准确。请由安全专家或有知识的团队成员进行验证。\n\n通过提供详细且准确的误报文档，您可以帮助加快安全审查流程，并提高首次通过安全审查的机会。\n\
  \n## Chimera 发现\n\n| 风险等级 | 扫描器 | 状态 |\n|---|---|---|\n| 缓存控制头不完整或未设置 | Chimera\
  \ | 误报 |\n| Unix 时间戳泄露 | Chimera | 误报 |\n\n## Chimera 安全警报的详细调查\n\n### 缓存控制头不完整或未设置\n\
  \n平台已在全范围内正确设置了缓存控制头。扫描期间发现的两个文件使用了 Cache-Control 头，允许它们仅缓存 1 小时（或 3600 秒）。如果 'robots.txt'\
  \ 缓存一小时，完全没有影响。另一个文件 \"dashboard.html\" 是一个静态资源，可以在不造成损害的情况下缓存长达一小时。此外，我们规定客户端必须在\
  \ 1 小时后重新验证其资源，导致它们持续检查更新版本。\n\n### Unix 时间戳泄露\n\n因为 ChimeraReport.html 显示的是 CSS\
  \ z-index 值 99999999 的结果，而这不是 Unix 时间戳，因此这是误报。\n\n其他发现仅由数学计算组成，例如 1?NaN:e>94906265.62425156?\
  \ Math.log(e)+ Math.LN2。Salesforce Chimera 扫描器将数字 62425156 的第二位小数标记为可能泄露 Unix 时间戳。这不是\
  \ Unix 时间戳。\n\n图 6.9：随 Chimera 综合安全报告附带的误报文档示例，旨在解决和澄清任何不准确识别的漏洞或风险\n\n## 确保您没有遗漏任何内容\n\
  \n阅读本章后，您了解了为安全审查做准备所需的事项。在继续提交之前，您还可以额外验证是否已处理了每个细节。即使遗漏一个小方面也可能导致审查流程延迟。考虑使用安全审查提交要求清单构建器以确保不会遗漏任何内容。根据您应用的技术架构，此工具将生成在提交前需要准备的所有必要步骤的全面清单。\n\
  \n您可以在此处找到清单构建器：\n\n[https://checklistbuilder.herokuapp.com/](https://checklistbuilder.herokuapp.com/)\n\
  \n## 安全审查提交要求清单构建器\n\n### 告诉我们关于您的应用\n\n### 您的清单\n\n选择所有适用项\n\n- 在 Salesforce 平台上\n\
  - 受管软件包\n- Quip 应用\n- Marketing Cloud 应用\n- 外部于 Salesforce 平台\n- 网站\n- API 端点\n\
  - 移动应用\n- 浏览器扩展\n- 桌面/客户端应用\n\n编译清单\n\n## Force.com 源代码 (Checkmarx) 扫描器结果\n\n- 您可以通过合作伙伴安全门户访问扫描器\n\
  - 请为任何高于“代码质量”严重性的问题也添加相应的误报文档。\n- 如果需要修复任何问题，请解决它们并重新运行扫描以显示干净的结果。\n- 注意：如果您的软件包不包含任何可扫描代码，则无需运行此扫描。相反，在提交时，上传一份文件确认您的产品不包含任何自定义代码。\n\
  \n## 代码分析器结果：\n\n- 我们现在要求合作伙伴除了 Checkmarx 外还运行 Salesforce Code Analyzer。这是因为我们希望您使用与我们的安全审查团队使用的相同工具，他们更倾向于\
  \ Code Analyzer 而非 Checkmarx，因为它能够捕获更多问题（特别是 CRUD/FLS 违规，这是失败的最常见原因）。\n- 按照以下简单步骤运行扫描。\n\
