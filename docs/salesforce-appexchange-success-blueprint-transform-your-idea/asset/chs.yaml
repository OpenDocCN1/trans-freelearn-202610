  \ | 试用 | 免费 |\n\n图 7.2 – 来自 LMA 的“按主要版本划分的组织”报告示例\n\n*图 7.2* 清楚地显示了我们的客户在我们应用程序各个版本中的分布情况。我们的大多数客户都是最新的，使用的是最新的稳定版本（0.39）。然而，仍有一小部分用户在运行旧版本（0.5、0.13\
  \ 和 0.18）。\n\n## 应多久发布和部署一次？\n\n现在你已经了解了发布和部署之间的差异，以及推送升级的强大功能，问题就出现了：应多久发布和部署一次？\n\
  \n发布的频率在很大程度上取决于几个因素，例如你的开发团队的速度、客户对新变化的适应能力以及组织的战略目标。许多 ISV 选择每年发布三次新功能，与 Salesforce\
  \ 的发布周期保持一致。这种节奏为开发、测试以及确保与 Salesforce 平台更新的兼容性提供了充足的时间。\n\n另一方面，部署可以像你想要的那样频繁进行。它们可以作为及时交付更新、错误修复和增强功能的绝佳工具。例如，在我担任\
  \ IPfolio（一家相当大的 OEM）发布经理期间，我引入了每周一次的部署周期。这种方法确保了对所有客户进行次要错误修复和新功能相关代码的快速交付。然而，由于这些功能未正式公布且未记录，只有少数试点客户可以访问它们。\n\
  \n这种策略使我们能够坚持 DevOps 原则并保持敏捷，而无需维护我们软件包的多个版本。然而，我们仍然只在一年中三次正式发布新功能。\n\n请记住——发布不仅仅是技术方面的事情。它还涉及人为因素，例如沟通、提供发布说明、为客户提供培训等等。\n\
  \n到现在为止，你应该对不仅*为什么*而且*如何*设计最适合你组织需求的发布管理流程有了扎实的理解。有效平衡发布和部署的频率将确保你的团队能够持续为客户提供价值，同时管理变更并保持稳定。\n\
  \n## 为什么不每周发布一次？\n\n“我们不能每周发布新功能吗？”我听到你问。答案是肯定的，你在技术上可以做到。但你应该吗？那是另一回事。\n\n你的终端用户，信不信由你，并不总是对惊喜感到兴奋。当然——在**面向客户的业务（B2C）**场景中，快速更新和变化可能是可以接受的，甚至令人兴奋。但在**企业对企业（B2B）**世界中，情况并非总是如此。想象一下，星期一早上带着咖啡上班，却发现你上周还在使用的工具一夜之间发生了变化。哎呀。\n\
  \n这不仅仅是管理冲击值的问题。你有足够的资源为这些新功能每周提供足够的培训、文档和支持吗？更新产品是一回事，但让用户跟上进度则是另一个挑战。\n\n缺乏适当沟通和支持的频繁更新可能导致一系列问题。我们说的是新功能采用率低下、支持成本飙升以及整体用户满意度下降。换句话说——变更管理本身就是一门艺术。它存在的原因是，通常来说，人们并不真正喜欢在工作中遇到惊喜。\n\
  \n所以，是的——你应该频繁部署最新的代码，但发布呢？没那么多。只需以 Salesforce 为现实案例：它频繁部署更新，但每年只有三次主要发布。因此，虽然诱惑是在功能准备好后立即展示你的闪亮新功能，但请记住耐心是美德，尤其是在软件发布管理方面。\n\
  \n## 摘要\n\n![](img/44ed632038957e4c80220676e84c5109_390_0.png)\n\n干得好，先锋们！我们已经掌握了发布管理，掌握了版本类型和推送升级的知识。我们确保客户始终拥有最新的工具，并学会了选择完美的发布和部署时机。结果是什么？从设计到终端用户的无缝软件过渡，而不会干扰实时环境。\n\
  \n你获得的实用技能对于 Salesforce ISV 之旅中的稳定性、风险最小化和成功的变更管理至关重要。它与在荒野中生火一样重要。\n\n但我们还没完！我们下一个冒险是新客户入驻。我们将学习如何创建有吸引力的\
  \ AppExchange 列表，优化试用体验，加快安装和升级速度，设计自动化的入驻流程，并管理客户所做的本地更改。所以，收拾行李吧，先锋们。我们的下一个冒险在等待！让我们一起征服客户入驻！\n\
