  ## 加入 AppExchange 合作伙伴社区


  ![](img/44ed632038957e4c80220676e84c5109_91_0.png)


  加入 AppExchange 合作伙伴社区就像为 Salesforce 爱好者获得一张通往威利·旺卡巧克力工厂的金色门票一样。成为 AppExchange ISV
  合作伙伴始于这个神奇的中心，它为您提供资源、支持案例、活动和论坛的访问权限。


  那么，你如何获得这张通往 Salesforce 世界的门票呢？请按照以下简单步骤操作：


  - 访问 [partners.salesforce.com](partners.salesforce.com) 并点击 **成为 Salesforce 合作伙伴**——这里无需购买糖果棒。

  - 继续注册流程。即使您已经是 Salesforce 用户，也建议避免使用您的 Salesforce 客户凭据。相反，为您的合作伙伴实例创建一个全新的用户名。填写表格，点击
  **提交**，然后等待那封甜美的确认邮件。

  - 点击邮件中的链接设置永久密码并验证您的账户，从而解锁您的 12 个月 PBO 试用期。

  - 返回 [partners.salesforce.com](partners.salesforce.com)，使用 Salesforce 登录，并授予身份 URL
  服务访问权限，就好像您正在打开通往全新世界的大门一样。


  就这样——您已获得对 PBO 的访问权限，即 Salesforce 企业版，享有 12 个月试用期。


  再说明一点——您需要激活 PBO 许可证。这是通过在合作伙伴社区中记录案例来完成的，并且您需要在签署 PADA 后执行此操作（不用担心；我们将在下一节中介绍）。如果不这样做，您的试用
  PBO 将在 12 个月后过期，而您不希望这种情况发生。最简单直接的规避这种潜在麻烦的方法是在日历中为几个月后设置提醒。这样，您就可以检查以确保您的 PBO 试用期仍然有效，并且没有因试用期到期而被停用。现在您已成为合作伙伴社区的一员，准备好最大化您与
  Salesforce 和 AppExchange 生态系统的合作伙伴关系吧。


  值得强调的是，加入 AppExchange 合作伙伴社区完全免费，并且附带无与伦比的好处——免费获得 PBO——这与行业典型的高许可费用形成鲜明对比。


  ## 合作伙伴协议 – 有趣的部分（说真的）


  欢迎来到激动人心的 Salesforce AppExchange 合作伙伴计划法律世界！虽然想到法律协议可能会让您想蜷缩起来狂看最喜欢的电视节目，但我保证让本节尽可能有趣且信息丰富。所以，拿一杯咖啡（或者如果你讲究的话来杯茶），让我们深入到合作伙伴协议的愉悦领域吧！


  ## SPPA


  将 SPPA 想象成您 Salesforce 合作伙伴成功的藏宝图。它不仅仅是任何点击即同意协议——它是引导您穿越 Salesforce 合作伙伴计划和合作伙伴社区迷宫的协议。别忘了令人兴奋的搭档——Salesforce
  合作伙伴计划政策，为每种合作伙伴计划类型提供具体的指导。


  ## 开始您的 Salesforce 合作伙伴冒险


  作为新的 Salesforce 合作伙伴，您的激动人心的冒险始于您首次登录合作伙伴社区时接受 SPPA。您需要公司的一名授权代表来审阅并接受 SPPA，但不用担心——他们不需要法学学位就能完成工作。


  ## SPPA – 通往合作伙伴社区的单程票


  SPPA 就像一张授予您访问合作伙伴社区的金色门票。但请记住，它是不可协商的。就像您无法改变重力规则一样，您也无法更改 SPPA 的条款。


  ## 导航合作伙伴地形


  SPPA 为访问合作伙伴社区和加入合作伙伴计划奠定了基础，而政策则充当可靠的指南针，为特定合作伙伴计划提供更详细的指导。务必彻底阅读两份文件——毕竟，您不会在没有地图和方向感的情况下开始公路旅行，对吧？


  ## 您 AppExchange 解决方案的业务审批


  启动您的 AppExchange 解决方案的下一个关键阶段涉及提交业务审批。此流程要求计划将新应用推向市场的每个 ISV 合作伙伴提交一份商业计划。


  ## 为 AppExchange 市场制定商业计划 – app-tastic 成功配方


  ![](img/44ed632038957e4c80220676e84c5109_96_0.png)


  如果 AppExchange 市场是一块美味的蛋糕，您的商业计划就是使其成为焦点亮点的秘密成分。为了在竞争激烈的市场中脱颖而出并确保您符合 Salesforce
  对道德和诚信的高标准，让我们一起烘焙一份令人垂涎的商业计划。本节将作为您的配方，指导您了解 AppExchange 定制商业计划的基本要素以及如何使用 AppExchange
  发布控制台制作一份能给 Salesforce 留下深刻印象的计划。


  ## 商业计划提交和审批流程 – 厨房准备


  在您的杰作登陆 AppExchange 市场的货架之前，Salesforce 需要品尝一下您的商业计划。商业计划包括


  三个部分，[content]

  三个部分，如下所示：


  - **业务详情**：力求简洁而全面的回答。作为新合作伙伴，提供详尽细节可能很诱人，但 Salesforce 通常更欣赏直接、切中要点的回复。

  - **产品架构**：同样，清晰是关键。提供清晰的概述，而不要深入技术术语。

  - **合规认证**：仅在付费 AppExchange 列表时才需要。


  一旦您的商业计划准备就绪，请提交审核。Salesforce 将提供反馈以完善您的方案，要么批准，要么提出改进建议。如有需要，您可以在处理意见后重新提交。


  ## 业务详情 – 基础层


  本部分是您蛋糕的基础，帮助 Salesforce 了解您的公司如何融入其产品生态系统。它包括以下方面：


  - **市场调研和分析**：了解您的目标市场、竞争对手以及 AppExchange 市场中现有的解决方案。这些知识将帮助您识别市场空白并有效定位产品。

  - **应用开发策略**：解决开发您的应用并将其与 Salesforce 集成的技术方面、挑战和解决方案。在 *第 4 章* 中，您将掌握 ISV 专属技术。

  - **定义您的价值主张**：是什么让您的应用成为点睛之笔？阐明使您的应用区别于竞争对手的独特功能和优势。*第 3 章* 中涵盖的策略将助您完成此项工作。

  - **收入模式和定价策略**：选择适合您应用和市场的收入模式，并确定有竞争力的定价策略。这也在 *第 3 章* 中有所涉及。

  - **营销和销售策略**：制定全面的计划，在 Salesforce 生态系统中推广您的应用，包括创建引人注目的 AppExchange 列表。我们将在 *第
  8 章* 深入探讨这一点。

  - **客户支持和成功计划**：通过提供各种支持渠道和资源来保持客户满意，帮助他们充分利用您的应用。在 *第 9 章* 中，您将探索一些选项。

  - **财务预测和关键绩效指标 (KPI)**：估算潜在收入、支出和盈利能力，并定义 KPI 以跟踪应用的成功情况。*第 12 章* 深入探讨最常见的 KPI。

  - **实施时间表和里程碑**：规划开发、发布和维护时间表，包括关键里程碑和截止日期。


  ## 产品架构


  秉承蛋糕隐喻，让我们将产品架构部分视为隐藏在糖霜下错综复杂的蛋糕结构。是时候戴上安全帽，深入您应用构建的技术细节了。就像任何优秀的建筑师一样，您需要向 Salesforce
  提供产品设计的全面蓝图。


  本部分应涵盖以下方面：


  - **您的应用如何存储凭据、密码和其他敏感数据：** 将其视为蛋糕城堡内的秘密金库，保持所有重要宝藏的安全无虞

  - **产品的架构和设计：** 如果您愿意，这是您应用的平面图，包括技术栈、编程语言、框架以及任何第三方库或服务

  - **与其他系统和应用的集成：** 它就像将您的应用连接到更广阔 Salesforce 景观的管道和线路

  - **处理安全和数据隐私问题：** 保护您应用领域的不懈警卫


  本部分的目的在于证明您的应用遵循 Salesforce 在架构和设计方面的最佳实践——就像一座设计精良、抗震的蛋糕塔。


  ## 合规认证


  对于付费 AppExchange 列表，现在是说服 Salesforce 您的公司是可靠且合乎道德的业务合作伙伴的时候了。将合规认证部分视为应用世界的米其林之星。要获得这一享有盛誉的荣誉，您需要以最佳方式展示公司的业务实践和关系。


  包括以下要素：


  - **法律结构、所有权和财务稳定性：** 您应用烘焙坊的基础支柱。

  - **任何过去的法律或监管问题：** 如果厨房里发生过任何失误，现在是时候解决它们并展示您如何改进。

  - **数据隐私和安全实践：** 您如何保护客户数据并遵守适用法律和法规。这就像为您的烘焙坊获得顶级卫生评级。

  - **第三方关系或合作伙伴关系：** 展示这些合作如何与 Salesforce 的价值观和政策保持一致，例如与镇上最好的糕点师合作。


  总体而言，合规认证部分应证明您的公司是 Salesforce 及其客户值得信赖且可靠的合作伙伴——毕竟，事实胜于雄辩。


  Voilà！一份精心制作的商业计划已准备就绪！通过解决商业计划的每个部分，您将确保您的应用符合 Salesforce 的标准并促进您业务的增长。通过周密的规划和执行，您的应用可以成为
  Salesforce 生态系统的 pièce de résistance。Bon appétit！


  ## 与 AppExchange ISV 合作伙伴团队的通话


  提交商业计划后，ISV AppExchange 合作伙伴团队将仔细审查您的提案。审查后，他们可能会联系您以获取反馈或请求额外信息。这就是初步非正式讨论发生的时候。此通话不仅仅是审查；它也是您提问、探索机会并了解团队如何在您作为潜在合作伙伴的旅程中提供帮助和支持的宝贵机会。


  在对话期间，ISV AppExchange 合作伙伴团队可能会发现需要您关注的领域。如果出现任何问题，您将有机会纠正并重新提交计划。经过此次讨论，在充分了解您的提交内容和开发时间表后，团队如有必要可能会安排进一步的通话，并将指导您进入下一步。


  此流程的下一阶段涉及 PADA 的执行。该协议规定了您与 Salesforce 的合作伙伴关系的具体内容以及通过 AppExchange 市场分发您的应用。


  ## PADA


  将 PADA 视为 Salesforce AppExchange 合作伙伴计划三明治中的秘密酱料。它规范参与 ISVforce 和 OEM 类别的合作伙伴，并概述分发应用的条款和条件。PADA
  就像厨师特选，将所有食材融合在一起，使其在与 Salesforce 生态系统分享您的应用之前必不可少。


  ## 一点灵活性 – 先安全审查，后签署


  PADA 有其独特的风味——它允许合作伙伴在签署协议之前就提交应用进行安全审查。这就像在吃完开胃菜之前先偷看甜点。然而，合作伙伴在与 Salesforce 完成
  PADA 流程的每一口之前都不能开始销售。


  以下是 PADA 的三个关键要素：


  - **净收入百分比 (PNR)**：它是合作伙伴与 Salesforce 分享的收入金额和类型，就像在豪华晚餐后分摊账单

  - **合作伙伴应用描述（或组合解决方案描述）**：它是合作伙伴应用的法律描述，有助于计算 PNR，就像阅读菜单以了解您订购的内容一样

  - **产品目录**：它是合作伙伴在 Salesforce 生态系统中提供的产品和服务清单，就像您 Salesforce 储藏室的购物清单


  了解这些要素可以帮助合作伙伴烹制与 Salesforce 的成功合作，即使他们不是直接谈判 PADA 的人。


  ## ISVforce 补充协议


  当合作伙伴决定使用 ISVforce 应用分发模式为 AppExchange 市场构建应用时，他们需要在 PADA 中添加 ISVforce 补充协议。此额外要素涵盖各种方面，例如合作伙伴关系、客户关系、费用和营销。


  ## PADA 的保质期


  PADA 连同其 ISVforce 补充协议，最初为期 3 年，就像美酒一样，会自动续期 1 年，除非任一方决定是时候推出新年份或提前终止协议。




