  \ Trailblazer Scorecard 概览或 AppExchange ISV 合作伙伴计划指南。这些目标就像时尚潮流一样会定期更新，合作伙伴必须达到或超过这些目标以保持或提高其评分。请查看下表中每个支柱的得分：\n\
  \n| Pillar | Element | Total Points |\n|---|---|---|\n| Customer Success | Attrition\
  \ Rate | 200 |\n| Customer Success | Average App Rating | 75 |\n| Innovation | Technology\
  \ Adoption | 200 |\n| Innovation | Trailhead Badges | 75 |\n\n| Category | Metric\
  \ | Score |\n|---|---|---|\n| Growth | ACV Growth | 200 |\n| Growth | Total Revenue\
  \ | 75 |\n| Impact | Equality | 125 |\n| Impact | Sustainable Development | 50 |\n\
  |  | Pledge 1%: Bonus points | 25 |\n\n请注意，表格数据截至本文撰写时准确，适用于 2024 财年。该表格提供了不同支柱得分的快照，突出了我们的合作伙伴在决定其\
  \ Trailblazer 评分的领域中的表现。\n\n## Partner tiers\n\n根据您在成功支柱方面的表现，您将被分配到四个合作伙伴层级之一：Base、Ridge、Crest\
  \ 或 Summit。每个层级都提供来自 Salesforce 的特定权益和支持。\n\n- **Base tier**: **Base tier** 是新 AppExchange\
  \ 合作伙伴的起点，提供对基本资源的访问，例如 Partner Community，以及营销和技术支持的基础支持。\n- **Ridge tier**: 在成功支柱方面表现出改进的合作伙伴可以攀升至\
  \ Ridge tier，该层级提供额外福利，如增强的营销支持、更多参与 Salesforce 活动的机会，以及在 AppExchange 市场中更高的可见度。\n\
  - **Crest tier**: **Crest tier** 是在客户成功、创新、成长和影响方面表现出色的合作伙伴的理想位置。这些合作伙伴可获得优先支持、专属客户管理以及访问\
  \ Salesforce 独家资源。\n- **Summit tier**: **Summit tier** 是 AppExchange 合作伙伴认可的巅峰。这些合作伙伴在所有成功支柱方面展现了出色的表现，被视为\
  \ Salesforce 生态系统中的领导者。Summit 合作伙伴可获得最高级别的支持，包括战略规划、高管赞助，以及与 Salesforce 合作的独家联合营销和协作机会。\n\
  \n下表概述了根据您在成功支柱方面的表现可获得的合作伙伴层级以及每个层级所需的 Trailblazer 评分。这些层级提供来自 Salesforce 的特定权益和支持，帮助合作伙伴在\
  \ AppExchange 生态系统中蓬勃发展。\n\n| Program Benefit Tier | Trailblazer Score Required\
  \ |\n|---|---|\n| Summit | 700+ |\n| Crest | 400 - 699 |\n| Ridge | 250 - 399 |\n\
  | Base | <250 |\n\n通过关注成功支柱并持续提高您的 Partner Trailblazer 评分，踏上攀登合作伙伴层级的激动人心之旅。随着您不断攀升新高度，您可以推动\
  \ AppExchange 业务向前发展，并在 Salesforce 生态系统中最大化您的潜力。祝您攀登愉快！\n\n## Salesforce team: your\
  \ allies in success\n\n让我们探索您将互动的关键角色，每个角色都旨在在合作伙伴关系的各个阶段协助您，确保您拥有所有必要的指导和资源。\n\n\
  ### Business Development Representative (BDR)\n\n您最初的联系人以及 AppExchange 合作伙伴流程的专家，BDR\
  \ 将指导您完成入职流程，帮助您了解合作伙伴关系目标以及您的应用如何在生态系统中发挥作用。\n\n您可能已经见过您的 BDR，在您提交申请后，BDR 安排了电话会议以讨论合作伙伴关系的下一阶段。对于提交前的任何疑问或入职协助，您可以在\
  \ Partner Community 的 Partner Onboarding Group 中联系他们。\n\n### Technical Advisor (TA)\n\
  \nSalesforce 平台的专家，担任塑造 Salesforce 技术合作伙伴网络庞大范围内的战略、设计和架构的全球团队中的核心成员。TA 在推动 ISV\
  \ 合作伙伴生态系统收入增长方面发挥着关键作用，同时确保 ISV 解决方案与不断发展的 Salesforce 平台之间在技术对齐、无缝集成和和谐协同方面的关键要素。其方法以积极主动和协作的心态为核心，以坚实的科技基础为支撑，并以对持续学习和创新的不懈追求为动力。与\
  \ TA 合作将为 ISV 开启无限机会。它有助于实现战略目标、完美设计和架构卓越，这些对于在不断变化的 Salesforce 生态系统中取得成功至关重要。\n\
  \n### Partner Account Manager (PAM)\n\n他们是您合作伙伴关系成长过程中的战略盟友。PAM 与您合作创建联合 **go-to-market**\
  \ 计划，并提供有关如何在 Salesforce 生态系统中扩展的建议。随着客户群的增长，PAM 提供量身定制的支持，帮助您将产品和市场战略与 Salesforce\
  \ 的机会和客户需求保持一致。\n\n### Platform Expert Consultations\n\n导航 Salesforce 庞大平台的复杂性可能是一项复杂任务。幸运的是，作为合作伙伴，您可以通过与\
  \ Salesforce 平台专家进行 1:1 咨询获得个性化指导。此专业服务可成为您在增强和创新 AppExchange 产品时不可或缺的盟友。\n\n以下是平台专家咨询包含的内容：\n\
  \n- **Tailored technical guidance**: 安排与 Salesforce 专家的一对一技术咨询以获得可扩展性指导。这些咨询将帮助您最大化\
  \ Salesforce 技术的利用，并可能提高您的 Trailblazer 评分。\n- **Strategic ISV technology guidance:**\
  \ 深入了解关键 ISV 技术，如 LWC、In-App Guidance、CRM Analytics、2GP、Platform Cache 和 Apex。这些战略见解将指导您穿越不断发展的\
  \ Salesforce 生态系统。\n- **Support with specific tools:** 获得运行或使用 ISV DX Plug-in 的帮助，并获得技术采用问卷的解答。此支持确保您充分利用\
  \ Salesforce 提供的工具。\n- **Education on ISV technologies:** 接受有关如何使用基本 ISV 技术（如 Trialforce、Push\
  \ Upgrades、App Analytics 和 ISV Debugger）的教育。\n- **Collaborative experience:** 享受个性化和互动的体验，鼓励讨论并帮助快速解答您业务关键问题。\n\
  \n要请求咨询，只需在 Partner Community 中提交案例即可。平台专家咨询旨在激励您在应用创新之旅上，并提供对关键平台功能和架构最佳实践细微差别的见解。\n\
  \n### Technology Consultations\n\n工具、技术和最佳实践的多样性可能令人不知所措，但幸运的是，Salesforce 的技术咨询在这里为您提供帮助。在经验丰富的技术顾问的指导下，您可以自信地规划开发路径，确保您的\
  \ AppExchange 产品符合 Salesforce 的最佳实践。\n\n您可期待的技术咨询内容？\n\n- **Tailored technical guidance**:\
  \ 从 Salesforce 的 ISV 技术顾问那里获得个性化反馈和指导。他们的专业知识涵盖技术、工具和开发最佳实践，为您提供成功所需的见解。\n- **Application\
  \ functionality and architecture feedback**: 参与有意义的讨论以获得有关您应用功能和架构的反馈。了解您的应用如何与\
  \ Salesforce 的架构原则保持一致可能对您的开发过程至关重要。\n- **Focused topic areas**: 咨询涵盖广泛的主题领域，包括：\n\
  \  - Application architecture\n  - Salesforce development\n  - Security review guidance\n\
  \  - OEM vs. ISVforce\n  - ISV tools and automation\n  - New Salesforce technologies\n\
  \  - Industry clouds\n\n\n\nTechnology Consultations are more than mere discussions;\
  \ they are strategic collaborations that guide your development journey on the Salesforce\
  \ platform. Whether you’re dealing with application architecture or exploring new\
  \ Salesforce technologies, these consultations are tailored to provide the precise\
  \ guidance you need.\n\n## Product Roadmap Consultations\n\nPlanning your product’s\
  \ technical future can be a challenging endeavor. This is where Product Roadmap\
  \ Consultations come into play. These strategic consultations offer valuable insights\
  \ and guidance tailored to your product’s vision, aligning your development with\
  \ Salesforce’s innovation.\n\nProduct Roadmap Consultations are available to partners\
  \ at the Crest and Summit tiers. To engage in these valuable consultations, simply\
  \ contact your Partner Account Manager (PAM). They will facilitate the 2-hour technical\
  \ consultation with a Salesforce ISV Technology Advisor.\n\nThe consultations cover\
  \ a wide array of topic areas, including:\n\n- **Technical success plan:** A custom-tailored\
  \ plan to guide your App’s current and future technical direction.\n- **Product\
  \ alignment:** Ensure your App’s alignment with Salesforce’s product roadmap, staying\
  \ ahead of technological trends.\n- **Innovation score enhancement:** Strategic\
  \ recommendations to boost your innovation score, reflecting your commitment to\
  \ continuous improvement.\n\nProduct roadmap consultations serve as strategic checkpoints\
  \ in your App’s development journey. They offer a rare opportunity to align your\
  \ product strategy with Salesforce’s roadmap, ensuring that your app remains innovative\
  \ and competitive.\n\n## Leveraging events for maximum impact\n\n![](img/44ed632038957e4c80220676e84c5109_584_0.png)\n\
  \nEver heard the one about the Salesforce developer who walked into a bar?\nNo?\
  \ Me neither. But if they did, they’d probably run into an AppExchange guru sipping\
  \ a martini and sharing platform secrets. The moral of the story: Sometimes, the\
  \ answers we seek are just a barstool—or a networking event—away. The vibrant ecosystem\
  \ of AppExchange is not just about code and clicks; it’s a bustling bazaar of brainpower.\n\
  \nSalesforce hosts various events such as *Dreamforce*, the *World Tour*, Specialized\
  \ Events, Basecamps, Community Events, and Salesforce User Groups. These events\
  \ attract a diverse range of attendees from across the globe and present a unique\
  \ opportunity for AppExchange partners to promote their products and build networks.\n\
  \nTo fully leverage these events, partners need to create a solid pre- and post-event\
  \ strategy. The strategy should include clear goal setting, content review, booth\
  \ planning, and a robust follow-up plan.\n\nBefore the event, it’s crucial to define\
  \ your goals, which could range from brand awareness and lead generation to relationship\
  \ building and deal acceleration. Review your marketing materials and ensure your\
  \ AppExchange listing is up to date. Plan your booth carefully, choosing staff who\
  \ can effectively demo your product and engage with attendees.\n\nDuring the event,\
  \ make your booth stand out with strong visuals and clear messaging. Capture qualified\
  \ leads and provide a secondary **call-to-action** for interested prospects. Use\
  \ social media to promote your presence and activities at the event.\n\nAfter the\
  \ event, promptly follow up with leads and share your session deck in the content\
  \ section of your AppExchange listing as a post-event touchpoint. Review the event’s\
  \ success based on your initial goals and learnings to inform your strategy for\
  \ future events.\n\nSalesforce events also provide opportunities to connect with\
  \ prospects, customers, and Salesforce employees. It’s beneficial to schedule meetings,\
  \ promote your session or booth, and follow up post-event with personalized messages.\n\
  \n## Demo jams: your spotlight to stardom!\n\nEver dreamed of promoting your app\
  \ to an expansive audience by showcasing how extraordinary your product is? Well,\
  \ demo jams are your golden ticket! They are not only one of the most exhilarating\
  \ parts of every *Dreamforce*, *TrailblazerDX*, and community events but also a\
  \ thrilling game-show-style stage to prove your app’s excellence.\n\nImagine a stage\
  \ where 4-6 app partners are lined up, each tasked with giving the most riveting,\
  \ no-fluff, 3-minute live demo of their app. The pressure is on, the crowd is electrified,\
  \ and at the end of it all, attendees cast live votes for their favorite demo, and\
  \ the winner walks away with an exciting prize.\n\nDemo jams are a live spectacle\
  \ that you can find at events, in webinars (register through [appdemojam.com](appdemojam.com)),\
  \ and online via YouTube. Live events are typically held in the bustling atmosphere\
  \ of the Expo Hall theater during the event.\n\nDemo jams present an incredible\
  \ opportunity to give a demo to a live audience ranging from 80 to 150 people. According\
  \ to Salesforce, the demo jam videos can garner up to 11,000³ views per video, offering\
  \ significant brand exposure. AppExchange promotes them heavily, and cross-promotion\
  \ from each partner adds to the reach. It’s also an excellent chance to showcase\
  \ your best demo delivery teammate and have a ton of fun!\n\n3 https://appexchange.salesforce.com/appxContentListingDetail?listingId=a0N3A00000EJeavUAD\n\
  \nThe simplicity of demo jams lies in their rules. Your live demo must be strictly\
  \ three minutes or less. No slides, PowerPoint presentations, or videos are allowed;\
  \ it must be a live demonstration. And there will only be one winner per demo jam.\n\
  \nDemo jams aren’t just a promotional platform; they’re a celebration of innovation,\
  \ creativity, and the compelling power of live demonstrations. Whether you’re an\
  \ AppExchange veteran or a newcomer, participating in a demo jam could lead to your\
  \ moment in the spotlight. It’s about community, learning, and, above all else,\
  \ having an incredible amount of fun!\n\n## AppExchange Marketing Program (AMP)\n\
  \n![](img/44ed632038957e4c80220676e84c5109_588_0.png)\n\nEver written a brilliant\
  \ LinkedIn post and thought, ‘Gosh, I wish I could put a spotlight on this right\
  \ now!?’ Well, for apps on the Salesforce AppExchange, there’s something that comes\
  \ pretty darn close. Ladies and gentlemen, I present to you: the **AppExchange Marketing\
  \ Program (AMP)**.\n\nWhat makes AMP unique is its powerful combination of tools,\
  \ resources, and insights, specifically designed to maximize the presence of ISV\
  \ partners on the Salesforce AppExchange. However, it’s essential to understand\
  \ that AMP is a paid program. Please be aware that it can be costly and might not\
  \ always give a good **return on investment** to smaller ISVs.\n\nAMP goes beyond\
  \ being just a marketing initiative; it is a strategic investment. Salesforce acknowledges\
  \ the challenges that ISVs may face in a competitive market and, therefore, offers\
  \ AMP as a premium suite to provide partners with a competitive edge. It is custom-made\
  \ to elevate your app, whether you are launching it for the first time or enhancing\
  \ its existing journey.\n\n## Main categories of AMP\n\nThe AMP is designed to empower\
  \ partners with diverse avenues to showcase, promote, and amplify their applications\
  \ within the Salesforce ecosystem. Here are the main categories that the program\
  \ offers:\n\n- **Showcase Your Product**: This category enables partners to highlight\
  \ their applications’ unique features, benefits, and value proposition. By creating\
  \ compelling narratives and using rich visual content, you can captivate potential\
  \ users and ensure that your product’s essence shines through.\n- **Promote AppExchange\
  \ Listing**: Your listing on AppExchange is your primary touchpoint with Salesforce\
  \ customers. This category offers tools and insights to amplify your AppExchange\
  \ presence. From optimizing listing content to leveraging promotional slots, this\
  \ category ensures your app grabs the spotlight.\n- **Increase Solution Awareness**:\
  \ Amplifying your brand’s awareness goes beyond AppExchange. This category provides\
  \ avenues like webinars, joint promotional campaigns, and events, ensuring your\
  \ solution resonates with a wider audience, both within and outside the Salesforce\
  \ ecosystem.\n- **Educate Salesforce Employees**: A unique component of AMP, this\
  \ category focuses on aligning Salesforce’s internal teams with your product’s vision.\
  \ By educating Salesforce employees about your application, they become ambassadors\
  \ for your solution, ensuring coherent communication and shared objectives when\
  \ engaging with potential clients.\n\nStarting with the 60-second solution video\
  \ is often a smart move. This concise visual can be a powerful introduction to your\
  \ offering, finding its place on your AppExchange listing, website, or even YouTube\
  \ channel.\n\nIt’s essential to manage expectations. While this exposure can significantly\
  \ boost brand awareness, only a tiny segment (about 5%) of viewers might be in the\
  \ market for an immediate purchase. The majority are still exploring, evaluating,\
  \ and considering options.\n\nIf you’re targeting immediate conversions within a\
  \ short timeframe, focusing primarily on homepage promotions on AppExchange might\
  \ not yield the desired results. However, if your sights are set on nurturing leads\
  \ for conversions in the upcoming quarters, then such promotions can be precious.\n\
  \n\n\n## AppExchange 聊天\n\nAMP 的一个特别有趣的功能是 AppExchange Chat。您可以在 AppExchange 列表上直接启用它，为实时互动提供新的途径。在日益以数字为中心的商业环境中，与潜在客户建立即时联系变得比以往任何时候都更加重要。借助\
  \ AppExchange Chat，企业可以在潜在客户表现出兴趣的那一刻立即与其互动，无论是解答即时咨询还是安排会议。这款工具不仅仅关乎实时互动；如果代表不可用，系统会切换到自动聊天，以确保没有潜在客户被忽视。历史数据证明了其有效性：根据\
  \ Salesforce 的数据，6% 的 AppExchange Chat 互动会转化为人工与机器人结合的对话，11% 转化为新的线索，5% 导致安排了会议。对于每月至少获得\
  \ 500 次列表访问的企业来说，集成 AppExchange Chat 可以成为优化线索转化并提升投资回报率的战略举措。\n\n## 最大化您的 AMP 投资回报\n\
  \n我们没有在专门介绍 AppExchange Listing 的章节中深入探讨 AMP，这可能看起来有些奇怪。原因很简单却很战略性。AMP 是一个强大的工具，但只有在产品旅程的正确时机部署时，其效能才能最大化。在考虑\
  \ AMP 的好处之前，ISV 需要确保基础要素牢固到位。\n\nAMP 可以加速您的努力，但只有在应用于正确的问题时才有效。请考虑以下场景以了解您当前面临的挑战所在：\n\
  \n- 无法创造需求？如果潜在客户不了解或对您的产品不感兴趣，您面临的是营销问题。问题可能出在推广、信息传递或可见性上。\n- 无法捕捉需求？如果有兴趣，但被导向他处或分散，您正面临定位问题。尽管存在需求，您的产品可能仍未被视为理想解决方案。\n\
  - 无法转化需求？当有明确兴趣且您的产品已进入考虑范围，但转化并未发生时，您遇到的是产品问题。产品功能、用户期望或价值交付之间可能存在不匹配，这可能是罪魁祸首。\n\
  \n一旦您掌握了基础并清楚了解挑战所在，AMP 就能成为改变游戏规则的工具。但请记住，这不是用 AMP 来填补空白或掩盖裂缝。它是关于将一个已经稳健的战略和产品方案提升到新的高度。只有具备这种基础清晰度，您才能从\
  \ AMP 投资中获得最佳投资回报。\n\n## 利用外部专业知识\n\n![](img/44ed632038957e4c80220676e84c5109_593_0.png)\n\
  \n听说过那个在车库里独自成为 AppExchange 风云人物的天才吗？我也没听说过。因为虽然我们经常颂扬个人成就者，但 AppExchange 的真正英雄是那些编排者、指挥家，他们汇聚了外部人才的交响乐。\n\
  \n在 AppExchange 瞬息万变的沙地上航行并不是在公园里独自散步。更像是攀登珠穆朗玛峰的团队远征，但冻伤更少，API 调用更多。作为 ISV 合作伙伴真正崭露头角，您不能仅依赖组织内部的资源。\n\
  \n利用外部专业知识是 AppExchange 生命的核心。它提供您可能甚至不知道存在的专业技能（有人说“基于云的杂耍集成专家”吗？），超出您当前手册的创新策略，以及挑战现状的多元视角。所有这些要素都能显著提升您在\
  \ AppExchange 上的愉快旅程。\n\n## 系统集成商\n\nSalesforce 生态系统中的 **系统集成商 (SIs)** 是为 Salesforce\
  \ 客户提供实施服务的合作伙伴，确保与其它业务系统无缝集成和对齐。与 SIs 建立战略联盟可以是一种强大的策略，能够扩展您产品的覆盖范围。通过建议客户选择现有的\
  \ AppExchange 产品，SIs 可以通过将其与互补解决方案集成来提升其服务的价值。这种方法不仅提升了产品的功能，还为 SIs 和 ISV 开辟了新的市场和潜在客户群。\n\
  \n网络是技术这一复杂领域中的一个关键方面。通过与 SIs 的合作，您可以识别潜在客户、促成合作协议，甚至设计联合的进入市场策略。SIs 通常拥有可以帮助 ISV\
  \ 发现正确渠道和增长合作伙伴的联系和洞察。\n\n技术行业庞大而多样，每个细分市场都呈现出其独特的机遇和挑战。通过与 SIs 合作，您可以进入以前可能无法触及的新市场细分。SIs\
  \ 通常拥有深厚的行业特定专业知识，因此可以为您提供渗透并在这些领域取得成功的战略路线图。\n\n合作伙伴关系应以互利为中心。与 SIs 合作可以创造推动共同成功的协同效应。无论是通过资源共享、联合营销举措还是共同开发解决方案，这些协同效应都可以带来更高的效率、创新和市场渗透。\n\
  \n从 SI 的角度来看，与 ISV 建立战略联盟可能是互利的，但强调此类合作中对 SI 的附加价值是您的职责。请记住，一些 SIs 可能不想要收入分成。他们更喜欢保持中立，只会根据客户的最佳利益做出推荐。因此，保持在他们的雷达上很重要。\n\
  \n请注意，SIs 通常不是专门构建 AppExchange 产品的产品开发外包商 (PDOs)。相反，他们的专业知识在于无缝集成和组合不同的子系统以创建统一的解决方案。通过与\
  \ ISV 合作并推荐其现有解决方案，SIs 可以通过为客户提供全面、现成的应用程序来提升其服务的价值。这不仅为 SI 节省了时间和资源，还扩大了其市场覆盖范围，并允许他们通过将这些解决方案与其互补服务集成来释放新的机会。最终，与\
  \ ISV 的战略联盟可以使 SIs 提供更具竞争力的优势，并为客户提供完整高效的解决方案。\n\n## 产品开发外包商 (PDO)\n\n如果您已经知道如何与系统集成商合作来发展业务，您可能会想知道他们是否能在构建您的\
  \ AppExchange 产品方面提供帮助。然而，现实是他们的专业知识在于为终端客户实施解决方案，而不是为 AppExchange 创建商业应用。那么，在产品开发之旅中，您可以在哪里获得专业支持和指导呢？Salesforce\
  \ 通过 **产品开发外包商 (PDO)** 项目为您提供支持。\n\n如果您已经读过本书，您就比大多数开始旅程的 ISV 处于更好的位置。然而，必须注意的是，虽然讲座提供了宝贵的见解，但它并不涵盖所有技术细节或场景。这正是与\
  \ PDO 合作可以成为获得正确答案并快速克服任何挑战的最佳选择的地方。\n\n## PDO 是什么？\n\nPDO 代表着一个多元化的咨询合作伙伴群体，他们专注于为\
  \ AppExchange 构建商业应用。除了开发之外，他们还提供诸如创意构思、进入市场咨询、原型制作、测试、支持和路线图规划等有价值的服务。PDO 拥有架构、设计和完善商业应用的专业知识，可以处理\
  \ ISV 合作伙伴构建的特定领域，或增强合作伙伴内部开发团队的能力。\n\n虽然 SIs 对于为 Salesforce 客户实施针对特定业务需求的解决方案至关重要，但\
  \ PDO 是 AppExchange 产品开发的首选合作伙伴。关键差异在于：\n\n- **对商业模式的理解**：SIs 在为终端客户的 Salesforce\
  \ 定价方面表现出色，而 PDO 则深入了解 ISV 合作伙伴可用的商业模式。他们专注于创建引人入胜的解决方案，让终端用户愿意为之付费——这些产品推动市场成功。\n\
  - **Org 可见性**：SIs 在特定 Org 内构建解决方案，但 PDO 需要创建能够无缝集成到任何 Org 的解决方案。这种灵活性对于在 AppExchange\
  \ 上分发的产品至关重要。\n- **项目周期**：SIs 通常遵循基于项目的开发，而 PDO 则专注于构建可在其生命周期内不断演进和成长的产品。这确保了持续改进和适应性。\n\
  - **应用打包专业知识**：PDO 拥有针对 AppExchange 的应用打包的特定专业知识，使用诸如 2GP、**LMA**、**COA**、**FMA**\
  \ 等技术。了解什么可以打包、什么不可以打包、进行安全审查以及具备打包构建熟练度，是许多 SIs 经常失败的关键方面。这些知识在创建 AppExchange 的成功产品中发挥着至关重要的作用。\n\
  \nSalesforce 非常重视对 PDO 的评估，以确保他们具备有效支持 ISV 合作伙伴所需的技能和专业知识。PDO 向 Salesforce 报告其项目，为其能力和成就提供宝贵的见解。本节阐明了如何\n\
  \nSalesforce 评估 PDO 以及定义其专业能力的七个专业化领域的含义。\n\n## 七大专业化领域\n\nSalesforce 对 PDO 进行全面评估，通过项目报告流程评估其在产品开发和支持各个方面的专业能力。在此背景下，“Project”\
  \ 指的是 ISV 合作伙伴与 PDO 之间的合作。为了深入了解 PDO 的能力，这些项目会被仔细标记为七个 PDO 专业化领域，涵盖了 PDO 提供的产品开发和支持的各个方面。让我们详细探讨每个专业化领域：\n\
  \n- **构思/商业模式/价值主张**：PDO 协助 ISV 通过进行产品发现、头脑风暴研讨会以及设计商业模式来定义应构建的正确产品。他们提供关于如何与 Salesforce\
  \ 合作以及选择何种合作模式的建议。他们还评估 **总可寻址市场** (**TAM**) 并确保稳固的产品市场契合度。\n- **架构与 UX 设计**：PDO\
  \ 与 ISV 合作，定义技术和用户体验设计以支持其产品的史诗和用户故事。他们提供技术评审协助、创建 mockups、绘制客户旅程，并制定技术设计和架构文档。\n\
  - **开发/QA/发布管理/安全审查**：PDO 为 ISV 产品提供持续的敏捷开发、测试自动化和发布自动化。他们协助 ISV DevOps 团队采用 Salesforce\
  \ CI/CD 最佳实践，并帮助进行安全审查测试和问题解决。\n- **AppExchange 上架、试用和演示**：PDO 在开发后支持 ISV，通过 Partner\
  \ Community 协助创建其 AppExchange 上架。他们还帮助设置利用试用技术的演示组织，使 ISV 能够有效地将潜在客户转化为成交交易。\n-\
  \ **产品支持**：产品发布后，PDO 提供 Tier 2/3 技术支持、持续维护，以及在关键账户中安装和配置方面的协助。他们建立产品反馈循环以优化安装流程。\n\
  - **包审查与优化**：PDO 确保产品能够长期优化并有效利用最新的 Salesforce 功能。PDO 提供打包策略和功能管理的专业知识。他们解决架构和 UX\
  \ 问题，引入新的 Salesforce 版本技术，并提供测试和发布管理的指导。\n- **营销支持**：PDO 协助 ISV 获取成功进入市场的策略所需数据。他们帮助利用\
  \ ISV 工具，如 Partner Business Org (PBO) 和 AppExchange Analytics。此外，他们提供技术营销输入以支持面向客户的工作。\n\
  \n在整个评估过程中，PDO 在三个基本方面接受评估：知识、经验和质量。这些关键要素确保 PDO 具备提供卓越成果并有效支持其合作伙伴所需的专业知识。在每个专业化领域内，设有两个级别，即\
  \ Level I 和 Level II。要获得享有盛誉的 PDO Expert 称号，公司必须取得四个 Level II 专业化，展示出在各个领域卓越的专业水平。\n\
  \n## 选择合适的 PDO\n\n如果您是 ISV 合作伙伴，旨在开发成功的 AppExchange 产品，与其中一家 Expert PDO 合作可以提供显著优势。\n\
  \n要探索 Expert PDO 列表并为您的旅程找到完美的合作伙伴，您可以访问 AppExchange Portal⁴。自本书于 2023 年撰写时起，已有九家公司被列为\
  \ Expert PDO，每家都展现了卓越的成功记录。\n\n4 https://appexchange.salesforce.com/mktcollections/curated/pdo\n\
  \n免责声明：先说一下，我与 Aquiva Labs⁵ 有个人关联，它是这九家精英公司之一，我负责其中的技术战略和创新。我完全理解您可能会认为我试图推销什么，但那不是我的意图。我只是想提供一些来自我自身经验的例子，让本节内容不那么模糊，所以，我分享这些信息是为了保持透明并为您提供一些背景。\n\
  \n5 http://aquivalabs.com/\n\n## 在不同公司阶段利用 PDO 专业知识\n\nPDO 为公司在 AppExchange 产品开发旅程的各个阶段提供宝贵支持和专业知识。无论您是初创公司、中型\
  \ ISV 合作伙伴还是成熟的 ISV，与 PDO 合作都能提供量身定制以满足您特定需求的诸多优势。\n\n### 对于初创公司：轻松构建 MVP\n\n对于初创公司而言，与\
  \ PDO 合作构建应用的最小可行产品（MVP）版本是一个改变游戏规则的决定。如果没有具备深厚 Salesforce 背景的技术创始人，开发第一个应用可能是一项极具挑战性的任务。招聘具有\
  \ AppExchange 经验的 Salesforce 开发者也可能很困难，因为这需要超出标准 Salesforce 开发专业知识的独特技能组合。通过与 PDO\
  \ 合作，初创公司可以在短时间内迅速将 MVP 付诸实践。这使他们能够专注于完善产品并更快地推向市场，而非花费数月时间从零开始组建开发团队。\n\n*示例：*\
  \ 很难选一个，因为在我经验中，这是与 PDO 合作的最常见原因之一。例如，我的一家欧洲客户，一家提供编辑管理系统产品的公司，与我们的团队联手。他们的目标？向\
  \ Salesforce 客户提供其解决方案，因此开发一个 AppExchange 应用，使其解决方案与 Salesforce Knowledge 文章无缝集成。在一个季度的时间内，我们成功设计并实施了一个强大的\
  \ Salesforce 应用，专为其客户用户界面需求量身定制。我们还确保了与其现有离平台解决方案的安全集成，并指导他们完成了安全审查流程。\n\n### 对于中型\
  \ ISV 合作伙伴：最大化 Salesforce 平台能力\n\n中型 ISV 合作伙伴已投资 Salesforce 许可，通常希望充分利用平台的能力，但可能不确定自己不知道什么。PDO\
  \ 可以帮助他们探索新功能开发和采用的潜在领域。通过与 PDO 合作，这些公司可以释放未开发的机会，增强现有产品，并扩展其产品以满足更广泛的客户需求。\n\n\
  *示例：* 让我与您分享另一个故事，其中一家现有 ISV 拥有一个非常成功的产品，包含一个离平台引擎和一个专为订单处理定制的 AppExchange 应用。他们的独特卖点是其多功能性——您可以以各种格式发送订单，包括电子邮件甚至扫描的\
  \ PDF，他们将无缝提取关键数据并填充您的 Salesforce 对象。\n\n然而，当 Salesforce 宣布推出新的‘Lightning Experience\
  \ 上的 B2B Commerce’产品这一改变游戏规则的消息时，他们面临了一项破坏性挑战。这家 ISV 认识到适应和发展的必要性，转而向我们寻求关于如何应对这一破坏的战略指导的建议。经过深思熟虑后，他们决定转型并拥抱这一新机遇。他们与我们合作，共同踏上了构建一个全新的\
  \ AppExchange 应用的旅程，该应用专为新的订单管理而定制。适应不断发展的 Salesforce 生态系统的这一决定对他们而言是一个关键时刻，并为其客户群带来了新的增长和创新机会。\n\
  \n### 对于成熟 ISV：克服停滞和挑战\n\n成熟的 ISV 可能会遇到需要外部专业知识解决的挑战。PDO 可以通过审计其当前产品、识别痛点、评估和验证产品架构并提供\n\
  \n有意义的建议来克服障碍。在新的见解和解决方案的帮助下，这些 ISV 可以突破停滞，继续其成长和创新的旅程。\n\n*示例：* 其中一家最大的 **OEM（原始设备制造商）**\
  \ 合作伙伴向我们提出了重大挑战。他们的客户入职流程变得痛苦地缓慢，平均耗时惊人的六个月以上。虽然在他们主要服务于企业级客户时，这一延长的入职期尚可管理，但当他们寻求拓展至中型公司细分市场时，它就成为了一道难以逾越的障碍。\n\
  \n他们的核心产品是一款专为跨国组织设计的高效云端人力资源系统，提供有效管理全球劳动力并无缝应对变化优先事项所需的工具。然而，随着他们进军新领域，客户需求的复杂性呈指数级增长。\n\
  \n问题核心在于错综复杂的全球人力资源法规和行业特定定制网络。想象一下：在制造业中运营的比利时、法国和卢森堡的公司的人力资源要求可能像一件精致定制的西装一样各不相同。与此同时，在德国和奥地利运营的制药公司可能需要完全不同的配置。\n\
  \n现在，将这些变化乘以客户所涵盖的众多行业以及他们运营的国家数量，每个国家都有自己独特的一套规则和法规。结果是什么？一个极其复杂的问题，需要精确且可适应的解决方案。\n\
  \n为解决此问题，我们启动了对其现有入职方法的全面审计。审计最终形成了一系列可操作的建议，分为“低垂果实”、“快速胜利”和“主要项目”三类。你可能会认出这种方法，老式的\
  \ 2x2 矩阵，是商学院智慧的基石——而且是的，我有幸在斯坦福大学商学院度过一年，在那里他们说服我，方块可以改变世界。谁能想到，对吧？但嘿，原来，有了正确的视角，即使是最顽固的角落也能带来一些创新解决方案！\n\
  \n作为下一步，我们密切合作优化了他们的 Trialforce 策略。随后，我们开展合作，开发一个量身定制的 Salesforce CLI 插件，以满足他们的特定需求。该插件使他们的非技术顾问能够自动化数据和元数据的配置，完美定制以满足每个新客户的独特需求。\n\
  \n结果堪称变革性。通过精简和自动化其入职流程，他们显著缩短了新客户的入职时间。这种效率提升不仅节省了时间和资源，还使他们能够在中型市场细分领域实现快速增长，再次证明了适应客户群不断变化需求的重要性。\n\
  \n- **适用于所有公司阶段：** 加速开发无论其所处阶段，公司经常面临需要加速开发工作的情况。在这种情况下，与 PDO 合作使他们能够接触到技术精湛的开发团队，可立即启动新的开发流。PDO\
  \ 提供的额外专业知识和能力使公司能够迅速应对新项目并把握市场机会。\n\n*示例：* 在 2023 年酷热的八月，Salesforce 对一群独家 ISV 扔下了一颗炸弹。他们慷慨地提供了进入专注于生成式\
  \ AI 的封闭试点计划的权限，以及在最盛大的会议 Dreamforce 上展示其解决方案的绝佳机会。现在，你可能会想：‘合同的交付日期是不是打错了？’\n\n\
  但是猜猜怎么着？两周后，不可能变成了可能。这段 AI 驱动的演示录像在旧金山的 AppExchange 展示区占据了中心位置。\n\n总之，**产品开发外包商（PDOs）**\
  \ 证明是公司在 AppExchange 产品开发之旅不同阶段不可或缺的合作伙伴。从为初创企业构建 MVP、为中型 ISV 最大化平台能力、帮助成熟 ISV 克服挑战，到为所有阶段加速开发工作，PDO\
  \ 提供量身定制的解决方案和支持，推动公司在竞争激烈的 Salesforce 生态系统中取得成功。\n\n## 兼职首席技术官（fCTO）\n\n在 AppExchange\
  \ 上构建成功的产品需要技术与商业战略的和谐融合。为实现这一目标，拥有专人确保公司的技术决策与其业务目标保持一致不仅有益，而且至关重要。这就是 **首席技术官（CTO）**\
  \ 发挥作用的地方，他是公司技术旅程的驱动力。然而，对于初创企业和小型公司而言，由于财务限制或难以找到理想人选，聘请全职、永久的 CTO 可能会带来挑战。我遇到过太多早期初创企业的\
  \ CEO，在这种情况下，试图从零开始组建内部开发团队、创建软件开发流程、承担产品负责人角色并管理作为 CEO 所带来的所有其他责任。这很少有好结果。\n\n\
  其他人可能会认为把你的主导开发者的头衔改为 CTO 就能解决所有这些需求。我有个坏消息告诉你。虽然你的主导开发者可能是编码高手，但 CTO 的角色远不止开发。它是一个商业角色，尽管处于商业与技术交汇的十字路口。请让你的主导开发者在他们最擅长的领域——开发——上发挥所长。\n\
  \n作为替代方案，你可能想探索聘请 **兼职首席技术官（fCTO）** 的选项，他们可以以兼职咨询的形式提供宝贵的专业知识。对于 AppExchange 公司而言，对\
  \ fCTO 最关键的要求是强大的 AppExchange 产品开发背景、面向业务的思维方式和卓越的人才管理技能。这些经验丰富的技术领导者可以指导你的早期公司使其技术战略与业务目标保持一致。fCTO\
  \ 可以成为 AppExchange 公司竞争世界中成功的催化剂，确保技术成为业务增长的强大推动力。\n\n别误会，全职 CTO 对你的长期成功至关重要。许多\
  \ ISV 专注于产品内部的创新，而错过了真正的创新机会。但如果你预算紧张，现在负担不起全职 CTO，那么拥有扎实 AppExchange 背景的兼职 CTO\
  \ 绝对比在你的高管团队中留一个空位要好。\n\n## 人工智能（AI）：机遇与挑战\n\n![](img/44ed632038957e4c80220676e84c5109_608_0.png)\n\
  \n这本书写于 2023 年，就在我们真正开始看到 **生成式 AI** 世界大规模繁荣之后不久。令人着迷的是，未来阅读这些文字的人将深入了解生成式 AI 繁荣如火如荼的这一时期。这种革命性变化有可能改变历史进程，就像\
  \ 19 世纪早期人工照明成本急剧下降所引发的革命一样。当某项基础性事物的价格显著下降时，其涟漪效应无处不在。经济学家威廉·诺德豪斯探讨了这一概念，他指出在 1800\
  \ 年代，获得相同数量的光照所需花费是我们现在支付的四百倍。光照价格随后的下降不仅将黑夜变为白昼，还使我们能够在自然光无法穿透的重要建筑中生活和工作。同样，AI\
  \ 的出现及其在 AppExchange 产品中的整合，有可能在我们开发和使用应用程序的方式上创造一场地震式转变。这类似于第一代 iPhone 首发的那一刻，它极大地改变了技术和日常生活的格局。在\
  \ iPhone 之前，像 Uber、Deliveroo 或 Instagram 这样的概念似乎难以想象，然而它们今天已成为我们生活中不可或缺的一部分。\n\n\
  如今，ISV 合作伙伴正在积极探索利用 AI 丰富其产品的方式。AI 为应用开发提供了重大机遇，使个性化、自动化和预测分析成为可能，从而创建更智能、更用户友好的界面。然而，将\
  \ AI 整合到 AppExchange 产品中也带来了独特的挑战。例如，为特定用例选择最佳 **大型语言模型（LLMs）** 可能很复杂。此外，当客户为席位许可付费，而\
  \ ISV 为 AI 驱动功能支付按使用量计费时，就会出现定价挑战。还有避免幻觉以创建可靠功能的挑战。\n\n鉴于 AI 领域的快速发展，每周都会出现新的发展，几乎不可能在一本书中涵盖所有这些方面。等到书出版时，信息可能已经过时。然而，这并不意味着我们应该回避拥抱\
  \ AI。相反，我鼓励你将 AI 转型视为\n\n战略合作伙伴关系领域，与专家产品开发外包商合作，如本章前面所述。\n\n顶级 PDO 会密切关注 Salesforce\
  \ 生态系统内的最新 AI 相关技术，以及将其整合到 AppExchange 产品中的各种策略。他们通常有幸被 Salesforce 邀请加入封闭试点项目，并就\
  \ Salesforce 的产品路线图提供见解。与 PDO 合作可以显著提升你的旅程。你可以在专家指导下获得 AI 能力，这些专家已进行了深入的研究与开发，无论是评估不同的大型语言模型（LLMs），还是应对将\
  \ AI 整合到 ISV 产品中的常见挑战。这种合作关系可能使你能够专注于核心优势，同时利用外部 AI 专业知识。\n\n## 成功指标\n\n在我们穿越 *AppExchange\
  \ 成功蓝图* 这一迷宫的过程中，我们挖掘出了构建蓬勃发展的 AppExchange 业务的战略金 nuggets。但，这里有一个价值百万美元的问题：你如何知道自己是否真的成功？这不仅仅是竖起大拇指或拍拍背那么简单，让我们深入到\
  \ **关键绩效指标 (KPIs)** 的世界，这些指标可以作为我们可靠的指南针。\n\n![](img/44ed632038957e4c80220676e84c5109_611_0.png)\n\
  \n对于许多初创企业而言，维护 KPI 最初可能看起来像是一项官僚负担，尤其是在它们专注于产品开发和建立业务时。然而，忽视 KPI 的重要性从长远来看可能是一项代价高昂的错误。这些指标在评估公司绩效、识别改进领域以及展示潜在增长机会方面发挥着关键作用。\n\
  \n投资者，无论是风险投资家还是天使投资人，本质上都是风险厌恶的。他们希望确保在向初创企业投资资本时做出明智的决策。KPI 提供了初创企业进展和成功潜力的具体数据和证据。当潜在投资者评估一家初创企业时，他们可能会询问其随时间的表现、增长轨迹，以及它与所声明业务目标的契合程度。\n\
  \n通过设定明确的 KPI，初创企业可以展示其有效监控和管理业务的能力。这表明它们清楚了解自己的市场、客户获取、客户保留策略和运营效率。这种洞察力为投资者注入信心，因为他们可以衡量初创企业实现目标并产生投资回报的能力。\n\
  \n此外，KPI 有助于初创企业专注于真正重要的事情。它们充当路标，将工作和资源引导到业务最关键的方面。通过定期跟踪和分析 KPI，初创企业可以主动应对挑战并调整策略，以在动态市场中保持竞争力。\n\
  \n此外，建立 KPI 有助于培养问责文化和数据驱动的决策。团队成员可以将自己的工作与公司目标保持一致，并衡量实现目标的进展。这种透明且可衡量的方式能够在团队之间实现更好的沟通和协作，推动整体绩效。\n\
  \n记住彼得·德鲁克的话：“你无法管理你无法衡量的东西。” 现在，让我们深入探讨一些常用的 KPI，它们能揭示你公司成功的表现。\n\n- **月度经常性收入\
  \ (MRR)/年度经常性收入 (ARR)**：这些指标对任何 SaaS 业务，包括 AppExchange 产品，都至关重要。它们提供了收入趋势和未来收入预测的见解。MRR\
  \ 可以进一步细分为新销售、扩张和流失 MRR 等不同组成部分，从而详细了解收入变化。\n- **客户获取成本 (CAC)**：CAC 代表获取新客户的成本。它是通过将总销售和营销成本除以新客户数量计算得出的。通过跟踪\
  \ CAC，企业可以评估营销策略的效率并做出必要的调整。\n- **CAC 回收期**：该指标衡量从客户获得的收入覆盖获取其成本所需的时间。对于早期 SaaS\
  \ 企业而言，确保盈利和可持续性至关重要。\n- **流失率**：这衡量停止使用你产品的客户数量。了解流失率有助于识别产品市场契合度、服务质量等方面的问题。\n\
  - **Burn Multiple**：该指标评估初创企业为产生每增加一美元的 ARR 增长而花费的资金。较低的 Burn Multiple 表明增长更有效率。\n\
  - **毛利率**：毛利率衡量收入与商品销售成本（COGS）之间的差异，表明公司产品或服务的盈利能力。\n- **复合月增长率 (CMGR)**：CMGR 衡量\
  \ MRR 的增长，有助于了解业务增长的速度。\n- **净收入留存率 (NRR)** / **毛收入留存率 (GRR)**：这些指标衡量在给定时期内从现有客户保留的收入，同时考虑流失收入和来自追加销售或升级产生的收入。\n\
  - ** runway**：这衡量公司在当前烧钱速度下在耗尽现金之前可以继续运营的时间。\n\n衡量你的 AppExchange 产品成功与否涉及跟踪与你的业务模式和目标相一致的各种\
  \ KPI。通过关注这些指标，你可以优化资源、做出数据驱动的决策、识别改进领域并最终实现目标。记住，你选择的 KPI 应该随着公司的发展和目标的演变而进行审查和调整。\n\
  \n## 总结\n\n![](img/44ed632038957e4c80220676e84c5109_615_0.png)\n\n在我们旅程的最后一章中，我们拥抱了创新的精髓，确定了其在动态\
  \ AppExchange 市场中作为成功关键因素的作用。我们阐明了与 Salesforce 建立战略关系的意义，强调该平台不仅仅是一个工具，更是你事业中的关键盟友。此外，我们深入探讨了外部专长的力量，强调系统集成商、产品开发外包商和兼职首席技术官如何在\
  \ AppExchange 领域中简化你的航程。\n\nAI 的数字地平线在召唤，呈现出巨大的机遇与固有挑战的双重性。我们探讨了这一主题，为你提供了将 AI 能力整合到\
  \ AppExchange 产品中的潜力理解，确保你始终走在技术进步的最前沿。最后，成功指标的指南针被详细阐述，强调了验证你的策略并指出 AppExchange\
  \ 事业中 ripe for growth 领域的 KPI。\n\n## 让我们收尾\n\n在我们告别旅程之前，让我们花点时间回顾一下我们在途中收集到的见解。我们的冒险分为四个不同的部分，每个部分都为我们了解如何在这一动态环境中蓬勃发展做出了贡献，确保你在旅程的每一步都做好充分准备。\n\
  \n在第一部分，我们开始深入 Salesforce 生态系统，了解其广阔性以及成为 AppExchange 合作伙伴的好处。我们讨论了打造以客户为中心的应用的重要性，这些应用真正解决客户需求并提供价值。\n\
  \n第二部分让我们深入 Salesforce 的技术细节，挖掘 ISV 特定功能，并掌握与外部系统无缝集成，同时将安全放在考虑首位的艺术。你可能会发现这一部分相当技术性，尤其是如果你不是开发者。然而，这使得确保开发团队的每个成员都精通这些材料变得更加重要。\n\
  \n在我们旅程的第三部分，我们专注于有效交付和管理我们的应用。我们探讨了发布管理原则、不同类型的软件版本以及像推送升级这样的工具。客户 onboarding 是一个关键方面，采用引人入胜的体验、演示和清晰说明的策略。我们还涉足运营卓越，以推动客户满意度和收入增长。\n\
  \n最后一部分让我们深入分析与洞察的世界，利用数据的力量优化 AppExchange 列表和用户体验。我们讨论了技术债务的概念以及为安全审查重新提交做好准备的重要性。我们的旅程以关于创新、协作和成功指标的见解告终。\n\
  \n当你踏上自己的旅程时，请记住在 Salesforce AppExchange 生态系统中取得成功需要多方面的方法。不断回顾并应用这些章节中获得的知识，因为你在构建和扩展产品。拥抱以客户为中心、技术熟练和数据驱动决策。保持对安全和质量的敏锐关注。培养创新和协作。这些原则将引导你走向持久成功。\n\
  \n在需要时经常回顾这本书，并确保你记住每个章节的主要概念。最大的风险是你不知道你\n\n\n不知道。现在，读完这本书后，你至少已经了解了构建并成功扩展产品所需成为专家的所有主要领域。请在遇到相关主题的问题时重温具体章节，因为这份资源将在你整个\
  \ Salesforce AppExchange 生态系统之旅中作为你的可靠指南。\n\n让我们花一刻时间想象一下：我蜷缩着笔记本电脑，撰写这些文字，或许啜饮着一杯（可能价格过高）的拿铁，想象着你——没错，就是你，拥有如今卓越\
  \ Salesforce 造诣的你——阅读它们的那一天。而那个时刻是... 现在！\n\n恭喜！给自己一个击掌——或者一块蛋糕，哪个更让你觉得有回报就选哪个。你刚刚学会如何将你巧妙的想法转变为不仅仅是\
  \ Salesforce 应用，而是盈利且可扩展的应用。比组装一把宜家椅子要令人印象深刻一些，对吧？\n\n![](img/44ed632038957e4c80220676e84c5109_618_0.png)\n\
  \n现在，来个小小的坦白：我写这份指南时玩得有点太开心了，还对自己的 Salesforce 笑话哈哈大笑（我知道这是一种小众的幽默感）。如果你阅读时的收获有一半是我写作时的乐趣，那我们就成功了。但嘿，乐趣不必止步于此。想不想聊聊更多技术笑话，或者进行一次关于\
  \ AppExchange 宇宙的更严肃讨论？给 appexchange@jakubstefaniak.com 发封邮件，或在 LinkedIn 上 ping\
  \ 我。\n\n请记住，这并不是结束。我的意思是，这是本书的结尾，但它只是开始。带着你新获得的智慧，我迫不及待想看到你将雕琢出的 AppExchange 精品。逐个应用，席卷世界！\n\
  \n附言。嘿，顺便说一下，如果你喜欢这本书，能否留下点评？也许在它的亚马逊页面上？我知道你超级忙，但这是我的第一本书，我觉得我妈妈会经常刷新那条评论区。所以，如果你喜欢它，我很想听听你的想法。最重要的是，你可以帮助我摆脱那些“为什么只有\
  \ x 条评论，亲爱的？”的餐桌对话。干杯！\n"
