  - **支持客户的本地更改**：这就像允许你的室友重新装饰他们的房间。我们将深入探讨拥抱客户定制和支持本地更改，而不会让你的应用程序变成一幅毕加索画作。

  - **制作电影级演示**：想象一下，你此刻是一名电影导演，你的应用是节目的主角。我们将揭开创建演示视频的秘密，这些视频可能赢得 *奥斯卡* “最佳应用介绍”奖！

  - **提供互动试用体验**：你有没有想过试驾一艘宇宙飞船？好吧，有了 Test Drive 和 Trialforce，我们将学习如何让用户体验驾驶你的应用穿梭于他们的问题星系的刺激感。


  到本章结束时，你将配备导航图表来创建有效的入驻流程，鼓励潜在用户成为你软件之家的全职、快乐居民。


