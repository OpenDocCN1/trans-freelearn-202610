- "## 发布管理\n\n![](img/44ed632038957e4c80220676e84c5109_348_0.png)\n\n问候，勇敢的 Salesforce\
  \ 漫游者！准备再次系上探险靴吗？太好了，因为是时候深入发布管理的深邃神秘森林了。这不是童话森林，而是软件应用大局中至关重要的地貌，确保你的辛勤工作和创造力抵达应有的目的地——终端用户王国。\n\
  \n把发布管理想象成你的可靠向导，安全地引领你跨过开发山脉与繁忙终端用户城市之间的险桥。没有它，我们会坠入软件不一致和混乱的漩涡。听起来不像个好野餐地，对吧？\n\
  \n在我们穿越这片森林时，这里是会探索的地标：\n\n- **发布管理的参天红杉**：理解它们为何在这片地貌中高大而强劲\n- **神秘的版本类型**：如同不同树种，我们将按其独特特征识别它们\n\
  - **推送升级的雷鸣瀑布**：利用其力量确保应用更新顺畅流向用户\n- **最新包版本的稀有植物**：学习如何让用户保持在这片常开的森林部分，避开过时版本枯萎的枝条\n\
  - 最后但同样重要，我们将回答一个根本问题：多久发布和部署一次？\n\n读完本章，你将成为发布管理的熟练护林员，擅长引导软件应用从开发的宁静到终端用户的热闹。拿起你的隐喻地图和指南针，让我们一起踏入发布管理森林！\n\
  \n## 发布管理的揭幕\n\n![](img/44ed632038957e4c80220676e84c5109_350_0.png)\n\n如果你曾体验过披萨配送的精妙舞蹈，你会明白不只是揉面抹酱。发布管理本质上是科技界的披萨配送。它是精心制作你的披萨或软件，并熟练地将其从开发环境的火热熔炉送到终端用户渴望的味蕾，确保它热气腾腾、新鲜且美味诱人。\n\
  \n它关乎精准与时机——确保你的 Marinara 核心软件熟透，配料功能按完美顺序添加，且不会过度使用菠萝虫。万万不可！而且当披萨离开烤箱时并未结束，真正的挑战才开始。想象一下：你的配送司机部署者必须在现场环境中穿梭交通，小心不要摇晃披萨保持完整，并确保奶酪仍在融化、饼底仍酥脆一致的\
  \ UX。\n\n发布管理到底是什么？它是管理、计划、安排和控制软件构建在不同阶段和环境中的流程，包括测试和部署软件发布。简单说，它是将应用从开发环境平稳交付到终端用户手中的艺术。该流程超越单纯代码部署，考虑应用如何被接收和使用，涵盖用户采用、培训和文档等要素。\n\
  \n发布管理对于降低新功能部署风险、维护实时环境完整性同时提供一致 UX 至关重要。它是项目\n\n管理、软件开发和 IT 服务管理原则。其重要性不言而喻，因为它有助于确保软件从概念到客户的顺利过渡。\n\
  \n在 Salesforce ISV 的背景下，发布管理尤为重要，因为你需要在处理包版本、补丁发布、推送升级等的同时，确保客户使用的是应用程序最新且最安全的版本。\n\
  \n在我们掌握发布管理的激动人心之旅中，我们不仅会深入探讨这些方面，还会理解部署与发布之间的细微差别。它们经常被互换使用，但实际上是流程中不同的方面。随着我们攀登得更高，这一区别变得至关重要。\n\
  \n## Salesforce 发布管理中 DevOps 的作用\n\nDevOps 是一种将软件 **开发** (**Dev**) 与 IT **运营** (**Ops**)\
  \ 相结合的理念，在 Salesforce 发布管理中发挥着至关重要的作用。DevOps 的核心在于促进开发人员与运营团队之间更好的沟通、协作和集成，最终实现更可靠、更频繁、更高效的软件发布。\n\
  \n### Salesforce 生态系统中的 DevOps\n\n在 Salesforce 生态系统中，DevOps 对于有效管理发布至关重要，特别是对于 AppExchange\
  \ 应用程序。考虑到多个环境、配置和用户，拥有健全的 DevOps 实践可以简化流程并确保质量和一致性。\n\n### 持续集成和持续交付（CI/CD）\n\n\
  DevOps 的基石是 **持续集成和持续交付（CI/CD）** 原则。CI/CD 涉及自动化应用程序交付过程中的步骤，从初始代码提交到最终发布。在 Salesforce\
  \ 的背景下，这可能意味着自动化代码部署、运行测试和管理环境。\n\nCI/CD 提供了多项优势，例如更快地识别错误或问题、更快的部署，以及能够更频繁、更可靠地发布。\n\
  \n### 协作文化\n\nDevOps 不仅仅是工具和自动化；它还关乎文化。DevOps 文化鼓励开发与运营团队之间的协作和沟通，打破信息孤岛，促进对发布流程的共同拥有。这可以带来团队间更好的理解和可见性、改进的问题解决以及更高质量的发布。\n\
  \n采用 DevOps 方法可以极大地增强 Salesforce 发布管理。它可以帮助组织更频繁地交付更可靠的 AppExchange 应用程序，并且错误更少。通过利用\
  \ DevOps 工具、原则和文化，你可以创建更有效和高效的发布流程，最终为客户带来更好的成果。\n\n## 部署与发布的区别\n\n在引人入胜的 Salesforce\
  \ 和 AppExchange 世界中，理解部署与发布之间的区别对于成功的应用管理至关重要。让我们深入探讨发布管理的这两个方面。\n\n### 部署\n\n好吧，我的爱吃披萨的朋友们，让我们谈谈部署，披萨（读作：软件）世界的无名英雄。想象部署就像小心翼翼地将你精心制作的披萨从披萨铲转移到熊熊燃烧的烤箱中——从暂存到生产，如果你愿意的话。这全关乎精准、灵巧和一点点风采，只是为了让事情更有趣。\n\
  \n现在，部署的行为不仅仅是将我们的比喻披萨从 A 点搬到 B 点。它关乎确保我们的马里纳拉杰作进入烤箱时不会折叠在自己身上或失去任何精心放置的配料（功能），就像确保我们的代码不仅转移到实时环境中，而且运行良好，而不会引发系统范围的番茄酱（代码）灾难。\n\
  \n部署过程通常专注于将新代码或功能引入实时环境的技术方面，确保其按预期运行并且不会破坏现有系统。\n\n在 Salesforce AppExchange 的背景下，部署涉及将新的元数据组件（例如\
  \ Apex 类、自定义对象或 Lightning 组件）添加到你的托管包中，并随后将此更新后的包安装到目标 Salesforce 组织中。该目标组织可能是客户的生产组织或沙盒组织。\n\
  \n### 发布\n\n发布另一方面是一个更广泛的概念。它不仅包括新软件或功能的部署，还包括确保更新被最终用户成功接收和采用所需的一切。这包括用户培训、文档更新、沟通以及任何必要的数据迁移等要素。\n\
  \n在 Salesforce 中，发布通常涉及协调多个相关更改的部署、执行部署后步骤、管理权限和功能可见性，并通过沟通和培训推动用户采用。\n\n那么，这种区别为什么重要？通常，在项目完成的紧迫中，这两个术语被互换使用。然而，理解并保持部署与发布之间的区别对于有效的发布管理至关重要。成功的部署并不保证成功的发布。你可能在技术上无错误地部署了新代码，但如果最终用户没有为更改做好准备，或者新功能没有得到妥善记录，你的发布可能会遇到困难。\n\
  \n最终，这种区别归结为：部署关乎技术；发布关乎人。在我们穿越发布管理的世界时，平衡这两个方面对于成功至关重要。\n\n## 推动发布的稳定性和成本效益\n\n\
  踏入任何初创冒险的早期阶段，发布通常是错综复杂的难题，需要时间和财务投入。我们发现这在 Salesforce AppExchange 生态系统中尤其如此。\n\n\
  ### 为稳定性和降低成本设定目标\n\n一个突出显眼的观察是，成功合作伙伴的部署效率在突破 20+ 客户门槛后陷入停滞。我见过部署周期长达 6 个月的 ISV。这种缓慢的节奏在目标受众局限于对复杂性有胃口的大型企业时可能可以接受，但当中型公司成为市场范围的一部分时，它就变成了一个难以逾越的障碍。\n\
  \n因此，主要目标应该是逐步减少发布时间和成本，同时推动一致性。这是一门艺术和科学，需要从一开始就给予刻意的关注。\n\n### 建立专业服务团队或与系统集成商合作\n\
  \n为了实现这一目标，一种方法是考虑内部建立专业服务团队。这样的团队专注于你的应用程序，可以在简化部署流程方面发挥奇效。\n\n或者，与 **系统集成商（SIs）**\
  \ 建立联盟同样有益。这些组织拥有丰富的经验组合，可以为你提供完善发布流程的见解。我们将在 [第12章](Chapter 12) 中探讨这一选项。\n\n###\
  \ 发布流程中的持续改进——内部反馈循环\n\n但无论你选择内部建设还是外部合作，请记住培养持续改进的文化。发布后，务必收集反馈、衡量时间和成本，并找出差距。\n\
  \n反思以下问题：*上一次发布进行得如何？我们如何降低成本并改进流程？是否有任何需要更多关注或资源的地方？*\n\n目标应该是从每次发布中汲取经验教训，利用这些见解来改进下一次。这种对改进和成本降低的承诺最终将使你能够以高效有效的方式将服务扩展到更广泛的市场细分。\n\
  \n## 发布管理中的有效沟通\n\n将透明度和清晰度视为我们的比喻 GPS 和电话号码组合。它们是让我们的送货员能够在蜿蜒的街道上导航、避开交通堵塞并及时到达客户的工具。同样，它们也让客户能够跟踪披萨的进度并确切知道何时摆桌。\n\
  \n在发布管理的领域，情况也是如此。你可能拥有软件开发史上最精心制作的发布。但如果没有清晰透明的沟通，我们的最终用户可能会在困惑中徘徊。这就像你知道你订了披萨但不知道它何时会到达。令人沮丧，对吧？\n\
  \n### 沟通在发布管理中的作用\n\n\n\n在版本管理中，沟通不仅仅是宣布变更。它是一项战略性工作，旨在确保新功能或变更被终端用户理解、认可并最终有效使用。传达更新背后的“为什么”，以及“是什么”，可以显著促进用户采纳和满意度。此外，沟通有助于设定明确的预期，使用户能够围绕发布计划安排其活动。\n\
  \n## 创建和分享发布说明\n\n发布说明是此沟通流程中不可或缺的一部分。它们提供了发布中包含的更新、错误修复、新功能或改进的详细摘要。它们应明确说明新变更的好处，让用户了解其带来的价值。\n\
  \n写得好的发布说明可作为文档资源，让用户在需要澄清时可以重新查阅。提前在发布前分享这些说明，可让用户有时间了解即将到来的变更并提出问题或表达疑虑（如有）。\n\
  \n## 安排发布并传达计划\n\n重要的不仅仅是“是什么”和“为什么”，还有“何时”。一个规划良好的发布计划，若能有效传达，可在确保平稳过渡方面发挥巨大作用。它使用户能够为发布做好计划并最大限度地减少对其日常运营的干扰。\n\
  \n请确保传达的不仅是发布日期，还包括与发布相关的任何重要时间节点，例如预计停机时间段、任何必要的用户操作截止日期，或新功能培训课程的日期。随着发布日期临近，定期提醒也可能有益。\n\
  \n总之，版本管理中的有效沟通一切都关乎透明度、清晰度和及时性。通过将用户视为发布流程中的合作伙伴并在每一步都让他们了解情况，您可以顺利驾驭版本管理的“水域”，确保所有人获得更好的体验。\n\
  \n## 发布命名规范\n\n![](img/44ed632038957e4c80220676e84c5109_360_0.png)\n\n在版本管理的广阔海洋中，若没有适当的命名规范就启航，就如同没有指南针便冒险前行。明确定义的命名规范有助于指引您的旅程，使您和用户能够跟踪不同的发布并了解它们带来的变更。\n\
  \n## 了解 Salesforce AppExchange 受管包版本控制\n\nSalesforce AppExchange 受管包遵循由主要版本、次要版本和补丁版本组成的三部分版本模型。该模型通常被称为\
  \ **语义化版本控制 (SemVer)**，在软件开发中广泛使用，并为版本命名提供清晰、标准化的方式。让我们更详细地了解一下：\n\n- **主要版本：**\
  \ 版本中的第一个数字表示主要版本。当您进行不兼容的 API 变更或可能影响用户体验或需要用户大幅调整的重大功能变更时，会递增此版本。\n- **次要版本：**\
  \ 第二个数字代表次要版本。这通常反映向后兼容的功能增强。想象一下那些增加价值但不会破坏现有功能的新功能。\n- **补丁版本：** 第三个数字代表补丁版本。当您进行向后兼容的错误修复或不添加新功能也不破坏现有功能的微小变更时，会增加此版本。\n\
  \n通过采用明确定义的命名规范并了解 Salesforce AppExchange 受管包版本控制，您可以有效驾驭不断变化的版本管理格局，确保用户和开发人员之间无缝沟通，并全面了解发布变更。\n\
  \n## 了解版本类型\n\n作为在 Salesforce AppExchange 市场广阔领域中航行的合作伙伴，了解可用的不同类型的包发布是有效版本管理的基础部分。在本节中，我们将探讨完整发布、补丁发布和\
  \ Beta 发布，每种都有其独特的目的、限制和理想使用场景。\n\n### 完整发布\n\n完整发布代表了应用程序的重大进展，涵盖功能上的次要或主要变更，并通常涉及新元数据的添加。每个完整发布都由递增的主要或次要版本号标识。\n\
  \n完整发布允许开发人员添加新组件、删除过时的组件并修改现有元数据，从而促进对应用程序的大规模增强。例如，向您的 AppExchange 应用程序引入新模块或实质性功能可能就需要进行完整发布。\n\
  \n### 补丁发布\n\n另一方面，补丁发布是一种更为细微的更新类型，主要专注于错误修复和不改变应用程序现有功能的微小调整。这些更新通常对于解决发布后发现的漏洞或问题至关重要。\n\
  \n然而，Salesforce 中的补丁发布受某些限制约束。它们不允许包含新元数据，也不允许更改应用程序的 API 或全局类。它们的用途纯粹是提供向后兼容的修复。例如，如果应用程序的现有功能存在影响性能的错误，则部署补丁发布来解决该问题将是适当的做法。\n\
  \n### Beta 发布\n\n最后，Beta 发布在新功能和功能包含在最终完整发布之前充当测试平台。这些包允许进行全面测试和反馈收集，这有助于在开发过程早期识别潜在问题。\n\
  \nBeta 发布可以安装在 scratch orgs、沙盒和 Developer Edition 组织中，提供一个与即将到来的生产环境非常相似的环境。然而，这些优势伴随着一个重大限制：Beta\
  \ 发布无法更新。因此，安装最终完整发布版本的先决条件包括卸载 Beta 发布。这可能需要额外的步骤，例如手动卸载先前版本或沙盒刷新，并将其集成到部署流程中。\n\
  \n此外，从 Beta 到最终发布的过渡还可能涉及在各种测试周期中保留测试数据的挑战。Beta 包固有的限制可能妨碍测试数据的无缝连续性，可能需要在每次测试迭代中重新配置或重新填充。\n\
  \n需要注意的是，在长期存在的客户沙盒中部署 Beta 包可能不是最合适的方法。前面讨论的限制可能使 Beta 包在这些持久环境中不太可行。\n\n考虑到这些因素，最适合充分利用\
  \ Beta 包的环境是在 scratch orgs 中。在这种情况下，集成自动化脚本以快速生成相关测试数据并系统地建立新的 scratch orgs 成为一项不可或缺的投资。通过实施这种方法，可以巧妙地管理与卸载、数据保留以及\
  \ Beta 发布固有限制相关的复杂性。这不仅简化了流程，还增强了 Beta 测试的有效性。需要注意的是，采用此策略时，每次发布新的 Beta 包时都会生成一个新的\
  \ scratch org，确保每次迭代都有一个新鲜且受控的测试环境。\n\n## 应用命名规范\n\n想象您正在发布应用程序的 2.8.4 版本。这里，“2”是主要版本，表示应用程序的主要迭代，“8”代表次要版本，指向特定添加的功能，“4”标记补丁版本，涵盖任何错误修复或微小改进。\n\
  \n通过遵循此版本系统，您就在版本号本身中提供了发布所包含变更的快照。它还使用户能够快速了解更新的影响和性质。\n\n但请记住——虽然数字具有信息性，但它们并非描述性。因此，务必用详细的发布\n\
  \nnotes，提供背景信息和对每个版本所带来的价值的见解。\n\n## 在 AppExchange 上发布你的最新版本\n\n成功驾驭版本管理的变幻并非仅止于创建应用程序的新版本。一个常常需要有意识关注的重要步骤是更新你在\
  \ AppExchange 上的列表。需要明白，仅仅发布新版本并不会自动使其在 AppExchange 上可见。列表需要手动更新，以便客户能够看到并访问你应用程序的最新迭代。\n\
  \n关于管理你的 AppExchange 列表的具体细节，包括如何有效推广新版本，将在更详细地介绍在 *第 8 章*。我们将深入探讨让你的应用程序在 AppExchange\
  \ 市场的拥挤货架中脱颖而出的策略，从撰写引人注目的描述到有效利用截图和客户评价。\n\n## 发现推送升级的力量\n\n![](img/44ed632038957e4c80220676e84c5109_366_0.png)\n\
  \n进入推送升级的领域——应用开发中的高科技无人机。在这个代码和功能不断变化的旋风般的格局中，让客户保持最新状态的感觉就像在高峰时段送披萨一样。但得益于 Salesforce\
  \ 以客户为中心的理念，我们在交付工具箱中拥有推送升级。\n\n想象一下：与其让送货员堵在交通中或在令人困惑的社区中穿行，我们拥有的是无人机。这台神奇的机器在混乱之上高飞，直接快速高效地将热气腾腾的披萨送到客户手中。这就是你的推送升级——一位未来派的快递员，确保你托管包的最新鲜版本被交付并安装到客户的组织中，途中毫无波折。\n\
  \n更重要的是，这架无人机无论客户是否在家都会送达。它只是将披萨放在一个安全、预先确定的位置（好吧——我们可能仍需想办法防止邻居的狗把它当成免费午餐）。推送升级也是如此。它们能够无缝安装最新最好的功能，而不管客户是否正在积极使用其组织。这就是今天的未来升级方式！\n\
  \nSalesforce 本身每年三次使用推送升级发布自己的应用程序，许多 ISV 也成功采用了这种方法。\n\n## 推送升级 – 简要概述\n\n推送升级是\
  \ Salesforce AppExchange 的一项独特功能，旨在为托管包开发者提供一种自动化的机制来向客户推出更新或增强功能。这不仅确保所有客户都在使用你应用程序的最新版本，还免除了他们手动安装新包版本的麻烦。\n\
  \n## 推送升级 API\n\n**推送升级** API 是这一便捷流程背后的推动者。它是让整个操作得以实现的技术，允许开发者以编程方式安排和管理推送升级。\n\
  \nAPI 提供了各种功能来控制和简化推送流程，包括以下内容：\n\n- **安排推送升级**：你可以使用 API 为特定日期和时间安排推送升级作业，确保客户根据你的发布计划接收更新。\n\
  - **批次控制**：API 允许你设置批次大小，确定每次批次中有多少订阅组织将接收升级。这在管理大型客户群时非常有益，能够实现更顺畅的过渡并降低压垮你的资源或客户组织的风险。\n\
  - **状态检查**：API 提供了监控推送作业状态的选项，提供有关有多少组织已升级、哪些正在进行中以及是否出现问题的见解。\n- **版本选择**：推送升级\
  \ API 让你可以选择要推送的包的特定版本。这意味着你可以控制每个客户接收的确切更新。\n- **选择性定位**：推送升级 API 更进一步引入了高级定位选项。你可以根据特定组织需求自定义升级，包括将升级定向到沙盒、生产组织或特定版本。此外，升级可以有选择地推送到特定组织，实现高度个性化的部署。\n\
  \n现在，你可能想知道如何访问这个有价值的推送升级 API。别担心！你可以直接从命令行使用其功能，也可以通过我们之前在 *第 2 章* 中探索过的 Package\
  \ Visualizer 熟悉的界面来导航其功能。掌握这些知识后，你可以自信地驾驭版本管理的领域，知道你有能力向用户提供无缝升级。\n\n## 安全有效地拥抱推送升级\n\
  \nISV 在考虑使用推送升级时犹豫是很常见的。自动向客户传输更新的概念通常会引发不确定感，主要是由于担心可能出现的干扰或不兼容问题。\n\n尽管具有巨大的潜在好处，推送升级在发布流程中往往仍是未被探索的领域。许多客户仍在运行应用程序的旧版本，需要手动更新其组织。这种做法不仅限制了发布流程的有效性，还增加了运营开销。\n\
  \n解决这一困境的一个可行方案是引入客户可编辑的自定义设置，例如推送升级退出设置。默认情况下，这将允许客户自动升级到包的最新版本。然而，它也赋予客户管理员禁用自动升级功能的权力，如果他们希望保持手动控制的话。这里提供了一个在安装后\
  \ Apex 脚本中实现此功能的示例：\n\n```\nglobal class PostInstall implements InstallHandler {\n\
  \    global void onInstall (InstallContext context) {\n        Config__c config\
  \ = Config.getConfig();\n        if(config?.Opt_out_from_Push_Upgrade__c) {\n  \
  \          System.assert(false,\n                'Update blocked by Custom Settings->Config->\
  \ Opt out from Push Upgrade');\n        }\n    }\n}\n```\n\n有了这个解决方案，你可以轻松更新所有允许自动升级的客户组织。另一个解决方案是利用\
  \ *第 2 章* 中讨论的 **功能管理应用 (FMA)**。你可以使用 LMO 到订阅者的功能参数为某些客户禁用推送升级，或者你可以构建一个配置面板，使客户管理员能够利用订阅者到\
  \ LMO 的功能参数退出，类似于使用自定义设置的方法。\n\n这种方法显著降低了 **上市时间 (TTV)**，并通过简化升级流程降低了交付成本。这是一个双赢的局面，为\
  \ ISV 提供更高的效率，同时赋予客户对其升级流程的自主权和控制权。只要规划和执行得当，推送升级确实可以成为 Salesforce ISV 工具箱中的强大工具。\n\
  \n## 了解推送升级失败和监控结果\n\n推送升级是确保你的用户与应用程序的最新功能和改进保持同步的绝佳工具。然而，即使是最强大的系统也难免偶尔出现问题。要有效管理推送升级，你需要了解它们可能失败的原因以及如何监控其结果。\n\
  \n## 推送升级失败的常见原因\n\n在我每周对 100 多个生产组织进行推送升级的经验中，我注意到推送升级失败的几个常见原因。如下所述：\n\n- **超时：**\
  \ 推送升级偶尔会因超时而失败。这发生在 Salesforce 服务器处理请求花费时间过长时。这是由于服务器负载高或执行时间长的复杂流程而可能发生的常见问题。通常，仅仅重试推送升级即可解决此问题。\n\
  - **Salesforce 性能问题：** 有时，Salesforce 的性能会因维护、更新或高使用量而受到影响。这些性能问题会导致推送升级失败。同样，通常在性能改善后简单重试即可实现成功升级。\n\
  - **订阅者组织配置：** 有时，推送升级会因订阅者组织中的配置问题而失败。例如，订阅者可能具有某些设置、权限或自定义项，与升级的组件冲突。\n- **Salesforce\
  \ 限制：** Salesforce 有某些限制以维护性能和完整性。如果推送升级导致组织超出这些限制，升级将失败。例如，Salesforce 仅允许从活动到任何标准对象的查找字段一个。假设你的包包含一个从任务到机会的新自定义查找。在这种情况下，你的包已使用此限制的\
  \ 100%。如果其中一个你的\n\n客户拥有本地自定义查找时，由于此限制，安装将会失败。\n\n## 监控推送升级结果\n\n为了有效管理推送升级，监控其结果至关重要。以下是几种方法：\n\
  \n- **Push Upgrade API**：这是一种以编程方式检索推送作业信息的手段，对于大规模或自动化操作非常有效。\n- **Package Visualizer**：这是一款全面的工具，旨在帮助\
  \ ISV 更高效地管理其应用程序。Package Visualizer 包含一项功能，可让您监控推送升级结果，以及有关您软件包的其他关键信息。\n\n## 管理\n\
