  ## 前言


  我仍然记得多年以前，当我第一次着手创建自己的 AppExchange 应用时。我的脑海中充满了想法，但成为 ISV 合作伙伴的道路并不直接。你必须攀登的知识高山，而那些早期的日子充满了昂贵失误的机会。相信我——我是以艰难的方式学到了一些教训，这让我真正明白了打好基础并了解自己的盲点有多么重要。


  这促使我把在这本指南中学到的所有内容写下来。把它当作你的 playbook——里面满是经验教训、专业提示，以及那些“我希望有人早点告诉我这些”的见解，全部旨在帮助你避开我曾面对的子弹，并从零打造出一个杀手级的
  AppExchange 应用。


  现在，别误会；这并不是关于我 AppExchange 冒险经历的回忆录。它完全关于你——无论你是经验丰富的 Salesforce 开发者、有志成为 AppExchange
  新手、有远见的初创公司创始人，还是渴望在 Salesforce 世界中留下印记的产品经理。我相信，本书中的实用知识和独特见解将使你能够将想法变为现实，并使 Salesforce
  生态系统变得更加充满活力、更具创新性。


  在接下来的章节中，你将踏上一段激动人心的旅程，涵盖从 AppExchange 开发的基础到前沿的 AI 机遇等一切内容。在此过程中，我将分享我个人经历中的故事，突出我所面临的挑战和学到的经验。我希望你会发现这些轶事不仅有趣，而且富有洞察力。


  最后，我衷心希望这本书能成为新一代 AppExchange 成功故事的起点。正如艾萨克·牛顿爵士曾经说过，“*如果我看得更远，那是因为我站在巨人的肩膀上。*”我很幸运能够站在
  Salesforce 生态系统中许多伟大思想家的肩膀上，我渴望将这一特权传递给你。


  好了，做好准备，兴奋起来吧！AppExchange 开发的未来比以往任何时候都更加光明，我无法更激动地欢迎你加入这段精彩的旅程。


  那么，跳进来，享受即将到来的内容吧。阅读愉快，应用开发愉快！


  ## 本书适合谁


  这本书是为多样化的读者群量身打造的，涵盖了在 Salesforce 生态系统中具有不同熟悉程度和专业知识的人士。我的主要目标受众包括以下角色：


  -   **有远见的企业家和初创公司创始人**：如果你有大胆的想法和在 Salesforce 生态系统中创新产品和服务的愿景，这本书可以帮助你进入蓬勃发展的 AppExchange
  市场并将你的愿景变为现实

  -   **在 Heroku 或 AWS 上已有应用的企业家**：如果你是一位正在考虑扩展到 Salesforce AppExchange 的企业主，即使你对
  Salesforce 只有有限的先前经验，这本书也提供了见解和指导，帮助你有效地驾驭该平台

  -   **Salesforce 开发者和架构师**：如果你已经深耕 Salesforce 生态系统，并渴望扩展你在 AppExchange 开发方面的知识和技能，这本书是你宝贵的资源

  -   **产品经理、首席产品官（CPOs）和其他利益相关者**：这个类别中并非每个人都是开发者，但如果你在塑造 AppExchange 应用的方向和战略方面发挥着关键作用，这本书提供了宝贵的见解来为你的决策过程提供信息


  无论你在 Salesforce 生态系统中处于什么位置，这本书都能为你提供帮助。它是你提升专业知识并发挥 Salesforce 平台潜力的门户。


  ## 本书涵盖内容


  第 1 章，*介绍 Salesforce 生态系统和 AppExchange*，是我们旅程的起点，我们将深入 Salesforce 生态系统。在本章中，我们将探索
  Salesforce 的广阔性，发现为 AppExchange 创建应用的好处，评估 Salesforce 平台是否与你的应用想法相符，审查 ISV 合作伙伴关系选项，并权衡成为
  Salesforce 生态系统合作伙伴的优势和责任。


  第 2 章，*成为 AppExchange 合作伙伴*，讨论了 AppExchange 合作伙伴计划的结构和优势，有效利用 AppExchange 合作伙伴社区、关键合作伙伴协议、为
  Salesforce 生态系统制定量身定制的商业计划，以及利用 AppExchange 合作伙伴工具包（合作伙伴业务组织、许可证管理应用、功能管理应用等等），帮助你在
  Salesforce 生态系统中建立成功的合作伙伴关系的基础。


  第 3 章，*设计以客户为中心的应用*，涵盖了创建真正满足客户需求并提供价值的应用的艺术。它强调理解客户痛点、协调价值主张、绘制客户旅程以及选择有效的定价模式。到本章结束时，你将拥有创建以用户为中心的应用所需的知识和见解，这些应用能在
  AppExchange 市场中留下持久印象，帮助客户有效解决问题。


  第 4 章，*探索 Salesforce 平台技术*，是对 Salesforce 中鲜为人知但极具价值的 ISV 专属功能的探索。它揭示


  聚焦于托管包、Dynamic Apex、流程、自定义属性编辑器、Platform Cache 以及 Salesforce Lightning 设计系统，提供对其功能性的见解以及它们如何用于解决
  AppExchange 开发中的特定问题。


  第 5 章，*与外部系统无缝集成*，是一份全面的指南，可为您提供构建稳健桥梁所需的技能和工具，将您的 Salesforce 应用程序连接到外部系统。本章涵盖技术架构、集成模式、Salesforce
  API、Salesforce Connect、Canvas SDK 以及连接的应用，为您提供将应用程序与外部平台无缝集成并自信地驾驭 Salesforce 生态系统的知识。


  第 6 章，*安全审查*，为您提供所需的知识和工具，以应对安全审查流程，保持高安全标准，遵守 Salesforce 安全要求，使用扫描工具，记录误报，并持续改进
  Salesforce 应用程序的安全性。


  第 7 章，*发布管理*，是对 Salesforce 生态系统中管理软件发布的关键方面的探索。它充当开发阶段与终端用户之间的重要桥梁，确保您的软件应用程序平稳、一致地交付。在本章中，我们将深入探讨诸如理解发布管理的核心原则、识别不同类型的软件版本、利用推送升级以实现无缝应用程序更新、保持最新软件包版本以及确定最佳发布和部署软件频率等主题。到本章结束时，您将获得将软件应用程序从开发阶段有效引导到终端用户手中的专业知识。


  *第 8 章*，*欢迎新客户*，是我们学习在 Salesforce 环境中迎接和留住新客户的艺术的地方。我们将探讨打造引人注目的 AppExchange 列表的策略、引人入胜且有趣的入职体验技巧、制作电影级演示的秘诀、提供互动试用体验、提供清晰的安装说明，以及在确保顺利过渡到您软件世界的同时拥抱客户定制。到本章结束时，您将拥有创建有效入职流程的工具，鼓励潜在用户成为您软件之家中的长期居民。


  *第 9 章*，*运营卓越*，踏上穿越 Salesforce 荒野的冒险之旅，以发现客户满意度和收入增长的宝藏。一路上，我们将探讨在追求运营卓越的宝藏过程中，**结账管理应用
  (CMA)** 与 **渠道订单应用 (COA)** 之间的选择。


  *第 10 章*，*利用分析和洞察*，踏上穿越 AppExchange 遗址的考古之旅，以发掘数据中隐藏的智慧，探索 Partner Intelligence、Marketplace
  Analytics 和 App Analytics 以优化 AppExchange 列表并增强用户体验。我们还将深入研究 CRM Analytics，结合内部数据与
  Salesforce 洞察，并学习在通往 AppExchange 成功之路上的数据驱动决策方法。


  *第 11 章*，*管理技术债务*，涵盖技术债务的概念，类似于财务债务，以及它对安全的影响、识别预警信号、管理工具和策略。我们还将学习如何始终为安全审查重新提交做好准备。


  *第 12 章*，*通往成功的道路*，探讨创新作为竞争优势的重要性、与 Salesforce 协作的重要性、外部专业知识的影响、AppExchange 领域中人工智能的机会与挑战，以及在我们穿越
  Salesforce AppExchange 生态系统之旅的 culmination 中，用于验证策略的基本成功指标。


