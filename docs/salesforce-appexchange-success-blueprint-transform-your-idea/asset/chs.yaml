  测试框架，推荐用于测试 LWC。这些测试可对单个组件的功能提供快速反馈，并使在组件级别识别和修复问题变得更容易。

  - **End-to-end tests with UI Test Automation Model (UTAM³):** **End-to-end (E2E)**
  tests simulate the complete user interaction with an application, from start to
