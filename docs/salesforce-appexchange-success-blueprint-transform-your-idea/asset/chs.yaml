  \  - 范围：1>13.108.0.0 - 13.111.255.255\n    2> 62.17.146.0 - 62.17.146.255\n    3>85.222.134.0\
  \ -85.222.134.255\n\n\n\n图 6.2：有关测试环境中遇到问题的电子邮件截图，强调了需要关注和解决\n\n## 文档\n\n![](img/44ed632038957e4c80220676e84c5109_299_0.png)\n\
  \n接下来是文档。这相当于你的补水策略。你会不带水瓶去跑马拉松吗？一份文档完善的应用可确保你用重要信息为评审者解渴，帮助他们更好地理解你的应用。准备以下文档：\n\
  \n- **应用说明**：撰写一份全面的应用说明，帮助评审者了解其目的和功能。\n- **解决方案架构**：提供应用的概述，包括 Salesforce 评审团队应了解的有关解决方案和架构的任何相关信息。\n\
  - **用例文档**：概述应用的主要用例，重点说明用户如何与之交互。该文档应引导评审者了解应用的功能并帮助他们理解其工作原理。\n\nSalesforce 不为这些文档格式提供具体的模板或要求。相反，建议你遵循行业标准。你的\
  \ Salesforce 架构师应指导你完成此流程。如果你发现记录架构具有挑战性，这可能表明你的设计能力存在差距。在这种情况下，建议与 **产品开发外包商 (PDO)**\
  \ 合作伙伴合作，以避免在应用开发阶段出现可能代价高昂的错误。我们将在 *第 12 章* 中更详细地探讨这一选项。\n\n准备充分的文档使评审者能够全面了解你的应用及其架构，确保评审过程高效。\n\
  \n## 静态代码分析结果\n\n把静态代码分析结果想象成你的能量胶。就像这些能量胶提供即时能量提升一样，你的静态代码分析结果可立即洞察应用代码的性能及其安全态势。使用扫描器自行审查以识别潜在漏洞并改善应用的安全性。Salesforce\
  \ 推荐以下四种扫描器：\n\n- **Salesforce Code Analyzer**³：使用多个规则引擎扫描你的代码，包括 Apex、Visualforce、JavaScript\
  \ 和 TypeScript。它可以集成到你的 **持续集成 (CI)** 流程中以定期监控代码健康状况。由 Salesforce CLI 提供支持，此插件是安全评审流程的强制性要求。**Security**\
  \ 类别中的任何发现都应解决或记录为误报。\n3 https://developer.salesforce.com/docs/atlas.en-us.packagingGuide.meta/packagingGuide/security_review_code_analyzer_scan.htm\n\
  - **Checkmarx**：扫描托管在平台上的解决方案，包括 Apex 代码、Visualforce 元素和 Lightning 组件。截至 2023 年，我撰写本书时，它是安全评审流程的强制性组成部分。因此，任何发现都应解决或记为误报。展望未来，Salesforce\
  \ Code Analyzer 完全取代其角色是完全可能的。\n- **Chimera**：将最佳开源扫描技术集成到一项服务中，由 Heroku 提供支持。如果你的解决方案的部分位于你控制的另一平台上，请使用。如果你的解决方案连接到你不控制的外部端点，请改用\
  \ Burp Suite 或 **OWASP Zed Attack Proxy (OWASP ZAP)** 而不是 Chimera。\n- **ZAP**：由\
  \ OWASP 创建的免费在线扫描器，需要安装在本地系统上。如果你的解决方案的一部分部署在你不控制的域上，请使用。\n\n这些扫描器帮助你识别和解决潜在漏洞，确保应用更安全，安全评审流程更顺畅。\n\
