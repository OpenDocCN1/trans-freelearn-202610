  \n## 利用客户沙盒中的早期发布\n\nSalesforce 的沙盒环境，结合诸如 Push Upgrade 之类的工具，为 ISV 提供了完善 AppExchange\
  \ 发布的重要机会。在客户沙盒中采用早期发布可实现简化的发布流程，确保您的 AppExchange 产品质量上乘且无错误。此策略不仅确保最高质量的发布，还能让客户在产品投入生产前有充足时间熟悉更新。Salesforce\
  \ 的沙盒、推送升级和全面的发布说明构成了此流程的理想框架。\n\n早期发布策略意味着在生产发布之前，在受控环境中引入新的 AppExchange 版本。其优势包括以下内容：\n\
  \n- **收集有价值的反馈：** 客户沙盒可作为收集您应用增强功能第一手反馈的平台\n- **培训客户：** 在正式发布之前，客户可获得对新版本的使用实践经验\n\
  - **降低风险**：突出并解决内部测试期间可能被忽略的问题\n\n为了优化客户沙盒中的早期发布，请遵循以下准则：\n\n- **先在自己的环境中测试：** 始终在沙盒或\
  \ scratch org 中测试新版本，以确保功能和性能。\n- **提供详细的发布说明：** 为客户提供新功能、错误修复和其他更改的清晰概述。\n- **提前沟通沙盒升级日期：**\
  \ 提前通知客户即将进行的沙盒升级，让他们有机会相应规划并确保顺利过渡。此外，考虑为需要更多时间的客户提供退出选项。\n- **提供培训资源：** 为客户提供视频教程、文档或网络研讨会，帮助他们使用新版本。\n\
  - **促进开放沟通：** 保持客户表达疑虑或反馈的渠道，强化应用质量和客户信任。\n\n虽然客户沙盒是获取早期反馈的好地方，但不应将其视为内部 **质量保证（QA）**\
  \ 流程的替代品。好吧——别因为我说了显而易见的话就扔番茄，但我必须说出来：您的客户不是免费的 QA。他们信任您的品牌并期望一定的质量水平。在将任何内容推送到他们的环境之前，请确保您已尽职测试。正在寻找切实可行的实施方法吗？您的合作伙伴\
  \ Salesforce 以其强大的沙盒环境、全面的发布说明和其他创新工具树立了优秀典范——它真正体现了此流程应如何执行。\n\n## 确保客户使用最新软件包版本\n\
  \n在 Salesforce AppExchange 应用开发和发布管理的领域中，存在一条黄金法则：“始终确保您的客户使用您应用程序的最新版本。” 这不仅仅是一项建议，而是维护应用完整性、提供一致的用户体验和最大限度降低安全风险的关键方面。\n\
  \nPush upgrades，如前所述，是轻松实施此规则的宝贵工具。通过自动化将更新直接交付到客户组织的过程，push upgrades 免除了客户手动安装新软件包版本的责任。这不仅确保所有客户都在使用您应用程序最新且最安全的版本，还通过消除手动更新的麻烦来提升整体客户体验。\n\
  \n## 最新版本的重要性\n\n但为什么客户使用您应用程序的最新版本如此重要呢？原因有很多，如下所示：\n\n- **增强安全性**：您的应用程序的每个新版本理想情况下都应包含最新的安全补丁和修复。通过使用最新版本，客户可确保获得最高水平的安全性。\n\
  - **新功能和改进：** 您应用的最新版本将包含您辛苦开发的所有新功能、增强功能和性能改进。确保客户使用最新版本可让他们受益于这些更新和增强。\n- **降低支持复杂性：**\
  \ 让所有客户使用同一版本可简化提供支持的任务。这种统一性消除了为多个版本维护文档的需求，并使支持团队能够专注于当前问题，而非处理与旧版本相关的问题。\n- **合规性：**\
  \ 对于合规性至关重要的行业和应用，使用最新版本可能至关重要。更新的版本将符合最新的监管变化，从而保护您和您的客户。\n\n因此，黄金法则不仅仅是最佳实践，更是维护应用完整性、提供卓越用户体验并培养客户信任的基本策略。推送升级和其他发布管理策略的使用对于您应用的成功实施至关重要。\n\
  \n## 潜在陷阱及其补救措施\n\n![](img/44ed632038957e4c80220676e84c5109_378_0.png)\n\n您已将烤箱调至最大火力，正在制作热气腾腾、美味的披萨——您应用程序的最新发布。但问题是：并非每个人都在品尝您烹饪杰作最新、最美味的版本。\n\
  \n这种在充满披萨的 AppExchange 应用开发和发布管理世界中的情况，可以像向仍在吃上周剩菜的人递上一份热气腾腾的披萨。\n\n这并不是最有吸引力的用餐体验，如果不能及早发现，它可能会变成厨房噩梦。\n\
  \n这个麻烦制造者是组织经常面临的众多挑战之一：管理使用旧版本应用程序的客户。这就像试图说服某人，他们订购并一直在吃的披萨不如您刚从烤箱取出的披萨好。忽视这个问题就像把披萨留在烤箱里太久——它可能会滚雪球般变成烧焦的一团，不仅令人心碎，而且清理起来既昂贵又痛苦。\n\
  \n## 使用不同旧版本的客户\n\n维护众多版本的应用程序非常耗时且成本高昂。单个关键错误可能需要构建多个补丁、维护存储库中的各种分支并协调复杂的客户沟通。此外，客户通常由于担心破坏性更改以及希望控制升级时间表——通常是为了培训其终端用户——而抵制推送升级。此问题可分为两个类别——技术性和行为性。\n\
  \n## 技术解决方案 – 将部署与发布分离\n\n关键在于区分部署和发布。部署涉及将代码和配置从一个环境移动到另一个环境，而发布意味着使代码和配置可供用户访问。虽然发布依赖于部署，但完全可以在不发布的情况下进行部署，通过在用户准备好使用之前“隐藏”这些功能来实现。\n\
  \n\n\n这种分离迫使团队思考如何在不影响系统的前提下部署功能，从而促进良好的设计、可逆性以及变更的受控影响。本质上，它关乎“减少每次变更的爆炸半径”，这是在团队内部培育\
  \ DevOps 的关键能力。\n\n此外，请考虑使用 FMA 增强 **许可证管理应用 (LMA)**，其在 [第2章](Chapter 2) 中有描述。功能参数在你的打包组织中以\
  \ Metadata API 类型表示，在订阅者的组织中则以自定义对象的记录形式存在。你可以在代码中引用这些值，方式与引用客户组织中的任何其他值类似。\n\n\
  ## 行为解决方案 – 主动管理期望\n\n新客户入职的一部分应包括管理他们对全自动发布流程的期望。这一挑战类似于新系统和技术的采用。如果我们能通过展示软件的稳定性和可预测性来缓解自动发布新版本的恐惧，使用最新版本的优势应能推动客户朝正确方向发展。\n\
  \n请记住，这不是权宜之计，而是一项战略转型，应提前规划并以切合实际的时间表告知所有客户。根据我的咨询经验，受此问题影响的中型 ISV，视使用旧版本客户的数量而定，平均需要\
  \ 2–4 年的时间来解决此问题。最好从一开始就做好。\n\n## 解决此问题的益处\n\n通过直面这个问题，你大幅缩小了工程团队需要维护以及客户服务团队需要支持的工作范围。理想情况下，任何应用只需维护两个版本：一个稳定版（目前所有客户都在使用）和一个新构建版（等待审批）。这是提高发布频率的重要一步。\n\
  \n该策略还将改善多个 DevOps **关键绩效指标 (KPIs)**，例如前置时间（从代码提交到代码部署）、部署频率（到生产环境）、**平均恢复时间** 或\
  \ **MTTR**（从生产故障开始计算）以及发布经理的工作量。\n\n总之，预先解决发布管理中的潜在陷阱，尤其是在处理旧版本时，不仅能简化你的运营，还能培养客户的信任感，增强他们对你交付无缝更新并维护应用完整性的信心。\n\
  \n## 合同条款和支持费用\n\n在努力让客户使用软件最新版本时，一个需要考虑的重要因素是从一开始就管理期望，而这可以通过你与他们签订的合同中的条款和条件来促进。\n\
  \n## 在合同中包含升级条款\n\n在 onboarding 新客户时，建议在协议中加入条款，声明客户同意自动推送升级。该条款确保你的客户知晓他们将在最新版本可用时立即收到应用的最新版本。\n\
  \n此类条款可发挥以下两个主要作用：\n\n- 它明确了客户安装的软件将与最新功能和安全补丁保持同步的期望。\n- 它允许你仅维护软件的最新版本，减少支持多个旧版本带来的开销和成本。\n\
  \n## 对旧版本收取额外支持费用\n\n即使有合同条款，也可能出现客户犹豫或直接拒绝升级到软件最新版本的情况。他们可能更喜欢坚持使用旧的、熟悉的版本。在这种情况下，为弥补支持多个旧版本所带来的额外支持和维护成本，你可以对这些旧版本的支持收取额外费用。\n\
  \n这种做法的理由是为了覆盖维护和支持软件多个旧版本相关的额外成本。虽然尊重客户的选择至关重要，但确保组织资源得到最优利用同样重要。\n\n从一开始就制定这些规定，更容易管理期望并确保客户使用的是最新、最安全且功能最丰富的应用版本。不仅该策略有助于为客户提供更好的服务，还能显著降低支持和维护多个旧版本相关的复杂性和成本。\n\
  \n## 证明支持成本 – 财务计算\n\n当面临为特定客户维护专用版本而产生的额外支持成本时，清楚了解该财务负担的状况至关重要。这就像走钢丝，平衡是关键。你希望为客户提供最佳服务，但不能以牺牲自己的生存为代价。\n\
  \n在大多数中型组织中，计算这些数字的任务属于你的 **首席技术官 (CTO)** 和 **首席财务官 (CFO)** 的职责范围。他们应能够共同核算这些数字，在技术影响与财务现实之间取得平衡。\n\
  \n对于在小型初创公司中的你们来说，你的“CTO”实际上可能只是名片上头衔响亮的首席开发人员，不用担心。随时可以聘请外部专家来帮助进行这些计算。他们能够基于你的开发成本和软件开发的典型生命周期提供公正的视角。我将在\
  \ *第12章* 中向你展示一些选项。\n\n无论你如何得出这个数字，目标都保持不变。这个数字将成为你的业务方案的支柱。它会在向客户解释为何使用应用最新版本符合他们的最佳利益（也是你的利益）时，为你提供坚实的立足点。这就像在说，“相信我，我已经算过了！”。谁能反驳呢？\n\
  \n## 使用 LMA 监控你的软件包版本\n\n正如你在 *第2章* 中已学到的，LMA 是一款功能强大的 Salesforce 工具，允许 ISV 管理其\
  \ AppExchange 软件包的线索、许可证和使用情况。在本节中，我们将重新审视 LMA，并重点介绍其用于监控客户使用的软件包不同版本的应用。\n\n##\
  \ 深入了解 LMA\n\nLMA 不仅允许你管理许可证；它还提供有关你的 AppExchange 软件包部署和使用的关键实时洞察。这些数据包括已安装的软件包版本、安装所在的\
  \ Salesforce 组织类型（生产或沙盒）以及许可证状态。\n\n这些洞察对于确定有多少客户正在使用软件包的特定旧版本至关重要。当你需要就功能增强、弃用或针对特定版本的错误修复做出决策时，这些知识非常宝贵。\n\
  \n## 跟踪软件包版本\n\n默认情况下，每当客户安装或升级你的软件包时，Salesforce 都会在你的 **合作伙伴业务组织 (PBO)** 中填充 LMA\
  \ 记录。这一自动化流程使你能够准确监控客户群中正在使用的软件包版本。\n\n你可以在 PBO 内的 LMA 中使用标准的 Salesforce 报表工具创建自定义报表。通过在报表中添加线索或账户等详细信息，你可以确定客户安装的软件包版本，无论是在试用组织还是生产组织中。\n\
  \n为了获得全面的洞察，请考虑通过按 **sfLma__Package__c** 字段筛选为每个软件包创建不同的报表。然后你可以将这些报表汇总到统一的仪表板中，从而获得所有软件包使用情况的综合视图：\n\
