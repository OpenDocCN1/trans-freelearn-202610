  ## 利用 AppExchange 合作伙伴工具包


  作为 AppExchange 合作伙伴，拥有合适的工具对成功导航您的旅程至关重要。正如经验丰富的冒险家不会没有可靠的指南针、结实的靴子和装满物资的背包就进入荒野，您也不希望在没有自己的工具集的情况下深入
  AppExchange 市场这个动态的格局。


  在本节中，我们将揭开 AppExchange 合作伙伴工具包的面纱，这是一套旨在赋能像您这样的合作伙伴的资源。其目的是让您熟悉可用的关键工具，每个工具都有其独特用途，帮助您简化运营、管理客户并有效部署您的应用程序。


  掌握了这些工具的知识后，您将能够充分装备自己，攀登 AppExchange 生态系统的顶峰。那么，让我们踏上这段激动人心的探险之旅，发现 AppExchange
  合作伙伴工具包吧。


  ## PBO 功能与能力


  亲爱的读者，欢迎登上 PBO 的神奇神秘之旅，您的专属 Salesforce 命令中心，在这里管理业务运营的梦想成真。无需掐自己——这是真实的，现在是时候探索
  PBO 的功能了。


  您的 PBO 是多功能的得力助手，准备执行以下操作：


  - 使用 Salesforce CRM 应用吸引新客户

  - 使用 **Developer Hub (Dev Hub)** 高效管理 scratch org 和第二代托管包

  - 使用 Environment Hub 创建测试组织

  - 使用 **License Management App (LMA)** 控制线索和许可证

  - 使用 **Feature Management App (FMA)** 有效管理应用程序功能

  - 使用 **Channel Order App (COA)** 轻松搞定订单提交

  - 使用 Checkout 无缝管理付款

  - 成为客户需要的超级英雄，使用 Subscriber Support Console


  ## Environment Hub – 您用于应用测试和打包的秘密实验室


  ![](img/44ed632038957e4c80220676e84c5109_105_0.png)


  想象一下：您是一位疯狂科学家（以最可爱的方式，当然）在调配完美的 AppExchange 秘药。您的实验室？Environment Hub。在这里，您可以通过创建测试组织、简化打包、促进协作以及跟踪所有实验来完善应用的配方。让我们深入了解您这个奇妙实验室的好处。


  以下是使用 Environment Hub 的一些好处：


  - **轻松创建测试组织：** 就像主厨测试不同食材一样，Environment Hub 允许您为各种 Salesforce 版本和配置制作测试组织。这可确保您的应用在落地的每个厨房（咳，环境）中都完全兼容并发挥最佳性能。

  - **简化应用打包：** 无论是您的秘密酱料还是应用打包，一致性都是关键。Environment Hub 有助于确保您的应用在各环境中统一打包，使部署和分发变得轻而易举。

  - **改善协作：** 烹饪总是有朋友一起更有趣。Environment Hub 允许您与团队成员共享环境，使测试过程成为协作且高效的努力。您将比舒芙蕾升起的速度更快地识别和解决问题。

  - **集中跟踪：** 使用 Environment Hub 对所有环境的集中视图来保持实验室井然有序。轻松跟踪创建日期、版本和到期日期等重要信息，确保您的环境保持最新并符合
  Salesforce 要求。


  ## 访问 Environment Hub – 找到通往实验室的路


  准备好戴上实验室外套和护目镜了吗？以下是访问 Environment Hub 的方法：


  - 1. 登录您的 PBO。

  - 2. 单击左上角的 **App Launcher** 图标。

  - 3. 搜索 **Environment Hub** 并从搜索结果中选择它。


  现在您已经找到了通往这个秘密实验室的路，是时候发挥您内心的疯狂科学家精神开始实验了。


  ## LMA – 您应用许可证的私人保镖


  ![](img/44ed632038957e4c80220676e84c5109_108_0.png)


  您将成为繁忙 AppExchange 街上独家俱乐部（您的应用）的主人。LMA 是您值得信赖的保镖，跟踪所有进入和离开您场所的客人（许可证）。在本节中，我们将了解将
  LMA 作为保镖的好处，带您参观 **License Management Org (LMO)**，并解释 LMO 与 PBO 之间的关系。


  ## LMA 概述


  LMA 旨在控制您俱乐部的客人名单（许可证），使用 LMA，您可以执行以下操作：


  - 1. 监控和管理您的客户群，包括试访客户和拥有付费访问权限的 VIP。

  - 2. 通过像天鹅绒绳一样启用或禁用许可证来控制客人名单。

  - 3. 跟踪客户出席情况和应用受欢迎程度。

  - 4. 使用 Subscriber Support Console 访问客户组织以进行支持目的。


  LMA 包含三个自定义对象：Package、Package Version 和 License。Package 对象作为基础实体，涵盖所有 LMA 数据。每个
  Package 对象可以包含多个 Package Versions，而每个 Package Version 又可以与多个 License 相关联。每个 License
  直接对应一个 Lead。值得注意的是，当 Lead 手动转换为 Account 和 Contact 时，相关 License 会无缝链接到新转换的记录。以下 **实体关系图
  (ERD)** 提供了自定义和标准 Salesforce 对象之间这些错综复杂连接的可视化表示：


  ![](img/44ed632038957e4c80220676e84c5109_110_0.png)


  图 2.2：LMA 系统实体及其关系的实体关系图


  ## LMO


  LMO 就像您 Salesforce 组织的专属后台区域，您可以在此跟踪在 Salesforce AppExchange 上安装您托管包的所有 Salesforce
  用户。每当用户安装或卸载您的包时，LMO 都会收到一条线索记录，就像每个客人的一张签名。LMO 跟踪在 Salesforce AppExchange 上上传的每个包，可以是安装了来自
  AppExchange 的免费 LMA 的任何 Salesforce Enterprise 或 Unlimited 组织。


  最佳选择是在您的 PBO 中安装 LMO。这意味着您的 PBO 充当与您的应用安装相关的所有许可证信息的中央存储库，使所有内容在幕后井然有序。


  ## 用于管理应用功能的 FMA


  您可以将 FMA 视为一位准备为俱乐部每位客人编排难忘体验的指挥家。我们将探讨核心概念、用例以及两个 FMA 参数：LMO-to-Subscriber 功能参数和
  Subscriber-to-LMO 功能参数。


  ## 了解 FMA


  FMA 不是必须使用的，但它可以成为您应用的幕后推手，为每个客户编排功能和功能的完美融合。FMA 建立在 LMA 之上，允许您通过控制用户看到的内容以及他们与应用的交互方式来微调
  **用户体验 (UX)**。将 FMA 视为您应用交响乐的指挥，引导每一个音符创造和谐的体验。


  以下是实体关系图，说明了 FMA 中各种实体之间的关系：


  ![](img/44ed632038957e4c80220676e84c5109_111_0.png)


  图 2.3：FMA 实体及其关系的实体关系图


  ## FMA 用例


  FMA 可以演奏各种曲调来满足您客人的偏好。

  以下是一些示例：


  - **Freemium 模式：** 根据客户拥有付费或免费许可证类型来自定义功能

  - **试点测试：** 在不影响当前用户的情况下，将新功能发布给选定的客户群进行测试

  - **简化开发：** 通过使用 FMA 管理多个应用程序，减少开发时间和开销，并战略性地调整功能以利用现有代码库


  ## 使用 LMO-to-Subscriber 功能参数启用和禁用功能


  LMO-to-Subscriber 功能参数就像指挥家的魔杖，只需轻轻一挥即可启用或禁用功能。这些参数在您这边可写，对订阅者只读，可用于控制对某些功能的访问或设置资源使用限制。想提供新功能的一瞥吗？没问题！为其启用有限的试用期并观看兴奋的展开。只需在您的
  LMO 中更新相关功能参数，让魔术在您的代码中发生即可。


  ## 使用 Subscriber-to-LMO 功能参数跟踪偏好和激活指标


  Subscriber-to-LMO 功能参数是指挥家细心的耳朵，倾听订阅者的功能激活偏好。通过由订阅者分配并发送到您 LMO 的值，您可以收集洞察并根据他们的喜好调整性能。只需使用
  Apex 代码在订阅者的组织中更新功能参数，您就可以开始了。




  ## FMA 考虑事项


  设计 FMA 策略时，需要牢记以下几点：


  - 使用 FMA 无法隐藏或显示完全受管理的包。但是，您可以提供一个 **号召性用语 (CTA)** 让用户访问功能。

  - 测试可能具有挑战性，因为没有测试 LMO，且文档可能不明确。开发人员需要对打包环境进行暗启动以进行测试。

  - 制定功能策略时，请牢记每个托管包 200 个功能的限制。

  - 仅有三种 FMA 标志类型可用：**布尔**、**整数** 和 **日期**。

  - 您可以在 LMO 中手动调整功能参数。但是，如果您的解决方案在安装后需要为付费客户更改许多功能参数的默认设置，那么自动化此过程可能是一个好主意。考虑在 License
  对象上设置记录触发流以使其更顺畅。


  ## 解锁 PBO 的全部潜力


  正如您所知，您的 PBO 是一个标准的 Salesforce 组织，这意味着它可以通过本地开发或安装托管包来定制和扩展以满足您的特定需求。为了帮助您释放 PBO
  的全部潜力，让我们讨论扩展它的三种主要方式：安装 AppExchange 应用（通用或专门针对 ISV，如 Package Visualizer）、使用开源项目（如
  ISV Cockpit）或自定义开发。


  ## Package Visualizer


  由 Salesforce Labs 创建的 Package Visualizer¹ 应用是一个免费的托管包，通过为您提供便捷的方式查看您的包、版本继承关系和订阅者数据来改善您的
  AppExchange 体验。您可以直接从 AppExchange 安装它。凭借与 LMA 的无缝集成，Package Visualizer 可让您轻松高效地管理应用。此外，Package
  Visualizer 简化了获取包使用详细日志的过程。它提供有价值的见解，使包开发和管理中的决策更具依据。我们将在 *第 10 章* 进一步探讨此内容。


  1 https://appexchange.salesforce.com/appxListingDetail?listingId=a0N4V0000FNBc0UAH


  Package Visualizer 应用采用拆分视图设计，简化了导航，让您以图形方式探索包详情、版本和订阅者。借助升级计划功能，高效规划和执行升级可确保您的客户始终能够访问应用的最新版本。


  ## Salesforce ISV Cockpit


  Salesforce ISV Cockpit² 应用是一个开源的原生 Salesforce 应用，可扩展您 PBO 中 LMA 的功能。它允许您监控应用的健康状况并为遇到错误的订阅者提供主动支持。当托管包中发生错误时，您的应用可以向指定的电子邮件地址发送错误通知。ISV
  Cockpit 通过接收和解析这些电子邮件来利用此功能。通过将这些信息与 LMA 的数据结合，ISV Cockpit 应用可以准确地将每个传入错误分配给客户账户、包、包版本和许可证。此外，它还会提取有关错误类型和位置的信息。


  2 [https://github.com/rsoesemann/salesforce-isv-cockpit](https://github.com/rsoesemann/salesforce-isv-cockpit)


  所有这些数据都存储在单个自定义对象中，便于报告和创建复杂的支持工作流。


  ## 自定义开发


  使用 PBO 的一个重要优势是灵活地定制和扩展其功能。在您的 PBO 中，一切都建立在 Salesforce 对象之上，包括标准对象（如 Accounts、Leads
  和 Contacts）以及与 LMA 相关的自定义对象（如 Licenses、Packages 和 Package Versions）。这种灵活性使您能够创建支持业务目标的定制。


  让我们看两个本地定制的示例，这些示例可以改善您的客户保留和销售流程。


  ## 在许可证到期前提醒销售代表


  为确保客户的许可证及时续订并防止潜在损失，您可以设置一个流程，在许可证到期前自动向团队中的销售代表发送电子邮件。操作如下：


  - 创建通知的电子邮件模板。

  - 使用 Salesforce Flow 的 **获取记录** 元素获取即将到期的许可证。设置条件以在到期日期前指定足够的时间来讨论续订选项。

  - 在流程中使用 **发送电子邮件** 元素发送电子邮件通知。在此，选择第一步中创建的电子邮件模板并指定销售代表或团队成员作为收件人。

  - 激活流程以开始在许可证到期前通知销售代表。


  ## 在产品被卸载时通知客户保留专员


  了解客户卸载产品的原因可以帮助改进产品或恢复业务关系。通过设置另一个流程，您可以在产品被卸载时通知团队中的客户保留专员。操作如下：


  - 1. 创建通知的电子邮件模板。

  - 2. 在 Salesforce Flow 中，创建一个新的记录触发流。为触发器选择 **记录已更新** 选项。指定产品对象并设置条件，当 **许可证状态**
  字段等于 **已卸载** 时触发流程。

  - 3. 在流程生成器中，添加 **发送电子邮件** 操作。对于此操作，选择第一步中创建的电子邮件模板并指定客户保留专员作为收件人。

  - 4. 保存并激活您的流程。现在，每当产品被卸载时，客户保留专员将自动收到通知。


  许多 ISV 主要专注于构建托管包，但经常忽视定制 PBO 以支持其业务目标的潜力。通过利用 Salesforce 对象的强大功能并结合 AppExchange
  应用、开源解决方案和自定义开发，您可以创建功能强大、灵活且符合特定需求的 PBO。因此，您将更好地推动更好的客户体验并改进业务流程。不要重蹈他人的覆辙；利用 Salesforce
  提供的定制机会，最大化 PBO 的潜力。


