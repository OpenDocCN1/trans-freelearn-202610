    # Technical architecture


    Embarking on the journey of building an application in collaboration with Salesforce
    can feel a bit like standing at the crossroads of a grand metropolis. You have
    two main avenues to start from, each leading to a unique type of application.


    The first avenue leads to native apps, which are primarily built within the Salesforce
    ecosystem and do not integrate with external systems. The second is the route
    to composite apps, which are designed to integrate seamlessly with other systems
    beyond Salesforce.


    These avenues are distinguished by the amount of Salesforce technology employed
    in the construction of the application. However, it’s worth noting that these
    paths aren’t strictly linear. Sometimes, partners find themselves transitioning
    from native to composite applications and vice versa, showing that these avenues
    may intersect and cross over time.'
