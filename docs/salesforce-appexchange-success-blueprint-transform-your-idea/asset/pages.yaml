- pgno: 109
  md: '# Overview of the LMA


    The LMA is designed to keep your club’s guest list (licenses) in check, and with
    the LMA, you can do the following:


    +   1. Monitor and manage your clientele, including those on trial visits and
    VIPs with paid access.

    +   2. Control the guest list by enabling or disabling licenses like a velvet
    rope.

    +   3. Track customer attendance and app popularity.

    +   4. Access customer orgs for support purposes using the Subscriber Support
    Console.


    The LMA incorporates three custom objects: Package, Package Version, and License.
    The Package object serves as the foundational entity, encompassing all LMA data.
    Each Package object can encompass multiple Package Versions, which in turn can
    be associated with numerous Licenses. Every License corresponds directly to a
    single Lead. Notably, when a Lead undergoes manual conversion into an Account
    and Contact, the associated License seamlessly links to the newly converted records.
    The following **entity relationship diagram (ERD)** provides a visual representation
    of these intricate connections between custom and standard Salesforce objects:'
  merge: -1
  img_proc: true
- pgno: 110
  md: '![](img/44ed632038957e4c80220676e84c5109_110_0.png)


    Figure 2.2: Entity relationship diagram of LMA system entities and their relationships


    # The LMO


    The LMO is like the exclusive backstage area of your Salesforce organization,
    where you can track all Salesforce users that install your managed package on
    Salesforce AppExchange. Whenever a user installs or uninstalls your package, the
    LMO gets notified with a lead record, like an autograph from each guest. The LMO
    tracks each package uploaded on Salesforce AppExchange and can be any Salesforce
    Enterprise or Unlimited organization that has installed the free LMA from AppExchange.


    The best option is to have LMO installed in your PBO. This means that your PBO
    serves as the central repository for all license information related to your app
    installations, keeping everything neatly organized behind the scenes.


    # FMA for managing app features'
  merge: -1
  img_proc: true
- pgno: 111
  md: 'You can think of the FMA as a maestro ready to orchestrate a memorable experience
    for each guest at your club. We’ll explore the core concepts, use cases, and the
    two FMA parameters: LMO-to-Subscriber feature parameters, and Subscriber-to-LMO
    feature parameters.


    # Understanding the FMA


    The FMA is not mandatory to use, but it can be the mastermind behind your app,
    orchestrating the perfect blend of features and functionality for each customer.
    Built on top of the LMA, the FMA allows you to fine-tune **user experiences (UXs)**
    by controlling what users see and how they interact with your app. Consider the
    FMA the conductor of your app’s symphony, guiding every note to create a harmonious
    experience.


    Here is an Entity relationship diagram, illustrating the relationships between
    various entities in the FMA:


    ![](img/44ed632038957e4c80220676e84c5109_111_0.png)


    Figure 2.3: Entity relationship diagram of FMA entities and their relationships


    # FMA use cases'
  merge: -1
  img_proc: true
- pgno: 112
  md: 'The FMA can perform various tunes to cater to your guests’ preferences.

    Here are a few examples:


    +   - **Freemium model:** Customize features based on whether a client has a paid
    or free license type

    +   - **Piloting betas:** Release new features to a select group of customers
    for testing without affecting current users

    +   - **Streamlining development:** Reduce development time and overhead by managing
    multiple applications using the FMA, strategically aligning features to leverage
    the existing code base


    # Enabling and disabling features with LMO-to-Subscriber feature parameters


    LMO-to-Subscriber feature parameters are like the maestro’s wand, enabling or
    disabling features with a simple flick. These parameters are writable on your
    end and read-only for your subscribers, and can be used to control access to certain
    features or set limits on resource usage. Want to offer a sneak peek of a new
    feature? No problem! Enable it for a limited trial period and watch the excitement
    unfold. Just update the related feature parameters in your LMO, and let the magic
    happen in your code.


    # Tracking preferences and activation metrics with Subscriber-to-LMO feature parameters


    Subscriber-to-LMO feature parameters are the maestro’s attentive ears, listening
    to the feature activation preferences of your subscribers. With values assigned
    by your subscribers and sent to your LMO, you can collect insights and adapt your
    performance to their liking. Just update the feature parameters in your subscriber’s
    org using Apex code, and you’re good to go.'
  merge: -1
  img_proc: true
- pgno: 113
  md: '# FMA considerations


    While designing your FMA strategy, it’s essential to keep a few things in mind,
    as follows:


    +   - A fully managed package cannot be hidden or revealed using the FMA. However,
    you can provide a **call to action (CTA)** for users to access the features.

    +   - Testing can be challenging as there’s no test LMO, and the documentation
    might be unclear. Developers need to perform a dark launch to the packaging environment
    for testing.

    +   - Develop a features strategy, keeping in mind the 200-feature limit per managed
    package.

    +   - Only three types of FMA flags are available: **Boolean**, **Integer**, and
    **Date**.

    +   - You can adjust feature parameters in your LMO manually. However, suppose
    your solution has many feature parameters that must be changed from their default
    settings for paying customers upon installation. In that case, it might be a good
    idea to automate this process. Consider setting up a record-triggered flow on
    the License object to make things smoother.


    # Unlocking the full potential of your PBO


    As you already know, your PBO is a standard Salesforce org, which means it can
    be customized and extended to meet your specific needs through local development
    or by installing managed packages. To help you unlock your PBO’s full potential,
    let’s discuss three primary ways of extending it: installing an AppExchange app
    (either generic or dedicated to ISVs, such as'
  merge: -1
  img_proc: true
- pgno: 114
  md: 'Package Visualizer), using an open-source project (like ISV Cockpit), or custom
    development.


    # Package Visualizer


    The Salesforce Labs-created Package Visualizer¹ app is a free managed package
    that improves your AppExchange experience by giving you a convenient way to view
    your packages, version ancestry, and subscriber data. You can install it directly
    from AppExchange. With its seamless integration with LMA, Package Visualizer allows
    you to manage your apps with ease and efficiency. Furthermore, Package Visualizer
    simplifies obtaining detailed logs for package usage. It offers valuable insights,
    empowering informed decisions in package development and management. We will explore
    this further in *Chapter 10*.


    1 https://appexchange.salesforce.com/appxListingDetail?listingId=a0N4V0000FNBc0UAH


    The Package Visualizer app features a split-view design that simplifies navigation,
    allowing you to explore package details, versions, and subscribers in a graphical
    manner. With the upgrade scheduling functionality, efficiently planning and executing
    upgrades ensures that your customers always have access to the latest version
    of your app.


    # Salesforce ISV Cockpit


    The Salesforce ISV Cockpit² app is an open source native Salesforce app that extends
    the functionality of the LMA in your PBO. It allows you to monitor'
  merge: -1
  img_proc: true
- pgno: 115
  md: 'the health of your apps and provide proactive support to subscribers experiencing
    errors. When an error occurs in a managed package, your app can send error notifications
    to a specified email address. ISV Cockpit leverages this feature by receiving
    and parsing those emails. By combining this information with data from the LMA,
    the ISV Cockpit app can accurately assign each incoming error to a customer account,
    package, package version, and license. Additionally, it extracts information about
    the error type and location.


    2 [https://github.com/rsoesemann/salesforce-isv-cockpit](https://github.com/rsoesemann/salesforce-isv-cockpit)


    All this data is stored in a single Custom Object, enabling easy reporting and
    the creation of sophisticated support workflows.


    # Custom development


    One of the significant advantages of using your PBO is the flexibility to customize
    and extend its capabilities. In your PBO, everything is built upon Salesforce
    objects, including standard objects such as Accounts, Leads, and Contacts, as
    well as custom objects related to LMA such as Licenses, Packages, and Package
    Versions. This flexibility allows you to create customizations that support your
    business goals.


    Let’s take a look at two examples of local customizations that can improve your
    customer retention and sales processes.


    # Alert sales reps before a license expires


    To ensure that your customers’ licenses are renewed on time and prevent potential
    losses, you can set up a flow to automatically email a sales rep on'
  merge: -1
  img_proc: true
- pgno: 116
  md: 'your team before the license expires. To do this, proceed as follows:


    +   - Create an email template for the notification.

    +   - Use Salesforce Flow’s **Get Records** element to fetch licenses nearing
    expiration. Set up a condition to specify enough time before the expiration date
    to discuss renewal options.

    +   - Use the **Send Email** element in the flow to send an email notification.
    Here, choose the email template you created in the first step and specify a sales
    rep or team member as the recipient.

    +   - Activate your flow to start notifying sales reps before a license expires.


    # Notify customer-retention specialists when an offering is uninstalled


    Understanding why a customer uninstalls your offering can help improve your offering
    or restore the business relationship. By setting up another flow, you can notify
    a customer-retention specialist on your team when an offering is uninstalled.
    To do this, proceed as follows:


    +   1. Create an email template for the notification.

