  md: 'You’ll be doing all of this while enjoying the benefits of trusted, secure,
    Salesforce-approved tools that offer a precise insight into how customers are
    interacting with your application. The road might seem challenging, but with AppExchange
    App Analytics as your compass, you’re more than equipped to steer the ship of
    your application’s success.


    # Enabling AppExchange App Analytics


    Whether you’re just setting foot on your AppExchange journey or are well on your
    way, one of the smartest moves you can make is to request AppExchange App Analytics.
    “Why the haste?”, you ask. Well, the sooner you request it after your application
    passes the security review, the quicker you start accumulating valuable information
    about your app’s usage.


    Keep in mind that some logs are collected exclusively from your customers’ orgs,
    so initially, your data repository might seem like an empty canvas. But remember—Rome
    wasn’t built in a day. With time and increased usage, the canvas will be filled
    with a spectrum of data, offering you a wealth of information to analyze and act
    upon.


    To activate access to AppExchange App Analytics package usage logs and subscriber
    snapshots, run SF CLI command:


    ```

    sf package update --package "Your Package Alias" --enable-app-analytics

    ```


    You can anytime deactivate these logs by SF CLI command:


    ```

    sf package update --package "Your Package Alias" --no-enable-app-analytics

    ```'
  merge: -1
  img_proc: true
- pgno: 505
  md: 'You can only turn on package usage logs and subscriber snapshots. Package usage
    summaries are automatically provided.


    Once App Analytics is enabled, you’ll have a wealth of actionable data at your
    fingertips. Now, that’s a step in the right direction for your app’s success on
    the AppExchange marketplace!


    # Data types in AppExchange App Analytics


    In the domain of AppExchange, data serves as a compass, guiding you through the
    maze of decision-making processes. AppExchange App Analytics presents three major
    categories of data types that shed light on your application’s performance and
    user interactions, enabling you to enhance your strategies. These data types comprise
    the following:


    +   - Package usage logs

    +   - Package usage summaries

    +   - Subscriber snapshots


    Let’s dive deeper into each of these categories.


    # Package usage logs


    Package usage logs empower you with comprehensive data on user behavior and interactions
    within your application. These logs encapsulate information about the interactions
    of users with each packaged component in your application, including every UI,
    API-based, Lightning-based, and Apex operation. Additionally, they log each **Create,
    Read, Update, Delete** (**CRUD**) operation on components and custom objects in
    your packages. This'
  merge: -1
  img_proc: true
- pgno: 506
  md: 'excludes events from scratch orgs. With package usage logs, you get to analyze
    user interactions and adoption rates, and consequently make informed decisions
    concerning feature development.


    This data is available for a short window of 45 days from the date the log event
    occurred. Quick action is required if organizations want to archive or analyze
    this data.


    However, reading package usage log data requires a specific approach. Each line
    in the log describes an interaction of a user with one of your packaged components.
    Hence, to comprehend that interaction, one needs to scrutinize each log line,
    identifying the accessed packaged component, the person interacting with it, and
    the nature of that interaction.


    # Package usage summaries


    Package usage summaries are your go-to for high-level metrics organized by calendar
    month. They provide you with an understanding of user access to your package and
    the operations performed. These summaries capture UI, API-based, Lightning-based,
    and Apex operations, logging each CRUD operation on components and custom objects
    in packages. However, they exclude events from sandbox, scratch, and trial orgs.


    Package usage summaries are available for download for a significant 10 years
    from the summary file log date. This extended period ensures that organizations
    can conduct longitudinal studies and track package usage trends.


    These summaries are typically accessible to both partners and subscribers at the
    start of the following month. For instance, you can obtain a usage summary for
    May at the beginning of June. As an AppExchange partner, you'
  merge: -1
  img_proc: true
- pgno: 507
  md: 'can request monthly usage summaries using the **AppAnalyticsQueryRequest**
    object in the SOAP API from the LMO that owns the package.


    # Subscriber snapshots


    Subscriber snapshots provide you with a momentary overview of subscriber activity.
    They offer a daily snapshot of org, package, and custom entity data, recorded
    at 00:00 UTC and immediately available for download. You can request a snapshot
    for a specific date and time or a range of dates and times, receiving one snapshot
    per valid date and time requested.


    By examining these snapshots, you can identify usage trends by org and package.
    This data allows you to understand the tendencies of your subscribers and make
    informed decisions to enhance your package. Similarly to package usage logs, snapshot
    data can be downloaded for 45 days from the snapshot date. Given its nature, it’s
    essential to capture and analyze this data promptly to understand subscriber behavior
    and attributes at specific moments.


    There’s one more thing. Not all App Analytics data is gathered in every type of
    Salesforce environment. The specifics of the data collection can vary significantly
    based on the org type and status, as shown in the following table:


    | Data type | Production | Sandbox | Scratch org | Trial |

    |-----------|------------|---------|-------------|-------|

    |           | Yes        | Yes     | No          | Yes   |'
  merge: -1
  img_proc: true
