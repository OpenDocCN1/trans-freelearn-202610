- pgno: 259
  md: 'Starting with named credentials, these offer a streamlined way to manage and
    authenticate calls to external systems. However, their use comes with substantial
    caveats for managed package developers. The most significant is that named credentials
    can be used by any code in the subscriber org. This fact inherently raises the
    risk of exposure and misuse of your packaged secrets. Furthermore, named credentials
    present practical limitations, such as the inability to include secret values
    in metadata due to security reasons – metadata can be accessed in plain text XML.
    Plus, the remote endpoint details often can’t be determined at packaging time,
    leading to increased complexity. Therefore, I do not recommend using named credentials
    when shipping secrets in your managed package.


    Similarly, external credentials, although designed to securely store secrets for
    external systems, are not without limitations. According to the Salesforce Metadata
    Coverage report, as of the time I wrote this book in 2023, their current lack
    of support for 2GP packaging is the main issue. This lack of support presents
    a considerable limitation when considering external credentials for managed packages.
    For the most up-to-date information on metadata support in Salesforce, you can
    check the official Salesforce Metadata Coverage report at https://developer.salesforce.com/docs/metadata-coverage.
    This resource will allow you to verify whether the aforementioned limitations
    have been mitigated.


    This brings us to protected custom metadata types. These are highly secure options
    for storing secrets in Salesforce, as they can only be accessed within the same
    namespace. This means they are impervious to access or use any code outside of
    the managed package, adding an essential layer of security. Therefore, if your
    managed package contains secrets, I recommend using'
  merge: -1
  img_proc: true
