- pgno: 108
  md: '![](img/44ed632038957e4c80220676e84c5109_108_0.png)


    You’re going to be the proud owner of an exclusive club (your app) on the bustling
    AppExchange street. The LMA is your trusty bouncer, keeping track of all the guests
    (licenses) entering and leaving your establishment. In this section, we’ll learn
