    # Salesforce Connect


    Salesforce Connect is a cloud integration service that allows Salesforce users
    to access and manage data in external apps, right from within Salesforce. It uses
    the OData (Open Data Protocol) for data integration, allowing Salesforce to interact
    with data in external systems using RESTful APIs.


    OData is an open standard protocol that allows for the creation and consumption
    of queryable and interoperable RESTful APIs in a simple and standard way. It enables
    full CRUD support (Create, Read, Update, Delete) to an external system from Salesforce.


    # Salesforce Connect for ISVs


    For ISVs, Salesforce Connect offers a significant advantage. It is available for
    free as a benefit for ISV partners, with each partner receiving three licenses
    per customer to connect to partner-owned data sources. This means that ISVs can
    integrate their own external data sources into their Salesforce applications at
    no additional cost.'
