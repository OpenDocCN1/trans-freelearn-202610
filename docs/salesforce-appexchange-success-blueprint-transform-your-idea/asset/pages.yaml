    # Requesting a trial organization extension


    Salesforce provides a mechanism for partners to request an extension for their
    **Trialforce Source Organization (TSO)**, Demo or Test, or Customer Trial Organization.
    Here’s the process:


    +   1. Log in to **Help & Training**.

    +   2. Select **Create a Case**.

    +   3. Fill out the **Subject** and **Description** fields.

    +   4. After waiting a few seconds, select **Pick a Different Product/Topic**.

    +   5. Choose **Partner Programs & Benefits** > **Trial Org Extension**.

    +   6. Enter the required information in the specified fields and submit. The
    extension will be applied automatically to the organization.


    A Customer Trial organization can be extended for up to 90 days per request. Make
    sure to submit only one request per organization ID.


    Lastly, the final step of your process could be updating the status of the associated
    Opportunity record in your PBO. This way, your sales team can keep track of the
    customer’s journey, from the trial phase to a possible conversion to a paid customer.


    By implementing this systematic approach, you can manage the end of trial periods
    more efficiently. This enhances customer experience during the'
