    # Dependency injection pattern – a flexible approach to customization


    The **dependency injection (DI)** pattern is a popular software design pattern
    that facilitates customization and extensibility in Apex applications. This pattern
    allows developers to decouple different components of an application, making it
    easier for customers to modify specific parts of the app without affecting its
    core functionality.


    For example, imagine you have a managed package application that integrates with
    an external system to fetch data. By default, your application connects to a publicly
    available cloud-based off-the-shelf system, but one of your customers may require
    integration with their in-house system. Using the DI pattern, you can create an
    interface that defines common methods for interacting with external systems, then
    develop the default class for the cloud-based system and empower your new customer
    to develop a new local class for their in-house system. Both classes implement
    the same interface, so this way, customers can choose which system they want to
    integrate with, without modifying the core application code.


    Another example would be an app that calculates taxes for customers. Different
    customers may have varying tax rules and calculations. By implementing the DI
    pattern, you can create a tax calculation interface, and then develop separate
    classes for each customer’s specific tax rules. This'
  merge: -1
  img_proc: true
- pgno: 204
  md: 'enables customers to use their custom tax logic while maintaining the integrity
    of the core application.


    # The role of interfaces, virtual base classes, and custom metadata in DI


    In order to effectively implement DI in Salesforce applications, certain constructs
    and features, such as interfaces, virtual base classes, and custom metadata, are
    utilized. These elements, each carrying its unique attributes and capabilities,
    play an essential role in injecting customer-specific customization into the managed
    package. Let’s delineate their roles in the following table:


    | Feature | Role |

    |---|---|

    |  | Interfaces allow the code to interact with a defined set of methods, while
    the actual implementation of those methods can differ from |'
  merge: -1
  img_proc: true
- pgno: 205
  md: '| Interfaces | customer to customer. This allows the managed package to rely
    on the interface during development but doesn’t have a direct dependency on the
    customer’s specific implementation. |

    |---|---|

    | Virtual base classes | These classes allow developers to define a set of base
    methods that can be overridden by customers to customize the application’s behavior.
    By using virtual base classes, customers can extend the core functionality of
    a managed package without modifying its source code. |'
  merge: -1
