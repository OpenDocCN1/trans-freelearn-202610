  md: '# Managing redundancy and dependencies


    You might come across redundancy in your labels, especially if your app is large.
    However, it’s important not to worry too much about it. The same phrase may have
    different connotations in different languages, and what might seem redundant in
    one language might not be so in another. Therefore, treating each label as unique
    and giving each its appropriate context can be beneficial.


    # Modularizing labels and versioning


    Labels should ideally be kept in a single `CustomLabels` XML file per package,
    maintained in alphabetical order by API name. You should manually incorporate
    new labels into your package metadata, specifically within the `CustomLabels.labels-meta.xml`
    file. This entails utilizing an **integrated development environment (IDE)** rather
    than relying on the Salesforce UI.


    Using a prefix on each label API name to define the module it belongs to and categories
    to group labels together can further help with organization.


    # Translation tools


    The translation process can be outsourced to a professional translation service.
    Exporting labels to XLF format can simplify the process for them, and they will
    maintain a catalog of what they have already translated, making it easier to identify
    new or modified entries each time.


    # Allowing subscribers to adjust your translations


    In namespaced packages, end customers can override metadata translations for custom
    objects. For instance, they can override the label on a custom field or a workflow
    task using Translation Workbench. If they do so, updates to your application are
    not going to override local translation. Although you'
  merge: -1
  img_proc: true
- pgno: 196
  md: 'can’t restrict subscribers from providing translations, this feature allows
    them to tailor your app to their specific context and needs.


    # Apex – the backbone of customizable Salesforce applications


    Apex is a powerful, strongly typed programming language used for developing custom
    business logic on the Salesforce platform. It is designed to execute server-side
    operations, allowing developers to create dynamic and versatile Salesforce applications
    that cater to specific business requirements.


    One of the challenges faced by AppExchange partners is creating applications that
    meet the unique needs of their customers. As a managed package, a Salesforce application
    core cannot be modified by a subscriber after installation. However, end customers
    may have diverse requirements, prompting the need for customization and extensibility.
    Forbes reports that 71% of customers feel frustrated by the lack of customization
    options in apps.


    To address this intricacy, the Salesforce platform provides substantial opportunities
    for customization, even within managed packages. End customers can tweak a partner
    application extensively via the Salesforce platform to align with their business
    needs. They can utilize custom fields, flows, Apex, and other tools to personalize
    the application. Additionally, Dynamic Apex empowers developers to produce applications
    that, while having a fixed core, provide extra room for customization, enhancing
    the end user’s experience and fulfilling their specific requirements.'
  merge: -1
