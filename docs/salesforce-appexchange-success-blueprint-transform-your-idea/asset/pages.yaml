    # Which one should you use?


    Selecting the appropriate technology for outbound integrations in Salesforce hinges
    on several pivotal factors: the integration pattern in play, the capabilities
    of the external system, and the specific security prerequisites. It’s imperative
    to juxtapose the constraints highlighted in the upcoming *Integration secrets
    management* section with the unique requirements of each technology, such as the
    necessity for named credentials. From my experience, a majority of ISVs lean toward
    Apex for crafting their outbound integrations. The rationale behind this preference
    is clear: Apex offers unmatched adaptability. It grants developers the latitude
    to tailor every facet of the integration, from fine-tuning request headers to
    devising bespoke error-handling strategies. In essence, while various paths lie
    ahead, the journey of integration often finds its most reliable guide in Apex.


    # APIs or events?


    When considering the integration of Salesforce with external systems, two other
    technologies may come to mind: platform events and change data capture.


    Platform events² are a part of Salesforce’s event-driven architecture. They allow
    you to create and listen for custom notifications and events in Salesforce. These
    events can be published and subscribed to by both Salesforce and external systems.'
