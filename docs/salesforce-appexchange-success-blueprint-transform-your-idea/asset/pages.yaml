- pgno: 415
  md: 'Please keep in mind that as your product evolves, so should your trial templates.
    Any updates or branding changes need to be reflected in your trials.


    # Integrating trials on your web page


    One effective method of extending your AppExchange solution’s reach is to feature
    free trials directly on your website. Utilizing HTML forms in conjunction with
    the SignupRequest API not only drives engagement toward your business but also
    presents a comprehensive showcase of your solutions to potential customers. Upon
    form submission, Salesforce allocates a trial that aligns with your predefined
    Trialforce template.


    # Understanding the SignupRequest API


    The SignupRequest API serves as a tool when it comes to activating free trials
    on your website. Executing API calls to the SignupRequest object enables you to
    generate sign-ups for potential customers, collect in-depth sign-up data, analyze
    this information, and synchronize sign-up data with your pre-existing business
    operations.


    # Implementing trials on your website


    To implement trials on your website, perform the following steps:


    +   1. **Activation of SignupRequest API**: To activate the **SignupRequest**
    API, open a support case in the Salesforce Partner Community using your **Partner
    Business Org (PBO)** credentials. This will get the API operational in your organization.'
  merge: -1
  img_proc: true
- pgno: 416
  md: "+   2. **Selection of a sign-up form hosting option:** Evaluate and opt for\
    \ a suitable hosting solution for your sign-up form. This could range from a Node.js\
    \ and React app hosted on Heroku to a Lightning component hosted on an Experience\
    \ Cloud site, a Visualforce page hosted on Sites, or a Web-to-Lead form.\n+  \
    \ \n+   3. **Creating sign-ups through the API:** Implement API calls to the `SignupRequest`\
    \ object for the creation of sign-ups aimed at potential customers, allowing you\
    \ to customize the sign-up journey.\n+   \n+   4. **Generating proxy sign-ups\
    \ for OAuth and API access:** The `SignupRequest` object lets you programmatically\
    \ create an organization without dispatching any system-generated emails to the\
    \ user. Consequently, you can acquire an OAuth access token to log in to the organization\
    \ and perform API requests from it, all without requiring any user action.\n+\
    \   \n+   5. **Provisioning trial orgs:** Leverage Trialforce to provision a no-cost\
