- pgno: 277
  md: '+   - Direct Installation URL: In scenarios where the connected app isn’t bundled
    in a package, it can be directly installed using a dedicated link. This link should
    be readily available in associated documentation, such as a configuration guide.
    Here’s how to get this link:

    +     - Sign in to the Salesforce org where you set up the connected app.

    +     - Head to **Setup**, then select **Apps**, followed by **App Manager**.
    From there, locate your connected app.

    +     - Look for the **id** URL parameter (it’ll begin with OCi). Once you’ve
    found it, copy and paste it at this link:

    +       https://login.salesforce.com/identity/app/AppInstallApprovalPage.apex?app_id=0CiXXXXXXXXXXXX

    +   - Utilizing the Connected Apps OAuth Usage Page: This platform enlists all
    OAuth connected apps that are currently linked to users in your org. There will
    be an **Install** button next to an app if users are accessing it but haven’t
    installed it.

    +   - Head over to **Setup**, then pick **Apps**, followed by **Connected Apps**,
    and finally, choose **Connected Apps OAuth Usage**. From the list, select the
    app you want and hit **Install**.


    No matter how you’ve installed the connected app, the system administrator can
    simply navigate to **Setup**, then choose **Apps**, followed by **Connected Apps**,
    and finally, select **Manage Connected Apps**. From there, you can tweak the local
    access permissions for the app.'
