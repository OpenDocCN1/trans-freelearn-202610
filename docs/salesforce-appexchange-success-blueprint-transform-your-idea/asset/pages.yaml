    org.


    While exploiting the extensive functionalities offered by the Subscriber Support
    Console, certain best practices can enhance its efficacy and ensure a secure troubleshooting
    process, as follows:


    +   - **Creating an audit trail**: Logging a case in the **License Management
    Organization (LMO)** before each login to a subscriber’s org will create a trackable
    record. This trail provides accountability and transparency about when and why
    access to the subscriber org was needed.

    +   - **Access control**: To preserve the security of customer data and configurations,
    limit login access to trusted support and engineering personnel. This practice
    safeguards subscriber’s orgs, as logging in grants full read/write access to customer
    data and configurations.'
