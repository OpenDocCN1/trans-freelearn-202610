- pgno: 37
  md: '# What this book covers


    Chapter 1, *Introduction to Salesforce Ecosystem and AppExchange*, is the starting
    point of our journey where we dive into the Salesforce ecosystem. In this chapter,
    we will explore the vastness of Salesforce, discover the benefits of creating
    applications for AppExchange, assess whether the Salesforce Platform aligns with
    your application idea, examine ISV partnership options, and weigh the advantages
    and responsibilities of being a Salesforce ecosystem partner.


    Chapter 2, *Becoming an AppExchange Partner*, discusses the AppExchange Partner
    Program structure and benefits, effective utilization of the AppExchange Partner
    Community, key partnership agreements, crafting tailored business plans for the
    Salesforce ecosystem, and leveraging the AppExchange Partner Toolkit (Partner
    Business Org, License Management App, Feature Management App, and so on), helping
    you to establish a solid foundation for a successful partnership in the Salesforce
    ecosystem.


    Chapter 3, *Designing Customer-Centric Applications*, covers the art of creating
    applications that truly meet customer needs and provide value. It emphasizes understanding
    customer pain points, aligning value propositions, mapping customer journeys,
    and selecting effective pricing models. By the end of this chapter, you’ll possess
    the knowledge and insights needed to craft user-centric applications that leave
    a lasting impression in the AppExchange marketplace, helping customers solve their
    problems effectively.


    Chapter 4, *Exploring Salesforce Platform Technologies*, is a journey into the
    lesser-known but highly valuable ISV-specific features of Salesforce. It sheds'
  merge: -1
  img_proc: true
- pgno: 38
  md: 'light on managed packages, Dynamic Apex, flows, custom property editors, Platform
    Cache, and the Salesforce Lightning Design System, offering insights into their
    functionalities and how they can be used to solve specific problems in AppExchange
    development.


    Chapter 5, *Seamless Integration with External Systems*, is a comprehensive guide
    that equips you with the skills and tools needed to build robust bridges, connecting
    your Salesforce applications to external systems. This chapter covers technical
    architecture, integration patterns, Salesforce APIs, Salesforce Connect, the Canvas
    SDK, and connected apps, providing you with the knowledge to seamlessly integrate
    your applications with external platforms and navigate the Salesforce ecosystem
    with confidence.


    Chapter 6, *Security Review*, equips you with the knowledge and tools to navigate
    the security review process, maintain high-security standards, comply with Salesforce
    security requirements, use scanning tools, document false positives, and continuously
    improve security for your Salesforce application.


    Chapter 7, *Release Management*, is an exploration of the critical aspects of
    managing software releases within the Salesforce ecosystem. It serves as a vital
    bridge between the development phase and the end users, ensuring the smooth and
    consistent delivery of your software applications. In this chapter, we will delve
    into topics such as understanding the core principles of release management, identifying
    different types of software versions, utilizing push upgrades to facilitate seamless
    application updates, staying up to date with the latest package version, and determining
    the optimal frequency to release and deploy your software. By the end of this
    chapter, you will have gained'
  merge: -1
  img_proc: true
- pgno: 39
  md: 'the expertise to effectively guide your software applications from the development
    stage into the hands of your end users.


    *Chapter 8*, *Onboarding New Customers*, is where we will learn the art of welcoming
    and retaining new customers in the Salesforce landscape. We’ll explore the strategies
    to craft a compelling AppExchange listing, the techniques for engaging and fun
    onboarding experiences, the secrets of creating cinematic demos, providing interactive
    trial experiences, offering clear installation instructions, and embracing customer
    customization while ensuring a smooth transition into your software’s world. By
    the end of this chapter, you’ll have the tools to create an effective onboarding
    process that encourages potential users to become long-term residents in the house
    of your software.


    *Chapter 9*, *Operational Excellence*, embarks on an adventurous journey through
    the Salesforce wilderness to discover the riches of customer satisfaction and
    revenue growth. Along the way, we’ll explore the choice between the **Checkout
    Management App (CMA)** and the **Channel Order App (COA)**, all in pursuit of
