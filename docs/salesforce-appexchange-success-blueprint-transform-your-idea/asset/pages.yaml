- pgno: 474
  md: 'Understanding the difference between upgrades and renewals within the COA can
    be confusing, but it’s important for appropriate order submission. Both types
    of orders must incorporate all products and licenses that the customer is expected
    to have in the future.


    Upgrades usually occur mid-contract and involve an increase in the overall contract
    value. They result from an increase in pricing or license quantity and replace
    all current customer information. The changes brought by an upgrade order go into
    effect on the service start date.


    Renewals, on the other hand, can either increase or decrease the contract’s value
    but only go into effect on the customer’s renewal date. They involve changes in
    pricing with no change in the quantity. Any renewals that result in a decrease
    in Annual Contract Value (ACV) must be submitted 30 or more days before the service
    date.


    If the only change to your customer’s contract is a change in license quantity,
    submit an add-on or reduction order. It’s important to note that upgrades act
    as an “early renewal,” replacing all current customer information.


    # Monitoring your order post-submission


    After the submission of your order, you can monitor its status within the Service
    Orders tab of the COA. This provides a summary overview, listing the order number,
    customer name, customer org ID, order value, order type, and order status. To
    view more detailed information, including order terms and dates, you can select
    an individual order. Once Salesforce has received and examined your order, they
