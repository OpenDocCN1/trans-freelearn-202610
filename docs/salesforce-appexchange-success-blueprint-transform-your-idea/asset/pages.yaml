  md: 'Pairing AppExchange Checkout with the CMA provides further operational benefits.
    The CMA brings Salesforce CRM’s capabilities to Checkout, providing insights into
    revenue, subscription status, and more. It also enables sending customizable notifications
    for key events such as trial expirations and declined payments.


    # Financial implications and revenue sharing


    As of 2023³, revenue sharing with Salesforce varies based on the payment method.
    For bank transfers, it’s usually 15%, depending if you participate in the Marginal
    PNR program described in *Chapter 1*. For credit card payments, at the time of
    writing this book, it’s 15% plus a Stripe-imposed $0.30 per transaction fee. For
    instance, if you sell an app at $50 per user per month and a customer buys 10
    licenses via bank transfer, your share with Salesforce would be $75 per month
    out of the total monthly transaction of $500.


