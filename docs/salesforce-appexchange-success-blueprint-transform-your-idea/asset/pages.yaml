    # Leveraging early releases in customer sandboxes


    Salesforce’s sandbox environments, combined with tools such as Push Upgrade, offer
    ISVs valuable opportunities to refine their AppExchange releases. Adopting early
    releases in customer sandboxes allows for a streamlined release process, ensuring
    your AppExchange products are of top quality and free from bugs. This strategy
    not only ensures the highest-quality releases but also gives customers ample time
    to familiarize themselves with updates before they go into production. Salesforce’s
    sandbox, push upgrades, and comprehensive release notes form an ideal framework
    for this.


    An early release strategy means introducing your new AppExchange version in a
    controlled setting prior to the production release. The benefits include the following:


    +   - **Gathering valuable feedback:** Customer sandboxes serve as platforms to
    gather firsthand feedback on your app’s enhancements

    +   - **Training customers:** Before the official release, customers gain practical
    experience with the new version'
