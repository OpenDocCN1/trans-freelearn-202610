    # Support RACI matrix


    Applying a **Responsible**, **Accountable**, **Consulted**, **Informed** (**RACI**)
    matrix to your tech support processes can be transformative. This clarity of roles
    and responsibilities allows for efficient decision-making and resource utilization.


    Let’s break it down with some examples:


    +   - **Responsible**: These are the individuals or teams who perform an activity
    or make a decision. For instance, an application engineer might be responsible
    for resolving a technical issue reported by a customer. They are the ones in the
    trenches, getting their hands dirty to ensure that problems are promptly addressed.

    +   - **Accountable**: These are the people who own the outcomes of a decision
    or an activity. For example, the Head of Support could be accountable for the
    overall performance of the support team, ensuring issues are resolved within agreed
    **service-level agreements (SLAs)** and to the satisfaction of the customers.'
  merge: -1
  img_proc: true
- pgno: 450
  md: '+   - **Consulted:** Those whose opinions are sought and with whom there is
    two-way communication. For example, the product development team might be consulted
    about a persistent bug reported by multiple customers. Their expertise is crucial
    in devising a solution or a workaround.

    +   - **Informed:** Those who are kept up to date on progress, often only on completion
    of the task or decision. They do not typically need to be consulted, nor do they
    contribute directly to the task or decision. In the context of an ISV, the sales
    team could be kept informed about major issues that could impact their customer
    relationships or potential deals.


    To illustrate how this could work in a real-world scenario, consider a customer
    who reports a critical issue with your app. The application engineer (*Responsible*)
    dives in to resolve the issue, working closely with the product development team
    (*Consulted*) if necessary. The Head of Support (*Accountable*) oversees the process,
    making sure everything goes smoothly and the issue gets resolved promptly. Once
    the problem is resolved, the sales team (*Informed*) is updated about the resolution
    to ensure it can keep the customer informed and manage the relationship effectively.


    Implementing a RACI matrix in your tech support processes ensures clear communication,
    effective decision-making, and ultimately, higher customer satisfaction.


    # Balancing proactive and reactive approaches in tech support'
  merge: -1
  img_proc: true
- pgno: 451
  md: 'Navigating the dynamic Salesforce AppExchange ecosystem calls for ISVs to maintain
    an equilibrium between proactive and reactive techniques in tech support.


    # Proactive tech support


    Proactive tech support seeks to preempt and rectify issues before they affect
    customers. This involves keeping pace with changes and updates in the Salesforce
    ecosystem that could potentially influence your application.


    Regularly conducting regression testing of your application in response to Salesforce
    updates is a case in point. By catching possible issues early on, you safeguard
    your customers from future complications. Staying ahead of the curve regarding
    upcoming Salesforce changes and training your team to respond to these alterations
    can forestall many reactive support needs.


    Application usage and customer behavior monitoring can also provide insights into
    potential problem areas. For instance, recognizing recurring difficulties with
    certain app features can prompt the creation of targeted educational content or
    even spark feature redesign for a better UX.


    # Reactive tech support


    Reactive tech support enters the fray when a customer faces an issue and seeks
    assistance. This approach is about handling urgent cases, and while necessary,
    should not be the entirety of your support strategy.


    Fast and effective resolution of customer issues can significantly enhance their
    perception of your service. However, relying exclusively on reactive support could
    lead to a backlog of unresolved issues and potentially unhappy customers, especially
    if your application serves a large user base or has complex functionality.'
  merge: -1
  img_proc: true
- pgno: 452
  md: 'Reactive support also offers a wealth of data about your customers’ experiences.
    Analysis of reactive support incidents can reveal persistent problems and improvement
    opportunities in your app.


    # Communication and support tools


    In reactive tech support, one of the crucial components is communication. Using
    your PBO can help centralize information regarding support cases. If you utilize
    Communities, it offers the advantage of allowing your customers to create their
    own cases, empowering them and ensuring transparency. Employing standard Service
    Cloud features lets you define Case Milestones, ensuring a high-quality support
    experience for your customers.


    For critical issues, regular updates to customers are vital, even if there’s not
    much progress to report. The concept of a “no-update update” is crucial here.
    Essentially, this involves informing customers that the issue is still being addressed
    and setting expectations about when the next update will be provided. This kind
    of transparent communication can bolster customer trust and patience while the
    issue is being resolved.


    # Striking a balance


    The optimal tech support strategy embraces both proactive and reactive measures.
    Proactivity minimizes reactive support needs, allowing your team to provide immediate,
    effective assistance when required. By efficiently addressing reactive support
    incidents, you bolster customer satisfaction and collect vital information for
    your proactive initiatives.


    # SLAs, service-level objectives, and support management'
  merge: -1
  img_proc: true
- pgno: 453
  md: 'An SLA is a contract between a **service provider (SP)** and its customers
    that sets out the standard of service the customer can expect. However, embedded
    within the SLA are **service-level objectives (SLOs)**, which are specific, measurable
    performance targets that the service must achieve. While SLAs provide the overarching
    commitment, SLOs specify the detailed expectations within that commitment. Within
    the Salesforce AppExchange ecosystem, ISVs often have SLAs with their clients,
    establishing agreed-upon resolution times for different types of support requests.


    As an AppExchange partner, it’s highly probable that your customers will inquire
    about your SLAs. Customers need to know that they can rely on you for prompt and
    effective problem resolution, and SLAs provide them with the necessary reassurances.


    # Designing your support process


    The type of support you offer and the corresponding SLAs you can commit to will
    depend heavily on the structure of your support team. Some organizations have
    dedicated teams available 24/7 to handle and resolve customer queries, which enables
    them to promise quicker response times. Others may only operate between standard
    business hours in a single time zone, which could result in longer resolution
    times.


    Whatever the structure of your support team, clearly defining your support process
    and communicating it to your customers is crucial. It helps set realistic expectations
    and provides a clear roadmap for incident resolution.


    # Salesforce platform consequences


    Especially for AppExchange OEM partners leveraging the Salesforce platform, it’s
    important to be aware of some inherent SLA limitations of'
  merge: -1
  img_proc: true
- pgno: 454
  md: 'Salesforce. For instance, while Salesforce commits to high uptime, there might
    be instances of downtime or performance degradation. Understanding these nuances
    can help you manage client expectations better.


    Salesforce doesn’t use a standard SLA, but a Master Subscription Agreement¹. It
    promises to make its services available 24/7 using “commercially reasonable efforts”.
    Salesforce has a track record of over 99.9%² uptime and offers a community page
    for real-time system performance info.


