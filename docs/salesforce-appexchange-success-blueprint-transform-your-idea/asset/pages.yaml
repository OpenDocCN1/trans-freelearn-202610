- pgno: 272
  md: 'single sign-on (SSO) for external apps. The external apps integrated with Salesforce
    can run on various platforms, devices, or SaaS subscriptions.


    For example, when you log in to your Salesforce mobile app and see your data from
    your Salesforce org, you’re using a connected app. The Salesforce mobile app is
    a Connected App that integrates with your Salesforce org to provide you with access
    to your data.


    # Understanding Salesforce-connected apps and session IDs


    In Salesforce’s interconnected ecosystem, connected apps function as a key authorizing
    tool, allowing external systems to securely “borrow” a session ID for specific
    uses. It’s crucial to appreciate the potent power that a session ID holds — granting
    a session ID to a third party is akin to handing over a loaded gun, providing
    them with unrestricted access and potentially extended expiration.


    For in-house Salesforce development, sharing a session ID can be a practical option,
    but it’s paramount to follow stringent security measures. In contrast, when it
    comes to AppExchange development, if you need to share a session ID with an external
    system, connected apps are not only a recommendation but a requirement due to
    Salesforce’s security review requirements. To ensure secure integrations, ISVs
    must use a connected app.


    Let me repeat: you can find information that connected apps aren’t always essential
    for authorization if you check materials dedicated to Salesforce developers, not
    dedicated to AppExchange development. There are certain'
  merge: -1
  img_proc: true
- pgno: 273
  md: 'cases, especially in in-house development, where authorization is possible
    without a connected app. These include the following:


    +   - An outbound message action that creates a session ID for a selected user.

    +   - An interactive Visualforce page using its own session ID to call the REST
    API.

    +   - An internal company system using a stored username, security token, or password
    to log in to Salesforce and obtain a session ID.


    However, these alternative methods lack the advanced security measures and controlled
    scope of access offered by connected apps, emphasizing the value of using connected
    apps for secure, efficient, and controlled integrations.


    # Advantages of Salesforce-connected apps


    Connected apps offer several key advantages. They facilitate the tracking and
    auditing of usage, thereby promoting transparency and control. The level of access
    granted can be customized, ensuring external applications only have the necessary
    privileges. The duration of access is also flexible, and granted access can be
    easily revoked without having to change your Salesforce password.


    Salesforce itself utilizes connected apps in its own products, such as Workbench,
    Salesforce Mobile, and Environment Hub, adhering to best practices and demonstrating
    the importance of not directly handling raw login credentials.


    # Access tokens, refresh tokens, and Salesforce-connected apps'
  merge: -1
  img_proc: true
- pgno: 274
  md: 'Like session IDs, access tokens and refresh tokens also provide significant
    access, but they’re designed with an additional safety net — they’re revocable
    and can be limited in power, thereby adding a further layer of security to data
    management.


    # Connected apps and managed packages


    ISVs often wonder whether a connected app needs to be part of a package. While
    developers can typically perform assertions and get access tokens without an installed
    package, there are instances where installation becomes necessary. These include
    cases where administrators want to pre-authorize a connected app without user
    interaction, or org-specific policies such as login IP restrictions need to be
    relaxed for the app.


    However, connected apps can be installed without the need for a managed or unmanaged
    package. Therefore, ISVs may not want to include the connected app in the managed
    package. This can be particularly relevant for hosted or off-platform integrations.
    Moreover, including the app in the package can complicate package development
    due to the need for a globally unique client ID or consumer key.


    When deciding whether to incorporate a connected app into your managed package,
    there are several key factors to weigh. Here’s a breakdown of the main considerations:


    +   - Packaging Type Limitation: Connected apps are exclusive to 1GP (1st Generation
    Packaging). If you’re utilizing 2GP, you’ll need to create a separate package
    for the connected app.

    +   - Distribution Scope: When you package a connected app, it becomes available
    to all your customers. This means every customer who installs'
  merge: -1
  img_proc: true
- pgno: 275
  md: 'your package will have access to this app.


    +   - Consistent Authentication: One of the advantages of packaging is the uniformity
    it brings. By packaging your connected app, you ensure the same consumer key and
    secret are used across all Salesforce orgs.

    +   - Dual-Layer Authentication: Connected apps employ a two-tier authentication
    system. The first set of credentials is at the user level, and the second is at
    the consumer or app level. This dual authentication, using both consumer key/secret
    and user token/secret, enhances security. In essence, it’s akin to having two
    sets of username/password combinations. While this might seem intricate, it doesn’t
    complicate the deployment process. Plus, if necessary, access permissions can
    be revoked either at the user or app level.

    +   - App Authentication across the Platform: Upon its creation, a connected app
    is assigned a unique consumer key and secret. This allows the app to be authenticated
    across the Salesforce platform, ensuring its legitimacy.

    +   - Flexibility with Callback URLs: A significant advantage of connected apps
    is their ability to support multiple callback URLs. This feature is particularly
    beneficial when you need to specify different environments, such as production
    and testing. By packaging the connected app with multiple callback URLs, customers
    can seamlessly switch between production and testing environments as needed.


    By understanding these considerations, you can make an informed decision about
    whether a connected app is the right fit for your managed package.'
  merge: -1
  img_proc: true
- pgno: 276
  md: 'If you decide to include a connected app in your package, one recommended way
    to configure a connected app for secure integration is to use the OAuth 2.0 JWT
    Bearer Flow. This robust and secure flow allows the application to authenticate
    itself to Salesforce, without the need to share sensitive information such as
    passwords or security tokens.


    # How (and why) your customer can install your connected app


    Installing a connected app is more than just facilitating integration between
    Salesforce and external platforms. For your customer’s system administrators,
    it’s about gaining control and enhancing security. By installing and configuring
    a connected app, administrators can define who can use the apps, where they can
    access them from, and under what conditions. This encompasses setting up profiles,
    permission sets, IP range restrictions, and even implementing multi-factor authentication
    (MFA) for bolstered security.


    Before diving into the installation process, it’s crucial to educate your customer’s
    system administrator on the importance and methodology of installing the connected
    app. This step ensures that they understand the significance of the app and can
    assist or take over the installation if necessary.


    There are several methods for installing a connected app on your customer’s Salesforce
    org:


    +   - Through a Managed Package: This is one of the most straightforward methods,
    here, the system administrator installs a managed package that inherently contains
    the connected app.'
  merge: -1
