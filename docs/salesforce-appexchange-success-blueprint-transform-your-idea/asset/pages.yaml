  md: 'the Activity Source Timeline, which shows how internal and external traffic
    sources contribute to activity on your listing for a specified time period.


    # Accessing and navigating AppExchange Marketplace Analytics


    Access to AppExchange Marketplace Analytics is granted through the Salesforce
    Partner Community. To provide your team with access, the **Manage Listings** permission
    must be assigned within the Salesforce Partner Community. This permission not
    only enables access to AppExchange Marketplace Analytics but also to all Partner
    Console features, including the ability to create, edit, and publish listings.


    Once the necessary permissions are assigned, navigating to AppExchange Marketplace
    Analytics is straightforward. After logging in to the Salesforce Partner Community,
    you should proceed to the Partner Console. From there, select **Publishing**,
    then **Home** > **Analytics**. This will present you with a list of listings from
    which you can choose the one you wish to view.


    # Exporting data for further analysis


    AppExchange Marketplace Analytics allows you to export your data for further analysis
    in Salesforce or another tool. The data is exported in a **comma-separated values
    (CSV)** format, with global and local filters applied.


    The data provided by AppExchange Marketplace Analytics is available for activities
    that occurred on your listing from August 2019 onward. It only'
  merge: -1
  img_proc: true
- pgno: 496
  md: 'provides data associated with your published listings. While there is no API
    for AppExchange Marketplace Analytics, you can export the raw data in CSV format
    for processing with other tools.


    AppExchange Marketplace Analytics does not support the import of external data.
    However, you can export your data and combine it with your external data using
    another tool. It’s also important to understand that the sum of installs, demos,
    and test drives might not match the number of leads in AppExchange Marketplace
    Analytics. This discrepancy can arise due to issues with the **Web-to-Lead** set
    up in your organization.


    # Customizing visualizations


    Although the layout of the dashboard and the style or formatting of individual
    visualizations cannot be modified, AppExchange Marketplace Analytics does allow
    for some customization. From the global filter menu, you can adjust the time period
    displayed in visualizations. Within a visualization, you can select the activity
    metrics to be displayed and, for certain visualizations, change the time scale.


    # Understanding customer interactions


    AppExchange Marketplace Analytics records several interactions when a customer
    installs your solution. For example, when a customer clicks **Get It Now** on
    your listing, this is recorded as a **Get It Now** click. After the customer chooses
    a destination for the package and agrees to the terms and conditions, clicking
    **Confirm and Install** is recorded as an install. However,'
