- pgno: 409
  md: 'Just imagine the AppExchange marketplace as a high-tech, spaceport showroom,
    where your slick and shiny spaceship (your app) is ready for a quick journey around
    the nearest nebula. Except here, the shiny spaceship isn’t just for admiring from
    afar—it’s for them to hop in and pilot through the cosmos of their specific needs!


    Essentially, a test drive org is a read-only org you set up. This org is a shared
    playground for your prospects to explore your application without altering any
    records. Given its nature, your app should be optimized to showcase results within
    these boundaries. Let’s see how to set up this experience:


    +   1. **Enable test drives**: Begin by logging in to the Partner Community, find
    the listing where you want to offer a test drive, click on it to open the AppExchange
    publishing console, select the **Trials** tab, and check **Offer a Test Drive**.

    +   2. **Create a test drive org**: Click **Create Test Drive** and fill in the
    details, making sure to associate the package containing your app. Salesforce
    will create an org and send you login credentials for both administrator and evaluation
    users.

    +   3. **Configure the test drive org**: Log in as the administrator to add sample
    data and perform other setup tasks. Then, log in as the evaluation user to define
    a password.

    +   4. **Connect the test drive org to your AppExchange listing**: Return to the
    **Trials** tab in the publishing console, click **Connect Organization**, enter
    the login credentials for the evaluation user, click **Submit**, and then finally,
    **Save**.'
  merge: -1
  img_proc: true
- pgno: 410
  md: 'There you have it! Your test drive is set to go. Prospects can select the **Test
    Drive** button on your AppExchange listing and access the test drive org as read-only
    participants. This feature is particularly beneficial for apps that effectively
    convey their value without a need to insert or update records.


    For a successful test drive, it’s vital that your sample data and scenarios resonate
    with typical applications and enable your prospects to see your app’s full range,
    even in a non-editable context. The aim is to craft a rich, engaging experience
    that captivates your potential clients, leaving them keen for more.


    # In-App Guidance for a more interactive test drive


    **In-App Guidance** is a Salesforce feature that can enrich the Test Drive experience
    for your customers. This feature acts as an interactive guide within the application,
    helping users navigate through the app and understand its features and functionalities.


    To configure **In-App Guidance**, you simply need to access the setup page in
    the test drive org, navigate to **In-App Guidance**, and click on **Add Prompt**.
    From there, you can select the type of guidance you wish to provide (such as floating
    prompts or docked prompts), the pages it will appear on, the duration it will
    display, and the frequency of its appearance.


    Utilizing **In-App Guidance** can provide potential customers with a walkthrough
    of your app. This tool can be especially handy to highlight key features, explain
    complex functionalities, and guide users through specific workflows. It’s like
    having a virtual tour guide that helps your customers explore the nooks and crannies
    of your app.


