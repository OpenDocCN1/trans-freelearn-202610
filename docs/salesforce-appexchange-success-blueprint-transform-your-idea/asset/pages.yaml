    # Periodic security re-reviews


    In the world of Salesforce AppExchange, life’s not all calm seas and clear skies.
    Occasionally, you’ll be invited for a security re-review. Think of it as a routine
    check-up for your application to ensure it remains fit and secure.


    When you upgrade a managed package that has already passed the security review,
    you’re in luck. There’s no need for another full-fledged review. Simply link the
    new version to your AppExchange listing, and you’re good to go.


    Salesforce keeps a keen eye on the AppExchange landscape. It assesses potential
    risks and time elapsed since your solution was listed to determine if a re-review
    is required. No need to panic, though. It’s just standard procedure to ensure
    continuous security.


    To determine which listed solutions are due for a re-review, Salesforce assesses
    potential risk and considers the length of time since the solution was listed.
    Risk-factor reports are generated to evaluate potential threats. If your solution
    shows significant change, it is more likely to undergo a re-review. However, if
    the risk factor is low, your solution might not be flagged for a re-review. From
    my experience, most applications are not flagged for a re-review within the first
    2 years following the initial security review, but officially, it can happen anywhere
    between 6 months and 2 years.'
