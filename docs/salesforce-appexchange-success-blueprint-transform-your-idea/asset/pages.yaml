    reusable UI components that follow best practices for UX and accessibility. These
    components can be easily customized and integrated into your application, saving
    you time and effort during the development process.

    +   - **Design tokens:** Design tokens are variables that store design-related
    values, such as colors, fonts, and spacing. They enable you to manage your application’s
    design more efficiently and consistently, making it easy to update your design
    across multiple platforms and devices.

    +   - **Accessibility:** SLDS is designed with accessibility in mind, ensuring
