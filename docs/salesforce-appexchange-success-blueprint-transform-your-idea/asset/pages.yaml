- pgno: 206
  md: '# Custom metadata


    Custom metadata provides a convenient way to store configuration data for Salesforce
    applications. When combined with Apex reflection, custom metadata can be used
    to dynamically instantiate customer-specific implementations of interfaces or
    virtual base classes, allowing customers to inject their custom logic into the
    managed package without modifying the package’s source code directly.


    An important aspect to consider is the distinction between subscriber-editable
    and developer-controlled custom metadata, as outlined here:


    +   - **Subscriber-editable custom metadata**: This allows subscribers (that is,
    customers) to modify the metadata records post-deployment. It’s particularly useful
    when you want to grant customers the flexibility to adjust configurations based
    on their unique requirements without needing to redeploy.

    +   - **Developer-controlled custom metadata**: In contrast, this type is strictly
    controlled by the package developer. Once deployed, subscribers cannot modify
    these records. This is ideal for configurations that should remain consistent
    across all subscriber orgs.


