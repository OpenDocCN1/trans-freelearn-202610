    # License transfers and swaps


    When you need to transfer licenses between two orgs or swap licenses for the same
    customer, you should log a case in the Partner Community. Make sure you choose
    **ISV Billing & Order Support** as the product and **License Swap/Transfer** as
    the topic. In the description, provide all necessary details, including the originating
    and destination Org ID, quantity, licenses, add-ons to be transferred, and any
    other relevant details.


    # Understanding swaps and transfers


    To ensure you’re handling each scenario correctly, let’s delve deeper into the
    definitions and requirements of swaps and transfers.


    # License swaps


    A swap case is necessary when a partner wants to change a product on their customer’s
    contract with another equivalent product. You can only swap products on the same
    customer contract with similar products. The conditions of the swap order, including
    org edition, renewal date, price, and quantity, cannot change. If the swap leads
    to a price change, it should be submitted as a renewal in the COA. Swaps can only
    occur on an active customer contract with a valid org ID.


    # License transfers


    On the other hand, transfer cases are required when moving licenses from one org
    to another for the same customer. Transfer conditions must remain'
  merge: -1
  img_proc: true
- pgno: 478
  md: 'consistent with the original order—this includes customer, renewal date, pricing,
    and quantity. Transferred licenses must be in **Active** status and fall under
    an active reseller contract. They must be transferred from an active org and can
    be transferred into active or trial orgs, but not demo or free orgs.


    # Case guidelines


    Regardless of whether you’re performing a swap or transfer, all case submissions
    should include the org IDs, any relevant product names, quantities, pricing, and
    start dates. Following these guidelines and understanding the differences between
    swaps and transfers will ensure that your license adjustments are processed without
    issues.


    # CMA versus COA – choosing the right order solution for your AppExchange business


    Now, you’re a seasoned adventurer standing at a fork in the road. On one side,
    the pathway is marked “CMA”, and on the other, a sign reads “COA”. Each trail
    promises to lead to the same treasure—the shiny gold of operational excellence.
    But here’s the tricky part—you can’t split yourself in two and explore both. You
    have to choose.


    The CMA path is akin to a scenic route through the forest, ideal for those who
    prefer a relaxing journey with the sight of lovely deer (read: managing payments
    in a straightforward way). On the other hand, the COA trail is for those who don’t
    mind a little uphill climb to enjoy a more panoramic view (read: comprehensive
    order management).'
