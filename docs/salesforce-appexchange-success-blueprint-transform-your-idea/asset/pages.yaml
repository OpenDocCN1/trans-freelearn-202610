- pgno: 322
  md: 'Building secure applications is a crucial responsibility for every developer.
    This section provides a high-level overview of secure application development
    practices, drawing on Salesforce’s *Secure Coding Guide* and resources provided
    by OWASP. However, these guidelines only scratch the surface of application security.
    For in-depth information and detailed guidance, developers should delve into the
    resources provided by OWASP and Salesforce’s comprehensive *Secure Coding Guide*.


    # Overview of security controls


    Salesforce provides robust built-in security controls such as object-level (**Create,
    Read, Update, Delete—CRUD**), **field-level security (FLS)**, and sharing rules.
    Developers should familiarize themselves with these controls and leverage them
    to enforce access restrictions and protect data at different levels.


    # Using HTTPS for secure communication


    All connections to external endpoints from your Salesforce application should
    use HTTPS. This ensures that all data exchanged between your application and the
    endpoint is encrypted, providing a basic level of security against data interception
    and tampering.


    # Implementing secure JavaScript and CSS


    Using JavaScript and CSS securely is paramount to protect against common web vulnerabilities.
    It’s recommended to use modern frameworks such as Salesforce’s Lightning for JavaScript
    and avoid inline styles in CSS to comply with Salesforce’s **Content Security
    Policy (CSP)**.


    # Understanding CSP'
  merge: -1
  img_proc: true
- pgno: 323
  md: 'Salesforce employs CSP in the Lightning Framework to mitigate **cross-site
    scripting (XSS)** and other code injection attacks. Developers should learn about
    CSP and adhere to its guidelines for secure application development.


    # Avoiding common web vulnerabilities


    Developers need to be vigilant against common web vulnerabilities such as XSS,
    **cross-site request forgery (CSRF)**, and insecure session cookie handling. A
    deep understanding of these vulnerabilities and techniques to prevent them is
    essential for developing secure applications.


    # Embracing secure coding practices


    Salesforce recommends secure coding practices such as using **WITH** **USER_MODE**
    in Apex and avoiding SOQL queries within **FOR** loops.


    Incorporating these practices into your development process can help prevent security
    vulnerabilities.


    # Handling sensitive data


    Extra caution should be exercised when handling sensitive data. Never store sensitive
    information in clear text; output it to debug logs, write it to the platform cache,
    or store it in cookies. Always use the secure storage mechanisms provided by Salesforce


    # XSS


    XSS is a widespread vulnerability wherein an attacker injects unauthorized JavaScript,
    VBScript, HTML, or other active content into a web page, thereby affecting other
    users viewing it. These unauthorized scripts can hijack user sessions, submit
    unauthorized transactions, steal confidential information, or deface the web page.
