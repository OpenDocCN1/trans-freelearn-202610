- pgno: 417
  md: 'At times, the most effective trial experience for a potential customer may
    simply be permitting them to get your application directly from your AppExchange
    listing. This immediate hands-on experience allows customers to evaluate your
    application in their Salesforce environment, providing a realistic understanding
    of how your solution would fit into their workflows.


    The key to this process lies in the LMA. When a customer installs your app from
    the AppExchange marketplace, a license is automatically created in your LMA. By
    default, this license is set to expire after a predetermined trial period, which
    you can define according to your business needs.


    To specify the default trial period, follow the next steps:


    +   1. Navigate to your LMA.

    +   2. Click on the **Packages** tab.

    +   3. Select the relevant managed package.

    +   4. In the **Package Detail** page, edit the **Default Trial Length (Days)**
    field.

    +   5. Save the changes.


    This setting allows you to define the standard duration of the trial period (typically,
    it is set to 30 days). The moment a potential customer installs your app, their
    trial period commences, and upon reaching the end of this period, the license
    automatically expires unless they purchase a full license.


    The direct installation strategy works optimally when the configuration process
    of your application is streamlined and automated. Customers typically appreciate
    a smooth, hassle-free setup process that lets them start'
  merge: -1
  img_proc: true
- pgno: 418
  md: 'using your app without needing extensive technical assistance or going through
    complex setup manuals.


    However, creating a seamless installation process often requires a fair bit of
    planning, design, and testing on your part. In the following section, we will
    delve deeper into strategies and techniques to optimize the installation experience,
    making it as smooth and customer-friendly as possible. These improvements to the
    installation process can significantly impact your customers’ initial impression
    of your app, influencing their decision to transition from a trial user to a paying
    customer.


    # Converting trials into paying customers


    The key to converting these trials into real customers lies in the effective management
    of the trial period and strategic interaction with the potential customer. During
    the trial period, maintaining close contact with potential customers is crucial.
    A recommended practice is to reach out to them a day after the trial begins to
    address any questions they might have. It’s also essential to make contact just
    before the trial ends, enabling your sales team to guide them toward becoming
    paying customers effectively.


    In Chapter 2, we explored the use of your PBO to implement automated processes.
    This knowledge is particularly useful when designing your trial processes. One
    key consideration is the duration of the trial period. By default, it is set to
    30 days, but based on my experience, a 14-day trial period is usually sufficient
    for customers to form an opinion about your product. Furthermore, a shorter trial
    period can help maintain a more efficient sales cycle.'
  merge: -1
  img_proc: true
- pgno: 419
  md: '# A caveman’s guide to installing your application


    ![](img/44ed632038957e4c80220676e84c5109_419_0.png)


    Picturing the Salesforce ecosystem as an international home improvement store,
    your application is one nifty toolkit waiting to be picked up by customers. Now,
    imagine your customer is more of a *Fred Flintstone* than a *Bob the Builder*.
    Yabba dabba doo! This section is all about making that'
  merge: -1
  img_proc: true
- pgno: 420
  md: 'toolkit so easy to assemble that even our beloved caveman won’t break a sweat.


    Especially if your application is developed in the ISVforce program, chances are
    a significant portion of your customers will swing by the AppExchange marketplace
    and pick up your app. The first impression counts, and the initial installation
    process is your app’s handshake. It’s crucial that we get this right because,
    let’s be honest, no one wants a wobbly, awkward handshake.


    In this section, we will stress the importance of a smooth and speedy installation
    and upgrade processes, plus the provision of an installation guide that’s as easy
    to follow as a connect-the-dots puzzle. The aim? To ensure your customers, whether
    they’re Bob or Fred, have a seamless experience, right from the word go.


    # System administrator – the key persona


    The installation process is typically handled by the system administrator in most
    organizations. This individual plays a key role in the decision to adopt or uninstall
    your app. Therefore, it’s crucial to consider their experience when designing
    your installation process.


    Design your app’s installation to be intuitive, and ensure the instructions are
    clear, easy to understand, and cater to various technical skill levels. By providing
    user-friendly guides, tooltips, and walkthroughs, you help the system administrators,
    thereby positively influencing their impression of your app.'
  merge: -1
  img_proc: true
- pgno: 421
  md: '# Swift installation and upgrades – a must


    Speed and simplicity are key when it comes to the installation process. A prolonged
    or complex installation can frustrate customers and leave them with the impression
    that your application is flawed. Therefore, optimizing your installation process
    to be as quick and straightforward as possible is a necessary step toward making
    a great first impression.


    The same principle applies to your app’s upgrade process. Regular upgrades are
    part and parcel of the customer’s journey with your app. Ensuring these upgrades
    are smooth and don’t disrupt existing functionalities will help you maintain customer
    satisfaction.


    # High-quality installation guides


    Crafting high-quality installation guides is as crucial as the development of
    the app itself. This documentation should provide a detailed description of all
    manual steps involved in the installation and configuration process. Keep in mind
    that writing effective documentation is a skill in its own right.


    To ensure the quality and usability of your guide, it should be thoroughly tested.
    This means having someone unfamiliar with the installation and configuration of
    your app follow the guide. By doing so, you can uncover any potential ambiguities
    or complexities in your documentation, and refine it for better clarity and simplicity.


    # Enhancing installation with post-installation scripts'
  merge: -1
  img_proc: true
- pgno: 422
  md: 'For developers aiming to streamline the installation or upgrade process of
    their managed package, post-installation scripts offer a useful tool. These scripts,
    which are specified Apex classes, run automatically after a subscriber installs
    or upgrades a managed package. They allow developers to customize the installation
    or upgrade process based on the specifics of the subscriber’s organization, enhancing
    the UX.


    Post-installation scripts can perform various functions such as populating custom
    settings, generating sample data, notifying an external system, or initiating
    a batch operation to populate a new field across a large set of data. It’s important
    to remember that the script is executed as a special system user representing
    your package, meaning all operations performed appear to be done by your package.


    These scripts have the power to initiate batch, scheduled, and future jobs. However,
    they cannot access Session IDs and can only perform callouts using an asynchronous
    operation. The callout occurs after the script has run and the install is complete
    and committed. To avoid installation issues, the script must not call another
    Apex class in the package using the `with sharing` keyword.


    The post-installation script is an Apex class implementing the `InstallHandler`
    interface, which has a single method, `onInstall`. This method specifies actions
    to be executed upon installation. It receives a `context` object as its argument,
    which provides information such as the organization ID where the installation
    is happening, the ID of the user initiating the installation, the version number
    of the previously installed package, and whether the installation is an upgrade
    or a push.'
  merge: -1
  img_proc: true
- pgno: 423
  md: 'Note that if the script fails, the installation or upgrade process is halted.
    Any errors in the script are emailed to the user specified in the **Notify on
    Apex Error** field of your package. Therefore, the script must be designed carefully
    and tested thoroughly.


    You can test a post-installation script using the **testInstall** method of the
    Apex **Test** class. After creating and testing the script, it can be specified
    in the **Post Install Script** lookup field on the **Package Detail** page.


    Post-installation scripts are vital for facilitating a smooth setup process. When
    effectively implemented and tested, they can contribute to a successful adoption
    of your app, as the seamless setup process leaves a positive impression on users.
    However, they must be handled with care, with detailed documentation and extensive
    testing, to ensure they function as intended without causing unintended changes
    in the users’ environment.


