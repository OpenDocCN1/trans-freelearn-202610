    # AppExchange search mechanism


    Discoverability is crucial for your product’s success on AppExchange, and that
    often begins with a well-understood search mechanism. AppExchange search, powered
    by keyword relevance, engagement, listing experience, and **machine learning**
    (ML), offers results tailored to customers’ needs. Comprehending these factors
    can help you optimize your listing and increase visibility.


    # Keyword relevance


    The degree to which the text in your listing aligns with customers’ search terms
    defines its keyword relevance. The better the alignment—especially in the title,
    tagline, and brief description—the higher the listing’s visibility. Appropriate
    use of keywords that reflect your potential customers’ requirements is key here.


    # Engagement


    Engagement is a measure of your listing’s popularity based on customer activities
    such as viewing screenshots, taking test drives, and installing the app. A listing
    with higher engagement, resulting from more customer interaction, will rank higher
    in search results.'
