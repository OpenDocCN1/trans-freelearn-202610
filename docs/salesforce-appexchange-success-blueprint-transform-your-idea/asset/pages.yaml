    # Detailed Investigation of Chimera Security Alerts


    # Incomplete or No Cache-control Header Set


    The cache-control header is being set correctly across the board by the platform.
    The Cache-Control header is used by the two files that were found during the scan,
    allowing them to be cached for only 1 hour (or 3600 seconds). If ''robots.txt''
    is cached for an hour, it has no bearing whatsoever. The other file, "dashboard.html,"
    is a static resource that can be cached for up to an hour without harm. Additionally,
    we stipulate that clients must re-validate their resources after 1 hour, causing
    them to continually check for updated versions.


    # Timestamp Disclosure - Unix


    Because ChimeraReport.html displays the results of a CSS z-index value of 99999999,
    which is not a Unix timestamp, this is a false positive.


    The other findings consist solely of mathematical calculations, such as 1?NaN:e>94906265.62425156?
    Math.log(e)+ Math.LN2. The Salesforce Chimaera scanner is flagging the second
    decimal place of the number 62425156 as potentially revealing a Unix time stamp.
    This is not a Unix timestamp.'
