    # Storing sensitive data insecurely


    Insecure storage of sensitive data, such as API keys, cryptographic keys, passwords,
    and so on, can expose your application to potential threats.


    Adhere to enterprise security standards when exporting customer data from the
    Salesforce platform and storing sensitive data within the platform. Any data breach
    or loss resulting from a vulnerability in your solution could jeopardize your
    relationship with Salesforce.


    # Notifying the user if a package installation accesses an org’s metadata


    There might be instances where your package needs to fetch or modify metadata
    during its installation or an update. The **Metadata** namespace in Apex is equipped
    with classes that symbolize metadata types. Additionally, it offers classes that
    facilitate the retrieval and deployment of metadata components directly to the
    subscriber org. Here are some key considerations regarding metadata in Apex:


    +   - Metadata components can be created, retrieved, and updated using Apex code.
    However, the deletion of these components is not supported.

    +   - At present, records of custom metadata types and page layouts are accessible
    in Apex.

    +   - Managed packages that haven’t received Salesforce’s approval are restricted
    from accessing metadata in the subscriber org. An exception to this is when the
    subscriber org activates the **Allow metadata deploy by Apex from non-certified
    Apex package version** org setting. This setting'
