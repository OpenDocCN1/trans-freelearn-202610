    # Understanding Salesforce Lightning Design System (SLDS)


    SLDS is a comprehensive design framework that provides a rich set of guidelines,
    components, and resources for creating consistent and engaging UIs across Salesforce
    applications. Developed by Salesforce, SLDS allows developers and designers to
    build custom applications using a set of pre-built UI components and patterns
    that adhere to best practices for UX and accessibility. By leveraging SLDS, you
    can ensure that your applications maintain a consistent look and feel with the
    Salesforce platform, enabling users to navigate and interact with your application
    more intuitively.


    # Key components and features of SLDS


    SLDS consists of several key components and features that facilitate a smooth
    and efficient development process while ensuring a high-quality UX, as outlined
    here:


    +   - **Design guidelines:** SLDS provides detailed design guidelines that cover
    various aspects of UI design, such as color, typography, layout, and iconography.
    These guidelines help maintain consistency across your application and align with
    the overall Salesforce ecosystem.'
  merge: -1
