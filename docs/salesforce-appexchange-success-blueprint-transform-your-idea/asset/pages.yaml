- pgno: 88
  md: '# Technical track


    Put on your coding shoes and dive into the development and security aspects of
    your app. Key milestones in this track include the following:


    +   - **Discovery**: Unravel the mysteries of technical requirements for both
    your application and the Salesforce platform

    +   - **Defining a strategy**: Choreograph your development and security processes
    to create a harmonious app

    +   - **Kicking off a security review**: Initiate the security review process,
    ensuring your app’s compliance with Salesforce’s strict standards

    +   - **Passing the security review**: Earn a gold star by successfully completing
    the security review and addressing any identified concerns


    # GTM track


    Get ready to dazzle the crowd with marketing and sales strategies for your app.
    This track is typically led by a Salesforce Partner Account Manager and involves
    two milestones, as follows:


    +   - **Setting up an overall GTM strategy**: Craft a master plan to promote and
    sell your application to eager customers

    +   - **Implementing a marketing plan**: Execute marketing initiatives, such as
    online promotions, events, and co-marketing with Salesforce, to put your app in
    the spotlight


    # Business track


    Lastly, focus on the operational and contractual aspects of becoming an AppExchange
    partner, ensuring your business runs as smoothly as your dance'
  merge: -1
  img_proc: true
- pgno: 89
  md: 'moves. Key milestones in this track include the following:


    +   - **Partner opportunity registration**: Make your interest in becoming a Salesforce
    partner official by registering and submitting your application

    +   - **Joining the Partner Community**: Gain exclusive access to Salesforce’s
    Partner Community, where resources, support, and networking opportunities await

    +   - **Signing the agreements**: Review and sign on the dotted line for necessary
    contracts, such as the **Salesforce Partner Program Agreement (SPPA)** and the
    **Partner Application Distribution Agreement (PADA)**

    +   - **Drafting the technology strategy**: Plan your technology roadmap and development
    plans for future performances

    +   - **Publishing the app on the AppExchange marketplace**: Take center stage
    by publishing your application on the AppExchange marketplace, making it available
    to Salesforce customers


    While the onboarding process may not always follow this exact order, these milestones
    will serve as a handy guide to navigating your journey as a Salesforce partner.
    By focusing on the technical, GTM, and business aspects of becoming an AppExchange
    partner, you can build a successful and thriving business within the Salesforce
    ecosystem—and look like a dance pro while doing it. The following diagram provides
