  md: '![](img/44ed632038957e4c80220676e84c5109_560_0.png)


    Think of technical debt like that credit card bill you’ve been avoiding. It starts
    manageable, but suddenly, you’re in over your head, and the interest is snowballing.
    It’s an intimidating sight, but don’t hit the panic button just yet


    There’s always that nuclear option – filing for bankruptcy. And in AppExchange
    terms, that’s a complete overhaul of your solution. It’s like finally admitting
    that you shouldn’t have bought that jet ski and starting fresh. But remember,
    just like in real life, this is a drastic measure. It comes'
  merge: -1
  img_proc: true
- pgno: 561
  md: 'with a steep price, and no, I’m not talking about legal fees or a dodgy credit
    score.


    Almost two decades ago, software engineer Joel Spolsky criticized Netscape for
    deciding to rewrite their code base in his influential essay, *Things You Should
    Never Do.*⁷ According to Spolsky, rebuilding a system from scratch underestimates
    the complexity and the subtleties of the existing system. He argued that the decision
    was a strategic mistake, leading to a 3-year gap between major releases and a
    significant loss in market share.


    7 https://www.joelonsoftware.com/2000/04/06/things-you-should-never-do-part-i/


    The temptation to start over is a common pitfall for software developers. The
    notion that the current code is a mess and would be better off being replaced
    entirely is often misguided. Spolsky emphasizes a fundamental law of programming:
    “*It’s harder to read code than to write it.*” This belief leads developers to
    want to craft their own solutions rather than understand and improve upon existing
    ones.


    But as Spolsky pointed out, the old code base is a treasure trove of knowledge,
    fixes, and real-world testing. It embodies the history of the product, the problems
    it has encountered, and how it has evolved to address those issues. By discarding
    the old code, you’re not only throwing away years of work but also the valuable
    lessons embedded within it.


    Starting over also creates a time and innovation gap, allowing competitors to
    surge ahead. It also results in the risky situation of maintaining an old code
    base while developing a new one, hampering your ability to respond to market changes
    quickly.'
  merge: -1
  img_proc: true
- pgno: 562
  md: 'For ISV partners, the implications are even more serious. A complete rebuild
    means publishing the solution as a new managed package, which, in turn, means
    migrating existing customers to this new package. The Salesforce platform doesn’t
    facilitate easy migrations of this nature. The process involves installing the
    new package and migrating all customer data related to your package. Given the
    local customizations that customers may have implemented, this task is fraught
    with difficulties.


    Moreover, your product doesn’t exist in a vacuum. As we’ll discuss in the next
    chapter, there is a continuous need for innovation. Choosing to support existing
    customers on the current version of your package, while developing the new one,
    means effectively splitting your attention and resources. In this scenario, it’s
    all too easy to neglect necessary updates and improvements to your existing product,
    affecting your customer churn rate negatively.


    Does this mean it’s always a poor decision to start a new package from scratch?
    Not necessarily. Take Salesforce, for example. They chose to sunset their original
    managed package, B2B Commerce for Visualforce, in favor of creating an entirely
    new product: B2B Commerce on Lightning Experience.


    Before embarking on a drastic measure such as rebuilding your entire solution,
    consider seeking a third-party expert’s opinion. A comprehensive audit of your
    current package could reveal alternative, less disruptive solutions to your technical
    debt problem. We’ll discuss more about the assistance of **Product Development
    Outsourcers (PDO)** partners, who can help tackle such challenges, in the upcoming
    chapter. This way, you can make an informed decision that best suits your product’s
    needs, and more importantly, the needs of your customers.'
