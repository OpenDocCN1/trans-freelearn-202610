- pgno: 479
  md: 'So, ISVs, it’s decision time. Fear not! You won’t be left alone at this crossroads.
    This guide is your trusty compass, highlighting the unique features of each path
    and guiding you to choose the one that aligns best with your business journey.


    # Restrictions with OEM Embedded apps


    It is crucial to bear in mind a significant limitation: OEM apps cannot utilize
    Checkout. Therefore, ISVs engaged in the development of OEM Embedded apps are
    left with no alternative but to choose the COA as the only viable option. This
    decision provides OEM partners with the necessary tools to distribute their Salesforce
    licenses to customers directly.


    # Decision points for ISVforce apps


    For ISVforce, the decision is less clear-cut, as both solutions are available
    for use. As you learned in this chapter, these are your options:


    +   - **CMA**: This solution is directly linked to Stripe for payment processing
    and allows for managing orders via AppExchange Checkout

    +   - **COA**: With the COA, you manually submit orders to Salesforce, which can
    provide a level of control necessary for complex or large customer deals


    Overall, the CMA can be a go-to solution for ISVs serving small businesses, especially
    those with a simple pricing model that aligns with the limitations discussed earlier
    in this chapter. It integrates smoothly with the LMA and'
  merge: -1
  img_proc: true
- pgno: 480
  md: 'Stripe, automating key processes such as upgrades, payment subscription changes,
    and revenue sharing. The streamlined functionality and hands-off approach of the
    CMA often make it the preferred choice. It’s important to note that most partners
    cater to mid-sized and enterprise customers, for whom mandatory payments through
    Stripe might be a sticking point.


    The COA, though often perceived as an older and more labor-intensive solution,
    retains its relevance, especially for businesses that routinely handle sizable
    customer contracts desiring a comprehensive package. With the advent of COA automation,
    some manual processes can be streamlined, making it more user-friendly and efficient.
    In scenarios where a comprehensive approach is needed, the COA becomes indispensable.
    It allows you to incorporate your Salesforce offering into a broader customer
    agreement. However, even with automation, it’s essential to note that certain
    modifications might still require manual intervention, which can be time-intensive.


    When you’re choosing between the CMA and the COA, consider your business model,
    customer needs, and the complexity of your deals. If simplicity and automation
    are your priorities, and all your customers accept payments via Stripe, the CMA
    is likely the best fit. If you need more control for larger, complex deals, the
    COA might be your go-to solution. Don’t forget, if you’re unsure, you can always
    contact your **Partner Account Manager (PAM)** to discuss this matter. Remember—it’s
    an either-or decision, so choose the one that best supports your business goals.


