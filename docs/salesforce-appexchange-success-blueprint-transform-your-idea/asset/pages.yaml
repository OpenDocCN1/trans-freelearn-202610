  md: 'when creating a new flow, while overridable flows automatically update references
    when an “overriding flow” is created.


    # BEST PRACTICE TIP


    *Include references to your packaged LWCs or invocable Apex methods within flow
    templates or overridable flows to educate customers on how to build their own
    flows using your features and functions.*


    # Offering IP-protected flows


    IP-protected flows are neither overridable nor templates and are useful for preventing
    customers from viewing or editing a flow, protecting IP, or preventing changes
    to an app’s behavior. Customers can still deactivate these flows, so consider
    using a code-based approach for logic that must always run.


    # Controlling the order of execution with flows – advantages of Trigger Order
    feature


    You can utilize the **Trigger Order** feature to set the order of execution for
    record-triggered flows, gaining better control over your automation processes.
    This feature is not available for Apex triggers, which can cause issues when your
    package has a trigger on an object and the customer also writes a trigger on that
    object, as it becomes non-deterministic which order the triggers will run in.


    # Setting Trigger Order on flows'
