    # Available technologies for outbound integrations


    Salesforce offers a range of tools and methods to facilitate outbound integrations
    with external systems. In this section, we will explore the most popular and widely
    used outbound integration techniques provided by the Salesforce platform.


    # Declarative with flows


    Declarative outbound integrations in Salesforce are primarily achieved using Flow.
    Salesforce Flow is a powerful tool that allows users to automate business processes
    without writing any code. Within the realm of outbound integrations, Flow offers
    two main methods: outbound messages and external services.


    Outbound messages are SOAP messages that Salesforce sends to external systems
    when specific criteria are met. They are designed to notify external systems of
    changes in Salesforce data. On the other hand, external services provide a way
    for flows to directly integrate with third-party APIs, supporting HTTP callouts
    with methods such as GET, POST, PUT, PATCH, and DELETE. When creating an external
    services package, developers can either add named credential components to the
    external service registration package or subscribers can establish a named credential
    in their org that matches the one indicated in the external service registration.


    # Programmatic with Lightning Web Components'
  merge: -1
  img_proc: true
- pgno: 254
  md: 'Lightning Web Components (LWC), while primarily designed for building dynamic
    user interfaces on the Salesforce platform, is also able to perform programmatic
    outbound integrations.


    LWC utilizes the modern Fetch API for making callouts to external services. This
    API provides a flexible and efficient way to fetch resources, be it over HTTP
    or HTTPS. The Fetch API in LWC allows developers to make asynchronous requests
    to external services. Developers can specify the request method (GET, POST, PUT,
    DELETE), headers, and body, and then process the response once it’s received.


    Before making a callout from LWC, it’s crucial to add the base URL of the API
    endpoint to the Content Security Policy (CSP) trusted sites in Salesforce.


    # Programmatic with Apex


    Apex, Salesforce’s proprietary programming language, stands as a cornerstone for
    developers aiming for a programmatic approach to outbound integrations. It offers
    a comprehensive suite of tools and methods to facilitate communication with external
    systems.


    HTTP and HTTPS callouts: Apex provides built-in classes to perform HTTP and HTTPS
    callouts to external services. These callouts allow Salesforce to integrate with
    virtually any web service, be it RESTful or SOAP-based.


    HttpRequest and HttpResponse classes: At the heart of Apex callouts are the **HttpRequest**
    and **HttpResponse** classes. The **HttpRequest** class allows developers to set
    various parameters of the request, such as the endpoint URL, method (GET, POST,
    PUT, DELETE), headers, and the request body. Once the callout is made, the response
    from the external service is captured in'
  merge: -1
