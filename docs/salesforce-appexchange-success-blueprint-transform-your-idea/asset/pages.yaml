  md: '+   - Create a new Trialforce template from the TSO

    +   - Associate the Trialforce template with the AppExchange marketplace


    Revving up the spaceship for a journey through the cosmos isn’t an overnight endeavor
    —it involves careful preparation and a series of meticulous steps. Much as with
    our space metaphor, setting up Trialforce also requires time and precision. It
    might take a few days before you can embark on your journey, but once you’ve cleared
    all checkpoints and everything is in place, you’ll be ready to set your very own
    “Trialforce spaceship” soaring.


    # Rolling out free trials


    You have a few options for dishing out free trials to prospective customers, as
    presented here:


    +   - **From Salesforce, through AppExchange**: Customers can kick off a trial
    directly from an AppExchange listing.

    +   - **Using HTML forms on your external website**: Upon a prospect submitting
    a form, Salesforce provisions a trial based on the Trialforce template. You can
    employ the `SignupRequest` API when using such a form.

    +   - **Employing the SignupRequest API independently**: This is for those who
    seek more refined customization. Trials can be activated programmatically.


    And there you have it, fellow space travelers! With these routes on your stellar
    map, you’re now ready to send your app into orbit, connecting with prospective
    customers in ways that are as varied and dynamic as the stars in our galaxy.'
