    # How to request data


    Efficiency is key when handling data in AppExchange App Analytics. While manual
    data requests might work for ad hoc needs, they could prove to be tedious in the
    long run. Package Visualizer is a handy tool for such spontaneous data requests,
    as detailed in Chapter 2 of this guide. However, to streamline your operations
    and ensure continuous insights, you should consider scheduling automated queries.


    # Scheduling and automating your queries'
  merge: -1
  img_proc: true
- pgno: 509
  md: 'The crux of automation is writing code that will create query request records
    on your schedule, monitor them, retrieve the data, and store your AppExchange
    App Analytics data for easy access. For instance, you can store the data in a
    custom object in your PBO.


    There are several automation options at your disposal, including the following:


    +   - Custom API integrations using REST or SOAP API calls

    +   - Salesforce DX automation using the CLI

    +   - Salesforce flows

    +   - Apex


    For example, you can automate the retrieval of package usage summaries using Apex
    scheduled jobs. As you get started, storing logs in your PBO org using Apex would
    be a sufficient approach. However, when you decide to automate the retrieval of
    package usage log data, which can significantly increase in volume over time,
    you should consider a more scalable storage solution, such as Heroku or **Amazon
    Web Services (AWS)**.


    # Automating log downloads using Apex


    To streamline the process of downloading logs, you can use Apex to create an automatic
    process. This will require you to develop a simple solution that should be capable
    of the following tasks:


    +   - **Regularly make AppAnalyticsQueryRequest requests:** This can be achieved
    through the implementation of a schedulable Apex class. This class allows you
    to specify the timing of when these requests should be made, helping to automate
    the process.'
  merge: -1
  img_proc: true
- pgno: 510
  md: '+   - **Download logs**: This involves performing an **HttpRequest**. This
    will retrieve the logs from the server and download them to your specified location.

    +   - **Parse retrieved CSV files**: Once the CSV files containing the logs have
    been downloaded, the next step is to parse them. This involves interpreting the
    data and transforming it into a more manageable format.

    +   - **Create PackageUsageSummary__c records**: After parsing the CSV files,
    you’ll use this information to create **PackageUsageSummary__c** records. These
    records can then be stored and used for further analysis.

    +   - **Write Apex unit tests**: Writing unit tests in Apex is critical to ensure
    the robustness and reliability of your solution. This helps you to detect and
    fix problems early, thereby improving the quality of your software.


    To help you kickstart this development, examples of the aforementioned steps are
    available at the following GitHub repository:

    https://github.com/developerforce/partner-intelligence-basics. Here, you’ll find
    samples and guides that you can use to set up your Apex implementation for automatic
    log downloads.


    # Managing data storage and using external solutions


    As the volume of your data grows, it might become challenging to store all of
    it in your PBO. In your base Salesforce setup, without buying any extra licenses
    or add-ons, you’re given 10 GB of data storage. This sounds like a lot, right?
    Well, to put it into perspective, this allows for roughly 5 million records. Now,
    is that a ton? Let’s think about it for a moment. Just considering 1 year of package
    usage summary logs from a single big client'
  merge: -1
  img_proc: true
- pgno: 511
  md: 'could tally up to over 1 million records. Now, keep in mind that package usage
    logs are much more granular. Plus, chances are you’ll have more than just that
    one client. So, while 5 million might sound like a big number, in the grand scheme
    of things, it can fill up quicker than you’d think!


    In such cases, you should consider using an external solution. For instance, you
    can leverage AWS to store and manage your data. AWS provides a scalable and secure
    environment for data storage, which can be particularly useful when dealing with
    large volumes of data.


    **PI-Labapp**, also known as **Partner Intelligence Starter Pack**, is a free
    application available via the Salesforce Labs program. It provides ISV partners
    with usage data about how users interact with their AppExchange solutions. This
    data can be instrumental in making informed decisions about feature development
    and identifying potential attrition risks. You can find it on AppExchange: https://appexchange.salesforce.com/appxListingDetail?listingId=a0N4V00000GmRaNUAV.


    To use the PI-LabApp application, you need a Salesforce PBO username with the
    API enabled and an existing AWS account. The application includes a **Log pull
    Config** object that stores the log pull configuration and a **Log pull Activity**
    object for tracking the log pull activity.


    The process of setting up PI-LabApp involves installing the package in your PBO
    org, assigning permission sets to users, and configuring the log pull records.
    After setting up Salesforce, you’ll need to configure AWS, which includes installing
    the stack and updating secret keys with PBO login credentials.'
  merge: -1
  img_proc: true
- pgno: 512
  md: 'Once the setup is complete, you should conduct manual testing to ensure everything
    works as expected. This involves creating log request records manually in Salesforce
    and running the step function in AWS. After successful testing, you can enable
    the Daily Log Pull job, which automates the process of pulling daily log files
    into the AWS **Simple Storage Service** **(S3)** bucket.


    Finally, to visualize the data, you need to set up AWS Athena. This involves running
    the Glue crawler to detect the Parquet table from the S3 bucket, running Athena
    queries, and creating views.


    # Planning your App Analytics query strategy


    The specifics of your query strategy depend largely on the size and scope of your
    business, as well as the data types you’re querying. The strategy you choose must
    align with your business requirements and goals. It should efficiently provide
    you with the insights needed to make data-driven decisions about improving UX,
    optimizing user flow, and enhancing feature adoption. The ultimate aim is to extract
    maximum value from AppExchange App Analytics, and a well-planned, automated query
    strategy is an essential step in this direction.


    # What if App Analytics isn’t enough?


    As businesses grow, their data and analytical needs evolve. Salesforce’s App Analytics
    is an excellent starting point for all ISVs aiming to understand their application’s
    performance and user behavior. However, there comes a time when the out-of-the-box
    analytics tools may not provide the granularity and depth of insights desired.'
  merge: -1
  img_proc: true
- pgno: 513
  md: 'In this case, you can aspire to devise your own fine-granular product usage
    analytics, looking to dive deeper than what traditional tools can offer. But is
    crafting a custom analytics solution always the answer?


    Indeed, there are notable big ISVs who have opted to create their own logging
    mechanism, utilizing external systems. Such undertakings are ambitious and can
    open a treasure trove of detailed insights. However, they come with their own
    set of challenges:


    +   - **Complexity and time consumption:** Crafting a bespoke analytics solution
    is no minor endeavor. Designing, developing, and implementing a tailored system
    can be time-consuming and fraught with unforeseen challenges.

    +   - **Security review concerns:** Salesforce has stringent security review protocols.
    A custom analytics solution would need to adhere to these protocols, and passing
    a security review can be a rigorous process.

    +   - **Data privacy and compliance:** Salesforce emphasizes data privacy. ISVs
    need to be cautious and understand rules around data privacy, especially when
    tracking user behavior at a detailed level.


    Given these considerations, before delving into the development of a custom solution,
    it’s essential to weigh the benefits against the costs and potential pitfalls.


    If you find yourself contemplating a custom solution, a valuable first step is
    to seek external expertise. Engaging with a **Product Development Outsourcer (PDO)**
    Partner can provide a fresh perspective on whether App'
