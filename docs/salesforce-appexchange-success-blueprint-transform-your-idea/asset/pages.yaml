    # Choosing the right contract for your business


    ![](img/44ed632038957e4c80220676e84c5109_78_0.png)


    Welcome to the Great Ice Cream Debate: ISVforce versus OEM contracts!

    Now that you’ve had a taste of both flavors, it’s time to choose the perfect scoop
    for your business. Let’s weigh up the sprinkles and cherries of each'
  merge: -1
  img_proc: true
- pgno: 79
  md: 'option so that you can make an informed decision on which contract suits you
    best.


    First, let’s consider the nature of your application and your target audience.
    If your app is the cherry on top of the Salesforce sundae, catering mainly to
    existing Salesforce customers, then the classic ISVforce contract is your go-to
    flavor. As an ISVforce customer, you can craft and sell your sweet creations on
    AppExchange, dipping into a variety of Salesforce technologies and resources.
    Plus, with lower revenue-sharing requirements and more flexibility in product
    development and support, the ISVforce route is a tempting treat.


    But what if your app isn’t strictly a Salesforce topping? If your target audience
    includes those who haven’t tasted the Salesforce goodness, then the OEM—our customizable
    cookie dough ice cream—might be the one for you. OEMs can resell a wider range
    of technologies and add-ons, whipping up custom-branded solutions to be sold directly
    to their customers. However, this unique flavor comes with a higher price tag
    in the form of revenue-sharing requirements and contractual sprinkles. When targeting
    customers who are not yet Salesforce users, it’s important to consider the additional
    responsibilities that come with org and environment setup and maintenance.


    As you ponder which partnership model to indulge in, consider the level of customization
    and integration needed, the support and maintenance requirements, and the marketing
    and sales resources provided by Salesforce. It’s crucial to taste-test the pros
    and cons of each model, as well as the revenue-sharing obligations and contractual
    nuts.'
  merge: -1
  img_proc: true
- pgno: 80
  md: 'Ultimately, the ideal partnership model is not a static choice but a dynamic
    decision tailored to your evolving business goals, needs, and resources. As you
    understand your application’s nature, target audience, and the level of customization
    and support required, you can adopt a partnership model that best propels your
    business forward. It’s noteworthy that partnerships aren’t rigid structures. They
    can, and sometimes do, evolve over time. Some partners have been seen to shift
    their contracts from one model to another, such as moving from OEM to ISVforce
    or vice versa, or even adopting both contracts simultaneously, to better align
    with their business needs. Just as in an ice cream empire, the key to successful
    growth and expansion is the flexibility to adapt to changing tastes and demands.


    # Blended model


    Sometimes, when you’re facing the tough decision between ISVforce and OEM Embedded
    contracts, you may feel like you have to choose between chocolate fudge and caramel
    swirl. But what if I told you that you could have both, in one delicious cone?


    In fact, ISVforce and OEM Embedded partnerships can work together in harmony to
    provide a comprehensive solution for your business (if the technical design of
    your application satisfies the constraints of both models). By leveraging the
    strengths of both partnership models, you can create a custom solution that caters
    to both existing Salesforce customers and those new to the platform.


    It’s important to carefully consider the technical implications of each partnership
    model before making a decision. Moreover, it’s strongly advised'
  merge: -1
  img_proc: true
- pgno: 81
  md: 'to have a conversation with the Salesforce ISV sales team about this issue
    since they possess valuable insights and can offer helpful guidance while selecting
    a contract. Ultimately, the right partnership model will depend on your business
    goals, needs, and resources, and may impact your technical architecture and application
    design in unique ways.


