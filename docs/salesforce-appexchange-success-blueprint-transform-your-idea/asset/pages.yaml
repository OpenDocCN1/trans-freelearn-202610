- pgno: 56
  md: 'So, what exactly do these ISV partners do on AppExchange? Let’s take a look:


    +   - **Enhancing Salesforce’s capabilities**: ISVs work to augment Salesforce’s
    existing functionalities. They focus on helping customers derive more value from
    the platform by extending and refining its features.

    +   - **Addressing specific needs**: These partners identify and address areas
    where Salesforce’s offerings might be limited or lacking. By developing solutions
    for these areas, they ensure that users have a more comprehensive and seamless
    experience with Salesforce.

    +   - **Providing industry-specific solutions**: ISVs specialize in creating apps
    tailored to particular industries or market segments. They offer targeted solutions
    that benefit businesses, regardless of their familiarity with Salesforce.


    But to truly succeed on AppExchange, partners must focus on three essential ingredients,
    as follows:


    +   - **Whipping up intellectual property (IP)**: By collaborating with Salesforce,
    partners have the flexibility to create innovative applications utilizing APIs
    or building their applications solely with Salesforce technology

    +   - **Packaging the app for success**: Like a beautifully wrapped gift, partners
    must market and sell their apps effectively to drive customer adoption

    +   - **Assembling a dream team**: By joining the partner program, partners need
    to allocate resources and personnel to ensure their apps reach their'
  merge: -1
  img_proc: true
- pgno: 57
  md: 'full potential, developing a long-term marketing, sales, and support strategy


    In the end, ISV partners are the lifeblood of the Salesforce ecosystem.


    # Different types of partners


    Salesforce categorizes its partners into different types, so let’s get some terms
    straight.


    Firstly, Salesforce recognizes two primary types of partners: ISVs and Consulting
    Partners. In this book, when I use the term “Partner”, I’m referring to ISVs by
    default. So, if you come across the term “Salesforce Partner” online and find
    information that doesn’t seem to pertain to you, this distinction is likely the
    reason.


    The line separating these two categories is straightforward: ISVs focus on developing
    AppExchange products, while Consulting Partners, often referred to as **System
    Integrators (SIs)**, offer consulting and implementation services tailored for
    Salesforce customers.


    But there’s another partner type worth noting: **Product Development Outsourcers
    (PDOs)**. PDOs provide consulting services specifically for ISVs. Essentially,
    if you’re an ISV looking for expertise in product development, a PDO is who you’d
    reach out to.'
  merge: -1
  img_proc: true
