  md: 'Mistakes happen, and when it comes to order submission in the COA, they can
    be rectified. Partners have the ability to recall any COA orders within 2 hours
    of the original submission. Any errors discovered after this grace period will
    require manual intervention via a case.


    Here are the steps to initiate the correction process via a case:


    +   1. **Log a case:** Begin the process by logging a case in the Partner Community.

    +   2. **Select a topic and subtopic:** Choose **Channel Order Application & Active
    Org Provisioning** as the topic and **Partner Order Errors and Revisions** as
    the subtopic.

    +   3. **Provide order details:** You will need to provide the incorrectly submitted
    service order number.

    +   4. **Identify the error:** Clearly identify the error in the order and state
    the correct change that you’d like to see within the order.

    +   5. **Justify the change:** Provide a justification as to why this order needs
    to be corrected. Keep in mind that edits are subject to Salesforce’s approval.


    Common errors in order submission can involve the wrong price, quantity, product,
    or future date being entered.


    # Automating the ISV order submission process using the COA


