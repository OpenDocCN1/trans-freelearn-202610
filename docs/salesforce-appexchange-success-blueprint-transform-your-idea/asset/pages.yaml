    Next, we have our “test drive.” The test drive is akin to taking a brief spin
    in a car on a designated track, supervised by the owner sitting beside you, where
    you can’t explore all its features, but you get a feel for it. In a like manner,
    the **Test Drive** feature also populates leads in the LMA.


    Then, we move to Trialforce, the extended hands-on experience. Imagine letting
