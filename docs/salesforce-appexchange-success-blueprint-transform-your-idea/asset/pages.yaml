    # Preparing false positive documentation


    In the process of conducting security scans for your application, you may encounter
    what are known as “false positives.” These are instances where the security tool
    reports a potential vulnerability, but upon further investigation, it turns out
    that the identified issue does not pose an actual security risk within the context
    of your application.


    It’s essential to document these false positives thoroughly. The documentation
    should provide a detailed explanation for each reported vulnerability that you
    have classified as a false positive. Your explanation should provide clear reasons
    why the identified issue does not represent a security risk for your application.
    It should also include any mitigating factors or security measures that are in
    place that prevent the reported vulnerability from being exploited.


    The false positive documentation serves as a reference during the security review
    process. It provides the Salesforce security team with your perspective and helps
    them understand your reasoning behind classifying certain reported vulnerabilities
    as false positives.


    Here are some steps to follow when preparing your false positive documentation:'
