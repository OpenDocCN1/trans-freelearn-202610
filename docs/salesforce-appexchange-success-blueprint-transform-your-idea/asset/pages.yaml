    # Versioning


    When submitting your application for security review, submit a point release (for
    example, 8.5 → 9.0, and so on), not a patch release. The Security Review system
    is designed to work with major and minor releases; patch releases are not supported.


    # Disclosing sensitive information in debug statements and URLs


    Avoid disclosing sensitive information in debug statements and URLs. Sensitive
    information, such as **personally identifiable information (PII)**, passwords,
    keys, and stack traces, can expose potential attack vectors. URLs can inadvertently
    store sensitive information in server logs, browser history, or search engine
    indexes.


    # TLS/SSL configuration


    Ensure your server supports and is configured to use secure cryptographic options.
    Weak ciphers such as SSLv2/SSLv3/TLSv1.0 should not be supported. At the time
    of writing, versions less than TLSv1.2 should be disabled.


    # Commented code


    While small snippets and samples are allowed in comments, full functions and classes
    that are commented out should be removed.


    # Password echo


    Avoid storing sensitive information in your application’s source code. This information
    can be easily accessed in clear text by anyone who has access to'
