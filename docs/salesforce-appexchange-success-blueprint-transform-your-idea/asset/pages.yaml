- pgno: 462
  md: '# Applying AppExchange Checkout to your business


    Implementing AppExchange Checkout requires certain steps. First, you need to set
    up an account with Stripe. Following this, a product and pricing plan should be
    created in your Stripe dashboard, setting the cost, currency, and billing frequency
    for your solution. Bank transfers can be enabled by requesting the payment method
    in Stripe. Upon approval, you can start receiving bank payments.


    You can then enable Checkout on your AppExchange listing. You can also preview
    the customer experience by modifying the AppExchange listing URL. To cater to
    international customers, ensure your company is in a country supported by Stripe.
    If required by your local tax authority, enable VAT in the Publishing Console.


    For heightened security, Checkout supports **Strong Customer Authentication (SCA)**,
    an identity verification step required for online payments in the **European Economic
    Area (EEA)**.


    # Managing subscriptions effectively


    AppExchange Checkout allows you to effectively manage subscriptions. You can handle
    customer requests related to Checkout subscriptions, such as viewing payment history,
    adding or removing licenses, and canceling subscriptions. This leads to improved
    customer service and satisfaction.'
  merge: -1
