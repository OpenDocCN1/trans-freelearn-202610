    # Integration secrets management


    When creating managed packages, securing integration secrets is a priority. Different
    Salesforce metadata types offer ways to store and manage these secrets, including
    named credentials, external credentials, and protected custom metadata types.
    In this section, we will explore each of these options, and provide insight on
    why protected custom metadata types are the most secure and suitable choice for
    most managed packages.'
