- pgno: 384
  md: 'As you have already learned in *Chapter 2*, the LMA is an incredibly powerful
    Salesforce tool that allows ISVs to manage leads, licenses, and usage for their
    AppExchange packages. In this section, we will revisit the LMA and focus on its
    use for monitoring different versions of your package in use by customers.


    # Delving deeper into the LMA


    The LMA doesn’t just allow you to manage licenses; it also provides crucial real-time
    insights regarding the deployment and usage of your AppExchange packages. This
    data includes the package version installed, the type of Salesforce org it’s installed
    in (production or sandbox), and the status of the license.


    These insights can be instrumental in determining how many customers are using
    specific legacy versions of your package. This knowledge is precious when you
    need to make decisions regarding feature enhancements, deprecations, or fixing
    bugs specific to particular versions.


    # Keeping track of package versions


    By default, Salesforce populates the LMA records in your **Partner Business Org
    (PBO)** every time a customer installs or upgrades your package. This automated
    process allows you to accurately monitor which versions of your package are in
    use across your customer base.


    You can create custom reports in the LMA housed within your PBO, using standard
    Salesforce reporting tools. By adding details such as Lead or Account to your
    report, you can pinpoint the version of a package a customer has installed, be
    it in a trial org or a production one.'
  merge: -1
  img_proc: true
