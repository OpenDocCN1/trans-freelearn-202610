- pgno: 368
  md: 'The **Push Upgrade** API is the enabler behind this convenient process. It
    is the technology that brings the entire operation to life, allowing developers
    to schedule and manage push upgrades programmatically.


    The API offers various features that help control and streamline the push process,
    including the following:


    +   - **Scheduling push upgrades**: You can use the API to schedule a push upgrade
    job for a particular date and time, ensuring your customers receive updates as
    per your release timeline.

    +   - **Batch control**: The API allows you to set batch sizes, determining how
    many subscriber orgs will receive the upgrade in each batch. This is beneficial
    when managing large customer bases, enabling a smoother transition and reducing
    the risk of overwhelming your resources or your customers’ orgs.

    +   - **Status checks**: The API provides options to monitor the status of your
    push jobs, providing insights into how many orgs have been upgraded, which are
    in progress, and if any have encountered issues.

    +   - **Version selection**: The Push Upgrade API lets you select a specific version
    of your package to push. This means you can control the exact updates each customer
    receives.

    +   - **Selective targeting**: The Push Upgrade API goes even further by introducing
    advanced targeting options. You can customize upgrades based on specific organizational
    needs, including directing upgrades to sandboxes, production orgs, or particular
    versions. Plus, upgrades can be selectively pushed to specific orgs, enabling
    highly personalized deployment.'
  merge: -1
  img_proc: true
