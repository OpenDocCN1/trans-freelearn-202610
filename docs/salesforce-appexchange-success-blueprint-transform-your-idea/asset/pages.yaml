    # Activity summary


    The activity summary section in AppExchange Marketplace Analytics provides key
    metrics about your listing. It includes a summary of tile views, tile hovers,
    visitors, lead events, and installs. Trend indicators compare metric performance
    to a previous time period. By default, Marketplace Analytics shows metrics for
    the past 30 days, but you can choose another fixed time period or define a custom
    date range.


    # Filters


    AppExchange Marketplace Analytics offers global and local filters to focus on
    relevant data. Global filters apply to data in the activity summary and all visualizations,
    while local filters apply only to data within a single visualization. You can
    select a specific listing or a fixed time period to analyze, choose traffic sources
    to show in the visualization, select activity metrics to display, types of lead
    events to show, or AMP promotions to display.


    # Visualizations


    AppExchange Marketplace Analytics provides various visualizations to track trends
    and identify opportunities for your listing. One such visualization is'
  merge: -1
