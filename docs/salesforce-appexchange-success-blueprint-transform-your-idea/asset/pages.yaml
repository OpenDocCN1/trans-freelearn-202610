- pgno: 128
  md: 'The JTBD theory is like an adventurer’s compass, guiding us toward the hidden
    treasures of customer needs. It provides a framework for categorizing, defining,
    capturing, and organizing the six types of customer needs, which are essential
    for creating innovative and successful products and services.


    # The core functional JTBD


    Imagine the core functional job as the treasure we seek on our map. It’s the primary
    task your customers aim to accomplish or the chief challenge they desire to overcome
    with your AppExchange application. For example, a task management app may address
    the core job of managing tasks efficiently. Grasping this core functional job
    equips us to create applications that directly tackle our customers’ main needs
    and enhance their user experience.


    # Desired outcomes on the core functional job


    Having found our treasure, i.e., the core functional job, we focus on the desired
    outcomes. Think of these as the jewels encrusting our treasure — these are the
    criteria your customers use to gauge success while executing the core functional
    job. For example, there are a few AppExchange apps that aid in improving sales
    performance – a desired outcome for sales-driven organizations. Recognizing and
    catering to these desired outcomes helps us fashion applications that not only
    meet but exceed customer expectations.


    # Related jobs


    Related jobs are akin to the side quests our customers undertake either before,
    during, or after the core functional job. Identifying these quests, such as tracking
    time spent on each task in a task management app, and incorporating them into
    our application design can enrich our offerings, making them more comprehensive,
    valuable, and enticing to customers.


    # Emotional and social jobs'
  merge: -1
  img_proc: true
- pgno: 129
  md: 'Beyond sheer functionality, customers harbor emotional and social needs associated
    with using your application. Emotional and social jobs illustrate how customers
    aspire to feel or be perceived while carrying out the core functional job. An
    app, which enhances document generation, could make customers feel more efficient
    and productive, addressing their emotional job. Meeting these needs can foster
    solid emotional connections and breed customer loyalty.


    # Consumption chain jobs


    Consumption chain jobs are tasks performed by your support team throughout your
    application’s lifecycle, from installation to maintenance, and eventual disposal.
    Taking care of these jobs, such as Ask Your Document does with its easy setup
    and integrations for their tool, can boost the overall customer experience, crafting
    a sense of lasting satisfaction.


    # Financial desired outcomes


    Finally, the financial desired outcomes serve as the monetary and performance
    metrics your customers depend on when choosing which AppExchange application to
    install. By understanding these outcomes, we can construct compelling value propositions
    that resonate with our target audience, ensuring our application is the treasure
    they’ve been seeking on their AppExchange map.


    # Why would someone hire your product?


    The JTBD framework helps you understand that customers “hire” products or services
