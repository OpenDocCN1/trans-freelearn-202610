    # Custom Property Editors (CPEs)


    Some actions and components can be quite complex, requiring administrators to
    refer to the documentation for proper configuration. CPEs provide a solution for
    creating tailored UIs for admins working with custom Flow screen components and
    Apex actions. To fully understand the benefits of CPEs, we must first examine
    what they are and how they work.


    CPEs are LWCS that can be integrated with custom Apex actions or Flow screen components.
    These editors can be as sophisticated as needed, depending on the requirements
    and design vision.


    ISVs can take advantage of CPEs to create dynamic, compact, reactive, user-friendly,
    and visually appealing UIs for complex screen components and Apex actions. Custom
    validation can be enforced using CPEs, which is particularly useful for implementing
    input-based conditional validation. This reduces errors caused by incomplete settings
    and insufficient data, resulting in fewer Flow metadata errors. Configuring a
    component or action becomes easier for end users, primarily administrators, with
    the help of CPEs.'
