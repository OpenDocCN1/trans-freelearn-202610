    # The AppExchange sweet spot – where applications thrive


    Based on the examples and discussions in this chapter, the ideal applications
    for AppExchange are those that do the following:


    +   - Provide unique solutions and benefits for Salesforce users. You cannot just
    build a clone of Sales Cloud or Service Cloud!

    +   - Streamline business processes, increase efficiency, and improve customer
    satisfaction.

    +   - Leverage the Salesforce platform and ecosystem to deliver customized solutions
    to businesses of all sizes and industries.

    +   - Meet Salesforce’s security, privacy, and usability standards.

    +   - Align with the Salesforce platform’s strengths and limitations, such as
    web-based applications, integrations with other systems, and cloud-based solutions.


    By building applications that meet these criteria, you can take advantage of the
    benefits of becoming an ISV partner and leverage the potential of AppExchange
    to expand your customer base, generate recurring revenue streams, and gain visibility
    and credibility within the Salesforce ecosystem.'
  merge: -1
  img_proc: true
- pgno: 66
  md: '# Examples of applications that are not a good fit for the Salesforce platform


    While Salesforce offers a range of tools and features for building custom applications,
    some application types may not align with the Salesforce platform’s strengths
    or limitations. Here are some examples:


    +   - **Gaming applications:** The Salesforce platform is primarily designed for
    business applications and may not be the best fit for gaming applications that
    require high-performance graphics and processing capabilities.

    +   - **Resource-intensive applications:** The Salesforce platform may not be
    suitable for applications that require extensive computing resources or real-time
    processing, such as complex **machine learning (ML)** or data analysis applications.
    AppExchange products should not attempt to carry out this processing on-platform
    but rather integrate with systems better positioned to handle complex processing
    use cases. Just so you know, in the Salesforce ecosystem, there are other options
    available. For instance, Heroku provides a robust platform specifically designed
    to handle resource-intensive computing tasks. Additionally, Salesforce offers
    its own proprietary AI solutions that are capable of effectively addressing advanced
    data processing needs.

    +   - **Standalone desktop applications:** The Salesforce platform is cloud-based
    and primarily designed for web-based applications. Standalone desktop applications
    that require offline functionality may not be a good fit for the Salesforce platform.

    +   - **Custom hardware applications:** Applications that require custom hardware
    or integration with physical devices may not be a good fit for'
  merge: -1
  img_proc: true
- pgno: 67
  md: 'the Salesforce platform, as it primarily focuses on software-based solutions.


    By understanding the limitations of the Salesforce platform, you can make informed
    decisions about whether it is the right choice for your application idea. If your
    application falls outside the scope of the Salesforce platform, you may need to
    explore alternative technologies or platforms that better align with your requirements.


    # Software-as-a-Service products for Salesforce customers


    Additionally, the AppExchange marketplace accepts **Software-as-a-Service** (**SaaS**)
    products that integrate with Salesforce and provide unique solutions for Salesforce
    users. These SaaS companies can also become AppExchange partners and list their
    products on the marketplace, highlighting their partnership with Salesforce and
    the security of their applications. However, becoming an AppExchange partner with
    a paid-for app listing requires sharing a **percentage of net revenue (PNR)**
    with Salesforce, which is why some companies have chosen not to become partners.
    Companies need to evaluate the business implications of becoming a partner despite
    the straightforward technical aspect of going through a security review. While
    this book focuses on building applications on the Salesforce platform, integrating
    with Salesforce through SaaS products offers businesses a variety of solutions
    and applications, both on and off the platform, to customize and extend their
    Salesforce instance based on their unique requirements.'
  merge: -1
  img_proc: true
- pgno: 68
  md: '# Understanding ISVforce and OEM differences


    ![](img/44ed632038957e4c80220676e84c5109_68_0.png)


    The Salesforce ISV partnership world is like an ice cream shop, and you’re here
    to choose the perfect flavor for your business. In one corner, we have ISVforce
    contracts, and in the other, we have OEM contracts. Both are delicious, but which
    one suits your taste buds best? Let’s dig into the details to help you make the
    right choice.'
  merge: -1
  img_proc: true
- pgno: 69
  md: '# Program build type – ISVforce


    ISVforce partners are like the classic vanilla flavor of the Salesforce dessert
    world. They whip up applications built on the Salesforce platform, ready to be
    savored on the AppExchange menu. ISVforce partners can sprinkle in tasty toppings
    (think third-party integrations) and serve up a delightful customer experience.
    However, they must share a scoop of their revenue with Salesforce and comply with
    the platform’s development guidelines.


    ISVforce encompasses several key aspects, which include the following:


    +   - Crafting and selling appetizing applications on the Salesforce platform
    to *existing* Salesforce users

    +   - Customizing and extending applications within the Salesforce ecosystem

    +   - Sharing a PNR with Salesforce

    +   - Complying with Salesforce’s development guidelines and best practices


    # Why choose ISVforce?


    ISVforce is like the crowd-pleasing main course at a Salesforce banquet. These
    applications typically expand Salesforce’s functionality in some way—namely, they’re
    the delectable side dishes that complement the main entrée within the ecosystem.
    Many app creators realize that a significant number of their customers and prospects
    are already feasting at the Salesforce table, and they want to bring their culinary
    creations where their target market is. Typically, this involves enhancing the
    Salesforce Cloud offering (such as Sales, Service, Community, or Industry Clouds)
    in a manner that benefits both the partner and Salesforce.'
  merge: -1
  img_proc: true
- pgno: 70
  md: 'Another tantalizing aspect of ISVforce is that customers of ISVforce can whip
    up their own creative concoctions by extending their application through custom
    objects. This added flexibility and scalability act as a secret ingredient that
    significantly expands your total market opportunity, providing a level of versatility
    that is not typically achievable with the OEM Embedded solution. While OEM customers
    can create up to 10 custom objects for integration purposes, the usage of these
    custom objects is strictly regulated to ensure that OEM customers are not building
    custom applications beyond established boundaries.


    If you’re crafting an application that relies on functionality within specific
    licenses (for example, Customer Communities), the customer must purchase the license
    from Salesforce before they can savor your app.


    # Program build type – OEM Embedded


    OEM is like a unique, customizable cookie dough ice cream. These partners embed
    Salesforce technology into their own solutions, creating custom-branded offerings
    for their customers. The beauty of OEM partnerships lies in the freedom to create
    unique UXs and sell solutions directly without the obligation to list them on
    AppExchange. However, it’s important to mention that while ISV partners are not
    obligated to publish on the AppExchange marketplace, some OEM partners do opt
    to have their applications listed on AppExchange. Regardless of listing status,
    OEM partners are still required to share a portion of their revenue with Salesforce.


    OEM Embedded encompasses several key aspects, which include the following:'
  merge: -1
  img_proc: true
- pgno: 71
  md: '+   - Embedding Salesforce technology into custom-branded solutions

    +   - Building on top of the Salesforce platform, *without any references* to
    other products such as Sales, Service, Marketing, Commerce, or Industry clouds

    +   - Sell directly to customers (even without an AppExchange listing!)

    +   - Share a higher PNR with Salesforce


    As you savor these two flavors, keep in mind your business goals and requirements.
    For example, some successful Salesforce partners have opted for the OEM flavor,
    gaining the opportunity to resell additional technologies and add-ons unavailable
    to classic ISVforce.


    # Why choose OEM Embedded?


    OEM Embedded applications have a primary focus on revolutionizing the infrastructure
    within specific industry verticals such as healthcare, finance, manufacturing,
    and more. These applications have the ability to attract a diverse range of customers,
    whether or not they are currently using the Salesforce platform. It’s important
    to highlight that OEM Embedded solutions can also generate interest from new users
    within existing Salesforce customer organizations. For example, an HR department
    that is not currently utilizing Salesforce may opt to purchase an OEM product
    to meet their specific needs, while other departments such as Sales may already
    be regular users of Sales Cloud.


    The benefit of OEM-embedded applications is the freedom to sell not only to existing
    Salesforce customers but also to a broader audience. Existing Salesforce customers
    can easily discover, purchase, and install OEM'
  merge: -1
  img_proc: true
- pgno: 72
  md: 'Embedded applications from the AppExchange marketplace, similar to how they
    would with an ISVforce application. Furthermore, for new customers, it is possible
    to provision a new Salesforce org for them using the Trialforce technology, without
    the requirement of directly connecting them to Salesforce. It’s important to note
    that OEM customers receive an OEM Salesforce platform license, which is specifically
    tailored for the use of the OEM application.


    Unlike ISVforce solutions that require the purchase of an additional license from
    Salesforce, OEM Embedded applications only have two specific types of licenses
    that can be made available to customers, as follows:


    +   - **Lightning Platform (required)**: Allows customers to utilize the Salesforce
    platform, which is also identified as the Salesforce Platform license. However,
    it’s important to note that licenses obtained from OEM partners are specifically
    intended for accessing and utilizing the partner solution. In order to broaden
    the capabilities of the partner solution, end users are permitted to create, access,
    and employ an additional 10 custom objects per solution. However, these custom
    objects are restricted to use solely with the partner solution. Please note that
    these contractual limits aren’t automatically enforced. It’s on the customer to
    make sure they don’t set up more than 10 custom objects or use them in ways that
    aren’t permitted.

    +   - **Customer Community (optional)**: Enables customers or partners of the
    OEM customer to access a designated portion of the OEM application, facilitating
    interactions with their data.'
  merge: -1
  img_proc: true
- pgno: 73
  md: 'Ultimately, the decision between ISVforce and OEM contracts depends on various
    factors, including your business’s appetite for customization, access to additional
    technologies, revenue sharing, and the existing user base within your **go-to-market
    (GTM)** strategy. It’s crucial to consider whether your target users already have
    Salesforce licenses or not, as this can significantly impact the suitability and
    alignment of either option with your business objectives. However, the decision
    comes with a trade-off: OEM partners are required to share a higher PNR with Salesforce,
    compared to ISVforce.


    # Programs comparison


    In the following table, we will explore and compare the key features and distinctions
    between ISVforce and OEM Embedded, covering aspects such as their overview, target
    market, pricing, payment basis, products, reselling eligibility, and restrictions
    on Salesforce objects:


    | Feature | ISVforce | OEM |

    |---|---|---|

    | Overview | Extend functionality of Salesforce products and build integrations
    with CRM objects | Apps sold to both current Salesforce and non-Salesforce customers
    |

    |  |  |  |'
