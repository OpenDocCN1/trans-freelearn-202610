- pgno: 267
  md: 'Navigating the maze of API development and deployment, certain pitfalls can
    challenge the journey:


    +   - Versioning Issues: A glaring omission of versioning can instigate considerable
    challenges, especially when your product evolves and modifications to the REST
    endpoint become inevitable. When existing users are tethered to an older version,
    it can lead to the cumbersome creation of near-identical REST endpoints. A remedy
    is the embedding of version numbers within the urlMapping, for instance, `@RestResource(urlMapping=''/AccountsList/v1/*'')`.
    Instituting this pattern from the inaugural version wards off future complications.

    +   - Information Disclosure Vulnerability: A subtle leak, such as disclosing
    system or debugging data, can offer adversaries insights, potentially facilitating
    attack strategies. Such leaks typically ensue when the system or debugging data
    inadvertently seeps through an output stream or logging mechanism. To fortify
    against this, craft custom error messages, being diligent in masking intricate
    details such as stack traces, path information, or any debug data. It’s essential
    to remedy any such vulnerabilities across all APIs. This vulnerability can be
    a reason to fail a security review, a topic we will delve deeper into in the next
    chapter.


