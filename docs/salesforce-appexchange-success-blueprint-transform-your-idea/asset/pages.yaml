    # Push upgrades – a brief overview


    Push upgrades are a unique feature of Salesforce AppExchange, designed to provide
    managed package developers with an automated mechanism to roll out updates or
    enhancements to their customers. This not only ensures that all customers are
    using the most up-to-date version of your application but also saves them from
    the hassle of manually installing new package versions.


    # Push Upgrade API'
  merge: -1
