  md: 'To address such requirements, the optimal solution is to design a configuration
    wizard. Typically, this is a simple Lightning Web Components (LWC) interface that
    offers administrators an avenue to update or configure the necessary details without
    accessing the complete metadata. With this interface in place, the administrators
    provide the necessary data, and your Apex code then securely saves this information
    to the protected custom metadata.


    # Security pitfalls


    While the configuration wizard offers enhanced flexibility for administrators,
    it’s essential to remain cautious about potential security pitfalls. A key concern
    that developers and administrators should be aware of is the vulnerability known
    as “password echo.” Passwords or any sensitive data should never be echoed back
    to the user once entered, as this is a telltale sign of insecure storage. Ideally,
    passwords should be stored using methods that involve hashing and salting, ensuring
    that even the system itself is unaware of the plaintext version, rendering a password
    echo practically impossible. Additionally, fields containing sensitive data, such
    as **Consumer Key** and **Consumer Secret**, should remain concealed from view.
    Administrators might need to see these values when inputting them initially in
    the configuration wizard, but they should not have access to them during subsequent
    interactions or editing. Furthermore, always remain vigilant about where the data
    is logged. Ensuring that sensitive details do not inadvertently appear in debug
    logs, JavaScript logs, or other unintended storage points is paramount to maintaining
    the security integrity of the system. Such'
