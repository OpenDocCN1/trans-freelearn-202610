    perceived values and price sensitivities. This section will explain how to segment
    your market and set different prices for different segments, a strategy known
    as price discrimination.


    # Segmenting your market


    Market segmentation involves dividing your customers into distinct groups based
    on shared characteristics, such as industry, company size, or job role.'
