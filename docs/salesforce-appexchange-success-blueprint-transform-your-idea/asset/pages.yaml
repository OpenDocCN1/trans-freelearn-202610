- pgno: 225
  md: 'CPEs can be designed to create self-documenting UIs, eliminating the need for
    users to consult a separate reference document.


    # Building a CPE


    The process of building a CPE consists of three main steps: creating an Apex action,
    creating the CPE itself, and connecting the Apex action to the Property Editor.
    Here is a brief overview of each step:


    +   1. **Create an Apex action:** Define the logic for the custom action, including
    input and output variables, using Apex code.

    +   2. **Create the CPE:** Develop an LWC that serves as the custom UI for configuring
    the Apex action. This involves creating an HTML file for the UI structure, a JavaScript
    controller for handling user interactions, and an XML file for metadata configuration.

    +   3. **Connect the Apex action to the Property Editor:** Update the Apex action
    with an `@InvocableMethod` annotation that specifies the CPE’s LWC. This connection
    allows the custom UI to override the default editor, UI, and input parameters
    for the Apex action.


