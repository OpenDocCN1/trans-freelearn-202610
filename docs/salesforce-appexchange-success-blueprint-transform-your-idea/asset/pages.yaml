  md: '![](img/44ed632038957e4c80220676e84c5109_408_0.png)


    **Test Drive** is a signature feature of the Salesforce AppExchange marketplace,
    acting as your launch pad to give prospective astronauts (I mean, customers) a
    taste of what it’s like to commandeer your spaceship—uh, application! It comes
    equipped with a fully loaded sample data module, making it as ready as a spaceship
