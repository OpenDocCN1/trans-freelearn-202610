    # Burp Suite


    Burp Suite is another tool used for scanning external endpoints. It requires a
    download, and Salesforce doesn’t provision Burp Suite licenses for security review.
    If you need to use it, you will need to purchase a license independently.


    However, bear in mind that different tools might assign different severity levels
    to identified vulnerabilities. Any vulnerability marked with a severity level
    of High+ should be addressed or documented, explaining why it won’t be fixed as
    part of the false positive document.


    # The challenge with commercial APIs


    When preparing a managed package for security review, it’s customary to evaluate
    external systems using tools such as Chimera, ZAP, or Burp. This process, however,
    presents several challenges if you don’t own the external system but use one of
    the commercial APIs. Firstly, embedding Chimera tokens or obtaining explicit permission
    for a scan is often not feasible. Secondly, many commercial API providers are
    presumed to have stringent security measures already in place. Lastly, expecting
    these providers to'
