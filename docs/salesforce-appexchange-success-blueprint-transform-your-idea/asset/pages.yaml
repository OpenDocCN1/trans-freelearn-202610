- pgno: 379
  md: 'It’s not exactly the most appealing dining experience, and it could turn into
    a kitchen nightmare if you don’t catch it early on.


    This troublemaker is one of the pepperoni-sized challenges that organizations
    often face: managing customers using legacy versions of their applications. It’s
    like trying to convince someone that the pizza they ordered and have been eating
    is not as good as the one you just pulled out of the oven. Ignoring this issue
    is like leaving a pizza in the oven too long—it could potentially snowball into
    a burnt mess that’s not only heartbreaking to look at but also expensive and painful
    to clean up.


    # Customers using different legacy versions


    Maintenance of numerous versions of an application is highly time-consuming and
    costly. A single critical bug could necessitate building multiple patches, maintaining
    various branches in the repository, and orchestrating complex customer communication.
    Moreover, customers often resist push upgrades due to apprehensions about breaking
    changes and a desire to control the upgrade timeline—often to train their end
    users. This issue can be bifurcated into two categories—technical and behavioral.


    # Technical solution – separating deployments from releases


    The key is to distinguish between deployments and releases. Deploying involves
    moving code and configuration from one environment to another while releasing
    means making that code and configuration accessible to users. Though release depends
    on deployment, it is entirely feasible to deploy without releasing, by “hiding”
    those features from users until they are ready to use them.'
  merge: -1
  img_proc: true
- pgno: 380
  md: 'This separation forces teams to ponder about deploying features without impacting
    the system, hence promoting good design, reversibility, and controlled impact
    of changes. In essence, it’s about “reducing the blast radius” of each alteration,
    a crucial capability to foster DevOps within your team.


    Additionally, consider enhancing the **License Management App (LMA)** with the
    FMA, described in [Chapter 2](Chapter 2). Feature parameters are represented as
    Metadata API types in your packaging org and as records of custom objects in your
    subscriber’s org. You can reference these values in your code, similar to how
    you reference any other value in a customer’s org.


    # Behavioral solution – proactively managing expectations


    A part of onboarding new customers should involve managing their expectations
    about the fully automated release process. This challenge is akin to the adoption
    of new systems and technologies. If we can alleviate the fear of releasing new
    versions automatically by demonstrating the stability and predictability of the
    software, the advantages of using the latest version should push customers in
    the right direction.


    Bear in mind that this is not a temporary fix but a strategic transition that
    should be planned in advance and communicated to all customers with a realistic
    timeline. From my consulting experience, a mid-size ISV affected by this issue,
    depending on the number of customers using legacy versions, needs on average a
    2–4-year timeline to solve this issue. It’s best to do it right from the start.


    # Benefits of addressing this issue'
  merge: -1
  img_proc: true
- pgno: 381
  md: 'By tackling this problem head-on, you substantially limit the scope of what
    needs to be maintained by the engineering team and supported by the customer service
    team. Ideally, there should only be two versions of any app to maintain: a stable
    one (currently used by all customers) and a newly built one (awaiting approval).
    This is a significant step toward increasing the release frequency.


    This strategy would also improve several DevOps **key performance indicators (KPIs)**
    such as lead time (from code committed to code deployed), deployment frequency
    (to production), **Mean-Time-to-Restore** or **MTTR** (from a production failure),
    and release manager’s workload.


    In conclusion, preemptively addressing potential pitfalls in release management,
    especially when dealing with legacy versions, not only streamlines your operations
    but also fosters a sense of trust among your customers, boosting their confidence
    in your ability to deliver seamless updates and maintain application integrity.


    # Contractual clauses and support fees


    An important factor to consider when aiming to keep your customers on the latest
    version of your software is to manage expectations from the beginning, and this
    can be facilitated by terms and conditions in the contract you form with them.


    # Including upgrade terms in the contract


    When onboarding new customers, it is advisable to include a clause in the agreement
    stating that customers consent to automatic push upgrades. This'
  merge: -1
  img_proc: true
- pgno: 382
  md: 'clause ensures that your customers are aware they will receive the latest versions
    of your application as soon as they are available.


    This kind of clause can serve two primary purposes, as follows:


    +   - It sets a clear expectation that the customer’s installed software will
    stay up to date with the latest features and security patches.

    +   - It allows you to maintain only the latest versions of the software, reducing
    the overhead and cost of supporting multiple older versions.


    # Applying extra support fees for legacy versions


    Even with contractual clauses, there may be cases where customers are hesitant
    or outrightly decline to move to the latest version of the software. They may
    prefer to stick to an older, familiar version. In such cases, to compensate for
    the additional support and maintenance costs associated with supporting multiple
    legacy versions, you can apply an extra fee for support of these older versions.


    The rationale behind this approach is to cover the extra costs associated with
    maintaining and supporting multiple older versions of your software. While it
    is crucial to respect the customer’s choice, it is equally important to ensure
    that your organization’s resources are utilized optimally.


    By having these provisions in place from the start, it is much easier to manage
    expectations and ensure that customers are utilizing the latest, most secure,
    and feature-rich version of your app. Not only does this strategy help in providing
    a better service to your customers, but it also significantly reduces the complexity
    and cost associated with supporting and maintaining multiple older versions.'
  merge: -1
  img_proc: true
- pgno: 383
  md: '# Justifying support costs – the financial calculations


    When facing additional support costs tied to maintaining a dedicated version for
    a specific customer, it’s crucial to have a clear picture of what that financial
    burden looks like. It’s like being on a tightrope, and balance is the key. You
    want to provide the best service to your customer, but not at the cost of sinking
    your own ship.


    In most mid-sized organizations, the task of running these numbers falls within
    the purview of your **Chief Technology Officer (CTO)** and **Chief Financial Officer
    (CFO)**. They should be able to jointly crunch these numbers, balancing the technical
    implications with the financial realities.


    For those of you in smaller start-ups, where your “CTO” might just be in reality
    your lead developer with an impressive title on the business card, don’t worry.
    There’s always the option of bringing in an external expert to help with these
    calculations. They’ll be able to offer an unbiased perspective based on your costs
    of development and the typical life cycle of software development. I’m going to
    show you some options in *Chapter 12*.


    Regardless of how you come up with the figure, the aim remains the same. This
    number will serve as the backbone of your business offering. It will give you
    a solid ground to stand on when explaining to your customers why it’s in their
    best interest (and yours) to use the latest version of your app. It’s like saying,
    “Trust me, I’ve done the math!”. And who can argue with that?


