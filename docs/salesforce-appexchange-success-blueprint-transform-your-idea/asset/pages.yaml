- pgno: 278
  md: '# Canvas SDK


    Salesforce Canvas SDK is a mature and robust tool designed to integrate external
    web applications seamlessly with Salesforce. This technology establishes a bridge
    between Salesforce and other platforms, offering a diverse range of options for
    effective UI integrations. While canvas apps open a plethora of opportunities,
    understanding their strengths, limitations, and suitable use cases is key to leveraging
    their full potential.


    # Inherent challenges and benefits of Canvas SDK


    Canvas SDK, despite being a powerful tool, confronts a significant challenge concerning
    UI and UX consistency. Since it brings the external system’s user interface into
    Salesforce, this may not always align with Salesforce’s native UI and UX conventions
    seamlessly. This difference can deter ISVs aiming for a consistent user interface
    experience across their applications. As a result, even though Canvas SDK is a
    mature and capable technology, its adoption rate among ISVs has not been as widespread
    as might be expected.


    However, Canvas SDK offers several significant benefits, making it an attractive
    option under the right circumstances. One of the main advantages is the potential
    for lower development costs, especially if an interface for the external system
    already exists. This benefit can be a substantial advantage when compared to building
    a custom user interface in a managed package and integrating it via APIs.


    Moreover, the Canvas SDK can simplify operations within a connected app framework,
    eliminating the need for maintaining two related code bases – one'
  merge: -1
  img_proc: true
- pgno: 279
  md: 'for the managed package and another for the external system. By reducing the
    number of code bases, developers can streamline their workflows and decrease the
    overall complexity of the system.


    # Aura versus Visualforce versus LWC


    Developers have two main options when it comes to exposing a canvas app within
    Salesforce: Aura components and Visualforce, each with their unique strengths
    and limitations. Visualforce allows for importing the Canvas JavaScript SDK to
    handle Canvas events. On the other hand, Aura components can maintain the Salesforce
    Global Navigation Header using the `lightning:isUrlAddressable` feature. It’s
    important to note that as of 2023, **Lightning Web Components (LWC)** does not
    support Canvas, restricting the options for using this technology within the Salesforce
    ecosystem.


    # Canvas application configurations and packaging dilemmas


    Key configurations for a canvas app, such as OAuth enablement, canvas app URL,
    access method, and locations, are managed within the connected app. Developers
    also have the option to use a Canvas Lifecycle handler to manage additional aspects
    of the canvas app during runtime.


    Canvas apps, while offering several benefits, are not frequently used due to their
    limitations in maintaining UI consistency and lack of support for LWC. It’s also
    important to note that Salesforce tends to discourage ISVs from using Canvas,
    not due to security concerns – indeed, Canvas is safer'
  merge: -1
  img_proc: true
- pgno: 280
  md: 'compared to an IFrame solution – but rather because of perception. Utilizing
    Canvas can be perceived as a lack of serious commitment to integrating with Salesforce.
    When ISVs publish a Canvas-based solution for Salesforce on AppExchange, they
    might overlook the fact that Canvas usually implies two distinct user experiences.
    This can catch customers off guard and potentially lower the chances of a successful
    sale. There might be additional technical shortcomings with Canvas that could
    make partnership and app success less likely.


    If you’re considering using a canvas app, it’s recommended to discuss your use
    cases with Salesforce or one of the **Product Development Outsourcer (PDO)** partners,
    described in *Chapter 12*. Their expert guidance can help ensure that your Salesforce
    integration aligns with best practices and is positioned for success.


    # Comparing integration via the REST API versus the Canvas SDK


    The choice between developing a lightweight app with REST API integration and
    the Canvas SDK in Salesforce should be guided by several factors, each of which
    contributes to the ease of development, flexibility, and ultimate success of the
    integration. In the following table, we contrast the REST API and Canvas SDK from
    a range of perspectives to assist you in making an informed decision.


    |  | REST API Integration | Canvas App |

