  md: 'protected custom metadata types. This option also provides the flexibility
    to store multiple secrets for various configurations or environments.


    However, storing secrets that vary between subscribers and need to be provisioned
    in each org requires a different approach. You could either provide instructions
    for creating a named credential (new or legacy) or develop a custom interface
    to modify protected custom metadata securely.


    In conclusion, while named credentials and external credentials each have their
    use cases, their limitations often render them unsuitable for storing secrets
    in managed packages. Instead, the secure and flexible nature of protected custom
    metadata types generally makes them the ideal choice for this purpose.


    # Configuring protected custom metadata


    When working with Salesforce or any similar platform, securing metadata becomes
    essential, especially if it contains sensitive data that could impact the security
    and privacy of the application or its users.


    Protected custom metadata, as the name suggests, provides a layer of protection
    to your metadata. Once incorporated, users in the customer org cannot read or
    modify the information. This is highly effective in preventing unauthorized changes
    or potential data breaches.


    However, there can be scenarios where you might want a trusted person, such as
    the customer’s administrator, to configure certain pieces of information without
    providing them access to all the metadata. A common use case is when you want
    to allow the configuration of a consumer key and consumer secret, required for
    integrations.'
