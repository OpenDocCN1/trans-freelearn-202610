    # What exactly do ISVs do on AppExchange?


    Picture yourself strolling through the bustling Salesforce neighborhood, admiring
    the shiny skyscrapers of business functionality. The streets are filled with AppExchange
    partners, the superheroes of this metropolis, working tirelessly to make Salesforce
    an even better place to be.'
