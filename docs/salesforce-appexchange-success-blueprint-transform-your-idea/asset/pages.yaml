    # Pricing based on licenses'
  merge: -1
  img_proc: true
- pgno: 153
  md: 'The license structure you choose has a direct influence on your pricing model.
    Broadly, there are two types of licenses you can consider: per-user and per-company.


    +   - Per-user licenses: With the per-user model, you base your pricing on the
    number of individuals using the app. This model’s scalability and simplicity have
    made it popular among many app developers.

    +   - Site/per-company licenses: Unlike the per-user model, the per-company license
    grants access to all users within a customer’s business. This model may be more
    suitable for applications that offer benefits at a company-wide level.


    For customers that operate with multiple Salesforce organizations, it’s essential
    to determine how the license is applied. There might be flexibility for the license
    to cover either a single organization or all of a customer’s organizations. Therefore,
    it is crucial that you provide clear specifications in their Terms and Conditions
    (Ts&Cs) regarding the coverage of the license for multi-organization customers.
    This ensures both parties have a shared understanding of the licensing scope.


    # Payment terms and frequency


    While deciding on your app’s price is essential, so is determining the frequency
    of payments. There are two common payment terms to consider: monthly and annual
    subscriptions.


    Monthly subscriptions: For apps that offer regular updates and provide continuous
    support, a monthly subscription could be the best way to secure'
  merge: -1
  img_proc: true
- pgno: 154
  md: '# ongoing revenue


    Annual subscriptions: If your app requires less frequent support or provides slower
    ROI for customers, an annual subscription might be more suitable


    # Free elements and trial periods


    Even if your app is free or offers a trial period, understanding the appropriate
    license to issue is vital:


    +   - Free licenses: If your app is free, you’ll still need to issue a license.
    Typically, a standard site license is issued in such cases.

    +   - Free trial licenses: Offering a free trial is a great way to introduce customers
    to your app. However, it’s crucial to set the length of the free trial and understand
    how charges will apply once the trial ends.


    As we navigate these winding paths, remember that your chosen pricing model must
    harmoniously align with your app’s service type and target audience. Much like
    how the right key fits the perfect lock, AppExchange empowers you to control your
    app’s usage by revoking the license of anyone who hasn’t paid the agreed-upon
    fee.


