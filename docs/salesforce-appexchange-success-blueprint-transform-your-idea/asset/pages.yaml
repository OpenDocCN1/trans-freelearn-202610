- pgno: 289
  md: '# Understanding the security review process


    ![](img/44ed632038957e4c80220676e84c5109_289_0.png)


    Welcome to the exhilarating marathon of developing your first AppExchange application!
    You’re tying up your laces at the starting line of a course where the sprint of
    innovation links arms with the endurance of security. Salesforce,'
  merge: -1
  img_proc: true
- pgno: 290
  md: 'the world-class race organizer in the marathon of **customer relationship management**
    (**CRM**) platforms, has staked its reputation on one thing above all—trust. And
    a significant water station on this trust marathon? The security review process—an
    exhaustive vetting that each application must clear, akin to our marathon’s rigorous
    checkpoints, before making it to the finish line at the Salesforce AppExchange
    marketplace.


    Think of the security review process as your personal marathon trainer, diving
    into the granularities of your application’s design, architecture, and data handling
    practices. Its mission? To uncover those sneaky, potential security cramps and
    ensure your application is fit enough to run Salesforce’s marathon of high-security
    standards. It’s the thorough pat-down at the starting line, scanning everything
    from your application’s running gear (source code) and energy gels (data storage)
    to its hydration strategy (transmission methods).


    As committed marathoners in this AppExchange race, understanding the security
    review process and its race rules is not a “nice-to-have”—it’s your race-day strategy.
    It’s not just a daunting hill to conquer but a pacing guide, helping you avoid
    those brutal wall-hitting moments. Its job? To help you spot potential security
    side-stitches early enough in the training cycle, giving you ample time to tweak
    your stride, hydrate, or whatever it takes to keep those issues from slowing you
    down. This strategic approach to security is not only your ticket to a safe and
    successful race day (read: application) but also your personal PR in the trust-building
    race with your users.


    Training with security at the forefront is like diligently following a well-planned
    marathon training program—it’s tough and requires dedication, but boy does it
    pay off! It steers you clear from those nasty, time-guzzling'
  merge: -1
  img_proc: true
- pgno: 291
  md: 'injuries (read: revisions) later in the race and boosts your odds of breezing
    through the security review checkpoint at the very first attempt. Plus, it shows
    your users that their security isn’t an eleventh-hour, carb-loading attempt for
    you, but a well-thought-out part of your training regimen. And who knows, this
    could be the secret sauce that nudges them to cheer for your application on the
    big day!


    # Fees and timeline


    The security review process involves several key steps, as follows:


    +   1. You submit your application for security review via the Partner Community.

    +   2. The security review Operations team verifies your submission, a process
    that typically takes 1-2 days.

    +   3. Your submission is then added to the Product Security queue.

    +   4. The Product Security team performs tests on your application and validates
    the results.

    +   5. Finally, the security review Operations team notifies you of the results.


    The timeline for *steps* 3-5 typically spans 4-6 weeks. However, it’s worth noting
    that most ISVs don’t pass the security review on their first attempt. While some
    applications might get approved on their first or second try, others might need
    a third attempt or even more. As a result, you can optimistically anticipate your
    application to be live on the AppExchange marketplace within a minimum of 4 weeks
    from your initial submission. Yet,'
  merge: -1
  img_proc: true
- pgno: 292
  md: 'it’s also possible for the entire process to stretch to 3 months or longer.
    Oh, and just a heads-up! If you’re aiming to drop your app during a peak time,
    such as around *Dreamforce* (you know—that massive annual Salesforce event), there
    might be some extra submission deadlines you’ll want to keep an eye on to get
    your results in time.


    ![](img/44ed632038957e4c80220676e84c5109_292_0.png)


    Figure 6.1: Security review timeline


    In terms of fees, for freemium, paid, or solutions requiring a paid add-on, the
    security review fee is $999 for each of the following scenarios: initial security
    review, resubmission after addressing detected issues from a previous security
    review, periodic re-review of an earlier approved solution, and when a partner
    requests an audit of a new version of their solution. You can submit up to four
    packages with the same namespace in a single submission, with a single payment
    of $999 per attempt.


    Given that submissions typically require two attempts to pass, the average total
    cost for getting your application through the security review process is $1,998.


    However, it’s important to note that security review fees are waived for free
    solutions. This means that whether it’s an initial security review, a resubmission
    after addressing detected issues in a previous security review,'
  merge: -1
  img_proc: true
- pgno: 293
  md: 'listing a new version of a solution that was previously approved, or a periodic
    re-review of a solution that was previously approved, there is no charge.


    The fees may be subject to change, and the figures given are current as of 2023.
    You can check the most recent fees at https://developer.salesforce.com/docs/atlas.en-us.packagingGuide.meta/packagingGuide/security_review_fees.htm.


    # Testing your application


    Ensuring the security of your application is paramount before submitting it for
    the Salesforce security review. This process involves not just a review of your
    application’s architecture and components, but also its potential vulnerabilities.
    In the following subsections, you’ll learn some key practices to guide you in
    testing your application.


    # Pre-assessment


    Before submitting your application for a security review, perform an internal
    assessment of your solution to confirm its architecture is secure. Evaluate all
    aspects, such as object permissions, included components, custom code, web services,
    and third-party services being used. The aim is to secure all possible entry points
    and vulnerabilities that could be exploited to access data.


    Your application should be robust, adhering to Salesforce best practices such
    as bulkifying your Apex code when dealing with records in triggers and avoiding
    code injection in **Salesforce Object Query Language (SOQL)**, Apex, or cross-scripting.


    # Adversarial testing'
  merge: -1
  img_proc: true
- pgno: 294
  md: 'After you’ve addressed all known security issues, try to find more! Encourage
    your testing team to think like hackers and attack your product to try to steal
    its data. This adversarial testing approach, coordinated with your team’s security
    advocate, could reveal vulnerabilities that have been overlooked. The *OWASP Web
    Security Testing Guide* is an excellent resource to help you devise a plan for
    adversarial testing. You can find it on the **Open Worldwide Application Security
    Project (OWASP)** web page: https://owasp.org/www-project-web-security-testing-guide/.


    By following these strategies, you can submit your application for the security
    review with confidence, knowing you’ve done everything possible to secure your
    application. Your meticulous attention to potential vulnerabilities will not only
    ensure a smoother security review process but will also lead to a safer, more
    reliable product for your users.


    # Components required for the AppExchange security review process


    Running a successful security review process on AppExchange is like preparing
    for a big city marathon—it requires the right gear, a solid understanding of the
    race route, and, of course, the tenacity to see it through. This chapter is your
    personal fitness trainer, mapping out the must-have components for this marathon
    while also explaining why you need to tie your laces tight, wear breathable fabric,
    and carry energy bars. Or, in AppExchange terms, why you need a reliable test
    environment, well-organized documentation, effective static code analysis results,
    and clear false positive documentation.'
