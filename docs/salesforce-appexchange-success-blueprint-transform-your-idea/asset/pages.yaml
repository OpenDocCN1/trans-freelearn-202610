    # Example – customer trial conclusions


    Let’s say that you utilize Trialforce to offer potential customers a trial period
    for their products. This trial phase is a pivotal time for potential customers
    to experience the product and evaluate its value. Thus, having effective processes
    in place to manage this period is crucial for an ISV. A common process utilized
    by ISVs includes managing communications as the trial period comes to a close,
    extending the trial if necessary, and updating the status of Opportunity records
    in the **Partner Business Org (PBO)**.


    # Process overview


    For example, as an ISV, you could create an automated process using Salesforce’s
    Flow. This process can trigger a notification to the Account Manager associated
    with a customer’s trial a certain number of days before the trial’s end. This
    reminder can prompt the Account Manager to reach out to the customer, answer any
    pending queries, and help them transition to a paid subscription if they decide
    to continue using the product.'
