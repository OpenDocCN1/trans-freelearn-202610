    # The importance of updating your AppExchange listing for new managed package
    versions


    As a Salesforce ISV Partner, keeping your AppExchange listing up to date is essential
    for maintaining customer trust and showcasing the latest features and improvements
    of your app. When you publish a new version of your managed package, it’s crucial
    to update your listing accordingly. In this section, we will discuss the importance
    of updating your AppExchange listing when you release a new version of your managed
    package and provide guidance on how to do so effectively.


    # The significance of updating your AppExchange listing


    Regularly updating your AppExchange listing with the latest version of your managed
    package is vital for several reasons. First and foremost, it demonstrates your
    commitment to continuous improvement and customer success, which helps build trust
    and confidence in your solution. It also allows you to showcase new features,
    enhancements, or bug fixes, ensuring that potential customers are aware of the
    full capabilities of your app. Staying competitive in the Salesforce AppExchange
    ecosystem is critical, and keeping your listing updated signals that your app
    is evolving and staying ahead of the competition. Lastly, an up-to-date listing
    can positively impact'
  merge: -1
  img_proc: true
- pgno: 403
  md: 'your search ranking on the AppExchange marketplace, as it may be considered
    more relevant and valuable to potential customers.


    # Effectively updating your AppExchange listing


    When updating your AppExchange listing for a new managed package version, start
    by ensuring that your listing displays the correct version number and release
    date. Next, revise your app description and feature list to reflect any new features,
    enhancements, or bug fixes introduced in the latest version of your managed package.
    Be sure to use clear and concise language that is easy for potential customers
    to understand.


    Additionally, replace outdated images, videos, or documentation with updated versions
    that showcase the latest features and improvements of your app. This includes
    updating screenshots, demo videos, and user guides to reflect the most recent
    version of your managed package. Finally, encourage customers who have experienced
    success with the latest version of your managed package to leave reviews on your
    AppExchange listing or share their success stories. This not only adds credibility
    to your app but also helps potential customers understand the benefits of using
    the most recent version.


    # Public or private


    Upon launching an app on the AppExchange marketplace, one critical decision that
    every partner needs to make is whether to set their listing as public or private.
    This choice not only affects your product’s visibility but also plays a significant
    role in determining your sales strategy.


    A listing on AppExchange represents an entry that customers can search for and
    install the managed package directly by clicking on the given URL. With'
  merge: -1
  img_proc: true
- pgno: 404
  md: 'SEO compliance, these listings provide ease of search and customer ratings
    and serve as a strong marketing presence. Each listing has a 1:1 relationship
    with a package, implying that one listing points to a single package. However,
    this package can be interchanged. For instance, if you have a *Listing A* tied
    to *Package A*, it’s entirely possible to switch and have *Listing A* pointing
    to a different package—say, *Package B*.


    Public listings are searchable entries on the AppExchange marketplace. They allow
    your product to have broad visibility, letting potential customers find it independently.
    By using this feature, you may increase the likelihood that new users browsing
    the AppExchange marketplace will find your app.


    In contrast, private listings are not searchable on the AppExchange marketplace.
    However, they can be shared via a unique URL with selected customers. This type
    of listing allows for a more focused and tailored distribution strategy, allowing
    you to directly reach out to targeted customers and share the link to your app.


    The decision between a public and private listing depends heavily on your sales
    and distribution strategies. If you aim to broaden your reach and allow customers
    to discover your product organically, a public listing would be more advantageous.
    However, if you want a more targeted approach, directly reaching out to potential
    customers and offering them a unique URL, then a private listing would be more
    suitable.


    # The art of customer onboarding


    Have you ever bought a car without taking it for a test drive? Or adopted a pet
    without meeting them first? Likely not. The same principle applies when'
