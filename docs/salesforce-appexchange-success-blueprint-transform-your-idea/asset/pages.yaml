- pgno: 94
  md: '# Partner agreements – the fun part (seriously)


    Welcome to the exciting world of Salesforce AppExchange Partner Program legalities!
    While the thought of legal agreements may make you want to curl up and binge-watch
    your favorite TV show, I promise to make this section as entertaining and informative
    as possible. So, grab a cup of coffee (or tea, if you’re fancy), and let’s dive
    into the delightful realm of partner agreements!


    # SPPA


    Picture the SPPA as the treasure map to your Salesforce partnership success. It’s
    not just any click-through agreement—it’s the one that guides you through the
    maze of Salesforce Partner Programs and the Partner Community. And let’s not forget
    the exciting sidekick—the Salesforce Partner Program Policies, providing specific
    guidance tailored to each partner program type.


    # Embarking on your Salesforce partnership adventure


    As a new Salesforce partner, your thrilling adventure begins when you accept the
    SPPA while logging in to the Partner Community for the first time. You’ll need
    an authorized representative from your company to review and accept the SPPA,
    but don’t worry—they don’t need a law degree to get the job done.


    # The SPPA – a one-way ticket to the Partner Community'
  merge: -1
  img_proc: true
- pgno: 95
  md: 'The SPPA is like the golden ticket that grants you access to the Partner Community.
    But remember, it’s non-negotiable. Just as you can’t change the rules of gravity,
    you can’t change the terms of the SPPA.


    # Navigating the partnership terrain


    The SPPA lays the groundwork for accessing the Partner Community and joining the
    Partner Program, while the Policies act as a trusty compass, providing more detailed
    guidance for specific partner programs. Make sure you read both documents thoroughly
    —after all, you wouldn’t start a road trip without a map and a sense of direction,
    would you?


    # Business approval for your AppExchange solution


    The next crucial stage in launching your AppExchange solution involves submitting
    it for business approval. This process necessitates that every ISV Partner planning
    to bring a new application to market submit a business plan.


    # Crafting a business plan for the AppExchange marketplace – the recipe for app-tastic
    success'
  merge: -1
  img_proc: true
- pgno: 96
  md: '![](img/44ed632038957e4c80220676e84c5109_96_0.png)


    If the AppExchange marketplace were a delicious cake, your business plan would
    be the secret ingredient that makes it a showstopper. To excel in this competitive
    marketplace and ensure you meet Salesforce’s high standards for ethics and integrity,
    let’s bake a mouth-watering business plan together. This section will serve as
    your recipe, guiding you through the essential ingredients of an AppExchange-tailored
    business plan and how to use the AppExchange publishing console to whip up a plan
    that’ll impress Salesforce.


    # Business plan submission and approval process – the kitchen prep


    Before your masterpiece graces the shelves of the AppExchange marketplace, Salesforce
    needs a taste of your business plan. The business plan consists of'
  merge: -1
  img_proc: true
- pgno: 97
  md: 'three sections, as follows:


    +   - **Business Details**: Aim for concise yet comprehensive answers. As a new
    partner, it might be tempting to provide exhaustive details, but Salesforce typically
    appreciates direct and to-the-point responses.

    +   - **Product Architecture**: Again, clarity is key. Offer a clear overview
    without diving too deep into technical jargon.

    +   - **Compliance Certification**: This is required only for paid AppExchange
    listings.


    Once your business plan is ready, submit it for review. Salesforce will give you
    feedback to perfect your recipe, either approving it or suggesting improvements.
    If needed, you can resubmit it after addressing the comments.


    # Business details – the foundation layer


    This section is the base of your cake, helping Salesforce understand how your
    company fits into its product ecosystem. It includes the following aspects:


    +   - **Market research and analysis**: Get to know your target market, competition,
    and existing solutions in the AppExchange marketplace. This knowledge will help
    you identify market gaps and position your product effectively.

    +   - **Application development strategy**: Address the technical aspects, challenges,
    and solutions for developing your app and integrating it with Salesforce. In *Chapter
    4*, you’ll get a handle on ISV-specific technologies.

    +   - **Defining your value proposition**: What makes your app the cherry on top?
    Articulate the unique features and benefits that set your application'
  merge: -1
  img_proc: true
- pgno: 98
  md: 'apart from competitors. The strategies covered in *Chapter 3* will assist you
    with this.


    +   - **Revenue model and pricing strategy**: Choose a revenue model that fits
    your app and market, and decide on a competitive pricing strategy. This is also
    addressed in *Chapter 3*.

    +   - **Marketing and sales strategy**: Whip up a comprehensive plan to promote
    your app within the Salesforce ecosystem, including creating a compelling AppExchange
    listing. We’ll be delving into that in *Chapter 8*.

    +   - **Customer support and success plan**: Keep your customers satisfied by
    offering various support channels and resources to help them get the most from
    your app. In *Chapter 9*, you’ll get to explore a few options.

    +   - **Financial projections and key performance indicators (KPIs)**: Estimate
    potential revenue, expenses, and profitability, and define KPIs to track your
    app’s success. *Chapter 12* delves into the most prevalent KPIs.

    +   - **Implementation timeline and milestones**: Plan your development, launch,
    and maintenance timeline, including key milestones and deadlines.


    # Product architecture


    In the spirit of the cake metaphor, let’s consider the Product Architecture section
    as the intricate cake structure hidden beneath the frosting. It’s time to put
    on your hard hat and dive into the technical nitty-gritty of your app’s construction.
    Just as with any good architect, you’ll need to provide Salesforce with a comprehensive
    blueprint of your product’s design.'
  merge: -1
  img_proc: true
- pgno: 99
  md: 'This section should cover the following aspects:


    +   - **How your app stores credentials, passwords, and other sensitive data:**
    Think of this as the secret vault within your cake castle, keeping all the important
    treasures safe and secure

    +   - **The architecture and design of your product:** Your app’s floor plan,
    if you will, including technology stack, programming languages, frameworks, and
    any third-party libraries or services

    +   - **Integration with other systems and applications:** It’s like the plumbing
    and wiring that connects your app to the greater Salesforce landscape

    +   - **Handling security and data privacy concerns:** The ever-vigilant guards
    protecting the realm of your app


    The purpose of this section is to demonstrate that your app follows Salesforce
    best practices for architecture and design—like a well-designed, earthquake-resistant
    cake tower.


    # Compliance certification


    For paid AppExchange listings, it’s time to convince Salesforce that your company
    is a reliable and ethical business partner. Consider the Compliance Certification
    section as the Michelin star of the app world. To earn this prestigious accolade,
    you need to present your company’s business practices and relationships in the
    best light.


    Include the following ingredients:


    +   - **Legal structure, ownership, and financial stability:** The foundational
    pillars of your app bakery.'
  merge: -1
  img_proc: true
- pgno: 100
  md: '+   - **Any past legal or regulatory issues:** If any mishaps occurred in the
    kitchen, it’s time to address them and show how you’ve improved.

    +   - **Data privacy and security practices:** How you protect customer data and
    comply with applicable laws and regulations. It’s like having a top-notch sanitation
    rating for your bakery.

    +   - **Third-party relationships or partnerships:** Showcase how these collaborations
    align with Salesforce’s values and policies, such as teaming up with the best
    pastry chefs in town.


    Overall, the Compliance Certification section should demonstrate that your company
    is a trustworthy and reliable partner for Salesforce and its customers—the proof
    is in the pudding, after all.


    Voilà! A well-crafted business plan is ready! By addressing each section of the
    business plan, you’ll ensure that your app meets Salesforce’s standards and contributes
    to your business’s growth. With careful planning and execution, your app can become
    the pièce de résistance of the Salesforce ecosystem. Bon appétit!


    # Call with the AppExchange ISV Partner team


    After submitting your business plan, the ISV AppExchange Partner team meticulously
    reviews your proposal. Following its review, they may reach out for feedback or
    to request additional information. This is when an initial, informal discussion
    takes place. This call is not just a review; it’s a valuable opportunity for you
    to ask questions, explore opportunities, and understand'
  merge: -1
  img_proc: true
- pgno: 101
  md: 'how the team can assist and support you in your journey as a potential partner.


    During the conversation, the ISV AppExchange Partner team might identify areas
    that require your attention. If any issues arise, you’re provided with an opportunity
    to rectify them and resubmit your plan. After this discussion, having gained a
    thorough understanding of your submission and development timeframe, the team
    might arrange further calls, if necessary, and will guide you toward the next
    steps.


    The next phase of this process involves the execution of the PADA. This agreement
    sets out the specifics of your partnership with Salesforce and the distribution
    of your application through the AppExchange marketplace.


    # PADA


    Think of the PADA as the secret sauce in the Salesforce AppExchange Partner Program
    sandwich. It governs partners participating in the ISVforce and OEM categories
    and outlines the terms and conditions for distributing applications. The PADA
    is like the chef’s special that brings all the ingredients together, making it
    a must-have before sharing your app with the Salesforce ecosystem.


    # A dash of flexibility – security review first, sign later


    The PADA has a unique flavor—it allows partners to submit their applications for
    a security review even before signing the agreement. It’s like getting a sneak
    peek at dessert before finishing your appetizer. However,'
  merge: -1
  img_proc: true
- pgno: 102
  md: 'partners can’t start selling until they’ve savored every bite of the PADA process
    with Salesforce.


    Here are three key ingredients of the PADA:


    +   - **Percentage Net Revenue (PNR)**: It’s the amount and type of revenue that
    partners share with Salesforce, like splitting the bill after a fancy dinner

    +   - **Partner application description (or combined solution description)**:
    It’s the legal description of the partner’s application, which helps calculate
    PNR, just like reading the menu to know what you’re ordering

    +   - **Product Catalog**: It’s the list of products and services offered by the
    partner within the Salesforce ecosystem, like a shopping list for your Salesforce
    pantry


    Understanding these elements can help partners cook up a successful partnership
    with Salesforce, even if they’re not the ones directly negotiating the PADA.


    # The ISVforce Addendum


    When partners decide to build an app for the AppExchange marketplace using the
    ISVforce app distribution model, they need to add the ISVforce Addendum to their
    PADA. This extra ingredient covers various aspects, such as partner relationships,
    customer relationships, fees, and marketing.


    # The PADA’s shelf life


    The PADA, with its ISVforce Addendum, initially has a 3-year term, and like a
    fine wine, it auto-renews for additional 1-year periods unless either party decides
    it’s time for a new vintage or terminates the agreement earlier.'
  merge: -1
  img_proc: true
- pgno: 103
  md: '# Leveraging the AppExchange Partner Toolkit


    As an AppExchange partner, having the right tools at your disposal is instrumental
    in navigating your journey successfully. Just as a seasoned adventurer wouldn’t
    venture into the wilderness without a reliable compass, a sturdy pair of boots,
    and a well-stocked backpack, you wouldn’t want to delve into the dynamic landscape
    of the AppExchange marketplace without your own set of tools.


    In this section, we are going to unveil the AppExchange Partner Toolkit, an assortment
    of resources designed to empower partners such as you. The aim is to familiarize
    you with the key tools available, each serving its unique purpose, to help you
    streamline your operations, manage your customers, and effectively deploy your
    applications.


    Armed with the knowledge of these tools, you’ll be well-equipped to scale the
    heights of the AppExchange ecosystem. So, let’s embark on this exciting expedition
    to uncover the AppExchange Partner Toolkit.


    # PBO features and capabilities


    Dear reader, welcome aboard the magical mystery tour of the PBO, your very own
