  md: 'manage push upgrades, you need to understand why they might fail and how to
    monitor their results.


    # Common causes of push upgrade failures


    In my experience with conducting weekly push upgrades to over 100 production orgs,
    I’ve noticed a few common reasons why push upgrades may fail. These are set out
    here:


    +   - **Timeouts:** Push upgrades can occasionally fail due to timeouts. This
    happens when Salesforce’s server takes too long to process a request. It’s a common
    issue that can occur due to high server load or complex processes that take a
    long time to execute. Often, merely retrying the push upgrade can resolve this
    issue.

    +   - **Salesforce performance issues:** At times, Salesforce’s performance can
    be impacted by maintenance, updates, or high usage. These performance issues can
    cause push upgrades to fail. Again, often, a simple retry, once performance has
    improved, can lead to a successful upgrade.

    +   - **Subscriber org configuration:** Sometimes, push upgrades can fail due
    to configuration issues in the subscriber’s org. For example, a subscriber might
    have certain settings, permissions, or customizations that conflict with the components
    of the upgrade.

    +   - **Salesforce limits:** Salesforce has certain limits in place to maintain
    performance and integrity. If a push upgrade causes an org to exceed these limits,
    the upgrade will fail. For instance, Salesforce allows only one lookup field from
    Activity to any standard object. Suppose your package includes a new custom lookup
    from Task to Opportunity. In this case, your package has used up 100% of this
    limit. If one of your'
  merge: -1
  img_proc: true
- pgno: 372
  md: "customers had a local custom lookup, the installation would fail due to this\
    \ limit.\n\n# Monitoring push upgrade results\n\nTo effectively manage push upgrades,\
    \ it’s crucial to monitor their results. There are a few ways to do this, as follows:\n\
    \n+   - **Push Upgrade API**: This is a programmatic way to retrieve information\
    \ about your push jobs, and it’s an effective method for large-scale or automated\
    \ operations.\n+   \n+   - **Package Visualizer**: This is a comprehensive tool\
    \ designed to provide ISVs with the ability to manage their applications more\
    \ efficiently. Package Visualizer contains a feature that allows you to monitor\
    \ push upgrade results, along with other crucial information about your packages."
  merge: -1
