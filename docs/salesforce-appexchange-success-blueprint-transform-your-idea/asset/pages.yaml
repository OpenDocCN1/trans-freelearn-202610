- pgno: 227
  md: 'Platform Cache is a powerful feature offered by Salesforce that allows developers
    to store and access data quickly and efficiently. It provides a way to optimize
    the performance of Salesforce applications by reducing the time spent on data
    retrieval operations. As an AppExchange partner, you have the ability to include
    3 MB of free Platform Cache in your managed packages, once they pass the Salesforce
    security review. In this section, we will discuss how to enable and utilize this
    free cache provisioning in your managed packages and illustrate it with a specific
    use case.


    # Platform Cache – an overview


    Platform Cache is a memory layer within the Salesforce platform that stores frequently
    used data, allowing developers to access it more quickly than by querying the
    database. It operates on two levels: Org Cache and Session Cache. Org Cache stores
    data shared across all users within an organization, while Session Cache stores
    data specific to individual user sessions. By caching data at these levels, developers
    can significantly reduce the time and resources required to access frequently
    used information.


    Importantly, it’s worth noting that Platform Cache is accessible in Salesforce
    editions starting from Enterprise Edition and above. When incorporating Platform
    Cache into a package, it introduces an edition dependency, rendering the package
    unavailable for organizations utilizing the Professional Edition.


    # Enabling free Platform Cache in your managed packages'
  merge: -1
  img_proc: true
- pgno: 228
  md: 'To leverage Platform Cache in your managed packages, define namespaced cache
    partitions in your package and reference them in your code. Allocate the free
    cache to the desired partitions and upload a new version of your application.
    For existing packages that have already passed the security review prior to the
    Spring ’21 release, the cache will automatically be provisioned upon installation
    when the allocation is set in the managed package.


    # Improving managed package performance with Platform Cache


    Platform Cache can be particularly beneficial for managed packages that rely heavily
    on data retrieval operations, as it can help to reduce latency and improve overall
    performance. For example, consider a managed package that frequently accesses
    configuration data or frequently used metadata. By storing this data in Platform
    Cache, the managed package can access it more quickly than by querying the database
    each time the data is needed. This can lead to faster response times, improved
    application performance, and a better UX for customers.


    # Case study – enhancing performance in Formula Debugger with Platform Cache


    If you’re still scratching your head over how to use Platform Cache, fret not!
    We’re about to shine a light on this subject by delving into how Platform Cache
    was leveraged in Formula Debugger, an app we took for a spin back in'
  merge: -1
  img_proc: true
- pgno: 229
  md: '*Chapter 1.* This was done to tackle performance hitches tied to scrutinizing
    metadata schema in sizable Salesforce orgs.


    The Formula Debugger app is designed to help users identify and resolve issues
    with formula fields in Salesforce orgs. One of the main challenges faced by the
    tool is efficiently finding all formula fields within an org, which requires analyzing
    extensive metadata. In the case of very large Salesforce orgs, this operation
    can be time-consuming and may negatively impact the UX.


    To overcome this challenge, the Formula Debugger app leverages Platform Cache
    to enhance performance and provide a seamless UX. Here’s how it works:


    +   - **Instant access:** If the platform cache is populated during the app launch,
    the stored values are immediately available to the user. This enables instant
    app usage, eliminating the wait time usually associated with heavy computations.

    +   - **Real-time retrieval when the cache is empty:** If the platform cache is
    not populated, Formula Debugger attempts to retrieve all formula fields in real-time.
    However, with extensive metadata, timeouts may occur. If this happens, Formula
    Debugger will only display the initially available formula fields. Users will
    then see a message that reads: **Due to the large size of your organization’s
    metadata, only the initial formula fields are immediately available for debugging.
    We are processing the metadata in the background. Please wait a moment and refresh
    the page if you need to debug fields that aren’t currently listed.**'
  merge: -1
  img_proc: true
- pgno: 230
  md: '+   - **Asynchronous cache update:** Each time the app is launched, an asynchronous
    calculation process (implemented as an Apex `Queueable` class) starts in the background.
    This process ensures that the cache values are updated with the most recent data.

    +   - **Storing formula fields in the platform cache:** After the formula fields
    are identified by the asynchronous process, they’re stored in the platform cache.
    This method ensures faster access, as subsequent requests for formula fields are
    fetched directly from the cache, eliminating the need for ongoing metadata analysis.
    This helps to avoid hitting the Apex timeout limit in cases of large metadata
    sizes.

    +   - **Seamless UX:** With the formula fields readily available in Platform Cache,
    users of the Formula Debugger app can enjoy a smooth, uninterrupted experience
    when working with the tool. The cached data allows the application to perform
    optimally, even in large Salesforce orgs with extensive metadata.


    The following diagram illustrates the process:'
