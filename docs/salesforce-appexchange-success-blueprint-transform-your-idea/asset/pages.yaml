    applications, and discuss best practices and limitations.


    # Flow-enabling your features and functions


    As an ISV, you can make your application’s features and functions available to
    customers within their custom flows. By flow-enabling your **Lightning Web Components
    (LWC)** and Apex methods, you can integrate them into customers’ custom flows,
    making your app more valuable and sticky.


    To achieve this, consider which features or functions customers might want to
    include in their custom flows. For instance, an AppExchange solution that offers
    a credit check function can be utilized in both interactive screen flows and headless
    record-triggered flows.


    # Providing flow templates and overridable flows


    Flow templates and overridable flows allow you to deliver generic business processes
    that customers can use as a starting point for their custom flow logic. By packaging
    your industry expertise in a flow template, you can help customers bootstrap their
    own custom flows.


    The primary difference between flow templates and overridable flows is that flow
    templates require customers to update all references to the template'
  merge: -1
  img_proc: true
