- pgno: 250
  md: 'This pattern involves updating the user interface of an application in response
    to changes in the underlying data hosted off-platform. This allows the application
    to provide real-time feedback to the user.


    For instance, an ISV could use this pattern to update a cockpit in their AppExchange
    application whenever the underlying data hosted in their AWS instance changes.
    When a change is detected, the application updates the Salesforce cockpit to reflect
