- pgno: 455
  md: '# Support Process KPIs


    **Key performance indicators (KPIs)** are essential in any support setting as
    they help measure the effectiveness of your support process. Here are some critical
    support KPIs relevant to AppExchange partners:


    +   - **First Response Time (FRT)**: This measures the time taken from when a
    customer lodges a request to when a support agent first responds. A lower FRT
    can greatly enhance customer satisfaction.

    +   - **Resolution Time**: This measures how quickly a support issue is resolved
    once it’s been reported. SLAs typically define resolution times.

    +   - **Customer Satisfaction Score (CSAT)**: This score gauges how satisfied
    customers are with your support services. CSAT surveys can be sent after each
    resolved case to measure this.

    +   - **Ticket Volume**: This measures the number of support tickets received
    within a particular time frame. It can help identify peak support times or recurring
    issues that may need a more comprehensive solution.

    +   - **Percentage of Issues Resolved on First Contact (FCR)**: This measures
    how often customer issues are resolved on the first interaction without needing
    any further follow-up.


    # Utilizing Service Cloud features


    Your PBO provides an excellent platform for managing and tracking customer cases,
    ensuring adherence to SLAs. Salesforce Service Cloud offers various features for
    effective case management, including the following:


    +   - **Case Management**: Keep track of all customer cases, capture all necessary
    details, and automate case assignments based on specific'
  merge: -1
  img_proc: true
- pgno: 456
  md: 'criteria. It allows for quick and efficient resolution of customer issues.


    +   - **Milestones**: Set and monitor key case resolution milestones in the customer’s
    timeline. These can help ensure your team meets the expectations set in your SLAs.

    +   - **Entitlements**: Define and manage the support services customers are entitled
    to based on their contract or license.


    # Subscriber Support Console


    The Subscriber Support Console is a robust platform that allows ISVs to gain detailed
    insights about their subscribers. It enables your tech support team to view valuable
    information such as the subscriber’s configuration, license status, and data,
    thereby simplifying the troubleshooting process. Furthermore, if required, subscribers
    can grant your team login access to delve deeper into their org and resolve issues
    within your application.


    # Operationalizing the Subscriber Support Console


    With the Subscriber Support Console, you can accomplish several critical functions,
    as follows:


    +   - **Access subscriber information**: To quickly view subscriber details, you
    can either click on the subscriber’s organization name from the **Subscribers**
    tab in the **License Management App (LMA)** to navigate to the **Subscriber Overview**
    page or you can add a direct button at the account or license level. This alternative
    method allows you to bypass the'
  merge: -1
  img_proc: true
- pgno: 457
  md: 'search and may offer better access control. Here, you can view intricate details
    about the subscribers and their org setup.


    +   - **Request and obtain login access**: If a direct login to the subscriber’s
    org is required for issue resolution, you can request access using the console.
    Subscribers can also proactively grant access from within their own org by navigating
    to **Settings -> My Personal Information -> Grant Account Login Access** and selecting
    the name of your AppExchange product. For security reasons, the maximum period
