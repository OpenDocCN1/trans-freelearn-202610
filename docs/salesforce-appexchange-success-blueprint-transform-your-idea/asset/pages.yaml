- pgno: 375
  md: '+   - **Mitigating risks**: Highlight and address issues that might have been
    overlooked during in-house testing


    To optimize early releases in customer sandboxes, adhere to these guidelines:


    +   - **Test in your own environment first:** Always test the new version in your
    sandbox or scratch org to ensure functionality and performance.

    +   - **Provide detailed release notes:** Offer customers a clear overview of
    new features, bug fixes, and other alterations.

    +   - **Communicate sandbox upgrade dates in advance:** Notify customers about
    upcoming sandbox upgrades well in advance, providing them with the opportunity
    to plan accordingly and ensuring a seamless transition. Additionally, consider
    an opt-out option for those who require more time.

    +   - **Supply training resources:** Equip customers with video tutorials, documentation,
    or webinars to navigate the new version.

    +   - **Foster open communication:** Maintain avenues for customers to voice concerns
    or feedback, reinforcing app quality and customer trust.


    While customer sandboxes are a great place to get early feedback, they shouldn’t
    be treated as a replacement for your internal **Quality Assurance (QA)** processes.
