    # A word of caution – global means forever


    When implementing DI in Salesforce managed packages, there’s a crucial aspect
    to be aware of: the permanence of global classes.


    For your interfaces or virtual base classes to be accessible outside the managed
    package, they must be declared as global. This ensures that they can be extended
    or implemented in subscriber orgs, allowing for the desired flexibility and customization.
    However, this accessibility comes with significant implications, as outlined here:


    +   - **Commitment to stability:** Once you’ve designated a class or interface
    as global, it’s a binding commitment. You can’t later change its access to public
    or private. This means that any global component becomes a part of your package’s
    public API.

    +   - **Design finalization:** Given the irreversible nature of global, it’s paramount
    to finalize your design before releasing it. While you can add'
  merge: -1
  img_proc: true
- pgno: 212
  md: 'to a global class or interface in future versions, you can’t remove or alter
    existing methods or variables. Any change could disrupt implementations that rely
    on them.


    +   - **Deletion is off the table:** Once released, a global class or interface
    is here to stay. It can’t be deleted from subsequent versions of your managed
    package.


    At first glance, these might seem like stringent limitations. But consider the
    broader picture: imagine a scenario where a subscriber has built a local class
    based on your global interface. If you were to alter or delete that interface,
    it would directly impact and potentially break the subscriber’s local customizations.
    The rigidity of global is, in essence, a protective measure, ensuring stability
    and reliability for all parties involved.


    In light of these considerations, treat the global keyword with the utmost respect.
    When planning for DI, ensure your interfaces and classes are robust and well thought
    out before marking them as global. It’s not just about flexibility; it’s a promise
    of consistency and reliability to your subscribers.


    # Ensuring seamless support for custom implementations


    When allowing customers to incorporate their custom extensions, it is crucial
    to provide a default implementation and robust support to ensure a smooth experience.
    In cases where customers face issues related to performance, governor limits,
    or other implementation problems, support staff should be able to help them revert
    to a known, reliable, and supported default'
