    # 5. Who initiates requests?


    Examine whether the remote service needs to initiate requests to your client application.
    Depending on the direction of communication, you may need to opt for specific
    invocation patterns, such as the “Remote Call-In” pattern, to accommodate these
    scenarios.


    # 6. Do you require real-time UI updates?


    Think about whether your application’s user interface should be updated in real-time
