- pgno: 186
  md: 'Think of a namespace as the ornate carving on the exterior of your treasure
    chest, making it easily distinguishable and unique among countless other chests.
    In the world of Salesforce managed packages, a namespace serves as a unique identifier,
    ensuring that your application components don’t collide with other components
    in your customers’ Salesforce orgs.


    In the grand scheme of managed packages, namespaces perform a role of paramount
    importance. They act as a blueprint for the structure, organization, and protection
    of your app. Let’s take a look at how:


    +   - **Component isolation:** Namespaces provide an extra layer of isolation
    for your components, such as objects, Apex classes, and Visualforce pages, by
    adding a unique prefix to each component’s name. This prevents naming conflicts
    and ensures that your application components coexist harmoniously with those of
    other managed packages or custom components in your customers’ orgs.

    +   - **Code protection:** Namespaces contribute to the protection of your IP
    by making it more challenging for others to reference your components directly
    in their code unless you explicitly allow them to do so. This extra safeguard
    helps maintain the integrity of your application and its components.

    +   - **Branding and recognition:** A namespace, much as with the ornate carving
    on a treasure chest, can also serve as a branding element, giving your application
    a distinct identity in the vast Salesforce ecosystem. By choosing a meaningful
    and unique namespace, you can make your application stand out and be easily recognizable
    by your customers.'
  merge: -1
  img_proc: true
- pgno: 187
  md: '# Package extensions – tailoring applications for multiple products and editions


    Package extensions offer a flexible approach for AppExchange partners to build
    applications that cater to customers using different Salesforce products, such
    as Health Cloud and Financial Services Cloud, as well as different Salesforce
    editions such as Professional. By utilizing a base managed package and an extension
    package, you can create a modular application that satisfies diverse customer
    requirements without maintaining multiple code bases.


    Consider your application as a multifaceted puzzle, where the base managed package
    constitutes the central pieces, forming the core functionality suitable for all
    customers. Extension packages, on the other hand, are like specialized puzzle
    pieces that enhance the base package with additional features and functionalities,
    tailored to specific Salesforce products or editions.


    In the context of 2GP, you can create a base 2GP package containing the core features
    and then develop one or more extension 2GP packages that depend on the base package.
    In line with the organizational structure and needs, these extension packages
    can encompass layered functionalities, ranging from the data model, and logic,
    to the UI. These packages might also incorporate features specific to certain
    Salesforce products or editions, allowing partners to explore and extend their
    offerings effectively. This modular approach allows you to maintain a single code
    base while offering tailored solutions to different customers.'
  merge: -1
  img_proc: true
- pgno: 188
  md: 'When designing your application and the interfaces between the packages, consider
    the entire application life cycle. It’s crucial to ensure updates to the base
    package do not break the extension package. When adding new features, include
    them in the appropriate package and make the necessary components `@namespaceAccessible`
    components if they are referenced by the extension package.


    Leveraging package extensions in 2GP enables you to create scalable and modular
    applications that cater to a diverse range of customers while simplifying the
    upgrade process. As your customers’ needs grow, you can easily upsell them by
    introducing the appropriate extension package to enhance their application experience.


    # Package extensions versus feature parameters


    When developing on the Salesforce AppExchange marketplace, you might often find
    yourself in a dilemma: should you build an extension package or use the **Feature
    Management App (FMA)**, described in *Chapter 2*? Both approaches have their own
    advantages and uses. Here’s a handy comparison:


    | Criteria | Package extensions | Feature parameters |

    |---|---|---|'
