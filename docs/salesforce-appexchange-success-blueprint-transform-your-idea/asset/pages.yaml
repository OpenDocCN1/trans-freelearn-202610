- pgno: 361
  md: 'Salesforce AppExchange managed packages follow a three-part versioning model
    consisting of a major version, a minor version, and a patch version. This model,
    often referred to as **Semantic versioning (SemVer)**, is widely used in software
    development and provides a clear, standardized approach to version naming. Let’s
    look at this in more detail:


    +   - **Major version:** The first number in the version denotes the major version.
    This is incremented when you make incompatible API changes or significant functional
    changes that may impact the UX or require substantial user adjustments.

    +   - **Minor version:** The second number represents the minor version. This
    typically reflects backward-compatible functionality enhancements. Think of new
    features that add value but do not disrupt existing functionalities.

    +   - **Patch version:** The third number stands for patch versions. This is increased
    when you make backward-compatible bug fixes or minor changes that do not add new
    functionalities or disrupt existing ones.


    By embracing a well-defined naming convention and understanding Salesforce AppExchange
    managed package versioning, you can effectively navigate the ever-changing landscape
    of release management, ensuring seamless communication and a comprehensive understanding
    of release changes for both users and developers.


    # Understanding version types'
  merge: -1
  img_proc: true
- pgno: 362
  md: 'As a partner navigating the vast terrain of Salesforce’s AppExchange marketplace,
    understanding the different types of package releases available is a fundamental
    part of effective release management. In this section, we will explore full releases,
    patch releases, and beta releases, each with their unique purposes, limitations,
    and ideal usage scenarios.


    # Full releases


    Full releases represent a significant progression of your application, encompassing
    either minor or major changes in functionality and often involving the addition
    of new metadata. Each full release is identified by an incremented major or minor
    version number.


    A full release allows developers to add new components, delete obsolete ones,
    and modify existing metadata, facilitating large-scale enhancements to the application.
    An example might be introducing a new module or substantial functionality to your
    AppExchange application that would warrant a full release.


    # Patch releases


    Patch releases, on the other hand, are a subtler type of update, focused primarily
    on bug fixes and minor adjustments that do not alter the app’s existing functionality.
    These updates are often vital for resolving vulnerabilities or issues identified
    post-release.


    However, patch releases in Salesforce are bound by certain limitations. They do
    not permit the inclusion of new metadata, nor changes to the application’s'
  merge: -1
  img_proc: true
- pgno: 363
  md: 'API or global classes. Their purpose is purely to deliver backward-compatible
    fixes. For instance, if an existing feature of your application has a bug affecting
    performance, deploying a patch release to address the issue would be the appropriate
    step.


    # Beta releases


    Finally, beta releases serve as testing grounds for new features and functionalities
    before they’re included in a final full release. These packages allow for comprehensive
    testing and feedback gathering, which is useful for identifying potential issues
    early in the development process.


    Beta releases can be installed in scratch orgs, sandboxes, and Developer Edition
    orgs, providing an environment that closely resembles the impending production
    setting. However, a significant limitation accompanies these advantages: beta
    releases cannot be updated. Consequently, a prerequisite for installing the ultimate
    full-release version involves uninstalling the beta release. This may necessitate
    additional steps, such as manual uninstallation of the previous version or a sandbox
    refresh, integrated into the deployment process.


    Moreover, the transition from beta to final release might also entail challenges
    regarding the preservation of test data across various testing cycles. The inherent
    restrictions of beta packages might preclude the seamless continuity of test data,
    potentially necessitating reconfiguration or re-population in each iteration of
    testing.


    It’s important to note that deploying beta packages in long-standing customer
    sandboxes may not be the most suitable approach. The limitations discussed'
  merge: -1
  img_proc: true
- pgno: 364
  md: 'earlier might render beta packages less feasible within these enduring environments.


    Considering these factors, the most suitable environment for making the best use
    of beta packages is within scratch orgs. In this scenario, incorporating automated
    scripts to rapidly generate relevant test data and systematically establish new
    scratch orgs emerges as an indispensable investment. Through the implementation
    of this approach, complications linked to uninstallation, data retention, and
    limitations inherent in beta releases can be adeptly managed. This not only streamlines
    the process but also amplifies the effectiveness of beta testing. It’s important
    to note that, with this strategy, a new scratch org is generated each time a new
    beta package is released, ensuring a fresh and controlled testing environment
    for every iteration.


    # Applying a naming convention


    Imagine you’re releasing version 2.8.4 of your application. Here, “2” is the major
    version, indicating the main iteration of your application, “8” represents the
    minor version, pointing to specific added features, and “4” marks the patch version,
    accounting for any bug fixes or minor improvements.


    By following this versioning system, you provide a snapshot of changes included
    in the release, right in the version name itself. It also allows users to understand
    the impact and nature of updates quickly.


    But remember—while the numbers are informative, they are not descriptive. Therefore,
    it’s essential to complement your versioning with detailed release'
