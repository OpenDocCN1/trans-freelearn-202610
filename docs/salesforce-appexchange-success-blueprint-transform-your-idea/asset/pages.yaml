    |---|---|---|

    | Scope | These are designed to extend the functionality of a base package. They
    have a dependency on the base package and can’t be installed independently. |
    This is more about controlling the visibility and access to specific features
    within a package. It doesn’t add new functionality but rather manages existing
    ones. |

    | Flexibility | This approach provides a great deal of flexibility because it
    enables you to add new objects, fields, logic, and dependencies on Salesforce
    features that are not required by your base package. It’s like building a new
