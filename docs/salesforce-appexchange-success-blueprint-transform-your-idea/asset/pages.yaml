    # Remote process invocation—request and reply


    This pattern involves a client application making a request to a remote service
    and waiting for a response. The client is blocked until the response is received
    or a timeout occurs. This pattern is commonly used when the client needs to process
    the response before it can proceed.


    For example, an ISV might use this pattern to integrate a third-party payment
    processing service into their AppExchange application. When a customer makes a
    payment, the application sends a request to the payment service and waits for
    a confirmation response before proceeding.


    # Remote process invocation—fire and forget


    In this pattern, the client application sends a request to a remote service but
    does not wait for a response. This is useful when the client does not need to'
  merge: -1
  img_proc: true
- pgno: 249
  md: 'process the response immediately, or at all.


    For instance, an ISV could use this pattern to send usage data from their AppExchange
    application to a remote analytics service. The application can continue running
    without waiting for a response from the analytics service.


    # Batch data synchronization


    Batch data synchronization involves transferring large amounts of data at scheduled
    intervals. This pattern is useful when real-time data is not required, and it
    can be more efficient than transferring data in real-time for large datasets.


    An example of this could be an ISV that needs to synchronize data between its
    AppExchange application and a remote database every night. The application collects
    data throughout the day, and then sends it all to the database in a single batch
    during off-peak hours.


    # Remote call-in


    The remote call-in pattern involves a remote service making a request to the client
    application. This is the opposite of the remote process invocation patterns, where
    the client makes a request for the service.


    An example would be an ISV integrating its AppExchange app with an external address
    validation service. When a user enters an address into the application, the AppExchange
    app sends a request to validate the accuracy and format of the address. The external
    address validation service then checks the address and sends back a validation
    result, ensuring data accuracy and consistency.


    # UI update based on data changes'
