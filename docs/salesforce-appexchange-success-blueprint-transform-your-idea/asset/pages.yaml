- pgno: 463
  md: '# Limitations of using AppExchange Checkout


    While AppExchange Checkout offers a streamlined and automated solution to ease
    the purchasing experience for your customers, it’s essential to recognize its
    limitations. These include the following:


    +   - **No varied price points for a single listing**: One of the most significant
    limitations of AppExchange Checkout is its inability to support varied price points
    for a single listing. This poses a challenge for businesses that operate on a
    freemium model or those that have multiple pricing tiers. Businesses looking to
    offer various packages or tiers will need to find alternative ways to present
    their pricing or consider separate listings for each price point.

    +   - **Inflexible deal customization**: While AppExchange Checkout automates
    the payment process, this automation comes at the cost of flexibility. It becomes
    challenging to tailor deals based on a customer’s unique circumstances. For instance,
    you’ll encounter the following limitations:

    +     - **Delayed billing**: You can’t offer an agreement with billing postponed
    to a future date.

    +     - **Contract modifications**: If a customer’s legal department has specific
    requirements, modifying contract terms via Checkout might not be feasible.

    +     - **Additional features or support levels**: Upselling or customizing features
    and support levels for individual customers is not directly supported.'
  merge: -1
  img_proc: true
- pgno: 464
  md: '+   - **Multi-year contracts:** Checkout doesn’t natively support longer-term
    relationships through multi-year contracts.

    +   - **Geographical restrictions:** AppExchange Checkout relies on Stripe, which
    means your business must be in a country supported by Stripe. While Stripe has
    a wide reach, there are still numerous countries where it isn’t available. This
    limitation might hinder businesses aiming for a global audience.

    +   - **Complex tax implications:** Although the system manages VAT and US sales
    tax, businesses with complex tax requirements or those operating in countries
    with intricate tax systems might find the automated solutions insufficient.

    +   - **Over-reliance on Stripe:** Since Checkout is built on Stripe’s platform,
    any changes, updates, or issues with Stripe can have a direct impact on your Checkout
    experience. It’s vital to stay updated with Stripe’s policies and updates.


    While AppExchange Checkout offers many benefits, it’s crucial for businesses to
    weigh these against the limitations. Depending on your business model, customer
    base, and geographical focus, AppExchange Checkout might be the perfect solution,
    or you might need to consider alternative methods, described later in this chapter,
    or supplementary methods to cater to your specific needs.


