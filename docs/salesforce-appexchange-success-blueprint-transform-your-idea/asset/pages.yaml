- pgno: 536
  md: 'With an understanding of the types of technical debt specific to AppExchange
    development now under your belt, you are equipped with the knowledge to recognize
    and mitigate its occurrence in your ISV journey. However, as complex as it might
    seem, technical debt is not always the villain of the piece. When managed effectively,
    it can be an unexpected ally. So, let’s shift our perspective and learn how to
    use technical debt to our advantage tactically.


    # Tactical accrual of technical debt


    It may sound counterintuitive, but not all technical debt is bad. Sometimes, accruing
    technical debt can be a tactical decision, made to achieve certain goals more
    quickly.


    Technical debt can be seen as a tool that allows you to move faster in the short
    term. In a competitive business environment, speed is often critical. Perhaps
    there’s a market opportunity that requires you to act swiftly or a customer demand
    that needs an immediate response. In such cases, it might be a wise decision to
    accrue some technical debt to get a product or feature out the door quickly.


    The important thing to remember is that such decisions should be taken consciously
    and with an understanding of their implications. This implies having a plan for
    repaying the debt as soon as possible. The faster you “repay” your technical debt
    by refactoring or improving the code, the less “interest” you accrue in the form
    of additional time, effort, and resources spent on maintenance and troubleshooting
    down the line.'
  merge: -1
  img_proc: true
- pgno: 537
  md: 'However, you should be cautious about when and how much technical debt you
    decide to take on. Taking on too much debt can slow down the pace of development
    and make the system increasingly difficult to maintain. It can also lead to a
    decrease in the quality of the product and affect the satisfaction of your customers.


    Remember, the key is not to completely avoid technical debt – that would be nearly
    impossible – but to manage it effectively. This requires a clear understanding
    of the trade-offs involved, and the discipline to address the debt before it becomes
    overwhelming.


    # Technical debt can drive your sales


    It might seem overwhelming to confront the concept of technical debt: the potential
    complexities and costs involved might give you pause. But here’s a unique perspective
    – technical debt can be your ally. Understanding and effectively managing technical
    debt is one of the reasons why customers might choose your AppExchange app over
    building their own solution.


    Put yourself in the shoes of your potential customer’s **Chief Information Officer
    (CIO)**. Whenever they face the “build versus buy” decision, they need to consider
    the implications of technical debt. They have to evaluate the costs associated
    with its management, and the requirement of maintaining a development team to
    handle it.


    This is where the true ethos of Salesforce and the AppExchange comes to the fore:
    you manage the technical debt and innovation so that your customers don’t have
    to.'
