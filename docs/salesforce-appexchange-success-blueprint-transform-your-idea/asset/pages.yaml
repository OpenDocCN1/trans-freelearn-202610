- pgno: 6
  md: '– Jakub


    # Contributors


    # About the author


    > “Jakub is the best Salesforce Expert I know,” said Jakub’s mom.


    **Jakub Stefaniak** is a Salesforce **Certified Technical Architect (CTA)** and
    the VP of technology strategy and innovation at Aquiva Labs (an expert PDO company),
    where he assists ISVs in developing products and succeeding in their AppExchange
    partnerships. Jakub earned his master’s in computer science and continued his
    education firstly at Stanford’s Graduate School of Business and then in the Massachusetts
    Institute of Technology (MIT) Chief Technology Officer program. After delivering
    presentations about AppExchange across four continents (including at Dreamforce),
    Jakub got tired of repeating himself, so he penned this book. He’s also the author
    of a self-published AppExchange app.


    *To my colleagues at Aquiva Labs – your support and insights have been instrumental
    in developing this book. Whether through our collaboration on various AppExchange
    projects or invaluable discussions, each of you has enriched the content of these
    pages. Without the privilege of being a part of a top Product Development Outsourcers
    like ours, I might never have acquired the necessary experience to undertake this
    endeavor. Thank you all sincerely.*


    # About the reviewers'
  merge: -1
  img_proc: true
- pgno: 7
  md: '**Marco Kuster** has a diverse professional background, having worked as an
    architect, web designer, and technical trainer. However, he discovered his true
    passion when he became a part of the Salesforce ISV team. Working with ISVs has
    shown him that each one is distinct, and his role is to advise them in developing
    exceptional software by harnessing the power of Salesforce technologies.


    **Lawrence Newcombe,** a Salesforce CTA and co-founder of Cloud Sundial, is the
    brains behind FormulaShare, an app revolutionizing record sharing. This tool provides
    flexible, click-and-configure rules for intricate sharing scenarios, eliminating
    the need for customization. With free and enterprise editions, FormulaShare is
    embraced by 100+ production orgs, attesting to its effectiveness.


    Aside from app development, Lawrence serves as Lead Technical Architect at Giveclarity.org,
    where he establishes system architecture and governance for international NGOs.
    His expertise contributes significantly to meaningful projects, showcasing his
    dedication to impactful work.


    He is also a content creator, sharing insights on identity, OAuth, and cloud sharing
    on cloudsundial.com. Beyond the digital realm, he finds joy in rock climbing,
    exploring Bristol’s crags and cliffs on sunny evenings.


    **Krishna Tatta** is a Salesforce Certified Technical Architect (CTA) with over
    15 years of experience in product engineering, enterprise architecture, SaaS product
    delivery, and people and organizational leadership. With over a decade of dedicated
    focus in the Salesforce PDO space, she possesses a profound understanding of the
    platform and the ISV ecosystem. Notably, she has designed and developed more than
    55 Salesforce ISV products and'
