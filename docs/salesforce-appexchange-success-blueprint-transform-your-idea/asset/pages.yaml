    # How often should you release and deploy?


    Now that you understand the differences between releases and deployments, as well
    as the power of push upgrades, the question arises: How often should you release
    and deploy?


    The frequency of releases largely depends on several factors such as your development
    team’s speed, your customers’ adaptability to new changes, and your organization’s
    strategic goals. Many ISVs choose to release new features three times a year,
    aligning with Salesforce’s release cycle. This cadence allows ample time for development,
    testing, and ensuring compatibility with the Salesforce platform’s updates.


    On the other hand, deployments can be performed as frequently as you want. They
    can serve as an excellent tool for delivering updates, bug fixes, and enhancements
    promptly. For example, during my tenure as a release manager at IPfolio (a substantial
    OEM), I introduced a weekly cycle of deployments. This approach ensured swift
    delivery of minor bug fixes and new feature-related code to all customers. However,
    since these features were not officially announced and were undocumented, only
    a select group of pilot customers had access to them.'
  merge: -1
  img_proc: true
- pgno: 388
  md: 'This strategy enabled us to adhere to DevOps principles and maintain agility
    without the burden of maintaining multiple versions of our package. Yet, we still
    officially released new features only three times a year.


    And remember—a release is not just about the technical aspects. It’s also about
    the human aspect, such as communication, providing release notes, offering training
    to your customers, and so forth.


    By now, you should have a solid understanding of not only *why* but also *how*
    to design your release management process to best fit your organization’s needs.
    Balancing the frequency of releases and deployments effectively will ensure that
    your team can deliver continuous value to your customers while also managing change
    and maintaining stability.


    # Why don’t you just release weekly?


    “But can’t we just release new features every week?” I hear you ask. The answer
    is yes, you technically could. But should you? That’s a whole other kettle of
    fish.


    Your end users, believe it or not, aren’t always thrilled by surprises. Sure—in
    a **Business-to-Customer (B2C)** scenario, rapid updates and changes might be
    acceptable, even exciting. But in the **Business-to-Business (B2B)** world, that’s
    not always the case. Imagine showing up for work on a Monday morning, coffee in
    hand, only to find that the tools you were using just last week have changed overnight.
    Yikes.


    And it’s not just about managing the shock value. Do you have the bandwidth to
    offer adequate training, documentation, and support for these new features'
  merge: -1
  img_proc: true
- pgno: 389
  md: 'every week? Updating your product is one thing, but getting your users up to
    speed is a whole other challenge.


    Frequent updates without proper communication and support can lead to a slew of
    issues. We’re talking about poor adoption of new features, skyrocketing support
    costs, and overall user dissatisfaction. Think of it this way—change management
    is an art form in and of itself. It exists because, generally speaking, people
    don’t really enjoy surprises at work.


    So, yes—you should deploy your latest code frequently, but releases? Not so much.
    Just look at Salesforce for a real-world example: it deploys updates frequently
    but only has three major releases per year. So, while it’s tempting to show out
    your shiny new features as soon as they’re ready, remember that patience is a
    virtue, especially when it comes to software release management.


