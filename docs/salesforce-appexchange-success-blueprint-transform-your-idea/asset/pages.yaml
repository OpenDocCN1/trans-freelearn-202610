- pgno: 412
  md: 'Remember how exciting it was to test-drive that spaceship? Now, imagine handing
    over the spaceship controls to your customers. Yes—we are talking about Trialforce,
    the quintessential warp-speed experience for your AppExchange solution. Think
    of it as the “Galactic Superpower” for a full-on, immersive “take-the-helm” moment
    for your customers.


    So, why embrace the cosmos of Trialforce?


    Well, Trialforce is like the constellation of tools at your disposal, not just
    allowing you to zip through the universe, but also helping you navigate it with
    finesse. As you provision trials, you’re creating leads in the LMA. Imagine this
    as creating a map of potential new planets (customers) ready for exploration.


    Here’s why Trialforce is like the “hyperdrive” for your app’s success:


    +   - It’s your marketing campaign’s best friend, enabling you to broaden your
    customer reach and adoption

    +   - It allows you to make a personalized impression, customizing everything
    from branding to functionality, data, and trial experience

    +   - It’s your one-stop shop for managing trials for different offerings, versions,
    and editions

    +   - It lets your customers, even those without administrator access, sample
    your app without having to log in to their production environment


    A few main components underpin Trialforce—the **Trialforce Management Organization
    (TMO)**, the **Trialforce Source Organization (TSO)**, and Trialforce templates.
    Here’s how they fit together:'
  merge: -1
  img_proc: true
- pgno: 413
  md: '+   - **TMO**: Your starting block for Trialforce, the TMO is where you’ll
    manage everything post-setup. Here, you can whip up TSOs and carve out templates
    for custom branding.

    +   - **TSO**: TSOs act as the mold for the trial orgs that your customers receive.
    You can install your offering, add sample data, and configure your TSO to deliver
    an optimal customer experience. Branding can also be personalized, picking from
    templates set up in the TMO.

    +   - **Trialforce template**: Think of this as a snapshot of your TSO at a specific
    point in time. Once your offering is installed and your configurations are done,
    you can create a template. This template is what defines the trial org provisioned
    each time a customer signs up for a trial.


    # Setting sail with Trialforce


    To get Trialforce up and running, there are a series of steps that you need to
    follow, as set out here:


    +   - Develop a managed package

    +   - Pass the security review

    +   - Set up a **License Management Organization (LMO)** to supervise customer
    access

    +   - Link a version with the LMO and determine the license defaults

    +   - Request a TMO

    +   - Optionally, craft customized branded login pages and emails in the TMO

    +   - Generate a TSO from the TMO

    +   - Install the managed package in the TSO and customize it as desired'
