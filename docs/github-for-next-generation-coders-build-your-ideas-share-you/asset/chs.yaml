- "## 12 打造你的 GitHub 个人资料\n\n### 打造你的 GitHub 个人资料\n\n本章中，我们将学习如何打造有影响力的 GitHub 个人资料，以展示你的项目和贡献，从而突出你作为程序员的技能、奉献精神和多才多艺。通过优化你的个人资料，你可以给访客留下深刻的第一印象，包括潜在的合作者、雇主和同行开发者。本章旨在提供实用指导，帮助你让\
  \ GitHub 个人资料不仅反映你的编码之旅，也成为职业机会的平台。\n本章中，我们将涵盖以下主要主题：\n* 优化你的 GitHub 个人资料概览\n* 展示技能和专业知识\n\
  * 在个人资料中添加统计数据和成就\n* 战略性地展示项目和贡献\n\n#### 技术要求\n\n对于某些活动，我们将使用外部工具和服务，例如 [`shields.io/`](https://shields.io/)\
  \ 和 [`github-readme-streak-stats.herokuapp.com`](https://github-readme-streak-stats.herokuapp.com)。请确保你熟悉\
  \ `Markdown`，因为它是自定义 README 个人资料的必备条件。\n此外，从 [`github.com/PacktPublishing/GitHub-for-Next-Generation-Coders/tree/main/Chapter%2012`](https://github.com/PacktPublishing/GitHub-for-Next-Generation-Coders/tree/main/Chapter%2012)\
  \ 下载名为 `Chapter 12` 的 GitHub 文件夹，其中包含可供你跟随使用的 `README` 模板。\n\n#### 优化你的 GitHub 个人资料概览\n\
  \n你的 GitHub 个人资料就像你的在线编码传记——一个展示你的技能、项目和对编码世界的贡献的地方。正如你希望在现实生活中给人留下良好的第一印象一样，拥有经过优化和个性化的\
  \ GitHub 个人资料会产生很大的不同。在本节中，我们将学习一些很酷的技巧，让你的个人资料看起来很棒！\n让我们开始：\n* **添加个人资料图片和简介**：首先使用一个清晰的自己照片，背景为漂亮的单色。它让你的个人资料更具个人特色。写一个简短但能透露很多关于你信息的简介。你是网页开发者、Python\
  \ 开发者还是游戏设计爱好者？在这里提及！\n    *示例*：**你好！我是 Igor Iric，我对编码如何将想法变为现实着迷。我喜欢学习新的编程语言并与其他程序员合作。现在，我正在构建一个有趣的\
  \ ****新游戏！**\n![图 12.1 – GitHub 配置文件](img/B21847_12_01.jpg)\n图 12.1 – GitHub 配置文件\n\
  * **固定仓库**：GitHub 允许你将仓库固定到个人资料上。选择展示你的技能和你喜欢从事的工作的项目。它可以是你构建的网站、游戏或让某事变得更简单的工具。如你在\
  \ *图 12.2* 中所见，你可以点击 **自定义你的固定项目** 并选择想要展示的仓库：\n![图 12.2 – 已固定项目](img/B21847_12_02.jpg)\n\
  图 12.2 – 已固定项目\n* **贡献图**：这是告诉你 GitHub 活动的地方，所以保持活跃！你的贡献图显示了你编码的多少。尝试定期为你的项目或其他人的项目做出贡献。它表明你一直在学习和改进：\n\
  ![图 12.3 – 贡献图](img/B21847_12_03.jpg)\n图 12.3 – 贡献图\n* **徽章**：这些是展示你的编码技能和贡献的小成就。尝试通过参与编码挑战或为开源项目做出贡献来获得徽章。它们增添了一点乐趣，并向他人表明你是一个活跃的程序员：\n\
  ![图 12.4 – 徽章](img/B21847_12_04.jpg)\n图 12.4 – 徽章\n现在你已经掌握了让 GitHub 个人资料看起来不错并脱颖而出的基础知识，让我们继续前进。接下来，我们将重点关注如何真正突出你的技能和专业知识。我们将探索如何强调你的擅长之处，以及如何让他人轻松看到你的编码优势。这是你展示自己最自豪的项目和成就的机会！\n\
  \n#### 展示技能和专业知识\n\n在本节中，我们将探索 GitHub 上一个名为 **GitHub README profile** 的特殊功能！这就像你在\
  \ GitHub 上的完整传记或简历——一个空间，你可以在其中向社区介绍你自己、你正在从事的有趣项目以及关于你的许多其他细节。听起来很棒，但你如何创建自己的 README\
  \ 个人资料？\n\n##### 创建你的 README 个人资料\n\n创建一个完全关于你的 GitHub 特殊仓库非常简单。只需创建一个与你的 GitHub\
  \ 用户名同名的新仓库。是的——它必须完全相同。在我的例子中，仓库名为 `error505`：\n![图 12.5 – 创建个人资料仓库](img/B21847_12_05.jpg)\n\
  图 12.5 – 创建个人资料仓库\n如你在 *图 12.5* 中所见，在输入用户名作为仓库名称后，会自动显示一条消息。该消息显示此仓库将是特殊的，并询问你是否希望创建\
  \ README 文件并将其设为公开。\n一旦你这样做，GitHub 会做一件很酷的事情。它会在你的个人资料上显示此仓库中的 README 文件供所有人查看。现在，你可以开始编辑你的\
  \ README 文件并添加一些关于你自己和你的成就的有趣信息：\n![图 12.6 – 添加 README](img/B21847_12_06.jpg)\n\
  图 12.6 – 添加 README\n\n##### README 文件中应包含什么？\n\n像往常一样，你可以先分享你的名字、自己的照片以及你居住的地方。此外，你可以添加很酷的徽章来展示你的关键技能。你可以在\
  \ *图 12.7* 中查看我的个人资料：\n![图 12.7 – 为个人资料添加标题](img/B21847_12_07.jpg)\n图 12.7 – 为个人资料添加标题\n\
  以下代码块旨在增强你的 GitHub 个人资料，将其转变为关于你、你的技能和你的位置的视觉吸引力和信息丰富的页面。它就像设置一个数字名片或简历，任何访问你 GitHub\
  \ 个人资料的人都可以立即看到。\n这里是对存储库中 `README` 模板的分解（[`github.com/PacktPublishing/GitHub-for-Next-Generation-Coders/tree/main/Chapter%2012`](https://github.com/PacktPublishing/GitHub-for-Next-Generation-Coders/tree/main/Chapter%2012)）以及每个部分的作用：\n\
  * **添加徽章**：此部分在你的个人资料中添加一个徽章，展示你作为 Azure 解决方案架构师专家的认证。它是向访客快速传达你专业知识的视觉提示：\n```\n\
  <!-- Header -->\n<p align=\"center\">\n  <img src=\"https://img.shields.io/badge/Azure%20Solutions%20Architect%20Expert-%230078D4.svg?&style=for-the-badge&logo=microsoft-azure&logoColor=white\"\
  \ alt=\"Azure Solutions Architect Expert\">\n</p>\n```\n\n\n\n### 设置姓名\n以下代码以大字体设置您的姓名并将其居中显示在页面上，使其对访客立即可见。在姓名下方，它添加了您的职位，**Senior\
  \ Azure Cloud Solutions Architect**，以及您的位置，**\U0001F4CD Frankfurt Rhine-Main Metropolitan\
  \ Area**，同样居中以便阅读。这提供了关于您的快速、基本信息：\n```\n<!-- Name and Location -->\n<h1 align=\"\
  center\">Your Name</h1>\n<h3 align=\"center\">Senior Azure Cloud Solutions Architect</h3>\n\
  <h4 align=\"center\">\U0001F4CD Frankfurt Rhine-Main Metropolitan Area</h4>\n```\n\
  \n### 个人头像\n这为您的个人头像预留了空间，使个人资料更具个人特色和亲和力。该图像从特定的 GitHub 仓库中提取，并以中等尺寸显示：\n```\n\
  <!-- Profile Picture -->\n<p align=\"center\">\n  <img src=\"https://github.com/[your-username]/biographyii/blob/main/1674712595713-plava2.jpg\"\
  \ alt=\"Your Name\" width=\"200\">\n</p>\n```\n\n### 简介\n接下来，您可以继续添加一段简短的个人简介，在其中解释您喜欢编程的原因以及您现在正在学习的内容。您还可以写下您接下来打算学习的内容，这能向他人展示您对成长的热情。您可以在以下图中查看我的\
  \ **About Me** 部分：\n![图 12.8 – About Me section](img/B21847_12_08.jpg)\n图 12.8 –\
  \ 关于我 部分\n\n### 关于我\n以下代码片段介绍了 **About Me** 部分，您可以在其中分享有关您的专业背景、专业知识以及您希望突出的任何其他个人见解的信息。在此部分中，您可能会讨论您作为年轻程序员的旅程、您的成就、推动您职业发展的动力，或您如何应对挑战。这是一个讲述您的故事、与访客建立联系并为\
  \ GitHub 上展示的工作提供背景的机会：\n```\n<!-- About Me -->\n## About Me\nAs an experienced\
  \ Azure Solutions...\n```\n\n### 技能\n您还可以以徽章和图片的形式添加您的技能、证书和专业知识：\n![图 12.9 – Core\
  \ Skills section](img/B21847_12_09.jpg)\n图 12.9 – 核心技能 部分\n以下代码块旨在直接在您的 GitHub 个人资料上展示您的核心技能，通过具有视觉吸引力的徽章突出您的技术能力。就像将微服务、.NET、C#\
  \ 以及 React 和 Angular 框架等技能的奖牌别在您的数字个人资料上一样。将这些徽章居中排列可创建引人注目的展示，能让访客快速了解您的专业领域。这种设置非常适合希望直观展示技能组合的开发人员，使其\
  \ GitHub 个人资料不仅是代码存放地，也是其在关键技术方面熟练程度的证明：\n```\n<!-- Core Skills -->\n## Core Skills\n\
  <p align=\"center\">\n  <img src=\"https://img.shields.io/badge/Microservices-%23404D59.svg?&style=for-the-badge\"\
  \ alt=\"Microservices\">\n  <img src=\"https://img.shields.io/badge/.Net%20%7C%20C%23-%23239120.svg?&style=for-the-badge\"\
  \ alt=\".Net | C#\">\n  <img src=\"https://img.shields.io/badge/React%20%7C%20Angular-%2361DAFB.svg?&style=for-the-badge\"\
  \ alt=\"React | Angular\">\n</p>\n```\n正如您所见，`shields.io` 网站已被用于展示您最重要的技能。[`shields.io/docs/logos`](https://shields.io/docs/logos)\
  \ 是一个开源的徽章服务，您可以轻松将其包含在您的 GitHub README 个人资料或任何其他仓库的 README 中：\n![图 12.10 – Shields.io](img/B21847_12_10.jpg)\n\
  图 12.10 – Shields.io\n\n### 图像\n如果您愿意，您还可以使用来自各种来源的其他图像来展示您的证书、技能、社交图标或类似内容。只需在图像标签中指定您想要引用的图像的来源，它就会显示在您的个人资料上：\n\
  ![图 12.11 – Custom showcase icons](img/B21847_12_11.jpg)\n图 12.11 – Custom showcase\
  \ icons\n\n### 认证\n以下代码块在您的 GitHub 个人资料上展示特定的认证，证明了您的成就和专业知识。通过将这些徽章居中排列，布局确保它们能吸引访问您个人资料的任何人的注意：\n\
  ```\n<!-- Certifications -->\n## Certifications\n<p align=\"center\">\n  <img src=\"\
  https://img.shields.io/badge/GitHub%20Partner%20Trainer-%23181717.svg?&style=for-the-badge&logo=github\"\
  \ alt=\"Accredited GitHub Partner Trainer GitHub Admin\">\n</p>\n<p align=\"center\"\
  >\n  <a href=\"https://www.credly.com/badges/70f4339c-6104-4d19-b0cf-40471e7cef1f/public_url\"\
  \ target=\"_blank\">\n    <img src=\"https://images.credly.com/size/340x340/images/0ba22331-acf9-4e8a-8ce3-b4cc3d376040/image.png\"\
  \ alt=\"Microsoft Certified: Cybersecurity Architect Expert\" width=\"100\">\n \
  \ </a>\n  <br>\n</p>\n```\n![图 12.12 – Adding images](img/B21847_12_12.jpg)\n图 12.12\
  \ – Adding images\n\n现在您已经学会如何使用徽章自定义 GitHub README 个人资料并展示您的技能和认证，是时候更进一步了。接下来，我们将研究如何向您的个人资料添加统计数据和成就。这就像在房间里挂上您的高分和奖杯，展示您所取得的成就以及您在编程之旅中表现出的活跃程度。让我们让您的\
  \ GitHub 个人资料不仅反映您的技能，也成为您成就的庆祝。\n\n# 向您的个人资料添加统计数据和成就\n您的 GitHub 个人资料就像您的超级英雄服装。它告诉人们关于您的能力（技能）、您的冒险（项目）以及您一路获得的荣誉徽章（成就）。但是如何确保人们一次就能看到您做过的所有酷炫的东西呢？这就是小部件发挥作用的地方！\n\
  \n## 这些小部件是什么？\n**Widgets** 就像您可以添加到 GitHub 个人资料的 README 文件中的小展示窗口（一份介绍您和您的工作的特殊文档）。这些小部件可以展示您的\
  \ GitHub 统计数据，例如您参与了多少项目或使用了多少编程语言。这是一种以有趣且直观的方式展示您的编程之旅和成就的方式。\n\n以下是一些小部件示例：\n\
  * **GitHub Stats**：此小部件显示您做出的贡献数量、为您的项目点星的人数等。它就像您 GitHub 活动的迷你成绩单。\n* **Top Languages**：此小部件显示您最常使用的编程语言，让观众了解您的编程偏好。\n\
  * **Streak Stats**：这突出了您连续贡献的天数，展示了您的奉献精神。\n\n让我们将所有这些 **GitHub Stats** 小部件添加到您的个人资料中。您可以使用\
  \ https://github.com/anuraghazra/github-readme-stats API 来显示状态和使用的主要语言。在那里，在 `github-readme-stats`\
  \ 的 GitHub 仓库中，您可以找到许多演示并非常轻松地配置您自己的统计小部件：\n![图 12.13 – GitHub Stats widgets](img/B21847_12_13.jpg)\n\
  图 12.13 – GitHub Stats 小部件\n\n这就是您可以让每个人了解您的编程偏好以及您在 GitHub 上取得的成就的方式。通过将这些小部件添加到您的\
  \ GitHub README 个人资料中，您可以分享您最常用的编程语言并突出显示您的 GitHub 活动，例如贡献、提交等。只需在 URL 中将 `[your-username]`\
  \ 替换为您实际的 GitHub 用户名，这些图表就会自动更新以展示您的统计数据。这是一种有趣且动态的方式，向访问您个人资料的任何人展示您的技能和辛勤工作：\n\
  \n\n\n```\n# \U0001F4CA GitHub Stats:\n<p><img align=\"left\" src=\"https://github-readme-stats.vercel.app/api/top-langs?username=[your-username]&show_icons=true&locale=en&layout=compact\"\
  \ alt=\"[your-username]\" /></p>\n<p>&nbsp;<img align=\"center\" src=\"https://github-readme-stats.vercel.app/api?username=[your-username]&show_icons=true&locale=en\"\
  \ alt=\"[your-username]\" /></p>\n```\n同样地，你可以使用 https://github-readme-streak-stats.herokuapp.com/demo/\
  \ 来展示你的连续提交统计。**连续提交统计** 小部件可以通过他们网站上的配置 UI 轻松配置：\n![图 12.14 – GitHub 连续提交统计小部件配置](img/B21847_12_14.jpg)\n\
  图 12.14 – GitHub 连续提交统计小部件配置\n以下代码片段会在你的个人资料中添加一个动态图表，突出显示你的 GitHub 活动连续提交情况。它就像你编码一致性的视觉日记，让人一窥你定期为项目提交的频率，并展示你作为开发者的承诺和进步。只需将\
  \ `\\[your-username\\]` 替换为你的实际 GitHub 用户名即可个性化设置：\n```\n<p><img align=\"center\"\
  \ src=\"https://github-readme-streak-stats.herokuapp.com/?user=[your-username]&\"\
  \ alt=\"[your-username]\" /></p>\n```\n![图 12.15 – GitHub 统计部分](img/B21847_12_15.jpg)\n\
  图 12.15 – GitHub 统计部分\n## 为什么应该添加统计数据和成就？\n在个人资料上添加统计数据和成就具有以下优势：\n* 这是展示你的技能并让访客了解你正在从事工作的快速方式。\n\
  * 带有彩色小部件和统计数据的个人资料比纯文本更具吸引力。它能让你的个人资料在其他资料中脱颖而出。\n* 当人们看到你的成就和贡献时，你可能会激励他们开始自己的编程之旅。\n\
  ## 展示你的 GitHub 奖杯\n将你的 GitHub 个人资料想象成一个展示架，上面陈列着你的成就。架子上的每一个奖杯都讲述着你所面对并征服的挑战的故事。GitHub\
  \ 奖杯就是这样！它们是有趣、色彩鲜艳的徽章，庆祝你的成就并向任何访问你个人资料的人展示你的成就。\n*什么是 **GitHub 奖杯**？\n**GitHub\
  \ 奖杯** 就像你在 GitHub 上为不同成就获得的虚拟奖牌。例如，你可能因为使用多种编程语言或为项目做出大量贡献而获得一个。\n*它们如何为 **你的个人资料**\
  \ 增添价值？\n它们可以突出你在使用语言方面的多才多艺（例如 `MultiLanguage` 奖杯）或你为项目做出贡献的热情（例如 `Commits` 奖杯）。奖杯可以激励你更多地参与社区。当你看到\
  \ `PullRequest` 或 `Issues` 奖杯时，这是一个继续协作和解决问题的推动。获得第一个关注者或有人为你的项目点星是令人兴奋的。`Followers`\
  \ 和 `Stars` 的奖杯庆祝了你在编程冒险中的这些社交里程碑：\n![图 12.16 – GitHub 奖杯部分](img/B21847_12_16.jpg)\n\
  图 12.16 – GitHub 奖杯部分\n以下代码块介绍了一种在个人资料上直接展示你的 GitHub 成就的有趣方式。通过添加 **GitHub 奖杯**\
  \ 部分，你本质上是在展示你在 GitHub 上为各种成就所获得的奖杯集合。提供的图像链接会根据你的活动和成就生成一组个性化奖杯，采用 `radical` 主题样式，使你的个人资料脱颖而出。这是一种以创意格式突出你的辛勤工作和贡献的好方法。只需将\
  \ `\\[your-username\\]` 替换为你的实际 GitHub 用户名即可查看你的独特奖杯：\n```\n## \U0001F3C6 GitHub\
  \ Trophies\n![](https://github-profile-trophy.vercel.app/?username=[your-username]&theme=radical&no-frame=false&no-bg=true&margin-w=4)\n\
  ```\n将这些奖杯添加到你的 README 个人资料中，可以将你的 GitHub 页面从简单的个人简介转变为成就的故事书。它增添了个人色彩和一点竞争精神，使你的个人资料不仅信息丰富而且有趣。\n\
  现在你已经用统计数据、成就和奖杯提升了你的 GitHub 个人资料，让我们继续前进。接下来，我们将学习如何组织你的项目和贡献，以便任何访问你个人资料的人都能轻松看到你所做的出色工作。这不仅仅是让你的个人资料成为令人印象深刻的统计数据集合，而是一个组织良好的作品集，讲述着你的开发冒险故事。\n\
  # 战略性地展示项目和贡献\n为了让你的个人资料更专业，你可以提及你最自豪的项目。这样，你就可以将访客引导至你正在从事的最重要的项目：\n![图 12.17 –\
  \ 展示项目](img/B21847_12_17.jpg)\n图 12.17 – 展示项目\n以下是一个在你的 GitHub README 个人资料中引入 **项目**\
  \ 部分的代码片段。此部分是你突出显示你所从事并特别自豪的项目的机会。这也是你展示技能和创造力的机会，让其他人看到你所取得的成就。每个项目条目提供简要概述，列出所使用的技术，并提供查看项目及其屏幕截图的链接。这样，访客可以快速了解你的工作，甚至深入了解引起他们兴趣的项目：\n\
  ```\n<!-- Projects -->\n## \U0001F331 My Projects\nBelow are some of the projects\
  \ I'm most proud of. Check them out!\n### \U0001F31F Project 1: One Page Portfolio\
  \ Website\n- **Description**: A sleek and responsive one-page portfolio website\
  \ showcasing my skills, experiences, and projects.\n- **Technologies Used**: HTML,\
  \ CSS, JavaScript\n- **View Project**\n![One Page Portfolio Website](img/link-to-screenshot-of-your-project)\n\
  ### \U0001F4DA Project 2: Space Invaders\n- **Description**: A dynamic, exciting\
  \ and challenging shooting game set in space.\n- **Technologies Used**: HTML, CSS,\
  \ JavaScript, GitHub Actions\n- **View Project**\n![Space Invaders](img/link-to-screenshot-of-your-project)\n\
  ```\n为了让你的项目在 GitHub 个人资料上脱颖而出，请为每个列出的项目遵循以下简单步骤：\n* 对于 `\\View Project\\`，将 `link-to-your-project`\
  \ 替换为指向你的项目的实际 URL。这可以是实时网站或 GitHub 仓库。\n* 要显示图像（例如你项目的屏幕截图），请将 `link-to-screenshot-of-your-project`\
  \ 替换为指向你的图像的实际 URL。如果不确定如何托管图像，可以直接将屏幕截图上传到你的 GitHub 仓库并链接到那里。\n* 自定义 **Technologies\
  \ Used** 部分，以反映你在每个项目中实际使用过的技术。\n## 添加贡献和亮点\n如果你为其他项目做出了贡献，请确保这些贡献在你的 GitHub 个人资料上易于找到。你可以通过在个人资料的\
  \ README 中添加一个列出所有贡献的小部件来实现。这表明你不仅在从事自己的项目，还在帮助他人完成他们的项目。\n以下是一个代码片段，你可以用它来包含此功能。只需记住将\
  \ `\\[your-username\\]` 替换为你的实际 GitHub 用户名。这将生成一个动态图像（*图 12**.18*），根据你设定的标准显示你的顶级贡献，例如显示的仓库数量限制和合并所有年度贡献。这是一种直观地展示你对项目的辛勤工作和奉献精神的好方法：\n\
  ```\n### \U0001F51D Top Contributed Repo\n![](https://github-contributor-stats.vercel.app/api?username=[your-username]&limit=5&theme=default&combine_all_yearly_contributions=true)\n\
  ```\n![图 12.18 – 贡献仓库](img/B21847_12_18.jpg)\n图 12.18 – 贡献仓库\n接下来你可以做的就是添加你的个人网站和社交网络，以便与社区建立联系：\n\
  ![图 12.19 – 社交网络](img/B21847_12_19.jpg)\n\n\n\n## 图 12.19 – 社交网络\n\n以下代码片段旨在为你的\
  \ README 增加一个专门的部分，用于个人或项目网站以及社交媒体链接。此增添不仅提升了个人资料的视觉吸引力，还使访客更容易在各个平台上与你联系：\n\n```\n\
  <!-- Website -->\n## Website\nLink : [[your name]](https://[your-username].github.io/[your-username]/)\n\
  <!-- Social Media Links -->\n## \U0001F587️ Let's connect!\n<p align=\"center\"\
  >\n  <a href=\"https://dev.to/[your-username]\" target=\"blank\"><img align=\"center\"\
  \ src=\"https://dev-to-uploads.s3.amazonaws.com/uploads/logos/resized_logo_UQww2soKuUsjaOGNB38o.png\"\
  \ alt=\"[your-username]\" height=\"30\" width=\"40\" /></a>\n<a href=\"https://twitter.com/[your-username]\"\
  \ target=\"blank\"><img align=\"center\" src=\"https://www.freepnglogos.com/uploads/twitter-x-logo-png/twitter-x-logo-png-9.png\"\
  \ alt=\"[your-username]\" height=\"30\" width=\"40\" /></a>\n<a href=\"https://linkedin.com/in/[your-username]\"\
  \ target=\"blank\"><img align=\"center\" src=\"https://www.freepnglogos.com/uploads/linkedin-logo-design-30.png\"\
  \ alt=\"[your-username]\" height=\"30\" width=\"40\" /></a>\n<a href=\"https://www.youtube.com/c/[your-username]\"\
  \ target=\"blank\"><img align=\"center\" src=\"https://www.freepnglogos.com/uploads/youtube-circle-icon-png-logo-14.png\"\
  \ alt=\"[your-username]\" height=\"30\" width=\"40\" /></a>\n</p>\n```\n\n在前面的代码片段中，我们有以下内容：\n\
  * **网站** 部分允许你插入指向个人或项目网站的直接链接，邀请访客探索更多你的作品。\n* **让我们连接！** 部分被设计为社交媒体链接的集中枢纽。每个图标都是一个可点击的链接，可将访客引导至你在\
  \ dev.to、X（前称 Twitter）、LinkedIn 和 YouTube 等平台上的个人资料。\n\n请将 `\\[your-username\\]`\
  \ 替换为你在这些平台上的实际用户名，并将 `\\[your name\\]` 替换为你希望为网站链接显示的名称。这种个性化的方法不仅展示了你的项目和技能，还为专业网络和个人联系开辟了渠道。\n\
  \n## 使用 GitHub Pages 展示你的作品\n\n正如你在 *第 9 章* 中学到的，GitHub Pages 允许你免费将仓库转变为实时网站。这是一个展示个人资料页作为网站的绝佳方式。就像拥有自己的数字作品集，可以与朋友、家人甚至潜在雇主分享。\n\
  \n通过遵循这些提示，你可以让你的 GitHub 个人资料成为编程之旅的精彩展示。井然有序的 GitHub README 个人资料不仅能给人留下良好的第一印象，还能引导访客（如潜在协作者或雇主）查看你的最佳作品并了解你作为开发者的历程。\n\
  \n通过这些步骤，你学会了如何将 GitHub 个人资料转变为动态作品集，不仅展示你的项目，还能让你与更广泛的社区和潜在机会建立联系。通过突出你引以为傲的成就、分享你的贡献，并链接到你的社交网络和个人网站，你创建了专业自我的全面快照。\n\
  \n## 摘要\n\n在本章中，我们探讨了如何在 GitHub 个人资料上战略性地展示项目和贡献，以最好地展示你的技能、经验和成就。我们涵盖了优化个人资料概览、展示你的专业知识，以及通过统计数据和成就让个人资料脱颖而出。这些努力不仅增强了个人资料的吸引力，还向潜在协作者和雇主强调了你的能力。\n\
  \n在下一章中，我们将重点介绍如何利用 Copilot 进行代码补全、建议、确保代码整洁和最佳实践、协作编码以及优化工作流程。本章将通过介绍工具和策略来进一步提高你的编码效率和生产力，从而自然地扩展我们的讨论。\n\
  \n## 测验\n\n回答以下问题：\n1. 优化你的 GitHub 个人资料概览的主要目标是什么？\n    1. 显示你的联系信息\n    2. 突出你的编程技能\n\
  \    3. 展示你的爱好\n    4. 列出你的教育背景\n    *答案*: B. 突出你的编程技能\n2. 真假：为你的 GitHub 个人资料添加自定义\
  \ README 允许你展示你的项目和贡献。\n    1. 真\n    2. 假\n    *答案*: A. 真\n3. 填空：在你的 GitHub 个人资料上展示\
  \ ______________ 有助于突出你在特定领域的专业知识。\n    *答案*: 技能\n4. 哪个功能可以通过显示你的编码活动让你的 GitHub\
  \ 个人资料脱颖而出？\n    1. 个人资料浏览计数器\n    2. **GitHub 统计**\n    3. 关注者列表\n    4. 已加星仓库\n\
  \    *答案*: B. **GitHub 统计**\n5. 真假：战略性地在 GitHub 个人资料上展示项目对于吸引潜在协作者和雇主很重要。\n    1.\
  \ 真\n    2. 假\n    *答案*: A. 真\n6. 添加项目 README 包含什么内容对访客有益？\n    1. 你的简历\n    2.\
  \ 仅代码片段\n    3. 详细的项目描述以及如何使用它\n    4. 仅截图\n    *答案*: C. 详细的项目描述以及如何使用它\n7. 填空：在你的\
  \ GitHub 个人资料上包含 ______________ 成就可以证明你对开源项目的贡献。\n    *答案*: 编程\n8. GitHub Pages\
  \ 如何与你的 GitHub 个人资料相关联使用？\n    1. 创建个人博客\n    2. 主持静态项目作品集网站\n    3. 跟踪你的日常活动\n\
  \    4. 出售商品\n    *答案*: B. 主持静态项目作品集网站\n9. 个人资料中包含什么元素可以增强其吸引力并提供对你个人编程之旅的洞察？\n\
  \    1. 猫的动画 GIF\n    2. 详细的旅行日志\n    3. GitHub 活动的视觉图表\n    4. 随机名言\n    *答案*:\
  \ C. GitHub 活动的视觉图表\n10. 真假：定期更新 GitHub 个人资料上的项目是不必要的。\n     1. 真\n     2. 假\n \
  \    *答案*: B. 假\n"
- "## 13 GitHub Copilot 助力代码创建\n\n在本章中，我们将讨论 GitHub Copilot 如何成为你的终极编程助手，帮助你轻松编码。GitHub\
  \ Copilot 在各种编程语言中提供实时代码建议，显著提高你的编码效率和创造力。通过本章，你将学习如何使用 Copilot 生成代码片段、最佳实践，甚至进行单元测试，所有这些都旨在改进你的编码项目。到本章结束时，你将熟练利用\
  \ GitHub Copilot 来简化你的编码流程、创建更干净的代码，从而加快你在新编程语言中的学习曲线。\n\n在本章中，我们将涵盖以下主要主题：\n* 了解\
  \ GitHub Copilot，你的编程助手\n* 使用 Copilot 进行代码补全和建议\n* 使用 Copilot 实现整洁代码和最佳实践\n* 使用\
  \ GitHub Copilot 进行提示工程\n* GitHub Copilot 对在校程序员免费吗？\n\n## 技术要求\n\n\n\n在深入本章之前，请确保已安装\
  \ `Visual Studio Code`，因为它是与 GitHub Copilot 一起使用的主要 IDE。访问 Copilot 还需要一个 GitHub\
  \ 账户。首先安装 Visual Studio Code 的 GitHub Copilot 扩展，可在 [`marketplace.visualstudio.com/items?itemName=GitHub.copilot`](https://marketplace.visualstudio.com/items?itemName=GitHub.copilot)\
  \ 找到。从 [`github.com/PacktPublishing/GitHub-for-Next-Generation-Coders/tree/main/Chapter%2013`](https://github.com/PacktPublishing/GitHub-for-Next-Generation-Coders/tree/main/Chapter%2013)\
  \ 下载名为 `Chapter 13` 的 GitHub 文件夹，以跟进动手部分。\n\n# 了解 GitHub Copilot，你的编码助手\n\n想象一下，你正在尝试搭建一个又大又漂亮的乐高城堡，但你对乐高并不擅长。幸运的是，你有一个非常擅长乐高的朋友。他们可以建议你使用哪块积木开始搭建，或提出你从未想过的酷炫设计点子。这基本上就是\
  \ GitHub Copilot 的作用，只是它不是搭建乐高，而是用于几乎任何编程语言的编码。\n\n![图 13.1 – GitHub Copilot](img/B21847_13_01.jpg)\n\
  图 13.1 – GitHub Copilot\n\n`GitHub Copilot` 就像你一直想要的超级聪明的朋友，帮助你编写代码。你用简单的英语告诉它你想做什么，它就会建议可能帮助你实现的代码块。它是由\
  \ GitHub 开发的工具，利用互联网上大量代码数据为你提供建议。它使用 `Artificial Intelligence` (`AI`) 来根据你已编写的注释和代码，建议代码行、完成函数，甚至编写整个代码块。\n\
  \n![图 13.2 – 一次 GitHub Copilot 演示](img/B21847_13_02.jpg)\n图 13.2 – 一次 GitHub Copilot\
  \ 演示\n\n## 它是如何工作的？\n\nGitHub Copilot 由一种名为 `Large Language Models` (`LLMs`) 的技术驱动。Copilot\
  \ 已在互联网上大量公开可用的代码上进行训练。这意味着它见过许多不同的编码风格、语言和常见问题的解决方案。\n\n当你在代码编辑器中开始输入时，Copilot\
  \ 会查看你正在编写内容的上下文。它理解你使用的语言、已导入的库以及正在处理的函数。\n\n基于上下文，Copilot 会建议可能适合你正在尝试做的事情的代码行或整个函数。你可以选择接受、修改或忽略这些建议。\n\
  \n假设你正在制作你的单页作品集网站，并且只想添加一个新功能，例如你的项目幻灯片或联系页面。你开始在代码编辑器中输入注释，例如 `Create a slideshow\
  \ of projects`。然后，GitHub Copilot 跳出来并建议一段可以创建该项目幻灯片或联系页面的代码块，如图 13.3 所示。就好像它刚刚与你交谈并递给你想要的确切乐高积木。\n\
  \n你查看建议的代码片段，如果看起来不错，你可以接受它并继续编码另一部分。如果不行，你可以要求 Copilot 提供另一个建议或按你认为最好的方式增强它。就好像与你的乐高朋友一起合作，共同决定如何建造最酷的城堡。\n\
  \n![图 13.3 – GitHub Copilot 实际操作](img/B21847_13_03.jpg)\n图 13.3 – GitHub Copilot\
  \ 实际操作\n\n## AI 和 LLM 的快速介绍\n\nAI 是一种让计算机执行通常需要人类智能的任务的方法。LLM 是一种能够理解和生成类人类文本的 AI\
  \ 类型。它们在大型数据集上进行训练，可以预测句子或代码片段的下一个内容。\n\nLLM 的工作原理如下：\n\n*   **训练**：LLM 在大量文本数据上进行训练，包括书籍、文章和代码。在训练期间，模型学习预测句子中的下一个词或代码片段中的下一行。\n\
  *   **生成文本**：训练完成后，模型可以根据收到的输入生成文本。例如，如果你开始编写一个函数，模型可以预测并建议函数的下一部分。\n*   **随着时间的推移而改进**：随着越来越多的人使用\
  \ Copilot 等工具，模型可以继续学习和改进，提供更好、更准确的建议。\n\n## 为什么 Copilot 很酷？\n\n不必为每件小事在 Google\
  \ 上搜索、在各种网站上查找、阅读文档、在论坛上提问，或试图记住如何做某事，Copilot 会直接在你的代码编辑器中为你提供建议，例如 `Visual Studio\
  \ Code` 或 `Codespaces`，直接在 GitHub 上。看到 Copilot 的建议可以帮助你学习新的编码方式，或介绍新的功能和最佳实践。有时，Copilot\
  \ 的建议会激发你在项目中尝试你甚至从未想过的事情。\n\n## 使用 Copilot 编码时需要注意什么\n\n就像你的乐高朋友有时可能会递给你一块不太合适的积木一样，Copilot\
  \ 的建议也不总是完全符合你的需求。你仍然需要审查并可能对其进行调整。Copilot 是来帮忙的，而不是替你完成全部工作。最好的项目来自你的创造力和解决问题的能力，而\
  \ Copilot 则是你的助手。\n\n## 如何开始\n\n要开始为个人项目使用 GitHub Copilot，你需要注册试用或订阅。\n\n首先，前往 GitHub\
  \ Copilot 页面。你可以通过在线搜索 `GitHub Copilot` 找到它，或直接前往 GitHub Copilot 的网站：[`github.com/features/copilot`](https://github.com/features/copilot)。\n\
  \n你也可以从你的 GitHub 账户访问 GitHub Copilot。以下是快速指南：\n\n1.  点击 GitHub 上的个人资料照片并选择 `Your\
  \ Copilot`。\n![图 13.4 – 从个人资料菜单访问 GitHub Copilot](img/B21847_13_04.jpg)\n图 13.4\
  \ – 从个人资料菜单访问 GitHub Copilot\n1.  在设置页面中，选择 `Start free trial`。\n![图 13.5 – 开始 GitHub\
  \ Copilot 免费试用](img/B21847_13_05.jpg)\n图 13.5 – 开始 GitHub Copilot 免费试用\n1.  在月付或年付之间选择，然后点击\
  \ `Get access to GitHub Copilot`。\n![图 13.6 – 获取 GitHub Copilot 访问权限](img/B21847_13_06.jpg)\n\
  图 13.6 – 获取 GitHub Copilot 访问权限\n1.  输入你的付款详情并提交。\n![图 13.7 – 添加付款详情](img/B21847_13_07.jpg)\n\
  图 13.7 – 添加付款详情\n1.  设置你的偏好，然后点击 `Save and complete setup`。\n![图 13.8 – 选择你的偏好设置](img/B21847_13_08.jpg)\n\
  图 13.8 – 选择你的偏好设置\n\n接下来，确保你的计算机上已安装 `Visual Studio Code` (`VS Code`)，以便你可以添加 GitHub\
  \ Copilot 插件，从而有效地利用 GitHub Copilot 的功能。\n\n![图 13.9 – 安装受支持的 IDE](img/B21847_13_09.jpg)\n\
  图 13.9 – 安装受支持的 IDE\n\n## 安装 GitHub Copilot 扩展\n\n打开 VS Code 并通过点击侧边栏上的方形图标找到 `EXTENSIONS`\
  \ 视图，或按 `Ctrl` + `Shift` + `X`。\n\n在顶部的搜索栏中，输入 `GitHub Copilot` 并查找 GitHub Copilot\
  \ 扩展。它应该是最先弹出的，如图 13.10 所示。\n\n![图 13.10 – 安装 GitHub Copilot VS Code 扩展](img/B21847_13_10.jpg)\n\
  图 13.10 – 安装 GitHub Copilot VS Code 扩展\n\n点击蓝色的 `Install` 按钮。这就像告诉 VS Code，“嘿，我想添加这个智能助手！”\
  \ Visual Studio 将安装 GitHub Copilot 扩展，然后你将看到如图 13.11 所示的屏幕。\n\n![图 13.11 – 安装后带有代码扩展的\
  \ GitHub Copilot](img/B21847_13_11.jpg)\n图 13.11 – 安装后带有代码扩展的 GitHub Copilot\n\n\
  \n\n一旦在 VS Code 中安装了 Copilot，如果尚未将其链接到你的 GitHub 账户，你将被要求在 VS Code 内登录 GitHub。如果已将\
  \ VS Code 与 GitHub 账户关联，GitHub Copilot 将自动设置并准备好使用。如果未看到授权提示，可以单击位于 VS Code 窗口底部面板的铃铛图标来检查通知。\n\
  \n# 使用 Copilot 进行代码补全和建议\n\n登录后，在 VS Code 中打开一个新文件或现有项目并开始输入代码。\n\n当你输入时，GitHub\
  \ Copilot 将开始建议补全内容，甚至是整段代码。就像有一个朋友建议：“*嘿，试试**下一步！*”\n\n![图 13.12 – GitHub Copilot\
  \ 提供代码建议](img/B21847_13_12.jpg)\n图 13.12 – GitHub Copilot 提供代码建议\n\n让我们在本书中构建的单页个人资料网站上尝试一下（[`https://github.com/PacktPublishing/GitHub-for-Next-Generation-Coders/blob/main/Chapter%2013/index.html`](https://github.com/PacktPublishing/GitHub-for-Next-Generation-Coders/blob/main/Chapter%2013/index.html))\
  \ 并请 Copilot 为你创建 **联系我们** 部分。使用 `Ctrl` + `Enter` 键盘快捷键打开 Copilot 聊天（它会打开一个单独的面板显示\
  \ 10 条建议）。你可以使用类似 **我希望你为我创建带有 Google 地图、地址、电话、电子邮件和联系表单的新联系部分。使用与上一部分类似的代码并添加****CSS\
  \ 样式。** 的提示。\n\n![图 13.13 – 与 GitHub Copilot 聊天](img/B21847_13_13.jpg)\n图 13.13\
  \ – 与 GitHub Copilot 聊天\n\n按下 `Enter` 或单击聊天框中的箭头后，你将看到 Copilot 如何开始为你的新 **联系我们**\
  \ 部分编写代码。你可以选择接受、丢弃或重试。\n\n![图 13.14 – GitHub Copilot 提供代码片段](img/B21847_13_14.jpg)\n\
  图 13.14 – GitHub Copilot 提供代码片段\n\n你还可以将光标悬停在为你建议的代码片段上，Copilot 将为该特定代码块显示替代建议。然后你可以选择最符合你需求的一个。\n\
  \n现在，你可以接受 Copilot 为你提供的代码，并通过开始输入来获取建议以进一步增强它。此外，你还需要为我们创建的每个类添加 CSS 样式。\n\n在 `Chapter\
  \ 13` 目录中，打开你的 `styles.css` 文件并开始输入以获取有关你想要创建的样式的建议。当你看到喜欢的建议时，可以按 `Tab` 键接受它。这就像对朋友的建议说\
  \ *好主意！*。如果不喜欢该建议，只需继续输入，Copilot 将尝试提供其他内容。它非常灵活，旨在以最好的方式帮助你。\n\n![图 13.15 – GitHub\
  \ Copilot 提供 CSS 建议](img/B21847_13_15.jpg)\n图 13.15 – GitHub Copilot 提供 CSS 建议\n\
  \n经过几次提示后，你的单页作品集网站上将拥有一个漂亮的 **联系我们** 部分。你可以在 *图 13**.16* 中看到同样的内容。\n\n![图 13.16\
  \ – 你单页作品集网站上的联系我们部分](img/B21847_13_16.jpg)\n图 13.16 – 你单页作品集网站上的联系我们部分\n\nGitHub\
  \ Copilot 就像有一个助手，之前看过很多代码，可以提供建议来加快你的编码速度，甚至教你一些新技巧。它在以下方面非常出色：\n\n* 通过在你输入时建议代码来加快你的编码速度\n\
  * 通过展示不同的编码方式帮助你学习\n* 让编码过程不那么孤单，尤其是在你刚开始时\n\n现在我们已经了解了 Copilot 如何帮助代码补全和建议，让我们继续前进。在下一节中，我们将看到\
  \ Copilot 的用途不仅仅是填充代码。我们将探讨它如何支持干净的编码实践、帮助生成单元测试、鼓励测试驱动开发，以及通过重构帮助完善和改进你的代码。\n\n\
  # 使用 Copilot 进行干净的代码和最佳实践\n\n除了帮助你编写更好的代码外，GitHub Copilot 还可以为你提供遵循最佳实践和指南的建议，帮助你创建测试以检查代码是否正常工作，甚至提供使代码更干净、更高效的技巧。让我们现在学习一些这些最佳实践。\n\
  \n## 单元测试生成\n\n*什么是**单元测试？*\n\n**单元测试**就像为网站的每个部分提供一个小测验，以确保每个部分都了解自己的任务。例如，如果你的网站是一个拼图，每个单元测试都会检查单个拼图块是否正好放在它应该在的位置。这很重要，因为它可以及早发现错误，确保在将所有内容组合在一起之前，网站的每个部分，例如你的\
  \ `index.html` 文件中的 **我的文章** 部分，都能正常工作。\n\nGitHub Copilot 可以帮助你编写这些测验（单元测试）。它会建议向代码的每个部分提出的问题（测试），以确保它们已准备好参加期末考试（你的成品网站）。Copilot\
  \ 通过根据你的代码预测你可能需要检查的内容，帮助你更快地编写这些测试。\n\n*图 13**.17* 显示你正在处理与游戏中创建道具相关的 JavaScript\
  \ 函数。你已要求 GitHub Copilot 为 `powerUpTypes` 函数编写一些单元测试。单击 VS Code 左侧 **活动** 栏上的 GitHub\
  \ Copilot 图标将打开 **Copilot** 侧边栏，你可以在其中与 Copilot 交互。GitHub Copilot 可以建议测试，例如确认属性已设置并且行为在预期时间内发生，确保每个道具都能按计划增强游戏。\n\
  \n![图 13.17 – 请求 GitHub Copilot 为所选代码添加单元测试](img/B21847_13_17.jpg)\n图 13.17 – 请求\
  \ GitHub Copilot 为所选代码添加单元测试\n\n在你要求它帮助为所选代码编写单元测试后，GitHub Copilot 将开始执行。\n\n现在，你可以复制这些单元测试并将它们添加到新文件中，稍后可以使用\
  \ GitHub Actions 运行它们。以下图示演示了 Copilot 如何为 `Spaceship` 对象建议 `powerUpTypes` 的测试，该对象控制飞船在游戏中的某些行为，例如速度和无敌。\n\
  \nGitHub Copilot 提供使用 Jest 创建单元测试，Jest 是一个流行的 JavaScript 测试框架。它建议的测试会检查 `powerUpTypes`\
  \ 对象的 `effect` 和 `endEffect` 方法是否按预期运行。例如，当应用 `speed` 道具效果时，飞船的速度应加倍，而当效果结束时，速度应恢复正常。\n\
  \n你可以检查建议的测试，看看它们是否与你的预期和 `spaceship` 对象功能的规范一致。如果它们符合你的需求，你可以将这些测试纳入你的测试套件。\n\n\
  ![图 13.18 – GitHub Copilot 编写单元测试](img/B21847_13_18.jpg)\n图 13.18 – GitHub Copilot\
  \ 编写单元测试\n\n本质上，GitHub Copilot 充当编码助手，自动编写测试以帮助确保游戏功能正常工作。通过编写单元测试，你确保每个功能，例如游戏中的道具，都能独立按预期工作。在\
  \ Copilot 的帮助下，你可以快速、更高效地编写这些测试，为玩家保持稳定、无错误的游戏体验。\n\n## 测试驱动开发实践\n\n\n\n# 测试驱动开发\
  \ (TDD)\n\n`Test-Driven Development` (`TDD`) 类似于在进入厨房之前为你的餐点创建详细的食谱。你决定成品菜肴应该是什么样子以及实现它所需的步骤。这样，你就制定了一个计划，以确保最终菜肴完全符合你的期望。\n\
  在实际的网站构建术语中，TDD 意味着你在为网站的新功能编写实际代码之前，先写出该功能的检查（测试），例如 `MY ARTICLES` 部分。通过这样做，你确切地知道需要编写什么代码才能通过测试。\n\
  例如，你可能会决定 `MY ARTICLES` 部分需要显示最近的五篇文章，并且在两秒内加载。TDD 会要求你先为这些需求编写测试。然后，在构建功能时，你可以持续将其与这些测试进行对照，这些测试可作为你的指南。\n\
  这种方法非常有用，因为它专注于你的编码工作，并且可以在以后节省修复错误的时间，因为你在进行过程中一直在检查。这是一种系统的方法，可以确保你的网站最终正如你设想的那样，为任何访问者顺畅运行。\n\
  现在你知道了 TDD 是什么，你可以告诉 Copilot 你想要编码的功能，并要求它帮助你使用 TDD 技术实现它。在提示 Copilot 之后，它将开始为你生成代码片段，其中包含测试和可能的代码实现。\n\
  \n![图 13.19 – GitHub Copilot 使用 TDD 方法进行编码](img/B21847_13_19.jpg)\n图 13.19 – GitHub\
  \ Copilot 使用 TDD 方法进行编码\n\n如果你想了解更多关于 TDD 的信息，我建议以下资源：\n*   *通过示例进行测试驱动开发* 作者 *Kent\
  \ Beck*：一本经典书籍，介绍了 TDD 的基础知识，并附有实用示例和逐步方法\n*   *Clean Code: 敏捷软件工艺手册* 作者 *Robert\
  \ C. Martin*：虽然不完全是关于 TDD，但这本书涵盖了许多补充 TDD 实践的原则，例如编写干净、可维护的代码\n*   *由测试指导的面向对象软件的成长*\
  \ 作者 *Steve Freeman 和 Nat Pryce*：这本书深入探讨了 TDD 在面向对象设计中的上下文，重点是创建健壮且可维护的软件\n\n##\
  \ 代码重构\n\n所以，你已经烹饪了你的菜肴，但现在你想让它在盘子上看起来更漂亮。`Refactoring` 就像重新排列你煮好的菜肴，使其更具吸引力，而不会改变其味道。\n\
  有时，你的代码可以正常工作，但可以更整洁或更容易理解。Copilot 可以建议整理代码的方法，使其更干净、更有条理，就像厨师可能会帮助你更漂亮地摆盘一样。\n\
  你可以选择代码的一部分并要求 Copilot 根据我们迄今为止在本节中讨论的干净代码最佳实践重构你的代码。然后，它将开始生成更干净、更有组织的代码建议，你可以使用它们。\n\
  \n![图 13.20 – GitHub Copilot 重构所选代码](img/B21847_13_20.jpg)\n图 13.20 – GitHub Copilot\
  \ 重构所选代码\n\n在构建网站时使用 GitHub Copilot 就像有一位乐于助人的向导在你身边，提供建议，帮助你测试你的创作，并确保你的代码尽可能好。它不仅帮助你解决问题，还教你成为更好的编码员，就像和厨师一起烹饪教你成为更好的厨师一样。接下来，我们将探索使用\
  \ GitHub Copilot 的提示工程，这对于充分利用这个工具至关重要，通过学习如何有效地与它沟通来改善你的编码工作流程。\n\n# 使用 GitHub\
  \ Copilot 进行提示工程\n\n想想一个神灯和里面住着一个会编程的精灵。那精灵就是你的 GitHub Copilot。然而，与其擦亮灯并告诉精灵你的愿望，不如使用\
  \ `prompts` 或特殊指令告诉他们你想要他们执行哪种编程魔法。你不会只说，*做一个三明治*。你会给精灵逐步的指示，例如 *拿两片面包*、*在一片上涂花生酱*\
  \ 等等。\n给精灵具体指示并告诉他们你确切想要什么的过程被称为 `prompt engineering`。\n\n![图 13.21 – GitHub Copilot\
  \ 作为灯神精灵](img/B21847_13_21.jpg)\n图 13.21 – GitHub Copilot 作为灯神精灵\n\n## 提示工程是如何工作的？\n\
  \n假设你正在构建你的单页作品集网站，并且想要添加一个新功能，例如照片库。与其自己编写所有代码，不如向 GitHub Copilot 寻求帮助。但这里的诀窍是——你需要清楚地说明你要求的内容。\n\
  对你的愿望更具体，提供的细节越多，Copilot 就越能满足你的请求。例如，与其说 `I want a website gallery`，你可以说，`I want\
  \ a responsive gallery section where you will display the first four pictures with\
  \ hover-over effects. The pictures are stored in the database, for which we need\
  \ to have the connection string and a query that takes the first four photos`。\n\
  在编码术语中，这些 `magic words` 实际上是代码片段或描述，有助于 GitHub Copilot 理解你试图构建的内容。例如，`Create a function\
  \ that calculates the average of three numbers` 是一个清晰直接的提示。\n通过给出这些具体指示，Copilot\
  \ 理解你试图实现的目标，并可以建议符合你需求的代码。\n这就是为什么清晰的指示很重要：\n*   `You avoid misunderstandings`：如果没有清晰的指示，Copilot\
  \ 可能会猜错。就像因为你没有具体说明涂抹位置而导致两片面包上都抹上了花生酱。\n*   `You achieve better results`：你越清晰，Copilot\
  \ 生成你真正想要的代码的可能性就越大。它能更高效地将你的想法变为现实。\n\n## 使用 GitHub Copilot 进行提示工程的酷例子\n\n想象你想要创建一个根据你拥有的食材查找食谱的应用程序。你可能会提示\
  \ Copilot `Write a Python function that takes a list of ingredients and searches\
  \ for recipes online that use those ingredients`。Copilot 可能会生成如图 *图 13**.22* 所示的结果。\n\
  \n![图 13.22 – GitHub Copilot 编写 Python 函数](img/B21847_13_22.jpg)\n图 13.22 – GitHub\
  \ Copilot 编写 Python 函数\n\n另一个很酷的提示工程例子是要求 Copilot，`Design a JavaScript program that\
  \ tracks my spending and categorizes expenses into 'Food', 'Bills', 'Entertainment',\
  \ etc.` Copilot 将基于你的详细提示开始起草代码，如下图所示。\n\n![图 13.23 – GitHub Copilot 编写 JavaScript\
  \ 应用](img/B21847_13_23.jpg)\n图 13.23 – GitHub Copilot 编写 JavaScript 应用\n\n## 优秀提示工程的技巧\n\
  \n在使用 Copilot 练习提示工程时应牢记以下几点：\n*   `Think about the end goal`：你希望你的代码实现什么？从那里开始，反向工作，制作你的提示以引导\
  \ Copilot 朝向该目标。\n*   `Be clear and detailed`：你提供的细节越多，Copilot 生成有用代码就越容易。\n*  \
  \ `Experiment and refine`：没有得到预期的代码？调整你的提示，尝试不同的措辞，或添加更多细节。这就像根据精灵的回应来完善你的愿望。\n\n\
  \n\n使用 GitHub Copilot 进行提示工程将编程转变为与渴望帮助实现你想法的数字伙伴的协作冒险。通过掌握编写提示的艺术，你本质上是在学习如何与一位准备实现你编程愿望的精灵有效沟通。现在你已经了解了提示工程的基础知识，让我们将重点转向实践见解，包括\
  \ GitHub Copilot 是否对在校编程者免费以及如何获取 GitHub 的教育福利。\n\n# GitHub Copilot 对在校编程者免费吗？\n\
  \n如果你在学习期间投身编程世界，GitHub Copilot 将作为免费的友好伙伴出现。以下是与 Copilot 结伴所需具备的条件：\n\n* **作为学生**：你必须年满\
  \ 13 岁并在学校或学院积极学习。\n* **拥有学校电子邮件**：学校发放的电子邮件地址证明你属于教育机构。如果没有，也不用担心！你可以出示一些证明你正在学习的证件。\n\
  \n## 如何申请免费的 GitHub 福利\n\n这非常简单。只需访问 [`github.com/edu`](https://github.com/edu)\
  \ 并点击 **加入 GitHub 教育**，如 *图 13.24* 所示。\n\n![图 13.24 – GitHub 教育页面](img/B21847_13_24.jpg)\n\
  图 13.24 – GitHub 教育页面\n\n在下一个屏幕上，你需要选择你是学生，提供学校名称和学校电子邮件，然后点击 **继续** 以完成学生福利的设置。\n\
  \n![图 13.25 – 在 GitHub 教育页面上选择你的角色](img/B21847_13_25.jpg)\n图 13.25 – 在 GitHub 教育页面上选择你的角色\n\
  \n作为学生，你不仅可以免费使用 GitHub Copilot，还可以获得学生开发者套件，它提供了丰富的资源和工具来提升你的学习和发展之旅。\n\n以下是包含的一些免费资源：\n\
  \n* **免费 GitHub Pro**：在你作为学生的期间，你可以免费使用 GitHub Pro，其中包括私有仓库和高级协作功能\n* **GitHub 学生开发者套件合作伙伴优惠**：解锁各种工具和服务的折扣和免费访问，例如云托管、生产力工具和开发者平台\n\
  * **Azure 积分**：你将获得 Microsoft Azure 服务的积分，让你能够探索云计算并构建应用程序\n* **Codespaces**：直接从浏览器访问基于云的开发环境\n\
  * **学生画廊**：展示你的项目并与其他学生协作\n* **GitHub 校园专家培训**：合格的申请者可以成为 GitHub 校园专家并为当地开发者社区做出贡献\n\
  \n## 给学生的忠告\n\n虽然 GitHub Copilot 是一个很棒的工具，但明智地使用它很重要。这就像学习骑带辅助轮的自行车。它们非常有帮助，但你也需要学会自己保持平衡。同样，请确保做到以下几点：\n\
  \n* **理解代码**：不要只是复制粘贴 Copilot 的建议。尝试理解建议代码为何以及如何工作。\n* **保持好奇**：将 Copilot 作为学习工具使用。提问、探索建议，并深入概念。\n\
  \n简而言之，GitHub 为刚开始编程之旅的学生提供免费、智能且支持性的学习体验，在本节中，我们了解了如何利用其服务。\n\n# 摘要\n\n在 *第 13\
  \ 章* 中，我们探索了 GitHub Copilot，这是一种实时建议代码的工具，使编程更高效、更不孤单，尤其对初学者而言。我们学习了如何使用 Copilot\
  \ 进行代码补全、最佳实践，甚至单元测试。这些知识很有用，因为它可以加快编程项目并帮助你学习新的编程方法。现在，你了解如何让 Copilot 成为你的编程伙伴，这可以提升你的编程技能和项目质量。\n\
  \n# 测验\n\n请回答以下问题：\n\n1. GitHub Copilot 主要用于什么？\n    1. 设计网站\n    2. 实时建议代码\n  \
