- '# 第 1 部分：入门 GitHub


  在本节中，我们从最开始引导您，了解版本控制和 GitHub 平台的基本知识。您将学习如何设置 GitHub 帐户并创建第一个仓库，并了解版本控制系统的基础知识。到本节结束时，您将熟悉在
  GitHub 上导航、管理文件并开始协作项目。


  本部分包含以下章节：


  *   *第 1 章*，*介绍版本控制和 GitHub*


  *   *第 2 章*，*掌握 GitHub 基础知识*

