- "本章将重点介绍在 GitHub 上通过 **pull requests** (**PRs**) 协作。你将学习如何提出更改并对其进行审查，使协作编码项目更加顺畅高效。到本章结束时，你将熟练使用\
  \ PR 进行反馈和改进，确保沟通清晰、更改集成顺利。\n\n本章涵盖以下主要主题：\n* 熟悉 PR 及其重要性\n* 审查 PR\n* 使用 GitHub\
  \ 的便捷编辑功能增强你的网站\n\n## 技术要求\n\n对于本章，你需要 Git 和一个 GitHub 账户。熟悉基本的 Git 命令也建议。完成本章的实践练习时，请前往\
  \ [`github.com`](https://github.com) 并在你的 GitHub 账户中创建一个名为 `ch5` 的文件夹来组织你的工作。从 [`github.com/PacktPublishing/GitHub-for-Next-Generation-Coders/tree/main/Chapter%205`](https://github.com/PacktPublishing/GitHub-for-Next-Generation-Coders/tree/main/Chapter%205)\
  \ 克隆 *第 5 章* 的代码以跟随学习。或者，你可以运行 `git clone https://github.com/PacktPublishing/GitHub-for-Next-Generation-Coders.git`\
  \ 然后从中访问 `Chapter 5` 文件夹。\n\n## 熟悉 PR 及其重要性\n\n你和你的朋友决定创建一个单页传记网站来分享你们的故事。每个人在页面上都有一个部分，可以讲述自己的故事。你想在自己页面的部分中添加一个新部分，以便分享你所做的事情。但在这样做之前，你希望从朋友那里获得一些反馈，也许让他们帮助你挑选要展示的经历。你如何在有条理、协作的方式下进行？如何在结构化、清晰且协作的方式下进行？这就是\
  \ PR 发挥作用的地方。\n\n当你在 GitHub 上提交 PR 时，你不仅仅是在提出代码更改——你是在邀请你的团队成员一起讨论你的想法并审查代码，确保它可以顺利使用：\n\
  \n![图 5.1 – 一个团队正在制作单页作品集](img/B21847_05_01.jpg)\n图 5.1 – 一个团队正在制作单页作品集\n\n### 创建新的\
  \ PR\n\n当你准备好为你的单页作品集网站添加新功能或进行更改时，第一步是创建新的 PR。此过程允许你在不影响网站主稳定版本的情况下提出对项目的更改。让我们看看如何安全地进行实验并为审查准备更新。\n\
  \n#### 分支\n\n在 GitHub 中，每个项目都有一个 main 分支，它就像你网站的主版本。当你想要进行更改时，你会创建一个新分支，这就像制作你网站的副本，你可以在其中进行实验而不影响主版本。你在该新分支中进行更改。\n\
  \n在 Git 中，你可以使用 `git switch -c name-of-your-branch` 命令创建新分支，\n\n在 GitHub 上，另一方面，你可以在存储库的概览\
  \ (**Code**) 页面上轻松完成此操作。点击 **Branch: main** 下拉菜单并输入新分支的名称——例如，`feature/add-what-i-do`——然后按\
  \ *回车*：\n\n![图 5.2 – 创建新分支](img/B21847_05_02.jpg)\n图 5.2 – 创建新分支\n\n你会看到你的新分支已被创建。你将被自动切换到新创建的分支：\n\
  \n![图 5.3 – 分支创建成功](img/B21847_05_03.jpg)\n图 5.3 – 分支创建成功\n\n在本地存储库的 Git Bash 或终端中，你可以输入\
  \ `git pull` 来获取你在 GitHub 上刚刚创建的分支：\n\n![图 5.4 – git pull – 获取新分支](img/B21847_05_04.jpg)\n\
  图 5.4 – git pull – 获取新分支\n\n现在，你可以切换到你的 `add-what-i-do-section` 功能分支并开始为这个新部分编码。使用\
  \ `git switch feature/add-what-i-do-section` 命令切换到你的功能分支。我们将为该部分添加新的 HTML 代码并添加适当的样式。让我们进行这些更改：\n\
  \n![图 5.5 – 运行 git switch](img/B21847_05_05.jpg)\n图 5.5 – 运行 git switch\n\n####\
  \ 进行更改\n\n在 *第 4 章* 中，在 *将你的新文件添加到 Git* 部分，我们谈到了如何添加新文件或更改现有文件，其中我们在你的 `index.html`\
  \ 和 `styles.css` 文件中添加了新代码。为了继续进行新功能的工作，你可以使用你喜欢的代码编辑器对其进行更改。同样，我们可以使用 Visual Studio\
  \ Code 编辑我们的文件。\n\n要向你的单页作品集网站添加新部分。你可以在 `<div class=\"main-content\">` 内添加一个名为\
  \ `<section class=\"what-i-do-header\">` 的 HTML 代码部分：\n\n![图 5.6 – HTML 代码](img/B21847_05_06.jpg)\n\
  图 5.6 – HTML 代码\n\n用你的名字替换 **John Doe** 并向名为 `styles.css` 的新文件添加一些 CSS。以下是你需要为 `styles.css`\
  \ 文件使用的代码片段：\n\n![图 5.7 – CSS 样式](img/B21847_05_07.jpg)\n图 5.7 – CSS 样式\n\n最后，在保存\
  \ `index.html` 和 `styles.css` 文件后，你可以在浏览器中运行网站并查看你所做的更改：\n\n![图 5.8 – 带有“我的工作”部分的作品集个人资料页面](img/B21847_05_08.jpg)\n\
  图 5.8 – 带有“我的工作”部分的作品集个人资料页面\n\n#### 分享你的草稿\n\n一旦你准备好与朋友分享你的想法，你就需要提交更改。这就像保存你的草稿。\n\
  \n你可以使用以下命令将更改添加到分支并提交：\n* `git add .` （暂存所有更改）\n* `git commit -m \"Added a new\
  \ what I do section\"` （提交你的更改）\n\n现在你已经学会了如何分享草稿更改，我们将看看如何有效地使用 GitHub PR 界面来提出草稿，讨论精心制作的\
  \ PR 至关重要的原因，并介绍一些在 GitHub 上创建完美 PR 的技巧。下一节将帮助你确保你的贡献清晰、对项目有用，并得到团队成员的认可。\n\n###\
  \ GitHub PR 界面 – 提出你的草稿\n\n此时，你需要将分支推送到 GitHub 并创建 PR。这就像与朋友分享你的草稿并请求他们的反馈。让我们看看步骤：\n\
  \n1. 运行 `git push -u origin feature/add-what-i-do-section` 命令将你的新文件和更改推送到 GitHub\
  \ 上的 `feature/add-what-i-do` 分支。这里，`-u` 选项为你推送的分支设置上游（或跟踪）引用：\n\n![图 5.9 – git push\
  \ 更改](img/B21847_05_09.jpg)\n图 5.9 – git push 更改\n\n1. 现在前往 GitHub，定位你的存储库，然后点击\
  \ **New Pull Request**。或者，你可以使用 **Compare & pull request** 按钮，它会自动检测某些分支中的新更改并允许你即时创建\
  \ PR：\n\n![图 5.10 – 开始新的 PR](img/B21847_05_10.jpg)\n图 5.10 – 开始新的 PR\n\n1. 当你点击\
  \ **Compare & pull request** 时，将打开一个新页面，你可以在其中开始你的 PR：\n\n![图 5.11 – 添加 PR 标题](img/B21847_05_11.jpg)\n\
  图 5.11 – 添加 PR 标题\n\n### 为什么好的 PR 很重要？\n\n使用 PR 是你展示所做工作并确保它与你正在创建的网站其余部分完美契合的机会。\n\
  \n精心制作的 PR 确保以下几点：\n* **你的团队理解你的工作**：他们将确切知道你做了哪些更改以及原因。\n* **顺利集成**：更容易将你的工作与其他人的工作合并而不会出现问题。\n\
  \n\n\n# 创建完美的 PR\n\n## 更好的协作\n你的团队可以提供有用的反馈，使最终项目更强大。\n\n让我们看看如何在 GitHub 上创建完美的\
  \ PR：\n\n### 从清晰的标题开始\n你的标题应像报纸的标题一样——简短且描述性强。这样的标题示例是 *改进社交图标设计以 **提高可见性*：\n![图\
  \ 5.12 – PR 标题](img/B21847_05_12.jpg)\n图 5.12 – PR 标题\n\n### 编写详细描述\n这就像讲述你所做的事情的故事。包括以下细节：\n\
  * **你做了哪些更改**：将其视为解释你对社交图标所做的修改\n* **为什么这样做**：也许你读到某种形状有助于提高页面的可见性\n![图 5.13 – PR\
  \ 详细描述](img/B21847_05_13.jpg)\n图 5.13 – PR 详细描述\n\n### 链接到相关问题\n如果你的工作是在解决之前讨论过的一个具体问题（例如之前社交图标设计的某个问题），请确保链接该讨论。这就像说，“*这是我们谈论过的问题的修复\
  \ **上周.*”\n![图 5.14 – 将 PR 链接到相关问题](img/B21847_05_14.jpg)\n图 5.14 – 将 PR 链接到相关问题\n\
  \n### 概述待办事项\n有时，你可能还没有完全完成。重要的是要注明仍在进行中的事项，例如如果仍需在不同分辨率和设备上测试图标：\n![图 5.15 – PR\
  \ 中的待办事项部分](img/B21847_05_15.jpg)\n图 5.15 – PR 中的待办事项部分\n\n### 添加标签以提高清晰度\n标签就像便签，有助于对你的\
  \ PR 进行分类。你可以添加诸如 **bug fix**、**enhancement** 或 **needs review** 这样的标签：\n![图 5.16\
  \ – PR 标签](img/B21847_05_16.jpg)\n图 5.16 – PR 标签\n\n### 请求审阅者\n请具体同事查看你的工作。这就像请擅长\
  \ CSS 的朋友检查你的响应式设计：\n![图 5.17 – PR 审阅者](img/B21847_05_17.jpg)\n图 5.17 – PR 审阅者\n\
  \n### 保持响应\n提交后，保持活跃。如果你的同事提出问题或建议更改，请及时回复。\n\n### 保持最新\n如果项目的其他部分发生变化（例如有人修改了页面的主体），请更新你的\
  \ PR，使其与这些更改保持一致。\n\n### 创建拉取请求\n最后，点击 **创建拉取请求** 按钮创建你的第一个 PR：\n![图 5.18 – 一个好的\
  \ PR 示例](img/B21847_05_18.jpg)\n图 5.18 – 一个好的 PR 示例\n\n在创建 PR 之前，你可以通过向下滚动来比较 main\
  \ 分支上的文件和你想要与 PR 合并的分支。你将看到你有多少次提交，有多少文件被更改，以及有多少贡献者在这个分支上工作：\n![图 5.19 – 比较文件](img/B21847_05_19.jpg)\n\
  图 5.19 – 比较文件\n\n在介绍了如何在 GitHub 上创建完美的 PR 之后，让我们转移焦点。在下一节中，我们将探讨如何有效地审阅 PR。这包括逐行审阅更改并确保贡献的质量。审阅后，我们将介绍如何合并这些更改以及合并后管理分支的最佳实践，包括为什么以及如何删除分支。此过程有助于保持干净的项目环境并确保你的仓库保持有序。\n\
  \n# 审阅 PR\n\n你的同事现在可以在 GitHub 上看到你提出的更改。他们可以留下评论、建议修改，甚至添加更多代码。这就是代码审查流程。这就像向朋友展示你的工作并获得他们的反馈和想法。让我们看看如何在\
  \ GitHub 上完成此操作，同时关注 **Files changed** 选项卡：\n![图 5.20 – PR 审阅](img/B21847_05_20.jpg)\n\
  图 5.20 – PR 审阅\n\n## 什么是 Files changed 选项卡？\n当你或你的朋友在 GitHub 上提交 PR 时，这意味着他们建议对网站进行一些更改。**Files\
  \ changed** 选项卡是你可以看到确切更改内容的地方：\n![图 5.21 – GitHub 的 Files changed 选项卡](img/B21847_05_21.jpg)\n\
  图 5.21 – GitHub 的 Files changed 选项卡\n将其想象成一份高亮的文档，其中编辑内容清晰标记。\n\n### 逐行审阅更改\n以下是如何逐行详细审阅更改的方法：\n\
  1. 打开刚刚创建的 PR 并进入它。\n2. 你会找到一个标记为 **Files changed** 的选项卡。\n3. 点击此选项卡；你将看到已更改或添加的文件。GitHub\
  \ 用两种颜色显示这些更改：**红色** 表示已删除的内容，**绿色** 表示已添加的内容。这就像在 Word 文档中跟踪更改——你可以轻松发现新内容和被删除的内容。\n\
  4. 如果你对更改的某个具体部分有疑问或建议，可以直接在那里评论。将鼠标悬停在代码行上；会出现一个蓝色加号。点击后，评论框将打开。\n在这里，你可以输入你的想法或建议。也许你认为不同的颜色会让背景看起来更好，或者你对他们添加的新部分有疑问：\n\
  ![图 5.22 – 在 PR 上评论](img/B21847_05_22.jpg)\n图 5.22 – 在 PR 上评论\n5. 添加完所有评论后，你可以提交你的审阅。你将有诸如\
  \ **批准**（如果你认为一切看起来很棒）、**请求更改**（如果你认为某些内容需要更改）或仅留下评论而不做任何具体批准或请求的选项：\n![图 5.23 –\
  \ 提交 PR 审阅](img/B21847_05_23.jpg)\n图 5.23 – 提交 PR 审阅\n\n### 接下来会发生什么？\n你的朋友将看到你的评论并可以回复。他们可能会根据你的反馈做出更多更改。这种来回交流将持续到你们双方都同意更改良好为止。\n\
  \n## 确保质量\nPR 还确保代码符合项目的标准。代码是否干净且注释良好？是否遵循项目的编码规范？是否有测试来确保代码按预期工作？这一步就像确保你的新网页已在所有设备上测试并且可以为尽可能多的用户服务。\n\
  这可以通过使用 GitHub 工作流和操作来自动化。工作流将在你创建 PR 时自动启动，以确保代码已检查是否存在任何漏洞，并且单元测试正在正确运行。所有操作都在你的\
  \ PR 的 **Checks** 选项卡中进行。\n目前，我们还没有任何操作来检查我们的代码。我们将在 *第 9 章* 中更详细地讨论这个问题：\n![图 5.24\
  \ – PR 检查](img/B21847_05_24.jpg)\n图 5.24 – PR 检查\n一旦我们设置了操作，构建过程应如下所示：\n![图 5.25\
  \ – PR 操作](img/B21847_05_25.jpg)\n图 5.25 – PR 操作\n\n## 学习与成长\n通过讨论和对 PR 提供反馈，每个人都会学习和成长。你学习更好的编码方式，了解解决问题的不同方法，并沉浸在团队的集体智慧中。\n\
  根据此反馈，你可能会对分支做出更多更改。这些更新将自动成为同一 PR 的一部分：\n![图 5.26 – 审阅 PR 评论](img/B21847_05_26.jpg)\n\
  图 5.26 – 审阅 PR 评论\n\n## 合并更改\nPR 体现了软件开发中团队合作的精髓。它们确保每个人都在同一页面上，代码健壮且干净，构建伟大事物之旅是一场共享的冒险。\n\
  一旦每个人都对更改感到满意，同事或你（如果你有权限）可以将你的分支与 main 分支合并。这意味着你的更改现在是主网站的一部分。\n现在，你可以通过点击 **合并拉取请求**\
  \ 来完成 PR：\n![图 5.27 – 合并拉取请求](img/B21847_05_27.jpg)\n图 5.27 – 合并拉取请求\n然后，点击 **确认合并**：\n\
  \n\n\n![图 5.28 – 确认合并](img/B21847_05_28.jpg)\n\n图 5.28 – 确认合并\n\n# 删除 GitHub 分支\n\
  \n将你的 GitHub 仓库想象成社区工作坊中的一个工作空间。你创建的每个分支就像一个单独的工作台。当你完成一个项目（例如你的 **我所做的内容** 部分）并将其移至主展示区（合并到\
  \ main 分支）后，就不再需要那个工作台了。通过删除分支来清理，可以保持工作坊整洁，使你和其他人更容易看到当前正在进行的工作和已完成的工作。\n\nPR 现已关闭，标志着此次协作的结束。在此阶段，你可以点击\
  \ **删除分支** 来从仓库中移除该分支。这将从你的 GitHub 仓库中移除 `feature/add-what-i-do-section` 分支：\n\n\
  ![图 5.29 – 删除已合并的分支](img/B21847_05_29.jpg)\n\n图 5.29 – 删除已合并的分支\n\n## 为什么要删除分支很重要？\n\
  \n这是软件开发工作流程中的良好实践。一旦功能已集成，其分支就已完成使命，可以防止对哪些分支处于活动状态或需要进行持续工作产生混淆。删除分支后其 PR 已合并，可确保你维护一个干净、易懂且井然有序的\
  \ GitHub 仓库。在团队项目中，这一做法尤为重要，因为清晰和组织性可以节省时间并避免混淆。\n\n## PR 获批后删除本地分支\n\n现在，你想通过删除不再需要的特性分支来清理本地\
  \ Git 环境。\n\n通过在 Git Bash 或终端中输入 `git switch main` 命令切换回 `main` 分支。此命令会将你从特性分支移出并返回到项目的\
  \ main 分支：\n\n![图 5.30 – Git 终端 – 切换到 main 分支](img/B21847_05_30.jpg)\n\n图 5.30 –\
  \ Git 终端 – 切换到 main 分支\n\n为什么需要切换回 `main` 分支？\n\n你不能删除当前所在的分支。因此，你需要切换到另一个分支（本例中为\
  \ `main`）来删除 `feature/add-what-i-do-section` 分支。\n\n## 更新你的本地 main 分支\n\n现在，你可以使用\
  \ `git pull` 命令更新本地 `main` 分支，因为有提示称你的分支比 `origin/main` 落后两个提交。此命令（`git pull`）会使用\
  \ GitHub 上 `remote main` 分支的最新更改（包括最近合并的 PR 的更改）来更新你的本地 `main` 分支。\n\n保持本地 main\
  \ 分支与 `remote main` 分支同步是良好的实践，这样你就能拥有最新代码，确保一切同步：\n\n![图 5.31 – Git 终端 – 拉取最新更改到\
  \ main 分支](img/B21847_05_31.jpg)\n\n图 5.31 – Git 终端 – 拉取最新更改到 main 分支\n\n## 修剪不需要的分支\n\
  \n在此阶段，你必须使用 `git pull --prune` 命令清理 GitHub 上已不存在的远程分支的引用。\n\n为什么要这样做？\n\n合并 PR\
  \ 后，GitHub 上的特性分支可能会被删除（这是常见做法）。`--prune` 选项可确保你的本地 Git 知道该远程分支已不存在：\n\n![图 5.32\
  \ – Git 终端 – 修剪并检查分支](img/B21847_05_32.jpg)\n\n图 5.32 – Git 终端 – 修剪并检查分支\n\n## 删除本地特性分支\n\
  \n现在，是时候从本地仓库中删除该分支了。你可以通过运行 `git branch -d feature/add-what-i-do-section` 命令来完成，这将从你的本地仓库中删除该分支：\n\
  \n![图 5.33 – Git 终端 – 从本地删除特性分支](img/B21847_05_33.jpg)\n\n图 5.33 – Git 终端 – 从本地删除特性分支\n\
  \n现在你的更改已合并并且你已更新 main 分支，特性分支不再需要。删除它可以保持本地仓库干净整洁。此命令就像在完成项目部分后清理工作空间。在下一节中，我们将介绍使用\
  \ GitHub 的便捷编辑功能增强你的网站。你将学习如何在 GitHub 上直接编辑以进行快速更改，以及使用 `github.dev` 作为功能齐全的编辑器。这将帮助你高效有效地改进你的网站。\n\
  \n# 使用 GitHub 的便捷编辑功能增强你的网站\n\n让我们更深入地探讨如何使用 GitHub 的便捷编辑功能编辑你的单页作品集网站。除了在电脑上编辑文件然后推送到\
  \ GitHub 的传统方式外，GitHub 上还有一些更快捷、更用户友好的选项！\n\n## 在 GitHub 上直接编辑 – 快速简便\n\n不必在电脑上编辑文件再推送到\
  \ GitHub，你可以使用 GitHub 的 **编辑文件** 功能。它就像为你的网站文件提供了一个快速编辑按钮。\n\n那么，它是如何工作的？\n\n只需在\
  \ GitHub 仓库中导航到你想要更改的文件即可——例如 `index.html` 或 `style.css`。点击铅笔图标即可在浏览器中开始编辑，或者更好的是，直接按键盘上的\
  \ *E* ——文件即可准备编辑：\n\n![图 5.34 – 通过按 E 或点击铅笔图标在 GitHub 上编辑文件](img/B21847_05_34.jpg)\n\
  \n图 5.34 – 通过按 E 或点击铅笔图标在 GitHub 上编辑文件\n\n对于快速修复或小幅添加非常方便，例如修改一句话或更改颜色：\n\n![图 5.35\
  \ – 在 GitHub 上编辑文件](img/B21847_05_35.jpg)\n\n图 5.35 – 在 GitHub 上编辑文件\n\n## 使用 github.dev\
  \ – 你的完整编辑器\n\n对于更广泛的编辑，GitHub 提供了 `github.dev`，它可在浏览器中提供 Visual Studio Code（一种流行的代码编辑器）的完整功能。\n\
  \n`github.dev` 是一个轻量级的浏览器内代码编辑器，允许你编辑仓库中的文件。它不提供任何计算资源，因此你无法在此环境中直接运行或调试代码。无需设置或配置，并且免费使用。\n\
  \n### 激活 github.dev\n\n你可以在仓库中按 *.*（句点键）激活 `github.dev`，或点击铅笔图标附近的箭头，然后在 **使用…打开**\
  \ 下点击 `github.dev`，如下所示：\n\n![图 5.36 – 通过按 “.” 或点击铅笔图标在 GitHub 上编辑文件](img/B21847_05_36.jpg)\n\
  \n图 5.36 – 通过按 “.” 或点击铅笔图标在 GitHub 上编辑文件\n\n一个功能强大的编辑器将打开，你可以在其中处理多个文件、运行命令，并直接将工作保存到你的分支。\n\
  \n### 为什么使用 github.dev？\n\n当你远离常用的编码环境或想直接在 GitHub 上工作而不进行本地编辑的来回操作时，这非常完美。它就像随时随地拥有你的完整手工工作坊：\n\
  \n![图 5.37 – 使用 github.dev 在 GitHub 上编辑文件](img/B21847_05_37.jpg)\n\n图 5.37 – 使用\
  \ github.dev 在 GitHub 上编辑文件\n\n### 两全其美\n\n根据你的操作，你可以选择最佳的编辑方法。快速更改？直接编辑非常完美。更复杂的工作？`github.dev`\
  \ 就是你的朋友。\n\n这些 GitHub 功能使协作编辑你的网站更快更简单。它就像拥有一套工具，适合快速修复或整天的开发工作。\n\n# 总结\n\n在本章中，你学习了如何通过\
  \ GitHub 上的 PR 有效协作。这涉及向项目提出更改、与团队成员一起审阅这些更改，并整合反馈以提高项目的整体质量。这些技能对于编码项目的团队合作至关重要，可确保清晰的沟通和新功能或修复的顺利集成。\n\
  \n\n\n在下一章中，我们将探讨在集成更改时出现冲突的处理方法。我们将学习如何使用 GitHub 的 UI 处理简单冲突、应对多个冲突问题，并本地解决冲突，以确保无缝协作和项目进展。\n\
  \n# 测验\n回答以下问题：\n\n1. GitHub 中的 PR 是什么？\n    1. 从仓库拉取代码的请求\n    2. 对项目的更改提案\n  \
  \  3. 删除代码的请求\n    4. 给 GitHub 支持的消息\n    *答案*: B. 对项目的更改提案\n\n2. 真假题：PR 仅用于添加新功能。\n\
  \    1. 真\n    2. 假\n    *答案*: B. 假\n\n3. 在 GitHub 中制作 ________ 有助于你以便于团队成员审查的方式提出更改。\n\
  \    *答案*: PRs\n\n4. 为什么在 GitHub 上审查他人的工作很重要？\n    *答案*: 审查他人的工作有助于识别潜在问题，确保质量，并促进协作，使项目更强大\n\
  \n5. 对 PR 提供反馈的目的是什么？\n    1. 使项目更复杂\n    2. 提高代码的质量和有效性\n    3. 减慢项目进度\n    4.\
  \ 决定谁是最好的程序员\n    *答案*: B. 提高代码的质量和有效性\n\n6. 真假题：你可以为小更改和大更改创建 PR。\n    1. 真\n \
  \   2. 假\n    *答案*: A. 真\n\n7. GitHub 中用于快速更改的功能是什么？\n    1. Issues\n    2. Wiki\n\
  \    3. Codespaces\n    4. 直接编辑\n    *答案*: D. 直接编辑\n\n8. 对于更复杂的工作，________ 是一个有用的\
  \ GitHub 功能。\n    *答案*: `github.dev`\n\n9. 真假题：只有项目所有者才能创建 PR。\n    1. 真\n    2.\
  \ 假\n    *答案*: B. 假\n\n10. 在 GitHub 中创建 PR 的一个最佳实践是什么？\n    *答案*: 创建清晰、简洁且有效的 PR，便于团队成员理解和集成。\n\
  \n# 挑战 – Space Explorer 中的宇宙协作！\n本章带你了解了在 GitHub 上创建和协作 PR 的要点。现在是时候将这些技能应用于我们的\
  \ *太空探索者* 游戏了。让我们添加一些璀璨的背景并优化障碍交互！\n\n## 你的任务？\n通过添加新背景和优化障碍交互来改进 *太空探索者* 游戏，使用\
  \ PR 进行协作和审查：\n\n![图 5.38 – 太空探索者 游戏](img/B21847_05_38.png)\n图 5.38 – 太空探索者 游戏\n\
  \n执行以下操作：\n1. **为新背景创建分支**：在 GitHub 上，从主项目创建一个名为 `feature-new-background` 的新分支。此分支是绘制游戏宇宙背景的画布。\n\
  2. **集成新背景**：我已为你准备了一些很酷的太空背景。使用 `git pull` 命令将其获取到本地 `feature-new-background` 分支。将其集成到游戏中。感受宇宙的生动！\n\
  3. **改进障碍交互**：在另一个分支 `enhance-obstacle-interaction` 上，优化飞船与障碍物交互的方式。你能否在飞船撞到障碍物时添加一个很酷的声音效果？我已为你准备了一些声音供你使用。\n\
  4. **提交并打开 PR**：使用描述性的提交信息提交更改，例如 `Added cosmic background` 和 `Enhanced spaceship-obstacle\
  \ interaction`。\n5. 为每个分支向主项目打开 PR。描述你的更改并请求反馈。\n6. **审查和协作**：邀请朋友或 fellow 程序员审查你的\
  \ PR。你的新背景和障碍交互是否超凡脱俗？\n7. 讨论，必要时修改，然后当一切看起来都很棒时，将你的 PR 合并到主游戏中。\n8. **清理你的空间**：成功合并后，从\
  \ GitHub 仓库中删除功能分支。保持整洁是成为优秀程序员的一部分！\n\n## 奖励探索\n尝试不同的背景或障碍效果。添加个人风格并在 PR 描述中分享你的想法。你为什么选择那个特定的背景或效果？\n"
- "## 6 解决合并冲突 – 在 GitHub 和本地\n本章将作为一份指南，带你穿越有时具有挑战性的合并冲突领域，说明如何在 GitHub 和本地导航和解决这些问题。通过理解和解决合并冲突，你将确保编码项目中的更顺畅协作。\n\
  \n在本章中，我们将涵盖以下主要主题：\n* 理解合并冲突及其发生方式\n* 处理合并冲突\n\n你将深入实践、动手的方法来解决这些冲突，确保你的网站体现两者的优点。\n\
  \n到本章结束时，你将具备像专业人士一样处理棘手技术情况的能力，确保你的协作编码项目顺利进行！\n\n## 技术要求\n你需要包括在计算机上安装 Git 和 GitHub\
  \ 账户的基础设置。熟悉命令行操作和 GitHub 网页界面将有益。有关练习和代码示例，请访问 [`github.com/PacktPublishing/GitHub-for-Next-Generation-Coders/tree/main/Chapter%206`](https://github.com/PacktPublishing/GitHub-for-Next-Generation-Coders/tree/main/Chapter%206)\
  \ 并在你的 GitHub 仓库中创建一个名为 `ch6` 的文件夹。你可以使用 `git clone https://github.com/PacktPublishing/GitHub-for-Next-Generation-Coders.git`\
  \ Git 命令，然后从那里访问 `ch6` 文件夹。\n\n## 理解合并冲突及其发生方式\n你和你的团队同事都在更新一个单页作品集网站。你正在处理 **关于我**\
  \ 部分，而你的同事正在为整个页面添加新字体和样式。这就是 **合并冲突** 发挥作用的地方：\n\n![图 6.1 – 合并冲突](img/B21847_06_01.jpg)\n\
  图 6.1 – 合并冲突\n\n### 什么是合并冲突？\n把合并冲突想象成两个人同时在同一块画布上尝试绘制不同的画。你俩都有自己的想法，但它们在同一空间冲突：\n\
  \n![图 6.2 – 什么是合并冲突？](img/B21847_06_02.jpg)\n图 6.2 – 什么是合并冲突？\n\n### 合并冲突是如何发生的？\n\
  你和你的同事都从 `main` 分支拉取网站的最新版本以开始工作。你向 **关于我** 部分添加了详细的个人简介和一些图片，而你的同事更改了整个页面的字体样式和配色方案，包括\
  \ **关于我** 部分。*图 6**.3* 展示了这种冲突：\n\n![图 6.3 – 合并冲突功能分支](img/B21847_06_03.jpg)\n图\
  \ 6.3 – 合并冲突功能分支\n\n你俩大约在同一时间完成工作并将更改提交到各自的分支。你的同事先完成并将更改合并到 `main` 分支。`main` 分支现在具有你同事的新字体和配色方案。\n\
  \n现在，当你尝试合并你的 **关于我** 更改时，出现了问题。你工作的 **关于我** 部分没有你同事的新字体和颜色。Git 感到困惑，因为与 `main`\
  \ 分支相比，同一部分网站在你的分支中看起来不同，如 *图 6**.4* 所示。这就是合并冲突的定义：\n\n![图 6.4 – PR 中的合并冲突](img/B21847_06_04.jpg)\n\
  图 6.4 – PR 中的合并冲突\n\n当你在 GitHub 上尝试为你的更改创建 PR，但你的分支存在冲突时，GitHub 会提示你正在尝试合并的分支存在合并冲突，应先解决。你可以在\
  \ *图 6**.5* 中看到这一点：\n\n![图 6.5 – 冲突的 PR 分支错误](img/B21847_06_05.jpg)\n图 6.5 – 冲突的\
  \ PR 分支错误\n\n\n\n\n如你现在已了解合并冲突可能如何发生在你身上，让我们用一个真实示例来演示它们。\n\n# 处理合并冲突\n\n如你和同事正在构建一个单页作品集网站，你们都开始更新\
  \ `Skills` 部分，但你们不小心对网页的同一部分做了不同的更改。你正在更改一项技能的标题，而你的同事同时也在更新标题、图标和描述：\n\n![图 6.6\
  \ – 作品集网页的“我的服务”部分](img/B21847_06_06.jpg)\n\n图 6.6 – 作品集网页的“我的服务”部分\n\n## 合并冲突实战\n\
  \n你和同事都从 `main` 分支拉取网站的最新版本以开始工作。你将一项技能的标题从 *React* 更新为 *Web Development*，与此同时，你的同事将标题更改为\
  \ *Google Cloud Provider*，更改了同一技能的图标，并修改了其描述。\n\n你们都将更改提交并推送到 GitHub。你先完成了工作并将更改推送到\
  \ `main` 分支。之后，你的同事尝试推送他们的更改。但现在，GitHub 提醒他们发生了合并冲突。为什么？因为自从同事上次从 `main` 分支拉取以来，你已经更改了他们编辑的那部分内容。\n\
  \n以下是你将与同事一起工作的示例 HTML 代码：\n\n![图 6.7 – 示例代码](img/B21847_06_07.jpg)\n\n图 6.7 – 示例代码\n\
  \n以下是 `styles.css` 文件的更改：\n\n![图 6.8 – styles.css 代码](img/B21847_06_08.jpg)\n\n\
  图 6.8 – styles.css 代码\n\n因此，你们都编辑了 React 服务，但由于你已经将更改合并到 `main` 分支，你的同事将面临第一次合并冲突，并且在冲突解决之前无法合并\
  \ PR。\n\n## 使用 GitHub 界面解决合并冲突\n\nGitHub 准确显示给同事冲突所在的位置——在 `Skills` 部分。就像网站在说，“*嘿——两个人更改了同一部分，我不确定该保留哪个版本\
  \ **保留*”：\n\n![图 6.9 – 开始 PR 并解决冲突](img/B21847_06_09.jpg)\n\n图 6.9 – 开始 PR 并解决冲突\n\
  \n现在，当同事点击 `Resolve conflicts` 按钮时，GitHub 编辑器中的文件将打开，其中冲突的更改会被清晰标记。然后，同事会看到他们的代码更改被标记为\
  \ `>`、`=` 和 `<` 符号，如 *图 6**.10* 所示：\n\n![图 6.10 – GitHub 上标记的 PR 冲突](img/B21847_06_10.jpg)\n\
  \n图 6.10 – GitHub 上标记的 PR 冲突\n\n*   `>>>>>>> main` 部分显示当前 `main` 分支的更改，其中包含你之前所做的更改\n\
  *   `=======` 部分分隔两个冲突的更改\n*   `<<<<<<< feature/webdevelopment-skill` 部分显示同事所做的更改\n\
  \n同事 Jamie 现在必须决定如何整合这两个更改。他们可能会选择保留新标题并纳入其图标和描述更新。\n\n你可以通过点击 PR 部分中的 `Prev` 和\
  \ `Next` 按钮直接导航 PR 冲突，它会从一个冲突移动到另一个冲突。在那里，你还会看到当前文件中必须合并的冲突数量以红色标记：\n\n![图 6.11\
  \ – 冲突导航菜单](img/B21847_06_11.jpg)\n\n图 6.11 – 冲突导航菜单\n\n在 `Conflicts` 菜单中，你可以选择如何配置\
  \ `Indent mode` 在空格和制表符之间，`Indent size` `2`、`4`、`8`，以及 `Line wrap mode` 在 `No wrap`\
  \ 和 `Soft wrap` 之间。这已在 *图 6**.12* 中演示：\n\n![图 6.12 – 冲突配置菜单](img/B21847_06_12.jpg)\n\
  \n图 6.12 – 冲突配置菜单\n\nJamie 删除文件中的冲突标记和代码以解决合并冲突，并从 `Conflicts` 菜单中点击 `Mark as resolved`\
  \ 按钮，以一种合理的方式合并更改：\n\n![图 6.13 – 合并冲突已解决](img/B21847_06_13.jpg)\n\n图 6.13 – 合并冲突已解决\n\
  \n在进行编辑并解决冲突后，Jamie 可以通过点击解决冲突后出现的 `Commit merge` 按钮来提交更新后的文件。此提交告诉 GitHub，“*好的——我们已修复冲突；这是我们想要\
  \ **保留* 的版本。”\n\n冲突解决后，你和 Jamie 可能会聊天以确保你们同意 `Skills` 部分的最终版本。冲突解决后，作品集网站现在准确反映了对\
  \ `Skills` 部分的双方贡献。\n\n该分支的 `Pull Request` 页面现在将检测到不再有冲突需要修复，并且你将有机会最终合并 PR。PR 现在可以通过将功能分支合并到\
  \ `main` 分支来完成：\n\n![图 6.14 – 合并 PR 选项](img/B21847_06_14.jpg)\n\n图 6.14 – 合并 PR\
  \ 选项\n\n## 处理多个合并冲突\n\n这有点像一次修复群聊中的几个误会。它可能发生在有人不小心直接将合并冲突标记合并到 `main` 分支时：\n\n\
  ![图 6.15 – 包含多个合并冲突的文件](img/B21847_06_15.jpg)\n\n图 6.15 – 包含多个合并冲突的文件\n\n在此示例中，不同的协作者对\
  \ CSS 文件的同一部分做了不同的更改。我们将按清理混乱的团队项目的方式逐步进行这些步骤。\n\n要开始解决这些问题，你可以进入冲突文件的 `Pull Requests`\
  \ 部分。点击 `Resolve conflicts` 按钮。这会将你带到浏览器中的编辑器，在那里你可以修复问题。\n\n在编辑器中，你会看到诸如 `<<<<<<<`、`=======`\
  \ 和 `>>>>>>>` 之类的标记。这些标记分隔不同的更改。就像你并排看到争论的双方一样：\n\n![图 6.16 – 包含多个合并冲突的文件示例](img/B21847_06_16.jpg)\n\
  \n图 6.16 – 包含多个合并冲突的文件示例\n\n在这里，一方 (`css-changes`) 希望字体大小为 `24px`，而另一方 (`main`)\
  \ 希望为 `44px`。\n\n### 选择正确的更改\n\n现在，决定保留哪些更改。也许你认为 `24px` 看起来更好，或者 `44px`，或者完全不同的东西。\n\
  \n删除你不想要的标记和更改。如果你选择 `24px`，你将删除其他所有内容，包括标记，这样它看起来又像正常的 CSS 一样。\n\n对文件中的每个冲突重复此操作。在每种情况下，你都在选择最佳选项，清理并确保它再次看起来像一段常规代码：\n\
  \n![图 6.17 – 已解决多个冲突](img/B21847_06_17.jpg)\n\n图 6.17 – 已解决多个冲突\n\n### 解决冲突文件并完成\
  \ PR\n\n修复所有冲突后，GitHub 将允许你通过点击我们之前使用的 `Mark as resolved` 按钮将文件标记为已解决。这就像说，“*好的——我们已解决\
  \ **这些问题*”：\n\n![图 6.18 – Mark as resolved 按钮](img/B21847_06_18.jpg)\n\n图 6.18 –\
  \ Mark as resolved 按钮\n\n现在，你可以完成 PR 流程，这就像在团队项目中最终确定更改一样。在 GitHub 界面中解决多个合并冲突就像多次解决单个冲突一样。\n\
  \n## 像专业人士一样使用命令行解决合并冲突\n\n你已经了解了合并冲突是什么、它是如何发生的，以及如何使用 GitHub 界面解决它，但使用命令行在本地解决冲突呢？\n\
  \n想象你和朋友都在编辑项目网站的同一部分——比如 `What I Do` 部分。你们都对该部分中的同一行做了不同的更改。\n\n\n\n现在，当你们两人尝试将更改（或\
  \ *合并*）合并到主项目中时，GitHub 会感到困惑。这就像两个朋友同时在纸张的同一位置写不同的句子。GitHub 需要你的帮助来决定保留哪些更改。这时你可以使用命令行来解决冲突，并帮助\
  \ GitHub 知道要合并哪些更改。\n\n## 前往 Pull Request 页面\n\n在 GitHub **拉取请求** 页面上，你会看到一个我们已经在\
  \ *图 6.9* 中看到过的屏幕，其中显示该分支存在必须解决的冲突。从那里，你可以通过点击 **解决冲突** 按钮使用 UI，这将为你打开网页编辑器，但你也可以使用\
  \ *命令行* 来解决冲突。如果你点击命令行，你将获得有关如何使用命令行解决冲突的完整说明，按照 *图 6.19* 中的步骤进行：\n\n![图 6.19 –\
  \ GitHub 命令行说明](img/B21847_06_19.jpg)\n图 6.19 – GitHub 命令行说明\n\n打开你喜欢的命令行工具，例如 Git\
  \ Bash 或 PowerShell，并使用 `cd` 命令和仓库名称导航到存在合并冲突的本地项目仓库：\n\n![图 6.20 – 进入冲突仓库](img/B21847_06_20.jpg)\n\
  图 6.20 – 进入冲突仓库\n\n## 从主分支拉取最新更改\n\n在你的项目仓库文件夹中打开命令行并输入 `git pull origin main`。该命令告诉\
  \ GitHub，“*给我 **主项目** 的最新更新*”。\n\n正如你所见，GitHub 已经会告诉你你的分支存在冲突，并且自动合并已失败，在你手动修复合并冲突之前是不可能的：\n\
  \n![图 6.21 – 冲突消息](img/B21847_06_21.jpg)\n图 6.21 – 冲突消息\n\n## 切换到冲突分支\n\n在命令行中输入\
  \ `git checkout css-changes` 以切换到冲突分支。\n\n一条消息会显示你分支中存在错误，告诉你合并更改到 **主** 分支之前需要修复的内容：\n\
  \n![图 6.22 – 冲突分支上的错误](img/B21847_06_22.jpg)\n图 6.22 – 冲突分支上的错误\n\n## 合并更改\n\n现在，在命令行中输入\
  \ `git merge main`。这会尝试将你的更改与主项目的最新更改融合。如果存在冲突，它会通知你。\n\n在这种情况下，由于必须先修复一些问题，合并将不会完成，如命令行所示：\n\
  \n![图 6.23 – 合并命令冲突](img/B21847_06_23.jpg)\n图 6.23 – 合并命令冲突\n\n此外，你可以输入 `git status`\
  \ 查看存在冲突的文件。\n\n输入 `git status` 命令后，你将看到已更改且未合并的文件列表：\n\n![图 6.24 – Git 状态修改和冲突文件列表](img/B21847_06_24.jpg)\n\
  图 6.24 – Git 状态修改和冲突文件列表\n\n在你的文本编辑器中打开这些文件，例如 Visual Studio Code 或你喜欢的任何其他编辑器。你会看到诸如\
  \ **<<<<<<<** 和 **>>>>>>>** 这样的标记，表示冲突的更改。通过删除冲突标记（**<<<<<<<**、**=======**、**>>>>>>>**）来编辑文件以保留你想要的更改：\n\
  \n![图 6.25 – 在 Visual Studio Code 中编辑合并冲突](img/B21847_06_25.jpg)\n图 6.25 – 在 Visual\
  \ Studio Code 中编辑合并冲突\n\n现在，你可以保存文件并返回命令行输入 `git add .` 来暂存你的更改，并输入 `git commit\
  \ -m \"resolved conflict\"` 来保存它们。\n\n最后，输入 `git push origin your-branch-name` 将你解决的更改发送回\
  \ GitHub。\n\n现在，合并冲突已解决，你可以返回 GitHub **拉取请求** 页面并通过点击 **合并拉取请求** 按钮完成 PR。\n\n##\
  \ 使用已删除文件解决冲突\n\n假设你决定从项目中删除一个文件，因为你认为它不再需要。与此同时，你的朋友在他们版本的项目中对同一个文件做了一些更改。当你们两人尝试合并更改时，GitHub\
  \ 会感到困惑。这就像，*嘿——你正试图更新一个文件，但它 **已经不在这里了！*：\n\n![图 6.26 – 已删除文件的状态](img/B21847_06_26.jpg)\n\
  图 6.26 – 已删除文件的状态\n\n要解决这种冲突，你可以按照我们之前主题中介绍的整个流程进行操作，在那里我们解释了如何使用命令行解决问题。\n\n###\
  \ 删除文件\n\n现在，你必须决定是否要保留文件被删除（你的更改）或将其带回并包含你朋友的更改。\n\n如果你想保留文件被删除，只需使用 `git rm file-name`\
  \ 将此决定添加到项目中（将 **file-name** 替换为实际文件名）：\n\n![图 6.27 – 删除不需要的文件](img/B21847_06_27.jpg)\n\
  图 6.27 – 删除不需要的文件\n\n然后，使用 `git commit -m \"Decided to keep the file removed\"`\
  \ 提交此决定：\n\n![图 6.28 – 提交不需要的文件](img/B21847_06_28.jpg)\n图 6.28 – 提交不需要的文件\n\n###\
  \ 想把文件带回来？\n\n使用 `git checkout --theirs file-name` 将文件连同你朋友的更改一起带回，然后使用 `git add\
  \ file-name` 将此文件重新添加到项目中。\n\n它将使用之前被删除的文件更新仓库。使用 `git commit -m \"Brought back\
  \ the file with changes\"` 提交此决定。现在，使用 `git merge` 完成合并过程。这就像告诉 GitHub，“*好的——我们已解决该问题；让我们\
  \ **继续吧！**”*\n\n最后，使用 `git push origin branch-name` 用你解决的更改更新主项目。\n\n你正在告知大家，“*都安排好了！项目现在已\
  \ **最新*”：\n\n![图 6.29 – 状态显示一切已最新](img/B21847_06_29.jpg)\n图 6.29 – 状态显示一切已最新\n\n\
  现在，你再次可以继续进行 PR 并关闭它。点击 **合并拉取请求** 按钮，最后，你已完成 PR：\n\n![图 6.30 – 合并已解决的 PR](img/B21847_06_30.jpg)\n\
  图 6.30 – 合并已解决的 PR\n\n你现在已经学会如何处理合并冲突，包括合并冲突期间发生的情况、如何使用 GitHub 界面解决冲突以及如何处理多个冲突和已删除文件。这些知识可确保即使更改重叠，你的代码也能顺利集成。\n\
  \n# 摘要\n\n恭喜你完成 *第 6 章*！你已穿越合并冲突的曲折，并变得更加熟练和自信。\n\n本章全部关于掌握合并冲突。我们学习了合并冲突是什么以及如何通过各种方法和多种场景来解决它们。凭借这些技能，你现在可以做到以下几点：\n\
  \n*   识别合并冲突，将其理解为协作编码的自然组成部分\n\n*   使用 GitHub 的 UI 和命令行解决冲突，将不同的更改融合为和谐的最终产品\n\n\
  *   成为更有效的团队成员，能够轻松且专业地处理项目中的冲突\n\n在你继续构建单页作品集网站时，请记住合并冲突只是协同不同想法和改进的机会。在下一章中，你将学习如何在\
  \ Git 中导航、更改和理解你的编码项目的历史。你将研究各种关键概念和功能，例如 `git bisect`、`diff` 命令、`git reset` 和 cherry-picking。\n\
  \n# 测验\n\n用以下问题测试你的知识：\n\n1.  GitHub 中的合并冲突是什么？\n\n    1.  下载文件时出现错误\n\n    2. \
  \ 团队成员之间的分歧\n\n    3.  对同一文件部分所做的重叠更改\n\n\n\n4. 网络连接问题\n*Answer*: C. 对同一文件部分的重复更改\n\
  \n2. 合并冲突仅在两个人更改文件中的同一行时发生。\n   1. 真\n   2. 假\n*Answer*: B. 假（它们也可能因文件删除、重命名等而发生）\n\
  \n3. 在 GitHub 中，你不能使用 ________ 手动解决合并冲突。\n*Answer*: 命令行\n\n4. 为什么在项目中解决合并冲突很重要？\n\
  *Answer*: 为了确保项目具有连贯且功能正常的代码库，反映所有贡献者的预期更改。\n\n5. `git merge` 命令做什么？\n   1. 删除分支\n\
  \   2. 合并不同分支的更改\n   3. 更改项目名称\n   4. 创建新文件\n*Answer*: B. 合并不同分支的更改\n\n6. 合并冲突始终是编码错误的标志。\n\
  \   1. 真\n   2. 假\n*Answer*: B. 假（它们是协作的自然组成部分）\n\n7. 解决合并冲突后应该做什么？\n   1. 删除项目\n\
  \   2. 提交并将更改推送到远程\n   3. 忽略更改\n   4. 关闭 GitHub\n*Answer*: B. 提交并将更改推送到远程\n\n8.\
  \ 当发生合并冲突时，GitHub 会用诸如 `<<<<<<<`、`=======` 和 `>>>>>>>` 这样的特殊符号标记冲突区域。这些符号被称为 ________。\n\
  *Answer*: 冲突标记\n\n9. 你只能使用 GitHub 的网页界面解决合并冲突。\n   1. 真\n   2. 假\n*Answer*: B. 假（它们也可以使用命令行解决）\n\
  \n10. 导致合并冲突的常见场景之一是什么？\n*Answer*: 当两位贡献者对同一文件的同一部分做出不同更改，或当一方删除了另一方已修改的文件时。\n\n\
  # 挑战 – 在 Space Explorer 中进行星空增强！\n\n太棒了！你在 *第 6 章* 中掌握了合并冲突！现在你已经掌握了在 GitHub 中处理不同更改的技巧，让我们将这些技能应用到我们的\
  \ *Space Explorer* 游戏中。是时候用星星、宇宙飞船和障碍物的图像增添一些宇宙风采了。\n\n准备让你的游戏看起来与众不同吗？\n\n## 你的任务\n\
  \n通过添加星星、宇宙飞船和障碍物的图像来增强 *Space Explorer* 游戏，同时管理并解决出现的任何合并冲突：\n\n![图 6.31 – Space\
  \ Explorer 游戏](img/B21847_06_31.jpg)\n图 6.31 – Space Explorer 游戏\n\n## 成功步骤\n\n\
  1. **创建新分支**：在 *Space Explorer* 游戏的 GitHub 仓库中，创建一个名为 **feature-stellar-graphics**\
  \ 的新分支。\n   该分支将是你添加酷炫太空图像的创意工作坊。\n2. **获取图像**：我将为你提供星星、宇宙飞船和障碍物的精美图像。下载这些图像并准备将它们集成到你的游戏中。你可以在三个文件夹中找到它们：\n\
  \   * 船舶图像：[`github.com/PacktPublishing/GitHub-for-Next-Generation-Coders/blob/main/Space%20Explorer%20Game/Game%20Obsticles%20-%20Ship%20Picture/rocket.png`](https://github.com/PacktPublishing/GitHub-for-Next-Generation-Coders/blob/main/Space%20Explorer%20Game/Game%20Obsticles%20-%20Ship%20Picture/rocket.png)\n\
  \   * 星星图像：[`github.com/PacktPublishing/GitHub-for-Next-Generation-Coders/blob/main/Space%20Explorer%20Game/Game%20Obsticles%20-%20Stars%20Picture/star.png`](https://github.com/PacktPublishing/GitHub-for-Next-Generation-Coders/blob/main/Space%20Explorer%20Game/Game%20Obsticles%20-%20Stars%20Picture/star.png)\n\
  \   * 障碍物图像：[`github.com/PacktPublishing/GitHub-for-Next-Generation-Coders/blob/main/Space%20Explorer%20Game/Game%20Obsticles%20-%20Obstacle%20Picture/asteroid.png`](https://github.com/PacktPublishing/GitHub-for-Next-Generation-Coders/blob/main/Space%20Explorer%20Game/Game%20Obsticles%20-%20Obstacle%20Picture/asteroid.png)\n\
  3. **集成图像**：用这些新图像替换游戏中现有的占位符或简单图形。调整其大小和位置，使其完美地融入你的宇宙景观中。\n4. **提交你的更改**：集成每张图像后，提交你的更改。使用清晰的消息，例如\
  \ *添加星星图像* 或 *更新 **宇宙飞船图形***。\n   定期提交有助于跟踪你的进度并使处理合并冲突变得更容易。\n5. **模拟合并冲突**：为了真正体验解决冲突的感觉，在\
  \ **main** 分支中做出可能与你的新图形冲突的更改。例如，更改障碍物的位置或大小。\n   然后，尝试将你的 **feature-stellar-graphics**\
  \ 分支合并到 **main**。\n6. **解决任何合并冲突**：如果出现合并冲突，使用你新获得的技能来解决它。决定保留哪些更改，更新文件并完成合并。\n\
  7. **最后润色和合并**：一旦一切看起来很棒并且运行顺畅，创建一个 PR 将 **feature-stellar-graphics** 合并到 **main**\
  \ 分支。\n   描述你的增强功能并请求反馈。\n\n## 奖励挑战\n\n为什么止步于此？\n尝试为宇宙飞船的推进器添加动画图形或为星星创建闪烁效果。\n"
- '# 第 3 部分：掌握 Git 命令和工具


  在本部分中，我们介绍 Git 中的关键工具和命令，这些工具和命令将增强你回滚更改、跟踪历史记录并更有效地使用 GitHub 的能力。从使用 `git revert`
  撤销错误到理解项目的完整历史记录，本节为你提供处理复杂场景和使用高级 Git 功能所需的知识。


  本部分包含以下章节：

  * *第 7 章*，*Git 历史记录和回滚提交*

  * *第 8 章*，*有用的工具和 Git 命令*

  '
- "## 7 Git 历史记录和回滚提交\n\n欢迎来到 *第 7 章*，在这里，我们即将踏上通过 Git 和 GitHub 指导的编码项目历史的迷人旅程。了解这些工具中历史的工作原理就像拥有触手可及的时间机器，让你有能力重新访问、分析和修改项目的过去。\n\
  \n首先，我们将使用 `git log` 和 `git reflog` 命令浏览历史记录。接下来，我们将学习如何使用 `git bisect` 命令精确定位代码中引入错误的确切时间和位置。然后，我们将掌握回滚提交、重置进度和挑选更改的艺术，以保持项目时间线干净高效。那么，让我们开始这场冒险吧！\n\
  \n本章你将学习以下内容：\n* 了解 Git 和 GitHub 历史记录 – 跟踪网站的更改\n* 解释 `git bisect` – 在干草堆中找到针\n\
  * 将提交回滚到以前的版本\n* 用 `git diff` 解开谜团 – 看不见的更改的故事\n* 使用 `git reset` 和 cherry-picking\
  \ 撤销更改\n\n到本章结束时，你将熟练地浏览项目的复杂时间线，确保你的编码历史尽可能顺畅无误。让我们开始这段激动人心的时间之旅吧！\n\n### 了解 Git\
  \ 和 GitHub 历史记录 – 跟踪网站的更改\n\nGitHub 充当远程仓库，是你的 Git 历史记录在线存储的地方。这意味着它不仅仅在你的电脑上；它在云端，可以从任何地方访问，也可以由你允许的任何人访问。\n\
  \nGitHub 提供了一个可视化且用户友好的界面，你可以在其中查看项目的历史记录。你可以看到谁做了更改、何时做的以及更改了什么。这就像为你的项目拥有一个协作日记，每个人都在其中书写并分享他们故事的一部分。\n\
  \n\n\n想象你正在为你的单页作品集网站制作一本剪贴簿。你正在添加页面（例如一个新的 **我的作品集** 部分）、贴上照片并写下笔记。现在，如果你能随时翻阅这本剪贴簿，查看自己随时间所做的所有更改，那不是很棒吗？这正是\
  \ Git 和 GitHub 中的历史记录所做的事情！\n\n![图 7.1 – 将 Git 和 GitHub 历史解释为项目的剪贴簿](img/B21847_07_01.jpg)\n\
  图 7.1 – 将 Git 和 GitHub 历史解释为项目的剪贴簿\n\n## 在 Git 仓库中本地查看历史记录\n\n每次你在 Git 中进行更改（例如向你的网站添加\
  \ **我的作品集** 部分），就如同在剪贴簿中添加新条目并在特定时刻保存快照：\n\n![图 7.2 – 我的作品集 部分](img/B21847_07_02.jpg)\n\
  图 7.2 – 我的作品集 部分\n\n### `git log`\n要查看此历史记录，你可以使用 `git log` 命令。此命令就像打开你的剪贴簿。它显示所有更改（提交）的列表、谁做的以及何时做的。*图\
  \ 7.3* 显示了该日志在 Git 中的外观：\n\n![图 7.3 – Git 历史记录](img/B21847_07_03.jpg)\n图 7.3 – Git\
  \ 历史记录\n\n每个快照（提交）都有一个唯一的 ID，就像指纹一样。此 ID 让你能够识别每个提交并将其与其他提交区分开来。 along with each\
  \ snapshot, you write a message. 这就像解释你做了什么更改以及为什么。好的提交信息就像日记，帮助你（和其他人）了解项目的历史。\n\
  \n### `git log --oneline`\n`git log --oneline` 命令也很有用，可用于显示项目的历史。\n此命令简化了 `git log`\
  \ 的输出。 它不会显示完整的提交信息和作者信息，而是以单行显示每个提交，只包含提交的 ID（缩写）和提交信息的标题，如 *图 7.4* 所示。把它想象成项目历史的摘要或\
  \ *标题*：\n\n![图 7.4 – 运行 git log --oneline 命令的结果](img/B21847_07_04.jpg)\n图 7.4 –\
  \ 运行 git log --oneline 命令的结果\n\n### `git log --oneline --graph`\n如果你想要更图形化的 Git\
  \ 历史视图，可以使用 `git log --oneline --graph` 命令。\n此命令在 `--oneline` 的简洁性的基础上，添加了使用 ASCII\
  \ 图表对提交历史的可视化表示。它有助于查看分支和合并的结构。想象它就像提交的家谱。*图 7.5* 显示了它的外观：\n\n![图 7.5 – 运行 git log\
  \ --oneline --graph 命令的结果](img/B21847_07_05.jpg)\n图 7.5 – 运行 git log --oneline --graph\
  \ 命令的结果\n\n### `git log --oneline --graph --decorate`\n`git log --oneline --graph\
  \ --decorate` 命令很有用，如果你想在历史中看到更多元数据。\n此命令在前一个命令的基础上添加了 *装饰*。在 Git 中，装饰是指指向特定提交的引用，例如分支名称、标签或\
  \ `HEAD` 请求。使用此命令可以更轻松地查看分支相对于提交的位置。它就像在提交树中为分支贴上标签，以便你知道谁是谁：\n\n![图 7.6 – 运行 git\
  \ log --oneline --graph --decorate 命令的结果](img/B21847_07_06.jpg)\n图 7.6 – 运行 git\
  \ log --oneline --graph --decorate 命令的结果\n\n### `git log --oneline --graph --decorate\
  \ --all`\n通过使用 `git log --oneline --graph --decorate --all` 命令，你可以显示更多元数据。\n这是最全面的视图。它显示存储库中所有分支的所有提交，而不仅仅是从当前分支可达的提交。它提供了整个存储库历史的完整概览，包括所有分支和合并。它就像对代码森林的鸟瞰图。*图\
  \ 7.7* 提供了此视图的快照：\n\n![图 7.7 – 运行 git log --oneline --graph --decorate --all 命令的结果](img/B21847_07_07.jpg)\n\
  图 7.7 – 运行 git log --oneline --graph --decorate --all 命令的结果\n\n### `git reflog`\n\
  最后，`git reflog` 提供了项目的详细历史书。它是一个显示所有最近更改的命令，每个更改都有自己的 SHA 代码。提交历史中的 **SHA 代码** 是一个唯一标识符，充当你对项目所做的每个更改的指纹，确保你在\
  \ Git 中工作的完整性和历史记录。当你需要找到项目历史中的特定点以重置或 cherry-pick 时，它很有帮助。你将在下一节 *使用 **cherry-picking**\
  \ 挑选特定更改* 中了解更多关于 cherry-picking 的内容：\n\n![图 7.8 – 运行 git reflog 的结果](img/B21847_07_08.jpg)\n\
  图 7.8 – 运行 git reflog 的结果\n\n使用这些不同的 `git log` 变体，你可以根据当前需求获得合适的详细程度和概览类型，无论是浏览最近的更改还是深入研究项目的完整历史。\n\
  \n## 分支 – Git 历史的平行宇宙\n\n在 Git 中，**分支** 允许你创建平行时间线。就像同时运行着你故事的多个替代版本。你可能有一个 *主*\
  \ 时间线，其中一切都稳定，还有其他分支用于尝试新想法或功能：\n\n![图 7.9 – git log 分支和合并](img/B21847_07_09.jpg)\n\
  图 7.9 – git log 分支和合并\n\n一旦你在满意的分支中写下了故事的一部分，你就可以将其带入主时间线。此合并过程有时会导致冲突，正如我们在上一章中所见，但它是将故事的不同线索编织在一起的强大方式。\n\
  \n## Activity 页面 – 你仓库旅程的编年史\n\nGitHub 上的 **活动** 页面是一个所有操作和活动都可见的地方，你可以在此观察仓库生活的忙碌景象——从代码更改和讨论到每个团队成员的贡献。\n\
  \n*那么，如何到达那里？* 在 GitHub 上，前往你的网站的存储库并点击 **活动** 链接。这可以在右侧菜单中找到：\n\n![图 7.10 – GitHub\
  \ 上的历史活动](img/B21847_07_10.jpg)\n图 7.10 – GitHub 上的历史活动\n\n你也可以点击 **分支**，然后选择特定分支以查看其独特的活动：\n\
  \n![图 7.11 – GitHub 上的历史活动 – 分支](img/B21847_07_11.jpg)\n图 7.11 – GitHub 上的历史活动 –\
  \ 分支\n\n在这里，你会看到所有已进行的更改列表，就像在 Git 中一样，但方式更用户友好。\n\n*但是在活动页面上能找到什么？* **活动** 页面显示了更改的详细历史，包括推送（更新）、合并（合并代码）等。每个更改都链接到特定的提交和做出更改的用户。这可以在\
  \ *图 7.12* 中看到：\n\n![图 7.12 – GitHub 上的活动页面](img/B21847_07_12.jpg)\n图 7.12 – GitHub\
  \ 上的活动页面\n\n你可以按分支、用户、时间段或活动类型筛选活动。这有助于你专注于与所需内容最相关的更改。例如，你可能只想查看过去一周内对 *develop*\
  \ 分支所做的更改：\n\n![图 7.13 – 活动页面的筛选选项](img/B21847_07_13.jpg)\n图 7.13 – 活动页面的筛选选项\n\n\
  对于每个活动，你都有查看所做确切更改的选项。点击 **比较更改** 会显示添加、删除或更改的内容，提供每次更新的清晰图景：\n\n![图 7.14 – 比较更改](img/B21847_07_14.jpg)\n\
  图 7.14 – 比较更改\n\n\n\n有趣的是看到你的网站是如何演进的，从第一行代码到最新添加的内容——也就是 **My PORTFOLIO** 部分。如果你与朋友一起工作，你可以看到谁做了什么。\n\
  \n也许你的朋友为 **My PORTFOLIO** 部分添加了一个很酷的设计。如果出现问题，或者你只是好奇，你可以查看整个活动，准确地看到更改了什么以及何时更改。\n\
  \n在 GitHub 上拥有 **Activity** 页面就像拥有整个项目旅程的详细日记，让你和你的团队保持了解、一致和高效。掌握了这些知识，让我们来看另一个重要主题：`git\
  \ bisect`。\n\n# 解释 `git bisect` – 在干草堆中找针\n\n你正在制作一个单页作品集网站，突然出了问题。网站的某个部分，比如 **My\
  \ PORTFOLIO**，停止工作或消失了。你不确定问题是什么时候以及如何开始的。你知道它以前存在，但现在不见了。发生了什么？这就是 `git bisect`\
  \ 派上用场的地方。它就像一场侦探游戏，用来找出项目中何时何地出了问题。\n\n`git bisect` 命令就像一台时光机。它帮助你找到导致问题的项目中的确切更改（提交）。\n\
  \n让我们为单页作品集网站的 **My PORTFOLIO** 部分添加一些代码：\n\n![图 7.15 – 网站的代码添加](img/B21847_07_15.jpg)\
  \ \n图 7.15 – 网站的代码添加\n\n现在，让我们为这个新部分添加一些 CSS 样式：\n\n![图 7.16 – 添加到 My PORTFOLIO\
  \ 部分的代码](img/B21847_07_16.jpg) \n图 7.16 – 添加到 My PORTFOLIO 部分的代码\n\n该部分其余的 HTML\
  \ 代码和样式可以在 [`github.com/PacktPublishing/GitHub-for-Next-Generation-Coders/tree/main/Chapter%207`](https://github.com/PacktPublishing/GitHub-for-Next-Generation-Coders/tree/main/Chapter%207)\
  \ 找到。\n\n## 一个 `git bisect` 谜案 – 缺失 CSS 样式的案件\n\n你的任务：揭开网站 **My PORTFOLIO** 部分缺失\
  \ CSS 样式背后的谜团。它是你单页作品集网站的重要组成部分，而现在出了问题。曾经美观的样式部分现在看起来赤裸且未加样式。是时候用 `git bisect`\
  \ 来解开这个谜团了：\n\n![图 7.17 – My PORTFOLIO 问题](img/B21847_07_17.jpg) \n图 7.17 – My PORTFOLIO\
  \ 问题\n\n这就是你开始调查的地方。首先通过输入 `git bisect start` 告诉 Git 你有一个谜团需要解决。这就像打开你的侦探工具箱。\n\n\
  你知道当前状态是坏的，因为 CSS 没有正确应用。你用 `git bisect bad <SHA-of-bad-commit>` 命令将其标记为坏提交。使用 `git\
  \ log --oneline`，你可以开始查看提交历史，尝试指出坏提交。你知道上次拉取代码时出现了问题，所以你把最后一次提交作为坏的提交：\n\n![图 7.18\
  \ – git bisect 日志](img/B21847_07_18.jpg) \n图 7.18 – git bisect 日志\n\n然后，你回忆起一个所有东西看起来都很完美且\
  \ CSS 恰到好处的提交。你通过运行 `git bisect good <SHA-of-good-commit>` 将其标记为好提交：\n\n![图 7.19\
  \ – git bisect – 好与坏](img/B21847_07_19.jpg) \n图 7.19 – git bisect – 好与坏\n\n就像一位值得信赖的助手，Git\
  \ 将你传送到介于好与坏之间的一个提交。这就是你的第一个检查点，也可能成为犯罪现场。\n\n是时候检查了。你打开 HTML 文件。这里的 **My PORTFOLIO**\
  \ 部分好吗？如果它仍然显示不正确，那就是 *bad* 提交。如果样式正确，那么就是 *good*。\n\n你可以根据发现的情况输入 `git bisect bad`\
  \ 或 `git bisect good`。在我们的例子中，我们发现 **My PORTFOLIO** 部分仍然没有实现。\n\n所以，继续输入 `git bisect\
  \ bad`：\n\n![图 7.20 – git bisect bad](img/B21847_07_20.jpg) \n图 7.20 – git bisect\
  \ bad\n\n每次回应都有助于 Git 排除剩余嫌疑人的一半。这就像一场高风险的 *Guess Who?* 游戏。在这里，Git 将你带到另一个提交。经过几次回合，你到达了一个提交，在那里你看到类名第一次更改并导致\
  \ **My PORTFOLIO** 部分看起来很糟糕。“*Aha!*”，你惊呼道。这就是一切出错的地方：\n\n![图 7.21 – git bisect 找到一个坏提交](img/B21847_07_21.jpg)\
  \ \n图 7.21 – git bisect 找到一个坏提交\n\nGit  triumphantly 宣布了第一个坏提交。你找到了罪魁祸首。提交信息透露了开发者的名字和时间戳，即不当行为的确切时刻。通过查看你的\
  \ index 页面 HTML，你发现 **My PORTFOLIO** 部分的类名已更改为 `portfolio-sections`，并且它不再匹配 CSS\
  \ 样式。\n\n你用 `git bisect reset` 结束调查，回到现在。谜团已经解开，但还有工作要做。是时候纠正那个类名并恢复 **My PORTFOLIO**\
  \ 部分的秩序了。\n\n一旦你修复了这些问题，你会发现你的 **My PORTFOLIO** 部分又看起来不错了，如 *图 7.22* 所示：\n\n![图\
  \ 7.22 – 修复坏代码](img/B21847_07_22.jpg) \n图 7.22 – 修复坏代码\n\n不仅你解开了谜团，而且你还掌握了开发者工具箱中的一个强大工具。**My\
  \ PORTFOLIO** 部分再次闪耀，完全归功于你的侦探技巧和 `git bisect`。\n\n## 使用 `git bisect` 的简便方法 – 让\
  \ Git 做侦探工作\n\n你可以在一开始就用 `git bisect start <bad-SHA> <good-SHA>` 命令同时告诉 Git 坏提交和好提交。\n\
  \n你可以使用 `git bisect run ls index.html` 命令来自动化测试。Git 将使用它来检查每个提交。\n\n如果 `index.html`\
  \ 文件已更改，脚本将以 **0** 代码退出（一切正常）。如果没有，它将以 **1** 到 **127** 之间的代码退出（发现问题）：\n\n![图 7.23\
  \ – git bisect 找到一个坏提交](img/B21847_07_23.jpg) \n图 7.23 – git bisect 找到一个坏提交\n\n\
  一旦 Git 找到第一个坏提交，就用 `git bisect reset` 重置一切。\n\n而不是手动检查每一个更改，`git bisect` 快速识别问题。它找到导致问题的确切更改，当你处理大量代码和更新时，这非常有帮助。\n\
  \n使用 `git bisect` 就像带着时光机的侦探。对于你的作品集网站来说，这是一种快速找出问题何时开始并修复它的方法，确保你的网站始终展示你的最佳作品！接下来，让我们学习另一个很酷的功能。\n\
  \n# 回滚提交到以前的版本\n\n想象自己是一个拥有秘密力量的程序员：能够在项目中穿越时空。你的任务：使用神奇的 `git revert` 来撤销 `portfolio-section`\
  \ 命名错误造成的失误。这就像为你的代码提供了一个大范围的 *Ctrl* + *Z*，让你可以撤销错误并恢复到一切正常工作的状态：\n\n![图 7.24 –\
  \ git revert](img/B21847_07_24.jpg) \n图 7.24 – git revert\n\n你最近与 `git bisect` 的冒险让你找到了类名被错误更改的确切时刻。现在，你决定使用\
  \ `git revert` 来倒回历史并纠正这个错误。\n\n你与 `git bisect` 的侦探工作取得了回报。你拥有了提交 ID，在错误引入之前，一切都是最后完美的状态。\n\
  \n在你的终端——时光机的入口——输入 `git revert <SHA-of-bad-commit>`。\n\n这个命令就像在时光机中设置坐标，精确指向你想要撤销的时刻：\n\
  \n![图 7.25 – git revert SHA 提交](img/B21847_07_25.jpg) \n图 7.25 – git revert SHA\
  \ 提交\n\n\n\n当你按下 `Enter` 时，`Git` 开始施展它的魔力。它不会删除那个错误的提交；相反，它会创建一个新的提交。这个新提交是错误的提交的镜像相反，有效地撤销了该更改：\n\
  \n![图 7.26 – git revert 完成](img/B21847_07_26.jpg)\n\n图 7.26 – git revert 完成\n\n\
  就像在小说中添加一个反段落来抵消你不喜欢的段落。如果在当前状态与你试图恢复的过去之间存在冲突，`Git` 会要求你解决它们。如果没有冲突，它会打开一个文本编辑器，在那里你可以更改提交信息：\n\
  \n![图 7.27 – Git 提交信息](img/B21847_07_27.jpg)\n\n图 7.27 – Git 提交信息\n\n解决后，你通过一次提交完成回退。这就像你在时光旅行日志簿中的笔记。回退完成后，你的代码现在就像过去的美好时光一样\
  \ – `portfolio-section` 回到了它原本的光辉。\n\n你检查项目，一切看起来都和你记忆中一样，CSS 样式也完美就位：\n\n![图 7.28\
  \ – Git 将代码恢复到之前的状态](img/B21847_07_28.jpg)\n\n图 7.28 – Git 将代码恢复到之前的状态\n\n你刚刚做了一件不可思议的事！你在不改变通往现在的旅程的情况下改变了过去。\n\
  \n`git revert` 的强大之处在于它能在保持历史完整的同时撤销操作。就像拥有一个安全网，确保无论项目进行到多远，你都可以随时回去修正错误。\n\n你不仅修复了一个错误，还掌握了编程工具箱中一项至关重要的技能。`Git`\
  \ 中的每个命令都像是一道咒语，让你掌控项目历史的脉络。有了 `git revert`，你亲身体验了编程中负责任的时光旅行的力量。\n\n现在你已经掌握了 `git\
  \ revert` 在不重写历史的情况下修复错误的能力，让我们继续探索 `git diff` 的强大功能，它可以帮助你查找代码之间的差异。\n\n# 用 git\
  \ diff 解开谜团——看不见的变更的故事\n\n你在制作你的单页作品集网站，并且刚刚添加了一个名为 **My PORTFOLIO** 的新部分。现在，你好奇想看看与上一个版本相比你做了哪些更改。在\
  \ `Git` 的世界里，这就是 `diff` 命令发挥作用的地方。它就像一副放大镜，可以帮你发现 **My PORTFOLIO** 部分中旧网站和新网站之间的差异。\n\
  \n## diff 命令是什么？\n\n`Git` 中的 `diff` 命令会显示你当前代码与上一次提交版本之间的差异。就像比较房间装修前后的两张照片，以确切地看到有什么变化。\n\
  \n命令行是你用来调查单页作品集网站更改的地方。确保你在电脑上位于网站项目的目录（文件夹）中。\n\n输入 `git diff` 并按下 `Enter`。该命令要求\
  \ `Git` 显示你上次保存（提交）的版本与现在之间的差异。\n\n你会看到一份更改列表：新增的行会用加号 (`+`) 标记，删除的行会有减号 (`-`)。输出结果乍一看可能有点\
  \ confusing，但它准确地显示了不同之处。\n\n例如，如果你在 **My PORTFOLIO** 部分添加了一段关于你技能的新段落，`git diff`\
  \ 会用加号显示这段新段落，如图 7.29 所示：\n\n![图 7.29 – 运行 git diff 命令的结果](img/B21847_07_29.jpg)\n\
  \n图 7.29 – 运行 git diff 命令的结果\n\n## 其他 diff 命令\n\n现在，让我们学习一些其他 `diff` 命令，它们可以帮助你辨别代码两个版本之间的差异：\n\
  \n* `git diff --staged`：该命令显示你已暂存（添加到下一次提交）但尚未提交的更改。就像查看你为旅行打包的物品清单，但还没有放进行李箱一样：\n\
  \n![图 7.30 – 运行 git diff --staged 命令的结果](img/B21847_07_30.jpg)\n\n图 7.30 – 运行 git\
  \ diff --staged 命令的结果\n\n* `git diff HEAD`：显示自上次提交以来工作目录中的所有更改，无论是否已暂存。`HEAD` 指当前分支上的最新提交。就像退一步看看自上次打扫房间以来你在房间里做的所有更改。\n\
  \n* `git diff <REF-1> <REF-2>`：如果你想用两个引用（如提交 ID 或分支名称）将当前网站与旧版本进行比较，可以使用此命令。例如，`git\
  \ diff main my-portfolio` 比较名为 `main` 的分支与名为 `my-portfolio` 的分支：\n\n![图 7.31 – 运行\
  \ git diff <REF-1> <REF-2> 命令的结果](img/B21847_07_31.jpg)\n\n图 7.31 – 运行 git diff\
  \ <REF-1> <REF-2> 命令的结果\n\n* `git diff origin/main main`：该命令比较本地和远程分支，让你看到本地 `main`\
  \ 分支与 GitHub（远程）上的 `main` 分支之间的差异。就像比较你手上的房屋蓝图（本地）和你发给建筑师的蓝图（远程）一样。\n\n或者，假设你想比较特定的提交。有时，你想比较项目历史中两个特定点的差异。你可以使用它们的提交\
  \ ID（那些长字母数字代码）来查看这两个点之间发生了什么变化。\n\n`git diff` 命令的每个变体都提供了一种独特的方式来检查单页作品集网站中的更改。无论你是在查看最近的编辑、为下一次大更新做准备，还是比较不同版本，这些命令都能帮助你掌握项目演变的脉络。你不仅揭开了代码中隐藏的谜团，还对项目的演变有了更深入的理解。\n\
  \n现在我们已经探索了如何使用 `git diff` 发现项目中的差异，让我们转换一下思路。接下来，我们将介绍如何使用 `git reset` 和 cherry-picking\
  \ 回退并调整这些更改，甚至挑选出最好的更改。这是为了微调你的项目，确保每个新增内容都能完美融入网站的整体构图。\n\n# 使用 git reset 和 cherry-picking\
  \ 撤销更改\n\n想象一下，你正在为单页网站添加 **My PORTFOLIO** 部分，但你意识到需要撤销一些更改或从项目历史中挑选特定更改。这时 `Git`\
  \ 的 `reset` 和 `cherry-pick` 功能就派上用场了。它就像一台时光机，将你的项目带回到某些更改之前的一个特定历史点。\n\n## git\
  \ reset 的类型\n\n有三种不同的 `git reset`。我们将全部解释：\n\n* `Soft reset`：`git reset --soft`\
  \ 命令将项目回退，但保留最近的更改在暂存区（就像保留未保存的工作）。之后你可以选择重新提交。\n\n* `Mixed reset`：`git reset --mixed\
  \ <SHA>` 命令是默认的重置。它将项目移回之前的状态（状态由一个称为 `SHA` 的唯一代码标识），并将更改放在工作目录中，未保存。你可以随后决定保留什么、丢弃什么。\n\
  \n* `Hard reset`：`git reset --hard <SHA>` 命令是完全回滚。它将项目带回之前的状态，并永久删除此点之后所做的所有更改。就像按下重置按钮并丢失未保存的更改一样。\n\
  \n## 使用 cherry-picking 挑选特定更改\n\n想象一下翻阅相册并挑选出特定的照片。`Git` 中的 cherry-picking 让你可以从项目历史中选择特定更改并将其应用到当前版本。你可以通过运行\
  \ `git cherry-pick <SHA>` 使用想要应用的更改的唯一 `SHA` 代码。\n\n\n\n让我们快速解释 Git 中 **cherry-picking**\
  \ 的概念。它是一种用于跟踪文件更改并在多人之间协调工作的版本控制系统。图 7.32 进一步演示了这一点：\n\n![图 7.32 – Git cherry-picking](img/B21847_07_32.jpg)\n\
  \n图 7.32 – Git cherry-picking\n\n让我们详细解读前一幅图中显示的术语：\n\n* **feature branch** 就像拥有一个单独的工作区或草稿本，开发者在其中绘制或编写新内容——在本例中，是您的一页式作品集网站的新功能。\n\
  * **main branch** 是每个人都能看到的网站最终稿。它是经过润色的版本，其中展示了所有完全完成的功能。\n\n事件序列如下：\n\n1. 开发者在其\
  \ feature branch 中工作，进行更改（称为 **commits**）。每个 commit 就像保存您网站设计的一个新版本。随着开发者进行更多更改，他们会保存更多\
  \ commits。他们处于一个 **loop** 中，不断进行更改并保存 commits，直到功能完成。\n2. 在某个时候，开发者或其团队决定将 feature\
  \ branch 中的一个特定更改（单个 commit）准备好添加到 main branch。\n3. 开发者使用 `git switch main` 命令切换到\
  \ main branch。这就像说，“*好吧，让我们去 **最终稿。***”\n4. 然后，他们使用 `git cherry-pick` 命令并指定来自 feature\
  \ branch 的特定 commit。这就像说，“*让我们从我的草稿本中取出这个好主意并放入 **最终稿。***”\n5. 被 cherry-pick 的 commit\
  \ 应用到 main branch。这就像把草稿本上的贴纸粘到最终稿上。\n6. main branch 现在有了新的更改，而 feature branch 仍然存在，其中包含所有可能仍在进行中的其他更改。\n\
  \n*loop* 表示开发过程是迭代的。开发者经常进行许多更改，并且可以在任何时候 cherry-pick 其中任何更改以添加到 main branch。\n\n\
  Cherry-picking 可用于从一系列 commits 中快速包含特定的修复或功能，而无需合并 feature branch 中的所有更改。这对于管理哪些内容准备好包含在您网站的\
  \ main branch 中非常有用。\n\n## 摘要\n\n恭喜您完成 *第 7 章*！您刚刚经历了 Git 中最强大的方面之一，学习如何控制和导航编码项目的历史。让我们花点时间回顾一下您掌握的关键技能和概念。\n\
  \n以下是您所取得的成果回顾。\n\n* **理解 Git 的历史**：您深入研究了 `git log`，探索了查看项目时间线的各种方式。您已看到 `git log\
  \ --oneline`、`git log --graph` 和 `git log --decorate` 如何将项目历史的理解从简单的列表转变为详细而信息丰富的地图。\n\
  * **git bisect – 侦探工具**：`git bisect` 命令成为您的侦探工具，帮助您高效地追踪引入 bug 的确切 commit。\n* **回滚和重置**：您已学习使用\
  \ `git revert` 和 `git reset` 撤销更改的艺术。\n* **使用 diff 探索更改**：`diff` 命令提供了在 commits、分支和工作目录之间比较更改的新方法。您获得了在细粒度级别上发现差异的能力，从而增强了对每次修改的洞察。\n\
  * **Cherry-picking – 选择性集成**：Cherry-picking 教会您从不同分支选择性地集成更改。\n\n当您结束本章时，请记住您获得的技能不仅仅是管理代码——它们是关于管理时间和变化。\n\
  \n下一章将打开一座宝库的工具和命令，提升您的 Git 和 GitHub 体验。我们将涵盖一系列重要主题，例如 Sourcetree、GitHub Codespaces、GitHub\
  \ Desktop、Visual Studio Code 和 DevHub 通知。\n\n## 测验\n\n请回答以下问题：\n\n1. `git log` 在\
  \ Git 中做什么？\n   1. 删除旧提交\n   2. 显示提交历史\n   3. 修改最新提交\n   4. 创建新分支\n   *Answer*:\
  \ B. 显示提交历史。\n\n2. 真或假：`git reflog` 命令可用于查看存储库中进行的操作（例如提交和合并）的列表。\n   1. 真\n   2.\
  \ 假\n   *Answer*: A. 真。\n\n3. `git` ________ 是一个工具，通过自动测试提交来查找引入 bug 的提交。\n   *Answer*:\
  \ `bisect`.\n\n4. 在 Git 中回滚提交的目的是什么？\n   *Answer*: 回滚提交用于撤销特定提交所做的更改，将项目恢复到之前的状态，而不改变项目的历史记录。\n\
  \n5. `git diff` 命令显示什么？\n   1. 分支之间的差异\n   2. 提交之间的差异\n   3. 工作目录中的当前更改\n   4. 以上全部\n\
  \   *Answer*: D. 以上全部。\n\n6. 真或假：一旦提交被回滚，它就完全从项目的历史记录中删除。\n   1. 真\n   2. 假\n  \
  \ *Answer*: B. 假（提交仍在历史记录中，但其更改已被撤销）。\n\n7. Git 中的 cherry-picking 是什么？\n   1. 删除特定提交\n\
  \   2. 从一个分支选择并应用特定提交到另一个分支\n   3. 创建新存储库\n   4. 重命名分支\n   *Answer*: B. 从一个分支选择并应用特定提交到另一个分支。\n\
  \n8. 要撤销提交所做的更改并保留这些更改在工作目录中，您将使用 `git reset --`______。\n   *Answer*: `soft`.\n\n\
  9. 真或假：`git bisect` 命令会自动修复它在代码中找到的 bug。\n   1. 真\n   2. 假\n   *Answer*: B. 假（它有助于识别有问题的提交，但不会修复\
  \ bug）。\n\n10. `git reset` 和 `git revert` 的主要区别是什么？\n    *Answer*: `git reset` 命令用于通过将当前分支移动到特定提交来撤销更改，可能改变项目的历史记录，而\
  \ `git revert` 创建一个新的提交来撤销之前提交的更改，而不改变项目的历史记录。\n\n## 增强挑战 – Space Explorer 启动屏幕、分数跟踪和掌握\
  \ Git 命令\n\n在练习用于回滚、重置和 cherry-picking 的高级 Git 命令的同时，在 *Space Explorer* 中实现启动屏幕和分数跟踪：\n\
  \n![图 7.33 – Space Explorer 启动屏幕](img/B21847_07_33.jpg)\n\n图 7.33 – Space Explorer\
  \ 启动屏幕\n\n* 这里是您更新的成功步骤 **：\n1. **初始设置**：与之前一样，创建一个新分支 (**feature-splash-and-score**)\
  \ 并开始实现启动屏幕和分数跟踪。\n2. **故意“错误”**：在初始实现之后，在代码中做一些故意的“错误”或次优更改。提交这些更改。\n3. **使用 git\
  \ revert**：找出您犯的一个故意错误并使用 `git revert` 撤销该特定提交。这将帮助您了解如何回退已记录在 Git 历史记录中的更改。\n4.\
  \ **尝试 git reset**：对于另一个错误，使用 `git reset` 撤销更改。您可以尝试使用 `git reset --soft` 或 `git\
  \ reset --hard`（请注意 `--hard` 会永久删除您的更改），以了解它们在处理项目历史记录方面的差异。\n5. **Cherry-pick 一个功能**：创建一个新分支（例如，**additional-feature**）并为启动屏幕或计分系统添加一个小但明显的新的功能或增强。\n\
  \n\n\n提交后，切换回你的 `feature-splash-and-score` 分支，并使用 `git cherry-pick` 从 `additional-feature`\
  \ 选择性地将新功能应用到你的主工作分支。\n\n### 6. 最终测试和合并\n彻底测试所有功能，包括启动画面功能和分数追踪，以确保一切无缝运行。\n如果在合并到主分支时出现合并冲突，请使用你新获得的技能解决它们。\n\
  \n### 7. 反思与文档\n1. 在 README 文件或提交信息中记录你的流程和挑战。\n2. 反思使用这些 Git 命令如何帮助了你的开发流程。\n\n\
  你可以在以下链接下载代码：[`github.com/PacktPublishing/GitHub-for-Next-Generation-Coders/tree/main/Space%20Explorer%20Game/Game%20Obsticles%20-%20Splash%20screen%20and%20player%20name`](https://github.com/PacktPublishing/GitHub-for-Next-Generation-Coders/tree/main/Space%20Explorer%20Game/Game%20Obsticles%20-%20Splash%20screen%20and%20player%20name)。\n\
  \n## 8 有用的工具和 Git 命令\n\n## 有用的工具和 Git 命令\n欢迎来到第 8 章，我们将深入 Git 和 GitHub 的世界，为你的单页作品集网站解锁新的效率和协作水平。你已经学习了基础知识，现在是时候发挥一些强大工具和命令的全部潜力了。\n\
  在本章中，我们将学习有用的 Git 命令，它们可以创建快捷方式、追踪文件的演变、重新排列提交并执行更多此类任务。然后我们将介绍 Sourcetree 以及它如何将\
  \ Git 的复杂性转变为项目旅程的可视化地图。我们将学习如何使用 Codespaces 在任何地方编码，使用 GitHub Desktop 管理存储库，并设置\
  \ DevHub，一个个人桌面助手，让你随时了解 GitHub 项目中的所有活动。\n这里是我们将探索内容的预览：\n* 打造快捷方式并保持整洁 – 高级 Git\
  \ 命令\n* 使用 Sourcetree 简化你的网站工作\n* 使用 GitHub Desktop 导航你的网站项目\n* 使用 GitHub Codespaces\
  \ 打造你的网站\n* 使用 DevHub 管理你的项目的动态\n\n### 打造快捷方式并保持整洁 – 高级 Git 命令\n在构建网站时，你可能会发现自己重复使用一些冗长的\
  \ Git 命令。拥有快捷方式不是更容易吗？或者只需一个命令就能清理不必要的文件？本节将介绍一些可以做到这一点甚至更多的高级命令。\n在你的单页作品集网站上工作有时会感觉像在杂耍。你有想尝试的新想法，你正在修复错误，同时还要跟踪所有更改。以下是一些\
  \ Git 命令，它们就像巧妙的工具，帮助你更高效地杂耍。\n* 使用 git alias 创建自己的快捷方式：使用 `git config --global\
  \ alias.[alias_name] [git_command]` 为你经常使用的命令创建快捷方式。例如，如果你经常检查状态，可以设置一个别名，例如 `git\
  \ config --global alias.st status`。\n现在，不必每次都输入 `git status`，你只需输入 `git st`：\n![图\
  \ 8.1 – Git 别名状态](img/B21847_08_1.jpg)\n图 8.1 – Git 别名状态\n* 使用 git log follow 跨更改追踪文件历史：当你想查看特定文件随时间所做的更改时，使用\
  \ `git log --follow [file]`。它就像为你网站代码的某一部分提供详细的 timeline。\n例如，让我们查看 `index.html`\
  \ 文件的日志并输入 `git log --follow index.html`。你将得到 `index.html` 文件的详细历史，如图 8.2 所示：\n\
  ![图 8.2 – git log follow](img/B21847_08_2.jpg)\n图 8.2 – git log follow\n* 使用 git\
  \ rebase 重新排列你的工作：`git rebase [branch]` 命令允许你将一系列提交移动或合并到新的基础提交。它有点像重新排列你网站故事中的页面，以使叙述更流畅。\n\
  * 使用 git clean 清理未跟踪文件：要从工作目录中删除未跟踪文件，`git clean -fd` 是你的首选命令。把它想象成通过删除所有未进入你网站的纸屑和未使用的草图来保持工作空间整洁。\n\
  * 使用 git stash 保存进行中的工作：想象一下，你正在为网站制作新设计，突然有人要求你添加新功能。你需要一种快速隐藏设计并清理本地仓库而不丢失已完成工作的方法。`git\
  \ stash` 就像那个保存选项；它会获取所有更改并暂时隐藏它们，让你拥有一个干净的工作目录。\n* 使用 git stash pop 恢复已暂存的更改：在功能实现后你想回到设计时，`git\
  \ stash pop` 会移除覆盖层并恢复你的工作。它就像揭开你的 CSS 设计和图像，立即回到你离开的地方。\n* 使用 git tag 标记里程碑：当你在网站开发中达到重要节点，例如完成关于部分时，你可能想标记它。`git\
  \ tag [tagname]` 就像在时间线上那个点上贴一张便签，以便以后能轻松找到它。\n* 使用 git blame 找出谁做了更改：如果注意到网站上的某些内容发生了变化而你不确定是谁做的，`git\
  \ blame [file]` 会显示每个文件行最后由谁编辑以及何时编辑。它就像做侦探工作来弄清楚谁移动或删除了你的设计。\n例如，让我们尝试 `index.html`\
  \ 文件看看会得到什么结果。输入 `git blame index.html` 后，你将看到整个文件以及每一行和做出增添或更改的人员姓名：\n![图 8.3 –\
  \ git blame 结果](img/B21847_08_3.jpg)\n图 8.3 – git blame 结果\n* 使用 git fetch --all\
  \ 从所有分支获取更新：`git fetch --all` 命令就像检查所有邮箱是否有消息。它获取 GitHub 仓库中所有分支的最新更新，而不会将它们合并到你的工作中。你可以在决定将什么合并到自己的分支之前，查看其他人都在做什么。\n\
  * 使用 git remote 检查你的远程仓库：要查看你对仓库其他版本的远程连接列表，`git remote -v` 就像拥有一本地址簿。它显示了你可以推送更改或获取的位置。\n\
  这些高级命令为管理你的网站项目提供了更大的灵活性和效率。它们就像在你的工作坊中拥有一套电动工具，使你的工作更整洁，你的努力更高效。\n它们确保你可以保存工作、跟踪贡献、标记重要里程碑并随时了解每个人的工作。\n\
  一切都是为了让你的网站开发过程尽可能顺畅无压力！在下一节中，我们将学习更多可以帮助我们管理 Git 和仓库的工具。\n\n### 使用 Sourcetree 简化你的网站工作\n\
  在你创建单页作品集网站时，而不是使用命令行 Git 命令手动处理所有更新和更改，你有一个工具可以直观地为你展示一切。该工具是 Atlassian 的 Sourcetree。\n\
  ![图 8.4 – Sourcetree](img/B21847_08_4.jpg)\n图 8.4 – Sourcetree\n\n#### 为什么应该使用 Sourcetree？\n\
  Sourcetree 以易于理解的方式呈现你的项目。它就像拥有你所有工作的地图，从大局到细节。\n如果输入 Git 命令感觉像在外语中点咖啡，Sourcetree\
  \ 就像有一位友好的咖啡师知道你的常规订单。只需指向并点击即可。\n\n\n\n# Sourcetree\n\n在提交之前，你可以在 Sourcetree 中预览更改，确保你清楚正在更新的内容。Sourcetree\
  \ 还能轻松查看谁在做什么，让团队协作变得轻松自如。\n\n由于所有操作都直观清晰，出错的空间更小。你不太可能意外合并错误分支或提交错误文件。\n\nSourcetree\
  \ 可以将复杂的 Git 命令网络转变为视觉上可管理的流程，非常适合专注于构建精美的单页作品集网站，而不会陷入命令行语法的困扰。它是一个工具，可以让管理项目的开发像在可视化编辑器中编辑网站设计一样简单直观。\n\
  \n## 使用 Sourcetree 入门\n\n首先，你需要下载并安装它。你可以前往 Sourcetree 网站（[`www.sourcetreeapp.com/`](https://www.sourcetreeapp.com/)）下载应用程序，然后下载应用。安装过程就像在电脑上设置任何其他软件一样简单。\n\
  \n![图 8.5 – 下载 Sourcetree](img/B21847_08_5.jpg)\n图 8.5 – 下载 Sourcetree\n\n## 连接你的仓库\n\
  \n一旦 Sourcetree 运行起来，你就可以将其连接到你的 GitHub 账户，该账户存放着你的网站仓库。这就像告诉你的导航应用你想去哪里。\n\n![图\
  \ 8.6 – 使用 Sourcetree 设置你的仓库](img/B21847_08_6.jpg)\n图 8.6 – 使用 Sourcetree 设置你的仓库\n\
  \n## 查看你的项目时间线\n\n设置好仓库后，Sourcetree 会显示你的项目历史。每个提交、分支和标签都以交互式时间线显示。这就像拥有你网站开发的故事板。\n\
  \n![图 8.7 – Sourcetree 仓库历史](img/B21847_08_7.jpg)\n图 8.7 – Sourcetree 仓库历史\n\n##\
  \ 创建、合并和切换分支\n\n想在新功能上工作或修复 bug 吗？执行 `create`、`merge` 和 `switch` 分支流程的选项很容易找到，如图\
  \ 8.8 所示。\n\n![图 8.8 – Sourcetree 快速命令](img/B21847_08_8.jpg)\n图 8.8 – Sourcetree\
  \ 快速命令\n\n在 Sourcetree 中，你可以通过点击 `Branch` 按钮创建新分支，如图 8.9 所示。\n\n![图 8.9 – 在 Sourcetree\
  \ 中创建新分支](img/B21847_08_9.jpg)\n图 8.9 – 在 Sourcetree 中创建新分支\n\n合并它们同样简单，只需右键点击你想要合并到当前分支的分支即可，如图\
  \ 8.10 所示。\n\n![图 8.10 – 将目标分支合并到当前分支](img/B21847_08_10.jpg)\n图 8.10 – 将目标分支合并到当前分支\n\
  \n在分支之间切换就像切换电视频道一样简单；你只需双击想要切换的分支即可。就这么简单。\n\n## 暂存和提交更改\n\n当你对网站进行更改时，例如添加新部分或更新图片，Sourcetree\
  \ 帮助你以简单的方式组织这些更改。想象一下你在寄出前将物品分类放入盒子。Sourcetree 显示你所做的所有更改，允许你选择（或 `stage`）准备保留的更改。一旦你挑选了想要发送的所有项目，点击\
  \ Sourcetree 中的 `Commit` 按钮就像封箱并寄出一样。此操作会轻松高效地用你的最新更改更新项目。\n\n![图 8.11 – Sourcetree\
  \ 暂存和提交更改](img/B21847_08_11.jpg)\n图 8.11 – Sourcetree 暂存和提交更改\n\n## Pull、Fetch 和\
  \ Push\n\n需要用他人的更改更新本地仓库？或将你的更新发送给团队？Sourcetree 将这些操作变成简单的按钮点击。\n\nSourcetree 中的\
  \ `Pull` 按钮执行的操作与在 Git Bash 中执行 `git pull` 命令相同，会用远程更改更新你的本地仓库。同样，`Push` 按钮自动化了\
  \ `git push` 命令，将你的本地更新发送到远程仓库。对于在不合并到本地分支的情况下检索更新，Sourcetree 中的 `Fetch` 按钮映射了 `git\
  \ fetch` 命令，让你先查看有什么新内容，然后再决定是否集成这些更改。\n\n![图 8.12 – Sourcetree Pull、Push 和 Fetch\
  \ 按钮](img/B21847_08_12.jpg)\n图 8.12 – Sourcetree Pull、Push 和 Fetch 按钮\n\n现在你已经了解\
  \ Sourcetree 如何通过其可视化界面和直接控制简化管理你的单页作品集网站，让我们继续。接下来，我们将查看 GitHub Desktop，另一个旨在让导航项目开发更轻松的工具。\n\
  \n# 使用 GitHub Desktop 导航你的网站项目\n\n花点时间想象一下你有一个单页作品集网站项目的遥控器。这可不是普通的遥控器；它让你能够像翻阅电视频道一样管理所有更新、更改和协作。这就是\
  \ GitHub Desktop 的感觉。\n\n**GitHub Desktop** 就像 Git 世界中的友好向导。它去除了命令行复杂性，提供了一个干净、有组织的桌面应用程序，让你可以轻松管理项目。\n\
  \n## 设置 GitHub Desktop\n\n访问 GitHub Desktop 网站（[`desktop.github.com/`](https://github.com/PacktPublishing/GitHub-for-Next-Generation-Coders/tree/main/Space%20Explorer%20Game/Game%20Obsticles%20-%20Game%20Over%20screen)）并下载应用。你可以像在电脑上安装任何新应用一样安装它。然后，按照以下步骤操作：\n\
  \n1. **连接到你的 GitHub 仓库**：安装后，打开 GitHub Desktop 并使用你的 GitHub 账户登录。这就像在新设备上登录你的电子邮件。\n\
  \n![图 8.13 – 将 GitHub Desktop 与你的 GitHub 连接](img/B21847_08_13.jpg)\n图 8.13 – 将 GitHub\
  \ Desktop 与你的 GitHub 连接\n\n![图 8.14 – 使用你的 Git 凭据配置 GitHub Desktop](img/B21847_08_14.jpg)\n\
  图 8.14 – 使用你的 Git 凭据配置 GitHub Desktop\n\n1. **克隆你的仓库**：找到 **Clone a repository**\
  \ 选项并选择你的单页作品集网站。这将在你的本地机器上创建项目的副本，就像保存文档以便离线工作一样。\n\n![图 8.15 – 使用 GitHub Desktop\
  \ 选择用于克隆的仓库](img/B21847_08_15.jpg)\n图 8.15 – 使用 GitHub Desktop 选择用于克隆的仓库\n\n## 你可以用\
  \ GitHub Desktop 做什么？\n\nGitHub Desktop 提供了众多功能。让我们看看其中一些：\n\n* **检查你的更改**：你是否对网站进行了一些更新？GitHub\
  \ Desktop 显示你更改的文件列表以及每个文件中的具体差异。这就像在 Word 文档中跟踪更改。\n\n![图 8.16 – 使用 GitHub Desktop\
  \ 克隆仓库](img/B21847_08_16.jpg)\n图 8.16 – 使用 GitHub Desktop 克隆仓库\n\n* **提交到你的历史记录**：当你准备保存更改时，添加描述性消息并提交。这就像对你的工作签字，表示“这已准备好添加到项目中。”\n\
  \n![图 8.17 – 提交更改](img/B21847_08_17.jpg)\n图 8.17 – 提交更改\n\n* **与 GitHub 同步**：使用\
  \ `Fetch`、`Pull` 和 `Push` 按钮将本地工作与在线仓库同步。就像在设备间同步音乐库一样简单。\n\n![图 8.18 – 使用 GitHub\
  \ Desktop 同步](img/B21847_08_18.jpg)\n图 8.18 – 使用 GitHub Desktop 同步\n\n* **分支、合并和收尾；保持协作**：想尝试新想法吗？在\
  \ GitHub Desktop 中创建新分支。这就像打开一个新的干净功能分支进行编码，同时保持原始代码安全。\n\n当你的新功能准备就绪时，你可以将其合并到主项目中。GitHub\
  \ Desktop 会指导你完成整个过程，以确保过渡顺利。\n\n\n\nPull request 是团队协作的关键部分。GitHub Desktop 集成了此功能，让你可以在应用内审阅、讨论并合并团队成员的工作。\n\
  \n![图 8.19 – GitHub Desktop 中的分支](img/B21847_08_19.jpg)\n图 8.19 – GitHub Desktop\
  \ 中的分支\n\n接下来，让我们来看一下 GitHub Desktop 的一些优势：\n* 它能让你以可视化方式查看项目的进展\n* 你可以分享你的工作并整合他人的贡献，而无需接触命令行\n\
  * 其简洁的界面有助于防止在命令行中容易犯的错误\n\n使用 GitHub Desktop 来制作你的单页作品集网站就是为了简化你的开发流程。它是一款工具，让版本控制感觉不像火箭科学，而更像你创作工作流程中的常规部分。它非常适合那些想要\
  \ Git 的强大功能，同时又希望拥有所见即所得界面的人。接下来，让我们继续看看如何使用 GitHub Codespaces 直接在浏览器中开发你的网站。这就像拥有一个完整的开发工作室在你的网页浏览器中，为你提供编写、运行和调试代码的工具，而无需切换应用程序。\n\
  \n# 使用 GitHub Codespaces 打造你的网站\n\n花点时间想象一下走进一个设备齐全的工作坊，你可以在那里立即开始创作，无需设置任何工具或机器。这就是\
  \ GitHub Codespaces 为你的单页作品集网站项目提供的功能。它是一个完整、开箱即用的开发环境，直接在你的浏览器中运行。\n\n## 为什么要使用\
  \ Codespaces？\n\n无需花费时间在本地机器上设置开发环境，你可以从任何有网络连接的设备上工作你的网站。只要有浏览器，你就可以开始。你无需担心设备是否足够强大。Codespaces\
  \ 为你提供了一个托管在网上的（云端）编码环境。\n\nCodespaces 具备 **Visual Studio Code** 的功能，这是一款顶级的编辑器。就像拥有配备专业软件的高端电脑一样。\n\
  \n## 如何开始使用 Codespaces\n\n实际上比你想象的更简单。只需一次点击，你就可以直接从你的仓库创建一个新的 codespace。只需前往你网站的\
  \ GitHub 仓库并点击 **<> 代码** 按钮。从那里，你可以为你的仓库创建新的 codespace。GitHub 会在后台完成所有设置。\n\n![图\
  \ 8.20 – 创建 GitHub Codespaces](img/B21847_08_20.jpg)\n图 8.20 – 创建 GitHub Codespaces\n\
  \n一旦你的 codespace 准备就绪，你就可以在网页浏览器中访问完整的编码环境，其中包括终端、代码编辑器，甚至调试工具。\n\n![图 8.21 – 启动\
  \ Codespaces](img/B21847_08_21.jpg)\n图 8.21 – 启动 Codespaces\n\n现在，你可以像在本地电脑上一样工作你的网站。编辑文件、运行网站以测试更改，并提交你的更新。\n\
  \n你需要的一切都在浏览器中。分享你的 codespace 给协作者，让他们可以加入并与你一起编码。\n\n![图 8.22 – 与协作者共享你的 codespace](img/B21847_08_22.jpg)\n\
  图 8.22 – 与协作者共享你的 codespace\n\n使用 Codespaces，你可以随时随地立即回到你的项目，继续上次中断的地方。\n\n![图 8.23\
  \ – Codespaces 源代码控制](img/B21847_08_23.jpg)\n图 8.23 – Codespaces 源代码控制\n\nGitHub\
  \ Codespaces 就像拥有一个便携的虚拟工作坊，你可以从任何地方进入来工作你的单页作品集网站。它旨在使开发过程更顺畅，让你专注于创作和协作，而无需任何设置麻烦。\n\
  \n## 删除 Codespaces\n\nGitHub Codespaces 如果你停止它或它在一段时间内保持非活动状态，总是会被自动删除，但你也可以随时通过点击按钮手动删除它，如\
  \ *图 8**.24* 所示。\n\n![图 8.24 – 删除 Codespaces](img/B21847_08_24.jpg)\n图 8.24 – 删除\
  \ Codespaces\n\n现在我们已经探讨了 GitHub Codespaces 如何将任何设备转变为网站的强大开发工作室，让我们继续前进。接下来，我们将看看如何跟踪所有项目更新和对话。有了\
  \ DevHub，你会发现管理项目的通知变得轻而易举，无论是在桌面还是网页浏览器中。\n\n# 使用 DevHub 管理项目的动态\n\n你的单页作品集网站已经上线，事情很多。朋友们在建议更改，有关于新功能讨论，并且正在进行更新。面对所有这些活动，你的\
  \ GitHub 通知蜂拥而至。这就是 DevHub 发挥作用的地方。它就像一个个人助理，帮助你管理这些动态。\n\n![图 8.25 – DevHub](img/B21847_08_25.jpg)\n\
  图 8.25 – DevHub\n\n**DevHub** 是一款工具，可将你所有的 GitHub 通知和活动直接带到你的桌面。你也可以使用网页版的控制面板，在无需登录\
  \ GitHub 的情况下查看项目中发生的一切。\n\n![图 8.26 – DevHub 仪表板](img/B21847_08_26.jpg)\n图 8.26\
  \ – DevHub 仪表板\n\n## 如何设置 DevHub？\n\n你可以通过访问 `devhubapp.com/` 使用网页版，然后只需点击 **使用网页版**\
  \ 按钮。你会看到 **使用 GitHub 登录** 按钮来将 DevHub 连接到你的 GitHub 账户。点击该按钮后，会弹出一个新窗口，你需要在其中登录你的\
  \ GitHub 账户。接下来，你需要同意将 DevHub 与你的 GitHub 账户连接。现在，你就可以在浏览器中使用 DevHub 了。\n\n![图 8.27\
  \ – DevHub 版本](img/B21847_08_28.jpg)\n图 8.27 – DevHub 版本\n\n如果你希望通知管理器直接在桌面上，那么点击\
  \ **下载 Windows 版** 按钮并下载 DevHub 到你的桌面。这就像获得一个新小工具，会让生活变得轻松许多。与设置网页版类似，你只需连接你的 GitHub\
  \ 账户即可开始使用。\n\n## 为什么应该在日常工作流程中使用 DevHub？\n\nDevHub 按仓库和类型组织你的通知，就像有一个带有账单、信件和广告不同部分的邮箱，让你能轻松找到所需内容。将所有通知和活动集中在一个地方，你可以更快、更高效地处理事情。\n\
  \n你可以配置 DevHub 显示最重要的内容，只为你关心的通知提醒你。与其在 GitHub 的通知海洋中迷失，DevHub 帮助你专注于手头的任务。\n\n\
  无论是回复 pull request、查看 issue，还是合并更改，DevHub 都让你能在一个地方完成。DevHub 让你与团队的活动保持同步，使协作顺畅且持续，就像一个专门用于项目开发的群聊。\n\
  \n在了解了 DevHub 如何简化项目活动和通知的跟踪后，你现在准备好进入下一章，在那里你将学习大量关于 GitHub Actions 和构建自动化的有趣内容。\n\
  \n# 总结\n\n恭喜你完成了 *第 8 章*！到现在为止，你已经扩展了工具箱，能够更轻松、更精细地管理你的单页作品集网站项目。让我们回顾一下你现在掌握的强大技能和工具。\n\
  \n\n\n在一些高级 Git 命令的帮助下，例如 `alias` 和 `rebase`，你学会了如何简化你的 Git 工作流程、追踪单个文件更改的详细历史记录，以及重新组织提交以获得更整洁的项目历史。然后，你发现了\
  \ Sourcetree 如何让复杂的历史记录一目了然。此外，你通过 Codespaces、Desktop 和 DevHub 提升了技能，将 GitHub 转变为友好的桌面界面并管理你的通知。\n\
  \n全章中，你不仅获得了新技能，还学会了这些工具如何使你的协作更有效、项目管理更高效。你现在已准备好自信地处理开发任务，知道自己拥有合适的工具来帮助你。\n\n\
  在下一章中，你将了解 GitHub Actions 如何自动化你的工作，如何设置称为工作流的自动化序列、设置自动运行的测试，以及排查工作流并对其进行微调以达到最佳性能。\n\
  \n*第 9 章* 全部关于让你的项目更智能地工作，而不是更辛苦。准备好通过自动化实现更高效、无压力的开发体验吧！\n\n## 测验\n\n回答以下问题：\n\n\
  1. `git config` 的主要用途是什么？\n\n    1. 修改项目的设置\n\n    2. 在 Git 中配置用户信息\n\n    3. 创建新分支\n\
  \n    4. 合并两个分支\n\n    *答案*: B. 在 Git 中配置用户信息\n\n2. GitHub Desktop 是一个允许用户通过图形界面管理\
  \ Git 仓库的应用程序。\n\n    1. 真\n\n    2. 假\n\n    *答案*: A. 真\n\n3. 什么允许你直接在 GitHub 界面中创建、查看和编辑文件？\n\
  \n    *答案*: GitHub Codespaces\n\n4. 使用 Visual Studio Code 与 Git 的目的是什么？\n\n    *答案*:\
  \ Visual Studio Code 与 Git 集成，允许用户直接从编辑器管理 Git 操作、查看更改并进行提交。\n\n5. Sourcetree 用途是什么？\n\
  \n    1. 跟踪项目问题\n\n    2. 可视化管理 Git 仓库\n\n    3. 自动化代码测试\n\n    4. 基于云的开发\n\n  \
  \  *答案*: B. 可视化管理 Git 仓库\n\n6. DevHub Notifications 是用于管理 GitHub 上通知和活动的工具。\n\n\
  \    1. 真\n\n    2. 假\n\n    *答案*: A. 真\n\n7. `git blame` 用途是什么？\n\n    1. 查找最后修改代码行的人\n\
  \n    2. 删除分支\n\n    3. 重命名仓库中的文件\n\n    4. 克隆仓库\n\n    *答案*: A. 查找最后修改代码行的人\n\n\
  8. `git ________ -fd` 命令用于通过删除未跟踪文件来清理工作目录。\n\n    *答案*: `clean`\n\n9. `git stash`\
  \ 命令用于永久删除分支中的更改。\n\n    1. 真\n\n    2. 假\n\n    *答案*: B. 假（它暂时存储更改）\n\n10. `git\
  \ fetch --all` 的目的是什么？\n\n    *答案*: 它从远程仓库获取所有分支，确保你拥有所有最新更新。\n\n## 挑战 – 为 Space\
  \ Explorer 打造游戏结束画面\n\n在本章中，你已解锁了 Git 和 GitHub 工具的新技能。让我们通过为你的 *Space Explorer*\
  \ 游戏创建一个引人注目的 **Game Over** 画面来检验这些技能，并配上酷炫的背景。\n\n![图 8.28 – Space Explorer 游戏结束画面](img/B21847_08_29.jpg)\n\
  \n图 8.28 – Space Explorer 游戏结束画面\n\n你的任务是使用新的 Git 命令和工具开发一个 **Game Over** 画面，并将独特的背景集成到此画面中。\n\
  \n你可以从这里下载代码：[`github.com/PacktPublishing/GitHub-for-Next-Generation-Coders/tree/main/Space%20Explorer%20Game/Game%20Obsticles%20-%20Game%20Over%20screen`](https://github.com/PacktPublishing/GitHub-for-Next-Generation-Coders/tree/main/Space%20Explorer%20Game/Game%20Obsticles%20-%20Game%20Over%20screen)。\n\
  \n*以下是你可以完成 **你的任务** 的方法：*\n\n1. **分支创建**：使用 GitHub Desktop 或 Sourcetree，创建一个名为\
  \ **feature-game-over-screen** 的新分支。此可视化工具简化了分支流程。\n\n2. **设计画面**：设计一个带有酷炫太空主题背景的\
  \ **Game Over** 画面。发挥创意设计——这是玩家冒险后的最后所见！\n\n3. **实现画面**：\n\n    1. 在项目中编码新画面。确保游戏结束时显示。\n\
  \n    2. 在工作时尝试使用 Codespaces 和 Git 功能提交更改。\n\n4. **使用高级 Git 命令**：\n\n    1. 如果你犯了错误或想尝试不同的设计，使用\
  \ `git revert` 或 `git reset` 撤销更改。\n\n    2. 通过将分支推送到 GitHub 分享你的进度。\n\n5. **拉取请求和评审**：\n\
  \n    1. 使用 GitHub Codespaces 或 GitHub Desktop 为你的新分支打开拉取请求。\n\n    2. 请同伴提供反馈或自行评审更改，使用\
  \ GitHub 的拉取请求功能。\n\n6. **合并你的更改**：一旦你对 **Game Over** 画面满意，就将分支合并到主项目中。使用你学到的技能处理可能出现的任何合并冲突。\n\
  \n7. **反思和记录**：在 README 文件或文档中写下你的经验。使用这些新工具和命令如何提升了你的开发流程？\n"
- '# 第 4 部分：高级 GitHub 功能


  在这里，你将学习如何使用 GitHub Actions 自动化工作流、通过高级安全措施保护项目，以及有效地参与开源社区。每一章都提供了让你的 GitHub 项目更具动态性、安全性和社区导向的见解。


  本部分包含以下章节：


  * *第 9 章*，*利用 GitHub Actions 进行自动化*


  * *第 10 章*，*增强 GitHub 安全措施*


  * *第 11 章*，*参与开源社区*

