- "## 1 介绍版本控制和 GitHub\n\n\n\n\nThis first chapter is like a launching pad for your\
  \ exciting GitHub journey! We’re going to introduce you to GitHub and version control,\
  \ which is a superpower for coders. We’ll guide you through step-by-step processes,\
  \ providing practical tips and easy-to-follow examples.\n\nFirst off, we’ll help\
  \ you understand the core of GitHub and why version control is so awesome. Think\
  \ of version control like a magic time-traveling book that lets you see and undo\
  \ all your changes, keeping your code organized and safe.\n\nNext, we’ll dive into\
  \ the fun stuff! We’ll show you how to create your special space on GitHub, called\
  \ a `repository`. Think of it as your treasure chest where you keep all your coding\
  \ gems. You’ll learn how to add your code, make changes to it, and share it with\
  \ others.\n\nWe’ll also explore how GitHub can be a fantastic tool for working together\
  \ with friends or even with coders from around the world! It’s like having a coding\
  \ party where everyone brings their own unique ideas and creations.\n\nHere’s a\
  \ sneak peek of what we’ll cover in this chapter:\n\n*   Exploring the benefits\
  \ of GitHub to young coders\n*   Understanding version control in GitHub – keeping\
  \ track of your changes\n*   Getting started with Git and GitHub\n*   Setting up\
  \ your GitHub account and account types\n*   Navigating the GitHub interface – a\
  \ guide for beginners\n\nBy the end of this chapter, you’ll feel at home in the\
  \ GitHub universe, understand the magic of version control, and be ready to start\
  \ your own coding adventures and share them with the world. Let’s code together\
  \ and have a blast!\n\n# Exploring the benefits of GitHub to young coders\n\nHave\
  \ you been coding for a little while and are looking to improve your skills further?\
  \ Whatever stage you’re at, GitHub is a platform you’ll want to get familiar with.\n\
  \nLet’s explore why:\n\n*   **Learning from the community**: Have you ever found\
  \ yourself stuck on a coding problem, not sure how to proceed? On GitHub, you can\
  \ find countless projects and code snippets. Seeing how others tackle problems can\
  \ provide a new perspective and help solve your own coding dilemmas.\n*   **Collaboration**:\
  \ Ever worked on a group project and found it hard to keep track of who did what?\
  \ GitHub makes teamwork smoother with its collaboration features. You can work with\
  \ others easily, track changes, and combine everyone’s work seamlessly.\n*   **Building\
  \ a portfolio**: Do you dream of landing a cool job in tech? GitHub can act as your\
  \ portfolio, showcasing your projects to potential employers. It’s like your public\
  \ coding diary, demonstrating your skills and the journey of your progress.\n* \
  \  **Version control**: Ever made a change to your code and realized you liked it\
  \ better the way it was the day before? Git’s version control allows you to go back\
  \ in time and compare changes so you never lose your work.\n*   **Receiving feedback**:\
  \ Want to get better at coding? GitHub allows you to build up the community, which\
  \ can provide valuable feedback on your projects. Repository and/or community members\
  \ can point out bugs, suggest improvements, and help you become a better coder.\n\
  *   **Access to resources**: Looking for a library or a tool to make your coding\
  \ project easier? GitHub hosts a great number of resources, many of which are free\
  \ to use.\n*   **Integration with tools**: Do you use other coding tools? GitHub\
  \ integrates with many tools and platforms that can improve your workflow, making\
  \ your coding process more efficient and enjoyable.\n\nGitHub is not just a place\
  \ to store your code. It’s a platform where you can learn, collaborate, showcase\
  \ your work, and grow as a coder. So, why wait? Dive into GitHub and start exploring\
  \ the endless possibilities it offers to young coders like you!\n\nIn the next section,\
  \ we’re going to learn how GitHub helps you keep track of every change you make\
  \ to your projects, just like keeping a detailed diary of your work. We’ll look\
  \ at different ways to manage changes with version control systems, understand the\
  \ concepts of deltas and snapshots, and explore how distributed version control\
  \ systems keep teams in sync. It’s all about making sure you can always see what’s\
  \ been done and by whom, making teamwork smoother and more organized.\n\n# Understanding\
  \ version control in GitHub – keeping track of your changes\n\nHave you ever stopped\
  \ to ask yourself how developers manage the ever-evolving versions of their software?\
  \ Think of it like you’re writing a story. You write the first draft, then the second,\
  \ and so on. Each draft is unique, with its own set of changes, yet all of them\
  \ are interconnected. Now, what if you wanted to go back to a particular draft to\
  \ revisit some ideas, or share your drafts with fellow writers for a collaborative\
  \ masterpiece? This is where version control steps in as your time-traveling companion\
  \ in the digital domain!\n\nIn coding, **version control systems** (`VCSs`) are\
  \ like magical journals that keep a record of every change made to a project. They\
  \ allow developers to travel back in time to any version of their project, compare\
  \ different versions, and even merge changes made by different people. It’s like\
  \ having a superpower that lets you not only undo mistakes but also collaborate\
  \ without a problem.\n\nGitHub is the place where developers come together to share\
  \ and collaborate on projects. GitHub is built on top of `Git`, a popular `VCS`\
  \ that we will explain later in the *Getting started with Git and GitHub* section,\
  \ making it a robust platform for team-based projects. It’s like a massive online\
  \ library, but instead of books, it houses code. Every project on GitHub lives in\
  \ its own `repository` (or `repo` for short), a nicely ordered digital shelf where\
  \ all versions of a project are stored and organized.\n\n### Curious about how this\
  \ all comes together?\n\nLet’s say you and your friends decide to build a portfolio\
  \ website. Each one of you has unique ideas to make the website cooler. Alice suggests\
  \ adding a top menu, Bob wants a gallery, and Charlie is keen on a blog. You all\
  \ set out to work on your individual parts, but how do you bring it all together\
  \ without stepping on each other’s toes?\n\n## Here’s where “Git” version control\
  \ and GitHub shine together!\n\nEach one of you creates a `branch` from the `main\
  \ branch` (a `branch` is a separate workspace where you can make changes and try\
  \ out new ideas without affecting the main version of your project) and works on\
  \ your ideas, and once you’re satisfied, you propose the changes back to the `main\
  \ branch` through a `pull request`. Your friends can review the changes, discuss\
  \ them, and even suggest tweaks. Once everything looks good, the changes are merged\
  \ into the `main branch`. Your collaborative portfolio website now has a gallery,\
  \ a top menu, and a blog section, all built together without any problems.\n\nAnd\
  \ guess what? All the discussions, changes, and versions are nicely recorded, thanks\
  \ to `Git`’s version control magic and GitHub’s collaborative platform. So, if someday\
  \ you decide that the blog should include news, you know exactly where to go and\
  \ how to make it happen without disrupting the rest of your website!\n\nThis journey\
  \ of creative collaboration and organized evolution is what makes GitHub very popular\
  \ among developers. It’s not just a platform; it’s a community where ideas grow,\
  \ mix, and come to life, one version at a time.\n\n## Understanding the types of\
  \ VCS\n\n### What are centralized version control systems?\n\nPicture a train station\
  \ at the heart of a large city full of activities. This station is no ordinary one;\
  \ it’s the nerve center where all the city’s data trains come and go. Now, what\
  \ if this city represented a software project, and the train station, a **centralized\
  \ version control system** (`CVCS`)?\n\nInteresting, isn’t it?\n\n\n\n# 集中式版本控制系统\
  \ (CVCS)\n\n一个 `CVCS` 就像这样一个中央车站，所有对项目的更改都存储并管理于此。在这个数字城市中，开发者是数据列车的司机，每列车都携带一组独特的更改或更新。他们都在中央车站会合，存放自己的更新，并取走他人所做的更改。\n\
  \n听起来很井然有序，对吧？但让我们再深入一点。\n\n你是一名开发者司机。每天早上，你驶入中央车站，取走项目的最新版本，然后在一天中进行更改。一旦满意，你就将数据列车驶回中央车站存放你的更新。这个循环不断进行，使项目不断演进，同时保持一种秩序感。\n\
  \n然而，`CVCS` 也有其弊端。想象一个阳光明媚的日子，我们的中央车站人声鼎沸。突然，一场风暴袭来，车站发生了停电，如图 1.1 所示。恐慌席卷城市，因为承载所有项目数据的核心现在无法访问。开发者带着他们的更新被困住，无法共享或访问他人的更改。\n\
  \n![图 1.1 – 一个 `CVCS` 作为中央车站](img/B21847_01_01.jpg)\n\n图 1.1 – 一个 `CVCS` 作为中央车站\n\
  \n此场景说明了 `CVCS` 的一个显著特征（也是一个潜在缺点）——其单点故障。所有内容都存储在中央服务器上。如果它宕机或出现问题，更新的流动就会停止，导致项目产生连锁反应。\n\
  \n现在，让我们把注意力转向另一个方面。还记得每个司机如何从中央车站取走项目的最新版本吗？这说明了 `CVCS` 的集中化特性。每一条数据、每一次更新和每个版本都存放在一个中央位置。\n\
  \n使用 `CVCS` 有一种简洁有序的感觉。它就像有一个纪律严明、集中的政府来管理数据流动。它更容易管理、控制访问，并确保每个人都在同一页面上。然而，这种集中化特性也带来了一些挑战，例如单点故障的潜在风险以及对中央服务器网络访问的依赖。\n\
  \n## 这对编码如何运作？\n\n在编码中，`CVCS` 充当一个中央仓库，所有代码及其版本都存储其中。开发者从该中央服务器 `check out (pull)`\
  \ 代码的最新版本，在本地机器上工作以进行更改，然后 `check in (push)` 将其更新返回到中央仓库。这样，每个人都可以访问代码的最新版本，并且所有更改都集中跟踪。\n\
  \n在此设置中，`CVCS` 记录了所有更改、谁做的以及何时做的。这是在团队环境中管理代码的有序方式。然而，它也有其缺点。例如，如果中央服务器宕机，开发者就无法共享或从仓库访问更新。此外，每次操作都依赖于中央服务器，如果网络缓慢或团队分布在不同地点，可能会减慢流程。你可以从图\
  \ 1.2 中了解有关 `CVCS` 的情况：\n\n![图 1.2 – `CVCS` 流程](img/B21847_01_02.jpg)\n\n图 1.2 –\
  \ `CVCS` 流程\n\n简单性和集中控制使 `CVCS` 易于管理并确保代码库的一致性，但代价是潜在的瓶颈和单点故障。\n\n## 版本控制中的增量是什么？\n\
  \n想象你是一名艺术家，每天都在你的画作上添加新的一层，用新鲜的细节、色彩和表现力来增强它。每一层只修改画作的一部分，留下其他部分不变。随着时间的推移，你的艺术作品成为这些层的生动集合，每一层都为画作的整体故事做出了贡献：\n\
  \n![图 1.3 – 画作的层次](img/B21847_01_03.jpg)\n\n图 1.3 – 画作的层次\n\n在版本控制的世界中，`delta` 的工作原理类似。它是一组应用于文件或一组文件的更改或更新。`VCSs`\
  \ 通常不会在每次更改后保存文件的完整新副本，而是将这些更改保存为 `deltas`。这意味着它们只记录发生了什么变化。\n\n例如，假设你正在编写一本数字书籍。每天，你都会输入新想法或编辑之前写的内容。你的\
  \ `VCS` 跟踪每一次编辑，无论是添加段落还是修正拼写错误。这些更改存储为 `deltas`，使系统能够记录你的书籍随时间演变的过程，而无需在每次更改时重新保存整个文档。\n\
  \n当你需要查看文档的早期版本时，你的 `VCS` 使用这些 `deltas` 来重建它。这就像能够穿越时空，查看文档在任何给定日期时的样子。\n\n## 增量在编码中如何工作？\n\
  \n在编码中，`deltas` 指的是文件或文件之间两个版本之间的差异或更改。这些对版本控制至关重要，因为它们有助于在不存储每个阶段的完整文件副本的情况下跟踪项目的演变。\n\
  \n当你或他人对代码进行更改时，`VCS` 会计算出 `delta`——添加或删除了什么——并将其保存。这就像所有编辑的详细记录，使处理更改变得更易于管理且更高效。\n\
  \n这些 `deltas` 也称为 `diffs`，对团队合作至关重要。它们让每个人都能清楚地看到发生了什么变化、谁做的以及何时做的。通过以这种方式跟踪更改，`VCS`\
  \ 有助于管理项目的进展，并确保即使许多人协作并持续更改，也不会丢失任何内容。\n\n![图 1.4 – 随时间推移的 `deltas` 提交](img/B21847_01_04.jpg)\n\
  \n图 1.4 – 随时间推移的 `deltas` 提交\n\n该图表以可视化方式展示了项目中随时间推移对文件进行的更改，例如对你的单页作品集网站的更新。每一行代表一个不同的文件，标记为\
  \ `File A`、`File B` 和 `File C`。列代表你项目的不同版本，从 `Version 1` 到 `Version 5`：\n\n* 在 `Version\
  \ 1` 中，三个文件都是原始版本\n* 到 `Version 2` 时，`File A` 和 `File C` 已被更改（`Δ1`），而 `File B` 仍为原始版本\n\
  * 在 `Version 3` 中，`File A` 自 `Version 2` 以来未更改，`File B` 未被更改，而 `File C` 已从其原始版本更新（`Δ1`）\n\
  * 进入 `Version 4`，`File A` 有另一个更改（`Δ2`），`File B` 已被更改（`Δ1`），而 `File C` 与 `Version\
  \ 3` 相同\n* 最后，在 `Version 5` 中，`File A` 与 `Version 4` 相同，`File B` 有另一个新更改（`Δ2`），而\
  \ `File C` 还有另一次更新（`Δ3`）\n\n“Δ”符号代表更改或“`delta`”。因此，`File A` 上的 `Δ1` 表示对 `File A`\
  \ 原始版本的第一次更改集，而 `File A` 上的 `Δ2` 表示第二次更改集。\n\n这种跟踪方式让你可以看到每个文件的更新历史，通过比较这些版本，你可以了解你的网站随时间如何演变。这有点像查看你的网站的照片相册，展示每个部分从一个版本到下一个版本是如何变化的快照。\n\
  \n# 理解分布式版本控制系统\n\n一个 `distributed version control system` (`DVCS`) 例如 `Git` 为开发者在本地机器上提供完整的项目历史记录。这使他们能够独立于代码工作，修复错误或添加功能，而不必担心破坏主项目。\n\
  \n现在，设想一个开发者 Ada 正在处理一个棘手错误的场景。她克隆仓库，在 `DVCS` 中创建自己的版本。凭借计算机上的项目完整副本，她对代码进行工作、测试解决方案并解决错误。在整个过程中，她与其他开发者的工作隔离，并且不会影响他们的进度。\n\
  \n\n\n当 Ada 对自己的解决方案充满信心时，她会将其分享到中央仓库。在 `GitHub` 的上下文中，她会创建一个 `pull request`，这是一份详尽记录的变更摘要，供同事审阅。他们评估她的贡献并讨论可能的调整，一旦大家达成一致，变更就会合并到主项目仓库中。\n\
  \n如果 Ada 直接与其他开发者使用 `Git` 而不使用 `GitHub` 协作，她可以通过直接 `push` 到共享仓库的方式分享自己的变更。这仍然可以实现协作和代码审查，但缺少了\
  \ `pull request` 的结构化工作流程。\n\n使用 `DVCS` 时，每位开发者的输入，无论是 bug 修复、功能还是优化，都是宝贵的贡献，通过协作进行分享、审查和改进，推动项目借助团队的综合知识和技能迈向新颖且令人兴奋的可能性。\n\
  \n在使用 `Git` 与 `GitHub` 的上下文中，你兼得两者之长：`DVCS` 的去中心化能力，加上使贡献管理更轻松、更结构化的协作工具，类似于 `CVCS`\
  \ 的某些功能，但具有更强的灵活性和独立性。\n\n*图 1.5* 显示了 `DVCS` 的表示：\n\n![图 1.5 – 一个 DVCS](img/B21847_01_05.jpg)\n\
  \n图 1.5 – 一个 DVCS\n\n在 `DVCS` 中，你保存的变更就像快照，或像你随时间所做一切变更的图像。\n\n## 版本控制中的快照是什么？\n\
  \n`Snapshots` 就像照片，在特定时刻捕捉项目的状态。每个快照都保存着代码在当时样子的图像。\n\n那么，这种魔力是如何发生的？每当你达到一个里程碑，无论多么微小，你都可以对代码进行快照。在\
  \ `Git` 中，这被称为 `commit`。每个 `commit` 都是一个快照，是项目开发时间线上的一个里程碑。\n\n随着时间的推移，你的代码会增长，但有时会出现\
  \ bug。这正是快照的强大之处发挥作用的地方。你可以回到过去，重新访问每个快照，以弄清 bug 何时以及如何进入代码。\n\n快照允许你将当前代码与过去版本进行比较，帮助你了解代码的演变过程。如果必要，你甚至可以在一切运行顺畅时回滚到之前的快照。\n\
  \n这些快照并非孤立的；它们按时间顺序连接成一条链，每个快照都导向下一个。它们讲述了项目从开始到现在的故事。\n\n*图 1.6* 说明了一组文件如何随着时间在不同项目版本中发生变化，例如你的一页式作品集网站的更新：\n\
  \n*   `File A` 在 `Version 1` 中没有任何变更开始。在 `Version 2` 中，它有一组变更（记为 `A1`），在 `Version\
  \ 3` 中保持不变。然后，在 `Version 4` 中，`File A` 出现了另一组变更（`A2`），并延续到 `Version 5`。\n*   `File\
  \ B` 在 `Versions 1`、`2` 和 `3` 中开始时未变更，但在 `Version 4` 中有一组变更（`B1`）。这些变更保留在 `Version\
  \ 4` 中。但到 `Version 5` 时，`File B` 有一组新的变更（`B2`），该变更在 `Version 5` 中再次更新（`B2`）。\n*\
  \   `File C` 在 `Version 2` 中有第一组变更（`C1`）。在 `Version 3` 中，它有一组新的变更（`C2`），在 `Version\
  \ 4` 中保持不变。最后，在 `Version 5` 中，`File C` 有另一组新的变更（`C3`）。\n\n这里的模式显示，每个文件可以在不同版本中独立更新。例如，`File\
  \ C` 在除 `Version 4` 外的每个版本中都被更新，而 `File B` 直到 `Version 4` 才发生变化。这样，你可以追踪哪些文件在何时被更新，保持项目每个部分随着成长和改进的清晰历史。这就像为网站的每个部分保留一本日记，在变更发生的日期记录下每次变更。\n\
  \n![图 1.6 – 随时间推移的签入](img/B21847_01_06.jpg)\n\n图 1.6 – 随时间推移的签入\n\n在版本控制中进行快照，就像捕捉项目的当前状态。如果你之后做出变更，会拍摄新的快照，保留变更的同时保持之前的快照完整。\n\
  \n现在我们已经介绍了版本控制的基础知识以及它如何帮助跟踪你的变更，让我们继续前进。在下一节中，我们将把这些概念付诸实践，展示如何实际应用。你将学习如何在机器上设置\
  \ `Git`、开始在 `GitHub` 上管理项目，并有效地与其他人协作。这份逐步指南将帮助你在编码项目中充分利用这些强大的工具。\n\n## 开始使用 Git\
  \ 和 GitHub\n\n那么，什么是 `Git`？\n\n想象一个充满活力的数字城市，代码作为基础，版本作为重要的参考点。在这个城市里，`Git` 充当你可靠的伴侣，一本神秘的日记，记录你编码冒险的每一步，无论是构建、修订，还是偶尔删除代码结构：\n\
  \n![图 1.7 – Git 作为一个充满活力的数字城市](img/B21847_01_07.jpg)\n\n图 1.7 – Git 作为一个充满活力的数字城市\n\
  \n*现在，为什么开发者需要这样的记录？*\n\n想象你在制作一件数字雕塑，添加部件时，突然另一个部件掉了下来！当你意识到昨天的工作现在受损时，恐慌随之而来。这正是\
  \ `Git` 如同时光旅行机器般介入的地方。只需一个迅速的动作，`Git` 就把时间倒转，你的工作得以恢复！\n\n*GitHub 在这段旅程中扮演什么角色？*\n\
  \n现在，让我们探究 `GitHub` 的生态系统，这是一个充满活力的都市，来自数字领域各处的开发者在此相聚（*图 1.8*）。但是什么让 `GitHub` 不仅仅是一个聚会点？\n\
  \n![图 1.8 – GitHub 作为一个繁忙的都市](img/B21847_01_08.jpg)\n\n图 1.8 – GitHub 作为一个繁忙的都市\n\
  \n把 `GitHub` 想象成一座巨大的图书馆，`Git` 是伟大的图书管理员（*图 1.9*）。每位进入的开发者都会获得无限的书架，用来存放他们的代码书籍。每本书，即一个仓库，都保存着一个项目的故事，由\
  \ `Git` 精确编年。\n\n![图 1.9 – GitHub 作为一座巨大的图书馆](img/B21847_01_09.jpg)\n\n图 1.9 – GitHub\
  \ 作为一座巨大的图书馆\n\n但与世间任何普通图书馆不同，这座图书馆靠协作成长。你不仅仅是沉默的订阅者，你是社区的一部分，一章一章、一行一行地书写创新的史诗。\n\
  \n现在，当你写下你的故事时，你可能会偶然发现另一位作者写的一章，激发了新的想法。怀着兴奋之情，你决定在此基础上构建。在 `GitHub` 中，这种协作分支的行为是被鼓励的。你复制该章节，添加自己的部分，并提议将其与原文合并。另一位作者感谢你的贡献，接受了它，故事变得更加丰富。\n\
  \n但 `GitHub` 不仅仅关乎代码制作的严肃业务。它是一个平台，你可以在此与他人协作、为各种项目做出贡献，并从其他开发者的作品中学习。你的个人资料充当作品集，展示你的项目、贡献和编码技能，使你在开发者社区中更容易联系和协作。\n\
  \n在下一节中，你将学习如何设置你的 `GitHub` 账户，以便在线开始管理项目。我们将介绍两种类型的账户：\n\n*   `User account`：这是你的个人账户，你可以在此管理自己的项目、为他人的项目做出贡献等。把它想象成你在\
  \ `GitHub` 上的个人工作区。\n*   `Organization accounts`：如果你与团队一起工作，这种类型的账户会很有用。它就像团队共享的空间，每个人可以在此共同协作项目。\n\
  \n\n\n你将了解这些账户有何不同，以及如何使用每种类型来保持项目井然有序并让合适的人能够访问。这项知识将帮助你充分利用 GitHub，无论你是独自工作还是作为团队的一部分。\n\
  \n# 设置你的 GitHub 账户和账户类型\n\n现在是时候为你设置第一个 GitHub 账户了。创建 GitHub 账户非常简单。你可以按照以下简单步骤设置免费账户：\n\
  1. 前往 [`github.com/`](https://github.com/) 并点击右上角的 **注册** 按钮：\n![图 1.10 – GitHub\
  \ 注册](img/B21847_01_10.jpg) \n图 1.10 – GitHub 注册\n1. 你将被重定向到以下页面，在此需要输入你的电子邮件地址和密码：\n\
  ![图 1.11 – GitHub 账户创建](img/B21847_01_11.jpg) \n图 1.11 – GitHub 账户创建\n1. 你将在创建 GitHub\
  \ 账户时提供的地址收到一封验证邮件。\n2. 点击链接完成验证流程并创建 GitHub 账户。\n\n如果你已有账户，请导航至 [`github.com/`](https://github.com/)\
  \ 并点击右上角的 **登录** 按钮：\n![图 1.12 – GitHub 登录](img/B21847_01_12.jpg) \n图 1.12 – GitHub\
  \ 登录\n\n在我们深入 GitHub 仓库之旅之前，让我们先聊聊不同类型的 GitHub 账户。\n\n## 什么是用户账户？\n\n用户账户是你自己的个人\
  \ GitHub 账户。你可以在此处理你的项目，无论是独自进行还是与少数朋友合作。以下是你可以用用户账户完成的操作：\n* **创建仓库**：你可以在个人空间构建各种项目\n\
  * **贡献：** 你可以访问其他人的仓库并帮助他们完成项目\n* **个人资料**：你拥有一个个人资料，其他人可以在此查看你的身份和工作内容，甚至可以关注你以了解你的活动动态\n\
  \n*准备好探索你的 GitHub 用户账户视图了吗？让我们 **开始吧**.*\n\n你的 GitHub 个人用户资料包含多个不同的部分，如 *图 1**.13*\
  \ 所示：\n![图 1.13 – GitHub 的用户账户概览](img/B21847_01_13.jpg) \n图 1.13 – GitHub 的用户账户概览\n\
  \n让我们详细了解这些部分：\n* **用户账户导航标签**：这些标签包含用于访问用户账户各个部分的按钮，包括 **概览**、**仓库**、**项目**、**Wiki**、**软件包**\
  \ 等：\n![图 1.14 – GitHub 的用户导航标签](img/B21847_01_14.jpg) \n图 1.14 – GitHub 的用户导航标签\n\
  * **全局导航**：你可以通过点击位于左上角的 *汉堡菜单* 图标访问全局导航菜单。该菜单提供指向基本功能的链接，如 **主页**、**问题**、**拉取请求**、**讨论**、**市场**、**通知**\
  \ 以及其他实用资源：\n![图 1.15 – GitHub 的全局导航](img/B21847_01_15.jpg) \n图 1.15 – GitHub 的全局导航\n\
  * **仓库视图**：位于 **概览** 页面中央，**仓库视图** 是你可以在 GitHub 中轻松访问和管理已置顶仓库的地方。在这里，你可以方便地组织和展示对你最重要的仓库，以便快速、轻松地访问你的关键项目和贡献：\n\
  ![图 1.16 – GitHub 的仓库视图](img/B21847_01_16.jpg) \n图 1.16 – GitHub 的仓库视图\n* **个人简介视图**：位于页面左侧，这里可以通过点击\
  \ **编辑资料** 按钮来撰写关于你的个人简介。在你的资料下方，你会找到有关你关注的用户数量和关注你的人数在 GitHub 上的统计数据。此外，你还可以展示你的成就徽章并列出你所属的组织：\n\
  ![图 1.17– GitHub 的个人简介视图](img/B21847_01_17.jpg) \n图 1.17– GitHub 的个人简介视图\n* **贡献视图**：位于页面底部，提供你在\
  \ GitHub 上所选年份内对仓库的所有贡献的宝贵见解。它展示了你的提交活动、拉取请求、打开的问题等，让你能够跟踪你在开源项目中的参与情况和开发历程。此视图有助于你可视化你在\
  \ GitHub 社区中的影响力和贡献：\n![图 1.18 – GitHub 的贡献视图](img/B21847_01_18.jpg) \n图 1.18 –\
  \ GitHub 的贡献视图\n\n## 组织账户 – 团队总部\n\n组织账户就像一栋大办公楼，整个团队或公司可以在此共同工作。它拥有更多空间和额外功能，帮助团队在多个项目上协作。以下是详细说明：\n\
  * **团队管理**：你可以创建各种团队，分配不同项目，并为成员设置特定角色\n* **多个仓库**：就像你的大楼里有几层楼，每层对应一个不同的项目\n* **更多隐私选项**：你可以拥有只有特定成员可以访问的私人房间\n\
  * **统一计费**：不必单独支付费用，所有开支统一处理，使预算更轻松\n* **专业资料**：在专业的设置中展示你的团队、项目和成就\n\n在 *图 1**.19,*\
  \ 你可以看到 GitHub 上组织账户的样子：\n![图 1.19 – GitHub 的组织视图](img/B21847_01_19.jpg) \n图 1.19\
  \ – GitHub 的组织视图\n\n现在你已经熟悉了如何设置 GitHub 账户以及可用的不同账户类型，让我们更仔细地看看如何在项目中实际使用 GitHub。接下来，我们将指导你浏览\
  \ GitHub 界面，在那里你将了解 **代码** 部分、**问题**、拉取请求等关键功能。这将帮助你了解一切所在位置以及如何使用每个功能有效地管理项目。无论你是刚开始还是希望从\
  \ GitHub 获得更多收益，本节将为你提供所需的工具，帮助你导航并充分利用 GitHub 体验。\n\n# 浏览 GitHub 界面 – 初学者指南\n\n\
  将 GitHub 想象成一个多功能工具箱，每个工具都为项目仓库中的特定任务而设计。以下是本数字工具箱中主要工具的友好介绍，例如 **代码**、**问题**、**拉取请求**、**项目**\
  \ 等。你可以在 *图 1**.20* 中看到其外观：\n![图 1.20 – GitHub 的各部分](img/B21847_01_20.jpg) \n图 1.20\
  \ – GitHub 的各部分\n\n## 那么，代码部分是关于什么的？\n\n将 **代码** 部分视为 GitHub 项目仓库的核心。你的项目就存在于此。它就像你电脑上的主文件夹，你在其中保存所有项目文件。它包含项目所需的所有代码文件、文档和资源：\n\
  ![图 1.21 – GitHub 的代码部分](img/B21847_01_21.jpg) \n图 1.21 – GitHub 的代码部分\n\n在下一章 *掌握\
  \ GitHub 核心要点* 中，我们将深入探讨 GitHub **代码** 视图的各个方面。我们还将探索如何在 GitHub 上创建和管理仓库，从而全面了解这些基本工具。\n\
  \n## 而问题又是什么？\n\n**问题** 部分是你的项目仓库的公告板。发现 bug 了？有想法？在这里发布。它就像为团队留下便签，说：“*嘿，让我们修复这个*\
  \ 或 *要不要试试这个？*” 你可以在下图中一窥此部分。\n![图 1.22 – GitHub 的问题部分](img/B21847_01_22.jpg) \n\
  图 1.22 – GitHub 的问题部分\n\n## 拉取请求 – 听起来很重要？\n\n\n\nPull 请求是你说“*我做出了很酷的东西，让我们把它加入到我们的项目中吧！*”\
  \ 的方式。就像向团队展示你的工作，并在你的代码加入派对之前征求他们的点赞：\n\n![图 1.23 – GitHub 的 PR 部分](img/B21847_01_23.jpg)\n\
  图 1.23 – GitHub 的 PR 部分\n\n## Discussions，是像会议吗？\n\n没错！**Discussions** 部分是你的项目的聊天室。这里是想法飞舞、问题被提出、协作发生的地方。它是你的\
  \ GitHub 项目的虚拟水吧：\n\n![图 1.24 – GitHub 的 Discussions 部分](img/B21847_01_24.jpg)\n\
  图 1.24 – GitHub 的 Discussions 部分\n\n## Actions，它们会替我工作吗？\n\n好吧，有点像！**Actions** 是你的自动化助手。它们处理诸如测试你的代码或更新和部署你的网站等任务，为你做重复性的工作，这样你就可以专注于有趣的事情：\n\
  \n![图 1.25 – GitHub 的 Actions 部分](img/B21847_01_25.jpg)\n图 1.25 – GitHub 的 Actions\
  \ 部分\n\n## Projects – 听起来很严肃？\n\nGitHub 的 **Projects** 部分充当管理工作的中心枢纽。在这个空间里，你可以组织任务、监控进度并分配职责。它充当你的战略规划板，确保你的项目的各个方面保持一致并按计划进行：\n\
  \n![图 1.26 – GitHub 的 Projects 部分](img/B21847_01_26.jpg)\n图 1.26 – GitHub 的 Projects\
  \ 部分\n\n## Wiki，是像维基百科吗？\n\n完全正确！你项目的 **Wiki** 部分是它的知识库。它是文档、操作指南、准则以及你关于项目所积累的所有智慧的首选之地：\n\
  \n![图 1.27 – GitHub 的 Wiki 部分](img/B21847_01_27.jpg)\n图 1.27 – GitHub 的 Wiki 部分\n\
  \n## Security 部分有什么？\n\n把 **Security** 想成你项目的保镖。它帮助你查找和修复任何安全弱点，让你的项目免受虚拟的磕碰和擦伤：\n\
  \n![图 1.28 – GitHub 的 Security 部分](img/B21847_01_28.jpg)\n图 1.28 – GitHub 的 Security\
  \ 部分\n\n## Insights，能预知未来吗？\n\n不太像，但很接近！**Insights** 部分就像一份成绩单，显示你的项目表现如何。它提供有关项目健康状况、进度和团队贡献的统计数据和图表：\n\
  \n![图 1.29 – GitHub 的 Insights 部分](img/B21847_01_29.jpg)\n图 1.29 – GitHub 的 Insights\
  \ 部分\n\n## Settings – 我可以在那里设置什么？\n\n**Settings** 部分是你的控制室。在这里，你管理协作者、设置规则并调整项目的设置。这就是你根据项目需求定制\
  \ GitHub 体验的地方：\n\n![图 1.30 – GitHub 的 Settings 部分](img/B21847_01_30.jpg)\n图 1.30\
  \ – GitHub 的 Settings 部分\n\n现在我们已经介绍了 GitHub 界面的基本导航，并探索了 Code、Issues、Pull Requests、Discussions、Actions、Projects、Wiki、Security、Insights\
  \ 和 Settings 等部分，让我们看看你学到了多少。\n\n你会找到一个 *Quiz* 部分，旨在测试你的知识并帮助巩固我们讨论的内容。这是一个有趣的方式，可以确保你在进入更高级主题之前理解关键要点。准备好测试你的技能了吗？让我们开始吧！\n\
  \n## Summary\n\n本章解释了 GitHub 如何使用版本控制，这就像一本神奇的书，让你可以看到对代码所做的所有更改，甚至在需要时撤销它们。它让一切保持安全和井然有序。然后它向你展示了如何在\
  \ GitHub 上创建自己的空间，称为 *repository*，你可以把它想象成你编程项目的宝箱。你已经学会了如何添加代码、更改它并与他人分享，就像向世界展示你的艺术作品一样。\n\
  \n接下来，本章谈到了 GitHub 在与他人协作方面的优势。它就像一个大派对，每个人都在分享他们的编程想法。这让编程变得更有趣、更具创造性。\n\n使用 GitHub\
  \ 的好处非常酷。你可以看到其他人如何解决编程问题，这可以帮助你学习新的解决方法。如果你做了更改而不喜欢，GitHub 的版本控制可以让你回到之前的状态。此外，你还可以从其他程序员那里获得建议和提示，这可以帮助你改进。\n\
  \n在下一章，你将以一种有趣的方式潜入泳池的深处！一切都与以一种好的方式弄脏双手有关，使用 Git 和 GitHub。你将学习如何在 GitHub 中使用一些强大的工具，就像学习控制你的编程宇宙的咒语一样。它将超级有趣，并且对你的编程冒险非常有用！\n\
  \n## Quiz\n\n通过以下测验问题检查你通过阅读本章获得的知识：\n\n1.  GitHub 使用什么来帮助管理和组织代码？\n\n    1.  版本控制\n\
  \n    2.  拼写检查\n\n    3.  语法校正\n\n    4.  自动格式化\n\n    *Answer*: A. 版本控制\n\n2. \
  \ 真假：GitHub 仅供专业程序员使用。\n\n    1.  真\n\n    2.  假\n\n    *Answer*: B. 假\n\n3.  填空：GitHub\
  \ 中的版本控制就像一个 \\_\\_\\_\\_\\_\\_\\_\\_\\_，让你可以看到并撤销所有更改。\n\n    *Answer*: 神奇的时光旅行书\n\
  \n4.  为什么版本控制被认为是程序员的超能力？\n\n    *Answer*: 它允许程序员轻松跟踪和还原更改，保持代码井然有序和安全。\n\n5.  以下哪一项是使用\
  \ GitHub 管理代码的关键好处？\n\n    1.  它增加文件大小\n\n    2.  它使代码安全性降低\n\n    3.  它有助于组织和跟踪更改\n\
  \n    4.  以上全部\n\n    *Answer*: C. 它有助于组织和跟踪更改\n\n6.  真假：版本控制只能跟踪文本文件的更改。\n\n  \
  \  1.  真\n\n    2.  假\n\n    *Answer*: B. 假\n\n7.  本章用来解释 GitHub 功能的类比的来源是什么？\n\n\
  \    1.  一个工具箱\n\n    2.  一本时光旅行书\n\n    3.  一本食谱书\n\n    4.  一张路线图\n\n    *Answer*:\
  \ B. 一本时光旅行书\n\n8.  填空：GitHub 是一个令人难以置信的 \\_\\_\\_\\_\\_\\_\\_\\_\\_ 和版本控制的世界。\n\
  \n    *Answer*: 编程\n\n9.  真假：GitHub 版本控制中做的每一次更改都会自动永久保存。\n\n    1.  真\n\n    2.\
  \  假\n\n    *Answer*: A. 真\n\n10.  本章中提到的使用 GitHub 版本控制的有效实用技巧是什么？\n\n     *Answer*:\
  \ 定期提交更改以有效跟踪进度\n"
- "## 2 精通 GitHub 基础\n\n在本章中，我们将深入了解 Git 和 GitHub 的基础知识。你将学习如何设置你的工作区、使用 Git 命令进行有效的项目管理以及与其他人协作。本章为你提供了克隆存储库、理解\
  \ Git 的基本命令、管理个人访问令牌以及创建有意义的 `README` 文件的知识。\n\n到本章结束时，你将能够设置项目、保存更改，并在 GitHub 上协作工作。\n\
  \n在本章中，我们将涵盖以下主要主题：\n\n*   Git 如何与 GitHub 交互 – Git 命令和 GitHub 工作流\n\n*   GitHub\
  \ 上的存储库是什么？\n\n*   准备好你的工具 – 下载和安装 Git\n\n*   创建和管理个人访问令牌\n\n## Technical requirements\n\
  \n开始之前，请确保你的机器上已安装 Git。你可以从 [`git-scm.com/`](https://git-scm.com/) 下载它。此外，创建一个名为\
  \ `ch2` 的 GitHub 文件夹，以组织与本章相关的任何文件或项目。你可以从 [`github.com/PacktPublishing/GitHub-for-Next-Generation-Coders/tree/main/Chapter%202`](https://github.com/PacktPublishing/GitHub-for-Next-Generation-Coders/tree/main/Chapter%202)\
  \ 下载本章的代码。\n\n## How Git interacts with GitHub – Git commands and GitHub workflows\n\
  \n\n\n假设你刚刚加入一个开发团队，参与一个托管在 GitHub 上的令人兴奋的新项目。你渴望立刻投入其中，但在开始之前，让我们先了解本地机器上的 Git\
  \ 命令如何与 GitHub 交互，从而使协作变得无缝且高效。\n\n## Git clone – 克隆你的第一个 GitHub 仓库（欢迎包）\n\n当你加入一个项目时，第一件事就是使用\
  \ `git clone` 命令将项目从 GitHub 复制到你的本地机器。可以把它想象成在新工作第一天收到欢迎包。这个包包含了项目已有的所有工作：\n\n![图\
  \ 2.1 – GitHub 欢迎包](img/B21847_02_01.jpg)\n\n图 2.1 – GitHub 欢迎包\n\n那么，你最终想把 GitHub\
  \ 仓库克隆到本地电脑吗？好的，让我们看看如何实现：\n\n1. 导航到你在 GitHub 上之前创建的仓库 `MyFirstRepo`，并点击绿色的 `Code`\
  \ 按钮：\n\n![图 2.2 – 克隆 GitHub 仓库](img/B21847_02_02.jpg)\n\n图 2.2 – 克隆 GitHub 仓库\n\
  \n1. 你会看到一个 URL（它应以 `.git` 结尾）。复制此 URL。\n\n2. 现在，返回你的 Git Bash 或终端，导航到你希望项目所在的文件夹，并输入以下命令，将\
  \ `URL` 替换为你刚刚复制的 URL：\n\n```\n$ git clone URL\n```\n\n3. 现在你可以在本地访问项目了。克隆过程完成后，导航到克隆过程中创建的项目文件夹：\n\
  \n```\n$ cd MyFirstRepo\n```\n\n现在，在你的本地机器上，你有三个重要区域：\n\n* `Working directory`：这就是你进行所有工作、做出更改并创建新文件的地方。\n\
  \n* `Staging area` (`index`)：一旦你对更改满意，就将它们移至暂存区，有点像把完成的草稿放入“to be reviewed”文件夹。\n\
  \n* `Local history`：当你完全满意更改时，就提交它们。这就像把最终草稿保存在“completed work”文件夹中。\n\n就是这样。你现在已经设置了\
  \ Git，完成了自我介绍，并将 GitHub 项目带到了本地机器。你准备好深入项目并开始取得进展了。\n\n## Git add – 以本地方式和 GitHub\
  \ 方式向仓库添加文件\n\n在工作目录中进行一些代码更改后，你使用 `git add` 将它们移至暂存区，就像把物品分类打包进盒子，准备运送到项目在 GitHub\
  \ 上的主存储：\n\n![图 2.3 – 向仓库添加文件](img/B21847_02_03.jpg)\n\n图 2.3 – 向仓库添加文件\n\n想象你的仓库就像一个包裹存储。现在它是空的，但你即将添加一些物品（包裹或组件）来创建有价值的内容（你的项目）。你可以直接在本地电脑上创建物品（在你的包裹中），也可以从存储（GitHub）获取一些预制物品并将其包含在你的包裹中。让我们探索这两种方法！\n\
  \n使用 `git add` 和 `touch` 命令在本地创建包裹（文件），请按以下步骤操作：\n\n1. `创建你的包裹（文件）`：\n\n1. 打开你的\
  \ Git Bash 或终端。\n\n2. 使用 `cd MyFirstRepo` 命令导航到你的仓库文件夹。\n\n3. 现在，让我们创建一个文件。输入 `touch\
  \ index.html` 来创建一个名为 `index.html` 的新文件。\n\n2. `存储你的包裹`：你的包裹（文件）已准备好，但尚未放入存储。输入\
  \ `git add index.html` 来告知 Git 你已准备好将此包裹放入存储。\n\n### 直接在 GitHub 上创建文件\n\n在本节中，我们将学习如何直接在\
  \ GitHub 上创建文件，这是一项有用的技能，可在无需本地文件管理的情况下快速向仓库添加内容。此过程简单明了，可完全通过 GitHub 网站完成，使其成为管理项目文件的一种便捷选择。\n\
  \n让我们深入每个步骤，确保你确切知道如何在 GitHub 上创建和管理文件：\n\n1. 在 GitHub 上创建你的包裹（文件）：\n\n1. 导航到你在\
  \ GitHub 上的仓库。\n\n2. 点击 `Add file` 按钮并选择 `Create new file`：\n\n![图 2.4 – 使用 GitHub\
  \ 界面添加文件](img/B21847_02_04.jpg)\n\n图 2.4 – 使用 GitHub 界面添加文件\n\n1. 给你的文件命名为 `index.html`：\n\
  \n![图 2.5 – 为文件命名](img/B21847_02_05.jpg)\n\n图 2.5 – 为文件命名\n\n1. 你可以在编辑按钮下方的文本框中在文件中写点东西，例如\
  \ `Hello, World!`。稍后，我们将开始构建你自己的作品集页面，并免费托管在 GitHub 上。\n\n![图 2.6 – 使用 GitHub 界面提交更改](img/B21847_02_06.jpg)\n\
  \n图 2.6 – 使用 GitHub 界面提交更改\n\n1. 在右上角，点击绿色的 `Commit changes` 按钮，将你的新包裹（文件）保存到社区花园。\n\
  \n2. 一个新的弹出窗口将会出现，允许你定义提交信息并提供描述：\n\n![图 2.7 – 提交信息和详细描述](img/B21847_02_07.jpg)\n\
  \n图 2.7 – 提交信息和详细描述\n\n提供有意义的提交信息和描述至关重要，因为它们使同事能够了解对仓库所做的添加及其目的。\n\n## Git commit\
  \ – 保存你的快照\n\n在本地工作时将更改发送到 GitHub 之前，`git commit` 会对暂存区的更改进行快照。它就像为盒子准备一份打包清单，详细说明其中包含的内容（*图\
  \ 2.8*）。\n\n![图 2.8 – Git commit](img/B21847_02_08.jpg)\n\n图 2.8 – Git commit\n\n\
  在此实例中，你已向 main 分支进行了提交，这可能不是理想的做法。然而，我们将学习更多关于分支和分支策略的知识，以提高你的理解。\n\n## Git push\
  \ – 将更改交付到 GitHub\n\n现在是时候与团队分享你的工作了。`git push` 是将你的更改盒子从本地机器运送到 GitHub 的送货卡车，使项目中的每个人都可以使用：\n\
  \n![图 2.9 – Git push](img/B21847_02_09.jpg)\n\n图 2.9 – Git push\n\n## Git fetch\
  \ – 更新检查器\n\n在你工作时，你的队友也在进行更改。`git fetch` 是你在不将这些更新合并到本地项目的情况下检查 GitHub 上有什么新内容的方式，就像检查包裹送达但尚未将其带入室内一样：\n\
  \n![图 2.10 – Git fetch](img/B21847_02_10.jpg)\n\n图 2.10 – Git fetch\n\n## Git pull\
  \ – 将一切整合\n\n当你准备好将 GitHub 的最新更新集成到本地机器时，`git pull` 会完成这项工作。它就像把包裹（你队友的更改）带入室内并打开它们以添加到你的项目中。它在一个命令中结合了获取最新更新并将其合并到本地项目。\n\
  \n## 网络交互\n\n在这些命令中，`git clone`、`git push`、`git fetch` 和 `git pull` 是通过网络与 GitHub\
  \ 交互的关键参与者，在你的本地机器和 GitHub 上的在线仓库之间架起桥梁。\n\n这些命令是协作工作流程的工具包，确保你和你的团队在项目上工作时保持同步，无论你身在何处。\n\
  \n你现在已经了解了 Git 如何通过各种命令和工作流程与 GitHub 交互。我们已涵盖使用 `git clone` 克隆仓库、在本地和直接在 GitHub\
  \ 上添加文件、使用 `git commit` 保存更改、使用 `git push` 推送更新，以及使用 `git fetch` 和 `git pull` 保持一切同步。这一基础有助于你有效地管理代码并与其他人协作。\n\
  \n\n\n接下来，我们将探讨 GitHub 上的仓库到底是什么。理解仓库至关重要，因为它们是你在 GitHub 上项目的核心。我们将了解如何创建、管理和使用仓库来保持项目的有序和可访问。\n\
  \n# GitHub 上的仓库是什么？\n\n想象你刚搬到一个新城市，正在寻找一个居住的地方——一个你可以称之为自己的空间，你的所有物品和回忆都将存放在那里。在开发中，仓库（或简称为\
  \ *repo*）就充当你项目的家：\n\n![图 2.11 – GitHub 仓库](img/B21847_02_11.jpg)\n\n图 2.11 – GitHub\
  \ 仓库\n\n一个 **仓库** 是项目文件和修订历史集中存放的位置。它就像一个大文件柜，所有项目相关的材料，如代码文件、文档等，都存放在其中并得到整理。每个文件在这个柜子里都有自己的抽屉，而对这些文件的每一次更改都被详细记录，就像一本记录了谁在何时更改了什么的日志簿。\n\
  \n现在，让我们深入到这个城市 *GitHub* 的社区，这里就是仓库的所在地。\n\n## GitHub 社区\n\nGitHub 就像一个拥有数百万户房屋（仓库）的大型社区。每栋房子都属于从事各种项目的不同个人或团队。有些房子活动频繁，有许多人在贡献和修改，而其他房子可能很安静，只有零星一两个人居住。\n\
  \n在这个社区里，你可以参观其他房屋，欣赏它们的设计（代码），甚至提出改进建议（贡献）。如果你特别喜欢某栋房子的设计，你可以复制它（`fork`），并拥有自己的版本进行修改。\n\
  \n## 在 GitHub 上创建和管理仓库\n\n当你决定在这个社区建造自己的房子时，你会在 GitHub 上创建一个新仓库。这里是你存放项目所有计划、设计和进展的地方。随着工作的进行，你会做出许多更改——添加新房间、粉刷墙壁或修理管道。每一次更改都会记录在你的仓库中，使你（以及其他人）能够追踪项目随时间的演变。\n\
  \n到现在为止，你应该真的很想开始创建新仓库了，所以让我们开始：\n\n1. 点击 GitHub 主页右上角的 **+** 图标。\n2. 从下拉菜单中选择 **New\
  \ repository**：\n\n![图 2.12 – 创建新仓库](img/B21847_02_12.jpg)\n\n图 2.12 – 创建新仓库\n\n\
  1. 现在你必须填写所有必填字段来创建新仓库，但首先，让我们填写仓库的所有者和名称：\n\n![图 2.13 – 配置仓库](img/B21847_02_13.jpg)\n\
  \n图 2.13 – 配置仓库\n\n1. 最后，选择许可证类型；在此例中，我们将选择 **MIT License**。然后，点击绿色的 **Create repository**\
  \ 按钮继续：\n\n![图 2.14 – 为仓库选择许可证](img/B21847_02_14.jpg)\n\n图 2.14 – 为仓库选择许可证\n\n下一个屏幕将显示新创建的仓库以及\
  \ GitHub 仓库视图，其中包括 README 文件：\n\n![图 2.15 – 仓库概览](img/B21847_02_15.jpg)\n\n图 2.15\
  \ – 仓库概览\n\n让我们分解 GitHub 仓库页面：\n\n1. **搜索栏**：这里你可以输入并查找 GitHub 上的任何内容。可以把它想象成 Google\
  \ 搜索，但仅限于 GitHub。\n2. **仓库管理**：此部分就像你项目的控制中心。你可以看到项目的不同部分，例如 issues（你想要修复的问题）、pull\
  \ requests（你或他人想要添加的更改）等。\n3. **分支**：想象你的项目就像一棵树。树的主干是 `main` 分支。但有时，你想尝试新东西而不改变主树，于是你会创建一个较小的分支。这就是\
  \ GitHub 中的分支——项目的不同版本。\n4. **文件**：此区域显示项目中的所有文件和文件夹，就像你电脑上的文件和文件夹一样！\n5. **`README`**：这是一个特殊文件，你可以在其中写关于你的项目。它就像一个欢迎牌，告诉人们你的项目是什么以及如何使用它。对于你在\
  \ GitHub 上创建的每个仓库，都非常重要地拥有一个好的 `README` 文件。\n6. **元数据**、**发布**、**包** 和 **贡献者**：\n\
  \   * **元数据**：这是 **关于** 部分，是项目简短的描述\n   * **发布**：这里可以发布项目的新的版本供他人使用\n\n这就是 GitHub\
  \ 仓库页面的简单分解。GitHub 就像你项目的巨大游乐场，这些部分帮助你组织和与他人分享你的工作！接下来，让我们看看如何下载和设置 Git。\n\n# 准备工具\
  \ – 下载和安装 Git\n\n开始使用 Git 和 GitHub 的旅程就像在开始创意项目前布置工作空间。第一步是确保你拥有合适的工具。以下是开始的方法：\n\
  \n1. 访问 Git 网站 [Git 官网](https://git-scm.com/)。\n2. 点击 **Download** 按钮，网站将自动为你的操作系统——无论是\
  \ Windows、Mac 还是 Linux——推荐合适的版本：\n\n![图 2.16 – 下载 Git](img/B21847_02_16.jpg)\n\n\
  图 2.16 – 下载 Git\n\n1. 下载完成后，打开安装程序。\n2. 按照屏幕上的说明操作。如果你是 Git 新手，通常使用默认设置是安全的：\n\n\
  ![图 2.17 – 本地安装 Git](img/B21847_02_17.jpg)\n\n图 2.17 – 本地安装 Git\n\n现在你已经安装了 Git，是时候向它介绍你自己了。Git\
  \ 需要知道你是谁，以便将你的姓名和电子邮件地址附加到你所做的更改上。\n\n但在继续之前，让我们先了解以下 Git 配置级别：\n\n* `--system`\n\
  * `--global`\n* `--local`\n\n### 了解 Git 配置级别\n\n想象你住在一栋有许多房间的大房子里，你有一个喜欢在闲逛时吹口哨的喜欢的曲调。现在，你决定每个房间都应有对这首曲调独特的回声，而且房子里的每个人都应遵循一个共同的节奏，但仅限于在房子里。最后，当你走出房子时，有一个社区节奏是该地区所有人都遵循的。\n\
  \n在 Git 中，设置配置有点像在这个场景中设定音乐规则。你可以在三个级别上设置偏好：系统、全局和本地。让我们逐一分解：\n\n#### 系统（`--system`）\n\
  \n* 这就是我们故事中的 *社区节奏*\n* 当你在系统级别设置配置时，就像为整台计算机设定规则，无论谁使用它\n\n例如，如果你设置一个系统级规则，规定 **每个文件名都应大写**，那么在这台计算机上工作于任何项目的每个人都必须遵循该规则。\n\
  \n#### 全局（`--global`）\n\n* 这就是我们故事中的 *房屋节奏*\n* 全局配置就像为自己设定规则，但它们适用于你在计算机上工作的任何地方\n\
  \n例如，假设你更喜欢某种文件命名方式，例如以日期开头。所以你设置了一个全局规则，现在，无论你在哪个房间（项目）中，都遵循此规则。\n\n#### 本地（`--local`）\n\
  \n* 这就是我们故事中的 *独特的房间回声*。\n* 本地配置是最个人的。它们仅适用于你所在的房间（项目）。\n\n例如，在某个特定项目（房间）中，你决定以特殊方式命名所有文件，例如以\
  \ **_final** 结尾。此规则仅在此项目中适用。\n\n\n\nSo, when you’re setting your preferences in\
  \ Git using `git config`, you decide which level to apply them to, much like deciding\
  \ where your musical rules apply in our story. Here’s how you might set a username\
  \ at each level:\n\n* **System**: `git config --system user.name \"Your Name\"`\n\
  * **Global**: `git config --global user.name \"Your Name\"`\n* **Local**: `git config\
  \ --local user.name \"Your Name\"`\n\nEach of these commands sets your username\
  \ for different scopes within your computer, from broad to narrow: everyone, just\
  \ you, or just you in a specific project.\n\nLet’s configure Git on your local machine:\n\
  \n1. **Start your Terminal**: Open the Git Bash on Windows or Terminal on Mac/Linux\
  \ ![公司标志 描述自动生成](img/B21847_02_icon_1.png).\n\n2. **Set your username**: Type the\
  \ following command, replacing Your Name with your actual name:\n\n```\n$ git config\
  \ --global user.name \"Your Name\"\n```\n\n3. **Set your email address**: Similarly,\
  \ set your email address with the following command, replacing you@example.com with\
  \ your actual email address:\n\n```\n$ git config --global user.email you@github.com\n\
  ```\n\n4. **View your configuration settings**: To view your current Git configuration,\
  \ you can run the following command:\n\n```\n$git config --list\n$git config --global\
  \ --list\n```\n\nFigure 2.18 shows the result of using the `git config --list` command.\
  \ This command lists all the Git configuration settings for the user. It includes\
  \ information like the `username`, `email`, and other settings that control how\
  \ Git behaves. For example, it shows the user’s name and email address, the text\
  \ editor used for writing commit messages, and various alias commands to make working\
  \ with Git easier.\n\nKey Points in the Figure:\n\n* `user.name` and `user.email`:\
  \ These lines show the configured name and email of the user, which Git uses to\
  \ label the author of each commit.\n* `core.editor`: This specifies the text editor\
  \ that Git will open when you need to write a commit message.\n* `alias.` commands:\
  \ These are shortcuts for Git commands. For instance, `alias.lol` is a shortcut\
  \ for a longer `git log` command that shows a graph of commits.\n\n![图 2.18 – Git\
  \ 配置列表](img/B21847_02_18.jpg)\n\nFigure 2.18 – Git 配置列表\n\nYou’ve now got your tools\
  \ ready by downloading and installing `git`, and configuring your local git setup.\
  \ With everything set up, you can now start managing your projects efficiently.\n\
  \nNext, let’s move on to creating and managing personal access tokens. These tokens\
  \ are important for securely accessing your GitHub account and automating certain\
  \ tasks. We’ll learn how to create these tokens and use them effectively.\n\n# Creating\
  \ and managing personal access tokens\n\n*What’s a personal access token?* Think\
  \ of a personal access token (PAT) as a special password that you can create to\
  \ access your GitHub account, without using your regular password. It’s a way to\
  \ let certain apps or tools have limited access to your account.\n\n## How to create\
  \ a PAT\n\nFollow these steps to create a PAT:\n\n1. Go to your GitHub account in\
  \ your web browser and log in. Now, click on your profile picture in the top-right\
  \ corner and select Settings from the drop-down menu:\n\n![图 2.19 – 令牌创建用户设置菜单](img/B21847_02_19.jpg)\n\
  \nFigure 2.19 – 令牌创建用户设置菜单\n\n1. On the left sidebar, click Developer settings:\n\
  \n![图 2.20 – 令牌创建：开发人员设置](img/B21847_02_20.jpg)\n\nFigure 2.20 – 令牌创建：开发人员设置\n\n\
  1. Now click on Personal access tokens.\n\n2. Select Tokens (classic):\n\n![图 2.21\
  \ – 令牌创建：经典令牌](img/B21847_02_21.jpg)\n\nFigure 2.21 – 令牌创建：经典令牌\n\nNow, let’s look\
  \ at how to make your token.\n\n1. Click on Generate new token.\n\n2. Select Generate\
  \ new token (classic):\n\n![图 2.22 – 令牌创建：生成经典令牌](img/B21847_02_22.jpg)\n\nFigure\
  \ 2.22 – 令牌创建：生成经典令牌\n\n1. Name your token something that will help you remember\
  \ what it’s for, such as `token-for-my-app`.\n\n2. Choose the permissions or scopes\
  \ you want this token to have. For example, to let it access your repositories,\
  \ check `repo`.\n\n3. Select for how many days you want your token to be valid:\n\
  \n![图 2.23 – 配置 PAT](img/B21847_02_23.jpg)\n\nFigure 2.23 – 配置 PAT\n\n1. Click on\
  \ Generate token at the bottom of the page:\n\n![图 2.24 – 生成 PAT](img/B21847_02_24.jpg)\n\
  \nFigure 2.24 – 生成 PAT\n\n## Keeping your token safe\n\nYou’ll see your new token\
  \ now. Make sure to copy it and keep it somewhere safe, because you won’t be able\
  \ to see it again! If you lose it or think someone else might have seen it, you\
  \ can come back here to make a new one or delete the old one.\n\n## Using your token\
  \ with Git\n\nNow that you have your token, you can use it to log in to GitHub from\
  \ Git on your computer. Open your terminal on your computer. You’ll use a command\
  \ to tell Git to use this token to log in to GitHub:\n\n1. Type in this command\
  \ to configure Git to use your GitHub token: `git remote set-url origin https://YOUR-TOKEN@github.com/username/repo.git`.\n\
  \n2. Replace `YOUR-TOKEN` with the token you just made, `username` with your GitHub\
  \ username, and `repo` with the name of your repository:\n\n![图 2.25 – 配置本地 Git\
  \ 使用你的 PAT](img/B21847_02_25.jpg)\n\nFigure 2.25 – 配置本地 Git 使用你的 PAT\n\nNow you\
  \ can use Git to push or pull changes to and from GitHub without needing to type\
  \ in your GitHub password each time.\n\n## Why a good README file is like a welcoming\
  \ front door on GitHub\n\nWhen you create a new repository on GitHub for your one-page\
  \ portfolio website, think of the README file as the front door to your project.\
  \ It’s the first thing visitors see, and it can make a big difference in how people\
  \ perceive and interact with your project. Here’s why it’s so important.\n\n###\
  \ The README file – your project’s introduction\n\nJust like the front page of your\
  \ website gives the first impression to your guests, your README file is the first\
  \ thing people see when they visit your GitHub repository.\n\nA well-written README\
  \ file is inviting and informative, making visitors more likely to explore your\
  \ project and understand what it’s all about:\n\n![图 2.26 – 示例的良好 README 文件](img/B21847_02_26.jpg)\n\
  \nFigure 2.26 – 示例的良好 README 文件\n\n### Explaining what your project is\n\nImagine\
  \ a friend is visiting your GitHub project. The README file should answer their\
  \ basic questions, such as *What is this project about?* and *What does this website\
  \ do?*\n\nIt’s like having a sign on your front door that says, “Welcome to my portfolio\
  \ website project!”\n\n### How to get started\n\nThe README file can provide instructions\
  \ on how to view or use your portfolio website. It’s like giving your friend a quick\
  \ tour of your website and showing them where everything is.\n\nIt might include\
  \ steps such as how to open the website, any special features they should check\
  \ out, or how to navigate through your project files.\n\n### You should encourage\
  \ collaboration!\n\nIf you want others to help you with your project, a good README\
  \ file is crucial. It’s like inviting friends over and giving them a guide on how\
  \ they can help you decorate or improve your website.\n\nIt tells potential collaborators\
  \ how they can contribute, what kind of help you’re looking for, and any important\
  \ guidelines they should follow.\n\n### Can I show my project’s status?\n\nA README\
  \ file can also include information such as how far along your project is (is it\
  \ just starting, halfway done, or nearly complete?). It’s like telling your friends\
  \ how much of the website is finished and what parts are still under construction.\n\
  \n### Tips for a great README file\n\n\n\n一些制作优秀 README 文件的建议如下：\n\n* **保持简洁清晰**：使用通俗易懂的语言并简明扼要，就像向一个对建网站一无所知的好友解释一样。\n\
  * **定期更新**：随着项目的演进，保持 README 文件的更新。就像保持你的前廊干净整洁、令人[content]\n一些制作优秀 README 文件的建议如下：\n\
  \n* **保持简洁清晰**：使用通俗易懂的语言并简明扼要，就像向一个对建网站一无所知的好友解释一样。\n* **定期更新**：随着项目的演进，保持 README\
  \ 文件的更新。就像保持你的前廊干净整洁、令人欢迎一样。\n* **必要时使用视觉元素**：有时，一张图片或截图可以帮助更好地解释事物。\n\nGitHub 上一份良好的\
  \ README 文件就是你项目的问候。它为你的项目定下基调，可能决定了别人只是路过，还是停下来、进入，甚至留下帮忙。\n\n以下是我们将为第一个仓库使用的 Markdown，以开始制作一份良好的\
  \ README 文件：\n\n```markdown\n# My First Repo\n```\n\n在此处添加你项目的简短描述。说明它做什么以及为什么有用。\n\
  \n```markdown\n## Table of Contents\n- Project Name\n  - Table of Contents\n  -\
  \ Introduction\n  - Features\n  - Getting Started\n    - Prerequisites\n    - Installation\n\
  \  - Usage\n  - Contributing\n  - License\n  - Acknowledgments\n## Introduction\n\
  ```\n\n提供你项目的整体概述。它解决了什么问题？为什么有价值？在此处包含任何相关的背景信息。\n\n```markdown\n## Features\n\
  ```\n\n列出你项目的关键特性。你可以使用项目符号以提高清晰度：\n\n```markdown\n- Feature 1\n- Feature 2\n- Feature\
  \ 3\n## Getting Started\n```\n\n说明如何开始使用你的项目。提供设置环境和安装任何必要依赖项的清晰简洁说明。\n\n```markdown\n\
  ### Prerequisites\n```\n\n列出用户在使用你的项目之前需要安装的任何软件、库或工具。如有必要，包含版本要求。\n\n```markdown\n\
  ### Installation\n```\n\n提供安装你项目的逐步说明。如适用，可使用代码块。\n\n```bash\n# Example installation\
  \ command\n\nnpm install your-package-name\n```\n\n## 在 GitHub 上直接编辑 README 文件（动手实践）\n\
  \n1. **前往我们之前创建的 GitHub 仓库**：这就像打开你电脑上保存文档的文件夹。\n2. **在文件内容右上角查找铅笔（![](img/B21847_02_icon_2.png)）图标**：这是编辑按钮。点击它：\n\
  \n![图 2.27 – 编辑 README 文件](img/B21847_02_27.jpg)\n图 2.27 – 编辑 README 文件\n\n3. **打开文件**：文件现在将在一个可编辑的文本框中打开，类似于简单的文本编辑器。现在，你准备好进行更改了：\n\
  \n![图 2.28 – 向 README 文件添加更改](img/B21847_02_28.jpg)\n图 2.28 – 向 README 文件添加更改\n\n\
  4. **进行更改**：只需在文本框中输入即可对文件进行更改。这就像编辑 Word 文档或电子邮件一样。\n5. **添加你的 Markdown**：现在使用\
  \ Markdown 代码并替换 README 文件的所有内容。\n6. **查看你的更改**：你会看到一个名为 **Preview**（![](img/B21847_02_icon_3.png)）的部分。这显示了你的编辑效果。这就像在打印前预览文档一样。\n\
  7. **提交你的更改**：一旦对编辑满意，你需要 *commit* 这些更改（在 GitHub 术语中，*committing* 就像保存你的更改一样）：\n\
  \n![图 2.29 – 保存更改](img/B21847_02_29.jpg)\n图 2.29 – 保存更改\n\n8. **添加你的提交信息**：接下来，你会看到一个框，可以输入一条简短的消息来说明你做了哪些更改（这有助于你和其他人了解更改了什么以及为什么）：\n\
  \n![图 2.30 – 提交更改](img/B21847_02_30.jpg)\n图 2.30 – 提交更改\n\n9. **完成提交**：添加消息后，点击绿色按钮上的\
  \ **Commit changes**。这就像在文档上点击 **Save**。\n\n你的更改现在已保存并立即在 GitHub 上的文件中更新。\n\n# 总结\n\
  \n在本章中，我们学习了 Git 和 GitHub 的基础知识，包括如何克隆仓库、使用 Git 命令、保存更改以及与其他人协作。这些技能对于管理项目和在编程中作为团队工作至关重要。\n\
  \n接下来，我们将探索 GitHub 用于项目协作的功能，例如邀请朋友加入项目、处理问题、创建拉取请求、管理通知、参与讨论、设置项目以及使用洞察和图表。这将在我们奠定基础知识的基础上，帮助我们更有效地协作。\n\
  \n# 测验\n\n通过以下测验问题检查你通过阅读本章获得的知识：\n\n1. GitHub 中的“repository”是什么？\n   1. 代码和项目文件的集合\n\
  \   2. 开发人员的聊天室\n   3. 一种编程语言\n   4. 一个网站构建器\n   *Answer*: A. 代码和项目文件的集合\n\n2. 真或假：Git\
  \ 和 GitHub 是同一件事。\n   1. 真\n   2. 假\n   *Answer*: B. 假\n\n3. 填空：要开始使用 GitHub，你需要为你的项目创建一个\
  \ ______________。\n   *Answer*: repository\n\n4. 为什么在你的机器上设置 Git 很重要？\n   *Answer*:\
  \ 它允许你从本地机器与 GitHub 交互，从而更有效地管理和协作项目。\n\n5. “克隆一个仓库”是什么意思？\n   1. 删除一个项目\n   2.\
  \ 将项目复制到你的本地机器\n   3. 更改项目的名称\n   4. 将项目发送给朋友\n   *Answer*: B. 将项目复制到你的本地机器\n\n\
  6. 真或假：你只能将 GitHub 用于编码项目。\n   1. 真\n   2. 假\n   *Answer*: B. 假\n\n7. Git 命令的目的是什么？\n\
  \   1. 玩游戏\n   2. 与 Git 通信并管理你的项目\n   3. 画画\n   4. 写文章\n   *Answer*: B. 与 Git 通信并管理你的项目\n\
  \n8. 填空：当你对代码进行更改时，你需要 ________ 它们以便在 GitHub 上保存并更新你的项目。\n   *Answer*: push\n\n\
  9. 真或假：你可以在不使用 Git 的情况下在 GitHub 上与其他人协作。\n   1. 真\n   2. 假\n   *Answer*: B. 假\n\n\
  10. 命名本章中提到的一个基本 Git 命令及其用途。\n    *Answer*: `git push` 命令用于将本地仓库内容上传到远程仓库\n\n# 挑战\
  \ – 启动你的太空冒险！\n\n准备好开始一次出乎意料的冒险了吗？在本章中，我们探索了 GitHub 和版本控制的基础知识。现在是时候将这些知识付诸实践，使用你自己的太空主题游戏：*Space\
  \ Explorer！*\n\n你的任务？\n\n在 GitHub 上启动 **Space Explorer Game** 仓库：\n\n![图 2.31 –\
  \ Space Explorer 游戏](img/B21847_02_31.jpg)\n图 2.31 – Space Explorer 游戏\n\n## 成功步骤\n\
  \n以下是你的成功步骤：\n\n1. **Fork 仓库**：访问官方 **Space Explorer Game** 仓库 [`github.com/PacktPublishing/GitHub-for-Next-Generation-Coders`](https://github.com/PacktPublishing/GitHub-for-Next-Generation-Coders)。\n\
  2. **点击 Fork 按钮**：这将在你的 GitHub 账户中创建游戏的副本——想象成克隆一艘外星飞船，这样你就有了一艘属于自己的！\n3. **克隆你的\
  \ fork**：一旦你 fork 了仓库，是时候把它带到你的电脑上了。在终端中使用 `git clone` 命令克隆仓库。（需要复习？重温我们关于克隆的部分。）你正把飞船直接传送到你的电脑上！\n\
  4. **探索你的本地副本**：在你喜欢的代码编辑器中打开克隆的项目。偷看一下！你会找到 HTML、CSS 和 JavaScript 文件——太空冒险的构建模块。\n\
  \n\n\n\n### 5. 在本地浏览器中测试游戏\n在浏览器中运行 HTML 文件，并在 `Game Start` 文件夹中查看 *Space Explorer*\
  \ 游戏的基础版本。它活了！\n\n### 6. 坚定你的使命\n先做一个小改动。不如在 HTML 文件中更改标题以包含你的名字？例如，`<title>[Your\
  \ Name]'s Space Explorer</title>`。\n\n### 7. 保存并提交更改\n保存你的更改并使用诸如 `Personalize game\
  \ title` 的信息提交它们。你正在这个编程宇宙中标记你的领地！\n\n### 8. 推送更改\n使用 `git push` 命令将你的更改推送到你的 GitHub\
  \ fork。你的个性化宇宙飞船现在在 GitHub 宇宙中可见了！\n\n### 9. 反思你的旅程\n在线查看你的 GitHub 仓库。看到那里的提交了吗？你刚刚完成了一个基本的\
  \ GitHub 循环：fork、clone、edit、commit 和 push！\n\n## 奖励挑战\n在你的仓库的 `README` 文件中写一篇简短的“船长日志”条目，描述你的第一次任务。发挥你的想象力！有什么令人兴奋的？你对\
  \ GitHub 和编程有什么发现？\n"
- '# 第 2 部分：使用 GitHub 进行协作开发

  接下来，本部分将深入探讨使用 GitHub 的更具协作性的方面。你将探索如何通过使用分支、管理合并冲突以及利用 GitHub 的功能来增强协作，从而与他人更有效地协作。实用技巧将帮助你无缝管理贡献并保持干净的项目历史。


  本部分包含以下章节：

  * *第 3 章*, *用于项目协作的 GitHub 功能*

  * *第 4 章*, *GitHub 和 Git 中的分支*

  * *第 5 章*, *通过 Pull Requests 协作编码*

  * *第 6 章*, *解决合并冲突 – 在 GitHub 和本地*

  '
- "## 3 用于项目协作的 GitHub 功能\n在本章中，我们将了解改进项目协作的 GitHub 功能，教你如何邀请协作者、管理问题、创建 pull requests、处理通知、使用讨论进行团队沟通、设置项目以及使用洞察和图表。这些工具旨在简化团队合作，使跟踪进度、讨论想法和高效共享更新变得更容易。\n\
  \n在本章中，我们将涵盖以下主要主题：\n* 设置你的团队 – 在 GitHub 上邀请协作者\n* 了解 GitHub 问题 – 我们项目的困扰是什么？\n\
  * pull request 简介\n* 有什么动静？管理 GitHub 通知\n* 探索 GitHub Discussions\n* 在 GitHub 上设置项目\n\
  * 了解 GitHub 上的 Wiki\n* 什么是 GitHub 仓库洞察？\n\n### 技术要求\n需要一个 GitHub 账户和对 `Git` 的基本熟悉。确保\
  \ `Git` 已安装在你的计算机上并为练习设置一个 GitHub 仓库。访问 `https://github.com` URL 进行本章的所有活动。创建一个名为\
  \ `ch3` 的 GitHub 文件夹以组织你的工作。\n\n### 设置你的团队 – 在 GitHub 上邀请协作者\n曾经参加过派对吗？当你邀请朋友时，会更有趣，对吧？现在，把你的\
  \ GitHub 项目想象成一个派对。当更多人，例如你的队友或朋友加入并做出贡献时，它会变得更好。那么，你如何邀请他们参加你的 GitHub 项目派对呢？让我们一步步来。\n\
  \n#### 找到邀请位置\n1. 打开你的网络浏览器并前往你的 GitHub 项目页面。在我们的例子中，它叫做 `MyFirstRepo`。现在，在页面的右上角查找名为\
  \ Settings 的标签并点击它。这就像打开你派对的大门。将其视为 *步骤零*。\n2. 进入设置后，在左侧查找名为 Access 的部分。点击 Collaborators。这个部分就像你的宾客名单。\n\
  3. 现在，点击绿色按钮 Add people：\n![图 3.1 – 邀请协作者](img/B21847_03_01.jpg)\n图 3.1 – 邀请协作者\n\
  4. 在这里，你可以输入你想要邀请的朋友的用户名或电子邮件地址。当你开始输入时，GitHub 会通过建议名称来帮助你：\n![图 3.2 – 从列表中选择协作者](img/B21847_03_02.jpg)\n\
  图 3.2 – 从列表中选择协作者\n5. 从列表中选择你想要邀请的朋友，或完成输入他们的用户名或电子邮件，然后点击上方的 Select a collaborator\
  \ 按钮发送邀请。这就像向你的派对发送邀请卡。\n\n#### 等待他们的 RSVP（répondez s’il vous plaît – 请回复）\n你的朋友将通过电子邮件和\
  \ GitHub 上的通知收到你的邀请。一旦他们接受，他们就可以加入你的项目，查看你一直在工作的所有酷东西，并开始贡献他们自己的想法！\n\n#### 检查宾客名单\n\
  随时你可以返回项目设置中的 Collaborators 部分，查看谁接受了你的邀请以及谁加入了派对。\n现在，你的 GitHub 项目派对已经设置好，邀请已发送，随着朋友们的加入，真正的乐趣和创造力开始了。一起，你们将创造出令人惊叹的东西，也许在途中还能互相学习一两件事。接下来，让我们了解一个重要主题：GitHub\
  \ 问题。\n\n### 了解 GitHub 问题 – 我们项目的困扰是什么？\n想象你和一群朋友一起拼一个大拼图。你们都在拼凑碎片，但突然，你注意到拼图的某个部分看起来有点奇怪。也许缺少一块，或者几块拼不起来。你想让朋友们知道这一点，以便大家都了解并有人帮忙修复。在通过\
  \ GitHub 进行项目协作中，这就是 *问题* 发挥作用的地方。\nGitHub Issues 就像你项目的公告板。每当你或你的队友发现一个问题、有疑问或想提出一个想法时，你就可以将其发布在\
  \ Issues 板上。这是一个大家可以讨论正在发生的事情并共同想出解决方案的地方。例如，如果你正在从事一个网站项目并且联系表单无法工作，你可以创建一个诸如 *网站错误*\
  \ 的问题以便修复它。\n\n#### 创建一个问题\n1. 前往 GitHub 上的项目仓库。点击 Issues 标签。\n2. 接下来，点击绿色 New issue\
  \ 按钮：\n![图 3.3 – 创建新问题](img/B21847_03_03.jpg)\n图 3.3 – 创建新问题\n创建新问题的页面将打开。\n3. 为你的问题提供一个标题，例如\
  \ `Rename the Repository to MyBiography`，并详细描述问题：\n![图 3.4 – 问题标题和描述](img/B21847_03_04.jpg)\n\
  图 3.4 – 问题标题和描述\n你甚至可以添加诸如 `bug` 或 `enhancement` 的标签来对其进行分类并将其附加到项目中，我们将在下一节中创建这些项目：\n\
  ![图 3.5 – 问题标签](img/B21847_03_05.jpg)\n图 3.5 – 问题标签\n现在，你的问题已在公告板上。你的队友可以看到它，对其发表评论，甚至提出解决方案。\n\
  \n#### 讨论问题\n你可以在问题页面上直接进行对话，分享代码片段、屏幕截图或任何其他有用信息：\n![图 3.6 – 对问题发表评论](img/B21847_03_06.jpg)\n\
  图 3.6 – 对问题发表评论\n如果你的某个队友有很好的修复问题的方法，你或你的项目经理可以将问题分配给他们。\n\n#### 分配问题\n你可以像这样将问题分配给某个人：\n\
  ![图 3.7 – 将问题分配给团队成员](img/B21847_03_07.jpg)\n图 3.7 – 将问题分配给团队成员\n他们现在有一个任务可以工作，每个人都知道他们是正在处理这个问题的那个人。\n\
  \n\n\n一旦你的队友在本地机器上修复了问题，他们就可以创建一个拉取请求（我们将在“介绍拉取请求”部分讨论）。\n\n# 链接到拉取请求\n在拉取请求中，他们可以提及问题编号，例如\
  \ `Fixes #1`，以表明此拉取请求中的更改旨在解决该问题。GitHub 很智能；一旦拉取请求被合并，它将自动关闭问题，表明问题已得到解决：\n\n![图\
  \ 3.8 – 将问题链接到拉取请求](img/B21847_03_08.jpg`)\n图 3.8 – 将问题链接到拉取请求\n\n通过这种简单、有条理的系统，GitHub\
  \ Issues 有助于让每个人都清楚项目中需要关注的内容。这就像一份鲜活的待办清单，每个人都可以贡献和互动，确保在项目不断完善的过程中不会有任何事情被遗漏。有了这些知识，让我们继续进入下一部分！\n\
  \n# 介绍拉取请求\n你在和朋友们一起制作一个单页作品集网站。每个人都有不同的想法和贡献来让网站看起来很棒，就像一群艺术家在共同创作一幅大型壁画。现在，如何确保每个人的想法都能很好地融合在一起，让壁画最终看起来很棒呢？这就是\
  \ GitHub 拉取请求发挥作用的地方！图 3.9 显示了拉取请求在 GitHub 上的外观：\n\n![图 3.9 – 在 GitHub 上管理拉取请求](img/B21847_03_09.jpg`)\n\
  图 3.9 – 在 GitHub 上管理拉取请求\n\n## 什么是拉取请求？\n基本上，拉取请求是对合并代码更改的请求。拉取请求就像是在问团队：“嘿，我们可以在网站上添加我的博客页面吗？”\n\
  \n这是一种讨论更改的方式：在团队同意之前，他们会查看你的博客页面，提出建议，或表示它已经完美无缺。\n\n## 在你的网站项目中使用拉取请求\n假设你为网站创建了一个新部分，例如“关于我”页面。你在\
  \ GitHub 上提交一个拉取请求，这就像向团队展示你的草稿。图 3.10 演示了如何打开拉取请求：\n\n![图 3.10 – 为代码更改打开拉取请求](img/B21847_03_10.jpg`)\n\
  图 3.10 – 为代码更改打开拉取请求\n\n## 审查和反馈\n你的队友会检查你的“关于我”页面。他们可以提出更改建议，例如“这里也许可以用不同的字体？”，如果他们喜欢，还可以点赞。\n\
  \n这是每个人讨论和完善想法的机会，确保网站保持一致性。以下图示展示了如何审查拉取请求：\n\n![图 3.11 – 审查拉取请求](img/B21847_03_11.jpg`)\n\
  图 3.11 – 审查拉取请求\n\n## 合并拉取请求\n一旦大家达成一致，你的更改就会合并到主项目中：\n\n![图 3.12 – 合并拉取请求](img/B21847_03_12.jpg`)\n\
  图 3.12 – 合并拉取请求\n\n你的“关于我”部分现在已成为官方网站的一部分！\n\n这就像把你的作品添加到壁画中，使其更加丰富和完整。\n\n## 为什么拉取请求很重要？\n\
  拉取请求确保更改经过审查并与整体设计良好契合。\n\n拉取请求鼓励协作和学习。它们开启了关于不同想法和方法的对话。这是一个很好的方式，让大家互相学习并作为团队改进项目。拉取请求确保网站保持功能正常、外观良好且无错误。接下来，让我们学习通过管理通知来优化你的\
  \ GitHub 体验。\n\n# 有什么动静？管理 GitHub 通知\n你是否曾因手机的嗡嗡声和蜂鸣声感到不知所措，尤其是在你参与活跃的在线社区或繁忙的项目团队时？这就像置身于一个房间里，每个人都在同时说话，而你正努力跟上所有内容。现在，想象一下这种情况发生在\
  \ GitHub 上的数字工作空间中。代码行的每条评论、每个新打开的问题或每个拉取请求都会向你发送通知。这很快就会变得烦人！那么，如何在不迷失在通知海洋中的情况下，关注重要的对话呢？\n\
  \nGitHub 通知是你跟踪与你相关的讨论和活动的方式。它们就像轻微的提醒或肩膀上的轻拍，告诉你需要关注的地方。让我们在 GitHub 上穿行于这个充满想法的嘈杂市场中，而不迷失方向。\n\
  \n## 发现通知\n当你登录 GitHub 时，你会在页面右上角注意到一个收件箱图标：\n\n![图 3.13 – 通知](img/B21847_03_13.jpg`)\n\
  图 3.13 – 通知\n\n那里汇集了你所有的通知，等待你的关注。\n\n## 调整渠道\n点击铃铛图标，你会看到所有通知的列表。左侧有一个侧边栏，可帮助你筛选这些通知。你可以选择查看特定仓库的通知或直接提及你的通知：\n\
  \n![图 3.14 – 通知列表](img/B21847_03_14.jpg`)\n图 3.14 – 通知列表\n\n你可以按仓库、状态或讨论类型、通知原因、作者或组织来筛选通知：\n\
  \n![图 3.15 – 筛选通知](img/B21847_03_15.jpg`)\n图 3.15 – 筛选通知\n\n## 标记通知\n在浏览通知时，你可以将它们标记为已读，这样它们就不会再吸引你的注意，或者如果你需要更多时间，可以将它们保持为未读。选择通知前面的复选框，点击三个点按钮，你将看到“标记为已读”和“标记为未读”选项：\n\
  \n![图 3.16 – 阅读和标记通知](img/B21847_03_16.jpg`)\n图 3.16 – 阅读和标记通知\n\n## 使用筛选器减少通知泛滥\n\
  GitHub 还允许你根据通知的状态进行筛选，例如未读、参与中或被提及。这就像有一位智能助手，知道哪些文件应该放在你的办公桌上。你甚至可以通过点击齿轮图标创建自己的筛选器：\n\
  \n![图 3.17 – 筛选器](img/B21847_03_17.jpg`)\n图 3.17 – 筛选器\n\n一个新窗口将打开，其中包含几个默认筛选器，从那里你可以创建新的筛选器：\n\
  \n![图 3.18 – 创建自定义筛选器](img/B21847_03_18.jpg`)\n图 3.18 – 创建自定义筛选器\n\n## 自定义提醒\n如果你觉得提醒太多，可以通过点击左侧的“管理通知”选项来自定义通知设置：\n\
  \n![图 3.19 – 管理通知选项](img/B21847_03_19.jpg`)\n图 3.19 – 管理通知选项\n\n如果点击“通知设置”，你将被重定向到通知页面，在那里你可以选择\
  \ GitHub 何时以及如何向你发送通知：\n\n![图 3.20 – 通知管理部分](img/B21847_03_20.jpg`)\n图 3.20 – 通知管理部分\n\
  \n你可以决定接收每项活动的通知或仅接收重点通知。\n\n## 通过电子邮件接收更新\n如果你更喜欢不那么打扰的方式，可以让 GitHub 将所有通知发送到你的电子邮件。你可以在有空时再查看这些通知。\n\
  \n现在你已经学会了如何有效地管理 GitHub 通知并保持项目更新整洁且相关，让我们将注意力转向 GitHub 的另一个互动功能。我们将看看如何使用 GitHub\
  \ Discussions 来进一步增强项目协作。本节将展示如何将 Discussions 用作分享想法、收集反馈以及与团队更开放沟通的平台。\n\n# 探索\
  \ GitHub Discussions\n\n\n\n# GitHub 讨论\n\n你是否曾希望有一个地方，你和你的团队成员可以在那里讨论项目、分享想法或提问？它就像你项目的专属社交媒体平台。这正是\
  \ **GitHub Discussions** 的用途！\n\n## 项目协作的酷炫之处\n\n所以，你正和朋友们一起创建一个单页作品集网站。这不仅仅是编码和设计，对吧？你需要头脑风暴想法、理清问题，有时也只是聊聊酷炫的功能。这就是\
  \ GitHub Discussions 登场的地方。\n\n## 它就像你项目的聊天室\n\n把 Discussions 想象成一个数字咖啡馆，你和朋友们可以在那里谈论与网站相关的所有事情，从设计想法到决定包含什么内容。\n\
  \n与其在不同的应用之间 juggling 对话或丢失重要的建议，项目相关的所有内容都集中在一个有组织的场所。\n\n## 我们可以进行哪些类型的讨论？\n\n\
  可以进行多种讨论，例如：\n\n*   **General**：通用的空间，适合任何不属于其他类别的内容。它就像 *杂项* 抽屉：\n![图 3.21 – 通用讨论](img/B21847_03_21.jpg)\n\
  图 3.21 – 通用讨论\n*   **Ideas**：有好点子或建议吗？这里就是你的舞台！\n![图 3.22 – 创意讨论](img/B21847_03_22.jpg)\n\
  图 3.22 – 创意讨论\n*   **Q&A**：如果你有问题，这里就是提问的地方。如果你有答案，这里就是分享的地方：\n![图 3.23 – 问答讨论](img/B21847_03_23.jpg)\n\
  图 3.23 – 问答讨论\n*   **Show and tell**：为自己做的事情感到自豪吗？这里就是你展示光芒的时刻！\n![图 3.24 – 展示与分享讨论](img/B21847_03_24.jpg)\n\
  图 3.24 – 展示与分享讨论\n*   **Polls**：想象你有一个问题，想知道大家的想法。投票让每个人都能投出自己的票。就像问“我们的项目标志应该是蓝色还是绿色？”然后每个人都可以点击自己的选择：\n\
  ![图 3.25 – 投票讨论](img/B21847_03_25.jpg)\n图 3.25 – 投票讨论\n*   **Announcements**：这里分享重要新闻。把它想象成咖啡馆里的公告板，重要通知被钉在上面：\n\
  ![图 3.26 – 公告讨论](img/B21847_03_26.jpg)\n图 3.26 – 公告讨论\n\n## 如何开始一个讨论？\n\n开始讨论，请按以下步骤操作：\n\
  \n1.  导航到 **Discussions** 选项卡。\n2.  在左侧菜单中选择一个类别，在那里开始讨论：\n![图 3.27 – 讨论分类](img/B21847_03_27.jpg)\n\
  图 3.27 – 讨论分类\n1.  要开始新的讨论，有一个按钮写着 **New discussion**。点击它就像举手开始一个新话题：\n![图 3.28\
  \ – 讨论概览](img/B21847_03_28.jpg)\n图 3.28 – 讨论概览\n1.  就像一个对话开场白，给你的讨论起一个吸引人的标题，并在此处分享你的想法、问题或创意。这就像在社交媒体上发帖：\n\
  ![图 3.29 – 创建讨论](img/B21847_03_29.jpg)\n图 3.29 – 创建讨论\n1.  **Post it**：点击 **Start\
  \ discussion** 按钮，你就上线了！\n![图 3.30 – 讨论列表](img/B21847_03_30.jpg)\n图 3.30 – 讨论列表\n\
  \n## 建设更强大的团队\n\n这些讨论为你的项目创建了历史记录。对任何新团队成员来说都很有价值，可以快速上手并追踪过去的决策和想法。当每个人都参与对话时，你会得到更好的想法、更多的承诺和社区感。就像让所有朋友为你的网站贡献独特的想法，使其更丰富、更个性化。\n\
  \n# 在 GitHub 上设置项目\n\n假设你正和朋友们计划一场后院烧烤派对。你有一个清单要买汉堡、设置烤架、邀请人，也许计划一些游戏。在 GitHub 上为你的单页网站设置项目有点像这样，但针对的是编码。\n\
  \n## 为什么项目在 GitHub 上很重要？\n\n就像派对需要计划一样，你的网站需要组织。GitHub Projects 帮助你和你的朋友（或团队成员）知道谁在做什么以及何时做。但这不仅仅是代码。它关乎人们共同工作、聊天、分享想法并互相帮助。把它想象成在烤汉堡时进行的愉快聊天和击掌。\n\
  \n## 为你的单页作品集网站设置项目\n\n1.  **先制定计划**：想象你在绘制派对地图。在 GitHub 上，你为网站创建一个 *项目*。这里是你概述让网站变得很棒的所有步骤的地方。\n\
  2.  **将其分解为任务**：你不会让客人自己烤汉堡，对吧？同样地，在你的项目中，你创建任务（例如设计主页、编写内容等等）并分配给朋友。每个人都知道自己需要做什么。\n\
  3.  **跟踪进度**：就像在派对清单上勾选项目一样，你可以跟踪哪些任务已完成、哪些正在进行中、还有什么剩余。就像知道饮料已准备好但游戏还没设置好一样。\n\
  4.  **协作与沟通**：使用 GitHub 的功能讨论任务、提供反馈并进行更改。就像讨论在哪里设置烤架或播放什么音乐一样。\n5.  **庆祝里程碑**：主页完成了？联系表单正常工作了？庆祝这些小胜利吧！就像第一批汉堡准备好时欢呼一样。\n\
  \n### 在 GitHub 上为你的单页网站设置 Kanban 项目\n\nKanban 到底是什么？\n\n**Kanban** 就像一个公告板，上面有便签显示不同的任务，例如\
  \ *添加个人资料图片* 或 *添加联系部分*。每张便签从一个类别移动到另一个类别，例如 **Todo**、**In Progress** 和 **Done**：\n\
  ![图 3.31 – Kanban 泳道](img/B21847_03_31.jpg)\n图 3.31 – Kanban 泳道\n\n这就是 Kanban ——\
  \ 一种直观查看项目进度的方式。\n\n*好吧 – 那么如何在 **GitHub 上** 创建项目？*\n\n### 在 GitHub 上创建项目\n\n1.\
  \  在 GitHub 中，进入你的网站仓库并点击 **Projects**。在那里，你将看到项目的概览。点击 **Projects**，然后点击 **New\
  \ project**：\n![图 3.32 – 项目概览页面](img/B21847_03_32.jpg)\n图 3.32 – 项目概览页面\n1.  一个新的弹出窗口将打开，你可以在其中选择从头创建项目作为表格、看板或路线图，或从模板开始：\n\
  ![图 3.33 – 创建新项目](img/B21847_03_33.jpg)\n图 3.33 – 创建新项目\n\n将其命名为类似 **One-Page Website\
  \ Development**。就像为你的 DIY 书架项目命名一样。在你点击 **Create a new project** 后，一个 **One-Page\
  \ Website Development** 项目将被创建，其中已创建的列例如 **Todo**、**In Progress** 和 **Done**。这些就像公告板上的部分，显示计划中、正在进行中和已完成的内容：\n\
  ![图 3.34 – 新项目已创建](img/B21847_03_34.jpg)\n图 3.34 – 新项目已创建\n1.  **创建新列**：\n    1.\
  \  很可能，你的项目需要更多列。要设置新列，只需点击加号图标并开始创建新列。\n    2.  为你的列提供标签、颜色和描述：\n![图 3.35 – 配置新列](img/B21847_03_35.jpg)\n\
  图 3.35 – 配置新列\n1.  **将任务添加为卡片**：\n    1.  网站的每个任务都成为一张卡片。\n    2.  为诸如 *设计主页*、*撰写关于我部分*\
  \ 等事物创建卡片。\n    3.  将它们放在 **Todo** 列中。就像在看板的 **Todo** 部分放置便签一样。只需点击 **Add Item**\
  \ 并开始添加：\n![图 3.36 – 创建任务](img/B21847_03_36.jpg)\n\n\n\n## 创建任务\n\n通过点击其中一个为新条目添加更多详细信息。将打开一个新页面，您可以在其中添加其他详细信息，例如描述、将问题分配给团队成员、归档或删除它：\n\
  \n![图 3.37 – 任务视图](img/B21847_03_37.jpg)\n图 3.37 – 任务视图\n\n1. **移动卡片**：\n    1.\
  \ 当你开始处理任务时，将其卡片移至 **进行中**。\n    2. 完成后，将其移至 **已完成**。\n    就像当书架的一部分完成时，将便签从 **待办**\
  \ 移到 **已完成** 一样。\n2. **协作并更新**：你的团队可以为每个卡片添加评论、建议或更新。就像你的朋友在便签上写下关于网站进展的笔记一样。\n\n\
  ## 为什么使用看板？\n\n看到卡片从 **待办** 移到 **已完成** 令人满意且鼓舞人心，就像看着网站成形一样。\n\n协作很简单，因为每个人都能看到需要做什么以及已完成什么。不会混淆谁负责设计，谁负责编写代码。\n\
  \n这是一种非常灵活的方式，可以根据需要添加新任务或重新排列它们。就像在构建网站时如果你发现更好的方法，可以调整你的步骤一样。\n\n在 GitHub 上为你的单页网站设置看板项目，就像组织和可视化有趣的\
  \ DIY 项目的步骤一样。它使一切保持清晰、协作和灵活，使构建网站的过程变得愉快！\n\n## 如何更改我的项目设置？\n\n在项目的 **设置** 部分，你有许多选项，例如更改项目名称和描述、添加\
  \ README 文件、管理访问权限，以及额外添加自定义字段的可能性：\n\n![图 3.38 – 项目设置](img/B21847_03_38.jpg)\n\
  图 3.38 – 项目设置\n\n现在我们已经介绍了如何在 GitHub 上设置项目、使用看板进行组织，并深入了解以监控项目的进展，让我们继续前进。接下来，我们将学习如何使用\
  \ GitHub Wiki。这将帮助你为单页网站创建一个任何人都可以参考的综合指南。就像为你的网站建立一份手册，使其他人更容易理解并为你的项目做出贡献。\n\n\
  # 在 GitHub 上理解 Wiki\n\nGitHub 上的 **wiki** 是什么？它是在你的 GitHub 仓库中可以编写和存储项目重要信息的地方。可以把它想象成一个数字笔记本，你和你的团队可以在其中记录有关构建单页网站的一切。\n\
  \n## Wiki 如何提供帮助？\n\n就像把构建网站的所有说明放在一个地方一样，Wiki 将项目的所有信息保存在一个位置。这可以包括设计指南、编码标准，甚至会议记录。\n\
  \n团队中的任何人都可以添加或编辑页面。如果有人找到了为网站的某个部分编码或更新设计的更好方法，他们可以快速更新 Wiki。\n\n当有新人加入项目时，他们可以阅读\
  \ Wiki 来快速上手。就像给他们网站的使用说明书，让他们确切知道该做什么。\n\n## 在 GitHub 上为你的单页网站创建 Wiki\n\n要为你的单页网站创建\
  \ Wiki，请按照以下步骤操作：\n\n1. 转到 GitHub 上网站的仓库，找到 **Wiki** 标签，通常在 **Projects** 旁边。点击 **创建第一个页面**\
  \ 开始撰写你的第一个 Wiki 页面：\n![图 3.39 – Wiki 概览](img/B21847_03_39.jpg)\n图 3.39 – Wiki 概览\n\
  2. 将网站项目的简要介绍作为网站的介绍页面。包括网站是关于什么的以及此 Wiki 的目标：\n![图 3.40 – 创建新的 Wiki](img/B21847_03_40.jpg)\n\
  图 3.40 – 创建新的 Wiki\n3. 点击 **新建页面** 添加更多内容：\n![图 3.41 – 创建新的 Wiki 页面](img/B21847_03_41.jpg)\n\
  图 3.41 – 创建新的 Wiki 页面\n4. 为不同方面创建页面，例如 **设计指南**、**编码标准** 或 **项目时间线**。就像为你的网站添加部分一样——一个用于联系，一个用于作品集，等等。\n\
  \n接下来，让我们看看使用 Wiki 的一些最佳实践：\n\n* **保持有序**：就像你会用章节和目录组织笔记本一样，对你的 Wiki 也这样做。为网站项目的不同方面创建不同的页面，例如\
  \ **设计指南**、**编码标准** 等。为每个页面使用清晰且描述性的标题。不要为每个微小细节创建一个页面。为所有页面使用相似的格式。\n* **定期更新**：保持\
  \ Wiki 的最新状态。如果项目中有什么变化，请更新 Wiki 以反映它。就像在你找到构建飞机部件的更好方法时更新使用说明书一样。\n* **鼓励协作**：确保每个人都感到舒适地添加和编辑\
  \ Wiki。贡献的人越多，内容就越丰富。\n* **链接到其他资源**：如果你的设计存储在其他地方或代码片段在你的仓库中，请在 Wiki 中链接到它们。就像在你的使用说明书中对飞机部件有参考一样。\n\
  \n在 GitHub 上为你的单页网站使用 Wiki 就像为你的项目拥有一个全面的协作式使用手册。它集中知识，使协作变得容易，并让每个人保持在同一页面上。这样，构建你的网站就成为一个井然有序的团队努力，就像用一套清晰的说明组装模型飞机一样。接下来，我们将学习\
  \ GitHub 仓库洞察。\n\n# 什么是 GitHub 仓库洞察？\n\n想象你和朋友们一起合作完成一个小组项目，例如烘焙蛋糕。你会想知道谁擅长做糖霜，谁是烘焙高手，以及整个做蛋糕过程进展如何，对吧？这就是\
  \ **GitHub 仓库洞察** 在你的单页网站项目中发挥作用的地方。它们就像一个仪表板，显示每个人对蛋糕的贡献，或者在这种情况下是对你的网站的贡献。它们为你的网站项目提供图表和数据。就像一份关于蛋糕烘焙（网站构建）进展的总结报告。\n\
  \n## 如何使用洞察\n\n你可以通过点击 ![](img/Icon.png) **Insights** 标签轻松访问 **Insights**，在网站的 GitHub\
  \ 仓库中：\n\n![图 3.42 – Insights 标签](img/B21847_03_42.jpg)\n图 3.42 – Insights 标签\n\n\
  ### 贡献者\n\n在 **贡献者** 中，你可以看到提交图表。每次提交就像某人做出的一个小贡献，例如向网站添加一行代码。\n\n你会看到谁在贡献以及贡献的频率。也许\
  \ Alice 添加了大部分主页内容，或者 Bob 修复了很多错别字：\n\n![图 3.43 – Insights 贡献](img/B21847_03_43.jpg)\n\
  图 3.43 – Insights 贡献\n\n### 流量\n\n**流量** 显示有多少人在访问你的项目。就像追踪有多少朋友偷看网站以查看你的作品集一样。\n\
  \n你可以看出是什么吸引了更多观众。也许你的 **关于我** 页面非常受欢迎！\n\n![图 3.44 – Insights 流量](img/B21847_03_44.jpg)\n\
  图 3.44 – Insights 流量\n\n### 脉冲\n\n**Pulse** 为你在一段时间内发生了什么提供快速概览，例如一周。就像你网站进展的每周总结：谁做了什么；完成了什么。\n\
  \n它显示最近的更改、开放和关闭的问题（任务或建议）等：\n\n![图 3.45 – Insights Pulse](img/B21847_03_45.jpg)\n\
  图 3.45 – Insights Pulse\n\n### 代码频率\n\n**代码频率** 图表显示代码随时间的添加和删除情况。可以把它想象成显示每周向你的网站添加或删除了多少行代码：\n\
  \n![图 3.46 – Insights 代码频率](img/B21847_03_46.jpg)\n图 3.46 – Insights 代码频率\n\n##\
  \ 为什么洞察很有帮助？\n\n你可以看出你的网站如何演变。就像看着蛋糕在烤箱里升起并逐渐成形一样。\n\n\n\n洞察显示谁在哪些方面贡献更多。也许 Alice\
  \ 在设计方面很出色，而 Bob 在撰写内容方面更擅长。\n\n通过了解彼此的优势和工作模式，你可以更好地协作。这就像知道谁最擅长打蛋或给蛋糕抹霜。\n\nGitHub\
  \ 仓库洞察为你的单页网站提供了一种清晰、直观的方式来了解项目进展如何以及每个人如何参与其中。这就像在你的团体蛋糕烘焙项目上有一份方便的报告，帮助你把握大局并微调团队合作！\n\
  \n# 摘要\n在本章中，我们学习了如何使用 GitHub 在项目上进行有效协作，包括邀请朋友、管理问题、通过拉取请求分享想法、处理通知、参与讨论、设置项目以及利用洞察和图表。这些技能对于一起进行编码项目至关重要，使协作更加顺畅高效。\n\
  \n在下一章中，我们将介绍 GitHub Flow、创建分支、实践中理解 GitHub Flow、克隆、本地添加和提交文件，以及将更改推送到 GitHub。这将帮助我们更有效地管理工作的不同版本，在协作技能的基础上继续发展。\n\
  \n# 测验\n测试你的知识，请回答以下问题：\n\n1. 邀请朋友加入你的 GitHub 项目的目的是什么？\n    1. 使项目私有\n    2. 协作并为项目做出贡献\n\
  \    3. 在不编辑的情况下查看项目\n    4. 参与编码挑战\n    *Answer*: B. 协作并为项目做出贡献\n\n2. GitHub 中的问题用于跟踪和讨论项目中的问题。\n\
  \    1. 真\n    2. 假\n    *Answer*: A. 真\n\n3. 在 GitHub 中，“\\_\\_\\_\\_\\_\\_\\_\\\
  _\\_\\_” 用于向团队展示你的项目部分以获取反馈。\n    *Answer*: 拉取请求\n\n4. 为什么在 GitHub 中讨论和寻找问题的解决方案很重要？\n\
  \    *Answer*: 它有助于识别、跟踪和解决项目中的问题，确保协作顺畅和进展。\n\n5. 你可以在 GitHub 上使用什么来与团队分享和讨论想法？\n\
  \    1. 表情符号\n    2. 问题和拉取请求\n    3. 直接消息\n    4. 个人资料图片\n    *Answer*: B. 问题和拉取请求\n\
  \n6. 你可以使用 GitHub 独自进行编码项目，而无需任何协作。\n    1. 真\n    2. 假\n    *Answer*: A. 真\n\n\
  7. GitHub 中哪个功能就像举办派对并邀请朋友加入？\n    1. 创建仓库\n    2. 设置仪表板\n    3. 邀请协作者\n    4. 编写\
  \ README 文件\n    *Answer*: C. 邀请协作者\n\n8. 要查看你的项目进展情况，你可以在 GitHub 上设置一个 \\_\\_\\\
  _\\_\\_\\_\\_\\_\\_\\_。\n    *Answer*: 仪表板\n\n9. GitHub 中的拉取请求仅用于展示已完成的工作，而不是接收反馈。\n\
  \    1. 真\n    2. 假\n    *Answer*: B. 假\n\n10. 使用 GitHub 讨论对你的项目有什么好处？\n    *Answer*:\
  \ 讨论允许团队成员有效沟通、分享想法并协作做出决策，从而增强项目的开发。\n\n# 挑战 – 为星际任务组队！\n欢迎回来，太空探索者！*第 3 章* 全部关于在\
  \ GitHub 的广阔宇宙中进行团队合作和协作。现在，是时候应用这些技能来改进你的 *太空探索者* 游戏了。准备好将你的单人太空任务变成星系团队冒险吗？\n\n\
  ![图 3.47 – 太空探索者游戏屏幕](img/B21847_03_47.jpg)\n\n图 3.47 – 太空探索者游戏屏幕\n\n## 你的任务\n通过与朋友组队、管理问题并获取反馈来扩展你的\
  \ *太空探索者* 游戏。\n\n## 成功步骤\n以下是你的成功步骤：\n\n1. **邀请你的船员**：\n    1. 在 GitHub 上打开你的 **太空探索者**\
  \ 游戏仓库。\n    2. 就像邀请朋友参加派对一样，将协作者添加到你的项目中。导航到 **设置** | **管理访问** | **邀请协作者**。输入你朋友的\
  \ GitHub 用户名并邀请他们登上你的宇宙飞船！\n\n2. **识别并创建问题**：\n    1. 玩你的游戏并寻找任何故障或需要改进的地方。也许某个障碍太难了，或者星星不够闪亮？\n\
  \    2. 为这些每一点在你的 GitHub 仓库中创建问题。这就像在你的宇宙飞船上钉一张便条，说明需要修复或升级的内容。\n\n3. **新功能的拉取请求**：\n\
  \    1. 我们已向游戏中添加了飞行障碍物和星星！现在是时候让你将它们集成进来了。\n    2. 创建一个新分支并添加这些功能。然后，打开一个拉取请求并邀请你的团队审查你的代码。这就像展示你宇宙飞船新机翼的草图并在绘制之前征求反馈。\n\
  \n4. **管理通知**：有了你的船员登船，你的 GitHub 可能会变得繁忙。设置你的通知偏好设置，以便在不迷失在太空中的情况下跟踪更新。\n\n5. **开始讨论**：使用\
  \ GitHub Discussions 聊聊你的下一个大功能或如何改进游戏。这就像在你的宇宙飞船控制室里举行团队会议。\n\n6. **计划你的下一次冒险**：使用\
  \ **项目** 功能来组织即将进行的游戏增强。创建项目看板并添加任务，例如 *添加新关卡* 或 *设计 **外星飞船***。\n\n7. **审查银河系（洞察和图表）**：查看仓库中的\
  \ *洞察* 和 *图表*。看看你的项目进展如何以及谁贡献最多。谁是你的船员中最活跃的宇航员？\n\n## 4 GitHub 和 Git 中的分支\n## GitHub\
  \ 和 Git 中的分支\n准备好 *第 4 章* 了吗？这就像在你的编程冒险中升级。本章全部关于在项目中为自己创造空间、添加很酷的新功能并与团队分享你的工作。\n\
  \n第一节将教你如何在项目内创建自己的小世界，在那里你可以尝试新想法而不影响主项目。你将学习如何创建这些分支以及它们为何非常有帮助。\n\n然后，你将学习如何进行更改、提交项目的一部分，然后保存它们，就像视频游戏中的检查点一样。你将看到如何跟踪你添加或更改的所有很酷的东西。\n\
  \n我们还将讨论推送你的精彩更改，在那里你将学习如何将它们与团队在 GitHub 上分享。\n\n我们将在本章中介绍以下主题：\n* 使用 GitHub Flow\
  \ 进行分支并在 GitHub 上创建分支\n* 实践中理解 GitHub Flow – 两名开发者、两个功能、一个项目\n* 创建仓库的本地副本（克隆）\n\
  * 向本地仓库添加和提交文件\n* 理解 Git 的工作区、暂存区和历史记录并将更改推送到 GitHub\n\n## 技术要求\n对于本章，重点是 GitHub\
  \ 和 Git 中的分支，你需要执行以下操作：\n* 在你的计算机上安装 Git 以处理版本控制任务\n* 创建一个 GitHub 账户以执行创建分支和提交拉取请求等操作\n\
  \n请参考本书的 GitHub 仓库以找到本章的代码示例：[`github.com/PacktPublishing/GitHub-for-Next-Generation-Coders/tree/main/Chapter%204`](https://github.com/PacktPublishing/GitHub-for-Next-Generation-Coders/tree/main/Chapter%204)。确保你克隆仓库，以便拥有一个本地副本进行操作。这对于练习分支和合并至关重要。此外，通过在\
  \ GitHub 上创建一个名为 `ch4` 的文件夹来组织你的工作。这将帮助你分别管理不同的章节。\n\n这种设置将使你能够有效地学习和应用 GitHub 的分支策略，使你的编码项目更易于管理和协作。\n\
  \n## 使用 GitHub Flow 进行分支并在 GitHub 上创建分支\n\n\n\n让我们更深入地探索 GitHub，在这里我们将学习分支的工作原理以及分支为何重要。你和你的朋友们正在构建一个单页作品集网站。你希望在不破坏已有内容的情况下添加新功能。这就是\
  \ GitHub Flow 登场的地方。\n\nGitHub Flow 在分支的上下文中，是一种简单而有效的方式来管理项目中的变更，例如在构建单页作品集网站时。\n\
  \n## 设置你的专属空间 – 创建新的功能分支\n\n开始使用 GitHub Flow，我们需要创建一个新的 `feature branch`。\n\n那么，什么是分支？可以把它想象成网站的副本，你可以在其中进行实验，而不会影响主网站（`main`\
  \ 分支）。\n\n你决定为网站添加一个技能部分。因此，你创建了一个名为 `add-skills-section` 的新分支。现在，你有一个单独的空间来处理这个功能。\n\
  \n### 了解主分支\n\n`main` 分支是网站的最终、公开版本。这里的一切都井然有序、经过测试且可展示。\n\n为什么不直接在 `main` 分支上工作？这样做风险很大，就像在忙碌的厨房中间第一次烹饪一道新菜一样。错误会影响每个人。\n\
  \n### 决定添加新功能\n\n假设你想为网站添加一个联系我表单。这是一种你从未开发过的全新表单样式。\n\n你创建一个从 `main` 分支衍生的分支。这就是你的工作区。取一个清晰的名字，例如\
  \ `add-contact-form`。\n\n为什么使用 `feature branch`？\n\n如果你的分支出现问题，主网站不受影响。就像在单独的网站上试验你的新联系表单一样。你可以专注于你的\
  \ Contact Me form，而不用担心搞乱主网站。这是你实验、犯错和学习的地方。创建后，请确保将工作目录切换到你的新分支。\n\n在 GitHub Flow\
  \ 中创建 `feature branch` 就像在共享项目中设置一个工作站。它让你可以自由实验并开发项目中的部分内容（如你的 Contact Me form），而不会妨碍他人。一旦功能准备好并通过测试，它就可以无缝集成到主项目中，以你的贡献丰富整体。\n\
  \n## 进行更改和提交\n\n图 4.1 显示了在 git 中创建新的 `feature branch` 的过程。它直观地展示了 `feature branch`\
  \ 如何从 `main` 分支创建，让你能够独立工作于新功能而不影响主项目。这有助于在新功能开发和测试期间保持 `main` 分支稳定。一旦新功能准备好并通过测试，它可以合并回\
  \ `main` 分支。这种工作流程确保开发过程井然有序，且主项目保持稳定。\n\n![图 4.1 – GitHub Flow – 创建新的功能分支](img/B21847_04_1.jpg)\n\
  图 4.1 – GitHub Flow – 创建新的功能分支\n\n一旦你创建了新的 `feature branch`es，你就可以开始进行一些更改，同时向你的\
  \ `feature branch` 添加新文件。\n\n你开始为联系我表单添加元素。这可能涉及为布局编写 `HTML`、为样式编写 `CSS`，或为交互功能编写\
  \ `JavaScript`。也许你会先搭建基本结构，然后添加一些样式，最后微调细节。\n\n在这个个人工作区，你可以添加、编辑或删除文件。请随意在这里实验，因为你的更改在你决定合并之前不会影响主项目。\n\
  \n一旦你对更改满意，你就可以 `commit` 它们。这就像说，“我这一部分暂时完成了。”\n\n### 什么是 commit？\n\n把 `commit`\
  \ 想象成一个检查点。每个 `commit` 代表你所做的更改或添加的集合。\n\n使用 Git，你会将已更改的文件添加到暂存区（使用 `git add`），然后使用\
  \ `git commit` 创建一个 `commit`。在这个 `commit` 中，你会写一条描述你所做工作的信息——例如，Added basic layout\
  \ for the blog section。最好经常 `commit`，因为这样可以让你看到何时做了哪些更改。如果出现问题或不符合预期，如果你有更小、更频繁的\
  \ `commit`s，回滚到之前的 `commit` 会更容易。每个 `commit` 都是你在特定时间点的快照。如果以后出现问题，你始终可以返回到之前的 `commit`。\n\
  \n每个 `commit` 都记录在分支历史中。这意味着你可以随着时间的推移看到你的 Contact Me form 的演变，了解何时做了哪些更改：\n\n![图\
  \ 4.2 – GitHub Flow – 向功能分支添加提交](img/B21847_04_2.jpg)\n图 4.2 – GitHub Flow – 向功能分支添加提交\n\
  \n### 推送更改\n\n一旦你完成了一系列代表你工作的重要部分（例如完成联系我表单的布局）的 `commit`s，你就可以将这些 `commit`s `push`\
  \ 到 GitHub。这会使用你在本地所做的所有更改来更新 GitHub 上的分支。\n\n推送后，你的 `commit`s 对队友可见。他们可以清楚地看到你所做的更改，按\
  \ `commit` by `commit` 查看。\n\n## 展示与说明 – 创建拉取请求\n\n一旦你完成了更改并准备好向朋友展示你的技能部分，你就可以创建一个\
  \ `pull request`。这就像把你绘制的壁画部分展示出来供反馈。就像在说，“嘿，我做了一些更改，有人能看看吗？”\n\n为什么要 `pull request`（`PR`）？这让你的团队可以看到你做了什么，提供建议，或表示它已准备好成为主网站的一部分。这一步非常适合从团队其他成员那里获得反馈：\n\
  \n![图 4.3 – GitHub flow – 打开 PR](img/B21847_04_3.jpg)\n图 4.3 – GitHub flow – 打开\
  \ PR\n\n打开一个 `PR` 就像对你的工作进行小型庆祝，同时也是头脑风暴。它让你的努力变成团队的努力，将每个人的才华汇聚在一起，使你的单页作品集网站变得尽可能出色！\n\
  \n## 团队合作 – 讨论和审查 PR\n\n你的朋友们查看你的新技能部分。假设有人建议 Add more color here 或 Align this text\
  \ better。他们可能会给你一些关于如何添加测试或遵循哪些命名约定的建议。这都是关于共同工作和相互学习。根据这些反馈，你调整你的部分。你所做的每一次更改都会在\
  \ `PR` 中更新：\n\n![图 4.4 – GitHub Flow – 开始代码审查](img/B21847_04_4.jpg)\n图 4.4 – GitHub\
  \ Flow – 开始代码审查\n\n## 批准 PR\n\n一旦每个人都对建议的更改和改进感到满意，并喜欢技能部分，就该将其定稿并正式成为网站的一部分了：\n\
  \n![图 4.5 – GitHub Flow – PR 批准](img/B21847_04_5.jpg)\n图 4.5 – GitHub Flow – PR\
  \ 批准\n\n## 正式化 – 合并 PR\n\n一旦你的更改经过审查并获得批准，你就可以合并 `PR`。这意味着你的更改将被添加到主项目中。就像在说，“好的，这些更改可以了！”\n\
  \n现在，你的技能部分已准备好在网站上上线：\n\n![图 4.6 – GitHub Flow – 将 PR 合并到主分支](img/B21847_04_6.jpg)\n\
  图 4.6 – GitHub Flow – 将 PR 合并到主分支\n\n## 清理时间\n\n合并后，你可以删除你工作的分支。这有点像在完成项目后清理工作区。但不用担心——你的更改历史仍然被保存。\n\
  \n\n\nAnd that’s it! By following these simple steps, you’ve learned how to use\
  \ GitHub to build something amazing with your friends. Using GitHub Flow, you and\
  \ your friends can work on different parts of your one-page portfolio website simultaneously\
  \ and efficiently. Each branch is a playground for new ideas, and PRs are where\
  \ those ideas get polished and readied for the world to see. It’s a smooth, collaborative\
  \ process that helps keep your project organized and moving forward!\n\n# 实践中理解\
  \ GitHub Flow – 两名开发者、两个功能、一个项目\n\n让我们通过一个例子来探索 GitHub Flow 的工作原理，例子中有两位开发者 Alex\
  \ 和 Jamie，他们正在合作改进一个网站的项目。他们各自负责不同的功能，并使用 GitHub Flow 来无缝管理他们的贡献。\n\n`main` 分支始终是创建功能分支的起点。这是项目的稳定版本，就像建筑物的地基一样。Alex\
  \ 和 Jamie 都将从这里开始工作。\n\n*让我们试着解释这个步骤**一步一步**。*\n\nAlex 需要添加一个联系表单。他们从 `main` 分支创建名为\
  \ `feature/contact-form` 的分支。这个分支是他们的 workspace。\n\n当 Alex 在之前创建的新功能分支上工作时，Jamie\
  \ 在名为 `feature/gallery` 的分支上开始了一个画廊功能：\n\n![图 4.7 – GitHub Flow – 分支创建](img/B21847_04_7.jpg)\
  \ \n\n图 4.7 – GitHub Flow – 分支创建\n\nAlex 和 Jamie 都在编写他们的功能，定期将更改提交到他们的功能分支。这些提交就像他们工作中的检查点：\n\
  \n![图 4.8 – GitHub Flow – 添加和提交文件](img/B21847_04_8.jpg) \n\n图 4.8 – GitHub Flow\
  \ – 添加和提交文件\n\n一旦联系表单运行良好，Alex 就将他们的分支推送到 GitHub。他们在 GitHub 上创建了一个 PR，要求将 `feature/contact-form`\
  \ 合并到 `main` 分支中。这就像说，“*嘿团队，我认为它已准备好成为我们**主要项目**的一部分。*”\n\n团队审查 Alex 的工作。一旦获得批准，PR\
  \ 就合并到 `main` 分支中。`feature/contact-form` 分支被删除以清理分支。`main` 分支现在包含新的联系表单功能：\n\n![图\
  \ 4.9 – GitHub Flow – 推送分支、在 GitHub 上创建 PR 并合并 PR](img/B21847_04_9.jpg) \n\n图 4.9\
  \ – GitHub Flow – 推送分支、在 GitHub 上创建 PR 并合并 PR\n\n在 Alex 合并其联系表单后，Jamie 拉取最新的 `main`\
  \ 分支以更新 `feature/gallery`。此步骤可确保 Jamie 的分支是最新的，从而降低冲突风险。Jamie 继续在画廊上工作，对其分支进行提交：\n\
  \n![图 4.10 – GitHub Flow – 将本地仓库与最新的 main 分支同步](img/B21847_04_10.jpg) \n\n图 4.10\
  \ – GitHub Flow – 将本地仓库与最新的 main 分支同步\n\n满意后，Jamie 将其分支推送到 GitHub 并打开一个 PR 以合并到\
  \ `main` 分支。团队审查 Jamie 的画廊功能。他们可能会提出更改或改进建议。在进行任何最终调整并获得团队批准后，Jamie 的画廊功能将被合并到 `main`\
  \ 分支中：\n\n![图 4.11 – GitHub Flow – 在 GitHub 上创建 PR 并合并它](img/B21847_04_11.jpg) \n\
  \n图 4.11 – GitHub Flow – 在 GitHub 上创建 PR 并合并它\n\n这种流程的结果是什么？一个协作增强的项目。\n\n`main`\
  \ 分支现在包含 Alex 的联系表单和 Jamie 的画廊，因为它们已被无缝集成。通过定期使用最新的 `main` 分支更新他们的功能分支，Alex 和 Jamie\
  \ 避免了合并冲突，使集成更加顺畅。PR 的使用允许团队提供意见和审查，确保项目的高质量增添。\n\n通过 GitHub Flow，Alex 和 Jamie 能够独立地在他们的功能上工作，同时确保他们的工作与不断发展的项目保持一致。这种方法鼓励协作，保持项目稳定，并确保新功能顺利集成：\n\
  \n![图 4.12 – GitHub Flow – 包含所有功能分支的实际 main](img/B21847_04_12.jpg) \n\n图 4.12 –\
  \ GitHub Flow – 包含所有功能分支的实际 main\n\n你现在已经看到了 GitHub Flow 在实践中如何运作，两名开发者在不同的功能上工作并保持项目井然有序。此过程有助于保持顺畅的工作流程，并确保新功能集成时不会破坏主项目。\n\
  \n接下来，让我们学习如何通过克隆来创建存储库的本地副本。此步骤对于在计算机上本地处理项目至关重要。我们将逐步介绍克隆存储库的过程，以便你立即开始进行更改并为项目做出贡献。\n\
  \n# 创建存储库的本地副本（克隆）\n\n如果你还没有从 GitHub 克隆你的存储库 **My First Repo**，现在就是这样做的时机。在 *第 2\
  \ 章* 中，我们解释了如何从 GitHub 克隆存储库，但让我们在这里快速回顾一下。\n\n你将要处理一个单页作品集网站，并且需要添加左侧菜单、个人资料图片、社交图标以及一些\
  \ CSS 样式。让我们从克隆项目到添加和提交更改的步骤开始。\n\n## 克隆项目\n\n按照以下步骤操作：\n\n1.  **导航到 GitHub 上的 Code\
  \ 选项卡**：在 GitHub 上找到你的项目存储库：\n\n![图 4.13 – GitHub 存储库](img/B21847_04_13.jpg) \n\n\
  图 4.13 – GitHub 存储库\n\n1.  **克隆存储库**：点击 **Clone** 或 **Download** 按钮并复制提供的 URL：\n\
  \n![图 4.14 – GitHub 存储库克隆 URL](img/B21847_04_14.jpg) \n\n图 4.14 – GitHub 存储库克隆 URL\n\
  \n1.  **打开 Git Bash 或使用你的终端**：在你的计算机上打开 Git Bash 应用程序或终端。\n\n2.  **运行 git clone**：输入\
  \ `git clone <CLONE-URL>`，将 `<CLONE-URL>` 替换为你复制的 URL。此命令会将存储库的完整副本下载到你的本地机器：\n\n\
  ![图 4.15 – 运行 git clone 命令](img/B21847_04_15.jpg) \n\n图 4.15 – 运行 git clone 命令\n\
  \n1.  **更改目录**：输入 `cd <REPOSITORY-NAME>`，将 `<REPOSITORY-NAME>` 替换为你刚刚克隆的存储库的名称。这将使你进入存储库的目录：\n\
  \n![图 4.16 – 进入你的新存储库文件夹](img/B21847_04_16.jpg) \n\n图 4.16 – 进入你的新存储库文件夹\n\n现在我们已经克隆了项目，让我们切换到正确的分支。\n\
  \n## 切换到正确的分支\n\n按照以下步骤操作：\n\n1.  **列出所有分支**：输入 `git branch -a` 以查看所有可用的分支，包括本地和远程：\n\
  \n![图 4.17 – 运行 git branch -a 命令列出所有分支](img/B21847_04_17.jpg) \n\n图 4.17 – 运行 git\
  \ branch -a 命令列出所有分支\n\n1.  **切换分支**：如果需要处理特定分支，请使用 `git switch <BRANCH-NAME>`，将\
  \ `<BRANCH-NAME>` 替换为要切换到的分支名称。如果需要创建新分支，则使用 `git switch -c <BRANCH-NAME>`：\n\n\
  ![图 4.18 – 运行 git switch 命令创建新分支并切换到它](img/B21847_04_18.jpg) \n\n图 4.18 – 运行 git\
  \ switch 命令创建新分支并切换到它\n\n现在你已成功从 GitHub 克隆了项目并切换到正确的分支，你可以开始添加新文件、网站的各个部分以及不同的样式。在下一节中，你将开始构建你的单页作品集网站。\n\
  \n# 向本地存储库添加和提交文件\n\n\n\n现在你已经克隆了仓库并切换到正确的分支，可以开始构建你的单页作品集网站了。在本动手实践部分，你将创建一个左侧菜单，添加个人资料图片和一些社交图标，并使用\
  \ CSS 对所有内容进行样式设置。你希望这些更改能被记录在你的本地 Git 仓库中。\n\n## 将新文件添加到 Git\n\n在本动手实践部分，我们将向 `index.html`\
  \ 文件添加一些 HTML 代码以替换欢迎文本。\n\n使用你喜欢的代码编辑器在 `index.html` 文件中进行更改。你可以使用 Visual Studio\
  \ Code，这是一款由 Microsoft 创建的免费代码编辑器。你可以从 [`code.visualstudio.com/download`](https://code.visualstudio.com/download)\
  \ 下载并在本地安装。在 *第 8 章* 中，*实用工具和 Git 命令*，我们将更多地谈论 Visual Studio Code 及其酷炫功能。\n\n现在，你可以用以下代码替换文件的内容：\n\
  \n![图 4.19 – 网站代码](img/B21847_04_19.jpg)\n图 4.19 – 网站代码\n\n将 **John Doe** 替换为你的姓名。完成此操作后，你可以向名为\
  \ `styles.css` 的新文件添加一些 CSS。\n\n以下是你将用于 `styles.css` 文件的代码片段：\n\n![图 4.20 – 网站的\
  \ CSS 样式](img/B21847_04_20.jpg)\n图 4.20 – 网站的 CSS 样式\n\n保存 `index.html` 和 `styles.css`\
  \ 文件后，你可以在浏览器中运行 `index.html`。你应该会看到类似以下内容的页面：\n\n![图 4.21 – 单页作品集网站 – 左侧菜单](img/B21847_04_21.jpg)\n\
  图 4.21 – 单页作品集网站 – 左侧菜单\n\n## 了解 Git 中的“检查未跟踪文件”\n\n**未跟踪文件**是什么？在使用 Git 时，它会监视项目目录中的文件。但当你添加新文件或进行\
  \ Git 从未见过的更改时，它会将它们标记为 *未跟踪*。\n\n### 为什么是“未跟踪”？\n\n**未跟踪** 表示 GitHub 仓库中的新文件或已更改的文件。Git\
  \ 看到了这些文件，但尚未被告知要跟踪它们。它们就像 Git 当前对项目的理解中的陌生人。由于 Git 尚未在历史记录中记录这些文件，因此它们不是仓库时间线的一部分。\n\
  \n### 检查未跟踪文件\n\n这个命令就像是在问 Git，“*嘿，**我的项目？** 中的文件发生了什么？*”\n\n输入 `git status`。你会看到你创建或更改的文件列为\
  \ *未跟踪*（Git 知道它们存在，但它们尚未成为项目历史的一部分）。\n\nGit 会返回一个显示文件状态的列表。未跟踪文件通常会被突出显示或明确标记：\n\
  \n![图 4.22 – 运行 git status 命令](img/B21847_04_22.jpg)\n图 4.22 – 运行 git status 命令\n\
  \n### 为什么要检查未跟踪文件？\n\n它有助于查看项目中 Git 尚未开始跟踪的新内容或更改。你可能不想跟踪每个文件（例如临时文件或个人笔记）。检查未跟踪文件可以让你决定将哪些文件添加到\
  \ Git。\n\n检查未跟踪文件会显示你添加的新元素（例如左侧菜单、个人资料图片和社交图标）以及你修改的任何 CSS 文件。这就像在决定要包含在项目官方历史中的内容之前，对新内容或更改进行盘点。\n\
  \n## 将新文件更改添加到 Git 暂存区\n\n*添加到 Git* 是什么意思？你的 Git 仓库就像你项目的数字剪贴簿。当你向 Git *添加* 文件时，你是在告诉\
  \ Git，“*嘿，我希望这些新部件（你的菜单、图片、图标等等）成为我项目剪贴簿的一部分。*”你是在将其标记为包含在下一个快照中。\n\n### 如何添加文件？\n\
  \n如果你只想添加一个文件，例如 `index.html`，你需要输入 `git add index.html`：\n\n![图 4.23 – 运行 git add\
  \ index.html 添加索引](img/B21847_04_23.jpg)\n图 4.23 – 运行 git add index.html 添加索引\n\n\
  如果你想添加所有新文件或更改的文件，输入 `git add .`：\n\n![图 4.24 – 添加所有文件](img/B21847_04_24.jpg)\n\
  图 4.24 – 添加所有文件\n\n这里，`.` 告诉 Git 将所有新文件和已修改文件包含到暂存区。一旦你添加了文件，它们就会移动到 **暂存区**。把暂存区想象成一个提交前的暂存区。就像你在说，“*这些是我希望在我的**下一个快照**中被记住的文件。*”\n\
  \n添加文件后，你的更改就可以提交了。提交就像在剪贴簿中把所有东西粘牢，使布局永久化。将新文件添加到 Git 就像选择你希望永久包含在项目历史中的新项目。这是在组织和跟踪作品集网站演变过程中的关键步骤。你可以再次输入\
  \ `git status` 来查看所有已添加到暂存区的文件：\n\n![图 4.25 – 在所有文件都已添加到暂存区后运行 git status](img/B21847_04_25.jpg)\n\
  图 4.25 – 在所有文件都已添加到暂存区后运行 git status\n\n现在我们知道了如何在本地 Git 仓库中添加和暂存文件，我们将学习 Git 的不同区域，例如工作区、暂存区和仓库本身。我们还将介绍如何将更改推送到\
  \ GitHub，以便每个人都能看到你所做的更新。这样，你就能完整了解你的工作如何从本地机器进展到可供协作者访问。\n\n## 了解 Git 的工作区、暂存区、历史记录以及将更改推送到\
  \ GitHub\n\n当你为项目（如你的单页作品集网站）使用 Git 时，将 Git 想象成有三个主要区域会有所帮助。把它们想象成工作坊中的空间，在那里项目的不同阶段会发生。\n\
  \n### 工作区（或工作目录）——它是什么？\n\n这里是你进行所有工作的地方——即创建、编辑、删除和组织文件。它就像你的编码工作区，一切都摆在你面前。当你在作品集中添加文本、选择字体或调整布局时，你就在工作区中：\n\
  \n![图 4.26 – Git 阶段 – 工作区](img/B21847_04_26.jpg)\n图 4.26 – Git 阶段 – 工作区\n\n### 暂存区（或索引）——它是什么？\n\
  \n这是在更改成为项目历史的一部分之前准备更改的区域。把它想象成一个等候室，在那里你收集和审查更改。\n\n假设你已向作品集添加了一个新部分并修复了一个拼写错误。你对这些更改感到满意，并希望它们成为下一个快照的一部分。你使用\
  \ `git add` 将这些更改移动到暂存区：\n\n![图 4.27 – Git 阶段 – 暂存区](img/B21847_04_27.jpg)\n图 4.27\
  \ – Git 阶段 – 暂存区\n\n### 历史记录（或仓库）\n\n这里存储了所有快照（提交）。它充当你所做的每一次更改的记录，安全地保存在项目历史中。\n\
  \n暂存更改后，你提交它们。此过程会拍摄暂存区的快照并将其存储在历史记录中。这就像在完成项目的重要部分后拍摄工作台的照片并将其放入相册中。要创建更改的历史记录，你可以使用\
  \ `git commit -m \"your commit message\"` 命令。\n\nTip\n请记住，你应始终编写简短的提交信息，长度约为 50\
  \ 个字符。\n\n仔细描述提交中引入的更改，以便你的团队更好地了解提交的内容。这里的最后一步是使用 `git push` 命令将更改推送到远程 GitHub\
  \ 仓库。\n\n### 将更改推送到 GitHub\n\n\n\n你已经完成了你的单页作品集网站，并且刚刚完成了新的左侧菜单并为其添加了链接和社交图标。你在本地的\
  \ `feature/leftside-menu` 分支中完成了修改。现在，你希望这些更改能在 GitHub 上可用，以便他人查看或贡献。这就是 `git push`\
  \ 发挥作用的地方。\n\n通常，你只需输入 `git push`，这会告诉 Git 你想要将提交从本地仓库传输到远程仓库（如 GitHub）。\n\n在这种情况下，你会收到一条错误信息，提示你无法推送到远程仓库，因为你在本地创建的分支在\
  \ GitHub 仓库中仍然不存在：\n\n![图 4.28 – 运行 git push 命令](img/B21847_04_28.jpg)\n图 4.28 –\
  \ 运行 git push 命令\n\n如你所见，该消息还提供了如何使用 `--set-upstream` 将本地功能分支推送到远程仓库并设置上游的说明。这就像为未来的推送设置默认路径。你是在告诉\
  \ Git，“*嘿，下次我从此分支推送更改时，我希望它们去同一个地方，而无需我再次指定。*”\n\n命令的下一部分是 `origin`。这是 Git 为你克隆的远程仓库默认命名的名称。在大多数情况下，`origin`\
  \ 只是你 GitHub 仓库 URL 的简写，而 `feature/leftside-menu` 是你的分支名称。你是在指定想要推送此分支的提交。\n\n##\
  \ 运行此命令时会发生什么？\n\n通过使用 `--set-upstream`，你是在本地分支 `feature/leftside-menu` 与 GitHub\
  \ 上的分支（`origin`）之间建立链接。如果该分支在 GitHub 上尚不存在，此命令将为你创建它。\n\nGit 会将你在 `feature/leftside-menu`\
  \ 分支中所做的所有提交上传到 GitHub，并将其放在同名分支中。\n\n一旦你设置过上游，你就可以在 `feature/leftside-menu` 分支中使用\
  \ `git push`，Git 就知道将更改发送到哪里。那么，让我们在终端中运行此命令，看看会发生什么：\n\n![图 4.29 – 推送到远程的 Git](img/B21847_04_29.jpg)\n\
  图 4.29 – 推送到远程的 Git\n\n通过将分支推送到 GitHub，你让团队成员可以看到你的新左侧菜单、提供反馈或添加自己的调整。\n\n如你所见，我们的新功能分支已在\
  \ GitHub 中创建，并且所有对文件的更改都已随分支一起推送。GitHub 已为我们提供了一条消息，提示访问 <YOUR-REPOSITORY-URL>/MyFirstRepo/pull/new/feature/leftside-menu。这就是我们应该创建\
  \ PR 的地方。\n\n现在，你可以创建 PR 将其合并到主项目中，将你时尚的左侧菜单集成到主要的作品集网站中。\n\n## 这些区域为什么重要？\n\n这些区域帮助你组织工作。你可以在工作区中进行实验，在暂存区决定喜欢哪些更改，并在历史记录中保存最佳工作。这种分离让你能够控制项目的演进。你可以进行更改、尝试新事物，并且只提交你确定的那些。如果出现问题，你始终可以回到历史记录中的先前状态。\n\
