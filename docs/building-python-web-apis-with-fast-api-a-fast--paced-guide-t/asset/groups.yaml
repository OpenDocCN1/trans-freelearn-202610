    \nNext, we create a database transaction using the Session class:\n\n```\nwith\
    \ Session(engine) as session:\n    session.add(new_event)\n    session.commit()\n\
    ```\n\nThe preceding operation may seem alien to you. Let’s look at what the Session\
    \ class is and what it does.\n\n# Sessions\n\nA session object handles the interaction\
    \ from code to a database. It primarily acts as an intermediary in executing operations.\
    \ The Session class takes an argument that is the instance of a SQL engine.\n\n\
    Now that we have learned how tables and rows are created, we will look at how\
