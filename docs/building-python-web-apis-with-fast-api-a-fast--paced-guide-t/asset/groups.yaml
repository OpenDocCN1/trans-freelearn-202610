    到本章结束时，你将知道如何使用 **APIRouter** 实例创建路由并连接到主 **FastAPI** 应用程序。你还将了解模型是什么以及如何使用它们来验证请求体。你还将了解路径和查询参数是什么以及如何在\
    \ FastAPI 应用程序中使用它们。FastAPI 中路由的知识对于构建小型和大型规模的应用程序至关重要。\n\n在本章中，我们将介绍以下主题：\n\n\
