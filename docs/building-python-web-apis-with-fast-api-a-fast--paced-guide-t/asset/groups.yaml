    \ in this chapter include the following:\n\n+   - add(): This method is responsible\
    \ for adding a database object to memory pending further operations. In the previous\
    \ code block, the new_event object is added to the session’s memory, waiting to\
    \ be committed into the database by the commit() method.\n+   - commit(): This\
    \ method is responsible for flushing transactions present in the session.\n+ \
    \  - get(): This method takes two parameters – the model and the ID of the document\
    \ requested. This method is used to retrieve a single row from a database.\n\n\
    Now that we know how to create tables, rows, and columns, as well as insert data\
