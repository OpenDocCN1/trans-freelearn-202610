    \n路由是通过首先定义一个装饰器来指示操作类型，然后是一个包含在调用此路由时要执行的操作的函数来创建的。在以下示例中，我们将创建一个仅接受 GET 请求的\
    \ \"/\" 路由，并在访问时返回欢迎消息：\n\n```\n@app.get(\"/\")\nasync def welcome() -> dict:\n\
