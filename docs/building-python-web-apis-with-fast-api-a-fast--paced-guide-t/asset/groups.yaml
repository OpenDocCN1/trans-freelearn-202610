    # Technical requirements


    To follow along, the MongoDB database component is required. The installation
    procedures for your operating system can be found in their official documentation.
    The code used in this chapter can be found at https://github.com/PacktPublishing/Building-Python-Web-APIs-with-FastAPI/tree/main/ch06/planner.


    # Setting up SQLModel


    The first step to integrate a SQL database into our planner application is to
    install the SQLModel library. The SQLModel library was built by the creator of
    FastAPI and is powered by Pydantic and SQLAlchemy. Support from Pydantic will
    make it easy for us to define models, as we learned in Chapter 3, Response Models
    and Error Handling.


    Since we’ll be implementing both SQL and NoSQL databases, we’ll create a new GitHub
    branch for this section. In your terminal, navigate to the project directory,
    initialize a GitHub repository, and commit the existing files:


    ```

    $ git init

    $ git add database models routes main.py

    $ git commit -m "Committing bare application without a database"

    ```


    Next, create a new branch:


    ```

    $ git checkout -b planner-sql

    ```


    Now, we are ready to set up SQLModel in our application. From your terminal, activate
    the virtual environment and install the SQLModel library:


    ```

    $ source venv/bin/activate

    (venv)$ pip install sqlmodel

    ```


    Before diving into adding a database to our planner application, let’s look at
    some of the methods contained in SQLModel that we’ll be using in this chapter.


    # Tables


    A table is essentially an object that contains data stored in a database – for
    example, events data will be stored in an event table. The table will consist
    of columns and rows where the data will eventually be stored.'
