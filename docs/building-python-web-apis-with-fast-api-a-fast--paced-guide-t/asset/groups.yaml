  md: "\nThis command starts the services in detached mode:\n\n![](img/85e42522e1d8d05fd8b981490d6d9056_200_0.png)\n\
    \nThe application services have been created and deployed. Let’s verify by checking\
    \ the list of containers running:\n\n```\n(venv) $ docker ps\n```\n\nThe result\
    \ is as follows:\n\n![](img/85e42522e1d8d05fd8b981490d6d9056_200_1.png)\n\nThe\
    \ command returns the list of containers running alongside ports in which they\
    \ can be accessed. Let’s test the working state by sending a GET request to the\
    \ deployed application:\n\n```\n(venv)$ curl -X 'GET' \\\n  'http://localhost:8080/event/'\
    \ \\\n  -H 'accept: application/json'\n```\n\nWe get the following response:\n\
    \n```\n[]\n```\n\nGreat! The deployed application works correctly. Let’s verify\
    \ that the database works as well by creating a user:\n\n```\n(venv)$ curl -X\
    \ 'POST' \\\n  'http://localhost:8080/user/signup' \\\n  -H 'accept: application/json'\
    \ \\\n  -H 'Content-Type: application/json' \\\n  -d '{\n\"email\": \"fastapi@packt.com\"\
    ,\n\"password\": \"strong!!!\"\n}'\n```\n\nWe get a positive response as well:\n\
    \n```\n{\n  \"message\": \"User created successfully\"\n}\n```\n\nNow that we\
    \ have tested both routes, you can go ahead to test the other routes. To stop\
    \ the deployment server after exploring, the following command is run from the\
    \ root directory:\n\n```\n(venv)$ docker-compose down\n```\n\nThe result is as\
    \ follows:\n\n![](img/85e42522e1d8d05fd8b981490d6d9056_202_0.png)\n\nFigure 9.5\
    \ – Stopping application instances\n\n## Deploying Docker images\n\nIn the last\
    \ section, we learned how to build and deploy Docker images locally. These images\
    \ can be deployed on any virtual machine and on serverless platforms such as Google\
    \ Cloud and AWS.\n\nThe regular mode of operation involves pushing your Docker\
    \ images to a private registry on the serverless platform. The process involved\
    \ in deploying Docker images on serverless platforms varies from provider to provider\
    \ and, as a result, the links to select serverless service providers have been\
    \ provided here:\n\n+   - Google Cloud Run: https://cloud.google.com/run/docs/quickstarts/build-and-deploy/python\n\
    +   - Amazon EC2: https://docs.aws.amazon.com/AmazonECS/latest/developerguide/getting-started-ecs-ec2.html\n\
    +   - Deploying to Microsoft Azure: https://docs.microsoft.com/en-us/azure/container-instances/container-instances-tutorial-deploy-app\n\
    \n## Deploying databases\n\nPlatforms such as Google Cloud, AWS provide the option\
    \ to host your database containers. However, this might be expensive in terms\
    \ of running cost and overall manageability.\n\nFor platforms that do not support\
    \ the deployment of docker-compose manifests, the MongoDB database can be hosted\
    \ on MongoDB Atlas (https://www.mongodb.com/atlas/database) and the DATABASE_URL\
    \ environment variable overwritten with the connection string. A detailed guide\
    \ on setting up a database on MongoDB atlas can be found at https://www.mongodb.com/docs/atlas/getting-started/.\n\
    \n## Summary\n\nIn this chapter, you learned how to prepare your application for\
    \ deployment. You started by updating the dependencies used for the application\
    \ and saving them in the requirements.txt file before moving on to managing the\
    \ environment variables used for the API.\n\nWe also covered the steps involved\
    \ in deploying an application to production: building the Docker image from the\
