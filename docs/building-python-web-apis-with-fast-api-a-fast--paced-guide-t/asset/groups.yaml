    # Git operations


    As mentioned earlier, Git can be used to record, track, and revert to earlier
    versions of a file. However, only the basic operations of Git will be used in
    this book and will be introduced in this section.


    In order for Git to run properly, folders housing files must be initialized. Initializing
    folders enables Git to keep track of the content except otherwise exempted.


    To initialize a new Git repository in your project, you need to run the following
    command in your terminal:


    ```

