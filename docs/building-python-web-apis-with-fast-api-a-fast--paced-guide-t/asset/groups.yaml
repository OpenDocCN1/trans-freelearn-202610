    # Deploying databases


    Platforms such as Google Cloud, AWS provide the option to host your database containers.
    However, this might be expensive in terms of running cost and overall manageability.


    For platforms that do not support the deployment of docker-compose manifests,
    the MongoDB database can be hosted on MongoDB Atlas (https://www.mongodb.com/atlas/database)
    and the DATABASE_URL environment variable overwritten with the connection string.
    A detailed guide on setting up a database on MongoDB atlas can be found at https://www.mongodb.com/docs/atlas/getting-started/.


    # Summary


    In this chapter, you learned how to prepare your application for deployment. You
    started by updating the dependencies used for the application and saving them
    in the requirements.txt file before moving on to managing the environment variables
    used for the API.


    We also covered the steps involved in deploying an application to production:
    building the Docker image from the Dockerfile, configuring the compose manifest
    for the API and database services, and then deploying the application. You also
    learned new commands to check the list of running containers as well as start
    and stop Docker containers. Finally, you tested the application to ensure the
    deployment was successful.


    This marks the end of this book, and you should now be ready to build, test, and
    deploy a FastAPI application on the web. We covered various concepts and ensured
    that each concept is properly discussed with adequate examples: routing, templating,
    authentication, connecting to the database, and deploying the application. Be
    sure to check out the external resources mentioned occasionally in the book to
    gain more knowledge!'
