    \ CRUD 应用\n\n## 技术要求\n\n本章使用的代码可以在 https://github.com/PacktPublishing/Building-Python-Web-APIs-with-FastAPI/tree/main/ch02/todos\
    \ 找到。\n\n## 理解 FastAPI 中的路由\n\n路由被定义为接受来自 HTTP 请求方法的请求，并可选地接受参数。当请求发送到路由时，应用程序会在路由处理程序中处理请求之前检查路由是否已定义。另一方面，路由处理程序是一个处理发送到服务器的请求的函数。路由处理程序的一个例子是一个函数，当请求通过路由发送到路由器时从数据库检索记录。\n\
    \n> **什么是 HTTP 请求方法？**\n> HTTP 方法是用于指示要执行的操作类型的标识符。标准方法包括 GET、POST、PUT、PATCH 和\
    \ DELETE。你可以在 https://developer.mozilla.org/en-US/docs/Web/HTTP/Methods 了解更多关于\
    \ HTTP 方法的信息。\n\n## 路由示例\n\n在上一章的 *项目脚手架* 部分中，我们构建了一个单路由应用程序。路由由在 app 变量中初始化的\
    \ FastAPI() 实例处理：\n\n```\nfrom fastapi import FastAPI\n\napp = FastAPI()\n\n@app.get(\"\
    /\")\nasync def welcome() -> dict:\n    return { \"message\": \"Hello World\"\
    }\n```\n\n**uvicorn** 工具指向 FastAPI 的实例以提供应用程序服务：\n\n```\n(venv)$ uvicorn api:app\
    \ --port 8080 --reload\n```\n\n传统上，FastAPI () 实例可用于路由操作，如前所述。然而，这种方法通常用于路由期间需要单个路径的应用程序。在使用\
    \ FastAPI () 实例创建执行唯一功能的单独路由的情况下，应用程序将无法同时运行这两个路由，因为 uvicorn 只能运行一个入口点。\n\n那么如何处理需要一系列执行不同功能的路由的庞大应用程序呢？我们将在下一节中了解\
    \ APIRouter 类如何帮助进行多路由。\n\n## 使用 APIRouter 类进行路由\n\nAPIRouter 类属于 FastAPI 包并为多个路由创建路径操作。APIRouter\
    \ 类鼓励应用程序路由和逻辑的模块化和组织。\n\nAPIRouter 类从 fastapi 包导入，并创建实例。路由方法从创建的实例创建和分发，如下所示：\n\
