    # Eliminating repetition with pytest fixtures


    Fixtures are reusable functions defined to return the data needed in test functions.


    Fixtures are decorated with the pytest.fixture decorator. An example use case
    of a fixture is returning an applications instance to execute tests for the API
    endpoints.


    A fixture can be used to define the application client that is returned and used
    in test functions, eliminating the need to redefine the application instance in
    every test. We shall see how this is used in the Writing tests for REST API endpoints
    section.


    Let’s look at an example:


    ```

    import pytest


    from models.events import EventUpdate

    ```'
