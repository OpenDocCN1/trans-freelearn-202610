    # 4


    # Templating in FastAPI


    Now that we have learned how to handle responses from requests including errors
    in the previous chapter, we can proceed to render the responses from the request
    on a web page. In this chapter, we will learn how to render responses from our
    API to a web page using templates powered by Jinja, which is a templating language
    written in Python designed to help the rendering process of API responses.


    Templating is the process of displaying the data gotten from the API in various
    formats. Templates act as a frontend component in web applications.


