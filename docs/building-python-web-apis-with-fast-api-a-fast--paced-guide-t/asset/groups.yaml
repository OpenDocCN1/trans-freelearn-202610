    \ This activity is called **Dependency Injection.**\n\n# Dependency injection\n\
    \nDependency injection is a pattern where an object – in this case, a function\
    \ – receives an instance variable needed for the further execution of the function.\n\
    \nIn FastAPI, dependencies are injected by declaring them in the path operation\
    \ function arguments. We have been using dependency injection in previous chapters.\
