    (venv)$ pip install jinja2

    (venv)$ mkdir templates

    ```


    2. In the newly created folder, create two new files, home.html and todo.html:


    ```

    (venv)$ cd templates

    (venv)$ touch {home,todo}.html

    ```


    In the preceding command block, we have created two template files:


    +   - home.html for the application’s home page

    +   - todo.html for the todo page


    In the mockup in Figure 4.1, the inner box denotes the todo template while the
    bigger box is the homepage template.'
  md: "\n## Understanding Jinja\n\n**Jinja** is a templating engine written in Python\
    \ designed to help the rendering process of API responses. In every templating\
    \ language, there are variables that get replaced with the actual values passed\
    \ to them when the template is rendered, and there are tags that control the logic\
    \ of the template.\n\nThe Jinja templating engine makes use of curly brackets\
    \ { } to distinguish its expressions and syntax from regular HTML, text and any\
    \ other variable in the template file.\n\nThe {{ }} syntax is called a **variable\
    \ block**. The {% %} syntax houses control structures such as **if/else, loops,\
    \ and macros**.\n\nThe three common syntax blocks used in the Jinja templating\
    \ language include the following:\n\n- `{% ... %}` – This syntax is used for statements\
    \ such as control structures.\n- `{{ todo.item }}` – This syntax is used to print\
    \ out the values of the expressions passed to it.\n- `{# This is a great API book!\
    \ #}` – This syntax is used when writing comments and is not displayed on the\
    \ web page.\n\nJinja template variables can be of any Python type or object if\
    \ they can be converted into strings. A model, list, or dictionary type can be\
    \ passed to the template and have its attributes displayed by placing these attributes\
    \ in the second block listed previously.\n\nIn the next section, we’ll be looking\
    \ at filters. Filters are an important part of every templating engine and in\
    \ Jinja, filters enable us to execute certain functions such as joining values\
    \ from a list and retrieving the length of an object, among others.\n\nIn the\
    \ following subsections, we’ll be looking at some common features used in Jinja:\
    \ filters, if statements, loops, macros and template inheritance.\n\n## Filters\n\
    \nDespite the similarity between Python and Jinja’s syntax, modifications such\
    \ as joining strings, setting the first character of a string to uppercase, and\
    \ so on cannot be done using Python’s syntax in Jinja. Therefore, to perform such\
    \ modifications, we have filters in Jinja.\n\nA filter is separated from the variable\
    \ by a pipe symbol (|) and may entertain optional arguments in parentheses. A\
    \ filter is defined in this format:\n\n```\n{{ variable | filter_name(*args) }}\n\
    ```\n\nIf there are no arguments, the definition becomes the following:\n\n```\n\
    {{ variable | filter_name }}\n```\n\nLet's take a look at some common filters\
    \ in the following subsections.\n\n### The default filter\n\nThe default filter\
    \ variable is used to replace the output of the passed value if it turns out to\
    \ be None:\n\n```\n{{ todo.item | default('This is a default todo item') }}\n\
    This is a default todo item\n```\n\n### The escape filter\n\nThis filter is used\
    \ to render raw HTML output:\n\n```\n{{ \"<title>Todo Application</title>\" |\
    \ escape }}\n<title>Todo Application</title>\n```\n\n### The conversion filters\n\
    \nThese filters include int and float filters used to convert from one data type\
    \ to another:\n\n```\n{{ 3.142 | int }}\n3\n\n{{ 31 | float }}\n31.0\n```\n\n\
    ### The join filter\n\nThis filter is used to join elements in a list into a string\
    \ as in Python:\n\n```\n{{ ['Packt', 'produces', 'great', 'books!'] | join(' ')\
    \ }}\nPackt produces great books!\n```\n\n### The length filter\n\nThis filter\
    \ is used to return the length of the object passed. It fulfills the same role\
    \ as len() in Python:\n\n```\nTodo count: {{ todos | length }}\nTodo count: 4\n\
    ```\n\n> Note\n> For a full list of filters and to learn more about filters in\
    \ Jinja, visit https://jinja.palletsprojects.com/en/3.0.x/templates/#builtin-filters.\n\
    \n## Using if statements\n\nThe usage of if statements in Jinja is similar to\
    \ their usage in Python. if statements are used in the {% %} control blocks. Let's\
    \ look at an example:\n\n```\n{% if todo | length < 5 %}\n    You don't have much\
    \ items on your todo list!\n{% else %}\n    You have a busy day it seems!\n{%\
    \ endif %}\n```\n\n## Loops\n\nWe can also iterate through variables in Jinja.\
    \ This could be a list or a general function, such as the following, for example:\n\
    \n```\n{% for todo in todos %}\n    <b> {{ todo.item }} </b>\n{% endfor %}\n```\n\
    \nYou can access special variables inside a for loop, such as loop.index, which\
    \ gives the index of the current iteration. The following is a list of the special\
    \ variables and their descriptions:\n\n| Variable | Description |\n|---|---|\n\
    | loop.index | The current iteration of the loop (1 indexed) |\n| loop.index0\
    \ | The current iteration of the loop (0 indexed) |\n| loop.revindex | The number\
    \ of iterations from the end of the loop (1 indexed) |\n| loop.revindex0 | The\
    \ number of iterations from the end of the loop (0 indexed) |\n| loop.first |\
    \ True if first iteration |\n| loop.last | True if last iteration |\n| loop.length\
    \ | The number of items in the sequence |\n| loop.cycle | A helper function to\
    \ cycle between a list of sequences |\n| loop.depth | Indicates how deep in a\
    \ recursive loop the rendering currently is; starts at level 1 |\n| loop.depth0\
    \ | Indicates how deep in a recursive loop the rendering currently is; starts\
    \ at level 0 |\n| loop.previtem | The item from the previous iteration of the\
    \ loop; undefined during the first iteration |\n| loop.nextitem | The item from\
    \ the following iteration of the loop; undefined during the last iteration |\n\
    | loop.changed(*val) | True if previously called with a different value (or not\
    \ called at all) |\n\n## Macros\n\nA macro in Jinja is a function that return\
    \ an HTML string. The main use case for macros is to avoid the repetition of code\
    \ and instead use a single function call. For example, an input macro is defined\
    \ to reduce the continuous definition of input tags in an HTML form:\n\n```\n\
    {% macro input(name, value='', type='text', size=20 %}\n    <div class=\"form\"\
    >\n        <input type=\"{{ type }}\" name=\"{{ name }}\" \n        value=\"{{\
    \ value|escape }}\" size=\"{{ size }}\">\n    </div>\n{% endmacro %}\n```\n\n\
    Now, to quickly create an input in your form, the macro is called:\n\n```\n{{\
    \ input('item') }}\n```\n\nThis will return the following:\n\n```\n<div class=\"\
    form\">\n    <input type=\"text\" name=\"item\" value=\"\" size=\"20\">\n</div>\n\
    ```\n\nNow that we have learned what macros are, we will proceed to learn what\
    \ template inheritance is and how it works in FastAPI.\n\n## Template inheritance\n\
    \nJinja’s most powerful feature is the inheritance of templates. This feature\
    \ advances the **don’t repeat yourself (DRY)** principle and comes in handy in\
    \ large web applications. Template inheritance is a situation where a base template\
    \ is defined and child templates can interact, inherit, and replace defined sections\
    \ of the base template.\n\n> **Note**\n> You can learn more about Jinja’s template\
    \ inheritance at https://jinja.palletsprojects.com/en/3.0.x/templates/#template-inheritance.\n\
    \nNow that you’ve learned the basics of Jinja’s syntax, let’s learn how to use\
    \ templates in FastAPI in the next section.\n\n## Using Jinja templates in FastAPI\n\
    \nTo get started, we need to install the Jinja package and create a new folder,\
    \ `templates`, in our project directory. This folder will store all our Jinja\
    \ files, which are HTML files mixed with Jinja’s syntax. Since this book does\
    \ not focus on user interface design, we will be making use of the CSS `Bootstrap`\
    \ library and avoid writing our own styles.\n\nThe Bootstrap library will be downloaded\
    \ from the CDN upon page load. However, extra assets can be stored in a different\
    \ folder. We will look into serving static files in the next chapter.\n\nWe’ll\
    \ start by creating the homepage template, which will house the section for creating\
    \ new todos. The following is a mockup of how we want our homepage template to\
    \ look:\n\n![](img/85e42522e1d8d05fd8b981490d6d9056_75_0.png)\n\nFigure 4.1 –\
    \ Mockup of our homepage template\n\n1. First, let’s install the Jinja package\
    \ and create the templates folder:\n\n```\n(venv)$ pip install jinja2\n(venv)$\
    \ mkdir templates\n```\n\n2. In the newly created folder, create two new files,\
    \ home.html and todo.html:\n\n```\n(venv)$ cd templates\n(venv)$ touch {home,todo}.html\n\
    ```\n\nIn the preceding command block, we have created two template files:\n\n\
    - home.html for the application’s home page\n- todo.html for the todo page\n\n\
    In the mockup in Figure 4.1, the inner box denotes the todo template while the\
    \ bigger box is the homepage template.\n"
  mdcn: "\n\n## 理解 Jinja\n\n**Jinja** 是一个用 Python 编写的模板引擎，旨在帮助 API 响应的渲染过程。在每种模板语言中，都有变量在模板渲染时会被替换为传递给它们的实际值，还有标签来控制模板的逻辑。\n\
    \nJinja 模板引擎使用花括号 { } 来区分其表达式和语法与常规 HTML、文本以及模板文件中的任何其他变量。\n\n{{ }} 语法称为 **变量块**。{%\
    \ %} 语法包含控制结构，例如 **if/else、循环和宏**。\n\nJinja 模板语言中使用的三种常见语法块包括以下内容：\n\n- `{% ...\
    \ %}` – 此语法用于语句，例如控制结构。\n- `{{ todo.item }}` – 此语法用于打印传递给它的表达式的值。\n- `{# This\
    \ is a great API book! #}` – 此语法用于编写注释，并且不会在网页上显示。\n\nJinja 模板变量可以是任何可以转换为字符串的\
    \ Python 类型或对象。可以将模型、列表或字典类型传递给模板，并通过将这些属性放在前面列出的第二个块中来显示其属性。\n\n在下一节中，我们将研究过滤器。过滤器是每个模板引擎的重要组成部分，在\
    \ Jinja 中，过滤器使我们能够执行某些函数，例如从列表中连接值和检索对象的长度等。\n\n在以下小节中，我们将研究 Jinja 中使用的一些常见功能：过滤器、if\
    \ 语句、循环、宏和模板继承。\n\n## 过滤器\n\n尽管 Python 和 Jinja 的语法相似，但诸如连接字符串、将字符串的第一个字符设为大写等修改无法使用\
    \ Jinja 中的 Python 语法完成。因此，为了执行此类修改，我们在 Jinja 中使用过滤器。\n\n过滤器与变量之间用管道符号 (|) 分隔，并且可以在括号中包含可选参数。过滤器按以下格式定义：\n\
    \n```\n{{ variable | filter_name(*args) }}\n```\n\n如果没有参数，定义变为以下内容：\n\n```\n{{\
    \ variable | filter_name }}\n```\n\n让我们在以下小节中查看一些常见过滤器。\n\n### default 过滤器\n\n\
    default 过滤器变量用于在传递的值最终为 None 时替换输出：\n\n```\n{{ todo.item | default('This is a\
    \ default todo item') }}\nThis is a default todo item\n```\n\n### escape 过滤器\n\
    \n此过滤器用于渲染原始 HTML 输出：\n\n```\n{{ \"<title>Todo Application</title>\" | escape\
    \ }}\n<title>Todo Application</title>\n```\n\n### 转换过滤器\n\n这些过滤器包括 int 和 float\
    \ 过滤器，用于从一种数据类型转换为另一种数据类型：\n\n```\n{{ 3.142 | int }}\n3\n\n{{ 31 | float }}\n\
    31.0\n```\n\n### join 过滤器\n\n此过滤器用于将列表中的元素连接成字符串，如 Python 中所示：\n\n```\n{{ ['Packt',\
    \ 'produces', 'great', 'books!'] | join(' ') }}\nPackt produces great books!\n\
    ```\n\n### length 过滤器\n\n此过滤器用于返回传递对象的长度。它在 Python 中与 len() 具有相同的功能：\n\n```\n\
    Todo count: {{ todos | length }}\nTodo count: 4\n```\n\n> Note\n> 要获取过滤器的完整列表并了解有关\
    \ Jinja 中过滤器的更多信息，请访问 https://jinja.palletsprojects.com/en/3.0.x/templates/#builtin-filters。\n\
    \n## 使用 if 语句\n\nJinja 中 if 语句的使用与 Python 中的使用相似。if 语句用于 {% %} 控制块中。让我们看一个例子：\n\
    \n```\n{% if todo | length < 5 %}\n    You don't have much items on your todo\
    \ list!\n{% else %}\n    You have a busy day it seems!\n{% endif %}\n```\n\n##\
    \ 循环\n\n我们也可以在 Jinja 中遍历变量。这可以是列表或通用函数，例如以下示例：\n\n```\n{% for todo in todos %}\n\
    \    <b> {{ todo.item }} </b>\n{% endfor %}\n```\n\n你可以在 for 循环中访问特殊变量，例如 loop.index，它给出当前迭代的索引。以下是特殊变量及其描述的列表：\n\
    \n| Variable | Description |\n|---|---|\n| loop.index | The current iteration\
    \ of the loop (1 indexed) |\n| loop.index0 | The current iteration of the loop\
    \ (0 indexed) |\n| loop.revindex | The number of iterations from the end of the\
    \ loop (1 indexed) |\n| loop.revindex0 | The number of iterations from the end\
    \ of the loop (0 indexed) |\n| loop.first | True if first iteration |\n| loop.last\
    \ | True if last iteration |\n| loop.length | The number of items in the sequence\
    \ |\n| loop.cycle | A helper function to cycle between a list of sequences |\n\
    | loop.depth | Indicates how deep in a recursive loop the rendering currently\
    \ is; starts at level 1 |\n| loop.depth0 | Indicates how deep in a recursive loop\
    \ the rendering currently is; starts at level 0 |\n| loop.previtem | The item\
    \ from the previous iteration of the loop; undefined during the first iteration\
    \ |\n| loop.nextitem | The item from the following iteration of the loop; undefined\
    \ during the last iteration |\n| loop.changed(*val) | True if previously called\
    \ with a different value (or not called at all) |\n\n## 宏\n\nJinja 中的宏是一个返回 HTML\
    \ 字符串的函数。宏的主要用例是避免代码重复，而是使用单个函数调用。例如，定义输入宏是为了减少在 HTML 表单中连续定义输入标签：\n\n```\n{%\
    \ macro input(name, value='', type='text', size=20 %}\n    <div class=\"form\"\
    >\n        <input type=\"{{ type }}\" name=\"{{ name }}\" \n        value=\"{{\
    \ value|escape }}\" size=\"{{ size }}\">\n    </div>\n{% endmacro %}\n```\n\n\
    现在，要快速在表单中创建输入，调用宏：\n\n```\n{{ input('item') }}\n```\n\n这将返回以下内容：\n\n```\n<div\
    \ class=\"form\">\n    <input type=\"text\" name=\"item\" value=\"\" size=\"20\"\
    >\n</div>\n```\n\n现在我们已经了解了宏是什么，我们将继续学习模板继承是什么以及它在 FastAPI 中如何工作。\n\n## 模板继承\n\
    \nJinja 最强大的功能是模板继承。此功能推进了 **不要重复自己 (DRY)** 原则，并在大型 Web 应用程序中非常有用。模板继承是指定义一个基础模板，子模板可以交互、继承和替换基础模板中定义的各个部分。\n\
