    \n# 7\n## Securing FastAPI Applications\n\n在上一章中，我们研究了如何将 FastAPI 应用程序连接到 SQL\
    \ 和 NoSQL 数据库。我们成功实现了数据库方法并更新了现有路由以实现应用程序与数据库之间的交互。然而，规划应用程序仍然允许任何人添加事件，而不仅仅是经过身份验证的用户。在本章中，我们将使用\
    \ JSON Web Token (JWT) 保护应用程序并将某些事件操作限制为仅经过身份验证的用户。\n\n保护应用程序涉及添加安全措施以限制未经授权的实体访问应用程序功能，以防止黑客攻击或对应用程序进行非法修改。身份验证是验证实体传递的凭据的过程，而授权\
    \ simply 意味着给予实体执行指定操作的权限。当凭据已被验证后，该实体将被授权执行各种操作。\n\n"
