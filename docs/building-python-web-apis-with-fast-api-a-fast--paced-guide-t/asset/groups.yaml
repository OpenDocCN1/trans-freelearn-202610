    \ defined. As with Pydantic models, the table is defined but, this time around,\
    \ as subclasses of the SQLModel class. The class definition also takes another\
    \ config variable, table, to indicate that this class is a SQLModel table.\n\n\
    The variables defined in the class will represent the columns by default unless\
    \ denoted as a field. Let’s look at how the event table will be defined:\n\n```\n\
    class Event(SQLModel, table=True):\n    id: Optional[int] = Field(default=None,\n\
    \    primary_key=True)\n    title: str\n    image: str\n    description: str\n\
    \    location: str\n    tags: List[str]\n```\n\nIn this table class, all the variables\
    \ defined are columns except id, which has been defined as a field. Fields are\
    \ denoted using the Field object from the SQLModel library. The id field is also\
    \ the primary key in the database table.\n\n> **What Is a Primary Key?**\n> A\
    \ primary key is a unique identifier for a record contained in a database table.\n\
    \nNow that we have learned what tables are and how to create them, let’s look\
    \ at rows in the next section.\n\n# Rows\n\nData sent to a database table is stored\
    \ in rows under specified columns. To insert data into the rows and store them,\
    \ an instance of the table is created and the variables are filled with the desired\
    \ input. For example, to insert event data into the events table, we’ll create\
    \ an instance of the model first:\n\n```\nnew_event = Event(title=\"Book Launch\"\
    ,\n                image=\"src/fastapi.png\",\n                description=\"\
    The book launch event will\n                be held at Packt HQ, Packt city\"\
