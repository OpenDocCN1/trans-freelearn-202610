    # Understanding Jinja


    **Jinja** is a templating engine written in Python designed to help the rendering
    process of API responses. In every templating language, there are variables that
    get replaced with the actual values passed to them when the template is rendered,
    and there are tags that control the logic of the template.


    The Jinja templating engine makes use of curly brackets { } to distinguish its
    expressions and syntax from regular HTML, text and any other variable in the template
    file.


    The {{ }} syntax is called a **variable block**. The {% %} syntax houses control
    structures such as **if/else, loops, and macros**.


    The three common syntax blocks used in the Jinja templating language include the
    following:


    +   - `{% ... %}` – This syntax is used for statements such as control structures.

    +   - `{{ todo.item }}` – This syntax is used to print out the values of the expressions
    passed to it.

    +   - `{# This is a great API book! #}` – This syntax is used when writing comments
    and is not displayed on the web page.


    Jinja template variables can be of any Python type or object if they can be converted
    into strings. A model, list, or dictionary type can be passed to the template
    and have its attributes displayed by placing these attributes in the second block
    listed previously.


    In the next section, we’ll be looking at filters. Filters are an important part
    of every templating engine and in Jinja, filters enable us to execute certain
    functions such as joining values from a list and retrieving the length of an object,
    among others.


    In the following subsections, we’ll be looking at some common features used in
    Jinja: filters, if statements, loops, macros and template inheritance.


    # Filters


    Despite the similarity between Python and Jinja’s syntax, modifications such as
    joining strings, setting the first character of a string to uppercase, and so
    on cannot be done using Python’s syntax in Jinja. Therefore, to perform such modifications,
    we have filters in Jinja.


    A filter is separated from the variable by a pipe symbol (|) and may entertain
    optional arguments in parentheses. A filter is defined in this format:


    ```

    {{ variable | filter_name(*args) }}

    ```'
  - '[PAGE 71]


    If there are no arguments, the definition becomes the following:


    ```

    {{ variable | filter_name }}

    ```


    Let''s take a look at some common filters in the following subsections.


    # The default filter


    The default filter variable is used to replace the output of the passed value
    if it turns out to be None:


    ```

    {{ todo.item | default(''This is a default todo item'') }}

    This is a default todo item

    ```


    # The escape filter


    This filter is used to render raw HTML output:


    ```

    {{ "<title>Todo Application</title>" | escape }}

    <title>Todo Application</title>

    ```


    # The conversion filters


    These filters include int and float filters used to convert from one data type
    to another:


    ```

    {{ 3.142 | int }}

    3


    {{ 31 | float }}

    31.0

    ```


    # The join filter


    This filter is used to join elements in a list into a string as in Python:


    ```

    {{ [''Packt'', ''produces'', ''great'', ''books!''] | join('' '') }}

    Packt produces great books!

    ```


    # The length filter


    This filter is used to return the length of the object passed. It fulfills the
    same role as len() in Python:


    ```

    Todo count: {{ todos | length }}

    Todo count: 4

    ```'
  - "[PAGE 72]\n\n> Note\n> For a full list of filters and to learn more about filters\
    \ in Jinja, visit https://jinja.palletsprojects.com/en/3.0.x/templates/#builtin-filters.\n\
    \n# Using if statements\n\nThe usage of if statements in Jinja is similar to their\
    \ usage in Python. if statements are used in the {% %} control blocks. Let's look\
    \ at an example:\n\n```\n{% if todo | length < 5 %}\n    You don't have much items\
