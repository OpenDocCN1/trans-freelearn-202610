  - '[PAGE 30]


    Additionally, using a Dockerfile and a docker-compose file eliminates the need
    to upload and share images of our applications. New versions of our applications
    can be built from the Dockerfile and deployed using the docker-compose file. Application
    images can also be stored and retrieved from Docker Hub. This is known as a push
    and pull operation.


    To begin setting up, download and install Docker from https://docs.docker.com/install.


    # Dockerfile


    A Dockerfile contains instructions on how our application image is to be built.
    The following is an example Dockerfile:


    ```

    FROM PYTHON:3.8

    # Set working directory to /usr/src/app

    WORKDIR /usr/src/app

    # Copy the contents of the current local directory into the container''s working
    directory

    ADD . /usr/src/app

    # Run a command

    CMD ["python", "hello.py"]

    ```


    Next, we’ll build the application container image and tag it getting_started as
    follows:


    ```

    $ docker build -t getting_started .

    ```


    If the Dockerfile isn’t present in the directory where the command is being run,
    the path to the Dockerfile should be properly appended as follows:


    ```

    $ docker build -t api api/Dockerfile

    ```


    The container image can be run using the following command:


    ```

    $ docker run getting-started

    ```


    Docker is an efficient tool for containerization. We have only looked at the basic
    operations and we’ll learn more operations practically in Chapter 9, Deploying
    FastAPI Applications.'
  - "[PAGE 31]\n\n# Building a simple FastAPI application\n\nFinally, we can now get\
    \ to our first FastAPI project. Our aim in this section is to introduce FastAPI\
    \ by building a simple application. We shall cover in-depth operations in subsequent\
    \ chapters.\n\nWe’ll begin by installing the dependencies required for our application\
    \ in the todos folder we created earlier. The dependencies are the following:\n\
    \n+   - fastapi: The framework on which we’ll build our application.\n+   - uvicorn:\
    \ An Asynchronous Server Gateway Interface module to run our application.\n\n\
    First, activate your development environment by running the following command\
    \ in your project directory:\n\n```\n$ source venv/bin/activate\n```\n\nThen,\
    \ install the dependencies as follows:\n\n```\n(venv)$ pip install fastapi uvicorn\n\
    ```\n\nFor now, we’ll create a new api.py file and create a new instance of FastAPI\
