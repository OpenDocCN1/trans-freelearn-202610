  mdcn: "\n\n此命令以分离模式启动服务：\n\n![](img/85e42522e1d8d05fd8b981490d6d9056_200_0.png)\n\
    \n应用程序服务已创建并部署。让我们通过检查正在运行的容器列表来验证：\n\n```\n(venv) $ docker ps\n```\n\n结果如下：\n\
    \n![](img/85e42522e1d8d05fd8b981490d6d9056_200_1.png)\n\n该命令返回正在运行的容器列表以及可以访问它们的端口。让我们通过向已部署的应用程序发送\
    \ GET 请求来测试工作状态：\n\n```\n(venv)$ curl -X 'GET' \\\n  'http://localhost:8080/event/'\
    \ \\\n  -H 'accept: application/json'\n```\n\n我们得到以下响应：\n\n```\n[]\n```\n\n太好了！已部署的应用程序工作正常。让我们也通过创建一个用户来验证数据库是否正常工作：\n\
    \n```\n(venv)$ curl -X 'POST' \\\n  'http://localhost:8080/user/signup' \\\n \
    \ -H 'accept: application/json' \\\n  -H 'Content-Type: application/json' \\\n\
    \  -d '{\n\"email\": \"fastapi@packt.com\",\n\"password\": \"strong!!!\"\n}'\n\
    ```\n\n我们也得到了积极的响应：\n\n```\n{\n  \"message\": \"User created successfully\"\n\
    }\n```\n\n现在我们已经测试了这两个路由，你可以继续测试其他路由。在探索后停止部署服务器，从根目录运行以下命令：\n\n```\n(venv)$ docker-compose\
    \ down\n```\n\n结果如下：\n\n![](img/85e42522e1d8d05fd8b981490d6d9056_202_0.png)\n\n\
    图 9.5 – 停止应用程序实例\n\n## 部署 Docker 镜像\n\n在上一节中，我们学习了如何本地构建和部署 Docker 镜像。这些镜像可以部署在任何虚拟机上以及诸如\
    \ Google Cloud 和 AWS 之类的无服务器平台上。\n\n常规操作模式涉及将 Docker 镜像推送到无服务器平台上的私有注册表。在无服务器平台上部署\
    \ Docker 镜像的过程因提供商而异，因此这里提供了选择无服务器服务提供商的链接：\n\n+   - Google Cloud Run: https://cloud.google.com/run/docs/quickstarts/build-and-deploy/python\n\
    +   - Amazon EC2: https://docs.aws.amazon.com/AmazonECS/latest/developerguide/getting-started-ecs-ec2.html\n\
    +   - Deploying to Microsoft Azure: https://docs.microsoft.com/en-us/azure/container-instances/container-instances-tutorial-deploy-app\n\
    \n## 部署数据库\n\nGoogle Cloud、AWS 等平台提供托管数据库容器的选项。然而，这在运行成本和整体可管理性方面可能很昂贵。\n\n对于不支持部署\
    \ docker-compose 清单的平台，MongoDB 数据库可以托管在 MongoDB Atlas (https://www.mongodb.com/atlas/database)\
    \ 上，并用连接字符串覆盖 DATABASE_URL 环境变量。有关在 MongoDB Atlas 上设置数据库的详细指南可在 https://www.mongodb.com/docs/atlas/getting-started/\
    \ 找到。\n\n## 总结\n\n在本章中，你学习了如何为部署准备应用程序。你首先通过更新应用程序使用的依赖项并将它们保存在 requirements.txt\
    \ 文件中，然后继续管理 API 使用的环境变量。\n\n我们还介绍了将应用程序部署到生产环境的步骤：从 Dockerfile 构建 Docker 镜像，为\
    \ API 和数据库服务配置 compose 清单，然后部署应用程序。你还学习了新的命令来检查正在运行的容器的列表以及启动和停止 Docker 容器。最后，你测试了应用程序以确保部署成功。\n\
    \n这标志着本书的结束，你现在应该准备好在网络上构建、测试和部署 FastAPI 应用程序。我们涵盖了各种概念，并确保每个概念都通过充分的示例得到适当讨论：路由、模板、身份验证、连接数据库以及部署应用程序。务必查看书中偶尔提到的外部资源以获得更多知识！\n\
