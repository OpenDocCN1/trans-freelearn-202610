    # Template inheritance


    Jinja’s most powerful feature is the inheritance of templates. This feature advances
    the **don’t repeat yourself (DRY)** principle and comes in handy in large web
    applications. Template inheritance is a situation where a base template is defined
    and child templates can interact, inherit, and replace defined sections of the
    base template.


    > **Note**

    > You can learn more about Jinja’s template inheritance at https://jinja.palletsprojects.com/en/3.0.x/templates/#template-inheritance.


    Now that you’ve learned the basics of Jinja’s syntax, let’s learn how to use templates
    in FastAPI in the next section.


    # Using Jinja templates in FastAPI


    To get started, we need to install the Jinja package and create a new folder,
    `templates`, in our project directory. This folder will store all our Jinja files,
    which are HTML files mixed with Jinja’s syntax. Since this book does not focus
    on user interface design, we will be making use of the CSS `Bootstrap` library
    and avoid writing our own styles.


    The Bootstrap library will be downloaded from the CDN upon page load. However,
    extra assets can be stored in a different folder. We will look into serving static
    files in the next chapter.


    We’ll start by creating the homepage template, which will house the section for
    creating new todos. The following is a mockup of how we want our homepage template
    to look:'
