    \ Deploying with Docker\n\nIn Chapter 1, Getting Started with FastAPI, you were\
    \ introduced to the basics of Docker and the Dockerfile. In this section, you’ll\
    \ be writing a Dockerfile for the event planner API.\n\nDocker is the most popular\
    \ technology used for containerization. Containers are self-contained systems\
    \ consisting of packages, code, and dependencies that enable them to run in different\
    \ environments with little to no dependence on their running environment. Docker\
    \ uses Dockerfiles for the containerization process.\n\nDocker can be used for\
    \ local development as well as for deploying applications to production. We’ll\
    \ only be looking at local deployment in this chapter, and links to official guides\
    \ on deploying to cloud services will be included as well.\n\nFor managing applications\
    \ with multiple containers, such as an application container and a database container,\
    \ the compose tool is used. Compose is a tool used to manage multi-container Docker\
    \ applications defined in the configuration file, usually docker-compose.yaml.\
    \ The compose tool, docker-compose, comes installed with the Docker engine.\n\n\
    ### Writing the Dockerfile\n\nA Dockerfile contains a set of instructions employed\
    \ to build a Docker image. The Docker image built can then be distributed to registries\
    \ (private and public), deployed to cloud servers such as AWS and Google Cloud,\
    \ and used on different operating systems by creating a container.\n\nNow that\
    \ we know what a Dockerfile does, let’s create a Dockerfile to build the application’s\
    \ image. In the project directory, create the Dockerfile file:\n\n```\n(venv)$\
    \ touch Dockerfile\n```\n\n# Dockerfile\n\n```\nFROM python:3.10\n\nWORKDIR /app\n\
    \nCOPY requirements.txt /app\n\nRUN pip install --upgrade pip && pip install -r\
    \ /app/requirements.txt\n\nEXPOSE 8080\n\nCOPY ./ /app\n\nCMD [\"python\", \"\
    main.py\"]\n```\n\nLet’s go through the instructions contained in the preceding\
    \ Dockerfile one by one:\n\n- The first instruction the Dockerfile executes is\
    \ to set the base image for our own image using the FROM keyword. Other variations\
    \ of this image can be found at https://hub.docker.com/_/python.\n- The next line\
    \ uses the WORKDIR keyword to set the working directory to /app. A working directory\
    \ helps organize the structure of the project being built to an image.\n- Next,\
    \ we copy the requirements.txt file from the local directory to the working directory\
    \ on the Docker container using the COPY keyword.\n- The next instruction is the\
    \ RUN command, which is used to upgrade the pip package and then install the dependencies\
    \ from the requirements.txt file.\n- The next command exposes the PORT from which\
    \ our application can be accessed from the local network.\n- The next command\
    \ copies the rest of the files and folders into the Docker container working directory.\n\
    - Lastly, the last command starts the application using the CMD command.\n\nEach\
    \ set of instructions listed in the Dockerfile is built as an individual layer.\
    \ Docker does an intelligent job of caching each layer during a build to reduce\
    \ build time and eliminate repetition. If a layer that is essentially an instruction\
    \ is untouched, the layer is skipped and the previously built one is used. That\
    \ is, Docker uses the cache system when building images.\n\nLet’s create a .dockerignore\
    \ file before proceeding to build our image:\n\n```\n(venv)$ touch .dockerignore\n\
    ```\n\n# .dockerignore\n\n```\nVenv\n.env\n.git\n```\n\n> **What Is .dockerignore?**\n\
    > The .dockerignore file contains files and folders to be exempted from instructions\
    \ defined in the Dockerfile.\n\n## Building the Docker image\n\nTo build the application\
    \ image, run the following command in the base directory:\n\n```\n(venv)$ docker\
    \ build -t event-planner-api .\n```\n\nThis command simply tells Docker to build\
    \ an image with the event-planner-api tag from the instructions defined in the\
    \ current directory, which is represented by the dot at the end of the command.\
    \ The build process commences once the command is run and the instructions are\
    \ executed:\n\n![](img/85e42522e1d8d05fd8b981490d6d9056_196_0.png)\n\nFigure 9.1\
    \ – Docker build process\n\nNow that we have successfully built our application’s\
    \ image, let’s pull the MongoDB image:\n\n```\n(venv)$ docker pull mongo\n```\n\
    \nWe’re pulling a MongoDB image to create a standalone database container accessible\
    \ from the API container when created. By default, the Docker container has a\
    \ separate network configuration, and connecting to the machine hosts' localhost\
    \ address is not allowed.\n\n![](img/85e42522e1d8d05fd8b981490d6d9056_197_0.png)\n\
    \nFigure 9.2 – Pulling a MongoDB image\n\n> **What Is docker pull?**\n> \n> The\
    \ `docker pull` command is responsible for downloading images from a registry.\
    \ Unless otherwise stated, these images are downloaded from the public Docker\
    \ Hub registry.\n\n## Deploying our application locally\n\nNow that we have created\
    \ the images for the API and pulled the image for the MongoDB database, let’s\
    \ proceed to write a compose manifest to handle our application deployment. The\
    \ docker-compose manifest will consist of the API service and the MongoDB database\
    \ service. In the root directory, create the manifest file:\n\n```\n(venv)$ touch\
    \ docker-compose.yml\n```\n\n# docker-compose.yml\n\n```\nversion: \"3\"\n\nservices:\n\
    \  api:\n    build: .\n    image: event-planner-api:latest\n    ports:\n     \
    \ - \"8080:8080\"\n    env_file:\n      - .env.prod\n\n  database:\n    image:\
    \ mongo\n    ports:\n      - \"27017\"\n    volumes:\n      - data:/data/db\n\n\
    volumes:\n  data:\n```\n\nIn the services section, we have the api service and\
    \ the database service. In the api service, the following set of instructions\
    \ are put in place:\n\n- The build field instructs Docker to build the event-planner-api:latest\
    \ image for the api service from the Dockerfile situated in the current directory\
    \ denoted by . .\n- Port 8080 is exposed from the container to enable us to access\
    \ the service through HTTP.\n\n- The environment file is set to .env.prod. Alternatively,\
    \ the environment variables can be set in this format:\n\n```\nenvironment:\n\
    \  - DATABASE_URL=mongodb://database:27017/planner\n  - SECRET_KEY=secretkey\n\
    ```\n\nThis format is mostly used when environment variables are to be injected\
    \ from a deployment service. It is encouraged to use the environment file.\n\n\
    In the database service, the following set of instructions are put in place:\n\
    \n- The database service makes use of the mongo image we pulled earlier.\n- Port\
    \ 27017 is defined but not exposed externally. The port is only accessible internally\
    \ by the api service.\n- A persistent volume is attached to the service to store\
    \ our data. The folder allocated for this is /data/db.\n- Lastly, the volume for\
    \ this deployment is created with the name data.\n\nNow that we have understood\
    \ the content of the compose manifest, let’s create the environment file, .env.prod:\n\
    \n# .env.prod\n\n```\nDATABASE_URL=mongodb://database:27017/planner\nSECRET_KEY=NOTSTRONGENOUGH!\n\
    ```\n\nIn the environment file, DATABASE_URL is set to the name of the MongoDB\
    \ service created by the compose manifest.\n\n## Running our application\n\nWe\
    \ are set to deploy and run the application from the docker-compose manifest.\
    \ Let’s start the services using the compose tool:\n\n```\n(venv) $ docker-compose\
    \ up -d\n```\n"
