    \ application and adding more features. Before that, you will be introduced to\
    \ what databases are, the different types, and how to use both (SQL and NoSQL)\
    \ in a FastAPI application.\n\n## 6\nConnecting to\na Database\n\nIn the last\
    \ chapter, we looked at how to structure a FastAPI application. We successfully\
    \ implemented some routes and models for our application and tested the endpoints.\
    \ However, the application still uses an in-app database to store the events.\
    \ In this chapter, we will migrate the application to use a proper database.\n\
    \nA database can be simply referred to as a storehouse for data. In this context,\
    \ a database enables us to store data permanently, as opposed to an in-app database,\
    \ which is wiped off upon any app restart or crash. A database is a table housing\
    \ columns, referred to as fields, and rows, referred to as records.\n\nBy the\
    \ end of this chapter, you will be equipped with the knowledge of how to connect\
    \ a FastAPI application to a database. This chapter will explain how to connect\
    \ to a SQL database using SQLModel and a MongoDB database via Beanie. (However,\
    \ the application will make use of MongoDB as its primary database in later chapters.)\
    \ In this chapter, you’ll be covering the following topics:\n\n- Setting up SQLModel\n\
    - CRUD operations on a SQL database using SQLModel\n- Setting up MongoDB\n- CRUD\
    \ operations on MongoDB using Beanie\n\n## Technical requirements\n\nTo follow\
    \ along, the MongoDB database component is required. The installation procedures\
    \ for your operating system can be found in their official documentation. The\
    \ code used in this chapter can be found at https://github.com/PacktPublishing/Building-Python-Web-APIs-with-FastAPI/tree/main/ch06/planner.\n\
    \n## Setting up SQLModel\n\nThe first step to integrate a SQL database into our\
    \ planner application is to install the SQLModel library. The SQLModel library\
    \ was built by the creator of FastAPI and is powered by Pydantic and SQLAlchemy.\
    \ Support from Pydantic will make it easy for us to define models, as we learned\
    \ in Chapter 3, Response Models and Error Handling.\n\nSince we’ll be implementing\
    \ both SQL and NoSQL databases, we’ll create a new GitHub branch for this section.\
    \ In your terminal, navigate to the project directory, initialize a GitHub repository,\
    \ and commit the existing files:\n\n```\n$ git init\n$ git add database models\
    \ routes main.py\n$ git commit -m \"Committing bare application without a database\"\
    \n```\n\nNext, create a new branch:\n\n```\n$ git checkout -b planner-sql\n```\n\
    \nNow, we are ready to set up SQLModel in our application. From your terminal,\
    \ activate the virtual environment and install the SQLModel library:\n\n```\n\
    $ source venv/bin/activate\n(venv)$ pip install sqlmodel\n```\n\nBefore diving\
    \ into adding a database to our planner application, let’s look at some of the\
    \ methods contained in SQLModel that we’ll be using in this chapter.\n\n## Tables\n\
    \nA table is essentially an object that contains data stored in a database – for\
    \ example, events data will be stored in an event table. The table will consist\
    \ of columns and rows where the data will eventually be stored.\n\nTo create a\
    \ table using SQLModel, a table model class is first defined. As with Pydantic\
    \ models, the table is defined but, this time around, as subclasses of the SQLModel\
    \ class. The class definition also takes another config variable, table, to indicate\
    \ that this class is a SQLModel table.\n\nThe variables defined in the class will\
    \ represent the columns by default unless denoted as a field. Let’s look at how\
    \ the event table will be defined:\n\n```\nclass Event(SQLModel, table=True):\n\
    \    id: Optional[int] = Field(default=None,\n    primary_key=True)\n    title:\
    \ str\n    image: str\n    description: str\n    location: str\n    tags: List[str]\n\
    ```\n\nIn this table class, all the variables defined are columns except id, which\
    \ has been defined as a field. Fields are denoted using the Field object from\
    \ the SQLModel library. The id field is also the primary key in the database table.\n\
    \n> **What Is a Primary Key?**\n> A primary key is a unique identifier for a record\
    \ contained in a database table.\n\nNow that we have learned what tables are and\
    \ how to create them, let’s look at rows in the next section.\n\n## Rows\n\nData\
    \ sent to a database table is stored in rows under specified columns. To insert\
    \ data into the rows and store them, an instance of the table is created and the\
    \ variables are filled with the desired input. For example, to insert event data\
    \ into the events table, we’ll create an instance of the model first:\n\n```\n\
    new_event = Event(title=\"Book Launch\",\n                image=\"src/fastapi.png\"\
    ,\n                description=\"The book launch event will\n                be\
    \ held at Packt HQ, Packt city\",\n```\n\n```\nlocation=\"Google Meet\",\ntags=[\"\
    packt\", \"book\"]\n```\n\nNext, we create a database transaction using the Session\
    \ class:\n\n```\nwith Session(engine) as session:\n    session.add(new_event)\n\
    \    session.commit()\n```\n\nThe preceding operation may seem alien to you. Let’s\
    \ look at what the Session class is and what it does.\n\n## Sessions\n\nA session\
    \ object handles the interaction from code to a database. It primarily acts as\
    \ an intermediary in executing operations. The Session class takes an argument\
    \ that is the instance of a SQL engine.\n\nNow that we have learned how tables\
    \ and rows are created, we will look at how a database is created. Some of the\
    \ methods of the session class we’ll be using in this chapter include the following:\n\
    \n- add(): This method is responsible for adding a database object to memory pending\
    \ further operations. In the previous code block, the new_event object is added\
    \ to the session’s memory, waiting to be committed into the database by the commit()\
    \ method.\n- commit(): This method is responsible for flushing transactions present\
    \ in the session.\n- get(): This method takes two parameters – the model and the\
    \ ID of the document requested. This method is used to retrieve a single row from\
    \ a database.\n\nNow that we know how to create tables, rows, and columns, as\
    \ well as insert data using the Session class, let’s move on to creating a database\
    \ and performing CRUD operations in the next section.\n\n## Creating a database\n\
    \nIn SQLModel, connecting to a database is done via a SQLAlchemy engine. The engine\
    \ is created by the create_engine() method, imported from the SQLModel library.\n"
