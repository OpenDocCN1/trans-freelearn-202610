  md: "Now that we have successfully added the blocks of code to initialize the database,\
    \ let’s proceed to implement the methods for CRUD operations.\n\n# CRUD operations\n\
    \nIn connection.py, create a new Database class that takes a model as an argument\
    \ during initialization:\n\n```\nfrom pydantic import BaseSettings, BaseModel\n\
    from typing import Any, List, Optional\n\nclass Database:\n    def __init__(self,\
    \ model):\n        self.model = model\n```\n\nThe model passed during initialization\
    \ is either the Event or User document model class.\n\n# Create\n\nLet’s create\
    \ a method under the Database class to add a record to the database collection:\n\
    \n```\nasync def save(self, document) -> None:\n    await document.create()\n\
    \    return\n```\n\nIn this code block, we have defined the save method to take\
    \ the document, which will be an instance of the document passed to the Database\
    \ instance at the point of instantiation.\n\n# Read\n\nLet’s create the methods\
    \ to retrieve a database record or all the records present in the database collection:\n\
    \n```\nasync def get(self, id: PydanticObjectId) -> Any:\n    doc = await self.model.get(id)\n\
    \    if doc:\n        return doc\n```"
