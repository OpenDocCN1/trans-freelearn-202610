  md: "# .env\n\n```\nSECRET_KEY=HI5HL3V3L$3CR3T\n```\n\nWith that in place, add the\
    \ following imports in jwt_handler.py:\n\n```\nimport time\nfrom datetime import\
    \ datetime\n\nfrom fastapi import HTTPException, status\nfrom jose import jwt,\
    \ JWTError\nfrom database.database import Settings\n```\n\nIn the preceding code\
    \ block, we have imported the time modules, the HTTPException class, as well as\
    \ the status from FastAPI. We also imported the jose library responsible for encoding\
    \ and decoding JWTs and the Settings class.\n\nNext, we'll create an instance\
    \ of the Settings class so we can retrieve the SECRET_KEY variable and create\
    \ the function responsible for creating the token:\n\n```\nsettings = Settings()\n\
    \ndef create_access_token(user: str) -> str:\n    payload = {\n        \"user\"\
    : user,\n        \"expires\": time.time() + 3600\n    }\n\n    token = jwt.encode(payload,\
    \ settings.SECRET_KEY,\n    algorithm=\"HS256\")\n    return token\n```\n\nIn\
    \ the preceding code block, the function takes a string argument, which is passed\
    \ into the payload dictionary. The payload dictionary contains the user and the\
    \ expiry time, which is returned when a JWT is decoded."
