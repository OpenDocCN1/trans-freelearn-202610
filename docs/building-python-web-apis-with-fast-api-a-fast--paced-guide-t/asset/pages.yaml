- pgno: 194
  md: '# Deploying with Docker


    In Chapter 1, Getting Started with FastAPI, you were introduced to the basics
    of Docker and the Dockerfile. In this section, you’ll be writing a Dockerfile
    for the event planner API.


    Docker is the most popular technology used for containerization. Containers are
    self-contained systems consisting of packages, code, and dependencies that enable
    them to run in different environments with little to no dependence on their running
    environment. Docker uses Dockerfiles for the containerization process.


    Docker can be used for local development as well as for deploying applications
    to production. We’ll only be looking at local deployment in this chapter, and
    links to official guides on deploying to cloud services will be included as well.


    For managing applications with multiple containers, such as an application container
    and a database container, the compose tool is used. Compose is a tool used to
    manage multi-container Docker applications defined in the configuration file,
    usually docker-compose.yaml. The compose tool, docker-compose, comes installed
    with the Docker engine.


    # Writing the Dockerfile


    A Dockerfile contains a set of instructions employed to build a Docker image.
    The Docker image built can then be distributed to registries (private and public),
    deployed to cloud servers such as AWS and Google Cloud, and used on different
    operating systems by creating a container.


    Now that we know what a Dockerfile does, let’s create a Dockerfile to build the
    application’s image. In the project directory, create the Dockerfile file:


    ```

    (venv)$ touch Dockerfile

    ```


    # Dockerfile


    ```

    FROM python:3.10


    WORKDIR /app


    COPY requirements.txt /app


    RUN pip install --upgrade pip && pip install -r /app/requirements.txt

    ```'
  merge: -1
  img_proc: true
- pgno: 195
  md: '```

    EXPOSE 8080


    COPY ./ /app


    CMD ["python", "main.py"]

    ```


    Let’s go through the instructions contained in the preceding Dockerfile one by
    one:


    +   - The first instruction the Dockerfile executes is to set the base image for
    our own image using the FROM keyword. Other variations of this image can be found
    at https://hub.docker.com/_/python.

    +   - The next line uses the WORKDIR keyword to set the working directory to /app.
    A working directory helps organize the structure of the project being built to
    an image.

    +   - Next, we copy the requirements.txt file from the local directory to the
    working directory on the Docker container using the COPY keyword.

    +   - The next instruction is the RUN command, which is used to upgrade the pip
    package and then install the dependencies from the requirements.txt file.

    +   - The next command exposes the PORT from which our application can be accessed
    from the local network.

    +   - The next command copies the rest of the files and folders into the Docker
    container working directory.

    +   - Lastly, the last command starts the application using the CMD command.


    Each set of instructions listed in the Dockerfile is built as an individual layer.
    Docker does an intelligent job of caching each layer during a build to reduce
    build time and eliminate repetition. If a layer that is essentially an instruction
    is untouched, the layer is skipped and the previously built one is used. That
    is, Docker uses the cache system when building images.


    Let’s create a .dockerignore file before proceeding to build our image:


    ```

    (venv)$ touch .dockerignore

    ```


    # .dockerignore


    ```

    Venv

    .env

    .git

    ```'
  merge: -1
  img_proc: true
- pgno: 196
  md: '> **What Is .dockerignore?**

    > The .dockerignore file contains files and folders to be exempted from instructions
    defined in the Dockerfile.


    # Building the Docker image


    To build the application image, run the following command in the base directory:


    ```

    (venv)$ docker build -t event-planner-api .

    ```


    This command simply tells Docker to build an image with the event-planner-api
    tag from the instructions defined in the current directory, which is represented
    by the dot at the end of the command. The build process commences once the command
    is run and the instructions are executed:


    ![](img/85e42522e1d8d05fd8b981490d6d9056_196_0.png)


    Figure 9.1 – Docker build process


    Now that we have successfully built our application’s image, let’s pull the MongoDB
    image:


    ```

    (venv)$ docker pull mongo

    ```'
  merge: -1
  img_proc: true
- pgno: 197
  md: "We’re pulling a MongoDB image to create a standalone database container accessible\
    \ from the API container when created. By default, the Docker container has a\
    \ separate network configuration, and connecting to the machine hosts' localhost\
    \ address is not allowed.\n\n![](img/85e42522e1d8d05fd8b981490d6d9056_197_0.png)\n\
    \nFigure 9.2 – Pulling a MongoDB image\n\n> **What Is docker pull?**\n> \n> The\
    \ `docker pull` command is responsible for downloading images from a registry.\
    \ Unless otherwise stated, these images are downloaded from the public Docker\
    \ Hub registry.\n\n# Deploying our application locally\n\nNow that we have created\
    \ the images for the API and pulled the image for the MongoDB database, let’s\
    \ proceed to write a compose manifest to handle our application deployment. The\
    \ docker-compose manifest will consist of the API service and the MongoDB database\
    \ service. In the root directory, create the manifest file:\n\n```\n(venv)$ touch\
    \ docker-compose.yml\n```"
  merge: -1
  img_proc: true
- pgno: 198
  md: "The contents of the docker-compose manifest file will be as follows:\n\n# docker-compose.yml\n\
    \n```\nversion: \"3\"\n\nservices:\n  api:\n    build: .\n    image: event-planner-api:latest\n\
    \    ports:\n      - \"8080:8080\"\n    env_file:\n      - .env.prod\n\n  database:\n\
    \    image: mongo\n    ports:\n      - \"27017\"\n    volumes:\n      - data:/data/db\n\
    \nvolumes:\n  data:\n```\n\nIn the services section, we have the api service and\
    \ the database service. In the api service, the following set of instructions\
    \ are put in place:\n\n+   - The build field instructs Docker to build the event-planner-api:latest\
    \ image for the api service from the Dockerfile situated in the current directory\
    \ denoted by . .\n+   - Port 8080 is exposed from the container to enable us to\
    \ access the service through HTTP."
  merge: -1
  img_proc: true
- pgno: 199
  md: "+   - The environment file is set to .env.prod. Alternatively, the environment\
    \ variables can be set in this format:\n\n```\nenvironment:\n  - DATABASE_URL=mongodb://database:27017/planner\n\
    \  - SECRET_KEY=secretkey\n```\n\nThis format is mostly used when environment\
    \ variables are to be injected from a deployment service. It is encouraged to\
    \ use the environment file.\n\nIn the database service, the following set of instructions\
    \ are put in place:\n\n+   - The database service makes use of the mongo image\
    \ we pulled earlier.\n+   - Port 27017 is defined but not exposed externally.\
    \ The port is only accessible internally by the api service.\n+   - A persistent\
    \ volume is attached to the service to store our data. The folder allocated for\
    \ this is /data/db.\n+   - Lastly, the volume for this deployment is created with\
    \ the name data.\n\nNow that we have understood the content of the compose manifest,\
    \ let’s create the environment file, .env.prod:\n\n# .env.prod\n\n```\nDATABASE_URL=mongodb://database:27017/planner\n\
    SECRET_KEY=NOTSTRONGENOUGH!\n```\n\nIn the environment file, DATABASE_URL is set\
    \ to the name of the MongoDB service created by the compose manifest.\n\n# Running\
    \ our application\n\nWe are set to deploy and run the application from the docker-compose\
    \ manifest. Let’s start the services using the compose tool:\n\n```\n(venv) $\
    \ docker-compose up -d\n```"
  merge: -1
  img_proc: true
- pgno: 200
  md: 'This command starts the services in detached mode:


    ![](img/85e42522e1d8d05fd8b981490d6d9056_200_0.png)


    The application services have been created and deployed. Let’s verify by checking
    the list of containers running:


    ```

    (venv) $ docker ps

    ```


    The result is as follows:


    ![](img/85e42522e1d8d05fd8b981490d6d9056_200_1.png)'
  merge: -1
  img_proc: true
- pgno: 201
  md: "The command returns the list of containers running alongside ports in which\
    \ they can be accessed. Let’s test the working state by sending a GET request\
    \ to the deployed application:\n\n```\n(venv)$ curl -X 'GET' \\\n  'http://localhost:8080/event/'\
    \ \\\n  -H 'accept: application/json'\n```\n\nWe get the following response:\n\
    \n```\n[]\n```\n\nGreat! The deployed application works correctly. Let’s verify\
    \ that the database works as well by creating a user:\n\n```\n(venv)$ curl -X\
    \ 'POST' \\\n  'http://localhost:8080/user/signup' \\\n  -H 'accept: application/json'\
    \ \\\n  -H 'Content-Type: application/json' \\\n  -d '{\n\"email\": \"fastapi@packt.com\"\
    ,\n\"password\": \"strong!!!\"\n}'\n```\n\nWe get a positive response as well:\n\
    \n```\n{\n  \"message\": \"User created successfully\"\n}\n```\n\nNow that we\
    \ have tested both routes, you can go ahead to test the other routes. To stop\
    \ the deployment server after exploring, the following command is run from the\
    \ root directory:\n\n```\n(venv)$ docker-compose down\n```"
  merge: -1
  img_proc: true
- pgno: 202
  md: 'The result is as follows:


    ![](img/85e42522e1d8d05fd8b981490d6d9056_202_0.png)


    Figure 9.5 – Stopping application instances


    # Deploying Docker images


    In the last section, we learned how to build and deploy Docker images locally.
    These images can be deployed on any virtual machine and on serverless platforms
    such as Google Cloud and AWS.


    The regular mode of operation involves pushing your Docker images to a private
    registry on the serverless platform. The process involved in deploying Docker
    images on serverless platforms varies from provider to provider and, as a result,
    the links to select serverless service providers have been provided here:


    +   - Google Cloud Run: https://cloud.google.com/run/docs/quickstarts/build-and-deploy/python

    +   - Amazon EC2: https://docs.aws.amazon.com/AmazonECS/latest/developerguide/getting-started-ecs-ec2.html

    +   - Deploying to Microsoft Azure: https://docs.microsoft.com/en-us/azure/container-instances/container-instances-tutorial-deploy-app'
  merge: -1
  img_proc: true
- pgno: 203
  md: 'The steps covered in the previous section can be followed when the Docker images
    are to be installed on a machine or traditional server.


    # Deploying databases


    Platforms such as Google Cloud, AWS provide the option to host your database containers.
    However, this might be expensive in terms of running cost and overall manageability.


    For platforms that do not support the deployment of docker-compose manifests,
    the MongoDB database can be hosted on MongoDB Atlas (https://www.mongodb.com/atlas/database)
    and the DATABASE_URL environment variable overwritten with the connection string.
    A detailed guide on setting up a database on MongoDB atlas can be found at https://www.mongodb.com/docs/atlas/getting-started/.


    # Summary


    In this chapter, you learned how to prepare your application for deployment. You
    started by updating the dependencies used for the application and saving them
    in the requirements.txt file before moving on to managing the environment variables
    used for the API.


    We also covered the steps involved in deploying an application to production:
    building the Docker image from the Dockerfile, configuring the compose manifest
    for the API and database services, and then deploying the application. You also
    learned new commands to check the list of running containers as well as start
    and stop Docker containers. Finally, you tested the application to ensure the
    deployment was successful.


    This marks the end of this book, and you should now be ready to build, test, and
    deploy a FastAPI application on the web. We covered various concepts and ensured
    that each concept is properly discussed with adequate examples: routing, templating,
    authentication, connecting to the database, and deploying the application. Be
    sure to check out the external resources mentioned occasionally in the book to
    gain more knowledge!'
  merge: -1
