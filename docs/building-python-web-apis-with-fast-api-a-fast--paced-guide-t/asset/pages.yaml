    and how to protect routes from unauthorized users. We also added a CORS middleware
    to permit access to our API from any client. We made use of the knowledge from
    previous chapters.


    In the next chapter, you will be introduced to testing your FastAPI application.
    You will learn what testing an application is, why you should test applications,
    and how to test a FastAPI application.'
