  md: "```\nreturn False\n\nasync def get_all(self) -> List[Any]:\n    docs = await\
    \ self.model.find_all().to_list()\n    return docs\n```\n\nThe first method, get(),\
    \ takes an ID as the method argument and returns a corresponding record from the\
    \ database, while the get_all() method takes no argument and returns a list of\
    \ all the records present in the database.\n\n# Update\n\nLet’s create the method\
    \ to handle the process of updating an existing record:\n\n```\nasync def update(self,\
    \ id: PydanticObjectId, body: BaseModel) -> Any:\n    doc_id = id\n    des_body\
    \ = body.dict()\n    des_body = {k:v for k,v in des_body.items() if v is not None}\n\
    \    update_query = {\"$set\": {\n        field: value for field, value in des_body.items()\n\
    \    }}\n\n    doc = await self.get(doc_id)\n    if not doc:\n        return False\n\
    \    await doc.update(update_query)\n    return doc\n```\n\nIn this code block,\
    \ the update method takes an ID and the Pydantic schema responsible, which will\
    \ contain the fields updated from the PUT request sent by the client. The updated\
    \ request body is first parsed into a dictionary and then filtered to remove None\
    \ values. Once this has been done, it is then inserted into an update query, which\
    \ is finally executed by Beanie’s update() method."
