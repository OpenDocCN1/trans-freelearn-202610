    \n![](img/85e42522e1d8d05fd8b981490d6d9056_145_1.png)\n\nFigure 7.4 – Anatomy\
    \ of a JWT\n\nEarlier on, we learned why JWTs are signed. JWTs are signed with\
    \ a secret key known only to the sender and the receiver. Let’s update the Settings\
    \ class in database/database.py as well as the environment file, .env, to include\
