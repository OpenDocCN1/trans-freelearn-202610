  md: "We have successfully secured our application and its routes. Let's wrap up\
    \ this chapter by configuring a Cross-Origin Resource Sharing ( CORS ) middleware\
    \ in the next section.\n\n# Configuring CORS\n\nCross-Origin Resource Sharing\
    \ (CORS) serves as a rule that prevents unregistered clients access to a resource.\n\
    \nWhen our web API is consumed by a frontend application, the browser will not\
    \ allow cross-origin HTTP requests. This means that resources can only be accessed\
    \ from the exact origin as the API or origins permitted by the API.\n\nFastAPI\
    \ provides a CORS middleware, CORSMiddleware, that allows us to register domains\
    \ which can access our API. The middleware takes an array of origins which will\
    \ be permitted to access the resources on the server.\n\n> **What is a middleware?**\n\
    > A middleware is a function that acts as an intermediary between an operation.\
    \ In web APIs, a middleware serves as an mediator in a request-response operation.\n\
    \nFor example, to allow only Packt to access our API, we define the URLs in the\
    \ origin array:\n\n```\norigins = [\n    \"http://packtpub.com\",\n    \"https://packtpub.com\"\
    \n]\n```\n\nTo allow requests from any client, the origins array will contain\
    \ only one value, an asterisk (*). The asterisk is a wildcard that tells our API\
    \ to allow requests from anywhere.\n\nIn main.py, lets configure our application\
    \ to accept requests from everywhere:\n\n```\nfrom fastapi.middleware.cors import\
    \ CORSMiddleware\n\n# register origins\n\norigins = [\"*\"]\n\napp.add_middleware(\n\
    ```"
