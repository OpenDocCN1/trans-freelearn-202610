- pgno: 31
  md: "# Building a simple FastAPI application\n\nFinally, we can now get to our first\
    \ FastAPI project. Our aim in this section is to introduce FastAPI by building\
    \ a simple application. We shall cover in-depth operations in subsequent chapters.\n\
    \nWe’ll begin by installing the dependencies required for our application in the\
    \ todos folder we created earlier. The dependencies are the following:\n\n+  \
    \ - fastapi: The framework on which we’ll build our application.\n+   - uvicorn:\
    \ An Asynchronous Server Gateway Interface module to run our application.\n\n\
    First, activate your development environment by running the following command\
    \ in your project directory:\n\n```\n$ source venv/bin/activate\n```\n\nThen,\
    \ install the dependencies as follows:\n\n```\n(venv)$ pip install fastapi uvicorn\n\
    ```\n\nFor now, we’ll create a new api.py file and create a new instance of FastAPI\
    \ as follows:\n\n```\nfrom fastapi import FastAPI\n\napp = FastAPI()\n```\n\n\
    By instantiating FastAPI in the app variable, we can proceed to create routes.\
    \ Let’s create a welcome route.\n\nA route is created by first defining a decorator\
    \ to indicate the type of operation, followed by a function containing the operation\
    \ to be carried out when this route is invoked. In the following example, we’ll\
    \ create a \"/\" route that only accepts GET requests and returns a welcome message\
    \ when visited:\n\n```\n@app.get(\"/\")\nasync def welcome() -> dict:\n    return\
    \ { \"message\": \"Hello World\"}\n```\n\nThe next step is to start our application\
    \ using uvicorn. In your terminal, run the following command:\n\n```\n(venv)$\
    \ uvicorn api:app --port 8000 --reload\n```"
  merge: -1
  img_proc: true
- pgno: 32
  md: 'In the preceding command, uvicorn takes the following arguments:


    +   - `file:instance`: The file containing the instance of FastAPI and the name
    variable holding the FastAPI instance.

    +   - `--port PORT`: The port the application will be served on.

    +   - `--reload`: An optional argument included to restart the application on
    every file change.


    The command returns the following output:


    ```

