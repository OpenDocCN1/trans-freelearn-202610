- pgno: 147
  md: "The expires value is set to an hour from the time of creation. The payload\
    \ is then passed to the encode() method, which takes three parameters:\n\n+  \
    \ - **Payload**: A dictionary containing the values to be encoded.\n+   - **Key**:\
    \ The key used to sign the payload.\n+   - **Algorithm**: The algorithm used in\
    \ signing the payload. The default and most common is the **HS256** algorithm.\n\
    \nNext, let’s create a function to verify the authenticity of a token sent to\
    \ our application:\n\n```\ndef verify_access_token(token: str) -> dict:\n    try:\n\
    \        data = jwt.decode(token, settings.SECRET_KEY,\n        algorithms=[\"\
    HS256\"])\n\n        expire = data.get(\"expires\")\n\n        if expire is None:\n\
    \            raise HTTPException(\n                status_code=status.HTTP_400_BAD_REQUEST,\n\
    \                detail=\"No access token supplied\"\n            )\n        if\
    \ datetime.utcnow() >\n        datetime.utcfromtimestamp(expire):\n          \
    \  raise HTTPException(\n                status_code=status.HTTP_403_FORBIDDEN,\n\
    \                detail=\"Token expired!\"\n            )\n        return data\n\
    \n    except JWTError:\n        raise HTTPException(\n            status_code=status.HTTP_400_BAD_REQUEST,\n\
    \            detail=\"Invalid token\"\n        )\n```"
