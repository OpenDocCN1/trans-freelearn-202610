  md: "> Note\n> For a full list of filters and to learn more about filters in Jinja,\
    \ visit https://jinja.palletsprojects.com/en/3.0.x/templates/#builtin-filters.\n\
    \n# Using if statements\n\nThe usage of if statements in Jinja is similar to their\
    \ usage in Python. if statements are used in the {% %} control blocks. Let's look\
    \ at an example:\n\n```\n{% if todo | length < 5 %}\n    You don't have much items\
    \ on your todo list!\n{% else %}\n    You have a busy day it seems!\n{% endif\
    \ %}\n```\n\n# Loops\n\nWe can also iterate through variables in Jinja. This could\
    \ be a list or a general function, such as the following, for example:\n\n```\n\
    {% for todo in todos %}\n    <b> {{ todo.item }} </b>\n{% endfor %}\n```\n\nYou\
    \ can access special variables inside a for loop, such as loop.index, which gives\
    \ the index of the current iteration. The following is a list of the special variables\
    \ and their descriptions:\n\n| Variable | Description |\n|---|---|\n| loop.index\
    \ | The current iteration of the loop (1 indexed) |\n| loop.index0 | The current\
    \ iteration of the loop (0 indexed) |\n| loop.revindex | The number of iterations\
    \ from the end of the loop (1 indexed) |\n| loop.revindex0 | The number of iterations\
    \ from the end of the loop (0 indexed) |\n| loop.first | True if first iteration\
    \ |"
  merge: -1
  img_proc: true
- pgno: 73
  md: "| Variable | Description |\n|---|---|\n| loop.last | True if last iteration\
    \ |\n| loop.length | The number of items in the sequence |\n| loop.cycle | A helper\
    \ function to cycle between a list of sequences |\n| loop.depth | Indicates how\
    \ deep in a recursive loop the rendering currently is; starts at level 1 |\n|\
    \ loop.depth0 | Indicates how deep in a recursive loop the rendering currently\
    \ is; starts at level 0 |\n| loop.previtem | The item from the previous iteration\
    \ of the loop; undefined during the first iteration |\n| loop.nextitem | The item\
    \ from the following iteration of the loop; undefined during the last iteration\
    \ |\n| loop.changed(*val) | True if previously called with a different value (or\
    \ not called at all) |\n\n# Macros\n\nA macro in Jinja is a function that return\
    \ an HTML string. The main use case for macros is to avoid the repetition of code\
    \ and instead use a single function call. For example, an input macro is defined\
    \ to reduce the continuous definition of input tags in an HTML form:\n\n```\n\
    {% macro input(name, value='', type='text', size=20 %}\n    <div class=\"form\"\
    >\n        <input type=\"{{ type }}\" name=\"{{ name }}\" \n        value=\"{{\
    \ value|escape }}\" size=\"{{ size }}\">\n    </div>\n{% endmacro %}\n```\n\n\
    Now, to quickly create an input in your form, the macro is called:\n\n```\n{{\
    \ input('item') }}\n```\n\nThis will return the following:\n\n```\n<div class=\"\
    form\">\n    <input type=\"text\" name=\"item\" value=\"\" size=\"20\">\n</div>\n\
    ```"
