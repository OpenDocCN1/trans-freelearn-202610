  md: '+   - Writing tests for REST API endpoints

    +   - Test coverage


    # Technical requirements


    For this chapter, you’ll need a running MongoDB server on your local machine.
    The steps outlined in Chapter 6, Connecting to a Database, should be followed
    to get your database server up and running.


    The code used in this chapter can be found at https://github.com/PacktPublishing/Building-Python-Web-APIs-with-FastAPI/tree/main/ch08/planner.


    # Unit testing with pytest


    Unit testing is a testing procedure where individual components of an application
    are tested. This form of testing enables us to verify the working capability of
    individual components. For example, unit tests are employed in testing individual
    routes in an application to ensure the proper responses are returned.


    In this chapter, we’ll be making use of pytest, a Python testing library, to conduct
    our unit testing operations. Although Python comes with a unit testing library
    called unittest built in, the pytest library has a shorter syntax and is more
    preferred for testing applications. Let’s install pytest and write our first sample
    test.


    Let’s install the pytest library:


    ```

    (venv)$ pip install pytest

    ```


    Next, create a folder called tests that will house the test files for our application:


    ```

    (venv)$ mkdir tests && cd

    (venv)$ touch __init__.py

    ```


    Individual test filenames, during creation, will be prefixed with test_. This
    will enable the pytest library to recognize and run the test file. Let’s create
    a test file in the newly created tests directory that checks the correctness of
    the addition, subtraction, multiplication, and division arithmetic operations:


    ```

    (venv)$ touch test_arithmetic_operations.py

    ```'
  merge: -1
  img_proc: true
- pgno: 167
  md: "Let’s define the function that performs the arithmetic operations first. In\
    \ the tests file, add the following:\n\n```\ndef add(a: int , b: int) -> int:\n\
    \    return a + b\n\ndef subtract(a: int, b: int) -> int:\n    return b - a\n\n\
    def multiply(a: int, b: int) -> int:\n    return a * b\n\ndef divide(a: int, b:\
    \ int) -> int:\n    return b // a\n```\n\nNow that we have defined the operations\
    \ to be tested, we’ll create the functions that’ll handle these tests. In the\
    \ test functions, the operation to be executed is defined. The assert keyword\
    \ is used to verify that the output on the left-hand side is in correspondence\
    \ to the output of the operation on the right-hand side. In our case, we’ll be\
    \ testing that the arithmetic operations equal their respective results.\n\nAdd\
    \ the following to the tests file:\n\n```\ndef test_add() -> None:\n    assert\
    \ add(1, 1) == 2\n\ndef test_subtract() -> None:\n    assert subtract(2, 5) ==\
    \ 3\n\ndef test_multiply() -> None:\n    assert multiply(10, 10) == 100\n\ndef\
    \ test_divide() -> None:\n    assert divide(25, 100) == 4\n```"
