- pgno: 87
  md: '# 5

    Structuring FastAPI Applications


    In the last four chapters, we looked at the basic steps involved in understanding
    FastAPI and creating a FastAPI application. The application that we have built
    so far is a single-file todo application that demonstrates the flexibility and
    power of FastAPI. The key takeaway from the preceding chapters is how easy it
    is to build an application using FastAPI. However, there is a need for proper
    structuring of an application with increased complexity and functionalities.


    Structuring refers to the arrangement of application components in an organized
    format, which can be modular to improve the readability of the application’s code
    and content. An application with proper structuring enables faster development,
    faster debugging, and an overall increase in productivity.


    By the end of this chapter, you will be equipped with the knowledge of what structuring
    is and how to structure your API. In this chapter, you’ll be covering the following
    topics:


    +   - Structuring application routes and models

    +   - Implementing models for a planner API'
  merge: -1
  img_proc: true
- pgno: 88
  md: "# Technical requirements\n\nThe code used in this chapter can be found at https://github.com/PacktPublishing/Building-Python-Web-APIs-with-FastAPI/tree/main/ch05/planner.\n\
    \n# Structuring in FastAPI applications\n\nFor this chapter, we’ll be building\
    \ an event planner. Let’s design the application structure to look like this:\n\
    \n```\nplanner/\n  main.py\n  database/\n    __init__.py\n    connection.py\n\
    \  routes/\n    __init__.py\n    events.py\n    users.py\n  models/\n    __init__.py\n\
    \    events.py\n    users.py\n```\n\nThe first step is to create a new folder\
    \ for the application. It will be named planner:\n\n```\n$ mkdir planner && cd\
    \ planner\n```\n\nIn the newly created planner folder, create an entry file, main.py,\
    \ and three subfolders – database, routes, and models:\n\n```\n$ touch main.py\n\
    $ mkdir database routes models\n```\n\nNext, create __init__.py in every folder:\n\
    \n```\n$ touch {database,routes,models}/__init__.py\n```"
