  md: "![](img/85e42522e1d8d05fd8b981490d6d9056_145_0.png)\n\nFigure 7.3 – Result\
    \ from the find all users query\n\nThe preceding command returns the list of users,\
    \ and we can now confirm that the user’s password was hashed before it was stored\
    \ in the database. Now that we have successfully built the components for securely\
    \ storing user passwords, let’s build the components for creating and verifying\
    \ JWTs.\n\n# Creating and verifying access tokens\n\nCreating a JWT takes us a\
    \ step closer to securing our application. The token’s payload will comprise the\
