- pgno: 33
  md: '# 2

    Routing in FastAPI


    **Routing** is an essential part of building a web application. Routing in FastAPI
    is flexible and hassle-free. Routing is the process of handling **HTTP requests**
    sent from a client to the server. HTTP requests are sent to defined routes, which
    have defined handlers for processing the requests and responding. These handlers
    are called route handlers.


    By the end of this chapter, you will know how to create routes using the **APIRouter**
    instance and connect to the main **FastAPI** application. You will also learn
    what models are and how to use them to validate request bodies. You will also
    learn what path and query parameters are and how to use them in your FastAPI application.
    The knowledge of routing in FastAPI is essential in building small- and large-scale
    applications.


    In this chapter, we’ll be covering the following topics:


    +   - Routing in FastAPI

    +   - The `APIRouter` class

    +   - Validation using Pydantic models

    +   - Path and query parameters

    +   - Request body

    +   - Building a simple CRUD app'
  merge: -1
  img_proc: true
- pgno: 34
  md: "# Technical requirements\n\nThe code used in this chapter can be found at the\
    \ https://github.com/PacktPublishing/Building-Python-Web-APIs-with-FastAPI/tree/main/ch02/todos.\n\
    \n# Understanding routing in FastAPI\n\nA route is defined to accept requests\
    \ from an HTTP request method and optionally take parameters. When a request is\
    \ sent to a route, the application checks whether the route is defined before\
    \ processing the request in the route handler. On the other hand, a route handler\
    \ is a function that processes the request sent to the server. An example of a\
    \ route handler is a function that retrieves records from a database when a request\
    \ is sent to a router via a route.\n\n> **What are HTTP request methods?**\n>\
    \ HTTP methods are identifiers for indicating the type of action to be carried\
    \ out. The standard methods include GET, POST, PUT, PATCH, and DELETE. You can\
    \ learn more about HTTP methods at https://developer.mozilla.org/en-US/docs/Web/HTTP/Methods.\n\
    \n# Routing example\n\nIn the *Project scaffolding* section in the previous chapter,\
    \ we built a single route application. The routing was handled by the FastAPI()\
    \ instance initiated in the app variable:\n\n```\nfrom fastapi import FastAPI\n\
    \napp = FastAPI()\n\n@app.get(\"/\")\nasync def welcome() -> dict:\n    return\
    \ { \"message\": \"Hello World\"}\n```\n\nThe **uvicorn** tool was pointed to\
    \ the FastAPI's instance to serve the application:\n\n```\n(venv)$ uvicorn api:app\
    \ --port 8080 --reload\n```"
  merge: -1
  img_proc: true
- pgno: 35
  md: "Traditionally, the FastAPI () instance can be used for routing operations,\
    \ as seen previously. However, this method is commonly used in applications that\
    \ require a single path during routing. In a situation where a separate route\
    \ performing a unique function is created using the FastAPI () instance, the application\
    \ will be unable to run both routes, as uvicorn can only run one entry point.\n\
    \nHow then do you handle extensive applications that require a series of routes\
    \ performing different functions? We’ll look at how the APIRouter class helps\
    \ with multiple routing in the next section.\n\n# Routing with the APIRouter class\n\
    \nThe APIRouter class belongs to the FastAPI package and creates path operations\
    \ for multiple routes. The APIRouter class encourages modularity and organization\
    \ of application routing and logic.\n\nThe APIRouter class is imported from the\
    \ fastapi package, and an instance is created. The route methods are created and\
    \ distributed from the instance created, such as the following:\n\n```\nfrom fastapi\
    \ import APIRouter\n\nrouter = APIRouter()\n\n@router.get(\"/hello\")\nasync def\
    \ say_hello() -> dict:\n    return {\"message\": \"Hello!\"}\n```\n\nLet’s create\
    \ a new path operation with the APIRouter class to create and retrieve todos.\
    \ In the todos folder from the previous chapter, create a new file, todo.py:\n\
    \n```\n(venv)$ touch todo.py\n```\n\nWe’ll start by importing the APIRouter class\
    \ from the fastapi package and creating an instance:\n\n```\nfrom fastapi import\
    \ APIRouter\n\ntodo_router = APIRouter().\n```"
  merge: -1
  img_proc: true
- pgno: 36
  md: "Next, we’ll create a temporary in-app database, alongside two routes for the\
    \ addition and retrieval of todos:\n\n```\ntodo_list = []\n\n@todo_router.post(\"\
    /todo\")\nasync def add_todo(todo: dict) -> dict:\n    todo_list.append(todo)\n\
    \    return {\"message\": \"Todo added successfully\"}\n\n@todo_router.get(\"\
    /todo\")\nasync def retrieve_todos() -> dict:\n    return {\"todos\": todo_list}\n\
    ```\n\nIn the preceding code block, we have created two routes for our todo operations.\
    \ The first route adds a todo to the todo list via the POST method, and the second\
    \ route retrieves all the todo items from the todo list via the GET method.\n\n\
    We have completed the path operations for the todo route. The next step is to\
    \ serve the application to production so that we can test the path operations\
    \ defined.\n\nThe APIRouter class works in the same way as the FastAPI class does.\
    \ However, uvicorn cannot use the APIRouter instance to serve the application,\
    \ unlike the FastAPIs. Routes defined using the APIRouter class are added to the\
    \ fastapi instance to enable their visibility.\n\nTo enable the visibility of\
    \ the todo routes, we’ll include the todo_router path operations handler to the\
    \ primary FastAPI instance using the include_router() method.\n\n> include_router()\n\
    > The include_router(router, ...) method is responsible for adding routes defined\
    \ with the APIRouter class to the main application’s instance to enable the routes\
    \ to become visible.\n\nIn api.py, import todo_router from todo.py:\n\n```\nfrom\
    \ todo import todo_router\n```"
  merge: -1
  img_proc: true
- pgno: 37
  md: "Include the todo_router in the FastAPI application, using the include_router\
    \ method from the FastAPI instance:\n\n```\nfrom fastapi import FastAPI\nfrom\
    \ todo import todo_router\n\napp = FastAPI()\n\n@app.get(\"/\")\nasync def welcome()\
    \ -> dict:\n    return {\n        \"message\": \"Hello World\"\n    }\n\napp.include_router(todo_router)\n\
    ```\n\nWith everything in place, start the application from your terminal:\n\n\
    ```\n(venv)$ uvicorn api:app --port 8000 --reload\n```\n\nThe preceding command\
    \ starts our application and gives us a real-time log of our application processes:\n\
    \n```\n(venv) → todos git:(main) X uvicorn api:app --port 8000 --reload\nINFO:\
    \ Will watch for changes in these directories: ['/Users/youngestdev/Work/Building-Web-APIs-with-FastAPI-and-Python/ch02/todos']\n\
    INFO:     uvicorn running on http://127.0.0.1:8000 (Press CTRL+C to quit)\nINFO:\
    \     Started reloader process [4732] using statreload\nINFO:     Started server\
    \ process [4734]\nINFO:     Waiting for application startup.\nINFO:     Application\
    \ startup complete.\n```\n\nThe next step is to test the application by sending\
    \ a GET request using curl:\n\n```\n(venv)$ curl http://0.0.0.0:8080/\n```"
  merge: -1
  img_proc: true
- pgno: 38
  md: "The response from the application logged in your console:\n\n```\n{\"message\"\
    :\"Hello World\"}\n```\n\nNext, we check whether the todo routes are functional:\n\
    \n```\n(venv)$ curl -X 'GET' \\\n'http://127.0.0.1:8000/todo' \\\n-H 'accept:\
    \ application/json'\n```\n\nThe response from the application logged in your console\
    \ should be as follows:\n\n```\n{\n  \"todos\": []\n}\n```\n\nThe todo route worked!\
    \ Let's test the POST operation by sending a request to add an item to our todo\
    \ list:\n\n```\n(venv)$ curl -X 'POST' \\\n'http://127.0.0.1:8000/todo' \\\n-H\
    \ 'accept: application/json' \\\n-H 'Content-Type: application/json' \\\n-d '{\n\
    \"id\": 1,\n\"item\": \"First Todo is to finish this book!\"\n}'\n```\n\nWe have\
    \ the following response:\n\n```\n{\n  \"message\": \"Todo added successfully.\"\
    \n}\n```\n\nWe’ve learned how the APIRouter class works and how to include it\
    \ in the primary application instance to enable the usage of the path operations\
    \ defined. The todo routes built in this section lacked models, otherwise known\
