- pgno: 39
  md: "# Validating request bodies using Pydantic models\n\nIn FastAPI, request bodies\
    \ can be validated to ensure only defined data is sent. This is crucial, as it\
    \ serves to sanitize request data and reduce malicious attacks’ risks. This process\
    \ is known as validation.\n\nA model in FastAPI is a structured class that dictates\
    \ how data should be received or parsed. Models are created by subclassing Pydantic’s\
    \ BaseModel class.\n\n> **What is Pydantic?**\n> Pydantic is a Python library\
    \ that handles data validation using Python-type annotations.\n\nModels, when\
    \ defined, are used as type hints for request body objects and request-response\
    \ objects. In this chapter, we will only look at using Pydantic models for request\
    \ bodies.\n\nAn example model is as follows:\n\n```\nfrom pydantic import BaseModel\n\
    \nclass PacktBook(BaseModel):\n    id: int\n    Name: str\n    Publishers: str\n\
    \    Isbn: str\n```\n\nIn the preceding code block above, we defined a PacktBook\
    \ model as a subclass of Pydantic’s BaseModel class. A variable type hinted to\
    \ the PacktBook class can only take four fields, as defined previously. In the\
    \ next couple of examples, we see how Pydantic helps in validating inputs.\n\n\
    In our todo application earlier, we defined a route to add an item to our todo\
    \ list. In the route definition, we set the request body to a dictionary:\n\n\
    ```\nasync def add_todo(todo: dict) -> dict:\n    ...\n```"
  merge: -1
  img_proc: true
- pgno: 40
  md: "In the example POST request, the data sent was in the following format:\n\n\
    ```\n{\n    \"id\": id,\n    \"item\": item\n}\n```\n\nHowever, an empty dictionary\
    \ could’ve also been sent without returning any error. A user can send a request\
    \ with a body different from the one shown previously. Creating a model with the\
    \ required request body structure and assigning it as a type to the request body\
    \ ensures that only the data fields present in the model are passed.\n\nFor example,\
    \ to ensure only the request body contains fields in the preceding example, create\
    \ a new model.py file and add the following code below to it:\n\n```\nfrom Pydantic\
    \ import BaseModel\n\nclass Todo(BaseMode):\n    id: int\n    item: str\n```\n\
    \nIn the preceding code block, we have created a Pydantic model that accepts only\
    \ two fields:\n\n+   - id of type integer\n+   - item of type string\n\nLet’s\
    \ go ahead and use the model in our POST route. In api.py, import the model:\n\
    \n```\nfrom model import Todo\n```\n\nNext, replace the request body variable\
    \ type from dict to Todo:\n\n```\ntodo_list = []\n\n@todo_router.post(\"/todo\"\
    )\nasync def add_todo(todo: Todo) -> dict:\n    todo_list.append(todo)\n    return\
    \ {\"message\": \"Todo added successfully\"}\n```"
  merge: -1
  img_proc: true
- pgno: 41
  md: "```\n@todo_router.get(\"/todo\")\nasync def retrieve_todos() -> dict:\n   \
    \ return {\"todos\": todo_list}\n```\n\nLet’s verify the new request body validator\
    \ by sending an empty dictionary as the request body:\n\n```\n(venv)$ curl -X\
    \ 'POST' \\\n  'http://127.0.0.1:8000/todo' \\\n  -H 'accept: application/json'\
    \ \\\n  -H 'Content-Type: application/json' \\\n  -d '{\n}'\n```\n\nWe get a response,\
    \ indicating the absence of the id and item field in the request body:\n\n```\n\
    {\n  \"detail\": [\n    {\n      \"loc\": [\n        \"body\",\n        \"id\"\
    \n      ],\n      \"msg\": \"field required\",\n      \"type\": \"value_error.missing\"\
    \n    },\n    {\n      \"loc\": [\n        \"body\",\n        \"item\"\n     \
    \ ],\n      \"msg\": \"field required\",\n      \"type\": \"value_error.missing\"\
    \n    }\n  ]\n}\n```"
  merge: -1
  img_proc: true
- pgno: 42
  md: "Sending a request with correct data returns a successful response:\n\n```\n\
    (venv)$ curl -X 'POST' \\\n  'http://127.0.0.1:8000/todo' \\\n  -H 'accept: application/json'\
    \ \\\n  -H 'Content-Type: application/json' \\\n  -d '{\n  \"id\": 2,\n  \"item\"\
    : \"Validation models help with input types\"\n}'\n```\n\nHere is the response:\n\
    \n```\n{\n  \"message\": \"Todo added successfully.\"\n}\n```\n\n# Nested models\n\
    \nPydantic models can also be nested, such as the following:\n\n```\nclass Item(BaseModel)\n\
    \    item: str\n    status: str\n\nclass Todo(BaseModel)\n    id: int\n    item:\
    \ Item\n```\n\nAs a result, a todo of type Todo will be represented as the following:\n\
    \n```\n{\n  \"id\": 1,\n  \"item\": {\n    \"item\": \"Nested models\",\n    \"\
    Status\": \"completed\"\n  }\n}\n```"
  merge: -1
  img_proc: true
- pgno: 43
  md: "We have learned what models are, how to create one, and their use cases. We\
    \ will be using it subsequently in the remaining parts of this book. In the next\
    \ section, let's look at **path** and **query** parameters.\n\n# Path and query\
    \ parameters\n\nIn the previous section, we learned what models are and how they\
    \ are used to validate request bodies. In this section, you'll learn what path\
    \ and query parameters are, the role they play in routing, and how to use them.\n\
    \n# Path parameters\n\nPath parameters are parameters included in an API route\
    \ to identify resources. These parameters serve as an identifier and, sometimes,\
    \ a bridge to enable further operations in a web application.\n\nWe currently\
    \ have routes for adding a todo and retrieving all the todos in our todo application.\
    \ Let's create a new route for retrieving a single todo by appending the todo's\
    \ ID as a path parameter.\n\nIn `todo.py`, add the new route:\n\n```\nfrom fastapi\
    \ import APIRouter, Path\nfrom model import Todo\n\ntodo_router = APIRouter()\n\
    \ntodo_list = []\n\n@todo_router.post(\"/todo\")\nasync def add_todo(todo: Todo)\
    \ -> dict:\n    todo_list.append(todo)\n    return {\n        \"message\": \"\
    Todo added successfully.\"\n    }\n```"
  merge: -1
  img_proc: true
- pgno: 44
  md: "```\n@todo_router.get(\"/todo\")\nasync def retrieve_todo() -> dict:\n    return\
    \ {\n        \"todos\": todo_list\n    }\n\n@todo_router.get(\"/todo/{todo_id}\"\
    )\nasync def get_single_todo(todo_id: int = Path(..., title=\"The ID of the todo\
    \ to retrieve.\")) -> dict:\n    for todo in todo_list:\n        if todo.id ==\
    \ todo_id:\n            return {\n                \"todo\": todo\n           \
    \ }\n    return {\n        \"message\": \"Todo with supplied ID doesn't exist.\"\
    \n    }\n```\n\nIn the preceding code block, {todo_id} is the path parameter.\
    \ This parameter enables the application to return a matching todo with the ID\
    \ passed.\n\nLet's test the route:\n\n```\n(venv)$ curl -X 'GET' \\\n'http://127.0.0.1:8000/todo/1'\
    \ \\\n-H 'accept: application/json'\n```\n\nIn the preceding GET request, 1 is\
    \ the path parameter. Here, we are telling our todo application to return the\
    \ todo item with 1 ID.\n\nExecuting the preceding request results in the following\
    \ response:\n\n```\n{\n  \"todo\": {\n    \"id\": 1,\n    \"item\": \"First Todo\
    \ is to finish this book!\"\n  }\n}\n```"
  merge: -1
  img_proc: true
- pgno: 45
  md: "FastAPI also provides a Path class that distinguishes path parameters from\
    \ other arguments present in the route function. The Path class also helps give\
    \ route parameters more context during the documentation automatically provided\
    \ by OpenAPI via Swagger and ReDoc and acts as a validator.\n\nLet's modify the\
    \ route definition:\n\n```\nfrom fastAPI import APIRouter, Path\n\nfrom model\
    \ import Todo\n\ntodo_router = APIRouter()\n\ntodo_list = []\n\n@todo_router.post(\"\
    /todo\")\nasync def add_todo(todo: Todo) -> dict:\n    todo_list.append(todo)\n\
    \    return {\n        \"message\": \"Todo added successfully.\"\n    }\n\n@todo_router.get(\"\
    /todo\")\nasync def retrieve_todo() -> dict:\n    return {\n        \"todos\"\
    : todo_list\n    }\n\n@todo_router.get(\"/todo/{todo_id}\")\nasync def get_single_todo(todo_id:\
    \ int = Path(..., title=\"The ID of the todo to retrieve\")) -> dict:\n    for\
    \ todo in todo_list:\n        if todo.id == todo_id:\n            return {\n \
    \               \"todo\": todo\n```"
  merge: -1
  img_proc: true
- pgno: 46
  md: "```\n}\nreturn {\n    \"message\": \"Todo with supplied ID doesn't exist.\"\
    \n}\n```\n\n> **Tip – Path(..., kwargs)**\n> The Path class takes a first positional\
    \ argument set to None or ellipsis (...). If the first argument is set to an ellipsis\
    \ (...), the path parameter becomes required. The Path class also contains arguments\
    \ used for numerical validations if a path parameter is a number. Definitions\
    \ include gt and le – gt means greater than and le means less than. When used,\
    \ the route will validate the path parameter against these arguments.\n\n# Query\
    \ parameters\n\nA query parameter is an optional parameter that usually appears\
    \ after a question mark in a URL. It is used to filter requests and return specific\
    \ data based on the queries supplied.\n\nIn a route handler function, an argument\
    \ that isn’t homonymous with the path parameter is a query. You can also define\
    \ a query by creating an instance of the FastAPI Query() class in the function\
    \ argument, such as the following:\n\n```\nasync query_route(query: str = Query(None)):\n\
    \    return query\n```\n\nWe will be looking at the use cases of the query parameters\
    \ later on in the book when we discuss how to build more advanced applications\
    \ than a todo application.\n\nNow that you have learned how to create routes,\
    \ validate request bodies, and use path and query parameters in your FastAPI application,\
    \ you will learn how these components work hand in hand to form a request body\
    \ in the next section.\n\n# Request body\n\nIn the previous sections, we learned\
    \ how to use the APIRouter class and Pydantic models for request body validations\
    \ and discussed path and query parameters.\n\nA request body is data that you\
    \ send to your API using a routing method such as POST and UPDATE."
  merge: -1
  img_proc: true
- pgno: 47
  md: "**POST and UPDATE**\nThe POST method is used when an insertion into the server\
    \ is to be made, and the UPDATE method is used when existing data in the server\
    \ is to be updated.\n\nLet's take a look at a POST request from earlier on in\
    \ the chapter:\n\n```\n(venv)$ curl -X 'POST' \\\n'http://127.0.0.1:8000/todo'\
    \ \\\n-H 'accept: application/json' \\\n-H 'Content-Type: application/json' \\\
    \n-d '{\n  \"id\": 2,\n  \"item\": \"Validation models help with input types\"\
    \n}'\n```\n\nIn the preceding request, the request body is as follows:\n\n```\n\
    {\n  \"id\": 2,\n  \"item\": \"Validation models help with input types..\"\n}\n\
    ```\n\n**Tip**\nFastAPI also provides us with a Body() class to provide extra\
    \ validation.\n\nWe have learned about models in FastAPI. They also serve an additional\
    \ purpose in documenting our API endpoints and request body types. In the next\
    \ subsection, we will learn about the documentation pages generated by default\
    \ in FastAPI applications.\n\n# FastAPI Automatic Docs\n\nFastAPI generates JSON\
    \ schema definitions for our models and automatically documents our routes, including\
    \ their request body type, path and query parameters, and response models. This\
    \ documentation is of two types:\n\n+   - **Swagger**\n+   - **ReDoc**"
  merge: -1
  img_proc: true
