- pgno: 137
  md: '# 7

    Securing FastAPI Applications


    In the last chapter, we looked at how to connect a FastAPI application to a SQL
    and NoSQL database. We successfully implemented database methods and updated the
    existing routes to enable interactions between the application and the database.
    However, the planner application continues to allow anybody to add an event as
    opposed to only authenticated users. In this chapter, we will secure the application
    using JSON Web Token (JWT) and restrict some event operations to only authenticated
    users.


    Securing an application involves the addition of security measures to restrict
    access to application functionalities from unauthorized entities to prevent hacks
    or illegal modifications of the application. Authentication is the process of
    verifying the credentials passed by an entity and authorization simply means giving
    an entity permission to perform designated actions. When credentials have been
    verified, the entity is then authorized to carry out various actions.'
  merge: -1
  img_proc: true
- pgno: 138
  md: 'By the end of this chapter, you will be able to add an authentication layer
    to a FastAPI application. This chapter will explain the processes for securing
    passwords by hashing them, adding an authentication layer, and securing routes
    from unauthenticated users. In this chapter, we’ll be covering the following topics:


    +   - Authentication methods in FastAPI

    +   - Securing the application with OAuth2 and JWT

    +   - Protecting routes using dependency injection

    +   - Configuring CORS


    # Technical requirements


    To follow along, the MongoDB database component is required. The installation
    procedures for your operating system can be found in their official documentation.
    The code used in this chapter can be found at https://github.com/PacktPublishing/Building-Python-Web-APIs-with-FastAPI/tree/main/ch07/planner.


    # Authentication methods in FastAPI


    There are several authentication methods available in FastAPI. FastAPI supports
    the common authentication methods of basic HTTP authentication, cookies, and bearer
    token authentication. Let’s briefly look at what each method entails:


    +   - **Basic HTTP authentication:** In this authentication method, the user credentials,
    which is usually a username and password, are sent via an Authorization HTTP header.
    The request in turn returns a WWW-Authenticate header containing a Basic value
    and an optional realm parameter, which indicates the resource the authentication
    request is made to.

    +   - **Cookies:** Cookies are employed when data is to be stored on the client
    side, such as in web browsers. FastAPI applications can also employ cookies to
    store user data, which can be retrieved by the server for authentication purposes.

    +   - **Bearer token authentication:** This method of authentication involves
    the use of security tokens called bearer tokens. These tokens are sent alongside
    the Bearer keyword in an Authorization header request. The most used token is
    JWT, which is usually a dictionary comprising the user ID and the token’s expiry
    time.


    Every authentication method listed here has its specific use cases as well as
    its pros and cons. However, in this chapter, we’ll be making use of bearer token
    authentication.'
  merge: -1
  img_proc: true
- pgno: 139
  md: "Authentication methods are injected into FastAPI applications as dependencies\
    \ that are called at runtime. This simply means when authentication methods are\
    \ defined, they are dormant until injected into their place of use. This activity\
    \ is called **Dependency Injection.**\n\n# Dependency injection\n\nDependency\
    \ injection is a pattern where an object – in this case, a function – receives\
    \ an instance variable needed for the further execution of the function.\n\nIn\
    \ FastAPI, dependencies are injected by declaring them in the path operation function\
    \ arguments. We have been using dependency injection in previous chapters. Here’s\
    \ an example from the previous chapter where we retrieve the email field from\
    \ the user model passed to the function:\n\n```\n@user_router.post(\"/signup\"\
    )\nasync def sign_user_up(user: User) -> dict:\n    user_exist = await User.find_one(User.email\
    \ == user.email)\n```\n\nIn this code block, the dependency defined is the User\
    \ model class, which is injected into the sign_user_up() function. By injecting\
    \ the User model into the user function argument, we can easily retrieve the attributes\
    \ of the object.\n\n# Creating and using a dependency\n\nIn FastAPI, a dependency\
    \ can be defined as either a function or a class. The dependency created gives\
    \ us access to its underlying values or methods, eliminating the need to create\
    \ these objects in the functions inheriting them. Dependency injection helps in\
    \ reducing code repetition in some cases, such as in enforcing authentication\
    \ and authorization.\n\nAn example dependency is defined as follows:\n\n```\n\
    async def get_user(token: str):\n    user = decode_token(token)\n    return user\n\
    ```\n\nThis dependency is a function that takes token as the argument and returns\
    \ a user parameter from an external function, decode_token. To use this dependency,\
    \ the dependent function argument declared is set to have a Depends parameter,\
    \ for example:\n\n```\nfrom fastapi import Depends\n\n@router.get(\"/user/me\"\
    )\n```"
  merge: -1
  img_proc: true
- pgno: 140
  md: "```\nasync get_user_details(user: User = Depends(get_user)):\n    return user\n\
    ```\n\nThe route function here is dependent on the get_user function, which serves\
    \ as its dependency. What this means is that to access the preceding route, the\
    \ get_user dependency must be satisfied.\n\nThe Depends class, which is imported\
    \ from the FastAPI library, is responsible for taking the function passed as the\
    \ argument and executing it when the endpoint is called, automatically making\
    \ available to the endpoint, they return value of the function passed to it.\n\
    \nNow that you have an idea of how a dependency is created and how it’s used,\
    \ let’s build the authentication dependency for the event planner application.\n\
    \n# Securing the application with OAuth2 and JWT\n\nIn this section, we’ll build\
    \ out the authentication system for the event planner application. We’ll be making\
    \ use of the OAuth2 password flow, which requires the client to send a username\
    \ and password as form data. The username in our case is the email used when creating\
    \ an account.\n\nWhen the form data is sent to the server from the client, an\
    \ access token, which is a signed JWT, is sent as a response. Usually, a background\
    \ check is done to validate the credentials sent to the server before creating\
    \ a token to allow further authorization. To authorize the authenticated user,\
    \ the JWT is prefixed with Bearer when sent via the header to authorize the action\
    \ on the server.\n\n> What Is a JWT and Why Is It Signed?\n> A JWT is an encoded\
    \ string usually containing a dictionary housing a payload, a signature, and its\
    \ algorithm. JWTs are signed using a unique key known only to the server and client\
    \ to avoid the encoded string being tampered with by an external body.\n\n![](img/85e42522e1d8d05fd8b981490d6d9056_140_0.png)\n\
    \nFigure 7.1 – Authentication flow"
  merge: -1
  img_proc: true
