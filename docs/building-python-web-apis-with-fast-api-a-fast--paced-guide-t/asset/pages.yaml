- pgno: 114
  md: "# What Is Depends?\n\nThe Depends class is responsible for exercising dependency\
    \ injection in FastAPI applications. The Depends class takes a truth source such\
    \ as a function as an argument and is passed as a function argument in a route,\
    \ mandating that the dependency condition be satisfied before any operation can\
    \ be executed.\n\n2. Next, let’s update the POST route function responsible for\
    \ creating a new event, create_event():\n\n```\n@event_router.post(\"/new\")\n\
    async def create_event(new_event: Event,\n    session=Depends(get_session)) ->\
    \ dict:\n    session.add(new_event)\n    session.commit()\n    session.refresh(new_event)\n\
    \n    return {\n        \"message\": \"Event created successfully\"\n    }\n```\n\
    \nIn this code block, we have indicated that the session object required to execute\
    \ database transactions is dependent on the get_session() function we created\
