- pgno: 148
  md: "In the preceding code block, the function takes the token string as the argument\
    \ and runs several checks in the try block. The function first checks the expiry\
    \ time of the token. If there’s no expiry time, then no token was supplied. The\
    \ second check is the validity of the token – an exception is thrown to inform\
    \ the user of the token expiration. If the token is valid, the decoded payload\
    \ is returned.\n\nIn the except block, a bad request exception is thrown for any\
    \ JWT error.\n\nNow that we have implemented the functions for creating and verifying\
    \ the tokens sent to the application, let’s create the function that validates\
    \ user authentication and serves as the dependency.\n\n# Handling user authentication\n\
    \nWe have successfully implemented the components for hashing and comparing passwords\
