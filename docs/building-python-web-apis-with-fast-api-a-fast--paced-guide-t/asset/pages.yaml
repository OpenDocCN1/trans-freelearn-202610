    \ this:\n\n+   1. In the database folder, create a connection.py file:\n\n```\n\
    (venv)$ touch connection.py\n```\n\nPydantic enables us to read environment variables\
    \ by creating a child class of the BaseSettings parent class. When building web\
    \ APIs, it is a standard practice to store configuration variables in an environment\
    \ file.\n\n+   2. In connection.py, add the following:\n\n```\nfrom beanie import\
    \ init_beanie\nfrom motor.motor_asyncio import AsyncIOMotorClient\nfrom typing\
    \ import Optional\nfrom pydantic import BaseSettings\n\nclass Settings(BaseSettings):\n\
    \    DATABASE_URL: Optional[str] = None\n\nasync def initialize_database(self):\n\
    \    client = AsyncIOMotorClient(self.DATABASE_URL)\n    await init_beanie(\n\
    \        database=client.get_default_database(),\n                    document_models=[])\n\
    \nclass Config:\n    env_file = \".env\"\n```"
