- pgno: 11
  md: '# Preface


    FastAPI is a fast and efficient web framework for building APIs with Python. This
    book is a thorough guide on how to build an application with the FastAPI framework.


    It starts with the basics of the FastAPI framework and the other technologies
    used throughout this book. You’ll then learn about the different aspects of the
    framework: the routing system, response modeling, error handling, and templating.


    In this book, you will learn how to build fast, efficient, and scalable applications
    in Python with FastAPI. You will begin from a Hello World application to a complete
    API that uses a database, authentication, and templates. You will learn how to
    structure your application to enhance efficiency, readability, and scalability.
    By integrating with other libraries in your application, you will learn how to
    connect your application to both a SQL database and a NoSQL database, integrate
    templates, and build authentication. Toward the end of this book, you will learn
    how to write tests, containerize your application, build a continuous integration
    and delivery pipeline using GitHub actions, and deploy your application to multiple
    cloud services. All of these will be taught via a theoretical and practical approach.


    By the end of this book, you’ll be equipped with the necessary knowledge to build
    and deploy a robust web API using the FastAPI framework.


    # Who this book is for


    The primary audience for this book is any Python developer interested in building
    web APIs. The ideal reader is familiar with the basics of the Python programming
    language.


    # What this book covers


    Chapter 1, Getting Started with FastAPI, introduces the basics of FastAPI and
    other technologies used in the book. The chapter also details the steps involved
    in setting up your development environment for your FastAPI application.'
  merge: -1
  img_proc: true
- pgno: 12
  md: '*Chapter 2, Routing in FastAPI*, talks in detail about the process of creating
    endpoints using the routing system in FastAPI. The components of a routing system,
    including the request body and path parameters, are also discussed alongside validating
    them with pydantic classes.


    *Chapter 3, Response Models and Error Handling*, introduces responses in FastAPI,
    response modeling, error handling, and status codes.


    *Chapter 4, Templating in FastAPI*, discusses how templates can be used to create
    views and render responses from the API.


    *Chapter 5, Structuring FastAPI Applications*, introduces structuring applications
    and also briefly introduces the application to be built in the next chapters.


    *Chapter 6, Connecting to a Database*, discusses two classes of databases (SQL
    and NoSQL) and demonstrates how you can connect your FastAPI application to either
    of them. We’ll cover how to connect to and use a SQL database using SQLModel,
    and how to work with MongoDB using an object-document mapper, Beanie.


    *Chapter 7, Securing FastAPI Applications*, talks about what securing your application
    entails – authorization and authentication, implementing authentication, and restricting
    access to application endpoints.


    *Chapter 8, Testing FastAPI Applications*, explains what testing is and how to
    test our API endpoints.


    *Chapter 9, Deploying FastAPI Applications*, discusses the steps involved in deploying
    your FastAPI application.


    # To get the most out of this book


    You will need the latest version of Python installed on your computer. You also
    need to be familiar with the Python programming language to get the most out of
    this book.


    | Software/hardware covered in the book | Operating system requirements |

    |---|---|

    | Python 3.10 | Windows, macOS, or Linux |

    | Git 2.36.0 | Windows, macOS, or Linux |


    If you are using the digital version of this book, we advise you to type the code
    yourself or access the code from the book’s GitHub repository (a link is available
    in the next section). Doing so will help you avoid any potential errors related
    to the copying and pasting of code.'
  merge: -1
