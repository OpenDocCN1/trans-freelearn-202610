    +   - Files in the models folder:

    +     - events.py: This file will contain the model definition for events operations.

    +     - users.py: This file will contain the model definition for user operations.


    Now that we have successfully structured our API and grouped similar files with
    respect to their functions into components, let’s begin the implementation of
    the application in the next section.


    # Building an event planner application


    In this section, we’ll be building an event planner application. In this application,
    registered users will be able to create, update, and delete events. Events created
    can be viewed by navigating to the event page created automatically by the application.


    Each registered user and event will have a unique ID. This is to prevent conflict
    in managing users and events with the same ID. In this section, we will not be
    prioritizing authentication or database management, as this will be discussed
    in depth in Chapter 6, Connecting to a Database, and Chapter 7, Securing FastAPI
    Applications.'
