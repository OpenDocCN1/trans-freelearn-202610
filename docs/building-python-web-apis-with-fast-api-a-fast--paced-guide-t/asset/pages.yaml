  md: "Switch back to the main branch:\n\n```\n(venv)$ git checkout main\n```\n\n\
    Now that you are back to the original version of the application, let’s incorporate\
    \ MongoDB as the database platform and implement CRUD operations in the next section.\n\
    \n# Setting up MongoDB\n\nThere are a number of libraries that allow us to integrate\
    \ MongoDB into our FastAPI application. However, we’ll be using Beanie, an asynchronous\
    \ Object Document Mapper (ODM) library, to execute database operations from our\
    \ application.\n\nLet’s install the beanie library by running the following command:\n\
    \n```\n(venv)$ pip install beanie\n```\n\nBefore diving into the integration,\
    \ let’s look at some of the methods from the Beanie library and also how database\
    \ tables are created in this section.\n\n# Document\n\nIn SQL, the data stored\
    \ in rows and columns are contained in the table. In a NoSQL database, it is called\
    \ a document. The document represents how the data will be stored in the database\
    \ collection. Documents are defined the same way a Pydantic model is defined,\
    \ except that the Document class from the Beanie library is inherited instead.\n\
    \nAn example document is defined as follows:\n\n```\nfrom beanie import Document\n\
    \nclass Event(Document):\n    name: str\n    location: str\n\n    class Settings:\n\
    \        name = \"events\"\n```\n\nThe Settings subclass is defined to tell the\
    \ library to create the collection name passed in the MongoDB database."
