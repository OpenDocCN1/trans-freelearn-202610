- pgno: 60
  md: '# Technical requirements


    The code used in this chapter can be found at https://github.com/PacktPublishing/Building-Python-Web-APIs-with-FastAPI/tree/main/ch03/todos.


    # Understanding responses in FastAPI


    Responses are an integral part of an API''s life cycle. Responses are the feedback
    received from interacting with an API route via any of the standard HTTP methods.
    An API response is usually in JSON or XML format, but it can also be in the form
    of a document. A response consists of a header and a body.


    # What is a response header?


    A response header consists of the request''s status and additional information
    to guide the delivery of the response body. An example of the information contained
    in the response header is Content-Type, which tells the client the content type
    returned.


    # What is a response body?


    The response body, on the other hand, is the data requested from the server by
    the client. The response body is determined from the Content-Type header variable
    and the most commonly used one is application/json. In the previous chapter, the
    list of to-dos returned is the response body.


    Now that you''ve learned what responses are and what they consist of, let''s take
    a look at HTTP status codes included in responses in the next section.


    # Status codes


    Status codes are unique short codes issued by a server in response to a client''s
    request. Response status codes are grouped into five categories, each denoting
    a different response:


    +   - 1XX: Request has been received.

    +   - 2XX: The request was successful.

    +   - 3XX: Request redirected.

    +   - 4XX: There''s an error from the client.

    +   - 5XX: There''s an error from the server.'
  merge: -1
  img_proc: true
- pgno: 61
  md: "A complete list of HTTP status codes can be found at https://httpstatuses.com/.\n\
    \nThe first digit of a status code defines its category. Common status codes include\
    \ 200 for a successful request, 404 for request not found, and 500 indicating\
    \ an internal server error.\n\nThe standard practice followed in building web\
    \ applications, irrespective of the framework, is to return appropriate status\
    \ codes for individual events. A 400 status code shouldn’t be returned for a server\
    \ error. Likewise, a 200 status code shouldn’t be returned for a failed request\
    \ operation.\n\nNow that you have learned what status codes are, let’s learn how\
    \ to build response models in the next section.\n\n# Building response models\n\
    \nWe established the purpose of response models at the beginning of this chapter.\
    \ You also learned how to build models in the previous chapter using Pydantic.\
    \ Response models are also built on Pydantic but serve a different purpose.\n\n\
    In the definition of route paths, we have the following, for example:\n\n```\n\
    @app.get(\"/todo\")\nasync def retrieve_todo() -> dict:\n    return {\n      \
    \  \"todos\": todo_list\n    }\n```\n\nThe route returns a list of to-dos present\
    \ in the database. Here’s some example output:\n\n```\n{\n  \"todos\": [\n   \
    \ {\n      \"id\": 1,\n      \"item\": \"Example schema 1!\"\n    },\n    {\n\
    \      \"id\": 2,\n      \"item\": \"Example schema 2!\"\n    },\n    {\n    \
    \  \"id\": 3,\n```"
