    ```


    The response from the application logged in your console will be the following:


    ```

    {"message":"Hello World"}

    ```


    # Summary


    In this chapter, we have learned how to install the tools required to set up our
    development environment. We have also built a simple API as an introduction to
    FastAPI and learned how to create a route in the process.


    In the next chapter, you will be introduced to routing in FastAPI. First, you
    will be introduced to the process of building models to validate request payloads
    and responses using Pydantic. You will then learn about Path and Query parameters
    as well as request body, and finally, you will learn how to build a CRUD todo
    application.'
