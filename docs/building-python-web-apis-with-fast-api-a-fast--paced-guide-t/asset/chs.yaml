  \n```\n(venv)$ curl -X 'POST' \\\n  'http://0.0.0.0:8080/user/signin' \\\n  -H 'accept:\
  \ application/json' \\\n  -H 'Content-Type: application/json' \\\n  -d '{\n  \"\
  email\": \"fastapi@packt.com\",\n  \"password\": \"strong!!!\"\n}'\n```\n\n请求返回\
  \ HTTP 200 成功消息：\n\n```\n{\n  \"message\": \"User signed in successfully.\"\n}\n\
  ```\n\n我们已使用 Beanie 库成功实现了 CRUD 操作。\n\n### Summary\n\n在本章中，我们学习了如何分别使用 SQLModel\
  \ 和 Beanie 添加 SQL 和 NoSQL 数据库。我们使用了之前章节中的所有知识。我们还测试了路由以确保它们按计划工作。\n\n在下一章中，您将了解如何保护您的应用程序。您将首先学习身份验证的基础知识以及\
  \ FastAPI 开发人员可用的各种身份验证方法。然后您将实现一个依赖于 JSON Web Token (JWT) 的身份验证系统并保护创建、更新和删除事件的路由。最后，您将修改创建事件的路由以允许将事件链接到用户。\n\
  \n### 7\n### Securing FastAPI Applications\n\n在上一章中，我们研究了如何将 FastAPI 应用程序连接到 SQL\
  \ 和 NoSQL 数据库。我们成功实现了数据库方法并更新了现有路由以实现应用程序与数据库之间的交互。然而，规划应用程序仍然允许任何人添加事件，而不仅仅是经过身份验证的用户。在本章中，我们将使用\
  \ JSON Web Token (JWT) 保护应用程序并将某些事件操作限制为仅经过身份验证的用户。\n\n保护应用程序涉及添加安全措施以限制未经授权的实体访问应用程序功能，以防止黑客攻击或对应用程序进行非法修改。身份验证是验证实体传递的凭据的过程，而授权\
  \ simply 意味着给予实体执行指定操作的权限。当凭据已被验证后，该实体将被授权执行各种操作。\n\n\n\n\n\n在本章结束时，你将能够为 FastAPI\
  \ 应用添加一层身份验证。本章将解释通过哈希保护密码、添加身份验证层以及保护未通过身份验证用户访问路由的过程。在本章中，我们将涵盖以下主题：\n\n- FastAPI\
  \ 中的身份验证方法\n- 使用 OAuth2 和 JWT 保护应用程序\n- 使用依赖注入保护路由\n- 配置 CORS\n\n### 技术要求\n\n要跟上进度，需要\
  \ MongoDB 数据库组件。适用于你操作系统的安装程序可以在其官方文档中找到。本章使用的代码可以在 https://github.com/PacktPublishing/Building-Python-Web-APIs-with-FastAPI/tree/main/ch07/planner\
  \ 找到。\n\n### FastAPI 中的身份验证方法\n\nFastAPI 中有多种身份验证方法可用。FastAPI 支持常见的身份验证方法，即基本 HTTP\
  \ 身份验证、Cookie 和 Bearer 令牌身份验证。让我们简要了解一下每种方法的内容：\n\n- **基本 HTTP 身份验证：** 在这种身份验证方法中，用户凭据，通常是用户名和密码，通过\
  \ Authorization HTTP 头发送。请求反过来返回一个包含 Basic 值和可选 realm 参数的 WWW-Authenticate 头，该参数表示进行身份验证请求的资源。\n\
  - **Cookies：** 当数据需要在客户端存储时，例如在 Web 浏览器中，就会使用 Cookie。FastAPI 应用也可以使用 Cookie 来存储用户数据，服务器可以检索这些数据用于身份验证目的。\n\
  - **Bearer 令牌身份验证：** 这种身份验证方法涉及使用称为 Bearer 令牌的安全令牌。这些令牌与 Bearer 关键字一起发送在 Authorization\
  \ 头请求中。最常用的令牌是 JWT，它通常是一个包含用户 ID 和令牌过期时间的字典。\n\n这里列出的每种身份验证方法都有其特定的用例以及优缺点。然而在本章中，我们将使用\
  \ Bearer 令牌身份验证。\n\n身份验证方法作为依赖项注入到 FastAPI 应用中，并在运行时调用。这仅仅意味着当身份验证方法被定义时，它们处于休眠状态，直到被注入到使用位置。这种活动称为\
  \ **依赖注入。**\n\n#### 依赖注入\n\n依赖注入是一种模式，其中一个对象——在本例中为函数——接收实例变量以供函数进一步执行所需。\n\n在 FastAPI\
  \ 中，依赖项是通过在路径操作函数参数中声明它们来注入的。我们在前几章中使用了依赖注入。以下是上一章中的一个示例，我们从传递给函数的用户模型中检索 email\
  \ 字段：\n\n```\n@user_router.post(\"/signup\")\nasync def sign_user_up(user: User)\
  \ -> dict:\n    user_exist = await User.find_one(User.email == user.email)\n```\n\
  \n在此代码块中，定义的依赖项是 User 模型类，它被注入到 sign_user_up() 函数中。通过将 User 模型注入到 user 函数参数中，我们可以轻松检索对象的属性。\n\
  \n#### 创建和使用依赖项\n\n在 FastAPI 中，依赖项可以定义为函数或类。创建的依赖项使我们能够访问其底层值或方法，从而无需在继承它们的函数中创建这些对象。依赖注入有助于在某些情况下减少代码重复，例如强制执行身份验证和授权。\n\
  \n一个示例依赖项定义如下：\n\n```\nasync def get_user(token: str):\n    user = decode_token(token)\n\
  \    return user\n```\n\n此依赖项是一个函数，它以 token 作为参数并从外部函数 decode_token 返回 user 参数。要使用此依赖项，依赖函数参数声明设置为具有\
  \ Depends 参数，例如：\n\n```\nfrom fastapi import Depends\n\n@router.get(\"/user/me\"\
  )\n```\n\n```\nasync get_user_details(user: User = Depends(get_user)):\n    return\
  \ user\n```\n\n这里的路由函数依赖于 get_user 函数，后者充当其依赖项。这意味着要访问前述路由，必须满足 get_user 依赖项。\n\n\
  Depends 类从 FastAPI 库导入，负责接收作为参数传递的函数，并在端点被调用时执行它，自动将传递给它的函数的返回值提供给端点。\n\n现在你已经对如何创建依赖项以及如何使用它有了一些了解，让我们为活动规划应用构建身份验证依赖项。\n\
  \n### 使用 OAuth2 和 JWT 保护应用程序\n\n在本节中，我们将为活动规划应用构建身份验证系统。我们将使用 OAuth2 密码流，这需要客户端以表单数据的形式发送用户名和密码。在我们的例子中，用户名是创建账户时使用的电子邮件。\n\
  \n当表单数据从客户端发送到服务器时，作为响应的访问令牌，即签名的 JWT，会被发送。通常，在创建令牌以允许进一步授权之前，会进行后台检查以验证发送到服务器的凭据。为了授权已通过身份验证的用户，JWT\
  \ 在通过头发送时会被 Bearer 前缀，以授权服务器上的操作。\n\n> 什么是 JWT 以及为什么要对其进行签名？\n> JWT 是一个编码字符串，通常包含一个包含负载、签名及其算法的字典。JWT\
  \ 使用只有服务器和客户端知道的唯一密钥进行签名，以避免编码字符串被外部主体篡改。\n\n![](img/85e42522e1d8d05fd8b981490d6d9056_140_0.png)\n\
  \n图 7.1 – 身份验证流程\n\n现在我们对身份验证流程的工作原理有了一些了解，让我们创建设置应用程序中身份验证系统所需的必要文件夹和文件：\n\n1.\
  \ 在项目文件夹中，首先创建 auth 文件夹：\n\n```\n(venv)$ mkdir auth\n```\n\n2. 接下来，在 auth 文件夹中创建以下文件：\n\
  \n```\n(venv)$ cd auth && touch {__init__,jwt_handler,authenticate,hash_password}.py\n\
  ```\n\n前面的命令创建了四个文件：\n\n- jwt_handler.py：此文件将包含用于编码和解码 JWT 字符串所需的函数。\n- authenticate.py：此文件将包含\
  \ authenticate 依赖项，该依赖项将被注入到我们的路由中以强制执行身份验证和授权。\n- hash_password.py：此文件将包含在注册期间用于加密用户密码以及在登录期间比较密码的函数。\n\
  - __init__.py：此文件表示文件夹的内容作为模块。\n\n现在文件已经创建，让我们构建各个组件。我们将首先创建用于哈希用户密码的组件。\n\n####\
  \ 哈希密码\n\n在上一章中，我们以明文形式存储用户密码。这是在构建 API 时高度不安全且被禁止的做法。密码应使用适当的库进行加密或哈希。我们将使用 bcrypt\
  \ 对用户密码进行加密。\n\n让我们安装 passlib 库。该库包含我们将用于哈希用户密码的 bcrypt 哈希算法：\n\n```\n(venv)$ pip\
  \ install passlib[bcrypt]\n```\n\n现在我们已经安装了该库，让我们在 hash_password.py 中创建用于哈希密码的函数：\n\
  \n```\nfrom passlib.context import CryptContext\n\npwd_context = CryptContext(schemes=[\"\
  bcrypt\"],\n```\n\n```\ndeprecated=\"auto\")\n\nclass HashPassword:\n    def create_hash(self,\
  \ password: str):\n        return pwd_context.hash(password)\n\n    def verify_hash(self,\
  \ plain_password: str,\n    hashed_password: str):\n        return pwd_context.verify(plain_password,\n\
  \            hashed_password)\n```\n\n在前面的代码块中，我们首先导入 CryptContext，它接受用于哈希传递给它的字符串的\
  \ bcrypt 方案。上下文存储在 pwd_context 变量中，使我们能够访问执行任务所需的<|message|>\n\n```\nuser.email)\n\
  \nif user_exist:\n    raise HTTPException(\n        status_code=status.HTTP_409_CONFLICT,\n\
  \        detail=\"User with email provided exists already.\"\n    )\nhashed_password\
  \ = hash_password.create_hash(\nuser.password)\nuser.password = hashed_password\n\
  await user_database.save(user)\nreturn {\n    \"message\": \"User created successfully\"\
  \n}\n```\n\n现在我们已将用户注册路由更新为在保存前对密码进行哈希处理，让我们创建一个新用户来确认。在终端窗口中启动应用程序：\n\n```\n(venv)$\
  \ python main.py\nINFO:     Uvicorn running on http://0.0.0.0:8080 (Press CTRL+C\
  \ to quit)\nINFO:     Started reloader process [8144] using statreload\nINFO:  \
  \   Started server process [8147]\nINFO:     Waiting for application startup.\n\
  INFO:     Application startup complete.\n```\n\n在另一个终端窗口中启动 MongoDB 实例：\n\n```\n\
  $ mongod --dbpath database --port 27017\n```\n\n接下来，让我们创建一个新用户：\n\n```\n$ curl -X\
  \ 'POST' \\\n'http://0.0.0.0:8080/user/signup' \\\n-H 'accept: application/json'\
  \ \\\n-H 'Content-Type: application/json' \\\n-d '{\n\"email\": \"reader@packt.com\"\
  ,\n\"password\": \"exemplary\"\n}'\n```\n\n我们从上述请求中获得了成功响应：\n\n```\n{\n    \"message\"\
  : \"User created successfully\"\n}\n```\n\n现在我们已创建了一个用户，让我们验证发送到数据库的密码是否已进行哈希处理。为此，我们将创建一个交互式\
  \ MongoDB 会话，允许我们从数据库内部运行命令。\n\n在新的终端窗口中，运行以下命令：\n\n```\n$ mongo --port 27017\n\
  ```\n\n启动了交互式 MongoDB 会话：\n\n![](img/85e42522e1d8d05fd8b981490d6d9056_144_0.png)\n\
  \n图 7.2 – 一个交互式 MongoDB 会话\n\n在交互式会话运行时，运行一系列命令以切换到 planner 数据库并检索所有用户记录：\n\n```\n\
  > use planner\n> db.users.find({})\n```\n\n![](img/85e42522e1d8d05fd8b981490d6d9056_145_0.png)\n\
  \n图 7.3 – find all users 查询的结果\n\n前面的命令返回用户列表，我们现在可以确认用户的密码在存储到数据库之前已被哈希处理。现在我们已成功构建了安全存储用户密码的组件，让我们构建创建和验证\
  \ JWT 的组件。\n\n### 创建和验证访问令牌\n\n创建 JWT 使我们更接近于保护应用程序。令牌的负载将包含用户 ID 和编码前的过期时间，如下所示：\n\
  \n![](img/85e42522e1d8d05fd8b981490d6d9056_145_1.png)\n\n图 7.4 – JWT 的结构\n\n之前，我们了解到为什么\
  \ JWT 需要签名。JWT 使用只有发送方和接收方知道的密钥进行签名。让我们更新 database/database.py 中的 Settings 类以及环境文件\
  \ .env，以包含 SECRET_KEY 变量，该变量将用于签署 JWT：\n\n#### database/database.py\n\n```\nclass\
  \ Settings(BaseSettings):\n    SECRET_KEY: Optional[str] = None\n```\n\n#### .env\n\
  \n```\nSECRET_KEY=HI5HL3V3L$3CR3T\n```\n\n设置好后，在 jwt_handler.py 中添加以下导入：\n\n```\n\
  import time\nfrom datetime import datetime\n\nfrom fastapi import HTTPException,\
  \ status\nfrom jose import jwt, JWTError\nfrom database.database import Settings\n\
  ```\n\n在前面的代码块中，我们导入了 time 模块、HTTPException 类以及来自 FastAPI 的 status。我们还导入了负责编码和解码\
  \ JWT 的 jose 库以及 Settings 类。\n\n接下来，我们将创建一个 Settings 类的实例，以便检索 SECRET_KEY 变量并创建负责创建令牌的函数：\n\
  \n```\nsettings = Settings()\n\ndef create_access_token(user: str) -> str:\n   \
  \ payload = {\n        \"user\": user,\n        \"expires\": time.time() + 3600\n\
  \    }\n\n    token = jwt.encode(payload, settings.SECRET_KEY,\n    algorithm=\"\
  HS256\")\n    return token\n```\n\n在前面的代码块中，该函数接受一个字符串参数，该参数传递到 payload 字典中。payload\
  \ 字典包含用户和过期时间，在 JWT 解码时返回。\n\nexpires 值设置为创建后一小时。payload 然后传递给 encode() 方法，该方法接受三个参数：\n\
  \n- **Payload**：包含要编码的值的字典。\n- **Key**：用于签署 payload 的密钥。\n- **Algorithm**：用于签署 payload\
  \ 的算法。默认且最常见的是 **HS256** 算法。\n\n接下来，让我们创建一个函数来验证发送到我们应用程序的令牌的真实性：\n\n```\ndef verify_access_token(token:\
  \ str) -> dict:\n    try:\n        data = jwt.decode(token, settings.SECRET_KEY,\n\
  \        algorithms=[\"HS256\"])\n\n        expire = data.get(\"expires\")\n\n \
  \       if expire is None:\n            raise HTTPException(\n                status_code=status.HTTP_400_BAD_REQUEST,\n\
  \                detail=\"No access token supplied\"\n            )\n        if\
  \ datetime.utcnow() >\n        datetime.utcfromtimestamp(expire):\n            raise\
  \ HTTPException(\n                status_code=status.HTTP_403_FORBIDDEN,\n     \
  \           detail=\"Token expired!\"\n            )\n        return data\n\n  \
  \  except JWTError:\n        raise HTTPException(\n            status_code=status.HTTP_400_BAD_REQUEST,\n\
  \            detail=\"Invalid token\"\n        )\n```\n\n在前面的代码块中，该函数以令牌字符串作为参数，并在\
  \ try 块中运行多个检查。该函数首先检查令牌的过期时间。如果没有过期时间，则表示未提供令牌。第二个检查是令牌的有效性 – 抛出异常以通知用户令牌已过期。如果令牌有效，则返回解码后的负载。\n\
  \n在 except 块中，对于任何 JWT 错误都会抛出 bad request 异常。\n\n现在我们已实现了用于创建和验证发送到应用程序的令牌的函数，让我们创建验证用户身份验证并作为依赖项的函数。\n\
  \n### 处理用户身份验证\n\n我们已成功实现了哈希和比较密码的组件以及创建和解码 JWT 的组件。让我们实现将注入到事件路由中的依赖函数。该函数将作为检索活动会话用户的单一事实来源。\n\
  \n在 auth/authenticate.py 中，添加以下内容：\n\n```\nfrom fastapi import Depends, HTTPException,\
  \ status\nfrom fastapi.security import OAuth2PasswordBearer\n\nfrom auth.jwt_handler\
  \ import verify_access_token\n\noauth2_scheme = OAuth2PasswordBearer(tokenUrl=\"\
  /user/signin\")\n\nasync def authenticate(token: str = Depends(oauth2_scheme)) ->\
  \ str:\n    if not token:\n        raise HTTPException(\n            status_code=status.HTTP_403_FORBIDDEN,\n\
  \            detail=\"Sign in for access\"\n        )\n\n    decoded_token = verify_access_token(token)\n\
  \    return decoded_token[\"user\"]\n```\n\n在前面的代码块中，我们首先导入必要的依赖项：\n\n- Depends：这将\
  \ oauth2_scheme 注入到函数中作为依赖项。\n- OAuth2PasswordBearer：此类告诉应用程序存在安全方案。\n- verify_access_token：此函数在创建和验证访问令牌部分中定义，将用于检查令牌的有效性。\n\
  \n我们然后定义 OAuth2 方案的令牌 URL 和 authenticate 函数。authenticate 函数以令牌作为参数。函数作为依赖项注入了 OAuth\
  \ 方案。令牌被解码，如果令牌有效，则返回负载的用户字段，否则返回 verify_access_token 函数中定义的适当错误响应。\n\n现在我们已成功创建了用于保护路由的依赖项，让我们更新路由中的身份验证流程，以及将\
  \ authenticate 函数注入到事件路由中。\n\n### 更新应用程序\n\n在本节中，我们将更新路由以使用新的身份验证模型。最后，我们将更新用于添加事件的\
  \ POST 路由以填充用户记录中的 events 字段。\n\n#### 更新用户登录路由\n\n在 routes/users.py 中，更新导入：\n\n\
  ```\nfrom fastapi import APIRouter, Depends, HTTPException, status\nfrom fastapi.security\
  \ import OAuth2PasswordRequestForm\nfrom auth.jwt_handler import create_access_token\n\
  \nfrom models.users import User\n```\n\n我们从 FastAPI 的 security 模块导入了 OAuth2PasswordRequestForm\
  \ 类。这将被注入到登录路由中以检索发送的凭据：用户名和密码。让我们更新 sign_user_in() 路由函数：\n\n```\nasync def sign_user_in(user:\
  \ OAuth2PasswordRequestForm = Depends()) -> dict:\n    user_exist = await User.find_one(User.email\
  \ ==\n```\n\n\n\n\n\n```\nuser.username)\n..\nif hash_password.verify_hash(user.password,\n\
  user_exist.password):\n    access_token = create_access_token(\n    user_exist.email)\n\
  \    return {\n        \"access_token\": access_token,\n        \"token_type\":\
  \ \"Bearer\"\n    }\n```\n\n在前面的代码块中，我们将 `OAuth2PasswordRequestForm` 类注入为此函数的依赖项，确保严格遵循\
  \ OAuth 规范。在函数体中，我们比较密码并返回访问令牌和令牌类型。在测试更新后的路由之前，让我们先在 `models/users.py` 中为登录路由创建一个响应模型，以替换不再使用的\
  \ `UserSignIn` 模型类：\n\n```\nclass TokenResponse(BaseModel):\n    access_token: str\n\
  \    token_type: str\n```\n\n更新导入和登录路由的响应模型：\n\n```\nfrom models.users import User,\
  \ TokenResponse\n\n@user_router.post(\"/signin\", response_model=TokenResponse)\n\
  ```\n\n让我们访问交互式文档以确认请求体是否符合 `http://0.0.0.0:8080/docs` 上的 OAuth2 规范：\n\n![](img/85e42522e1d8d05fd8b981490d6d9056_151_0.png)\n\
  \n图 7.5 – 更新后登录路由的请求体\n\n让我们登录以验证路由是否正常工作：\n\n```\n$ curl -X 'POST' \\\n'http://0.0.0.0:8080/user/signin'\
  \ \\\n-H 'accept: application/json' \\\n-H 'Content-Type: application/x-www-form-urlencoded'\
  \ \\\n-d 'grant_type=&username=reader%40packt.com&password=exemplary&scope=&client_id=&client_secret='\n\
  ```\n\n返回的响应是一个访问令牌和令牌类型：\n\n```\n{\n  \"access_token\": \"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VyIjoicmhZG\
  \ V yQHBhY2t0LmNvbSIsImV4cGlyZXMiOjE2NTA4M4jc0MjQuMDg2NDAxfQ.LY4i5EjIzlsKdfMyWki7XH7lLeDuVt3832hNfkQx8C8\"\
  ,\n  \"token_type\": \"Bearer\"\n}\n```\n\n现在我们已经确认路由按预期工作，让我们更新事件路由以仅允许授权用户进行 CREATE、UPDATE\
  \ 和 DELETE 事件。\n\n### 更新事件路由\n\n现在我们已经实现了身份验证，让我们将身份验证依赖项注入到 POST、PUT 和 DELETE 路由函数中：\n\
  \n```\nfrom auth.authenticate import authenticate\n\nasync def create_event(body:\
  \ Event, user: str = Depends(authenticate)) -> dict:\n  ...\n\nasync def update_event(id:\
  \ PydanticObjectId, body: EventUpdate, user: str = Depends(authenticate)) -> Event:\n\
  \  ...\n\nasync def delete_event(id: PydanticObjectId, user: str = Depends(authenticate))\
  \ -> dict:\n  ...\n```\n\n注入依赖项后，交互式文档网站会自动更新以显示受保护的路由。如果我们登录到 `http://0.0.0.0:8080/docs`，我们可以在右上角看到\
  \ Authorize 按钮以及事件路由上的锁：\n\n图 7.6 – 更新后的文档页面\n\n如果我们点击 Authorize 按钮，会显示一个登录模态框。输入我们的凭据和密码后会返回以下屏幕：\n\
  \n![](img/85e42522e1d8d05fd8b981490d6d9056_153_0.png)\n\n![](img/85e42522e1d8d05fd8b981490d6d9056_153_1.png)\n\
  \n图 7.7 – 已认证用户\n\n现在我们已成功登录，我们可以创建一个事件：\n\n![](img/85e42522e1d8d05fd8b981490d6d9056_154_0.png)\n\
  \n图 7.8 – 创建新事件\n\n也可以从命令行执行相同的操作。首先，让我们获取访问令牌：\n\n```\n$ curl -X 'POST' \\\n'http://0.0.0.0:8080/user/signin'\
  \ \\\n-H 'accept: application/json' \\\n-H 'Content-Type: application/x-www-form-urlencoded'\
  \ \\\n-d 'grant_type=&username=reader%40packt.com&password=exemplary&scope=&client_id=&client_secret='\n\
  ```\n\n发送的请求返回访问令牌，即一个 JWT 字符串，以及令牌类型，即 Bearer 类型：\n\n```\n{\n  \"access_token\"\
  : \"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJlc2VyIjoi...\",\n  \"token_type\": \"\
  Bearer\"\n}\n```\n\n现在，让我们从命令行创建一个新事件：\n\n```\n$ curl -X 'POST' \\\n'http://0.0.0.0:8080/event/new'\
  \ \\\n-H 'accept: application/json' \\\n-H 'Authorization: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXV\
  \ CJ9.eyJlc2VyIjoicmVhZGVyQHBhY2t0LmNvbSIImV4cGlyZXMiOjE2NTA4Mjk xODMuNTgTg3NjAyfQ.MOXjI5GXnyzGNftdlxDGyM119_L1luPq8yCxBHepf04'\
  \ \\\n-H 'Content-Type: application/json' \\\n-d '{\n\"title\": \"FastAPI Book Launch\
  \ CLI\",\n\"image\": \"https://linktomyimage.com/image.png\",\n\"description\":\
  \ \"We will be discussing the contents of the FastAPI book in this event.Ensure\
  \ to come with your own copy to win gifts!\",\n\"tags\": [\n\"python\",\n\"fastapi\"\
  ,\n\"book\",\n\"launch\"\n],\n\"location\": \"Google Meet\"\n}'\n```\n\n在此发送的请求中，`Authorization:\
  \ Bearer` 头部也被发送，以告知应用程序我们有权执行此操作。得到的响应如下：\n\n```\n{ \"message\": \"Event created\
  \ successfully\" }\n```\n\n如果我们尝试在不传递带有有效令牌的授权头的情况下创建事件，将返回 HTTP 401 Unauthorized\
  \ 错误：\n\n```\n$ curl -X 'POST' \\\n'http://0.0.0.0:8080/event/new' \\\n-H 'accept:\
  \ application/json' \\\n-H 'Content-Type: application/json' \\\n-d '{\n\"title\"\
  : \"FastAPI BookLaunch\",\n```\n\n```\n\"image\": \"https://linktomyimage.com/image.png\"\
  ,\n\"description\": \"We will be discussing the contents of the FastAPI book in\
  \ this event.Ensure to come with your own copy to win gifts!\",\n\"tags\": [\n \
  \   \"python\",\n    \"fastapi\",\n    \"book\",\n    \"launch\"\n],\n\"location\"\
  : \"Google Meet\"\n}'\n```\n\n以下是响应：\n\n```\n$ {\n  \"detail\": \"Not authenticated\"\
  \n}\n```\n\n现在我们已成功保护了路由，让我们按如下方式更新受保护的路由：\n\n- POST 路由：将创建的事件添加到用户拥有的事件列表中。\n-\
  \ UPDATE 路由：修改路由以确保只有创建事件的用户才能更新。\n- DELETE 路由：修改路由以确保只有创建事件的用户才能删除。\n\n在上一节中，我们成功地将身份验证依赖项注入到我们的路由操作中。为了便于识别事件并防止用户删除其他用户的事件，我们还将更新事件文档类以及路由。\n\
  \n### 更新事件文档类和路由\n\n在 `models/events.py` 中向 Event 文档类添加 `creator` 字段：\n\n```\nclass\
  \ Event(Document):\n    creator: Optional[str]\n```\n\n此字段将使我们能够将对事件执行的操作限制为仅用户本人。\n\
  \n接下来，让我们修改 `routes/events.py` 中的 POST 路由，在创建新事件时更新 `creator` 字段：\n\n```\n@event_router.post(\"\
  /new\")\nasync def create_event(body: Event, user: str = Depends(authenticate))\
  \ -> dict:\n    body.creator = user\n    await event_database.save(body)\n    return\
  \ {\n        \"message\": \"Event created successfully\"\n    }\n```\n\n在前面的代码块中，我们已更新\
  \ POST 路由以将当前用户的电子邮件添加为事件的创建者。如果您创建一个新事件，事件将存储创建者的电子邮件：\n\n```\n$ curl -X 'POST'\
  \ \\\n'http://0.0.0.0:8080/event/new' \\\n-H 'accept: application/json' \\\n-H 'Authorization:\
  \ Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXV CJ9.eyJlc2VyIjoicmVhZGVyQHBhY2t0LmNvbSIImV4cGlyZXMiOjE2NTA4MzI5NjqQuMTU3MjQ4fQ.RxR1TYMx91JtVMNzYcT7718xXWX7skTCfWbnJxyf6fU'\
  \ \\\n-H 'Content-Type: application/json' \\\n-d '{\n\"title\": \"FastAPI Book Launch\"\
  ,\n\"image\": \"https://linktomyimage.com/image.png\",\n\"description\": \"We will\
  \ be discussing the contents of the FastAPI book in this event.Ensure to come with\
  \ your own copy to win gifts!\",\n\"tags\": [\n    \"python\",\n    \"fastapi\"\
  ,\n    \"book\",\n    \"launch\"\n],\n\"location\": \"Google Meet\"\n```\n\n```\n\
  }'\n```\n\n上述请求返回的响应是：\n\n```\n{\n  \"message\": \"Event created successfully\"\n\
  }\n```\n\n接下来，让我们检索数据库中存储的事件列表：\n\n```\n$ curl -X 'GET' \\\n'http://0.0.0.0:8080/event/'\
  \ \\\n-H 'accept: application/json'\n```\n\n上述请求的响应是：\n\n```\n[\n  {\n    \"_id\"\
  : \"6265a807e0c8daefb72261ea\",\n    \"creator\": \"reader@packt.com\",\n    \"\
  title\": \"FastAPI BookLaunch\",\n    \"image\": \"https://linktomyimage.com/image.png\"\
  ,\n    \"description\": \"We will be discussing the contents of the FastAPI book\
  \ in this event.Ensure to come with your own copy to win gifts!\",\n    \"tags\"\
  : [\n      \"python\",\n      \"fastapi\",\n      \"book\",\n      \"launch\"\n\
  \    ],\n    \"location\": \"Google Meet\"\n  },\n]\n```\n\n接下来，让我们更新 UPDATE 路由：\n\
  \n```\n@event_router.put(\"/{id}\", response_model=Event)\nasync def update_event(id:\
  \ PydanticObjectId, body: EventUpdate,\n```\n\n\n\nuser: str = Depends(authenticate))\
  \ -> Event:\n    event = await event_database.get(id)\n    if event.creator != user:\n\
  \        raise HTTPException(\n            status_code=status.HTTP_400_BAD_REQUEST,\n\
  \            detail=\"Operation not allowed\"\n        )\n\n在前面的代码块中，路由函数在继续执行前会检查当前用户是否可以编辑事件，否则会抛出\
  \ HTTP 400 Bad Request 异常。\n下面是一个使用不同用户的示例：\n\n```\n$ curl -X 'PUT' \\\n  'http://0.0.0.0:8080/event/6265a83fc823a3c912830074'\
  \ \\\n  -H 'accept: application/json' \\\n  -H 'Authorization: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VyIjoiZmFzdGFwaUBwYWNRdC5jb20iLCJleHBpcmVzIjoxNjUwODM5NzYxJL2NzgzMX0.MMRT6pwEDBVHTU5C1a6MV8j9wCfWhqbza9NBpZz08xE'\
  \ \\\n  -H 'Content-Type: application/json' \\\n  -d '{\n\"title\": \"FastAPI Book\
  \ Launch\"\n}'\n```\n\n以下是响应：\n\n```\n{\n  \"detail\": \"Operation not allowed\"\
  \n}\n```\n\n最后，让我们更新 DELETE 路由：\n\n```\n@event_router.delete(\"/{id}\")\nasync def\
  \ delete_event(id: PydanticObjectId, user: str = Depends(authenticate)):\n    event\
  \ = await event_database.get(id)\n    if event.creator != user:\n        raise HTTPException(\n\
  status_code=status.HTTP_404_NOT_FOUND,\n    detail=\"Event not found\"\n)\n```\n\
  \n在前面的代码块中，我们指示路由函数首先检查当前用户是否为创建者，否则抛出异常。让我们看一个另一个用户尝试删除其他用户事件的示例：\n\n```\n$ curl\
  \ -X 'DELETE' \\\n  'http://0.0.0.0:8080/event/6265a83fc823a3c912830074' \\\n  -H\
  \ 'accept: application/json' \\\n  -H 'Authorization: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VyIjoiZmFzdGFwaUBwYWNRdC5jb20iLCJleHBpcmVzIjoxNjUwODM5NzYxLjI2NzgzMX0.MMR\
  \ T6pwEDBVHTU5C1a6MV8j9wCfWhqbza9NBpZz08xE'\n```\n\n事件未找到作为响应返回：\n\n```\n{\n  \"\
  detail\": \"Event not found\"\n}\n```\n\n然而，理想的所有者可以删除事件：\n\n```\n$ curl -X 'DELETE'\
  \ \\\n  'http://0.0.0.0:8080/event/6265a83fc823a3c912830074' \\\n  -H 'accept: application/json'\
  \ \\\n  -H 'Authorization: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VyIjoicmVhZGVyQHBhY2t0LmNvbSI\
  \ sImV4cGlyZXMiOjE2NTA4MzQzOTUuMDkzMDI3fQ.IKYHWQ2YO3rQc-KR8kyfoy_54MsEVE75WbRqoVbdoW0'\n\
  ```\n\n以下是响应：\n\n```\n{\n  \"message\": \"Event deleted successfully.\"\n}\n```\n\
  \n我们已成功保护了应用程序及其路由。让我们通过在下一节中配置跨源资源共享（CORS）中间件来结束本章。\n\n### Configuring CORS\n\n\
  跨源资源共享（CORS）充当一条规则，防止未注册的客户端访问资源。\n\n当我们的 Web API 被前端应用程序使用时，浏览器将不允许跨源 HTTP 请求。这意味着资源只能从与\
  \ API 完全相同的源或 API 允许的源访问。\n\nFastAPI 提供了一个 CORS 中间件，CORSMiddleware，允许我们注册可以访问我们\
  \ API 的域名。中间件接受一个将被允许访问服务器上资源的源数组。\n\n> **What is a middleware?**\n> A middleware\
  \ is a function that acts as an intermediary between an operation. In web APIs,\
  \ a middleware serves as an mediator in a request-response operation.\n\n例如，要仅允许\
  \ Packt 访问我们的 API，我们在 origin 数组中定义 URL：\n\n```\norigins = [\n    \"http://packtpub.com\"\
  ,\n    \"https://packtpub.com\"\n]\n```\n\n要允许来自任何客户端的请求，origins 数组将只包含一个值，即星号（*）。星号是一个通配符，告诉我们的\
  \ API 允许来自任何地方的请求。\n\n在 main.py 中，让我们配置我们的应用程序以接受来自任何地方的请求：\n\n```\nfrom fastapi.middleware.cors\
  \ import CORSMiddleware\n\n#### register origins\n\norigins = [\"*\"]\n\napp.add_middleware(\n\
  CORSMiddleware,\nallow_origins=origins,\nallow_credentials=True,\nallow_methods=[\"\
  *\"],\nallow_headers=[\"*\"],\n)\n```\n\n在上面的代码块中，我们首先从 FastAPI 导入 CORS Middleware\
  \ 类。我们注册了 origins 数组，最后使用 add_middleware 方法将中间件注册到应用程序中。\n\n> **More information**\n\
  > The FastAPI documentation has more details on CORS - https://fastapi.tiangolo.com/tutorial/cors/\n\
  \n我们已成功配置应用程序以允许来自世界各地任何源的请求。\n\n### Summary\n\n在本章中，我们学习了如何使用 OAuth 和 JWT 保护 FastAPI\
  \ 应用程序。我们还学习了依赖注入是什么、它在 FastAPI 应用程序中的使用方式，以及如何保护路由免受未经授权的用户访问。我们还添加了一个 CORS 中间件以允许任何客户端访问我们的\
  \ API。我们使用了之前章节中的知识。\n\n在下一章中，您将了解如何测试您的 FastAPI 应用程序。您将学习什么是测试应用程序、为什么应该测试应用程序以及如何测试\
  \ FastAPI 应用程序。\n"
