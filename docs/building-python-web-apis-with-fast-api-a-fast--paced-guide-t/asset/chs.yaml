- "## Preface\n\nFastAPI is a fast and efficient web framework for building APIs with\
  \ Python. This book is a thorough guide on how to build an application with the\
  \ FastAPI framework.\n\nIt starts with the basics of the FastAPI framework and the\
  \ other technologies used throughout this book. You’ll then learn about the different\
  \ aspects of the framework: the routing system, response modeling, error handling,\
  \ and templating.\n\nIn this book, you will learn how to build fast, efficient,\
  \ and scalable applications in Python with FastAPI. You will begin from a Hello\
  \ World application to a complete API that uses a database, authentication, and\
  \ templates. You will learn how to structure your application to enhance efficiency,\
  \ readability, and scalability. By integrating with other libraries in your application,\
  \ you will learn how to connect your application to both a SQL database and a NoSQL\
  \ database, integrate templates, and build authentication. Toward the end of this\
  \ book, you will learn how to write tests, containerize your application, build\
  \ a continuous integration and delivery pipeline using GitHub actions, and deploy\
  \ your application to multiple cloud services. All of these will be taught via a\
  \ theoretical and practical approach.\n\nBy the end of this book, you’ll be equipped\
  \ with the necessary knowledge to build and deploy a robust web API using the FastAPI\
  \ framework.\n\n## Who this book is for\n\nThe primary audience for this book is\
  \ any Python developer interested in building web APIs. The ideal reader is familiar\
  \ with the basics of the Python programming language.\n\n# What this book covers\n\
  \nChapter 1, Getting Started with FastAPI, introduces the basics of FastAPI and\
  \ other technologies used in the book. The chapter also details the steps involved\
  \ in setting up your development environment for your FastAPI application.\n\n\n\
  \n\n\n*第 2 章，FastAPI 中的路由*，详细介绍了使用 FastAPI 中的路由系统创建端点的过程。路由系统的组件，包括请求体和路径参数，也在讨论中，并与使用\
  \ pydantic 类验证它们一起讨论。\n\n*第 3 章，响应模型和错误处理*，介绍了 FastAPI 中的响应、响应建模、错误处理和状态码。\n\n*第\
  \ 4 章，FastAPI 中的模板*，讨论了如何使用模板创建视图并从 API 渲染响应。\n\n*第 5 章，FastAPI 应用的结构*，介绍了应用的结构化，并简要介绍了将在下一章中构建的应用。\n\
  \n*第 6 章，连接到数据库*，讨论了两类数据库（SQL 和 NoSQL），并演示了如何将 FastAPI 应用连接到其中任何一个。我们将介绍如何使用 SQLModel\
  \ 连接和使用 SQL 数据库，以及如何使用对象文档映射器 Beanie 与 MongoDB 协作。\n\n*第 7 章，保护 FastAPI 应用*，讨论了保护应用所包含的内容——授权和身份验证、实现身份验证以及限制对应用端点的访问。\n\
  \n*第 8 章，测试 FastAPI 应用*，解释了什么是测试以及如何测试我们的 API 端点。\n\n*第 9 章，部署 FastAPI 应用*，讨论了部署\
  \ FastAPI 应用所涉及的步骤。\n\n## 为了充分利用本书\n\n您需要在计算机上安装最新版本的 Python。您还需要熟悉 Python 编程语言才能充分利用本书。\n\
  \n| 书中涵盖的软件/硬件 | 操作系统要求 |\n|---|---|\n| Python 3.10 | Windows、macOS 或 Linux |\n\
  | Git 2.36.0 | Windows、macOS 或 Linux |\n\n如果您使用的是本书的数字版，我们建议您自己输入代码或从本书的 GitHub\
  \ 仓库访问代码（链接在下一节中提供）。这样做将有助于您避免与复制和粘贴代码相关的任何潜在错误。\n\n## 下载示例代码文件\n\n您可以从 GitHub 下载本书的示例代码文件，网址为\
  \ https://github.com/PacktPublishing/Building-Python-Web-APIs-with-FastAPI。如果代码有更新，将在\
  \ GitHub 仓库中更新。\n\n我们还有来自我们丰富的图书和视频目录的其他代码包，可在 https://github.com/PacktPublishing/\
  \ 获取。快来看看吧！\n\n## 下载彩色图片\n\n我们还提供了一份 PDF 文件，其中包含本书中使用的屏幕截图和图表的彩色图片。您可以在此处下载：https://packt.link/qqhpc。\n\
  \n## 使用的约定\n\n本书通篇使用了多种文本约定。\n\n正文中的代码：表示正文中的代码词、数据库表名、文件夹名、文件名、文件扩展名、路径名、虚拟 URL、用户输入和\
  \ Twitter 账号。示例：“要切换回原始主分支，我们运行 git checkout main。”\n\n代码块如下所示：\n\n```\nfrom fastapi\
  \ import FastAPI\nfrom routes.user import user_router\n\nimport uvicorn\n```\n\n\
  当我们希望引起您对代码块中特定部分的注意时，相关行或项目以粗体显示：\n\n```\nfrom pydantic import BaseModel\nfrom\
  \ typing import List\n\nclass Event(BaseModel):\n    id: int\n    title: str\n \
  \   image: str\n    description: str\n```\n\n```\n    tags: List[str]\n    location:\
  \ str\n```\n\n任何命令行输入或输出如下所示：\n\n```\n$ git add hello.txt\n$ git commit -m \"Initial\
  \ commit\"\n```\n\n**粗体**：表示新术语、重要词语或您在屏幕上看到的词语。例如，菜单或对话框中的词语以**粗体**显示。示例：“如前面的模型图所示，每个用户将拥有一个\
  \ **Events** 字段，这是一个他们拥有的事件列表。”\n\n**提示或重要说明**\n显示如下。\n\n## 联系我们\n\n我们始终欢迎读者的反馈。\n\
  \n**一般反馈：** 如果您对本书的任何方面有疑问，请发送电子邮件至 customercare@packtpub.com，并在邮件主题中提及书名。\n\n**勘误：**\
  \ 尽管我们已尽一切努力确保内容的准确性，但错误难免。如果您在本書中发现错误，我们将不胜感激您向我们报告。请访问 www.packtpub.com/support/errata\
  \ 并填写表格。\n\n**盗版：** 如果您在互联网上发现我们作品的任何形式的非法副本，我们将不胜感激您提供位置地址或网站名称。请发送邮件至 copyright@packt.com\
  \ 并附上材料链接。\n\n**如果您有兴趣成为作者：** 如果您在某个主题上具有专业知识，并且有兴趣撰写或为一本书做出贡献，请访问 authors.packtpub.com。\n\
  \n## 分享您的想法\n\n一旦您阅读了 *Building Python Web APIs with FastAPI*，我们很想听听您的想法！请点击此处直接前往此书在\
  \ Amazon 的评论页面并分享您的反馈。\n\n您的评论对我们和技术社区都很重要，并将帮助我们确保提供优质内容。\n"
- "## 第 1 部分：\nFastAPI 简介\n\n完成本部分后，您将对 FastAPI 有实质性的理解，包括路由、文件处理、错误处理、构建响应模型和模板。本部分首先介绍本书中将使用的技术，然后再介绍\
  \ FastAPI 框架的基础知识。\n\n本部分包含以下章节：\n\n- 第 1 章，开始使用 FastAPI\n- 第 2 章，FastAPI 中的路由\n\
  - 第 3 章，响应模型和错误处理\n- 第 4 章，FastAPI 中的模板\n\n### 1\n开始使用\nFastAPI\n\nFastAPI 是我们将在本书中使用的\
  \ Python Web 框架。它是一个快速、轻量级的现代 API，与其他 Python Web 框架（如 Flask 和 Django）相比，具有更易于学习的曲线。FastAPI\
  \ 相对较新，但拥有不断增长的社区。它被广泛用于构建 Web API 和部署机器学习模型。\n\n在第一章中，您将学习如何设置开发环境并构建您的第一个 FastAPI\
  \ 应用。您将首先学习 Git 的基础知识——一个版本控制系统——以便您具备存储、跟踪和检索文件更改的知识，因为您构建应用。您还将学习如何使用 pip 在 Python\
  \ 中处理包，如何使用 Virtualenv 创建隔离的开发环境，以及 Docker 的基础知识。最后，您将通过构建一个简单的 Hello World 应用来了解\
  \ FastAPI 的基础知识。\n\n理解前面提到的技术对于构建完整的 FastAPI 应用是必需的。它也作为您当前技能集的补充。\n\n完成本章后，您将能够设置和使用\
  \ Git，使用 pip 安装和管理包，使用 Virtualenv 创建隔离的开发环境，使用 Docker，最重要的是，搭建一个 FastAPI 应用。\n\n\
  本章涵盖以下主题：\n\n- Git 基础\n- 使用 Virtualenv 创建隔离的开发环境\n- 使用 pip 进行包管理\n- 设置和学习 Docker\
  \ 基础知识\n- 构建简单的 FastAPI 应用\n\n### 技术要求\n\n您可以在 GitHub 上找到本章的代码文件，网址为 https://github.com/PacktPublishing/Building-Python-Web-APIs-with-FastAPI/tree/main/ch01\n\
  \n### Git 基础\n\nGit 是一个版本控制系统，使开发人员能够记录、跟踪并恢复到文件的早期版本。它是一个去中心化且轻量级的工具，可以安装在任何操作系统上。\n\
  \n您将学习如何使用 Git 进行记录保存。随着应用的每一层被构建，都会进行更改，重要的是要记录这些更改。\n\n### 安装 Git\n\n要安装 Git，请访问下载页面\
  \ https://git-scm.com/downloads 并为当前操作系统选择下载选项。您将被重定向到有关如何在机器上安装 Git 的说明页面。\n\n\n\
  \n\n\nIt is also worth noting that Git comes as a **CLI** and a **GUI** application.\
  \ Therefore, you can download the one that works best for you.\n\n### Git operations\n\
  \nAs mentioned earlier, Git can be used to record, track, and revert to earlier\
  \ versions of a file. However, only the basic operations of Git will be used in\
  \ this book and will be introduced in this section.\n\nIn order for Git to run properly,\
  \ folders housing files must be initialized. Initializing folders enables Git to\
  \ keep track of the content except otherwise exempted.\n\nTo initialize a new Git\
  \ repository in your project, you need to run the following command in your terminal:\n\
  \n```\n$ git init\n```\n\nTo enable tracking of files, a file must first be added\
  \ and committed. A Git commit enables you to track file changes between timeframes;\
  \ for example, a commit made an hour ago and the current file version.\n\n> **What\
  \ Is a Commit?**\n> A commit is a unique capture of a file or folder status at a\
  \ particular time, and it is identified by a unique code.\n\nNow that we know what\
  \ a commit is, we can go ahead and commit a file as follows:\n\n```\n$ git add hello.txt\n\
  $ git commit -m \"Initial commit\"\n```\n\nYou can track the status of your files\
  \ after making changes by running the following command:\n\n```\n$ git status\n\
  ```\n\nYour terminal should look similar to the following:\n\n![](img/85e42522e1d8d05fd8b981490d6d9056_22_0.png)\n\
  \nFigure 1.1 – Git commands\n\nTo view the changes made to the file, which can be\
  \ additions or subtractions from the file contents, run the following command:\n\
  \n```\n$ git diff\n```\n\nYour terminal should look similar to the following:\n\n\
  ![](img/85e42522e1d8d05fd8b981490d6d9056_23_0.png)\n\nFigure 1.2 - Output from the\
  \ git diff command\n\nIt is good practice to include a .gitignore file in every\
  \ folder. The .gitignore file contains the names of files and folders to be ignored\
  \ by Git. This way, you can add and commit all the files in your folder without\
  \ the fear of committing files like .env.\n\nTo include a .gitignore file, run the\
  \ following command in your terminal:\n\n```\n$ touch .gitignore\n```\n\nTo exempt\
  \ a file from being tracked by Git, add it to the .gitignore file as follows:\n\n\
  ```\n$ echo \".env\" >> .gitignore\n```\n\nCommon files contained in a .gitignore\
  \ file include the following:\n\n- Environment files (*.env)\n- Virtualenv folder\
  \ (env, venv)\n- IDE metadata folders (such as .vscode and .idea)\n\n### Git branches\n\
  \nBranches are an important feature that enables developers to easily work on different\
  \ application features, bugs, and so on, separately before merging into the main\
  \ branch. The system of branching is employed in both small-scale and large-scale\
  \ applications and promotes the culture of previewing and collaborations via pull\
  \ requests. The primary branch is called the main branch and it is the branch from\
  \ which other branches are created.\n\nTo create a new branch from an existing branch,\
  \ we run the git checkout -b newbranch command. Let's create a new branch by running\
  \ the following command:\n\n```\n$ git checkout -b hello-python-branch\n```\n\n\
  The preceding command creates a new branch from the existing one, and then sets\
  \ the active branch to the newly created branch. To switch back to the original\
  \ main branch, we run git checkout main as follows:\n\n```\n$ git checkout main\n\
  ```\n\n> **Important Note**\n> Running git checkout main makes main the active working\
  \ branch, whereas git checkout -b newbranch creates a new branch from the current\
  \ working branch and sets the newly created branch as the active one.\n> \n> To\
  \ learn more, refer to the Git documentation: http://www.git-scm.com/doc.\n\nNow\
  \ that we have learned the basics of Git, we can now proceed to learn about how\
  \ to create isolated environments with **virtualenv**.\n\n### Creating isolated\
  \ development environments with Virtualenv\n\nThe traditional approach to developing\
  \ applications in Python is to isolate these applications in a virtual environment.\
  \ This is done to avoid installing packages globally and reduce conflicts during\
  \ application development.\n\nA virtual environment is an isolated environment where\
  \ application dependencies installed can only be accessed within it. As a result,\
  \ the application can only access packages and interact only within this environment.\n\
  \n#### Creating a virtual environment\n\nBy default, the venv module from the standard\
  \ library is installed in Python3. The venv module is responsible for creating a\
  \ virtual environment. Let's create a todos folder and create a virtual environment\
  \ in it by running the following commands:\n\n```\n$ mkdir todos && cd todos\n$\
  \ python3 -m venv venv\n```\n\nThe venv module takes an argument, which is the name\
  \ of the folder where the virtual environment should be installed into. In our newly\
  \ created virtual environment, a copy of the Python interpreter is installed in\
  \ the lib folder, and the files enabling interactions within the virtual environment\
  \ are stored in the bin folder.\n\n#### Activating and deactivating the virtual\
  \ environment\n\nTo activate a virtual environment, we run the following command:\n\
  \n```\n$ source venv/bin/activate\n```\n\nThe preceding command instructs your shell\
  \ to use the virtual environment’s interpreter and packages by default. Upon activating\
  \ the virtual environment, a prefix of the venv virtual environment folder is added\
  \ before the prompt as follows:\n\n![](img/85e42522e1d8d05fd8b981490d6d9056_26_0.png)\n\
  \nFigure 1.3 – Prefixed prompt\n\nTo deactivate a virtual environment, the deactivate\
  \ command is run in the prompt. Running the command immediately exits the isolated\
  \ environment and the prefix is removed as follows:\n\n![](img/85e42522e1d8d05fd8b981490d6d9056_27_0.png)\n\
  \nFigure 1.4 – Deactivating a virtual environment\n\nImportant Note\nYou can also\
  \ create a virtual environment and manage application dependencies using Pipenv\
  \ and Poetry.\n\nNow that we have created the virtual environment, we can now proceed\
  \ to understand how package management with pip works.\n\n### Package management\
  \ with pip\n\nA FastAPI application constitutes packages, therefore you will be\
  \ introduced to package management practices, such as installing packages, removing\
  \ packages, and updating packages for your application.\n\n#### Installing pip\n\
  \nPip is automatically installed during a Python installation. You can verify whether\
  \ pip is installed by running the following command in your terminal:\n\n```\n$\
  \ python3 -m pip list\n```\n\nThe preceding command should return a list of packages\
  \ installed. The output should be similar to the following figure:\n\n![](img/85e42522e1d8d05fd8b981490d6d9056_28_0.png)\n\
  \nFigure 1.5 – List of installed Python packages\n\nIf the command returns an error,\
  \ follow the instructions at https://pip.pypa.io/en/stable/installation/ to install\
  \ pip.\n\n#### Basic commands\n\nWith pip installed, let’s learn its basic commands.\
  \ To install the FastAPI package with pip, we run the following command:\n\n```\n\
  $ pip install fastapi\n```\n\nOn a Unix operating system, such as Mac or Linux,\
  \ in some cases, the sudo keyword is prepended to install global packages.\n\nTo\
  \ uninstall a package, the following command is used:\n\n```\n$ pip uninstall fastapi\n\
  ```\n\nTo collate the current packages installed in a project into a file, we use\
  \ the following freeze command:\n\n```\n$ pip freeze > requirements.txt\n```\n\n\
  The > operator tells bash to save the output from the command into the requirements.txt\
  \ file. This means that running pip freeze returns an output of all the currently\
  \ installed packages.\n\nTo install packages from a file such as the requirements.txt\
  \ file, the following command is used:\n\n```\n$ pip install -r requirements.txt\n\
  ```\n\nThe preceding command is mostly used in deployment.\n\nNow that you have\
  \ learned the basics of pip and have gone over some basic commands, let’s learn\
  \ the basics of Docker.\n\n### Setting up Docker\n\nAs our application grows into\
  \ having multiple layers, such as a database, coupling the application into a single\
  \ piece enables us to deploy our application. We’ll be using Docker to containerize\
  \ our application layers into a single image, which can then be easily deployed\
  \ locally or in the cloud.\n\n\n\n\n\n此外，使用 Dockerfile 和 docker-compose 文件可以消除上传和共享应用程序镜像的需求。应用程序的新版本可以从\
  \ Dockerfile 构建，并使用 docker-compose 文件部署。应用程序镜像也可以存储在 Docker Hub 中并从中检索。这被称为推送和拉取操作。\n\
  \n开始设置时，从 https://docs.docker.com/install 下载并安装 Docker。\n\n##### Dockerfile\n\n\
  Dockerfile 包含有关如何构建我们的应用程序镜像的说明。以下是一个示例 Dockerfile：\n\n```\nFROM python:3.8\n####\
  \ Set working directory to /usr/src/app\nWORKDIR /usr/src/app\n#### Copy the contents\
  \ of the current local directory into the container's working directory\nADD . /usr/src/app\n\
  #### Run a command\nCMD [\"python\", \"hello.py\"]\n```\n\n接下来，我们将构建应用程序容器镜像并将其标记为\
  \ getting_started，如下所示：\n\n```\n$ docker build -t getting_started .\n```\n\n如果 Dockerfile\
  \ 不在运行命令的目录中，则应按如下方式正确附加 Dockerfile 的路径：\n\n```\n$ docker build -t api api/Dockerfile\n\
  ```\n\n可以使用以下命令运行容器镜像：\n\n```\n$ docker run getting-started\n```\n\nDocker 是一个高效的容器化工具。我们只查看了基本操作，我们将在第\
  \ 9 章《部署 FastAPI 应用程序》中在实践中学习更多操作。\n\n### 构建一个简单的 FastAPI 应用程序\n\n最后，我们现在可以开始我们的第一个\
  \ FastAPI 项目。我们在本节的目标是通过构建一个简单的应用程序来介绍 FastAPI。我们将在后续章节中深入介绍操作。\n\n我们将首先在之前创建的 todos\
  \ 文件夹中安装应用程序所需的依赖项。依赖项如下：\n\n- fastapi：我们将构建应用程序的框架。\n- uvicorn：用于运行应用程序的异步服务器网关接口模块。\n\
  \n首先，通过在项目目录中运行以下命令激活你的开发环境：\n\n```\n$ source venv/bin/activate\n```\n\n然后，按如下方式安装依赖项：\n\
  \n```\n(venv)$ pip install fastapi uvicorn\n```\n\n现在，我们将创建一个新的 api.py 文件并按如下方式创建\
  \ FastAPI 的新实例：\n\n```\nfrom fastapi import FastAPI\n\napp = FastAPI()\n```\n\n\
  通过在 app 变量中实例化 FastAPI，我们可以继续创建路由。让我们创建一个欢迎路由。\n\n路由是通过首先定义一个装饰器来指示操作类型，然后是一个包含在调用此路由时要执行的操作的函数来创建的。在以下示例中，我们将创建一个仅接受\
  \ GET 请求的 \"/\" 路由，并在访问时返回欢迎消息：\n\n```\n@app.get(\"/\")\nasync def welcome() ->\
  \ dict:\n    return { \"message\": \"Hello World\"}\n```\n\n下一步是使用 uvicorn 启动我们的应用程序。在你的终端中运行以下命令：\n\
  \n```\n(venv)$ uvicorn api:app --port 8000 --reload\n```\n\n在前面的命令中，uvicorn 接受以下参数：\n\
  \n- `file:instance`：包含 FastAPI 实例的文件和保存 FastAPI 实例的名称变量。\n- `--port PORT`：应用程序将被提供服务的端口。\n\
  - `--reload`：一个可选参数，用于在每次文件更改时重新启动应用程序。\n\n命令返回以下输出：\n\n```\n(venv) → todos uvicorn\
  \ api:app --port 8080 --reload\nINFO:     Will watch for changes in these directories:\
  \ ['/Users/youngestdev/Documents/todos']\nINFO:     Uvicorn running on http://0.0.0.0:8080\
  \ (Press CTRL+C to quit)\nINFO:     Started reloader process [3982] using statreload\n\
  INFO:     Started server process [3984]\nINFO:     Waiting for application startup.\n\
  INFO:     Application startup complete.\n```\n\n下一步是通过发送 GET 请求到 API 来测试应用程序。在新的终端中，使用\
  \ curl 按如下方式发送 GET 请求：\n\n```\n$ curl http://0.0.0.0:8080/\n```\n\n记录在控制台中的应用程序响应将如下所示：\n\
  \n```\n{\"message\":\"Hello World\"}\n```\n\n### 总结\n\n在本章中，我们学习了如何安装设置开发环境所需的工具。我们还构建了一个简单的\
  \ API 作为对 FastAPI 的介绍，并在过程中学习了如何创建路由。\n\n在下一章中，你将被介绍到 FastAPI 中的路由。首先，你将被介绍使用 Pydantic\
  \ 构建模型以验证请求负载和响应的过程。然后你将学习路径和查询参数以及请求体，最后，你将学习如何构建一个 CRUD todo 应用程序。\n"
- "### 2 FastAPI 中的路由\n\n**路由**是构建 Web 应用程序的重要组成部分。FastAPI 中的路由灵活且无忧。路由是从客户端发送到服务器的\
  \ **HTTP 请求**的处理过程。HTTP 请求被发送到定义的路由，这些路由具有用于处理请求并响应的定义处理程序。这些处理程序称为路由处理程序。\n\n到本章结束时，你将知道如何使用\
  \ **APIRouter** 实例创建路由并连接到主 **FastAPI** 应用程序。你还将了解模型是什么以及如何使用它们来验证请求体。你还将了解路径和查询参数是什么以及如何在\
  \ FastAPI 应用程序中使用它们。FastAPI 中路由的知识对于构建小型和大型规模的应用程序至关重要。\n\n在本章中，我们将介绍以下主题：\n\n-\
  \ FastAPI 中的路由\n- `APIRouter` 类\n- 使用 Pydantic 模型进行验证\n- 路径和查询参数\n- 请求体\n- 构建一个简单的\
  \ CRUD 应用\n\n### 技术要求\n\n本章使用的代码可以在 https://github.com/PacktPublishing/Building-Python-Web-APIs-with-FastAPI/tree/main/ch02/todos\
  \ 找到。\n\n### 理解 FastAPI 中的路由\n\n路由被定义为接受来自 HTTP 请求方法的请求，并可选地接受参数。当请求发送到路由时，应用程序会在路由处理程序中处理请求之前检查路由是否已定义。另一方面，路由处理程序是一个处理发送到服务器的请求的函数。路由处理程序的一个例子是一个函数，当请求通过路由发送到路由器时从数据库检索记录。\n\
  \n> **什么是 HTTP 请求方法？**\n> HTTP 方法是用于指示要执行的操作类型的标识符。标准方法包括 GET、POST、PUT、PATCH 和 DELETE。你可以在\
  \ https://developer.mozilla.org/en-US/docs/Web/HTTP/Methods 了解更多关于 HTTP 方法的信息。\n\
  \n### 路由示例\n\n在上一章的 *项目脚手架* 部分中，我们构建了一个单路由应用程序。路由由在 app 变量中初始化的 FastAPI() 实例处理：\n\
  \n```\nfrom fastapi import FastAPI\n\napp = FastAPI()\n\n@app.get(\"/\")\nasync\
  \ def welcome() -> dict:\n    return { \"message\": \"Hello World\"}\n```\n\n**uvicorn**\
  \ 工具指向 FastAPI 的实例以提供应用程序服务：\n\n```\n(venv)$ uvicorn api:app --port 8080 --reload\n\
  ```\n\n传统上，FastAPI () 实例可用于路由操作，如前所述。然而，这种方法通常用于路由期间需要单个路径的应用程序。在使用 FastAPI () 实例创建执行唯一功能的单独路由的情况下，应用程序将无法同时运行这两个路由，因为\
  \ uvicorn 只能运行一个入口点。\n\n那么如何处理需要一系列执行不同功能的路由的庞大应用程序呢？我们将在下一节中了解 APIRouter 类如何帮助进行多路由。\n\
  \n### 使用 APIRouter 类进行路由\n\nAPIRouter 类属于 FastAPI 包并为多个路由创建路径操作。APIRouter 类鼓励应用程序路由和逻辑的模块化和组织。\n\
  \nAPIRouter 类从 fastapi 包导入，并创建实例。路由方法从创建的实例创建和分发，如下所示：\n\n```\nfrom fastapi import\
  \ APIRouter\n\nrouter = APIRouter()\n\n@router.get(\"/hello\")\nasync def say_hello()\
  \ -> dict:\n    return {\"message\": \"Hello!\"}\n```\n\n让我们使用 APIRouter 类创建一个新的路径操作来创建和检索\
  \ todos。在上一章的 todos 文件夹中，创建一个新文件 todo.py：\n\n```\n(venv)$ touch todo.py\n```\n\n\
  我们将首先从 fastapi 包导入 APIRouter 类并创建实例：\n\n```\nfrom fastapi import APIRouter\n\ntodo_router\
  \ = APIRouter()\n```\n\n\n\n\n\n接下来，我们将创建一个临时的应用内数据库，并为添加和检索待办事项创建两个路由：\n\n```\n\
  todo_list = []\n\n@todo_router.post(\"/todo\")\nasync def add_todo(todo: dict) ->\
  \ dict:\n    todo_list.append(todo)\n    return {\"message\": \"Todo added successfully\"\
  }\n\n@todo_router.get(\"/todo\")\nasync def retrieve_todos() -> dict:\n    return\
  \ {\"todos\": todo_list}\n```\n\n在前面的代码块中，我们为待办事项操作创建了两个路由。第一个路由通过 POST 方法将待办事项添加到待办列表中，第二个路由通过\
  \ GET 方法从待办列表中检索所有待办事项。\n\n我们已完成了待办路由的路径操作。下一步是将应用程序部署到生产环境，以便我们可以测试已定义的路径操作。\n\n\
  APIRouter 类的工作方式与 FastAPI 类相同。然而，与 FastAPI 不同，uvicorn 不能使用 APIRouter 实例来提供应用程序服务。使用\
  \ APIRouter 类定义的路由会被添加到 fastapi 实例中以使其可见。\n\n为了使待办路由可见，我们将使用 include_router() 方法将\
  \ todo_router 路径操作处理器包含到主要的 FastAPI 实例中。\n\n> include_router()\n> include_router(router,\
  \ ...) 方法负责将使用 APIRouter 类定义的路由添加到主应用程序实例中，以使路由可见。\n\n在 api.py 中，从 todo.py 导入 todo_router：\n\
  \n```\nfrom todo import todo_router\n```\n\n使用 FastAPI 实例的 include_router 方法将 todo_router\
  \ 包含到 FastAPI 应用程序中：\n\n```\nfrom fastapi import FastAPI\nfrom todo import todo_router\n\
  \napp = FastAPI()\n\n@app.get(\"/\")\nasync def welcome() -> dict:\n    return {\n\
  \        \"message\": \"Hello World\"\n    }\n\napp.include_router(todo_router)\n\
  ```\n\n一切就绪后，从终端启动应用程序：\n\n```\n(venv)$ uvicorn api:app --port 8000 --reload\n```\n\
  \n前面的命令启动我们的应用程序并为我们提供应用程序进程的实时日志：\n\n```\n(venv) → todos git:(main) X uvicorn api:app\
  \ --port 8000 --reload\nINFO: Will watch for changes in these directories: ['/Users/youngestdev/Work/Building-Web-APIs-with-FastAPI-and-Python/ch02/todos']\n\
  INFO:     uvicorn running on http://127.0.0.1:8000 (Press CTRL+C to quit)\nINFO:\
  \     Started reloader process [4732] using statreload\nINFO:     Started server\
  \ process [4734]\nINFO:     Waiting for application startup.\nINFO:     Application\
  \ startup complete.\n```\n\n下一步是通过使用 curl 发送 GET 请求来测试应用程序：\n\n```\n(venv)$ curl\
  \ http://0.0.0.0:8080/\n```\n\n应用程序在控制台中记录的响应：\n\n```\n{\"message\":\"Hello World\"\
  }\n```\n\n接下来，我们检查待办路由是否可用：\n\n```\n(venv)$ curl -X 'GET' \\\n'http://127.0.0.1:8000/todo'\
  \ \\\n-H 'accept: application/json'\n```\n\n应用程序在控制台中记录的响应应如下所示：\n\n```\n{\n  \"\
  todos\": []\n}\n```\n\n待办路由工作正常！让我们通过发送请求来添加项目到我们的待办列表来测试 POST 操作：\n\n```\n(venv)$\
  \ curl -X 'POST' \\\n'http://127.0.0.1:8000/todo' \\\n-H 'accept: application/json'\
  \ \\\n-H 'Content-Type: application/json' \\\n-d '{\n\"id\": 1,\n\"item\": \"First\
  \ Todo is to finish this book!\"\n}'\n```\n\n我们得到以下响应：\n\n```\n{\n  \"message\"\
  : \"Todo added successfully.\"\n}\n```\n\n我们学习了 APIRouter 类的工作原理以及如何将其包含到主应用程序实例中以启用已定义的路径操作的使用。本节中构建的待办路由缺乏模型，也称为模式。在下一节中，让我们来看看\
  \ Pydantic 模型及其用例。\n\n### 使用 Pydantic 模型验证请求体\n\n在 FastAPI 中，请求体可以被验证以确保只发送已定义的数据。这至关重要，因为它有助于清理请求数据并降低恶意攻击的风险。此过程称为验证。\n\
  \nFastAPI 中的模型是一个结构化类，规定数据应如何接收或解析。模型通过子类化 Pydantic 的 BaseModel 类来创建。\n\n> **什么是\
  \ Pydantic？**\n> Pydantic 是一个 Python 库，使用 Python 类型注解处理数据验证。\n\n模型在定义后用作请求体对象和请求-响应对象的类型提示。在本章中，我们将只查看使用\
  \ Pydantic 模型进行请求体的情况。\n\n一个示例模型如下：\n\n```\nfrom pydantic import BaseModel\n\nclass\
  \ PacktBook(BaseModel):\n    id: int\n    Name: str\n    Publishers: str\n    Isbn:\
  \ str\n```\n\n在前面的代码块中，我们将 PacktBook 模型定义为 Pydantic 的 BaseModel 类的子类。类型提示为 PacktBook\
  \ 类的变量只能采用之前定义的四个字段。在接下来的几个示例中，我们可以看到 Pydantic 如何帮助验证输入。\n\n在我们之前的待办应用程序中，我们定义了一个路由来添加项目到待办列表。在路由定义中，我们将请求体设置为字典：\n\
  \n```\nasync def add_todo(todo: dict) -> dict:\n    ...\n```\n\n在示例 POST 请求中，发送的数据格式如下：\n\
  \n```\n{\n    \"id\": id,\n    \"item\": item\n}\n```\n\n然而，也可能发送一个空字典而不会返回任何错误。用户可以发送与前面所示不同的请求体。通过创建具有所需请求体结构的模型并将其分配为请求体的类型，可以确保只传递模型中存在的字段数据。\n\
  \n例如，要确保请求体只包含前面的示例中的字段，请创建一个新的 model.py 文件并添加以下代码：\n\n```\nfrom pydantic import\
  \ BaseModel\n\nclass Todo(BaseModel):\n    id: int\n    item: str\n```\n\n在前面的代码块中，我们创建了一个\
  \ Pydantic 模型，只接受两个字段：\n\n- id 为整数类型\n- item 为字符串类型\n\n让我们继续在我们的 POST 路由中使用该模型。在\
  \ api.py 中导入模型：\n\n```\nfrom model import Todo\n```\n\n接下来，将请求体变量类型从 dict 替换为 Todo：\n\
  \n```\ntodo_list = []\n\n@todo_router.post(\"/todo\")\nasync def add_todo(todo:\
  \ Todo) -> dict:\n    todo_list.append(todo)\n    return {\"message\": \"Todo added\
  \ successfully\"}\n```\n\n```\n@todo_router.get(\"/todo\")\nasync def retrieve_todos()\
  \ -> dict:\n    return {\"todos\": todo_list}\n```\n\n让我们通过发送空字典作为请求体来验证新的请求体验证器：\n\
  \n```\n(venv)$ curl -X 'POST' \\\n  'http://127.0.0.1:8000/todo' \\\n  -H 'accept:\
  \ application/json' \\\n  -H 'Content-Type: application/json' \\\n  -d '{\n}'\n\
  ```\n\n我们得到一个响应，表明请求体中缺少 id 和 item 字段：\n\n```\n{\n  \"detail\": [\n    {\n     \
  \ \"loc\": [\n        \"body\",\n        \"id\"\n      ],\n      \"msg\": \"field\
  \ required\",\n      \"type\": \"value_error.missing\"\n    },\n    {\n      \"\
  loc\": [\n        \"body\",\n        \"item\"\n      ],\n      \"msg\": \"field\
  \ required\",\n      \"type\": \"value_error.missing\"\n    }\n  ]\n}\n```\n\n发送包含正确数据的请求会返回成功响应：\n\
  \n```\n(venv)$ curl -X 'POST' \\\n  'http://127.0.0.1:8000/todo' \\\n  -H 'accept:\
  \ application/json' \\\n  -H 'Content-Type: application/json' \\\n  -d '{\n  \"\
  id\": 2,\n  \"item\": \"Validation models help with input types\"\n}'\n```\n\n以下是响应：\n\
  \n```\n{\n  \"message\": \"Todo added successfully.\"\n}\n```\n\n### 嵌套模型\n\nPydantic\
  \ 模型也可以嵌套，如下所示：\n\n```\nclass Item(BaseModel):\n    item: str\n    status: str\n\
  \nclass Todo(BaseModel):\n    id: int\n    item: Item\n```\n\n因此，类型为 Todo 的待办事项将表示为如下：\n\
  \n```\n{\n  \"id\": 1,\n  \"item\": {\n    \"item\": \"Nested models\",\n    \"\
  Status\": \"completed\"\n  }\n}\n```\n\n我们学习了模型是什么、如何创建以及其用例。我们将在本书的剩余部分随后使用它。在下一节中，让我们来看看\
  \ **路径** 和 **查询** 参数。\n\n### 路径和查询参数\n\n在上一节中，我们学习了模型是什么以及如何使用它们来验证请求体。在本节中，你将学习什么是路径和查询参数，它们在路由中的作用以及如何使用它们。\n\
  \n### 路径参数\n\n路径参数是包含在 API 路由中以标识资源的<|message|>参数。这些参数充当标识符，有时也是实现 Web 应用程序中进一步操作的桥梁。\n\
  \n我们目前有用于添加待办事项和检索所有待办事项的路由。让我们创建一个新的路由，用于通过将待办事项 ID 作为路径参数附加来检索单个待办事项。\n\n在 `todo.py`\
  \ 中，添加新的路由：\n\n```\nfrom fastapi import APIRouter, Path\nfrom model import Todo\n\
  \ntodo_router = APIRouter()\n\ntodo_list = []\n\n@todo_router.post(\"/todo\")\n\
  async def add_todo(todo: Todo) -> dict:\n    todo_list.append(todo)\n    return\
  \ {\n        \"message\": \"Todo added successfully.\"\n    }\n```\n\n\n\n\n```python\n\
  @todo_router.get(\"/todo\")\nasync def retrieve_todo() -> dict:\n    return {\n\
  \        \"todos\": todo_list\n    }\n\n@todo_router.get(\"/todo/{todo_id}\")\n\
  async def get_single_todo(todo_id: int = Path(..., title=\"The ID of the todo to\
  \ retrieve.\")) -> dict:\n    for todo in todo_list:\n        if todo.id == todo_id:\n\
  \            return {\n                \"todo\": todo\n            }\n    return\
  \ {\n        \"message\": \"Todo with supplied ID doesn't exist.\"\n    }\n```\n\
  \n在前面的代码块中，{todo_id} 是路径参数。此参数使应用程序能够返回与传入 ID 匹配的待办事项。\n\n让我们测试该路由：\n\n```\n(venv)$\
  \ curl -X 'GET' \\\n'http://127.0.0.1:8000/todo/1' \\\n-H 'accept: application/json'\n\
  ```\n\n在前面的 GET 请求中，1 是路径参数。这里，我们告诉我们的待办事项应用程序返回 ID 为 1 的待办事项。\n\n执行前面的请求会得到以下响应：\n\
  \n```\n{\n  \"todo\": {\n    \"id\": 1,\n    \"item\": \"First Todo is to finish\
  \ this book!\"\n  }\n}\n```\n\nFastAPI 还提供了一个 Path 类，用于区分路由函数中存在的路径参数和其他参数。Path\
  \ 类还有助于在 OpenAPI 通过 Swagger 和 ReDoc 自动提供的文档中为路由参数提供更多上下文，并充当验证器。\n\n让我们修改路由定义：\n\
  \n```\nfrom fastapi import APIRouter, Path\n\nfrom model import Todo\n\ntodo_router\
  \ = APIRouter()\n\ntodo_list = []\n\n@todo_router.post(\"/todo\")\nasync def add_todo(todo:\
  \ Todo) -> dict:\n    todo_list.append(todo)\n    return {\n        \"message\"\
  : \"Todo added successfully.\"\n    }\n\n@todo_router.get(\"/todo\")\nasync def\
  \ retrieve_todo() -> dict:\n    return {\n        \"todos\": todo_list\n    }\n\n\
  @todo_router.get(\"/todo/{todo_id}\")\nasync def get_single_todo(todo_id: int =\
  \ Path(..., title=\"The ID of the todo to retrieve\")) -> dict:\n    for todo in\
  \ todo_list:\n        if todo.id == todo_id:\n            return {\n           \
  \     \"todo\": todo\n```\n```\n}\nreturn {\n    \"message\": \"Todo with supplied\
  \ ID doesn't exist.\"\n}\n```\n\n> **提示 – Path(..., kwargs)**\n> Path 类接受第一个位置参数，设置为\
  \ None 或省略号（...）。如果第一个参数设置为省略号（...），则路径参数变为必填。Path 类还包含用于数值验证的参数，如果路径参数是数字则使用。定义包括\
  \ gt 和 le – gt 表示大于，le 表示小于等于。当使用时，路由将根据这些参数验证路径参数。\n\n### 查询参数\n\n查询参数是通常出现在 URL\
  \ 问号后的可选参数。它用于过滤请求并根据提供的查询返回特定数据。\n\n在路由处理函数中，与路径参数同名的参数之外的参数即为查询。您还可以通过在函数参数中创建\
  \ FastAPI Query() 类的实例来定义查询，例如以下内容：\n\n```\nasync query_route(query: str = Query(None)):\n\
  \    return query\n```\n\n我们将在本书后面讨论如何构建比待办事项应用程序更高级的应用程序时，进一步了解查询参数的用例。\n\n现在你已经学会了如何在\
  \ FastAPI 应用程序中创建路由、验证请求体以及使用路径和查询参数，你将在下一节学习这些组件如何协同工作以形成请求体。\n\n### 请求体\n\n在前面的章节中，我们学习了如何使用\
  \ APIRouter 类和 Pydantic 模型进行请求体验证，并讨论了路径和查询参数。\n\n请求体是使用 POST 和 UPDATE 等路由方法发送到\
  \ API 的数据。\n\n**POST 和 UPDATE**\nPOST 方法用于在服务器中进行插入，而 UPDATE 方法用于更新服务器中现有的数据。\n\n\
  让我们看一下本章前面出现的 POST 请求：\n\n```\n(venv)$ curl -X 'POST' \\\n'http://127.0.0.1:8000/todo'\
  \ \\\n-H 'accept: application/json' \\\n-H 'Content-Type: application/json' \\\n\
  -d '{\n  \"id\": 2,\n  \"item\": \"Validation models help with input types\"\n}'\n\
  ```\n\n在前面的请求中，请求体如下：\n\n```\n{\n  \"id\": 2,\n  \"item\": \"Validation models help\
  \ with input types..\"\n}\n```\n\n**提示**\nFastAPI 还为我们提供了 Body() 类来提供额外的验证。\n\n\
  我们已经了解了 FastAPI 中的模型。它们在记录我们的 API 端点和请求体类型方面也发挥着额外的作用。在下一小节中，我们将学习 FastAPI 应用程序默认生成的文档页面。\n\
  \n### FastAPI 自动文档\n\nFastAPI 为我们的模型生成 JSON 模式定义，并自动记录我们的路由，包括其请求体类型、路径和查询参数以及响应模型。此文档有两种类型：\n\
  \n- **Swagger**\n- **ReDoc**\n\n### Swagger\n\nSwagger 托管的文档提供了一个交互式环境来测试我们的 API。您可以通过在应用程序地址后附加\
  \ /docs 来访问它。在 Web 浏览器中访问 http://127.0.0.1:8000/docs URL：\n\n![](img/85e42522e1d8d05fd8b981490d6d9056_48_0.png)\n\
  \n图 2.1 – FastAPI 交互式文档\n\n交互式文档允许我们测试我们的方法。让我们从交互式文档中添加一个待办事项：\n\n![](img/85e42522e1d8d05fd8b981490d6d9056_49_0.png)\n\
  \n图 2.2 – 来自交互式文档的路由测试\n\n现在我们知道了交互式文档的样子，让我们检查 ReDoc 生成的文档。\n\n### ReDoc\n\nReDoc\
  \ 文档对模型、路由和 API 提供了更详细和直接的展示。您可以通过在应用程序地址后附加 /redoc 来访问它。在 Web 浏览器中访问 http://127.0.0.1:8000/redoc\
  \ URL：\n\n![](img/85e42522e1d8d05fd8b981490d6d9056_50_0.png)\n\n图 2.3 – ReDoc 驱动的文档门户\n\
  \n为了正确生成 JSON Schema，您可以设置用户如何在模型中填写数据的示例。示例是通过将 Config 类嵌入到模型类中设置的。让我们在我们的 Todo\
  \ 模型中添加一个示例模式：\n\n```\nclass Todo(BaseModel):\n    id: int\n    item: str\n\n  \
  \  class Config:\n        Schema_extra = {\n            \"Example\": {\n       \
  \         \"id\": 1,\n```\n```\n\"item\": \"Example schema!\"\n}\n```\n\n刷新 ReDoc\
  \ 文档页面并在左侧窗格中单击 Add Todo。示例显示在右侧窗格中：\n\n![](img/85e42522e1d8d05fd8b981490d6d9056_51_0.png)\n\
  \n图 2.4 – 文档门户显示示例模式\n\n在交互式文档中也可以看到示例模式：\n\n![](img/85e42522e1d8d05fd8b981490d6d9056_52_0.png)\n\
  \n图 2.5 – 文档门户显示示例模式\n\n我们已经学习了如何添加示例模式数据来指导用户如何向 API 发送请求并从 Swagger 的交互式文档中测试应用程序。ReDoc\
  \ 提供的文档也不例外，它充当了如何使用 API 的知识库。\n\n现在我们已经了解了 APIRouter 类是什么以及如何使用它、请求体、路径和查询参数，以及使用\
  \ Pydantic 模型验证请求体，让我们更新我们的待办事项应用程序以包含更新和删除待办事项的路由。\n\n### 构建一个简单的 CRUD 应用\n\n我们已经为\
  \ **创建** 和 **检索** 待办事项构建了路由。让我们为 **更新** 和 **删除** 添加的待办事项构建路由。让我们首先在 model.py 中为\
  \ UPDATE 路由的请求体创建一个模型：\n\n```\nclass TodoItem(BaseModel):\n    item: str\n\n   \
  \ class Config:\n        schema_extra = {\n            \"example\": {\n        \
  \        \"item\": \"Read the next chapter of the book\"\n            }\n      \
  \  }\n```\n\n接下来，让我们在 todo.py 中编写更新待办事项的路由：\n\n```\nfrom fastapi import APIRouter,\
  \ Path\nfrom model import Todo, TodoItem\n\ntodo_router = APIRouter()\n\ntodo_list\
  \ = []\n\n@todo_router.post(\"/todo\")\nasync def add_todo(todo: Todo) -> dict:\n\
  \    todo_list.append(todo)\n    return {\n        \"message\": \"Todo added successfully.\"\
  \n    }\n\n@todo_router.get(\"/todo\")\nasync def retrieve_todo() -> dict:\n   \
  \ return {\n        \"todos\": todo_list\n```\n\n\n\n\n\n```\n@todo_router.get(\"\
  /todo/{todo_id}\")\nasync def get_single_todo(todo_id: int = Path(..., title=\"\
  The ID of the todo to retrieve\")) -> dict:\n    for todo in todo_list:\n      \
  \  if todo.id == todo_id:\n            return {\n                \"todo\": todo\n\
  \            }\n    return {\n        \"message\": \"Todo with supplied ID doesn't\
  \ exist.\"\n    }\n\n@todo_router.put(\"/todo/{todo_id}\")\nasync def update_todo(todo_data:\
  \ TodoItem, todo_id: int = Path(..., title=\"The ID of the todo to be updated\"\
  )) -> dict:\n    for todo in todo_list:\n        if todo.id == todo_id:\n      \
  \      todo.item = todo_data.item\n            return {\n                \"message\"\
  : \"Todo updated successfully.\"\n            }\n    return {\n        \"message\"\
  : \"Todo with supplied ID doesn't exist.\"\n    }\n```\n\n让我们测试新的路由。首先，让我们添加一个待办事项：\n\
  \n```\n(venv)$ curl -X 'POST' \\\n'http://127.0.0.1:8000/todo' \\\n-H 'accept: application/json'\
  \ \\\n-H 'Content-Type: application/json' \\\n-d '{\n\"id\": 1,\n```\n```\n\"item\"\
  : \"Example Schema!\"\n}'\n```\n\n以下是响应：\n\n```\n(venv)$ {\n  \"message\": \"Todo\
  \ added successfully.\"\n}\n```\n\n接下来，让我们通过发送 PUT 请求来更新待办事项：\n\n```\n(venv)$ curl\
  \ -X 'PUT' \\\n'http://127.0.0.1:8000/todo/1' \\\n-H 'accept: application/json'\
  \ \\\n-H 'Content-Type: application/json' \\\n-d '{\n  \"item\": \"Read the next\
  \ chapter of the book.\"\n}'\n```\n\n以下是响应：\n\n```\n(venv)$ {\n  \"message\": \"\
  Todo updated successfully.\"\n}\n```\n\n让我们验证我们的待办事项是否确实已更新：\n\n```\n(venv)$ curl\
  \ -X 'GET' \\\n'http://127.0.0.1:8000/todo/1' \\\n-H 'accept: application/json'\n\
  ```\n\n以下是响应：\n\n```\n(venv)$ {\n  \"todo\": {\n    \"id\": 1,\n    \"item\": \"\
  Read the next chapter of the book\"\n  }\n}\n```\n\n从返回的响应中，我们可以看到待办事项已成功更新。现在，让我们创建用于删除单个待办事项和所有待办事项的路由。\n\
  \n在 todo.py 中，更新路由：\n\n```\n@todo_router.delete(\"/todo/{todo_id}\")\nasync def\
  \ delete_single_todo(todo_id: int) -> dict:\n    for index in range(len(todo_list)):\n\
  \        todo = todo_list[index]\n        if todo.id == todo_id:\n            todo_list.pop(index)\n\
  \            return {\n                \"message\": \"Todo deleted successfully.\"\
  \n            }\n    return {\n        \"message\": \"Todo with supplied ID doesn't\
  \ exist.\"\n    }\n\n@todo_router.delete(\"/todo\")\nasync def delete_all_todo()\
  \ -> dict:\n    todo_list.clear()\n    return {\n        \"message\": \"Todos deleted\
  \ successfully.\"\n    }\n```\n\n让我们测试删除路由。首先，我们添加一个待办事项：\n\n```\n(venv)$ curl -X\
  \ 'POST' \\\n  'http://127.0.0.1:8000/todo' \\\n  -H 'accept: application/json'\
  \ \\\n  -H 'Content-Type: application/json' \\\n  -d '{\n  \"id\": 1,\n  \"item\"\
  : \"Example Schema!\"\n}'\n```\n\n以下是响应：\n\n```\n(venv) $ {\n  \"message\": \"Todo\
  \ added successfully.\"\n}\n```\n\n接下来，删除待办事项：\n\n```\n(venv)$ curl -X 'DELETE'\
  \ \\\n  'http://127.0.0.1:8000/todo/1' \\\n  -H 'accept: application/json'\n```\n\
  \n以下是响应：\n\n```\n(venv) $ {\n  \"message\": \"Todo deleted successfully.\"\n}\n\
  ```\n\n让我们通过发送 GET 请求来检索待办事项，验证待办事项是否已被删除：\n\n```\n(venv)$ curl -X 'GET' \\\n  'http://127.0.0.1:8000/todo/1'\
  \ \\\n  -H 'accept: application/json'\n```\n\n以下是响应：\n\n```\n(venv) $ {\n  \"message\"\
  : \"Todo with supplied ID doesn't exist.\n}\n```\n\n在本节中，我们结合前几节学到的知识构建了一个 CRUD\
  \ 待办事项应用程序。通过验证请求体，我们能够确保向 API 发送的是正确的数据。路由中包含路径参数也使我们能够从待办事项列表中检索和删除单个待办事项。\n\n\
  ### Summary\n\n在本章中，我们学习了如何使用 `APIRouter` 类并将其定义的路由连接到主 FastAPI 实例。我们还学习了如何为请求体创建模型以及向路径操作添加路径和查询参数。这些模型可作为对请求体字段提供的错误数据类型进行额外验证。我们还构建了一个\
  \ CRUD 待办事项应用程序，以将本章学到的所有内容付诸实践。\n\n在下一章中，您将了解 FastAPI 中的响应、响应建模和错误处理。您将首先了解响应的概念以及本章学到的\
  \ Pydantic 模型知识如何帮助构建 API 响应的模型。然后您将学习状态码以及如何在响应对象中使用它们以及正确的错误处理。\n\n### 3\n####\
  \ Response Models\nand Error Handling\n\n响应模型充当从 API 路由路径返回数据的模板。它们基于 **Pydantic**\
  \ 构建，以便从发送到服务器的请求中正确呈现响应。\n\n错误处理包括处理应用程序错误所涉及的实践和活动。这些实践包括返回适当的错误状态码和错误消息。\n\n\
  在本章结束时，您将知道响应是什么以及它由什么组成，并且您将了解错误处理以及如何在 FastAPI 应用程序中处理错误。您还将知道如何使用 Pydantic 为请求响应构建响应模型。\n\
  \n在本章中，我们将涵盖以下主题：\n\n- Responses in FastAPI\n- Building a response model\n- Error\
  \ handling\n\n### Technical requirements\n\n本章使用的代码可以在 https://github.com/PacktPublishing/Building-Python-Web-APIs-with-FastAPI/tree/main/ch03/todos\
  \ 中找到。\n\n#### Understanding responses in FastAPI\n\n响应是 API 生命周期中不可或缺的一部分。响应是通过使用任何标准\
  \ HTTP 方法与 API 路由交互后收到的反馈。API 响应通常采用 JSON 或 XML 格式，但也可以是文档的形式。响应由头部和主体组成。\n\n####\
  \ What is a response header?\n\n响应头部由请求的狀態和用于指导响应主体传输的额外信息组成。响应头部中包含的信息示例是 Content-Type，它告诉客户端返回的内容类型。\n\
  \n#### What is a response body?\n\n另一方面，响应主体是客户端从服务器请求的数据。响应主体由 Content-Type 头部变量决定，最常用的就是\
  \ application/json。在上一章中，返回的待办事项列表就是响应主体。\n\n现在您已经了解了响应是什么以及它由什么组成，让我们在下一节中看一下响应中包含的\
  \ HTTP 状态码。\n\n#### Status codes\n\n状态码是由服务器对客户端请求发出的唯一简短代码。响应状态码分为五类，每类表示不同的响应：\n\
  \n- 1XX: 请求已被接收。\n- 2XX: 请求成功。\n- 3XX: 请求被重定向。\n- 4XX: 客户端出现错误。\n- 5XX: 服务器出现错误。\n\
  \n完整的 HTTP 状态码列表可以在 https://httpstatuses.com/ 找到。\n\n状态码的第一位数字定义了其类别。常见的状态码包括 200\
  \ 表示请求成功，404 表示请求未找到，500 表示内部服务器错误。\n\n无论框架如何，构建 Web 应用程序时遵循的标准做法是为各个事件返回适当的状态码。不应为服务器错误返回\
  \ 400 状态码。同样，不应为失败的请求操作返回 200 状态码。\n\n现在您已经了解了状态码是什么，让我们在下一节中学习如何构建响应模型。\n\n####\
  \ Building response models\n\n我们在本章开头阐述了响应模型的目的。您还学习了如何使用 Pydantic 在上一章中构建模型。响应模型也是基于\
  \ Pydantic 构建的，但用途不同。\n\n在路由路径的定义中，我们有例如以下内容：\n\n```\n@app.get(\"/todo\")\nasync\
  \ def retrieve_todo() -> dict:\n    return {\n        \"todos\": todo_list\n   \
  \ }\n```\n\n该路由返回数据库中存在的待办事项列表。以下是一些示例输出：\n\n```\n{\n  \"todos\": [\n    {\n   \
  \   \"id\": 1,\n      \"item\": \"Example schema 1!\"\n    },\n    {\n      \"id\"\
  : 2,\n      \"item\": \"Example schema 2!\"\n    },\n    {\n      \"id\": 3,\n```\n\
  \n\n\n\n\n```\n\"item\": \"Example schema 5!\"\n}\n]\n}\n```\n\n该路由返回存储在 todos 数组中的所有内容。若要指定返回的信息，我们就必须将要显示的数据分离出来或引入额外的逻辑。幸运的是，我们可以创建一个包含我们想要返回的字段的模型，并使用\
  \ response_model 参数将其添加到我们的路由定义中。\n\n让我们更新检索所有待办事项的路由，使其返回仅包含待办事项项的数组，而不返回 ID。让我们先在\
  \ model.py 中定义一个新的模型类来返回待办事项项列表：\n\n```\nfrom typing import List\n\nclass TodoItem(BaseModel):\n\
  \    item: str\n\n    class Config:\n        schema_extra = {\n            \"example\"\
  : {\n                \"item\": \"Read the next chapter of the book\"\n         \
  \   }\n        }\n\nclass TodoItems(BaseModel):\n    todos: List[TodoItem]\n\n \
  \   class Config:\n        schema_extra = {\n            \"example\": {\n      \
  \          \"todos\": [\n                    {\n                        \"item\"\
  : \"Example schema 1!\"\n                    },\n                    {\n       \
  \                 \"item\": \"Example schema 2!\"\n```\n\n```\n}\n]\n}\n}\n```\n\
  \n在前面的代码块中，我们定义了一个新的模型 TodoItems，它返回包含在 TodoItem 模型中的变量列表。让我们通过向其添加响应模型来更新 todo.py\
  \ 中的路由：\n\n```\nfrom model import Todo, TodoItem, TodoItems\n...\n@todo_router.get(\"\
  /todo\", response_model=TodoItems)\nasync def retrieve_todo() -> dict:\n    return\
  \ {\n        \"todos\": todo_list\n    }\n```\n\n激活你的虚拟环境并启动应用程序：\n\n```\n$ source\
  \ venv/bin/activate\n(venv)$ uvicorn api:app --host=0.0.0.0 --port 8000 --reload\n\
  ```\n\n接下来，添加一个新的待办事项：\n\n```\n(venv)$ curl -X 'POST' \\\n'http://127.0.0.1:8000/todo'\
  \ \\\n-H 'accept: application/json' \\\n-H 'Content-Type: application/json' \\\n\
  -d '{\n\"id\": 1,\n\"item\": \"This todo will be retrieved without exposing my ID!\"\
  \n}'\n```\n\n检索待办事项：\n\n```\n(venv)$ curl -X 'GET' \\\n  'http://127.0.0.1:8000/todo'\
  \ \\\n  -H 'accept: application/json'\n```\n\n收到的响应如下：\n\n```\n{\n  \"todos\": [\n\
  \    {\n      \"item\": \" This todo will be retrieved without exposing my ID!\"\
  \n    }\n  ]\n}\n```\n\n现在我们已经了解了响应模型是什么以及如何使用它们，我们将在后续章节中在合适的地方继续使用它们。让我们在下一节中看看错误响应以及如何处理错误。\n\
  \n#### 错误处理\n\n在本章前面，我们学习了状态码是什么以及它们在告知客户端请求状态方面如何有用。请求可能会返回错误的响应，而这些响应可能很丑陋或关于失败原因的信息不足。\n\
  \n请求错误可能源于尝试访问不存在的资源、在没有足够权限的情况下访问受保护的页面，甚至是服务器错误。FastAPI 中的错误通过使用 FastAPI 的 HTTPException\
  \ 类引发异常来处理。\n\n> **什么是 HTTP 异常？**\n> HTTP 异常是一个事件，用于指示请求流程中的故障或问题。\n\nHTTPException\
  \ 类接受三个参数：\n\n- status_code：为此次中断返回的状态码\n- detail：随同发送给客户端的消息\n- headers：需要标头的响应的可选参数\n\
  \n在我们的待办事项路由路径定义中，当找不到待办事项时，我们会返回一条消息。我们将对其进行更新以引发 HTTPException。HTTPException 允许我们返回适当的错误响应代码。\n\
  \n在我们当前的应用程序中，检索不存在的待办事项会在 http://127.0.0.1:8000/docs 上返回 200 响应状态码而不是 404 响应状态码：\n\
  \n![](img/85e42522e1d8d05fd8b981490d6d9056_65_0.png)\n\n图 3.1 – 请求返回 200 响应而不是 404\
  \ 响应\n\n通过更新路由以使用 HTTPException 类，我们可以在响应中返回相关详细信息。在 todo.py 中，更新检索、更新和删除待办事项的路由：\n\
  \n```\nfrom fastapi import APIRouter, Path, HTTPException, status\n..\n@todo_router.get(\"\
  /todo/{todo_id}\")\nasync def get_single_todo(todo_id: int = Path(..., title=\"\
  The ID of the todo to retrieve.\")) -> dict:\n    for todo in todo_list:\n```\n\n\
  ```\nif todo.id == todo_id:\n    return {\n        \"todo\": todo\n    }\nraise\
  \ HTTPException(\n    status_code=status.HTTP_404_NOT_FOUND,\n    detail=\"Todo\
  \ with supplied ID doesn't exist\",\n)\n\n@todo_router.put(\"/todo/{todo_id}\")\n\
  async def update_todo(todo_data: TodoItem, todo_id: int = Path(..., title=\"The\
  \ ID of the todo to be updated.\")) -> dict:\n    for todo in todo_list:\n     \
  \   if todo.id == todo_id:\n            todo.item = todo_data.item\n           \
  \ return {\n                \"message\": \"Todo updated successfully.\"\n      \
  \      }\n\n    raise HTTPException(\n        status_code=status.HTTP_404_NOT_FOUND,\n\
  \        detail=\"Todo with supplied ID doesn't exist\",\n    )\n\n@todo_router.delete(\"\
  /todo/{todo_id}\")\nasync def delete_single_todo(todo_id: int) -> dict:\n    for\
  \ index in range(len(todo_list)):\n        todo = todo_list[index]\n        if todo.id\
  \ == todo_id:\n            todo_list.pop(index)\n            return {\n        \
  \        \"message\": \"Todo deleted successfully.\"\n            }\n\n    raise\
  \ HTTPException(\n        status_code=status.HTTP_404_NOT_FOUND,\n```\n\n```\ndetail=\"\
  Todo with supplied ID doesn't exist\",\n)\n```\n\n现在，让我们重试检索不存在的待办事项以验证是否返回了正确的响应代码：\n\
  \n#### 响应\n\n#### Curl\n\n```\ncurl -X 'GET' \\\n'http://127.0.0.1:8000/todo/12'\
  \ \\\n-H 'accept: application/json'\n```\n\n#### 请求 URL\n\n```\nhttp://127.0.0.1:8000/todo/12\n\
  ```\n\n#### 服务器响应\n\n#### 代码\n详细信息\n\n404\n未记录错误：未找到\n\n#### 响应体\n\n```\n{\n  \"\
  detail\": \"Todo with supplied ID doesn't exist\"\n}\n```\n\n#### 响应标头\n\n图 3.2\
  \ – 显示正确的 404 响应代码\n\n最后，我们可以通过向装饰器函数添加 status_code 参数来声明 HTTP 状态码以覆盖成功操作的默认状态码：\n\
  \n```\n@todo_router.post(\"/todo\", status_code=201)\nasync def add_todo(todo: Todo)\
  \ -> dict:\n    todo_list.append(todo)\n    return {\n        \"message\": \"Todo\
  \ added successfully.\"\n    }\n```\n\n在本节中，我们学习了如何向客户端返回正确的响应代码，以及如何覆盖默认状态码。还需要注意的是，成功的默认状态码是\
  \ 200。\n\n### 总结\n\n在本章中，我们学习了响应和响应模型是什么，以及错误处理意味着什么。我们还学习了 HTTP 状态码以及使用它们的重要性。\n\
  \n我们还根据上一章创建模型所获得的知识创建了响应模型，并创建了一个响应模型来仅返回待办事项列表中的项目而不返回其 ID。最后，我们学习了错误和错误处理。我们更新了现有的路由，使其返回正确的响应代码而不是默认的\
  \ 200 状态码。\n\n在下一章中，你将介绍使用 Jinja 模板化 FastAPI 应用程序。你将首先介绍开始使用 Jinja 模板所需的基础知识，然后使用你的模板知识为我们的简单待办事项应用程序创建一个用户界面。\n\
  \n### 4\n\n#### FastAPI 中的模板化\n\n现在我们已经在上一章学习了如何处理包括错误在内的请求响应，我们可以继续将请求响应渲染到网页上。在本章中，我们将学习如何使用\
  \ Jinja 提供的模板将 API 的响应渲染到网页上，Jinja 是一种用 Python 编写的模板语言，旨在帮助 API 响应的渲染过程。\n\n模板化是将从\
  \ API 获取的数据以各种格式显示的过程。模板充当 Web 应用程序中的前端组件。\n\n到本章结束时，你将具备模板是什么以及如何使用模板渲染 API 信息的知识。本章将涵盖以下主题：\n\
  \n- 了解 Jinja\n- 在 FastAPI 中使用 Jinja2 模板\n\n### 技术要求\n\n本章使用的代码可以在 https://github.com/PacktPublishing/Building-Python-Web-APIs-with-FastAPI/tree/main/ch04/todos\
  \ 找到。\n\n\n\n\n\n#### 理解 Jinja\n\n**Jinja** 是一个用 Python 编写的模板引擎，旨在帮助 API 响应的渲染过程。在每种模板语言中，都有变量在模板渲染时会被替换为传递给它们的实际值，还有标签来控制模板的逻辑。\n\
  \nJinja 模板引擎使用花括号 { } 来区分其表达式和语法与常规 HTML、文本以及模板文件中的任何其他变量。\n\n{{ }} 语法称为 **变量块**。{%\
  \ %} 语法包含控制结构，例如 **if/else、循环和宏**。\n\nJinja 模板语言中使用的三种常见语法块包括以下内容：\n\n- `{% ...\
  \ %}` – 此语法用于语句，例如控制结构。\n- `{{ todo.item }}` – 此语法用于打印传递给它的表达式的值。\n- `{# This is\
  \ a great API book! #}` – 此语法用于编写注释，并且不会在网页上显示。\n\nJinja 模板变量可以是任何可以转换为字符串的 Python\
  \ 类型或对象。可以将模型、列表或字典类型传递给模板，并通过将这些属性放在前面列出的第二个块中来显示其属性。\n\n在下一节中，我们将研究过滤器。过滤器是每个模板引擎的重要组成部分，在\
  \ Jinja 中，过滤器使我们能够执行某些函数，例如从列表中连接值和检索对象的长度等。\n\n在以下小节中，我们将研究 Jinja 中使用的一些常见功能：过滤器、if\
  \ 语句、循环、宏和模板继承。\n\n#### 过滤器\n\n尽管 Python 和 Jinja 的语法相似，但诸如连接字符串、将字符串的第一个字符设为大写等修改无法使用\
  \ Jinja 中的 Python 语法完成。因此，为了执行此类修改，我们在 Jinja 中使用过滤器。\n\n过滤器与变量之间用管道符号 (|) 分隔，并且可以在括号中包含可选参数。过滤器按以下格式定义：\n\
  \n```\n{{ variable | filter_name(*args) }}\n```\n\n如果没有参数，定义变为以下内容：\n\n```\n{{ variable\
  \ | filter_name }}\n```\n\n让我们在以下小节中查看一些常见过滤器。\n\n##### default 过滤器\n\ndefault 过滤器变量用于在传递的值最终为\
  \ None 时替换输出：\n\n```\n{{ todo.item | default('This is a default todo item') }}\n\
  This is a default todo item\n```\n\n##### escape 过滤器\n\n此过滤器用于渲染原始 HTML 输出：\n\n\
  ```\n{{ \"<title>Todo Application</title>\" | escape }}\n<title>Todo Application</title>\n\
  ```\n\n##### 转换过滤器\n\n这些过滤器包括 int 和 float 过滤器，用于从一种数据类型转换为另一种数据类型：\n\n```\n{{ 3.142\
  \ | int }}\n3\n\n{{ 31 | float }}\n31.0\n```\n\n##### join 过滤器\n\n此过滤器用于将列表中的元素连接成字符串，如\
  \ Python 中所示：\n\n```\n{{ ['Packt', 'produces', 'great', 'books!'] | join(' ') }}\n\
  Packt produces great books!\n```\n\n##### length 过滤器\n\n此过滤器用于返回传递对象的长度。它在 Python\
  \ 中与 len() 具有相同的功能：\n\n```\nTodo count: {{ todos | length }}\nTodo count: 4\n```\n\
  \n> Note\n> 要获取过滤器的完整列表并了解有关 Jinja 中过滤器的更多信息，请访问 https://jinja.palletsprojects.com/en/3.0.x/templates/#builtin-filters。\n\
  \n#### 使用 if 语句\n\nJinja 中 if 语句的使用与 Python 中的使用相似。if 语句用于 {% %} 控制块中。让我们看一个例子：\n\
  \n```\n{% if todo | length < 5 %}\n    You don't have much items on your todo list!\n\
  {% else %}\n    You have a busy day it seems!\n{% endif %}\n```\n\n#### 循环\n\n我们也可以在\
  \ Jinja 中遍历变量。这可以是列表或通用函数，例如以下示例：\n\n```\n{% for todo in todos %}\n    <b> {{ todo.item\
  \ }} </b>\n{% endfor %}\n```\n\n你可以在 for 循环中访问特殊变量，例如 loop.index，它给出当前迭代的索引。以下是特殊变量及其描述的列表：\n\
  \n| Variable | Description |\n|---|---|\n| loop.index | The current iteration of\
  \ the loop (1 indexed) |\n| loop.index0 | The current iteration of the loop (0 indexed)\
  \ |\n| loop.revindex | The number of iterations from the end of the loop (1 indexed)\
  \ |\n| loop.revindex0 | The number of iterations from the end of the loop (0 indexed)\
  \ |\n| loop.first | True if first iteration |\n| loop.last | True if last iteration\
  \ |\n| loop.length | The number of items in the sequence |\n| loop.cycle | A helper\
  \ function to cycle between a list of sequences |\n| loop.depth | Indicates how\
  \ deep in a recursive loop the rendering currently is; starts at level 1 |\n| loop.depth0\
  \ | Indicates how deep in a recursive loop the rendering currently is; starts at\
  \ level 0 |\n| loop.previtem | The item from the previous iteration of the loop;\
  \ undefined during the first iteration |\n| loop.nextitem | The item from the following\
  \ iteration of the loop; undefined during the last iteration |\n| loop.changed(*val)\
  \ | True if previously called with a different value (or not called at all) |\n\n\
  #### 宏\n\nJinja 中的宏是一个返回 HTML 字符串的函数。宏的主要用例是避免代码重复，而是使用单个函数调用。例如，定义输入宏是为了减少在 HTML\
  \ 表单中连续定义输入标签：\n\n```\n{% macro input(name, value='', type='text', size=20 %}\n\
  \    <div class=\"form\">\n        <input type=\"{{ type }}\" name=\"{{ name }}\"\
  \ \n        value=\"{{ value|escape }}\" size=\"{{ size }}\">\n    </div>\n{% endmacro\
  \ %}\n```\n\n现在，要快速在表单中创建输入，调用宏：\n\n```\n{{ input('item') }}\n```\n\n这将返回以下内容：\n\
  \n```\n<div class=\"form\">\n    <input type=\"text\" name=\"item\" value=\"\" size=\"\
  20\">\n</div>\n```\n\n现在我们已经了解了宏是什么，我们将继续学习模板继承是什么以及它在 FastAPI 中如何工作。\n\n#### 模板继承\n\
  \nJinja 最强大的功能是模板继承。此功能推进了 **不要重复自己 (DRY)** 原则，并在大型 Web 应用程序中非常有用。模板继承是指定义一个基础模板，子模板可以交互、继承和替换基础模板中定义的各个部分。\n\
  \n> **Note**\n> 你可以在 https://jinja.palletsprojects.com/en/3.0.x/templates/#template-inheritance\
  \ 了解有关 Jinja 模板继承的更多信息。\n\n现在你已经学习了 Jinja 语法的[content]\n\n#### 理解 Jinja\n\n**Jinja**\
  \ 是一个用 Python 编写的模板引擎，旨在帮助 API 响应的渲染过程。在每种模板语言中，都有变量在模板渲染时会被替换为传递给它们的实际值，还有标签来控制模板的逻辑。\n\
  \nJinja 模板引擎使用花括号 { } 来区分其表达式和语法与常规 HTML、文本以及模板文件中的任何其他变量。\n\n{{ }} 语法称为 **变量块**。{%\
  \ %} 语法包含控制结构，例如 **if/else、循环和宏**。\n\nJinja 模板语言中使用的三种常见语法块包括以下内容：\n\n- `{% ...\
  \ %}` – 此语法用于语句，例如控制结构。\n- `{{ todo.item }}` – 此语法用于打印传递给它的表达式的值。\n- `{# This is\
  \ a great API book! #}` – 此语法用于编写注释，并且不会在网页上显示。\n\nJinja 模板变量可以是任何可以转换为字符串的 Python\
  \ 类型或对象。可以将模型、列表或字典类型传递给模板，并通过将这些属性放在前面列出的第二个块中来显示其属性。\n\n在下一节中，我们将研究过滤器。过滤器是每个模板引擎的重要组成部分，在\
  \ Jinja 中，过滤器使我们能够执行某些函数，例如从列表中连接值和检索对象的长度等。\n\n在以下小节中，我们将研究 Jinja 中使用的一些常见功能：过滤器、if\
  \ 语句、循环、宏和模板继承。\n\n#### 过滤器\n\n尽管 Python 和 Jinja 的语法相似，但诸如连接字符串、将字符串的第一个字符设为大写等修改无法使用\
  \ Jinja 中的 Python 语法完成。因此，为了执行此类修改，我们在 Jinja 中使用过滤器。\n\n过滤器与变量之间用管道符号 (|) 分隔，并且可以在括号中包含可选参数。过滤器按以下格式定义：\n\
  \n```\n{{ variable | filter_name(*args) }}\n```\n\n如果没有参数，定义变为以下内容：\n\n```\n{{ variable\
  \ | filter_name }}\n```\n\n让我们在以下小节中查看一些常见过滤器。\n\n##### The default filter\n\nThe\
  \ default filter variable is used to replace the output of the passed value if it\
  \ turns out to be None:\n\n```\n{{ todo.item | default('This is a default todo item')\
  \ }}\nThis is a default todo item\n```\n\n##### The escape filter\n\nThis filter\
  \ is used to render raw HTML output:\n\n```\n{{ \"<title>Todo Application</title>\"\
  \ | escape }}\n<title>Todo Application</title>\n```\n\n##### The conversion filters\n\
  \nThese filters include int and float filters used to convert from one data type\
  \ to another:\n\n```\n{{ 3.142 | int }}\n3\n\n{{ 31 | float }}\n31.0\n```\n\n#####\
  \ The join filter\n\nThis filter is used to join elements in a list into a string\
  \ as in Python:\n\n```\n{{ ['Packt', 'produces', 'great', 'books!'] | join(' ')\
  \ }}\nPackt produces great books!\n```\n\n##### The length filter\n\nThis filter\
  \ is used to return the length of the object passed. It fulfills the same role as\
  \ len() in Python:\n\n```\nTodo count: {{ todos | length }}\nTodo count: 4\n```\n\
  \n> Note\n> For a full list of filters and to learn more about filters in Jinja,\
  \ visit https://jinja.palletsprojects.com/en/3.0.x/templates/#builtin-filters.\n\
  \n#### Using if statements\n\nThe usage of if statements in Jinja is similar to\
  \ their usage in Python. if statements are used in the {% %} control blocks. Let's\
  \ look at an example:\n\n```\n{% if todo | length < 5 %}\n    You don't have much\
  \ items on your todo list!\n{% else %}\n    You have a busy day it seems!\n{% endif\
  \ %}\n```\n\n#### Loops\n\nWe can also iterate through variables in Jinja. This\
  \ could be a list or a general function, such as the following, for example:\n\n\
  ```\n{% for todo in todos %}\n    <b> {{ todo.item }} </b>\n{% endfor %}\n```\n\n\
  You can access special variables inside a for loop, such as loop.index, which gives\
  \ the index of the current iteration. The following is a list of the special variables\
  \ and their descriptions:\n\n| Variable | Description |\n|---|---|\n| loop.index\
  \ | The current iteration of the loop (1 indexed) |\n| loop.index0 | The current\
  \ iteration of the loop (0 indexed) |\n| loop.revindex | The number of iterations\
  \ from the end of the loop (1 indexed) |\n| loop.revindex0 | The number of iterations\
  \ from the end of the loop (0 indexed) |\n| loop.first | True if first iteration\
  \ |\n| loop.last | True if last iteration |\n| loop.length | The number of items\
  \ in the sequence |\n| loop.cycle | A helper function to cycle between a list of\
  \ sequences |\n| loop.depth | Indicates how deep in a recursive loop the rendering\
  \ currently is; starts at level 1 |\n| loop.depth0 | Indicates how deep in a recursive\
  \ loop the rendering currently is; starts at level 0 |\n| loop.previtem | The item\
  \ from the previous iteration of the loop; undefined during the first iteration\
  \ |\n| loop.nextitem | The item from the following iteration of the loop; undefined\
  \ during the last iteration |\n| loop.changed(*val) | True if previously called\
  \ with a different value (or not called at all) |\n\n#### Macros\n\nA macro in Jinja\
  \ is a function that return an HTML string. The main use case for macros is to avoid\
  \ the repetition of code and instead use a single function call. For example, an\
  \ input macro is defined to reduce the continuous definition of input tags in an\
  \ HTML form:\n\n```\n{% macro input(name, value='', type='text', size=20 %}\n  \
  \  <div class=\"form\">\n        <input type=\"{{ type }}\" name=\"{{ name }}\"\
  \ \n        value=\"{{ value|escape }}\" size=\"{{ size }}\">\n    </div>\n{% endmacro\
  \ %}\n```\n\nNow, to quickly create an input in your form, the macro is called:\n\
  \n```\n{{ input('item') }}\n```\n\nThis will return the following:\n\n```\n<div\
  \ class=\"form\">\n    <input type=\"text\" name=\"item\" value=\"\" size=\"20\"\
  >\n</div>\n```\n\nNow that we have learned what macros are, we will proceed to learn\
  \ what template inheritance is and how it works in FastAPI.\n\n#### Template inheritance\n\
  \nJinja’s most powerful feature is the inheritance of templates. This feature advances\
  \ the **don’t repeat yourself (DRY)** principle and comes in handy in large web\
  \ applications. Template inheritance is a situation where a base template is defined\
  \ and child templates can interact, inherit, and replace defined sections of the\
  \ base template.\n\n> **Note**\n> You can learn more about Jinja’s template inheritance\
  \ at https://jinja.palletsprojects.com/en/3.0.x/templates/#template-inheritance.\n\
  \nNow that you’ve learned the basics of Jinja’s syntax, let’s learn how to use templates\
  \ in FastAPI in the next section.\n\n#### Using Jinja templates in FastAPI\n\nTo\
  \ get started, we need to install the Jinja package and create a new folder, `templates`,\
  \ in our project directory. This folder will store all our Jinja files, which are\
  \ HTML files mixed with Jinja’s syntax. Since this book does not focus on user interface\
  \ design, we will be making use of the CSS `Bootstrap` library and avoid writing\
  \ our own styles.\n\nThe Bootstrap library will be downloaded from the CDN upon\
  \ page load. However, extra assets can be stored in a different folder. We will\
  \ look into serving static files in the next chapter.\n\nWe’ll start by creating\
  \ the homepage template, which will house the section for creating new todos. The\
  \ following is a mockup of how we want our homepage template to look:\n\n![](img/85e42522e1d8d05fd8b981490d6d9056_75_0.png)\n\
  \nFigure 4.1 – Mockup of our homepage template\n\n1. First, let’s install the Jinja\
  \ package and create the templates folder:\n\n```\n(venv)$ pip install jinja2\n\
  (venv)$ mkdir templates\n```\n\n2. In the newly created folder, create two new files,\
  \ home.html and todo.html:\n\n```\n(venv)$ cd templates\n(venv)$ touch {home,todo}.html\n\
  ```\n\nIn the preceding command block, we have created two template files:\n\n-\
  \ home.html for the application’s home page\n- todo.html for the todo page\n\nIn\
  \ the mockup in Figure 4.1, the inner box denotes the todo template while the bigger\
  \ box is the homepage template.\n\n\n\n\n\n在构建模板之前，让我们先在 FastAPI 应用中配置 Jinja：\n\n\
  +   1. 让我们修改 todo API 组件 todo.py 的 POST 路由：\n\n```\nfrom fastapi import APIRouter,\
  \ Path, HTTPException,\nstatus, Request, Depends\nfrom fastapi.templating import\
  \ Jinja2Templates\nfrom model import Todo, TodoItem, TodoItems\n\ntodo_router =\
  \ APIRouter()\n\ntodo_list = []\n\ntemplates = Jinja2Templates(directory=\"templates/\"\
  )\n\n@todo_router.post(\"/todo\")\nasync def add_todo(request: Request, todo: Todo\
  \ =\nDepends(Todo.as_form())):\n    todo.id = len(todo_list) + 1\n    todo_list.append(todo)\n\
  \    return templates.TemplateResponse(\"todo.html\",\n    {\n        \"request\"\
  : request,\n        \"todos\": todo_list\n    })\n```\n\n+   2. 接下来，更新 GET 路由：\n\
  \n```\n@todo_router.get(\"/todo\", response_model=TodoItems)\nasync def retrieve_todo(request:\
  \ Request):\n    return templates.TemplateResponse(\"todo.html\", {\n        \"\
  request\": request,\n        \"todos\": todo_list\n    })\n\n@todo_router.get(\"\
  /todo/{todo_id}\")\nasync def get_single_todo(request: Request, todo_id: int\n=\
  \ Path(..., title=\"The ID of the todo to retrieve.\")):\n```\n\n```\nfor todo in\
  \ todo_list:\n    if todo.id == todo_id:\n        return templates.TemplateResponse(\n\
  \            \"todo.html\", {\n                \"request\": request,\n         \
  \       \"todo\": todo\n            })\n    raise HTTPException(\n        status_code=status.HTTP_404_NOT_FOUND,\n\
  \        detail=\"Todo with supplied ID doesn't exist\",\n    )\n```\n\n在前面的代码块中，我们已配置\
  \ Jinja 在 templates 目录中查找模板，以提供传递给 templates.TemplateResponse() 方法的模板。\n\n用于添加 todo\
  \ 的 POST 方法也已更新，以包含对输入的依赖。依赖将在第 6 章《连接到数据库》中详细介绍。\n\n+   3. 在 model.py 中，在 Config\
  \ 子类之前添加高亮代码：\n\n```\nfrom typing import List, Optional\n\nclass Todo(BaseModel):\n\
  \    id: Optional[int]\n    item: str\n\n    @classmethod\n    def as_form(\n  \
  \      cls,\n        item: str = Form(...)\n    ):\n        return cls(item=item)\n\
  ```\n\n现在我们已更新 API 代码，让我们编写模板。我们将从下一步开始编写基础 home.html 模板。\n\n4. 在 home.html 中，我们将首先声明文档类型：\n\
  \n```\n<!DOCTYPE html>\n<html lang=\"en\">\n    <head>\n        <meta charset=\"\
  UTF-8\">\n        <meta http-equiv=\"X-UA-Compatible\" content=\"IE=edge\">\n  \
  \      <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\"\
  >\n        <title>Packt Todo Application</title>\n        <link rel=\"stylesheet\"\
  \ href=\"https://stackpath.bootstrapcdn.com/bootstrap/4.1.0/css/bootstrap.min.css\"\
  \ integrity=\"sha384-9gVQ4dYFwwWSjIDZ9bE...\" crossorigin=\"anonymous\">\n     \
  \   <link rel=\"stylesheet\" href=\"https://use.fontawesome.com/releases/v5.0.10/css/all.css\"\
  \ integrity=\"sha384-+d0P83n9kaQMCwj8F4RJB66tzIwOKmrdb46+porD/OvrJ+37WqIM7UoBtwH06Nlg\"\
  \ crossorigin=\"anonymous\">\n    </head>\n```\n\n5. 下一步是为模板正文编写内容。在模板的正文中，我们将在\
  \ <header></header> 标签下包含应用程序的名称，并将指向子模板的 todo_container 的链接包裹在 block 标签中。子模板将在第\
  \ 8 步中编写。\n\n在 home.html 模板文件中，紧接在 </head> 标签后包含以下代码：\n\n```\n<body>\n    <header>\n\
  \        <nav class=\"navbar\">\n            <div class=\"container-fluid\">\n \
  \               <center>\n```\n\n```\n<h1>Packt Todo\nApplication</h1>\n</center>\n\
  </div>\n</nav>\n</header>\n<div class=\"container-fluid\">\n{% block todo_container\
  \ %}{% endblock %}\n</div>\n</body>\n</html>\n```\n\n高亮代码告诉父模板 todo_container 块将由子模板定义。包含\
  \ todo_container 块并扩展父模板的子模板，其内容将在此处显示。\n\n6. 要查看更改，请激活虚拟环境并启动应用程序：\n\n```\n$ source\
  \ venv/bin/activate\n(venv)$ uvicorn api:app --host=0.0.0.0 --port 8000 --reload\n\
  ```\n\n7. 打开 http://127.0.0.1:8000/todo 以预览更改：\n\n![](img/85e42522e1d8d05fd8b981490d6d9056_79_0.png)\n\
  \n图 4.2 – Todo 应用程序主页\n\n8. 接下来，让我们在 todo.html 中编写 todo 模板：\n\n```\n{% extends \"\
  home.html\" %}\n\n{% block todo_container %}\n<main class=\"container\">\n    <hr>\n\
  \    <section class=\"container-fluid\">\n        <form method=\"post\">\n     \
  \       <div class=\"col-auto\">\n                <div class=\"input-group mb-3\"\
  >\n                    <input type=\"text\" name=\"item\"\n                    \
  \       value=\"{{ item }}\" class=\"form-control\" placeholder=\"Purchase Packt's\
  \ Python workshop course\"\n                           aria-label=\"Add a todo\"\
  \n                           aria-describedby=\"button-addon2\" />\n           \
  \         <button class=\"btn btn-outline-primary\" type=\"submit\" id=\"button-addon2\"\
  \ data-mdb-ripple-color=\"dark\">\n                        Add Todo\n          \
  \          </button>\n                </div>\n            </div>\n        </form>\n\
  \    </section>\n{% if todo %}\n    <article class=\"card container-fluid\">\n \
  \       <br/>\n        <h4>Todo ID: {{ todo.id }} </h4>\n        <p>\n         \
  \   <strong>\n                Item: {{ todo.item }}\n            </strong>\n```\n\
  \n```\n</p>\n</article>\n{% else %}\n    <section class=\"container-fluid\">\n \
  \       <h2 align=\"center\">Todos</h2>\n        <br>\n        <div class=\"card\"\
  >\n            <ul class=\"list-group list-group-flush\">\n                {% for\
  \ todo in todos %}\n                    <li class=\"list-group-item\">\n       \
  \                 {{ loop.index }}. <a href=\"/todo/{{loop.index}}\"> {{\n     \
  \                   todo.item }} </a>\n                    </li>\n             \
  \   {% endfor %}\n            </ul>\n        </div>\n    {% endif %}\n</section>\n\
  </main>\n{% endblock %}\n```\n\n在前面的代码块中，todo 模板继承了主页模板。我们还定义了 todo_container 块，其内容将在父模板中显示。\n\
  \ntodo 模板同时被用于检索所有 todos 和单个 todo 的路由。因此，模板根据使用的路由渲染不同的内容。\n\n在模板中，Jinja 使用 {% if\
  \ todo %} 块检查是否传递了 todo 变量。如果传递了 todo 变量，则渲染 todo 详情，否则渲染 {% else %} 块中的内容，即 todos\
  \ 列表。\n\n9. 刷新 Web 浏览器以查看最近的更改：\n\n![](img/85e42522e1d8d05fd8b981490d6d9056_82_0.png)\n\
  \n图 4.3 – 更新 todo 主页\n\n10. 让我们添加一个 todo 以验证主页按预期工作：\n\n![](img/85e42522e1d8d05fd8b981490d6d9056_82_1.png)\n\
  \n图 4.4 – 显示的 todos 列表\n\n11. todo 是可点击的。点击 todo，你应该会看到以下页面：\n\n![](img/85e42522e1d8d05fd8b981490d6d9056_83_0.png)\n\
  \n图 4.5 – 单个 todo 页面\n\n我们已成功向 FastAPI 应用程序添加了模板。\n\n### 摘要\n\n在本章中，我们学习了什么是模板化、Jinja\
  \ 模板系统的基础知识，以及如何在 FastAPI 中使用它。我们利用本章第一部分学到的基础知识来决定渲染什么内容。我们还学习了什么是模板继承，以及它是如何工作的，使用主页和\
  \ todo 模板作为示例。\n\n在下一章中，你将被介绍 FastAPI 中的应用程序结构。在本章中，你将使用本章和前几章的知识构建一个计划应用程序。你将首先被介绍应用程序是如何结构化的，然后再继续构建计划应用程序。\n"
- "## 第 2 部分：\n构建和\n保护 FastAPI\n应用程序\n\n完成本部分后，你将能够使用 FastAPI 构建一个功能齐全且安全的应用程序。本部分使用前一部分的知识，并将其强化到构建比第二章中构建的应用程序更复杂、功能更强的应用程序。你还将能够集成并连接到\
  \ SQL 和 NoSQL（MongoDB）数据库，并在本部分结束时能够保护 FastAPI 应用程序。\n\n本部分包含以下章节：\n\n+   - 第 5\
  \ 章，FastAPI 应用程序结构\n+   - 第 6 章，连接到数据库\n+   - 第 7 章，保护 FastAPI 应用程序\n\n\n\n\n\n\
  ### 5\n结构化 FastAPI 应用\n\n在过去的四章中，我们研究了理解 FastAPI 并创建 FastAPI 应用涉及的基本步骤。到目前为止我们构建的应用是一个单文件\
  \ todo 应用，展示了 FastAPI 的灵活性和强大功能。前几章的关键收获是使用 FastAPI 构建应用是多么容易。然而，随着复杂性和功能性的增加，应用需要进行适当的\
  \ structuring。\n\nStructuring 指的是以有组织的格式安排应用组件，可以是模块化的，以提高应用代码和内容的 readability。具有适当\
  \ structuring 的应用能够实现更快的开发、更快的调试以及整体生产力的提升。\n\n在本章结束时，你将具备关于 structuring 是什么以及如何\
  \ structuring 你的 API 的知识。本章将涵盖以下主题：\n\n- Structuring application routes and models\n\
  - Implementing models for a planner API\n\n### 技术要求\n\n本章使用的代码可在 https://github.com/PacktPublishing/Building-Python-Web-APIs-with-FastAPI/tree/main/ch05/planner\
  \ 获取。\n\n### Structuring in FastAPI applications\n\n在本章中，我们将构建一个活动策划应用。让我们设计应用结构如下：\n\
  \n```\nplanner/\n  main.py\n  database/\n    __init__.py\n    connection.py\n  routes/\n\
  \    __init__.py\n    events.py\n    users.py\n  models/\n    __init__.py\n    events.py\n\
  \    users.py\n```\n\n第一步是为应用创建一个新文件夹。它将被命名为 planner：\n\n```\n$ mkdir planner &&\
  \ cd planner\n```\n\n在新创建的 planner 文件夹中，创建一个入口文件 main.py，以及三个子文件夹 – database、routes\
  \ 和 models：\n\n```\n$ touch main.py\n$ mkdir database routes models\n```\n\n接下来，在每个文件夹中创建\
  \ __init__.py：\n\n```\n$ touch {database,routes,models}/__init__.py\n```\n\n在 database\
  \ 文件夹中，让我们创建一个空白文件 database.py，它将处理我们在下一章中使用的数据库抽象和配置：\n\n```\n$ touch database/connection.py\n\
  ```\n\n在 routes 和 models 两个文件夹中，我们将创建两个文件 events.py 和 users.py：\n\n```\n$ touch\
  \ {routes,models}/{events,users}.py\n```\n\n每个文件都有其功能，如下所述：\n\n- Files in the routes\
  \ folder:\n  - events.py: This file will handle routing operations such as creating,\
  \ updating, and deleting events.\n  - users.py: This file will handle routing operations\
  \ such as the registration and signing-in of users.\n- Files in the models folder:\n\
  \  - events.py: This file will contain the model definition for events operations.\n\
  \  - users.py: This file will contain the model definition for user operations.\n\
  \n现在我们已经成功 structuring 了我们的 API，并根据其功能将相似的文件分组到组件中，让我们在下一节开始实现应用。\n\n### Building\
  \ an event planner application\n\n在本节中，我们将构建一个活动策划应用。在此应用中，已注册用户将能够创建、更新和删除活动。创建的活动可以通过应用自动创建的活动页面进行查看。\n\
  \n每个已注册用户和活动都将拥有唯一的 ID。这是为了防止在管理具有相同 ID 的用户和活动时发生冲突。在本节中，我们不会优先考虑 authentication\
  \ 或数据库管理，因为这将在第 6 章《Connecting to a Database》和第 7 章《Securing FastAPI Applications》中深入讨论。\n\
  \n为了启动开发，让我们在项目目录中创建一个虚拟环境并激活它：\n\n```\n$ python3 -m venv venv\n$ source venv/bin/activate\n\
  ```\n\n接下来，让我们安装应用依赖项：\n\n```\n(venv)$ pip install fastapi uvicorn \"pydantic[email]\"\
  \n```\n\n最后，将 requirements 保存到 requirements.txt 中：\n\n```\n(venv)$ pip freeze >\
  \ requirements.txt\n```\n\n现在我们已经成功安装了依赖项并设置了开发环境，让我们接下来实现应用的 models。\n\n### Implementing\
  \ the models\n\n让我们来看一下实现模型步骤：\n\n1. 构建应用的第一步是定义事件和用户的模型。模型描述了数据将在我们的应用中如何存储、输入和表示。以下图表显示了用户和事件的建模以及它们之间的关系：\n\
  \n![](img/85e42522e1d8d05fd8b981490d6d9056_90_0.png)\n\nFigure 5.1 – The model flow\
  \ for the user and event\n\n如上图所示的模型图，每个用户将拥有一个 Events 字段，即他们拥有的事件列表。\n\n2. 让我们在\
  \ models/events.py 中定义 Event 模型：\n\n```\nfrom pydantic import BaseModel\nfrom typing\
  \ import List\n\nclass Event(BaseModel):\n    id: int\n    title: str\n    image:\
  \ str\n    description: str\n    tags: List[str]\n    location: str\n```\n\n3. 让我们在\
  \ Event 类下定义一个 Config 子类，以展示当我们访问文档时模型数据将是什么样子的示例：\n\n```\nclass Config:\n    schema_extra\
  \ = {\n        \"example\": {\n            \"title\": \"FastAPI Book Launch\",\n\
  \            \"image\": \"https://linktomyimage.com/image.png\",\n            \"\
  description\": \"We will be discussing the contents of the FastAPI book in this\
  \ event. Ensure to come with your own copy to win gifts!\",\n            \"tags\"\
  : [\"python\", \"fastapi\", \"book\", \"launch\"]\n            \"location\": \"\
  Google Meet\"\n        }\n    }\n```\n\n我们在第一个代码块中的 event 模型包含五个字段：\n\n- The event\
  \ title\n- A link to the event image banner\n- The description of the event\n- Event\
  \ tags for grouping\n- The location of the event\n\n在第二个代码块中，我们定义了示例事件数据。这旨在指导我们在\
  \ API 中创建新事件时。\n\n4. 现在我们已经定义了 event 模型，让我们定义 User 模型：\n\n```\nfrom pydantic import\
  \ BaseModel, EmailStr\nfrom typing import Optional, List\nfrom models.events import\
  \ Event\n\nclass User(BaseModel):\n    email: EmailStr\n    password: str\n    events:\
  \ Optional[List[Event]]\n```\n\n我们之前定义的 User 模型包含以下字段：\n\n- The user’s email\n-\
  \ The user’s password\n- A list of events created by the user, which is empty by\
  \ default\n\n5. 现在我们已经定义了 User 模型，让我们创建一个示例来指示用户数据如何存储和设置：\n\n```\nclass Config:\n\
  \    schema_extra = {\n        \"example\": {\n            \"email\": fastapi@packt.com,\n\
  \            \"username\": \"strong!!!\",\n            \"events\": [],\n       \
  \ }\n    }\n```\n\n6. 接下来，我们将创建一个新的模型 NewUser，它继承自 User 模型；此新模型将用作注册新用户时的数据类型。User\
  \ 模型将用作响应模型，在我们不希望与密码交互时使用，从而减少需要完成的工作量。\n\n7. 最后，让我们实现一个用于用户登录的模型：\n\n```\nclass\
  \ UserSignIn(BaseModel):\n    email: EmailStr\n    password: str\n\n    class Config:\n\
  \        schema_extra = {\n            \"example\": {\n                \"email\"\
  : fastapi@packt.com,\n                \"password\": \"strong!!!\",\n           \
  \     \"events\": [],\n            }\n        }\n```\n\n现在我们已经成功实现了我们的 models，让我们在下一节实现\
  \ routes。\n\n### Implementing routes\n\n构建应用的下一步是设置 API 的路由系统。我们将为事件和用户设计路由系统。用户路由将包括\
  \ sign-in、sign-out 和 sign-up 路由。经过身份验证的用户将可以访问创建、更新和删除事件的路由，而公众可以在事件创建后查看事件。以下图表显示了两个路由之间的关系：\n\
  \n![](img/85e42522e1d8d05fd8b981490d6d9056_94_0.png)\n\nFigure 5.2 – The routes\
  \ for user and event operations\n\n让我们接下来详细查看这两个路由。\n\n### User routes\n\n现在我们已经从\
  \ Figure 5.2 中清楚地了解了要实现的路由，我们将开始在 users.py 中定义用户路由。让我们来看一下步骤：\n\n1. 首先定义一个基本的 sign-up\
  \ 路由：\n\n```\nfrom fastapi import APIRouter\n```\n\n\n\n\n\n```\nstatus_code=status.HTTP_409_CONFLICT,\n\
  \    detail=\"User with supplied username\n    exists\"\n)\nusers[data.email] =\
  \ data\nreturn {\n    \"message\": \"User successfully registered!\"\n}\n```\n\n\
  在之前定义的注册路由中，我们使用了应用内数据库。（我们将在第 6 章《连接到数据库》中介绍数据库。）\n\n该路由会在添加新用户之前检查数据库中是否已存在具有相似电子邮件地址的用户。\n\
  \n- 2. 让我们实现登录路由：\n\n```\n@user_router.post(\"/signin\")\nasync def sign_user_in(user:\
  \ UserSignIn) -> dict:\n    if users[user.email] not in users:\n        raise HTTPException(\n\
  \            status_code=status.HTTP_404_NOT_FOUND,\n            detail=\"User does\
  \ not exist\"\n        )\n    if users[user.email].password != user.password:\n\
  \        raise HTTPException(\n            status_code=status.HTTP_403_FORBIDDEN,\n\
  \            detail=\"Wrong credentials passed\"\n        )\n\n    return {\n  \
  \      \"message\": \"User signed in successfully\"\n    }\n```\n\n在此路由中，第一步是检查数据库中是否存在该用户，如果用户不存在，则会引发异常。如果用户存在，应用程序将继续检查密码是否匹配，然后返回成功消息或异常。\n\
  \n在我们的路由中，我们以明文形式存储密码且未进行任何加密。这仅用于演示目的，通常在软件工程中这是错误的做法。适当的存储机制例如加密将在第 6 章《连接到数据库》中讨论，在那里我们的应用程序将从应用内数据库迁移到真实数据库。\n\
  \n3. 现在我们已经定义了用户操作的路由，让我们在 main.py 中注册它们并启动应用程序。让我们先导入库和用户路由定义：\n\n```\nfrom fastapi\
  \ import FastAPI\nfrom routes.user import user_router\n\nimport uvicorn\n```\n\n\
  4. 接下来，让我们创建一个 FastAPI 实例并注册路由和应用程序：\n\n```\napp = FastAPI()\n\n#### Register routes\n\
  \napp.include_router(user_router, prefix=\"/user\")\n\nif __name__ == \"__main__\"\
  :\n    uvicorn.run(\"main:app\", host=\"0.0.0.0\", port=8080, reload=True)\n```\n\
  \n在这段代码中，我们创建了 FastAPI 的一个实例并注册了路由。\n\n5. 接下来，我们使用 uvicorn.run() 方法在 8080 端口启动应用程序并将热重载设置为\
  \ True。在终端中启动应用程序：\n\n```\n(venv)$ python main.py\nINFO:     Will watch for changes\
  \ in these directories:\n['/Users/youngestdev/Work/Building-Web-APIs-with-FastAPI-and-Python/ch05/planner']\n\
  INFO:     Uvicorn running on http://0.0.0.0:8080 (Press CTRL+C to quit)\nINFO: \
  \    Started reloader process [6547] using statreloader\n```\n\n```\nINFO:     Started\
  \ server process [6550]\nINFO:     Waiting for application startup.\nINFO:     Application\
  \ startup complete.\n```\n\n6. 现在我们的应用程序已成功启动，让我们测试我们实现的用户路由。我们将先注册一个用户：\n\n```\n\
  (venv)$ curl -X 'POST' \\\n  'http://0.0.0.0:8080/user/signup' \\\n  -H 'accept:\
  \ application/json' \\\n  -H 'Content-Type: application/json' \\\n  -d '{\n  \"\
  email\": \"fastapi@packt.com\",\n  \"password\": \"Stro0ng!\",\n  \"username\":\
  \ \"FastPackt\"\n}'\n```\n\n前述请求返回的响应为：\n\n```\n{\n  \"message\": \"User successfully\
  \ registered!\"\n}\n```\n\n7. 前述响应表明所执行的操作成功。让我们测试登录路由：\n\n```\n(venv)$ curl -X\
  \ 'POST' \\\n  'http://0.0.0.0:8080/user/signin' \\\n  -H 'accept: application/json'\
  \ \\\n  -H 'Content-Type: application/json' \\\n  -d '{\n  \"email\": \"fastapi@packt.com\"\
  ,\n  \"password\": \"Stro0ng!\"\n}'\n```\n\n对该请求的前述响应如下：\n\n```\n{\n  \"message\"\
  : \"User signed in successfully\"\n}\n```\n\n8. 如果我们传入错误的密码，应用程序应返回不同的消息：\n\n```\n\
  (venv)$ curl -X 'POST' \\\n'http://0.0.0.0:8080/user/signin' \\\n-H 'accept: application/json'\
  \ \\\n-H 'Content-Type: application/json' \\\n-d '{\n\"email\": \"fastapi@packt.com\"\
  ,\n\"password\": \"password!\"\n}'\n```\n\n前述请求的响应如下：\n\n```\n{\n  \"detail\": \"\
  Wrong credential passed\"\n}\n```\n\n我们还可以通过 FastAPI 提供的交互式文档查看我们的路由，该文档由 Swagger\
  \ 提供支持。让我们在浏览器中访问 http://0.0.0.0:8080/docs 以访问交互式文档：\n\n![](img/85e42522e1d8d05fd8b981490d6d9056_98_0.png)\n\
  \n图 5.3 – 在交互式文档页面上查看的 planner 应用程序\n\n现在我们已成功实现用户路由，让我们在下一节中实现事件操作的路由。\n\n### 事件路由\n\
  \n在用户路由就位后，下一步是实现事件操作的路由。让我们看一下步骤：\n\n- 1. 首先导入依赖项并定义事件路由器：\n\n```\nfrom fastapi\
  \ import APIRouter, Body, HTTPException,\nstatus\nfrom models.events import Event\n\
  from typing import List\n\nevent_router = APIRouter(\n    tags=[\"Events\"]\n)\n\
  \nevents = []\n```\n\n- 2. 下一步是定义用于检索数据库中所有事件以及与所提供 ID 匹配的事件的路由：\n\n```\n@event_router.get(\"\
  /\", response_model=List[Event])\nasync def retrieve_all_events() -> List[Event]:\n\
  \    return events\n\n@event_router.get(\"/{id}\", response_model=Event)\nasync\
  \ def retrieve_event(id: int) -> Event:\n    for event in events:\n        if event.id\
  \ == id:\n            return event\n    raise HTTPException(\n        status_code=status.HTTP_404_NOT_FOUND,\n\
  \        detail=\"Event with supplied ID does not exist\"\n    )\n```\n\n在第二个路由中，当所提供\
  \ ID 的事件不存在时，我们会引发 HTTP_404_NOT_FOUND 异常。\n\n3. 让我们实现创建事件、删除单个事件以及删除数据库中所有事件的路由：\n\
  \n```\n@event_router.post(\"/new\")\nasync def create_event(body: Event = Body(...))\
  \ -> dict:\n    events.append(body)\n    return {\n        \"message\": \"Event\
  \ created successfully\"\n    }\n\n@event_router.delete(\"/{id}\")\nasync def delete_event(id:\
  \ int) -> dict:\n    for event in events:\n        if event.id == id:\n        \
  \    events.remove(event)\n            return { \"message\": \"Event deleted successfully\"\
  \ }\n    raise HTTPException(\n        status_code=status.HTTP_404_NOT_FOUND,\n\
  \        detail=\"Event with supplied ID does not exist\"\n    )\n@event_router.delete(\"\
  /\")\nasync def delete_all_events() -> dict:\n    events.clear()\n    return {\n\
  \        \"message\": \"Events deleted successfully\"\n    }\n```\n\n我们已成功实现了事件的路由。UPDATE\
  \ 路由将在第 6 章《连接到数据库》中实现，在那里我们将把应用程序移植到使用实际数据库。\n\n4. 现在我们已经实现了路由，让我们更新 main.py 中的路由配置以包含事件路由：\n\
  \n```\nfrom fastapi import FastAPI\nfrom routes.user import user_router\nfrom routes.events\
  \ import event_router\n```\n\n```\nimport uvicorn\napp = FastAPI()\n\n#### Register\
  \ routes\n\napp.include_router(user_router, prefix=\"/user\")\napp.include_router(event_router,\
  \ prefix=\"/event\")\n\nif __name__ == \"__main__\":\n    uvicorn.run(\"main:app\"\
  , host=\"0.0.0.0\", port=8080,\n        reload=True)\n```\n\n应用程序在每次更改时都会自动重新加载。让我们测试路由：\n\
  \n- - GET 路由 – 以下操作返回一个空数组，告诉我们没有数据存在：\n- - POST 路由 – 在终端中执行以下命令：\n\n```\n(venv)$\
  \ curl -X 'GET' \\\n  'http://0.0.0.0:8080/event/' \\\n  -H 'accept: application/json'\n\
  []\n```\n\n让我们接下来向数组中添加数据。\n\n```\n(venv)$ curl -X 'POST' \\\n  'http://0.0.0.0:8080/event/new'\
  \ \\\n  -H 'accept: application/json' \\\n  -H 'Content-Type: application/json'\
  \ \\\n  -d '{\n\"id\": 1,\n\"title\": \"FastAPI Book Launch\",\n\"image\": \"https://linktomyimage.com/image.png\"\
  ,\n\"description\": \"We will be discussing the contents of the FastAPI book in\
  \ this event.Ensure to come with your own copy to win gifts!\",\n\"tags\": [\n \
  \ \"python\",\n```\n\n\n\n\n\n```\n\"fastapi\",\n\"book\",\n\"launch\"\n],\n\"location\"\
  : \"Google Meet\"\n}'\n```\n\n以下是响应：\n\n```\n{\n  \"message\": \"Event created successfully\"\
  \n}\n```\n\n从收到的响应来看，此操作成功。现在，让我们尝试检索刚刚创建的特定事件：\n\n- GET 路由：\n\n```\n(venv)$ curl\
  \ -X 'GET' \\\n'http://0.0.0.0:8080/event/1' \\\n-H 'accept: application/json'\n\
  ```\n\n以下是响应：\n\n```\n{\n  \"id\": 1,\n  \"title\": \"FastAPI BookLaunch\",\n  \"\
  image\": \"https://linktomyimage.com/image.png\",\n  \"description\": \"We will\
  \ be discussing the contents of the FastAPI book in this event.Ensure to come with\
  \ your own copy to win gifts!\",\n  \"tags\": [\n    \"python\",\n    \"fastapi\"\
  ,\n    \"book\",\n    \"launch\"\n  ],\n  \"location\": \"Google Meet\"\n}\n```\n\
  \n最后，让我们删除该事件以确认事件路由是否正常工作：\n\n- DELETE 路由 – 在终端中执行以下命令：\n\n```\n(venv)$ curl -X\
  \ 'DELETE' \\\n  'http://0.0.0.0:8080/event/1' \\\n  -H 'accept: application/json'\n\
  ```\n\n以下是响应：\n\n```\n{\n  \"message\": \"Event deleted successfully\"\n}\n```\n\
  \n如果我重试同一命令，我会得到以下响应：\n\n```\n(venv)$ {\n  \"detail\": \"Event with supplied ID\
  \ does not exist\"\n}\n```\n\n我们已成功为我们的规划应用程序实现了路由和模型。我们还对其进行了测试以评估其工作状态。\n\n###\
  \ 摘要\n\n在本章中，我们学习了如何构建 FastAPI 应用程序，并为活动规划应用程序实现路由和模型。我们使用了路由的基础知识以及在前一章中学习到的路由和建模知识。\n\
  \n在下一章中，您将学习如何将应用程序连接到 SQL 和 NoSQL 数据库。您将通过改进现有应用程序并添加更多功能来继续构建活动规划应用程序。在此之前，您将了解数据库是什么、不同类型以及如何在\
  \ FastAPI 应用程序中使用 SQL 和 NoSQL。\n\n### 6\n连接到\n数据库\n\n在上一章中，我们研究了如何构建 FastAPI 应用程序。我们成功为应用程序实现了一些路由和模型并测试了端点。然而，应用程序仍然使用应用内数据库来存储事件。在本章中，我们将迁移应用程序以使用适当的数据库。\n\
  \n数据库可以简单地称为数据的存储库。在此上下文中，数据库使我们能够永久存储数据，而与应用内数据库不同，应用内数据库会在任何应用程序重启或崩溃时被清除。数据库是一个包含列，即字段，和行，即记录的表。\n\
  \n到本章结束时，您将具备将 FastAPI 应用程序连接到数据库的知识。本章将解释如何使用 SQLModel 连接到 SQL 数据库，以及通过 Beanie\
  \ 连接到 MongoDB 数据库。 （不过，应用程序将在后面的章节中主要使用 MongoDB 作为其主要数据库。）在本章中，您将涵盖以下主题：\n\n- 设置\
  \ SQLModel\n- 使用 SQLModel 对 SQL 数据库进行 CRUD 操作\n- 设置 MongoDB\n- 使用 Beanie 对 MongoDB\
  \ 进行 CRUD 操作\n\n### 技术要求\n\n要跟上进度，需要 MongoDB 数据库组件。您操作系统的安装程序可以在其官方文档中找到。本章使用的代码可以在\
  \ https://github.com/PacktPublishing/Building-Python-Web-APIs-with-FastAPI/tree/main/ch06/planner\
  \ 找到。\n\n### 设置 SQLModel\n\n将 SQL 数据库集成到我们的规划应用程序中的第一步是安装 SQLModel 库。SQLModel 库由\
  \ FastAPI 的创建者构建，并由 Pydantic 和 SQLAlchemy 提供支持。Pydantic 的支持将使我们能够轻松定义模型，正如我们在第 3\
  \ 章《响应模型和错误处理》中所学到的。\n\n由于我们将同时实现 SQL 和 NoSQL 数据库，因此我们将为本节创建一个新的 GitHub 分支。在终端中，导航到项目目录，初始化\
  \ GitHub 仓库并提交现有文件：\n\n```\n$ git init\n$ git add database models routes main.py\n\
  $ git commit -m \"Committing bare application without a database\"\n```\n\n接下来，创建一个新分支：\n\
  \n```\n$ git checkout -b planner-sql\n```\n\n现在，我们准备在应用程序中设置 SQLModel。从终端激活虚拟环境并安装\
  \ SQLModel 库：\n\n```\n$ source venv/bin/activate\n(venv)$ pip install sqlmodel\n\
  ```\n\n在深入将数据库添加到我们的规划应用程序之前，让我们先看看本章中我们将使用的 SQLModel 中的一些方法。\n\n### 表\n\n表本质上是一个包含存储在数据库中的数据的对象\
  \ – 例如，事件数据将存储在事件表中。表将由列和行组成，数据最终将存储在其中。\n\n要使用 SQLModel 创建表，首先定义一个表模型类。与 Pydantic\
  \ 模型一样，表是定义的，但这次作为 SQLModel 类的子类。类定义还采用另一个配置变量 table，以指示此类是 SQLModel 表。\n\n类中定义变量将默认表示列，除非被指定为字段。让我们看看事件表将如何定义：\n\
  \n```\nclass Event(SQLModel, table=True):\n    id: Optional[int] = Field(default=None,\n\
  \    primary_key=True)\n    title: str\n    image: str\n    description: str\n \
  \   location: str\n    tags: List[str]\n```\n\n在此表类中，所有定义的变量都是列，除了 id，它被定义为字段。字段使用\
  \ SQLModel 库中的 Field 对象表示。id 字段也是数据库表中的主键。\n\n> **什么是主键？**\n> 主键是数据库表中记录的唯一标识符。\n\
  \n现在我们已经了解了表是什么以及如何创建它们，让我们在下一节中看看行。\n\n### 行\n\n发送到数据库表的数据存储在指定的列下的行中。要将数据插入行并存储它们，首先创建表的实例并用所需输入填充变量。例如，要将事件数据插入事件表，我们将首先创建模型的实例：\n\
  \n```\nnew_event = Event(title=\"Book Launch\",\n                image=\"src/fastapi.png\"\
  ,\n                description=\"The book launch event will\n                be\
  \ held at Packt HQ, Packt city\",\n```\n\n```\nlocation=\"Google Meet\",\ntags=[\"\
  packt\", \"book\"]\n```\n\n接下来，我们使用 Session 类创建一个数据库事务：\n\n```\nwith Session(engine)\
  \ as session:\n    session.add(new_event)\n    session.commit()\n```\n\n前面的操作可能对您来说很陌生。让我们看看\
  \ Session 类是什么以及它做什么。\n\n### 会话\n\n会话对象处理从代码到数据库的交互。它主要充当执行操作的中间人。Session 类接受一个参数，即\
  \ SQL 引擎的实例。\n\n现在我们已经了解了如何创建表和行，我们将看看如何创建数据库。本章中我们将使用的会话类的一些方法包括以下内容：\n\n- add():\
  \ 此方法负责将数据库对象添加到内存中，等待进一步操作。在之前的代码块中，new_event 对象被添加到会话的内存中，等待由 commit() 方法提交到数据库。\n\
  - commit(): 此方法负责刷新会话中存在的事务。\n- get(): 此方法接受两个参数 – 模型和请求的文档的 ID。此方法用于从数据库中检索单行。\n\
  \n现在我们知道如何创建表、行和列，以及如何使用 Session 类插入数据，让我们继续在下一节中创建数据库并执行 CRUD 操作。\n\n### 创建数据库\n\
  \n在 SQLModel 中，连接到数据库是通过 SQLAlchemy 引擎完成的。引擎由 create_engine() 方法创建，从 SQLModel 库导入。\n\
  \n\n\n\n\n`create_engine()` 方法以数据库 URL 作为参数。数据库 URL 的形式为 `sqlite:///database.db`\
  \ 或 `sqlite:///database.sqlite`。它还接受一个可选参数 `echo`，当设置为 True 时会在执行操作时打印出执行的 SQL 命令。\n\
  \n然而，仅靠 `create_engine()` 方法不足以创建数据库文件。要创建数据库文件，需要调用 `SQLModel.metadata.create_all(engine)`\
  \ 方法，其参数为 `create_engine()` 方法的实例，例如如下所示：\n\n```\ndatabase_file = \"database.db\"\
  \nengine = create_engine(database_file, echo=True)\nSQLModel.metadata.create_all(engine)\n\
  ```\n\n`create_all()` 方法会创建数据库以及已定义的表。需要注意的是，包含表的 文件会被导入到建立数据库连接的文件中。\n\n在我们的 planner\
  \ 应用中，我们对事件执行 CRUD 操作。在 database 文件夹中，创建以下文件：\n\nconnection.py\n\n在此文件中，我们将配置数据库所需的数据：\n\
  \n```\n(venv)$ touch database/connection.py\n```\n\n现在我们已经创建了数据库连接文件，让我们创建连接应用程序到数据库所需的函数：\n\
  \n- 1. 我们将首先更新 `models/events.py` 中定义的 events 模型类，使其成为 SQLModel 表模型类：\n\n```\nfrom\
  \ sqlmodel import JSON, SQLModel, Field, Column\nfrom typing import Optional, List\n\
  \nclass Event(SQLModel, table=True):\n    id: int = Field(default=None, primary_key=True)\n\
  \    title: str\n    image: str\n    description: str\n    tags: List[str] = Field(sa_column=Column(JSON))\n\
  \    location: str\n\nclass Config:\n    arbitrary_types_allowed = True\n    schema_extra\
  \ = {\n        \"example\": {\n            \"title\": \"FastAPI Book Launch\",\n\
  \            \"image\": \"https://linktomyimage.com/image.png\",\n            \"\
  description\": \"We will be discussing the contents of the FastAPI book in this\
  \ event. Ensure to come with your own copy to win gifts!\",\n            \"tags\"\
  : [\"python\", \"fastapi\", \"book\", \"launch\"],\n            \"location\": \"\
  Google Meet\"\n        }\n    }\n```\n\n在此代码块中，我们已将原始模型类修改为 SQL 表类。\n\n2. 让我们再添加一个\
  \ SQLModel 类，该类将在 UPDATE 操作期间用作 body 类型：\n\n```\nclass EventUpdate(SQLModel):\n\
  \    title: Optional[str]\n    image: Optional[str]\n    description: Optional[str]\n\
  \    tags: Optional[List[str]]\n    location: Optional[str]\n\nclass Config:\n \
  \   schema_extra = {\n        \"example\": {\n            \"title\": \"FastAPI Book\
  \ Launch\",\n            \"image\": \"https://linktomyimage.com/image.png\",\n \
  \           \"description\": \"We will be discussing the contents of the FastAPI\
  \ book in this event. Ensure to come with your own copy to win gifts!\",\n     \
  \       \"tags\": [\"python\", \"fastapi\", \"book\", \"launch\"],\n           \
  \ \"location\": \"Google Meet\"\n        }\n    }\n```\n\n3. 接下来，让我们在 `connection.py`\
  \ 中定义创建数据库和表的配置：\n\n```\nfrom sqlalchemy import SQLModel, Session, create_engine\n\
  from models.events import Event\n\ndatabase_file = \"planner.db\"\ndatabase_connection_string\
  \ = f\"sqlite:///{database_file}\"\nconnect_args = {\"check_same_thread\": False}\n\
  engine_url = create_engine(database_connection_string,\necho=True, connect_args=connect_args)\n\
  \ndef conn():\n    SQLModel.metadata.create_all(engine_url)\n\ndef get_session():\n\
  \    with Session(engine_url) as session:\n        yield session\n```\n\n在此代码块中，我们首先定义依赖项并导入表模型类。接下来，我们创建保存数据库文件位置的变量（如果不存在则会创建）、连接字符串以及\
  \ SQL 数据库实例。在 `conn()` 函数中，我们指示 SQLModel 创建数据库以及文件中存在的表 Events，并为在应用程序中持久化会话，定义了\
  \ `get_session()`。\n\n4. 接下来，让我们指示应用程序在启动时创建数据库。使用以下代码更新 `main.py`：\n\n```\nfrom\
  \ fastapi import FastAPI\nfrom fastapi.responses import RedirectResponse\nfrom database.connection\
  \ import conn\n\nfrom routes.users import user_router\nfrom routes.events import\
  \ event_router\n\nimport uvicorn\n\napp = FastAPI()\n\n#### Register routes\n\n\
  app.include_router(user_router, prefix=\"/user\")\napp.include_router(event_router,\
  \ prefix=\"/event\")\n\n@app.on_event(\"startup\")\ndef on_startup():\n    conn()\n\
  \n@app.get(\"/\")\nasync def home():\n    return RedirectResponse(url=\"/event/\"\
  )\n\nif __name__ == '__main__':\n    uvicorn.run(\"main:app\", host=\"0.0.0.0\"\
  , port=8080, reload=True)\n```\n\n数据库将在应用程序启动时创建。在启动事件中，我们调用了负责创建数据库的 `conn()` 函数。在终端启动应用程序，你应该在控制台看到输出，表明数据库以及表已成功创建：\n\
  \n![](img/85e42522e1d8d05fd8b981490d6d9056_113_0.png)\n\n图 6.1 – planner 数据库和 event\
  \ 表创建成功\n\n终端中显示的 SQL 命令是因为在创建数据库引擎时将 `echo` 设置为 True。现在我们已成功创建数据库，让我们更新事件的 CRUD\
  \ 操作路由以使用数据库。\n\n### 创建事件\n\n让我们看一下步骤：\n\n- 1. 在 `routes/events.py` 中，更新导入以包含 Event\
  \ 表模型类以及 `get_session()` 函数。导入 `get_session()` 函数是为了让路由能够访问创建的 session 对象：\n\n```\n\
  from fastapi import APIRouter, Depends, HTTPException,\nRequest, status\n\nfrom\
  \ database.connection import get_session\n\nfrom models.events import Event, EventUpdate\n\
  ```\n\n#### 什么是 Depends？\n\n`Depends` 类负责在 FastAPI 应用程序中执行依赖注入。`Depends` 类接受一个真值源例如函数作为参数，并作为路由的函数参数传递，要求在执行任何操作之前必须满足依赖条件。\n\
  \n2. 接下来，让我们更新负责创建新事件的 POST 路由函数 `create_event()`：\n\n```\n@event_router.post(\"\
  /new\")\nasync def create_event(new_event: Event,\n    session=Depends(get_session))\
  \ -> dict:\n    session.add(new_event)\n    session.commit()\n    session.refresh(new_event)\n\
  \n    return {\n        \"message\": \"Event created successfully\"\n    }\n```\n\
  \n在此代码块中，我们已指示执行数据库事务所需的 session 对象依赖于我们之前创建的 `get_session()` 函数。\n\n在函数体中，数据被添加到\
  \ session 中，然后提交到数据库，之后数据库会被刷新。\n\n3. 让我们测试路由以预览更改：\n\n```\n(venv)$ curl -X 'POST'\
  \ \\\n  'http://0.0.0.0:8080/event/new' \\\n  -H 'accept: application/json' \\\n\
  \  -H 'Content-Type: application/json' \\\n  -d '{\n\"title\": \"FastAPI Book Launch\"\
  ,\n\"image\": \"fastapi-book.jpeg\",\n\"description\": \"We will be discussing the\
  \ contents of the FastAPI book in this event. Ensure to come with your own copy\
  \ to win gifts!\",\n\"tags\": [\n    \"python\",\n    \"fastapi\",\n    \"book\"\
  ,\n    \"launch\"\n],\n\"location\": \"Google Meet\"\n}'\n```\n\n返回成功的响应：\n\n```\n\
  {\n  \"message\": \"Event created successfully\"\n}\n```\n\n如果操作执行失败，库将抛出异常。\n\n\
  ### 读取事件\n\n让我们更新获取事件列表的 GET 路由，使其从数据库中提取数据：\n\n```\n@event_router.get(\"/\", response_model=List[Event])\n\
  async def retrieve_all_events(session=Depends(get_session)) -> List[Event]:\n  \
  \  statement = select(Event)\n    events = session.exec(statement).all()\n    return\
  \ events\n```\n\n同样，通过 ID 检索时显示事件数据的路由也已更新：\n\n```\n@event_router.get(\"/{id}\"\
  , response_model=Event)\nasync def retrieve_event(id: int, session=Depends(get_session))\
  \ -> Event:\n    event = session.get(Event, id)\n    if event:\n        return event\n\
  \    raise HTTPException(\n        status_code=status.HTTP_404_NOT_FOUND,\n    \
  \    detail=\"Event with supplied ID does not exist\"\n```\n\n\n\n)\n\nraise HTTPException(\n\
  \    status_code=status.HTTP_404_NOT_FOUND,\n    detail=\"Event with supplied ID\
  \ does not exist\"\n)\n```\n\n两个路由的响应模型都已设置为模型类。让我们先通过发送 GET 请求来检索事件列表来测试这两个路由：\n\
  \n```\n(venv)$ curl -X 'GET' \\\n'http://0.0.0.0:8080/event/' \\\n-H 'accept: application/json'\n\
  ```\n\n我们得到响应：\n\n```\n[\n  {\n    \"id\": 1,\n    \"title\": \"FastAPI Book Launch\"\
  ,\n    \"image\": \"fastapi-book.jpeg\",\n    \"description\": \"We will be discussing\
  \ the contents of the FastAPI book in this event.Ensure to come with your own copy\
  \ to win gifts!\",\n    \"tags\": [\n      \"python\",\n      \"fastapi\",\n   \
  \   \"book\",\n      \"launch\"\n    ],\n    \"location\": \"Google Meet\"\n  }\n\
  ]\n```\n\n接下来，让我们通过 ID 检索事件：\n\n```\n(venv)$ curl -X 'GET' \\\n'http://0.0.0.0:8080/event/1'\
  \ \\\n-H 'accept: application/json'\n```\n\n```\n}\n{\n  \"id\": 1,\n  \"title\"\
  : \"FastAPI Book Launch\",\n  \"image\": \"fastapi-book.jpeg\",\n  \"description\"\
  : \"The launch of the FastAPI book will hold on xyz.\",\n  \"tags\": [\n    \"python\"\
  ,\n    \" fastapi\"\n  ],\n  \"location\": \"virtual\"\n}\n```\n\nREAD 操作成功实现后，让我们为应用程序添加编辑功能。\n\
  \n### 更新事件\n\n让我们在 routes/events.py 中添加 UPDATE 路由：\n\n```\n@event_router.put(\"\
  /edit/{id}\", response_model=Event)\nasync def update_event(id: int, new_data: EventUpdate,\
  \ session=Depends(get_session)) -> Event:\n```\n\n在函数体中，添加以下代码块以检索现有事件并处理事件更改：\n\
  \n```\nevent = session.get(Event, id)\nif event:\n    event_data = new_data.dict(exclude_unset=True)\n\
  \    for key, value in event_data.items():\n        setattr(event, key, value)\n\
  \    session.add(event)\n    session.commit()\n    session.refresh(event)\n\n  \
  \  return event\nraise HTTPException(\n```\n\n```\nstatus_code=status.HTTP_404_NOT_FOUND,\n\
  \    detail=\"Event with supplied ID does not exist\"\n)\n```\n\n在前面的代码块中，我们在继续更新事件数据之前检查事件是否存在。事件更新后，将返回更新后的数据。让我们更新现有文章的标题：\n\
  \n```\n(venv)$ curl -X 'PUT' \\\n  'http://0.0.0.0:8080/event/edit/1' \\\n  -H 'accept:\
  \ application/json' \\\n  -H 'Content-Type: application/json' \\\n  -d '{\n    \"\
  title\": \"Packt\\'s FastAPI book launch II\"\n}'\n{\n  \"id\": 1,\n  \"title\"\
  : \"Packt's FastAPI book launch II\",\n  \"image\": \"fastapi-book.jpeg\",\n  \"\
  description\": \"The launch of the FastAPI book will hold on xyz.\",\n  \"tags\"\
  : [\"python\", \"fastapi\"],\n  \"location\": \"virtual\" }\n```\n\n现在我们已经添加了更新功能，让我们在下一节中快速添加删除操作。\n\
  \n### 删除事件\n\n在 events.py 中，更新之前定义的删除路由：\n\n```\n@event_router.delete(\"/delete/{id}\"\
  )\nasync def delete_event(id: int, session=Depends(get_session)) -> dict:\n    event\
  \ = session.get(Events, id)\n    if event:\n        session.delete(event)\n```\n\
  \n```\nsession.commit()\n\nreturn {\n    \"message\": \"Event deleted successfully\"\
  \n}\n\nraise HTTPException(\n    status_code=status.HTTP_404_NOT_FOUND,\n    detail=\"\
  Event with supplied ID does not exist\"\n)\n```\n\n在此代码块中，函数检查是否提供了 ID 的事件存在，然后将其从数据库中删除。操作执行后，将返回成功消息，如果事件不存在则抛出异常。让我们从数据库中删除该事件：\n\
  \n```\n(venv)$ curl -X 'DELETE' \\\n'http://0.0.0.0:8080/event/delete/1' \\\n-H\
  \ 'accept: application/json'\n```\n\n请求返回成功响应：\n\n```\n{\n    \"message\": \"Event\
  \ deleted successfully\"\n}\n```\n\n现在，如果我们检索事件列表，我们会得到一个空数组作为响应：\n\n```\n(venv)$\
  \ curl -X 'GET' \\\n'http://0.0.0.0:8080/event/' \\\n-H 'accept: application/json'\n\
  []\n```\n\n我们已使用 SQLModel 成功将 SQL 数据库集成到应用程序中，并实现了 CRUD 操作。在学习如何在 MongoDB 中实现 CRUD\
  \ 操作之前，让我们提交对应用程序所做的更改：\n\n```\n(venv)$ git add .\n(venv)$ git commit -m \"[Feature]\
  \ Incorporate a SQL database and implement CRUD operations \"\n```\n\n切换回 main 分支：\n\
  \n```\n(venv)$ git checkout main\n```\n\n现在你已返回到应用程序的原始版本，让我们在下一节中将 MongoDB 作为数据库平台并实现\
  \ CRUD 操作。\n\n### 设置 MongoDB\n\n有许多库允许我们将 MongoDB 集成到 FastAPI 应用程序中。然而，我们将使用 Beanie，一个异步对象文档映射器\
  \ ODM 库，来从应用程序执行数据库操作。\n\n让我们通过运行以下命令安装 beanie 库：\n\n```\n(venv)$ pip install beanie\n\
  ```\n\n在深入集成之前，让我们先查看 Beanie 库中的一些方法，以及本节中数据库表是如何创建的。\n\n#### Document\n\n在 SQL\
  \ 中，存储在行和列中的数据包含在表中。在 NoSQL 数据库中，它被称为文档。文档表示数据将在数据库集合中如何存储。文档的定义方式与 Pydantic 模型定义相同，只是继承自\
  \ Beanie 库的 Document 类而不是。\n\n一个示例文档定义如下：\n\n```\nfrom beanie import Document\n\n\
  class Event(Document):\n    name: str\n    location: str\n\n    class Settings:\n\
  \        name = \"events\"\n```\n\nSettings 子类用于告诉库在 MongoDB 数据库中创建传递的集合名称。\n\n\
  现在我们知道了如何创建文档，让我们来看一下用于执行 CRUD 操作的方法：\n\n- `.insert()` 和 `.create()`：`.insert()`\
  \ 和 `.create()` 方法由文档实例调用以在数据库中创建新记录。你也可以选择使用 `.insert_one()` 方法向数据库添加单个条目。\n\n\
  要将多个条目插入数据库，调用 `.insert_many()` 方法，该方法接受文档实例的列表，如下所示：\n\n```\nevent = Event(name=\"\
  Packt office launch\",\nlocation=\"Hybrid\")\nawait event.create()\nawait Event.insert_one(event)\n\
  ```\n\n- `.find()` 和 `.get()`：`.find()` 方法用于查找与作为方法参数传递的搜索条件匹配的文档列表。`.get()` 方法用于检索与所提供\
  \ ID 匹配的单个文档。可以使用 `.find_one()` 方法找到与搜索条件匹配的单个文档，如下所示：\n\n```\nevent = await Event.get(\"\
  74478287284ff\")\nevent = await Event.find(Event.location == \"Hybrid\").to_list()\
  \ # 返回匹配项的列表\nevent = await.find_one(Event.location == \"Hybrid\") # 返回单个事件\n```\n\
  \n- `.save()`、`.update()` 和 `.upsert()`：要更新文档，可以使用这些方法中的任何一种。`.update()` 方法接受更新查询，而\
  \ `.upsert()` 方法用于在文档不匹配搜索条件时使用。在本章中，我们将使用 `.update()` 方法。更新查询是 MongoDB 数据库遵循的指令，如下所示：\n\
  \n```\nevent = await Event.get(\"74478287284ff\")\nupdate_query = {\"$set\": {\"\
  location\": \"virtual\"}}\nawait event.update(update_query)\n```\n\n在此代码块中，我们首先检索事件，然后创建更新查询以将事件集合中的\
  \ `location` 字段设置为 `virtual`。\n\n- `.delete()`：此方法负责从数据库中删除文档记录，如下所示：\n\n```\nevent\
  \ = await Event.get(\"74478287284ff\")\nawait event.delete()\n```\n\n现在我们已经了解了 Beanie\
  \ 库中包含的方法的工作原理，让我们在事件规划应用程序中初始化数据库，定义我们的文档并实现 CRUD 操作。\n\n#### 初始化数据库\n\n让我们来看一下步骤：\n\
  \n- 1. 在 database 文件夹中，创建 connection.py 文件：\n\n```\n(venv)$ touch connection.py\n\
  ```\n\nPydantic 使我们能够通过创建 BaseSettings 父类的子类的读取环境变量。在构建 Web API 时，将配置变量存储在环境文件中是标准做法。\n\
  \n- 2. 在 connection.py 中，添加以下内容：\n\n```\nfrom beanie import init_beanie\nfrom motor.motor_asyncio\
  \ import AsyncIOMotorClient\nfrom typing import Optional\nfrom pydantic import BaseSettings\n\
  \nclass Settings(BaseSettings):\n    DATABASE_URL: Optional[str] = None\n\nasync\
  \ def initialize_database(self):\n    client = AsyncIOMotorClient(self.DATABASE_URL)\n\
  \    await init_beanie(\n        database=client.get_default_database(),\n     \
  \               document_models=[])\n\nclass Config:\n    env_file = \".env\"\n\
  ```\n\n\n\n在该代码块中，我们首先导入初始化数据库所需的依赖项。然后，我们定义 Settings 类，它具有 DATABASE_URL 值，该值从 Config\
  \ 子类中定义的 env_file 环境中读取。我们还定义了 initialize_database 方法来初始化数据库。\n\ninit_beanie 方法接收数据库客户端，即在\
  \ SQLModel 部分中创建的引擎的 mongo 版本，以及文档列表。\n\n3. 让我们更新 models 目录中的模型文件以包含 MongoDB 文档。在\
  \ models/events.py 中，用以下内容替换内容：\n\n```\nfrom beanie import Document\nfrom typing\
  \ import Optional, List\n\nclass Event(Document):\n    title: str\n    image: str\n\
  \    description: str\n    tags: List[str]\n    location: str\n\nclass Config:\n\
  \    schema_extra = {\n        \"example\": {\n            \"title\": \"FastAPI\
  \ Book Launch\",\n            \"image\": \"https://linktomyimage.com/image.png\"\
  ,\n            \"description\": \"We will be discussing the contents of the FastAPI\
  \ book in this event. Ensure to come with your own copy to win gifts!\",\n     \
  \       \"tags\": [\"python\", \"fastapi\", \"book\", \"launch\"],\n           \
  \ \"location\": \"Google Meet\"\n        }\n    }\n```\n\n```\nclass Settings:\n\
  \    name = \"events\"\n```\n\n4. 让我们为 UPDATE 操作创建一个 Pydantic 模型：\n\n```\nclass\
  \ EventUpdate(BaseModel):\n    title: Optional[str]\n    image: Optional[str]\n\
  \    description: Optional[str]\n    tags: Optional[List[str]]\n    location: Optional[str]\n\
  \nclass Config:\n    schema_extra = {\n        \"example\": {\n            \"title\"\
  : \"FastAPI Book Launch\",\n            \"image\": \"https://linktomyimage.com/image.png\"\
  ,\n            \"description\": \"We will be discussing the contents of the FastAPI\
  \ book in this event. Ensure to come with your own copy to win gifts!\",\n     \
  \       \"tags\": [\"python\", \"fastapi\", \"book\", \"launch\"],\n           \
  \ \"location\": \"Google Meet\"\n        }\n    }\n```\n\n5. 在 model/users.py 中，用以下内容替换文件内容：\n\
  \n```\nfrom typing import Optional, List\nfrom beanie import Document, Link\n\n\
  from pydantic import BaseModel, EmailStr\n\nfrom models.events import Event\n```\n\
  \n```\nclass User(Document):\n    email: EmailStr\n    password: str\n    events:\
  \ Optional[List[Link[Event]]]\n\n    class Settings:\n        name = \"users\"\n\
  \n    class Config:\n        schema_extra = {\n            \"example\": {\n    \
  \            \"email\": \"fastapi@packt.com\",\n                \"password\": \"\
  strong!!!\",\n                \"events\": [],\n            }\n        }\n\nclass\
  \ UserSignIn(BaseModel):\n    email: EmailStr\n    password: str\n```\n\n6. 现在我们已经定义了文档，让我们更新\
  \ connection.py 中的 document_models 字段：\n\n```\nfrom models.users import User\nfrom\
  \ models.events import Event\n\nasync def initialize_database(self):\n    client\
  \ = AsyncIOMotorClient(self.DATABASE_URL)\n    await init_beanie(\n        database=client.get_default_database(),\n\
  \        document_models=[Event, User])\n```\n\n7. 最后，让我们创建一个环境文件 .env，并添加数据库 URL\
  \ 以完成数据库初始化阶段：\n\n```\n(venv)$ touch .env\n(venv)$ echo DATABASE_URL=mongodb://localhost:27017/planner\
  \ >> .env\n```\n\n现在我们已成功添加初始化数据库的代码块，让我们继续实现 CRUD 操作的方法。\n\n### CRUD 操作\n\n在 connection.py\
  \ 中，创建一个新的 Database 类，该类在初始化期间接收模型作为参数：\n\n```\nfrom pydantic import BaseSettings,\
  \ BaseModel\nfrom typing import Any, List, Optional\n\nclass Database:\n    def\
  \ __init__(self, model):\n        self.model = model\n```\n\n在初始化期间传递的模型是 Event\
  \ 或 User 文档模型类。\n\n#### Create\n\n让我们在 Database 类下创建一个方法来向数据库集合添加记录：\n\n```\nasync\
  \ def save(self, document) -> None:\n    await document.create()\n    return\n```\n\
  \n在此代码块中，我们定义了 save 方法以接收文档，该文档将在 Database 实例实例化时传递给 Database 实例的文档实例。\n\n#### Read\n\
  \n让我们创建方法来检索数据库记录或数据库集合中存在的所有记录：\n\n```\nasync def get(self, id: PydanticObjectId)\
  \ -> Any:\n    doc = await self.model.get(id)\n    if doc:\n        return doc\n\
  ```\n\n```\nreturn False\n\nasync def get_all(self) -> List[Any]:\n    docs = await\
  \ self.model.find_all().to_list()\n    return docs\n```\n\n第一个方法 get() 将 ID 作为方法参数并返回数据库中对应的记录，而\
  \ get_all() 方法不带参数并返回数据库中存在的所有记录的列表。\n\n#### Update\n\n让我们创建处理更新现有记录过程的方法：\n\n```\n\
  async def update(self, id: PydanticObjectId, body: BaseModel) -> Any:\n    doc_id\
  \ = id\n    des_body = body.dict()\n    des_body = {k:v for k,v in des_body.items()\
  \ if v is not None}\n    update_query = {\"$set\": {\n        field: value for field,\
  \ value in des_body.items()\n    }}\n\n    doc = await self.get(doc_id)\n    if\
  \ not doc:\n        return False\n    await doc.update(update_query)\n    return\
  \ doc\n```\n\n在此代码块中，update 方法接收 ID 和负责的 Pydantic 模式，该模式将包含客户端通过 PUT 请求发送的更新字段。更新的请求体首先解析为字典，然后过滤以删除\
  \ None 值。完成此操作后，它将被插入到更新查询中，然后由 Beanie 的 update() 方法执行。\n\n#### Delete\n\n最后，让我们创建一个方法来从数据库中删除记录：\n\
  \n```\nasync def delete(self, id: PydanticObjectId) -> bool:\n    doc = await self.get(id)\n\
  \    if not doc:\n        return False\n    await doc.delete()\n    return True\n\
  ```\n\n在此代码块中，该方法在从数据库中删除之前检查记录是否存在。\n\n现在我们已在数据库文件中填充了执行 CRUD 操作所需的方法，让我们也更新路由。\n\
  \n### routes/events.py\n\n让我们首先更新导入并创建数据库实例：\n\n```\nfrom beanie import PydanticObjectId\n\
  from fastapi import APIRouter, HTTPException, status\nfrom database.connection import\
  \ Database\n\nfrom models.events import Event\nfrom typing import List\nevent_database\
  \ = Database(Event)\n```\n\n导入和数据库实例就位后，让我们更新所有路由。首先更新 GET 路由：\n\n```\n@event_router.get(\"\
  /\", response_model=List[Event])\nasync def retrieve_all_events() -> List[Event]:\n\
  \    events = await event_database.get_all()\n    return events\n\n@event_router.get(\"\
  /{id}\", response_model=Event)\nasync def retrieve_event(id: PydanticObjectId) ->\
  \ Event:\n    event = await event_database.get(id)\n    if not event:\n```\n\n```\n\
  raise HTTPException(\n    status_code=status.HTTP_404_NOT_FOUND,\n    detail=\"\
  Event with supplied ID does not exist\"\n)\nreturn event\n```\n\n在 GET 路由中，我们正在调用我们在数据库文件中之前定义的方法。让我们更新\
  \ POST 路由：\n\n```\n@event_router.post(\"/new\")\nasync def create_event(body: Event)\
  \ -> dict:\n    await event_database.save(body)\n    return {\n        \"message\"\
  : \"Event created successfully\"\n    }\n```\n\n让我们创建 UPDATE 路由：\n\n```\n@event_router.put(\"\
  /{id}\", response_model=Event)\nasync def update_event(id: PydanticObjectId, body:\
  \ EventUpdate) -> Event:\n    updated_event = await event_database.update(id, body)\n\
  \    if not updated_event:\n        raise HTTPException(\n            status_code=status.HTTP_404_NOT_FOUND,\n\
  \            detail=\"Event with supplied ID does not exist\"\n        )\n    return\
  \ updated_event\n```\n\n最后，让我们更新 DELETE 路由：\n\n```\n@event_router.delete(\"/{id}\"\
  )\nasync def delete_event(id: PydanticObjectId) -> dict:\n    event = await event_database.delete(id)\n\
  \    if not event:\n        raise HTTPException(\n            status_code=status.HTTP_404_NOT_FOUND,\n\
  \            detail=\"Event with supplied ID does not exist\"\n        )\n```\n\n\
  \n\n\n\n```\nreturn {\n    \"message\": \"Event deleted successfully.\"\n}\n```\n\
  \n现在我们已经为事件路由实现了 CRUD 操作，让我们来实现用户注册和用户登录的路由。\n\n### routes/users.py\n\n让我们先更新导入并创建数据库实例：\n\
  \n```\nfrom fastapi import APIRouter, HTTPException, status\nfrom database.connection\
  \ import Database\n\nfrom models.users import User, UserSignIn\n\nuser_router =\
  \ APIRouter(\n    tags=[\"User\"],\n)\n\nuser_database = Database(User)\n```\n\n\
  接下来，更新用于注册新用户的 POST 路由：\n\n```\n@user_router.post(\"/signup\")\nasync def sign_user_up(user:\
  \ User) -> dict:\n    user_exist = await User.find_one(User.email == user.email)\n\
  \    if user_exist:\n        raise HTTPException(\n            status_code=status.HTTP_409_CONFLICT,\n\
  \            detail=\"User with email provided exists already.\"\n        )\n  \
  \  await user_database.save(user)\n    return {\n        \"message\": \"User created\
  \ successfully\"\n    }\n```\n\n在这个代码块中，我们在将用户添加到数据库之前检查是否存在使用传入电子邮件的用户。让我们添加用户登录的路由：\n\
  \n```\n@user_router.post(\"/signin\")\nasync def sign_user_in(user: UserSignIn)\
  \ -> dict:\n    user_exist = await User.find_one(User.email ==\n    user.email)\n\
  \    if not user_exist:\n        raise HTTPException(\n            status_code=status.HTTP_404_NOT_FOUND,\n\
  \            detail=\"User with email does not exist.\"\n        )\n    if user_exist.password\
  \ == user.password:\n        return {\n            \"message\": \"User signed in\
  \ successfully.\"\n        }\n    raise HTTPException(\n        status_code=status.HTTP_401_UNAUTHORIZED,\n\
  \        detail=\"Invalid details passed.\"\n    )\n```\n\n在这个定义的路由中，我们首先检查用户是否存在，然后再检查其凭据的有效性。这里使用的身份验证方法很基础，不建议在生产环境中使用。我们将在下一章中了解正确的身份验证流程。\n\
  \n现在我们已经实现了路由，让我们启动 MongoDB 实例以及我们的应用程序。创建一个文件夹来存放我们的 MongoDB 数据库并启动 MongoDB 实例：\n\
  \n```\n(venv) $ mkdir store\n(venv) $ mongod --dbpath store\n```\n\n接下来，在另一个窗口中启动应用程序：\n\
