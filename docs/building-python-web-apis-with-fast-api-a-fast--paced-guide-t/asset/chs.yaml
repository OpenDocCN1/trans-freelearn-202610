  \n```\n(venv)$ curl -X 'POST' \\\n  'http://0.0.0.0:8080/user/signup' \\\n  -H 'accept:\
  \ application/json' \\\n  -H 'Content-Type: application/json' \\\n  -d '{\n  \"\
