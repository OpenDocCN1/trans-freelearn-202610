- "### 8\nTesting FastAPI Applications\n\n在上一章中，我们学习了如何使用 OAuth 和 JSON Web Token（JWT）保护\
  \ FastAPI 应用程序。我们成功实现了一个身份验证系统并了解了依赖注入是什么。我们还学习了如何将依赖项注入到我们的路由中以限制未经授权的访问和操作。我们已成功构建了一个具有数据库支持的、能够轻松执行\
  \ CRUD 操作的安全 Web API。在本章中，我们将学习什么是测试以及如何编写测试以确保我们的应用程序按预期运行。\n\n测试是应用程序开发周期的一个组成部分。应用程序测试是为了确保应用程序的正确运行状态，并在部署到生产环境之前轻松检测应用程序中的异常。虽然我们在过去几章中手动测试了应用程序的端点，但我们将学习如何自动化这些测试。\n\
  \n到本章结束时，您将能够为 FastAPI 应用程序路由编写测试。本章将解释什么是单元测试以及如何在应用程序路由上执行单元测试。本章将涵盖以下主题：\n\n\
  - Unit testing with pytest\n- Setting up our test environment\n- Writing tests for\
  \ REST API endpoints\n- Test coverage\n\n### Technical requirements\n\n对于本章，您需要在本地机器上运行一个\
  \ MongoDB 服务器。应遵循第 6 章《Connecting to a Database》中概述的步骤来启动并运行您的数据库服务器。\n\n本章使用的代码可以在\
  \ https://github.com/PacktPublishing/Building-Python-Web-APIs-with-FastAPI/tree/main/ch08/planner\
  \ 找到。\n\n### Unit testing with pytest\n\n单元测试是一种测试程序，其中应用程序的各个组件被测试。这种形式的测试使我们能够验证各个组件的工作能力。例如，单元测试用于测试应用程序中的各个路由以确保返回适当的响应。\n\
  \n在本章中，我们将使用 pytest，这是一个 Python 测试库，来进行我们的单元测试操作。虽然 Python 附带了一个名为 unittest 的内置单元测试库，但\
  \ pytest 库具有更短的语法，并且更受青睐用于测试应用程序。让我们安装 pytest 并编写我们的第一个示例测试。\n\n让我们安装 pytest 库：\n\
  \n```\n(venv)$ pip install pytest\n```\n\n接下来，创建一个名为 tests 的文件夹来容纳应用程序的测试文件：\n\n\
  ```\n(venv)$ mkdir tests && cd\n(venv)$ touch __init__.py\n```\n\n在创建时，单个测试文件名将以\
  \ test_ 为前缀。这将使 pytest 库能够识别并运行测试文件。让我们在新创建的 tests 目录中创建一个测试文件来检查加法、减法、乘法和除法算术运算的正确性：\n\
  \n```\n(venv)$ touch test_arithmetic_operations.py\n```\n\n\n\n\n让我们先定义执行算术运算的函数。在\
  \ tests 文件中，添加以下内容：\n\n```\ndef add(a: int , b: int) -> int:\n    return a + b\n\
  \ndef subtract(a: int, b: int) -> int:\n    return b - a\n\ndef multiply(a: int,\
  \ b: int) -> int:\n    return a * b\n\ndef divide(a: int, b: int) -> int:\n    return\
  \ b // a\n```\n\n现在我们已经定义了要测试的运算，接下来我们将创建处理这些测试的函数。在测试函数中，要执行的运算会被定义。`assert` 关键字用于验证左侧的输出是否与右侧运算的输出相对应。在我们的例子中，我们将测试算术运算是否等于其各自的结果。\n\
  \n将以下内容添加到 tests 文件中：\n\n```\ndef test_add() -> None:\n    assert add(1, 1) == 2\n\
  \ndef test_subtract() -> None:\n    assert subtract(2, 5) == 3\n\ndef test_multiply()\
  \ -> None:\n    assert multiply(10, 10) == 100\n\ndef test_divide() -> None:\n \
  \   assert divide(25, 100) == 4\n```\n\n> 提示\n> 标准做法是将将被测试的函数定义在外部位置（在我们的例子中是 add()、subtract()\
  \ 等）。然后导入此文件，并在测试函数中调用要测试的函数。\n\n有了测试函数，我们就可以运行测试文件了。测试可以通过运行 pytest 命令来执行。但是，此命令会运行文件夹中包含的所有测试文件。要执行单个测试，将测试文件名作为参数传递。让我们运行测试文件：\n\
  \n```\n(venv)$ pytest test_arithmetic_operations.py\n```\n\n所有定义的测试都已通过。这由绿色响应表示：\n\
  \n![](img/85e42522e1d8d05fd8b981490d6d9056_168_0.png)\n\n图 8.1 – 对算术运算进行的单元测试结果\n\
  \n失败的测试以及失败点会以红色突出显示。例如，假设我们按如下方式修改 test_add() 函数：\n\n```\ndef test_add() -> None:\n\
  \    assert add(1, 1) == 11\n```\n\n在下图中，失败的测试以及失败点以红色突出显示。\n\n![](img/85e42522e1d8d05fd8b981490d6d9056_169_0.png)\n\
  \n图 8.2 – 失败的测试\n\n测试在 assert 语句处失败，其中正确结果 2 被显示。\n\n失败被总结为 AssertionError，这告诉我们测试由于传递了错误的断言（2\
  \ == 1）而失败。\n\n现在我们对 pytest 的工作原理有了一定的了解，让我们来看看 pytest 中的 fixtures。\n\n### 使用 pytest\
  \ fixtures 消除重复\n\nFixtures 是可重用的函数，用于返回测试函数所需的数据。\n\nFixtures 使用 pytest.fixture\
  \ 装饰器进行装饰。fixture 的一个示例用例是返回应用程序实例以执行 API 端点的测试。\n\nfixture 可用于定义应用程序客户端，该客户端返回并在测试函数中使用，从而无需在每个测试中重新定义应用程序实例。我们将在\
  \ 编写 REST API 端点的测试 部分看到其用法。\n\n让我们看一个例子：\n\n```\nimport pytest\n\nfrom models.events\
  \ import EventUpdate\n```\n\n```\n#### Fixture is defined.\n@ pytest.fixture\ndef\
  \ event() -> EventUpdate:\n    return EventUpdate(\n        title=\"FastAPI Book\
  \ Launch\",\n        image=\"https://packt.com/fastapi.png\",\n        description=\"\
  We will be discussing the contents of the FastAPI book in this event.Ensure to come\
  \ with your own copy to win gifts!\",\n        tags=[\"python\", \"fastapi\", \"\
  book\", \"launch\"],\n        location=\"Google Meet\"\n    )\n\ndef test_event_name(event:\
  \ EventUpdate) -> None:\n    assert event.title == \"FastAPI Book Launch\"\n```\n\
  \n在前面的代码块中，我们定义了一个返回 EventUpdate pydantic 模型实例的 fixture。此 fixture 作为 test_event_name\
  \ 函数的参数传递，使其属性可访问。\n\nfixture 装饰器可以可选地接受参数。其中一个参数是 scope – fixture 的作用域告诉 pytest\
  \ fixture 函数的持续时间。在本章中，我们将使用两种作用域：\n\n- session：此作用域告诉 pytest 在整个测试会话中仅实例化一次函数。\n\
  - module：此作用域指示 pytest 仅在测试文件执行时执行一次附加的函数。\n\n现在我们知道了 fixture 是什么，让我们在下一节中设置我们的测试环境。\n\
  \n### 设置我们的测试环境\n\n在上一节中，我们学习了测试的基础知识以及 fixtures 是什么。我们现在将测试 CRUD 操作以及用户身份验证的端点。为了测试我们的异步\
  \ API，我们将使用 httpx 并安装 pytest-asyncio 库以使我们能够测试我们的异步 API。\n\n安装额外的库：\n\n```\n(venv)$\
  \ pip install httpx pytest-asyncio\n```\n\n接下来，我们将创建一个名为 pytest.ini 的配置文件。向其中添加以下代码：\n\
  \n```\n[pytest]\nasyncio_mode = True\n```\n\n配置文件在运行 pytest 时被读取。这会自动使 pytest 以异步模式运行所有测试。\n\
  \n有了配置文件，让我们创建 umbrella 测试文件 conftest.py，它将负责创建测试文件所需的应用程序实例。在 tests 文件夹中，创建 conftest\
  \ 文件：\n\n```\n(venv)$ touch tests/conftest.py\n```\n\n我们将首先将所需的依赖项导入 conftest.py：\n\
  \n```\nimport asyncio\nimport httpx\nimport pytest\n\nfrom main import app\nfrom\
  \ database.connection import Settings\nfrom models.events import Event\nfrom models.users\
  \ import User\n```\n\n在前面的代码块中，我们导入了 asyncio、httpx 和 pytest 模块。asyncio 模块将用于创建一个活动的循环会话，以确保测试在单个线程上运行以避免冲突。httpx\
  \ 测试将充当进行 HTTP CRUD 操作的异步客户端。pytest 库用于定义 fixtures。\n\n我们还导入了应用程序实例 app，以及 models\
  \ 和 Settings 类。让我们定义循环会话 fixture：\n\n```\n@pytest.fixture(scope=\"session\")\ndef\
  \ event_loop():\n    loop = asyncio.get_event_loop()\n    yield loop\n    loop.close()\n\
  ```\n\n有了这个，让我们从 Settings 类创建一个新的数据库实例：\n\n```\nasync def init_db():\n    test_settings\
  \ = Settings()\n    test_settings.DATABASE_URL =\n    \"mongodb://localhost:27017/testdb\"\
  \n\n    await test_settings.initialize_database()\n```\n\n在前面的代码块中，我们定义了一个新的 DATABASE_URL，以及调用了第\
  \ 6 章《连接到数据库》中定义的初始化函数。我们现在使用的是一个新的数据库 testdb。\n\n最后，让我们定义默认客户端 fixture，它返回通过 httpx\
  \ 异步运行的应用程序实例：\n\n```\n@pytest.fixture(scope=\"session\")\nasync def default_client():\n\
  \    await init_db()\n    async with httpx.AsyncClient(app=app,\n    base_url=\"\
  http://app\") as client:\n        yield client\n        # Clean up resources\n \
  \       await Event.find_all().delete()\n        await User.find_all().delete()\n\
  ```\n\n在前面的代码块中，首先初始化数据库，然后将应用程序作为 AsyncClient 启动，并在整个测试会话期间保持活动状态。在测试会话结束时，event\
  \ 和 user 集合将被清除，以确保每次测试运行前数据库为空。\n\n在本节中，您已了解设置测试环境所涉及的步骤。在下一节中，您将了解为应用程序中创建的每个端点编写测试的过程。\n\
  \n### 为 REST API 端点编写测试\n\n一切就绪后，让我们创建 test_login.py 文件，在其中测试身份验证路由：\n\n```\n(venv)$\
  \ touch tests/test_login.py\n```\n\n在测试文件中，我们将首先导入依赖项：\n\n```\nimport httpx\nimport\
  \ pytest\n```\n\n#### 测试注册路由\n\n我们将测试的第一个端点是注册端点。我们将添加 pytest.mark.asyncio 装饰器，告知\
  \ pytest 将其视为异步测试。让我们定义函数和请求负载：\n\n```\n@pytest.mark.asyncio\nasync def test_sign_new_user(default_client:\
  \ httpx.AsyncClient) -> None:\n    payload = {\n        \"email\": \"testuser@packt.com\"\
  ,\n        \"password\": \"testpassword\",\n    }\n```\n\n让我们定义请求头和预期响应：\n\n```\n\
  headers = {\n    \"accept\": \"application/json\",\n    \"Content-Type\": \"application/json\"\
