  \n在运行此测试之前，让我们先暂时注释掉 conftest.py 中删除用户数据的那一行，因为它会导致经过身份验证的测试失败：\n\n```\n##### await\
  \ User.find_all().delete()\n```\n\n从你的终端启动 MongoDB 服务器并运行测试：\n\n```\n(venv)$ pytest\
  \ tests/test_login.py\n```\n\n注册路由已成功测试：\n\n![](img/85e42522e1d8d05fd8b981490d6d9056_174_0.png)\n\
  \n图 8.3 – 注册路由的成功测试运行\n\n让我们继续编写登录路由的测试。在此期间，你可以快速调整测试响应，看看测试是否会失败！\n\n### 测试登录路由\n\
