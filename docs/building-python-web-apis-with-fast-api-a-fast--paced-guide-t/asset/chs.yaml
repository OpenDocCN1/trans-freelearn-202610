  \n接下来，让我们编写创建新事件的测试函数。\n\n### 测试 CREATE 端点\n\n我们将首先定义函数并从之前创建的 fixture 中获取访问令牌。我们将创建将发送到服务器的请求负载、将包含内容类型以及授权头值的请求头。测试响应也将被定义，然后发起请求并比较响应。添加以下代码：\n\
