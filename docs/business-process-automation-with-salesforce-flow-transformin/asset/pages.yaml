- pgno: 73
  md: 'To view Flows in Salesforce, click on **New Flows** and **All + Templates**,
    as shown in Figure 6.1.


    The **Core** tab will show you the basic flow, but the following view (**All +
    Templates**) will provide you with basic flows, as well as all the templates provided
    by Salesforce or third-party vendors via AppExchange. Explore various templates
    available out of the box, and see how they are developed. It’s good practice to
    explore, understand, and repurpose these templates to cut down your development
    time.


    ![](img/0c5ea2dc593e6f900cb4283ebfb6bf02_73_0.png)


    Figure 6.1 - The five basic flow types


    Now, let’s go through each of these flow types with examples in detail. To create
    a specific flow type, select the flow and click on **Create**.


    # Screen flow


    Screen flows help us enable functionality, where users are able to perform their
    business processes interactively via the Salesforce interface, which enables an
    excellent user experience. These screen flows can be enabled via quick actions
    or from lightning pages.


    Here are the steps to create a screen flow:


    +   1. Create a screen flow using the Flow Builder tool.

    +   2. Add elements – data, logical, and screen elements – based on your requirements.

    +   3. Add resources that you plan to use on the canvas, such as variables, screen
    components, and elements.

    +   4. Connect these elements manually when using the free-form style on the canvas,
    whereas, in auto-layout, they are connected automatically as you add the elements
    to the screen layout. Play around, and pick the element that suits your taste.'
  merge: -1
  img_proc: true
