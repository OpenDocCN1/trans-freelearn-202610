  md: 'Making a custom object private via OWD will create a sharing object called
    <Custom Object>__Share. In our scenario, it will be Contact_Sensitive_Info__Share.


    <Object>__Share objects are not visible for the Salesforce UI; we need to access
    them via the Developer Console. See Figure 7.4.


    ![](img/0c5ea2dc593e6f900cb4283ebfb6bf02_105_0.png)


    Figure 7.4 – Contact_Sensitive_Info_Share object – the user in this table gets
    access to a record


    To open the Developer Console, click on the gear icon in the right-top corner
    and select Developer Console. In the Query Editor, I added the following query
    to see the results from the Contact_Sensitive_Info__Share object:


    ```

    SELECT Id, ParentId, UserOrGroupId, AccessLevel, RowCause FROM

    Contact_Sensitive_Info__Share

    ```


    Our Apex sharing reason label will be captured in the RowCause field. This way,
    technical team members can identify the reason for record sharing with a user.


    # Step 4 – Create a record-triggered flow on the new object


    To create a record-triggered flow, follow these steps:


    +   1. Go to Flows and create a new flow.

    +   2. Then, create a record-triggered flow on the object labeled as Contact Sensitive
    Info.

    +   3. Next, we add a Decision element to see if the existing record is updated
    or if it is a new record.

    +   4. Add a Delete Records element to remove sharing from the Contact_Sensitive_Info__Share
    object. In this step, we unshare with old owners.'
  merge: -1
