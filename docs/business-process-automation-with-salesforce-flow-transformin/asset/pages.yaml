- pgno: 85
  md: 'This flow runs when a platform event message is received. Platform events exchange
    real-time event data, and these events can be internal to Salesforce or can be
    from external systems. This autolaunched flow runs in the background and is triggered
    when a platform event message is received.


    Let’s look at a platform event trigger. In this scenario, we will capture errors
    in our screen flow execution. We use a standard Salesforce-provided platform event
    – a Flow Execution Error Event. This standard platform event notifies subscribers
    of any errors related to screen flow executions. Remember that it does not capture
    event notifications for other flow types.


    # A business scenario for a platform event trigger


    This is a very simple scenario to understand and grasp concepts on how platform
    event triggers work. Our service agents capture customer contact information using
    a screen flow. Sometimes, the service agents forget to add the last name of the
    customer contact. Since the last name is mandated in our scenario, this flow fails.
    We will capture the flow error message and insert that into one of the custom
    objects.


    Refer to more details on Flow Execution Error Events at https://developer.salesforce.com/docs/atlas.en-us.platform_events.meta/platform_events/sforce_api_objects_flowexecutionerrorevent.htm.


    Here are the steps to create a process for the preceding scenario:


    +   1. The first step is to create a custom object called **Exception Messages**
    to capture flow error messages (see Figure 6.10).


    I created a custom object, **Exception Messages**, with fields listed as shown
    in the following screenshot. This object holds the error messages that can be
    used by the technical team to troubleshoot issues.'
  merge: -1
  img_proc: true
- pgno: 86
  md: '![](img/0c5ea2dc593e6f900cb4283ebfb6bf02_86_0.png)


    # Figure 6.10 - A platform event-triggered flow – the Exception Messages object


    We used the standard platform event called **Flow Execution Error Event**: https://developer.salesforce.com/docs/atlas.en-us.platform_events.meta/platform_events/sforce_api_objects_flowexecutionerrorevent.htm


    +   2. Next, we create a platform event-triggered flow using **Flow Execution
    Error Event** as the **Event** type (see Figure 6.11). The flow subscribes to
    the specified platform’s **Flow Execution Error** Event. When a screen flow platform
    event message is received, the flow is triggered to run.'
