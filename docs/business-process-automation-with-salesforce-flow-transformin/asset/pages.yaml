- pgno: 59
  md: '+   - **Record changes**: Updating a record can trigger a case, task, email,
    and so on. An example of this scenario would be an update to opportunity stages
    with a high probability of winning, generating a draft contract in Salesforce
    or another part system.

    +   - **Platform events**: Platform events such as create, update, delete, and
    so on can trigger flows. Here, a start condition is an action on the record such
    as insert, update, and so on.

    +   - **Autolaunched flows**: These are triggered via the **Custom** button, another
    flow, and other automation (Apex code, Visualforce page). One example would be
    a user clicking on the **Custom** button on demand to launch the flow and send
    a quote to your contract team.


    Exit conditions in Salesforce flows can be triggered by the following:


    +   - **Exit flows**: Every process should have an exit condition that terminates
    the flow. This can be done by displaying a message, sending a notification, or
    updating the customer flag based on the type of flow:

    +     - Iterative logic such as loops should have exit conditions well defined.
    If not, the loops run iteratively, draining resources.

    +   - **Error message/notification**: In case of a failed flow, every flow should
    have an error-capturing and -notification mechanism:

    +     - To ensure this DML operation went successfully, send an email message
    notifying the users. In case of failure, make sure you catch this exception via
    an error message to the user or your admin.

    +     - In case of failure, another good exit criterion would be to post to Chatter
    or create a case.


    Entry conditions are obvious but exit conditions are not. What happens in the
    case of exceptions? How do you know if certain actions such as database updates
    triggered via flow automations are successful? The best way to find this out is
    to send some kind of notification or Chatter post, and so on. These conditions
    will be discussed in the future chapters in detail.


    In this section, I would like to emphasize that planning entry and exit conditions
    is particularly important for making your flows complete so that your business
    can confidently rely on them. You may be wondering why this additional work needs
    to be done when we do various rounds of testing to ensure our development works
    as designed. Well, testing cannot cover every scenario, plus test results are
    valid at that point in time. At a future date, additional functionality may be
    added, and that may disrupt our existing functionality. It is always good to get
    confirmation that what is planned got delivered as planned. Think of this as a
    delivery confirmation message that you receive when what you ordered is delivered.
    It will be even better if you can add product details such as high-level details
    and link these to records so that users can easily navigate to the records. (Think
    of how Amazon adds a picture of your product when it is delivered to your front
    door.)'
