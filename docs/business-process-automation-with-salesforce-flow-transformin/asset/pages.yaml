- pgno: 35
  md: '+   5. **Only sales operations users will be able to convert account types
    from Prospect to Customer and be able to associate customer KYC IDs:** This certainly
    is not required to be automated. The users are only sales operations, who can
    perform this activity of converting an account from Prospect to Customer, but
    they also need the KYC ID. KYC is a complex process, and this functionality can
    reside in the same system or a completely different system. So, we will not plan
    to automate as we will let sales operations get the KYC ID and add it to the system
    while converting the account.


    These are some of the examples, and I hope you got an idea. We do not automate
    just because the system is capable. You need to consider how it is useful to the
    business—usability, user engagement, resource availability, value addition, and
    so on.


    Process flows such as the ones we discussed in *Chapter 1* will come in very handy.
    We can superimpose these requirements on the process flow and trace all the steps
    needed to fulfill the functional requirement. Now, let’s check and see if each
    step of the process makes a suitable candidate for system automation.


    # Developing an FSD outlining tasks to be automated


    In this section, we will briefly look at an FSD and decide which steps of the
    specification can be automated. Identifying these upfront in the FSD will help
    not only the technical team to build the functionality and automation, but also
    set expectations with the business users. Socializing this with all key stakeholders
    will help form a collective understanding of the requirement and how it will be
    performed. Sometimes, what we think needs to be automated may not be agreeable
    to the business stakeholders. This is good to know beforehand, and resources can
    be better utilized for other requirements.


    How to create an FSD is not in the scope of this book. In this section, we will
    take a quick look at typical CRM functional design document fields that are important.


    Typical FSD fields are listed next. Notice the *Can be automated?* and *Estimated
    effort* columns in the following table. This will help us to identify if the functional
    steps need to be automated, either now or in the future. Whether you use Agile
    or waterfall project methodology, we need the functional specification and a visual
    process flow for any requirements. This is more important if you plan to automate
    the steps. If you cannot draw it visually, you should not automate it. Automating
    steps without common stakeholder understanding causes more frustration and confusion.
    You should be able to document any requirement in more than one way – functional
    specification, use case, or flow charts. No matter how we describe the requirements,
    they should all convey the same meaning to all your project stakeholders:


    | FSD: Excel document with the following columns |  |

    |---|---|

    | Business requirements document (BRD) ID (unique ID) | `<Function Name>-<NN>`
    – for example, `Account-01`. |

    | Purpose | The business objective of a requirement. |

    | BRD summary | A requirement summary in simple business language. |'
  merge: -1
  img_proc: true
- pgno: 36
  md: '| FSD ID | You can use any unique identifier; the best practice is to concatenate
    FS, BRD ID, and NN since one BRD can have multiple FSD line items – for example:
    FS- Account-01.01, FS- Account-01, 02..., FS- Account-01.10. |

    | FSD summary | Summary of requirements in more technical terms so that the technical
    team understands exactly the steps in the business requirements. |

    | FSD details | It includes granular details that your technical team can understand.
    Process flows will help you capture these details more accurately. |

    | Normal flow | This is the most optimistic flow. This is what the user does to
    achieve their goal when no issues are encountered – a happy path. |

    | Alternative flow | If the user encounters issues, provide steps for them to
    take a different flow. |

    | Exception flow | In the event of an error, this will be the system response.
    |

    | Business rule | Capture business rules associated with a requirement. For example,
    account records cannot be converted from Prospect to Customer without a KYC ID.
    |

    | User actions | The steps the users perform in the system – for example, logging
    in to Salesforce, accessing the Account tab, clicking on Create new records, entering
    all the required fields, and successfully saving the record. |

    | System response | The system displays a human-understandable success, error,
    or information message. |

    | Complexity (H/M/L) | High, medium, or low. |

    | Can be automated? | Yes/no. |

    | Estimated effort | Capture estimates with and without automation. This will
    give us an idea if we should or should not automate this step of the functional
    specification. |

    | Phase of project | Phases such as Release -1, Release -2, Release -3, and so
    on. |

    | Documented date | The date when a requirement is added to a matrix. |

    | In/out scope | Your prioritized list usually consists of approved in-scope items;
    in some cases, due to technical limitations or resource constraints, you can defer
    a few requirements to future releases. Here, you can tag the deferred ones as
    out of scope. |

    | Comments | Add any comments or details that add clarity to your requirement.
    |


    This is a comprehensive list of key sections in functional documents. As needed,
    add other relevant sections that you think add value to your implementation. As
    with BRD, you review this with technical and testing leads and SMEs, get agreement
    and approval from all, and lock this document. You should share this document
    with business SMEs and stakeholders so that they can review and provide input.
    However, their approval may be optional. This baseline version will be your starting
    document for subsequent releases on your roadmap.'
  merge: -1
  img_proc: true
