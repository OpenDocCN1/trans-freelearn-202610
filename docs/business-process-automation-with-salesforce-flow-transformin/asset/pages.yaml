- pgno: 97
  md: '+   - User after-save (actions and related records) if you must do post-save
    actions, such as posting to Chatter, sending emails, updating related records,
    or rolling up summaries.

    +   - Always add a path to confirm that a flow is complete, either with a success
    message or an error message. This will help you get timely information to fix
    issues in case of failed flows.

    +   - If you are working on automating complex business logic, take the help of
    your architects and lead developers. In my opinion, flows are 80% clicks and no-code,
    but for the other 20%, you need to understand the code well. Imagine if you are
    updating related objects, using platform events, using data manipulations in loops,
    and so on.


    Getting to know practical tips helps us do things right but also saves us valuable
    project time. I could keep adding more tips, but let’s conclude this section here
    and summarize this chapter.


    # Summary


    This chapter explored the five basic types of flows to automate our business processes.
    We discussed each flow type in detail with screenshots. We took simplified scenarios
    and went through explaining each step, looking at concepts and the rationale behind
    each flow. I hope you now have a better understanding of screen flows, record-triggered
    flows, schedule-triggered flows, platform event-triggered flows, and autolaunched
    flows, and how they meet your business needs. With practice, you will be well-equipped
    to create complex Salesforce flows at your organizations and automate your processes.


    In the next chapter, you will learn how to share records via flows that are not
    available by any other means other than Apex coding. With flow, we have this great
    feature available where you can perform complex data sharing without resorting
    to code. You will get to see and explore a real-world business scenario.


    # Questions


    +   1. Explain the different types of flows.

    +   2. What would be a good use case for a record-triggered flow?

    +   3. How do you differentiate an autolaunched flow (no trigger) from other autolaunched
    flows?

    +   4. When do we use after-save triggers, and why do we use them?

    +   5. What is the best way to make a screen flow available to users from any
    page within an app?

    +   6. How do we make flows accessible to your users?'
