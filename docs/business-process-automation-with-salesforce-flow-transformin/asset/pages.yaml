- pgno: 126
  md: 'As you can see from the preceding screenshot, there is the following:


    +   - An error message

    +   - Details of the flow elements executed by the interview

    +   - A link to view the failed flow interview in Flow Builder


    There are a few troubleshooting options to fix these user errors. Most of them
    can be fixed relatively quickly. You need to be aware of what they are and at
    what point in the flow they happen.


    # Troubleshooting options


    Most flow issues can be proactively or timely addressed if you keep allocating
    enough time to take care of the following options:


    +   1. The **Debug** option in Flow Builder is our best option. We can see real-time
    details of what the flow does. We can set input variables and restart the flow
    as needed. Try different scenarios by changing input values and running users
    where applicable.

    +   2. **Flow URLs**: We may be distributing our flow via a **Custom** button
    or custom link; check the underlying flow. In most cases, you may not be passing
    the right variable to the underlying flow or changes made to the flow, and the
    new version is not activated. Also, if you rename the flow, make sure the flow’s
    new API name is used by the flow URL.

    +   3. **Process error email recipients**: When flow interviews fail, a detailed
    email is generated and sent to the admin who last modified the flow. Send it to
    your Level-3 support or technical team so that they will be in a better position
    to resolve them more efficiently and efficiently.


    > **Note**

    > To configure Apex exceptions, email recipients as follows:

    > - From **Setup | Process Automation Settings**, set **Send Process** or **Flow
    Error Email** to **Apex Exception Email Recipients**.

    > - From **Setup | Email | Apex Exception Email**, set a Salesforce user email
    or external email address.


    > **Important note**

    > **Do not** use the browser’s **Back** button to navigate through a flow. Doing
    so can cause inconsistent data between the flow and Salesforce.


    Now that we’ve learned about flow errors and how to troubleshoot them, let’s look
    at a simplified practical scenario.'
  merge: -1
  img_proc: true
- pgno: 127
  md: '# Practical scenario – failed flow example


    I purposely introduced a few errors in the flow so that we could review and get
    a good understanding.


    Scenario: When the lead is updated to status = Working-Contacted and annual revenue
    is greater than $1 million, create a contact. We need to add a required field
    called security on contact via flow, and it should be 10 characters. We will hardcode
    this value in the flow for testing different variants.


    Create a record-triggered flow with two conditions: status = Working-Contact and
    annual revenue greater than 1 million.


    This triggered flow runs immediately when the preceding conditions are met and
    a lead is updated. See Figure 8.8:


    ![](img/0c5ea2dc593e6f900cb4283ebfb6bf02_127_0.png)


    Figure 8.8 – Record-triggered flow: Lead to Contact flow


    Start the interview flow by clicking on Debug. This opens the Debug flow window;
    see Figure 8.9. The flow runs immediately and in rollback mode. This means that
    the flow debug process ensures that when the flow process ends, any operation
    on the database, such as create, update, or delete, is rolled back and not committed
    to the database. This is disabled by default, and we do have only a rollback option
    in debug mode. This ensures no data is saved to the database.'
