- pgno: 45
  md: '> **Note**

    > If the same set of users needs similar access to data, the account owner will
    be able to add the user to the account team and sales team from their user record.
    This is a one-time process, and we can default on this team on all account teams
    and opportunity teams. If they are a different set of users, team members need
    to be added at the account/opportunity record level.


    Now that we have identified the requirement in more detail and are able to assess
    if it adds value to automate all or some steps in the process, the next very important
    step is to socialize with all our key stakeholders and the project team and get
    a common understanding and agreement on the requirements as a whole, as well as
    potential tasks planned to be automated. Let’s check this out in the next section.


    # Getting consensus and agreement from all stakeholders


    In the last section, we got an opportunity to identify all the requirement steps
    – most importantly, the ones that can potentially be automated using a process
    flow diagram. I cannot emphasize enough how important these process flows are.
    If your team cannot draw your business process and explain it visually, that means
    you do not understand your business process completely, and this translates to
    incomplete requirements gathering and understanding of your business needs. If
    this is the case, take a pause and make sure requirements are elicited, documented,
    and agreed on by all project stakeholders. Make use of a whiteboard or a flip
    chart during your workshops, and develop the process flow with the help of your
    business stakeholders, SMEs, and project team members.


    Here are some considerations to make an agreement with key stakeholders:


    +   - **Be an active listener**: Be able to understand the meaning behind the
    work and the user’s intentions.

    +   - Understand the user needs in the context and be technology agnostic.

    +   - Avoid stakeholders telling you what to do (solution) rather than what they
    need.

    +   - Adopt incremental approaches where possible to foster innovative solutions
    and better solutions.

    +   - Take notes… lots of them. Tag the source where you got the information.
    Later, if you need clarification, it helps you identify the source easily.

    +   - Use visuals as much as possible to bring everyone to a common understanding.

    +   - **Communicate**: Send the minutes to all stakeholders, including the visuals,
    and solicit feedback.


    You can make prioritization meetings meaningful and effective, as follows:


    +   - Engagement rules should be communicated

    +   - Prioritization meetings should be well planned and communicated

    +   - A clear agenda and goals should be communicated

    +   - Ground rules for conflict resolution should be established'
  merge: -1
  img_proc: true
- pgno: 46
  md: '+   - Educate and give an overview of the tools and techniques the team plans
    to use

    +   - Define criteria for prioritizing factors and their weights

    +   - Set up a good conference room with a large wall-to-wall whiteboard, flip
    charts, and projector to display previously created process flows, conceptual
    flows, and so on


    > **Note**

    > Project teams do not define and create business process flows. We from the IT
    team do not tell the business users how to run their businesses. We help develop
    business process diagrams and fine-tune them with our key stakeholders and SMEs.
    However, the project team should discuss best practices and suggestions on how
    to improve the business processes. Ultimately, the business users in the workshop
    should consent or reject and they have the final say on what the business process
    should look like. Business process diagrams are reflections of your business processes,
    and they get refined iteratively many times during each release. We take a snapshot
    of the business process flow diagrams during each release so that we can use them
    as a baseline for that specific release.


    Now, let’s look at some practical tips that I found useful.


    # Practical tips on prioritizing requirements


    Let us look at a few pointers that might help you with your prioritization activities.
    They are very useful and important and can potentially save you a lot of pain
    and time. Some practical tips that you may find useful during your project implementations
    are:


    +   - Ensure that every team member on the project and all your stakeholders understand
    the flow of the process.

    +   - Refrain from automating everything in the initial releases. Focus on the
    core functionality that will add more functions to the system even though they
    require more steps from users.

    +   - Understand the usage and feedback from users for steps that you plan to
    automate. Does it really make sense to automate these steps? Do your business
    users want that automated, or are they comfortable with the way it is?

    +   - Avoid automating edge cases. If this feature is used rarely or by only a
    small set of users, do you really want to automate these steps? To mitigate any
    risk in these situations, you can generate a simple email notification to your
    sales operations/planning team to verify these edge cases.

    +   - Create a roadmap for automation when you have a multi-release project. This
    will help with negotiating trade-offs between automation versus adding new features/functions.

    +   - Manage expectations by progressive prioritization and by being transparent.
    Let all your stakeholders and project team members have access to your **business
    requirements document (BRD)** or product backlog.'
  merge: -1
  img_proc: true
