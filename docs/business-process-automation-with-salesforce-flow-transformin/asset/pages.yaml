- pgno: 43
  md: '# Scenarios – Rationale for automation


    We will explore a real-world scenario in this section, starting with defining
    high-level requirements and going more granularly into low-level requirements.
    With the aid of a process flow, we will discuss the rationale behind the steps
    we plan to automate.


    # High-level requirement:


    The user will be able to request and gain access to accounts and related records
    such as contacts, opportunities, and cases. Users not within specific business
    groups need compliance approval before they can be granted access to the account
    and related records.


    # Low-level functional requirements:


    +   1. The sales analyst requests access to Salesforce data.

    +   2. The sales manager/sales operations will be able to add users to the account
    team.

    +   3. Compliance needs to approve user access if they do not belong to the same
    group. Example: Sales users in Zone 1 can be granted access to any of the records
    owned by users from Zone 1, whereas if a Zone 2 user needs access to Zone 1 users’
    data, compliance approval is required.

    +   4. Compliance reviews the request and can approve or reject the case.


    Let’s go through each step and see what can be automated and see if that makes
    sense:


    +   1. Can the sales analyst request access directly from the system, by creating
    a case?

    +   2. If a request conforms to the guidelines (which means users belong to the
    same sales group), can we automate account team creation on case approval by the
    sales manager/operations, or do they need to create an account team manually?
    This makes sense to automate, but do we have time and resources? What is the volume
    of users we have in our instance? If not a large volume, does it make sense to
    automate?

    +   3. Is case management required? Or do we get approval outside the system?

    +   4. Do we need to build approval processes if the data volume and frequency
    are low? Do we have licenses to the system for compliance users? Assuming you
    have good user bases and medium to high volume data, it makes sense to enable
    case management and automate account team creation. Here is the reason: We need
    cases available handy for auditing and automating account team creation to help
    compliance users.

    +   5. Do we automate email notifications based on actions in the system, or is
    it done outside the system? Do the users need to be active in the system to be
    able to get notifications? Automating email notifications sounds like a no-brainer,
    but what if the users do not have access to the system and you need a response
    from the user, such as approve/reject?'
  merge: -1
  img_proc: true
