- pgno: 122
  md: '# Debug Details


    ![](img/0c5ea2dc593e6f900cb4283ebfb6bf02_122_0.png)


    Figure 8.6E – Interview completed


    I hope you now get a sense of how the flow runs and can see each executed step
    with granular details. It is available within Flow Builder and is easy to read
    and understand. You will exactly know where and why it failed.


    In the next section, let’s understand the error messages that we may likely encounter
    while executing flows.


    # Understanding flow errors


    So far, we have seen a happy path and understood how our flow behaves. But even
    with due diligence and thorough planning and testing, there will always be some
    scenarios and edge cases that are bound to fail and cause nightmares for your
    team.


    If we do not plan and design our flow, users will run into exceptions with no
    information on why they failed or some cryptic message that no one can understand.
    What do they do now? Get frustrated?


    To remediate this problem, we need to plan for these exceptions. Issues will happen,
    and if we are prepared to handle them promptly and fix the root cause, we will
    create a better user experience.'
  merge: -1
