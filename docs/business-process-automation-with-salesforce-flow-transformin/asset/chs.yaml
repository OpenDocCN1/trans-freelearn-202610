  查找所有符合以下条件的 Account 记录：\nId 等于 {!recordId} (0014o00001pkz0NAAQ)\n将以下字段的值存储到\nGet_Account_Data：Description、BillingCity、ShippingStreet、Name、BillingCountry、BillingStreet、ShippingPostalCode、ShippingCountry、ShippingCity、BillingPostalCode、ShippingState、Id、BillingState\n\
