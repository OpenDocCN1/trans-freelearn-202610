  \n图 8.2 – Debug flow 窗口\n\n我们有以下选项：\n\n- 运行最新版本。这在大多数情况下都是如此，除非你有特定条件需要测试旧版本。\n\
  - 显示已执行的详细信息并在 Lightning 运行时中呈现流程。我已勾选此项，以便我可以看到流程执行步骤的详细信息。\n- 以其他用户身份运行流程。确保你以不同的角色进行调试。作为管理员，你将拥有对\
  \ Salesforce 的完全访问权限，可能不会遇到任何问题。很多时候，主要的罪魁祸首可能是你的用户对数据的访问权限。\n- **输入变量：** 这些是触发屏幕流程的记录的\
  \ recordId 变量。对于我们的用户，我们通过 **Custom** 按钮、自定义 URL 等提供此信息。由于我们正在 Flow Builder 中模拟此操作，我们需要提供此记录\
  \ ID。在我们的示例中，这将是我们账户记录的 18 位字符 ID。\n\n\n\n\n\n- **获取记录（GET RECORDS）：**用于读取客户地址的流程元素。它使用查询来获取所有符合输入条件的客户记录。由于客户记录\
  \ ID 是唯一的，因此输出中只有一条记录。对于复杂的屏幕流，可能需要检索多条记录，并创建一个用于处理多条记录的流程：\n\n# 调试详细信息\n\n``` \n\
