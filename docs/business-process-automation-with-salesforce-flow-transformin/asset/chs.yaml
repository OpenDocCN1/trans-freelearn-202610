  \n面试开始方式\n此次调试运行是在模拟创建潜在客户记录的情况下触发的。\nSM Srini munagavalasa (005460000023WZk) 启动了流程面试。\n\
  运行流程的 API 版本：58\n此流程的部分变量在面试开始时已设置。\nSRecord = Lead (00Q4600000LpNFEEA3)\n\n启动条件要求：\n\
  触发记录满足条件要求。\n进入条件\n1. Status (Working - Contacted) 等于 Working - Contacted\n2. AnnualRevenue\
  \ (2000000.0) 大于 1000000.0\n逻辑：所有条件都必须为 true（AND）\n\n创建记录（CREATE RECORDS）：从潜在客户创建联系人\n\
  创建一条 Contact 记录，其中：\nDepartment = Sales\nEmail = {!SRecord.Email} (dr.hello@universe.llc)\n\
  FirstName = {!SRecord.FirstName} (Hello)\nLastName = {!SRecord.LastName} (World)\n\
  MailingCity = {!SRecord.City} (New York)\nMailingCountry = {!SRecord.Country} (USA)\n\
  MailingPostalCode = {!SRecord.PostalCode} (100001)\nMailingState = {!SRecord.State}\
  \ (NY)\nMailingStreet = {!SRecord.Street} (1001 battery park)\n结果\n创建记录失败。\n\n发生错误：流程尝试创建记录时发生此错误：\n\
  REQUIRED_FIELD_MISSING：缺少必填字段：[Security_ID__c]。\n你可以在 SOAP API Developer Guide 中查找\
  \ ExceptionCode 值。\n\n事务已回滚\n由于发生错误，流程准备创建、更新或删除的所有记录均未提交到数据库。\n\nSalesforce 错误\
  \ ID：648870654-37446 (513355057)\n```\n\n图 8.7 – 流程失败电子邮件消息详细信息（发送给管理员的示例电子邮件通知）\n\
  \n如前面的屏幕截图所示，其中包含以下内容：\n\n- 一条错误消息\n- 面试所执行的流程元素的详细信息\n- 用于在 Flow Builder 中查看失败流程面试的链接\n\
  \n有几种故障排除方法可以修复这些用户错误。其中大多数问题都可以相对快速地解决。你需要了解这些问题是什么，以及它们发生在流程的哪个阶段。\n\n# 故障排除选项\n\
  \n如果你持续分配足够的时间处理以下选项，大多数流程问题都可以主动或及时得到解决：\n\n1. Flow Builder 中的 **调试（Debug）**选项是我们最好的选择。我们可以实时查看流程执行的详细信息，可以设置输入变量，并根据需要重新启动流程。在适用的情况下，可以通过更改输入值并以不同用户身份运行流程来尝试不同场景。\n\
  2. **流程 URL：**我们可能通过**自定义**按钮或自定义链接分发流程；请检查其底层流程。在大多数情况下，可能是没有向底层流程传递正确的变量，或者流程发生了更改但新版本尚未激活。此外，如果重命名了流程，请确保流程\
  \ URL 使用了流程新的 API 名称。\n3. **流程错误电子邮件收件人：**当流程面试失败时，系统会生成一封详细的电子邮件，并发送给最后修改该流程的管理员。请将其转发给三级支持人员或技术团队，以便他们更有效地解决问题。\n\
  \n> **注意**\n> 要配置 Apex 异常电子邮件收件人，请执行以下操作：\n> - 在 **设置 | 流程自动化设置** 中，将 **发送流程错误电子邮件（Send\
  \ Process or Flow Error Email）** 设置为 **Apex 异常电子邮件收件人（Apex Exception Email Recipients）**。\n\
  > - 在 **设置 | 电子邮件 | Apex 异常电子邮件** 中，设置 Salesforce 用户电子邮件地址或外部电子邮件地址。\n\n> **重要提示**\n\
  > **不要**使用浏览器的**后退**按钮在流程中导航。这样做可能导致流程与 Salesforce 之间的数据不一致。\n\n现在，我们已经了解了流程错误及其故障排除方法，下面来看一个简化的实际场景。\n\
  \n\n\n\n\n# 实际场景——流程失败示例\n\n场景：当潜在客户的状态更新为“正在联系”，且年收入大于 100 万美元时，创建一个联系人。我们需要通过流程在联系人上添加一个名为\
  \ `security` 的必填字段，并且该字段应包含 10 个字符。为了测试不同的变体，我们将在流程中对该值进行硬编码。\n\n创建一个包含两个条件的记录触发流程：状态\
  \ = “正在联系”，且年收入大于 100 万。\n\n当满足前述条件并且潜在客户完成更新后，此触发流程会立即运行。请参见图 8.8：\n\n![](img/0c5ea2dc593e6f900cb4283ebfb6bf02_127_0.png)\n\
  \n图 8.8——记录触发流程：潜在客户转联系人流程\n\n单击“调试”，启动流程调试。这将打开“调试流程”窗口；请参见图 8.9。流程会立即运行，并处于回滚模式。这意味着流程调试过程会确保流程结束时，对数据库执行的任何操作（例如创建、更新或删除）都会回滚，而不会提交到数据库。默认情况下，此选项处于禁用状态，并且在调试模式下我们只有回滚选项。这样可以确保不会将任何数据保存到数据库中。\n\
  \n我添加了一个现有潜在客户，该潜在客户的数据将用于运行流程（请参见图 8.9）：\n\n将潜在客户姓名设置为 Hello World。\n\n我创建了一个与该潜在客户具有相同姓氏和电子邮件地址的联系人。这样做是为了在流程调试中捕获重复异常：\n\
  \n![](img/0c5ea2dc593e6f900cb4283ebfb6bf02_128_0.png)\n\n图 8.9——潜在客户转联系人：“调试流程”窗口\n\
  \n单击“运行”后，入口条件得到满足，并执行流程中的“创建记录”元素。正如前文所述，由于存在一个具有相同姓氏和电子邮件地址的联系人，流程因联系人记录重复而出错，执行随即结束。请参见图\
  \ 8.10。我们可以看到，在流程失败的元素旁边显示了一个“否”图标：\n\n图 8.10——由于联系人记录重复，流程失败\n\n我解决了联系人重复问题，然后针对同一个潜在客户重新运行流程。但随后我移除了\
  \ `security` 字段的硬编码值，而该字段是创建联系人时的必填字段。\n\n如第 9 章所述，要创建新的编排，请在“新建流程 | 全部 + 模板”中单击“新建流程编排”，然后选择“开始记录触发编排”：\n\
