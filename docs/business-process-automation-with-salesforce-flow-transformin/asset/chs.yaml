- "# 触发业务流程的 Flow\n\n我们已经看到各种构建块——元素、连接器和资源。我们使用这些基本构建块来启用和触发业务流程步骤。根据业务流程需求，流程可以与最终用户交互，也可以在后台无缝运行。\n\
  \nFlow 可以通过两种方式触发：\n\n1. **交互式体验流**：在这里，用户需要在屏幕上交互式输入或执行操作。一个很好的例子是在一个简单的**用户界面（UI）**上收集客户信息和联系信息，然后让流程负责更新多个对象。\n\
  2. **后台自动化流**：不需要任何用户操作。这些流程在后台运行，可以称其为 100% 自动化。*示例*：当高价值商机的状态变为 **已关闭未赢得（Closed\
  \ Lost）** 时，向客户经理生成一封电子邮件通知。另一个示例是，在商机关闭日期前一周，为所有未结商机安排通知销售经理。\n\n接下来，让我们结合一些示例深入探讨这两种方式。\n\
  \n## 交互式体验流\n\n我们可以通过五种方式与屏幕交互来触发流程，如下所示：\n\n1. **屏幕流**：可以通过屏幕、操作等用户交互触发。\n2. **自动启动流**：自动启动流可以通过用户交互来启动，例如，点击屏幕上的自定义按钮或另一个流程（子流），或来自外部系统的\
  \ API 调用。\n3. **审批流程**：审批流程允许我们指定一系列步骤，由指定的审批人审批记录。*示例*：金额较大的报价根据产品系列需要三个级别的审批。\n\
  \n- **记录变更**：更新记录可以触发个案、任务、电子邮件等。这种场景的一个示例是，更新高概率赢单的商机阶段，在 Salesforce 或其他系统中生成合同草稿。\n\
  - **平台事件**：创建、更新、删除等平台事件可以触发流程。在这里，启动条件是记录上的操作，例如插入、更新等。\n- **自动启动流**：这些流程通过**自定义**按钮、另一个流程和其他自动化（Apex\
  \ 代码、Visualforce 页面）触发。一个示例是用户按需点击**自定义**按钮，启动流程并将报价发送给合同团队。\n\nSalesforce Flow\
  \ 中的退出条件可以通过以下方式触发：\n\n- **退出流程**：每个流程都应有终止流程的退出条件。这可以通过显示消息、发送通知或根据流程类型更新客户标记来实现：\n\
  \  - 循环等迭代逻辑应有明确定义的退出条件。否则，循环会反复运行，消耗资源。\n- **错误消息/通知**：在流程失败的情况下，每个流程都应有错误捕获和通知机制：\n\
  \  - 为确保此 DML 操作成功，请发送电子邮件通知用户。如果失败，请确保通过向用户或管理员发送错误消息来捕获此异常。\n  - 如果失败，另一个良好的退出标准是发布到\
  \ Chatter 或创建个案。\n\n入口条件显而易见，但退出条件并非如此。发生异常时会发生什么？如何知道通过流程自动化触发的某些操作（例如数据库更新）是否成功？要了解这一点，最好的方法是发送某种通知或\
  \ Chatter 帖子等。这些条件将在以后的章节中详细讨论。\n\n在本节中，我想强调，规划入口条件和退出条件对于完善流程尤为重要，这样你的业务才能放心地依赖它们。你可能会想，我们已经进行了多轮测试，以确保开发按设计工作，为什么还需要做这项额外工作？嗯，测试无法覆盖每一个场景，而且测试结果在那个时间点有效。将来可能会添加额外的功能，这可能会破坏我们现有的功能。最好能确认计划的内容已按计划交付。可以把它想象成你订购的商品送达时收到的配送确认消息。如果你还能添加产品详细信息（例如高层信息），并将这些信息链接到记录，以便用户可以轻松导航到这些记录，那就更好了。（可以想想亚马逊在商品送到家门口时附上产品图片的做法。）\n\
  \n\n\n\n\n# 进一步阅读\n\n- *《Salesforce 业务分析师手册》第 1 部分*\n- *Salesforce 平台执行顺序图:* https://architect.salesforce.com/1/asset/immutable/s/e6cf2ac/assets/images/Salesforce-Order-Of-Execution-Diagram.png\n\
  - *Apex 开发者指南 - 触发器与执行顺序:* https://developer.salesforce.com/docs/atlas.en-us.apexcode.meta/apexcode/apex_triggers_order_of_execution.htm\n\
  - *Salesforce Ben – 学习 Salesforce 执行顺序:* https://www.salesforceben.com/learn-salesforce-order-of-execution/\n\
  - *定义对象记录触发流运行顺序的准则 (salesforce.com):* https://help.salesforce.com/s/articleView?id=sf.flow_concepts_trigger_guidelines.htm&type=5\n\
  - *Select (SQL):* https://en.wikipedia.org/wiki/Select_(SQL)\n"
- "# Salesforce Flow 类型\n\n本章将探讨五种基本流程类型以自动化我们的业务流程。你将深入了解每种流程类型的场景——屏幕流、记录触发流、计划触发流、平台事件触发流和自动启动流。我们可以创建允许用户通过用户界面交互的流程，由屏幕流启动，并基于数据操作语言\
  \ (DML) 操作自动运行。我们将探讨可安排在未来时间及频率运行的计划流，以及基于平台事件消息触发的平台事件触发器。\n\n我们将涵盖以下 Salesforce\
  \ 流程部分：\n\n- Salesforce 中的五种基本流程类型：\n  - 探索屏幕流\n  - 探索记录触发流\n  - 探索计划触发流\n  - 探索平台事件触发流\n\
  \  - 探索自动启动流\n- 成功实践技巧\n\n我们将详细回顾每种自动化流程类型，并提供实用示例，探讨哪种流程类型适合自动化你的业务流程。你将学习每种流程及其概念，以便在开始使用\
  \ Flow Builder 规划 Salesforce 业务流程自动化时做出明智决策。你很少只使用一种流程类型。你的业务很复杂，业务流程也同样复杂，因此为了简化用户面对的复杂场景，你会使用不止一种流程类型。这些复杂场景将在本书第\
  \ 3 部分中介绍，我们在那里探索流程编排工具。现在，在本章中，让我们专注于每种单独的流程类型，一次一个，并尝试掌握概念。\n\n让我们更详细地查看每一种。\n\
  \n要在 Salesforce 中查看流程，请点击 **New Flows** 和 **All + Templates**，如图 6.1 所示。\n\n**Core**\
  \ 选项卡会显示你基本流程，但以下视图 (**All + Templates**) 将为你提供基本流程，以及 Salesforce 或通过 AppExchange\
  \ 提供的第三方供应商提供的所有模板。探索开箱即用的各种模板，并查看它们是如何开发的。探索、理解并重新利用这些模板是很好的做法，可以缩短你的开发时间。\n\n\
  ![](img/0c5ea2dc593e6f900cb4283ebfb6bf02_73_0.png)\n\n图 6.1 - 五种基本流程类型\n\n现在，让我们通过示例详细了解每种流程类型。要创建特定流程类型，请选择流程并点击\
  \ **Create**。\n\n## 屏幕流\n\n屏幕流帮助我们实现功能，用户能够通过 Salesforce 界面以交互方式执行其业务流程，从而提供出色的用户体验。这些屏幕流可通过快速操作或从\
  \ Lightning 页面启用。\n\n以下是创建屏幕流的步骤：\n\n1. 使用 Flow Builder 工具创建屏幕流。\n2. 根据你的需求添加元素——数据、逻辑和屏幕元素。\n\
  3. 添加计划在画布上使用的资源，例如变量、屏幕组件和元素。\n4. 在使用画布上的自由形式样式时手动连接这些元素，而在自动布局中，随着你将元素添加到屏幕布局，它们会自动连接。随意尝试，选择适合你的元素。\n\
  \n![](img/0c5ea2dc593e6f900cb4283ebfb6bf02_75_0.png)\n\n图 6.2 - 更新客户收货地址（流程）\n\n\
  此流程易于遵循且不言自明。在团队同意业务流程后，你可以使用屏幕流通过简单点击在 Salesforce 中创建它。当你开始流程时，例如通过点击按钮（或链接），流程运行屏幕元素，流程保持在该元素上并等待输入。根据业务流程的复杂性，你的流程可能有多个屏幕，最后是保存或取消按钮。完成此最终操作后，你的屏幕流结束。\n\
  \n以下步骤是我在 Salesforce 中创建此屏幕流的方式，也显示在图 6.3 中（请结合图 6.2 使用并跟随流程）：\n\n1. 从 Flow Builder\
  \ 创建新的屏幕流。\n2. 从账户记录获取账单地址数据——使用 Get Records 数据元素。\n3. 添加屏幕元素以捕获收货地址。\n4. 添加决策元素以评估账单和收货是否相同。\n\
  5. 使用两个分配资源基于上一步的决策进行分配。如果已勾选，则将账单地址复制到变量；否则保留屏幕输入。\n6. 使用收货地址更新账户记录。\n7. 添加操作元素以通知用户地址更新。\n\
  8. 可选地，对于复杂流程，我们可以添加异常捕获和通知机制。\n\n![](img/0c5ea2dc593e6f900cb4283ebfb6bf02_80_0.png)\n\
  \n图 6.6 - 记录触发流 – 配置计划路径\n\n**注意**\n\n当你创建自动启动流时，画布上不可用屏幕元素供我们添加。自动启动流在后台运行，无需用户交互，因此我们不需要屏幕元素。\n\
  \n为了让我们的记录触发流运行，让我们来看一个简单场景。\n\n## 记录触发流的业务场景\n\n在此场景中，如果 1) 高价值机会达到某个阶段，或 2) 机会属于顶级客户，则销售分析师将在机会无活动三天后立即收到提醒任务创建。如果七天无活动，则会向账户所有者发送升级。\n\
  \n让我们看看记录触发流的实际运行情况。要创建它，我们选择触发流程的机会对象，然后配置触发器，设置条件逻辑的入口条件，并选择在记录保存后运行的选项。在以下场景中，我们使用\
  \ Create Records 元素创建两个任务，并使用 Email Alert 操作进行升级：\n\n- 通知/升级：\n  - 创建任务 – **Create\
  \ Records** 元素：创建任务并分配给销售分析师\n  - 创建任务 – **Create Records** 元素：创建任务并分配给销售分析师（未来日期操作）\n\
  \  - 创建电子邮件通知 – **Email Alert**：为账户经理创建电子邮件警报（未来日期操作）\n- 异常 – 地址失败：\n  - 创建 **Fault**\
  \ 路径：始终创建故障路径以捕获异常\n\n记录触发流帮助我们自动化常见功能，如通知、创建任务和相关记录。它们基于记录状态自动运行，如果满足条件，则触发并在后台完成工作。始终计划捕获异常以及如何处理它们。在前述场景中，我们有一个故障路径，我们会在\
  \ Chatter 上发布/向管理员发送电子邮件，以便我们第一时间了解问题。\n\n在下一节，让我们探索计划触发流。\n\n## 计划触发流\n\n这些流程基于你为每个记录批次设定的指定时间和频率启动。到了时间，自动启动流在后台运行。\n\
  \n要创建计划触发流，我们首先设置计划。\n\n这些流程可以安排并在后台从计划开始日期、开始时间运行，并设置频率——一次、每天或每周（见图 6.8）。\n\n\
  你可以通过从画布上的 **Record-Triggered Flow** 元素点击 **Add Scheduled Paths (Optional)** 访问此页面。\n\
  \n\n\n\n此流程在收到平台事件消息时运行。平台事件用于交换实时事件数据，这些事件可以来自 Salesforce 内部，也可以来自外部系统。此自动启动的流程在后台运行，并在收到平台事件消息时被触发。\n\
  \n让我们来看一个平台事件触发器。在此场景中，我们将捕获屏幕流程执行中的错误。我们使用 Salesforce 提供的标准平台事件——流程执行错误事件。此标准平台事件会通知订阅者与屏幕流程执行相关的任何错误。请注意，它不会捕获其他流程类型的事件通知。\n\
  \n# 平台事件触发器的业务场景\n\n这是一个非常简单的场景，用于理解和掌握平台事件触发器的工作原理。我们的服务专员使用屏幕流程捕获客户联系信息。有时，服务专员会忘记添加客户联系人的姓氏。由于在我们的场景中姓氏是必填字段，此流程会失败。我们将捕获流程错误消息，并将其插入到其中一个自定义对象中。\n\
  \n有关流程执行错误事件的更多详细信息，请参阅 https://developer.salesforce.com/docs/atlas.en-us.platform_events.meta/platform_events/sforce_api_objects_flowexecutionerrorevent.htm。\n\
  \n以下是为上述场景创建流程的步骤：\n\n- 1. 第一步是创建一个名为**异常消息**的自定义对象，用于捕获流程错误消息（参见图 6.10）。\n\n我创建了一个自定义对象**异常消息**，其字段如下面的屏幕截图所示。该对象保存错误消息，技术团队可以使用这些消息来排查问题。\n\
  \n![](img/0c5ea2dc593e6f900cb4283ebfb6bf02_86_0.png)\n\n# 图 6.10 - 平台事件触发的流程 – 异常消息对象\n\
  \n我们使用了名为**流程执行错误事件**的标准平台事件：https://developer.salesforce.com/docs/atlas.en-us.platform_events.meta/platform_events/sforce_api_objects_flowexecutionerrorevent.htm\n\
  \n- 2. 接下来，我们使用**流程执行错误事件**作为**事件**类型，创建一个平台事件触发的流程（参见图 6.11）。该流程订阅指定平台的**流程执行错误**事件。当收到屏幕流程平台事件消息时，该流程会被触发运行。\n\
  \n# 编辑创建记录\n\n使用流程中的值创建 Salesforce 记录。\n\n# 流程异常日志 (Flow_Exception_Log)\n\n要创建的记录数\n\
  单个\n多个\n\n如何设置记录字段\n使用记录中的所有值\n使用单独资源和字面值\n\n# 创建此对象的记录\n\n* 对象\n异常消息\n\n# 为异常消息设置字段值\n\
  \n字段 ElementApiName__c 值 $Record > 流程元素 API 名称\n\n字段 ElementType__c 值 $Record >\
  \ 流程元素类型\n\n字段 ErrorId__c 值 $Record > 流程错误 ID\n\n字段 ErrorMessage__c 值 $Record >\
  \ 流程错误消息\n\n字段 EventType__c 值 $Record > 流程事件类型\n\n取消 完成\n\n图 6.12 - 平台事件触发的流程 –\
  \ 流程异常日志\n\n现在，让我们看看我们的平台事件触发流程的实际运行情况：\n\n- 1. 我创建了一个屏幕流程来捕获联系人的名字、姓氏、电子邮件和地址。我运行了该流程并添加了客户联系信息，但屏幕上有一个字段未填写。我故意跳过了姓氏字段，以生成流程异常（参见图\
  \ 6.13）：\n\n![](img/0c5ea2dc593e6f900cb4283ebfb6bf02_89_0.png)\n\n图 6.13 - 平台事件触发的流程\n\
  \n由于**姓氏**是必填字段，此流程在创建联系人记录时会抛出异常消息。我们捕获此异常，并使用异常详细信息更新自定义对象。\n\n我们可以在**异常消息**对象中看到作为记录捕获的错误消息。您的技术团队可以定期查看这些来自异常对象的消息，并修复根本问题。此外，我们可以创建一个记录触发的流程，并通过\
  \ Chatter 或电子邮件转发此消息，以处理此错误/问题（参见*图 6.14*）。\n\n![](img/0c5ea2dc593e6f900cb4283ebfb6bf02_90_0.png)\n\
  \n# 图 6.14 - 平台事件触发的流程\n\n2. 平台事件的另一个示例是，当商机关闭时发布事件消息，以便合同管理系统（可以是内部的，也可以是外部的，例如\
  \ Oracle、SAP 等）订阅此自定义平台事件，从而启动后续步骤（即创建合同）。\n\n您可以通过“设置 | 集成 | 平台事件 | 新建平台事件”创建自定义平台事件。\n\
  \n单击“新建平台事件”以创建您的自定义事件。在以下示例中，我创建了一个平台事件，其标签为“商机赢单事件”，并带有两个新的自定义字段：“商机名称”和“商机阶段”。\n\
  \n平台事件的结构类似于我们的自定义对象（参见图 6.15A 和图 6.15B）。\n\n# 图 6.15A - 平台事件触发的流程 – 自定义事件\n\n3.\
  \ 平台事件的 API 名称以 __e 结尾。在我们的示例中，它将是 Opportunity_Won_Event__e。\n\n![](img/0c5ea2dc593e6f900cb4283ebfb6bf02_91_0.png)\n\
  \n![](img/0c5ea2dc593e6f900cb4283ebfb6bf02_91_1.png)\n\n# 图 6.15B - 平台事件触发的流程 –\
  \ 示例自定义事件字段\n\n![](img/0c5ea2dc593e6f900cb4283ebfb6bf02_94_0.png)\n\n图 6.17 - 自动启动的流程（无触发器）：客户升级\n\
  \n由于我们希望此流程由客户经理自行决定启动，因此在此场景中，我们在账户页面的“详细信息”部分下创建了一个名为“客户升级”的自定义链接。因此，当我们的客户经理决定升级时，只需单击此链接，我们的自动启动流程（无触发器）就会在后台无缝处理业务（参见图\
  \ 6.18）。\n\n![](img/0c5ea2dc593e6f900cb4283ebfb6bf02_95_0.png)\n\n图 6.18 - 用于触发自动启动流程（无触发器）的客户升级链接\n\
  \n您也可以通过自定义按钮实现同样的效果。请在自己的某个开发组织中亲自尝试一下。另外，您是否注意到屏幕右侧的“公告”窗口？这是屏幕流程的另一个示例。这对于与用户沟通非常有帮助。既然没有用户交互，这怎么会是屏幕流程呢？\n\
  \n如果您的组织中有大量流程，则有一种简单的方法可以识别自动启动的流程（无触发器）。\n\n您知道我们可以为流程创建列表视图吗？借助列表视图，我们可以轻松识别流程类型。进程类型与触发器机制的组合将提供与流程类型相关的信息。\n\
  \n流程类型 = 进程类型 + 触发器：例如，进程类型 = 自动启动的流程，触发器 = 平台事件，则该流程就是平台事件触发的流程。\n\n类似地，从下面的列表视图中，当“进程类型”为“自动启动的流程”且“触发器”为\
  \ null 时，我们可以识别出自动启动的流程（无触发器）（参见图 6.19）：\n\n- 如果必须执行保存后操作（例如发布到 Chatter、发送电子邮件、更新相关记录或汇总汇总），请使用用户保存后（操作和相关记录）。\n\
  - 始终添加一个路径来确认流程已完成，无论是显示成功消息还是错误消息。这将帮助您在流程失败时及时获取信息以修复问题。\n- 如果您正在自动化复杂的业务逻辑，请寻求架构师和首席开发人员的帮助。在我看来，流程\
  \ 80% 是点击操作且无需编码，但其余 20% 需要您充分理解代码。想象一下，您正在更新相关对象、使用平台事件、在循环中进行数据操作等。\n\n了解实用技巧不仅能帮助我们正确做事，还能节省宝贵的项目时间。我还可以继续添加更多技巧，但让我们在此结束本节，并对本章进行总结。\n\
  \n# 总结\n\n本章探讨了可用于自动化业务流程的五种基本流程类型。我们通过屏幕截图详细讨论了每种流程类型。我们采用了简化的场景，并逐步解释每个步骤，探讨了每种流程背后的概念和原理。我希望您现在对屏幕流程、记录触发的流程、计划触发的流程、平台事件触发的流程和自动启动的流程有了更好的理解，并了解它们如何满足您的业务需求。通过练习，您将能够熟练地在您的组织中创建复杂的\
  \ Salesforce 流程并自动化您的业务流程。\n\n在下一章中，您将学习如何通过流程共享记录，而这些记录无法通过除 Apex 编码以外的任何其他方式共享。借助流程，我们拥有了一个强大的功能，您无需借助代码即可执行复杂的数据共享。您将看到并探索一个真实的业务场景。\n\
  \n# 问题\n\n- 1. 解释不同类型的流程。\n- 2. 记录触发的流程的一个良好用例是什么？\n- 3. 如何区分自动启动的流程（无触发器）与其他自动启动的流程？\n\
  - 4. 我们何时使用保存后触发器，为什么使用它们？\n- 5. 从应用内的任何页面为用户提供屏幕流程的最佳方式是什么？\n- 6. 我们如何让您的用户访问流程？\n\
  \n\n"
- "# 使用 Apex 共享的 Flow\n\n在本章中，我们将讨论一个非常重要的功能：通过 Flow 共享记录，这个功能除了使用 Apex 编程之外，没有其他实现方式。借助\
  \ Apex 共享，我们可以编写 Apex 代码来实现复杂且动态的共享设置。现在，通过 Flow，这项功能已经可用，因此作为管理员，你无需编写代码即可执行这些操作。对管理员来说，这个主题稍微有点高级。了解\
  \ Flow Builder 中提供了此功能会有所帮助，一个很好的用例是动态地为用户添加或删除访问权限。\n\n在我们深入探讨用于 Apex 共享的 Flow\
  \ 的细节之前，让我们快速回顾一下在 Salesforce 中可用于与用户共享记录的不同选项。我们将仅在自定义对象的上下文中讨论这一点，因为 Salesforce\
  \ 提供了通过针对各个自定义对象的 Apex 共享原因来进行 Apex 管理共享的选项。\n\n在本章中，我们将涵盖以下小节：\n\n- Salesforce\
  \ 中的数据共享选项\n- 使用 Apex 管理共享来共享数据\n- 探索真实业务场景\n- 测试我们的实际场景\n\n尽管我们说无需代码，但我们仍需要在某种程度上理解代码，并了解一些开发工具。我将通过截图详细地讲解这些内容，以便在你计划实施时，能对每个步骤及其含义有很好的把握。我还会逐步引导你测试这个场景，因为我们需要其他工具来验证结果。\n\
  \n有了这些背景，让我们以管理员身份来看看 Salesforce 中当前可用的数据共享选项。\n\n# Salesforce 中的数据共享选项\n\n组织的关键需求之一是在其软件系统中能够访问并控制业务记录。你的组织应该能够完全控制谁能访问你的业务数据。与所有其他系统一样，Salesforce\
  \ 允许你让特定用户查看某个对象，并限制他们可以查看的单独记录。你可以通过四种方式管理记录级访问权限，除非你通过**组织级默认值（OWD）**将所有对象设为公开，否则你需要组合使用多种方式。\n\
  \n在高层面上，以下选项无需 Apex 编程即可为你的用户启用访问权限：\n\n- **OWD**：指定用户相互之间可以访问对方数据（记录）的默认访问级别。我们有三个选项，以及**通过层级结构授予访问权限**选项。（**通过层级结构授予访问权限**选项是一个\
  \ OWD 设置，用于控制任何自定义对象通过层级结构进行共享访问。要使 Salesforce 自定义对象成为私有对象，请在 OWD 设置中禁用此选项。它只能为自定义对象更改。）\n\
  - **私有**：如果未选中**通过层级结构授予访问权限**，则只有所有者可以访问记录；如果选中，则角色层级中位于所有者之上的用户可以访问此记录。\n- **公开只读**：所有用户都可以查看该记录。\n\
  - **公开读写**：所有用户都可以编辑该记录。\n- **角色层级**：授予对层级中较高位置用户所拥有记录的访问权限。**角色层级**通过 OWD 上的**通过层级结构授予访问权限**启用。如果你勾选了层级中所有者之上的用户角色，你就可以访问该记录。\n\
  - **共享规则**：自动例外，仅用于向其他用户授予记录的访问权限。你可以根据记录所有者或条件共享记录，并且可以将其共享给公共组、角色和下属，访问级别为只读或读写。\n\
  - **手动共享**：这种共享类型允许特定记录的所有者与其他用户共享记录。记录所有者可以通过客户团队或机会团队手动设置对单个记录的记录级访问权限。\n\n我在这里列出了一些选项，以便让你有所了解。此外，我们还有默认客户团队、默认机会团队、经理组、隐式共享等等。\n\
  \n现在，让我们看看是否有这样的场景：你希望只有一小部分用户能够访问自定义对象中的记录。你能想到使用前面描述的现成功能来实现这个用例的方法吗？\n\n# 使用\
  \ Apex 管理共享数据\n\nApex 管理共享提供了通过 Apex 或 SOAP API 以编程方式支持特定共享需求的能力。\n\n我们可以在熟悉 Apex\
  \ 编程的技术团队成员的帮助下以编程方式实现这一点，或者我们可以使用 Flow。记录触发的 Flow 能够访问 Share 对象并对其进行更改。因此，你现在可以通过\
  \ Flow 单击即可授予或撤销用户的特定访问权限。\n\n> **注意**\n> 使用 Apex 共享的 Flow 与 Apex 代码无关。在 Flow 出现之前，我们可以通过点击以以下四种方式之一（OWD、角色层级、共享规则或手动共享）共享记录，另一种选择是使用\
  \ Apex 代码以编程方式共享记录。在创建 Apex 管理共享时，我们需要为各个自定义对象创建 Apex 共享原因，以指示如何以及为何对记录实施共享。Flow\
  \ 使用与 Apex 代码相同的功能，我们正在将相同的 Apex 共享原因重新用于 Flow 和 Apex。\n\n让我们看一个简单的业务场景。\n\n# 探索真实业务场景\n\
  \n业务需求是创建用于捕获客户敏感数据以进行验证的功能。由于数据的高度敏感性，我们希望将访问权限限制为联系记录所有者和客户记录所有者。\n\n业务需求如下：\n\
  \n- 你的业务需要一个对象来跟踪联系人的敏感信息，例如他们的税务 ID、出生日期、密码和签名验证图像。\n- 只有联系人所有者和客户所有者才能访问这些记录。\n\
  - 如果联系记录的所有权发生变化，我们需要移除先前所有者的访问权限，并为新所有者启用访问权限。\n- 联系人所有者将获得读/写访问权限，而客户所有者将获得只读访问权限。对于此场景，我们假设联系人和客户所有者不是同一个人。\n\
  - 借助 Flow，你将能够无需编码即可启用此动态共享功能。\n\n有了这些业务需求，我们首先需要一个计划。从概念上端到端地映射此过程。以下是我们为满足此业务需求所需采取的步骤：\n\
  \n1. 创建一个 Salesforce 对象（添加一个标签页并将其分配给一个应用程序，以便有访问权限的用户可以访问记录）。\n2. 创建一个 Apex 共享原因。\n\
  3. 将之前创建的对象设置为私有。\n4. 在此新对象上创建一个记录触发的 Flow：\n   - A. 与旧所有者取消共享。\n   - B. 与新所有者共享。\n\
  5. 保存并激活你的 Flow。\n\n让我们通过截图详细查看这些步骤。\n\n## 步骤 1 – 创建 Salesforce 对象\n\n这是保存联系人敏感信息记录的对象。\n\
  \n要在 Salesforce 中创建新对象，请转到 设置 | 创建 | 对象 | 新建自定义对象。\n\n我们创建了一个新的自定义对象，其标签和字段如下所列。根据需求，此自定义对象保存敏感信息，并且只应与联系人和客户所有者共享：\n\
  \n- 自定义对象标签 = **联系人敏感信息**\n- 自定义字段：\n  - **联系人姓名**\n  - **联系人敏感信息名称**\n  - **出生日期**\n\
  \  - **密码**\n  - **签名验证图像**\n  - **税务 ID**\n\n通过 OWD 将自定义对象设为私有将创建一个名为 `<Custom\
  \ Object>__Share` 的共享对象。在我们的场景中，它将是 `Contact_Sensitive_Info__Share`。\n\n`<Object>__Share`\
  \ 对象在 Salesforce UI 中不可见；我们需要通过开发者控制台访问它们。参见图 7.4。\n\n![](img/0c5ea2dc593e6f900cb4283ebfb6bf02_105_0.png)\n\
  \n图 7.4 – Contact_Sensitive_Info_Share 对象 – 此表中的用户可以访问记录\n\n要打开开发者控制台，请单击右上角的齿轮图标并选择开发者控制台。在查询编辑器中，我添加了以下查询以查看\
  \ Contact_Sensitive_Info__Share 对象的结果：\n\n```sql\nSELECT Id, ParentId, UserOrGroupId,\
  \ AccessLevel, RowCause FROM\nContact_Sensitive_Info__Share\n```\n\n我们的 Apex 共享原因标签将捕获在\
  \ RowCause 字段中。这样，技术团队成员就可以识别与用户共享记录的原因。\n\n## 步骤 4 – 在新对象上创建记录触发的 Flow\n\n要创建记录触发的\
  \ Flow，请按照以下步骤操作：\n\n1. 转到 Flow 并创建一个新 Flow。\n2. 然后，在标签为“联系人敏感信息”的对象上创建一个记录触发的 Flow。\n\
  3. 接下来，添加一个决策元素，以判断现有记录是已更新还是新记录。\n4. 添加一个删除记录元素，以从 Contact_Sensitive_Info__Share\
  \ 对象中移除共享。在此步骤中，我们与旧所有者取消共享。\n\n\n\n\n# 最后一步 – 点击保存按钮并命名你的流程\n\n点击保存按钮，并在流程标签字段中输入\
  \ Contact Sensitive Info。\n\n到目前为止，我们已经创建了所有必要的部分，以便通过流程启用 Apex 共享功能。让我们在下一节中实际看看它的运行情况。\n\
  \n# 测试我们的实际场景\n\n为了测试该功能，让我们打开 Contact Sensitive Info 自定义对象。\n\n作为管理员，我在 Contact\
  \ Sensitive Info 对象上创建了一条记录，如图 7.6 所示。我为现有联系人记录 King Valkyrie 添加了税号、出生日期、通行码和签名验证图像值。让我们称这条记录为\
  \ King Valkyrie_PII Data。\n\n在我保存这条记录后，我们的记录触发流程会触发并完成，向用户授予对此新记录的访问权限。现在，这些用户将能够访问此敏感信息记录。可选地，你可以从流程中向这些用户添加通知：\n\
  \n![](img/0c5ea2dc593e6f900cb4283ebfb6bf02_107_0.png)\n\n图 7.6 - Contact Sensitive\
  \ Info 页面（示例记录）\n\n我们希望只向有限数量的用户授予访问权限。让我们看看谁有权访问此 King Valkyrie_PII Data 记录。我们的要求是仅授予\
  \ **Contact Owner** 和 **Account Owner** 访问权限（见图 7.7），其他人不得访问。请记住 – 记录所有者也将获得对记录的访问权限。如果管理员为联系人所有者创建数据，请在创建记录后将所有者更改为该记录：\n\
  \n![](img/0c5ea2dc593e6f900cb4283ebfb6bf02_108_0.png)\n\n图 7.7 - 与 Contact Sensitive\
  \ Info 记录相关的联系人和账户记录\n\n现在，让我们看看谁可以访问此 **Contact Sensitive Info** 记录：\n\n1. 从 **Contact\
  \ Sensitive Info** 记录中，点击 **Quick Actions 中的共享**。 （如果看不到，请在你的 Lightning 页面上启用它 –\
  \ 参阅 *Empower Your Users with Quick Actions Unit | Salesforce Trailhead: https://trailhead.salesforce.com/content/learn/modules/lex_customization/lex_customization_actions*）。\n\
  2. 你可以看到此记录已与以下用户共享：\n   - **联系人所有者：Spider-Man—读写**\n   - **账户所有者：Super Man—只读**\n\
  \   - **记录所有者：SM-Srini munagavalasa—完全访问：**\n\n# 总结\n\n在本章中，你接触到一个独特的流程功能，它可以帮助我们增强功能并同时实现自动化。使用代码进行\
  \ Apex 共享遵循本章中列出的相同步骤，只是我们用流程替换了 Apex 代码。\n\n你学习了如何创建 Apex 共享原因以及它如何用于向用户授予和/或撤销对特殊情况记录的访问权限。你看到了我们如何使用记录触发流程更新共享对象。最后，我们看到了一个真实世界的示例，并能够验证数据如何更新到我们的共享对象上。\n\
  \n为此，你需要更深入地了解共享对象以及如何使用 Workbench 和开发者控制台。你需要一点练习才能掌握。继续练习，你会喜欢上的。\n\n在下一章中，我们将探索并学习如何使用\
  \ Flow Builder 调试窗口。我们经常遇到某种问题，你需要一个工具来理解并找到根本原因。我们还将讨论一些场景并更好地理解概念。\n\n# 问题\n\n\
  1. 使用流程共享记录的好处是什么？为什么？\n2. 我们如何识别用户记录共享的原因？\n3. 我们如何撤销用户对特定记录的访问权限？\n\n# 延伸阅读\n\n\
  - *Understanding Sharing | Apex Developer Guide | Salesforce Developers*: https://developer.salesforce.com/docs/atlas.en-us.apexcode.meta/apexcode/apex_bulk_sharing_understanding.htm\n\
  - *Workbench (developerforce.com)*: https://workbench.developerforce.com/login.php\n"
- "# 了解流程调试窗口\n\n从 Flow Builder 进行调试只需简单的点击即可完成。我们无需使用跟踪标志创建调试日志然后再浏览 **调试日志详细信息。**\n\
  \n**什么是调试日志？**\n调试日志记录数据库操作和系统进程，如验证、分配规则等，以及执行事务时的任何错误。系统为用户执行事务而生成调试日志。你可以指定一个包含事务开始时间的跟踪标志，并设置开始和过期日期。调试日志提供更详细的信息，你需要具备一定的技术技能才能解读这些日志。\n\
  \n流程调试不仅仅是在我们遇到问题时使用。这是一个非常有用的工具，可以让我们测试功能块并确保其端到端按预期工作。调试窗口捕获的详细信息让我们可以看到流程是如何运行的。这提供了流程执行情况的分步结果\
  \ – 它是如何触发的，哪些操作正在进行，结果如何。我们可以微调流程中的步骤并修复任何故障，优化单个步骤，自定义错误消息，添加信息消息等等。\n\n让我们来看一下调试窗口的关键功能。以下是从开始到结束的步骤：\n\
  \n1. 要访问流程调试，请在 Flow Builder 中打开流程。\n2. 点击 **Debug**。\n3. 设置调试选项和输入变量。\n4. 通过点击\
  \ **Next** 滚动屏幕（如果有多个屏幕），并在最后一个屏幕上选择 **Finish** 结束流程。\n5. 你可以用相同的输入值再次调试流程，或通过更改输入值进行调试：\n\
  \   A. **Change Inputs**：选择此项以使用不同的场景（输入值）调试流程。\n   B. **Run Again**：选择此项以使用相同的输入重新运行。\n\
  \n# 简单的实际场景 – 捕获送货地址\n\n分析师将能够使用 **Screen Flow** 捕获送货地址。\n\n让我们逐步介绍一个理想路径场景。在此场景中，一切都如愿以偿地神奇运行。确保我们输入有效的值，以便我们的流程从头到尾正常工作。\n\
  \n让我们回顾一下我们在 *第 6 章* 中讨论的场景。这是我们的业务流程：\n\n1. 用户进入账户屏幕。\n2. 访问并运行屏幕流程。\n3. 如果送货地址与账单地址相同，则将账单地址复制到送货地址。\n\
  4. 如果不同，则收集并输入送货地址。\n5. 保存记录。\n6. 在屏幕上显示成功或错误消息。\n\n我们使用 **Screen Flow** 来启用此功能。在我们的场景中，在本节中，我们将从\
  \ Flow Builder 本身测试此功能。\n\n打开你的流程（在我们的示例中，它是 **Screen Flow: Shipping Address Update**，如图\
  \ 8.1 所示）并点击 **Debug**：\n\n![](img/0c5ea2dc593e6f900cb4283ebfb6bf02_113_0.png)\n\
  \n图 8.1 – Screen Flow: Shipping Address Update\n\n流程上的 **Debug** 按钮打开 **Debug flow**\
