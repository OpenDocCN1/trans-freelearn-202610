    **结果**\n成功找到记录。\n\n**事务已提交**\n流程准备创建、更新或删除的所有记录均已提交到数据库。\n```\n\n图 8.6A – 面试开始\n\
    \n- **屏幕（SCREEN）：输入客户地址（Input Customer Address）：**此处将呈现**输入客户地址（Input Customer\
    \ Address）**屏幕元素，以供输入。\n- **决策（DECISION）：地址是否不同于账单地址？**：此决策元素将帮助我们确定该地址是否不同于账单地址。在本例中，结果为\
    \ **false**，这意味着我们不希望将账单地址复制到收货地址：\n\n## 调试详细信息\n\n![](img/0c5ea2dc593e6f900cb4283ebfb6bf02_119_0.png)\n\
    \n图 8.6B – 面试：输入屏幕和决策元素\n\n- **赋值（ASSIGNMENT）：使用输入地址（Use Input Address）：**根据捕获收货地址的决策结果，屏幕输入值将被赋给以下变量：\n\
    \n## 调试详细信息\n\n![](img/0c5ea2dc593e6f900cb4283ebfb6bf02_120_0.png)\n\n图 8.6C –\
    \ 面试和赋值\n\n- **更新记录（UPDATE RECORDS）：更新客户收货地址（Update Customer Shipping Address）：**我们获取前面赋值中的值，并使用**更新记录（UPDATE\
    \ RECORDS）**数据元素将其保存到数据库中。\n\n- **事务已提交：**由于未遇到任何错误或问题，新的收货地址已成功保存到客户记录中：\n\n\
    ## 调试详细信息\n\n![](img/0c5ea2dc593e6f900cb4283ebfb6bf02_122_0.png)\n\n图 8.6E – 面试完成\n\
    \n希望现在你已经对流程的运行方式有了一定了解，并能查看每个已执行步骤的详细信息。该功能位于 Flow Builder 中，易于阅读和理解。你可以准确知道流程在何处以及为何失败。\n\
    \n下一节中，我们将了解执行流程时可能遇到的错误消息。\n\n## 了解流程错误\n\n到目前为止，我们已经了解了顺利执行的路径，并理解了流程的行为方式。但是，即使进行了谨慎的规划、全面的设计和测试，也始终会有一些注定会失败的场景和边缘情况，给团队带来麻烦。\n\
    \n如果我们不规划和设计流程，用户就会遇到异常，却不知道失败原因，或者只能看到没人能理解的晦涩消息。他们现在该怎么办？感到沮丧吗？\n\n为了解决这个问题，我们需要为这些异常做好规划。问题总会发生；如果我们准备好及时处理问题并修复根本原因，就能创造更好的用户体验。\n\
    \n图 8.7 中包含了该电子邮件：\n\n```\n主题：流程“Lead_to_Contact Demo Flow”执行期间发生错误：\n流程尝试创建记录时发生此错误……\n\
    \nFlowApplication <info@jp.salesforce.com>\n发送至 srini.munagavalasa@gmail.com\n\
    \n你正在查看一条附加的消息。Gmail 无法验证附加消息的真实性。\n\n请在 Flow Builder 中调试失败的面试，面试 GUID 为：609532f6a7cbe0a9a7f13551759718af670a333-3adb\n\
    \n错误元素 Create_Contact_from_Lead (FlowRecordCreate)。\n流程尝试创建记录时发生此错误：REQUIRED_FIELD_MISSING：缺少必填字段：[Security_ID__c]。\n\
    你可以在 SOAP API Developer Guide 中查找 ExceptionCode 值。\n\n流程详细信息\n流程 API 名称：Lead_to_Contact_Demo_Flow\n\
    类型：自动启动流程\n版本：3\n状态：活动\n组织：mufg (00D4600000113Dg)\n\n流程面试详细信息\n面试标签：Lead_to_Contact\
    \ Demo Flow 10/3/2023 1:03 PM\n面试 GUID：609532f6a7cbe0a9a7f13551759718af670a333-3adb\n\
    当前用户：SM Srini munagavalasa (005460000023WZk)\n开始时间：10/3/2023 1:03 PM\n持续时间：0 秒\n\
    \n面试开始方式\n此次调试运行是在模拟创建潜在客户记录的情况下触发的。\nSM Srini munagavalasa (005460000023WZk)\
    \ 启动了流程面试。\n运行流程的 API 版本：58\n此流程的部分变量在面试开始时已设置。\nSRecord = Lead (00Q4600000LpNFEEA3)\n\
    \n启动条件要求：\n触发记录满足条件要求。\n进入条件\n1. Status (Working - Contacted) 等于 Working - Contacted\n\
    2. AnnualRevenue (2000000.0) 大于 1000000.0\n逻辑：所有条件都必须为 true（AND）\n\n创建记录（CREATE\
    \ RECORDS）：从潜在客户创建联系人\n创建一条 Contact 记录，其中：\nDepartment = Sales\nEmail = {!SRecord.Email}\
    \ (dr.hello@universe.llc)\nFirstName = {!SRecord.FirstName} (Hello)\nLastName\
    \ = {!SRecord.LastName} (World)\nMailingCity = {!SRecord.City} (New York)\nMailingCountry\
    \ = {!SRecord.Country} (USA)\nMailingPostalCode = {!SRecord.PostalCode} (100001)\n\
    MailingState = {!SRecord.State} (NY)\nMailingStreet = {!SRecord.Street} (1001\
    \ battery park)\n结果\n创建记录失败。\n\n发生错误：流程尝试创建记录时发生此错误：\nREQUIRED_FIELD_MISSING：缺少必填字段：[Security_ID__c]。\n\
    你可以在 SOAP API Developer Guide 中查找 ExceptionCode 值。\n\n事务已回滚\n由于发生错误，流程准备创建、更新或删除的所有记录均未提交到数据库。\n\
    \nSalesforce 错误 ID：648870654-37446 (513355057)\n```\n\n图 8.7 – 流程失败电子邮件消息详细信息（发送给管理员的示例电子邮件通知）\n\
    \n如前面的屏幕截图所示，其中包含以下内容：\n\n- 一条错误消息\n- 面试所执行的流程元素的详细信息\n- 用于在 Flow Builder 中查看失败流程面试的链接\n\
    \n有几种故障排除方法可以修复这些用户错误。其中大多数问题都可以相对快速地解决。你需要了解这些问题是什么，以及它们发生在流程的哪个阶段。\n\n## 故障排除选项\n\
    \n如果你持续分配足够的时间处理以下选项，大多数流程问题都可以主动或及时得到解决：\n\n1. Flow Builder 中的 **调试（Debug）**选项是我们最好的选择。我们可以实时查看流程执行的详细信息，可以设置输入变量，并根据需要重新启动流程。在适用的情况下，可以通过更改输入值并以不同用户身份运行流程来尝试不同场景。\n\
    2. **流程 URL：**我们可能通过**自定义**按钮或自定义链接分发流程；请检查其底层流程。在大多数情况下，可能是没有向底层流程传递正确的变量，或者流程发生了更改但新版本尚未激活。此外，如果重命名了流程，请确保流程\
    \ URL 使用了流程新的 API 名称。\n3. **流程错误电子邮件收件人：**当流程面试失败时，系统会生成一封详细的电子邮件，并发送给最后修改该流程的管理员。请将其转发给三级支持人员或技术团队，以便他们更有效地解决问题。\n\
    \n> **注意**\n> 要配置 Apex 异常电子邮件收件人，请执行以下操作：\n> - 在 **设置 | 流程自动化设置** 中，将 **发送流程错误电子邮件（Send\
    \ Process or Flow Error Email）** 设置为 **Apex 异常电子邮件收件人（Apex Exception Email Recipients）**。\n\
    > - 在 **设置 | 电子邮件 | Apex 异常电子邮件** 中，设置 Salesforce 用户电子邮件地址或外部电子邮件地址。\n\n> **重要提示**\n\
    > **不要**使用浏览器的**后退**按钮在流程中导航。这样做可能导致流程与 Salesforce 之间的数据不一致。\n\n现在，我们已经了解了流程错误及其故障排除方法，下面来看一个简化的实际场景。\n\
    \n"
