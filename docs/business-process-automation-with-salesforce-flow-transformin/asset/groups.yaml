    \   - **记录所有者：SM-Srini munagavalasa—完全访问：**\n\n## 总结\n\n在本章中，你接触到一个独特的流程功能，它可以帮助我们增强功能并同时实现自动化。使用代码进行\
    \ Apex 共享遵循本章中列出的相同步骤，只是我们用流程替换了 Apex 代码。\n\n你学习了如何创建 Apex 共享原因以及它如何用于向用户授予和/或撤销对特殊情况记录的访问权限。你看到了我们如何使用记录触发流程更新共享对象。最后，我们看到了一个真实世界的示例，并能够验证数据如何更新到我们的共享对象上。\n\
    \n为此，你需要更深入地了解共享对象以及如何使用 Workbench 和开发者控制台。你需要一点练习才能掌握。继续练习，你会喜欢上的。\n\n在下一章中，我们将探索并学习如何使用\
    \ Flow Builder 调试窗口。我们经常遇到某种问题，你需要一个工具来理解并找到根本原因。我们还将讨论一些场景并更好地理解概念。\n\n## 问题\n\
    \n1. 使用流程共享记录的好处是什么？为什么？\n2. 我们如何识别用户记录共享的原因？\n3. 我们如何撤销用户对特定记录的访问权限？\n\n## 延伸阅读\n\
    \n- *Understanding Sharing | Apex Developer Guide | Salesforce Developers*: https://developer.salesforce.com/docs/atlas.en-us.apexcode.meta/apexcode/apex_bulk_sharing_understanding.htm\n\
    - *Workbench (developerforce.com)*: https://workbench.developerforce.com/login.php\n\
    \n## 了解流程调试窗口\n\n从 Flow Builder 进行调试只需简单的点击即可完成。我们无需使用跟踪标志创建调试日志然后再浏览 **调试日志详细信息。**\n\
    \n**什么是调试日志？**\n调试日志记录数据库操作和系统进程，如验证、分配规则等，以及执行事务时的任何错误。系统为用户执行事务而生成调试日志。你可以指定一个包含事务开始时间的跟踪标志，并设置开始和过期日期。调试日志提供更详细的信息，你需要具备一定的技术技能才能解读这些日志。\n\
    \n流程调试不仅仅是在我们遇到问题时使用。这是一个非常有用的工具，可以让我们测试功能块并确保其端到端按预期工作。调试窗口捕获的详细信息让我们可以看到流程是如何运行的。这提供了流程执行情况的分步结果\
    \ – 它是如何触发的，哪些操作正在进行，结果如何。我们可以微调流程中的步骤并修复任何故障，优化单个步骤，自定义错误消息，添加信息消息等等。\n\n让我们来看一下调试窗口的关键功能。以下是从开始到结束的步骤：\n\
    \n1. 要访问流程调试，请在 Flow Builder 中打开流程。\n2. 点击 **Debug**。\n3. 设置调试选项和输入变量。\n4. 通过点击\
    \ **Next** 滚动屏幕（如果有多个屏幕），并在最后一个屏幕上选择 **Finish** 结束流程。\n5. 你可以用相同的输入值再次调试流程，或通过更改输入值进行调试：\n\
    \   A. **Change Inputs**：选择此项以使用不同的场景（输入值）调试流程。\n   B. **Run Again**：选择此项以使用相同的输入重新运行。\n\
    \n## 简单的实际场景 – 捕获送货地址\n\n分析师将能够使用 **Screen Flow** 捕获送货地址。\n\n让我们逐步介绍一个理想路径场景。在此场景中，一切都如愿以偿地神奇运行。确保我们输入有效的值，以便我们的流程从头到尾正常工作。\n\
    \n让我们回顾一下我们在 *第 6 章* 中讨论的场景。这是我们的业务流程：\n\n1. 用户进入账户屏幕。\n2. 访问并运行屏幕流程。\n3. 如果送货地址与账单地址相同，则将账单地址复制到送货地址。\n\
    4. 如果不同，则收集并输入送货地址。\n5. 保存记录。\n6. 在屏幕上显示成功或错误消息。\n\n我们使用 **Screen Flow** 来启用此功能。在我们的场景中，在本节中，我们将从\
    \ Flow Builder 本身测试此功能。\n\n打开你的流程（在我们的示例中，它是 **Screen Flow: Shipping Address Update**，如图\
    \ 8.1 所示）并点击 **Debug**：\n\n![](img/0c5ea2dc593e6f900cb4283ebfb6bf02_113_0.png)\n\
    \n图 8.1 – Screen Flow: Shipping Address Update\n\n流程上的 **Debug** 按钮打开 **Debug\
    \ flow** 窗口。在这里，我们可以设置调试选项和输入变量，如图 8.2 所示：\n\n![](img/0c5ea2dc593e6f900cb4283ebfb6bf02_114_0.png)\n\
    \n图 8.2 – Debug flow 窗口\n\n我们有以下选项：\n\n- 运行最新版本。这在大多数情况下都是如此，除非你有特定条件需要测试旧版本。\n\
    - 显示已执行的详细信息并在 Lightning 运行时中呈现流程。我已勾选此项，以便我可以看到流程执行步骤的详细信息。\n- 以其他用户身份运行流程。确保你以不同的角色进行调试。作为管理员，你将拥有对\
    \ Salesforce 的完全访问权限，可能不会遇到任何问题。很多时候，主要的罪魁祸首可能是你的用户对数据的访问权限。\n- **输入变量：** 这些是触发屏幕流程的记录的\
    \ recordId 变量。对于我们的用户，我们通过 **Custom** 按钮、自定义 URL 等提供此信息。由于我们正在 Flow Builder 中模拟此操作，我们需要提供此记录\
    \ ID。在我们的示例中，这将是我们账户记录的 18 位字符 ID。\n\n"
