  - '[PAGE 82]


    +   - Notification/Escalation:

    +     - Create Task – **Create Records** element: To create a task and assign
    this to Sales Analyst

    +     - Create Task – **Create Records** element: To create a task and assign
    this to the Sales Analyst (future-dated action)

    +     - Create Email Notification – **Email Alert**: To create an email alert
    for the account manager (a future-dated action)

    +   - Exceptions – address failures:

    +     - Create **Fault** paths: Always create fault paths to catch exceptions


    A record-triggered flow helps us automate common features such as notifications,
    creating tasks, and related records. They run automatically based on the status
    of the record, and if conditions are met, they trigger and do their job in the
    background. Always plan to capture exceptions and how to address them. In the
    preceding scenario, we have a fault path, and we would have posted on Chatter/
    send an email to admins so that we are aware of the issue firsthand.


    In the next section, let''s explore schedule-triggered flows.


    # A schedule-triggered flow


    These flows launch based on a specified time and frequency, set by you for each
    record in a batch. When it is time, the autolaunched flow runs in the background.


    To create a schedule-triggered flow, we start by setting a schedule.


    These flows can be scheduled and run in the background from a scheduled start
    date, start time, and set frequency – once, daily, or weekly (see Figure 6.8).


    You can access this page by clicking on **Add Scheduled Paths (Optional)** from
    the **Record-Triggered Flow** element on the canvas.'
