  mdcn: "\n- 对团队计划使用的工具和技术进行培训并概述\n- 确定因素优先级排序的标准及其权重\n- 布置一个设施齐全的会议室，配有大型整墙白板、挂图和投影仪，以展示之前创建的流程图、概念流程图等\n\
    \n> **注意**\n>\n> 项目团队不会定义和创建业务流程图。我们 IT 团队不会告诉业务用户如何经营业务。我们会帮助开发业务流程图，并与关键利益相关方和主题专家一起微调。不过，项目团队应讨论如何改进业务流程的最佳实践和建议。最终，研讨会中的业务用户应同意或否决，他们对业务流程的最终形态拥有最终决定权。业务流程图是业务流程的反映，在每次发布期间会多次迭代改进。我们会在每次发布时对业务流程图拍下快照，以便将其作为该次发布的基线。\n\
    \n现在，让我们看一些我觉得实用的技巧。\n\n## 关于需求优先级排序的实用技巧\n\n让我们看一些可能有助于优先级排序活动的要点。它们非常实用和重要，可以为你节省大量痛苦和时间。在项目实施过程中，你会发现以下一些实用技巧：\n\
    \n- 确保项目中的每个团队成员和所有利益相关方都理解流程的流转。\n- 在最初发布版本中不要试图将所有内容自动化。专注于核心功能，这些功能会为系统增加更多功能，即使它们需要用户执行更多步骤。\n\
    - 了解用户对你计划自动化的步骤的使用情况和反馈。这些步骤自动化真的有意义吗？业务用户希望自动化，还是满足于现状？\n- 避免自动化边界情况。如果该功能很少使用或只有少数用户使用，你真的想自动化这些步骤吗？为了降低这些情况的风险，你可以向销售运营/计划团队发送一封简单的电子邮件通知，以核实这些边界情况。\n\
    - 当你有多版本发布项目时，为自动化制定路线图。这将有助于在自动化与增加新特性/功能之间进行权衡协商。\n- 通过渐进式优先级排序和保持透明来管理预期。让你所有的利益相关方和项目团队成员都能访问你的**业务需求文档（BRD）**或产品待办列表。\n\
    \n你可以在图4.2中找到每个元素的高层定义：\n\n| 元素 | 描述 |\n|---|---|\n| 交互（3） | |\n| 屏幕 | 屏幕允许你向用户捕获或显示信息。\
    \ |\n| 操作 | 调用 Apex 类并执行操作。 |\n| 子流 | 在组织内启动另一个活动流程。也称为被引用流程。 |\n| 逻辑（5） | |\n\
    | 赋值 | 用于设置值——变量、集合变量、记录变量、记录集合变量和全局变量。 |\n| 决策 | 基于一组条件，并根据这些条件的输出在流程中路由用户。 |\n\
    | 循环 | 用于遍历集合变量中项目的循环路径。在循环的每次迭代中，流程将项目临时存储在循环变量中。 |\n| 集合排序 | 对集合中的项目重新排序，并可选地限制排序后集合中保留的项目数量。\
    \ |\n| 集合筛选 | 对集合应用筛选条件，然后输出一个新集合，其中仅包含满足筛选条件的项目。 |\n| 数据（5） | |\n| 创建记录 | 使用记录变量或记录集合变量创建一条或多条\
    \ Salesforce 记录。 |\n| 更新记录 | 更新一条或多条 Salesforce 记录。 |\n| 获取记录 | 根据筛选条件查找 Salesforce\
    \ 记录，并将记录中的值存储在变量中。 |\n| 删除记录 | 通过指定条件来标识要删除的 Salesforce 记录。 |\n| 回滚记录 | 当流程运行时，记录更改作为事务的一部分执行并保存到数据库。此元素会回滚当前事务，并取消其所有待处理的记录更改。\
    \ |\n\n图4.2 – Flow 元素高层定义\n\n- `First_Name_Input`（{!First_Name_Input}）资源是一个变量，用于保存\
    \ **FirstName** 的值。\n- `Last_Name_Input` {!Last_Name_Input} 是一个变量，用于保存 **LastName**\
    \ 的值。\n\n这些资源值仅在流程运行期间可用。流程一旦结束，这些值就会被清除，资源准备好接受一组新值。\n\n现在我们已经了解了 Flow 的基本构建块，下一节让我们学习\
    \ Salesforce 中可触发业务步骤、从而实现业务流程自动化的各种流程。\n\n## 触发业务流程的 Flow\n\n我们已经看到各种构建块——元素、连接器和资源。我们使用这些基本构建块来启用和触发业务流程步骤。根据业务流程需求，流程可以与最终用户交互，也可以在后台无缝运行。\n\
    \nFlow 可以通过两种方式触发：\n\n1. **交互式体验流**：在这里，用户需要在屏幕上交互式输入或执行操作。一个很好的例子是在一个简单的**用户界面（UI）**上收集客户信息和联系信息，然后让流程负责更新多个对象。\n\
    2. **后台自动化流**：不需要任何用户操作。这些流程在后台运行，可以称其为 100% 自动化。*示例*：当高价值商机的状态变为 **已关闭未赢得（Closed\
    \ Lost）** 时，向客户经理生成一封电子邮件通知。另一个示例是，在商机关闭日期前一周，为所有未结商机安排通知销售经理。\n\n接下来，让我们结合一些示例深入探讨这两种方式。\n\
    \n### 交互式体验流\n\n我们可以通过五种方式与屏幕交互来触发流程，如下所示：\n\n1. **屏幕流**：可以通过屏幕、操作等用户交互触发。\n2.\
    \ **自动启动流**：自动启动流可以通过用户交互来启动，例如，点击屏幕上的自定义按钮或另一个流程（子流），或来自外部系统的 API 调用。\n3. **审批流程**：审批流程允许我们指定一系列步骤，由指定的审批人审批记录。*示例*：金额较大的报价根据产品系列需要三个级别的审批。\n\
    \n- **记录变更**：更新记录可以触发个案、任务、电子邮件等。这种场景的一个示例是，更新高概率赢单的商机阶段，在 Salesforce 或其他系统中生成合同草稿。\n\
    - **平台事件**：创建、更新、删除等平台事件可以触发流程。在这里，启动条件是记录上的操作，例如插入、更新等。\n- **自动启动流**：这些流程通过**自定义**按钮、另一个流程和其他自动化（Apex\
    \ 代码、Visualforce 页面）触发。一个示例是用户按需点击**自定义**按钮，启动流程并将报价发送给合同团队。\n\nSalesforce Flow\
    \ 中的退出条件可以通过以下方式触发：\n\n- **退出流程**：每个流程都应有终止流程的退出条件。这可以通过显示消息、发送通知或根据流程类型更新客户标记来实现：\n\
    \  - 循环等迭代逻辑应有明确定义的退出条件。否则，循环会反复运行，消耗资源。\n- **错误消息/通知**：在流程失败的情况下，每个流程都应有错误捕获和通知机制：\n\
    \  - 为确保此 DML 操作成功，请发送电子邮件通知用户。如果失败，请确保通过向用户或管理员发送错误消息来捕获此异常。\n  - 如果失败，另一个良好的退出标准是发布到\
    \ Chatter 或创建个案。\n\n入口条件显而易见，但退出条件并非如此。发生异常时会发生什么？如何知道通过流程自动化触发的某些操作（例如数据库更新）是否成功？要了解这一点，最好的方法是发送某种通知或\
    \ Chatter 帖子等。这些条件将在以后的章节中详细讨论。\n\n在本节中，我想强调，规划入口条件和退出条件对于完善流程尤为重要，这样你的业务才能放心地依赖它们。你可能会想，我们已经进行了多轮测试，以确保开发按设计工作，为什么还需要做这项额外工作？嗯，测试无法覆盖每一个场景，而且测试结果在那个时间点有效。将来可能会添加额外的功能，这可能会破坏我们现有的功能。最好能确认计划的内容已按计划交付。可以把它想象成你订购的商品送达时收到的配送确认消息。如果你还能添加产品详细信息（例如高层信息），并将这些信息链接到记录，以便用户可以轻松导航到这些记录，那就更好了。（可以想想亚马逊在商品送到家门口时附上产品图片的做法。）\n\
    \n"
