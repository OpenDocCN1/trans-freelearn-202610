  mdcn: "\n\n## 进一步阅读\n\n- *《Salesforce 业务分析师手册》第 1 部分*\n- *Salesforce 平台执行顺序图:* https://architect.salesforce.com/1/asset/immutable/s/e6cf2ac/assets/images/Salesforce-Order-Of-Execution-Diagram.png\n\
    - *Apex 开发者指南 - 触发器与执行顺序:* https://developer.salesforce.com/docs/atlas.en-us.apexcode.meta/apexcode/apex_triggers_order_of_execution.htm\n\
    - *Salesforce Ben – 学习 Salesforce 执行顺序:* https://www.salesforceben.com/learn-salesforce-order-of-execution/\n\
    - *定义对象记录触发流运行顺序的准则 (salesforce.com):* https://help.salesforce.com/s/articleView?id=sf.flow_concepts_trigger_guidelines.htm&type=5\n\
    - *Select (SQL):* https://en.wikipedia.org/wiki/Select_(SQL)\n\n## Salesforce\
    \ Flow 类型\n\n本章将探讨五种基本流程类型以自动化我们的业务流程。你将深入了解每种流程类型的场景——屏幕流、记录触发流、计划触发流、平台事件触发流和自动启动流。我们可以创建允许用户通过用户界面交互的流程，由屏幕流启动，并基于数据操作语言\
    \ (DML) 操作自动运行。我们将探讨可安排在未来时间及频率运行的计划流，以及基于平台事件消息触发的平台事件触发器。\n\n我们将涵盖以下 Salesforce\
    \ 流程部分：\n\n- Salesforce 中的五种基本流程类型：\n  - 探索屏幕流\n  - 探索记录触发流\n  - 探索计划触发流\n  -\
    \ 探索平台事件触发流\n  - 探索自动启动流\n- 成功实践技巧\n\n我们将详细回顾每种自动化流程类型，并提供实用示例，探讨哪种流程类型适合自动化你的业务流程。你将学习每种流程及其概念，以便在开始使用\
    \ Flow Builder 规划 Salesforce 业务流程自动化时做出明智决策。你很少只使用一种流程类型。你的业务很复杂，业务流程也同样复杂，因此为了简化用户面对的复杂场景，你会使用不止一种流程类型。这些复杂场景将在本书第\
    \ 3 部分中介绍，我们在那里探索流程编排工具。现在，在本章中，让我们专注于每种单独的流程类型，一次一个，并尝试掌握概念。\n\n让我们更详细地查看每一种。\n\
    \n要在 Salesforce 中查看流程，请点击 **New Flows** 和 **All + Templates**，如图 6.1 所示。\n\n**Core**\
    \ 选项卡会显示你基本流程，但以下视图 (**All + Templates**) 将为你提供基本流程，以及 Salesforce 或通过 AppExchange\
    \ 提供的第三方供应商提供的所有模板。探索开箱即用的各种模板，并查看它们是如何开发的。探索、理解并重新利用这些模板是很好的做法，可以缩短你的开发时间。\n\n\
    ![](img/0c5ea2dc593e6f900cb4283ebfb6bf02_73_0.png)\n\n图 6.1 - 五种基本流程类型\n\n现在，让我们通过示例详细了解每种流程类型。要创建特定流程类型，请选择流程并点击\
    \ **Create**。\n\n### 屏幕流\n\n屏幕流帮助我们实现功能，用户能够通过 Salesforce 界面以交互方式执行其业务流程，从而提供出色的用户体验。这些屏幕流可通过快速操作或从\
    \ Lightning 页面启用。\n\n以下是创建屏幕流的步骤：\n\n1. 使用 Flow Builder 工具创建屏幕流。\n2. 根据你的需求添加元素——数据、逻辑和屏幕元素。\n\
    3. 添加计划在画布上使用的资源，例如变量、屏幕组件和元素。\n4. 在使用画布上的自由形式样式时手动连接这些元素，而在自动布局中，随着你将元素添加到屏幕布局，它们会自动连接。随意尝试，选择适合你的元素。\n\
    \n![](img/0c5ea2dc593e6f900cb4283ebfb6bf02_75_0.png)\n\n图 6.2 - 更新客户收货地址（流程）\n\
    \n此流程易于遵循且不言自明。在团队同意业务流程后，你可以使用屏幕流通过简单点击在 Salesforce 中创建它。当你开始流程时，例如通过点击按钮（或链接），流程运行屏幕元素，流程保持在该元素上并等待输入。根据业务流程的复杂性，你的流程可能有多个屏幕，最后是保存或取消按钮。完成此最终操作后，你的屏幕流结束。\n\
    \n以下步骤是我在 Salesforce 中创建此屏幕流的方式，也显示在图 6.3 中（请结合图 6.2 使用并跟随流程）：\n\n1. 从 Flow Builder\
    \ 创建新的屏幕流。\n2. 从账户记录获取账单地址数据——使用 Get Records 数据元素。\n3. 添加屏幕元素以捕获收货地址。\n4. 添加决策元素以评估账单和收货是否相同。\n\
    5. 使用两个分配资源基于上一步的决策进行分配。如果已勾选，则将账单地址复制到变量；否则保留屏幕输入。\n6. 使用收货地址更新账户记录。\n7. 添加操作元素以通知用户地址更新。\n\
    8. 可选地，对于复杂流程，我们可以添加异常捕获和通知机制。\n\n![](img/0c5ea2dc593e6f900cb4283ebfb6bf02_80_0.png)\n\
    \n图 6.6 - 记录触发流 – 配置计划路径\n\n**注意**\n\n当你创建自动启动流时，画布上不可用屏幕元素供我们添加。自动启动流在后台运行，无需用户交互，因此我们不需要屏幕元素。\n\
    \n为了让我们的记录触发流运行，让我们来看一个简单场景。\n\n### 记录触发流的业务场景\n\n在此场景中，如果 1) 高价值机会达到某个阶段，或 2)\
    \ 机会属于顶级客户，则销售分析师将在机会无活动三天后立即收到提醒任务创建。如果七天无活动，则会向账户所有者发送升级。\n\n让我们看看记录触发流的实际运行情况。要创建它，我们选择触发流程的机会对象，然后配置触发器，设置条件逻辑的入口条件，并选择在记录保存后运行的选项。在以下场景中，我们使用\
    \ Create Records 元素创建两个任务，并使用 Email Alert 操作进行升级：\n\n- 通知/升级：\n  - 创建任务 – **Create\
    \ Records** 元素：创建任务并分配给销售分析师\n  - 创建任务 – **Create Records** 元素：创建任务并分配给销售分析师（未来日期操作）\n\
    \  - 创建电子邮件通知 – **Email Alert**：为账户经理创建电子邮件警报（未来日期操作）\n- 异常 – 地址失败：\n  - 创建 **Fault**\
    \ 路径：始终创建故障路径以捕获异常\n\n记录触发流帮助我们自动化常见功能，如通知、创建任务和相关记录。它们基于记录状态自动运行，如果满足条件，则触发并在后台完成工作。始终计划捕获异常以及如何处理它们。在前述场景中，我们有一个故障路径，我们会在\
    \ Chatter 上发布/向管理员发送电子邮件，以便我们第一时间了解问题。\n\n在下一节，让我们探索计划触发流。\n\n### 计划触发流\n\n这些流程基于你为每个记录批次设定的指定时间和频率启动。到了时间，自动启动流在后台运行。\n\
    \n要创建计划触发流，我们首先设置计划。\n\n这些流程可以安排并在后台从计划开始日期、开始时间运行，并设置频率——一次、每天或每周（见图 6.8）。\n\n\
    你可以通过从画布上的 **Record-Triggered Flow** 元素点击 **Add Scheduled Paths (Optional)** 访问此页面。\n\
    \n"
