    # Summary


    In this chapter, you got exposed to a unique flow feature that can help us enhance
    functionality and at the same time automate it. Apex sharing using code follows
    the same steps as laid out in this chapter, except for Apex code, which we replace
    with flows.


    You learned how to create an Apex sharing reason and how it is useful to grant
    and/or revoke access to your users for special-case records. You saw how we can
    update the Share objects using a record-triggered flow. Finally, we saw a real-world
    example and were able to verify how the data got updated on our Share objects.


    For this, you need a deeper understanding of sharing objects and using Workbench
    and the Developer Console. You need a little bit of practice to get the hang of
    it. Keep practicing; you will enjoy it.


    In the next chapter, we will explore and learn how to use the Flow Builder debug
    window. We often run into some kind of issue, and you need a tool to be able to
    understand and find the root cause. We will also discuss a few scenarios and understand
    the concepts better.


    # Questions


    +   1. What is the benefit of using flows to share records? And why?

    +   2. How do we identify the reason for record sharing with a user?

    +   3. How do we revoke access to the user for a specific record?


    # Further reading


    +   - *Understanding Sharing | Apex Developer Guide | Salesforce Developers*:
    https://developer.salesforce.com/docs/atlas.en-us.apexcode.meta/apexcode/apex_bulk_sharing_understanding.htm

    +   - *Workbench (developerforce.com)*: https://workbench.developerforce.com/login.php'
