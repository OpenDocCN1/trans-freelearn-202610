    # Scenarios – Rationale for automation


    We will explore a real-world scenario in this section, starting with defining
    high-level requirements and going more granularly into low-level requirements.
    With the aid of a process flow, we will discuss the rationale behind the steps
    we plan to automate.


    # High-level requirement:


