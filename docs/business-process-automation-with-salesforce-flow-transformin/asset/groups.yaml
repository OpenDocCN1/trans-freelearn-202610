  - '[PAGE 28]


    No matter what your role is in the project, always try to understand the business
    requirements and the business process flow. Reading the requirements in conjunction
    with process flows will help understand the requirements with clarity. You must
    make every effort to understand business needs and wants, how they align with
    the vision and strategy, and how this enables us to achieve our strategic end
    goal. To understand business needs, you need to understand how they are operated.
    Understanding the current process and what will be the desired future state is
    important so that you can find the right solution and fulfill business needs.


    # Tips for success


    +   - Get to know the project stakeholders, SMEs, and project team members. You
    can get info from organization charts and social profiles.

    +   - If you are a business analyst, you will probably be facilitating and documenting
    these requirements and process flows. If you are not, make sure you are involved
    during these discussions.

    +   - Make sure to encourage everyone to contribute and ask questions. This will
    help everyone on the team. This includes you too.

    +   - Send minutes of the meeting by the end of the day to all participants. Follow
    up as needed till you and the stakeholders understand and agree to high-level
    requirements.

    +   - Do not get into designing solutions. Understand the business requirements
    and process flows. Remember – you do not yet know what requirements will be in
    scope. Your goal should be to gain a good understanding of the complete situation
    and not provide options or solutions.

    +   - Approach the project with a design-thinking mindset. Look for people and
    their needs before feasibility and viability to maximize usability and user experience.

    +   - Actively listen, encourage, and engage participants to freely collaborate,
    take notes, manage conflicts, and keep the meeting on track.


    # Summary


    In this chapter, we discussed ways to identify the right project participants
    and then checked which tools and techniques there are to help us understand the
    business requirements. You now understand the importance of business process flows
    for common understanding by the entire project team with simplified real-world
    scenarios. We ended the chapter with a few tips for success.


    In the next chapter, we discuss functional requirements and see if they make a
    good case for automation. We will look at an example functional specification
    document (FSD) with a few real-world scenarios.'
