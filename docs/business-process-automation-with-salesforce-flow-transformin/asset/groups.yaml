  - '[PAGE 75]


    ![](img/0c5ea2dc593e6f900cb4283ebfb6bf02_75_0.png)


    Figure 6.2 - Updating a customer shipping address (a process flow)


    This process flow is easy to follow and self-explanatory. After the team agrees
    with the business process flow, you can create this in Salesforce using screen
    flows with simple clicks. When you start the flow say by clicking a button (or
    a link), the flow runs the screen element, and the flow remains on that element
    and waits for input. Based on the complexity of your business process, your flow
    might have multiple screens and, finally, a Save or Cancel button. After this
    final action, your screen flow ends.


    The following steps are how I created this screen flow in Salesforce, also shown
    in Figure 6.3 (use this in conjunction with Figure 6.2 and follow along with the
    flow):


    +   1. From Flow Builder, create a new screen flow.

    +   2. Get billing address data from the account record – the user’s Get Records
    data element.

    +   3. Add a Screen element to capture the shipping address.

    +   4. Add a Decision element to evaluate whether billing and shipping are the
    same.

    +   5. Use two Assignment resources to assign, based on the decision in the prior
    step. If checked, copy the billing address to the variables; otherwise, keep the
    screen inputs.

    +   6. Update the account record with the shipping address.

    +   7. Add an Action element to notify address updates to users.

    +   8. Optionally, for complex flow, we can add exception capture and notification
    mechanisms.'
