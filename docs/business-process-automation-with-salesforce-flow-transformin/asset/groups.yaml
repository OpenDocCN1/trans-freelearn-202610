    You can find high-level definitions of each element in Figure 4.2:


    | Elements |  |

    |---|---|

    | Interaction (3) |  |

    | Screen | The screen lets you capture or display information to a user. |

    | Action | Call an Apex class and perform an action. |

    | Subflow | Launch another active flow within the organization. Also called a
    referenced flow. |

    | Logic (5) |  |

    | Assignment | Used to set values – variables, collection variables, record variables,
    record collection variables, and global variables. |

    | Decision | Based on a set of conditions, and routes users through the flow based
    on the output of those conditions. |

    | Loop | A loop path for iterating over items in a collection variable. The flow
    temporarily stores the item in the loop variable for each iteration of the loop.
    |

    | Collection Sort | Reorder the items within a collection and optionally limit
    the number of items that remain in the collection after the sort. |

    | Collection Filter | Apply filter criteria to a collection, and then output a
    new collection that contains only items that meet the filter criteria. |

    | Data (5) |  |

    | Create Records | Create one or multiple Salesforce records by using a record
    variable or a record collection variable. |

    | Update Records | Update one or more Salesforce records. |

    | Get Records | Find Salesforce records and store values from the records in variables
    based on filter conditions. |

    | Delete Records | Identify Salesforce records to delete by specifying conditions.
    |

    | Roll Back Records | When a flow runs, record changes are executed and saved
    to the database as part of a transaction. This element rolls back the current
    transaction and cancels all its pending record changes. |


