    # Flows Using Apex Sharing


    In this chapter, we discuss a very important feature and share records via flows
    that are not available by any other means other than Apex coding. With Apex sharing,
    we will be able to write Apex code to share complex and dynamic sharing settings.
    Now, with flow, we have this feature available where you, as an admin, will be
    able to perform these actions without code. This topic is a bit advanced for admins.
    It helps to know that this feature is available in Flow Builder, and a good use
    case will be to add or remove access to users dynamically.


    Before we get into details on flows for Apex sharing, let’s quickly recap the
    different options that we have in Salesforce to share records with your users.
    We will discuss this in a custom object context only, as Salesforce provides us
    with the option to have Apex managed sharing via Apex sharing reasons for individual
    custom objects.


    In this chapter, we will cover the following sections:


    +   - Data-sharing options in Salesforce

    +   - Sharing data using Apex managed sharing

    +   - Exploring a real-world business scenario

    +   - Testing out our practical scenario


    Even though we say no code, we need to understand code at some level as well as
    know a few development tools. I will review this in detail with screenshots so
    that when you plan to do so at your implementation, you will get a good grasp
    of each step and what it means. I will also take you through testing this scenario
    step by step, as we need other tools to verify our results.


    With this background, let us go to the data-sharing option we currently have in
    Salesforce in the admin capacity.'
  - '[PAGE 100]


    # Data-sharing options in Salesforce


    One of the key requirements for organizations is to have access to and control
    over business records in their software systems. Your organization should be able
    to have complete control over who can access your business data. As with all other
    systems, with Salesforce, you can allow specific users to view an object and restrict
    the individual records they can see. You can manage record-level access in four
    ways, and you need a combination of more than one unless you make it public to
    all objects via **Organization-Wide Defaults (OWD)**.


    At a high level, the following are the options to enable access to your users
    without the need for Apex coding:


    +   - **OWD**: Specifies the default level of access the users can have to each
    other''s data (records). We have three options along with the **Grant Access Using
    Hierarchies** option. (The **Grant Access Using Hierarchies** option is an OWD
    setting to control sharing access using hierarchies for any custom object. To
    make the Salesforce custom object private, disable this option in the OWD setting.
    It can only be changed for custom objects.)

    +   - **Private**: Only the owner can access the record if **Grant Access Using
    Hierarchies** is unchecked; if checked, users above the role hierarchy can access
    this record.

    +   - **Public Read Only**: All users can view the record.

    +   - **Public Read/Write**: All users can edit the record.


    +   - **Role Hierarchy**: Grants access to records owned by users higher in the
    hierarchy. **Role Hierarchy** is enabled via **Grant Access Using Hierarchies**
    on OWD. If you check the user above the owner role in the hierarchy, you can access
    the record.

    +   - **Sharing Rules**: Automatic exceptions and are only used to give additional
    users access to records. You can share records based on record owner or criteria,
    and they can be shared with public groups, roles, and subordinates with access
    levels of read-only or read-write mode.

    +   - **Manual Sharing**: This type of sharing allows owners of particular records
    to share them with other users. Record owners can set record-level access to individual
    records manually via account or opportunity teams.


    I listed some options here so as to get an idea. In addition, we have default
    account teams, default opportunity teams, manager groups, implicit sharing, and
    so on.


    Now, let''s see if we have a scenario where you would like only a small set of
    users to be able to access records in a custom object. Can you think of a way
    to enable this use case using the out-of-the-box features described previously?'
  - '[PAGE 101]


    # Sharing data using Apex managed sharing


    Apex managed sharing provides us with the ability to support specific sharing
    requirements programmatically through Apex or the SOAP API.


    We can do this programmatically with the help of technical team members who are
    conversant with Apex programming, or we can use flows. Flows using Record-Triggered
    Flow have the ability to access and make changes to Share objects. So, you now
    have the power to grant or revoke specialized access to users with a click using
    flows.


    > **Note**

    > Flows using Apex sharing have nothing to do with Apex code. Before flows, we
    can share records in one of these four ways (OWD, role hierarchy, sharing rules,
    or manual sharing) with clicks, and the other option is to share records programmatically
    by using Apex coding. When creating Apex managed sharing, we need to create Apex
    sharing reasons for individual custom objects to indicate how and why sharing
    was implemented for the record. Flows use the same feature used by Apex code,
    and we are repurposing the same Apex sharing reason for flows along with Apex.


    Let’s see a simple business scenario.


    # Exploring a real-world business scenario


    The business requirement is to create functionality to capture customers’ sensitive
    data for verification. Due to the nature of highly sensitive data, we would like
    to restrict access to contact record owners and account record owners.


    Following are the business requirements in detail:


    +   - Your business requested that they would like to have an object to track
    contacts’ sensitive information such as their tax ID, date of birth, passcode,
    and signature verification image.

    +   - Only the contact owner and account owner will be able to access these records.

    +   - If the ownership on the contact record is changed, then we need to remove
    access to prior owners and enable access to new owners.

    +   - The contact owner will get read/write access, whereas the account gets read-only
    access. For this scenario, we will assume contact and account owners are different.

    +   - Now, with flows, you will be able to enable this dynamic sharing feature
    without the need for coding.'
  - '[PAGE 102]


    With these business requirements, we first need a plan. Map this process end to
    end conceptually. These are the steps we need to take to enable this business
    requirement:


    +   1. Create a Salesforce object (add a tab and assign it to an app so that users
    with access can access the records).

    +   2. Create an Apex sharing reason.

    +   3. Make the previously created object private.

    +   4. Create a record-triggered flow on this new object:

    +      A. Unshare with old owners.

    +      B. Share with the new owners.

    +   5. Save and activate your flow.


    Let’s review these steps in detail with screenshots.


    # Step 1 – Create a Salesforce object


    This is the object that holds the contact’s sensitive information records.


    To create a new object in Salesforce, go to Setup | Create | Objects | New Custom
    Object.


    We created a new custom object with labels and fields as listed next. This custom
    object holds sensitive information and should be shared only with the contact
    owner and account owner as per the requirements:


    +   - Custom object label = **Contact Sensitive Info**

    +   - Custom fields:

    +     - **Contact Name**

    +     - **Contact Sensitive Info Name**

    +     - **Data of Birth**

    +     - **Pass Code**

    +     - **signature verification image**

    +     - **Tax ID**'
  - '[PAGE 103]


