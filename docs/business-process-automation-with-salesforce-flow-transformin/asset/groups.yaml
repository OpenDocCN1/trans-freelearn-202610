    Om Shri Ganeshaya Namah


    我谨向我的妻子 Sunanda 以及我的孩子们 Sravan 和 Sai 致以感谢，感谢他们一直以来的支持和鼓励；感谢我的 Packt 团队，感谢他们的指导并帮助我保持正轨；感谢我的审阅者，感谢他们提供的宝贵反馈。最后，感谢我的家人、朋友以及工作中的所有同事，他们帮助我从经历中学习和成长


    —— Srini Munagavalasa


    ## Part 1: Understanding Business Requirements and Automation Needs


    在这一部分，你将学习并理解业务需求以及自动化这些需求的必要性，以便系统能够处理后端中重复、冗余且可自动化的任务。我们将探索并了解如何利用我们可以借助的工具，以及识别哪些任务可以被自动化。在这一部分结束时，你将能够创建一份功能设计规范，用于识别哪些任务应由终端用户执行，哪些任务可以被自动化。


    我们还将解决在此阶段面临的一些关键挑战：


    - 无法识别出可以被自动化的正确需求集合。

    - 缺乏对业务需求的理解，因而无法为“自动化什么”和“不自动化什么”创建解决方案/设计。

    - 过度自动化源于缺乏规划。

    - 未能整体评估现有和计划中的自动化的影响，导致自动化逻辑随机执行。


    本部分将涵盖以下章节。


    - Chapter 1, Process Flows – Understanding Business Requirements

    - Chapter 2, Identification of Functional Requirements for Automation

    - Chapter 3, Business Process Features to Automate


    无论你在项目中的角色是什么，都应始终努力理解业务需求和业务流程。结合流程图阅读需求将有助于清晰地理解需求。你必须尽一切努力理解业务需求和期望，它们如何与愿景和战略保持一致，以及这如何帮助我们实现战略终极目标。要理解业务需求，你需要了解它们是如何运作的。了解当前流程以及未来的期望状态非常重要，这样你才能找到合适的解决方案并满足业务需求。


    ### Tips for success


    - 了解项目利益相关者、SME 和项目团队成员。你可以从组织架构图和社交资料中获取信息。

    - 如果你是业务分析师，你很可能会促进并记录这些需求和流程。如果不是，请确保你在这些讨论中参与其中。

    - 确保鼓励每个人贡献意见并提问。这将帮助团队中的每个人。这也包括你自己。

    - 在当天结束前向所有参与者发送会议纪要。视需要跟进，直到你和利益相关者理解并同意高层级需求。

    - 不要陷入设计解决方案。理解业务需求和流程。记住——你目前还不知道哪些需求在范围之内。你的目标应该是对整体情况有良好的理解，而不是提供选项或解决方案。

    - 以设计思维的心态开展项目。在可行性和可行性之前先关注人们及其需求，以最大化可用性和用户体验。

    - 积极倾听，鼓励并让参与者自由协作，记笔记、管理冲突并保持会议按计划进行。


    ### Summary


    在本章中，我们讨论了如何识别合适的项目参与者，然后检查有哪些工具和技术可以帮助我们理解业务需求。你现在理解了业务流程对于整个项目团队的共同理解的重要性，并通过简化的现实场景加以说明。我们以一些成功小贴士结束了本章。


    在下一章中，我们将讨论功能需求，并看看它们是否构成自动化的良好案例。我们将查看一份示例功能规范文档（FSD），并附带几个现实场景。


    ### Questions


    1. 我们在流程图中捕获什么内容，“现状”流程图是什么？

    2. 所有项目团队成员都需要理解业务需求吗？为什么？

    3. 列举几个你可以用来自创建业务流程图的工具。

    4. 什么是 RACI 矩阵？


    ### Further reading


    - Srini Munagavalasa. *The Salesforce Business Analyst Handbook, Part 1: Planning
    and Analysis.* Packt Publishing Ltd (2022).

    - IIBA. *A Guide to the Business Analysis Body of Knowledge.* Lightning Source
    Inc (2015).


    5. **只有销售运营用户才能将账户类型从潜在客户转换为客户并关联客户 KYC ID：** 这肯定不需要自动化。用户仅限于销售运营，他们可以执行将账户从潜在客户转换为客户的活动，但他们也需要
    KYC ID。KYC 是一个复杂的过程，此功能可能位于同一系统或完全不同的系统中。因此，我们不会计划自动化，我们将让销售运营获取 KYC ID 并在转换账户时将其添加到系统中。


    这些是一些示例，我希望你已经有了一些概念。我们并不是因为系统有能力就自动化。你需要考虑它对业务是否有用——可用性、用户参与度、资源可用性、价值增加等等。


    像我们在 *Chapter 1* 中讨论的那样的流程图将非常有用。我们可以将这些需求叠加到流程图上，并追踪满足功能需求所需的所有步骤。现在，让我们检查并看看流程的每一步是否适合系统自动化。


    ### Developing an FSD outlining tasks to be automated


    在本节中，我们将简要查看一份 FSD 并决定规范的哪些步骤可以被自动化。提前在 FSD 中识别这些内容不仅有助于技术团队构建功能和自动化，还能为业务用户设定期望。与所有关键利益相关者共同讨论这一点将有助于形成对需求及其执行方式的集体理解。有时，我们认为需要自动化的内容可能不会得到业务利益相关者的认可。提前知道这一点是好的，资源可以更好地用于其他需求。


    如何创建 FSD 超出了本书的范围。在本节中，我们将快速浏览典型的 CRM 功能设计文档中重要的字段。


    接下来列出了典型的 FSD 字段。请注意下表中 *Can be automated?* 和 *Estimated effort* 列。这将帮助我们识别功能步骤是否需要自动化，无论是现在还是将来。无论你使用的是
    Agile 还是瀑布项目方法，我们都需要功能规范和任何需求的可视化流程图。如果计划自动化步骤，这一点更为重要。如果你无法将其可视化，就不应该自动化它。在没有共同利益相关者理解的情况下自动化步骤会导致更多的挫败感和困惑。你应该能够以多种方式记录任何需求——功能规范、用例或流程图。不管我们如何描述需求，它们都应向所有项目利益相关者传达相同的含义：


    | FSD: Excel document with the following columns |  |

    |---|---|

    | Business requirements document (BRD) ID (unique ID) | `<Function Name>-<NN>`
    – for example, `Account-01`. |

    | Purpose | The business objective of a requirement. |

    | BRD summary | A requirement summary in simple business language. |


    '
