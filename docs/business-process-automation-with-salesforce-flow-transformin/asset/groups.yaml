    These resource values are available only during the running of our flow. Once
    the flow ends, these values are purged, and resources are ready for a new set
    of values.


    Now that we have gained an understanding of the basic building blocks of flows,
    the next section lets us learn various flows that we have in Salesforce that trigger
    your business steps and hence automate your business process.


    # Flows to trigger business processes


    We have seen various building blocks – elements, connectors, and resources. We
    use these basic building blocks to enable and trigger our business process steps.
    Based on the business process requirements, processes can be interactive with
    your end users, or they can run behind the scenes seamlessly.


    There are two ways flows can be triggered:


    +   1. **Interactive experience flows**: Here, users need to input or perform
    interactively on the screen. A good example would be to collect customer information
    and contact information on one simple **user interface (UI)** and let the flow
    take care of updates to multiple objects.

    +   2. **Behind-the-scenes automated flows**: No user action is required. These
    flows run behind the scenes, and we can say they are 100% automated. *Example*:
    Generate an email notification to the account manager when a high-value opportunity
    status is changed to **Closed Lost**. Another example would be scheduling notifications
    for all open opportunities to the sales manager, a week before the opportunity
    close date.


    Let’s take an in-depth look at these two ways with some examples.


    # Interactive experience flows


    There are five ways we can interact with the screen to trigger the flow. They
    are as follows:


    +   1. **Screen flows**: This can be triggered via user interactions such as screens,
    actions, and so on.

    +   2. **Autolaunched flows**: Autolaunched flows can be triggered by user interaction
    to launch this flow; for example, by clicking a custom button on the screen or
    another flow (subflow), or API calls from an external system.

    +   3. **Approval processes**: Approval processes let us specify a sequence of
    steps that are required with assigned approvers to approve a record. *Example*:
    Quote with a large amount requiring three levels of approvals based on the Product
    family.'
