  - '[PAGE 71]


    # Types of Salesforce Flows


    This chapter will explore the five basic types of flows to automate our business
    processes. You will gain a deep understanding of scenarios for each of the flow
    types – screen flows, record-triggered flows, schedule-triggered flows, platform
    event-triggered flows, and autolaunched flows. We can create flows that let users
    interact with a user interface, initiated by screen flow, and run them automatically
    based on Data Manipulation Language (DML) actions. We will explore scheduled flows
    that can be scheduled at a future time and frequency, as well as platform event
    triggers that are triggered based on platform event messages.


    We will cover the following Salesforce flow sections:


    +   - The five basic types of flows in Salesforce:

    +     - Exploring screen flows

    +     - Exploring record-triggered flows

    +     - Exploring schedule-trigger flows

    +     - Exploring platform event-triggered flows

    +     - Exploring autolaunched flows

    +   - Practical tips for success


    We will review each of these automation flow types in detail, with practical examples,
    and explore the type of flow that makes sense to automate your business processes.
    You will learn each flow and its concept so that you can make an informed decision
    when you start planning your business process automation in Salesforce using Flow
    Builder. You rarely resort to just one flow type. Your business is complex, and
    so are your business processes, so to simplify these complex scenarios for your
    users, you will resort to more than one flow type. These complex scenarios will
    be covered in Part 3 of the book when we explore the flow orchestration tool.
    For now, in this chapter, let’s focus on each individual flow type, one at a time,
    and try to grasp the concepts.


    Let us look at each of these in more detail.'
