  mdcn: "\n\n## 实际场景——流程失败示例\n\n场景：当潜在客户的状态更新为“正在联系”，且年收入大于 100 万美元时，创建一个联系人。我们需要通过流程在联系人上添加一个名为\
    \ `security` 的必填字段，并且该字段应包含 10 个字符。为了测试不同的变体，我们将在流程中对该值进行硬编码。\n\n创建一个包含两个条件的记录触发流程：状态\
    \ = “正在联系”，且年收入大于 100 万。\n\n当满足前述条件并且潜在客户完成更新后，此触发流程会立即运行。请参见图 8.8：\n\n![](img/0c5ea2dc593e6f900cb4283ebfb6bf02_127_0.png)\n\
    \n图 8.8——记录触发流程：潜在客户转联系人流程\n\n单击“调试”，启动流程调试。这将打开“调试流程”窗口；请参见图 8.9。流程会立即运行，并处于回滚模式。这意味着流程调试过程会确保流程结束时，对数据库执行的任何操作（例如创建、更新或删除）都会回滚，而不会提交到数据库。默认情况下，此选项处于禁用状态，并且在调试模式下我们只有回滚选项。这样可以确保不会将任何数据保存到数据库中。\n\
    \n我添加了一个现有潜在客户，该潜在客户的数据将用于运行流程（请参见图 8.9）：\n\n将潜在客户姓名设置为 Hello World。\n\n我创建了一个与该潜在客户具有相同姓氏和电子邮件地址的联系人。这样做是为了在流程调试中捕获重复异常：\n\
    \n![](img/0c5ea2dc593e6f900cb4283ebfb6bf02_128_0.png)\n\n图 8.9——潜在客户转联系人：“调试流程”窗口\n\
    \n单击“运行”后，入口条件得到满足，并执行流程中的“创建记录”元素。正如前文所述，由于存在一个具有相同姓氏和电子邮件地址的联系人，流程因联系人记录重复而出错，执行随即结束。请参见图\
