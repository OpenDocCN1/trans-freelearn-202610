    - Approach the project with a design-thinking mindset. Look for people and their
    needs before feasibility and viability to maximize usability and user experience.

    - Actively listen, encourage, and engage participants to freely collaborate, take
    notes, manage conflicts, and keep the meeting on track.


    ### Summary


