- pgno: 103
  md: '# How it works...


    Multiple website hosting on the same IIS 10 server helps us easily manage all
    the website-related tasks on the same server. We have just created three websites
    on the same IIS server. You can create many websites as per your requirements.


    A hosts file entry is required when you want to get access to the website with
    the domain name, for example, mysite.com. You can also use the DNS server to access
    this website through LAN or WAN.


    # Creating a website folder


    In this recipe, we are going to create a separate website directory for each website,
    for example, mysite, v2mysite, and v4mysite, inside the c:\inetpub\wwwroot path,
    where we can upload the website application files later in the chapter. We were
    using the default wwwroot folder to upload the website files, so now we have to
    publish more than one website. We have to upload all the web files in their own
    separate directory.


    # Getting ready


    To step through this recipe, you will need a running IIS 10 instance. You must
    have administrator privileges, which you need to create the website folders.


    # How to do it...


    We are going to create a website folder inside the wwwroot folder for each website.


    +   1. Open the file explorer, and click on **This PC**. On the right hand side,
    you will see your available drives.

    +   2. Open the c:\ drive, go to the folder name inetpub, and you will get the
    list of IIS 10.0-related folders. You need to find the wwwroot folder.'
  merge: -1
  img_proc: true
- pgno: 104
  md: '3. Open the `wwwroot` folder. Inside the `wwwroot` folder, you have to create
    `mysite`, `v2mysite`, and `v4mysite` subfolders:


    ![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_104_0.png)


    4. Now we have to configure the physical path of the website; we already have
    three websites: `mysite.com`, `v2mysite.com`, and `v4mysite.com`. Let''s configure
    them one by one.

    5. Go to Server Manager, click on the Tools menu, and open IIS Manager.

    6. Expand your IIS server from the Connections pane, expand the Sites folder,
    and you have three listed websites. Select mysite.com.

    7. Go to the Actions pane, click on Basic settings, and you will get the properties:'
  merge: -1
  img_proc: true
- pgno: 105
  md: '![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_105_0.png)


    +   8. We add the **Physical path** C:\inetpub\wwwroot\mysite of the website directory
    we want to use for this website, mysite.com.

    +   9. Click on the **OK** button to finish.

    +   10. Follow the previous steps to add/update the **Physical path** C:\inetpub\wwwroot\v2mysite
    of the website directory we want to use for this website, v2mysite.com.

    +   11. Click on the **OK** button.


    ![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_105_1.png)'
  merge: -1
  img_proc: true
- pgno: 106
  md: '12. We will follow the same steps to add/update the physical path of v4mysite.com
    and v4mysite.com:


    ![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_106_0.png)


    13. Now you can upload the web application files as per the website name and folder.
    If you need to use different versions of the application pool, you can change
    the application pool from Basic Settings.


    # How it works...


    We first create subfolders inside the wwwroot directory for multiple web applications.
    We then created separate directories for mysite.com, v2mysite.com, and v4mysite.com.
    We also changed the physical path for all the websites. Now we can access all
    the websites with their own separate physical paths.


    # Configuring websites


    In this recipe, we are going to configure the website property. We will explore
    basic settings and advanced settings. Also, we will cover the settings limit access
    to the website.'
  merge: -1
  img_proc: true
- pgno: 107
  md: '# Getting ready


    To step through this recipe, you will need a running IIS 10 server and administrator
    user account to edit the website settings.


    # How to do it...


    +   1. Open Server Manager on Windows Server 2016. Click on the Tools menu and
    open IIS Manager.

    +   2. Expand the IIS server (WIN2016IIS). We get the listed application pools
    and sites.

    +   3. Click on mysite.com from the connections pane, and you will see the properties
    of mysite.com in the Actions pane. We get the Basic Settings... and Advanced Settings...:


    ![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_107_0.png)'
