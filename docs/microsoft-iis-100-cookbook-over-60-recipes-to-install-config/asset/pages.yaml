- pgno: 17
  md: '# Preface


    IIS 10.0 is the latest version of Internet Information Services (IIS), which is
    an extensible web server developed by Microsoft. IIS 10.0 was introduced with
    Windows Server 2016 and the Windows 10 operating system. New features of IIS 10.0
    are HTTP/2, IIS on Nano Server, wildcard host headers, and PowerShell 5 Cmdlets.
    IIS 10.0 supports all previous features: HTTP, HTTPS, SMTP, and SNMP, FTP and
    FTPS.


    # What this book covers


    Chapter 1, Integrating IIS 10.0 with Windows Server 2016, starts with some basic
    information about IIS 10.0. After that, we are going to integrate IIS 10.0 with
    Windows Server 2016 and configure and test our first sample webpage.


    Chapter 2, Creating an Application Pool in IIS 10.0, explains application pools,
    installation of different versions of application pool, creation of application
    pools, and configuration of application pools. We''ll upload and test .NET 3.5
    and .NET 4.0 web applications.


    Chapter 3, Hosting Multiple Websites on IIS 10.0, starts with multiple web hosting
    on the same IIS 10.0 instance, and we will access these websites by their hostname
    (domain name). We will configure a dedicated IP address for the website.


    Chapter 4, Constructing Virtual Directories in IIS 10.0, starts with the creation
    of a virtual directory and its use in an existing website. If you have a different
    web application that needs an application pool in the website, you can create
    a virtual directory and add the required application pools.


    Chapter 5, Installing HTTP/2 on IIS 10.0, explains HTTP/2 and installation, configuration,
    and testing of HTTP/2.


    Chapter 6, Getting Your Wildcard Host Up and Running, shows how to create a subdomain
    demo prefixed with main domain such as demo.v2mysite.com. We can create different
    names and unlimited wildcard hosts for our parent domain.


    Chapter 7, Deploying IIS 10.0 on Nano Server, starts with installing IIS 10.0
    on Nano Server. We will remote connect Nano Server, import the IISAdministration
    module in PowerShell, and create and manage the website on Nano Server.


    Chapter 8, Configuring IIS Administration with PowerShell Cmdlets, uses PowerShell
    to perform administration work on IIS Server.'
  merge: -1
  img_proc: true
- pgno: 18
  md: 'Chapter 9, Enabling ASP.NET Core with IIS on Nano Server, teaches how to enable
    ASP.NET and create virtual directories in IIS on Nano Server.


    Chapter 10, Installing and Configuring SSL Websites, starts with installation
    of third-party SSL certificates; we will create a local self-signed certificate
    and test it.


    Chapter 11, Extending IIS 10.0 to FTP, shows how to install the FTP server role
    on Windows Server 2016. We create and configure an FTP site.


    Chapter 12, Securing Your Websites on IIS 10.0, explains IIS 10.0 security and
    available security configurations such as IP, domain, and URL.


    Chapter 13, Managing and Troubleshooting IIS 10.0, explains configuration and
    management of health and performance of IIS 10.0.


    # What you need for this book


    In order to work with IIS 10.0, the following hardware and software should be
    available:


    +   - **Software Required (with version)**: IIS 10.0, FileZilla FTP client software,
    Visual Studio 2015 or later, HTML files, PowerShell 5 cmdlets

    +   - **Hardware specifications**: 4 GB RAM, 300 GB HDD, 2vProcessor.

    +   - **OS required**: Windows Server 2016, Nano Server 2016 and Windows 10


    # Who this book is for


    This book is for those who have been working as IIS administrators, system administrators,
    website administrators, and web developers, such as site builders, backend developers,
    and frontend developers, and those who are eager to see what awaits when they
    start using IIS 10.0.


    # Sections


    In this book, you will find several headings that appear frequently (Getting ready,
    How to do it..., How it works..., There''s more..., and See also).


    To give clear instructions on how to complete a recipe, we use these sections
    as follows:'
  merge: -1
  img_proc: true
- pgno: 19
  md: '# Getting ready


    This section tells you what to expect in the recipe, and describes how to set
    up any software or any preliminary settings required for the recipe.


    # How to do it...


    This section contains the steps required to follow the recipe.


    # How it works...


    This section usually consists of a detailed explanation of what happened in the
    previous section.


    # There''s more...


    This section consists of additional information about the recipe in order to make
    the reader more knowledgeable about the recipe.


    # See also


    This section provides helpful links to other useful information for the recipe.


    # Conventions


    In this book, you will find a number of text styles that distinguish between different
    kinds of information. Here are some examples of these styles and an explanation
    of their meaning.


    Code words in text, database table names, folder names, filenames, file extensions,
    pathnames, dummy URLs, user input, and Twitter handles are shown as follows: "Create
    a new user for JIRA in the database and grant the user access to the jiradb database
    we just created using the following command."


    A block of code is set as follows:


    ```

    <Contextpath="/jira"docBase="${catalina.home}

    /atlassian- jira" reloadable="false" useHttpOnly="true">

    ```'
  merge: -1
  img_proc: true
