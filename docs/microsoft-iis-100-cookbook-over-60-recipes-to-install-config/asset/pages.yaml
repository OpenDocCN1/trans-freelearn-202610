- pgno: 110
  md: '# How it works..


    In this recipe, we had an overview of the website mysite.com from steps 1 to 3.
    We went through the Connections pane and expanded the Sites folder to get the
    properties of mysite.com. From steps 4 to 13, we discussed the basic and advanced
    settings configuration and customization of the website mysite.com. We understood
    Failed Request Tracing and how to limit the concurrent connections of mysite.com.


    # Configuring ports


    In this recipe, we are going to configure the website access port; default website
    access type is HTTP and port number is 80. We will configure some different port
    to access the website for all individually hosted sites.


    # Getting ready


    To step through this recipe, you will need a running IIS 10 server and administrator
    user account, which you need to edit the website settings.


    # How to do it...


    +   1. Open Server Manager on Windows Server 2016. Click on the Tools menu and
    open the IIS Manager.

    +   2. Expand the IIS server (WIN2016IIS). We get the listed application pools
    and sites.

    +   3. We already have the listed websites, which were created earlier. Click
    on mysite.com, you will get the properties of mysite.com in the Actions pane.
    We can browse website on IP 172.16.15.60:80; here, 80 is the port number.'
  merge: -1
  img_proc: true
