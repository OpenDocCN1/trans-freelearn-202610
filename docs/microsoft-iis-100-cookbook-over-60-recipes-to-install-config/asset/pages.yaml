    get access through the HTTPS port. We will also cover how to add/install a certificate
    and attach that certificate to a website.


    # Getting ready


    To step through this recipe, you will need a running IIS 10.0 instance. You should
    also have administrative privileges.


    # How to do it...


    +   1. Open Server Manager on Windows Server 2016. Click on the Tools menu and
    open IIS Manager.

    +   2. Select the IIS server (WIN2016IIS). You will get the Feature View, where
    you will find the Server Certificates option:


