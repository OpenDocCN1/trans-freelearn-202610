    pane by clicking on Basic Settings to get the same option to rename it. Renaming
    the website is only for identifying the website.


    12. Now we are going to add v4mysite.com. Inside the Connections pane, click on
    the Sites menu, go to the Actions panel, and click on Add Websites.... You will
