    for testing. They are not for a live environment. Here, we will use the existing
    user certificate name, Packt; you will see this is issued Issued To WIN2016IIS.Call.com
    and also see its Certificate Hash key. The certificate hash is used for encrypting
    the website data we access, and it uses a hashing algorithm to encrypt website
    data and decrypt it. IIS 10.0 uses SHA256 256-bit encryption. Certificate Store
    has the category of certificate listed; we will use WebHosting.'
