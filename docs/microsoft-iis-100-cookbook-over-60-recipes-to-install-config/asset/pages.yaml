- pgno: 108
  md: '4. Click on **Basic Settings...**, and you will get the **Edit site** property
    displayed.


    ![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_108_0.png)


    5. The **Edit Site** window shows you the selected website and your assigned application
    pool.


    6. The **Physical path** is the path of the website application files, located
    in the `wwwroot` folder. You can customize the **Connect as...** option and test
    your settings to check whether it is working or not in a browser.


    7. Now let''s move on to configure the **Advance Settings...** of the selected
    website.


    8. Click on **mysite.com**. In the **Actions** pane, you get the **Advanced Settings...**
    option. Click on **Advanced Settings...**, and you will get the advanced settings
