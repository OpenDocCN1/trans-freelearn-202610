- pgno: 60
  md: '# Getting ready


    We have to test whether the web page is working. You need an up-and-running IIS
    10.0 server instance and a static HTML web page.


    We have already created the `index.html` page and uploaded it in the IIS `wwwroot`
    directory.


    # How to do it...


    +   1. Open Internet Explorer.

    +   2. You have to provide the URL of your web page in the address bar. We have
    IIS 10.0 installed on the localhost (local server).

    +   3. Type the URL `http://localhost/` and press **Enter**. Your page will look
    like this:


    ![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_60_0.png)


    # How it works...


    Once you access your web page through IIS, the page is displayed through HTTP
    port 80. You can try uploading more pages.'
  merge: -1
