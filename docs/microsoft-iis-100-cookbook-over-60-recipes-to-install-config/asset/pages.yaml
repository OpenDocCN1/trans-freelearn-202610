- pgno: 312
  md: '# # Extending IIS 10.0 to FTP


    In this chapter, we will cover the following recipes:


    +   - Understanding FTP

    +   - Installing FTP on IIS 10.0

    +   - Creating, securing, and configuring an FTP site

    +   - Creating an FTP user and managing user permissions

    +   - Testing our FTP server


    # ## Introduction


    The **File Transfer Protocol (FTP)** is used to transfer files between two computers
    over a network and the internet.


    FTP is a standard network protocol used for the transfer of computer files from
    a server to a client using the client–server model on a computer network. FTP''s
    default network port numbers are 20 and 21.


    FTPS, also known as FTPES, FTP-SSL, S-FTP, and FTP Secure, is an extension to
    the commonly used FTP that adds support for the **Transport Layer Security (TLS)**
    and **Secure Sockets Layer (SSL)** cryptographic protocols.'
  merge: -1
  img_proc: true
- pgno: 313
  md: '# Understanding FTP


