  md: '10. We have the Enable checkbox ticked so that compression is enabled. If we
    uncheck the **dynamic content compression** or static content compression checkboxes,
    they will be disabled when you click on the **Apply** button in the **CompressionActions**
    pane.


    IIS routine to maintain at next level of the IIS Server performance of your web
    application considerably.


    +   1. Application Pool Suspension through advance property.

    +   2. Make your page asynchronous if application support.

    +   3. Don’t write in wwwroot.

    +   4. Remove unused view engines and language.

    +   5. Pipeline mode.

    +   6. Remove unused modules.

    +   7. runAllManagedModulesForAllRequests.

    +   8. Kernel mode Cache.

    +   9. Remove methods from Glabal.asax.

    +   10. Don’t use SqlDataSource.

    +   11. Use HTTP Keep Alive.

    +   12. Remove ETag Generally, people ignored these tips but they have enormous
    performance enhancement potential and can be applied quickly on IIS Server to
    boost in a health prospect.


    ![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_402_0.png)


