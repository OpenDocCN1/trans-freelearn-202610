- pgno: 172
  md: '# 6


    # Getting Your Wildcard Host Up and Running


    In this chapter, we will cover the following recipes:


    +   - Understanding wildcard hosts

    +   - Creating a wildcard host

    +   - Configuring a wildcard host

    +   - Uploading .NET web pages to a wildcard host

    +   - Testing uploaded web pages


    # Introduction


    A wildcard host or subdomain is a domain that is a part of a top-level domain
    under the DNS hierarchy. It is used as an easy way to create many unique web addresses
    for specific purposes.


    For example, it could make it easier for users to remember and navigate to the
    demo of a product''s site by placing it at the address `demo.v2mysite.com`. In
    this case, the subdomain is `demo.v2mysite.com`, whereas the main domain is `mysite.com`.'
  merge: -1
  img_proc: true
- pgno: 173
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 174
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 175
  md: '4. Now, open the http://demo.learningpoint.co.in website:


    ![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_175_0.png)


    Here, we are accessing the subdomain demo, and the main, or parent, domain is
    learningpoint.co.in. It has been created for demonstration purposes; the subdomain
    site may later be removed by the owner, in general, there is no guarantee that
    a subdomain will stay forever for reader access.


    For example, consider a company that has several branches over the world. The
    company doesn''t want to change the main domain name, so they decide to create
    a wildcard host or subdomain or child domain of the main domain. Let''s see how
    we can use the main domain and subdomain.'
  merge: -1
  img_proc: true
- pgno: 176
  md: 'The company name is **Learningpoint.co.in**. The main domain for the demo of
    the product section we have created is `demo.learningpoint.co.in`. For the UAE
    office, we can add the subdomain `uae.learningpoint.co.in`.


    Wildcard hosts can be used in several ways, as per the company''s requirements.


    In the next recipe, we will learn how to create a wildcard host on IIS 10.0.


    # How it works...


    In this recipe, we has an overview of wildcard hosts, also called subdomains or
    child domains. We have a parent domain called `learnignpoint.co.in`, and we created
    `demo.learningpoint.co.in`. We can use different names and create unlimited wildcard
    hosts for our parent domain. For a wildcard host, there is no need to pay any
    extra fees for perform registration. If you have a parent domain, you can create
    unlimited wildcard hosts.


    We launched the URL `http://learningpoint.co.in`. We then got redirected to the
    home page of `learningpoint.co.in`. Next, we opened the URL `http://demo.learningpoint.co.in`.
    We were redirected to the home page of `demo.learningpoint.co.in`.


    We also discussed the basics of DNS.


    # Creating a wildcard host


    In this recipe, we are going to create a wildcard host step by step on IIS 10.0.
    We will also create an HTTPS wildcard host and add an SSL certificate on it. We
    will edit the `hosts` file and make an entry for the created wildcard host.


    Let''s move to the following sections, where we will be covering this in detail.


    # Getting ready


    To step through this recipe, you will need a running IIS 10.0 instance. You should
    also have administrative privileges.'
  merge: -1
  img_proc: true
