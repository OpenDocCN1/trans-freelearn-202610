- pgno: 149
  md: '# 5


    # Installing HTTP/2 on IIS 10.0


    In this chapter, we will cover the following recipes:


    +   - Understanding HTTP/2

    +   - Installing HTTP/2 on IIS 10.0

    +   - Configuring HTTP/2 on IIS 10.0

    +   - Uploading .NET web pages

    +   - Testing uploaded web pages


    # Introduction


    HTTP/2 is the newer version of HTTP/1.1, used to reduce the impact of latency
    and connection load on web servers by semantic flow over TCP connections. The
    HTTP/2 protocol can work on Windows 10 and Windows Server 2016. Windows 10 and
    Server 2016 both have the latest version of IIS Server, IIS 10.0. Currently, only
    IIS 10.0 supports HTTP/2. In HTTP/2, a persistent connection can be used to provide
    services to multiple simultaneous requests.


    We know that every TCP connection requires a round trip to set up a connection
    between server and client. HTTP/2 sharply reduces the need for a request to wait
    while a new connection is established or wait for an existing connection to become
    idle.


    HTTP/2 introduces HPACK, a compression scheme for HTTP headers that reduces the
    redundancy between requests. Compression helps multiplexing, because requests
    are smaller. This enables clients to make many requests in their first packets
    on a connection, while TCP flow control windows are still small.'
  merge: -1
  img_proc: true
- pgno: 150
  md: 'HTTP/2 also introduces the concept of **push**: the server responds to requests
    the client hasn''t made yet, but in a form that the client can cache and reuse
    on other pages. If **push** is supported by the underlying connection, two things
    happen:


    +   1. A `PUSH_PROMISE` is sent to the client so that the client can check whether
    the resource already exists in the cache.

    +   2. A new request is added to the request queue for the pushed resource.


    # Understanding HTTP/2


    In this recipe, we are going to understand HTTP/2. We will visit a few websites
    and check whether HTTP/2 is supported or not later in this chapter. We are going
    to see how we can check whether the website is running on HTTP/2 or HTTP/1.1.


    Let''s cover this in detail.


    # Getting ready


    To step through this recipe, you will need a running HTTP/2 website and internet
    connection.


    # How to do it...


    +   1. Open Internet Explorer on your Windows 10 PC or Server 2016; here, we are
    using a Windows 10 PC.

    +   2. Go to the address bar and type `www.google.ae`:'
  merge: -1
  img_proc: true
- pgno: 151
  md: '![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_151_0.png)


    +   3. Once you open `www.google.ae`, it will redirect to `https://www.google.ae/`.
    Now we have to check whether `www.google.com` uses HTTP/2 or HTTP/1.1.

    +   4. Hit F12. You can also do the same as the following step:'
  merge: -1
  img_proc: true
- pgno: 152
  md: '5. Go to **Settings** and enable F12 Developer Tools; you will get DOM Explorer,
    Console, Debugger, Network, Performance, and Memory. Now you have to switch to
    the **Network** tab:


    ![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_152_0.png)


    6. Here, you will see that https://www.google.ae is using HTTP/2. Next, we will
    apply HTTP/2 settings on our IIS 10.0 server in order to use the HTTP/2 protocol.


    # How it works...


    In this recipe, we launched the URL www.google.ae. The browser was automatically
    redirected to https://www.google.ae. Next, we tested for HTTP/2 through developer
    tools, which can be run through the F12 key, or can be enabled from the Settings
    menu.


    # Installing HTTP/2 on IIS 10.0


    In this recipe, we are going to set up HTTP/2 and enable the logging option through
    IIS 10.0. We will also cover how and where we can perform the necessary changes
    in the registry.'
  merge: -1
  img_proc: true
- pgno: 153
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 154
  md: '3. Double-click on Logging. You will see in the next figure that Site is selected
    as the default log file type, and the Log File format is W3C, with a lot of fields
    as options.


    ![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_154_0.png)


    4. Logging configuration steps help us trace log files and check website access
    through HTTP or HTTP/2.


    5. As shown in the figure, One log file per Site means each website has its own
    log file. Hence, it will be easy to use the log file information. We have an option
    to select the log file for the server, so it will create one log file for your
    server. This means that if you have hosted many websites per server and you have
    one log file for that site, it could be very difficult to trace the log information.
    That''s why we have selected site-wise log files--there are a lot of options available
    in W3C logging fields to identify using Hostname, IP address, and port as well
    as Client IP address, and so on. We''ve just verified our recommended selection.'
  merge: -1
  img_proc: true
- pgno: 155
  md: '6. Now you have the option to choose a log file Format; the default selected
    is W3C. Now we have to enable one of the protocols.


    7. Click on the Select fields... option, and you will get the W3C Logging Fields
    window, as shown here:


    ![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_155_0.png)


    8. You have to mark the checkbox for Protocol Version. Protocol Version will generate
    the log file entry for HTTP/1.1 and HTTP/2. Server Request will generate a site-wise
    log file for the website and also log the protocol version to the log file as
    per the client''s requested protocol version. You can see the details of this
    log at C:\inetpub\logs\LogFiles.'
  merge: -1
  img_proc: true
- pgno: 156
  md: '9. Now we have to make a registry entry for HTTP/2. Internet Explorer is connected
    to IIS Server over TLS, which negotiates HTTP/2 via TLS extensions, so you do
    not need to make any changes on the server side. This is because the h2-14 header
    specifying the use of HTTP/2 Draft 14 is sent by default over TLS.


    The protocol version option, which we checked, will generate the log file for
    website access with either the HTTP or HTTP/2 protocols.


    +   1. Command Prompt, type `regedit` as shown in the screenshot, and press Enter.
    Make sure Command Prompt is running with administrator authentication by right-clicking
    on its icon and selecting the **Run as Administrator** option.


    ![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_156_0.png)'
  merge: -1
  img_proc: true
- pgno: 157
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 158
  md: '+   5. You can see a value named `DuoEnabled` with value data `1`. Select **Base**
    as **Hexadecimal**. Click on **OK**.


    ![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_158_0.png)


    +   6. Close the **Registry Editor** and reboot.

    +   7. You have successfully completed the setup of HTTP/2.


    # How it works...


    In this recipe, we first opened IIS Manager and set up logging settings to trace
    the website access log. Logging is nothing but writing information about website
    activity to a log file. We enabled the protocol version, which will help us get
    website-access activity information regarding HTTP and HTTP/2.


