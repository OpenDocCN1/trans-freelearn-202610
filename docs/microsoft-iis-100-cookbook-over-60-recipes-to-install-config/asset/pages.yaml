    IP Address and Domain Restrictions Actions pane. Click on Dynamic IP Restriction
    Settings. You will get a new window:


    ![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_365_0.png)


    10. Here, we set the deny IP address rule based on the number of concurrent requests;
    for example, with the first option, we can allow a single IP address to access
    the website with a maximum of four simultaneous sessions. More than four website
    access requests will be denied (terminated). With the second option, we can require
    that each IP be able to make only a specific number of website access requests
    for a specified time period. We are not configuring this part here, but when you
    publish your website on the internet, you can do this to protect against certain
    cyber attacks.'
  merge: -1
  img_proc: true
