- pgno: 231
  md: '# PowerShell DSC:


    PowerShell DSC is a platform for testing and ensuring the declarative state of
    a system. DSC allows you to scale complex deployments across environments, enables
    collaboration of management, and corrects for configuration drift.


    # PowerShell ISE:


    PowerShell Integrated Scripting Environment (ISE) is a Windows application that
    supports enhanced usage of PowerShell for beginners and experts alike. ISE''s
    many features include:


    +   - A built-in editor for writing, testing, and debugging scripts

    +   - Full IntelliSense tab completion, syntax highlighting, and context-sensitive
    help

    +   - A myriad of keyboard shortcuts

    +   - Support for right-to-left languages

    +   - Extensible add-ons


    For more information, you can refer to https://msdn.microsoft.com/en-us/powershell/mt173057.aspx.


    # IIS administration with PowerShell cmdlets


    In this recipe, we will log in to the different PowerShell remote-management modules
    for Nano Server to manage IIS Server. We will log in through Server Manager to
    PowerShell, and we will also review the PowerShell remote script.


    # Getting ready


    In this recipe, we are going to access Nano Server through PowerShell and the
    IISAdministrator module. You will need a Windows Server 2016 virtual or physical
    instance for remote PowerShell management of Nano Server 2016. For all this installation
    and configuration work, you should have administrative privileges.'
  merge: -1
  img_proc: true
