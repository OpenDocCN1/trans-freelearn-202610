  md: '# Hosting static web page


    In this recipe, we will host our simple HTML web page.


    # Getting ready


    We need to create an HTML web page and have IIS 10.0 running. You will also require
    user administrator rights for hosting the site.


    # How to do it...


    +   1. Open Notepad and type something, like the text shown in the following screenshot.
    You can write anything you want.

    +   2. Save the Notepad file on your desktop with the name of index.html.


