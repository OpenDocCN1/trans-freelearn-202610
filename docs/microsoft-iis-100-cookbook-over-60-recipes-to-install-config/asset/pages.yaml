- pgno: 62
  md: 'The benefit of application pools is that if you have an issue with one of the
    application pools, it will only effect the associated application pool.


    Application pools enable us to isolate our web application for better security,
    reliability, and availability.


    Two types of application pipelines are available. We can select integrated mode
    (supports IIS 7.5 or later versions) or classic mode (IIS 6.0).


    # Understanding application pools in IIS 10.0


    In this recipe, we will understand application pools. We can simply say that the
    application pool is the heart of IIS 10.0. Application pools are logical groupings
    of web applications that will execute in a common process, thereby allowing greater
    granularity over which programs are clustered together in a single process. For
    example, if you require every web application to execute in a separate process,
    you simply go and create an application pool for each application of different
    framework versions.


    Let''s say that we have more than one version of a website, one that supports
    framework 2.0 and another one supporting framework 4.0 or some different application
    such as PHP or WordPress. All these website process are managed through application
    pools.


    # Getting ready


    To step through this recipe, you will need a running IIS 10.0 instance. You should
    also have administrative privilege.'
  merge: -1
  img_proc: true
- pgno: 63
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 64
  md: '3. Click on **DefaultAppPool**, and then you will get the **Actions** panel
    of **DefaultAppPool**. Here, you will get the option **Application Pool Tasks**
    highlighted in the right-hand side, with which you may **Start**, **Stop**, and
    **Recycle** the services of IIS 10.0.


    ![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_64_0.png)


    5. In the **Edit Application Pool** section, you can change the settings of the
    application pool to **Basic Settings...** and **Advanced Settings...**, **Rename**
    the application pool, and also perform **Recycling....**'
  merge: -1
  img_proc: true
- pgno: 65
  md: '# How it works...


    Let''s take a look at what we explored in IIS Manager and application pools. We
    understood the basics of application pools and the properties in which we can
    get the changes we want made. The default IIS 10.0 application pool framework
    is v4.0, which is supported up to v4.6, but we have some more options for installing
    different versions of the application pool. We can easily customize the application
    pool, which helps us fulfill our typical web application requirements.


    We have several options for application pools in the action pane. We can add a
    new application pool and we can start, stop, and recycle application pool tasks.
    We can perform editing and automated recycling as well.


    In the next recipe, we will learn more about application pools to install lower
    framework versions.


    # Installation of lower framework version


    In this recipe, we are going to install framework 3.5 on Windows Server 2016.
    By default, IIS 10.0 has framework version 4.0. We will install the lower version
    of the framework, which supports web applications with .NET framework versions
    2.0 through 3.5.


    For example, if you have a web application you created a few years back and it
    was developed in the v2.0 .NET framework, you can use this recipe in order to
    make it run on IIS 10.0. Let''s begin.


    # Getting ready


    To step through this recipe, you need to install framework v3.5, which is based
    on the v2.0 framework. You will need a Windows Server 2016 instance. You should
    have the Server 2016 OS media for the framework 3.5 files or an Internet connection.
    You also need admin privileges.'
  merge: -1
  img_proc: true
