- pgno: 214
  md: '# How it works...


    In this recipe, we performed some management tasks for IIS 10.0 on Nano Server.
    We added the Nano Server IP 172.16.15.63 as a trusted host for the WIN2016IIS
    server and connected Nano Server using a remote PowerShell command. We also checked
    the listed default website on IIS server. We used PowerShell commands to start
    and stop the website''s default website services.


    # Creating an IIS 10.0 website on Nano Server


    In this recipe, we''ll use PowerShell commands to connect to our Nano Server instance.
    We will import the IIS administration module and create a website. Finally, we
    will check the website''s status.


    # Getting ready


    To step through this recipe, we are going to create a website in IIS 10.0 on Nano
    Server 2016 through PowerShell. IIS 10.0 on Nano Server can only be managed using
    PowerShell. You will need Nano Server 2016 with the IIS package installed. For
    all this installation and configuration work, you should have administrative privileges.


    # How to do it...


    +   1. Go to the **WIN2016IIS** server to connect to Nano Server 2016 through
    PowerShell. We have to first log in to the **WIN2016IIS** server or (a Windows
    Server 2016 or Windows 10 machine will do). We will use PowerShell to remotely
    connect to Nano Server 172.16.15.63. This is the IP in my case, but it can be
    different in yours.

    +   2. Open PowerShell with administrative rights on the **WIN2016IIS** server.
    Press *Windows + R* key from your keyboard. You will get the **Run** window.

    +   3. Type the command `RunAs /user:Administrator PowerShell_ISE.exe` in the
    **Run** window and click on **OK**. Now it will ask you the administrator password
    of **WIN2016IIS**, so type in the password for **WIN2016IIS** and press *Enter*.
    You will see PowerShell open with administrative rights.'
  merge: -1
  img_proc: true
- pgno: 215
