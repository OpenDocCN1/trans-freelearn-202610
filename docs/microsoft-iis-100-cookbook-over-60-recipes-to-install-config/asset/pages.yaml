    .NET Extensibility 4.6, ASP, ASP.NET 3.5, ASP.NET 4.6, ISAPI Extensions, and ISAPI
    Filters.


    4. Click on Next to finish. Now let''s go on and upload the .NET framework web
    pages we created for demo purposes.'
