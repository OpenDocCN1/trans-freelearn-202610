- pgno: 83
  md: '# Edit Application Pool Recycling Settings


    # Recycling Events to Log


    Event log entries can be generated when an application pool is recycled. Select
    the recycling events to log.


    Configurable recycling events:


    +   - Regular time intervals

    +   - Scheduled time(s)

    +   - Virtual memory usage

    +   - Private memory usage

    +   - Number of requests


    Runtime recycling events:


    +   - On-demand

    +   - Configuration changes

    +   - Unhealthy ISAPI


    19. In the Recycling Events to Log window, we can generate a log of the recycling
    events.


    # How it works...


    In this recipe, we learned about three types of properties of IIS applications:
    basic properties, advanced properties, and recycling. We can use these properties
    for the web applications we will host in IIS Server to process them through the
    application pool. When hosting a web application, there are always some requirements
    we need to configure in the application pool settings.'
  merge: -1
  img_proc: true
- pgno: 84
  md: 'For example, our management may decide that we need to limit the queue of 2and3.5apppool
    applications. We can just go to the advanced settings and change it.


    In the next section, we will host a v4.0 .NET framework website and make use of
    the v4.0 application pool.


    # Hosting .NET web page


    In this recipe, we are going to host a .NET default v4.0-supported web page. We
    will check out the default website properties. We will upload the web page to
    the default `wwwroot` directory.


    # Getting ready


    We need a v4.0 application to be installed on IIS 10.0 Server, and our v4.0 .NET
    web page should be ready. We''ll need to install some IIS components not installed
    already in IIS 10.0. For this, you must have administrative privileges.


    # How to do it...


    First, we have to install some .NET supported components.


    +   1. Open Server Manager on Windows Server 2016 and click on the **Manage**
    menu. Once in there, click on **Add Roles and features**.

    +   2. Click on **Next** until you get the **Select server roles** wizard. Follow
    the exact route highlighted in this figure:'
  merge: -1
