- pgno: 73
  md: '# How it works...


    In this recipe, the IIS administrator was installed on framework v3.5. The version
    3.5 framework on Windows Server 2016 helps us run built-in .NET v2.0 or v3.5 applications.
    Framework v3.5 processes applications built in framework v3.5 or v2.0.


    We also found out where the sources\sxs folder is, and after installation, we
    verified that .NET framework v3.5 is available.


    We will now create an application pool that will support .NET framework v3.5.


    # Creating different application pools in IIS 10.0


    In this recipe, we are going to create an application pool that supports .NET
    versions 2.0 to 3.5. We already have the default application pool available for
    4.0. This recipe will guide you through creating the different application pools
    you require.


    # Getting ready


    In this recipe, we need IIS 10.0 and .NET framework 3.5. You should have administrative
    privileges.


    # How to do it...


    +   1. Open Server Manager on Windows Server 2016. Click on the Tools menu and
    open IIS Manager.'
  merge: -1
  img_proc: true
- pgno: 74
  md: '2. Expand the IIS server (WIN2016IIS). You''ll get the listed Application Pools.
    Have a look:


    ![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_74_0.png)


    3. This screenshot shows that under the application pools, we have DefaultAppPool
    with the Status showing Started, version v4.0, and Managed Pipeline showing Integrated.


    4. Let''s create a new application pool for v2.0 and an integrated pipeline.'
  merge: -1
  img_proc: true
- pgno: 75
  md: '5. Click on **Add Application Pool** in the **Actions** window, which is available
    on the right-hand side. You will get the **Add Application Pool** wizard:


    ![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_75_0.png)


    6. Choose an application display name according to your application name to identify
    it easily. I''ve named my pool **2and3.5AppPool**. The name shows that it will
    support both 2.0 and 3.5 .NET framework versions.


    ![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_75_1.png)'
  merge: -1
  img_proc: true
- pgno: 76
  md: '7. Next, we have .NET CLR version. Click on the dropdown menu and select .NET
    Version V2.0.50727. This .NET CLR version supports 2.0 and 3.5 framework websites.


    8. Next, we have the Managed pipeline mode dropdown menu. We can select from Integrated
    or Classic mode. We will select the Integrated managed pipeline mode in this example.


    ![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_76_0.png)


    9. You can also select the auto-start option while creating the application pool.
    Select Start application immediately so that once the application pool is created,
    it starts automatically. If you uncheck the start application checkbox, you can
    start it later manually from the Actions window. Click on the OK button. Now you
    have successfully created your application pool. You can find the newly created
    application pool in the Application Pools list.


    # How it works...


    Application pools process one or more web applications. We created an application
    pool, for which we have to set the website property to update configurations.
    You may set the property of the framework to one that your web application supports.'
  merge: -1
  img_proc: true
