  #### Getting ready\n\n要逐步完成本食谱，你需要一个正在运行的 IIS 10.0 实例。你还应具有管理员权限。\n\n#### How to\
  \ do it...\n\n- 1. 在 Windows Server 2016 上打开 Server Manager。点击 Tools 菜单并打开 IIS Manager。\n\
  - 2. 展开 IIS 服务器（WIN2016IIS）。我们可以看到列出的 Application Pools 和 Sites。你将看到三个已列出的网站——mysite.com、v2mysite.com\
  \ 和 v4mysite.com——我们已经创建了它们。在这里，我们仅使用其中一个。\n- 3. 在左侧 Sites 面板下展开 mysite.com：\n\n\
  ![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_132_0.png)\n\n- 4. 我们现在要回顾虚拟目录。我们已经在网站\
  \ mysite.com 内部创建了一个名为 virtualdirectory 的虚拟目录。\n- 5. 一旦我们选择 `virtualdirectory`，我们将在右侧面板的\
  \ Actions 下看到 `virtualdirectory` 的属性——Edit Permissions...、Basic Settings... 和 Advanced\
  \ Settings...。我们也可以浏览虚拟目录。\n- 6. **virtualdirectory** 功能帮助我们查看 **mysite.com** 中所有可用的选项。\n\
  - 7. 在当前示例中，你可以看到子网站的 **virtualdirectory** 条目，它位于 **mysite.com** 下。\n\n#### How\
  \ it works...\n\n在本食谱中，我们打开了 Server Manager 和 IIS Manager。在 **Connections** 窗格中，我们选择了\
  \ **Sites** 文件夹。我们展开了 **Sites**。我们已经创建了一个虚拟目录并将其命名为 `virtualdirectory`。接下来，我们检查了虚拟目录并对\
  \ `virtualdirectory` 进行了属性概述，在此我们可以管理权限以及基本和高级设置。\n\n### Configuring virtual directories\
  \ in IIS 10.0\n\n在本食谱中，我们将逐步配置虚拟目录。我们将修改虚拟目录的默认文档设置和物理目录的权限。我们还将设置虚拟目录的基本和高级设置。\n\
  \n#### Getting ready\n\n要逐步完成本食谱，你需要一个已创建虚拟目录的正在运行的 IIS 10.0 实例。你还应具有管理员权限。\n\n\
  #### How to do it...\n\n- 1. 在 Windows Server 2016 上打开 Server Manager。点击 **Tools**\
  \ 菜单并打开 IIS Manager。\n- 2. 展开 IIS 服务器（**WIN2016IIS**）。我们可以看到列出的 **Application pools**\
  \ 和 **Sites** 文件夹。\n- 3. 在 **Connections** 面板下展开 **Sites** 文件夹，点击 **mysite.com**，你将在右上角看到\
  \ **Actions** 面板，在其下你将看到 VirtualDirectory 的 **Edit Permissions...** 选项。\n- 4. 点击\
  \ **Edit Permissions...**，你将获得 **VirtualDirectory** 的属性。这些是物理文件夹属性。转到 **Security**\
  \ 选项卡并点击 **Edit**。\n- 5. 找到 **IUSR** 用户和 **IIS_IUSRS** 组并将它们添加到 **Security** 选项卡。点击默认权限框中的\
  \ **Read & execute**、**List folder contents** 和 **Read**。这些设置用于通过 Web 用户或网站应用程序访问网站；IIS_IUSRS\
  \ 和 IUSR 用于应用程序池的内部身份验证和通信。\n- 6. IIS_IUSRS 是 IIS 工作进程帐户的组。这意味着应用程序池本身运行的身份。IUSR\
  \ 是匿名用户身份。\n\n![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_134_0.png)\n\n- 7. 点击 OK\
  \ 按钮完成。接下来，你需要点击虚拟目录的 **Basic Settings...**，它位于 **Actions** 窗格中：\n\n![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_135_0.png)\n\
  \n- 8. 在 **Basic Settings...** 中，你有更改 `virtualdirectory` 物理路径的选项；我们可以将 **Connect\
  \ as...** 设置设为屏幕截图中所示，但保持其默认值。\n\n![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_135_1.png)\n\
  \n- 9. 我们可以选择特定用户来访问此目录或 IIS 内部应用程序池默认的 IUSR 用户之一。我们已为测试连接选择了默认选项，Application user。\n\
  - 10. 点击 OK 按钮，转到 Basic Settings...，并点击屏幕截图中所示的 Test Settings 按钮。你将通过选择在上一个食谱中创建的\
  \ VirtualDirectory 获得此选项。转到右侧的 Actions 面板，并点击 Basic Settings...。用于编辑虚拟目录的属性编辑窗口出现。你会找到的最后一个选项是\
  \ Test Settings，它将打开以下窗口。在 Test Connection 下，你将有两个 Test results，Authentication 和\
  \ Authorization，它们负责验证应用程序池和虚拟目录的物理路径。\n\n![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_136_0.png)\n\
  \n- 11. Test Connection 窗口显示网站的应用程序池身份验证是直通身份验证（defaultAppPool）应用程序池。应用程序池通过默认 IIS\
  \ 用户 IUSR 或 IIS_IUSRS 组进行身份验证。我们没有设置任何授权，因此它显示我们 **Cannot verify access to path**。点击\
  \ **Close** 按钮，然后移动到 **Advanced Settings....**\n- 12. 如图所示，在 **Actions** 面板中点击 **Advanced\
  \ Settings...**：\n\n![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_137_0.png)\n\n- 13.\
  \ 在这里，**Advanced Settings...** 用于更改 **virtualdirectory** 的 **Physical Path**、**Physical\
  \ Path Credentials** 和 **Physical Path Credentials Logon type**。\n- 14. 接下来，我们需要在\
  \ **Default Document** 中应用设置，这将帮助我们访问我们在上一个食谱中添加的 `Demo.html` 页面。\n- 15. 从 **Sites**\
  \ 文件夹展开 **mysite.com** 并选择 `virtualdirectory`。你将在中间窗格中看到 **Default Document** 选项。\n\
  \n- 9. 右键点击 virtualdirectory 并点击 Convert to Application。一旦你将其转换，虚拟目录图标将会更改，你可以在上一个图中看到它被高亮显示：\n\
  \n![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_142_0.png)\n\n- 10. 接下来，你将获得 Add Application\
  \ 窗口，如上一个图所示。只有 Change Application Pool 选项可用；你可以选择 2and3.5AppPool 应用程序池。点击 OK 按钮。\n\
  - 11. 现在你创建了两个具有不同应用程序池的虚拟目录：VDApplication 使用 DefaultAppPool，Virtual Directory 使用\
  \ 2and3.5AppPool。\n\n#### How it works...\n\n在本食谱中，我们在步骤 1 到 6 中创建了应用程序目录和虚拟应用程序目录，并向虚拟目录添加了应用程序池。在步骤\
  \ 7 到 11 中，我们从现有虚拟目录添加了自定义应用程序池。\n\n\n\n\n### 上传 .NET 网页\n\n在本操作指南中，我们将上传网站应用程序页面。这些网站应用程序页面使用\
  \ .NET framework 4 开发。这些网站应用程序页面将从 VDapplication 应用程序池的虚拟目录中运行。\n\n虚拟目录 virtualdirectory\
  \ 的网站应用程序页面已使用 .NET framework 2.0 开发。\n\n#### 准备工作\n\n要完成本操作指南，你需要一个正在运行的 IIS 10.0\
  \ 实例，并已创建好虚拟目录。你还应具有管理员权限。\n\n#### 操作步骤...\n\n- 1. 在 Windows Server 2016 上打开“服务器管理器”。单击“工具”菜单并打开“IIS\
  \ 管理器”。\n- 2. 展开 IIS 服务器（WIN2016IIS）。你将看到列出的所有应用程序池和站点。你将看到三个列出的网站：mysite.com、v2mysite.com\
  \ 和 v4mysite.com。我们已经创建了它们。\n\n![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_145_0.png)\n\
  \n- 7. 将你的 4.0 版网站应用程序页面复制并粘贴到 `C:\\WebSites\\VDApplication\\` 文件夹中。\n- 8. 现在我们需要单击\
  \ virtualdirectory，然后转到“操作”面板。单击“浏览”，并将它们粘贴到 2.0 版网站应用程序页面文件夹中：\n\n![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_145_1.png)\n\
  \n- 9. 关闭虚拟目录和物理文件夹。\n- 10. 打开 IIS 管理器，展开 mysite.com，并单击 VDapplication 虚拟目录。前往功能视图，打开“默认文档”，然后将\
  \ `default.aspx` 添加到顶部。对 virtualdirectory 重复相同步骤。\n\n#### 工作原理...\n\n我们已经创建了两个虚拟目录：VDapplication\
  \ 和 virtualdirectory。我们将 4.0 版网站应用程序文件上传到 VDapplication 虚拟目录，将 2.0 版网站应用程序文件上传到\
  \ virtualdirectory。我们还为默认主页配置了默认文档条目。\n\n### 测试上传的网页\n\n在本操作指南中，我们将测试使用 framework\
  \ 4 开发并上传到自定义虚拟目录 VDapplication 池中的 Web 应用程序页面。较低版本（framework 2.0）的 Web 应用程序页面已上传到\
  \ virtualdirectory 虚拟目录。\n\n我们还将使用自定义虚拟目录测试普通 HTML 页面。\n\n#### 准备工作\n\n要完成本操作指南，你需要一个正在运行的\
  \ IIS 10.0 实例，并已创建好虚拟目录和网站应用程序。\n\n#### 操作步骤...\n\n- 1. 在 Windows Server 2016 上打开“服务器管理器”。单击“工具”菜单并打开“IIS\
  \ 管理器”。\n- 2. 展开 IIS 服务器（WIN2016IIS）。你将在“连接”窗格中看到应用程序池和站点列表。你会看到三个列出的网站，这些网站在上一个操作指南中已上传：mysite.com、v2mysite.com\
  \ 和 v4mysite.com。\n- 3. 转到“站点”文件夹，展开 mysite.com，并单击 virtualdirectory。这是一个使用默认应用程序池的简单虚拟目录。\n\
  - 4. 转到**操作**面板并单击**浏览**。你将获得 `http://mysite.com/virtualdirectory` URL：\n\n![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_147_0.png)\n\
  \n- 5. 现在让我们测试之前步骤中为**VDapplication**和**virtualdirectory**创建的两个自定义虚拟目录站点。你可以通过任何浏览器访问这两个站点\
  \ URL，但在我的案例中，我使用了 Internet Explorer。\n- 6. 打开 Internet Explorer，在地址栏中输入 URL `http://mysite.com/vdapplication`。你将看到网站应用程序：\n\
  \n![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_147_1.png)\n"
- "## 5. 在 IIS 10.0 上安装 HTTP/2\n\n在本章中，我们将介绍以下操作指南：\n\n- 了解 HTTP/2\n- 在 IIS 10.0 上安装\
  \ HTTP/2\n- 在 IIS 10.0 上配置 HTTP/2\n- 上传 .NET 网页\n- 测试上传的网页\n\n### 简介\n\nHTTP/2 是\
  \ HTTP/1.1 的更新版本，通过在 TCP 连接上进行语义流传输，减少延迟和连接负载对 Web 服务器的影响。HTTP/2 协议可在 Windows 10\
  \ 和 Windows Server 2016 上运行。Windows 10 和 Server 2016 都拥有最新版本的 IIS 服务器，即 IIS 10.0。目前，只有\
  \ IIS 10.0 支持 HTTP/2。在 HTTP/2 中，可以使用持久连接为多个同时请求提供服务。\n\n我们知道，每个 TCP 连接都需要一次往返来在服务器和客户端之间建立连接。HTTP/2\
  \ 大大减少了请求在新连接建立时等待，或等待现有连接变为空闲的需求。\n\nHTTP/2 引入了 HPACK，这是一种用于 HTTP 标头的压缩方案，可减少请求之间的冗余。压缩有助于多路复用，因为请求更小。这使得客户端可以在连接上发送首批数据包时发出大量请求，而此时\
  \ TCP 流控制窗口仍然很小。\n\nHTTP/2 还引入了**推送**的概念：服务器响应客户端尚未发出的请求，但以客户端可以缓存并在其他页面上重用的形式进行。如果底层连接支持**推送**，则会发生两件事：\n\
  \n- 1. 向客户端发送一个 `PUSH_PROMISE`，以便客户端可以检查资源是否已存在于缓存中。\n- 2. 将一个新请求添加到被推送资源的请求队列中。\n\
  \n### 了解 HTTP/2\n\n在本操作指南中，我们将了解 HTTP/2。我们将在本章稍后访问几个网站，并检查是否支持 HTTP/2。我们将了解如何检查网站运行在\
  \ HTTP/2 还是 HTTP/1.1 上。\n\n让我们详细介绍一下。\n\n#### 准备工作\n\n要完成本操作指南，你需要一个正在运行的 HTTP/2\
  \ 网站和互联网连接。\n\n#### 操作步骤...\n\n- 1. 在 Windows 10 PC 或 Server 2016 上打开 Internet Explorer；这里我们使用\
  \ Windows 10 PC。\n- 2. 转到地址栏并输入 `www.google.ae`：\n\n![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_151_0.png)\n\
  \n- 3. 打开 `www.google.ae` 后，它会重定向到 `https://www.google.ae/`。现在我们需要检查 `www.google.com`\
  \ 使用的是 HTTP/2 还是 HTTP/1.1。\n- 4. 按 F12。你也可以按以下步骤操作：\n- 5. 转到**设置**并启用 F12 开发者工具；你将看到\
  \ DOM 资源管理器、控制台、调试器、网络、性能和内存。现在你需要切换到**网络**选项卡：\n\n![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_152_0.png)\n\
  \n- 6. 在这里，你将看到 `https://www.google.ae` 正在使用 HTTP/2。接下来，我们将在 IIS 10.0 服务器上应用 HTTP/2\
  \ 设置，以使用 HTTP/2 协议。\n\n#### 工作原理...\n\n在本操作指南中，我们启动了 URL www.google.ae。浏览器自动重定向到\
  \ https://www.google.ae。接下来，我们通过开发者工具测试 HTTP/2，该工具可以通过 F12 键运行，也可以从“设置”菜单启用。\n\n\
  ### 在 IIS 10.0 上安装 HTTP/2\n\n在本操作指南中，我们将通过 IIS 10.0 设置 HTTP/2 并启用日志记录选项。我们还将介绍如何在注册表中进行必要的更改以及在何处进行更改。\n\
  \n- 3. 双击“日志记录”。在下一张图中，你会看到“站点”被选为默认日志文件类型，日志文件格式为 W3C，并且有许多字段可供选择。\n\n![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_154_0.png)\n\
  \n- 4. 日志记录配置步骤可帮助我们跟踪日志文件，并通过 HTTP 或 HTTP/2 检查网站访问情况。\n- 5. 如图所示，“每个站点一个日志文件”意味着每个网站都有自己的日志文件。因此，使用日志文件信息将很容易。我们还可以选择为服务器指定日志文件，这样它将为你的服务器创建一个日志文件。这意味着，如果你在一台服务器上托管了许多网站，并且该服务器只有一个日志文件，那么跟踪日志信息可能非常困难。这就是我们选择按站点划分日志文件的原因——W3C\
  \ 日志记录字段中有很多选项，可用于通过主机名、IP 地址、端口以及客户端 IP 地址等来识别。我们刚刚验证了我们推荐的选项。\n\n\n\n\n\n6. 现在你可以选择日志文件格式；默认选择的是\
  \ W3C。现在我们需要启用其中一种协议。\n\n7. 点击 Select fields... 选项，你将得到 W3C Logging Fields 窗口，如下所示：\n\
  \n![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_155_0.png)\n\n8. 你需要勾选 Protocol Version\
  \ 的复选框。Protocol Version 将为 HTTP/1.1 和 HTTP/2 生成日志文件条目。Server Request 将为网站生成站点级日志文件，并根据客户端请求的协议版本将协议版本记录到日志文件中。你可以在\
  \ C:\\inetpub\\logs\\LogFiles 查看此日志的详细信息。\n\n9. 现在我们需要为 HTTP/2 创建一个注册表项。Internet\
  \ Explorer 通过 TLS 连接到 IIS 服务器，TLS 通过 TLS 扩展协商 HTTP/2，因此你无需在服务器端进行任何更改。这是因为指定使用 HTTP/2\
  \ Draft 14 的 h2-14 头默认通过 TLS 发送。\n\n我们勾选的协议版本选项将为使用 HTTP 或 HTTP/2 协议的网站访问生成日志文件。\n\
  \n- 1. 在命令提示符中，输入 `regedit` 如屏幕截图所示，然后按 Enter。确保命令提示符以管理员身份运行，方法是右键单击其图标并选择 **Run\
  \ as Administrator** 选项。\n\n![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_156_0.png)\n\
  \n- 5. 你可以看到一个名为 `DuoEnabled` 的值，其值数据为 `1`。选择 **Base** 为 **Hexadecimal**。点击 **OK**。\n\
  \n![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_158_0.png)\n\n- 6. 关闭 **Registry Editor**\
  \ 并重新启动。\n- 7. 你已成功完成 HTTP/2 的设置。\n\n#### How it works...\n\n在本教程中，我们首先打开了 IIS 管理器并设置了日志设置以追踪网站访问日志。日志记录无非是将网站活动信息写入日志文件。我们启用了协议版本，这将帮助我们获取有关\
  \ HTTP 和 HTTP/2 的网站访问活动信息。\n\n然后我们打开了注册表编辑器并创建了一个名为 **DuoEnabled** 的条目，该条目将用于 HTTP/2\
  \ 协议。\n\n### Configuring HTTP/2 on IIS 10.0\n\n在本教程中，我们将配置一个 HTTP/2 网站。网站将通过 HTTPS\
  \ 端口访问。我们还将介绍如何添加/安装证书并将该证书附加到网站。\n\n#### Getting ready\n\n要逐步完成本教程，你需要一个正在运行的 IIS\
  \ 10.0 实例。你还应具有管理员权限。\n\n#### How to do it...\n\n- 1. 在 Windows Server 2016 上打开服务器管理器。点击\
  \ Tools 菜单并打开 IIS 管理器。\n- 2. 选择 IIS 服务器（WIN2016IIS）。你将得到功能视图，其中可以找到 Server Certificates\
  \ 选项：\n\n![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_159_0.png)\n\n- 3. 我们已经创建了两个证书。这些是用于测试的本地证书。它们不适用于生产环境。在这里，我们将使用现有的用户证书名称\
  \ Packt；你会看到它是由 Issued To WIN2016IIS.Call.com 发行的，并且也可以看到其 Certificate Hash 键。证书哈希用于加密我们访问的网站数据，并且它使用哈希算法来加密网站数据并解密。IIS\
  \ 10.0 使用 SHA256 256 位加密。证书存储具有列出的证书类别；我们将使用 WebHosting。\n\n10. 你也可以检查证书。点击 View\
  \ 按钮，你将得到证书属性：\n\n![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_163_0.png)\n\n11. 证书属性将向你显示有关证书的一般信息，详细信息选项卡将向你显示有关证书属性配置和类型的完整详细信息。证书路径具有有关证书是否安装在本地或远程服务器上及其状态的信息。现在点击\
  \ OK。再次点击 OK 以添加站点绑定。现在你将来到站点绑定窗口：\n\n![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_164_0.png)\n\
  \n12. 在站点绑定列表中，HTTP 和 HTTPS 绑定类型必须具有相同的主机名。\n\n13. 为站点绑定窗口点击 OK。你现在已将选定的网站 v4mysite.com\
  \ 配置为使用 HTTP/2。\n\n#### How it works...\n\n在本教程中，我们打开了服务器证书设置页面并找到了我们创建的证书。服务器证书用于\
  \ HTTPS 网站绑定。我们为网站 v4mysite.com 添加了 HTTPS 绑定。我们还查看了证书属性。现在你拥有两种类型的绑定，HTTP 和 HTTPS。\n\
  \n### Uploading .NET web pages\n\n在本教程中，我们将把使用 .NET 框架版本 4.0 制作的网站页面上传到 v4mysite.com。我们将概述相关的应用程序池，并为\
  \ v4mysite.com 物理文件夹路径部署网页。\n\n#### Getting ready\n\n我们需要在 IIS 10.0 服务器上安装版本 4.0\
  \ 应用程序。你还应具有管理员权限。\n\n#### How to do it...\n\n- 1. 在 Windows Server 2016 上打开服务器管理器。点击\
  \ Tools 菜单并打开 IIS 管理器。\n- 2. 展开 IIS 服务器（WIN2016IIS）。我们得到列出的应用程序池和站点。\n- 3. 展开 Sites\
  \ 文件夹，你将得到三个网站：mysite.com、v2mysite.com 和 v4mysite.com。选择 v4mysite.com，因为我们已经对其进行了\
  \ HTTP/2 配置的初始设置。现在你需要上传 .NET 框架版本 4.0 的网站页面。\n\n6. 编辑站点窗口为我们提供了 v4mysite.com 的物理路径\
  \ C:\\inetpub\\wwwroot\\v4mysite 的详细信息。你可以浏览该路径并粘贴网站页面；同时，我们也可以交叉检查版本 4.0 应用程序是否与\
  \ v4mysite.com 关联。\n\n7. 点击应用程序池列中的 Select 按钮。你将得到名为 DefaultAppPool 的应用程序池。一旦点击\
  \ Select 按钮，你将得到应用程序池详细信息窗口：\n\n![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_167_0.png)\n\
  \n8. 你现在可以看到 DefaultAppPool 属性已正确设置。此应用程序池的版本为 4.0。关闭应用程序池窗口和编辑站点窗口。\n\n9. 让我们移动到\
  \ IIS 管理器。展开 Sites 并点击 v4mysite.com。\n\n10. 转到 Actions 面板，点击 Explore，它将带你到 v4mysite.com\
  \ 网站的物理路径：\n\n![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_167_1.png)\n\n5. 转到 **Actions**\
  \ 面板，点击 **Browse v4mysite.com on 172.16.15.61:443**，你将得到如下图所示的页面：\n\n![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_170_0.png)\n\
  \n6. 在 Internet Explorer 中，你将得到 **v4mysite.com** 网站的 HTTPS。现在你需要按 *F12*。你将得到开发者窗口。刷新网站。现在你应该能够看到在网络选项卡下，高亮的协议是\
  \ HTTP/2。\n\n7. 让我们从浏览网站选项打开 http://v4mysite.com:80 网站：\n\n![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_171_0.png)\n\
  \n8. 在这里我们可以看到我们正在使用 HTTP 浏览 v4mysite.com。\n\n#### How it works...\n\n在本教程中，我们首先打开了\
  \ IIS 管理器并查看了两种不同类型的网站浏览选项。我们测试了 v4mysite.com 的 HTTPS 版本，并看到它在 HTTP/2 上运行正常。\n\n\
  我们还使用 HTTP 对其进行了测试，并成功使用该协议使用了 v4mysite.com。\n\n## \n"
- "## 6. Getting Your Wildcard Host Up and Running\n\n在本章中，我们将介绍以下教程：\n\n- 理解通配符主机\n\
  - 创建通配符主机\n- 配置通配符主机\n- 向通配符主机上传 .NET 网页\n- 测试已上传的网页\n\n### Introduction\n\n通配符主机或子域名是\
  \ DNS 层次结构下属于顶级域的一部分的域名。它被用作为特定目的创建许多唯一网络地址的简便方法。\n\n例如，它可以让用户更轻松地记住并导航到产品站点的演示，将其放在地址\
  \ `demo.v2mysite.com`。在这种情况下，子域名是 `demo.v2mysite.com`，而主域名是 `mysite.com`。\n\n\n\n\
  \n\n4. 现在，打开 http://demo.learningpoint.co.in 网站：\n\n![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_175_0.png)\n\
  \n在这里，我们访问的是子域名 demo，而主域名或父域名是 learningpoint.co.in。它是为演示目的而创建的；子域名站点日后可能会被所有者移除，通常情况下，无法保证子域名会永久供读者访问。\n\
  \n例如，考虑一家在世界各地设有多个分支的公司。该公司不想更改主域名，因此决定为主域名创建通配符主机或子域名或子域。让我们看看如何使用主域名和子域名。\n\n\
  公司名称是 **Learningpoint.co.in**。我们为产品部分演示创建的主域名是 `demo.learningpoint.co.in`。对于阿联酋办公室，我们可以添加子域名\
  \ `uae.learningpoint.co.in`。\n\n通配符主机可以根据公司的需求以多种方式使用。\n\n在下一个食谱中，我们将学习如何在 IIS 10.0\
  \ 上创建通配符主机。\n\n#### How it works...\n\n在本食谱中，我们对通配符主机进行了概述，也称为子域名或子域。我们有一个父域名 `learningpoint.co.in`，并创建了\
  \ `demo.learningpoint.co.in`。我们可以使用不同的名称为父域名创建无限个通配符主机。对于通配符主机，无需支付任何额外费用即可进行注册。如果您拥有父域名，则可以创建无限个通配符主机。\n\
  \n我们启动了 URL `http://learningpoint.co.in`。然后我们被重定向到 `learningpoint.co.in` 的主页。接下来，我们打开了\
  \ URL `http://demo.learningpoint.co.in`。我们被重定向到 `demo.learningpoint.co.in` 的主页。\n\
  \n我们还讨论了 DNS 的基础知识。\n\n### Creating a wildcard host\n\n在本食谱中，我们将逐步在 IIS 10.0 上创建一个通配符主机。我们还将创建\
  \ HTTPS 通配符主机并在其上添加 SSL 证书。我们将编辑 `hosts` 文件并为创建的通配符主机添加条目。\n\n让我们进入以下各节，我们将在其中详细介绍。\n\
  \n#### Getting ready\n\n要逐步完成本食谱，您需要一个正在运行的 IIS 10.0 实例。您还应具有管理员权限。\n\n#### How\
  \ to do it...\n\n- 1. 在 Windows Server 2016 上打开服务器管理器。单击工具菜单并打开 IIS 管理器。\n- 2. 展开\
  \ IIS 服务器 (**WIN2016IIS**)。我们随后会列出 **应用程序池** 和 **站点**。\n- 3. 展开 **站点** 选项。您将获得现有网站的列表：**mysite.com**、**v2mysite.com**\
  \ 和 **v4mysite.com**。\n\n![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_177_0.png)\n\n\
  - 4. 单击站点文件夹，转到 **操作** 面板，您将获得 **添加网站...** 选项。您可以在前一幅图中看到此选项已突出显示。\n\n### Getting\
  \ Your Wildcard Host Up and Running\n\n15. 使用管理员权限在记事本中打开 hosts 文件。按以下屏幕截图中突出显示的方式进行条目设置：\n\
  \n![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_181_0.png)\n\n16. 现在您已完成域名 `SSL.v2mysite.com`\
  \ 和 IP `172.16.15.60` 的所有必需条目。按 Tab 键并输入域名 `SSL.v2mysite.com`，并为域名 `demo.v2mysite.com`\
  \ 和 IP `172.16.15.60` 再添加一个条目。\n\n#### How it works...\n\n在本食谱中，我们添加了一个名为 http://demo.v2mysite.com\
  \ 的通配符主机。此外，我们还添加了一个使用 HTTPS 协议的通配符主机 https://ssl.v2mysite.com。然后我们将其分配给 https://ssl.v2mysite.com\
  \ 通配符主机。\n\n### Configuring a wildcard host\n\n在本食谱中，我们将为应用程序池配置通配符主机 SSL.v2mysite.com。我们将实现通配符主机的默认文档设置，以及该通配符主机的权限。我们还将实现通配符主机的基本和高级设置。\n\
  \n#### Getting ready\n\n要逐步完成本食谱，您需要一个正在运行的 IIS 10.0 实例。您应已创建通配符主机。您还应具有管理员权限。\n\
  \n#### How to do it...\n\n- 1. 登录 Windows Server 2016 并进入服务器管理器。\n- 2. 单击工具菜单并打开\
  \ IIS 管理器。\n- 3. 从连接面板展开 IIS 服务器 (WIN2016IIS)。我们列出了应用程序池和站点。\n- 4. 展开站点文件夹，您将看到列出的站点--mysite.com、v2mysite.com、v4mysite.com--并且您将获得通配符主机\
  \ ssl.v2mysite.com 和 demo.v2mysite.com：\n\n![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_183_0.png)\n\
  \n- 5. 选择 demo.v2mysite.com 以从操作面板获取 demo.v2mysite.com 通配符主机的属性。\n- 6. 转到操作面板，您将看到编辑权限。这用于提供或拒绝访问通配符主机的内容目录。您可以从操作窗格管理此权限。您可以进入通配符主机的内容目录，右键单击目录以打开属性弹出窗口并选择安全选项卡。在这里，您可以编辑访问级别并拒绝权限。\n\
  - 7. 现在，我们有绑定选项；我们已经知道如何更改任何网站的绑定。以下操作可通过绑定选项执行：为任何网站或通配符主机添加、删除和编辑 IP、端口、协议、主机名和\
  \ SSL 证书绑定。\n- 8. 基本设置... 与网站的基本设置相同，因为通配符主机也是主网站的子网站。在这里，您可以找到有关基本设置更清晰的信息：\n\n\
  ![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_184_0.png)\n\n- 9. 如前一屏幕截图所示，我们有通配符主机 demo.v2mysite.com\
  \ 的站点名称、应用程序池和物理路径。我们可以设置任何目录作为物理路径。\n- 10. 让我们现在来看一下高级设置：\n\n![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_184_1.png)\n\
  \n- 11. 在 **高级设置** 中，就像网站设置一样，我们有应用程序池、网站 ID（您创建的网站数量，也称为站点索引的唯一顺序号）、通配符主机的名称、物理路径和物理路径凭据（如果您已设置）。我们将其保留为默认值。物理路径凭据的登录类型可以根据物理路径凭据的配置为明文、网络、批处理或交互式。我们没有使用任何凭据，因此我们使用默认设置。**预加载已启用**\
  \ 用于使应用程序池始终运行。\n- 12. 在 **高级设置** 的 **行为** 部分，我们有 **已启用协议**，默认选项类型为 **HTTP**，以及\
  \ **失败请求跟踪** 选项，可让我们跟踪网站或通配符主机的跟踪日志。在 **限制** 中，我们可以应用设置以限制同时访问通配符主机的用户数量。\n- 13.\
  \ 让我们转到通配符主机 **ssl.v2mysite.com**。我们已经为其配置了绑定：HTTPS 协议和 SSL 证书。\n- 14. 进入 IIS 管理器并单击\
  \ **ssl.v2mysite.com**。转到 **操作** 面板并单击 **基本设置...** 您将获得 **基本设置** 窗口：\n\n![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_185_0.png)\n\
  \n- 15. 让我们验证 **ssl.v2mysite.com** 的站点应用程序池和通配符主机（子域名）设置。应用程序池与站点名称相同，如前一幅图所示。\n\
  \n> TIP\n> \n> 我建议根据托管网站的框架版本手动验证 .NET CLR 版本的应用程序池。\n\n- 16. 单击选择按钮。您将获得应用程序池属性：\n\
  \n![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_186_0.png)\n\n- 17. 您可以看到 ssl.v2mysite.com\
  \ 应用程序池版本为 4.0。我们还可以选择 IIS 10.0 上 Windows Server 2016 中可用的任何其他类型的应用程序池。您可以通过单击应用程序池下拉列表来检查可用应用程序池的列表，您将获得在\
  \ IIS 10.0 中创建的应用程序池列表。\n- 18. 让我们继续检查默认文档设置。单击我们创建的任何通配符主机并进入功能视图。找到默认文档，双击打开它，并检查文件名\
  \ default.aspx，我们将在通配符 ssl.v2mysite.com 中访问它。\n- 19. 可选地，在列表中选择一个默认文档，并在操作窗格中单击向上移动或向下移动以更改文件的优先级。\n\
  \n#### How it works...\n\n在本食谱中，我们为应用程序池版本 4.0 配置了通配符主机 ssl.v2mysite.com，并对通配符主机的权限和内容目录文件夹进行了概述。我们实现了通配符主机的基本和高级设置。最后，我们实现了通配符主机的默认文档设置。\n\
  \n\n\n\n\n### 将 .NET 网页上传到通配符主机\n\n在本节操作中，我们将为 ssl.v2mysite.com 通配符主机站点上传网站应用程序页面。这些网站应用程序页面是使用\
