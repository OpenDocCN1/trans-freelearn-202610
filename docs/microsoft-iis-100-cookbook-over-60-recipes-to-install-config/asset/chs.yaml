- "## 将 IIS 10.0 与 Windows Server 2016 集成\n\n在本章中，我们将涵盖以下食谱：\n\n+   - IIS 10.0 架构\n\
  +   - 在 Windows Server 2016 上安装 IIS 10.0\n+   - IIS 管理器\n+   - IIS 10.0 的基本配置\n\
  +   - 主机静态页面\n+   - 测试静态页面网站\n\n### 引言\n\nIIS 10.0 是 Internet Information Services\
  \ (IIS) 的最新版本，IIS 是由 Microsoft 开发的可扩展 Web 服务器。IIS 10.0 随 Windows Server 2016 和 Windows\
  \ 10 推出。IIS 10.0 的新功能包括 HTTP/2、Nano Server 上的 IIS、通配符主机头和 PowerShell 5 cmdlet 等。此外，它还支持所有先前支持的功能：HTTP、HTTPS、SMTP、SNMP、FTP\
  \ 和 FTPS。\n\n本章中的食谱将主要关注 IIS 10.0 与 Windows Server 2016 的集成。\n\n我们将从有关 IIS 10.0\
  \ 的一些基本信息开始。之后，我们将把 IIS 10.0 与 Windows Server 2016 集成，并配置和测试我们的第一个示例网页。\n\n### 了解\
  \ IIS 10.0\n\n在本食谱中，我们将了解如何使用 IIS 10.0 的新功能。我们将概述添加到 IIS 10.0 的以下新功能：\n\n+   - **HTTP/2**\n\
  +     HTTP/2 请求现在比以往更快。此功能在 Windows Server 2016 和 Windows 10 上的 IIS 10.0 中默认处于活动状态。\n\
  +   - **Nano Server 上的 IIS 10.0**\n+     IIS 10.0 易于快速安装在 Nano Server 上。您可以使用 PowerShell\
  \ 或 IIS 管理器控制台远程管理 IIS 10.0。Nano Server 运行速度更快，消耗的内存和磁盘空间比功能齐全的 Windows Server 少。重新启动也更快，因此您可以更有效地管理时间。\n\
  +   - **通配符主机头**\n+     IIS 10.0 支持您父域名的子域功能。这将真正帮助您使用相同的首要域名管理更多子域名。\n+   - **PowerShell\
  \ 5 cmdlet**\n+     IIS 10.0 添加了一个新的、简化的 PowerShell 模块，用于快速轻松地管理。您可以使用 PowerShell\
  \ 远程访问服务器管理功能。它还支持现有的 `WebAdministration` cmdlet。\n+   - **FTP**\n+     FTP 是一种用于传输文件的简单协议。此系统可以使用默认端口\
  \ 21 在公司局域网和广域网内传输文件。IIS 10.0 包含一个易于配置和管理的 FTP 服务器。\n+   - **FTPS**\n+     FTPS\
  \ 与 FTP 相同，唯一的区别是它是安全的。FTPS 使用 SSL 传输数据。我们将使用 HTTPS 端口 443。为此，我们需要创建并安装 SSL 证书以安全地加密和解密数据。SSL\
  \ 确保在私有或公共网络上传输期间，Web 服务器和浏览器之间传递的所有数据在上传和下载过程中保持私密和一致。\n+   - **多网站托管**\n+   \n\
  +     IIS 10.0 允许您在同一服务器上创建多个网站和多个应用程序。您可以轻松管理和创建位于默认位置或自定义位置的新虚拟目录。\n+   - **虚拟目录**\n\
  +   \n+     IIS 10.0 使管理和创建所需的虚拟目录变得容易。\n\n### IIS 10.0 的基本要求\n\n在我们以操作或暂存模式运行 Web\
  \ 服务器之前，我们必须对其进行规划。我们要发布什么类型的网站和应用程序？例如，我们的网站需要一个支持 IIS 10.0 上 .NET framework 4.5\
  \ 的服务器。我们需要了解支持的操作系统和硬件要求。\n\n让我们详细了解要求。\n\n#### 操作系统要求\n\n以下小节详细说明了 Windows Server\
  \ 2016 的估计系统要求。如果您的计算机低于最低要求，您将无法正确安装此产品。实际要求将根据您的系统配置以及您安装的应用程序和功能而有所不同。除非另有说明，否则这些最低系统要求适用于所有安装选项（Windows\
  \ 2016 Server Core、Windows Server 2016、Nano Server 和 Windows 10）以及标准版和数据中心版。IIS\
  \ 10.0 Express 支持 Windows 7 Service Pack 1、Windows 8.1、Windows 8、Windows Server\
  \ 2008 R2、Windows Server 2012、Windows Server 2012 R2、Windows 10 和 Windows Server\
  \ 2016。\n\n![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_25_0.png)\n\n为获得最佳效果，请进行测试部署以确定特定部署方案的适当系统要求。\n\
  \n\n\n\n\n#### 硬件要求\n\n我们来看看运行 Windows Server 2016 和 Windows 10 的最低硬件要求：\n\n#####\
  \ Windows Server 2016\n\n- 处理器：1.4 GHz 64 位\n- 内存：64 位操作系统至少 2 GB\n- 硬盘空间：32 GB\n\
  \n##### Windows 10\n\n- 处理器/SoC：1 GHz\n- 内存：32 位操作系统至少 1 GB，64 位操作系统至少 2 GB\n- 硬盘空间：32\
  \ 位操作系统至少 16 GB，64 位操作系统至少 20 GB\n- 显卡：支持 WDDM 1.0 驱动程序的 DirectX 9\n\n#### 操作系统介质\n\
  \n安装 IIS 10.0 需要操作系统介质。在 Windows Server 2016 上安装 IIS 10.0 时，有时它会要求提供操作系统介质以获取所需文件。我们必须以\
  \ CD 或 USB 驱动器形式插入介质。\n\n如果只需安装 IIS 10.0 Express，则需要 IIS 10.0 Express 软件，该软件可在 Microsoft\
  \ IIS 网站（https://www.microsoft.com/en-us/download/details.aspx?id=48264）上获取。你只需要该软件和互联网连接。\n\
  \n### IIS 10.0 架构\n\n我们需要了解 IIS 应用程序可以使用哪些资源；它如何处理不同类型的内容文件（如静态文件、ASP 文件或 ISAPI\
  \ 文件）；以及它如何将内容文件分组到应用程序中。对于不熟悉 Web 服务器的初次读者，这里还介绍了客户端/服务器关系的入门知识。\n\nIIS 7 及更高版本提供了请求处理架构。由于默认配置会监视每个请求并验证已实施的安全规则，因此我们获得了以下请求处理方面的额外好处：\n\
  \n- Windows 进程激活服务（WAS），使站点能够使用 HTTP 和 HTTPS 以外的协议\n- 可通过添加或删除模块进行自定义的 Web 服务器引擎\n\
  - IIS 和 ASP.NET 的集成请求处理管道\n\n#### 准备就绪\n\n我们需要一个正在运行的 IIS 10.0 实例。应安装安全组件。你应具有管理权限。\n\
  \n#### 操作步骤\n\n现在，我们将回顾组件和模块。\n\n1. 在 Windows Server 2016 上启动服务器管理器，该服务器上应已安装 IIS\
  \ 10.0。\n2. 转到顶部的“工具”菜单。\n3. 你将能够看到 Internet 信息服务管理器（IIS）。\n4. 单击“IIS 服务器”，它位于“IIS\
  \ 管理器”窗口的左侧，如下所示：\n\n![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_28_0.png)\n\n5. 在“服务器管理器”面板中，你将看到已安装的默认组件列表。你可以根据需要配置它们。例如，你可以配置安全和管理选项。\n\
  \n6. 让我们了解模块在哪里。在上图中，你会看到一个名为“模块”的图标，此时它将打开默认配置。\n\n![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_31_0.png)\n\
  \n![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_35_0.png)\n\n4. 在“开始之前”向导中，只需单击“下一步”按钮。此窗口仅用于提供有关安装前提条件的信息。\n\
  5. 在“选择安装类型”向导中，保持默认选项“基于角色或基于功能的安装”选中，并单击“下一步”。\n\n6. 现在我们必须选择要在哪台服务器上安装 IIS 10.0。我们正在安装到本地计算机，因此保持“从服务器池中选择服务器”选中当前计算机，并单击“下一步”。或者，你也可以从此处选择你正在管理的另一台服务器。你可以在下图中了解这一点：\n\
  \n![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_36_0.png)\n\n7. 现在我们必须从“选择服务器角色”向导中选择角色。选中“Web\
  \ 服务器（IIS）”旁边的复选框。这样做可能会打开一个新的弹出窗口，提示需要附加功能；只需单击“添加功能”按钮即可同时安装它们。完成此操作后，在“选择服务器角色”菜单上单击“下一步”。\n\
