  - 4. 我们已将 `iisstart.htm` 和 `iisstart.png` 文件粘贴到 `mysite` 物理目录中。现在你需要为 `mysite.com`
  添加主机条目，以便我们可以通过名称访问它。

  - 5. 转到 **WIN2016IIS** 服务器的 `C:\Windows\System32\drivers\etc` 位置。你会看到 hosts 文件。用记事本将其打开，并为
  `172.16.15.60` 和网站名称 `mysite.com` 添加一条记录，如下所示：


