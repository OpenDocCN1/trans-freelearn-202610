  \ 属性。\n\n## 2. Hosting Static Web Pages\n\n在本教程中，我们将托管我们的简单 HTML 网页。\n\n#### Getting\
  \ ready\n\n我们需要创建一个 HTML 网页并运行 IIS 10.0。你还需要用户管理员权限来托管站点。\n\n#### How to do it...\n\
