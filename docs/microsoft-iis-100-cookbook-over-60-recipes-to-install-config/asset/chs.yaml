  - 4. 单击通配符主机 **ssl.v2mysite.com**，转到 IIS 管理器控制台的右侧，你将看到 **操作** 面板。在 **操作** 面板中，有一个名为\
  \ **浏览** 的选项：\n\n  ![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_188_0.png)\n\n- 5. 单击\
  \ **浏览** 选项；它将打开所选通配符 **ssl.v2mysite.com** 的内容目录，或者你也可以直接指定通配符主机文件夹的物理文件夹路径，如下所示：\n\
  \n  ![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_188_1.png)\n\n- 10. 现在关闭该文件夹。我们使用了两种类型的通配符主机。ssl.v2mysite.com\
  \ 主机是应用程序通配符主机，第二个是 demo.v2mysite.com，这是一个简单网站类型的通配符主机。\n\n#### 工作原理...\n\n在本节操作中，我们将用\
  \ ASP.NET 编写的网站应用程序页面上传到了通配符主机 ssl.v2mysite.com。我们检查了 default.aspx 应用程序页面的属性。\n\n\
  我们还将简单的 HTML 网页上传到了通配符主机 demo.v2mysite.com。\n\n### 测试上传的网站页面\n\n在本节操作中，在开始测试这些站点之前，务必验证通配符主机\
