  \n- 5. 打开 **默认文档** 设置，检查 **iisstart.htm** 是否可用：\n\n  ![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_192_0.png)\n\
  \n- 6. 接下来，我们将交叉检查 **默认文档** 设置，并验证一切是否已准备好用于测试通配符主机 URL **demo.v2mysite.com** 和\
