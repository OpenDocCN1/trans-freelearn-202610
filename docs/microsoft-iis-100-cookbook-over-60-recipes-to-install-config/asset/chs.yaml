  \ 服务器。\n\n- 3. 在客户端上转到“文件”菜单，单击“站点管理器”：\n\n![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_315_0.png)\n\
  \n- 4. 如你所见，我们已经添加了几个站点。我们将选择 `ftp.learningpoint.co.in`，并将协议设置为 FTP 或 SFTP。然后，单击“连接”按钮。你将连接到远程\
  \ FTP 站点，如下所示：\n\n### 在 IIS 10.0 上安装 FTP\n\n在本教程中，我们将在 Windows Server 2016 上安装 FTP\
