  \ Web 应用程序，你可以创建一个虚拟目录并添加所需的应用程序池。\n\n### 在 IIS 10.0 中构建虚拟目录\n\n在本教程中，我们将逐步创建一个虚拟目录。我们将添加虚拟目录的别名（别名是物理目录的虚拟名称）。我们还将应用虚拟目录物理路径的设置。\n\
  \n#### 准备工作\n\n要逐步完成本教程，你需要一个正在运行的 IIS 10.0 实例。你还应具有管理员权限。\n\n#### 如何操作...\n\n-\
