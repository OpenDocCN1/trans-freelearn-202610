- "## 3. Hosting Multiple Websites on IIS 10.0\n\n在本章中，我们将介绍以下配方：\n\n- Hosting multiple\
  \ websites\n- Creating a website folder\n- Configuring websites\n- Configuring ports\n\
  - Configuring the website IP\n- Deploying websites\n- Testing websites\n\n### Introduction\n\
  \n使用 Microsoft IIS 10 Server 中的多个 Web 主机，您可以在同一台 IIS 10 服务器上托管一个或多个网站。网站可以使用 SSL（安全套接字层）通过超文本传输协议（HTTPS）使用默认端口\
  \ 80 进行托管。通常，所有网站都通过 HTTP 或 HTTPS 访问默认端口 80。如果您以加密方式运行网站，协议为 HTTPS，是一个安全端口。\n\n\
  网站是访问网络所必需的，可以通过局域网（LAN），称为内联网，或广域网（WAN），称为互联网。\n\n您需要域名、IP地址和端口来运行您的网站或 Web 应用程序。\n\
  \n我们已经执行了安装并创建了应用程序池。现在让我们在同一台 IIS 10 服务器上启动多个 Web 主机，并使用其主机名（域名）访问网站。\n\n### Hosting\
  \ multiple websites\n\n在本配方中，我们将在 IIS 10.0 中创建三个网站：mysite.com、v2mysite.com 和 v4mysite.com。我们将在本章后面在\
  \ `hosts` 文件中进行主机名条目。我们将使用其主机名访问网站。\n\n让我们继续到下一节，我们将在那里详细介绍。\n\n#### Getting ready\n\
  \n要逐步完成本配方，您需要一台正在运行的 IIS 10 实例和管理员用户帐户。您将创建和配置网站的属性。\n\n#### How to do it...\n\n\
  - 1. 在 Windows Server 2016 中打开 Server Manager。点击 **Tools** 菜单并打开 IIS 管理器。\n- 2.\
  \ 从 **Connections** 面板展开 IIS 服务器。我们得到列出的 **Application Pools** 和 **Sites** 文件夹。\n\
  - 3. 在计算机名称下方的左侧面板中展开 **Sites** 菜单并点击 **Default Web Site**。您可以使用此图找到它：\n\n![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_97_0.png)\n\
  \n- 5. 转到右上方的 Actions 面板并点击 Bindings 下的 Edit Site。您将获得默认的 Site Bindings 选项：\n\n\
  ![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_97_1.png)\n\n- 11. 转到 IIS Server Manager\
  \ 的 Site 菜单，该菜单在左侧面板中可用并选择 Default Web Site。通过右键点击获取上下文弹出菜单选择 Rename 或在 Actions\
  \ 窗格下点击 Basic Settings 以获得相同的重命名选项，将其重命名为 v2mysite.com。重命名网站仅用于标识网站。\n- 12. 现在我们将添加\
  \ v4mysite.com。在 Connections 窗格中，点击 Sites 菜单，转到 Actions 面板并点击 Add Websites...。您将获得\
  \ Add Websites... 窗口：\n\n![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_99_0.png)\n\n\
  - 13. 我们添加 **Site name** `v4mysite.com` 并选择 **Application pool** `2and3.5AppPool`。\n\
  - 14. 保留默认目录为 `wwwroot`。我们添加的 IP 地址与服务器 IP 相同。\n- 15. 将端口号保留为默认端口号，即 `80`。主机名为 `v4mysite.com`。**Start\
  \ Website immediately** 是默认选项，已选中。点击 **OK** 按钮。\n- 16. 我们将按照相同的步骤添加更多网站；我们将再创建一个名为\
  \ `mysite.com` 的网站。\n- 17. 现在我们创建了三个具有不同名称但使用相同 IP 地址的网站：\n\n![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_100_0.png)\n\
  \n\n\n\n\n- 21. 在记事本中打开 hosts 文件。确保记事本以管理员权限打开，右键单击记事本图标并点击“以管理员身份运行”；这样才能保存更改。现在我们需要添加网站主机名条目：\n\
  \n![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_102_0.png)\n\n- 22. 如上图所示，我们创建了三个网站条目，分别是\
  \ mysite.com、v2mysite.com、v4mysite.com。所有站点的 IP 均相同，为 172.16.15.60。在你的环境中，IP地址应不同。\n\
  \n- 23. 保存 hosts 文件并关闭它。现在你已完成多网站托管的所有配置。\n\n#### How it works...\n\n在同一台 IIS 10\
  \ 服务器上托管多个网站，有助于我们在同一服务器上轻松管理所有网站相关任务。我们刚刚在同一台 IIS 服务器上创建了三个网站。你可以根据需要创建任意数量的网站。\n\
  \n当你想通过域名访问网站时，例如 mysite.com，就需要 hosts 文件条目。你也可以使用 DNS 服务器通过局域网或广域网访问该网站。\n\n###\
  \ Creating a website folder\n\n在本教程中，我们将在 c:\\inetpub\\wwwroot 路径下为每个网站创建单独的网站目录，例如\
  \ mysite、v2mysite 和 v4mysite，后续章节中我们可以在此上传网站应用程序文件。我们之前使用默认的 wwwroot 文件夹上传网站文件，现在需要发布多个网站。我们需要将所有\
  \ Web 文件上传到各自独立的目录中。\n\n#### Getting ready\n\n要逐步完成本教程，你需要一台正在运行的 IIS 10 实例。你必须拥有管理员权限，以便创建网站文件夹。\n\
  \n#### How to do it...\n\n我们将在 wwwroot 文件夹内为每个网站创建一个网站文件夹。\n\n- 1. 打开文件资源管理器，点击\
  \ **This PC**。在右侧你会看到可用的驱动器。\n- 2. 打开 c:\\ 驱动器，进入名为 inetpub 的文件夹，你将看到 IIS 10.0 相关的文件夹列表。你需要找到\
  \ wwwroot 文件夹。\n- 3. 打开 `wwwroot` 文件夹。在 `wwwroot` 文件夹内，你需要创建 `mysite`、`v2mysite`\
  \ 和 `v4mysite` 子文件夹：\n\n![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_104_0.png)\n\n\
  - 4. 现在我们需要配置网站的物理路径；我们已有三个网站：`mysite.com`、`v2mysite.com` 和 `v4mysite.com`。让我们逐一配置它们。\n\
  - 5. 进入 Server Manager，点击 Tools 菜单，打开 IIS Manager。\n- 6. 在 Connections 窗格中展开你的 IIS\
  \ 服务器，展开 Sites 文件夹，你会看到列出的三个网站。选择 mysite.com。\n- 7. 进入 Actions 窗格，点击 Basic Settings，你将看到属性：\n\
  \n![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_105_0.png)\n\n- 8. 我们添加网站目录的 **Physical\
  \ path** `C:\\inetpub\\wwwroot\\mysite`，供此网站 mysite.com 使用。\n- 9. 点击 **OK** 按钮完成。\n\
  - 10. 按照之前的步骤添加/更新网站目录的 **Physical path** `C:\\inetpub\\wwwroot\\v2mysite`，供此网站\
  \ v2mysite.com 使用。\n- 11. 点击 **OK** 按钮。\n\n![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_105_1.png)\n\
  \n- 12. 我们将按照相同步骤添加/更新 v4mysite.com 的物理路径：\n\n![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_106_0.png)\n\
  \n- 13. 现在你可以根据网站名称和文件夹上传 Web 应用程序文件。如果需要使用不同版本的应用程序池，可以从 Basic Settings 中更改应用程序池。\n\
  \n#### How it works...\n\n我们首先在 wwwroot 目录内为多个 Web 应用程序创建子文件夹。然后为 mysite.com、v2mysite.com\
  \ 和 v4mysite.com 创建了单独的目录。我们还更改了所有网站的物理路径。现在我们可以用各自独立的物理路径访问所有网站。\n\n### Configuring\
  \ websites\n\n在本教程中，我们将配置网站属性。我们将探索基本设置和高级设置。也将介绍限制网站访问的设置。\n\n#### Getting ready\n\
  \n要逐步完成本教程，你需要一台正在运行的 IIS 10 服务器和管理员用户账户以编辑网站设置。\n\n#### How to do it...\n\n- 1.\
  \ 在 Windows Server 2016 上打开 Server Manager。点击 Tools 菜单并打开 IIS Manager。\n- 2. 展开\
  \ IIS 服务器（WIN2016IIS）。我们可以看到列出的应用程序池和站点。\n- 3. 在连接窗格中点击 mysite.com，你将在 Actions 窗格中看到\
  \ mysite.com 的属性。我们得到 Basic Settings... 和 Advanced Settings...：\n\n![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_107_0.png)\n\
  \n- 4. 点击 **Basic Settings...**，你将看到 **Edit site** 属性显示。\n\n![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_108_0.png)\n\
  \n- 5. **Edit Site** 窗口显示你选择的网站和分配的应用程序池。\n- 6. **Physical path** 是网站应用程序文件所在的路径，位于\
  \ `wwwroot` 文件夹中。你可以自定义 **Connect as...** 选项并测试设置以检查其在浏览器中是否正常工作。\n- 7. 现在让我们继续配置所选网站的\
  \ **Advanced Settings...**。\n- 8. 点击 **mysite.com**。在 **Actions** 窗格中，你会看到 **Advanced\
  \ Settings...** 选项。点击 **Advanced Settings...**，你将看到高级设置窗口：\n\n![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_109_0.png)\n\
  \n- 9. **Advanced Settings** 包含四个设置组：**General、Behavior、Failed Request Tracing 和\
  \ Limits。**\n- 10. 在 **General** 中，你可以更改 **Application pool、website ID、website Physical\
  \ Path、Physical Path Credentials Logon Type 和 Preload Enabled。**\n- 11. 在 **Behavior**\
  \ 中，你可以更改 **Enabled protocols**，其为 **http** 或 **https**。\n- 12. 你可以配置 **Failed Request\
  \ Tracing** 的设置。**Directory** 是存储跟踪信息日志的位置，跟踪服务启用为 true 或 false，以及最大跟踪文件数。\n- 13.\
  \ 你还可以根据连接超时、每秒最大带宽、最大并发连接数和最大 URL 段数设置网站访问的 **Limits**。\n\n#### How it works...\n\
  \n在本教程中，我们从步骤 1 到 3 对网站 mysite.com 进行了概述。我们进入了 Connections 窗格并展开了 Sites 文件夹以获取 mysite.com\
  \ 的属性。从步骤 4 到 13，我们讨论了 mysite.com 的基本和高级设置配置与自定义。我们了解了 Failed Request Tracing 以及如何限制\
  \ mysite.com 的并发连接。\n\n### Configuring ports\n\n在本教程中，我们将配置网站访问端口；默认网站访问类型为 HTTP，端口号为\
  \ 80。我们将为所有单独托管的站点配置不同的端口以访问网站。\n\n#### Getting ready\n\n要逐步完成本教程，你需要一台正在运行的 IIS\
  \ 10 服务器和管理员用户账户，以便编辑网站设置。\n\n#### How to do it...\n\n- 1. 在 Windows Server 2016\
  \ 上打开 Server Manager。点击 Tools 菜单并打开 IIS Manager。\n- 2. 展开 IIS 服务器（WIN2016IIS）。我们可以看到列出的应用程序池和站点。\n\
  - 3. 我们已有之前创建的列出网站。点击 mysite.com，你将在 Actions 窗格中看到 mysite.com 的属性。我们可以在 IP 172.16.15.60:80\
  \ 浏览网站；这里 80 是端口号。\n- 6. 在这里你会看到 Site Bindings。Type 为 http，Host Name 为 mysite.com，Port\
  \ 为 80，IP 地址为 172.16.15.60。让我们继续配置端口号 8080。\n- 7. 选择 mysite.com，编辑按钮将被激活；点击 Edit\
  \ 按钮，你将看到 Edit Site Binding 窗口：\n\n![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_112_0.png)\n\
  \n- 8. 将端口更改为 8080，然后点击 OK 按钮。现在，你可以看到默认端口已更改：\n\n![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_112_1.png)\n\
  \n\n\n\n\n### 在 IIS 10.0 上托管多个网站\n\n- 10. 点击 **在 172.16.15.60:8080 上浏览 mysite.com**。你将看到你的网站，如图所示：\n\
  \n  ![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_114_0.png)\n\n- 11. 你可以看到地址栏中带有 mysite.com:8080\
