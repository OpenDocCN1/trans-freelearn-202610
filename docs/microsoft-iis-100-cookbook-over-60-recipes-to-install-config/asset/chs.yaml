  `https`）。输入网站的 IP 地址，并输入 HTTPS 默认端口 `443`。选择我们之前创建的 `mysite.com` 证书。单击“**确定**”。


  ### 使用 PowerShell 命令创建 SSL 证书


  在本教程中，我们将在 WIN2016IIS 上打开 IIS 管理器。我们将打开 PowerShell 并创建一个名为 v3mysite.com 的 SSL 证书。我们还将通过
  IIS 管理器验证该证书是否已创建成功。


  #### 准备工作


  要完成本教程，我们将为 v3mysite.com 创建一个 SSL 证书。我们将使用 PowerShell 创建自签名证书。你需要一台运行中的 IIS 10.0
  服务器和一个管理员账户，以便在 IIS 10.0 中进行更改。


  #### 操作步骤...


  - 1. 登录 Windows Server 2016。IP 为 172.16.15.60，服务器名称为 WIN2016IIS。

  - 2. 按 Windows + R 键，会弹出“运行”窗口。使用管理员权限打开 PowerShell ISE，在运行命令窗口中输入 `RunAs /user:Administrator
  PowerShell_ISE.exe`，然后按“确定”。

  - 3. 此时系统会要求输入服务器 WIN2016IIS 的管理员密码。输入管理员密码并按回车。PowerShell 窗口将打开。现在你需要输入 `New-SelfSignedCertificate
  -DnsName v3mysite.com -CertStoreLocation cert:\LocalMachine\My`，如下所示：


  - 4. 你可以在 PowerShell 窗口中看到证书已创建。这是一个自签名证书。

