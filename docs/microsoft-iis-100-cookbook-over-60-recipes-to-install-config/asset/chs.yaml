  ### 简介


  健康和诊断提供了一种基础设施，用于监控、管理和排查 Web 服务器、站点和应用程序的健康状况。


  其优势在于详细的跟踪事件，可在完整的请求和响应过程中跟踪请求。为了启用这些跟踪事件的收集，IIS 服务器可以配置为基于经过的时间或错误响应代码，自动捕获特定请求的完整跟踪日志，格式为
  XML。


  #### 如何操作...


  1. 使用管理员账户登录到 Windows Server 2016。

  2. 打开 **Server Manager**。

  3. 点击 **Tools**，你会找到 IIS Manager。打开 IIS Manager 并点击 IIS 服务器 **WIN2016IIS**。转到 **Features
  View**，如下所示：


  ![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_373_0.png)


  4. 你可以在图中看到，我们选择了 **Worker Processes**。**Worker Processes** 仅在 IIS 服务器的 **Features
  View** 中可用，而不在网站的 **Features View** 中。**Worker Processes** 使你能够查看应用程序进程对服务器资源的利用情况。


  5. 接下来，我们需要展开 Sites 文件夹并点击 mysite.com，如下所示：


  ![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_374_0.png)


  6. 如你所见，我们正在选择 Compression、HTTP Responder、Failed Request Tracer 和 Logging。这些是 IIS
  服务器的健康和性能功能。在下一个教程中，我们将继续安装健康、诊断和性能功能。


  #### 如何运作...


  在本教程中，我们登录到 IIS 服务器并打开 IIS Manager。我们浏览了 IIS 服务器的功能视图以查看健康和诊断功能，并检查 `mysite.com`
  功能视图中的可用健康和诊断选项。


