- "## 将 IIS 10.0 扩展到 FTP\n\n在本章中，我们将介绍以下教程：\n\n- 了解 FTP\n- 在 IIS 10.0 上安装 FTP\n- 创建、保护和配置\
  \ FTP 站点\n- 创建 FTP 用户并管理用户权限\n- 测试我们的 FTP 服务器\n\n### 简介\n\n**文件传输协议（FTP）**用于通过网络和互联网在两台计算机之间传输文件。\n\
  \nFTP 是一种标准网络协议，用于在计算机网络中采用客户端-服务器模型将计算机文件从服务器传输到客户端。FTP 的默认网络端口号是 20 和 21。\n\n\
  FTPS，也称为 FTPES、FTP-SSL、S-FTP 和 FTP Secure，是常用 FTP 的扩展，增加了对**传输层安全性（TLS）**和**安全套接层（SSL）**加密协议的支持。\n\
  \n### 了解 FTP\n\n在本教程中，我们将打开已安装在 Windows 10 PC 上的 FileZilla FTP 客户端软件。我们还将打开托管在远程服务器上的\
  \ FTP 站点。我们将了解如何上传和下载文件、文件夹、媒体文件和程序文件。\n\n![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_313_0.png)\n\
  \nFileZilla 是一款可免费在线下载的第三方应用程序。有两种类型的 FileZilla 程序可用：FileZilla Client 和 FileZilla\
  \ Server。\n\nFileZilla 专为 FTP 服务器连接设计，用于文件下载和上传。\n\n在本书中，示例使用 FileZilla Client 应用程序进行演示，该应用程序可在\
  \ https://filezilla-project.org/ 获取。\n\n#### 准备工作\n\n要完成本教程，你需要一个运行中的 FTP 站点。你还应该具有该\
  \ FTP 站点的管理权限、FileZilla FTP 客户端软件（或任何 FTP 客户端软件）以及互联网连接。\n\n#### 操作步骤...\n\n- 1.\
  \ 我们已在 Windows 10 PC 上安装了 FileZilla FTP 客户端软件。在桌面上找到 FileZilla 客户端快捷方式并打开它：\n\n\
  ![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_314_0.png)\n\n- 2. 你可以看到顶部有“快速连接”选项。你只需在“主机”字段中输入\
