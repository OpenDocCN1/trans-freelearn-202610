  \ ssl.v2mysite.com。我们还将使用已上传网页的通配符主机 demo.v2mysite.com 来测试我们的 HTML 网页。\n\n#### 准备工作\n\
  \n要完成本节操作，你需要一个正在运行的 IIS 10.0 实例。你应该已经为通配符主机 ssl.v2mysite.com 和 demo.v2mysite.com\
  \ 创建、配置并上传了网页。你必须具有管理员权限。\n\n#### 操作步骤...\n\n- 1. 登录 Windows Server 2016，然后转到 **服务器管理器**。\n\
  - 2. 单击 **工具** 菜单并打开 IIS 管理器。\n- 3. 展开 IIS 服务器（**WIN2016IIS**）。你会看到列出的 **应用程序池**\
