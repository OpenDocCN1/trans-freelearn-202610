  一旦我们检查默认文档配置并发现 index.html 名称已列出，我们需要打开网页，默认主页将会打开。默认文档设置对于启动你的网站非常有帮助，因为你会选择它，并且需要告诉\
  \ IIS 服务器你的主页是什么。\n\n### Testing a static-page website\n\n我们已经将静态 index.html 页面上传到\
  \ wwwroot 文件夹，并检查了默认主页的默认文档设置。现在让我们看看如何测试静态网页。\n\n#### Getting ready\n\n我们需要测试网页是否正常工作。你需要一个正在运行的\
  \ IIS 10.0 服务器实例和一个静态 HTML 网页。\n\n我们已经创建了 `index.html` 页面并将其上传到 IIS `wwwroot` 目录。\n\
  \n#### How to do it...\n\n- 1. 打开 Internet Explorer。\n- 2. 你需要在地址栏中提供你的网页 URL。我们在\
  \ localhost（本地服务器）上安装了 IIS 10.0。\n- 3. 输入 URL `http://localhost/` 并按 **Enter**。你的页面将如下所示：\n\
  \n![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_60_0.png)\n\n#### How it works...\n\n\
  一旦你通过 IIS 访问网页，页面将通过 HTTP 端口 80 显示。你可以尝试上传更多页面。\n\n应用程序池的好处是，如果其中一个应用程序池出现问题，它只会影响相关的应用程序池。\n\
  \n应用程序池使我们能够隔离 Web 应用程序，以获得更好的安全性、可靠性和可用性。\n\n有两种类型的应用程序管道。我们可以选择集成模式（支持 IIS 7.5\
  \ 或更高版本）或经典模式（IIS 6.0）。\n\n### Understanding application pools in IIS 10.0\n\n在本教程中，我们将了解应用程序池。我们可以简单地说，应用程序池是\
  \ IIS 10.0 的核心。应用程序池是 Web 应用程序的逻辑分组，它们将在一个公共进程中执行，从而允许对哪些程序在单个进程中聚类进行更大的粒度控制。例如，如果你需要每个\
  \ Web 应用程序都在单独的进程中执行，你只需为每个不同框架版本的应用程序创建一个应用程序池即可。\n\n假设我们有多个版本的网站，一个支持框架 2.0，另一个支持框架\
  \ 4.0 或其他不同的应用程序，如 PHP 或 WordPress。所有这些网站进程都通过应用程序池进行管理。\n\n#### Getting ready\n\
  \n要逐步完成本教程，你需要一个正在运行的 IIS 10.0 实例。你还应具有管理员权限。\n\n- 3. 点击 **DefaultAppPool**，然后你将获得\
  \ **DefaultAppPool** 的 **Actions** 面板。在这里，你将看到右侧高亮显示的 **Application Pool Tasks**\
  \ 选项，你可以 **Start**、**Stop** 和 **Recycle** IIS 10.0 的服务。\n\n![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_64_0.png)\n\
  \n- 5. 在 **Edit Application Pool** 部分，你可以更改应用程序池的设置到 **Basic Settings...** 和 **Advanced\
  \ Settings...**、**Rename** 应用程序池，并执行 **Recycling....**\n\n#### How it works...\n\
  \n让我们回顾一下我们在 IIS 管理器和应用程序池中探索的内容。我们了解了应用程序池的基础知识以及可以在其中进行更改的属性。默认的 IIS 10.0 应用程序池框架是\
  \ v4.0，支持到 v4.6，但我们还有更多安装不同版本应用程序池的选项。我们可以轻松自定义应用程序池，这有助于我们满足典型的 Web 应用程序需求。\n\n\
  在操作窗格中，我们有多个应用程序池选项。我们可以添加新的应用程序池，并且可以启动、停止和回收应用程序池任务。我们也可以执行编辑和自动回收。\n\n在下一个教程中，我们将学习更多关于应用程序池的内容，以安装较低的框架版本。\n\
  \n### Installation of lower framework version\n\n在本教程中，我们将在 Windows Server 2016\
  \ 上安装框架 3.5。默认情况下，IIS 10.0 具有框架版本 4.0。我们将安装较低版本的框架，它支持使用 .NET 框架版本 2.0 到 3.5 的 Web\
  \ 应用程序。\n\n例如，如果你有一个几年前创建的 Web 应用程序，它是在 v2.0 .NET 框架中开发的，你可以使用本教程使其在 IIS 10.0 上运行。让我们开始吧。\n\
  \n#### Getting ready\n\n要逐步完成本教程，你需要安装框架 v3.5，它基于 v2.0 框架。你需要一个 Windows Server 2016\
  \ 实例。你应该有 Server 2016 操作系统媒体用于框架 3.5 文件或互联网连接。你还需要管理员权限。\n\n#### How to do it...\n\
  \n- 1. 在 Windows Server 2016 上打开服务器管理器，并点击突出显示的 Add roles and features 选项。\n\n![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_66_0.png)\n\
  \n\n\n\n\n3. 单击“功能”选项卡并单击 .NET Framework 3.5 功能的复选框。它还会安装受支持的 2.0 框架。进入下一步：\n\n\
  ![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_68_0.png)\n\n6. 这里，我的 Windows Server 2016\
  \ 媒体在 D: 驱动器中。这是我的媒体路径，我已下载，但在你的情况下，它可能不同或是一个实际的光驱。里面有一个名为 sources 的文件夹和一个子文件夹 sxs。在此文件夹中，安装文件可用：\n\
  \n![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_70_0.png)\n\n7. 现在你知道源文件夹在哪里。进入确认屏幕并单击“安装”。下图显示了\
  \ WIN2016IIS 上的安装进度：\n\n8. 安装完成后单击“关闭”；现在你的服务器上已可以使用框架 3.5。\n\n9. 现在你需要验证框架 3.5\
  \ 是否已安装。它应该在功能向导中可用。\n\n10. 打开服务器管理器并单击“添加角色和功能”。\n\n11. 不断单击“下一步”，直到进入“选择功能”向导。你会看到\
  \ .NET framework 3.5 复选框已勾选，并且该框呈灰色，表示它已禁用：\n\n![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_72_0.png)\n\
  \n12. 我们已确认 .NET v3.5 已安装在我们的服务器上。\n\n![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_72_1.png)\n\
  \n这可以通过 PowerShell 安装。我们也可以直接从 Windows Update 安装，但你需要 Internet 连接并且 Windows Server\
  \ 上正在运行 Windows Update 服务。\n\n#### 如何运作...\n\n在本教程中，IIS 管理员已安装在框架 v3.5 上。Windows\
  \ Server 2016 上的版本 3.5 框架帮助我们运行内置的 .NET v2.0 或 v3.5 应用程序。框架 v3.5 处理在框架 v3.5 或 v2.0\
  \ 中构建的应用程序。\n\n我们还找到了 sources\\sxs 文件夹的位置，并在安装后验证了 .NET framework v3.5 是否可用。\n\n\
  我们现在将创建一个应用程序池以支持 .NET framework v3.5。\n\n### 在 IIS 10.0 中创建不同的应用程序池\n\n在本教程中，我们将创建一个支持\
  \ .NET 版本 2.0 到 3.5 的应用程序池。我们已经有用于 4.0 的默认应用程序池。本教程将指导你创建所需的不同的应用程序池。\n\n#### 准备工作\n\
  \n在本教程中，我们需要 IIS 10.0 和 .NET framework 3.5。你应该具有管理员权限。\n\n#### 如何操作...\n\n- 1. 在\
  \ Windows Server 2016 上打开服务器管理器。单击“工具”菜单并打开 IIS 管理器。\n\n2. 展开 IIS 服务器（WIN2016IIS）。你将看到列出的应用程序池。看一下：\n\
  \n![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_74_0.png)\n\n3. 此屏幕截图显示在应用程序池下，我们有 DefaultAppPool，状态显示为已启动，版本为\
  \ v4.0，托管管道显示为集成。\n\n4. 让我们为 v2.0 和集成管道创建一个新的应用程序池。\n\n5. 在右侧的 **Actions** 窗口中单击\
  \ **Add Application Pool**。你将获得 **Add Application Pool** 向导：\n\n![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_75_0.png)\n\
  \n6. 根据应用程序名称选择一个应用程序显示名称以便轻松识别。我将我的池命名为 **2and3.5AppPool**。该名称表明它将支持 2.0 和 3.5\
  \ .NET framework 版本。\n\n![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_75_1.png)\n\n7.\
  \ 接下来是 .NET CLR 版本。单击下拉菜单并选择 .NET Version V2.0.50727。此 .NET CLR 版本支持 2.0 和 3.5 框架网站。\n\
  \n8. 接下来是托管管道模式下拉菜单。我们可以从集成或经典模式中选择。在本示例中，我们将选择集成托管管道模式。\n\n![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_76_0.png)\n\
  \n9. 你也可以在创建应用程序池时选择自动启动选项。选择“立即启动应用程序”，以便一旦创建应用程序池，它会自动启动。如果你取消选中“启动应用程序”复选框，你可以稍后从“操作”窗口手动启动它。单击“确定”按钮。现在你已成功创建了应用程序池。你可以在应用程序池列表中找到新创建的应用程序池。\n\
  \n#### 如何运作...\n\n应用程序池处理一个或多个 Web 应用程序。我们创建了一个应用程序池，我们需要设置网站属性以更新配置。你可以将框架属性设置为你的\
  \ Web 应用程序支持的框架。\n\n#### 如何操作...\n\n- 1. 在 Windows Server 2016 上打开服务器管理器。单击“工具”菜单并打开\
  \ IIS 管理器。\n- 2. 展开 IIS 服务器（WIN2016IIS）。你将看到列出的应用程序池：\n- 3. 我们已经创建了一个应用程序池，它显示在应用程序池窗口中。我们创建了\
  \ 2and3.5AppPool、Asp.net 和 DefaultAppPool（默认的）。\n- 4. 在“操作”面板中，我们可以添加多个应用程序池，并且我们可以将其中任何一个创建的应用程序池设为默认。默认应用程序池在创建网站时很有用：它是选定的应用程序池，除非另有设置。\n\
  - 5. 选择 2and3.5AppPool。你将看到“操作”窗格，其中列出了可用的属性，如果需要，你可以在其中进行一些更改。2and3.5AppPool 的版本为\
  \ v2.0：\n\n![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_78_0.png)\n\n### 在 IIS 10.0\
  \ 中创建应用程序池\n\n![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_79_0.png)\n\n6. 看一下“操作”面板，其中有“应用程序池任务”和“编辑应用程序池”选项。从“应用程序池任务”列表中，我们可以启动、停止和回收...应用程序池。\n\
  \n7. 现在让我们来看看应用程序池的基本属性。从“编辑应用程序池”中单击“基本设置...”，你会看到此弹出窗口：\n\n![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_79_1.png)\n\
  \n- 16. **回收**是为了刷新应用程序池重叠。我们可以设置默认回收值。\n- 17. 我们可以通过单击 **Recycling...** 通过 **Recycling\
  \ settings** 添加更具体的设置。这就是窗口的样子：\n\n![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_82_0.png)\n\
  \n- 18. 回收基于诸如虚拟内存使用、私有内存使用、特定时间、定期时间间隔和固定请求数等条件。也将为你生成日志文件，帮助你了解何时执行了什么操作。在这里，你将根据时间和请求数设置固定间隔，或根据内存利用率和虚拟和私有内存设置特定时间。单击\
  \ **Next**。\n\n### 编辑应用程序池回收设置\n\n#### 要记录的回收事件\n\n在回收应用程序池时可以生成事件日志条目。选择要记录的回收事件。\n\
  \n可配置的回收事件：\n\n- 定期时间间隔\n- 计划时间\n- 虚拟内存使用\n- 私有内存使用\n- 请求数\n\n运行时回收事件：\n\n- 按需\n\
  - 配置更改\n- 不健康的 ISAPI\n\n19. 在“要记录的回收事件”窗口中，我们可以生成回收事件的日志。\n\n#### 如何运作...\n\n在本教程中，我们学习了\
  \ IIS 应用程序的三种属性：基本属性、高级属性和回收。我们可以使用这些属性用于我们将在 IIS 服务器上托管的 Web 应用程序，以便通过应用程序池处理它们。托管\
  \ Web 应用程序时，始终有一些需要在应用程序池设置中配置的要求。\n\n例如，我们的管理层可能会决定我们需要限制 2and3.5apppool 应用程序的队列。我们只需进入高级设置并更改它即可。\n\
  \n在下一节中，我们将托管一个 v4.0 .NET framework 网站并使用 v4.0 应用程序池。\n\n### 托管 .NET 网页\n\n在本教程中，我们将托管一个受\
  \ .NET 默认 v4.0 支持的网页。我们将查看默认网站属性。我们将上传网页到默认的 `wwwroot` 目录。\n\n#### 准备工作\n\n我们需要在\
  \ IIS 10.0 服务器上安装 v4.0 应用程序，并且我们的 v4.0 .NET 网页应该准备就绪。我们需要安装一些尚未在 IIS 10.0 中安装的 IIS\
  \ 组件。为此，你必须具有管理员权限。\n\n#### 如何操作...\n\n首先，我们必须安装一些 .NET 支持组件。\n\n- 1. 在 Windows\
  \ Server 2016 上打开服务器管理器并单击 **Manage** 菜单。进入后，单击 **Add Roles and features**。\n- 2.\
  \ 单击 **Next**，直到进入 **Select server roles** 向导。按照此图中突出显示的确切路径操作：\n\n\n\n![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_85_0.png)\n\
  \n- 3. 扩展应用程序开发。您需要选择 .NET Extensibility 3.5、.NET Extensibility 4.6、ASP、ASP.NET\
  \ 3.5、ASP.NET 4.6、ISAPI Extensions 和 ISAPI Filters。\n- 4. 点击 Next 完成。现在让我们继续上传我们为演示目的创建的\
  \ .NET 框架网页。\n- 5. 打开 IIS 管理器，点击 **Default Web Site**，您会看到以下屏幕：\n\n![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_86_0.png)\n\
  \n- 6. 在 **Actions** 窗格中，您需要点击 **Basic Settings...** 并检查与默认网站关联的应用程序池的哪个版本。\n\n\
  ![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_86_1.png)\n\n- 9. 我们创建了 ASP.NET v4.0 文件，需要将其粘贴到\
  \ wwwroot 文件夹中，如下所示：\n\n![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_88_0.png)\n\n-\
  \ 10. 这里，我们已上传为测试和演示目的创建的 .NET 应用程序文件。我们将在本章最后一个配方中稍后测试该应用程序。\n\n#### How it works...\n\
  \n在本配方中，我们安装了 .NET Extensibility 3.5 和 4.6 组件。我们还安装了 ASP、ASP.NET 和 ISAPI 的支持，这些在默认安装的\
  \ IIS 10.0 中不可用。我们探索了应用程序池属性并上传了为演示目的创建的 v4.0 .NET 应用程序文件。\n\n现在，将您的文件上传到 wwwroot\
  \ 目录，该目录与默认网站关联。一旦访问默认网站 URL，您的 .NET 应用程序文件将被应用程序池处理。\n\n### Hosting different versions\
  \ of a .NET website\n\n在本配方中，我们将托管一个受 .NET v2.0 支持的网页。我们将更改 **Default Web Site**\
  \ 的属性。我们将网页上传到默认的 `wwwroot` 目录。\n\n#### Getting ready\n\n我们已在 IIS 10.0 服务器上安装了 v2.0\
  \ 和 v3.5 框架版本。我们创建的 v4.0 .NET 网页应该已准备就绪。您必须具有管理员权限。\n\n#### How to do it...\n\n\
  - 1. 打开 IIS 管理器并点击 **Default Web Site**。\n- 2. 在 **Actions** 窗格中，点击 **Basic Settings...**\
  \ 然后点击下一张图中突出显示的 **Select...** 按钮：\n\n![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_89_0.png)\n\
  \n- 3. 应用程序池窗口将弹出。点击 Application pool: 下拉菜单，选择 Application Pools 下的 2and3.5AppPool，然后点击\
  \ OK 完成此步骤。\n\n![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_90_0.png)\n\n- 4. 现在，在站点属性中，您将看到与\
  \ Default Web Site 关联的 v2.0 应用程序池：\n\n![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_90_1.png)\n\
  \n- 5. 接下来，右键点击 Default Web Site，点击 Explore，您将获得 wwwroot 目录，您需要在其中上传 v3.5 .NET 网页文件：\n\
  \n![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_91_0.png)\n\n- 6. 我们已将 v3.5 文件上传到 wwwroot\
  \ 目录。\n\n#### How it works...\n\n在本配方中，我们将应用程序池属性从 v4.0 .NET 更改为 v2.0 .NET。我们已将\
  \ v3.5 .NET 文件上传到与 Default Web Site 关联的 wwwroot 目录。\n\n一旦访问 Default Web Site URL，您的\
  \ .NET 应用程序文件将被选定的应用程序池处理。\n\n### Testing different versions of a website\n\n在本配方中，我们将测试我们创建的\
  \ v3.5 应用程序池。也将测试默认的 v4.0 应用程序池。\n\n我们将测试 v4.0 和 v3.5 框架。我们已创建了两个文件并已将其上传到 wwwroot\
  \ 文件夹。\n\n#### Getting ready\n\n在本配方中，我们需要已配置的 v4.0 和 v3.5 框架。对于网页，我们已创建了 v4.0 和\
  \ v3.5 框架应用程序文件。我们将逐一测试 localhost URL 并查看结果。我们还将跨框架版本和 Web 应用程序文件进行测试。\n\n#### How\
  \ to do it...\n\n- 1. 我们将测试 v4.0 应用程序，即 DefaultAppPool。您已在上一个配方中将 Web 应用程序文件上传到\
  \ wwwroot 文件夹。\n- 2. 打开 Internet Explorer，在地址栏中输入 http://localhost/ 并按 Enter。您将看到以下屏幕：\n\
