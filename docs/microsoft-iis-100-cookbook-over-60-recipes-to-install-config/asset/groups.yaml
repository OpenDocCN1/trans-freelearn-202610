    - 1. 打开文件资源管理器，点击 **This PC**。在右侧你会看到可用的驱动器。

    - 2. 打开 c:\ 驱动器，进入名为 inetpub 的文件夹，你将看到 IIS 10.0 相关的文件夹列表。你需要找到 wwwroot 文件夹。

    - 3. 打开 `wwwroot` 文件夹。在 `wwwroot` 文件夹内，你需要创建 `mysite`、`v2mysite` 和 `v4mysite`
    子文件夹：


