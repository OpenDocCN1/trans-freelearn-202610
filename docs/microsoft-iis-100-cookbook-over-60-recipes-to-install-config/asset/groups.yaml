    # About the Author


    **Ashraf Khan** works as the Head Of Network Operating System Unit, with a diverse
    background in production systems, Network Administration, and Solutions Architecture.
    He has the MCSE-Server, MCSE-Messaging, MCSE-Cloud, CCNA, ITIL & Prince2 certifications.
    He has more than 13 years of experience in sectors such as IT infrastructure and
    private and government sectors located in India and the UAE and remote support
    for USA and worldwide for physical and virtual server environment IT management,
    implementation, planning, disaster recovery, testing, and technical support.


    I would like to express my gratitude to the many people who saw me through this
    book and to all those who provided support, talked things over, read, wrote, offered
    comments, allowed me to quote their remarks, and assisted in the editing, proofreading,
    and design.


    I would like to thank my editors Heramb Bhavsar and Sharon Raj and reviewer, Anwarul
    Haque, for enabling me to publish this book. Above all, I want to thank my wife,
    Shama, and the rest of my family, who supported and encouraged me in spite of
    all the times it took me away from them. It was a long and difficult journey for
    them.


    I would like to thank Sharon Raj for helping me in the process of selection and
    editing. Thanks to Packt who encouraged me.


    Last but not least, I beg forgiveness of all those who have been with me over
    the years and whose names I have failed to mention.'
