    ## 5. 在 IIS 10.0 上安装 HTTP/2


    在本章中，我们将介绍以下操作指南：


    - 了解 HTTP/2

    - 在 IIS 10.0 上安装 HTTP/2

    - 在 IIS 10.0 上配置 HTTP/2

    - 上传 .NET 网页

    - 测试上传的网页


    ### 简介


    HTTP/2 是 HTTP/1.1 的更新版本，通过在 TCP 连接上进行语义流传输，减少延迟和连接负载对 Web 服务器的影响。HTTP/2 协议可在 Windows
    10 和 Windows Server 2016 上运行。Windows 10 和 Server 2016 都拥有最新版本的 IIS 服务器，即 IIS 10.0。目前，只有
    IIS 10.0 支持 HTTP/2。在 HTTP/2 中，可以使用持久连接为多个同时请求提供服务。


    我们知道，每个 TCP 连接都需要一次往返来在服务器和客户端之间建立连接。HTTP/2 大大减少了请求在新连接建立时等待，或等待现有连接变为空闲的需求。


    HTTP/2 引入了 HPACK，这是一种用于 HTTP 标头的压缩方案，可减少请求之间的冗余。压缩有助于多路复用，因为请求更小。这使得客户端可以在连接上发送首批数据包时发出大量请求，而此时
    TCP 流控制窗口仍然很小。


    HTTP/2 还引入了**推送**的概念：服务器响应客户端尚未发出的请求，但以客户端可以缓存并在其他页面上重用的形式进行。如果底层连接支持**推送**，则会发生两件事：


    - 1. 向客户端发送一个 `PUSH_PROMISE`，以便客户端可以检查资源是否已存在于缓存中。

    - 2. 将一个新请求添加到被推送资源的请求队列中。


    ## 了解 HTTP/2


    在本操作指南中，我们将了解 HTTP/2。我们将在本章稍后访问几个网站，并检查是否支持 HTTP/2。我们将了解如何检查网站运行在 HTTP/2 还是 HTTP/1.1
    上。


    让我们详细介绍一下。


    ### 准备工作


    要完成本操作指南，你需要一个正在运行的 HTTP/2 网站和互联网连接。


    ### 操作步骤...


    - 1. 在 Windows 10 PC 或 Server 2016 上打开 Internet Explorer；这里我们使用 Windows 10 PC。

    - 2. 转到地址栏并输入 `www.google.ae`：


    ![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_151_0.png)


    - 3. 打开 `www.google.ae` 后，它会重定向到 `https://www.google.ae/`。现在我们需要检查 `www.google.com`
    使用的是 HTTP/2 还是 HTTP/1.1。

    - 4. 按 F12。你也可以按以下步骤操作：

    - 5. 转到**设置**并启用 F12 开发者工具；你将看到 DOM 资源管理器、控制台、调试器、网络、性能和内存。现在你需要切换到**网络**选项卡：


    ![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_152_0.png)


    - 6. 在这里，你将看到 `https://www.google.ae` 正在使用 HTTP/2。接下来，我们将在 IIS 10.0 服务器上应用 HTTP/2
    设置，以使用 HTTP/2 协议。


    ### 工作原理...


    在本操作指南中，我们启动了 URL www.google.ae。浏览器自动重定向到 https://www.google.ae。接下来，我们通过开发者工具测试
    HTTP/2，该工具可以通过 F12 键运行，也可以从“设置”菜单启用。


    ## 在 IIS 10.0 上安装 HTTP/2


    在本操作指南中，我们将通过 IIS 10.0 设置 HTTP/2 并启用日志记录选项。我们还将介绍如何在注册表中进行必要的更改以及在何处进行更改。


    - 3. 双击“日志记录”。在下一张图中，你会看到“站点”被选为默认日志文件类型，日志文件格式为 W3C，并且有许多字段可供选择。


    ![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_154_0.png)


    - 4. 日志记录配置步骤可帮助我们跟踪日志文件，并通过 HTTP 或 HTTP/2 检查网站访问情况。

    - 5. 如图所示，“每个站点一个日志文件”意味着每个网站都有自己的日志文件。因此，使用日志文件信息将很容易。我们还可以选择为服务器指定日志文件，这样它将为你的服务器创建一个日志文件。这意味着，如果你在一台服务器上托管了许多网站，并且该服务器只有一个日志文件，那么跟踪日志信息可能非常困难。这就是我们选择按站点划分日志文件的原因——W3C
    日志记录字段中有很多选项，可用于通过主机名、IP 地址、端口以及客户端 IP 地址等来识别。我们刚刚验证了我们推荐的选项。


