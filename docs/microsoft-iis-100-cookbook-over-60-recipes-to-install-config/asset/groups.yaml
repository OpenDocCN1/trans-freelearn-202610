    ## 3. Hosting Multiple Websites on IIS 10.0


    在本章中，我们将介绍以下配方：


    - Hosting multiple websites

    - Creating a website folder

    - Configuring websites

    - Configuring ports

    - Configuring the website IP

    - Deploying websites

    - Testing websites


    ### Introduction


    使用 Microsoft IIS 10 Server 中的多个 Web 主机，您可以在同一台 IIS 10 服务器上托管一个或多个网站。网站可以使用 SSL（安全套接字层）通过超文本传输协议（HTTPS）使用默认端口
    80 进行托管。通常，所有网站都通过 HTTP 或 HTTPS 访问默认端口 80。如果您以加密方式运行网站，协议为 HTTPS，是一个安全端口。


    网站是访问网络所必需的，可以通过局域网（LAN），称为内联网，或广域网（WAN），称为互联网。


    您需要域名、IP地址和端口来运行您的网站或 Web 应用程序。


    我们已经执行了安装并创建了应用程序池。现在让我们在同一台 IIS 10 服务器上启动多个 Web 主机，并使用其主机名（域名）访问网站。


    ## Hosting multiple websites


    在本配方中，我们将在 IIS 10.0 中创建三个网站：mysite.com、v2mysite.com 和 v4mysite.com。我们将在本章后面在 `hosts`
    文件中进行主机名条目。我们将使用其主机名访问网站。


    让我们继续到下一节，我们将在那里详细介绍。


