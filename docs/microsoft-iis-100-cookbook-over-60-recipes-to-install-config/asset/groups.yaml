    # Configuring IIS 10.0 websites on Nano Server


    In this recipe, we will use PowerShell commands to recycle the `v5mysite.com`
    application pool. We will check the default **Document Settings** and listed page
    name and add the new filename to the default document, `v5mysite.htm`. We will
    make the changes in the physical path of the `v5mysite.com` website.


    # Getting ready


    In this recipe, we are going to remote connect Nano Server through PowerShell
    and configure our website through the `IISAdministrator` module. You will require
    a Windows Server 2016 virtual or physical server for remote PowerShell management
    for Nano Server 2016. For all this installation and configuration work, you should
    have administrative privileges.


    # How to do it...


    +   1. Log in to Windows Server 2016 with the `172.16.15.60` and name **WIN2016IIS**.
    Press *Windows + R* on your keyboard, and you will get the **Run** window. Open
    PowerShell ISE with administrative rights, and type in the command `RunAs /user:Administrator
    PowerShell_ISE.exe` in the **Run** window, as shown here:


    ![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_246_0.png)'
  - '[PAGE 247]


    +   2. Press **OK**. It will ask you the administrator password of your Windows
    Server 2016 instance (not Nano Server). Type the administrator password and press
    *Enter*. Now the PowerShell window will open.

    +   3. Now we have to remote connect to Nano Server 2016 at IP 172.16.15.63. Write
    the following command in PowerShell:


    ```

    Enter-PSSession -ComputerName "172.16.15.63" -Credential \Administrator

    ```


    +   4. Now you will get a pop-up window for the Nano Server administrator username
    and password. Enter the administrator password and press **OK** to log in. You
    have successfully connected.

    +   5. Now let''s import the IIS Administration module. Write the command `Import-module
    IISAdministration` and press *Enter*. You will get the PowerShell module imported.


    +   6. Write the command `Get-IISAppPool $sm = Get-IISServerManager $sm.ApplicationPools["NanoAPP"].Recycle()`
    to recycle the application pool NanoAPP, as shown here:


    ![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_247_0.png)'
