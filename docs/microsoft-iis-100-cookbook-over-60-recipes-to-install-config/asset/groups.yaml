    # 7


    Deploying IIS 10.0 on Nano Server


    In this chapter, we will cover the following recipes:


    +   - Understanding IIS 10.0 on Nano Server

    +   - Installing IIS 10.0 on Nano Server

    +   - Managing IIS 10.0 on Nano Server

    +   - Creating an IIS 10.0 website on Nano Server

    +   - Configuring an IIS 10.0 website on Nano Server

    +   - Uploading website pages

    +   - Testing uploaded web pages


    # Introduction


    Nano Server is a remotely administered server operating system, optimized for
    private clouds and local or remote datacenters. Nano Server is similar to the
    Windows Server core mode operating system. It doesn''t have any GUI interface,
    and it is smaller than Windows Server''s core mode.


    Nano Server has no local login capability. It only supports 64-bit applications,
    tools, and agents.


    Nano Server takes up very less disk space, is installed quickly, needs fewer updates
    and less time to restart than Windows Server.'
