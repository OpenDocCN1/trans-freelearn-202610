    # How it works...


    In this recipe, we logged in to Windows Server 2016 WIN2016IIS and checked the
    IP address restriction rules and access and deny rules on the server. We accessed
    the website `https://172.16.15.60` (**mysite.com**) from server `172.16.15.60`
    and website `https://172.16.15.60` (**mysite.com**) from server `172.16.15.65`.


    ## 13

    ## Managing and Troubleshooting IIS 10.0


    In this chapter, we will cover the following recipes:


    - Managing IIS 10.0

    - Installing Health, Diagnostics, and Performance features

    - Configuring Health and Diagnostics

    - Configuring Failed Request Tracing Rules

    - Configuring static content compression


    ## Introduction


    Health and Diagnostics provides an infrastructure to monitor, manage, and troubleshoot
    the health of a web server, sites, and applications.


    The advantage is the detailed trace events that track a request throughout the
    complete request-and-response process. To enable the collection of these trace
    events, IIS Server can be configured to automatically capture full trace logs,
    in XML format, for any particular request based on elapsed time or error response
    codes.


    ## How to do it...


    1. Log in to Windows Server 2016 with an administrator account.

    2. Open **Server Manager**.

    3. Click on **Tools** and you will find IIS Manager. Open IIS Manager and click
    on the IIS server **WIN2016IIS**. Go to the **Features View**, as shown here:


    ![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_373_0.png)


    4. You can see in the figure that we''ve selected **Worker Processes**. **Worker
    Processes** are only available in the IIS Server **Features View** and not in
    the website''s **Features View**. **Worker Processes** enable you to view the
    application process'' utilization of server resources.


    5. Next, we have to expand the Sites folder and click on mysite.com, as shown
    here:


    ![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_374_0.png)


    6. As you can see, we''re selecting Compression, HTTP Responder, Failed Request
    Tracer, and Logging. These are features of the health and performance of IIS Server.
    In the next recipe, we will go on to install the health, diagnostics, and performance
    features.


    ## How it works...


    In this recipe, we logged in to IIS Server and opened IIS Manager. We went through
    the features view of IIS Server to view the Health and Diagnostics features and
    the `mysite.com` features view to check the available Health and Diagnostics options.


    ## Installing Health, Diagnostics, and Performance features


    In this recipe, we will log in to Windows Server 2016, on which we have already
    installed IIS 10.0. We will open Server Manager and install the Health and Diagnostics
    features of IIS 10.0 Server. We will then install the performance features of
    IIS 10.0 Server.


    ## Getting ready


    For this recipe, we require an up-and-running IIS 10.0 instance on Windows Server
    2016. You should have administrative privileges.


    ## How to do it...


    1. Log in to Windows Server 2016 with an administrator account.

    2. Open Server Manager.


    4. In the Add roles and features window, click on Next until you reach the Server
    Roles wizard. Expand Web Server, as shown here:


    ![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_377_0.png)


    5. Select Custom Logging, Logging Tools, ODBC Logging; the preinstalled options
    are Request Monitor, Tracing, and HTTP logging.


    6. Expand the Performance features option from Server Roles to install them on
    IIS, you can see the details in this figure:


    ![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_378_0.png)


    7. We have already installed Static Content Compression. Now select Dynamic Content
    Compression.


    8. Click on **Next**, skip the features wizard, and click on **Next** again. You
    will get the **Confirmation** window, as shown here:


    ![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_379_0.png)


    9. You can see that we have selected the **Health and Diagnostics** and **Performance**
    features, which we are going to install. I also selected the restart checkbox
    at the top. Next, you have to click on **Install**. You can see in the next figure
    that it''s installed successfully:


    ![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_380_0.png)


    10. We''ve now finished the installation. In the next recipe, we will set up the
    configuration.


    3. Click on the Tools menu in Server Manager, and you will find IIS Manager. Open
    IIS Manager and click on the IIS server called WIN2016IIS. Go to the Features
    View, and select Worker Processes, as shown here:


    ![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_382_0.png)


    4. Go to **Actions**, and click on **Open Feature**. This will open the **Worker
    Processes**, as shown here:


    ![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_383_0.png)


    5. You''ll see in the figure that we don''t have any application pool in the worker
    processes because we are not using any application pool right now. If your web
    server hosts a website application, here you will find the application pool''s
    server-utilization details. You can manage the application pool load in IIS Server.


    6. Let''s go to Logging. Expand WIN2016IIS, expand Sites, click on mysite.com,
    go to Features View, and click on Logging, as shown here:


    ![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_384_0.png)


    8. You can see **Log File | Format** in the figure, which we''ve selected to default
    to W3C. Now you have to click on the **Select Fields...** button. You will get
    the **W3C Logging Fields**, as shown here:


    ![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_386_0.png)


    9. Here in this **W3C Logging Fields** window, you can select checkboxes as per
    your requirements to generate the log file. Click on the **Cancel** button. We''ll
    use the default.

    10. Click on mysite.com, go to the **Features View**, and click on **HTTP Response
    Header**, as shown here:


    ![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_387_0.png)


    ## How it works...


    In this recipe, we logged in to IIS Server and opened IIS Manager. We opened the
    features view of IIS Server to configure the worker-process features. We also
    configured logging features and discussed the HTTP Response Header features.


    ## Configuring Failed Request Tracing Rules


    In this recipe, we will log in to IIS Server and open IIS Manager. We will open
    the Features View of mysite.com to add Failed Request Tracing Rules. We will check
    out how to edit them. We will also check out the Failed Request Tracing Rules
    log file directory and enable the rules.


    ## Getting ready


    In this recipe, we require an up-and-running IIS 10.0 instance. The Failed Request
    Tracing Rules component should be installed. You should have administrative privileges.


    ## How to do it...


    1. Log in to Windows Server 2016 with an administrator account.

    2. Open Server Manager.


    3. Click on **Tools** and you will find IIS Manager. Open IIS Manager, and expand
    the IIS server **WIN2016IIS**. Expand the Sites folder, click on mysite.com, go
    to the **Features View** of **mysite.com**, and select **Failed Request Tracing
    Rules**, as shown here:


    ![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_390_0.png)


    4. Open the **Failed Request Tracing Rules** option, as shown here:


    ![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_391_0.png)


    5. You can see that we''ve selected the **Actions** pane. We have a list of options
    available. We are going to add **Failed Request Tracing Rules**. Click on the
