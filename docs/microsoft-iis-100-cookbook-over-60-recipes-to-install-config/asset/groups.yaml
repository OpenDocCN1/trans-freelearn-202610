    ## 10


    ## 安装和配置 SSL 网站


    在本章中，我们将介绍以下操作指南：


    - 了解 IIS 10.0 中的 SSL 网站

    - 安装 SSL

    - 创建 SSL 证书

    - 使用 SSL 端口和证书配置网站

    - 使用 PowerShell 命令创建 SSL 证书

    - 测试 SSL 网站


    ## 简介


    我们可以使用数字证书和诸如安全套接字层（SSL）之类的技术，基于公钥加密构建安全的基础设施。


    要发布安全的网站或 Web 应用程序，我们需要两样东西：


    - 1. HTTPS（安全）端口 443

    - 2. SSL 证书


    HTTPS 是一种安全通信通道，用于在客户端计算机和服务器之间交换信息。它使用 SSL。


    要在 IIS 中启用 SSL，必须先创建一个证书，用于对网络上传输的信息进行加密和解密。IIS 自带证书请求工具，可用于向证书颁发机构发送证书请求。此工具简化了获取证书的过程。


    ## 了解 IIS 10.0 中的 SSL 网站


    在本操作指南中，我们将打开一些 HTTPS 网站并检查它们的 SSL 证书。


    ### 准备工作


    要完成本操作指南，你需要一台计算机和互联网连接。


    ### 操作步骤...


    - 1. 在 Windows Server 2016 或 Windows 10 上打开 Internet Explorer；这里我们使用的是 Windows
    Server 2016。

    - 2. 转到地址栏并输入 `https://www.microsoft.com/en-gulf/`，如下所示：


    ![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_289_0.png)


    3. 在地址栏的末尾有一个挂锁符号，它告诉我们网站 https://www.microsoft.com/en-gulf/ 是一个安全网站。我们点击它并查看详细信息：


    ![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_290_0.png)


    4. 可以看到 VeriSign 已将本站点标识为 www.microsoft.com。单击“查看证书”，你将看到证书的属性：


    ![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_290_1.png)


    ## 工作原理...


    在本操作指南中，我们检查了 www.microsoft.com，并看到它使用 **超文本传输安全协议（HTTPS）**。我们还检查了该网站的 SSL 证书。最后，我们打开了证书属性，查看了网站和证书提供商的详细信息。


    ## 安装 SSL


    在本操作指南中，我们将在 WIN2016IIS 服务器上打开 IIS 管理器并创建证书请求。我们还将了解如何导入第三方 SSL 证书。


    ### 准备工作


    要完成本操作指南，我们将为证书提供商创建 SSL 证书请求。此外，我们还将了解如何在 IIS 上导入/安装证书。你需要一个正在运行的 IIS 10.0 服务器和一个管理员帐户，该帐户将用于对
    IIS 10.0 进行更改。


    ### 操作步骤...


    - 1. 转到 **WIN2016IIS** 并登录到 IIS 10.0 服务器。打开服务器管理器，然后转到 **工具** 菜单。

    - 2. 打开 IIS 管理器，单击 **WIN2016IIS** IIS 服务器，如下所示：


    ## 安装和配置 SSL 网站


    ![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_292_0.png)


    4. 在功能视图中，有一个“服务器证书”选项。打开服务器证书，如下所示：


    ![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_292_1.png)


    5. 转到 **操作** 窗格。可以看到有一个 **创建证书请求** 选项。单击 **创建证书请求**，将打开 **请求证书** 窗口。你必须填写详细信息，如下所示：


    ![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_293_0.png)


    7. 选择你需要的加密 **位长度**。在本例中，我选择了 **1024**。单击 **下一步**。现在你必须提供要存储证书请求文件的本地路径和文件名：


    ![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_295_0.png)


    8. 我们将证书请求文件存储在 `administrator.CALL\Documents\Certificate request` 文件夹中，文件名为 `cert-request-mysite.txt`。单击
    **完成。**


    10. 可以看到，我们已经创建了加密格式的证书请求。现在你可以将文件发送到证书颁发机构购买 SSL 证书。


    11. 现在让我们看看如何导入已购买或生成的证书。


    12. 打开 IIS 管理器，单击 WIN2016IIS IIS 服务器。转到“操作”窗格，单击“导入证书”：


    ![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_297_0.png)


    13. 现在你有了 .pfx 证书，可以浏览并输入密码。你还可以选择证书存储类型：个人或 Web 托管。单击“确定”。


    14. 你可以导入 .cer 类型的证书；在 IIS 服务器的“操作”窗格中，单击“完成证书请求”，如下所示：


    ### 准备工作


    要完成本操作指南，你需要一个正在运行的 IIS 10.0 服务器和一个管理员帐户，该帐户将用于对 IIS 10.0 进行更改。


    ### 操作步骤...


    - 1. 转到 **WIN2016IIS** 并登录到 IIS 10.0 服务器。打开服务器管理器，然后转到 **工具** 菜单。

    - 2. 打开 IIS 管理器并单击 **WIN2016IIS**，如下所示：


    ![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_299_0.png)


    3. 转到 **操作** 窗格并单击 **创建自签名证书**。我们仅将其用于测试目的。此本地服务器证书在 Internet 上无效。现在将打开 **创建自签名证书**
    窗口，如下所示：


    ![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_300_0.png)


    4. 在这里，你可以输入一个便于识别证书的友好名称。你可以选择“个人”或“Web 托管”证书存储类型；我们将选择“个人”。单击“确定”。现在证书已创建，如下所示：


    ![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_301_0.png)


    ## 工作原理...


    在本操作指南中，我们在 WIN2016IIS 上打开了 IIS 管理器。我们还使用“个人”选项在 WIN2016IIS 上创建了 SSL 自签名证书。


    ## 使用 SSL 端口和证书配置网站


    在本操作指南中，我们将在 WIN2016IIS 上打开 IIS 管理器。我们还将配置 mysite.com 上的 SSL 证书。

    '
