    # 如何运作...


    在本教程中，我们登录到 Windows Server 2016 WIN2016IIS 并检查服务器上的 IP 地址限制规则以及访问和拒绝规则。我们从服务器
    `172.16.15.60` 访问网站 `https://172.16.15.60` (**mysite.com**) 以及从服务器 `172.16.15.65`
    访问网站 `https://172.16.15.60` (**mysite.com**).


    ## 13

    ## 管理和故障排除 IIS 10.0


    在本章中，我们将涵盖以下教程：


    - 管理 IIS 10.0

    - 安装健康、诊断和性能功能

    - 配置健康和诊断

    - 配置失败请求跟踪规则

    - 配置静态内容压缩


    ## 简介


    健康和诊断提供了一种基础设施，用于监控、管理和排查 Web 服务器、站点和应用程序的健康状况。


    其优势在于详细的跟踪事件，可在完整的请求和响应过程中跟踪请求。为了启用这些跟踪事件的收集，IIS 服务器可以配置为基于经过的时间或错误响应代码，自动捕获特定请求的完整跟踪日志，格式为
    XML。


    ## 如何操作...


    1. 使用管理员账户登录到 Windows Server 2016。

    2. 打开 **Server Manager**。

    3. 点击 **Tools**，你会找到 IIS Manager。打开 IIS Manager 并点击 IIS 服务器 **WIN2016IIS**。转到
    **Features View**，如下所示：


    ![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_373_0.png)


    4. 你可以在图中看到，我们选择了 **Worker Processes**。**Worker Processes** 仅在 IIS 服务器的 **Features
    View** 中可用，而不在网站的 **Features View** 中。**Worker Processes** 使你能够查看应用程序进程对服务器资源的利用情况。


    5. 接下来，我们需要展开 Sites 文件夹并点击 mysite.com，如下所示：


    ![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_374_0.png)


    6. 如你所见，我们正在选择 Compression、HTTP Responder、Failed Request Tracer 和 Logging。这些是
    IIS 服务器的健康和性能功能。在下一个教程中，我们将继续安装健康、诊断和性能功能。


    ## 如何运作...


    在本教程中，我们登录到 IIS 服务器并打开 IIS Manager。我们浏览了 IIS 服务器的功能视图以查看健康和诊断功能，并检查 `mysite.com`
    功能视图中的可用健康和诊断选项。


    ## 安装健康、诊断和性能功能


    在本教程中，我们将登录到 Windows Server 2016，在该服务器上我们已经安装了 IIS 10.0。我们将打开 Server Manager 并安装
    IIS 10.0 服务器的健康和诊断功能。然后我们将安装 IIS 10.0 服务器的性能功能。


    ## 准备工作


    对于本教程，我们需要一台正在运行的 Windows Server 2016 上的 IIS 10.0 实例。你应该拥有管理员权限。


    ## 如何操作...


    1. 使用管理员账户登录到 Windows Server 2016。

    2. 打开 Server Manager。


    4. 在添加角色和功能窗口中，点击 Next 直到到达服务器角色向导。展开 Web Server，如下所示：


    ![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_377_0.png)


    5. 选择 Custom Logging、Logging Tools、ODBC Logging；预安装的选项为 Request Monitor、Tracing
    和 HTTP logging。


    6. 从服务器角色中展开 Performance features 选项以在 IIS 上安装它们，你可以在此图中看到详细信息：


    ![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_378_0.png)


    7. 我们已经安装了 Static Content Compression。现在选择 Dynamic Content Compression。


    8. 点击 **Next**，跳过功能向导，再次点击 **Next**。你将看到 **Confirmation** 窗口，如下所示：


    ![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_379_0.png)


    9. 你可以看到我们已选择 **Health and Diagnostics** 和 **Performance** 功能，即将安装。我还勾选了顶部的重启复选框。接下来，你需要点击
    **Install**。你可以在下一张图中看到它已成功安装：


    ![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_380_0.png)


    10. 我们现在已完成安装。在下一个教程中，我们将设置配置。


    3. 在 Server Manager 中点击 Tools 菜单，你会找到 IIS Manager。打开 IIS Manager 并点击名为 WIN2016IIS
    的 IIS 服务器。转到 Features View，并选择 Worker Processes，如下所示：


    ![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_382_0.png)


    4. 转到 **Actions**，并点击 **Open Feature**。这将打开 **Worker Processes**，如下所示：


    ![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_383_0.png)


    5. 你会在图中看到我们目前在 worker processes 中没有任何应用程序池，因为我们现在没有使用任何应用程序池。如果你的 Web 服务器托管了一个网站应用程序，这里你会找到应用程序池的服务器利用详情。你可以在
    IIS 服务器中管理应用程序池负载。


    6. 让我们转到 Logging。展开 WIN2016IIS，展开 Sites，点击 mysite.com，转到 Features View，并点击 Logging，如下所示：


    ![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_384_0.png)


    8. 你可以在图中看到 **Log File | Format**，我们已将其选择为默认的 W3C。现在你需要点击 **Select Fields...**
    按钮。你将看到 **W3C Logging Fields**，如下所示：


    ![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_386_0.png)


    9. 在此 **W3C Logging Fields** 窗口中，你可以根据需要选择复选框以生成日志文件。点击 **Cancel** 按钮。我们将使用默认值。

    10. 点击 mysite.com，转到 **Features View**，并点击 **HTTP Response Header**，如下所示：


    ![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_387_0.png)


    ## 如何运作...


    在本教程中，我们登录到 IIS 服务器并打开 IIS Manager。我们打开了 IIS 服务器的功能视图以配置 worker-process 功能。我们还配置了日志功能并讨论了
    HTTP Response Header 功能。


    ## 配置失败请求跟踪规则


    在本教程中，我们将登录到 IIS 服务器并打开 IIS Manager。我们将打开 mysite.com 的 Features View 以添加失败请求跟踪规则。我们将查看如何编辑它们。我们还将查看失败请求跟踪规则日志文件目录并启用规则。


    ## 准备工作


    在本教程中，我们需要一个正在运行的 IIS 10.0 实例。失败请求跟踪规则组件应已安装。你应该拥有管理员权限。


    ## 如何操作...


    1. 使用管理员账户登录到 Windows Server 2016。

    2. 打开 Server Manager。


    3. 点击 **Tools**，你会找到 IIS Manager。打开 IIS Manager，并展开 IIS 服务器 **WIN2016IIS**。展开
    Sites 文件夹，点击 mysite.com，转到 **mysite.com** 的 **Features View**，并选择 **Failed Request
    Tracing Rules**，如下所示：


    ![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_390_0.png)


    4. 打开 **Failed Request Tracing Rules** 选项，如下所示：


    ![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_391_0.png)


    5. 你可以看到我们已选择 **Actions** 侧边栏。我们有一系列可用选项。我们将添加 **Failed Request Tracing Rules**。点击
    **Actions** 侧边栏中的 **Add** 选项：


    ## 添加失败请求跟踪规则


    ## 指定要跟踪的内容


    你想跟踪什么？


    - 所有内容 (*)

    - ASP.NET (*.aspx)

    - ASP (*.asp)

    - 自定义：


    示例：tr*.aspx


    上一步   下一步   完成   取消


    6. 选择 **All content (*)** 单选按钮。你还有其他选择；**ASP.NET** 或 **ASP** 以及自定义。点击 **Next**：


    ![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_393_0.png)


