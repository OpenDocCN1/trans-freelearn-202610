    - 6. **Physical path** 是网站应用程序文件所在的路径，位于 `wwwroot` 文件夹中。你可以自定义 **Connect as...**
    选项并测试设置以检查其在浏览器中是否正常工作。

    - 7. 现在让我们继续配置所选网站的 **Advanced Settings...**。

