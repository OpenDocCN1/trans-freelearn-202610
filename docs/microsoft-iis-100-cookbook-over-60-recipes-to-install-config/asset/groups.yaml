    ### Introduction


    Using multiple web hosts in Microsoft IIS 10 Server, you can host one or more
    websites on the same IIS 10 server. The website can be hosted using SSL (Secure
    Socket Layer) over Hyper Text Transfer Protocol (HTTPS) using the default port,
    80. In general, all websites get access on default port 80 using either HTTP or
    HTTPS. If you run your website encrypted, the protocol is HTTPS, a secure port.


    A website is needed to access a network, either through LAN, which can be called
    intranet, or Wide Area Network (WAN), which can be called internet.


    You need a domain name, IP address, and port to run your website or web application.


    We have already performed the installation and created application pools. Now
    let''s start multiple web hosts on the same IIS 10 server and access the websites
    using their host names (domain names).


    ## Hosting multiple websites


    In this recipe, we will create three websites in IIS 10.0: mysite.com, v2mysite.com,
    and v4mysite.com. We will make the hostname entries in the `hosts` file later
    in this chapter. We will access the website with its hostname.


    Let''s move on to the next section, where we will be covering this in detail.


    ### Getting ready


    To step through this recipe, you will need a running IIS 10 instance and administrator
    user account. You are going to create and configure the website''s properties.


