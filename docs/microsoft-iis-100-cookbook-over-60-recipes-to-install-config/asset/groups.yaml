    \n- 12. In the Ethernet properties, you will get IP version 4 (TCP/IPv4). We are\
    \ using IP version 4, so we will configure only TCP/IPv4. If you have a TCP/IPv6\
    \ IP address, you can use the TCP/IPv6 protocol.\n- 13. Click on the **Properties**\
    \ button:\n\n  ![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_119_0.png)\n\n- 14. You\
    \ have to add the new IP here.\n- 15. Click on the **Add** button, and enter 172.16.15.61.\
    \ It will also ask you to define your subnet. We will add the subnet mask 255.255.255.0\
    \ (the given subnet mask is the default). Click on the **OK** button. Click on\
    \ OK a few more times until you close the Ethernet properties.\n- 16. Now you've\
    \ configured the new IP for your website and IIS Server that will recognize the\
    \ additional IP address for the IIS server. You have to configure the IP address,\
    \ which option is available under the Advanced TCP/IP Settings property of the\
    \ IP Settings tab. In the IP Settings tab, we can add multiple IPs on the same\
    \ IIS Server, which we can use to dedicate to each website.\n\n### How it works...\n\
    \nOnce we configure the dedicated IP for our website, we have to perform the configuration\
    \ of TCP/IP protocol settings. We have to add the new IP. The IIS 10 server will\
    \ check whether the IP is active and configured. Now you can access the website\
    \ v4mysite.com on IP 172.16.15.61.\n\n### Deploying websites\n\nIn this recipe,\
    \ we will deploy three websites, namely, mysite.com, v2mysite.com, and v4mysite.com.\
    \ In our case, we already have these sites ready for deployment, but in your case,\
    \ you have to create your own, or you can use any available older version to upload\
    \ under the appropriate site folder, which we've learned in our previous examples.\n\
    \n### Getting ready\n\nTo step through this recipe, you will need a running IIS\
    \ 10 instance, and websites mysite.com, v2mysite.com, and v4mysite.com configured.\
    \ You need three sets of website application files as per our demonstration or\
    \ HTML pages with an administrator user account.\n\n### How to do it...\n\n- 1.\
    \ Open Server Manager on Windows Server 2016. Click on the **Tools** menu and\
    \ open **IIS Manager**.\n- 2. Expand the IIS server (WIN2016IIS). We get the listed\
    \ application pools and sites; inside the Sites folder, we have three websites\
    \ created, namely, mysite.com, v2mysite.com and v4mysite.com.\n- 3. Select mysite.com,\
    \ go to the **Actions** panel, click on **Basic Settings**, and check the physical\
    \ path of mysite.com. You will get the physical path of mysite.com.\n- 4. The\
    \ mysite.com physical path is `C:\\inetpub\\mysite`:\n\n  ![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_121_0.png)\n\
    \n- 5. Follow the previous steps to copy `v2mysite.com` to the appropriate folder.\n\
    - 6. Open the IIS Manager, go to the **Connections** panel, right-click on **v2mysite.com**\
    \ under the **Sites** menu in the left-hand panel, and click on **Explore**. It\
    \ will open the physical path of `v2mysite.com`:\n\n  ![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_121_1.png)\n\
    \n  ![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_123_0.png)\n\n### How it works...\n\
    \nIn steps 1 to 9, we opened the three different types of physical paths of each\
    \ website, and we uploaded the website files. In step 10, we know from where to\
    \ make settings for your home page or default page.\n\n### Testing websites\n\n\
    In this recipe, we will test three websites inside IIS 10.0: mysite.com, v2mysite.com,\
    \ and v4mysite.com. We already created some web files, which we uploaded to the\
    \ website folders.\n\n### Getting ready\n\nYou already have a well-configured\
    \ IIS 10.0 server instance and websites (mysite.com, v2mysite.com, and v4mysite.com).\
    \ We've also configured and pre-uploaded website application files or HTML pages.\
    \ You may need an administrator user account, depending on the changes to be made.\n\
    \n### How to do it...\n\n- 1. Open a browser and type in `mysite.com`.\n- 2. Look\
    \ at the address bar; it by default displays `http://mysite.com`. Let's test `v2mysite.com`\
    \ in the next step.\n- 3. Type the URL `v2mysite.com` in the address bar:\n\n\
    \  ![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_124_0.png)\n\n- 6. We have the IIS\
    \ 10 server, which has the IP address `172.16.15.60`. We are running two websites,\
    \ `mysite.com` and `v2mysite.com`, on IP `172.16.15.60`. We added a dedicated\
    \ IP `172.16.15.61` for the website `v4mysite.com`, and in the same IIS server,\
    \ you can configure multiple IP addresses to use specific IPs for individual sites.\n\
    \n### How it works...\n\nIn this recipe, we tested the website mysite.com with\
    \ **DefaultAppPool** in steps 1 and 2. In steps 3 and 4, we tested website v2mysite.com\
    \ with the default landing page `Demo.html`, which was configured under the Default\
    \ Document through IIS Server Manager. In steps 5 and 6, we tested the website\
    \ v4mysite.com with dedicated IP `172.16.15.61`.\n\nFor example, you have website\
    \ pages at different locations in IIS server, such as `d:\\VD`. You can create\
    \ a virtual directory and use it in an existing website. If you have a different\
    \ web application that needs an application pool in the website, you can create\
    \ a virtual directory and add the required application pool.\n\n### Constructing\
    \ a virtual directory in IIS 10.0\n\nIn this recipe, we are going to create a\
    \ virtual directory step by step. We will add the alias of the virtual directory\
    \ (alias is the virtual name of a physical directory). We will also apply the\
    \ settings of the physical path of the virtual directory.\n\n### Getting ready\n\
    \nTo step through this recipe, you will need a running IIS 10.0 instance. You\
    \ should also have administrative privileges.\n\n### How to do it...\n\n- 1. Go\
    \ to the C: drive. We have already created a folder named Websites; under the\
    \ Websites folder, you have to create a folder called VirtualDirectory, as shown\
    \ here:\n\n"
  mdcn: "\n\n## 在 IIS 10.0 上托管多个网站\n\n- 10. 点击 **在 172.16.15.60:8080 上浏览 mysite.com**。你将看到你的网站，如图所示：\n\
