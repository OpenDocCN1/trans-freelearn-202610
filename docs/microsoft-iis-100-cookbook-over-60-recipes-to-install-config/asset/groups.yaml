    Rename 或在 Actions 窗格下点击 Basic Settings 以获得相同的重命名选项，将其重命名为 v2mysite.com。重命名网站仅用于标识网站。

    - 12. 现在我们将添加 v4mysite.com。在 Connections 窗格中，点击 Sites 菜单，转到 Actions 面板并点击 Add
    Websites...。您将获得 Add Websites... 窗口：


    ![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_99_0.png)


    - 13. 我们添加 **Site name** `v4mysite.com` 并选择 **Application pool** `2and3.5AppPool`。

    - 14. 保留默认目录为 `wwwroot`。我们添加的 IP 地址与服务器 IP 相同。

    - 15. 将端口号保留为默认端口号，即 `80`。主机名为 `v4mysite.com`。**Start Website immediately** 是默认选项，已选中。点击
    **OK** 按钮。

    - 16. 我们将按照相同的步骤添加更多网站；我们将再创建一个名为 `mysite.com` 的网站。

