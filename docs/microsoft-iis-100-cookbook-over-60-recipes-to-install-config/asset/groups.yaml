    \ 文件夹中。我们创建了一个虚拟机并将 `Nano.vhd` 附加到 Nano Server 2016 虚拟机上：\n\n    ![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_208_0.png)\n\
    \n16. 单击 OK 关闭 Nano Server 2016 设置窗口。\n\n17. 进入 HV1-Host（172.16.15.181）服务器，打开\
    \ Hyper-V 管理器，进入虚拟机窗格，选择 Nano Server 2016 VM。进入 Nano Server 2016 操作窗格，打开 Nano\
    \ Server 2016。接下来，你需要单击 Connect 以查看服务器登录屏幕。输入管理员用户名和密码（你在创建 Nano Server 实例时设置的自己的密码），按\
    \ Enter，即可登录。\n\n### How it works...\n\n在本教程中，我们在 Nano Server 上安装了 IIS 10.0 并创建了一个\
    \ Nano Server 2016 虚拟机，我们将其附加到我们的 Hyper-V 主机服务器。我们为 Nano Server 设置了 `172.16.15.63`\
    \ IP 地址。我们使用 PowerShell 在 Nano Server 2016 上安装 IIS，并修改了执行策略并将其设置为 `RemoteSigned`。我们随后导入了\
    \ `NanoServerImageGenerator` 模块，通过 PowerShell 创建了一个 Nano Server 实例。我们还讨论了如何通过\
    \ PowerShell 命令创建新映像。\n\n## Managing IIS 10.0 on Nano Server\n\n在本教程中，我们将通过 PowerShell\
    \ 远程连接到 Nano Server，并查看默认网站。我们将启动和停止默认网站的网站服务。\n\n### Getting ready\n\n为了逐步完成本教程，我们将通过\
    \ PowerShell 在 Nano Server 2016 上管理 IIS 10.0。Nano Server 上的 IIS 10.0 只能使用 PowerShell\
    \ 进行管理。你需要一个 Nano Server 2016 实例。对于所有这些安装和配置工作，你应该具有管理员权限。\n\n### How to do it...\n\
    \n1. 进入 WIN2016IIS 服务器。要通过 PowerShell 连接 Nano Server 2016，我们首先需要登录到 **WIN2016IIS**\
    \ 服务器（任何 Windows Server 2016 或 Windows 10 机器均可）。我们将使用 PowerShell 远程连接到 IP 地址为\
    \ `172.16.15.63` 的 Nano Server。\n\n2. 在 **WIN2016IIS** 服务器上以管理员权限打开 PowerShell，按下\
    \ *Windows + R*，你将得到 **运行** 窗口，如上一章所示。\n\n3. 输入命令 `RunAs /user:Administrator PowerShell_ISE.exe`\
    \ 并按下 OK 按钮。现在，它会要求你输入 WIN2016IIS 的管理员密码。输入管理员密码并按 Enter。PowerShell 将以管理员权限打开：\n\
    \n   ![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_211_0.png)\n\n4. 你现在在屏幕截图中看到我们有一个脚本编辑器和\
    \ PowerShell 命令提示符。让我们连接到 172.16.15.63 上的 Nano Server。我们首先需要将 Nano Server 实例设置为\
    \ WIN2016IIS 服务器的受信任主机。执行 PowerShell 命令 `Set-Item WSMan:\\localhost\\ClientTrustedHosts\
    \ -Value 172.16.15.63 -Concatenate`，你将得到一个弹出窗口以确认受信任主机，选项有 是、全部是 和 否。我们将单击 是 按钮。通过此操作，你已完成受信任主机的设置。\n\
    \n5. 让我们继续连接 Nano Server 实例。编写 PowerShell 命令 `Enter-PSSession -ComputerName \"\
    172.16.15.63\" -Credential Administrator` 以连接 Nano Server。然后按 **Enter** 运行命令。会出现\
    \ Nano Server 管理员密码的弹出窗口，你需要提供你的 Nano Server 密码并按 **Enter**。你将通过 PowerShell 远程登录：\n\
    \n   ![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_212_0.png)\n\n6. 连接到 Nano Server\
    \ 后，我们需要检查 IIS 中默认列出的网站。首先，我们需要导入 IIS 模块。在 PowerShell 中编写 PowerShell 命令 `Import-Module\
    \ IISAdministration`。这将导入 IISAdministration 模块。\n\n7. 在 PowerShell 中执行命令 `Get-IISSite`，你将列出\
    \ IIS 实例中的所有网站：\n\n   ![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_213_0.png)\n\n\
    8. 你可以在图中看到我们只有一个默认网站，**Default Web Site**，其 **State** 为 **Started**，**Physical\
    \ Path** 为 `%SystemDrive%\\inetpub\\wwwroot`。系统驱动器是默认的操作系统驱动器，绑定为 `http *:80:`，这意味着\
    \ Nano Server 上任何可用的 IP。\n\n9. 你可以使用 PowerShell 命令 `Stop-IISSite -Name \"Default\
    \ Web Site\"` 和 `Start-IISSite -Name \"Default Web Site\"` 分别停止和启动网站。\n\n10. 你可以通过\
    \ PowerShell 在 IIS 中执行更多操作；更多参考信息可使用网址 `https://technet.microsoft.com/itpro/powershell/windows/iisadministration/iisadministration`。\n\
    \n"
