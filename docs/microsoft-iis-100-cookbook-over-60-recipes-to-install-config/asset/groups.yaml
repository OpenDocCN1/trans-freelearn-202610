    Settings...**，你将看到高级设置窗口：


    ![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_109_0.png)


    - 9. **Advanced Settings** 包含四个设置组：**General、Behavior、Failed Request Tracing 和
