    在本节中，我们将通过 PowerShell 和 IISAdministrator 模块访问 Nano Server。你需要一台 Windows Server
    2016 虚拟机或物理机，用于对 Nano Server 2016 进行远程 PowerShell 管理。对于所有这些安装和配置工作，你应具有管理员权限。


