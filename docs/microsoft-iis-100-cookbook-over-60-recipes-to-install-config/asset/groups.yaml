    11. The Test Connection window shows that the website''s application pool authentication
    is the pass-through authentication (defaultAppPool) application pool. The application
    pool authenticates through the default IIS user, IUSR, or the IIS_IUSRS group.
    We did not set any authorization, so it''s showing us **Cannot verify access to
    path**. Click on the **Close** button, and move to **Advanced Settings....**


    12. Click on **Advanced Settings...** in the **Actions** panel, as shown here:


    ![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_137_0.png)


    13. Here, **Advanced Settings...** is used to change the **Physical Path**, **Physical
    Path Credentials**, and **Physical Path Credentials Logon type** of **virtualdirectory.**


