    ## 关于作者


    **Ashraf Khan** 担任网络操作系统部门主管，拥有生产系统、网络管理和解决方案架构的多元背景。他拥有 MCSE-Server、MCSE-Messaging、MCSE-Cloud、CCNA、ITIL
    和 Prince2 认证。他在 IT 基础设施、私营和政府部门等领域拥有超过 13 年的经验，工作地点在印度和阿联酋，并为美国及全球的物理和虚拟服务器环境提供远程支持，负责
    IT 管理、实施、规划、灾难恢复、测试和技术支持。


    我谨向帮助我完成本书的许多人以及所有提供支持、讨论问题、阅读、撰写、提供评论、允许我引用其言论，并在编辑、校对和设计方面提供帮助的人表示感谢。


    我要感谢我的编辑 Heramb Bhavsar 和 Sharon Raj 以及审阅者 Anwarul Haque，使我能够出版这本书。最重要的是，我要感谢我的妻子
    Shama 和我的家人，他们在所有让我远离他们的时刻都给予了我支持和鼓励。对他们来说，这是一段漫长而艰难的旅程。


    我要感谢 Sharon Raj 在选题和编辑过程中的帮助。感谢 Packt 对我的鼓励。


    最后但并非最不重要，我请求原谅所有多年来与我在一起却未被我提及姓名的人。


    ## 关于审阅者


    **Anwarul Haque** 自 2004 年起专业从事应用程序开发。Haque 在企业和消费领域担任顾问超过 12 年。他自 2007 年起获得 Microsoft
    SharePoint 2007 Application Development 认证，自 2014 年起获得 Microsoft Dynamics NAV
    2013 C/Side Development 认证，自 2014 年起获得 Microsoft Certified Professional Developer
    认证。他还曾在 SharePoint 2010 和 2013 本地版、在线 SharePoint Office 365 以及 IIS 服务器管理方面工作，具备管理级别的主机管理技能。他在各种平台和技术应用上管理过
    Web 服务器，这些服务器托管在 Windows IIS Server、Azure Server 和 Unix Server 上。除了 IIS Server
    外，他还管理并托管了 Apache Tomcat Server 上的网站。


    在开发领域，他曾使用各种 IDE、工具和技术工作，例如用于 SharePoint 开发的 Microsoft Office Designer 应用程序、Microsoft
    CRM Portal、ASP.Net、VB.Net、ADO.Net、WCF、SSRS、ASP 3.0、Entity Framework、SQL Server
    2005、2008、2012、2015、Oracle、Visual Basic 6.0 & VBA 宏、VB Script、JavaScript、Ajax、jQuery、动态
    Excel 报表和图表，以及 Microsoft Office 产品的附加组件开发。他还使用过 Microsoft Visual SourceSafe、SVN
    和 IBM Rational ClearCase 等版本控制工具。


    作为一名专业人士，他曾在 Matrix InfoSoft、MetaOption LLC 等中小型企业工作，目前在总部位于新德里的 GCE Solutions
    担任软件分析师。


    您可以在 LinkedIn 上关注他：https://www.linkedin.com/in/anwarul-haque-b4824b21/。


    *我谨向我可爱的妻子 Zeenat Haque 感谢她的耐心、支持和理解！*


