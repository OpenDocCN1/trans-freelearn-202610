    \ host's web page, **iisstart.htm**. The Default Document has to be defined in\
    \ the default document settings for our website's default page name, with an extension.\n\
    \n- 7. Let's move to the Default Document settings of wildcard host ssl.v2mysite.com.\
    \ We find that default.aspx is already there and at the top of the list:\n\n \
    \ ![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_193_0.png)\n\n### Getting Your Wildcard\
    \ Host Up and Running\n\n- 8. Close IIS Manager, open Internet Explorer, and type\
