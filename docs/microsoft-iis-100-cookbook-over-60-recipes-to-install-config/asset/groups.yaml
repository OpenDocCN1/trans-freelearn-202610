    ## 10


    ## Installing and Configuring SSL Websites


    In this chapter, we will cover the following recipes:


    - Understanding SSL websites in IIS 10.0

    - Installing SSL

    - Creating an SSL certificate

    - Configuring websites with an SSL port and certificate

    - Using PowerShell commands to create SSL certificates

    - Testing SSL websites


    ## Introduction


    We can build a secure infrastructure based on public-key cryptography using digital
    certificates with technologies such as Secure Sockets Layer (SSL).


    We need two things to publish a secure website or web application:


    - 1. HTTPS (secure) port 443

    - 2. SSL certificate


    HTTPS is a secure communications channel that is used to exchange information
    between a client computer and a server. It uses SSL.


    To enable SSL in IIS, you must first create a certificate that is used to encrypt
    and decrypt the information that is transferred over the network. IIS includes
    its own certificate request tool that you can use to send a certificate request
    to a certification authority. This tool simplifies the process of obtaining a
    certificate.


    ## Understanding SSL websites in IIS 10.0


    In this recipe, we will open some HTTPS websites and check their SSL certificates.


    ### Getting ready


    To step through this recipe, you will need a computer and an internet connection.


    ### How to do it...


    - 1. Open Internet Explorer on Windows Server 2016 or Windows 10; here, we are
    using Windows Server 2016.

    - 2. Go to the address bar and type `https://www.microsoft.com/en-gulf/`, as shown
    here:


    ![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_289_0.png)


    3. At the end of the address bar, there is a padlock symbol that tells us that
    the website https://www.microsoft.com/en-gulf/ is a secure website. Let''s click
    on it and see the details:


    ![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_290_0.png)


    4. You can see that VeriSign has identified this site as www.microsoft.com. Click
    on View certificate, and you will get the certificate''s properties:


    ![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_290_1.png)


    ## How it works...


    In this recipe, we checked www.microsoft.com and saw it uses **Hyper Text Transfer
    Protocol Secure (HTTPS)**. We also checked the SSL certificate of the website.
    Finally, we opened the certificate properties and saw the details of the website
    and certificate provider.


    ## Installing SSL


    In this recipe, we are going to open IIS Manager on the WIN2016IIS server and
    create a certificate request. We will also see how we can import a third-party
    SSL certificate.


    ### Getting ready


    To step through this recipe, we are going to create an SSL certificate request
    for a certificate provider. Also, we will see how we can import/install the certificate
    on IIS. You will need a running IIS 10.0 server and an administrator account,
    which will be used to make changes to IIS 10.0.


    ### How to do it...


    - 1. Go to **WIN2016IIS** and log in to IIS 10.0 Server. Open Server Manager and
    go to the **Tools** menu.

    - 2. Open IIS Manager and click on the **WIN2016IIS** IIS server, as shown here:


    ## Installing and Configuring SSL Websites


    ![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_292_0.png)


    4. In the Features view, there is a Server Certificates option. Open the server
    certificate, as shown here:


    ![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_292_1.png)


    5. Go to the **Actions** pane. You can see that there is a **Create Certificate
    Request** option available. Click on **Create Certificate Request**, and the **Request
    Certificate** window will open. You have to fill in the details, as shown here:


    ![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_293_0.png)


    7. Select the **Bit length** of encryption you need. In my case, I have selected
    **1024**. Click on **Next**. Now you have to provide the local path and filename
    where you want to store the certificate request file:


    ![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_295_0.png)


    8. We are storing our certificate request file in the `administrator.CALL\Documents\Certificate
    request` folder and the filename is `cert-request-mysite.txt`. Click on **Finish.**


    10. You can see we have the certificate request created in encrypted format. Now
    you can send the file to a certificate authority to buy an SSL certificate.


    11. Now let''s see how to import the certificate that we have purchased or generated.


    12. Open IIS Manager and click on the WIN2016IIS IIS server. Go to the Actions
