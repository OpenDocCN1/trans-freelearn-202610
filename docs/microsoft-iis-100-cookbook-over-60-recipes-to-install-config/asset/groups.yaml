    \nNano Server takes up very less disk space, is installed quickly, needs fewer\
    \ updates and less time to restart than Windows Server.\n\n![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_198_0.png)\n\
    \n- 3. Under Hyper-V Manager, we have four virtual machines: DC, which is the\
    \ domain controller; Nano Server 2016; Server 2016, which is our IIS Server; and\
