    # About the Reviewer


    **Anwarul Haque** has been creating applications professionally since 2004. Haque
    has worked as a consultant for over 12 years in the enterprise and consumer domains.
    He is a Microsoft SharePoint 2007 Application Development certified since 2007,
    Microsoft Dynamics NAV 2013 C/Side Development certified since 2014, and Microsoft
    Certified Professional Developer since 2014. He also worked on SharePoint 2010
    and 2013 offline premises, online SharePoint Office 365, and IIS Server management
    with hosting management skills at the administration level. He managed web servers
    at various platforms and technology applications hosted on Windows IIS Server,
    Azure Server, and Unix Server. Apart from IIS Server, he also managed and hosted
    websites on Apache Tomcat Server.


    In the development area, he has worked on various IDEs, tools, and technologies,
    such as Microsoft Office Designer applications for SharePoint development, Microsoft
    CRM Portal, ASP.Net, VB.Net, ADO.Net, WCF, SSRS, ASP 3.0, Entity Framework, SQL
    Server 2005, 2008, 2012, 2015, Oracle, Visual Basic 6.0 & VBA macro, VB Script,
    JavaScript, Ajax, jQuery, dynamic Excel reports and charts, and add-on developers
    for Microsoft Office products. He has also used subversion control tools such
    as Microsoft Visual SourceSafe, SVN, and the IBM Rational ClearCase tool.


    As a professional, he has worked with small and large enterprises in Matrix InfoSoft,
    MetaOption LLC, and currently works as a software analyst in GCE Solutions, which
    is based in New Delhi.


    You can follow him on LinkedIn at https://www.linkedin.com/in/anwarul-haque-b4824b21/.


    *I would like to thank my lovely wife, Zeenat Haque, for her patience, support,
    and understanding!*'
