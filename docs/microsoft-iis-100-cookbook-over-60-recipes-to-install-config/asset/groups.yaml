  md: "\n## Uploading .NET web pages to a wildcard host\n\nIn this recipe, we are\
    \ going to upload website application pages for the ssl.v2mysite.com wildcard\
    \ host site. The website application pages have been developed in .NET framework\
    \ version 4.0.\n\nWe are going to upload simple HTML website pages as well to\
    \ the demo.v2mysite.com wildcard host for demonstration.\n\n### Getting ready\n\
    \nTo step through this recipe, you will need a running IIS 10.0 instance. You\
    \ should have already created and configured the ssl.v2mysite.com and demo.v2mysite.com\
    \ wildcard hosts. You should also have administrative privileges.\n\n### How to\
    \ do it...\n\n- 1. Log in to **Windows Server** 2016, and go to **Server Manager**.\n\
    - 2. Open Server Manager on Windows Server 2016. Click on the **Tools** menu and\
    \ open IIS Manager.\n- 3. Expand the IIS Server (**WIN2016IIS**). We get the listed\
    \ **Application Pools** and **Sites**. You will get three websites listed in the\
    \ sites folder--**mysite.com**, **v2mysite.com**, and **v4mysite.com**--and two\
    \ wildcard hosts, **ssl.v2mysite.com** and **demo.v2mysite.com**. Now, we are\
    \ going to upload the webpages for the **ssl.v2mysite.com** and **demo.v2mysite.com**\
    \ wildcard host sites.\n- 4. Click on the wildcard host **ssl.v2mysite.com**,\
    \ go to the right-hand side of the IIS Manager console, and you will get the **Actions**\
    \ panel. In the **Actions** panel, there is an option called **Explore**:\n\n\
    \  ![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_188_0.png)\n\n- 5. Click on the **Explore**\
    \ option; it will open the content directory of the selected wildcard, **ssl.v2mysite.com**,\
    \ or you can mention the physical folder path of the wildcard host folder, as\
    \ shown here:\n\n  ![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_188_1.png)\n\n- 10.\
    \ Now close the folder. We are using two types of wildcard hosts. The ssl.v2mysite.com\
    \ host is an application wildcard host, and the second is demo.v2mysite.com, which\
    \ is a simple website-type wildcard host.\n\n### How it works...\n\nIn this recipe,\
    \ we uploaded website application pages written in ASP.NET to the wildcard host\
    \ ssl.v2mysite.com. We checked the properties of the default.aspx application\
    \ page.\n\nWe also uploaded simple HTML website pages to the wildcard host demo.v2mysite.com.\n\
    \n## Testing uploaded website pages\n\nIn this recipe, before starting to test\
    \ these sites, it's important to verify the Default Document settings of the wildcard\
    \ hosts ssl.v2mysite.com and demo.v2mysite.com. We are going to test web application\
    \ pages developed in framework version 4 and upload them to wildcard host ssl.v2mysite.com.\
    \ We will also test our HTML web page with wildcard host demo.v2mysite.com, which\
    \ has already been uploaded.\n\n### Getting ready\n\nTo step through this recipe,\
    \ you will need a running IIS 10.0 instance. You should have already created,\
    \ configured, and uploaded web pages for wildcard hosts ssl.v2mysite.com and demo.v2mysite.com.\
    \ You must have administrative privileges.\n\n### How to do it...\n\n- 1. Log\
    \ in to Windows Server 2016, and go to **Server Manager**.\n- 2. Click on the\
    \ **Tools** menu and open IIS Manager.\n- 3. Expand the IIS Server (**WIN2016IIS**).\
    \ You will get the listed **Application Pools** and **Sites**. You will get three\
    \ websites listed in the Sites folder--**mysite.com**, **v2mysite.com**, and **v4mysite.com**--and\
    \ two wildcard hosts, **ssl.v2mysite.com** and **demo.v2mysite.com**, which we\
    \ have already created.\n- 4. Click on the wildcard host **demo.v2mysite.com**,\
    \ go to the right-hand side of the IIS Manager console. You will see the **Features\
    \ View**. Inside the **Features View**, we have the **Default Document** settings:\n\
    \n  ![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_191_0.png)\n\n- 5. Open the **Default\
    \ Document** settings, and check whether **iisstart.htm** is available:\n\n  ![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_192_0.png)\n\
    \n- 6. We'll next cross-check the **Default Document** settings and verify whether\
