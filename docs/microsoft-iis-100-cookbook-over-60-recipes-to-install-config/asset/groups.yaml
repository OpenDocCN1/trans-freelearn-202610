    的 Nano Server。


    15. 现在按 Windows + R 键，会出现“运行”窗口。以管理员权限打开 PowerShell ISE，输入命令 RunAs /user:Administrator
    PowerShell_ISE.exe，然后按 OK。此时它会要求你输入 Windows Server 2016 实例的管理员密码。输入管理员密码并按 Enter。现在你应该会看到
    PowerShell 窗口，如下所示：


    ![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_237_0.png)


    16. 我们在第 7 章“在 Nano Server 上部署 IIS 10.0”中已经执行过此步骤。这里我们只需简单回顾。你可以看到 PowerShell
    ISE 中有几个简单易用的选项。使用脚本编辑器，我们可以编写脚本，它还会显示高级自动化编写选项。你可以保存并多次使用它。我们有“命令”窗口，显示 PowerShell
    中可用的命令以及可用的 PowerShell 模块功能。你可以打开 Windows Server 中提供的简单 PowerShell 提示符；如果需要 PowerShell
    ISE 的管理员权限，则需要管理员用户名和密码才能访问 PowerShell ISE。一旦你远程访问 Nano Server，请将 Nano Server
    设为受信任的主机，然后使用正确的用户名和密码连接到它。


    ## 工作原理...


    在本节中，我们在 WIN2016IIS 服务器上打开了服务器管理器，并将 Nano Server 主机添加到“所有服务器”列表中。然后，我们使用服务器管理器对
    Nano Server 进行身份验证，并为 Nano Server 打开了 PowerShell 远程管理以管理 IIS 服务器。我们通过服务器管理器登录到
    PowerShell，导入了 IISAdministration 模块，并运行了 Get-Site 命令。此外，我们还查看了 PowerShell ISE
    远程脚本。


    ## 在 Nano Server 上创建高级 IIS 10.0 网站


    在本节中，我们将创建一个带有网站标头（网站名称）的网站，并同时添加应用程序池。我们将创建一个单独的应用程序池，并将该应用程序池添加到我们的网站。我们将在 IIS
    服务器中查看所有可用的应用程序池列表。


    ## 准备工作


    我们将通过 PowerShell 远程连接 Nano Server，并通过 IISAdministrator 模块管理 IIS。你需要一台 Windows
    Server 2016 虚拟机或物理服务器，用于对 Nano Server 2016 进行远程 PowerShell 管理。对于所有这些安装和配置工作，你应具有管理员权限。


    ## 操作步骤...


    - 1. 登录 Windows Server 2016。Windows Server 2016 的 IP 地址为 172.16.15.60，服务器名称为 **WIN2016IIS**。

    - 2. 按键盘上的 Windows + R 键。会出现 **运行** 窗口。以管理员权限打开 PowerShell ISE，在 **运行** 窗口中键入
    `RunAs /user:Administrator PowerShell_ISE.exe`，然后按 **确定**。

    - 3. 此时它会要求你输入 Windows Server 2016 实例的管理员密码（不是 Nano Server）。输入管理员密码并按 *Enter*。PowerShell
    窗口将会打开。

    - 4. 现在我们需要远程连接到 IP 为 172.16.15.63 的 Nano Server 2016。

    - 5. 我们将在 PowerShell 中使用以下命令：


    ```

    Enter-PSSession -ComputerName "172.16.15.63" -Credential \Administrator

    ```


    你可以使用计算机名称或 IP 地址作为 `-ComputerName` 的值。在此命令中，我们使用 IP 地址。


    - 6. 此时会出现一个弹出窗口，要求输入 Nano Server 管理员用户名和密码。我们将输入 Nano Server 管理员密码，然后按 **确定**
    登录。连接成功后，运行 `Import-module iisAdministration` 命令。按 **Enter** 后，PowerShell 模块将导入。

    - 7. 让我们使用高级脚本创建网站。我们将使用以下命令：


    ```

    $manager = Get-IISServerManager

    $site = $manager.Sites.Add("v5mysite", "http", "*:8082:v5mysite.com", "C:\v5mysite")
    $site.Id = 4

    $site.Bindings.Add("*:8083:", "http")$manager.CommitChanges()

    ```


    10. 现在让我们检查已创建的网站 v5mysite。在 PowerShell 中运行命令 `Get-IISSite`：


    ![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_241_0.png)


    11. 在图中你会看到，你有一个名为 **v5mysite** 的网站，ID 为 4，状态为 `Started`，物理路径为 `c:\v5mysite`，并且有两条绑定信息，一条带有标头，另一条没有。


    12. 让我们在 Nano Server 上的 IIS 10.0 中创建应用程序池。在 PowerShell 中运行以下命令：


    ```

    $manager = Get-IISServerManager

    $pool = $manager.ApplicationPools.Add("NanoAPP")

    $pool.ManagedPipelineMode = "Integrated"

    $pool.ManagedRuntimeVersion = "v4.0"

    $pool.Enable32BitAppOnWin64 = $false

    $pool.AutoStart = $true

    $pool.StartMode = "OnDemand"

    $pool.ProcessModel.IdentityType = "ApplicationPoolIdentity"

    $manager.CommitChanges()

    ```


