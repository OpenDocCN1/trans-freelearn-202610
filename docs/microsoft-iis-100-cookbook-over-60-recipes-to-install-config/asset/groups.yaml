  md: '

    # Hardware requirements


    Let''s look at the minimum hardware requirements to run Windows Server 2016 and
    Windows 10:


    ## Windows Server 2016


    - Processor: 1.4 GHz 64 bit

    - RAM: 2 GB for 64-bit OSes

    - Hard disk space: 32 GB


    ## Windows 10


    - Processor/SoC: 1 GHz

    - RAM: 1 GB for 32-bit or 2 GB for 64-bit OSes

    - Hard disk space: 16 GB for 32-bit or 20 GB for 64-bit OSes

    - Graphics card: DirectX 9 with the WDDM 1.0 driver


    ## Operating system media


    IIS 10.0 installation requires operating system media. While installing IIS 10.0
    on Windows Server 2016, sometimes, it asks for the operating system media for
    required files. We have to insert the media either in CD or USB drive form.


    To install IIS 10.0 Express only, we need the IIS 10.0 Express software, which
    is available on the Microsoft IIS website (https://www.microsoft.com/en-us/download/details.aspx?id=48264).
    You only need the software and an Internet connection.


    ## IIS 10.0 architecture


    We need to understand what resources are available to your IIS application; how
    it handles content files of different types, such as static files, ASP files,
    or ISAPI files; and how it groups content files into applications. An introduction
    to the client/server relationship is included for first-time readers unfamiliar
    with web servers.


    IIS 7 and later provide a request-processing architecture. We get the following
    additional benefits of request processing, since the default configuration monitors
    each request and validates implemented security rules:


    - The Windows Process Activation Service (WAS), which enables sites to use protocols
    other than HTTP and HTTPS

    - A web server engine that can be customized by adding or removing modules

    - Integrated request-processing pipelines from IIS and ASP.NET


    ## Getting ready


    We require an up-and-running IIS 10.0 instance. Security components should be
    installed. You should have administrative privileges.


    ## How to do it...


    Now, we are going to review the components and modules.


    1. Start Server Manager on Windows Server 2016, which already should have IIS
    10.0 installed on it.

    2. Go to the Tools menu at the top.

    3. You will be able to see Internet Information Service Manager (IIS).

    4. Click on **IIS Server**, which is to the left-hand side of the **IIS Manager**
    window, as shown here:


    ![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_28_0.png)


    5. In the **Server Manager** panel, you will see the list of default components
    installed. You can configure them as per your requirements. For example, you can
    configure security and management options.


    6. Let''s understand where the modules are. In the previous figure, you will see
    the icon called **Modules**, which will open the default configuration at this
    stage.


    ![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_31_0.png)


    ![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_35_0.png)


    4. On the **Before you begin** wizard, simply click on the **Next** button. This
    window is just for information about installation prerequisites.

    5. On the **Select installation type** wizard, leave the default option **Role-based
    or feature-based installation** selected and click on **Next**.


    6. Now we have to select which server we have to install IIS 10.0 on. We are installing
    to our local machine, so leave Select a server from the server pool with the current
    machine selected and click on Next. Alternatively, you can select another server
    that you are managing from here. You can figure it out in the following diagram:


    ![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_36_0.png)


    7. Now we have to select the role from the Select server roles wizard. Check the
    box next to Web Server (IIS). Doing this may open up a new pop-up window advising
    that additional features are required; simply click on the Add Features button
    to install them as well. Click on Next on the Select server roles menu once this
    is complete.


    ![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_37_0.png)


    8. Once we have selected **Web Server (IIS)**, we will get a list of additional
    features, which we can select from. At this stage, we are not going to select
    any features, so simply click on **Next** in the **Select features** wizard.


    9. Click **Next** on the **Web Server Role (IIS)** wizard after reading the information
    provided.


    11. Now we are on the Confirm installation selections wizard, so review the items
    that are to be installed and click on Install to proceed with installing the IIS
    10.0 web server on Windows Server 2016.


    12. Here, you can see the restart checkbox. No need to mark it for a normal IIS
    10.0 installation--only when you uninstall something from the server or install
    an additional component that requires restarting the server do you need to reboot
    the system.


    Look at this screenshot, which shows IIS 10.0 running on Server 2016.


    ![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_41_0.png)


    ## IIS Manager


    Now that we know how to install IIS 10.0, let''s take a look at IIS Manager, which
    comes as a part of the IIS 10.0 Management tools provided by Microsoft. IIS 10.0
    can be managed in either GUI mode or with PowerShell commands. The IIS Manager
    GUI interface comes with Windows Server 2016 by default.


    We will also learn how we can connect a remote IIS server with IIS Manager.


    ## Getting ready


    To step through this recipe, you will need a running IIS 10.0 instance on Windows
    Server 2016. For remote IIS management, you need to Install IIS management tools.


    ## How to do it...


    1. Start Server Manager on Windows Server 2016, which already has IIS 10.0 Installed
    on it.

    2. Click on the Tools menu.

    3. At the top, you will be able to see Internet Information Service Manager (IIS).
    This figure will show you how to get there:


    ![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_42_0.png)


    4. You will now see the IIS Manager home screen.


    ![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_43_0.png)


    5. IIS Manager shows you its connected servers, which have IIS 10.0 already installed
    on it.

    6. Then, we select WIN2016IIS (WIN2016IIS\Administrator), which is at the left-hand
    side.

    7. The IIS Manager home screen will display the default features of IIS 10.0.


    8. As you can see in the following figure, there is an Application pool on the
    left-hand side along with your Default Web Site. Then, there are feature configuration
    options available in the middle section and then Manage Server, Restart, Start,
    and Stop at the right. You can browse the website from here.


    ![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_44_0.png)


    ## How to manage remote IIS?


    1. You have more than one IIS Server instance available to manage even only website
    or web application want to manage from IIS Manager.

    2. We are going to connect a remote IIS Server instance with IIS Manager on Windows
    Server 2016. This you can do with any operating system that supports IIS 10.0.


    8. Right-click on the Start Page icon or click on the globe below Connections.
    You will see the option to connect to an IIS Server, a website, or application.


    ![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_47_0.png)


    9. We will work on the server connection option first. Click on Connect to Server,
    which is listed in the previous screenshot. On the next screen, it will ask you
    whether you want to select a remote server IP or Computer Name.


    10. Enter the server IP address, which is `172.16.15.212`. You will see the next
    screen. Click on the **Next** button to finish the current step.


    ![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_48_0.png)


    11. Now you have to enter your username and password, after which a server certificate
    confirmation alert pop-up message comes up on a successfully authenticated username
    and password. Click on the **Connect** button.


    ![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_48_1.png)

    '
  mdcn: '


    # 硬件要求


    我们来看看运行 Windows Server 2016 和 Windows 10 的最低硬件要求：


    ## Windows Server 2016


    - 处理器：1.4 GHz 64 位

    - 内存：64 位操作系统至少 2 GB

    - 硬盘空间：32 GB


    ## Windows 10


    - 处理器/SoC：1 GHz

    - 内存：32 位操作系统至少 1 GB，64 位操作系统至少 2 GB

    - 硬盘空间：32 位操作系统至少 16 GB，64 位操作系统至少 20 GB

    - 显卡：支持 WDDM 1.0 驱动程序的 DirectX 9


    ## 操作系统介质


    安装 IIS 10.0 需要操作系统介质。在 Windows Server 2016 上安装 IIS 10.0 时，有时它会要求提供操作系统介质以获取所需文件。我们必须以
    CD 或 USB 驱动器形式插入介质。


    如果只需安装 IIS 10.0 Express，则需要 IIS 10.0 Express 软件，该软件可在 Microsoft IIS 网站（https://www.microsoft.com/en-us/download/details.aspx?id=48264）上获取。你只需要该软件和互联网连接。


    ## IIS 10.0 架构


    我们需要了解 IIS 应用程序可以使用哪些资源；它如何处理不同类型的内容文件（如静态文件、ASP 文件或 ISAPI 文件）；以及它如何将内容文件分组到应用程序中。对于不熟悉
    Web 服务器的初次读者，这里还介绍了客户端/服务器关系的入门知识。


    IIS 7 及更高版本提供了请求处理架构。由于默认配置会监视每个请求并验证已实施的安全规则，因此我们获得了以下请求处理方面的额外好处：


    - Windows 进程激活服务（WAS），使站点能够使用 HTTP 和 HTTPS 以外的协议

    - 可通过添加或删除模块进行自定义的 Web 服务器引擎

    - IIS 和 ASP.NET 的集成请求处理管道


    ## 准备就绪


    我们需要一个正在运行的 IIS 10.0 实例。应安装安全组件。你应具有管理权限。


    ## 操作步骤


    现在，我们将回顾组件和模块。


    1. 在 Windows Server 2016 上启动服务器管理器，该服务器上应已安装 IIS 10.0。

    2. 转到顶部的“工具”菜单。

    3. 你将能够看到 Internet 信息服务管理器（IIS）。

    4. 单击“IIS 服务器”，它位于“IIS 管理器”窗口的左侧，如下所示：


    ![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_28_0.png)


    5. 在“服务器管理器”面板中，你将看到已安装的默认组件列表。你可以根据需要配置它们。例如，你可以配置安全和管理选项。


    6. 让我们了解模块在哪里。在上图中，你会看到一个名为“模块”的图标，此时它将打开默认配置。


