    host is an application wildcard host, and the second is demo.v2mysite.com, which
    is a simple website-type wildcard host.


    # How it works...


    In this recipe, we uploaded website application pages written in ASP.NET to the
    wildcard host ssl.v2mysite.com. We checked the properties of the default.aspx
    application page.


    We also uploaded simple HTML website pages to the wildcard host demo.v2mysite.com.


    # Testing uploaded website pages


    In this recipe, before starting to test these sites, it''s important to verify
    the Default Document settings of the wildcard hosts ssl.v2mysite.com and demo.v2mysite.com.
    We are going to test web application pages developed in framework version 4 and
    upload them to wildcard host ssl.v2mysite.com. We will also test our HTML web
    page with wildcard host demo.v2mysite.com, which has already been uploaded.


    # Getting ready


    To step through this recipe, you will need a running IIS 10.0 instance. You should
