    in the `wwwroot` folder. You can customize the **Connect as...** option and test
    your settings to check whether it is working or not in a browser.

    - 7. Now let''s move on to configure the **Advanced Settings...** of the selected
    website.

    - 8. Click on **mysite.com**. In the **Actions** pane, you get the **Advanced
    Settings...** option. Click on **Advanced Settings...**, and you will get the
    advanced settings window:


    ![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_109_0.png)


    - 9. **Advanced Settings** has four groups of settings: **General, Behavior, Failed
    Request Tracing, and Limits.**

    - 10. In **General**, you can change the **Application pool, website ID, website
    Physical Path, Physical Path Credentials Logon Type, and Preload Enabled.**

    - 11. In **Behavior**, you change **Enabled protocols**, which are either **http**
    or **https**.

    - 12. You can configure the settings of **Failed Request Tracing**. **Directory**
    is where you store your tracing information log, tracing service enabled as true
    or false, and maximum number of trace files.

    - 13. You can also set the **Limits** of access to your website on the basis of
    connection timeout, maximum bandwidth per second, maximum concurrent connections,
    and maximum URL segments.


    ### How it works...


    In this recipe, we had an overview of the website mysite.com from steps 1 to 3.
    We went through the Connections pane and expanded the Sites folder to get the
