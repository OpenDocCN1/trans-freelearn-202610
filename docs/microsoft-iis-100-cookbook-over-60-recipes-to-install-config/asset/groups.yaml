    ## 12 Securing Your Websites on IIS 10.0


    In this chapter, we will cover the following recipes:


    - Understanding available security on IIS 10.0

    - Configuring security on IIS 10.0

    - URL authorization and authentication

    - IP address and domain restrictions

    - Testing security on IIS 10.0


    ### Introduction


    Web server security (IIS server), website security, and application security can
    be used to configure an IIS server to protect itself and the website.


    The following are the security options available in IIS server:


    - Machine key

    - Authentication

    - Authorization rule

    - IP address and domain restrictions

    - ISAPI and CGI restrictions

    - Server certificate

    - Request filtering

    - IIS Manager permissions and IIS Manager users

    - NTFS permissions


    We can install and configure security components on an IIS server for our website
    or web application that needs secure hosting.


    In this chapter, we will start with some of the security information of IIS 10.0.
    You can try more security options if you wish to. Here, we will cover a few important
    parts.


    ### Understanding available security on IIS 10.0


    In this recipe, we will install security components available in Windows Server
    2016 and browse the available installed security features in IIS Manager. We will
    also understand NTFS permissions.


    **Getting ready**


    We require an up-and-running IIS 10.0 instance. You should have administrative
    privileges. There are no other prerequisites.


    **How to do it...**


    1. Log in to Windows Server 2016 from an account with administrative privileges.

    2. Click on the Start menu or type Server Manager in the search window. You will
    see the Server Manager window.

    3. Click the **Add roles and features** link, or you can find the same option
    in the **Manage** menu, as shown here:


    ![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_342_0.png)


    5. As seen in the figure, we expand **Web Server** and then we expand **Security**;
    here, we find some of security options already installed (the checked and grayed-out
    boxes). Check the rest of the available security features listed here, click on
    **Next**, skip the Features wizard, click on **Next**, and you will get the confirmation
    window, as shown in the following screenshot:


    ![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_344_0.png)


    6. You can see that we have selected the security features that we are going to
    install. Click on the **Install** button. You can see in the next screenshot that
    they are installed successfully:


    ![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_345_0.png)


    7. Click on **Close**. Now we have to open the IIS Manager. Click on the Start
    menu or type Server Manager in the search window on Windows 2016 Server. You will
    see the Server Manager window. Open the Server Manager. On the Server Manager,
    click on **Tools** menu and select and open the IIS Manager, as shown in the following
    screenshot.


    9. Go to IIS Manager, expand the IIS server, expand the Sites folder, and click
    on any existing site:


    ![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_347_0.png)


    10. Go to the Actions pane, as highlighted in the previous screenshot, and click
    on **Edit Permissions...**. This is the physical directory of the selected website,
    mysite.com. The mysite physical directory property will open, as shown here:


    ![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_348_0.png)


    11. Click on the **Security** tab in the mysite property window. In the Security
    tab, you can add users and modify folder-level permissions. Not everyone can access
    and make changes to the mysite folder; only specific users who have permissions
    can. You can set this up according to how you''ve planned NTFS permissions.


    **How it works...**


    In this recipe, we installed available security components on Windows Server 2016
    and browsed the available installed security features in IIS Manager. We understand
    NTFS permissions on the mysite physical folder of the mysite.com website.


    ### Configuring security on IIS 10.0


    In this recipe, we will configure IIS Manager permissions and IIS Manager users.
    We will also configure the machine key.


    **Getting ready**


    We require an up-and-running IIS 10.0 instance. Security components should be
    installed. You should have administrative privileges.


    **How to do it...**


    1. Log in to Windows Server 2016 with an account with administrative privileges.

    2. Open Server Manager from the Start menu or use the search window to find it.

    3. Go to **Tools | IIS Manager**. Click on IIS server **WIN2016IIS**, go to **Features
    View**, and open **IIS Manager Users**, as shown here:


    ![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_349_0.png)


    4. You can add the new IIS user from **IIS Manager Users** (these are different
    from Windows users). Let''s move to **IIS Manager Permissions**. Expand the IIS
    server **WIN2016IIS**, expand the **Sites** folder, click on **mysite.com**, go
    to **Features View**, and open **IIS Manager Permissions**:


    ![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_350_0.png)


    5. Go to the **Actions** pane, and click on **Allow User...**. IIS Manager permissions
    are used to allow users or user groups on the local computer to manage a website.
    Let''s select **mysite.com**. Once you click on **Allow User** from the **Actions**
    pane, you will get the **Allow User...** window:


    ![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_351_0.png)


    6. Click on the **Select...** option. You will get the **Select User or Group**
    window, as shown in the following screenshot:


    ![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_351_1.png)


    7. Here, we will search for and select Windows Server users. I want to select
    the administrator user, so I type `Administrator` and click on the **OK** button.
    You can see that the administrator user has been selected:


    ![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_352_0.png)


    8. We have selected `WIN2016IIS\Administrator` (`<local server name>\<username>`).
    Click on **OK**. You can see in the IIS Manager Permissions pane that the administrator
    user has permission for mysite.com:


    ![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_352_1.png)


    9. This action specifies that only allowed users can access your website. Let''s
    move to the machine key.

    10. Go to the WIN2016IIS IIS server and click on WIN2016IIS. Go to Features View
    and select Machine Key, as shown here:


