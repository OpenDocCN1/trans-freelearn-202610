    In this recipe, we are going to upload website application pages for the ssl.v2mysite.com
    wildcard host site. The website application pages have been developed in .NET
    framework version 4.0.


    We are going to upload simple HTML website pages as well to the demo.v2mysite.com
    wildcard host for demonstration.


    # Getting ready


    To step through this recipe, you will need a running IIS 10.0. You should have
    already created and configured the ssl.v2mysite.com and demo.v2mysite.com wildcard
    hosts. You should also have administrative privileges.


    # How to do it...


    +   1. Log in to **Windows Server** 2016, and go to **Server Manager**.

    +   2. Open Server Manager on Windows Server 2016. Click on the **Tools** menu
    and open IIS Manager.

    +   3. Expand the IIS Server (**WIN2016IIS**). We get the listed **Application
    Pools** and **Sites**. You will get three websites listed in the sites folder--**mysite.com**,
    **v2mysite.com**, and **v4mysite.com**--and two wildcard hosts, **ssl.v2mysite.com**
    and **demo.v2mysite.com**. Now, we are going to upload the webpages for the **ssl.v2mysite.com**
    and **demo.v2mysite.com** wildcard host sites.

    +   4. Click on the wildcard host **ssl.v2mysite.com**, go to the right-hand side
    of the IIS Manager console, and you will get the **Actions** panel. In the **Actions**
    panel, there is an option called **Explore**:'
  - '[PAGE 188]


    ![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_188_0.png)


    5. Click on the **Explore** option; it will open the content directory of the
    selected wildcard, **ssl.v2mysite.com**, or you can mention the physical folder
    path of the wildcard host folder, as shown here:


