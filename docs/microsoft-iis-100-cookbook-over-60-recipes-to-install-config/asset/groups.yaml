    ### Introduction


    ASP.NET Core 是一个开源的跨平台框架，可在有或没有 ASP.NET 应用程序池的任何操作系统上运行。它帮助我们独立于 macOS、Linux 或
    Windows Server Core 等平台开发和发布基于 Web 的应用程序。ASP.NET Core 也被称为 ASP.NET 5。Nano Server
    2016 针对 ASP.NET Core。


    一旦我们开始开发 ASP.NET Core 应用程序并发布它，它将自动复制所有必需的运行时 DLL 和其他文件到 Web 应用程序发布目录，以便核心 Web
    应用程序独立运行，而无需在 IIS 服务器上要求任何框架。


    ASP.NET 2.0 将无法在 Nano 上运行。


