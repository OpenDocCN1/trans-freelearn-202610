    - 1. 在 Windows Server 2016 中打开 Server Manager。点击 **Tools** 菜单并打开 IIS 管理器。

    - 2. 从 **Connections** 面板展开 IIS 服务器。我们得到列出的 **Application Pools** 和 **Sites**
    文件夹。

    - 3. 在计算机名称下方的左侧面板中展开 **Sites** 菜单并点击 **Default Web Site**。您可以使用此图找到它：


