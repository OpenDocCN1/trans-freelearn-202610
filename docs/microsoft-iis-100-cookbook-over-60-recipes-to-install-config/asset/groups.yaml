    # Getting ready


    To step through this recipe, you will need a running IIS 10.0 instance. You should
    also have administrative privileges.


    # How to do it...


    +   1. Open Server Manager on Windows Server 2016. Click on the Tools menu and
    open IIS Manager.

    +   2. Expand the IIS server (WIN2016IIS). We get the listed Application Pools
    and Sites. You will get three listed websites--mysite.com, v2mysite.com, and v4mysite.com--which
    we''ve already created. Here, we will use only one.

    +   3. Expand mysite.com under the left-hand side Sites panel:


    ![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_132_0.png)


    +   4. We are going to review the virtual directory now. We''ve already created
    a virtual directory named virtualdirectory inside the website mysite.com.'
  - '[PAGE 133]


    +   5. Once we select the `virtualdirectory`, we get the properties of `virtualdirectory`--Edit
    Permissions..., Basic Settings..., and Advanced Settings...--in the right-hand
    panel under Actions. We can also browse the virtual directory.

    +   6. The **virtualdirectory** feature helps us view all the options available
    in **mysite.com**.

    +   7. In the current example, you can see the sub-website''s **virtualdirectory**
    entry, which is under **mysite.com**.


    # How it works...


    In this recipe, we opened Server Manager and IIS Manager. Inside the **Connections**
    pane, we selected the **Sites** folder. We expanded **Sites**. We''d already created
    a virtual directory and named it `virtualdirectoy`. Next, we checked the virtual
    directory and performed a property overview of `virtualdirectory`, where we can
    managed permissions and basic and advanced settings.


    # Configuring virtual directories in IIS 10.0


    In this recipe, we are going to configure the virtual directory step by step.
    We will modify the default document settings of the virtual directory and permissions
    of the physical directory. We''ll also set up the basic and advanced settings
    of the virtual directory.


    # Getting ready


    To step through this recipe, you will need a running IIS 10.0 instance with a
    virtual directory created. You should also have administrative privilege.


    # How to do it...


    +   1. Open the Server Manager on Windows Server 2016. Click on the **Tools**
    menu and open IIS Manager.

    +   2. Expand the IIS server (**WIN2016IIS**). We get the listed **Application
    pools** and **Sites** folders.'
  - '[PAGE 134]


    +   3. Expand the **Sites** folder under the **Connections** panel, click on **mysite.com**,
    and you will see the **Actions** panel in the top right corner, under which you
    will see the **Edit Permissions...** option for VirtualDirectory.

    +   4. Click on **Edit Permissions...**, and you will get the properties of **VirtualDirectory**.
    These are the physical folder properties. Go to the **Security** tab and click
    on **Edit**.

    +   5. Find the **IUSR** user and **IIS_IUSRS** group and add them to the **Security**
    tab. Click on the default permission boxes for **Read & execute**, **List folder
    contents**, and **Read**. These settings are used to access the website through
    a web user or website application; IIS_IUSRS and IUSR are used for the application
    pool''s internal authentication and communication.

    +   6. IIS_IUSRS is the group for IIS worker process accounts. This means the
    identity that the application pool itself runs under. IUSR is the anonymous user
    identity.


    ![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_134_0.png)'
  - '[PAGE 135]


    7. Click on the OK button to finish. Next, you have to click on the **Basic Settings...**
    of the virtual directory, available in the **Actions** pane:


    ![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_135_0.png)


    8. In **Basic Settings...**, you have the option to change the physical path of
    `virtualdirectory`; we can set the **Connect as...** settings as shown in the
    screenshot, but keep them at the default values.


    ![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_135_1.png)'
  - '[PAGE 136]


    9. We can select a specific user to access this directory or any one of the IIS
    internal application pool default IUSR users. We have selected the default option,
    Application user, for the test connection.


    10. Click on the OK button, go to Basic Settings..., and click on the Test Settings
    button, as shown in the screenshot. You will get this option by selecting VirtualDirectory,
    which was created in the previous recipe. Go to the Actions panel on the right-hand
    side, and click on Basic Settings.... A property edit window appears for editing
    the virtual directory. The last option you will find is Test Setting, which will
    open the following window. Under Test Connection, you will have two Test results,
    Authentication and Authorization, which are responsible for validating the application
    pool and the physical path of the virtual directory.


    ![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_136_0.png)'
