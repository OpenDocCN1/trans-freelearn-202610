    - 5. 进入 Server Manager，点击 Tools 菜单，打开 IIS Manager。

    - 6. 在 Connections 窗格中展开你的 IIS 服务器，展开 Sites 文件夹，你会看到列出的三个网站。选择 mysite.com。

