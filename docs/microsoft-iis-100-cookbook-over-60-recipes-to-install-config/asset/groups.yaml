    \n我们还为您提供了一份 PDF 文件，其中包含本书中使用的屏幕截图/图表的彩色图片。彩色图片将帮助您更好地理解输出的变化。您可以从 `https://www.packtpub.com/sites/default/files/downloads/MicrosoftIIS10Dot0Cookbook_ColorImages.pdf`\
    \ 下载此文件。\n\n# 将 IIS 10.0 与 Windows Server 2016 集成\n\n在本章中，我们将涵盖以下食谱：\n\n+   -\
    \ IIS 10.0 架构\n+   - 在 Windows Server 2016 上安装 IIS 10.0\n+   - IIS 管理器\n+   -\
    \ IIS 10.0 的基本配置\n+   - 主机静态页面\n+   - 测试静态页面网站\n\n## 引言\n\nIIS 10.0 是 Internet\
    \ Information Services (IIS) 的最新版本，IIS 是由 Microsoft 开发的可扩展 Web 服务器。IIS 10.0 随\
    \ Windows Server 2016 和 Windows 10 推出。IIS 10.0 的新功能包括 HTTP/2、Nano Server 上的 IIS、通配符主机头和\
    \ PowerShell 5 cmdlet 等。此外，它还支持所有先前支持的功能：HTTP、HTTPS、SMTP、SNMP、FTP 和 FTPS。\n\n\
    本章中的食谱将主要关注 IIS 10.0 与 Windows Server 2016 的集成。\n\n我们将从有关 IIS 10.0 的一些基本信息开始。之后，我们将把\
    \ IIS 10.0 与 Windows Server 2016 集成，并配置和测试我们的第一个示例网页。\n\n# 了解 IIS 10.0\n\n在本食谱中，我们将了解如何使用\
    \ IIS 10.0 的新功能。我们将概述添加到 IIS 10.0 的以下新功能：\n\n+   - **HTTP/2**\n+     HTTP/2 请求现在比以往更快。此功能在\
    \ Windows Server 2016 和 Windows 10 上的 IIS 10.0 中默认处于活动状态。\n+   - **Nano Server\
    \ 上的 IIS 10.0**\n+     IIS 10.0 易于快速安装在 Nano Server 上。您可以使用 PowerShell 或 IIS 管理器控制台远程管理\
    \ IIS 10.0。Nano Server 运行速度更快，消耗的内存和磁盘空间比功能齐全的 Windows Server 少。重新启动也更快，因此您可以更有效地管理时间。\n\
    +   - **通配符主机头**\n+     IIS 10.0 支持您父域名的子域功能。这将真正帮助您使用相同的首要域名管理更多子域名。\n+   - **PowerShell\
    \ 5 cmdlet**\n+     IIS 10.0 添加了一个新的、简化的 PowerShell 模块，用于快速轻松地管理。您可以使用 PowerShell\
    \ 远程访问服务器管理功能。它还支持现有的 `WebAdministration` cmdlet。\n+   - **FTP**\n+     FTP 是一种用于传输文件的简单协议。此系统可以使用默认端口\
    \ 21 在公司局域网和广域网内传输文件。IIS 10.0 包含一个易于配置和管理的 FTP 服务器。\n+   - **FTPS**\n+     FTPS\
    \ 与 FTP 相同，唯一的区别是它是安全的。FTPS 使用 SSL 传输数据。我们将使用 HTTPS 端口 443。为此，我们需要创建并安装 SSL 证书以安全地加密和解密数据。SSL\
    \ 确保在私有或公共网络上传输期间，Web 服务器和浏览器之间传递的所有数据在上传和下载过程中保持私密和一致。\n+   - **多网站托管**\n+  \
    \ \n+     IIS 10.0 允许您在同一服务器上创建多个网站和多个应用程序。您可以轻松管理和创建位于默认位置或自定义位置的新虚拟目录。\n+  \
    \ - **虚拟目录**\n+   \n+     IIS 10.0 使管理和创建所需的虚拟目录变得容易。\n\n# IIS 10.0 的基本要求\n\n\
    在我们以操作或暂存模式运行 Web 服务器之前，我们必须对其进行规划。我们要发布什么类型的网站和应用程序？例如，我们的网站需要一个支持 IIS 10.0 上\
    \ .NET framework 4.5 的服务器。我们需要了解支持的操作系统和硬件要求。\n\n让我们详细了解要求。\n\n# 操作系统要求\n\n以下小节详细说明了\
    \ Windows Server 2016 的估计系统要求。如果您的计算机低于最低要求，您将无法正确安装此产品。实际要求将根据您的系统配置以及您安装的应用程序和功能而有所不同。除非另有说明，否则这些最低系统要求适用于所有安装选项（Windows\
    \ 2016 Server Core、Windows Server 2016、Nano Server 和 Windows 10）以及标准版和数据中心版。IIS\
    \ 10.0 Express 支持 Windows 7 Service Pack 1、Windows 8.1、Windows 8、Windows Server\
    \ 2008 R2、Windows Server 2012、Windows Server 2012 R2、Windows 10 和 Windows Server\
    \ 2016。\n\n![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_25_0.png)\n\n为获得最佳效果，请进行测试部署以确定特定部署方案的适当系统要求。\n\
    \n"
