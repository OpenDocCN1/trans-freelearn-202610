    over the IISAdministrator module. You will need a Windows Server 2016 virtual
    or physical server for remote PowerShell management of Nano Server 2016. For all
    this installation and configuration work, you should have administrative privileges.


    ## How to do it...


    - 1. Log in to Windows Server 2016. The IP address of Windows Server 2016 is 172.16.15.60
    and the name of the server is **WIN2016IIS**.

    - 2. Press Windows + R on your keyboard. You will get the **Run** window. Open
