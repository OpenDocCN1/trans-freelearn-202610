    应用程序池的好处是，如果其中一个应用程序池出现问题，它只会影响相关的应用程序池。


    应用程序池使我们能够隔离 Web 应用程序，以获得更好的安全性、可靠性和可用性。


    有两种类型的应用程序管道。我们可以选择集成模式（支持 IIS 7.5 或更高版本）或经典模式（IIS 6.0）。


    ## Understanding application pools in IIS 10.0


    在本教程中，我们将了解应用程序池。我们可以简单地说，应用程序池是 IIS 10.0 的核心。应用程序池是 Web 应用程序的逻辑分组，它们将在一个公共进程中执行，从而允许对哪些程序在单个进程中聚类进行更大的粒度控制。例如，如果你需要每个
    Web 应用程序都在单独的进程中执行，你只需为每个不同框架版本的应用程序创建一个应用程序池即可。


    假设我们有多个版本的网站，一个支持框架 2.0，另一个支持框架 4.0 或其他不同的应用程序，如 PHP 或 WordPress。所有这些网站进程都通过应用程序池进行管理。


    ### Getting ready


    要逐步完成本教程，你需要一个正在运行的 IIS 10.0 实例。你还应具有管理员权限。


    - 3. 点击 **DefaultAppPool**，然后你将获得 **DefaultAppPool** 的 **Actions** 面板。在这里，你将看到右侧高亮显示的
    **Application Pool Tasks** 选项，你可以 **Start**、**Stop** 和 **Recycle** IIS 10.0 的服务。


