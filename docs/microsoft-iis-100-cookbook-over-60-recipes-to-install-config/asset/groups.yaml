  - '[PAGE 210]


    # How it works...


    In this recipe, we installed IIS 10.0 on Nano Server and created a Nano Server
    2016 virtual machine, which we attached to our Hyper-V host server. We set up
    the `172.16.15.63` IP address for Nano Server. We used PowerShell to install IIS
    on Nano Server 2016 and also modified the execution policy and set it to `RemoteSigned`.
    We then imported the `NanoServerImageGenerator` module to create a Nano Server
    instance through PowerShell. We also discussed how to create a new image through
    PowerShell commands.


    # Managing IIS 10.0 on Nano Server


    In this recipe, we will remotely connect via PowerShell to Nano Server, and we
    will check out the default website. We will start up and stop website services
    of the default website.


    # Getting ready


    To step through this recipe, we are going to manage IIS 10.0 on Nano Server 2016
    through PowerShell. IIS 10.0 on Nano Server can only be managed using PowerShell.
    You will need a Nano Server 2016 instance. For all this installation and configuration
    work, you should have administrative privileges.


    # How to do it...


    +   1. Go to the WIN2016IIS server. To connect Nano Server 2016 through PowerShell,
    we have to first log in to the **WIN2016IIS** server (any Windows Server 2016
    or Windows 10 machine will do). We will use PowerShell to remotely connect to
    Nano Server at `172.16.15.63`.

    +   2. Open PowerShell with administrative rights on the **WIN2016IIS** server,
    press *Windows + R*, and you will get the **Run** window, like in the previous
    chapter.'
  - '[PAGE 211]


    3. Type the command RunAs /user:Administrator PowerShell_ISE.exe and press the
    OK button. Now, it will ask you the administrator password to WIN2016IIS. Type
    the administrator password and press Enter. PowerShell will open with administrative
    rights:


    ![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_211_0.png)


    4. You see now in the screenshot that we have a script editor and PowerShell command
    prompt. Let''s connect to Nano Server at 172.16.15.63. We have to first set up
    a Nano Server instance as the trusted host for the WIN2016IIS server. Execute
    the PowerShell command Set-Item WSMan:\localhost\ClientTrustedHosts -Value 172.16.15.63
    -Concatenate, and you will get a popup to confirm the trusted host with options
    Yes, Yes to all, and No. We will click on the Yes button. With this, you have
    finished the trusted host setup.'
  - '[PAGE 212]


    # Deploying IIS 10.0 on Nano Server


    5. Let’s move to connecting the Nano Server instance. Write the PowerShell command
    `Enter-PSSession -ComputerName "172.16.15.63" -Credential ~Administration` to
    connect Nano Server. Then press **Enter** and run the command. A popup for the
    Nano Server administrator password will come up, and you have to provide your
    Nano server password and press **Enter**. You will get logged in through PowerShell
    remotely:


    ![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_212_0.png)


    6. After getting connected to Nano Server, we have to check the default listed
    website in IIS. First, we have to import the IIS module with the PowerShell command
    `Import-module iisadministration` and then write the command `Import-module iisadministration`
    in PowerShell. This will import the IISAdministration module.'
  - '[PAGE 213]


    # Deploying IIS 10.0 on Nano Server


    +   7. Execute the command `Get-IISSite` in PowerShell, and you will get all the
    websites listed inside your IIS instance:


    ![](img/1e026bc33e65e0f63d5e9b5081b6d8c8_213_0.png)


    +   8. You can see in the figure that we only have one default website, **Default
    Web Site** which has **State** as **Started** and a **Physical Path** of `%SystemDrive%=C:.`
    The system drive is the default operating system drive, `%SystemDrive%\inetpub\wwwroot`,
    and the binding is `http *:80:`, which means any IP available on Nano Server.


    +   9. You can stop and start the website with the PowerShell commands `Stop-IISSite
    -Name "Default Web Site"` and `Start-IISSite -Name "Default Web Site"`, respectively.


    +   10. You can do many more things in IIS through PowerShell; for more reference,
    you can use the URL `https://technet.microsoft.com/itpro/powershell/windows/iisadministration/iisadministration`.'
