    ## 前言


    IIS 10.0 是 Internet Information Services（IIS）的最新版本，IIS 是由 Microsoft 开发的可扩展 Web
    服务器。IIS 10.0 随 Windows Server 2016 和 Windows 10 操作系统一起推出。IIS 10.0 的新功能包括 HTTP/2、Nano
    Server 上的 IIS、通配符主机头和 PowerShell 5 Cmdlets。IIS 10.0 支持所有先前功能：HTTP、HTTPS、SMTP 和
    SNMP、FTP 和 FTPS。


    ## 本书涵盖内容


    第 1 章，集成 IIS 10.0 与 Windows Server 2016，首先介绍有关 IIS 10.0 的一些基本信息。之后，我们将把 IIS 10.0
    与 Windows Server 2016 集成，并配置和测试我们的第一个示例网页。


    第 2 章，在 IIS 10.0 中创建应用程序池，解释应用程序池、不同版本应用程序池的安装、应用程序池的创建和配置。我们将上传和测试 .NET 3.5 和
    .NET 4.0 Web 应用程序。


    第 3 章，在 IIS 10.0 上托管多个网站，首先介绍在同一 IIS 10.0 实例上进行多 Web 托管，我们将通过主机名（域名）访问这些网站。我们将为网站配置专用
    IP 地址。


    第 4 章，在 IIS 10.0 中构建虚拟目录，首先介绍虚拟目录的创建及其在现有网站中的使用。如果您有需要网站中应用程序池的不同 Web 应用程序，您可以创建虚拟目录并添加所需的应用程序池。


    第 5 章，在 IIS 10.0 上安装 HTTP/2，解释 HTTP/2 以及 HTTP/2 的安装、配置和测试。


    第 6 章，让您的通配符主机运行起来，展示如何创建以主域名为前缀的子域名 demo，例如 demo.v2mysite.com。我们可以为父域创建不同的名称和无限的通配符主机。


    第 7 章，在 Nano Server 上部署 IIS 10.0，首先介绍在 Nano Server 上安装 IIS 10.0。我们将远程连接 Nano Server，在
    PowerShell 中导入 IISAdministration 模块，并在 Nano Server 上创建和管理网站。


    第 8 章，使用 PowerShell Cmdlets 配置 IIS 管理，使用 PowerShell 在 IIS 服务器上执行管理任务。


    第 9 章，在 Nano Server 上的 IIS 中启用 ASP.NET Core，教授如何在 Nano Server 上的 IIS 中启用 ASP.NET
    并创建虚拟目录。


    第 10 章，安装和配置 SSL 网站，首先介绍第三方 SSL 证书的安装；我们将创建本地自签名证书并对其进行测试。


    第 11 章，将 IIS 10.0 扩展到 FTP，展示如何在 Windows Server 2016 上安装 FTP 服务器角色。我们创建和配置 FTP
    站点。


    第 12 章，在 IIS 10.0 上保护您的网站，解释 IIS 10.0 安全性和可用的安全配置，例如 IP、域和 URL。


    第 13 章，管理和故障排除 IIS 10.0，解释 IIS 10.0 运行状况和性能的配置和管理。


    ## 阅读本书所需条件


    为了使用 IIS 10.0，应具备以下硬件和软件：


    - **所需软件（及版本）**：IIS 10.0、FileZilla FTP 客户端软件、Visual Studio 2015 或更高版本、HTML 文件、PowerShell
    5 cmdlets

    - **硬件规格**：4 GB RAM、300 GB HDD、2 个 v处理器。

    - **所需操作系统**：Windows Server 2016、Nano Server 2016 和 Windows 10


    ## 本书适合人群


    本书适合那些一直担任 IIS 管理员、系统管理员、网站管理员和 Web 开发人员的人，例如网站构建者、后端开发人员和前端开发人员，以及那些渴望了解开始使用
    IIS 10.0 后会遇到什么的人。


    ## 章节


    在本書中，您会经常看到几个标题（准备工作、如何操作...、其工作原理...、更多内容...、另请参阅）。


    为了清晰地说明如何完成一个配方，我们按如下方式使用这些章节：


