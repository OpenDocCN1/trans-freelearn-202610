- 'no': 3145
  overturn_probability: 0.05
  alternative: 若不分章，这行最可能是正文中的二级标题（教程子标题），因为在步骤化文本中“13.”也可能被解读为某个大节内的序号标题。
  counter_evidence:
  - 该行以“## 13.”开头，但前一行是孤立的“## ”（空标题），可能是文档转换时产生的排版残留，不能完全排除这是上一个章节的尾部噪声，导致该行看似新章起点。
  - 虽然“13.”符合编号特征，但文中大量使用“###”、“####”作为各级子标题，若仅凭“##”和编号判断，也存在将“13.”误当成章标题的可能。
  keep_split: true
- 'no': 3368
  overturn_probability: 0.05
  alternative: 若不分章，这行最可能是文末索引部分的起始标记，而不是与正文章节并列的独立章标题。
  counter_evidence:
  - 索引通常不是真正的“章”，而是附属的检索工具；虽然规则要求文末索引单独划分为一章，但若严格按“最高层级大章”的语义理解，它可能只是索引的标题标记。
  - 索引内部还有“## S”、“## T”、“## V”等字母分组标题，这些也使用“##”级别，如果“## 索引”被视作章标题，则可能引发对后续字母标题的误判，说明该处层级并不完全统一。
  keep_split: true
