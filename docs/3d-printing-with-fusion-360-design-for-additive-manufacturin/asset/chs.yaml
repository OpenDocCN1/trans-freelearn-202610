  360 进行增材制造。我们在第 1 章中已经涉及了一些基本首选项，例如如何设置默认单位以及捕获设计历史与使用直接建模进行设计的能力。在本章中，我们将更深入地探讨所有设置和首选项，以及一些可用于改进增材制造工作流程的预览功能。


  我们可以通过在用户界面右上角选择头像图标来访问首选项对话框，如图 7.1 所示，从而开始简化我们对 Fusion 360 进行增材制造的使用。首选项对话框左侧有一个浏览器。通过选择第一个条目，名为
  General，我们可以访问控制通用用户界面行为的首选项。图 7.1 显示了如何将默认建模方向设置为 Z 向上，这我们在第 1 章中已详细讲解过：


