  7.13* 所示，我们可以通过进入 **资源** 文件夹然后导航到名为 **CAMMachines** 的文件夹来定位 *.mch 文件。在此位置，我们将能够找到
  Prusa i3 MK3S+.mch 文件：


  ![](img/baa027bed101c08b496f1f420cee8a5b_221_1.png)


  图 7.13 – 在资源文件夹中定位云端机器库


  如果您可以使用 Fusion 360 的 Home 选项卡体验，除了在数据面板中定位资源文件夹外，您还可以在 Home 选项卡中看到它，如图 7.14 所示。在左上角选择
  Home 图标后，您将能够看到当前团队可以访问的项目。资源文件夹将在项目中可用，并且 CAMMachines 文件夹将存储您在云端库中保存的机器：


  ![](img/baa027bed101c08b496f1f420cee8a5b_222_0.png)


  图 7.14 – 在 Home 选项卡中定位云端机器库


  本地库和链接库与云端库之间的主要区别与协作有关。您保存到云端库的库项，例如机器、打印设置、工具和后处理程序，都可以供当前团队中的每个项目成员访问。这意味着如果您的团队中有五名用户，他们都将对您保存到云端库的所有资源具有读写权限。图
  7.14 还显示了所有可能资源的全列表，从各种库到模板和材料。


  在本节中，我们介绍了在增材设置期间选择机器以及管理机器库。在下一节中，我们将讨论如何对打印设置执行相同的操作，并查看与不同增材技术相关的不同打印设置。


  ## 打印设置和创建增材设置


  我们可以利用 **打印设置** 库来查找并下载 Autodesk 为所有类型的 3D 打印机提供的最新打印设置，就像我们在上一节中使用基于网络的 **机器库**
  一样。Autodesk 在 https://cam.autodesk.com/printsettingslist 托管 Fusion 360 的 **打印设置**
  库。启动网页后，我们可以使用搜索栏查找所需的打印设置，或使用 3D 打印技术和机器供应商的筛选器缩小此网页上提供的庞大打印设置列表。一旦我们找到所需的打印设置，如
  *图 7.15* 所示，我们就可以使用 **下载** 按钮将其简单下载到计算机：


  ![](img/baa027bed101c08b496f1f420cee8a5b_223_0.png)


  图 7.15 – Fusion 360 在网络上的打印设置库


  我们也可以在创建增材设置期间访问 Fusion 360 的整个 **打印设置** 库。在上一节中选择机器后，我们可以在 **设置** 对话框中按下 **打印设置**
  按钮，并从 Fusion 360 打印设置库中的可用选项中进行选择。与我们从 Fusion 360 库复制并粘贴机器到我们的 **链接** 文件夹的方式类似，我们可以从
  Fusion 360 **打印设置** 网页或 Fusion 360 库复制并粘贴打印设置。从网络下载打印设置后，我们可以将其导入到我们的 **本地**、**云端**
  或 **链接** 打印设置库中，并在增材设置期间从首选库中选择该打印设置，如 *图 7.16* 所示：


  ![](img/baa027bed101c08b496f1f420cee8a5b_224_0.png)


  图 7.16 – 从 Fusion 360 的打印设置库中选择打印设置


  一旦我们在 **我的打印设置** 下的文件夹中保存了打印设置，例如图 7.17 中所示的 **链接 | 自定义** 文件夹，我们就可以通过选择它、右键单击它并进行编辑来修改该打印设置。编辑仅在机器或打印设置保存到
  **Fusion 360 库** 的 **我的机器** 或 **我的打印设置** 子部分后才可用：


  ![](img/baa027bed101c08b496f1f420cee8a5b_224_1.png)


  图 7.17 – 编辑位于我的打印设置下的打印设置


  按下自定义打印设置的编辑命令后会显示打印设置编辑器，这将允许我们根据自己的偏好自定义所有信息。图 7.18 显示了 FFF 打印设置的一个典型打印设置。该打印设置恰好是使用
  PLA 材料在单挤出机 FFF 打印机上打印的默认打印设置。打印设置编辑器由两列组成。在左侧，我们可以看到诸如信息、常规和主体预设等标题。在主体预设下，我们默认有两个标题：常规和坚固。常规恰好是主体预设的默认设置，如文本左侧带勾选标记的齿轮图标所示。我们将在第
  8 章中更详细地介绍与主体预设的交互以及为每个组件分配打印设置：


  ![](img/baa027bed101c08b496f1f420cee8a5b_225_0.png)


  图 7.18 – 自定义 FFF 机器的 PLA 打印设置


  在主体预设部分中，在常规主体预设内，有多个子部分，例如挤出、外壳和填充。图 7.19 显示了常规主体预设的填充子部分的输入字段。使用此条目，我们可以将填充图案从默认的
  Gyroid 选项自定义为不同的填充图案。或者，如果需要，我们可以将填充密度从 25% 改为 100%，使其成为完全致密的打印：


  ![](img/baa027bed101c08b496f1f420cee8a5b_226_0.png)


  图 7.19 – 修改 FFF 打印设置的填充输入


  另一个常见的 **主体预设** 设置需要修改的是 **打印床粘附**。图 7.20 显示了 **常规** 主体预设的 **打印床粘附**。正如图中所示，**打印床粘附**
  已启用，并且 **打印床粘附类型** 默认设置为 **裙边**。您可以将 **打印床粘附类型** 改为 **底边** 或 **支撑平台** 并根据在此对话框中选择的粘附类型修改相关输入：


  ![](img/baa027bed101c08b496f1f420cee8a5b_227_0.png)


  图 7.20 – 自定义 FFF 打印设置的打印床粘附输入


  打印设置编辑器还允许我们使用位于对话框左上角的搜索栏按名称搜索给定的输入字段。图 7.21 显示了搜索短语 number of perimeters 的结果。此条目对此打印设置存在两次，如图所示。第一个条目用于常规主体预设，第二个条目用于坚固主体预设。在可用选项列表中选择
  Number of Perimeters (Normal) 后，用户界面会自动切换到常规主体预设的外壳选择，并用下方的一条蓝色线突出显示周长数条目字段。如果我们将鼠标悬停在输入字段上，我们还可以看到此条目的工具提示，其内容为
  Number of perimeter beads around each layer：


  ![](img/baa027bed101c08b496f1f420cee8a5b_228_0.png)


  图 7.21 – 使用搜索栏在打印设置编辑器中查找和添加要修改的输入


  到目前为止，我们主要关注 FFF 的打印设置和机器。然而，Fusion 360 支持为除 FFF 打印机之外的打印机创建增材设置。如果我们在创建增材设置时选择了一台使用
  **光固化 (SLA)** 的 3D 打印机，那么在按下 **打印设置** 按钮后，我们将能够选择适合我们刚刚选择的打印机类型的打印设置。图 7.22 显示了名为
  **Prusa Orange Tough - 0.05mm Normal** 的打印设置的 **打印设置编辑器** 的外观，这是一种可以在 Prusa SL1
  打印机上打印的树脂，而 Prusa SL1 打印机是一种 SLA 3D 打印机。正如您所见，此打印设置的可用选项列表与我们为 FFF 打印机编辑的 PLA 打印设置非常不同。两者之间存在相似之处，例如层厚输入。然而，对于基于树脂的打印机，我们可以编辑其他信息，例如曝光时间，这些信息可以在
  **打印设置编辑器** 中控制：


  ![](img/baa027bed101c08b496f1f420cee8a5b_229_0.png)


  图 7.22 – 用于在 Prusa SL1 打印机上打印的 Prusa Orange Tough 树脂的打印设置编辑器


  并非所有 SLA 打印机的打印设置都相同，它们的外观可能会根据机器制造商的规格和机器所需的切片文件而有所不同。图 7.23 显示了一个通用的 SLA 打印机的良好示例，该打印机使用包含
  SLC（切片）文件的 ZIP 文件。您可以在从机器库中选择通用 SLA 打印机后访问此打印设置。编辑此打印设置时，您可以自定义层厚，并控制是否要为零件和支撑创建唯一文件以及如何命名每个文件：


  ![](img/baa027bed101c08b496f1f420cee8a5b_230_0.png)


  图 7.23 – 通用 SLA 打印机的打印设置编辑器


  尽管 DLP 和 SLA 打印机都使用树脂作为 3D 打印的原材料，但它们使用不同的技术来打印该树脂，这类打印机的打印设置也反映了这种技术差异。在从机器库中选择
  Autodesk 通用 DLP 打印机后，您将能够选择 Autodesk 通用 DLP 作为打印设置。如果您按 *图 7.24* 所示编辑该打印设置，您将看到另一个可以修改的独特打印设置列表。与
  FFF 和 SLA 打印设置类似，您可以控制 DLP 打印设置的层厚。然而，与其他技术不同，DLP 打印机通常使用图像文件来打印每一层。在此打印设置中，您可以在导出过程中自定义图像大小、图像质量以及与每个图像文件
  (* .png) 相关的命名。在对模型进行切片并导出图像文件之前，您需要确保编辑此打印设置的 **大小 X** 和 **大小 Y** 字段，以匹配您特定 DLP
  打印机的可打印成型区域尺寸：


  ![](img/baa027bed101c08b496f1f420cee8a5b_231_0.png)


  图 7.24 – 通用 DLP 打印机的打印设置编辑器


  尽管本章我们不关注使用 MPBF 技术的 3D 打印机，但我也想借此机会展示该技术的打印设置是什么样的。如本章前面所述，除非您拥有增材制造扩展，否则您无法将 MPBF
  3D 打印机作为增材设置的一部分进行选择。但是，如果您想跟随操作并复制图 7.25 中所示的工作流程以更好地了解与 MPBF 相关的打印设置，您只需从 Fusion
  360 的在线库中找到一个 MPBF 打印设置并下载即可。一旦您拥有 MPBF 打印设置的本地副本，您就可以将其导入到您的本地或云库之一，如我们在上一节中所述。您不需要在创建增材设置期间执行此操作。您可以在任何选项卡中制造工作区的
  MANAGE 面板内访问所有与制造相关的库。


  图 7.25 显示了编辑 Autodesk 通用 MPBF 100 微米打印设置时打印设置编辑器的情况。此打印设置与我们迄今为止演示的所有其他打印设置一样，允许我们修改层厚。此外，我们可以在材料下拉菜单中指定金属粉末，这将在下游产生影响，当我们希望将此打印设置用于工艺仿真时，这将在第
  13 章中更详细地介绍。我们还对激光在熔合模型不同部分的粉末时所遵循的路径有额外的控制，例如其上表面、下表面和支撑。Autodesk 通用 MPBF 3D 打印机以及此打印设置允许创建多种切片文件类型，例如
  SLC 和 Gcode。因此，打印设置还包含各种控制这些文件如何创建和命名的选项：


  ![](img/baa027bed101c08b496f1f420cee8a5b_232_0.png)


  图 7.25 – 通用 MPBF 打印机的打印设置编辑器


  现在我们已经介绍了不同增材技术的各种打印设置，让我们通过创建第一个增材设置来将我们所学的一切付诸实践。为了演示这一点，我们将使用我们在第 6 章中创建的名为 Spur
  Gear 的模型。我们特意使用此几何形状，因为它已经定向为具有一个与 X-Y 平面接触的平面。





  打开 Fusion 360 中的设计后，我们可以使用工作区切换器切换到 Manufacture 工作区。在 ADDITIVE 选项卡中，我们可以点击 SETUP
  面板中的 New Setup。在 SETUP 对话框的 Setup 选项卡中，点击 Machine 输入旁边的 Select... 命令，并从 Fusion 360
  库中选择 Prusa i3 MK3S+ 作为我们的机器。使用 Print Setting 选择器，让我们选择 PLA 作为我们的 Print Setting。使用对话框底部的模型选择器，我们可以在画布中双击
  Spur Gear，或从 Manufacturing Model 1 中的浏览器中选择 Spur Gear 组件，如图 7.26 所示。


  完成与机器、打印设置和模型相关的所有选择后，我们已完成了此增材制造设置的输入。迄今为止我们尚未强调的另一项关键信息是安排零件在构建体积内的位置。默认情况下，增材操作的
  SETUP 对话框会自动勾选 Arrangement 复选框：


  ![](img/baa027bed101c08b496f1f420cee8a5b_233_0.png)


  图 7.26 – 单个组件的增材设置输入已完成


  在 SETUP 对话框中选择 OK 后，Fusion 360 将在画布中自动显示我们所选打印机的构建体积并创建 Setup 1。功能区用户界面随后会略有变化，我们将在
  ADDITIVE 选项卡下的功能区中看到新的图标出现。如果将图 7.27 中的功能区与前一幅图进行比较，您将看到 POSITION 面板下出现一些新图标，并且会出现一个名为
  SUPPORTS 的新面板。一旦创建增材设置，Fusion 360 将显示一个名为 ADDITIVE ARRANGE 的新对话框。我们将在下一章详细讨论在构建体积内排列零件的问题。但就本示例而言，让我们继续在
  ADDITIVE ARRANGE 对话框中按下 OK，这将自动在此打印机的构建区域内排列该组件：


  ![](img/baa027bed101c08b496f1f420cee8a5b_234_0.png)


  图 7.27 – 在增材设置中利用 ADDITIVE ARRANGE


  排列完成后，我们的零件将接触构建板，因为排列期间平台间隙输入为 0。**ADDITIVE ARRANGE** 操作会自动将所有选定组件放置在构建平台的中心周围。在
  **ADDITIVE ARRANGE** 对话框中按下 **OK** 后，Fusion 360 将执行必要的计算并将零件移动到构建平台的中心：


  ![](img/baa027bed101c08b496f1f420cee8a5b_235_0.png)


  图 7.28 – 我们的第一个增材设置现已完成


  执行 **ADDITIVE ARRANGE** 还会在浏览器中添加一个名为 **ADDITIVE ARRANGE** 的新条目，未来如有需要可以对其进行编辑或重新生成。使用此功能，我们可以在给定打印机的构建区域内排列一个或多个组件。由于这是一台
  FFF 打印机，排列类型默认设置为以 2D 方式排列组件。如果我们要使用 **selective laser sintering (SLS)**、**Multi
  Jet Fusion (MJF)** 打印机或粘结剂喷射打印机创建增材设置，我们也可以使用 3D 排列类型并自动在所选 3D 打印机的构建体积内组织零件。


  完成这最后一步后，我们使用 FFF 打印机完成的第一个 Fusion 360 增材设置就完成了。


  ## Summary


  在本章中，我们主要关注 Fusion 360 的设置和首选项，以及如何自定义它们以使我们的增材制造工作流程无缝。我们已更改了控制 Fusion 360 显示行为的设置以及与进入
  **Manufacture** 工作区时自动切换到 **ADDITIVE** 选项卡相关的功能。


  我们还启用了某些审阅功能以利用被视为预发布的功能。在自定义设置和首选项之后，我们学习了制造相关的库，例如机器库和 **Print Settings** 库。我们探索了
  Autodesk 在网上托管的 3D 打印机和 Print Settings 在线库。我们演示了如何从网上下载机器、打印设置，并在 Fusion 360 用户界面中使用它们，通过将它们本地保存为链接库和云保存库，这些库可供我们所有团队成员访问。


  我们强调了不同 3D 打印技术打印设置的相似性和差异，例如 FFF、SLA、DLP 和 MPBF。我们通过为单个组件创建第一个增材设置，将我们所有新获得的知识付诸实践。通过本章所学的一切，在创建制造设置、选择要打印的组件以及在
  Fusion 360 中生成增材设置时，您应该感到自信。


  在下一章中，我们将把零件排列的概念更进一步，重点关注在我们 3D 打印机的构建体积内排列和定向多个组件。

