  \ 的主体预设打印。点击 **OK** 后，主体预设分配完成。\n\n![](img/baa027bed101c08b496f1f420cee8a5b_296_0.png)\n\
  \n图 9.29 – 为主体分配主体预设\n\n如 *图 9.30* 所示，浏览器已更新，可看到 **Yellow** 和 **Red** 均为该设置中激活的主体预设。生成增材刀具路径并模拟后，可切换切片模型的各层。*图\
  \ 9.30* 为第 310 层的快照。\n\n![](img/baa027bed101c08b496f1f420cee8a5b_297_0.png)\n\n\
  图 9.30 – 增材刀具路径的模拟\n\n前图显示切片位于成型平台上方 46.55 毫米处。**SIMULATE ADDITIVE TOOLPATH** 中已取消\
  \ **Show Machine** 复选框以隐藏成型平台。视图从视图立方体设为 **TOP**，**Preview Mode** 设为 **Display current\
  \ layer only**。该组合显示当前层刀具路径并隐藏其他内容。前图中水平方块代表将用红色耗材和 **Extruder 2** 打印的主体，垂直方块代表将用黄色耗材和\
  \ **Extruder 1** 打印的主体。两者周围有明显周界，因其为两个不同主体且使用不同挤出机打印。若打印此刀具路径，两方块间的界面会比用同一主体预设或作为具有均匀周界和连续填充的单个连接主体打印时更明显。\n\
  \n## 摘要\n\n本章聚焦打印设置，包括如何自定义以及如何为给定部件分配唯一主体预设。本章较长，现做简要回顾。\n\nFusion 360 提供了可在创建增材设置时使用的打印设置库。每个打印设置都有默认数值，可用于特定打印机和材料组合的打印。但有时需修改部分设置以改善打印质量或满足特定打印机需求。此时可从\
  \ Fusion 360 库中选择欲修改的打印设置并复制到个人 Print Setting Library 文件夹。本地库中拥有打印设置后，可修改并保存以备将来使用。根据耗材或树脂，某些打印设置必须修改，如层高、挤出耗材的温度、成型平台温度、为控制打印强度而打印的周数及顶层和底层数，以及打印床粘附设置。\n\
  \n也可按需自定义主体预设，并在增材设置中为每个主体分配唯一主体预设。使用这些技术可完全控制 3D 打印的速度和质量。\n\n下一章将学习为需要支撑的部件和增材制造技术创建支撑结构。我们还将更好地理解\
  \ Fusion 360 如何根据本章强调的支撑结构打印设置，在切片和刀具路径生成期间解释这些支撑。\n\n## 10\n\n## 支撑结构\n\n欢迎阅读 *第\
  \ 10 章*。本章将学习如何为 **熔融沉积制造 FFF**、**立体光刻 SLA** 和 **数字光处理 DLP** 3D 打印生成和切片支撑结构。\n\n\
  大多数主流增材制造技术（除粘结剂喷射、选择性激光烧结和多轴沉积外）都需要为具有大悬垂表面的部件区域生成并打印支撑结构。本章将介绍可用于 FFF 和 SLA/DLP\
  \ 3D 打印的杆状和体积支撑结构。\n\n本章所学几乎均适用于为用 **金属粉末床熔融 MPBF** 打印机打印的部件生成支撑结构，但将在 *第 12 章*\
  \ 深入探讨 MPBF 工艺的部件定位和支撑结构生成。MPBF 技术相比 FFF 能以更高精度打印部件和支撑结构，因此不建议在 MPBF 设置中使用如体积和杆状等实体\
  \ FFF 支撑。MPBF 工艺通常使用栅格式体积支撑，因此我们有专门章节介绍如何为该工艺支撑部件。\n\n本章将介绍根据增材设置使用的打印技术，如何对生成的支撑结构进行切片。我们还将学习可添加到成型平台的几种独特支撑连接，如垫、根和底板，这些常用于更有效地将杆状支撑连接到成型平台，并在使用底部向上\
  \ SLA/DLP 技术 3D 打印时提高成型平台粘附。\n\n本章将涵盖以下主题：\n\n- FFF 打印的体积和杆状支撑\n- SLA 和 DLP 打印的杆状支撑\n\
  - SLA 和 DLP 打印的底板支撑\n\n\n\n在本章结束时，您将更好地理解如何使用 Fusion 360 为实体和网格模型生成支撑结构。您将学习如何根据\
  \ 3D 打印技术创建包括晶格、体积支撑和底板支撑在内的杆状支撑。您将了解自上而下和自下而上树脂打印技术之间的差异及其独特的支撑要求。您还将深入了解如何在一个区域、边缘或局部最小点上创建杆状支撑，以便使用\
  \ SLA/DLP 打印机成功打印零件。\n\n### Technical requirements\n\n本章涵盖的所有内容均可供使用个人、试用、商业、初创或教育版\
  \ Fusion 360 许可证类型的用户访问。\n\n某些 Fusion 360 增材制造机，例如 **金属粉末床熔融 (MPBF)** 3D 打印机及其相应的打印设置和支撑结构生成功能，在获得\
  \ Additive Build 扩展访问权限之前不可用。与 Fusion 360 的所有其他扩展一样，Additive Build 扩展不适用于个人使用。由于本章不会涵盖特定于金属\
  \ 3D 打印的主题，您应该能够毫无问题地跟随本章中的所有示例。\n\n如果您拥有 Fusion 360 的商业许可证，要使用金属粉末床熔融机器创建增材设置，您还需要访问\
  \ Additive Build 扩展 (https://www.autodesk.com/products/Fusion-360/additive-build-extension)。\n\
  \nAutodesk 为所有 Fusion 360 商业用户提供 Additive Build 扩展的 14 天试用期。您可以在 Fusion 360 的扩展对话框中激活试用期。\n\
  \n本章的练习文件可在以下位置找到：https://github.com/PacktPublishing/3D-Printing-with-Fusion-360。\n\
  \n## Volume and bar supports for FFF printing\n\n**熔丝制造 (FFF)** 3D 打印机通常可以在无需支撑结构的情况下打印悬垂角度小于\
  \ 45 度的零件。如果您想使用 FFF 打印机打印零件，首先要做的事情之一是尝试找到一种方向，使该零件无需支撑结构即可打印。\n\n然而，某些模型无法在没有支撑的情况下打印。这是因为无论您选择哪种方向，某些部件最终都会出现下表面，其悬垂大于\
  \ 45 度且跨度超过您 3D 打印机能够桥接的距离。在这种情况下，您需要使用 CAD 工具或切片软件生成支撑结构。由于 Fusion 360 既是 CAD 软件也是切片软件，您可以在\
  \ MANUFACTURE 工作区中为任何增材设置参数化生成支撑结构。\n\n在本节中，我们将讨论如何为 FFF 3D 打印机的增材设置生成体积和杆状支撑。为了演示如何生成体积支撑，我们将使用一个名为\
  \ Bracket.f3d 的 Fusion 360 文档。该文档已在 **MANUFACTURE** 工作区中包含一个增材设置。如 *Figure 10.1*\
  \ 所示，**Setup 1** 是一个增材设置，使用 **Prusa i3MK3S +** 打印机和 **PLA (Direct drive)** 打印设置。部件已在\
  \ 3D 打印机内排列，使其位于构建体积的中间。还为该部件选择了合适的方向。基于此方向，我们需要生成支撑结构才能成功打印该部件。*Figure 10.1* 显示了在此设置中位于\
  \ **ADDITIVE** 选项卡的 **SUPPORTS** 面板内的两种生成支撑结构的选项。\n\n![](img/baa027bed101c08b496f1f420cee8a5b_301_0.png)\n\
  \nFigure 10.1 – 用于 FFF 3D 打印机增材设置的支撑结构类型\n\n如果您选择位于 **SUPPORTS** 面板内的 **Solid Volume\
  \ Support** 命令，将会出现一个名为 **SOLID VOLUME SUPPORT** 的新对话框。在此对话框中，有两个选项卡。**Geometry**\
  \ 选项卡允许您选择应通过此操作进行支撑的面或主体。*Figure 10.2* 显示了在 **SOLID VOLUME SUPPORT** 对话框处于活动状态时，所选面如何以蓝色高亮显示。\n\
  \n在此对话框中，您还可以控制 Support Overhang Angle。Fusion 360 将自动为悬垂角度小于此输入字段中条目的向下表面部分生成支撑结构。换句话说，如果我们增加\
  \ Support Overhang Angle 输入，Fusion 360 将在更大区域生成支撑。\n\n![](img/baa027bed101c08b496f1f420cee8a5b_302_0.png)\n\
  \nFigure 10.2 – 为体积支撑选择实体模型的面\n\n在第 10 章的 GitHub 文件夹中，您会找到另一个名为 Bracket-Mesh.f3d\
  \ 的文件。此 Fusion 360 文档是前一个文档的副本，仅有一个细微差别。如 Figure 10.3 所示，在此第二个文档中，名为 Bracket 的部件不是实体主体，而是网格主体。实体体积支撑对话框允许您在被支撑的部件为网格主体时，不仅选择整个主体，还选择单个面组。为了选择单个面组，您必须确保网格面组已显示。在\
  \ Fusion 360 的 MANUFACTURE 工作区中显示网格面组的最简单方法是使用键盘快捷键 Shift + F。如果活动设置中的网格主体有多个面组，每个网格面组将以独特颜色显示，如\
  \ Figure 10.3 所示。在为特定增材设置在 MANUFACTURE 工作区中显示网格面组后，您可以在 SOLID VOLUME SUPPORT 对话框中将面组选为要支撑的输入对象。\n\
  \n![](img/baa027bed101c08b496f1f420cee8a5b_303_0.png)\n\nFigure 10.3 – 选择网格主体的三个面组\n\
  \n现在我们已经说明了在生成体积支撑时如何为网格主体选择面组，我们可以切换回原始模型 (Bracket.f3d)，并在先前选择的实体主体的两个面上创建体积支撑。一旦通过单击\
  \ SOLID VOLUME SUPPORT 对话框上的 OK 按钮生成支撑结构，Fusion 360 将创建如 Figure 10.4 所示的支撑结构，您将能够将其可视化为悬垂表面下方的蓝色体积。Fusion\
  \ 360 还会在浏览器中活动设置的 Supports 文件夹内添加一个名为 Solid Volume Support1 的新条目。\n\n![](img/baa027bed101c08b496f1f420cee8a5b_304_0.png)\n\
  \nFigure 10.4 – 可视化实体体积支撑\n\n在 Figure 10.4 中，您可能注意到蓝色支撑结构并未封闭整个开口，而是支撑了大约一半的圆弧面。这是因为我们使用了\
  \ 40 度的支撑悬垂角度，而 Fusion 360 没有对该圆弧上悬垂角度大于 40 度的任何点进行支撑。重要的是要记住，悬垂角度是从水平面测量的，如前一图中的工具提示图像所示。\n\
  \nSOLID VOLUME SUPPORT 对话框的 Geometry 选项卡中我们拥有的另一个选项是 Avoid 复选框。通过激活此复选框，我们可以选择一个或多个面作为输入，并防止\
  \ Fusion 360 在这些表面上生成支撑结构。Figure 10.5 显示了创建第二个 Solid Volume Support 以支撑整个主体，同时避免在先前用作创建\
  \ Solid Volume Support1 输入的两个蓝色高亮圆弧面上生成支撑。\n\n![](img/baa027bed101c08b496f1f420cee8a5b_305_0.png)\n\
  \nFigure 10.5 – 在生成实体体积支撑时选择要避免的面\n\n生成此第二个实体体积支撑的结果是为整个主体创建体积支撑，同时排除我们在对话框中指定要避免的两个面。使用此技术，我们可以为某些面添加独特的支撑结构，同时为主体其余部分创建不同的支撑集。\n\
  \nSOLID VOLUME SUPPORT 对话框内的第二个选项卡名为 General。Figure 10.6 显示了 General 选项卡中的两个输入字段。第一个输入字段名为\
  \ Top Distance to Part，控制我们生成的支撑结构与部件下表皮之间的距离。第二个输入字段名为 Bottom Distance to Part，如果给定支撑结构接触的是部件的上表皮而不是构建板，则控制支撑结构与部件上表皮之间的距离。\n\
  \n这两个字段的输入单位为长度，默认输入为 0.3 毫米。如 Figure 10.6 所示，PLA (Direct Drive) 打印设置的层高为 0.15 毫米。因此，使用这些设置生成的支撑结构将在部件的上表皮上方和下表皮下方各有一个两层间隙。\n\
  \n根据我的经验，使用 PLA 进行 3D 打印时，只要我们在部件和支撑之间留出两层间隙，后处理就会变得更容易，并且可以在打印后毫不费力地将支撑结构从部件上移除。\n\
  \n\n\n![](img/baa027bed101c08b496f1f420cee8a5b_306_0.png)\n\n图 10.6 – 体积支撑与打印设置之间的关系\n\
  \n生成一个或多个支撑结构后，Fusion 360 会将它们添加到浏览器中的支撑文件夹中，如图 10.7 所示。如果我们选择其中一个支撑结构，可以右键单击它们并查看选项菜单。我们有选项可以**抑制**某个支撑、**复制**、**剪切**、**复制/粘贴**或**删除**它。请记住，支撑文件夹中支撑结构的顺序很重要。后续支撑会感知到其前驱的存在和位置，可以避免在已创建支撑的位置生成支撑。因此，如果你在支撑文件夹中抑制了某个支撑，前面的支撑结构可能会过时，可能需要重新生成。\n\
  \n![](img/baa027bed101c08b496f1f420cee8a5b_307_0.png)\n\n图 10.7 – 支撑结构的右键菜单选项\n\n\
  现在我们已经学会了如何为 FFF 设置生成体积支撑，可以专注于生成杆状支撑。图 10.8 显示了 SOLID BAR SUPPORT 对话框，可通过 ADDITIVE\
  \ 选项卡中 SUPPORTS 面板内同名命令启动。\n\n在此对话框的 Geometry 选项卡中，首先可以做的是选择一组要支撑的面或实体。正如你可能注意到的，杆状支撑和体积支撑在\
  \ Geometry 选项卡中的选项完全相同。在此选项卡中，你可以输入支撑悬垂角度，选择希望避免为其创建支撑结构的表面，并指定多个支撑实体之间的间隙以避免支撑结构重叠。\n\
  \n![](img/baa027bed101c08b496f1f420cee8a5b_308_0.png)\n\n图 10.8 – 选择面以生成杆状支撑\n\n\
  控制零件与支撑结构之间连接点密度的选项位于 General 选项卡中，如图 10.9 所示并标记为 1。Fusion 360 将这些连接点称为锚点。在 General\
  \ 选项卡中，你还可以选择将多个杆分组并聚集成树状/花束结构，并控制这些结构的外形，同一图中标记为 2。\n\nGeneral 选项卡中 Anchor Density\
  \ 字段中的术语 anchor 指的是杆状支撑与给定零件下表面之间的连接点。Fusion 360 提供多种预设锚点密度，如 Sparse、Medium 和 Dense，以及完全自定义锚点密度的能力，这使你能够控制锚点之间的距离、它们在下表面上的对齐方式以及锚点与下表面周边的距离。使用自定义锚点密度，你还可以将锚点以六边形或矩形图案分布。\n\
  \n与控制锚点放置设置类似，Fusion 360 还允许你控制杆状支撑的花束/树状结构的参数。在生成杆状支撑时，你可以从包括 Small、Medium 和 Large\
  \ 花束/树状结构在内的预设集中进行选择。或者，你也可以通过从下拉列表中选择 None 来完全消除花束/树状结构。如果你愿意，还可以完全自定义花束/树状结构，如图\
  \ 10.9 所示并标记为 2。选择花束/树类型下拉菜单中的 Custom 后，你将可以访问额外的控制项，例如给定花束/树状结构的直径和高度以及其递归深度。你还可以控制花束从每个杆状支撑的主柱分支的最大垂直角度。\n\
  \n![](img/baa027bed101c08b496f1f420cee8a5b_309_0.png)\n![](img/baa027bed101c08b496f1f420cee8a5b_309_1.png)\n\
  \n图 10.9 – 实心杆状支撑的 General 选项卡\n\nBar Properties 选项卡允许你控制杆的大小和形状，如图 10.10 所示。Bar\
  \ Size 部分允许你控制杆的直径。如果 Width on Part 和 Width on Platform 输入相同，你将得到一个截面均匀的杆。如果你将 Width\
  \ on Platform 输入的值大于 Width on Part 输入的值，还可以生成一个类似圆锥台的杆。\n\n实心杆状支撑对话框的 Bar Shape\
  \ 部分允许你自定义杆的形状。Fusion 360 生成的默认杆的 Polygon Corner Count 值为 5。这会导致杆状支撑具有五边形截面。如果你将\
  \ Polygon Corner Count 输入增加到 6 或 8，则分别会得到六边形或八边形截面。你还可以通过将 Radial Type 下拉菜单从 Circular\
  \ 改为 Ellipse 并将 Ellipse Stretch in % 输入字段从 100% 增加到 200% 来生成椭圆形截面。\n\nBar Path 部分有额外的设置，允许你修改杆状支撑通往成型平台的路径。如图\
  \ 10.10 所示，杆状支撑默认以直角连接到零件。就像体积支撑一样，FFF 设置中默认的杆状支撑设置也在零件与支撑结构之间留有间隙。此间隙的默认距离为 0.15\
  \ 毫米，如 Distance to Part 输入字段中设置的那样。如果你的打印设置为 0.15 mm，则该间隙相当于杆状支撑与零件下表面之间 1 层厚的间隙。\n\
  \n![](img/baa027bed101c08b496f1f420cee8a5b_310_0.png)\n![](img/baa027bed101c08b496f1f420cee8a5b_310_1.png)\n\
  \n图 10.10 – 为实心杆状支撑选择自定义杆形\n\nSOLID BAR SUPPORT 对话框的 Connections 选项卡允许你控制杆状支撑与零件之间断开点的形状。FFF\
  \ 设置中杆状支撑的默认设置不使用断开点，如图 10.11 左侧标记 1 所示。如果你选择同一图中右侧标记 1 所示的下拉菜单中的 Custom 选项，可以使用出现的额外输入字段控制断开点的大小和形状。\n\
  \n你还可以控制杆状支撑如何附着到成型平台。默认情况下，所有杆状支撑都与成型平台有实体连接，因为 Pad on Platform 复选框处于激活状态，如图 10.11\
  \ 所示。你可以使用相关输入字段控制垫的直径、高度和锥角。\n\n![](img/baa027bed101c08b496f1f420cee8a5b_310_2.png)\n\
  ![](img/baa027bed101c08b496f1f420cee8a5b_310_3.png)\n\n图 10.11 – 为实心杆状支撑选择自定义断点\n\
  \n图 10.12 显示了在此零件的圆形面上生成杆状支撑的结果。要生成此特定支撑，你需要使用以下设置：\n\n- Bar Properties 选项卡 - Bar\
  \ Size = 默认\n- Bar Properties 选项卡 - Bar Shape = 实心杆\n- Bar Properties 选项卡 - Right\
  \ Angle on Part = 是\n- Bar Properties 选项卡 - Distance to Part = 0.3 mm\n- Connections\
  \ 选项卡 - Use Breakpoint = 否\n- Connections 选项卡 – Pad on Platform = 未选中\n\n如前列表所示，我们将\
  \ **Distance to Part** 的输入增加到 0.3 毫米，以便在零件与支撑之间获得两层分离。在 *图 10.12* 中，你可以直观看到杆状支撑与零件之间的间隙，如蓝色杆与灰色零件之间的空白所示。我们在生成此支撑结构时还取消选中了\
  \ **Pad on Platform** 选项，以便杆直接接触成型平台而不占用成型平台上的额外面积。\n\n![](img/baa027bed101c08b496f1f420cee8a5b_311_0.png)\n\
  \n图 10.12 – 具有花束结构的杆状支撑\n\n如果我们从杆状支撑接触零件的区域向外放大，还可以看到此杆状支撑如何连接到成型平台。图 10.13 使用剖面分析视图显示了同一零件及其杆状支撑，其中零件和支撑结构已使用\
  \ YZ 平面进行剖切。在下图中，两个 Solid Volume 支撑均已从浏览器中抑制，以便在无遮挡的情况下查看杆状支撑。你会注意到，此杆状支撑使用了小型树状/花束结构，并且杆已以\
  \ Maximum Projection Angle 值为 30 度的投影到平台上，以便杆状支撑路径朝向成型平台，同时避免零件本身的上表面，从而使后处理去除支撑的步骤更轻松。\n\
  \n![](img/baa027bed101c08b496f1f420cee8a5b_312_0.png)\n\n图 10.13 – 投影到平台的杆状支撑\n\n\
  为了更好地了解杆状和实体支撑结构将如何打印，我们需要生成增材工具路径并对其进行仿真。开始时，让我们取消抑制 Solid Volume Support1。我们将保持\
  \ Solid Volume Support2 被抑制，如图 10.14 所示。\n\nFusion 360 能够以独特的方式为体积支撑和杆状支撑创建增材工具路径。正如你在第\
  \ 9 章中所回忆的那样，打印设置编辑器控制 FFF 支撑的切片方式以及增材工具路径的生成方式。你可以控制诸如为每种支撑类型创建多少个周界等选项。\n\n在此练习中，我们尚未自定义主体预设，并为组件及其相关支撑结构使用\
  \ Normal 主体预设。如果我们编辑打印设置并查看 Normal 主体预设的 Support 子部分，可以看到 Volume 支撑的 Number of Support\
  \ Perimeters 值为 0，而在生成工具路径时，杆状支撑使用 1 个周界进行切片。\n\n\n\n![](img/baa027bed101c08b496f1f420cee8a5b_313_0.png)\n\
  \n图 10.14 – 我们 FFF 设置中杆状支撑和体积支撑的刀路可视化\n\n生成增材刀路并模拟后，我们可以看到增材模拟中浅蓝色物体代表支撑结构。图 10.14\
  \ 显示了第 300 层的增材刀路，该层高度为 45.05 毫米，因为该零件以 0.15 毫米的层高切片。如果查看体积支撑所在的区域，您会注意到它们采用了手风琴式刀路进行切片。这是由于\
  \ Normal 预设的打印设置编辑器中体积支撑的 15% 填充密度设置所致。您也可以在同一图中观察到，体积支撑的刀路不包含围绕支撑的外轮廓线。\n\n与体积支撑相比，杆状支撑生成的刀路具有五边形截面，并在其周边有一条连续线。然而，杆状支撑刀路不包含任何填充，因为在同一打印设置中，Normal\
  \ 预设的杆状支撑填充密度设置为 0%。\n\n此示例演示了我们如何在 FFF 3D 打印机上打印零件时生成实心体积支撑和杆状支撑来支撑零件。我们学习了如何控制各种设置以生成杆状支撑和体积支撑所需的形状和连接类型。我们还学习了\
  \ Fusion 360 如何为这些支撑结构生成切片和刀路。使用这些设置，我们可以为成功打印创建所需的任何支撑结构。在下一节中，我们将学习如何创建各种杆状支撑以使用\
  \ SLA 和 DLP 3D 打印机制造零件。\n\n## 用于 SLA 和 DLP 打印的杆状支撑\n\n市场上主要有两种树脂打印机：底部向上树脂打印机和顶部向下树脂打印机。在底部向上树脂打印机中，光源位于树脂槽下方。随着成型平台从树脂槽（有时称为料\
  \ vat）抬起，零件倒置打印。在顶部向下树脂打印机中，光源位于成型平台上方。随着每层成型平台浸入树脂槽，零件正向打印。这两种树脂 3D 打印机都需要出于不同目的的支撑结构。\n\
  \n在顶部向下树脂 3D 打印中，我们需要为悬垂表面生成支撑结构，与为 FFF 3D 打印生成的方式类似。然而，我们为树脂打印机生成的支撑结构很可能是杆状支撑而不是体积支撑。\n\
  \n在顶部向下 3D 打印中，随着每层打印，成型平台会进一步浸入树脂槽。由于打印层与树脂之间没有 **fluorinated ethylene propylene\
  \ (FEP)** 薄膜，因此该打印过程不会受到零件与 FEP 薄膜之间的分离力作用。因此，我们通常可以创建较弱的支撑结构并仍然成功制造零件。\n\n底部向上树脂打印机在将零件从树脂料\
  \ vat 抬起时需要克服重力。底部向上树脂打印机还需要在打印过程中克服零件与 FEP 薄膜之间的剥离效应。根据零件形状和排水孔位置，使用底部向上树脂打印机时您可能还需要克服杯状效应。这就是为什么底部向上树脂打印过程通常需要更强的支撑结构。\n\
  \nFusion 360 提供了四个不同的命令，用于为 SLA /DLP 3D 打印机的增材设置添加杆状支撑。在图 10.15 中，您可以看到一个包含单个零件的增材设置。名为\
  \ Hook.f3d 的 Fusion 360 设计位于本章的 GitHub 文件夹中。该文件包含一个名为 Setup1 的增材设置，用于 Formlabs Form\
  \ 3 打印机及其相关打印设置。该零件已自动定向，并在成型平台上方 7 毫米，如下图所示。当为 SLA/DLP 增材设置添加杆状支撑时，**BAR SUPPORT**\
  \ 对话框包含四个选项卡。图 10.15 显示了杆状支撑的 **Geometry** 选项卡。如屏幕截图所示，在选择要支撑的模型后，我们可以控制 **Support\
  \ Overhang Angle** 输入。\n\n正如本章前一节中我们探索的实心体积支撑和杆状支撑对话框一样，SLA/DLP 打印的杆状支撑从水平面（XY 平面）测量悬垂角度。Fusion\
  \ 360 为悬垂角度值低于 **Support Overhang Angle** 输入字段中指定的角度的悬垂表面生成支撑结构。\n\n您可能还注意到，SLA/DLP\
  \ 杆状支撑的 **Geometry** 选项卡与之前看到的 FFF 增材设置的体积支撑和杆状支撑的 **Geometry** 选项卡相似。除了 **Support**\
  \ 部分外，我们还有 **Avoid** 复选框和 **Distance to Other Support** 复选框，允许我们指定不支撑的表面以及该杆状支撑需要与相邻支撑结构保持多远的距离。\n\
  \n**Geometry** 选项卡中还有一个额外的复选框名为 **Advanced Area Filter**。激活后，高级区域过滤器允许我们控制要支撑的最小和最大面积，以及是否希望\
  \ Fusion 360 为可能已存在其他支撑结构的面生成支撑。我们还可以控制要生成的杆状支撑的最小和最大 Z 高度。默认情况下，这些条目分别为 0 毫米和 1e+06\
  \ 毫米。如果我们将 **Maximal Z Height** 输入减少到 50 mm，Fusion 360 只会为零件前 50 毫米以下、悬垂角度小于 45\
  \ 度的面部分创建杆状支撑。\n\n![](img/baa027bed101c08b496f1f420cee8a5b_315_0.png)\n\n图 10.15\
  \ – SLA/DLP 打印机上杆状支撑的 Geometry 选项卡\n\n默认情况下，Fusion 360 使用如前图所示的花束/树状结构创建杆状支撑。我们可以在\
  \ BAR SUPPORT 对话框的 General 选项卡中修改 Fusion 360 生成的杆状支撑类型，以及这些杆在接触零件时应彼此多近，如图 10.16\
  \ 所示。通过将 Anchor Density 输入从默认选项 Medium 改为 Dense，我们可以在杆状支撑和零件之间增加更多的接触点。我们还可以改变树/花束结构的形状。下图显示了通过从\
  \ Type 下拉菜单中选择 None 来关闭树状结构的效果。\n\nFusion 360 还允许您通过激活 Groups 复选框将杆分组。图 10.16 显示了\
  \ 5 根杆分组在一起，Group Taper (%) 输入为 50%。\n\n这意味着大约五根从零件到成型平台的杆会向中心点聚集指定的量。如果您使用此设置打印零件和支撑，您可以一次处理五根杆的组，并在后处理期间更轻松地将其从零件上折断。\n\
  \n在 General 选项卡中，您还可以为杆状支撑打开 Brace 选项。图 10.16 显示了带有 K 型支撑的杆。Fusion 360 提供了三种不同的支撑类型，类似于字母\
  \ K、X 和 N。使用 Brace 复选框下方的附加选项，您可以控制希望连接在一起的杆的数量、支撑与杆状支撑主柱之间的链接角度应为多少，以及是否希望支撑与杆状支撑主柱之间的连接为直线或曲线。\n\
  \n![](img/baa027bed101c08b496f1f420cee8a5b_316_0.png)\n\n图 10.16 – 无树状结构的分组和支撑杆状支撑\n\
  \nSLA/DLP 打印中杆状支撑的 **Bar Properties** 选项卡与 FFF 3D 打印的相同。在 **Bar Properties** 选项卡中，您可以控制杆的大小和形状。**Bar\
  \ Properties** 选项卡还允许您控制杆在零件和平台之间应遵循的路径。您可以遵循与下表面法线成直角的路径，或者您的杆可以直接指向成型平台。\n\n现在让我们转到名为\
  \ **Connections** 的最后一个选项卡。在此选项卡中，您可以控制杆状支撑如何连接到零件以及平台。默认情况下，杆状支撑通过零件上的断点连接到零件。您还可以选择使断点偏离零件或完全没有断点。您还可以使用有关杆状支撑应如何连接到零件的确切规格来自定义断点的大小和形状。\n\
  \n下一个名为 **Pad on Platform** 的复选框允许您在杆状支撑连接成型平台处添加一个略大于杆本身的小圆形垫片。如果打开此复选框，您可以控制垫片的宽度、高度和锥度角度。锥度角度为零将得到具有圆柱形截面的垫片。正锥度角度将导致截头锥形，垫片在平台处较大，接近杆时变小。负锥度角度将得到相反的形状，其中垫片与成型平台的连接截面较小，随着\
  \ Z 方向向上移动，垫片变宽。具有负锥度角度的垫片允许您使用凿子轻松地将垫片和杆状支撑与成型平台分离。\n\n\n\n\n**Connections** 选项卡内的最后一个部分名为\
  \ **Connection Type**。Fusion 360 在 **Type** 下拉菜单中提供三个选项：**None**、**Base plate for\
  \ groups** 和 **Roots**。图 10.17 显示了启用 **Base plate for groups** 选项后生成的杆状支撑。选择此选项后，您可以在\
  \ **General** 选项卡中对分组的杆创建底板。您可以控制底板的高度以及其相对于组周边的偏移量。您还可以为这些底板添加锥度角，如之前在平台上添加垫片时所讨论的那样。最后，您可以选择是使用实心图案填充此底板还是应用孔洞图案。我们将在下一节讨论底板支撑时更详细地介绍图案类型。\n\
  \n如果您将连接类型选择为 **Roots**，Fusion 360 将创建杆状支撑柱，这些柱子在打印平台上方不久处分离成多个根部。这会在打印平台方向形成花束结构，增强了杆状支撑主干与打印平台之间的连接，并为细长的高杆状支撑提供额外的稳定性。\n\
  \n![](img/baa027bed101c08b496f1f420cee8a5b_317_0.png)\n\n图 10.17 – 带垫片和分组底板的杆状支撑\n\
  \n到目前为止，我们已经研究了用于 SLA/DLP 3D 打印机的杆状支撑命令。Fusion 360 可以为整个部件生成杆状支撑，也可以为给定部件上的特定选定表面生成支撑。\n\
  \n可能存在需要使用杆状支撑来支撑朝下点和边缘的情况。Fusion 360 具有显式命令，可生成附着于朝下点和边缘的杆状支撑。使用 **Down-Oriented\
  \ Point Bar Support** 和 **Edge with Bar Support** 创建的杆的尺寸和形状控制选项与我们已审查过的杆状支撑选项完全相同。杆状支撑与朝下点杆状支撑和边缘杆状支撑之间的主要区别在于，朝下点杆状支撑会在所选部件的朝下角、边缘和局部最小值处生成单根杆，而\
  \ **Edge with Bar Support** 选项则沿所选实体或部件的朝下边缘生成杆状支撑。\n\n在为 SLA/DLP 打印机生成支撑结构时，我的建议是首先添加朝下点杆状支撑。此操作可确保您始终支撑零件上几乎肯定需要支撑结构的任何局部最小值。接下来，我建议为整个部件添加杆状支撑或晶格体积支撑，以便适当考虑所有需要支撑结构的表面。\n\
  \n现在我们已经提到了晶格体积支撑，让我们更详细地查看此支撑操作。*图 10.18* 显示了如何从 **ADDITIVE** 选项卡中的 **SUPPORTS**\
  \ 面板访问 **Lattice Volume Support** 选项，以及用于控制杆的形状、它们与零件和打印平台的连接、晶格单元的大小以及它们从打印平台移动到零件时的尺寸变化的各种设置。\n\
  \n![](img/baa027bed101c08b496f1f420cee8a5b_318_0.png)\n\n图 10.18 – 增材设置中的晶格体积支撑选项\n\
  \n如图 10.18 所示，杆状支撑和晶格体积支撑之间有很多相似之处。晶格体积支撑本质上是具有独特支撑样式的杆状支撑。晶格体积支撑与杆状支撑之间的主要区别在于，您无法在晶格体积支撑中选择特定的支撑类型（K、X\
  \ 或 N）。晶格体积支撑具有自己独特的支撑方法。但是，您可以在 **General** 选项卡下的 **LATTICE VOLUME SUPPORT** 部分控制晶格本身的形状和生长比例行为。\n\
  \n前一幅图显示了一个宽度为 3 毫米、高度为 4 毫米的晶格单元。它还显示了晶格单元大小的变化，您在底板处有较大的单元，在零件连接区域有较小的单元。这种单元大小的变化由\
  \ **Adaptive Step Count** 输入控制，对于此支撑结构，该值为 3。\n\n您还可以通过在 **General** 选项卡中激活 **Groups**\
  \ 复选框来在生成晶格体积支撑时对杆进行分组。如果在创建晶格体积支撑时激活 **Groups**，则可以在晶格体积支撑的 **Connections** 选项卡中为分组添加底板，如图\
  \ 10.18 所示。\n\n在本节中，我们介绍了如何为使用 SLA/DLP 3D 打印机制造的部件添加各种杆状支撑。我们讨论了杆状支撑、朝下点杆状支撑和边缘杆状支撑之间的相似之处。我们还介绍了如何添加晶格体积支撑。\n\
  \n在下一节中，我们将重点介绍在生成杆状支撑后为获得更好的打印平台粘附而向零件添加底板支撑的具体方法。\n\n## SLA 和 DLP 打印的底板支撑\n\n\
  使用 Fusion 360 自动生成杆状支撑时，Fusion 默认会为每个杆状支撑添加垫片。垫片会添加到杆与打印平台连接处、表面积大于杆直径的位置。此操作可确保支撑与打印平台之间具有良好的粘附性。垫片连接通常推荐用于使用\
  \ SLA/DLP 打印机打印小零件，例如珠宝。然而，如果您使用底部向上树脂打印机用杆状支撑打印较大零件，则应考虑使用底板连接而不是在杆状支撑与打印平台之间使用垫片。这将确保您具有更强的打印平台粘附力并提高打印成功的几率。\n\
  \n在上一节中，我们介绍了如何将杆分组并使用底板将这些组连接到打印平台。Fusion 360 还具有显式的 **Base Plate Support** 操作，如图\
  \ 10.19 所示。此操作位于 **ADDITIVE** 选项卡中，**SUPPORTS** 面板下拉菜单中。\n\n![](img/baa027bed101c08b496f1f420cee8a5b_320_0.png)\n\
  \n图 10.19 – 如何在 Fusion 360 中访问底板支撑命令\n\n图 10.19 显示了 Formlabs Form 3 打印机的增材设置及其相关打印设置。零件已被刻意布置和定向。已将两个杆状支撑操作应用于零件：Down\
  \ Oriented Point Bar Support1 和 Bar Support1。此 Fusion 360 文档名为 Screw.f3d，并包含在本章的\
  \ GitHub 文件夹中。\n\n在功能区中访问底板支撑命令后，您将看到如图 10.20 所示的 BASE PLATE SUPPORT 对话框。此操作还会在浏览器中的\
  \ Supports 文件夹中添加一个名为 Base Plate Support1 的新行项目。在 Geometry 选项卡中选择要创建支撑的模型后，您可以切换到\
  \ General 选项卡。在 General 选项卡中，您将看到控制底板边界形状的选项。您可以根据零件当前方向的轮廓创建底板，也可以根据零件的包围盒创建矩形底板。您可以控制轮廓周边的偏移量、底板的高度及其锥度角。如上一节所述，用于锥度角的负值将创建在正\
  \ Z 方向上横截面积增加的底板。这种形状允许您在打印完成后轻松使用凿子将底板支撑与打印平台分离。\n\n在此示例中，我们支撑的是没有孔的实心零件。如果我们要打印带孔的零件，例如侧面打印的戒指，则取决于我们为\
  \ **Fill Inner Contour** 设置使用的选项，将生成不同的底板。如果选项设置为 **Yes**，我们将创建一个实心、圆形、板状的底板。如果选项设置为\
  \ **No**，我们将创建一个垫圈状底板。\n\n![](img/baa027bed101c08b496f1f420cee8a5b_321_0.png)\n\n\
  图 10.20 – 在 SLA 打印机的增材设置中添加底板支撑\n\n为了节省材料，您还可以在 **BASE PLATE SUPPORT** 对话框的 **General**\
  \ 选项卡中选择图案类型。默认图案类型为 **Solid**。如果您选择不同的图案类型，例如如图 10.21 所示的 **Hexagonal**，您就可以控制图案的大小及其壁厚。请注意，如果您选择除实心以外的图案，则您的杆状支撑可能不会始终接触底板支撑的打印段，这取决于杆的大小和图案的大小。\n\
  \n\n\n![](img/baa027bed101c08b496f1f420cee8a5b_322_0.png)\n\n图 10.20 – 为底板支撑添加六边形图案\n\
  \n在本节中，我们介绍了如何添加明确的底板支撑，以提高大型零件打印成功的可能性。底板支撑会创建一个结构和一个平坦的表面，以提高打印件对成型平台的附着力。通过控制底板支撑的形状和厚度，您可以在使用\
  \ SLA/DLP 3D 打印机进行 3D 打印时确保与平台成功粘合。\n\n## 摘要\n\n无论您计划使用 FFF 打印机还是顶部向下或底部向上的 SLA/DLP\
  \ 打印机进行 3D 打印，都需要生成支撑结构，以便成功打印切片模型中的悬垂区域或岛状部分。根据您的 3D 打印技术，您可能需要生成体积支撑或杆状支撑。\n\n\
  控制这些支撑的尺寸和形状（因此也控制其强度）在打印是否成功方面起着至关重要的作用。在本章中，我们探讨了如何为 FFF 打印生成体积支撑和杆状支撑。我们讨论了如何有效地将这些支撑应用于组件的整个主体或选定表面。我们展示了如何将支撑应用于实体和网格体。我们演示了更改支撑设置以及切片设置的影响，以控制这些支撑的切片方式和刀具路径的生成。我们还提到了在生成支撑时零件与支撑结构之间的间隙的影响，以便我们能够打印出成功的下表面区域，同时减少零件的后处理工作量。\n\
  \n我们还强调了如何为 SLA/DLP 打印创建杆状支撑。我们展示了 FFF 与树脂基打印机杆状支撑之间的相似之处，以及 SLA/DLP 打印机杆状支撑的独特特性，例如树状结构、分组和加固。我们还了解了如何创建底板支撑以实现与成型平台的牢固附着。\n\
  \n使用本章中学到的技术，您可以尝试使用特定的打印机、材料和打印设置，以创建支撑结构，使其强度足以成功打印给定零件，同时最大限度地减少材料使用量和去除打印支撑结构所需的后处理时间。\n\
  \n在下一章中，我们将进一步探讨如何切片模型并生成增材刀具路径，以及如何逐层模拟该刀具路径，以便更好地了解模型方向、切片设置和支撑结构的影响。\n"
- '## 11 切片模型和模拟刀具路径


  欢迎阅读 *第 11 章*。在本章中，我们将全面学习如何为 **Fused Filament Fabrication (FFF)** 3D 打印生成和模拟增材刀具路径。我们将介绍如何获取有关增材设置的关键信息，例如打印统计数据和能源消耗。我们还将学习如何生成和自定义启动打印作业所需的
  G-code。


  一旦我们希望打印的所有组件都已正确定向、排列并得到支撑，就该生成增材刀具路径了。生成刀具路径后，我们可以在每一层可视化结果并模拟喷嘴在移动和挤出动作期间的运动。


  在 Fusion 360 中生成增材刀具路径是一个一键式解决方案，但始终建议查看刀具路径，以了解我们选择的打印设置和主体预设是否会产生预期结果。


  在本章中，我们将涵盖以下主题：


  - 生成增材刀具路径

  - 模拟增材刀具路径

  - 生成 G-code


  到本章结束时，您将更好地了解如何使用 Fusion 360 生成增材刀具路径。您将学习如何自定义 Fusion 360 的首选项以手动和自动生成刀具路径。您将学习如何访问关键打印统计数据，例如打印给定打印件将使用多少耗材以及打印需要多长时间。您还将学习如何计算给定打印作业的总成本，包括耗材成本和能源成本。您将学习如何模拟增材刀具路径，以逐层可视化打印设置对打印作业的影响。最后，您将学习如何生成
  G-code 文件。随着本章的结束，您将获得必要的技能，以便在打印过程中在特定层引入暂停动作，以便在零件中嵌入物体，例如磁铁、六角螺母和加强杆。您还将了解如何自定义
  G-code 以在打印过程中更改使用的耗材，以便为打印的一部分加载不同颜色的耗材。


  ### 技术要求


  本章涵盖的所有主题都可供个人、试用版、商业版、初创版和教育版 Fusion 360 许可证类型使用。


  本章的练习文件可在以下位置找到：https://github.com/PacktPublishing/3D-Printing-with-Fusion-360


  除了 Fusion 360 之外，您还需要一个文本编辑器，例如 Notepad 来打开 G-code 文件。


  ### 生成增材刀具路径


  在前几章中，我们介绍了如何创建增材设置、在成型体积内定向和放置零件，以及生成支撑结构。在本节中，我们将在此知识的基础上进行扩展，并演示如何为此类增材设置生成增材刀具路径。


  为了演示如何在 Fusion 360 中生成增材刀具路径，让我们使用本章 GitHub 页面提供的 `Connector-Assembly`。该 Fusion
  360 文档包含三个组件。如图 11.1 所示，主要组件名为 `Connector`。还有两个名为 `Carbon Fiber Rod` 的附加组件。根据零件的装配方式，碳纤维杆旨在嵌入连接器内部。为了使用传统制造方法制造此类组件，我们必须将连接器分成两半，以便嵌入碳纤维杆。或者，我们必须钻出通孔以将碳纤维杆放置在连接器主体内。然而，由于我们将利用增材制造，我们可以在打印过程中直接插入碳纤维杆，而无需依赖二次操作。


  ![](img/baa027bed101c08b496f1f420cee8a5b_327_0.png)


  图 11.1 – 包含三个组件的 Connector-Assembly


  碳纤维杆可以从各种来源轻松购买，并可用于在特定方向上加强给定组件。图 11.2 显示，在 www.amazon.com 上快速搜索碳纤维杆将得到各种尺寸和价格可供购买。在此示例中，我们将使用
  4 mm x 4 mm x 420 mm 的杆，每包 8 根，价格约为 16 美元。


  ![](img/baa027bed101c08b496f1f420cee8a5b_328_0.png)


  图 11.2 – 在线有各种尺寸的碳纤维杆可供购买


  名为 `Connector` 的组件已包含两个腔体，可在打印过程中嵌入碳纤维杆。该设计可容纳长度为 100 mm、横截面为 4 mm x 4 mm 的杆。由于此示例仅为理论示例，腔体不包含额外的公差。如果我们将此组件作为最终设计的一部分进行打印，最好先购买碳纤维杆并测量它们，确保其横截面尺寸确实为
  4 x 4 mm。然后，我们将在 Y 和 Z 轴上对其测量的横截面尺寸增加一层公差，以便在打印过程中轻松将杆放置在零件内。


  过程中的下一步是创建增材设置。我们在上一章中广泛介绍了如何创建增材设置。如图 11.3 所示，此零件的增材设置包括机器 **Prusa i3MK3S+**，以及打印设置中定制的
  **PLA (direct drive)**。如果您查看浏览器，在活动设置（Setup 1）下，您会看到 PLA 打印设置关联了一个 **Custom** 主体预设。


  在 **SETUP** 对话框中，我们将明确选择我们的模型为 **Connector:1**。我们不会在模型选择过程中选择碳纤维杆。这将确保我们只 3D 打印连接器零件。


  ![](img/baa027bed101c08b496f1f420cee8a5b_329_0.png)


  图 11.3 – 为名为 Connector 的组件创建增材设置


  在这一点上，我想强调一个我们都应该注意的关键 Fusion 360 首选项。您可能还记得，我们可以通过单击用户界面右上角的头像图标来访问 **Preferences**
  对话框，如图 11.4 中标注 1 所示。在 **Preferences** 对话框中，您可以在浏览器中导航到 **Manufacture** 部分，如标注 2
  所突出显示。在 **Manufacture** 部分，您会注意到有一个 **Generate Additive Toolpath on Setup creation**
  选项，如标注 3 所突出显示。默认情况下，此选项未选中，如图所示。


  如果您经常处理不需要支撑结构的模型，您可能更喜欢激活此复选框，然后 Fusion 360 在您创建增材设置后立即为您自动创建增材刀具路径。我经常发现自己处理需要生成支撑结构的模型。因此，我更喜欢保持此选项未选中。这样，我可以先添加支撑结构，然后在对模型的支撑结构感到满意后生成增材刀具路径。




  ![](img/baa027bed101c08b496f1f420cee8a5b_330_0.png)


  图 11.4 – 生成增材加工刀具路径可以在“首选项”中自动化


  创建增材设置后，我们需要为此模型添加必要的支撑结构，以支撑低于特定悬垂角度的下表面。图 11.5 显示了两个具有较大悬垂角度的面的选择，这些面需要支撑结构才能成功进行
  3D 打印。如第 10 章详细所述，我们将对这两个面应用实心体积支撑。


  ![](img/baa027bed101c08b496f1f420cee8a5b_330_1.png)


  图 11.5 – 对选定面应用实心体积支撑


  注意，我们没有对零件中将放置碳纤维杆的两个腔体应用支撑结构。这是可以选择基于 CAD 的表面来生成支撑结构时的一个关键优势。使用明确的选择集，您不仅可以完全控制想要支撑的表面，还可以轻松避免在模型中您知道会进行打印中操作的部分创建支撑，例如插入磁铁、六角螺母或加强杆，这将确保零件自支撑。


  现在设置已完成，是时候创建增材加工刀具路径了。Fusion 360 允许您以两种方式之一创建增材加工刀具路径。选择浏览器中的增材加工刀具路径后，您可以右键单击并从弹出菜单中选择“生成”，如图
  11.6 所示。或者，在从浏览器选择增材加工刀具路径后，您可以从位于 ADDITIVE 选项卡中的 ACTIONS 面板中选择“生成”命令。这两个命令都将开始生成增材加工刀具路径。


  ![](img/baa027bed101c08b496f1f420cee8a5b_331_0.png)


  图 11.6 – 生成增材加工刀具路径


  一旦为 FFF 打印机生成了增材加工刀具路径，如果在浏览器中展开“增材加工刀具路径”行项目，您将看到一个名为“打印时间”的行项目。该条目在图 11.7 中由标注
  1 突出显示，显示了增材设置的总体打印时间。您可以通过在浏览器中双击“打印时间”，或通过选择 ACTIONS 面板下的“打印统计”命令来获取更多信息，如同一图中标注
  2 所示。


  这两个操作都会显示 **PRINT STATISTICS** 对话框，其中包含两个选项卡。第一个选项卡名为 **Print Statistics**，提供额外信息，例如成功完成此设置打印所需使用的丝材米数。这是一项重要信息，因为在开始打印前您可能需要确保手头有足够的材料。您还会看到有关打印将包含多少层的信息，以及模型打印的各个部分（如外壳、填充和支撑结构）将消耗多少时间。


  ![](img/baa027bed101c08b496f1f420cee8a5b_332_0.png)


  图 11.7 – 增材设置的打印统计信息


  在 **PRINT STATISTICS** 对话框的第二个选项卡中，您可以计算完成打印此零件所需的材料成本和能源消耗量。请注意，**Cost and energy**
  选项卡仅适用于 FFF 机器。您将无法查询其他增材制造工艺的材料或能源成本。


  如 *图 11.8* 所示，**Cost and energy** 选项卡允许您从下拉菜单中选择位置。根据您的位置，您可以输入您所在市场的能源成本以及为本次打印购买的特定丝材的成本。


  ![](img/baa027bed101c08b496f1f420cee8a5b_333_0.png)


  图 11.8 – 使用 FFF 机器的增材设置的成本和能源计算


  在此示例中，我们可以将位置设置为美国，并将能源成本输入为每千瓦时 $0.23，这是撰写本文时美国的当前平均能源成本。我们可以将使用的丝材成本输入为每公斤 $39.99。凭借这些输入，Fusion
  360 估计打印的总成本为 $3.25，这是基于我们将使用的丝材量以及挤出丝材所需的加热量，以及保持床在一定温度下的加热量。请注意，此计算不包括我们将插入此零件中的碳纤维杆的成本。


  如果您还记得，www.amazon.com 上 8 根杆的成本为 $16。这意味着每根杆价值 $2。每根杆长 420 mm，我们的开口长 100 mm。这意味着每件零件可以使用四分之二根杆。因此，我们每件零件将使用价值
  $1 的杆，使此零件的总成本达到 $4.25，不包括人工成本。


  在打印前能够看到此类信息有助于我们了解制造零件的大致成本。根据此信息，我们可以选择更改打印设置以降低最终零件的能源或丝材成本。


  在本节中，我们重点介绍了如何自动和手动生成增材加工刀具路径。我们指出了可以在创建增材设置时立即生成增材加工刀具路径的自定义首选项。我们展示了如何从 Fusion
  360 的浏览器和功能区 UI 生成增材加工刀具路径。我们还学习了如何使用 Fusion 360 计算关键打印统计信息，例如总打印时间、所需材料和打印成本。在下一节中，我们将模拟增材加工刀具路径以逐层可视化它。


  ## 模拟增材加工刀具路径


  在上一节中，我们学习了如何使用 Fusion 360 为 FFF 工艺生成增材加工刀具路径。在本节中，我们将重点介绍如何模拟这些增材加工刀具路径。在 Fusion
  360 的 **MANUFACTURE** 工作区中，我们有两种方法可以模拟增材加工刀具路径。


  第一种方法是在浏览器中为活动设置选择 **Additive Toolpath** 行项目并右键单击它。如 *图 11.9* 中标注 **1** 所示，我们可以在此右键菜单中访问
  **Simulate Additive Toolpath** 命令。我们拥有的第二个选项是使用位于 **ADDITIVE** 选项卡的 **ACTIONS**
  面板中的 **Simulate Additive Toolpath** 命令。这两个命令都会产生相同的结果，即对活动增材设置的增材加工刀具路径进行模拟。


  ![](img/baa027bed101c08b496f1f420cee8a5b_334_0.png)


  图 11.9 – 如何访问“模拟增材加工刀具路径”命令


  一旦我们模拟增材加工刀具路径，我们就可以可视化机器将为此增材设置 3D 打印的所有层。我们有四种方法可以更改我们可视化的层号。*图 11.10* 使用唯一的标注指出每种方法：


  - 标注 **1** 指向 Fusion 360 画布中的蓝色箭头。如果我们通过鼠标左键单击选择此箭头，我们可以沿 Z 轴上下拖动箭头以在不同层可视化刀具路径。

  - 标注 2 指向位于画布底部的仿真播放器控件。此控件中有七个按钮。使用控件中央的播放按钮（从左数第四个按钮），我们可以开始刀具路径的动画。控件中最左和最右的按钮（从左数第一个和第七个按钮）将自动跳转到第一层和最后一层。在此示例中，最后一层是
  433。我们还可以使用按钮二或六逐层切换。按钮三和四在活动层内动画化刀具路径。

  - 标注 3 指向 SIMULATE ADDITIVE TOOLPATH 对话框中的“当前层”输入字段。图 11.10 显示了第一层的刀具路径，因为“当前层”的输入设置为
  1。我们可以在此字段中输入特定的层号以快速跳转到该层的刀具路径可视化。请记住，在输入所需层号后，您无需按 Enter 或单击“确定”即可使更改生效。Fusion
  360 将自动更新并显示您输入的层的刀具路径。

  - 标注 4 指向仿真播放器时间线，该时间线位于仿真播放器控件下方。黑色垂直线可用于控制时间线。通过左键单击选择它，您可以将时间线向右拖动以可视化任何计算层的刀具路径。


  ![](img/baa027bed101c08b496f1f420cee8a5b_335_0.png)


  图 11.10 – 如何更改工具路径仿真中显示的层




  SIMULATE ADDITIVE TOOLPATH 对话框提供了多个选项，可让你根据需要可视化特定的刀具路径。如果将 Mode 输入从 Display up
  to current layer（显示至当前层）更改为 Display current layer only（仅显示当前层），你将能够可视化你感兴趣的层号的特定刀具路径。在图
  11.11 中，我们可以看到连接器组件在第 80 层的刀具路径。你还可以看到，在 SIMULATE ADDITIVE TOOLPATH 对话框中，Display
  Type 选项被设置为 Toolpath Type。使用此显示类型，Fusion 360 会根据刀具路径的类型为每条刀具路径线着色。例如，任何外轮廓刀具路径都用红色线着色，而所有内轮廓刀具路径则用绿色着色。支撑结构使用浅蓝色线表示，而填充刀具路径则显示为橙色线。这些是该图中所显示层中存在的唯一四种刀具路径类型。


  你可能还注意到，在图 11.11 中 Show Machine 复选框未被选中，并且我们是从顶视图查看模型。关闭机器可视化会隐藏我们在活动设置中使用的 3D 打印机的工作体积以及打印平台。通过隐藏打印平台的可视化，我们可以在模拟增材刀具路径时轻松专注于零件和支撑。


  ![](img/baa027bed101c08b496f1f420cee8a5b_336_0.png)


  图 11.11 – 可视化特定层的刀具路径


  SIMULATE ADDITIVE TOOLPATH 对话框中我们拥有的另一个选项是显示刀具路径的打印速度。我们可以通过将显示类型从 Toolpath type
  改为 Print speed 来实现，如图 11.12 所示。使用打印速度显示类型可视化刀具路径时，Fusion 360 会根据 3D 打印每条刀具路径时使用的挤出速度对其着色。左侧图像显示，我们的零件和支撑结构在第
  1 层以相对较慢的速度打印。右侧图像显示同一零件在第 81 层。在这里，我们可以看到填充、轮廓、支撑和桥接刀具路径类型以不同的速度打印，并且与第 1 层相比，在这一层通常快得多。


  ![](img/baa027bed101c08b496f1f420cee8a5b_337_0.png)


  图 11.12 – 使用打印速度显示类型显示增材刀具路径


  通过模拟增材刀具路径并可视化 3D 打印机在挤出丝材时在每一层会做什么，我们可以确定零件在各层将有多少条轮廓刀具路径，以及零件在打印过程中将如何得到支撑。我们还可以可视化从一层到另一层的打印速度变化。


  使用这些技术，我们可以选择继续打印或更改某些打印设置，以实现我们期望的轮廓、填充和支撑的刀具路径。在下一节中，我们将学习如何生成 G-code 以开始打印。


  ## 生成 G-code


  在创建增材刀具路径并对其进行模拟后，如果我们对结果满意，就可以进入过程中的最后一步，即生成 G-code。为了使用 Fusion 360 为增材设置生成 G-code，我们只需单击
  SIMULATE ADDITIVE TOOLPATH 对话框底部的 Post Process 按钮，如图 11.13 所示。此操作将自动打开 NC Program
  对话框，在其中我们可以后处理刀具路径并创建必要的 G-code。


  在 NC Program 对话框中，有两个选项卡。第一个选项卡名为 Settings，是增材制造中唯一相关的选项卡。因此，我们可以简单地忽略 Operations
  选项卡。NC Program 对话框的 Settings 选项卡有两个列。左侧列允许我们选择要使用的后处理器，以便将屏幕上看到的刀具路径转换为 G-code 文件。右侧列名为
  Post Properties，允许我们自定义输出，以便生成的 G-code 按照我们的指令执行。


  在 NC Program 对话框的 Program 子部分中，我们可以为 G-code 文件命名并添加额外注释。我们还可以指定 G-code 文件的输出文件夹。如果我们选择图
  11.13 所示的 Post to Fusion Team 复选框，我们的 G-code 文件不仅会保存在本地文件夹中，还会在我们选择的 FUSION TEAM
  文件夹内创建一份副本。


  ![](img/baa027bed101c08b496f1f420cee8a5b_338_0.png)


  图 11.13 – 后处理 FFF 增材刀具路径


  启动 NC Program 对话框的另一种方法是选择 ADDITIVE 选项卡的 ACTIONS 面板中的 Post Process 命令，如图 11.14 所示。请记住，在选择
  Post Process 命令以启动 NC Program 对话框之前，必须先选择活动设置的增材刀具路径。


  在本例中，我们使用的是 Prusa i3MK3S+ 机器。用于 Prusa 打印机的后处理文件具有额外的属性，如图 11.14 所示。在本例中我们感兴趣探索的属性位于
  Pause Print 部分，如标注 2 所示。通过展开 Pause Print 部分的列表，我们可以输入希望暂停打印过程的层号。我们还可以包含一条在暂停期间显示在打印机显示屏上的消息。


  正如你在上一节中所回忆的那样，通过模拟我们的增材刀具路径，我们确定在第 80 层，挤出机会尝试跨越我们希望添加碳纤维棒的空腔。因此，在第 79 层暂停打印是个好主意，这样我们就可以在打印机尝试封装空腔之前插入碳纤维棒。


  ![](img/baa027bed101c08b496f1f420cee8a5b_339_0.png)


  图 11.14 – 在特定层为 G-code 添加暂停打印功能


  Fusion 360 根据所选的后处理文件提供独特的后处理属性，该文件与你为设置选择的机器相关联。图 11.15 显示了三种常见 3D 打印机及其后处理属性之间的差异。


  左侧图像显示了 Prusa 系列打印机的后处理属性。正如图中所示，使用 Prusa 后处理器，你可以自定义 G-code，以便找到打印特定丝材的最佳温度。这可以通过在
  Temperature Tower 部分启用 Trigger 字段来实现。此操作将使你能够在控制温度从初始温度值上升到最终温度值并设置间隔的情况下打印测试对象。打印完成后，你可以观察成品并确定在哪个温度下获得最佳效果，并在后续打印中将该知识用作新的打印设置。正如我们在图
  11.14 中之前强调的那样，你还可以执行 Pause Print 功能。除了这两个部分之外，你还可以通过输入应更换为不同丝材的层号来执行 Filament Change
  操作。


  图 11.15 中的中间图像来自 Ultimaker S5 打印机的 Ultimaker 后处理文件。在此后处理文件的 Post properties 的 General
  部分中，你还可以指定装载到机器上的 Extruder 1 和 Extruder 2 的材料和打印核心。没有这些信息，你将无法在此打印机上成功打印。


  图 11.15 中右侧的图像来自 Creality CP-01 打印机的 Creality 后处理文件。与 Prusa 和 Ultimaker 系列打印机一样，Creality
  打印机在 Post properties 下也有 Temperature Tower 选项。此外，你可以控制是否启用或禁用床水平校准。你还具有额外的功能来控制在哪个
  Z 高度关闭床水平校准补偿。


  ![](img/baa027bed101c08b496f1f420cee8a5b_340_0.png)


  图 11.15 – 基于制造商的后处理属性


  NC Program 对话框中的另一个非常有用的功能是能够为给定字段编辑表达式。图 11.16 显示了如何自定义任何输入字段，例如 File name，而不仅仅是手动输入。如果选择输入字段右侧的
  : 图标，如标注 1 所示，你可以从下拉菜单中选择 Edit expression，如标注 2 所示。当 Expression 对话框显示时，你可以输入诸如 date
  或 documentName 之类的参数，以便为 G-code 使用的文件名自动设置为你指定的参数。在 Expression 对话框中，你还可以使用一些基本公式。


  图 11.16 演示了如何使用 + 号连接多个参数。你还可以通过在两者之间使用 _ 来在 date 和 documentName 参数之间添加自定义字符串。选择
  OK 后，File name 字段将自动填充日期和 Fusion 360 文档的名称。Expression 对话框还具有自动填充参数名称的能力。如果你不熟悉所有可用参数，只需开始输入，例如
  name，你就会看到包含字符串 name 的各种参数，以便你可以从可用选项列表中选择参数，例如 Fusion Team 名称或文档名称。设置好表达式后，你可以通过选择
  Save as the user default 来保存它，这样下次创建 NC 程序以导出 G-code 时，就无需输入文件名，文件名将自动设置为日期和 Fusion
  360 文档名称的组合。




  ![](img/baa027bed101c08b496f1f420cee8a5b_341_0.png)


  图 11.16 – 如何在 NC Program 中利用表达式作为输入字段


  当您完成对后处理属性的自定义后，您所要做的就是选择 NC Program 对话框右下角的 Post 按钮。Fusion 360 然后会将 G-code 文件导出到您指定的位置，并使用您输入的文件名。图
  11.17 显示了此操作的输出，这是一个可读文本文件，扩展名为 .gcode。如果您使用原生文本编辑器应用程序（如 Notepad）打开此文件并向下滚动，就能找到第
  79 层的开始位置。如图 11.17 所示，暂停打印操作通过代码 M601 引入，同时还通过 M117 显示一条消息，文字为 Insert Bars。如果您在该
  3D 打印机上打印此 G-code，打印将进行到第 79 层，然后暂停，直到您按下旋钮。随后，您插入碳纤维棒。


  ![](img/baa027bed101c08b496f1f420cee8a5b_342_0.png)


  图 11.17 – 使用 NC Program 对话框发布的 G-code 可视化


  在本节中，我们介绍了如何使用 Fusion 360 生成 G-code 文件。我们展示了如何从 SIMULATE ADDITIVE TOOLPATH 对话框以及
  MANUFACTURE 工作区 ADDITIVE 选项卡中的 ACTIONS 面板访问后处理功能。我们介绍了 NC Program 对话框中可用的各种选项，用于将增材加工刀具路径转换为
  G-code 文件以便打印。我们还介绍了根据所选 3D 打印机在 NC Program 对话框中可用的各种后处理属性。


  ## Summary


  在本章中，我们学习了如何为 FFF 3D 打印机切片模型。切片是增材制造打印准备中的重要步骤，其在创建设置、定向零件、将它们排列在构建平台上并生成支撑结构之后进行。一旦零件切片完成，我们还可以模拟增材加工刀具路径。


  在本章中，我们学习了如何逐层生成和可视化增材加工刀具路径。我们回顾了 Fusion 360 为 FFF 打印机显示的各种打印统计数据，例如能源消耗、打印时间、材料使用量。凭借这些信息，我们可以按原样对增材加工刀具路径进行后处理并创建
  G-code 文件。我们还介绍了如何根据仿真结果和打印统计数据更改打印设置，从而使用更少的材料打印零件并降低能耗。


  在本章的最后一节中，我们学习了如何对增材加工刀具路径进行后处理并创建 G-code。在创建 G-code 时，我们还学习了如何对其进行自定义。通过这些自定义设置，我们学习了如何创建温度塔，以便确定使用特定耗材的打印温度。我们还学习了如何暂停打印以插入额外的物体，例如六角螺母、磁铁和加强杆。我们还学习了如何在打印过程中更换耗材，以便使用不同耗材颜色打印零件的不同部分。最后，我们学习了如何使用
  Fusion 文档中已有的参数来自动化 **NC Program** 对话框中的某些输入，例如文件名。使用所有这些技术，我们可以自信地从增材设置过渡到为 FFF
  打印机生成 G-code。


  定位和支撑金属 3D 打印机部件的许多基本原理与我们为 FFF 3D 打印所学的相似。然而，对于金属打印机，我们需要介绍一些特定于工艺的设置。在下一章中，我们将转换方向，介绍更多关于金属
  3D 打印的内容。

