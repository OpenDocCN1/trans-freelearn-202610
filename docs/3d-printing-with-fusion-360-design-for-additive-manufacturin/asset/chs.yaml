  一旦我们创建了新脚本，它将列在 Scripts and Add-Ins 对话框的 My Scripts 文件夹下。 图 14.21 显示了一个带有 Python
  图标的新脚本，后跟 FFF Setup，如标注 1 所指示。 选择此脚本后，按 Edit，如标注 2 所示。 此操作将启动 Visual Studio Code
  软件并允许我们编辑脚本。 我们可以选择脚本中的现有文本并将其替换，通过粘贴从 Fusion 360 在线文档中复制的增材制造 API 示例代码。


  ![](img/baa027bed101c08b496f1f420cee8a5b_424_1.png)


