  \ 2 章中详细介绍。\n- 打开 STL/OBJ 文件时，您没有机会设置单位或零件放置。\n\n总之，如果您尝试打开 STL 或 OBJ 文件，我不推荐此选项。但是，如果您打开\
  \ CAD 文件（例如 STEP 或 SAT）或 3MF 文件，这是一个快速简便的选项，您可能想要使用。不要忘记，如果您想在时间轴中存储编辑内容，请手动打开捕获设计历史记录，如图\
  \ 1.6 所示：\n\n![](img/baa027bed101c08b496f1f420cee8a5b_30_0.png)\n\n图 1.6 - 在执行文件\
  \ | 打开... 工作流程后，通过浏览器打开捕获设计历史记录\n\n打开 CAD 和网格文件时，另一个可用的选项位于 Fusion 360 的数据面板中。您可以选择位于界面左上角的“显示数据面板”图标来访问数据面板窗口，如图\
  \ 1.7 所示。\n\n![](img/baa027bed101c08b496f1f420cee8a5b_30_1.png)\n\n图 1.7 - 显示/隐藏数据面板\n\
  \n一旦数据面板可见，您可以导航到要上传设计数据的团队和项目。进入适当的项目后，您可以创建新文件夹以进一步组织您的设计和文档。一旦进入所需项目/文件夹位置，您可以使用图\
  \ 1.8 所示的上传按钮，并选择或将文件拖放到屏幕上的上传对话框中。两种选项都允许您将多个 CAD 或网格文件上传到指定的团队/项目/文件夹位置。请注意，每个上传的文件都将成为其自己的\
  \ Fusion 设计文档。\n\n![](img/baa027bed101c08b496f1f420cee8a5b_31_0.png)\n\n图 1.8 –\
  \ 使用数据面板将多个网格和 CAD 文档上传到 Fusion 360\n\n这是一种将多个 CAD 模型上传到 Fusion 360 的绝佳选择。然而，就像之前的选项一样，如果您想在时间轴中存储编辑内容，您必须打开捕获设计历史记录，如图\
  \ 1.6 所示。并且与之前的选项一样，我不推荐使用此方法打开 STL 或 OBJ 文件，因为它在导入过程中不会让您最初控制零件放置的单位。\n\n另一个鲜为人知但非常有用的选项基于\
  \ Fusion 360 移动应用程序。如果您有移动设备，您可以从相关应用商店下载 Fusion 360 应用，并可以浏览和上传存储在手机或平板电脑上的 CAD\
  \ 或网格文件，如图 1.9 所示：\n\n![](img/baa027bed101c08b496f1f420cee8a5b_32_0.png)\n\n图 1.9\
  \ – 在移动设备上上传 STL 文件到 Fusion Team 后的视图\n\n如果您在收到 CAD 或网格文件时没有计算机可用，此方法特别有用。在这种情况下，您可以快速将设计上传到您的\
  \ Fusion Team/项目/文件夹，以便您和您的团队成员可以立即开始处理设计。就像之前的方法一样，此方法也要求您在 Fusion 360 的浏览器中手动打开捕获设计历史记录，如果您想在时间轴中存储编辑内容，如图\
  \ 1.6 所示。\n\n> **重要提示**\n> \n> 如果您将 STL/OBJ 文件上传到 Fusion Team 或 Fusion 360 应用，在\
  \ Fusion 360 中打开后，您必须检查单位和网格体的位置，以确保其与原始设计意图相符。Fusion 在从没有单位的网格文件类型创建 Fusion 360\
  \ 设计文档时，使用厘米作为默认单位系统。\n> \n> 例如，假设一个 STL 文件代表直径为 10 毫米的球体。由于 STL 文件不包含单位数据，如果我们使用图\
  \ 1.8 所示的上传工作流程将此 STL 上传到 Fusion Team，则 resulting Fusion 360 设计文档将是一个直径为 10 厘米的球体。\n\
  \n现在我们已经了解了打开和上传 CAD 和网格文件的各种方法，是时候开始关注特定于网格体的\n\n## 插入网格工作流程（STL、OBJ 和 3MF 文件）\n\
  \n即使我们可以将网格文件上传到 Fusion Team 并在上传完成后直接在 Fusion 360 中打开它们，我在打开网格文件时个人更喜欢位于 **DESIGN**\
  \ 工作区 | **Mesh** 选项卡 | **CREATE** 面板中的 **Insert Mesh** 命令。使用 **Insert Mesh** 命令，您可以将一个或多个网格体插入到活动的\
  \ Fusion 360 设计中。您无需在插入网格文件之前将设计保存为 Fusion 360 文档。这是一个重要的区别，因为类似的工作流程用于插入所有 Fusion\
  \ 360 体/组件，该工作流程依赖于位于 **DESIGN | Solid, Surface, Mesh, Sheet Metal, and Plastic\
  \ | Insert Derive** 中的 **Insert Derive** 函数（如图 1.10 所示），要求在将外部引用的 Fusion 360 设计插入活动设计之前先保存\
  \ Fusion 360 设计：\n\n![](img/baa027bed101c08b496f1f420cee8a5b_33_0.png)\n\n图 1.10\
  \ – 插入网格与插入派生\n\n如果您插入单个网格（STL 或 OBJ）文件，您将在插入时有能力编辑该网格文件的位置和单位。如果您导入多个网格（STL 或 OBJ）文件，您在插入操作期间编辑的位置和单位数据将同时适用于您同时插入的所有文件。正因为如此，我更喜欢单独插入网格文件，以便我可以逐一目视检查它们并分别编辑它们的位置和单位，特别是如果我插入由不同设计师创建的网格文件，因为他们可能使用了不同的单位系统和坐标系统。\n\
  \n\n\n现在，让我们重点关注 **插入网格** 命令及其一些选项。对于本次练习，我们将插入 CLIP.STL 文件。启动 **插入网格** 命令并选择 STL\
  \ 文件后，您将看到 **插入网格** 对话框，其中包含更改单位和重新定位零件的选项。**翻转上方向** 按钮将零件绕 X 轴旋转 90 度。**居中** 按钮通过将插入网格的包围盒中心参照到活动组件的原点来移动插入的网格。**移至地面**\
  \ 按钮平移网格体，使其最低点接触地面平面。在图 1.11 中，地面平面是 *XY* 平面：\n\n![](img/baa027bed101c08b496f1f420cee8a5b_34_0.png)\n\
  \n图 1.11 – 插入网格 对话框\n\n除了对齐和接地网格体之外，我们还可以使用画布内的操纵器（箭头和旋转工具）或 **插入网格** 对话框内的数值输入部分来重新定位网格体，直到满意为止。我们始终可以使用\
  \ **重置** 按钮撤消操作。\n\n在本示例中，让我们首先使用 **居中** 命令，然后使用 **移至地面** 命令，并按下 **确定**。\n\n> **重要说明**\n\
  > 默认模型方向可在 Fusion 360 的 **首选项** 对话框的 **常规** 部分中设置。本书将对所有示例均采用 *Z 向上* 方向。\n> \n>\
  \ 每个新设计的默认单位可在 Fusion 360 的 **首选项** 对话框的 **默认单位** 部分的 **设计** 子部分中设置。本书将对所有新设计均采用毫米作为默认单位。\n\
  > \n> 设计历史的默认状态可在 Fusion 360 的 **首选项** 对话框的 **常规** 部分的 **设计** 子部分中设置。本书将对所有新设计均采用\
  \ **捕获设计历史**（参数化建模）。\n\n这些首选项均可在图 1.12 中看到：\n\n![](img/baa027bed101c08b496f1f420cee8a5b_35_0.png)\n\
  \n图 1.12 – Fusion 360 首选项对话框内的各个部分\n\n完成插入此 STL 文件后，我们将在时间线中留下添加的基础网格特征，并且位于 XY\
  \ 平面上的网格体将以原点为中心，如图 1.13 所示：\n\n![](img/baa027bed101c08b496f1f420cee8a5b_36_0.png)\n\
  \n图 1.13 – 插入网格 命令已完成\n\n与 `STL` 文件不同，`3MF` 和 `OBJ` 文件也可以包含颜色信息。现在，让我们使用相同的 **插入网格**\
  \ 命令将 `CLIP.3MF` 文件插入到新的设计文件中。在 Fusion 360 中，我们可以通过选择打开的 Fusion 设计文档列表右侧的 + 图标来创建新的设计文件。插入\
  \ 3MF 文件后，Fusion 360 会以每个面组独特的颜色显示网格体。面组通常是代表网格体上的特征或区域的面集合。此 3MF 文件由单个面组组成。因此，插入此文件到\
  \ Fusion 360 后，我们将在所有面上看到单一颜色。我们可以通过在 **检查** 面板中使用 **显示网格面组** 命令切换面组可视化，来可视化 3MF\
  \ 和 OBJ 文件中包含的颜色信息，如图 1.14 所示：\n\n![](img/baa027bed101c08b496f1f420cee8a5b_37_0.png)\n\
  \n图 1.14 – 3MF 和 OBJ 文件可以包含颜色\n\n## 重要说明\n\n如图所示 1.15 所示，必须在 Fusion 的首选项对话框 | 常规\
  \ 部分 | 材料 子部分中取消选中“应用不同的外观”复选框，才能使用前面所述的插入网格工作流程显示在 Fusion 360 中打开的 3MF 或 OBJ 文件中包含的颜色信息。\n\
  \n![](img/baa027bed101c08b496f1f420cee8a5b_37_1.png)\n\n图 1.15 – Fusion 360 首选项对话框中的材料子部分\n\
  \n在本节中，我们了解了插入 STL、OBJ 和 3MF 等网格文件的各种方法。我们还介绍了如何在插入工作流程中设置单位和重新定位网格体。此外，我们还介绍了如何可视化这些文件的颜色/纹理数据。\n\
  \n现在，是时候开始关注针对我们插入的网格体进行潜在问题检查和修复的特定工作流程了。在下一节中，我们将学习如何利用网格选项卡内的自动检查和修复功能，并开始探索在自动修复不足时如何手动修复网格体。\n\
  \n## 检查网格体并修复它们\n\nSTL 是一种简单的文件格式，在 3D 打印中被广泛使用。自 1987 年发明以来，几乎所有 2D 和 3D 设计软件都能够创建\
  \ STL 文件。由于其简单性、悠久的历史和广泛的可用性，现有的大多数 STL 文件都包含错误，通常需要在用于制造之前进行修复。\n\n在本节中，我们将学习如何检查插入\
  \ Fusion 360 的网格体，以及如何使用自动和手动修复技术修复损坏的 STL 文件，以便为 3D 打印做好准备。\n\n为了演示我们用于检查和修复网格体的各种方法，我们将使用名为\
  \ Clip_Broken.STL 的 STL 文件。让我们开始创建一个新的 Fusion 360 设计，如图 1.14 所示。\n\n现在，我们可以使用插入网格命令并将\
  \ Clip_broken.STL 文件插入到活动的 Fusion 360 设计文档中。就像上一个示例一样，让我们依次在插入网格对话框中使用居中和移至地面功能，将零件平移到更靠近原点并位于\
  \ XY 平面上方。现在，我们可以查看刚刚插入的网格体的详细信息。\n\nFusion 360 会自动检查所有插入的网格体，并在任何有问题的网格体旁边显示警告图标。如图\
  \ 1.16 所示，如果您在浏览器中展开主体列表，您将看到一个名为 Clip_Broken 的网格体，并在其旁边看到一个警告图标。如果将鼠标悬停在警告图标上，您将看到有关该网格体的以下信息：\n\
  \n- **网格未封闭。**\n- **网格未定向。**\n- **网格没有正体积。**\n\n当我们看到此类信息时，通常需要在继续 3D 打印文件之前采取修复措施：\n\
  \n![](img/baa027bed101c08b496f1f420cee8a5b_39_0.png)\n\n图 1.16 – 有问题的网格体旁边的警告图标\n\
  \n检查有问题的网格体的另一个有用工具是 **属性** 对话框。如果您选择一个网格体，右键单击并选择 **属性**，您可以看到有关该网格体的详细信息，如 *图\
  \ 1.17* 所示。\n\n在本示例中，您可以看到此网格体没有质量或体积，即使它已被自动分配了具有密度的物理材料（**钢**）。这也是该网格体未封闭体积的另一个迹象。请参考\
  \ *图 1.15*，其中显示了 Fusion 360 **首选项** 对话框中 **材料** 子部分内自动材料分配背后的逻辑。\n\n## 重要说明\n\n\
  在 3D 打印中，用于描述正确封闭体积的体的常用术语是 *水密*。在尝试 3D 打印物体时，具有水密体是理想的特性。然而，物体不是水密的并不意味着它不可 3D\
  \ 打印。在金属粉末床熔融 3D 打印中，支撑结构通常由表面（而非水密体）组成。我们将在 *第 12 章* 中更详细地介绍这一主题。\n\n如果您展开 **网格**\
  \ 子标题，您将看到此网格体有两个壳。壳是由相互连接的三角形（有时是四边形）的集合。如果网格体由多个壳组成，通常表明构成网格体的三角形的连续性已断裂。\n\n\
  有时，网格体可以有多个壳仍然有效。例如，想象一个空心球。在这种情况下，您将有一个代表球体外部的壳，另一个代表内部边界的壳。\n\n如果您展开网格分析子部分，您将看到此网格体未封闭、未定向且没有正体积：\n\
  \n![](img/baa027bed101c08b496f1f420cee8a5b_40_0.png)\n\n图 1.17 – 属性 对话框显示相关的网格分析信息\n\
  \n现在我们明白我们手头有一个有问题的网格体，我们可以关闭属性对话框，并在网格选项卡 | 准备 面板的功能区中选择修复图标。\n\nFusion 360 有四种自动修复类型。让我们首先选择关闭孔洞修复类型，该类型可修复翻转的三角形并关闭孔洞。如果我们在修复对话框中激活预览复选框并展开详细分析，我们可以编辑滑块以查看所选修复类型对我们希望修复的体的影响。图\
  \ 1.18 显示此修复类型将自动修复零件，使其可用于 3D 打印，但对结果进行目视检查看起来杂乱无章，许多三角形相互重叠。\n\n\n\n![](img/baa027bed101c08b496f1f420cee8a5b_41_0.png)\n\
  \n图 1.18 – 关闭孔洞修复类型及其对该部件的影响\n\n即使这次自动修复的结果被报告为成功，始终建议进行目视检查并查看网格体属性的详细信息。图 1.19\
  \ 显示了执行 Close Holes 修复类型后 Clip_Broken 网格体的 **PROPERTIES** 对话框。这里可以看到，该网格由 66 个壳组成。这是一个意外的结果，部件的目视检查显示出有问题的区域，如红色椭圆所示。该部件沿\
  \ XZ 平面对称，但自动修复关闭了一个孔，而不是创建期望的沉头孔类型结果：\n\n![](img/baa027bed101c08b496f1f420cee8a5b_42_0.png)\n\
  \n图 1.19 – **PROPERTIES** 对话框显示修复后网格体的结果\n\n现在，让我们使用 Edit Feature 命令对刚刚执行的修复操作进行编辑，通过从\
  \ Fusion 360 用户界面底部的时间轴中选择它并右键单击它，如图 1.20 所示。这次，我们可以将修复类型更改为 Stitch and Remove。此修复操作包括先前修复类型执行的所有修复，并且\
  \ stitch triangles 会移除重复三角形、退化面以及微小壳。使用此修复类型需要稍长的时间，但结果看起来好得多。如图 1.20 所示，我们不再看到大红色椭圆突出显示区域中杂乱的网格。然而，我们仍然存在沉头孔期望结果缺失的相同问题：\n\
  \n![](img/baa027bed101c08b496f1f420cee8a5b_43_0.png)\n\n图 1.20 – Stitch and Remove\
  \ 修复类型及其对该部件的影响\n\n在进入下一个修复类型之前，让我们通过添加一个 **section analysis** 更仔细地查看我们的部件。要添加剖面分析，必须使用位于\
  \ **INSPECT** 面板中的 **Section Analysis** 命令。在选择切割平面为 XZ 平面并翻转我们想要剖切的段后，我们可以很容易地看到该网格代表一个被掏空的对象，如图\
  \ 1.21 所示。通过剖面分析查看我们的部件，可以更好地理解为什么我们在 **PROPERTIES** 对话框中看到壳计数为二：\n\n![](img/baa027bed101c08b496f1f420cee8a5b_43_1.png)\n\
  \n图 1.21 – 剖面分析显示该网格体是一个空心物体\n\n当剖面分析可见时，如浏览器中 **Section1** 旁边的灰色眼睛图标所示，我们可以从时间轴编辑我们的修复并使用第三种修复类型，称为\
  \ **Wrap**。此修复类型与 **Stitch and Remove** 做出相同的修复并包裹网格体的表面，移除所有内部结构。如 *图 1.22* 所示，此修复类型的结果移除了部件内部的次级壳，使我们的实体成为一个实心物体。在本例中，我们的目标并不是对该部件做出如此大的改变。因此，我们将再编辑一次修复，然后进入\
  \ *第四* 个选项。然而，在某些情况下内部壳也需要进行重大修复，此修复类型可以轻松移除属于内部壳的三角形，从而加快网格修复步骤：\n\n![](img/baa027bed101c08b496f1f420cee8a5b_44_0.png)\n\
  \n图 1.22 – Wrap 修复类型及其对该部件的影响，带剖面分析视图\n\n第四种也是最后一种修复类型称为 **Rebuild**。有多种重建类型可用，在\
  \ *图 1.23* 中，你可以看到使用平均网格密度的快速重建类型的结果。此修复类型重建网格体，并且根据你的密度输入是最慢的修复类型。它可作为自动修复部件时的最后手段。然而，该修复类型的网格结果具有较高的三角形数量，并且该修复类型在捕捉尖锐边缘周围细节方面做得不太理想。\n\
  \n![](img/baa027bed101c08b496f1f420cee8a5b_45_0.png)\n\n图 1.23 – Rebuild 修复类型及其对该部件的影响，带剖面分析视图\n\
  \n现在我们已经涵盖了全部四种修复类型，让我们编辑一个修复操作，重新使用 **Stitch and Remove** 修复类型，因为其结果对该部件来说是最理想的。该修复类型也是\
  \ Fusion 360 推荐的默认修复类型。\n\n没有任何修复类型能够检测并修复沉头孔周围缺失的表面。看起来我们必须执行一些手动网格编辑操作来修复此问题。让我们首先使用位于\
  \ **MODIFY** 面板中的 **Plane Cut** 功能将部件切成两半。**Clip_Broken** 网格体是我们将选择的切割对象，切割平面将是\
  \ **XZ** 平面。我们将使用 **Trim** 类型移除不需要的部分，并使用 **Minimal** 填充类型将剩余的网格体变为密封对象。\n\n![](img/baa027bed101c08b496f1f420cee8a5b_46_0.png)\n\
  \n图 1.24 – 使用 Plane Cut 工具修剪网格体\n\n一旦我们将网格体切成两半，我们必须从网格体创建一个组件以便镜像它。图 1.25 显示了如何从修剪后的网格体创建组件——通过在浏览器中右键单击它并选择\
  \ Create Components from Bodies 选项。\n\n![](img/baa027bed101c08b496f1f420cee8a5b_46_1.png)\n\
  \n图 1.25 – 从修剪后的网格体创建新组件\n\n一旦有了组件，我们可以切换到 SOLID 选项卡。我们可以从 CREATE 面板下选择 Mirror 命令。一旦\
  \ MIRROR 对话框可见，我们必须将对象类型更改为 Components 并选择新创建的组件进行镜像。我们的镜像平面再次为 XZ 平面。镜像操作的结果可在图\
  \ 1.26 中看到：\n\n![](img/baa027bed101c08b496f1f420cee8a5b_47_0.png)\n\n图 1.26 – 镜像组件\n\
  \n镜像组件后，我们将得到两个组件中的两个网格体。是时候将它们合并为单个统一组件了。为此，让我们返回到 MESH 选项卡并使用 MODIFY 面板中的 combine\
  \ 命令。我们必须选择目标体和工具体，即来自两个组件的 Clip_Broken 网格体。我们将使用 join 操作，创建新组件并保留工具。这将确保如果需要，我们将来可以轻松比较结果和输入。图\
  \ 1.27 显示了将两个网格体合并以制作新组件所需的输入：\n\n![](img/baa027bed101c08b496f1f420cee8a5b_48_0.png)\n\
  \n图 1.27 – 合并网格体以制作新组件\n\n合并操作的结果是在浏览器中名为 Component3 的新组件中的完全修复的实体。图 1.28 显示了此新组件，同时隐藏了剖面分析以及第一个和第二个组件：\n\
  \n![](img/baa027bed101c08b496f1f420cee8a5b_48_1.png)\n\n图 1.28 – Component3，一个完全修复的网格\n\
  \n如果我们打开剖面分析的可见性，我们可以快速看到我们修复的网格体仍然具有中空横截面并且可以进行 3D 打印，如图 1.29 所示：\n\n![](img/baa027bed101c08b496f1f420cee8a5b_49_0.png)\n\
  \n图 1.29 – 修复后网格体的剖面分析视图\n\n作为最后的 sanity 检查，查看修复后网格体的属性始终是一个好主意，以确保我们拥有闭合且定向的网格且具有正体积。我们所有操作的时间线都记录在浏览器左下角的设计历史中，如图\
  \ 1.30 所示。你可以随时重放这些步骤，提醒自己是如何修复此网格的。\n\n![](img/baa027bed101c08b496f1f420cee8a5b_50_0.png)\n\
  \n图 1.30 – 修复后网格的属性和修复操作时间线\n\n本章的 Git 仓库还包含一个名为 Clip_fixed.f3d 的 Fusion 360 文件，你可以直接在\
  \ Fusion 360 中打开它以重放时间线，如果你在本示例中遇到任何问题。\n\n## Summary\n\n在本章中，我们了解了在 Fusion 360\
  \ 中打开 CAD 和网格文件的各种方式，范围从使用 **File | Open...** 工作流程到从网页浏览器或 Fusion 360 桌面和移动应用程序将文件上传到\
  \ Fusion Team。\n\n我们还介绍了如何将网格文件插入活动设计中，如何设置单位，以及如何定位这些部件。我们强调了如何渲染和着色某些网格文件包含的数据。我们讨论了如何检查有问题的网格体。我们还通过一个示例介绍了使用自动和手动修复步骤，例如修剪网格体和镜像组件，以完全修复严重损坏的网格文件。\n\
  \n\n\n利用本章学到的技能，你现在可以自信地打开、检查和修复大多数使用 Fusion 360 的网格文件。\n\n在下一章中，我们将介绍为什么以及如何选择参数化建模与直接建模。我们还将介绍如何自动检测导入到\
  \ Fusion 360 的模型特征，以及如何根据增材制造设计原则编辑这些特征。\n"
- '## 秉持 DFAM 原则编辑 CAD/网格文件


  欢迎阅读 *第 2 章*。本章将介绍如何在秉持各种 **增材制造设计** (**DFAM**) 原则的前提下编辑 CAD/网格模型。我们将首先介绍如何开关设计历史。我们将演示使用参数化建模与直接建模时的流程差异。然后，我们将演示如何自动检测导入的
  CAD 模型的特征。随后，我们将介绍如何基于 DFAM 原则编辑 CAD 和网格体。最后，我们将展示如何将网格文件转换为可进一步用于制造修改的实体。


  本章将涵盖以下主题：


  - 使用 Fusion 360 的设计历史介绍

  - 识别 CAD 特征并编辑它们

  - 在 Fusion 360 中原生处理网格文件


  到本章结束时，你将学会如何在 Fusion 360 中使用参数化和直接建模工作流程处理模型。你将能够自动识别 CAD 特征并编辑它们。你还将了解如何使用增材制造设计原则编辑从其他来源导入的
  CAD/网格几何体。


  ### 技术要求


  本章涵盖的大多数主题适用于 Fusion 360 的所有许可级别（个人/爱好、初创企业、教育和商业）。然而，本书还将介绍个人/爱好使用许可不可用的高级功能。此类高级功能将根据情况标识为
  *不适用于个人使用且需要扩展访问*。


  本章的练习文件可在以下位置找到： https://github.com/PacktPublishing/3D-Printing-with-Fusion-360.


  ### 使用 Fusion 360 了解设计历史


  在第 1 章中，我们简要介绍了 Fusion 360 如何捕获模型更改的设计历史。在本章中，我们将更深入地探讨这一主题，并展示捕获设计历史（参数化建模）与不捕获设计历史（直接建模）的利弊。


  在 Fusion 360 的上下文中，参数化建模是一种基于特征和约束的方法。你添加到模型中的所有特征都会随时间被记录，任何对特定特征的更改都会在时间线中向下传播并影响后续特征，最终影响设计的最终结果。这使得参数化建模成为基于规则创建设计替代方案的强大工具。


  相比之下，直接建模是一种你添加到模型中的特征并非全部存储或可编辑的方法。直接建模特征的子集可以编辑。然而，这些特征不会与你在编辑的特征之前或之后添加的任何特征交互。这使得直接建模成为快速对设计进行大幅更改的非常灵活的工具。使用直接建模，你不必担心由于
  CAD 软件中模型的原始设计方式而可能导致的问题。


  在生成新设计时，Fusion 360 依赖于首选项对话框中设计历史选项中指定的设置，如图 2.1 所示，以确定设计将使用参数化建模还是直接建模方法。


  ![](img/baa027bed101c08b496f1f420cee8a5b_54_0.png)


  图 2.1 – Fusion 360 捕获设计历史的偏好设置


  在处理现有的 Fusion 360 设计时，我们也可以随时改变主意，在任何时间使用直接建模代替参数化建模。我们有两种方法可以从参数化建模切换到直接建模。第一种切换方式是右键单击浏览器中的第一个项目并选择
  **不捕获设计历史**。第二种切换方式是选择 Fusion 360 时间线右上角的齿轮图标，然后从可用选项列表中选择 **不捕获设计历史**。这两种方法均显示在图
  2.2 中。


  **重要提示**

  如果你不小心从参数化建模切换到直接建模，你始终可以撤销操作（Ctrl + Z）并恢复时间线。


  ![](img/baa027bed101c08b496f1f420cee8a5b_55_0.png)


  图 2.2 – 将参数化模型更改为直接模型


  无论你使用哪种方法，从参数化建模切换到直接建模时，你的特征时间线将被丢失，时间线栏将不可见，并且你将失去用于创建设计的特征之间的约束和引用。图 2.3 显示了从参数化建模切换到直接建模的影响。请注意左侧图底部有一个时间线栏。时间线栏显示了使用参数化建模方法创建此零件的方式。所有列出的特征都具有生成时使用的尺寸和引用。


  ![](img/baa027bed101c08b496f1f420cee8a5b_56_0.png)


  图 2.3 – 从参数化建模切换到直接建模的影响


  切换到直接建模方法后，时间线栏丢失。模型现在有一系列可选择的特征；其中一些（例如 **倒角** 和 **孔**）甚至可编辑。然而，如果你编辑此类特征，你会发现引用不会与特征一起保存。每次后续编辑时，你都可以重新定义这些引用。换句话说，特征不受约束，即使在明确定义后也可以自由移动。


  ### 参数化建模


  Fusion 360 有几个功能组件只有在参数化建模模式下才可访问。最明显的是你可以定义、使用和编辑控制特征输入的参数。*图 2.4* 显示了命名和用户定义的参数列表如何用于此模型的创建。如果你对组件和/或装配进行大幅更改，可能需要使用
  **全部计算** 命令来解决时间线中的任何问题。就像 **更改参数** 命令一样，**全部计算** 命令也只有在参数化建模范式下工作时才可用。两个命令都可以在
  **修改** 面板中找到，如 *图 2.4* 所示。


  ![](img/baa027bed101c08b496f1f420cee8a5b_57_0.png)


  图 2.4 – 更改参数、全部计算和自动化建模命令


  另一个属于 Fusion 360 参数化建模工具集独有的关键功能是 **自动化建模**，位于 **自动化** 选项卡中，如 *图 2.4* 所示。**自动化建模**
  将 Fusion 360 设计中的不连续面连接起来并创建多个可供选择的替代体/组件。我们将在 *第 3 章* 中详细介绍 **自动化建模**。


  有三个简化功能（**简化**、**移除面** 和 **替换为基本体**），你只能在参数化建模模式下使用。但在直接建模模式下，你可以使用替代命令来实现类似结果。在参数化建模中，你可以从
  **修改** 面板 | **简化** 滑出菜单中访问这三个功能，如 *图 2.5* 所示。


  ![](img/baa027bed101c08b496f1f420cee8a5b_58_0.png)


  图 2.5 – 参数化建模方法可用的简化功能


  与大多数其他参数化建模功能不同，这三个功能一旦使用就不可编辑。如果你使用它们，就必须回滚时间线或从时间线中删除该特征以撤销其效果，如图 2.6 所示：


  ![](img/baa027bed101c08b496f1f420cee8a5b_58_1.png)


  图 2.6 – 删除被草图引用的替换为基本体特征




  每当你在参数化建模模式下并在时间线的中间删除特征（或实体或组件）时，就有破坏时间线连续性的风险。如果你删除时间线中被其他项目作为引用使用的项目，你将留下缺失引用警告。在图
  2.7 所示的示例中，一旦 **Replace with Primitives** 特征从时间线中删除，我们就会在 **Sketch** 特征的时间线图标上看到黄色高亮，该特征使用了现在已删除的简化原始体的顶面。


  ![](img/baa027bed101c08b496f1f420cee8a5b_59_0.png)


  图 2.7 – 删除被引用的特征后时间线中的引用失败警告


  拥有带有引用失败警告信息的组件通常不是理想的结果，因为我们可能无法重放时间线或有效计算所有更改。具有此类警告的特征需要额外的工作来重新建立丢失的引用。因此，你可能选择完全避免使用这三个特征。如图
  2.8 所示，你可以在 Fusion 360 的 **Preferences** 中禁用 **Arrange and Simplify tools**，方法是导航到
  **General** 下拉菜单 | **Design** 子部分。


  ![](img/baa027bed101c08b496f1f420cee8a5b_60_0.png)


  图 2.8 – 在 Fusion 360 的首选项中启用/禁用简化工具


  正如我们刚才所说明的，在参数化建模模式下使用 Delete 命令可能会产生不可预见的后果。你可以使用两种替代 Delete 命令的方法来消除实体中不需要的特征。它们是
  Suppress Features 命令和 Remove 命令。两者都独特于参数化建模，并且是我个人在不破坏时间线的情况下从 Fusion 360 设计文档中排除特征和模型的首选方式。


  如图 2.9 所示，Remove 命令会消除实体和组件，可以通过选择其输入并使用右键菜单访问。图 2.9 还显示了 Suppress Features 命令，该命令允许我们从模型中排除特征，可以通过从时间线中选择其输入并使用右键菜单访问。


  ![](img/baa027bed101c08b496f1f420cee8a5b_61_0.png)


  图 2.9 – Remove 命令和 Suppress Features


  参数化建模的最终独特功能集需要访问 Product Design 扩展。Fusion 360 为试用用户、教育用户、初创用户和商业用户提供多个扩展。扩展不可用于免费、个人或业余爱好用户。根据你的订阅类型，你可以在
  Extensions 对话框中获得对扩展的访问权限，如图 2.10 所示。


  ![](img/baa027bed101c08b496f1f420cee8a5b_61_1.png)


  图 2.10 – Extensions 对话框和 Product Design 扩展访问


  一旦你获得对 **Product Design** 扩展的访问权限，你就可以在塑料选项卡的设置面板中为组件分配和编辑塑料规则。如 *图 2.11* 所示，为给定组件分配塑料规则会自动在
  Fusion 360 的参数表中添加一些参数，这些参数控制诸如 **Thickness**、**Draft Angle**、**Nominal Radius**
  和 **Knife Edge Threshold** 等设置。


  ![](img/baa027bed101c08b496f1f420cee8a5b_62_0.png)


  图 2.11 – 为组件分配塑料规则


  在为给定组件分配塑料规则后，你添加到该组件的任何塑料特征都会自动利用塑料规则设置的参数。在 *图 2.12* 中，我们可以看到带有添加的肋的我们设计的壳版本。**Web**
  特征并不独特于参数化建模。但它目前正在使用名为 **Feature Values** 的预设，该预设会自动分配名为 **T** 的参数用于 **thickness**
  和 **DA** 用于 **draft angle**。它还使用基于厚度参数的方程来计算倒圆半径。所有这些参数和特征预设都基于我们在上一步中分配的塑料规则。因此，这些建模技术都依赖于使用参数化建模方法。


  ![](img/baa027bed101c08b496f1f420cee8a5b_63_0.png)


  图 2.12 – 使用塑料规则创建/编辑 Web 特征


  我想要重点介绍的最终特征是独特于参数化建模方法的 **Geometric Pattern**。你可以从 **CREATE | Pattern** 滑出菜单访问
  **Geometric Pattern**。图 2.13 显示了将几何图案应用于模型上的面的结果。使用此功能，你可以轻松地参数化创建建模表面纹理。就像塑料规则和特征预设一样，**Geometric
  Pattern** 也需要访问 Product Design 扩展。


  ![](img/baa027bed101c08b496f1f420cee8a5b_63_1.png)


  图 2.13 – 创建/编辑几何图案


  ## 直接建模


  Fusion 360 有几个功能部件只有在你处于直接建模模式时才可访问。其中一些功能特定于处理网格实体。一些与处理实体和曲面实体相关，一些与在装配中处理组件相关。


  让我们开始介绍网格特定功能。第一个特定于直接建模的网格功能是 **CREATE FACE GROUP**，位于 **MESH** 选项卡 | **PREPARE**
  面板下。使用 **CREATE FACE GROUP**，你可以选择单个三角形或一组三角形并将它们分配给新的面组。创建面组对于在增材制造工作流程中下游选择它们以创建支撑结构或尝试将网格实体转换为实体对象时至关重要。即使
  Fusion 360 具有自动生成面组的工具，在处理复杂的插入网格时，对创建面组进行手动控制仍然是一项重要的功能。你可以将此功能用作直接建模的一部分。


  > **重要说明**

  > 在参数化建模中，你需要利用 **DIRECT EDIT** 功能才能手动创建面组。我们在本小节中强调的所有网格特定功能都可以通过在参数化建模中引入相同的直接编辑功能来访问。


  下一个特定于直接建模的网格特定功能是 **ERASE AND FILL**。此命令位于 **MODIFY** 面板下，允许你删除并替换网格实体上的一个或多个面，以手动填充孔洞和修复区域。使用此命令时，我还建议打开
  **MESH SELECTION PALETTE**，以便你可以使用不同的选择类型，例如画笔或自由形式选择。如果你使用油漆选择，你还可以控制刷子大小。**Mesh
  Palette** 可从 **SELECT** 面板访问，如 *图 2.14* 所示。


  ![](img/baa027bed101c08b496f1f420cee8a5b_65_0.png)


  图 2.14 – 网格选择调色板和网格选择工具


  现在，让我们开始关注特定于实体和曲面实体且独特于直接建模的特征。我们将重点介绍的第一个特征通常适用于使用面片方法从网格实体转换而来的实体和曲面实体。我们将在本章后面讨论在
  Fusion 360 中原生处理网格文件时介绍如何将网格实体转换为实体实体。一旦网格实体使用面片方法转换为实体实体，它将具有大量曲面，这将使设计难以处理，因为其文件大小和模型复杂性。通常，最好简化此类模型，以便进一步编辑它们或在装配中使用它们。在这种情况下，我们可以依赖
  MERGE 功能，该功能位于 SURFACE 选项卡 | MODIFY 下拉菜单中。此功能将允许你将实体或曲面实体内的两个或多个面合并为单个面。如果激活 Select
  Chain 复选框，你只需双击单个面，Fusion 360 就会自动选择与你选择的面相连且共面的所有面，如图 2.15 所示。




  ![](img/baa027bed101c08b496f1f420cee8a5b_66_0.png)


  图 2.15 – 合并平面面以创建单个面


  在 **MERGE** 对话框中按下 **OK** 后，所有选定的分面面将被替换为单个面，从而降低模型复杂度和文件大小。然而，需要注意的是，如果你选择多个不共面的面，例如构成倒圆角的面，结果将是一个面，它并不是对预期特征的真实表示，而更像是所需结果的波浪状版本。如
  *图 2.16* 所示，你可以使用各种检查工具，例如 **Zebra Analysis**，轻松地双重检查 **MERGE** 特征的结果。该工具显示光线如何反射离开给定表面，以显示给定表面上的曲率变化。在
  *图 2.16* 中，你可以轻松看到左侧原始 CAD 实体模型上的条纹与右侧分面版本上的条纹之间的差异，后者利用 **MERGE** 特征将倒圆角周围的多个面合并为一个。


  ![](img/baa027bed101c08b496f1f420cee8a5b_67_0.png)


  图 2.16 – 使用斑马纹分析检查合并的面


  下一个我们将重点介绍的特征是 **Fluid Volume**。此命令以及我们接下来将介绍的 **Find Features** 命令位于 **SOLID**
  选项卡 | **CREATE** 面板中，如 *图 2.17* 所示。


  ![](img/baa027bed101c08b496f1f420cee8a5b_67_1.png)


  图 2.17 – 查找特征和流体体积命令


  你可以根据正在处理的实体体的类型创建内部或外部流体体积。图 2.18 显示了如何为棋子创建外部体积。创建外部流体体积后，如果你使用剖面分析检查模型，你会注意到新创建的外部体积包围着国际象棋兵，并且不会干扰导入的
  CAD 实体。使用此技术，你可以快速创建可用于 3D 打印模具的模型。你可以使用此新创建的组件作为创建型芯的起点。在此示例中，期望的结果是国际象棋兵。因此，我们首先创建型腔。稍后，我们可以根据模具的分离方式将此新组件一分为二。在
  3D 打印之前，我们可以稍后添加浇口杯和浇道。第 2 章的 GitHub 仓库包含一个 CHESSPAWN.STEP 文件，供你尝试使用此直接建模功能。还提供了带有两个带连接销的拔模、浇口杯和浇道的模具的成品版本（CHESSPAWNMOLD.STEP）。


  ![](img/baa027bed101c08b496f1f420cee8a5b_68_0.png)


  图 2.18 – 为组件创建外部流体体积


  在某些情况下，我们可能拥有模具本身的 CAD 文件，并希望逆向工程零件并进行更改，以确保其符合我们的要求，例如尺寸或美观。在这种情况下，我们可以轻松使用 Fluid
  Volume 工具并创建内部体积。图 2.19 显示了如何为具有两个实体拔模且封盖表面位于浇口杯顶部的模具创建内部流体体积。


  ![](img/baa027bed101c08b496f1f420cee8a5b_69_0.png)


  图 2.19 – 为组件创建内部流体体积


  请注意，在这种情况下，你将得到一个包含七个体的新组件。Fluid Volume 命令中的内部体积选项会填充所有可能的空腔，包括销钉和孔之间的公差。如果你不需要那些额外的实体，可以选择、右键单击并删除它们，如图
  2.20 的左半部分所示。同样，使用矩形选择工具，你可以选择构成浇口杯和浇道的所有表面，右键单击并删除它们，如图 2.20 的右侧所示。


  ![](img/baa027bed101c08b496f1f420cee8a5b_69_1.png)


  ![](img/baa027bed101c08b496f1f420cee8a5b_69_2.png)


  图 2.20 – 选择并删除实体和面


  ## 重要说明


  你可能已经注意到，使用直接建模可以创建的外部流体体积与我们在与参数化建模相关的上一小节中介绍的 simplify 命令之间的相似性。这两个特征之间的底层功能是相同的。然而，正如之前讨论的那样，SIMPLIFY
  特征并非完全参数化，因此在参数化建模中使用时可能会出现问题。


  下一个功能是直接建模在处理导入的 CAD 几何体时独有的功能，也是我在 Fusion 360 中最喜欢的功能之一。它被称为 FIND FEATURES，位于 SOLID
  选项卡 | CREATE 面板中。它允许你选择面、实体或组件并自动识别关键特征，例如倒圆角、孔、倒角和阵列。使用 find features 命令并识别出关键特征（例如倒圆角）后，它将以其指定名称显示在
  Fusion 360 的浏览器中。你将能够选择该特征，右键单击并编辑它。根据特征的位置，你可以轻松更改给定特征的尺寸或完全删除它。我们将在下一节介绍如何更有效地使用此命令。


  直接建模顾名思义并不是创建和编辑几何体的参数化方法。许多建模工具，例如倒圆角、孔和阵列，在创建与编辑期间的行为不同。你添加到实体模型上的任何特征都使用与参数化建模中的对应功能完全相同的用户界面。倒圆角特征是这一点的绝佳示例。在图
  2.21 中，我们展示了将倒圆角应用于多个边的过程。


  ![](img/baa027bed101c08b496f1f420cee8a5b_70_0.png)


  图 2.21 – 在直接建模中创建倒圆角特征


  添加特征后，我们可以编辑该特征。然而，如图 2.22 所示，**EDIT FILLET** 对话框与创建对话框非常不同，并且选项有限。创建与编辑之间的这种差异既是直接建模的超能力，也是其阿喀琉斯之踵，具体取决于你希望如何建模与如何编辑模型。


  ![](img/baa027bed101c08b496f1f420cee8a5b_71_0.png)


  图 2.22 – 在直接建模中编辑倒圆角特征


  我想要为直接建模重点介绍的最后一组特征与在装配上下文中处理组件有关。在装配建模中，我们希望复制给定组件并粘贴以制作副本，以便我们可以 3D 打印相同零件的多个副本。我们可以使用多种方法复制组件。我们可以通过右键单击组件并选择
  **Copy** 命令来选择组件，然后重复该过程并选择 **Paste** 命令。我们可以使用多个 **Pattern** 工具之一创建所选组件的多个实例。或者，我们可以简单地从数据面板将给定组件多次插入到现有设计中。如果我们使用直接建模，我们可以使复制的组件成为独立的。为此，选择其中一个副本，右键单击它并选择
  **Make Independent**，如图 2.23 所示。


  ![](img/baa027bed101c08b496f1f420cee8a5b_72_0.png)


  图 2.23 – 使复制的组件与其父组件独立


  通过切断其与源组件的链接并使其独立，我们对原始组件所做的任何更改都不会传播到副本。同样，我们对复制组件所做的任何更改都不会影响原始组件。


  在参数化建模中，如果你想实现类似的结果，只能使用复制组件粘贴新组件选项。或者，你可以在将组件插入设计后使用 Break Link 选项，如图 2.24 所示。使用位于
  SOLID 选项卡 | CREATE 面板 | PATTERN 弹出菜单中的三种阵列方法之一（矩形阵列、沿路径阵列或圆形阵列）复制组件后，没有使其组件独立的方法：


  ![](img/baa027bed101c08b496f1f420cee8a5b_73_0.png)


  图 2.24 – 断开插入组件的链接


  在本节中，我们介绍了如何使用直接建模以及参数化建模。我们强调了参数化建模和直接建模各自独有的各种功能。我们还强调了这些独特功能与其对应功能之间的一些相似之处。在下一节中，我们将更详细地研究识别
  CAD 特征并编辑它们，这是在本节中介绍的直接建模的独特功能。


  ## 识别 CAD 特征并编辑它们


  前一节中，我们简要介绍了 find features 命令，这是直接建模独有的功能。在本节中，我们将更深入地探讨这一功能并突出其优势和不足。我们还将利用该功能配合示例数据集，以便根据
  DFAM 原则编辑我们导入的 CAD 文件。


  随着 3D 打印变得越来越主流，我们需要类别来指代基于其类别的特定 3D 打印机组。在撰写本文时，增材制造有七个类别：


  - 材料挤出

  - 液槽光聚合

  - 黏结剂喷射

  - 材料喷射

  - 粉末床熔融

  - 直接能量沉积

  - 薄片层压


  存在多种材料挤出方法，但可能最常见的是 **熔融长丝制造 (FFF)**。随着 3D 打印的一些早期专利在 2002 年后开始到期，FFF 技术正在经历民主化。如今，任何人都可以从常见的购物网站（如
  www.amazon.com）购买用于家庭使用的 FFF 3D 打印机。液槽光聚合技术也经历了类似的民主化过程。我们现在可以购买 **立体光刻 (SLA)/数字光处理
  (DLP)** 3D 打印机用于家庭使用。


  然而，即使粉末床熔融技术周围的一些早期专利在 2016 年左右开始到期，粉末床熔融 3D 打印机仍未针对家庭使用进行制造或营销。这种情况可能会继续存在，因为粉末床熔融技术要求用户拥有更大的操作空间，并且根据打印材料的种类需要更好的通风和防火安全措施。此外，由于粉末床熔融涉及使用粉末，材料的小颗粒在后处理过程中可能构成安全隐患，并且需要额外的
  **个人防护装备 (PPE)**。


  无论我们选择哪种硬件进行 3D 打印，如果我们想增材制造我们的设计，就必须遵循几项准则和设计规则。这些规则不是一成不变的，会根据各种参数而变化。它们可能会根据我们将使用的
  3D 打印机类型、我们将使用的打印材料类型，甚至制造商或特定打印机而变化。为了有效利用本章中学到的信息，您需要知道您正在为哪种 3D 打印类别/打印机设计。有多个资源列出了
  3D 打印的常用设计规则。Hubs.com 就是其中一个可利用的资源。图 2.25 显示了 https://www.hubs.com/get/3d-printing-design-rules/
  上发布的 3D 打印设计规则。


  ## 3D 打印设计规则


