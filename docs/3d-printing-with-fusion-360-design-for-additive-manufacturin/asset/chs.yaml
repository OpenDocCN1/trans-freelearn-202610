  如果我们对零件应用截面分析，我们可以轻松可视化掏空物体和零件腔体内的晶格的结果，如图 4.41 所示。使用此方法，我们可以通过使用前面讨论过的实体建模技术添加必要的排水孔来完成零件：


  ![](img/baa027bed101c08b496f1f420cee8a5b_159_1.png)


  图 4.41 – 掏空盒子和内部晶格的截面视图


  将晶格创建为实体对象非常有益，因为我们在参数化建模中作为实体几何建模的设计可以稍后根据需要轻松编辑。实体晶格也可以导出为 CAD 文件，例如 STEP、SAT
  和 IGES。此外，如果您想模拟具有晶格结构的零件的性能，Fusion 360 只能在我们的模型由实体组成时执行此类模拟。体积晶格无法使用 Fusion 360
  进行模拟。然而，创建实体晶格需要大量计算资源并且可能很麻烦。使用 **体积晶格** 对话框为给定零件创建晶格和壳化更为直接，并且可以有效地用于 3D 打印零件，如果我们不需要模拟它们，这通常是使用树脂打印制造原型零件的情况。


  ## Summary


  在本章中，我们介绍了如何使用实体建模、网格建模和体积建模技术掏空实体体和网格体。我们演示了掏空实体体的两种方法。第一种方法是通过选择一个或多个面并从实体对象中移除这些面，以创建剩余体的外壳。第二种方法我们只是简单地掏空了实体体的内部。我们强调了如何通过更改可视化以及添加截面分析来可视化掏空实体体的影响。


  本章后面，我们强调了如何向壳化物体添加排水孔以去除 3D 打印时 trapped 的粉末或树脂。我们解释了排水孔的大小和位置以及所需的排水孔数量如何取决于 3D
  打印技术。我们演示了如何为 **立体光刻 (SLA)** 和 **数字光处理 (DLP)** 打印机添加排水孔以去除未固化树脂。我们介绍了根据树脂粘度和 3D
  打印技术所需的不同尺寸排水孔。我们还强调了排水孔的放置位置，以便我们能有效去除树脂并消除杯状效应，这可能导致打印过程中零件失效。我们还提到了排水孔的放置如何取决于
  3D 打印的零件方向。


  我们通过展示如何向零件添加体积晶格和实体晶格结束了本章。我们想要掏空体的主要原因之一是使其轻量化并在 3D 打印过程中节省材料和能源。然而，并非所有技术都能在不需要支撑结构的情况下
  3D 打印空心物体。在本章的最后一小节中，我们介绍了可以创建内部晶格的各种方法，这些晶格可作为打印 SLA 和 DLP 打印机掏空物体的支撑结构。我们讨论了如何使用
  Fusion 360 中的单个命令完成掏空体并添加体积晶格。我们以讨论体积晶格和实体晶格之间的差异以及实体晶格如何用于进行有限元分析模拟以查看 3D 打印零件是否能承受工作条件结束本章。


  使用这些技术，我们可以快速轻松地减少使用树脂或塑料粉末基打印机打印具有大截面的零件所需的材料量。这标志着我们对增材制造设计概念讨论的结束。


  在下一章中，我们将从讨论设计转向突出如何制造这些设计，通过查看如何将 Fusion 360 中创建的模型导出到第三方切片软件。




