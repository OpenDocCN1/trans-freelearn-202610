  \ **Additive Toolpath** 项目并使用 **Ctrl + G** 键盘快捷键生成刀具路径。接下来，我们可以激活位于 **ADDITIVE**\
  \ 选项卡内的 **ACTIONS** 面板中的 **Simulate Additive Toolpath** 命令：\n\n![](img/baa027bed101c08b496f1f420cee8a5b_293_0.png)\n\
  \n图 9.25 – 模拟增材制造设置的增材刀具路径\n\n当我们可视化增材刀具路径时，可以放大模型，以便更近距离地查看两个相邻部件，如图 9.26 所示。如果取消选中\
  \ **Show Machine** 复选框，成型平台将被隐藏，以便我们可以轻松区分刀具路径类型的颜色。\n\n在同一图中，您会注意到图像底部旋钮只有一个红色线条（外周）以及一条绿色线条（内周）。顶部旋钮的外周为红色，但当前显示的层（第\
  \ 41 层）的内周刀具路径线有四条绿色线条。这是因为 **ABS (Direct Drive)** 打印设置在 **Strong** 主体预设的 **Shell**\
  \ 子标题下的 **Number of Perimeters** 字段中输入了 5。\n\n![](img/baa027bed101c08b496f1f420cee8a5b_294_0.png)\n\
  \n图 9.26 – 模拟使用两种不同主体预设的 FFF 设置的增材刀具路径\n\n我们可能想要为所选主体分配不同的主体预设的原因有很多。在前面的示例中，我们演示了如何使用不同的刀具路径设置打印不同的主体，例如周数以使其中一个比另一个更强。另一个我们可能想要使用主体预设并将其分配给特定主体的原因是为了控制用于打印特定主体的挤出机。\n\
  \n在下一个示例中，我们有一个由两个主体组成的单个部件。部件名为 2BC，主体名为 Body1-Yellow 和 Body2-Red，如图 9.27 所示。如果我们使用具有多个挤出机的\
  \ 3D 打印机（例如 Raise 3D Pro 2）创建增材设置，我们可以分配打印设置并随后控制哪个主体使用哪个挤出机打印。在此示例中，在选择打印机后，我们将分配\
  \ PLA (Bowden Tube) 作为打印设置。接下来，我们可以选择打印设置并右键单击以编辑它。这也允许我们自定义主体预设的名称。图 9.27 演示了如何将默认主体预设的名称从\
  \ Normal 改为 Yellow。\n\n![](img/baa027bed101c08b496f1f420cee8a5b_295_0.png)\n\n图\
  \ 9.27 – 在打印设置中自定义主体预设的名称\n\n将现有主体预设分别重命名为 Yellow 和 Red 后，我们必须更改每个主体预设所依赖的挤出机。如图\
  \ 9.28 所示，我们可以进入 Extrusion 子标题，并将 Red 主体预设的 Part Extruder 从 Extruder 1 改为 Extruder\
  \ 2。\n\n![](img/baa027bed101c08b496f1f420cee8a5b_295_1.png)\n\n图 9.28 – 修改主体预设的部件挤出机\n\
  \n为每个主体预设分配唯一的挤出机后，我们可以在 **Print Setting Editor** 对话框中选择 **OK** 以接受更改。接下来，我们必须为给定主体分配主体预设。我们可以通过在浏览器中右键单击\
  \ **PLA (Bowden Tube)** 打印设置并选择 **Assign Body Presets** 来完成此操作，如 *图 9.29* 所示。接下来，我们可以选择希望使用\
  \ **Extruder 2** 打印的主体。**ASSIGN BODY PRESETS** 对话框现在显示一个主体将使用名为 **Yellow** 的主体预设打印，第二个主体将使用名为\
  \ **Red** 的主体预设打印。单击 **OK** 后，我们的主体预设分配现已完成。\n\n![](img/baa027bed101c08b496f1f420cee8a5b_296_0.png)\n\
