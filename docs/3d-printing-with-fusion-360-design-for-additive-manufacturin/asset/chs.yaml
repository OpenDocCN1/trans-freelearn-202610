  Autodesk App Store，以查看是否有可供您使用的应用程序，以便在无需手动执行多个步骤的情况下完成特定任务。


  您可以通过在 Web 浏览器中导航到 https://Apps.autodesk.com/FUSION/en/Home/Index 来访问 Autodesk App
  Store。您也可以在大多数工作区的 UTILITIES 选项卡的 ADD-INS 面板内访问 Autodesk App Store 命令，包括 DESIGN
  工作区，如图 14.1 中的标注 1 所示。


