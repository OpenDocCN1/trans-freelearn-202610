  5 x 5 x 5 矩阵，我们最终将得到 125 个体。我们可以简单地使用位于 **实体** 选项卡的 **修改** 面板中的 **合并** 命令，并创建一个单一实体体来表示晶格形状。


  ![](img/baa027bed101c08b496f1f420cee8a5b_158_0.png)


