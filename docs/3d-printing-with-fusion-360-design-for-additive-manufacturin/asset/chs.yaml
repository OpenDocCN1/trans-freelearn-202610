  如 help.autodesk.com 页面上的说明部分所述，此脚本使用 FFF 打印机和打印设置创建增材设置，所有组件均使用该设置。 然后，它会自动在成型平台上定向和排列所有零件。
  它还根据脚本中定义的临界悬垂角度向需要支撑结构的零件添加体积支撑。 最后，它会生成增材刀具路径并对其进行仿真。 从技术上讲，此类脚本也可以进一步扩展以生成 G
  代码。 然而，在生成机器文件并开始打印之前，始终最好直观地观察设置和生成的刀具路径。


  该脚本所采取的所有操作都在代码中明确定义，并且可以根据您的特定打印机、打印设置和增材制造技术进行自定义。 在图 14.22 中，您可以看到脚本使用的打印设置和机器模型相关的行项目。
  您可以通过在引号中输入来输入不同的机器模型或不同的打印设置，由标注 1 和标注 2 突出显示。 保存脚本并执行后，Fusion 将为您的打印机和打印设置创建增材设置。


  ![](img/baa027bed101c08b496f1f420cee8a5b_425_0.png)


  图 14.22 – 编辑脚本以根据打印机和打印设置进行自定义


  现在我们已经介绍了如何创建和自定义脚本，让我们演示如何将其与新的 Fusion 设计文档一起使用。 为了展示此脚本的作用，我们将使用一个名为 Front Bumper
  Bracket 的 Fusion 文档。 打开此 Fusion 文档后，我们可以使用 Shift + F 快捷键访问 Scripts and Add-Ins 对话框。
  选择名为 FFF Setup 的自定义脚本后，我们可以选中 Run 以执行它，如图 14.23 所示。





  ![](img/baa027bed101c08b496f1f420cee8a5b_426_0.png)


  图 14.23 – 在 Fusion 360 中执行脚本


  几秒钟后，你会注意到活动工作区已从 **DESIGN** 变为 **MANUFACTURE**，如图 14.24 所示。该脚本创建了一个名为 My Manufacturing
  Model - FFF 的新制造模型。它还使用 **Prusa i3 MK3S+** 打印机和 **PLA (Direct Drive)** 打印设置创建了一个新的增材设置。它自动对组件进行定向，使其所需的支撑结构最少。然后它将组件排列在构建平台的中心。它还添加了必要的实体体积支撑并创建了增材工具路径。脚本为我们留下了模拟的增材工具路径可视化，如图
  14.24 所示。


  ![](img/baa027bed101c08b496f1f420cee8a5b_426_1.png)


  图 14.24 – 执行 FFF 设置脚本的结果


  如前所述，所有这些操作都是我们可以使用 Fusion 的各种命令和对话框手动完成的事情。然而，通过利用脚本，我们消除了与软件手动交互的需求。自动化单个组件所节省的时间可能并不显著，但想象一下，如果你有
  10 个独特的组件需要 3D 打印。针对每个组件在与众多对话框交互的同时进行这些步骤将非常耗时。通过使用单个脚本自动化整个工作流程，我们不仅消除了用户因输入错误而可能引入的错误，还节省了打印准备步骤中的时间。使用
  API 驱动脚本的自动化功能，你可以最大限度地减少错误并提高生产力。


  ## 摘要


  本章中，我们讨论了在创建增材设置和生成工具路径时如何自动化我们的工作流程。我们首先介绍了如何使用 Autodesk App Store 搜索可以提高我们某些设计和制造工作流程生产力的应用。我们演示了如何下载、安装和使用名为
  `DuplicateComponents` 的应用，以便快速创建同一组件的多个副本，从而在同一构建体积内打印多个零件。


  然后，我们学习了如何将打印设置与特定机器关联，以便在创建增材设置时轻松选择机器和打印设置组合。然后，我们重点介绍了如何自定义各种对话框的输入，例如零件定向或增材排列，并将我们的输入保存为用户默认值，以便下次使用这些命令时，无需编辑输入以匹配我们的偏好。我们还学习了如何查询每个输入字段的参数名称，以及如何在后续输入字段中使用这些参数名称作为输入。我们通过学习为给定设置创建多个支撑操作并将这些操作保存为模板结束了本章。我们强调了模板在模板库中的保存位置以及如何在后续增材设置中重用这些模板，从而节省时间并最大限度地减少用户输入错误。


  我们通过演示使用 Python 等编程语言进行脚本编写来自动化 Fusion 360 内的增材工作流程结束了本章。我们展示了如何使用 Visual Studio
  Code 创建脚本并对其进行编辑，以满足我们的自动化需求。我们创建了一个示例 Python 脚本并展示了它如何用于自动化整个增材工作流程，从设置创建到零件定向、零件放置、支撑生成和工具路径创建。


