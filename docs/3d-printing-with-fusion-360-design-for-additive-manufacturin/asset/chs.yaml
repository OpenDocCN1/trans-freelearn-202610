- "## 打开、检查和修复 CAD 和网格文件\n\n欢迎阅读本书《使用 Fusion 360 进行 3D 打印》。Fusion 360 是一款使用参数化或直接建模方法创建和编辑设计的绝佳工具。借助自动化建模、生成式设计和拓扑优化技术，Fusion\
  \ 360 用户现在拥有多种用于增材制造设计的 方法。本书将为您提供使用 Fusion 360 制造设计的必要步骤，使用常见的 3D 打印技术，例如熔融沉积成型、立体光刻、选择性激光烧结、粘结剂喷射和金属粉末床熔融。您还将获得有关如何设置\
  \ Fusion 360 的宝贵技巧和窍门，这将使您能够为 3D 打印需求充分利用该软件。\n\nFusion 360 是一款基于云的 3D 建模、**计算机辅助设计\
  \ (CAD)**、**计算机辅助制造 (CAM)**、**计算机辅助工程 (CAE)** 和 **印刷电路板 (PCB)** 设计软件平台，用于专业产品设计和制造\
  \ (https://www.autodesk.com/products/fusion-360/overview)。\n\n它适用于 Windows 和 macOS，并为\
  \ Android 和 iOS 提供简化版应用程序。Fusion 360 的首次发布可追溯到 2013 年，正值 3D 打印开始普及的时期。在 2010 年代，创客社区迅速采用\
  \ Fusion 360 进行设计和制造。\n\n在制造 3D 打印设计时，网格 (STL) 文件是早期 3D 打印切片软件唯一接受的输入文件类型。随着创客社区使用\
  \ STL 文件在 thingiverse.com 等网页上公开创建和分享设计，可 3D 打印的设计数量呈指数级增长。不幸的是，STL 文件格式存在许多问题和限制。为了解决这些问题，3D\
  \ 打印社区需要可靠且易于使用的软件。\n\nFusion 360 一直包含处理 CAD 和网格文件的功能，使其成为 3D 打印的绝佳工具。然而，Fusion\
  \ 360 的网格功能作为技术预览提供，需要在 Fusion 360 首选项中启用。Autodesk —— Fusion 360 的母公司 —— 定期为 Fusion\
  \ 360 发布新更新。在 Fusion 360 的 2021 年 7 月更新中，Autodesk 对网格工作流程进行了重大更改，将网格工作区从技术预览的一部分提升为\
  \ Fusion 360 设计工作区的一部分。\n\n今天，您可以使用 Fusion 360 打开、检查和修复可以从众多第三方来源下载的网格文件。\n\n在本章中，我们将首先通过向您介绍\
  \ Fusion Team 和 Fusion 360 用户界面，来看各种将 CAD/网格数据带入 Fusion 360 的方法。我们将介绍如何创建项目和文件夹以更好地组织数据。接下来，我们将展示将\
  \ STL、OBJ 和 3MF 等网格文件插入 Fusion 360 的多种方法。我们将以检查插入 Fusion 360 的网格数据是否存在潜在缺陷并自动和手动修复这些缺陷结束本章。\n\
  \n在本章中，我们将涵盖以下主题：\n\n- CAD 模型和网格文件的打开和上传工作流程\n- STL、OBJ 和 3MF 文件的网格插入工作流程\n- 检查网格体并修复它们\n\
  \n到本章结束时，您将学会如何在 Fusion 360 中打开使用其他工具创建的模型。您将学会如何在 Fusion 360 中插入网格文件。您还将了解如何使用自动和手动方法检查和修复网格文件。\n\
  \n### 技术要求\n\n本书中涵盖的大多数主题适用于 Fusion 360 的所有许可级别（个人/业余、初创、教育和商业）。然而，本书还将涵盖个人/业余使用许可不可用的高级功能。此类高级功能将被标识为个人使用不可用，以及需要访问扩展程序。\n\
  \nFusion 360 具有以下系统特定要求：\n\n- **Apple® macOS:**\n  - macOS 13 Ventura – 版本 2.0.15289\
  \ 或更新\n  - macOS 12 Monterey\n  - macOS 11 Big Sur\n- **Microsoft Windows:**\n \
  \ - Windows 11\n  - Windows 10（64 位）– 版本 1809 或更新\n- **CPU、内存和磁盘空间要求：**\n  - 基于\
  \ x86 的 64 位处理器（例如 Intel Core i 和 AMD Ryzen 系列），4 核，1.7 GHz 或更高；不支持 32 位。Apple silicon\
  \ 处理器需要 Rosetta 2。\n  - 4 GB RAM 和 8.5 GB 存储空间。\n\n**重要说明**\n详细的系统要求列表可在以下位置找到：https://knowledge.autodesk.com/support/fusion-360/learn-explore/caas/sfdcarticles/sfdcarticles/System-requirements-for-Autodesk-Fusion-360.html。\n\
  \n本章的课程文件可在以下位置找到：https://github.com/PacktPublishing/3D-Printing-with-Fusion-360。\n\
  \n### CAD 模型和网格文件的打开和上传工作流程\n\nFusion 360 是一款基于云的 CAD/CAM/CAE 和 PCB 设计工具。您可以创建新设计或打开在其他工具中创建并保存为\
  \ CAD 或网格文件的设计。在本节中，我们将介绍您可以在 Fusion 360 中打开由其他软件创建的模型的所有方法，以便我们可以开始为 3D 打印做好准备。\n\
  \n由于 Fusion 360 是基于云的软件，因此内置了云存储和数据共享功能。作为 Fusion 360 用户，您可以自动访问名为 Fusion Team 的基于云的数据存储和管理工具。该工具还允许您通过提供权限、版本控制、标记和评论工具来管理您的\
  \ Fusion 用户团队。根据 Autodesk 知识网络文章，Fusion 360 用户自动获得 Fusion 360 数据的无限存储空间和非 Fusion\
  \ 文档的 500 GB 数据存储空间。这是一个足以应对任何项目的慷慨存储量。\n\n**重要说明**\n有关云数据存储如何工作 的更多信息，您可以参考 https://knowledge.autodesk.com/support/fusion-360/learn-explore/caas/sfdcarticles/sfdcarticles/How-big-is-the-cloud-storage-for-Fusion.html\
  \ 上的这篇文章。\n\n在创建 Autodesk 帐户并获得 Fusion 360 访问权限后，无论您的许可级别如何，您都可以登录到您的 Fusion Team\
  \ 帐户（https://myhub.autodesk360.com/）并开始您的 Fusion 360 数据管理之旅。\n\n如果您是个人用户，则无需担心更改团队。然而，如果您为拥有多个\
  \ Fusion 360 用户的组织工作，您的组织可能已有多个团队\n\nset up. 例如，每个用户可能拥有自己的团队。您可以通过选择屏幕右上角的个人资料图标来切换活动团队，如以下屏幕截图所示：\n\
  \n![](img/baa027bed101c08b496f1f420cee8a5b_26_0.png)\n\n图 1.1 – 应用了“由我拥有”筛选器的我的\
  \ Fusion TEAM 视图\n\n图 1.1 显示了我在 Google Chrome 浏览器上的 Fusion TEAM 视图，其中项目列表应用了“由我拥有”筛选器。如果我隶属于拥有多个团队的组织，我会选择右上角的个人资料图标并更改我的活动团队，以便参与存储在另一个团队中心中的项目。图\
  \ 1.1 还显示，默认情况下，我拥有两项内容 – Assets 和 My First Project。\n\n在图 1.2 中，您可以看到通过选择 My First\
  \ Project 并展开项目详细信息，我们可以编辑项目名称和图像，并管理可以贡献和查看此项目内容的成员：\n\n![](img/baa027bed101c08b496f1f420cee8a5b_26_1.png)\n\
  \n图 1.2 – 您可以在项目详细信息屏幕上重命名项目\n\n一旦项目有了我们认可的名称（在图 1.2 中，我将项目重命名为 3D printing），我们就可以查看可用于将设计和其他文档上传到\
  \ Fusion Team 和 Fusion 360 的各种方法。\n\n我们用于将设计和文档上传到 Fusion Team 的第一个选项就在创建的项目本身内。如图\
  \ 1.3 所示，我们位于名为 3D printing 的项目中，可以选择蓝色的 **Upload** 按钮以查看我们上传内容的各种选项，例如 **File**、**Folder**、**Assembly**\
  \ 和 **From Dropbox**。如果我们从该下拉菜单中选择 **File**，就可以将本地存储中存储的任何文件直接上传到 **Fusion TEAM**\
  \ 上的活动项目。如果我们上传的文件包含网格或 CAD 几何体（例如 **STL**、**STEP**、**SAT**、**Inventor** 或 **Solidworks**），我们将能够在\
  \ Fusion 360 中打开这些设计以进行进一步编辑和制造。如果它们是非 CAD 文件（例如 Microsoft Word 文档或 PDF 文件），我们无法在\
  \ Fusion 360 中原生访问它们，但仍可以在我们的互联网浏览器或移动应用程序中查看它们。\n\n![](img/baa027bed101c08b496f1f420cee8a5b_27_0.png)\n\
  \n图 1.3 – 将本地文件上传到 Fusion TEAM 上的 3D printing 项目\n\n如果您习惯使用传统的桌面 CAD 软件，使用 FUSION\
  \ TEAM 将文件上传到 Fusion 项目可能没有您熟悉的直观工作流程。然而，这是一种快速将与项目相关的多个文件上传到您的 Autodesk 云存储的实用方法。\n\
  \n如果您寻求更传统的打开 CAD 或网格文件的工作流程，您需要将 Fusion 360 安装在计算机上。您可以从以下链接下载并安装 Fusion 360：https://www.autodesk.com/content/autodesk/global/en/products/fusion-360/trial-intake。\n\
  \n一旦 Fusion 360 安装并启动，您可以访问文件下拉菜单并选择打开。执行此操作后，您将看到打开对话框。如图 1.4 所示，在此对话框中选择“从我的计算机打开...”选项，您将能够从支持的网格和\
  \ CAD 文件类型列表中进行选择，如图 1.5 所示：\n\n![](img/baa027bed101c08b496f1f420cee8a5b_28_0.png)\n\
  \n图 1.4 – 文件 | 打开... 工作流程允许您从计算机打开 CAD 和网格文件\n\n在此对话框中，您将有选项打开 Fusion 360 支持的任何网格或\
  \ CAD 文件类型。由于 Autodesk 会定期更新 Fusion 360，因此您无需担心无法访问最新的 CAD 翻译器：\n\n![](img/baa027bed101c08b496f1f420cee8a5b_29_0.png)\n\
  \n图 1.5 – Fusion 360 可打开的可用 CAD 和 MESH 文件类型列表\n\n这是一种快速打开单个文件的绝佳选择，但此选项也有几个缺点：\n\
  \n- 使用此方法一次只能打开一个文件。\n- 使用此方法打开 CAD 文件后，您将进入直接建模模式。如果您想捕获设计历史记录，则需要使用浏览器手动打开设计历史记录。设计历史记录和直接建模方法的建模将在第\
  \ 2 章中详细介绍。\n- 打开 STL/OBJ 文件时，您没有机会设置单位或零件放置。\n\n总之，如果您尝试打开 STL 或 OBJ 文件，我不推荐此选项。但是，如果您打开\
  \ CAD 文件（例如 STEP 或 SAT）或 3MF 文件，这是一个快速简便的选项，您可能想要使用。不要忘记，如果您想在时间轴中存储编辑内容，请手动打开捕获设计历史记录，如图\
  \ 1.6 所示：\n\n![](img/baa027bed101c08b496f1f420cee8a5b_30_0.png)\n\n图 1.6 - 在执行文件\
  \ | 打开... 工作流程后，通过浏览器打开捕获设计历史记录\n\n打开 CAD 和网格文件时，另一个可用的选项位于 Fusion 360 的数据面板中。您可以选择位于界面左上角的“显示数据面板”图标来访问数据面板窗口，如图\
  \ 1.7 所示。\n\n![](img/baa027bed101c08b496f1f420cee8a5b_30_1.png)\n\n图 1.7 - 显示/隐藏数据面板\n\
  \n一旦数据面板可见，您可以导航到要上传设计数据的团队和项目。进入适当的项目后，您可以创建新文件夹以进一步组织您的设计和文档。一旦进入所需项目/文件夹位置，您可以使用图\
  \ 1.8 所示的上传按钮，并选择或将文件拖放到屏幕上的上传对话框中。两种选项都允许您将多个 CAD 或网格文件上传到指定的团队/项目/文件夹位置。请注意，每个上传的文件都将成为其自己的\
  \ Fusion 设计文档。\n\n![](img/baa027bed101c08b496f1f420cee8a5b_31_0.png)\n\n图 1.8 –\
  \ 使用数据面板将多个网格和 CAD 文档上传到 Fusion 360\n\n这是一种将多个 CAD 模型上传到 Fusion 360 的绝佳选择。然而，就像之前的选项一样，如果您想在时间轴中存储编辑内容，您必须打开捕获设计历史记录，如图\
