  - Arranging components automatically\n\n在第一个部分结束时，您将学会如何在打印机的构建体积内手动定位组件。在本节中，您还将学习各种技术，以便有效地平移和旋转零件，使其位于打印机的构建板上方并平放在您选择的表面上。在第二个部分结束时，您将学会如何对给定零件进行定向研究，以及如何根据\
  \ 3D 打印技术以及打印机的功能和限制来选择打印零件的定向。在本章结束时，您将学会如何在打印机的 3D 构建体积内自动排列组件。此外，您还能够检查设置并执行基本统计数据，以找到零件在打印机构建体积内的排列密度。\n\
  \n### Technical requirements\n\n本章涵盖的所有主题均可供个人、试用、商业、初创和教育版 Fusion 360 许可证类型使用。\n\
  \n某些 Fusion 360 增材机器，例如 **Metal Powderbed Fusion (MPBF)** 3D 打印机，在获得 Additive Build\
  \ 扩展访问权限之前不可用。与所有其他 Fusion 360 扩展一样，Additive Build 扩展不能与个人许可证一起使用。由于本章不会涵盖特定于金属\
  \ 3D 打印的主题，您应该能够毫无问题地跟随本章中的所有示例。\n\n如果您拥有 Fusion 360 的商业许可证，要使用 MPBF 机器创建增材设置，您还需要访问\
  \ Additive Build 扩展 (https://www.autodesk.com/products/Fusion-360/additive-build-extension)。\n\
  \nAutodesk 为所有 Fusion 360 商业用户提供 Additive Build 扩展的 14 天试用期。您可以在 Fusion 360 的扩展对话框中激活试用期。\n\
  \n本章的课程文件可在以下位置找到：https://github.com/PacktPublishing/3D-Printing-with-Fusion-360\n\
  \n### Positioning Components Manually\n\n在为 3D 打印准备零件时，我们在切片软件中使用的主要功能之一是定位组件。Fusion\
  \ 360 提供了多个工具，可用于在 3D 打印机的构建体积内平移和定向零件。本节中我们重点介绍的第一个方法是使用 **Move Components** 命令，该命令位于\
  \ **MANUFACTURE** 工作区中 **ADDITIVE** 选项卡的 **POSITION** 面板内。为了演示如何使用此功能，我们将使用 Prusa\
  \ i3 MK3S+ 3D 打印机和 PLA 打印设置创建一个新的增材设置。\n\n\n\n本章中的第一个增材制造设置将使用名为 Component 6 和 Component\
  \ 15 的两个组件，这些组件位于名为 Spark Max Motor Controller 的装配体中。我们将使用位于 **MANUFACTURE** 工作区中\
  \ **ADDITIVE** 选项卡的 **SETUP** 面板里的 **NEW SETUP** 命令来创建此增材制造设置，如上一章所示。在创建设置期间，我们将取消选中\
  \ **Arrangement** 复选框，这将使我们能够完全控制每个组件的位置。我们将在本章的最后一节讨论激活此复选框时启动的自动排列功能的使用方法。\n\n\
  ![](img/baa027bed101c08b496f1f420cee8a5b_241_0.png)\n\nFigure 8.1 – 使用两个组件创建增材制造设置\n\
  \n在创建增材制造设置时，Fusion 360 会自动关闭不参与增材制造设置的组件的可见性，并显示我们所选打印机的成型平台和成型体积，以及将参与此增材制造设置的两个组件。如\
  \ Figure 8.1 所示，由于我们在创建设置期间取消了排列复选框，这两个组件不会自动移动到成型体积中。相反，它们保持原位，这意味着我们必须手动将它们移动到成型体积中。\n\
  \n在增材制造设置中定位零件时，我们有几个选项。第一个选项是使用位于 **ADDITIVE** 选项卡的 **POSITION** 面板中的 **MOVE COMPONENTS**\
  \ 命令。激活后，**MOVE COMPONENTS** 对话框允许我们选择一个或多个组件，并在活动设置中平移和/或旋转它们。此操作会移动组件并在其新位置内捕获它们在活动设置中使用的制造模型。Figure\
  \ 8.2 显示了所选组件如何在 X、Y 和 Z 轴上分别平移 100 毫米、100 毫米和 60 毫米。\n\n![](img/baa027bed101c08b496f1f420cee8a5b_242_0.png)\n\
  \nFigure 8.2 – 使用 MOVE COMPONENTS 对话框在成型体积内定位零件\n\nFigure 8.2 还显示，在移动第一个组件后，我们仍然有第二个组件，它并未完全位于打印机成型体积内。这样的组件会在边缘周围显示红色高亮，表示这些零件位于机器可打印区域之外。Fusion\
  \ 360 还会在 move-components 对话框中显示错误消息以指示此类问题。\n\n如果此时我们希望移动不同的组件，我们可以选中它，然后通过在画布中左键单击组件来取消选中第一个组件。接下来，我们可以输入希望移动第二个组件的距离和角度，然后单击“确定”。\n\
  \n在定位组件时，我们的另一个选项是在 MOVE COMPONENTS 对话框处于活动状态时，通过用鼠标选择组件的中心并在屏幕上拖动它们来在画布中移动它们，如\
  \ Figure 8.3 所示。此操作类似于在 DESIGN 工作区中对未固定的组件执行 MOVE/COPY 操作，其移动类型为 Free Move。\n\n\
  ![](img/baa027bed101c08b496f1f420cee8a5b_243_0.png)\n\nFigure 8.3 – 使用鼠标在增材制造设置中拖动组件\n\
  \n如 *Figure 8.3* 所示，Fusion 360 在此自由零件运动期间使用的增量对于任何平移或旋转都具有三位有效数字。如果我们想更改使用拖放技术平移或旋转组件的精度，我们需要返回首选项对话框，并将通用精度从默认值\
  \ **0.123** 更改为更不精确或更精确的选项。作为提醒，**General precision** 可以在 **Preferences** 对话框的 **Unit\
  \ and Value Display** 部分找到，如 *Figure 8.4* 所示。\n\n![](img/baa027bed101c08b496f1f420cee8a5b_243_1.png)\n\
  \nFigure 8.4 – 可以在 Fusion 360 的 Preferences 对话框中编辑通用精度\n\n**MOVE COMPONENTS** 对话框具有额外的功能，允许我们旋转组件。选择要旋转的组件后，我们可以在\
  \ **X Angle**、**Y Angle** 或 **Z Angle** 输入字段中输入角度以相应地旋转组件。*Figure 8.5* 显示了围绕其重心将两个组件之一在\
  \ X、Y 和 Z 轴上旋转 45 度。\n\n![](img/baa027bed101c08b496f1f420cee8a5b_244_0.png)\n\n\
  Figure 8.5 – 使用 MOVE COMPONENTS 对话框旋转组件\n\n一旦组件被旋转，如果我们想第二次移动该组件，在 Move Components\
  \ 对话框中选中它后，Fusion 360 会在其原点自动显示一个局部坐标系，该坐标系基于我们刚刚完成的最后一次移动操作。\n\n如果仔细查看 *Figure\
  \ 8.5*，您会注意到坐标系设置为 **Component XYZ**。如果我们已经旋转过一个组件一次，则为该组件显示的局部坐标系将与全局 XYZ 轴不匹配。这将使我们在全局\
  \ XYZ 轴上平移组件变得更加困难。\n\n为了解决这个问题，我们可以将坐标系从 **Component XYZ** 更改为 **Machine XYZ**，后者始终与全局坐标系匹配。选择\
  \ **Machine XYZ** 坐标系后，我们可以轻松地在全局 X、Y 或 Z 方向上平移所选组件，如 *Figure 8.6* 所示。\n\n![](img/baa027bed101c08b496f1f420cee8a5b_245_0.png)\n\
  \nFigure 8.6 – 使用 Machine XYZ 坐标系在全局 Z 方向上平移组件\n\n使用 Move Components 对话框定向零件后，我们可能希望快速将它们平移到\
  \ 3D 打印机成型体积内的左下角更近的位置。在这种情况下，在选择要平移的组件后，我们可以单击 **Move to Origin** 命令，所选组件将被自动平移，使其包围盒的左下角与\
  \ 3D 打印机成型体积的前左下角重合，如 Figure 8.7 所示。\n\n![](img/baa027bed101c08b496f1f420cee8a5b_245_1.png)\n\
  \nFigure 8.7 – 使用 Move to Origin 功能平移所选组件\n\n**ADDITIVE** 选项卡的 **POSITION** 面板中的另一个有用工具是\
  \ **Minimize Build Height**。如果我们有一个形状不规则的组件，或者旋转后占用了相当大的 Z 高度的组件，我们可能希望找到一种方向，使该组件在成型体积内占用最小可能的\
  \ Z 高度。在某些增材制造技术中，例如 **selective laser melting (SLM)**、**selective laser sintering\
  \ (SLS)**、**multijet fusion (MJF)** 和粘结剂喷射，使用最少的 Z 高度是有益的，这样就不会浪费原材料或打印时间。\n\n降低给定增材制造设置的\
  \ Z 高度可最大限度地减少需要 3D 打印的层数。这对整体打印时间有积极影响。想象一下，如果我们打印一个有 1,000 层的构建。我们将在层之间有 999 个间隔，在这些间隔中，需要进行增材制造技术特定的工艺，例如用原材料为下一层重新涂覆构建。这种工艺根据\
  \ 3D 打印机的不同，每层间隔可能需要 ~10 秒。如果您可以通过旋转组件来减少层数，使构建可以用一半的层数打印（在本例中为 500 层），您就可以将重新涂覆构建所花费的总时间减少\
  \ ~80 分钟。这是一项可观的时间节省，将对您的制造吞吐量和盈利能力产生积极影响。\n\nminimize build height 命令会自动旋转所选组件，使其在\
  \ Z 轴上占用的空间最少，如 Figure 8.8 所示。如果我们在平台间隙字段中输入非 0 值，此命令还会在成型平台和零件之间留出间隙。\n\n![](img/baa027bed101c08b496f1f420cee8a5b_246_0.png)\n\
  \nFigure 8.8 – 在增材制造设置中最小化组件的构建高度\n\n\n\n本节中我们将重点介绍的最终手动定位是 将零件放置在平台上 命令。如图 8.9\
  \ 所示，此命令允许我们使用 Type 下拉菜单选择 Component 或该组件内的 Flat Face。如果从下拉菜单中选择 Flat Face，我们可以选择组件上的一个表面并按需填写\
  \ Platform Clearance，就像我们之前对 最小化构建高度 命令所描述的那样。单击 将零件放置在平台上 对话框中的 OK 后，我们所选的组件将旋转，所选表面将面向构建平台。请注意，Flat\
  \ Face 选择类型仅适用于 SOLID 体，MESH 体上的平面面组不能作为此命令的输入。图 8.9 显示了此命令在此增材设置中两个组件之一上的输入和输出。\n\
  \n![](img/baa027bed101c08b496f1f420cee8a5b_247_0.png)\n\nFigure 8.9 – 通过选择平面使用 将零件放置在平台上\
  \ 命令\n\n在本节中，我们介绍了在增材设置中可用的三种不同的手动零件定位命令。使用这三种相对简单的命令，我们可以平移和旋转组件，使其位于 3D 打印机的构建体积内。本节中强调的所有位置修改都是纯几何的。在移动或旋转组件时，我们没有考虑任何工艺特定的要求。在下一节中，我们将开始考虑各种\
  \ 3D 打印技术的<|message|>要求并相应地定位我们的组件。\n\n## 自动定向组件\n\n在上一节中，我们讨论了如何利用 Fusion 360 将零件定位在打印机的构建体积内。然而，到目前为止我们展示的所有平移和旋转都是显式操作。Fusion\
  \ 360 还提供工具帮助我们自动定向零件，以便我们能够根据 3D 打印机特定的技术选择方向，以最小化材料使用并提高打印成功的几率。\n\n为了演示如何使用 Fusion\
  \ 360 自动定向零件，我们将使用名为 `Connector Bracket` 的模型，如图 8.10 所示。这是我们在上一章作为较大装配的一部分创建的模型。在本章中，我们将打开此\
  \ Fusion 360 设计文档并切换到 **MANUFACTURE** 工作区。我们将使用 FFF 打印机 Prusa i3 MK3S + 和 PLA 特定打印设置创建增材设置，如图\
  \ 8.10 所示。我们还将在 **SETUP** 对话框中取消选中 **Arrangement** 选项并单击 **OK** 以生成增材设置。\n\n![](img/baa027bed101c08b496f1f420cee8a5b_248_0.png)\n\
  \nFigure 8.10 – 使用 FFF 机器为单个组件创建增材设置\n\n由于我们在创建此增材设置时未选中 **Arrangement** 复选框，Fusion\
  \ 360 不会自动在打印机的构建体积内排列我们的零件。然而，由于零件已靠近原点放置，我们的零件会自动显示在构建体积内，我们可以根据需要进一步定位它。\n\n\
  在本节中，我们将重点关注位于 **ADDITIVE** 选项卡的 **POSITION** 面板下拉菜单中的 **AUTOMATIC ORIENTATION**\
  \ 命令。一旦激活 **AUTOMATIC ORIENTATION** 命令，Fusion 360 将显示一个包含两个选项卡的新对话框，如图 8.11 所示。第一个选项卡名为\
  \ **Parameters**，允许我们选择要进行方向研究的组件。在此示例中，我们将进行一次单一的自动定向，因为此增材设置仅包含一个组件。然而，如果增材设置中有多个组件，我们可以为每个要\
  \ 3D 打印的组件进行独特的方向研究。选择目标组件后，我们可以编辑 **Support Overhang Angle** 输入字段并输入 45 deg，因为大多数\
  \ FFF、SLA、DLP 和 MPBF 3D 打印机都能够在无需支撑结构的情况下创建高达 45 度的悬垂。下一个复选框名为 **Support Bottom\
  \ Surface**，激活时允许我们在零件和 3D 打印机的构建板之间添加平台间隙。\n\n由于此示例适用于 FFF 打印机，我们不需要激活它。然而，如果我们为\
  \ MPBF 打印机进行此方向研究，我们可能希望激活该复选框并输入约 3 毫米的平台间隙，以考虑打印过程完成后我们将用来将零件从构建板上切下的切割工具的厚度。\n\
  \n![](img/baa027bed101c08b496f1f420cee8a5b_249_0.png)\n\nFigure 8.11 – 用于 FFF 打印机增材设置的自动方向研究\n\
  \n根据我们在 **Parameters** 选项卡中提供的信息，Fusion 360 将生成该组件的各种方向，并为每个方向提供信息。为了限制此命令将生成的冗长方向结果列表，**Parameters**\
  \ 对话框允许我们调整最小允许旋转角度。默认情况下，**Smallest Rotation** 输入设置为 180 度。这意味着我们将从此研究中获得的方向将在\
  \ XZ 或 YZ 等全局平面上为镜像。如果减小最小旋转输入，Fusion 360 将在方向结果中产生更多结果。然而，这可能需要稍长的计算时间。\n\n我的建议是，如果您的增材设置用于\
  \ FFF 打印机，请使用 **Parameters** 选项卡中的标准输入，不要偏离默认值。如果您发现自己总是需要更改方向研究的输入，您可以左键单击输入旁边的由三个垂直点表示的图标并选择\
  \ **Save as User Default** 以将自定义输入设为默认值，如图 8.11 所示。这样，下次您使用此命令时，对话框的输入将基于您的期望偏好。这是您自定义\
  \ Fusion 360 **MANUFACTURE** 工作区中大多数对话框默认值的一种常见方式。\n\n如果您切换到 **AUTOMATIC ORIENTATION**\
  \ 对话框中的 **Ranking** 选项卡，您将能够控制 Fusion 360 如何列出方向研究的结果，如图 8.12 所示。在为所选组件生成方向列表时，Fusion\
  \ 360 还会计算以下附加信息：\n\n- 在给定方向打印物体时需要多少支撑\n- 基于支撑悬垂角度输入，零件上需要支撑的总表面积\n- 在给定方向下的包围盒体积\n\
  - 在给定方向下占用的最大 Z 高度\n- 在给定方向下的重心高度\n\n使用每个排名标准旁边的下拉菜单，您可以为 Fusion 360 计算的每个项目的数值分配优先级。如前所述，默认排名优先级是同时适用于\
  \ FFF 和 MPBF 技术的首选排名优先级。\n\n![](img/baa027bed101c08b496f1f420cee8a5b_250_0.png)\n\
  \nFigure 8.12 – 自动方向研究的排名标准\n\n在进行方向研究并单击 **AUTOMATIC ORIENTATION** 对话框中的 **OK**\
  \ 按钮后，Fusion 360 会在浏览器中活动增材设置的 **Orientations** 文件夹内添加一个名为 Automatic Orientation1\
  \ 的新行项目，如图 8.13 所示。一旦 Fusion 360 生成所有方向结果，它将在 **ORIENTATION RESULTS** 对话框中的名为 **Results**\
  \ 的新选项卡中显示可供选择的可用方向。如果您通过单击 **OK** 关闭此对话框，\n\n您始终可以通过在浏览器中选择 Automatic Orientation1，右键单击它并选择\
  \ Orientation Results 来返回它。方向研究的结果包括一个按方向结果排名的下拉列表。通过选择 Rank 旁边的箭头键，我们可以观察到计算出的支撑面积、支撑体积、包围盒体积、整体高度和重心高度的结果，如前所述。排名最高的\
  \ Rank 1 结果是推荐在此 FFF 3D 打印机上打印目标组件的方向。\n\n![](img/baa027bed101c08b496f1f420cee8a5b_251_0.png)\n\
  \nFigure 8.13 – 自动方向研究的定向结果\n\n使用 Rank 下拉菜单选择所需方向结果后，我们可以单击 OK 按钮，我们的组件将从初始位置旋转到我们选择的方向。\n\
  \n在本节中，我们主要关注进行自动定向操作并从结果列表中选择方向结果。然而，突出显示此方向对所选组件的影响也将有益。为了展示此方向的效果，我们可以使用 **ADDITIVE**\
  \ 选项卡中 **SUPPORTS** 面板内的 SOLID VOLUME SUPPORT 命令为我们的组件添加支撑结构。在对话框的 GEOMETRY 选项卡中选择我们的组件并单击\
  \ OK 后，Fusion 360 会为悬垂角度小于 45 度的表面创建支撑结构。支撑生成操作的成果可在图 8.14 中看到，同时显示 SOLID VOLUME\
  \ SUPPORT 对话框。Fusion 360 创建的支撑结构在画布上显示为蓝色对象。我们可以看到，此方向为我们的组件产生最小的支撑结构，以便使用我们的 FFF\
  \ 打印机进行 3D 打印。\n\n\n\n![](img/baa027bed101c08b496f1f420cee8a5b_252_0.png)\n\n图 8.14\
  \ – 自动定向后向组件添加实体体积支撑\n\n需要记住的是，不同的 3D 打印技术在进行自动定向研究时需要不同的参数和排名输入。在下一个示例中，我们将说明如何使用自动定向功能为\
  \ SLA/DLP 3D 打印机选择打印方向。\n\n在这个新示例中，我们将使用相同的连接支架文档，但创建一个新的制造模型（制造模型 2），如图 8.15 所示。然后我们将创建一个新的增材设置（Setup2），在模型选择期间将使用制造模型\
  \ 2。\n\n这个新设置将使用一台名为 Prusa SL1S SPEED 的 SLA 打印机。我们还将从可用的打印设置列表中为该打印机选择适当的打印设置。\n\
  \n创建 Setup2 后，我们可以专注于定向组件。在使用树脂 3D 打印机确定最佳组件方向时，我们通常希望支撑底部表面，并在成型平台与零件之间留出距离，以便生成包含底板的支撑。我们将在第\
  \ 10 章详细讨论基于 3D 打印技术的各种支撑选项。在图 8.15 中，此参数设置为 7 毫米。FFF 打印机与 SLA 打印机自动定向输入之间的主要区别在于我们如何对结果进行排名。如图\
  \ 8.15 所示，在对结果进行排名时，我们不依赖包围盒体积、零件高度或重心高度结果。相反，我们寻找所需支撑面积最低的方向，同时将减少支撑体积作为次要优先级。图\
  \ 8.15 中显示的特定排名优先级是我在使用自动定向工具进行 SLA 或 DLP 3D 打印机时首选的排名标准，因为这些选项倾向于高度排名可以用最小体积的支撑结构进行\
  \ 3D 打印同时生产出高质量模型的定向。\n\n![](img/baa027bed101c08b496f1f420cee8a5b_253_0.png)\n\n\
  图 8.15 – 针对 SLA/DLP 3D 打印机的自动定向研究\n\n根据我们设定的参数和排名标准，Fusion 360 会生成多个定向此模型的选项。如图\
  \ 8.16 所示，定向研究中排名最高的定向（Rank 1）所需的支撑结构面积非常小（4.07mm³）。此定向还将需要相对较小的支撑体积（~94 mm³）。然而，定向研究的结果并未考虑\
  \ 3D 打印过程的某些方面。为了突出此特定定向的问题，我使零件透明并将某些表面涂成红色，如图 8.16 所示。红色表面代表模型中在打印过程中可能发生缩孔的区域。缩孔可能导致使用\
  \ SLA 或 DLP 打印机倒置 3D 打印时因被困空腔内压力积聚而导致打印失败。\n\n![](img/baa027bed101c08b496f1f420cee8a5b_254_0.png)\n\
  \n图 8.16 – SLA/DLP 3D 打印机定向研究的成果\n\n如果我们想使用此定向 3D 打印模型，我们希望通过在空腔的局部最小值周围创建排气孔来解决缩孔问题。或者，我们可以选择不同的定向，例如图\
  \ 8.17 中列为 Rank 3 的定向。如果我们使用此定向打印零件，我们的组件就不会有凸出部分在 3D 打印过程中充当吸盘并困住空气。然而，此定向会导致更大的包围盒高度，这意味着更长的打印时间，并且需要更多的支撑结构，意味着打印过程中使用更多材料。\n\
  \n![](img/baa027bed101c08b496f1f420cee8a5b_255_0.png)\n\n图 8.17 – 避免 SLA/DLP 打印机缩孔效应的定向\n\
  \n使用 Rank 下拉菜单选择所需定向后，我们可以点击 ORIENTATION RESULTS 上的 OK 按钮，我们的组件将保持在所需定向。为了演示此定向对组件的影响，我们可以通过选择位于\
  \ ADDITIVE 选项卡 SUPPORTS 面板中的 BAR SUPPORT 命令为此组件添加支撑。\n\n在 BAR SUPPORTS 对话框中，我们可以选择我们的组件，以便\
  \ Fusion 360 可以使用 Medium 条为所有悬垂角度小于临界角度的表面创建支撑结构。BAR SUPPORT 对话框和支撑操作的结果都可以在图 8.18\
  \ 的合成图像中看到。在此图像中，支撑结构以蓝色显示，我们可以看到此定向在 3D 打印过程中需要一定数量的条来支撑组件。\n\n![](img/baa027bed101c08b496f1f420cee8a5b_256_0.png)\n\
  \n图 8.18 – 自动定向后向组件添加条形支撑\n\n在定向零件时，还有许多其他因素需要考虑，这些因素取决于给定的 3D 打印技术和我们所需的零件表面光洁度。本章中我还想强调的一个关键因素是使用\
  \ MPBF 技术进行金属 3D 打印。由于 MPBF 工艺将激光能量传输到金属粉末，使用该技术 3D 打印的零件倾向于在 Z 方向变形。如果在给定层上 Z 方向的变形超过某一值，当新粉末被分散到下一层时，零件可能会与铺粉刀片发生碰撞，从而导致不良缺陷或打印失败。因此，将零件定向远离铺粉刀片的方向是良好的做法。图\
  \ 8.19 显示了一个向铺粉刀片路径倾斜的设计。这可能会使问题恶化，并由于我们刚刚讨论的热膨胀而导致刀片在打印过程中与零件发生碰撞。在这种情况下，我们可能希望将零件定向使其远离铺粉刀片的路径，以避免与刀片发生潜在碰撞。\n\
  \n![](img/baa027bed101c08b496f1f420cee8a5b_257_0.png)\n\n图 8.19 – 铺粉刀片方向与组件位置\n\n\
  在本节中，我们讨论了如何使用 Fusion 360 自动定向我们的零件。我们还强调了如何利用 AUTOMATIC ORIENTATION 对话框内的排名机制，根据给定\
  \ 3D 打印技术的需求对定向研究的结果进行排名。我们介绍了如何选择排名最高的定向以及次要定向，以提高 SLA、DLP 和 MPBF 工艺的打印成功率，而无需对模型进行进一步修改。在下一节中，我们将使用增材排列等其他自动化工具继续定位我们的零件。\n\
  \n## 自动排列组件\n\n在利用 3D 打印之前，公司通常会将每件零件的成本与传统的制造方法（如注塑成型或 CNC 加工）进行比较。在评估 3D 打印与注塑成型生产塑料零件时，规模经济在原型制作和小批量生产方面有利于\
  \ 3D 打印。通常 3D 打印单个组件比注塑成型它更便宜。然而，在小批量生产中，为了降低给定组件的每件零件成本，更好的做法是在 SLS 和 MJF 3D 打印机等硬件的成型体积内有效地\
  \ 3D 排列零件。\n\n为了在塑料粉末床打印机的成型体积内排列组件，Fusion 360 提供了两种工作流程。第一个工作流程可以在 DESIGN 工作区中访问。如图\
  \ 8.20 所示，位于 SOLID 选项卡 MODIFY 面板中的 ARRANGE 命令允许我们选择一个或多个组件并将其嵌套在我们的成型体积内。在本节中，我们将使用名为\
  \ `3D arrange` 的组件装配来演示此排列功能。此装配由四个组件组成，每个组件都有唯一的名称和颜色（红色、黄色、蓝色和绿色）。您可能从前面的章节中认出这些模型。要生成此特定模型，您可以使用\
  \ Derive 功能将这些组件从其原始源插入到新的 Fusion 360 设计文档中，或直接打开提供的装配文件。\n\n如前所述，我们将演示的第一个 Arrange\
  \ 功能位于 DESIGN 工作区 SOLID 选项卡的 MODIFY 面板中。激活 ARRANGE 命令后，我们可以选择将参与此排列的四个组件。它们将作为 ARRANGE\
  \ 对话框 Objects 选项卡中的垂直项目列表显示，如图 8.20 所示。\n\n![](img/baa027bed101c08b496f1f420cee8a5b_258_0.png)\n\
  \n图 8.20 – 在 DESIGN 工作区内 3D 排列组件\n\n如果我们切换到 ARRANGE 对话框的 Envelopes 选项卡，我们可以选择全局\
  \ XY 平面作为排列组件的平面。稍后，我们可以输入长度、宽度和高度信息，表示我们 3D 打印机的成型体积。在此示例中，我们将分别使用 380 毫米、284 毫米和\
  \ 380 毫米作为长度、宽度和高度字段，表示 HP Jet Fusion 5200 3D 打印机的成型体积。此对话框还允许我们执行部分排列。这意味着如果我们拥有的零件数量超过成型体积的容纳能力，Fusion\
  \ 360 将排列我们的零件，使能够放入成型体积的零件相应定向，而无法放入成型体积的零件保持其初始位置。\n\n\n\n此对话框还允许我们进一步控制部件之间的间距、部件与构建体积侧壁之间可能留出的间隙，以及部件与构建板和构建体积顶部之间可能留出的间隙。\n\
  \n如果我们在此对话框底部激活 **Auto Preview** 复选框，Fusion 360 将在对话框仍处于活动状态时自动显示排列的潜在结果，如 *图 8.21*\
  \ 所示。在此示例中，由于我们处于参数化建模范式中，**Arrange** 功能会在时间轴中添加一个特征，如以下屏幕截图所示。这意味着如果我们想要更改此排列的任何输入，我们可以选择时间轴上的该特征，右键单击它，然后轻松编辑。\n\
  \n![](img/baa027bed101c08b496f1f420cee8a5b_259_0.png)\n\n图 8.21 – DESIGN 工作区中 3D\
  \ Arrange 的与包络相关的输入\n\n我们用于在打印机构建体积内排列组件的下一个方法位于 **MANUFACTURE** 工作区。如 *图 8.22*\
  \ 所示，在创建了具有适当 3D 打印机及其相关打印设置的增材制造设置后，我们可以在 **ADDITIVE** 选项卡的 **POSITION** 面板中访问\
  \ **Arrange** 功能。\n\n![](img/baa027bed101c08b496f1f420cee8a5b_260_0.png)\n\n图 8.22\
  \ – 在 MANUFACTURE 工作区中在 3D 打印机上下文中排列组件\n\n**MANUFACTURE** 工作区中的 **Arrange** 命令与我们之前在\
  \ **DESIGN** 工作区中强调的 **ARRANGE** 功能类似。即使 **ADDITIVE ARRANGE** 对话框没有明确的选项允许部分排列，此排列的结果始终使用此方法排列零件。\n\
  \n**Additive Arrange** 在 **MANUFACTURE** 工作区与 **DESIGN** 工作区中的 **Arrange** 功能之间的第一个区别是，**Additive\
  \ Arrange** 不要求您显式输入构建体积尺寸。该输入来自您创建的活动设置和您选择的打印机。这两种排列方法之间的第二个区别是您在比较图 8.21 和图 8.22\
  \ 所示排列结果时可能注意到的。如果仔细查看图 8.22，您会注意到排列结果是被排列的零件集中在构建板的中心周围。这通常是更理想的结果，因为 SLS、MJF 和粘结剂喷射打印机在构建体积中心附近对零件公差的精度更高。这是因为构建体积的中心通常能更一致地保持其温度。因此，将组件放置在构建体积中心附近以避免热诱导变形是可取的。一般最好避免在构建体积的墙壁附近排列零件。\n\
  \n了解 Fusion 360 在 Arrange 命令中使用的 3D 排列求解器也很重要。无论您是在 **MANUFACTURE** 工作区中作为增材设置的一部分使用\
  \ **Arrange in 2D** 还是 **Arrange in 3D** 作为 **Arrangement Type** 选项，Fusion 360 都使用\
  \ Outbox packer。这意味着给定零件的排列从 Fusion 360 在零件周围创建包围盒开始。之后，Fusion 360 会在构建体积内平移此盒，而不会在过程中对盒或其内容进行定向。\n\
  \nOutbox packers 已知可以在 2D 和 3D 中非常快速地打包零件，但它们不会产生最有效的填充密度结果。如果我们想要实现更好的 3D 填充密度，我们有几个选项可以尝试。第一个选项是创建不同方向的零件副本，并查看哪个方向会导致更好的排列密度。\n\
  \n我们将通过以下示例演示这一概念。但是，为了有效地展示排列密度，我们需要不止四个组件，以便最终得到相对满的构建体积。在图 8.23 中，您可以看到我们在 DESIGN\
  \ 工作区中使用圆形图案复制的同一四个组件。在此示例中，我们在 Z 轴周围创建了 4 个组件的 18 个副本。这意味着每个组件将在 Z 轴周围旋转 20 度，我们将有总共\
  \ 72 个组件需要在我们的 3D 打印机的构建体积内排列。\n\n> **重要提示**\n> \n> SLS 和 MJF 3D 打印机通常会生产具有各向异性材料特性的零件。这意味着使用\
  \ SLS 和 MJF 打印的零件在打印的 Z 方向上较弱。制造工程师通常会确定打印其关键任务零件的方向，然后以相同的方向排列重复组件，而不会沿其 X 或 Y\
  \ 轴旋转它们，但在他们使用自动嵌套器或手动排列工具时允许 Z 轴旋转。\n\n![](img/baa027bed101c08b496f1f420cee8a5b_261_0.png)\n\
  \n图 8.23 – 在 DESIGN 工作区中创建组件的圆形图案\n\n现在我们可以切换到 **MANUFACTURE** 工作区并创建新的制造模型，如图 8.24\
  \ 所示。在使用相同的 HP Jet Fusion 5200 打印机创建新设置后，我们可以使用 Additive Arrange 功能以 3D 方式排列全部 72\
  \ 个组件。以下屏幕截图显示了在构建体积内排列这 72 个组件的结果。如您所见，没有一个组件被旋转超出其原始位置。它们反而被平移到 3D 打印机的包围盒内。由于此排列功能使用包围盒方法，组件不会相互干扰，也不会发生互锁。\n\
  \n互锁是一种现象，其中两个独立组件以这样的方式排列，以至于打印后无法分离。互锁的一个常见示例是使用两个环创建链条。如果我们想打印两个环，我们需要确保它们是分开的并且彼此不互锁。如果它们互锁，我们在\
  \ 3D 打印后就无法将它们分开。\n\n![](img/baa027bed101c08b496f1f420cee8a5b_262_0.png)\n\n图 8.24\
  \ – 在 MANUFACTURE 工作区内以 3D 方式排列 72 个组件\n\n正如我们在上面强调如何有效地在 3D 打印机的构建体积内排列组件时，我们提到了填充密度的概念。填充密度可以在所有零件定位操作完成后，在编辑增材设置中使用的制造模型时计算。在选择制造模型后，我们可以右键单击并编辑。右键单击制造模型，选择属性，并访问我们\
  \ 3D 打印机构建体积内所有组件的 PROPERTIES 对话框，如图 8.25 所示。PROPERTIES 对话框向我们显示了我们选择检查的组件的总体积。接下来，我们将查看所选组件的包围盒高度。\n\
  \n在此示例中，高度为 337.289 毫米。利用我们掌握的信息，我们可以进行快速计算，将我们 3D 打印机的 X 和 Y 尺寸（分别为 380 mm 和 284\
  \ mm）与我们从 PROPERTIES 对话框获得的高度值相乘。让我们称之为打印机利用体积。接下来，我们可以将零件的体积除以打印机利用体积来计算我们的排列密度：\n\
  \n排列密度 = 体积 / 包围盒高度 x（打印机长度 x 打印机宽度）\n\n![](img/baa027bed101c08b496f1f420cee8a5b_263_0.png)\n\
  \n图 8.25 – 检查制造模型以获取排列组件的包围盒高度\n\n在此示例中，我们基于打印机利用体积的排列密度约为 4.4%。这是一个良好的开端，但如果我们在创建重复组件时使用沿\
  \ X 或 Y 轴的矩形图案而不是围绕 Z 轴的圆形图案，我们本可以实现更高的排列密度，如图 8.26 所示。\n\n\n\n![](img/baa027bed101c08b496f1f420cee8a5b_264_0.png)\n\
  \n图 8.26 – 使用矩形图案创建的重复零件的排列结果\n\n另外，我们也可以使用 ADDITIVE 选项卡中 POSITION 面板里的 Minimize\
  \ Build Height 命令来定向所有组件，如图 8.27 所示。请注意，下面的屏幕截图展示了此工作流程的结果，该流程是在创建了新的制造模型（Manufacturing\
  \ Model 3）以及使用该新制造模型作为输入的新设置（Setup3）之后得到的。\n\n![](img/baa027bed101c08b496f1f420cee8a5b_264_1.png)\n\
  \n图 8.27 – 最小化构建高度并对所有组件进行 3D 排列\n\n一旦零件被定向到占用最少 Z 高度的位置，我们就可以执行 Additive Arrange\
  \ 功能。图 8.27 显示了使用最小化构建高度重新定向零件后 Additive Arrange 的结果。您可以看到，此结果基于打印机利用率具有更高的排列密度。如果需要，我们也可以在自动\
  \ ADDITIVE ARRANGE 操作完成后手动移动组件。有时自动化解决方案无法识别最佳结果，而作为制造工程师，我们可以直观地发现某些零件方向和位置，这将有利于整体排列密度。\n\
  \n## 总结\n\n在本章中，我们讨论了如何为 3D 打印定位和排列组件。我们通过展示如何使用制造工作区中在增材设置上下文中可用的移动命令手动平移和旋转组件来开始本章。我们还介绍了如何使用\
  \ Minimize Build Height 和 Automatic Orientation 等显式函数自动定向零件。我们讨论了 AUTOMATIC ORIENTATION\
  \ 对话框中可用的各种排序选项，以便根据增材技术的需要对定向研究的成果进行排序。我们通过演示如何在打印机的 3D 构建体积内排列组件来结束本章。在最后一节中，我们介绍了如何对组件的现有方向使用自动排列工具。我们解释了如何在\
  \ DESIGN 工作区以及在增材设置上下文中的 MANUFACTURE 工作区中定向和排列组件。我们强调了在 MANUFACTURE 工作区中使用 Additive\
  \ Arrange 的好处，并讨论了如何将零件定向和零件排列结合起来以实现更高的排列密度。\n\n现在我们知道了如何为 3D 打印排列和定向零件，我们可以开始专注于如何使用独特的工艺参数打印每个组件。在下一章中，我们将介绍如何为每个组件分配唯一的打印设置，以修改每个组件的打印方式，从而影响其物理特性。\n"
- "## 打印设置\n\n欢迎来到第 9 章。在前几章中，我们学习了如何为 3D 打印建模以及如何创建增材设置并在该设置中定位我们的组件。我们讨论了定向零件和利用\
  \ 3D 排列工具以充分利用 3D 打印机的有效方法。\n\n在本章中，我们将重点关注打印设置。我们将重点介绍如何在打印设置中修改某些输入及其对正在打印的模型的影响。我们还将介绍不同增材制造技术的不同打印设置。最后，我们将介绍如何在打印机的构建体积中的不同零件上分配唯一的打印设置，以便我们可以控制每个零件的打印方式。\n\
  \n大多数人通过一次打印一个组件开始他们的 3D 打印之旅。随着他们对 3D 打印越来越熟悉，他们会转向在一次打印中打印多个组件。获得这种信心的重要一步在于更好地了解如何微调我们的打印配置文件，以便从\
  \ 3D 打印机获得可靠且成功的打印。\n\n学习如何稳定地进行 3D 打印的这一阶段可能需要您使用特定的 3D 打印机进行一些实验。本章中我们将介绍的主题将使您更容易尝试各种打印设置，并为您的特定打印机和材料调整打印配置文件。\n\
  \n在本章中，我们将介绍以下主题：\n\n- 熔丝制造的打印设置概述\n- SLA 和 DLP 打印的打印设置概述\n- 为实体分配唯一的打印设置\n\n在某些情况下，可能需要编辑所选的打印设置以更改打印过程的某些方面。例如，如果您由于零件没有粘在构建板上而遇到打印失败，您可能希望添加裙边或底边以改善打印床粘附。如果您的\
  \ 3D 打印零件不够坚固，您可能希望增加填充密度或周长数量。在某些情况下，您可能希望为打印的不同部分使用不同的打印设置。本章将探讨所有这些内容以及更多内容。\n\
  \n到本章结束时，您将更好地了解 Fusion 360 中的打印设置是什么。您将了解到大多数打印设置有多个预设，并且您将了解这些预设之间的差异。您将学习如何创建自己的预设并通过更改某些打印设置来自定义现有预设。您将对关键打印设置及其对\
  \ Fusion 360 在生成机器文件时创建的增材刀具路径和切片的影响有坚实的理解。您还将学习如何在组件内的每个实体上分配打印设置及其对增材刀具路径的影响。\n\
  \n### 技术要求\n\n本章涵盖的所有主题都可用于个人、试用、商业、初创和教育版 Fusion 360 许可证类型。\n\n某些 Fusion 360 增材机器和打印设置，例如金属粉末床熔融（MPBF）3D\
  \ 打印机及其各自的打印设置，在获得 Additive Build Extension 访问权限之前不可用。与所有其他 Fusion 360 扩展一样，Additive\
  \ Build Extension 不适用于个人使用。由于本章不会涵盖特定于金属 3D 打印的主题，您应该能够毫无问题地跟随本章中的所有示例。\n\n如果您拥有\
  \ Fusion 360 的商业许可证，要使用 MPBF 机器创建增材设置，您还需要访问 Additive Build Extension（https://www.autodesk.com/products/Fusion-360/additive-build-extension）。\n\
  \nAutodesk 为所有 Fusion 360 商业用户提供 Additive Build Extension 的 14 天试用期。您可以在 Fusion\
  \ 360 的 Extensions 对话框中激活您的试用期。\n\n本章的课程文件可以在这里找到：https://github.com/PacktPublishing/3D-Printing-with-Fusion-360。\n\
  \n## 熔丝制造打印设置的概述\n\n在本节的第一部分，我们将重点关注特定于熔丝制造（FFF）增材制造的打印设置。为了演示如何访问和编辑 FFF 的打印设置，我们将使用名为\
  \ Knobs 的 CAD 模型，如图 9.1 所示。此零件实际上是 Prusa i3 MK3S+ 3D 打印机的拨号旋钮，可作为网格对象从 printables.com\
  \ 下载，是 Prusa Research 上传的 38 个组件之一，作为该 3D 打印机的替换零件（https://www.printables.com/model/57217-i3-mk3s-printable-parts/）。因此，如果您愿意，您可以下载并使用不同颜色的丝材或不同的材料打印此零件，并更换打印机上的现有旋钮。\n\
  \n在此示例中，我们将使用此零件的实体（而非原始网格）版本。在 Fusion 360 中打开零件并切换到 **制造** 工作区后，我们可以使用 **Prusa\
  \ i3 MK3S+** 打印机和 **PLA（直接驱动）** 打印设置创建增材设置，如图 9.1 所示。如果我们展开打印设置，我们会注意到分配给此零件的预设名为\
  \ **Normal**。如果我们想编辑打印设置或预设，我们可以通过在活动设置中右键单击打印设置并选择 **编辑** 来执行此操作。另一种方法是转到 **管理**\
  \ 面板中的 **打印设置库**。在 **打印设置库** 中，我们可以从 **Fusion 360 库** 中选择我们希望自定义的打印设置，并将其复制并粘贴到我们的\
  \ **云**、**本地** 或 **链接** 库中，如图 9.1 所示。\n\n![](img/baa027bed101c08b496f1f420cee8a5b_269_0.png)\n\
  \n图 9.1 – 在打印设置库中管理打印设置\n\n一旦打印设置保存在 **打印设置库** 的 **我的打印设置** 部分中的文件夹下，我们就可以选择它，右键单击它并对其进行进一步自定义，如图\
  \ 9.2 所示。\n\n\n\n![](img/baa027bed101c08b496f1f420cee8a5b_270_0.png)\n\n图 9.2 –\
  \ 编辑位于本地文件夹中的打印设置\n\n选择“编辑”选项后，我们现在将看到打印设置编辑器对话框。我们在上一章中介绍了此对话框，并讨论了如何搜索特定的打印设置以及编辑一些关键输入。在本章中，我们将深入探讨并突出显示打印设置编辑器中所有可用的选项。打印设置编辑器对话框包含两个主要区域。左侧是其浏览器，右侧允许我们更改输入。FFF\
  \ 打印设置由信息、常规和主体预设组成。如果在浏览器中选择信息，则信息输入字段将显示在右侧。图 9.3 显示了我们对该打印设置的第一次修改，即在所选打印设置名称后添加\
  \ - CUSTOMIZED 后缀。\n\n![](img/baa027bed101c08b496f1f420cee8a5b_270_1.png)\n\n图 9.3\
  \ – 修改打印设置的“信息”字段\n\n如果在浏览器中选择 **常规 **，您将能够修改 ** 全局设置 **、** 喷嘴预热设置 ** 和 ** 附加 G-Code\
  \ 设置 ** 的输入。\n\n> ** 重要提示 **\n> 请记住，并非所有 3D 打印机都能管理所有这些输入。例如，如果您使用的是没有加热打印床的打印机，则\
  \ ** 打印床温度 ** 字段对您的打印没有任何影响。\n\n## 常规\n\nFFF 打印设置的 ** 常规 ** 部分是自定义打印配置文件时可以修改一些最常见输入字段的地方。*图\
  \ 9.4* 显示了可在 FFF 打印设置的 ** 常规 ** 部分中自定义的所有输入字段。此部分分为三个类别：** 全局设置 **、** 喷嘴预热设置 **\
  \ 和 ** 附加 G-Code 设置 **。在下面的小节中，我们将介绍这些类别中的一些关键输入字段及其用例。\n\n### 全局设置\n\n位于 ** 打印设置编辑器\
  \ ** 的 ** 常规 ** 部分内的 ** 全局设置 ** 子部分可能是打印设置中最重要的一部分。在这里您可以编辑诸如构建板温度之类的内容，并控制每层的高度以及第一层的高度。您还可以调整挤出机在打印过程中的移动速度，并决定是否要按设计打印零件或仅使用花瓶模式打印其外壳。让我们花点时间了解一下这些选项中的每一个以及它们在生成增材工具路径中的作用：\n\
  \n- ** 打印床温度 (Temp C) **：这是一个特定于材料的输入，用于在开始打印过程之前设置打印床的温度。加热床有助于第一层的打印床附着力。在图 9.4\
  \ 中，打印床温度设置为 60°C，这是在使用 PLA 耗材打印时的推荐床温。如果您使用的是 ABS，则该输入为 85°C。\n- ** 层高 (mm) **：此输入指定每层的高度。您可以减小该值以获得更好的打印质量，或增大该值以加快打印速度。层高的上限和下限取决于喷嘴尺寸。\n\
  - ** 第 1 层高度 (mm) **：此输入指定 3D 打印的第一层的高度。通常，该输入应为喷嘴直径的 50 至 75%，以实现第一层的成功打印床附着。\n\
  - ** 移动速度 (mm/s) **：此输入指定挤出机在不挤出耗材时在点之间移动的速度。通常，您希望该输入尽可能接近打印机可处理的最高速度，以减少打印时间。\n\
  - ** 螺旋花瓶模式：** 激活后，这将使用一次连续的螺旋运动在活动设置中打印零件，以创建中空的单壁物体。此模式可实现快速打印时间，并在 3D 打印过程中避免任何移动和回抽动作。如果启用，**\
  \ 主体预设 ** 部分内的许多输入将被忽略，因为它们将不再适用。\n\n### 喷嘴预热设置\n\n如图 9.4 所示，位于 ** 打印设置编辑器 ** 的\
  \ ** 常规 ** 部分内的 ** 喷嘴预热设置 ** 子部分控制与在挤出机开始处理零件之前打印预热线相关的所有选项。让我们重点介绍一下您可以在预热线周围控制的一些关键功能：\n\
  \n- ** 喷嘴预热：** 默认启用，此选项将在打印床的前方、左侧、右侧或后方打印一条线。预热线的放置位置取决于增材设置中零件的排列以及打印床上未使用空间的可用性。打印预热线可为\
  \ 3D 打印做好喷嘴准备。通过打印预热线，您可以确保在打印零件之前耗材正在正确挤出。\n- ** 预热边缘间隙距离 (mm)：** 此输入控制预热线应距离构建板边缘多远。\n\
  - ** 预热最大长度 (mm)：** 此输入控制预热线的最大长度。我建议将此数字增加到与 3D 打印机构建板的 X 或 Y 尺寸相匹配。\n\n![](img/baa027bed101c08b496f1f420cee8a5b_272_0.png)\n\
  \n图 9.4 – FFF 打印设置的打印设置编辑器的常规选项卡\n\n在打印设置编辑器的常规部分中，您还可以控制附加 G-code 设置，如图 9.4 所示。默认情况下，您生成的任何\
  \ G 代码始终从 home 位置开始并在 park 位置结束。如果您的 3D 打印机支持，您还可以通过在此对话框中选中相应的复选框来生成 G2 和 G3 移动。此操作有助于创建\
  \ G-code 文件，其中用单行 G2/G3 文本而不是多行 G1 文本来表示给定切片中的弧形工具路径。如果您不熟悉，G2 用于顺时针弧线，G3 用于逆时针弧线。使用单行\
  \ G 代码表示弧线在文件大小方面更高效，并且可实现更高质量/更平滑的 3D 打印。\n\n## 主体预设\n\nFFF 打印设置的打印设置编辑器中的下一个部分是主体预设。默认情况下，Fusion\
  \ 360 的打印设置库中包含的所有打印设置都有两个主体预设。它们分别命名为 Normal 和 Strong。如果您选择其中一个预设，您可以在右侧更改其名称和描述，如图\
  \ 9.5 所示。在此图中，我们将预设名称从 Normal 更改为 Medium。\n\n![](img/baa027bed101c08b496f1f420cee8a5b_273_0.png)\n\
  \n图 9.5 – 更改主体预设名称和描述\n\n我们还可以右键单击主体预设并将其复制。复制主体预设后，您将在打印设置编辑器的浏览器底部看到一个新条目。在图 9.6\
  \ 中，您会看到在复制名为 Medium 的主体预设后添加了一个名为 Medium 1 的新条目。\n\n![](img/baa027bed101c08b496f1f420cee8a5b_274_0.png)\n\
  \n图 9.6 – 复制主体预设\n\n如果您回顾图 9.6，您可以看到在名为 Medium 的主体预设旁边有一个带有蓝色复选标记的齿轮图标。此图标表示该主体预设是默认预设。如果您选择一个非默认预设，您可以右键单击它并将其设为默认预设，如图\
  \ 9.7 所示。如果您对该打印设置进行此更改，则使用该打印设置创建的任何后续增材设置都将自动将 Medium 1 分配给该设置中的所有组件作为主体预设。\n\n\
  ![](img/baa027bed101c08b496f1f420cee8a5b_274_1.png)\n\n图 9.7 – 将主体预设设为默认\n\n如果我们通过选择其左侧的箭头展开给定的主体预设，如图\
  \ 9.8 中名为 Medium 的主体预设所示，我们可以看到控制主体预设设置的不同方面的许多条目，例如挤出、壳层、填充等。接下来，让我们深入了解这些设置并解释它们是什么。\n\
  \n## 挤出\n\n给定主体预设的挤出子部分内的输入字段控制在增材设置中用于打印主体的挤出机以及与该挤出机相关的某些设置。如果我们使用单挤出机 3D 打印机创建增材设置，则在编辑该设置的打印设置时，我们将只看到名为挤出和挤出机\
  \ 1 的子标题，如图 9.8 所示。只有在编辑与多挤出机打印机关联的打印设置时，我们才能在此对话框中看到额外的挤出机子标题。\n\n![](img/baa027bed101c08b496f1f420cee8a5b_275_0.png)\n\
  \n图 9.8 – PLA（直驱）打印设置的默认主体预设的挤出设置\n\n\n\n**挤出**子标题控制第一层的宽度以及带有裙边、裙摆和筏底尺寸的打印床粘附。它还具有修改关键刀具路径类型挤出宽度的输入，例如**外壁**、**填充**、**桥接**和**支撑**结构。在**挤出机\
  \ 1**子标题中，您可以修改另一个关键输入，**挤出机温度（Temp C）**。在*图 9.8*中，此输入显示的值为 215°C，这是 3D 打印 PLA 耗材的适当温度。如果我们要为\
  \ ABS 等不同材料编辑打印设置，此值将预先填充为适当的温度**250°C**。\n\n在下一节中，我们将学习如何控制与打印零件外表面相关的各种设置。我们将重点介绍如何修改外壁数量以及顶层和底层数量，以及如何避免每层开始时的表面缺陷。\n\
  \n## 外壳\n\n当为 FFF 切片模型时，切片软件首先做的事情之一是创建模型的壳体。**打印设置编辑器**中**主体预设**的**外壳**子部分中的选项允许我们完全控制这些选项以创建并切片该壳体。让我们看一下一些最常见的设置，您可能希望修改这些设置以生成具有光滑外表面的\
  \ 3D 打印件：\n\n- **外壁数量、顶层数量和底层数量**：如*图 9.9*所示，在给定主体预设的**外壳**部分中，您可以控制希望在组件周围具有多少条刀具路径线，以及希望切片软件包含多少顶层和底层。在切片模型时包含的外壁、顶层和底层数量越高，这些部分就越坚固。顶层和底层是独特的，因为切片软件会在这些层中添加\
  \ 100% 填充，使其完全实心。*图 9.9*显示了一个具有两个外壁的模型。对于图中显示的图层，第 121 层，红色线代表外壁，绿色线代表内壁。\n- **随机化\
  \ Z 缝合对齐**：激活时，此设置允许您分散模型外壁上可能存在的任何缺陷，使其不会全部与 Z 轴对齐。如果未选中，打印的模型可能会出现接缝/拉链效应。\n-\
  \ **先打印内壁**：在 3D 打印给定层时，挤出必须从某处开始。切片软件倾向于在模型外壁沿线的一点开始挤出每一层。激活时，此设置会强制挤出从给定切片的内壁开始。在*图\
  \ 9.9*中，内壁用绿色线表示。激活此复选框会强制给定层的开始处的任何缺陷隐藏在主体内壁内。\n\n![](img/baa027bed101c08b496f1f420cee8a5b_277_0.png)\n\
  \n图 9.9 – PLA（直驱）打印设置的默认主体预设的外壳设置\n\n通过修改这些选项，您可以使用 FFF 打印机切片和打印模型的壳体，从而获得零件所需的表面质量和强度重量比。在下一小节中，我们将学习如何修改零件内部的选项。\n\
  \n## 填充\n\n当为 FFF 切片模型时，术语填充代表 3D 打印零件的内部部分。此内部体积可以使用许多不同的形状制造。填充的目的是在保持尽可能坚固的同时最小化零件的重量并减少打印时间。Fusion\
  \ 360 在给定主体预设的填充子标题中位于填充图案下拉列表中提供了许多不同类型的填充图案，如图 9.10 所示。同一张图还显示了三个组件以 25% 密度的 Gyroid\
  \ 填充打印。请注意，所有零件的内部部分并非用耗材实心打印，而是主要以 Gyroid 风格的刀具路径制造为空心。\n\n> **重要说明**\n> \n> 对\
  \ Fusion 360 中所有可用填充图案的一项最新研究（记录在博客 https://www.autodesk.com/products/fusion-360/blog/how-to-build-sustainable-3d-printing-infill-practices/\
  \ 中）得出结论，Gyroid 填充是最可持续的填充类型，因为它打印速度最快，同时最大限度地减少耗材消耗。\n\n![](img/baa027bed101c08b496f1f420cee8a5b_278_0.png)\n\
  \n图 9.10 – PLA（直驱）打印设置的默认主体预设的填充设置\n\n通过修改这些选项，您可以使用 FFF 打印机切片和打印模型的内部，从而获得轻质零件，可以更快地打印，同时消耗更少的材料和能源。在下一小节中，我们将学习如何修改选项以在打印第一层时实现与构建板良好的粘附。\n\
  \n## 打印床粘附\n\n在为 FFF 3D 打印切片模型时，最重要的考虑因素之一是打印床粘附问题。3D 打印中的关键故障是由于零件粘附在打印床上的问题而发生的。Fusion\
  \ 360 在给定主体预设的打印设置编辑器的打印床粘附子标题中提供了几种工具来克服这种潜在故障。\n\n在打印床粘附子标题中，您可以控制要禁用冷却风扇的层数，以便前几层可以在没有风扇提供的冷却效果的情况下打印。此外，您可以从\
  \ Fusion 360 提供的三种打印床粘附选项中选择一种：\n\n- **裙摆/裙边**：即使在**打印床粘附类型**下拉列表中裙摆和裙边有明确的选项可供选择，在切片模型时它们实际上会为您提供相同的刀具路径。裙摆和裙边都会跟随零件第一层的周长，并在外周长周围铺设额外的刀具路径线。您可以控制要在主体周长周围添加多少圈裙摆或裙边。如果您为**打印床粘附类型**选择裙摆，您将有一个额外的控制，即裙摆与主体周长之间的距离。如果在此字段中输入\
  \ 0，您基本上会生成裙边。由于这两种选项几乎可以互换，在模拟刀具路径时，Fusion 360 在图例中将裙摆和裙边显示为相同的颜色，如图 9.9 所示。\n\
  - **筏底**：当使用更易翘曲并导致床粘附问题的材料进行 3D 打印时，您可以选择使用筏底，因为筏底有助于稳定模型并创建坚固的基座以打印零件的其余部分。如果您为**打印床粘附类型**选择**筏底**，Fusion\
  \ 360 将激活额外的**筏底**设置，如图 9.11 所示。筏底的默认设置将产生一个三层**筏底**对象，底层、中层和顶层的填充密度各不相同。您还可以控制筏底与模型第一层周长的边界偏移。\n\
  \n![](img/baa027bed101c08b496f1f420cee8a5b_279_0.png)\n\n图 9.11 – 打印床粘附设置\n\n通过修改这些选项，您可以在打印第一层时实现与构建板良好的粘附。在下一小节中，我们将学习如何修改选项以切片并为\
  \ FFF 增材设置中可在 Fusion 360 中生成的支撑结构生成刀具路径。\n\n## 支撑\n\n即使可以使用桥接技术制造某些悬垂面，在大多数情况下，当悬垂角度超过\
  \ 45 度时，我们依赖于生成支撑结构，以便零件的朝下表面可以成功打印。\n\n在为 FFF 打印准备模型时，Fusion 360 提供三种支撑类型：**体积支撑**、**杆支撑**和**设定支撑**。设定支撑主要用于使用金属耗材进行\
  \ 3D 打印或使用金属粘结剂喷射技术进行 3D 打印，以帮助在烧结过程中支撑零件。为了生成设定支撑，我们需要访问增材制造扩展。我们在此不再进一步介绍设定支撑，因为它们不适用于我们展示的任何示例。\n\
  \n在 FFF 机器的增材设置中，您可以生成体积支撑和杆支撑，并且我们可以混合匹配支撑类型，这意味着我们可以用体积支撑支撑一个面，用杆支撑支撑另一个面。因此，Fusion\
  \ 360 还允许您控制如何切片并为这些支撑结构生成刀具路径。您可以控制为给定支撑结构使用的挤出机，以及杆支撑与体积支撑的刀具路径生成中使用多少外壁。您还可以控制在主体预设的**支撑**子标题中生成支撑结构刀具路径时所需的顶层和底层数量以及填充密度，如*图\
  \ 9.12*所示。\n\n我在这个部分想要强调的一个设置是**支撑到主体水平间隙（mm）**。此输入控制 Fusion 360 在支撑结构与零件周长上的任何垂直壁之间留出的水平空间。如果您增加此数值，支撑结构与零件在垂直壁沿线的间隙将更大，从而消除零件与支撑结构之间可能的粘合。此设置不控制支撑与零件朝下表面之间的距离。我们将在*第\
  \ 10 章*中介绍如何控制此类选项，其中我们讨论如何生成支撑结构。\n\n\n\n\n![](img/baa027bed101c08b496f1f420cee8a5b_281_0.png)\n\
  \n图 9.12 – 支持设置\n\n通过修改这些选项，您可以完全控制 Fusion 360 对 FFF 设置中常用的体积和杆状支撑进行切片的方式。在下一小节中，我们将学习如何修改选项以控制\
  \ Fusion 360 在 FFF 增材设置中挤出材料的速度。\n\n## 速度\n\nFFF 的主要缺点之一是打印大型零件所需的时间。这就是为什么您可能想要在所选打印设置的打印设置编辑器中的主体预设部分修改速度设置的原因。这些设置非常易于理解。您可以控制各种挤出类型的执行速度，例如第一层、外壁、填充、支撑、桥接和底座。\n\
  \n如果您激活 **Acceleration** 复选框，您还可以控制行程和挤出动作的 **Acceleration** 输入。此外，Fusion 360 还允许您控制打印时的最大瞬时速度变化。此设置称为\
  \ **Jerk**，位于 **Speed** 子标题菜单底部，如 *Figure 9.13* 所示。在对 **Speed**、**Acceleration**\
  \ 和 **Jerk** 设置进行更改之前，您应该了解 3D 打印机的规格，以免超过基于机器限制的速度和加速度值。\n\n![](img/baa027bed101c08b496f1f420cee8a5b_282_0.png)\n\
  \n图 9.13 – 速度设置\n\n通过编辑 **Print Setting Editor** 中的 **Speed** 子部分中的选项，您可以完全控制 3D\
  \ 打印的速度、加速度和加速度变化行为。在下一小节中，我们将介绍如何修改喷嘴在不挤出材料时移动的速度。\n\n## 行程\n\n行程线是在 FFF 3D 打印过程中喷嘴无挤出时的移动。**Body\
  \ Presets** 中的 **Travel** 子标题控制切片期间行程的各种输入。\n\n如果您遇到挤出机撞到打印件或由于材料渗出而在模型表面产生凸块的问题，您可能希望激活\
  \ Rapid Z Lift。此设置会在打印过程中从模型的一个部分移动到另一个部分时将挤出机抬高一定距离。这应可防止喷嘴撞到零件先前挤出的部分，有助于减少凸块并降低打印失败率。然而，此选项会增加打印时间。因此，您可能还希望启用\
  \ Rapid Z Lift Diagonal Move 以最大限度地减少执行 Rapid Z Lift 操作时花费的时间。Fusion 360 默认对所有打印设置执行\
  \ Nozzle Wipe 操作。此命令会在挤出机关闭的情况下将喷嘴沿刚完成的挤出物拖动一定距离，以帮助清洁喷嘴并可能最大限度地减少拉丝。\n\n![](img/baa027bed101c08b496f1f420cee8a5b_283_0.png)\n\
  \n图 9.14 – 行程设置\n\n通过修改这些选项，您可以实现整体打印时间减少，并通过避免挤出机与零件之间的碰撞来提高成功打印的机会。在下一小节中，我们将学习如何在增材设置中切片之前修改\
  \ Fusion 360 中对零件进行三角剖分的选项。\n\n## 三角剖分\n\n当我们在增材设置中使用实体体时，为了对它们进行切片并创建刀具路径，Fusion\
  \ 360 首先对这些体进行三角剖分并将其转换为网格表示。为了进行此转换，它依赖于给定主体预设的三角剖分子标题中显示的值。我们已经在第 5 章中详细介绍了如何对模型进行三角剖分。图\
  \ 9.15 中显示的三角剖分设置与我们在 Fusion 360 设计工作区中将实体体转换为网格体时介绍的相同三角剖分设置相对应。默认情况下，用于所有打印设置的三角剖分设置使得\
  \ Fusion 360 会创建高质量的网格，以便用于切片模型的网格体是实体体的准确表示。\n\n![](img/baa027bed101c08b496f1f420cee8a5b_284_0.png)\n\
  \n图 9.15 – 三角剖分设置\n\n现在我们已经强调了如何在本地打印设置库中对打印设置进行更改，是时候将此打印设置分配给我们的活动增材设置了。如图 9.16\
  \ 所示，我们可以选择 ADDITIVE 设置，右键单击并编辑它。当我们编辑设置时，我们可以选择新的打印设置。我们必须导航到打印设置库中“我的打印设置”部分下的本地文件夹，并选择我们最近自定义的名为\
  \ PLA (Direct Drive) - CUSTOMIZED 的打印设置，然后按 Select 和 OK 完成设置编辑。\n\n![](img/baa027bed101c08b496f1f420cee8a5b_285_0.png)\n\
  \n图 9.16 – 在增材设置中选择自定义打印设置\n\n一旦我们选择了本章前几节中修改的打印设置，您会注意到活动设置现在显示一个名为 PLA (Direct\
  \ Drive) - CUSTOMIZED 的新条目，并且在此条目下显示一个名为 Medium 的主体预设，表明我们的零件将使用该主体预设进行切片。\n\n![](img/baa027bed101c08b496f1f420cee8a5b_285_1.png)\n\
  \n图 9.17 – 在浏览器中观察所选打印设置和主体预设\n\n在本节中，我们重点介绍了 FFF 3D 打印的各种打印设置。我们讨论了如何从 Fusion 360\
  \ 库复制给定的打印设置到我们的本地库。我们介绍了如何修改该打印设置并演示了各种设置对模型支撑和切片方式以及刀具路径生成的影响。在下一节中，我们将开始查看其他\
  \ 3D 打印技术的打印设置。\n\n## SLA 和 DLP 打印设置的概述\n\nFusion 360 的 **MANUFACTURE** 工作区中的增材设置不仅仅适用于桌面\
  \ FFF 打印机。通过使用 Fusion 360，您可以为使用 **stereolithography (SLA)** 和 **digital light processing\
  \ (DLP)** 的树脂基打印机设置打印。就像我们在上一节中从 Fusion 360 的库中复制现有的 FFF 打印设置到本地库并对其进行编辑一样，我们将在本节中对\
  \ SLA 和 DLP 打印设置执行相同的操作。\n\n*Figure 9.18* 显示了一个名为 **Autodesk Generic DLP** 的打印设置，已从\
  \ Fusion 360 的 **Print Setting Library** 复制到 **My print settings | Local** 以进行自定义。正如同一张图中所示，DLP\
  \ 打印设置浏览器结构与 FFF 打印设置浏览器结构非常相似。此 DLP 打印设置有三个部分，名为 **Information**、**General** 和\
  \ **Body Presets**。*Figure 9.18* 显示了打印设置的 **General** 子部分，您可以在其中配置各种构建参数。**Configure\
  \ Build Parameter (EBPA) Settings** 中的主要可编辑字段是 **Layer Thickness**。即使在此对话框中未显示层厚度的单位，它们也是微米，并且可以在\
  \ **Print Setting Library** 中的 **Information** 面板中选择打印设置时看到。\n\n在 **PNG Export**\
  \ 子部分中，前六个输入对于生成具有正确尺寸的所需 PNG 文件至关重要：\n\n- **Min X** 和 **Min Y**：这些输入控制在构建体积内每层捕获的图像的最小\
  \ X 和 Y 坐标。值为 0 表示您将从构建平台的左下角开始捕获所有图像。如果您想捕获整个构建，我不建议更改这些输入。\n- **Size X** 和 **Size\
  \ Y**：这些输入控制在构建体积内每层捕获的图像的最大 X 和 Y 坐标。这两个输入的单位为毫米。您绝对希望更改这些输入以匹配打印机可打印的 X 和 Y 尺寸。例如，如果您的打印机具有\
  \ 320 毫米乘 240 毫米的可打印构建体积，您将在切片模型之前在此打印设置中分别在 **Size X** 和 **Size Y** 输入字段中输入这些数字。否则，从\
  \ Fusion 360 导出的图像将只是整个构建区域的一个子部分。\n- **Image Size X** 和 **Image Size Y**：这些输入控制您将导出的图像的像素大小。通常，这些数字应为您在\
  \ **Size X** 和 **Size Y** 中输入的数字的倍数。例如，如果您有一台可打印构建区域为 320 x 240 毫米的打印机，您可以输入 **Image\
  \ Size X** 和 **Image Size Y** 输入分别为 640 和 480 像素。如果您输入的值不是 **Size X** 和 **Size Y**\
  \ 值的倍数，您将在切片过程中获得失真的图像，因此在打印过程中会得到失真的物体。\n\n\n\n\n-   **翻转图像**：根据投影仪的放置位置和型号（LCD\
  \ 与 DLP），您使用的 3D 打印机可能需要为所有切片导出镜像图像，以便不会打印出物体的镜像。\n-   **PNG 文件名前缀**：不同的 3D 打印机对\
  \ PNG 文件的命名有不同的要求。使用此输入字段，您可以通过添加前缀来自定义每个 PNG 的命名方式。如果您仅保留现有的前缀 `image_`，生成的 PNG\
  \ 文件将被命名为 `image_000.png`、`image_001.png`，依此类推。\n\n![](img/baa027bed101c08b496f1f420cee8a5b_287_0.png)\n\
  \n图 9.18 – Autodesk 通用 DLP 打印设置\n\n创建使用 Autodesk 通用 SLA/DLP 打印机和 **Autodesk 通用 DLP**\
  \ 打印设置的增材设置后，如果您在 **增材** 选项卡的 **操作** 面板中选择 **创建机器构建文件**，您将能够按照规格将每个切片导出为 PNG 文件，并压缩为单个\
  \ ZIP 文件。然后，您可以在将文件传输到 3D 打印机用于制造模型之前，进一步编辑 ZIP 文件以包含打印机可能需要的任何其他 TXT 或 XML 文件。\n\
  \n我接下来要重点介绍的打印设置是 **Autodesk 通用 SLA** 打印设置。如果您从 Fusion 360 的 **打印设置库** 中选择此打印设置并将其复制到本地库中，您可以在\
  \ **打印设置编辑器** 中编辑打印设置，如 *图 9.19* 所示。与 **Autodesk 通用 DLP** 打印设置和所有 FFF 打印设置一样，**Autodesk\
  \ 通用 SLA** 打印设置包含名为 **信息**、**常规** 和 **主体预设** 的子部分。**常规** 子部分是我们可以在其中以微米为单位编辑 **层厚**\
  \ 的位置。此打印设置允许我们创建一个机器构建文件，该文件生成 **立体光刻轮廓 (SLC)** 文件或 ZIP 文件。此 ZIP 文件包含一个或多个 SLC\
  \ 文件。SLC 文件是包含 SLA 打印机切片信息的<|message|>。 在打印设置中，您可以控制是否要为每个零件创建唯一文件和/或为在增材设置期间可能生成的每个支撑结构创建唯一文件。您还可以选择在导出\
  \ SLC 文件时使用组件的名称作为文件名。Fusion 360 会自动为支撑结构名称添加后缀。默认后缀是 _s。如果您使用默认设置并导出 SLC ZIP 文件，它将包含以下两个\
  \ SLC 文件：\n\n-   Component1_Body1.slc\n-   Component1_Body1_s.slc\n\n这假设您的增材设置包含一个名为\
  \ Component 1 的单个主体组件，并且您已为其添加了支撑结构。\n\n![](img/baa027bed101c08b496f1f420cee8a5b_288_0.png)\n\
  \n图 9.19 – Autodesk 通用 SLA 打印设置\n\n除了通用的 SLA 和 DLP 打印设置外，Fusion 360 还为树脂打印机提供了三个机器厂商特定的打印设置。第一个是\
  \ **Anycubic Photon Mono**。如果您访问 **打印设置库**，可以搜索此打印设置，并在将其复制到本地库后在 **打印设置编辑器** 中查看其输入。如\
  \ *图 9.20* 所示，此打印设置看起来与通用的 SLA 或 DLP 打印设置非常相似，但有一个主要区别。此打印设置的 **常规** 子部分包含四个与给定材料应如何切片相关的参数输入。您可以控制诸如曝光时间和给定增材设置的底部层数等输入。您还可以控制打印机在每次切片固化时应暂停的时间，单位为秒。\n\
  \n![](img/baa027bed101c08b496f1f420cee8a5b_289_0.png)\n\n图 9.20 – Anycubic Photon\
  \ Mono 打印设置\n\n如果您拥有韩国制造商 Carima 的 DLP 3D 打印机，您会注意到与这些打印机关联的打印设置具有非常有限的控制集。如 *图\
  \ 9.21* 所示，在编辑与 Carima 3D 打印机相关的打印设置时，您唯一可以修改的打印设置是 **层厚**。这是因为所有关键控制都已在 Fusion\
  \ 360 中设置，由打印机制造商提供。这意味着如果您需要对这些打印设置进行进一步自定义，您需要联系 Carima 支持，他们将能够提供包含自定义参数值的文件，您只需将其加载到\
  \ Fusion 360 中的自定义打印设置中即可。\n\n![](img/baa027bed101c08b496f1f420cee8a5b_290_0.png)\n\
  \n图 9.21 – Carima DM 400 通用打印设置\n\n如果您拥有 Prusa Research 的 SLA 3D 打印机，例如 SL1S SPEED，您会看到可以修改的额外输入，例如曝光时间、初始曝光时间和渐隐层。Fusion\
  \ 360 的打印设置库中为此特定打印机包含的打印设置如图 9.22 所示。该图显示了 Prusa Orange Tough 树脂的常规打印设置。如果您使用不同的树脂，您可能需要修改曝光时间输入并相应地自定义打印设置，以便在打印过程中为树脂提供足够的固化时间。\n\
  \n![](img/baa027bed101c08b496f1f420cee8a5b_290_1.png)\n\n图 9.22 – Prusa SL1S SPEED，Prusa\
  \ Orange Tough 打印设置\n\n在本节中，我们介绍了 SLA 和 DLP 3D 打印机打印设置的最重要输入。我们强调了您可以通过将其保存到本地库来自定义打印设置的方式。我们演示了无论打印设置类型如何，都可以编辑\
  \ **层厚**。我们强调了通用 SLA 和 DLP 打印机打印设置与 Anycubic、Carima 和 Prusa 的机器厂商特定打印设置之间的差异。在下一节中，我们将重点介绍如何为设计的部分分配唯一的打印设置以实现特定的制造标准。\n\
  \n## 为主体分配唯一的打印设置\n\n在前几节中，我们介绍了如何为 FFF 和 SLA/DLP 3D 打印机选择和修改打印设置。我们强调了每个打印设置都包含多个主体预设，以及您可以修改每个主体预设中的信息以根据需要自定义打印设置。对于\
  \ FFF 打印机，随 Fusion 360 库提供的打印设置包括 **普通** 和 **强度** 零件打印选项的预设。我们讨论了如何将默认预设从 **普通**\
  \ 更改为次要预设，例如 **强度** 或我们可以通过复制现有预设创建的自定义预设。在本节中，我们将讨论如何将这些预设分配给增材设置中的特定主体。\n\n为了演示此工作流程，我们将使用第二个制造模型创建一个第二个设置，如图\
  \ 9.23 所示。如图所示，此设置适用于 FFF 打印机（**Prusa i3 MK3S +**）并使用 **ABS (Direct Drive)** 打印设置。此设置包括原始设计文档中存在的全部三个组件。它们已使用\
  \ **增材排列** 自动沿 Y 轴定位，**对象间距** 输入为 5 毫米。\n\n默认情况下，全部三个组件将使用 **普通** 主体预设，因为这是 **ABS\
  \ (Direct Drive)** 打印设置的默认预设。但是，我们可以轻松地为所选主体分配不同的主体预设。如果我们从浏览器中选择 **增材排列** 行项目并右键单击它，我们可以选择\
  \ **分配主体预设** 命令。这将打开一个名为 **分配主体预设** 的新对话框，并显示所选打印设置中的可用主体预设。我们可以在此对话框中看到 **普通**\
  \ 主体预设和 **强度** 主体预设。**强度** 主体预设行以蓝色突出显示，等待我们选择要分配它的主体。\n\n![](img/baa027bed101c08b496f1f420cee8a5b_292_0.png)\n\
  \n图 9.23 – 增材设置中的分配主体预设对话框\n\n要将 **强度** 主体预设分配给给定对象，我们只需选择该主体。选择构建体积中间的主体后，如图 9.24\
  \ 所示，**分配主体预设** 对话框将自动更新，我们将看到 **普通** 主体预设分配给两个主体，而 **强度** 主体预设分配给我们刚刚选择的一个主体。\n\
  \n![](img/baa027bed101c08b496f1f420cee8a5b_292_1.png)\n\n图 9.24 – 为所选主体分配非默认主体预设\n\
  \n\n\n在 **ASSIGN BODY PRESETS** 对话框内选择 **OK** 按钮后，浏览器将自动更新并在活动设置的 **ABS (Direct\
  \ Drive)** 文件夹下同时显示 **Normal** 主体预设和 **Strong** 主体预设，如图 9.25 所示。这表明活动设置中使用了多个主体预设的主体。为了演示不同主体预设对不同主体的影响，我们可以从浏览器中选择\
  \ **Additive Toolpath** 项目并使用 **Ctrl + G** 键盘快捷键生成刀具路径。接下来，我们可以激活位于 **ADDITIVE**\
  \ 选项卡内的 **ACTIONS** 面板中的 **Simulate Additive Toolpath** 命令：\n\n![](img/baa027bed101c08b496f1f420cee8a5b_293_0.png)\n\
  \n图 9.25 – 模拟增材制造设置的增材刀具路径\n\n当我们可视化增材刀具路径时，可以放大模型，以便更近距离地查看两个相邻部件，如图 9.26 所示。如果取消选中\
  \ **Show Machine** 复选框，成型平台将被隐藏，以便我们可以轻松区分刀具路径类型的颜色。\n\n在同一图中，您会注意到图像底部旋钮只有一个红色线条（外周）以及一条绿色线条（内周）。顶部旋钮的外周为红色，但当前显示的层（第\
  \ 41 层）的内周刀具路径线有四条绿色线条。这是因为 **ABS (Direct Drive)** 打印设置在 **Strong** 主体预设的 **Shell**\
  \ 子标题下的 **Number of Perimeters** 字段中输入了 5。\n\n![](img/baa027bed101c08b496f1f420cee8a5b_294_0.png)\n\
  \n图 9.26 – 模拟使用两种不同主体预设的 FFF 设置的增材刀具路径\n\n我们可能想要为所选主体分配不同的主体预设的原因有很多。在前面的示例中，我们演示了如何使用不同的刀具路径设置打印不同的主体，例如周数以使其中一个比另一个更强。另一个我们可能想要使用主体预设并将其分配给特定主体的原因是为了控制用于打印特定主体的挤出机。\n\
  \n在下一个示例中，我们有一个由两个主体组成的单个部件。部件名为 2BC，主体名为 Body1-Yellow 和 Body2-Red，如图 9.27 所示。如果我们使用具有多个挤出机的\
  \ 3D 打印机（例如 Raise 3D Pro 2）创建增材设置，我们可以分配打印设置并随后控制哪个主体使用哪个挤出机打印。在此示例中，在选择打印机后，我们将分配\
  \ PLA (Bowden Tube) 作为打印设置。接下来，我们可以选择打印设置并右键单击以编辑它。这也允许我们自定义主体预设的名称。图 9.27 演示了如何将默认主体预设的名称从\
  \ Normal 改为 Yellow。\n\n![](img/baa027bed101c08b496f1f420cee8a5b_295_0.png)\n\n图\
  \ 9.27 – 在打印设置中自定义主体预设的名称\n\n将现有主体预设分别重命名为 Yellow 和 Red 后，我们必须更改每个主体预设所依赖的挤出机。如图\
  \ 9.28 所示，我们可以进入 Extrusion 子标题，并将 Red 主体预设的 Part Extruder 从 Extruder 1 改为 Extruder\
  \ 2。\n\n![](img/baa027bed101c08b496f1f420cee8a5b_295_1.png)\n\n图 9.28 – 修改主体预设的部件挤出机\n\
  \n为每个主体预设分配唯一的挤出机后，我们可以在 **Print Setting Editor** 对话框中选择 **OK** 以接受更改。接下来，我们必须为给定主体分配主体预设。我们可以通过在浏览器中右键单击\
  \ **PLA (Bowden Tube)** 打印设置并选择 **Assign Body Presets** 来完成此操作，如 *图 9.29* 所示。接下来，我们可以选择希望使用\
  \ **Extruder 2** 打印的主体。**ASSIGN BODY PRESETS** 对话框现在显示一个主体将使用名为 **Yellow** 的主体预设打印，第二个主体将使用名为\
  \ **Red** 的主体预设打印。单击 **OK** 后，我们的主体预设分配现已完成。\n\n![](img/baa027bed101c08b496f1f420cee8a5b_296_0.png)\n\
  \n图 9.29 – 为主体分配主体预设\n\n如 *图 9.30* 所示，我们的浏览器已更新，我们可以看到 **Yellow** 和 **Red** 均作为此设置中处于活动状态的主体预设。在生成增材刀具路径并像前一个示例中那样模拟它之后，我们可以切换切片模型的各个层。*图\
  \ 9.30* 显示了第 310 层的快照。\n\n![](img/baa027bed101c08b496f1f420cee8a5b_297_0.png)\n\n\
