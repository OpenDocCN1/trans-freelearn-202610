  个组件，如图 14.7 所示。每次复制粘贴操作也在时间轴中以功能的形式记录。


  ![](img/baa027bed101c08b496f1f420cee8a5b_412_1.png)


  图 14.7 – 复制单个组件以创建 10 组件装配体




  Fusion 360 具有复制和粘贴组件的原生功能。然而，如果你想创建多个与原始组件位置相同的新组件，就必须按需多次依次使用复制和粘贴命令。这可能需要很长时间，具体取决于你想要复制的数量。利用插件，例如本节演示的插件，来自动化此过程，将节省大量时间，并消除随着组件数量增加在复制粘贴过程中可能引入的任何潜在错误。


  本节主要介绍了如何使用插件在 **设计** 工作区中自动化工作流程。在下一节中，我们将重点介绍如何通过自定义机器、打印设置和预设的库来自动化 **制造** 工作区中的某些工作流程。


  ## 自定义预设和使用模板


  在之前的章节中，我们演示了如何使用 Fusion 360 的 **制造** 工作区创建增材制造设置。我们还展示了如何定向零件、在构建体积内排列它们并生成支撑。我们重点介绍了如何模拟增材制造刀具路径并生成必要的机床文件。


  在本节中，我们将展示如何自定义 Fusion 的机器和打印设置库，以便加快创建增材制造设置的过程。我们还将介绍如何自定义增材制造设置中各种对话框的默认输入，以及如何创建预设以将多个自定义支撑操作组合成单个命令，从而有效地为我们的模型生成支撑结构。


  尽管创建增材制造设置的过程很简单，但它确实需要在每个设置中明确选择机器和打印设置。在 Fusion 360 的 **制造** 工作区中，我们可以在 **管理**
  面板内访问 **机器库** 对话框，如图 14.8 的标注 1 所示。我们还可以将 3D 打印机从 Fusion 360 库复制并粘贴到我们自己的云、本地或链接库中，如标注
  2 所示。以下图示显示了一台名为 **Prusa i3 MK3S+** 的 3D 打印机，已保存在“我的机器”下的 **本地** 文件夹中。每当我们从 Fusion
  360 的机器库将一台机器复制并粘贴到“我的机器”中的一个文件夹时，关联的后处理文件 (*.cps)，如标注 3 所示，会自动分配。然而，在使用该机器创建增材制造设置时，我们仍然必须指定打印设置。为了加快设置创建过程，我们还可以通过单击标注
  4 所示的文件夹图标将打印设置与该机器关联。选择打印设置库中的 **PLA (Direct Drive).printsetting** 后，我们的本地机器现在就可以在设置创建中使用。在设置创建期间从“我的机器”的本地文件夹中选择此机器后，我们无需再选择打印设置，因为该打印设置会自动与机器库中的
  **PLA direct drive** 打印设置关联。


  ![](img/baa027bed101c08b496f1f420cee8a5b_414_0.png)


  图 14.8 – 将打印设置关联以自定义机器


  创建此机器和打印设置后，我们可能需要在 3D 打印机的构建体积内定向组件。图 14.9 显示了如何在 ADDITIVE 选项卡的 POSITION 面板内访问自动定向命令。在此示例中，我们可以选择名为
  Centrifugal fan 的组件作为要定向的目标组件。


  > 重要提示

  > 如第 8 章所述，在计算支撑面积和支撑体积时，自动定向命令会查找从水平面起低于特定角度的悬垂角度的零件段，以便对定向研究的结果进行排序。


  制造设置中对话框中的任何输入都可以通过选择输入字段右侧的垂直省略号图标来自定义，如图 14.9 所示。选择省略号图标后，将显示一个下拉菜单，允许你将当前输入保存为用户默认值。通过自定义输入并将其保存为用户默认值，你可以在增材制造设置中执行任何定位或支撑操作时重复使用它。


