  在机器库中自定义机器并为打印机选择关联的打印设置将加快增材设置创建的速度。 自定义用户默认值将允许您使用自己的偏好利用自动定向和增材排列功能。 为定向、排列或支撑结构创建自定义模板将使您能够基于机器的打印设置和材料创建一致的增材设置，从而消除可能因人为错误而引入的不一致。
  在下一节中，我们将重点介绍如何使用脚本自动化整个过程，以便我们可以完全消除与 Fusion 360 的 MANUFACTURE 工作区的任何交互，以创建增材设置。


  ## 使用脚本自动化增材制造工作流程


  在上一节中，我们介绍了如何在生成增材设置时将我们的偏好保存为用户默认值并创建模板，以便将这些模板重新应用于后续的增材设置。


  使用这些技术将最大限度地减少我们与 Fusion 360 用户界面的交互，并帮助我们消除每个设置之间的一致性。 我们可以通过利用脚本将这一概念提升到下一个层次，完全消除我们与
  Fusion 360 的 MANUFACTURE 工作区的交互。


  如果我们始终使用相同类型的机器、打印设置、零件定向和排列选项以及支撑结构设置，我们就可以从利用自定义脚本自动化整个工作流程中受益。 如本章第一部分所述，我们可以通过
  UTILITIES 选项卡的 ADD-INS 面板访问 Scripts and Add-Ins 命令，如图 14.16 中标注 1 所示。 Scripts and
  Add-Ins 对话框中的 Scripts 选项卡列出了多个基于 Python 和 C++ 的示例脚本，您可以执行这些脚本来自动化某些工作流程，如标注 2 所指示。
  选择某个脚本后，您可以展开 Details 部分，如标注 3 所指示，以了解有关该脚本执行的操作的更多信息并检查其安装路径。


  ![](img/baa027bed101c08b496f1f420cee8a5b_421_0.png)


  图 14.16 – Fusion 360 包含的示例脚本


  如果您想创建自己的 Python 脚本或编辑现有脚本，您需要下载 Visual Studio Code 以编辑或调试给定的脚本。 如果您的计算机上未安装 Visual
  Studio Code 软件，在选择脚本并按 Edit 后，Fusion 将显示 Download Visual Studio Code 对话框，如图 14.17
  所示。 如果您选择 OK，它将自动从 Microsoft 下载并安装 Visual Studio Code 软件。


  ![](img/baa027bed101c08b496f1f420cee8a5b_421_1.png)


  图 14.17 – 下载并安装 Visual Studio Code 以编辑和调试基于 Python 的脚本


  Fusion 360 具有丰富的 **应用程序编程接口 (API)**，允许您通过创建自己的脚本和插件来自定义软件。 我们在本章第一部分中介绍的从 Autodesk
  App Store 下载的应用程序都是使用 Fusion 的 API 创建的，以自动化某些工作流程。 如果您发现自己有自动化某个工作流程的想法，但没有相应的应用程序，您可以创建自己的脚本或应用程序。
  要了解有关 Fusion 360 脚本的更多信息，请参考以下链接中的 Fusion 360 API 文档：https://help.autodesk.com/view/Fusion360/ENU/?guid=GUID-A92A4B10-3781-4925-94C6-47DA85A4F65A。
  该链接包含 Fusion API 的完整产品文档，并在图 14.18 中显示：


  ![](img/baa027bed101c08b496f1f420cee8a5b_422_0.png)


  图 14.18 – Fusion 360 API 的在线文档


  在此网页中，如果您向下滚动并导航到如图 14.19 中标注 1 所指示的 **示例程序** 部分，您将能够找到 **CAM** 部分。 在展开 **CAM**
  标题后，如标注 2 所示，您将在 **通用** 文件夹中找到 **增材制造 API 示例**，如标注 3 所示。 此页面包含一个基于 Python 的代码示例，可自动使用
  FFF 打印机和适当的打印设置创建增材设置。 要使用此代码示例，您首先需要复制 Python 代码。 选择如图 14.19 中标注 4 所指示的 **复制代码**
  命令。


  ![](img/baa027bed101c08b496f1f420cee8a5b_423_0.png)


  图 14.19 – 查找增材制造 API 示例


  在 Fusion 的 Scripts and Add-Ins 对话框中，您可以单击 My Scripts 旁边的 + 图标来创建新脚本。 此操作将填充 Create
  New Script or Add-In 对话框，如图 14.20 所示。 在此示例中，我们将创建基于 Python 的脚本，因此我们必须选择 Script 和
  Python 的单选按钮。 我们必须为脚本提供一个新名称； 让我们使用 FFF Setup。 然后，我们可以输入描述。 我们还可以将自己的姓名输入 Author
  字段并定义 Python 脚本文件将被保存的文件夹位置。 在输入所有必要信息后，单击 Create 按钮以生成一个空的 Python 脚本。


  ![](img/baa027bed101c08b496f1f420cee8a5b_424_0.png)


