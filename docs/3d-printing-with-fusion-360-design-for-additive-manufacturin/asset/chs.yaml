  **增材** 选项卡的 **支撑** 面板中选择 **实体体积支撑** 命令来访问此对话框，以进行使用 FFF 3D 打印机的增材制造设置。


  如以下图所示，此选项卡有两个输入字段 – **零件顶部距离** 和 **零件底部距离**。这些字段的默认输入为 0.3 毫米。每个输入字段都有一个与其关联的参数名称，你可以在
  **制造** 工作区中的任何对话框以及使用 Fusion API 创建脚本或插件时重复使用。这些参数名称也可以用作 **编辑表达式** 对话框中的等式的一部分，或在输入其他输入字段时使用。


  图 14.10 显示了我们如何简单地复制参数名称，如标注 1 所示，并将其粘贴到不同的输入字段中，如标注 2 所示，以创建等式，其中 **零件顶部距离** 输入为
  **零件底部距离** 输入值的一半。


  ![](img/baa027bed101c08b496f1f420cee8a5b_416_0.png)


  图 14.10 – 使用参数名称编辑输入


  现在我们已经介绍了如何自定义用户输入并使用参数，我们可以转换思路，重点关注将多个操作，如排列零件、执行自动定向研究和创建支撑结构，组合到单个模板中。


  为了演示如何使用模板，让我们创建一个名为 Centrifugal fan - SLA 的新 Fusion 文档。此 Fusion 文档具有使用 SLA 打印机的增材制造设置，如图
