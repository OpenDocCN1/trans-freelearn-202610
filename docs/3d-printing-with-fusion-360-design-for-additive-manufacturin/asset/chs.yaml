  在模板内为每个支撑操作定义要支撑的模型并生成支撑结构后，Fusion 360 将显示支撑。 在名为 Enclosure-SLA 的文档中重用我们在设置名为 Centrifugal
  fan-SLA 的 Fusion 文档时创建的两个支撑操作模板的结果如图 14.15 所示。


