- '# Fusion 360 3D 打印：增材制造设计，并提升你的仿真和打印准备技能





  我将本书献给我家人。我全心全意爱你们。致我的妻子 Marlene，你一直是我的冠军和最大的支持者，不仅在撰写本书期间，而且在我们共同的人生旅程中。致我的儿子 Kerem
  和 Koray，感谢你们在无数次晚餐对话中倾听我谈论 3D 打印，并感谢你们关于下一步要 3D 打印什么的所有想法。致我的父母 Bijen 和 Suat。感谢你们无尽的支持、爱和灵感。


  ## 前言


  我与 Sualp Ozel 相识并共事近七年，作为设计仿真和增材制造领域的领先专家之一，每当我需要了解该领域的最新发展和应用时，他都是我的首选。在本书中，Sualp
  带您踏上从增材制造设计、结构仿真和打印准备到工艺仿真和工作流自动化的学习之旅。


  第一部分将让您熟悉 Fusion 360 的基础知识，从如何打开新文件或将现有模型上传到 Fusion 软件进行存储。Sualp 演示了如何使用 Fusion
  检查和修复损坏的网格文件，以及如何编辑模型以便使用各种 3D 打印技术有效进行 3D 打印。该部分还涵盖了如何将 Fusion 的自动化建模、拓扑优化和应力仿真功能结合使用，以生成满足性能和制造标准的实用零件。


  本书还涵盖了零件的掏空和晶格化，以及您可以创建轻量化且节省材料的模型的不同方式，以及如何将它们导出到常见的切片软件，如 Cura、PreForm 和 Prusa
  Slicer。


  在第三部分中，您将了解 Fusion 360 的 *Manufacture* 工作区的所有内容，如何将其用作原生切片器来为零件准备 3D 打印。从如何有效地使用
  Fusion 选择打印机和打印设置，在构建体积内排列和定向零件，创建基于特定打印机需求的支持结构。


  最后一部分全部关于金属打印和自动化，Sualp 凭借多年的经验和专业知识解释了金属粉末床熔融打印的独特要求，如何创建高效的支持结构以及模拟打印过程以检测潜在的构建失败并补偿热变形。


  了解这些关键领域可以节省数小时的工程时间和失败打印的费用。在整本书中，Sualp 提供了您所需的一切，以使用 Fusion 360 的强大功能学习从设计到 3D
  打印的整个工作流程，内容清晰易读，适合刚开始 3D 打印之旅的人，以及准备采用最先进的设计和仿真工具的人。


