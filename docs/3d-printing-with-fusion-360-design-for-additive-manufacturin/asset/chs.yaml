  图 2.25 – 一套 3D 打印设计规则


  正如我们在图 2.25 中看到的，不同技术有不同的要求。例如，如果我们设计零件使用选择性激光烧结打印，我们就不必关心悬垂角度。这一类 3D 打印机可以在任何方向打印物体，而不必担心创建支撑结构，因为正在
  3D 打印的零件已得到下方粉末的充分支撑。然而，当我们具有相对于水平面小于 45 度的悬垂角度特征时，使用 FFF 打印机进行 3D 打印时需要生成支撑结构。图
  2.26 演示了当我们在制造工作区时，如何根据悬垂角度在 Fusion 360 中创建不同风格的支撑结构。我们将在第 10 章更详细地介绍这一主题。


  ![](img/baa027bed101c08b496f1f420cee8a5b_76_0.png)


  图 2.26 – 基于悬垂角度的朝下表面支撑结构


  诸如浮雕和雕刻细节、孔的最小直径、排气孔要求和预期公差等设计规则在我们为 3D 打印设计和准备模型的方式中发挥着重要作用。如果我们从头创建自己的模型，我们可以注意如何设计它们以尽量避免
  3D 打印时出现问题。然而，如果我们使用其他设计师创建的模型，并且只是将它们导入 Fusion 360，我们将需要检查模型的创建方式，并在考虑到增材制造原则的情况下根据需要对其进行编辑。


  现在，让我们通过一个示例来打开 CAD 文件并使用 Fusion 360 中的原生工具检查它。稍后在示例中，让 Fusion 360 识别并移除一些不适合 3D
  打印的小特征，并添加新特征来自定义设计。


  我们将通过打开 Chapter2-Example1.STEP 文件开始练习。如我们在第 1 章中所述，您可以使用 File | Open 菜单在 Fusion
  360 中打开 CAD 文件，或将文件上传到您想要的 Fusion 团队/项目/文件夹，然后双击它以在 Fusion 360 的画布中打开它，如图 2.27 所示。


  ![](img/baa027bed101c08b496f1f420cee8a5b_77_0.png)


  图 2.27 – 示例文件已上传并显示在 Fusion 360 的画布上


  现在模型已在 Fusion 360 中，让我们先对其进行视觉检查。该模型有 2 个大孔、32 个小孔、2 个带网状结构的口袋、雕刻文字以及许多小的倒圆角和倒角。它看起来
  32 个小孔似乎呈图案排列，但目前很难确定。


  让我们开始使用 Fusion 360 直接建模环境中的一些特征识别工具，并专注于该设计中的孔。如图 2.28 所示，在启动 Find features 命令、选择
  BODY1 作为输入并取消选中 Hole 和 Rectangular pattern 特征以外的所有特征后，我们会发现 2 个大孔和 32 个小孔作为 2 个单独的矩形图案。看起来我们的视觉假设是正确的，小孔确实有图案，但它不是单一的连续图案，而是
  2 种不同的图案。




  ![](img/baa027bed101c08b496f1f420cee8a5b_78_0.png)


  图 2.28 – 使用查找特征命令查找孔和图案


  现在，让我们研究孔的尺寸。如果我们从浏览器中选择 Hole1，右键单击并选择编辑孔，如图 2.29 所示，我们将能够检查并在需要时更改此孔的所有尺寸。由于此孔列出的尺寸高于
  FFF 可打印孔的最小尺寸，因此我们不会进行任何更改。我们只需单击取消并开始关注小孔。


  ![](img/baa027bed101c08b496f1f420cee8a5b_78_1.png)


  图 2.29 – 编辑 Hole1 并查看其尺寸


  现在，让我们看一个较小的孔。通过选择其中一个小孔的边缘，我们可以在画布右下角快速看到其直径信息，如图 2.30 所示。


  ![](img/baa027bed101c08b496f1f420cee8a5b_79_0.png)


  图 2.30 – 选择圆形边缘以查看其直径


  此调查告诉我们，所有小孔的直径均为 1 mm，这小于我们的 FFF 打印机可能打印的尺寸。因此，我们可以简单地删除这些孔，如果绝对必要，可以在 3D 打印完成后钻孔。要删除全部
  32 个孔，我们有几种选择。我们可以调整视图，使其从 View cube = TOP 查看模型，使用矩形选择选择所有面，然后右键单击并删除。此方法已在图 2.20
  的右半部分演示。或者，如图 2.31 所示，我们可以从树中选择两个矩形图案，右键单击并删除它们，这将删除属于这些图案的所有孔。


  ![](img/baa027bed101c08b496f1f420cee8a5b_80_0.png)


  图 2.31 – 在浏览器中选择并删除矩形图案


  我们接下来可能想要关注的特征是雕刻。看起来此文件中包含浮雕文字。有多种方法可以去除浮雕文字。与过去选择面并删除它们的方式类似，我们可以删除与浮雕特征相关的所有面。然而，选择多个复杂面，例如本示例中的面，可能并不直接。在这种情况下，我们可能希望采用不同的方法。让我们先通过转到
  SURFACE 选项卡并在创建面板中访问修补命令来创建一个新的修补面。我们将选择希望修补面覆盖的六条边。此操作，如图 2.32 所示，将创建一个新的曲面体。


  ![](img/baa027bed101c08b496f1f420cee8a5b_80_1.png)


  图 2.32 – 使用修补命令创建新的曲面


  一旦创建了新的曲面体，我们就可以利用边界填充命令，该命令可在创建面板下的 **SURFACE** 和 **SOLID** 选项卡中访问。使用边界填充命令，如图
  2.33 所示，我们可以选择我们的实体和曲面体作为工具，并使用矩形选择封装我们希望包含的所有单元。


  ![](img/baa027bed101c08b496f1f420cee8a5b_81_0.png)


  图 2.33 – 使用边界填充命令去除雕刻


  边界填充命令与流体体积命令类似，因为它会创建新的实体。但此命令还允许我们将这些新的实体体与现有的实体体连接。一旦边界填充命令完成，我们将消除雕刻。我们不再需要创建的曲面修补或曲面体，这意味着我们可以从浏览器中选择并删除它，如图
  2.34 所示。


  ![](img/baa027bed101c08b496f1f420cee8a5b_82_0.png)


  图 2.34 – 删除不再需要的曲面修补


  接下来，我们可以继续检测模型中的其他特征。让我们返回查找特征命令，选择主体，并查找所有倒角。通过系统地选择要查找的特征，我们可以在不影响模型中其他特征的情况下修改或删除它们。如图
  2.35 所示，在查找特征命令中选择倒角后，Fusion 360 将找到与模型关联的单个倒角特征。我们可以简单地从浏览器中选择并删除它以消除此小特征。


  ![](img/baa027bed101c08b496f1f420cee8a5b_83_0.png)


  图 2.35 – 使用查找特征命令查找倒角


  接下来，我们可以重复相同的过程并查找同一主体内的所有倒圆角。一旦 Fusion 检测到所有倒圆角，我们可以在浏览器中逐一点击它们，以确定它们在画布上的位置。在本例中，**Fillet42**
  表示槽/织带区域内的微小倒圆角。我们可以简单地从浏览器中选择 **Fillet42**，如图 2.36 所示，右键单击并在其尺寸低于 3D 打印机处理能力时删除它。


  ![](img/baa027bed101c08b496f1f420cee8a5b_84_0.png)


  图 2.36 – 使用查找特征命令检测倒圆角特征


  在本节中，我们介绍了 3D 打印的设计规则概念，以及它们如何根据 3D 打印技术、材料甚至特定打印机而变化。然后，我们在导入的 CAD 几何体上使用 Fusion
  360 的直接建模工具来检测、检查、编辑和删除不适合我们需求的特征。


  重要的是要记住 Fusion 360 是一个功能齐全的 CAD 软件包，允许您向导入的 CAD 几何体添加新特征。例如，如果您想添加新的 pockets、孔、倒圆角或倒角，您就可以使用
  SOLID 选项卡中 CREATE 和 MODIFY 面板内的功能简单地添加它们。


  在下一节中，我们将以类似的方式处理网格文件，并直接使用 Fusion 360 编辑它们以准备 3D 打印。


  ## 在 Fusion 360 中原生处理网格文件


  在上一节中，我们讨论了如何打开 CAD 文件并编辑它们以进行 3D 打印。在本节中，我们将插入网格文件并学习如何以各种方式处理它们。


  将网格文件插入 Fusion 360 后，我们有三种方法可以处理这些模型。我们可以按以下方式编辑插入的网格体：


  - 作为网格体

  - 转换为实体体之后

  - 通过将其重新创建为实体体


  ### 将插入的网格体作为网格体进行编辑


  Fusion 360 中的网格功能适用于参数化和直接建模方法。在处理网格文件时，有几个原因我们可能希望简单地将它们保留为网格体以准备 3D 打印。使用网格体，我们可以进行快速操作，例如使用
  SCALE MESH 放大或缩小网格体，使用 PLANE CUT 将网格体切成两半，使用 SHELL 使网格体中空，以及使用 COMBINE 将网格体与其他网格体组合或移除。


  所有这些操作都可在 MESH 选项卡 | MODIFY 面板中使用，如图 2.37 所示。


  ![](img/baa027bed101c08b496f1f420cee8a5b_85_0.png)


  图 2.37 – 使用平面切割功能在 Fusion 360 中编辑网格体


  由于网格体是 Fusion 360 的原生体类型，如果您有权访问产品设计扩展，您还可以将网格体用作体积晶格化的输入。我们将在第 4 章更详细地介绍我们用于晶格化的各种选项。


  如果您选择网格体并将其设为组件，如图 2.38 所示，您可以执行额外的打印准备活动，例如镜像包含网格体的组件。


  ![](img/baa027bed101c08b496f1f420cee8a5b_86_0.png)


  图 2.38 – 从网格体创建组件


  一旦网格体包含在组件中，您就可以使用该组件作为输入对象类型创建各种图案，如图 2.39 所示。


  ![](img/baa027bed101c08b496f1f420cee8a5b_86_1.png)


  图 2.39 – 使用网格体对组件进行图案化


  与 SCALE、PLANE CUT 和 SHELL 命令不同，MESH 选项卡 | MODIFY 面板中的 COMBINE 命令需要多个体输入。COMBINE
  命令允许您连接、切割、合并或相交多个网格体。图 2.40 显示了如何分三步在插入的网格体内创建新的孔特征。第一步是使用实体建模技术创建圆柱体。在第二步中，我们将该圆柱体转换为网格体
  using


  镶嵌命令，如以下图所示。最后一步是使用带切割操作的组合命令将镶嵌的圆柱体从支架中移除。


  ![](img/baa027bed101c08b496f1f420cee8a5b_87_0.png)


  图 2.40 – 在网格体上使用组合-切割功能创建孔


  ## 将插入的网格体转换为实体体后进行编辑


  即使以原生状态处理网格体是快速操作整个体并添加或移除某些特征的方法，除非我们使用的是实体体，否则无法创建所有必要的特征。在这种情况下，我们可能需要将网格体转换为实体体。


  自动将网格体转换为实体体时，Fusion 360 提供三种选项：


  - 阶梯面（所有用户均可用）

  - 棱柱面（个人版不可用）

  - 有机面（个人版不可用且需要访问产品设计扩展）


  在本章中，我们将仅重点介绍阶梯面和棱柱面选项。有机面选项将在第 3 章中更详细地介绍，在那一章中我们将使用 Fusion 360 的仿真功能生成有机网格体。


  将网格体转换为实体体的 **FACETED** 方法将简单地把体类型从网格更改为实体。在图 2.41 中，我们可以看到将网格体转换为阶梯面实体体所需的步骤。转换完成后，我们可以选择实体体上的任意平面面，并使用键盘上的
  *Delete* 键或删除命令将其删除，该命令可以通过右键单击或通过快捷方式访问，我们可以通过按键盘上的 *S* 来搜索它们。图 2.41 还显示了如何快速将给定对象的平面面全部转换为干净曲面，并稍后将这些曲面用于实体建模操作，例如添加其他体或创建孔。然而，阶梯面选项无法自动将非平面形状转换为干净曲面。要实现这一点，您需要第二个选项，即
  **PRISMATIC**。


  ![](img/baa027bed101c08b496f1f420cee8a5b_88_0.png)


  图 2.41 – 将网格体转换为阶梯面实体体并删除平面面


  要使用棱柱面方法将网格体转换为实体体，Fusion 360 有一个关键前提条件。在使用棱柱面转换之前，您需要定义面组。Fusion 360 在 **MESH**
  选项卡 | **PREPARE** 面板下提供自动面组检测。使用快速或精确方法，并在必要时编辑这些方法设置，您可以让 Fusion 360 通过位于 **INSPECT**
  面板下的显示网格面组命令，以唯一颜色显示每个面组。精确方法通常能给出最佳结果，如图 2.42 所示。


  ![](img/baa027bed101c08b496f1f420cee8a5b_89_0.png)


  图 2.42 – 生成面组命令结果的预览


  在某些情况下，您可能需要做额外的工作才能获得所需的面组结果。您可以先在参数化模式下合并面组，或访问直接编辑模式手动创建面组。一旦拥有所有所需的面组，您就可以利用图
  2.43 所示的 PRISMATIC 转换方法，将网格体转换为实体体。此时，您就可以添加任何新特征，包括圆角和倒角等复杂形状。


  ![](img/baa027bed101c08b496f1f420cee8a5b_89_1.png)


  图 2.43 – 棱柱面网格转换的结果


  ## 通过重新创建将插入的网格体编辑为实体体


  尽管将网格体转换为实体体是确保我们可以使用 Fusion 360 中包含的所有实体修改功能对其进行编辑的最佳方式，但对于非常复杂的模型，网格转换可能不成功。在这种情况下，我们可以将插入的网格体作为参考并创建草图。之后，我们可以利用这些草图中的轮廓作为
  EXTRUDE、REVOLVE、SWEEP 或 LOFT 命令的输入，以创建所需的实体结果。这是将网格体转换为实体体最复杂的方法，但它是工具箱中强大的工具。让我们使用相同的数据集来演示此工作流程。


  在插入网格并将其移至地面后，我们可以利用位于 MESH 选项卡 | CREATE 面板中的 CREATE MESH SECTION SKETCH 命令。选择体后，Fusion
  会自动选择一个剖面。剖面可能不是我们创建草图所需的剖面。在本例中，我们希望创建平行于 XY 平面的草图。我们可以点击 Section Plane 旁边的选择按钮。这将显示全局平面和全局轴。我们将选择
  XY 平面，并使用屏幕上的操纵器将其向上移动 10 毫米。这将为我们提供网格剖面草图的预览，如图 2.44 所示。


  ![](img/baa027bed101c08b496f1f420cee8a5b_90_0.png)


  图 2.44 -- 网格剖面草图预览


  接下来，我们可以在浏览器中选择 Sketch 1，右键单击并编辑它。在本例中，我们将利用位于 SKETCH 选项卡 | CREATE 面板中的 FIT CURVES
  TO MESH SECTION 命令。使用各种 Fit Curve Type 选项，我们可以选择网格剖面草图的一部分并创建网格线、圆弧、圆和样条线，如图 2.45
  所示。


  ![](img/baa027bed101c08b496f1f420cee8a5b_91_0.png)


  图 2.45 – 使用 FIT CURVES TO MESH SECTION 命令创建圆形轮廓


  完成草图几何体的创建后，我们可以使用双向方向的挤出命令来加厚此轮廓。在挤出轮廓之前，我们可以利用位于 INSPECT 面板中的 measure 命令来确定此零件应有多厚。在本例中，我们的零件总共
  25 毫米，因此我们将在一个方向挤出 15 毫米，在另一个方向挤出 10 毫米，如图 2.46 所示。


  ![](img/baa027bed101c08b496f1f420cee8a5b_91_1.png)


  图 2.46 – 使用挤出命令将草图轮廓变为实体体


  接下来，我们可以开始关注倒角特征，该特征应复制到此零件顶边缘周围。我们可以先利用位于 INSPECT 面板中的 MEASURE 命令来了解我们试图复制的倒角特征所构成的
  XYZ 增量。如图 2.47 所示，此零件具有双面倒角。在一个方向上为 3 毫米，在另一个方向上为 6 毫米。


  ![](img/baa027bed101c08b496f1f420cee8a5b_92_0.png)


  图 2.47 – 测量网格以确定倒角尺寸


  现在我们知道了网格体所具有的倒角尺寸，我们就可以为实体体添加倒角特征。只需激活位于 MODIFY 面板下的 CHAMFER 特征，选择顶表面周边所有 14 条边，将倒角类型更改为
  TWO DISTANCE，并将相应值输入对话框中，如图 2.48 所示。


  ![](img/baa027bed101c08b496f1f420cee8a5b_93_0.png)


  图 2.48 – 使用倒角特征为周边添加双距离倒角


  现在我们已经创建了网格剖面草图，利用它创建了草图轮廓，挤出了这些轮廓并添加了必要的倒角，我们已完全逆向工程了此零件，该零件始于插入的网格体，终于实体体。此工作流程比我们重点介绍的之前工作流程需要更多步骤，但如果我们试图逆向工程的零件无法使用其他方法重建，则非常有用。


  ## 总结


  在本章中，我们介绍了如何在考虑各种 **增材制造设计（DFAM）** 原则的情况下编辑 CAD/网格模型。我们重点介绍了如何打开/关闭设计历史。我们演示了使用参数化建模与直接建模时工作流程的差异。然后我们学习了如何自动检测导入
  CAD 模型的特征。我们还介绍了如何基于 DFAM 原则编辑 CAD 和网格体。我们以介绍几种将网格文件转换为可进一步用于制造修改的实体体的方法结束本章。


  在下一章中，我们将介绍可在 Fusion 360 的设计工作区中使用自动化建模以及仿真工作区中使用形状优化来在考虑 DFAM 原则的情况下减轻零件重量的几种技术。我们还将学习如何利用仿真来识别潜在的性能故障并做出设计更改以应对它们。



