  \nFigure 3.8 – 带有几个要避免实体的新自动化建模设置\n\n生成新形状后，我们现在可以看到六个可供选择的新设计替代方案。根据 Fusion 360\
  \ 的说法，它们都避免了与麦克风和建模电缆的干涉。在检查结果后，让我们选择 **Alternative 4** 并将其体积滑块调整到最小，然后选择 **OK**\
  \ 以生成新的实体，如 *Figure 3.9* 所示：\n\n![](img/baa027bed101c08b496f1f420cee8a5b_102_0.png)\n\
  \nFigure 3.9 – 避免干扰麦克风的六个新设计替代方案\n\n如 *Figure 3.10* 所示，我们现在在 **BROWSER** 面板中有一个名为\
  \ **Body46** 的新实体，并且可以看到时间轴中已添加了一个新的自动化建模特性。仔细检查后，我们可以看到新实体没有与电缆发生干涉。然而，这是通过从新生成的形状中移除麦克风和电缆来实现的。该新实体在理论上满足我们的目标；然而，在实际使用中，我们需要在电缆与连接臂之间留出更大的间隙，以便我们能够插拔这些电线：\n\
  \n![](img/baa027bed101c08b496f1f420cee8a5b_103_0.png)\n\nFigure 3.10 – 自动化建模第二次迭代的结果\n\
  \n为了实现麦克风与新连接臂之间更大间隙的这一新目标，我们需要创建新的几何体。Fusion 360 可用于沿 XZ 轴创建新草图，我们可以投影麦克风的轮廓，并在需要时对其进行偏移以创建额外的公差区域。稍后，我们可以使用创建的轮廓并使用\
  \ REVOLVE 命令创建 130 度旋转，如图 3.11 所示：\n\n![](img/baa027bed101c08b496f1f420cee8a5b_103_1.png)\n\
  \nFigure 3.11 – 基于麦克风轮廓使用 REVOLVE 命令创建新实体\n\n一旦我们生成这个新实体，我们就可以重命名它。在此示例中，我将新实体重命名为\
  \ Avoid Zone。现在，我们已准备好进行第三次也是最后一次自动化建模特性。让我们继续抑制之前的自动化建模特性并最后一次激活自动化建模。在选择相同的四个面进行连接后，我们现在可以选择新创建的\
  \ **Avoid Zone** 作为要避免实体的输入。最终自动化建模的新设置可在 *Figure 3.12* 中看到：\n\n![](img/baa027bed101c08b496f1f420cee8a5b_104_0.png)\n\
  \nFigure 3.12 – 带有新创建的 Avoid Zone 的自动化建模最终设置\n\n生成新形状后，我们现在可以看到六个可供选择的新设计替代方案。如果我们选择\
  \ **Alternative 6** 并使用最小体积，我们将得到可在 *Figure 3.13* 中看到的模型预览：\n\n![](img/baa027bed101c08b496f1f420cee8a5b_105_0.png)\n\
  \nFigure 3.13 – 最终自动化建模设置的 Alternative 6\n\n总是建议仔细查看结果并确保其满足我们的设计目标，并且输出几何形状在几何上令人满意。如\
  \ *Figure 3.14* 所示，Fusion 360 利用 T splines 创建了新的实体来创建形状，使用边界填充命令将表面形状转换为实体对象，最后使用组合特征切割操作从输出形状中移除要避免的实体。这种组合切割的最终操作在我们原本外观有机的几何形状中创建了两个缺口。我们可以轻松地更改组合特征并移除四个工具实体之一（在本例中为\
  \ **Avoid Zone**）以消除这两个缺口。\n\n![](img/baa027bed101c08b496f1f420cee8a5b_106_0.png)\n\
  \nFigure 3.14 – 自动化建模创建了一组可单独编辑的特征\n\n通过此最终编辑，我们创建了一个设计替代方案，它既符合我们的要求，又与原始设计相比有很大不同。但与原始设计相比，这个设计是否更轻？即使我们在生成时没有明确输入关于减轻零件重量的标准，我们在为每个选定的设计替代方案选择时始终选择最小体积。让我们更仔细地查看原始零件及其属性。如图\
  \ 3.15 所示，名为 **Original Connection** 的组件的体积为 41,843 立方毫米。请注意，要访问 **PROPERTIES**\
  \ 对话框，我们首先创建了一个新组件并将名为 **Connection-left** 和 **Connection-right** 的实体移入此新组件。之后，我们右键单击并选择\
  \ **Properties** 以访问 **PROPERTIES** 对话框。\n\n![](img/baa027bed101c08b496f1f420cee8a5b_106_1.png)\n\
  \nFigure 3.15 – 原始设计的质量和体积属性\n\n如果你重复相同的步骤，创建一个新组件并将新的连接实体移入此新组件，我们可以查看其属性并看到该新组件的体积为\
  \ 16,591 立方毫米。这意味着新设计的体积和质量大约为原始设计的 40%。图 3.16 显示了使用自动化建模创建的新连接实体的属性。\n\n![](img/baa027bed101c08b496f1f420cee8a5b_107_0.png)\n\
  \nFigure 3.16 – 新设计的质量和体积属性\n\n尽管自动化建模为我们提供了有机外观和轻量化设计，但我们并不能确定这种几何形状在实际环境中的表现如何。为了验证我们的模型能否承受麦克风重量在各种位置相关的载荷，我们必须构建原型并进行测试或执行仿真。我们本可以使用的另一种工具来生成有机且轻量化的设计是生成式设计。生成式设计是\
  \ Fusion 360 内的一个独立工作区，需要类似的连接面和障碍几何体的输入。使用生成式设计，您还可以输入载荷和边界条件来模拟连接臂将承受的力。此外，生成式设计允许用户选择希望用于生产输出几何体的制造模型。诸如增材制造、减材制造（2.5\
  \ axis、3 axis 或 5 axis milling machines）以及 2 axis cutting 和 Die casting 等选项都可以考虑。生成式设计还要求您在创建满足要求的设计时选择应考虑的材料。如图\
  \ 3.17 所示，您可以根据满足特定设计目标的制造方法和材料生成数十个甚至数百个结果。\n\n![](img/baa027bed101c08b496f1f420cee8a5b_108_0.png)\n\
  \nFigure 3.17 – 满足设计标准的摩托车组件的生成式设计结果\n\n无论我们选择何种方法来生成有机且轻量化的几何形状，进行最终仿真以确保这些计算机生成的形状满足我们的性能标准始终是良好的实践。\n\
  \n在本节中，我们介绍了如何应用自动化建模来生成外观有机的形状。我们通过自动化建模进行了迭代设计过程，并更新了设计标准以满足特定目标。我们以麦克风支架为例，并将原始设计与最终设计进行比较，以确保结果是更轻量化的版本。在下一节中，我们将使用\
  \ Shape Optimization 仿真方法遵循类似的示例，以确保我们创建的设计考虑了性能标准。\n\n## 利用形状优化\n\n在上一节中，我们介绍了如何使用自动化建模来生成有机且轻量化的设计。在本节中，我们将介绍基于性能的建模，并学习如何利用\
  \ Shape Optimization 生成类似的结果。\n\nShape Optimization 是 Fusion 360 的 SIMULATION 工作区中可用的分析类型。使用\
  \ Shape Optimization，工程师可以根据预定的性能标准创建轻量化设计。然而，需要注意的是，形状优化研究的结果实际上并不反映载荷产生的应力。因此，我们应始终使用额外的仿真（例如静态应力研究）来验证新设计。在本节中，我们将重点关注\n\
  \n关于使用形状优化仿真技术创建新模型。在选择设计方案后，我们将把结果合并到原始设计中，既作为网格体也作为实体体，并讨论每种方法的优点和缺点。\n\n要进行形状优化研究，至少需要选择一个**目标体**以安全地去除材料。我们还必须为该体指定材料。最后，我们需要施加作用于该体的约束和结构载荷。\n\
  \n载荷可以通过简单地选择面并施加力或压力来应用。或者，我们可以将载荷添加到与目标体接触的其他组件的面、边或角点上。只要我们在装配中正确定义接触条件，目标体就会基于这些载荷进行优化。我们还可以选择次要体，并让\
  \ Fusion 360 自动计算其质心，并基于其重量将载荷作为远程载荷施加到目标体上。\n\n形状优化还允许我们基于常见的形状（如盒子、圆柱体或球体）创建保留区域。**保留区域**允许我们指定某个区域不进行优化。例如，如果我们想保留一个将用作螺栓连接界面的孔，我们可以选中它并将其指定为保留区域，以便形状优化不会从模型的该段去除材料。在形状优化中，我们还可以要求\
  \ Fusion 360 提供对称的输出。在这种情况下，我们必须定义一个对称平面，以便结果符合该对称条件。形状优化研究中最重要的一部分是优化标准。Fusion\
  \ 360 允许我们在最小化目标体质量的同时最大化其刚度。在某些仿真中，使用形状优化最小化质量可能会导致设计出现大量槽和支架。在这种情况下，Fusion 360\
  \ 还允许我们控制任何网状设计输出的最小构件尺寸。\n\n现在，让我们使用相同的数据集探索此功能，并逐步介绍设计师在使用形状优化处理此项目时可能遵循的示例流程。\n\
  \n图 3.18 以黄色显示了本章前一节中介绍的麦克风支架的底座和安装支架。使用 Fusion 360 的草图工具，我们可以在两个安装支架底部创建一个矩形，并在底座顶部创建一个圆形。然后，我们可以利用**LOFT**命令并在这两个草图轮廓之间创建一个实体体。此新体将成为我们形状优化目标体的基础。让我们将此体重命名为\
  \ `Shape to optimize`：\n\n![](img/baa027bed101c08b496f1f420cee8a5b_110_0.png)\n\n\
  图 3.18 – 在底座和安装支架之间使用 LOFT 命令创建新体\n\n接下来，我们将利用本章前一节中创建的名为 Avoid Zone 的体。让我们首先选择该体的外部面，如图\
  \ 3.19 中蓝色所示，并将其偏移 7.5 毫米，以便从一开始就拥有更大的避让区域：\n\n![](img/baa027bed101c08b496f1f420cee8a5b_110_1.png)\n\
  \n图 3.19 – 使用偏移面命令创建更大的体\n\n接下来，我们可以在 MODIFY 面板中使用 COMBINE 功能并从 Shape to optimize\
  \ 体中移除 Avoid Zone 体，如图 3.20 所示。这将确保麦克风和两根电缆沿 X 轴舒适旋转时有足够的空间。\n\n![](img/baa027bed101c08b496f1f420cee8a5b_111_0.png)\n\
  \n图 3.20 – 创建形状优化的目标体\n\n接下来，我们将从 DESIGN 工作区切换到 SIMULATION 工作区并创建一个新的形状优化研究。在创建形状优化研究期间，我们还可以编辑其设置并选择较小的网格尺寸（Model-based\
  \ Size 中为 3%），如图 3.21 所示。使用较小的百分比会产生更精细的网格，求解时间更长，但结果更好。\n\n![](img/baa027bed101c08b496f1f420cee8a5b_112_0.png)\n\
  \n图 3.21 – 创建网格优化研究并自定义网格设置\n\n创建形状优化研究后，我们仍需要进一步编辑模型，以便准备求解仿真。为此，我们可以进入 SIMPLIFY\
  \ 环境，该环境可通过选择 SIMULATION 工作区、SETUP 选项卡和 SIMPLIFY 面板访问。一旦进入 SIMPLIFY 环境，我们可以选择形状优化研究不需要的所有体，右键单击并将其删除，如图\
  \ 3.22 所示：\n\n![](img/baa027bed101c08b496f1f420cee8a5b_112_1.png)\n\n图 3.22 – 在\
  \ SIMPLIFY 环境中删除不必要的体\n\n一旦只剩下将参与形状优化研究的所有体，就该定义所有必要的输入了。我们可以首先将名为**Shape to optimize**的体指定为**目标体**。接下来，我们可以选择麦克风并将其转换为点质量，该质量将作用于目标体的顶部两个表面。接下来，我们需要设置研究材料。在本例中，我从\
  \ Fusion 360 的增材材料库中选择了**Aluminium AISI10Mg**。\n\n接下来，我们需要分配载荷条件。如图 3.23 所示，我们需要在三个不同的载荷工况中定义载荷。载荷工况\
  \ 1 将反映麦克风处于垂直位置并对支架施加向下力的情况。载荷工况 2 和 3 分别表示麦克风向前和向后倾斜。在载荷工况 2 和 3 中，我们还需要施加一个力矩，以模拟麦克风对支架施加的载荷，因为其质心将沿\
  \ Y 轴远离安装支架。所有三个载荷工况还需要在底座板的底部施加固定边界条件。\n\n![](img/baa027bed101c08b496f1f420cee8a5b_113_0.png)\n\
  \n图 3.23 – 麦克风支架形状优化的材料定义和载荷条件\n\n一旦载荷和边界条件设置完毕，我们就可以继续指定某些体为保留区域。在本例中，我们将使用名为**Mount-right**和**Mount-left**的体，并基于它们创建两个盒状保留区域，如图\
  \ 3.24 所示。我们还可以沿 Global YZ 平面创建一个对称平面，并要求最终形状对称。在此形状优化研究中，我们希望将初始形状的质量减少 70%，并在最大化刚度的同时达到\
  \ 30% 或更低的目标质量。我们还将最小构件尺寸定义为 3 毫米或更大，作为形状优化标准的全局约束。\n\n![](img/baa027bed101c08b496f1f420cee8a5b_114_0.png)\n\
  \n图 3.24 – 保留区域和形状优化标准\n\n求解形状优化研究后，我们将进入**SIMULATION**工作区内的**RESULTS**环境，如图 3.25\
  \ 所示。图例允许我们操作优化后的形状。使用图例中的滑块，我们可以将结果调整为更薄或更厚，但默认结果将是 30% 的目标质量。在**RESULT TOOLS**面板中，如果选择**PROMOTE**命令，我们将有选项将形状优化的结果作为新体提升到**DESIGN**工作区。\n\
  \n![](img/baa027bed101c08b496f1f420cee8a5b_114_1.png)\n\n图 3.25 – 形状优化研究的结果\n\n\
  从**SIMULATION**工作区提升的体将在**DESIGN**工作区作为新的网格体可用。如图 3.26 所示，此新网格体将具有一个引用形状优化研究的唯一名称。\n\
  \n![](img/baa027bed101c08b496f1f420cee8a5b_115_0.png)\n\n图 3.26 – 形状优化提升设计工作区的网格结果\n\
  \n一旦网格结果被提升到**DESIGN**工作区，我们就有三种选择来使用此新模型。我们的第一个选项是保持网格体为网格体，并直接 3D 打印它。我们的下一个选项是尝试使用我们在第\
  \ 2 章中介绍的各种基于网格截面的草图和实体体创建功能来逆向工程此网格体。我们的第三个选项是尝试将网格体转换为实体体。\n\n如果我们想追求第三个选项，我们需要访问**Organic**网格转换方法，因为形状优化的结果往往具有有机特性。您可以通过选择**DESIGN**工作区中的**MESH**选项卡，然后选择**MODIFY**面板来访问**CONVERT\
  \ MESH**命令。**Organic**方法，如图 3.27 所示，可供拥有产品设计扩展的用户使用。\n\n\n\n![](img/baa027bed101c08b496f1f420cee8a5b_116_0.png)\n\
  \nFigure 3.27 – 使用 Organic 方法的 CONVERT MESH 命令\n\n根据我们选择的分辨率和精度，我们可以使用 Organic 网格转换将此网格体转换为实体对象。Figure\
  \ 3.28 显示了此类结果的示例。\n\n![](img/baa027bed101c08b496f1f420cee8a5b_116_1.png)\n\nFigure\
  \ 3.28 – 使用 Organic 方法将网格转换为实体的结果\n\n为了完成我们的设计，我们需要最后一次使用 **COMBINE** 命令，并统一代表底座、安装支架以及目标体形状优化结果的多个实体，如\
  \ *图 3.29* 所示。\n\n![](img/baa027bed101c08b496f1f420cee8a5b_117_0.png)\n\nFigure\
  \ 3.29 – 合并多个实体以制作单个麦克风支架\n\n如果我们选择了第一个选项，我们本可以将形状优化结果保留为网格体，并仅对左右两侧的底座和安装支架进行网格化。然后，我们可以将全部四个实体作为网格对象进行合并，从而获得类似的结果。然而，如果我们使用了基于网格的工作流程并将最终设计制作成网格对象，即使我们能够\
  \ 3D 打印最终设计，也无法在 Fusion 360 中使用线性静应力对其进行仿真。这是因为 Fusion 360 要求对象为实体体才能进行仿真。*图 3.30*\
  \ 显示了我们从四个不同角度看到的最终设计。在这个完成版本中，我还将所有不必要的组件移入名为 **Extras** 的新子装配中并关闭了其可见性。\n\n![](img/baa027bed101c08b496f1f420cee8a5b_118_0.png)\n\
  \nFigure 3.30 – 形状优化麦克风支架的结果\n\n在本节中，我们介绍了形状优化的概念以及它如何用于创建有机且轻量化的几何形状。我们通过示例介绍了如何为形状优化创建目标体以及如何设置仿真研究。在进行研究后，我们将结果提升到\
  \ **DESIGN** 工作区，并将结果与现有实体合并以创建最终形状。\n\n在下一节中，我们将进行线性静应力仿真，以查看自动化建模的结果是否能够承受工作载荷，以及我们是否需要进行设计调整以消除日常使用中的潜在失效。\n\
  \n## 用于检测和修复常见失效的结构仿真\n\n在前几节中，我们使用自动化设计和形状优化创建了多个设计替代方案。在本节中，我们将介绍如何对其中一种设计替代方案进行仿真，以检查其在工作条件下是否能够承受载荷。我们还将查看我们选择的材料是否基于载荷是合适的，并尝试其他材料。我们还将尝试检测和修复常见的失效点，例如应力集中。\n\
  \n让我们开始通过新建一个设计并以新名称保存它。一旦我们有了新的 Fusion 360 设计文档，使用 **SOLID** 选项卡的 **INSERT** 面板中的\
  \ **Insert Derive** 命令，我们可以从其他 Fusion 360 设计文档中插入实体和组件，如 *图 3.31* 所示。在此示例中，我们将从之前使用自动化设计创建的一个麦克风支架设计中插入多个实体。一旦我们将四个关键实体（Base、Mount-left、Mount-right\
  \ 和 New connection）插入到此设计中，我们可以利用 MODIFY 面板中的 COMBINE 命令。我们还可以在 MODIFY 面板的 PHYSICAL\
  \ MATERIAL 功能中为此设计分配材料。我们可以选择与前几节中相同的增材铝 AlSi10Mg 材料作为我们第一次仿真研究的材料。\n\n![](img/baa027bed101c08b496f1f420cee8a5b_119_0.png)\n\
  \nFigure 3.31 – 使用 Insert Derive 和 COMBINE 命令将多个实体合并为一个\n\n现在我们已将合并的实体置于单个组件中，我们就可以开始设置仿真了。我们需要做的第一件事是从\
  \ DESIGN 工作区切换到 SIMULATION 工作区并创建一个新的 Static Stress 研究。在此研究中，我们需要创建三个载荷工况，类似于我们在上一节中为形状优化研究设置的设置。在这些载荷工况中的每一个中，我们都需要分配与形状优化研究中创建的相同的载荷和边界条件。\n\
  \n第一个载荷工况将帮助我们仿真麦克风处于垂直位置的情况。我们为此载荷工况选择的载荷将是作用于设计中 Mount-left 和 Mount-right 部分圆柱形孔的两个轴承载荷。\n\
  \n载荷工况 2 和 3 将代表麦克风处于前倾和后倾位置，就像我们在上一节中为形状优化研究设置的设置一样。对于全部三个载荷工况，我们将在底座底部分配一个固定边界条件。接下来，我们将为研究分配材料。我们将在仿真研究中使用与设计材料相同的材料，如\
  \ Figure 3.32 所示。\n\n![](img/baa027bed101c08b496f1f420cee8a5b_120_0.png)\n\nFigure\
  \ 3.32 – 线性静力模拟的轴承载荷和研究材料\n\n一旦我们分配了所有载荷和边界条件，我们就可以进行此仿真研究。我们可以从 **SETUP** 选项卡的\
  \ **Solve** 面板开始求解。\n\n> **重要提示**\n> \n> 为了运行静应力仿真，您需要试用版、商业版、教育版或初创版许可证。个人许可证无法访问仿真功能：https://www.autodesk.com/products/fusion-360/personal。\n\
  \n一旦静应力分析的结果可用，Fusion 360 将从 **SIMULATION** 工作区的 **SETUP** 选项卡切换到 **RESULT** 选项卡。您将能够查看仿真结果并更改为各种结果类型。默认情况下，Fusion\
  \ 360 显示安全系数结果。如 Figure 3.33 所示，如果您使用图例旁边的下拉菜单将结果类型切换为 **Stress**，您可以看到该零件在每个载荷工况下会经历的\
  \ **Von Mises** 应力。\n\n> **重要提示**\n> \n> Von Mises 应力是从六个应力张量（XX、YY、ZZ、XY、YZ 和 ZX）计算等效应力值的一种被普遍接受的方法。它并不代表给定零件所经历的真实应力，但它是我们可以用来计算给定零件的安全系数并确定由延性材料（如金属）制成的零件在特定载荷条件下是否会屈服或断裂的方法之一。\n\
  \n在此示例中，我们将重点关注载荷工况 2，即麦克风处于前倾位置的情况。如果您使用 **INSPECT** 面板中的 **Show Min/Max** 命令打开最小值和最大值探针，您可以看到该零件上最高应力发生的位置。\n\
  \n看起来我们在该零件底部附近有机形状与棱柱形形状相遇的地方存在高应力。即使应力结果较低，安全系数结果较高，最大应力显示的位置仍令人担忧，并且可能成为潜在的失效点，具体取决于我们打印此对象的材料和/或我们选择的\
  \ 3D 打印方法。\n\n![](img/baa027bed101c08b496f1f420cee8a5b_121_0.png)\n\nFigure 3.33\
  \ – 初始模拟的线性静应力结果\n\n为了进一步探讨这个想法，让我们复制 **Study 1** 并创建 **Study 2**。在 **Study 2 -\
  \ Static stress** 中，我们将选择不同的材料，但对全部三个载荷工况保持所有载荷和边界条件不变。使用 Fusion 360 中的研究复制工作流程进行多次研究是能够更改材料的主要优势之一。\n\
  \n在 **Study 1** 中，我们选择了铝作为材料；在 **Study 2** 中，让我们将研究材料更改为 **PA 12**，这是一种塑料材料，可以使用\
  \ HP MultiJet Fusion 3D 打印机打印。*图 3.34* 显示了该材料的物理和热材料属性。\n\n\n\n\n![](img/baa027bed101c08b496f1f420cee8a5b_122_0.png)\n\
  \n## 图 3.34 – HP Jet Fusion 580 打印的 PA 12 的物理和热性能\n\n进行第二次研究后，我们可以将 **Study 1**\
  \ 的结果与 **Study 2** 进行比较。利用 Fusion 360 的 **COMPARE** 功能，我们可以将布局拆分为多布局视图，如 *图 3.35*\
  \ 所示。\n\n在此图中，我们可以看到左侧的两张图像来自使用了铝作为材料的 **Study 1**。右侧的两张图像来自使用 PA 12 作为材料的 **Study\
  \ 2**。顶部两张图像显示安全系数结果。底部两张图像显示工况 2 的应力结果。尽管两种仿真中的应力结果相对较小，但使用塑料材料而非铝时，安全系数从 8+ 下降到\
  \ 5.3。\n\n![](img/baa027bed101c08b496f1f420cee8a5b_122_1.png)\n\n## 图 3.35 – 比较使用不同材料的两次仿真结果\n\
  \n仔细检查后，高应力位于与之前相同的位置。如前所述，这里存在应力集中的可能性。应力集中是指模型中应力倾向于上升的区域，无论我们使用何种网格尺寸来模拟模型都如此。它可能是由局部载荷（如点载荷）或几何形状的突然变化引起的。如果模型中存在应力集中，在运行期间可能会导致断裂点。如果可能，始终建议更改载荷条件或几何形状以消除应力集中区域。\n\
  \n让我们看看是否可以通过设计更改来解决这个问题。要进行设计更改，我们必须返回到 **DESIGN** 工作区。为了不丢失前两次研究的仿真结果，让我们以新名称保存设计。在本例中，我选择将我的设计命名为\
  \ `Mic Stand-simulation 2`。\n\n图 3.36 显示了有机腿与棱柱特征相遇区域的放大视图。消除应力集中的一种方法是添加倒圆角。如果我们尝试在当前条件下向几何体添加倒圆角，由于当前形状的复杂性，Fusion\
  \ 360 无法在所选边上创建倒圆角。\n\n![](img/baa027bed101c08b496f1f420cee8a5b_123_0.png)\n\n图\
  \ 3.36 – 问题区域倒圆角创建过程中的错误\n\n在使用 **边界表示**（**BREP**）建模的 CAD 软件中，倒圆角或倒角创建过程中可能会出现此类错误。每当我们遇到此类错误时，可能需要想出不同的解决方案来更改设计，以便解决应力集中问题并在边之间创建平滑过渡。在本例中，我选择构建一个新的棱柱体。我们可以通过在底座顶部创建新草图并使用距现有棱柱形状\
  \ 5 毫米的偏移来实现，如图 3.37 所示。\n\n![](img/baa027bed101c08b496f1f420cee8a5b_124_0.png)\n\
  \n图 3.37 – 根据棱柱形状偏移绘制两个新轮廓\n\n我们可以通过选择这些新轮廓来拉伸两个新形状。这将是连接到我们有机支架的新棱柱底座。为了减轻重量，我们可以用锥度角创建拉伸。在本例中，我们将利用\
  \ 20 度锥度角作为拉伸特征的一部分，如图 3.38 所示。\n\n![](img/baa027bed101c08b496f1f420cee8a5b_124_1.png)\n\
  \n图 3.38 – 使用锥度角拉伸两个新的棱柱形状\n\n一旦我们有了新的棱柱底座，我们可以选择底座与有机形状相遇的所有面和/或边，并使用位于 MODIFY\
  \ 面板中的 FILLET 命令创建新的过渡。在本例中，我们将添加一个 1.5 毫米半径的倒圆角，如图 3.39 所示：\n\n![](img/baa027bed101c08b496f1f420cee8a5b_125_0.png)\n\
  \n图 3.39 – 对棱柱底座和有机支架应用倒圆角特征\n\n在我们专注于添加倒圆角的同时，在左右安装区域底部的尖角处添加两个倒圆角也是一个好主意。如图 3.40\
  \ 所示，如果采用较大的倒圆角半径，我们可以减轻重量并使设计更安全。\n\n![](img/baa027bed101c08b496f1f420cee8a5b_125_1.png)\n\
  \n图 3.40 – 对安装支架应用 4 mm 倒圆角\n\n现在我们已对模型进行了所有必要的更改，可以切换到 **SIMULATION** 工作区。确认选择了正确的\
  \ PA 12 材料后，我们可以重新运行静态应力研究。此新研究在此新的 Fusion 360 设计中求解，显示出更均衡的应力分布，如图 3.41 所示。它不再在有机支架与棱柱底座相遇处具有最高应力点。与之前的设计/仿真相比，其最高应力值也有所降低。\n\
  \n![](img/baa027bed101c08b496f1f420cee8a5b_126_0.png)\n\n图 3.41 – 消除应力集中后的设计更改应力结果\n\
  \n经过这三次仿真，我们可以确信，我们的麦克风支架不仅能够承受日常使用，而且在 3D 打印后不会存在可能导致随时间推移发生断裂的潜在薄弱点。\n\n需要注意的是，我们使用各向同性材料模型假设对这些零件进行了仿真。Fusion\
  \ 360 的增材材料库中的材料，如金属、粉末和树脂，其物理性能基于 3D 打印和测试。对于像 PA 12 这样表现出各向异性行为的材料，Fusion 360\
  \ 使用构建方向力学性能并遵循各向同性材料行为假设。有关每种材料和 3D 打印技术的更多详细信息，请参阅所仿真材料的规格表 – 例如，https://h20195.www2.hp.com/v2/getpdf.aspx/4AA7-1533ENA.pdf。\n\
  \n总之，我们可以通过多种方式减轻零件重量。Fusion 360 提供了多种易于使用的轻量化现有零件以及创建新设计的方法。\n\n## 摘要\n\n在本章中，我们使用自动化建模创建了有机且轻量化的模型。自动化建模为我们提供了六种设计备选方案可供选择，一旦我们选择其中一种，就能够修改其体积并创建有机轻量化设计备选方案。接下来，我们设计了起始形状并使用形状优化，根据载荷和边界条件对目标形状进行轻量化。\n\
  \n然而，这两种方法都没有基于应力结果创建形状。为了确保我们选择的备选设计能够承受运行载荷条件下发生的应力，我们进行了静态应力研究。我们的初始仿真指出，我们的材料选择对于我们的需求来说太强了。在将材料从金属改为塑料后，我们意识到我们的设计仍然能很好地满足其预期用途。然而，我们也识别出了应力集中区域，并进行了最后一次设计更改以消除应力集中，从而最大程度地减少潜在的未来失效点。\n\
  \n使用类似的工作流程，您可以确保创建轻量化且合规的设计，这些设计不仅能够承受运行条件，而且在现场使用寿命长。在下一章中，我们将重点介绍如何使用各种中空和点阵方法进一步减轻设计重量，以减少材料和能源消耗。\n"
- '## 通过中空和点阵零件来减少材料和能源使用


  欢迎阅读第 4 章。正如我们在上一章中提到的，增材制造的一个关键优势是能够创建轻量化零件。在本章中，我们将介绍 Fusion 360 中用于中空笨重零件并在中空部分应用点阵结构以创建轻量化版本的几种工具，这些版本可以使用更少的材料和能源进行
  3D 打印。


  我们将首先讨论各种 3D 打印技术以及如何根据技术对零件进行中空。之后，我们将重点介绍创建排水孔，以便使用树脂或粉末 3D 打印的零件在打印过程完成后可以被移除。最后，我们将讨论我们用于创建点阵的各种工具。


  在本章中，我们将涵盖以下主题：


  - 中空零件

  - 创建排水孔

  - 创建实体和体积点阵


  到本章结束时，您将学会如何中空实体和网格体。您将能够建模排水孔，并且将很好地理解如何创建点阵形状以填充中空组件内部。


  ### 技术要求


  本章涵盖的所有主题都可供启动版和教育版 Fusion 360 许可证类型使用。如果您拥有 Fusion 360 的商业许可证，则为了创建和修改体积


  晶格，您还需要访问 Product Design 扩展（https://www.autodesk.com/products/fusion-360/product-design-extension）。


  Autodesk 为 Product Design 扩展提供 14 天试用。您可以在 Fusion 360 的扩展对话框中激活试用。


  Product Design 扩展访问不适用于 Fusion 360 的个人/业余许可证。


  本章的课程文件可在以下位置找到：https://github.com/PacktPublishing/3D-Printing-with-Fusion-360。


  ## 中空零件


  在之前的章节中，我们介绍了如何导入和编辑由实体和网格体组成的现有设计。我们还利用了形状优化和自动化建模，让 Fusion 360 生成轻量化的设计替代方案。然后，我们对这些几何体进行仿真，以查看生成的模型是否能够承受工作载荷。在所有这些活动中，我们的主要目标是创建可进行
  3D 打印的模型。


  我们可以使用 3D 打印来制造最终使用零件，以及在采用其他制造方法进行大规模生产之前快速创建原型。无论我们出于何种原因选择 3D 打印作为制造方法，我们都希望能够快速高效地生产物理模型。


  如第 2 章所述，市面上有多种 3D 打印技术可供选择。每种 3D 打印技术都有独特的设计要求，以高效地生产物理模型。当您打印不需要结构强度的零件时，中空模型可以成为节省时间和材料的好方法。


  使用熔融沉积制造（FFF）3D 打印机制造大体积部件时，通常的做法是利用多条轮廓线使零件坚固。在 FFF 中，通常还使用填充密度在 15% 到 30% 之间的填充图案，以保持零件轻量化。这种相同的切片技术并不能直接适用于其他
  3D 打印技术，例如立体光刻（SLA）、多喷头熔融（Multi Jet Fusion）或选择性激光烧结（SLS）。使用这些技术创建原型零件时，设计人员必须主动思考如何减轻零件重量以减少材料和能源使用。


  在本节中，我们将重点介绍如何为立体光刻、多喷头熔融和选择性激光烧结等 3D 打印技术中空零件。在大多数情况下，将零件掏空可以节省大量材料，而不必将整个零件作为
  100% 实心物体打印。中空零件还可以提高树脂基打印机（立体光刻和数字光处理（DLP））的打印成功率，因为它减轻了打印零件的重量并降低了构建平台上的应力，从而使零件在打印过程中不会从构建平台上脱落。


  在中空零件的同时，我们还必须确保壁厚足够大，以满足所选的打印工艺，以便我们的零件能够成功制造，并且在预期使用过程中不会断裂。


  在处理实体模型时，Fusion 360 提供了两种中空零件的方法。两种方法都可以通过相同的 SHELL 命令访问。Shell 命令位于 DESIGN 工作区 |
  SOLID 选项卡 | MODIFY 面板中，如图 4.1 所示。


  ![](img/baa027bed101c08b496f1f420cee8a5b_131_0.png)


  Figure 4.1 – 在 SOLID 选项卡内访问 shell 命令


  Fusion 360 的 SHELL 功能非常多功能。它允许您选择面或体作为输入。如果您选择一个面然后指定厚度，所选面将被移除，您将得到该体的中空版本，如图 4.2
  所示。SHELL 对话框还允许您选择多个面。通过按住 Shift 键，您可以多选面，shell 命令将类似地移除这些面。


  ![](img/baa027bed101c08b496f1f420cee8a5b_132_0.png)


  Figure 4.2 – 选择单个面将实体转换为中空版本


  使用 SHELL 命令的另一种方法是选择体而不是面。访问 SHELL 对话框后，您可以简单地从浏览器中选择要进行壳处理的体。或者，您也可以从画布中选择要进行壳处理的体。如果您想使用画布，有几种选择体的方法。一个选项是将选择优先级更改为选择体优先级。做出该更改后，您可以简单地指向并选择要进行壳处理的体，如图
  4.3 所示。另一个选项是访问选择过滤器下拉菜单，并确保仅选中 Bodies，这将允许将 Shell 选择方法限制为体。


  ![](img/baa027bed101c08b496f1f420cee8a5b_133_0.png)


  Figure 4.3 – 使用画布选择要进行壳处理的体


  一旦您在体上执行 shell 命令，通常不会看到模型外观的任何视觉差异。您可能希望以几种方式检查模型，以更好地了解壳处理后的结果。第一种方法是将视觉样式简单更改为带隐藏边缘的着色或带隐藏边缘的线框，如图
  4.4 所示。这两种视觉样式都会通过在模型内部显示额外的边缘来表明模型已被壳处理。


  ![](img/baa027bed101c08b496f1f420cee8a5b_133_1.png)


  Figure 4.4 – 更改视觉样式


  如果您不想将视觉样式从默认的仅显示可见边缘的着色更改，您可能希望使用截面分析。您可以从 SOLID 选项卡 | INSPECT 面板访问截面分析。选择切割平面后，截面分析命令允许您沿其法线方向平移该平面，以显示组件的切片视图。您还可以翻转切割方向，以便按需查看零件内部。图
  4.5 显示了该零件的截面分析视图。您还会注意到截面分析在浏览器中的 Analysis 文件夹内添加了一个名为 Section1 的项目。我们可以通过切换可见性图标来控制所有截面分析以及我们添加到模型中的其他分析的可见性。


  ![](img/baa027bed101c08b496f1f420cee8a5b_134_0.png)


  Figure 4.5 – 应用截面分析以可视化 shell 命令的结果


  如果我们正在处理网格对象，我们也可以创建中空版本。MESH 选项卡 | MODIFY 面板中的 shell 命令允许我们选择体，输入厚度并创建该对象的中空版本。与
  SOLID 选项卡中可用的 SHELL 命令不同，MESH 选项卡中的 SHELL 命令不允许选择面。这意味着我们无法使用 MESH 选项卡中的 SHELL 命令创建相同的形状。然而，在
  SOLID 选项卡中的 shell 命令无法创建所需结果的情况下，您可以对实体进行 tessellation 并创建其网格版本。之后，您可以尝试 MESH 选项卡中的
  shell 命令，如图 4.6 所示。


  ![](img/baa027bed101c08b496f1f420cee8a5b_135_0.png)


  Figure 4.6 – 使用 MESH 选项卡中的 shell 命令中空体


  一旦我们获得了网格体的中空版本，我们可以通过将视觉样式更改为带隐藏边缘的着色，或通过应用截面分析来查看结果，类似于我们在图 4.5 中对实体添加截面分析的方式。当我们向网格体添加截面分析时，我们将看不到阴影视图。相反，我们将看到网格体的三角形沿切割平面被截面，如图
  4.7 所示。


  ![](img/baa027bed101c08b496f1f420cee8a5b_135_1.png)


  Figure 4.7 – 中空网格体的截面分析视图


  在本节中，我们重点介绍了如何在实体和网格体上使用 shell 命令。我们介绍了如何通过移除一个或多个面来对实体进行壳处理，以及保持体完整并简单地掏空模型内部体积。使用特定于网格的
  shell 命令，我们在网格体上重复了该过程。在每次壳操作后，我们学习了如何通过更改可视化设置以及添加截面分析来可视化 resulting 壳处理后的体，以在适当时查看内部表面和切割平面上的阴影。


  在下一节中，我们将介绍如何在中空模型中添加排水孔的位置和方式，以便在 3D 打印此类模型期间和之后移除可能被困在内部的任何原材料。


  ## 创建排水孔


  3D 打印中空零件后，我们需要在后处理阶段排出或移除所有被困的粉末/树脂。这就是为什么我们需要在设计阶段包含排水孔的原因。排水孔的直径取决于我们使用的 3D 打印技术以及我们使用的打印材料的粘度。例如，如果您使用的是基于激光的树脂打印机（SLA），您的树脂通常比
  DLP 打印机树脂更粘稠。某些树脂也可用于 DLP 和 SLA 打印机。树脂越粘稠，排水孔的直径就需要越大。


  表 4.1 显示了来自不同来源的两种粘度不同的树脂。根据制造商的说法，第二种树脂兼容 SLA 和 DLP 打印机：


  | 树脂 | 25°C 时的粘度 |

  |---|---|

  | Prusa Orange Tough: https://www.prusa3d.com/product/prusament-resin-tough-prusa-orange-1kg-2/#downloads
  | 180-280 centipoise |

  | Liqcreate Strong-X: https://www.liqcreate.com/product/strong-x/#technical | 550
  centipoise |


  Table 4.1 – 用于 SLA 和 DLP 打印的树脂及其粘度


  使用 SLA 3D 打印技术可以创建的最小孔径为 0.5 毫米，如 Hubs.com 上 3D 打印设计规则所述，如第 2 章图 2.25 所示。同一图表还显示
  SLS 工艺的孔最小直径为 1.5 毫米。然而，通常的做法是为 DLP 打印机引入至少两个直径 2 毫米的排水孔，为 SLA 打印机引入三个或更多直径 3.5
  毫米的排水孔。同样，对于 SLS 打印机，建议至少使用两个直径 3.5 毫米的排水孔以获得最佳效果。请记住，增加更多更大的排水孔总能更轻松地从内部空腔中移除未烧结粉末以及未固化树脂。


  排水孔的放置也需要考虑。另一个需要排水孔的原因，特别是在基于树脂的打印机上，是消除杯状效应。杯状效应发生在我们 3D 打印一层并且打印床在树脂中上下移动时，产生压力


  在封闭的容积内。添加排水孔以释放可能发生吸盘效应的地方的压力，将有助于我们的打印成功，消除支撑结构失效，并消除层移问题。


  现在我们已经介绍了为什么需要排水孔以及它们应该有多大，让我们讨论一下通常应该将它们放置在哪里。在树脂打印中，最好将排水孔放置在尽可能靠近打印机成型平台的位置，具体取决于为零件选择的打印方向。这意味着我们在设计排水孔之前必须先为
  3D 打印定向模型。我们将在第 8 章详细介绍组件的定向。一旦我们选择了方向，我们就可以在模型底部表面靠近成型平台的位置放置排水孔。这将确保在树脂打印机的打印过程中，我们的空心模型内部不会积压压力。我们对于
  SLS 打印机没有同样的排水孔放置问题，因为打印过程中吸盘效应和压力积聚通常不是问题。这意味着只要远离关键表面，我们就可以将它们放置在模型上的任何位置。


  现在让我们演示如何使用 Fusion 360 创建排水孔。图 4.8 显示了我们在上一节中处理的同一个挂钩模型，已经定向为使用 SLA/DLP 打印机打印。为了更好地可视化零件相对于成型平台的方向，我还添加了一个沿
  XY 平面的构造平面。此外，零件的不透明度已降低至 50%，以显示零件已被掏空。


  ![](img/baa027bed101c08b496f1f420cee8a5b_137_0.png)


  图 4.8 – 用于树脂 3D 打印的定向空心挂钩模型


  对于这个零件，我们至少需要两个直径 2 毫米的孔。这些孔的最佳放置位置是在挂钩底部组件的背面，如图 4.9 所示。由于该模型允许创建更大的孔，我将两个孔的孔径均选为
  3 毫米。


  ![](img/baa027bed101c08b496f1f420cee8a5b_138_0.png)


  图 4.9 – 创建草图并绘制两个圆


  完成草图后，我们可以使用 **EXTRUDE** 命令或 **HOLE** 命令创建排水孔。在图 4.10 中，您可以看到如何使用 **HOLE** 命令创建排水孔，并对孔的大小、深度和形状进行详细控制。


  ![](img/baa027bed101c08b496f1f420cee8a5b_138_1.png)


  图 4.10 – 使用 HOLE 命令创建两个排水孔


  创建孔后，我们可以添加 **SECTION ANALYSIS**，如 *图 4.11* 所示。在创建剖面分析期间，如果我们从 **BROWSER** 中的 Origin
  节点选择 XY 平面作为切割平面，将其在正 Z 方向偏移约 22 毫米，并翻转剖面视图，我们可以看到零件底部并观察到我们已创建了两个小孔，树脂在 3D 打印过程中可以通过这些孔排出：


  ![](img/baa027bed101c08b496f1f420cee8a5b_139_0.png)


  图 4.11 – 剖面分析显示两个排水孔


  为基于网格的模型创建排水孔与为实体模型创建排水孔类似。在打开网格体、将其掏空并旋转到我们希望进行 3D 打印的方向后，我们必须访问位于 **MESH** 选项卡
  | **MODIFY** 面板内的 **DIRECT EDIT** 命令，如 *图 4.12* 所示：


  ![](img/baa027bed101c08b496f1f420cee8a5b_140_0.png)


  图 4.12 – 利用网格体的直接编辑模式


  一旦进入 DIRECT MESH EDITING 选项卡，我们就可以使用 CONSTRUCT 面板中的功能通过三个点创建平面。我们稍后将利用此构造平面创建草图，以便我们知道孔的位置。


  ![](img/baa027bed101c08b496f1f420cee8a5b_140_1.png)


  图 4.13 – 在网格体上创建构造平面


  构造平面创建后，我们可以在功能区中选择 **FINISH DIRECT EDITING** 命令，这将使我们返回到 Fusion 360 的参数化设计模式。现在我们准备创建草图。我们可以访问
  **SOLID** 选项卡 | **CREATE** 面板中的 **SKETCH** 命令。一旦进入 **SKETCH** 选项卡，我们需要创建多个圆来表示排水孔。图
  4.14 演示了两个相距 20 毫米、直径为 3 毫米的圆。完成草图后，我们可以在功能区中选择 **FINISH SKETCH** 命令：


  ![](img/baa027bed101c08b496f1f420cee8a5b_141_0.png)


  图 4.14 – 在草图环境中创建两个圆


  现在，我们准备挤出这两个轮廓并创建两个圆柱体。使用位于 **SOLID** 选项卡 | **CREATE** 面板中的 **EXTRUDE** 命令，我们可以选择新创建的圆形轮廓并将其挤出，使其略高于零件的厚度。在上一节中，当我们掏空这个零件时，我们将壁厚设计为
  5 毫米。因此，创建 10 毫米的挤出对于我们的孔来说应该足够了。


  ![](img/baa027bed101c08b496f1f420cee8a5b_142_0.png)


  图 4.15 – 挤出圆形轮廓以制作代表排水孔的圆柱体


  在 *第 2 章* 中，我们详细讨论了如何使用 Fusion 360 处理 CAD 和网格文件。我们在该章节中介绍的工作流程之一是将实体模型 tessellate
  以将其转换为网格体，以便与其他网格体结合起来。这正是我们接下来要做的。让我们开始使用位于 **MESH** 选项卡 | **CREATE** 面板中的 **TESSELLATE**
  命令，对这两个新的圆柱实体体进行操作。


  ![](img/baa027bed101c08b496f1f420cee8a5b_142_1.png)


  图 4.16 – 对两个圆柱实体体进行 Tessellate


  一旦我们将实体体转换为网格体，使用位于 MESH 选项卡 | MODIFY 面板中的 COMBINE 功能，我们可以选择 REMOVE 操作并将其从直接编辑的
  tessellated 挂钩体中移除，如图 4.17 所示：


  ![](img/baa027bed101c08b496f1f420cee8a5b_143_0.png)


  图 4.17 – 使用 Combine 命令从挂钩中移除两个圆柱体


  正如我们对实体体添加剖面分析以显示排水孔一样，我们可以沿 XY 平面对网格体应用剖面分析并将其在正 Z 方向上上移 22 毫米以显示排水孔：


  ![](img/baa027bed101c08b496f1f420cee8a5b_144_0.png)


  图 4.18 – 剖面分析以显示网格体内的排水孔


  在本节中，我们介绍了如何在为树脂打印正确定向后，使用实体体和网格体添加排水孔。相同的原理也适用于为使用其他 3D 打印技术（如 SLS 或 Multi Jet
  Fusion）的几何体添加排水孔。


  ## 创建内部晶格结构


  在之前的章节中，我们介绍了可以掏空实体或网格体的各种方法。我们演示了如何添加排水孔，以便在零件 3D 打印后可以清除任何被困的粉末或树脂。我们掏空零件的主要目标是使其轻量化，以便在打印零件时不会浪费材料和能源。


  每当我们创建空心物体时，我们还应注意这些零件是否能够自支撑进行 3D 打印，这取决于我们选择的 3D 打印技术。你会记得从之前的章节中，如果我们使用 SLS 进行
  3D 打印，我们不需要支撑结构。然而，如果你使用基于树脂的打印机（如 SLA 或 DLP）进行 3D 打印，模型上具有超过临界角度的悬垂部分将需要支撑结构。我们通常认为支撑结构是在零件外部打印的材料，以便在打印过程中支撑我们的零件。类似的概念也适用于我们掏空的零件。如果我们掏空一个零件，我们本质上是在创建内部表面，这些内部表面也可能需要支撑结构，以便我们的零件能够使用树脂打印机成功打印。在本节中，我们将讨论如何创建这些内部支撑结构。




  在掏空零件后创建一个内部支撑结构的一种方法是创建晶格。Fusion 360 提供了多种创建内部晶格的工作流程。在本节中，我们将具体讨论如何创建体积型、基于网格的和实体晶格。在
  *第 10 章* 中，我们将更详细地介绍如何在制造工作区的上下文中创建支撑结构。在同一章中，我们还将把这些支撑结构应用于零件的外表面，以及根据需要应用于内表面。毕竟，将支撑结构应用于零件的内表面与添加内部晶格的目的相同。


  让我们从体积晶格开始探索晶格生成。Fusion 360 在访问产品设计扩展后允许用户创建体积晶格。我们已在 *第 2 章* 和 *第 3 章* 中介绍过如何在将有机网格体转换为实体对象的上下文中使用产品设计扩展。在本章中，我们将利用产品设计扩展的另一个关键功能，**体积晶格**。**体积晶格**可在
  **实体**、**网格** 和 **塑料** 选项卡的 **修改** 面板内使用，如图 4.19 所示。


  ![](img/baa027bed101c08b496f1f420cee8a5b_145_0.png)


  图 4.19 – 将均匀的陀螺晶格应用于实体


  **体积晶格** 命令可更改实体或网格体以创建模型的体积表示。使用此命令，您可以在体的边界内快速添加内部晶格结构。图 4.19 显示了将单元尺寸为 2 毫米的陀螺晶格应用于边长为
  10 毫米的盒子的情况。在某些情况下，我们可能希望控制给定单元的尺寸以在特定方向上拉伸晶格。**体积晶格** 命令具有将单元尺寸的比例从均匀更改为非均匀的选项。图
  4.20 显示了非均匀单元尺寸，其中晶格单元的 X 和 Y 方向为 3 毫米，但晶格单元在 Z 方向被拉伸并设置为 5 毫米：


  ![](img/baa027bed101c08b496f1f420cee8a5b_146_0.png)


  图 4.20 – 晶格单元在 Z 方向上被拉伸，非均匀单元尺寸


  根据我们选择的单元形状和零件的方向，我们可能需要考虑定向和/或平移晶格单元，以便可以在无需自身支撑的情况下进行打印。对于此类情况，**体积晶格** 对话框允许我们通过定位和定向参考单元来转换晶格，如图
  4.21 所示：


  ![](img/baa027bed101c08b496f1f420cee8a5b_146_1.png)


  图 4.21 – 将陀螺单元形状沿 Y 轴旋转 15 度


  **体积晶格** 对话框由三个选项卡组成。**设置** 选项卡允许我们选择一个体并应用单元形状，将我们的实体或网格体转换为体积模型。选择体后，它会自动应用陀螺单元形状，因为这是默认的晶格类型。但是，我们可以通过简单地展开下拉菜单并切换到不同的单元形状来选择不同的单元形状，例如图
  4.22 中所示的 **十字** 形状。


  ![](img/baa027bed101c08b496f1f420cee8a5b_147_0.png)


  图 4.22 – 在体积晶格对话框中更改单元形状


  Fusion 360 中的 **体积晶格** 对话框有六种默认单元形状。将所有这些形状应用于边长为 10 的盒子，单元尺寸为 10，实体率为 0.4 的结果可在图
  4.23 中看到：


  ![](img/baa027bed101c08b496f1f420cee8a5b_147_1.png)


  图 4.23 – 体积晶格中每个单元形状的结果形状


  由于陀螺形状是 3D 打印中常见的形状，我们将在本节的其余部分继续使用它。当我们切换到实体率 选项卡时，体积晶格 对话框为我们提供了修改应用于参考体的晶格的实体率的选项。实体率输入范围为
  0 到 1。实体率为 0 表示我们将没有材料，而实体率为 1 指的是完全致密的材料分布：


  ![](img/baa027bed101c08b496f1f420cee8a5b_148_0.png)


  图 4.24 – 均匀修改体积晶格的实体率


  我们还可以控制实体率沿路径的变化。在将分布类型更改为沿路径渐变后，我们可以选择一条边或草图线。体积晶格 对话框将自动检测所选对象的起点和终点，并为我们提供在起点和终点位置之间控制实体率的选项，如图
  4.25 所示。


  ![](img/baa027bed101c08b496f1f420cee8a5b_149_0.png)


  图 4.25 – 沿包围体的边缘变化晶格的实体率


  **体积晶格** 对话框的最后一个选项卡称为 **偏移**。在此选项卡中，我们可以选择一个或多个几何输入，例如面或边，并分配厚度和实体率。*图 4.26* 显示了选择立方体的正面朝向面并分配厚度为
  2 毫米、实体率为 1 后的结果。 resulting 体积模型代表正面朝向面上的 2 毫米厚蒙皮，然后是陀螺晶格。


  ![](img/baa027bed101c08b496f1f420cee8a5b_149_1.png)


  图 4.26 – 为偏移面分配厚度


  到目前为止，我们主要利用体积晶格功能将实体转换为晶格表示。有了偏移 选项卡，我们引入了创建蒙皮的概念。如果需要，我们可以返回到实体率 选项卡并输入实体率为 0，这反过来会从模型的晶格部分移除所有材料。如果我们采取此操作，我们将只剩下使用偏移
  选项卡应用的蒙皮，如图 4.27 所示：


  ![](img/baa027bed101c08b496f1f420cee8a5b_150_0.png)


  图 4.27 – 具有单个偏移面的 0 实体率晶格的结果


  我们可以更进一步，将偏移应用于该实体立方体的所有六个面。如图 4.28 所示，此类操作将创建一个厚度为 2 毫米的中空盒子。每当我们掏空一个体时，很难可视化，因为外部面阻碍我们看到物体内部。正如我们在前一小节中利用剖面分析一样，我们可以简单地转到
  INSPECT 面板并沿 XZ 平面添加一个剖面分析，并将其偏移一定距离，以查看此体积体的内部是什么样子的。


  ![](img/baa027bed101c08b496f1f420cee8a5b_151_0.png)


  图 4.28 – 中空体积体的剖面分析视图


  正如我们在前一小节中介绍的，每当我们掏空一个体时，添加排液孔很重要，以便在 3D 打印后可以移除 trapped 树脂或粉末。如果您利用体积晶格来掏空一个体，您可以简单地创建草图，制作一个圆，并使用
  HOLE 命令创建排液孔。在图 4.29 中，您可以看到添加了一个直径为 2 毫米的排液孔。


  ![](img/baa027bed101c08b496f1f420cee8a5b_151_1.png)


  图 4.29 – 具有排液孔的中空体积体的剖面视图


  由于本小节的主要目标是应用晶格，让我们返回浏览器中的 **体积晶格**，右键单击并编辑它，如图 4.30 所示。当我们编辑体积晶格时，我们可以访问 **实体率**
  选项卡并将实体率从 0 增加到 0.2，从而为此已经具有排液孔的零件同时应用蒙皮和晶格：


  ![](img/baa027bed101c08b496f1f420cee8a5b_152_0.png)


  图 4.30 – 壳化并晶格化的体积模型


  一旦我们完成设计，Fusion 360 为 3D 打印体积模型提供了两种方法。第一种方法是切换到制造工作区，使用适当的 3D 打印机创建增材制造设置，并在 Fusion
  360 中原生切片体积模型以进行 3D 打印。第二种方法是创建网格体，以便我们可以将其导出到第三方切片软件。要将体积体转换为网格体，我们必须从浏览器中选择它并右键单击。如图
  4.31 所示，选择 **创建网格** 选项后，我们将能够创建体积体的网格表示：



  ![](img/baa027bed101c08b496f1f420cee8a5b_153_0.png)


  图 4.31 – 从体积体创建新的网格体


  生成的网格可以使用我们在第 2 章中介绍的所有原生网格工具进行编辑和可视化。在图 4.32 中，我们可以看到应用了截面分析的生成的网格体，以显示内部晶格和排水孔。


  ![](img/baa027bed101c08b496f1f420cee8a5b_153_1.png)


  图 4.32 – 从体积模型创建的网格体的截面分析视图


  现在是时候从体积晶格中可用的默认单元形状转向自定义形状和实体晶格了。由于 Fusion 360 是一款参数化 CAD 工具，我们可以快速生成草图、曲面或实体体，然后将其用作体积晶格中自定义单元类型的输入。图
  4.33 显示了使用沿距离拉伸的草绘圆圈重建的十字单元形状，并使用圆形图案重复图案化两次以创建三个体，然后将它们组合成一个单体晶格单元。


  ![](img/baa027bed101c08b496f1f420cee8a5b_154_0.png)


  图 4.33 – 单个单元的实体建模


  现在自定义单元设计完成后，我们可以在 VOLUMETRIC LATTICE 对话框中将此单元形状应用于不同的体。图 4.34 显示了将我们的自定义单元应用于 10
  毫米 x 10 毫米 x 10 毫米的盒子：


  ![](img/baa027bed101c08b496f1f420cee8a5b_155_0.png)


  图 4.34 – 在体积晶格中将实体体用作自定义单元


  使用自定义晶格作为体积晶格的输入单元形状时，我们必须记住 Fusion 360 是一款参数化 CAD 工具，我们对用作自定义晶格输入的体所做的任何更改都将对体积模型产生下游影响，如图
  4.35 所示。


  ![](img/baa027bed101c08b496f1f420cee8a5b_155_1.png)


  图 4.35 – 修改自定义单元实体体的即时影响


  现在我们已经介绍了使用体积晶格的所有细节，我们可以将其应用于我们在前一小节中设计和修改的零件。您可以参考提供的名为 `Hook with drain hole
  and lattice` 的文件，以查看将具有 10 毫米单元尺寸的 gyroid 晶格应用于钩子的全部 23 个面并设置 5 毫米厚度的偏移后的结果：


  ![](img/baa027bed101c08b496f1f420cee8a5b_156_0.png)


  图 4.36 – 钩子模型的体积版本的截面视图


  正如我们之前概述的，如果我们想将此模型从 Fusion 360 导出以使用第三方切片软件进行切片，我们必须创建网格。选择体并右键单击后，我们只需选择 **创建网格**
  并在结果对话框中点击 **确定**。完成后，我们将能够在截面视图中可视化我们模型的网格结果，如 *图 4.37* 所示。


