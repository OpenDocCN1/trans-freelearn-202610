  \n## 开始使用自动化建模\n\n在之前的章节中，我们介绍了如何使用参数化建模和直接建模来对现有设计进行更改。使用实体和网格建模技术，我们创建了孔、口袋和掏空零件，这些都是轻量化零件的有用方法。\n\
