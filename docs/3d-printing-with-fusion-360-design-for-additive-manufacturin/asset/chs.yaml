  ## 12


  ## 3D Printing with Metal Printers


  欢迎来到第 12 章，我们将学习有关金属增材制造的所有知识。金属 3D 打印在过去几年中越来越受欢迎，因为它为众多行业，例如航空航天、医疗保健和高档消费品，提供了长长的益处清单。使用金属
  3D 打印，您可以创建具有复杂内部结构和有机外部表面的零件，这些零件无法通过其他方式制造。与其他制造方法相比，金属 3D 打印在小批量生产中更具成本效益。


  Fusion 360 结合 Additive Build 扩展，可用于创建使用金属制造零件的 3D 打印机的增材设置。在本章中，我们将介绍在 Fusion 360
  中使用金属增材制造的各种方法。我们将介绍如何利用 Fusion 360 准备模型，以便使用熔融沉积制造、金属粘结剂喷射、金属粉末床熔融和定向能量沉积技术进行 3D
  打印。我们还将展示如何根据打印技术选择相关的打印设置。我们将重点介绍如何根据机器特定因素（如匀粉刀方向）对零件进行定向和放置。


  根据特定 3D 打印机使用的增材技术以及零件方向，零件在打印过程中可能需要支撑结构。由于金属粉末床熔融过程中使用的支撑与熔融沉积制造和树脂打印所需的支撑不同，我们还将学习如何创建技术相关的支撑结构，以最大限度地减少材料浪费、缩短打印时间并最大限度地减少后处理工作量。


  无论我们是使用定制的熔融沉积制造（FFF）3D 打印机打印金属耗材，还是使用金属粘结剂喷射 3D 打印机，我们可能都需要支撑结构来成功打印零件，或在烧结过程中为零件提供必要的支撑。在本章中，我们还将学习如何使用
  Fusion 360 创建定位支撑，以防止零件因在烧结炉中暴露于高温而变形。


  在本章中，我们将介绍以下主题：


  - 金属 3D 打印简介

  - 使用金属粉末床熔融机器进行 3D 打印

  - 用于成功烧结工艺的定位支撑


  到本章结束时，您将很好地了解可用于使用金属材料制造零件的各种 3D 打印技术。您将学会如何使用 Fusion 360 与能够制造金属零件的 3D 打印机创建增材设置。您将了解如何根据
  3D 打印技术选择合适的零件放置和方向。您还将学会如何为金属 3D 打印创建轻量级支撑结构。最后，您将学会如何为使用金属粘结剂喷射打印的零件创建支撑结构，以最大限度地减少烧结过程中的变形。


  ### Technical requirements


  在本章中，我们将介绍金属增材制造。我们将介绍如何使用 FFF 和粘结剂喷射打印机进行金属 3D 打印。这些打印机可供所有 Fusion 360 用户使用（许可证类型：个人、试用版、商业、初创企业和教育）。


  然而，我们还将使用多台金属粉末床熔融（MPBF）3D 打印机及其各自的打印设置。我们将介绍如何为 MPBF 机器和金属粘结剂喷射机器生成支撑结构。在获得 Additive
  Build 扩展访问权限之前，这些支撑结构在 Fusion 360 中不可用。


  与所有其他 Fusion 360 扩展一样，Additive Build 扩展不适用于个人使用。


  如果您拥有 Fusion 360 的商业许可证，要使用 MPBF 机器创建增材设置，您还需要访问 Additive Build 扩展（https://www.autodesk.com/products/Fusion-360/additive-build-extension）。


  Autodesk 为所有 Fusion 360 商业用户提供 Additive Build 扩展的 14 天试用期。您可以在 Fusion 360 的扩展对话框中激活试用期。


  Additive Build 扩展也免费提供给初创企业和教育许可证用户。


  本章的练习文件可在以下位置找到：https://github.com/PacktPublishing/3D-Printing-with-Fusion-360。


  ## Introduction to Metal 3D printing


  在第 7 章中，我们使用 FFF 打印机创建了第一个增材设置。在本章中，我们将介绍如何使用能够进行金属 3D 打印的机器创建增材设置。


  Fusion 360 机器库包含具有各种技术增材能力的机器。图 12.1 显示了如何在机器库中根据技术筛选增材机器。Fusion 360 的机器库可在 MANUFACTURE
  工作区中访问。您可以在任何选项卡的 MANAGE 面板中访问 Machine Library 命令。如果您有权访问 Additive Build 扩展，在创建增材设置时，您将能够在
  Machine Library 中选择 MPBF 机器：


  ![](img/baa027bed101c08b496f1f420cee8a5b_349_0.png)


  图 12.1 – Fusion 360 机器库


  正如我们在本章介绍中所提到的，使用增材制造时多种技术能够生成金属零件。你可以使用 FFF、MPBF、粘结剂喷射、**定向能量沉积 (DED)** 和 **电子束熔化
  (EBM)** 来制造金属零件。Fusion 360 可以帮助你使用五种增材制造技术中的四种生成金属零件，如 *表 12.1* 所示。对于每一种受支持的增材制造技术，Fusion
  360 都有来自机器制造商列表的机器，你可以使用它们来创建你的增材设置。每种机器供应商和技术都有其能力和局限性，因此创建金属零件的工作流程会因技术和供应商而异。


  在本章中，我们将主要关注 MPBF 和粘结剂喷射技术。然而，在本节中，我们将简要介绍如何使用 Fusion 360 通过 FFF 来制造金属零件：


  | 熔融长丝制造 | 定向能量沉积 | 粘结剂喷射 | 金属粉末床熔融 |

  |---|---|---|---|

  | Ultimaker * | Autodesk Generic | Desktop Metal * | Aconity |

  | Raise3D * | Meltio | Sintertek * | Additive Industries |

  | 所有 FFF 机器（0.6 mm 喷嘴） |  | HP | DMG Mori |

  |  |  | Digital Metal | EOS |

  |  |  |  | Kurtz Ersa |

  |  |  |  | One Click Metal |

  |  |  |  | Renishaw |

  |  |  |  | SLM Solutions |

  |  |  |  | Xact Metal |


  表 12.1 – Fusion 360 支持的金属 3D 打印机器制造商


  在表 12.1 中，你会注意到某些制造商旁边有一个 *。Fusion 360 机器库包含此表中列出的所有机器制造商的机器。然而，你可能无法使用 Fusion 360
  对所有机器库中的机器进行模型切片并创建增材工具路径以使用金属耗材或金属粉末进行 3D 打印。


  对于带有 * 的制造商的机器，Fusion 360 可能没有其库中必要的打印设置，或可能无法创建机器制造商所需的特定切片文件格式。不过，你仍然可以使用 Fusion
  360 在打印机的成型体积内定向零件并根据需要生成支撑结构。


  UltiMaker 和 Raise3D 都利用 FFF 技术使用金属耗材进行 3D 打印。如果你拥有一台配备金属扩展套件的 UltiMaker S5（或 Method
  3D）打印机，你可以升级你的 3D 打印机以解锁金属 FFF 功能。使用此升级，你将能够使用 BASF Ultrafuse 17-4PH 或 316L 材料进行打印。这些材料的必要打印设置可以从
  UltiMaker Cura 软件的 Material Marketplace 下载。下载后，如图 12.2 所示，你可以使用 cc0.4 或 cc0.6 喷嘴芯进行打印。Fusion
  360 打印设置库不包含针对 UltiMaker 打印机使用这些金属耗材的已验证打印设置：


  ![](img/baa027bed101c08b496f1f420cee8a5b_350_0.png)


  图 12.2 – 配备金属扩展套件的 UltiMaker S5 及来自 BASF 的耗材


  如果你可以使用 Raise3D 的 Forge 1 打印机，你可以使用相同的 BASF 耗材（17-4PH 或 316L）通过你的 FFF 机器生成金属零件。与使用
  UltiMaker S5 机器进行金属零件 3D 打印类似，Fusion 360 打印设置库不包含针对 Raise3D 打印机的 BASF 17-4PH 或 316L
  的已验证打印设置。


  对于 Forge 1，你需要使用 Raise3D 的原生切片软件 ideaMaker for Metal 来切片你的模型并生成增材工具路径，因为 ideaMaker
  软件包含这些材料的必要打印配置文件。


  只有 UltiMaker 和 Raise3D 提供使用不锈钢耗材进行 3D 打印、脱脂和烧结的专用解决方案。对于 UltiMaker，你需要将打印好的金属零件寄送给数家专门的脱脂和烧结服务提供商，以将成品寄回。如果你拥有一台
  Raise3D Forge 1 打印机，你还可以从 Raise3D 购买脱脂和烧结工作站，在你的设施内完成整个流程。


  如果你有一台来自其他机器提供商的 FFF 打印机，你可以使用金属耗材、专用挤出机以及来自解决方案提供商（如 The Virtual Foundry (https://shop.thevirtualfoundry.com/)）的脱脂和烧结工作站。如
  The Virtual Foundry 网页所示，他们目前向客户提供八种金属耗材——Aluminium 6061、Bronze、Copper、H13 Tool
  Steel、High Carbon iron、Inconel® 718、Tungsten、不锈钢 17-4 和 316L，以及 Titanium 64-5。


  Fusion 360 打印设置库已包含来自 The Virtual Foundry 的 Copper 和 Bronze 的必要打印设置。Autodesk 的以下博客重点介绍了设计师如何已经使用
  Fusion 360 和 Prusa 3D 打印机采用这种金属 3D 打印方法：https://www.autodesk.com/products/fusion-360/blog/imagining-3d-printed-future-sts-technical-design-virtual-foundry/。


  请注意，如果你选择使用此工作流程，你必须在切片和生成增材工具路径之前手动按每种材料的预定乘数因子放大零件。在 3D 打印前进行缩放是必要的，因为零件在烧结过程中会收缩。在之前链接的
  Autodesk 博客中，最终用户在切片和打印前将零件放大了 10%。


  此工作流程的示例可在图 12.3 中看到。Fusion 360 文档 Slotted Liner 也提供在本章的 GitHub 仓库中。此 Fusion 文档展示了如何使用
  Prusa i3 MK3S+ 打印机设置金属增材打印。下图显示了使用定制 Prusa 打印机的增材设置。如浏览器所示，此增材设置使用 0.6 mm 喷嘴，而不是默认的
  0.4 mm 喷嘴。此定制是通过编辑为此增材设置选择的 3D 打印机完成的。此外，此设置还包括 Virtual Foundry Copper (Direct Drive)
  打印设置。在同一图中，你可以看到此材料的 Print Setting Editor，其中显示了 Normal body 预设的 Infill 部分。如我们所见，此打印设置使用
  100% 填充密度和 Rectilinear 模式。增材设置基于 Manufacturing Model 1 中的组件。


  如果你在 Fusion 360 中打开此模型并查看 **制造模型 1**，你还会注意到正在 3D 打印的组件与 **设计** 工作区中的模型相比放大了 10%。你可能还记得我们在
  *第 6 章* 中讲解过如何使用 Manufacturing Models 在 **制造** 工作区内修改组件：


  ![](img/baa027bed101c08b496f1f420cee8a5b_352_0.png)


  图 12.3 – 配备 0.6 mm 硬质钢喷嘴和铜耗材的 Prusa i3MK3S+


  现在我们已经介绍了使用 FFF 打印机通过金属耗材进行 3D 打印的选项，让我们转向另一种技术：DED。除了通用的 DED 打印机外，Fusion 360 机器库还包括来自机器制造商
  MELTIO 的名为 M450 的 DED 打印机。该打印机利用多台激光和金属丝制造零件。你可以使用此打印机创建增材设置，并从 Fusion 的打印设置库中选择
  316SS 打印设置，以生成该打印机所需的增材工具路径。


  由于 DED 工艺不需要脱脂或烧结，因此在创建增材设置之前无需放大组件。在生成增材工具路径并对其进行模拟后，如图 12.4 所示，你可以对增材工具路径进行后处理并生成使用此
  3D 打印机制造零件所需的 G-code。图 12.14 展示了 Fusion 360 中使用此打印机的六个金属表壳的增材设置以及相应的 3D 打印。


  打印零件的图像来源可在 https://meltio3d.com/technology/ 找到：


  ![](img/baa027bed101c08b496f1f420cee8a5b_353_0.png)


  图 12.4 – 使用 Meltio M-450 的增材设置及打印件


  你还可以使用 Fusion 360 利用的另一项技术来打印金属零件，即粘结剂喷射。你可以使用 Fusion 360 为多台 Desktop Metal 打印机以及
  Sintertek 的 Sinterjet M60 打印机创建增材设置。在这些设置中，你可以使用自动定向工具和我们在前几章中介绍的增材排列功能来定向和排列零件。


  完成增材设置后，你需要将设置导出为 3MF 文件，并使用这些公司的原生切片软件来打印零件。根据你使用的机器制造商，你可能还需要在生成 3MF 文件之前根据你感兴趣的
  3D 打印材料将零件放大。


  如果使用 HP 的金属粘结剂喷射打印机，Fusion 360 提供了额外的功能，可将 Fusion 连接到打印机并直接向机器发送打印作业。图 12.5 显示了为
  HP Metal Jet 打印机定向和排列的 `Connector` 零件的增材设置。


  在此 Fusion 360 文档中，**DESIGN** 工作区包含一个单一组件。**Manufacturing Model 1** 用于创建 70 个待打印组件。Setup
  1 显示了使用增材排列功能将全部 70 个组件放置在此 3D 打印机构建体积内的结果。在 Autodesk App Store（位于 https://apps.autodesk.com/FUSION/en/Detail/Index?id=5739757793764591673）中安装并运行
  `HP 3D Printers for Fusion 360 App` 后，你会注意到在 **ADDITIVE** 选项卡内出现了一个名为 **HP** 的新面板。使用该面板中的命令，你可以通过输入打印机的
  IP 地址将 Fusion 360 连接到你的 HP Jet Fusion 打印机。你还可以在 Fusion 中存储和管理所有 HP 打印机的列表。连接特定打印机后，你可以查询该打印机的其他详细信息并获取之前提交的打印作业的状态。一旦准备好打印模型，你也可以使用此实用工具直接向打印机发送打印作业：


  ![](img/baa027bed101c08b496f1f420cee8a5b_354_0.png)


  图 12.5 – 使用 HP Metal Jet S100 打印机的增材设置


  在此工作流程中，你无需担心缩放模型，因为 Fusion 360 与 HP Jet Fusion 打印机之间的连接会在你将作业发送到打印机时根据材料选择自动缩放模型。


  在本节中我们将重点介绍的 Fusion 360 **Machine Library** 中的最后一个粘结剂喷射打印机是 `Digital Metal PX100`。在
  Fusion 的 **MANUFACTURE** 工作区中，你可以为该打印机创建机器构建文件以开始打印作业。*图 12.6* 显示了我们在前一图中使用的同一模型在新的制造模型中。


  **Manufacturing Model 2** 共有九个相同组件的副本。**Setup2** 包含 **Manufacturing Model 2** 中的所有组件，使用
  Digital Metal PX100 打印机和 316L 不锈钢打印设置。当为该打印机创建增材设置时，你必须编辑制造模型并根据你希望使用的 3D 打印材料放大零件。


  在此示例中，我们在制造模型中按非均匀缩放系数缩放这九个组件，以考虑烧结过程中不均匀的收缩。完成增材设置后，要启动打印，你可以访问 **ADDITIVE** 选项卡的
  **ACTIONS** 面板中的 **Create Machine Build File** 命令。这将显示 **CREATE MACHINE BUILD FILE**
  对话框，并允许你选择 **CLI** 作为导出文件格式。创建切片文件 (*.cli) 后，你可以将其带到打印机并开始打印作业：


  ![](img/baa027bed101c08b496f1f420cee8a5b_355_0.png)


  图 12.6 – 使用 Digital Metal PX100 打印机的增材设置


  在本节中，我们重点介绍了如何在 Fusion 360 中创建用于金属 3D 打印的四种增材制造技术中的三种的设置。我们介绍了如何使用 UltiMaker 和 Raise3D
  的打印机进行金属 3D 打印。我们还介绍了如何自定义现有的 FFF 打印机并使用 The Virtual Foundry 等供应商的耗材进行 3D 打印。除了
  FFF 之外，我们还展示了如何使用 Fusion 360 利用 DED 以及粘结剂喷射技术来创建金属 3D 打印的增材设置。FFF 和粘结剂喷射技术都需要额外的后处理步骤，例如烧结，以生成完全致密的金属零件。


  在下一节中，我们将介绍使用粉末床熔融技术进行金属 3D 打印。我们还将讨论使用 Fusion 360 为这种增材制造技术创建的独特支撑结构。


  ## 使用金属粉末床熔融机器进行 3D 打印


  MPBF 是 Fusion 360 中完全支持的增材制造技术，用于使用金属粉末打印零件。Fusion 360 的 Machine Library 目前具有来自以下九家机器制造商的
  MPBF 打印机：Aconity、Additive Industries、DMG Mori、EOS、Kurtz Ersa、One Click Metal、Renishaw、SLM
  Solutions 和 Xact Metal。拥有 Additive Build 扩展是使用这些机器提供商中的任何一个的 MPBF 3D 打印机创建增材设置的先决条件。


  除了这九家机器制造商之外，你还可以使用 Autodesk 通用 MPBF 机器创建增材设置，如图 12.7 所示。创建设置并在构建平台上排列零件后，假设你不需要支撑结构，你可以为可使用
  SLC 和 CLI 等通用文件格式的 3D 打印机生成必要的机器文件。你可以从 **MANUFACTURE** 工作区中 **ADDITIVE** 选项卡的 **ACTIONS**
  面板访问 Create Machine Build File 命令。**CREATE MACHINE BUILD FILE** 对话框将允许你在为打印机创建刀具路径文件时指定要使用的导出程序组件：


  ![](img/baa027bed101c08b496f1f420cee8a5b_356_0.png)


  图 12.7 – 使用 Autodesk 通用 MPBF 打印机的增材设置


  现在我们已经使用通用 MPBF 打印机创建了增材制造设置，让我们演示如何使用特定机器供应商的 3D 打印机创建类似的设置。


  在此练习中，我们将利用使用 Fusion 360 自动建模设计的组件，使用 One Click Metal MPRINT+ 打印机创建增材设置。切换到 **MANUFACTURE**
  工作区后，我们可以在 **ADDITIVE** 选项卡中创建增材设置。在创建设置期间，选择打印机时，我们可以选择相关的打印设置。在图 12.8 中，Setup1
  使用名为 OCM MPRINT+ SS316L 40 Micron ATU 的打印设置创建。这是为该打印机随 Fusion 360 提供的两个打印设置之一。这些两个打印设置仅用于演示目的。如果你拥有
  One Click Metal (OCM) 打印机，你将从 OCM 销售团队获得用于你正在 3D 打印的材料打印设置。选择打印机和打印设置后，你可以在 SETUP
  对话框中选择 OK 并创建增材设置：


  ![](img/baa027bed101c08b496f1f420cee8a5b_357_0.png)


  图 12.8 – 使用 OCM 打印机创建增材设置


  创建设置后，我们必须做的第一件事之一是在构建体积内排列零件。对于 MPBF 打印机，我们通常使用如图 12.9 所示的 2D 排列选项。此排列类型允许我们在打印机的构建体积内组织零件，以便有效地打印多个零件。在此示例中，由于我们只打印单个零件，因此无需担心
  **ADDITIVE ARRANGE** 对话框中的对象间距输入。2D 排列类型将自动将所选组件放置在构建板的中心周围，同时确保我们的零件距离平台边缘有一定的距离，如
  Frame Width 输入字段所示。


  我们还希望确保我们的零件在构建板上方有一定的高度。在此示例中，我们在构建板和组件之间使用 3 mm 间隙。我们需要这样的平台间隙，以便我们可以使用带锯将零件与构建板分离，而不会损坏打印的模型：


  ![](img/baa027bed101c08b496f1f420cee8a5b_358_0.png)


  Figure 12.9 – 在 3D 打印机的成型体积内布置部件


  下一步是为此 MPBF 增材设置进行打印准备，即定向我们的部件。如 *图 12.10* 所示，我们可以使用 **自动定向** 命令，该命令我们在 *第 8 章*
  中已详细讲解过，以为该零件找到合适的定向。


  在本例中，我们还必须激活 **支撑底部表面** 复选框，并为 **距离平台 (Z)** 输入字段输入 3 mm 的值，以便我们的定向研究结果与期望的布置结果相匹配。如果使用自动定向时采用
  Fusion 360 提供的默认排序选项，则 MPBF 的排序输入无需修改：


  ![](img/baa027bed101c08b496f1f420cee8a5b_359_0.png)


  Figure 12.10 – 创建自动定向研究


  自动定向完成后，我们可以开始查看其结果并切换不同的排序结果。图 12.11 显示了此次定向结果中排名第五的结果。在本例中，我们将使用该结果，因为它打印该零件所需的支撑体积最少。


  选择定向结果时另一个需要考虑的因素是涂粉刀方向。Fusion 360 在大多数金属 3D 打印机上会在成型平台旁用箭头显示涂粉刀方向，如图 12.11 所示。使用
  MPBF 打印零件时，由于 3D 打印层上热诱导应力的影响，零件的薄水平段往往会在正 Z 方向发生变形。这种变形会在 3D 打印机在各层之间涂覆新粉末时在涂粉刀与零件之间产生阻力。必须减少零件与涂粉刀之间的此类阻力，以便成功打印零件。如果在同一成型体积内打印多个零件，需要考虑它们在成型平台上的位置与涂粉刀方向的关系。您不希望零件呈与涂粉刀方向垂直的线性排列。相反，最好沿涂粉刀方向交错排列，以防止涂粉刀阻力突然增加以及刀片与零件发生碰撞：


  ![](img/baa027bed101c08b496f1f420cee8a5b_360_0.png)


  Figure 12.11 – 选择零件的打印定向


  到目前为止，我们主要重复了之前章节中学到的打印准备步骤。此时，我们将介绍在获得 Additive Build 扩展后可用于 MPBF 打印机的一些独特的 Fusion
  360 功能。


  图 12.12 显示了在配备 MPBF 打印机的增材设置中可以为零件添加的支撑结构列表。您可能会注意到，该列表比第 10 章中介绍的可以添加到 FFF 或 SLA/DLP
  打印机的支撑结构更长。


  获得 Additive Build 扩展后，您可以将 Fusion 360 能够生成的全部支撑结构添加到任何相关的增材设置中。在第 10 章中，我们主要介绍了杆状和底板支撑。本节将重点介绍折线和体积支撑。在下一节中，我们将介绍定位支撑。


  我们将使用折线支撑开始演示特定于 MPBF 的支撑。图 12.12 显示了如何将折线支撑应用于我们选择的两个面。折线支撑对话框由五个标签页组成。在几何标签页中，我们可以选择希望支撑的面，并指定低于该角度时
  Fusion 360 应创建支撑结构的悬垂角度：


  ![](img/baa027bed101c08b496f1f420cee8a5b_361_0.png)


  Figure 12.12 – 向所选面添加折线支撑


  **几何** 标签页还具有关于如何选择表面以避免生成支撑以及各支撑之间应留多少间隙的额外功能。


  如果您选择支撑整个实体或组件，通过选中 *图 12.13* 所示的 **避免** 复选框，您可以选择一个或多个面以避免为其创建支撑结构。如果激活 **高级区域过滤**
  复选框，Fusion 360 会提供有关在所选模型/面内哪个区域创建支撑结构的额外选项。如果激活 **与其他支撑的距离** 复选框，您可以指定多个支撑结构之间的间隙以避免它们重叠：


  ![](img/baa027bed101c08b496f1f420cee8a5b_362_0.png)


  Figure 12.13 – 几何标签页中支撑生成的先进选项


  **折线支撑** 对话框中的 **常规** 标签页允许您通过下拉列表控制折线类型，如 *图 12.14* 所示。您可以选择三种折线类型。默认选择为 **带孔图案的结构**，如标注
  1 所示。对于此折线类型，您可以使用其指定的标签页控制 **折线属性** 和 **连接**，如 *图 12.14* 左上角所示。如果将折线类型设置为 **表面**，如同一图中标注
  2 所示，**折线属性** 标签页和 **连接** 标签页将消失。将折线类型设置为 **实体** 时也同样如此，如标注 3 所示。


  **常规** 标签页还允许您在编辑 **锚点距离** 和 **填充距离** 输入时修改各零件连接点之间的距离。您还可以控制折线支撑的定向以及这些支撑是否应延伸到零件边缘。默认情况下，所有折线支撑都与
  Y 轴对齐。如果在 **绕 Z 旋转** 字段中输入 45 度，您的折线支撑将在 XY 平面上呈对角线排列：


  ![](img/baa027bed101c08b496f1f420cee8a5b_363_0.png)


  Figure 12.14 – 折线支撑的常规标签页


  如果您使用 **带孔图案的结构** 折线类型生成支撑，还可以使用 **折线支撑** 对话框中的第三个标签页编辑折线属性，如 *图 12.15* 所示。此标签页允许您控制孔图案，包括其密度和厚度。您还可以添加
  **鳍状结构**，以便与成型平台有更好的连接。默认情况下，Fusion 360 为每个折线支撑创建单个填充。这意味着它们的厚度由增材设置打印设置中设定的激光熔池直径控制。然而，您可以通过选中复选框启用
  **加厚结构** 并为折线支撑指定特定厚度，使其更坚固。您可以控制与平台的连接厚度、与零件的连接厚度以及主晶格结构的厚度：


  ![](img/baa027bed101c08b496f1f420cee8a5b_364_0.png)


  Figure 12.15 – 折线支撑的折线属性标签页


  在 **折线支撑** 对话框中，如果导航到 *图 12.16* 所示的 **光栅和轮廓** 标签页，您可以控制片段大小和间隙。默认情况下，**片段大小** 和
  **片段间隙** 输入均设置为 **小**。如果将这些字段的输入更改为 **自定义**，您可以控制 **片段轮廓长度** 以及 **片段轮廓间隙**，如 *图
  12.16* 所示。**片段轮廓长度** 控制给定片段的大小。在本例中，每个片段设置为 3 mm，这意味着每个折线段长 3 mm。**片段轮廓间隙** 设置为
  0.25 mm，这意味着每个折线支撑段之间会有 0.25 mm 的距离：


  ![](img/baa027bed101c08b496f1f420cee8a5b_365_0.png)


  Figure 12.16 – 修改折线支撑的片段大小和间隙


  POLYLINE SUPPORT 对话框的最后一个标签页控制零件和成型平台的折线支撑连接属性。有两个段用于控制零件连接。顶部零件连接控制折线支撑与模型下表面区域的接触方式，而底部零件连接控制折线支撑与给定零件上表面的接触方式。平台连接控制折线支撑如何连接到成型平台。您还可以打开平台上的三角形鳍选项，以创建额外的法兰将折线连接到成型平台以获得更强的附着力。


  有四个选项可控制给定零件连接的形状。默认连接形状为断裂点。图 12.17 显示了每种形状的结果。最左边的屏幕截图显示了断裂点选项的形状结果。中间的屏幕截图显示了偏移断裂点选项，右侧的屏幕截图显示了条带形状：



  ![](img/baa027bed101c08b496f1f420cee8a5b_366_0.png)


  Figure 12.17 – 使用多段线支撑时顶部部件支撑连接的三种形状结果


  本节我们将重点介绍的下一个支撑类型是 **体积** 支撑。您可以通过在 **ADDITIVE** 选项卡的 **SUPPORTS** 面板中选择其对应选项来访问
  **VOLUME SUPPORT** 对话框。体积支撑与多段线支撑非常相似。主要区别在于体积支撑会创建多条多段线以形成更强的支撑结构。*图 12.18* 显示了选择单个面并创建体积支撑的结果。同一张图左侧显示了之前创建的多段线支撑，右侧显示了新创建的体积支撑。正如您所见，我们可以使用
  **Volume Properties** 选项卡将 **Hole Pattern** 设置为 **Oval** 来创建结构。我们还可以控制 **Fragment
  Size** 和 **Fragment Gap**，以便获得具有轮廓的大块支撑，以及 0.25 mm 的光栅间隙，以复制我们之前生成的多段线支撑的形状和尺寸：


  ![](img/baa027bed101c08b496f1f420cee8a5b_367_0.png)


  Figure 12.18 – 为 MPBF 增材制造设置创建体积支撑


  默认情况下，Fusion 360 中的所有支撑结构都会将选定的下表面连接到成型平台或部件的上表面区域。图 12.19 显示了更新后的设置，其中我们在之前的步骤中创建的
  Polyline Support1 和 Volume Support1 已被抑制。在该图中，我们可以看到选择多个表面并使用默认设置生成新的 Volume 支撑的结果。这里可以看到，左侧的支撑一直延伸到成型平台，但右侧的支撑则在同一部件的上表面处停止。这种支撑几何形状是理想的，如果我们希望最大限度地减少使用支撑结构制造部件所需的时间和材料。但我们也必须考虑在后处理阶段需要付出的额外努力。具体来说，任何接触到给定部件上表面的支撑结构都需要被移除，并且任何瑕疵都需要被铣削掉。在这种情况下，我们可能希望避免创建接触部件上表面的支撑结构：


  ![](img/baa027bed101c08b496f1f420cee8a5b_368_0.png)


  Figure 12.19 – 在所选表面上使用默认设置生成体积支撑


  一种生成不接触部件组件上表面的支撑的方法是生成角度体积支撑。**Angled Volume Support** 是体积支撑对话框中的最后一个选项卡。在此选项卡中，我们可以激活
  **Angled Support** 并指定我们的体积支撑将被分为两个区段的枢轴点。如图 12.20 所示，通过操作画布上的夹具，我们可以控制体积支撑中的断点，以便生成的支撑结构远离下表面倾斜：


  ![](img/baa027bed101c08b496f1f420cee8a5b_368_1.png)


  Figure 12.20 – 操作角度体积支撑的枢轴点


  默认情况下，角度体积支撑枢轴点允许我们控制支撑结构远离垂直轴枢转的位置。如图 12.21 所示，支撑结构的下半部分是垂直的，并指向成型平台。同一支撑结构的顶部部分是倾斜的，并指向所选的下表面：


  ![](img/baa027bed101c08b496f1f420cee8a5b_369_0.png)


  Figure 12.21 – 角度体积支撑


  这种结果避免了创建接触部件上表面的支撑。如果您在对话框的 Angled Volume Support 选项卡中选择 Tilt below angle 复选框，您还可以控制支撑的下半部分。如前所述，支撑的下半部分默认是垂直的。但是，您也可以通过激活
  Tilt below angle 复选框来控制其矢量。


  如 图 12.12 所示，MPBF 增材制造设置有多种多段线和体积支撑选项。所有这些选项都是多段线和体积支撑的变体，可以应用于我们模型的各个方面，例如小面积表面的边缘和中线。您还可以应用次级多段线支撑来环绕现有的体积支撑。各种用于控制这些支撑结构的选项可在各自的对话框中找到。


  一旦我们对模型的定向、定位和支撑感到满意，我们就可以生成增材工具路径并对其进行模拟，就像我们在前几章中对 FFF 设置和 SLA/DLP 设置所做的那样。图 12.22
  显示了您可以通过在 ADDITIVE 选项卡的 ACTIONS 面板中选择适当命令来模拟增材工具路径的方式。MPBF 设置的 SIMULATE ADDITIVE
  TOOLPATH 对话框与 FFF 和 SLA/DLP 设置相同。我们可以使用 Show Machine 复选框来显示或隐藏机器平台。我们可以使用 Incremental
  Move 复选框按一层一层或预设增量显示层结果：


  ![](img/baa027bed101c08b496f1f420cee8a5b_370_0.png)


  Figure 12.22 – 模拟 MPBF 增材制造设置的增材工具路径


  请记住，如果您在 **Simulate Additive Toolpath** 对话框中选择了 **Show all layers** 选项，MPBF 工具路径的计算/重新计算时间会更长，因为
  MPBF 打印机具有更小的层高。


  如果您只想快速查看增材工具路径的动画，您可能希望选择生成并显示每第 2 层、第 5 层、第 10 层或第 100 层。图 12.22 中显示的增材工具路径模拟是在抑制了多段线支撑以及之前用于演示支撑概念的两个体积支撑之后生成的。**Volume
  Support3** 已使用默认设置添加到整个组件，以支撑整个主体。


  一旦我们完成模型的定向、添加支撑结构和模拟工具路径，我们就可以创建必要的机器构建文件以开始 3D 打印作业。本节开始时，我们为通用 MPBF 打印机创建了机器构建文件，如图
  12.7 所示。在图 12.23 中，我们可以看到使用相同的 **Create Machine Build File** 命令将导致一个具有机器特定导出选项的类似对话框。在此设置中，我们使用了
  **One Click Metal** 打印机。因此，导出程序下拉菜单中只包含相关的文件格式，即 **OneClickMetal exporter**（.gcode）：


  ![](img/baa027bed101c08b496f1f420cee8a5b_371_0.png)


  Figure 12.23 – 从增材制造设置导出必要的机器构建文件


  Fusion 360 可以为其机器库中九个机器供应商中的八个创建机器构建文件。正如我们刚刚演示的那样，您可以为 OCM 机器创建特定的 gcode 文件。您还可以生成以下内容：


  - ILT 文件 (*.ilt)，Aconity 打印机需要

  - LMI Exporter 文件 (*.gcode)，Kurtz Ersa Alpha 140 打印机需要

  - Additive Industries Exporter 文件 (*.zip)，Additive Industries MetalFAB1 打印机需要

  - MTT 文件 (*.mtt)，所有 Renishaw 打印机需要

  - SLM 文件 (*.slm)，所有 SLM 打印机需要

  - DMG Mori Lasertec 文件 (*.zip)，所有 DMG Mori 打印机需要

  - Xact Metal Exporter 文件 (*.cli 或 *.sli)，根据型号不同，Xact Metal 打印机需要


  如果您使用 Fusion 360 与您的 EOS 金属 3D 打印机一起使用，您需要拥有机器制造商提供的名为 EOSPrint 的软件许可证才能将作业提交到您的打印机。Fusion
  360 可用于使用您的 EOS 金属打印机创建增材设置。您可以从 Fusion 的打印设置库中选择打印设置，该库与 EOS 提供的所有打印设置一致。您也可以在
  Fusion 中添加支撑结构并切片模型。但是，要创建特定于您的 EOS 硬件的增材工具路径，您需要拥有 EOSPrint 的许可证。


  如果您已在计算机上安装并许可了 Fusion 360 和 EOSPrint 软件，您可以生成增材工具路径，甚至可以查询增材设置的预计构建时间。您可以连接到特定的打印机并直接将打印作业提交到打印机本身。要激活此功能，您还需要下载并安装
  EOSPRINT for Autodesk Fusion 360。您可以在 Autodesk App Store 上找到此应用，网址为 https://apps.autodesk.com/FUSION/en/Detail/Index?id=8154614516617688086。


  在本节中，我们重点介绍了如何生成定向研究并为使用 MPBF 打印机进行成功的金属增材打印选择部件位置和方向。我们还介绍了如何为这种增材制造技术创建支撑结构。


  在下一节中，我们将讨论如何创建 setter 支撑，这些支撑在打印金属粘结剂喷射技术部件后在烧结过程中使用。


  ## Setter supports for a successful sintering process


  MPBF 是使用增材制造创建金属部件的最常用技术之一。然而，最近有多个机器供应商进入金属粘结剂喷射领域。Desktop Metal 多年来一直是该领域的领导者。HP
  也最近通过发布名为 Metal Jet S100 的新打印机进入了金属粘结剂喷射领域。Markforged 是一家以能够使用连续纤维增强方法打印 3D 打印机的公司，也开始提供其
  Digital Metal PX 100 系列打印机以服务于金属粘结剂喷射领域。除了这些知名品牌外，还有一些新进入者，例如 Sintertek 的 Sinterjet
  M60。


  随着制造商开始在其工作流程中采用金属粘结剂喷射技术，我们需要重点介绍如何使用 Fusion 360 创建增材设置并为这些打印机准备打印。大多数情况下，为粘结剂喷射技术创建增材设置与为
  SLS 打印机创建的增材设置没有什么不同。粘结剂喷射打印机增材设置的最重要方面是定向和排列我们部件在构建体积内的位置。使用 HP Metal Jet S100
  打印机的四个组件的此类设置如图 12.24 所示。


  一些 3D 打印机（例如 Digital Metal PX100）要求我们在切片前将所有模型放大。其他打印机（例如 HP Metal Jet S100）可以在打印机板上自动处理部件的缩放。





  无论我们为增材设置使用哪种金属粘结剂喷射打印机，您可能会注意到，粘结剂喷射设置的可用支撑类型列表仅限于底板支撑和定位支撑。这是因为粘结剂喷射技术在打印阶段不需要支撑结构。然而，一旦打印完成，我们就剩下处于生坯状态的零件。用粘结剂喷射打印机打印的零件需要后处理，并且需要烧结以蒸发将金属零件粘合在一起的强力粘结剂。此过程还会完全压实金属零件以去除孔隙：


  ![](img/baa027bed101c08b496f1f420cee8a5b_373_0.png)


  图 12.24 – 为金属粘结剂喷射打印机的增材设置创建定位支撑


  打印零件并将其从松散粉末中取出后，我们需要将其放入烧结炉中。刚在打印机中完成固化的零件称为生坯零件。在此状态下，它们很脆弱，需要用一种材料将其固定住，该材料既能托住零件，又能在烧结过程中与零件一起收缩。


  使用位于 ADDITIVE 选项卡的 SUPPORTS 面板中的 Setter Support 命令，我们可以选择给定组件来生成支撑结构，该支撑结构主要在烧结过程中使用。


  图 12.25 显示了 **SETTER SUPPORT** 对话框的 **General** 选项卡。在此选项卡中，我们可以控制各种选项来创建定位支撑，以在烧结过程中保护我们的零件。**Gap**
  输入控制零件与定位支撑之间的距离。**Z Overlap** 下拉菜单默认设置为 **Remove**，这允许零件在 Z 方向上抬起，而不会有任何支撑结构阻挡运动。**Bounding
  Shape** 默认是零件的 **Silhouette** 组件，根据其阴影生成形状。**Fill Inner Contour** 选项默认设置为 **Yes**，即使零件的孔与
  Z 轴对齐，也会创建支撑结构。**Outer Offset (XY Plane)** 输入允许我们控制零件周边定位支撑的厚度。**Maximum Height**
  输入允许我们控制定位支撑相对于成型平台的高度。**Taper Angle** 输入控制定位支撑周边壁相对于垂直轴的角度。


  当我们在粘结剂喷射机内为零件选择方向和位置时，重要的是将零件放置在 Z 轴上方一定距离，以便我们生成的定位支撑可以沿其底表面以及侧表面托住零件。


  图 12.25 显示了我们的增材设置的特写视图，其中隐藏了 **Component 1:2**、**Component 1:4** 和 **Component
  1:5**，仅显示 **Component 1:1**。为了改善可视化效果，我们还在该图中隐藏了机器成型平台：


  ![](img/baa027bed101c08b496f1f420cee8a5b_374_0.png)


  图 12.25 – 为组件生成定位支撑


  使用定位支撑的另一个选项是将边界形状从零件的轮廓修改为矩形物体。如图 12.26 所示，我们可以将 Bounding Shape 设置为 Rectangle，并将图案类型从
  Solid 图案更改为 Rectangular、Hexagonal、Circular 或 Column 图案。图 12.26 显示了六边形图案的结果。如果我们选择除实心以外的图案，还可以通过调整其单元尺寸和壁厚来控制图案尺寸：


  ![](img/baa027bed101c08b496f1f420cee8a5b_375_0.png)


  图 12.26 – 具有矩形边界形状和六边形填充图案的定位支撑


  一旦我们对支撑感到满意，就需要将支撑结构与零件分离，因为我们可能不想就地 3D 打印它们。请记住，我们在打印过程中不需要支撑结构。我们只会在烧结阶段使用它。因此，我们不需要将零件和支撑结构一起打印。我们可以通过使用位于
  ADDITIVE 选项卡的 ACTIONS 面板中的 3MF Scene Export 功能将增材设置导出为 3MF 文件来实现，如图 12.27 所示。当我们使用此命令时，我们将能够修改
  3D SCENE EXPORT 对话框中的选项并选择 Include the support structures 复选框：


  ![](img/baa027bed101c08b496f1f420cee8a5b_376_0.png)


  图 12.27 – 创建 3MF 文件并包含支撑结构


  一旦 3MF 文件已保存在我们的硬盘上，我们就可以通过选择 + 图标来创建新的 Fusion 文档，如图 12.28 中标注 1 所示。在 DESIGN 工作区的
  MESH 选项卡中，我们可以使用 Insert Mesh 功能，如标注 2 所示，将刚刚创建的 3MF 文件插入到活动设计文档中。Fusion 将导入每个组件作为具有唯一名称的网格体。我们可以简单地隐藏网格体
  3、4 和 5 的可视化，如标注 3 所示。这样，我们就可以专注于我们为其创建定位支撑的组件的支撑结构和网格体：


  ![](img/baa027bed101c08b496f1f420cee8a5b_377_0.png)


  图 12.28 – 将 3MF 文件插入 Fusion 文档以可视化定位支撑结果


  使用位于 Modify 选项卡中的 Move 命令，您可以选择 Meshbody2 并将其移动到 Z 轴。图 12.28 显示了此移动操作的结果，如时间线中标注
  4 所突出显示。如您所见，我们的支架组件 neatly 适配在定位支撑内，并且可以在没有阻挡的情况下从 Z 轴移除。如果我们将此零件和定位支撑一起放入烧结炉中，粘结剂将从零件和支撑中蒸发，并且这些零件会均匀地一起收缩。定位支撑将在此烧结过程中支撑组件，使其在烧结阶段不会下垂或永久变形。


  ## Summary


  在本章中，我们了解了有关金属增材制造的所有知识。我们首先介绍了您可用于创建金属零件的所有增材制造技术。我们演示了如何使用 UltiMaker 和 Raise3D
  的熔融长丝制造打印机以及 BASF 等公司的金属长丝来 3D 打印需要脱脂和烧结的金属零件。我们还展示了如何使用任何配备定制挤出机的 FFF 3D 打印机以及
  The Virtual Foundry 等公司的专用金属长丝来打印金属长丝。每个解决方案都需要对 3D 打印零件进行进一步的脱脂和烧结处理。然后我们介绍了如何使用定向能量沉积技术创建金属零件，使用
  Fusion 360 机器库中提供的 Meltio M450 等打印机。


  在下一节中，我们演示了如何使用 MPBF 打印机创建增材设置。我们展示了 MPBF 打印机的增材设置与我们为 FFF 和 SLA/DLP 3D 打印机创建的设置非常相似，主要区别在于零件定位和支撑结构生成。我们强调了如何错开零件位置，以便不对硬刮刀产生高阻力区域。我们还强调了如何创建各种折线和体积支撑以在打印过程中支撑零件。我们展示了如何通过使用倾斜体积支撑来最大限度地减少创建这些支撑结构所需的材料使用量并避免在上表面创建支撑。在第二部分的末尾，我们还介绍了如何在切片和模拟增材刀具路径后生成启动打印作业所需的特定于机器的文件格式。


  在最后一节中，我们将重点放在金属粘结剂喷射工艺上。我们讨论了如何为该工艺创建增材设置。我们强调了粘结剂喷射技术中的松散粉末能够在固化阶段支撑正在打印的零件。我们还讨论了使用该技术制造的零件需要烧结工艺来蒸发粘合剂并得到完全致密的零件。在本章的最后一节中，我们介绍了如何创建定位支撑，这些支撑可以托住我们的零件并在烧结过程中防止其下垂，同时与零件均匀收缩，因为它们是用相同的工艺和材料制成的。


  使用其中任何一种技术，您可以更有信心地为可用的 3D 打印技术创建增材设置以生成金属组件。在下一章中，我们将重点介绍如何模拟 MPBF 工艺，以识别和修复由于该工艺中常见的热应力高和变形而导致的潜在打印失败。



  '
- '## 模拟 MPBF 工艺


  欢迎阅读 *第 13 章*。 在本章中，我们将探讨如何在 **金属粉末床熔融 (MPBF)** 3D 打印机内模拟打印过程。 MPBF 机器是价格最昂贵的 3D
  打印机之一。 金属粉末是一种昂贵的 3D 打印材料。 因此，在金属 3D 打印中，任何错误或打印失败都是代价高昂的。 拥有 Additive Build 扩展访问权限的
  Fusion 360 用户可以模拟其 MPBF 打印过程，以检测和纠正常见的打印失败模式，例如零件变形和匀粉刀干涉。 在本章中，我们将重点介绍如何执行此类分析并做出必要的更改以避免常见的打印失败模式。


  本章将涵盖以下主题：


  - 设置工艺仿真

  - 解释结果

  - 补偿变形并更新设置


  到本章结束时，您将学会如何在带有 MPBF 打印机的增材制造设置中选择一个组件作为工艺仿真的目标。 您将了解各种打印设置以及它们如何影响工艺仿真输入。 您将学习如何修改工艺输入，例如打印床加热，以及有限元分析输入，例如网格设置，以进行工艺仿真，同时在速度与精度之间做出权衡。
  您还将学习如何检查工艺仿真的结果并识别模型中的大变形区域，判断零件是否会发生匀粉刀碰撞。 到本章结束时，您将能够导出补偿形状以抵消零件在打印过程中可能发生的变形，使零件以最小的变形进行打印。


  ### 技术要求


  本章将继续介绍金属增材制造。 我们将使用 MPBF 3D 打印机及其相应的打印设置创建增材制造设置。 我们将为 MPBF 机器生成特定的支撑结构。 我们还将对零件和支撑进行工艺仿真。
  在获得 Additive Build 扩展访问权限之前，Fusion 360 不提供 MPBF 机器、MPBF 特定支撑结构以及进行工艺仿真的能力。


  与所有其他 Fusion 360 扩展一样，Additive Build 扩展不适用于个人使用。


  如果您拥有 Fusion 360 的商业许可证，要使用 MPBF 机器创建增材制造设置，您还需要访问 Additive Build 扩展 (https://www.autodesk.com/products/Fusion-360/additive-build-extension)。


  Autodesk 为所有 Fusion 360 商业用户提供 Additive Build 扩展的 14 天试用。 您可以在 Fusion 360 的扩展对话框中激活试用。


  Additive Build 扩展也可免费提供给初创企业和教育许可证用户。


  本章的课程文件可在以下位置找到： https://github.com/PacktPublishing/3D-Printing-with-Fusion-360


  ## 设置工艺仿真


  在本节中，我们将演示如何使用粉末床熔融打印机创建金属增材制造设置并启动工艺仿真，以便分析零件在 3D 打印过程中将经历的变形。


  为了演示此功能，我们将使用名为 L Brackets 的 Fusion 文档，如图 13.1 所示。 该模型由三个具有不同悬垂角度的组件组成。 Component1
  的悬垂角度为 0 度，Component2 的悬垂角度为 15 度，Component3 的悬垂角度为 30 度。


  ![](img/baa027bed101c08b496f1f420cee8a5b_381_0.png)


  图 13.1 – 具有各种悬垂角度的三个组件


  在将 Fusion 工作区从 DESIGN 更改为 MANUFACTURE 后，我们可以使用 Fusion 的机器库中的 Renishaw AM 250 机器创建增材制造设置。
  在此设置中，我们将选择如图 13.2 所示的 RenAM250 Titanium Ti6Al4V-1123-Q 60 micron 打印设置。 我们还将手动排列全部三个组件，使其在
  X 和 Y 方向上交错，确保它们不会与构建板上指示的匀粉刀方向发生干涉。 正如您可能还记得，在第 12 章中，我们讨论了为什么在为 MPBF 机器准备构建时采用这种布置是有益的。


  ![](img/baa027bed101c08b496f1f420cee8a5b_381_1.png)


  图 13.2 – 在增材制造设置中排列三个组件


  一旦零件放置在构建体积内，我们就可以添加必要的支撑结构，以便使用此打印机制造零件。 如图 13.3 所示，我们为每个组件添加了体积支撑。 在创建支撑期间，我们使用了体积支撑的默认设置。


  作为提醒，默认体积支撑使用菱形孔图案生成，使用稀疏密度输入。 **Thickening up Structures** 和 **Fin Structures**
  已启用，这会创建尽可能薄的支撑几何形状，节省材料和打印时间。 然而，我们不知道我们生成的支撑结构是否足够坚固以在打印过程中支撑零件。 这是我们需要进行工艺仿真的另一个原因——看看是否需要使支撑更强以避免潜在的打印失败。


  ![](img/baa027bed101c08b496f1f420cee8a5b_382_0.png)


  图 13.3 – 为每个组件添加了体积支撑


  在启动工艺仿真之前，最好仔细查看我们的打印设置。 如果我们选择与此设置关联的打印设置，右键单击并编辑它，我们将看到 **Print Setting Editor**
  对话框并可以检查此打印设置中包含的构建参数。 如图 13.4 中黄色突出显示的那样，此打印设置使用 60 微米的层厚，材料设置为钛。 这两个输入都可以在打印设置的
  **General** 部分中找到。


  ![](img/baa027bed101c08b496f1f420cee8a5b_383_0.png)


  图 13.4 – 编辑打印设置以可视化构建参数


  如果我们在 **Normal** 体预设内选择 **Hatching** 子标题，我们还将能够可视化 Fusion 360 将用于为本次打印创建填充的填充图案的填充距离和旋转增量角度。
  如图 13.5 左侧所示，填充的当前策略是 **Stripe** 方法。 此图案的每个激光填充线将相距 0.095 毫米，并且填充图案将在每层围绕 Z 轴交替
  67 度。


  如果我们在 **Normal** 预设的 **Body Presets** 部分内选择 **Scanning** 子标题，我们还将能够可视化与此打印设置关联的激光功率。
  图 13.5 右侧的图像显示，在打印填充线时激光将设置为 200 瓦。


  ![](img/baa027bed101c08b496f1f420cee8a5b_384_0.png)


  图 13.5 – 钛的填充和扫描打印设置


  我们在图 13.3 和图 13.4 中突出显示的信息是机器制造商推荐的参数，以便在此特定打印机上使用钛打印。 如您可能已经注意到的，有许多参数可以编辑以微调 MPBF
  打印机的打印设置。 每个参数都会影响打印结果。


  然而，只有这些参数的子集在进行工艺仿真时会被考虑，因为它们已被确定为对打印过程中热诱导应力影响最大。 我们在前几幅图中突出显示的参数直接输入到在 Fusion
  360 中进行工艺仿真所需的输入中。


  如图 13.6 所示，如果我们为此打印设置在 Print Settings Editor 中选择 Process Simulation 子标题，我们可以看到 Fusion
  360 已关联一个参数集用于仿真。 工艺仿真参数集保存为 *.PRM 文件。


  > **重要说明**

  > “**处理参数 (PRM)** 文件记录机器工艺参数和材料属性。 在小规模分析中，将移动热源施加到材料上。 PRM 文件存储材料对机器参数设置的机械响应。
  这可以外推到完整零件 … PRM 文件可在使用相同材料和工艺参数组合的任何未来仿真中重复使用” (https://help.autodesk.com/view/NETF/2024/ENU/?guid=GUID-7A9E551D-36B2-4922-8A38-0072EEDB5A23)。




  ![](img/baa027bed101c08b496f1f420cee8a5b_385_0.png)


  Figure 13.6 – 选择与打印设置关联的工艺仿真参数集


  如果你想使用不同的 PRM 文件进行工艺仿真，可以从名为 Parameter Set 的下拉菜单中选择它。该下拉菜单会自动在其库中筛选仿真参数，仅显示与打印设置中选择的相同材料关联的
  PRM 文件。如图 13.7 所示，将参数集从默认的 PRM Renishaw_AM250_Ti6Al4V_60um 改为 Renishaw_AM250_Ti6Al4V_30um_1500mm/s-1
  后，Print Setting Editor 指示增材工具路径将使用原始打印设置创建，但工艺仿真将基于新选择的参数集。在同一张图中，你可以看到高亮的值，它们显示了
  Renishaw_AM250_Ti6Al4V_60um 打印设置与 Renishaw_AM250_Ti6Al4V_30um_1500mm/s-1 参数集输入之间的差异，包括层厚（60.000
  微米 versus 30.000 微米）、激光速度（857.000 mm/s versus 1500 mm/s）和 Hatch Distance（0.095 mm
  versus 0.065 mm）。


  ![](img/baa027bed101c08b496f1f420cee8a5b_386_0.png)


  Figure 13.7 – 打印设置与非默认 PRM 之间工艺参数的差异


  现在我们已经说明了 Fusion 360 如何利用打印设置中的输入来进行工艺仿真，我们可以关闭 Print Setting Editor 对话框并继续使用默认打印设置。为了开始设置仿真，我们需要访问
  ADDITIVE 选项卡中 PROCESS SIMULATION 面板内的 Study 命令。如图 13.8 所示，这将打开 STUDY 对话框，在其中我们可以选择要进行工艺仿真的目标体。此对话框中的高级设置部分允许我们控制
  Fusion 360 为进行此有限元分析而创建的网格单元大小。Layers per element 字段根据打印设置中设置的层厚来控制给定单元的大小。默认情况下，Fusion
  360 使用自适应网格，其中正在打印的层的单元较小，而活动层以下的单元则变大。自适应网格可在牺牲精度的情况下实现快速分析。Coarsening Generations
  和 Max Adaptivity Level 输入控制正在打印的层以下单元大小的变化。对这两个字段使用较小的输入值会提高结果的准确性，但会增加求解时间。你也可以在此对话框中控制
  Platform Thickness 和 Platform Heating 输入。


  ![](img/baa027bed101c08b496f1f420cee8a5b_387_0.png)


  Figure 13.8 – 使用 STUDY 对话框设置工艺仿真


  为了简化网格划分过程和求解时间，Fusion 360 会对支撑结构几何形状进行均质化，并使用修改后的物理属性进行仿真。当 **自动计算支撑体积分数** 复选框处于活动状态时，此均质化会自动执行。


  ![](img/baa027bed101c08b496f1f420cee8a5b_387_0.png)


  Figure 13.8 – 使用 STUDY 对话框设置工艺仿真


  在选择目标体并在 **STUDY** 对话框的高级设置中完成所有必要的自定义后，我们可以单击 **OK** 继续。此时，Fusion 360 会进行预检查并显示
  **SOLVE** 对话框。


  在图 13.9 中，我们可以看到打印设置与 PRM 文件匹配，这意味着我们可以使用默认参数集求解此仿真，无需选择不同的参数集即可继续。


  由于我们在 **STUDY** 对话框中选择了 **Layers per element**（20）、**Coarsening Generations**（2）和
  **Max Adaptivity Level**（5）的默认输入值，求解精度会较低，但我们会快速计算出结果。


  我们的模型与平台有适当的接触，不需要额外的支撑结构。


  我们此时尚未生成网格；因此，在 *FEA mesh* 部分旁边会看到一个警告标志。我们可以单击 **Check mesh** 图标，也可以直接单击 **Solve**
  按钮开始仿真。


  ![](img/baa027bed101c08b496f1f420cee8a5b_388_0.png)


  Figure 13.9 – 开始工艺仿真前的预检查


  一旦开始求解，Fusion 360 会显示 CAM Task Manager 对话框，如图 13.10 所示。在此对话框中，我们可以看到 Fusion 执行热机械仿真，以计算零件在
  3D 打印过程中将承受的变形和应力。如果我们选择活动研究的条目，可以右键单击并禁用 Auto Remove 选项，从而在求解期间监控进度，并在完成后查询总求解时长。


  ![](img/baa027bed101c08b496f1f420cee8a5b_388_1.png)


  Figure 13.10 – CAM 任务管理器报告工艺仿真的进度


  热机械仿真完成后，Fusion 360 将在名为 RESULTS 的新选项卡中显示仿真结果，如图 13.11 所示。我们将看到构建平台和正在 3D 打印的零件的前几层的彩色表示。由于这是一个瞬态分析，我们可以切换时间步长，以可视化零件逐层组打印的过程。


  ![](img/baa027bed101c08b496f1f420cee8a5b_389_0.png)


  Figure 13.11 – 可视化工艺仿真结果


  我们看到的默认颜色代表零件在打印过程中将经历的位移大小，并与画布右侧图例中显示的值相对应。


  在本节中，我们说明了如何使用 MPBF 打印机创建增材制造设置。在定向并支撑组件后，我们启动了工艺仿真。我们介绍了如何查询打印设置以及它们如何与工艺仿真参数关联。我们选择了一个组件并使用它进行了工艺仿真。


  在下一节中，我们将学习如何查看工艺仿真结果，并将仿真组件的变形和补偿版本导出为 STL 或 3MF 文件。


  ## 结果解读


  我们通过完成第一次工艺仿真结束了上一节。在本节中，我们将重点介绍 Fusion 360 在进行工艺仿真时计算的各种结果类型。


  如 *图 13.12* 所示，Fusion 为 MPBF 工艺仿真计算并显示六种结果类型。分析完成后，我们看到的默认结果类型是 **Displacement**。然而，我建议在生成网格或完成工艺仿真后查看
  **Structure Type** 结果。此结果类型根据每个单元代表支撑结构、零件还是构建平台对其进行着色。


  没有支撑结构的下表面区域以红色显示，表示欠约束区域。Fusion 还将不连续且 Z 轴存在非预期间隙的支撑结构着色为欠约束单元。在这种情况下，你可能需要返回工艺仿真设置并编辑网格设置，以便在对模型进行网格划分/求解之前正确地对支撑结构进行网格划分或生成额外的支撑结构。


  ![](img/baa027bed101c08b496f1f420cee8a5b_390_0.png)


  Figure 13.12 – 工艺仿真的结构类型结果


  在观察结构类型结果后，通过使用图例旁边的下拉菜单，你可以切回 **Displacement** 结果。**Displacement** 结果可以进一步筛选，以便你可以在
  **X**、**Y** 和 **Z** 轴上观察模型的变形。或者，你可以查看位移的大小。应用于单元的图例和颜色轮廓可以修改为设置为全局位移结果，或你正在观察的局部时间步长。在
  *图 13.13* 中，我们可以看到最终时间步长的 **Z** 方向位移。你可以使用仿真播放器切换控件切换时间步长，如 *图 13.12* 中所示。




  ![](img/baa027bed101c08b496f1f420cee8a5b_391_0.png)


  图 13.13 – 工艺仿真的位移结果类型


  另外，你可以使用屏幕底部的時間軸並拖動黑色垂直條左右移動以切換到不同的時間步。圖 13.14 顯示了本次仿真距離最後一個時間步兩步的 Z 位移結果，如標註 1
  所示。


  工藝仿真結果也可以通過一個因子進行縮放以誇大變形形狀，如標註 2 所示。在以下截圖中，縮放因子設置為 20，這會放大位移以顯示變形的方向。**結果**選項卡內的**編輯**面板讓我們可以切換單元邊線，從而在不顯示每個單元邊緣的黑色線條的情況下觀察結果。使用同一面板，你還可以選擇**切換最小/最大探針**，以便在每個時間步了解位移最大和最小的節點位置。你也可以使用**打開結果文件夾**命令來定位所有仿真輸入和輸出在計算機上的存儲位置。這也允許你在需要清理硬盤空間時刪除仿真結果文件，因為工藝仿真結果會占用大量硬盤空間。


  ![](img/baa027bed101c08b496f1f420cee8a5b_392_0.png)


  ## 图 13.14 – 切换时间步并修改缩放因子


  我們接下來要重點介紹的結果類型是刮刀間隙。在打印過程中，隨著激光在粉末上移動，金屬粉末會熔化然後固化。在此循環中金屬受熱冷卻時會產生熱誘導應力。在打印過程中，剛剛打印的層會在
  X、Y 和 Z 方向上發生變形。如果某一層在正 Z 軸方向上的變形量超過我們在打印設置中設定的層厚，我們的零件就會發生刮刀碰撞。Fusion 360 可以使用工藝仿真預測此類現象。刮刀間隙百分比結果類型允許我們在打印過程中可視化零件與刮刀葉片的接近程度。100%
  間隙意味著零件在某一點沒有 Z 方向變形。0% 間隙意味著零件在該點的 Z 變形量相當於層厚。Fusion 360 將所有層的該結果匯總顯示為一個名為**全局刮刀間隙**的結果類型，如圖
  13.15 所示。間隙值高於 100% 表示該點發生了負 Z 方向變形。


  ![](img/baa027bed101c08b496f1f420cee8a5b_393_0.png)


  圖 13.15 – 工艺仿真的全局刮刀間隙 % 結果


  如前所述，Fusion 會為每個時間步計算刮刀間隙百分比。你可以通過將結果類型切換為**局部刮刀風險**來在每個時間步可視化這些結果的簡化版本。該結果類型使用類似交通燈顏色等高線的圖例（紅、黃、綠）來呈現刮刀間隙百分比。任何刮刀間隙高於
  80% 的情況均表示刮刀碰撞的**低**風險。如果刮刀間隙低於 80% 但高於 40%，Fusion 會將這些單元高亮為刮刀碰撞的**中**風險。任何低於 40%
  的間隙將被高亮為刮刀碰撞的**高**風險並以紅色顯示。


  ![](img/baa027bed101c08b496f1f420cee8a5b_394_0.png)


  圖 13.16 – 工艺仿真的局部刮刀風險結果


  Fusion 360 還允許我們將工藝仿真結果導出為網格文件，如圖 13.17 所示。通過在**結果**選項卡的**操作**面板中選擇**導出彩色 3MF**命令，我們可以提取結果的彩色網格文件。創建仿真報告時可以使用
  3MF 文件，並使用 Microsoft Office 工具（如 Word 或 PowerPoint）。


  ![](img/baa027bed101c08b496f1f420cee8a5b_394_1.png)


  圖 13.17 – 將工藝仿真結果導出為帶顏色的 3MF 文件


  當我們完成對工藝仿真結果的分析後，只需從**結果**選項卡中選擇**完成結果**命令即可，這將關閉結果可視化並返回到**制造**工作區的**增材**選項卡。


  稍後，如果我們想分析某個研究的結果，可以在瀏覽器中選擇該研究，如圖 13.18 所示，並選擇**工藝仿真**選項卡中位於其中的**查看結果**命令，如標註 1
  所示。或者，我們也可以在瀏覽器中右鍵單擊所選研究並從菜單中選擇**查看結果**命令，如標註 2 所示。


  ![](img/baa027bed101c08b496f1f420cee8a5b_395_0.png)


  圖 13.18 – 訪問工藝仿真結果


  此操作將帶我們返回活動工藝仿真研究的結果可視化。使用**結果**選項卡，我們可以繼續探測結果或導出 3MF 文件以生成結果報告。


  在本節中，我們重點介紹了如何利用**結果**選項卡查詢工藝仿真的不同結果類型。在下一節中，我們將探討如何基於工藝仿真結果生成補償模型，以便以最小變形制造零件。


  ## 补偿变形并更新设置


  我們在上一節結束時導出了一個帶顏色的 3MF 文件，以便使用 Microsoft Word 或 PowerPoint 生成交互式報告。在本節中，我們將重點介紹如何從工藝仿真結果中導出翹曲和補償的
  STL 文件，以及如何使用補償形狀創建新的設置。


  開始時，讓我們使用上一節介紹的**查看結果**命令返回工藝仿真結果。一旦進入**結果**選項卡，我們可以在**操作**面板中選擇**導出補償 STL**和**導出翹曲
  STL**，如圖 13.19 所示。


  ![](img/baa027bed101c08b496f1f420cee8a5b_396_0.png)


  圖 13.19 – 將翹曲形狀導出為 STL 文件


  創建翹曲和補償的 STL 文件後，我們可以使用 Fusion 360 對它們進行比較。如圖 13.20 所示，我們可以創建一個新的 Fusion 設計文檔，這會帶我們返回到**設計**工作區。在此工作區中，我們可以進入**網格**選項卡並將這兩個
  STL 文件插入到同一文檔中。如圖 13.20 所示，這將在瀏覽器中留下兩個網格體，名稱分別為 L Bracket - Warped 和 L Bracket -
  Compensated。如果我們在視圖立方體的前視圖中放大左上角，可以看到翹曲形狀和補償形狀之間存在明顯差異。如果我們使用生成的支撐件按設計形狀打印零件，打印機的輸出結果將接近翹曲對象所代表的形狀，該形狀在下圖中由綠色陰影的網格體突出顯示。請注意，在我們組件的這個角落，翹曲網格體向正
  X 方向變形。Fusion 360 生成的補償形狀通過創建向負 X 方向傾斜的幾何體來抵消該變形。


  ![](img/baa027bed101c08b496f1f420cee8a5b_397_0.png)


  圖 13.20 – 翹曲模型和補償模型的疊加視圖


  我們也可以使用翹曲 STL 輸出來比較仿真結果與打印變形，如果我們要評估 Fusion 360 生成的仿真結果的準確性。在 3D 打印模型後，我們可以使用藍光掃描檢查變形，並將打印的變形形狀與
  Fusion 360 預測的翹曲輸出進行比較，檢查使用本研究打印設置中選擇的 PRM 文件獲得的結果的準確性。


  我在進行工藝仿真後推薦的工作流程是選擇位於**結果**選項卡的**編輯**面板中的**導出補償**命令，如圖 13.21 所示。


  ![](img/baa027bed101c08b496f1f420cee8a5b_397_1.png)


  圖 13.21 – 將補償形狀導出到制造模型





  使用此功能，您可以生成补偿模型的网格体，并将其直接包含在用于创建活动增材设置的制造模型中，如图 13.22 所示。同一张图以 50% 的不透明度显示组件 1、2
  和 3，以便我们能够在没有任何遮挡的情况下清晰地看到新的网格体。


  ![](img/baa027bed101c08b496f1f420cee8a5b_398_0.png)


  图 13.22 – 补偿形状包含在制造模型中


  此时，我们仍需对制造模型进行一些手动修改，以便使用补偿网格体创建设置。首先，我们将选择制造模型，右键单击并编辑它。接下来，我们必须通过右键单击它并选择“Create
  Components from Bodies”命令来从网格体创建新的组件，如图 13.23 所示。此操作将生成一个名为 Component 4 的新组件，其中包含补偿网格体。现在我们已完成对制造模型的修改，可以在功能区中选择
  FINISH EDIT 命令。


  ![](img/baa027bed101c08b496f1f420cee8a5b_399_0.png)


  图 13.23 – 从补偿形状的网格体创建新组件


  为了保留我们在 Setup1 中的工作，我们可能希望将其复制并创建 Setup1 (2)，如图 13.24 所示。这样，我们就能保留导致补偿形状的过程仿真输入和结果。在未来，如果我们想回顾结果或尝试进行不同的仿真，只需使用
  Setup1 即可，该设置不考虑新创建的 Component4。


  ![](img/baa027bed101c08b496f1f420cee8a5b_399_1.png)


  图 13.24 – 复制 Setup1 以创建 Setup2


  现在我们有了新的设置，需要编辑它并取消选择组件 1、2 和 3，以便选择 Component 4，如图 13.25 所示，以便对其进行定位和支撑。我们可以通过在浏览器中右键单击
  Setup1 (2) 并选择 Edit 来访问 SETUP 对话框，从而实现此操作。


  ![](img/baa027bed101c08b496f1f420cee8a5b_400_0.png)


  图 13.25 – 编辑 Setup1 (2) 以选择补偿组件


  现在我们已将 Component 4 选择为 Setup1 (2) 中唯一的组件，就需要按照本書中所学过的典型打印准备步骤进行操作。我们可以先使用 ADDITIVE
  选项卡的 POSITION 面板中的 Arrange 命令，将零件放置在打印机构建体积内。图 13.26 显示了如何安排 3 毫米的平台间隙，将零件放置在打印机构建区域内。


  ![](img/baa027bed101c08b496f1f420cee8a5b_401_0.png)


  图 13.26 – 在构建体积内排列补偿零件


  我们清单上的下一项是为此组件创建支撑结构。图 13.27 显示了我们如何通过在 ADDITIVE 选项卡的 SUPPORTS 面板中选择适当的支撑操作来为此组件添加体积支撑。由于我们在流程早期将
  Setup1 复制以创建 Setup1 (2)，因此 Setup1 中使用的所有体积支撑仍可在 Setup1 (2) 中使用。我们需要选择并删除它们或抑制它们，因为它们不会参与此设置。


  ![](img/baa027bed101c08b496f1f420cee8a5b_401_1.png)


  图 13.27 – 为补偿模型应用体积支撑


  一旦补偿模型定位并得到适当的支撑，我们就可以生成增材刀具路径并对其进行仿真，如图 13.28 所示。请记住，为了生成刀具路径，您必须从浏览器中选择 **Additive
  Toolpath** 行项目，并在 **ADDITIVE** 选项卡的 **ACTIONS** 面板中使用 **Generate** 命令。在逐层可视化增材刀具路径后，如果我们对结果满意，可以选择
  **Create Machine Build File**，如下图所示。


  ![](img/baa027bed101c08b496f1f420cee8a5b_402_0.png)


  图 13.28 – 仿真增材刀具路径并创建机器构建文件


  在此示例中，生成机器构建文件将使我们能够为 Renishaw 打印机创建必要的 MTTF 文件。由于该文件是使用补偿模型生成的，而补偿模型是在进行过程仿真后创建的，因此与按设计
  CAD 模型相比， resulting 3D 打印零件的变形将可以忽略不计。


  ## Summary


  ## 摘要


  在本章中，我们重点介绍了如何为 MPBF 3D 打印机创建设置以及如何使用有限元分析仿真该过程。MPBF 过程是 3D 打印技术中最昂贵的技术之一，无论是资本支出还是材料成本。过程仿真有助于我们确定增材设置是否会产生预期结果。如果我们能够在
  3D 打印之前检测并补救潜在的故障，例如涂覆器刀片碰撞或大变形，我们就可以在制造阶段节省大量时间和金钱。


  在本章的第一部分中，我们重点介绍了如何使用 MPBF 机器生成增材设置，并强调了控制过程仿真输入的打印设置中的各种参数。我们还展示了如何设置过程仿真研究。我们演示了如何定义过程条件，例如构建板加热，并修改有限元分析求解器的关键输入，例如网格设置。我们以进行第一次过程仿真研究结束该部分。


  然后，我们重点介绍了 Fusion 为 MPBF 过程仿真生成的结果类型。我们强调了如何在各种结果类型之间切换，例如结构类型、位移、涂覆器刀片间隙和涂覆器刀片风险。我们以将结果作为带有颜色数据的
  3MF 文件导出以用于创建报告结束该部分。


  在最后一部分中，我们重点介绍了如何从过程仿真结果中导出翘曲和补偿模型。我们展示了如何将翘曲和补偿模型重新导入 Fusion 以可视化它们之间的差异。我们以演示如何使用补偿模型创建新设置结束本章，以便
  3D 打印一个会变形为按设计模型的零件。


  使用您在本章中获得的实践知识，您可以更有信心地使用 Fusion 360 仿真金属增材制造设置，以便识别潜在的打印故障并补偿 MPBF 打印过程中固有的变形，从而实现成功的打印。


  在下一章中，我们将重点介绍如何使用预设、模板和脚本自动执行重复性任务，例如零件定向、构建体积内的零件排列和支撑结构生成。


  ## Automating Repetitive Tasks


  ## 自动化重复性任务


  欢迎来到第 14 章。在之前的章节中，我们演示了如何使用 Fusion 360 设计新模型以及从外部来源导入模型。我们还强调了如何生成设置以使用各种 3D 打印技术增材制造这些模型。现在我们对如何使用
  Fusion 360 有了良好的理解，并且在创建设置、排列零件以及为各种增材技术创建支撑结构方面积累了经验，让我们学习更多关于如何自动化和优化 Fusion 360
  的知识，以便不必为每个增材设置编辑每个输入对话框。


  在本章中，我们将重点介绍如何自动化 Fusion 的各个方面，以最大限度地减少我们与软件的交互，创建增材设置并生成刀具路径。我们将通过向您介绍 Autodesk
  App Store 来介绍 Fusion 生态系统中的现有自动化。然后，我们将重点介绍如何自定义 Fusion 的机器和打印设置库，以便创建可用于创建设置时使用的完全定义的机器。您将学习如何自定义各种操作的输入，例如自动定向研究、零件排列和支撑结构生成。我们还将演示如何将这些输入保存为用户默认值。然后，我们将创建并保存模板，这些模板将多个操作组合到单个文件中，可在后续增材设置中重复使用。我们将以重点介绍如何利用
  Fusion 的编程功能结束本章，通过创建 Python 脚本来自动化生成增材设置、定向零件、在构建板内排列它们以及仿真增材刀具路径的整个过程。


  在本章中，我们将涵盖以下主题：


  - Using apps from the Autodesk App Store

  - Customizing presets and using templates

  - Automating the additive workflows with scripting


  - 使用 Autodesk App Store 中的应用

  - 自定义预设并使用模板

  - 使用脚本自动化增材工作流程


  到第一个部分结束时，您将学会如何使用各种过滤器搜索 Fusion App Store，例如操作系统、应用类别和应用成本。您还将学习如何下载、安装和运行应用以执行某些自动化操作。在下一部分中，您还将很好地了解如何自定义
  Fusion 的机器库并创建自己的机器，其中包含



  关联打印设置和后处理文件。通过这种技术，您将能够更高效地创建未来的增材制造设置。在本节中，您还将学习如何将常用的输入保存为各种操作的默认值，例如零件方向、零件排列和支撑结构生成。您还将学习如何创建包含多个操作和自定义输入的模板，以及如何在后续的增材制造设置中重用这些模板。到本章结束时，您将知道如何创建和自定义第一个基于
  Python 的脚本，以自动化 FFF 机器的整个增材制造工作流程，无论是单个组件还是多个组件。


  ### 技术要求


  本章涵盖的所有主题都可供个人、试用版、商业版、初创版和教育版 Fusion 360 许可证类型使用。如果您打算使用 Python 编程语言创建或自定义脚本以自动化
  Fusion 360 中的增材制造设置，您还需要安装来自 Microsoft 的 Visual Studio Code 软件：https://code.visualstudio.com/。


