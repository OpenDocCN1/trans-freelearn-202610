    add them using the functionality available within the CREATE and MODIFY panels
    within the SOLID tab.


    In the next section, we will work with mesh files in a similar manner and edit
    them directly with Fusion 360 to prepare them for 3D printing.


    # Working with Mesh files natively in Fusion 360


    In the previous section, we talked about how to open CAD files and edit them for
