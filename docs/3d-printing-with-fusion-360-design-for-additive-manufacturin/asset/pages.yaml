- pgno: 347
  md: '# 12


    # 3D Printing with Metal Printers


    Welcome to Chapter 12, where we will learn all about metal additive manufacturing.
    Metal 3D printing has been increasing in popularity over the past several years
    as it offers a long list of benefits for numerous industries, such as aerospace,
    healthcare, and high-end consumer goods. Using metal 3D printing, you can create
    parts with complex internal structures and organic external faces, which are impossible
    to manufacture any other way. 3D printing with metal is also more cost-effective
    compared to other manufacturing methods for low quantities.


    Fusion 360, along with the Additive Build extension, can be utilized to create
    additive setups with 3D printers that are capable of manufacturing parts using
    metals. In this chapter, we will introduce the various ways you can use metal
    additive manufacturing within Fusion 360. We will go over how to utilize Fusion
    360 to prepare a model to be 3D printed using fused filament fabrication, metal
    binder jetting, metal powder bed fusion, and directed energy deposition techniques.
    We will also show how to select associated print settings based on the printing
    technology. We will highlight how to orient and place our parts based on machine-specific
    factors, such as recoater blade direction.


    Depending on the additive technology utilized by our specific 3D printer, as well
    as our part orientation, parts may need support structures during the printing
    process. As the supports utilized during metal powder bed fusion are different
    compared to the supports required for fused filament fabrication and resin printing,
    we will also learn about how to create technology-dependent support structures
    to minimize material waste, decrease print time, and minimize post-processing
    effort.


    Whether we are utilizing a customized Fused Filament Fabrication (FFF) 3D printer
    to print with a metal filament, or we use a metal binder jet 3D printer, we may
    need support structures to successfully print our parts or to provide the necessary
    support for our parts during the sintering process. In this chapter, we will also
    learn how to use Fusion 360 to create setter supports to prevent our parts from
    deforming due to the high temperatures they will be exposed to within a sintering
    oven.


    In this chapter, we will go over the following topics:


    +   - Introduction to metal 3D printing

    +   - 3D printing with metal powder bed fusion machines

    +   - Setter supports for a successful sintering process'
  merge: -1
  img_proc: true
- pgno: 348
  md: 'By the end of this chapter, you will have a good understanding of the various
    3D printing technologies you can use to manufacture parts using metal materials.
    You will have learned how to create an additive setup using Fusion 360 with a
    3D printer capable of manufacturing a metal part. You will gain an understanding
    of how to choose an appropriate part placement and orientation based on your 3D
    printing technology. You will have also learned how to create lightweight support
    structures for metal 3D printing. Finally, you will have learned how to create
    support structures for parts printed using metal binder jetting to minimize distortions
    during the sintering process.


    # Technical requirements


    In this chapter, we will cover metal additive manufacturing. We will highlight
    how you can use FFF and binder jetting printers to 3D print in metal. These printers
    are accessible to all Fusion 360 users (license type: Personal, Trial, Commercial,
    Startup, and Educational).


    However, we will also utilize multiple metal powder bed fusion (MPBF) 3D printers
    and their respective print settings. We will highlight how to generate support
    structures for MPBF machines and metal binder jet machines. These support structures
    are not available with Fusion 360 until you gain access to the Additive Build
    extension.


    As with all other Fusion 360 extensions, the Additive Build extension is not available
    for personal use.


    If you have a Commercial license of Fusion 360, to create an Additive setup with
    an MPBF machine, you will also need access to the Additive Build extension (https://www.autodesk.com/products/Fusion-360/additive-build-extension).


    Autodesk offers a 14-day trial for the Additive Build extension for all commercial
    users of Fusion 360. You can activate your trial within the extensions dialog
    of Fusion 360.


    The Additive Build extension is also available for free to Startup and Educational
    license users.


    The lesson files for this chapter can be found here: https://github.com/PacktPublishing/3D-Printing-with-Fusion-360.


    # Introduction to Metal 3D printing


    In Chapter 7, we created our first additive setup using an FFF printer. In this
    chapter, we will highlight how to create additive setups with machines that are
    capable of 3D printing with metal.


    The Fusion 360 machine library includes machines with additive capabilities for
    various technologies. Figure 12.1 shows how we can filter additive machines based
    on their technology within the machine library. Fusion 360’s machine library can
    be accessed within the MANUFACTURE workspace. You can access the Machine Library
    command within the MANAGE panel of any tab. If you have access to the Additive
    Build extension, you will be able to select an MPBF machine within Machine Library
    while creating an Additive setup:'
  merge: -1
  img_proc: true
- pgno: 349
  md: '![](img/baa027bed101c08b496f1f420cee8a5b_349_0.png)


    Figure 12.1 – Fusion 360 Machine Library


    As we mentioned in the introduction to this chapter, multiple technologies are
    capable of generating metal parts when using additive manufacturing. You can create
    a metal part using FFF, MPBF, binder jetting, **directed energy deposition (DED)**,
    and **electron beam melting (EBM)**. Fusion 360 can help you generate metal parts
    using four of the five additive manufacturing technologies, as shown in *Table
    12.1*. For each of the four supported additive manufacturing technologies, Fusion
    360 has machines from a list of machine manufacturers that you can use to create
    your Additive setup. Each machine vendor and technology has its capabilities and
    limitations, so the workflow to create metal parts will differ from technology
    to technology and vendor to vendor.


    In this chapter, we will mainly focus on MPBF and binder jetting technologies.
    However, in this section, we will briefly introduce how you can use FFF to create
    metal parts using Fusion 360:


    | Fused Filament Fabrication | Directed Energy Deposition | Binder Jetting | Metal
    Powder Bed Fusion |

    |---|---|---|---|

    | Ultimaker * | Autodesk Generic | Desktop Metal * | Aconity |

    | Raise3D * | Meltio | Sintertek * | Additive Industries |

    | All FFF machines (0.6 mm nozzle) |  | HP | DMG Mori |

    |  |  | Digital Metal | EOS |

    |  |  |  | Kurtz Ersa |

    |  |  |  | One Click Metal |'
  merge: -1
  img_proc: true
- pgno: 350
  md: '| Fused Filament Fabrication | Directed Energy Deposition | Binder Jetting
    | Metal Powder Bed Fusion |

    |---|---|---|---|

    |  |  |  | Renishaw |

    |  |  |  | SLM Solutions |

    |  |  |  | Xact Metal |


    Table 12.1 – Fusion 360 supported machine manufacturers for metal 3D printing


    In Table 12.1, you will notice that certain manufacturers have an * next to them.
    The Fusion 360 machine library includes machines from all of the machine manufacturers
    listed in this table. However, you may not be able to use Fusion 360 to slice
    your models and create the additive toolpath to 3D print them using a metal filament
    or metal powder for all machines in Machine Library.


    For machines from manufacturers with an *, Fusion 360 may not have the necessary
    print setting in its library or may not be able to create the specific slicing
    file format required by the machine maker. You can, however, use Fusion 360 to
    orient your parts within the printer’s build volume and generate support structures
    as needed.


    Both UltiMaker and Raise3D utilize FFF technology to 3D print with metal filaments.
    If you have an UltiMaker S5 (or Method 3D) printer with the metal expansion kit,
    you can upgrade your 3D printer to unlock metal FFF capabilities. Using this upgrade,
    you will be able to print using BASF Ultrafuse 17-4PH or 316L material. The necessary
    print settings for these materials can be downloaded from UltiMaker Cura software’s
    Material Marketplace. Once downloaded, you can use them with cc0.4 or cc0.6 cores,
    as shown in Figure 12.2. The Fusion 360 print setting library does not include
    a validated print setting for these metal filaments with UltiMaker printers:


    ![](img/baa027bed101c08b496f1f420cee8a5b_350_0.png)


    Figure 12.2 – UltiMaker S5 with metal expansion kit and filaments from BASF'
  merge: -1
  img_proc: true
- pgno: 351
  md: 'If you have access to a Forge 1 printer from Raise3D, you can use the same
    BASF filaments (17-4PH of 316 L) to generate metal parts using your FFF machine.
    Similar to 3D printing metal parts with UltiMaker S5 machines, the Fusion 360
    print setting library does not include a validated print setting for 17-4PH or
    316L from BASF for Raise3D printers.


    In the case of Forge 1, you will need to use Raise3D’s native slicer ideaMaker
    for Metal to slice your models and generate your additive toolpaths as the idea
    Maker software contains the necessary print profiles for these materials.


    Only UltiMaker and Raise3D offer a dedicated solution to 3D print with stainless
    steel filaments, debinding, and sintering solutions. In the case of UltiMaker,
    you need to ship your printed metal parts to one of several dedicated debinding
    and sintering service providers to get your finished part in the mail. If you
    have a Raise3D Forge 1 printer, you can also purchase a debinding and sintering
    station from Raise3D to complete the entire process at your facility.


    If you have an FFF printer from a different machine provider, you can use metal
    filaments, specialized extruders, as well as debinding and sintering stations
    from solution providers such as The Virtual Foundry (https://shop.thevirtualfoundry.com/).
    As you can see on The Virtual Foundry’s web page, they currently offer eight metal
    filaments – Aluminium 6061, Bronze, Copper, H13 Tool Steel, High Carbon iron,
    Inconel® 718, Tungsten, Stainless steel 17-4 and 316L, as well as Titanium 64-5
    – to their customers.


    The Fusion 360 print setting library already contains the necessary print settings
    for Copper and Bronze from The Virtual Foundry. The following blog from Autodesk
    highlights how designers are already using this method of metal 3D printing with
    Fusion 360 and Prusa 3D printers: https://www.autodesk.com/products/fusion-360/blog/imagining-3d-printed-future-sts-technical-design-virtual-foundry/.


    Please keep in mind that if you choose to use this workflow, you will have to
    manually scale up your parts by a predesignated multiplication factor for each
    material before slicing and generating the additive toolpath. Scaling before 3D
    printing is required because parts shrink during the sintering process. In the
    previously linked Autodesk blog, the end user scaled up their parts by 10% before
    slicing and printing them.


    An example of this workflow can be seen in Figure 12.3. The Fusion 360 document
    named Slotted Liner is also provided in the GitHub repository for this chapter.
    This Fusion document shows how you can set up a metal additive print using a Prusa
    i3 MK 3S + printer. The following figure shows an Additive setup with a customized
    Prusa printer. As you can see in the browser, this Additive setup uses a 0.6 mm
    nozzle instead of the default 0.4 mm nozzle. This customization has been done
    by editing the 3D printer selected for this Additive setup. Additionally, this
    setup includes a Virtual Foundry Copper (Direct Drive) print setting. In the same
    figure, you can see Print Setting Editor for this material, which displays the
    Infill subception for the Normal body preset. As we can see, this print setting
    uses a 100% infill density with a Rectilinear pattern. The Additive setup is based
    on the component within Manufacturing Model 1.'
  merge: -1
  img_proc: true
- pgno: 352
  md: 'If you open this model in Fusion 360 and look at **Manufacturing Model 1**,
    you will also notice that the component being 3D printed was scaled up 10% versus
    the model in the **DESIGN** workspace. You may recall that we covered how to modify
    components within the **MANUFACTURE** workspace using Manufacturing Models back
    in *Chapter 6*:


    ![](img/baa027bed101c08b496f1f420cee8a5b_352_0.png)


    Figure 12.3 – Prusa i3MK3S+ with a 0.6 mm hardened steel nozzle and copper filament


    Now that we have covered the 3D printing options with metal filaments using FFF
    printers, let’s move on to another technology: DED. In addition to a generic DED
    printer, the Fusion 360 library of machines includes a DED printer from the machine
    maker MELTIO named M450. This printer utilizes multiple lasers and metal wire
    to manufacture parts. You can create an Additive setup with this printer and choose
    the 316SS print setting from Fusion’s print setting library to generate the additive
    toolpath necessary for this printer.


    As the DED process does not require debinding or sintering, there is no need to
    scale your components up before creating your Additive setup. After generating
    an additive toolpath and simulating it, as shown in Figure 12.4, you can post-process
    the additive toolpath and generate the necessary G-code to manufacture your parts
    using this 3D printer. Figure 12.14 showcases an Additive setup of six metal watch
    casings in Fusion 360 and a corresponding 3D Print using this printer.


    The image source for the printed parts can be found at https://meltio3d.com/technology/:'
  merge: -1
  img_proc: true
- pgno: 353
  md: '![](img/baa027bed101c08b496f1f420cee8a5b_353_0.png)


    Figure 12.4 – Additive setup with a Meltio M-450 and the printed parts


    Another technology you can utilize with Fusion 360 to 3D print parts using metals
    is binder jetting. You can create Additive setups for several Desktop Metal printers,
    as well as the Sinterjet M60 printer from Sintertek using Fusion 360. Within these
    setups, you can orient and arrange your parts using automatic orientation tools
    and the Additive Arrange functionality we have covered in previous chapters.


    Once your additive setup is complete, you will need to export your setup as a
    3MF file and use the native slicers from these companies to 3D print your parts.
    Depending on which machine manufacturer you are working with, you may also need
    to scale your parts up before generating the 3MF file based on the material you
    are interested in 3D printing.'
  merge: -1
  img_proc: true
- pgno: 354
  md: 'If you are printing with a metal binder jet printer from HP, Fusion 360 offers
    additional functionality for connecting Fusion to your printer and sending print
    jobs directly to your machine. Figure 12.5 shows an additive setup of a `Connector`
    part oriented and arranged for an HP Metal Jet printer.


