- pgno: 291
  md: 'In this section, we covered the most important inputs for print settings for
    SLA and DLP 3D printers. We highlighted how you can customize a print setting
    by saving it to your local library. We demonstrated how **Layer Thickness** can
    be edited regardless of the print setting type. We highlighted the differences
    between print settings for a generic SLA and DLP printer versus machine vendor-specific
    print settings from Anycubic, Carima, and Prusa. In the next section, we will
    focus on how to assign a unique print setting to portions of our design to achieve
    specific manufacturing criteria.


    # Assigning unique print settings to bodies


    In the previous sections, we covered how to select and modify print settings for
    FFF and SLA/DLP 3D printers. We highlighted how each print setting contains multiple
    body presets within it and how you can modify the information within each body
    preset to customize the print setting for your needs. For FFF printers, the print
    settings that are shipped with Fusion 360''s library include a preset for **Normal**
    and **Strong** part printing options. We talked about how to change the default
    preset from **Normal** to a secondary preset such as **Strong** or a custom one
    we can create by duplicating an existing one. In this section, we will talk about
    how to assign those presets to specific bodies within our additive setup.


    To demonstrate this workflow, we will create a second setup using a second manufacturing
    model, as shown in Figure 9.23. As you can see in the figure, this setup is for
    an FFF printer (**Prusa i3 MK3S +**) and utilizes the **ABS (Direct Drive)** print
    setting. This setup includes all three components that were present in the original
    design document. They have been automatically positioned along the Y axis using
    **Additive Arrange** with an **Object Spacing** input of 5 millimeters.


    By default, all three components will utilize the **Normal** body preset, as this
    is the default preset for the **ABS (Direct Drive)** print setting. However, we
    can easily assign a different body preset to the body of our choosing. If we select
    the **Additive Arrange** line item from the browser and right-click on it, we
    can choose the **Assign Body Presets** command. This will bring up a new dialog
    called **ASSIGN BODY PRESETS** and display the available body presets within the
    selected print setting. We can see both the **Normal** body preset and the **Strong**
    body preset within this dialog. The **Strong** body preset row is highlighted
    in blue, waiting for us to select a body to assign it to.'
  merge: -1
  img_proc: true
- pgno: 292
  md: '![](img/baa027bed101c08b496f1f420cee8a5b_292_0.png)


    Figure 9.23 – The ASSIGN BODY PRESETS dialog in an additive setup


