  merge: -1
  img_proc: true
- pgno: 151
  md: '![](img/baa027bed101c08b496f1f420cee8a5b_151_0.png)


    Figure 4.28 – Section analysis view of a hollowed-out volumetric body


    As we covered in the previous subsection, whenever we hollow out a body, it is
    important to add drain holes so that the trapped resin or powder can be removed
    after 3D printing. If you are utilizing a volumetric lattice to hollow out a body,
    you can simply create a sketch, make a circle, and use the HOLE command to create
