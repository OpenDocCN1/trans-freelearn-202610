- pgno: 4
  md: '# Foreword


    I have known and worked with Sualp Ozel for close to seven decade, as one of the
    leading experts in Design Simulation and Additive manufacturing, he is my go to
    whenever I need to understand new developments and applications in the space.
    In this book, Sualp takes you on a learning journey from Design for Additive manufacturing,
    structural simulation, and print preparation through to process simulation and
    workflow automation.


    The first section will get you familiar with the basics of Fusion 360, from how
    to open new files or upload your existing models to the Fusion software for storage.
    Sualp demonstrates how to use Fusion to inspect and repair broken mesh files along
    with how to edit models so that they can be 3D printed effectively using various
    3D-printing technologies. The section also covers how to use Fusion''s Automated
    Modeling, Topology Optimization and Stress Simulation capabilities in tandem to
    generate functional parts that meet performance and manufacturing criteria.


    The book also covers hollowing and latticing parts and the various ways you can
    create lightweight and material saving models along with how to export them to
    common slicers such as Cura, PreForm and Prusa Slicer.


    In the third section you learn all about the *Manufacture* workspace of Fusion
    360, how to utilize it as a native slicer to prepare your parts for 3D printing.
    From how to use Fusion effectively to select a printer and print settings, arrange
    and orient your parts within your build volume, create support structures based
    on the needs of your specific printer.


    The final section is all about metal printing and automation, where Sualp draws
    from his years of experience and expertise to explain the unique requirements
    of metal powder bed fusion printing, how to create efficient support structures
    and simulate the printing process to detect potential build failures and compensate
    for thermal distortion.


    Understanding thesD-pritical areas can save hours of engineering time and the
    expense of failed prints. Throughout this book, Sualp provides all you need to
    learn the entire workflow from design to 3D print using the powerful capabilities
    in Fusion 360 in clear and easy to read resource suitable for people just starting
    their 3d printing journey, through to those that are ready to adopt some of the
    most advanced design and simulation tools available.


    Duann Scott


    3MF Consortium Executive director


    Teaching Assistant, MIT xPRO


    Founder at Bits to Atoms and the CDFAM Computational Design Symposium Series'
  merge: -1
  img_proc: true
- pgno: 5
  md: '# Contributors


    # About the author


    **Sualp Ozel** is a professional engineer and a senior product manager at Autodesk
    Inc. Sualp has 15 years of experience in planning roadmaps based on market requirements
    to deliver timely enhancements to existing products and go to market with new
    offerings while meeting the market’s expectations and requirements for quality.
    Since 2016, he has managed Autodesk’s additive manufacturing software portfolio
    including Fusion 360, Netfabb, Netfabb Local Simulation, and Within Medical. Sualp
    has also been an adjunct instructor at Carnegie Mellon University since 2014,
    teaching the *Introduction to CAD and CAE tools* course within the mechanical
    engineering department.


    *I want to thank everyone who supported me in this journey.*


