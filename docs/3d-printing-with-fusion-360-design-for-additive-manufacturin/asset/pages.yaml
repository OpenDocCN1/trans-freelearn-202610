- pgno: 85
  md: 'After inserting a Mesh file into Fusion 360, we have three ways we can work
    with those models. We can edit inserted mesh bodies in the following ways:


    +   - As Mesh bodies

    +   - After converting them into solid bodies

    +   - By recreating them as solid bodies


    # Editing inserted Mesh bodies as mesh bodies


    The mesh functionality within Fusion 360 is available for both parametric and
    direct modeling methodologies. When working with mesh files, there are several
    reasons why we may want to simply keep them as mesh bodies to prepare them for
    3D printing purposes. Using a mesh body, we can do quick manipulations, such as
    scaling a mesh body up or down with SCALE MESH, cutting a mesh body in two with
    PLANE CUT, hollowing a mesh body with SHELL, and combining or removing a mesh
    body with other mesh bodies with COMBINE.


    All these operations are available within the MESH tab | the MODIFY panel, as
    shown in Figure 2.37.


    ![](img/baa027bed101c08b496f1f420cee8a5b_85_0.png)


    Figure 2.37 – Editing a mesh body in Fusion 360 with the Plane Cut feature


    As mesh bodies are native body types to Fusion 360, you can also utilize mesh
    bodies as inputs for volumetric latticing if you have access to the Product Design
    extension. We will cover various options we have for latticing in more detail
    in Chapter 4.


    If you select the mesh body and make it a component, as shown in Figure 2.38,
    you can perform additional print preparation activities, such as mirroring components
    that have mesh bodies in them.'
  merge: -1
  img_proc: true
