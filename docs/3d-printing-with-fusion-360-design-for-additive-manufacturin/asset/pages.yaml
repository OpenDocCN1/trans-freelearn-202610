- pgno: 21
  md: '# Part 1:

    Design for Additive Manufacturing (DFAM)

    and Fusion 360


    In this part, we will show you how to open solid or mesh designs created in other
    software in Autodesk Fusion 360. You will learn how to create and edit models
    using parametric modeling and direct modeling techniques. You will learn how to
    work with mesh files to repair them both manually and automatically, using various
    methods within the software.


    You will also learn how to create automated models as well as topology-optimized
    models to generate lightweight components for 3D printing. You will learn how
    to simulate models created by the software to make sure that they can perform
    as desired under operating conditions.


    We will end the first part by going over how to hollow large-volume parts and
    introduce internal lattices to aid with additive manufacturing.


    This part has the following chapters:


    +   - Chapter 1, Opening, Inspecting, and Repairing CAD and Mesh files

    +   - Chapter 2, Editing CAD/Mesh Files with DFAM Principles in Mind

    +   - Chapter 3, Creating Lightweight Parts, and Identifying and Fixing Potential
    Failures with Simulation

    +   - Chapter 4, Hollowing and Latticing Parts to Reduce Material and Energy Usage'
