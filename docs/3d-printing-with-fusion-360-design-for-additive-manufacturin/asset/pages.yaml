    ![](img/baa027bed101c08b496f1f420cee8a5b_151_1.png)


    Figure 4.29 – Section view of a hollowed-out volumetric body with a drain hole'
  merge: -1
  img_proc: true
- pgno: 152
  md: 'As the main objective of this subsection is applying lattices, let''s go back
    to the **Volumetric Lattice** within the browser, right-click, and edit it, as
    shown in Figure 4.30. When we are editing our volumetric lattice, we can access
    the **Solidity** tab and increase the solidity from 0 to 0.2, thereby applying
    both a skin and a lattice to this part, which already has a drain hole:


    ![](img/baa027bed101c08b496f1f420cee8a5b_152_0.png)


    Figure 4.30 – Volumetric model shelled and latticed


    Once we have our design finalized, Fusion 360 offers two methods for 3D printing
    a volumetric model. The first method is to switch to the manufacturing workspace,
    creating an additive setup with the appropriate 3D printer, and slice the volumetric
    model natively in Fusion 360 to be 3D printed. The second method is to create
    a mesh body so that we can export it to third-party slicers. To convert a volumetric
    body into a mesh body, we have to select it from the browser and right-click.
    As shown in Figure 4.31, after choosing the **Create Mesh** option, we will be
    able to create a mesh representation of the volumetric body:'
  merge: -1
  img_proc: true
- pgno: 153
  md: '![](img/baa027bed101c08b496f1f420cee8a5b_153_0.png)


    Figure 4.31 – Creating a new mesh body out of a volumetric body


    The resulting mesh can be edited and visualized using all the native mesh tools
    we covered in Chapter 2. In Figure 4.32, we can see the resulting mesh body with
    a section analysis applied to show the internal lattice and drain hole.


    ![](img/baa027bed101c08b496f1f420cee8a5b_153_1.png)


    Figure 4.32 – Section analysis view of the mesh body created from a volumetric
    model'
  merge: -1
  img_proc: true
- pgno: 154
  md: 'Now it’s time to switch gears from the default cell shapes available within
    the volumetric lattice to custom shapes and solid lattices. As Fusion 360 is a
    parametric CAD tool, we can quickly generate a sketch, surface, or solid body,
    which we can then utilize as input for a custom cell type within the volumetric
    lattice. Figure 4.33 shows the recreation of a cross cell shape using a sketched
    circle extruded along a distance and patterned twice, using a circular pattern
    to create three bodies, which were then combined to create a single-body lattice
    cell.


    ![](img/baa027bed101c08b496f1f420cee8a5b_154_0.png)


    Figure 4.33 – Solid modeling of a single cell


    Now that our custom cell has been designed, we can apply this cell shape to a
    different body within the VOLUMETRIC LATTICE dialog. Figure 4.34 shows the application
    of our custom cell to a box of 10 mm by 10 mm by 10mm:'
  merge: -1
  img_proc: true
- pgno: 155
  md: '![](img/baa027bed101c08b496f1f420cee8a5b_155_0.png)


    Figure 4.34 – Utilizing the solid body as a custom cell within volumetric lattice


    When using a custom lattice as an input Cell Shape for a Volumetric Lattice, we
    have to remember that Fusion 360 is a parametric CAD tool and any changes we make
    to the body, which is used as input for the custom lattice, will have a downstream
    impact on the volumetric model, as shown in Figure 4.35.


    ![](img/baa027bed101c08b496f1f420cee8a5b_155_1.png)


    Figure 4.35 – The instant impact of modifying the custom cell solid body'
  merge: -1
  img_proc: true
- pgno: 156
  md: 'Now that we''ve covered all the details around how to use volumetric lattice,
    we can apply it to the part we designed and modified in the previous subsection.
    You can refer to the provided file, named `Hook with drain hole and lattice`,
    to see the outcome of applying a gyroid lattice with a cell size of 10 millimeters
    and an offset apply to all 23 faces of the hook with a 5-millimeter thickness:


    ![](img/baa027bed101c08b496f1f420cee8a5b_156_0.png)


    Figure 4.36 – Section view of the volumetric version of the hook model


    As we previously outlined, if we wanted to export this model out of Fusion 360
    to be sliced using a third-party slicer, we would have to create a mesh. After
    selecting the body and right-clicking, we can simply select **Create Mesh** and
    hit **OK** on the resulting dialog. Once we do, we will be able to visualize the
    meshed outcome of our model in the section view, as shown in *Figure 4.37*.'
  merge: -1
  img_proc: true
- pgno: 157
  md: '![](img/baa027bed101c08b496f1f420cee8a5b_157_0.png)


    Figure 4.37 – Section view of the meshed version of the hook model


    The final type of lattice we will cover in this subsection is a solid lattice.
    To create an example solid lattice, we will use the cross shape we have created
    as shown in Figure 4.33. Using Fusion 360’s Rectangular Pattern tools, we can
    easily create a 5-by-5 matrix in the X and Y direction for this shape, as shown
    in Figure 4.38:


    ![](img/baa027bed101c08b496f1f420cee8a5b_157_1.png)


    Figure 4.38 – Using a rectangular pattern on a solid body'
  merge: -1
  img_proc: true
- pgno: 158
  md: 'Once we have a planar version of a solid lattice, we can simply utilize the
    **PATTERN ALONG A PATH** command to create multiple copies along the Z axis. Using
    the pattern commands and selecting a solid body as an input will result in multiple
    copies of that same body. In this case, as this is a 5-by-5-by-5 matrix, we will
    end up with 125 bodies. We can simply use the **COMBINE** command, located within
    the **MODIFY** panel of the **SOLID** tab, and create a single solid body to represent
    the lattice shape.


    ![](img/baa027bed101c08b496f1f420cee8a5b_158_0.png)


    Figure 4.39 – A single solid body representing a lattice


    We can then combine and intersect this lattice shape with the shelled version
    of the solid body we are trying to hollow out and lattice, as shown in Figure
    4.40:'
  merge: -1
  img_proc: true
- pgno: 159
  md: '![](img/baa027bed101c08b496f1f420cee8a5b_159_0.png)


    Figure 4.40 – Hollowed-out box and an internal lattice


    If we apply a section analysis to the part, we can easily visualize the outcome
    of the hollowed-out objects and the lattice within the cavity of the part, as
    shown in Figure 4.41. Using this method, we can finalize our parts by adding the
    necessary drain holes with the solid modeling techniques previously discussed:


    ![](img/baa027bed101c08b496f1f420cee8a5b_159_1.png)


    Figure 4.41 – Section view of the hollowed-out box and internal lattice'
  merge: -1
  img_proc: true
- pgno: 160
  md: 'Creating lattices as solid objects is very beneficial, as designs we model
    as a solid geometry in parametric modeling can be easily edited later as needed.
    Solid lattices can also be exported as CAD files, such as STEP, SAT, and IGES.
    In addition, if you wanted to simulate the performance of parts with lattice structures,
    Fusion 360 can perform such simulations only if our models are made up of solids.
    Volumetric lattices cannot be simulated using Fusion 360. However, creating a
    solid lattice takes a lot of computing resources and can be cumbersome. Creating
    a lattice and shelling a given part using the **VOLUMETRIC LATTICE** dialog is
    more straightforward and can be used effectively to 3D print parts, if we do not
    need to simulate them, which is often the case for manufacturing prototype parts
    with resin printing.


    # Summary


    In this chapter, we covered how to hollow solid and mesh bodies using solid modeling,
    mesh modeling, and volumetric modeling techniques. We demonstrated the two methods
    we have for hollowing a solid body. The first method was by selecting one or multiple
    faces and removing those faces from the solid object in order to create an outer
    shell of the remaining body. The second method we utilized simply carved out the
    inside of the solid body. We highlighted how to visualize the impact of hollowing
    out a solid body by changing the visualization as well as adding a section analysis.


    Later in the chapter, we highlighted how to add drain holes to shelled objects
    to remove trapped powder or resin for 3D printing. We explained how the size and
    placement of the drain holes, as well as the number of drain holes needed, depend
    on the 3D printing technology. We demonstrated how to add drain holes for removing
    uncured resin from **stereolithography (SLA)** and **digital light processing
    (DLP)** printers. We covered the different-size drain holes required based on
    the viscosity of the resin and the 3D printing technology. We also highlighted
    where to place the drain holes so that we can effectively remove resin as well
    as eliminate the cupping effect, which could result in part failure during printing.
    We touched on how the placement of the drain holes depends on the part orientation
    for 3D printing.


    We finished the chapter by showcasing how to add volumetric and solid lattices
    to our parts. One of the main reasons we want to hollow out our bodies is to lightweight
    them and save material and energy during 3D printing. However, not all technologies
    can 3D print a hollow object without needing support structures. In the final
    subsection of this chapter, we covered various ways we can create internal lattices,
    which act as support structures for printing hollowed objects with SLA and DLP
    printers. We talked about how hollowing out a body and adding a volumetric lattice
    can be accomplished with a single command within Fusion 360. We ended the chapter
    by talking about the differences between volumetric lattices and solid lattices
    and how solid lattices can be used to conduct finite element analysis simulation
    to see whether the 3D printed part can withstand operating conditions.


    Using these techniques, we can quickly and easily cut down on the amount of material
    we need to 3D print parts with large cross-sections using resin or plastic powder-based
    printers. This takes us to the end of our discussion of design for additive manufacturing
    concepts.


    In the next chapter, we will transition from talking about design to highlighting
    how to manufacture those designs by looking at how to export models created in
    Fusion 360 to third-party slicer software.'
  merge: -1
  img_proc: true
