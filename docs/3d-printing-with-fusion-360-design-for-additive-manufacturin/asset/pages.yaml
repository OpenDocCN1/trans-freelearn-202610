- pgno: 413
  md: 'Fusion 360 has native capabilities to copy and paste components. However, if
    you wanted to create multiple components with the same location as the original
    component, you would have to utilize the copy-and-paste commands in sequence as
    many times as the number of components you wish to create. This could take a long
    time, depending on the number of copies you wish to make. Utilizing an add-in,
    such as the one we demonstrated in this section, which automates this process,
    will save you a significant amount of time and eliminate any potential errors
    you could introduce during the copy-and-paste process, as the number of components
    increases.


    In this section, we mainly highlighted how to automate our workflows within the
    **DESIGN** workspace using add-ins. In the next section, we will focus on how
    to automate certain workflows within the **MANUFACTURE** workspace by customizing
    our libraries for machines, print settings, and presets.


    # Customizing presets and using templates


    In previous chapters, we demonstrated how to create an additive setup using Fusion
    360''s **MANUFACTURE** workspace. We also showcased how to orient parts, arrange
    them within the build volume, and generate supports. We highlighted how to simulate
    the additive toolpath and generate the necessary machine file.


    In this section, we will showcase how to customize Fusion''s machine and print
    setting library in order to speed up the process of creating an additive setup.
    We will also touch on how to customize the default inputs for various dialogs
    within an additive setup, and how to create presets to combine multiple custom
    support operations into a single command, effectively generating support structures
    for our models.


    Even though the process of creating an additive setup is straightforward, it does
    involve selecting a machine and a print setting explicitly for every single setup.
    Within the **MANUFACTURE** workspace of Fusion 360, we can access the **Machine
    Library** dialog within the **MANAGE** panel, as shown in callout 1 of Figure
    14.8. We can also copy and paste 3D printers from the Fusion 360 library to our
    own cloud, local, or linked libraries as shown in callout 2. The following figure
    shows a 3D printer named **Prusa i3 MK3S+**, saved within the **Local** folder
    under My machines. Whenever we copy and paste a machine from the Fusion 360 library
    of machines to a folder within My machines, the associated post file (* .cps),
    as highlighted with callout 3, is automatically assigned. However, we still have
    to designate a print setting when creating an additive setup with this machine.
    In order to expedite the setup creation process, we can also connect a print setting
    with this machine by clicking the folder icon shown in callout 4. After selecting
    **PLA (Direct Drive).printsetting** from the print setting library, our local
    machine is now ready to be utilized in the setup creation. After selecting this
    machine from the local folder of My machines during the setup creation, we no
    longer have to select a print setting, as this print setting is automatically
    associated with the **PLA direct drive** print setting within the machine library.'
  merge: -1
  img_proc: true
- pgno: 414
  md: '![](img/baa027bed101c08b496f1f420cee8a5b_414_0.png)


    Figure 14.8 – Associating a print setting to customize a machine


    After creating an additive setup using this machine and print setting, we may
    need to orient our components within the build volume of the 3D printer. Figure
    14.9 shows how you can access the Automatic Orientation command within the POSITION
    panel of the ADDITIVE tab. In this example, we can select our component, named
    Centrifugal fan, as the target component to be oriented.


    > Important note

    > As covered in detail in Chapter 8, when calculating the support area and support
    volume, the automatic orientation command looks for segments of a part that has
    an overhang angle below a certain angle from the horizontal plane, in order to
    rank the outcomes of the orientation study.


    Any input within a dialog in a manufacturing setup can be customized by selecting
    the vertical ellipsis icon to the right of the input field, as shown in Figure
    14.9. After selecting the : icon, a drop-down menu will be displayed, which will
    allow you to save your current input as the user default. By customizing an input
    and saving it as the user default, you can reuse it the next time you execute
    any of the positioning or support actions within an additive setup.'
  merge: -1
  img_proc: true
- pgno: 415
  md: '![](img/baa027bed101c08b496f1f420cee8a5b_415_0.png)


    Figure 14.9 – Saving a custom input as the user default


    Another useful option within the same menu is the ability to copy the parameter
    name of any input field. Figure 14.10 shows the **General** tab of the **SOLID
    VOLUME SUPPORT** dialog. As a reminder, you can access this dialog by selecting
    the **Solid Volume Support** command from the **SUPPORTS** panel of the **ADDITIVE**
    tab, for an additive setup with an FFF 3D printer.


    As you can see in the following figure, this tab has two input fields – **Top
    Distance to Part** and **Bottom Distance to Part**. The default inputs for these
    fields are 0 . 3 millimeters. Each input field has a parameter name associated
    with it, which you can reuse within any dialog in the **MANUFACTURE** workspace
    and while creating scripts or add-ins using Fusion’s API. These parameter names
    can also be utilized as a part of an equation either within the **Edit Expression**
    dialog or while entering inputs into other input fields.


    Figure 14.10 shows how we can simply copy the parameter name, as shown in callout
    1, and paste it into a different input field, as shown in callout 2, to create
    an equation where are the **Top Distance to Part** input is half the value of
    the **Bottom Distance to Part** input.'
  merge: -1
  img_proc: true
- pgno: 416
  md: '![](img/baa027bed101c08b496f1f420cee8a5b_416_0.png)


    Figure 14.10 – Editing inputs using parameter names


    Now that we have covered how to customize user inputs and utilize parameters,
    we can switch gears and focus on combining multiple operations, such as arranging
    parts, performing automatic orientation studies, and creating support structures
    in a single template.


    To demonstrate how we can utilize templates, let''s create a new Fusion document
    named Centrifugal fan - SLA. This Fusion document has an additive setup with an
    SLA printer, as shown in Figure 14.11. The printer we are using for the setup
    is a **Prusa SL1S SPEED** printer, and the print setting is set to **Prusa SL1S
    SPEED - Prusa Orange Tough - 0.1mm Fast**. The part is already arranged and oriented
    within the build volume. As you can see from Figure 14.11, we have already created
    a down-oriented point bar support for this component, and we will create a second
    support using the **Bar Support** action located within the **SUPPORTS** panel
    of the **ADDITIVE** tab. During the bar support creation, we change the input
    field for **Bars per Group** to **4**, enable the checkbox named **Brace**, and
    select the **K** brace type.'
  merge: -1
  img_proc: true
- pgno: 417
  md: '![](img/baa027bed101c08b496f1f420cee8a5b_417_0.png)


    Figure 14.11 – Adding a bar support to a part within an additive setup with an
    SLA printer


    After creating both of these support structures, we can select them from the browser.
