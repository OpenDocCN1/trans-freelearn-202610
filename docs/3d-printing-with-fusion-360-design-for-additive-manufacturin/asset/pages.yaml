  md: '# Editing inserted Mesh bodies by recreating them as solid bodies


    Even though converting mesh bodies into solid bodies is the best way to make sure
    we can edit them with all the solid modification functions included in Fusion
    360, sometimes for very complex models, the mesh conversion may not be successful.
    In such cases, we can use the inserted mesh body as a reference and create sketches.
    Later, we can utilize profiles within those sketches as input for the EXTRUDE,
    REVOLVE, SWEEP, or LOFT commands to create the desired solid outcome. This is
    by far the most involved method for converting mesh bodies into solids, but it
    is a powerful tool in our toolset. Let’s demonstrate this workflow using the same
    dataset.


    After inserting our mesh and moving it to ground, we can utilize the CREATE MESH
    SECTION SKETCH command located in the MESH tab | the CREATE panel. After selecting
    the body, Fusion automatically selects a section plane. This may or may not be
    the section plane we need to create our sketch. In this case, we want to create
    a sketch parallel to the XY plane. We can hit the select button next to Section
    Plane. This will display the global planes and the global axes. We will select
    the XY plane and, using the on-screen manipulators, move it up by 10 millimeters.
    This will give us a preview of the mesh section sketch, as shown in Figure 2.44.


    ![](img/baa027bed101c08b496f1f420cee8a5b_90_0.png)


    Figure 2.44 -- Preview of mesh section sketch


    Next, we can select Sketch 1 in the browser, right-click, and edit it. In this
    example, we will utilize the FIT CURVES TO MESH SECTION command located in the
    SKETCH tab | the CREATE panel. Using the various Fit Curve Type options, we can
    select a segment of the mesh section sketch and create mesh lines, arcs, circles,
    and splines, as shown in Figure 2.45.'
  merge: -1
  img_proc: true
- pgno: 91
  md: '![](img/baa027bed101c08b496f1f420cee8a5b_91_0.png)


