- pgno: 372
  md: 'If you are using Fusion 360 alongside your EOS Metal 3D printers, you will
    need to have a license to software called EOSPrint from your machine manufacturer
    to submit jobs to your printer. Fusion 360 can be used to create additive setups
    with your EOS metal printers. You can select your print settings from Fusion’s
    print setting library, which aligns with all the print settings supplied by EOS.
    You can add support structures and slice your models in Fusion as well. However,
    to create the additive toolpath specific to your EOS hardware, you will need to
    have a license for EOSPrint.


    If you have Fusion 360 and EOSPrint software installed and licensed on your computer,
    you can generate the additive toolpath and even inquire about the estimated build
    time for your additive setup. You can connect to your specific printer and submit
    a print job directly to the printer itself. To activate this functionality, you
    will also need to download and install EOSPRINT for Autodesk Fusion 360. You can
    locate this app on the Autodesk App Store at https://apps.autodesk.com/FUSION/en/Detail/Index?id=8154614516617688086.


    In this section, we highlighted how to generate an orientation study and select
    a part position and orientation for a successful metal additive print using MPBF
    printers. We also went over how to create support structures for this additive
    manufacturing technology.


    In the next section, we will discuss how to create setter supports, which are
    used during the sintering process after printing parts using metal binder jetting
    technologies.


    # Setter supports for a successful sintering process


    MPBF is one of the most adopted technologies for creating metal parts using additive
    manufacturing. However, recently, there have been several machine vendors entering
    the metal binder jetting field. Desktop Metal has been a leader in this field
    for many years. HP also recently entered the metal binder jetting field by releasing
    a new printer named Metal Jet S100. Markforged, which is a company known for making
    3D printers that can print using the continuous fiber reinforcement method, also
    started offering its Digital Metal PX 100 series of printers to serve the metal
    binder jetting field. Alongside these well-known brands are also some new entries
    into the field, such as Sinterjet M60 from Sintertek.


    As manufacturers start adopting metal binder jet technology in their workflows,
    we need to highlight how you can create additive setups using Fusion 360 and prepare
    your prints for these printers. For the most part, creating an additive setup
    for a binder jetting technology is no different than the additive setup we create
    for SLS printers. The most important aspect of an additive setup for a binder
    jet printer is orienting and arranging our parts within the build volume. Such
    a setup with four components with an HP Metal Jet S100 printer is shown in Figure
    12.24.


    Some 3D printers (for example, Digital Metal PX100) require us to scale all our
    models up before slicing. Other printers (for example, HP Metal Jet S100) can
    automatically handle the scaling of parts onboard the printer.'
  merge: -1
  img_proc: true
- pgno: 373
  md: 'Regardless of the metal binder jetting printer that we use for an additive
    setup, you may notice that the list of available support types for a binder jet
    setup is limited to Base Plate support and Setter support. This is because binder
    jetting technology does not require support structures during the printing phase.
    However, once the print is finished, we are left with a part in its green state.
    Parts printed with a binder jet printer need to be post-processed and require
    sintering to evaporate the strong binder holding the metal part together. This
    process also fully compacts the metal part to remove porosity:


    ![](img/baa027bed101c08b496f1f420cee8a5b_373_0.png)


    Figure 12.24 – Creating a setter support for an additive setup with a metal binder
    jet printer


    After printing a part and extracting it from the loose powder, we will need to
    place it in a sintering oven. Parts that just finished curing in the printer are
    called green parts. In this state, they are fragile and need to be held in place
    with a material that can both cradle the part and shrink with it during the sintering
    process.


    Using the Setter Support command located within the SUPPORTS panel of the ADDITIVE
    tab, we can select a given component to generate a support structure, which will
    primarily be used during the sintering process.'
  merge: -1
  img_proc: true
- pgno: 374
  md: 'Figure 12.25 shows the **General** tab for the **SETTER SUPPORT** dialogue.
    In this tab, we can control various options to create a setter support to protect
    our parts during the sintering process. The **Gap** input controls the distance
    between the part and the setter support. The **Z Overlap** drop-down menu is set
    to **Remove** by default, which allows a part to be lifted in the Z direction
    without any support structure blocking the motion. **Bounding Shape** is the **Silhouette**
    component of our parts by default, which generates a shape based on its shadow.
    The **Fill Inner Contour** option is set to **Yes** by default, which creates
    a support structure, even if there is a hole aligned with the Z axis of our part.
    The **Outer Offset (XY Plane)** input allows us to control the thickness of the
    setter around the perimeter of the part. The **Maximum Height** input allows us
    to control how high our setter supports should be from the build plate. The **Taper
    Angle** input controls the angle from the vertical axis for the perimeter of our
    setter support perimeter walls.


    As we are choosing an orientation and position for our parts within a binder jet
    machine, it is important to place our parts above the Z-axis by a certain amount
    so that the setter supports we generate can cradle the parts along its bottom
    surface as well as its side surfaces.


    Figure 12.25 shows a close-up view of our additive setup while hiding **Component
    1:2**, **Component 1:4**, and **Component 1:5** and only displaying **Component1:1**.
    To improve the visualization, we also hid the machine build plate in this figure:


    ![](img/baa027bed101c08b496f1f420cee8a5b_374_0.png)


    Figure 12.25 – Generating a setter support for a component'
  merge: -1
  img_proc: true
- pgno: 375
  md: 'Another option we have with setter supports is to modify the bounding shape
    from a silhouette of our parts to a rectangular object. As shown in Figure 12.26,
    we can set Bounding Shape to Rectangle and change the pattern type from a Solid
    pattern to a Rectangular, Hexagonal, Circular, or Column pattern. Figure 12.26
    shows the outcome of a hexagonal pattern. If we choose a pattern other than solid,
    we can also control the pattern size by adjusting its cell size and wall thickness:


    ![](img/baa027bed101c08b496f1f420cee8a5b_375_0.png)


    Figure 12.26 – A setter support with a rectangular bounding shape and a hexagonal
    fill pattern


    Once we are satisfied with our support, we will need to split the support structure
    from the part as we may not want to 3D print them in place. Please remember that
    we don’t need the support structure during the printing process. We will only
    utilize it during the sintering phase. Therefore, we don’t need to print the part
    and the support structure together. We can accomplish this by exporting our additive
    setup as a 3MF file using the 3MF Scene Export function located in the ACTIONS
    panel of the ADDITIVE tab, as shown in Figure 12.27. When we use this command,
    we will be able to modify the options within the 3D SCENE EXPORT dialogue and
    select the Include the support structures checkbox:'
  merge: -1
  img_proc: true
- pgno: 376
  md: '![](img/baa027bed101c08b496f1f420cee8a5b_376_0.png)


    # Figure 12.27 – Creating a 3MF file and including support structures


    Once the 3MF file has been saved on our hard disk, we can create a new Fusion
    document by selecting the + icon, as shown in Figure 12.28 via callout 1. Within
    the MESH tab of the DESIGN workspace, we can use the Insert Mesh function, as
    shown in callout 2, to insert the 3MF file we have just created into the active
    design document. Fusion will import each component as a mesh body with a unique
    name. We can simply hide the visualization for mesh bodies 3, 4, and 5, as shown
    by callout 3. This way, we will be able to focus on the support structure and
    mesh body of the component we created the setter support for:'
  merge: -1
  img_proc: true
- pgno: 377
  md: '![](img/baa027bed101c08b496f1f420cee8a5b_377_0.png)


    Figure 12.28 – Inserting a 3MF file into a Fusion document to visualize setter
    support outcomes


    Using the Move command located in the Modify tab, you can select Meshbody2 and
    move it to the Z-axis. Figure 12.28 shows the outcome of this move operation,
    as highlighted by callout 4 in the timeline. As you can see, our bracket component
    fits neatly within the setter support and can be removed from the Z-axis without
    any blocker. If we put this part and the setter support into the sintering oven
    together, the binder will evaporate from the part and the support and these parts
    will shrink together uniformly. The setter support will support the component
    during this sintering process so that it does not sag or permanently deform during
    the sintering phase.


    # Summary


    In this chapter, we learned all about metal additive manufacturing. We started
    this chapter by highlighting all the additive manufacturing technologies you can
    utilize to create metal parts. We demonstrated how to use fused filament fabrication
    printers from UltiMaker and Raise3D and metal filaments from companies such as
    BASF to 3D print metal parts that require debinding and sintering. We also showcased
    how you can use any FFF 3D printer with customized extruders and specialized metal
    filaments from companies such as The Virtual Foundry to 3D print with metal filaments.
    Each of these solutions requires the 3D-printed part to be further processed by
    debinding and sintering. We then highlighted how to create metal parts using directed
    energy deposition technology utilizing printers such as the Meltio M450 printer
    available within Fusion 360''s machine library.'
  merge: -1
  img_proc: true
- pgno: 378
  md: 'In the next section, we demonstrated how to create additive setups using MPBF
    printers. We showcased how additive setups for MPBF printers are very similar
    to the setups we created for FFF and SLA/DLP 3D printers, with one main difference
    around part positioning and support structure generation. We highlighted how to
    stagger part positions so that we do not create a high resistance zone for a hard
    recoater blade. We also highlighted how to create various polyline and volume
    supports to support the part during the printing process. We showcased how to
    minimize material use to create those support structures and avoid support creation
    on upskin surfaces by utilizing angled volume supports. At the end of the second
    section, we also covered how to generate the machine-specific file format needed
    to initiate a print job after slicing and simulating our additive toolpath.


    In the final section, we focused our efforts on the metal binder jetting process.
    We discussed how to create an additive setup for this process. We highlighted
    how the loose powder within the binder jetting technology is capable of supporting
    parts being printed during the curing phase. We also discussed how parts manufactured
    with this technology require a sintering process to evaporate the binding agent
    and result in a fully dense part. In the final section of this chapter, we covered
    how to create setter supports that can cradle our parts and protect them from
    sagging during the sintering process while shrinking uniformly with our part as
    they are made with the same process and material.


    Using any one of these techniques, you can feel more confident in creating your
    additive setups for the 3D printing technology you have available to generate
    a metal component. In the next chapter, we will focus on how to simulate the MPBF
    process to identify and fix potential print failures that are caused due to high
    thermal stresses and distortions that are common with the process.'
  merge: -1
  img_proc: true
- pgno: 379
  md: '# Simulating the MPBF Process


    Welcome to *Chapter 13*. In this chapter, we will explore how to simulate the
    printing process within a **metal powder bed fusion (MPBF)** 3D printer. MPBF
    machines are among the most expensive 3D printers. Metal powder is an expensive
    form of 3D printing material. Therefore, any mistake or print failure is a costly
    one when it comes to metal 3D printing. Fusion 360 users with Additive Build extension
    access can simulate their MPBF printing process to detect and rectify common print
    failure modes, such as part distortion and recoater blade interference. In this
    chapter, we will highlight how to perform such analyses and make the necessary
    changes to avoid common print failure modes.


    In this chapter, we will cover the following topics:


    +   - Setting up a process simulation

    +   - Interpreting the results

    +   - Compensating for distortions and updating the setup


    By the end of this chapter, you will have learned how to select a component in
    an additive setup with an MPBF printer as a target for process simulation. You
    will acquire an understanding of the various print settings and how they impact
    process simulation inputs. You will learn how to modify process inputs, such as
    print bed heating, and finite element analysis inputs, such as mesh settings to
    conduct a process simulation, while making trade-offs of speed versus accuracy.
    You will also learn how to inspect the results of process simulation and identify
    large deformation areas in your model, determining whether your parts will experience
    a recoater crash or not. By the end of the chapter, you will be able to export
    a compensated shape to offset the distortions your parts may experience during
    the printing process, printing your parts with minimal distortions.'
  merge: -1
  img_proc: true
- pgno: 380
  md: '# Technical requirements


    In this chapter, we will continue to cover metal additive manufacturing. We will
    create additive setups using an MPBF 3D printer and its respective print settings.
    We will generate support structures specific to MPBF machines. We will also conduct
    process simulation for our parts and supports. MPBF machines, MPBF-specific support
    structures, and the ability to conduct a process simulation are not available
    with Fusion 360 until you gain access to the Additive Build extension.


    As with all other Fusion 360 extensions, the Additive Build extension is not available
    for personal use.


    If you have a commercial license of Fusion 360, to create an additive setup with
    an MPBF machine, you will also need access to the Additive Build extension (https://www.autodesk.com/products/Fusion-360/additive-build-extension).


    Autodesk offers a 14-day trial for the Additive Build extension for all commercial
    users of Fusion 360. You can activate your trial within the extensions dialog
    of Fusion 360.


    The Additive Build extension is also available for free to Startup and Educational
    license users.


    The lesson files for this chapter can be found here: https://github.com/PacktPublishing/3D-Printing-with-Fusion-360


    # Setting up a process simulation


    In this section, we will demonstrate how to create a metal additive manufacturing
    setup using a powder bed fusion printer and initiate a process simulation, in
    order to analyze the deformation a part will experience during the 3D-printing
    process.


    In order to demonstrate this functionality, we will use the Fusion document named
    L Brackets, as shown in Figure 13.1. This model consists of three components with
    varying overhang angles. Component1 has an overhang angle of 0 degrees, Component2
    has an overhang angle of 15 degrees, and Component3 has an overhang angle of 30
    degrees.'
  merge: -1
  img_proc: true
- pgno: 381
  md: '![](img/baa027bed101c08b496f1f420cee8a5b_381_0.png)


    Figure 13.1 – Three components with various overhang angles


    After changing the Fusion workspace from DESIGN to MANUFACTURE, we can create
    an additive setup using a Renishaw AM 250 machine from Fusion’s machine library.
    In this setup, we will select the RenAM250 Titanium Ti6Al4V-1123-Q 60 micron print
    setting, as shown in Figure 13.2. We will also manually arrange all three components
    such that they are staggered in the X and Y directions, ensuring that they do
    not interfere with the recoater blade direction, as indicated on the build plate.
    As you may recall, in Chapter 12, we discussed the reasoning behind why such an
    arrangement is beneficial when preparing our builds for printing with an MPBF
    machine.


    ![](img/baa027bed101c08b496f1f420cee8a5b_381_1.png)


    Figure 13.2 – Arranging three components within an additive setup'
  merge: -1
  img_proc: true
- pgno: 382
  md: 'Once our parts are positioned within the build volume, we can add the necessary
    support structures so that our parts can be manufactured using this printer. As
    you can see in Figure 13.3, we added a volume support for each component. During
    the support creation, we used the default settings for the volume support.


    As a reminder, the default volume supports are generated with a diamond hole pattern,
    using a sparse density input. **Thickening up Structures** and **Fin Structures**
    are enabled, which creates a supporting geometry as thin as possible, saving material
    and print time. However, we do not know whether the support structures we generate
    will be strong enough to support the part during the printing process. That is
    another reason we need to conduct a process simulation – to see whether we need
    to make support stronger to avoid a potential print failure.


    ![](img/baa027bed101c08b496f1f420cee8a5b_382_0.png)


    Figure 13.3 – Volume supports are added to each component


    Before we initiate a process simulation, it is a good idea to take a closer look
    at our print settings. If we select the print setting associated with this setup,
    right-click, and edit it, we will see the **Print Setting Editor** dialog and
    can inspect the build parameters included in this print setting. As highlighted
    in yellow in Figure 13.4, this print setting utilizes a layer thickness of 60
    microns, and the material is set to titanium. Both of these inputs can be found
    in the **General** section of the print setting.'
  merge: -1
  img_proc: true
- pgno: 383
  md: '![](img/baa027bed101c08b496f1f420cee8a5b_383_0.png)


    # Figure 13.4 – Editing the print setting to visualize build parameters


    If we select the **Hatching** subheading within the **Normal** body preset, we
    will also be able to visualize the hatch distance and rotation increment angle
    for the hatch pattern that Fusion 360 will utilize to create the infill for this
    print. As shown on the left side of Figure 13.5, the current strategy for the
    infill is the **Stripe** method. Each laser hatch for this pattern will be 0.095
    millimeters apart, and the hatch pattern will alternate 67 degrees around the
    Z axis per layer.


    If we select the **Scanning** subheading within the **Body Presets** section for
    the **Normal** preset, we will also be able to visualize the laser power associated
    with this print setting. The image on the right side of Figure 13.5 shows that
    the laser will be set to 200 watts while printing the hatches.'
  merge: -1
  img_proc: true
- pgno: 384
  md: '![](img/baa027bed101c08b496f1f420cee8a5b_384_0.png)


    Figure 13.5 – Hatching and scanning print settings for titanium


    The information we have highlighted in Figure 13.3 and Figure 13.4 are parameters
    recommended by the machine manufacturer in order to print with titanium on this
    specific printer. As you may have noticed, there are many parameters you can edit
    to fine-tune your print settings for an MPBF printer. Each parameter has an impact
    on the outcome of your print.


    However, only a subset of these parameters are taken into consideration when conducting
    a process simulation, as they have been identified as having the most significant
    impact on thermally induced stresses during the printing process. The parameters
    we have highlighted in the previous figures feed directly into the inputs required
    to conduct a process simulation in Fusion 360.


    As you can see in Figure 13.6, if we select the Process Simulation subheading
    within Print Settings Editor for this print setting, we can see that Fusion 360
    already has an associated parameter set to utilize for the simulation. Process
    simulation parameter sets are saved as * . PRM files.


    > **Important note**

    > “A **processing parameter (PRM)** file records machine process parameters and
    material properties. A moving heat source is applied to the material on a small-scale
    analysis. The PRM file stores the mechanical response of the material to the machine
    parameter setting. This can be extrapolated to a full part … the PRM file can
    be reused for any future simulation using the same combination of material and
    processing parameters” (https://help.autodesk.com/view/NETF/2024/ENU/?guid=GUID-7A9E551D-36B2-4922-8A38-0072EEDB5A23).'
  merge: -1
  img_proc: true
- pgno: 385
  md: '![](img/baa027bed101c08b496f1f420cee8a5b_385_0.png)


    Figure 13.6 – Selecting a process simulation parameter set associated with a print
    setting


    If you want to conduct a process simulation using a different PRM file, you can
    do so by selecting it from the drop-down menu named Parameter Set. This dropdown
    automatically filters simulation parameters within its library to PRM files associated
    with the same material selected within the print setting. As shown in Figure 13.7,
    after changing the parameter set from the default PRM of Renishaw_AM250_Ti6Al4V_60um
    to Renishaw_AM250_Ti6Al4V_30um_1500mm/s-1, Print Setting Editor indicates that
    the additive toolpath will be created using the original print setting, yet the
    process simulation will be based on the newly selected parameter set. In the same
    figure, you can see the highlighted values, which show the difference between
    the Renishaw_AM250_Ti6Al4V_60um print setting versus the Renishaw_AM250_Ti6Al4V_30um_1500mm/s-1
    parameter set inputs for Layer Thickness (60.000 microns versus 30.000 microns)
    as well as Laser Speed (857.000 mm/s versus 1500 mm/s) and Hatch Distance (0.095
    mm versus 0.065 mm).'
  merge: -1
  img_proc: true
- pgno: 386
  md: '![](img/baa027bed101c08b496f1f420cee8a5b_386_0.png)


    Figure 13.7 – The differences in process parameters between the print setting
    versus the non-default PRM


    Now that we have highlighted how Fusion 360 utilizes the inputs we have in our
    print settings to conduct process simulation, we can close the Print Setting Editor
    dialog and proceed with the default print settings. In order to start setting
    up our simulation, we need to access the Study command located within the PROCESS
    SIMULATION panel of the ADDITIVE tab. As shown in Figure 13.8, this will bring
    up the STUDY dialog, where we can select the target body we wish to conduct our
    process simulation on. The Advanced Settings section within this dialog allows
    us to control the size of the mesh elements that Fusion 360 will create to conduct
    this finite element analysis. The Layers per element field controls the size of
    a given element, based on the layer thickness that was set within the print settings.
    By default, Fusion 360 utilizes an adaptive mesh, where the elements are smaller
    at the layer that is being printed and grow larger below the active layer. An
    adaptive mesh results in a fast analysis at the cost of accuracy. The Coarsening
    Generations and Max Adaptivity Level inputs control the change in element size
    below the layer being printed. Using smaller inputs for these two fields will
    increase the accuracy of your results at the cost of increased solve times. You
    can also control the Platform Thickness and Platform Heating inputs within this
    dialog.'
  merge: -1
  img_proc: true
- pgno: 387
  md: 'In order to simplify the meshing process and solve times, Fusion 360 homogenizes
    the support structure geometry and simulates it using modified physical properties.
    When the **Auto Calculate Support Volume Fraction** checkbox is active, this homogenization
    is performed automatically.


    ![](img/baa027bed101c08b496f1f420cee8a5b_387_0.png)


    Figure 13.8 – Setting up a process simulation using the STUDY dialog


    After selecting our target body and making all the customizations necessary within
    the advanced settings of the **STUDY** dialog, we can select **OK** to proceed.
    At this point, Fusion 360 conducts a pre-check and displays the **SOLVE** dialog.


    In Figure 13.9, we can see that our print settings match our PRM file, which means
    we can use the default parameter set to solve this simulation and do not need
    to select a different parameter set to proceed.


    As we chose to utilize the default input values in the **STUDY** dialog for **Layers
    per element** (20), **Coarsening Generations** (2), and **Max Adaptivity Level**
    (5), our solve accuracy will be low, but we will calculate our results quickly.


    Our model has the appropriate contact to the platform and does not require an
    additional support structure.


    We have not generated the mesh at this point; therefore, we see a warning sign
    next to the *FEA mesh* section. We can either select the **Check mesh** icon or
    simply select the **Solve** button to start the simulation.'
  merge: -1
  img_proc: true
- pgno: 388
  md: '![](img/baa027bed101c08b496f1f420cee8a5b_388_0.png)


    Figure 13.9 – A pre-check before starting a process simulation


    Once a solve is initiated, Fusion 360 displays the CAM Task Manager dialog, as
    shown in Figure 13.10. In this dialog, we can see that Fusion conducts a thermo-mechanical
    simulation to calculate the deformations and stresses that our part will be subjected
    to during the 3D printing process. If we select the line item for the active study,
    we can right-click and disable the Auto Remove option, allowing us to monitor
    the progress during the solve and inquire the total solve duration once it is
    complete.


    ![](img/baa027bed101c08b496f1f420cee8a5b_388_1.png)


    Figure 13.10 – CAM Task Manager reports the progress of a process simulation'
  merge: -1
  img_proc: true
- pgno: 389
  md: 'After the thermo-mechanical simulation is complete, Fusion 360 will display
    the results of the simulation in a new tab called RESULTS, as shown in Figure
    13.11. We will see a colorful representation of the build plate and the first
    few layers of the part being 3D-printed. As this is a transient analysis, we will
    be able to toggle through the time steps to visualize the part being printed,
    layer group after layer group.


    ![](img/baa027bed101c08b496f1f420cee8a5b_389_0.png)


    Figure 13.11 – Visualizing the results of the process simulation


    The default colors we will see represent the magnitude of the displacement our
    part will experience during the printing process, and they will correspond to
    the values shown in the legend on the right side of the canvas.


    In this section, we have highlighted how to create an additive manufacturing setup
    with an MPBF printer. After orienting and supporting our components, we initiated
    a process simulation. We covered how to inquire about the print settings and how
    they are associated with the process simulation parameters. We selected a component
    and conducted a process simulation using it.


    In the next section, we will learn how to review the results of the process simulation
    and export the deformed and compensated versions of the component we simulated
    as STL or 3MF files.


    # Interpreting the results


    We ended the previous section by completing our first process simulation. In this
    section, we will focus on the various types of results Fusion 360 calculates when
    conducting a process simulation.'
  merge: -1
  img_proc: true
- pgno: 390
  md: 'As you can see in *Figure 13.12*, Fusion calculates and displays six result
    types for an MPBF process simulation. Once the analysis is done, the default result
    type we see is **Displacement**. However, I recommend taking a look at the **Structure
    Type** result after generating a mesh or completing the process simulation. This
    result type colors each element based on whether it represents a support structure,
    a part, or the build plate.


    Segments of the part that have a down skin without a support structure are colored
    red to represent under-constrained zones. Fusion also colors support structures
    that are discontinuous and the Z axis with unintended gaps as under-constrained
    elements. In such cases, you may want to go back to the process simulation setup
    and edit your mesh settings, in order to properly mesh your support structures
    or generate additional support structures before meshing/solving your model.


    ![](img/baa027bed101c08b496f1f420cee8a5b_390_0.png)


    Figure 13.12 – A structure type result for a process simulation


    After observing the structure type result, by using the dropdown next to the legend,
    you can switch back to the **Displacement** result. **Displacement** results can
    be further filtered down such that you can observe the deformation of your model
    in the **X**, **Y**, and **Z** axes. Alternatively, you can look at the magnitude
    of displacement. The legend and the color contour applied to the elements can
    be modified so that they are set to the global displacement result, or the local
    time step you’re observing. In *Figure 13.13*, we can see the displacement in
    **Z** at the final time step. You can switch the time step using the simulation
    player toggles, as highlighted in *Figure 13.12*.'
  merge: -1
  img_proc: true
- pgno: 391
  md: '![](img/baa027bed101c08b496f1f420cee8a5b_391_0.png)


    Figure 13.13 – The Displacement result type for a process simulation


    Alternatively, you can use the timeline at the bottom of the screen and drag the
    black vertical bar back and forth to switch to a different time step. Figure 13.14
    shows the Z displacement result of this simulation two steps from the last time
    step, as highlighted by callout 1.


    Process simulation results can also be scaled to exaggerate the deformed shape
    by a factor, as highlighted by callout 2. In the following screenshot, the scale
    factor is set to 20, which amplifies the displacement in order to show the direction
    of the deformation. The EDIT panel within the RESULTS tab lets us toggle element
    edges, allowing us to observe the results without the black lines displayed at
    the edge of each element. Using the same panel, you can also select Toggle Min/Max
    Probes so that you can be informed about the location of the node with the largest
    and smallest displacement at each time step. You can also use the Open Results
    Folder command to locate where all the simulation inputs and outputs are stored
    on your computer. This will also allow you to delete simulation result files if
    you need to clean up some space on your hard disk, as process simulation results
    can take up a lot of hard disk space.'
  merge: -1
  img_proc: true
- pgno: 392
  md: '![](img/baa027bed101c08b496f1f420cee8a5b_392_0.png)


    # Figure 13.14 – Switching time steps and modifying the scale factor


    The next result type we will highlight is the recoater clearance. During the printing
    process, as the laser moves over the powder, the metal powder melts and then solidifies.
    As the metal heats and cools during this cycle, it experiences thermally induced
    stresses. During the printing process, the layer that was just printed will experience
    deformations in the X, Y, and Z directions. If a given layer deforms in the positive
    Z axis an amount above the layer thickness we set within our print settings, our
    part will experience a recoater crash. Fusion 360 can predict such phenomena using
    process simulation. The recoater clearance percentage result type allows us to
    visualize how close our part is to the recoater blade during the printing process.
    A 100% clearance means our part is not experiencing any Z deformation at a given
    point. A 0% clearance means that our part is experiencing a Z deformation equivalent
    to the layer thickness. Fusion 360 displays the summary of this result for all
    layers in a single result type called **Global Recoater Clearance**, as shown
    in Figure 13.15. A clearance value above 100% refers to a given point experiencing
    a negative Z-direction deformation.'
  merge: -1
  img_proc: true
- pgno: 393
  md: '![](img/baa027bed101c08b496f1f420cee8a5b_393_0.png)


    Figure 13.15 – A Global recoater Clearance % result for process simulation


    As mentioned previously, Fusion calculates the recoater clearance percentage for
    each time step. You can visualize a simplified version of these results at each
    time step by switching your result type to **Local Recoater Risk**. This result
    type presents the recoater clearance percentage using a legend resembling a traffic
    light color contour of red, yellow, and green. Any recoater clearance above 80%
    is represented as **Low** risk for a recoater crash. If the recoater clearance
    is below 80% but above 40%, Fusion will highlight those elements as **Medium**
    risk for a recoater crash. Any clearance below 40% will be highlighted as **High**
    risk for a recoater crash and will be colored in red.'
  merge: -1
  img_proc: true
- pgno: 394
  md: '![](img/baa027bed101c08b496f1f420cee8a5b_394_0.png)


    Figure 13.16 – The Local recoater Risk result for a process simulation


    Fusion 360 also allows us to export the process simulation results as mesh files,
    as shown in Figure 13.17. By selecting the **Export Color 3MF** command within
    the **ACTIONS** panel of the **RESULTS** tab, we can extract a colorful mesh file
    of our results. A 3MF file can be utilized when creating simulation reports, using
    Microsoft Office tools such as Word or PowerPoint.


    ![](img/baa027bed101c08b496f1f420cee8a5b_394_1.png)


    Figure 13.17 – Exporting the results of a process simulation as a 3MF file with
    colors'
  merge: -1
  img_proc: true
- pgno: 395
  md: 'When we are done interrogating the results of the process simulation, we can
    simply select the **FINISH RESULTS** command from the **RESULTS** tab, which will
    close the results visualization and take us back to the **ADDITIVE** tab of the
    **MANUFACTURE** workspace.


    Later on, if we wanted to interrogate the results of a given study, we could select
    the study from the browser, as shown in Figure 13.18, and select the **View Results**
    command located within the **PROCESS SIMULATION** tab, as highlighted with callout
    1. Alternatively, we could right-click on the selected study within the browser
    and select the **View Results** command from the menu, as highlighted by callout
    2.


    ![](img/baa027bed101c08b496f1f420cee8a5b_395_0.png)


    Figure 13.18 – Accessing the results of a process simulation


    This action will take us back to the results visualization for the active process
    simulation study. Using the **RESULTS** tab, we can continue to probe our results
    or export a 3MF file to generate a report of our results.


    In this section, we highlighted how to utilize the **RESULTS** tab to inquire
    about the different result types for a process simulation. In the next section,
    we will explore how to generate a compensated model based on the process simulation
    results, in order to manufacture our parts with minimum deformations.'
  merge: -1
  img_proc: true
- pgno: 396
  md: '# Compensating for distortions and updating the setup


    We ended the previous section by exporting a 3MF file with colors so that we could
    generate interactive reports with Microsoft Word or PowerPoint. In this section,
    we will highlight how to export warped and compensated STL files out of our process
    simulation results, and how to create a new setup using the compensated shape.


    To get started, let’s go back to the process simulation results using the View
    Results command we covered in the last section. Once we are in the RESULTS tab,
    we can select Export Compensated STL and Export Warped STL within the ACTIONS
    panel, as shown in Figure 13.19.


    ![](img/baa027bed101c08b496f1f420cee8a5b_396_0.png)


    Figure 13.19 – Exporting the warped shape as an STL file


    Once we create the warped and compensated STL files, we can compare them using
    Fusion 360. As shown in Figure 13.20, we can create a new Fusion design document,
    which takes us back to the DESIGN workspace. Within this workspace, we can go
    to the MESH tab and insert both of these STL files into the same document. As
    shown in Figure 13.20, this will leave us with two mesh bodies in the browser,
    named L Bracket - Warped and L Bracket - Compensated. If we zoom in to the top-left
    corner while looking at the front view of the view cube, we can see that there
    is a visible difference between the warped shape and the compensated shape. If
    we were to print our part using the as-designed shape with the supports we have
    generated, the outcome from the printer would be close to the shape represented
    by the warped object, which is highlighted by the green-shaded mesh body in the
    following figure. Note that in this corner of our component, the warped mesh body
    deforms toward the positive X direction. The compensated shape Fusion 360 generated
    offsets for that distortion by creating a geometry that leans toward the negative
    X direction.'
  merge: -1
  img_proc: true
- pgno: 397
  md: '![](img/baa027bed101c08b496f1f420cee8a5b_397_0.png)


    Figure 13.20 – A superimposed view of the warped and compensated models


    We could also use the warped STL output in order to compare the simulation results
    to the printed distortions if we benchmarked the accuracy of the simulation results
    that Fusion 360 generates. After 3D printing our model, we can inspect the deformations
    using blue light scanning and compare the distorted shape we printed to the warped
    output that Fusion 360 predicted, checking the accuracy of the results we get
    using the PRM file we selected within the print settings for this study.


    The workflow I recommend using after conducting a process simulation is to select
    the **Export Compensated** command, located within the **EDIT** panel of the **RESULTS**
    tab, as shown in Figure 13.21.


    ![](img/baa027bed101c08b496f1f420cee8a5b_397_1.png)


    Figure 13.21 – Exporting the compensated shape to the manufacturing model'
  merge: -1
  img_proc: true
- pgno: 398
  md: 'Using this function, you can generate a mesh body of the compensated model
    and include it directly within the manufacturing model that was used to create
    the active additive setup, as shown in Figure 13.22. The same figure displays
    components 1, 2, and 3, using 50% opacity so that we can clearly see the new mesh
    body without any obstruction.


    ![](img/baa027bed101c08b496f1f420cee8a5b_398_0.png)


    Figure 13.22 – The compensated shape included in the manufacturing model


    At this point, we still need to do a few manual modifications to the manufacturing
    model so that we can create a setup using the compensated mesh body. First, we
    will select the manufacturing model, right-click, and edit it. Next, we will have
    to create a new component from the mesh body by right-clicking on it and selecting
    the Create Components from Bodies command, as shown in Figure 13.23. This action
    will generate a new component named Component 4, which includes the compensated
    mesh body. Now that we are done modifying the manufacturing model, we can select
    the FINISH EDIT command in the ribbon.'
  merge: -1
  img_proc: true
- pgno: 399
  md: '![](img/baa027bed101c08b496f1f420cee8a5b_399_0.png)


    Figure 13.23 – Creating a new component from the mesh body of the compensated
    shape


    In order to preserve our work in Setup1, we may want to duplicate it and create
    Setup1 (2), as shown in Figure 13.24. This way, we maintain our process simulation
    inputs and results that led us to the compensated shape. In the future, if we
    want to review our results or try conducting different simulations, we can simply
    use Setup1, which does not consider the newly created Component4.


    ![](img/baa027bed101c08b496f1f420cee8a5b_399_1.png)


    Figure 13.24 – Duplicating Setup1 to create Setup2'
  merge: -1
  img_proc: true
- pgno: 400
  md: 'Now that we have a new setup, we need to edit it and deselect components 1,
    2, and 3 so that we can select Component 4, as shown in Figure 13.25, in order
    to position and support it. We can accomplish this by right-clicking on Setup1
    (2) in the browser and selecting Edit to access the SETUP dialog.


    ![](img/baa027bed101c08b496f1f420cee8a5b_400_0.png)


    Figure 13.25 – Editing Setup1 (2) to select the compensated component


    Now that we have chosen Component 4 as the only component in Setup1 (2), we will
    have to go through the typical print preparation steps we have learned throughout
    this book. We can start by placing our parts within the build volume of our printer,
    using the Arrange command located in the POSITION panel of the ADDITIVE tab. Figure
    13.26 shows how to arrange the platform clearance of 3 millimeters, placing the
    part within the build area of our printer.'
  merge: -1
  img_proc: true
- pgno: 401
  md: '![](img/baa027bed101c08b496f1f420cee8a5b_401_0.png)


    # Figure 13.26 – Arranging the compensated part within the build volume


    The next item on our list is to create support structures for this component.
    Figure 13.27 shows how we can add volume supports to this component by selecting
    the appropriate support action within the SUPPORTS panel of the ADDITIVE tab.
    As we duplicated Setup1 to create Setup1 (2) early on in the process, all the
    volume supports that were used in Setup1 are still available in Setup1 (2). We
    need to either select and delete them or suppress them, as they will not participate
    in this setup.


    ![](img/baa027bed101c08b496f1f420cee8a5b_401_1.png)


    # Figure 13.27 – Applying volume support to the compensated model'
  merge: -1
  img_proc: true
- pgno: 402
  md: 'Once we have the compensated model positioned and properly supported, we can
    generate the additive toolpath and simulate it, as shown in Figure 13.28. Please
    remember that in order to generate the toolpath, you have to select the **Additive
    Toolpath** line item from the browser and use the **Generate** command within
    the **ACTIONS** panel of the **ADDITIVE** tab. After visualizing the additive
    toolpath layer by layer, if we are satisfied with the outcome, we can select **Create
    Machine Build File**, as shown in the following figure.


    ![](img/baa027bed101c08b496f1f420cee8a5b_402_0.png)


    Figure 13.28 – Simulating the additive toolpath and creating the machine build
    file


    In this example, generating the machine build file will allow us to create the
    necessary MTTF file for a Renishaw printer. As this file is generated using the
    compensated model, which was created after conducting a process simulation, the
    resulting 3D-printed part will have negligible deformation when compared to the
    as-designed CAD model.


    # Summary


    In this chapter, we focused on how to create a setup for an MPBF 3D printer and
    how to simulate the process using finite element analysis. The MPBF process is
    one of the most expensive 3D-printing technologies, both in capital expenditure
    and material cost. Process simulation helps us identify whether our additive setup
    will produce the desired outcome or not. If we are able to detect and remedy potential
    failures such as recoater blade crashes or large distortions before 3D printing,
    we can save a lot of time and money during the manufacturing phase.'
  merge: -1
  img_proc: true
- pgno: 403
  md: 'In the first section of this chapter, we focused on how to generate an additive
    setup with an MPBF machine and highlighted the various parameters within the print
    settings that control the process simulation input. We also showcased how to set
    up a process simulation study. We demonstrated how to define process conditions,
    such as build plate heating, and modify key inputs to the finite element analysis
    solver, such as mesh settings. We ended the section by conducting our first process
    simulation study.


    Then, we focused on the result types Fusion generates for an MPBF process simulation.
    We highlighted how to switch between various result types, such as structure type,
    displacement, recoater blade clearance, and recoater blade risk. We ended the
    section by exporting our results as a 3MF file with color data to be used to create
    reports.


    In the final section, we focused on how to export the warped and compensated models
    from the process simulation results. We showcased how to reimport the warped and
    compensated models back into Fusion to visualize the difference between them.
    We ended the chapter by demonstrating how to create a new setup using the compensated
    model, in order to 3D-print a part that will deform into the as-designed model.


    Using the practical knowledge you have gained in this chapter, you can feel more
    confident in simulating a metal additive manufacturing setup using Fusion 360,
    in order to identify potential print failures and compensate for distortions that
    are inherent in the MPBF printing process, achieving successful prints.


    In the next chapter, we will focus on how to automate repetitive tasks such as
    part orientation, part arrangement within a build volume, and support structure
    generation using presets, templates, and scripts.'
