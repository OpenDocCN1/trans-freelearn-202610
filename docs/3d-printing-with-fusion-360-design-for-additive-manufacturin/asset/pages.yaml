- pgno: 420
  md: 'Customizing machines within the machine library and selecting an associated
    print setting for your printer will speed up the creation of an additive setup.
    Customizing the user defaults will allow you to utilize the automatic orientation
    and additive arrange functionality with your preferences. Creating custom templates
    for orientation, arrangement, or support structures will enable you to create
    consistent additive setups, based on your machine''s print settings and materials,
    so that you eliminate any inconsistencies that may be introduced due to human
    error. In the next section, we will highlight how to automate the entire process
    using scripts so that we can completely eliminate any interaction with Fusion
    360''s MANUFACTURE workspace, in order to create an additive setup.


    # Automating additive workflows with scripting


    In the previous section, we covered how to save our preferences as user defaults
    and create templates while generating an additive setup, in order to reapply those
    templates to subsequent additive setups.


    Using these techniques will minimize our interaction with the user interface of
    Fusion 360 and help us eliminate inconsistencies between each setup. We can take
    this concept to the next level by utilizing scripts, eliminating our interaction
    with Fusion 360''s MANUFACTURE workspace entirely.


    If we consistently use the same type of machines, print settings, part orientation
    and arrangement options, and support structure settings, we can benefit from utilizing
    a custom script to automate the entire workflow. As mentioned in the first section
    of this chapter, we can access the Scripts and Add-Ins command within the ADD-INS
    panel of the UTILITIES tab, as shown by callout 1 in Figure 14.16. The Scripts
    tab within the Scripts and Add-Ins dialog lists several Python and C++ based sample
    scripts that you can execute to automate certain workflows, as indicated by callout
    2. After selecting a certain script, you can expand the Details section, as indicated
    by callout 3, to read more about what that script does and inspect its installation
    path.'
  merge: -1
  img_proc: true
- pgno: 421
  md: '![](img/baa027bed101c08b496f1f420cee8a5b_421_0.png)


    # Figure 14.16 – Sample scripts included with Fusion 360


    If you want to create your own Python script or edit an existing one, you will
    need to download Visual Studio Code in order to edit or debug a given script.
    If you do not have Visual Studio Code software installed on your computer, after
    selecting a script and pressing Edit, Fusion will display the Download Visual
    Studio Code dialog, as shown in Figure 14.17. If you select OK, it will automatically
    download and install the Visual Studio Code software from Microsoft.


    ![](img/baa027bed101c08b496f1f420cee8a5b_421_1.png)


    # Figure 14.17 – Downloading and installing Visual Studio Code to edit and debug
    Python-based scripts'
  merge: -1
  img_proc: true
- pgno: 422
  md: 'Fusion 360 has a rich **application programming interface (API)**, which allows
    you to customize software by creating your own scripts and add-ons. The apps we
    covered in the first section of this chapter, which we downloaded from the Autodesk
    App Store, were all created using Fusion’s API to automate certain workflows.
    If you find yourself in a position where you have an idea of how to automate a
    certain workflow but an app does not exist for it, you can create your own scripts
    or apps. To learn more about scripting for Fusion 360, refer to the Fusion 360
    API documentation at the following link: https://help.autodesk.com/view/Fusion360/ENU/?guid=GUID-A92A4B10-3781-4925-94C6-47DA85A4F65A.
    This link has the complete product documentation for the Fusion API and is shown
    in Figure 14.18:


    ![](img/baa027bed101c08b496f1f420cee8a5b_422_0.png)


    Figure 14.18 – Online documentation for the Fusion 360 API


    Within this web page, if you scroll down and navigate to the **Sample Programs**
    section, as indicated by callout 1 of Figure 14.19, you will be able to locate
    the **CAM** section. After expanding the **CAM** heading, as shown by callout
    2, you will find **Additive Manufacturing API Sample** within the **General**
    folder, as shown by callout 3. This page includes a Python-based code sample,
    which automatically creates an additive setup with an FFF printer and an appropriate
    print setting. In order to use this code sample, you will first need to copy the
    Python code. Select the **Copy Code** command, as indicated by callout 4 in Figure
    14.19.'
  merge: -1
  img_proc: true
- pgno: 423
  md: '![](img/baa027bed101c08b496f1f420cee8a5b_423_0.png)


    # Figure 14.19 – Locating the additive manufacturing API sample


    Within the Scripts and Add-Ins dialog of Fusion, you can select the + icon next
    to My Scripts to create a new script. This action will populate the Create New
    Script or Add-In dialog, as shown in Figure 14.20. In this example, we will create
    a Python-based script, so we have to select the radio buttons for Script and Python.
    We will have to give our script a new name; let''s use FFF Setup. Then, we can
    enter a description. We can also enter our name into the Author field and define
    the folder location where the Python script file will be saved. After entering
    all the necessary information, click the Create button to generate an empty Python
    script.'
  merge: -1
  img_proc: true
- pgno: 424
  md: '![](img/baa027bed101c08b496f1f420cee8a5b_424_0.png)


