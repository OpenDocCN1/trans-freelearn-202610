- pgno: 31
  md: 'Once the data panel is visible, you can navigate to the team and project where
    you wish to upload your design data. Once in the appropriate project, you can
    create new folders to organize your designs and documents further. Once you are
    in the desired project/folder location, you can use the Upload button, as shown
    in Figure 1.8, and select or drag and drop files to the upload dialog that is
    on your screen. Either option will allow you to upload multiple CAD or mesh files
    to the designated team/project/folder location. Please note that each uploaded
    file will become its own Fusion design document.


    ![](img/baa027bed101c08b496f1f420cee8a5b_31_0.png)


    Figure 1.8 – Uploading multiple Mesh and CAD documents to Fusion 360 using the
    Data Panel


    This is a great option to upload multiple CAD models to Fusion 360. However, just
    like the previous option, you will have to turn on Capture Design History if you
    want to store your edits in the timeline, as shown in Figure 1.6. And just like
    the previous option, this method is not one I would recommend opening STL or OBJ
    files, as it does not give you initial control over units of part placement during
    the import process.


    Another lesser known but rather useful option is based on the Fusion 360 mobile
    app. If you have a mobile device, you can download the Fusion 360 app from the
    relevant app store, and you can browse for and upload CAD or Mesh files stored
    on your phone or tablet, as shown in Figure 1.9:'
