- pgno: 53
  md: '# Editing CAD/Mesh Files with DFAM Principles in Mind


    Welcome to *Chapter 2*. In this chapter, we will cover how to edit CAD/Mesh models
    with various **Design for Additive Manufacturing** (**DFAM**) principles in mind.
    We will start by highlighting how to switch on/off the design history. We will
    demonstrate the differences in workflow when using parametric versus direct modeling.
    We will then demonstrate how to automatically detect features for imported CAD
    models. Then, we will go over how to edit both CAD and mesh bodies based on DFAM
    principles. We will conclude the chapter by showcasing how to convert mesh files
    into solid bodies that can be further modified for manufacturing.


    In this chapter, we will cover the following topics:


    +   - Introduction to design history with Fusion 360

    +   - Recognizing CAD features and editing them

    +   - Working with Mesh files natively in Fusion 360


    By the end of this chapter, you will have learned how to work with models using
    parametric and direct modeling workflows in Fusion 360. You will be able to automatically
    recognize CAD features and edit them. You will also know how to edit CAD/mesh
    geometry imported from other sources using Design for Additive Manufacturing principles.


    # Technical requirements


    Most of the topics covered in this chapter are applicable to all licensing levels
    (personal/hobby, startup, educational, and commercial) of Fusion 360. However,
    the book will also cover advanced functionality not available to personal/hobby
    use licenses. Such advanced functionality will be identified as *N/A for Personal
    Use and Requires Access to Extension* as appropriate.


    The lesson files for this chapter can be found here: https://github.com/PacktPublishing/3D-Printing-with-Fusion-360.'
  merge: -1
  img_proc: true
- pgno: 54
  md: '# Introduction to design history with Fusion 360


    In Chapter 1, we briefly touched on how Fusion 360 can capture the design history
    of model changes. In this chapter, we will dig a little deeper into this topic
    and showcase some of the benefits and drawbacks of capturing design history (parametric
    modeling) versus not capturing design history (direct modeling).


    In the context of Fusion 360, Parametric Modeling is a methodology based on features
    and constraints. All features you add to a model are captured over time and any
    changes you make to a given feature propagate downstream in your timeline and
    impact the subsequent features and ultimately the final outcome of your design.
    This makes parametric modeling a powerful tool for creating design alternatives
    based on rules.


    In contrast, direct modeling is a methodology where the features you add to your
    model are not all stored or editable. A subset of direct modeling features can
    be edited. However, those features do not interact with any feature you may have
    added prior to or after the one you are editing. This makes direct modeling a
    very flexible tool for quickly making drastic changes to a design. With direct
    modeling, you don''t have to worry about any issues a given change might cause,
    based on how your model was originally designed in the CAD software.


    When generating a new design, Fusion 360 relies on the setting designated in the
    Design History option within the Preferences dialog, as shown in Figure 2.1, to
    determine whether the design will utilize Parametric or Direct modeling methods.


    ![](img/baa027bed101c08b496f1f420cee8a5b_54_0.png)


    Figure 2.1 – Fusion 360''s preferences for capturing design history'
  merge: -1
  img_proc: true
- pgno: 55
  md: 'When working on an existing Fusion 360 Design, we also have the option to change
    our minds and utilize direct modeling instead of parametric modeling at any point
    in time. We have two ways we can use to change from Parametric modeling to Direct
    modeling. The first way to switch from parametric modeling to direct modeling
    is by right-clicking the first item on the browser and selecting **Do not capture
    design history**. The second way to switch is by selecting the gear icon in the
    right corner of the Fusion 360 timeline and selecting **Do not capture design
    history** from the list of available options. Both methods are shown in Figure
    2.2.


    **Important note**

    If you switch from parametric modeling to direct modeling by mistake, you can
    always undo your actions (Ctrl + Z) and get back your timeline.


    ![](img/baa027bed101c08b496f1f420cee8a5b_55_0.png)


    Figure 2.2 – Changing a parametric model to a direct model


    Regardless of the method you use, when switching from parametric modeling to direct
    modeling, the timeline of your features will be lost, the timeline bar will be
    invisible, and you will lose the constraints and references between the features
    you used to create your design. Figure 2.3 shows the impact of switching from
    parametric modeling to direct modeling. Notice how the figure on the left has
    a timeline bar at the bottom. The timeline bar shows how the parametric modeling
    methodology was used to create this part. All the listed features have the dimensions
    and references used when generating them.'
  merge: -1
  img_proc: true
- pgno: 56
  md: '![](img/baa027bed101c08b496f1f420cee8a5b_56_0.png)


    Figure 2.3 – Impact of switching from parametric modeling to direct modeling


    After switching to the direct modeling methodology, the timeline bar is lost.
    The model now has a list of selectable features; some of them (for example, **Fillet**
    and **Hole**) are even editable. However, if you edit such a feature, you will
    see that the references will not be saved with the feature. With every subsequent
    edit, you will be able to redefine those references. In other words, features
    are not constrained and can be freely moved around, even after being defined explicitly.


    # Parametric Modeling


    Fusion 360 has several pieces of functionality that are only accessible when you
    are in parametric modeling mode. The most obvious one is the fact that you can
    define, use, and edit parameters that control inputs for features. *Figure 2.4*
    shows how a list of named and user-defined parameters were utilized in the creation
    of this model. If you are making drastic changes to your component and/or assemblies,
    you may need to utilize the **Compute All** command to resolve any issues in the
    timeline. Just like the **Change parameters** command, the **Compute All** command
    is only available when you are working within the parametric modeling paradigm.
    Both commands can be found in the **MODIFY** panel, as shown in *Figure 2.4*.'
  merge: -1
  img_proc: true
- pgno: 57
  md: '![](img/baa027bed101c08b496f1f420cee8a5b_57_0.png)


    Figure 2.4 – Change Parameters, Compute All, and Automated Modeling commands


    Another critical piece of functionality that is unique to Fusion 360’s Parametric
    modeling toolset is **Automated Modeling**, located in the **AUTOMATE** tab, as
    shown in *Figure 2.4*. **Automated Modeling** connects disjointed faces within
    a Fusion 360 design and creates multiple alternative bodies/components you can
    choose from. We will cover **Automated Modeling** in detail in *Chapter 3.*


    There are three simplification features (**Simplify**, **Remove Faces**, and **Replace
    with Primitive**) that you can only utilize when you are in Parametric modeling
    mode. But you have alternative commands you can use when in direct modeling mode
    to achieve similar outcomes. In Parametric modeling, you can access these three
    from the **MODIFY** panel | the **Simplify** slide-out menu, as shown in *Figure
    2.5.*'
  merge: -1
  img_proc: true
- pgno: 58
  md: '![](img/baa027bed101c08b496f1f420cee8a5b_58_0.png)


    Figure 2.5 – Simplify functions available with the Parametric modeling method


    Unlike most other parametric modeling functions, these three are not editable
    once used. If you use them, you will have to roll back the timeline or delete
    the feature from the timeline in order to undo their effect, as shown in Figure
    2.6:


    ![](img/baa027bed101c08b496f1f420cee8a5b_58_1.png)


    Figure 2.6 – Deleting a Replace with Primitives feature referenced by a Sketch'
  merge: -1
  img_proc: true
- pgno: 59
  md: 'Whenever you are in parametric modeling mode and you delete features (or bodies
    or components) in the middle of a timeline, you run the risk of breaking the timeline
    continuity. If you delete an item from the timeline that is used by other items
    as a reference, you will be left with missing reference warnings. In the example
    shown in Figure 2.7, once the **Replace with Primitives** feature is deleted from
    the timeline, we are left with a yellow highlighted timeline icon for the **Sketch**
    feature, which used the top face of the now-deleted simplified primitive body.


    ![](img/baa027bed101c08b496f1f420cee8a5b_59_0.png)


    Figure 2.7 – Reference failure warnings in the timeline after deleting a referenced
    feature


    Having a component with reference failure warning messages is generally not a
    desirable outcome as we may not be able to replay the timeline or compute all
    changes effectively. Features with such warnings will require additional work
    to reestablish lost references. Therefore, you may choose to avoid using these
    three features altogether. As shown in Figure 2.8, you can disable **Arrange and
    Simplify tools** within Fusion 360''s **Preferences**, by navigating to the **General**
    pull-down menu | the **Design** subsection.'
  merge: -1
  img_proc: true
- pgno: 60
  md: '![](img/baa027bed101c08b496f1f420cee8a5b_60_0.png)


    Figure 2.8 – Enable/disable simplify tools within Fusion 360''s Preferences


    As we just illustrated, using the Delete command can create unforeseen consequences
    when we are in parametric modeling mode. There are two alternatives to the Delete
    command you can use to eliminate unwanted features of bodies. They are the Suppress
    Features command and the Remove command. Both are unique to Parametric modeling
    and are my personal preferred way to exclude features and models from Fusion 360
    design documents without breaking the timeline.


    As shown in Figure 2.9, the Remove command eliminates bodies and components and
    can be accessed by selecting its input and using the right-click menu. Figure
    2.9 also shows the Suppress Features command, which allows us to exclude features
    from the model and can be accessed by selecting its input from the timeline and
    using the right-click menu.'
  merge: -1
  img_proc: true
- pgno: 61
  md: '![](img/baa027bed101c08b496f1f420cee8a5b_61_0.png)


    Figure 2.9 – The Remove command and Suppress Features


    The final unique set of features for parametric modeling requires access to the
    Product Design extension. Fusion 360 offers several extensions to trial users,
    educational users, startup users, and commercial users. Extensions are not available
    to free, personal, or hobbyist users. Depending on your subscription type, you
    can gain access to extensions within the Extensions dialog, as shown in Figure
    2.10.


    ![](img/baa027bed101c08b496f1f420cee8a5b_61_1.png)


    Figure 2.10 – Extensions dialog and Product Design extension access'
  merge: -1
  img_proc: true
- pgno: 62
  md: 'Once you gain access to the **Product Design** extension, you can assign and
    edit plastic rules to components within the plastic tab''s setup panel. As shown
    in *Figure 2.11*, assigning a plastic rule to a given component automatically
    adds a handful of parameters to Fusion 360''s Parameter table, which controls
    settings such as **Thickness**, **Draft Angle**, **Nominal Radius**, and **Knife
    Edge Threshold**.


    ![](img/baa027bed101c08b496f1f420cee8a5b_62_0.png)


    Figure 2.11 – Assigning a plastic rule to a component


    After assigning a plastic rule to a given component, any plastic feature that
    you add to that component automatically utilizes parameters set by the plastic
    rule. In *Figure 2.12*, we can see a shelled version of our design with added
    webs. The **Web** feature is not unique to parametric modeling. But it is currently
    utilizing a preset named **Feature Values**, which automatically assigns a parameter
    named **T** for **thickness** and **DA** for **draft angle**. It also uses an
    equation based on the thickness parameter for the fillet radius. All these parameters
    and the feature preset are based on the plastic rule we assigned in the previous
    step. Therefore, these modeling techniques are all dependent on using the parametric
    modeling methodology.'
  merge: -1
  img_proc: true
- pgno: 63
  md: '![](img/baa027bed101c08b496f1f420cee8a5b_63_0.png)


    Figure 2.12 – Creating/editing a Web feature using a plastic rule


    The final feature I want to highlight, which is unique to the parametric modeling
    methodology, is **Geometric Pattern**. You can access **Geometric Pattern** from
    the **CREATE | Pattern** slide-out menu. Figure 2.13 shows the outcome of a geometric
    pattern applied to a face on our model. Using this feature, you can parametrically
    create a modeled surface texture with ease. Just like the plastic rule and feature
    presets, **Geometric Pattern** also requires access to the Product Design extension.


    ![](img/baa027bed101c08b496f1f420cee8a5b_63_1.png)


    Figure 2.13 – Creating/editing a geometric pattern'
  merge: -1
  img_proc: true
- pgno: 64
  md: '# Direct modeling


    Fusion 360 has several pieces of functionality that are only accessible when you
    are in Direct modeling mode. Some of this functionality is specific to working
    with mesh bodies. Some of it is related to working with Solid and Surface bodies
    and some of it is related to working with components within an assembly.


    Let''s start by covering the Mesh-specific functionality. The first mesh functionality
    specific to direct modeling is **CREATE FACE GROUP**, located under the **MESH**
    tab | the **PREPARE** panel. Using **CREATE FACE GROUP**, you can select individual
    triangles or a group of them and assign them to a new face group. The creation
    of face groups is crucial in order to select them downstream during additive manufacturing
    workflows for support structure creation or when attempting to convert mesh bodies
    into solid objects. Even though Fusion 360 has tools for generating face groups
    automatically, having manual control over creating face groups is an important
    piece of functionality when dealing with complex inserted meshes. You can use
    this functionality as a part of direct modeling.


    > **Important note**

    > In parametric modeling, you will need to utilize the **DIRECT EDIT** feature
    to be able to create face groups manually. All the mesh-specific functionality
    we are highlighting in this subsection can be accessed by introducing the same
    direct edit feature within parametric modeling.


    The next mesh-specific functionality for direct modeling is **ERASE AND FILL**.
    This command is located under the **MODIFY** panel and allows you to remove and
    replace one or more faces on your mesh body to manually fill holes and repair
    regions. When using this command, I also recommend turning on **MESH SELECTION
    PALETTE** so you can utilize different selection types, such as the paintbrush
    or free-form selection. If you''re using the paint selection, you can also control
    the brush size. The **Mesh Palette** is accessible from the **SELECT** panel,
    as shown in *Figure 2.14*.'
  merge: -1
  img_proc: true
- pgno: 65
  md: '![](img/baa027bed101c08b496f1f420cee8a5b_65_0.png)


    Figure 2.14 – Mesh selection palette and mesh selection tools


    Now, let’s start focusing on solid and surface body-specific features that are
    unique to direct modeling. The first feature we will highlight is generally applicable
    to solid and surface bodies converted from mesh bodies using the faceted method.
    We will cover how to convert mesh bodies into solid bodies later in this chapter
    when we talk about working with Mesh files natively in Fusion 360. Once a mesh
    body is converted into a solid body using the faceted method, it will have a large
    number of surfaces, which will make the design difficult to work with due to its
    file size and model complexity. It is generally a good idea to simplify such models
    in order to further edit them or use them in an assembly. In such cases, we can
    rely on the MERGE feature, located within the SURFACE tab | the MODIFY dropdown.
    This feature will allow you to combine two or more faces within a solid or surface
    body into a single face. If the Select Chain checkbox is activated, you can simply
    double-click on a single face and Fusion 360 will automatically select all faces
    that are connected to the face you have selected that are coplanar, as shown in
    Figure 2.15.'
  merge: -1
  img_proc: true
- pgno: 66
  md: '![](img/baa027bed101c08b496f1f420cee8a5b_66_0.png)


    Figure 2.15 – Merge planar faces to create a single face


    After pressing **OK** on the **MERGE** dialog, all the selected faceted faces
    will be replaced with a single face, reducing the model complexity and file size.
    However, it is important to note that if you select multiple faces that are not
    coplanar, such as faces that make up a fillet, the result will be a single face
    that is not a true representation of the intended feature, but rather a wavey
    version of the desired outcome. As shown in *Figure 2.16*, you can easily double-check
    the outcome of a **MERGE** feature using various inspection tools, such as **Zebra
    Analysis**. This tool shows how light would reflect off a given surface to display
    the changing curvature on a given surface. In *Figure 2.16*, you can easily see
    the difference between the stripes on the original CAD solid model on the left
    versus the stripes on the faceted version on the right, which utilize the **MERGE**
    feature to combine multiple faces into one around the fillet.'
  merge: -1
  img_proc: true
- pgno: 67
  md: '![](img/baa027bed101c08b496f1f420cee8a5b_67_0.png)


    Figure 2.16 – Inspect merged faces using Zebra Analysis


    The next feature we will highlight is **Fluid Volume**. This command, as well
    as the **Find Features** command, which we will cover next, is located in the
    **SOLID** tab | the **CREATE** panel, as shown in *Figure 2.17*.


    ![](img/baa027bed101c08b496f1f420cee8a5b_67_1.png)


    Figure 2.17 – Find Features and Fluid Volume commands'
  merge: -1
  img_proc: true
- pgno: 68
  md: 'You can create internal or external fluid volumes based on the type of solid
    body you are working with. Figure 2.18 shows how you can create an external volume
    for a chess piece. After creating an external fluid volume, if you inspect your
    model with a section analysis, you will notice that the newly created external
    volume surrounds the chess pawn and does not interfere with the imported CAD body.
    Using this technique, you can quickly create a model that you can use to 3D-print
    a mold. You can use this newly created component as a starting point for creating
    the core. In this example, the desired outcome is a chess pawn. Therefore, we
    first create the cavity. Later, we can split this new component in half depending
    on how we will pull the mold apart. We can later add a pour basin and sprue before
    3D-printing it. The GitHub repository for Chapter 2 contains a CHESSPAWN.STEP
    file for you to try using this direct modeling feature. A finished version of
    the mold with two pulls with connector pins, as well as a pour basin and a sprue,
    is also provided (CHESSPAWNMOLD.STEP).


    ![](img/baa027bed101c08b496f1f420cee8a5b_68_0.png)


    Figure 2.18 – Creating an external fluid volume for a component


    In certain cases, we may have a CAD file for the mold itself and want to reverse-engineer
    the part and make changes so we can make sure it fits our requirements, such as
    size or aesthetics. In such cases, we could easily use the Fluid Volume tool and
    create an internal volume. Figure 2.19 shows how you can create an internal fluid
    volume for a mold with two solid pulls and capping surfaces located at the top
    of the pour basin.'
  merge: -1
  img_proc: true
- pgno: 69
  md: '![](img/baa027bed101c08b496f1f420cee8a5b_69_0.png)


    Figure 2.19 – Creating an internal fluid volume for a component


    Notice that in this case, you will end up with one new component with seven bodies.
    The Internal volume option within the Fluid Volume command fills all possible
    cavities, including the tolerances between the pins and holes. If you do not need
    those extra solids, you can select, right-click, and delete them, as shown on
    the left half of Figure 2.20. Similarly, using the rectangle select tool, you
    can select all surfaces that make up the pour basin and sprue, right-click, and
    delete them, shown on the right-hand side of Figure 2.20.


    ![](img/baa027bed101c08b496f1f420cee8a5b_69_1.png)


    ![](img/baa027bed101c08b496f1f420cee8a5b_69_2.png)


    Figure 2.20 – Selecting and deleting bodies and faces'
  merge: -1
  img_proc: true
- pgno: 70
  md: '# Important note


    You may have noticed the similarity between the external fluid volume we can create
    with direct modeling and the simplify command we covered in the previous subsection
    related to parametric modeling. The underlying functionality between these two
    features is the same. However, as previously discussed, the SIMPLIFY feature is
    not entirely parametric and therefore could create issues when used in parametric
    modeling.


    The next function, unique to direct modeling when working with imported CAD geometry,
    is one of my favorite features in Fusion 360. It is called FIND FEATURES and is
    in the SOLID tab | the CREATE panel. It allows you to select faces, bodies, or
    components and automatically recognize critical features, such as fillets, holes,
    chamfers, and patterns. After you use the find features command, and recognize
    a critical feature such as a fillet, it will show up in Fusion 360’s browser with
    its designated name. You will be able to select the feature, right-click, and
    edit it. Depending on the position of the feature, you can easily change the dimensions
    of a given feature or completely delete it. We will cover how to use this command
    more effectively in the next section.


    Direct modeling, as its name suggests, is not a parametric method for creating
    and editing geometry. Many of the modeling tools, such as fillet, hole, and pattern,
    have different behaviors during creation versus editing. Any feature you add to
    a solid model utilizes the exact same user interface as its counterpart from parametric
    modeling. The Fillet feature is a great example of this. In Figure 2.21, we are
    showing the application of a fillet to multiple edges.


    ![](img/baa027bed101c08b496f1f420cee8a5b_70_0.png)


    Figure 2.21 – Creating the Fillet feature in Direct modeling'
