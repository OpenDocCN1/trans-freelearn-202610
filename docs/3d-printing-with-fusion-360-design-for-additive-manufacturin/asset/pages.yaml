  md: '# Part 2:

    Print Preparation –

    Creating an Additive Setup


    In this part, we will show you how to get started with print preparation. There
    are two methods you can utilize during print preparation while working with models
    created/modified with Autodesk Fusion. First, we will highlight how to tessellate
    models and export them to external software, in order to slice them for 3D printing.
    Then, we will showcase how to prepare our models additive manufacturing using
    Autodesk Fusion as the slicer. We will discuss the various ways you can use the
    **DESIGN** and **MANUFACTURE** workspaces to aggregate your models for print preparation.
    Finally, we will create our first additive setup using Fusion within the **MANUFACTURE**
    workspace.


    This part has the following chapters:


    +   - *Chapter 5, Tessellating Models and Exporting Mesh Files to Third-Party
    Slicers*

    +   - *Chapter 6, Introducing the Manufacture Workspace for Print Preparation*

    +   - *Chapter 7, Creating Your First Additive Setup*'
