    ![](img/baa027bed101c08b496f1f420cee8a5b_355_0.png)


    Figure 12.6 – Additive setup with a Digital Metal PX100 printer


    In this section, we highlighted how to create setups for three of the four additive
    manufacturing technologies available within Fusion 360 to 3D print with metals.
    We covered how you can 3D print with metal with printers from UltiMaker and Raise3D.
    We also highlighted how you can customize your existing FFF printers and 3D print
    with filament from vendors such as The Virtual Foundry. In addition to FFF, we
    showcased how to utilize DED as well as Binder Jetting technologies with Fusion
    360 to create additive setups for metal 3D printing. Both the FFF and Binder Jetting
    technologies require additional post-processing steps, such as sintering, to generate
