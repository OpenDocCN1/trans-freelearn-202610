- pgno: 209
  md: '# Creating Your First Additive Setup


    Welcome to Chapter 7. In previous chapters, we covered how to create and modify
    models for 3D printing. Now, we can start to go over how to set up a 3D print
    using Fusion 360. Before we can walk over to our 3D printer and press print, we
    need to define the process digitally on our slicer, which in this chapter will
    be Fusion 360. 3D printing using Fusion 360 can be as simple as pressing a single
    button if we first take the time to define mission-critical information, such
    as which printer we will be using and which material we will be printing with.
    In this chapter, we will dig a little deeper into how to use Fusion 360 effectively,
    so we can understand how the machine and print settings libraries work together
    to help us create an additive setup, so that we can go from a digital design to
    additive manufacturing.


    In Fusion 360, a critical first step for 3D printing is to create an additive
    manufacturing setup. This simple yet powerful dialog includes several inputs for
    selecting our 3D printer, our desired material, and the print settings for that
    material. Understanding how to use Fusion’s libraries and creating custom libraries
    with our 3D printers and print settings will benefit us greatly. In this chapter,
    we will also highlight various Fusion 360 preferences related to 3D printing,
    which will improve your experience and save you time.


    In this chapter, we will cover the following topics:


    +   - Fusion 360 preferences and settings for 3D printing

    +   - Machine selection and creating an additive setup

    +   - Print Settings and creating an additive setup


    By the end of the first section, you will know how to locate and utilize various
    Fusion 360 preferences related to 3D printing. In the next section, you will learn
    where to locate your specific 3D printer digitally within the various machine
    libraries included with Fusion 360. By the end of the chapter, you will know how
    to copy, edit, and further manage your 3D printer and print settings from Fusion
    360’s libraries to your own library. In addition, you will have learned how to
    assign a printer and print settings to an additive setup. You will also be exposed
    to various print settings based on different 3D printing strategies and will learn
    how to edit them.'
  merge: -1
  img_proc: true
- pgno: 210
  md: '# Technical requirements


    All of the topics covered in this chapter are accessible to the personal, trial,
    commercial, startup, and educational Fusion 360 license types.


    There are certain Fusion 360 additive machines, such as the metal powder bed Fusion
    (MPBF) 3D printers, that are not available until you gain access to the Additive
    Build Extension. As with all other Fusion 360 extensions, the Additive Build Extension
    is not available for personal use. As we will not cover topics specific to metal
    3D printing in this chapter, you should be able to follow along with all the examples
    in this chapter with no issues.


    If you have a commercial license for Fusion 360, you will also need access to
    the Additive Build Extension (https://www.autodesk.com/products/Fusion-360/additive-build-extension)
    to create an additive setup with an MPBF machine.


    Autodesk offers a 14-day trial for the Additive Build Extension for all commercial
    users of Fusion 360. You can activate your trial within the extensions dialog
    of Fusion 360.


    The lesson files for this chapter can be found here: https://github.com/PacktPublishing/3D-Printing-with-Fusion-360.


    # Fusion 360 preferences and settings for 3D printing


    Fusion 360 is a feature-rich software for computer-aided design, simulation, and
    manufacturing. As such, it has numerous preferences and settings that can be customized
    to fit your specific workflow. In this book, we are mostly focusing on using Fusion
    360 for additive manufacturing. We already touched on some of the basic preferences,
    such as how to set the default units and the ability to capture design history
    versus design using direct modeling, back in Chapter 1. In this chapter, we will
    dig a bit deeper and go over all the settings and preferences as well as some
    preview features that are available for improving our workflow for additive manufacturing.


    We can start to simplify our use of Fusion 360 for additive manufacturing by accessing
    the Preferences dialog by selecting the Avatar icon in the top-right corner of
    the user interface as shown in Figure 7.1. The Preferences dialog has a browser
    on the left-hand side. By selecting the first entry, named General, we can access
    the preferences controlling the general user interface behavior. Figure 7.1 shows
    how to set the default modeling orientation to Z up, which we covered in detail
    in Chapter 1:'
  merge: -1
  img_proc: true
- pgno: 211
  md: '![](img/baa027bed101c08b496f1f420cee8a5b_211_0.png)


    Figure 7.1 – Setting the default model orientation using the Preferences dialog


    Under the **General** dropdown within the **Preferences** dialog, if we switch
    to the line item named **Manufacture**, we can access preferences that control
    the behavior of the user interface within the **Manufacture** workspace. As you
    may recall, we introduced the **Manufacture** workspace in *Chapter 6* and used
    it to make model modifications using manufacturing models. Figure 7.2 shows how
    to use **Enable Cloud Libraries** to save and select things such as our 3D printers
    and print settings to the active Fusion Team. We can also set the user interface
    such that every time we access the **Manufacture** workspace, we will automatically
    be taken to the **ADDITIVE** tab. If we scroll down within the preferences that
    control the behavior in the **Manufacture** workspace, we can also see settings
    specific to additive manufacturing, such as options that can automatically generate
    support, automatic orientations, and additive toolpaths upon the creation of the
    function or an additive setup. We will not be changing the default settings for
    those three options as the default preferences work well for additive manufacturing.
    In the future, as you customize Fusion 360, you may need to refer back to those
    settings and modify them as needed. For example, if you always print parts without
    needing support structures, you can activate **Generate Additive Toolpath on Setup
    creation** and Fusion 360 will automatically create the slices and the toolpath
    without waiting for your explicit command:'
  merge: -1
  img_proc: true
- pgno: 212
  md: '![](img/baa027bed101c08b496f1f420cee8a5b_212_0.png)


    Figure 7.2 – Fusion 360 preferences specific to the Manufacture workspace


    Another important preference I would like to highlight can be found under the
    **API** section of the **Preferences** dialog. In the preferences for scripting
    and programming, Fusion 360 shows **Default Path for Scripts and Add-Ins** as
    shown in *Figure 7.3*. We will not be changing this path in this chapter. However,
    seeing this path gives us a clear indication of where Fusion 360 saves custom
    assets, such as machine files and print setting files and posts. As highlighted
    in *Figure 7.3*, any machine or print setting file you save into your local folder
    automatically gets stored in your user profile within the `AppData\Roaming\Autodesk\`
    folder within the appropriate subfolder, such as `machines` or `PrintSettings`.'
  merge: -1
  img_proc: true
- pgno: 213
  md: '![](img/baa027bed101c08b496f1f420cee8a5b_213_0.png)


    ![](img/baa027bed101c08b496f1f420cee8a5b_213_1.png)


    ![](img/baa027bed101c08b496f1f420cee8a5b_213_2.png)


    Figure 7.3 – Default Path for Scripts and Add-Ins indicates where Fusion 360 saves
    machine and print settings files'
  merge: -1
  img_proc: true
- pgno: 214
  md: 'The final preference I would like to highlight is accessible within the Preview
    Features section of the Preferences dialog. As shown in Figure 7.4, by using this
    option, we can see a Preferences to try Preview Functionality dialog. If we set
    our filter to Manufacture, we can turn on several pre-release functionalities
    that Fusion 360 offers its users before they become a part of a regular release.


    ![](img/baa027bed101c08b496f1f420cee8a5b_214_0.png)


    Figure 7.4 – Manufacturing-related preview features within the Preferences dialog


    Once we have all the preferences set, as shown in the previous figures, we can
    select OK and proceed to modify our settings for the Manufacture workspace. In
    order to make changes to the Manufacture workspace, we can simply open a new Fusion
    360 design document and switch to the Manufacture workspace using the workspace
    switcher located in the top-left portion of Fusion 360’s user interface. When
    we are in the Manufacture workspace, using the navigation bar located in the bottom-center
    portion of the canvas, we can change settings, such as the display effects, and
    turn off the ground plane, as shown in Figure 7.5. The reason why we may want
    to turn off the ground plane is that sometimes the ground plane may be above or
    below the build platform of our 3D printer and could create a crowded display,
    blocking our view while we are working on our additive setup.'
  merge: -1
  img_proc: true
- pgno: 215
  md: '![](img/baa027bed101c08b496f1f420cee8a5b_215_0.png)


    Figure 7.5 – Display- and visibility-related settings for the Manufacture workspace


    Another setting I suggest changing while working on additive setups is the synchronization
    of the visibility. I recommend setting **Sync visibility with active setup** using
    the navigation bar at the bottom of Fusion 360’s user interface within the **Manufacture**
    workspace as shown in Figure 7.5. When this setting is active, Fusion 360 will
    automatically hide components that do not participate in the active additive setup.


    In this section, we covered various settings and preferences that will help us
    while creating and working with additive setups within the **Manufacture** workspace
    of Fusion 360. In the next section, we will focus on creating an additive setup
    and selecting a 3D printer for that setup.


    # Machine selection and creating an additive setup


    Now that we have customized Fusion 360 for additive manufacturing, it is time
    for us to use the **Manufacture** workspace and create our first additive setup.
    To create an additive setup, the first thing we need to do is to select our 3D
    printer. In this section, we will focus on choosing a 3D printer from Fusion 360’s
    machine library. Fusion 360 hosts its machine libraries for additive, subtractive,
    and inspection machines online at https://cam.autodesk.com/machineslist. If our
    3D printer does not exist in Fusion 360’s online library, we will have to create
    it manually. We will not go over creating a custom 3D printer in this section.'
  merge: -1
  img_proc: true
- pgno: 216
  md: 'Figure 7.6 shows the online machine library for Fusion 360, as displayed on
    a web browser. This web page is equipped with a search field, which allows us
    to type the name, or a portion of the name, of the machine we are searching for.
    The web page also has two drop-down fields to help us filter the results. The
    first filter allows us to screen the results based on technology, such as additive,
    milling, turning, and so on. The second filter, which is shown in Figure 7.6 in
    its expanded state, allows us to screen the results based on the manufacturer.
    Once you find the specific 3D printer you are interested in using with Fusion
    360, you can press the Download button, and you will have access to the *.MCH
    file on your computer''s Downloads folder:


    ![](img/baa027bed101c08b496f1f420cee8a5b_216_0.png)


    Figure 7.6 – Filtering Fusion 360’s additive machines based on the manufacturer


    Another way you can access the machine library is by creating a manufacturing
    setup. To create an additive manufacturing setup, you can open any Fusion 360
    design document and switch to the Manufacture workspace. Since we set our preferences
    to default to the ADDITIVE tab when using the Manufacture workspace in the previous
    section, we will automatically be in the ADDITIVE tab. After selecting the New
    Setup command located within the SETUP panel, Fusion 360 will automatically create
    a manufacturing model based on the original design and will display the SETUP
    dialog as shown in Figure 7.7. The SETUP dialog is made up of two tabs: Setup
    and Post Process. Within the Setup tab, the first thing we must do is select our
    machine for the additive operation we are about to create:'
  merge: -1
  img_proc: true
- pgno: 217
  md: '![](img/baa027bed101c08b496f1f420cee8a5b_217_0.png)


    Figure 7.7 – Using the SETUP dialog to create an additive setup


    After pressing the **Select...** button for the machine selection in the **SETUP**
    dialog, Fusion 360''s machine library will be displayed. The machine library is
    made up of three columns. The first column on the left is the browser for various
    locations we can search for our machine. The middle column shows the various machines
    we can select. The right-most column allows us to filter our machines based on
    capabilities and technologies and displays information about the selected machine.
    The **Machine Library** dialog also has a search bar on the top left. We can see
    all the machines the Fusion 360 machine library hosts on the web within the **Machine
    Library** dialog, as shown in Figure 7.8. If we expand the list named **Fusion
    360 library**, we will see all the machine vendors that **Fusion 360 library**
    contains a machine for. In Figure 7.8, we can also see the five different **Fused
    Filament Fabrication (FFF)** printers from Alphawise within the Fusion 360 library:'
  merge: -1
  img_proc: true
- pgno: 218
  md: '![](img/baa027bed101c08b496f1f420cee8a5b_218_0.png)


    # Figure 7.8 – Fusion 360''s library of machines filtered for Additive


    Using the search bar in the top-left corner of the machine library, we can also
    search for a specific machine. In *Figure 7.9*, after typing MK3 into the search
    field, we see the three FFF printers from the machine vendor Prusa Research. We
    can select the specific printer we wish to use for our additive setup, press **Select**
    in the bottom-right corner of the **Machine Library** dialog, and proceed to the
    **Print Settings** selection.


    Alternatively, as shown in *Figure 7.9*, after selecting our printer, we can right-click
    and copy it, so that we can paste it into one of many locations within **My machines**,
    such as **Cloud**, **Local**, and **Linked**.'
  merge: -1
  img_proc: true
- pgno: 219
  md: '![](img/baa027bed101c08b496f1f420cee8a5b_219_0.png)


    Figure 7.9 – Searching for a specific printer and copying within Machine Library


    Please keep in mind that the reason why we see **Cloud** as an option under the
    **My machines** section within the browser is that, in the previous subsection,
    we enabled **Cloud** libraries as was shown in *Figure 7.2*. In *Figure 7.3*,
    we also highlighted where our local machines were being saved on our computer.
    But, until now, we have not covered **Linked** libraries. So, let''s take a closer
    look at **Linked** libraries. As shown in *Figure 7.10*, we can utilize a **Linked**
    library by selecting it, right-clicking on it, and choosing a folder to link.
    This will allow us to select a specific folder on our computer that will store
    all the files associated with that library:'
  merge: -1
  img_proc: true
- pgno: 220
  md: '![](img/baa027bed101c08b496f1f420cee8a5b_220_0.png)


    Figure 7.10 – Linking a local folder to save machine files


    Once we have a folder that is linked, all the machines that were present in that
    folder will be displayed in the Machine Library dialog. If we do not have any
    machines in our Linked folder, we can simply copy and paste machines from other
    locations, such as Fusion 360 library, as shown in Figure 7.11:


    ![](img/baa027bed101c08b496f1f420cee8a5b_220_1.png)


    Figure 7.11 – Pasting a previously copied machine into a Linked folder


    After we paste our selected machine within the Linked folder, we can also check
    to make sure that our selected machine is located in our Linked folder. We can
    do that by using Windows Explorer or Mac Finder and navigating to our selected
    folder. Figure 7.12 shows that after copying and pasting the Prusa i3 MK3S+ machine
    from Fusion 360 library to our Linked folder, it is displayed within the machine
    library under the Linked custom folder, and the same folder in Windows Explorer
    now contains a new file called Prusa i3 MK3S+.mch:'
  merge: -1
  img_proc: true
- pgno: 221
  md: '![](img/baa027bed101c08b496f1f420cee8a5b_221_0.png)


    Figure 7.12 – The Linked folder is updated after pasting a new machine


    If we were to paste the previously copied machine over to the folder named **Cloud**
    under the **My machines** section, those machines would get saved within the assets
    section of our active Fusion Team. As shown in *Figure 7.13*, we can locate the
    *.mch file by going to the **Assets** folder and then navigating to the folder
    named **CAMMachines**. Within this location, we will be able to find the Prusa
    i3 MK3S+.mch file:


    ![](img/baa027bed101c08b496f1f420cee8a5b_221_1.png)


    Figure 7.13 – Locating the cloud library of machines within the Assets folder'
  merge: -1
  img_proc: true
- pgno: 222
  md: 'If you have access to Fusion 360’s Home tab experience, in addition to locating
    the Assets folder in the Data panel, you will be able to see it in the Home tab
    as shown in Figure 7.14. After selecting the Home icon in the top-left corner,
    you will be able to see the projects that are accessible to your active team.
    The Assets folder will be available within Projects and the CAMMachines folder
    will store the machines you have saved within your Cloud library:


    ![](img/baa027bed101c08b496f1f420cee8a5b_222_0.png)


    Figure 7.14 – Locating the Cloud library of machines within the Home tab


    The main difference between the Local and Linked libraries versus the Cloud library
    relates to collaboration. Library items, such as machines, print settings, tools,
    and posts you save to your Cloud library, are all accessible to every project
    member within your active team. This means if you have five users within your
    team, they will all have read/write access to all the assets you saved to your
    Cloud libraries. Figure 7.14 also shows a full list of all possible assets, ranging
    from various libraries to templates and materials.


    In this section, we covered selecting a machine during an additive setup and managing
    our machine libraries. In the next section, we will talk about how to do the same
    for print settings and will look at the different print settings associated with
    different additive technologies.'
  merge: -1
  img_proc: true
- pgno: 223
  md: '# Print settings and creating an additive setup


    We can utilize the **Print Settings** library to find and download the latest
    print settings available from Autodesk for all types of 3D printers, just as we
    used the web-based **Machine Library** in the previous section. Autodesk hosts
    the **Print Settings** library for Fusion 360 at https://cam.autodesk.com/printsettingslist.
    After launching the web page, we can use the search bar to find the print settings
    we are looking for or use the filters for 3D printing technology and machine vendor
    to narrow down the extensive list of print settings available on this web page.
    Once we find the print setting we need, as shown in *Figure 7.15*, we can simply
    download it to our computer using the **Download** button:


    ![](img/baa027bed101c08b496f1f420cee8a5b_223_0.png)


    Figure 7.15 – Fusion 360''s Print Settings library on the web


    We can also access the entire **Print Settings** library of Fusion 360 during
    an additive setup creation. After selecting our machine, as we did in the previous
    section, we can press the **Print Settings** button within the **SETUP** dialog
    and choose from the available options within the Fusion 360 library of print settings.
    Similar to how we copied and pasted machines from the Fusion 360 library to our
    **Linked** folders, we can copy and paste print settings from the Fusion 360 **Print
    Settings** web page or the Fusion 360 library. After downloading a print setting
    from the web, we can import it to our **Local**, **Cloud**, or **Linked** print
    setting libraries and select that print setting from our preferred library during
    the additive setup as shown in *Figure 7.16*:'
  merge: -1
  img_proc: true
- pgno: 224
  md: '![](img/baa027bed101c08b496f1f420cee8a5b_224_0.png)


    # Figure 7.16 – Selecting a print setting from Fusion 360''s Print Setting Library


    Once we have a print setting saved within a folder under **My print settings**,
    such as the **Linked | Custom** folder shown in Figure 7.17, we can modify that
    print setting by selecting it, right-clicking it, and editing it. Editing is only
    available after a machine or a print setting is saved under the **My machines**
    or **My print settings** subsection of **Fusion 360 library**:


    ![](img/baa027bed101c08b496f1f420cee8a5b_224_1.png)


    # Figure 7.17 – Editing a print setting located under My print settings'
  merge: -1
  img_proc: true
- pgno: 225
  md: 'Print Setting Editor is displayed upon pressing the Edit command for a custom
    print setting, which will allow us to customize all the information based on our
    preferences. Figure 7.18 shows a typical print setting for an FFF print setting.
    This print setting happens to be the default print setting for printing on a single
    extruder FFF printer using the PLA material. Print Setting Editor is made up of
    two columns. On the left-hand side, we can see headings such as Information, General,
    and Body Presets. Under Body Presets, we have two headings by default: Normal
    and Strong. Normal happens to be the default setting for Body Presets, as denoted
    by the gear icon with a checkmark to the left of the text. We will cover interacting
    with Body Presets and assigning print settings per component in more detail in
    Chapter 8:


    ![](img/baa027bed101c08b496f1f420cee8a5b_225_0.png)


    Figure 7.18 – Customizing the PLA print setting for an FFF machine


    Under the Body Presets section, within the Normal body preset, there are multiple
    subsections, such as Extrusion, Shell, and Infill. Figure 7.19 shows the input
    fields for the Infill subsection of the Normal body preset. Using this entry,
    we can customize the Infill pattern from the default option of Gyroid to a different
    Infill pattern. Or we can change Infill Density from 25% to 100% to make it a
    fully dense print if desired:'
  merge: -1
  img_proc: true
- pgno: 226
  md: '![](img/baa027bed101c08b496f1f420cee8a5b_226_0.png)


    Figure 7.19 – Modifying the Infill inputs for an FFF print setting


    Another common **Body Presets** setting to modify is **Print Bed Adhesion**. Figure
    7.20 shows **Print Bed Adhesion** for the **Normal** body preset. As you can see
    in the figure, **Print Bed Adhesion** has been enabled and **Print Bed Adhesion
    type** has been set to **Skirt** by default. You can change **Print Bed Adhesion
    type** to **Brim** or **Raft** and modify the associated inputs based on the adhesion
    type you have selected within this dialog:'
  merge: -1
  img_proc: true
- pgno: 227
  md: '![](img/baa027bed101c08b496f1f420cee8a5b_227_0.png)


    Figure 7.20 – Customizing Print Bed Adhesion inputs for an FFF print setting


    Print Setting Editor also allows us to search a given input field by its name
    using the search bar located in the top-left corner of the dialog. Figure 7.21
    shows the outcome of searching for the phrase number of perimeters. This entry
    exists twice for this print setting, as shown in the figure. The first entry is
    for the Normal body preset and the second entry is for the Strong body preset.
    After selecting Number of Perimeters (Normal) from the list of available options,
    the user interface automatically switches to the Shell selection of the Normal
    body preset and highlights the Number of Perimeters entry field with a blue line
    beneath it. If we hover over the input field, we are also able to see a tooltip
    for this entry, which reads Number of perimeter beads around each layer:'
  merge: -1
  img_proc: true
- pgno: 228
  md: '![](img/baa027bed101c08b496f1f420cee8a5b_228_0.png)


    Figure 7.21 – Using the search bar for locating and adding input to modify within
    Print Setting Editor


    So far, we have mainly focused on print settings and machines for FFF. However,
    Fusion 360 supports the creation of additive setups for more than FFF printers.
    If we were to select a 3D printer that utilizes **stereolithography (SLA)** while
    we were creating our additive setup, then after pressing the **Print Settings**
    button, we would be able to select a print setting that was appropriate for the
    type of printer we had just selected. Figure 7.22 shows what **Print Setting Editor**
    looks like for the print setting named **Prusa Orange Tough - 0.05mm Normal**,
    which is a resin that can be printed on a Prusa SL1 printer, which is an SLA 3D
    printer. As you can see, the list of available options for this print setting
    is very different from the PLA print setting we have been editing for an FFF printer.
    There are similarities between the two, such as inputs for layer thickness. However,
    for resin-based printers, we have access to editing additional information, such
    as exposure time, which can be controlled within **Print Setting Editor**:'
  merge: -1
  img_proc: true
- pgno: 229
  md: '![](img/baa027bed101c08b496f1f420cee8a5b_229_0.png)


    Figure 7.22 – Print Setting Editor for a Prusa Orange Tough resin to be printed
    on a Prusa SL1 printer


    The print settings for all SLA printers are not the same, and they can look different
    based on the specification of the machine manufacturer and the slice file required
    by the machine. Figure 7.23 shows a good example of a generic SLA printer that
    utilizes a ZIP file full of SLC (slice) files. You can access this print setting
    after choosing a generic SLA printer from the machine library. When editing this
    print setting, you can customize the layer thickness and have control over whether
    you want to create unique files per part and for supports and how you wish to
    name each file:'
  merge: -1
  img_proc: true
- pgno: 230
  md: '![](img/baa027bed101c08b496f1f420cee8a5b_230_0.png)


    Figure 7.23 – Print Setting Editor for a generic SLA printer


    Even though both the DLP and SLA printers utilize resin as the raw material to
    3D print with, they use different technologies to print that resin, and the print
    settings for such printers also reflect that difference in technology. After selecting
    an Autodesk Generic DLP printer from the machine library, you will be able to
    select the Autodesk Generic DLP as the print setting. If you edit that print setting
    as shown in *Figure 7.24*, you will see yet another unique list of print settings
    you can modify. Similar to the FFF and SLA print settings, you can control the
    layer thickness for a DLP print setting. However, unlike the other technologies,
    DLP printers generally utilize image files to print each layer. In this print
    setting, you can customize the image size, the image quality, and the naming associated
    with each image file (* .png) during the export process. Before slicing your model
    and exporting the image files, you will want to make sure you edit the **Size
    X** and **Size Y** fields of this print setting to match the printable build area
    dimensions of your specific DLP printer:'
  merge: -1
  img_proc: true
- pgno: 231
  md: '![](img/baa027bed101c08b496f1f420cee8a5b_231_0.png)


    Figure 7.24 – Print Setting Editor for a generic DLP printer


    Even though we are not focusing on 3D printers using MPBF technology in this chapter,
    I also want to take the opportunity to showcase what a print setting looks like
    for this technology. As mentioned earlier in the chapter, you cannot select an
    MPBF 3D printer as a part of your additive setup unless you have access to the
    Additive Build Extension. However, if you want to follow along and duplicate the
    workflow shown in Figure 7.25 to better understand the print settings associated
    with MPBF, you can simply find an MPBF print setting from Fusion 360’s online
    library and download it. Once you have a local copy of an MPBF print setting,
    you can import it into one of your Local or Cloud libraries, as we covered in
    the previous section. You don’t need to do this during the creation of an additive
    setup. You can access all manufacturing-related libraries within the Manufacture
    workspace’s MANAGE panel within any tab.'
  merge: -1
  img_proc: true
- pgno: 232
  md: 'Figure 7.25 shows Print Setting Editor when editing the Autodesk Generic MPBF
    100 micron print setting. This print setting, much like all the other print settings
    we have demonstrated up until now, allows us to modify the layer thickness. In
    addition, we can designate our metal powder in the Material dropdown, which has
    an impact downstream when we wish to use this print setting for a process simulation,
    which will cover in more detail in Chapter 13. We also have additional controls
    over the path the laser will follow while fusing the powder of different parts
    of the model, such as its Upskin, Downskin, and Supports. The Autodesk Generic
    MPBF 3D printer, along with this print setting, allows for the creation of multiple
    slice file types, such as SLC and Gcode. Therefore, the print setting also incorporates
    various options that control how those files are created and named:


    ![](img/baa027bed101c08b496f1f420cee8a5b_232_0.png)


    Figure 7.25 – Print Setting Editor for a generic MPBF printer


    Now that we have covered a variety of print settings for different additive technologies,
    let’s put everything we have learned into practice by creating our first additive
    setup. To demonstrate this, we will be using a model we have created in Chapter
    6 named Spur Gear. We are purposefully using this geometry as it is already oriented
    such that it has a flat surface that touches the X-Y plane.'
  merge: -1
  img_proc: true
- pgno: 233
  md: 'After opening the design in Fusion 360, we can switch to the Manufacture workspace
    using the workspace switcher. Within the ADDITIVE tab, we can click on New Setup,
    which is in the SETUP panel. Within the Setup tab of the SETUP dialog, click on
    the Select... command next to the Machine input, and select Prusa i3 MK3S+ as
    our machine from Fusion 360 library. Using the Print Setting selector, let''s
    select PLA as our Print Setting. Using the model selector at the bottom of the
    dialog, we can double-click on Spur Gear in the canvas or select the Spur Gear
    component from the browser within Manufacturing Model 1, as shown in Figure 7.26.


    After having completed all the selections related to the machine, print settings,
    and model, we have completed our input for this additive manufacturing setup.
    One other critical piece of information we have not highlighted so far is arranging
    parts within the build volume. By default, a SETUP dialog for an additive operation
    automatically has the Arrangement checkbox checked:


    ![](img/baa027bed101c08b496f1f420cee8a5b_233_0.png)


    Figure 7.26 – Additive setup inputs completed for a single component


    After selecting OK in the SETUP dialog, Fusion 360 will automatically display
    the build volume of the printer we have selected within the canvas and create
    Setup 1. The ribbon user interface will then change slightly, and we will see
    new icons appear in the ribbon under the ADDITIVE tab. If you compare the ribbon
    in Figure 7.27 to the previous figure, you will see some new icons under the POSITION
    panel and a new panel called SUPPORTS appears. Once the additive setup is created,
    Fusion 360 will display a new dialog called ADDITIVE ARRANGE. We will focus on
    arranging our parts within the build volume in the next chapter in detail. But
    for this example, let us go ahead and press OK in the ADDITIVE ARRANGE dialog,
    which will automatically arrange this component within the build area of this
    printer:'
  merge: -1
  img_proc: true
- pgno: 234
  md: '![](img/baa027bed101c08b496f1f420cee8a5b_234_0.png)


    Figure 7.27 – Utilizing ADDITIVE ARRANGE within an additive setup


    After the arrangement is complete, our part will be touching the build plate as
    the platform clearance input was 0 during the arrangement. An **ADDITIVE ARRANGE**
    operation automatically places all selected components around the center of the
    build platform. After pressing **OK** within the **ADDITIVE ARRANGE** dialog,
    Fusion 360 will perform the necessary calculations and move the part to the center
    of the build platform:'
  merge: -1
  img_proc: true
- pgno: 235
  md: '![](img/baa027bed101c08b496f1f420cee8a5b_235_0.png)


    Figure 7.28 – Our first additive setup is now complete


    Performing **ADDITIVE ARRANGE** also adds a new line item in the browser called
    **ADDITIVE ARRANGE**, which can be edited and or regenerated in the future if
    needed. Using this function, we can arrange one or more components within the
    build area of a given printer. As this is an FFF printer, the arrangement type
    was set to arrange components in 2D by default. If we were to create an additive
    setup using **selective laser sintering (SLS)**, a **Multi Jet Fusion (MJF)**
    printer, or a binder jetting printer, we could have also used the 3D arrangement
    type and automatically organized our parts within the build volume of our selected
    3D printer.


    With that final step, we are now done with our first Fusion 360 additive setup
    using an FFF printer.'
  merge: -1
  img_proc: true
- pgno: 236
  md: '# Summary


    In this chapter, we have focused mainly on Fusion 360’s settings and preferences
    and how to customize them in order to make our additive manufacturing workflow
    seamless. We have made changes to settings that control Fusion 360’s display behavior
    and functionality related to automatically switching to the **ADDITIVE** tab when
    we enter the **Manufacture** workspace.


    We have also enabled certain review features to utilize functionality that is
    considered pre-release. After customizing our settings and preferences, we learned
    about manufacturing-related libraries, such as the machine library and the **Print
    Settings** library. We explored the online libraries for 3D printers and Print
    Settings Autodesk hosts on the web. We demonstrated how to download machines,
    print settings from the web, and utilize them within the Fusion 360 user interface
    by saving them locally, as linked libraries, and as cloud-saved libraries, which
    are accessible to all our team members.


    We highlighted the similarities and differences in print settings for different
    3D printing technologies, such as FFF, SLA, DLP, and MPBF. We concluded the chapter
    by putting all our newfound knowledge into action by creating our first additive
    setup for a single component. Using everything we have learned in this chapter,
    you should feel confident when you are creating manufacturing setups, choosing
    the component you want to print, and generating your additive setups in Fusion
    360.


    In the next chapter, we will take the concept of part arrangement one step further
    and will focus on arranging and orienting multiple components within our 3D printer’s
    build volume.'
  merge: -1
  img_proc: true
- pgno: 237
  md: '# Part 3:

    Print Preparation – Positioning Parts, Generating Supports, and Toolpaths


    In this part, we will introduce the various part positioning and arranging options
    within a given Fusion 360 additive setup. We will highlight the various additive
    manufacturing technologies and the requirements around part arrangement and orientation.
    Then, we will introduce how to select a print setting for the additive manufacturing
    technology we will use in our setup. We will learn how to customize print settings
    and how to apply print settings to individual sections of our models. In the subsequent
    chapters, we will learn how to create support structures for additive technologies,
    such as fused filament fabrication and stereolithography. We will end this part
    by introducing how to slice our models and simulating the additive tool path,
    layer by layer.


    This part has the following chapters:


    +   - Chapter 8, Arranging and Orienting Components

    +   - Chapter 9, Print Settings

    +   - Chapter 10, Support Structures

    +   - Chapter 11, Slicing Models and Simulating the Toolpath'
  merge: -1
  img_proc: true
- pgno: 238
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 239
  md: '# Arranging and Orienting Components


    Welcome to Chapter 8. In previous chapters, we highlighted how to design from
    the ground up as well as how to modify existing designs for 3D printing. At the
    end of Chapter 7, after having selected a printer and a print setting, we created
    our first Additive Manufacturing setup in order to 3D print a single component.
    In this chapter, we will build on that knowledge and create additive setups for
    different manufacturing technologies with one or more components and explore the
    different tools available within Fusion 360 to position those components.


    Whether you’re printing a single component or hundreds of them at the same time,
    arranging them within the build volume and orienting them based on the desired
    outcome is an important consideration to get a successful print. This chapter
    will go over the various 3D-printing technologies and how to best arrange and
    orient components for each technology. In this chapter, we will highlight how
    to manually translate and orient components. We will also showcase how to automatically
    orient parts and arrange them based on a given criteria such as minimizing build
    height or finding an orientation that will result in a minimum support-structure
    volume.


    In this chapter, we will cover the following topics:


    +   - Positioning components manually

    +   - Orienting components automatically

    +   - Arranging components automatically'
  merge: -1
  img_proc: true
- pgno: 240
  md: 'By the end of the first section, you will have learned how to manually position
    components within the build volume of your printer. In this section, you will
    also learn various techniques to effectively translate and rotate your parts so
    that they are above the build plate of your printer and lying flat on a surface
    of your choosing. At the end of the second section, you will have learned how
    to conduct an orientation study for a given part and how to choose an orientation
    to print your parts based on the 3D-printing technology and your printer''s features
    and limitations. By the end of the chapter, you will have learned how to automatically
    arrange your components within the 3D build volume of your printer. In addition,
    you will also be able to inspect your setup and perform basic statistics to find
    the arrangement density of your parts within your printer''s build volume.


    # Technical requirements


    All topics covered in this chapter are accessible to personal, trial, commercial,
    startup, and educational Fusion 360 license types.


    There are certain Fusion 360 additive machines, such as the **Metal Powderbed
    Fusion (MPBF)** 3D printers, that are not available until access is gained to
    the Additive Build extension. As with all other Fusion 360 extensions, the Additive
    Build extension is not available for use with personal licenses. As we will not
    cover topics specific to metal 3D printing in this chapter, you should be able
    to follow along with all the examples in this chapter with no issues.


    If you have a commercial license of Fusion 360, to create an additive setup with
    an MPBF machine, you will also need access to the Additive Build extension (https://www.autodesk.com/products/Fusion-360/additive-build-extension).


    Autodesk offers a 14-day trial for the Additive Build extension for all commercial
    users of Fusion 360. You can activate your trial within the extensions dialog
    of Fusion 360.


    The lesson files for this chapter can be found here: https://github.com/PacktPublishing/3D-Printing-with-Fusion-360


    # Positioning Components Manually


    When preparing our part for 3D printing, one of the primary functions we use in
    our slicer software is positioning components. Fusion 360 has multiple tools we
    can use for translating and orienting our parts within the build volume of our
    3D printer. The first method we highlight in this section is the use of the **Move
    Components** command, located within the **POSITION** panel of the **ADDITIVE**
    tab within the **MANUFACTURE** workspace. In order to demonstrate how to use this
    functionality, we will create a new additive setup using a Prusa i3 MK3S+ 3D printer
    with a PLA print setting.'
  merge: -1
  img_proc: true
- pgno: 241
  md: 'Our first additive setup in this chapter will utilize two components named
    Component 6 and Component 15 within an assembly called Spark Max Motor Controller.
    We will create this additive manufacturing setup using the **NEW SETUP** command
    located in the **MANUFACTURE** workspace in the **ADDITIVE** tab''s **SETUP**
    panel, as demonstrated in the previous chapter. During the setup creation, we
    will uncheck the **Arrangement** checkbox, which will allow us to have full control
    over the position of each component. We will discuss how to use the automatic
    arrangement functionality this checkbox initiates when activated in the final
    section of this chapter.


    ![](img/baa027bed101c08b496f1f420cee8a5b_241_0.png)


    Figure 8.1 – Creating an additive setup with two components


    While creating the additive setup, Fusion 360 automatically turns off the visibility
    of components that do not participate in the additive setup and displays the build
    plate and the build volume of the printer we have selected, along with the two
    components that will take part in this additive setup. As you can see in Figure
    8.1, the two components do not move into the build volume automatically, as we
    unchecked the arrangement checkbox during the setup creation. Instead, they stay
    in place, which means we have to move them into the build volume manually.


    When positioning parts within the additive setup, we have several options. The
    first option is to utilize the **MOVE COMPONENTS** command located within the
    **ADDITIVE** tab''s **POSITION** panel. Once activated, the **MOVE COMPONENTS**
    dialogue allows us to select one or more components and translate and/or rotate
    them within the active setup. This action moves the components and captures their
    new position within the Manufacturing Model that is being used in the active setup.
    Figure 8.2 shows how the selected component is translated on the X, Y, and Z axes
    by distances of 100 millimeters, 100 millimeters, and 60 millimeters respectively.'
  merge: -1
  img_proc: true
- pgno: 242
  md: '![](img/baa027bed101c08b496f1f420cee8a5b_242_0.png)


    Figure 8.2 – Using the MOVE COMPONENTS dialog to position a part within the build
    volume


    Figure 8.2 also shows that after moving the first component, we still have the
    second component, which is not fully within the build volume of our printer. Such
    components are displayed with a red highlight around their edges, indicating that
    those parts are positioned outside of the printable zone of the machine. Fusion
    360 also displays an error message within the move-components dialog indicating
    such issues.


    If at this point, we wish to move a different component, we can select it, and
    then unselect the first component by left-mouse-clicking on the components in
    the canvas. Next, we can enter the distance and the angle by which we wish to
    move the second component and click OK.


    Another option we have when positioning components is to move them within the
    canvas by selecting the center of the component with our mouse and dragging them
    on the screen as shown in Figure 8.3 while the MOVE COMPONENTS dialog is active.
    This action is akin to performing a MOVE/COPY action with Move type of Free Move
    for components that are not grounded within the DESIGN workspace.'
  merge: -1
  img_proc: true
- pgno: 243
  md: '![](img/baa027bed101c08b496f1f420cee8a5b_243_0.png)


    Figure 8.3 – Using the mouse to drag a component within an additive setup


    As you can also see in *Figure 8.3*, the increment Fusion 360 uses during this
    free part motion has three significant figures for any translation or rotation.
    If we wanted to change the precision with which we translate or rotate components
    using the drag and drop technique, we would need to go back to our preferences
    dialog and change the general precision from the default, which is **0.123**,
    to either a less precise or more precise option. As a reminder, **General precision**
    can be found within the **Unit and Value Display** section of the **Preferences**
    dialog, as can be seen in *Figure 8.4*.


    ![](img/baa027bed101c08b496f1f420cee8a5b_243_1.png)


    Figure 8.4 – General precision can be edited within Fusion 360''s Preferences
    dialog'
  merge: -1
  img_proc: true
- pgno: 244
  md: 'The **MOVE COMPONENTS** dialog has additional functionality, which allows us
    to rotate our components as well. After selecting a component to rotate, we can
    type in an angle within the **X Angle**, **Y Angle**, or **Z Angle** input fields
    to rotate our components accordingly. *Figure 8.5* shows rotating one of the two
    components around its center of gravity by 45 degrees on the X, Y, and Z axes.


    ![](img/baa027bed101c08b496f1f420cee8a5b_244_0.png)


    Figure 8.5 – Rotating a component using the MOVE COMPONENTS dialog


    Once a component has been rotated, if we wanted to move that component a second
    time, after selecting it within the Move Components dialog, Fusion 360 automatically
    shows a local coordinate system at its origin, which is based on the last move
    operation we just finished.


    If you look closely at *Figure 8.5*, you will notice that the coordinate system
    is set to **Component XYZ**. If we have already rotated a component once, the
    local coordinate system that will be displayed for that component will not match
    with the global XYZ axes. This will make it harder for us to translate a component
    in the global XYZ axes.


    To address this issue, we can change our coordinate system from **Component XYZ**
    to **Machine XYZ**, which always matches up with the global coordinate system.
    After selecting the **Machine XYZ** coordinate system, we can translate our selected
    component(s) in the global X, Y, or Z directions with ease, as shown in *Figure
    8.6*.'
  merge: -1
  img_proc: true
- pgno: 245
  md: '![](img/baa027bed101c08b496f1f420cee8a5b_245_0.png)


    Figure 8.6 – Translating a component in the global Z direction using the Machine
    XYZ coordinate system


    After orienting our parts with the Move Components dialog, we may want to quickly
    translate them closer to the bottom-left corner within our 3D printer''s build
    volume. In such instances, after selecting the component we wish to translate,
    we can click the **Move to Origin** command, and our selected component will be
    automatically translated such that its bounding box''s bottom - left corner coincides
    with the front bottom-left corner of our 3D printer''s build volume, as shown
    in Figure 8.7.


    ![](img/baa027bed101c08b496f1f420cee8a5b_245_1.png)


    Figure 8.7 – Translating a selected component using the Move to Origin function'
  merge: -1
  img_proc: true
- pgno: 246
  md: 'Another useful tool within the **ADDITIVE** tab’s **POSITION** panel is **Minimize
    Build Height**. If we have a component with an irregular shape, or one that has
    been rotated such that it occupies a substantial Z height, we may want to search
    for an orientation where this component takes up the smallest possible Z height
    within our build volume. In certain additive manufacturing technologies such as
    **selective laser melting (SLM)**, **selective laser sintering (SLS)**, **multijet
    fusion (MJF)**, and binder jetting, it is beneficial to use the least amount of
    Z height so that we don’t waste raw materials or print time.


    Reducing the Z height of a given additive setup minimizes the number of layers
    that need to be 3D-printed. This has a positive impact on the overall printing
    time. Imagine if we were printing a build with 1,000 layers. We would have 999
    intervals between the layers, where additive manufacturing technology-specific
    processes, such as recoating the build with raw material for the next layer, need
    to take place. Such processes can take ~10 seconds per layer interval depending
    on your 3D printer. If you could reduce the number of layers by rotating your
    components such that the build could be printed with half the number of layers
    (500 in this example), you could cut down the overall time you spend recoating
    the build by ~80 minutes. That is a substantial time saving that would have a
    positive impact on your manufacturing throughput and profitability.


    The minimize build height command automatically rotates a selected component such
    that it occupies the least amount of space in the Z axis as shown in Figure 8.8.
    If we enter a non-0 input into the platform clearance field, this command will
    also leave a gap between the build plate and the part.


    ![](img/baa027bed101c08b496f1f420cee8a5b_246_0.png)


    Figure 8.8 – Minimizing the build height of a component within an additive setup'
  merge: -1
  img_proc: true
- pgno: 247
  md: 'The final manual positioning we will highlight in this section is the Place
    parts on platform command. As shown in Figure 8.9, this command offers us the
    ability to select either Component, or Flat Face within that component, using
    the Type dropdown. If we choose Flat Face from the dropdown, we can select a surface
    on a component and fill in Platform Clearance as desired, just as we described
    previously for the Minimized Build Height command. Upon clicking OK in the PLACE
    PARTS ON PLATFORM dialog, our selected component will rotate, and the surface
    we have selected will face the build platform. Please note that the Flat Face
    selection type only works with SOLID bodies and a planar face group on a MESH
    body cannot be selected as input for this command. Figure 8.9 shows both the input
    and the output of this command on one of the two components we have in this additive
    setup.


    ![](img/baa027bed101c08b496f1f420cee8a5b_247_0.png)


    Figure 8.9 – Using the Place parts on platform command by selecting a flat face


    In this section, we have covered three different manual part positioning commands
    that are available to us within an additive setup. Using these three relatively
    simple commands, we can translate and rotate our components so that they are within
    the build volume of our 3D printer. All the modifications to the position that
    we highlighted in this section were purely geometric. We did not consider any
    process-specific requirements as we were moving or rotating our components. In
    the next section, we will start to consider the requirements for various 3D-printing
    technologies and position our components accordingly.


    # Orienting Components Automatically


    In the previous section, we talked about the various ways we can utilize Fusion
    360 for positioning our parts within the build volume of our printer. However,
    all the translations and rotations we have shown up until now were explicit actions.
    Fusion 360 also offers tools to help us automatically orient our parts so that
    we can choose an orientation based on our 3D printer''s specific technology in
    order to minimize material usage and increase our chances of a successful print.'
  merge: -1
  img_proc: true
- pgno: 248
  md: 'To demonstrate how to automatically orient parts with Fusion 360, we will be
    using a model named `Connector Bracket`, as shown in Figure 8.10. This is a model
    we created in the previous chapter as a part of a larger assembly. In this chapter,
    we''ll open this Fusion 360 design document and switch to the **MANUFACTURE**
    workspace. We will create an additive setup using an FFF printer (Prusa i3 MK3S
    +) and a PLA-specific print setting, as shown in Figure 8.10. We will also uncheck
    the **Arrangement** option within the **SETUP** dialog and click **OK** to generate
    the additive setup.


    ![](img/baa027bed101c08b496f1f420cee8a5b_248_0.png)


    Figure 8.10 – Creating an additive setup with an FFF machine for a single component


    Since we did not check the **Arrangement** checkbox while creating this additive
    setup, Fusion 360 does not automatically arrange our parts within the build volume
    of our printer. However, as the part was already positioned close to the origin,
    our part is automatically displayed within the build volume, and we can further
    position it as needed.


    In this section, we will focus our efforts on the **AUTOMATIC ORIENTATION** command,
    which is located in the **ADDITIVE** tab''s **POSITION** panel dropdown. Once
    we activate the **AUTOMATIC ORIENTATION** command, Fusion 360 will display a new
    dialogue with two tabs, as shown in Figure 8.11. The first tab, named **Parameters**,
    allows us to select a component on which to conduct the orientation study. In
    this example, we will conduct a single automatic orientation as this additive
    setup only contains one component. However, if we had multiple components in an
    additive setup, we could have conducted a unique orientation study for each component
    we wish to 3D print. After selecting the target component, we can edit the **Support
    Overhang Angle** input field and type in 45 deg as most FFF, SLA, DLP, and MPBF
    3D printers are capable of creating overhangs up to 45 degrees without the need
    for support structures. The next checkbox, named **Support Bottom Surface**, allows
    us to add a platform clearance between our part and the build plate of the 3D
    printer when activated.'
  merge: -1
  img_proc: true
- pgno: 249
  md: 'As this example is for an FFF printer, we don''t need to activate it. However,
    if we were conducting this orientation study for an MPBF printer, we may want
    to activate that checkbox and enter a platform clearance of ~3 millimeters to
    account for the thickness of the cutting tool we will use to cut our parts off
    of the build plate once the printing process is complete.


    ![](img/baa027bed101c08b496f1f420cee8a5b_249_0.png)


    Figure 8.11 – Automatic orientation study for an additive setup with an FFF printer


    Based on the inputs we have provided within the **Parameters** tab, Fusion 360
    will generate various orientations of this component, and provide us with information
    about each orientation. To limit the long list of orientation results this command
    will generate, the **Parameters** dialogue allows us to adjust the minimum allowed
    rotation angle. By default, the **Smallest Rotation** input is set to 180 degrees.
    This means that the orientations we will get out of this study will be mirror
    images along a global plane such as XZ or YZ. If you reduce the smallest rotations
    input, Fusion 360 will produce more outcomes within the orientation results. However,
    this may take a slightly longer time to calculate.


    My recommendation is to use the standard inputs within the **Parameters** tab
    and not deviate from the defaults if your additive setup is for an FFF printer.
    If you find yourself always needing to change the input for your orientation studies,
    you can left-click the icon next to the input represented by three vertical dots
    and select **Save as User Default** to set your custom input as the default, as
    shown in Figure 8.11. This way, the next time you utilize this command, the input
    of the dialog will be based on your desired preferences. This is a common way
    for you to customize the defaults used in most of the dialogs within the Fusion
    360''s **MANUFACTURE** workspace.'
  merge: -1
  img_proc: true
- pgno: 250
  md: 'If you switch over to the **Ranking** tab within the **AUTOMATIC ORIENTATION**
    dialog, you will be able to control how Fusion 360 lists the outcomes of the orientation
    study, as shown in Figure 8.12. While generating a list of orientations for the
    selected component, Fusion 360 also calculates additional information such as
    the following:


    +   - How much support would be necessary to print an object in a given orientation

    +   - The total surface area on the parts where supports would be necessary based
    on the support overhang angle input

    +   - What the bounding-box volume would be in a given orientation

    +   - The maximum Z height occupied in a given orientation

    +   - The height of the center of gravity in a given orientation


    Using the dropdowns next to each of these ranking criteria, you can assign a priority
    to the values calculated by Fusion 360 for each item. As previously mentioned,
    the default ranking priority is the preferred ranking priority to use for both
    FFF and MPBF technologies.


    ![](img/baa027bed101c08b496f1f420cee8a5b_250_0.png)


    Figure 8.12 – Ranking criteria for an automatic orientation study


    After conducting an orientation study and clicking the **OK** button in the **AUTOMATIC
    ORIENTATION** dialog, Fusion 360 adds a new line item called Automatic Orientation1
    within the **Orientations** folder in the browser for the active additive setup,
    as shown in Figure 8.13. Once Fusion 360 generates all the orientation outcomes,
    it will display the available orientation to choose from in a new tab called **Results**
    within the **ORIENTATION RESULTS** dialog. If you close this dialog by clicking
    **OK**,'
  merge: -1
  img_proc: true
- pgno: 251
  md: 'you can always come back to it by selecting Automatic Orientation1 within the
    browser, right-clicking on it, and selecting Orientation Results. The results
    of an orientation study include a drop-down list ranking the orientation outcomes.
    By selecting the arrow key next to Rank, we can observe the results of the calculated
    support areas, support volume, bounding-box volume, overall height, and center-of-gravity
    height, as was previously outlined. The highest-ranking outcome, Rank 1, is the
    recommended orientation to print the target component on this FFF 3D printer.


    ![](img/baa027bed101c08b496f1f420cee8a5b_251_0.png)


    Figure 8.13 – Orientation results for an automatic orientation study


    After selecting the desired orientation result using the Rank dropdown, we can
    click the OK button, and our component will rotate from its initial position to
    the orientation we have selected.


    In this section, we mainly focused on conducting an automatic orientation operation
    and choosing the orientation result from a list of outcomes. However, it would
    also be beneficial to highlight the impact of this orientation on our selected
    component. To showcase the effect of this orientation, we can add a support structure
    to our component using the SOLID VOLUME SUPPORT command within the ADDITIVE tab,
    in the SUPPORTS panel. After selecting our component within the GEOMETRY tab of
    the dialog and clicking OK, Fusion 360 creates support structures for surfaces
    that have an overhang angle of less than 45 degrees. The outcome of the support
    generation action can be seen in Figure 8.14, along with the SOLID VOLUME SUPPORT
    dialog. The support structures Fusion 360 creates are displayed as blue objects
    on the canvas. We can see that this orientation produces a minimal support structure
    for our component so that it can be 3D printed using our FFF printer.'
  merge: -1
  img_proc: true
- pgno: 252
  md: '![](img/baa027bed101c08b496f1f420cee8a5b_252_0.png)


    Figure 8.14 – Adding solid volume supports to a component after automatic orientation


    It is important to remember that different 3D-printing technologies will require
    different parameters and ranking inputs when conducting automatic orientation
    studies. In the next example, we will highlight how we can use the automatic orientation
    functionality for choosing print orientations on an SLA/DLP 3D printer.


    In this new example, we will use the same Connector Bracket document but create
    a new manufacturing model (Manufacturing Model 2), as shown in Figure 8.15. Then
    we will create a new additive setup (Setup2) that will utilize Manufacturing Model
    2 during model selection. This new setup will use an SLA printer named Prusa SL1S
    SPEED. We will also select any of the appropriate print settings for this printer
    from the available list of print settings.


    After having created Setup2, we can focus on orienting the component. When determining
    the best component orientation with a resin 3D printer, we generally want to support
    the bottom surface and allow for a distance between the build plate and our part
    so we can generate a support that includes a base plate. We will cover the various
    types of support options based on 3D-printing technology in detail in Chapter
    10. In Figure 8.15, this parameter is set to 7 millimeters. The main difference
    between the inputs for an automatic orientation for an FFF printer versus an SLA
    printer is in how we rank the outcomes. As shown in Figure 8.15, when ranking
    the outcomes, we do not rely on bounding-box volume, part height, or center-of-gravity
    height results. Instead, we look for the orientation that will'
  merge: -1
  img_proc: true
- pgno: 253
  md: 'result in the lowest support area required, while also trying to reduce the
    support volume as a secondary priority. The specific set of ranking priorities
    shown in Figure 8.15 are my preferred ranking criteria when utilizing the automatic
    orientation tool for an SLA or a DLP 3D printer as these options tend to highly
    rank orientations that can be 3D printed with the smallest volume of support structures
    while producing quality models.


    ![](img/baa027bed101c08b496f1f420cee8a5b_253_0.png)


    Figure 8.15 – Automatic orientation study for an SLA/DLP 3D printer


    Based on the Parameters and Ranking criteria we set, Fusion 360 generates several
    options to orient this model. As you can see in Figure 8.16, the highest-ranked
    orientation (Rank 1) we get out of the orientation study has a very small area
    of support structures required (4.07mm³). This orientation will also require a
    relatively small amount of support volume (~94 mm³). However, the outcome of the
    orientation study does not consider certain aspects of the 3D-printing process.
    To highlight the issue with this specific orientation, I made the part transparent
    and colored certain surfaces red, as shown in Figure 8.16. The red surfaces represent
    areas in the model where cupping can occur during the printing process. Cupping
    can cause print failures when 3D printing upside down using an SLA or DLP printer
    due to the pressure build-up in the trapped cavity.'
  merge: -1
  img_proc: true
- pgno: 254
  md: '![](img/baa027bed101c08b496f1f420cee8a5b_254_0.png)


    Figure 8.16 – Outcome of an orientation study for an SLA/DLP 3D printer


    If we wanted to 3D print our model using this orientation, we would want to resolve
    the cupping issue by creating venting holes around the local minima of the cavity.
    Alternatively, we could choose a different orientation such as the one shown in
    Figure 8.17 listed as Rank 3. If we print our part using this orientation, we
    will not have a convex portion of our component acting as a suction cup and trapping
    air during the 3D-printing process. This orientation will, however, result in
    a larger bounding-box height, which means a longer print time, and will require
    more support structures, meaning using more material during the print.'
  merge: -1
  img_proc: true
- pgno: 255
  md: '![](img/baa027bed101c08b496f1f420cee8a5b_255_0.png)


    Figure 8.17 – Orientation to avoid the cupping effect for an SLA/DLP printer


    After selecting the desired orientation using the Rank dropdown, we can click
    the OK button on ORIENTATION RESULTS, and our component will stay in the desired
    orientation. To demonstrate the impact of this orientation on our component, we
    can add support to this component by selecting the BAR SUPPORT command located
    in the ADDITIVE tab''s SUPPORTS panel. Within the BAR SUPPORTS dialog, we can
    select our component, so that Fusion 360 can create support structures for all
    the surfaces that have an overhang angle less than the critical angle using Medium
    bars. Both the BAR SUPPORT dialog and the outcome of the support operation can
    be seen in Figure 8.18 as a composite image. The support structures are displayed
    in blue in this image, and we can see that this orientation requires a number
    of bars to support the components during the 3D-printing process.'
  merge: -1
  img_proc: true
- pgno: 256
  md: '![](img/baa027bed101c08b496f1f420cee8a5b_256_0.png)


    Figure 8.18 – Adding bar supports to a component after automatic orientation


    When orienting our parts, there are numerous other factors to consider that depend
    on the given 3D-printing technology and the surface finish we require for our
    part. One key factor I would also like to highlight in this chapter is metal 3D
    printing using MPBF technology. As the MPBF process transfers energy from a laser
    to metal powder, parts that are 3D printed using this technology have a tendency
    to deform in the Z direction. If the deformation in the Z direction is above a
    certain value for a given layer, as fresh powder is being dispersed onto the next
    layer, parts could collide with the recorder blade, which would result in undesirable
    defects or print failures. Therefore, it is good practice to orient parts away
    from the direction of the recorder blade. Figure 8.19 shows a design that leans
    into the path of the recorder blade. This may make the problem worse and cause
    the blade to collide with the part during the printing process due to the thermal
    expansion we just discussed. In such cases, we may want to orient our parts so
    that they lean away from the path of the recorder blade to avoid potential collisions
    with the blade.'
  merge: -1
  img_proc: true
- pgno: 257
  md: '![](img/baa027bed101c08b496f1f420cee8a5b_257_0.png)


    Figure 8.19 – Direction of the recorder blade versus component position


    In this section, we talked about how to use Fusion 360 to automatically orient
    our parts. We also highlighted how to utilize the ranking mechanism within the
    AUTOMATIC ORIENTATION dialog to rank the outcomes of the orientation studies based
    on the needs of a given 3D-printing technology. We covered how to choose the top-ranking
    orientation as well as secondary orientations to improve the printing success
    without making further modifications to the model for SLA, DLP, and MPBF processes.
    In the next section, we will continue positioning our parts using additional automated
    tools such as additive arrange.


    # Arranging Components Automatically


    Before utilizing 3D printing, companies often compare the cost per part against
    traditional manufacturing methods such as injection molding or CNC machining.
    When evaluating 3D printing versus injection molding for producing plastic parts,
    the economies of scale are on the side of 3D printing for prototyping and small
    production runs. It will generally be cheaper to 3D print a single component than
    injection-molding it. However, in small batch production, in order to decrease
    the per part cost of a given component, it is better practice to effectively 3D
    arrange parts within the build volume of capable hardware such as SLS and MJF
    3D printers.'
  merge: -1
  img_proc: true
- pgno: 258
  md: 'To arrange components within the build volume of a plastic powder bed printer,
    Fusion 360 offers two workflows. The first workflow can be accessed within the
    DESIGN workspace. The ARRANGE command located in the SOLID tab''s MODIFY panel
    shown in Figure 8.20 allows us to select one or more components and nest them
    within our build volume. In this section, we will demonstrate this arrangement
    functionality using an assembly of components named `3D arrange`. This assembly
    consists of four components, each with a unique name and color (Red, Yellow, Blue,
    and Green). You may recognize these models from the previous sections. To generate
    this specific model, you can either use the Derive functionality and insert these
    components from their original source into a new Fusion 360 design document, or
    simply open the provided assembly file.


    As mentioned previously, the first Arrange feature we will demonstrate is located
    in the DESIGN workspace in the SOLID tab''s MODIFY panel. After activating the
    ARRANGE command, we can select the four components that will participate in this
    arrangement. They will show up as a vertical list of items within the Objects
    tab of the ARRANGE dialog, as shown in Figure 8.20.


    ![](img/baa027bed101c08b496f1f420cee8a5b_258_0.png)


    Figure 8.20 – Arranging components in 3D within the DESIGN workspace


    If we switch to the Envelopes tab of the ARRANGE dialog, we can choose the global
    XY plane as the plane to arrange our components on. Later, we can enter the length,
    width, and height information, which represents the build volume of our 3D printer.
    In this example, we will be using 380 millimeters, 284 millimeters, and 380 millimeters
    respectively for the length, width, and height fields, representing the build
    volume of an HP Jet Fusion 5200 3D printer. This dialogue also allows us to perform
    partial arrangements. This means if we have more parts than we can fit into our
    build volume, Fusion 360 will arrange our parts so that those that can fit into
    the build volume are oriented accordingly, while parts that do not fit into the
    build volume stay in their initial position.'
  merge: -1
  img_proc: true
- pgno: 259
  md: 'This dialogue also allows us to further control the spacing between parts,
    the clearance we may want to leave between our parts and the side walls of our
    build volume, and the clearance we may want to leave between our parts, the build
    plate, and the ceiling of the build volume.


    If we activate the **Auto Preview** checkbox at the bottom of this dialog, Fusion
    360 will automatically display the potential outcome of the arrangement while
    the dialog is still active, as shown in *Figure 8.21*. In this example, as we
    are in a parametric modeling paradigm, the **Arrange** function adds a feature
    in the timeline, as shown in the following screenshot. This means if we wanted
    to change any of the inputs of this arrangement, we could select the feature on
    the timeline, right-click it, and edit it with ease.


    ![](img/baa027bed101c08b496f1f420cee8a5b_259_0.png)


    Figure 8.21 – Envelope-related inputs for 3D Arrange in the DESIGN workspace


    The next method we can utilize for arranging our components within the build volume
    of our printer is located in the **MANUFACTURE** workspace. As shown in *Figure
    8.22*, we can access the **Arrange** function within the **ADDITIVE** tab''s **POSITION**
    panel, after having created an additive setup with an appropriate 3D printer and
    its relevant print setting.'
  merge: -1
  img_proc: true
- pgno: 260
  md: '![](img/baa027bed101c08b496f1f420cee8a5b_260_0.png)


    Figure 8.22 – Arranging components within the context of the 3D printer in the
    MANUFACTURE workspace


    The **Arrange** command in the **MANUFACTURE** workspace is similar to the **ARRANGE**
    functionality we highlighted within the **DESIGN** workspace previously. Even
    though the **ADDITIVE ARRANGE** dialogue does not have the explicit option to
    allow for partial arrange, the outcome of this arrangement always arranges parts
    using this method.


    The first difference between **Additive Arrange** in the **MANUFACTURE** workspace
    and the **Arrange** functionality in the **DESIGN** workspace is that **Additive
    Arrange** does not require you to explicitly enter the build volume dimensions.
    That input comes from the active setup you created and the printer you have selected.
    The second difference between these two arrangement methods is something you may
    have noticed while comparing the outcomes of the arrangements shown in Figure
    8.21 and Figure 8.22. If you look closely at Figure 8.22, you will notice that
    the arrangement outcome is such that the parts that are being arranged are concentrated
    around the center of the build plate. This is generally a more desirable outcome,
    as SLS, MJF, and binder jetting printers tend to have higher accuracy for part
    tolerance closer to the center of the build volume. This is because the center
    of the build volume can generally maintain its temperature more consistently.
    Therefore, it is desirable to place components close to the center of the build
    volume to avoid thermally induced deformations. It is generally better to avoid
    arranging parts near the walls of the build volume.


    It is also important to have a basic understanding of the 3D arrangement solver
    Fusion 360 uses within the Arrange command. Regardless of whether you are using
    **Arrange in 2D** or **Arrange in 3D** for the **Arrangement Type** option in
    the **MANUFACTURE** workspace, as part of an additive setup, Fusion 360 utilizes
    an Outbox packer. This means that the arrangement of a given part starts with
    Fusion 360 creating a bounding box around the part. Later, Fusion 360 translates
    this box within the build volume without orienting the box or its contents in
    the process.'
  merge: -1
  img_proc: true
- pgno: 261
  md: "Outbox packers are known to pack parts in 2D and 3D really fast, but they don’t\
    \ produce the most effective packing-density results. If we want to achieve a\
    \ better 3D packing density, we have a couple of options to try. The first option\
    \ is to create copies of our parts in different orientations and see which orientation\
    \ results in better arrangement density.\n\nWe will demonstrate this concept with\
    \ the following example. However, to showcase arrangement density effectively,\
    \ we will need more than four components so that we end up with a relatively full\
    \ build volume. In Figure 8.23, you can see the same four components we worked\
    \ on being duplicated using a circular pattern within the DESIGN workspace. In\
    \ this example, we are creating 18 copies of the 4 components around the Z axis.\
    \ This means each component will be rotated by 20 degrees around the Z axis and\
    \ we will have a total of 72 components to arrange within our 3D printer’s build\
    \ volume.\n\n> **Important note**\n> \n> SLS and MJF 3D printers generally produce\
    \ parts with orthotropic material properties. This means that parts 3D printed\
    \ using SLS and MJF are weaker in the Z direction of the print. Manufacturing\
    \ engineers often identify the orientation in which to print their mission-critical\
    \ parts and then arrange duplicate components in the same orientation without\
    \ rotating them along their X or Y axes but allowing for Z-axis rotation if they\
    \ are using an automated nester or manual arrangement tools.\n\n![](img/baa027bed101c08b496f1f420cee8a5b_261_0.png)\n\
    \nFigure 8.23 – Creating a circular pattern of components in the DESIGN workspace"
  merge: -1
  img_proc: true
- pgno: 262
  md: 'Now we can switch to the **MANUFACTURE** workspace and create a new manufacturing
    model, as seen in Figure 8.24. After creating a new setup with the same HP Jet
    Fusion 5200 printer, we can arrange all 72 components in 3D using the Additive
    Arrange function. The following screenshot shows the outcome of arranging these
    72 components within the build volume. As you can see, none of the components
    have been rotated beyond their original position. They were instead translated
    into place within the bounding box of the 3D printer. As this arrangement function
    utilizes a bounding box methodology, the components will not interfere with each
    other, and they will not experience interlocking.


    Interlocking is a phenomenon where two separate components are arranged in such
    a way that after being printed, they cannot be separated. A common example of
    interlocking is the creation of a chain using two rings. If we wanted to print
    two rings, we would need to make sure that they are separate and do not interlock
    with each other. If they interlock, we cannot separate them after 3D printing
    them.


    ![](img/baa027bed101c08b496f1f420cee8a5b_262_0.png)


    Figure 8.24 – Arranging 72 components in 3D within the MANUFACTURE workspace


    As we were highlighting how to effectively arrange components within the build
    volume of our 3D printer above, we mentioned the concept of packing density. Packing
    density can be calculated while editing a manufacturing model used in an additive
    setup after all the part positioning actions are complete. After selecting the
    manufacturing model, we can right-click and edit. Right-click on the manufacturing
    model, select Properties, and access the PROPERTIES dialog for all the components
    in the build volume of our 3D printer, as shown in Figure 8.25. The PROPERTIES
    dialog shows us the total volume of components we have selected to inspect. Next,
    we will take a look at the height of the bounding box of our selected components.'
  merge: -1
  img_proc: true
- pgno: 263
  md: 'In this example, the height is 337.289 millimeters. Using the information we
    have, we can perform a quick calculation and multiply the X and Y dimensions (380
    mm and 284 mm respectively) of our 3D printer with the height value we obtained
    from the PROPERTIES dialog. Let’s call this the printer utilization volume. Next,
    we can divide the volume of the parts by the printer utilization volume to calculate
    our arrangement density:


    Arrangment density = Volume / Bounding Box Height x (Printer Length x Printer
    Width)


    ![](img/baa027bed101c08b496f1f420cee8a5b_263_0.png)


    Figure 8.25 – Inspecting the manufacturing model for the height of the bounding
    box of the arranged components


    In this example, our arrangement density based on the printer utilization volume
    is approximately 4.4%. This is a good start, but we could have achieved a higher
    arrangement density if we used a rectangular pattern along the X or Y axes instead
    of a circular pattern around the Z axis while creating the duplicate components,
    as shown in Figure 8.26.'
  merge: -1
  img_proc: true
- pgno: 264
  md: '![](img/baa027bed101c08b496f1f420cee8a5b_264_0.png)


    Figure 8.26 – Arrangement outcome of duplicate parts created using a rectangular
    pattern


    Alternatively, we could have oriented all the components using the Minimize Build
    Height command in the POSITION panel of the ADDITIVE tab, as shown in Figure 8.27.
    Please note that the following screenshot demonstrates the outcome of this workflow
    after having created a new manufacturing model (Manufacturing Model 3) and a new
    setup (Setup3) that uses the new manufacturing model as input.


    ![](img/baa027bed101c08b496f1f420cee8a5b_264_1.png)


    Figure 8.27 – Minimizing build height and 3D arranging all components'
  merge: -1
  img_proc: true
- pgno: 265
  md: 'Once the parts are in an orientation where they occupy the least amount of
    Z height, we can perform the Additive Arrange functionality. Figure 8.27 shows
    the outcome of Additive Arrange after having reoriented the parts using the minimized
    build height. You can see that this outcome has a much higher arrangement density
    based on the printer utilization. If needed, we could also manually move the components
    after the automatic ADDITIVE ARRANGE action is complete. Sometimes automated solutions
    cannot identify the best outcome, whereas, as manufacturing engineers, we can
    visually spot certain part orientations and positions that will benefit the overall
    arrangement density.


    # Summary


    In this chapter, we talked about how to position and arrange our components for
    3D printing. We started the chapter by showcasing how to translate and rotate
    our components manually using the move commands available within the MANUFACTURE
    workspace in the context of an additive setup. We also covered how to automatically
    orient our parts using explicit functions such as Minimize Build Height and Automatic
    Orientation. We talked about the various ranking options available within the
    AUTOMATIC ORIENTATION dialog so that the outcomes of an orientation study are
    ranked based on the needs of our additive technology. We ended the chapter by
    demonstrating how to arrange our components within the 3D build volume of our
    printer. In the final section, we covered how to use the automated arrange tools
    for existing orientations of components. We explained how we can orient and arrange
    our components within the DESIGN workspace, as well as the MANUFACTURE workspace
    in the context of an additive setup. We highlighted the benefits of using Additive
    Arrange in the MANUFACTURE workspace and talked about how to combine part orientation
    and part arrangement to achieve a higher arrangement density.


    Now that we know how to arrange and orient our parts for 3D printing, we can start
    focusing on how to print each component with unique process parameters. In the
    next chapter, we will cover how to assign unique print settings to each component
    in order to modify how each component is printed, thereby impacting its physical
    properties.'
  merge: -1
  img_proc: true
