- pgno: 267
  md: '# Print Settings


    Welcome to Chapter 9. In the previous chapters, we learned how to model for 3D
    printing and how to create an additive setup and position our components within
    that setup. We talked about effective ways to orient our parts and utilize 3D
    arrangement tools to get the most out of our 3D printer.


    In this chapter, we will focus on print settings. We will highlight how to modify
    certain inputs within the print settings and their impact on the model that is
    being printed. We will also cover different print settings for different additive
    manufacturing technologies. Finally, we will touch upon how to assign a unique
    print setting on different parts within the build volume of our printer so that
    we can control how each part is printed.


    Most people start their 3D printing journey by printing one component at a time.
    As they get more comfortable with 3D printing, they move on to printing multiple
    components in a single print. An important step to gaining that confidence relies
    on a better understanding of how to fine-tune our print profiles so that we can
    get reliable and successful prints from our 3D printer.


    This phase of learning how to 3D print consistently will likely require some experimentation
    on your end with your specific 3D printer. The subjects we will cover in this
    chapter will make it easier for you to experiment with various print settings
    and dial in your print profiles for your specific printer and material.


    In this chapter, we will cover the following topics:


    +   - Overview of print settings for fused filament fabrication

    +   - Overview of print settings for SLA and DLP printing

    +   - Assigning unique print settings to bodies


    In some cases, it may be necessary to edit the selected print setting to change
    a certain aspect of the printing process. For example, if you are experiencing
    print failures due to your parts not sticking to the build plate, you may want
    to add a skirt or a brim to improve print bed adhesion. If your 3D-printed parts
    are not solid enough, you may want to increase the infill density or the number
    of perimeters. In some cases, you may want to use a different print setting for
    a different part of the print. All of these and more will be explored in this
    chapter.'
  merge: -1
  img_proc: true
- pgno: 268
  md: 'By the end of this chapter, you will have a better understanding of what makes
    a print setting in Fusion 360. You will learn that most print settings have multiple
    presets and you will understand the differences between those presets. You''ll
    learn how to create your own presets and customize existing ones by changing certain
    print settings. You''ll gain a solid understanding of key print settings and their
    impact on the additive toolpaths and slices Fusion 360 creates when generating
    the machine file. You will also learn how to assign print settings per body within
    a component and the impact on the additive toolpath.


    # Technical requirements


    All topics covered in this chapter are accessible for Personal, Trial, Commercial,
    Startup, and Educational Fusion 360 license types.


    Certain Fusion 360 additive machines and print settings, such as the metal powder
    bed fusion (MPBF) 3D printers and their respective print settings, are not available
    until gaining access to the Additive Build Extension. As with all other Fusion
    360 extensions, the Additive Build Extension is not available for Personal use.
    As we will not cover topics specific to metal 3D printing in this chapter, you
    should be able to follow along with all the examples in this chapter with no issues.


    If you have a Commercial license of Fusion 360, to create an additive setup with
    an MPBF machine, you will also need access to the Additive Build Extension (https://www.autodesk.com/products/Fusion-360/additive-build-extension).


    Autodesk offers a 14-day trial for the Additive Build Extension for all Commercial
    users of Fusion 360. You can activate your trial within the Extensions dialog
    of Fusion 360.


    The lesson files for this chapter can be found here: https://github.com/PacktPublishing/3D-Printing-with-Fusion-360.


    # Overview of print settings for Fused Filament fabrication


    In this first section, we will focus our efforts on print settings that are specific
    to fused filament fabrication (FFF) additive manufacturing. To demonstrate how
    to access and edit print settings for FFF, we will be using a CAD model named
    Knobs, as shown in Figure 9.1. This part is actually the dial knob for a Prusa
    i3 MKS+ 3D printer and is available to download as a mesh object on printables.com
    as one of the 38 components uploaded by Prusa Research as replacement parts for
    this 3D printer (https://www.printables.com/model/57217-i3-mk3s-printable-parts/).
    So, if you wanted to, you could download and print this part with a different
    colored filament or a different material and swap out your existing knob on your
    printer.'
  merge: -1
  img_proc: true
- pgno: 269
  md: 'In this example, we will be using a solid (not the original mesh) version of
    this part. After opening the part in Fusion 360 and switching to the **MANUFACTURE**
    workspace, we can create an additive setup using the **Prusa i3 MK S+** printer
    and the **PLA (Direct Drive)** print setting, as shown in Figure 9.1. If we expand
    the print setting, we will notice that the preset that is assigned to this part
    is named **Normal**. If we want to edit a print setting or a preset, we can do
    so by right-clicking on the print setting within the active setup and selecting
    **Edit**. Another way is to go to **Print Setting Library** from the **MANAGE**
    panel. Within **Print Setting Library**, we can select the print setting we wish
    to customize from **Fusion 360 library**, and copy and paste it into either our
    **Cloud**, **Local**, or **Linked** library, as shown in Figure 9.1.


    ![](img/baa027bed101c08b496f1f420cee8a5b_269_0.png)


    Figure 9.1 – Managing print settings within Print Setting Library


    Once a print setting is saved under a folder within the **My print settings**
    section of **Print Setting Library**, we can select it, right-click on it, and
    edit it for further customization, as shown in Figure 9.2.'
  merge: -1
  img_proc: true
- pgno: 270
  md: '![](img/baa027bed101c08b496f1f420cee8a5b_270_0.png)


    Figure 9.2 – Editing a print setting located in a Local folder


    After selecting the Edit option, we will now see the Print Setting Editor dialog.
    We introduced this dialog in the previous chapter and talked about how to search
    for specific print settings and edit some of the key inputs. In this chapter,
    we will do a deeper dive and highlight all the options available within Print
    Setting Editor. The Print Setting Editor dialog consists of two main areas. The
    left portion is its browser, and the right portion allows us to change the input.
    The FFF print settings are made up of Information, General, and Body Presets.
    If you select Information on the browser, the Information input field will be
    displayed on the right-hand side. Figure 9.3 shows our first modification to this
    print setting, which is the addition of the - CUSTOMIZED suffix to the name of
    the selected print setting.


    ![](img/baa027bed101c08b496f1f420cee8a5b_270_1.png)


    Figure 9.3 – Modifying the Information field for a print setting'
  merge: -1
  img_proc: true
- pgno: 271
  md: 'If you select **General** on the browser, you will be able to modify the input
    for **Global Settings**, **Nozzle Priming Settings**, and **Additional G-Code
    Settings.**


    > **Important note**

    > Please keep in mind that not all 3D printers are capable of managing all these
    inputs. For example, if you have a printer without a heated print bed, the **Print
    Bed Temperature** field will have no effect on your print.


    # General


    The **General** section of an FFF print setting is where you can modify some of
    the most common input fields when customizing your print profiles. *Figure 9.4*
    shows all the input fields you can customize within the **General** section for
    an FFF print setting. This section is divided into three categories: **Global
    Settings**, **Nozzle Priming Settings**, and **Additional G-Code Settings**. In
    the following subsection, we will go over some of the critical input fields within
    each of these categories and their use cases.


    # *Global Settings*


    The **Global Settings** subsection located within the **General** section of **Print
    Setting Editor** is probably the most important part of the print settings. This
    is where you can edit things such as the build plate temperature and control the
    height of each layer as well as your first layer. You can also adjust how fast
    your extruder will move during printing and decide whether you want to print your
    parts as they’re designed or only their shell using the vase mode. Let’s take
    a moment and go through each one of these options and their role in generating
    the additive toolpath:


    +   - **Print Bed Temperature (Temp C)**: This is a material-specific input that
    sets the temperature of the print bed before starting the printing process. A
    heated bed helps with print bed adhesion of the first layer. In Figure 9.4, the
    print bed temperature is set to 60°C, which is the recommended bed temperature
    for printing with a PLA filament. If you were using ABS, this input would be 85°C.

    +   - **Layer Height (mm)**: This input specifies the height of each layer. You
    can reduce the value for better print quality or increase it for a faster print.
    The upper and lower limits of layer height are dependent on your nozzle size.

    +   - **Layer 1 Height (mm)**: This input specifies the height of the first layer
    of your 3D print. Typically, this input should be 50 to 75% of your nozzle diameter
    to achieve a successful print bed adhesion on the first layer.

    +   - **Travel Speed (mm/s)**: This input specifies the speed with which your
    extruder will be moving when traveling between points while not extruding filament.
    In general, you would want this input to be as close to the maximum speed your
    printer can handle to reduce print time.'
  merge: -1
  img_proc: true
- pgno: 272
  md: '+   - **Spiral Vase Mode:** When activated, this will print the part in your
    active setup using one continuous spiral motion to create a hollow, single-walled
    object. This mode results in fast print times and avoids any travel and retraction
    moves during 3D printing. If enabled, many of the inputs within the **Body Presets**
    section will be ignored as they will no longer be applicable.


    # Nozzle Priming Settings


    The **Nozzle Priming Settings** subsection located within the **General** section
    of **Print Setting Editor**, as shown in Figure 9.4, controls all the options
    related to printing a prime line before the extruder starts working on your part.
    Let''s highlight some of the key features you can control around the prime line:


    +   - **Nozzle Priming:** Enabled by default, this option will print a single
    line at the front, the left, or the right-hand side, or the back of your print
    bed. The location of the priming line will depend on your part arrangement in
    the additive setup and the availability of unused space on the print bed. Printing
    a prime line prepares the nozzle for 3D printing. By printing a prime line, you
    ensure that the filament is extruding correctly before printing your part.

    +   - **Prime Edge Clearance Distance (mm):** This input controls how far away
    the prime line should be from the border of your build plate.

    +   - **Prime Maximum Length (mm):** This input controls the maximum length of
    your prime line. I recommend increasing this number to match the X or Y dimension
    of your 3D printer''s build plate.


    ![](img/baa027bed101c08b496f1f420cee8a5b_272_0.png)


    Figure 9.4 – The General tab of Print Setting Editor for FFF print settings'
  merge: -1
  img_proc: true
- pgno: 273
  md: 'Within the General section of Print Setting Editor, you can also control additional
    G-code settings, as shown in Figure 9.4. By default, any G code you generate always
    starts at the home position and ends at the park position. If your 3D printer
    has support for it, you can also generate G2 and G3 moves by checking the corresponding
    checkbox in this dialog. This action would help create a G-code file with single
    G2/G3 rows of text instead of multiple G1 rows of text to represent an arc-shaped
    toolpath in a given slice. If you are not familiar with it, G2 is for a clockwise
    arc, and G3 is for a counterclockwise arc. Using a single row of G code to represent
    the arc is more efficient for file size and results in higher-quality/smoother
    3D prints.


    # Body Presets


    The next section within Print Setting Editor for an FFF print setting is Body
    Presets. By default, all print settings included in Fusion 360''s Print Setting
    Library have two body presets. They are named Normal and Strong. If you select
    one of the presets, you can change its name and description on the right-hand
    side, as shown in Figure 9.5. In this figure, we are changing the preset name
    from Normal to Medium.


    ![](img/baa027bed101c08b496f1f420cee8a5b_273_0.png)


    Figure 9.5 – Changing a body preset name and description


    We can also right-click on a body preset and duplicate it. After duplicating a
    body preset, you will see a new entry at the bottom of the browser of Print Setting
    Editor. In Figure 9.6, you will see that a new entry, Medium 1, was added after
    duplicating the body preset named Medium.'
  merge: -1
  img_proc: true
- pgno: 274
  md: '![](img/baa027bed101c08b496f1f420cee8a5b_274_0.png)


    Figure 9.6 – Duplicating body presets


    If you look back at Figure 9.6, you can see an icon with a blue checkmark in a
    gear next to the body preset named Medium. This icon indicates that this body
    preset is the default preset. If you select a preset that is not the default preset,
    you can right-click on it and make it a default preset, as shown in Figure 9.7.
    If you were to make this change to this print setting, any subsequent additive
    setup you create using this print setting would automatically assign Medium 1
    as the body preset to all components within that setup.


    ![](img/baa027bed101c08b496f1f420cee8a5b_274_1.png)


    Figure 9.7 – Setting a body preset as default'
  merge: -1
  img_proc: true
- pgno: 275
  md: 'If we expand a given body preset by selecting the arrowhead to the left of
    it, as shown in Figure 9.8 for the body preset named Medium, we can see a number
    of entries that control different aspects of the Body Preset setting, such as
    Extrusion, Shell, Infill, and several others. Next, let''s dive into some of these
    settings and explain what they are.


    # Extrusion


    The input fields within the Extrusion subsection of a given body preset control
    which extruder is used for printing bodies within an additive setup and certain
    settings associated with that extruder. If we are creating an additive setup using
    a 3D printer with a single extruder, we will only see the subheadings called Extrusion
    and Extruder 1 when editing the print setting for that setup, as shown in Figure
    9.8. Only when editing a print setting associated with a multi-extruder printer
    can we see additional extruder subheadings in this dialog.


    ![](img/baa027bed101c08b496f1f420cee8a5b_275_0.png)


    Figure 9.8 – Extrusion settings for the default body preset of a PLA (Direct Drive)
    print setting'
  merge: -1
  img_proc: true
- pgno: 276
  md: 'The **Extrusion** subheading controls the width of the first layer as well
    as print bed adhesion with dimensions for brim, skirt, and raft. It also has inputs
    to modify the extrusion width of key toolpath types such as **Perimeter**, **Infill**,
    **Bridge**, and **Support** structures. Within the **Extruder 1** subheading,
    you can modify another critical input, **Extruder Temperature (Temp C)**. In *Figure
    9.8*, the value shown for this input is 215°C, which is the appropriate temperature
    to 3D print a PLA filament. If we were to edit a print setting for a different
    material such as ABS, this value would be prepopulated with the appropriate temperature
    of **250°C**.


    In the next section, we will learn how to control various settings related to
    3D printing the outer surface of your parts. We will highlight how to modify the
    number of perimeters and top and bottom layers, as well as how to avoid surface
    imperfections at the beginning of each layer.


    # *Shell*


    When slicing a model for FFF, one of the first things a slicer does is create
    a shell of the model. The options we have within the **Shell** subsection of **Body
    Presets** in **Print Setting Editor** allow us to have full control over these
    options to create and slice that shell. Let’s take a look at some of the most
    common settings you may want to modify to generate a 3D print with a smooth outer
    surface:


    +   - **Number of Perimeters, Number of Top Layers, and Number of Bottom Layers**:
    As shown in *Figure 9.9*, within the **Shell** section of a given body preset,
    you can control how many lines of toolpath you want to have around the perimeter
    of your component, as well as how many top and bottom layers you want the slicer
    to include. The higher the number of perimeters, top layers, and bottom layers
    you include when slicing your model, the stronger it becomes along those sections.
    The top and bottom layers are unique in that the slicer adds 100% infill to those
    layers, making them fully solid. *Figure 9.9* shows a model that has two perimeters.
    For the layer displayed in the figure, layer 121, the red line represents the
    outer perimeter and the green line represents the inner perimeter.

    +   - **Randomize Z-Seam Alignment**: When activated, this setting allows you
    to distribute any imperfections you may have on the perimeter of your model so
    that they are not all aligned with the Z axis. If unchecked, your printed model
    may have a seam/zipper effect.

    +   - **Print Inner Perimeters First**: When 3D printing a given layer, the extrusion
    has to start somewhere. Slicers tend to start extruding each layer at a point
    along the outer perimeter of your model. When active, this setting forces the
    extrusion to start along the inner perimeter of a given slice. In *Figure 9.9*,
    the inner perimeter is represented with green lines. Activating this checkbox
    forces any imperfection at the beginning of a given layer to be hidden within
    the inner perimeter of the body.'
  merge: -1
  img_proc: true
- pgno: 277
  md: "![](img/baa027bed101c08b496f1f420cee8a5b_277_0.png)\n\nFigure 9.9 – Shell settings\
    \ for the default body preset of a PLA (Direct Drive) print setting\n\nBy modifying\
    \ these options, you can slice and print the shell of your models with your FFF\
    \ printer so that you end up with your desired surface quality and strength-to-weight\
    \ ratio for your parts. In the next subsection, we will learn how to modify the\
    \ options for the interior of our parts.\n\n# Infill\n\nWhen slicing a model for\
    \ FFF, the term infill represents the internal section of the 3D-printed part.\
    \ This internal volume can be manufactured using many different shapes. The purpose\
    \ of the infill is to minimize the part's weight while keeping it as strong as\
    \ possible and reducing printing time. There are many different types of infill\
    \ patterns Fusion 360 offers within the Infill Pattern dropdown located in the\
    \ Infill subheading of a given body preset, as shown in Figure 9.10. The same\
    \ figure also shows three components being printed with a 25% density Gyroid infill.\
    \ Notice how the internal sections of all the parts are not printed solid with\
    \ filament, but rather, are being manufactured mostly hollow with gyroid-style\
    \ toolpaths.\n\n> **Important note**\n> \n> A recent study on all infill patterns\
    \ available within Fusion 360 (as documented in the blog at https://www.autodesk.com/products/fusion-360/blog/how-to-build-sustainable-3d-printing-infill-practices/)\
    \ concluded that the Gyroid infill is the most sustainable infill type as it prints\
    \ the fastest while minimizing filament consumption."
  merge: -1
  img_proc: true
- pgno: 278
  md: '![](img/baa027bed101c08b496f1f420cee8a5b_278_0.png)


    Figure 9.10 – Infill settings for the default body preset of a PLA (Direct Drive)
    print setting


    By modifying these options, you can slice and print the insides of your models
    with your FFF printer so that you end up with a lightweight part that you can
    print faster while consuming less material and energy. In the next subsection,
    we will learn how to modify the options to achieve good adhesion to the build
    plate while printing our first layer.


    # Print Bed Adhesion


    One of the most important considerations when slicing models for 3D printing with
    FFF is the topic of print bed adhesion. A key failure when 3D printing occurs
    as a result of issues around parts not sticking to the print bed. Fusion 360 offers
    several tools to overcome this potential failure within the Print Bed Adhesion
    subheading of Print Setting Editor for a given body preset.


    Within the Print Bed Adhesion subheading, you can control how many layers to disable
    the cooling fan for so that the first few layers can be printed without the cooling
    effect the fan provides. In addition, you can select from one of three Print Bed
    Adhesion options that Fusion 360 provides:


    +   - **Skirt/Brim:** Even though Skirt and Brim have explicit options to choose
    from within the **Print Bed Adhesion type** dropdown, they are effectively going
    to give you the same toolpath when slicing your model. Both a skirt and a brim
    will follow the perimeter of the first layer of your part and will lay down additional
    lines of toolpath around the outer perimeter. You can control how many loops of
    skirt or brim you want to add around the perimeter of the body. If you choose
    Skirt for **Print Bed Adhesion type**, you have one additional control, which
    is the distance between the skirt and the perimeter of your body. If you enter
    0 in this field, you will'
  merge: -1
  img_proc: true
- pgno: 279
  md: 'essentially generate a brim. As these two are almost interchangeable options,
    when simulating the toolpath, Fusion 360 displays Skirt and Brim as the same color
    in the legend, as shown in Figure 9.9.


    +   - **Raft:** When 3D printing with materials that are more prone to warping
    and causing bed adhesion issues, you may choose to use a raft, as rafts help stabilize
    models and create a strong base on which you can print the rest of your part.
    If you choose **Raft** for **Print Bed Adhesion type**, Fusion 360 will activate
    additional **Raft** settings, as shown in Figure 9.11. The default settings for
    a raft will result in a three-layer **Raft** object with varying infill densities
    for the bottom layer, middle layer, and top layer. You can also control the border
    offset of your raft from the perimeter of the first layer of your model.


    ![](img/baa027bed101c08b496f1f420cee8a5b_279_0.png)


    Figure 9.11 – Print Bed Adhesion settings'
  merge: -1
  img_proc: true
- pgno: 280
  md: 'By modifying these options, you can achieve a good adhesion to the build plate
    while printing your first layer. In the next subsection, we will learn how to
    modify the options to slice and generate toolpaths for support structures you
    can generate within Fusion 360 for FFF additive setups.


    # *Support*


    Even though it is possible to manufacture certain overhanging faces with bridging
    techniques, in most cases, we rely on generating support structures when an overhang
    angle is more than 45 degrees so that our part''s down-facing surfaces can be
    printed successfully.


    When preparing our models for printing with FFF, Fusion 360 offers three support
    types: **volume supports**, **bar supports**, and **setter supports**. Setter
    supports are mainly used for 3D printing with a metal filament or 3D printing
    using metal binder jetting technologies to help support the part during the sintering
    process. In order to generate a setter support, we need access to the Additive
    Build Extension. We will not cover setter supports further here as they are not
    applicable to any of the examples we are showcasing.


    Within an additive setup with an FFF machine, you can generate volume and bar
    supports and we can mix and match support types, meaning we can support one face
    with volume supports and another face with bar supports. Therefore, Fusion 360
    also allows you to control how you slice and generate toolpaths for these support
    structures. You can control which extruder is used for a given support structure
    as well as how many perimeters are utilized in the toolpath generation for bar
    versus volume supports. You can also control the number of top and bottom layers
    and how much infill density is required when generating the toolpath for a support
    structure within the **Support** subheading of the body preset, as shown in *Figure
    9.12*.


    One setting I would like to highlight in this section is **Support-to-Body Horizontal
    Gap (mm)**. This input controls how much horizontal space Fusion 360 leaves between
    your support structures and any vertical wall on the perimeter of your part. If
    you increase this number, you will have a bigger clearance between your support
    structures and your parts along the vertical walls, eliminating possible bonding
    between the part and the support structure. This setting does not control the
    distance between the support and the down-facing surfaces of your part. We will
    cover how to control such options in *Chapter 10*, in which we talk about how
    to generate support structures.'
  merge: -1
  img_proc: true
- pgno: 281
  md: '![](img/baa027bed101c08b496f1f420cee8a5b_281_0.png)


    Figure 9.12 – Support settings


    By modifying these options, you can control exactly how Fusion 360 slices the
    volume and bar supports that are commonly used in FFF setups. In the next subsection,
    we will learn how to modify the options to control the speed with which to extrude
    material within Fusion 360 for FFF additive setups.


    # Speed


    One of the main drawbacks of FFF is the time it takes to print large parts. This
    is why you may want to modify the Speed settings within the Body Presets section
    of Print Setting Editor for your selected print setting. These settings are very
    self-explanatory. You can control how fast to execute various extrusion types
    such as first layer, perimeter, infill, support, bridge, and raft.'
  merge: -1
  img_proc: true
- pgno: 282
  md: 'If you activate the **Acceleration** checkbox, you can also control the **Acceleration**
    inputs for travel and extrusion actions. In addition, Fusion 360 also allows you
    to control the maximum instantaneous velocity change while printing. This setting
    is called **Jerk** and is located at the bottom of the **Speed** subheading menu,
    as shown in *Figure 9.13*. Before making changes to the **Speed**, **Acceleration**,
    and **Jerk** settings, you should be aware of the specifications of your 3D printer
    so as to not exceed the velocity and acceleration values based on your machine''s
    limitations.


    ![](img/baa027bed101c08b496f1f420cee8a5b_282_0.png)


    Figure 9.13 – Speed settings


    By editing the options within the **Speed** subsection of **Print Setting Editor**,
    you can have full control over the velocity, acceleration, and jerk behavior of
    your 3D prints. In the next subsection, we will cover how to modify the speed
    with which the nozzle travels when not extruding material.


    # *Travel*


    Travel lines are the movement of the nozzle without extrusion during FFF 3D printing.
    The **Travel** subheading within **Body Presets** controls the various inputs
    for travel during slicing.'
  merge: -1
  img_proc: true
- pgno: 283
  md: 'If you are experiencing issues with your extruder hitting your print or generating
    blobs on the surface of your model due to oozing material, you may want to activate
    Rapid Z Lift. This setting will elevate your extruder by a set distance when traveling
    from one section of your model to another while printing. This should prevent
    your nozzle from hitting the previously extruded sections of your part, help reduce
    blobs, and decrease print failures. However, this option will add extra time to
    your prints. Therefore, you may also want to enable Rapid Z Lift Diagonal Move
    to minimize the time you will spend when performing Rapid Z Lift actions. Fusion
    360 also performs a Nozzle Wipe action by default for all print settings. This
    command will drag the nozzle a set distance over the extrusion that was just performed,
    with the extruder off, to help wipe the nozzle and potentially minimize stringing.


    ![](img/baa027bed101c08b496f1f420cee8a5b_283_0.png)


    Figure 9.14 – Travel settings


    By modifying these options, you can achieve an overall reduced print time and
    increase your chances of a successful print by avoiding crashes between your extruder
    and your parts. In the next subsection, we will learn how to modify the options
    to tessellate parts within Fusion 360 before slicing them within an additive setup.


    # Tessellation


    When we are working with solid bodies in an additive setup, in order to slice
    them and create toolpaths, Fusion 360 first tessellates those bodies and turns
    them into a mesh representation. In order to go through this conversion, it relies
    on the values shown within the Tessellation subheading of a given body preset.
    We already covered how to tessellate models in great detail in Chapter 5. The
    Tessellation'
  merge: -1
  img_proc: true
- pgno: 284
  md: 'settings shown in Figure 9.15 correspond to the same Tessellation settings
    we covered within the design workspace of Fusion 360 when converting a solid body
    to a mesh body. By default, the Tessellation settings used for all print settings
    are such that Fusion 360 will create a high-quality mesh so that the mesh body
    used for slicing our models is an accurate representation of our solid body.


    ![](img/baa027bed101c08b496f1f420cee8a5b_284_0.png)


    Figure 9.15 – Tessellation settings


    Now that we''ve highlighted how to make changes to a print setting within our
    local Print Setting Library, it is time for us to assign this print setting to
    our active additive setup. As shown in Figure 9.16, we can select the ADDITIVE
    setup, right-click, and edit it. When we are editing the setup, we can choose
    a new print setting. We will have to navigate to the Local folder, within the
    My print settings section of Print Setting Library, and choose the print setting
    we recently customized called PLA (Direct Drive) - CUSTOMIZED and press Select
    and OK to finish editing the setup.'
  merge: -1
  img_proc: true
- pgno: 285
  md: '![](img/baa027bed101c08b496f1f420cee8a5b_285_0.png)


    Figure 9.16 – Selecting a custom print setting within an additive setup


    Once we have selected the print setting that we modified in the previous sections
    of this chapter, you will notice that the active setup now displays a new entry
    named PLA (Direct Drive) - CUSTOMIZED, and under that entry, a body preset named
    Medium is shown, indicating that our part will be sliced using that body preset.


    ![](img/baa027bed101c08b496f1f420cee8a5b_285_1.png)


    Figure 9.17 – Observing the selected print setting and body preset in the browser'
  merge: -1
  img_proc: true
- pgno: 286
  md: 'In this section, we have focused on various print settings for FFF 3D printing.
    We discussed copying a given print setting from the Fusion 360 library into our
    local libraries. We covered how to modify that print setting and demonstrated
    the impact of various settings on how our models are supported and sliced, and
    how the toolpath is generated. In the next section, we will start looking at print
    settings for other 3D printing technologies.


    # Overview of print settings for SLA and DLP


    An additive setup within the **MANUFACTURE** workspace of Fusion 360 is for more
    than just desktop FFF printers. By using Fusion 360, you can set up your prints
    for resin-based printers, which utilize **stereolithography (SLA)** and **digital
    light processing (DLP)**. Just as we have copied an existing FFF print setting
    from Fusion 360''s library to our local library and edited it in the previous
    section, we will do the same for SLA and DLP print settings in this section.


    *Figure 9.18* shows a print setting named **Autodesk Generic DLP** copied from
    Fusion 360''s **Print Setting Library** to **My print settings | Local** to be
    customized. As you can see in the same figure, the DLP print setting browser structure
    is very similar to an FFF print setting browser structure. This DLP print setting
    has three sections, named **Information**, **General**, and **Body Presets**.
    *Figure 9.18* shows the **General** subsection of the print setting where you
    can configure various build parameters. The main editable field within **Configure
    Build Parameter (EBPA) Settings** is **Layer Thickness**. Even though the units
    are not shown for layer thickness in this dialog, they are in microns and can
    be seen when selecting the print setting in the **Information** panel in **Print
    Setting Library**.


    Within the **PNG Export** subsection, the first six inputs are critical in order
    to generate the desired PNG files with the correct size:


    +   - **Min X** and **Min Y**: These inputs control the minimum X and Y coordinates
    of the image to be captured on every layer within the build volume. A value of
    0 means you will capture all your images starting from the bottom-left corner
    of your build platform. I would not recommend changing these inputs if you want
    to capture the entire build.

    +   - **Size X** and **Size Y**: These inputs control the maximum X and Y coordinates
    of the image to be captured on every layer within the build volume. The units
    for these two inputs are in millimeters. You definitely want to change these inputs
    to match your printer''s printable X and Y dimensions. For example, if your printer
    has a printable build volume of 320 millimeters by 240 millimeters, you will want
    to type those numbers in for the **Size X** and **Size Y** input fields, respectively,
    within this print setting before slicing your models. Otherwise, the images you
    will export from Fusion 360 will be only a subsection of the entire build area.

    +   - **Image Size X** and **Image Size Y**: These inputs control the pixel size
    of the images you will export. Typically, these numbers should be a multiplier
    of the numbers you have entered in **Size X** and **Size Y**. For example, if
    you have a printer with a printable build area of 320 by 240 millimeters, you
    can enter an **Image Size X** and **Image Size Y** input of 640 and 480 pixels,
    respectively. If you enter values that are not multipliers of the **Size X** and
    **Size Y** values, you will get distorted images during slicing and, therefore,
    distorted objects during the printing process.'
  merge: -1
  img_proc: true
- pgno: 287
  md: '+   - **Flip Image**: Depending on the placement and the model of the projector
    (LCD versus DLP) your 3D printer is using, you may need to export mirror images
    for all your slices so that you don''t 3D print a mirror image of the object.

    +   - **PNG Filename Prefix**: Different 3D printers have different requirements
    for how PNG files should be named. Using this input field, you can customize how
    each PNG is named by adding a prefix. If you simply keep the existing prefix of
    `image_`, the resulting PNG files will be named `image_000.png`, `image_001.png`,
    and so on.


    ![](img/baa027bed101c08b496f1f420cee8a5b_287_0.png)


    Figure 9.18 – Autodesk Generic DLP print settings


    After creating an additive setup with an Autodesk Generic SLA/DLP printer and
    the **Autodesk Generic DLP** print setting, if you select **Create Machine Build
    File** located within the **ACTIONS** panel of the **ADDITIVE** tab, you will
    be able to export each slice as a PNG file with your specifications, compressed
    as a single ZIP file. You can then further edit the ZIP file to include any additional
    TXT or XML files your printer may need before transferring it to your 3D printer
    for manufacturing your models.'
  merge: -1
  img_proc: true
- pgno: 288
  md: 'The next print setting I would like to highlight is the **Autodesk Generic
    SLA** print setting. If you select this print setting from Fusion 360’s **Print
    Setting Library** and copy it over to your local library, you can edit the print
    setting in **Print Setting Editor**, as shown in *Figure 9.19*. Much like the
    **Autodesk Generic DLP** print setting and all the FFF print settings, the **Autodesk
    Generic SLA** print setting contains subsections named **Information**, **General**,
    and **Body Presets**. The **General** subsection is where we can edit **Layer
    Thickness** in microns. This print setting allows us to create a machine build
    file that generates either a **stereolithography contour (SLC)** file or a ZIP
    file. This ZIP file contains one or multiple SLC files. SLC files are files that
    contain slice information for an SLA printer. Within the print settings, you can
    control whether you want to create unique files for each part and/or unique files
    for each of the support structures you may have generated during the additive
    setup. You can also choose to use the name of the component as the filename when
    exporting SLC files. Fusion 360 automatically includes a postfix for the name
    of the support structure. The default postfix is _s. If you use the default settings
    and export an SLC ZIP file, it will contain the following two SLC files:


    +   - Component1_Body1.slc

    +   - Component1_Body1_s.slc


    This is assuming that your additive setup contains a single body component named
    Component 1 and that you have added a support structure to it.


    ![](img/baa027bed101c08b496f1f420cee8a5b_288_0.png)


    Figure 9.19 – Autodesk Generic SLA print settings'
