- pgno: 356
  md: 'In the following section, we will introduce metal 3D printing using powder
    bed fusion technology. We will also talk about the unique support structures you
    can create using Fusion 360 for this additive manufacturing technology.


    # 3D printing with metal powder bed fusion machines


    MPBF is a fully supported additive manufacturing technology in Fusion 360 for
    3D printing parts with metal powders. Fusion 360’s Machine Library currently has
    MPBF printers from the following nine machine makers: Aconity, Additive Industries,
    DMG Mori, EOS, Kurtz Ersa, One Click Metal, Renishaw, SLM Solutions, and Xact
    Metal. Having access to the Additive Build extension is a prerequisite to creating
    an additive setup with an MPBF 3D printer from any of these machine providers.


    In addition to these nine machine makers, you can also use the Autodesk Generic
    MPBF machine to create an additive setup, as shown in Figure 12.7. After creating
    the setup and arranging your parts on the build platform, assuming you do not
    need support structures, you can generate the necessary machine files for 3D printers,
    which can utilize generic file formats such as SLC and CLI. You can access the
    Create Machine Build File command from the ACTIONS panel of the ADDITIVE tab within
    the MANUFACTURE workspace. The CREATE MACHINE BUILD FILE dialogue will allow you
    to specify the Exporter component you wish to use while creating the toolpath
    file for your printer:


    ![](img/baa027bed101c08b496f1f420cee8a5b_356_0.png)


    Figure 12.7 – Additive setup with an Autodesk Generic MPBF printer


    Now that we have created an additive manufacturing setup with a generic MPBF printer,
    let’s demonstrate how to create a similar setup with a 3D printer from a specific
    machine vendor.'
  merge: -1
  img_proc: true
- pgno: 357
  md: 'In this next exercise, we will utilize a component designed with automated
    modeling in Fusion 360 to create an additive setup with a One Click Metal MPRINT+
    printer. After switching to the MANUFACTURE workspace, we can create an additive
    setup within the ADDITIVE tab. During the setup creation, when selecting our printer,
    we can select an associated print setting. In Figure 12.8, Setup1 is created using
    a print setting named OCM MPRINT+ SS316L 40 Micron ATU. This is one of two print
    settings that are included with Fusion 360 for this printer. These two print settings
    are for demonstration purposes only. If you have a One Click Metal (OCM) printer,
    you will receive a print setting from your OCM sales team for the material you
    are 3D printing with. After selecting the printer and the print setting, you can
    select OK within the SETUP dialogue and create an additive setup:


    ![](img/baa027bed101c08b496f1f420cee8a5b_357_0.png)


    Figure 12.8 – Creating an additive setup with an OCM printer


    Once the setup has been created, one of the first things we must do is arrange
    our parts within the build volume. For MPBF printers, we generally utilize the
    2D Arrange option, as shown in Figure 12.9. This arrangement type allows us to
    organize our parts within the build volume of our printer so that we can print
    multiple parts effectively. In this example, as we are only printing a single
    part, we don’t have to worry about the object spacing input within the ADDITIVE
    ARRANGE dialogue. The 2D arrangement type will automatically place the selected
    component around the center of our build plate while making sure that our part
    is away from the edges of the platform at a distance, as indicated in the Frame
    Width input field.


    We also want to make sure that our parts are above the build plate by a certain
    amount. In this example, we are using a 3 mm clearance between the build plate
    and our component. We need such a platform clearance so that our parts can be
    separated from the build plate using a bandsaw without damaging the printed model:'
  merge: -1
  img_proc: true
- pgno: 358
  md: '![](img/baa027bed101c08b496f1f420cee8a5b_358_0.png)


    Figure 12.9 – Arranging a component within the build volume of a 3D printer


    The next step in our print preparation for this MPBF additive setup is to orient
    our component. As you can see in *Figure 12.10*, we can use the **Automatic Orientation**
    command, which we covered extensively in *Chapter 8*, to find a suitable orientation
    for this part.


    In this example, we also have to activate the **Support Bottom Surface** checkbox
    and enter a value of 3 mm for the **Distance to Platform (Z)** input field so
    that the outcome of our orientation study matches the desired arrangement outcome.
    The ranking inputs for an MPBF do not need to be modified if you are using the
    default ranking options Fusion 360 offers when utilizing the automatic orientation:'
  merge: -1
  img_proc: true
- pgno: 359
  md: '![](img/baa027bed101c08b496f1f420cee8a5b_359_0.png)


    Figure 12.10 – Creating an automatic orientation study


    Once the automatic orientation is complete, we can start looking through its results
    and toggle through different ranked outcomes. Figure 12.11 shows the fifth-ranked
    outcome of this orientation result. In this example, we will utilize this outcome
    as it has the least amount of support volume necessary to print this part.


    Another consideration when choosing an orientation result is the recoater blade
    direction. Fusion 360 displays the recoater blade direction with an arrow next
    to the build plate for most metal 3D printers, as shown in Figure 12.11. When
    printing parts with MPBF, thin horizontal segments of our parts tend to distort
    in the positive Z direction due to the thermally induced stresses on the layer
    being 3D printed. Such distortions create resistance between the recoater blade
    and the part while the 3D printer is applying a new coat of powder in between
    each layer. It is important to reduce such resistance between the part and the
    recoater blade so that we can print our parts successfully. If you are printing
    multiple parts within the same build volume, you need to consider their position
    on the build plate versus the recoater blade direction. You do not want your parts
    to be in a linear pattern perpendicular to the recoater blade direction. Instead,
    it is better to stagger them along the recoater blade direction to prevent a sudden
    resistance increase on the recoater blade and a crash between the blade and the
    parts:'
  merge: -1
  img_proc: true
- pgno: 360
  md: '![](img/baa027bed101c08b496f1f420cee8a5b_360_0.png)


    Figure 12.11 – Selecting an orientation to print the part


    Up until this point, we have mostly repeated the print preparation steps we learned
    about in previous chapters. At this point, we will highlight some of the unique
    Fusion 360 capabilities we can utilize for MPBF printers after gaining access
    to the Additive Build extension.


    Figure 12.12 shows the list of support structures we can add to parts within an
    Additive setup with an MPBF printer. You may notice that this list is longer than
    the support structure we can add to FFF or SLA/DLP printers, which were covered
    in Chapter 10.


    After gaining access to the Additive Build extension, you will be able to add
    all the support structures Fusion 360 is capable of generating to any relevant
    additive setup. In Chapter 10, we mainly covered the Bar and Base plate supports.
    In this section, we will focus on Polyline and Volume support. In the next section,
    we will highlight Setter supports.


    We will start demonstrating MPBF-specific supports using Polyline support. Figure
    12.12 shows how to apply Polyline support to the two faces we’ve selected. The
    POLYLINE SUPPORT dialogue is made up of five tabs. In the Geometry tab, we can
    select the faces we wish to support and designate an overhang angle below which
    Fusion 360 should create support structures:'
  merge: -1
  img_proc: true
- pgno: 361
  md: '![](img/baa027bed101c08b496f1f420cee8a5b_361_0.png)


    Figure 12.12 – Adding a polyline support to selected faces


    The **Geometry** tab has additional functionality around how to select surfaces
    to avoid generating supports and how much gap there should be between each support.


    If you have chosen to support an entire body or a component, by selecting the
    **Avoid** checkbox, as shown in *Figure 12.13*, you can select one or multiple
    faces to avoid creating support structures. If you activate the **Advanced Area
    Filter** checkbox, Fusion 360 gives you additional options around which area within
    your selected model/face to create support structures. If you activate the **Distance
    to Other Support** checkbox, you can designate a gap between multiple support
    structures to avoid overlap between them:'
  merge: -1
  img_proc: true
- pgno: 362
  md: '![](img/baa027bed101c08b496f1f420cee8a5b_362_0.png)


    Figure 12.13 – Advanced options for support generation within the Geometry tab


    The **General** tab within the **POLYLINE SUPPORT** dialogue allows you to control
    the polyline type with a drop-down list, as shown in *Figure 12.14*. There are
    three polyline types you can select. The default selection is **Structure with
    hole patterns**, as indicated with callout 1. For this polyline type, you can
    control **Polyline Properties** and **Connections** with their designated tabs,
    as shown at the top left of *Figure 12.14*. If you set the polyline type to **Surface**,
    as shown with callout 2 in the same figure, the **Polyline Properties** tab and
    the **Connections** tab will disappear. The same is also true when setting the
    polyline type to **Solid**, as indicated with callout 3.'
  merge: -1
  img_proc: true
- pgno: 363
  md: 'The **General** tab also allows you to modify the distance between each part
    connection point when editing the **Anchor Distance** and **Hatch Distance** inputs.
    You can also control the orientation of the polyline support and whether these
    supports should go all the way to the edges of your part or not. By default, all
    polyline supports are aligned to the Y-axis. If you enter an input of 45 degrees
    in the **Rotate by Z** field, your polyline supports will be diagonal along the
    XY plane:


    ![](img/baa027bed101c08b496f1f420cee8a5b_363_0.png)


    Figure 12.14 – The General tab for polyline support


    If you are generating support using the polyline type of **Structure with hole
    patterns**, you will also be able to edit the polyline properties using the third
    tab within the **POLYLINE SUPPORT** dialogue, as shown in *Figure 12.15*. This
    tab allows you to control the hole pattern, including its density and thickness.
    You can also add **Fin Structures** so that you have a better connection to the
    build plate. By default, Fusion 360 creates each polyline support with a single
    hatch. This means their thickness is controlled by the melt pool diameter of the
    laser, as set in the print settings for the additive setup. However, you can enable
    **Thickening up Structures** by selecting the checkbox and assigning a specific
    thickness to polyline supports, making them stronger. You can control the thickness
    of the connection to the platform, the connection to the parts, as well as the
    main lattice structure:'
  merge: -1
  img_proc: true
- pgno: 364
  md: '![](img/baa027bed101c08b496f1f420cee8a5b_364_0.png)


    Figure 12.15 – The Polyline Properties tab for polyline supports


    Within the **POLYLINE SUPPORT** dialogue, if you navigate to the **Raster and
    Contour** tab, as shown in *Figure 12.16*, you can control the fragment size and
    gap. By default, both the **Fragment Size** and **Fragment Gap** inputs are set
    to **Small**. If you change the input for these fields to **Custom**, you can
    control **Fragment Contour Length** as well as **Fragment Contour Gap**, as shown
    in *Figure 12.16*. **Fragment Contour Length** controls the size of a given fragment.
    In this example, each fragment is set to 3 mm, which means each polyline segment
    will be 3 mm long. **Fragment Contour Gap** is set to 0.25 mm, which means there
    will be a 0.25 mm distance between each polyline support segment:'
  merge: -1
  img_proc: true
- pgno: 365
  md: '![](img/baa027bed101c08b496f1f420cee8a5b_365_0.png)


    Figure 12.16 – Modifying Fragment Size and Gap for polyline support


    The final tab of the POLYLINE SUPPORT dialogue controls the Connections properties
    of the polyline support for the part and the build plate. There are two segments
    to control the part connection. Top Part Connection controls how the polyline
    supports contact the downskin region of a model, while Bottom Part Connection
    controls how the polyline supports contact the upskin of a given part. Platform
    Connection controls how polyline supports are connected to the build plate. You
    can also turn on the Triangular Fin on Platform option to create additional flanges
    to connect your polylines to the build plate for stronger adherence.


    There are four options to control the shape of a given part connection. The default
    connection shape is Breaking point. Figure 12.17 shows the outcome of each shape.
    The leftmost screenshot shows the shape outcome of the Breaking point option.
    The middle screenshot shows the Offsetted Breaking Point option, and the screenshot
    on the right shows the Strip shape:'
  merge: -1
  img_proc: true
- pgno: 366
  md: '![](img/baa027bed101c08b496f1f420cee8a5b_366_0.png)


    Figure 12.17 – The three shape outcomes for the top part support connection with
    polyline supports


    The next support type we will highlight in this section is **Volume** support.
    You can access the **VOLUME SUPPORT** dialogue by selecting its corresponding
    option within the **SUPPORTS** panel of the **ADDITIVE** tab. Volume supports
    are very similar to polyline supports. The main difference is that volume supports
    create multiple polylines to create a stronger support structure. *Figure 12.18*
    shows the outcome of selecting a single face and creating a volume support. The
    same figure shows the previously created polyline supports on the left-hand side
    and the newly created volume supports on the right-hand side. As you can see,
    we can create structures with **Hole Pattern** set to **Oval** using the **Volume
    Properties** tab. We can also control **Fragment Size** and **Fragment Gap** so
    that we have large fragments of supports with contour and a raster gap of 0.25
    mm to replicate the shape and size of the polyline supports we previously generated:'
  merge: -1
  img_proc: true
- pgno: 367
  md: '![](img/baa027bed101c08b496f1f420cee8a5b_367_0.png)


    Figure 12.18 – Creating volume support for an MPBF additive setup


    By default, all support structures in Fusion 360 connect selected downskin surfaces
    to the build plate or an upskin region of a body. Figure 12.19 shows an updated
    setup, where both Polyline Support1 and Volume Support1, which we created in the
    previous steps, are suppressed. In this figure, we can see the outcome of selecting
    multiple surfaces and generating a new Volume support with default settings. Here,
    we can see that the supports on the left-hand side reach down to the build plate,
    but the supports on the right-hand side stop on the up skin of the same part.
    Such support geometry is desirable if we are looking to minimize the time and
    material we use to manufacture our parts with support structures. But we also
    have to consider the additional effort we will have to exert during the post-processing
    phase. Specifically, any support structure that touches the upskin of a given
    part needs to be removed and any blemishes need to be machined away. In such cases,
    we may want to avoid creating support structures that touch the upskin of our
    parts:'
  merge: -1
  img_proc: true
- pgno: 368
  md: '![](img/baa027bed101c08b496f1f420cee8a5b_368_0.png)


    Figure 12.19 – Generating a volume support using default settings on selected
    surfaces


    One way we can generate support that does not touch the upskin of our components
    is by generating angled volume supports. **Angled Volume Support** is the final
    tab within the volume support dialogue. Within this tab, we can activate **Angled
    Support** and designate the pivot point where our volume support will be broken
    into two segments. As shown in Figure 12.20, by manipulating the on-canvas gizmo,
    we can control the breakpoint in our volume supports so that the generated support
    structure is angled away from the downskin:


    ![](img/baa027bed101c08b496f1f420cee8a5b_368_1.png)


    Figure 12.20 – Manipulating the pivot point for an angled volume support'
  merge: -1
  img_proc: true
- pgno: 369
  md: 'By default, the angled volume support pivot point allows us to control where
    our support structures will pivot away from the vertical axis. As you can see
    in Figure 12.21, the bottom half of the support structure is vertical and is pointing
    toward the build plate. The top section of the same support structure is angled
    and points toward the selected downskin surfaces:


    ![](img/baa027bed101c08b496f1f420cee8a5b_369_0.png)


    Figure 12.21 – Angled volume support


    This outcome avoids creating supports that touch the up skin of our part. If you
    select the Tilt below angle checkbox within the Angled Volume Support tab of the
    dialogue, you can also control the bottom half of the support itself. As mentioned
    previously, the bottom half of the support is vertical by default. However, you
    can also control its vector by activating the Tilt below angle checkbox.


    As was shown in Figure 12.12, there are multiple polyline and volume support options
    available for MPBF additive manufacturing setups. All these options are variations
    of the polyline and volume supports and can be applied to different aspects of
    our models, such as edges and medial lines for small area surfaces. You can also
    apply secondary polyline supports to surround an existing volume support. Various
    options to control these support structures are available within their respective
    dialogues.


    Once we are satisfied with how our models are oriented, positioned, and supported,
    we can generate the additive toolpath and simulate it as we have done for FFF
    setups and SLA/DLP setups in the previous chapters. Figure 12.22 shows how you
    can simulate the additive toolpath by selecting the appropriate command within
    the ACTIONS panel of the ADDITIVE tab. The SIMULATE ADDITIVE TOOLPATH dialogue
    for an MPBF setup is the same FFF and SLA/DLP setups. We can use the Show Machine
    checkbox to display or hide the machine platform. We can use the Incremental Move
