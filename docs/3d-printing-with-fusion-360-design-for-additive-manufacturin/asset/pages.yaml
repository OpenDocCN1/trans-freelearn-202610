    infill.


    # Summary


    In this chapter, we focused on print settings, including how to customize them
    and how to assign unique body presets to given parts. This was a long chapter
    so let''s do a quick recap of what we learned.


    Fusion 360 has a library of print settings you can use when creating your additive
    setups. Each print setting has a set of default values that you can use for printing
    with your specific printer and material combination. However, there will be instances
    where you may want to modify some of these settings to either improve your print
    quality or fit the needs of your specific printer. In such cases, you can select
    the print setting you wish to modify from Fusion 360''s library and copy it over
    to your personal Print Setting Library folders. Once you have a print setting
    in your local library, you can modify it'
  merge: -1
  img_proc: true
- pgno: 298
  md: 'and save it for future use. There are certain print settings you definitely
    want to modify based on your filament or resin, such as the layer height, the
    temperature with which you will extrude the filament, the temperature of the build
    plate, how many perimeters and top and bottom layers you wish to print to control
    the strength of your print, and your print bed adhesion settings.


    You can also customize the body presets to your liking and later assign a unique
    body preset for each body within your additive setup. Using these techniques,
    you will have full control over the speed and the quality of your 3D prints.


    In the next chapter, we will learn how to create support structures for parts
    and additive manufacturing technologies that require support. We will also get
    a better understanding of how Fusion 360 interprets those supports during slicing
    and toolpath generation based on the print settings for the support structures
    we highlighted in this chapter.'
  merge: -1
  img_proc: true
- pgno: 299
  md: '# 10


    # Support Structures


    Welcome to *Chapter 10*. In this chapter, we will learn all about how to generate
    and slice support structures for **fused filament fabrication (FFF)**, **stereolithography
    (SLA)**, and **digital light processing (DLP)** 3D printing.


    Most mainstream additive manufacturing technologies (except for binder jetting,
    selective laser sintering, and multi-axis deposition) require support structures
    to be generated and printed for sections of components that have large overhanging
    surfaces. In this chapter, we will highlight the bar and volume support structures,
    which can be used for both FFF and SLA/DLP 3D printing.


    Almost everything we will learn in this chapter also applies to generating support
    structures for parts to be printed with **metal powder bed fusion (MPBF)** printers,
    but we will dive deeper into positioning parts and generating support structures
    for the MPBF process in *Chapter 12*. As the MPBF technology is capable of printing
    parts and support structures with higher precision compared to FFF, it is not
    recommended to use the solid FFF supports such as volume and bar structures in
    an MPBF setup. The MPBF process generally utilizes hatch-style volume supports,
    which is why we have a dedicated chapter on how to support parts for this process.


    In this chapter, we will highlight how the support structures we generate are
    sliced based on the printing technology used in our additive setup. We will also
    learn about several unique support connections that can be added to the build
    plate, such as pads, roots, and a base plate, which are commonly used to connect
    bar supports to the build plate more effectively and increase build plate adhesion
    when 3D printing with the bottom-up SLA/DLP technologies.


    In this chapter, we will cover the following topics:


    +   - Volume and bar supports for FFF printing

    +   - Bar supports for SLA and DLP printing

    +   - Base plate supports for SLA and DLP printing'
  merge: -1
  img_proc: true
- pgno: 300
  md: 'By the end of this chapter, you will have a better understanding of how to
    generate support structures for both solid and mesh models using Fusion 360. You''ll
    learn how to create bar-shaped supports including lattices, volume supports, and
    base plate supports depending on the 3D printing technology. You will learn the
    differences between top-down and bottom-up resin printing technologies and their
    unique support requirements. You will also gain a solid understanding of how to
    create bar supports over an area, an edge, or a local minima point in order to
    successfully 3D print parts using SLA/DLP printers.


    # Technical requirements


    Everything covered in this chapter is accessible to users with the personal, trial,
    commercial, startup, or educational Fusion 360 license types.


    There are certain Fusion 360 additive machines, such as **metal powder bed fusion
    (MPBF)** 3D printers and their respective print settings and support structure
    generation capabilities, which are not available until gaining access to the Additive
    Build extension. As with all other Fusion 360 extensions, the Additive Build extension
    is not available for personal use. As we will not cover topics specific to metal
    3D printing in this chapter, you should be able to follow along with all the examples
    in this chapter with no issues.


    If you have a commercial license of Fusion 360, to create an additive setup with
    a metal powder bed fusion machine, you will also need access to the Additive Build
    extension (https://www.autodesk.com/products/Fusion-360/additive-build-extension).


    Autodesk offers a 14-day trial for the Additive Build extension for all commercial
    users of Fusion 360. You can activate your trial within the extensions dialog
    of Fusion 360.


    The lesson files for this chapter can be found here: https://github.com/PacktPublishing/3D-Printing-with-Fusion-360.


    # Volume and bar supports for FFF printing


    **Fused filament fabrication (FFF)** 3D printers can generally print parts with
    overhang angles of less than 45 degrees without needing support structures. If
    you want to print a part using an FFF printer, one of the first things to do is
    to try and find an orientation that will allow you to print that part with no
    support structures.


    However, certain models cannot be printed without supports. This is because no
    matter which orientation you choose, certain parts will end up with down-skin
    surfaces with overhangs larger than 45 degrees that span distances larger than
    you can bridge with your 3D printer. In such cases, you will need to generate
    support structures using your CAD tool or your slicer. As Fusion 360 is both a
    CAD software and a slicer, you can generate support structures parametrically
    within the MANUFACTURE workspace for any additive setup.'
  merge: -1
  img_proc: true
- pgno: 301
  md: 'In this section, we will talk about how to generate volume and bar supports
    for an additive setup with an FFF 3D printer. To demonstrate how to generate volume
    supports, we will use a Fusion 360 document named Bracket . f3d. This document
    already contains an additive setup within the **MANUFACTURE** workspace. As shown
    in *Figure 10.1*, **Setup 1** is an additive setup with a **Prusa i3MK3S +** printer
    and a **PLA (Direct drive)** print setting. The component has been arranged within
    the 3D printer such that it is in the middle of the build volume. A suitable orientation
    has also been selected for this part. Based on this orientation, we will need
    to generate support structures in order to print this part successfully. *Figure
    10.1* shows the two options we have to generate support structures located within
    the **SUPPORTS** panel of the **ADDITIVE** tab for this setup.


    ![](img/baa027bed101c08b496f1f420cee8a5b_301_0.png)


    Figure 10.1 – Support structure types for an additive setup with an FFF 3D printer


    If you select the **Solid Volume Support** command located within the **SUPPORTS**
    panel, a new dialog called **SOLID VOLUME SUPPORT** will become visible. In this
    dialog, there are two tabs. The **Geometry** tab allows you to select which faces
    or bodies should be supported with this operation. *Figure 10.2* shows how the
    selected faces are highlighted in blue while the **SOLID VOLUME SUPPORT** dialog
    is active.


    Within this dialog, you also have the ability to control the Support Overhang
    Angle. Fusion 360 will automatically generate a support structure for sections
    of downward-facing surfaces that have an overhang angle smaller than the entry
    in this input field. In other words, if we increase the Support Overhang Angle
    input, Fusion 360 will generate supports over a larger area.'
  merge: -1
  img_proc: true
- pgno: 302
  md: '![](img/baa027bed101c08b496f1f420cee8a5b_302_0.png)


    Figure 10.2 – Selecting faces of a solid model for a volume support


    In the GitHub folder for Chapter 10, you will find another file called Bracket-Mesh.f3d.
    This Fusion 360 document is a duplicate of the previous one with one small difference.
    As you can see in Figure 10.3, in this second document, the component named Bracket
    is not a solid body, but a mesh body. The solid volume support dialog allows you
    to select not only entire bodies but also individual face groups when the component
    being supported is a mesh body. In order to select individual face groups, you
    have to make sure that the mesh face groups are displayed. The easiest way to
    display mesh face groups while you are within the MANUFACTURE workspace of Fusion
    360 is to use the keyboard shortcut Shift + F. If the mesh body in the active
    setup has more than one face group, each mesh face group will be displayed with
    unique colors, as you can see in Figure 10.3. After displaying the mesh face groups
    within the MANUFACTURE workspace for a given additive setup, you can select face
    groups as input objects to be supported within the SOLID VOLUME SUPPORT dialog.'
  merge: -1
  img_proc: true
- pgno: 303
  md: '![](img/baa027bed101c08b496f1f420cee8a5b_303_0.png)


    Figure 10.3 – Selecting three face groups of a mesh body


    Now that we have highlighted how to select face groups for a mesh body when generating
    volume supports, we can switch back to the original model (Bracket .f3d) and create
    our volume supports on the previously selected two faces of the solid body. Once
    the support structure is generated by clicking the OK button on the SOLID VOLUME
    SUPPORT dialog, Fusion 360 will create a support structure as shown in Figure
    10.4, and you will be able to visualize it as a blue volume under the overhanging
    surfaces. Fusion 360 also adds a new line item called Solid Volume Support1 within
    the Supports folder of the active setup in the browser.'
  merge: -1
  img_proc: true
- pgno: 304
  md: '![](img/baa027bed101c08b496f1f420cee8a5b_304_0.png)


    Figure 10.4 – Visualizing a solid volume support


    In Figure 10.4, you may have noticed that the blue-colored support structure does
    not enclose the entire opening, but rather supports roughly half the arc face.
    This is because we used a support overhang angle of 40 degrees and Fusion 360
    did not support any point on that arc with an overhang angle greater than 40 degrees.
    It is important to remember that overhang angles are measured from the horizontal
    plane as demonstrated by the tooltip image in the preceding figure.


    Another option we have within the Geometry tab of the SOLID VOLUME SUPPORT dialog
    is the Avoid checkbox. By activating this checkbox, we can select one or more
    faces as input and prevent Fusion 360 from generating support structures on those
    surfaces. Figure 10.5 shows the creation of a second Solid Volume Support to support
    the entire body, while avoiding the generation of supports on the two arc faces
    highlighted in blue, which were previously used as inputs to create Solid Volume
    Support1.'
  merge: -1
  img_proc: true
- pgno: 305
  md: '![](img/baa027bed101c08b496f1f420cee8a5b_305_0.png)


    Figure 10.5 – Selecting faces to avoid while generating a solid volume support


    The outcome of the generation of this second solid volume support is the creation
    of a volume support for the entire body, while excluding the two faces we specified
    in the dialog to avoid. Using this technique, we can add unique support structures
    to certain faces while creating a different set of supports for the rest of the
    body.


    The second tab within the SOLID VOLUME SUPPORTS dialog is named General. Figure
    10.6 shows the two input fields in the General tab. The first input field, named
    Top Distance to Part, controls the distance between the support structure we are
    generating and the down-skin of the part. The second input field, named Bottom
    Distance to Part, controls the distance between the support structure and the
    up-skin of the part if a given support structure were to be touching the up-skin
    of our part instead of the build plate.


    The inputs for both of these fields are in units of length, and by default, the
    input is 0.3 millimeters. As shown in Figure 10.6, the layer height for the PLA
    (Direct Drive) print setting is 0.15 millimeters. Therefore, a support structure
    we generate using these settings will have a two-layer gap above the up-skin and
    below the down-skin of our part.


    Based on my experience, when 3D printing with PLA, whenever we leave a two-layer
    gap between the part and the supports, the post-processing becomes easier, and
    we can remove the support structure from the part after printing without a lot
    of effort required.'
  merge: -1
  img_proc: true
- pgno: 306
  md: '![](img/baa027bed101c08b496f1f420cee8a5b_306_0.png)


    Figure 10.6 – The relationship between volume supports and print settings


    After generating one or multiple support structures, Fusion 360 adds them to the
    supports folder within the browser, as shown in Figure 10.7. If we select one
    of those support structures, we can right-click on them and see a menu of options.
    We have options to **Suppress** a given support, **Duplicate**, **Cut**, **Copy/Paste**,
    or **Delete** it. Keep in mind that the order of support structures within the
    supports folder is important. Subsequent supports are aware of the existence and
    location of their predecessors and can avoid generating supports where one has
    already been created. Therefore, if you were to suppress a given support within
    the supports folder, a preceding support structure may become out of date and
    may need to be regenerated.'
  merge: -1
  img_proc: true
- pgno: 307
  md: '![](img/baa027bed101c08b496f1f420cee8a5b_307_0.png)


    Figure 10.7 – Right-click menu options for support structures


    Now that we have learned how to generate volume supports for an FFF setup, we
    can focus on generating bar supports. Figure 10.8 shows the SOLID BAR SUPPORT
    dialog, which can be initiated by the command with the same name located within
    the SUPPORTS panel in the ADDITIVE tab.


    Within the Geometry tab of this dialog, the first thing you can do is select a
    set of faces or bodies to be supported. As you may have noticed, the options in
    the Geometry tab for bar supports and volume supports are exactly the same. In
    this tab, you can enter the support overhang angle, select which surfaces you
    wish to avoid creating support structures for, and designate a gap between multiple
    support entities to avoid overlap between support structures.'
  merge: -1
  img_proc: true
- pgno: 308
  md: '![](img/baa027bed101c08b496f1f420cee8a5b_308_0.png)


    Figure 10.8 – Selecting faces for generating bar supports


    The options to control the density of the connection points between the part and
    the support structure are located in the General tab, as shown in Figure 10.9
    and labeled 1. Fusion 360 refers to these connection points as anchors. Within
    the General tab, you also have the option to group multiple bars and bunch them
    up into a tree/bouquet structure, and control the shape of those structures, labeled
    2 in the same figure.


    The term anchor within the Anchor Density field of the General tab refers to connection
    points between the bar support and the down-skin of a given part. Fusion 360 offers
    several preset anchor densities such as Sparse, Medium, and Dense, as well as
    the ability to fully customize the anchor density, which allows you to control
    the distance between the anchor points, their alignment on the downskin face,
    and the distance between the anchor points and the perimeter of the downskin face.
    Using a custom anchor density, you can also distribute the anchor points in a
    hexagonal or rectangular pattern.


    Similar to how you can control the anchor placement settings, Fusion 360 also
    allows you to control the inputs for the bouquet/tree structures for bar supports.
    You can choose from a set of presets including Small, Medium, and Large bouquet/tree
    structures while generating bar supports. Alternatively, you could choose to eliminate
    the bouquet/tree structures altogether by selecting None from the drop-down list.
    If you like, you can also fully customize the bouquet/tree structure, as shown
    in Figure 10.9 and labeled 2. After selecting Custom from the drop-down menu for
    bouquet/tree type, you will have access to additional controls such as the diameter
    and height of a given bouquet/tree structure as well as its recursive depth. You
    can also control the maximum vertical angle at which your bouquets can branch
    off from the main column of each bar support.'
  merge: -1
  img_proc: true
- pgno: 309
  md: '![](img/baa027bed101c08b496f1f420cee8a5b_309_0.png)


    ![](img/baa027bed101c08b496f1f420cee8a5b_309_1.png)


    Figure 10.9 – The General tab for solid bar supports


    The Bar Properties tab allows you to control the size and shape of your bars,
    as shown in Figure 10.10. The Bar Size section allows you to control the diameter
    of your bars. If the Width on Part and Width on Platform inputs are the same,
    you will have a bar with a uniform cross-section. You can also generate a bar
    that resembles the frustum of a cone if you enter a larger value in the Width
    on Platform input versus the Width on Part input.


    The Bar Shape section of the solid bar support dialog allows you to customize
    the shape of your bars. The default bars generated by Fusion 360 have a Polygon
    Corner Count value of 5. This results in bar supports with a pentagonal cross
    section. If you increased the Polygon Corner Count input to 6 or 8, you would
    end up with hexagonal or octagonal cross sections, respectively. You could also
    generate elliptical cross sections by changing the Radial Type dropdown from Circular
    to Ellipse and increasing the Ellipse Stretch in % input field from 100% up to
    200%.


    The Bar Path section has additional settings that allow you to modify the route
    a bar support follows on its way to the build plate. As shown in Figure 10.10,
    bar supports are connected to parts at a right angle by default. Just like volume
    supports, the default bar support settings in FFF setups also leave a gap between
    the part and support structure. The default distance for this gap is 0.15 millimeters
    as set in the Distance to Part input field. If you are using a print setting of
    0.15 mm, this gap equates to a 1-layer gap between the bar supports and the down-skin
    of your parts.'
  merge: -1
  img_proc: true
- pgno: 310
  md: '![](img/baa027bed101c08b496f1f420cee8a5b_310_0.png)


    ![](img/baa027bed101c08b496f1f420cee8a5b_310_1.png)


    Figure 10.10 – Selecting a custom bar shape for the solid bar supports


    The Connections tab of the SOLID BAR SUPPORT dialog allows you to control the
    shape of the breaking point between the bar support and the part. The default
    settings for bar supports in an FFF setup do not use a break point, as indicated
    by 1 on the left in Figure 10.11. If you choose the Custom option from the drop-down
    menu as indicated by 1 on the right within the same figure, you can control the
    size and shape of the break point using the additional input fields that become
    visible.


    You also have the ability to control how the bar supports are attached to the
    build plate. By default, all bar supports have a solid connection to the build
    plate as the Pad on Platform checkbox is active, as shown in Figure 10.11. You
    can control the diameter of the pad as well as its height and taper angle using
    the relevant input fields.


    ![](img/baa027bed101c08b496f1f420cee8a5b_310_2.png)


    ![](img/baa027bed101c08b496f1f420cee8a5b_310_3.png)


    Figure 10.11 – Selecting a custom breakpoint for solid bar supports'
  merge: -1
  img_proc: true
- pgno: 311
  md: 'Figure 10.12 shows the outcome of generating bar supports on the circular face
    for this part. To generate this specific support, you would need to use the following
    settings:


    +   - Bar Properties tab - Bar Size = Default

    +   - Bar Properties tab - Bar Shape = Solid Bar

    +   - Bar Properties tab - Right Angle on Part = Yes

    +   - Bar Properties tab - Distance to Part = 0.3 mm

    +   - Connections tab - Use Breakpoint = No

    +   - Connections tab – Pad on Platform = Unchecked


    As shown in the preceding list, we increase the input for **Distance to Part**
    to 0.3 millimeters so that we get a two-layer separation between the part and
    the support. In *Figure 10.12*, you can visualize the gap between the bar supports
    and the part as indicated by the empty white space between the blue-colored bars
    and the gray-colored part. We also unchecked the **Pad on Platform** option when
    generating this support structure so that the bars touch the build plate without
    occupying any additional area on the build plate.


    ![](img/baa027bed101c08b496f1f420cee8a5b_311_0.png)


    Figure 10.12 – Bar supports with a bouquet structure'
  merge: -1
  img_proc: true
- pgno: 312
  md: 'If we zoom out from the section where the bar supports touch the part, we can
    also see how this bar support connects to the build plate. Figure 10.13 shows
    the same part and its bar support using a Section Analysis view where the part
    and the support structure have been sectioned off using the YZ plane. In the following
    figure, both of the Solid Volume supports have been suppressed from the browser
    to allow us to view the bar supports without any obstruction. You will notice
    that this bar support utilizes a small tree/bouquet structure and the bars have
    been projected to the platform with a Maximum Projection Angle value of 30 degrees
    so that the bar support path is toward the build plate while avoiding any up-skin
    on the part itself, which will make the post-processing step of removing supports
    easier.


    ![](img/baa027bed101c08b496f1f420cee8a5b_312_0.png)


    Figure 10.13 – Bar supports projected to the platform


    To get a better understanding of how bar and solid support structures will be
    printed, we need to generate the additive toolpath and simulate it. To get started,
    let’s unsuppress Solid Volume Support1. We will keep Solid Volume Support2 suppressed
    as shown in Figure 10.14.


    Fusion 360 has the ability to create additive toolpaths in a unique way for volume
    supports versus bar supports. As you may recall from Chapter 9, the print setting
    editor controls how FFF supports are sliced and how additive toolpaths are generated.
    You can control options such as how many perimeters are created for each support
    type.


    In this exercise, we haven’t customized our body preset and are utilizing the
    Normal body preset for our component and its associated support structures. If
    we edit the print settings and observe the Support subsection for the Normal body
    preset, we can see that Volume supports have a value of 0 for Number of Support
    Perimeters, whereas bar supports are sliced using a perimeter of 1 when the toolpaths
    are generated.'
  merge: -1
  img_proc: true
- pgno: 313
  md: '![](img/baa027bed101c08b496f1f420cee8a5b_313_0.png)


    Figure 10.14 – The toolpath visualization for bar and volume supports in our FFF
    setup


    After generating the additive toolpath and simulating it, we can see that the
    light blue colored object in the additive simulation represents the support structures.
    Figure 10.14 shows the additive toolpath at layer 300, which happens to be at
    a height of 45.05 millimeters as this part is sliced at a layer height of 0.15
    millimeters. If you look at the region where the volume supports are, you will
    notice that they are sliced using an accordion-style toolpath. This is due to
    the 15% infill density setting for Volume supports in the print setting editor
    for the Normal preset. You can also observe in the same figure that the toolpath
    for the volume support does not contain a perimeter line surrounding the support.


    In contrast to volume supports, the toolpath generated for bar supports has a
    pentagonal cross-section with a continuous line around its perimeter. However,
    the bar support toolpath does not contain any infill, as the support infill density
    for bar supports is set to 0% for the Normal preset in this same print setting.


    This example demonstrated how we can generate solid volume supports and bar supports
    to support our parts when printed using FFF 3D printers. We learned how to control
    the various settings to generate the desired shapes and connection types for bar
    and volume supports. We also learned how Fusion 360 generates the slices and toolpaths
    for these support structures. Using these settings, we can create any support
    structure we need for a successful print. In the next section, we will learn how
    to create various bar supports to manufacture parts using SLA and DLP 3D printers.


    # Bar supports for SLA and DLP printing


    There are two types of resin-based printers on the market: bottom-up resin printers
    and top-down resin printers. In a bottom-up resin printer, the light source is
    below the resin tank. As the build plate lifts up from the resin tank (sometimes
    referred to as the vat), the part is printed upside down. In a top-down resin
    printer, the light source is above the build plate. As the build plate is submerged
    down into the resin tank with each layer, the part is printed right-side up. Both
    types of resin 3D printers require support structures for different purposes.'
  merge: -1
  img_proc: true
- pgno: 314
  md: 'In top-down resin 3D printing, we need to generate support structures for overhanging
    surfaces similar to how we generated them for FFF 3D printing. However, the support
    structures we will generate for resin printers will most likely be bar supports
    instead of volume supports.


    In top-down 3D printing, with each layer, the build plate is submerged further
    into a resin tank. As there is no **fluorinated ethylene propylene (FEP)** film
    between the layer being printed and the resin, this printing process is not subjected
    to any separation force between the part and the FEP film. Therefore, we can generally
    create weaker support structures and still manufacture our parts successfully.


    Bottom-up resin printers need to overcome gravity as they lift the part out of
    the resin vat. Bottom-up resin printers also need to overcome the peeling effect
    during the printing process between the part and the FEP film. Depending on your
    part shape and your drainage hole positioning, you may also have to overcome the
    cupping effect when using a bottom-up resin printer. This is why the bottom-up
    resin printing process generally requires stronger support structures.


    Fusion 360 has four distinct commands for adding bar supports to additive setups
    for SLA /DLP 3D printers. In Figure 10.15, you can see an additive setup with
    a single component. The Fusion 360 design named Hook.f3d is located in the GitHub
    folder for this chapter. This file contains an additive setup named Setup1 for
    a Formlabs Form 3 printer and its associated print settings. The component has
    been automatically oriented and is above the build plate by 7 millimeters, as
    shown in the following figure. When adding bar supports to an SLA/DLP additive
    setup, the **BAR SUPPORT** dialog consists of four tabs. Figure 10.15 shows the
    **Geometry** tab for bar supports. As you can see in the screenshot, after selecting
    the model to be supported, we can control the **Support Overhang Angle** input.


    Just like the solid volume support and bar support dialogs we explored in the
    previous section of this chapter, the bar supports for SLA/DLP printing measure
    the overhang angle from the horizontal plane (XY plane). Fusion 360 generates
    supports structures for overhanging surfaces with an angle value below that specified
    in the **Support Overhang Angle** input field.


    You may have also noticed that the **Geometry** tab for SLA/DLP bar supports is
    similar to the **Geometry** tab for volume and bar supports for FFF additive setups
    seen previously. In addition to the **Support** section, we also have the **Avoid**
    checkbox and the **Distance to Other Support** checkbox that allow us to specify
    which surfaces not to support and how far away from a neighboring support structure
    this bar support needs to be.


    There is one additional checkbox in the **Geometry** tab named **Advanced Area
    Filter**. When activated, the advanced area filter allows us to control the minimum
    and maximum area to be supported and whether we would like Fusion 360 to generate
    supports for faces where other support structures may already exist. We can also
    control the minimum and maximum Z heights of the bar supports to be generated.
    By default, these entries are 0 millimeters and 1e+06 millimeters, respectively.
    If we were to reduce the **Maximal Z Height** input to 50 mm, Fusion 360 would
    only create bar supports for sections of faces with overhang angles of less than
    45 degrees located below the first 50 millimeters of our part.'
  merge: -1
  img_proc: true
- pgno: 315
  md: '![](img/baa027bed101c08b496f1f420cee8a5b_315_0.png)


    Figure 10.15 – Geometry tab for bar supports on SLA/DLP printers


    By default, Fusion 360 creates bar supports utilizing a bouquet/tree structure
    as shown in the previous figure. We can modify the type of bar support Fusion
    360 generates, and how close those bars should be from each other while touching
    the part, within the General tab of the BAR SUPPORT dialog, as shown in Figure
    10.16. By changing the Anchor Density input from the default option of Medium
    to Dense, we can add more touch points between the bar supports and the part.
    We can also change the shape of the tree/bouquet structure. The following figure
    shows the effect of turning off the tree structure by selecting None from the
    Type drop-down menu.


    Fusion 360 also allows you to group bars together by activating the Groups checkbox.
    Figure 10.16 shows 5 bars grouped together with a Group Taper (%) input of 50
    percent.


    This means that approximately five bars on their way from the part to the build
    plate bunch up together toward a central point by the specified amount. If you
    print your part and supports with this setting, you can handle groups of five
    bars at a time and break them off the part during post-processing much easier.


    In the General tab, you can also turn on the Brace option for bar supports. Figure
    10.16 shows bars with K type bracing. Fusion 360 offers three different brace
    types that resemble the letters K, X and N. Using the additional options below
    the Brace checkbox, you can control how many bars you wish to link together, what
    the link angle should be between the brace and the main column of your bar support,
    and whether you want the connection between the brace and the main column of the
    bar support to be straight or curved.'
  merge: -1
  img_proc: true
- pgno: 316
  md: '![](img/baa027bed101c08b496f1f420cee8a5b_316_0.png)


    Figure 10.16 – Grouped and braced bar supports with no tree structure


    The **Bar Properties** tab for the bar supports in SLA/DLP printing is the same
    as that for FFF 3D printing. Within the **Bar Properties** tab, you can control
    the bar size and the bar shape. The **Bar Properties** tab also allows you to
    control the path your bars should follow between the part and the platform. You
    can either follow a path with a right angle to the down-skin surface normal, or
    your bars could point straight down to the build plate.


    Now let’s move over to the final tab named **Connections**. In this tab, you can
    control how the bar support is connected to the part as well as the platform.
    By default, bar supports are connected to the parts using a breakpoint on the
    part. You can also choose to have your breakpoint offset from the part or have
    no breakpoint at all. You can also customize the size and shape of your breakpoint
    using exact specifications for how the bar support should connect to your part.


    The next checkbox named **Pad on Platform** allows you to add a small circular
    puck that is slightly larger than the bar itself where the bar support connects
    the build plate. If you turn this checkbox on, you can then control the pad’s
    width, height, and taper angle. A taper angle of zero will give you a pad with
    a cylindrical cross-section. A positive taper angle will result in a frustum shape
    where the pad is bigger at the platform and gets smaller as it approaches the
    bar. A negative taper angle will give you the opposite shape where the pad’s connection
    to the build plate has a smaller cross-section and the pad gets wider as you move
    up in the Z direction. Pads with negative taper angles allow you to separate the
    pad and bar support from the build plate using a chisel with ease.'
  merge: -1
  img_proc: true
- pgno: 317
  md: 'The last section within the **Connections** tab is named **Connection Type**.
    Fusion 360 offers three options within the **Type** dropdown: **None**, **Base
    plate for groups**, and **Roots**. Figure 10.17 shows bar supports generated with
    the **Base plate for groups** option enabled. When this option is selected, you
    can create a base plate for the bars that you grouped together in the **General**
    tab. You can control the height of the base plate, as well as its offset from
    the perimeter of the group. You can also add a taper angle to these base plates
    as discussed previously while adding pads on the platform. Finally, you have the
    option to control whether to fill this base plate with a solid pattern or apply
    a hole pattern. We will cover pattern types in more detail when we discuss base
    plate supports in the next section.


    If you choose **Roots** for the connection type, Fusion 360 will create bar support
    columns that separate into multiple roots just above the build plate. This creates
    a bouquet structure toward the build plate, creating a stronger connection between
    the trunk of the bar support and build plate and adding extra stability to tall
    and thin bar supports.


    ![](img/baa027bed101c08b496f1f420cee8a5b_317_0.png)


    Figure 10.17 – Bar supports with pads and base plates for groups


    Up until now, we have examined the Bar Support commands for SLA/DLP 3D printers.
    Fusion 360 can generate bar supports for entire components, as well as specific
    selected surfaces on a given component.'
  merge: -1
  img_proc: true
- pgno: 318
  md: 'There may be times when you need to support down-oriented points and edges
    using bar supports. Fusion 360 has explicit commands to generate bar supports
    attached to down-oriented points and edges. The options to control the size and
    shape of the bars that are created using **Down-Oriented Point Bar Support** and
    **Edge with Bar Support** are exactly the same as the options we''ve already reviewed
    for bar supports. The main difference between bar supports and down-oriented point
    bar supports and edge with bar supports is that the down-oriented point bar support
    generates a single bar at the downward-facing corners, edges, and local minima
    of the selected component, whereas the **Edge with Bar Support** option generates
    bar supports along a downward-facing edge of the selected body or component.


    When generating support structures for SLA/DLP printers, my recommendation is
    to start by adding a down-oriented point bar support first. This action will make
    sure that you always support any local minima on the part where you will most
    certainly need support structures. Next, I would recommend adding either a bar
    support or lattice volume support to the entire component so that all the surfaces
    that require support structures can be appropriately accounted for.


    Now that we have mentioned lattice volume supports, let''s take a closer look
    at this support action. *Figure 10.18* shows how to access the **Lattice Volume
    Support** option from the **ADDITIVE** tab in the **SUPPORTS** panel, and its
    various settings to control the shape of the bars, their connections to the part
    and the build plate, the size of the lattice cells, and their dimensional change
    as they move from the build plate to the parts.


    ![](img/baa027bed101c08b496f1f420cee8a5b_318_0.png)


    Figure 10.18 – Lattice Volume Support options for an additive setup'
  merge: -1
  img_proc: true
- pgno: 319
  md: 'As we can see in Figure 10.18, there are a lot of similarities between the
    bar supports and lattice volume supports. Lattice volume supports are essentially
    bar supports with a unique bracing style. The main difference between lattice
    volume supports and bar supports is that you cannot select a certain brace type
    (K, X, or N) in a lattice volume support. Lattice volume supports have their own
    distinct bracing method. You can, however, control the shape and the growth ratio
    behavior of the lattice itself within the **General** tab under the **LATTICE
    VOLUME SUPPORT** section.


    The preceding figure shows a lattice cell with a width of 3 millimeters and a
    height of 4 millimeters. It also shows how the lattice cell size changes and that
    you have larger cells at the base plate and smaller cells at the part connection
    zone. This change in cell size is controlled by the **Adaptive Step Count** input,
    which is 3 for this support structure.


    You can also group bars together when generating lattice volume supports by activating
    the **Groups** checkbox in the **General** tab. If you activate **Groups** when
    creating a lattice volume support, you can add base plates for groups in the **Connections**
    tab for the lattice volume support as shown in Figure 10.18.


    In this section, we have covered how to add various bar supports to components
    to be manufactured using SLA/DLP 3D printers. We discussed the similarities between
    bar supports, down-oriented point bar supports, and edge with bar supports. We
    also covered how to add lattice volume supports.


    In the next section, we will focus on the specific method for adding base plate
    supports to our parts after generating bar supports for better build plate adhesion.


    # Base plate supports for SLA and DLP printing


    When generating bar supports automatically using Fusion 360, Fusion adds pads
    to each bar support by default. Pads are added to bars where they connect to the
    build plate with a surface area larger than the bar diameter. This action ensures
    good adhesion between the support and the build plate. Pad connections are often
    recommended for printing small parts such as jewelry with an SLA/DLP printer.
    However, if you are printing a larger part with bar supports using a bottom-up
    resin printer, you should consider printing them using a base plate connection
    instead of pads between your bar supports and the build plate. This will ensure
    that you have a stronger build plate adhesion and increase your chances of printing
    success.


    In the previous section, we covered how to group bars together and connect those
    groups to the build plate using base plates. Fusion 360 also has an explicit **Base
    Plate Support** action as can be seen in Figure 10.19. This action is located
    in the **ADDITIVE** tab, in the **SUPPORTS** panel drop-down menu.'
  merge: -1
  img_proc: true
- pgno: 320
  md: '![](img/baa027bed101c08b496f1f420cee8a5b_320_0.png)


    Figure 10.19 – How to access the Base Plate Support command in Fusion 360


    Figure 10.19 shows an additive setup for a Formlabs Form 3 printer and its associated
    print settings. The part has been arranged and oriented deliberately. Two bar
    support operations have been applied to the part: Down Oriented Point Bar Support1
    and Bar Support1. This Fusion 360 document is named Screw.f3d and is included
    in the GitHub folder for this chapter.


    After accessing the Base Plate Support command in the ribbon, you will see the
    BASE PLATE SUPPORT dialog as shown in Figure 10.20. This action also adds a new
    line item named Base Plate Support1 to the Supports folder in the browser. After
    selecting the model to create the support within the Geometry tab, you can switch
    to the General tab. In the General tab, you will see the option to control the
    bounding shape of the base plate. You can either create a base plate based on
    the silhouette of the part based on its current orientation, or you can create
    a rectangular base plate based on the bounding box of the part. You can control
    the offset from the perimeter of the silhouette, the height of the base plate,
    and its taper angle. As we discussed in the previous section, a negative value
    used for the taper angle will create a base plate that increases in cross-sectional
    area in the positive Z direction. Such a shape allows you to use a chisel to separate
    the base plate support from the build plate with ease once the printing is complete.'
  merge: -1
  img_proc: true
- pgno: 321
  md: 'In this example, we are supporting a solid part that does not have any holes.
    If we were printing a part with a hole, such as a ring being printed on its side,
    depending on which option we used for the **Fill Inner Contour** setting, we would
    generate different base plates. If the option was set to **Yes**, we would create
    a solid, circular, plate-shaped base plate. If the option was set to **No**, we
    would create a washer-shaped base plate.


    ![](img/baa027bed101c08b496f1f420cee8a5b_321_0.png)


    Figure 10.20 – Adding a base plate support in an additive setup for an SLA printer


    In order to save material, you can also choose a pattern type within the **General**
    tab of the **BASE PLATE SUPPORT** dialog. The default pattern type is **Solid**.
    If you choose a different pattern type, such as **Hexagonal** as shown in Figure
    10.21, you have the ability to control the size of the pattern as well as its
    wall thickness. Please be aware that if you are choosing a pattern other than
    solid, your bar supports may not always touch the printed segments of your base
    plate support depending on the size of your bars and the size of your pattern.'
  merge: -1
  img_proc: true
- pgno: 322
  md: '![](img/baa027bed101c08b496f1f420cee8a5b_322_0.png)


    Figure 10.20 – Adding a hexagonal pattern for a base plate support


    In this section, we covered how to add an explicit base plate support to increase
    the likelihood of print success for large parts. Base plate supports create a
    structure and a flat surface for the print to improve adherence to the build plate.
    By controlling the shape and thickness of the base plate support, you can ensure
    successful adhesion to the platform during 3D printing with an SLA/DLP 3D printer.


    # Summary


    Whether you are planning on 3D printing using an FFF printer or a top-down or
    bottom-up SLA/DLP printer, you will need to generate support structures in order
    to successfully print overhanging areas or islands in your sliced model. Depending
    on your 3D printing technology, you may need to generate volume supports or bar
    supports.


    Controlling the size and shape (and therefore, the strength) of these supports
    plays a critical role in whether your prints will be successful or not. In this
    chapter, we explored how to generate volume supports and bar supports for FFF
    prints. We discussed how to effectively apply these supports to the entire body
    or selected surfaces within our components. We showcased how to apply supports
    to both solid and mesh bodies. We demonstrated the impact of changing support
    settings as well as slicing settings to control how those supports are sliced
    and toolpaths are generated. We touched on the impact of the gap between our parts
    and the support structures when generating supports so we can print a successful
    down-skin region while reducing the post-processing workload of our parts.'
  merge: -1
  img_proc: true
- pgno: 323
  md: 'We also highlighted how to create bar supports for SLA/DLP printing. We showcased
    the similarities between bar supports for FFF and resin-based printers as well
    as the unique properties of bar supports for SLA /DLP printers, such as tree structures,
    grouping, and bracing. We also saw how to create base plate supports in order
    to achieve a strong adhesion to the build plate.


    Using the techniques you have learned in this chapter, you can experiment with
    your specific printer, material, and print settings in order to create support
    structures that are just as strong as necessary to successfully print a given
    part, while minimizing material usage and the post-processing time required to
    remove the printed support structures.


    In the next chapter, we will further explore how to slice our models and generate
    an additive toolpath, along with how to simulate that toolpath layer by layer
    in order to better understand the effects of our model orientation, our slicing
    settings, and our support structures.'
  merge: -1
  img_proc: true
