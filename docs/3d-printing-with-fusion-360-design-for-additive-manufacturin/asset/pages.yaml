- pgno: 163
  md: '# Tessellating Models and Exporting Mesh Files to Third-Party Slicers


    Welcome to Chapter 5! In previous chapters, we talked about opening CAD files
    and mesh files in Fusion 360, checking for errors, and repairing them. We also
    covered how to edit CAD and mesh files with design for additive manufacturing
    principles in mind. We highlighted how to lightweight parts using automated modeling
    and shape optimization and simulate them to make sure that they can withstand
    the operating loads and boundary conditions. We also covered how to lightweight
    parts using hollowing and latticing methods to reduce both the amount of material
    and energy required. In this chapter, we will focus on taking those models out
    of Fusion 360 to third-party slicers.


    Autodesk Fusion 360 already has a built-in slicer, and we will cover it in depth
    starting in Chapter 7. In this chapter, we will demonstrate how you can export
    models out of Fusion 360 into other third-party slicers for 3D printing. There
    are hundreds of 3D printing hardware companies on the market today. You may have
    heard of some of the common ones, such as UltiMaker, Prusa, Formlabs, EOS, Renishaw,
    Stratasys, and Nikon. Some 3D printers are open to third-party print preparation
    solutions and allow for software such as Fusion 360 to slice models and create
    toolpaths for 3D printing. Meanwhile, others require their users to utilize the
    proprietary slicer. Regardless of the type of hardware you use to 3D-print your
    models, it is a good idea to have a basic understanding of how to export models
    out of Fusion 360 in case you need to use them elsewhere.


    Each slicer is unique and has dedicated workflows for the 3D printer it supports.
    Most, if not all, 3D printing slicers utilize common mesh files such as STL or
    OBJ file formats. More recently many free-to-use slicers such as PrusaSlicer from
    Prusa Research, Cura from UltiMaker, and PreForm from Formlabs have started accepting
    3MF file formats.


    It is less common for free-to-use 3D printing slicers to read in solid geometry
    from CAD software such as Fusion 360, Inventor, or SolidWorks. However, paid versions
    of certain slicers (e.g., Ultimaker Professional – https://ultimaker.com/software/ultimaker-professional/
    –'
  merge: -1
  img_proc: true
- pgno: 164
  md: 'Fusion 360, and Autodesk Netfabb Premium –https://www.autodesk.com/products/netfabb/overview)
    have the capability to read in universal solid model file formats such as STEP
    or SAT as well as native CAD files from various CAD software.


    Fusion 360 has a built-in slicer, which we will highlight in Chapters 7 through
    12. However, Fusion 360''s slicer does not support all 3D printers on the market.
    As we mentioned at the beginning, certain 3D printers have their proprietary slicing
    software. In certain organizations, software coordinators may decide which slicing
    software a manufacturing engineer may use, or you may simply wish to use a slicing
    software you are already familiar with. In such cases, after creating a model
    and modifying it for the 3D printing technology, which we covered how to do in
    Chapters 1 through 4 of this book, you may want to export your models to your
    preferred slicer. In this chapter, we will go over the various methods with which
    you can export your Fusion 360 models to your preferred slicer.


    We will start the chapter by talking about the various mesh files and how they
    are used for 3D printing. Next, we will focus on how to create mesh files within
    Fusion 360. We will end the chapter by showcasing how to export geometry as a
    mesh file and highlighting how you can streamline your workflow between Fusion
    360 and a third-party slicer by sending your mesh files directly to your desired
    3D printing utility.


    In this chapter, we will cover the following main topics:


    +   - Common mesh file formats and their differences

    +   - Tessellation, a critical step for 3D printing with non-Fusion 360 slicers

    +   - Exporting a mesh file or sending your models to your slicer


    By the end of this chapter, you will have learned why we need to mesh certain
    types of models in order to 3D-print them. You will also have a better understanding
    of the differences between common mesh file formats and the type of information
    each mesh file can contain. You will be able to convert a solid or volumetric
    lattice body in Fusion 360 into a mesh body, and you will have a good understanding
    of how to export mesh bodies from Fusion 360 directly to your slicer.


    # Technical requirements


    All the topics covered in this chapter are accessible to Startup, Educational
    Fusion 360 license types. If you have a commercial license of Fusion 360, in order
    to create a volumetric lattice and/or convert it into a mesh body, you will also
    need access to the Product Design extension (https://www.autodesk.com/products/fusion-360/product-design-extension).


    Autodesk offers a 14-day trial for the Product Design extension. You can activate
    your trial from the Extensions dialog within Fusion 360.


    Product Design extension access is not available for personal/hobby licenses of
    Fusion 360.


    The lesson files for this chapter can be found here: https://github.com/PacktPublishing/3D-Printing-with-Fusion-360.'
  merge: -1
  img_proc: true
- pgno: 165
  md: '# Common mesh file formats and their differences


    In computer-aided design and modeling, a mesh is a collection of vertices and
    edges that defines the shape of an object. If we are dealing with a 2D design,
    we end up with a collection of lines. If we are 3D-modeling an object, we can
    represent a shape using polygons made up of vertices and edges. The simplest form
    of a polygon is a triangle. A triangle represents a face, and when we have multiple
    faces coming together with common edges, we can model any geometry. Whenever a
    model is represented using a collection of polygons, it is referred to as a mesh
    model. At its core, a mesh model can be represented with the coordinates of all
    the vertices and an identifier for each vertex. You also need a list of edges
    that connect two vertices. Finally, you need a list of faces that are made up
    of three or more edges. Because of the simplicity of the definition of a mesh
    file, there are tens of mesh file formats out there.


    # STL format


    The most well-known and used mesh file format is STL. It is also the oldest and
    has the most limitations. The STL file format was created by 3D Systems to aid
    in its first commercial 3D printers in 1987. There are both a binary and an ASCII
    file format for STL. The binary version is more common as it is more compact.
    The ASCII version is a collection of faces and the vertices that make up those
    faces and can be read using a standard text editor application such as Notepad:


    ![](img/baa027bed101c08b496f1f420cee8a5b_165_0.png)


    Figure 5.1 – An STL file in ASCII format as viewed in Notepad'
  merge: -1
  img_proc: true
- pgno: 166
  md: 'The STL file format does not contain critical information such as units, color,
    or texture. Over the years, as 3D printing became more widespread and colored
    3D printers became available, there emerged a growing need to have a new file
    format with color and texture information, the OBJ format.


    # OBJ format


    The OBJ file format is the next most common file format after STL in 3D printing
    as it contains color and texture information. However, the OBJ file format also
    does not contain units even though it may include the unit information in a comment
    line.


    # 3MF format


    To address all the shortcomings of STL and OBJ file formats and provide a solution
    path for potential future improvements in the additive manufacturing industry,
    a consortium was created and the 3MF file format was founded. The 3MF file format
    contains information about units, color, texture, material, metadata, copyright
    information, volumetric modeling data, beam data, slice data, as well as file
    security through a multitude of extensions.


    There are a number of design and manufacturing software that support the 3MF file
    format at various levels. You can learn more about how each additive manufacturing
    software can either import or export 3MF files and which specific capabilities
    are supported in the import/export workflow in the Compatibility section within
    the 3MF Consortium web page: https://3mf.io/compatibility-matrix/.


    Fusion 360 can import 3MF files that contain unit, color, and texture data, which
    we covered in Chapter 1. Fusion 360 can export mesh data or tessellate a solid/surface
    model and export it as a 3MF file. We will cover the export workflow in detail
    in the following section.


    # Tessellation, a critical step for 3D printing with non-Fusion 360 slicers


    As we learned in the chapter introduction, there are many slicers out there for
    3D printing. Even though certain slicers can accept solid models from CAD software,
    more often than not, you will have to tessellate your models and turn them into
    mesh models prior to sending them to your preferred slicer. Fusion 360 can convert
    solid and surface models into mesh bodies using the TESSELLATE command located
    within the MESH tab of the CREATE panel.


    # Tessellating a solid body


    The TESSELLATE command has multiple options to control what the mesh outcome will
    look like. After selecting a body or a component to tessellate, you can use the
    Refinement Settings dropdown and change the quality of the tessellated mesh body.
    The default refinement option is medium, but I would recommend using high in order
    to get a more refined mesh outcome, especially around a'
  merge: -1
  img_proc: true
- pgno: 167
  md: 'curved surface. The refinement option you choose controls the input values
    for **Surface Deviation** and **Normal Deviation** based on the selected geometry.
    In addition, you can reduce the input values for **Maximum Edge Length**, which
    would create smaller lines, and **Aspect Ratio**, which would create a mesh body
    with more uniform-looking triangles. The **Preview** checkbox within the tessellate
    dialog gives you a visual representation of the meshed outcome, as well as a numerical
    count for the number of triangles the mesh body will have.


    *Figure 5.2* shows a side-by-side visualization of a solid body and a preview
    of what a mesh version of that same body would look like:


    ![](img/baa027bed101c08b496f1f420cee8a5b_167_0.png)


    Figure 5.2 – Tessellating a solid body to convert it into a mesh body


    Once a solid body has been tessellated, it will be consumed in the new mesh body,
    which will also be marked with a new icon within the browser. When tessellating
    solid bodies, every face of the solid body will be a unique face group within
    the mesh body. If you want to visualize the face groups of a mesh body, you can
    toggle the **Display Mesh Face Groups** option within the **INSPECT** panel, as
    shown in *Figure 5.3*.'
  merge: -1
  img_proc: true
- pgno: 168
  md: '![](img/baa027bed101c08b496f1f420cee8a5b_168_0.png)


    Figure 5.3 – Mesh face groups can be visualized after tessellating a solid body


    Another example of why we need to tessellate a body prior to exporting to a third-party
    slicer can be demonstrated for bodies with a volumetric lattice definition, which
    we’ll see in the next section.


    # Tessellating a body with a volumetric lattice


    As you may recall, we covered volumetric lattices in Chapter 4. Figure 5.4 shows
    the bracket we have worked on in this chapter, with a gyroid cell shape lattice
    and a skin around most of the exterior faces.


    ![](img/baa027bed101c08b496f1f420cee8a5b_168_1.png)


    Figure 5.4 – Bracket with a volumetric lattice'
  merge: -1
  img_proc: true
- pgno: 169
  md: 'When attempting to export models created in Fusion 360 with a volumetric lattice
    using traditional export methods, such as the **3D PRINT** command located within
    the **UTILITIES** tab of the **MAKE** panel, we can see that Fusion 360 cannot
    generate a mesh outcome as a part of the export workflow. As shown in Figure 5.5,
    a mesh preview is not available, and the number of triangles is 0 when the input
    body contains a volumetric lattice.


    ![](img/baa027bed101c08b496f1f420cee8a5b_169_0.png)


    Figure 5.5 – Attempting to export a body with a volumetric lattice


    In such cases, we need to convert our volumetric model into a tessellated version
    prior to export. Fusion 360 has a dedicated workflow for converting bodies with
    volumetric lattice data into meshes. We cannot use the **TESSELLATE** command
    located within the **MESH** tab of the **CREATE** panel.


    In order to tessellate a body with volumetric lattice data, right-click on the
    desired body in the **BROWSER** window and select **Create Mesh** from the pop-up
    menu, as shown in Figure 5.6. Then, we can edit the **Refinement** option, and
    upon selecting **OK**, Fusion 360 will create a new mesh body and hide the original
    solid body with the volumetric lattice.'
  merge: -1
  img_proc: true
- pgno: 170
  md: '![](img/baa027bed101c08b496f1f420cee8a5b_170_0.png)


    Figure 5.6 - Selecting a volumetric lattice body and creating a mesh body


    Once the mesh body is created, we can simply select it from the BROWSER window,
    right-click and select PROPERTIES from the pop-out menu, and observe information
    such as Facet Count, Vertex Count, and Center of Mass. We can also get information
    about the quality of the mesh, such as whether it encloses volume and whether
    all the triangles are oriented properly, as shown in Figure 5.7.


    ![](img/baa027bed101c08b496f1f420cee8a5b_170_1.png)


    Figure 5.7 – Properties of a mesh body created from a volumetric lattice body'
  merge: -1
  img_proc: true
- pgno: 171
  md: 'In this section, we covered how to tessellate solid bodies as well as bodies
    with volumetric lattice data. We touched on the need to tessellate bodies before
    exporting them to third-party slicers, as models with volumetric lattice data
    cannot be exported to third-party slicers directly as 3MF files. In the next section,
    we will highlight how to send solid and mesh data to third-party slicers.


    # Exporting mesh files or sending models to your slicer


    Transferring a model from Fusion 360 to a third-party slicer from the design workspace
    has a very similar workflow to tessellating models. Instead of using the **MESH**
    tab to tessellate the model, we can simply use the **3D PRINT** command located
    within the **UTILITY** tab of the **MAKE** panel. The **3D PRINT** dialog allows
    us to choose a single object to be exported out of Fusion 360. That selection
    could be a solid body, a surface body or a mesh body, or a component containing
    one or more of those bodies.


    # Exporting models directly to third-party slicers


    As shown in *Figure 5.8*, by selecting a body and choosing the relevant refinement
    options, we can preview the mesh outcome within the **3D PRINT** dialog. Just
    like in the **TESSELLATE** command, we can edit **Refinement Options** to get
    the desired quality out of our export process.


    The **3D PRINT** dialog has several unique options, which we will cover next.
    The first one is the **Format** dropdown. Using the **Format** menu, we can choose
    to export our models as STL, OBJ, or 3MF files. If we choose an STL or OBJ file,
    we also have the ability to scale our model during the export process.


    Models created with Fusion 360 always include units. If we have a model with a
    certain edge with a dimension of 1,000 millimeters, upon exporting it in an STL
    or OBJ file format with the unit type of millimeters, we will end up with a mesh
    file that will represent that same edge as 1,000, as STL and OBJ files do not
    have a unit system. If we change the unit type to centimeters within the **3D
    PRINT** dialog during the export process, the resulting file will list the same
    edge as 100. This means Fusion 360 will scale the model by a factor of 0.1 when
    we choose centimeters as the unit type.


    > **Note**

    > The following scale factors apply when exporting models as STL or OBJ files
    using the **3D PRINT** dialog: millimeter = 1, centimeter = 0.1, meter = 0.001,
    inch = 0.03937, and foot = 0.003281.'
  merge: -1
  img_proc: true
- pgno: 172
  md: '![](img/baa027bed101c08b496f1f420cee8a5b_172_0.png)


    Figure 5.8 – The 3D PRINT dialog to export a model as an STL file


    The 3D PRINT dialog can also automatically launch a print utility and open the
    newly generated STL, OBJ, or 3MF file within that software. Figure 5.8 shows the
    example of an STL file being created and sent to the PreForm software from Formlabs.
    After selecting OK in the 3D PRINT dialog, PreForm will launch, and the STL file
    will be loaded into the last used printer setup as a new job, as shown in Figure
    5.9.


    ![](img/baa027bed101c08b496f1f420cee8a5b_172_1.png)


    Figure 5.9 – STL file in Formlabs PreForm software


    When using the 3D PRINT dialog, we are not limited to selecting single bodies.
    We can also choose an entire assembly as an input, and export using the STL, OBJ,
    or 3MF format, as shown in Figure 5.10.'
  merge: -1
  img_proc: true
- pgno: 173
  md: '![](img/baa027bed101c08b496f1f420cee8a5b_173_0.png)


    Figure 5.10 – Parts arranged in 3D as an assembly being exported to Autodesk Netfabb


    In Figure 5.10, we have chosen to transfer all 16 components to a 3D print utility
    named Autodesk Netfabb using 3MF as the file format. As shown in Figure 5.11,
    once Autodesk Netfabb launches and all parts are loaded into its browser, we can
    see that the names of all 16 parts have come over to Netfabb. The part arrangement
    in Fusion 360 is also transferred to Netfabb with the same command. This is because
    we have chosen 3MF as the export file format, which contains all this information
    and more.


    ![](img/baa027bed101c08b496f1f420cee8a5b_173_1.png)


    Figure 5.11 – Component names and part arrangement in Netfabb'
  merge: -1
  img_proc: true
- pgno: 174
  md: 'In the Tessellating a body with a volumetric lattice subsection, we demonstrated
    how to convert a body with volumetric lattice data into a tessellated mesh object.
    Figure 5.12 shows that same mesh body being transferred as a 3MF file into a third-party
    3D print utility called PreForm. Whenever we are exporting a mesh body or transferring
    it to a 3D print utility, the 3D PRINT dialog will automatically hide the irrelevant
    options, such as Preview Mesh, Number of Triangles, and Refinement, as those settings
    are only applicable when exporting a solid body as a mesh object.


    ![](img/baa027bed101c08b496f1f420cee8a5b_174_0.png)


    Figure 5.12 – A tessellated mesh body being used as an input to export to PreForm


    Regardless of whether we are sending a solid body or a mesh body to a 3D print
    utility, the outcome will be very similar. In the example in Figure 5.12, where
    we sent a mesh body as a 3MF file to PreForm, the Formlabs PreForm software will
    start and the 3MF file will open within the application, as shown in Figure 5.13:'
  merge: -1
  img_proc: true
- pgno: 175
  md: '![](img/baa027bed101c08b496f1f420cee8a5b_175_0.png)


    Figure 5.13 – A 3MF file sent from Fusion 360 to PreForm


    The **3D PRINT** dialog output options for the print utility will vary based on
    the software you have installed on your computer.


    # Exporting models directly to non-Fusion 360 slicers


    So far, we have demonstrated how models can be sent to PreForm and Netfabb, which
    are both explicitly available options, assuming that you have those software options
    installed, for the **Print Utility** dropdown menu. If you are using a slicer
    that is not available within the **Print Utility** dropdown, you can choose the
    **Custom** option and point to the executable for the slicer of your choice within
    the **Open** dialog accessible after selecting the folder icon next to the **Application**
    option. Figure 5.14 shows how to select a custom print utility and assign `prusa-slicer.exe`
    as the application.'
  merge: -1
  img_proc: true
- pgno: 176
  md: '![](img/baa027bed101c08b496f1f420cee8a5b_176_0.png)


    Figure 5.14 – Selecting a custom print utility executable as a part of the 3D
    PRINT dialog


    After designating the application as PrusaSlicer and selecting OK within the 3D
    PRINT dialog, we can transfer our solid or mesh bodies to this slicer as STL,
    OBJ, or 3MF files. Figure 5.15 shows the outcome of transferring an STL file from
    Fusion 360 to PrusaSlicer using the 3D PRINT dialog.


    ![](img/baa027bed101c08b496f1f420cee8a5b_176_1.png)


    Figure 5.15 – An STL file sent from Fusion 360 to PrusaSlicer'
  merge: -1
  img_proc: true
- pgno: 177
  md: 'In certain cases, we may not want to send our models to a 3D print utility
    but rather export them as a mesh file. Figure 5.16 shows how we can utilize the
    3D PRINT dialog to export our models out of Fusion 360 as STL files. To achieve
    this, we simply need to uncheck the Send to 3D Print Utility checkbox and select
    OK.


    ![](img/baa027bed101c08b496f1f420cee8a5b_177_0.png)


    Figure 5.16 – Exporting an STL file out of Fusion 360


    After pressing OK within the 3D PRINT dialog, we will see the Save As dialog,
    as shown in Figure 5.17.


    ![](img/baa027bed101c08b496f1f420cee8a5b_177_1.png)


    Figure 5.17 – Saving the STL file to your local hard disk and your project'
  merge: -1
  img_proc: true
- pgno: 178
  md: 'Using this standard dialog, we can export all our files as STL, OBJ, or 3MF
    files to our computer and/ or to a Project within our Fusion Team.


    # Exporting models out of Fusion 360


    Fusion 360 has several other options for exporting models as mesh bodies. One
    such option is to use the File dropdown and utilize the Export command. Once the
    Export dialog is visible, you can change your file extension to your desired mesh
    type, and Fusion 360 will export your model as such.


    > Note

    > If you are using the File | Export option, you do not have control over the
    mesh quality.


    My preferred method for exporting models as mesh files is by selecting the body
    or component within the browser or canvas, right-clicking on the selection, and
    choosing the Save As Mesh option, as shown in Figure 5.18. The resulting SAVE
    AS MESH dialog is very similar to the 3D PRINT dialog we covered throughout this
    section with one key difference. The SAVE AS MESH dialog also allows you to select
    the export Structure setting.


    ![](img/baa027bed101c08b496f1f420cee8a5b_178_0.png)


    Figure 5.18 – The SAVE AS MESH command can control the file structure


    If you are exporting multiple components, you can choose to save them as a single
    file or a unique file per body. Depending on your needs, exporting multiple components
    as unique files with this single dialog can save you a lot of time and automate
    your file export workflow.'
  merge: -1
  img_proc: true
- pgno: 179
  md: '# Summary


    In this chapter, we talked about how a body can be represented as a mesh object,
    and the generic file specifications for a mesh file format. We introduced the
    STL file format and talked about its limitations with respect to units, colors,
    and textures. We briefly touched on how the OBJ file format includes color and
    texture information but lacks information about units. We introduced the 3MF file
    format and referenced the various extensions the 3MF file format has for defining
    not only geometry and units but also color, texture, beam definition, and volumetric
    data. We also talked about how to tessellate both solid bodies and bodies with
    volumetric lattice data within Fusion 360. We ended the chapter by highlighting
    various ways we can export geometry out of Fusion 360 as mesh data.


    We demonstrated how to export models directly to third-party slicers, such as
    Formlabs PreForm and Autodesk Netfabb, as well as other slicers, such as PrusaSlicer,
    which are not necessarily in the native export option list within Fusion 360’s
    **3D PRINT** dialog. Finally, we demonstrated how to export models out of Fusion
    360 as a single file or one file per body to automate our export process.


    Using these techniques, we can easily export our models as mesh bodies to our
    preferred slicers so that we can 3D print our parts quickly.


    In the next chapter, we will transition from talking about third-party slicers
    and start introducing the **MANUFACTURE** workspace of Fusion 360 for print preparation
    in order to use this workspace as a native slicer.'
  merge: -1
  img_proc: true
- pgno: 180
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 181
  md: '# Introducing the Manufacture Workspace for Print Preparation


    Welcome to Chapter 6. In previous chapters, we talked about working with various
    file types using Fusion 360. We showed you how to inspect and repair problematic
    mesh models. We also touched on how to design parts with additive manufacturing
    principles in mind. We covered how to use lightweight parts using various techniques
    such as latticing, and we simulated them to make sure they would perform under
    operating conditions. We also covered how to tessellate our models so that we
    can export them to other slicers. In this chapter, we will focus on how to use
    Fusion 360 more effectively to manipulate models for print preparation.


    Until now, most of the models we’ve worked with were single parts. There are many
    reasons why we may want to make modifications to a part before slicing it for
    3D printing. We may want to scale up or scale down our part to print a different
    size. We may want to orient and arrange our parts on the build platform and print
    multiple copies of the same part in one print. As we covered in the previous chapters,
    we may want to hollow and lattice our parts based on their orientation and add
    drain holes. We may want to add or modify certain features so that our parts can
    be printed without support structures or adhere to the build plate more effectively.
    Similarly, if we are working with an assembly, we may want to only print a select
    few parts within that assembly. Naturally, the positioning and orientation of
    those parts will differ on the 3D printer build plate from how they were originally
    designed and oriented. For these reasons and more, we need a new version of our
    design for 3D printing. In Chapter 5, after exporting our model to a third-party
    slicer, the file we created and saved within our slicer was that new version.
    In this chapter, we will explore the various ways Fusion 360 enables us to create
    a new version of our design specifically for 3D printing.


    The main benefit of staying within Fusion 360 to create a new version of our design
    for manufacturing is that Fusion 360 keeps the associativity between the as-designed
    version of a given model and the to-be-manufactured version of the same part.
    This means that if we decide to make a change to the original design upstream,
    our downstream manufacturing model will automatically be updated accordingly.'
  merge: -1
  img_proc: true
- pgno: 182
  md: 'There are two ways Fusion 360 allows you to create a manufacturing model while
    keeping associativity. The first method is to create an entirely new Fusion 360
    design and utilize the insert functionality to import components from other designs.
    The second method is to utilize the Manufacturing Model functionality in the **MANUFACTURE**
    workspace. In this chapter, we will go over both workflows in detail and highlight
    the benefits and drawbacks of each method while showcasing common examples of
    design changes we may want to make before 3D printing.


    In this chapter, we will cover the following topics:


    +   - Using the derive workflow to manage model changes for print preparation

    +   - Creating manufacturing models for 3D printing

    +   - Common part modifications for 3D printing


    By the end of the first section, you will have learned how to utilize Fusion 360
    to create new models and gather components from other designs to prepare them
    for 3D printing. In the next section, you will learn about how to access the **MANUFACTURE**
    workspace and create manufacturing models. By the end of this chapter, you will
    have mastered how to make design changes upstream in your original design documents
    and how they propagate down to your manufacturing models. You will also understand
    how the changes you make downstream to the manufacturing model do not flow upstream
    to the original design.


    # Technical requirements


    Most of the topics covered in this chapter are accessible to Personal, Trial,
    Commercial, Startup, and Educational Fusion 360 license types. There are certain
    Fusion 360 commands, such as **ARRANGE**, that are not accessible with the Personal
    license type. In examples where a certain function is not accessible with a Personal
    license type, an alternative feature will be presented so that you can continue
    with the exercise.


    If you have a Commercial license of Fusion 360, to create a volumetric lattice,
    you will also need access to the Product Design extension (`https://www.autodesk.com/products/Fusion-360/product-design-extension`).


    Autodesk offers a 14-day trial for the Product Design extension. You can activate
    your trial within the **EXTENSIONS** dialogue of Fusion 360.


    Product Design extension access is not available for personal/hobby licenses of
    Fusion 360.


    The lesson files for this chapter can be found here: `https://github.com/PacktPublishing/3D-Printing-with-Fusion-360`.'
  merge: -1
  img_proc: true
- pgno: 183
  md: '# Using the derive workflow to manage model changes for print preparation


    If you have used a third-party slicer (for example, Cura, PrusaSlicer, or PreForm),
    you are probably familiar with how, upon launching such software, they often give
    you an empty workspace where you can insert your parts to be 3D-printed. Whenever
    we want to use Fusion 360 as a slicer, we can follow a similar workflow by creating
    a new design and saving it with a new name. Once we have saved our design, we
    can use it as an empty workspace to aggregate bodies and components from other
    projects or folders within our Fusion Team to prepare them for 3D printing. Figure
    6.1 shows how to utilize the **Insert Derive** functionality located in the **SOLID**
    tab''s **INSERT** panel after saving our Fusion 360 design with the name `Example
    A`:


    ![](img/baa027bed101c08b496f1f420cee8a5b_183_0.png)


    Figure 6.1 – Selecting a source model to insert into a saved Fusion 360 design


    To demonstrate this functionality, we will be utilizing a Fusion 360 design named
    `Assembly`. After selecting the source model, Fusion 360 will open the model in
    a new tab and display the **DERIVE** dialogue, as shown in Figure 6.2. At this
    point, we can select which objects we would like to derive from the source file
    to our destination file. In this case, we will select multiple components using
    the browser, as shown in the same figure. Alternatively, we can also choose to
    use the canvas. Keep in mind that the default selection method Fusion 360 utilizes
    will select bodies instead of components within the **DERIVE** dialogue. If you
    want to select a component, you can do so by holding and clicking the left mouse,
    which will bring up a secondary dialogue with two tabs called **Depth** and **Parents**,
    as shown in Figure 6.2. If you go to the **Parents** tab, you will be able to
    select the component that the body you are selecting belongs to and add it to
    the **DERIVE** dialogue. The **DERIVE** dialogue'
  merge: -1
  img_proc: true
- pgno: 184
  md: 'has a couple of additional options we should highlight. The first one is the
    **Place Objects At Origin** checkbox. After selecting this option and completing
    the derive function, Fusion 360 will move all selected components to the global
    origin of the new Fusion 360 design document. This is very useful since a given
    part in an assembly could be far away from the origin, and upon inserting it into
    a new document, you may not be able to visualize it easily if it is hundreds or
    thousands of millimeters away from other components. The next useful option within
    the **DERIVE** dialogue is the ability to bring in the parameters that make up
    the derived components. Figure 6.2 shows that we can choose either **Favorites**
    or all the parameters that make up the component upon deriving it within the new
    Fusion 360 design:


    ![](img/baa027bed101c08b496f1f420cee8a5b_184_0.png)


    Figure 6.2 – Selecting multiple components from the source assembly


    After completing all our selections and pressing the OK button within the **DERIVE**
    dialogue, Fusion 360 will close the source model and display all the inserted
    components in our destination design, named Example A, as shown in Figure 6.3.
    Notice how all the components have been inserted using a single Derive function
    in the timeline. You will also notice that all four components are on top of each
    other as we have used the **Place Objects At Origin** option within the **DERIVE**
    command. This moved all the components near the center of the new Fusion 360 design.
    Using **Display Component Colors** within the **SOLID** tab, which can be found
    in the **INSPECT** panel, we can give each component a unique color:'
  merge: -1
  img_proc: true
- pgno: 185
  md: '![](img/baa027bed101c08b496f1f420cee8a5b_185_0.png)


    # Figure 6.3 – Inserting multiple components from other designs into a new design


    If needed, we could repeat the **Insert Derive** command and add components from
    other Fusion 360 design documents to this design. Once we are done with the insert
    workflow, all the components will likely intersect each other if we use the **Place
    Object At Origin** option within the **DERIVE** dialogue. To organize all inserted
    components, we could utilize the **ARRANGE**, **ALIGN**, or **MOVE** commands
    located in the **SOLID** tab''s **MODIFY** panel.


    # Important note


    Please note that the **ARRANGE** feature is not available for Personal/Free licenses
    of Fusion 360. If you have a Personal/Free license, you can orient and place components
    using the **ALIGN** or **MOVE** commands instead of the **ARRANGE** command.


    Figure 6.4 shows the outcome of using the **ARRANGE** command, and nesting all
    four components on the XY plane, for a virtual 3D printer platform that is 210
    mm long and 210 mm wide, while keeping the components 10 mm apart from each other
    and 10 mm away from the edges of the build plate. The **ARRANGE** command also
    automatically orients the selected components so that the largest face of a given
    component is facing the build plate. In this instance, we have chosen the components
    using the browser, so we can have Fusion 360 auto-orient the components. Alternatively,
    we can choose a component using the canvas by selecting a specific planar face
    within the **ARRANGE** command. When using this method, the **ARRANGE** command
    will reorient the part if needed and have the selected surface face up or face
    down, depending on our choice for the **Object Selected by Face** option:'
  merge: -1
  img_proc: true
- pgno: 186
  md: '![](img/baa027bed101c08b496f1f420cee8a5b_186_0.png)


    Figure 6.4 – Arranging components on the XY plane


    Now that we have our four components arranged on the XY plane with the orientation
    we desire, we can talk a little bit about how to modify these components, as well
    as add new components to our build. To make the visualization a little bit easier,
    we can introduce a new sketch into the XY plane and build a rectangle that represents
    our build plate. In this example, since we are organizing our components for a
    printer with a build plate 210 millimeters wide and 210 millimeters long, we can
    utilize the sketch tools in Fusion 360 to make such a rectangle and have it be
    visible to help us when we are adding new parts or modifying existing ones. One
    common part modification for 3D printing is to utilize the SCALE command. The
    SCALE command is located within the SOLID tab’s MODIFY panel and allows us to
    select bodies or components and uniformly or non-uniformly scale them up or down.
    Figure 6.5 shows a preview of three parts that have been scaled down to 75% of
    their original size. As we don’t need to scale these parts, we will click Cancel
    within the SCALE dialog and proceed to the next step:'
  merge: -1
  img_proc: true
- pgno: 187
  md: '![](img/baa027bed101c08b496f1f420cee8a5b_187_0.png)


    Figure 6.5 – Scaling components within the 3D printer build plate context


    Another common modification before 3D printing is hollowing and latticing. Figure
    6.6 shows how we can simply select the SHELL command located within the SOLID
    tab''s MODIFY panel to select two faces of the component named Yoke to create
    a shelled-out version:


    ![](img/baa027bed101c08b496f1f420cee8a5b_187_1.png)


    Figure 6.6 – Modifying components within the 3D printer build plate context'
  merge: -1
  img_proc: true
- pgno: 188
  md: 'Another example where we can benefit from the design workspace of Fusion 360
    for a setup such as this one is to select a given component and create duplicates
    so that we can print multiples of the same component. Figure 6.7 shows how we
    can select the part named Spur Gear and create a 3x3 rectangular pattern along
    the X and Y axes for a total of nine components and suppress the one which would
    interfere with another part, to create eight total Spur Gear components:


    ![](img/baa027bed101c08b496f1f420cee8a5b_188_0.png)


    Figure 6.7 – Creating a rectangular pattern within the 3D printer build plate
    context


    The main benefit of using a new Fusion 360 design document to make changes such
    as orienting parts, scaling them, or hollowing them out is the fact that such
    changes only impact the document that we are working on and not the source component.
    One way to better understand this point is to look at the document named Assembly.
    As we can see in Figure 6.8, our source Fusion 360 design document has not changed,
    even though we utilized the SHELL command on the Yoke component and created seven
    copies of the Spur Gear component within our Example A manufacturing document:'
  merge: -1
  img_proc: true
- pgno: 189
  md: '![](img/baa027bed101c08b496f1f420cee8a5b_189_0.png)


    Figure 6.8 – The original assembly is unchanged


    If anything changes in the design criteria, a designer can still change the original
    design. They can do this within the Fusion 360 Design document named Assembly
    or within the source component itself. Figure 6.9 shows how you can select several
    features from the timeline and suppress them to eliminate a hole within the Gripper
    source component:


    ![](img/baa027bed101c08b496f1f420cee8a5b_189_1.png)


    Figure 6.9 – Suppressing features to modify the source component'
  merge: -1
  img_proc: true
- pgno: 190
  md: 'After saving this change to the source component, if we switch tabs and look
    at the Assembly Fusion design, we will see a warning message that will inform
    us that one of the source components that makes up this assembly has been updated.
    Upon pressing the Get latest command using the browser, our assembly model will
    update, as shown in Figure 6.10, and the latest version of the Gripper component
    will be visible without holes:


    ![](img/baa027bed101c08b496f1f420cee8a5b_190_0.png)


    Figure 6.10 – A warning message indicating an update to a source component


    After saving the latest version of the source component in the assembly document,
    if we switch our focus to the Example A Fusion design, we will see five warning
    signs, as shown in Figure 6.11. These warning signs inform us that one or more
    components in this Fusion 360 design are out of date and that we should get the
    latest versions of them:'
  merge: -1
  img_proc: true
- pgno: 191
  md: '![](img/baa027bed101c08b496f1f420cee8a5b_191_0.png)


    Figure 6.11 – Warning signs indicate that a component is out of date


    After we update the reference, by double-clicking the warning icon in the browser,
    all the warning signs will disappear, and both instances of the Gripper component
    will be updated so that they are solid objects with no holes, as shown in Figure
    6.12:


    ![](img/baa027bed101c08b496f1f420cee8a5b_191_1.png)


    Figure 6.12 – The warnings have been addressed and all the components are up to
    date'
  merge: -1
  img_proc: true
- pgno: 192
  md: 'In this section, we talked about how we can use an empty Fusion 360 design
    document as a manufacturing model, where we can insert components from other Fusion
    360 designs and reorient and arrange them using the functionality available within
    the **MODIFY** panel of Fusion 360. We also demonstrated how changes we make to
    the manufacturing model do not impact the source components. However, any changes
    we make to a source component will flow downstream and have an impact on our manufacturing
    model. In the next section, we will switch from the design workspace to the manufacturing
    workspace of Fusion 360 and create new components and edit existing ones in that
    workspace.


    # Creating Manufacturing Models for 3D Printing


    In the previous section, we talked about how to utilize the **DERIVE** functionality
    to aggregate components from different sources into a new Fusion 360 design document
    and manage those components for 3D printing. In this section, we will touch on
    how to prepare models for 3D printing within the same Fusion 360 design document.


    In *Chapter 3*, we demonstrated how to change from the **DESIGN** workspace to
    the **SIMULATION** workspace using the workspace switcher menu. In this chapter,
    we will switch back and forth between the **DESIGN** and **MANUFACTURE** workspaces.
    To show you how to create a new manufacturing model within the same Fusion 360
    design document, we will be using a new design document named Example B. As shown
    in *Figure 6.13*, we can access the workspace switcher by clicking on the **DESIGN**
    drop-down menu in the top-left corner of Fusion 360. In this section, we will
    be utilizing the **MANUFACTURE** workspace:


    ![](img/baa027bed101c08b496f1f420cee8a5b_192_0.png)


    Figure 6.13 – Switching from the DESIGN workspace to the MANUFACTURE workspace'
  merge: -1
  img_proc: true
- pgno: 193
  md: 'Once we are in the MANUFACTURE workspace, we will see a new set of ribbon tabs
    for different manufacturing setups, such as MILLING, TURNING, ADDITIVE, INSPECTION,
    and FABRICATION. In this chapter, we will be focusing on the ADDITIVE tab. After
    selecting the ADDITIVE tab, we will also see multiple new panels in the ribbon.
    Changing the workspace from DESIGN to MANUFACTURE automatically creates a new
    version of the Fusion 360 design, similar to how the Insert Derive functionality
    creates a new version within a different design document. This new driven copy
    can be found in the browser under the MODELS tab. Any changes we make to a model
    within the MANUFACTURE workspace, such as moving its position within the context
    of the build volume of our 3D printer, will not affect the model within the DESIGN
    workspace. However, we are limited in what changes we can make to the driven model.
    That is why we may want to create a new manufacturing model that will allow us
    to edit the geometry similar to how we can modify it within the DESIGN workspace.


    One key difference between using the manufacturing model in the MANUFACTURE workspace
    versus a manufacturing model we can create ourselves using the Insert Derive functionality
    we covered in the previous section is that the Insert Derive functionality allows
    us to bring the CAD parameters into our new design. The manufacturing model we
    create in the MANUFACTURE workspace does not carry along the model parameters.
    Therefore, we will not be able to edit our model using the parameters with which
    it was built. When we are editing our manufacturing model in the MANUFACTURE workspace,
    we will have to create new sketches and features that are independent of the features
    and parameters that were used to create the original design.


    Within the SETUP panel of the ADDITIVE tab, we can create a new manufacturing
    model, as shown in Figure 6.14. This action creates a new manufacturing model
    named Manufacturing Model 1 and displays it under the manufacturing models list
    within the browser:


    ![](img/baa027bed101c08b496f1f420cee8a5b_193_0.png)


    Figure 6.14 – Creating a new manufacturing model within the MANUFACTURE workspace'
  merge: -1
  img_proc: true
- pgno: 194
  md: 'In the next chapter, we''ll create an additive setup so that we can arrange
    and orient our parts within the context of our 3D printer. In this chapter, we
    will focus on editing the manufacturing model to make slight modifications to
    it. To modify components within our design, we can simply right-click on the manufacturing
    model and select **Edit Manufacturing Model**, as shown in *Figure 6.15*.


    ![](img/baa027bed101c08b496f1f420cee8a5b_194_0.png)


    Figure 6.15 – Editing the manufacturing model


    When we are editing a manufacturing model, we will still be in the **MANUFACTURE**
    workspace of Fusion 360. Yet Fusion 360''s ribbon will update, and we will see
    tabs we are used to seeing in the **DESIGN** workspace of Fusion 360, such as
    **SOLID**, **SURFACE**, **MESH**, and **PLASTIC**. The browser will also be customized
    for the items related to the manufacturing model and will not display any additive
    or subtractive setup listed under the Setups folder. As shown in *Figure 6.16*,
    we can create sketches and profiles to add or remove material from our original
    design:'
  merge: -1
  img_proc: true
- pgno: 195
  md: '![](img/baa027bed101c08b496f1f420cee8a5b_195_0.png)


    Figure 6.16 – Making a design change within the MANUFACTURE workspace


    In this example, we have chosen to remove the semicircular pattern from the Gripper
    v5 component by sketching a profile and using the Extrude: Cut operation on the
    source body. As you can see in Figure 6.14, even though the Gripper v5 and Gripper
    v1 (Mirror) components were created in the DESIGN workspace using the MIRROR feature,
    updating one of them does not automatically update the other as the mirrored component
    is not a second instance of the original component; rather, it is an independent
    component:


    ![](img/baa027bed101c08b496f1f420cee8a5b_195_1.png)


    Figure 6.17 – Impact of the design change on mirrored components'
  merge: -1
  img_proc: true
- pgno: 196
  md: 'If we switch back to the **DESIGN** workspace, as shown in *Figure 6.18*, we
    will not see any change to the source components. Changes we make to the manufacturing
    model within the **MANUFACTURE** workspace only impact that specific manufacturing
    model and do not affect the original design or any other subsequent manufacturing
    models:


    ![](img/baa027bed101c08b496f1f420cee8a5b_196_0.png)


    Figure 6.18 – Impact of the edited manufacturing model on the design


    We can use this to our benefit and create multiple manufacturing models and have
    different versions of the same model saved within a single Fusion 360 design document.
    A common reason to use this workflow is to create a unique version of a component
    for each manufacturing method you may need to utilize in a hybrid manufacturing
    scenario. In certain cases, we may want to 3D-print our model with a certain set
    of features, inspect the outcome, and use subtractive operations such as surface
    finishing or drilling to finish our manufacturing process to achieve our desired
    outcome. In such cases, we may create **Manufacturing Model 1** for our additive
    manufacturing setup, **Manufacturing Model 2** for our subtractive manufacturing
    setup, and **Manufacturing Model 3** for our inspection setup.


    Another key difference between using the **DERIVE** workflow versus creating a
    manufacturing model within the **MANUFACTURE** workspace and editing models within
    that workspace is around data management:'
  merge: -1
  img_proc: true
- pgno: 197
  md: '![](img/baa027bed101c08b496f1f420cee8a5b_197_0.png)


    Figure 6.19 – Deleting a document that''s used in other designs


    If we have a model in the DESIGN workspace, after creating one or multiple manufacturing
    models and editing them, we can delete the original Fusion 360 design document,
    and all related manufacturing data will be deleted.


    If we utilize the DERIVE functionality and insert components from other Fusion
    360 designs into a new Fusion 360 design document, we cannot delete the source
    document. To delete the source document, we have a handful of options. First,
    we can delete the new design document and then delete the source document. Alternatively,
    within the new design, we can break the link between the source document and the
    new design, and then delete the source document, assuming that the new design
    document does not have previously saved versions containing a reference to the
    source document. Our last option is to move the source document from its current
    Fusion 360 project to a new project where we collect and manage all items we wish
    to delete in the future. Once we are ready to delete everything within that project,
    we can archive it using Fusion''s TEAM functionality and then delete it. If we
    do not utilize one of these three options, we will be blocked while attempting
    to delete the source Fusion 360 design document and see a warning message, informing
    us about the fact that the source document is referenced in other Fusion 360 designs,
    as shown in Figure 6.19.


    # Common part modifications for 3D Printing


    There are many reasons why you may want to modify a model for 3D printing. If
    you have a part that is too large for your 3D printer''s build volume, you may
    need to cut it into multiple smaller pieces so that you can manufacture it. You
    may also want to add pins and holes to each piece so that the'
  merge: -1
  img_proc: true
- pgno: 198
  md: 'cutout parts can easily align and fit together after printing. You may want
    to change the dimensions of certain features, such as holes or pockets, to add
    small tolerances so that the surfaces where these features will mate with other
    objects have the desired clearance once the parts are manufactured. You may need
    to remove small features your printer may not be able to print or include features
    such as fillets to smooth out sharp edges. You may rearrange and orient your parts
    to minimize the need for support structures during 3D printing. Once your parts
    are in their desired orientation, you may want to hollow them out for lightweighting
    and include internal lattices to add stiffness and eliminate the need to create
    support structures inside the hollowed-out body.


    In this section, we will highlight a few of these common part modification methods
    you can use in Fusion 360. As we covered in the previous sections, you can make
    your manufacturing-related part modification in one of two ways: you can create
    a new Fusion design and insert the model(s) you wish to modify, or you can switch
    over to the **MANUFACTURE** workspace, create a new manufacturing model, and edit
    it. In this section, we will demonstrate all the modifications directly within
    the **MANUFACTURE** workspace so that we can keep all the changes in a single
    Fusion 360 document. To demonstrate a few of the common part modifications, we
    will use the `Example C` part, which can be seen in Figure 6.20. As we can see,
    after switching from the **DESIGN** workspace to the **MANUFACTURE** workspace,
    we will create a manufacturing model to edit our geometry. In this example, we
    will create four manufacturing models using the **Create Manufacturing Model**
    command, which is located within the **ADDITIVE** tab of the **SETUP** panel:


    ![](img/baa027bed101c08b496f1f420cee8a5b_198_0.png)


    Figure 6.20 – Creating four manufacturing models based on the original design'
  merge: -1
  img_proc: true
- pgno: 199
  md: 'Once we have created all four manufacturing models, we will activate **Manufacturing
    Model 1** by right-clicking it and choosing **EDIT**. In this first manufacturing
    model, we will demonstrate how to create two components that will be used for
    different manufacturing processes.


    Our example model is already in the correct orientation for 3D printing. However,
    the large hole along the Y-axis cannot be 3D-printed accurately to our desired
    specifications without a support structure. In such cases, we have several options
    if we do not want to utilize support structures.


    We can duplicate the original components and modify the hole so that it can be
    3D-printed without support structures. Then, we can use the 3D-printed part as
    the stock material and create a hole using our original component as a reference
    to create the drilling operation in a milling setup and produce the finished design.
    Let’s go through the steps of this process using Fusion 360 by duplicating our
    original component using the **Move/Copy** command located in the **SOLID** tab’s
    **MODIFY** panel, as shown in *Figure 6.21*. After selecting the component we
    wish to duplicate, we will have to check the **Create Copy** checkbox and click
    **OK**:


    ![](img/baa027bed101c08b496f1f420cee8a5b_199_0.png)


    Figure 6.21 – Creating a duplicate component while editing Manufacturing Model
    1


    Once we have two components, we may want to rename our second component to better
    organize our design. In this example, I chose to name the second component Copy,
    as shown in *Figure 6.22*.


    Next, we will have to create a sketch so that we can modify the hole. To start
    a sketch, we can choose the **CREATE SKETCH** command located in the **SOLID**
    tab’s **CREATE** panel and select one of the faces along the XZ plane. Once we
    are in the sketching environment, we can project the profile of the'
  merge: -1
  img_proc: true
- pgno: 200
  md: 'hole and create a 45°-45°-90° right triangle, as shown in *Figure 6.21*. The
    reason why we are creating a 45-degree angle is that most 3D printers can manufacture
    parts without needing support structures up to 45-degree overhang angles. We will
    cover this topic in more detail in *Chapter 10*:


    ![](img/baa027bed101c08b496f1f420cee8a5b_200_0.png)


    Figure 6.22 – Sketching a profile within the hole


    Once we have created the desired profile, we can use the **EXTRUDE** feature located
    in the **SOLID** tab''s **CREATE** panel. We will select the two profiles between
    the triangle and the top half of the circle. As shown in *Figure 6.23*, after
    extruding these profiles from one side of the hole to the other, we will end up
    with a component that can be 3D-printed without support structures. However, this
    new design has a hole that is shaped differently from the desired outcome. Therefore,
    after 3D-printing the Copy component, we will have to create a milling setup.
    Here, we must use the 3D-printed component as the stock and drill a hole using
    the geometry stored in the original component, named `Example C`:'
  merge: -1
  img_proc: true
- pgno: 201
  md: '![](img/baa027bed101c08b496f1f420cee8a5b_201_0.png)


    Figure 6.23 – Adding material to the hole to print without supports


    Another alternative we have is to make a slightly larger hole so that we can print
    our component without the need for support structures or secondary milling operations.
    To demonstrate this workflow, let''s activate **Manufacturing Model 2** by right-clicking
    it and choosing **EDIT**, as shown in Figure 6.24. We will create a new sketch
    on the same face we worked on in **Manufacturing Model 1**. In this case, we will
    also create a circle to match the projected geometry of the original hole and
    create two lines that are 45 degrees from the horizontal plane and are connected
    to the circle using a tangent constraint, as shown in Figure 6.24:'
  merge: -1
  img_proc: true
- pgno: 202
  md: '![](img/baa027bed101c08b496f1f420cee8a5b_202_0.png)


    Figure 6.24 – Editing Manufacturing Model 2


    After finishing the sketch, we can use the EXTRUDE feature and remove the new
    profile we have created from the original component. This action will create a
    larger hole that, when 3D-printed, can still accommodate a pin through the hole.
    However, unlike the version we had before making this modification, this part
    can now be 3D-printed without the need for support structures:


    ![](img/baa027bed101c08b496f1f420cee8a5b_202_1.png)


    Figure 6.25 – Removing material from the hole to print it without supports'
  merge: -1
  img_proc: true
- pgno: 203
  md: 'To take this example one step further, let''s switch to **Manufacturing Model
    3**, as shown in *Figure 6.26*. We will once again edit the manufacturing model
    and create a sketch on the same face we have worked on for the first two manufacturing
    models. In this manufacturing model, we will repeat the same steps we did in **Manufacturing
    Model 2** to create a circle and two lines that are 45 degrees away from the horizontal
    axis and our tangent to the circle. In addition, we will create a rectangle above
    the circle within the triangular profile:


    ![](img/baa027bed101c08b496f1f420cee8a5b_203_0.png)


    Figure 6.26 – Editing Manufacturing Model 3


    Using these rectangular and triangular profiles, we can create another cut-out
    using the **EXTRUDE** feature, as shown in *Figure 6.27*. This new shape we created
    can not only be 3D-printed without the need for support structures but can also
    accommodate a pin that is slightly larger in diameter than the hole. This may
    be desirable as our 3D-printed geometry may not come out to our desired tolerances,
    or we may have a pin that is slightly bigger than our 3D-printed hole. The slot
    we cut out allows the 3D-printed part to slightly expand along the *X*-axis but
    will also provide a spring back to hold a pin in place:'
  merge: -1
  img_proc: true
- pgno: 204
  md: '![](img/baa027bed101c08b496f1f420cee8a5b_204_0.png)


    Figure 6.27 – Adding a slot for a tight fit and removing material from the hole


    Next, we will demonstrate the fourth and final part modification. Unlike the first
    three manufacturing models, in **Manufacturing Model 4**, we will focus on the
    four small holes that are along the Z-axis. These holes can be printed without
    the need for support structures as their orientation is already aligned with the
    layer lines of our 3D printer.


    Imagine a scenario where we want to add a slot feature to these holes so that
    they can hold a tight tolerance pin in place, similar to what we demonstrated
    with **Manufacturing Model 3**, but we do not wish to create a large cutout from
    our part to minimize the impact on its stiffness and aesthetics. In such cases,
    we can utilize additional sketching features within Fusion 360 to create unique
    customized slots for 3D printing. *Figure 6.28* shows our model from the top view,
    while we’re editing **Manufacturing Model 4** with a sketch created on the XY
    plane. Using the projection of the hole, we can identify its center point and
    create a rectangular cutout zone, as well as a 90-degree **Center Point Arc Slot**:'
  merge: -1
  img_proc: true
- pgno: 205
  md: '![](img/baa027bed101c08b496f1f420cee8a5b_205_0.png)


    Figure 6.28 – Editing Manufacturing Model 4 to add an arc slot and a channel


    Once we have the cut-out profile designed on one hole, we can utilize the Mirror
    command within the sketching environment and mirror our sketch lines along the
    X and Y axes, as shown in Figure 6.29. Using the EXTRUDE command located in the
    SOLID tab''s CREATE panel, we can select the profiles we have sketched and remove
    them from the solid body:


    ![](img/baa027bed101c08b496f1f420cee8a5b_205_1.png)


    Figure 6.29 – Removing material from all of the small holes'
  merge: -1
  img_proc: true
- pgno: 206
  md: 'As a final touch, we can select the two faces that are between our hole and
    the slot and create a fillet using the FILLET feature located in the SOLID tab''s
    MODIFY panel. While creating the fillet, we can either enter a fillet radius or
    utilize the Full Round Fillet type. We can repeat the same process for all four
    holes and create fillets for eight faces, as shown in Figure 6.30:


    ![](img/baa027bed101c08b496f1f420cee8a5b_206_0.png)


    Figure 6.30 – Adding full round fillets to improve print bed adhesion


    Depending on which combination of feature modifications we choose to utilize,
    we will end up with a manufacturing model that has the part edits we need for
    our manufacturing process. These edits do not impact the original design but are
    stored in their respective manufacturing models.


    # Summary


    In this chapter, we talked about modifying parts for manufacturing purposes. We
    started this chapter by discussing how to use the Insert Derive workflow within
    Fusion 360 to manage our model changes for 3D printing. We utilized this workflow
    to aggregate components from multiple Fusion 360 designs and make changes that
    impact the downstream manufacturing processes but do not impact the upstream design
    document. We talked about the benefits of this workflow as it allowed us to bring
    in designs, along with their parameters, from multiple sources into a single manufacturing
    document. We also highlighted how utilizing this workflow blocks us from deleting
    source components, so long as those components are referenced in our manufacturing
    document.


    Next, we introduced the concept of the MANUFACTURE workspace and how to create
    manufacturing models. We demonstrated how we can modify our parts within the manufacturing
    model of the same document. We highlighted that the main benefit of this workflow
    is its ability to store all relevant data'
  merge: -1
  img_proc: true
- pgno: 207
  md: 'in the same document that contains the Fusion 360 design. We also underlined
    the main drawback related to this workflow, which was the fact that we cannot
    easily aggregate components from other Fusion 360 designs.


    We ended this chapter by focusing on making part modifications while editing multiple
    manufacturing models for the same component. We demonstrated four modifications
    we can make to a part to print common features, such as holes without the need
    for support structures while keeping tight tolerances between the hole and the
    pin that it will house.


    Now that we are at the end of this chapter, you have all the knowledge you need
    to create manufacturing models, either within the same Fusion 360 design document
    or a new document to modify your parts for 3D printing. Using these techniques,
    you can edit your models for your design and assembly needs, as well as your manufacturing
    needs, and keep your changes for design and manufacturing separate but connected.
    In the next chapter, we will learn how to create our first additive setup.'
  merge: -1
  img_proc: true
