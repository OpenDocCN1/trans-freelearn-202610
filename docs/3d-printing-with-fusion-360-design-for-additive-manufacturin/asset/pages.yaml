    # Creating internal lattice structures


    In previous sections, we covered various ways we can hollow solid or mesh bodies.
    We demonstrated how to add drain holes so that any trapped powder or resin can
    be removed after the part has been 3D printed. Our main goal in hollowing parts
    was to lightweight them so that we don''t waste material and energy while printing
    our parts.


    Whenever we create hollow objects, we should also pay attention to whether those
    parts are self-supporting to be 3D printed, based on the 3D printing technology
    we have chosen. You will remember from previous chapters that if we are 3D printing
    using SLS, we don''t need support structures. However, if you are 3D printing
    using a resin-based printer, such as SLA or DLP, portions of your model with overhang
    angles above a critical angle will require support structures. We often think
    about support structure as material printed on the outside of a part so that it
    will support our part during printing. A similar concept also applies to parts
    that we hollow. If we hollow a part, we are essentially creating internal surfaces,
    which may also require support structures, so that our parts can be printed successfully
    with a resin printer. In this section, we will talk about how to create those
    internal support structures.'
  merge: -1
  img_proc: true
- pgno: 145
  md: 'One method to create an internal support structure after hollowing a part is
    to create a lattice. Fusion 360 offers several different workflows for creating
    internal lattices. In this section, we will specifically talk about how to create
    volumetric, mesh-based, and solid lattices. In *Chapter 10*, we will cover how
    to create support structures within the context of the Manufacture workspace in
    more detail. In the same chapter, we will apply those support structures to the
    exterior surfaces of the parts, as well as interior surfaces as needed. After
    all, applying a support structure to the interior surfaces of a part serves the
    same purpose as adding an internal lattice.


    Let’s start our exploration of lattice generation using volumetric lattices. Fusion
    360 allows users to create a volumetric lattice after accessing the Product Design
    extension. We have covered how to use the Product Design extension in *Chapter
    2* and *Chapter 3* in the context of converting organic mesh bodies into solid
    objects. In this chapter, we will utilize another key functionality of the Product
    Design extension, **Volumetric Lattice**. **Volumetric Lattice** is available
    within the **MODIFY** panel of the **SOLID**, **MESH**, and **PLASTIC** tabs,
    as shown in Figure 4.19.


    ![](img/baa027bed101c08b496f1f420cee8a5b_145_0.png)


    Figure 4.19 – A uniform gyroid lattice applied to a solid body


    The **Volumetric Lattice** command changes a solid or a mesh body to create a
    volumetric representation of the model. Using this command, you can quickly add
    an internal lattice structure within the boundary of the body. Figure 4.19 shows
    the application of a gyroid lattice with a cell size of 2 millimeters applied
    to a box with an edge length of 10 millimeters. In some cases, we may want to
    control the size of a given cell to stretch out the lattice in a certain direction.
    The **Volumetric Lattice** command has the option to change the proportions of
    the cell size from uniform to non-uniform. Figure 4.20 shows a non-uniform cell
    size where the X and Y directions of the lattice cell are 3 millimeters, but the
    lattice cell is stretched on the Z direction and is set to 5 millimeters:'
  merge: -1
  img_proc: true
- pgno: 146
  md: '![](img/baa027bed101c08b496f1f420cee8a5b_146_0.png)


    Figure 4.20 – Lattice cell is stretched in the Z direction with a non-uniform
    cell size


    Depending on the cell shape we choose and our part''s orientation, we may need
    to consider orienting and/or translating the lattice cell so it can be printed
    without needing support itself. For such cases, the **VOLUMETRIC LATTICE** dialog
    allows us to transform the lattice by positioning and orienting the reference
    cell, as shown in Figure 4.21:


    ![](img/baa027bed101c08b496f1f420cee8a5b_146_1.png)


    Figure 4.21 – Rotating a gyroid cell shape 15 degrees along the Y axis'
  merge: -1
  img_proc: true
- pgno: 147
  md: 'The **VOLUMETRIC LATTICE** dialog is made up of three tabs. The **Setup** tab
    allows us to select a body and apply a cell shape to turn our solid or mesh body
    into a volumetric model. After selecting a body, it automatically applies a gyroid
    cell shape as that is the default lattice type. However, we can choose a different
    cell shape by simply expanding the dropdown and toggling to a different cell shape,
    such as the **Cross** shape shown in Figure 4.22.


    ![](img/baa027bed101c08b496f1f420cee8a5b_147_0.png)


    Figure 4.22 – Changing the cell shape within the VOLUMETRIC LATTICE dialog


    The **VOLUMETRIC LATTICE** dialog within Fusion 360 has six default cell shapes.
    The outcome of all of these shapes applied to 10 by 10 by 10 boxes with a cell
    size of 10 and a solidity of 0.4 can be seen in Figure 4.23:


    ![](img/baa027bed101c08b496f1f420cee8a5b_147_1.png)


    Figure 4.23 – The resulting shape of each cell shape within volumetric lattice'
  merge: -1
  img_proc: true
- pgno: 148
  md: 'As the gyroid shape is a common shape in 3D printing, we will continue using
    it for the rest of this section. When we switch to the Solidity tab, the VOLUMETRIC
    LATTICE dialog offers us the option to modify the solidity of the lattice being
    applied to our reference body. The solidity input ranges from 0 to 1. A solidity
    of 0 means we will not have any material, and a solidity of 1 refers to a fully
    dense material distribution:


    ![](img/baa027bed101c08b496f1f420cee8a5b_148_0.png)


    Figure 4.24 – Modifying the solidity uniformly for a volumetric lattice


    We also can control how the solidity changes along a path. After changing the
    distribution type to Gradient Along Path, we can select an edge or a sketch line.
    The VOLUMETRIC LATTICE dialog will automatically detect the start and end points
    of the selected object and give us options to control the solidity between the
    start and end positions, as shown in Figure 4.25.'
  merge: -1
  img_proc: true
- pgno: 149
  md: '![](img/baa027bed101c08b496f1f420cee8a5b_149_0.png)


    Figure 4.25 – Varying the solidity of a lattice along the edge of the bounding
    body


    The final tab of the **VOLUMETRIC LATTICE** dialog is called **Offset**. Within
    this tab, we can select one or more geometry inputs, such as a face or an edge,
    and assign thickness and solidity. *Figure 4.26* shows the outcome after selecting
    the front-looking face of the cube and assigning a thickness of 2 millimeters
    with a solidity of 1. The resulting volumetric model represents a 2-millimeter-thick
    skin on the front-looking face, followed by a gyroid lattice.


    ![](img/baa027bed101c08b496f1f420cee8a5b_149_1.png)


    Figure 4.26 – Assigning an offset face with a thickness'
  merge: -1
  img_proc: true
- pgno: 150
  md: 'Up until this point, we have mostly utilized the volumetric lattice functionality
    to convert solid bodies into a lattice representation. With the Offset tab, we
    introduced the concept of creating a skin. If desired, we can go back to the Solidity
    tab and enter a solidity of 0, which in turn removes all material from the lattice
    portion of our model. If we take this action, all we will be left with is the
    skin we have applied using the Offset tab, as shown in Figure 4.27:


    ![](img/baa027bed101c08b496f1f420cee8a5b_150_0.png)


    Figure 4.27 – Outcome of a 0-solidity lattice with a single offset face


    We can take this one step further and apply the offset to all six faces of this
    solid cube. As shown in Figure 4.28, such an action will create a hollowed-out
    box with a thickness of 2 millimeters. Whenever we hollow a body, it is difficult
    to visualize as the exterior faces block us from seeing inside the object. Just
    as how we utilized the section analysis in the previous subsection, we can simply
    go to the INSPECT panel and add a section analysis along the XZ plane and offset
    it by a certain distance to take a look at what the inside of this volumetric
