    \ a mobile device after uploading an STL file to Fusion Team\n\nThis method is\
    \ particularly useful if you do not have your computer available when you receive\
    \ a CAD or mesh file. In such instances, you can quickly upload the design to\
    \ your Fusion Team/project/folder so that you and your team members can start\
