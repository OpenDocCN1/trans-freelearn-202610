  md: '![](img/baa027bed101c08b496f1f420cee8a5b_419_0.png)


    Figure 14.14 – Editing a support action to select a missing reference(s)


    After defining the model to support each support action within the template, and
    generating the support structures, Fusion 360 will display the supports. The outcome
    of reusing the two support action templates we created while setting up the Fusion
    document named Centrifugal fan-SLA, in the document named Enclosure-SLA, is shown
    in Figure 14.15.


