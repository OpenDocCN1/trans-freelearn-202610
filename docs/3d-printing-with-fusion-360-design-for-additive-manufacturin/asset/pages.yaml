    ![](img/baa027bed101c08b496f1f420cee8a5b_354_0.png)


    Figure 12.5 – Additive setup with an HP Metal jet S100 printer


    In this workflow, you do not need to worry about scaling your models as the connection
    between Fusion 360 and HP Jet Fusion printers automatically scales your models
    based on your material selection, when you are sending your jobs to the printer.


    The final binder jetting printer within Fusion 360''s **Machine Library** we will
    highlight in this section is `Digital Metal PX100`. Within the **MANUFACTURE**
    workspace of Fusion, you can create a'
  merge: -1
  img_proc: true
- pgno: 355
  md: 'machine build file for this printer to start a print job. *Figure 12.6* shows
    the same model that we used in the previous figure within a new manufacturing
    model.


    **Manufacturing Model 2** has a total of nine copies of the same component. **Setup2**
