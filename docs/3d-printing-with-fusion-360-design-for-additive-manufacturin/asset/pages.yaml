    2. This action will add the Duplicate Components icon to the ribbon within the
    CREATE panel, as indicated by callout 3.


    If you select the Duplicate Components command from either the CREATE panel or
    from the Pattern pullout menu, a new dialog called DUPLICATE COMPONENTS will appear,
    as shown in Figure 14.6. This dialog will allow you to select a component and
    create multiple copies of the same component quickly. You have the ability to
    control the number of copies and the placement of the duplicated components. You
    can choose to keep the copies at the same location or arrange them in the X, Y,
    and Z axes, with a specific gap between the bounding boxes of each component.
    If you check the Copy & Paste New method checkbox, the duplicated components will
    be independent of the original component. This means that you can add unique features
    to each copy, without changing the original component.'
