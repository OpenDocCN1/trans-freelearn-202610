  md: '![](img/baa027bed101c08b496f1f420cee8a5b_93_0.png)


    Figure 2.48 – Using the chamfer feature to add a two-distance chamfer to the perimeter


    Now that we have created a mesh section sketch, utilized that to create sketch
    profiles, extruded those profiles, and added the necessary chamfer, we have fully
    reverse-engineered this part, which started as an inserted mesh and ended as a
    solid body. This workflow required more steps than the previous workflows we highlighted,
    but it can be very handy if the parts we are trying to reverse-engineer cannot
    be recreated using other methods.


    # Summary


    In this chapter, we went over how to edit CAD/Mesh models with various **Design
    for Additive Manufacturing (DFAM)** principles in mind. We highlighted how to
    turn on/off the design history. We demonstrated the differences in the workflow
    when using parametric versus direct modeling. We then learned how to automatically
    detect features for imported CAD models. We also went over how to edit both CAD
    and mesh bodies based on DFAM principles. We ended the chapter by going over several
    methods to convert mesh files into solid bodies that can be further modified for
    manufacturing.


    In the next chapter, we will cover several techniques we can use within Fusion
    360’s Design workspace with Automated modeling and Simulation workspace with Shape
    optimization for lightweighting parts with DFAM principles in mind. We will also
    learn how to utilize simulation to identify potential performance failures and
    make design changes to account for them.'
  merge: -1
