- pgno: 325
  md: '# 11


    # Slicing Models and

    Simulating the Toolpath


    Welcome to *Chapter 11*. In this chapter, we will learn all about how to generate
    and simulate the additive toolpath for **Fused Filament Fabrication (FFF)** 3D
    printing. We will go over how to acquire key information about our additive setup,
    such as print statistics and energy consumption. We will also learn how to generate
    and customize the G-code necessary to start a print job.


    Once all the components we wish to print are properly oriented, arranged, and
    supported, it is time to generate the additive toolpath. After we generate the
    toolpath, we can visualize the outcome at each layer and simulate the movement
    of the nozzle during travel and extrusion moves.


    Generating the additive toolpath is a one-click solution in Fusion 360, but it
    is always a good idea to review the toolpath to understand whether the print settings
    and body presets we have chosen will result in the desired outcome.


    In this chapter, we will cover the following topics:


    +   - Generating an additive toolpath

    +   - Simulating an additive toolpath

    +   - Generating G-code'
  merge: -1
  img_proc: true
- pgno: 326
  md: 'By the end of this chapter, you will have a better understanding of how to
    generate an additive toolpath using Fusion 360. You will learn how to customize
    Fusion 360’s preferences to generate a toolpath manually and automatically. You
    will learn how to access key print statistics, such as how much filament you will
    use to print a given print and how long the print will take. You will also learn
    how to calculate the total cost of a given print job, including both the filament
    cost and the cost of energy. You will learn how to simulate the additive toolpath
    to visualize the impact of your print settings on the print job layer by layer.
    Finally, you will learn how to generate a G-code file. As we get to the end of
    the chapter, you will acquire the necessary skills to incorporate a pause action
    at a specific layer during the print, in order to embed objects in your parts,
    such as magnets, hex nuts, and strengthening rods. You will also understand how
    to customize your G-code to change the filament used mid-print, in order to load
    a different color filament for a portion of your print.


    # Technical requirements


    All topics covered in this chapter are accessible for the Personal, Trial, Commercial,
    Startup, and Educational Fusion 360 license types.


    The lesson files for this chapter can be found here: https://github.com/PacktPublishing/3D-Printing-with-Fusion-360


    In addition to Fusion 360, you will need a text editor such as Notepad to open
    the G-code file.


    # Generating an additive toolpath


    In the previous chapters, we covered how to create an additive setup, orient and
    place our parts within the build volume, and generate support structures. In this
    section, we will build on this knowledge and demonstrate how to generate an additive
    toolpath for such an additive setup.'
  merge: -1
  img_proc: true
- pgno: 327
  md: 'In order to demonstrate how to generate an additive toolpath within Fusion
    360, let us use the `Connector-Assembly` provided within the GitHub page for this
    chapter. This Fusion 360 document consists of three components. As you can see
    in Figure 11.1, the main component is named `Connector`. There are two additional
    components named `Carbon Fiber Rod`. Based on how the parts are assembled, the
    carbon fiber rods are meant to be embedded within the Connector. In order to manufacture
    such an assembly using traditional manufacturing methods, we would have to build
    the Connecter in two halves, so we can embed the carbon fiber rods. Alternatively,
    we would have to drill access holes to place the carbon fiber rods within the
    connector body. However, as we will utilize additive manufacturing, we can simply
    insert the carbon fiber rods during the printing process without having to rely
    on secondary operations.


    ![](img/baa027bed101c08b496f1f420cee8a5b_327_0.png)


    Figure 11.1 – Connector-Assembly with three components'
  merge: -1
  img_proc: true
- pgno: 328
  md: 'Carbon fiber rods can easily be purchased from various sources and can be utilized
    in order to strengthen a given component in a certain direction. Figure 11.2 shows
    that a quick search on www.amazon.com for carbon fiber rods will result in various
    sizes and prices available for purchase. In this example, we will rely on 4 mm
    by 4 mm by 420 mm rods, which come in packs of 8 for around $16.


    ![](img/baa027bed101c08b496f1f420cee8a5b_328_0.png)


    Figure 11.2 – Various sizes of carbon fiber rods are available online for purchase


    The component named `Connector` already includes two cavities where the carbon
    fiber rods can be embedded during the printing process. The design can accommodate
    a 100 mm long rod with a 4 mm x 4 mm cross-section. As this example is simply
    a theoretical one, the cavity does not include additional tolerances. If we were
    printing this component as a part of our final design, it would be better to purchase
    the carbon fiber rods first and measure them, ensuring that their cross-section
    dimension is indeed 4 x 4 mm. Then, we would add one layer’s worth of tolerance
    to their measured cross-sectional dimension in both the Y and Z axes, allowing
    us to easily place our rods within the part during the printing.'
  merge: -1
  img_proc: true
- pgno: 329
  md: 'The next step in the process is to create an additive setup. We covered extensively
    how to create additive setups in the previous chapter. As you can see in Figure
    11.3, the additive setup for this part includes a **Prusa i3MK3S+** for the machine,
    and a customized **PLA (direct drive)** for the print setting. If you look at
    the browser, under the active setup (Setup 1), you will see that the PLA print
    setting has a **Custom** body preset associated with it.


    In the **SETUP** dialog, we will explicitly select our model as **Connector:1**.
    We will not choose carbon fiber rods as a part of our model selection process.
    This will ensure that we will only 3D-print the Connector part.


    ![](img/baa027bed101c08b496f1f420cee8a5b_329_0.png)


    Figure 11.3 – Creating an additive setup for the component named Connector


    At this point, I would like to highlight a key Fusion 360 preference we all should
    be aware of. You may recall that we can access the **Preferences** dialog by clicking
    on the Avatar icon in the top-right corner of the user interface, as shown with
    callout 1 in Figure 11.4. Within the **Preferences** dialog, you can navigate
    to the **Manufacture** section in the browser, as highlighted by callout 2. In
    the **Manufacture** section, you will notice that there is a **Generate Additive
    Toolpath on Setup creation** option, as highlighted by callout 3. By default,
    this option is unchecked, as shown in the figure.


    If you often work with models that do not require support structures, you may
    prefer to activate this checkbox, and Fusion 360 will automatically create the
    additive toolpath for you as soon as you create an additive setup. I often find
    myself working with models that require the generation of support structures.
    Therefore, my preference is to leave this option unchecked. This way, I can first
    add the support structures and then generate the additive toolpath once I am satisfied
    with the support structures for my models.'
  merge: -1
  img_proc: true
- pgno: 330
  md: '![](img/baa027bed101c08b496f1f420cee8a5b_330_0.png)


    Figure 11.4 – The generation of an additive toolpath can be automated within Preferences


    Once an additive setup has been created, we will need to add the necessary support
    structures for this model to down-skin surfaces below a certain overhang angle.
    Figure 11.5 shows the selection of two faces with large overhang angles, which
    will require support structures in order to successfully 3D-print them. As covered
    in Chapter 10 in detail, we will apply solid volume supports to these two faces.


    ![](img/baa027bed101c08b496f1f420cee8a5b_330_1.png)


    Figure 11.5 – Applying solid volume supports to select faces'
  merge: -1
  img_proc: true
- pgno: 331
  md: 'Note that we did not apply support structures to the two cavities where the
    carbon fiber rods will be placed within our part. This is a key benefit of being
    able to select CAD-based surfaces when generating support structures. Using an
    explicit selection set, you not only have full control over which surfaces you
    wish to support; you can also easily avoid creating supports on portions of your
    model where you know you will perform mid-print operations, such as inserting
    magnets, hex nuts, or strengthening rods, which will ensure the part is self-supported.


    Now that our setup is complete, it is time to create the additive toolpath. Fusion
    360 allows you to create an additive toolpath in one of two ways. After selecting
    the additive toolpath within the browser, you can right-click and select Generate
    from the pop-up menu, as shown in Figure 11.6. Alternatively, after selecting
    the additive toolpath from the browser, you can select the Generate command within
    the ACTIONS panel located in the ADDITIVE tab. Both of these commands will start
    to generate the additive toolpath.


    ![](img/baa027bed101c08b496f1f420cee8a5b_331_0.png)


    Figure 11.6 – Generating the additive toolpath


    Once you have generated the additive toolpath for an FFF printer, if you expand
    the Additive Toolpath line item within the browser, you will see a line item called
    Print Time. This entry, which is highlighted with callout 1 in Figure 11.7, displays
    the total print time for your additive setup. You can acquire additional information
    by simply double-clicking Print Time within the browser, or by selecting the Print
    Statistics command under the ACTIONS panel, as indicated by callout 2 in the same
    figure.'
  merge: -1
  img_proc: true
- pgno: 332
  md: 'Both of these actions will display the **PRINT STATISTICS** dialog, which consists
    of two tabs. The first tab, named **Print Statistics**, gives you additional information,
    such as how many meters of filament will be used to successfully finish printing
    this setup. This is an important piece of information, as you may need to make
    sure you have enough material at hand before starting your print. You''ll also
    see information about how many layers the print will consist of, and how much
    time will be consumed by various portions of your model print, such as its shell,
    infill, and support structures.


    ![](img/baa027bed101c08b496f1f420cee8a5b_332_0.png)


    Figure 11.7 – Print statistics for an additive setup


    In the second tab of the **PRINT STATISTICS** dialog, you can calculate the material
    cost and the amount of energy you will consume in order to finish printing this
    part. Note that the **Cost and energy** tab is only available for FFF machines.
    You will not be able to inquire about the material or energy costs for other additive
    manufacturing processes.


    As shown in *Figure 11.8*, the **Cost and energy** tab allows you to select your
    location from the drop-down menu. Based on your location, you can enter the cost
    of energy in your market and the cost of the specific filament you have purchased
    for this print.'
  merge: -1
  img_proc: true
- pgno: 333
  md: '![](img/baa027bed101c08b496f1f420cee8a5b_333_0.png)


    Figure 11.8 – The cost and energy calculation for an additive setup with an FFF
    machine


    In this example, we can set the location to the USA and enter the cost of energy
    as $0.23 per kWh, which is the current average cost of energy in the US at the
    time of writing. We can enter the cost of filament used as $39.99 per kilogram.
    With these inputs, Fusion 360 estimates that the total cost of the print will
    be $3.25, based on how much filament we will use and how much heating will be
    involved in extruding the filament, as well as keeping the bed at a certain temperature.
    Note that this calculation does not include the cost of the carbon fiber rods
    we will insert into this part.


    If you recall, the cost of 8 rods was $16 on www.amazon.com. This means each rod
    is worth $2. Each rod was 420 mm long, and our openings were 100 mm long. This
    means we can use two-quarters of a rod per part. So, we will use $1 worth of rod
    per part, bringing the total cost of this part to $4.25, excluding the labor cost.


    Being able to see such information prior to printing helps us understand the approximate
    cost to manufacture our parts. Based on this information, we can choose to make
    a change to our print settings to reduce either the energy or the filament cost
    for the final part.


    In this section, we highlighted how to generate an additive toolpath automatically
    and manually. We pointed out the preferences you can customize in order to generate
    the additive toolpath as soon as you create an additive setup. We showcased how
    to generate the additive toolpath from the browser and the ribbon UI of Fusion
    360. We also learned how to use Fusion 360 to calculate critical print statistics,
    such as the total print time, material required, and print cost. In the following
    section, we will simulate the additive toolpath to visualize it layer by layer.'
  merge: -1
  img_proc: true
- pgno: 334
  md: '# Simulating an additive toolpath


    In the previous section, we learned how to generate additive toolpaths for an
    FFF process using Fusion 360. In this section, we will focus on how to simulate
    these additive toolpaths. Within the **MANUFACTURE** workspace of Fusion 360,
    we have two paths we can follow in order to simulate the additive toolpath.


    The first one is by selecting the **Additive Toolpath** line item in the browser
    for the active setup and right-clicking on it. As shown in *Figure 11.9* with
    callout **1**, we can access the **Simulate Additive Toolpath** command within
    this right-click menu. The second option we have is to utilize the **Simulate
    Additive Toolpath** command located within the **ACTIONS** panel of the **ADDITIVE**
    tab. Both of these commands will result in the same outcome, which is the simulation
    of the additive toolpath for the active additive setup.


    ![](img/baa027bed101c08b496f1f420cee8a5b_334_0.png)


    Figure 11.9 – How to access the Simulate Additive Toolpath command


    Once we simulate the additive toolpath, we can visualize all the layers our machine
    will 3D-print for this additive setup. There are four ways we can change the layer
    number we visualize. *Figure 11.10* points out each of these methods with a unique
    callout:


    +   - Callout **1** points to a blue arrow within the canvas of Fusion 360. If
    we select this arrow by left-clicking on the mouse, we can drag the arrow up or
    down along the Z axis to visualize the toolpath at a different layer.'
  merge: -1
  img_proc: true
- pgno: 335
  md: '+   - Callout 2 points to the simulation player controls located at the bottom
    of the canvas. There are seven buttons in this control. Using the play button
    in the center of the control (button number four from the left), we can start
    the animation of the toolpath. The leftmost and rightmost buttons (buttons one
    and seven from the left) within the control will automatically jump to the first
    and the final layer. In this example, the final layer is 433. We can also utilize
    buttons two or six in order to toggle from one layer to another at a time. Buttons
    three and four animate the toolpath within the active layer.

    +   - Callout 3 points to the Current Layer input field within the SIMULATE ADDITIVE
    TOOLPATH dialog. Figure 11.10 shows the toolpath for the first layer, as the input
    for the Current layer is set to 1. We can type a specific layer number into this
    field to quickly jump to that layer’s toolpath visualization. Keep in mind that
    you do not need to press Enter or click OK for the change to take effect after
    typing in the desired layer number. Fusion 360 will automatically update and display
    the toolpath for the layer you have entered.

    +   - Callout 4 points to the Simulation player timeline, which is located below
    the Simulation player controls. The black vertical line can be used to control
    the timeline. By selecting it with a left-mouse click, you can drag the timeline
    toward the right in order to visualize the toolpath for any of the calculated
    layers.


    ![](img/baa027bed101c08b496f1f420cee8a5b_335_0.png)


    Figure 11.10 – How to change the layer being displayed within the toolpath simulation'
  merge: -1
  img_proc: true
- pgno: 336
  md: 'The SIMULATE ADDITIVE TOOLPATH dialog has several options that allow you to
    visualize the toolpath specific to your needs. If you change the Mode input from
    Display upto current layer to Display current layer only, you will be able to
    visualize the toolpath specific to the layer number you are interested in. In
    Figure 11.11, we can see the toolpath for our Connector component at layer number
    80. You can also see that the Display Type option is set to Toolpath Type within
    the SIMULATE ADDITIVE TOOLPATH dialog. With this display type, Fusion 360 colors
    each toolpath line according to the type of tool path it is creating. For example,
    any outer perimeter toolpath is colored with a red line, whereas all inner perimeter
    toolpaths are colored in green. Support structures are represented using a light
    blue line, and the infill toolpath is shown as orange lines. Those are the only
    four types of toolpath present in the layer shown in this figure.


    You may have also noticed that the Show Machine checkbox is unchecked in Figure
    11.11, and we are looking at our model from the top view. Turning off the machine
    visualization hides the build volume as well as the build plate for the 3D printer
    we are utilizing in the active setup. By hiding the visualization for the build
    plate, we can easily focus on our parts and supports while simulating the additive
    toolpath.


    ![](img/baa027bed101c08b496f1f420cee8a5b_336_0.png)


    Figure 11.11 – Visualizing the toolpath for a specific layer


    Another option we have in the SIMULATE ADDITIVE TOOLPATH dialog is to display
    the print speed for our toolpath. We can do that by changing the display type
    from Toolpath type to Print speed, as shown in Figure 11.12. When visualizing
    our toolpath using the print speed display type, Fusion 360 colors each toolpath
    based on the extrusion speed utilized while 3D-printing each toolpath. The image
    on the left shows that our part and support structures are printed using a relatively
    slow speed for layer 1. The image on the right shows the same parts at layer 81.
    Here, we can see that our infill, perimeter, support, and bridge toolpath types
    are printed at different speeds, and they are generally much faster on this layer
    compared to layer 1.'
  merge: -1
  img_proc: true
- pgno: 337
  md: '![](img/baa027bed101c08b496f1f420cee8a5b_337_0.png)


    Figure 11.12 – Displaying an additive toolpath using a print speed display type


    By simulating an additive toolpath and visualizing what our 3D printer will do
    at each layer while extruding a filament, we can be sure of how many perimeter
    toolpaths our part will have at various layers and how our parts will be supported
    during the printing process. We can also visualize the change in print speed from
    one layer to another.


    Using these techniques, we can either choose to proceed with the print or change
    certain print settings in order to achieve our desired toolpath for perimeters,
    infills and supports. In the next section, we will learn about how to generate
    G-code in order to start a print.


    # Generating G-code


    After creating our additive toolpath and simulating it, if we are satisfied with
    the outcome, we can move on to the final step in the process, which is the generation
    of the G-code. In order to generate G-code using Fusion 360 for an additive setup,
    we can simply click the Post Process button at the bottom of the SIMULATE ADDITIVE
    TOOLPATH dialog, as shown in Figure 11.13. This action will automatically bring
    up the NC Program dialog, where we can post-process our toolpaths and create the
    necessary G-code.


    Within the NC Program dialog, there are two tabs. The first tab, called Settings,
    is the only relevant tab for additive manufacturing. So, we can simply ignore
    the Operations tab. The Settings tab of the NC Program dialog has two columns.
    The column on the left allows us to choose which post-processor we wish to use
    in order to convert the toolpath we see on our screen to a G-code file. The column
    on the right, named Post Properties, allows us to customize the output so that
    the G-code we produce behaves specific to our instructions.


    Within the Program subsection of the NC Program dialog, we can name our G-code
    file and add additional comments. We can also designate the output folder for
    the G-code file. If we select the Post to Fusion Team checkbox, as shown in Figure
    11.13, our G-code file will not only be saved in our local folder but we''ll also
    create a copy of it within the FUSION TEAM folder of our choosing.'
  merge: -1
  img_proc: true
- pgno: 338
  md: '![](img/baa027bed101c08b496f1f420cee8a5b_338_0.png)


    Figure 11.13 – Post-processing an FFF additive toolpath


    Another way we can initiate the NC Program dialog is by selecting the Post Process
    command within the ACTIONS panel of the ADDITIVE tab, as shown in Figure 11.14.
    Please remember that you have to select the additive toolpath for the active setup
    prior to selecting the Post Process command in order to initiate the NC Program
    dialog.


    In this example, we worked with a Prusa i3MK3S+ machine. The post file utilized
    for Prusa printers has additional properties, as shown in Figure 11.14. The property
    we are interested in exploring in this example is in the Pause Print section,
    as illustrated with callout 2. By expanding the list of the Pause Print section,
    we can enter a layer number at which we wish to pause the printing process. We
    can also include a message to display on the printer''s display screen during
    the pause.


    As you may recall from the previous section, by simulating our additive toolpath,
    we identified that at layer 80, the extruder will attempt to bridge over the cavity
    where we wish to add our carbon fiber rods. Therefore, it is a good idea to pause
    the print at layer 79 so that we can insert our carbon fiber rods before the printer
    attempts to encapsulate the cavity.'
  merge: -1
  img_proc: true
- pgno: 339
  md: '![](img/baa027bed101c08b496f1f420cee8a5b_339_0.png)


    Figure 11.14 – Adding a Pause Print function to the G-code at a specific layer


    Fusion 360 offers unique post properties based on the Post file selected, which
    is associated with the machine you have selected for your setup. Figure 11.15
    shows the differences between three common 3D printers and their post properties.


    The image on the left shows the post properties for the Prusa family of printers.
    As you can see in the figure, using a Prusa post, you can customize your G-code
    so that you can find the optimum temperature to print your specific filament.
    This is possible by enabling the Trigger field within the Temperature Tower section.
    This action will enable you to print a test object while controlling the rise
    in temperature, from an initial temperature value to a final one with a set of
    intervals. After the print, you can observe the finished product and decide at
    which temperature you get the best outcome, using that knowledge in subsequent
    prints as a new print setting. As we highlighted previously, in Figure 11.14,
    you can also execute a Pause Print function. In addition to these two sections,
    you can also execute a Filament Change operation by entering the layer number
    at which the filament should be swapped for a different one.


    The middle image within Figure 11.15 is from an Ultimaker post file for an Ultimaker
    S5 printer. In the General section of Post properties for this post file, you
    also have the ability to indicate which material and print core is loaded onto
    the machine for Extruder 1 and Extruder 2. Without this information, you would
    not be able to print successfully on this printer.'
  merge: -1
  img_proc: true
- pgno: 340
  md: 'The image on the right within Figure 11.15 is from a Creality post file for
    a Creality CP-01 printer. Just like the Prusa and Ultimaker families of printers,
    Creality printers have the Temperature Tower options under Post properties. In
    addition, you can control whether to enable or disable bed leveling. You also
    have additional functionality to control at which Z height to turn off the bed
    leveling compensation.


    ![](img/baa027bed101c08b496f1f420cee8a5b_340_0.png)


    Figure 11.15 – Post properties based on manufacturer


    Another very useful functionality within the NC Program dialog is the ability
    to edit an expression for a given field. Figure 11.16 shows how you can customize
    any input field, such as File name, beyond simply entering the input manually.
    If you select the : icon to the right of the input field, as shown with callout
    1, you can select Edit expression from the drop-down menu, as shown with callout
    2. When the Expression dialog is displayed, you can enter parameters such as date
    or documentName so that the file name used for the G-code is automatically set
    to the parameter you have designated. In the Expression dialog, you can also use
    some basic formulas.


    Figure 11.16 demonstrates how to concatenate multiple parameters by using the
    + sign. You can also add custom strings between the date and documentName parameters
    by using _ between the two. After selecting OK, the File name field will be automatically
    populated with the date and the name of the Fusion 360 document. The Expression
    dialog also has the ability to auto-fill parameter names. If you are not familiar
    with the all available parameters, you can simply start typing an input, such
    as name, and you will see various parameters containing the string name so that
    you can choose a parameter, such as the Fusion Team name or document name, from
    a list of available options. Once your expression has been set, you can store
    it by selecting Save as the user default so that the next time you create an NC
    program to export G-code, you don''t have to type in the name of the file, and
    your filename will be automatically set as a combination of the date and the Fusion
    360 document name.'
  merge: -1
  img_proc: true
- pgno: 341
  md: '![](img/baa027bed101c08b496f1f420cee8a5b_341_0.png)


    Figure 11.16 – How to utilize expressions for input fields in NC Program


    Once you are done customizing your post properties, all you have to do is select
    the Post button in the bottom-right corner of the NC Program dialog. Fusion 360
    will then export a G-code file in the location you have designated with the filename
    you have entered. Figure 11.17 shows the output of this action, which is a human-readable
    text file with a . gcode extension. If you open this file using your native text
    editor app, such as Notepad, and scroll down, you will be able to spot the beginning
    of layer 79. As you can see in Figure 11.17, a pause print action is introduced
    with the code M601, as well as a display message with M117, with text that reads
    Insert Bars. If you print this G-code on this 3D printer, the print will proceed
    until it reaches layer 79, and it will pause until you press the knob. Then, you
    insert your carbon fiber bars.'
  merge: -1
  img_proc: true
- pgno: 342
  md: '![](img/baa027bed101c08b496f1f420cee8a5b_342_0.png)


    Figure 11.17 – Visualizing the G-code posted using the NC Program dialog


    In this section, we highlighted how to use Fusion 360 to generate a G-code file.
    We showcased how you can access the post-process functionality from the SIMULATE
    ADDITIVE TOOLPATH dialog, as well as the ACTIONS panel within the ADDITIVE tab
    of the MANUFACTURE workspace. We covered the various options available in the
    NC Program dialog to convert our additive toolpath to a G-code file so that we
    can print it. We also highlighted the various post properties available within
    the NC Program dialog based on our selected 3D printer.


    # Summary


    In this chapter, we learned all about how to slice our models for an FFF 3D printer.
    Slicing is an important step in print preparation for additive manufacturing and
    comes after creating a setup, orienting parts, arranging them on the build platform,
    and generating support structures. Once our parts are sliced, we can also simulate
    the additive toolpath.


    In this chapter, we learned how to generate and visualize additive toolpaths layer
    by layer. We went over the various print statistics, such as energy consumption,
    print time, material usage Fusion 360 displays for FFF printers. With all this
    information at our fingertips, we have the power to post-process the additive
    toolpath as is and create a G-code file. We also highlighted how we can change
    our print settings based on the simulation results and print statistics, enabling
    us to print our parts with less material and use less energy.'
  merge: -1
  img_proc: true
- pgno: 343
  md: 'In the final section of this chapter, we learned how to post-process the additive
    toolpath and create G-code. At the time of G-code creation, we also learned how
    to customize it. Using these customizations, we learned how to create temperature
    towers so that we could determine what temperature to print using certain filaments.
    We also learned how to pause a print in order to insert additional objects, such
    as hex nuts, magnets, and strengthening rods. We also learned how to change the
    filament mid-print so that we could print different segments of our parts using
    different filament colors. Finally, we learned how to automate certain inputs
    within the **NC Program** dialog, such as the filename, using parameters that
    are already available within a Fusion document. Using all these techniques, we
    can confidently go from an additive setup to generating G-code for an FFF printer.


    A lot of the fundamentals of positioning and supporting components for metal 3D
    printers are similar to what we learned for FFF 3D printing. However, there are
    some process-specific settings we will need to go over for metal printers. In
    the following chapter, we will switch gears and cover more about 3D printing with
    metals.'
  merge: -1
  img_proc: true
- pgno: 344
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 345
  md: '# Part 4:

    Metal Printing, Process Simulation, and Automation


    This final part of the book is all about metal 3D printing and automation. First,
    we will introduce the various ways you can use Autodesk Fusion to create an additive
    setup for a metal 3D print. We will explain how you can utilize fused filament
    fabrication, binder jetting, directed energy deposition, and metal powder bed
    fusion technologies to create metal parts. Then, we will demonstrate how to simulate
    the metal powder bed fusion process in order to detect potential print failures.
    We will also demonstrate how to compensate for large distortions in our models
    and ultimately minimize possible print failures.


    We will end the book by highlighting various automation techniques that we can
    utilize to reduce the time spent on repetitive tasks. We will introduce premade
    automation tools available for download and use on the Autodesk App Store. We
    will introduce the concept of operation templates as well as scripts created with
    Python or C++, using Autodesk Fusion’s API, and how to customize them to fit our
    needs.


    This part has the following chapters:


    +   - Chapter 12, 3D Printing with Metal Printers

    +   - Chapter 13, Simulating the MPBF Process

    +   - Chapter 14, Automating Repetitive Tasks'
  merge: -1
  img_proc: true
