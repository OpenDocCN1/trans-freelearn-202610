- pgno: 405
  md: '# Automating Repetitive Tasks


    Welcome to Chapter 14. In previous chapters, we demonstrated how to use Fusion
    360 to design new models and import models from external sources. We also highlighted
    how to generate a setup to additively manufacture those models with various 3D-printing
    technologies. Now that we have a good understanding of how to use Fusion 360 and
    have experience in creating setups, arranging our parts, and creating support
    structures for various additive technologies, let''s learn more about how to automate
    and optimize Fusion 360, so that we don''t have to edit every input dialog for
    every single additive setup.


    In this chapter, we will highlight how to automate various aspects of Fusion in
    order to minimize our interaction with the software, creating an additive setup
    and generating a toolpath. We will start the chapter by highlighting existing
    automations within Fusion''s ecosystem by introducing you to the Autodesk App
    Store. Then, we will highlight how to customize Fusion''s machine and print setting
    libraries, in order to create a fully defined machine that you can utilize when
    creating your setups. You will then learn how to customize your inputs for various
    operations, such as automatic orientation studies, part arrangement, and support
    structure generation. We will also demonstrate how to save those inputs as user
    defaults. Then, we will create and save templates, which combine multiple operations
    into a single file that can be reused on subsequent additive setups. We will end
    the chapter by highlighting how to utilize Fusion''s programming capabilities,
    by creating a Python script to automate the entire process of generating an additive
    setup, orienting parts, arranging them within the build plate, and simulating
    the additive toolpath.


    In this chapter, we will cover the following topics:


    +   - Using apps from the Autodesk App Store

    +   - Customizing presets and using templates

    +   - Automating the additive workflows with scripting


    By the end of the first section, you will have learned how to search the Fusion
    App Store using various filters for operating systems, app categories, and app
    costs. You will also learn how to download, install, and run apps to perform certain
    automation actions. In the next section, you will also gain a good understanding
    of how to customize Fusion''s machine library and create your own machines, with'
  merge: -1
  img_proc: true
- pgno: 406
  md: 'associated print settings and post files. Using this technique, you will be
    able to create your future additive setups much more efficiently. In this section,
    you will also learn how to save your frequently used inputs as user defaults for
    various operations, such as part orientation, part arrangement, and support structure
    generation. You will also learn how to create templates that can contain multiple
    actions with your custom inputs, and how to reuse those templates in subsequent
    additive setups. By the end of the chapter, you will know how to create and customize
    your first Python-based script to automate the entire additive workflow for an
    FFF machine, with one or multiple components.


    # Technical requirements


    All topics covered in this chapter are accessible to Personal, Trial, Commercial,
    Startup, and Educational Fusion 360 license types. If you intend to create or
    customize scripts with the Python programming language to be able to automate
    your additive setups in Fusion 360, you will also need to install the Visual Studio
    Code software from Microsoft: https://code.visualstudio.com/.


    How to download and install this software will be highlighted within the relevant
    section of this chapter.


    The lesson files for this chapter can be found here: https://github.com/PacktPublishing/3D-Printing-with-Fusion-360


    # Using apps from the Autodesk App Store


    Fusion 360 has a lot of built-in functionality around design and manufacturing
    using 3D printing. However, there are certain instances where you may benefit
    from additional functionality to automate your workflow. In such cases, you may
    want to take a look at the Autodesk App Store to see whether there are any applications
    readily available for you to utilize, in order to complete a certain task without
    having to manually execute multiple steps.


    You can access the Autodesk App Store in a web browser by navigating to https://Apps.autodesk.com/FUSION/en/Home/Index.
    You can also access the Autodesk App Store command located within the ADD-INS
    panel of the UTILITIES tab in most workspaces, including the DESIGN workspace,
    as shown by callout 1 in Figure 14.1.


    Once the Autodesk App Store is visible in your web browser, you will notice that
    the product is set to Fusion 360 in the top-left corner of the web page. Using
    this App Store, you can look through the featured apps or search for a specific
    app by typing the name of the app in the search bar. You can also filter apps
    related to 3D Printing by selecting the appropriate filter on the left-hand side,
    as shown with callout 2.'
  merge: -1
  img_proc: true
- pgno: 407
  md: '![](img/baa027bed101c08b496f1f420cee8a5b_407_0.png)


    Figure 14.1 – Accessing the Autodesk App Store and filtering apps for 3D printing


    After selecting 3D Printing as a filter, the App Store displays a more advanced
    search and filter toolset, so you can look for the most relevant, the newest,
    or the most downloaded apps using the appropriate option from the title bar, as
    shown by callout 1 in Figure 14.2. The Autodesk App Store includes numerous applications
    that are free to download and use. However, there are certain apps that require
    a one-time fee or a subscription. Using the filters, you can also rank apps based
