- pgno: 95
  md: '# Creating Lightweight Parts, and Identifying and Fixing Potential Failures
    with Simulation


    Welcome to Chapter 3. One of the main benefits of additive manufacturing is the
    ability to create lightweight parts. In this chapter, we will cover various tools
    we have within Fusion 360 for lightweighting parts and creating organic-looking
    models that we can 3D print. We will start by highlighting how to utilize the
    automated modeling capabilities within the design workspace to generate design
    alternatives. We will discuss the differences between automated modeling and generative
    design. Next, we will utilize shape optimization within the simulation workspace
    to create lightweight and structurally efficient components. We will conclude
    the chapter by showcasing how to simulate the components we create to check, detect,
    and fix failures common in 3D-printed components.


    In this chapter, we will cover the following topics:


    +   - Getting started with Automated modeling

    +   - Shape optimization

    +   - Structural simulation to detect and fix common failures


    By the end of this chapter, you will have learned how to use automated modeling
    to create organic shapes. You will be able to use shape optimization to create
    structurally efficient components. You will also know how to use linear static
    stress to detect stress concentrations to eliminate them by making informed design
    changes.'
  merge: -1
  img_proc: true
- pgno: 96
  md: '# Technical requirements


    All the topics covered in this chapter are accessible to Startup and Educational
    Fusion 360 license types. If you have a Commercial Fusion 360 license, in order
    to conduct a shape optimization study, you will also need access to the Simulation
    extension (https://www.autodesk.com/products/Fusion-360/simulation-extension),
    or you can use Autodesk Flex tokens to solve shape optimization studies (https://www.autodesk.com/benefits/flex).


    Even though we will not be conducting a generative design study in this chapter,
    if you have a Commercial Fusion 360 license and would like to conduct a generative
    design study, you will need access to the Generative Design extension (https://www.autodesk.com/products/Fusion-360/generative-design-extension),
    or you can use Autodesk Flex tokens to solve generative design studies (https://www.autodesk.com/buying/flex?term=1-YEAR&tab=flex).


    Autodesk offers a 14-day trial for both the Simulation extension and the Generative
    Design extension for all Commercial users. You can activate your trial within
    the Extensions dialog of Fusion 360.


    Neither Automated Modeling, Generative Design, nor any of the simulations mentioned
    previously (Shape Optimization and Linear Static Stress) are available for Personal/hobby
    licenses of Fusion 360.


    The lesson files for this chapter can be found here: https://github.com/PacktPublishing/3D-Printing-with-Fusion-360.


    # Getting Started with Automated modeling


    In previous chapters, we covered how to use parametric modeling and direct modeling
    in order to make changes to existing designs. Using solid and mesh modeling techniques,
    we created holes, pockets, and hollowed-out parts, which are all useful methods
    for lightweighting parts.


    The Automated Modeling functionality within the Design workspace of Fusion 360
    is a great tool for designers to create organic-looking lightweight components.
    In this section, we will focus on creating new models using this generative technique.
    After choosing a design alternative, we will modify the volume of the outcome.
    Later, we will manually edit the organic shape to further lightweight the design.


    Automated modeling is available within the DESIGN workspace''s SOLID tab''s AUTOMATE
    panel. Using automated modeling, users can generate design alternatives between
    geometries that they want to connect. This function requires a minimum of two
    faces to be selected as input faces. It also allows users to select zones where
    a model should not be created. When using this command, Fusion 360 will generate
    six design alternatives. It will then allow you to explore the design that best
    suits your needs. Three of the design alternatives are created using smooth connections
    between the selected faces. The remaining three are created using sharp connections.
    Now, let us explore this functionality with an example dataset and walk through
    the iterative process a designer may follow while working on a project.'
  merge: -1
  img_proc: true
- pgno: 97
  md: 'Figure 3.1 shows a microphone assembly and a stand. This model is made up of
    several bodies with individual names, and we will refer to them by those names
    throughout this section.


    Let’s imagine we are a designer who is tasked with coming up with a new version
    of the **Connection-left** and **Connection-right** bodies for this microphone
    stand. Those bodies were originally created using the **LOFT** command within
    Fusion 360, and they are shown in green in Figure 3.1. These connection arms connect
    the base to **Mount-right** and **Mount left**, which are represented in yellow
    in the same figure:


    ![](img/baa027bed101c08b496f1f420cee8a5b_97_0.png)


    Figure 3.1 – Microphone stand design with unique bodies for connection arms


    Using existing bodies that are present in this Fusion 360 design, we can start
    this exploration by turning off the visibility of the bodies named **Connection-left**
    and **Connection-right**. Then, we can access the **Automated Modeling** command
    within the **AUTOMATE** panel.


    Next, we can select the four faces we wish to connect to create a new geometry
    and select **Generate Shapes**, as shown in Figure 3.2. Note that this figure
    was captured by turning the opacity of all visible bodies down to 50% to better
    display the four selected faces.'
  merge: -1
  img_proc: true
- pgno: 98
  md: '![](img/baa027bed101c08b496f1f420cee8a5b_98_0.png)


    Figure 3.2 – Selecting the faces to connect within Automated Modeling


    Once all the design alternatives are generated, they will have a green checkmark
    next to them and we can explore the outcomes. As shown in Figure 3.3, the AUTOMATED
    MODELING dialog displays six design alternatives. As we select each alternative,
    a preview of that geometry will be displayed on the canvas.


    ![](img/baa027bed101c08b496f1f420cee8a5b_98_1.png)


    Figure 3.3 – Automated modeling generates six design alternatives'
  merge: -1
  img_proc: true
- pgno: 99
  md: 'If you look closely, you will notice that the first three alternatives have
    an icon with a purple form body and a transparent object underneath it. The following
    three design alternatives have a purple form body, a blue solid body, and a transparent
    object underneath it. A close-up of the icons for the first three alternatives
    versus the next three can be seen in Figure 3.4. This subtle difference in the
    iconography refers to the connection type of the generated design alternative.
    Alternatives without the gray solid body create smooth connections. Alternatives
    with the gray solid body create sharp connections.


    ![](img/baa027bed101c08b496f1f420cee8a5b_99_0.png)


    Figure 3.4 – Different icons represent a change in the connection types for design
    alternatives


    Each design alternative also offers a volume slider. Using this volume slider,
    we can generate a preview of the outcome with varying volumes. Figure 3.5 shows
    the difference between choosing a minimum volume (left) versus a maximum volume
    (right) for the Alternative 2 design.


    ![](img/baa027bed101c08b496f1f420cee8a5b_99_1.png)


    Figure 3.5 – Differences in volume after modifying the volume slider'
  merge: -1
  img_proc: true
- pgno: 100
  md: 'Investigating all the design alternatives, let''s say that we liked **Alternative
    6** the best. After adjusting its volume slider toward the minimum, we can press
    **OK** and generate the outcome as a new body. This new body will be added to
    the tree. *Figure 3.6* shows that a new body named **Body30** has been added to
    the list of bodies and a new group called **AutomatedModeling3** has been added
    to the timeline:


    ![](img/baa027bed101c08b496f1f420cee8a5b_100_0.png)


    Figure 3.6 – Selecting Alternative 6 and generating a body


    At first glance, the outcome looks promising. However, after a quick inspection,
    we can see that we have made a mistake and that the outcome is penetrating into
    where the power and headphone wires would be connected to the microphone. To get
    a precise answer, we can utilize the interference detection tool located in the
    **INSPECT** panel, as shown in *Figure 3.7*. After selecting the bodies named
    **Microphone** and **Body30** and computing the interference between them, we
    can see that there is more than 1,000 mm^3 of interference between these two bodies:'
  merge: -1
  img_proc: true
- pgno: 101
  md: '![](img/baa027bed101c08b496f1f420cee8a5b_101_0.png)


    Figure 3.7 – The interference between the microphone and the organic connection
    arm


    To address this interference and to create shapes that do not interfere with the
    microphone, let''s go ahead and suppress the AutomatedModeling3 feature from the
    timeline and create a new automated modeling feature. This time, in addition to
    selecting the four faces to connect, we will also select two bodies to avoid:
    Rotation Axis and Microphone, and select the Opacity checkbox so the bodies to
    avoid are transparent. The new setup for this automated modeling can be seen in
    Figure 3.8.


    ![](img/baa027bed101c08b496f1f420cee8a5b_101_1.png)


    Figure 3.8 – A new automated modeling setup with a couple of bodies to avoid'
  merge: -1
  img_proc: true
- pgno: 102
  md: 'After generating the new shapes, we now see six new design alternatives to
    choose from. And according to Fusion 360, they all avoid interfering with the
    microphone and the modeled cables. After inspecting the outcomes, let’s choose
    **Alternative 4** and adjust its volume slider to the minimum and select **OK**
    to generate the new body, as shown in *Figure 3.9*:


    ![](img/baa027bed101c08b496f1f420cee8a5b_102_0.png)


    Figure 3.9 – Six new design alternatives that avoid interfering with the microphone


    As we can see in *Figure 3.10*, we now have a new body named **Body46** in the
    **BROWSER** panel and we can see that a new automated modeling feature has been
    added to the timeline. Upon closer inspection, we can see that the new body is
    not interfering with the cables. However, this was done by removing the microphone
    and the cables from the newly generated shape. This new body theoretically meets
    our objectives; however, in practice, we need a much larger clearance between
    our cables and the connection arms so we can plug and unplug these wires:'
  merge: -1
  img_proc: true
- pgno: 103
  md: '![](img/baa027bed101c08b496f1f420cee8a5b_103_0.png)


    Figure 3.10 – Outcome of the second iteration of automated modeling


    To achieve this new objective of a larger clearance between our microphone and
    the new connection arms, we need to create a new geometry. Fusion 360 can be utilized
    to create a new sketch along the XZ axis, and we can project the profile of the
    microphone and, if needed, offset it to create an additional tolerance zone. Later,
    we can use the profile we created and use the REVOLVE command to create a 130-degree
    revolution, as seen in Figure 3.11:


    ![](img/baa027bed101c08b496f1f420cee8a5b_103_1.png)


    Figure 3.11 – Creating a new body using the REVOLVE command based on the profile
    of the microphone'
  merge: -1
  img_proc: true
- pgno: 104
  md: 'Once we generate this new body, we can rename it. In this example, I renamed
    the new body Avoid Zone. Now, we’re ready for our third and final automated modeling
    feature. Let’s go ahead and suppress our prior automated modeling features and
    activate automated modeling one last time. After selecting the same four faces
    to connect, we can now select the newly created **Avoid Zone** as an input for
    the bodies to avoid. The new setup for the final automated modeling can be seen
    in *Figure 3.12*:


    ![](img/baa027bed101c08b496f1f420cee8a5b_104_0.png)


    Figure 3.12 – Final setup for automated modeling with the newly created Avoid
    Zone


    After generating the new shapes, we now see six new design alternatives to choose
    from. If we choose **Alternative 6** and utilize the minimum volume, we will end
    up with the model preview that we can see in *Figure 3.13*:'
  merge: -1
  img_proc: true
- pgno: 105
  md: '![](img/baa027bed101c08b496f1f420cee8a5b_105_0.png)


    Figure 3.13 – Alternative 6 for the final automated modeling setup


    It is always a good idea to take a closer look at the outcome and make sure it
    meets our design objectives and that the output geometry is geometrically pleasing.
    As we can see in *Figure 3.14*, Fusion 360 created a new body utilizing T splines
    to create the shapes, used the boundary fill command to convert surface shapes
    into solid objects, and finally, used the combined feature cut operation to remove
    avoid bodies from the output shape. This final action of combined cut created
    two notches in our otherwise organic-looking geometry. We can easily make a change
    to the combined feature and remove one of the four tool bodies (in this case,
    **Avoid Zone**) to eliminate these two notches.'
  merge: -1
  img_proc: true
- pgno: 106
  md: '![](img/baa027bed101c08b496f1f420cee8a5b_106_0.png)


    Figure 3.14 – Automated modeling creates a group of features that can be edited
    individually


    With this final edit, we have created a design alternative that both fits our
    requirements and is drastically different compared to the original design. But
    is this design lightweight compared to the original? Even though we did not explicitly
    enter criteria around lightweighting the part as we were generating, we were consistently
    selecting the minimum volume for each selected design alternative. Let''s take
    a closer look at the original part and its properties. As we can see in Figure
    3.15, the component named **Original Connection** had a volume of 41,843 millimeters
    cubed. Note that to access the **PROPERTIES** dialog, we first created a new component
    and moved the bodies named **Connection-left** and **Connection-right** into this
    new component. Later, we right-clicked and selected **Properties** to access the
    **PROPERTIES** dialog.


    ![](img/baa027bed101c08b496f1f420cee8a5b_106_1.png)


    Figure 3.15 – Mass and Volume properties of the original design'
  merge: -1
  img_proc: true
- pgno: 107
  md: 'If you repeat the same steps, create a new component, and move the new connection
    body into this new component, we can take a look at its properties and see that
    the volume for this new component is 16,591 millimeters cubed. This means that
    the new design is roughly 40% of the volume and mass of the original design. Figure
    3.16 shows the properties of the new connection body created using automated modeling.


    ![](img/baa027bed101c08b496f1f420cee8a5b_107_0.png)


    Figure 3.16 – Mass and Volume properties of the new design


    Even though automated modeling gave us both an organic look and a lightweight
    design, we do not know for sure how this geometry will perform in a real-world
    setting. In order to verify that our model can withstand the loads associated
    with the weight of the microphone in various positions, we have to either build
    a prototype and test it or perform a simulation. Another tool we could have used
    to generate both organic and lightweight designs is generative design. Generative
    design is its own workspace within Fusion 360 and requires similar inputs for
    connecting faces and obstacle geometry. Using generative design, you also have
    the capability to enter loads and boundary conditions to simulate the forces this
    connection arm will have to bear. In addition, generative design allows users
    to select which manufacturing model they wish to produce the output geometry.
    Options such as Additive manufacturing, subtractive manufacturing (2.5 axis, 3
    axis, or 5 axis milling machines), as well as 2 axis cutting and Die casting,
    can be accounted for. Generative design also requires you to select which materials
    should be considered when creating designs that meet the requirements. As you
    can see in Figure 3.17, you can generate tens, if not hundreds, of outcomes based
    on the manufacturing method and material that meet certain design objectives.'
  merge: -1
  img_proc: true
- pgno: 108
  md: '![](img/baa027bed101c08b496f1f420cee8a5b_108_0.png)


    Figure 3.17 – Generative design outcomes of a motorcycle component that meets
    design criteria


    Regardless of the method we choose to generate organic and lightweight geometries,
    it is always good practice to perform a final simulation to make sure that these
    computer-generated shapes meet our performance criteria.


    In this section, we covered how to apply automated modeling to generate organic-looking
    shapes. We went through an iterative process of design utilizing automated modeling
    and updated our design criteria to meet a certain objective. We used the microphone
    stand as an example and compared the original design to the final design to ensure
    the outcome was a more lightweight version. In the next section, we will follow
    a similar example using the Shape Optimization simulation method to make sure
    that the design we create considers the performance criteria.


    # Utilizing Shape Optimization


    In the previous section, we covered how to use automated modeling in order to
    generate an organic and lightweight design. In this section, we will introduce
    performance-based modeling and learn about how to utilize Shape Optimization for
    generating similar outcomes.


    Shape Optimization is an analysis type available within the SIMULATION workspace
    of Fusion 360. Using Shape Optimization, engineers can create lightweight designs
    based on predetermined performance criteria. However, it is important to note
    that the outcome of a shape optimization study does not actually reflect the stresses
    created by the loads. Therefore, we should always validate our new design using
    additional simulations such as a static stress study. In this section, we will
    focus'
  merge: -1
  img_proc: true
- pgno: 109
  md: 'on creating new models using the shape optimization simulation technique. After
    choosing a design alternative, we will incorporate the outcome into our original
    design, both as a mesh body and as a solid body, and talk about the benefits and
    drawbacks of each method.


    To conduct a Shape optimization study, at a minimum, we are required to select
    a single **Target Body** to safely remove material from. We also have to assign
    materials to that body. Finally, we need to apply constraints and structural loads
    that act on that body.


    Loads can be applied by simply selecting faces and applying force or pressure.
    Alternatively, we can add loads to faces, edges, or corner points of other components
    that are in contact with our target body. As long as we define the contact conditions
    in our assembly properly, the target body will be optimized based on those loads.
    We can also select secondary bodies and have Fusion 360 automatically calculate
    their center of mass and apply a load based on their weight to our target body
    as remote loads.


    Shape optimization also allows us to create preserved regions based on common
    shapes such as a box, a cylinder, or a sphere. **Preserved Region** allows us
    to designate a certain zone to not be optimized. For example, if we want to preserve
    a hole that will be used as a connection interface for a bolt, we can select it
    and designate it as a preserved region so that the shape optimization does not
    remove material from that segment of the model. Within shape optimization, we
    can also ask Fusion 360 to give us a symmetrical output. In such cases, we will
    have to define the a symmetry plane so that the outcomes adhere to this symmetry
    condition. The most important part of a shape optimization study is the optimization
    criteria. Fusion 360 allows us to maximize the stiffness while minimizing the
    mass of the target body. In certain simulations, minimizing the mass using shape
    optimization may result in a design with numerous slots and braces. In such cases,
    Fusion 360 also allows us to control the minimum member size of any webbed design
    output.


    Now, let us explore this functionality with the same dataset and walk through
    an example process a designer may follow while working on this project using Shape
    optimization.


    Figure 3.18 shows the base and the mounting brackets for the microphone stand
    we introduced in the previous section of this chapter in yellow. Using Fusion
    360’s sketching tools, we can create a rectangle at the bottom of the two mounting
    brackets and a circle on top of the base. Then, we can utilize the **LOFT** command
    and create a solid body between these two sketch profiles. This new body will
    be the basis for our target body for shape optimization. Let’s rename this body
    `Shape to optimize`:'
  merge: -1
  img_proc: true
- pgno: 110
  md: '![](img/baa027bed101c08b496f1f420cee8a5b_110_0.png)


    Figure 3.18 – Creation of a new body with the LOFT command between the base and
    the mounting brackets


    Next, we will utilize the body named Avoid Zone, which we created in the previous
    section of this chapter. Let’s start by selecting the exterior faces of this body,
    as shown in blue in Figure 3.19, and offsetting them by 7.5 millimeters so that
    we have a larger avoid zone to begin with:


    ![](img/baa027bed101c08b496f1f420cee8a5b_110_1.png)


    Figure 3.19 – Using the offset face command to create a larger body'
  merge: -1
  img_proc: true
- pgno: 111
  md: 'Next, we can use the COMBINE feature within the MODIFY panel and remove the
    Avoid Zone body from the Shape to optimize body, as shown in Figure 3.20. This
    will ensure that we have enough space for the microphone and the two cables to
    rotate comfortably along the X axis.


    ![](img/baa027bed101c08b496f1f420cee8a5b_111_0.png)


    Figure 3.20 – Creation of the target body for shape optimization


    Next, we will switch from the DESIGN workspace to the SIMULATION workspace and
    create a new shape optimization study. During the creation of the shape optimization
    study, we can also edit its settings and choose a smaller mesh size (3% in Model-based
    Size), as shown in Figure 3.21. Using a smaller percentage produces a finer mesh,
    which takes longer to solve but produces better results.'
  merge: -1
  img_proc: true
- pgno: 112
  md: '![](img/baa027bed101c08b496f1f420cee8a5b_112_0.png)


    Figure 3.21 – Creating a mesh optimization study and customizing mesh settings


    After creating a shape optimization study, we still need to edit our model further
    so that we are ready to solve the simulation. To accomplish this, we can enter
    the SIMPLIFY environment accessible by selecting the SIMULATION workspace, the
    SETUP tab, and the SIMPLIFY panel. Once we are in the SIMPLIFY environment, we
    can select all the bodies we do not need for the shape optimization study, right-click,
    and remove them, as shown in Figure 3.22:


    ![](img/baa027bed101c08b496f1f420cee8a5b_112_1.png)


    Figure 3.22 – Removing unnecessary bodies within the SIMPLIFY environment'
  merge: -1
  img_proc: true
- pgno: 113
  md: 'Once we are left with all the bodies that will participate in the shape optimization
    study, it is time to define all the necessary inputs. We can start by designating
    the body named **Shape to optimize** as **Target Body**. Next, we can select the
    microphone and convert it to a point mass that will act on the top two surfaces
    of our target body. Next, we need to set the study materials. In this case, I
    have chosen **Aluminium AISI10Mg** from within Fusion 360''s Additive Material
    library.


    Next, we need to assign the loading conditions. As shown in Figure 3.23, we need
    to define our loads in three distinct load cases. Load case 1 will reflect the
    scenario where the microphone is in the vertical position and is exerting a downward
    force on the stand. Load cases 2 and 3 represent the microphone being tilted forward
    and backward, respectively. In load cases 2 and 3, we also need to apply a moment
    to simulate the load the microphone would be exerting on the stand as its center
    of mass will be away from the mounting brackets along the Y axis. All three load
    cases also require a fixed boundary condition on the bottom of the base plate.


    ![](img/baa027bed101c08b496f1f420cee8a5b_113_0.png)


    Figure 3.23 – Material definition and loading conditions for shape optimization
    of a microphone stand


    Once our loads and boundary conditions are set, we can move on to designating
    certain bodies as preserved regions. In this case, we will utilize the bodies
    named **Mount-right** and **Mount-left** and create two box-shaped preserved regions
    based on them, as shown in Figure 3.24. We can also create a symmetry plane along
    the Global YZ plane and request that our final shape be symmetrical. In this shape
    optimization study, we are looking to reduce the mass of the starting shape by
    70% and reach a target mass of 30% or less while maximizing the stiffness. We
    also defined the minimum member size as 3 millimeters or more, as a global constraint
    to our shape optimization criteria.'
  merge: -1
  img_proc: true
- pgno: 114
  md: '![](img/baa027bed101c08b496f1f420cee8a5b_114_0.png)


    Figure 3.24 – Preserved regions and Shape Optimization criteria


    After solving the shape optimization study, we will end up in the **RESULTS**
    environment within the **SIMULATION** workspace, as shown in Figure 3.25. The
    legend allows us to manipulate the optimized shape. Using a slider within the
    legend, we can change the outcome to be thinner or thicker, but the default outcome
    will be a target mass of 30%. Within the **RESULT TOOLS** panel, if we select
    the **PROMOTE** command, we will have the option to promote the outcome of the
    shape optimization as a new body to the **DESIGN** workspace.


    ![](img/baa027bed101c08b496f1f420cee8a5b_114_1.png)


    Figure 3.25 – Result of a Shape Optimization study'
  merge: -1
  img_proc: true
- pgno: 115
  md: 'The body we promoted from the **SIMULATION** workspace will be available in
    the **DESIGN** workspace as a new mesh body. As shown in Figure 3.26, this new
    mesh body will have a unique name referencing the shape optimization study.


    ![](img/baa027bed101c08b496f1f420cee8a5b_115_0.png)


    Figure 3.26 – Mesh outcome of a shape optimization promoted design workspace


    Once a mesh outcome has been promoted to the **DESIGN** workspace, we have three
    options to use this new model. Our first option is to keep the mesh body as a
    mesh body and simply 3D print it as is. Our next option is to try to reverse engineer
    this mesh body using the various mesh section-based sketching and solid body creation
    functionality we covered in Chapter 2. Our third option is to try to convert the
    mesh body into a solid body.


    If we want to pursue this third option, we will need access to the **Organic**
    mesh conversion method, as outcomes of shape optimization tend to be organic in
    nature. You can access the **CONVERT MESH** command within the **DESIGN** workspace
    by selecting the **MESH** tab followed by the **MODIFY** panel. The **Organic**
    method, as shown in Figure 3.27, is available to those who have access to the
    product design extension.'
  merge: -1
  img_proc: true
- pgno: 116
  md: '![](img/baa027bed101c08b496f1f420cee8a5b_116_0.png)


    Figure 3.27 – CONVERT MESH command with the Organic method


    Depending on the resolution and the accuracy we choose, we can convert this mesh
    body into a solid object using the Organic mesh conversion. Figure 3.28 shows
    an example of what such an outcome would look like.


    ![](img/baa027bed101c08b496f1f420cee8a5b_116_1.png)


    Figure 3.28 – The outcome of converting a mesh to a solid using the Organic method'
  merge: -1
  img_proc: true
- pgno: 117
  md: 'To finish our design, we will need to utilize the **COMBINE** command one last
    time and unify multiple bodies representing the base, the mounting brackets, and
    the shape-optimized outcome of our target body, as shown in *Figure 3.29*.


    ![](img/baa027bed101c08b496f1f420cee8a5b_117_0.png)


    Figure 3.29 – Combining multiple bodies to make a single microphone stand


    If we had chosen the first option, we could have left the shape optimization outcome
    as a mesh body and simply tessellated the base and the mounting brackets on the
    left- and right-hand sides. Then, we could have combined all four bodies as mesh
    objects and achieved a similar outcome. However, if we had utilized the mesh-based
    workflow and proceeded to create our final design as a mesh object, even though
    we would be able to 3D print our final design, we would not be able to simulate
    it using linear static stress within Fusion 360. This is because Fusion 360 requires
    objects to be solid bodies for them to be simulated. *Figure 3.30* shows our final
    design from four different angles. In this finished version, I have also moved
    all the unnecessary components into a new sub-assembly called **Extras** and turned
    their visibility off.'
  merge: -1
  img_proc: true
- pgno: 118
  md: '![](img/baa027bed101c08b496f1f420cee8a5b_118_0.png)


    Figure 3.30 – The outcome of a shape-optimized microphone stand


    In this section, we have introduced the concept of shape optimization and how
    it can be utilized for creating organic and lightweight geometry. We went through
    an example of how to create a target body for shape optimization and how to set
    up a simulation study. Upon conducting the study, we promoted our outcome to the
    **DESIGN** workspace and combined our outcome with existing bodies to create the
    final shape.


    In the next section, we will conduct a linear static stress simulation to see
    whether the outcome of the automated modeling can withstand operating loads and
    whether we need to make any design adjustments to eliminate potential failures
    during daily use.


    # Structural simulation to detect and fix common failures


    In the previous sections, we created several design alternatives using automated
    design and shape optimization. In this section, we will highlight how to simulate
    one of those design alternatives to check whether it can withstand the loads during
    operating conditions. We will also see whether the material we have chosen is
    appropriate based on the loading and try alternate materials. We will also try
    to detect and fix common failure points such as stress concentrations.


    Let’s get started by making a new design and saving it with a new name. Once we
    have a new Fusion 360 design document, using the **Insert Derive** command within
    the **SOLID** tab’s **INSERT** panel, we can insert bodies and components from
    other Fusion 360 design documents, as shown in *Figure 3.31*. In this example,
    we will be inserting multiple bodies from one of the previous microphone stand
    designs'
  merge: -1
  img_proc: true
- pgno: 119
  md: 'we created using Automated design. Once we have four key bodies (Base, Mount-left,
    Mount-right, and New connection) inserted into this design, we can utilize the
    COMBINE command located in the MODIFY panel. We can also assign material for this
    design within the MODIFY panel''s PHYSICAL MATERIAL function. We can choose the
    same additive Aluminium AlSi10Mg material we used in the previous sections for
    our first simulation study.


    ![](img/baa027bed101c08b496f1f420cee8a5b_119_0.png)


    Figure 3.31 – Insert Derive and COMBINE commands to join multiple bodies to one


    Now that we have the combined body within a single component, we are ready to
    start setting up our simulation. The first thing we will need to do is to switch
    from the DESIGN workspace to the SIMULATION workspace and create a new Static
    Stress study. Within this study, we will have to create three load cases, similar
    to how we set up our shape optimization study in the previous section. In each
    of these load cases, we will have to assign the same loads and boundary conditions
    we created for the shape optimization study.


    The first load case will help us simulate the microphone standing in the vertical
    position. The loading we will choose for this load case will be two bearing loads
    acting on the cylindrical holes of the Mount-left and Mount-right sections of
    the design.


    Load cases 2 and 3 will represent the microphone in a front-leaning and back-leaning
    position, just as how we had the shape optimization study set up in the previous
    section. For all three load cases, we will assign a fixed boundary condition at
    the bottom of the base. Next, we will assign material for the study. We will use
    the same material in the simulation study as the design material, as shown in
    Figure 3.32.'
  merge: -1
  img_proc: true
- pgno: 120
  md: "![](img/baa027bed101c08b496f1f420cee8a5b_120_0.png)\n\nFigure 3.32 – Bearing\
    \ load and study material for a linear static simulation\n\nOnce we have all our\
    \ loads and boundary conditions assigned, we are ready to conduct this simulation\
    \ study. We can start the solution from the **SETUP** tab's **Solve** panel.\n\
    \n> **Important note**\n> \n> In order to run a static stress simulation, you\
    \ will need a trial, Commercial, Educational, or Startup license. Personal licenses\
    \ do not have access to simulation capabilities: https://www.autodesk.com/products/fusion-360/personal.\n\
    \nOnce the results of a static stress analysis become available, Fusion 360 will\
    \ switch from the **SETUP** tab to the **RESULT** tab of the **SIMULATION** workspace.\
    \ You will be able to see your simulation results and change to various result\
    \ types. By default, Fusion 360 displays the factor of safety results. As shown\
    \ in Figure 3.33, if you switch the result type to **Stress**, using the dropdown\
    \ next to the legend, you can see the **Von Mises** stress this part will experience\
    \ under each load case.\n\n> **Important note**\n> \n> Von Mises stress is a universally\
    \ accepted method for calculating an equivalent stress value from the six stress\
    \ tensors (XX, YY, ZZ, XY, YZ, and ZX). It does not represent the true stress\
    \ a given part experiences, but it is one method we can use to calculate the factor\
    \ of safety for a given part and determine whether parts made from ductile materials,\
    \ such as metals, will yield or fracture under certain loading conditions."
  merge: -1
  img_proc: true
- pgno: 121
  md: 'In this example, we will focus on load case 2, which represents when the microphone
    is in the front-leaning position. If you turn on the minimum and maximum probes
    using the **Show Min/Max** command located in the **INSPECT** panel, you can see
    where the highest stress will occur on this part.


    It looks like we have high stress close to where an organic shape meets a prismatic
    shape close to the bottom of this part. Even though the stress results are low,
    and the factor of safety results are high, the location where the max stress is
    being displayed is a cause for concern and could be a potential failure point
    depending on which material we print this object with and/or the 3D printing method
    we choose.


    ![](img/baa027bed101c08b496f1f420cee8a5b_121_0.png)


    Figure 3.33 – Results of linear static stress for an initial simulation


    To take this idea a little further, let’s duplicate **Study 1** and create **Study
    2**. In **Study 2 - Static stress**, we will choose a different material but keep
    all the loads and boundary conditions the same for all three load cases. The ability
    to change materials is one of the main benefits of conducting multiple studies
    using study duplication workflows within Fusion 360.


    In **Study 1**, we chose aluminium as our material; in **Study 2**, let’s change
    the study material to **PA 12**, which is a plastic material that can be printed
    using an HP MultiJet Fusion 3D printer. *Figure 3.34* shows the physical and thermal
    material properties of this material.'
  merge: -1
  img_proc: true
- pgno: 122
  md: '![](img/baa027bed101c08b496f1f420cee8a5b_122_0.png)


    # Figure 3.34 – Physical and thermal properties of PA 12 as printed on HP Jet
    Fusion 580


    After running the second study, we can compare the results of **Study 1** to **Study
    2**. Using Fusion 360’s **COMPARE** functionality, we can split our layout into
    a multi-layout view, as shown in *Figure 3.35*.


    In this figure, we can see two images on the left that are from **Study 1**, which
    used aluminium as the material. We can also see two images on the right that are
    from **Study 2**, which uses PA 12 as the material. The top two images show the
    factor of safety results. The bottom two images show the stress results for load
    case 2. Even though the stress results are relatively small for both simulations,
    the factor of safety drops from 8+ down to 5.3 when using a plastic material versus
    aluminium.


    ![](img/baa027bed101c08b496f1f420cee8a5b_122_1.png)


    # Figure 3.35 – Comparing the results of two simulations with different materials'
  merge: -1
  img_proc: true
- pgno: 123
  md: 'Upon closer inspection, the high stress is in the same location as before.
    As mentioned earlier, this is an area where there is a chance of stress concentration.
    Stress concentration is a location within a model where the stress tends to rise
    regardless of the mesh size we use to simulate our model. It can be caused by
    a localized force, such as a point load, or an abrupt change in geometry. If there
    is a stress concentration in a model, it could lead to a fracture point during
    operation. If possible, it is always a good idea to either change the loading
    conditions or the geometry to remove stress concentration zones.


    Let’s see whether we can address the problem by making a design change. To make
    a design change, we will have to go back to the **DESIGN** workspace. In order
    to not lose the simulation results for the first two studies, let’s save our design
    with a new name. In this case, I have chosen to name my design `Mic Stand-simulation
    2`.


    Figure 3.36 shows a zoomed-in version of the region where the organic legs meet
    the prismatic feature. One way to eliminate stress concentration is to add fillets.
    If we try to add fillets to the geometry in its current condition, Fusion 360
    fails to create the fillet on our selected edges due to the complexity of the
    current shape.


    ![](img/baa027bed101c08b496f1f420cee8a5b_123_0.png)


    Figure 3.36 – Error during fillet creation for the problem region


    Such errors during fillet or chamfer creation can occur in CAD software that utilizes
    **boundary representation** (**BREP**) modeling. Whenever we run into such errors,
    we may have to come up with a different solution to change our design, so that
    we can resolve the stress concentration issue and create smooth transitions between
    edges. In this case, I have chosen to construct a new prismatic body. We can do
    that by creating a new sketch on the top of the base and using an offset from
    the existing prismatic shape of 5 millimeters, as shown in Figure 3.37.'
  merge: -1
  img_proc: true
- pgno: 124
  md: '![](img/baa027bed101c08b496f1f420cee8a5b_124_0.png)


    Figure 3.37 – Sketching two new profiles with offsets from the prismatic shapes


    We can extrude two new shapes by selecting these new profiles. This will be the
    new prismatic base that connects to our organic stand. In order to save weight,
    we can create our extrude with a taper angle. In this example, we will be utilizing
    a 20-degree taper angle as a part of the extrude feature, as shown in Figure 3.38.


    ![](img/baa027bed101c08b496f1f420cee8a5b_124_1.png)


    Figure 3.38 – Extruding two new prismatic shapes with a taper angle'
  merge: -1
  img_proc: true
- pgno: 125
  md: 'Once we have our new prismatic base, we can choose all the faces and/or edges
    where the base meets the organic shape and create a new transition using the FILLET
    command located in the MODIFY panel. In this example, we’ll be adding a 1.5-millimeter
    radius fillet, as shown in Figure 3.39:


    ![](img/baa027bed101c08b496f1f420cee8a5b_125_0.png)


    Figure 3.39 – Applying a fillet feature to the prismatic base and the organic
    stand


    While we''re focusing on adding fillets, it is also a good idea to add two fillets
    to the sharp corners at the bottom of the left and right mounting zones. As shown
    in Figure 3.40, we can reduce weight and make our design safer to use if we go
    with a larger fillet radius.


    ![](img/baa027bed101c08b496f1f420cee8a5b_125_1.png)


    Figure 3.40 – Applying a 4 mm fillet to the mounting brackets'
  merge: -1
  img_proc: true
- pgno: 126
  md: 'Now that we have made all of the necessary changes to our model, we can switch
    to the **SIMULATION** workspace. After we make sure that we have the correct PA
    12 material chosen, we can rerun the static stress study. This new study solved
    within this new Fusion 360 design shows a much more balanced stress distribution,
    as can be seen in Figure 3.41. It no longer has its highest stress point where
    the organic stand meets the prismatic base. It also has its highest stress value
    reduced compared to the previous designs/simulations.


    ![](img/baa027bed101c08b496f1f420cee8a5b_126_0.png)


    Figure 3.41 – Stress results after a design change to eliminate stress concentration


    Having gone through these three simulations, we can be confident that not only
    will our microphone stand survive daily use but, when 3D printed, it will not
    have potential weak spots, which could lead to fracture over time.


    It is important to note that we have simulated these parts using materials with
    an isotropic material model assumption. The materials in Fusion 360’s Additive
    Material library, such as metals, powders, and resins, have physical properties
    based on having been 3D printed and tested. In the case of materials such as PA
    12, which behave in an orthotropic fashion, Fusion 360 uses build direction mechanical
    properties and follows an isotropic material behavior assumption. For additional
    details on each material and 3D printing technology, please refer to the spec
    sheets of the material being simulated – for example, https://h20195.www2.hp.com/v2/getpdf.aspx/4AA7-1533ENA.pdf.


    In conclusion, there are a number of ways we can lightweight parts. Fusion 360
    offers several easy-to-use methods for lightweighting existing parts as well as
    creating new designs.'
  merge: -1
  img_proc: true
- pgno: 127
  md: '# Summary


    In this chapter, we have created organic and lightweight models using Automated
    Modeling. Automated Modeling gave us six design alternatives to choose from and,
    once we chose one of them, we were able to modify its volume and create an organic
    and lightweight design alternative. Next, we designed a starting shape and used
    Shape Optimization to lightweight that target shape based on loads and boundary
    conditions.


    However, neither of those methods created shapes based on stress results. In order
    to make sure that our chosen design alternative could withstand stresses that
    occur during operating loading conditions, we conducted a static stress study.
    Our initial simulations pointed out that our material choice was way too strong
    for our needs. After changing our material from a metal to a plastic, we realized
    that our design would still perform well for its intended use. However, we also
    identified a stress concentration zone and conducted one final design change to
    eliminate the stress concentration in order to minimize potential future failure
    points.


    Using a similar workflow, you can be sure to create lightweight and compliant
    designs that not only can withstand operating conditions but will have a long
    life in the field. In the next chapter, we will focus on how to further lightweight
    designs using various hollowing and latticing methods to reduce material and energy
    consumption.'
  merge: -1
  img_proc: true
