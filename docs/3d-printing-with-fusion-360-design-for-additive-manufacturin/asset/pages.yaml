  merge: -1
  img_proc: true
- pgno: 370
  md: '![](img/baa027bed101c08b496f1f420cee8a5b_370_0.png)


    Figure 12.22 – Simulating the additive toolpath of an MPBF additive setup


    Please keep in mind that MPBF toolpaths would take a longer time to calculate/recalculate
    if you selected the **Show all layers** option within the **Simulate Additive
    Toolpath** dialogue as MPBF printers have smaller layer heights.


    If you just want to see a quick animation of your additive toolpath, you may want
    to choose to generate and show every 2nd, 5th, 10th, or 100th layer. The additive
    toolpath simulation shown in Figure 12.22 was generated after suppressing the
    polyline support as well as the two volume supports that were used previously
    to demonstrate the support concepts earlier. **Volume Support3** was added to
    the entire component using default settings to support the entire body.


    Once we are done orienting our models, adding support structures, and simulating
    the toolpath, we can create the necessary machine build file to start the 3D printing
    job. At the beginning of this section, we created the machine build file for a
    generic MPBF printer, as shown in Figure 12.7. In Figure 12.23, we can see that
    using the same **Create Machine Build File** command will result in a similar
    dialogue with a machine-specific export option. In this setup, we utilized a **One
    Click Metal** printer. Therefore, the exporter dropdown only contains the relevant
    file format, which is **OneClickMetal exporter** (.gcode):'
  merge: -1
  img_proc: true
- pgno: 371
  md: '![](img/baa027bed101c08b496f1f420cee8a5b_371_0.png)


    Figure 12.23 – Exporting the necessary machine build file from an additive setup


    Fusion 360 can create machine build files for eight of the nine machine vendors
    it has in its machine library. As we just demonstrated, you can create a gcode
