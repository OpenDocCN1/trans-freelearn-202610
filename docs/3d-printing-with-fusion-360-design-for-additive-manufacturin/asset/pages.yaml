- pgno: 425
  md: 'As explained in the description section on the help.autodesk.com page, this
    script creates an additive setup, with all the components using an FFF printer
    and print setting. Then, it automatically orients and arranges all the parts on
    the build plate. It also adds volume supports to all the parts that require support
    structures, based on the critical overhang angle defined within the script. Finally,
    it generates the additive toolpath and simulates it. Technically, such a script
    can also be further expanded to generate the G-code. However, it is always a good
    idea to visually observe the setup and the generated toolpath before generating
    the machine file and starting a print.


    All the actions this script takes are explicitly defined in the code, and they
    can be customized based on your specific printer, print settings, and additive
    manufacturing technology. In Figure 14.22, you can see the line items related
    to the print settings and the machine model that the script utilizes. You can
    type in a different machine model or a different print setting by entering them
    within quotation marks, highlighted by callout 1 and callout 2. After saving the
    script and executing it, Fusion will create an additive setup for your printer
    and print settings.


    ![](img/baa027bed101c08b496f1f420cee8a5b_425_0.png)


    Figure 14.22 – Editing a script to customize it for your printer and print settings


    Now that we have highlighted how to create a script and customize it, let’s demonstrate
    how to use it with a new Fusion design document. To showcase what this script
    does, we will use a Fusion document named Front Bumper Bracket. After opening
    this Fusion document, we can use the Shift + F shortcut to access the Scripts
    and Add-Ins dialog. After selecting our custom script, named FFF Setup, we can
    select Run to execute it, as shown in Figure 14.23.'
  merge: -1
  img_proc: true
- pgno: 426
  md: '![](img/baa027bed101c08b496f1f420cee8a5b_426_0.png)


    Figure 14.23 – Executing a script in Fusion 360


    After a few seconds, you will notice that the active workspace has changed from
    **DESIGN** to **MANUFACTURE**, as shown in Figure 14.24. This script created a
    new manufacturing model called My Manufacturing Model - FFF. It also created a
    new additive setup with the **Prusa i3 MK3S+** printer and the **PLA (Direct Drive)**
    print setting. It automatically oriented the component so that it requires the
    least amount of support structures. It then arranged the component so that it
    is in the center of the build plate. It also added the necessary solid volume
    support and created the additive toolpath. The script left us with a simulated
    additive toolpath visualization, as shown in Figure 14.24.


    ![](img/baa027bed101c08b496f1f420cee8a5b_426_1.png)


    Figure 14.24 – The result of executing the FFF setup script'
  merge: -1
  img_proc: true
- pgno: 427
  md: 'As mentioned before, all of these actions are things we could have done manually
    using Fusion’s various commands and dialogs. However, by utilizing a script, we
    eliminated the need for manual interaction with the software. The time saved by
    automating a single component may not be significant, but imagine if you had 10
    unique components you needed to 3D print. Going through these steps while interacting
    with numerous dialogs for each component would be very time-consuming. By automating
    the entire workflow with a single script, we not only eliminate errors that a
    user may introduce by mistyping an input but also save time in the print preparation
    steps. Using automation capabilities with API-driven scripts, you can minimize
    errors and improve your productivity.


    # Summary


    In this chapter, we talked about how to automate our workflows when creating additive
    setups and generating toolpaths. We started the chapter by highlighting how to
    use the Autodesk App Store to search for apps that can improve our productivity
    for certain design and manufacturing workflows. We demonstrated how to download,
    install, and use an app named `DuplicateComponents`, in order to quickly create
    multiple copies of the same component so that we can print multiple parts within
    the same build volume.


    Then, we learned how to associate print settings with a given machine so that
    we can select the machine and print setting combination with ease when creating
    an additive setup. We then highlighted how to customize inputs for various dialogs,
    such as part orientation or additive arrange, and save our inputs as user defaults
    so that the next time we use those commands, we don’t have to edit the inputs
    to match our preferences. We also learned how to inquire the parameter name for
    each input field, and how to use those parameter names as inputs in subsequent
    input fields. We ended the chapter by learning about creating multiple support
    actions for a given setup and saving those actions as a template. We highlighted
    where templates are saved within the template library and how to reuse those templates
    in subsequent additive setups, saving time and minimizing user input errors.


    We ended the chapter by demonstrating the use of scripting with programming languages,
    such as Python, in order to automate additive workflows within Fusion 360. We
    showcased how to create scripts and edit them using Visual Studio Code, addressing
    our automation needs. We created an example Python script and showed how it can
    be used to automate the entire additive workflow, from setup creation to part
    orientation, part placement, support generation, and toolpath creation.


    Using all the information we have focused on in this chapter, you can save time
    by automating your repetitive tasks and eliminate any potential errors you may
    introduce if you were to create your additive setups manually.'
  merge: -1
  img_proc: true
