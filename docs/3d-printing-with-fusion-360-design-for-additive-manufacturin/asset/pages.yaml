    # Recognizing CAD features and editing them


    In the previous section, we briefly touched on the find features command, which
    is unique to direct modeling. In this section, we will dive a little deeper into
    this feature and highlight its strengths and shortcomings. We will also utilize
    this feature with an example dataset in order to edit a CAD file we import with
    DFAM principles in mind.


    As 3D printing has become more mainstream, we need categories to refer to a certain
    group of 3D printers based on their category. At the time of writing, there are
    seven categories of additive manufacturing:


    +   - Material extrusion

    +   - VAT photopolymerization

    +   - Binder jetting

    +   - Material jetting'
  merge: -1
  img_proc: true
- pgno: 74
  md: '+   - Powder bed fusion

    +   - Direct Energy deposition

    +   - Sheet lamination


    There are multiple material extrusion methods, but probably the most common one
    is **Fused Filament Fabrication (FFF)**. As some of the early patents for 3D printing
    started expiring after 2002, FFF technology has been going through democratization.
    Nowadays, anyone can purchase an FFF 3D printer for home use on common shopping
    websites such as www.amazon.com. VAT photopolymerization technology has also been
    through a similar democratization process. We can now purchase **stereolithography
    (SLA)/digital light processing (DLP)** 3D printers for home use.


    However, even though some of the early patents around powder bed fusion technology
    started expiring around 2016, powder bed fusion 3D printers are not being manufactured
    or marketed for home use. This will likely continue to be the case as powder bed
    fusion technology requires the user to have a larger operating space with better
    ventilation and fire safety measures depending on the material being printed.
    In addition, as powder bed fusion involves the use of powder, small particulates
    of the material could be a safety hazard while postprocessing and would require
    additional **Personal Protection Equipment(PPE)**.


    Regardless of the type of hardware we choose to 3D-print with, there are several
    guidelines and design rules we have to follow if we want to additively manufacture
    our designs. These rules are not set in stone and change based on various parameters.
    They can change based on the type of 3D printer we will use, the type of material
    we will print with, or even the manufacturer or the specific printer. To effectively
    utilize the information you learn in this chapter, you will need to know what
    3D printing category/ printer you are designing for. There are several resources
    that list commonly accepted design rules for 3D printing. Hubs.com is one such
    resource you can utilize. Figure 2.25 shows the published design rules for 3D
    printing on https://www.hubs.com/get/3d-printing-design-rules/.'
  merge: -1
  img_proc: true
- pgno: 75
  md: '# DESIGN RULES

    FOR 3D PRINTING


    |  | Supported walls | Unsupported walls | Support & overhangs | Embossed & engraved
    details | Horizontal bridges | Holes | Connecting /moving parts | Escape holes
    | Minimum features | Pin diameter | Tolerance |

    |---|---|---|---|---|---|---|---|---|---|---|---|

    |  | Walls that are connected to the rest of the print on at least two sides.
    | Unsupported walls are connected to the rest of the print on less than two sides.
    | The maximum angle a wall can be printed at without requiring support. | Features
    on the model that are raised or recessed below the model surface. | The span a
    technology can print without the need for support. | The minimum diameter a technology
    can successfully fully print a hole. | The recommended clearance between two moving
    or connecting parts. | The minimum diameter of escape holes to allow for the removal
    of build material. | The recommended minimum size of a feature to ensure it will
    not fail to print. | The minimum diameter a pin can be printed at. | The expected
    tolerance (dimensional accuracy) of a specific technology. |

    | Fused deposition modeling | 0.8 mm | 0.8 mm | 45° | 0.6 mm wide & 2 mm high
    | 10 mm | Ø2 mm | 0.5 mm | — | 2 mm | 3 mm | ±0.8% (lower limit ±0.5 mm) |

    | Stereolithography | 0.5 mm | 1 mm | support always required | 0.4 mm wide &
    high | — | Ø0.5 mm | 0.5 mm | 4 mm | 0.2 mm | 0.5 mm | ±0.8% (lower limit ±0.1
    mm) |

    | Selective laser sintering | 0.7 mm | — | — | 1 mm wide & high | — | Ø1.5 mm
    | 0.3 mm for moving parts & 0.1 mm for connections | 5 mm | 0.8 mm | 0.8 mm |
    ±0.2% (lower limit ±0.3 mm) |

    | Material jetting | 1 mm | 1 mm | support always required | 0.5 mm wide & high
    | — | Ø0.5 mm | 0.2 mm | — | 0.5 mm | 0.5 mm | ±0.1 mm |

    | Binder jetting | 2 mm | 3 mm | — | 0.5 mm wide & high | — | Ø1.5 mm |  | 5 mm
    | 2 mm | 2 mm | ±0.2 mm for metal & ±0.5 mm for sand |

    | Direct metal Laser sintering | 0.4 mm | 0.5 mm | support always required | 0.2
    mm wide & high | 2 mm | Ø1.5 mm | — | 5 mm | 0.6 mm | 1 mm | ±0.1 mm |


    Figure 2.25 – A set of design rules for 3D printing


    As we can see in Figure 2.25, there are different requirements for different technologies.
    For example, if we were designing a part to be printed using selective laser sintering,
    we would not need to care about overhang angles. This category of 3D printers
    can print objects in any orientation without having to worry about creating support
    structures, as the part being 3D-printed is sufficiently supported by the powder
    below it. However, we need support structures to be generated for 3D printing
    with an FFF printer when we have features with overhang angles that are less than
    45 degrees to the horizontal plane. Figure 2.26 demonstrates how we can create
    different styles of support structures within Fusion 360 based on the overhang
    angles when we are in the manufacture workspace. We will cover this topic in Chapter
    10 in more detail.'
