- pgno: 411
  md: '![](img/baa027bed101c08b496f1f420cee8a5b_411_0.png)


    # Figure 14.5 – Running add-ins at the time of startup of Fusion 360


    Now that our app is installed and running, we are ready to use it with an our
    workflow. This add-in includes a new command within the Pattern pullout menu of
