    ![](img/baa027bed101c08b496f1f420cee8a5b_26_1.png)


    Figure 1.2 – You can rename projects on the Project Details screen'
  merge: -1
  img_proc: true
- pgno: 27
  md: 'Once the project has a name we approve (in Figure 1.2, I renamed the project
    3D printing), we can take a look at various methods we have available to upload
    designs and other documents to Fusion Team and Fusion 360.


    The first option we have to upload our designs and documents to Fusion Team is
    within the created project itself. As shown in Figure 1.3, we are in a project
    named 3D printing, and we can select the blue **Upload** button to see the various
    options we have to upload things, such as **File**, **Folder**, **Assembly**,
    and **From Dropbox**. If we select **File** from that dropdown, we can upload
    any file stored on our local storage directly to our active project on **Fusion
    TEAM**. If the files we upload contain mesh or CAD geometry (for example, **STL**,
    **STEP**, **SAT**, **Inventor**, or **Solidworks**), we will be able to open those
    designs in Fusion 360 for further editing and manufacturing. If they are non-CAD
    files (for example, Microsoft Word documents or PDF files), we won''t have native
    access to them in Fusion 360, but we can still view them in our internet browser
    or mobile apps.


    ![](img/baa027bed101c08b496f1f420cee8a5b_27_0.png)


    Figure 1.3 – Uploading local files to our 3D printing project on Fusion TEAM


    If you are used to traditional desktop CAD software, uploading files to a Fusion
    project using FUSION TEAM may not have the intuitive workflow you are familiar
    with. However, it is a useful way to quickly upload multiple files associated
    with a project to your Autodesk cloud storage.'
  merge: -1
  img_proc: true
- pgno: 28
  md: 'If you seek a more traditional workflow to open your CAD or mesh files, you
    will want to have Fusion 360 installed on your computer. You can download and
    install Fusion 360 from the following link: https://www.autodesk.com/content/autodesk/global/en/products/fusion-360/trial-intake.


    Once Fusion 360 is installed and started, you can access the File dropdown and
    select Open. When you do, you will be greeted with the Open dialog. As shown in
    Figure 1.4, select the Open from my computer... option within this dialog, and
    you will be able to select from a list of supported mesh and CAD file types, as
    shown in Figure 1.5:


    ![](img/baa027bed101c08b496f1f420cee8a5b_28_0.png)


    Figure 1.4 – The File | Open... workflow allows you to open CAD and mesh files
    from your computer


    In this dialog, you will have the option to open any of the Mesh or CAD file types
    that Fusion 360 supports. As Autodesk regularly updates Fusion 360, you never
    have to worry about not having access to the latest CAD translators:'
  merge: -1
  img_proc: true
- pgno: 29
  md: '![](img/baa027bed101c08b496f1f420cee8a5b_29_0.png)


    Figure 1.5 – A list of the available CAD and MESH file types that Fusion 360 can
    open


    This is a great option to open a single file quickly, but there are several downsides
    to this option:


    +   - You can only open one file at a time using this method.

    +   - When using this method, you end up in Direct Modeling mode upon opening
    a CAD file. If you want to capture design history, you will need to manually turn
    on the design history using the browser. Modeling with the Design history and
    Direct modeling methods will be covered in detail in Chapter 2.

    +   - You do not get a chance to set the units or part placement when opening
    STL/OBJ files.


    In conclusion, if you try to open STL or OBJ files, this is not the option I would
    recommend. However, if you open a CAD file (for example, STEP or SAT) or a 3MF
    file, this is a quick and easy option that you may want to use. Don''t forget
    to manually turn on Capture Design History if you want to store your edits in
    the timeline, as shown in Figure 1.6:'
  merge: -1
  img_proc: true
- pgno: 30
  md: '![](img/baa027bed101c08b496f1f420cee8a5b_30_0.png)


    Figure 1.6 - After a File | Open... workflow, turn on Capture Design History via
    the browser


    Another option available when opening CAD and Mesh files is within Fusion 360''s
    Data Panel. You can access the Data Panel window by selecting the Show Data Panel
    icon, located in the top-left corner of the interface, as shown in Figure 1.7.


    ![](img/baa027bed101c08b496f1f420cee8a5b_30_1.png)


    Figure 1.7 - Show/Hide Data Panel'
