  md: 'Once the feature is added, we can edit the feature. However, as you can see
    in Figure 2.22, the **EDIT FILLET** dialog is very different and has a limited
    set of options compared to the creation dialog. This difference in creation versus
    editing is both the superpower of direct modeling and its Achilles heel, depending
    on how you want to model versus how you want to edit your models.


    ![](img/baa027bed101c08b496f1f420cee8a5b_71_0.png)


    Figure 2.22 – Editing a Fillet feature in Direct modeling


    The final group of features I want to highlight for direct modeling is related
    to working with components in an assembly context. In assembly modeling, we want
    to copy a given component and paste it to make duplicates so we can 3D-print multiples
    of the same part. We can duplicate components using one of many methods. We can
    select the component by right-clicking on it and choosing the **Copy** command,
    then repeating the process and choosing the **Paste** command. We can use one
    of multiple **Pattern** tools to create numerous instances of the selected component.
    Alternatively, we can simply insert a given component multiple times into our
    existing design from the data panel. If we are working with direct modeling, we
    can make a duplicated component an independent one. To accomplish this, select
    one of the duplicates, right-click on it, and choose **Make Independent**, as
    shown in Figure 2.23.'
