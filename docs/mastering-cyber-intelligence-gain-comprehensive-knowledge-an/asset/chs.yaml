  \ ACH 说明\n\n图 15.23 简化以说明如何对国家行为体进行威胁归因。该图显示美国和以色列的绝对加权不一致得分最低。让我们看一些重要的证据解释：\n\n\
  - - **E1：** 2010年和2020年的袭击针对伊朗。网络战的增长表明，如果有政治或经济原因，具有先进网络基础设施的国家可以相互攻击。然而，作为国家行为体，伊朗不太可能攻击自己。因此，我们使E1与H2高度不一致，但与其余高度一致。注意，你也可以根据你的证据有不同的意见。例如，一位分析师可能会指出，由于伊朗与俄罗斯的关系，这两个国家不太可能相互攻击。\n\
  - - **E5：** Stuxnet的初始访问是通过感染的闪存驱动器（https://bit.ly/3FVmhak）。插入的感染闪存驱动器引发了伊朗2010年核电站袭击，因为据称的工厂未连接到互联网。然而，尽管原始Stuxnet于2012年过期，但仍有其他蠕虫从中创建以针对制造公司。其中一些蠕虫包括Industroyer（https://bit.ly/3IvP8Ue）和Crashoverride（https://bit.ly/3qYiXae）。因此，我们使E5与H1和H3一致，与H2不一致，对其余为中性。\n\
  \n- - **E7：** Stuxnet的创建和发展已被多个来源归因于美国和以色列（https://wapo.st/3nVtyAF）。因此，我们使*E7*与*H1*和*H3*高度一致，与其余高度不一致。\n\
  \n应遵循相同的逻辑来解释和填写其余信息。\n\n> **重要说明 – 关于用例**\n> \n> 该用例已用于练习ACH。CTI分析师应识别支持其分析的基本证据。他们必须考虑每条证据与假设相关联的置信水平。请注意，选择*H1*和*H3*作为绝对加权不一致假设最小并不意味着美国或以色列攻击了伊朗。\n\
  \nACH的典型结论应至少依赖于两条最重要和无可争议的证据——例如*E7*和*E1*。所有其他证据用于支持假设。结论示例如下：\n\n最高可能性的假设基于两条与意图相关的证据。伊朗发电厂的袭击与Stuxnet恶意软件针对伊朗核电厂的目标及其据称由美国和以色列创建的目标一致。然而，该分析有限，因为尚未发现机会证据。\n\
  \n在构建国家或国家支持的威胁归因时，其他需要考虑的因素是政治和经济关系以及其他政府合作伙伴关系。两位CTI分析师可能对同一用例有不同的ACH输出。因此，你应根据你收集的信息和事实填写ACH矩阵。\n\
  \n## 总结\n\n在CTI流程上建立实践技能是CTI分析师有价值的原因。CTI分析师应能够使用手动方法和工具来回答CTI问题。建立技能的最佳方式是通过练习、培训和研究威胁情报。本章介绍了开发和共享IOCs，演示了如何为安全增强创建YARA规则，以及使用Anomali\
  \ STAXX和AlienVault OTX等平台共享情报。它还说明了构建威胁活动组、跟踪活动以及将网络活动归因于国家支持（国家）和非国家支持威胁行为体的方法。作为CTI分析师，你也熟悉了竞争性假设的分析。\n\
  \n\n\nCTI 是使网络威胁防护有效的拼图的一部分。在安全功能的核心中，它驱动着 **SOCs**，并将其从已知的传统 SOC 转变为情报驱动的 SOC。诸如取证、事件响应、风险管理、安全审计、威胁狩猎、渗透测试和安全分析等安全团队均可从威胁情报中受益。每个团队都可以使用\
  \ CTI 输出来改进其指标。其高效性和协作性正在证明其价值，因为许多组织试图踏上 CTI 之旅。\n\n本书记述的内容建立在 CTI 生命周期之上，利用理论和实践深入探讨了周期的每个阶段。本书在逻辑上分为三个部分。第一部分，从\
  \ *第1章，网络威胁情报生命周期* 到 *第5章，目标设定、CTI 策略程序和实际用例*，涉及 CTI 生命周期、需求、技艺和标准，以及 CTI 在安全运营中的集成。第一部分首先对\
  \ CTI 生命周期进行了总结性解释，深入了解每个阶段的主要任务。然后详细说明如何生成情报需求、实施 CTI 团队以及定义 CTI 应用领域，广为人知的是威胁情报的类型（战略、运营和战术情报）。它讨论了\
  \ CTI 框架，它们在 CTI 分析中至关重要，以及它们如何协同工作。它还涵盖了可以推动 CTI 项目取得成功结果的技艺和标准。最后，它指导 CTI 分析师和组织设定情报目标并实施策略，将情报集成到组织的\
  \ 安全堆栈中，使用实际示例。\n\n第二部分，从 *第6章，网络威胁建模和对手分析* 到 *第10章，威胁建模和分析 – 实际用例*，涵盖了威胁建模、分析、数据收集和防御机制。它首先介绍了网络威胁建模和对手分析，提供了使用适当方法战略性地建模威胁和分析对手所需的知识。然后它研究了威胁情报数据源，展示如何定义正确的来源、收集数据并将其存储以供将来使用。它还研究了防御机制和数据保护，强调了与网络威胁防御相关的挑战，如何使用示例将\
  \ CTI 程序映射到防御策略、数据监控的重要性以及主动分析。然后它涵盖了 **人工智能** (**AI**) 在威胁情报中的潜在影响，讨论了 AI 对 CTI\
  \ 的益处、其在安全堆栈中的位置以及 **安全信息和事件管理** (**SIEM**) 解决方案对其的采用。最后，第二部分以动手用例结束，说明分析师如何利用 CTI\
  \ 执行入侵分析。\n\n第三部分，从 *第11章，可用安全：威胁情报作为流程的一部分* 到 *第15章，威胁情报共享和网络活动归因 – 实际用例*，研究了将\
  \ CTI 文化化。它首先通过研究可用安全指南、威胁建模和分析在政策制定中的益处、威胁防御中思维模型的用途以及基于情报的 DevSecOps 架构的实施，使 CTI\
  \ 成为业务流程的一部分。然后它研究了威胁情报在 SIEM 解决方案和 SOC 运营中的重要性 – 如何将 CTI 集成到 SIEM 工具中并使 SOC 智能化。它还涵盖了用于\
  \ CTI 评估和有效性测量的安全指标，包括 CTI 团队评估。它研究了 IOCs、痛苦金字塔和 **攻击指标 (IOAs)**。然后它使用示例讨论了威胁情报报告、分发和反馈循环，为分析师提供构建战略、战术和运营报告的策略。它详细说明了如何构建和理解对手的活动。最后，它涵盖了使用\
  \ YARA 和 STIX/TAXII 平台等不同标准进行 IOCs 开发的手动用例、使用共享平台进行情报分发、活动组和用于威胁活动跟踪的活动构建，以及使用 ACH\
  \ 将网络活动归因于国家支持的行动者。\n\n通过本书 *掌握网络情报*，我们为安全专业人员配备了执行威胁情报职责的基础知识和技能。我们还为组织配备了采用和将威胁情报集成到安全运营中的策略和工具。本书提供的理论和实践知识应有助于个人在\
  \ CTI 认证之旅中。\n"
