  \ ~2.5% |\n\n图 15.21 – 活动组监控的证据分类\n\n在分析过程中考虑所做假设对于更好地监控威胁活动组和战役至关重要。在前面的图中，我们将\
  \ *第 10 章，威胁建模和分析 – 实际用例* 中进行的入侵分析填充到 *图 15.3* 中提供的活动组。++ 符号表示杀伤链阶段和钻石顶点与活动组或战役以\
  \ *高置信度* 对齐。+- 表示杀伤链和钻石顶点与活动组 *部分* 对齐。例如，先前分析的入侵的安装杀伤链阶段的钻石 *基础设施*（参见 *图 15.21*\
  \ 中突出显示的部分）依赖于恶意软件安装作为执行模式，具体为 `executable_1640.exe` 和 `reader_sl.exe`。活动组 1 也依赖于恶意软件安装，但使用\
  \ 3PARA，一种 **远程访问木马（RAT）**。因此，它们在总体基础设施上匹配，但在具体方面不匹配。我们知道许多威胁行为者依赖恶意软件安装作为执行方法。--\
  \ 符号表示存在杀伤链阶段和钻石顶点的证据，但它们与活动组或战役不匹配。最后，空单元格表示我们没有证据做出结论或评估。\n\n在表格末尾，分析师应计算威胁分析属于特定活动组或战役的概率。没有计算属于战役或活动组的可能性的标准。表格中显示了一个简化的模型，其中\
  \ + 为 1，– 或空单元格为 0。然而，根据活动情况，复杂的归因模型可以向表格添加加权参数。例如，在监控战役时，钻石模型的 *受害者* 参数可能比其他顶点具有更大的权重。CTI\
  \ 分析师（或团队）在实施威胁归因机制时应具有创造性。\n\n## 用例六 – 一种 ACH 以及将活动归因于国家行为者组\n\n在 CTI 中，ACH 被用作分析方法，以识别和选择最佳假设来支持威胁场景。该选择涉及制定多个相互竞争的假设，用证据支持假设以证明归因合理，并选择不一致性较小的假设并拒绝其他假设。\n\
  \n> **重要说明 – ACH 在 CTI 中的实用性**\n> ACH 用于统计学、数学、心理学和数据科学。虽然它在克服思维和分析中的某些局限性方面显示出有效性，但在\
  \ CTI 中必须谨慎并受限制地使用。威胁情报分析师应仅在没有或较少技术证据支持威胁情报分析或场景时使用 ACH。\n\n网络战并非神话。许多数据泄露表明政治经济冲突可能与网络犯罪相交。政府已对其他政府和私营组织使用网络攻击。最广为人知的国家主导的网络攻击之一是朝鲜于\
  \ 2014 年 11 月对 *索尼影业娱乐* 的 *alleged* 攻击（https://bit.ly/3rw1yoc, https://bit.ly/3qG3AmC,\
  \ 和 https://bit.ly/3KBzhp8）。用于诸如 WannaCry 之类的勒索软件攻击的 **EternalBlue** 漏洞利用工具由美国 **国家安全局（NSA）**\
  \ 开发（https://wapo.st/3rxVWVz）。国家行为者攻击的数量随时间推移而增加（https://bit.ly/3qKCtGM）。因此，CTI\
  \ 分析师必须意识到这一点并保护组织免受其侵害。\n\n### 用例目标\n本用例的目标是展示 CTI 分析师如何利用 ACH 为进一步分析选择最佳假设。它还展示了如何利用\
  \ **开源情报（OSINT）** 使用 ACH 分析国家行为者。\n\n### 用例场景\n你是一家使用 **监控与数据采集（SCADA）** 进行流程的制造公司的分析师。你已收到有关\
  \ *Stuxnet*（及其演变 *Stuxnet 2*）恶意软件的情报。你还发现 Stuxnet 处于以色列和伊朗之间政治冲突的风口浪尖，首先用于 2010\
  \ 年伊朗核电站攻击（https://bbc.in/3rzQwyi）并 alleged 在 2020 年伊朗核设施攻击中重新使用（https://bit.ly/3GVG1e2）。你需要使用\
  \ ACH 评估 Stuxnet 是否对你的组织构成威胁，并评估以色列对 2010 年和 2020 年伊朗核设施攻击的归因。\n\n### 用例工具\nPasquale\
  \ Stirparo 提供的 ACH Excel 模板用于此分析（https://bit.ly/3nNia56）。请注意，你也可以创建自己的 ACH 模板。或者，可以使用\
  \ PARC ACH 执行任务（https://bit.ly/3Itvh84）。\n\n### 使用 ACH 评估 Stuxnet 是否对组织构成威胁\n以下步骤用于对我们组织的\
  \ Stuxnet 恶意软件（一种蠕虫）进行 ACH。注意 *H* 和 *E* 分别用于假设和证据：\n\n- 1. **制定假设**：我们需要创建有关恶意软件的假设。你可以自由列举尽可能多的假设。我们将只创建三个，如下：*H1*\
  \ – Stuxnet 蠕虫对我们的组织不构成威胁。*H2* – Stuxnet 蠕虫对我们的组织构成威胁。*H3* – Stuxnet 影响 SCADA 系统，但我们的组织防护良好。因此，我们的系统无法被\
  \ Stuxnet 攻破。\n- 2. **识别支持假设的证据**：我们需要识别可以启发我们评估的证据或事实。请注意，可以使用外部情报为 ACH 生成事实。有关\
  \ Stuxnet 的一些证据包括以下内容：*E1* – Stuxnet 是一种攻击基于 SCADA 的系统的蠕虫。*E2* – Stuxnet 使用 .lnk\
  \ 快捷方式的副本通过可移动媒体传播。*E3* – Stuxnet 使用 HTTP 与 C2 服务器通信。*E4* – Stuxnet 修改系统进程。*E5*\
  \ – Stuxnet 检查特定的操作系统、注册表项和漏洞，如果条件不满足则不传播。*E6* – Stuxnet 使用 autorun.inf 传播。*E7*\
  \ – 我们组织的安全措施已更新，恶意软件无法在没有适当权限的情况下渗透或执行。*E8* – 我们的组织容易受到攻击，可能被 Stuxnet 攻破。*E9* –\
  \ Stuxnet 于 2010 年首次被发现。*E10* – Stuxnet 自 2010 年以来一直被重复使用至今。\n- 3. **将证据分类为意图、机会或能力**：我们应根据威胁特征的元素对证据进行分类。它使我们能够理解我们正在进行的评估。**意图**涵盖\
  \ *E1* 和 *E2*。**机会**包括 *E9* 和 *E10*。**能力**涵盖 *E3*、*E4*、*E5*、*E6*、*E7* 和 *E8*。\n\
  - 4. **对提供的证据进行诊断**：模板或 PARC ACH 工具允许分析师根据不一致性对假设和证据进行评级。这些级别包括 *II*，表示证据与假设 *高度不一致*；*I*，表示证据与假设\
  \ *不一致*；*NA*，表示证据与假设 *不适用*；*N*，表示 *中性*；*C*，表示证据与假设 *一致*；以及 *CC*，表示证据与假设 *高度一致*。\n\
  - 5. **设置每条证据的可信度和相关性**：可信度和相关性使分析师能够确定对证据价值的信心。可信度和相关性级别包括 *高（H）* – 具有高可信度或相关性的证据，*中（M）*\
  \ – 具有中等或适度可信度或相关性的证据，以及 *低（L）* – 具有低可信度或相关性的证据。\n- 6. **查看和评估生成的不一致性分数**：我们现在可以查看每个假设的不一致性分数并按从高到低对假设进行排序。不一致性分数最高的假设被认为是最佳假设。\n\
  \n上面从 *步骤 1* 到 *步骤 6* 生成的 ACH 显示在下图中。请注意，并非所有证据都适用于假设。因此，在必要时应使用 *不适用* 选项：\n\n|\
