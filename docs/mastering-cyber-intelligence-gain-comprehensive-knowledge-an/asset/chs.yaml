  \n(详细说明威胁情报报告将在内部和外部如何分发。)\n\n图 14.9 – 报告中的建议部分\n\n正如前面所解释的，报告的每个元素都有其自己的部分。此外，组织可以自定义其威胁情报报告模板。例如，对于内部生成的威胁情报，客户详情部分可以更改为组织详情。必须不断调整报告以适应您的受众。它必须解决受众或\
  \ CTI 使用者的要求和期望。\n\n## 威胁情报报告编写工具\n\n手动编写威胁情报报告可能具有挑战性，但并非不可能。自动化始终是效率和速度的关键。因此，CTI\
  \ 分析师可以利用安全报告工具来编写威胁情报报告。大多数 SIEM 工具和威胁情报平台 (TIPs) 都有报告模块（各种格式）。开源的恶意软件信息共享平台 (MISP)\
  \ 是具有报告模块的威胁情报和共享平台之一。其他安全工具，例如渗透测试工具、分析工具等，也可用于生成报告。确保您拥有一个工具（可以是 SIEM 系统的一部分）来帮助您创建情报报告。\n\
  \n威胁情报报告是证明 CTI 计划效益的关键推动因素。因此，它必须正确生成。报告必须创建和传播的频率取决于安全和业务目标和要求。建议尽可能自动化该过程以最大化时间和效率。在下一节中，我们将讨论提取对手信息和概况的方法。\n\
  \n## 构建和理解对手的活动\n\n假设您已执行威胁或入侵分析。分析师提出的两个问题是：我们如何命名威胁行为者？以及我们如何将它们与活动联系起来？活动构建和跟踪具有挑战性，尤其是在新检测到的威胁或活动的情况下。构建对手活动依赖于分析师的经验以及随着时间的推移进行的威胁和入侵分析。然而，对手活动提取的基础建立在以下几点之上：\n\
  \n- 过去的情报分析：为了提取对手名称和活动，您应该查看随着时间的推移的威胁分析或入侵分析。如果您的组织是 CTI 新手，您可能没有过去入侵的数据或报告。在这种情况下，您需要关注下一个要点。然而，随着您进行更多分析，您开始建立威胁情报语料库。\n\
  - **外部情报分析：** 您应该订阅外部情报源和分析（例如恶意软件数据、厂商报告、ISACs、安全新闻等）并建立威胁和入侵趋势。订阅与您组织威胁态势相关的情报——收集直接针对您和同一业务线组织的威胁行为者和活动概况。\n\
  - **过去的指标和数据：** 一旦您收集并分析了数据，请考虑 IOCs 和数据。通过交叉检查来自不同来源的收集的 IOCs 和数据来构建对手活动。\n- **行动方案：**\
  \ 您不仅仅收集威胁信息；您利用它来增强安全态势。这意味着您将该信息与内部数据相关联，以在系统中发现、检测、拒绝、破坏、降级、欺骗或摧毁对手活动。您可以使用不同的行动方案来命名您的对手。\n\
  - **未来入侵属性：** 行为 IOCs 可以很好地指示威胁行为者及其动机。他们如何发起访问？他们如何实现持久性？他们如何执行代码？他们针对哪些关键资产？通过了解他们的\
  \ TTPs，您可以预测一些攻击组件。因此，您可以确定可能在未来攻击您组织的对手。一些随着时间推移观察到的行为 IOCs 以及未来攻击的概率可以识别或定义对手组织和活动。\n\
  \n> **重要提示：用于活动构建的外部报告**\n> \n> 外部情报对于理解对手活动至关重要。然而，组织对归因对手活动有不同的标准。因此，建议您使用内部名称来识别相同的对手活动，如果您只跟踪该活动的话。如果不是，您可以使用公共名称，例如\
  \ APT19。您应该创建一个命名约定来推动活动识别和跟踪。\n\n例如，俄罗斯组织 *APT29*（由 Mandiant 和 FireEye 命名）被 SentinelLABS\
  \ (https://bit.ly/3HjVntD) 称为 *NobleBaron*，被 Microsoft (https://bit.ly/3sIlIV4)\
  \ 称为 *Nobelium*，并被 CrowdStrike (https://bit.ly/3FPkGTW) 称为 *Cozy Bear* 和 *CozyDuke*。\n\
  \n\n\n\n## 命名对手活动\n\n没有通用标准或规范控制对手活动或威胁行为者团体的命名。组织根据自身的惯例和标准来命名团体。如前所述，俄罗斯组织 APT29\
  \ 在不同组织中拥有不同的名称。威胁情报专家组织，例如 CrowdStrike、FireEye、Microsoft 等，使用特定的惯例来命名威胁行为者。然而，CTI\
  \ 分析师可以借鉴的最佳实践。命名对手时应避免的做法包括以下内容：\n\n- **工具的使用**：不建议使用工具、技术或流程来命名威胁行为者活动或团体，因为这些可能发生变化或被不同团体共享。\n\
  - **使用国家名称**：不建议使用团体所在国家，因为这也可能发生变化。\n- **使用重大外部事件**：也不建议这样做。组织可能会诱惑将入侵名称分配给活动或威胁团体。但如果该团体再次发动入侵会怎样？因此，不应将事件名称用作活动或团体名称。\n\
  \n强烈建议在命名活动或团体时不要使用会随时间变化的名称。相反，建议使用易于追踪和记忆但独一无二的名称。名称也不应过于揭示。\n\nFireEye 的 Mandiant\
  \ (https://bit.ly/317dnrM) 使用带数字的 APT 作为威胁团体的名称，这是最受欢迎的命名方式之一。示例包括俄罗斯组织 APT29 和\
  \ APT28、伊朗组织 APT39，以及中国组织 APT1、APT2、APT3 和 APT19。\n\n然而，你不必复制这些名称。只要易于追踪并与外部情报命名相关联，CTI\
  \ 团队就可以利用灵感为对手活动找到合适的名称。\n\n## 高级持续性威胁 (APTs) – 快速概述\n\n当我们谈论 **高级持续性威胁 (APTs)**\
  \ 时，我们指的是网络攻击的复杂程度。APT 使用先进技术来入侵即使是最安全的 IT 基础设施。过去，它们主要与国家支持的威胁行为者相关。然而，现在拥有相关资源的威胁行为者可以策划隐蔽攻击。APT\
  \ 的一些特征如下：\n\n- APT 的目标主要是 *高价值目标* 和 *大型企业*，包括但不限于 *政府* 和 *主要商业组织*，涉及金融、医疗保健、电信、技术、运输、制造等多个领域。然而，中小企业也不应轻视\
  \ APT。\n- 其动机包括但不限于 *数据窃取*、*间谍活动* 和 *运营破坏*。在大多数情况下，APT 窃取敏感信息、机密信息，或破坏系统以服务于某些议程。\n\
  - APT 攻击始终具有持续性 – *在较长的时间内*。攻击者意图窃取数据并在系统中长期潜伏，以便发起其他攻击——确保其操作的连续性。\n- 其广泛的攻击方法包括通过钓鱼活动进行\
  \ *社会工程学*、*渗透*（内部人员）以及 *人力情报*（例如，提供关键系统信息的员工）。凭借其资源，APT 还可以利用 *系统漏洞* 和 *零日漏洞*。\n\
  \n组织在面对 APT 时必须始终保持警惕。高级持续性攻击是通过一系列步骤实现的，如下图所示：\n\n![](img/d47f26598025b2da017dd41fcbb6e602_444_0.png)\n\
  \n图 14.10 – 标准 APT 攻击阶段\n\n前述步骤在以下要点中进行了解释：\n\n- 1. **获取初始访问**：APT 攻击者将尝试通过多种技术渗透你的组织，例如\
  \ spear-phishing、钓鱼和利用零日漏洞。此步骤是阻止攻击的最佳时机。超过此阶段后，阻止 APT 将变得棘手。\n- 2. **建立立足点**：一旦进入系统，APT\
  \ 攻击者会安装后门（或后门网络）并创建隧道，以便悄悄与受损系统交互。他们使用多态性和变态性等先进方法使恶意软件动态化并掩盖痕迹。\n- 3. **提升权限**：在建立立足点后，APT\
  \ 攻击者会使用多种方法获取管理员权限。他们使用漏洞利用、进程注入、修改以及许多其他技术来提升权限。\n- 4. **横向移动**：一旦 APT 攻击者获得管理员访问权限，他们可以将攻击扩展到其他系统（如服务器、工作站和第三方网络）。\n\
  - 5. **学习系统：** APT 攻击者执行内部侦察，了解系统并收集实现目标所需的任何信息。他们确定可以利用的漏洞。\n- 6. **实现持久性：** 与常规黑客攻击相比，APT\
  \ 的特点是能够在被发现前长期潜伏在受损系统中。APT 攻击者在系统重启后仍可控制系统。他们可以安装多个恶意软件以确保连续性。\n- 7. **执行行动：**\
  \ 最后，APT 攻击者可以实现其预期目标：窃取敏感数据。\n\n组织必须始终警惕 APT。它们并不容易缓解，尤其是当攻击者已建立立足点时。挑战在于使用多个后门，增加了他们重新获得对你系统访问的机会。防范\
  \ APT 需要不仅仅是监控、使用防病毒软件、入侵检测、入侵防御等，因为这些攻击的隐蔽性极强。威胁情报是打击 APT 的有效方式。\n\n## 追踪威胁行为者和团体\n\
  \n追踪威胁行为者（尤其是 APT）可能具有挑战性，特别是对于 CTI 入门级的一级组织而言。多家公司持续追踪它们并发布其信息。因此，对于一级组织和一些二级组织，建议使用公共框架作为监控对手团体和活动的起点。以下为一些流行的开源平台，可用于追踪并通过活动和团体增强你的威胁情报：\n\
  \n- **MITRE 团体追踪器：** MITRE 追踪团体、威胁行为者、入侵集合和活动中的对手活动。它是使用最广泛的威胁行为者追踪框架之一。最知名的威胁团体都可以在\
  \ MITRE 平台上找到 (https://attack.mitre.org/groups/)。它引用了大多数知名命名惯例。因此，你的组织可以将分析威胁与其他名称映射以追踪对手活动。\n\
  - **CrowdStrike 对手宇宙：** CrowdStrike 对手宇宙按行业和目标国家对对手信息进行分组。你可以根据业务领域和国家监控相关团体 (https://adversary.crowdstrike.com/en-US/)。\n\
  - **Mandiant APT 团体洞察：** Mandiant APT 团体洞察提供可用于追踪对手的 APT 和威胁行为者列表。Mandiant 使用流行的编号格式\
  \ APT1、APT2、APT28 等 (https://www.mandiant.com/resources/apt-groups)。\n\n用于追踪对手和活动的商业平台也存在。根据你组织的\
  \ CTI 级别和预算，你可以选择开源或商业平台。你必须确保追踪器持续更新——这是了解敌人的重要部分。一些现代 SIEM 工具和 TIP 包含威胁行为者追踪功能。\n\
  \n## 淘汰威胁情报和对手活动\n\n没有什么能永久运行，CTI 和对手活动也不例外。将会有时，情报团队必须评估该计划的有用性以及对手活动的消解。淘汰整个计划与使活动绝对化是不同的。然而，两者都可能产生业务影响后果，在淘汰任何一方之前必须考虑这些后果。分析师在\
  \ CTI 方面提出两个主要问题是：我们何时停止 CTI 计划？以及我们何时停止追踪对手活动？\n\n## 重新思考 CTI 计划\n\n只要 CTI 计划能够加强安全态势并优化安全运营，对组织就有帮助。当计划变得停滞时，其存在需要重新评估。然而，在讨论取消任务或重新思考威胁情报时，我们通常指的是取消特定的行动方案（杀伤链模型的\
  \ 7 个 D 中的一个或多个）。让我们以发现和检测行动方案为例。\n\nCTI 计划通过 IOC 和 IOA 帮助检测威胁和发现入侵。这种分析随后会与不同的团队共享，例如取证团队、事件响应团队和恶意软件分析团队。当出现以下情况时，应重新评估\
  \ CTI 计划和行动方案：\n\n- **它误导了 SOC：** 当 SOC 依赖威胁情报时，后者必须切实且准确。如果其输出误导 SOC 或对 SOC 没有价值，则应淘汰并重新思考。\n\
  - **它产生大量误报：** 误报是分析师最糟糕的噩梦，因为它们浪费时间。分析师必须执行系统检查以识别误报警报的原因。部署在误报警报上的资源无法收回。因此，当\
  \ SIEM 工具报告大量误报时，必须取消该行动方案（检测）并重新评估计划。\n\n\n\n-   **其服务变得影响业务**：组织的核心业务可能并非*安全*，除非它是安全服务提供商。因此，即使在威胁或攻击下，业务运营也必须得到保护和维持。如果威胁情报成为业务运营的绊脚石，就必须质疑其存在和结构。例如，需要银行长时间或数天关闭服务的缓解或反制措施流程应重新评估。\n\
  -   **其投资回报率难以证明**：威胁情报是高层安全决策的驱动力（例如，基础设施架构变更、系统、工具采购等）。然而，战略团队要投资 CTI，就需要了解其价值。如果后者无法简洁清晰地证明，该项目必须重新考虑。\n\
  \n通过反馈和生成的分析，CTI 团队应了解项目价值减弱的时机。它必须利用其专业知识找到重启项目和行动方案的方法和途径。然而，必须注意的是，被降优先级的行动方案不得完全从安全雷达中移除。*IOC\
  \ 和 IOA 必须保留以供历史参考*，以帮助未来追踪对手。想象一下停止检测威胁。\n\n## 对手战役的退役\n\n当对手的 TTP 被揭露时，在大多数情况下该战役不太可能继续。然而，战役背后的个人仍然存在，可以改变其\
  \ TTP 并发起其他战役。或者，他们可以消失很长时间，并在组织分心并将其排除在外时重新出现。因此，不应退役战役。它们应被归档或冻结，但仍需监控。建议您执行以下操作：\n\
  \n-   如果可能，永久存储对手战役信息。此过程至关重要，因为 CTI 团队可以将新战役的某些 TTP 映射到旧的 TTP，以跟踪在不同战役下运作的对手。\n\
  -   改变战役的状态而不是停止跟踪。例如，看似不活跃的战役可以置于休眠状态。CTI 团队有权选择处理被动战役的适当方式。\n\n威胁行为者，尤其是 APT 行为者，在追求目标时可能具有韧性。因此，组织必须始终关注不活跃的战役。\n\
  \n要构建战役，我们需要识别入侵和威胁的趋势。分析人员使用杀伤链和钻石模型执行入侵和威胁分析（请参阅 *第 10 章，威胁建模和分析 – 实际用例*）。随着时间的推移，这些模型的结果有助于构建情报库。基于\
  \ IOC 和 TTP，趋势可以是具体的、临时的或永久的。通过将入侵分析与外部数据相结合，您可以识别趋势数据中的清晰模式。此外，这些观察到的趋势是定义对手战役的关键要素。在下一节中，我们将讨论威胁情报共享。\n\
  \n## 传播威胁情报\n\n威胁情报需要共享以协同防御威胁和攻击——通过帮助组织适应不断变化的网络威胁态势来提高意识。CTI 必须及时共享，内部和外部均可，使用正确的内容和呈现方式。\n\
  \n不同消费者对情报的需求不同。这包括他们希望如何接收 CTI 输出。最受欢迎的情报传播方式如下：\n\n-   **应用程序编程接口 (APIs)**：这是最受欢迎的传播方法之一。它们构成了许多安全推送的基础。API\
  \ 大多被使用是因为它们可以轻松集成到 SIEM、IDS、IPS 和防火墙等安全工具中。通过 API（或推送）共享威胁情报更快、更高效。请注意，今天大多数情报\
  \ API 和推送都有良好的文档。因此，它们易于与其他内部工具集成。\n-   **个性化报告**：威胁情报输出可以作为针对目标受众需求量身定制的报告共享。个性化报告处理量较少，可立即使用。然而，CTI\
  \ 分析师必须考虑报告的结构、内容、消费者的水平以及他们希望报告的频率。\n-   **可共享和可搜索的存储库**：另一种传播情报的方法是创建所有分析的存储库并向消费者提供访问权限。消费者可以搜索恶意软件信息、IOC、IOA、对手等。公共数据库如\
  \ **VirusTotal** 和 **VirusShare** 就是公开可共享和可搜索存储库的两个例子。此外，您的组织可以创建可内部或外部使用的威胁存储库。\n\
  \n无论您选择哪种方法传播情报，都要牢记目标受众的需求。让我们来看一下威胁情报传播的一些考虑因素和挑战。\n\n## 情报传播的挑战\n\n共享情报并非没有挑战。这些挑战可能从组织的声誉到法律考虑不等。此外，威胁情报的两个终端用户（生产者和消费者）都可能面临这些挑战。它们包括以下内容：\n\
  \n-   **信任**：生产威胁情报需要大量努力。*CTI 团队与消费者之间必须建立信任，才能从中获得价值。* 信任可以通过技能、工作质量、可操作性以及 CTI\
  \ 团队与组织其余部分（或外部传播的社区）之间的持续沟通来建立和维护。然而，信任很难建立却很容易破坏。因此，CTI 团队必须保持高工作标准。\n-   **格式**：首先，组织生产威胁情报输出供内部使用。这意味着它们可能只生产适合其工具和系统的结果。共享威胁情报结果需要输出标准化——以促进互操作性。因此，一些组织可能需要将其格式转换为全球格式以便传播。然而，如今大多数\
  \ TIP 支持流行的共享格式。\n-   **敏感信息保护**：CTI 分析师共享在系统中发现或检测到的威胁和入侵分析结果。这些分析通常包含敏感信息，如姓名、IP地址、电子邮件地址、文档和安全日志。共享威胁情报输出时必须保护数据，因为敏感信息泄露可能对组织造成毁灭性打击。制定良好的信息共享政策至关重要。\n\
  -   **法律要求**：共享情报时，请考虑法律规定（例如，内部、地方、国家和国际（如有必要））。后者将维护共享中的隐私和协作。法律要求对于合法控制进出组织的信息至关重要。然而，法律程序和检查可能会在威胁情报传播中引入延迟。因此，您需要在法律规定和\
  \ CTI 共享之间取得平衡。\n-   **共享情报的评估**：在消费之前，共享情报的质量、准确性和可用性至关重要。并非所有共享的情报输出对您都有帮助。因此，在接收外部情报时，您需要评估其准确性和对您安全态势的适用性。\n\
  \n此处提供的挑战并非详尽无遗。组织可能因其地理位置、运营行业或业务线而面临其他挑战。CTI 分析师或团队应评估所有要求，以确保情报共享流程不附带风险。\n\n\
  ## 战略、战术和运营情报共享\n\n在传播情报时，了解目标受众以及应以何种格式向他们呈现数据至关重要。\n\n**战略消费者**，也称为业务经理和高级管理人员，专注于高层安全情报。战略情报使他们能够做出预算决策、资源分配和政策制定。他们主要是非技术人员（他们可能有或没有技术背景）。因此，战略情报必须以报告形式共享，提供*对安全态势和\
  \ CTI 在整体安全态势中的贡献的洞察*。您应突出*项目带来的收益*并证明投资回报率。请注意，战略情报不对外共享。\n\n**运营消费者**，也称为技术安全分析师，专注于在日常运营中使用情报。他们使用\
  \ IOC 来检测和响应威胁。他们采取适当的安全措施以确保系统持续受到保护（例如，更新安全规则、阻止恶意软件等）。他们非常技术化。因此，他们的情报报告应包含许多技术细节，包括\
  \ *IOC*、*攻击* 和 *战役*。由于他们立即消费产品并使用其内容，其情报可以以 API、YARA 规则、**结构化威胁信息表达** (**STIX**)\
  \ 和 **可信自动化情报信息交换** (**TAXII**)、OpenIOC 和 CSV 的形式共享。\n\n**战术消费者**专注于对手 TTP 以及对手如何攻击组织。他们识别安全态势中的漏洞并提出缓解步骤。因此，他们的情报输出必须包含详细的\
  \ *对手 TTP* 和 *缓解步骤*。它应包括对手执行战术时使用的 *威胁攻击向量* 和 *工具*（例如，他们如何访问系统、如何执行代码、如何绕过安全、如何提升权限以及如何实现对受损系统的命令和控制）。您可以通过报告或推送的形式共享战术情报。\n\
  \n\n\n组织或 CTI 团队应根据需求和受众决定共享格式。混合受众内容或向受众发送错误情报会降低其价值。\n\n## 威胁情报共享架构\n\n随着组织进入威胁情报传播阶段，了解共享架构至关重要。因为\
  \ CTI 具有协作性，组织和个人通常使用三种方法交换情报，如下图所示：\n\n![](img/d47f26598025b2da017dd41fcbb6e602_451_0.png)\n\
  \n图 14.11 – 威胁情报架构\n\n三种架构分别是集中式、点对点（P2P）和混合式，后者结合了前两种架构。\n\n以下几点解释了这三种架构：\n\n-\
  \ **集中式威胁情报共享：** 配置一个中央存储库来存储交换的情报。组织（或成员）将可共享的情报推送到中央存储，并拉取其他组织共享的情报。使用中央架构时，共享情报会被审查并与所有成员共享。因此，中央服务器越强大，分发情报的质量越好。虽然一些中央枢纽可用于直接情报分发，但其他枢纽可提供额外服务，例如评估共享信息、处理，以及与其他数据的关联和丰富。\
  \ 使用集中式方法的优点包括 (1) *统一的信息存储库*，便于维护和管理访问；(2) *维护标准格式* – 无需拥有多种共享格式；(3) *可靠性* – 如果某个成员的连接失败，其他成员不受影响，情报共享也不受影响；(4)\
  \ *成本效益高*，因为每个成员只需维护一个连接（或一对用于冗余的连接）；(5) *数据交换中冲突很少或没有*，因为成员仅连接到中央枢纽；并且 (6) *加入容易*，因为你只需连接到中央枢纽。然而，集中式共享架构也有其缺点，例如\
  \ (1) *单点故障*。如果枢纽故障，共享基础设施将停机，意味着成员无法访问共享情报。另一个缺点是 (2) *完全依赖中央存储库*。服务器的任何故障、延迟或攻击都会影响所有成员。大多数开源共享平台，如\
  \ AlienVault OTX，使用集中式共享架构。\n- **P2P 威胁情报共享：** P2P 威胁情报架构类似于网状网络配置。共享情报的组织直接连接到彼此的系统。每个组织在共享之前需要丰富其情报数据。\
  \ P2P 威胁情报共享架构的优点包括 (1) 组织之间 *更快、更直接的分发*，以及 (2) *没有单点故障*，因为成员的断开连接不会影响其他共享组织 – 冗余。\
  \ P2P 的缺点包括 (1) *多种格式*：即如果没有商定共享格式，适应所有格式就会变得困难。 – 一个成员必须理解其他成员的数据格式。此外，还有 (2) *成本问题*，由于扩展。随着成员数量增加，扩展系统的成本也会增加。每个成员都需要为新成员添加连接。\
  \ P2P 威胁情报架构仅适用于少数组织群体。\n- **混合威胁情报共享：** 混合威胁情报共享架构结合了前两种架构的优点。中央枢纽充当催化剂，执行身份验证、访问管理、请求处理等管理任务。混合架构的主要优点是\
  \ *冗余*。情报可以直接与对等方共享并保存在中央存储库中。然而，*成本可能是此类实施的障碍*。混合架构适用于三级组织（拥有成熟 CTI 项目）。\n\n选择架构时，CTI\
  \ 分析师必须考虑威胁情报和业务需求、预算以及希望加入的共享社区。加入 ISACs 等社区可以使组织受益。然而，还有其他需要考虑的事项，例如访问控制、成员数量、共享的情报类型、会员费用、情报保留期、运营行业，最重要的是适用的条款和条件。例如，加入政府主导的\
  \ CTI 共享组可能会带来额外的挑战、条款和条件（安全许可、机密数据等）。分析师在传播或选择威胁情报社区时需要评估所有参数。\n\n*只要协议、数据和成员的专业知识与其实体目标一致，组织可以加入一个或多个威胁情报共享社区。对于初创和一级组织，建议您从具有开源存储库的集中式威胁情报架构开始。然后，如果必要，逐步迁移到混合情报共享架构。*\n\
  \n## YARA 规则和威胁情报共享格式\n\n**Yet Another Recursive Acronym (YARA)** 是流行的开源工具，用于恶意软件和威胁检测、分类和共享（https://bit.ly/3eLZD99）。它是一个多用途工具，可以被恶意软件分析师、威胁情报分析师和事件响应分析师利用。对于\
  \ CTI 分析师，YARA 的规则可用于创建 IOC 并定义要与其他分析师共享的分析属性（例如元数据、标题等）。以下是 YARA 的一些特征：\n\n- 它依赖模式匹配来检测和发现恶意软件家族。YARA\
  \ 的主要用途是恶意软件分析和检测。\n- 其规则可以集成到安全工具中，例如 SIEM 工具、TIPs 和入侵检测系统，以检测、阻止和传播恶意软件签名和 IOC。多个安全工具支持\
  \ YARA 创建自定义规则，包括 MISP（一个开源威胁情报平台）。\n- 它与流行的 IOC 共享格式兼容，例如 STIX、TAXII 和 **Cyber\
  \ Observable Expression (CyBox)**。分析师可以使用 YARA 扫描系统以查找恶意软件入侵。\n- 它可以安装在 Unix（Linux\
  \ 和 OS X）和 Windows 工作站上并支持终端执行。\n- 其规则易于编写和共享。\n\n以下片段展示了 YARA 规则的示例（https://bit.ly/3eOE8V4）。YARA\
  \ 的结构与 C 编程语言类似：\n\n```\n/*\n    A YARA multi-line comment\n*/\nrule ExampleRule\
  \ //An example rule to show YARA structure\n{\n    strings:\n        $my_text_string\
  \ = \"text here\"\n        $my_hex_string = { E2 34 A1 C8 23 FB }\n        $my_regex_str\
  \ = /md5: [0-9a-zA-Z]{32}/\n    condition:\n        ($my_text_string or $my_hex_string)\
  \ and $my_regex_str\n}\n```\n\n语法结构可以描述如下：\n\n- The `rule` identifier: 这是 `rule`\
  \ 的名称。它在编程中充当函数。它开始每个 YARA。规则包含两部分（`strings` 和 `condition`）以及元数据的可选组件。元数据用于添加描述、标题和其他描述性信息。\n\
  - The `strings` section: 这定义了要搜索的字符串。字符串可以用作 *文本*（在双引号中）或 *十六进制*（在大括号中）。每个字符串变量以\
  \ $ 字符开头。十六进制字符由空格分隔。 YARA 字符串有三种类型：（1）*十六进制* 字符串，可以对未匹配的字节使用通配符；（2）区分大小写的 *文本*\
  \ 字符串 – 在字符串末尾使用 `nocase` 可使其不区分大小写；以及（3）用于匹配任何字符字符串的正则表达式。它们必须用正斜杠括起来。\n- The `condition`\
  \ section: 这是每个 YARA 规则所必需的。它使用布尔表达式和算术指示规则何时必须向我们发出警报。此外，它包含规则的逻辑。\n\n\n\nA string\
  \ can be an IP address, a domain name, or a specific hash value. A regular expression\
  \ (regex) can be a URL or a mutex pattern. You can count the number of times a string\
  \ variable appears in the file.\n\nUnderstanding the essential components of a YARA\
  \ rule is fundamental for writing and interpreting them. However, more complex rules\
  \ can be created (including global and private rules and modules). Once a YARA rule\
  \ has been created, it can be uploaded to the security tools for IOCs and malware\
  \ scanning.\n\n> **重要提示：面向 CTI 分析师的 YARA**\n> YARA 对于事件响应分析师和恶意软件分析师至关重要。CTI 分析师不必是编写\
  \ YARA 规则的专家。然而，他们必须能够编写简单的规则并理解复杂的规则以实现系统集成。\n\n*第 15 章，威胁情报共享与网络活动归因 - 实际用例，*\
  \ 涵盖了使用 YARA 规则进行恶意软件检测和 IOC 创建的实际用例。有关 YARA 的更多信息，请访问可在网站上找到的官方文档 (https://yara.readthedocs.io/en/v3.5.0/index.html)。\n\
  \n其他流行的威胁情报共享格式包括以下内容：\n\n- **结构化威胁信息表达 (STIX)**：这是一种用于威胁情报交换的开源语言 (https://bit.ly/3eOODYs)。STIX\
  \ 在 *第 4 章，网络威胁情报技艺与标准* 中有所介绍。另一个有用的用例在 *第 15 章，威胁情报共享与网络活动归因 - 实际用例* 中有所介绍。\n-\
  \ **可信自动化指标信息交换 (TAXII)**：这是一种使用 HTTPS 进行网络威胁信息（STIX 格式的 CTI 信息）通信的协议。TAXII 也在 *第\
  \ 4 章，网络威胁情报技艺与标准* 中有所介绍。\n- **网络可观测表达 (CybOX)**：这是一种用于共享和传达网络可观测物的结构化语言 (https://cyboxproject.github.io/)。请注意，CyBox\
  \ 已集成到 STIX 2.0 中。\n\n- **恶意软件属性枚举与表征 (MAEC)**：这是一种社区开发的用于共享恶意软件信息的结构化语言 (`https://maecproject.github.io/about-maec/`)。MAEC\
  \ 的优势包括 (1) 改善反恶意软件信息的沟通，(2) 减少分析重复，因为它可以确定特定恶意软件是否已被分析，(3) 在分析公开时增强对恶意软件的全球认知，(4)\
  \ 使恶意软件分析过程更快。它被称为 *非签名恶意软件分类语言*。此外，它使用 JSON 格式，将所有恶意软件可观测物作为属性。\n- **通用攻击模式枚举与分类\
  \ (CAPEC)**：这是指一个开源的常见攻击模式目录 (`https://capec.mitre.org/`)。该目录提供了一个详细说明相关攻击并与社区共享的模式。一些攻击模式包括\
  \ SQL 注入、跨站脚本、会话固定、HTTP 响应拆分等。\n\n前述格式被称为 MITRE 格式。现代 SIEM 工具和 TIP 支持大多数威胁情报共享格式。然而，如果组织使用自定义格式，CTI\
  \ 分析师（或 CTI 团队）应能够将其解析为更标准的格式。他们可以采用自动化技术或手动脚本。\n\n## 一些信息共享与协作平台\n\n威胁情报共享平台促进组织之间的情报传播。虽然大型企业（即三级组织）可以建立情报共享基础设施，但一级和二级组织可以利用现有平台。大部分可用的共享平台由安全社区和厂商支持和维护。一些流行的开源\
  \ TIP 包括以下内容：\n\n- **MISP** (`https://www.misp-project.org/`)：这是最常用的开源威胁情报和共享平台之一。由欧盟共同赞助，MISP\
  \ 用于收集、共享、存储和关联不同网络攻击中使用的 IOC。MISP 在 *第 5 章，目标设定、CTI 策略程序和实际用例* 以及 *第 10 章，威胁建模和分析\
  \ - 实际用例* 中有所介绍。然而，更多信息可在官方 MISP 网站上找到。\n- **AlienVault OTX** (`https://otx.alienvault.com`)：该开源威胁情报平台由\
  \ AT&T Cybersecurity 创建。AlienVault OTX 在 *第 12 章，SIEM 解决方案和情报驱动的 SOC* 中进行了介绍。\n\n\
  - **Blueliv 威胁交换网络** (https://community.blueliv.com/)：这是一个用于共享 IOC 以进行威胁防护的网络平台。它包含网络威胁地图、恶意软件沙箱、用于与内部系统集成的\
  \ API，以及提供威胁行为者活动和画像的时间线。以下屏幕截图中显示了一个示例：\n\n![](img/d47f26598025b2da017dd41fcbb6e602_457_0.png)\n\
  \n图 14.12 – Blueliv 威胁交换网络时间线\n\n该系统是开源的。因此，您可以注册并探索威胁交换平台的功能。\n\n- **Anomali STAXX**\
  \ (https://www.anomali.com/resources/staxx)：这是一款提供 STIX/TAXII 数据源便捷访问的工具。STAXX 可从\
  \ Anomali 官方网站下载并通过五个简单步骤设置：(1) 下载 STAXX OVA 文件并将其导入虚拟机环境。(2) 使用配置向导设置 STAXX。(3)\
  \ 使用工具的向导配置 STIX/TAXII 源。(4) 选择情报源。(5) 设置情报数据更新计划，工具即可使用。\n\n- **Cyware 威胁情报交换**\
  \ (https://cyware.com/ctix-stix-taxii-cyber-threat-intelligence-exchange)：这是一款具有摄取、分析、丰富和共享功能的客户端-服务器\
  \ TIP。它支持所有已知的情报共享格式，包括 STIX（1.0 和 2.0）、MISP、CybOX、MAEC、YARA、PDF、电子邮件和基于文本的格式。\n\
  \n组织也可以利用商业共享平台进行传播。其他情报共享平台包括 IBM X-Force Exchange（免费和商业版）、McAfee Threat Intelligence\
  \ Exchange、ThreatConnect、ThreatExchange 和 YaraShare。\n\n## 威胁情报反馈循环\n\n用户反馈对 CTI\
  \ 项目的成功至关重要。CTI 团队必须确保威胁情报创建者与客户之间保持持续的反馈循环，因为它能改善您的威胁情报项目。反馈过程必须是 *互动的* 和 *协作的*。它应该是互动的，因为\
  \ CTI 团队必须能够质疑客户的评论，而后者可以提供改进建议。双方必须相互倾听。它应该是协作的，因为反馈需要参与项目的意愿。CTI 团队必须确保客户了解他们的评论和意见有多么宝贵。让我们讨论一下为\
  \ CTI 项目获取反馈的好处。\n\n## 了解 CTI 反馈循环的好处\n\n反馈循环是一种需要在上下文中理解的机制。如今，一些组织引入了社会工程演练（或练习）的概念，例如，用于识别可能成为社会工程攻击（最常用的初始访问手段）受害者的员工。然后，他们为其组织培训。其他组织使用问卷（或调查）来获取用户的反馈。威胁情报是一个循环过程——随着威胁形势的演变，CTI\
  \ 项目也应随之演变。因此，反馈对于 CTI 的发展至关重要。那么，*为什么威胁情报反馈很重要？* 对此问题的回答在以下几点中给出：\n\n- **丰富情报需求**：情报反馈用于重塑项目的交付成果。它表明\
  \ CTI 项目是否令人满意。因此，CTI 团队利用情报反馈来设定新需求。\n- **提高 CTI 准确性**：反馈帮助 CTI 团队评估项目的有效性。该项目对消费者来说有多大可操作性？该项目是否有助于改善组织的安全态势？\n\
  \n\n\n- **指导数据收集**：威胁情报反馈可识别已收集数据中的任何差距。不同团队可以指出所收集的数据是否充分。\n- **帮助评估项目**：威胁情报反馈帮助\
  \ CTI 团队评估整体项目。\n\n威胁情报反馈可以作为不同章节添加到情报报告中。此外，它可以作为战略报告的一部分使用——向战略团队展示该项目的可操作性和质量。CTI\
  \ 团队不应削弱消费者对该项目的意见。\n\n## Methods for collecting threat intelligence feedback\n\n\
  没有标准的收集威胁情报反馈的方法。CTI 团队应了解受众并制定适当的方法来收集消费者的意见和评论。威胁情报分析师使用的一些方法包括以下内容：\n\n- **报告中的\
  \ URL 链接**：CTI 团队在报告内添加反馈部分并提供评论和意见的链接。该方法更适用于电子生成和分发的报告——组织创建平台让消费者下载最新的 CTI 报告并留下反馈。\n\
  - **每次威胁情报分析后的安全调查**：CTI 团队可以收集关于单个威胁或入侵分析案例的反馈，然后将其汇总为全局反馈。该方法被称为 *部分反馈收集*。它具有很大的价值，因为它可以帮助分析师即时调整需求、添加更多数据并增强分析流程。\n\
  \n> **重要提示：反馈时机**\n> 虽然威胁情报反馈对项目改进至关重要，但其时机（时间要素）必须最优且务实。如果消费者提供反馈的时间过长，后者可能不再能有效重塑项目。例如，对于每月生成的威胁情报战略报告，应适用两周的时间，给团队足够的时间调整需求。然而，如果战略团队在报告上提供其观点的时间超过一个月，则下一份报告将不会有反馈。\n\
  \n无论使用何种方法，威胁情报反馈都应促进生产者和消费者之间的协作和互动。此外，应对消费者的响应应用适当的时机，以保持 CTI 项目的有效性。\n\n## The\
  \ threat intelligence feedback cycle – use case\n\n假设您已生成一份威胁情报报告并通过网络链接与 SOC 团队的其余成员共享。反馈循环如下：\n\
  \n1. 蓝队 *访问* 月度战术报告并打算用它来更新系统防御，包括防火墙、端点和入侵防御系统规则（使其具有可操作性）。\n2. 蓝队意识到所生产的情报不够及时，因为某些\
  \ IOC 和对手战役已被退役。他们以 *简便* 且 *易于理解* 的方式向 CTI 团队提供此信息。\n3. 蓝队通过解释非更新情报输出的 *后果* 来 *扩展第二点*，例如无法监控最近的威胁和攻击。此时，CTI\
  \ 团队拥有足够的信息来重塑需求。例如，他们将从月度情报改为每周或双周报告。\n4. 蓝队从第 1 点（反馈循环）重新开始。\n\n这里描述的循环为 CTI 收集反馈提供了一种直接的方法。我们随后可以总结反馈流程，如下图所示：\n\
  \n![](img/d47f26598025b2da017dd41fcbb6e602_460_0.png)\n\nFigure 14.13 – The threat\
  \ intelligence feedback loop cycle\n\n威胁情报反馈循环在 CTI 项目中至关重要。您需要确保所生产的 CTI 具有可操作性并使所有消费者受益。做到这一点的最佳方式是确保所有消费者满意并且项目投资回报率可以得到证明。CTI\
  \ 流程是一个闭环。只要项目处于活跃状态，就必须考虑消费者的反馈。因此，反馈流程也成为一个闭环。\n\n## Summary\n\n威胁情报报告对于确保 CTI\
  \ 项目使组织受益并且所有相关方都了解组织面临的威胁和攻击至关重要。报告必须根据接收者的需求进行定制。随着情报的创建，它需要内部和外部传播——威胁情报是一个协作和互动的主题。因此，建议您加入一个或多个共享社区。然而，您应根据支持、维护、推送和拉取请求、成本、条款和条件等因素评估想要加入的社区。\n\
  \n本章介绍了威胁情报报告，讨论了 CTI 分析师应考虑的情报报告类型。它讨论了如何使报告具有价值并使用简单模板创建报告。然后，它详细介绍了如何理解和构建对手战役、追踪威胁行为者、退役战役以及退役\
  \ CTI 行动方案。它提供了 APT 的全球概述。最后，它讨论了威胁情报传播的细节以及反馈循环在 CTI 中的重要性。\n\n尽管报告、传播和反馈被认为是 CTI\
  \ 的最后阶段，但必须理解 CTI 是一个循环过程。因此，最后阶段为下一周期的第一阶段提供输入。\n\n在下一章中，我们将使用实际案例研究威胁情报共享和 IOC\
  \ 构建。\n\n## 15 Threat Intelligence Sharing and Cyber Activity Attribution – Practical\
  \ Use Cases\n\n## Threat Intelligence Sharing and Cyber Activity Attribution – Practical\
  \ Use Cases\n\n共享威胁情报已被证明对安全社区有益，帮助组织在战略、战术和运营层面受益。情报可以通过多种方式和格式共享。**网络威胁情报 (CTI)**\
  \ 分析师或团队必须能够起草威胁情报报告并为内部和外部传播准备输出。在进行威胁情报时，他们应了解如何从分析中构建威胁活动组和战役。对网络领域中国家或国家支持的行动者影响以及高级网络犯罪分子的威胁的认识，对于追踪最复杂的网络活动至关重要。之前的攻击和入侵表明，国家支持的行动者可以针对私人机构。因此，CTI\
  \ 分析师或团队在必要时应能够进行 **竞争假设分析 (ACH)** 并将威胁和攻击归因于国家支持的行动者。\n\n本章重点介绍实用的威胁情报共享方法以及如何将网络活动归因于战役、威胁组织或威胁行为者。它为分析师配备了开发和共享\
  \ **入侵指标 (IOCs)** 以增强内部安全并进行外部传播的实用技能。它还为分析师提供了威胁追踪的知识。\n\n到本章结束时，您应该能够做到以下几点：\n\
  \n- 使用 YARA 规则开发或发现 IOC 并用它们检测和阻止攻击。\n- 设置 Anomali STAXX，一种基于 **结构化威胁信息表达/可信自动化情报交换\
  \ (STIX/TAXII)** 的开源情报分发平台。\n- 使用威胁情报共享平台进行情报共享。\n- 从威胁分析中构建活动组并将分析与每个组关联。\n- 进行\
  \ ACH 将网络活动归因于国家支持的组织。\n\n在本章中，我们将涵盖以下主要主题：\n\n- 创建和共享 IOC\n- 理解和执行威胁归因\n\n## Technical\
  \ requirements\n\n此用例使用 **SANS 调查取证工具包 (SIFT) 虚拟机 (VM)**。它可以安装在 **VirtualBox 或 VMware**\
  \ 上。或者也可以使用 Ubuntu 机器。SIFT 的下载和安装步骤可以在官方网站上找到：https://www.sans.org/tools/sift-workstation/。\n\
  \n*第 10 章，威胁建模和分析 – 实用案例* 中执行的分析及其工件也是必需的。\n\n## Creating and sharing IOCs\n\n让我们考虑在\
  \ *第 10 章，威胁建模和分析 - 实用案例* 中执行的入侵分析，其中显示了简化的杀伤链发现操作。分析期间提取的其他一些指标包括 `executable.1640.exe`\
  \ 的哈希值，`12cf6583f5a9171a1d621ae02b4eb626`，以及 `resoh.ru` 域名：\n\n| 阶段 | 发现 |\n|---|---|\n\
  | 侦察 | 网站页面：event-mogul/about 页面。LinkedIn、Twitter。电子邮件地址及研究 affiliations |\n| 武器化\
  \ | research_tech.pdf (嵌入式 JavaScript) |\n| 投递 | 钓鱼 (email)。194.150.215.153 |\n\
  | 利用 | 挂钩运行进程 (explorer.exe) |\n| 安装 | read_sl.exe (在 explorer.exe 上), executable.1640.exe,\
  \ ~/.exe (outlook 临时文件夹) |\n| 命令与控制 (C2) | 125.19.103.198 Sys/files/ |\n| 行动 | 46.168.5.140,\
  \ 数据外泄 - FTP, HTTP POST/GET (RAR docs project cobra), C0d0s123 (密码) |\n\n图 15.1\
  \ – 入侵分析的简化版网络杀伤链模型\n\n分享威胁情报使网络威胁的防御更有效。在成功分析后，CTI 分析师应选择正确的格式和平台在内部和外部传播结果。本节介绍\
  \ IOC 共享以及使用 YARA 检测恶意流量。\n\n## 用例一 – 使用 YARA 开发 IOC\n\nYARA 常用于恶意软件检测和流量监控。其结构已在第\
  \ 14 章，威胁情报报告与传播中介绍。CTI 分析师应熟悉基本的 YARA 规则及其应用。本用例帮助 CTI 分析师熟悉使用 YARA。\n\n**用例场景：**\
  \ 你为 ABC 公司进行了入侵分析并识别出与攻击相关的 IOC。战术团队要求你创建一个 YARA 规则以在未来检测类似攻击和恶意软件。\n\n**用例目标：**\
  \ 本用例的目标是练习针对 IOC 生成和验证 YARA 规则以保护系统。完成此练习后，你应能够编写可在特定条件下检测网络事件的规则。\n\n解决本用例的步骤如下：\n\
  \n- 1. **确保 YARA 正常工作：** 登录 SIFT VM（或 Ubuntu 机器）并测试 YARA。测试 YARA 的基本方法是创建一个虚拟规则。打开终端并执行\
  \ echo \"rule <rule name> { condition: true}\" > <yaratest_rule>，然后执行 yara <rule\
  \ name> <rule name> 命令。输出显示在下图中：\n\n![](img/d47f26598025b2da017dd41fcbb6e602_466_0.png)\n\
  \n图 15.2 – 测试 Yara 规则 – 示意图\n\n输出显示 yaratest 规则与 yaratest_rule 文件匹配。如果未安装该工具，请在终端执行\
  \ sudo apt install yara 命令。使用 yara --help 命令查看可为 YARA 规则配置的语法和选项。一般语法如下所示：\n\n```\n\
  yara [Option]... [Namespace:]rules_file... File | Dir | PID\n```\n\n- 2. **创建规则以检测\
  \ IOC：** 我们创建规则以检测以下 IOC：46.168.5.140 和 125.19.103.198 IP 地址以及 12cf6583f5a9171a1d621ae02b4eb626\
  \ MD5 哈希。使用文本编辑器创建规则并将其保存为 .yara 文件，如下图所示：\n\n![](img/d47f26598025b2da017dd41fcbb6e602_466_1.png)\n\
  \n图 15.3 – 入侵检测的 Yara 规则代码\n\n该规则定义了三个变量、两个 IP 地址和 ddraw.dll 字符串。条件定义为如果任何字符串与流量文件、内存转储、文件或进程匹配，则应生成警报。\n\
  \n- 3. **针对内存转储验证规则：** 我们使用在 *第 10 章，威胁建模与分析 – 实际用例* 中执行的入侵分析的内存转储。执行以下命令：\n\n```\n\
  yara -s analysis.yara memorydump.vmem\n```\n\n命令和输出显示在下图中：\n\n![](img/d47f26598025b2da017dd41fcbb6e602_467_0.png)\n\
  \n图 15.4 – YARA 规则针对内存转储验证的说明\n\n-s 选项用于打印匹配的字符串。可以在搜索时添加 nocase 参数以移除大小写敏感性。字符串搜索的另一个重要参数是\
  \ wide 属性。它允许在字符串以每个字符两个字节编码时仍进行搜索。\n\n输出显示 YARA 规则中的指标与内存转储中的指标匹配。它还提供了扫描文件中内存地址。我们可以看到\
  \ 125.19.103.198 已位于两个不同的内存地址 0xc00887f 和 0xc08a778 中，并且 ddraw.dll 字符串可在六个不同的内存地址上找到。现在，我们知道该规则将在内存中检测到这些\
  \ IOC。\n\n- 4. **针对文件验证规则：** 我们测试规则根据哈希值检测恶意文件。我们使用来自 *第 10 章，威胁建模与分析 – 实际用例* 的\
  \ executable.1640.exe 文件。执行以下命令：\n\n```\nyara -f analysis.yara forensic_files/\n\
  ```\n\n输出显示在下图中。\n\n```\njovan@siftworkstation: ~/Downloads\n$ yara -f analysis.yara\
  \ forensics_files/\nintrusion_detection forensics_files//executable.1640.exe\nintrusion_detection\
  \ forensics_files//1640.dmp\nintrusion_detection forensics_files//memorydump.vmem\n\
  ```\n\n图 15.5 – YARA 规则针对目录验证的说明\n\n-f 选项用于快速扫描并匹配字符串。如果当前目录是要扫描的目录，请使用 yara -f\
  \ . 命令。我们可以看到规则已检测到三个包含与条件匹配的部分的文件。请注意，可执行文件位于内存转储和 1640.dmp 文件中。现在，我们可以确定我们的 YARA\
  \ 规则将检测到恶意文件。\n\n> **重要说明 – 规避技术**\n> 诸如 **高级持续性威胁 (APTs)** 之类的威胁采用复杂的规避技术。成功攻击和数据泄露的增长证明，包括防病毒、入侵检测和防火墙在内的安全系统可能无法检测到恶意软件和\
  \ IOC。因此，建议更新 YARA 规则数据库，频繁扫描系统以查找 IOC，并确保 *CTI 程序有效。*\n\n作为 CTI 分析师，你已学习如何使用 YARA\
  \ 创建 IOC 并对其进行验证。建议在投入生产前先验证规则。对于更复杂的 YARA 规则、使用库和外部文件以及使用 Python 进行自动化，请参阅官方文档页面：https://bit.ly/3tZxggj。\n\
  \n## 用例二 – 使用 Anomali STAXX 共享情报\n\nAnomali STAXX 基于 STIX 和 TAXII 共享标准。它已在上一章中介绍，其中包含作为独立基础设施安装平台的基本步骤。我们将在本用例中研究\
  \ CTI 分析师如何利用 STAXX 执行情报共享。\n\n**用例场景：** ABC 公司希望你为与严重依赖 STIX/ TAXII 标准的其他组织建立威胁情报协作而设置\
  \ STAXX 基础设施。此外，CTI 经理希望你使用已安装的基础设施发布之前的入侵分析的输出。\n\n**用例目标：** 本用例的目标是熟悉 STAXX 平台并使用广泛使用的\
  \ STIX/ TAXII 标准发布和共享威胁情报。Anomali STAXX 促进威胁情报的共享和收集。\n\n用于解决本用例的步骤如下：\n\n- 1. **下载\
  \ STAXX OVA 文件：** 从网站 (https://bit.ly/3nZcBoO) 下载 STAXX **开放虚拟设备** (**OVA**) 文件并将其保存到本地计算机。\n\
  - 2. **导入并配置 STAXX VM：** 将 OVA 文件导入虚拟化环境。本例中我们将使用 VirtualBox。成功导入设备后，启动 VM。控制台用户名和密码分别为\
  \ anomaly 和 anomalistaxx。你将在首次登录时被要求更改密码。控制台窗口显示在下图中：\n\n![](img/d47f26598025b2da017dd41fcbb6e602_469_0.png)\n\
  \n图 15.6 – 成功安装后 Anomali STAXX 控制台窗口\n\n请注意访问链接：https://10.0.2.15:8080。10.0.2.15\
  \ 是 VM **网络地址转换 (NAT)** 适配器 IP 地址。它不能通过主机直接访问。你应通过导航到 **VM | 网络 | 适配器 1 | 高级 | 端口转发**\
  \ 来启用 NAT 端口转发。添加规则，如下图所示，然后单击 **确定** 完成配置：\n\n![](img/d47f26598025b2da017dd41fcbb6e602_470_0.png)\n\
  \n图 15.7 – STAXX VM 的端口转发配置\n\n或者，你可以使用 *桥接适配器* 设置代替 NAT 以允许主机和 VM 之间直接通信。\n\n-\
  \ 3. **访问 Web 界面：** 打开 Web 浏览器并导航到 https://127.0.0.1:8383，接受证书消息，你应被重定向到如下图所示的 Anomali\
  \ STAXX 平台登录页面。用户名和密码分别为 admin 和 changeme，你将在首次登录时被要求更改密码：\n\n![](img/d47f26598025b2da017dd41fcbb6e602_471_0.png)\n\
  \n图 15.8 – Anomali STAXX 威胁情报平台的登录页面\n\n登录后，欢迎页面会显示 STIX/TAXII 服务器配置向导，我们将在下一步中进行探索。\n\
  \n4. 配置 STIX/TAXII 服务器：您可以配置自己的 STIX/TAXII 服务器，如果您有的话。或者，您也可以使用 Anomali 的默认 STIX/TAXII\
  \ 服务器 LIMO。单击 USE ANOMALI LIMO 并根据系统配置检查或取消选中代理服务器配置。在本练习中，我们将保持未选中状态，如以下屏幕截图所示：\n\
