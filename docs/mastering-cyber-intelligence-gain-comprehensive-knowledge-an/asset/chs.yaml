  \n## 移动安全威胁与对策\n\n安全威胁在移动设备上可能与传统端点不同，这是由于架构调整所致。例如，与笔记本电脑相比，移动设备与内核的交互并非直接的。相反，用户需要通过各种应用程序来与设备操作系统交互。因此，我们可以将移动安全威胁分为以下三类：\n\
  \n-   **基于内核的威胁**：这些威胁发生在操作系统功能（权限、root 应用程序等）发生有意或无意更改时。例如，对移动端点进行 root 或越狱以访问操作系统核心会使设备容易受到网络攻击。*因此，您必须强制执行限制已\
  \ root（或越狱）移动设备访问网络的策略。*\n-   **基于应用程序的威胁**：网络钓鱼同样适用于移动设备，移动应用程序对资源的访问权限各不相同。如果您向武器化应用程序授予敏感数据访问权限，不仅您的设备会成为受害者，您连接的任何网络都将面临风险。因此，您必须*强制执行用户如何管理和授予应用程序权限的策略*（这可以通过教育实现）。系统必须识别*存在安全风险的移动设备*（获取其\
  \ **标识符 (IDs)**、**国际移动设备身份码 (IMEI)**、型号、制造商等）。系统应能够*在风险较高时阻止此类设备。*\n-   **社会工程和网络威胁：**\
  \ 社会工程学将始终是最有效的攻击手段之一，即使针对移动设备也是如此。下载恶意文件并在克隆网站上输入凭据可能会让攻击者获得访问权限。另一种访问设备的方式是通过网络攻击。攻击者可以通过访问企业无线网络（例如使用\
  \ **中间人攻击 (MITM attack)**）来收集端点信息。因此，您必须*对员工进行安全最佳实践的教育并强制执行 LAN 和 WLAN 网络保护（无线保护访问\
  \ 2-企业版 (WPA2-Enterprise) 或最新的 WPA3 加密）*。当使用开放接入点时，确保员工无法通过其访问其他网络。\n\n移动设备[content]\n\
  -   **支持所有端点类型**：端点管理必须涵盖所有可以连接到网络的设备类型（笔记本电脑、打印机、智能手机、智能设备、平板电脑、电子板、工业机器等等）。此外，还必须涵盖物理和虚拟端点。\n\
  -   **支持所有操作系统**：虽然 Windows 仍是最流行的操作系统，但有效的端点管理系统必须涵盖所有操作系统（Windows、Linux、macOS、Android、iOS）。它还必须针对定制和个性化的操作系统或软件进行调整。\n\
  -   **促进补丁管理**：确保可以使用系统强制执行软件补丁，并且涵盖所有主要补丁。\n-   **保持用户灵活性**：虽然端点管理系统对网络设备强制执行策略和标准，但它不得损害用户在其设备上工作的能力。虽然主要目标仍然是以尽可能低的成本加强安全，但操作必须保持高效。\n\
  -   **识别并提醒不合规情况**：确保端点系统识别不符合贵组织政策和行业法规的设备。最极端的情况下，它必须自动解决合规问题或提醒安全或 IT 团队。\n-\
  \   **与其他平台集成**：构建有效防御的思路是避免不同的安全组件各自为政。因此，端点管理系统必须具备与 SIEM、TIP、监控系统等其他 IT 系统无缝集成的能力（使用\
  \ **应用程序编程接口 (API)** 或自定义连接）。此外，SIEM 或 TIP 必须作为所有安全平台的集中式系统运行。\n\n投资端点管理系统可能成本高昂；因此，成本因素必须始终考虑在内，尤其是对于预算有限的组织而言。组织可以根据功能和需求获取一个以上的端点管理系统。当使用多个平台时，确保集成和互操作性得以保持以便于维护和支持。以下章节将介绍移动端点管理以及它与端点管理系统有何不同和挑战。\n\
