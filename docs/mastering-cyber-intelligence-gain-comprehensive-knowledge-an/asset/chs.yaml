  \n我们已展示如何通过主机 pivot 以发现不同的 COAs。然而，像“恶意软件是如何访问系统中的数据？”或“外泄了哪些特定数据？”等重要问题也需要得到解答。\n\
  \n## 内存和磁盘分析\n\n在此任务中，我们通过主机 pivot 以提取有关入侵的信息。\n\n内存和磁盘分析是取证流程，其中分析设备的内存（随机存取存储器，即\
  \ RAM）和存储以提取证据来解决网络犯罪。这些任务通常由取证团队执行。然而，CTI 分析师需要了解取证流程的基础知识。\n\n## 深入主机操作\n\n此操作所需的一些操作包括逆向工程恶意软件、分析\
  \ C2 通道行为以及在公开或外部情报上进行 pivot。深入网络对于了解入侵是如何实现的至关重要。\n\n我们执行内存和磁盘取证以查找导致入侵的进程和文件。假设您已获取入侵分析中涉及的所有主机的内存转储。以下步骤描述了一些您可以执行的操作：\n\
  \n- 1. 识别其中一台受损主机中运行的进程，使用 `vol.py -f <memory dump> --profile=<system profile> pslist`、`vol.py\
  \ -f <memory dump> --profile=<system profile> pstree` 和 `vol.py -f <memory dump>\
  \ --profile=<system profile> psxview` 命令。第一个命令列出进程，第二个命令显示进程树，第三个命令列出隐藏的进程。进程树的输出结果在以下屏幕截图中显示：\n\
