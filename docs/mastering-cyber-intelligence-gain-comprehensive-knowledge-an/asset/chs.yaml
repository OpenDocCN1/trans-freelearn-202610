  \ 保险公司的威胁。CTI 团队须直接识别并选取指标以监控此类威胁/行为者。第 4 章《网络威胁情报的情报收集技巧和标准》及第 5 章《目标设定、CTI 策略的程序和实际用例》将说明如何使用\
  \ MITRE ATT&CK 或 Cyber Kill Chain 等框架。最后利用需求和指标实施行动计划以改善安全，或在资源不足时请求执法协助。该概念为 **Prioritized\
  \ Intelligence Requirements (PIRs)**。示例如下图：\n\n![](img/d47f26598025b2da017dd41fcbb6e602_54_0.png)\n\
