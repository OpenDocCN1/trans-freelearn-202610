  \n图 2.2 – 作为中期目标的特定情报需求\n\n中期需求还回答了流程自动化、**入侵指标 (IOC)** 处理、丰富化以及整合新的数据源以确保威胁情报计划保持最新等未来问题。中期需求对于保持和发展一个坚实的情报团队至关重要。\n\
  \n> **重要说明**\n> 在使用 SIPs 分解 PIR 的情况下，它会自动更改为关键优先级。我们将在下一节中了解 SIP 如何支持 PIR。在对需求进行分类之前，了解需求的影响至关重要。\n\
  \n因此，SIPs 以主要或中等标签为特征，并且它们必须始终与 PIRs 对齐。现在，让我们来看长期情报需求。\n\n## 长期需求\n\n长期需求用于确保远期保护。CTI\
  \ 是为组织进行的，而不是为分析师或 CTI 团队本身进行的。因此，必须超越当前视野，将威胁和安全风险预测到更远的未来。长期需求的优先级取决于 CTI 团队和内部安全团队。这些需求对组织的整体环境更为概括。虽然它们被归入较低的优先级类别，但它们是\
  \ PIRs 和 SIRs 的基础。这些需求回答以下一般问题：\n\n- 未来业务扩张后，组织是否会面临我们应该了解的威胁？\n- 是否存在针对组织的内部威胁？\n\
  - 是否存在针对相关行业的已知威胁？\n\n此类威胁普遍针对保险公司。我们可以直接看出，关于短期需求或 PIRs 所提出的问题与一般需求的第一个问题直接相关。\n\
  \n在本小节中，我们了解了情报项目中优先级的重要性。我们提到，优先级使我们能够根据其对组织的直接影响来应对安全问题。另一种流行的情报需求优先级排序方法是使用高、中、低优先级[content]\n\
