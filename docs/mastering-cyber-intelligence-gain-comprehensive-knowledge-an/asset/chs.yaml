  - 如何发生的？\n- 针对了哪些信息？\n- CTI 范围内的主要行为者或对手是谁？攻击是自动执行的还是手动执行的？\n\n内部安全团队必须向 CTI 团队提供此类信息，以便定制情报项目。\n\
