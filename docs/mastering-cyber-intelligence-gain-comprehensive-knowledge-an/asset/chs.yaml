  \ | 报告 | M | L | I | C | N |\n\n## 图 15.22 – 威胁归因案例的 ACH 说明\n\n对于每个证据和假设，我们都已填写诊断要素。例如，E8与H1高度不一致，因为如果组织存在漏洞，则Stuxnet构成威胁。E7与H2的相同原理适用——如果恶意软件无法渗透我们的系统，则Stuxnet不能对组织构成威胁。当假设和证据相互矛盾时填写不一致，当两者匹配时填写一致。\n\
