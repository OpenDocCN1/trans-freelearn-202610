  \n## 评估对以色列发动2010年和2020年伊朗核设施袭击的归因：\n\n以下步骤用于评估伊朗袭击归因于以色列国家行为体的归因。我们将遵循ACH过程中使用的相同步骤：\n\
  \n- 1. **制定假设**：通过选择具有先进网络基础设施并有能力对核电站发动攻击的国家来创建假设。假设如下。*H1* – 美国攻击了伊朗。*H2* – 以色列攻击了伊朗。*H3*\
  \ – 俄罗斯攻击了伊朗。*H4* – 朝鲜攻击了伊朗。*H5* – 中国攻击了伊朗。*H6* – 印度攻击了伊朗。*H7* – 是其他国家行为体。我们选择这些是因为美国、伊朗、以色列、俄罗斯、中国、印度和朝鲜都是网络活动的活跃国家。你可以添加任何其他国家。\n\
  - 2. **识别支持假设的证据**：识别支持假设的证据。我们起草了以下证据：*E1* – Stuxnet针对使用Microsoft Windows操作系统的设备。*E2*\
  \ – Stuxnet针对现代SCADA系统并可破坏核电站。*E3* – Stuxnet收集工业控制系统信息并导致离心机失常。*E4* – 大多数受害者来自亚洲国家。*E5*\
  \ – Stuxnet的初始访问是通过感染的闪存驱动器。*E6* – Stuxnet利用了Windows系统漏洞，包括零日漏洞。*E7* – Stuxnet由美国和以色列创建以针对核电站，等等。\n\
  - 3. **将证据分类为意图、机会或能力**：意图涵盖*E1*、*E2*、*E3*和*E4*。机会包括*E7*。能力包括*E5*和*E6*。\n- 4. **执行提供的证据诊断**：我们通过选择假设与其证明之间的适当不一致级别来执行诊断，如*图\
  \ 15.23*所示。\n- 5. **设定每条证据的可信度和相关性**：我们设定每条证据相对于假设的可信度和相关性，如*图 15.23*所示。\n- 6. **查看和评估生成的不一致得分**：我们评估ACH以提取不一致得分最小的假设。\n\
