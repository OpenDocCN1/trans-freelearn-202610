  \n请注意，IOCs 列表可以扩展。因此，根据组织和目标受众，IOCs 也可以作为单独的列表提供，以免使报告显得杂乱。\n\n- **建议措施**：本节包含缓解威胁的步骤。它还应突出显示当前安全控制如何缓解或不缓解威胁带来的风险。对于每个实际生成的警报，分析必须推荐对策，这些对策必须包含在报告中。如果不需要采取任何行动，应在报告中提及。本节的示例显示在以下图表中：\n\
