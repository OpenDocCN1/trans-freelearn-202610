  \n### 安全措施\n这是一个独立但持续的需求参数，用于评估当前的安全状况。CTI 分析师必须与组织的安全团队合作，识别、理解和评估现有安全协议（事件响应、风险评估、系统审计、恶意软件分析等）。在考虑安全协议和措施后，CTI\
  \ 团队必须将步骤与过去（或现有行业）泄露事件相关联。然后 CTI 分析师（或小组）和组织的安全团队必须回答以下问题：\n- 组织的安全协议在检测或防止过去的攻击方面是否有效？\n\
  - 该协议是否被准确执行以减轻攻击或应对过去的事件？\n- 事件期间是否有未执行的安全措施？\n\n这里提到的全局问题是情报项目生命周期第一步的主要驱动因素。它们还定义了下一章中所需的数据收集类型。下表提供了情报需求全局范围的示例，有助于定义情报项目。它还展示了情报需求如何被回答并用于塑造周期的[content]\n\
  ### 实际系统入侵\n这里的主要行动是了解组织是否发生过真正的入侵或信息泄露。CTI 项目的合理性更强，且当组织曾遭受实际入侵或间谍活动时获得批准的比例更高。然而，这并不意味着如果没有实际入侵发生\
