  \ **应用程序编程接口 (API)** 或自定义连接）。此外，SIEM 或 TIP 必须作为所有安全平台的集中式系统运行。\n\n投资端点管理系统成本可能很高；因此成本因素必须始终计入，尤其是预算有限的组织。组织可根据功能和需求获取一个以上端点管理系统。使用多平台时，需确保集成和互操作性得以维持以便维护和支持。下一节将介绍移动端点管理及其与端点管理系统的差异和挑战。\n\
