  \ 欢迎页面和 STIX/TAXII 服务器向导\n\n成功设置 LIMO 后，单击 **LET'S TRY STAXX**。您必须接受许可协议的条款和条件。请注意，初始设置后您可以配置额外的\
  \ STIX/TAXII 服务器。\n\n- 5. **查看 STIX/TAXII 可观测数据**：STAXX 为选定时间段提供具有可观测数据的深入仪表板。您可以深入查看每个指标或可观测数据以获取更多信息。以下图示显示了仪表板的下钻视图：\n\
  \n![](img/d47f26598025b2da017dd41fcbb6e602_472_0.png)\n\n图 15.10 – 来自主仪表板的 Anomali\
  \ STAXX 下钻视图\n\n前一幅图显示了 IP 地址作为可观测数据，并附带严重性、**Traffic Light Protocol (TLP)**、源（或来源）等信息。单击可观测数据以查看其详细信息。您可能需要使用\
  \ `https://bit.ly/3IJ1pox` 链接免费注册 Anomali 才能查看可观测数据详细信息。**ACTIVITY** 页面提供了搜索可观测数据和应用筛选器的机制。\n\
  \n6. **配置可观测数据**：Anomali STAXX 允许 CTI 分析师与社区共享可观测数据。(1) 单击菜单栏上的 **IMPORTS** 以调出可观测数据导入页面。(2)\
  \ 填写从入侵分析中提取的 IOC。以下 IOC 已添加：`125.19.103.198`、`46.158.5.140`、`resoh.ru` 和 `12cf6583f5a9171a1d621ae02b4eb626`。(3)\
  \ 选择威胁类型。这里我们选择 **malware**。(4) 将置信度级别设置为 70%。(5) 将严重性设置为 **High**，因为这是对系统的攻击。(6)\
  \ 为活动添加一个或多个标签。我们将添加以下标签：`suspicious-IP`、`suspicious-domain`、`phishing-malware`\
  \ 和 `victim-finance`。(7) 设置适当的 TLP 颜色。让我们将其设置为 **Red**。(8) 单击 **Import** 以导入可观测数据信息。可观测数据配置显示在以下图中：\n\
  \n![](img/d47f26598025b2da017dd41fcbb6e602_473_0.png)\n\n图 15.11 – Anomali STAXX\
  \ 可观测数据配置页面\n\n导入与我们的分析相关的可观测数据后，会出现批准或拒绝窗口，如下图所示。仔细验证插入的数据后，单击 Approve Import 按钮：\n\
