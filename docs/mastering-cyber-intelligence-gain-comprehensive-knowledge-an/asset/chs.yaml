  \n## Summary\n\n实施正确的防御机制并从一开始就确保数据保护是最好的网络安全实践。如果你的系统从一开始就不安全，**网络威胁情报（CTI）**计划将不会有效。我们看到当前威胁防御系统存在若干挑战。因此，作为安全专业人员或处理数据的组织，你需要确保数据安全至关重要。组织无需投资大量各自为政的工具。相反，它应考虑投资合适的技能，以在业务\
  \ DevOps 周期中使用最佳实践。你应能够识别与组织相关的安全挑战并推动数据保护策略。DevOps 和安全要求必须引领防御策略。在下一章中，我们将探讨 AI\
  \ 如何驱动 CTI。\n\n## 9 AI Applications in Cyber Threat Analytics\n\n## AI Applications\
  \ in Cyber Threat Analytics\n\n在经历多年的承诺和未能实现之后，**人工智能（AI）**——通过**机器学习（ML）**和**深度学习（DL）**——终于成为新一代分析系统和应用的催化剂，这些系统和应用正在改变全球各行各业。**网络安全**总体上和**威胁情报**具体上都不是例外，它们也从\
  \ AI 应用中受益。由于从许多不同来源收集了大量数据，人类使用传统方法获得有价值的洞察变得具有挑战性。AI 有助于发现隐藏的数据模式，从而支持安全决策。我们可以利用\
  \ AI 算法来优化和自动化诸如**资产保护**、**未知威胁分类**和安全**事件响应（IR）**等任务。安全和威胁情报厂商已在其解决方案堆栈中集成 AI。然而，虽然\
  \ AI 可以帮助网络防御，但它也可以助长网络攻击，使对手获得相同的技术以提高其操作的复杂性，因此在双方都起到了力量倍增器的作用。\n\n本章重点介绍威胁情报计划中的\
  \ AI 应用以及它们如何提高系统安全性。其目的是帮助组织了解 AI 集成在网络防御中的好处，并转向主动安全态势。\n\n在本章结束时，你应该能够做到以下几点：\n\
  \n- 了解 AI 对网络威胁项目可能做出的贡献。\n- 将 AI 定位在组织的**网络威胁情报（CTI）**计划和安全堆栈中。\n- 了解**安全信息和事件管理（SIEM）**工具如何利用\
  \ AI 能力实现更好的网络防御，并以**IBM QRadar Advisor**方法为例。\n\n在本章中，我们将涵盖以下主要主题：\n\n- AI and\
  \ CTI\n- Positioning AI in a CTI project\n- AI Integration – the IBM QRadar Advisor\
  \ approach\n\n## Technical requirements\n\n对于本章，未强调任何特殊技术要求。大多数用例如有必要将使用 Web 应用程序。\n\
  \n## AI and CTI\n\n在*第7章，威胁情报数据源*中，我们描述了用于收集情报的各种数据源。内部和外部数据源被收集、处理并关联，以创建可操作的威胁分析案例。威胁分析师或\
  \ CTI 团队的任务之一是发现可能指示潜在威胁的*信息模式*。然而，由于以下几个原因，人类执行此任务具有挑战性：*在检查大数据威胁时出现错误，结果解释存在偏差，分析中遗漏关键数据模式，*以及*处理时间延长*。所有这些都可能导致威胁情报实施无效。以下是\
  \ AI 在 CTI 中的一些好处：\n\n- **对威胁的更快响应：** AI 和 ML 可以高效应用于结构化和非结构化数据，并比人类更快地学习威胁行为。通过使用**监督式**和**无监督式**模型，基于\
  \ AI 的情报平台可以检测威胁模式并相应响应。因此，对威胁事件的标准响应时间从几天缩短到几分钟。此外，超过 70% 的安全专业人士表示 AI 允许对威胁做出更及时的反应（https://bit.ly/3gHDmv2）。因此，组织正努力从基于规则的威胁响应转向基于\
  \ AI 的威胁响应（或将两者结合以实现有效防御）。例如，针对特定关键资产的攻击可以迅速在所有同类关键资产上被阻止。AI 还使威胁缓解、取证操作和 IR 中的根本原因分析更快。\n\
  - **威胁的早期检测：** AI 可以通过学习数据并发现使用手动或基于规则的模型时可能未被注意到的威胁模式来增强 CTI。它通过演进系统参数不断适应威胁行为检测的变化。例如**用户行为分析**（**UBA**）就是\
  \ AI 对早期威胁检测贡献的体现。AI 增强的探索性数据和描述性分析是早期威胁和系统异常检测的最大推动因素。\n- **预测分析：** 威胁分析师和安全团队收集的数据用于训练\
  \ AI 模型以预测威胁。这是领先于网络犯罪分子的方法之一。*威胁狩猎*或*非基于签名的威胁检测*等用例展示了 AI 在打击网络犯罪分子中的力量。安全系统学习并分析之前的攻击、威胁、攻击尝试和成功攻击后的系统行为，并利用这些信息构建情报。后者甚至可用于对抗未见威胁和**高级持续性威胁（APTs）**。\n\
  - **分析偏差减少：** 分析大量涌入的数据可能具有挑战性。CTI 需要对结果进行可靠的解释以允许采取行动的决策。在**预测分析**中，偏差主要归因于数据。然而，在**安全分析**的背景下，偏差可能由人类、机器（集成规则）或所使用的工具引入。在做出决策时，CTI\
  \ 分析师必须确保分析反映数据且不引入刻板印象。AI 减少分析偏差。\n- **误报：** 误报是资源浪费、不必要能源使用和效率低下的一大原因，并可能让你的组织花费金钱。想象一下收到潜在威胁的警报。你紧急召集所有团队并中断业务，最后才发现这是一个误报。将\
  \ AI 与人类能力相结合是避免误报的最佳方式。\n\nAI 有潜力为网络防御带来大量改进，尤其是在管理威胁和泄露的成本方面。它还可以使我们作为安全专业人员的工作更高效，因为工作重点转移到由\
  \ AI 算法识别的威胁分析上。下一节将介绍网络威胁狩猎及其优势。\n\n## Cyber threat hunting\n\n未知威胁是全球数据泄露的主要原因之一。因此，组织必须找到在打击网络攻击中采取主动的方法。**网络威胁狩猎**本身就是一门科学，值得单独写一本书。本节介绍组织如何建立威胁狩猎计划，并从实用但高层次的角度受益于这些计划。它还说明了\
  \ AI 在增强网络威胁狩猎中的重要性。\n\n\n\n威胁狩猎正在成为——或已经成为——大多数 **安全运营中心 (SOCs)** 的不可或缺的一部分。虽然\
  \ IR 和取证调查为网络威胁和攻击提供了一种被动响应方法，但威胁狩猎使组织能够主动出击。然而，在威胁狩猎之前存在两个主要问题。第一个是 *我的组织能做到吗？*\
  \ 第二个是 *我们从哪里开始？* 虽然威胁狩猎的概念可能不明确，让我们探讨一些有助于组织的要素。(1) 其理念是 *识别系统安全可能遗漏的内容*。因此，我们的狩猎不仅仅是通过调查已识别的威胁（被动）进行，还通过搜索我们尚不了解的内容。(2)\
  \ 我们可以通过有效的 **探索性数据分析 (EDA)** 来利用威胁狩猎。这正是 AI 和现代分析流程可以提供很大帮助的地方。然而，小型组织可以从基础分析开始，以识别系统中的异常行为。(3)\
  \ 我们可以用简单的分析工具开始威胁狩猎之旅，例如 **Microsoft Excel**（随着数据量的增长可能会显示局限性）和开源 **商业智能 (BI)**\
  \ 平台。或者，我们也可以投资 *威胁狩猎平台*（例如，**Exabeam**、**Mantix4 Cyber Threat Hunting**、**Infocyte\
  \ HUNT** 等）和 SIEM 系统（例如，**Splunk**、**QRadar**、**CrowdStrike Falcon** 等）来自动化流程并扩展狩猎范围。最后，(4)\
  \ 我们可以投资人员并在组织内部建立 *威胁狩猎技能*。威胁狩猎利用了 IR、取证调查和威胁情报分析方面的技能。虽然一些组织专注于流程复杂性以获取专家和昂贵的劳动力，但小型企业可以利用内部安全知识来构建他们想要的威胁狩猎画像。让我们看一下将威胁狩猎与组织的\
  \ CTI 流程和安全堆栈集成的策略。\n\n## 威胁狩猎集成策略\n\n集成威胁狩猎是每个组织都希望解决的挑战。主要挑战是知道从哪里开始。然而，了解组织的整体安全需求、成熟度水平和\
  \ CTI 立场对于定位威胁狩猎计划至关重要。*1 级*、*2 级*和 *3 级* 组织以不同的方式集成威胁狩猎，如下图所示：\n\n图 9.1 – 1 级、2\
  \ 级和 3 级组织的威胁狩猎集成策略\n\n图 9.1 说明了将威胁狩猎集成到不同组织业务运营中的基本要求（附任务摘要）。在以下小节中，我们将扩展 1 级、2\
  \ 级和 3 级威胁狩猎策略。\n\n## 1 级组织\n\n我们假设 1 级组织没有成熟的 CTI 程序，但拥有用于流量、事件警报和数据收集的基础设施——换句话说，是保护系统的最低要求。因此，确保您\
  \ (1) 部署基本 SOC 系统和 IR 团队，(2) 从不同的网络元素和端点收集数据并将其馈送到集中系统，最后，(3) 从开源外部来源收集数据以增强安全监控基础设施。在满足所有上述条件后，1\
  \ 级组织可以通过完成以下工作开始深入威胁狩猎计划：\n\n- 探索数据以识别异常的事件和流量。组织必须利用内部安全分析师来执行基本狩猎操作。\n\n| 1 级\
  \ | 2 级 | 3 级 |\n|---|---|---|\n| **满足基本安全要求：**<br>- 集中式 SOC 和基础 IR。<br>- 收集内部和开源外部数据。<br><br>**集成基础狩猎：**<br>-\
  \ 利用内部团队。<br>- 使用 Excel 和开源 BI 等分析工具。 | **满足基本安全要求：**<br>- 满足 1 级要求。<br>- 拥有成熟的\
  \ IR 团队。<br>- 频繁收集和扩展数据馈送。<br>- 开始规划 CTI。<br><br>**集成基础狩猎：**<br>- 分析和 AI 技术，例如分类。<br>-\
  \ 数据检查和 IOC 识别。<br>- 创建威胁狩猎策略。<br>- 收集最新的威胁数据。 | **满足基本安全要求：**<br>- 满足 2 级要求。<br>-\
  \ 拥有 CTI 程序。<br>- 拥有自动化的安全流程。<br><br>**集成基础狩猎：**<br>- 建立熟练的狩猎团队。<br>- 创建更多与 CTI\
  \ 对齐的狩猎策略。<br>- 获取威胁狩猎平台。<br>- 自动化狩猎流程。 |\n\n- 使用 Excel 或开源 BI 应用等基础分析工具。例如，可以使用\
  \ **Grafana** 来分析存储在 **Hadoop 分布式文件系统 (HDFS)** 中的威胁数据。分析流程的目标是使用适当的视觉化工具深入了解数据。\n\
  \n对处理良好且清理过的威胁数据进行汇总统计可以显示内部团队可以调查的异常流量和事件。随着时间的推移，1 级组织成长为 2 级对于加强防御系统和增强威胁狩猎操作至关重要。接下来，我们将查看\
  \ 2 级组织。\n\n## 2 级组织\n\n对于 2 级，我们假设您的组织具有一定水平的威胁分析，从内部来源收集数据，并拥有良好的系统安全策略。此外，流程以某种方式被记录并被不同的业务职能使用。2\
  \ 级组织拥有 CTI 程序。2 级组织必须确保 (1) 已部署 SOC 系统，(2) 有一个处理网络事件的团队（IR 团队），并且 (3) 它频繁地从内部和外部来源收集数据。威胁狩猎可以通过以下方式得到采用：\n\
  \n- 应用分析技术对 *恶意* 和 *非恶意* 流量和事件进行分类。组织可以利用现有的 IR、取证和威胁情报分析师来执行威胁狩猎。\n- 检查收集的数据并识别可能发出潜在威胁信号的\
  \ **入侵指标 (IOCs)**。\n- 为威胁狩猎程序创建策略。该策略可以是（行业特定）或根据组织的业务和安全要求进行定制。\n- 确保数据馈送或来源经常更新以收集最新的威胁数据。\n\
  \n2 级组织应处于开展威胁狩猎计划的有利位置。接下来，我们将查看 3 级组织如何将威胁狩猎计划与安全堆栈中的 CTI 集成。\n\n## 3 级组织\n\n\
  对于 3 级，我们假设您的组织拥有先进且成熟的 CTI 程序，具有自动化数据收集、威胁建模和分析流程。将威胁狩猎集成到组织安全程序的最佳方式是通过完成以下工作：\n\
  \n- 组建具有正确技能的威胁狩猎团队。在这里，组织可以专注于专业知识并通过聘请合适的人员执行复杂的狩猎活动。\n- 根据威胁情报要求创建更定制的威胁狩猎策略——您必须考虑所有业务职能的要求。\n\
  - 获取一个自动化整个狩猎流程并能随数据扩展的威胁狩猎平台。此外，该平台必须促进与现有安全基础设施（SIEM 工具、**威胁情报平台 (TIPs)** 和用于安全监控的其他工具）的集成。\n\
  \n对于 3 级组织，在参与高级威胁狩猎计划之前，拥有成熟的 CTI 程序至关重要。威胁行为者正在不断演变，威胁防御者也应如此。开始时规模小是可以的；然而，增长应该是不可避免的。\n\
  \n在以下小节中，我们将查看驱动威胁狩猎的流程。\n\n## 威胁狩猎流程\n\n目前，威胁狩猎流程尚未标准化。因此，许多威胁狩猎提供商和组织依赖研究人员创建的自定义程序和策略来促进狩猎流程。然而，其中一些流程可能难以遵循或实施。在本节中，我们简化了狩猎流程以适应所有组织。该流程如下图所示：\n\
  \n![](img/d47f26598025b2da017dd41fcbb6e602_287_0.png)\n\n图 9.2 – 威胁狩猎流程\n\n\n\n\
  威胁狩猎涉及的步骤如下。\n\n## 突出狩猎的目的\n\n开始时，您应确定整个计划的目标：*Why are you hunting?* 这是首先要问的问题。战略团队必须将计划映射到业务目标以回答该问题。在第一步中，您必须定义将驱动整个流程的*hypothesis*。假设定义的中心问题是*What\
  \ are you looking for?* 领域知识是生成假设的关键。一个简单的理论可以如下：\n\n- **假设**：攻击者可以创建**命令与控制（C2）**通道与您的组织通信并外泄敏感数据。\n\
  - **我们可以寻找的内容**：我们可以检查和分析常用于 C2 通道的各种协议。然后，我们可以使用威胁情报框架 such as **MITRE ATT&CK**、**Cyber\
  \ Kill Chain**和**Diamond Model**来提取攻击者在该任务中使用的**战术**、**技术**和**流程（TTPs）**。例如，查找可用于不可检测通信的应用层协议（HTTP、HTTPS、FTP、DNS）。MITRE\
  \ ATT&CK 框架涵盖大约 16 种 C2 技术。也很重要的是，您*only look for what applies to your organization*。\n\
  \n一旦您确定了威胁狩猎计划的目标和目的，就很重要限制操作范围（以避免狩猎范围过广）。换句话说，您需要定义狩猎范围。\n\n## 定义狩猎范围\n\n第二步是定义威胁狩猎必须进行的环境——也称为*system\
  \ under test*。例如，您可能希望在受限的业务区域执行该流程，并选择特定的系统子网、主机、服务器和应用程序。以下是范围限制的示例：\n\n- **狩猎范围**：使用包含客户数据文件系统和组织在线应用程序\
  \ Web 服务器的企业网络，其中子网 IP 为 `192.168.12.0/24` 和 `192.168.16.0/26`。\n- 确保范围定义正确并反映*purpose*。不要扩大或缩小范围，因为您可能会使流程不堪重负或遗漏威胁的存在。为了延续前面的示例，我们希望狩猎可能与包含关键数据的企业网络部分通信的\
  \ C2 通道。因此，我们需要突出包含关键数据的设施。\n\n## 识别数据源\n\n您必须为狩猎选择正确的数据。数据选择在很大程度上取决于手头的任务。到目前为止，您应该能够获取内部和外部数据（即来自网络、终端、应用程序、恶意软件、情报等的数据）。下面显示了可使用的示例数据源。\n\
  \n### C2 通道的数据源\n\n使用网络和应用程序数据。重点关注安全网络元素日志（例如，防火墙、IDS、IPS、代理、应用程序日志（HTTP、DNS、FTP、SSL、SMTP））、终端数据、数据编码、加密哈希数据以及协议隧道数据和记录（例如，VPN\
  \ 日志）。您必须使用内部和外部数据以获得对威胁狩猎过程更全面的视图。在将数据源用于威胁狩猎流程之前，始终确保对其进行验证。\n\n## 选择威胁狩猎技术\n\n\
  威胁狩猎*technique*使您能够主动参与任务。威胁狩猎可以使用多种技术和方法。每种方法或技术的输出都不同。狩猎技术选择取决于业务目标和组织成熟度。一些流行的威胁狩猎技术包括以下内容：\n\
  \n- **Searching**以识别指示威胁存在的威胁指标。分析人员可以依赖*data queries*和*data exploration techniques*。\n\
  - **Clustering/segmentation**根据模式相似性对系统事件和流进行分组。聚类是 heavily 受益于 AI 和 ML 的任务之一。您可以使用统计技术或无监督\
  \ ML 算法来聚合系统事件和流行为。输出是*labeled groups of common behavior*。\n- **Categorization/classification**使用定义的（标记的）标准对流和事件进行分类。此过程也可以利用\
  \ AI 和监督式 ML 以获得最佳结果。简单的分类可以是二元分类（正常或异常、1 或 0、是或否等）。复杂的分类可以有多个类别（例如，正常内部、正常外部、异常内部、异常外部）。\n\
  - **Stack counting**以提取某些事件或流的发生次数并确定任何异常元素。堆栈计数在处理相同来源和功能数据的子集时非常有效，例如防火墙日志。\n\n\
  以下是技术选择的示例：\n\n**Techniques：** 为了狩猎 C2 威胁，使用*searching*查询指标（例如，IP地址、域名、加密哈希、协议、端口、SSL\
  \ 证书）可能具有恶意。比较 IOCs 与之前收集的和公开的数据以确定其合法性。使用*classification*来识别恶意与非恶意流量。统计每个端口和协议应用程序的流量事件数量（例如，请求和响应）（*stack\
  \ counting*）——例如，统计使用端口 8080 通信的事件数量或使用**File Transfer Protocol (FTP)**的事件数量。请注意，您可以根据目标执行更多操作。ML\
  \ 模型提供了更多威胁狩猎的技术和用例。\n\n## 报告和反馈\n\n准备一份包含调查结果的报告。包括使用必要插图进行的所有分析。在每个步骤中使用问题。例如，*were\
  \ the data sources sufficient?* 或 *were the chosen techniques successful?* 评估是否满足成功标准。利用调查结果为未来操作创建威胁狩猎数据库或存储库。创建一个**deep\
  \ packet inspection (DPI)**签名数据库以在未来触发通知是一个很好的做法。\n\n威胁狩猎对组织至关重要，应有效执行以避免误解。将威胁狩猎集成到组织的\
  \ security operations 中并非魔法——它需要适当的策略。大多数专门的威胁狩猎提供商正在利用 AI 和 ML 来增强其解决方案能力。\n\n\
  虽然 AI 和 ML 使组织能够开发更好、更可靠的防御机制，但它们也使对手能够增强其 TTPs 以策划复杂、未被检测到且破坏性强的攻击。下一节将介绍对手如何利用\
  \ AI。但首先，让我们看看将威胁狩猎与 CTI 结合的好处。\n\n## 将威胁狩猎与 CTI 结合的好处\n\n威胁狩猎并不完全依赖于威胁情报，因为它补充了与\
  \ IR、威胁检测和取证流程相关的标准安全运营。威胁狩猎计划可以通过利用内部安全监控数据、系统日志和其他检测工具启动——我们可以将其标记为*internal intelligence*。这种方法（即在没有\
  \ CTI 的情况下进行狩猎）主要包括以下内容：\n\n- 在*internal*数据中搜索 IoCs，例如恶意软件哈希、字符串、C2 域名、IP地址等。威胁猎人随后使用\
  \ IoCs 在网络中搜索类似活动。这种方法在威胁狩猎任务中很常见。目标是快速响应 IoCs。然而，它容易受到多态性和变态等规避技术的影响，其中更改指标签名会使检测系统难以检测。更改哈希、IP地址和域名等\
  \ IoCs 可以是一种廉价的策略，对手只需付出很少的努力即可。请参阅第 13 章，*Threat Intelligence Metrics, Indicators\
  \ of Compromise, and the Pyramid of Pain*，了解有关 IoCs' discovery 的更多信息。\n- 搜索*host\
  \ and network artifacts*，例如对手使用的协议（例如，HTTP、FTP、SMTP 和 SSH）以及安全边界周围异常流量的迹象。威胁猎人使用网络和主机工件来发现异常的网络和用户活动。然而，这可能需要存在可疑活动，例如尝试在系统中进行横向移动或数据移动（外泄）。当我们搜索并识别对手的主机和网络工件时，我们迫使他们改变其利用方法，这对他们来说可能是一项更昂贵的任务。\n\
  - 搜索网络活动中的*abnormal patterns*。威胁猎人使用大数据分析方法、ML 和 DL 来发现和预测潜在威胁。然而，这种方法的一个缺点是误报率，这会降低模型的效率。在此级别执行分析需要大量数据以及对威胁上下文（用例）的良好定义，以便理解输出。输出可以是对可疑行为的分类、预测或分段。\n\
  \n\n\n威胁情报超越了内部数据源（*馈送*）的收集和处理。通过使用可操作的情报，我们对 IoCs、网络和主机痕迹以及对手的 TTPs 获得了更深入的洞察。虽然\
  \ IoCs 和系统痕迹可能会发生变化，但对手很少修改其作案手法。对手的 TTPs 直接与所使用的技术及其限制相关联。因此，情报分析可以帮助提取用于威胁狩猎的\
  \ TTPs、对手组织和基础设施。TTPs 位于 **痛苦金字塔**（https://www.sans.org/tools/the-pyramid-of-pain/）的顶端，这意味着如果我们能够在\
  \ TTP 层面检测和响应威胁，对手就需要从头开始重建其整个攻击策略。\n\nMITRE ATT&CK 框架提供了一个实用的 TTPs 参考，可用于基于 TTP\
  \ 的威胁狩猎。Diamond 模型提供了一种有效的方法来发现能力、基础设施、对手画像和受害者，可用于 IoCs 狩猎、网络痕迹狩猎和主机痕迹狩猎。Cyber\
  \ Kill Chain 提供了一种高效的方法来理解整个攻击结构。它是一个 *进攻性* 情报框架，可用于识别和预测网络威胁。\n\nCTI 为威胁狩猎提供了良好的基准，因为它有助于（1）识别安全基础设施中的差距，（2）对对手意图、能力和机会提出假设（假设形成是威胁狩猎方法论中的关键），以及（3）通过使用\
  \ **威胁情报平台 (TIPs)** 和 SIEM 工具收集和处理数据。TIPs 和 SIEM 工具（在大多数情况下）旨在处理大数据并执行高级分析和可视化。威胁告警和优先级排序是威胁狩猎的重要驱动因素，因为它们支持范围定义。根据组织业务和\
  \ CTI 需求，威胁建模输出可以突出可能影响组织的威胁，并指导威胁猎手追踪正确的对手、TTPs 和威胁。\n\nCTI 与 **网络威胁狩猎 (CTH)**\
  \ 之间的平行关系可以通过分析由 R. Daszczyszak、D. Ellis、S. Luke 和 S. Whitley 在 MITRE 白皮书中发表的 TTP\
  \ 狩猎方法论 V 图（https://bit.ly/3GnP9cy）来建立。该图示在下图中显示：\n\n![](img/d47f26598025b2da017dd41fcbb6e602_293_0.png)\n\
  \n图 9.3 – 由 R. Daszczyszak 等人提出的 TTP 威胁狩猎 V 图\n\n该方法基于恶意活动表征和威胁狩猎执行，二者各占据 V 图的一条腿。该图具有三个层次：活动、分析和数据处理。图中的组件将在以下章节中详细介绍。\n\
  \n## 表征\n\n表征组件涉及理解对手行为并提取他们可能采用的不同 TTPs。CTH 分析师使用 CTI 数据收集、报告、分析和研究来理解和识别对手在不同攻击面上的运作模式。作为分析师，我们使用\
  \ MITRE ATT&CK 或 Diamond Model 等 CTI 框架来识别和优先排序 TTPs。该活动模型为分析师提供有关可能发生变化或保持不变的 TTPs\
  \ 的信息。\n\n在识别出 TTP 后，分析师会针对已识别的 TTPs 提出假设。这些假设必须建立在不太可能发生变化的 TTPs 上。一种流行的横向移动技术是使用\
  \ Server Message Block (SMB) 协议或 Windows 管理共享进行文件共享 – MITRE ATT&CK ID T1021.002。例如，如果对手使用文件共享，则一个假设是查看与文件移动相关的计划任务。\n\
  \n然后利用这些假设来收集正确的数据。内部和外部数据必须为当前任务收集并进行情境化。\n\n用于情报收集的数据会被过滤和分析以用于威胁狩猎。搜索范围决定了哪些数据部分对操作仍有价值。*时间*、*表面*\
  \ 和 *行为* 决定了对手狩猎的策略。*时间* 组件有助于识别狩猎的初始时期或特定对手的活动时期。TIPs 和 SIEM 系统具有数据保留期，可将操作定位在时间上。*表面*\
  \ 组件允许分析师选择与攻击面相关的数据。例如，对于 **Linux** 系统，收集的 Windows 情报可能无关紧要。*行为* 组件允许分析师识别可能恶意影响系统的\
  \ TTPs。\n\n## 狩猎执行\n\n与 CTI 数据收集要求类似，分析师必须验证数据、识别数据中的差距并确定其可用性。如果数据不完整，分析师必须通过寻找新的数据源或\
  \ feeds 来弥补差距。在数据得到验证后，分析师可以实施和测试分析。他们构建分析查询以检测 TTPs 中突出的运作模式（或表征的阶段 1，如 *图 9.3*\
  \ 所示）。\n\n> **关于分析查询的说明**\n> \n> 分析的实施和测试高度依赖于组织或分析师使用的平台。例如，QRadar 和 Splunk 的客户可能有不同的分析实施方式。创建查询的最佳方式是保持通用（即查看高级组件，如协议和进程创建），而不是具体（例如协议名称、进程\
  \ ID 等）。对攻击面有良好的理解对于实施有效的分析查询至关重要。\n\n执行组件的最后阶段是通过检测真实活动并对其进行调查来进行狩猎。该过程可能具有挑战性。然而，MITRE\
  \ 白皮书为此定义了步骤，如下图所示：\n\n![](img/d47f26598025b2da017dd41fcbb6e602_295_0.png)\n\n图\
  \ 9.4 – 威胁狩猎执行流程\n\n执行流程是迭代的，并在以下几点中进行说明：\n\n- **分析调优**：确保为每个 TTP 开发的分析反映恶意活动事件。目标是减少需要查看的事件数量。这通过正确编写查询来实现。\n\
  - **检查异常值**：检查分析数据是否异常。如果异常值太多，分析师需要再次调整分析模型。如果查询后没有事件，分析师需要重新审视之前的步骤——因为如果没有事件就无法进行狩猎。\n\
  - **评估事件**：分析师利用技能和专业知识评估从分析过程中提取的每个事件。目标是将每个事件分类为恶意或非恶意。如果事件不恶意，则转到下一个事件。如果事件恶意，则分析它，然后转到下一要点。\n\
  - **记录事件**：作为分析师，我们必须记录恶意安全事件。分析师必须记录与事件相关的所有信息：时间线、受影响的主机、用户和恶意软件信息以及活动图。分析师可以使用发现的\
  \ IoCs 在外部和内部系统之间进行横向排查以获取更多信息。\n- **情境化事件**：事件情境化使分析师能够理解每个事件的上下文。识别导致该特定结论的事实（事件是否恶意）。我们必须将事件与系统组件（如文件、进程、用户信息和通信协议）关联起来。\n\
  - **调查恶意事件：** 作为分析师，我们必须识别安全事件的根本原因。提取导致此类事件的不同活动。入侵分析是一种可在此步骤应用的技术（请参阅 *第 10 章，威胁建模和分析\
  \ – 实用案例*）。我们使用 Diamond Model 和 Cyber Kill Chain 反向工作并重构事件。分析师必须执行数据横向排查以识别系统中的类似行为，直到所有类似行为的可能性耗尽且所有分析完成。\n\
  \n分析师必须报告该过程的结果，战略和战术团队将利用其做出安全决策以加强系统。技术团队的任务是通过适当的操作响应事件，以确保组织领先于对手。\n\n威胁情报对威胁狩猎至关重要。良好的\
  \ CTI 程序通过保持更新的数据源（通过开放、付费和共享 feeds）和更新的对手画像（通过最新的 TTPs 和对手行为）来促进威胁狩猎。它通过将检测类型扩展到超出\
  \ IoCs 或基于网络/主机的狩猎技术来丰富威胁狩猎。使用威胁情报进行狩猎可以通过在痛苦金字塔的顶端运作来拒绝对手访问，使其对该事业的投入变得极其困难。然而，下一个章节将探讨对手如何利用\
  \ AI 来保持攻击。\n\n## 对手如何利用 AI\n\nAI 是一个开放的领域，这意味着它对网络安全有有利和不利的贡献。对手可以利用 AI 技术来增强 TTPs。例如，想象一下恶意软件代码可以实时适应系统的防御以避免检测，或恶意软件代码可以更改其签名以绕过防病毒工具。威胁行为者不断开发智能恶意程序以策划复杂且难以检测的攻击。以下几点强调了智能攻击中\
  \ AI 的一些应用：\n\n- **智能恶意软件：** 在这种情况下，攻击者使用 AI 将合法文件和链接武器化以向系统注入恶意代码。注入的代码学习系统对其的行为并启动其他操作，例如收集系统防御信息或报告阻止其操作的系统功能。通过学习系统，它可以冒充真正的应用程序和进程以变得不可见。它还可以\
  \ *自我评估* 以了解触发防御系统的代码部分，并 *自我执行* 以在保持其最低功能的同时混淆系统防御。\n\n\n\n智能恶意软件可以以 **蠕虫** 的形式工作，具有在系统中智能\
  \ *自传播* 的能力。这些 *自动检查系统是否存在漏洞* 并利用它们在系统中传播。\n\n- **智能逻辑炸弹**：攻击者转向基于 AI 的攻击的目的是确保恶意操作尽可能隐蔽地执行。智能逻辑炸弹是一种并非最初具有恶意的恶意软件，但在植入系统后会构建这种能力。它们可以根据时间或其他系统触发条件发展，例如感知未修补软件程序的存在、跟踪用户数量，或在执行攻击前到达特定的系统区域。除其触发功能外，智能逻辑炸弹还可以具有智能恶意软件能力。因此，智能逻辑炸弹对防御系统而言具有挑战性。\n\
  - **智能攻击向量**：攻击者正在增强整个 TTPs 堆栈，包括攻击向量。后者在设计和交付方面变得越来越复杂。社会工程、网络钓鱼和漏洞利用是一些通过 AI 增强的攻击向量的例子。AI\
  \ 驱动的软件程序可以爬网互联网寻找漏洞并自动发起全周期攻击。\n\n组织安全防御必须高效。因此，CTI 分析师必须了解对手用于开发 AI 和非 AI 威胁和攻击的\
  \ TTPs，以便有效控制组织的网络空间。基于规则的防御难以跟上基于 AI 的攻击（主要是因为威胁和恶意代码中嵌入了智能）。基于规则的安全和情报多年来一直有效，但基于\
  \ AI 的安全采用正在迅速增长。因此，有必要适应这一趋势。\n\nAI 成为有效系统防御关键的证明是其被大多数厂商的 **威胁情报平台 (TIPs)** 和\
  \ **安全信息和事件管理 (SIEM)** 工具所包含。然而，正如前几段所述，AI 为每个人服务（防御者和攻击者）。因此，你必须确保你的组织能够领先于复杂的攻击。\n\
  \n在下一节中，我们将了解 AI 在组织安全架构中的定位。\n\n## AI 在 CTI 程序和安全架构中的定位\n\nAI 在网络安全中的采用正以更快的速度增长。因此，你必须知道在组织的安全架构中将其定位在哪里。\n\
  \n首先，AI 必须集成到 SOC 中，其主要目标是保护网络、关键资产和数据、端点、应用程序以及云服务。\n\n其次，它还必须集成到 IR 流程中，以便在如图\
  \ 9.5 所示的情况下充分响应和缓解威胁：\n\n![](img/d47f26598025b2da017dd41fcbb6e602_298_0.png)\n\n\
  图 9.5 – AI 在安全架构中的集成\n\n第三，它必须集成到 TIP 和 SIEM 工具中，以实现客观可靠的威胁情报分析。\n\n最后，AI 必须集成到组织的威胁狩猎计划中，如本章第一部分\
  \ AI 和 CTI 中所述。\n\n分析师必须保护系统和关键数据（以及资产）并遵守法规和标准。然而，SOC 系统面临诸多挑战（例如，大量信息需要处理、工作量过载、流程优先级效率低下、缺乏技能、领导层期望）。AI\
  \ 可以解决这些挑战并连接海量数据以提取有用的安全信息，从而帮助弥合组织的安全差距并允许采取行动。它还提高了分析师的效率。\n\n由于组织检测入侵存在相当大的时间差距，AI\
  \ 变得对实施及时的网络安全威胁和入侵响应至关重要。许多组织承认其在打击网络犯罪中的影响。它还通过自动威胁模式分析降低了检测和响应威胁的成本，从而降低了整体事件响应周期工作量。然而，目前尚无\
  \ AI 完全自主运行的迹象。因此，必须在你的组织中建立 AI、安全数据分析与人为因素（专业知识）之间的良好协作。这三个组件必须协同工作才能实现最佳系统保护。\n\
  \n## 重要说明\n\n嵌入 AI 的安全平台对中小型企业而言可能成本高昂。尽管提供商使用专有算法来增强其产品的性能，但 1 级和 2 级组织可以利用开源 AI\
  \ 模型作为初始步骤。首先，你必须了解你的 AI 项目应聚焦于何处。其次，你必须根据 AI 集成的复杂性识别对你和组织而言的关键用例。例如，行为分析、欺诈和入侵检测是一些\
  \ AI 用例，它们提供高业务效益且集成复杂度低，因此你可以始终从这些开始。\n\nAI 在安全架构中的集成对组织而言具有挑战性。因此，某些组织（主要是 3 级企业）更愿意投资于嵌入此类功能的工具和平台。在下一节中，我们将了解\
  \ IBM QRadar 如何利用 AI 来增强系统保护。\n\n## AI 集成 – IBM QRadar Advisor 方法\n\n网络安全行业中有多种\
  \ AI 驱动的 SIEM 工具。然而，在本节中，我们将使用 **IBM QRadar Advisor**，因为它可通过 **IBM 安全学习学院** (https://bit.ly/3L6MRRy)\
  \ 轻松访问，并且拥有可用的培训和资源。QRadar 是 IBM 提供的一款多用途 SIEM 平台，用于解决一些安全挑战并保护你的组织。其优势包括以下内容：\n\
  \n- **安全运营任务自动化：** 它通过自动化常规任务来最大化安全团队的工作效率，实现快速威胁检测。\n- **安全分析：** 它分析并关联来自多个来源（外部和内部）和格式的数据，以提供有关威胁和关键数据（资产）的可操作见解。其分析能力包含威胁优先级排序和警报。\n\
  - **MITRE ATT&CK 映射：** 该工具嵌入了 MITRE ATT&CK 框架，便于将威胁事件和流程映射到相关阶段、类别或 TTPs。这对根本原因分析很重要。\n\
  - **驻留时间缩减：** 它集成了 AI（使用 **Watson** 应用），结合其自动化功能，可减少调查和响应网络威胁和事件所需的时间。\n- **嵌入式威胁狩猎：**\
  \ 分析师在对抗网络威胁时变得主动。QRadar Advisor 作为工具，利用高级分析、自动化流程和集成 AI 提供可靠的威胁狩猎引擎。\n- **预置用例：**\
  \ 组织面临的安全挑战之一是识别可推动系统保护和安全情报的高影响力用例。QRadar Advisor 拥有用于异常检测、攻击优先级排序以及深入原始事件的算法、规则和策略。然而，你也可以创建自定义策略来满足组织的具体需求。\n\
  - **用户友好型 GUI：** 用户界面包含菜单、按钮、小工具和其他功能，使其易于交互。它支持高级可视化功能，例如资产、用户、IoC 等之间的图形关系。\n\
  - **嵌入式法规和标准合规规则：** 该解决方案允许你将资产和数据分组到业务单元以进行法规审计。**《健康保险流通与责任法案》(HIPAA)**、**通用数据保护条例\
  \ (GDPR)** 和 **支付卡行业数据安全标准 (PCI DSS)** 是包含在 QRadar Advisor 中的一些合规包。\n\n\n\n\n- **模块化集成与价格：**\
  \ 一个组织可以根据特定功能购买 QRadar，并在业务需求发展时进行升级。这种能力带来了灵活的定价。\n- **维护与支持：** 该解决方案由 IBM 全面支持，并提供支持门户供贵组织在出现问题时提交工单。\n\
  \nQRadar Advisor 展现出诸多优势。我们可以看到它解决了本书中提出的绝大多数安全挑战。用于网络安全的 IBM Watson 应用构成了 QRadar\
  \ Advisor 的 AI 引擎，提供强大的认知分析和机器学习能力。\n\n### QRadar 简化架构\n\nQRadar 由不同的引擎和模块组成，形成整个技术栈。该工具收集数据（包括事件和流），对其进行聚合和关联，然后存储以供实时分析和其它应用功能使用。简化架构如下图所示：\n\
  \n![](img/d47f26598025b2da017dd41fcbb6e602_301_0.png)\n\n图 9.6 – QRadar 简化架构\n\n\
  架构层如下：\n\n- **数据采集层：** 该层从系统中收集流和事件。它还可以收集外部数据以丰富解决方案。该层由两个主要组件构成：事件收集器和流收集器。数据会被解析、预处理并规范化为平台上层可用的结构化格式。\n\
  - **数据处理层：** 数据处理层包含规则引擎，可让您创建自定义规则和使用案例。规则和使用案例生成威胁信息、警报和优先级。事件和流分别处理。其他 QRadar\
  \ 模块使用数据处理层来创建功能。\n- **数据搜索层：** 这是应用层，以人类可读的方式提供系统安全性的分析和可见性（例如，图表、报告、彩色警报等）。\n\n\
  如前述列出的优势之一所述，QRadar 支持模块化部署，允许您选择或购买所需的模块。QRadar 模块包括以下内容（此列表并非详尽）：\n\n- **QRadar\
  \ Risk Manager：** 用于风险分析、评估和控制\n- **QRadar Vulnerability Manager：** 用于漏洞评估和管理\n\
  - **QRadar Incident Forensics：** 用于调查和事件响应\n- **QRadar Advisor with Watson：** 用于\
  \ AI 集成和机器学习\n- **QRadar Security Analytics：** 用于自动化和主动威胁分析\n\n了解您的需求对于获取正确的模块至关重要。\n\
  \nQRadar 采用集中式系统保护机制并集成其他现有安全工具。在下一节中，我们将介绍如何部署 QRadar。\n\n### 部署 QRadar\n\n购买 QRadar\
  \ 后，您有多种部署方式，具体取决于组织规模、系统拓扑和 IT 基础设施。然而，QRadar 部署主要有两种方法和四种模型。方法包括 **单主机部署**（整个解决方案运行在单一系统上）和\
  \ **多主机部署**（组件运行在不同主机上）。QRadar 单主机部署适用于中小型企业（以及公众暴露度较低的企业）。随着企业发展和业务需求变化，解决方案可以扩展。\n\
  \n部署受许可限制，按 *每秒事件数* 和 *每分钟流数* 计量。部署 QRadar 时需要考虑的另一个重要因素包括 *存储容量*，它决定了 *保留期*。\n\n\
  部署模型包括（1）本地部署（即安装相关硬件、软件或虚拟机），（2）托管服务（即软件即服务 SaaS 的意义），（3）云上部署（私有或公有），最后是（4）混合部署（结合本地部署和\
  \ SaaS 或基础设施即服务 IaaS）。\n\n有关 IBM QRadar 的更多详细信息，请访问以下链接：\n\n- QRadar SIEM，https://ibm.co/3x136bu.\n\
  - QRadar 用于可见性、检测、调查和响应，https://ibm.co/3x1P5dF.\n- QRadar 用例，https://ibm.co/3x3WU2e.\n\
  \n### 对您或您的组织有什么好处？\n\n我相信您在想为什么我们花了这么多时间在 IBM QRadar 解决方案上。作为负责决策的 CTI 或安全分析师，您可能希望获取或建议一个\
  \ SIEM 解决方案。您可以将 IBM QRadar（作为现有且知名的 AI 驱动 SIEM 解决方案）作为参考点深入细节。这意味着您应该知道可以从 AI 驱动的\
  \ SOC、SIEM 工具、IR 解决方案或威胁狩猎平台中期待什么。\n\n其他类似工具包括 Securonix（https://www.securonix.com/）、Splunk（https://splk.it/3A47isT）、AlienVault\
  \ USM（http://soc.att.com/3jlimM5）等。在第 12 章《SIEM 解决方案和情报驱动的 SOC》中，我们将介绍 SIEM 和 SOC\
  \ 运营。\n\n### 摘要\n\nAI 正在改变网络安全领域，推动防御和进攻战术。因此，组织必须为将 AI 集成到业务安全运营中制定适当的路线图。AI 正在推动\
  \ CTI、威胁狩猎、SOC、IR 以及许多服务，以解决三个关键用例：系统保护、领先于对手以及更快的威胁响应。在本章中，我们介绍了威胁狩猎及其在安全情报中的重要性。我们还表明\
  \ AI 是双刃剑，因为它既可以服务于组织也可以服务于对手。因此，您应该能够向战略团队强调 AI 在您 CTI 项目中的重要性，将 AI 定位在您组织的安全堆栈中，并就\
  \ AI 驱动安全工具（无论是内部设计还是从第三方供应商获取）的采购和部署提供建议。在下一章中，我们将介绍网络威胁建模和入侵分析的实际用例。\n"
- "## 10 威胁建模与分析 – 实际用例\n\n从高层次来看，**网络威胁情报（CTI）** 分析的主要目标是 *找出威胁的来源（对手及其活动）* 并 *阻止它*（尽管达到这一点有多个流程和任务，如前几章所述）。**威胁情报（TI）**\
  \ 分析师必须培养强大的建模和分析技能，使其成为第二天性，因为在建模和分析威胁时，时间和效率非常重要。因此，理想情况是尽可能 *自动化流程*。然而，利用手动流程至关重要，以确保\
  \ CTI 分析师在进行威胁分析时知道该怎么做。\n\n本章重点介绍实用的威胁建模和分析示例，以说明如何进行入侵分析。本章的最终目标是为情报分析师配备实践知识，以便手动和自动分析威胁。\n\
  \n本章结束时，您应该能够做到以下几点：\n\n- 理解并掌握如何使用真实场景进行威胁分析\n- 使用 **SANS 调查取证工具包（SIFT）** **虚拟机（VM）**\
  \ 和 **恶意软件信息共享平台（MISP）** 进行有效的 CTI 分析\n- 理解 MISP 并利用该工具自动化 CTI 收集、分析和存储\n\n本章将涵盖以下主要主题：\n\
  \n- 理解分析流程\n- 入侵分析案例——如何进行\n- 用于自动化威胁分析和存储的 MISP\n\n### 技术要求\n\n本章中的分析使用安装在 VirtualBox\
  \ 上的 MISP TI 平台和 SIFT VM。这些工具的下载和安装可通过以下官方网站进行：\n\n- `https://www.misp-project.org/download/`\n\
  - `https://www.sans.org/tools/sift-workstation/`\n\nMISP 和 SIFT Workstation 可以成为\
  \ CTI 分析的良好组合，尤其适用于 1 级组织。然而，需要注意的是，有多种工具可用于 CTI 分析，既有开源也有商业。案例使用的目标是为分析 CTI 事宜提供逻辑流程。\n\
  \n### 理解分析流程\n\nCTI 分析最重要的技能之一是 **枢轴分析**。枢轴分析允许分析师使用一个或多个已识别的指标作为锚点，并在各种数据源中搜索与这些指标相关的事件和流。简化的威胁分析流程如下图所示，我们在整章中使用它来标准化我们的任务：\n\
  \n![](img/d47f26598025b2da017dd41fcbb6e602_307_0.png)\n\nFigure 10.1 – 威胁分析流程\n\n\
  最终目标是通过逐步识别 Diamond 模型的元素来完成 Cyber Kill Chain 阶段。分析过程的每个任务旨在识别有助于我们实现目标的工件。\n\n\
  对于任何威胁场景，必须采取以下步骤：\n\n- 1. **识别指标**：指标可以是 **互联网协议 (IP)** 地址、域名、哈希值、**统一资源定位符 (URL)**，甚至是银行账号、姓名和电子邮件地址等，以及包含主题、内容、服务器信息等的元数据。在威胁或入侵场景中，您必须识别一个初始指标作为起点。您要回答的问题是：*我应该从哪个指标开始？*\n\
  - 2. **情境化并验证指标**：此任务要求分析人员提取所选指标的含义、有用性和范围。目标是定义所选指标的相关性。*该指标为什么重要？其来源是否可靠？*\n\
  - 3. **通过数据源进行枢轴分析**：在内部和/或外部数据中搜索指标以确定其是否存在。驱动问题是：*该指标是否存在于我的系统中？*\n- 4. **识别其他指标**：枢轴分析通常会产生与初始指标关联的更多指标。枢轴分析后提取其他有用的指标——例如，IP地址可以揭示完整的\
  \ URL 链接。然后您可以使用新发现的指标再次执行 *步骤 2 和 3*。\n\n威胁分析是一个循环过程——因此，作为分析人员，您必须对收集到的每个指标重复该过程。经常会问的问题是：*我们何时停止通过指标进行枢轴分析？*\
  \ 现实但直接的答案是：*当作为威胁分析人员，您已有足够证据得出关于特定威胁的结论并且无法再进行枢轴分析时。* 在下一节中，我们以实用方法介绍入侵分析步骤。\n\
  \n## 入侵分析案例 – 如何进行\n\n在本节中，我们从 CTI 角度审视入侵分析。这将有助于将流程付诸实践。\n\n**目标：** 该用例的目的是说明如何处理入侵分析案例。该用例还有助于展示\
  \ CTI 流程中信息丰富化的方式。它还演示了如何在 CTI 流程中验证第三方情报。\n\n**场景：** 作为 *ABC* 公司 TI 分析师，您收到政府执法机构的电子邮件，关于贵组织与可能的\
  \ **命令与控制 (C2)** 通道 IP 地址 125.19.103.198 之间存在潜在恶意通信。您被要求调查和分析潜在威胁。\n\n**分析：** 主要问题是：*提供的\
  \ C2 IP 地址是否具有恶意性（第三方信任）？外部数据源的相关性对 C2 IP 说明了什么？网络中谁与提供的 IP 通信？*\n\n### 指标收集与情境化\n\
  \n在第一个流程中，我们分析已提供的指标并对其进行情境化。我们使用以下任务来收集和情境化指标。\n\n### 识别初始指标\n\n在本例中，初始指标由执法机构提供，即\
  \ 125.19.103.198 IP 地址。与报告组织联系以获取更多信息并回答您可能有的任何问题至关重要。\n\n### 获取上下文并验证指标\n\n我们提供了一个似乎与系统通信的外部\
  \ IP 地址。这是一种有限的情报。然而，我们已经可以想到一个 C2 服务器。验证和情境化将得到 Cyber Kill Chain 的 *发现* **行动方案**\
  \ (**COA**) 支持。如果 IP 活动与 C2 行为相关联，我们将继续分析并识别完整的入侵足迹。因此，我们尚未验证该指标。\n\n### 通过可用来源进行枢轴分析\n\
  \n我们使用以下流程通过外部和内部数据源进行枢轴分析。\n\n### 通过外部数据源进行枢轴分析\n\n我们通过开源外部数据源进行枢轴分析，以提取与 IP 地址相关的任何情报。以下步骤使我们能够通过公共来源对指标进行画像。我们旨在了解所选指标是否存在任何情报或警报/报告：\n\
  \n- 1. 执行 whois 查询以识别域名信息。您可以使用网络或命令行查询信息。我们已使用 whois 125.19.103.198 命令。注册信息是一个组织，并且\
  \ IP 地址附带电子邮件地址。IP 注册在印度。\n- 2. 使用 VirusTotal (https://www.virustotal.com/gui/)\
  \ 检查 IP 是否被标记。您可以在以下屏幕截图中看到 VirusTotal 的输出：\n\n![](img/d47f26598025b2da017dd41fcbb6e602_309_0.png)\n\
  \nFigure 10.2 – C2 IP 地址的 VirusTotal 输出\n\n三个安全杀毒软件将该 IP 标记为恶意——一个标记为可疑，如图 10.2\
  \ 所示。\n\nVirusTotal 还在 Details 和 Relations 下提供域名系统 (DNS) 和被动 DNS 信息。IP地址还与多个恶意文件（恶意软件文件）相关联。这表明如果\
  \ C2 IP 与组织之间曾经有过通信，我们很可能已被入侵。\n\n使用 VirusTotal 图表通过开源情报 (OSINT) 数据进行更多枢轴分析并分析不同外部指标之间的关系。\n\
  \n此时，我们已经知道报告的 C2 服务器与恶意活动相关。下一步是收集与系统通信的证据。我们可以通过分析内部流量来调查攻击。\n\n### 通过内部数据源进行枢轴分析\n\
  \n在通过公共来源对指标进行画像后，我们在内部进行枢轴分析以在系统中识别它。我们采取的步骤如下：\n\n- 1. 访问网络日志和流以检查内部主机与提供的 C2\
  \ 服务器之间的通信。**安全信息和事件管理 (SIEM)** 工具或 TI 平台由于其收集、聚合和关联内部流量的强大能力，非常适合此练习。然而，我们可以利用\
  \ **Wireshark** 或任何数据包分析器手动执行此类活动，过滤 IP 地址或域名。请考虑以下屏幕截图中显示的日志输出：\n\n| 时间戳 | 协议 |\
  \ 源IP | 源端口 | 目标IP | 目标端口 | 总字节数 | 连接状态 |\n|---|---|---|---|---|---|---|---|\n|\
  \ 2019-03-02 00:00:00 | tcp | 172.16.99.12 | 23786 | 125.19.103.198 | 655234 | 13,234,212.23\
  \ | FIN |\n| 2019-03-02 00:15:00 | tcp | 172.16.99.12 | 46786 | 125.19.103.198 |\
  \ 666234 | 65,145,022 | FIN |\n| 2019-03-02 01:00:00 | tcp | 172.16.99.12 | 6786\
  \ | 125.19.103.198 | 655234 | 13,234,212.23 | FIN |\n| ... | ... | ... | ... | ...\
  \ | ... | ... | ... |\n| [...] | [...] | [...] | [...] | [...] | [...] | [...] |\
  \ [...] |\n\nFigure 10.3 – 网络日志示例\n\n对于 Linux 系统中的日志文件，命令 `cat <logfile name> |\
  \ grep <IP address or domain>` 会显示文件内容，或您可以在 Windows 系统中运行 `type <logfile name>\
  \ | findstr \"<IP address>\"`。\n\n- 2. 使用 *nslookup* 工具揭示与 C2 服务器通信的主机的身份。前述系统日志显示一个\
  \ IP（172.16.99.12）与 C2 IP（125.19.103.198）通信。请考虑以下输出：\n\n```\nmisp@misp:~$ nslookup\
  \ 172.16.99.12\nServer:             192.168.8.1\nAddress:            192.168.8.1#53\n\
  \n10.0.1.216.in-addr.arpa    name = abc-webproxy-dmz.net\n```\n\nFigure 10.4 – nslookup\
  \ 输出\n\n涉及恶意通信的 IP 地址是组织的 Web 代理服务器。步骤 1 和 2 需要强调的是，Web 代理服务器可能已被入侵或用作混淆器，并且 C2\
  \ 具有超文本传输协议 (HTTP) 的性质。\n\n> **重要提示**\n> 如果外部情报可以确认 IP 或域名身份，发现 C2 通道（服务器）可能很容易。然而，如果您找不到外部情报来支持第三方报告或电子邮件，则必须查看心跳流特征。两个最重要的参数是时间戳模式（通信在哪个时间间隔启动）以及通信一致性，例如大小和带宽。因此，CTI\
  \ 分析师需要了解系统中恶意软件的基本行为。\n\n如果代理服务器涉及，如前所示，我们应分析代理日志，如以下步骤所述：\n\n- 1. 访问代理服务器日志以检查系统（客户端或主机）是否已向\
  \ C2 服务器发出请求。在格式良好的代理日志中，Linux 终端命令 `cat <logfile name> | grep <IP address or domain>`\
  \ 会提供包含 C2 服务器或域名的日志交易。\n\n假设您已使用 cat 命令查询了代理服务器日志。\n请考虑以下图中显示的查询结果：\n\n```\n192.168.8.4,\
  \ Stefan,-, Y, 2/3/19, 0:00:00, abc-webproxy-dmz.net, abc-webproxy-dmz.net, -, 125.19.103.198,\
  \ -, 21, 300, -, -, ftp, TCP, -, ftp://admin.test@125.19.103.198:21/sys/files/?query=.../\
  \ , DOC/RAR, VCache, 200, -\n192.168.8.14, Victor,-, Y, 2/3/19, 0:00:00, abc-webproxy-dmz.net,\
  \ abc-webproxy-dmz.net, -, 125.19.103.198, -, 21, 300, -, -, ftp, TCP, -, ftp://admin.test@125.19.103.198:21/sys/files/?query=.../\
  \ , DOC/RAR, VCache, 200, -\n192.168.8.23, Priyanka,-, Y, 2/3/19, 0:00:00, abc-webproxy-dmz.net,\
  \ abc-webproxy-dmz.net, -, 125.19.103.198, -, 21, 300, -, -, ftp, TCP, -, ftp://admin.test@125.19.103.198:21/sys/files/?query=.../\
  \ , DOC/RAR, VCache, 200, -\n192.168.8.4, Stefan,-, Y, 2/3/19, 0:15:00, abc-webproxy-dmz.net,\
  \ abc-webproxy-dmz.net, -, 125.19.103.198, -, 21, 300, -, -, ftp, TCP, -, ftp://admin.test@125.19.103.198:21/sys/files/?query=.../\
  \ , DOC/RAR, VCache, 200, -\n192.168.8.14, Victor,-, Y, 2/3/19, 0:15:00, abc-webproxy-dmz.net,\
  \ abc-webproxy-dmz.net, -, 125.19.103.198, -, 21, 300, -, -, ftp, TCP, -, ftp://admin.test@125.19.103.198:21/sys/files/?query=.../\
  \ , DOC/RAR, VCache, 200, -\n192.168.8.23, Priyanka,-, Y, 2/3/19, 0:15:00, abc-webproxy-dmz.net,\
  \ abc-webproxy-dmz.net, -, 125.19.103.198, -, 21, 300, -, -, ftp, TCP, -, ftp://admin.test@125.19.103.198:21/sys/files/?query=.../\
  \ , DOC/RAR, VCache, 200, -\n```\n\nFigure 10.5 – 代理日志示例\n\n\n\nWe identify the\
  \ compromised hosts' IP and names, as highlighted in the preceding screenshot (192.168.8.4,\
  \ 192.168.8.14, and 192.168.8.23). These hosts have communicated with the C2 server\
  \ (125.19.103.198). We also see a File Transfer Protocol (FTP) URL used during communication\
  \ (ftp://admin.test@125.19.103.198:21/sys/files/?query=.../), with the object's\
  \ Multipurpose Internet Mail Extension (MIME) set to DOC/RAR files (possible file\
  \ exchange using FTP).\n\n- 2. Compare the results of the different internal analyses.\
  \ Ensure that Step 3 matches and confirms the findings in Step 1. For example, we\
  \ see that timestamp patterns in Step 1 match the proxy server logs in Step 3. In\
  \ that case, this is a good indication of a potential compromise and validation\
  \ of the third-party report. We need to involve the incident response (IR) and forensics\
  \ teams. However, there is still analysis we need for more evidence. A comparison\
  \ between Step 1 and Step 3 is shown in the following screenshot:\n\n![](img/d47f26598025b2da017dd41fcbb6e602_312_0.png)\n\
  \nFigure 10.6 – Matching the network and proxy logs' timestamps\n\nAdversaries often\
  \ leverage the most common layer 5 protocols to bypass security measures (proxies,\
  \ firewall, and intrusion detection system (IDS) rules) and establish stealth communication\
  \ with the compromised system, and in most security configurations, the three protocols\
  \ that are given the most freedom to communicate with the outside world include\
  \ HTTP (web traffic), DNS (address resolution), and Simple Mail Transfer Protocol\
  \ (SMTP) (mail services). However, adversaries also use protocols such as Secure\
  \ Shell (SSH), Remote Desktop Protocol (RDP), tunneling, —therefore, as a CTI analyst,\
  \ you should be familiar with each of them. Refer to the Adversarial Tactics, Techniques,\
  \ and Common Knowledge (ATT&CK) Command and Control tactic (https://attack.mitre.org/tactics/TA0011/)\
  \ to familiarize yourself with commonly used C2 techniques.\n\n## Classifying the\
  \ intelligence according to CTI frameworks\n\nAfter pivoting through the external\
  \ and internal data to confirm and evaluate the security issue, we need to situate\
  \ the intrusion in a framework. We can use the Diamond model, the Cyber Kill Chain,\
  \ or the MITRE ATT&CK framework for such a task, or we can use all of them. The\
  \ main goal is to understand where you are in the analysis, identify the gap, and\
  \ set the next step. Proceed as follows:\n\n- 1. Classify intelligence with the\
  \ Diamond model. We have found and confirmed the C2 server, which is the infrastructure\
  \ used by the adversary. We have also identified victims in the system. Now, the\
  \ gap involves the tactics, techniques, and procedures (TTPs) and the adversary,\
  \ as shown in the following screenshot:\n\n![](img/d47f26598025b2da017dd41fcbb6e602_313_0.png)\n\
  \nFigure 10.7 – Initial Diamond model for our intrusion\n\n- 2. Classify intelligence\
  \ using the kill chain. We have *discovered* the C2 information. There is not much\
  \ information to fill in the kill chain, but we have one crucial component. We can\
  \ start building a COA matrix, as shown in the following screenshot:\n\n| Course\
  \ of Action | Discovery | Detect | Deny | Disrupt | Degrade | Deceive | Destroy\
  \ |\n|---|---|---|---|---|---|---|---|\n| Kill chain phases |  |  |  |  |  |  |\
  \  |\n| Reconnaissance |  |  |  |  |  |  |  |\n| Weaponization |  |  |  |  |  |\
  \  |  |\n| Delivery |  |  |  |  |  |  |  |\n| Exploit |  |  |  |  |  |  |  |\n|\
  \ Install |  |  |  |  |  |  |  |\n| Command & Control (C2) | 125.19.103.198 |  |\
  \  |  |  |  |  |\n| Actions |  |  |  |  |  |  |  |\n\nFigure 10.8 - Initial Cyber\
  \ Kill Chain: discovery COA\n\nWe need to dig further to fill in the chain.\n\n\
  - 3. Analyze the URLs and pivot more on common indicators. By analyzing the proxy\
  \ logs content, we find another URL used for communication. While the URL arguments\
  \ differ, the directory path is the same: /sys/files/. We pivot through the proxy\
  \ logs, searching for /sys/files/ patterns in all web transactions, not in the 125.19.103.198\
  \ communication. A typical Linux command would be `cat log.txt | grep -F \"/sys/files/\"\
  \ | grep -vF '125.19.103.198'`. Consider the following logs output:\n\n```\n192.168.8.15,\
  \ Yan, -, Y, 2/3/19, 0:00:00, abc-webproxy-dmz.net, abc-webproxy-dmz.net, -, 46.168.5.140,\
  \ -, 80, 300, -, -, http, TCP, GET,\nhttp://46.168.5.140/sys/files/dom?par=Qs56ytMkdr\
  \ uog/, FILE/EXE, VCache, 200, -\n192.168.8.15, Yan, -, Y, 2/3/19, 1:00:00, abc-webproxy-dmz.net,\
  \ abc-webproxy-dmz.net, -, 46.168.5.140, -, 80, 300, -, -, http, TCP, GET,\nhttp://46.168.5.140/sys/files/dom?par=Qs56ytMkdr\
  \ uog/, FILE/EXE, VCache, 200, -\n192.168.8.15, Yan, -, Y, 2/3/19, 2:00:00, abc-webproxy-dmz.net,\
  \ abc-webproxy-dmz.net, -, 46.168.5.140, -, 80, 300, -, -, http, TCP, GET,\nhttp://46.168.5.140/sys/files/dom?par=Qs56ytMkdr\
  \ uog/, FILE/EXE, VCache, 200, -\n```\n\nFigure 10.9 – Additional indicator after\
  \ pivoting\n\nAnother activity with the same indicator reveals another infrastructure\
  \ (46.168.5.140), a new victim, and an executable MIME file (FILE/EXE)—a potential\
  \ malware. A GET HTTP method shows a sign of action over the C2 channel, which belongs\
  \ to the last phase of the Cyber Kill Chain.\n\n- 4. Update the Diamond model and\
  \ Cyber Kill Chain frameworks with the newly found indicators. We update the C2\
  \ discovery in the kill chain by adding the new IP address and TTPs. Three Diamond\
  \ model's vertices have been identified (victim, infrastructure, and capability).\
  \ We need more analysis and intelligence to fill in the remaining vertex.\n\nThe\
  \ analysis performed so far has helped identify some stages of the CTI frameworks\
  \ we have used. However, the kill chain is still almost empty, and the COA matrix\
  \ has not been completed yet. It is essential to fill the kill chain to identify\
  \ gaps in intelligence and prioritize actions. Since we have identified the presence\
  \ of the C2 server in the system, we need to assess if there has been an actual\
  \ breach (action).\n\n## Pivoting into network actions\n\nThe objective is to find\
  \ indicators for stage 7 of the kill chain to understand the extent of the threat.\
  \ What we do is perform timely analysis. As described in the following steps, we\
  \ pivot through the network and the host (involving a bit of host-based forensics):\n\
  \n- 1. Perform victim infrastructure pivoting and check for any FTP/HTTP/SMTP activity\
  \ in the outbound direction. In FTP, we check Transmission Control Protocol (TCP)\
  \ ports 20 (mainly used for data transfer) and 21 (used primarily for connection\
  \ establishment) in the monitoring logs. Consider the following output:\n\n```\n\
  Timestamp          SrcIpAddr    DestIpAddr      SPort DPort TotPackets TotBytes\
  \    State\n2019-03-05 00:10:00 192.168.8.4   125.19.103.198  53678 21    1025448\
  \    1048432448  FIN\n2019-03-06 00:10:00 192.168.8.14  125.19.103.198  53678 21\
  \    1025448    1048432448  FIN\n2019-03-06 02:10:00 192.168.8.23  125.19.103.198\
  \  53678 21    1025448    1048432448  FIN\n2019-03-07 00:10:00 192.168.8.15  125.19.103.198\
  \  43567 21    2064148    2548432448  FIN\n```\n\nFigure 10.10 – Host pivoting activity\
  \ log\n\nThe preceding screenshot shows over 1 gigabyte (GB) of data sent to a remote\
  \ server at 125.19.103.198 from three IP addresses and over 2.5 GB sent from the\
  \ last IP host.\n\n**Important Note**\nAn external data transfer of a significant\
  \ magnitude (in the order of GB) should be flagged by efficient network monitoring\
  \ tools. However, such transfer could appear standard for organizations where clients\
  \ download large files, such as gaming software companies. For example, customers\
  \ download games of over 15 GB once-off on **EA Sports** servers worldwide. An *obfuscated*\
  \ data transfer of 5 GB *can* escape security.\n\n- 2. If packet capture is done\
  \ through passive or active monitoring, access the raw **protocol data units (PDUs)**\
  \ to analyze protocol information. Wireshark is one of the best tools for such a\
  \ task. Note that if *Secure FTP (SFTP) is used instead of plain FTP, it can become\
  \ complicated to view the transfer content.* Consider the simple raw data message\
  \ shown in the following screenshot:\n\n```\nnumber time source destination prot.\
