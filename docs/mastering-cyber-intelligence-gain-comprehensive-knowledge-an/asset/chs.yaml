  \ STIX/TAXII 服务器，(1) 选择您想要共享的所有可观测数据或指标，然后 (2) 单击 **Push Observable** 按钮，如下图所示：\n\
  \n![](img/d47f26598025b2da017dd41fcbb6e602_475_0.png)\n\n图 15.13 – 已批准的可观测数据和共享配置\n\
  \n集合信息页面打开。您需要插入名称、描述、推送频率，最重要的是 IOC 被推送到的 STIX/TAXII 站点。PUSH OBSERVABLES 窗口显示在以下图中：\n\
  \n![](img/d47f26598025b2da017dd41fcbb6e602_476_0.png)\n\n图 15.14 – STAXX PUSH OBSERVABLES\
  \ 窗口\n\n我们的 IOC 被推送到 LIMO STIX/TAXII 服务器，社区的其余成员可以使用共享的威胁情报来增强其安全态势。\n\nAnomali\
  \ STAXX 是一个强大的基于 STIX 的 CTI 共享平台。本节展示了设置 Anomali STAXX 客户端并连接到 STIX/TAXII 服务器进行威胁情报共享的基本步骤。有关收集、配置和管理\
  \ Anomali STAXX 客户端的更多信息，请参阅随 OVA 文件提供的《安装和管理员指南》文档。\n\n请注意，一级（入门级 CTI）和二级（中级 CTI）组织可以利用\
  \ STAXX 和恶意软件信息共享平台（MISP）进行经济高效的威胁情报应用。\n\n## 用例三 – 通过平台共享情报\n\n共享威胁情报对于全球打击网络攻击至关重要。CTI\
  \ 分析师共享 IOC 以揭露威胁行为者的活动。威胁情报共享平台对于有效的情报协作至关重要。它们还有助于流程自动化。\n\n**用例场景：** 对于已执行的入侵分析，您需要将结果发布到一个或多个平台，以增强安全社区的能力。这将使社区能够丰富和更新威胁和\
  \ IOC 数据库。\n\n**用例目标：** 该用例的目标是通过开源情报共享平台展示威胁情报共享。我们只会选择一个共享平台。然而，CTI 分析师需要调查其他平台。\n\
  \n我们需要共享的 IOC 包括两个 IP 地址、一个域名和一个 MD5 哈希键：分别为 `125.19.103.198` 和 `46.158.5.140`、`resoh.ru`\
  \ 和 `12cf6583f5a9171a1d621ae02b4eb626`。\n\n**使用的平台：** AlienVault **Open Threat Exchange\
  \ (OTX)**\n\nAlienVault OTX 在 *第 12 章，SIEM 解决方案和情报驱动的 SOC* 中介绍过。CTI 分析师可以利用它以 *脉冲*\
  \ 的形式共享威胁和入侵分析。以下步骤用于解决此用例。请注意，其中一些步骤不会重复，因为我们假设 CTI 分析师已在 *第 12 章，SIEM 解决方案和情报驱动的\
  \ SOC* 中完成它们：\n\n- 1. **登录 AlienVault OTX：** 导航到 https://otx.alienvault.com 并使用有效凭据登录\
  \ OTX。如果您没有有效凭据，请在提供的链接上免费开设账户。\n- 2. **创建新脉冲：** (1) 在菜单栏上单击 **Create Pulse** 以创建新脉冲。脉冲创建页面打开。选择一种方法将\
  \ IOC 添加到脉冲中。您可以 (2) 输入文本或插入 URL，(3) 附加文件，或 (4) 手动添加指标。脉冲创建页面显示在 *图 15.15* 中。\n\n\
  对于此用例，我们将选择文本输入类型。将所有 IOC 复制并粘贴到字段 (4) 中，如图所示。OTX 提取工具将自动提取 IOC。添加文本后，(5) 单击 **Extract\
  \ Indicators** 按钮以填充 IOC。\n\n图 15.15 为视觉清晰度而被截断。仅显示与此点相关的部分：\n\n![](img/d47f26598025b2da017dd41fcbb6e602_478_0.png)\n\
  \n图 15.15 – AlienVault OTX 脉冲创建页面 – 输入字段\n\n3. 验证已填充的 IOC：向下滚动到 IOC 部分以查看同一页面上的已填充指标。输出显示在以下图中：\n\
  \n![](img/d47f26598025b2da017dd41fcbb6e602_478_1.png)\n\n| 类型 | 指标 | 角色 | 标题 |\n\
  |---|---|---|---|\n| IPv4 | 46.158.5.140 | scanning_host |  |\n| FileHash-MD5 |\
  \ 12cf6583f5a9171a1d621ae02b4eb626 |  | MS_Visual_Cpp_2005 |\n| FileHash-SHA1 |\
  \ 61ed2778d7669d6838523369fd04278626303362 |  | MS_Visual_Cpp_2005 |\n| FileHash-SHA256\
  \ | 5b136147911b04f1f012ce82dfd24c4e2c79553b65d3240ecea2dcab4452dcb5 |  | MS_Visual_Cpp_2005\
  \ |\n| IPv4 | 125.19.103.198 |  |  |\n| Domain | resoh.ru |  |  |\n\n图 15.16 – AlienVault\
  \ OTX 已填充 IOC 的 IOC 视图\n\n一些值得考虑的有趣事实是，我们输入了四个 IOC，但 OTX 填充了六个 IOC。它自动添加了恶意文件的 SHA1\
  \ 和 SHA256 键。哈希键自动被赋予标题：MS_Visual_Cpp_2005，并且平台建议了与提取的 IOC 相关的另外七个 IOC，如下图所示。OTX\
  \ 会自动将 IOC 与其他 CTI 分析师共享的威胁情报相关联：\n\n| 类型 | 指标 |\n|---|---|\n| URL | http://125.19.103.198:8080/zb/v_01_c/in/\
  \ |\n| URL | http://125.19.103.198:8080/zb/v_01_a/in/ |\n| URL | http://125.19.103.198:8080/zb/v_01_a/in\
  \ |\n| URL | http://125.19.103.198:8080/ |\n| Domain | semelyontour.ru |\n| Domain\
  \ | dpasssjufjkaksss.ru |\n| Domain | copsdifbnsasdf.ru |\n\n图 15.17 – 与提取的 IOC\
  \ 自动关联的额外 IOC\n\n另外两个域名和四个 URL 与我们的 IOC 关联。您应将鼠标悬停在每个建议的 IOC 上以将其添加到提取的 IOC 中。您还可以使用新发现的\
  \ IOC 扫描 ABC 公司的系统以查找额外的恶意活动。\n\n- 4. **填写脉冲详细信息**：OTX 允许您添加详细信息，例如 TLP 颜色、脉冲标题、描述、对手、标签、组、行业、目标国家、恶意软件家族和\
  \ ATT&CK 技术 ID。\n\n\n\n5. **提交脉冲：** 你可以公开分享脉冲或将其保留为私有脉冲。对于本练习，我们将保持其为私有。创建并共享的脉冲如下图所示：\n\
  \n![](img/d47f26598025b2da017dd41fcbb6e602_480_0.png)\n\n图 18 – AlienVault OTX 上的共享脉冲\n\
  \n脉冲通过 OTX 平台共享。如果设置为公开，社区可以添加共享的 IOC 以增强其端点安全。\n\n我们已成功通过 AlienVault OTX 创建并共享了一个脉冲。安全专业人员广泛使用\
  \ AlienVault OTX。因此，CTI 分析师应熟悉它——它是完全开源的。\n\nCTI 分析师可以使用许多威胁情报共享平台来对外传播情报。虽然某些平台需要订阅，但其他平台是开源的。本书无法演示所有平台。然而，你可以研究其他平台，例如完全开源的\
  \ MISP、提供免费版本的 **IBM X-Force Exchange**（不过，要获得更多功能，你需要升级账户），以及 **Blueliv Threat\
  \ Exchange Network**。该列表并非详尽无遗或排他性。因此，作为 CTI 分析师，你可能会遇到其他优秀的威胁情报共享平台。最重要的是理解并适应你选择使用的产品。\n\
  \n## 理解和执行威胁归因\n\n威胁归因对于了解对手的活动以及组织可能面临的威胁非常重要。与依赖事实（证据）的威胁和入侵分析相反，对手归因基于评估，如下述入侵分析的\
  \ **钻石模型** 所总结：\n\n![](img/d47f26598025b2da017dd41fcbb6e602_481_0.png)\n\n图 15.19\
  \ – 用于威胁归因的钻石模型\n\n我们利用 **战术、技术和程序 (TTP)**、**受害者** 和 **基础设施** 将威胁或攻击归因于 *特定组织、活动，*\
  \ 和 *行为者*（包括 *国家行为者*）。由于威胁归因基于评估，因此必须考虑进行评估时的置信水平。置信度评估必须得到证据和事实的支持（IOC、对手意图、能力和机会）。置信度评估级别对于\
  \ *用例 4、5，* 和 *6* 至关重要，解释如下：\n\n- **高置信度评估**：置信水平在有强有力证据且没有矛盾事实支持评估时为高。例如，假设在入侵分析期间，你发现的\
  \ IOC 和 TTP 与网络杀伤链模型中超过两个阶段的 X 活动中的其他入侵相关联。在这种情况下，你可以 *高置信度* 地说攻击与活动 X 有关。\n- **中等置信度评估**：置信水平在有足够证据但仍有讨论余地时为中等。例如，假设你正在追踪活动\
  \ X，在入侵分析期间，你发现 IOC 和 *一些* TTP 与该活动在网络杀伤链的多个阶段相关。然而，其他 TTP 与之不相关。在这种情况下，你可以 *中等置信度*\
  \ 地说攻击与活动 X 有关。\n- **低置信度评估：** 置信水平在证据很少且存在有效陈述和假设来挑战评估时为低。IOC 与杀伤链模型的一个阶段中的活动相关联的入侵分析是典型例子。使用\
  \ spearphishing 配合 Microsoft Office 和 RAR 附件作为投递方式的攻击并不意味着它与 APT28 或 Sofacy 组织有关。\n\
  \n评估可以表示为方程，给出以下表达式：\n\n*评估 = 置信水平 + 分析 + 证据 + 来源*\n\nCTI 分析师依赖支持数据使评估可信。因此，了解正在执行的归因类型至关重要——它取决于\
  \ CTI 分析师（或团队）正在追踪的内容。然而，请注意，威胁和攻击归因并非简单的任务。它需要时间进行分析、形成假设并收集证据以支持评估。在本节中，我们将简明扼要地提供归因概念的骨架。\n\
  \n> **重要说明 – 国家行为者追踪**\n> \n> 国家行为者不应被组织轻视。它们提供了大量关于威胁的见解，这些威胁可能间接或直接与你的组织相关。CTI\
  \ 分析师如果其利益与客户没有重叠，往往会忽视它们。然而，你永远不知道你的组织何时会成为国家行为者的目标，尤其是出于 *间谍活动、商业机密窃取* 和 *政治经济*\
  \ 目的。因此，追踪它们很重要。然而，组织应通过优先考虑要追踪的威胁和行为者来平衡被攻破的风险与被攻破的成本——你无法追踪所有 APT。\n\n在以下用例中，我们将了解\
  \ CTI 分析师如何利用威胁分析结果实际构建活动组。\n\n## 用例四 – 从威胁分析构建活动组\n\n识别组织、活动和威胁行为者对于追踪组织内的网络活动至关重要。我们可以使用已进行的入侵分析和\
  \ ACH 的组合来构建活动组。本用例的目标是提供一个框架，利用网络杀伤链和钻石模型创建威胁活动组。\n\n用例场景：你是一家 ABC 公司的 CTI 分析师，已进行了多次入侵分析。你被要求识别\
  \ ABC 应监控的威胁组织以保护系统。此外，你还收到了来自同行（外部情报）和安全运营中心（SOC）团队的威胁信息。提供的处理信息如下图所示：\n\n入侵分析\
  \ 1\n受害者：银行\n\n| 杀伤链阶段 | 分析 |\n|---|---|\n| 侦察 |  |\n| 武器化 |  |\n| 投递 |  |\n| 利用\
  \ | Hook 运行进程 |\n| 安装 | 3PARA RAT 恶意软件 |\n| 命令与控制 | 受损 IP 地址和域名，Meterpreter 后门 |\n\
  | 行为 | 个人信息窃取 |\n\n入侵分析 2\n受害者：保险公司\n\n| 杀伤链阶段 | 分析 |\n|---|---|\n| 侦察 |  |\n| 武器化\
  \ |  |\n| 投递 |  |\n| 利用 | CVE-2021-45105 |\n| 安装 | 4H RAT |\n| 命令与控制 | Meterpreter\
  \ 后门，端口 8080 |\n| 行为 | 拒绝服务 (DoS)，Meterpreter 后门文档外泄 |\n\n入侵分析 3\n受害者：能源公司\n\n|\
  \ 杀伤链阶段 | 分析 |\n|---|---|\n| 侦察 |  |\n| 武器化 |  |\n| 投递 |  |\n| 利用 |  |\n| 安装 | COM\
  \ 脚本小程序，下载 Cobalt Strike 信标 |\n| 命令与控制 | 编码域名 |\n| 行为 | 通过开放的 C2 通道外泄合同信息 |\n\n\
  入侵分析 4\n受害者：保险公司\n\n| 杀伤链阶段 | 分析 |\n|---|---|\n| 侦察 |  |\n| 武器化 |  |\n| 投递 | 恶意\
  \ MS Office 文档的 spearphishing |\n| 利用 | 用户执行（社会工程） |\n| 安装 |  |\n| 命令与控制 |  |\n\
  | 行为 |  |\n\n图 15.20 – 同行提供的用于活动组设置的分析结构化示例\n\n第 14 章《威胁情报报告与传播》涵盖了构建和理解对手活动的 fundamentals。那些\
  \ fundamentals 包括过去的威胁和入侵分析、外部情报分析、过去的指标和数据、应对措施以及未来入侵属性。我们假设过去的分析以图 15.20 中提供的结构化信息形式可用。\n\
  \n根据本用例的要求，构建活动并追踪威胁组织的简单流程如下：\n\n- 1. **识别潜在的唯一活动组**：检查钻石模型中的常见元素，如受害者和能力（TTP）。我们可以看到入侵\
  \ 1 和入侵 2 共享相同的受害者（银行和保险公司都与金融行业相关），并且都利用 Metasploit 后门。入侵 4 与入侵 1 和 2 共享相同的受害者，但没有提供能力的证据。入侵\
  \ 3 针对不同的行业并采用不同的 TTP。因此，我们可以识别出三个需要监控的唯一组。\n- 2. **提取与组织关联的活动组**：ABC 是一家金融服务提供商。因此，入侵集\
  \ 1 和 2 与组织直接相关。然而，入侵 4 可能是感兴趣的，因为它也针对金融部门。\n- 3. **突出信息和分析中的差距**：识别可能有助于构建令人信服的威胁行为者和活动追踪的缺失信息。识别活动组的大多数决策基于钻石模型的两个顶点（受害者和能力）。重要的是关注并考虑剩余的顶点（基础设施）以了解攻击的物理和逻辑结构。入侵\
  \ 4 不完整。分析师应请求更多信息以填补网络杀伤链的剩余阶段。\n\n在这种情况下，分析师已识别出三个初始的唯一活动组进行监控。然而，我们可以根据目标受害者模式创建两个活动。两个活动组针对相同的受害者概况——金融行业。仅使用了四次入侵来解释分析师在构建活动组时将考虑的概念和步骤。然而，在现实生活中，一个组织可能拥有数百个结构化分析可供构建。\n\
  \n\n\n## 用例五 – 将分析与活动组关联\n\n一旦你创建了活动组或战役以便随时间监控，就必须将分析与这些活动关联起来。最佳实践是将分析与活动组或战役关联起来，是构建表格并使用网络杀伤链和\
  \ Diamond 模型框架对指标进行分类。让我们考虑图 15.1 中的杀伤链分析。活动组监控的证据分类显示在下图中：\n\n| 杀伤链阶段 | Diamond\
  \ 模型元素 | 行动过程（发现） | 活动组 1（入侵 1 & 2） | 活动组 2（入侵 4） | 活动组 3（入侵 3） |\n|---|---|---|---|---|---|\n\
