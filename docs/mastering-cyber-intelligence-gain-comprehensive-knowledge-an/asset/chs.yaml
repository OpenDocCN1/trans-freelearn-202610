- "# 精通网络情报：获得全面知识和技能以开展威胁情报，实现有效系统防御\n\n\n\n\n致我的父亲 Muwawa Salam Tjoppen 和我的母亲 Isamanga\
  \ Olwey Therese，感谢他们的牺牲和灌输给我的价值观。怀念我的小弟 Muwawa Legi Yao Bob。感谢我的家人给予的支持。感谢上帝赐予生命，让我能够继续努力工作、怀抱希望和梦想。\n\
  \n- Jean Nestor M. Dahj\n\n## 贡献者\n\n## 关于作者\n\nJean Nestor M. Dahj 是一位经验丰富的数据科学家、网络安全研究员和分析师，以及拥有广泛技术和科学能力的电信专业人士。他的技能使他从事数据科学、网络探测、渗透测试和黑客攻击、威胁情报和网络分析等领域的工作。他通过经验、培训和咨询积累了广泛的技能，包括密码学、计算机取证、恶意软件设计与分析以及数据产品开发等技能。\n\
  \nJean Nestor 拥有南非大学电气工程硕士学位（M-Tech）。他目前正在南非约翰内斯堡大学攻读同一领域的博士学位。他的工作经历包括华为技术、Commprove\
  \ Technologies、Siftcon Forensic Services、Metro Teleworks 以及他共同创立的 Nanofritech Consulting\
  \ & Research Lab。他目前是 Rain Networks 的全栈数据科学家，隶属于一个提供和开发各种数据解决方案的动态团队。\n\n他目前居住在南非比勒陀利亚，原籍刚果民主共和国的小城基克维特。\n\
  \n*特别感谢所有在撰写这本精彩书籍的过程中支持我的人。*\n\n## 关于审阅者\n\n**Max van Kralingen** 是一名网络威胁情报顾问，特别擅长威胁行为者画像、网络融合中心、OSINT\
  \ 调查、MITRE 的 ATT&CK 框架、社会工程以及入侵和攻击模拟。他拥有政治学学士学位、安保与情报研究硕士学位以及高级安全与数字取证研究生文凭。\n\n\
  > *我谨向我的 wonderful 父母致谢。我的母亲，给予我对调查、对话、哲学、心理学以及 Lord of The Rings 的热爱。我的父亲，给予我对历史、政治和\
  \ Dire Straits 的热爱。最后，献给我的生命中两位最具影响力的老师，他们在我身上看到了我将成为的样子。John Carnegie，感谢故事、代码和\
  \ Star Trek。Julian Richards，感谢情报分析的艺术与科学。*\n\n## 前言\n过去二十年中安全漏洞和攻击的增加表明，传统的网络安全防御方法已不足够。攻击的复杂性——例如\
  \ **高级持续性威胁** (**APTs**)——即使组织在往往各自为政的安全工具上投入了大量资金，仍让组织感到更加担忧。缺乏分析技能、将安全融入流程的困难以及结构化安全分析的差距，是对抗增强型网络威胁的主要关注点。\n\
  \n**网络威胁情报** (**CTI**) 是一种协作式安全计划，它使用从多个来源（内部和外部）收集的数据进行高级分析，以发现、检测、拒绝、破坏、降级、欺骗或摧毁对手的活动。由于其具有可操作性并鼓励社区成员、个人等之间进行信息共享，它正成为对抗\
  \ APTs 的事实标准方法。然而，许多组织仍在努力将 CTI 整合到其现有安全解决方案中并从中获取价值。\n\n本书 *掌握网络情报* 提供了深入 CTI 世界所需的知识。它为你提供了从规划到传播和反馈处理进行威胁情报计划所需的理论和实践技能。它详细介绍了可从零开始将\
  \ CTI 集成到组织安全堆栈中的策略，从而让你能够有效应对网络威胁。\n\n通过逐步的解释和示例，你将学习如何将 CTI 定位在组织战略和计划中，并为你的 CTI\
  \ 计划设定目标，收集适合你计划的数据，处理和格式化收集到的数据，进行威胁建模和威胁分析，并将情报输出在内部（与战略、战术和运营安全团队）以及外部（与社区）共享。读完本书后，你将精通\
  \ CTI，并有信心帮助组织实施它以保护收入、资产和敏感信息（和数据）。\n\n\n\n## 本书适合谁\n\n本书适合具备基础安全监控、打算从零开始采用网络威胁情报但不知从何入手的组织；具备良好安全基础设施、打算将威胁情报集成到安全体系中以实现最佳安全态势的组织；或已拥有良好的威胁情报项目、打算增强\
  \ TTP 优先级排序、防御技术和威胁追踪的组织。\n\n它也适用于希望学习并掌握网络威胁情报并帮助组织制定 CTI 战略的安全专业人员；具备理论知识并希望增加一些实践\
  \ CTI 技能的人员；或希望通过准备专业 CTI 认证（如 SANS FOR578 CTI 和 EC-Council CTIA）来提升职业生涯的人员——本书是完美的起点，因为它涵盖了这些课程大纲中的大部分主题。\n\
  \n## 本书涵盖内容\n\n第1章 *网络威胁情报生命周期* 讨论了 CTI 项目实施涉及的步骤，包括规划、目标和方向；数据收集；数据处理；分析和生产；传播；以及反馈。它对每个步骤提供了高层次概述，并附带一些示例以帮助您理解需要完成的工作。本章强调了威胁情报的好处及其在防御现代、复杂的攻击（如\
  \ APTs）中的作用。它为您提供了规划项目并设定方向所需的知识。\n\n第2章 *需求与情报团队实施* 讨论威胁情报需求生成和任务优先级排序。它展示了如何使用军事和战争中使用的先进方法为您的项目生成可靠的情报需求。作为\
  \ CTI 生命周期规划阶段的一部分，本章讨论了团队布局以及如何获取启动项目所需的正确技能集。最后，通过本章，您将了解 CTI 如何与其他安全体系单元相关联。\n\
  \n第3章 *网络威胁情报框架* 介绍了您作为 CTI 分析师可用于威胁情报项目的不同框架。它强调了其优势并讨论了三种最受欢迎的威胁情报框架——网络杀伤链、MITRE\
  \ ATT&CK 和入侵分析框架的钻石模型。通过示例，本章还展示了每个框架如何应用于威胁和入侵分析。\n\n第4章 *网络威胁情报工艺与标准* 讨论了分析师可应用于\
  \ CTI 项目的分析工艺和标准。它强调了在威胁情报中使用通用语言和流程的好处。本章教授您如何将已建立的分析工艺和标准应用于 CTI 项目以提高其成功几率。本章讨论的一些分析工艺和标准包括美国\
  \ **中央情报局的 (CIA)** 分析工艺笔记汇编、**情报界指令 (ICD) 203**、**空军指令 (AFI) 14-133**，以及它们在 CTI\
  \ 中的应用。本章还实际描述了两个重要的协作标准，即 **结构化威胁信息表达 (STIX)** 和 **可信自动化指标信息交换 (TAXII)**。\n\n第5章\
  \ *目标设定、CTI战略程序与实用案例* 从实践角度演示如何将 CTI 集成到组织的安全概况中。它介绍了 **威胁情报平台 (TIPs)**（CTI 的必备工具）并提供了选择合适\
  \ TIP 的指南。您将了解开源和付费情报平台，以及哪一种更适合您。本章使用实际案例研究展示了 1 级、2 级和 3 级组织（CTI 新手、具备特定 CTI 知识的组织以及拥有\
  \ CTI 项目的组织）如何有效拥抱 CTI 并设定目标。作为分析师或 CTI 团队的一员，您可以使用本章所述的方法在组织内启动 CTI 项目。\n\n第6章\
  \ *网络威胁建模与对手分析* 讨论威胁的战略建模和对手行为分析。它为您提供了执行手动和自动威胁建模所需的理论和实践知识。您将学习不同的威胁建模方法论（附示例）、**用户行为逻辑\
  \ (UBA)** 和对手分析技术。读完本章后，您将能够为组织执行威胁建模。\n\n第7章 *威胁情报数据源* 讨论了不同的威胁情报来源以及在哪里找到数据。进行\
  \ CTI 时，您需要数据，而且大多数时候需要大量数据。本章涵盖三种数据源类型：开源（OSINT 或 OTI）、共享（STI）和付费（PTI）威胁情报来源。它为您提供了根据\
  \ CTI 需求、组织预算和运营策略为项目选择合适数据源所需的知识。您将学习数据源选择和评估、恶意软件数据源、解析以及 CTI 分析。您还将了解共享和付费威胁源的好处。最后，您将学习情报数据结构化和存储。\n\
  \n第8章 *有效防御战术与数据保护* 讨论如何构建强大的防御系统以防止和遏制网络攻击。它详细说明了实现可靠数据保护的最佳实践。在本章中，您将学习通过评估当前网络威胁防御基础设施中的漏洞并应用适当的防御战术来执行\
  \ **保密性、完整性和可用性 (CIA)**；CTI 中的数据监控和主动分析；现代系统保护中的漏洞评估和风险管理；使用加密、标记化、掩码和其他混淆方法使对手难以操作；最后，端点管理。\n\
  \n第9章 *网络威胁分析中的人工智能应用* 讨论 **人工智能 (AI)** 如何帮助从被动威胁情报项目转向主动威胁情报项目以领先于对手。本章教授您 AI 驱动的\
  \ CTI 以及它如何在安全方面产生差异。您将学习网络威胁狩猎、如何执行它并将其集成到安全运营中以预测攻击并确保有效防御。您将了解将威胁狩猎与威胁情报相结合以实现可靠保护的好处。您将学习\
  \ AI 对对手攻击和程序增强的影响。最后，您将获得将 AI 置于 CTI 和组织安全体系中以最大化其价值的知识和技能。我们以 IBM QRadar 为例说明\
  \ AI 如何增强安全功能和工具。\n\n第10章 *威胁建模与分析 - 实用案例* 是一个动手实践的章节，教授您如何使用 CTI 手动和自动执行入侵分析。它展示了\
  \ CTI 分析师如何从接收或发现的 **入侵指标 (IOC)** 开始，了解入侵的程度。在本章中，您将学习如何收集和情境化 IOC。您还将学习如何在数据源之间进行横向扩展并使用情报框架进行分析。您将获得执行基本内存和磁盘分析以提取证据解决网络犯罪的技能。您将获得收集恶意软件数据、为案例执行基本恶意软件分析、填写网络杀伤链矩阵并提取对手\
  \ **战术、技术和程序 (TTPs)** 的技能。最后，您将学习如何使用开源 **恶意软件信息共享平台 (MISP)** 进行分析和情报数据存储。\n\n第11章\
  \ *可用性安全：威胁情报作为流程的一部分* 讨论威胁情报如何应用于业务运营以及系统（软件和硬件）开发的安全。作为分析师，本章为您提供了评估、建议并协助将 CTI\
  \ 纳入组织从构思阶段开始开发的产品和服务所需的知识。您将学习如何在身份验证应用中使用威胁分析输出，使用威胁建模将健全的策略纳入系统开发和业务运营，应用心理模型以改善威胁防御，最后，考虑到网络威胁实施安全的系统架构。\n\
  \n\n\n*第12章，SIEM 解决方案与智能驱动的 SOC，* 讨论了 CTI 在 SIEM 工具和 SOC 中的重要性。它解释了在 SIEM 解决方案中集成情报的过程。本章演示了\
  \ SIEM 工具如何包含并关联来自多个 feed 和来源的数据以提供自动化情报。本章向您展示如何自动化和统一 SOC 操作以实现主动和被动防御。您将学习如何使用威胁情报优化\
  \ SOC 团队的性能。您还将学习如何将威胁分析模型集成到 **事件响应 (IR)** 以最小化 **平均响应时间 (MTTR)**。您将获得使用开源 SIEM\
  \ 和情报共享平台作为起点的实践知识，例如 AlienVault 的 **开放威胁交换 (OTX)** 和 **开源安全信息和事件管理 (OSSIM)**。您将学习情报驱动的渗透测试和事件响应。最后，您将学习如何使您组织的\
  \ SOC 智能化。\n\n*第13章，威胁情报指标、入侵指标和痛苦金字塔，* 讨论了用于情报评估和计划有效性的安全指标。它还向您展示如何根据情报计划的输出评估您的\
  \ CTI 团队。本章随后解释了 IOC、痛苦金字塔及其在 CTI 分析师个人资料中的各自重要性。在本章中，您将了解 CTI 指标以及它们如何用于定义计划成功标准。您将了解\
  \ IOC 的重要性、其类别以及如何在系统中识别它们。您将获得有关痛苦金字塔及其在 CTI 中应用的有效知识。您还将学习如何在威胁分析用例中应用 Kill Chain\
  \ 的七个 Ds（行动方案）。最后，您将了解 **攻击指标 (IOAs)** 以及它们与 IOC 的不同之处或关系。\n\n*第14章，威胁情报报告和传播，*\
  \ 讨论了威胁情报报告和共享。它向您展示如何为战略、运营和战术团队编写有效的文档。它还向您展示如何提取威胁情报报告元素，例如对手活动和恶意软件家族。在本章中，您将学习如何编写威胁情报报告、构建对手组织和活动、使用最佳实践共享情报，最后收集威胁情报反馈。\n\
  \n*第15章，威胁情报共享和网络活动归因 – 实践用例，* 是一章动手实践的章节，重点关注威胁情报共享并演示如何将网络活动归因于活动、威胁组织或威胁行为者。它为您提供开发和共享\
  \ IOC 以进行内部安全增强和外部传播所需的技能。在本章中，您将学习如何使用 YARA 规则开发 IOC 并使用它们来检测和阻止攻击。您还将学习如何使用 Anomali\
  \ STAXX 作为示例设置 STIX/TAXII 平台以进行情报传播。您将学习如何使用威胁情报共享平台进行情报传播。您将获得从威胁分析构建活动组织并将分析关联到每个组织（活动跟踪）的实践技能。最后，您将学习如何进行\
  \ **竞争性假设分析 (ACH)** 以将网络活动归因于国家支持的组织和行为者。\n\n## 从本书中获得最大收益\n\n您需要具备基本的网络安全和网络知识才能充分利用本书。对于实践练习，您需要将\
  \ SANS SIFT 工作站安装为虚拟机或在任何基于 UNIX 的操作系统中，例如 Ubuntu 或 Kali Linux。SIFT 工作站附带了安全分析所需的工具。您需要\
  \ MISP 虚拟机和 Anomali STAXX 平台来完成 *第15章，威胁情报共享和网络活动归因 - 实践用例* 中的实践。\n\n所有命令都直接在本文提到的客户平台上或主机环境终端中执行。我们使用了\
  \ Windows 10 主机环境。\n\n请注意，本书还解释了让您为实践练习做好准备所需的步骤。\n\n| 书中涵盖的软件/硬件 | 操作系统要求 |\n|---|---|\n\
  | 虚拟化环境的 VirtualBox 6.1 | Windows、macOS 或 Linux |\n| SANS-SIFT 工作站 5.13.0-27-generic\
