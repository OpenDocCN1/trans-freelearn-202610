  \ X |  |  |  |  |  |  |  |  |  |\n\n图 6.4 – 简化的攻击面 – 威胁向量矩阵\n\n如前图所示，矩阵的构建很简单。我们将攻击面放在一个轴上，将威胁向量放在另一个轴上。然后，如果适用，我们用标记填充矩阵的每个区块。例如，尽管社会工程学可以影响整个系统，但入口点是人员。然而，误配置可以成为除人员之外每个攻击面的入口点（例如，配置错误的服务器是一个有效的入口点，配置错误的\
  \ DNS 服务也是如此）。\n\n威胁情报团队必须填写此矩阵以了解如何启动缓解计划。例如，假设我们知道暴力破解攻击会影响 Wi-Fi 接入点。在这种情况下，我们可以实施缓解策略以避免暴力破解\
  \ Wi-Fi 接入点，例如在连续多次失败尝试后锁定账户。\n\n## 攻击树概念\n\n**攻击树** 是情报和安全分析人员可用于说明资产如何被攻击的图表。它们是\
  \ **资产-向量映射** 的分层图。树的目标是突出导致资产攻击的潜在路径。我们可以使用攻击树以图形方式表示资产的攻击向量并促进对策和缓解措施的制定。我们选择一个\
  \ **根节点** 来构建攻击树（代表攻击目标）、**叶节点**（代表特定向量）以及 **OR/AND** 节点来描述到达叶节点的方式。树只能有一个根节点，但可能有多个叶节点。叶节点也可以拆分为多个子节点或\
  \ OR/ AND 节点：\n\n- **选择根节点：** 所选根节点基于目标。分析师识别资产并提出问题，*可以被入侵的是什么？* 根节点的示例是 *窃取个人和信用卡信息*。\n\
  - **识别叶节点：** 叶节点是用于破坏根节点中所选资产的子目标或向量。对于前述示例，我们可以识别诸如 *钓鱼*、*误配置（或漏洞）*、对服务器室的 *物理访问*\
  \ 以及 *侵入 IT 管理员的 PC* 等向量作为叶节点。\n- **选择 OR/AND 节点：** 当必须实现所有攻击方法时使用 AND 节点。当必须完成一个或多个程序时使用\
  \ OR 节点。我们可以对钓鱼节点使用 *带附件的钓鱼邮件* OR *带恶意（克隆）链接的钓鱼邮件*。我们可以在误配置叶节点中使用 *输入表单攻击* OR *登录暴力破解*。\n\
  - **对非根节点进行排序：** 威胁情报分析师需要对所有非根节点进行排序。此排序决定每个叶节点或方法发生的可能性。在典型的攻击树中，排序可以通过布尔值（1 或\
  \ 0，是或否）或分配值来实现。例如，分析师可以为窃取个人和信用卡信息的物理访问分配 *0.1* 或 *否* 的值。\n\n使用这一概念，我们可以为一家中型金融机构创建一个全面的攻击树，使用关键资产（个人和信用卡信息数据库）。该树如下图所示：\n\
  \n![](img/d47f26598025b2da017dd41fcbb6e602_177_0.png)\n\n## 图 6.5 – 攻击树\n\n现有基础设施的分析必须支持排序。前图显示通过钓鱼攻击发生的概率很高。除非攻击者得到有访问权限的人员协助，否则进入服务器室的物理访问不太可能发生。与暴力破解身份验证应用程序相比，攻击者使用组织的在线应用程序进行的表单输入攻击是一个更可能尝试的选项。\n\
  \n情报分析师和安全团队应为所有资产创建攻击树以促进对策和缓解计划。在下一节中，我们将研究一个对手和攻击分析用例：Twisted Spider。\n\n\n\n\
  ## 对手分析用例 – Twisted Spider\n\n我们将要查看的第一个案例是被称为 Twisted Spider 的俄罗斯组织。以下要点提供了对该犯罪团伙的分析，该团伙构成了东欧犯罪卡特尔的一部分：\n\
  \n- **起源：** 东欧，主要使用俄语。\n- **威胁向量：** 勒索软件，包含多种类型，包括 Maze 和 Egregor 勒索软件。\n- **勒索软件技术：**\
  \ 采用密钥的载荷执行保护，使恶意软件分析人员难以分析。该组织使用 Rclone (https://rclone.org/)，被称为云存储的瑞士军刀。它还利用\
  \ FTP 服务器、C2 服务器和 DropBox 等公共基础设施来外泄数据。\n- **攻击限制：** 载荷无法在俄罗斯受害者上执行。该功能通过允许恶意软件检查受害者的语言来实现。旧苏联国家被排除在攻击之外。\n\
  - **活动和时间线：** Twisted Spider 在 2019 年 5 月至 2020 年 11 月期间使用 Maze 勒索软件，并在对每种恶意软件进行多次活动和伪装后迁移到\
  \ Egregor 勒索软件。\n- **后果：** 该组织从医院、政府机构和私营部门组织等各种组织中勒索超过 7500 万美元。\n- **匿名性：** 几乎不存在，因为该组织自愿吸引媒体关注，与杂志和网络安全新闻组织进行沟通。\n\
  - **一些值得注意的攻击和入侵：** *佳能 2020 勒索软件攻击*，几乎窃取了 10 TB 的数据。该组织的 Maze 勒索软件被用于此次入侵。该组织加密了\
  \ Canon、USA 数据并施压公司支付赎金以恢复数据。还有 *Cognizant 2020 勒索软件攻击*，该公司因此花费超过 5000 万美元进行修复。最后是\
  \ *Allied Universal 2019 勒索软件攻击*，大约 7 GB 的数据被勒索以索取赎金。BleepingComputer (https://bit.ly/2Ye11er)\
  \ 已发布了许多此类入侵事件。\n\n- **攻击树：** 该组织的攻击树可分为两个阶段：数据外泄和系统加密。如下图所示：\n\n![](img/d47f26598025b2da017dd41fcbb6e602_179_0.png)\n\
  \n图 6.6 – Twisted Spider 的攻击树 – 第 1 部分\n\n前述图表显示了数据外泄过程之前的攻击树。我们可以看到该组织使用钓鱼和漏洞利用来获取系统访问权限。他们还利用开放工具与远程服务器（C2\
  \ 服务器）通信。以下图表显示了该组织攻击 TTPs 的第二部分：\n\n![](img/d47f26598025b2da017dd41fcbb6e602_180_0.png)\n\
  \n图 6.7 – Twisted Spider 的攻击树 – 第 2 部分\n\n- **入侵指标 (IoCs)：** 与 Twisted Spider 组织直接关联的多个\
  \ IoCs 已被公开。这些指标的详细信息可在以下链接中找到。然而，一些基础设施指标包括 C2 服务器 IP 91.218.114.30 和 91.218.114.31。IoCs\
  \ 将在 *第 13 章，有效威胁情报指标、绩效指标和痛苦金字塔* 中更详细地介绍。\n\n有关 Twisted Spider 的更多信息可在 https://analyst1.com/file-assets/RANSOM-MAFIA-ANALYSIS-OF-THE-WORLD%E2%80%99S-FIRST-RANSOMWARE-CARTEL.pdf\
  \ 找到。\n\n作为网络威胁分析师，了解如何对对手进行画像和分析至关重要。作为练习，你可以搜索任何对手组织并按照本节提供的结构对其进行分析。在下一节中，我们将研究识别威胁和攻击的对策的方法。\n\
  \n## 识别对策\n\n对策涉及所有可以采取的步骤以防止攻击发生或最大限度地减少其影响。本阶段旨在回答以下两个问题：*我如何防止攻击？*，如果攻击已经发生，以及\
  \ *我如何控制损害？*，分析师在此创建每个攻击向量的表格，提供描述、可能的感染模式和可能的对策。在这里我们将提供一个向量及其对策的示例。我们还将提供制作威胁模型报告摘要的基本指南：\n\
  \n- **威胁向量 1：恶意软件攻击。**\n\n**描述：** 恶意软件攻击发生在恶意软件植入系统并损害组织标准运营时。后果范围从服务中断到远程系统控制和完全系统关闭。请注意，恶意软件造成的损害可能比此处所述更大。\n\
  \n**感染模式：** 恶意软件感染可通过已知系统漏洞、未修补的软件应用程序、钓鱼、过时的易受攻击软件等发生。\n\n**对策：** 恶意软件攻击很难避免，尤其是在零日漏洞利用的情况下。然而，安装可靠且最新的\
  \ *防病毒* 软件至关重要。*防火墙、IDS 和 IPS* 可降低恶意软件攻击的可能性。\n\n- **威胁向量 2：弱、被盗和受损的凭据。**\n\n**描述：**\
  \ 凭据对于获取组织资源的访问权限非常重要。攻击者可以利用弱密码或身份验证流程。后果范围从敏感信息泄露到身份盗窃。\n\n**感染模式：** 身份验证凭据盗窃可通过\
  \ **肩窥**、**垃圾箱挖掘**、**社会工程**、**中间人** 攻击或 **暴力破解攻击** 发生。\n\n**对策：** 用户必须使用 *复杂且强壮的密码组合*（组织必须实施良好的密码策略）。*避免凭据共享*，尤其是在访问网络资源时。*实施双因素认证*。*定期重置密码*，不要使用重复或与之前使用过的密码相似的密码（强制执行频繁更改密码的策略）。通过共享情报来源\
  \ *持续追踪泄露的密码*，如果密码在公开场合被泄露，立即重置密码。*限制可接受的失败尝试次数*，以确保系统不会受到暴力破解或字典攻击，并 *采取适当的行动*。\n\
  \n### 重要说明\n\n密码身份验证在可用性与安全性的问题上需要仔细考虑。复杂的密码可能会促使用户将其写下来以避免记忆的困难，这是一个安全风险。密码必须安全且合理。可用的安全问题将在\
  \ *第 11 章，可用性安全：威胁情报作为流程的一部分* 中讨论。\n\n- **威胁向量 3**：钓鱼。\n\n**描述**：钓鱼是一种网络方法，攻击者冒充合法机构或个人，促使目标采取会损害安全标准的行动。\n\
  \n**感染模式**：钓鱼可通过 *打开电子邮件附件*、*点击恶意链接*、从 USB 驱动器 *打开受感染的文件*（特洛伊木马）以及 *通过电话提供信息* 发生。\n\
  \n**对策**：*对用户/员工进行教育*以检测钓鱼内容。追踪网页浏览活动、被点击的电子邮件链接和被打开的文件。钓鱼很容易防范但难以检测。高级钓鱼技术难以防范，尤其是在非法流量使用合法渠道来扩展钓鱼活动时。由于社会工程是其主要途径，*用户意识*\
  \ 是最佳对策。CTI 团队（或分析师）必须与安全意识团队的其他成员合作，建立坚实的意识并协助保护和反击钓鱼活动。\n\n另一种有效表示对策的方法是将其纳入对手到资产映射中，如\
  \ *图 6.3* 所示。此方法提供了资产与对手之间可能对策的可视化表示。\n\n## 系统重新评估\n\n威胁建模战略流程的最后一步是在识别所有系统威胁组件后重新评估系统安全态势。此步骤介绍了最大限度减少攻击面的最佳实践。情报团队或组织安全部门必须执行以下操作：\n\
  \n- 在威胁模型输出后评估漏洞。定期执行 **漏洞评估** 至关重要，以确保系统入口点得到控制。\n\n\n\n- 不时进行 **渗透测试**（这取决于组织的保险和法规要求，但应至少每年进行一次）以模拟真实的网络攻击并评估组织整体的安全态势。也称为\
  \ **道德黑客**，它是评估系统安全性的最有效方法（它允许你从对手的角度来看待安全）。然而，规划正确的渗透测试操作至关重要。有关不同类型的渗透测试及其优缺点，请参考以下链接：https://www.redscan.com/news/types-of-pen-testing-white-box-black-box-and-everything-in-between/。\n\
  - 监控网络流量以检测流量中的异常。可以使用网络监控工具、数据包分析器和基于人工智能的工具（例如，使用机器学习进行流量模式分析）来实现此目的。情报团队可以使用一组\
  \ **入侵指标 (IoCs)** 来检测网络中的异常行为。IoC 阻止列表和威胁狩猎可用于检测和阻止恶意流量。我们将在 *第 13 章，有效威胁情报指标、绩效指标和痛苦金字塔*\
  \ 中讨论 IoCs。\n\n在本节中，我们介绍了威胁建模的战略手动方法。在每个步骤中，威胁情报团队需要创建一个威胁地图来可视化不同资产的威胁和攻击流程（为每个潜在资产威胁创建攻击树）。文档在威胁建模过程中至关重要。因此，CTI\
  \ 团队需要保存一份所有资产及其分解、攻击面、可能威胁向量和对策的最新文档。该文档由 CTI 团队拥有，但必须由战略、战术和技术安全团队进行更新。在下一节中，我们将介绍各种威胁建模方法论。\n\
  \n## 威胁建模方法论\n\n威胁建模方法论是由一些专家安全组织制定的流程，以促进威胁建模过程。虽然组织可以开发威胁建模方法论，但已有多种现成的方法可以使用。你选择的方法取决于要建模的威胁。威胁建模使用多种方法，例如\
  \ **STRIDE** (https://bit.ly/3yKJzvP)、**DREAD**、**PASTA**、**TRIKE**、**VAST**、**OCTAVE**\
  \ 和 **CVSS (NIST)**。在本节中，我们将介绍 STRIDE 和 NIST 方法论以及它们的工作原理。\n\n## 重要说明\n\n作为分析师，了解其余方法论以及它们如何应用于你的威胁建模练习至关重要。我们不会详细介绍所有这些方法论。\n\
  \n**损害、可复制性、可利用性、受影响用户、可发现性 (DREAD)** 也是微软开发的威胁模型方法论或风险评估框架。该方法使用上述五个组件来定量分析可能影响组织资源的不同威胁。CTI\
  \ 分析师为每个元素分配值，所有这些值都可用于确定缓解计划的优先级。\n\n**攻击模拟与威胁分析流程 (PASTA)** 将威胁缓解和对策视为业务问题。它采用七步战术流程来有效应对威胁。该模型帮助威胁情报分析师分析利用漏洞的攻击并将这些攻击映射到威胁案例。PASTA\
  \ 通过关注业务影响（例如攻击导致的收入损失、系统修复或恢复成本等）超越了对应用程序和资产的建模。它将威胁影响和风险与业务相关联。通过使用 PASTA，CTI\
  \ 团队或分析师可以专注于直接影响组织运营和环境的威胁。CTI 分析师模拟这些攻击以识别可使用的利用方式并实施对策。\n\nTRIKE 是一种主要基于威胁和攻击防御方面的威胁模型和风险评估框架。与其他威胁模型相比，TRIKE\
  \ 不关注攻击者的行为。它完全开源，可以作为威胁建模的桌面工具安装，也可作为电子表格使用。每个资产或应用程序组件都使用 **创建、读取、更新、删除 (CRUD)**\
  \ 概念进行评估。\n\n**视觉、敏捷、简单威胁 (VAST)** 从整个软件开发生命周期的角度来看待威胁建模。VAST 是 *ThreatModeler*\
  \ 商业威胁建模工具的核心方法论。VAST 使用三个主要支柱进行威胁建模：自动化、集成和协作。\n\n**运营关键威胁、资产和漏洞评估 (OCTAVE)** 是一种威胁建模和战略风险评估框架，利用组织内个人的知识来识别安全实践的状态。OCTAVE\
  \ 采用问责制方法，让每个人都参与安全实践。该模型识别关键资产的风险并优先改进关键资产领域。OCTAVE 的特点有两个方面：*运营风险* 和 *安全实践*。该模型建立在三个阶段之上：基于资产的威胁概况构建、基础设施漏洞识别和安全战略开发。\n\
  \n## 使用 STRIDE 进行威胁建模\n\n**欺骗、篡改、抵赖、信息泄露、拒绝服务和权限提升 (STRIDE)** 是微软作为安全开发生命周期一部分使用的威胁建模方法论。它是最古老的威胁建模流程。从缩写可以看出，STRIDE\
  \ 使用一组定义的威胁向量进行威胁建模。它允许我们在早期开发阶段集成安全。因此，了解资产和应用程序需求非常重要，以确保最大程度地防止 CIA 三元组违规。让我们描述\
  \ STRIDE 及其应用：\n\n- **威胁向量 1：欺骗。**\n  - **描述：** 欺骗是一种网络攻击，攻击者试图冒充他人或某物。其目的是假装成合法实体并提取有用信息，例如凭据、IP地址、明文流量或提供远程访问。\n\
  \  - **违反的组件：** AUTHENTICATION。\n  - **示例：** 假装是 IT 管理员并推动目标在计算机上安装 DLL 文件以允许攻击者远程控制受害者系统，或假装是银行并推动用户从类似的发件人地址输入登录凭据。\n\
  \  - **操作模式：** 欺骗可以应用于不同级别，包括文件（更改文件扩展名或创建多个文件）、进程（接管合法进程）、网络（ARP、IP、DNS）和用户（冒充用户）。\n\
  - **威胁向量 2：篡改。**\n  - **描述：** 篡改是一种用于修改系统数据的攻击。攻击者可以修改静态数据（磁盘上或内存中）或传输中的数据（在网络中移动时）。\n\
  \  - **违反的组件：** INTEGRITY。\n  - **示例：** 自动在网络流量中的所有下载中嵌入恶意软件，或在数据通过网络传输时更改信号位。\n\
  \  - **操作模式：** 篡改可以应用于文件（重定向到恶意文件、修改服务器配置文件）、代码（API 修改、内存数据攻击）或网络（修改网络中移动的数据、将流量重定向到恶意目的地）。\n\
  - **威胁向量 3：抵赖。**\n  - **描述：** 抵赖涉及否认已完成某事的责任。它使得将操作与所有者关联变得困难。\n  - **违反的组件：** NON-REPUDIATION。\n\
  \  - **示例：** 向 Web 应用程序文件插入代码而不声称自己已执行此操作。\n  - **操作模式：** 抵赖可以应用于不同级别，包括物理设备、应用程序、服务和用户（使用他人的凭据进行活动并否认，因为所有证据都指向原始凭据所有者）。\n\
  - **威胁向量 4：信息泄露。**\n  - **描述：** 信息泄露是一种用于访问不应访问的信息的攻击——未经授权的访问。\n  - **违反的组件：**\
  \ CONFIDENTIALITY。\n  - **示例：** 使用 SQL 注入提取个人信息或使用 XSS 访问系统用户名和密码哈希。\n  - **操作模式：**\
  \ 信息泄露可以通过利用权限问题（配置错误的访问控制、服务器访问权限）、安全（访问哈希和加密密钥）和网络流量（窃听网络流量）发生。\n- **威胁向量 5：拒绝服务\
  \ (DoS)。**\n  - **描述：** DoS 是一种用于中断或关闭系统操作的攻击，因此你被部分或完全拒绝访问网络资源。\n  - **违反的组件：**\
  \ AVAILABILITY。\n  - **示例：** 向网络发送比其能处理的更多请求数据包以破坏流量流，或创建过多进程以使服务器或设备的内存崩溃。\n  -\
  \ **操作模式：** DoS 可以应用于进程（使内存和磁盘崩溃）、数据存储库（数据库、服务器）和网络（带宽利用消耗）。\n- **威胁向量 6：权限提升。**\n\
  \  - **描述：** 权限提升是一种用于增加权限并在未经授权的情况下访问资源的攻击。\n  - **违反的组件：** AUTHORIZATION。\n\n\n\
  \nExamples: Gaining write access to a credit accounts database or increasing access\
  \ privileges by modifying configuration or server files.\n\nOperating mode: Elevation\
  \ of privilege leverages poor access control management.\n\nThe main problem is\
  \ understanding how attackers can spoof, tamper with, repudiate, disclose, deny\
  \ access to, or elevate privileges in any part of the system or assets (infrastructure,\
  \ applications, supply chain, IoT services, and others). The security team can then\
  \ implement countermeasures as the system is analyzed or applications are developed.\
  \ You can insert all the components of STRIDE into the design process and document\
  \ the flows, countermeasures, and mitigation steps for future assessment and references.\
  \ STRIDE uses the approach shown in Figure 6.1.\n\n## Threat modeling with NIST\n\
  \nNIST defines a data-centric threat modeling approach rather than just following\
  \ best security practices. The NIST approach considers each asset as a whole and\
  \ deduces security needs based on individual cases. Using NIST, the CTI team focuses\
  \ on the security stance of each asset instance, such as credit users' personal\
  \ information stored in a database server inside a data center. The threat modeling\
  \ of such a case would be different from the one of users' personal information\
  \ stored in an IT admin's personal computer. The NIST threat model involves four\
  \ steps: data and system identification and characterization, attack vector selection,\
  \ security control characterization, and threat model analysis, as follows:\n\n\
  - **Identifying and characterizing the system and data of interest**: The CTI team\
  \ identifies the system and the data that needs protection. Then, they determine\
  \ how the system and the data are used in the organization. This includes identifying\
  \ the following:\n\nThe authorized location of the data of interest: The CTI team\
  \ must identify the different places where the data resides (storage) within the\
  \ organization. It must also know the transmission mechanisms (how data of interest\
  \ moves from one place to another and how it is handled while being transmitted).\
  \ The analyst must be aware of the data's execution environment (is the data executed\
  \ in memory or on disk? What processors handle processing such data?). Another critical\
  \ factor when assessing a data location is to know how data is inserted or written\
  \ to the system and how it is taken out (through printing or a screen display).\n\
  \nThe detailed movement and behavior of the data: The CTI team needs to track the\
  \ data and how it is handled. It is essential to understand how and what the users\
  \ use the data for? What are the processes that handle them? What is the technology\
  \ that supports the data and the system? This allows the CTI team to know where\
  \ the data is the most vulnerable during its movement. For example, point-of-sale\
  \ devices have been seen to be susceptible when data is in memory.\n\nThe security\
  \ objectives of the data: How does the CIA triad apply to the data? The CTI team\
  \ must identify which components of the triad are a priority. For example, in terms\
  \ of personal information, confidentiality may be the top priority when modeling\
  \ threats. Even if the data is breached, how can we make it impossible for the adversary\
  \ to access it?\n\nThe authorization to access the data: The CTI must include all\
  \ the processes and users that have access to the data of interest and their permissions.\
  \ Identifying and characterizing data and systems is the first step in identifying\
  \ where data can be vulnerable. Let's look at an example:\n\n**Data of interest:**\
  \ Users' credit information.\n\n**Summary:** Users' credit information is stored\
  \ in the organization server but accessible through VPN by different business units\
  \ (tellers, IT admins, data analysts, and so on).\n\n**System of interest components:**\
  \ Users' laptops (a teller who looks at credit balance on the screen, a data analyst\
  \ who downloads a subset of users' data to perform some operations on the local\
  \ machine, or a developer who updates the system application to write data to the\
  \ server). Printers (the teller or the analyst can print the dataset for different\
  \ purposes). The authorized locations include the storage for each individual with\
  \ access. The information is transmitted over LAN or WLAN. Execution is performed\
  \ on server memory for the teller and local memory for the analyst.\n\n**Security\
  \ objectives:** Confidentiality is a priority when complying with the POPI Act.\
  \ However, all the elements of the CIA triad matter. The modeling is, however, based\
  \ on ensuring the confidentiality of the users' credit information.\n\nFrom this\
  \ example, we can identify all the users who have access to the data and handles\
  \ it. Tellers, data analysts, and application developers have access (maybe different\
  \ and limited).\n\n- **Identifying and selecting attack vectors for the data of\
  \ interest:** The CTI analyst identifies the threat vectors that can be used to\
  \ compromise the data of interest. The more attack vectors the CTI identifies, the\
  \ better for step 3. However, the analyst must assess the likelihood of each threat\
  \ vector to be used in the scope of the model. When we use the preceding example,\
  \ step 2 is applied as follows:\n\n**Location 1:** Data stored on the local drive\
  \ of the bank data analyst.\n\nThe attacker forces access to the analyst PC and\
  \ copies the dataset. He/she gains physical access to the PC and installs malware.\
  \ The attacker steals the analyst's VPN credentials. He/she downloads sessions and\
  \ cookies on the PC. The attacker uses social engineering to install malware (keyloggers,\
  \ spyware, or any malicious software) on the analyst PC.\n\n**Location 2:** Data\
  \ printed by the teller or the analyst.\n\nAttackers monitor and break into the\
  \ wireless network and capture all data sent to the printer. An attacker shoulder-surfs\
  \ the teller to view the information printed on the screen. The attacker breaks\
  \ into the wireless network and performs a MITM attack.\n\n**Selected potential\
  \ vectors:** Credential theft, session hijacking, implanting physical malware, wireless\
  \ attacks, and spear phishing.\n\n- **Characterizing the security controls for mitigation\
  \ processes:** In this step, the CTI analyst identifies countermeasures and mitigation\
  \ processes for each attack vector. Here, we assume that the organization has a\
  \ security policy in place. The CTI needs to rank each measure taken to address\
  \ the exploitation of each threat vector. This ranking depends on the organization.\
  \ However, the high/medium/low approach works well. Step 3 for this example is as\
  \ follows:\n\n**Credential theft:** *Strong password using strong encryption* techniques\
  \ (effectiveness: low; implementation cost: low; management and control: low; impact\
  \ on usability: low; impact on performance: low). *Multi-factor authentication*\
  \ (effectiveness: high; implementation: medium; maintenance: medium; usability impact:\
  \ medium; performance impact: low).\n\n**Session hijacking:** *End-to-end encryption*\
  \ (effectiveness: high; implementation cost: low; management and control: low; usability\
  \ impact: low; performance impact: low). *Random long session cookies* (effectiveness:\
  \ high; implementation cost: low; management and control: low; usability impact:\
  \ low; performance impact: low).\n\n**Malware implant**: *Antivirus, IDSes, IPSes,\
  \ firewalls* (effectiveness: high; implementation: high; maintenance and control:\
  \ medium; usability impact: medium; performance impact: medium). *Patching vulnerabilities*\
  \ (effectiveness: high; implementation cost: low; management and control: low; usability\
  \ impact: medium; performance impact: medium).\n\n**Wireless attacks**: *Strong\
  \ encryption*, such as WPA-2 Enterprise and *strong passwords* (effectiveness: medium;\
  \ implementation cost: low; management and control: low; usability impact: medium;\
  \ performance impact: low).\n\n**Phishing**: *User education* (effectiveness: high;\
  \ implementation cost: low; management and control: low; usability impact: low;\
  \ performance impact: low). *Phishing detectors* (effectiveness: high; implementation\
  \ cost: medium; management and control: medium; usability impact: low; performance\
  \ impact: low).\n\n- **Analyzing the threat model**: In this step, the CTI analyst\
  \ or team analyzes the results of the previous steps to assess the reliability of\
  \ the implemented security protocols against their respective threat vectors. The\
  \ analyst can assign a score to each measure to evaluate its contribution to the\
  \ overall security stance. Countermeasures with high effectiveness can be given\
  \ a set of values; the same goes for other countermeasures. In the end, the analyst\
  \ calculates all the implications for each security control.\n\nWith that, we have\
  \ seen that NIST can be used to model data-centric threats. The CTI team must document\
  \ everything.\n\nThreat modeling methodologies facilitate the process of analyzing\
  \ risks to the organization's assets. The choice of methodologies depends solely\
  \ on the organization, the assets or applications, and the business objectives.\
  \ In the next section, we will look at how SIEM can be used for threat modeling.\n\
  \n## Threat modeling use case\n\nThe objective of this use case is to provide a\
  \ practical threat model approach to scenarios. We will use the Equifax data breach\
  \ as an executive summary and the base of the modeling process.\n\n\n\n**场景：** 你是\
  \ ABCompany 的 CTI 分析师，ABCompany 是一家信用记录公司，与多家合作伙伴合作，包括银行、保险公司、零售和制造业。贵公司还通过在线网络门户处理信用争议，用户可在其中记录与任何组织的信用记录问题。由于金融和保险行业近期遭受网络攻击，且该行业个人数据泄露，你被要求研究\
  \ 2017 年 Equifax 数据泄露事件，并为从事设计、被动防御和主动防御领域的其他安全专业人员提取有价值的信息。你还必须制定威胁模型，以识别可能成为目标的资源（和资产），并识别可能与威胁行为者关联的\
  \ TTPs。\n\n## Equifax 数据泄露概述\n\n在本节中，我们将通过提供执行摘要来总结数据泄露，说明所使用的威胁向量类型，确定时间线，将攻击映射到威胁情报框架，总结漏洞，识别泄露的后果，并查看为加强系统所采取的措施。\n\
  \n**执行摘要：** 2017 年 5 月至 7 月期间，Equifax，一家主要的信用记录公司，报告了一起重大数据泄露事件，近 1.5 亿人的个人和财务信息被窃取。攻击者利用了用于在线争议的数据库服务器之一上未修补的\
  \ Apache Struts 框架（Web 服务器）中的漏洞。该攻击在超过 2 个月时间内未被发现。\n\n**威胁向量：** 未修补的漏洞、差或不存在的加密，以及配置错误（SQL\
  \ 代码执行和易于系统横向移动）。\n\n**时间线：** Equifax 攻击时间线如下：\n\n- 1. 攻击者在 2017 年 3 月运行了漏洞扫描器，并在在线门户上运行的\
  \ Web 服务器软件 Apache Struts 中发现了一个已知漏洞。\n- 2. 攻击者创建了利用程序，使用多种技术将其从 Equifax 系统中隐藏，并在数据库上执行\
  \ SQL 查询（约 9,000 次查询）。\n- 3. 攻击者窃取了个人和财务数据。\n- 4. 攻击者定位了额外的服务器，访问了未加密的登录凭据，并发出额外的系统命令以查询并从其他数据库窃取更多\
  \ PII。\n- 5. 攻击者在未被发现的情况下潜伏了 2 个月，并在该期间（2017 年 5 月 13 日至 2017 年 7 月 29 日）窃取数据。\n\
  - 6. 2017 年 7 月 29 日，Equifax 正式宣布攻击。组织于 2017 年 9 月 7 日确定了泄露的范围。\n\n现在，让我们来看攻击者（对手）为满足其需求而使用的不同技术。\n\
  \n**已识别的 TTPs：** 攻击者通过扫描网络进行 *主动侦察* 以寻找漏洞。结果，他们识别出一个面向互联网的服务器，托管在线门户争议，运行带有 CVE-2017-5638\
  \ *漏洞* 的软件。攻击者获得了访问权限并可以执行命令。攻击者使用 *现有的加密通信渠道* 将其活动与常规流量混合，实现了 *持久性*，并 *避免检测*。攻击者最终\
  \ *提升了权限* 并在其他数据库上 *运行系统命令*。你可以将此攻击映射到 MITRE ATT&CK 框架，如下图所示：\n\n| 侦察 | 初始访问 | 持久性\
  \ | 权限提升 | 防御规避 | 收集 | 命令与控制 | 数据外泄 |\n|---|---|---|---|---|---|---|---|\n| 主动扫描\
  \ (2) | 利用面向公众的应用 | 有效账户 (4) | 有效账户 (4) | 主机上指示符移除 (6) | 来自信息存储库的数据 (2) | 入侵工具传输\
  \ | 通过替代协议外泄 (3) |\n|  | 有效账户 (4) |  |  | 有效账户 (4) |  | 代理 (4) |  |\n\n图 6.8 – 将\
  \ Equifax 数据泄露映射到 MITRE ATT&CK 框架\n\n前述图表仅显示报告中发现的战术。请使用泄露报告中描述的战术和技术，并将它们链接到 MITRE\
  \ TTPs。\n\n**漏洞和安全差距：** 你需要思考并识别 Equifax 安全中的差距，这对于建模你的组织至关重要。我们可以识别四个可能的安全差距（根据报告，你可以识别更多）。我们有以下内容：\n\
  \n- **软件修补管理效率低下**：该漏洞在攻击前就已为人所知，并且已发布补丁，但组织未能应用。监控系统未能检查加密流量，因为 SSL 证书在 10 个月前已过期。\n\
  - **特权访问管理问题**：缺乏资源访问限制，因为攻击者可以将攻击扩展到另外 58 个数据库。\n- **事件监控差距**：Equifax 拥有事件监控系统和日志。然而，外部系统扫描并未提醒安全团队，这本可以帮助在网络杀伤链的第一阶段阻止攻击。\n\
  - **个人数据存储问题**：Equifax 将个人数据以明文形式存储。\n\n此列表并非详尽无遗。请阅读报告以识别任何有助于加强你的组织的相关信息。以下是一些预防措施：\n\
  \n**预防和对策：** 发生数据泄露后，Equifax 采取了一些行动来加强系统。其中一些行动包括以下内容：\n\n- 用于识别和修补软件和应用程序的新管理流程。\n\
  - 数据和应用程序保护的新政策。\n- 具有先进功能的新工具，用于持续监控网络流量。\n- 通信监控，在组织外部边界执行。\n- 内部服务器之间的流量限制并实施新的安全控制框架。\n\
  - 实施了新的终端安全工具以检测配置错误。\n- 实施了风险意识计划并与董事会共享，CISO 直接向 CEO 汇报。\n\n在此第一步中，你已总结了数据泄露，并可以与战略团队和小组其他成员分享主要要点。有关\
  \ Equifax 数据泄露的更多信息，请参阅 https://www.gao.gov/products/gao-18-559 和 https://bit.ly/3tkE5XC。\n\
  \n## ABCompany 的威胁建模\n\n威胁建模并不简单。取决于组织和行业，部分组件可能会有所不同。目标是向你展示如何处理此类案例。我们将使用图 6.1\
  \ 所示的逻辑和 STRIDE 映射。开始吧：\n\n- **资产和分解：** 属于威胁模型的资产包括 *员工的 PII*（非互联网面向），*用户的 PII*（面向互联网且有会话保护），*信用信息*（面向互联网且有会话保护），*争议和政策文件*（非互联网面向），以及\
  \ *Web 门户*（SSL、会话保护和登录表单）。对手可能针对所有资产。\n\n请注意，你可以根据自己的组织识别更多内容。\n\n- **对手分析**：我们可以根据\
  \ Equifax 报告和发现的 MITRE ATT&CK 战术识别潜在对手。信用卡信息和 PII 数据可能被 *财务动机行为者*（黑帽黑客、有组织犯罪和恶意内部人员）针对。*黑客行动主义者*\
  \ 和 *网络恐怖分子* 可能针对 Web 门户和面向公众的应用程序。争议和政策文件很敏感，可能被工业间谍（间谍活动）针对。\n- **威胁识别**：基于 Equifax\
  \ 泄露，我们可以突出 *未修补的漏洞*、*配置错误*、*弱加密和无加密*、*未受保护的凭据* 和 *系统横向移动*。然而，基于 ABCompany 可能面临的对手类型，我们可以添加\
  \ *网络钓鱼*、*恶意软件*、*勒索软件* 和 *零日威胁*。\n- **攻击面**：ABCompany 有两个数据中心，运行 Linux 的 *物理服务器*。*员工*\
  \ 拥有 *笔记本电脑*，可通过 *VPN* 访问 ABCompany 网络。Web 流量使用 *代理服务器* 进行代理。网络流量使用 *SSL 证书* 进行加密。客户也可以使用其\
  \ *终端设备* 登录客户门户。*合作伙伴*（银行、保险公司等）可以通过安全的公共网络访问用户的信用信息。请使用图 6.4 绘制威胁向量到攻击地图。\n- **对策识别**：请参阅\
  \ *识别对策* 部分以记录所有可能威胁向量的对策。\n\n使用此信息绘制简单的威胁建模地图，如下图所示：\n\n**ABCompany**\n\n| 员工个人身份信息\
  \ | 客户个人身份信息 | 客户信用信息 | 纠纷和政策文件 | Web 应用（门户） |\n|---|---|---|---|---|\n| 非公开<br>必须加密<br>*(必须在静态和传输中受保护)*\
  \ | 面向公众<br>会话保护<br>*(必须在静态和传输中受保护)* |  | 非公开<br>必须在静态和传输中受保护 | 面向公众<br>登录表单<br>会话保护<br>*(持续监控活动)*\
  \ |\n| - 加密薄弱或不存在<br>- 篡改<br>- 欺骗（冒充）<br>- 不可否认（隐藏痕迹）<br>- 信息泄露 |  |  | - 勒索软件<br>-\
  \ 篡改<br>- 文档盗窃<br>- 横向移动 | - 暴力破解<br>- 弱凭据<br>- 配置不当<br>- 跨站脚本<br>- 拒绝服务<br>- 权限提升<br>-\
  \ 未修补漏洞 |\n| 黑帽黑客<br>有组织犯罪<br>恶意内部人员 |  |  | 工业<br>间谍活动<br>有组织犯罪 | 黑客行动主义者<br>网络恐怖分子<br>脚本小子\
  \ |\n\n图 6.9 – 简化的 ABCompany 威胁模型\n\n这里，我们可以看到各种 STRIDE 组件。对大型组织而言，威胁建模可能资源密集。重要的是自动化该过程，以确保所有资产、向量和攻击面都能可靠地进行画像。这就是为什么我们必须拥有\
  \ SIEM 系统，正如下一节所述。\n\n## 使用 SIEM 进行高级威胁建模\n\n**安全信息和事件管理（SIEM）** 是一个平台、工具、产品或系统，允许安全专业人员聚合多个数据源，搜索安全和网络事件，并生成分析报告以支持业务决策。SIEM\
  \ 通过将原始数据转换为人类可读且可解释的形式来完善威胁情报平台。SIEM 执行以下任务：\n\n- **数据收集：** SIEM 收集网络中的安全事件。这可以是系统日志、网络设备日志、端点设备日志、应用程序日志或任何可分析的其他安全文档。\n\
  - **数据标准化：** SIEM 通过可靠的中介层处理数据，使所有收集的数据都处于系统可用的格式。通过标准化数据，SIEM 通过监控网络 *流量和事件* 来管理安全。它利用高级分析整合来自多个不同来源的收集数据，并在网络中精确定位事件（安全事件）。\n\
  - **数据关联：** 为了识别安全威胁，SIEM 使用分析方法关联原始数据，以在收集的数据中找到信息模式。关联是 SIEM 的重要任务，因为它使用规则或统计方法揭示来自相同或不同来源的数据之间的关系。\n\
  - **实时分析：** SIEM 将检测安全事件所需的时间降到最低，识别其来源并报告以供采取行动。所有网络流量和事件都实时处理，以便快速识别安全威胁。\n- **报告：**\
  \ 大多数 SIEM 系统都有报告和仪表板模块，允许安全分析师以有组织的方式查看网络威胁、警报、事件和感兴趣的流量。\n\n由于 SIEM 可以对网络事件和流量进行实时数据分析，因此它在自动化威胁建模方面具有优势。使用\
  \ SIEM 进行威胁建模的优势包括 *准确识别资产*（因为 SIEM 数据日志来自网络所有节点）、*实时威胁识别* 和 *快速响应*。SIEM 报告和报警系统也可用于快速提醒我们威胁的存在。使用\
  \ SIEM 进行威胁建模的一些优势包括以下内容：\n\n- **高级分析：** 自动识别系统中的异常行为，表明需要调查并可能存在威胁。SIEM 与其他数据源关联，还可以识别可能的威胁来源和类型。\n\
  - **完整建模自动化：** 使用 SIEM 时，数据和其他必要信息最初会被插入。对于完全自动化的 SIEM，数据收集和馈送通过 API 自动完成。因此，需要做的人工工作更少，可扩展性得到改善。\n\
  - **集成取证分析：** 由于所有数据都存储在同一位置，SIEM 允许您收集可用于调查威胁和攻击的系统事件和流量。SIEM 提供足够的证据来支持威胁和攻击案件。\n\
  - **自动化威胁和事件响应：** 一旦发现威胁或资产的漏洞，SIEM 会自动创建一组警报以引起安全团队的注意并采取行动。高级 SIEM 提供缓解和抵御已知威胁的参考。\n\
  - **威胁狩猎**：利用威胁情报数据，SIEM 允许您识别可能影响组织的新的威胁。当 SIEM 与机器学习功能和用户行为分析相结合时，威胁建模会通过新的威胁数据模式得到丰富。虽然超出了本书的范围，但威胁狩猎在基于\
  \ SIEM 的建模中至关重要，因为它通过简化威胁检测使分析师在对抗对手时占据上风。\n\nSIEM 工具的示例包括 *IBM QRadar*、*AT&T AlienVault\
  \ Unified Security Management*、*Splunk Enterprise Security* 和 *SolarWinds Security\
  \ Event Manager*。虽然大多数这些工具都是商业的，但一些开源 SIEM 包括 *OSSEC*、*开源 HIDS 安全系统*、*Splunk Community\
  \ Edition*、*Apache Metron* 和 *Elastic Search*。有关 SIEM 的更多详细信息将在 *第 12 章，SIEM 解决方案和情报驱动的\
  \ SOC* 中提供。在下一节中，我们将从攻击者和组织成员的角度审视用户行为逻辑。\n\n## 用户行为逻辑\n\n分析和逻辑多年来已成为安全不可或缺的一部分。然而，大多数分析都是在网络流量侧进行的，防火墙、入侵检测系统、入侵防御系统和防病毒软件会分析数据包。然而，用户是安全中最令人担忧的问题，因为一次安全失误就足以危及整个系统的安全。用户行为逻辑或\
  \ **用户行为分析（UBA）** 通过分析用户日常行为来关注 *内部威胁建模*：网络活动、启动的应用、访问的文件和数据库以及下载模式。\n\n使用 UBA，您可以搜索并识别系统中的异常和不寻常行为，并以警报和指标的形式报告给相关利益相关者。UBA\
  \ 独立于其来源分析所有流量。因此，UBA 可以建模内部威胁，并且如果与 SIEM 集成，则可以自动提供参考和对策。\n\n## UBA 的优势\n\nUBA\
  \ 证明在 IT 基础设施安全中至关重要，因为它填补了当前威胁建模和安全方法的差距。安全系统可以轻松将攻击者登录组织门户的失败尝试标记为潜在威胁或攻击。让我们看看来自组织内部或合法用户的失败尝试。安全系统记录该活动，但由于来源受信任而不会标记它。这就是为什么黑客获得系统访问权限后可能会在被检测到之前长时间隐藏的原因（他/她在系统中像合法用户一样行事）。组织使用\
  \ *基于边界的* 安全来保护系统内部免受外部侵害。然而，随着最新泄露趋势，攻击者已表明他们可以访问边界并伪装成普通内部人员。UBA 软件提供以下优势：\n\n\
  - **内部和外部威胁的自动检测：** UBA 整合来自端点、网络、云、应用程序、情报、用户访问、电子邮件和任何其他内部来源的数据，以分析行为、隔离异常活动（从用户角度）并提供事件和流量的完整可见性。攻击者一旦以合法用户身份获得系统访问权限，尝试访问从未访问过的资源时将被标记。用户和系统行为的突然变化足以触发安全警报。UBA\
  \ 识别绕过安全边界的威胁。\n- **以用户为中心而非以事件为中心：** 虽然大多数安全系统跟踪设备和网络事件，但 UBA 明确深入研究人类（用户）行为模式，进行高级分析并检测行为中的异常（潜在威胁指标）。与其他安全工具如\
  \ SIEM 和 TIP 结合使用时，UBA 可提供对系统威胁和攻击的完整可见性。\n- **运营支出节约：** 由于 UBA 是自动化系统，人工输入量最小化。UBA\
  \ 可以减少情报或安全分析师的数量。然而，它并不取代传统安全系统。相反，它用于补充现有基础设施以改善组织的安全性。战略团队可以通过预算规划从 UBA 中受益。\n\
  \n通过将 UBA 集成到 CTI 项目中，组织可以超越传统的流量监控流程，增强系统快速识别异常系统行为的能力。\n\n\n\n## UBA 选择指南 – 其工作原理\n\
  \nUBA 有两种工作方式：使用 *已定义规则* 和使用 *动态分析模型*。基于规则的 UBA 系统允许安全和威胁情报分析师定义公式和逻辑，强制系统报告违反这些规则和逻辑的行为。基于规则的\
  \ UBA 的典型示例是分析师围绕敏感文件创建规则，例如以下简单逻辑：\n\n```\nIf sensitive file access:\n    If user\
  \ is not at work:\n        raise a flag //potential malicious activity\n    else\
  \ if user not admin before:\n        raise flag //possible elevation of privilege\n\
  \    else:\n        log the activity\n        do not flag  //potential legitimate\
  \ user\n```\n\n每当用户访问敏感文件时，UBA 会检查用户是否在工作时间内访问文件。如果不是，则标记此行为并通知相关利益相关者。如果访问文件的用户不是管理员，UBA\
  \ 会标记该行为（这可能是潜在的权限提升）。否则，系统假定这是合法用户。基于规则的 UBA 要求分析师在该领域具有 *足够的专业知识*，并对 *对手使用的 TTPs*\
  \ 有良好的了解。这对于促进实用规则的创建非常重要。\n\n基于动态模型的 UBA 利用动态统计和机器学习对用户行为进行分类或归类。它自动分析用户的活动以检测所有属于可疑类别的活动。以下图表显示了\
  \ UBA 引擎分析内部和外部流量以判断行为是否为威胁：\n\n![](img/d47f26598025b2da017dd41fcbb6e602_200_0.png)\n\
  \n图 6.10 – 简化的 UBA 模型\n\nUBA 可以作为独立工具部署或集成到 SIEM 工具中。无论部署方式如何，在获取 UBA 解决方案时，组织必须关注某些重要特性：\n\
  \n- **大数据支持**：UBA 工具或软件必须支持大数据，因为安全数据以各种庞大的格式和不同的速度出现。大多数 SIEM 系统也支持大数据。\n- **多数据源支持**：尽管\
  \ UBA 专注于用户行为，但它还必须支持事件和流以增强分析流程。它必须能够输入历史用户活动以及所有元数据，例如访问时间、权限、IP地址和电子邮件数据（收件人和发件人、对象、签名和嵌入链接）。\n\
  - **实时通知：** 它必须支持实时报告潜在威胁的能力，以便分析师采取行动。建议在做出威胁相关决策时拥有参考引擎。\n\nUBA 是威胁建模、安全监控和攻击检测的重要工具。它扩大了组织的安全保护范围。根据预算，UBA\
  \ 可能会增加运营安全预算的成本。然而，其好处不容忽视。在下一节中，我们将分析对手的工作方式以及组织可以采取什么措施来保护系统。\n\n## 对手分析技术\n\n\
  网络攻击框架对于分析对手破坏 IT 基础设施所使用的技术非常重要。CTI 项目目标之一是构建有效的威胁和攻击策略。然而，要构建此类策略，情报分析师必须了解攻击者使用的基本方法。我们将以\
  \ IBM Xforce 框架模型方法为例（https://ibm.co/3xGsYdw）。该模型提供了全面的攻击知识，以最大限度地降低风险敞口并防止网络攻击。\n\
  \n网络攻击发生在各个阶段，具体取决于攻击类型、对手和目标系统，这些阶段可能顺序进行也可能不顺序。对手攻击分为两个主要操作：攻击准备和攻击执行。\n\n###\
  \ 对手攻击准备\n\n在准备阶段，对手识别目标、设定目标并发起初始攻击以检查攻击是否成功。如果攻击成功，对手将转入执行操作。如果不成功，他们会修改攻击计划、改变技术并重新发起攻击。准备阶段执行的典型任务包括以下内容：\n\
  \n- **确定攻击目标：** 这是攻击的主要要求。对手可能想要窃取敏感数据或实施勒索软件以牟利。这是攻击计划实施的开始。\n- **开展有效侦察：** 网络攻击者以耐心著称。对手可能会研究组织以识别潜在的访问点。搜索范围包括但不限于员工及其角色、客户、供应商、面向在线的资产、可能的门户以及过去的数据泄露历史。例如，找到组织\
  \ IT 经理在 LinkedIn 等社交平台上的电子邮件地址的对手可以将其用作潜在的攻击面。在侦察阶段，攻击者试图获取系统足迹。\n- **准备战术、技术和流程（TTPs）：**\
  \ 根据侦察步骤收集的信息，对手会识别可能对目标系统成功的 TTPs。获得 IT 经理电子邮件地址的对手可以构建可靠的网络钓鱼攻击。如果识别出面向在线的网络设备，对手可以使用已知漏洞入侵互联网网关或执行暴力攻击。在此步骤中，攻击者确定一旦进入目标系统可用于访问和扩展访问的恶意软件和技术。此时所有攻击向量都掌握在攻击者手中。\n\
  - **准备攻击基础设施：** 在选择适当的 TTPs 之后，对手会提供进行攻击的工具（软件、应用程序和技术）。对手可能会构建 **命令与控制（C2）** 通道与受害者通信。他/她还可能使用混淆技术以避免追踪攻击。因此，可以提供的一些资源包括域名（攻击者可能购买或使用免费在线域名）、服务器和代理（获取或使用免费在线服务器）、邮件服务（购买或使用在线免费网络服务）、SSL\
  \ 证书（购买或使用免费在线证书）以及 VPN 服务（购买或使用免费 VPN 服务）。对于网络钓鱼攻击，对手可能会镜像合法资源（组织的网站、员工或门户）。\n\
  - **准备恶意软件和软件工具包：** 一旦工具和资源准备就绪，对手就会准备恶意软件和软件工具包。他/她选择用于创建恶意软件的工具、编程语言以及如何与受感染系统通信。对手要么开发用于攻击的恶意软件，要么重用现有恶意软件，要么从熟练的黑客处外包服务。对手还可以获取已知漏洞或零日漏洞以进行攻击。在大多数情况下，攻击在目标系统中执行之前会进行模拟和测试。攻击者在防火墙、杀毒软件和其他安全设备存在的情况下，在本地测试实验室中测试攻击行为。目标是确保攻击按预期工作。\n\
  - **确保操作安全**：对手不想被发现和识别。因此，他/她使用一切可能的方法隐藏可能暴露其身份的任何信息。在此阶段，攻击者确保每个暴露关键信息（IP地址、域名所有者、使用的网络服务等）的攻击痕迹被隐藏、混淆或无法从公共存储库中获得。对手可能在攻击暴露时有应急计划。\n\
  - **审查反馈循环**：这是一个持续的过程。对手审查准备步骤并确保收集的数据得到充分利用。他/她审查每个步骤，并在攻击准备周期中出现任何变化或更新信息时调整攻击计划。此任务在攻击的每个阶段执行，以确保其成功。\n\
  - **发起攻击**：对手现在准备好针对目标组织或个人发起攻击。攻击可直接或间接发起。直接攻击涉及与目标系统的即时接触，例如对 Web 应用程序使用 SQL 注入、在门户上使用被盗凭证、物理访问目标系统的\
  \ Wi-Fi 网络或向连接到目标网络的员工发送网络钓鱼电子邮件。\n- **间接攻击**：间接攻击包括感染员工的笔记本电脑并等待其连接到目标网络以获得访问权限。对手还可以镜像组织的在线应用程序并诱骗员工访问恶意网站。攻击方法取决于目标组织的对手态势。\n\
  - **确定攻击结果**：对手评估攻击是否成功。如果发生完全或部分失败，对手可能会修改攻击计划并重建准备阶段。对手很有耐心；因此，他们可能会调整计划直到成功。在完全成功的情况下，对手进入攻击的下一阶段：*执行*。\n\
  \n本小节详细介绍了对手为准备和发起针对组织和个人的网络攻击所采取的步骤。网络攻击者在操作上具有韧性，组织也应如此，以确保系统在任何时候都不会被入侵。在下一节中，我们将提供一些防御性建议，组织可利用这些建议来检测和防范对手的准备阶段。\n\
  \n\n\n## 攻击准备对策\n\n攻击准备在最后几个步骤（发起攻击）之前很难进行对策。然而，组织和个人可以采取一些最佳实践来确保系统安全。\n\nCTI 团队需要为可能针对组织的潜在对手建立良好的威胁画像。威胁情报框架例如\
  \ MITRE ATT&CK 框架可用于识别对组织构成威胁的潜在对手群体。团队必须确定所选群体是否曾针对过该组织或同一投资组合下的其他组织。它必须突出对手对其组织的兴趣中可能的目标。以下是您可以采取的一些对策来为对手攻击做准备：\n\
  \n- **保护最关键的资产：** 这又回到了资产识别和优先级排序。CTI 团队必须列出关键资产以及保护它们的措施。他们还必须识别当前关键资产保护措施中的差距，并推荐可靠的方法，例如限制访问、加密传输中或静止状态的\
  \ PII，以及在员工本地机器上保护资产。\n- **限制公开信息的数量：** 组织在网上发布的信息越多，对手为准备攻击和识别潜在攻击面所拥有的数据就越多。互联网网关信息、电子邮件地址、域名注册详情和第三方供应商都是可以为对手提供启动攻击项目所需知识的信息。因此，不公开此类信息会给对手的准备带来挑战。\n\
  - **教育员工和个人：** 在大多数网络攻击中都涉及人为因素。钓鱼和勒索软件等攻击仍然严重依赖人为操作。必须对员工进行教育，使其能够识别恶意活动（钓鱼邮件、恶意链接、镜像\
  \ Web 应用等）。诸如 `tesla.com` 和 `teslaa.com` 这样的域名并不相同；`microsoft.com` 和 `mikrosoft.com`\
  \ 也是不同的。\n- **安装钓鱼检测软件：** 必须拥有钓鱼检测器或拼写错误域名检测器（专门针对组织的私有域名）。这一措施可以防止域名伪造。\n\n一些最佳实践可以帮助最小化或使对手的生活变得困难。痛苦金字塔可作为检测对手活动的参考。它还向您展示了每次安全团队拒绝金字塔某一层级访问时，对手会感到多么痛苦。组织必须成熟安全基础设施，以利用威胁情报有效保护系统。在下面的小节中，我们将查看攻击框架的第二阶段：执行阶段。\n\
  \n## 对手攻击执行\n\n此步骤假设前一阶段已成功。对手采取一系列步骤在系统中建立立足点并达到目标。执行阶段可以根据对手使用的技术自动进行或基于事件进行。当使用自动执行时，恶意软件会在系统中传播而无需攻击者推动，并迅速感染系统。在基于事件的执行中，恶意软件依赖网络或用户事件扩展到系统中。对手执行以下步骤以确保其目标得以实现。\n\
  \n### 初始入侵和立足点建立\n\n在此步骤中，对手可以访问系统中的一个或多个主机，或已能够访问网络。假设攻击者已作为受信任用户登录系统。他/她可以针对组织中权限更高的人员，因为电子邮件和消息来自受信任的边界。\
  \ spear phishing 用于此类目的。攻击者确保对被入侵主机的访问和控制得以维持。在此阶段，对手可以在被入侵主机上安装后门，以便通过第一阶段准备的 C2\
  \ 通道进行远程访问和控制。\n\n对手确保为受害者与攻击者服务器之间的双向通信适当地、安全地建立出站通信。C2 通道大多是加密的，且对手端服务器信息被混淆以隐藏攻击。后门和账户访问是攻击者建立立足点使用的两个主要策略。\n\
  \n### 访问扩展\n\n在建立立足点后，对手尝试获得更多洞察并扩展其在受害者系统中的立足点。扩展访问的步骤包括 **权限提升**、**横向移动**、**内部侦察**\
  \ 和 **访问持久化**，如下所示：\n\n- **权限提升**：攻击者尝试访问更多资源，即使他/她没有预期的权限。攻击者可以使用凭据转储或哈希传递技术来绕过身份验证并获得\
  \ root 级资源访问权限。\n- **横向移动**：对手尝试访问受害者系统中的其他网络、主机和存储库。Pivoting 是用于访问其他企业网络的方法之一。然而，像\
  \ **PsExec** 和 **net** 这样的命令使用的方法可以为其他组织资源提供访问权限。对手利用新旧技术在系统中移动。\n- **内部侦察**：这是对手为实现目标并可能窃取超出计划的数据而必须进行的重要步骤。对手尝试从内部视角收集有关受害者的更多信息。他们可以利用操作系统的命令或使用扫描器（如\
  \ **Nmap**）来枚举系统。\n- **访问持久化**：如果对手希望为未来攻击维持访问，则会这样做。他/她确保立足点在系统重启或清理后仍然持久。大多数对手使用后门和\
  \ Web shell（用于远程 Web 服务器控制）来在受害者系统中维持持久性。\n\n对手操作的执行阶段很危险，因为他/她已访问系统。详细步骤并非按顺序进行，这意味着对手可以同时进行权限提升和持久化。在此阶段，受害组织只能依靠高级监控方法来检测攻击。这是因为一旦进入内部，对手很可能会规避各种防御系统。在下一小节中，我们将查看攻击执行的常见缓解技术。\n\
  \n### 攻击执行缓解程序\n\n一旦攻击成功实施，安全团队的目标是在威胁完全清除之前将攻击影响降到最低。当系统已被入侵时，组织检测网络攻击需要时间。这是一个事实：大多数研究表明，检测已发生攻击的平均时间超过\
  \ 30 天。让我们来看一些可以最小化攻击因素的安全最佳实践：\n\n- **限制系统中的安装流程**：对手可能想要安装后门或其他恶意软件以扩展受害者的立足点。通过限制系统中软件的安装，安装恶意软件的权限会被限制或无效，除非攻击者拥有更高权限访问。\n\
  - **实施有效的访问控制**：使用 *最小权限* 概念。不要授予超出所需权限的权限。这一措施限制了对手可能拥有的访问级别并限制了他们在系统中的移动能力。实施并执行\
  \ *强密码策略*，使用 **多因素身份验证**（MFA）、频繁更改密码并禁止密码共享。\n- **持续监控网络流量**：CTI 团队可以建议使用 SIEM、TIPs、传统监控工具和\
  \ UBA 有效监控网络流量并识别网络或用户流量模式中的异常。此对策包括监控入站和出站流量，以防止 C2 通道设置的出站通信。\n- **实施强大的系统日志管理**：在设计良好的\
  \ IT 基础设施中，所有活动均以日志形式记录。攻击者以破坏系统日志（清除、删除和销毁）而闻名。因此，组织必须限制对日志文件的访问，以确保恶意和合法用户都不会篡改它们。\n\
  - **监控系统进程**：将恶意软件隐藏在合法进程中是对手规避防御系统的方法之一。安全团队需要监控系统进程并报告进程行为的变化。\n- **实施有效的补丁管理**：安全团队必须确保所有系统软件、应用程序和服务都经常进行修补。此对策消除了因系统中的未修补或易受攻击的应用程序而被利用的可能性。自动化补丁管理流程至关重要。\n\
  \n\n\n- **建立充分的终端保护和管理并投资威胁狩猎：** 这有助于你在网络战领域领先于对手。必要时使用加密（尤其是针对敏感资产和数据）。当使用强加密时，如果攻击者没有解密手段，被窃取的数据可能毫无用处。\n\
  \n所有这些措施都是遏制措施，用于在发生入侵时防御系统并增强其安全态势。尽管如此，组织仍需要拥有可靠的 **事件响应 (IR)** 和 *取证* 团队来根除威胁并收集证据以追溯攻击源。CTI\
  \ 团队和内部安全团队必须共同合作，以保护系统并在攻击发生时做好准备。\n\n## Summary\n\n威胁建模在构建情报方面是一个至关重要的主题。了解攻击面、威胁向量以及对手（及其动机）有助于形成良好的安全态势。本章通过关注\
  \ CTI 团队可以采用的不同方法来构建可靠威胁画像的方式，介绍了威胁建模。所有威胁建模方法的共同点都包括了解资产、向量和面，因为它们是攻击者感兴趣的点。威胁建模的结果用于选择应用于情报计划的数据源。\n\
  \n到目前为止，你应该能够执行威胁和对手建模。你还应该能够为建模任务选择适当的方法，或根据组织的要求定制方法。\n\n在下一章中，我们将介绍威胁情报数据源。\n"
- "## 7 Threat Intelligence Data Sources\n\n情报是基于对从不同来源和馈送收集的信息和数据进行分析而产生的。数据收集是一个任意操作，直接与为\
  \ CTI 项目设定的目标和要求相关联。为此，获取正确的数据至关重要。因此，数据馈送（或数据源）越可靠、越合适，对网络威胁的理解就越好，这有助于组织将防御系统调整到威胁态势。本章的主要目标是了解\
  \ *什么* 数据需要为情报收集以及 *在哪里* 可以获取。 本章将研究三种威胁数据源：**开源威胁情报 (OTI 或 OSINT)**、**共享威胁情报 (STI)**\
  \ 和 **付费威胁情报 (PTI)**。PTI 也被称为封闭威胁情报。\n\n本章重点介绍识别不同的威胁情报来源并将其与整体 CTI 计划联系起来。我们将为你提供必要的知识，以便评估一种或多种威胁馈送类型的需求，并使用各种来源执行情报数据收集。\n\
  \n到本章结束时，你应该能够做到以下几点：\n\n- 了解不同的情报数据源以及如何为你的计划或组织定义合适的来源。\n- 了解 OSINT 的作用及其在 CTI\
  \ 计划中的应用。\n- 了解在构建情报时对恶意软件数据的解析和分析。\n- 了解共享和付费威胁馈送的好处。\n- 了解如何为未来应用构建和存储情报数据。\n\n\
  在本章中，我们将涵盖以下主要主题：\n\n- 定义威胁情报的合适来源\n- 开源情报馈送 (OSINT)\n- 用于威胁情报的恶意软件数据\n- 其他非开源情报来源\n\
  - 情报数据结构化和存储\n\n### Technical requirements\n\n对于本章，没有突出显示任何特殊技术要求。大多数用例如有必要将使用 Web\
  \ 应用程序。\n\n### Defining the right sources for threat intelligence\n\n选择数据源是 CTI\
  \ 数据收集阶段的一部分。因此，这是利用情报增强安全的重要步骤。拥有基本安全防御系统的组织能够收集网络流量、日志以及系统中发生的任何其他活动。这些数据是情报的良好来源。然而，大多数公司会查看外部来源，以丰富威胁情报平台\
  \ (TIP) 或 SIEM，从而产生可靠的威胁情报结果。威胁数据源主要有两大类：内部和外部。让我们讨论两者的区别。\n\n### Internal threat\
  \ intelligence sources\n\n内部来源包括来自内部系统内部的所有数据。这些来源包括 *网络日志*（网络元素日志，如防火墙、IDS、IPS、代理服务器、应用服务器等）、*用户日志*、*应用日志*、*内部恶意软件分析*、*历史网络安全事件报告*\
  \ 和 *安全报告*。然而，要使内部数据构成良好的 TI 数据源，CTI 团队或分析师必须将其转化为有价值且有意义的内容。这就是 CTI 分析师多技能能力发挥作用的地方。虽然有用于将数据解析为特定格式的工具，但\
  \ CTI 分析师必须将系统日志、流量和报告处理为组织其他部门易于使用的用户友好格式。收集的内部数据发送到 TIP 或 SIEM 进行自相关和索引。一旦内部数据格式化后，即可查询以产生可操作的情报。\n\
  \n### Applying Internal Intelligence – Simple Case\n\n我们假设恶意软件通过 **跨站脚本** (**XSS**)\
  \ 漏洞感染系统，并在应用日志中留下痕迹。它试图与远程服务器（C2 服务器）通信。当尝试访问敏感目录时被检测并阻止。（1）TIP/SIEM 自动针对 XSS 执行（中等）、尝试与外部域通信（重大）以及提供敏感目录访问（严重）创建三个警报\
  \ – TIP/SIEM 连接到系统日志、流量、流和事件馈送。（2）分析师使用脚本解析系统日志、网络流量和事件并将其存储在数据库中。\n\n分析师可以识别可能的\
  \ *入口点*（和 *漏洞*）、*所走路径* 以及恶意软件访问的 *文件* 和 *目录*。因此，他们可以提取攻击的传播范围和恶意软件文件。每当检测到威胁时，CTI\
  \ 团队都会编目所有细节（路径、入口点、IP地址、域名信息等）并在它们之间建立相似度指标。这有助于推断威胁组织、其 TTPs 以及其在组织中的兴趣点，以增强防御系统。\n\
  \nTIP 或 SIEM 充当单一的中央聚合点并容纳各种数据源格式。\n\n内部数据源在一定程度上可用于威胁情报。它们丰富且代表系统中发生的活动的完整洞察。然而，仅使用内部\
  \ TI 数据会带来两个可能的缺点：*反应式情报* 和 *对威胁态势的部分视图*，如下所述：\n\n- **反应式情报**：使用内部来源，情报是基于从内部网络观察到的事件和流构建的。随着更多观察被\
  \ TIP 或 SIEM 存储和处理，CTI 团队构建情报。因此，系统无法配置为发现尚未见过的 *未知* 或 *全球* 威胁（攻击者可以利用这一漏洞来策划新攻击）。它只对已知的威胁做出反应。\n\
  - **对威胁态势的部分视图**：将情报限制在系统数据中，CTI 团队只能瞥见针对系统使用的威胁。然而，可能存在其他同类组织已记录的更多威胁。攻击者可以利用这一劣势，使用尚未被你的情报覆盖的已知\
  \ TTPs 来入侵你的组织。\n\n将内部数据与外部数据源混合对于生成更可靠、更具反应性和预防性的情报至关重要。在下一节中，我们将介绍外部数据源以及它们如何丰富组织的威胁情报计划。\n\
  \n### External threat intelligence sources\n\n外部 TI 来源涉及在组织外部收集的数据。这些数据来自不同的提供商和来源，例如社区、论坛、政府、其他执法机构、搜索引擎、暗网和安全杂志。所有这些数据都可以免费获取（OSINT\
  \ 和 STI）或通过付费订阅获取（PTI）。最受欢迎的外部威胁数据包括以下内容：\n\n- **TI 数据馈送**：这些是来自一个或多个来源的数据流。这些来源可以包括与恶意软件数据、客户遥测、人情报、SSL/TLS\
  \ 证书、互联网扫描和爬取、**入侵指标 (IoC)** 以及反情报（蜜罐、DNS 监控等）相关的馈送。TI 馈送有两种类型：订阅式 TI 馈送（需要货币或简单的用户订阅）和开源\
  \ TI 馈送。社区和公司提供这些数据。\n\n\n\n\n-   **政府来源和报告：** 这是由政府和执法机构提供的数据。美国国土安全部的 **自动化指标共享（AIS）**\
  \ 是其中一个政府来源，分享威胁指标，如 IP 地址、域名以及恶意团体的钓鱼详情。**联邦调查局（FBI）** 是另一个与组织在情报事务中合作的执法机构。美国网络安全和基础设施安全局\
  \ **网络安全和基础设施安全局（CISA）**、英国 **国家网络安全中心（NCSC）**，以及美国 **国家安全局（NSA）** 是其他政府情报来源和报告的例子。执法机构构成可靠的外部来源，因为政府服务是网络犯罪分子最常攻击的目标之一。然而，这也取决于入侵事件的状态，因为执法数据依赖于已发生的入侵。\n\
  -   **众包数据：** 众包情报数据允许 CTI 团队或组织收集公开信息以提取安全问题的本地上下文。也称为集体情报，它允许你通过安全专家、分析师、博客等人的集体知识来提取可用于构建情报的信息。众包数据的示例来自安全分析师和管理人员博客的信息，他们分享自己经历过的新闻、问题、事件和活动。在发生入侵的情况下，相关安全分析师会与社区分享事件详情。众包数据的优势在于覆盖外语和团体，使组织能够更全面地了解威胁态势。FeedReader\
  \ 是可用于聚合和管理 RSS 源（安全杂志、报告、博客等）的工具（应用程序）的示例。\n-   **业务共性：** 当对手攻击一个组织（银行、医疗、零售等）时，他们很可能将攻击扩大到同一行业的更多组织。因此，具有相似业务概况的组织开始创建团体和社区以促进情报共享。这些团体出于共同目标共享情报指标、报告和\
  \ TTP。一个此类团体的示例是 **信息共享和分析中心（ISAC）**。\n\n外部来源并非特定于组织。因此，选择合适的来源的需求就出现了。威胁数据源可以提供多种指标、行为者、战术、技术、流程等的流，这些流以随机且非上下文化的形式出现。这些来源可能会使\
  \ CTI 团队或分析师不堪重负，使其难以消费或证明其价值。因此，分析师需要从数据源中选择正确的源并适当使用。我们将研究三个组件，以减轻选择正确来源和适合情报的源的痛苦：组织概况、源的评估和数据质量。\n\
  \n## 组织情报概况\n\n组织的威胁概况提供了情报所需数据的基线。它是 CTI 项目执行中多个流程结果的组合。组织概况必须考虑业务目标、CTI 需求、威胁情报框架和平台、技艺和标准，以及威胁建模操作的结果（用于评估资产、攻击面和威胁向量）。构建组织威胁概况以确定数据源将本书前六章联系在一起。以下要点详细说明了情报概况的考虑因素：\n\
  \n-   **业务目标：** CTI 团队或分析师必须了解组织的业务范围。这包括了解系统基础设施、业务线、可用资源、威胁情报预算等。请参阅 *第1章，网络威胁情报生命周期*，以了解有关业务目标、规划和\
  \ CTI 方向的更多详细信息。业务目标用于限制数据收集范围，因为我们可以将不属于组织业务线的威胁源搁置。我们可以用它们来隔离超出分配预算的源。\n-   **CTI\
  \ 需求：** CTI 团队或分析师必须了解组织的安全历史（过去的威胁、攻击和入侵）并使用 CTI 短期、中期和长期目标来选择正确的数据源。例如，通过依赖 CTI\
  \ 需求，分析师可以搁置与针对组织的威胁团体无关的威胁数据源。当前的安全态势在选择正确的数据源方面也发挥着至关重要的作用。请参阅 *第2章，需求与情报团队实施*，以了解有关\
  \ CTI 需求的更多详细信息。\n-   **威胁情报框架和平台：** 威胁情报平台和框架在选择威胁数据源方面至关重要。每个 TIP 都有特征和能力，包括但不限于从不同来源聚合数据的技术、支持的数据格式和存储管理。每个框架都有分析威胁团体和\
  \ TTP 的架构和模型。因此，用于 CTI 项目的框架、TIP 或 SIEM 决定了可以使用哪些类型的源。例如，分析师可以搁置无法与 MITRE ATT&CK\
  \ 框架一起使用的源。他们可以跳过格式和 API 不被使用的 TIP 或 SIEM 支持的源。请参阅第 3 章，*威胁情报框架*，和第 5 章，*目标设定、CTI\
  \ 策略的程序和实际用例*，以了解有关情报框架和平台的更多详细信息。\n-   **技艺和标准：** CTI 分析师使用 API 连接到威胁数据源。这些 API\
  \ 可能支持一种或多种威胁数据格式（STIX、TAXII、CSV、TXT 等）。虽然这也与框架和平台相关，但分析师需要选择可以轻松集成到现有安全基础设施的数据源。有关技艺和标准的更多详细信息在第\
  \ 4 章，*网络威胁情报技艺和标准* 中提供。\n-   **威胁建模：** 威胁建模为对手、他们对您组织的潜在兴趣、他们可以攻击的资产、可能的攻击面以及他们可用于入侵您组织的方法提供了极好的洞察。数据源提供了大量行为者、TTP、兴趣范围等。因此，通过将威胁建模输出与威胁源数据匹配，分析师可以选择适合该项目的正确源。请参阅第\
  \ 6 章，*网络威胁建模与对手分析*，以了解有关威胁建模的更多详细信息。\n\n情报概况是对当前系统能力以及在威胁数据投资方面需要做的事情的完美评估。诸如行业相关风险和攻击等参数与整体组织目标相匹配，并用于选择数据源。付费数据源可能很昂贵；因此，了解预算和需求可以帮助保护开支。第二部分将在下一节中讨论。\n\
  \n## 威胁源评估\n\n组织情报概况可能是选择的基线，但在寻找适合摄入组织安全系统以进行威胁情报的合适数据源时，数据源本身才是主导因素。数据源需要使用以下列表中突出的标准进行评估。请注意，可以使用多个标准，但我们在这里只提供了最常用的标准：\n\
  \n-   **数据源：** 情报数据源有多种来源。CTI 团队必须确定项目所需的源类型。CTI 团队可能只对外部 IoC 感兴趣。在这种情况下，反情报或人力情报数据源将超出范围。\n\
  -   **数据周期：** 良好的数据源或源必须是最新的。提供的信息必须相关，并且源提供商必须指明源中包含的信息的相关周期。CTI 必须评估数据源是否可用于短期、中期或长期\
  \ CTI 目标。\n-   **来源认证：** CTI 团队必须验证数据源的透明度，以了解其是否与项目相关且有价值——因此需要了解数据来自何处。例如，来自政府机构和其他执法组织的源可以被视为真实且透明。\n\
  -   **唯一数据百分比：** 没有人愿意为相同的数据付两次钱。CTI 团队需要突出源或来源之间的重叠，以最大限度地减少冗余信息的可能性。在使用付费威胁数据源时，查看数据的独特性至关重要。\n\
  -   **潜在投资回报率（ROI）：** CTI 团队必须分析源的内容，评估集成工作，突出可以从源或源中获得的好处，并计算操作的潜在 ROI。目标是了解信息是否给组织带来价值。\n\
  \n分析源或来源并不能保证信息内容的质量。分析师必须跟踪每个源的使用情况以及从中采取的安全措施。对于 1 级组织（请参阅第 5 章，*目标设定、CTI 策略的程序和实际用例*），审查所选源或来源的社区评级至关重要。除了评估源本身之外，CTI\
  \ 分析师还必须查看源或来源提供的数据质量。这意味着使用任何必要的方法来评估源的内容。透明的来源提供数据内容的概览，帮助威胁分析师和安全专业人员就威胁源和来源做出明智的决策。在下一节中，我们将研究评估威胁数据质量。\n\
  \n\n\n## 威胁数据质量评估\n\n质量评估是威胁数据源价值主张的重要贡献者。该价值由许多参数定义，例如数据中的指标类型和信息。然而，在评估威胁数据源的质量时，还必须考虑一些额外参数。数据源维护、更新、改进研究以及独特的视角都是威胁数据质量评估考虑的额外因素示例。TI\
  \ 数据质量是保留来源的最佳输入。以下列表提供了一些可用于评估收集数据质量的参数：\n\n- **Coverage:** CTI 团队必须确保数据源（或源）符合其预期。它必须涵盖其应涵盖的一切。预期的指标或信息必须以较高或最大比例被观察到。因此，必须在质量评估中加入覆盖率指标。*真正例、假阴性、真阴性\
  \ 和 假阳性* 是可用于计算 TI 数据源覆盖率的指标。\n- **Accuracy:** 获取数据后，CTI 团队或分析师必须通过分析真正例与假阳性的比率来评估其准确性。产生大量假阳性的数据馈送可能不适合安全用例。让我们设想一个需要战情室的优先安全警报，而事后你才知道那是假阳性。\n\
  - **Latency:** TI 质量评估的重要组成部分之一是延迟。它反映了从检测到潜在威胁向量到馈送或源提供警报所需的时间。CTI 团队必须确保数据源和用于集成的工具能让你快速收到潜在威胁的通知。\n\
  - **Ease of automation:** 原始威胁数据量可能很大。因此，处理数据需要大量人力。然而，通过 API 调用、脚本和平台，应该能够自动化整个数据馈送摄取过程——因此需要确保满足自动化便捷性要求。\n\
  \n> **重要提示**\n> 在大多数情况下，数据质量是在数据源获取后才有效衡量。这意味着 CTI 团队可以集成开放源的数据并评估质量。然而，对于付费来源，首先集成数据可能并不容易。因此，建议组织在购买数据前先进行试用或概念验证。\n\
  \nCTI 团队必须确保数据与业务或运营行业相关且具有价值（投资和收入保护）。当组织的情报画像构建正确时，数据质量评估在一定程度上得以简化。\n\n定义正确的\
  \ TI 数据来源是 CTI 项目成功的关键一步。你应该能够使用三个组件（组织情报画像、威胁源评估和威胁数据质量评估）来选择正确的情报数据源（或馈送）。在下一节中，我们将介绍最受欢迎的情报来源之一：**开源情报（OSINT）**。\n\
  \n## 开源情报源（OSINT）\n\n威胁情报来源从私人渠道获取可能很昂贵。对于中小企业来说，花费数千美元订阅 TI 数据可能不现实（财务上不利）。然而，组织可以利用开放源的公共数据来构建情报。OSINT\
  \ 源和馈送是公共形式集体情报的结果。组织、分析师和研究人员汇总并结构化其安全输出结果并免费发布为馈送。OSINT 来源包括公开馈送、搜索引擎、用户名、电子邮件地址、域名、社交网络、IP\
  \ 和 DNS 查询以及 URL。OSINT 来源列表很长，CTI 团队必须能够为特定情报项目选择正确的 OSINT 数据。让我们来看看 OSINT 的一些优势。\n\
  \n### 开源情报的优势\n\n顾名思义，开源数据源是公开可用的——尽管访问它们可能需要一些技能和额外工作。正因如此，它们已成为各类安全组织有吸引力的威胁信息领域。以下几点突出了\
  \ OSINT 爆炸式增长的主要原因：\n\n- **Low or no cost**: 来自安全和 CTI 厂商的数据源和馈送价格昂贵，中小企业或预算紧张的组织可能难以承受。开源情报馈送节省预算并确保潜在更高的\
  \ **投资回报率（ROI）**，同时提供极佳的技术价值。\n- **Public maintenance**: 大多数开源威胁情报数据由全球信息安全社区维护。研究人员和专家不断更新和丰富\
  \ OSINT 平台以实现通用目的：打击网络犯罪和保护资产。\n- **Data accessibility**: OSINT 对所有人开放。这意味着安全分析师在必要时始终可以使用它们。其中大多数可通过\
  \ **应用程序编程接口（APIs）** 或简单注册和下载访问。\n- **Data availability**: 社交媒体、搜索引擎和人类互动等 OSINT\
  \ 始终存在。Twitter 上的公众论坛或 LinkedIn 上的文章始终可供公众访问，且主题经常更新。\n- **Information sharing**:\
  \ OSINT 的目标是让 infoSec 社区共享有关威胁、漏洞、利用、泄露、最佳实践等的信息。这一优势使组织能够建立预防措施。例如，在亚洲发现的利用可以帮助南非的组织采取预防措施（如修补或暂停攻击面，这可能导致该利用被用来攻击他们）。\n\
  \n许多组织，包括国家安全机构、执法机构和组织安全领导者，越来越依赖公共来源来制定情报策略。例如，通过监控公共论坛、社交媒体、新闻媒体和互联网流量，可以预见网络威胁。黑帽黑客在暗网（或暗网）上出售利用和敏感数据。暗网作为\
  \ OSINT 可用于识别已发生的泄露或可能的信息泄露。在下一节中，我们将介绍一些流行的公共数据源。\n\n### 开源情报门户\n\n有几个开源馈送可供组织用于开始为\
  \ CTI 项目收集数据。我们无法在此全部涵盖。相反，我们将讨论一些最常用的开源威胁情报平台，这些平台有助于组织启动 CTI 项目。这些来源是免费的，可能需要注册或会员资格。\n\
  \n### 国土安全部 – 自动化指标共享（AIS）\n\n**自动化指标共享（AIS）** 允许实时共享威胁指标和防御程序，为组织提供最小化网络攻击和管理其可能造成的损害的必要组件（https://www.cisa.gov/ais）。许多社区、美国联邦部门、机构和外国公司都是\
  \ AIS 的一部分。情报免费共享。使用 AIS，参与者近实时共享指标、防御战术和缓解程序。\n\nAIS 使用 **结构化威胁信息表达（STIX）** 和 **可信自动化指标信息交换（TAXII）**\
  \ 分别进行威胁指标和机器对机器通信。它遵循客户端-服务器架构，参与者使用 STIX/TAXII 客户端与 **网络安全和基础设施安全局（CISA）** 服务器通信。获取\
  \ AIS 指标馈送需要以下步骤（更多细节见 CISA 网站）：\n\n- 1. **Register with CISA:** 组织需要向 CISA 注册并签署条款和条件以启动会员流程。\n\
  - 2. **Deploy a STIX/TAXII infrastructure:** 组织必须安装 STIX/TAXII 客户端以与 CISA 服务器通信并交换威胁指标和防御措施。STIX/TAXII\
  \ 是一个开源标准；因此，其基础设施可以内部构建或通过厂商获取。在 *第 5 章、目标设定、CTI 策略程序和实际用例* 中，我们部署了一个基本的 STIX/TAXII\
  \ 客户端以连接到公共 STIX/TAXII 服务器并获取指标馈送。\n- 3. **Acquire a Public Key Infrastructure (PKI)\
  \ certificate:** 每个参与者必须拥有由 **联邦桥梁证书颁发机构** 提供的 PKI 证书。\n- 4. **Sign an interconnection\
  \ agreement and provide the IP address to CISA:** 潜在参与者必须签署协议以连接到 CISA 服务器并访问共享情报。他们必须向\
  \ CISA 提供公共 IP 地址以将其添加到参与者地址的受信任列表中。现在，组织已准备好与所有 AIS 成员交换情报。\n\nCISA 通过匿名化情报提交来保护参与者的信息。这种保护是通过美国\
  \ 2015 年 CISA 法案实现的，该法案为 AIS 成员授予责任、隐私和所有必要的保护。请注意，只要遵循所需步骤，任何组织都可以成为 AIS 成员。\n\n\
  ### AlienVault – 开放威胁交换（OTX）\n\n**开放威胁交换（OTX）** (`https://cybersecurity.att.com/open-threat-exchange`)\
  \ 是一个开放的 TI 社区，促进协作和共享最新的威胁数据、趋势和技术。全球的安全专业人员和研究人员通过频繁提交威胁指标参与平台的成长。要使用 OTX，你需要订阅\
  \ **OTX 脉冲**，因为它提供与威胁相关的 IoC。OTX 可以通过使用 DirectConnect API 集成到 TIP 或 SIEM 中。API 将\
  \ OTX 情报与内部系统工具同步。\n\n\n\nOTX 可作为 STIX/TAXII 服务器运行，使其可与任何 STIX/TAXII 客户端一起使用。它还可以集成到\
  \ MISP 平台中。所生成的部分 IoC 包括 IP 地址、域名、主机名、电子邮件、URL 和 URI、文件哈希、CIDR 规则、CVE 编号、文件路径等。使用\
  \ OTX 数据可以帮助您解决以下问题：\n\n- **组织暴露程度：** 组织受威胁影响的严重程度。\n- **威胁相关性：** 通过分析 OTX 情报，CTI\
  \ 分析师可以确定威胁与组织的相关程度。\n- **威胁行为者和组织：** OTX IoC 可帮助您识别威胁背后的对手和动机。\n- **被针对的资产：** 根据收集的数据，OTX\
  \ 可帮助您识别最受针对的资产。\n\n> **重要说明**\n> AlienVault OTX 是组织启动 CTI 项目时可使用的情报来源和服务之一。它不仅提供与\
  \ SIEM 和 TIP 的集成，而且还充当 STIX/TAXII 服务器，从而节省并保护商业 STIX 服务器的成本。\n\n情报来源如 OTX 和 AIS\
  \ 可被视为独立的情报平台。它们从多个数据源（如搜索引擎、论坛、电子邮件、日志等）中提取信息，并以 STIX/TAXII 或数据库文件等格式向公众提供。\n\n\
  ## InfraGard 门户 – FBI\n\nInfraGard 定义了 FBI 与其他部门（公共和私营）之间的合作伙伴关系。这是一种协作，FBI 与组织共享网络安全事件和威胁情报，以打击美国的网络犯罪。信息敏感性的要求和性质使其成为基于美国的会员来源——只有美国公司、学院和个人可以订阅该数据源。\n\
  \nInfraGard 将关键基础设施划分为 16 个部门，代表主要业务领域。组织（会员）可以访问 FBI 正在追踪的近期网络威胁和犯罪。更多信息可从官方网站获取\
  \ (https://www.infragard.org/)。\n\n> **重要说明**\n> 对来自第三方（如执法机构和政府来源）的 **入侵指标 (IOCs)**\
  \ 进行核查至关重要。其中一些（如哈希、IP地址和域名）可能是合法程序或应用程序指标。不对 IOC 进行核查可能导致业务中断。有关更多信息，请参阅 *第 10\
  \ 章，威胁建模和分析 – 实际用例* 中的入侵分析用例。\n\n## Internet Storm Center (ISC) 和 DShield\n\nInternet\
  \ Storm Center 是一个开放且可访问的网络安全事件共享平台。SANS 研究所通过召集安全专家和组织共同分析互联网流量（大规模）以查找恶意活动来推动\
  \ ISC 的运行。它使用传感器每天收集入侵检测日志条目。它覆盖超过 50 个国家/地区的 50 万多个 IP 地址 (https://www.dshield.org/about.html)。ISC\
  \ 致力于识别对手用于实施网络犯罪的站点，并提供有关各行业和地区策划的攻击类型的数据。\n\n传感器收集互联网上可疑流量的信息。ISC 使用的这些传感器可与大多数网络安全元素（防火墙、IDS、宽带设备、操作系统数据）配合使用，并将数据发送到\
  \ DShield 数据库，由志愿者和机器分析以识别行为。结果发布在 ISC 网站 (https://isc.sans.edu/dashboard.html)\
  \ 上，可通过脚本查看或查询。SANS 研究所还赞助 DShield 服务。CTI 分析师可以注册 DShield 以获得 *访问日志* 的好处，这些日志已收集并提交到数据库。注册可允许\
  \ CTI 团队下载日志并将其与内部安全系统（TIP 和 SIEM）集成。\n\n许多组织在系统已被感染很长时间后才检测到网络攻击。ISC 鼓励组织将其网络安全日志提交给\
  \ Dshield 进行分析。因此，注册 DShield 的另一个优势是激活 *反击能力*，该能力允许 ISC 通知组织正在发生或已发生的攻击。\n\n> **重要说明**\n\
  > 任何组织都可以使用 SANS 研究所的 DShield 服务来监控入侵尝试并保护系统。虽然注册提供一些好处，但提交网络元素日志并非必需。\n\n有关 ISC\
  \ 和 DShield 的更多详细信息，请访问本节第二段中提供的官方网站。\n\n## 信息共享和分析中心 (ISACs)\n\n**信息共享和分析中心 (ISACs)**\
  \ (https://www.nationalisacs.org/) 为收集影响不同关键基础设施的网络威胁信息提供中心点。组织可以根据所属部门加入 ISAC。ISAC\
  \ 会员资格可能需要付费，但提供的情报对公众来说价格合理或免费。各部门的 ISAC（如金融服务、通信、健康等）收集和分析威胁信息。生成的情报随后连同减轻风险和提高安全的工具一起与会员共享。加入\
  \ ISAC 的一些好处包括以下内容：\n\n- 通过门户、平台和应用程序进行 24/7 部门特定的网络威胁监控和警报\n- 为注册会员提供动手培训、演练、峰会和安全活动，以确保他们充分利用平台的优势\n\
  - 对网络事件的所有步骤提供可靠支持\n- 支持 STIX/TAXII 标准\n\n组织可以利用 ISAC 的优势将情报集成到业务运营中。会员费与组织的规模和基础设施相关（关键资产、收入、客户群和公司规模）。\n\
  \n## Abuse.ch\n\nAbuse.ch (`https://abuse.ch/`) 是一个由瑞士专业人士拥有的开源平台，用于恶意软件跟踪和监控。该平台跟踪与不同恶意软件类型相关的指标，如\
  \ IP 地址、域名、URL、分布式站点、支付站点和 C2 服务器。众多安全专业人员、厂商、研究人员和执法机构使用 abuse.ch 来了解恶意软件使用的机制以及威胁行为者如何利用这些机制发起网络攻击。Abuse.ch\
  \ 的主要项目包括 MalwareBazaar（用于共享恶意软件信息）、*Feodo tracker*（用于共享与 Feodo 恶意软件相关的僵尸网络 C2 服务器）、*I\
  \ got phished*（用于获取有关网络钓鱼受害者的信息——域名、电子邮件地址、IP地址等）和 *SSL blacklist*（用于识别恶意 SSL 证书，帮助组织检测欺诈性\
  \ SSL 连接）。SSL blacklist 还帮助检测和阻止 TCP 层上的恶意软件僵尸网络 C2 通道。此外，还有 *URLhaus*，用于共享主要用于恶意软件分发的\
  \ URL 的信息，以及 *threat fox*，用于与网络安全领域共享 **入侵指标 (IoCs)**。\n\nAbuse.ch 是一个非营利组织；因此，它允许\
  \ CTI 分析师、安全厂商和 IT 安全专业人员自由收集信息并构建更好的网络防御系统。从 abuse.ch 收集数据的两种标准方式是：使用提供的 API 或将数据作为\
  \ CSV 文件下载并加载到 TIP 或 SIEM 中。\n\n> **重要说明**\n> Abuse.ch 的 MalwareBazaar 提供了一个 Python\
  \ API (`https://bazaar.abuse.ch/api/`)，CTI 团队可使用它将恶意软件样本（数据）集成到 TIP 或 SIEM 系统中。该\
  \ API 还可用于将恶意软件样本上传到 MalwareBazaar 数据库。后者也可用于浏览恶意软件信息。恶意软件样本必须谨慎处理，以避免分析过程中感染。\n\
  \n安全分析师和研究人员通过上传恶意软件样本、网络钓鱼数据和僵尸网络 C2 通道信息为平台做出贡献至关重要。这不仅丰富了平台，还帮助安全社区打击网络犯罪。\n\n\
  \n\n## 暗网、DarkReading.com、BleepingComputer.com 及其他新闻门户\n\n暗网被视为恶意活动的地下世界。暗网托管了一些安全领域中最有价值的黑客论坛和用于恶意黑客工具和资源的市场。根据\
  \ 2020 年 7 月的一份福布斯报告，超过 15 亿个登录凭据来自 10 万起数据泄露，被窃取并在暗网上出售 (`https://bit.ly/3uc4qp0`)。CTI\
  \ 团队和分析师必须制定机制来收集暗网信息以识别潜在威胁。大多数付费情报来源会爬取暗网以获取额外的情报和威胁预警。然而，预算有限的小型企业可以通过开发内部网络挖掘运营系统（前提是具备必要的技能）来利用暗网收集威胁数据。暗网可以揭示重要的威胁信息，例如\
  \ *新开发的恶意软件*、*新漏洞利用* 和尚未在表层网络中为人所知或可用的 *零日漏洞*。CTI 分析师需要将从暗网收集的数据与 CTI 目标和要求保持一致，以回答以下基本问题：\n\
  \n- **热门话题**：暗网中的热门安全话题有哪些，它们如何影响我们？\n- **供应商的存在**：在暗网论坛和市场中主要讨论哪些供应商？\n- **行业存在**：哪些行业在论坛和市场中存在感更强？CTI\
  \ 可以与 CTI 消费业务领域建立联系。\n- **漏洞利用和恶意软件**：暗网上正在开发、使用或出售哪些漏洞利用？CTI 团队或分析师需要了解组织是否可能成为此类漏洞利用和恶意软件的目标。\n\
  - **漏洞**：新发现的漏洞及其利用是什么？CTI 团队随后可以评估组织对这些漏洞的抵御能力。\n- **新威胁和组织**：暗网中是否有任何新威胁或组织正在彰显存在？\n\
  \n从暗网收集的数据可以帮助 CTI 团队做出安全决策，以保护组织免受已知和未知威胁。然而，有一些表层网站提供从暗网获得的新闻。其中之一是 Darkreading.com。\n\
  \nDarkreading.com (https://bit.ly/3omPMuh) 是一个安全新闻的在线社区。网站提供有关威胁、漏洞和行业趋势的最新新闻。它还允许信息安全环境讨论并建议针对这些威胁的可靠防御措施。Darkreading.com\
  \ 爬取暗网和标准互联网，以生产关于网络安全事务的最可靠报告和新闻之一。它涵盖了 14 个社区，解决企业安全挑战：Analytics, Attacks and\
  \ Breaches, Application Security, Careers and People, Cloud Security, Endpoint,\
  \ IoT, Mobile, Operations, Perimeter, Physical Security, Risk, Threat Intelligence,\
  \ and Vulnerabilities and Threats。DarkReading.com 提供重要信息（CVEs、攻击、威胁、IoCs 等），CTI\
  \ 分析师可以用它们来构建情报。\n\nBleepingComputer.com (https://www.bleepingcomputer.com/) 是一个流行的安全和技术新闻来源，通过其庞大的论坛提供最新的文章、报告和有关威胁及其他计算机主题的新闻。另一个用于威胁情报推送的重要新闻门户是\
  \ Hacker News (https://news.ycombinator.com/)。作为 CTI 分析师，您必须了解用于威胁数据推送的重要新闻门户。\n\
  \n## 搜索引擎和社交媒体\n\n搜索引擎包含可供 CTI 分析师和公众使用的信息数据库。互联网用户会使用标准搜索引擎（如 Google、Bing 和 Safari）进行简单搜索，但进行安全信息搜索和检索时可能需要特定的搜索引擎。对手使用搜索引擎来规划和构建攻击画像（侦察、漏洞搜索、零日漏洞利用、连接到互联网的设备、系统归档等）。有多个安全搜索引擎，识别它们是\
  \ CTI 团队或分析师的责任。用于威胁情报数据收集的最广泛使用的引擎包括以下内容：\n\n- **Shodan**: Shodan (https://www.shodan.io/)\
  \ 是用于互联网连接设备的搜索引擎。CTI 团队可以使用 Shodan 数据监控和跟踪组织暴露的设备（网络元素或端点）。通过使用 Shodan 数据，分析师可以识别对手可能利用的漏洞和开放端口。它提供\
  \ API 将数据集成到 SIEM 或 TIP 中，以便与其他数据关联以获得可靠的情报。\n- **ZoomEye**: 连接设备的数量仍在不断增加。ZoomEye\
  \ (https://www.zoomeye.org/) 是一个检索互联网连接设备并对其开放端口和服务进行指纹识别的搜索引擎。CTI 团队可以使用 ZoomEye-python\
  \ API 通过各种查询收集数据。API 文档可在官方网站上获得。\n- **Censys**: Censys (https://search.censys.io/)\
  \ 不仅仅是一个搜索引擎。然而，作为搜索引擎，它有助于监控和发现设备、域和站点配置。它报告开放端口、易受攻击的协议、服务、SSL 证书等。CTI 分析师可以使用\
  \ Censys 数据监控组织的攻击面。\n- **Hunter**: 在侦察和攻击规划期间，对手会收集可能用于 spearphishing 的信息，例如电子邮件地址。Hunter\
  \ (https://hunter.io/) 是专业人士用来收集企业电子邮件地址的搜索引擎。只需输入公司名称，系统就会返回与该公司关联的已验证电子邮件。Hunter\
  \ 提供 API，分析师可以用它来分析与组织相关的公开信息。\n- **GreyNoise**: GreyNoise (https://greynoise.io/)\
  \ 是一个互联网扫描查找引擎。它提供所有扫描互联网的设备（IP地址）的数据。通过使用 GreyNoise 数据（通过其 API），CTI 团队可以识别针对组织的有害和恶意扫描并创建警报。GreyNoise\
  \ 数据可以与 TIP、SIEM 或 **Security Operation Center (SOC)** 集成。您需要注册并获取 API 密钥。\n\n这里展示了一个简单的搜索。首先，它返回所有扫描端口\
  \ 554 的互联网设备及其标签（恶意或未知）。然后，它返回搜索与匹配 TLS/SSI 指纹的互联网设备：\n\n```\nraw_data.scan.port:554\n\
  raw_data.ja3.fingerprint:795bc7ce13f60d61e9ac03611dd36d90\n```\n\n> **重要提示**\n>\
  \ Greynoise 可以使用社区 API 轻松与 MISP 集成。\n> 因此，对于 1 级组织而言，这可以是一个很好的起点。\n\n- **WiGLE:**\
  \ WiGLE (https://wigle.net/index) 可用于探索和绘制周围无线网络的地图。它通过使用无线网络信号强度和指定的地址（或智能手机的位置）来实现。它允许安全分析师精确定位位置（建筑物、公寓、房间）并查看附近网络的信息。WiGLE\
  \ 提供各种安全机制（开放、WPA、WEP、WPA2 和 WPA3）来突出所有扫描无线网络的漏洞水平。安全或 CTI 分析师可以使用 WiGLE 信息来定位和评估组织的\
  \ Wi-Fi。他们还可以用它来评估特定区域是否由同一供应商提供 Wi-Fi 服务。CTI 分析师的另一个有价值的功能是分析 Wi-Fi 是否曾被任何人使用 WiGLE\
  \ 发现或标记过——这可能是侦察的迹象。WiGLE 提供 Python API，可用于访问和从其数据库收集数据。\n- **Pipl:** 虽然主要由黑客和渗透测试人员用于\
  \ spearphishing 目标，但 Pipl (https://pipl.com/) 允许 CTI 分析师评估个人公开暴露的个人信息数量。该网站被安全代理、政府机构和许多其他组织用于搜索有关个人的信息。Pipl\
  \ 爬取大多数公共来源和深网以收集信息。CTI 团队或分析师可以使用 Pipl API 收集数据并将其集成到组织的 安全工具中。虽然它是商业产品，但其价格对中小企业和个人来说相当实惠。\n\
  - **Google Hacking:** Google hacking 或 Google dorking 是安全研究人员用来查找代码和配置中的公开信息和漏洞的搜索引擎。它是\
  \ OSINT 的良好来源，也集成到安全数据库中，例如 exploit-DB。搜索引擎依赖高级操作符来细化搜索。CTI 分析师需要了解如何将 Google dork\
  \ 查询集成到内部安全系统中，以评估组织暴露的资源（文档、代码、配置、设备、摄像头等）。\n\nCTI 团队可以使用许多开源或低成本搜索引擎来丰富 TIP 或\
  \ SIEM 系统。这里提到的网站列表并不详尽。因此，CTI 分析师的责任还包括识别可能对实现 CTI 目标有价值的搜索引擎。\n\n\n\n如今，社交媒体提供的远不止连接人们的信息。借助\
  \ API，开发人员和安全分析师可以访问诸如 *Twitter 和 TweetDeck* (https://tweetdeck.twitter.com/)、*Facebook*、*LinkedIn*\
  \ 和 *YouTube* 等社交网络，以执行 *搜索*、*检索分析* 和 *收集归档和文档*。这些功能有助于收集社交媒体情报数据——跟踪安全研究人员、媒体和机构，以了解漏洞利用、恶意软件样本和漏洞新闻。我们可以检索有关威胁、漏洞、漏洞利用、恶意软件、泄露等热门安全主题。在下面的小节中，我们将介绍一些\
  \ OSINT 或低成本的恶意软件数据收集站点。\n\n## 公开可访问的恶意软件门户\n\n大多数数据泄露报告和调查显示，高比例的网络攻击直接或间接涉及恶意软件。因此，CTI\
  \ 团队或分析师需要收集与恶意软件相关的情报数据。许多网站或门户公开提供恶意软件分析功能。我们不会全部列出，但将提供一些可免费用于恶意软件分析和数据收集的恶意软件网站和链接：\n\
  \n- **VirusTotal**：VirusTotal (https://www.virustotal.com/gui/) 是一个免费的在线恶意软件分析平台，允许安全专业人员提交恶意软件文件并获取分析结果。分析结果会与请求者和\
  \ VirusTotal 的合作组织共享。通过 VirusTotal API（公开版或高级版），CTI 团队可以用遥测数据丰富内部安全工具，以促进警报报告并将数据与\
  \ TIP 和 SIEM 集成。\n- **VirusShare**：VirusShare (https://virusshare.com/about) 是一个恶意软件样本存储库，为组织和个人提供访问恶意代码样本的途径。VirusShare\
  \ 免费，但访问需受邀请。因此，组织或个人需要申请加入名单以获取数据访问权限。然而，它提供商业 API 用于数据馈送和数据的专业化搜索。\n- **Any.run\
  \ 社区**：Any.run (https://any.run/) 是一个恶意软件分析和沙箱平台，允许信息安全分析师访问实时的恶意软件数据处理、分析和 IoC\
  \ 数据。它还可以用于丰富 TIP 和 SIEM。您可以注册该工具的社区版并下载恶意软件数据样本。\n- **Intezer 社区版**：Intezer (https://www.intezer.com/)\
  \ 是一个恶意软件分析、威胁狩猎和事件响应平台，允许分析师对恶意软件文件进行分类和逆向工程。Intezer 支持多种数据格式，包括 STIX。因此，它可以集成到现代\
  \ TIP 和 SIEM 中。\n\n许多恶意软件网站提供免费分析和数据访问。CTI 团队或分析师必须搜索这些网站并了解它们如何使项目受益。\n\n在本节中，我们查看了一些公开可用的开源和低成本数据源。OSINT\
  \ 是一个广泛的研究和应用领域。因此，它需要透彻的理解和选择。大多数来源提供连接和收集数据（API 或数据库下载）的机制。在下一节中，我们将介绍开源情报资源的基本结构。\n\
  \n## OSINT 平台数据洞察（OSINT 框架）\n\n收集 OSINT 数据可能具有挑战性（从哪里获取数据、如何收集以及在数据中寻找什么）。它需要对底层数据源有良好的了解。前一节中列出的\
  \ *开源情报门户* 来源，非常适合您开始收集数据时使用。作为 OSINT 框架 (https://osintframework.com/) 的一部分，可以收集更多信息。该框架总结了可用于收集和汇总安全信息的资源和工具。\n\
  \n![](img/d47f26598025b2da017dd41fcbb6e602_231_0.png)\n\n图 7.1 – OSINT 框架工具和资源\n\
  \n您可以浏览每个 OSINT 类别并访问工具或资源以深入了解它们。标记为 R 的工具和资源需要注册，而标记为 T 的工具需要本地安装。尽管该工具仍在更新和改进中，但可用于创建\
  \ OSINT 数据源列表。如果我们点击 Exploits & Advisories > MITRE ATT&CK，网站将重定向到 MITRE 官方网站以获取更多详细信息。在下面的小节中，我们将讨论\
  \ OSINT 数据的可能局限性。\n\n## OSINT 局限性和缺点\n\nOSINT 来源提供大量数据——数据可能是结构化或非结构化、受控或不受控（就开销而言）。使用\
  \ OSINT 时面临的一些挑战包括以下内容：\n\n- **要求数据清洗：** 大多数 OSINT 数据或馈送是原始的，初始状态下无法直接使用。需要对其进行许多后处理操作，才能将其转换为可消费的格式（可查询、关联或与其他工具集成）。\n\
  - **来源验证：** 在处理威胁情报数据和馈送时，来源验证和评估至关重要。OSINT 的庞大性质使其难以评估，尤其是在手动情况下。想象一下尝试验证 10 个数据源。这是可以的，但可能需要时间和资源。如何验证来自进行企业或政府间谍活动的来源的\
  \ OSINT？这将 OSINT 与数据准确性问题联系起来。\n- **信息过滤：** 在噪声很大的数据中查找所需信息是一个挑战。因此，有可能获得误导性信息，导致大量误报警报。\n\
  \n可以调用两个组件来解决 OSINT 的一些局限性：*数据收集自动化* 和 *领域专业知识*。数据收集自动化降低了人为错误的概率并提高了数据收集周期的速度。通过在收集过程中具备专业知识，CTI\
  \ 团队可以找到将噪声与数据洞察以及产生的误报分离的最佳方法。因此，建议尽可能自动化收集过程。\n\nOSINT 是情报项目启动的良好来源。因此，1 级和 2\
  \ 级组织可以利用它来开始构建情报。然而，必须理解目标和 CTI 要求必须是 OSINT 数据收集过程的驱动因素。当选择合适的来源时，它们可以与内部数据相关联以提供可靠的情报。在下一节中，我们将介绍恶意软件数据及其在威胁情报中的用途。\n\
  \n## 恶意软件数据用于威胁情报\n\n恶意软件是网络安全中最常用的词汇之一。它的出现给组织带来动荡和折磨，给攻击者带来欢愉。其概念复杂难以理解，因为它需要不同的一套技能和专业知识（架构、分析和设计）。然而，作为\
  \ CTI 分析师，了解恶意软件数据及其收集必须成为第二天性。在本节中，我们将介绍用于情报的输入 TIP 或 SIEM 的恶意软件数据。\n\nVirusTotal、VirusShare\
  \ 以及其他恶意软件沙箱等站点（或来源）由恶意软件分析引擎驱动，使其能够分析已上传文件的行为或链接，以将其分类为恶意或非恶意。尽管开源沙箱可以帮助 CTI 团队和分析师自动执行恶意软件分析，但了解恶意软件数据的基本信息至关重要。\n\
  \n> **重要说明**\n> 恶意软件分析是一个独立的主题，不属于本书范围。我们仅提供了有关恶意软件的基本信息以及 CTI 分析师可以从恶意软件数据中提取的基本指标。\n\
  \n现代恶意软件设计技术可以绕过安全系统并避免检测。需要高级分析才能可靠地检测恶意软件威胁。CTI 团队或分析师旨在从数据中提取 IOC 并通过连接恶意软件相关数据源将其输入\
  \ TIP 或 SIEM。然后他们可以将这些数据与内部数据相关联，以创建未来威胁检测的警报。\n\n## 恶意软件数据收集的好处\n\n使用恶意软件数据进行威胁情报的关键好处包括以下内容：\n\
  \n- **恶意软件检测**：识别需要阻止的恶意软件 IOC。CTI 可以实施通知服务以报告可能的恶意软件威胁检测。\n- **威胁优先级排序**：CTI 团队可以在恶意软件检测上创建高优先级警报，其中恶意软件威胁的优先级高于其他\
  \ IOC 警报。自动化威胁优先级排序使分诊任务更简单。\n\n\n\n-   **威胁狩猎**：恶意软件数据 IOC 和工件可被威胁猎人用于在整个网络中识别相同的恶意操作。例如，如果恶意软件以某种方式修改目录文件，威胁猎人可以使用相同的行为来检查网络中类似的修改。\n\
  -   **未来研究的参考**：安全研究人员可以利用恶意软件数据来了解对手（或组织）使用的模式、技术、科技、代码和基础设施。它有助于预测对手设计的变更。\n\n\
  恶意软件数据在实施 TI 项目时至关重要。它为组织提供了做出有关恶意软件相关威胁的明智决策所需的手段。数据需要与系统流量相关联。\n\n## 恶意软件组件\n\n\
  恶意软件旨在在受害者系统中执行特定任务。虽然恶意软件可以执行许多功能，但最可能包括窃取信息、破坏系统和修改系统。CTI 分析师需要了解恶意软件的不同组件，这些组件定义了其目的。它们在以下图表中进行了说明：\n\
  \n![](img/d47f26598025b2da017dd41fcbb6e602_234_0.png)\n\nFigure 7.2 – 恶意软件组件\n\n\
  每个设计良好的恶意软件都将包含以下内容：\n\n-   **Payload**: 有效载荷是恶意软件的核心部分，执行预期的恶意活动。它使用编程语言编写，被指示执行一个或多个任务。有效载荷可以被编程以隐藏其存在。\n\
  -   **Obfuscator**: 它掩盖有效载荷，使其无法被防病毒软件和其他安全设备和软件检测到。混淆是通过使用包装器、保护器和编码器来修改有效载荷的外观来实现的。恶意软件分析师的任务之一是对混淆器进行*reverse\
  \ engineer*以访问有效载荷的代码。优秀的恶意软件设计者确保混淆器坚固且不可逆。压缩和加密是用于混淆恶意软件的两种方法。\n-   **Stealth\
  \ component**: 恶意软件会通过使用合法进程和端口、更改其属性或使用 rootkit 来隐藏自己。使用带有伪造扩展名的特洛伊木马，例如 `new_mercedes.jpg.bat`，或使用\
  \ `WriteProcessMemory()` API 劫持合法进程，是恶意软件逃避防御系统的示例，因此需要有效地监控系统进程并突出显示进程行为的变化。\n\
  -   **Armoring**: 攻击者设计恶意软件使其能够检测可能威胁它们的工具。它们倾向于在监控工具、虚拟环境和故障排除工具等工具存在时改变行为。复杂的恶意软件可以解除某些工具的武装以保护自己或修改其执行逻辑。Wireshark、VMWare、VirtualBox\
  \ 和调试工具是恶意软件可以防御的工具示例。因此，恶意软件分析师需要在不同情况和环境下考虑恶意软件的行为。\n-   **Persistence**: 除非设计者另有说明，否则恶意软件很可能会驻留在受害者系统中，使攻击者能够在必要时访问受害者系统——即使在系统重新启动后也是如此。在大多数操作系统中，攻击者依赖注册表、服务、持久程序和内存来使恶意软件持久化。例如，存储在\
  \ `C:\\...\\Programs\\Startup`（Windows）或 `/etc/systemd`（Unix）中的任何恶意软件都可能在每次重新启动时随操作系统一起启动。\n\
  -   **Propagation**: 恶意软件会找到在受害者系统内部传播的方法。根据其类型（病毒、特洛伊木马、蠕虫、僵尸网络等），其传播可以是自动的（独立）或由外部触发器启动。例如，蠕虫可以在没有外部干预的情况下复制和传播。在评估恶意软件行为时，了解传播模式至关重要。\n\
  -   **Command and control**: C&C 或 C2 是*the way*植入的恶意软件与外部世界通信的方式，从攻击者接收命令以在受害者上执行更多操作。C2\
  \ 依赖 IP 地址和域名与外部世界通信。IP 和域名可以嵌入有效载荷中，也可以使用现代算法动态生成以避免被阻止。\n\n每个组件在恶意软件需要完成的恶意任务中承担特定角色。这些组件也是理解恶意软件行为的基本要素。对于计划建立内部恶意软件分析实验室的组织来说，了解这些细节对于理解恶意软件本身至关重要。\n\
  \n## 恶意软件数据核心参数\n\n恶意软件分析的结果，无论是在本地进行还是使用从恶意软件来源收集的数据，都是一组*indicators*，有助于对抗和保护系统免受恶意软件攻击。这些指标是从恶意软件组件中提取的，有助于按功能和家族对恶意软件进行分组。以下图表显示了各种恶意软件数据指标：\n\
  \n![](img/d47f26598025b2da017dd41fcbb6e602_236_0.png)\n\nFigure 7.3 – 恶意软件数据主要指标\n\
  \n安全厂商正在采用先进技术来检测、隔离和清除恶意软件。*signature-based*方法由于攻击者使用的复杂混淆技术而变得越来越低效。但结合*behavior-based*分析（现代由\
  \ AI 驱动），厂商正在开发检测恶意软件的复杂方法。以下几点深入探讨了有助于 CTI 挖掘数据的恶意软件参数：\n\n-   **Hashes:** 恶意软件使用许多加密哈希值进行识别并作为保护机制（例如通过修改哈希值来规避安全）。攻击者使用\
  \ MD5 和 SHA 家族（SHA1、SHA256、SHA224）等哈希算法来保护有效载荷。CTI 分析师必须提取恶意软件中使用的所有哈希值。\n-   **File\
  \ size:** 文件大小是另一个需要关注的参数。恶意软件代码（或内容）决定了文件的大小。\n-   **Extension**: 恶意软件文件带有扩展名，这也决定了它们可以在哪个环境中运行。Windows\
  \ 恶意软件可以根据设计者拥有 `.exe` 或 `.bat` 扩展名，或 Unix 环境的 `.sh`。然而，重要的是要知道恶意软件扩展名可以被混淆（例如*fileless\
  \ malware*，完全在内存中运行）或伪造（以模仿流行的无害文件）。然而，一些工具和方法可用于分析无文件（*memory monitoring*）和伪造的恶意软件。\n\
  -   **File and mime types**: 文件和 mime 类型分别决定扩展名和内容。这是正确识别文件类型的两种方式。攻击者可以伪造扩展名，但\
  \ mime 会显示正确的身份。`PE32 executable (GUI)` 和 `application/x-dosexec` 分别是文件和 mime 类型的示例。\n\
  -   **File identifier**: *TrID*，也称为文件标识符，使用二进制签名识别文件类型。TrID 也可用于恢复文件。TrID 工具也可独立用于调查和取证案例。\n\
  -   **ExifTool data**: Exchangeable Image File Format 是大多数文件（如图片）的标准。Exif 工具可用于操作图像、视频和文档文件（如\
  \ PDF）。ExIF 数据可以包含操作系统、恶意软件或文档中的代码语言、字符集等字段。\n-   **DNS info**: 如果运气好或技术足够，恶意软件数据可以报告远程或\
  \ C&C 服务器的域名信息。\n-   **IP addresses**: 这与 DNS 信息相同；IP地址可以从恶意软件数据中提取。\n\n根据数据，分析师可以提取必要的参数对恶意软件进行分类。\n\
  \nCTI 团队并不是集成恶意软件数据指标的唯一受益者。事件响应团队和安全运营分析师利用数据来发现恶意行为、创建警报并监控系统对恶意软件威胁的有效性。\n\n\
  恶意软件数据对于可靠的情报项目至关重要，并且有多个 OSINT 可用于收集恶意软件数据（其中一些已在上一节 *Open source intelligence\
  \ portals* 中提到）。在下一节中，我们将研究付费情报来源。\n\n\n\n## 其他非开源情报来源\n\n付费情报来源正变得越来越成为开展情报工作的首选方式——对于能够承担服务成本的组织而言。付费情报的概念可分为\
  \ *精选付费情报* 和 *原始付费情报* 来源。某些提供商通过处理和聚合来自多个开放且低成本来源的数据来利用 OSINT，从而提供精选且丰富的情报数据。这些数据随后被出售给组织（精选\
  \ PTI）。其他提供商利用行业先进技术、研究、专有领先功能和定制信息来提供扩展的情报服务（原始 PTI）。精选 PTI 服务相比原始 PTI 服务成本更低且可以负担得起。然而，原始\
  \ PTI 的价值主张可能是其与 OSINT 和精选 PTI 之间的关键差异。\n\n## 付费情报的优势\n\n逻辑上，任何安全分析师都会认为付费情报的质量更高、可靠性更强于开源情报。我们的目标并不是证实或否定这一假设，而是为\
  \ CTI 分析师和安全利益相关者提供必要的知识，以便就付费或开源情报来源做出明智的决策。我们可以结合特定威胁和 feed 评估指标来突出付费情报的一些优势，如下所示：\n\
  \n- **信息准确性**：准确性是评估情报 feed 的重要指标，无论是开源、私下共享（来自社区）还是付费。不准确的信息可能对组织的防御态势造成破坏——误导性信息和误报。PTI\
  \ 依赖专门的专家在向客户交付前分析 feed 的准确性。信息 *噪声* 会得到专业处理——在出现错误的情况下，存在一定程度的追责（商业、法律或运营，具体取决于协议）。\n\
  - **数据周期（时间）**：数据更新和上下文化的频率在评估 feed 时也很重要。开源情报来源主要依赖攻击案例的结果。首先，对入侵和威胁进行分析以识别关键的\
  \ IOC 和恶意组件，然后与公众或社区共享。这一过程有时会导致更长的延迟和检测周期——等到攻击被彻底分析时，可能已有多个组织成为受害者，或对手已更改 TTP。PTI\
  \ 依赖持续的专家分析，通过不断以前瞻性视角更新来源，为客户提供预防策略。\n- **处理与集成**：付费 TI 提供先进的集成和中介层，将信息导入其他安全平台。它们支持大多数行业情报标准和技术。这一特性优化了\
  \ CTI 团队将数据以用户友好格式获取所需的时间。\n- **需求对齐**：情报必须可操作。因此，数据源必须与需求保持一致。付费 TIP 厂商倾向于与 CTI\
  \ 团队和安全利益相关者坐下来讨论需求，并确保 feed 或提供的 TI 数据与组织目标保持一致。数据相关性至关重要。\n- **信息保护**：虽然 OSINT\
  \ 公开暴露，但 PTI 保护其价值和独占性。由于 PTI 厂商倾向于掩盖其技术，攻击者不知道何时被检测到并被处理。这一点为 PTI 消费者提供了优势。\n-\
  \ **厂商额外服务**：某些 PTI 厂商如 IBM、Microsoft、Cisco、Spirent 等也是设备和产品厂商。建立在这些厂商技术之上的组织基础设施可以以更低或免费的成本受益于额外的安全服务。其他\
  \ PTI 厂商也在这些 feed 之上提供额外服务——例如垃圾邮件过滤库、恶意软件检测盒和钓鱼识别服务。\n- **广泛覆盖**：某些 PTI 包含 OSINT。这意味着\
  \ PTI 厂商可以访问开放和共享来源，并在发送给消费者之前对其进行处理（验证、清理和重新格式化）。这减轻了内部评估和分析开源 feed 的负担。\n- **客户支持**：除了关注威胁指标外，付费情报厂商还提供平台和门户以下载报告、提问、提交问题或获取有关威胁和数据泄露的最新消息。包装式服务支持可以成为组织的吸引力组成部分，因为它们促进了厂商与客户之间的互动。\n\
  \nPTI 提供了许多优势和一些独特的好处，可以帮助组织收集与情报需求相匹配的相关数据，以便拥有足够准确的信息来构建有效的网络防御体系。\n\n## 付费威胁情报挑战\n\
  \nPTI 提供了多项优势，但并非没有挑战。虽然它在数据质量方面有所提供，但 CTI 分析师或团队或安全利益相关者在选择 PTI 时必须考虑一些参数：\n\n\
  - **成本：** 原始 PTI 来源的成本可能超出中小型组织的承受范围。即使对于大型企业来说，确保成本不超过预算范围也很重要。根据月度订阅，feed 的费用范围可从\
  \ $1,500 到 $100k 不等，其中精选 PTI feed 是较便宜的选择。组织很容易发现自己为威胁数据 feed 支付超过 $1M。然而，这也取决于所需的\
  \ feed 数量。\n- **Feed 重叠：** CTI 团队可能需要一个以上的付费情报来源以有效满足安全需求并获得更广泛的覆盖。然而，组合多个来源可能会导致信息重叠。许多付费情报\
  \ feed 覆盖相同的范围，甚至使用相同的私有来源。团队必须识别威胁来源重叠的区域，以避免为同一事物重复付费。\n- **单个 feed 的上下文和范围：**\
  \ 是的，某些 PTI 来源整合了 OSINT 和其他私有数据，但一个来源可以由一个或多个 feed 组成。在大多数情况下，组织按 feed 而非按来源付费。而且可能需要更多\
  \ feed 来覆盖组织的安全目标。每个 feed 类别可以关注组织的不同的方面，因为不同的安全部门可能需要各种 feed。feed 数量越多，订阅费也越高。\n\
  \n不同厂商以不同的方式应对 PTI 挑战，CTI 团队必须在投资 PTI 之前评估每个挑战（了解其对 CTI 项目的影响）。\n\n## 一些付费情报门户\n\
  \n有许多来自顶级厂商的 PTI feed 可供 CTI 用于构建情报。我们在此不提供详尽的列表或给出最佳来源；相反，我们列举了一些可以帮助您朝着正确方向前进的\
  \ feed。我们也不关注厂商本身，而是情报 feed（即使 feed 或服务与厂商相关）。一些付费威胁情报 feed 包括 AT&T AlienVault、FireEye\
  \ CTI、CrowdStrike Intelligence Exchange、RecordedFuture、HackSurfer、Symantec DeepSight、ThreatConnect、IBM\
  \ X-Force、SecureWorks、Vipre、Kaspersky TI、Microsoft Graph Security、Cisco openVuln\
  \ API、WildFire、Anomali、PhishLabs、DeCYFIR、Flashpoint Collab 等等。\n\nGartner (https://gtnr.it/3fkEkMZ)\
  \ 提供了一份良好的 TI feed、产品和服务评测列表，分析师和利益相关者可将其用作厂商侦察的主要来源。大多数 TI feed 厂商提供 API 以促进与 SIEM\
  \ 和 TIP 的集成。他们还提供情报产品和服务（TIP、SIEM、SOC、网络监控等）。\n\n> **重要提示**\n> 选择 feed 也意味着信任厂商或提供商，这可能不是一项简单的任务。然而，在计划购买情报\
  \ feed 时，除了优势之外，您还应考虑厂商的声誉、其在该领域的经验、已解决的用例、参考资料、路线图和用户评价。作为 CTI 分析师或安全利益相关者，您应评估这六个要点。\n\
  \nCTI 团队需要在购买或订阅数据 feed 之前研究来源或厂商。CTI 的职责还包括了解厂商的安全概况并确保组织最大化利用解决方案。关于开源和付费来源，CTI\
  \ 分析师或团队需要知道如何结构化并存储原始和处理后的信息。在下一节中，我们将讨论情报数据的结构化和存储。\n\n## 情报数据结构化和存储\n\n本节假设您已选择相关的数据来源和\
  \ feed，并已通过 API 连接以获取数据。在这一点上，您希望高效可靠地组织和存储这些数据。数据结构化和存储分别与数据如何呈现和保存相关。良好的情报利用在很大程度上取决于数据如何被结构化和存储。\n\
  \n\n\n## CTI 数据结构化\n\n情报数据必须结构化，以便于操作。公开访问的数据任人宰割——包括攻击者。因此，只要有任何机会损害数据，他们就会动手。故此，在收集数据时，必须以值得信赖的方式安全地呈现数据。结构化还涉及处理情报数据的一些最佳实践。我们将介绍在结构化情报数据时必须考虑的三个要点：\n\
  \n- **维护数据的 CIA：** 确保在数据收集和处理的整个周期内保持 CIA 三要素。API 必须安全，因为源 feed 连接到组织的内部网络。任何 *保密性*\
  \ 方面的泄露都可能为攻击者提供窗口来入侵 API 并发动恶意攻击。CTI 团队必须确保收集或共享的情报在传输中或静止时未被 *篡改*。必须使用可靠的 API\
  \ 密钥以确保完整性得到维护。CTI 团队还必须确保数据的可用性。\n- **保持标准格式：** 确保收集的情报和数据（包括报告等）使用标准格式。这一特性使得熟悉标准格式的每个人都易于使用数据。团队和数据必须使用同一种语言。\n\
  - **共享数据：** 你可能希望与 infosec 社区共享你的 CTI 报告（结果）或处理后的数据。确保可共享的情报得到保护，并且可以被内部和外部使用者轻松访问（在与外部用户共享信息时始终考虑访问级别安全）。\n\
  \n当数据结构正确时，存储和共享变得容易。CTI 团队必须努力以适应目标受众的语言呈现情报（*战术性和技术性，或操作性*）。情报数据包含有价值的信息，但需要结构化并适当存储才能让你从中受益。在下一节中，我们将介绍情报如何存储。\n\
  \n## CTI 数据存储要求\n\n收集的数据和情报必须存储在组织的环境中，以便在需要时访问。情报面向所有人；因此，任何安全职能都应能快速使用数据或信息。存储情报数据时，需要考虑三个指标：\n\
  \n- **可访问性**：安全人员、CTI 分析师和相关利益相关者必须能够随时访问数据或信息。事件响应团队可以使用数据来检测、分析和补救网络攻击。安全运营团队可以访问数据以执行系统监控。CTI\
  \ 团队仍可访问数据进行评估并做出明智决策。\n- **可用性**：收集的数据必须存储以便在需要时可用。组织必须确保存储基础设施（硬件和软件）得到妥善维护，并且所有应用程序运行良好且为最新版本。在最坏情况下，存储基础设施必须及时恢复以避免数据丢失。\n\
  - **检索速度**：情报数据和信息量可能很高。它属于大数据范畴。因此，存储基础设施必须设计为能够快速查询。扫描数十亿条指标记录会很烦人，如果后端设计不正确。\n\
  \n这些存储要求对于在组织内部和外部重现和消费情报至关重要。在选择 feed 时，CTI 团队必须评估存储数据的复杂性。\n\n## 情报数据存储策略\n\n\
  公司以两种不同的方式存储情报数据和信息：*组织特定存储基础设施* 和 *威胁情报平台*。大型公司可以结合这两种方法以确保数据 *复制* 和 *归档*。（这是保持高可用性的最佳方法之一。在发生故障时，一个系统可作为另一个系统的备份。）\n\
  \n## 组织特定存储基础设施\n\n组织可以构建自己的存储基础设施或使用云提供商托管数据。从 feed 收集的数据会被解析并内部存储在关系型或非关系型数据库中。然而，在构建基础设施时，需求（指标）必须匹配。大多数组织使用的存储基础设施方法包括以下内容：\n\
  \n- **关系型数据库**：关系型数据库可用于存储情报数据。然而，像原生 SQL 这样的关系系统在大规模数据查询中可能成为瓶颈，因此需要利用非关系存储和大数据。\n\
  - **非关系型数据库**：组织可以使用非关系型数据库存储数据。文档型和图型是组织可用于存储数据的两种非关系型数据库示例。\n- **大数据平台**：组织可以利用\
  \ Hadoop 和 Spark 等大数据平台部署稳健的情报存储，并通过使用 Python、SQL 和 Java 等常见流行语言促进数据访问和查询。\n\n组织不得忽视从零构建数据存储基础设施或采用云解决方案进行威胁情报存储的挑战。其中一些挑战如下：\n\
  \n- **基础设施维护**：尽管这不适用于公共云解决方案，但维护内部数据库需要成本。获取云处理服务（数据库、**提取转换加载 – ETL** 服务、解析器等）也不是免费的。\n\
  - **投入与效率**：组织可能需要获取构建用于解析、关联和聚合来自不同来源和 feed 的数据的弹性中介层的技能。中介层必须经过优化以支持快速处理和流式处理能力。\n\
  - **数据格式**：情报输出必须遵循特定标准（如 STIX/TAXII、CSV 和 JSON）进行存储，以便与 infosec 社区共享。因此，系统必须允许将使用的任何内部格式转换为标准格式。\n\
  \n构建内部存储基础设施的优势可能与成本保护有关。基于 Hadoop 和 Spark 等开源应用程序构建大数据平台的成本可能低于购买昂贵的 TIP。就效率和投入而言，内部数据存储系统可能不适合中小企业。\n\
  \n## 用于存储数据的威胁情报平台\n\n可能最受欢迎的选择（尤其是对于 1 级和部分 2 级组织），TIP 可用作情报存储基础设施。这是有道理的，因为 TIP\
  \ 是按照 CTI 标准构建的（例如，它们自动支持 STIX/TAXII 和 YARA 格式）并且可直接使用。它们还促进了与 infosec 社区其他成员的信息共享。大多数付费\
  \ TIP 很可能提供存储机制。然而，像 MISP 和协作威胁研究（CRITs）这样的开源 TIP 也提供存储功能。\n\n> **重要提示**\n> 对于刚接触\
  \ CTI（1 级）的组织，我建议在投入创建内部基础设施或昂贵的 TIP 之前，通过利用 MISP 等开源 TIP 来节省预算。MISP 被广泛使用，因为它提供多种功能并且得到妥善维护。MISP\
  \ 在本书中用于实际用例。\n\nCTI 团队和相关利益相关者必须选择正确的情报数据存储策略。在选择一个或两个存储基础设施时，你必须考虑需求以及情报将如何共享——CTI\
  \ 是一个因社区共同目标而不断增长的领域：打击网络犯罪。\n\n威胁情报数据 feed 在原始状态下是被动的。CTI 团队或分析师必须通过将其集成到现有安全系统、TIP\
  \ 或安全信息和事件管理（SIEM）中使其活跃。通过这样做，TIP 或 SIEM 可以执行其主要任务之一——将外部数据 feed 与内部系统数据关联，以提供更多关于威胁的见解。\n\
  \n\n\n## Summary\n\n收集 CTI 项目的正确数据是衡量项目成败的最重要指标之一。CTI 团队必须评估所有选定的来源并确保它们符合规划阶段设定的要求。无论您选择\
  \ OSINT 还是 PTI，都必须考虑一些参数（预算、准确性、数据更新频率、数据相关性、可用资源和业务需求），如本章所述。某些参数在组织或 CTI 团队选择数据源时可能可以协商，但其他参数可能不可协商，具体取决于目标和要求。适当的解决方案取决于组织的需求、要求和资源。然而，对于中小型组织而言，OSINT\
  \ 足以构建情报。您应了解如何选择正确的来源、从何处获取数据、如何存储数据，以及将数据与其他安全平台集成的先决条件。在下一章中，我们将从组织的角度审视情报，以便有效防御威胁并保护数据。\n\
  \n## 8 Effective Defense Tactics and Data Protection\n\n## Effective Defense Tactics\
  \ and Data Protection\n\n组织安全基础设施由多个不同的层组成。虽然 **威胁情报 (TI)** 专注于基于数据的知情循环安全防御和保护，并提供一种高效的方式来领先于网络威胁，但组织的第一道防线取决于安全如何整体融入业务运营。组织必须确保在任何时候（开发、集成、资源管理、通信等）都以任何代价维护安全最佳实践和政策。它必须结合人员、流程和技术，以确保关键数据在其整个生命周期内得到保护。数据和资源的\
  \ **保密性、完整性与可用性 (CIA)** 必须得到保留，并在 **传输中** 或 **静止** 时经常进行评估。\n\n本章重点介绍为组织安全构建有效的防御屏障——TI\
  \ 的一个重要部分是防止和遏制攻击。它提供了实现可靠数据保护的最佳实践。\n\n在本章结束时，您应该能够做到以下几点：\n- 了解与网络威胁防御系统相关的常见主要挑战和陷阱，并将项目与正确的防御策略相匹配\n\
  - 了解主动分析以保护组织免受威胁\n- 了解风险和漏洞评估的重要性\n- 了解如何在 TI 项目中纳入加密、标记化和其他数据保护机制\n- 了解移动终端对 TI\
  \ 格局的影响\n\n在本章中，我们将涵盖以下主要主题：\n- 强制执行 CIA 三要素 – 概述\n- 威胁防御机制的挑战和陷阱\n- 数据监控和主动分析\n\
  - 漏洞评估和数据风险分析\n- 加密、标记化、屏蔽和隔离\n- 终端管理\n\n### Technical requirements\n\n对于本章，未突出显示任何特殊技术要求。大多数用例如有必要将使用\
  \ Web 应用程序。\n\n### Enforcing the CIA triad – overview\n\n在保护关键数据（和资产）时，组织必须防范系统内部（故意和非故意）和外部（恶意和非恶意攻击者以及自然灾害）攻击的安全措施。数据安全的主要目标是确保\
  \ CIA 不受损害并且得到充分管理。在以下要点中，我们将查看一些数据安全用例以实现更好的系统保护。\n\n### Enforcing and maintaining\
  \ confidentiality\n\n数据保密性必须始终在关键资产上保持 **静止**（存储在 **终端**、**数据库服务器** 和 **备份设备** 上的资产或数据）或\
  \ **传输中**（在系统内部或系统外部的两个点之间移动）。此外，作为安全或 **网络威胁情报 (CTI)** 团队的一部分，您必须确保以下内容到位并强制执行：\n\
  - **访问限制：** 只有合适的人员或应用程序需要访问组织的数据或资产。确保凭据不会在员工、组或应用程序之间重复使用和共享——例如，确保 **人力资源 (HR)**\
  \ 员工不得直接访问员工的财务数据，财务人员无法访问技术运营数据，等等。\n- **隐私：** 通过给予人员适当的访问权限来保护数据隐私。必须充分实施、遵循和执行访问管理策略——例如，员工可能有权访问\
  \ HR 门户查看其个人资料，但不能访问其他人的数据。然而，HR 经理可以访问所有人员的数据。\n- **数据查看限制：** 必须将资产（和数据）的访问和操作限制在受信任的网络（通过诸如\
  \ **虚拟专用网络 (VPNs)** 和代理等服务）和授权设备——例如，**信息技术 (IT)** 经理只能通过公司 VPN 使用组织提供的终端访问组织的资源。同样，可以阻止通过个人终端设备访问以保护保密性。\n\
  \n提供的可能不仅仅是前三个要点。因此，组织必须制定坚实的政策来保护资产和数据保密性。当今大多数企业使用两个重要概念来有效管理系统保密性：*最小权限* 概念——仅授予必要的资产或资源访问权限，以及\
  \ *默认无权限* 概念——根据需要逐步分配访问权限。\n\n### Enforcing and maintaining integrity\n\n系统数据必须准确。用户必须能够信任他们交互的数据、软件或应用程序。系统必须设计为捕获并记录对数据或关键资产的任何修改。作为安全或\
  \ CTI 团队的一部分，您应确保以下内容到位并强制执行：\n- **角色的明确定义：** 用户的角色必须明确定义——尤其是可以修改资产的人员。这可以通过创建\
  \ *功能用户组* 来实现。例如，某些员工可能在开发团队中拥有写入、更新和执行的权限，而其他人可能只有读取和执行权限但没有更新权限。组织必须制定强调角色的政策。\n\
  - **篡改数据识别：** 定义角色是 **完整性保证** 的第一步，但并不止于此。系统必须设计为记录或检测关键资产（数据）的任何更改，从静态资源到动态资源，例如\
  \ **流量**。使用监控工具（图形或命令行）通过突出显示不同的指标来增强对修改流量的识别，例如数据来源（**互联网协议 (IP)**、**域名系统 (DNS)**、用户名等）、流量目的地（数据库服务器、防火墙或其他用户等）、涉及的协议和应用程序等等。\n\
  - **修改警报：** **数据篡改** 不应仅被记录和监控，而应转换为在仪表板上显示的警报并通过电子邮件或 **短消息服务 (SMS)** 发送给相关方。在设计良好的基础设施中，这些警报根据访问的数据进行分类（分配优先级）——数据或资产越关键，重要性越高。\n\
  \n数据完整性管理可能具有挑战性，尤其是在涉及第三方访问（承包商、分包商、顾问等）时。您必须强制执行处理第三方角色等情况的完整性策略。另一个挑战是由于凭据被盗而识别资产篡改。让我们看以下示例：\n\
  \n**用例：** 数据保密性和完整性泄露分析\n\n**场景 1：** 公司数据分析师 James 访问客户交易数据并下载其中一部分以构建推荐系统模型，从而改善产品和服务销售。\n\
  \n**场景 2：** 一名不满的员工 John 窃取 James 的凭据，伪造其 IP 地址，访问客户交易数据，并为恶意目的下载个人信息。\n\n\n\n**场景\
  \ 3：** 莫莉是詹姆斯的朋友，她属于关键数据访问的受信任组，出现了凭证问题。她请求詹姆斯分享他的凭证以避免项目延期。她使用詹姆斯的凭证访问并下载数据。\n\n\
  **系统行为：** 访问已记录，流量已捕获，警报以 `james_analyst` 创建，优先级为低，因为 `james_analyst` 是受信任用户。\n\n\
  在两种场景中，系统行为相同，将访问关联到詹姆斯作为用户，无法检测到潜在的违规行为。可能需要额外的安全层来应对此类挑战（使用 **多因素身份验证 (MFA)**、访问令牌、验证码等）。\n\
  \n我们可以看到保密性和完整性之间存在一定程度的重叠，因为角色和组定义了访问限制。\n\n## 强制执行和维护可用性\n\n系统必须设计成数据在 *需要* 时\
  \ *可访问* 且在合理 *时间范围* 内可用。检测可用性违规比保密性和完整性更容易——网络关闭、系统响应缓慢以及无响应不需要魔法就能识别。然而，它是 CIA\
  \ 组件之一，可能受到多种因素的影响，例如自然灾害。这意味着在为可用性设计系统时又多了一件需要担心的事情（地震、火灾、雨水和风暴，可能对资产和数据造成损害）。可用性是三个参数的函数，*可访问性*、*存在*\
  \ 和 *时间*。因此，作为安全或 CTI 团队的一部分，您应强调以下几点：\n\n- **保留期限：** 数据应保留多久？系统必须设计为考虑 *短期*、*中期*\
  \ 和 *长期* 可用性需求。以下两点在很大程度上取决于可用性需求。长期可能为 5 至 10 年，中期可能为 1 至 5 年，短期可能长达 1 年。保留组件不是标准化的，取决于业务目标。\n\
  - **响应时间：** 数据必须在适当的时限内可用，具体取决于可用性需求。对于短期访问，您可能需要一个 **延迟敏感系统**（*更短的响应时间*），因为数据或资产可能用于即时的业务决策。然而，对于历史数据，轻微延迟是可以理解的，对于归档数据，更长的延迟可能是可以容忍的。延迟容忍度对数据可用性至关重要。\n\
  - **位置和备份**：数据和资产必须存储以便在需要时可访问并存在。*在哪里* 和 *如何* 存储它们对于确保安全性和可用性至关重要。例如，将数据远离用户可能会在受限带宽系统中导致更多延迟；因此系统设计人员必须考虑数据和资产的位置，并确保提供完整保护。另一个重要的可用性要素是\
  \ *备份*。数据必须备份以防止丢失，并且恢复过程必须可靠。\n\n关键数据（资产）和整个系统必须从开发周期的开始就得到充分保护，因为数据泄露可能对组织造成毁灭性打击。财务上，它们会影响您的利润，因为您可能需要恢复数据、加强安全并支付法律罚款费用，更不用说其他后果。因此，安全必须成为业务流程的一部分，正如我们在\
  \ *第 11 章，可用安全：威胁情报作为流程的一部分* 中所述。\n\n组织在安全防御和数据保护方面面临许多挑战。我们将在下一节中探讨其中的一些挑战。\n\n\
  ## 威胁防御机制的挑战与陷阱\n\n构建可靠的 **防御系统** 是一项复杂任务，因为业务功能呈现出不同的安全需求。因此，战略团队在实施安全实践时需要考虑整个组织的安全需求和每个功能。然而，这并不容易，因为安全不应干扰业务运营——例如，在急诊室的患者登记设备上实施密码和\
  \ MFA 可能会延迟为需要立即护理的患者检索客户数据，同时设备仍需要受到保护以保护患者隐私。如果处理不当，此类挑战会促使组织做出不平衡的决策，从而在安全阶梯中引入陷阱。在下面的小节中，我们将了解组织战略团队面临的一些常见安全挑战。其中一些挑战已在前几章中介绍过。本章对此进行了更详细的介绍。\n\
  \n## 数据安全主要挑战\n\n数据保护并非没有挑战。这些挑战可能是全球性的或行业特定的，但在组织中都需要解决。最终，高层目标仍然是保护敏感数据（资产）免受未经授权的访问和可能的滥用。\n\
  \n现在，让我们来看看一些数据安全挑战。\n\n### 指数级数据增长\n\n生成的数据量正以快速的速度增长。企业从不同的数据源积累数据，包括机器、人类和组织本身。数据增长是大数据时代的主要触发因素之一。然而，每个数据源都有不同的安全需求。让我们看看在一些热门且最受针对的行业中的数据增长情况，如下所示：\n\
  \n- **金融行业：** 随着来自客户个人信息、信用信息、专业数据（薪资、支出）等来源的大量敏感数据，金融行业收集了大量数据。移动支付的引入增加了数据量，因为客户现在每小时或每天可以进行大量交易。金融公司处理数十亿笔交易和兆字节的数据。这些公司必须考虑对其系统中所有静止和移动数据的保护。\n\
  - **医疗保健：** 医学的进步使该行业收集各种患者数据（包括健康相关和支付数据）。这些数据由健康小工具、应用程序和医院机器（放射科、扫描仪等）等来源生成。健康数据需要与保险公司、政府和其他相关方共享。大规模医疗数据不断在传输中。\n\
  - **交通运输：** 我们看到交通摄像头以较低的粒度从车辆生成数十亿笔交易。车辆注册详情由传感器和 **全球定位系统 (GPS)** 记录捕获。数据与公共和私人来源相关联，以识别车辆所有者、犯罪记录和其他参数。你可以想象必须处理的数据量。\n\
  - **电信 (telecom)：** 随着智能设备、网络元素和客户活动，**电信行业** 产生爆炸性数据。这些数据用于各种目的，并与其他数据源相关联，例如客户个人数据和银行信息。\n\
  \n零售、制造和 **物联网 (IoT)** 等其他行业也处于同一境地。存储和移动如此庞大的数据令人不堪重负。您的组织现在可能只处理小数据，但随着业务增长，它很可能会增长。战略团队在设计\
  \ IT 系统时必须将安全放在心上。\n\n### 数据保护和隐私法规\n\n地方和国家当局正在围绕隐私保护建立坚实的文化。正在制定多项法规以确保人口保护，其中大多数在范围和重点上有所不同，甚至可能重叠。根据公司运营区域，战略团队必须了解所有地方、区域、国家甚至国际法规。\n\
  \n> **重要说明**\n> 一方面，法规合规失败可能导致组织因罚款而花费大量资金。但另一方面，法规合规成功甚至在数据泄露的情况下也能保护组织。\n\n战略团队必须确保组织遵守所有法规。除了法规之外，行业可能还需要标准来保证数据保护。对于小型企业来说，处理适用于其行业的全部法规和标准可能令人不堪重负，但这是需要考虑的挑战，以避免处罚。\n\
  \n在医疗保健中，例如，战略团队需要考虑医疗个人信息安全和支付卡安全法规——分别为 **健康保险流通与责任法案 (HIPAA)** 和 **支付卡行业数据安全标准\
  \ (PCI DSS)**。它必须实施详细说明并强制执行处理静态或传输中医疗数据的流程和程序的政策。因此，了解适用于业务领域的法规至关重要。\n\n### 数据处理和第三方组件\n\
  \n组织由多个需要和谐协同工作的业务功能组成。然而，整合这些功能并利用 **云计算** 等技术会增加业务运营的复杂性，并在堆栈中引入多个漏洞点。第三方软件和工具在业务\
  \ **开发运营 (DevOps)** 堆栈中广泛存在。由于组织对这些组件的控制较少（或没有），数据安全成为一个挑战。\n\n\n\n这样一个案例就是 **Equifax\
  \ 数据泄露事件** (https://bit.ly/34TD DnN)，其中第三方 **开源软件的 (OSS 的)** 漏洞 *Apache Struts*\
  \ 被用来策划 2017 年最重大的泄露事件之一。尽管该漏洞在数天前已被发现并公开，Equifax 仍未能修补 Web 服务器应用程序。如果没有妥善结构化，补丁管理可能会很复杂。为了确保在\
  \ DevOps 和第三方组件方面具有可靠的防御机制，您应执行以下操作：\n\n- **让安全驱动 DevOps 战略**：在 **DevOps** 的每一步评估安全态势。例如，确定关键资产存储的最佳方法。出于运营目的，您可能希望将敏感数据存储在本地而不是公共云中。您应在应用程序开发过程中评估其安全性，而不是在开发周期结束时。\n\
  - **分配明确的安全责任**：应为组织 DevOps 中涉及的各方分配角色。例如，对于第三方软件，确保安全所有权得到正确定义，而对于公共云服务，应有负责服务和应用安全的人员。**角色分配**\
  \ 在安全流程中引入了问责制。\n- **选择适当的安全管理方法**：**安全管理** 可以采用分布式或集中式安全管理方法。然而，这应避免业务职能各自为政。中小企业可以利用集中式方法来拥有一体化的管理基础设施。就问责制而言，后者是高效的，因为所有内容都在一个地方管理。\n\
  \n对基础设施安全进行漏洞评估和审计至关重要。变更和补丁管理也必须根据业务目标和要求进行规划，并传达给所有相关利益相关者。\n\n## 网络安全技能短缺\n\n\
  网络安全具有挑战性，需要技术精湛且胜任的专业人员——具备技术和非技术技能的专业人员。社会所需的网络安全技能不仅仅是能在学校学到的。传统教育体系长期以来一直难以填补网络安全技能短缺。组织需要超越学术和传统学习体系，通过投资于人员（通过培训、演练和练习赋能他们）、在组织外部寻找（外包技能）以及关注除学术成就之外的能力（认证）来尝试填补这一差距。\n\
  \n在招聘或组建网络安全团队时，您应关注技能多样性、胜任力、韧性和适应性。这种方法并不意味着不应考虑大学学位。它意味着不应将其作为唯一的关注点，因为网络安全演进的速度很快，而传统教育体系的方法无法跟上这一节奏。\n\
  \n在下一节中，我们将介绍防御系统和数据安全的一些陷阱。\n\n## 威胁防御机制的陷阱\n\n当安全挑战未得到适当解决时，可能会产生严重后果。本节借鉴了 **国际商业机器公司\
  \ (IBM)** 提出的公司应避免的五项非排他性常见安全陷阱 (https://ibm.co/3x06B1i)。这些陷阱概述如下：\n\n- **未能超越合规**：组织应在纸面上和实际操作中遵守标准和法规。获得合规认证后不应有任何自满的余地。可能有一项或多项法规和标准需要遵守；您必须确保始终保持合规。未能通过监管审计是不理想的。\n\
  - **解决方案**：将合规作为起点而非目标，在此基础上构建，并确保安全策略经常更新。如果可能，使用加密来保护静态数据和传输中的数据。\n- **未能集中数据安全**：了解涵盖数据保护和隐私的授权。敏感资产或数据不应在组织内分散，因为分布式安全可能难以维护——应以集中方式关注数据安全。\n\
  - **解决方案**：始终了解敏感数据和资产的位置（无论是在本地还是在云中）。\n- **无法分配责任**：指定具体人员担任安全负责人，负责保护数据和所有关键资产。经常进行内部审计，以确保在安全事件期间知道谁负责什么。\n\
  - **解决方案**：聘请 **首席数据官 (CDO)** 或 **数据保护官 (DPO)** 来监督敏感数据和资产安全。他们还必须确保整个系统安全。\n- **未能解决已知漏洞**：Equifax\
  \ 数据泄露事件可作为本案例的示例。Apache Struts 补丁在攻击前数天发布，但公司未能应用修复。当您未能修补已知漏洞时，您的组织会暴露于攻击之下。\n\
  - **解决方案**：建立可靠有效的补丁管理计划。执行漏洞评估，聘请道德黑客测试系统安全强度，并确保补丁尽快应用（一旦可用）。\n- **未能高效监控数据活动**：您必须跟踪系统中所有用户的活动。注意\
  \ *谁*（具有适当安全访问权限的凭证）正在访问关键资产，来自 *哪里*（办公室 **局域网 (LAN)** 或远程），以及正在进行 *什么* 具体操作（修改、复制或提取）。\n\
  - **解决方案**：开发或部署可靠的数据监控系统，评估每个用户的活动并确定底层用户是否具有访问关键资产和数据的特权和权限。\n\n创建可靠的防御系统以抵御当前和新兴威胁是复杂的，因为需要考虑许多参数。然而，您必须明白，没有两个行业的安全需求相同。攻击者了解他们针对的每个行业的挑战；IT\
  \ 团队也应如此。现在，让我们来看看主动分析和监控。\n\n## 数据监控与主动分析\n\n数据监控和主动分析是两种众所周知的系统保护能力；因此，良好的安全防御必须具有监控解决方案和分析功能以实现保护。为了可靠地执行\
  \ TI 或安全防御的数据监控和分析，我们假设已满足一定数量的要求，包括以下内容：\n\n- **数据位置**：您知道关键资产驻留在何处（本地、云中、结构化共享文件夹中以及员工终端上）。\n\
  - **目录**：您保留所有关键数据源的记录（前端应用程序、服务器及其信息）。\n- **数据存在**：确保您了解所有关键数据的存在情况，因为如果您不知道其存在或位置，就无法监控关键数据。\n\
  \n数据监控（包括网络监控）使您和组织能够评估系统是否按预期运行。它以接近实时的方式查看系统操作。通过网络和数据监控，可以跟踪 **流量**、**延迟**、**可用性**、**正常运行时间**\
  \ 和 **带宽利用率** 等参数以检测正常和异常行为。例如，流向包含关键数据的服务器的高流量可能会引起网络管理员和安全团队的关注，或者网络流量突然下降可能预示潜在威胁。此外，可靠的监控系统可以帮助检测系统故障和数据流中的瓶颈。\n\
  \n## 系统监控的优势\n\n如果您想投资于它，了解数据安全监控的好处至关重要。以下要点从安全和运营角度提供了系统监控的好处：\n\n- **对数据和网络的良好洞察**：这使网络中的一切都可见。它跟踪从源到目的地的事件和流程。例如，您可以查看哪些关键资产被访问最多、由谁访问以及具体做了什么（下载请求、删除请求等）。因此，它有助于快速做出\
  \ **开发-安全-运维-安全 (DevOpSec)** 决策。\n- **识别系统运营中的差距**：系统监控分析每个组件及其使用方式。它可以帮助识别系统中哪些部分需要更多资源、升级或重组，以保护数据和拥有良好防御为目的。\n\
  - **更快识别安全威胁**：通过可靠的监控，系统可以更快地识别异常和恶意活动。这减少了人工工作量并优化了资源利用。\n\n数据监控提供了跟踪系统细节的更好方式；因此，避免在活动中出现盲点至关重要。在以下小节中，我们将介绍如何将数据或网络监控集成到您的基础设施中。\n\
  \n## 高层架构\n\n许多公司已经通过 **防火墙**、**入侵检测系统 (IDSes)**、**入侵预防系统 (IPSes)**、**探针** 等元素监控网络流量。因此，了解部署监控解决方案的基本架构至关重要。无论您使用的是内部开发还是购买的解决方案，您都需要掌握每种监控方法论的优缺点。架构如下图所示：\n\
  \n![](img/d47f26598025b2da017dd41fcbb6e602_259_0.png)\n\n图 8.1 – 部署监控解决方案的架构\n\n\
  在 **主动监控** 场景中，监控设备直接部署在网络中以主动监控流量。监控对系统的运行有 *直接影响*。它具有 *读和写* 能力，这意味着监控设备可以改变网络行为（阻止、丢弃或隔离数据包）。由于设备直接安装在网络接口上，因此可以根据配置和功能\
  \ *减慢和过滤流量* 并 *消耗网络资源*。主动监控非常适合实时 *活动监控* 和 *策略执行*。它是一种 *主动* 方法。防火墙、IDS、IPS 和主动探针是用于主动监控的设备的示例。\n\
  \n在 **被动监控** 场景中，使用被动设备（如被动探针）。接口上的流量会被 *分流*，其中一小部分发送到监控系统。被动探测 *不允许写入或影响数据流*。它主要用于\
  \ *捕获和分析实时流量* 和 *提供统计信息*。它 *非常适合终端用户体验* 和性能指标，因为它可以在较长的时间段内分析数据。被动监控不会影响系统运行。\n\n\
  无论您选择哪种解决方案，强调业务需求都至关重要。将安全与运营进行基准比较，并确保没有一方被落下（组织必须力求实现最佳且安全的流程）。一些组织可以使用这两种方法，以获得主动和被动的网络或数据体验。\n\
  \n## 可靠监控系统的特征\n\n在大多数情况下，您或您的组织可能会寻找网络和数据监控解决方案，以为基础设施实施额外的防御层。确保良好保护能力应关注的一些基准包括以下内容：\n\
  \n- **实时告警**：系统必须通知管理员和所有相关方有关可疑或不常见活动的通知。这可以通过电子邮件和短信进行。然后安全或管理团队可以采取行动。实时告警必须自动化且高效。\n\
  - **主动分析**：监控系统必须具有分析模块，允许组织在报告和仪表板中查看系统洞察。主动分析还必须提供对检测到问题的建议或对策。\n- **与其他工具的集成**：监控系统必须整合和关联其数据与其他数据源，以拥有统一的数据保护结构，并为诸如\
  \ **安全信息和事件管理 (SIEM)** 系统、**威胁情报平台 (TIPs)**、事件管理系统等的路由机制提供支持。\n- **广泛的使用范围**：对于预算有限的企业而言，好的工具必须具有广泛的用途。它必须涵盖数据、网络、数据库、安全、Web\
  \ 应用程序和性能监控。覆盖的领域越多越好；否则，您将不得不投资于不止一个监控解决方案。\n- **主动冗余**：监控工具必须通过自行维护系统的关键部分来确保高系统可用性。它确保在故障情况下关键功能不会被关闭。\n\
  - **嵌入式智能**：随着 **人工智能 (AI)** 和 **机器学习** 的兴起，可靠的监控工具包括行为分析、流量模式识别以及警报和事件的优先级排序等高级功能。\n\
  \n作为负责的安全分析师，您应了解工具使用的不同协议。\n\n数据和网络监控在堆栈中提供了额外的安全层。结合主动分析，它们使组织能够对异常行为采取有效行动。好处不仅限于安全和威胁管理；它们扩展到多个领域，例如\
  \ **IT 系统管理**。在下一节中，我们将研究漏洞评估作为防御层。\n\n## 漏洞评估和数据风险分析\n\n组织必须经常评估其系统的漏洞。作为 CTI，您必须与漏洞评估团队合作，评估漏洞评估流程，并就硬件、软件、应用程序、服务和网络报告。漏洞管理团队也是战术和技术\
  \ TI 输出的主要消费者。漏洞评估必须 *自动化* 且易于集成到 *TIP* 或 *SIEM* 中。以下功能或任务应是您的漏洞评估工具或框架所期望的：\n\n\
  - **识别系统的安全缺陷**：在对手之前识别系统弱点。扫描整个系统域。识别数据库和文件系统的弱点（**结构化查询语言 (SQL)** 注入、弱凭据、用户权限过大、缺少补丁、加密不佳等），应用程序（代码注入攻击）、服务（配置）以及网络（Wi-Fi\
  \ 加密攻击、开放端口、弱流程、弱用户身份验证等）。\n- **系统配置基准测试**：漏洞评估必须用于将系统运行配置与推荐配置进行比较，并指出不合规区域——例如，漏洞评估必须突出显示弱加密并通知相关方其使用位置。\n\
  - **漏洞优先级排序**：为已识别的漏洞分配严重级别。严重级别通常根据漏洞带来的 *风险* 以及其 *利用* 的存在与否来设定。例如，与远程命令执行相关的漏洞必须归类为高或严重。漏洞随后根据严重级别进行优先级排序。\n\
  - **修复建议**：必须提供有关修复漏洞的建议，无论是嵌入在工具中还是由安全专家提供。您必须始终从高优先级漏洞开始，然后再处理其余部分。\n\n基于上述漏洞评估流程的功能和任务，我们可以突出需要持续关注的四个系统领域，如下所示：（1）*主机漏洞评估*（评估关键网络元素，如服务器、交换机、路由器以及其上运行的所有服务和应用程序）。您必须跟踪员工在组织资源上运行的应用程序和程序。（2）*局域网/无线局域网\
  \ (WLAN) 漏洞评估*（评估有线和无线网络基础设施是否存在可能破坏它们的实践）。（3）*数据库漏洞评估*（评估常见弱点，最重要的是敏感数据攻击）。（4）*应用程序漏洞评估*（我们可以参考\
  \ **开放 Web 应用程序安全项目 (OWASP)** 排名前 10）。在下一节中，我们将介绍如何执行漏洞评估。\n\n## 漏洞评估方法\n\n根据业务或\
  \ CTI 目标，漏洞评估可以通过以下三种不同方式执行，如下所述：\n\n- **黑盒评估：** 您可以要求您的安全团队或承包商团队通过从外部攻击系统（或您的防御）来评估系统，冒充真正的对手。不要提供任何信息来使流程变得容易。相反，挑战他们从\
  \ *外部视角* 识别所有潜在弱点。他们使用所有资源（开源情报）来攻击可能位于 **非军事区 (DMZ)** 中的资产。\n- **白盒评估：** 您可以测试系统，通过向您的安全团队或承包商提供完整的系统信息。信息可以包括要评估的区域、凭据和资源。该方法的优势在于，遗漏某些组件的可能性几乎为零。因此，白盒评估非常适合彻底的系统评估。\n\
  - **灰盒评估：** 部署此方法时，您作为安全经理允许测试人员结合上述两种方法。您向测试人员提供最少的信息集，并要求他们自行推断其余部分。\n\n组织需要使用这两种方法的组合，以获得系统防御的整体视角。以下小节解释了漏洞评估流程，该流程有时对安全专业人员来说有效执行起来具有挑战性。\n\
  \n\n\n## 漏洞评估流程\n\n漏洞评估是通过对系统的一个或全部区域进行 *扫描* 实现的。因此，该流程必须与需求保持一致，并且必须自动化，以确保不会遗漏任何计划区域。该流程还取决于多个因素，例如所使用的框架或工具以及评估的目标。例如，如果你想执行漏洞评估以支持某项政策，其强度会与目标是针对潜在关键弱点采取行动时有所不同。\n\
  \n下图展示了漏洞评估流程：\n\n![](img/d47f26598025b2da017dd41fcbb6e602_263_0.png)\n\n图 8.2 –\
  \ 漏洞评估流程\n\n如 *图 8.2* 所示，漏洞评估流程提供了一种高效、战略性的方式来评估系统是否存在潜在网络威胁。\n\n> **重要提示**\n> \n\
  > 漏洞评估的规划、开发和执行必须由 **首席信息安全官 (CISO)** 或 **首席信息官 (CIO)** 监督，具体取决于组织的架构。IT 安全团队负责运行技术流程。\n\
  \n*图 8.2* 中显示的步骤接下来会进行解释，作为建立标准且高效的漏洞管理流程的指导方针。\n\n### 规划与初步评估\n\n写下评估的 *目标*。明确\
  \ *输出结果将用于何处*。你必须确定评估的 *范围*。*威胁建模* 的结果是漏洞评估的最佳输入，因为我们假设关键资产（和数据）以及潜在风险已被识别。如果未执行威胁建模（不推荐），你应识别所有关键资产（数据、应用程序、服务器等）并为每个资产定义风险。在此阶段，你确定诸如评估的\
  \ *持续时间*、*开始时间*、涉及的 *相关方*、*风险承受水平* 和 *业务影响* 等参数。\n\n### 方法论与基线定义\n\n组织选择评估的适当 *方法论*。根据目标，组织可以使用黑盒、白盒或灰盒方法论。该方法论促进了对系统的\
  \ *信息收集*。评估人员需要知道系统信息是否会被提供，或者他们是否应独立执行 *侦察*。如果信息将被提供，评估人员需要了解将提供哪些信息。此阶段的最后一步是选择合适的\
  \ *漏洞评估工具（或扫描器）*。评估流程的第一步和第二步必须得到充分记录。\n\n### 执行漏洞扫描\n\n评估人员必须强调 *合规要求*，以确保扫描流程有效。此阶段可以通过两种方式执行：**手动**\
  \ 或 **自动**。推荐采用自动化流程；不过，组织可以同时执行两种方式并对结果进行基准比较。对于使用工具的自动化流程，必须确保在必要时使用 *正确的策略*。这些策略必须适用于内部和外部系统组件，如下所述：\n\
  \n- **内部漏洞扫描**：你对系统的关键资产进行内部扫描。在这种情况下，组织可以使用安装在网络端点的扫描器来执行评估。这种类型的扫描对于识别员工、人为错误或具有系统访问权限的恶意行为者可以利用的漏洞至关重要。\n\
  - **外部漏洞扫描**：你对关键公共资产进行扫描——即可从组织外部用作攻击面的资产。此类扫描使用公共网络（互联网）执行，有助于组织在全世界之前意识到弱点。\n\
  \n内部和外部漏洞扫描对组织至关重要；因此，它们必须被视为有效防御机制的一部分。漏洞扫描涉及的步骤如下：\n\n- 1. **识别漏洞：** 在此阶段，扫描器运行以识别系统中的所有潜在弱点。结果是一份\
  \ *检测到的漏洞的综合列表*。此步骤依赖于多个组件，例如漏洞数据库和 TI 数据源（这就是为什么必须将漏洞评估工具与 TIPs 或 SIEMs 集成的原因）。\n\
  - 2. **分析检测到的漏洞：** 在此阶段，你需要识别每个已识别漏洞的 *根本原因* 以及其适用的资产或资源（*系统组件*）。典型的例子可能是组织 Web\
  \ 服务器上未修补的应用程序软件。当原因和组件确定后，修复流程会更加确定。\n- 3. **评估漏洞：** 使用风险分析来优先排序已识别的漏洞。后者根据严重性进行排名，严重性基于业务影响和受影响资产确定。数据风险评估将在后续章节中讨论。\n\
  - 4. **修复漏洞：** 目标是补救已识别的漏洞。此步骤可以通过直接解决问题（配置更新、修补）、引入新安全策略和程序或更新现有策略和程序，以及获取新工具来加强系统来完成。\n\
  \n> **重要提示**\n> 漏洞评估和系统扫描操作不得孤立进行。它们需要 **安全运营中心 (SOC)**、高级支持、变更管理、补丁管理、配置管理等部门之间的协调。\n\
  \n系统扫描和漏洞评估流程必须是一个 *迭代* 过程。安全利益相关者必须定义定期进行漏洞评估和系统扫描的时间，以确保防御系统保持最新。现在让我们来看漏洞评估工具。\n\
  \n### 漏洞评估工具\n\n漏洞评估工具允许组织自动执行整个系统扫描。它们识别、分析和评估系统弱点并提供建议步骤。因此，你可以根据预算和需求使用商业或开源漏洞扫描器。\n\
  \n### 可靠工具的特征\n\n漏洞工具应根据其可执行的扫描进行选择，如下所示：(1) *扫描 Web 应用程序*（查找 Web 应用程序中的漏洞）。(2)\
  \ *扫描协议*（查找协议、端口和服务中的漏洞）。(3) *扫描网络*（识别网络数据包、元素、端点和物联网设备中的漏洞——这包括 *主机* 和 *网络*）。(4)\
  \ *扫描云服务和应用程序*。工具可以具有一种或多种扫描能力。\n\n对组织而言投资漏洞评估工具可能具有挑战性，尤其是刚开始整合网络安全或 TI 的组织。目标是在工具库中拥有尽可能多的模块。然而，可靠的漏洞评估工具的主要考虑因素或功能包括以下内容：\n\
  \n- **更新的漏洞数据库**：新漏洞被频繁发现。工具必须拥有最新的行业漏洞。你需要了解工具的更新程序和策略。开源工具的信息可以在互联网或工具网页上找到。\n\
  - **更少的误报**：误报可能误导分析并削弱系统的防御。确保工具检测到的漏洞是真实的，并且误报率不过高（超过某一阈值）。\n- **自动评估**：确保工具能够对漏洞进行排名以便于优先排序，并且允许用户基于排名进行筛选——例如，你必须能够仅选择和分析关键漏洞。\n\
  - **自定义策略创建**：确保工具可配置。安全团队可以为特定用例创建自定义策略。\n- **支持同时扫描**：多重扫描可能不是首要需求，但具备该功能是有益的，因为它允许团队并行扫描系统的不同部分。\n\
  - **可靠的报告**：确保工具生成包含图表（即时和趋势）的报告，以减轻手动生成报告的负担。\n- **提供建议**：确保工具提供补救或缓解已识别漏洞的建议。\n\
  \n对于开源工具，检查公开评论以及平台的维护方式至关重要。另一个需要检查的重要要素是供应商的声誉（针对商业工具）。在以下小节中，我们将介绍漏洞工具必须具备的主要组件。\n\
  \n\n\n\n## 漏洞评估工具的组件\n\n本节利用 SysAdmin、Audit、Network 和 Security（SANS）学院关于审计漏洞工具的白皮书（https://bit.ly/3gaAdne）来突出漏洞评估工具的强制性组件。确保这些模块或组件包含在您想要投资的工具中。组件如下图所示：\n\
  \n![](img/d47f26598025b2da017dd41fcbb6e602_267_0.png)\n\nFigure 8.3 – 漏洞评估工具的组件\n\
  \n组件包括引擎扫描器、数据库、报告模块和用户界面（UI）。报告模块必须提供涵盖技术和战略范围的报告。这些报告被不同的组织部门使用，必须相应地定制。\n\n##\
  \ 漏洞评估工具示例\n\n请注意，这里列出的工具并非基于偏好；相反，它们基于互联网搜索的流行度和个人经验。您可用于漏洞评估和审计的一些工具包括以下：(1) OpenVAS（社区版和商业版）；(2)\
  \ Nexpose（社区版和商业版）；(3) Nessus（社区版和商业版）；(4) Acunetix（社区版和商业版）；(5) Nmap（开源）；(6) IBM\
  \ QRadar（商业版）；(7) Qualys Vulnerability Management（Qualys VM）（社区版和商业版——可执行云扫描）；(8)\
  \ Microsoft Baseline Security Analyzer（MBSA）；(9) Appknox；(10) Burp Suite（社区版和商业版）。\n\
  \n使用之前研究的特征和组件来评估您想要投资的每个工具。\n\n## 漏洞和数据风险评估\n\n漏洞扫描的输出用于评估每个弱点所附带的风险。虽然大多数漏洞评估工具都包含风险分析，但了解这一概念至关重要，尤其是对于执行手动漏洞扫描的组织或个人。风险分析或审查的目标是对漏洞进行排序，以便优先处理高风险漏洞。评估漏洞时应考虑多个因素：受影响的\
  \ *系统部分*、*受风险数据*、*利用可行性*、被利用时对 *业务的影响* 以及被利用时的 *潜在损害*。最受欢迎的漏洞评估方法之一是 **通用漏洞评分系统（CVSS）**。\n\
  \nCVSS 为每个漏洞分配一个数值分数以突出其严重性。分数可以转换为关键、高、中、低等级别。您的组织可以根据业务需求更改定性表示（但仍保留逻辑）。CVSS 是一个独立于厂商的开放标准。它是大多数\
  \ **通用漏洞披露（CVE）** 评级中最重要的因素。\n\nCVSS 使用三个指标组来评估漏洞严重性：基础、时间性和环境指标。分析师根据漏洞特征分配分数。\n\
  \n### 基础指标和基础分数\n\n基础指标代表漏洞的恒定内在特征。以下概述了用作基础指标的两个指标集：\n\n- **Exploitability**：利用漏洞的难易程度。利用可行性函数由以下组成：（1）**The\
  \ attack vector (AV)**，其值可以是 network (*N*=0.85)、adjacent (*A*=0.62)、local (*L*=0.55)、或\
  \ physical (*P*=0.2)，取决于可从何处发起利用。（2）**The attack complexity**，其值可以是 low (*L*=0.77)\
  \ 或 high (*H*=0.44)。利用越不复杂，得分越高。（3）**The privileges required (PR)**，其值可以为 none (*N*=0.85)、low\
  \ (*L*=0.62 或范围更改时为 0.68) 或 high (*H*=0.27 或范围更改时为 0.5)，取决于授权。（4）**The User Interaction**，其值可以为\
  \ none (*N*=0.85) 或 required (*R*=0.62) 如果利用需要用户交互。\n- **Impact**：这决定了被利用的漏洞对 CIA\
  \ 三元组的破坏力。它是以下功能的函数：（1）*Confidentiality (C)*，（2）*Integrity (I)*，和（3）*Availability\
  \ (A)*。可分配的值可以是 high (*H*=0.56) 或 low (*L*=0.22)。\n\n然后您可以使用以下公式计算基础分数 cvss_b。首先计算\
  \ **exploitability score (ES)**，然后计算 **impact sub-score (ISS)**，然后根据 **scope unchanged\
  \ (SU)** 或 **scope changed (SC)** 计算 **impact score (IS)**，如下所示：\n\n```\nES = 8.22\
  \ × AV × AC × PR × UI\nISS = 1 − {(1 − C) × (1 − I) × (1 − A)}\nIS = { 6.42 × ISS\
  \ if scope unchanged\n(7.52 × (ISS − 0.029) − 3.25 × (ISS − 0.02))^{15}\ncvss_b\
  \ = { 0 if IS ≤ 0\n{ roundup(min(IS + ES,10)) if scope unchanged\nroundup(min(1.08\
  \ × (IS + ES),10)) if scope changed\n```\n\nFigure 8.4 – CVSS 基础分数计算\n\n前述公式提供了\
  \ CVSS 基础分数，一个介于 0 到 10 之间的值，如图 8.8 所示。\n\n### 时间性指标和时间性分数\n\n时间性指标考察随时间变化的漏洞特征。没有补丁且易于利用的漏洞得分更高。使用的指标包括以下：\n\
  \n- **Exploit code maturity (E)**：反映了针对该漏洞使用利用的可能性。其值可以为 not defined (X=1)、high\
  \ (H=1)、functional (F=0.97)、**proof-of-concept (POC)** (P=0.94)、或 unproven (U=0.91)，取决于利用代码对公众的可用性。\n\
  - **Remediation Level (RL)**：确定在有或没有官方补丁的情况下修复漏洞的可能性。其值可以为 not defined (X=1)、unavailable\
  \ (U=1)、workaround (W=0.97)、temporary fix (T=0.96)、或 official fix (O=0.95)。\n- **Report\
  \ Confidence (RC)**：这突出了关于漏洞的技术信息是否存在。其值可以为 not defined (X=1)、confirmed (C=1)、reasonable\
  \ (R=0.96)、或 unknown (U=0.92)，取决于技术信息，例如根本原因。\n\n然后您可以使用以下公式计算时间性分数 ts：\n\nts =\
  \ roundup(cvss_b × E × RL × RC)\n\nFigure 8.5 – CVSS 时间性分数（ts）计算\n\n由于 E、RL 和 RC\
  \ 介于 0 和 1 之间，且 cvss_b ≤ 10，时间性分数将在 0 到 10 之间（0 ≤ ts ≤ 10）。\n\n### 环境指标和分数\n\n环境指标突出了资产对组织的重要性。它们使用\
  \ CIA 三元组来分配值，由以下组成：\n\n- **Security requirements**：分析师将受影响的资产映射到 CIA 三元组：**Confidentiality\
  \ Requirements (CR)**、**Integrity Requirements (IR)**、和 **Availability Requirements\
  \ (AR)**。例如，与可用性相关的资产会被分配高分。值可以为 not defined (X=1)、high (H=1.5)、medium (M=1)、或 low\
  \ (L=0.5)，取决于对 CIA 的影响。\n- **Modified base metrics**：这些是根据用户环境对基础指标的修改。它们被分配与基础指标相同的值。\n\
  \n环境分数 es 定义如下：\n\nes = { 0 if MIS ≤ 0 ; roundup(roundup(min(MIS + MES, 10)) × E\
  \ × RL × RC) if m.scope unchanged ; roundup(roundup(min(1.08 × (MIS + MES),10))\
  \ × E × RL × RC) if m.scope changed }\n\nFigure 8.6 – CVSS 环境分数（es）计算\n\n这里，M 和\
  \ m 表示 modified，MES = ES（只需将指标更改为修改后的值），修改后的影响分数（MIS）由以下公式给出：\n\nMIS = { 6.42 ×\
  \ ISS if m.scope unchanged ; 7.52 × (ISS − 0.029) − 3.25 × (ISS × 0.9731 − 0.02)^13\
  \ }\n\nFigure 8.7 – CVSS 环境 MIS 计算\n\nCVSS 分数主要取决于基础指标（这些指标在计算总体分数时是强制性的，而其余指标是可选的）。定性排名如下图所示：\n\
  \n| Rating | Score |\n|---|---|\n| None | 0.0 |\n| Low | 0.1 – 3.9 |\n| Medium |\
  \ 4.0 – 6.9 |\n| High | 7.0 – 8.9 |\n| Critical | 9.0 – 10.0 |\n\nFigure 8.8 – CVSS\
  \ 分数定性评级量表\n\n有关评分标准的更多详细信息，请参阅此处：https://www.first.org/cvss/v3.1/specification-document。分析师可以为每个漏洞分配分数并计算严重性或分数。这些算法嵌入在大多数漏洞评估工具中。如果未嵌入，安全团队需要将其集成到流程中。\n\
  \n漏洞评估和数据风险分析对于构建有效的防御系统至关重要。然而，该过程需要高效地规划和执行。运营和管理需要共同努力以优化漏洞评估和风险分析。该过程必须是迭代的，以确保基础设施得到可靠保护并且防御系统保持最新。您现在应该能够开展（规划、启动和实施）漏洞管理计划。下一节将介绍当数据在传输中或静态时被合法或非法请求时，您如何保护数据。\n\
  \n## 加密、标记化、屏蔽和隔离\n\n部署安全基础设施时，必须将敏感数据保护视为首要任务。您需要使系统了解在敏感数据被访问或请求时（静态或传输中）如何反应。加密、标记化、屏蔽和隔离可保护数据本身，无论是静态还是传输中。在下一节中，我们将研究加密作为一种防御机制。\n\
  \n\n\n\n## Encryption as a defense mechanism\n\n贵组织的数据可能一直在流动，面向客户的公司通过网络或互联网传输数据（传输中的数据）；或者，数据可能只是静止在某一个或多个位置（公司文件系统和员工硬盘——静态数据）。您需要确保数据从离开其所在位置到请求者所在位置期间，或在静态时都受到保护。您对敏感数据应用的安全级别决定了风险状况。攻击者不会停止尝试入侵传输中或静态的数据。请使用最新且合适的加密技术来保护敏感数据。\n\
  \n为保护传输中的数据，请使用*加密传输机制*。这种做法允许在**传输控制协议 (TCP)**/IP 栈的较高层（如应用层和传输层）进行数据保护。因此，数据在离开网络元素或端点之前就已受到保护。无论配置如何（客户端-服务器或服务器-服务器），贵组织必须用于传输中数据的技术包括**安全套接层\
  \ (SSL)**/**传输层安全 (TLS)**。TLS 是 SSL 的升级版，支持一些最强的加密方式（**Rivest-Shamir-Adleman (RSA)**\
  \ 和 **高级加密标准 (AES)**）。所有涉及数据移动的应用程序和目录（**超文本传输协议 (HTTP)** Web 服务器、**文件传输协议 (FTP)**、Telnet、**简单邮件传输协议\
  \ (SMTP)**、目录、数据库）都应通过 SSL/TLS 进行（**HTTP 安全 (HTTPS)**、**FTP 安全 (FTPS)**、**安全 Shell\
  \ (SSH)**——安全 Telnet 版本）。应关闭未加密端口。确保在加密-解密过程与数据传输速度之间取得平衡。加密/解密过程变慢会导致系统请求-响应过程迟缓。\n\
  \n> **重要说明**\n> 传输中数据最常见的攻击是**中间人 (MITM)** 攻击。近年来，攻击者已开发出将 SSL/TLS 应用程序降级为非 SSL/TLS\
  \ 应用程序的方法，尤其针对 HTTP、FTP 等服务器-客户端通信，使用诸如 **SSLStrip** 之类的工具。因此，请确保在所有相关应用程序上强制执行**严格传输安全\
  \ (STS)**。\n\n为保护静态数据，请确保*在存储前加密敏感数据*或*加密存储组件（硬盘、文件系统等）*。您也可以同时使用两种方法；但是，请确保安全不会影响可用性。始终使用最先进的加密算法以优先考虑加密并保护数据。使用云服务时，您必须评估云服务提供商的数据安全措施。\n\
  \n## Tokenization as a defense mechanism\n\n**令牌化**与加密一样，可用于保护传输中或静态的数据。不同之处在于它使用令牌（随机生成的值）而不是密钥。该过程的优势在于敏感数据无需离开贵组织，并且无法使用底层令牌进行逆向还原。相反，存储在令牌库（数据库）中的令牌用于建立与原始数据的引用或关系。被泄露的令牌不会向攻击者提供必要的信息。对于金融行业或涉及支付流程的组织而言，在加密之上使用令牌化以提供最大安全性是一种良好实践。例如，PCI\
  \ DSS 始终建议组织用另一种数据保护形式补充加密流程。加密是可逆的，这意味着攻击者有机会访问原始数据。为了满足 PCI DSS 要求，一些组织会增加令牌化。\n\
  \n## Masking and quarantining\n\n您必须设计系统以妥善管理未经授权的访问——将用户限制为只能查看或操作其有权访问的内容（*最小权限原则*）。并非组织中的每个人都有权完整查看敏感数据。掩码是指对数据的一部分进行混淆。用户的信用卡号码可能仅显示前三位和最后三位数字，并用字符如\
  \ 341*************967 替换中间数字。财务部门的员工在请求信息时可能可以查看所有薪资，除了高管。窃取此类普通用户凭证的攻击者只能处理掩码数据。因此，当数据由内部或外部用户请求时，您需要强制执行数据保护策略。\n\
  \n安全系统必须考虑当系统收到可疑请求时该如何处理。最佳实践包括将这些请求隔离、停止用户访问、记录所有活动并提醒相关方采取行动。诸如 IPS、IDS 和防病毒应用程序等网络元素具有隔离网络中非法和可疑请求或活动的能力。隔离是防止因员工失误和恶意攻击者而产生的威胁的最佳方式。\n\
  \n加密、令牌化和掩码是至关重要的*数据混淆*技术，必须在组织中使用（或至少其中一种）来保护敏感数据（或资产）。您必须根据组织的业务和安全要求评估和选择每种技术。您必须实施强大的安全控制来保护数据（如有需要，使用防火墙、IDS、IPS\
  \ 和代理服务器）。所有数据请求必须记录并分析。在下一节中，我们将看到一次数据泄露用例，并强调加密本可以如何防止该事件。\n\n## Endpoint management\n\
  \n最佳的安全防御实践之一是确保只有符合最低安全要求的授权设备才能连接到网络，包括笔记本电脑、台式机、移动设备以及任何可以连接到网络的终端用户设备（电子电路板等）。未授权或与工作无关的端点应通过具有有限访问权限的访客网络。然而，系统中端点的数量可能使控制和管理变得不切实际，因此需要一个自动化且基于策略的端点管理系统。将端点管理作为额外安全防御层的主要目标包括以下内容：\n\
  \n- **权限控制**：通过权限策略，您应选择需要连接到网络的端点类型——例如，策略可以优先考虑具有特定特征（制造商、型号、操作系统等）的个人电脑。\n- **用户访问控制\
  \ (UAC)**：端点管理可以与用户的凭证关联。此功能将允许您跟踪和监控每个用户用于访问关键资产的设备。\n- **访问凭证强制执行**：端点管理可以通过强制使用**令牌**、**访问密钥对**（加密）和**多因素认证\
  \ (MFA)** 来执行密码策略。\n\n端点管理包括安全和保护，使得设备数据访问的更改被记录并暴露以避免安全威胁，从而加强防御屏障。此外，端点管理应允许与其他安全平台（如\
  \ SIEM 和 TIP）集成。\n\n## Reliable endpoint management requirements\n\n无论您是想自行开发端点管理系统还是外包，都应有推动开发策略的元素。后者必须基于安全要求，同时保持业务的正常运行。开发端点策略或选择平台时应考虑的元素包括以下内容：\n\
  \n- **管理并保护移动端点**：静态端点可能比移动动态端点更容易管理。然而，在人们可以远程工作的时代，设备必须在组织安全边界之外进行跟踪和保护，因此策略必须适应这一点。\n\
  \n\n\n-   **支持所有端点类型**：端点管理必须涵盖所有可以连接到网络的设备类型（笔记本电脑、打印机、智能手机、智能设备、平板电脑、电子板、工业机器等等）。此外，还必须涵盖物理和虚拟端点。\n\
  -   **支持所有操作系统**：虽然 Windows 仍是最流行的操作系统，但有效的端点管理系统必须涵盖所有操作系统（Windows、Linux、macOS、Android、iOS）。它还必须针对定制和个性化的操作系统或软件进行调整。\n\
  -   **促进补丁管理**：确保可以使用系统强制执行软件补丁，并且涵盖所有主要补丁。\n-   **保持用户灵活性**：虽然端点管理系统对网络设备强制执行策略和标准，但它不得损害用户在其设备上工作的能力。虽然主要目标仍然是以尽可能低的成本加强安全，但操作必须保持高效。\n\
  -   **识别并提醒不合规情况**：确保端点系统识别不符合贵组织政策和行业法规的设备。最极端的情况下，它必须自动解决合规问题或提醒安全或 IT 团队。\n-\
  \   **与其他平台集成**：构建有效防御的思路是避免不同的安全组件各自为政。因此，端点管理系统必须具备与 SIEM、TIP、监控系统等其他 IT 系统无缝集成的能力（使用\
  \ **应用程序编程接口 (API)** 或自定义连接）。此外，SIEM 或 TIP 必须作为所有安全平台的集中式系统运行。\n\n投资端点管理系统可能成本高昂；因此，成本因素必须始终考虑在内，尤其是对于预算有限的组织而言。组织可以根据功能和需求获取一个以上的端点管理系统。当使用多个平台时，确保集成和互操作性得以保持以便于维护和支持。以下章节将介绍移动端点管理以及它与端点管理系统有何不同和挑战。\n\
  \n## 移动端点管理\n\n移动设备的使用量呈指数级增长，已超过笔记本电脑、打印机等静态设备的使用量。移动设备架构、日常使用方式和能力使其对端点系统构成更大挑战。想象一下，一名员工使用手机访问企业网络，同时下载游戏和音乐、访问种子网站，并在浏览互联网时点击随机链接。他们的设备就成为攻击者与企业网络之间的桥梁。让我们来看一下可能的移动设备安全威胁。\n\
  \n## 移动安全威胁与对策\n\n安全威胁在移动设备上可能与传统端点不同，这是由于架构调整所致。例如，与笔记本电脑相比，移动设备与内核的交互并非直接的。相反，用户需要通过各种应用程序来与设备操作系统交互。因此，我们可以将移动安全威胁分为以下三类：\n\
  \n-   **基于内核的威胁**：这些威胁发生在操作系统功能（权限、root 应用程序等）发生有意或无意更改时。例如，对移动端点进行 root 或越狱以访问操作系统核心会使设备容易受到网络攻击。*因此，您必须强制执行限制已\
  \ root（或越狱）移动设备访问网络的策略。*\n-   **基于应用程序的威胁**：网络钓鱼同样适用于移动设备，移动应用程序对资源的访问权限各不相同。如果您向武器化应用程序授予敏感数据访问权限，不仅您的设备会成为受害者，您连接的任何网络都将面临风险。因此，您必须*强制执行用户如何管理和授予应用程序权限的策略*（这可以通过教育实现）。系统必须识别*存在安全风险的移动设备*（获取其\
  \ **标识符 (IDs)**、**国际移动设备身份码 (IMEI)**、型号、制造商等）。系统应能够*在风险较高时阻止此类设备。*\n-   **社会工程和网络威胁：**\
  \ 社会工程学将始终是最有效的攻击手段之一，即使针对移动设备也是如此。下载恶意文件并在克隆网站上输入凭据可能会让攻击者获得访问权限。另一种访问设备的方式是通过网络攻击。攻击者可以通过访问企业无线网络（例如使用\
  \ **中间人攻击 (MITM attack)**）来收集端点信息。因此，您必须*对员工进行安全最佳实践的教育并强制执行 LAN 和 WLAN 网络保护（无线保护访问\
  \ 2-企业版 (WPA2-Enterprise) 或最新的 WPA3 加密）*。当使用开放接入点时，确保员工无法通过其访问其他网络。\n\n移动设备[content]\n\
  -   **支持所有端点类型**：端点管理必须涵盖所有可以连接到网络的设备类型（笔记本电脑、打印机、智能手机、智能设备、平板电脑、电子板、工业机器等等）。此外，还必须涵盖物理和虚拟端点。\n\
  -   **支持所有操作系统**：虽然 Windows 仍是最流行的操作系统，但有效的端点管理系统必须涵盖所有操作系统（Windows、Linux、macOS、Android、iOS）。它还必须针对定制和个性化的操作系统或软件进行调整。\n\
  -   **促进补丁管理**：确保可以使用系统强制执行软件补丁，并且涵盖所有主要补丁。\n-   **保持用户灵活性**：虽然端点管理系统对网络设备强制执行策略和标准，但它不得损害用户在其设备上工作的能力。虽然主要目标仍然是以尽可能低的成本加强安全，但操作必须保持高效。\n\
  -   **识别并提醒不合规情况**：确保端点系统识别不符合贵组织政策和行业法规的设备。最极端的情况下，它必须自动解决合规问题或提醒安全或 IT 团队。\n-\
  \   **与其他平台集成**：构建有效防御的思路是避免不同的安全组件各自为政。因此，端点管理系统必须具备与 SIEM、TIP、监控系统等其他 IT 系统无缝集成的能力（使用\
  \ **应用程序编程接口 (API)** 或自定义连接）。此外，SIEM 或 TIP 必须作为所有安全平台的集中式系统运行。\n\n投资端点管理系统可能成本高昂；因此，成本因素必须始终考虑在内，尤其是对于预算有限的组织而言。组织可以根据功能和需求获取一个以上的端点管理系统。当使用多个平台时，确保集成和互操作性得以保持以便于维护和支持。以下章节将介绍移动端点管理以及它与端点管理系统有何不同和挑战。\n\
