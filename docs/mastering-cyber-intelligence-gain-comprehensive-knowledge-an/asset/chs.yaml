  \n在前面的图中，我们看到恶意软件类型和名称。以下示例显示了 STIX 对象的最后一部分，即关系对象。在关系对象中，我们识别出 relationship_type\
  \ 参数，其值为 indicates。完整的 STIX 模型可以解释如下：指标（SHA256 哈希值）表明存在名为 Poison Ivy 的远程访问木马恶意软件。关系应用于前两个\
  \ STIX 对象之间，如下所示：\n\n```\n{\n        \"type\": \"relationship\",\n        \"spec_version\"\
  : \"2.1\",\n        \"id\": \"relationship--29dcdf68-1b0c-4e16-94ed-bcc7a9572f69\"\
  ,\n        \"created\": \"2020-02-29T18:09:12.808Z\",\n        \"modified\": \"\
  2020-02-29T18:09:12.808Z\",\n        \"relationship_type\": \"indicates\",\n   \
  \     \"source_ref\": \"indicator--a932fcc6-e032-476c-826f-cb970a5a1ade\",\n\n\"\
  target_ref\": \"malware--fdd60b30-b67c-41e3-b0b9-f01faf20d111\"\n}\n]\n}\n\nSTIX\
  \ 代码示例整体描述了一个带有哈希值的指标，表明存在 Poison Ivy 木马。STIX 的 pattern 元素突出了恶意哈希。因此，恶意哈希的数据模型将具有\
  \ pattern、指标类型、恶意软件类型和关系详情。\n\nSTIX 越来越受欢迎，多个组织已采用该标准来表示威胁事件。使用 XML 和 JSON 有助于解析信息，因为它们是两种广泛使用的文件格式。\n\
  \n以下部分将介绍另一种广泛使用的威胁情报共享和收集标准 – TAXII。\n\n## 了解 TAXII 标准\n\nTAXII 是 CTI 的开源标准，可自动化信息共享流程。与\
  \ STIX 相比，TAXII 被视为通过 HTTPS 交换的 CTI 信息的 **传输机制**。该标准使用客户端-服务器架构来促进数据交换。协议标准定义了服务、消息和要求，以创建有效的共享环境。共享模式中定义了两种服务：\n\
  \n- **集合：** TAXII 服务器具有包含 CTI 对象的逻辑存储库。当 CTI 分析师安装 TAXII 服务器时，一组 CTI 数据会托管在其中。客户端使用\
  \ **集合** 服务从服务器请求 CTI 信息。因此，集合服务是一个 *接口*，用于与 TAXII 服务器存储库通信。它采用 *请求-响应* 模型。\n- **通道：**\
  \ 当分析师执行情报操作时，他们可能希望与安全社区的其他成员共享结果。TAXII 采用 *发布-订阅* 模型来促进 TAXII 客户端之间信息交换。因此，通道用于将情报数据推送给客户端。然而，必须知道\
  \ TAXII 标准尚未定义通道服务的规范。它将在未来的 TAXII 版本中定义，正如项目所指定的那样。\n\n有关 TAXII 标准的更多信息，请参阅网站上的官方文档\
  \ (https://bit.ly/3Kdv0YQ)。\n\n## TAXII 标准的工作方式\n\nTAXII 使用 **RESTful API** 进行服务交互。TAXII\
  \ 中的每个 API 都有一个 *实例* – TAXII 集合和通道的逻辑组。随着服务的交互，API 实例可在不同的 URL（位置）上访问。协议定义为每个 URL\
  \ 都有一个 *API 根*，它成为主 API 的一个实例。因此，TAXII 服务器 API 可以有一个或多个 API 根，因为 API 根链接到 URL，并且多个\
  \ URL 可以链接到 TAXII 服务器实例。\n\n集合和通道在逻辑上捆绑到 API 根中。我们可以通过使用三个 GET 请求从 TAXII 服务器检索信息：(1)\
  \ 一个 GET 请求 *查找 URL 和 API 根的列表*，(2) 另一个请求 *查找由 API 根提供的集合标识符*，(3) 最后一个请求 *获取请求的\
  \ objects*。\n\n与 TAXII 服务器的交互很简单，如下图所示：\n\n![](img/d47f26598025b2da017dd41fcbb6e602_129_0.png)\n\
  \n图 4.2 – TAXII GET 请求说明\n\n在 *图 4.2* 中，客户端请求在线 TAXII 服务器获取 URL 列表。格式化的 JSON 响应显示在以下代码示例中。我们可以看到\
  \ TAXII 使用 MITRE ATT&CK 框架和 STIX 格式来共享域集合：\n\n```\n{\n  \"title\": \"CTI TAXII server\"\
  ,\n  \"description\": \"This TAXII server contains a listing of ATT&CK domain collections\
  \ expressed as STIX, including PRE-ATT&CK, ATT&CK for Enterprise, and ATT&CK Mobile.\"\
  ,\n  \"contact\": \"attack@mitre.org\",\n  \"default\": \"https://cti-taxii.mitre.org/stix/\"\
  ,\n  \"api_roots\": [\n    \"https://cti-taxii.mitre.org/stix/\"\n  ]\n}\n```\n\n\
  我们可以通过 collection 服务访问前述服务器的存储库。通过访问集合的目录，我们指向域对象，如下图所示：\n\n![](img/d47f26598025b2da017dd41fcbb6e602_130_0.png)\n\
  \n图 4.3 – 使用 STIX 的 TAXII 集合请求\n\n图 4.3 显示了 TAXII 服务器集合的响应。响应包含服务器返回的所有集合。每个集合元素包括\
  \ ID、标题和描述、读写权限以及媒体类型，后者与 TAXII 服务器使用的 STIX 标准相关：\n\n```\n{\n    \"collections\"\
  : [\n        {\n            \"id\": \"95ecc380-afe9-11e4-9b6c-751b66dd541e\",\n\
  \            \"title\": \"Enterprise ATT&CK\",\n            \"description\": \"\
  This data collection holds STIX objects from Enterprise ATT&CK\",\n            \"\
  can_read\": true,\n            \"can_write\": false,\n            \"media_types\"\
  : [\n                \"application/vnd.oasis.stix+json; version=2.0\"\n        \
  \    ]\n        },\n```\n\n以下代码示例显示了 PRE-ATT&CK 集合：\n\n```\n{\n  \"id\": \"062767bd-02d2-4b72-84ba-56caef0f8658\"\
  ,\n  \"title\": \"PRE-ATT&CK\",\n  \"description\": \"This data collection holds\
  \ STIX objects from PRE-ATT&CK\",\n  \"can_read\": true,\n  \"can_write\": false,\n\
  \  \"media_types\": [\n    \"application/vnd.oasis.stix+json; version=2.0\"\n  ]\n\
  },\n```\n\n以下代码示例显示了服务器响应中的 Mobile ATT&CK 集合：\n\n```\n{\n  \"id\": \"2f669986-b40b-4423-b720-4396ca6a462b\"\
  ,\n  \"title\": \"Mobile ATT&CK\",\n  \"description\": \"This data collection holds\
  \ STIX objects from Mobile ATT&CK\",\n  \"can_read\": true,\n  \"can_write\": false,\n\
