  - 该协议是否被准确执行以减轻攻击或应对过去的事件？\n- 事件期间是否有未执行的安全措施？\n\n这里提到的全局问题是情报项目生命周期第一步的主要驱动因素。它们还定义了下一章中所需的数据收集类型。下表提供了情报需求全局范围的示例，有助于定义情报项目。它还展示了情报需求如何被回答并用于塑造周期的[content]\n\
  数据收集步骤。CTI 团队和内部团队应使用此模板收集全局和具体的情报需求。该方法有助于为团队分配任务：\n\n| CTI 需求（以问题的形式） | 预期答案 |\
  \ 收集需求（未来步骤示例） |\n|---|---|---|\n| 组织是否发生过未遂攻击？ | 是或否。 | 检查过去的安全、网络、入侵检测日志等。 |\n\
  | 组织是如何检测或阻止攻击的？ | 防火墙策略、深度包检测、入侵检测与防御等。 | 收集相关日志以了解策略、规则等。 |\n| 从攻击中提取了哪些有用信息？\
  \ | 对手详情：来源（地区）、IP地址、域名、攻击模型等。 | 收集相关日志。 |\n| 全球正在被利用的漏洞有哪些？ | 密码暴力破解、网络钓鱼（社会工程）、勒索软件等。\
  \ | 与其他组织或其他 CTI 分析师合作。参考在线平台获取有关这些漏洞的信息等。 |\n| 组织以前是如何被入侵的？如何发生的？ | 是或否。通过网络钓鱼。一名\
  \ HR 高管打开了一封伪装成员工的恶意邮件中的附件。 | 参考恶意软件分析、恶意网页链接、邮件的开源情报等。 |\n| 哪些潜在漏洞和威胁正在被研究？ | 加密安全、身份盗窃、高级间谍活动等。\
  \ | 参考在线论坛、暗网等。 |\n\n表 2.1 – CTI 需求 – 主要问题\n\n提取正确的需求具有挑战性，因为许多组织仍不愿接受威胁情报技术。然而，与组织的管理团队或决策者合作是情报项目成功的关键，因为他们了解业务。因此，他们应帮助确定需求的优先级。必须遵循之前讨论的协议（让组织的相关方参与）。如果前提条件仅由\
  \ CTI 团队定义，失败的几率会增加。情报需求的主要目标应确保项目最终产品与组织的安全需求之间不存在差异。\n\n> **重要提示**\n> 说服性的情报需求初稿必须始终从封闭式问题开始。开放式问题可用于证明或维持封闭式问题。例如，必须从这样一个问题开始：公司是否曾被攻击过？而不是过去攻击了哪些系统资源？第二个问题应作为第一个问题的支持论据：封闭式问题越多越好。\n\
  \n在本小节中，我们学习了如何以问题的形式制定情报需求以及为何必须具备它们。这些需求问题的答案构成了任何威胁情报项目中需要采取的初始步骤。\n\n## 优先排序情报需求\n\
  \n优先排序情报需求与收集它们一样重要。了解 CTI 项目需要回答的最关键问题有助于构建运营。我们可以使用多种方法来优先排序需求，但它们都应基于共同基础——关键资产和敏感数据的保护。在制定基础问题后，CTI\
  \ 团队必须创建一份需要相应处理的短期、中期和长期需求清单。\n\n### 短期需求\n\n短期需求需要立即关注，应在尽可能最短的时间内处理。一个典型的例子是识别直接针对组织主要资产的威胁行为者。此类需求应为高优先级并立即查看。短期需求包括提出诸如以下问题：ABC\
  \ 保险公司在最近针对新政策的抗议后，是否有团体计划攻击？或者在针对特定政策的示威后，是否有团体攻击过 ABC 保险公司？如果组织在该事项上感到危险，这类问题应为高优先级。\n\
  \n\n\n一群不满的人是否可能对组织构成威胁？让我们分析一下这在多大程度上可以被归类为威胁：\n\n- **意图**：他们是否有意图？答案是*是*。在公司有争议的政策之后，该团体具有*目的*。将此类行为归类为意图的置信度为*高*。\n\
  - **能力**：他们是否有能力破坏组织？这种能力是可以获得的。因此，答案是*是*。然而，我们必须考虑外包能力所需的预算。因此，分类的置信水平范围从*中等*到*高*，取决于其资源。\n\
  - **机会**：他们有机会吗？答案是*是*。由于公司存在投诉，这足以成为策划网络攻击的动机。置信度为*高*，因为这些行为可以得到正当化。\n\n在前述分析之后，该团体可以被视为对\
  \ ABC 保险公司的威胁。CTI 团队必须直接识别并选择指标以促进对此类威胁（或威胁行为者或对手）的监控。我们将在第 4 章《网络威胁情报的情报收集技巧和标准》以及第\
  \ 5 章《目标设定、CTI 策略的程序和实际用例》中看到如何使用威胁情报框架（如 MITRE ATT&CK 或 Cyber Kill Chain）用于此类目的。最后，利用需求和指标实施行动计划，从而改善安全保护，或如果缺乏足够的资源单独应对威胁，则请求执法部门的帮助。该概念被称为\
  \ **Prioritized Intelligence Requirements (PIRs)**。此示例可按如下图所示建模：\n\n![](img/d47f26598025b2da017dd41fcbb6e602_54_0.png)\n\
  \n图 2.1 – 优先情报需求\n\nPIRs 以最高优先级标签为特征，因为它有助于管理团队和其他战略部门以简单的方式了解威胁的严重性。现在，让我们来看中期情报需求。\n\
  \n## 中期需求\n\n中期需求是指目前并非关键但在不久的将来可能成为安全问题的情报需求。并非关键并不意味着中期需求不那么必要。然而，CTI 分析师需要对这些需求进行分类。例如，ABC\
  \ 保险公司已有效遏制了关键威胁，并且一段时间以来没有遭受此类对手骚扰。过了一段时间，据报道对手已更改其 **战术、技术和程序** (**TTPs**)。为了避免任何安全意外，ABC\
  \ 保险的 CTI 团队应持续识别此类需求，设定适当的指标以监控 TTPs 的潜在变化，然后启动行动计划。该概念被称为 **specific intelligence\
