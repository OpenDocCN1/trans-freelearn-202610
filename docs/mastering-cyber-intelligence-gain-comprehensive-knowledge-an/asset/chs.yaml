  | 业务和风险优先级 | VPN 及 VPN 提供商 | 标准和技艺 |  |\n| 扩展计划 | 拥有的域名 |  |  |\n|  | 云服务（私有和公有）\
  \ |  |  |\n|  | 第三方系统 |  |  |\n|  | 互联网服务提供商 |  |  |\n\n表 2.2 – 运行环境准备信息\n\nCTI\
  \ 分析师必须确保组织的战略团队定义表 2.2 中显示的信息。在物理层面，执行董事会必须确定业务模式（回答问题：组织从事何种业务？）。必须定义整个业务格局，以便妥善准备运行环境信息。结合技术团队，他们还必须提供风险优先级范围（通过回答问题：最突出的业务风险是什么？）。如果有扩展计划，必须定义并与\
  \ CTI 分析师（或团队）共享。在逻辑层面，执行团队必须定义诸如办公室/分支连接等因素（业务各部分是如何逻辑连接的？）。他们必须告知我们组织是否使用 VPN\
  \ 并列出服务提供商。他们必须定义所拥有域名的范围、私有或公有云服务的使用情况，以及在安全范围内使用的任何第三方公司。\n\n还必须识别直接影响安全系统的监管和自然特征。CTI\
  \ 分析师必须将情报产品与法规和灾难性障碍相关联。一个典型例子是定义国家在网络空间中的立场或标准，以及明确组织的地理限制（地震区或崎岖地形）。这些特征影响组织的防御系统。\n\
  \nCTI 团队将全面了解业务的运作方式，并能够识别新的安全差距并创建高效的需求优先级列表。\n\n## 网络防御影响描述\n\n准备运行环境的下一步涉及理解网络拓扑。网络拓扑是网络防御系统的重要参数。情报分析师必须分析网络拓扑，以了解步骤\
  \ 1 中定义的特征（*运行环境定义*）如何影响业务运营。本步骤旨在获取网络拓扑、网络的关键节点、网络的关键信息、潜在威胁的路径以及检测点。防御机制必须保护系统免受所有类型的威胁，无论是内部、外部还是自然的。虽然许多组织专注于外部威胁，但内部和自然威胁可能是最危险的（从恢复可能困难甚至不可能的意义上讲）。让我们检查以下场景：\n\
  \n- 想象一下，一名员工或承包商故意攻击系统，而他/她可以访问组织敏感数据。在这种情况下，防御系统可能变得无能为力。攻击成功率将高于远程攻击系统的网络罪犯。\n\
  - 想象一下，一名软件工程师无意中发布了一个存在安全漏洞的应用程序——有时是由于编程技能较差所致。此类情况会降低系统的防御强度。\n- 想象一下，数据中心内部发生火灾，服务器中包含公司的关键业务数据，或地震摧毁了整个数据中心。这又是使防御系统无能为力的另一个场景。\n\
  \n例子不胜枚举，但通过参考前述三个场景，我们可以看到内部和自然威胁不容忽视。在大多数情况下，外部威胁是全球性的但有效，因为熟练的网络罪犯出于不同和多样的动机策划它们。防御必须针对竞争对手的间谍活动、黑客行动主义者、勒索者等外部威胁采取预防措施。分析师起草一个简单的威胁描述表，如下表所示。该表提供了一个简单的模板，描述了影响防御机制的不同威胁。\n\
  \n> **重要提示**\n> *表 2.3* 中的模板信息并非详尽无遗。CTI 和内部团队必须生成一份全面、详尽的威胁列表。如果此步骤执行得当，威胁建模阶段将顺利进行。\n\
  \nCTI 分析师必须与技术团队合作创建威胁描述。这基于过去的威胁历史、行业威胁新闻或开源情报。威胁描述表是威胁建模中的主要输入之一（在 *第 6 章、网络威胁建模和对手分析*\
  \ 中介绍）：\n\n| 威胁类型 | 威胁名称 | 描述 | 展望 |\n|---|---|---|---|\n| 内部 | 恶意内部人员 | **机会：**\
  \ 只要他/她拥有访问权限，随时可能\n\n**能力：** 使用内部工具（例如与管理员相同的访问权限） | **意图：** 对公司或经理感到愤怒 |\n| 内部\
  \ | 非故意内部人员 | **机会：** 只要他/她是组织的一部分，随时可能。\n\n**能力：** 缺乏技能或注意力为外部攻击打开了大门 | **意图：**\
  \ 没有直接意图，但可能不使用安全实践方法——这被视为损害组织的意图 |\n| 外部 | 企业间谍 | **机会：** 任何打开的门都将是一个机会。\n\n**能力：**\
  \ 非常熟练或外包技能 | **意图：** 窃取商业机密和策略。访问知识产权等。 |\n| 外部 | 外国间谍 | **机会：** 任何打开的门都将是一个机会。\n\
  \n**能力：** 非常熟练且资源充足，或外包技能 | **意图：** 窃取商业机密、敏感信息并将其出售给第三方或竞争对手。 |\n| 外部 | 黑客行动主义者\
  \ | **机会：** 任何打开的门都将是一个机会（他们可能在任何地方）\n\n**能力：** 他们熟练但可能结构松散。 | **意图：** 传达信息或报复某人或某个组织。\
  \ |\n| 自然 | 地震/火灾 | **机会：** 根据自然，随时可能\n\n**能力：** 物理摧毁基础设施 | **意图：** 没有直接意图。但间接自然现象\
  \ |\n\n表 2.3 – 威胁描述表（非详尽列表）\n\nCTI 分析师还必须请求整个系统的物理地图，显示网络的主要组件。目的是从拓扑中分析网络的防御特征——包括但不限于网络设备和管理工具、系统设备（终端用户工作站）、软件和关键信息。分析师必须查看的网络拓扑中最关键的部分如下：\n\
  \n- 过滤、允许、拒绝、降低、停止或隔离系统流量以防止其到达目的地的组件——例如防火墙、IDS、IPS、ACL、Web 代理等。这些组件也被称为 *网络障碍*。\n\
  - 到达目的地的路由；即流量从特定源到特定目的地所遵循的路径。突出显示这些流量路由将有助于分析师理解和预测潜在威胁的行动方式。它被称为 **接近途径（AA）**。\n\
  - 具有管理流量流、检查数据包并在网络流量中检测异常的能力的网络组件——例如域控制器、深度数据包检查器和中央日志服务器。\n- 关键信息，即必须不惜一切代价保护的数据。这包括商业秘密、知识产权、业务计划和策略——罪犯想要的信息（也称为\
  \ *关键信息*）。\n\n通过评估网络拓扑，CTI 团队将评估网络障碍的位置及其对流量路径的影响，以深入了解安全态势和可能的威胁检测点。网络的典型高层拓扑或架构如下图所示：\n\
  \n![](img/d47f26598025b2da017dd41fcbb6e602_62_0.png)\n\n图 2.4 – 高层网络拓扑\n\n该拓扑显示了组织的功能如何相互交互以及与互联网的交互。如果有云服务，它还显示了与它们的连接。理解网络防御的另一个重要任务是获取高层安全障碍架构和受保护的关键节点，如下图所示。这是在高层架构之上构建的：\n\
  \n![](img/d47f26598025b2da017dd41fcbb6e602_63_0.png)\n\n## 图 2.5 – 安全障碍架构\n\n安全障碍架构使分析师能够概览受保护的内容、用于保护包含关键信息的关键节点的障碍，以及潜在威胁将采取的路径来破坏防御系统并访问关键节点。内部团队必须提供诸如关键节点软件的修补频率以及关键节点上使用的操作系统（OS）等信息，以帮助构建针对特定操作系统威胁的情报。\n\
  \n虽然许多方面已放在网络组件上，但分析师需要了解用户、员工和承包商对安全防御系统的影响。分析师必须评估人员的网络安全教育水平；例如，开发安全用户及其教育水平的\
  \ Excel 模板。这些数据将用于规划和指导情报——特别是在监控用户行为时。\n\n在本小节中，我们描述了网络防御对安全的影响。我们详细说明了分析师或 CTI\
  \ 团队必须具备的不同信息，以便制定情报需求。\n\n## 当前网络威胁 – 评估\n\n准备过程中的下一步涉及威胁评估。在此步骤中，分析师与内部团队一起发现威胁攻击系统所使用的不同\
  \ TTP。应评估关键威胁以确定受损程度。此步骤旨在模拟过去网络威胁的操作及其传播方式。如果内部安全团队拥有过去的威胁模型，他们必须与 CTI 团队（或分析师）共享，以便他们在项目的情报威胁建模阶段使用它们。CTI\
  \ 团队提取威胁的特征以帮助制定行动计划。更多细节在第 6 章《网络威胁建模与对手分析》中提供。\n\n过去的威胁和历史数据应根据其攻击防御系统的能力进行分类。以下表格中显示了威胁能力的摘要：\n\
  \n| 威胁能力 | 能力类别 | 类别分类 |\n|---|---|---|\n| **攻击**：威胁攻击并破坏 CIA 之一的威胁 | • **拒绝**：威胁破坏系统可用性的威胁\
  \ | • **破坏**：威胁完全破坏可用性的威胁。<br>• **降级**：威胁在一定程度上破坏可用性（减慢系统）的威胁<br>• **中断**：威胁破坏系统正常运行的威胁。\
  \ |\n| | • **操纵**：威胁破坏系统完整性的威胁 | |\n| **收集信息**：窃取个人和敏感信息的威胁 | **凭证收集者**：威胁访问和收集敏感信息的威胁\
  \ | • **内部收集者**：通过入侵目标系统窃取信息的威胁。例如，社会工程<br>• **外部收集者**：威胁在不入侵网络的情况下窃取信息。例如，开源情报。\
  \ |\n\n表 2.4 – 威胁能力\n\n恶意软件分析结果对于评估和理解过去的威胁至关重要。本小节简要描述了通过威胁评估设置适当情报需求所需的信息。\n\n\
  ## 制定行动方案\n\n准备运营环境的最后一步包括威胁的行为范围，这些行为直接影响组织的安全系统。当前阶段有几个期望。其中最重要的一项是事件矩阵，它为情报需求生成安全陈述。为了制定切实可行的威胁行动方案，分析师必须了解其特征（在前面的步骤中详细说明）以及相关的网络拓扑。\n\
  \n一旦制定了威胁的行动方案，分析师和内部团队就可以优先考虑这些威胁，将其插入事件矩阵，然后将其用作情报需求和优先级排序任务的输入。\n\n在此步骤结束时，分析师和内部团队将了解安全态势以及威胁可能如何破坏系统。给定一个威胁及其特征，分析师应能够叠加网络拓扑并预测其对系统及其防御机制的影响程度。例如，多态威胁可以评估并利用数据库配置中的漏洞，收集凭证，在目标系统中实现持久性，或使用收集到的凭证登录未经授权的子域或网络。一旦分析师确定了此类威胁的所有行动方案，他们就可以优先考虑行动方法，例如敏感信息访问（关键）、数据库注入（关键）、持久性（主要或中等）等。\n\
  \n## 情报准备以制定情报需求\n\n在此阶段，我们假设安全团队和 CTI 分析师已充分准备运营环境，了解安全态势，并掌握将任何威胁定位在防御系统中的所有必要细节。他们可以据此制定情报需求并选择构建\
  \ CTI 产品所需的指标。准备过程将需求简化为两个任务：*验证*或*否定*威胁的行动方案。情报需求必须得到前面四个步骤的输出支持（运营环境准备、网络防御影响描述、当前威胁评估和行动方案制定），并提交战略团队审批。事件矩阵和已开发的情报需求模板显示在以下表格中：\n\
  \n| 检测点（需要了解网络拓扑） | 指标（从威胁特征中选择） | 行动方案 |\n|---|---|---|\n| 根据网络拓扑输入检测点 | 指定指标：\n\
  \n例如，IDS 警报、杀毒软件警报、向恶意目标的 HTTP 请求、恶意软件签名 | 详细说明行动方案 |\n\n表 2.5 – 事件矩阵示例\n\n分析师和内部团队使用表\
  \ 2.5 和表 2.6 以问题的形式填写所有需求。他们必须包括安全态势的所有方面，如准备阶段所涉及的——软件和硬件问题、网络变更、漏洞、TTP、团体、人员（内部和外部）以及其他行业威胁问题：\n\
  \n| 情报需求 | 优先情报需求 | 具体情报需求 |\n|---|---|---|\n| 这些团体或威胁是否可以攻击组织？ | 哪些团体（威胁、对手）可能攻击组织？\
  \ | 是否有内部或外部威胁试图访问禁止的业务部门？ |\n|  |  | 是否有来自可疑来源的电子邮件发送到内部域？这些威胁是什么？ |\n|  |  | 是否有人在社交媒体上谈论攻击组织？这些威胁是什么？\
  \ |\n| 针对组织的团体是否具有 TTP 或破坏组织的能力？ | 针对组织的威胁或团体使用的能力和 TTP 是什么？ | 是否有已知的 TTP 可能被用于针对组织？它们是什么？\
  \ |\n|  |  | 是否存在镜像组织的恶意域名？它们是什么？ |\n\n表 2.6 – 详细情报需求\n\n总之，本节解决了 CTI 周期规划和指导阶段的第一步。本节描述了如何有效地利用运营环境的准备来制定情报需求，这是一种由美国军队用于在战场上规划和指导情报的方法。这一过程已被多个组织改编并应用于网络空间。\n\
  \n\n\n## 情报团队布局与先决条件\n\nCTI 团队负责情报项目或产品的实施。它支持内部安全职能，用于分析和收集海量网络数据。因此，CTI 团队必须由能够收集、分析并理解威胁数据以在战略、技术和战术层面产生可操作情报的专业人员组成。以下是在我们之前所学内容以及行业情报分析师要求的基础上，CTI\
  \ 团队的基本先决条件：\n\n- *CTI 分析师必须了解所有情报类型；* 即战略、作战和战术。虽然我们在前几节中提到过这些，但下一节将对每种情报类型进行总结。\n\
  - *CTI 分析师必须熟悉大多数业界领先的情报工具、平台和方法。* 实际上不可能记住所有特定厂商的情报平台。但是，CTI 分析师必须掌握这些平台的整体运行原理，因为情报平台运行方式相似，包括但不限于数据收集和支持、处理和分析、报告工具、统计和恶意软件分析工具、威胁共享平台等等。平台将在下一章中介绍。\n\
  - *CTI 分析师必须知道在哪里找到情报数据并能够收集它。* 分析师必须熟悉诸如 Google Hacking、Shodan Engine、DNS 查询、网络爬虫以及一些反情报技能等工具。因此，他们必须具备良好的数据获取和收集能力。我们将在第\
  \ 7 章《威胁情报数据源》中介绍此内容。\n- *CTI 团队必须分析内部和外部数据并产生有用的情报以帮助组织做出业务决策。* 因此，CTI 分析师需要有强大的分析背景。他们也应了解业界领先的威胁分析平台。\n\
  - *CTI 分析师必须能够通过透明且专业的报告传达情报。* 因此，他们必须具备良好的写作能力。\n- *CTI 分析师必须能够告知组织任何威胁*——包括当前、潜在和零日威胁——公司可能容易受到这些威胁的影响以及如何保护自己免受其侵害。因此，他们必须具有良好的研究意识并能够独立工作。\n\
  \nCTI 团队的关键先决条件之一是*多样性*。CTI 项目需要不同的观点、意见或对情报的解读才能拥有可靠的产品。分析师必须能够为团队带来新想法。因此，至关重要的是不仅要关注技术能力，还要关注认知、创新和团队*来分析、优先排序并丰富指标以控制和遏制威胁。情报分析师会将指标与要求进行基准比较，并可以提出新指标以加强事件响应平台。\n\
  - 他们促进组织内威胁数据的分发。CTI 也可能是一个公开过程。因此，*情报分析师可以帮助在外部共享数据并与其他组织外的分析师合作。* 我们必须强调加入威胁情报共享中心或**ISACs**的重要性。\n\
  - 执行团队使用情报分析师的产品或输出来做出业务决策，例如优化系统基础设施和降低安全成本。因此，*CTI 团队也必须更接近组织的战略职能。*\n- *团队与 SOC\
  \ 团队合作，识别对业务至关重要的风险和漏洞，并监控安全系统的行为。* 在 CTI 产品（项目）开发期间，良好的威胁建模为 SOC 团队提供了他们以前没有的威胁信息。\n\
  - 由于 CTI 团队提供有关威胁的深入情报，以及当前和潜在的恶意软件趋势，*恶意软件分析是使情报团队受益的功能之一。*\n- *CTI 团队支持网络取证和威胁管理部门，帮助识别、收集和优先处理可用于不同目的的网络证据。*\
  \ 由于 CTI 具有更广泛的威胁知识范围，取证职能可以使用情报产品来创建主动测试方法。\n\n以下图表显示了情报团队在组织安全部门（风险管理和漏洞管理也可以分为两个不同的团队）中的结构和位置：\n\
  \n![](img/d47f26598025b2da017dd41fcbb6e602_71_0.png)\n\n图 2.7 – 安全领域中推荐的威胁情报位置\n\
  \n推荐*中心位置*的原因如前所述，但根据高层的情报愿景，团队可以倾向于任何安全职能。在这种情况下，它将与该特定职能密切合作以提供情报并改善安全态势。\n\n\
  ## 情报团队应用领域\n\n在企业中，情报可以在三个应用领域运行。这些也被称为情报类型或情报层级：战术、作战和战略。以下几个特征在之前的开发中已经提到过：\n\
  \n- **战略情报**：战略情报是专注于高层、非技术决策的情报。战略情报分析师直接与组织的执行团队合作。因此，他们必须对安全和威胁趋势、对手以及它们对防御系统的影响有全局的理解。分析师随后利用这些知识来影响业务决策。因此，战略情报的主要利益相关者包括执行委员会、CTO、CISO\
  \ 和 CIO。他们是情报产品的拥有者。他们做出每一个决策。\n- **作战情报**：作战情报是专注于对手和网络攻击的情报。它是一种基于行动的情报类型，集中于理解、复制和分析对手、威胁和实际攻击。因此，作战情报分析师必须能够隔离威胁和攻击，详细说明其行动过程，并\
  \ orchestrate 优先和有针对性的行动。作战情报分析师的活动范围包括威胁狩猎、漏洞和风险评估、事件响应等等。这种类型的分析师被认为是情报的前线驱动者。\n\
  - **战术情报**：战术情报是着眼于所选威胁和对手的 TTPs 及其相关 IOCs 的情报。恶意软件分析和指标丰富等活动属于战术情报的一部分。战术情报分析师必须摄取威胁的行为数据和指标以正确防御系统。战术情报的一些主要组件和利益相关者包括\
  \ SOC 分析师、**Security Information and Event Management (SIEM)**、IDS/IPS、终端、防火墙等等。战术情报还应使用疼痛金字塔来可视化用于对手活动监控的指标类型，并评估后者为跟上防御系统所需承受的痛苦。\n\
  \n> **重要提示**\n>\n> 一些 CTI 课程提供者和研究人员将战术情报细分为战术和技术情报，其中 TTPs 及其相关范围分配给战术情报，而指标及其适用范围分配给技术情报。如果你看到另一份手稿定义了四个情报领域或类别，不应感到困惑。\n\
  \n\n\n根据前面的解释，我们可以预见，一个完整的 CTI 团队必须具备这三个领域的技能组合——他们必须有一名或多名战术情报分析师、一名或多名作战情报分析师，以及一名或多名战略情报分析师。现在，我们可以得出以下结论：\n\
  \n- **一名战术情报分析师必须具备一项或多项战术安全技能：**\n  他们必须对 SOC 和 SIEM 有良好的了解。他们必须了解网络障碍物（防火墙、IDS\
  \ 和 IPS）以及终端用户工作站的运行情况。SOC 分析师、网络安全工程师、网络防御者以及防御安全专业人员（通常）都是战术情报角色的例子。\n- **一名作战情报分析师必须具备一项或多项作战安全技能：**\n\
  \  他们必须知道如何进行威胁狩猎和渗透测试。他们必须知道如何应对安全漏洞和其他事件，并且必须能够在内部和外部追踪对手。渗透测试员、黑客、取证调查员、SOC 分析师以及进攻性安全专业人员都是作战情报角色的例子。\n\
  - **一名战略情报分析师必须像战略利益相关者（或高管）一样思考：**\n  他们必须对一切都有全局视野。例如，他们必须了解全球威胁市场（通过报告、杂志等）以及数据泄露的成本（这对情报项目至关重要，因为它表明了不同数据泄露的可能原因和后果）。信息安全官是战略情报角色的一个例子。\n\
  \n## Summary\n\n本章介绍了威胁情报需求及其优先级排序。它还详细说明了使用一种称为 IPOE 的军事方法制定情报需求的最有效方法。最后，我们讨论了如何通过列出所需技能并通过为\
  \ CTI 团队选择合适的角色来构建组织的安保系统，从而构建情报团队。\n\n情报周期规划和指导阶段的第二个关键步骤是为情报项目选择平台和工具。因此，下一个章节将介绍各种情报框架、它们如何用于生成情报产品，以及如何为已定义的任务选择合适的框架。\n"
- "## 3 Cyber Threat Intelligence Frameworks\n\n组织中充斥着来自不同厂商、用于不同任务的安全工具。你可能会发现一种工具执行漏洞评估，另一种用于恶意软件分析，还有一种用于欺诈检测和数据监控。即使是普通组织也拥有良好的安全工具库，因为大多数时候，战略团队会随着需求的出现而获取新工具。然而，如果这些工具没有得到适当的集成，它们可能会形成一个复杂的生态系统，使安全追踪变得困难。这种资源混乱不仅会减缓对威胁的响应效果；它还使得难以证明整个系统的**投资回报率（ROI）**。\n\
  \n本章重点介绍常见的威胁情报框架、为 CTI 项目选择合适的框架，以及它们如何用于构建情报。我们将进一步阐述传统情报生命周期中的每个组件或步骤如何与整个项目相互作用。\n\
  \n在本章结束时，你应该能够做到以下几点：\n\n- 了解情报框架在 CTI 项目中的重要性。\n- 解释并讨论三种最受欢迎的威胁情报框架。\n- 在进行情报项目时选择首选框架。\n\
  - 将框架集成到安全生态系统中。\n\n在本章中，我们将介绍以下主要主题：\n\n- Intelligence frameworks – overview\n\
  - Lockheed Martin's Cyber Kill Chain framework\n- MITRE's ATT&CK knowledge-based\
  \ framework\n- Diamond model of intrusion analysis framework\n\n## Technical requirements\n\
  \n对于本章，未强调任何特殊技术要求。大多数用例如有必要将使用 Web 应用程序。\n\n## Intelligence frameworks – overview\n\
  \n网络威胁情报围绕对手如何运作、他们正在做什么以及能够做什么展开，同时了解他们的**战术、技术和流程**（**TTPs**）以帮助构建可靠的防御系统。然后利用这些信息做出客观的业务决策来防御系统。CTI\
  \ 并非孤立的领域；为了防御全球威胁，分析师和组织大多共享情报产品。需要一个标准框架来创建协作式网络防御环境。网络威胁框架可以被定义为威胁情报和防御的通用语言。美国政府开发了它以促进威胁活动的表征和分类，并识别对手行为的趋势和变化（https://bit.ly/35K9RTi）。因此，任何投资网络安全的组织都应使用网络威胁框架来集成这些能力并生成情报。以下部分强调了情报框架的好处。\n\
  \n## Why cyber threat frameworks?\n\n网络威胁框架提供多种通用益处，包括但不限于以下内容：\n\n- **通用语言：** 网络威胁框架提供了一种通用方式来传达和描述威胁信息。通过使用框架，两个或多个组织可以共享情报产品。例如，使用\
  \ MITRE ATT&CK 的威胁情报任务遵循一定数量的步骤，这些步骤对所有使用它的分析师都相同。\n- **一致性：** 使用网络威胁框架允许团队一致地分析威胁，促进内部和外部结果。战略、战术和技术情报部门随后可以使用这些结果来支持决策并解释威胁情报计划的输出。\n\
  - **端到端威胁分析：** 网络威胁框架允许我们监控和捕获对手的活动（生命周期），从准备到攻击识别。\n- 当分析师使用框架时，他们可以更早地发现威胁——即使对手只是进行侦察或非侵入性活动。它使他们能够对对手的行动和行为进行端到端视图（跟踪对手\
  \ TTP 的变化并促进威胁狩猎）。由于威胁行为者会投入资源发现新的系统入侵方法，因此了解其 TTP 如何演变至关重要。\n- **系统集成：** 组织投资了大量安全工具和资源。然而，这些工具有时会增加安全生态系统的复杂性，导致方案混乱和对威胁的可见性丧失。框架使我们能够集成整个安全生态系统，以在多个领域和平台上提供价值。它们还结合内部和外部数据以获得更好的情报。\n\
  - **迭代与连续性：** CTI 是一个迭代和连续的过程。因此，威胁情报框架提供了一种简单的方式来持续学习和跟踪可能影响防御系统的变量。它帮助我们无休止地监控对手的行为及其行动方式。\n\
  \n威胁情报框架在开发和实施情报计划中至关重要。在下一小节中，我们将介绍网络威胁框架架构和运行模型。\n\n## Cyber threat framework\
  \ architecture and operating model\n\n正如美国政府所述，通用网络威胁框架模型旨在通过纳入分层视角（关注网络细节）、采用结构化和记录的分类以及关注支持决策的证据来简化网络流程。它必须适应各种数据源、威胁行为者和任务。网络威胁框架架构如下图所示：\n\
  \n![](img/d47f26598025b2da017dd41fcbb6e602_78_0.png)\n\n图 3.1 – 美国政府的网络威胁框架 (https://bit.ly/35K9RTi)\n\
  \n\n\n该框架使用四步流程来捕捉对手的生命周期，从准备必要能力到制造威胁后果。四步包括准备、接触、存在和后果。每个步骤都包含一定数量的目标和待执行的任务。让我们查看每个步骤的简短描述，了解对手是如何运作的：\n\
  \n-   **准备：** 准备是对手生命周期的第一步。在此阶段，对手收集有关目标的所有相关信息并计划攻击（一次有效的侦察）。为了发动攻击，对手使用主动（网络映射和枚举）和被动方法——例如开源情报或暗网研究——对目标系统进行深入研究。根据收集到的信息，对手准备资源并开发进入下一步（接触）所需的技能。他们通过确保已获取有关目标组织所需的所有知识和信息来完成此准备。\n\
  -   **接触：** 准备之后，对手已准备好与目标系统互动，这可能是你的组织。他们通过利用在准备阶段收集到的漏洞与目标互动。这种互动主要通过使用各种行动方式（社会工程学；即鱼叉式网络钓鱼或暴力破解系统）在目标中植入恶意软件或文件来实现。一旦攻击被发起并成功，对手将获得对目标的部分或完全控制权，这是下一步。\n\
  -   **存在：** 在此阶段，对手执行任务以完全控制系统并掩盖其踪迹（隐藏其存在）。他们可以进行权限提升以获得对系统的高级访问权限并造成更大破坏。如果需要未来进入，他们很可能会在目标系统中建立持久性。现在，他们已准备好破坏系统。\n\
  -   **后果/影响：** 影响或后果是对手生命周期的最后阶段，也是对目标执行实际行动的阶段。根据在准备阶段设定的目标，对手可以拒绝访问（执行 DoS 攻击——可用性）、窃取信息并访问敏感数据（保密性），以及按其意愿修改信息（完整性）。他们甚至可以关闭系统。\n\
  \n框架应能够在对手生命周期的每个点追踪威胁。CTI 分析师或团队必须将威胁映射到框架模型以确定威胁所在位置。让我们看一下以下示例：\n\n> \"使用威胁检测器，ABC\
  \ 组织的安保团队怀疑来自特定国家的网络活动。他们发现，通过使用开源情报和暗网，过去 3 天内该国对该组织进行了大量搜索。\"\n\n> \"恶意软件分析团队发现组织正在使用的第三方应用程序中存在恶意\
  \ DLL 文件。该 DLL 连接到来自该国特定地区的 IP 地址。\"\n\n> \"ABC 公司遭到名为 Xyz 的勒索软件攻击，该勒索软件在向对手支付 1M\
  \ 兰特的款项之前，阻断了对 ABC 系统的所有访问长达 24 小时。\"\n\n前述三个示例是可能发生在任何组织的真实场景。每个实例可能来自不同的来源。假设这三个场景来自不同来源，很难关联事件并建立情报——尽管可以立即采取行动。通过使用情报框架模型，威胁分析师可以将前述示例映射到所使用的框架中，如下图所示。他们还可以参与正确的行动以直接防止或应对威胁：\n\
  \n![](img/d47f26598025b2da017dd41fcbb6e602_81_0.png)\n\n图 3.2 – 美国政府的网络威胁框架（https://bit.ly/35K9RTi）与我们的示例映射到第\
  \ 1、2 和 3 层\n\n第 1 层，网络分析师将网络事件映射到特定的对手生命周期步骤。示例 1、2 和 3 分别直接映射到准备、存在和后果阶段。\n\n\
  第 2 层，网络分析师将网络事件映射到其特定的目标。示例 1 在早期阶段被检测到。对手仍在计划攻击并获取有关组织的知识。在示例 2 中，对手已在系统中存在。隐藏和控制系统是该阶段对手的目标（因为访问已被授予）。示例\
  \ 3 对对手来说是一个成功案例。他们现在必须让组织按照他们的音乐起舞——这是一个表达他们可以进行任何行动的说法。这就是目标。在这种情况下，拒绝对服务的访问被提供。\n\
  \n第 3 层，网络分析师描述对手已使用或可能用来实现目标的行动。在示例 1 中，对手可能在收集信息 3 天后建立策略。通过此举，他们已将 ABC 组织识别为目标。在示例\
  \ 3 中，对手可能的行动是执行勒索软件并要求付款。\n\n第 4 层，网络分析师强调对手已使用或可能用来行动的情报数据。在示例 1 中，指标可能是 Maltego\
  \ 情报工具或暗网数据。在示例 3 中，数据可能是定制一种广为人知的勒索软件。\n\n目标是将每个事件映射到框架流程，有用的 CTI 项目必须能够实现这一点。网络威胁框架不是也不应取代组织现有的安全工具、方法和模型。然而，这整合了多个现有平台上的数据并将其映射到其结构。它提供了一个集中的网络监控和数据交换点。在以下章节中，我们将介绍威胁领域中使用最流行的框架。\n\
  \n## Lockheed Martin 的网络杀伤链框架\n\nLockheed Martin 的网络杀伤链是分析师用于理解和分析对手行动的流行情报框架。它由\
  \ Lockheed Martin 于 2011 年开发。网络杀伤链将网络攻击、入侵和 **高级持续性威胁 (APTs)** 映射到情报框架的结构。它源于军事方法，通过描述在战争中攻击和摧毁敌人的方法。其军事本质使其成为正确识别威胁行为者、阻止他们并迅速捕获他们的残酷而有效的框架。因此，如果情报分析师希望建立强大的防御系统，全面理解该框架至关重要。网络杀伤链回答了这样一个问题：*对手为了实现其网络目标到底做了什么？*。对此问题的答案是一组对手常用的\
  \ TTP。\n\n对手使用组织成链的流程（步骤）来策划攻击。该链具有链接的节点。为了实现目标，威胁行为者应按计划以链式结构（或按时间顺序）完成任务。因此，网络安全或情报分析师\
  \ *必须通过在流程的任何一点阻止攻击来打破链条*。根据框架的观点，攻击的成功取决于成功利用对手生命周期攻击的所有阶段。网络杀伤链使用七步流程来模拟对手的行为。它将任何（或所有）网络威胁和攻击映射到七个步骤或阶段。因此，任何攻击向量都可以使用该框架进行识别和分析。让我们查看如下图所示的模型的七个阶段/阶段：\n\
  \n-   **侦察：** 侦察始终是每次网络攻击的第一阶段。没有人攻击自己不知道的东西。对手通过对目标进行深入研究来计划攻击。他们确保收集相关信息以实现目标。在侦察阶段，对手的技巧包括使用\
  \ **开源情报 (OSINT)** 获取 IP 地址范围、域名信息、电子邮件地址、员工信息、新闻信息、网站信息，并发现面向公众的服务器。情报团队必须尝试在早期阶段检测侦察活动以建立情报并提取对手的潜在\
  \ *意图*。然而，阻止侦察活动并不容易，因为此类活动通常在组织防御系统和控制措施之外进行。\n\n\n\n- **武器化：** 网络杀伤链的第二阶段是武器化阶段。在成功收集信息后，攻击者会利用收集到的数据准备攻击。根据已采用的目标和方法，他们可能会武器化合法文档、创建恶意软件并开发不可检测的特洛伊木马。由于存在经过精心设计的恶意软件、有效载荷和用于执行高级系统攻击的漏洞利用创建工具，因此*能力*预计是存在的。*只有少数熟练的攻击者能够编程其武器以入侵系统。*\
  \ 然而，随着*威胁即服务*，即使是技术较差的攻击者也可以购买最先进的武器并发动毁灭性攻击。情报团队与内部安全团队必须对该阶段有清晰的可见性，并实施方法来检测武器化资源（包括恶意软件分析和扫描、入侵检测等方法）。\n\
  \n![](img/d47f26598025b2da017dd41fcbb6e602_84_0.png)\n\n图 3.3 – 洛克希德·马丁的网络杀伤链 (https://lmt.co/3iHGjLl)\n\
  \n- **投递：** 攻击者已准备好发动攻击。投递阶段涉及用于将恶意文件传达给目标的技术。该框架将投递阶段分为两种风格：攻击者控制的投递（攻击者管理投递；例如，使用面向公众的服务器）和攻击者释放的投递（包括钓鱼、放置\
  \ USB 闪存盘等做法）。\n\n情报团队制定阻止入侵的方法。这是链条中的一个关键步骤。如果攻击者通过此阶段，即使在后续阶段被检测到，他们也可能影响目标系统的运行。\n\
  \n- **利用：** 利用阶段是攻击者获得受害者访问权限的地方。他们利用系统漏洞进入系统。此阶段使用的技术包括利用软件、硬件和人类（社会工程学）中的漏洞。他们还可以使用*零日漏洞利用*或利用*未修补的漏洞*来获得访问权限。其他方法涉及打开恶意附件或浏览恶意网络链接。安全团队必须制定对策以防止或阻止攻击。\n\
  - **安装：** 除非操作是一次性任务，否则攻击者可能会安装持久后门以供未来入侵。这有助于他们在受害者系统中保持尽可能长时间的访问。情报团队必须制定检测后门的方法（使用诸如端点检测等方法）。攻击者在此阶段使用的一些技术包括更改注册表、添加环境变量或修改合法进程以实现持久性。\n\
  - **C2：** 一旦后门植入受害者，攻击者就会找到与之通信并接管控制的技术。网络杀伤链描述了威胁行为者用于与后门建立通信的技术。因此，防御团队可以使用对策来阻止攻击。C2\
  \ 是情报团队和防御系统可以采取行动的最后一个阶段——在此之后，只剩下眼泪了。\n- **行动：** 在此阶段，攻击者可以在目标系统上执行任何操作，从收集敏感信息到拒绝用户服务。该框架列举了一些最常用的攻击行为，包括权限提升、横向移动、内部侦察、收集和外泄数据、系统破坏、系统修改和数据损坏。在此阶段，防御者的目标是迅速检测到该行为以避免进一步损害。取证方法在此阶段用于收集有关入侵的证据（事件响应）。\n\
  \n网络杀伤链模型使用攻击者战术与可能的防御立场的比较方法。对于每个阶段，它都提供了针对相应攻击者行动的防御技术。\n\n## 用例 – 洛克希德·马丁网络杀伤链模型映射\n\
  \n**场景和目标：** 一群黑客决定在投票通过客户不满意的政策后，关闭 ABC 保险公司。他们的唯一目标是尽可能长时间地关闭业务，以迫使公司取消这些政策。\n\
  \n该团体从公共互联网上收集电子邮件地址、域名信息、IP 范围和 SSL 证书信息。他们在 LinkedIn 上找到了 IT 管理员 Vanessa 的电子邮件地址，并在\
  \ Instagram 上了解了她的生活日常。他们还发现了面向互联网的公司路由器以及公司网站，用户可以在该网站上注册保险、联系公司并留言。\n\n- Cyber\
  \ Kill Chain 映射：*侦察。*\n  **对策：** 持续收集网站访问日志以进行搜索活动，从网络管理员收集流量分析，并检测独特且可疑的反复浏览行为。\n\
  \  该团体选择 **Metasploit Framework (MSF)** 作为其工具，用于生成嵌入文档中的一组恶意软件发送给 Vanessa。\n- Cyber\
  \ Kill Chain 映射：*武器化。*\n  **对策：** 了解最常用的恶意软件生成平台，进行恶意软件分析，并识别和检测恶意软件有效载荷类型及其来源。\n\
  \  该团体准备使用两种技术来入侵系统。他们向 Vanessa 发送电子邮件，并准备了一个 USB 闪存盘，其中包含准备好的武器，将物理安装在 Vanessa\
  \ 的个人电脑上。\n- Cyber Kill Chain 映射：*投递。*\n  **对策：** 了解上游基础设施，了解人员及其角色，了解哪些信息可以被哪个用户访问，并经常进行取证重建。\n\
  \  Paul 是该团体的一员。他在一个月前与 Vanessa 成为朋友，并能够去她家拜访。投递恶意代码的一种方式是 Paul 说服 Vanessa 打开 USB\
  \ 闪存盘上的文档。或者，Paul 可以向 Vanessa 发送一封带附件的电子邮件，她会打开它。\n- Cyber Kill Chain 映射：*利用。*\n\
  \  **对策：** 对员工进行社会工程学实践培训，经常进行漏洞扫描，进行端点加固测试，并经常进行取证端点审计。\n  当 Vanessa 连接到公司网络时，恶意文件在公司系统中传播。该武器在系统上安装了后门并实现了持久性。\n\
  - Cyber Kill Chain 映射：*安装。*\n  **对策：** 安装入侵防御设备，经常审计注册表和进程，并审计端点是否存在异常文件生成。\n  Paul\
  \ 和他的团队已与植入的后门建立了反向连接，可以控制 ABC 保险系统。\n- Cyber Kill Chain 映射：*命令与控制。*\n  **对策：**\
  \ 加固网络通信（使用代理），扫描 C2 网络，并监控异常端口。\n  该团体已收集用户凭据，对数据库网络进行横向移动并外泄数据。最后，发动 DDoS 攻击以关闭公司，并附带信息说，*取消新政策，否则我们将烧毁这家公司。*\n\
  - Cyber Kill Chain 映射：*行动。*\n  **对策：** 执行事件响应，扫描并识别外泄任务，并扫描对敏感数据库或存储库的访问。\n\n这里描述的用例提供了如何将网络事件映射到网络杀伤链以及可用于破坏攻击链的可能对策技术的全局概述。这些对策并非排他性。框架和行业详细说明了我们可以使用的多种方法。CTI\
  \ 团队必须能够就杀伤链每个阶段的有效行业领先对策提供建议。现在，让我们看看如何将洛克希德·马丁的网络杀伤链集成到情报产品或平台中。\n\n\n\n## 将网络杀伤链模型整合到情报项目中\n\
  \n网络威胁情报模型例如网络杀伤链并不是安全的一个独立组成部分，而是一个需要整合到情报框架中以构建弹性防御系统的模型。在本小节中，我们将了解该模型如何应用于情报项目：\n\
  \n- **SIEM 丰富与优先级排序：** 大多数组织都有 SIEM 系统来管理安全事件。CTI 项目从不同来源收集数据并创建警报和指标。将警报和指标映射到网络杀伤链的每个阶段，有助于情报团队优先处理安全任务并识别构建弹性防御所缺少的组件。事件在杀伤链中映射的位置越高，优先级越高。例如，入侵检测系统警报和恶意软件存在警报不能同等对待，因为它们映射到不同的杀伤链阶段。最高优先级的事件必须迅速响应。\n\
  - **升级控制：** 当发生网络攻击时，会在组织内营造出不同的氛围。安全和情报团队需要确定如何处理网络威胁的升级。网络杀伤链在每个阶段评估攻击的影响程度，可指导\
  \ CTI 团队报告和升级网络事件。例如，已映射到杀伤链第七阶段的攻击必须被赋予关键优先级，并必须升级到战略团队（因为入侵者可能已经中断了业务）。映射到投递阶段的事件无需升级到战略层面，但可以在战术和技术层面处理。\n\
  - **识别安全防御中的差距并优先投资：** 使用网络杀伤链模型，情报团队可以将组织所有工具及其功能映射到模型阶段。分析团队通过指定组织是否拥有防御此类行动的工具和资源，来定义针对杀伤链每一步的潜在对抗行动矩阵。使用网络杀伤链的差距矩阵示例在下图中显示，其中包含七个\
  \ D，详见第 13 章《威胁情报指标、入侵指标和痛苦金字塔》：\n\n| 优先级排名与链顺序 | 杀伤链阶段/反击 | Discover | Detect |\
  \ Block | Disrupt | Degrade | Deceive | Destroy |\n|---|---|---|---|---|---|---|---|---|\n\
  | ↓ | Reconnaissance | × | × | × |  |  |  |  |\n|  | Weaponization | × |  |  | \
  \ |  |  |  |\n|  | Exploitation | × | × | × | × |  | × |  |\n|  | Installation |\
  \ × | × | × | × | × | × |  |\n|  | Command & Control (C2) | × | × | × | × | × |\
  \ × |  |\n|  | Actions on objectives | × | × | × | × | × | × |  |\n\nFigure 3.4\
  \ – Intelligence gap matrix using the Cyber Kill Chain\n\n基于网络杀伤链的情报差距将显示可能需要加强的安全防御领域，从而帮助安全投资（武器库中缺少哪些工具才能确保弹性防御系统？）。\n\
  \n- **评估系统的有效性和弹性：** 分析师需要记录威胁事件，并在攻击被检测、阻止或破坏的每个阶段在所选情报平台中插入标记。攻击被发现越早，缓解和反击的机会就越好。随着时间的推移，团队可以评估系统主要在杀伤链的哪个阶段检测、阻止或破坏网络攻击。这被称为\
  \ *有效性*。我们可以使用趋势或任何图形可视化来评估系统使用网络杀伤链的有效性。\n\n在任何情报和防御项目中需要解决的另一个重要问题是系统的 *弹性*。如果对手改变技术、攻击特征或策略以实现相同目标，攻击是否仍能被检测到？情报分析师必须始终预见到对手可能改变策略。如果攻击发生变化后，系统仍能在杀伤链的任何阶段检测、阻止或破坏攻击，则系统是\
  \ *弹性* 的。\n\n- **执行分析：** 分析师可以使用网络杀伤链来分析攻击（了解攻击是如何发生的、在哪个步骤被阻止以及如何被阻止）。在这种情况下，情报团队使用杀伤链的每个阶段来分析攻击。情报项目会产生大量数据，只有正确挖掘时才有帮助。杀伤链可以帮助分析师将分析分解为映射到其阶段的小部分。这确保了在执行分析任务时，对手攻击生命周期的各个方面都得到解决。\n\
  - **识别并追踪对手组织：** 网络杀伤链可以应用于情报产品，帮助组织根据其攻击结构将对手分组。当对手发动攻击时，组织将能够根据使用的 TTPs 对其组织进行分类。因此，随着时间的推移，分析多个网络杀伤链攻击会产生相似性和重叠指标，CTI\
  \ 团队可利用这些指标快速识别和分类对手。这是在把握和预测威胁行为者目标方面迈出的重要一步。\n\n洛克希德·马丁的网络杀伤链应整合到情报产品中，以提供更全面的威胁和攻击态势，并使防御系统具有弹性。在本小节中，我们了解了网络杀伤链如何改进情报项目。作为分析师，了解框架如何使用以帮助我们选择合适的模型至关重要。在下一小节中，我们将探讨网络杀伤链的好处。\n\
  \n## 网络杀伤链框架的好处\n\n洛克希德网络杀伤链在网络空间中提供了多项好处。该框架的范围超出了其技术能力——它可用于独立于来源地预测威胁。让我们看看网络杀伤链模型的一些好处：\n\
  \n- 它在整个生命周期中监控网络攻击，帮助组织在任何阶段检测和反击攻击，使防御系统更有效、更灵活。\n- 它将所有网络威胁映射到多个杀伤链阶段，有助于我们了解对手的行为。通过将行动映射到情报框架，分析师可以对每次攻击进行时间定位并制定正确的遏制方法。\n\
  - 它帮助组织确定安全基础设施的差距并提供增强防御系统的必要参数。\n- 它可定制，允许组织灵活修改模型以适应组织安全需求。\n\n多个情报平台使用洛克希德·马丁的网络杀伤链框架，提供敏捷方法以快速防御网络威胁。防御的目标是在任何阶段破坏杀伤链以阻止攻击。这是因为只有攻击通过所有链条步骤才被视为成功。因此，组织可以建立足够的情报在任何可能的时间点捕获对手。然而，攻击被检测和阻止越早，缓解和反击操作所需的精力和资源就越少。在下一节中，我们将介绍另一个流行的情报框架，即\
  \ MITRE 的 ATT&CK 知识库框架。\n\n## MITRE 的 ATT&CK 知识库框架\n\nATT&CK 知识库框架是由 MITRE 于 2013\
  \ 年创建的情报框架，用于帮助我们理解和分析对手用于入侵或攻击系统的常见战术。ATT&CK 代表 Attack, Tactics, Techniques, and\
  \ Common Knowledge。MITRE 制定了该框架来描述对手通常用来渗透系统并执行任何利用和后利用活动的方法，包括但不限于权限提升、防御系统规避等。ATT&CK\
  \ 使用通用框架概念来反映对手的攻击生命周期，从准备到后果。它从对手的角度监督攻击，同时详细说明攻击的可能目标和实现这些目标的方法。通过理解和描述对手的行为，该框架可用于检测攻击者的行动。该框架由社区维护，包含大多数对手的战术和技术。\n\
  \n\n\n## 工作原理\n\nATT&CK 分为三个技术领域：ATT&CK for Enterprise、ATT&CK for Mobile 和 Pre-ATT&CK。ATT&CK\
  \ for Enterprise 包含大多数计算机操作系统（Linux、Windows、macOS 和云系统）中对手的行为。ATT&CK for Mobile\
  \ 更多关注移动系统（Android 和 iOS）中对手的行为。最后，Pre-ATT&CK 关注的是实际攻击执行前的对手行为。MITRE ATT&CK 将对手行为结构化为\
  \ *战术* 和 *技术*，其中战术是在发起攻击时对手的目标，而技术是对手实现其战术目标的方式和方法。战术包括持久性、权限提升、数据外泄、影响等操作。因此，存在多个战术类别，每个类别都由许多技术组成。每种技术都描述了对手执行某种战术可使用的方法。战术和技术构成了企业版的\
  \ *ATT&CK 矩阵*，如下图所示：\n\n![](img/d47f26598025b2da017dd41fcbb6e602_92_0.png)\n\n图\
  \ 3.5 – 企业版 ATT&CK 矩阵的说明（完整表格可查看 https://attack.mitre.org/）\n\n每列是一个战术类别。列描述了对手可在目标中发起的全局任务。每个单元格都是用于完成全局任务的技术。对手的技能、专业知识以及特定工具的可用性决定了选择技术以入侵目标的方式。从上表可以看出，ATT&CK\
  \ 提供了多个战术类别。任何安全专业人员都应能看出，这些是黑客和进攻性安全的标准步骤——从侦察到系统影响。在撰写本书时，ATT&CK 有 14 种对手战术，有效的安全分析师应了解这些战术。让我们查看可用的战术并提供每个战术的简短描述。有关每个战术和技术的更多详细信息，请参阅\
  \ MITRE 的网站（https://attack.mitre.org/）：\n\n- **侦察**：侦察侧重于对手主要用于准备攻击的技术。他们使用的技术有助于主动或被动收集信息以规避组织安全并访问系统。侦察被认为是最长的步骤，因为它利用了对手攻击周期的其他阶段。例如，通过收集目标组织的电子邮件地址，对手可以使用钓鱼技术入侵系统。在此阶段，对手可以收集的信息包括目标系统的结构、员工/工作人员、IP地址范围、域名和子域名以及电子邮件地址结构。在撰写本书时，侦察战术包含\
  \ 10 种已知且流行的技术。\n- **资源开发**：资源开发战术侧重于对手用于获取策划网络攻击所需资源的各种技术。ATT&CK 框架描述了用于创建、购买或窃取任务所需资源的方法。资源示例包括配置账户、域名、基础设施和能力。其他战术利用此步骤的结果来支持攻击。例如，假设对手想要发起钓鱼攻击，那么他们很可能会配置域名或公共IP地址（以建立与远程系统的连接）以及电子邮件地址（用于发送特洛伊木马）。目前框架为资源开发记录了六种技术。\n\
  - **初始访问：** 在收集相关信息并获取启动攻击所需的资源后，对手的下一步很可能是发起对目标系统的访问。ATT&CK 模型的初始入口描述了对手在系统内获得立足点的技术和方法。该框架回答的问题是，*对手如何获得对受害者系统的初始访问权限？*。该框架描述了在网络攻击中广泛使用的九种技术。用于获取访问的方法包括钓鱼（最广泛使用的社会工程技术）和漏洞利用（利用公开的系统弱点，例如不安全的公共\
  \ Web 应用程序）。在撰写本书时，ATT&CK 已将其框架中集成了九种初始访问技术。\n- **执行：** 执行战术是指对手的恶意代码在受害者系统中被执行时。ATT&CK\
  \ 描述了最常用的恶意代码执行方法。对手使用诸如命令和脚本框架（PowerShell、AppleScript、Python 或命令行界面）等技术在本地或远程运行代码。黑客（对手）使用多种命令执行平台在目标系统中执行恶意代码。ATT&CK\
  \ 框架提供了 10 种最流行的执行技术。\n- **持久性：** 除非是一次性任务，否则对手通常希望保持对受损系统的访问。持久性是最流行——甚至是唯一——用于在受害者系统中保持立足点的战术。ATT&CK\
  \ 框架对此描述了 18 种技术，包括注册表键执行、DLL 注入以及执行/启动守护进程。持久性是通过修改系统配置实现的。\n- **权限提升：** 对手总是希望从受害者那里获得更多。权限提升战术用于获得对受损系统的高级访问权限。ATT&CK\
  \ 描述了对手在受损系统中获得更高级别权限的常用技术。这些技术包括令牌操作、提示执行、策略修改以及许多其他方法。框架中描述了大量提升权限的方法。\n- **防御规避：**\
  \ 对手开展攻击时的最终目标是避免被检测到（保持完全匿名）。ATT&CK 描述了对手用于规避安全防御的技术。这些技术包括禁用防病毒软件、混淆和加密恶意代码以及滥用受信任的进程。该框架包含对手使用的\
  \ 30 多种常见防御规避技术。\n- **凭证访问**：凭证访问是网络攻击的基本目标之一。网络和竞争间谍活动依赖于敏感数据窃取。对手经常追逐此类信息。ATT&CK\
  \ 揭示了最常用的凭证访问技术，例如数据库转储、键盘记录、暴力破解等。例如，对手可以使用键盘记录检索管理员用户名和密码并用它们控制受害者系统。ATT&CK 描述了\
  \ 15 多种对手凭证访问技术。\n- **发现**：发现战术用于获取有关受损系统的更多知识。ATT&CK 揭示了对手分析内部系统并突出可完全控制的不同组件的技术。这些技术包括查找域名、电子邮件、应用程序、目录结构等。框架中广泛使用并描述了\
  \ 20 多种技术。\n- **横向移动**：横向移动是指在受害者系统内部导航。例如从一个子域切换到另一个子域或从一个 VLAN 切换到另一个 VLAN 的技术就是横向移动的例子。ATT&CK\
  \ 框架揭示了对手在系统中移动时常用的几种方法。\n- **收集**：收集战术涉及收集对手为实现其初始目标所需的数据。例如，对手可能会从系统中收集用户名和密码、捕获受害者的屏幕活动或收集其击键。ATT&CK\
  \ 揭示了可以帮助对手收集内部信息的技术。数据收集的一种知名技术是 **中间人 (MITM)** 攻击。\n- **C2**：C2 战术涉及使用对手的技术与受损系统建立连接。有几种已知方法可用于在不被检测到的情况下实现对受害者的控制——例如使用加密通道和代理技术等技术。ATT&CK\
  \ 揭示了其中几种技术，以帮助组织构建可靠的防御系统。\n- **数据外泄**：数据外泄技术用于从系统中窃取信息。对手收集数据，对其进行加密、压缩，并以不可检测的方式将其带出系统。ATT&CK\
  \ 框架描述了许多数据外泄方法（使用流量隧道、Web 服务等）。\n- **影响**：影响涉及用于操纵、中断或破坏受害者的方法。对手可以发起 **拒绝服务 (DoS)**\
  \ 攻击或加密受害者的数据以勒索赎金。ATT&CK 框架揭示了最常用的对手影响技术。\n\n\n\n除企业行为矩阵外，ATT&CK 框架还描述了移动矩阵，其中包含之前的大多数战术及其相关技术。对于每种战术和技术，框架都提供了详细的描述以及如何缓解此类攻击。矩阵导航架构如下图所示：\n\
  \n![](img/d47f26598025b2da017dd41fcbb6e602_96_0.png)\n\n图 3.6 – ATT&CK 矩阵导航架构\n\n\
  为了将此处描述的框架的理论概述与实际用例结合起来，我们将查看一个可以映射到真实网络攻击场景的模型。\n\n## 用例 – ATT&CK 模型映射\n\n**场景和目标：**\
  \ 攻击者受竞争对手雇佣，窃取 ABC 公司的商业信息。由于这是商业间谍活动，攻击者获得了 orchestrate 攻击所需的资源。攻击者在未被检测到的情况下通过了信息收集和收集阶段。在信息收集阶段，攻击者在\
  \ LinkedIn 上遇到了 joe@abc.co.za。Joe 是足球迷：\n\n- 战术映射：*初始访问。*\n\n他们对组织发起攻击。他们选择使用 spearphishing（社会工程）通过系统管理员的电子邮件访问系统。他们准备并武器化（嵌入恶意代码）一份优秀的\
  \ PDF 格式体育期刊。该期刊通过伪造的发件人电子邮件地址发送给 Joe。\n\n- 技术映射：*网络钓鱼。*\n\n网络钓鱼通过电子方式传递恶意木马、链接或服务。在这种情况下，攻击者可以使用三种提到的网络钓鱼方法中的任何一种来访问系统。分析师将该活动映射到\
  \ ATT&CK 框架的网络钓鱼技术。\n\n- 子技术（方法）映射：*定向网络钓鱼附件。*\n\nJoe 收到一封伪装成 Alice 的电子邮件，发件人使用合法的\
  \ ABC 公司电子邮件域（alice@abc.co.za）。电子邮件包含一份 PDF，内容为“Possible transfer of Kylian Mbappe\
  \ to Liverpool FC. Hey Joe, did you see the latest rumor about the arrival of Mbappe\
  \ to Anfield? Check the attached article.” 分析师将该活动映射到使用电子邮件附件的 spearphishing。Joe\
  \ 兴奋地打开了附件并阅读了文章。系统被攻破。\n\n## 如何检测此类攻击\n\nATT&CK 框架建议使用入侵检测系统、电子邮件网关或爆破室来保护并检测使用恶意附件的网络钓鱼程序。然而，由于此类保护基于流量模式和数据包分析，攻击者可能会使用防御规避技术来绕过网络障碍。因此，它强烈建议使用防病毒软件（自动扫描带附件的电子邮件）、端点和网络感知（以检测\
  \ PDF 文档何时被打开）。\n\n## 如何缓解此类攻击\n\n框架为此类攻击提供了缓解措施。缓解措施包括安装防病毒软件（以隔离或删除恶意文件）和入侵防御设备（以阻止可疑活动）。它还包括基于\
  \ Web 的内容限制（阻止某些扩展并扫描附件的压缩文件）以及用户培训（培训用户检测可疑的电子邮件附件和链接）。如果 Joe 细心一点，他就会注意到这个骗局。\n\
  \n前述用例展示了 ATT&CK 框架如何将攻击者活动映射到战术和技术，并提供应对每种战术和技术的方法。通过查看缓解和检测步骤，目标组织可以评估并加强其防御系统。现在，让我们看看分析师和安全团队如何使用\
  \ ATT&CK 矩阵来构建情报。\n\n## 集成 MITRE ATT&CK 框架\n\nMITRE ATT&CK 框架在攻击者行为方面非常丰富，可以在许多方面支持组织的安全基础设施。通过采用该框架，组织可以执行以下操作：\n\
  \n- **模拟攻击者行为：** 他们可以使用威胁情报来了解攻击者的行为并检查安全系统的连贯性。他们还可以将每个威胁映射到框架中描述的战术和技术。\n- **执行红队操作：**\
  \ 即使组织从未被攻击过，也可以通过对组织进行道德黑客攻击并评估每个 ATT&CK 战术和技术对安全基础设施的影响来建立预防性安全系统。这是测试防御系统强度最好的方法。\n\
  - **执行分析：** 跟踪威胁活动并使用分析可视化威胁洞察至关重要。组织可以使用 ATT&CK 框架来分析、分组并发现可疑活动模式。\n- **评估防御线的差距：**\
  \ 通过使用 ATT&CK 框架，情报分析师可以识别安全系统的漏洞。这可以通过查看有多少以及哪些战术可以轻松渗透组织的防御系统来实现。ATT&CK 还可以帮助评估武器库中可用的安全资源。\n\
  - **评估 SOC 系统：** ATT&CK 系统暴露了防御的弱点。使用框架中可用的战术和技术，分析师可以快速评估 SOC 的有效性。SOC 系统检测威胁和响应入侵的速度有多快？\n\
  - **丰富情报项目**： MITRE 的 ATT&CK 框架会持续更新。因此，新的战术和技术会迅速添加到框架中，帮助组织获得新的指标并改进安全监控。\n\n\
  MITRE 的 ATT&CK 框架可以以两种方式集成到安全系统中：*手动* 和 *自动*。它也可以集成到 SIEM 系统中。从不同来源收集的数据被收集和分析以检测潜在威胁，并映射到\
  \ ATT&CK 框架以帮助我们了解攻击者的行为。它也可以集成到端点检测和响应系统中，以确定攻击者在攻击的哪个阶段处于何种位置。通过了解此类信息，分析师可以预测攻击对防御系统的影响。它也可以集成到云安全系统中。现在我们知道了如何使用\
  \ MITRE 的 ATT&CK 框架，让我们来看看它的一些好处。\n\n## ATT&CK 框架的优势\n\nMITRE 的 ATT&CK 框架为组织和全球安全界从技术和非技术角度提供了许多好处。以下是使用该框架的一些好处：\n\
  \n- 该框架在攻击者战术方面非常丰富，使其成为网络空间中使用最广泛的安全框架之一。\n- ATT&CK 不仅用于情报项目，也用于跨 IT 部门操作。这意味着每个安全功能都可以独立使用该框架来映射、分析和响应威胁。\n\
  - ATT&CK 是一个开源框架，由安全社区维护。它维护着有关攻击者组织和已进行的网络战役的通用信息库。\n- 它提供了一个集中环境，有助于创建、收集、共享和管理信息。\n\
  - 任何人、任何组织都可以使用它。\n\nMITRE 的 ATT&CK 在网络安全领域被广泛使用，并且由于其全面且持续更新的攻击者行为库，在 CTI 环境中建立了强大的声誉。作为情报分析师，必须了解\
  \ ATT&CK 框架的优势。接下来，我们将介绍入侵分析的钻石模型。\n\n## 入侵分析框架的钻石模型\n\n入侵分析的钻石模型（https://bit.ly/3iHC6Hn）是另一个流行的情报框架，用于理解攻击者的行为和分析入侵。该模型易于表示，但与\
  \ Lockheed Cyber Kill Chain 和 MITRE ATT&CK 框架相比，应用起来更复杂、更强大。该框架将入侵活动表示为四个核心要素的函数：*攻击者*、*基础设施*、*能力*\
  \ 和 *受害者*。这些要素在边缘上相互连接，以以钻石的形式表示它们之间的关系，因此得名钻石模型。该模型的简化形式如下图所示。钻石模型基于入侵分析的科学方法，为分析师提供有效的文档、综合和关联网络事件。该模型使用逻辑，即每个网络\
  \ *事件* 都涉及一个 *攻击者*，该攻击者利用 *能力* 通过某些 *基础设施* 来破坏 *受害者*。*事件* 与攻击者针对目标执行的行动相关联：\n\n\
  - **元特征**\n  - 时间戳\n  - 阶段\n  - 结果\n  - 方向\n  - 方法\n  - 资源\n\n![](img/d47f26598025b2da017dd41fcbb6e602_100_0.png)\n\
  \n图 3.7 – 入侵分析简化钻石模型\n\n如前图所示，钻石中的链接代表核心要素之间的主要连接和关系。CTI 团队或分析师使用这些关系来分析和创建网络威胁情报。然后元特征用于分析、分组和规划网络威胁分析。它们有助于在攻击之前、期间或之后构建事件。因此，它们在使用该模型进行入侵分析时至关重要。现在，让我们看看该模型的工作原理。\n\
  \n\n\n## 工作原理\n\n每当检测到、识别到或阻止某个事件时，CTI 团队或分析师会填充钻石的顶点。分析师随后沿着钻石的边进行枢转，以显示有关威胁（或事件）的信息。后者用于揭示事件的能力、受害者以及使用的基础设施。在标准攻击中，攻击者执行一系列操作以达到目标，而钻石模型中的事件代表该过程的一个阶段。因此，完整的攻击由多个按顺序排列的事件组成，这些事件由攻击者与受害者的连接标记。按顺序排列的事件用于生成\
  \ *activity threads*，它们描述了攻击的流程。\n\n分析师利用这一系列事件和生成的活动线程对攻击进行全面画像。只有在此之后，集成框架才能提供缓解措施。攻击流程促进了事件的相关性，以发现攻击者活动和动机，然后可用于开发\
  \ *activity groups*。所有钻石元素（核心元素和元特征）的组合被称为模型特征，并且存在于每个事件中。\n\n每个特征都被赋予一个 *confidence\
  \ value*，该值取决于其他参数，例如数据的事件来源、CTI 分析结果、数据的准确性等。给定一个特征，$F$，和一个置信值，$\\sigma_F$，一个事件，$E$，可以表示如下：\n\
  \n$E = ((F_1, \\sigma_{F1}), (F_2, \\sigma_{F2}), (F_3, \\sigma_{F3}), \\dots, (F_n,\
  \ \\sigma_{Fn}))$\n\n这里，$n$ 是特征的数量。函数元组的典型示例可以是 `adversary`、`capability`、`victim`、`infrastructure`、`timestamp_start`、`timestamp_end`、`phase`、`result`、`direction`、`methodology`\
  \ 和 `resources`，以及它们各自的置信值——钻石模型的基本特征。然而，为了获得更深入的见解和分析灵活性，可以引入额外的特征，例如 IP 信息、域名详情、所涉及的应用等，以嵌套元组的形式呈现。模型元素特征的图形表示如下图所示：\n\
  \n- **元特征**\n- 时间戳\n- 阶段\n- 结果\n- 方向\n- 方法论\n- 资源\n\n![](img/d47f26598025b2da017dd41fcbb6e602_101_0.png)\n\
  \n图 3.8 – 入侵分析的扩展钻石模型\n\n该模型建立了攻击者与受害者之间社会和政治层面的关系。这得到了这样一种逻辑的支持：攻击者与受害者之间总是有关系的。连接可以是直接的也可以是间接的，并由攻击者的社会政治目标驱动（为市场利润进行的企业间谍活动、申诉、为乐趣等）。攻击者-受害者关系在钻石模型中至关重要，因为它有助于回答关键问题，例如为什么攻击者针对此受害者？攻击者是否针对了更多受害者？所有受害者是否有共同点？这些问题的答案提供了对攻击的更深入了解。例如，识别共享威胁空间中的受害者（具有相似特征的受害者）对模型至关重要，因为它有助于制定缓解策略。\n\
  \n它还将基础设施与能力之间的关系设定为技术关系。这种关系对模型也至关重要，因为它将技术（工具和技术）与基础设施（物理或逻辑的受害者环境）联系起来。\n\n使用钻石模型时，集成框架的两个最关键的分析任务是填充钻石的顶点以及通过核心特征进行枢转以提取和发现数据元素。枢转是该模型的一大优势，应适当进行以暴露攻击者操作。现在，让我们看一个用例，了解钻石模型如何用于分析威胁（该用例在钻石模型的原始论文\
  \ at https://bit.ly/3iHC6Hn 中有详细说明）。\n\n## 用例 – 入侵分析的钻石模型\n\n**场景和目标**：未知攻击者成功在\
  \ ABC 保险系统中植入后门并建立连接以控制受损系统。扫描系统后，安全团队检测到持久性恶意文件，并决定使用钻石模型分析入侵。\n\n分析师或集成框架填写钻石的特征，包括攻击者、受害者、能力\
  \ 和 基础设施：\n\n- 1. 分析师围绕受害者进行枢转以发现恶意软件。这包括分析受害者系统是否存在潜在威胁。\n- 2. 分析师随后再次围绕技术对钻石进行枢转，以揭示恶意文件的通信方法论。这等同于建立能力与基础设施之间的关系。\n\
  - 3. 下一次枢转用于揭示事件的 IP 地址和其他元素。这是通过将攻击者连接到正在使用的基础设施（恶意文件）实现的。这被添加到基础设施-攻击者边。\n- 4.\
  \ 对发现进行分析以了解攻击的范围（受影响的主机、资产、资源等）。这是通过基础设施与受害者之间的关系实现的。\n- 5. 然后对钻石进行分析以提取攻击者的信息及其操作方法。这些步骤如下图所示：\n\
  \n![](img/d47f26598025b2da017dd41fcbb6e602_103_0.png)\n\n图 3.9 – 入侵分析的钻石模型 – 提取攻击者信息和操作模式\n\
  \n钻石模型生成情报，然后可将其输入到另一个框架如 Cyber Kill Chain 以构建更好的防御系统。尽管是手动的，该模型由于其稳健的实证方法，在处理威胁信息方面提供了高准确性。在本小节中，我们研究了钻石模型的基本运行模式。在下一小节中，我们将研究如何将其集成以提供情报。\n\
  \n## 将钻石模型集成到情报项目中\n\n钻石模型可以集成到情报项目中，以帮助我们使用入侵的四个核心元素对威胁和攻击进行建模。它通过研究钻石特征之间的关系来链接和关联网络事件。以下几点解释了将模型与情报产品集成的好处：\n\
  \n- **知识差距识别：** 钻石模型要求分析师记录系统中发生的每个事件。因此，它提供了大量可用于分析以识别安全基础设施漏洞的信息。\n- **分析改进：**\
  \ 通过研究攻击流程（activity thread），钻石模型以其实证方法改进了入侵分析。它不仅使用攻击元素的事实，还使用分析支持的假设来支撑决策。对于每个入侵问题，都会生成、记录和测试假设。它还可以集成机器学习以揭示攻击者的数据模式。\n\
  - **与 SIEM 集成以增强指标：** 大多数 SIEM 和 SOC 系统通常只使用技术指标。钻石模型通过添加非技术、行为和概念指标来扩展指标范围，这有助于自动化系统检测事件的方式。例如，在传统的\
  \ SIEM 中，攻击者的 IP 地址被视为常规指标。然而，使用钻石模型，IP 地址代表更多内容（攻击者类型、附属的潜在组织、受害者类别等）。\n\n在 *第\
  \ 5 章，目标设定、CTI 策略程序和实际用例* 中，我们将研究一个实际用例，其中钻石模型已集成到情报产品中以分析入侵活动。在下一小节中，我们将总结入侵分析钻石模型的总体好处。\n\
  \n## 钻石模型的好处\n\n钻石模型提供了多项好处，并在网络安全环境中得到广泛使用。其科学方法使其成为一个稳健可靠的情报框架，可应用于项目：\n\n- 该模型易于使用，因为入侵分析中的参与者数量少于其他框架（整个模型围绕四个基本元素展开）。\n\
  - 钻石模型提供了全面的网络事件文档记录策略、威胁概览和事件自动关联。这使其易于任何分析师使用。\n- 它可以集成情报用于实时网络防御并自信地对攻击者活动进行分类（它逐步纳入知识以构建适当的网络保护情报结构）。\n\
  - 一旦情报正确集成到钻石模型中，它可以利用分析能力预测攻击者操作并生成缓解程序。\n- 由于其逻辑方法，它在分析有效性、熟练程度和精确度（以及准确性）方面引入了许多改进。\n\
  \n\n\n它可以与 Cyber Kill Chain 模型一起使用。这两个模型高度互补，因为 Cyber Kill Chain 将对手的行为视为一条链，直接关注效果（任务）。另一方面，Diamond\
  \ 模型则生成执行 Cyber Kill Chain 各阶段所需的知识（情报）。\n\nDiamond 模型可以集成到任何情报项目或产品中，以加强防御系统并了解对手的运作方式。它以钻石形状围绕所有入侵任务的原子元素（核心）旋转。威胁情报分析师使用此模型来调查和发现网络威胁。\n\
  \n## 摘要\n\n本章介绍了优秀威胁分析师应了解的最普遍的威胁情报框架。我们解释了威胁情报框架的一般概念，以及为什么将其集成到网络威胁情报计划中很重要。分析师应更多地了解这些框架，以便为情报任务选择最合适的框架。然而，在选择情报框架时可以考虑一些参数。更实用的参数包括框架对威胁分析的深入程度、框架的范围（它涵盖哪些类型的威胁——云、企业、移动？）、框架更新以适应新威胁的频率、将其集成到威胁情报计划中的难易程度，以及理解其整体结构的难易程度。在下一章中，我们将回顾威胁情报的技艺和标准。\n"
- "## 4 网络威胁情报技艺与标准\n\n与其他任何计划一样，**网络威胁情报 (CTI)** 需要方法和技能来帮助安全分析师实现其预期目标。为了确保对网络威胁的协同响应，网络安全社区制定了组织可以遵循的技术（技艺）和标准，以在\
  \ CTI 流程中实现一定程度的统一。**CTI 技艺**提供了进行情报评估的方法和技能，而**标准**则提供了一种共同的方法（称为 *规范*）来应对威胁。本章使用这两个术语来指代共同的\
  \ CTI 语言。\n\n本章探讨 CTI 的**分析技艺**和流行的标准，这些标准有助于创建服务水平模型，以确保 CTI 计划遵循正确的程序（即在交付给消费者之前，计划符合标准）。\n\
  \n在本章结束时，您应该能够做到以下几点：\n\n- 了解并解释情报分析技艺是什么\n- 了解并讨论 **情报界指令 (ICD) 203** 中定义的分析标准\n\
  - 了解并讨论 **结构化威胁信息表达 (STIX)** 标准及其在 CTI 中的应用\n- 了解并讨论 **可信自动化指标信息交换 (TAXII)** 标准及其在\
  \ CTI 中的应用\n- 了解 **空军指令 (AFI) 14-133** 及其在 CTI 中的应用\n\n在本章中，我们将涵盖以下主要主题：\n\n- 情报分析技艺的基础\n\
  - 了解并将 ICD 203 适应到 CTI\n- 了解 STIX 标准\n- 了解 TAXII 标准\n- CTI 的 AFI 14-133 技艺标准\n\n\
  ## 技术要求\n\n对于本章，没有突出显示任何特殊技术要求。大多数用例如有必要将使用 Web 应用程序。\n\n## 情报分析技艺的基础\n\n情报分析技艺提供了进行威胁情报评估的方法。它被用作理解情报分析和最大限度减少\
  \ CTI 流程中错误 *通用* 且 *共享* 的语言。了解情报分析技艺对于组织和政策制定者至关重要，因为它为创建衡量威胁情报计划的标准提供了指导。本节采用的情报分析技艺基线改编自美国\
  \ **中央情报局 (CIA)** 的分析技艺笔记汇编（https://bit.ly/3K4WAY1）。CIA 的分析技艺笔记汇编强调了该机构如何支持情报消费者。CTI\
  \ 分析师在一定程度上利用这一 CIA 模型来开展有效的威胁情报计划。有效的 CTI 计划将加强组织的<|message|> 安全态势并支持更好的安全政策。改编为\
  \ CTI 的 CIA 情报分析技艺笔记不构成标准，而是进行 CTI 计划时应考虑的一套技术和流程。*CTI 改编* 的情报分析技艺以 10 条笔记呈现，总结如下。\n\
  \n### Note 1 – 处理 CTI 消费者的利益\n\n改编自原标题 *Addressing US Interests in Directorate of\
  \ Intelligence Assessments*，本条强调 *定义* 和 *捍卫* **消费者利益**。CTI 计划是为他人（使用它们的组织和个人）制定的。CTI\
  \ 的最终目标是使组织意识到网络威胁并增强其整体安全态势。因此，CTI 分析师必须了解组织的安全需求并将其转化为相关、可操作的要点。CTI 团队在进行威胁情报计划时必须维护\
  \ CTI 消费者的利益。\n\nCTI 消费者的利益在组织内部可能很广泛，因为不同的安全职能可能对威胁情报有不同的期望。因此，威胁情报分析师必须确定 CTI\
  \ 计划的主要利益相关者并了解他们的期望。这将使 CTI 分析师（或团队）能够直接解决每个消费者的需求。处理 CTI 消费者的利益是 CTI 需求的关键组成部分，如\
  \ *第 2 章、需求与情报团队实施* 中所讨论的那样。这一首条技艺笔记的另一个重要方面是，CTI 分析师应了解消费者对威胁情报的立场。换句话说，他们必须评估消费者的威胁情报意识水平或\
  \ CTI 成熟度。消费者的 CTI 立场有助于规划和实施正确的方法和技能来满足其利益。例如，对 *Level 3*（具有先进威胁情报结构的消费者或组织）、*Level\
  \ 2*（具有中等威胁情报结构的消费者或组织）和 *Level 1*（威胁情报结构低或无的组织，例如初创公司）组织的 CTI 方法不应相同。\n\n在进行 CTI\
  \ 计划、设计和开发威胁情报标准或将威胁情报集成到业务中时，消费者（终端用户）应处于运营的中心。所有事情都应以促进消费者的业务运营为目的。CTI 分析师应提出这个关键问题：*消费者将从中获得什么？*\
  \ 用于进行情报的方法还必须适应消费者利益和情报需求的变化，因为这些需求可能随着新业务需求或法规的变化而随时间推移而变化。\n\n### Note 2 – 访问与可信度\n\
  \n将可操作的威胁情报集成到业务流程中使用的方法必须对消费者（组织和个人）*可靠* 且 *透明*——这在 CTI 分析师和消费者之间建立了信任。CTI 分析师旨在说服消费者威胁情报对他们有益，从而与第一条笔记（即\
  \ *处理消费者利益*）建立联系。\n\nCTI 应基于事实和数据来支持安全决策。因此，CTI 分析师必须通过实施可靠的威胁情报计划来赢得消费者的信任。他们必须在该领域成为专家。他们必须讨论用于塑造威胁情报输出以进行战略、战术和运营安全决策的数据、假设、流程、结构和分析。专业知识和良好工作带来可信度。\n\
  \nCTI 消费者也可以利用这一情报技艺笔记来评估 CTI 计划的政策、标准和输出。例如，他们可以询问 CTI 计划是否支持决策制定或是否有助于识别安全基础设施中的差距。\n\
  \n### Note 3 – 假设的表述\n\n分析方法必须详细说明威胁情报计划开发中使用的所有 *假设*。CTI 分析师使用的假设必须基于合理的推理，并且在需要时应易于辩护。\n\
  \n在 CTI 计划开始时并在做出技术承诺之前，CTI 团队必须定义 *关键驱动因素*（CTI 需求、需要保护的资产、需要交互的安全部门、消费 CTI 计划前的估计时间等）及其假设。对于每个驱动因素的假设，CTI\
  \ 分析师必须准备相关论据来捍卫其可信度。\n\n就威胁情报假设而言，分析师可能有不同的方法和结论。然而，他们必须基于事实、逻辑和精确性做出决策。假设容易出错，但对\
  \ CTI 计划方向的塑造很重要。因此，CTI 分析师应研究所有假设（基于逻辑和专业知识）和推定（基于证据），以进行稳健的分析评估。消费者的政策制定者也可以利用\
  \ CTI 分析师做出的假设来创建安全指南。\n\n\n\n## Note 4 – 展望\n\nCybersecurity operations can be\
  \ unpredictable and complex because adversaries can create advanced attack methods\
  \ (for example, **Advanced Persistent Threats – APTs**). -> 网络安全运营可能难以预测且复杂，因为对手可以创建先进的攻击方法（例如，**高级持续性威胁\
  \ – APTs**）。\nA CTI analyst should always be on the lookout to ensure that their\
  \ consumers (customers or organizations) do not become victims – they must be aware\
  \ of what is happening or could happen – **knowing the threat landscape**. -> CTI\
  \ 分析师应始终保持警惕，以确保其消费者（客户或组织）不会成为受害者——他们必须了解正在发生或可能发生的事情——**了解威胁态势**。\nThreat intelligence\
  \ is based on evidence collected from different sources. -> 威胁情报基于从不同来源收集的证据。\n\
  Therefore, it is crucial to leverage the data and assess the defense mechanism.\
  \ -> 因此，充分利用数据并评估防御机制至关重要。\nFor example, the CTI team or analyst can use the collected\
  \ intelligence data (in the form of published reports, malware data, collective\
  \ intelligence data, and more) to explore past threats and predict future threats.\
  \ -> 例如，CTI 团队或分析师可以使用收集到的情报数据（以已发布报告、恶意软件数据、集体情报数据等形式）来探索过去的威胁并预测未来的威胁。\nIn *Chapter\
  \ 9, AI Application in Cyber Threat Analytics*, we look at some methods used for\
  \ proactive threat defense. -> 在*第 9 章，网络威胁分析中的人工智能应用*中，我们探讨了一些用于主动威胁防御的方法。\n\n\
  With **machine learning** (**ML**) and **artificial intelligence** (**AI**), organizations\
  \ can use advanced analytics models to predict threats and attacks. -> 借助**机器学习**（**ML**）和**人工智能**（**AI**），组织可以使用高级分析模型来预测威胁和攻击。\n\
  However, AI and ML should not be considered standalone technologies for threat intelligence.\
  \ -> 然而，AI 和 ML 不应被视为威胁情报的独立技术。\nThey must be combined with threat analytics and\
  \ human expertise to be effective. -> 它们必须与威胁分析和人类专业知识相结合才能发挥效用。\nPolicy makers\
  \ can leverage the threat landscape and the predicted threats to implement stronger\
  \ security and data protection policies. -> 政策制定者可以利用威胁态势和预测的威胁来实施更强的安全和数据保护政策。\n\
  And organizations can leverage CTI's advanced analytics capabilities to address\
  \ current and future threats through the following question: *How is threat intelligence\
  \ protecting the organization from current and future threats?* -> 而组织可以通过以下问题利用\
  \ CTI 的高级分析能力来应对当前和未来的威胁：*威胁情报如何保护组织免受当前和未来威胁？*\nA CTI analyst addresses an organization's\
  \ short-term and long-term threat intelligence goals by answering that question.\
  \ -> CTI 分析师通过回答该问题来解决组织的短期和长期威胁情报目标。\n\n## Note 5 – 事实与来源\n\nThreat intelligence\
  \ relies on *evidence*. -> 威胁情报依赖于*证据*。\nEvidence comes from data collected from\
  \ different sources. -> 证据来自从不同来源收集的数据。\nThe integrity of a CTI program depends\
  \ on the data source's credibility. -> CTI 计划的完整性取决于数据源的可信度。\nAlthough assumptions\
  \ and judgment can be incorporated in threat intelligence analytics, conclusive\
  \ arguments must be based on facts. -> 尽管假设和判断可以纳入威胁情报分析中，但结论性论证必须基于事实。\nTherefore,\
  \ the CTI team must have a process to validate all data sources used in a CTI program.\
  \ -> 因此，CTI 团队必须拥有验证 CTI 计划中使用的所有数据源的流程。\nDue to the complexity of CTI operations,\
  \ the data handling process must be transparent to identify missing components that\
  \ can lead to analytics gaps. -> 由于 CTI 运营的复杂性，数据处理流程必须透明，以便识别可能导致分析差距的缺失组件。\nThe\
  \ transparency of facts and sources increases an organization's confidence and trust\
  \ in the CTI output result. -> 事实和来源的透明度增加了组织对 CTI 输出结果的信心和信任。\nIn other words,\
  \ provide as many sources of information as possible. -> 换句话说，提供尽可能多的信息来源。\n\nThe\
  \ CTI team (or analyst) must use industry best practices to handle and validate\
  \ data sources. -> CTI 团队（或分析师）必须使用行业最佳实践来处理和验证数据源。\nPolicy makers should use the\
  \ *Facts and sourcing* tradecraft note to document the best practices analysts should\
  \ use for effective intelligence solutions. -> 政策制定者应使用*事实与来源* tradecraft 注释来记录分析师应为有效情报解决方案使用的最佳实践。\n\
  The original tradecraft notes (as in the CIA's compendium of analytic tradecraft\
  \ notes) provide guidelines that can be used to authenticate intelligence sources\
  \ and help intelligence analysts avoid interpretation errors. -> 原始 tradecraft 注释（如\
  \ CIA 的分析 tradecraft 注释汇编中所述）提供了可用于验证情报来源并帮助情报分析师避免解释错误的指南。\nSome of those guidelines\
  \ are adapted to CTI as follows: -> 其中一些指南已改编为适用于 CTI，如下所示：\n\n- **Precision in\
  \ what is known from the data:** A CTI analyst should (1) know the threat information\
  \ available in a data source. They should report any information gaps internally\
  \ and to the data source provider. Information can be adversaries **Tactics, Techniques,\
  \ Procedures (TTPs)**, or threat-specific indicators (IP addresses, domains, hashes,\
  \ and so on). (2) Select the correct data source for the threat intelligence program.\
  \ -> - **从数据中已知内容的精确性：** CTI 分析师应 (1) 了解数据源中可用的威胁信息。他们应内部报告任何信息缺口并通知数据源提供者。信息可以是对手的**战术、技术和程序\
  \ (TTPs)**，或特定威胁指标（IP地址、域名、哈希值等）。(2) 为威胁情报计划选择正确的数据源。\n- **Distinction of factual\
  \ data components:** A CTI analyst should (1) identify valuable indicators in the\
  \ collected data. These factual indicators can directly relate to adversaries' activities.\
  \ (2) Understand the part of the data source that is not factual. For example, TTPs\
  \ can uncover an adversary's capability and opportunity. But their true intent is\
  \ unlikely to be identified through a threat intelligence shared report. An adversary's\
  \ intent is often tracked over time. -> - **事实数据组件的区分：** CTI 分析师应 (1) 识别收集数据中的有价值指标。这些事实指标可以直接与对手的活动相关。(2)\
  \ 了解数据源中非事实的部分。例如，TTPs 可以揭示对手的能力和机会。但其真实意图不太可能通过共享的威胁情报报告来识别。对手的意图通常会随时间推移而被追踪。\n\
  - **Possibility of deception:** Adversaries can manipulate indicators and information\
  \ they share about themselves to confuse and mislead CTI analysts. For example,\
  \ threat actors (or adversaries) can include random IP addresses, domains, and URLs\
  \ in tools to hide the legitimate indicators. If facts are built on misleading information,\
  \ the CTI result will be erroneous. Therefore, a CTI analyst should benchmark shared\
  \ facts and information using different sources and platforms. Ensure data facts\
  \ remain consistent across all sources. -> - **欺骗的可能性：** 对手可以操纵他们分享的指标和信息，以混淆和误导\
  \ CTI 分析师。例如，威胁行为者（或对手）可以在工具中包含随机 IP 地址、域名和 URL 来隐藏合法指标。如果事实建立在误导性信息之上，CTI 结果将出现错误。因此，CTI\
  \ 分析师应使用不同来源和平台对共享的事实和信息进行基准比较。确保数据事实在所有来源中保持一致。\n- **Collaboration on sharing intelligence:**\
  \ Threat intelligence is a collaborative program. A CTI analyst should emphasize\
  \ the importance of CTI sharing. Policy makers should also create policies that\
  \ encourage external dissemination of threat intelligence, such as the best way\
  \ to collectively fight cybercrimes and protect organizations. -> - **情报共享的协作：**\
  \ 威胁情报是一个协作项目。CTI 分析师应强调 CTI 共享的重要性。政策制定者还应制定鼓励威胁情报外部传播的政策，例如集体打击网络犯罪和保护组织的最佳方式。\n\
  \nThe preceding guidelines describe a CTI analyst's position face-to-face with information\
  \ and data. CTI analysts must develop a strong character of assessing shared threat\
  \ intelligence information (reports, data feeds, and so on). -> 前述指南描述了 CTI 分析师面对信息和数据时的立场。CTI\
  \ 分析师必须培养评估共享威胁情报信息（报告、数据馈送等）的坚强品格。\n\n## Note 6 – 分析专长\n\nAnalytic expertise identifies\
  \ the *skills* to demonstrate intelligence knowledge. -> 分析专长确定了展示情报知识的*技能*。\nThe\
  \ CTI team must showcase their knowledge and expertise on CTI matters. -> CTI 团队必须展示他们在\
  \ CTI 方面的知识和专业知识。\nThe expertise is demonstrated through professional experience,\
  \ research, and certifications. -> 专业知识通过专业经验、研究和认证来体现。\nProfessional experience\
  \ includes past projects and success stories. -> 专业经验包括过去的项目和成功案例。\nIntelligence\
  \ expertise is not linked to personal traits only, but also professionalism toward\
  \ the organization's interests and goals (such as the on-time delivery of results\
  \ and constant collaboration with the company's teams). -> 情报专业知识不仅与个人特质相关，还与对组织利益和目标的专业性相关（如按时交付成果并与公司团队保持持续协作）。\n\
  When an organization must make its security decisions based on your threat intelligence\
  \ analysis skills, you must demonstrate your knowledge in the area and use facts\
  \ to do so. -> 当组织必须基于你的威胁情报分析技能做出安全决策时，你必须展示你在该领域的知识并据此使用事实。\n\nThe demonstration\
  \ of expertise builds credibility for the threat intelligence analyst. -> 展示专业知识为威胁情报分析师建立了可信度。\n\
  Policy makers through sound policies, need to ensure that the right people are selected\
  \ for CTI programs. -> 政策制定者通过健全的政策，需要确保选对合适的人选加入 CTI 项目。\nOrganizations should\
  \ use analytic expertise-related policies in the selection of CTI providers. ->\
  \ 组织应在选择 CTI 提供商时使用与分析专长相关的政策。\nThe main question that should drive the appointment\
  \ of a CTI provider is *how knowledgeable and skillful our prospective intel provider\
  \ is?* -> 决定任命 CTI 提供商的主要问题是*我们潜在的情报提供商有多有知识和技能？*\nAn organization must evaluate\
  \ a CTI provider's expertise based on the following four points: -> 组织必须根据以下四个要点评估\
  \ CTI 提供商的专业知识：\n\n- 1. Interpretation and assessment of technical data -> - 1.\
  \ 对技术数据的解释和评估\n- 2. Reliability of the data to support the threat intelligence program\
  \ and conclusive analytics -> - 2. 数据支持威胁情报计划和结论性分析的可靠性\n- 3. Handling of ambiguity\
  \ in the threat intelligence process -> - 3. 处理威胁情报过程中的模糊性\n- 4. A demonstration,\
  \ through use cases, of how threat intelligence will impact decision making -> -\
  \ 4. 通过用例展示威胁情报将如何影响决策制定\n\nThere should be no limit in the amount of expertise\
  \ an organization expects when selecting the right threat intelligence analyst or\
  \ provider – the more knowledgeable the analyst, the better. -> 在选择合适的威胁情报分析师或提供商时，组织对专业知识的期望不应有限制——分析师知识越丰富越好。\n\
  \n## Note 7 – 有效摘要\n\nThe *Effective summary* tradecraft note identifies the skills\
  \ to present intelligence results. -> *有效摘要* tradecraft 注释确定了呈现情报结果的技能。\nA threat\
  \ intelligence summary is a recommendation for what to do next. -> 威胁情报摘要是对下一步该做什么的建议。\n\
  An effective summary should not be boring. It must be *detailed* and *informative*.\
  \ -> 有效的摘要不应枯燥。它必须是*详细*且*信息丰富*的。\nTherefore, a threat intelligence analyst should\
  \ write threat intelligence reports for all stakeholders focusing on new findings\
  \ and the next steps. -> 因此，威胁情报分析师应为所有利益相关者撰写威胁情报报告，重点关注新发现和下一步行动。\n\nOn the contrary,\
  \ we should ensure that the audience is hooked on it. -> 相反，我们应确保受众对其产生兴趣。\nWe must\
  \ consider the audience's needs and time constraints. -> 我们必须考虑受众的需求和时间限制。\nAnd,\
  \ if possible, who they can share it with (for example, technical people or strategic\
  \ people). -> 并且，如果可能的话，他们可以与谁分享（例如，技术人员或战略人员）。\nThreat intelligence analysts face\
  \ challenges in drafting appropriate content for consumers. -> 威胁情报分析师在为消费者起草适当内容时面临挑战。\n\
  However, the most important elements to consider should be the following: -> 然而，应考虑的最重要要素应如下：\n\
  \n- 1. Presenting and highlighting the key takeaways of the CTI program -> - 1.\
  \ 呈现并突出 CTI 计划的关键要点\n- 2. Using data, facts, and evidence to support the proposed\
  \ takeaways -> - 2. 使用数据、事实和证据支持拟议的要点\n\nPolicy makers can rely on experienced threat\
  \ intelligence analysts to create standard documentation styles to facilitate information\
  \ sharing. -> 政策制定者可以依靠经验丰富的威胁情报分析师创建标准文档样式以促进信息共享。\nReporting is covered in Chapter\
  \ 14, Threat Intelligence Reporting and Dissemination. -> 报告内容在第 14 章《威胁情报报告与传播》中有所涵盖。\n\
  Intelligence reports must be actionable. -> 情报报告必须具有可操作性。\n\n## Note 8 – 实施分析\n\n\
  The Implementation analysis tradecraft note identifies the skills required to evaluate\
  \ alternatives to achieve the business objectives. -> 实施分析 tradecraft 注释确定了评估实现业务目标的替代方案所需的技能。\n\
  It clarifies the tactics that the organization or the intelligence consumers should\
  \ adopt. -> 它阐明了组织或情报消费者应采取的策略。\nThe threat intelligence analyst and the organization\
  \ should work together to implement the correct strategy. -> 威胁情报分析师和组织应共同合作实施正确的策略。\n\
  \nA CTI analyst assesses and provides the results to the consumer, who then selects\
  \ the right tactic to meet the business needs (take the appropriate actions based\
  \ on the CTI program output). -> CTI 分析师评估并向消费者提供结果，消费者随后选择合适的策略以满足业务需求（根据 CTI 计划输出采取适当行动）。\n\
  For example, implementation analysis can identify the channels and techniques used\
  \ by the adversaries and highlight how the consumer (organization or individual)\
  \ is or is not vulnerable to those techniques. -> 例如，实施分析可以识别对手使用的渠道和技术，并突出消费者（组织或个人）对这些技术的脆弱性或不脆弱性。\n\
  So, implementation analysis provides the best evidence in understanding how the\
  \ adversaries operate – it exposes the adversaries. -> 因此，实施分析提供了理解对手如何运作的最佳证据——它暴露了对手。\n\
  Therefore, a CTI analyst should give a high priority to implementation analysis.\
  \ -> 因此，CTI 分析师应高度重视实施分析。\n\n## Note 9 – 结论\n\nThe Conclusions tradecraft note identifies\
  \ the skills required to decide on the final output. -> 结论 tradecraft 注释确定了决定最终输出所需的技能。\n\
  It presents the findings after an intense and complex threat intelligence process.\
  \ -> 它在经过激烈且复杂的威胁情报流程后呈现发现结果。\nThe conclusions are essential as they define the\
  \ primary value of threat intelligence programs. -> 结论至关重要，因为它们定义了威胁情报计划的主要价值。\n\
  CTI analysts must be precise and confident in their conclusions by separating important\
  \ elements from other standard output elements. -> CTI 分析师必须通过将重要元素与其他标准输出元素区分开来，对其结论保持精确和自信。\n\
  Analysts must expose the threat patterns discovered in the data. -> 分析师必须揭示数据中发现的威胁模式。\n\
  A threat intelligence analyst's expertise is critical in the conclusions, especially\
  \ when handling inconsistencies. -> 威胁情报分析师的专业知识在结论中至关重要，尤其是在处理不一致情况时。\nBased on\
  \ the threat intelligence output, they must identify the missing pieces (gaps) in\
  \ the organization's (consumer) defense system. -> 基于威胁情报输出，他们必须识别组织（消费者）防御系统中的缺失部分（差距）。\n\
  Organizations must expect clear and precise threat intelligence verdicts to use\
  \ that to make critical decisions. -> 组织必须期望清晰而精确的威胁情报裁决，以便据此做出关键决策。\nA typical\
  \ conclusion statement could be as follows: -> 一个典型的结论陈述可以如下：\n\n*从 X 来源收集到的开源情报显示，过去\
  \ 3 个月内，公司域名在两个最受欢迎的搜索引擎上被来自同一地区的 IP 地址大量搜索。*\n\n结论对于消费者做出决策至关重要。然而，威胁情报分析师并非无所不知，他们还必须说明因知识不足而无法得出结论的情况。他们必须与其他分析师协作，在需要时填补知识差距。因此，保持透明至关重要。\n\
  \n## Note 10 – 技艺与反情报\n\n**反情报**本身就是一个令人兴奋的话题。作为情报分析技艺，它提供了*混淆*对手情报系统并识别和对抗其*欺骗*工具的技能和方法。威胁情报分析师应为消费者开展威胁情报工作。然而，他们还应做到以下几点：\n\
  \n- *帮助防范间谍活动和敏感数据盗窃*，通过识别对手（威胁行为者）可能针对的组织资产。\n- *支持分析工作以操纵对手攻击*，使之有利于组织。**欺骗**和**摧毁**是\
  \ CTI 分析师可以用来操纵对手攻击的**两种行动方案 (CoAs)**。它们将在后续章节中介绍。\n\n聪明的对手可能会隐藏其踪迹，或只暴露他们希望他人看到的方面（这被称为*欺骗*）。如果处理不当，整个威胁情报计划都可能出现错误。欺骗以两种方式实现：\n\
  \n- **否认**：这是指以情报机构无法使用的方式呈现信息。对手会完全保护数据或痕迹。它遵循*不留痕迹规则*。\n- **虚假信息**：这是指向公众呈现虚假信息。这是黑客和威胁行为者最常用的方法之一。例如，对手通过使用代理链、VPN\
  \ 和域名重定向来掩盖其位置。\n\n逃脱欺骗很棘手，需要大量努力和适当战术。CIA《分析技艺说明汇编》中的说明 10 提出了两种应对欺骗的方法：（1）通过破坏数据收集系统并注入错误信息来承认欺骗。（2）调整情报和结论性陈述的制作速度和谨慎程度。分析师必须花时间评估收集到的信息，并利用假设深入挖掘数据。分析师必须测试所有假设、假设和结论，以避免欺骗陷阱。他们可以使用一个简单的原则，例如*一切都可能是错的；让我们证明它是正确的*。必须突出收集数据中的每一个异常情况——这可以揭示隐藏或被误导的信息。\n\
  \n在本节中，我们已经看到威胁情报分析技艺是如何通过改编 CIA 的分析技艺说明而形成的（https://bit.ly/3K4WAY1）。然而，这并不是唯一的方法。每个情报提供者和分析师都可以研究和使用自己选择的技艺。然而，CIA\
  \ 的技艺说明为理解开展有效情报分析所需的技能和方法提供了极好的基础。在下一节中，我们将介绍流行的**情报界指令 (ICD)** 分析标准。\n\n## Understanding\
  \ and adapting ICD 203 to CTI\n\nICD 是美国政府为监督情报行动而制定的指南和技艺标准（https://bit.ly/2NMkjDz）。ICD\
  \ 集中包含多个标准，涉及网络情报的不同方面。本节探讨如何将*ICD 203*改编为 CTI 流程和分析。ICD 203 是一种威胁情报分析标准，管理情报产品和计划的*生产*和*评估*。该标准描述了分析师生产优质情报的责任。由于我们无法在本节中粘贴整个标准指南，我们将突出一些对全球\
  \ CTI 分析师有用的关键要素（不仅限于美国公民）。完整文件可从 https://bit.ly/2YxFThe 的链接下载。ICD 可通过以下指南改编为威胁情报：\n\
  \n- 1. **在考虑组织目标和使命的情况下将情报整合到每个分析产品中**：该指南与 CTI 的最终方向一致。CTI 计划必须与公司的目标和使命保持一致。\n\
  - 2. **维护评估方法以评估情报产品**：威胁情报分析师必须拥有标准流程来评估情报分析产品的完整性。\n- 3. **开发情报培训和在分析技能方面的教育**：威胁情报计划的产出应用于改进和增强威胁情报分析知识材料、计划、技能、能力和技艺。\n\
  - 4. **基准化敏感信息保护**：*ICD 203* 促进隐私和对情报分析产品中使用的个人信息的保护。\n- 5. **通过遵循本章情报分析技艺基线部分所述的\
  \ 10 条技艺说明来指导情报分析和分析生产**：该指南涉及用于生产情报的数据来源和方法的质量和可信度。它还涉及如何处理过程中的不确定性（知识差距、目标行业、对手的行动等）。CTI\
  \ 分析师必须在分析中保持客观，在结论上保持独立，并必须及时分享威胁情报产出，以便组织（消费者）采取安全行动。\n\n*ICD 203* 涉及三方的责任：技术和战术团队（包括分析师）、战略团队（包括决策者和政策制定者）以及\
  \ CTI 项目负责人/经理。*ICD 203* 中描述的各方责任总结如下：\n\n- *组织的<|message|> 技术和战术团队必须（1）确保标准在情报产品中正确应用，以及（2）持续对情报产品进行审查和评估。*\
  \ 它必须设定并分离情报要素的评估标准。同样，CTI 的产出必须经过审查并向相关方呈现以供决策。最后，它必须编制一份事后分析文件，详细说明挑战和经验教训，并突出可用于培训的情报组成部分。\n\
  - *组织的战略团队确保标准在威胁情报计划期间得到维护和遵循。* 其工作范围包括*（1）回答威胁分析师或 CTI 团队提出的战略问题（例如，与情报产品中分析标准的应用相关的问题），（2）通过威胁情报分析发现回应社区关切，以及（3）以透明的方式履行所有职责，以便分析师能够在没有报复恐惧的情况下提出关切并表达自己。*\
  \ 逻辑是战略团队执行业务行政流程和决策。威胁情报分析师和其他安全职能使用战略团队设定的流程、决策和政策有效地完成其任务。\n- CTI 团队负责人/经理负责（1）确保情报产品遵循分析标准（ICD），（2）指定一名分析师负责团队中与程序和标准相关的所有事宜，（3）评估情报产品以确保其符合标准，以及（4）确保标准在情报培训和技能转移期间可见。\n\
  \nICD 203 基于*情报分析技艺基线*部分中介绍的技艺骨架。我们建议您阅读完整文件以了解 ICD 203 的所有方面以及参与情报项目的各方的政策和责任。作为\
  \ CTI 分析师，您可以将 ICD 203 指南改编为您的 CTI 计划。\n\n除了威胁情报分析技艺和分析标准外，还有威胁情报共享的标准。其中一些是**结构化威胁信息表达\
  \ (STIX)**、**可信自动化指标信息交换 (TAXII)**、目前包含在 STIX 2.0 中的**网络可观测表达 (CybOX)**，以及**恶意软件属性枚举与表征\
  \ (MAEC)**。这些标准在全书中都有讨论。然而，以下各节讨论了用于共享和收集威胁情报分析的流行 STIX 和 TAXII 标准。\n\n## Understanding\
  \ the STIX standard\n\nSTIX 是一种 CTI 标准，为组织防御网络威胁提供通用语言。它使用开源、结构化、标准语言促进情报分析的共享。该标准设计为简单使用。它灵活，可以自动化并与任何\
  \ CTI 平台集成。它使用**XML**（版本 1）和**JSON**（版本 2）语言来传达威胁信息。由于 XML 和 JSON 是流行的可解析语言，STIX\
  \ 对安全分析师和工具来说高度可管理。该标准解决多个用例，例如*网络威胁分析*、*威胁指标模式规范*、*威胁响应管理*和*威胁情报共享*。让我们详细探讨这些用例。以下研究用例摘自\
  \ Sean Barnum 的白皮书（https://bit.ly/3FtJ9SE）。\n\n\n\n## 使用 STIX 进行网络威胁分析\n\nCTI 分析师从不同的数据源收集大量数据以构建情报。然而，作为情报分析师的工作并不止于此；对威胁事件进行\
  \ *分类* 以从数据中提取切实、可验证的信息至关重要。分析师会探索数据集以揭示对手的细节、威胁能力、威胁行为、行动以及更多元素。这些元素帮助分析师识别和选择将驱动安全决策的指标。在攻击场景中，CTI\
  \ 分析师将评估攻击的入口点、其传播方法（链接、端口等）、路径和目标资产，然后评估攻击是否达到了其目的。必须记录攻击的全部细节。\n\n## 使用 STIX 指定威胁指标模式\n\
  \n对于每个威胁事件，CTI 分析师都会探索数据的 *特定特征*，这些特征可能揭示关于该事件的关键信息。通过查看威胁指标模式，CTI 分析师可以发现攻击向量的可识别组件。例如，面对钓鱼攻击时，首先会分析源、作者、主题和内容（例如链接和附件）等参数。然后分析师可以使用\
  \ **MITRE ATT&CK** 和 **Lockheed Martin's Cyber Kill Chain** 等框架模型来探索攻击中表现出的 **战术**、**技术**\
  \ 和 **程序**（**TTPs**）。最后，他们可以根据之前分析的攻击创建预测钓鱼模式的威胁指标。威胁指标模式的分析在威胁狩猎和取证操作中被广泛使用。根据组织的结构，CTI\
  \ 范围可能包括或不包括威胁狩猎和取证操作等功能，以避免功能重叠。\n\n## 使用 STIX 标准进行威胁响应管理\n\n在 CTI 分析并报告威胁活动后，内部技术和战略团队必须决定\
  \ *行动*（即如何应对威胁）。根据威胁渗透的程度，对攻击的响应可以是反应式的或预防式的。*Reactive* 是指攻击已被利用。在这种情况下，**事件响应 (IR)**\
  \ 团队负责应对事件。IR 分析师进行详细分析以确定是否造成了损害或在系统中安装了恶意软件。*Preventive* 是指系统能够自动或手动检测威胁，并在攻击被利用前采取适当的行动。例如，在钓鱼攻击中，预防措施可能是自动扫描所有附件（并丢弃任何潜在恶意的链接或附件）或在将邮件转发到收件箱前验证电子邮件地址。事件响应至关重要，因为它决定了公司应对发现威胁的能力。STIX\
  \ 标准可通过以下方式用于威胁响应：（1）使用 STIX 指标对象以 STIX 语言表示和识别特定指标（例如恶意链接、恶意附件）。以及（2）使用 **STIX\
  \ 关系对象 (SRO)** 来检测和响应其他组织已识别的威胁。\n\n## 威胁情报信息共享\n\nCTI 并不是一个孤立或保密的项目。其成功取决于情报界共享威胁信息的能力（共同目标是阻止网络攻击）。为了互补性，CTI\
  \ 分析师应使用易于理解的语言与社区分享部分情报结果——这正是标准和框架发挥作用的地方。然而，应共享哪些信息取决于 CTI 团队和组织政策。STIX 允许 CTI\
  \ 社区以 XML 或 JSON 格式共享威胁指标。\n\n> **提示**\n> \n> CTI 分析师应利用 **信息共享和分析中心 (ISACs)** 等社区进行威胁情报的传播和共享。ISACs\
  \ 使最佳实践和威胁数据可供组织获取。在 *第7章，威胁情报数据源* 中，我们将探讨 ISACs。\n\nSTIX 通过探索称为 **STIX 域对象 (SDOs)**\
  \ 的 CTI 操作标准组件之间的关系来解决安全用例。它以结构化、有效和一致的方式进行。我们现在将检查 STIX v1 架构的 STIX SDOs：\n\n![](img/d47f26598025b2da017dd41fcbb6e602_121_0.png)\n\
  \nFigure 4.1 – STIX v1 架构\n\n图 4.1 所示的架构展示了八个相互关联的元素，这些元素定义了 STIX 标准的结构（https://bit.ly/2MgIJ88）。它基于流行的\
  \ STIX v1 标准。这些元素代表了网络攻击的核心概念。STIX 对每个组件提供了更多细节，我们在本章中不会详细探讨。请参考前面的链接以了解每个元素的参数。STIX\
  \ v1 SDOs 在以下要点中进行了解释：\n\n- **可观测对象：** *可观测对象* 只是 CTI 分析师所看到的内容。它们包括文件名、文件扩展名、正在运行的服务、服务请求、注册表键等基本参数。要了解更多关于\
  \ STIX 可观测对象的信息，请参考 **Cyber Observable eXpression (CybOX)** 标准（http://cyboxproject.github.io/）。\n\
  - **指标**： *指标* 是情报分析师将可观测对象与定义当前威胁上下文的信息相结合的方式。分析师通过分析特定威胁的 TTPs 来生成指标。指标会被赋予一个置信值，这决定了其在防御系统中的重要性。指标应具有\
  \ `observable`、`title`、`type`、`valid_time_position`、`TTP` 和 `confidence` 级别。STIX\
  \ 提供了创建指标模式的指南。STIX 使用 **IndEX (Indicator Exchange eXpression)** 语言来表示指标。\n- **事件**：\
  \ *事件* 是直接或间接影响组织安全性的事件的发生。事件由指标生成。当指标发出钓鱼攻击存在的警报时，会手动或自动（推荐）创建事件，安全团队需要对此做出响应。事件必须提供攻击的所有相关信息（例如先导指标、TTPs、可能影响或访问原始数据以进行更多分析）。STIX\
  \ 提供了定义事件的结构化和标准方式。\n- **TTPs**： *TTPs* 以极其详细的程度代表威胁的技术特征和行为——即 *它如何做到这一点*。它涵盖了用于策划攻击的基础设施和工具（例如\
  \ **Metasploit**、诸如 **Poison Ivy**、**Cobalt Strike** 之类的恶意软件）、进入目标的方式（例如钓鱼邮件）、扩展方式（例如用户打开文档、点击链接并执行应用程序）、传播方法（例如横向移动、多态能力）以及感染方法（例如规避障碍或创建隐蔽通道）。TTPs\
  \ 描述了整个威胁模式。TTPs 是 CTI 操作的核心。STIX 定义了标准的结构来定义 TTPs 以促进信息共享和协作。\n- **威胁行为者**：这些也被称为\
  \ *对手*。威胁行为者包括对手及其上下文信息，例如其意图、身份、过去的威胁活动、与其关联的事件或他们过去使用过的 TTPs。这有助于 CTI 分析师对对手进行画像。因此，STIX\
  \ 为情报界提供了一种标准化和结构化的方式来呈现有关威胁行为者的信息。\n- **活动**： *活动* 是具有 *相同意图* 的网络威胁的 *组*。CTI 分析师通过观察威胁行为者的信息、他们造成的事件以及\
  \ TTPs 来创建活动或对手组织。这就是为什么信息共享在 CTI 中至关重要，以便对 *网络活动*（也称为 *对手组织*）有一个全局视图。然而，并非所有对手都属于活动组。网络犯罪分子可以利用系统漏洞来策划攻击。因此，需要注意的是，你不需要成为针对性活动的一部分即可被归类为威胁行为者。STIX\
  \ 使用行业最佳实践来定义网络威胁活动。\n\n\n\n- **利用目标**：*利用目标* 与威胁行为者可以利用的系统 **漏洞** 相关。后者使用定义的 TTPs\
  \ 来破坏系统。软件和硬件中的漏洞是导致泄露的主要原因。*第 11 章，可用性安全：威胁情报作为流程的一部分*，介绍了保护软件和硬件的一些基本最佳实践。STIX\
  \ 使用行业最佳实践（如漏洞和漏洞利用数据库）定义了利用目标的结构。\n- **行动方案**：*行动方案* 与安全团队在网络事件后采取的措施相关。分析师在发现网络攻击时采取必要的措施以防止或阻止攻击。行动方案必须定义补救事件所需的步骤。STIX\
  \ 提供了呈现行动方案的标准结构，并且组织可以与社区分享它们如何应对威胁。STIX 的 *行动方案* 由以下几部分组成：（1）威胁管理中的相关 **阶段**，决定执行的是补救还是响应，（2）**类型**\
  \ 的行动，（3）行动 **描述**，（4）行动 **目标**，（5）行动 **影响**，（6）行动 **成本**，以及（7）**效能**。\n\nSTIX 提出的标准遵循某些原则，以确保网络威胁得到明确呈现，以便在共享时，CTI\
  \ 分析师拥有足够的数据来推动保护性安全措施。前面关于 STIX 元素的描述基于 STIX v1。在下一节中，我们将简要介绍 STIX v2。\n\n## 了解\
  \ STIX v2 标准\n\nSTIX 是一个不断发展的标准。该标准于 2017 年公开发布，此后已从 STIX 2.0 发展到 STIX 2.1。两个版本之间的差异来自新添加的对象、概念等（https://bit.ly/3cE02uB）。在本节中，我们将介绍全局\
  \ STIX v2。\n\nSTIX v2 标准使用 JSON 来呈现威胁组件，并引入了两类对象：**STIX 域对象 (SDOs)** 和 **STIX 关系对象\
  \ (SROs)**。所有威胁事件方面均使用 STIX 对象及其关系来呈现。在 STIX v2 中，威胁信息可以使用原生方法（JSON）呈现，也可以通过使用 SROs\
  \ 连接 2 个或更多 SDOs 以图形方式呈现。STIX v2 中代表威胁的 STIX 域对象共有 16 个。这些元素包括 STIX v1 的 8 个方面以及以下内容：\n\
  \n- **身份**：具有各自类别的团体、组织或个人（例如，个人、目标行业和运营区域）。\n- **入侵集**：这是指描述特定威胁行为者的恶意行为和资源。STIX\
  \ 试图将威胁行为者的所有属性归为一组行为和资源。\n- **恶意软件：** STIX 定义了表示恶意软件信息的标准方式，以促进威胁情报社区内的共享。\n- **恶意软件分析：**\
  \ STIX 有助于对恶意软件分析或逆向工程产生的恶意软件信息进行建模。\n- **工具：** 这是指威胁行为者用于策划攻击的资源。\n- **位置：** 这是指威胁的地理位置，表示为国家、大陆、物理地址或经纬度坐标。STIX\
  \ 有助于 CTI 对攻击位置进行建模。\n- **注释：** 此 SDO 用于对威胁进行上下文说明并提供在任何 STIX 对象中均不可用的信息。附加信息应建模为文本。\n\
  - **观点：** 它与任何其他实体创建的 STIX 对象的评估相关。观点是主观的，应谨慎对待。例如，如果与该指标关联的活动对象不可靠或存在争议，CTI 分析师可以将该指标标记为误报。\n\
  \nSTIX 还添加了报告威胁事件的结构。\n\n> **STIX v2 中的域对象变更**\n> STIX v1 中的一些域对象在 STIX v2 中已通过名称修改进行了扩展。例如，v1\
  \ 中的 TTP 对象已扩展为 **攻击模式**，其中包括威胁行为者使用的所有方法。**利用目标** 域在 STIX v2 中已扩展为 **漏洞**，范围更广。\n\
  \nSROs 定义 SDOs 之间的交互。SRO 交互可以是 *关系* 或 *目击*。当 SRO 为关系类型时，会定义 `relationship_type`\
  \ 对象并按属性名称和目标列出。当 SRO 为目击类型时，表示已观察到特定对象。以下代码示例说明了显示简单指标对象的 STIX v2 JSON 文件。三个代码块显示了可在单个\
  \ STIX 文件中存在的三种类型的恶意软件信息：\n\n```\n[\n{\n    \"type\": \"indicator\",\n    \"id\"\
  : \"indicator--ID\",\n    \"created_by_ref\": \"identity Reference \",\n    \"created\"\
  : \"Date of creation\",\n    \"modified\": \"Date of indicator modification\",\n\
  \    \"labels\": [\n        \"indicator label\"\n    ],\n    \"name\": \"Cobra Venom\
  \ Malware\",\n    \"description\": \"indicator description\",\n    \"pattern\":\
  \ \"[ file pattern ]\",\n    \"valid_from\": \"Date from which the indicator became\
  \ valid\"\n},\n```\n\n前面的代码代表指标类型的元素。该指标与特定恶意软件相关联。以下代码显示了关系类型的元素。此关系将前面的代码中的指标与最后一个代码示例中的恶意软件关联起来：\n\
  \n```\n{\n    \"type\": \"relationship/sighted\",\n    \"id\": \"relationship--ID\"\
  ,\n    \"created_by_ref\": \"Identity--reference\",\n    \"created\": \"Date of\
  \ creation\",\n    \"modified\": \"Date of modification\",\n    \"relationship_type\"\
  : \"indicates\",\n    \"source_ref\": \"indicator--ID\",\n    \"target_ref\": \"\
  malware--ID\"\n},\n```\n\n以下是最后一部分代码，显示了恶意软件类型（Cobra Venom）的 STIX 元素，该元素与第一个代码片段中创建的指标相关联：\n\
  \n```\n{\n    \"type\": \"malware\",\n    \"id\": \"malware--ID\",\n    \"created\"\
  : \"Date of Creation\",\n    \"modified\": \"Date of modification\",\n    \"created_by_ref\"\
  : \"identity--reference\",\n    \"name\": \"Cobra Venom\"\n}\n]\n```\n\n该 JSON 代码片段显示了恶意软件和指标类型的两个对象及其各自的属性。使用的指标是\
  \ indicator label。关系类型为 relationship 或 sighting。它使用 indicator--ID 作为源引用和 malware--ID\
  \ 作为目标引用，以显示它正在关联两个对象（指标和恶意软件）。以下示例代表与 Poison Ivy 恶意软件关联的文件哈希（可通过 https://oasis-open.github.io/cti-documentation/stix/examples.html\
  \ 访问）。它展示了 CTI 分析师如何对与对象关联的指标进行建模。代码分为三个块，每个块描述一种对象类型：\n\n```json\n{\n  \"type\"\
  : \"bundle\",\n  \"id\": \"bundle--2a25c3c8-5d88-4ae9-862a-cc3396442317\",\n  \"\
  objects\": [\n    {\n      \"type\": \"indicator\",\n      \"spec_version\": \"\
  2.1\",\n      \"id\": \"indicator--a932fcc6-e032-476c-826f-cb970a5a1ade\",\n   \
  \   \"created\": \"2014-02-20T09:16:08.989Z\",\n      \"modified\": \"2014-02-20T09:16:08.989Z\"\
  ,\n      \"name\": \"File hash for Poison Ivy variant\",\n      \"description\"\
  : \"This file hash indicates that a sample of Poison Ivy is present.\",\n      \"\
  indicator_types\": [\n        \"malicious-activity\"\n      ],\n      \"pattern\"\
  : \"[file:hashes.'SHA-256' = 'ef537f25c895bfa782526529a9b63d97aa631564d5d789c2b765448c8635fb6c']\"\
  ,\n      \"pattern_type\": \"stix\",\n      \"valid_from\": \"2014-02-20T09:00:00Z\"\
  \n    },\n    {\n```\n\n在前面的代码示例中，描述了第一个 STIX 对象元素。第一个元素为指标类型，描述了正在共享的入侵指标（IOC）。在\
  \ indicator_type 下提供了更多信息，即恶意软件活动。该指标用于指示 Poison Ivy 恶意软件的存在，该恶意软件由哈希键标识——pattern\
  \ 参数中显示的 SHA256 键。\n\n以下代码通过添加下一个 STIX 对象元素类型 – malware 来扩展前一个代码：\n\n```\n...\n\
  \        \"type\": \"malware\",\n        \"spec_version\": \"2.1\",\n        \"\
  id\": \"malware--fdd60b30-b67c-41e3-b0b9-f01faf20d111\",\n        \"created\": \"\
  2014-02-20T09:16:08.989Z\",\n        \"modified\": \"2014-02-20T09:16:08.989Z\"\
