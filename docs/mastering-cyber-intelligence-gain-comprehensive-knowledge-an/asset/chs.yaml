  \          OK\nExtracting  projectcobra/docs/AIbased_VR_product_strategy.docx  \
  \       OK\nExtracting  projectcobra/docs/new-solution-architecture-draft.docx \
  \    OK\nExtracting  projectcobra/docs/component-and-technologies.docx         \
