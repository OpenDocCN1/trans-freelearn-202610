  \n图 10.19 – VirusTotal 对提取的哈希指标的响应\n\n\n\n我们已识别出恶意文件（可执行文件）并确认了其恶意性质。我们知道安装了哪个文件来入侵主机。杀伤链的安装阶段已确定。下一步的分析操作是了解恶意文件和被窃取的数据。\n\
  \n## Malware data gathering\n## 恶意软件数据收集\n\n我们需要提取恶意文件组件。在三级组织（拥有成熟安全基础设施和成熟 CTI\
  \ 项目的组织）中，此操作由专门的恶意软件逆向工程团队执行。如果您无法执行此任务，可以外包技能。\n\n## Malware analysis and reverse\
  \ engineering\n## 恶意软件分析与逆向工程\n\n目标是彻底阐明恶意软件架构、设计和能力，并将其映射到杀伤链流程。任务中使用了两种方法：动态分析和代码分析方法。假设我们已收到恶意软件逆向工程团队的回复；或者，使用以下步骤通过在线沙箱工具进行基础分析：\n\
  \n- 1. 将 executable.1640.exe 文件上传至 VirusTotal (https://www.virustotal.com) 以进行反病毒静态分析。输出显示在以下截图中：\n\
  \n![](img/d47f26598025b2da017dd41fcbb6e602_322_0.png)\n\nFigure 10.20 – VirusTotal\
  \ output for the malicious executable file\n图 10.20 – 恶意可执行文件的 VirusTotal 输出\n\n\
  29 家厂商检测到该文件为恶意文件（特洛伊木马）。然而，该文件仍可绕过大量反病毒软件。该网站提供有关文件的更多信息，包括文件的基本属性、历史记录以及与恶意软件相关的名称。在\
  \ BEHAVIOR 选项卡下，工具显示恶意软件在沙箱环境中执行的操作。恶意软件打开多个文件，写入额外文件，删除 Windows 日志文件，并更改注册表。\n\n\
  - 2. 将 executable.1640.exe 文件上传至 Hybrid Analysis (https://www.hybrid-analysis.com)，这是一个在线开源沙箱工具。有关文件的更多信息被揭示。\n\
  \n最重要的事情之一是查看 Hybrid Analysis 工具中的 MITRE ATT&CK 技术映射（页面底部）。动态分析显示与可执行文件关联的 TTPs，如以下截图所示：\n\
  \n## Incident Response\n## 事件响应\n\n![](img/d47f26598025b2da017dd41fcbb6e602_323_0.png)\n\
  \nFigure 10.21 – MITRE ATT&CK mapping on Hybrid Analysis\n图 10.21 – Hybrid Analysis\
  \ 上的 MITRE ATT&CK 映射\n\n我们看到不同的战术，例如 Execution、Credential Access、Persistence 和 Privilege\
  \ Escalation。我们现在已识别出与恶意文件关联的多个 TTPs 以及框架的不同阶段。该文件映射了 MITRE ATT&CK 框架的八种攻击技术（Service\
  \ Execution、Hooking、Software Packaging、Application Window Discovery、Query Registry、System\
  \ Time Discovery、Remote Desktop Protocol 和 Data Compressed）以及八种战术（Execution、Persistence、Privilege\
  \ Escalation、Defense Evasion、Credential Access、Discovery、Lateral Movement 和 Exfiltration）。我们将利用这些信息填充\
  \ Cyber Kill Chain 和 Diamond 模型。\n\n请注意，此处必须获取密码和解密密钥。我们假设恶意软件逆向工程团队已向您提供了解密被窃取数据（collected.rar）的密钥或密码。在下一个操作中，我们分析被窃取的文件。\n\
  \n## Analyzing the exfiltrated data and building adversary persona\n## 分析被窃取的数据并构建对手画像\n\
  \n从原始数据包捕获中，我们识别出一个正在从系统中窃取数据的 collected_data.rar 文件。我们已定位该文件，现在应打开并检查访问了哪些数据。典型示例是在\
  \ Linux 系统中安装了 UnRAR 应用程序时运行 tar -zxvf collected_data.rar 命令或 unrar collected_data.rar\
  \ 命令。以下截图显示了一个典型示例：\n\n```\n$ unrar e collected_data.rar\n\nUNRAR 5.61 beta 1 freeware\
