  \ **应用程序编程接口 (API)** 或自定义连接）。此外，SIEM 或 TIP 必须作为所有安全平台的集中式系统运行。\n\n投资端点管理系统成本可能很高；因此成本因素必须始终计入，尤其是预算有限的组织。组织可根据功能和需求获取一个以上端点管理系统。使用多平台时，需确保集成和互操作性得以维持以便维护和支持。下一节将介绍移动端点管理及其与端点管理系统的差异和挑战。\n\
  \n## 移动端点管理\n\n移动设备使用量呈指数级增长，已超过笔记本电脑、打印机等静态设备。移动设备架构、日常使用方式和能力使端点系统更具挑战。设想一名员工用手机访问企业网络，同时下载游戏和音乐、访问种子网站并在浏览时点击随机链接。其设备就成为攻击者与企业网络的桥梁。让我们看一下可能的移动设备安全威胁。\n\
  \n## 移动安全威胁与对策\n\n移动设备上的安全威胁可能因架构调整而与传统端点不同。例如，与笔记本电脑相比，移动设备与内核的交互并非直接，用户需通过各类应用与操作系统交互。因此可将移动安全威胁分为三类：\n\
  \n-   **基于内核的威胁**：当操作系统功能（权限、root 应用等）发生有意或无意变更时出现。例如对移动端点进行 root 或越狱以访问操作系统核心会使设备易受网络攻击。*因此必须强制执行限制已\
  \ root（或越狱）移动设备访问网络的策略。*\n-   **基于应用程序的威胁**：网络钓鱼同样适用于移动设备，移动应用对资源的访问权限各不相同。若向武器化应用授予敏感数据访问权限，不仅设备会受害，连接的网络也会受风险。因此必须*强制执行用户如何管理和授予应用权限的策略*（可通过教育实现）。系统必须识别*存在安全风险的移动设备*（获取其\
  \ **标识符 (IDs)**、**国际移动设备身份码 (IMEI)**、型号、制造商等）。系统应能在风险较高时*阻止此类设备。*\n-   **社会工程和网络威胁：**\
  \ 社会工程学始终是最有效的攻击手段之一，即使针对移动设备亦然。下载恶意文件并在克隆网站输入凭据会让攻击者获得访问权限。另一种方式是通过网络攻击。攻击者可通过访问企业无线网络（例如使用\
  \ **中间人攻击 (MITM attack)**）收集端点信息。因此必须*对员工进行安全最佳实践教育并强制执行 LAN 和 WLAN 网络保护（无线保护访问\
  \ 2-企业版 (WPA2-Enterprise) 或最新的 WPA3 加密）*。使用开放接入点时，需确保员工无法借此访问其他网络。\n\n移动终端[content]\n\
  -   **支持所有端点类型**：端点管理必须涵盖所有可连接网络的设备类型（笔记本电脑、打印机、智能手机、智能设备、平板电脑、电子板、工业机器等）。同时还必须涵盖物理和虚拟端点。\n\
  -   **支持所有操作系统**：虽然 Windows 仍是最流行的操作系统，但有效的端点管理系统必须覆盖所有操作系统（Windows、Linux、macOS、Android、iOS）。它还需针对定制和个性化的操作系统或软件进行适配。\n\
  -   **促进补丁管理**：确保可通过系统强制执行软件补丁，并覆盖所有主要补丁。\n-   **保持用户灵活性**：端点管理系统虽需对网络设备强制执行策略和标准，但不得影响用户在设备上开展工作的能力。在以尽可能低的成本收紧安全为主要目标的同时，操作必须保持高效。\n\
  -   **识别并提醒不合规情况**：确保端点系统能识别不符合组织政策和行业法规的设备。极端情况下，必须自动处理合规问题或向安全或 IT 团队发出警报。\n-\
