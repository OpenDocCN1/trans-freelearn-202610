- "## 6 网络威胁建模与对手分析\n\n为了实施健全的防御系统，至关重要的是了解需要保护的 *什么* 以及来自 *谁*。随着安全漏洞的增加，组织必须衡量和预测可能影响系统的潜在威胁并制定适当的缓解计划。威胁建模的目的即在于此。**威胁建模**\
  \ 用于更好地了解自己、了解对手，并将两者映射以创建更好的防御（补救计划和资源保护）。当组织启动威胁建模时，需要突出两个主要组成部分：*组织资源* 和 *对手知识*。\n\
  \n本章侧重于战略性地建模威胁并分析对手的行为。本章旨在为您提供主动网络威胁分析和防御所需的方法。我们将研究对手建模，因为它是在识别对手行为和特征方面的重要概念。\n\
  \n在本章结束时，您应该能够做到以下几点：\n\n- 理解威胁建模流程。\n- 理解不同的威胁建模方法及其最佳应用。\n- 理解 SIEM 及其在威胁情报和建模中的重要性。\n\
  - 理解并执行高级分析以识别异常用户行为。\n- 理解并讨论对手分析的自动和手动技术。\n\n在本章中，我们将涵盖以下主要主题：\n\n- 战略威胁建模流程\n\
  - 威胁建模方法\n- 使用 SIEM 的高级威胁建模\n- 用户行为逻辑\n- 对手分析技术\n\n## 技术要求\n\n对于本章，未突出显示任何特殊技术要求。大多数用例如有必要将使用\
  \ Web 应用程序。\n\n## 战略威胁建模流程\n\n威胁建模流程是一套 *系统化* 且 *结构化* 的步骤，有助于规划、配置和优化安全运营。它包括分解可用于确保和执行保护的必要元素。这些元素包括以下内容：\n\
  \n- **识别资产**：任何可能被对手入侵或想要的资源。\n- **风险和漏洞评估**：能够突出显示系统流程，如果被利用，可能危及组织资产的能力。\n- **对手和威胁**：针对或正在针对组织概况中资产的不同对手群体，他们的\
  \ **战术、技术和流程（TTPs）**，以及他们可用于利用系统流程的所有现有威胁向量。\n\n\n\n安全或威胁情报分析师随后必须将这三个要素映射起来，以创建一个基础威胁模型，从而帮助实施坚实有效的<|message|>安全防御。威胁模型并非标准化的。因此，每个组织可能拥有不同的模型，具体取决于目标和业务概况。因此，我们可以推导出能够推动威胁建模流程发展的关键问题：*我们有什么可能引起攻击者兴趣的？谁可以攻击或针对我们的系统？他们如何攻击我们的系统？我们可以做什么来阻止攻击或至少降低其影响？系统现在安全吗？*\n\
  \n利用这些问题，我们可以构建一个威胁建模流程骨架，作为我们安全运营的基础，如下图所示：\n\n![](img/d47f26598025b2da017dd41fcbb6e602_163_0.png)\n\
  \n图 6.1 – 基础威胁建模流程\n\n每个步骤都涉及一套技术来简化建模过程。在以下小节中，我们将详细查看每个步骤并总结主要使用的技术。\n\n## 识别和分解资产\n\
  \n第一步涉及突出显示对手可以攻击的资源——了解组织。资产根据其所属的业务单元进行分类。例如，您可以将资产分为四类：财务和个人数据、网络数据、知识产权以及系统可用性。系统可用性适用于那些一旦被破坏就会停止业务运营的资源。这包括软件应用程序、网络流量等。在识别和分解阶段，威胁情报分析师与内部安全成员一起，必须了解资产如何相互交互以及与外部世界的关系。他们必须围绕每个资产明确创建用例，以突出其效用（如何使用和操作）。通过了解每个资产的用例，分析师必须识别访问点（可以让黑客进入系统并破坏特定资产的点）并突出资产的信任级别（资产访问如何在内部和外部得到控制）。\n\
  \n资产识别包括服务器、终端、笔记本电脑、应用程序、知识产权、数据库、敏感文件、网络资源（带宽利用率）以及服务器机房等资源（对组织至关重要的任何物理和数字资源）。内部团队和情报分析师必须记录所有资产、其用途和位置。\n\
  \n第一步的另一个关键方面是资产分解。**分解**涉及拆分资产效用、突出入口点以及访问权限管理，以有效评估其安全性。通过分解资产，我们查看所有资产如何组合在一起，并确定资产可能在哪个点被针对。我们可以使用**数据流图**或**流程图**来分解组织资产。尽管数据流图最初并非为安全建模而设计（系统开发和工程），但它显示了应用程序的所有主要构建块及其工作原理。这显示了组件之间交互的方式，以及使应用程序运行所使用的协议和第三方应用程序。流程图以突出攻击者如何针对它们的方式分解资产。流程图使用这样一个概念，即攻击者关注的是资产不同用例之间的流程，而不是数据流。在这部分，我们使用两者兼顾，因为攻击者也可以利用应用程序层（如\
  \ Web 服务器、JDBCs、数据库服务器）和物理层（物理服务器安装的数据中心缺乏安全保障）的漏洞。典型医疗组织的资源分解如下图所示（资产并非详尽无遗但较为全面）。\n\
  \n从下图我们可以识别出资产列表（位于**数据中心 B**的**Apache Web 服务器**，其中包含面向用户的**医疗应用程序**，数据中心 B 也是 DMZ，以及三个包含用户**财务**、**个人**和**医疗信息**的数据库服务器，位于**数据中心\
  \ A**）：\n\n![](img/d47f26598025b2da017dd41fcbb6e602_165_0.png)\n\n图 6.2 – 威胁建模流程的基础资产分解\n\
  \n前述图表还显示了资产交互的不同用例应用程序。例如，患者可以注册、登录或使用忘记密码应用程序与系统后端交互。这些是系统中一些最常被针对的入口点。如果它们没有得到适当保护，攻击者可以注入恶意代码来破坏系统。前述图表还显示了在网络攻击期间可能受影响的不同资源。因此，它是一个良好的可视化，并为对策实施提供了第一个提示。\n\
  \n资产分解不是一个标准流程。它取决于组织的业务和敏感资源。它可以简单或复杂，取决于组织规模。使用流程图分解资产的过程包括以下内容：\n\n- **确定资产的用例：**\
  \ Web 或桌面应用程序（登录、搜索表单、联系表单、密码恢复、会话数据）。它还包括突出存储库和存储库、其内容和位置。\n- **概述通信协议：** 这描述了资产如何在内部通信以及如何与外部系统（受信任或公共的，如互联网）交互。\n\
  - **概述可用于控制资产的其他资源：** 这可以是数字技术控制或物理服务器机房。\n\n通过列出和分解资产（应用程序和基础设施），组织应该能够可视化什么可能引起对手的兴趣，以及什么可能是进入这些资源的潜在入口（也称为**攻击面**）。此步骤在执行威胁建模时非常重要。\n\
  \n## 对手与威胁分析\n\n**对手**是网络安全术语，主要指具有恶意意图的攻击者或威胁行为者。众所周知，对手的首要目标是破坏**保密性、完整性、可用性（CIA）**三要素中的一个或全部。然而，在威胁建模的范围内，我们将对手定义为任何可以自愿或非自愿地攻击系统或发起对组织资产未经授权访问的人、机器人、工具和系统。我们在传统对手定义的基础上稍作扩展，因为某些对手无需具有恶意意图即可被归类为威胁。\n\
  \n此步骤涉及概述对手及其应用范围（能力、能力和目标）。组织可以选择按组或单独建模对手。此步骤回答了问题：“*谁在针对我们的系统？*”。以下是对手的非详尽列表，以及他们的活动范围。然而，建议每个组织都应列出详尽的对手或团体清单，包括不受信任的记者。同时也至关重要要确定对手、他们带来的威胁、其动机以及他们破坏您组织的可能性（这取决于行业、业务规模、政治环境、运营国家等），如下所示：\n\
  \n- **黑帽黑客：** 他们以访问复杂系统、绕过复杂安全基础设施而闻名（威胁包括系统入侵、欺骗、中间人攻击、社会工程攻击、冒充、系统入侵等）。这些人应引起任何组织的关注。此类别包括结构化黑帽黑客（*具备破坏系统扎实技能的专业人士*）和非结构化黑帽黑客（也称为\
  \ *脚本小子*）。他们的动机包括好奇心、自尊（名声）、经济利益、数据篡改、盗窃等。他们根据动机针对企业和个人。\n\n\n\n-   **有组织犯罪**：有组织犯罪是组织和分析人员必须考虑的另一类对手。然而，根据业务类型及其目标，确定有组织犯罪是否对你构成威胁至关重要。*你是否有团体可以针对的东西？*\
  \ 这类对手拥有资源，可能由有影响力的犯罪组织领导和控制（威胁包括网络钓鱼、信用卡欺诈、后门、高级恶意软件、rootkit、零日攻击、密码破解、C2 系统等）。其动机可能包括盈利、敏感数据窃取和未经授权的数据修改。有组织犯罪通常针对企业、信用卡公司（销售点）以及对它们有价值数据的任何组织。\n\
  \n-   **工业间谍**：在竞争的世界里，企业会不择手段地保持领先。工业间谍活动针对组织的商业秘密，这可能对企业及其完整性造成损害。因此，评估工业间谍活动的可能性至关重要。第一步应已识别需要保护的公司文件、IPRs\
  \ 以及任何财产信息。工业间谍威胁包括具有长期目标的高级别攻击。其范围广泛且复杂。其动机包括技术和知识泄露以及关键企业数据窃取。间谍攻击发生的可能性取决于组织的业务领域、目标和需要保护的资产。\n\
  \n-   **内部人员**：内部人员难以检测或对抗，因为他们是企业的一部分。检测到他们忠诚度或意图改变的时刻并不简单。内部人员可能是不满的员工（可能拥有管理访问权限）或因不当行为无意中损害系统的普通员工。他们的威胁涵盖欺诈，从平庸表现到恶意代码，以及不安全的安保实践。根据其类别（恶意的内部黑客或训练不足的员工），其动机可能是经济利益、不满或仅仅是无意的错误。因此，在进行威胁建模时，将内部人员行为者群体纳入考虑至关重要。\n\
  \n-   **黑客行动主义者**：这类对手入侵系统以支持或不支持某些意识形态。作为企业，评估黑客行动主义团体是否对组织构成威胁至关重要。例如，对于从事社会政策和政治事务的公司或个人（律师、承包商和国家组织），将黑客行动主义者纳入对手定义矩阵至关重要，如\
  \ *对手分析技术* 部分后面所述。他们的动机包括意识形态支持，在一定程度上还包括利润。该类别的一些威胁包括勒索软件、网络钓鱼、**分布式拒绝服务 (DDoS)**、rootkit\
  \ 和零日利用。该类别的攻击概率取决于组织的业务以及社会或政治立场。\n\n-   **国家级黑客**：竞争不仅是经济上的，也是政治上的。随着国家间间谍活动最近的增加，各国在网络空间问题上采取了不同的立场。政府赞助黑客攻击其他政府以获取情报和其他动机。国家黑客也以针对个人和企业来为国家获取经济和技术利益而闻名。国家的支持（持牌黑客）使他们几乎无法触及且难以检测——他们被提供各种资源和新技术来开展恶意活动。他们的威胁包括\
  \ **高级持续性威胁 (APTs)**、**复杂的多向量攻击** 和 **关键基础设施破坏**。这一对手类别背后的动机包括政治和经济优势、社会或军事力量以及报复。地缘政治网络犯罪需要被任何希望提供可靠系统保护的组织考虑。国家赞助的黑客攻击发生的可能性取决于运营国家和业务领域。作者在以下链接中提供了有关国家级黑客的有用信息：https://bit.ly/3sKN6XT。\n\
  \n-   **网络恐怖分子**：恐怖组织对组织构成重大威胁。他们越来越少依赖军事战略，采用网络技术来实现其目标。尽管在大多数情况下，他们针对的是政府，组织仍需要在其对手矩阵中纳入它们。此类攻击发生的可能性取决于组织的业务领域及其与特定社会或政治意识形态的关联。与支持某个运动的政府承包律师事务所相比，在线商店组织不太可能遭受网络恐怖主义攻击。他们的威胁包括\
  \ APTs、勒索软件、网络钓鱼、DDoS 和供应链攻击。网络恐怖主义行为者的动机是通过暴力的意识形态。因此，组织必须在对手矩阵中对网络恐怖主义团体及其影响进行排序。\n\
  \n-   **其他非恶意团体**：攻击不一定是恶意的才能落入威胁类别。例如，如果互联网上共享的信息量没有限制，搜索引擎可能会使你的信息可供竞争对手使用。记者可能会尝试访问组织的敏感信息——不是为了造成伤害或破坏，而是为了发表他们的报道并\
  \ *证明一点*。未经适当培训的员工可能会无意中在系统中留下漏洞窗口。组织在建模威胁时必须考虑这一类别的攻击。\n\n有几个对手团体。威胁情报分析师需要与内部安全利益相关者合作，识别所有潜在的威胁行为者并创建威胁地图以可视化威胁模型。\n\
  \n## 威胁分析\n\n前面提到的每个对手都有其行动的动机。使他们成为威胁的是他们的 *意图*、*能力* 和 *机会*。威胁分析师必须将这些资产映射到对手，同时考虑威胁的三个特征。诸如\
  \ **MITRE ATT&CK** 框架之类的框架是高效映射对手团体与其所追求资产的方式。在建模过程的此阶段，分析师不必详细说明团体使用的技术。我们提供了对手资产地图，如下图所示，以说明这一概念。该地图需要根据已识别的资产和已定义的对手进行扩展：\n\
  \n![](img/d47f26598025b2da017dd41fcbb6e602_169_0.png)\n\n图 6.3 – 简化的资产到威胁团体（对手）映射\n\
  \n前述图表说明了将资产映射到威胁团体的简单模型。例如，恶意黑客以针对组织中对他们有价值的任何或所有资源而闻名。他们可以根据目标针对服务器、加密数据并窃取敏感信息。如果黑客团体获得财务和个人信息访问权限，影响为\
  \ *高*。假设同一团体通过内部人员获得数据中心的物理访问权限。在这种情况下，影响也高，因为他们可以物理连接设备以植入恶意软件。国家赞助的黑客可能为了国家安全而获取个人信息。当他们获得个人信息数据库访问权限时，他们的风险变得很高。如果他们访问组织的电子邮件服务器（或消息），也可以被视为高风险。\n\
  \n一名想要发表报道的普通记者可能对组织构成风险。当他/她可以访问公司电子邮件（可将其用作报道的证据）时，他们的风险很高。当有公司大楼的物理访问权限时，他们的风险很低（信息不会轻易提供给他们）。\n\
  \n这种映射可以使用颜色进行，其中 *红色表示对组织的高影响* 而 *蓝色表示低影响*。或者，可以使用加权线进行，其中高加权线代表资产到对手的高影响或高风险链接。威胁情报团队必须将对手映射到资产，以了解每个对手构成的威胁水平。接下来，我们将查看第三步：攻击面和威胁向量。\n\
  \n## 攻击面和威胁向量\n\n对手必须识别目标系统中的入口点（或入口点），以便发生网络攻击。特定系统所有入口点构成 *攻击面*。保护网络意味着减少攻击面——攻击面越少，遭受网络攻击的机会就越低。第三步的第一个任务是定义组织的所有攻击面。一旦识别出攻击面，对手就会选择最佳且最可靠的方法来执行攻击。这些被称为\
  \ *威胁向量*。第三步的第二个任务是突出对手使用的所有（如果不是大多数）威胁向量。最后一个任务是将攻击面映射到威胁向量以创建面-向量矩阵。\n\n\n\n##\
  \ 攻击面\n\n在网络空间中存在两种基本的攻击面：*人员* 和 *设备*。虽然组织在设备安全方面投入了大量资源，但人员仍然是安全链中最薄弱的环节，也是网络和系统最常被针对的入口点。虽然近年来有所改善（钓鱼攻击从\
  \ 25% 降至 3.4%），但根据 2020 年 Verizon 报告，人为错误仍占安全事件的 22%（https://duo.sc/3vam3Hd）。而根据\
  \ Gartner 报道，95% 的云入侵归因于人为错误（主要是配置错误）（https://on.wsj.com/3vchI6A）。诸如社会工程等完全基于操纵人类的技术占数据泄露的\
  \ 70-90%（https://bit.ly/3naESHy）。所有这些统计数据表明，在进行威胁建模时，通过人员发生的网络攻击的可能性应设为 *高*。\n\n\
  另一方面，设备在网络和系统中发挥着至关重要的作用。无论是物理还是虚拟，它们都被用作终端、存储组件、网络元素、安全组件、服务器等。威胁分析团队必须列出网络中的设备和应用程序。团队必须对设备进行分类以便识别它们。例如，我们可以有六个设备类别：\n\
  \n- **基础设施：** 这是指促进通信、业务运营以及访问其他资源的设备或资源。其中包括服务器、交换机、路由器、防火墙、IDS、IPS、无线 **接入点 (APs)**、代理服务器、VPN\
  \ 网关、**网络附加存储 (NAS)** 设备以及用于促进通信和访问的任何其他节点。这些设备为系统提供不同的服务。\n- **应用程序：** 这是指网络元素或厂商提供的服务。分析师必须列出使用的不同服务，例如\
  \ DNS 服务、SMTP 服务、DHCP 服务、共享目录、NTP 服务、Web 应用程序、LDAP 等身份验证服务等。他们还必须列出可用于日常运营任务的常规应用程序（Office\
  \ 365、Adobe 程序等）。\n- **终端：** 这包括工作站、笔记本电脑、手机、打印机、销售点设备和工业机器等终端设备。分析师必须列出系统中所有可用的终端，以便进行可靠的保护。\n\
  - **物联网设备：** 随着连接设备数量预计在未来增长，多个组织已开始采用物联网技术。如果适用，这些设备需要添加到潜在攻击面列表中。此类设备包括生物识别扫描仪、智能监控摄像头、**语音\
  \ over IP (VoIP)** 设备和智能设备。制造自动驾驶汽车的公司也必须将它们添加到列表中，因为它们是攻击面。\n- **云资源：** 这是指组织或个人的基于云的基础设施和应用程序，例如云存储、云网络（虚拟私有云）和云\
  \ Web 服务器。分析师必须了解组织运行的所有云服务。\n- **供应链：** 供应链包括任何额外的资源，例如第三方许可、软件、应用程序和证书。所有这些都需要在攻击面列表中包含。\n\
  \n设备和人员构成了对系统的潜在风险，并为对手提供了极佳的攻击面。因此，为了保护系统，准确枚举所有现有攻击面至关重要。对于大型企业来说，列出所有终端设备具有挑战性。因此，有必要关注终端的类型及其已知漏洞。这在资源管理方面可作为政策和参考——例如，拒绝所有未安装最新操作系统的\
  \ workstation 的访问权限，可以成为一种有效的终端管理规则，以降低攻击发生的可能性。\n\n## 威胁向量\n\n对手使用多种方法和技术攻击网络和系统。MITRE\
  \ ATT&CK 框架提供了攻击者执行不同任务所使用的全球大部分 TTP。威胁情报团队的任务是列出可用于破坏组织及其资源的攻击方法。然而，以下是威胁行为者实施攻击所使用的一些标准方法：\n\
  \n- **钓鱼：** 实施网络攻击的一种标准且广泛使用的方法。一般来说，钓鱼难以缓解，因为大多数时候，员工或个人不够谨慎或未接受足够培训来分析钓鱼内容的结构。根据\
  \ *Verizon 2020 报告*，几乎 25% 的数据泄露涉及钓鱼。钓鱼是恶意软件、勒索软件、数据窃取或篡改以及敏感数据泄露（电子邮件、身份等）的主要传播途径之一。情报团队必须意识到针对组织或个人的钓鱼尝试的可能性为\
  \ *高*。\n- **恶意软件：** 恶意软件是许多数据泄露的核心。几乎每一次数据泄露都涉及恶意软件。**蠕虫**、**病毒**、**间谍软件** 和 **特洛伊木马**\
  \ 都被用于执行恶意活动。虽然个人和家庭用户可能会忽视其影响，但恶意软件感染会完全破坏系统并影响整个网络的完整性和可用性。因此，情报团队需要考虑潜在恶意软件感染的高概率。\n\
  - **勒索软件**: 勒索软件趋势最近有所增加，根据同一份 Verizon 报告，它占恶意软件攻击的 27%。Statista 显示，2020 年登记的勒索软件攻击超过\
  \ 3 亿次（https://bit.ly/3sN26Vg）。顾名思义，攻击的目标是锁定组织或个人的资源并要求支付赎金以解锁。勒索软件像大多数恶意软件一样，需要一个载体或其他威胁向量进入目标系统。它利用钓鱼、软件漏洞、恶意链接或远程控制协议等向量来破坏目标。情报团队必须意识到勒索软件攻击的概率为\
  \ *高* 且增长迅速。勒索软件最常见的三种感染方法涉及 **钓鱼**、**远程桌面协议 (RDP)** 和 **未修补的漏洞**。\n- **弱、被盗和受损的凭证：**\
  \ 用户名和密码仍然是最流行的身份验证方法。当它们未得到适当保护时，凭证可能会暴露给未经授权的人员，导致对账户或资源的非预期访问。弱密码可能被暴力破解并被恶意使用。管理员用户对凭证攻击构成高风险，因为其访问权限级别允许他们控制敏感资产。被盗或弱凭证占凭证盗窃泄露的\
  \ 37%（根据 Verizon 报告）。被收集的凭证和其他 **个人身份信息 (PII)** 通常会被出售给犯罪团伙和经纪人（大多在暗网上）以通过定向攻击获得经济利益。\n\
  - **差或不存在的加密：** 处理敏感信息至关重要。加密不存在会给攻击者提供访问明文信息的机会。加密在 CIA 三元组的保密方面发挥着重要作用。加密应用于传输中或静态数据。如果处理不当，对手可以破解加密流量以访问明文信息。如果不存在加密，那么圣诞节就送给了攻击者。**中间人**\
  \ 攻击也是一个威胁向量，它利用差的和不存在的加密来窃听网络流量。差的和缺失的加密是一个可归因于人为错误的向量。因此，评估加密流程至关重要。\n\n\n\n-\
  \ **误配置：** 误配置是人为错误风险，根据 Verizon 报告显示，截至 2020 年占漏洞事件的 22%。服务误配置也是当前大多数 Web 应用程序攻击的中心。误配置的示例包括未验证或验证不充分的表单输入以及配置不正确的\
  \ SSL 证书。此类威胁向量允许攻击者向系统注入恶意代码。一些利用误配置的其他向量包括 **SQL 注入**、**跨站脚本 (XSS)**、**代码注入**、**敏感数据泄露**\
  \ 和 **身份验证损坏**，仅举几例。OWASP Top 10 主要描述了因误配置导致的安全漏洞。情报团队必须考虑误配置风险。*第 11 章，可用性安全：威胁情报作为流程的一部分*\
  \ 提供了促进应用程序和产品安全开发的最佳实践。\n- **未修补漏洞：** 组织或个人必须始终确保在产品或服务堆栈中使用最新修补的软件。如果目标未在其应用程序堆栈中修补软件，攻击者可以利用未修补漏洞作为攻击向量来入侵目标。然而，较少的漏洞事件与未修补漏洞有关，但其后果可能是致命的。最受欢迎的未修补漏洞攻击之一是\
  \ *2017 年 Equifax 泄露事件*，其造成超过 5 亿美元的损失和超过 10 亿美元的安全升级费用 (https://www.gao.gov/assets/gao-18-559.pdf)。因此，未修补漏洞不应被情报或内部安全团队轻视。\n\
  \n情报团队正确列举攻击者可能针对组织或需要安全保障的个人使用的潜在威胁向量至关重要。威胁向量列表中包含的细节越多，威胁向量到攻击面的映射越高效，缓解措施和建议就越好。\n\
  \n## 威胁向量到攻击面映射\n\n在前两个小节中，我们列出了可以促进我们系统网络攻击的攻击面和威胁向量。下一个重要任务是构建 **向量-面矩阵** 和 **攻击树**，以将所有潜在的系统入口点与可用于利用它们的方法联系起来。向量-面矩阵如下图所示：\n\
