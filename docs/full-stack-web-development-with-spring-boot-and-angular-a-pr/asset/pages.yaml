- pgno: 313
  md: "# Selecting feature states\n\nWhile selecting feature states, we will use the\
    \ createSelector() and createFeatureSelector() functions to create the selector.\
    \ Let’s look at an example of a selector selecting the list of blogs found under\
    \ the feature state (BlogState):\n\n```\n// blogs.selectors.ts\nimport { createSelector,\
    \ createFeatureSelector } from '@ngrx/store';\n\nexport const selectBlogsState\
    \ =\ncreateFeatureSelector<BlogsState>('blogsState')\n\nexport const selectBlogs\
    \ = () => createSelector\n  selectBlogsState,\n  (state: BlogsState) => state.blogs\n\
    )\n```\n\nIn the preceding code example, the first step is to create the feature\
    \ selector that will return the whole BlogState. Here, we have used createFeatureSelector()\
    \ and the state’s key to identify the feature state we want to select.\n\nThe\
    \ second step is to create the main selector of the blog slice; createSelector()\
    \ has two parameters, where the first one is the BlogState feature selector, and\
    \ the second one is a function where the returned BlogState from the feature selector\
    \ is the parameter. The returned value is the blog slice.\n\n# Implementing selectors\
    \ in our project\n\nSo far, we have learned how to create selectors using the\
    \ createFeatureSelector() and createSelector() functions. Now, let’s implement\
    \ them in our project. The first thing we need to identify is the states or slices.\
    \ The first slice that needs a selector is a blog slice located under AntiHeroState.\
    \ Remember that AntiHeroState is not our root state; this means that we will have\
    \ a feature selector for the following state.\n\nThe second selector we need is\
    \ the selector for the antiHeroes slice, which contains the array of anti-heroes\
    \ retrieved in the API. Finally, the third selector we want will need to select\
    \ specific antiHero data from the list based on the id parameter."
  merge: -1
  img_proc: true
- pgno: 314
  md: "To create all of these selectors, place the following code in the anti-hero/state/anti-hero.selectors.ts\
    \ file:\n\n```\n// select the AntiHeroState\nexport const selectAntiHeroState\
    \ =\ncreateFeatureSelector<AntiHeroState>('antiHeroState')\n\n// selecting all\
    \ antiheroes\nexport const selectAntiHeroes = () => createSelector(\n  selectAntiHeroState,\n\
    \  (state: AntiHeroState) => state.antiHeroes\n)\n// selecting an antihero base\
    \ on id\nexport const selectAntiHero = (id: string) => createSelector(\n  selectAntiHeroState,\n\
    \  (state: AntiHeroState) => state.antiHeroes.find(d =>\n    d.id === id)\n)\n\
    ```\n\nAfter successfully creating all of the selectors, we can use the on anti-hero/pages/list.component.ts\
    \ file by adding the following code:\n\n```\nantiHeroes$ = this.store.select(selectAntiHeroes());\n\
    constructor(\n  private router: Router,\n  private store: Store<AppState>,\n)\
    \ { }\nngOnInit(): void {\n  this.assignAntiHeroes();\n}\nassignAntiHeroes() {\n\
    \  this.antiHeroes$.subscribe((data) => {\n    this.antiHeroes = data;\n  });\n\
    }\n```\n\nIn the preceding code example, we used the selectAntiHeroes() selector\
    \ to get the array of anti-heroes from the state. antiHeroes$ is an Observable\
    \ that returns the current state of the antiHero slice once subscribed."
  merge: -1
  img_proc: true
- pgno: 315
  md: "Finally, we must get the anti-heroes list feature. We can do this by dispatching\
    \ the GET_ANTI_HERO_LIST action in the list component in the ngOnInit() hook.\
    \ This will call the effect that we created earlier, which invokes the endpoint\
    \ for getting the list of anti-heroes:\n\n```\nngOnInit(): void {\n  this.store.dispatch({type:\
    \ AntiHeroActions.GET_ANTI_HERO_LIST});\n  this.assignAntiHeroes();\n}\n```\n\n\
    With that, we have successfully created selectors for the components to retrieve\
    \ data from the state. In the next section, we will discuss the available configurations\
    \ we can implement for the store.\n\n# Configuring the store\n\nIn the previous\
    \ sections, we created all of the building blocks of NgRx that complete a fully\
    \ functional store for the application. In this section, we will learn how to\
    \ configure the NgRx store using runtime checks.\n\n# Runtime checks\n\nRuntime\
    \ checks are used to configure the NgRx store to allow developers to follow the\
    \ NgRx and Redux core concepts and best practices. This is very useful, especially\
    \ for developers new to NgRx; they display errors regarding development based\
    \ on the activated runtime checks.\n\n@ngrx/store provides six built-in runtime\
    \ checks:\n\n+   - `strictStateImmutability`: Checks if the state isn't mutated\
    \ (default: On)\n+   - `strictActionImmutability`: Checks if the actions aren't\
    \ mutated (default: On)\n+   - `strictStateSerializability`: Checks if the state\
    \ is serializable (default: On)\n+   - `strictActionSerializability`: Checks if\
    \ the actions are serializable (default: Off)\n+   - `strictActionWithinNgZone`:\
    \ Checks if actions are dispatched within NgZone (default: Off)\n+   - `strictActionTypeUniqueness`:\
    \ Checks if the registered action types are unique (default: Off)\n\nTo change\
    \ the default configuration of the runtime checks, we will use the runtimeChecks\
    \ property on the root store's config object. The value of each runtime check\
    \ can be assigned with true to activate the check or false to deactivate the check:\n\
    \n```\n@NgModule({\n  imports: [\n    StoreModule.forRoot(reducers, {\n```"
  merge: -1
  img_proc: true
- pgno: 316
  md: "```\n```javascript\nruntimeChecks: {\n  strictStateImmutability: true,\n  strictActionImmutability:\
    \ true,\n  strictStateSerializability: true,\n  strictActionSerializability: true,\n\
    \  strictActionWithinNgZone: true,\n  strictActionTypeUniqueness: true,\n},\n\
    }),\n],\n})\n```\n```\n\n# strictStateImmutability\n\nThis is the number one rule\
    \ of NgRx. It is activated by default, and the runtime checks verify if the developer\
    \ modifies the state object.\n\n**Example violation of this rule:**\n\n```\n```javascript\n\
    export const reducer = createReducer(initialState, on(addBlog,\n  (state, { blog\
    \ }) => ({\n  // Violation 1: we assign a new value to loading\n  state.loading\
    \ = false,\n    // Violation 2: `push` modifies the array\n    // state.blogs.push(blog)\
    \ })) );\n```\n```\n\n**Fix for this violation:**\n\n```\n```javascript\nexport\
    \ const reducer = createReducer( initialState, on(addBlog,\n  (state, { blog })\
    \ =>\n  // Fix: We are returning the state as a whole object with\n  // the new\
    \ values\n    ({ ...state,\n      loading: false,\n      blogs: [...state.blogs,\
    \ blog],\n    })) );\n```\n```\n\n# strictActionImmutability\n\nThis runtime check\
    \ is similar to `strictStateImmutability` but is for actions. This runtime check\
    \ verifies if the developer modifies the action. This check is activated by default."
  merge: -1
  img_proc: true
