- pgno: 270
  md: "# Understanding reactive forms\n\nOne of the advantages of the **Angular framework**\
    \ is that it already provides its form extensions. We can find these extensions\
    \ under the `@angular/forms` package once we have created our Angular application.\
    \ There are two available ways to build forms. These are **template-driven forms**\
    \ and **reactive forms**; them having their own form extension is advantageous\
    \ to the developers as this does not require installing under packages to create\
    \ forms.\n\nAt the same time, we can make sure that every Angular application\
    \ uses a single library for building forms. In this section, we will be focusing\
    \ more on how to implement reactive forms in our application as this is the commonly\
    \ used method in developing forms in Angular applications, but first, let’s discuss\
    \ a basic introduction to the template-driven approach before proceeding to reactive\
    \ forms.\n\n# The template-driven approach\n\nTemplate-driven forms, as the name\
    \ suggests, are forms declared and validated on the template (HTML). It uses the\
    \ ngForm directives, which transforms the HTML form into a template-driven form\
    \ and creates a top-level FormGroup, and the ngModel directive makes a FormControl\
    \ for the form elements.\n\nTo use template-driven forms, we must import FormsModule\
    \ into the module where we want to use the template-driven forms. In the following\
    \ code example, we have imported FormsModule into the `app.module.ts` file:\n\n\
    ```\n...\nimport { FormsModule } from '@angular/forms';\n@NgModule({\n  declarations:\
    \ [\n    AppComponent\n  ],\n  imports: [\n    BrowserModule,\n    AppRoutingModule,\n\
    \    FormsModule\n  ],\n  providers: [],\n  bootstrap: [AppComponent]\n})\nexport\
    \ class AppModule { }\n```\n\nWe must not forget to import FormsModule as our\
    \ application will not recognize the ngForm and ngModel directives."
  merge: -1
  img_proc: true
