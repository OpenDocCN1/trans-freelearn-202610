- pgno: 195
  md: "# Configuring Logback\n\n**Logback** is the default logger used by Spring Applications,\
    \ so no dependencies need to be installed to use it. The `spring-boot-starter-logging`\
    \ dependency is already included once we create our Spring Boot application. The\
    \ first step we need to take is to make our Logback configuration file.\n\nIn\
    \ our project, under the `resources` folder, we will add the `logback-spring.xml`\
    \ file. This is where we will place our Logback configuration. The following is\
    \ an example configuration:\n\n```\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n\
    <configuration>\n\n    <property name=\"LOGS\" value=\"./logs\" />\n    <!--Please\
    \ refer to the logback-spring.xml of\n    the GitHub repo. Thank you. -->\n  \
    \  <!-- LOG everything at INFO level -->\n    <root level=\"info\">\n        <appender-ref\
    \ ref=\"RollingFile\" />\n        <appender-ref ref=\"Console\" />\n    </root>\n\
    \n    <logger name=\"com.example\" level=\"trace\"\n        additivity=\"false\"\
    >\n        <appender-ref ref=\"RollingFile\" />\n        <appender-ref ref=\"\
    Console\" />\n    </logger>\n\n</configuration>\n```\n\nIn the preceding XML,\
    \ several configurations were defined to format our log events. We have created\
    \ two Appenders - `Console` and `RollingFile`. Configuring the two appender tags\
    \ will create logs in System.out and File Output.\n\nWe have also used a pattern\
    \ that modifies the look and format of the log display. In this example, we have\
    \ used the `%black(%d{ISO8601}) %highlight(%-5level) [%blue(%t)] %yellow(%C{1.}):\
    \ %msg%n%throwable` pattern to display the logs in System.Out. It shows the date\
    \ in black, the severity level in highlight, the thread name in blue, the class\
    \ name in yellow, and the message assigned to the logs."
  merge: -1
  img_proc: true
