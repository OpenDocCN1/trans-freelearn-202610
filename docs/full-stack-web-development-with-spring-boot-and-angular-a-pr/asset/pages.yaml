  md: '# OOP


    TypeScript is an **object-oriented language**, which means it supports concepts
    such as classes, interfaces, and inheritance. OOP is very scalable as we develop
    our applications into objects, which can be an advantage if we’re developing growing
    applications.


    # Early spotted bugs


    Browsers do not understand TypeScript directly. Instead, they use **transpilers**,
    which compile the code into plain JavaScript. Here, all errors related to syntax
    and types are caught, allowing developers to worry about the code logic instead.


    These are just the advantages of the TypeScript language. Now, let’s look at the
    benefits of Angular itself.


    # Support for large enterprise applications


    Angular is considered an all-in-one package framework in that most of the standard
    features that are needed to build an application are already included. This includes
    modules. For example, to use forms in an Angular application, we must import FormsModule
    and ReactiveformsModule. Other examples are navigation and routes. Angular provides
    RouterModule so that you can create routes within the application.


    # Single-page application


    Angular is a **single-page application (SPA)**, which means that when a user navigates
    from one page to another, the page doesn’t reload as it’s the data that’s being
    fetched by the server. In addition, the client’s resources are independent and
    are already loaded in the browser, which contributes to the loading performance
    of the application.


    # Progressive web apps (PWAs)


    **Progressive web apps (PWAs)** are becoming a trend nowadays. They are a solution
    that allows web applications to run on mobile apps, as well as different platforms,
    both online and offline. It is straightforward to configure Angular as a PWA thanks
    to its schematics – with just a single line of code, your Angular app is configured.
    PWAs can also be uploaded into the Android Play Store and Microsoft Store using
    PWA Builder.


    The following command uses the Angular CLI to convert our application into a PWA:


    ```

    ng add @angular/pwa

    ```


    # The Angular CLI


    We don’t need to create or configure Angular from scratch. Instead, we can use
    the Angular CLI, which helps install the necessary dependencies to run our Angular
    application successfully. Although the schematics features are responsible for
    creating the required files, installing the packages, and'
