- pgno: 306
  md: "# Writing an action\n\nThe first building block of state management is that\
    \ we will write our actions. When writing actions, we have several rules we can\
    \ follow so that we have good actions in our application:\n\n+   - **Upfront**:\
    \ Writing actions should always come first before developing the features. This\
    \ gives us an overview of what should be implemented in the application.\n+  \
    \ - **Divide**: We should always categorize the actions based on the event source\
    \ and the associated data.\n+   - **Many**: Writing more number actions is not\
    \ an issue. It is more beneficial as more actions create a better overview of\
    \ the flow of your application.\n+   - **Event-Driven**: Capture *events* as you\
    \ separate the description of an event and how it's handled.\n+   - **Descriptive**:\
    \ Always provide meaningful information using type metadata. This helps debug\
    \ the state.\n\nLet's look at an example action that will set the list of blogs\
    \ in our state:\n\n```\nimport { createAction, props } from '@ngrx/store';\nexport\
    \ const setBlogList = createAction(\n  '[Blog] Set Blog List',\n  props<{ blogs:\
    \ ReadonlyArray<Blog> }>(),\n);\n```\n\nIn the preceding code example, we used\
    \ the `createAction()` function to create our action. The `createAction()` function\
    \ also returns a function that returns an object of the action interface; in this\
    \ case, it will return \"[Blog] Set blog list\" as the action type and the array\
    \ of blogs as the additional properties.\n\nTo dispatch the action, we will use\
    \ the `dispatch()` function and use `setBlogList` as a parameter:\n\n```\nngOnInit()\
    \ {\n    store.dispatch(setBlogList({ blogs: this.blogs }));\n}\n```\n\n# Implementing\
    \ actions in the project\n\nOur primary goal for our project is to create the\
    \ entire cycle to get the list of anti-heroes in our API and place it in our store.\
    \ The first step is to take the actions we need; let's look at the two actions\
    \ that we should make for this feature:\n\n+   - `getAntiHeroList`: This action\
    \ will retrieve the list of blogs from the external API provided by our Spring\
    \ project.\n+   - `setAntiHeroList`: This action will place the retrieved list\
    \ of blogs in our store."
