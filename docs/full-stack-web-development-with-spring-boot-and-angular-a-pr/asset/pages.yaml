- pgno: 230
  md: 'project to another. To solve this dilemma, we will present a commonly used
    structure in the industry or some kind of baseline structure that you will typically
    find in Angular projects.


    However, before we proceed to our main topic, let us first discuss how to create
    our Angular project and what the basic concepts that we need to know before coding
    Angular are. You can skip this part if you are already knowledgeable about Angular
    and proceed to the Organizing the folder structure section.


    # Generating an Angular project


    We can create or set up the dependencies of our Angular project using a tool known
    as the Angular CLI. We can scaffold the project by using a single command responsible
    for downloading the dependencies and generating the required files for our Angular
    project to run. The Angular CLI is a handy tool in that it also provides several
    commands that will help us generate boilerplate codes in Angular.


    To install the Angular CLI, we should make sure that we have Node.js installed
    on our machine, and we will execute the npm install -g @angular/cli command. After
    executing the command, we can verify whether our Angular CLI has been successfully
    installed – we will have a new global ng command that we can use to check the
    version of the installed CLI.


    To check the version, we will execute the ng --version command, and we will get
    the following output:


    ![](img/7c3ddd2e5893c9b5a0220148ed886548_230_0.png)


    Figure 10.1 – Installed version of the Angular CLI'
