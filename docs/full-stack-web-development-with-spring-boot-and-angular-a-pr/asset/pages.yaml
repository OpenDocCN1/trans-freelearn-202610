- pgno: 287
  md: "The output for this code will be the same. FormBuilder methods are mainly for\
    \ making our reactive forms clean and readable. Now, we will discuss how to add\
    \ validations to our controls.\n\n# Validating form input\n\nWe have now created\
    \ and simplified our reactive form in the previous section, but we want to make\
    \ our forms accurate in accepting data and at the same time create a user-friendly\
    \ experience for the user to let them know easily what the valid values for each\
    \ control are. Now, we will learn how to add validations to our reactive forms.\n\
    \nIn reactive forms, we are adding validators as parameters directly to the form\
    \ controls in the component class instead of adding them as an attribute in the\
    \ template.\n\n# Built-in validators\n\nAngular provides several built-in validator\
    \ functions that we can use directly in our forms. Let’s have a look at some of\
    \ these:\n\n+   - static min(min: number) — Requires the value of the control\
    \ to be equal to or greater than the given number:\n\n```\nform = this.fb.group({\n\
    \  name: [10, [Validators.min(4)]]\n});\nconsole.log(this.form.status) // returns\
    \ VALID\nstatic max(max: number) - requires the value of the control to be equal\
    \ to or less than the given number.\nform = this.fb.group({\n  name: [3, [Validators.max\
    \ (4)]]\n});\nconsole.log(this.form.status) // returns VALID\n```\n\n+   - static\
    \ required(control: AbstractControl<any, any>) — Controls must not have a non-empty\
    \ value:\n\n```\nform = this.fb.group({\n  name: ['test value', [Validators.required]]\n\
    });\nconsole.log(this.form.status) // returns VALID\n```"
  merge: -1
  img_proc: true
- pgno: 288
  md: "+   - `static requiredTrue(control: AbstractControl<any, any>)`—Controls must\
    \ have a value of true:\n\n```\nform = this.fb.group({\n  name: [true, [Validators.requiredTrue]]\n\
    });\nconsole.log(this.form.status) // returns VALID\n```\n\n+   - `static minLength(minLength:\
    \ number)`—Used for arrays and strings, this requires that the length of the value\
    \ should be equal to or greater than the given number:\n\n```\nform = this.fb.group({\n\
    \  name: ['test', [Validators.minLength (4)]]\n});\nconsole.log(this.form.status)\
    \ // returns VALID\n```\n\n+   - `static maxLength(maxLength: number)`—Used for\
    \ arrays and strings, this requires that the length of the value should be equal\
    \ to or less than the given number:\n\n```\nform = this.fb.group({\n  name: ['test',\
    \ [Validators.maxLength (4)]]\n});\nconsole.log(this.form.status) // returns VALID\n\
    ```\n\n# Custom validators\n\nOther than the built-in validators, we can also\
    \ create custom validators, which is helpful if our forms require more complex\
    \ verification and checking.\n\nLet’s have a look at the following example custom\
    \ validator:\n\n```\nimport { AbstractControl, ValidationErrors, ValidatorFn }\
    \ from\n\"@angular/forms\";\nexport function checkHasNumberValidator(): ValidatorFn\
    \ {\n  return (control: AbstractControl): ValidationErrors |\n    null => {\n\
    \      const error = /\\d/.test(control.value);\n      return error ? {hasNumbers:\
    \ {value: control.value}} :\n        null;\n    };\n}\n```"
