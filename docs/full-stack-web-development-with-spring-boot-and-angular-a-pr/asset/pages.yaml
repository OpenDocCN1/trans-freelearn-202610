- pgno: 158
  md: "# Authentication and authorization in Spring Boot\n\nWe have already discussed\
    \ the concepts of Spring Security in the previous section; now, we will learn\
    \ how to integrate Spring Security into our Spring Boot application. As we move\
    \ on to the examples, we will be using all the modules and features of Spring\
    \ Boot Security.\n\nAuthentication and authorization are the most common concepts\
    \ that we come across when we implement security in our applications. These are\
    \ the two validations we apply for our application to be secure.\n\n# Configuring\
    \ Spring Boot and implementing authentication\n\nWe will first implement authentication\
    \ in our application. We first need to add the Spring Boot Security dependency\
    \ to our project. To add the dependency, we will add the following to pom.xml:\n\
    \n```\n<dependency>\n    <groupId>org.springframework.boot</groupId>\n    <artifactId>spring-boot-starter-security</artifactId>\n\
    </dependency>\n```\n\nReload the project to install the new dependency and run\
    \ the server. Let's try to visit localhost:8080 to open the Spring Boot application\
    \ project in the browser. As we can see, a login page is now applied to our project\
    \ as we've installed Spring Boot Security:\n\n![](img/7c3ddd2e5893c9b5a0220148ed886548_158_0.png)\n\
    \nFigure 7.1 – Login page integrated from Spring Boot Security\n\nTo create credentials\
    \ for the login, we can configure the username and password under the application.properties\
    \ file by placing the following setting:\n\n```\nspring.security.user.name=admin\n\
    spring.security.user.password=test\n```"
