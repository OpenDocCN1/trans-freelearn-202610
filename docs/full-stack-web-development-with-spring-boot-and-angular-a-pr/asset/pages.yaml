  md: "In the preceding code example, we have a `JunitAnnotationSequence` class that\
    \ has several annotated methods. When we execute the test, we will have the following\
    \ output:\n\n```\nbeforeClass()\nbefore()\ntestMethod1()\nafter()\nbefore()\n\
    testMethod2()\nafter()\nafterClass()\n```\n\nWe can see in the preceding example\
    \ that the methods annotated with `@BeforeClass` and `@AfterClass` are only called\
    \ once and they are called at the start and end of the test execution. On the\
    \ other hand, the methods annotated with `@Before` and `@After` are called at\
    \ the beginning and the end of each test method.\n\nWe have learned about the\
    \ basics of JUnit in unit testing; now, let’s discuss the concepts of AssertJ.\n\
    \n# Using AssertJ\n\nWe have just explored the concepts and features of JUnit\
    \ in the last part, and we have learned that in JUnit alone, we can apply assertions\
    \ using the Assert class, but we can make our assertions more fluent and flexible\
    \ by using AssertJ. AssertJ is a library mainly used for writing assertions; its\
    \ primary goal is to improve the readability of test code and make the maintenance\
    \ of tests simpler.\n\nLet’s compare how to write assertions in JUnit and AssertJ:\n\
    \n+   - JUnit checking whether the condition returns `true`:\n+   \n+     ```java\n\
    +     Assert.assertTrue(condition)\n+     ```\n+   \n+   - AssertJ checking whether\
    \ the condition returns `true`:\n+   \n+     ```java\n+     Assertions.assertThat(condition).isTrue()\n\
    +     ```\n\nWe can see in the preceding example that in AssertJ, we will always\
    \ pass the object to be compared in the `assertThat()` method, and we will call\
    \ the next method, which is the actual assertion. Let’s have a look at the different\
    \ kinds of assertions we can use in AssertJ."
