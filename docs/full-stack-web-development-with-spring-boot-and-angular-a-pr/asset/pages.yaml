    \ [CommonModule]\n})\n```\n\nWe can also add shared directives and pipes under\
    \ the shared folder by executing the ng g c shared/directive/directive-name and\
    \ ng g c shared/pipes/pipe-name commands depending on the needs of our application.\
    \ After successfully creating the blocks, we will have the following folder structure:\n\
    \n![](img/7c3ddd2e5893c9b5a0220148ed886548_246_0.png)\n\nFigure 10.7 – Folder\
    \ structure after creating the shared module"
