- pgno: 297
  md: 'In the preceding graphical illustration, we can see that we have four different
    services that are responsible for managing different kinds of data; each feature
    retrieves the data it needs from these services.


    As we can see, the retrieval that occurs is scattered as the features are retrieving
    the data on different sources or services. This results in multiple data flows,
    and they can get larger as more services and features are required.


    This can also lead to inconsistencies in data being held by each component as
    the source is coming from different services, leading to some unexpected bugs
    in the application. Now, let''s look at the flow of data with state management.


    # The flow of data with state management


    In the previous data flow, we saw that the flow of data is not optimized, which
    can result in several problems in our application as the data flow''s direction
    is very complex. When implementing state management in our Angular application,
    we will have the following data flow:


    ![](img/7c3ddd2e5893c9b5a0220148ed886548_297_0.png)


    Figure 12.2 – The flow of data with state management


    In the preceding graphical illustration, we can see that all of the services of
    our application are handled by state management. We are still using services to
    retrieve data in our database. The significant difference here is that our features
    are now accessing all the retrieved data in the state instead of directly accessing
    it in the services.


    This allows the data to flow in one direction and has a single origin for all
    the data being used in the application. With this approach, inconsistency in the
    states, possible bugs, and multiple API calls can be avoided.'
  merge: -1
  img_proc: true
- pgno: 298
  md: "With that, we have learned about the importance of state management in developing\
    \ applications, especially enterprise-level apps.\n\nNow, let’s discuss more state\
    \ management concepts and global states.\n\n# State management and the global\
    \ state\n\nState management, as discussed in the previous section, is an extension\
    \ or library that allows us to manage the flow of our data in the application\
    \ in just one direction.\n\nThis is possible due to global states, which will\
    \ contain all of the data. To understand how state management works, let’s discuss\
    \ each of the building blocks of state management.\n\n# Global state/store\n\n\
    The **global state**, also known as the **store**, is the most crucial element\
    \ in state management. The primary responsibility of a global state is to store\
    \ all the data retrieved by the API or simply data being used in the application.\n\
    \nThis means that all components in an Angular application will retrieve the data\
    \ in the global state. Think of it as a database of the Angular application but\
    \ in the form of a JSON object where we can get each property as slices.\n\n#\
    \ Actions\n\n**Actions** express unique events in your application. They are directly\
    \ called in our components using the `dispatch()` function, which helps identify\
    \ what events should be performed, such as modifying the state or calling APIs\
    \ to retrieve data.\n\nActions are just simple interfaces; the `type` property\
    \ identifies what action is dispatched. This simple string is just a definition\
    \ of the action, and we can add properties to the actions for the data we require\
    \ in the API or state.\n\nLet’s have a look at an example of an action interface:\n\
    \n```\n{\n  type: '[Blog] Add Blog',\n  title: string;\n  author: string;\n  content:\
    \ string;\n}\n```"
  merge: -1
  img_proc: true
- pgno: 299
  md: "The preceding example action is dispatched when a new blog is created. This\
    \ is called when the **Submit** button is clicked, and information such as `title`,\
    \ `author`, and `content` is added as additional metadata to be passed on to the\
    \ effect or reducer.\n\n# Reducers\n\n**Reducers** are the decision-makers of\
    \ state management. They are the ones that decide which actions to handle based\
    \ on the action type. Reducers are also the ones that can change the value of\
    \ the state.\n\nReducers are pure functions and handle state transitions synchronously;\
    \ let’s have a look at an example of a reducer:\n\n```\n```typescript\nexport\
    \ const blogReducer = createReducer( initialState,\n  on(BlogActions.addBlog,\
    \ (state, {blog}) => ({ ...state,\n    blogs: [...state.blogs, blog]})\n  );\n\
    ```\n```\n\nIn the preceding example, we have created a reducer for the `addBlog()`\
    \ action. This allows us to add a new blog object in the blog’s state once we\
    \ have dispatched the `addBlog()` action.\n\nWe will discuss reducers in more\
    \ detail later in the *Writing a reducer* section of this chapter.\n\n# Selectors\n\
    \n**Selectors** are pure functions that allow us to retrieve slices of data in\
    \ our store. It is a change detection mechanism where, when the value of the state\
    \ changes, it compares the parts of the state and only sends the state if the\
    \ changes are detected. This is a practice called **memorization**.\n\nSelectors\
    \ are used in components to get the data used in the UI. It is returned as an\
    \ Observable that listens to the state changes.\n\nLet’s look at an example of\
    \ a selector:\n\n```\n```typescript\n// selector for list of blogs\n// blog.selector.ts\n\
    export const selectBlogList = (state: AppState) => state.blogs;\n\n// blog component\n\
    // blog.component.ts\nblogs$ = this.store.select<Array<Blog>>(selectBlogList);\n\
    \  this.blogs$.subscribe(data => {\n```\n```"
  merge: -1
  img_proc: true
- pgno: 300
  md: "```\nconsole.log(data) // list of blogs from the state;\n});\n```\n\nIn the\
    \ preceding example, we have created a selector for the blog slice, as well as\
    \ a function that returns the blogs metadata, called selectBlogList(). We used\
    \ this function in our blog component as a parameter for the select function to\
    \ retrieve the data by subscribing to the selector. The subscription will emit\
    \ once the value of the blog's slice changes. We will discuss selectors in more\
    \ detail in the next section of this chapter.\n\n# Effects\n\nEffects are specific\
    \ elements that the NgRx library uses; this is an RxJs-powered side effect model\
    \ that handles external interactions such as API calls, web socket messages, and\
    \ time-based events. Using effects, we can isolate our components from interacting\
    \ with external sources and reduce their responsibilities. Let's look at a comparison\
    \ between an application with and without side effects.\n\n# Application without\
    \ side effects\n\nThe following is an application without side effects:\n\n```\n\
    export class BlogPageComponent {\n  movies: Blog[];\n  constructor(private blogService:\
    \ MoviService) {}\n  ngOnInit() {\n    this.blogService\n      .getAll()\n   \
    \   .subscribe(blogs => this.blogs = blogs);\n  }\n}\n```\n\nIn the preceding\
    \ code example, we have a component that has several responsibilities, as follows:\n\
    \n+   - Managing the state of the blogs (the component has its blog state)\n+\
    \   - Using the blog service to call an external API to get the list of blogs\n\
    +   - Modifying the state of the blog inside the component\n\nThis means that\
    \ every component with a service dependency also has its state of data. Now, let's\
    \ look at an example of an application with side effects."
  merge: -1
  img_proc: true
- pgno: 301
  md: "# Application with side effects\n\nThe following is an application with side\
    \ effects:\n\n```\n```typescript\nexport class BlogsPageComponent {\n  blogs$:\
    \ Observable<Blog[]> = this.store.select(state =>\n    state.blog);\n\n  constructor(private\
    \ store: Store<{ blogs: Blog[] }>) {}\n\n  ngOnInit() {\n    this.store.dispatch({\
    \ type: '[Blog Page] Load Blog' });\n  }\n}\n```\n```\n\nIn the preceding code\
    \ example, we can see that the code for our blog page component has been reduced,\
    \ and, at the same time, its responsibility is also less complex. Now, the component’s\
    \ responsibility is to dispatch an action that will allow effects to identify\
    \ what service needs to be called to retrieve the data.\n\nLet’s look at an example\
    \ effect for the blog state:\n\n```\n```typescript\n@Injectable()\nexport class\
    \ BlogEffects {\n  loadBlogs$ = createEffect(() => this.actions$.pipe(\n    ofType('[Blog\
    \ Page] Load Blog'),\n    mergeMap(() => this.blogService\n      .getAll().pipe(\n\
    \        map(blogs => ({ type: '[Blogs API] Blogs Loaded\n          Success',\
    \ payload: blogs })),\n        catchError(() => EMPTY)\n      )\n    )\n  );\n\
    \  constructor(private actions$: Actions,\n              private blogService:\
    \ BlogService) {}\n}\n```\n```"
  merge: -1
  img_proc: true
- pgno: 302
  md: 'In the preceding code example, we created a new effect named loadBlogs$. This
    effect is responsible for calling the getAll() method from the blog service to
    retrieve the list of blogs from the external endpoint. At the same time, it is
    also responsible for dispatching a new action that passes the retrieved blog list
    into the reducer to modify the store. We will discuss how to write effects in
    the next section of this chapter.


    With that, we''ve seen all of the building blocks that make up state management.
    Let''s look at a detailed graphical illustration of how data flows in state management:


    ![](img/7c3ddd2e5893c9b5a0220148ed886548_302_0.png)


    Figure 12.3 – How data flows when using NgRx state management


    In the preceding graphical illustration, we can see that our UI components have
    only one responsibility, and this is to dispatch actions. If the action needs
    to call an API, an effect will be called to invoke an API using a service, and
    after getting the response data, the effect will also dispatch an action to call
    a reducer to modify the store.


    On the other hand, if the action that''s sent from the component will alter the
    state, it will not need any side effects and call the reducer that matches the
    type of the action. All of the changes in the store will be detected by the selectors
    and emit the latest state to be used in the UI components.


    With that, we have learned about the necessary concepts surrounding state management
    and how data flows together with the building blocks of state management. In the
    next section, we will learn how to set up and configure one of the most famous
    state management libraries in Angular: NgRx.'
  merge: -1
  img_proc: true
- pgno: 303
  md: "# Getting started and setting up NgRx\n\nTo use NgRx state management, we must\
    \ install the @ngrx/store library; this will contain all of the functions that\
    \ will allow us to configure the store and create reducers and actions.\n\nTo\
    \ install the @ngrx/store library, we must execute the following command:\n\n\
    ```\nng add @ngrx/store\n```\n\nThe preceding command will perform the following\
    \ steps:\n\n+   1. Update package.json by adding @ngrx/store to the dependencies.\n\
    +   2. Run npm install to install the dependencies.\n+   3. Update src/app/app.module.ts\
    \ by adding StoreModule.forRoot(reducers, {}) to the imports array.\n\nBefore\
    \ executing this command, make sure that the version of @ngrx/store is aligned\
    \ with the version of your Angular; in our project, our Angular version is version\
    \ 13.3.0, which means that we need to use version 13 of @ngrx/store.\n\nFlags\
    \ are also available that allow us to install @ngrx/store with customizations.\
    \ The following is the list of flags we can use:\n\n+   - --path: Specifies the\
    \ path to the module where you want to import StoreModule.\n+   - --project: The\
    \ name of the project that is defined in angular.json.\n+   - --module: The name\
    \ of the file containing the module where you want to import StoreModule.\n+ \
    \  - --minimal: This provides the minimal setup for the root state management\
    \ if set to true. It imports StoreModule.forRoot() in the module with an empty\
    \ object.\n+   - --statePath: This is the path where the state will be created.\n\
    +   - --stateInterface: The interface that defines the state.\n\n# Adding NgRx\
    \ to our Angular project\n\nNow, let's add this to our Angular project. We only\
    \ want to use the minimal setup as we will add the reducers and store step by\
    \ step. After successfully executing the ng add @ngrx/store command, we will have\
    \ the following changes in our project:\n\n```\n// app.module.ts\nimports: [\n\
    \  ... other modules\n  StoreModule.forRoot({}, {}),\n```"
