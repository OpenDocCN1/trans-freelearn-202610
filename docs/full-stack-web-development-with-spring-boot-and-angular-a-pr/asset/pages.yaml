- pgno: 375
  md: "In the next section, we will start writing some simple Cypress tests to help\
    \ you gain confidence in writing tests and see how easy it is to write tests in\
    \ Cypress.\n\n# Writing Cypress tests\n\nIn this section, we will start writing\
    \ simple Cypress tests to see how fun and easy it is to write tests using Cypress.\
    \ We will start the tests by adding a test attribute in an HTML tag in the authentication\
    \ form. We are going to edit the auth-form.component.html file to write the test-id\
    \ attribute. Here is what was changed in the auth-form.component.html line:\n\n\
    ```\n<mat-card-title data-cy=\"auth-title\">{{title}}</mat-card-title>\n```\n\n\
    You can see the attribute we added in the preceding code. data-cy is an attribute\
    \ for the test ID that Cypress will use to target the HTML element we want to\
    \ test.\n\nNow that we've added our first test ID, let's go to the e2e folder\
    \ inside the cypress directory and create a new file. The filename needs to contain\
    \ .cy. Name the new file anti-heroes.cy.ts and then add the following code:\n\n\
    ```\n/// <reference types=\"cypress\"/>\n\ndescribe(\"Anti Heroes Page\", () =>\
    \ {\n  // basic test\n  it(\"should display login page\", () => {\n    cy.visit(\"\
    /\");\n    cy.url().should(\"include\", \"/login\");\n    cy.get(\"[data-cy=auth-title]\"\
    ).should(\"contain\", \"Login\");\n  });\n});\n```\n\nThe preceding code provides\
    \ the first description of our test. First, we are adding a reference to the Cypress\
    \ types to get extra tooling using TypeScript.\n\nThen, we have the describe function,\
    \ which is used for group tests. The describe function has two arguments. The\
    \ first argument is a string, and it passes the name that the describe function\
    \ will use. The second argument is a callback function that will contain all tests\
    \ under the describe function.\n\nThe it function also accepts a string for the\
    \ name of the test and a callback function for the details of the tests. The first\
    \ it function tests whether an authenticated user can see the login page if the\
    \ user visits the root domain of the Angular app's URL."
  merge: -1
