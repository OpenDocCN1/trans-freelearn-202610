  md: '# Connecting to a database using a PSQL container


    This section will teach us how to set up and configure our PostgreSQL in our terminal
    by using the conventional method, using the installer, or through a Docker container.
    But first, let’s discuss what PostgreSQL is and what its advantages are.


    # PostgreSQL


    **PostgreSQL** is an open source object-relational database system that uses the
    SQL language to store and handle complicated and large workloads. PostgreSQL also
    supports both *SQL (relational)* and *JSON (non-relational)* querying. It is commonly
    used as primary data storage for geospatial and analytics applications because
    of its flexibility and rich features. Its community has improved and continuously
    backed it for more than 20 years to add more features and reliability to the database
    system.


    PostgreSQL’s flexibility means that it is widely used in developing applications.
    Here are some of the everyday use cases:


    +   - **Scientific data**: Research projects can be demanding in storing data,
    which requires effective and efficient handling. PostgreSQL provides analytical
    features and a powerful SQL engine that can process a large amount of data.

    +   - **Financial industry**: PostgreSQL is used in financial companies because
    of its analytical capabilities and easy integration with mathematical software
    such as MATLAB and R.

    +   - **Web applications**: PostgreSQL is also used widely in web applications
    because apps nowadays require processing thousands of pieces of data. It is compatible
    with modern web frameworks such as Node.js, Hibernate PHP, and Django.

    +   - **Government GIS data**: PostgreSQL offers extensions such as PostGIS that
    provide functions to process geometric data.


    # *The features of PostgreSQL*


    Here’s a list of some of the features that PostgreSQL offers:


    +   - **Compatibility with multiple data types**: PostgreSQL is compatible with
    several data types:

    +     - **Structured**: Arrays, date and time, **Universally Unique Identifiers
    (UUIDs)**, and range

    +     - **Customizations**: Custom types, and composite

    +     - **Primitives**: String, integer, numeric, and Boolean

    +     - **Geometry**: Polygon, circle, line, and point

    +     - **Document**: XML, JSON/JSONB, and key-value'
  merge: -1
  img_proc: true
