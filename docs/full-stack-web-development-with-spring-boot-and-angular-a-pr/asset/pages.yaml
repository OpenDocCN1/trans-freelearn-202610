- pgno: 339
  md: '# # Adding Authentication

    ## in Angular


    In the previous chapter, we completed the CRUD features of our Angular application
    using the building blocks of NgRx. We also learned the step-by-step process of
    writing the actions, reducers, and effects in our application that will be used
    to modify the value of states. We also learned the difference between using and
    not using effects in the application. Effects are essential for us to communicate
    with the external APIs that allow the database changes to be synced in the NgRx
    store.


    In this chapter, we will learn how to add authentication in our Angular application;
    we will implement a login page that will provide a valid JWT, protect routes,
    and apply API authentication with the use of NgRx.


    In this chapter, we will cover the following topics:


    +   - Adding user authentication

    +   - Protecting routes

    +   - Calling an API


    # ## Technical requirements


    The complete code for this chapter can be found at: https://github.com/PacktPublishing/Spring-Boot-and-Angular/tree/main/Chapter-14.


    # ## Adding user authentication


    Adding user authentication is one of the main requirements in developing an application.
    This feature allows us to restrict pages and features from unauthorized users.
    We can achieve user authentication in different ways, and one way to implement
    this is by providing a login page that will ask for credentials.


    Let’s have a look at the step-by-step process of implementing the authentication
    feature.'
  merge: -1
  img_proc: true
- pgno: 340
  md: "# The authentication API\n\nLet us first recap the authentication API we created\
    \ in our Spring Boot project. The endpoints for authentication are as follows:\n\
    \n+   - `{BASE_URL}/authenticate`: The main endpoint for authentication accepts\
    \ an object with email and password fields and returns a valid JWT that will be\
    \ used for calling endpoints. The following is an example response object of the\
    \ endpoint:\n\n```\n// valid JWT\n{\n  \"token\": \"eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiJOZXN0QGDtYW1sLmNvbSIImIhdCI6MTY1OTQyODk2MSwiZXhwIjIoxNjUSNDY0OTYxfQ.WU_aZjmI\
    \ fw--LCovx4cZ4_hcOTGiAgPnSaM0bjdv018\"\n}\n```\n\n+   - `{BASE_URL}/register`:\
    \ The endpoint for creating new valid credentials for login. JWT, as stated in\
    \ Chapter 7, Adding Spring Boot Security with JWT, is used chiefly on RESTful\
    \ web services that cannot maintain a client state since JWT holds some information\
    \ connected to the user. This will be used primarily in the headers of endpoints\
    \ that we will request.\n\nIn our project, let’s create a service named AuthenticateService\
    \ under the core/services folder by executing the following command:\n\n```\n\
    ng g core/services/authenticate\n```\n\nAfter successfully creating the service,\
    \ we will place the following code in the service:\n\n```\nexport class AuthenticateService\
    \ {\n\n  constructor(private http: HttpClient) { }\n  // for login endpoint\n\
    \  login(data: {email: string, password: string}): Observable<any> {\n    return\
    \ this.http.post<any>(\n      `${environment.authURL}/authenticate`,\n      data).pipe(\n\
    \      tap((data: any) => data),\n      catchError(err => throwError(() => err))\n\
    \    )\n  }\n  // for register endpoint\n  register(data: {email: string, password:\
    \ string}):\n```"
