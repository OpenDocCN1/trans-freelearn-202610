- pgno: 70
  md: "# Field-based dependency injection\n\nAs the name suggests, **field-based dependency\
    \ injection** is a concept where we inject the object’s dependencies directly\
    \ into the fields. We will not create a constructor or a setter method to inject\
    \ our dependencies, but we will use the @Autowired annotation for injection.\n\
    \nLet’s see the following example of injecting dependencies into a field:\n\n\
    ```\npackage com.springexample;\n\n/* Class for Student */\npublic class Student\
    \ {\n    @Autowired\n    private Grades grades;\n}\n```\n\nIn the preceding example\
    \ code, we can see that we didn’t create a constructor or a setter method to inject\
    \ our dependency. Instead, we only used the @Autowired annotation to inject the\
    \ Grades object.\n\nThe field-based injection may be clean at first glance, having\
    \ only annotations in our code and fewer methods, but many things happen behind\
    \ our @Autowired dependency. For example, it uses reflection to inject dependencies\
    \ that are costlier than a constructor and setter-based injection; it also violates\
    \ the **single responsibility principle**. We can add more dependencies directly\
    \ in the fields without warning.\n\nWe have learned the basics of dependency injection\
    \ and the different ways to implement it in our Java application. Now, we will\
    \ discuss the concept and importance of annotations and beans in Spring.\n\n#\
    \ Annotation and beans\n\n**Annotation and beans** are essential parts of developing\
    \ your Spring applications. They are considered the building blocks of Spring\
    \ and make our code less boilerplate and maintainable.\n\n**Spring annotations**\
    \ are used to define the different types of beans. They are simply a form of metadata\
    \ that marks our code to provide information. Conversely, **beans** are objects\
    \ that are instantiated and created and can be injected with other beans. We will\
    \ discuss more as we go through this section.\n\n# Types of annotations\n\nAnnotations\
    \ in Spring are categorized into different types depending on their functionality.\
    \ The following are annotations grouped into their respective categories."
  merge: -1
  img_proc: true
- pgno: 71
  md: "# Core annotations\n\n**Core annotations** are used to leverage the Spring\
    \ DI engine in our applications. They can be found in the `org.springframework.beans.factory.annotation`\
    \ and `org.springframework.context.annotation` packages. The following is a list\
    \ of core annotations:\n\n+   - `@Required`: This is applied in the setter methods\
    \ of a bean and implies that the bean must be injected with the dependency at\
    \ configuration. Otherwise, it will throw `BeanInitializationException`. Let’s\
    \ look at the following example of how to use the `@Required` annotation:\n\n\
    ```\npublic class Car\n{\nprivate String brand;\n@Required\n    public void setBrand(String\
    \ brand)\n    {\n        this.brand = brand;\n    }\n    public Integer getBrand()\n\
    \    {\n        return brand;\n    }\n}\n```\n\nIn the preceding example, we can\
    \ see that the `setBrand()` method was annotated with `@Required`; this indicates\
    \ that the brand must be populated on initialization.\n\n+   - `@Autowired`: We\
    \ have encountered the `@Autowired` annotation several times in DI, and this is\
    \ mainly used to inject dependencies without the use of constructors and setter\
    \ methods. Let’s look at the following example of how to use the `@Autowired`\
    \ annotation:\n\n```\npackage com.springexample;\n\npublic class Car {\n    @Autowired\n\
    \    private Brand brand;\n}\n```\n\nWe can see in the preceding example that\
    \ `@Autowired` is applied directly in the field. This is because the annotations\
    \ use reflection to inject dependencies, with more processes involved than constructors\
    \ and setter methods."
  merge: -1
  img_proc: true
- pgno: 72
  md: "+   - @ComponentScan: The annotation is a class-level annotation to indicate\
    \ the packages we want to be scanned for beans. @ComponentScan can accept arguments\
    \ about what specific packages are to be scanned, and not providing any will allow\
    \ the current packages and all sub-packages. Let’s look at the following example\
    \ of how to use @ComponentScan:\n\n```\n@Configuration\n@ComponentScan\npublic\
    \ class SpringApp\n{\n    private static ApplicationContext\n        applicationContext;\n\
    \    @Bean\n    public SpringBean springBean()\n    {\n        return new SpringBean();\n\
    \    }\n    public static void main(String[] args) {\n        applicationContext\
    \ = new\n            AnnotationConfigApplicationContext(\n                SpringComponentScanApp.class);\n\
    \    }\n}\n```\n\nWe can see in the preceding example that the @ComponentScan\
    \ app is applied to the Spring App class, and it is usually implemented together\
    \ with the @Configuration annotation. Let’s say that SpringApp is found under\
    \ the com.example.spring.app package; this will scan the package and its sub-packages\
    \ if there are existing beans.\n\n+   - @ComponentScan: The annotation is also\
    \ a class-level annotation to indicate that a class is the source of bean definitions\
    \ that the Spring container will process at runtime. Let’s look at the following\
    \ example of how to use the @ComponentScan annotation:\n\n```\n@Configuration\n\
    public class SpringApp {\n    @Bean(name=\"demoBean\")\n    public DemoBean service()\n\
    \    {\n    }\n}\n```"
