- pgno: 201
  md: '# # Writing Tests in Spring Boot


    In the previous chapter, you have learned about the importance of loggers, their
    concepts, and how they can help developers debug and maintain applications. You
    have learned about Log4j2, which is a third-party framework for Spring Boot that
    offers several features such as **Appenders**, **Filters**, and **Markers** that
    can assist in making log events categorized and formatted for developers. We have
    also discussed SLF4J, which is an abstraction of logging frameworks that allows
    us to switch between different frameworks during runtime or at deployment, and
    lastly, we have implemented and configured the logging frameworks with XML configuration
    and Lombok.


    This chapter will now focus on writing unit tests for our Spring Boot application;
    we will discuss the most commonly used testing frameworks with Java, JUnit, and
    AssertJ and implement them in our application. We will also be integrating Mockito
    with our unit test for mocking objects and services.


    In this chapter, we will cover the following topics:


    +   - Understanding JUnit and AssertJ

    +   - Writing a test

    +   - Writing tests in a service using Mockito


    # ## Technical requirements


    The link to the finished version of this chapter is here: https://github.com/PacktPublishing/Spring-Boot-and-Angular/tree/main/Chapter-09.


    # ## Understanding JUnit and AssertJ


    After every development of an application, testing will always be the next step,
    and this is one of the most important tasks before delivering or deploying our
    application into production for the world. The testing phase is critical for companies,
    as this ensures the quality and effectiveness of their products.'
  merge: -1
  img_proc: true
- pgno: 202
  md: 'As this is one of the essential processes, there should be little room for
    errors in testing, and manual testing is not enough, as this is prone to human
    errors and has a more significant chance of missing the existing issues in an
    application. This is where unit testing comes to the rescue – unit testing is
    automated testing that allows the developer to write tests for a single class
    or entity.


    It is a form of **regression testing** that runs all of the tests to validate
    whether the code still passes the test cases after several changes or updates
    have been applied to the application code. Unit tests help maintain the quality
    of our applications, as they bring the following benefits:


    +   - **Speed:** Unit testing will be less time-consuming compared to manual testing,
    as this is programmable and will deliver the results in a short period.

    +   - **Cost reduction:** Unit testing is automated, which means fewer testers
    will be required for testing the application.

    +   - **Fewer errors:** Unit testing will significantly reduce the number of errors
    made, as testing is not done manually by humans.

    +   - **Programmable:** Unit tests can produce sophisticated tests that detect
    hidden information in the application.


    Unit tests are widely used now in both frontend and backend development, especially
    in Java, because of their advantages and testing. There are already several testing
    frameworks available in Java, but we will discuss the first and most commonly
    used framework, **JUnit**.


    # JUnit framework


    JUnit is a regression testing framework mainly used for writing tests and assertions
    for single classes in a Java application; it promotes the idea of *first testing
    and then coding*, which states that we need to create test data for a piece of
    code to be tested before implementation. JUnit is also an open source framework,
    which makes it more reliable.


    There is a large community supporting the framework, it uses assertions to test
    expected results and annotations to identify the methods for testing, and it can
    be efficiently utilized and integrated with Maven and Gradle projects.


    Let’s discuss the features of JUnit that we will use for writing tests:


    +   - **Fixtures:** These are objects that we can consider constants or the baseline
    for running tests. The primary use of fixtures is to ensure that variables that
    have the same value throughout testing will be used. There are two types of fixtures,
    and these are as follows:

    +     - `setUp()`: This method is executed *before* every test is invoked.'
  merge: -1
