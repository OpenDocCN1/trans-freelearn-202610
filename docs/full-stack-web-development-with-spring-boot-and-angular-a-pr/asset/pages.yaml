    We have configured the PostgreSQL database in our terminal. Now, we will learn
    about Spring Data JPA and its importance in developing Spring applications.


    # Spring Data JPA


    Spring Data JPA (Java Persistence API) is a widely used specification for managing
    relational data in Java applications. It helps develop Spring, as it reduces boilerplate
    code by not implementing read and write operations. It also handles the complex
    process involved in JDBC-based accessing of database and object-relational mappings.


    Before discussing Spring Data JPA, let’s discuss its clear advantages and why
    it is commonly used in Spring development.


    # The advantages of Spring Data JPA


    The following are the advantages of Spring Data JPA:


    +   - **No-code repositories**: Spring Data JPA promotes *no-code* repositories,
    which means that we don''t have to write the repository pattern, which creates
    a lot of repetitive code. It provides a set of interfaces that we can use to extend
    our classes to apply data-specific implementations.'
  merge: -1
  img_proc: true
- pgno: 88
  md: 'For example, we have a BlogRepository class in our application; when we extend
    it with the CrudRepository<Blog, Long> interface, it will have methods that have
    the following functionalities:


    +   - Persisting, updating, and deleting one or multiple blog entities

    +   - Finding one or multiple blogs by their primary keys

    +   - Counting all blogs

    +   - Validating whether a single blog exists


    Extending the repository with the interface provided by Spring Data JPA includes
    all data-related methods, which allows us to focus more on business logic.


    +   - **Boilerplate reduction:** Spring Data JPA offers built-in implementations
    for methods. As stated in the first advantage, we only need to focus on business
    logic and no longer need to code read and write operations, as written under the
    interfaces. This also prevents human errors, as all implementations are already
    registered for us.

    +   - **Generated queries:** Spring Data JPA also can create queries based on
    method names. For example, if we wanted to query a single blog by an author, the
    only step we need to take is to create a method on our interface with a name that
    starts with findBy, and Spring will parse the name and create a query:


    ```

    public interface BlogRepository

    extends CrudRepository<Blog, Long> {

    Blog findByAuthor(String author);

    }

    ```


    In the preceding example, we have created a findByAuthor() method, which will
    allow Spring to generate a query and set the parameters as bind parameter values.
    It will execute the query once we call the method.


    # Repositories provided by Spring Data JPA


    Spring Data JPA provides repositories that provide different methods for data-related
    implementations. The repositories are the following:


    +   - CrudRepository: The interface repository, which provides the basic operations
    to Create, Read, Update, and Delete (CRUD).

    +   - PagingAndSortingRepository: Extends CrudRepository and adds a method named
    findAll, which can sort results and be retrieved in a paginated manner.

    +   - JpaRepository: Adds specific JPA methods and has all the functions of CrudRepository
    and PagingAndSortingRepository. It also adds methods such as flush(), which flushes
    the persistence context, and deleteInBatch(), which deletes records in a batch.'
