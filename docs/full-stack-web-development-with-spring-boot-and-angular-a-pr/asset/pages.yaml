  md: "We can see in the preceding example that the @Configuration annotation is applied\
    \ to the SpringApp class, which indicates that SpringApp will be the source of\
    \ beans.\n\n+   - @Bean: The annotation is a method-level annotation, and it is\
    \ used to tell a method to produce a bean. Let’s look at the following example\
    \ of how to use the @Bean annotation:\n\n```\n@Configuration\npublic class AppConfig\
    \ {\n    @Bean\n    public BeanExample beanExample() {\n        return new BeanExampleImpl();\n\
    \    }\n}\n```\n\nIn the preceding example, the @Bean annotation is applied to\
    \ the beanExample method. Once JavaConfig encounters the method, it will be executed\
    \ and register the return value as a bean in BeanFactory, and the name will be\
    \ the same as the method name when none is specified.\n\nThe @Bean annotation\
    \ can also be configured in Spring XML, and the equivalent configuration is the\
    \ following:\n\n```\n<beans>\n    <bean name=\"transferService\"\n        class=\"\
    com.acme.TransferServiceImpl\"/>\n</beans>\n```\n\n# Stereotype annotations\n\n\
    Stereotype annotations are mainly used to create Spring beans on the fly in an\
    \ application context.\n\nThe following is a list of stereotype annotations:\n\
    \n+   - @Component: This is the primary stereotype annotation. As with the @Bean\
    \ annotation, the @Component annotation is used to define a bean or a Spring component.\
    \ The difference between the two is that @Component is applied at the class level\
    \ while @Bean is applied at the method level.\n\nThe other difference is that\
    \ the @Component class cannot also be used to create a bean if the class is outside\
    \ the Spring container, whereas we can create a bean using @Bean even if the class\
    \ is found outside the Spring container. Let’s look at the following example of\
    \ how to use the @Component annotation:\n\n```\n@Component\npublic class Car\n\
    ```"
