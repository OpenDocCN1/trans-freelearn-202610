  md: "# Creating a CI workflow or pipeline\n\nIn this section, we will automate the\
    \ deployment of our full-stack application by using a workflow in GitHub Actions.\
    \ Follow these steps:\n\n+   1. Go to the GitHub repository of your project, then\
    \ click on the Actions tab. Search for Publish Java Package and pick the Maven\
    \ workflow:\n\n![](img/7c3ddd2e5893c9b5a0220148ed886548_412_0.png)\n\nFigure 17.10\
    \ shows the basic and ready-made Maven workflow for building Maven projects.\n\
    \n+   2. Change the content of the YAML file in the editor by replacing it with\
    \ the following YAML configuration:\n\n```\nname: CICD\n\non:\n  push:\n```"
  merge: -1
  img_proc: true
- pgno: 413
  md: "```\nbranches:\n  - master\n\njobs:\n  test:\n    name: Build and Test\n  \
    \  runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v2\n   \
    \   - name: Set up JDK 17\n        uses: actions/setup-java@v2\n        with:\n\
    \          java-version: '17.0.*'\n          distribution: 'temurin'\n       \
    \   cache: maven\n      - name: test with Maven\n        run: mvn test\n\n  deploy:\n\
    \    name: Deploy to Heroku\n    runs-on: ubuntu-latest\n    needs: test\n   \
    \ steps:\n      - uses: actions/checkout@v2\n        # This is the action\n  \
    \    - uses: akhileshns/heroku-deploy@v3.12.12\n        with:\n          heroku_api_key:\
    \ ${{secrets.HEROKU_API_KEY}}\n          heroku_app_name: \"appname\" #Must be\
    \ unique\n                          #in Heroku\n          heroku_email: \"email\"\
    \n```\n\nThe preceding code is the workflow for our full-stack application’s CI/CD.\
    \ It’s called CI CD because that’s what this workflow is for.\n\nThe workflow\
    \ has one event, push, which will cause the workflow to run if there’s a push\
    \ in the master branch."
  merge: -1
  img_proc: true
