- pgno: 325
  md: "```\n```html\n<app-anti-hero-list [antiHeroes]=\"antiHeroes\"\n(antiHero)=\"\
    selectAntiHero($event)\" [headers]=\"headers\"></app-\nanti-hero-list>\n```\n\
    ```\n\nIn the preceding code example, we created a function that checks the action\
    \ triggered by the user with the TableActions value. If TableActions has a delete\
    \ value, we will dispatch REMOVE_ANTI_HERO_STATE and pass the ID of the anti-hero\
    \ object that will be used by the reducer we have created.\n\nWe have now successfully\
    \ implemented the delete feature of our application with NgRx, but in this case,\
    \ we are only deleting the items in our UI, and we are not syncing the changes\
    \ in the database.\n\nIn the next section, we will implement the use of side effects\
    \ in the deleting of data.\n\n# Removing an item with side effects using NgRx\n\
    \nIn this section, we will improve the delete functionality by adding effects\
    \ in our state. Our current delete feature only removes the data in the store\
    \ but does not sync the changes in the database. This means that if we refresh\
    \ our application, the data that we have deleted will be available again.\n\n\
    To sync the changes in the database, what we should do is create an effect that\
    \ will invoke the delete API. Let’s have a look at the step-by-step changes in\
    \ our code in the following sections.\n\n# Creating a new action type\n\nThe first\
    \ step we need to do is create a new action type. The effects in NgRx will use\
    \ the new action type for deleting feature later.\n\nWe will add REMOVE_ANTI_HERO_API\
    \ in the AntiHeroActions enum under the anti-hero/state/anti-hero.actions.ts file.\n\
    \nLet’s have a look at the added action in the following code:\n\n```\n```typescript\n\
    export enum AntiHeroActions {\n  GET_ANTI_HERO_LIST = '[Anti-Hero] Get Anti-Hero\
    \ list',\n  SET_ANTI_HERO_LIST = '[Anti-Hero] Set Anti-Hero list',\n  REMOVE_ANTI_HERO_API\
    \ =\n    '[Anti-Hero] Remove Anti-Hero (API)',\n  REMOVE_ANTI_HERO_STATE =\n \
    \   '[Anti-Hero] Remove Anti-Hero (STATE)',\n}\n```\n```\n\nWe can see in the\
    \ preceding code example that a new action type was added for our actions. Take\
    \ note that we do not need to create a new action for this type as we will be\
    \ calling an effect instead of an action once this action type is dispatched."
  merge: -1
  img_proc: true
- pgno: 326
  md: "# Creating the delete effect\n\nThe next step we need to do is to create the\
    \ effect for the delete feature. In the `anti-hero/state/anti-hero.effect.ts`\
    \ file, we will add the following code:\n\n```\n```typescript\n// See full code\
    \ on https://github.com/PacktPublishing/Spring-\nBoot-and-Angular/tree/main/Chapter-13\n\
    removeAntiHero$ = createEffect(() => {\n  return this.actions$.pipe(\n    ofType(AntiHeroActions.REMOVE_ANTI_HERO_API),\n\
    \    mergeMap((data: { payload: string }) =>\n      this.antiHeroService.deleteAntiHero(data.payload)\n\
    \        .pipe(\n          map(() => ({ type:\n            AntiHeroActions.REMOVE_ANTI_HERO_STATE,\n\
    \            antiHeroId: data.payload })),\n          catchError(() => EMPTY)\n\
    \        )\n    )\n  )\n}, { dispatch: true }\n);\n```\n```\n\nIn the preceding\
    \ code example, we can see that we have created a new effect for our delete action;\
    \ this has a type of `REMOVE_ANTI_HERO_API`, which calls the `deleteAntiHero()`\
    \ function in `AntiHeroService` for the data deletion based on the passed ID,\
    \ and once the API is successful.\n\nThe effect will dispatch another action,\
    \ `REMOVE_ANTI_HERO_STATE`, which we created in the previous section, which removes\
    \ the anti-hero from the store. This means that the data we delete from the database\
    \ will also be deleted from our NgRx store.\n\n# Modifying the dispatch\n\nThe\
    \ last step for this feature is to modify the action being dispatched in the `list.component.ts`\
    \ file. In the previous section, we call the `REMOVE_ANTI_HERO_STATE` action directly\
    \ in our component; we will change this into `REMOVE_ANTI_HERO_API` as we should\
    \ now call the effect, which will invoke the API and at the same time will call\
    \ the `REMOVE_ANTI_HERO_STATE` action."
  merge: -1
  img_proc: true
- pgno: 327
  md: "Let’s have a look at the following code example:\n\n```\nselectAntiHero(data:\
    \ {antiHero: AntiHero, action: TableActions}) {\n  switch(data.action) {\n   \
    \ case TableActions.Delete: {\n      this.store.dispatch({type:\n        AntiHeroActions.REMOVE_ANTI_HERO_API,\n\
    \        payload: data.antiHero.id});\n      return;\n    }\n    default: \"\"\
    \n  }\n}\n```\n\nIn the preceding code example, we are now dispatching the effect\
    \ in our list component. This will call the API first before updating our store\
    \ in the application; the changes in our store and database are synced.\n\nIn\
    \ the next section, we will implement the addition of data with side effects to\
    \ our application.\n\n# Adding an item with side effects using NgRx\n\nIn this\
    \ section, we will implement the add functionality with side effects in NgRx.\
    \ The steps are similar to how we implemented the delete feature. We will create\
    \ the building blocks step by step and create the dispatch logic in our component.\n\
    \n# Creating the actions\n\nThe first step we need to do is create the required\
    \ action types and actions for our add feature. To implement the actions, we can\
    \ think of how we created the actions for the delete feature.\n\nThe concept is\
    \ the same. There are two action types that we need to create, and these are ADD_ANTI_HERO_API\
    \ and ADD_ANTI_HERO_STATE. The first type will be used by the effect that will\
