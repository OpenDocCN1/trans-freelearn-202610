- pgno: 129
  md: '# Documenting APIs with the OpenAPI Specification


    In the previous chapter, we learned how to develop our Spring Boot application.
    First, we configured our application to run on the server using IntelliJ. Then,
    we developed the different parts of the REST application, such as the models and
    entities, which serve as the objects; the services, which hold the business logic
    and call the JPA repository to perform CRUD operations in the database; and the
    controllers, which define the endpoints. We also learned how to apply Redis, which
    adds a caching mechanism to improve the performance of our REST APIs.


    This chapter will focus on creating the documentation for our Spring Boot project.
    We will focus on configuring `springdoc-openapi` and Swagger UI and generating
    documentation on the fly for the endpoints that we have developed.


    In this chapter, we will cover the following topics:


    +   - Setting up `springdoc-openapi`

    +   - Setting up Swagger UI


    # Technical requirements


    The following link will take you to the finished version of this chapter: https://github.com/PacktPublishing/Spring-Boot-and-Angular/tree/main/Chapter-06/superheroes.


    # Setting up springdoc-openapi


    In this section, we will configure `springdoc-openapi` in our Spring Boot application.
    Since we developed our REST APIs in the previous chapter, the next thing we need
    to do is create documentation for our endpoints. This is an essential part, especially
    in the development industry, as this will tell the developers what endpoints can
    be implemented, what the required requests and their formats are,'
  merge: -1
  img_proc: true
- pgno: 130
  md: 'and what response body to expect when calling the endpoint. This also reduces
    errors and conflicts regarding the API integration as the available endpoints
    are transparent. However, the major drawback of creating documentation manually
    is that it is tedious and error-prone. This is where springdoc-openapi comes into
    the picture.


    First, let’s discuss what springdoc-openapi is. springdoc-openapi is a library
    that automates the generation of API documentation in Spring Boot projects. This
    automation is possible as the library uses annotations, class structures, and
    Spring configurations to identify the available APIs.


    springdoc-openapi can generate the necessary documentation in JSON/YAML and HTML
    APIs that can be viewed with a newly generated URL on our application. It also
    supports several frameworks and protocols, including the following:


    +   - spring-boot

    +   - JSR-303, specifically for @NotNull, @Min, @Max, and @Size

    +   - swagger-ui

    +   - OAuth 2


    Now, let’s discuss the properties and plugins of springdoc-openapi.


    # The properties of springdoc-openapi


    We can modify the behavior and settings of springdoc-openapi based on our preference.
    It has different properties, as we can set their values under the application.properties
    file.


    Here are some of the commonly used properties in springdoc-openapi:


    +   - springdoc.swagger-ui.path: The default value is /swagger-ui.html. It defines
    the path to access the HTML documentation.

    +   - springdoc.swagger-UI.enabled: The default value is true. It enables or disables
    the swagger-UI endpoint.

    +   - springdoc.swagger-ui.configUrl: The default value is /v3/api-docs/swagger-config.
    It is a URL that retrieves an external configuration document.

    +   - springdoc.swagger-ui.layout: The default value is BaseLayout. It’s the top-level
    layout used by Swagger UI to display the documentation.

    +   - springdoc.swagger-ui.tryItOutEnabled: The default value is false. It enables
    or disables the Try it out section, where the user can test the endpoints.

    +   - springdoc.swagger-ui.filter: The default value is false. It enables or disables
    filtering and adds a textbox to place the filter criteria. It can be a Boolean
    or a string; this will act as the filter expression.'
  merge: -1
  img_proc: true
- pgno: 131
  md: "+   - `springdoc.swagger-ui.operationsSorter`: This applies a sort to the operations\
    \ list of the API. The value can be `'alpha'` (sort by paths alphabetically),\
    \ `'method'` (sort by HTTP method), or a function that will identify the sorting\
    \ criteria.\n+   - `springdoc.swagger-ui.tagsSorter`: This applies a sort to the\
    \ operations list of the API. The value can be `'alpha'` (sort by paths alphabetically)\
    \ or a function that will identify the sorting criteria.\n\n# The plugins of springdoc-openapi\n\
    \nspringdoc-openapi also has plugins that we can use to generate the documentation.\
    \ Let’s take a look.\n\n# *springdoc-openapi-maven-plugin*\n\nspringdoc-openapi-maven-plugin\
    \ generates a JSON and YAML OpenAPI description during build time. The plugin\
    \ also works in the integration phase. To enable the plugin, we need to add the\
    \ following declaration to the `<plugin>` section of the pom.xml file:\n\n```\n\
    ```xml\n<plugin>\n    <groupId>org.springframework.boot</groupId>\n    <artifactId>spring-boot-maven-plugin</artifactId>\n\
    \    <version>${spring-boot-maven-plugin.version}</version>\n    <configuration>\n\
    \        <jvmArguments>\n            -Dspring.application.admin.enabled=true\n\
    \        </jvmArguments>\n    </configuration>\n    <executions>\n        <execution>\n\
    \            <goals>\n                <goal>start</goal>\n                <goal>stop</goal>\n\
    \            </goals>\n        </execution>\n    </executions>\n</plugin>\n```\n\
    ```\n\nWe just added the `spring-boot-maven-plugin` plugin. Copy the preceding\
    \ code and paste it into your `.pom` file."
