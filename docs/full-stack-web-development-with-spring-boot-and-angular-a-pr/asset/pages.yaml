- pgno: 23
  md: '# Spring Boot and Angular – The Big Picture


    First of all, we would like to thank you for getting a copy of this book, which
    was created for developers to learn how to build a full-stack web application
    using the standards that are being used in the development industry. This book
    is tailored based on the applications we have developed from our training and
    workshops. So, let’s begin our adventure.


    This chapter will serve as a short recap regarding the Java Spring Boot and Angular
    foundations to give you an idea of what lies ahead in terms of conducting web
    development for them. You will also learn how large the community is and that
    the support that’s available for Angular makes it reliable for developing applications.


    In this chapter, we will cover the following topics:


    +   - Introducing Spring Boot

