  md: '# Starting the server


    In this section, we will now attempt to run our Spring Boot application on our
    server but first, let’s have a recap of the previous chapter: we learned how to
    configure Spring Data JPA and connect our application to our PostgreSQL database,
    and—most importantly—we have installed all of the needed dependencies in our application.
    These are all prerequisites before running the Spring Boot application.


    In the following examples, we will be using an application named `spring-boot-superheroes`.
    We will generate a new Spring Boot application using Spring Initializr with the
    same dependencies. Throughout developing our application, we will also show you
    several ways to write the different parts of your API, such as how to write models,
