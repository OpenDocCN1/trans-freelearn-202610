  md: '+   4. **Print the contents of the instrument:** We execute the print() method
    to display the contents and information of the Time instrument.


    Now we have learned the concepts, features, and advantages of SLF4J, we will discuss
    a framework called Log4j2.


    # Logging using Log4j2


    **Log4j2** is one of the most common logging frameworks used with Java. Since
    SLF4J is an abstraction of logging frameworks, Log4j2 can be used with SLF4J.
    Log4j2 is very flexible and offers different ways to store log information for
    debugging; it also supports asynchronous logging and displays logs with a severity
    level to quickly identify the importance of messages.


    Let''s discuss the following features of Log4j2:


    +   - The Log4j2 Logger

    +   - Log4j2 Appenders

    +   - Log4j2 Layouts

    +   - Log4j2 Markers

    +   - Log4j2 Filters


    # The Log4j2 Logger


    The **Logger** is the main feature used by our application to create LogRecord
    instances. This means the logger is responsible for dispatching the messages.
    To create a Log4j2 Logger, we only need the following code:


    ```

    Logger log = LogManager.getLogger(ExampleClass.class);

    ```


    After creating a new Logger, we can now use it to call several methods, such as
    info(), to dispatch messages.


    # Log4j2 Appenders


    **Appenders** are responsible for placing the logs dispatched by the Logger. In
    Log4j2, there are a wide range of Appenders that help us decide where to store
    our logs.


    Here are some of the Appenders that are available from Log4j2:


    +   - ConsoleAppender: Writes logs to the console (System.out or System.err).
    This is the default Appender.

    +   - FileAppender: Writes logs to a file using FileManager.'
  merge: -1
  img_proc: true
- pgno: 193
  md: "+   - **JDBCAppender**: Writes logs to a database using a JDBC driver.\n+ \
    \  - **HTTPAppender**: Writes logs to a specific HTTP endpoint.\n+   - **KafkaAppender**:\
    \ Writes logs to Apache Kafka.\n+   - **AsyncAppender**: Encapsulates another\
    \ Appender and uses another thread to write logs, making it asynchronous logging.\n\
    +   - **SyslogAppender**: Writes logs to a syslog destination.\n\nYou can visit\
    \ the Log4j2 documentation for other available Appenders at the following link:\
    \ `https://logging.apache.org/log4j/2.x/manual/appenders.html`.\n\n# Log4j2 Layouts\n\
    \nAppenders use **Layouts** to format the output of a LogEvent. Log4j2 has different\
    \ Layouts we can choose from to format our logs:\n\n+   - **Pattern**: The default\
    \ Layout used by Log4j2 uses a string pattern to display the logs. For example,\
    \ the `%d{HH:mm:ss} %msg%n;` pattern would give the following result:\n\n```\n\
    14:25:30 Example log message\n```\n\n+   - **CSV**: The Layout for generating\
    \ logs using CSV format.\n+   - **HTML**: The Layout for generating logs in HTML\
    \ format.\n+   - **JSON**: The Layout for generating logs in JSON format.\n+ \
    \  - **XML**: The Layout for generating logs in XML format.\n+   - **YAML**: The\
    \ Layout for generating logs in YML format.\n+   - **Syslog**: The Layout for\
    \ generating logs into a syslog-compatible format.\n+   - **Serialized**: Serializes\
    \ the logs into a byte array using Java serialization.\n\n# Log4j2 Markers\n\n\
    **Markers** are objects commonly used to mark a single log statement to identify\
    \ whether we need to execute certain actions to specific logs. For example, we\
    \ can mark a single log statement using the IMPORTANT Marker, which can indicate\
    \ to the Appender that it needs to store the log in a different destination.\n\
    \nLet’s have a look at an example of how to create and use Markers:\n\n```\npublic\
    \ class Log4j2Marker {\n    private static Logger LOGGER =\n```"
