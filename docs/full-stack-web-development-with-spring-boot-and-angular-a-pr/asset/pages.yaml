- pgno: 247
  md: 'We must also remember that a shared module does not need a routing module since
    it does not have components that require routes in our application.


    # Blocks under the core module


    The last module that we need to create is the core module. Core modules are services
    that we share throughout the application and they have only one instance. One
    service that always goes into the core module is the authentication service.


    To create our shared module, we will execute the ng g m core; command after completing
    the core module. We will scaffold the authenticate service by running the ng g
    s core/services/authenticate command.


    After successfully creating the authenticate service, we will provide it under
    the core.module.ts file to include the service in the module. We can also add
    shared models under the core module by adding a models folder depending on the
    need of our application. Now, we have the following folder structure:


    ![](img/7c3ddd2e5893c9b5a0220148ed886548_247_0.png)


    Figure 10.8 – Folder structure after creating the shared module


    We will make the contents of the authenticate service as we go through the development
    of the application but now that we have created the base structure of our Angular
    application, we will use this structure to build other parts of the project. Now,
    we will discuss how we can structure our components in Angular.


    # Structuring components


    We have already structured our Angular application by categorizing our modules
    based on their use and functionality, which will benefit code reusability and
    maintainability. However, there is still the possibility that a large number of
    components could be created under a specific module, which would further improve
    the maintainability of an application. In this section, we will discuss another
    strategy for building your Angular architecture at the component level.'
  merge: -1
  img_proc: true
- pgno: 248
  md: "# Smart and dumb or presentation components\n\nThe most common and recommended\
    \ **component-level architecture** for building Angular applications is the smart\
    \ and dumb component architecture. In the previous section, we split the modules\
    \ into different categories based on how we were using them in the application.\n\
    \nThis architecture also offers the same concept. We will divide the components\
    \ into two different types – namely, **smart components** and **dumb** or **presentation\
    \ components**.\n\nLet’s discuss the characteristics of each component type.\n\
    \n# Smart components\n\n**Smart components** are also known as application-level\
    \ components or container components. The primary responsibility of these components\
    \ is to communicate with services and consume data from a request. Since they\
    \ are smart, they contain all the dependencies and subscriptions required to get\
    \ the data for the application.\n\nSmart components can be considered page components\
    \ that have direct routes in our application and they are the parent components\
    \ holding the dumb components. Let’s have a look at the following example code\
    \ for creating smart components:\n\n```\n@Component({\n  selector: 'app-home',\n\
    \  template: `\n    <h2>User List</h2>\n    <div>\n      <table class=\"table\"\
    >\n        <tbody>\n          <tr (click)=\"selectUser(user)\" *ngFor=\"let user\
    \ of users\">\n            <td>{{user.firstName}}</td>\n            <td>\n   \
    \           <span>{{user.lastName}}</span>\n            </td>\n          </tr>\n\
    \        </tbody>\n      </table>\n    </div>\n  `,\n  styleUrls: ['./home.component.css']\n\
    }\n```"
  merge: -1
  img_proc: true
