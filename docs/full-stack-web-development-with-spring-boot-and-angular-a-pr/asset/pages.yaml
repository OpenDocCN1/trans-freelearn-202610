- pgno: 277
  md: '+   - `reset()`: Resets the form control from its default value. It will also
    mark the control as pristine and untouched.


    **Parameters:**


    +   - `formState`: Defines the initial value and the disabled state of the control.


    +   - `options`: An object that defines the configuration of the controls on how
    it will propagate changes and emit events when the value changes. We can set the
    following option in the form control:


    +   - `onlySelf`: When set to `true`, changes from the control will not affect
    the other controls.


    Here''s the code for using the reset() method:


    ```

    reset(formState?: TValue | FormControlState<TValue>,

    options?: { onlySelf?: boolean; emitEvent?: boolean; }):

    void

    ```


    +   - `registerOnChange()`: Registers a listener to emit events once the form
    control value is changed.


    **Parameters:**


    +   - `function`: The method that is called when the value changes, as illustrated
    here:


    ```

    registerOnChange(fn: Function): void

    ```


    +   - `registerOnDisabledChange()`: Registers a listener to emit events once the
    isDisabled status of the control changes.


    **Parameters:**


    +   - `function`: The method that is called when the disabled status changes,
    as illustrated here:


    ```

    registerOnDisabledChange(fn: (isDisabled: boolean) =>

    void): void

    ```


    We have now learned about the different methods we can use in form controls. Now,
    let''s have a look at some examples of different usage of form controls.


    # Initializing form controls


    There are several ways to initialize our form controls. We can set the value,
    the disabled state, and the validators of a specific form control. Let''s have
    a look at the following examples:


    +   - **Initializing a form control with an initial value:**


    ```

    const control = new FormControl(''Hero!''); console.

    log(control.value); // Hero

    ```'
  merge: -1
  img_proc: true
- pgno: 278
  md: "In the preceding code example, we instantiated a form control with a default\
    \ value of Hero. We can access the value by accessing the value property inherited\
    \ from AbstractControl.\n\n+   Initializing a form control with an initial value\
    \ and the disabled state:\n\n```\nconst control = new FormControl({ value: 'Hero',\n\
    \  disabled: true });\n// get the status\nconsole.log(control.value, control.status);\
    \ //Hero,\n//DISABLED\n```\n\nIn the preceding code example, we instantiated a\
    \ form control with an object value. This initializes the value and the disabled\
    \ state of the form control. We can access the value by accessing the status property\
    \ inherited from AbstractControl.\n\n+   Initializing a form control with an initial\
    \ value and an array of built-in validators:\n\n```\nconst control = new FormControl('',\
    \ [Validators.email,\nValidators.required]);\n// get the status\nconsole.log(control.status);\
    \ // INVALID\n```\n\nWe instantiated a form control with an empty string value\
    \ in the preceding code example. With the second parameter of an array of validators,\
    \ this will return an invalid status since there should not be an empty value\
    \ and should be a valid email format.\n\n# Resetting form controls\n\nWe can use\
    \ the reset() method to reset the value and the disabled state of a form control.\
    \ Let’s have a look at the following code examples of different usage:\n\n+  \
    \ Resetting controls to a specific value:\n\n```\nconst control = new FormControl('Tony\
    \ Stark')\nconsole.log(control.value); // Tony Stark\ncontrol.reset('Iron Man');\n\
    console.log(control.value); // Iron Man\n```\n\nIn the preceding code example,\
    \ we have used the reset() method with a parameter. The parameter allows us to\
    \ reset the form control to a specific value.\n\n+   Resetting controls to an\
    \ initial value:\n\n```\nconst control = new FormControl('Tony Stark')\nconsole.log(control.value);\
    \ // Tony Stark\n```"
