- pgno: 64
  md: "+   4. Clicking the **Next** button will redirect us to the **Dependencies**\
    \ selection. We will choose the dependencies we need for the Spring Boot development,\
    \ which are the same as what we entered in the Spring Initializer interface.\n\
    +   \n+   5. After successfully checking the dependencies, click **Finish**, and\
    \ our Spring Boot application is configured. Finally, we are ready to write our\
    \ code.\n\nWe have successfully generated our Spring Boot application through\
    \ the Spring Initializr web interface and built-in IntelliJ IDEA. In the next\
    \ section, we will learn one of the most important and commonly used concepts\
    \ in Spring Boot – dependency injection.\n\n# Dependency injection\n\nWe have\
    \ successfully generated our own Spring Boot project, and now, we will start learning\
    \ the concepts of Spring, and one of the most important concepts we need to understand\
    \ is **dependency injection**. As we develop our backend using Spring Boot, we\
    \ will mainly use dependency injection throughout our development, as this makes\
    \ our Java program modular and enables easier switching of implementations.\n\n\
    Dependency injection is an essential feature of **object-oriented programming\
    \ languages**, but first, let’s discuss the concept of inversion of control, which\
    \ is what dependency injection is trying to achieve.\n\n# Inversion of control\n\
    \n**Inversion of Control (IoC)** is the design pattern used for object-oriented\
    \ programming languages. IoC is the concept of inverting the flow of your program,\
    \ and it is used for decoupling the components in your application, making your\
    \ piece of code reusable and modular. Hence, the IoC design pattern will provide\
    \ us with a way to inject a custom class into other classes of our application.\n\
    \nThe injected class will be instantiated in different parts of our application.\
    \ Instead of letting our class decide its implementations or making its code fixes,\
    \ we allow the injection of dependencies to change the class’s flow, performance,\
    \ and code depending on the case. Thus, IoC mainly offers flexibility and modularity,\
    \ but it also provides several other advantages in designing your applications:\n\
    \n+   - Having control of an object’s life cycle, we can define some objects as\
    \ a singleton, and some objects can have their instance.\n+   - It makes the application\
    \ more maintainable as your code reduces because of reusable components.\n+  \
    \ - Testing components is more manageable, as we can isolate components and mock\
    \ their dependencies, not covering other code that will not be included in unit\
    \ testing.\n\nWe have learned about the IoC pattern and how it is advantageous\
    \ for developing our application. Now, we will use dependency injection, which\
    \ allows us to achieve this pattern."
  merge: -1
  img_proc: true
- pgno: 65
  md: "# The basics of dependency injection\n\nWe have already discussed how IoC works,\
    \ and it is achieved by allowing an implementation to be decided by giving dependencies\
    \ to the object. So, this idea is mainly **dependency injection**. We allow objects\
    \ or classes to accept other dependencies that can provide implementations of\
    \ different classes without writing them again, making our code flexible and reusable.\
    \ Dependency injection can be achieved in different ways, and here are the following\
    \ implementations.\n\n# Constructor-based dependency injection\n\n**Constructor-based\
    \ dependency injection** can be achieved by creating an object class with a constructor,\
    \ with arguments of a specific type representing the dependency we can set.\n\n\
    Let’s have a look at the following code example:\n\n```\npackage com.springexample;\n\
    \n/* Class for Student */\npublic class Student {\n    private Grades grades;\n\
    \n    public Student(grades: Grades) {\n        this.grades = grades;\n    }\n\
    \    public void retrieveGrades() {\n        grades.getGrades();\n    }\n}\n```\n\
    \nIn the preceding example, the `Student` class has a constructor, `public Student()\
    \ {}`, which accepts a parameter of type `Grades`. The constructor allows us to\
    \ inject a `Grades` object in `Student`, allowing all implementations of the `Grades`\
    \ object to be accessible in the `Student` object. Now, we have accessed the `getGrades()`\
    \ method in our `Student`. To use the `Student` object, we will execute the following\
    \ example:\n\n```\npackage com.springexample;\nimport org.springframework.context.ApplicationContext;\n\
    import org.springframework.context.support.\nClassPathXmlApplicationContext;\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 66
  md: "```\npublic class Main {\n    public static void main(String[] args) {\n  \
    \      ApplicationContext context =\n            new ClassPathXmlApplicationContext(\"\
    Beans.xml\");\n\n        Student student =\n            (Student) context.getBean(\"\
    student\");\n        student.retrieveGrades();\n    }\n}\n```\n\nWe can see in\
    \ the preceding example that we have instantiated a new student in our main class\
    \ by getting the bean of our Beans.xml file. The Beans.xml file is our main configuration\
    \ file for our construction-based injection, which is where we will define our\
    \ beans together with their dependencies.\n\nLet’s examine the following example\
    \ of what Beans.xml looks like:\n\n```\n<?xml version = \"1.0\" encoding = \"\
    UTF-8\"?>\n\n<beans xmlns =\n    \"http://www.springframework.org/schema/beans\"\
    \n    xmlns:xsi = \"http://www.w3.org/2001/XMLSchema-instance\"\n    xsi:schemaLocation\
    \ =\n    \"http://www.springframework.org/schema/beans\n    http://www.springframework.org/schema/beans/\n\
    \    spring-beans-3.0.xsd\">\n\n    <!-- Definition for student bean -->\n   \
    \ <bean id = \"student\"\n        class = \"com.springexample.Student\">\n   \
    \     <constructor-arg ref = \"grades\"/>\n    </bean>\n\n    <!-- Definition\
    \ for grades bean -->\n    <bean id = \"grades\"\n        class =\"com.springexample.Grades\"\
    ></bean>\n\n</beans>\n```"
  merge: -1
  img_proc: true
- pgno: 67
  md: "In the preceding example, we have defined the Student and Grades object as\
    \ beans. The only difference is that the Student object has a constructor-arg\
    \ that references grades; this indicates that we are injecting the Grades object\
    \ into our Student object.\n\nWe have already achieved constructor-based dependency\
    \ by using the Beans.xml configuration. We can also use annotations directly in\
    \ our code to configure our beans and their dependencies.\n\nLet's look at the\
    \ following example of how to configure beans and dependencies with annotations:\n\
    \n```\n@Configuration\npublic class AppConfig\n{\n    @Bean\n    public Student\
    \ student() {\n        return new Student(grades());\n    }\n\n    @Bean\n   \
    \ public Grades grades() {\n        return new Grades();\n    }\n}\n```\n\nWe\
    \ can see in the preceding example that instead of using XML, we have used annotations\
    \ to identify our beans and configuration. For example, the @Configuration annotation\
    \ indicates that the AppConfig class is the source of the bean definitions, and\
    \ the @Bean annotation defines the bean in our application. We will discuss annotations\
    \ and beans intensely as we go throughout this chapter.\n\nWe have successfully\
    \ learned how to implement constructor-based dependency injection by using Bean.xml\
    \ and annotations. Now, let's move on to the implementation of setter-based dependency\
    \ injection.\n\n# Setter-based dependency injection\n\nThe injection of dependencies\
    \ can be achieved when the container calls the setter methods of our class. So,\
    \ instead of creating a constructor for the class, we will create a function that\
    \ will set the object's dependency."
