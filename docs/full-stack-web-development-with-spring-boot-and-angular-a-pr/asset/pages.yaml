- pgno: 118
  md: "```\npublic NotFoundException(Throwable cause) {\n    super(cause);\n}\n}\n\
    ```\n\nIn the preceding code snippet, we have declared several methods with NotFoundException\
    \ with different arguments; having successfully created our custom exception,\
    \ we can now use it on our service.\n\n+   2. Go back to AntiHeroService, and\
    \ we will add the following method:\n\n```\nprivate AntiHeroEntity findOrThrow(final\
    \ UUID id) {\n    return repo\n        .findById(id)\n        .orElseThrow(\n\
