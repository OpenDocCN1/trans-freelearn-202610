  md: '# Building APIs with Spring


    In the previous chapter, you learned about the concepts and advantages of PostgreSQL
    and set it up on your local machine using the installer or the Docker container.
    You know how to configure Spring Data Java Persistence API (Spring Data JPA) on
    our project and use its provided repositories to perform Create, Read, Update,
    and Delete (CRUD) operations on our database with less boilerplate code. Lastly,
    you have also learned to connect your application with PostgreSQL using the Java
    Database Connectivity (JDBC) driver and Spring Data JPA.


    This chapter will create your Spring Boot application programming interface (API)
    project; we will focus on coding, making our models, and adding controllers and
    services to develop our endpoints. We will also add Remote Dictionary Server (Redis)
    for caching to help improve our application performance.


    In this chapter, we will cover the following topics:


    +   - Starting the server

    +   - Adding models

    +   - Writing services

    +   - Adding controllers

