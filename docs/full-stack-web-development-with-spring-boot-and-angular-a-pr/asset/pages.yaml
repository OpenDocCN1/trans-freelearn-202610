- pgno: 56
  md: '# Understanding Spring Boot


    We have already discussed an overview of Spring in *Chapter 1, Spring Boot and
    Angular – The Big Picture*. In this section, we will have a deeper understanding
    of the essential concepts of Spring Boot in building your backend application,
    but first, let’s recap what Spring Boot is and its significant advantages.


    **Spring Boot** is an open source micro-framework from Pivotal. It is an enterprise-level
    framework for developers to create standalone applications on **Java Virtual Machines
    (JVMs)**. Its primary focus is to shorten your code length to make it easier for
    you to run your application.


    The framework extends the Spring Framework, which allows a more opinionated way
    to configure your applications. In addition, it comes with built-in autoconfiguration
    capabilities that configure both Spring Framework and third-party packages based
    on your settings.


    Here are the significant advantages of Spring Boot:


    +   - **Auto-configuration:** When configuring your Spring Boot application, it
    downloads all the dependencies needed to run your application.

    +   - **Opinionated approach:** Spring Boot uses a narrow approach to installing
    dependencies based on your application’s needs. Manual configuration is removed
    as it adds the packages you need for your application.

    +   - **Spring starters:** We can choose a list of starter dependencies to define
    your application’s expected needs during the initialization process. One example
    is Spring Web, which allows us to initialize a Spring-based web application.


    Now, we know what Spring Boot is and its advantages. Let’s now discuss the architecture
    of Sprint Boot.


    # Spring Boot architecture


    Spring Boot consists of different layers and classes to process the data and logic
    in your backend. The four layers and their use are as follows:


    +   1. **Presentation/display layer:** The presentation layer is responsible for
    interpreting JSON parameters as objects. This layer is the upper layer that is
    also responsible for handling authentication and HTTP requests. After accomplishing
    JSON translation and authentication, we will now move to the business layer.

    +   2. **Business layer:** The business layer, as the name suggests, handles all
    the business logic in the application. It is composed of service classes that
    perform authorization and additional validation.

    +   3. **Persistence layer:** The persistence layer is mainly responsible for
    storage logic that converts objects from and to database rows to insert data.

    +   4. **Database layer:** The database layer performs **Create, Read, Update,
    and Delete (CRUD)** operations. The layer can consist of multiple databases.'
  merge: -1
  img_proc: true
- pgno: 57
  md: 'The Spring Boot architecture depends on the Spring Framework. The framework
    uses all of its features, such as Spring Model-View-Controller (MVC), Spring Data,
    and Spring Core. The only difference is that Spring Boot does not require Data
    Access Object (DAO) and DAOimpl classes.


    Now, let''s discuss the Spring Boot Flow architecture, where we will see how data
    is processed inside an application.


    # Spring Boot flow architecture


    The Spring Boot flow architecture will explain how the HTTP requests are processed
    and how layers communicate. The flow is composed of controllers, service layers,
    databases, and models. To have a better understanding, let''s look at the following
    diagram.


    ![](img/7c3ddd2e5893c9b5a0220148ed886548_57_0.png)


    Figure 3.1 – Spring Boot flow architecture


    In the Spring Boot flow architecture, the first thing that occurs is the client
    sends a request (an HTTPS request) to the controller. The controller maps the
    request and decides what to do with it. Next, it calls the service layer, where
    all business logic is performed, and gets additional dependencies required for
    operations from repository classes. The service layer is also responsible for
    performing logic on the data represented as a model and will be used by JPA to
    be inserted into the database.


    We have learned the flow of the Spring Boot architecture. Now, we will discuss
    Representational State Transfer (REST) and its concepts.'
  merge: -1
  img_proc: true
- pgno: 58
  md: '# Understanding REST


    Before we start building our backend application, we must first know the concept
    of REST, as this is the primary architectural approach that we will apply for
    our backend to be consumable with client applications.


    REST is a web service the primary goal of which is to make web services more effective.
    It allows direct access to applications through a Uniform Resource Identifier
    (URI) and can provide the resource in the XML or JSON format, making it more flexible.


    The URI is where communication happens between two applications. Think of it as
    a bridge where the backend and frontend communicate. The client (frontend) requests
    a resource and returns a response represented by the XML or JSON format. Requesting
    a resource is used with the following HTTP methods:


    +   - GET: This is used to get and read a resource.

    +   - POST: This creates a new resource.

    +   - PUT: This updates an existing resource.

    +   - DELETE: This deletes a resource.


    Let’s have a simple real-world example (a blog application) where we use HTTP
    methods to access a resource with the provided endpoints:


    +   - GET `/user/{id}/blogs`: This gets the list of blogs of a specific user.

    +   - POST `/user/{id}/blog`: This creates a blog for a specific user.

    +   - PATCH `/user/{id}/blog/{blog_id}`: This updates an existing blog for a specific
    user.

    +   - DELETE `/user/{id}/blog/{blog_id}`: This deletes an existing blog for a
    specific user.


    In the preceding example, we request a resource using HTTP methods and endpoints.
    The endpoint returns an object in the form of XML or JSON in the response body.
    REST also supports the standard status code that will define whether our request
    is successful or not. The list of commonly used status codes is as follows:


    +   - 200: Success status for the request

    +   - 201: Indicates that an object was successfully created

    +   - 400: Indicates a bad request – usually happens when the request body is
    invalid

    +   - 401: Unauthorized access to the resource

    +   - 404: Indicates that the resource is not found

    +   - 500: Indicates an internal server error'
  merge: -1
  img_proc: true
