    \ added some additional elements in writing our unit test; we have created a new\
    \ instance of Executable(), where we have placed our main code. We have asserted\
    \ our Executable() with NotFoundException.class. The main reason for this is that\
    \ we expect that findAntiHeroByID() will return the NotFoundException error, as\
    \ we have deleted the entity in our database.\n\nRemember that when asserting\
    \ errors, we should use assertThrows().\n\nWe have successfully written a test\
    \ for our services and now, we will implement unit tests at the repository level."
  merge: -1
  img_proc: true
- pgno: 218
  md: "# Testing a repository\n\nWriting a test for the repository of our application\
    \ is mostly the same as how we write our tests at the service level; we also treat\
    \ them as services and we test them if there are additional methods added to the\
    \ repository.\n\nThe example that we will take is writing a unit test for our\
    \ UserRepository. Let’s have a recap of the methods that UserRepository possesses:\n\
    \n+   - Boolean selectExistsEmail(String email): Returns true when the user exists\
    \ with the given email\n+   - UserEntity findByEmail(String email): Returns the\
    \ user when the given email exists in the database\n\nTo start writing our test,\
    \ first, we will create a new package named user.repository under the com.example.springboot\
    \ superheroes.superheroes package, and we will make a new class called UserRepositoryTest.\
    \ After successfully creating the repository, we will annotate the class with\
    \ @DataJpaTest so that it focuses only on the JPA components and inject AntiHeroRepostiory\
    \ using the @Autowired annotation.\n\nOur class will now look as follows:\n\n\
    ```\n@DataJpaTest\nclass UserRepositoryTest {\n\n    @Autowired\n    private UserRepository\
    \ underTest;\n\n}\n```\n\nNow, we can write our tests after successfully injecting\
    \ the repository. First, we want to write a test for the selectExistsEmail() method.\
    \ The possible test case for the method is that it should return true if the email\
    \ exists in our database.\n\nLet’s have a look at the following example code:\n\
    \n```\n@Test\nvoid itShouldCheckWhenUserEmailExists() {\n    // give\n    String\
    \ email = \"seiji@gmail.com\";\n    UserEntity user = new UserEntity(email, \"\
    21398732478\");\n```"
