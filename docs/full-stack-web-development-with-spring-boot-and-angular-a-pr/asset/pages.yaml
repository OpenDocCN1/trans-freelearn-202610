  md: "In the preceding code example, we have called the `statusChanges` property\
    \ that has an `Observable` type, which we can subscribe to listen to changes to\
    \ the form control status. In this case, once we disable the form control, this\
    \ will emit the new status, which is `DISABLED`.\n\nWe have already learned about\
    \ the features and functionalities of form controls; now, we will discuss how\
    \ to group form controls using form groups and form arrays.\n\n# Grouping form\
    \ controls\n\nThis section will now discuss how to group form controls in our\
    \ application. Forms contain several related controls, which is why it is necessary\
    \ to group them for a better structure. Reactive forms provide two ways to group\
    \ form controls, as follows:\n\n+   - **Form group:** Creates a form with a fixed\
    \ set of form controls. Form groups can also contain another set of form groups\
    \ to handle complex forms.\n+   - **Form array:** Creates a form with dynamic\
    \ form controls. It can add and remove form controls and at the same time can\
    \ contain other form arrays to handle complex forms.\n\n# Creating form groups\n\
    \nForm groups allow us to control the values and status of form controls by groups.\
    \ We can also access a single form control inside a form group using its name.\
    \ To create a form group, let’s follow the next steps:\n\n+   1. Let’s say we\
    \ have a `HeroComponent`; for example, the first step is to import the `FormGroup`\
    \ and `FormControl` classes from the `@angular/forms` package, like so:\n\n```\n\
    ```typescript\nimport { FormGroup, FormControl } from '@angular/forms';\n```\n\
    ```\n\n+   2. The next step is to create a `FormGroup` instance. In this example,\
    \ we want to create a new form group with `firstName`, `lastName`, and `knownAs`\
    \ form controls:\n\n```\n```typescript\nexport class HeroComponent {\n  heroForm\
    \ = new FormGroup({\n    firstName: new FormControl(''),\n    lastName: new FormControl(''),\n\
    \    knownAs: new FormControl('')\n  });\n}\n```\n```\n\nIn the preceding code\
    \ example, we have created a new form group named `heroForm`. Simultaneously,\
    \ we have added three form controls as object parameters included in the `heroForm`\
    \ form."
