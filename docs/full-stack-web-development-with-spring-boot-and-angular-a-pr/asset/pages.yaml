  md: "```\n{\n  ......\n}\n```\n\nWe can see in the preceding example that @Component\
    \ is applied to the Car class. This means that this will create a car bean at\
    \ runtime. We also need to remember that @Component cannot be used with the @Configuration\
    \ annotation.\n\n+   - @Service: This annotation, used for the service layer,\
    \ indicates that a class is used to execute business logic, perform calculations,\
    \ and call external APIs. @Service is a kind of @Component annotation.\n+   -\
    \ @Repository: This annotation is used for classes that directly access a database.\
    \ This is an indication of a class that executes the role of a data access object.\n\
    +   - @Controller: The annotations used for Spring controller classes. It is also\
    \ a type of @Component annotation, used for Spring MVC and the methods annotated\
    \ with @RequestMapping, which is used for REST.\n\n# Spring Boot annotations\n\
    \nThese annotations are created explicitly for Spring Boot, and this is mostly\
    \ the combination of several annotations. The following is a list of Spring Boot\
    \ annotations:\n\n+   - @EnableAutoConfiguration: This annotation is used to auto-configure\
    \ the bean present in the classpath and then to configure it to run the methods.\
    \ The annotation is now rarely used, as @SpringBootApplication has already been\
    \ released in Spring 1.2.0.\n+   - @SpringBootApplication: The annotation is the\
    \ combination of @EnableAutoConfiguration, @ComponentsScan, and @Configuration.\n\
    \n# REST annotations\n\nThese are specialized annotations used to create endpoints,\
    \ specify the HTTP requests, and serialize return objects. The following list\
    \ shows the different REST annotations:\n\n+   - @RequestMapping: This is used\
    \ to create endpoints and map web requests. The annotations can be used in a class\
    \ or a method.\n+   - @GetMapping: This maps the HTTP GET requests and is used\
    \ for fetching data, and it is the equivalent of @RequestMapping(method = RequestMethod.GET).\n\
    +   - @PostMapping: This maps the HTTP POST requests and is used for creating\
    \ data, and it is the equivalent of @RequestMapping(method = RequestMethod.POST).\n\
    +   - @PostMapping: This maps the HTTP PUT requests and is used for updating data,\
    \ and it is the equivalent of @RequestMapping(method = RequestMethod.PUT)."
