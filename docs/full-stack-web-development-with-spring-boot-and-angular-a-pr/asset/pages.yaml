- pgno: 234
  md: "We have successfully configured and started our Angular application locally.\
    \ Now, let’s discuss the concepts we will use to build our application.\n\n# Angular\
    \ features\n\nThe Angular framework is a component-based framework that allows\
    \ us to develop reusable components to promote the reusability and maintainability\
    \ of code. It offers many features that will make our frontend development more\
    \ powerful. In this section, we will discuss the basic features and fundamentals\
    \ of Angular that serve as its building blocks; take note that we will not discuss\
    \ all of the features here, as we will focus more on the organization of the project.\n\
    \nTo learn more about the features, you can visit the official documentation for\
    \ Angular: https://angular.io/start.\n\n# Components\n\nComponents are the main\
    \ building blocks in Angular. They are responsible for defining what the behavior\
    \ and the look of the view will be. Components are annotated with the @Component\
    \ decorator, which assigns several types of metadata that describe the component’s\
    \ HTML, CSS, and selector.\n\nThe following are the commands to generate a component:\n\
    \n```\nng generate component <component-name>\nng g c <component-name>\n```\n\n\
    The following is a code example for a component:\n\n```\nimport { Component }\
    \ from '@angular/core';\n\n@Component({\n  selector: 'app-root',\n  templateUrl:\
    \ './app.component.html',\n  styleUrls: ['./app.component.scss']\n})\nexport class\
    \ AppComponent {\n  title = 'superheroes';\n}\n```\n\nComponents have a feature\
    \ called data binding, which allows us to pass data into the view. Data binding\
    \ can be used to display values to the user, respond to user events, and modify\
    \ the styles. Angular binding is classified into two groups:\n\n+   - One-way\
    \ binding\n+   - Two-way binding"
  merge: -1
  img_proc: true
- pgno: 235
  md: "# One-way binding\n\nAs can be inferred from the name, data only flows in one\
    \ direction here. It can be from a component to the view or vice versa.\n\nThere\
    \ are several ways to achieve one-way binding in Angular, and the two most common\
    \ ways are using interpolation and property binding.\n\n# Interpolation\n\n**Interpolation**\
    \ is a one-way binding technique that allows us to display expressions to a string\
    \ literal in HTML. Interpolation uses {{ }} (double curly braces) for expressions\
    \ inside HTML code.\n\nLet’s have a look at the following example code:\n\n```\n\
    // app.component.ts\nexport class AppComponent {\n    title = 'superheroes';\n\
    }\n\n<!--app.component.html -->\n<!-- INTERPOLATE TITLE -->\n<span> Title: {{title}}\
    \ </span>\n```\n\nIn the preceding example, we have used interpolation to display\
    \ the value of the title variable in the view. Using interpolation, we can also\
    \ use operators in the template expression.\n\n# Property binding\n\n**Property\
    \ binding** allows us to bind HTML element properties in the component. Since\
    \ we bind the HTML element properties, when the bound value changes, the view\
    \ also changes. We can bind to HTML element properties such as class, href, disabled,\
    \ and src.\n\nLet’s have a look at the following example code on how to use property\
    \ binding:\n\n```\n// app.component.ts\nexport class AppComponent {\n    isDisabled\
    \ = true;\n}\n\n<!--app.component.html -->\n<button [disabled]=\"isDisabled\"\
    >Can't be clicked</button>\n```\n\nIn the preceding example, we have bound the\
    \ isDisabled variable to the disabled property of the button. The button will\
    \ be disabled, as we have set the value of the isDisabled to true."
  merge: -1
  img_proc: true
- pgno: 236
  md: "# Two-way binding\n\n**Two-way binding** is a two-way data flow. Any changes\
    \ applied to the model will be reflected in the view simultaneously and any modifications\
    \ involved in the view are updated in the component. Two-way data binding helps\
    \ handle forms, as we want our model to be updated once the values of the form\
    \ are also updated and vice versa.\n\nTo achieve two-way binding, the ngModel\
    \ directive is used.\n\n# ngModel\n\nngModel is a directive used to achieve two-way\
    \ binding in Angular. This is under the Forms module in @angular/forms. ngModel,\
    \ once it is bound to an input field or other form element, gives that element\
    \ a property binding and an event binding. Let's have a look at the following\
    \ example code:\n\n```\n// app.component.ts\nexport class AppComponent {\n  model\
    \ = 'seiji';\n}\n\n<!--app.component.html -->\n<input [(ngModel)]=\"model\"/>\n\
    ```\n\nIn the preceding example code, we have bound the model value to an input\
    \ element using the ngModel directive. This syntax is also known as the banana\
    \ in a box, which encloses ngModel with a square bracket and parenthesis. The\
    \ directive will bind the model's value with the input field using property binding\
    \ and listen to the input value changes by utilizing ngModelChange.\n\n# Directives\n\
    \n**Directives** are an Angular feature that helps us manipulate the **Document\
    \ Object Model (DOM)**. We can modify a DOM element's layout, behavior, and view.\
    \ Directives are classified into three parts: **components** are one of the classifications,\
    \ and the other two are **attribute** and **structural** directives.\n\n# Structural\
    \ directives\n\n**Structural directives** are directives that can modify the layout\
    \ of the DOM by adding, updating, or removing elements, listed below are some\
    \ of the structural directives in Angular:\n\n+   * *ngIf: A directive that is\
    \ used to add or remove elements in the DOM based on a condition:\n\n```\n<div\
    \ *ngIf=\"condition\">Will show if the condition is true</div>\n```"
  merge: -1
  img_proc: true
- pgno: 237
  md: "+   - *ngFor: A directive that is used to repeat HTML elements from the items\
    \ iterated in a specific list:\n\n```\n// this will display all the users for\
    \ each row\n<tr *ngFor=\"let user of users;\">\n    <td>{{user.firstName }}</td>\n\
    \    <td>{{user.lastName}}</td>\n</tr>\n```\n\n+   - *ngSwitch: A directive that\
    \ allows us to add or remove HTML elements using a switch case mechanism. The\
    \ HTML elements will be displayed if the provided expression is matched:\n\n```\n\
    //evaluates the hero variable and displays the name of\nthe hero base on its value\n\
    <div [ngSwitch]=\"hero\">\n    <div *ngSwitchCase=\"'Dr. Strange'\">\n       \
    \ Stephen Strange</div>\n    <div *ngSwitchCase=\"'Hawkeye'\">Clint Barton</div>\n\
    \    <div *ngSwitchCase=\"'Hulk'\">Bruce Banner</div>\n</div>\n```\n\n# Attribute\
    \ directives\n\nAttribute directives are directives used for changing or modifying\
    \ the appearance or behavior of the element. Compared to structural directives,\
    \ attribute directives cannot add or remove elements in the DOM.\n\nListed here\
    \ are some of the attribute directives in Angular:\n\n+   - ngClass: A directive\
    \ used to add CSS classes to or remove them from an HTML element; this allows\
    \ us to change the appearance of elements dynamically:\n\n```\n//adds an error\
    \ class on the input element if the\n//control value is invalid\n<input type=\"\
    text\" [ngClass]=\"control.isInvalid ?\n'error': ''\" />\n```\n\n+   - ngStyle:\
    \ A directive that allows us to change the styles of HTML elements:\n\n```\n//\
    \ the color of the element will base on the value of\n// the color variable\n\
    <div [ngStyle]=\"{'color': color}\"> Angular Framework </\ndiv>\n```"
  merge: -1
  img_proc: true
- pgno: 238
  md: "# Modules\n\n**Modules** are one of the essential features of the Angular framework.\
    \ As our application gets more complex, it will consist of large blocks of components,\
    \ directives, and services. This will affect the maintainability of the application’s\
    \ code base. The Angular framework provides a way of organizing and grouping blocks,\
    \ known as modules.\n\nModules in the Angular framework help us develop our application\
    \ promoting the separation of concerns. They allow us to classify and organize\
    \ blocks based on their functionality. Angular is also built using modules; the\
    \ `@angular/core` framework is the primary Angular module, which provides Angular’s\
    \ core functionalities and services.\n\n# Creating a module\n\nWe will use the\
    \ `@NgModule` decorator to create a module. It consists of several types of metadata\
    \ that allow us to define the component, services, pipes, and other modules included\
    \ in the created module.\n\nThe following example code shows the properties available\
    \ for a module:\n\n```\n@NgModule({\n  declarations: [],\n  imports: [],\n  providers:\
    \ [],\n  exports: [],\n  bootstrap: [],\n  entrycomponents: []\n})\n```\n\nLet’s\
    \ now discuss the functionality of each property:\n\n+   - **Declarations**: This\
    \ is where we place the components, directives, and pipes of our applications.\
    \ Remember that components, directives, and pipes must be declared in only one\
    \ module.\n+   - **Providers**: This is where we place services to allow them\
    \ to be available for dependency injection.\n+   - **Imports**: This is where\
    \ we place one or more other modules in our application. Once we import a specific\
    \ module, all components, pipes, and directives in the imported module can be\
    \ used.\n+   - **Exports**: This is where we place the components, directives,\
    \ and pipes to be available to other modules once imported.\n+   - **Bootstrap**:\
    \ This is where we place the main component of the module. The Bootstrap property\
    \ is used mainly for the root module of the Angular application (`AppModule`),\
    \ as the root module’s responsibility is to load the first view as our application\
    \ starts."
  merge: -1
  img_proc: true
- pgno: 239
  md: "+   - **Entry components**: This is where we place components that should be\
    \ dynamically loaded in our application.\n\nThe following diagram shows how NgModule\
    \ works in an Angular application:\n\n![](img/7c3ddd2e5893c9b5a0220148ed886548_239_0.png)\n\
    \nFigure 10.5 – Diagram for the flow of an Angular module\n\n# Services and dependency\
    \ injection\n\n**Services** are also one of the valuable features of Angular.\
    \ It is code that can be reused in different components of your application.\n\
    \nThe primary responsibility of services is the following:\n\n+   - Reusing logic\
    \ on different components\n+   - Implementing API communication and data access\n\
    +   - Promoting single responsibility, as it separates the independent features\
    \ of components\n\nTo create a service in the application, we will create a class\
    \ and annotate it with the @Injectable decorator. To register the service at the\
    \ root level of your application, we will add the following to our @Injectable\
    \ decorator:\n\n```\n@Injectable({\n  providedIn: 'root',\n})\n```\n\nOnce we\
    \ have set the value of the providedIn metadata in the root, this will create\
    \ a single, shared instance of the service throughout the application. On the\
    \ other hand, if we want to provide the service in a specific module, we will\
    \ place the service in the provider metadata of @NgModule:\n\n```\n@NgModule({\n\
    \  providers: [Service1]\n})\n```"
  merge: -1
  img_proc: true
- pgno: 240
  md: 'Now that we have discussed some of the essential features of Angular, we will
    focus on how to structure your Angular application.


    # Creating the Angular folder structure


    The Angular framework is considered an MVW framework, which means that there are
    many possible ways of structuring our application. In this case, we would discuss
    one of the best practices or most commonly used structures that can help your
    Angular application be scalable and maintainable.


    In the previous part, we learned that Angular blocks could be grouped and organized
    into modules; modules are a good starting point for structuring our Angular application.
    The first step we can implement is to group and classify modules based on their
    functionality. Listed here is the classification of our modules.


    # Root module


    The **root** module is the application’s main module. This is the first module
    loaded as the Angular application starts. The root module is automatically generated
    when we scaffold an Angular application called `AppModule` and is found under
    the `src/app` folder.


    # Feature module


    The **feature** module is where we place modules that apply a specific feature
    of our application. This means that most of what our code uses is inside this
    module. We will create the components, pipes, and directives under the module
    where they should be included and we can also separate components by placing the
    components that have a route in a page folder.


    Let’s have a look at an example folder structure of a feature module called `AntiHeroModule`:


    ```

    src

    ├─ app

    │  ├─ anti-hero

    │  │  ├─ components

    │  │  │  ├─ shared.component.ts

    │  │  ├─ directives

    │  │  │  ├─ first.directive.ts

    │  │  │  ├─ another.directive.ts

    │  │  ├─ pages

    │  │  │  ├─ form

    │  │  │  │  ├─ form.component.ts

    │  │  │  ├─ list

    │  │  │  │  ├─ list.component.ts

    ```'
  merge: -1
  img_proc: true
- pgno: 241
  md: '```

    | | | | |— anti-hero.component.ts

    | | | | |— anti-hero.component.html

    | | | | |— anti-hero.component.css

    | | | | |— index.ts

    | | | |— pipes

    | | | | |— first.pipe.ts

    | | | |— anti-hero.module.ts

    | | | |— anti-hero.routing.module.ts

    | | | |— index.ts

    ```


    In the folder structure here, we have divided our anti-hero module into several
    parts. The first folder is the components folder, which contains all of the components
    shared throughout this module. These can also be called dumb components, which
    we will discuss in the next section.


    The next two are the directives and pipes folders, which contain the directives
    and pipes used in AntiHeroModule. Lastly, the pages folder includes the components
    in AntiHeroModule that have a direct route. These can also be called smart components.
    We have also included the index.ts file, known as a barrel file, which will provide
    a centralized place for exporting components, directives, and pipes.


    # Shared module


    The shared module is a module that is used and shared throughout the application;
    this is composed of the components, pipes, and directives that we are required
    to use in different parts of the application. Remember that a shared module should
    not have a dependency on other modules in the application.


    Shared modules are created under the src/app/shared folder.


    Let''s have a look at the example folder structure of a shared module in our application:


    ```

    |— src

    | |— app

    | | |— shared

    | | | |— layout

    | | | | |— footer

    | | | | | |— footer.component.ts

    | | | | | |— footer.component.html

    | | | | |— header

    | | | | | |— header.component.ts

    | | | | | |— header.component.html

    | | | | |— layout.module.ts

    | | | |— index.ts

    ```'
