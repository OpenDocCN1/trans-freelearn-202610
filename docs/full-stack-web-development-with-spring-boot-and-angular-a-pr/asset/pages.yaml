    data store-related implementation.

    +   - **PostgreSQL Driver**: A JDBC and **Reactive Relational Database Connectivity
    (R2DBC)** driver that will allow the connection of Java applications to the PostgreSQL
    database.

    +   - **H2 Database**: An in-memory database that supports JDBC API and R2DBC
    access; this is commonly used for unit testing.


