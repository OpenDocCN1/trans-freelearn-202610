    \ section:\n\n```\nplugins {\n    id \"org.springframework.boot\" version \"${version}\"\
    \n    id \"org.springdoc.openapi-gradle-plugin\"\n        version \"${version}\"\
    \n}\n```\n\nOnce the plugins and dependencies have been added, the following tasks\
    \ will be created:\n\n+   - generateOpenApiDocs: The job that will be run to generate\
    \ the OpenAPI documentation. generateOpenApiDocs makes a REST call to the application’s\
    \ documentation URL to store the OpenAPI docs in JSON format.\n+   - forkedSpringBootRun:\
    \ The Spring Boot application runs in the background using this task."
