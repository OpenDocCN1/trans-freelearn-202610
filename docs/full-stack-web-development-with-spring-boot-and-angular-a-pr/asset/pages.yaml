  md: 'After successfully defining the routes for our AppModule, we can now see the
    current structure of our application:


    ![](img/7c3ddd2e5893c9b5a0220148ed886548_245_0.png)


    Figure 10.6 – Folder structure after creating the anti-hero feature


    Now that we have completed our feature module in Angular, we have only the pages
    folder. We will add other blocks such as the components and directives later as
    we develop the application. The next step is to make the shared module.


    # Blocks under the shared module


    Now, our next goal is to create the blocks under the shared module. We defined
    the shared module as components, directives, and pipes that are shared throughout
    the application and must not have a dependency on other modules. To create our
    shared module, we will execute the ng g m shared command. This will create a new
    shared folder and a module file inside the new shared folder.


    Now after completing the shared module, we can generate the blocks that will be
    categorized in this module. In our application, we can include navbar and footer
    as shared components, as they will be used in every part of our application.'
