    After successfully implementing our presentation component, we can run the application
    and open the application in the browser. We should see the following results:


    ![](img/7c3ddd2e5893c9b5a0220148ed886548_256_0.png)


    We can see in the results that our presentation component has successfully displayed
    the data coming from the parent component. For the form component, we will implement
    its functionalities in the next chapter, as creating forms will be another different
    topic.


    Now, we have learned about the concepts, structure, and implementation of smart
    and dumb components. In the next section, we will now use a UI framework that
    will help us improve the interface of our Angular application.


    # Adding Angular Material


    We have already organized our Angular application using the core, feature, and
    shared architecture at the module level and the smart and dumb architecture at
    the component level. Now, we are ready to customize and improve the look and UI
    by styling our components. We all know that writing CSS code from scratch and
    developing a base style is another challenge for us developers. It creates additional
    effort for us beyond just worrying about the logical side of the code. This is
    where Angular Material saves the day!'
