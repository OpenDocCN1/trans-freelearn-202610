    \nimport javax.persistence.Entity;\nimport javax.persistence.Table;\n\n@Entity\n\
    @Table(name = \"anti_hero_entity\")\npublic class AntiHeroEntity {\n}\n```\n\n\
    An entity was automatically generated with the @Entity and @Table annotations\
    \ that will be used to identify this model as an object in the database. The current\
    \ code will have some issues, stating that the entity does not have a primary\
    \ key (PK); in this case, we will add the following to our model:\n\n+   - @Data:\
    \ Lombok annotations that will set the getter and setter methods, the toString()\
    \ method, and @RequiredArgsConstructor.\n+   - @AllArgsConstructor: Lombok annotations\
    \ for generating a constructor for the model with all fields as arguments.\n+\
    \   - @NoArgsConstructor: Lombok annotations for generating a constructor for\
    \ the model with no arguments.\n+   - @Id: Found under javax.persistence.*, this\
    \ will determine the model's PK.\n+   - @GeneratedValue: Used on the PK to determine\
    \ which generation type will be used.\n+   - @NotNull: Found under javax.validation.constraints\
    \ and validates that a specific field cannot be null.\n\nThe dependency should\
    \ be installed by adding the following code to pom.xml:\n\n```\n<dependency>\n\
    \  <groupId>org.springframework.boot</groupId>\n  <artifactId>spring-boot-starter-validation</artifactId>\n\
    </dependency>\n```\n\nAfter adding the dependency to pom.xml, right-click on your\
