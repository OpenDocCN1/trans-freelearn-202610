    # IDaaS


    In the previous section, we created our custom login authentication using Spring
    Security. We utilized some of the features of Spring Security and also used JWT
    to store user states and validate credentials. However, this example is not enough
    of a reliable and secure way of implementing authentication for our application.


    Large and enterprise applications nowadays demand several security features to
    be able to prevent possible vulnerabilities that can occur. These features can
    include the architecture and the implementation of'
