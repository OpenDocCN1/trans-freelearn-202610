- pgno: 231
  md: 'In the preceding output, we can see that the version of the Angular CLI and
    Node.js installed on your machine is displayed after executing the ng -- version
    command. Currently, we have Angular CLI Version 13 installed, which means that
    once we scaffold an Angular project, it will be on Version 13.


    After successfully installing the Angular CLI, we can now execute several commands
    for our project. Here are some of the commands that we can use in the Angular
    CLI:


    +   - ng new <project name> [options]: Creates or scaffolds a new Angular project

    +   - ng serve <project> [options]: Builds and serves your Angular application

    +   - ng generate <schematic> [options]: Generates and modifies files with a specific
    schematic

    +     Some schematics we can generate are as follows:

    +     - Component

    +     - Module

    +     - Directive

    +     - Guard

    +   - ng build<project> [options]: Compiles the Angular application into an output
    directory named dist, which will be used for production

    +   - ng test <project> [options]: Runs the unit test in the Angular project


    These are just some of the most commonly used commands of the Angular CLI. For
    the complete commands, you can visit the documentation for Angular at https://angular.io/cli.


    We know the commands we can use in the Angular CLI. Now, let’s generate our Angular
    project by executing the ng new superheroes command on our desired path. This
    will ask several questions, such as “would you like to add Angular routing?” and
    “which stylesheet format would you like to use?” We can select Yes and Syntactically
    Awesome Style Sheet (SASS) for these questions, as we need routes and SASS to
    build our application later.


    After this step, this will now scaffold a new Angular project named superheroes
    and will be responsible for configuring the web pack, creating the required settings,
    and downloading the project’s dependencies. After the scaffold is accomplished,
    open the superheroes project in Visual Studio Code or any IDE you prefer. We will
    see that the Angular application is configured and ready to run on our local server.'
