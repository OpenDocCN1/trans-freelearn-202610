- pgno: 295
  md: '# 12


    # Managing States with NgRx


    In the previous chapter, we learned about the concepts and features of Reactive
    forms. We implemented `FormGroup`, `FormBuilder`, and `formControlName` to bind
    input values in the form elements in the application. We also discussed how to
    group form control to bind nested properties and create form arrays in our Reactive
    forms.


    After that, we learned how to implement validations for form controls to handle
    and verify user input. This will be beneficial for the user experience and help
    us avoid unexpected errors.


    In this chapter, we will add a new recipe to our application and learn how to
    implement state management, specifically **NgRx**, for handling data in our Angular
    application.


    In this chapter, we will cover the following topics:


    +   - Understanding complexities in managing the states of large applications

    +   - State management and the global state

    +   - Getting started and setting up NgRx

    +   - Writing an action

    +   - Writing an effect

    +   - Writing a reducer

    +   - Writing a selector and using a selector and dispatching it in a component

    +   - Configuring the store


    # Technical requirements


    The following link will take you to the finished version of code for this chapter:
    https://github.com/PacktPublishing/Spring-Boot-and-Angular/tree/main/Chapter-12/superheroes.'
