- pgno: 125
  md: 'We have completed our Spring Boot application, we have created our models and
    DTO that defines the structure of our object, we have built services that are
    responsible for the business logic, and we have created controllers that map the
    HTTP requests in our applications, so our endpoint will work as expected.


    Still, we can improve our backend in terms of performance, and we can do this
    with caching mechanisms. In the next section, we will discuss the concepts and
    application of Redis.


    # Adding Redis for caching


    In this section, we will now discuss Redis, which can improve the performance
    of our REST applications. Redis is an open source, in-memory, key-value data store
    that allows data to reside in memory to enable low latency and faster data access.
    Compared to traditional databases, Redis doesn’t require disk access, having all
    data cached in the memory, which gives a quicker response.


    It is now widely used, especially for large applications that receive millions
    of requests. It is compatible with different data structures such as strings,
    lists, sets, hashes, bitmaps, and geospatial and is compatible with Publish/Subscribe
    (Pub/Sub), used for real-time chat applications.


    # Installing the Redis server


    Before using Redis on our Spring Boot application, we will need to install the
    Redis server in our terminal. Let’s discuss how to install Redis on different
    operating systems.


    # macOS


    Redis is simple to install in a macOS system; we can use Homebrew to install Redis
    and execute the following command:


    ```

    brew install redis

    ```


    After successful installation, we can set the Redis server to start automatically
    with the following command:


    ```

    brew services start redis

    ```


    And we have successfully installed and run our Redis server on macOS.


    # Ubuntu Linux


    For installing Redis on Ubuntu OS, we will execute the following command:


    ```

    sudo apt-get install redis-server

    ```


    This will automatically install and start the Redis server on port 6739, and we
    have successfully installed and run our Redis server on Linux.'
  merge: -1
  img_proc: true
