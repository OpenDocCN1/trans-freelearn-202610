- pgno: 145
  md: '# Adding Spring Boot Security with JWT


    In the previous chapter, we learned mainly how to generate automated documentation
    for our created APIs in our Spring Boot project. We learned how to add and use
    the features and properties of springdoc-openapi, configure the plugin on the
    project, and access the generated JSON and YAML documentation. We also learned
    how to implement the Swagger UI to make our documentation interactive and allow
    us to test endpoints directly on the browser.


    This chapter will now focus on the security side of our application. We will discuss
    the concept of Cross-Origin Resource Sharing (CORS) and how it can secure our
    application. We will also be discussing the features and implementation of Spring
    Security in Spring Boot, the concept of JSON Web Token (JWT), and Identity as
    a Service (IDaaS).


    In this chapter, we will cover the following topics:


    +   - Understanding CORS

    +   - Adding a CORS policy

    +   - Understanding Spring Security

    +   - Authentication and authorization in Spring Boot

    +   - IDaaS


    # Technical requirements


    The link to the finished version of this chapter''s code is here: https://github.com/PacktPublishing/Spring-Boot-and-Angular/tree/main/Chapter-07/superheroes.'
