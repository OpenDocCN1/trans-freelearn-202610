- pgno: 404
  md: '# Understanding GitHub Actions


    Let’s start by defining **GitHub Actions**. This platform provides workflow automation
    for developers and operations for **continuous integration and continuous delivery
    (CI/CD)**. It can run a series of actions using scripts whenever someone creates
    a pull request, creates an issue, joins as a contributor, merges a pull request,
    and so on. In short, there are several events in your GitHub workflow that you
    can use to run a set of specific actions or scripts.


    Now, let’s review some of the components of GitHub Actions.


    # Components of GitHub Actions


    Now that we’ve learned what GitHub Actions is, let’s see the components of GitHub
    Actions that help us do DevOps and run workflows when events get triggered.


    Here are the components of GitHub Actions:


    +   - **Workflows**: This is a configurable YAML file in a repository’s directory,
    such as `.github/workflows`, that runs jobs manually, automatically triggers an
    event, or does so by setting a schedule.

    +   - **Events**: Events are activities in a repository that cause your workflow
    to start running. Common events you might see in a workflow file are `pull_request`,
    `push`, and `schedule`. However, other events can be useful, depending on your
    needs.

    +   - **Jobs**: A job is a set or group of steps (script or action) in a workflow.
    A particular job executes in the same runner throughout the steps.

    +   - **Actions**: An action performs the task at hand or anything you need, such
    as checking out your repository, building your application, testing your application,
    scanning your code for any vulnerabilities, or deploying your application.

    +   - **Runners**: Runners are just servers. You can choose Ubuntu Linux, Microsoft
    Windows, or macOS runners in GitHub Actions. However, you are not limited to these
    three operating systems. You can also have self-hosted runners.


    These are the components of GitHub Actions that we will use later in the *Creating
    a CI workflow or pipeline* section. But before that, we will set up Heroku, where
    we will deploy our full-stack application.


    # Setting up Heroku


    In this section, we will use Heroku. It is a **Platform-as-a-Service (PaaS)**
    offering that lets us build and run applications in the cloud. Let’s learn how
    to set up Heroku and our applications.'
  merge: -1
  img_proc: true
