- pgno: 75
  md: '+   - `@DeleteMapping`: This maps the HTTP PUT requests and is used for deleting
    data, and it is the equivalent of `@RequestMapping` (method = `RequestMethod.DELETE`).

    +   - `@DeleteMapping`: This maps the HTTP PATCH requests and is used for partial
    updates on data, and it is the equivalent of `@RequestMapping` (method = `RequestMethod.PATCH`).

    +   - `@RequestBody`: This is used to bind HTTP requests with an object in a method
    parameter. The Spring framework binds the HTTP request body of the parameter with
    the `@RequestBody` annotation.

    +   - `@ResponseBody`: This attaches the method''s return value to the response
    body. The annotation indicates that the return object should be serialized into
    a JSON or XML format.

    +   - `@PathVariable`: This is used to get the values from the URI. It is allowed
    to define multiple `@PathVariable` instances in a method.

    +   - `@RequestParam`: This is used to get the query parameters from the URL.

    +   - `@RequestHeader`: This is used to extract the details about the incoming
    HTTP request headers. We use this annotation in the parameters of a method.

    +   - `@RestController`: This is a combination of the `@Controller` and `@ResponseBody`
    annotations. The importance of this annotation is that it prevents annotating
    each method with `@ResponseBody`.


    We have learned about the different types of annotations and their uses in Spring.
