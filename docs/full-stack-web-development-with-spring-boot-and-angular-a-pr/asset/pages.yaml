    # # Adding models


    In this section, we will now write code for our application, and the first thing
    we will create is models. In simple terms, models are the object of our application;
    the models will serve as our entities and will define our tables in the database.


    Once we create models and run the application, this will also generate tables
    in our database automatically with the help of annotations, which will also be
    discussed throughout this example.


    # ## Creating models with DTOs and Lombok


    We will first show you how to write models using Lombok and **data transfer objects
    (DTOs)**. First, we will discuss DTOs.


    # ### DTOs


    DTOs are responsible for carrying data between processes to reduce the number
    of method calls. DTOs are **plain old Java objects (POJOs)** that commonly consist
    of data accessors.'
  merge: -1
  img_proc: true
- pgno: 106
  md: "DTOs are very useful for creating representations of our entities to have views\
    \ for clients without affecting the pattern and design. Let’s have an example\
    \ use case for DTOs. You can see this here:\n\n```\npublic class Blog {\nprivate\
    \ String id;\nprivate String title;\nprivate String description;\nprivate String\
    \ author;\npublic Blog(String title, String description,\n        String author)\
    \ {\n    this.name = title;\n    this.description = description\n    this.author\
    \ = author\n}\n}\n```\n\nIn the preceding code, we have created an example domain\
    \ model that will represent entities in our database. There are instances where\
    \ we would not want to include some information on sending data to the client,\
    \ which is where DTOs would enter the scene. We will create two DTOs for the blog\
    \ model used for getting and creating data, as follows:\n\n```\nPublic class BlogDTO\
    \ {\n    private String title;\n    private String description;\n}\n```\n\nIn\
    \ the preceding example DTO, we have created a BlogDTO class that will be used\
    \ for retrieving data; our objective is to hide the author’s name, thus not including\
    \ it as a field in the DTO. The code is illustrated in the following snippet:\n\
    \n```\nPublic class BlogCreationDTO {\n    private String title;\n    private\
    \ String description;\n    private String author;\n}\n```\n\nThe next DTO we have\
    \ created is BlogCreationDTO, which will create a new blog. We can see that all\
    \ fields necessary to create a new blog are included.\n\nThe created DTOs will\
    \ be used for our controllers in the following sections."
  merge: -1
  img_proc: true
- pgno: 107
  md: "# Lombok\n\nLombok is a third-party library used to reduce boilerplate code\
    \ using annotations. Lombok allows us to avoid repetitive code, especially in\
    \ creating models such as getter and setter methods.\n\nLet’s have a comparison\
    \ between a model without Lombok and a model using Lombok, as follows:\n\n```\n\
    public class Blog {\n    private String title;\n    private String description;\n\
    \    private String author;\n    public Blog() {}\n    public Blog(String title,\
    \ String description,\n        String author) {\n    super()\n    this.name =\
    \ title;\n    this.description = description\n    this.author = author\n}\n\n\
    public String getAuthor() {return author;}\npublic void setAuthor(String author)\
    \ {\nthis.author = author; }\npublic String getTitle() {return title;}\npublic\
    \ void setTitle(String title) {\nthis.title = title; }\npublic String getDescription()\
    \ {return description;}\npublic void setDescription(String description) {\nthis.description\
    \ = description; }\n\n@Override public String toString()\n{return \"Blog [\"\n\
    \    + \"author=\" + author + \", title=\" + title\n    + \", \" + \" description\
    \ =\" + description + \"]\";\n}\n}\n```\n\nIn the preceding code example, we have\
    \ created a blog model without using Lombok; we can see that we have created a\
    \ getter and setter method for each field, and we have also created constructors\
    \ with and without arguments. The code in this example is still manageable."
  merge: -1
  img_proc: true
- pgno: 108
  md: "Still, if our model is required to contain more fields, we need to create setters\
    \ and getters for the new fields, creating more boilerplate code inside our model\
    \ and sacrificing the maintainability of our code.\n\nThe class and annotations\
    \ should be as shown in the following code block:\n\n```\n@Data\n@AllArgsConstructor\n\
    @NoArgsConstructor\npublic class Blog {\n    private String title;\n    private\
    \ String description;\n    private String author;\n}\n```\n\nIn the preceding\
    \ screenshot, we have used Lombok to create our blog model, and we can see that\
    \ a considerable amount of code has been omitted from the model. The @Data annotation\
    \ generates setter and getter methods, a toString() method, and a constructor\
    \ with required arguments.\n\n@AllArgsConstructor and @NoArgsConstructor are accountable\
    \ for the constructor with all and no arguments.\n\nThe advantage of using Lombok\
    \ is evident in the previous examples; it makes code easier to read and less error-prone,\
    \ promotes easy cleanup and maintainability, and gives effortless logging and\
    \ debugging.\n\n# Model application\n\nNow that we have learned about the importance\
    \ of DTO and Lombok, let’s go back to our Spring Boot application. Under the java\
    \ folder, right-click on the package and select Package. This will display a small\
    \ window that will allow you to enter a new package.\n\nIn this example, we will\
    \ create a new package named antiHero. After completing the new package, we will\
    \ create two new packages under antiHero, calling them dto and entity. You can\
    \ see the packages in the following screenshot:"
