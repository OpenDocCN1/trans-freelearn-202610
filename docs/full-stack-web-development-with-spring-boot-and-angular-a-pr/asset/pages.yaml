    \ will use for our login page. Now, let’s create the interceptor for our application.\n\
    \n# The HTTP interceptor\n\nHTTP interceptors are features of Angular that allow\
    \ us to intercept HTTP requests to transform their headers, the body, or the response.\
    \ This provides the intercept() function, which will enable us to get the outgoing\
    \ request and call the next interceptor or the backend.\n\nWe will mainly use\
    \ the interceptor to modify the headers of our endpoint requests, which will be\
    \ responsible for adding the Authorization: Bearer {JWT} header for each invoked\
    \ request.\n\nTo implement the interceptor, we will create the core/interceptors/header.interceptor.ts\
    \ file, and we will place the following code within it:\n\n```\n@Injectable()\n\
    export class HeaderInterceptor implements HttpInterceptor {\n  intercept(httpRequest:\
    \ HttpRequest<any>, next: HttpHandler): Observable<HttpEvent<any>> {\n    const\
    \ Authorization = localStorage.getItem('token') ? `Bearer ${localStorage.getItem('token')}`\
    \ : '';\n    if (httpRequest.url.includes('/api/v1'))\n      return next.handle(httpRequest.clone({\
    \ setHeaders: {\n        Authorization }\n      }));\n    else\n      return next.handle(httpRequest);\n\
    \  }\n}\n```\n\nIn the preceding code example, we have added a new implementation\
    \ for the intercept() function. The first step is to retrieve the valid JWT in\
    \ our local storage that will be used in the HTTP"
