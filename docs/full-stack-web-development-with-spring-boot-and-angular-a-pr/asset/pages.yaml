- pgno: 156
  md: 'As we’re using Spring Security in our application, we do not need to code security-related
    tasks from scratch as Spring Security has these features under the hood.


    Let’s discuss the concepts of Spring Security further.


    # Features of Spring Security


    Spring Security mainly focuses on integrating authentication and authorization
    into applications. To compare the two, **authentication** refers to validating
    that a user can access your application and identifying who the user is. This
    mainly refers to the login page itself. On the other hand, **authorization** is
    used for more complex applications; this relates to the operations or actions
    that a specific user can do inside your applications.


    Authorization can be accomplished by integrating roles to implement user access
    controls. Spring Security also provides different password encoders – one-way
    transformation passwords – which are as follows:


    +   - `BCryptPasswordEncoder`

    +   - `Argon2PasswordEncoder`

    +   - `Pbkdf2PasswordEncoder`

    +   - `SCryptPasswordEncoder`


    The preceding list is of the most commonly used password encoders and can be accessed
    directly when using Spring Security. It also provides different features that
    will help you to meet security requirements, which are as follows:


    +   - **Lightweight Directory Access Protocol (LDAP)**: A protocol for containing
    and accessing distributed directory information services over an internet protocol.

    +   - **Remember me**: This feature provides a capability to remember a user from
    a single machine to prevent logging in again.

    +   - **Single Sign-On (SSO)**: This feature allows users to access multiple applications
    with a single account, centralizing user information.

    +   - **Software localization**: This feature gives the capability to develop
    a user interface with our preferred language.

    +   - **HTTP authorization**: This feature provides authorization.

    +   - **Basic access authentication**: This feature provides the base authentication
    process, which requires a username and password for requests.

    +   - **Digest access authentication**: This feature provides more secure authentication
    that confirms the user’s identity before accessing resources.'
  merge: -1
  img_proc: true
- pgno: 157
  md: '+   - **Web form authentication:** A form will be generated that will authenticate
    the user credentials directly from the web browser.


    Spring Security offers a wide range of features for the application. In this case,
    the design of Spring Security is divided into separate Java Archive (JAR) files
    based on its functionality, only requiring the installation of the needed part
    for our development.


    The following is a list of JAR files that are included in the Spring Security
    module:


    +   - `spring-security-core`: The standard requirement for an application to use
    Spring Security. Spring-security-core consists of the core authentication classes
    and interfaces.

    +   - `spring-security-web`: This JAR file is used for web authentication and
    URL-based access control. It is found under `org.springframework.security.web`.

    +   - `spring-security-config`: This JAR file is used for implementing Spring
    Security configuration, using XML and Java. All classes and interfaces are found
    under `org.springframework.security.config`.

    +   - `spring-security-ldap`: This JAR file is required for implementing LDAP
    in our application. All classes and interfaces are found under `org.springframework.security.ldap`.

    +   - `spring-security-oauth2-core`: This JAR file is used to implement the OAuth
    2.0 authorization framework and OpenID Connect Core. The classes are located under
    `org.springframework.security.oauth2.core`.

    +   - `spring-security-oauth2-client`: This JAR file provides the OAuth login
    and OpenID client support. All classes and interfaces are located under `org.springframework.security.oauth2.client`.

    +   - `spring-security-openid`: This JAR file is used for OpenID web authentication
    support to validate users with an external OpenID server.

    +   - `spring-security-test`: This JAR file is used to support testing for the
    Spring Security application.

    +   - `spring-security-cas`: This JAR file implements web authentication with
    a CAS SSO server. All classes and interfaces are found under `org.springframework.security.cas`.

    +   - `spring-security-acl`: This JAR file is used to integrate security into
    the application''s domain object. We can access the classes and interfaces under
    `org.springframework.security.acls`.


    We have now learned about the different features and modules that Spring Security
    offers. In the next section, we will learn how to implement authentication and
    authorization using Spring Security in our Spring Boot application.'
