- pgno: 146
  md: '# Understanding CORS


    We might have already encountered the term CORS several times when creating our
    applications as developers. Still, we may ask questions such as what does CORS
    do? Or what is the advantage of implementing CORS in our application? With these
    questions in mind, we will dive deeply, in this section, into the concepts and
    features of CORS and understand how it is used to secure our applications.


    CORS is a header-based mechanism that allows a server to define a set of domains,
    schemes, or ports permitted to access the application’s resources. CORS is commonly
    used in REST APIs. Different frontend applications can access the APIs under our
    backend applications, especially in complex architectures. We don’t want our APIs
    to be accessed by unknown applications, and CORS is responsible for securing this
    part.


    Let’s see a simple example of a cross-origin request. Say we have a frontend application
    with a domain of https://domain-one.com and a backend application served with
    a domain of https://domain-two.com. We can see that our application is served
    with different domains, and once the frontend application sends a request to the
    backend, this is considered a cross-origin request.


    We should never forget that browsers restrict cross-origin requests by default,
    and same-origin requests are the only ones allowed for requesting resources unless
    the origin requesting the resources includes the proper CORS headers and is permitted
    on the backend application. This is just a simple example of how CORS works. Let’s
    look at a more detailed overview of the concept of CORS.


    # How CORS works


    CORS is a header-based mechanism, which means that the first step to achieving
    cross-origin sharing is to add new HTTP headers that will describe the list of
    origins that are permitted to access resources. These headers can be described
    as our key to communication. The HTTP headers are divided into two categories,
    which are as follows:


    +   - Request headers

    +   - Response headers


    # Request headers


    Request headers are the headers required for the client to make use of the CORS
    mechanism. They are as follows:


    +   - Origin: This indicates the origin of the requesting client or simply the
    host of your frontend application.

    +   - Access-Control-Request-Method: This header is used on a preflight request
    to indicate the HTTP method used to make the request.

    +   - Access-Control-Request-Headers: This header is used on a preflight request
    to indicate the list of HTTP headers used for the request.'
  merge: -1
  img_proc: true
- pgno: 147
  md: 'Let''s see an example of what a request would look like using the request headers:


    ```

    curl -i -X OPTIONS localhost:8080/api/v1 \

    -H ''Access-Control-Request-Method: GET'' \

    -H ''Access-Control-Request-Headers: Content-Type, Accept'' \

    -H ''Origin: http://localhost:4200

    ```


    # Response headers


    Response headers are the headers that the servers send back with the response.
    They are as follows:


    +   - Access-Control-Allow-Origin: This is a header used to specify the origin
    of accessing the resource on the server.

    +   - Access-Control-Expose-headers: This header indicates the headers that the
    browser can access.

    +   - Access-Control-Max-Age: This is a header that indicates the information
    of preflight request expiration.

    +   - Access-Control-Allow-Credentials: This is a header that indicates that a
    browser can access the response when the request has valid credentials.

    +   - Access-Control-Allow-Headers: This header indicates the list of headers
    allowed to be used in a request.

    +   - Access-Control-Allow-Methods: This is a header that indicates the list of
    request methods that are allowed to be used in the server.


    Let''s see an example of what response we would like with the given headers:


    ```

    HTTP/1.1 204 No Content

    Access-Control-Allow-Origin: *

    Access-Control-Allow-Methods: GET,HEAD,PUT,PATCH,POST,DELETE

    Vary: Access-Control-Request-Headers

    Access-Control-Allow-Headers: Content-Type, Accept

    Content-Length: 0

    Date: Sun, 16 Nov 2022 3:41:08 GMT+8

    Connection: keep-alive

    ```


    These are the standard headers that we will use to allow the CORS mechanism, but
    there are several different scenarios in which cross-origin sharing works.'
  merge: -1
  img_proc: true
- pgno: 148
  md: '# Simple requests


    These are requests that don’t trigger CORS preflight requests and, having no initial
    request, will be sent to the server for validation. To consider a request to be
    simple, it should satisfy the following conditions:


    +   - Uses the POST and GET methods.

    +   - Contains headers that can be manually set, such as Accept, Accept-Language,
    Content-Language, and Content-Type.

    +   - Content-Type should have one of the following types: text/plain, multipart/form-data,
    or application/x-www-form-urlencoded.

    +   - No ReadableStream object is used in the request.


    Let’s see an example of a simple request:


    ```

    GET /content/test-data/ HTTP/1.1

    Host: example.host

    User-Agent: Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko)
    Chrome/77.0.3865.90 Safari/537.36

    Accept: text/html,application/xhtml+xml,application/

    xml;q=0.9,*/*;q=0.8

    Accept-Language: en-us,en;q=0.5

    Accept-Encoding: gzip,deflate

    Connection: keep-alive

    Origin: https://frontend.com

    ```


    This request will perform a simple exchange between the client and the server.
    In response, the server returns the header with Access-Control-Allow-Origin: *,
    which means that the resource or endpoint can be accessed by any origin.


    # Preflight requests


    The browser sends a test or first HTTP request using the OPTIONS method to validate
    that the request is permitted or safe. Preflight requests will always occur on
    cross-origin requests as preflight requests check whether a different origin is
    allowed or permitted to access the resource.


    Let’s see an example of a preflight request:


    ```

    OPTIONS /content/test-data/ HTTP/1.1

    Host: example.host

    User-Agent: Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko)
    Chrome/77.0.3865.90 Safari/537.36

    ```'
  merge: -1
  img_proc: true
- pgno: 149
  md: '```

    Accept: text/html,application/xhtml+xml,application/

    xml;q=0.9,*/*;q=0.8

    Accept-Language: en-us,en;q=0.5

    Accept-Encoding: gzip,deflate

    Connection: keep-alive

    Origin: https://frontend.com

    Access-Control-Request-Method: POST

    Access-Control-Request-Headers: X-PINGOTHER, Content-Type

    ```


    The preceding example shows that the preflight request uses the OPTIONS request
    method to execute the preflight request. The OPTIONS method is used to identify
    more information from the servers to know whether the actual request is permitted.


    We can also see that Access-Control-Request-Method and Access-Control-Request-Headers
    are identified. This indicates the request headers and request method to be used
    in the actual request.


    Here is the header info:


    ```

    HTTP/1.1 204 No Content

    Date: Sun, 16 Nov 2022 3:41:08 GMT+8

    Server: Apache/2

    Access-Control-Allow-Origin: https://frontend.com

    Access-Control-Allow-Methods: POST, GET, OPTIONS

    Access-Control-Allow-Headers: X-PINGOTHER, Content-Type

    Access-Control-Max-Age: 86400

    Vary: Accept-Encoding, Origin

    Keep-Alive: timeout=2, max=100

    Connection: Keep-Alive

    ```


    Now, in the preceding example, this is an example response returned after the
    preflight request. Access-Control-Allow-Origin indicates that access to resources
    is only allowed on the specified domain (https://frontend.com in the example).
    Access-Control-Allow-Methods confirms that POST and GET are valid methods. Access-Control-Allow-Headers
    ensures that X-PINGOTHER and Content-Type are proper headers for the actual request.


    We have learned the basic concepts of CORS; now, we will implement CORS in our
    Spring Boot application in the next section.'
  merge: -1
  img_proc: true
- pgno: 150
  md: "# Adding a CORS policy\n\nWe have learned how CORS works and the advantage\
    \ it brings to the security of our applications.\nNow, we will configure and implement\
    \ a CORS policy in our Spring Boot project.\n\nThere are several ways to configure\
    \ CORS on our project. We will discuss them one by one.\n\n# CORS applications\
    \ for each method\n\nWe can enable CORS on a single endpoint; this means that\
    \ we can specify different permitted origins\nfor other endpoints. Let’s have\
    \ a look at the following example:\n\n```\n```java\n@CrossOrigin\n@GetMapping\n\
    public List<AntiHeroDto> getAntiHeroes(Pageable pageable) {\n    ..code implementation\n\
    }\n```\n```\n\nIn our Spring Boot project, we have the getAntiHeroes() method.\
    \ To enable CORS on a specific\nmethod, we will use the @CrossOrigin annotation.\
    \ We can see that we have not configured any\nother settings, and this applies\
    \ the following:\n\n+   - All origins are permitted.\n+   - HTTP methods that\
    \ are allowed are the ones configured for the method (in this method, the allowed\
    \ HTTP method is GET).\n+   - The time of the preflight response is cached at\
    \ 30 minutes.\n\nWe can also specify the configuration of the CORS policy by adding\
    \ the values of the origin, methods,\nallowedHeaders, exposedHeaders, allowedCredentials,\
    \ and maxAge:\n\n```\n```java\n@CrossOrigin(origin = \"origin.example\")\n@GetMapping\n\
    public List<AntiHeroDto> getAntiHeroes(Pageable pageable) {\n    ..code implementation\n\
    }\n```\n```\n\n# CORS applications at the controller level\n\nIn the previous\
    \ configuration, we were adding CORS to each method. Now, we will add the CORS\n\
    policy at the controller level. Let’s have a look at the following example:\n\n\
    ```\n```java\n@CrossOrigin\n@AllArgsConstructor\n```\n```"
  merge: -1
  img_proc: true
- pgno: 151
  md: "```\n@RestController\n@RequestMapping(\"api/v1/anti-heroes\")\npublic class\
    \ AntiHeroController {\n.. methods\n}\n```\n\nWe can see that @CrossOrigin is\
    \ added at the class level. This means that the CORS policy will be added to all\
    \ the methods under AntiHeroController.\n\n# CORS application at the controller\
    \ and method levels\n\nWe can combine the application of CORS at both the controller\
    \ and method levels in our application. Let’s have a look at the following example:\n\
    \n```\n@CrossOrigin(allowedHeaders = \"Content-type\")\n@AllArgsConstructor\n\
    @RestController\n@RequestMapping(\"api/v1/anti-heroes\")\npublic class AntiHeroController\
    \ {\n    private final AntiHeroService service;\n    private final ModelMapper\
    \ mapper;\n\n    @CrossOrigin(origins = \"http://localhost:4200\")\n    @GetMapping\n\
    \    public List<AntiHeroDto> getAntiHeroes(Pageable pageable)\n{\n... code implementation\n\
    \    }\n}\n```\n\nWe can see in our example that we have applied the @CrossOrigin\
    \ annotation at both the controller and method levels, @CrossOrigin(allowedHeaders\
    \ = \"Content-type\") will be used on all the methods under AntiHeroController,\
    \ and @CrossOrigin(origins = http://localhost:4200) will be applied only on the\
    \ getAntiHeroes() method, thus other methods will allow all origins."
  merge: -1
  img_proc: true
- pgno: 152
  md: "# Global CORS configuration\n\nThe last way we can implement a CORS policy\
    \ is by using **global configuration**, which means that our CORS policy applies\
    \ to all the existing methods in our project. There are several ways to implement\
    \ global CORS configuration, and we will see how to implement CORS by using CorsFilter:\n\
    \n+   1. The first step is to add a configuration class for our CORS policy. To\
    \ accomplish this, go to the config folder of our project and create a new class\
    \ named CorsConfig. We will add the @Configuration annotation to identify this\
    \ class as a configuration upon starting the application, and we should have the\
    \ following code:\n\n```\n@Configuration\npublic class CorsConfig {\n\n}\n```\n\
    \n+   2. The next step is to create our CorsFilter Bean. We will just create a\
    \ new method with @Bean that returns a CorsFilter object:\n\n```\n@Bean\nCorsFilter\
    \ corsFilter() {\nCorsConfiguration corsConfiguration =\n    new CorsConfiguration();\n\
