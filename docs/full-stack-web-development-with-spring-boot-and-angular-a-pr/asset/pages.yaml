- pgno: 185
  md: 'other services, such as SSO and **Multi-Factor Authentication (MFA)**. These
    features can be cumbersome to work with and can require several sprints to modify,
    leading to a longer time to develop. This is where IDaaS comes to the rescue.


    IDaaS is a delivery model that allows users to connect, authenticate, and use
    identity management services from the cloud. IDaaS helps speed up the development
    process as all authentication and authorization processes are provided under the
    hood.


    It is commonly used by large and enterprise applications because of the advantages
    and features it offers. IDaaS systems utilize the power of cloud computing to
    handle **Identity Access Management (IAM)**, which ensures that the right users
    access the resources. It is very helpful as companies do not need to worry about
    security and IAM responsibilities, which are very demanding due to the adaptation
    of cybersecurity threats.


    # Types of IDaaS


    There are several types of IDaaS available on the market; some providers only
    provide clients with a directory, others offer several sets of features, which
    include SSO and MFA, but we will split IDaaS into two categories:


    +   - Basic IDaaS

    +   - Enterprise IDaaS


    # Basic IDaaS


    Small- and medium-sized businesses commonly use basic IDaaS. It usually provides
    SSO and MFA and a cloud directory for storing credentials.


    Basic IDaaS providers are also packaged with a more straightforward interface
    that gives users the capability to handle configuration and administrative tasks.


    # Enterprise IDaaS


    Enterprise IDaaS, compared to basic IDaaS, is more complex and used by large and
    enterprise businesses. This is commonly used to extend the IAM infrastructure
    of the organization and provide access management to web, mobile, and API environments.


    There are five requirements that an IDaaS should possess:


    +   - **SSO:** Gives users the capability to access all platforms and applications
    using a single authentication

    +   - **MFA:** Increases the layers of security, requiring the user to present
    two valid pieces of evidence to prove their identity

    +   - **Cloud directory:** Provides a cloud directory where data and credentials
    can be stored

    +   - **Access security:** Policy-based management for applications for increasing
    security'
  merge: -1
  img_proc: true
- pgno: 186
  md: '+   - **Provisioning**: Provides capabilities to automate the exchange of user
    identities between applications and service providers using **System for Cross-Domain
    Identity Management (SCIM)**


    Those are the five characteristics required of an IDaaS.


    If you are wondering about any examples of an IDaaS that you can use, here are
    some service providers:


    +   - **Google Cloud Identity**: Google Cloud Identity provides a wide range of
    security features for users to enable authentication, access management, and authorization.
    It is an enterprise IDaaS with several security features, such as SSO, MFA, automated
    user provisioning, and context-aware access.


    To learn more about Google Cloud Identity, you can visit https://cloud.google.com/identity.


    +   - **Okta Workforce Identity**: Okta is one of the top IDaaS providers on the
    market. It is also an enterprise IDaaS provider that has several basic and advanced
    features, such as SSO, MFA, Universal Directory, B2B integration, and API Access
    Management.


    Okta and Auth0 joined forces around 2021, providing identity platforms and solutions
    such as universal login, password-less authentication, and machine-to-machine
    communication.


    To learn more about Auth0 and Okta, you can visit the following links: https://auth0.com/
    and https://www.okta.com/workforce-identity/.


    +   - **Azure Active Directory**: Azure Active Directory is also an enterprise-grade
    IDaaS solution, the same as the other providers. It offers a wide range of security
    solutions, has several features, such as identity governance, unified identity
    management, and password-less authentication, for users, and best of all has a
    basic tier that is free to use.


    To learn more about Azure Active Directory, you can visit https://azure.microsoft.com/en-us/services/active-directory/.


    # Summary


    With this, we have reached the end of this chapter. Let’s have a recap of the
    valuable things you have learned. You have learned about the concept and importance
    of CORS and how it can provide security for accessing resources. We have discussed
    the different ways that we can implement CORS in our Spring Boot applications,
    which are at the method level, at the controller level, and a combination of both
    approaches.


    We have also learned about the concept and features of Spring Security and discussed
    the implementation of custom authentication and authorization in our application.
    Lastly, we have also learned about IDaaS, a delivery model that allows users to
    connect, authenticate, and use identity management services from the cloud.


    In the next chapter, we will be learning about the integration of event loggers
    into our Spring Boot application.'
