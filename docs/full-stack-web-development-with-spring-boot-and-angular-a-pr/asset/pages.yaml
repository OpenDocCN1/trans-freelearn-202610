- pgno: 44
  md: '# Linux installation


    When installing Java 17 on a Linux system, we also need to be aware of the version
    notation, as when choosing the installer for macOS. The version format represents
    the Feature, Interim, and Update versions. So, for example, if we are downloading
    the interim 1, update 1, and patch 2, then the installer name would be the following:


    +   - **Linux x64 systems:** `jdk-17.1.1.2_linux-x64_bin.tar.gz`

    +   - **Linux aarch64 systems:** `jdk-17.1.1.2_aarch64_bin.tar.gz`


    You can install the JDK on a Linux platform using the archive files or **Red Hat
    Package Manager (RPM)**:


    +   - **Archive Files (.tar.gz)** will install a private version of the JDK at
    any location without affecting other JDK installations. The bundle is available
    for Linux x66 and Linux aarchx64.

    +   - **RPM Packages (.rpm)** will execute a system-wide installation of the JDK
    and require users to have root access.


    # 64-Bit on Linux platforms


    To install the JDK for 64-bit Linux platforms, the tar.gz archive file, also known
    as a tarball, can be downloaded from the following URL: https://www.oracle.com/java/technologies/downloads/#jdk17-linux.


    The files that we see are as follows:


    +   - **Linux 64:** `jdk-17.interim.update.patch_linux-x64_bin.tar.gz`

    +   - **Linux aarch64:** `jdk-17.interim.update.patch_linux-aarch64_bin.tar.gz`


    After successfully downloading the tarball file, accept the license agreement
    and place the .tar.gz file in the directory where you want to install the JDK.


    Unpack the file and install the downloaded JDK as follows:


    ```

    tar zxvf jdk-17.interim.update.patch_linux-x64_bin.tar.gz

    ```


    Or with the following code:


    ```

    tar zxvf jdk-17.interim.update.patch_linux-aarch64_bin.tar.gz

    ```


    After successfully installing the JDK, we can see that it is now installed in
    a directory called `jdk-17.interim.patch.update`.'
  merge: -1
  img_proc: true
- pgno: 45
  md: '# 64-Bit on RPM-based Linux platforms


    We can install the JDK using RPM binary files for RPM-based Linux platforms, such
    as Oracle and Red Hat. Before installing the JDK, we must first make sure that
    we have root access. You can have root access by running the su command and entering
    the super password.


    The RPM file can be downloaded from https://www.oracle.com/java/technologies/downloads/#jdk17-linux,
    and we get the following files:


    +   - **Linux 64**: `jdk-17.interim.update.patch_linux-x64_bin.rpm`

    +   - **Linux aarch64**: `jdk-17.interim.update.patch_linux-aarch64_bin.rpm`


    Install the package using the following command:


    ```

    rpm -ivh jdk-17.interim.update.patch_linux-x64_bin.rpm

    ```


    Or use the following command:


    ```

    rpm -ivh jdk-17.interim.update.patch_linux-aarch64_bin.rpm

    ```


    After executing the command, the JDK is now successfully installed on our machine.
    Then, for future version upgrades, we can execute the following command:


    ```

    rpm -Uvh jdk-17.interim.update.patch_linux-x64_bin.rpm

    ```


    Or use the following command:


    ```

    rpm -Uvh jdk-17.interim.update.patch_linux-aarch64_bin.rpm

    ```


    We are done installing and configuring the JDK 17 on our machine on different
    operating systems. In the next section, we will install SDKMAN.


    # Installing SDKMAN


    This section will explain what the purpose of SDKMAN is in developing Java applications.
    This section will also guide you through the installation of SDKMAN on Windows,
    macOS, and Linux.


    **SDKMAN (Software Development Kit Manager)** is a tool for managing parallel
    versions of Java on our machine. We can have multiple versions of installed Java
    versions on our computer. You can also install Java directly using SDKMAN. It
    will automatically install the latest stable version or the version you specify.


    SDKMAN is mainly created for Unix operating systems, but it also supports Bash
    and ZSH shells for other operating systems.'
  merge: -1
  img_proc: true
- pgno: 46
  md: '# SDKMAN features


    The following are the features of SDKMAN:


    +   - SDKMAN makes the installation of Java easier. We will only execute a command
    with the version we want to install, and it will do all the work.

    +   - SDKMAN also supports Java development packages. It can install SDKs for
    JVM, such as Groovy and Kotlin.

    +   - SDKMAN can run on all Unix platforms: macOS, Cygwin, Solaris, and Linux.


    # SDKMAN commands


    To see all the SDKs that SDKMAN supports, we can execute the following command:


    ```

    sdk list

    ```


    The command will list all the SDKs and the Java library managers we can download
    on our machine.


    To install a specific SDK, for example, we want to install the latest SDK for
    Java, execute the following command:


    ```

    sdk install java

    ```


    If we want to install a specific version of the SDK, we will specify the version
    in the command as follows:


    ```

    sdk install java 15-open

    ```


    To switch between versions when multiple versions are installed on our computer,
    we will execute the following command:


    ```

    sdk default java 15-open

    ```


    # Installation on macOS and Linux


    It only takes a few commands to install SDKMAN on macOS and Linux. For us to install
    SDKMAN, we will execute the following command:


    ```

    curl -s https://get.sdkman.io | bash

    ```


    After following all the instructions on installing SDKMAN, open a new terminal
    and execute the following command:


    ```

    source "$HOME/.sdkman/bin/sdkman-init.sh"

    ```'
  merge: -1
  img_proc: true
- pgno: 47
  md: 'The command will successfully install the manager in your terminal. To check
    whether the installation is successful, we can execute the following command:


    ```

    sdk version

    ```


    This will display the current SDKMAN version installed on your machine.


    # Installation on Windows


    We need several steps to install SDKMAN on Windows since SDKMAN requires Bash
    tools. In this case, the first thing we need is a Git Bash Environment (MinGW):


    +   1. First, we will install 7-Zip, and after successful installation, we will
    execute the following command to make a symbolic link in the Git Bash environment,
    having 7-Zip as the zip command:


    ```

    ln -s /c/Program\ Files/7-Zip/7z.exe /c/Program\ Files/Git/mingw64/bin/zip.exe

    ```


    Now we can use the commands we use in Linux to install the SDKMAN.


    +   2. To install SDKMAN, we will execute the following command:


    ```

    export SDKMAN_DIR="/c/sdkman" && curl -s "https://get.sdkman.io" | bash

    ```


    +   3. After the installation, restart the Git Bash shell to run the SDKMAN commands.
    We can execute the following command to verify that our installation is successful:


    ```

    sdk version

    ```


    It will prompt the current version of SDKMAN installed in our terminal.


    We are done installing and configuring SDKMAN on our machine on different operating
    systems. In the next section, we will configure IntelliJ IDEA with the installed
    Java 17.


    # Setting up IntelliJ IDEA with Java 17


    We have installed our IDE (IntelliJ IDEA) and Java 17 on our machine in the previous
    sections. Now, we will guide you on how to configure Java 17 on new and existing
    projects.'
  merge: -1
  img_proc: true
