  md: '# Adding controllers


    This section will now discuss the use of controllers and how to create them in
    our application. **Controllers** are responsible for intercepting incoming requests
    and converting the payload of the request for the internal structure of the data;
    this is also where we will define our endpoint paths that will be available for
    access for our frontend applications.


    In creating controllers, we will use several annotations, as described here:


    +   - `@RestController`: This is a specialized form of the `@Controller` annotation;
    compared to using the `@Controller` annotation, it already includes both the `@Controller`
    and `@ResponseBody` annotation, not needing to specify the `@ResponseBody` annotation
    on each method.

    +   - `@RequestMapping`: This is an annotation used to map **HyperText Transfer
    Protocol (HTTP)** requests to the methods of **REpresentational State Transfer
    (REST)** controllers. It is also where we define a base path for the controller.

    +   - `@GetMapping`: This maps HTTP GET requests on a method; the annotation is
    a shortcut for `@RequestMapping(method = RequestMethod.GET)`.

    +   - `@PutMapping`: This maps HTTP PUT requests on a method; the annotation is
    a shortcut for `@RequestMapping(method = RequestMethod.PUT)`.

    +   - `@PostMapping`: This maps HTTP POST requests on a method; the annotation
    is a shortcut for `@RequestMapping(method = RequestMethod.POST)`.

    +   - `@DeleteMapping`: This maps HTTP DELETE requests on a method; the annotation
    is a shortcut for `@RequestMapping(method = RequestMethod.DELETE)`.

    +   - `@PathVariable`: This annotation is used to get the value of endpoint parameters.

    +   - `@Valid`: This annotation is used to check the validity of an object; it
    is commonly used on the request body to check whether a passed request is a valid
    object.


    We have successfully identified the annotations we will use for our controller.
    We can now create our controller. Under the `antiHero` package, create a new package
    named `controller`, and after completing the `controller` package, create a new
    class called AntiHeroController.


    In the AntiHeroController class, we will use the `@AllArgsConstructor`, `@RestController`,
    and `@RequestMapping` annotations, as follows:


    ```

    @AllArgsConstructor

    @RestController

    @RequestMapping("api/v1/anti-heroes")

    public class AntiHeroController {


    }

    ```'
