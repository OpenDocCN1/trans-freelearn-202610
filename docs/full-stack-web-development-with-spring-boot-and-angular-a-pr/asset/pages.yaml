- pgno: 273
  md: "```\n<p>\n    <label for=\"email\">Email </label>\n    <input type=\"text\"\
    \ id=\"email\" name=\"email\" ngModel>\n</p>\n<button type=\"submit\">Submit</button>\n\
    </form>\n```\n\n# When to use template-driven forms\n\nTemplate-driven forms are\
    \ very flexible and easy to implement in Angular applications. However, this approach\
    \ has some limitations and can cause an impact in terms of maintainability; some\
    \ of the best scenarios for using a template-driven approach in building forms\
    \ are set out here:\n\n+   - It’s easier to use template-driven forms when migrating\
    \ from AngularJS to Angular2, such that both use the ngModel directive.\n+   -\
    \ Template-driven forms are more suitable in simple and small forms that do not\
    \ require complex validations since validation is applied at the template level.\
    \ This could be a disadvantage as it will be hard to maintain validations on larger\
    \ applications at the same time. It has limitations on applying validations to\
    \ the form controls.\n\nIn the second of the aforementioned scenarios, reactive\
    \ forms are chosen over template-driven forms as complex forms can be handled\
    \ better with reactive forms, especially in implementing validations. Let’s now\
    \ understand the concept of reactive forms.\n\n# The reactive approach\n\nA reactive\
    \ form is the second approach in building forms in Angular applications; this\
    \ is the most commonly used approach as it is more effective in handling complex\
    \ forms than template-driven forms. Reactive forms are also known as model-driven\
    \ forms, in which we define the structure of our forms in the component class\
    \ instead of defining it in the template.\n\nWe also define the validations in\
    \ the class before we bind it in to our HTML form, which means that the logic\
    \ and validation patterns will now be separated from the HTML template and will\
    \ be maintained by the TypeScript side of our component.\n\n# Using reactive forms\n\
    \nThe first step for us to use reactive forms is to import ReactiveFormsModule;\
    \ this is usually imported into the root module or the shared module of the application.\
    \ ReactiveFormsModule contains all directives—such as formGroup and formControlName—that\
    \ will allow us to implement reactive forms; this is also found under the @angular/forms\
    \ package."
  merge: -1
  img_proc: true
- pgno: 274
  md: "After successfully importing `ReactiveFormsModule`, the next step is to create\
    \ our HTML form template and create a model using `FormGroup`, `FormControl`,\
    \ and `FormArray`. These are the three building blocks of reactive forms that\
    \ we will use to bind our form templates and are outlined in more detail here:\n\
    \n+   - `FormControl`: This represents a single form element inside a form; it\
    \ stores the value of a form element that allows us to retrieve data from each\
    \ input.\n+   - `FormArray`: This is a collection of form controls that allows\
    \ us to dynamically add and remove controls to accept more values from the form.\n\
    +   - `FormGroup`: This is a collection of form controls; it can also contain\
    \ another form group or form arrays.\n\nAssuming we have a `HeroesComponent`,\
    \ we will create a `FormGroup` by writing the following code in the class component:\n\
    \n```\nuserForm = new FormGroup({})\n```\n\nIn the preceding code example, we\
    \ have instantiated a new `FormGroup` and assigned it to the `userForm` variable;\
    \ this is only a form group, and we have not yet added form controls to the model.\
    \ To add a form control, we will place the following code:\n\n```\nuserForm =\
    \ new FormGroup({\n  email: new FormControl(),\n  firstName: new FormControl(),\n\
    \  lastName: new FormControl(),\n});\n```\n\nWe can see in the preceding example\
    \ that we have added three form controls to our `FormGroup`; this can now be bound\
    \ to the HTML form template in our application to capture the values and state\
    \ of form elements.\n\nLet’s now create an HTML form template with `formGroup`\
    \ and `formControlName` directives:\n\n```\n<form [formGroup]=\"userForm\" (ngSubmit)=\"\
    onSubmit()\">\n  <p>\n    <label for=\"email\">Email </label>\n    <input type=\"\
    text\" id=\"email\" name=\"email\"\n      formControlName=\"email\">\n  </p>\n\
    \  <p>\n    <label for=\"firstname\">First Name </label>\n```"
  merge: -1
  img_proc: true
- pgno: 275
  md: '```

    <input type="text" id="firstname" name="firstName" formControlName="firstname">

    </p>

    <p>

    <label for="lastname">Last Name </label>

    <input type="text" id="lastname" name="lastname" formControlName="lastName">

    </p>

    <p>

    <button type="submit">Submit</button>

    </p>

    </form>

    ```


    In the example code, we can see that the template is almost the same as the template-driven
    forms. The only difference is that we use formGroup and formControlName directives
    to bind our form. The formGroup directive is used to bind the userForm form group
    in our component class; on the other hand, the formControlName directive is used
    to bind the values and the state of the form controls defined in the userForm
    form group. Lastly, we are still using the ngSubmit event to call a method when
    the Submit button in the form is clicked.


    We have now successfully created a reactive form in our application, but this
    only covers the basic features and concepts of reactive forms. In the following
    sections of this chapter, we will be discussing the functionalities and capabilities
    of form controls and form groups.


    # Basic form controls


    This section will now discuss more of the concepts of form controls in reactive
    forms. We have already created an example of form controls in the previous section,
    but now, we will discover more about the functions and capabilities of form controls
    in Angular.


    Form controls represent a single form element inside a form; they store the value
    of a form element that allows us to retrieve data of each input. This can be input,
    textarea, or any element that accepts values. When used in Angular, form controls
    can be instantiated by adding new FormControl('''') code; we can see that it takes
    a single argument that defines the values of the control. These values can be
    null as form controls can be reset.


    Form controls are like the properties of a JSON object, but compared to JSON,
    each control has its methods that will help us control, modify, and validate the
    values.


    Next, let''s have a look at the different methods and features of form controls.'
