    Figure 10.10 – Example output for the Material button


    # Icon component


    This component allows us to add vector-based icons to the application and supports
    both icon fonts and SVG icons.


    We can import the icon component using the following code:


    ```

    import {MatIconModule} from ''@angular/material/icon'';

    ```


    Here’s an example of the icon component:


    ```

    <mat-icon color="primary">delete</mat-icon>

    <mat-icon color="accent">fiber_new</mat-icon>

    <mat-icon color="warn">pageview</mat-icon>

    ```


    In the preceding code example, we can create icons by using the mat-icon component.
    This has several input properties such as color that allow us to customize the
    color of the icon. The example code will have the following output:


    ![](img/7c3ddd2e5893c9b5a0220148ed886548_259_1.png)


    Figure 10.11 – Example output for the Material icon


    # Table component


    This component allows us to add a data table with Material Design styling. The
    Material table is based on the foundation of the CDK data table. For more information
    on how to implement a CDK data table, see the documentation at https://material.angular.io/cdk/table/overview.


    We can import the table component using the following code:


    ```

    import {MatTableModule} from ''@angular/material/table'';

    ```'
