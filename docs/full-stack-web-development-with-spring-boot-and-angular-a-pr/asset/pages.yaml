- pgno: 394
  md: '# What is frontend-maven-plugin?


    Okay – before I answer the question of what `frontend-maven-plugin` is, let’s
    see how we can package our application. We can build Spring Boot to generate a
    JAR file and create a production build of Angular as well.


    But what if we can create a JAR file for Spring Boot that will also contain the
    production build of Angular inside it? The approach of putting the frontend and
    the backend in a single JAR file will provide us with an easier way to deploy
    the application to test and production environments.


    It will allow us to manage a single path for the API and the frontend application.
    To do this, we will require a Maven plugin called `frontend-maven-plugin` (`https://github.com/eirslett/frontend-maven-plugin`),
    which will help us create a JAR file that contains both our backend and frontend.


    Some requirements ensure that our backend and frontend will work together. In
    the next section, we’ll find out what configurations we need in our backend and
    frontend.


    # Adding configurations to Spring Boot and Angular’s integration


    In this section, we will write some configurations in the Spring Boot application
    and the Angular application to ensure that Spring Boot will run in production
    and that Angular will render the web application’s user interface.


    First, let’s move the Angular app to the directory of our Spring Boot application.


    # Adding the Angular app to the Spring Boot project


    In this section, we will move the Angular app to the Spring Boot project. By doing
    this, there will be an Angular project inside the Spring Boot project.


    To start, create a new folder named `frontend` inside the Spring Boot project.
    Move all the files and folders of the Angular application inside the `frontend`
    folder, like so:'
  merge: -1
  img_proc: true
- pgno: 395
  md: '![](img/7c3ddd2e5893c9b5a0220148ed886548_395_0.png)


    Figure 16.1 – The frontend folder inside the Spring Boot project


    Figure 16.1 shows all the Angular files and folders inside the frontend folder,
    which is inside the Spring Boot project.


    You can name the frontend folder whatever you want, so long as you map the path
    of the frontend folder to the workingDirectory property of Frontend Mavin Plugin
    and the fileset property of Apache Maven AntRun Plugin, which allows you to run
    Ant tasks from within Maven.


    Let''s use the two Maven plugins, frontend-maven-plugin and maven-antrun-plugin,
    which we need in the next section.'
  merge: -1
