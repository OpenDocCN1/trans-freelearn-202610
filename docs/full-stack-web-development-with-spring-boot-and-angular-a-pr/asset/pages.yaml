  md: "```\n```html\n<input type=\"text\" name=\"firstname\" ngModel>\n</p>\n<p>\n\
    \    <label for=\"lastname\">Last Name</label>\n    <input type=\"text\" name=\"\
    lastname\" ngModel>\n</p>\n<p>\n    <label for=\"email\">Email </label>\n    <input\
    \ type=\"text\" id=\"email\" name=\"email\" ngModel>\n</p>\n</form>\n```\n```\n\
    \nLastly, we will add an ngSubmit event to submit the data of the form component.\
    \ We will add the ngSubmit event to the form tag and add a method to the component\
    \ class to receive the data. Let’s have a look at the following code example:\n\
    \n```\n```text\n<!--HTML template -- >\n<form #userForm=\"ngForm\" (ngSubmit)=\"\
    onSubmit(userForm)\">\n\n<!--typescript file (Component class) -- >\nonSubmit(contactForm)\
    \ {\n    console.log(userForm.value);\n}\n```\n```\n\nIn the preceding code example,\
    \ once the user has clicked the **Submit** button of the form, this will call\
    \ the onSubmit( ) method, and it will display the form control values as a JSON\
    \ object in our console; this will now allow us to use the form values in sending\
    \ data implementing business logic.\n\nAfter successfully implementing all the\
    \ steps, we will now have a final template for the template-driven form:\n\n```\n\
    ```html\n<form #userForm=\"ngForm\" (ngSubmit)=\"onSubmit(userForm)\">\n<p>\n\
    \    <label for=\"firstname\">First Name</label>\n    <input type=\"text\" name=\"\
    firstname\" ngModel>\n</p>\n<p>\n    <label for=\"lastname\">Last Name</label>\n\
    \    <input type=\"text\" name=\"lastname\" ngModel>\n</p>\n```\n```"
