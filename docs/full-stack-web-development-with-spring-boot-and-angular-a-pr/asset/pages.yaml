  md: "```\n<li><a href=\"#\">About</a></li>\n    <li><a href=\"#\">Contact Us</a></li>\n\
    </ul>\n</div>\n</nav>\n```\n\nThe navigation bar must be present on every page\
    \ of our application. This process will cause redundant code, which means we will\
    \ have to repeat this code over and over again. However, in Angular, it has been\
    \ developed into a component, allowing us to reuse the code in different parts\
    \ of the application. A specific selector is assigned to the navigation bar code\
    \ and used as the HTML tag for the component, as shown in the following code:\n\
    \n```\n<!--example selector for the navigation bar component-->\n<app-navigation-bar/>\n\
    ```\n\n# Cross-platform-enabled\n\nAngular is used to build applications for the\
    \ web, as well as native mobile and desktop applications. This is now possible\
    \ through frameworks, such as Ionic, NativeScript, and Electron. Aside from PWAs,\
    \ Ionic and NativeScript are also used to create mobile apps using Angular. On\
    \ the other hand, Electron is a framework that transforms your Angular app into\
    \ a desktop application using a similar code base. This feature makes Angular\
    \ very flexible as a single framework can cover all the platforms for your application.\n\
    \n# Web components\n\nAngular supports **web components**, which are also known\
    \ as **Angular elements**. Here, the idea is to break an application into smaller\
    \ pieces and distribute it into an independent application or package that can\
    \ be distributed and used on other applications. Angular elements cover the concepts\
    \ of micro frontends. Every element has a pipeline for deployment. This component\
    \ can also be used in different JavaScript frameworks, such as React and Vue.\n\
    \n# Supports lazy loading\n\nLoading all the JavaScript code in the client browser\
    \ could introduce some issues. If the applications get more extensive, more code\
    \ would be packed into one chunk. We don’t want to bootstrap all of our code as\
    \ this would cause our application to load slowly when it’s started for the first\
    \ time. We only want to load what is needed on demand. The lazy loading feature\
    \ by Angular solves this. It only loads the modules, components, services, directives,\
    \ and other elements of the application that are needed for a specific route.\
    \ This feature reduces the loading time as the user initially opens the application."
