- pgno: 116
  md: "After successfully adding the method for our service, we will add @AllArgsConstructor\
    \ and @Service annotations to AntiHeroService. @AllArgsConstructor is an annotation\
    \ from Lombok that will generate a constructor that requires one argument of each\
    \ field; in our example, this will produce the following code:\n\n```\npublic\
    \ AntiHeroService(AntiHeroRepository repo) {\n    this.repo = repo;\n}\n```\n\n\
    This will now allow the wiring of our AntiHeroRepository dependency on our service.\n\
    \nThe @Service annotation, on the other hand, is functional when we want Spring\
    \ Context to autodetect classes based on their classification.\n\nWe have now\
    \ successfully created our service with CRUD methods, but what if something went\
    \ wrong as we call our service? For example, the identifier (ID) of the anti-hero\
    \ we have passed may not exist. We would want to catch the error and return an\
    \ understandable message to the user. Now, we will create runtime exception handling\
    \ for our service.\n\n# Runtime exceptions\n\nRuntime exceptions are also known\
    \ as unchecked exceptions. These are programming errors and will happen upon the\
    \ current execution of our application. This should be prevented directly by the\
    \ developers.\n\nSome known runtime exceptions are listed here:\n\n+   - IndexOutOfBoundsException:\
    \ This exception occurs when we access an index of an array string or an iterable\
    \ that is out of range, as illustrated in the following code snippet:\n\n```\n\
    String[] array = new String[100];\nString name = array[200]; // throws index out\
    \ of bounds\nas array variable only has a length of 100\n```\n\n+   - IllegalArgumentException:\
    \ This exception occurs when a method has been passed by an illegal argument,\
    \ as illustrated in the following code snippet:\n\n```\npublic class Hero {\n\
    \    int number;\n    public void givePositiveNumber(int number) {\n        if(number\
    \ < 0)  throw new\n            IllegalArgumentException(\n            Integer.toString(number));\n\
    \        else { m = number; }\n    }\n```"
  merge: -1
  img_proc: true
- pgno: 117
  md: "```\n}\npublic static void main(String[] args) {\n    Hero h = new Hero();\n\
    \    // throws illegal argument exception as -1 is a\n    // negative number\n\
    \    h.givePositiveNumber(-1);\n}\n}\n```\n\n+   - NullPointerException: This\
    \ exception occurs when a variable is accessed that does not point to any object\
    \ or is simply null, as illustrated in the following code snippet:\n\n```\npublic\
    \ void doAction(ExampleObject obj) {  obj.\ndoActionOnMethod();\n}\n// call doAction()\n\
    // throws null pointer exception as we are accessing a\n// method on a null object\n\
    doAction(null)\n```\n\nThese are just common runtime exceptions that we use in\
    \ our application; we can also create runtime exceptions using the RunTimeException\
    \ class. In this example, let’s create a NotFoundException runtime exception that\
    \ we will use to get a non-existent ID. Proceed as follows:\n\n+   1. Under the\
    \ main package, create a new package named exception; after successfully creating\
    \ the package, create a class named NotFoundException. We will extend our created\
    \ class with the RunTimeException class and will add the following code:\n\n```\n\
    public class NotFoundException extends RuntimeException {\n\n    public NotFoundException(String\
    \ message) {\n        super(message);\n    }\n\n    public NotFoundException(String\
    \ message,\n                            Throwable cause) {\n        super(message,\
    \ cause);\n    }\n}\n```"
