- pgno: 187
  md: '# Logging Events in Spring Boot


    In the previous chapter, we discussed the ideas, features, and implementation
    of **Cross-Origin Resource Sharing (CORS)** in securing our application. We also
    learned about **JSON Web Tokens (JWTs)** and how to generate one by creating authentication
    endpoints.


    This chapter will focus on logging events in our Spring Boot application. We will
    discuss the popular packages for logging in to and configuring Spring Boot, where
    to save them, and what to do with logs as we develop our application.


    In this chapter, we will cover the following topics:


    +   - Getting started with SLF4J and Log4j2

    +   - Setting up SLF4J and Log4j2

    +   - Using logs


    # Technical requirements


    The finished version of this chapter''s code may be seen at the following link:
    https://github.com/PacktPublishing/Spring-Boot-and-Angular/tree/main/Chapter-08/superheroes.


    # Getting started with SLF4J and Log4j2


    **Logging** is considered one of the most important aspects of developing an application.
    Its importance tends to be underrated and, worse, we forget to apply it to our
    applications.


    Event logging is used in most tech industries, especially those providing enterprise
    applications. It is applied with a given standard to prevent complex debugging
    and allow for an easier understanding of the code we are reading. A well-written
    and structured log can benefit developers, especially when maintaining or debugging
    code from another developer. Instead of searching exhaustively for an error, records
    will expedite the debugging process, providing information on where and why the
    error occurred, and what has happened in our application.'
  merge: -1
  img_proc: true
- pgno: 188
  md: 'Logging has also evolved with improvements in languages and frameworks; in
    backend development, several logging frameworks have been developed to provide
    more flexible logging capabilities. Some of the example frameworks that we will
    discuss are SLF4J and Log4j2 for Java Spring Boot. Before proceeding, let’s discuss
    the features of a logging framework.


    # Features of a logging framework


    A logging framework contains the following three features for us to display and
    capture events in our application:


    +   - **Logger**: Gets the messages and the metadata

    +   - **Formatter**: Formats messages retrieved from the logger

    +   - **Handler**: Responsible for printing the messages in the debug console
    or inserting them in the database for the developer


    A logging framework also displays messages with different severity levels, allowing
    the developer to quickly identify which event has occurred. The severity levels
    in a logging framework are as follows:


    +   - **FATAL**: Level 1; considered a critical issue that can cause an application
    to pause or terminate

    +   - **ERROR**: Runtime errors in the application

    +   - **WARNING**: Logs that usually display deprecated APIs

    +   - **INFO**: Logs that display events on the runtime of the application

    +   - **DEBUG**: Logs that display information on the flow of the application

    +   - **TRACE**: Logs that display more detailed information on the flow of the
    application


    # Logging using SLF4J


    One of the popular logging frameworks being used with Java is **Simple Logging
    Façade for Java**, or **SLF4J**. It is one of the most widely used frameworks
    since it allows users to use any logging frameworks, such as Log4j, Logback, the
    `java.util.logging` package, or Java’s own logging engine, JUL, using only a single
    dependency. This means that we can switch from one logging framework to another
    depending on what is needed.


    There are several advantages to using SLF4J:


    +   - SLF4J enables us to switch from one framework to another at runtime or deployment.

    +   - SLF4J has a migrator tool that allows us to migrate existing projects using
    the Java Class Library from Log4j to SLF4J.

    +   - SLF4J supports parameterized logging messages to bind dynamic values for
    our logs.'
  merge: -1
  img_proc: true
- pgno: 189
  md: '+   - SLF4J decouples the application from the logging framework. We do not
    need to worry about which logging framework is being used when developing our
    application.


    # Methods and classes of SLF4J


    SLF4J provides several classes and methods for displaying messages with severity
    levels, profiling the time of execution, or simply returning the instance of the
    logger. Let’s discuss the provided methods and classes.


    # Logger interface


    The logger interface is mainly used to display the messages or logs provided with
    the severity level. This is also the entry point of the SLF4J API.


    +   - `void debug(String message)`: Logs the message at the **DEBUG** level

    +   - `void error(String message)`: Logs the message at the **ERROR** level

    +   - `void info(String message)`: Logs the message at the **INFO** level

    +   - `void trace(String message)`: Logs the message at the **TRACE** level

    +   - `void warn(String message)`: Logs the message at the **WARN** level


    # The LoggerFactory class


    The LoggerFactory class is the SLF4J utility class, commonly used to create loggers
    using frameworks such as JUL and Log4j.


    Logger getLogger(String name) generates the logger object with a specified name.
    The following example uses the getLogger() method:


    ```

    private static final org.slf4j.Logger log = org.slf4j.LoggerFactory.getLogger(LogClass.class);

    ```


    # The Profiler class


    The Profiler class is mainly used to identify the execution time of a specific
    task in our application, also known as the **poor man''s profiler**.


    Various methods may be used:


    +   - `void start(string name)` creates a new child stopwatch with a specific
    name and stops the previously created stopwatches.

    +   - `TimeInstrument stop()` stops the recent child and global stopwatches and
    will return the current time execution.'
  merge: -1
  img_proc: true
