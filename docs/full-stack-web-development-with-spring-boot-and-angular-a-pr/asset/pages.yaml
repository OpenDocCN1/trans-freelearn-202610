  md: '# Class assertions


    **Class assertions** are used to check the fields, types, access modifiers, and
    annotations in a specific class. The following are some of the class assertion
    methods:


    +   - isNotInterface(): Verifies that the class is not an interface:


    ```

    Interface Hero {}

    class Thor implements Hero {}

    Assertions.assertThat(Thor.class).isNotInterface()

    ```


    +   - isInterface(): Verifies that the class is an interface:


    ```

    Interface Hero {}

    class Thor implements Hero {}

    Assertions.assertThat(Hero.class).isInterface()

    ```


    +   - isPublic(): Verifies that the class is public:


    ```

    public class Hero {}

    protected class AntiHero {}

    Assertions.assertThat(Hero.class).isPublic()

    ```


    +   - isNotPublic(): Verifies that the class is not public:


    ```

    public class Hero {}

    protected class AntiHero {}

    Assertions.assertThat(Hero.class).isNotPublic()

    ```


    These are just some of the assertions available under AbstractClassAssert. For
    the complete documentation, you can go to https://joel-costigliola.github.io/assertj/core-8/api/org/assertj/core/api/AbstractClassAssert.html.


    # Iterable assertions


    **Iterable assertions** are used to verify an iterable or array object based on
    its length and contents. The following are some of the iterable assertion methods:


    +   - contains(): Demonstrates that the iterable has the given values:


    ```

    List test = List.asList("Thor", "Hulk", "Dr. Strange");

    assertThat(test).contains("Thor");

    ```'
