  md: "We have created our interface, but this is just a simple interface. We will\
    \ extend our interface with the CrudRepository class to convert it to a JPA repository,\
    \ as follows:\n\n```\npublic interface AntiHeroRepository extends\nCrudRepository<AntiHeroEntity,\
    \ UUID> {\n}\n```\n\nAntiHeroRepository, as we have already extended it with CrudRepository<Type,\
    \ ID>, will have methods that have the following functionalities:\n\n+   - Persisting,\
    \ updating, and deleting one of the blog entities\n+   - Finding one or multiple\
    \ blogs by their PKs\n+   - Counting all blogs\n+   - Validating whether a single\
    \ blog exists\n\nWe have successfully created our JPA repository; our next step\
    \ is to do our service. Our goal is to create a service that will have the capability\
    \ to get an entire list, get a single database in a PK, insert new data, update\
    \ selected data, and delete data. We can achieve this through the following methods\
    \ provided by the JPA repository:\n\n+   - findAll(): Gets all the existing data\
    \ in a specific entity\n+   - findById(Id): Finds a particular database by PK\n\
    +   - save(): Inserts new data in the table\n+   - save(data): Updates existing\
    \ data in the table\n+   - deleteById(id): Deletes specific data in the table\
    \ by PK\n\nNow that we have successfully identified the methods we need for our\
    \ service, let's next create our service. Right-click on the antiHero package\
    \ and create a new package named service; after creating the new package, create\
    \ a new class under the service package called AntiHeroService, and we will place\
    \ the following methods inside the service:\n\n```\npublic class AntiHeroService\
    \ {\n\n    private final AntiHeroRepository repo;\n\n    public Iterable<AntiHeroEntity>\
    \ findAllAntiHeroes() {\n        return repo.findAll();\n    }\n}\n```"
