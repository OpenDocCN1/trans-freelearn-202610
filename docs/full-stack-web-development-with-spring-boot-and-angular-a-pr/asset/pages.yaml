  md: "If you change should(\"contain\", \"Login\"); to should(\"contain\", \"Register\"\
    );, the test will fail, which is an indicator that the test is accurate and that\
    \ it is not just passing anything we write in the test.\n\nWith that, we have\
    \ finished writing a simple E2E test using Cypress and saw that our tests are\
    \ passing. In the next section, we will mock HTTP responses and intercept HTTP\
    \ requests that our Angular application sends so that we no longer need the backend\
    \ application to run these tests.\n\n# Mocking HTTP responses and intercepting\
    \ HTTP requests\n\n**Mocking tests** can help us isolate and focus on tests and\
    \ not on the state of external dependencies or behavior. In this section, we will\
    \ mock the HTTP responses of our server and intercept the HTTP requests of our\
    \ Angular application for testing. We are going to intercept the HTTP requests\
    \ so that we can send fake responses to Angular and not pollute our dev database.\n\
    \nWe will start by adding a new file to the root of the cypress directory. Name\
    \ the file global.d.ts. The global.d.ts file, also known as global libraries,\
    \ provides a way to make interfaces and types globally available in our TypeScript\
    \ code.\n\nAfter creating the global.d.ts file, write the following code inside\
    \ it:\n\n```\n/// <reference types=\"cypress\"/>\n\ndeclare namespace Cypress\
    \ {\n    interface Chainable {\n        getCommand(url: string, responseBody:\
    \ Array<any>):\n            Chainable<any>;\n        deleteCommand(url: string):\
    \ Chainable<any>;\n        postCommand(url: string, requestBody: any):\n     \
    \       Chainable<any>;\n    }\n}\n```\n\nThe preceding code allows us to use\
    \ custom chainable commands, which will give us IntelliSense whenever we hit the\
    \ dot after writing cy.\n\nNow that we’ve added global.d.ts, let’s install a library\
    \ that can generate a unique universal ID, also known as a UUID, and use it as\
    \ a temporary ID for a fake object we will create to respond to Angular’s HTTP\
    \ request."
  merge: -1
  img_proc: true
- pgno: 379
