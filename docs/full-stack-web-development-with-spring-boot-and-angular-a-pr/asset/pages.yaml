  md: '# 13


    # Saving, Deleting, and Updating with NgRx


    In the previous chapter, we learned about the concepts and features of NgRx. We
    learned the importance of state management as it provides a single source for
    the application to have a unidirectional data flow and reduces the responsibility
    of components. We also learned the building blocks of NgRx, which are actions,
    effects, reducers, and selectors. Lastly, we implemented the getting and displaying
    of the anti-heroes list feature using NgRx in our application.


    In this chapter, we will now complete our application''s missing features – saving,
    deleting, and updating data by still using NgRx.


    In this chapter, we will cover the following topics:


    +   - Removing an item without side effects using NgRx

    +   - Removing an item with side effects using NgRx

    +   - Adding an item with side effects using NgRx

    +   - Updating an item with side effects using NgRx


