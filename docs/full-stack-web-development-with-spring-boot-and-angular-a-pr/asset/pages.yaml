  md: '# 10

    Setting Up Our Angular Project

    and Architecture


    In the previous chapter, you learned about the concepts of JUnit, which is a testing
    framework that offers features such as fixtures, test suites, and classes to test
    the methods in our application. You also learned the application of AssertJ with
    JUnit, which gives a more flexible way of asserting objects in our unit tests,
    and lastly, you also understood the importance of Mockito, which provides us with
    the ability to mock objects and services, omitting the use of the database in
    unit tests.


    In this chapter, we will start building our frontend application using Angular;
    we will be tackling the main fundamentals of Angular, such as components, modules,
    directives, and routes. We will also point out some of the best practices for
    organizing our Angular project.


    In this chapter, we will cover the following topics:


    +   - Organizing features and modules

    +   - Structuring components

    +   - Adding Angular material


    # Technical requirements


    The link to the finished version of this chapter is here: https://github.com/PacktPublishing/Spring-Boot-and-Angular/tree/main/Chapter-10/superheroes.


    # Organizing features and modules


    In this section, we will be discussing how we can organize and structure our Angular
    project to make it optimized and maintainable. Since Angular is considered a Model
    View Whatever (MVW) framework, Angular developers have the freedom to implement
    their choice of pattern in developing the project. This could be confusing, as
    you will experience different structures and standards switching from one'
