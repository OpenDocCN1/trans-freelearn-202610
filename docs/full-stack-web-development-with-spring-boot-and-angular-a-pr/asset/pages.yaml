  md: 'Pass the "/**" argument into addResourceHandler, like so:


    ```

    addResourceHandler("/**")

    ```


    This will make the configuration affect all project routes. This part belongs
    to the external-facing URI of the application.


    Then, map the external-facing URI path to the directory where the resources are
    located, like so:


    ```

    addResourceLocations("classpath:/public/")

    ```


    Finally, add new ClassPathResource ("/public/index.html"). This redirects requests
    that are not handled by the Spring Boot application that are going to the Angular
    application or the frontend application.


    We are close to packaging both applications into one. We’ll learn how to do this
    in the next section.


    # Packaging Spring Boot


    In this section, we will package the Spring Boot application and the Angular application.
    The idea is to combine the two applications, giving you one single JAR file to
    deploy. Let’s learn how to do this.


    After all the configurations we did, now, it’s a matter of running the following
    Maven commands in the same order:


    ```

    mvn clean

    mvn package

    ```


    The mvn clean command cleans the Maven project by deleting the target directory,
    whereas the mvn package command builds the Maven project and creates an executable
    JAR file.


    These two Maven commands are enough to create an executable JAR file with the
    Spring Boot and Angular packages inside it; see Figure 16.2:'
