- pgno: 396
  md: "# Using frontend-maven-plugin\n\nIn this section, we will use frontend-maven-plugin,\
    \ which will install npm and Node.js locally. It will also run the npm build command\
    \ in the frontend folder and copy the build files that npm build has generated.\n\
    \nSo, let's start:\n\n+   1. Go to your pom.xml file and insert the following\
    \ code as one of the build plugins in your Maven pom file:\n\n```\n<plugin>\n\
    \    <groupId>com.github.eirslett</groupId>\n    <artifactId>frontend-maven-plugin</artifactId>\n\
    \    <version>1.12.1</version>\n    <configuration>\n        <workingDirectory>frontend</workingDirectory>\n\
    \        <installDirectory>target</installDirectory>\n    </configuration>\n...\n\
    // See full code on https://github.com/PacktPublishing/Spring-Boot-and-Angular/tree/main/Chapter-16/superheroes\n\
    </plugin>\n```\n\nThe preceding markup shows that, while building the Spring Boot\
    \ application, the plugin will install Node.js v16.17.0 and npm CLI 8.19.1 in\
    \ the frontend working directory. It will also execute the npm install command\
    \ to download all dependency packages of the Angular application.\n\nAfter performing\
    \ all the necessary installations, the next thing that the plugin will execute\
    \ is the npm run build command, which will create a production build of the Angular\
    \ application.\n\n+   2. Next, we must edit the npm build script in the package.json\
    \ file of the Angular application using the following code:\n\n```\n\"build\"\
    : \"ng build --configuration production\",\n```\n\nThe preceding code tells Angular\
    \ that npm run build is for a production build."
  merge: -1
