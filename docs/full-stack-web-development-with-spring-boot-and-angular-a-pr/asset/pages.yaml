- pgno: 243
  md: "# Blocks under the features module\n\nWe want to create the blocks under our\
    \ features module; the first thing we need to scaffold is AntiHeroModule. Execute\
    \ the ng g m anti-hero command to generate the module under the src/app folder.\n\
    \nNow, under the anti-hero folder, we will create the following folders:\n\n+\
    \   - components: This will contain components that will be shared in this module.\n\
    +   - pipes: This will contain all the pipes used by the anti-hero module.\n+\
    \   - directives: This will contain all the directives that the anti-hero module\
    \ will use.\n+   - pages: This will contain components that have a direct route.\n\
    \nAfter creating the folders, we will now make the page components for our anti-hero\
    \ module. We will add two pages where the first one will be the page for displaying\
    \ the list of anti-heroes and the second one will be a form that allows us to\
    \ view, create, or modify the selected hero in the list. We can execute the ng\
    \ g c anti-hero/pages/pages/form and ng g c anti-hero/pages/list commands to make\
    \ the two pages. This will create two new components, form and list, under the\
    \ pages folder.\n\nAfter successfully creating the page components, we will also\
    \ add a routing module for our anti-hero module. We will execute the ng g m anti-hero/anti-hero-routing\
    \ --flat command and we will place the following code in our routing module:\n\
    \n```\nimport {NgModule} from \"@angular/core\";\nimport {RouterModule, Routes}\
    \ from \"@angular/router\";\nimport {ListComponent} from \"./pages/list/list.component\"\
    ;\nimport {FormComponent} from \"./pages/form/form.component\";\n\nconst routes:\
    \ Routes = [\n  {\n    path: \"\",\n    component: ListComponent,\n  },\n  {\n\
    \    path: \"form\",\n    component: FormComponent,\n  },\n];\n@NgModule({\n```"
  merge: -1
  img_proc: true
- pgno: 244
  md: "```\ndeclarations: [ListComponent, FormComponent],\nimports: [RouterModule.forChild(routes)],\n\
    exports: [RouterModule]\n})\nexport class AntiHeroRoutingModule {}\n```\n\nIn\
    \ the preceding example code, we have defined routes for our form and list pages.\
    \ This means that the page components will have direct routes in our application,\
    \ and we have also defined ListComponent as the base route for this module.\n\n\
    After successfully creating the page components and defining routes, we want our\
    \ root module (AppModule) to have a route for AntiHeroModule.\n\nTo implement\
    \ this, we will place the following code in app-routing.module.ts:\n\n```\nimport\
    \ { NgModule } from '@angular/core';\nimport { RouterModule, Routes } from '@angular/router';\n\
    const routes: Routes = [\n  {\n    path: \"\",\n    redirectTo: \"anti-heroes\"\
    ,\n    pathMatch: \"full\",\n  },\n  {\n    path: \"anti-heroes\",\n    loadChildren:\
    \ () =>\n      import(\"./anti-hero/anti-hero.module\").then((m) =>\n        m.AntiHeroModule),\n\
    \  }\n];\n@NgModule({\n  imports: [RouterModule.forRoot(routes)],\n})\nexport\
    \ class AppRoutingModule { }\n```\n\nIn the preceding example code, we have used\
    \ lazy loading to create a route for AntiHeroModule. Once we visit the {baseUrl}/anti-heroes\
    \ URL, this will load AntiHeroModule and redirect to the base route, which is\
    \ ListComponent. We have also used RouterModule.forRoot() to import the routes,\
    \ as this is the root module."
