- pgno: 220
  md: "# Writing tests in a service using Mockito\n\nIn the previous section, we created\
    \ our unit tests using the H2 database; in this approach, we will completely omit\
    \ the use of the database and utilize the concept of mocking in creating sample\
    \ data in our unit tests. We will achieve this by using Mockito. Mockito is a\
    \ mocking framework in Java that allows us to test classes in isolation; it does\
    \ not require any databases.\n\nIt will enable us to return dummy data from a\
    \ mocked object or service. Mockito is very useful, as this makes unit testing\
    \ less complex, especially for larger applications, as we don’t want to test the\
    \ services and dependencies simultaneously. The following are the other benefits\
    \ of using Mockito:\n\n+   - **Supports return values**: Supports mocking return\
    \ values.\n+   - **Supports exceptions**: Can handle exceptions in unit tests.\n\
    +   - **Supports annotation**: Can create mocks using annotation.\n+   - **Safe\
    \ from refactoring**: Renaming method names or changing the order of parameters\
    \ will not affect the tests, as mocks are created at runtime.\n\nLet’s explore\
    \ the different features of Mockito for writing unit tests.\n\n# Adding behavior\n\
    \nMockito contains the when() method where we can mock the object return value.\
    \ This is one of the most valuable features of Mockito, as we can define a dummy\
    \ return value of a service or a repository.\n\nLet’s have a look at the following\
    \ code example:\n\n```\npublic class HeroTester {\n    // injects the created\
    \ Mock\n    @InjectMocks\n    HeroApp heroApp = new HeroApp();\n    // Creates\
    \ the mock\n    @Mock\n    HeroService heroService;\n    @Test\n    public void\
    \ getHeroHouseTest(){\n        when(heroService.getHouse()).thenReturn(\n    \
    \        \"San Francisco \");\n        assertThat(heroApp.getHouse()).isEqualTo(\n\
    \            \"San Francisco\");\n    }\n}\n```"
  merge: -1
  img_proc: true
- pgno: 221
  md: "In the preceding code example, we can see that we have mocked HeroService in\
    \ our test. We have done this to isolate the class and not test the functionality\
    \ of HeroService itself; what we want to test is just the functionality of HeroApp.\
    \ We have added behavior for the heroService.getHouse() method by specifying a\
    \ mock return thenReturn() method. In this case, we expect that the getHouse()\
    \ method will return a value of \"San Francisco\".\n\n# Verifying behavior\n\n\
    The next feature that we can use from Mockito is behavior verification in unit\
    \ tests. This allows us to verify whether the mocked method is called and executed\
    \ with parameters. This can be achieved using the verify() method.\n\nLet's take\
    \ the same class example:\n\n```\npublic class HeroTester {\n    // injects the\
    \ created Mock\n    @InjectMocks\n    HeroApp heroApp = new HeroApp();\n    //\
    \ Creates the mock\n    @Mock\n    HeroService heroService;\n    @Test\n    public\
    \ void getHeroHouseTest() {\n        when(heroService.getHouse()).thenReturn(\n\
    \            \"San Francisco \");\n        assertThat(heroApp.getHouse()).isEqualTo(\n\
    \            \"San Francisco\");\n        verify(heroService).getHouse();\n  \
    \  }\n}\n```\n\nIn the preceding code example, we can see that we have added verify(heroService).getHouse()\
    \ to our code. This validates whether we have called the getHouse() method. We\
    \ can also validate whether the method is called with some given parameters.\n\
    \n# Expecting calls\n\nExpecting calls is an extended feature for behavior verification;\
    \ we can also check the number of times that the mocked method has been called.\
    \ We can do so by using the times(n) method. At the same time, we can also validate\
    \ whether it has been called using the never() method."
  merge: -1
  img_proc: true
- pgno: 222
  md: "Let's have a look at the following example code:\n\n```\npublic class HeroTester\
    \ {\n    // injects the created Mock\n    @InjectMocks\n    HeroApp heroApp =\
    \ new HeroApp();\n    // Creates the mock\n    @Mock\n    HeroService heroService;\n\
    \    @Test\n    public void getHeroHouseTest() {\n        // gets the values of\
    \ the house\n        when(heroService.getHouse()).thenReturn(\n            \"\
    San Francisco \");\n        // gets the value of the name\n        when(heroService.getName()).thenReturn(\"\
    Stark\");\n        // called one time\n        assertThat(heroApp.getHouse()).isEqualTo(\n\
    \            \"San Francisco\");\n        // called two times\n        assertThat(heroApp.getName()).isEqualTo(\"\
    Stark\");\n        assertThat(heroApp.getName()).isEqualTo(\"Stark\");\n\n   \
    \     verify(heroService, never()).getPowers();\n        verify(heroService, times(2)).getName();\n\
    \    }\n}\n```\n\nIn the preceding code example, we can see that we have used\
    \ the times(2) method to validate whether the getName() method from heroService\
    \ has been called two times. We have also used the never() method, which checks\
    \ that the getPowers() method has not been called.\n\nMockito, other than times()\
    \ and never(), also provides additional methods to validate the expected call\
    \ counts, and these methods are the following:\n\n+   - atLeast (int min): Validates\
    \ whether the method is called at least n times\n+   - atLeastOnce (): Validates\
    \ whether the method is called at least once\n+   - atMost (int max): Validates\
    \ whether the method is called at most n times"
  merge: -1
  img_proc: true
- pgno: 223
  md: "# Exception handling\n\nMockito also provides exception handling in unit tests;\
    \ it allows us to throw exceptions on mocks to test errors in our application.\n\
    \nLet’s have a look at the following example code:\n\n```\npublic class HeroTester\
    \ {\n    // injects the created Mock\n    @InjectMocks\n    HeroApp heroApp =\
    \ new HeroApp();\n    // Creates the mock\n    @Mock\n    HeroService heroService;\n\
    \    @Test\n    public void getHeroHouseTest() {\n        doThrow(new RuntimeException(\"\
    Add operation not implemented\")).when(heroService.getHouse())\n        .thenReturn(\"\
    San Francisco \")\n        assertThat(heroApp.getHouse()).isEqualTo(\n       \
    \     \"San Francisco\");\n    }\n}\n```\n\nIn the preceding example, we have\
    \ configured heroService.getHouse(), once it is called, to throw RunTimeException.\
    \ This will allows us to test and cover the error blocks in our application.\n\
    \nWe have learned about the different features available in Mockito. Now, let’s\
    \ proceed with writing our tests in our Spring Boot application.\n\n# Mockito\
    \ in Spring Boot\n\nIn this section, we will now implement Mockito for writing\
    \ unit tests in our Spring Boot application. We will be writing tests for our\
    \ service again, and we will create another package under our test/java folder,\
    \ which will be used for our unit tests using Mockito; we will make com.example.springboot\
    \ superheroes.superheroes.antiHero.service. Under the newly created package, we\
    \ will create a new class named AntiHeroServiceTest, where we will start writing\
    \ our tests for AntiHeroService."
