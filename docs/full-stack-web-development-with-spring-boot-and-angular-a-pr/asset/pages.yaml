- pgno: 257
  md: '**Angular Material** is a library created by Google that provides a wide range
    of UI components for use in Angular applications, such as tables, cards, inputs,
    and date pickers. This means that we don''t have to style components from scratch,
    as a list of components from the material library is ready to use.


    Angular Material has a wide range of growing components under the hood. It provides
    modules containing the components that can be used in Angular applications which
    can be imported into a specific application module; components are reusable and
    easy to customize in terms of their look and feel, as they have built-in properties
    that we can use.


    Let’s configure Angular Material in our Angular project.


    # Configuring Angular Material


    Angular Material is easy to configure in Angular projects, as it provides a schematic
    to install all the dependencies of Angular Material in just one command. To install
    Angular Material, we will execute the following command:


    ```

    ng add @angular/material

    ```


    After executing the command, it will ask some questions before installing the
    resources:


    +   - **Choose a prebuilt theme name or “custom” for a custom theme:** Angular
    Material provides prebuilt themes or you can configure your custom theme.

    +   - **Set up global Angular Material typography styles:** Choosing yes will
    apply the global typography of Angular Material.

    +   - **Set up browser animations for Angular Material:** Choosing yes will install
    BrowserAnimationsModule in our root module. This is important when we want to
    use animations from Angular Material.


    After completing all the questions, it will now install Angular Material. This
    will execute the following actions for our project:


    +   1. Adding dependencies to package.json (@angular/material and @angular/cdk).

    +   2. Adding the Roboto font to the index.html file:

    +   3. Adding the Material Design icon font to the index.html file:


    ```

    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap"
    rel="stylesheet">

    ```


    ```

    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

    ```'
  merge: -1
  img_proc: true
- pgno: 258
  md: "+   4. Adding the following CSS styles:\n+     - Setting height to 100% for\
    \ html and body\n+     - Setting Roboto as the default font\n+     - Removing\
    \ margins from the body:\n\n```\nhtml, body { height: 100%; }\nbody { margin:\
    \ 0; font-family: Roboto, \"Helvetica Neue\", sans-serif; }\n```\n\nAfter successfully\
    \ installing Angular Material in our application, we are now ready to use the\
    \ components in our application.\n\n# Implementing Angular Material\n\nWe will\
    \ now implement Angular Material components in our Angular project. As we mentioned\
    \ a while ago, Angular Material offers a wide range of components that we can\
    \ use for building our application. In this example project, we will only define\
    \ the components that we will use in our application. Let’s list the components\
    \ that we will implement.\n\n# Button component\n\nThe native <button> or <a>\
    \ elements that are enhanced with Material Design styling.\n\nWe can import the\
    \ button component using the following code:\n\n```\nimport {MatButtonModule}\
    \ from '@angular/material/button';\n```\n\nHere’s an example of the button component:\n\
    \n```\n<div class=\"example-button-row\">\n    <button mat-raised-button>Basic</button>\n\
    \    <button mat-raised-button\n        color=\"primary\">Primary</button>\n \
    \   <button mat-raised-button\n        color=\"accent\">Accent</button>\n    <button\
    \ mat-raised-button color=\"warn\">Warn</button>\n    <button mat-raised-button\
    \ disabled>Disabled</button>\n    <a mat-raised-button href=\"\n        https://material.angular.io/target=\"\
    \ _blank>Link</a>\n</div>\n```"
  merge: -1
  img_proc: true
