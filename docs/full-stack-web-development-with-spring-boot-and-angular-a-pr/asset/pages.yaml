  md: '# 16

    Packaging Backend and Frontend with Maven


    In the previous chapter, we learned what Cypress is and its benefits. We also
    learned how to write Cypress end-to-end tests and how to run them. Finally, we
    learned how to intercept HTTP requests to mock responses.


    This chapter will teach you how to combine your Angular and Spring Boot applications
    and then run them on your local machine.


    In this chapter, we will cover the following topics:


    +   - What is frontend-maven-plugin?

    +   - Adding configurations to Spring Boot and Angular''s integration

    +   - Packaging Spring Boot

    +   - Running the JAR file


    # Technical requirements


