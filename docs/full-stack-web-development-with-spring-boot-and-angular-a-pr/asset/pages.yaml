- pgno: 369
  md: '# 15


    # Writing Tests in Angular


    In the previous chapter, we learned how to secure an Angular application by adding
    user authentication, retrieving user information, and protecting routes.


    What if I told you that writing tests in the frontend could be fun and exciting?
    This chapter will show you how good the developer experience of Cypress E2E, short
    for end-to-end testing, is. Why do frontend developers love the Cypress framework?


    This chapter will teach you how to write basic Cypress tests and mock HTTP requests
    for testing.


    In this chapter, we will cover the following topics:


    +   - Getting started with Cypress

    +   - Writing a simple Cypress test

    +   - Mocking HTTP responses and intercepting HTTP requests


    # Technical requirements


    The following link will take you to the finished version of this chapter: https://github.com/PacktPublishing/Spring-Boot-and-Angular/tree/main/Chapter-15/superheroes.


    # Getting started with Cypress


    In this section, you will learn what Cypress is and how to get started with it.


    Cypress is an end-to-end agnostic framework for testing web applications. You
    can write test IDs in HTML tags and assert whether the HTML tags are rendered
    in the way you would expect them to be.


    Let’s define what end-to-end means. End-to-end means how a user will use your
    application after they land on your web application and finish tasks such as logging
    in, signing up, checking out, viewing a profile, logging out, filling out a form,
    and so on.'
  merge: -1
  img_proc: true
- pgno: 370
  md: 'For instance, you can test or check the UI of your web application in different
    example cases or scenarios:


    +   - The sentence of the landing page''s value proposition contains the word
    sale

    +   - The widget count of a section of your website is what you expected

    +   - The items in the basket on the checkout page are cleared out after hitting
    the Clear button

    +   - A login form is present when the web application''s URL is domain.com/login


    These scenarios are examples of what to test for in a web application. Cypress
    is a test framework where you can write and run tests that don''t take much time
    to set up and configure.


    Now, let''s see how Cypress can be installed.


    # Installation


    To start using Cypress, we must install it from the npm repository by running
    the following command:


    ```

    npm i-D cypress @testing-library/cypress

    ```


    The preceding npm command will install Cypress and the cypress testing library
    in the dev dependency packages. @testing-library is a group of common testing
    utilities in web development that makes the life of a developer easier


    In the next section, we will learn what we must add to the npm script of our package.json
    file so that we can run the test later in this chapter.


    # npm script


    To make it easier for us to run the Cypress test later, it''s a good idea to add
    a new npm script to our package.json file to help us easily run a command. Insert
    the following key/value pair inside the scripts block of the package.json file:


    ```

    "test": "npx cypress open"

    ```


    The preceding key/value pair helps you run the test by running the npm run test
    command in your Terminal. Run the full stack application as well as the npm run
    test command in your Terminal to start Cypress.'
  merge: -1
  img_proc: true
