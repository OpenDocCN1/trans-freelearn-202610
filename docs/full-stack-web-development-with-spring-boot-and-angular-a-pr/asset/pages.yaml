  md: '# Pattern matching with switch statements


    Pattern matching is the idea of testing patterns and complicated expressions in
    switch statements. This new feature allows for more extensible and flexible usage
    of switch statements to accept complex expressions.


    # The Applet API


    **The Applet API** is rarely used in Java as all browsers have removed support
    for Java browser plugins.


    # The experimental AOT and JIT compilers


    The experimental Java-based **ahead-of-time (AOT)** and **JIT** compilers have
    been removed since their features have limited usage.


    These are just some of the changes that have been applied to Java 17. Now, let’s
    learn about Angular, one of the top JavaScript frameworks today, and the advantages
    of using the Angular framework to develop your frontend.


    # Introducing Angular


    **Angular** is a free and open source JavaScript framework that’s maintained by
    Google. It was built mainly for developing web applications and has expanded its
    capabilities to being used to create mobile and desktop applications using plugins.
    Angular uses component-based code, is progressive, and offers many libraries and
    extensions that shorten the time of developing large-scale applications.


    At the time of writing, Angular is very popular for building frontend applications.
    It is the primary framework for developing applications for large and well-known
    companies such as Samsung, Upwork, PayPal, and Google. It also has a very active
    community and has 76,000 stars on GitHub, with around 1,500 people contributing
    to the framework. In addition, it has thousands of functional NPM libraries that
    you can use to speed up your development.


    # History of Angular


    Before it became Angular, the first developed framework by Google was **AngularJS**
    or Angular Version 1. Although developers are typically confused by this, due
    to thinking that AngularJS and Angular are similar, AngularJS was released as
    an open source framework by *Miško Hevery*, a Google employee, who was developing
    AngularJS to develop web applications faster.


    AngularJS, where you use JavaScript or Dart, became popular as its community became
    more extensive. At the same time, the Ionic framework was released, which allowed
    developers to use AngularJS to build native mobile applications.'
