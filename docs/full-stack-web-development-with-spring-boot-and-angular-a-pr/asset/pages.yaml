- pgno: 307
  md: "Now that we have identified the list of actions we will create, in the `anti-heroes`\
    \ folder, we will create a `state/anti-hero.actions.ts` file where we will place\
    \ all of our actions.\n\nLet’s place the following code in the `anti-hero.actions.ts`\
    \ file:\n\n```\n```typescript\nimport { createAction, props } from '@ngrx/store';\n\
    import { AntiHero } from '../models/anti-hero.interface';\nexport enum AntiHeroActions\
    \ {\n  GET_ANTI_HERO_LIST = '[Anti-Hero] Get Anti-Hero list',\n  SET_ANTI_HERO_LIST\
    \ = '[Anti-Hero] Set Anti-Hero list',\n}\nexport const getAntiHeroList = createAction(\n\
    \  AntiHeroActions.GET_ANTI_HERO_LIST,\n);\nexport const setAntiHeroList = createAction(\n\
    \  AntiHeroActions.SET_ANTI_HERO_LIST,\n  props<{ antiHeroes: ReadonlyArray<AntiHero>\
    \ }>(),\n);\n```\n```\n\nIn the preceding code example, we have created two actions\
    \ for getting and setting the anti-hero list. The first action, `getAntiHeroList`,\
    \ has a single parameter, which is the type. This does not need any additional\
    \ properties as this will only call the API to retrieve the list of anti-heroes\
    \ through the use of effects.\n\nOn the other hand, the second action, `setAntiHeroList`,\
    \ has two parameters: the type and an additional property called `antiHero`. This\
    \ will set the value of the store with the retrieved list of anti-heroes through\
    \ the use of reducers.\n\nIt is also excellent practice to make our action definitions\
    \ enums in our code as this will help us avoid typographical errors when using\
    \ the definition in other parts of the application.\n\nWith that, we have successfully\
    \ created the required action for our anti-heroes list feature. Now, we will discuss\
    \ how to write effects that will be used to call the API and retrieve the anti-hero\
    \ list.\n\n# Writing an effect\n\nWe successfully created our actions in the previous\
    \ section. Now, we will make the effects that will be responsible for calling\
    \ our external API.\n\nEffects are not included in the `@ngrx/store` library;\
    \ we will install a separate library that will allow us to use the functions for\
    \ effects."
  merge: -1
  img_proc: true
- pgno: 308
  md: "To install effects in our application, we must execute the following command:\n\
    \n```\nng add @ngrx/effects\n```\n\nThe preceding command will perform the following\
    \ steps:\n\n+   1. Update the package.json file with the @ngrx/effects dependency.\n\
    +   2. Run npm install to install the added dependency.\n+   3. Add EffectsModule.forRoot()\
    \ to the imports array of your app.module.ts file.\n\nSome flags are available\
    \ that allow us to install @ngrx/effects with customizations; the following is\
    \ the list of flags we can use:\n\n+   - --path: Specifies the path to the module\
    \ where you want to import EffectsModule.\n+   - --project: The name of the project\
    \ defined in angular.json.\n+   - --skipTests: This creates a test file when it\
    \ is set to false.\n+   - --module: The name of the file containing the module\
    \ where you want to import EffectsModule.\n+   - --minimal: This provides the\
    \ minimal setup for the root effects if set to true. It imports EffectsModule.forRoot()\
    \ in the module with an empty object.\n+   - --group: Group the effects files\
    \ within the effects folder.\n\nAfter successfully adding the dependency of the\
    \ effect to our application, we can create our effects. Under the anti-heroes/state\
    \ folder, we must create a new file named anti-hero.effects.ts. The first thing\
    \ we need to do is create a class that has an @Injectable annotation:\n\n```\n\
    @Injectable()\nexport class AntiHeroEffects {\n  constructor(\n    private actions$:\
    \ Actions,\n    private antiHeroService: AntiHeroService,\n    private router:\
    \ Router\n  ) {}\n}\n```\n\nIn the preceding code example, we can see that effects\
    \ are also service classes and can be injected by other services; we have injected\
    \ the following services into AntiHeroEffects:\n\n+   - Actions: A service from\
    \ @ngrx/effects that returns an observable that we can assign a type to. This\
    \ will act as the identifier when an action is dispatched."
  merge: -1
  img_proc: true
- pgno: 309
  md: "+   - **AntiHeroService**: Our created service that contains the external APIs\
    \ for our anti-heroes, found under `anti-hero/services/anti-hero.service.ts`.\n\
    +   - **Router**: Used for redirection once an API call is made.\n\nAfter creating\
    \ our `AntiHeroEffect` class and injecting our services, we can begin making our\
    \ effects. The first thing we need to think of is what kind of effect we need\
    \ to get the anti-heroes since we have the `GET_ANTI_HERO_LIST` and `SET_ANTI_HERO_LIST`\
    \ actions.\n\nWe should create an effect that has a type of `GET_ANTI_HERO_LIST`\
    \ and can call the `getAntiHeroes()` function from `AntiHeroService`.\n\nTo create\
    \ this API, we can write the following code:\n\n```\n```typescript\nimport { Actions,\
    \ createEffect, ofType } from '@ngrx/effects';\ngetAntiHeroes$ = createEffect(()\
    \ => {\n    return this.actions$.pipe(\n        ofType(AntiHeroActions.GET_ANTI_HERO_LIST),\n\
    \        mergeMap(() => this.antiHeroService.getAntiHeroes()\n        )\n    },\
    \ {dispatch: true}\n);\n```\n```\n\nIn the preceding code example, we used the\
    \ `createEffect()` function to create our effects; this returns an action that\
    \ has two parameters:\n\n+   - `ofType(AntiHeroActions.GET_ANTI_HERO_LIST)`: The\
    \ first parameter uses the `ofType` operator, which defines the action type of\
    \ the effect. This means that if the `GET_ANTI_HERO_LIST` action is dispatched,\
    \ this effect will be called.\n+   - `mergeMap(() => this.antiHeroService.getAntiHeroes())`:\
    \ The second parameter uses the `mergeMap` operator, which will allow us to invoke\
    \ the `getAntiHeroes()` function to call the endpoint.\n\nWith that, we have our\
    \ effect for the `GET_ANTI_HERO_LIST` actions, but this is not complete yet. After\
    \ getting the list of anti-heroes, we want to dispatch another action that sets\
    \ the anti-heroes list in our state. To implement this, we can use the following\
    \ code:\n\n```\n```typescript\nmergeMap(() => this.antiHeroService.getAntiHeroes()\n\
    \    .pipe(\n        map(antiHeroes => ({ type: AntiHeroActions.SET_\nANTI_HERO_LIST,\
    \ antiHeroes })),\n        catchError(() => EMPTY)\n    ));\n```\n```"
  merge: -1
  img_proc: true
- pgno: 310
  md: "In the preceding code, we have added a pipe to our mergeMap operator; this\
    \ calls a map operator that returns ({ type: AntiHeroActions.SET_ANTI_HERO_LIST,\
    \ antiHeroes }). This will dispatch another action that has a type of SET_ANTI_HERO_LIST\
    \ and has additional antiHeroes objects coming from the list of anti-heroes retrieved\
    \ from the API.\n\nOur effects for getting the list of anti-heroes feature is\
    \ complete. The last step is to add AntiHeroEffects to our effects module. As\
    \ we may recall, our anti-heroes module is lazy loaded, which means that we will\
    \ not add AntiHeroEffects to EffectsModule.forRoot([]) located in the app.module.ts\
    \ file; otherwise, we would need to add EffectsModule.forFeature([AntiHeroEffects])\
    \ in the imports of the anti-hero.module.ts file. This means that this effects\
    \ class is only used under this module.\n\nWith that, we have successfully configured\
    \ and created our effects for the anti-hero list feature. In the next section,\
    \ we will write the reducers that will modify our state.\n\n# Writing a reducer\n\
    \nNgRx states are immutable objects; we cannot modify their values through direct\
    \ assignment, and the only way we can change their states is through reducers.\n\
    \nReducers have different parts that we should implement, as follows:\n\n+   -\
    \ The interface or type that defines the properties of the state\n+   - The arguments,\
    \ which consist of the initial state and the current action\n+   - The list of\
    \ functions that handle that state changes based on the dispatched actions\n\n\
    We will create these reducer parts under the anti-heroes/state/anti-hero reducers.ts\
    \ file.\n\n# The state interface\n\nThe state interface defines the shape of the\
    \ state; this contains the properties or the slices of the state. In our application,\
    \ we need a property that will hold the list of anti-heroes.\n\nTo implement the\
    \ interface, we can use the following code:\n\n```\nexport interface AntiHeroState\
    \ {\n  antiHeroes: ReadonlyArray<AntiHero>;\n}\n```\n\n# The initial state\n\n\
    The next part we need to implement is the initial state; this defines what the\
    \ initial values of the state slices are. In our anti-hero state, we will set\
    \ the antiHeroes slice to an empty array."
