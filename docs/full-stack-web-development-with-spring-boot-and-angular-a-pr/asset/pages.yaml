    # Writing a test


    In this section, we will now start writing our unit tests in our Spring Boot application.
    As we go back to our application, the services and repository are the essential
    parts of our application where we need to implement unit tests, as the services
    contain the business logic and can be modified often, especially when new features
    are added. The repository includes methods for CRUD and other operations.


    We will be implementing two approaches in writing our unit tests. The first method
    is using an in-memory database such as H2 to store our created data when running
    unit tests. The second method is mocking our objects and repository using the
    Mockito framework.


    # Testing with the H2 database


    The first approach that we will implement in writing our tests is using JUnit
    and AssertJ with the H2 database. The H2 database is an in-memory database that
    allows us to store data in the system memory. Once the application is closed,
    it will delete all the stored data. H2 is usually used for Proof-of-Concept or
    unit testing.


    We have already added an H2 database in Chapter 4, Setting Up the Database and
    Spring Data JPA, but if you have missed this part, in order for us to add the
    H2 dependency, we will add the following into our pom.xml file:


    ```

    <dependency>

    <groupId>com.h2database</groupId> <artifactId>h2</artifactId>

    ```'
