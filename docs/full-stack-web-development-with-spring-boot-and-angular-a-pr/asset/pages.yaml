  md: "# Logging Events in Spring Boot\n\nAn example would be creating a log when\
    \ a user attempts to get a list of all anti-heroes. In `AntiHeroController`, we\
    \ will add the following code to create a new logger instance:\n\n```\nprivate\
    \ static final Logger LOGGER = LoggerFactory.\ngetLogger(AntiHeroController.class);\n\
    ```\n\nWe must also be aware that LoggerFactory and Logger should be under the\
    \ SLF4J dependency. It is always recommended to use SLF4J as this is an abstraction\
    \ of logging frameworks and makes it easier to switch between them.\n\nIn this\
    \ case, our import should be as follows:\n\n```\nimport org.slf4j.Logger;\nimport\
    \ org.slf4j.LoggerFactory;\n```\n\nOnce we have created a new logger instance,\
    \ we can now use it in our methods, for example, if we want to display a log when\
    \ the user attempts to get a list of anti-heroes.\n\nTo accomplish this, under\
    \ the `getAntiHeroes()` method, we will add the following code:\n\n```\npublic\
    \ List<AntiHeroDto> getAntiHeroes(Pageable pageable) {\n    int toSkip = pageable.getPageSize()\
    \ *\n                pageable.getPageNumber();\n    //SLF4J\n    LOGGER.info(\"\
    Using SLF4J: Getting anti hero\n                list - getAntiHeroes()\");\n\n\
