  img_proc: true
- pgno: 159
  md: "In the preceding example, we have used admin as the username and test as the\
    \ password for our Spring Boot Security login, which will allow us to log in successfully\
    \ to our application.\n\nWe have now successfully set up Spring Boot Security\
    \ for our project, and this automatically applies authentication to our endpoints.\
    \ The next step we need to do is add a configuration for our security; we would\
    \ want to override the default configuration and implement a customized login\
    \ endpoint for our application to give access to our other endpoints provided.\n\
    \nTo start with the configuration, let's first create a new class named SecurityConfig\
    \ under the config file. We will extend our new SecurityConfig class with WebSecurityConfigurerAdapter.\
    \ This adapter allows us to override and customize the configuration of WebSecurity\
    \ and HttpSecurity, and after extending the class, we will override the first\
    \ two methods:\n\n```\n@Override\nprotected void configure(AuthenticationManagerBuilder\
    \ auth)\nthrows Exception {\n    //We will place the customized userdetailsservice\
    \ here in\nthe following steps\n}\n\n@Bean(name = BeanIds.AUTHENTICATION_MANAGER)\n\
    @Override\npublic AuthenticationManager authenticationManagerBean() throws Exception\
    \ {\n    return super.authenticationManagerBean();\n}\n```\n\nThe first method\
    \ that we will override on WebSecurityConfigurerAdapter is the configure(AuthenticationManagerBuilder\
    \ auth) method, which accepts AuthenticationManagerBuilder, which is used to build\
    \ LDAP authentication, JDBC-based authentication, adding a custom UserDetailsService,\
    \ and adding AuthenticationProviders. In this case, we will use this to access\
    \ userDetailsServiceMethod() to customize our authentication. We will do that\
    \ in the following steps as we have not yet created our modified UseDetailsService.\n\
    \nThe second method is authenticationManagerBean(); we override this method to\
    \ expose AuthenticationManager as a bean in our application, which we will later\
    \ use in AuthenticateController. The next step is to implement the configuration\
    \ we want for our HTTP requests. To achieve this, we will override the configure(HttpSecurity\
    \ http) method."
