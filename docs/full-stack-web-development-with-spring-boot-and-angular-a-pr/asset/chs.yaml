  \ => this.antiHeroService.getAntiHeroes()\n    .pipe(\n        map(antiHeroes =>\
  \ ({ type: AntiHeroActions.SET_ANTI_HERO_LIST, antiHeroes })),\n        catchError(()\
  \ => EMPTY)\n    ));\n```\n```\n\n在前面的代码中，我们向我们的 mergeMap 操作符添加了一个 pipe；它调用一个 map\
  \ 操作符，返回 ({ type: AntiHeroActions.SET_ANTI_HERO_LIST, antiHeroes })。这将分派另一个 action，其类型为\
  \ SET_ANTI_HERO_LIST，并且具有来自 API 检索到的反英雄列表的附加 antiHeroes 对象。\n\n我们用于获取反英雄列表功能的 effects\
  \ 已完成。最后一步是将 AntiHeroEffects 添加到我们的 effects 模块中。正如我们可能还记得的，我们的反英雄模块是懒加载的，这意味着我们不会将\
  \ AntiHeroEffects 添加到 app.module.ts 文件中位于 EffectsModule.forRoot([])；否则，我们需要在 anti-hero.module.ts\
  \ 文件的 imports 中添加 EffectsModule.forFeature([AntiHeroEffects])。这意味着此 effects 类仅在此模块下使用。\n\
  \n至此，我们已成功配置并创建了反英雄列表功能的 effects。在下一节中，我们将编写修改 state 的 reducers。\n\n## 编写 reducer\n\
  \nNgRx states 是不可变对象；我们不能通过直接赋值修改它们的值，而唯一可以更改它们状态的方式是通过 reducers。\n\nReducers 有我们应该实现的不同部分，如下所示：\n\
  \n- - 定义 state 属性的接口或类型\n- - 参数，由初始 state 和当前 action 组成\n- - 根据分派的 actions 处理 state\
  \ 更改的函数列表\n\n我们将在 anti-heroes/state/anti-hero reducers.ts 文件下创建这些 reducer 部分。\n\n\
  ### State 接口\n\nState 接口定义了 state 的形状；它包含属性或 state 的切片。在我们的应用程序中，我们需要一个属性来保存反英雄列表。\n\
  \n要实现接口，我们可以使用以下代码：\n\n```\nexport interface AntiHeroState {\n  antiHeroes: ReadonlyArray<AntiHero>;\n\
  }\n```\n\n### 初始 state\n\n我们需要实现的下一个部分是初始 state；它定义了 state 切片的初始值是什么。在我们的反英雄 state\
  \ 中，我们将 antiHeroes 切片设置为一个空数组。\n\n\n\n\n\n### 选择特性状态\n\n在选择特性状态时，我们将使用 `createSelector()`\
  \ 和 `createFeatureSelector()` 函数来创建选择器。让我们看一个选择器选择位于特性状态（BlogState）下的博客列表的示例：\n\n\
  // blogs.selectors.ts\nimport { createSelector, createFeatureSelector } from '@ngrx/store';\n\
  \nexport const selectBlogsState =\ncreateFeatureSelector<BlogsState>('blogsState')\n\
  \nexport const selectBlogs = () => createSelector\n  selectBlogsState,\n  (state:\
  \ BlogsState) => state.blogs\n)\n```\n\n在前面的代码示例中，第一步是创建特性选择器，它将返回整个 BlogState。在这里，我们使用了\
  \ `createFeatureSelector()` 和状态的键来标识我们想要选择的目标特性状态。\n\n第二步是创建博客切片的主选择器；`createSelector()`\
  \ 有两个参数，其中第一个是 BlogState 特性选择器，第二个是一个函数，其中特性选择器返回的 BlogState 是参数。返回值是博客切片。\n\n##\
  \ 在项目中实现选择器\n\n到目前为止，我们已经学习了如何使用 `createFeatureSelector()` 和 `createSelector()`\
  \ 函数创建选择器。现在，让我们在项目中实现它们。首先需要识别的是状态或切片。第一个需要选择器的切片是位于 AntiHeroState 下的博客切片。请记住 AntiHeroState\
  \ 不是我们的根状态；这意味着我们将为以下状态拥有一个特性选择器。\n\n我们需要的第二个选择器是 antiHeroes 切片的选择器，其中包含通过 API 获取的反英雄数组。最后，我们想要的第三个选择器将需要根据\
  \ id 参数从列表中选择特定的 antiHero 数据。\n\n要创建所有这些选择器，请将以下代码放在 `anti-hero/state/anti-hero.selectors.ts`\
  \ 文件中：\n\n// select the AntiHeroState\nexport const selectAntiHeroState =\ncreateFeatureSelector<AntiHeroState>('antiHeroState')\n\
  \n// selecting all antiheroes\nexport const selectAntiHeroes = () => createSelector(\n\
  \  selectAntiHeroState,\n  (state: AntiHeroState) => state.antiHeroes\n)\n// selecting\
  \ an antihero base on id\nexport const selectAntiHero = (id: string) => createSelector(\n\
  \  selectAntiHeroState,\n  (state: AntiHeroState) => state.antiHeroes.find(d =>\n\
  \    d.id === id)\n)\n```\n\n成功创建所有选择器后，我们可以在 `anti-hero/pages/list.component.ts`\
  \ 文件中使用它们，通过添加以下代码：\n\n```\nantiHeroes$ = this.store.select(selectAntiHeroes());\n\
  constructor(\n  private router: Router,\n  private store: Store<AppState>,\n) {\
  \ }\nngOnInit(): void {\n  this.assignAntiHeroes();\n}\nassignAntiHeroes() {\n \
  \ this.antiHeroes$.subscribe((data) => {\n    this.antiHeroes = data;\n  });\n}\n\
  ```\n\n在前面的代码示例中，我们使用了 `selectAntiHeroes()` 选择器从状态中获取反英雄数组。`antiHeroes$` 是一个 Observable，在订阅后返回\
  \ `antiHero` 切片的当前状态。\n\n最后，我们必须获取反英雄列表特性。我们可以通过在列表组件的 `ngOnInit()` 钩子中分发 `GET_ANTI_HERO_LIST`\
  \ 操作来实现。这将调用我们之前创建的效果，该效果调用获取反英雄列表的端点：\n\n```\nngOnInit(): void {\n  this.store.dispatch({type:\
  \ AntiHeroActions.GET_ANTI_HERO_LIST});\n  this.assignAntiHeroes();\n}\n```\n\n\
  至此，我们已成功为组件创建了选择器，以便从状态中检索数据。在下一节中，我们将讨论可为 store 实现的可用配置。\n\n## 配置 store\n\n在前面的章节中，我们创建了\
  \ NgRx 的所有构建块，完成了应用程序的完全功能 store。在本节中，我们将学习如何使用运行时检查配置 NgRx store。\n\n## 运行时检查\n\
  \n运行时检查用于配置 NgRx store，以便开发人员遵循 NgRx 和 Redux 核心概念和最佳实践。这对于刚接触 NgRx 的开发人员尤其有用；它们会根据激活的运行时检查显示与开发相关的错误。\n\
  \n`@ngrx/store` 提供了六个内置运行时检查：\n\n- `strictStateImmutability`: 检查状态是否未被修改（默认值：开启）\n\
  - `strictActionImmutability`: 检查操作是否未被修改（默认值：开启）\n- `strictStateSerializability`:\
  \ 检查状态是否可序列化（默认值：开启）\n- `strictActionSerializability`: 检查操作是否可序列化（默认值：关闭）\n- `strictActionWithinNgZone`:\
  \ 检查操作是否在 NgZone 内分发（默认值：关闭）\n- `strictActionTypeUniqueness`: 检查注册的操作类型是否唯一（默认值：关闭）\n\
  \n要更改运行时检查的默认配置，我们将使用根 store 配置对象上的 `runtimeChecks` 属性。每个运行时检查的值可以通过赋值为 `true` 来激活检查，或赋值为\
  \ `false` 来停用检查：\n\n```\n@NgModule({\n  imports: [\n    StoreModule.forRoot(reducers,\
  \ {\n```\n\n```\n```javascript\nruntimeChecks: {\n  strictStateImmutability: true,\n\
  \  strictActionImmutability: true,\n  strictStateSerializability: true,\n  strictActionSerializability:\
  \ true,\n  strictActionWithinNgZone: true,\n  strictActionTypeUniqueness: true,\n\
  },\n}),\n],\n})\n```\n```\n\n### strictStateImmutability\n\n这是 NgRx 的第一条规则。它默认激活，运行时检查会验证开发人员是否修改了状态对象。\n\
  \n**违反此规则的示例：**\n\n```\n```javascript\nexport const reducer = createReducer(initialState,\
  \ on(addBlog,\n  (state, { blog }) => ({\n  // Violation 1: we assign a new value\
  \ to loading\n  state.loading = false,\n    // Violation 2: `push` modifies the\
  \ array\n    // state.blogs.push(blog) })) );\n```\n```\n\n**修复此违规：**\n\n```\n```javascript\n\
  export const reducer = createReducer( initialState, on(addBlog,\n  (state, { blog\
  \ }) =>\n  // Fix: We are returning the state as a whole object with\n  // the new\
  \ values\n    ({ ...state,\n      loading: false,\n      blogs: [...state.blogs,\
  \ blog],\n    })) );\n```\n```\n\n### strictActionImmutability\n\n此运行时检查与 `strictStateImmutability`\
  \ 类似，但针对的是操作。此运行时检查验证开发人员是否修改了操作。此检查默认激活。\n\n**违反此规则的示例：**\n\n```\nexport const\
  \ reducer = createReducer(initialState, on(addBlog,\n(state, { blog }) => ({\n//\
  \ Violation: it's not allowed to modify an action\nblog.id = uniqueID();\nreturn\
  \ { ...state, blogs: [...state.blogs, blog]\n} })) );\n```\n\n**修复此违规：**\n\n```\n\
  //blog.actions.ts\nexport const addBlog = createAction( '[Blog List] Add Blog',\n\
  // Fix: we will return the object in the action with the\n// new value\n(description:\
  \ string) =>\n({ id: uniqueID(), description }) );\n\n//blog.reducer.ts\nexport\
  \ const reducer = createReducer(\ninitialState,\non(addBlog, (state, { blog }) =>\
  \ ({\n...state,\nblogs: [...state.blogs, blog],\n})) );\n```\n\n### strictStateSerializability\n\
  \n此运行时检查验证放置在状态中的值是否可序列化。这对于持久化状态以便将来重新水合至关重要。此检查默认停用。\n\n**违反此规则的示例：**\n\n```\n\
  export const reducer = createReducer(\ninitialState,\non(addBlog, (state, { blog\
  \ }) => ({\n...state,\nblogs: [...state.blogs, blog],\n// Violation: a Date type\
  \ is not a serializable value.\n```\n\n```\n```typescript\ncreatedOn: new Date()\n\
  }));\n```\n```\n\n**修复此违规：**\n\n```\n```typescript\nexport const reducer = createReducer(\n\
  \  initialState,\n  on(addBlog, (state, { blog }) => ({\n    ...state,\n    blogs:\
  \ [...state.blogs, blog],\n    // Fix: We should convert the date into a JSON Object.\n\
  \    createdOn: new Date().toJSON()\n  }))\n);\n```\n```\n\n### strictActionSerializability\n\
  \n此运行时检查与 `strictStateSerializability` 类似，但针对操作。它检查状态是否可序列化。这由 Redux DevTools 用于调试错误。\n\
  \n**违反此规则的示例：**\n\n```\n```typescript\nconst createBlog = createAction(\n  '[Blog\
  \ List] Add Blog',\n  blog => ({ blog,\n  // Violation, a function is not serializable\n\
  \  logBlog: () => { console.log(blog); }, }));\n```\n```\n\n**修复此违规：**\n\n```\n\
  ```typescript\nconst createBlog = createAction(\n  '[Blog List] Add Blog',\n  //\
  \ Fix: we should use props to receive parameters\n  props<{blog: Blog}>()\n);\n\
  ```\n```\n\n### strictActionWithinNgZone\n\n此运行时检查验证操作是否由 NgZone 内的异步任务分发。此检查默认停用。\n\
  \n\n\n\n\n#### 此规则的示例违规：\n\n// Callback outside NgZone\n// Violation: the createBlog\
  \ actions is invoked outside the\n// ngZone\ncallbackOutsideNgZone() {\n    this.store.dispatch(createBlog\
  \ ());\n}\n```\n\n#### 此违规的修复方法：\n\n```\nimport { NgZone } from '@angular/core';\n\
  constructor(private ngZone: NgZone) {}\n    // use run() function to call the dispatch\
  \ inside the\n    // NgZone\nfunction callbackOutsideNgZone() {\n    this.ngZone.run(\n\
  \        () => {  this.store.dispatch(createBlog());\n    }\n}\n```\n\n### strictActionTypeUniqueness\n\
  \n此运行时检查可防止开发人员多次注册相同的操作类型。此检查默认情况下处于停用状态。\n\n#### 此规则的示例违规：\n\n//Violation: two\
  \ actions have the same type\nexport const addBlog = createAction('[Blog] Add Blog');\
  \ export const modifyBlog = createAction('[Blog] Add Blog');\n```\n\n#### 此违规的修复方法：\n\
  \n//Violation: two actions have the same type\nexport const addBlog = createAction('[Blog]\
  \ Add Blog'); export const modifyBlog = createAction('[Blog] Modify Blog');\n```\n"
