  \ Delete\n        </button>\n    </td>\n</ng-container>\n<tr mat-header-row *matHeaderRowDef=\"\
  headerFields\">\n</tr>\n<tr mat-row *matRowDef=\"let row; columns:\n    headerFields\"\
  ></tr>\n</table>\n```\n\n我们将为 anti-hero-list.component.ts 放置此内容：\n\n```\nexport\
