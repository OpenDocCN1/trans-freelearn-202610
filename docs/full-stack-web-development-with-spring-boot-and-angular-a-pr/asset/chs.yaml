  \ Lombok 和 JPA 仓库。\n\n在下一章中，我们将学习如何使用 springdoc-openapi 和 Swagger UI 为我们的 API 创建文档。\n"
- "## 使用 OpenAPI 规范记录 API\n\n在上一章中，我们学习了如何开发我们的 Spring Boot 应用。首先，我们配置了应用以使用 IntelliJ\
  \ 在服务器上运行。然后，我们开发了 REST 应用的不同部分，例如模型和实体，它们充当对象；服务，它们保存业务逻辑并调用 JPA 仓库在数据库中执行 CRUD\
  \ 操作；以及控制器，它们定义端点。我们还学习了如何应用 Redis，它添加了缓存机制以提升 REST API 的性能。\n\n本章将重点介绍为我们的 Spring\
  \ Boot 项目创建文档。我们将重点介绍配置 `springdoc-openapi` 和 Swagger UI，并为我们开发的端点即时生成文档。\n\n在本章中，我们将涵盖以下主题：\n\
  \n- 设置 `springdoc-openapi`\n- 设置 Swagger UI\n\n## 技术要求\n\n以下链接将带您进入本章的完成版本：https://github.com/PacktPublishing/Spring-Boot-and-Angular/tree/main/Chapter-06/superheroes。\n\
  \n## 设置 springdoc-openapi\n\n在本节中，我们将在 Spring Boot 应用中配置 `springdoc-openapi`。由于我们在上一章中开发了\
  \ REST API，我们接下来需要做的就是为我们的端点创建文档。这是一个必不可少的部分，尤其是在开发行业中，因为这将告诉开发者可以实现哪些端点、所需请求及其格式是，\n\
  \n\n\n以及调用端点时应期望的响应体。这也有助于减少 API 集成方面的错误和冲突，因为可用的端点是透明的。然而，手动创建文档的主要缺点是它繁琐且容易出错。这就是\
  \ springdoc-openapi 发挥作用的地方。\n\n首先，让我们讨论一下 springdoc-openapi 是什么。springdoc-openapi\
  \ 是一个库，可自动化 Spring Boot 项目中 API 文档的生成。这种自动化之所以成为可能，是因为该库使用注解、类结构和 Spring 配置来识别可用的\
  \ API。\n\nspringdoc-openapi 可以生成必要的 JSON/YAML 和 HTML API 文档，这些文档可以通过我们在应用程序上新生成的\
  \ URL 查看。它还支持多个框架和协议，包括以下内容：\n\n- spring-boot\n- JSR-303，特别是针对 @NotNull、@Min、@Max\
  \ 和 @Size\n- swagger-ui\n- OAuth 2\n\n现在，让我们讨论 springdoc-openapi 的属性和插件。\n\n## springdoc-openapi\
  \ 的属性\n\n我们可以根据自己的偏好修改 springdoc-openapi 的行为和设置。它具有不同的属性，我们可以在 application.properties\
  \ 文件下设置其值。\n\n以下是 springdoc-openapi 中一些常用的属性：\n\n- springdoc.swagger-ui.path：默认值是\
  \ /swagger-ui.html。它定义了访问 HTML 文档的路径。\n- springdoc.swagger-ui.enabled：默认值是 true。它启用或禁用\
  \ swagger-UI 端点。\n- springdoc.swagger-ui.configUrl：默认值是 /v3/api-docs/swagger-config。它是一个用于检索外部配置文档的\
  \ URL。\n- springdoc.swagger-ui.layout：默认值是 BaseLayout。它是 Swagger UI 用于显示文档的顶级布局。\n\
  - springdoc.swagger-ui.tryItOutEnabled：默认值是 false。它启用或禁用 Try it out 部分，用户可以在此测试端点。\n\
  - springdoc.swagger-ui.filter：默认值是 false。它启用或禁用过滤并添加一个文本框以放置过滤条件。它可以是布尔值或字符串；这将作为过滤表达式。\n\
  - `springdoc.swagger-ui.operationsSorter`：这对 API 的操作列表应用排序。值可以是 `'alpha'`（按路径字母排序）、`'method'`（按\
  \ HTTP 方法排序），或一个将识别排序标准的函数。\n- `springdoc.swagger-ui.tagsSorter`：这对 API 的操作列表应用排序。值可以是\
  \ `'alpha'`（按路径字母排序）或一个将识别排序标准的函数。\n\n## springdoc-openapi 的插件\n\nspringdoc-openapi\
  \ 也有我们可以用来生成文档的插件。让我们来看看。\n\n### *springdoc-openapi-maven-plugin*\n\nspringdoc-openapi-maven-plugin\
  \ 在构建期间生成 JSON 和 YAML OpenAPI 描述。插件也在集成阶段工作。要启用插件，我们需要在 pom.xml 文件的 `<plugin>` 部分添加以下声明：\n\
  \n```xml\n<plugin>\n    <groupId>org.springframework.boot</groupId>\n    <artifactId>spring-boot-maven-plugin</artifactId>\n\
  \    <version>${spring-boot-maven-plugin.version}</version>\n    <configuration>\n\
  \        <jvmArguments>\n            -Dspring.application.admin.enabled=true\n \
  \       </jvmArguments>\n    </configuration>\n    <executions>\n        <execution>\n\
  \            <goals>\n                <goal>start</goal>\n                <goal>stop</goal>\n\
  \            </goals>\n        </execution>\n    </executions>\n</plugin>\n```\n\
  \n我们刚刚添加了 `spring-boot-maven-plugin` 插件。复制上述代码并粘贴到你的 `.pom` 文件中。\n\n```\n<id>integration-test</id>\n\
  <goals>\n    <goal>generate</goal>\n</goals>\n</execution>\n</executions>\n<configuration>\n\
  \    <apiDocsUrl>\n        http://localhost:8080/v3/api-docs</apiDocsUrl>\n    <outputFileName>openapi.json</outputFileName>\n\
  \    <outputDir>/home/springdoc/output-folder</outputDir>\n    <skip>false</skip>\n\
  \    <headers>\n        <header1-key>header1-value</header1-key>\n    </headers>\n\
  </configuration>\n</plugin>\n```\n\n在前面的示例 XML 代码中，我们添加了多个属性以对 OpenAPI 应用自定义配置。我们手动设置了输出文件名、目录和用于生成\
  \ API 文档的头部。\n\n## springdoc-openapi-gradle-plugin\n\nspringdoc-openapi-gradle-plugin\
  \ 从 Gradle 构建为 Spring Boot 应用程序生成 OpenAPI 规范。要启用插件，我们必须在 plugins 部分放置以下代码：\n\n```\n\
  plugins {\n    id \"org.springframework.boot\" version \"${version}\"\n    id \"\
  org.springdoc.openapi-gradle-plugin\"\n        version \"${version}\"\n}\n```\n\n\
  一旦插件和依赖项已添加，以下任务将被创建：\n\n- generateOpenApiDocs：运行以生成 OpenAPI 文档的任务。generateOpenApiDocs\
  \ 会向应用程序的文档 URL 发出 REST 调用，以将 OpenAPI 文档以 JSON 格式存储。\n- forkedSpringBootRun：使用此任务在后台运行\
  \ Spring Boot 应用程序。\n\n我们还可以通过指定以下属性来自定义 openapi-gradle-plugin 的行为：\n\n- apiDocsUrl：可以下载\
  \ Open API 文档的 URL\n- outputDir：文档生成的目录\n- outputFileName：生成的输出文件名\n- waitTimeInSeconds：在调用\
  \ REST API 生成 OpenAPI 文档之前，等待 Spring Boot 应用程序启动的时间（秒）\n- forkProperties：运行 Spring\
  \ Boot 应用程序所需的一个系统属性\n- groupedApiMappings：一组可以从中下载 OpenAPI 文档的 URL\n\n要使用这些属性，我们必须使用\
  \ generateOpenApiDocs 指定它们：\n\n```\nopenApi {\n    apiDocsUrl.set(\"https://localhost:4000/api/docs\"\
  )\n    outputDir.set(file(\"$buildDir/docs\"))\n    outputFileName.set(\"swagger-test.json\"\
  )\n    waitTimeInSeconds.set(310)\n    forkProperties.set(\"-Dspring.profiles.active=special\"\
  )\n    groupedApiMappings.set(\n        [\"https://localhost:8000/v3/api-docs/group-1\"\
  \ to \"swagger-group-1.json\",\n        \"https://localhost:8000/v3/api-docs/group-2\"\
  \ to \"swagger-group-2.json\"])\n}\n```\n\n至此，我们已经了解了可在 OpenAPI 文档中使用的属性和插件。现在，让我们为我们的\
  \ Spring Boot 应用程序配置插件。\n\n## 配置 springdoc-openapi\n\n现在，我们将在 Spring Boot 应用程序中安装和配置\
  \ springdoc-openapi。首先，我们必须将依赖项添加到之前创建的项目中。前往 pom.xml 文件并添加以下 XML 代码：\n\n```\n<dependency>\n\
  \    <groupId>org.springdoc</groupId>\n```\n\n```\n<artifactId>springdoc-openapi-ui</artifactId>\n\
  <artifactId>            <version>1.6.4</version>\n</dependency>\n```\n\n成功安装 OpenAPI\
  \ 依赖项后，我们可以运行 Spring Boot 项目。服务器启动后，我们可以前往 http://localhost:8080/v3/api-docs/ 来访问\
  \ OpenAPI 文档的 JSON 格式。你将看到所有端点及其关联的 HTTP 请求都显示为 JSON 对象。以下是我们项目生成的 JSON 文档片段：\n\n\
  ```\n{\n  \"servers\": [\n    {\n      \"url\": \"http://localhost:8080/\",\n  \
  \    \"description\": \"Generated server url\"\n    }\n  ],\n  \"paths\": {\n  \
  \  \"/api/v1/anti-heroes/{id}\": {\n      \"get\": {\n        \"tags\": [\n    \
  \      \"anti-hero-controller\"\n        ],\n        \"operationId\": \"getAntiHeroById\"\
  ,\n        \"parameters\": [\n          {\n            \"name\": \"id\",\n     \
  \       \"in\": \"path\",\n            \"required\": true,\n            \"schema\"\
  : {\n              \"type\": \"string\",\n              \"format\": \"uuid\"\n \
  \           }\n          }\n        ],\n        \"responses\": {\n          \"200\"\
  : {\n            \"description\": \"OK\",\n\n```\n\n\n\n```\n\"content\" : {\n \
  \   \"*/*\" : {\n        \"schema\": {\n            \"$ref\": \"#/components/schemas/AntiHeroDto\"\
  \ ...\n// other created paths UPDATE DELETE and CREATE Inputs\n```\n\n在这里，我们可以看到生成的\
  \ JSON 对象显示了项目中可用的端点。它与操作 ID 一起显示，操作 ID 是方法的默认名称；它还指定了参数及其所需类型，以及端点的可能响应。\n\n我们使用了可以访问\
  \ OpenAPI 的默认 URL。我们可以通过应用程序的 `springdoc.api-docs.path` 属性（在 properties 文件中）来更改\
  \ URL。例如，我们将其设置为 `springdoc.api-docs.path=rest-docs`，这意味着我们现在可以通过 http://localhost:8080/rest-docs/\
  \ 访问 JSON 文档。\n\n我们还可以通过访问 http://localhost:8080/v3/api-docs.yaml 来获取文档的 YAML 版本。\n\
  \n至此，我们已成功使用 springdoc-openapi 为端点生成了文档。在下一节中，我们将学习如何配置、访问和使用 Swagger UI。\n\n##\
  \ 设置 Swagger UI\n\n**Swagger UI** 是一种文档工具，允许用户直接从浏览器调用项目中的可用 API。这是一个更具交互性的工具，能够对\
  \ API 进行更详细和实用的使用。Swagger UI 也是开源的，因此有更多社区支持该工具。\n\n### 安装和使用 Swagger UI\n\nSwagger\
  \ UI 已经包含在 `springdoc-openapi-ui` 依赖中。我们通过添加以下代码来包含 OpenAPI 扩展代码：\n\n```\n<dependency>\n\
  \    <groupId>org.springdoc</groupId>\n    <artifactId>springdoc-openapi-ui</artifactId>\n\
  \    <version>1.6.4</version>\n</dependency>\n```\n\nOpenAPI 依赖包含 Swagger UI 扩展；我们可以通过以下\
  \ URL 访问 UI：http://localhost:8080/swagger-ui.html。这将打开 Swagger UI 的 **OpenAPI 定义**\
  \ 页面：\n\n![](img/7c3ddd2e5893c9b5a0220148ed886548_137_0.png)\n\n图 6.1 – Swagger\
  \ UI 的 OpenAPI 定义页面\n\n在这里，我们可以看到 Swagger UI 已成功访问。我们在 Spring Boot 项目中创建的端点及其 HTTP\
  \ 方法也会显示出来。让我们讨论一下 Swagger UI 文档的不同部分。\n\n我们在 Swagger UI 中首先看到的是，它包含一个文本输入框，以及 Explore\
  \ 按钮。Swagger UI 就是从这里获取它将渲染的端点列表。在前面的示例中，我们可以看到默认值是 v3/api-docs。这意味着我们使用 OpenAPI\
  \ 库生成的 JSON 文档正被 Swagger 用来获取可用端点。\n\n我们可以更改此值，并访问包含 JSON 或 YAML 格式的 OpenAPI 文档的\
  \ URL。接下来我们将看到的是项目中可用端点的列表。在前面的示例中，我们开发的五个端点都列在 Swagger UI 中。这不仅仅是一个列表，因为 Swagger\
  \ UI 工具是交互式的，允许我们试用可用的端点。\n\n![](img/7c3ddd2e5893c9b5a0220148ed886548_138_0.png)\n\
  \n图 6.2 – 反英雄的 POST 请求\n\n我们可以展开 `/api/v1/anti-heroes` 端点，在我们的数据库中创建一个新的 Anti-Hero\
  \ 对象，因为它使用的是 POST HTTP 方法。它指定了我们需要在请求体中传递的对象的 schema。该 schema 定义了属性的名称和类型。在本例中，Anti-Hero\
  \ 实体具有以下 schema：\n\n```json\n{\n  \"id\": \"3fa85f64-5717-4562-b3fc-2c963f66afa6\"\
  ,\n  \"firstName\": \"string\",\n  \"lastName\": \"string\",\n  \"house\": \"string\"\
  ,\n  \"knownAs\": \"string\"\n}\n```\n\n```\n\"lastName\": \"string\",\n\"house\"\
  : \"string\",\n\"knownAs\": \"string\"\n}\n```\n\n示例端点中还指定了可能的响应。可能的响应状态为 200，表示成功。它还会返回数据库中新建的实体。\n\
  \n我们想要测试该端点并向数据库中插入一些示例数据。为此，我们必须单击右上角的 Try it out 按钮，然后单击 Execute 按钮来调用端点。一旦 API\
  \ 调用成功，我们将看到以下输出：\n\n![](img/7c3ddd2e5893c9b5a0220148ed886548_139_0.png)\n\n图 6.3\
  \ – POST 请求的响应\n\n在这里，我们可以看到 API 成功返回，因为它返回了状态码 200 和数据库中新建的实体。\n\n我们可以通过访问 pgAdmin\
  \ 来检查我们的端点是否已成功将数据插入表中，如下面的截图所示：\n\n![](img/7c3ddd2e5893c9b5a0220148ed886548_140_0.png)\n\
  \n图 6.4 – 验证数据是否已从 POST 请求插入\n\n在前面的示例中，我们可以看到数据已成功插入到我们的表中。现在，我们可以通过获取、更新或删除我们在数据库中创建的数据来测试其他可用的端点。\n\
  \n我们已经成功浏览了 Swagger UI 工具并与可用端点进行了交互，但我们也可以像使用 OpenAPI 文档一样，通过属性来根据我们的偏好和需求修改 Swagger\
  \ UI。我们还可以修改访问 Swagger UI 的 URL；例如，我们可以在 `application.properties` 文件中放置 `springdoc.swagger-ui.path=/{custom-path}.html`。\n\
  \n我们还可以修改的另一个行为是端点的排序行为。我们可以更改端点在列表中的排列方式，可以按 alpha（按字母数字排列）或 method（按方法排列），也可以使用自定义函数来更改排序方式。为此，我们可以在\
  \ `application.properties` 文件中放置 `springdoc.swagger-ui.operationsSorter=(sort behavior)`。\n\
  \n在本例中，我们将使用 `springdoc.swagger-ui.operationsSorter=method`。我们将看到以下输出：\n\n![](img/7c3ddd2e5893c9b5a0220148ed886548_141_0.png)\n\
  \n图 6.5 – 按方法排列的端点\n\n正如我们所看到的，我们的端点现在按 HTTP 方法排列。\n\n## 在 Swagger UI 中显示分页信息\n\n\
  Swagger UI 还可以与使用分页的端点集成。我们可以指定页码、每页列表的大小以及排序表达式。为了在 Swagger UI 中集成分页参数，我们需要添加 springdoc-open-data-rest\
  \ 依赖。\n\n要添加该库，我们必须在 `pom.xml` 文件中添加以下代码：\n\n```xml\n<dependency>\n    <groupId>org.springdoc</groupId>\n\
  \    <artifactId>springdoc-openapi-data-rest</artifactId>\n    <version>1.6.4</version>\n\
  </dependency>\n```\n\n成功添加该库后，让我们修改 `AntiHeroesController` 下的 `getAntiHeroes` 方法，以实现可用的分页功能：\n\
  \n```java\n... import org.springframework.data.domain.Pageable;\n\n@GetMapping\n\
  public List<AntiHeroDto> getAntiHeroes(Pageable pageable) {\n    int toSkip = pageable.getPageSize()\
  \ *\n                 pageable.getPageNumber();\n\n    var antiHeroList = StreamSupport\n\
  \        .stream(service.findAllAntiHeroes().spliterator(), false)\n        .skip(toSkip).limit(pageable.getPageSize())\n\
  \        .collect(Collectors.toList());\n\n    return antiHeroList\n        .stream()\n\
  \        .map(this::convertToDto)\n        .collect(Collectors.toList());\n}\n```\n\
  \n现在，让我们展开使用 GET 方法的 `api/v1/anti-heroes`：\n\n![](img/7c3ddd2e5893c9b5a0220148ed886548_138_0.png)\n\
  \n图 6.6 – 反英雄的 GET 方法\n\n在这里，我们可以看到 Parameters 部分有一个 pageable 属性，我们可以指定要检索的页面、每页的大小以及排序表达式。现在，我们可以执行它来从数据库检索数据。\n\
  \n## 总结\n\n至此，本章已结束。让我们回顾一下你学到的有价值的内容。\n\n首先，你了解了 springdoc-openapi 的可用特性和属性，以及如何配置和使用\
  \ OpenAPI 规范来为我们的 API 调用生成 JSON 和 YAML 文档。你还学习了如何访问 Swagger UI，这是一个直接在浏览器中调用 API\
  \ 的交互式文档工具。我们模拟了发送测试调用和修改某些行为（如域名 URL 和排序顺序）的过程。这种新掌握的为 API 生成文档的知识在实际应用中非常有用。开发人员可以利用这些知识轻松识别可使用的\
  \ API，以及它们的参数和对象响应。\n\n在下一章中，我们将学习跨源资源共享（CORS）、Spring Security 和 JSON Web 令牌（JWT）的概念。\n\
  \n\n\n"
- "## 使用 JWT 添加 Spring Boot 安全\n\n在上一章中，我们主要学习了如何在 Spring Boot 项目中为我们创建的 API 生成自动化文档。我们学习了如何添加和使用\
  \ springdoc-openapi 的特性和属性，如何在项目上配置插件，以及如何访问生成的 JSON 和 YAML 文档。我们还学习了如何实现 Swagger\
  \ UI 以使我们的文档具有交互性，并在浏览器上直接测试端点。\n\n本章现在将重点关注我们应用程序的安全方面。我们将讨论跨源资源共享（CORS）的概念以及它如何保护我们的应用程序。我们还将讨论\
  \ Spring Boot 中 Spring Security 的特性和实现、JSON Web Token（JWT）概念以及身份即服务（IDaaS）。\n\n\
  在本章中，我们将涵盖以下主题：\n\n- 理解 CORS\n- 添加 CORS 策略\n- 理解 Spring Security\n- Spring Boot\
  \ 中的身份验证和授权\n- IDaaS\n\n### 技术要求\n\n本章代码的完成版本链接在此处：https://github.com/PacktPublishing/Spring-Boot-and-Angular/tree/main/Chapter-07/superheroes。\n\
  \n## 理解 CORS\n\n在作为开发者创建应用程序时，我们可能已经多次遇到 CORS 这个术语。尽管如此，我们仍可能会问这样的问题：CORS 有什么作用？或者在我们的应用程序中实现\
  \ CORS 有什么优势？带着这些问题，我们将在本节中深入探讨 CORS 的概念和特性，并了解它如何用于保护我们的应用程序。\n\nCORS 是一种基于头的机制，允许服务器定义一组允许访问应用程序资源的主域、方案或端口。CORS\
  \ 通常用于 REST API。不同的前端应用程序可以访问我们在后端应用程序下的 API，尤其是在复杂的架构中。我们不希望我们的 API 被未知应用程序访问，而\
  \ CORS 负责保护这一部分。\n\n让我们看一个跨源请求的简单示例。假设我们有一个前端应用程序，其域名为 https://domain-one.com，而后端应用程序的域名为\
  \ https://domain-two.com。我们可以看到我们的应用程序使用不同的域名提供服务，一旦前端应用程序向后端发送请求，这就被视为跨源请求。\n\n\
  我们绝不能忘记，浏览器默认会限制跨源请求，除非请求资源的源包含正确的 CORS 头并且在后端应用程序中被允许，否则同源请求是唯一允许请求资源的请求。这只是 CORS\
  \ 工作原理的一个简单示例。让我们看一下 CORS 概念的更详细概述。\n\n### CORS 的工作原理\n\nCORS 是一种基于头的机制，这意味着实现跨源共享的第一步是添加新的\
  \ HTTP 头，这些头将描述允许访问资源的源列表。这些头可以描述为我们通信的钥匙。HTTP 头分为两类，分别是：\n\n- 请求头\n- 响应头\n\n###\
  \ 请求头\n\n请求头是客户端使用 CORS 机制所需的头。它们如下：\n\n- Origin：这表示请求客户端的源或简单地说是前端应用程序的主机。\n- Access-Control-Request-Method：此头在预检请求上使用，以指示用于发出请求的\
  \ HTTP 方法。\n- Access-Control-Request-Headers：此头在预检请求上使用，以指示用于请求的一组 HTTP 头。\n\n让我们看一个使用请求头的请求示例：\n\
  \n```\ncurl -i -X OPTIONS localhost:8080/api/v1 \\\n-H 'Access-Control-Request-Method:\
  \ GET' \\\n-H 'Access-Control-Request-Headers: Content-Type, Accept' \\\n-H 'Origin:\
  \ http://localhost:4200\n```\n\n### 响应头\n\n响应头是服务器随响应发送回的头。它们如下：\n\n- Access-Control-Allow-Origin：这是一个用于指定在服务器上访问资源的源的头。\n\
  - Access-Control-Expose-headers：此头指示浏览器可以访问的头。\n- Access-Control-Max-Age：这是一个指示预检请求过期信息的头。\n\
  - Access-Control-Allow-Credentials：这是一个指示浏览器可以在请求具有有效凭据时访问响应的头。\n- Access-Control-Allow-Headers：此头指示允许在请求中使用的头列表。\n\
  - Access-Control-Allow-Methods：这是一个指示允许在服务器中使用的请求方法列表的头。\n\n让我们看一个我们希望使用给定头的响应示例：\n\
  \n```\nHTTP/1.1 204 No Content\nAccess-Control-Allow-Origin: *\nAccess-Control-Allow-Methods:\
  \ GET,HEAD,PUT,PATCH,POST,DELETE\nVary: Access-Control-Request-Headers\nAccess-Control-Allow-Headers:\
  \ Content-Type, Accept\nContent-Length: 0\nDate: Sun, 16 Nov 2022 3:41:08 GMT+8\n\
  Connection: keep-alive\n```\n\n这些是我们将用于允许 CORS 机制的标准头，但跨源共享在多种不同场景下工作。\n\n### 简单请求\n\
  \n这些请求不会触发 CORS 预检请求，并且在没有初始请求的情况下将被发送到服务器进行验证。要将请求视为简单请求，它应满足以下条件：\n\n- 使用 POST\
  \ 和 GET 方法。\n- 包含可以手动设置的头，例如 Accept、Accept-Language、Content-Language 和 Content-Type。\n\
  - Content-Type 应具有以下类型之一：text/plain、multipart/form-data 或 application/x-www-form-urlencoded。\n\
  - 请求中未使用 ReadableStream 对象。\n\n让我们看一个简单请求的示例：\n\n```\nGET /content/test-data/ HTTP/1.1\n\
  Host: example.host\nUser-Agent: Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36\
  \ (KHTML, like Gecko) Chrome/77.0.3865.90 Safari/537.36\nAccept: text/html,application/xhtml+xml,application/\n\
  xml;q=0.9,*/*;q=0.8\nAccept-Language: en-us,en;q=0.5\nAccept-Encoding: gzip,deflate\n\
  Connection: keep-alive\nOrigin: https://frontend.com\n```\n\n此请求将在客户端和服务器之间执行简单交换。作为响应，服务器返回带有\
  \ Access-Control-Allow-Origin: * 的头，这意味着资源或端点可以被任何源访问。\n\n### 预检请求\n\n浏览器使用 OPTIONS\
  \ 方法发送测试或第一个 HTTP 请求，以验证请求是否被允许或安全。预检请求总是在跨源请求上发生，因为预检请求检查不同源是否允许或被允许访问资源。\n\n让我们看一个预检请求的示例：\n\
  \n```\nOPTIONS /content/test-data/ HTTP/1.1\nHost: example.host\nUser-Agent: Mozilla/5.0\
  \ (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/77.0.3865.90\
  \ Safari/537.36\n```\n\n```\nAccept: text/html,application/xhtml+xml,application/\n\
  xml;q=0.9,*/*;q=0.8\nAccept-Language: en-us,en;q=0.5\nAccept-Encoding: gzip,deflate\n\
  Connection: keep-alive\nOrigin: https://frontend.com\nAccess-Control-Request-Method:\
  \ POST\nAccess-Control-Request-Headers: X-PINGOTHER, Content-Type\n```\n\n前面的示例显示预检请求使用\
  \ OPTIONS 请求方法来执行预检请求。OPTIONS 方法用于从服务器识别更多信息，以了解实际请求是否被允许。\n\n我们还可以看到 Access-Control-Request-Method\
  \ 和 Access-Control-Request-Headers 被识别。这表示在实际请求中要使用的请求头和请求方法。\n\n以下是头信息：\n\n```\n\
  HTTP/1.1 204 No Content\nDate: Sun, 16 Nov 2022 3:41:08 GMT+8\nServer: Apache/2\n\
  Access-Control-Allow-Origin: https://frontend.com\nAccess-Control-Allow-Methods:\
  \ POST, GET, OPTIONS\nAccess-Control-Allow-Headers: X-PINGOTHER, Content-Type\n\
  Access-Control-Max-Age: 86400\nVary: Accept-Encoding, Origin\nKeep-Alive: timeout=2,\
  \ max=100\nConnection: Keep-Alive\n```\n\n现在，在前面的示例中，这是预检请求后返回的示例响应。Access-Control-Allow-Origin\
  \ 表明仅在指定域（示例中为 https://frontend.com）上允许访问资源。Access-Control-Allow-Methods 确认 POST\
  \ 和 GET 是有效方法。Access-Control-Allow-Headers 确保 X-PINGOTHER 和 Content-Type 是实际请求的有效头。\n\
  \n我们已经学习了 CORS 的基本概念；现在，我们将在下一节中在我们的 Spring Boot 应用程序中实现 CORS。\n\n\n\n\n\n## 添加\
  \ CORS 策略\n\n我们已经学习了 CORS 的工作原理以及它给我们的应用程序安全带来的优势。现在，我们将在 Spring Boot 项目中配置并实现 CORS\
  \ 策略。\n\n在我们的项目中配置 CORS 有几种方式。我们将逐一讨论它们。\n\n### 为每个方法应用 CORS\n\n我们可以在单个端点上启用 CORS；这意味着我们可以为其他端点指定不同的允许源。让我们看一下以下示例：\n\
  \n```java\n@CrossOrigin\n@GetMapping\npublic List<AntiHeroDto> getAntiHeroes(Pageable\
  \ pageable) {\n    // code implementation\n}\n```\n\n在我们的 Spring Boot 项目中，我们有 `getAntiHeroes()`\
  \ 方法。要在特定方法上启用 CORS，我们将使用 `@CrossOrigin` 注解。我们可以看到我们没有配置任何其他设置，这将应用以下内容：\n\n- 允许所有源。\n\
  - 允许的 HTTP 方法是为该方法配置的方法（在此方法中，允许的 HTTP 方法是 GET）。\n- 预检响应的缓存时间为 30 分钟。\n\n我们也可以通过添加\
  \ origin、methods、`allowedHeaders`、`exposedHeaders`、`allowedCredentials` 和 `maxAge`\
  \ 的值来指定 CORS 策略的配置：\n\n```java\n@CrossOrigin(origins = \"origin.example\")\n@GetMapping\n\
  public List<AntiHeroDto> getAntiHeroes(Pageable pageable) {\n    // code implementation\n\
  }\n```\n\n### 在控制器级别应用 CORS\n\n在之前的配置中，我们为每个方法添加了 CORS。现在，我们将在控制器级别添加 CORS 策略。让我们看一下以下示例：\n\
  \n```java\n@CrossOrigin\n@AllArgsConstructor\n@RestController\n@RequestMapping(\"\
  api/v1/anti-heroes\")\npublic class AntiHeroController {\n    // methods\n}\n```\n\
  \n我们可以看到 `@CrossOrigin` 添加在类级别。这意味着 CORS 策略将被添加到 `AntiHeroController` 下的所有方法中。\n\
  \n### 在控制器和方法级别应用 CORS\n\n我们可以在应用程序中同时在控制器和方法级别组合应用 CORS。让我们看一下以下示例：\n\n```java\n\
  @CrossOrigin(allowedHeaders = \"Content-Type\")\n@AllArgsConstructor\n@RestController\n\
  @RequestMapping(\"api/v1/anti-heroes\")\npublic class AntiHeroController {\n   \
  \ private final AntiHeroService service;\n    private final ModelMapper mapper;\n\
  \n    @CrossOrigin(origins = \"http://localhost:4200\")\n    @GetMapping\n    public\
  \ List<AntiHeroDto> getAntiHeroes(Pageable pageable) {\n        // code implementation\n\
  \    }\n}\n```\n\n我们可以在示例中看到，我们已在控制器和方法级别同时应用了 `@CrossOrigin` 注解。`@CrossOrigin(allowedHeaders\
  \ = \"Content-Type\")` 将用于 `AntiHeroController` 下的所有方法，而 `@CrossOrigin(origins =\
  \ \"http://localhost:4200\")` 仅应用于 `getAntiHeroes()` 方法，因此其他方法将允许所有源。\n\n### 全局\
  \ CORS 配置\n\n我们实现 CORS 策略的最后一种方式是使用 **全局配置**，这意味着我们的 CORS 策略适用于项目中所有现有的方法。实现全局 CORS\
  \ 配置有几种方式，我们将看到如何使用 `CorsFilter` 实现 CORS：\n\n1. 第一步是为我们的 CORS 策略添加一个配置类。为此，请转到项目的\
  \ config 文件夹并创建一个名为 `CorsConfig` 的新类。我们将添加 `@Configuration` 注解以在应用程序启动时将此类标识为配置，并且我们应该有以下代码：\n\
  \n```java\n@Configuration\npublic class CorsConfig {\n\n}\n```\n\n2. 下一步是创建我们的 `CorsFilter`\
  \ Bean。我们只需创建一个带有 `@Bean` 的新方法，该方法返回一个 `CorsFilter` 对象：\n\n```java\n@Bean\nCorsFilter\
  \ corsFilter() {\n    CorsConfiguration corsConfiguration =\n        new CorsConfiguration();\n\
  }\n```\n\n3. 在 `corsFilter()` 方法下，我们将放置所有 CORS 设置。我们将实例化一个 `CorsConfiguration` 对象，我们将通过调用多个方法来设置属性。我们将使用的这些方法如下：\n\
  \n- `setAllowCredentials()` 方法指示浏览器是否应使用凭据（如 cookie）发送跨源请求。这意味着如果我们检索 cookie 和跨站请求伪造（CSRF）令牌，我们希望将此选项设置为\
  \ `true`：\n\n```java\ncorsConfiguration.setAllowCredentials(true);\n```\n\n- `setAllowedOrigins()`\
  \ 方法允许我们设置可以访问我们端点的允许源。这些是受信任的前端应用程序的域名。在以下示例中，我们设置了 `http://localhost:4200`，它将是前端应用程序的开发服务器：\n\
  \n```java\ncorsConfiguration.setAllowedOrigins(Arrays.asList(\"http://localhost:4200\"\
  ));\n```\n\n- `setAllowedHeaders()` 方法允许我们配置 HTTP 请求中允许的标头列表。在前面的示例中，我们设置了可在请求中使用的多个标头：\n\
  \n```java\ncorsConfiguration.setAllowedHeaders(\n    Arrays.asList(\n        \"\
  Origin\",\n        \"Access-Control-Allow-Origin\",\n        \"Content-Type\",\n\
  \        \"Accept\",\n        \"Authorization\",\n        \"Origin, Accept\",\n\
  \        \"X-Requested-With\",\n        \"Access-Control-Request-Method\",\n   \
  \     \"Access-Control-Request-Headers\"\n    )\n);\n```\n\n- `setExposedHeaders()`\
  \ 方法允许我们指定来自服务器的响应标头列表。我们可以使用此方法将响应的标头限制在安全措施上：\n\n```java\ncorsConfiguration.setExposedHeaders(\n\
  \    Arrays.asList(\n        \"Origin\",\n        \"Content-Type\",\n        \"\
  Accept\",\n        \"Authorization\",\n        \"Access-Control-Allow-Origin\",\n\
  \        \"Access-Control-Allow-Origin\",\n        \"Access-Control-Allow-Credentials\"\
  \n    )\n);\n```\n\n- `setAllowedMethods()` 方法将允许我们添加授权用于访问端点的 HTTP 请求方法。在以下示例中，我们将\
  \ GET、POST、PUT、DELETE 和 OPTIONS 配置为允许的方法，因为我们只是在构建一个简单的创建、读取、更新和删除（CRUD）应用程序：\n\n\
  ```java\ncorsConfiguration.setAllowedMethods(\n    Arrays.asList(\"GET\", \"POST\"\
  , \"PUT\", \"DELETE\",\n    \"OPTIONS\")\n);\n```\n\n4. 我们需要做的最后一步是注册 CORS 配置。我们将实例化一个新的\
  \ `UrlBasedCorsConfigurationSource()` 并使用 `registerCorsConfiguration()` 方法进行注册。第一个参数是\
  \ `\"/**\"`，它表示配置适用于应用程序中找到的所有方法，第二个参数是 `corsConfiguration`，即我们创建的配置：\n\n```java\n\
  var urlBasedCorsConfigurationSource =\n    new UrlBasedCorsConfigurationSource();\n\
  \nurlBasedCorsConfigurationSource.registerCorsConfiguration(\n    \"/**\",\n   \
  \ corsConfiguration\n);\nreturn new CorsFilter(urlBasedCorsConfigurationSource);\n\
  ```\n\n5. 注册后，我们将使用配置源作为 `CorsFilter` 的参数，这就是在成功配置 CORS 设置后我们的 `corsFilter()` 方法的样子：\n\
  \n```java\n@Bean\nCorsFilter corsFilter() {\n    CorsConfiguration corsConfiguration\
  \ =\n        new CorsConfiguration();\n    corsConfiguration.setAllowCredentials(true);\n\
  \    corsConfiguration.setAllowedOrigins(\n        Arrays.asList(\"http://localhost:4200\"\
  ));\n\n    corsConfiguration.setAllowedHeaders(\n        Arrays.asList(\"Origin\"\
  ,\n            \"Access-Control-Allow-Origin\",\n            \"Content-Type\",\"\
  Accept\",\"Authorization\",\n            \"Origin, Accept\",\"X-Requested-With\"\
  ,\n            \"Access-Control-Request-Method\",\n            \"Access-Control-Request-Headers\"\
  ));\n\n    corsConfiguration.setExposedHeaders(\n        Arrays.asList(\"Origin\"\
  ,\"Content-Type\",\n        \"Accept\",\"Authorization\",\n        \"Access-Control-Allow-Origin\"\
  ,\n        \"Access-Control-Allow-Origin\",\n        \"Access-Control-Allow-Credentials\"\
  ));\n    corsConfiguration.setAllowedMethods(\n        Arrays.asList(\"GET\", \"\
  POST\", \"PUT\", \"DELETE\",\n        \"OPTIONS\")\n    );\n\n    var urlBasedCorsConfigurationSource\
  \ =\n        new UrlBasedCorsConfigurationSource();\n    urlBasedCorsConfigurationSource\n\
  \        .registerCorsConfiguration(\n            \"/**\",\n            corsConfiguration\n\
  \        );\n\n    return new CorsFilter(\n        urlBasedCorsConfigurationSource);\n\
  }\n```\n\n启动应用程序后，我们现在将 CORS 配置应用于项目中的所有方法。我们已成功在应用程序中实现 CORS 策略，但这只是我们保护应用程序的方式之一。\n\
  \n在下一节中，我们将讨论 Spring Security 的概念以及如何在 Spring Boot 项目中实现它。\n\n## 理解 Spring Security\n\
  \n**Spring Security** 是一个应用级安全框架，在 Spring Boot 应用程序中广泛使用。它是一个灵活的身份验证框架，提供了 Java\
  \ 应用程序的大多数标准安全需求。Spring Security 流行的原因在于它允许开发人员即时将不同的授权和身份验证提供程序与可用的其他模块集成。\n\n\n\
  \n\n\n由于我们在应用程序中使用了 Spring Security，因此无需从头编写与安全相关的任务，因为 Spring Security 已在内部提供了这些功能。\n\
  \n让我们进一步讨论 Spring Security 的概念。\n\n## Spring Security 的特性\n\nSpring Security 主要专注于将身份验证和授权集成到应用程序中。两者相比，**身份验证**是指验证用户可以访问你的应用程序并识别用户身份。这主要指登录页面本身。另一方面，**授权**用于更复杂的应用程序；这与特定用户在应用程序内可以执行的操作或动作相关。\n\
  \n授权可以通过集成角色来实现用户访问控制。Spring Security 还提供了不同的密码编码器——单向转换密码——如下所示：\n\n- `BCryptPasswordEncoder`\n\
  - `Argon2PasswordEncoder`\n- `Pbkdf2PasswordEncoder`\n- `SCryptPasswordEncoder`\n\
  \n上述列表是最常用的密码编码器，在使用 Spring Security 时可以直接访问。它还提供了不同的功能来帮助你满足安全需求，如下所示：\n\n- **轻量级目录访问协议\
  \ (LDAP)**：一种用于在互联网协议上包含和访问分布式目录信息服务的协议。\n- **记住我**：此功能提供记住来自单台机器的用户的能力，以防止再次登录。\n\
  - **单点登录 (SSO)**：此功能允许用户使用单个账户访问多个应用程序，集中用户信息。\n- **软件本地化**：此功能提供使用我们首选语言开发用户界面的能力。\n\
  - **HTTP 授权**：此功能提供授权。\n- **基本访问认证**：此功能提供基础认证流程，要求请求提供用户名和密码。\n- **摘要访问认证**：此功能提供更安全的认证，在访问资源前确认用户身份。\n\
  - **Web 表单认证：** 将生成一个表单，直接从 Web 浏览器对用户凭据进行认证。\n\nSpring Security 为应用程序提供了广泛的功能。在这种情况下，Spring\
  \ Security 的设计是根据其功能划分为独立的 Java Archive (JAR) 文件，只需为我们的开发安装所需的部分即可。\n\n以下是 Spring\
  \ Security 模块中包含的 JAR 文件列表：\n\n- `spring-security-core`：应用程序使用 Spring Security 的标准需求。Spring-security-core\
  \ 由核心认证类和接口组成。\n- `spring-security-web`：此 JAR 文件用于 Web 认证和基于 URL 的访问控制。它位于 `org.springframework.security.web`\
  \ 下。\n- `spring-security-config`：此 JAR 文件用于实现 Spring Security 配置，使用 XML 和 Java。所有类和接口都位于\
  \ `org.springframework.security.config` 下。\n- `spring-security-ldap`：此 JAR 文件是实现应用程序中\
  \ LDAP 所必需的。所有类和接口都位于 `org.springframework.security.ldap` 下。\n- `spring-security-oauth2-core`：此\
  \ JAR 文件用于实现 OAuth 2.0 授权框架和 OpenID Connect Core。类位于 `org.springframework.security.oauth2.core`\
  \ 下。\n- `spring-security-oauth2-client`：此 JAR 文件提供 OAuth 登录和 OpenID 客户端支持。所有类和接口都位于\
  \ `org.springframework.security.oauth2.client` 下。\n- `spring-security-openid`：此\
  \ JAR 文件用于 OpenID Web 认证支持，以使用外部 OpenID 服务器验证用户。\n- `spring-security-test`：此 JAR\
  \ 文件用于支持 Spring Security 应用程序的测试。\n- `spring-security-cas`：此 JAR 文件使用 CAS SSO 服务器实现\
  \ Web 认证。所有类和接口都位于 `org.springframework.security.cas` 下。\n- `spring-security-acl`：此\
  \ JAR 文件用于将安全集成到应用程序的领域对象中。我们可以在 `org.springframework.security.acls` 下访问类和接口。\n\n\
  我们现在已经了解了 Spring Security 提供的不同特性和模块。在下一节中，我们将学习如何在 Spring Boot 应用程序中使用 Spring Security\
  \ 实现身份验证和授权。\n\n## Spring Boot 中的身份验证和授权\n\n我们在上一节中已经讨论了 Spring Security 的概念；现在，我们将学习如何将\
  \ Spring Security 集成到我们的 Spring Boot 应用程序中。随着我们进入示例，我们将使用 Spring Boot Security 的所有模块和功能。\n\
  \n身份验证和授权是我们实现应用程序安全时最常见的概念。这些是我们为使应用程序安全而应用的两种验证。\n\n### 配置 Spring Boot 并实现身份验证\n\
  \n我们将首先在应用程序中实现身份验证。我们首先需要在项目中添加 Spring Boot Security 依赖项。要添加依赖项，我们将在 pom.xml 中添加以下内容：\n\
  \n```\n<dependency>\n    <groupId>org.springframework.boot</groupId>\n    <artifactId>spring-boot-starter-security</artifactId>\n\
  </dependency>\n```\n\n重新加载项目以安装新依赖项并运行服务器。让我们尝试访问 localhost:8080 在浏览器中打开 Spring\
  \ Boot 应用程序项目。如我们所见，由于我们安装了 Spring Boot Security，登录页面现在已应用于我们的项目：\n\n![](img/7c3ddd2e5893c9b5a0220148ed886548_158_0.png)\n\
  \n图 7.1 – 从 Spring Boot Security 集成的登录页面\n\n要为登录创建凭据，我们可以在 application.properties\
  \ 文件下配置用户名和密码，放置以下设置：\n\n```\nspring.security.user.name=admin\nspring.security.user.password=test\n\
  ```\n\n在前面的示例中，我们使用了 admin 作为用户名，test 作为密码用于 Spring Boot Security 登录，这将允许我们成功登录到我们的应用程序。\n\
  \n我们现在已成功为项目设置了 Spring Boot Security，并且这会自动将身份验证应用于我们的端点。我们下一步需要做的是为我们的安全添加配置；我们希望覆盖默认配置并为我们的应用程序实现自定义登录端点，以便提供对我们其他端点的访问。\n\
  \n要开始配置，让我们首先在 config 文件下创建一个名为 SecurityConfig 的新类。我们将扩展我们的新 SecurityConfig 类以继承\
  \ WebSecurityConfigurerAdapter。此适配器允许我们覆盖和自定义 WebSecurity 和 HttpSecurity 的配置，并在扩展类后，我们将覆盖前两种方法：\n\
  \n```\n@Override\nprotected void configure(AuthenticationManagerBuilder auth)\n\
  throws Exception {\n    //We will place the customized userdetailsservice here in\n\
  the following steps\n}\n\n@Bean(name = BeanIds.AUTHENTICATION_MANAGER)\n@Override\n\
  public AuthenticationManager authenticationManagerBean() throws Exception {\n  \
  \  return super.authenticationManagerBean();\n}\n```\n\n我们将在 WebSecurityConfigurerAdapter\
  \ 上覆盖的第一个方法是 configure(AuthenticationManagerBuilder auth) 方法，它接受 AuthenticationManagerBuilder，用于构建\
  \ LDAP 认证、基于 JDBC 的认证、添加自定义 UserDetailsService 以及添加 AuthenticationProviders。在这种情况下，我们将使用它来访问\
  \ userDetailsServiceMethod() 以自定义我们的认证。我们将在以下步骤中执行此操作，因为我们尚未创建我们修改的 UseDetailsService。\n\
  \n第二个方法是 authenticationManagerBean()；我们覆盖此方法是为了在我们的应用程序中将 AuthenticationManager\
  \ 暴露为 Bean，我们稍后将在 AuthenticateController 中使用它。下一步是实现我们希望对 HTTP 请求的配置。为此，我们将覆盖 configure(HttpSecurity\
  \ http) 方法。\n\n\n\n\n\nHttpSecurity 允许我们调用方法来实现针对 HTTP 请求的基于 Web 的安全请求配置。默认情况下，安全配置将应用于所有\
  \ HTTP 请求，但我们也可以使用 requestMatcher() 方法仅设置特定请求。HttpSecurity 与 Spring Security XML\
  \ 配置相同。\n\n让我们讨论 HttpSecurity 下的标准方法：\n\n- `csrf()`: 启用 CSRF 保护。此项默认启用。\n- `disable()`:\
  \ 禁用初始配置；调用该方法后可以应用新版本。\n- `antMatcher(\"/**\")`: 默认情况下，我们的配置将应用于所有 HTTP 请求。我们可以使用\
  \ antMatcher() 方法指定要应用配置的 URL 模式。\n- `antMatchers(\"/**\")`: 与 antMatcher() 方法类似，但接受要应用配置的模式列表。\n\
  - `permitAll()`: 指定任何 URL 端点都可以被任何人访问。\n- `anyRequest()`: 适用于任何类型的 HTTP 请求。\n- `authenticated()`:\
  \ 指定任何 URL 端点都可以被任何已认证用户访问。\n- `exceptionHandling()`: 异常处理配置。\n- `sessionManagement()`:\
  \ 此方法通常用于管理用户可以同时活跃的会话数量；例如，我们配置 `sessionManagement().maximumSessions(1).expiredUrl(\"\
  /login?expired\")`，这表示当用户已在另一终端登录并尝试登录到另一个实例时，将自动将其从其他实例注销。\n- `sessionCreationPolicy()`:\
  \ 允许我们为会话何时创建制定策略；可能的值为 ALWAYS、IF_REQUIRED、NEVER 和 STATELESS。\n\n在我们的代码中，让我们为安全配置一个基本配置。让我们将以下代码放在\
  \ `configure(HttpSecurity http)` 方法内：\n\n```java\n@Override\nprotected void configure(HttpSecurity\
  \ http) throws Exception {\n    http\n        // first chain\n        .csrf()\n\
  \        .disable()\n        // second chain\n        .antMatcher(\"/**\")\n   \
  \     .authorizeRequests()\n        // third chain\n        .antMatchers(\"/**\"\
  )\n        .permitAll()\n        // fourth chain\n        .and()\n        .sessionManagement()\n\
  \        .sessionCreationPolicy(\n            SessionCreationPolicy.STATELESS);\n\
  }\n```\n\n在前面的示例配置中，我们为应用程序实现了多个配置。你可以注意到我们已将方法分为链式调用。这是为了显示方法彼此相关。\n\n第一个链式调用 `.csrf().disable()`\
  \ 禁用了 CSRF 保护的使用。这只是一个示例，在构建应用程序时不建议禁用 CSRF。第二个链式调用 `.antMatcher(\"/**\").authorizeRequests()`\
  \ 表示任何请求都被授权可被任何用户访问，而不管角色。\n\n这可以通过在 `hasRole()` 方法中指定角色来修改，从而根据分配的角色限制用户。第三个链式调用是\
  \ `.antMatchers(\"/**\").permitAll()`，这表示任何用户都可以访问所有 URL，最后，`sessionManagement().sessionCreationPolicy(SessionCreationPolicy.STATELESS)`\
  \ 表示 Spring Security 不应创建任何会话。\n\n我们已成功创建了 SecurityConfig，其中包含我们对 Spring Security\
  \ 的所有配置；我们的代码应如下所示：\n\n```java\n@AllArgsConstructor\n@Configuration\n@EnableGlobalMethodSecurity(prePostEnabled\
  \ = true)\npublic class SecurityConfig extends\n        WebSecurityConfigurerAdapter\
  \ {\n    // removed some code for brevity\n\n    @Override\n    protected void configure(HttpSecurity\
  \ http) throws\n    Exception {\n        http\n            // first chain\n    \
  \        .csrf()\n            .disable()\n            // second chain\n        \
  \    .antMatcher(\"/**\")\n            .authorizeRequests()\n            // third\
