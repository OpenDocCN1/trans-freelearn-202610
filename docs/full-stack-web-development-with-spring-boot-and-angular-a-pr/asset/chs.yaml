  \ PostgreSQL。\n\n### Docker 容器中的 PostgreSQL\n\n我们已使用常规安装程序在终端上安装了 PostgreSQL；现在，我们将学习如何使用\
  \ Docker 配置 PostgreSQL。此方法将帮助我们跳过配置 PostgreSQL 的复杂步骤，以便我们开始开发并提供数据库管理的 GUI：\n\n\
  1. 您需要做的第一步是在终端上安装 Docker。您可以在以下链接安装 Docker：`https://docs.docker.com/get-docker/`。有关\
  \ Docker 系统要求和安装步骤的文档，您可以参考此链接：`https://docs.docker.com/desktop/windows/install/`。\n\
  \n2. 成功安装 Docker 后，打开 Docker Desktop 并在终端上启动 Docker。然后，打开命令行并执行以下命令：\n\n    ```bash\n\
  \    docker run --name postgresql-container -p 5434:5434 -e POSTGRES_PASSWORD=pass\
  \ -d postgres\n    ```\n\n    前面的命令将从 Docker Hub 拉取 PostgreSQL。命令中的 postgresql-container\
  \ 部分可以替换，因为这是我们可以定义的一个容器名称。POSTGRES_PASSWORD 参数是 postgres 管理员的密码，我们也可以配置它。\n\n3.\
  \ 执行命令后，我们可以通过执行 `docker ps -a` 命令或查看 Docker Desktop 来验证新创建的容器，以检查正在运行的容器列表：\n\n\
  \    ![](img/7c3ddd2e5893c9b5a0220148ed886548_86_0.png)\n\n    图 4.7 – 使用 Docker\
  \ 的 PostgreSQL 安装\n\n    在前面的示例中，我们已执行 `docker ps -a` 命令，我们可以看到我们的 PostgreSQL 镜像已被拉取：\n\
  \n    ![](img/7c3ddd2e5893c9b5a0220148ed886548_87_0.png)\n\n    图 4.8 – 使用 Docker\
  \ 的 PostgreSQL 安装（在 Docker Desktop 中查看容器）\n\n4. 我们也可以在 Docker Desktop 中查看已拉取的 postgresql-container\
  \ 并在终端中验证其状态。\n\n我们已成功使用 Docker 配置了 PostgreSQL。我们可以通过使用终端 IP 地址和端口创建新服务器将其连接到 pgAdmin。\n\
  \n我们已在终端中配置了 PostgreSQL 数据库。现在，我们将学习 Spring Data JPA 及其在开发 Spring 应用程序中的重要性。\n\n\
  ## Spring Data JPA\n\nSpring Data JPA（Java Persistence API）是用于在 Java 应用程序中管理关系数据的广泛使用的规范。它有助于开发\
  \ Spring，因为它通过不实现读写操作减少了样板代码。它还处理 JDBC 基于的数据库访问和对象关系映射所涉及的复杂过程。\n\n在讨论 Spring Data\
  \ JPA 之前，让我们讨论其明确的优势以及为什么它在 Spring 开发中常用。\n\n### Spring Data JPA 的优势\n\n以下是 Spring\
  \ Data JPA 的优势：\n\n- **无代码仓库**：Spring Data JPA 推广 *无代码* 仓库，这意味着我们不必编写仓库模式，这会产生大量重复代码。它提供了一组接口，我们可以使用它来扩展我们的类以应用数据特定的实现。\n\
  \n\n\n\n\n例如，我们在应用程序中有 BlogRepository 类；当我们用 CrudRepository<Blog, Long> 接口扩展它时，它将具有以下功能的\
  \ 方法：\n\n- 持久化、更新和删除一个或多个博客实体\n- 通过主键查找一个或多个博客\n- 统计所有博客\n- 验证单个博客是否存在\n\n通过 Spring\
  \ Data JPA 提供的接口扩展存储库包括所有数据相关方法，这使我们能够更专注于业务逻辑。\n\n- **样板代码减少：** Spring Data JPA\
  \ 为方法提供内置实现。正如第一个优点所述，我们只需要专注于业务逻辑，不再需要编写读写操作，如接口下所写。这也防止了人为错误，因为所有实现都已为我们注册。\n\
  - **生成的查询：** Spring Data JPA 还可以根据方法名称创建查询。例如，如果我们想通过作者查询单个博客，我们需要做的唯一一步是在接口上创建一个以\
  \ findBy 开头的方法名称，Spring 将解析名称并创建查询：\n\n```\npublic interface BlogRepository\nextends\
  \ CrudRepository<Blog, Long> {\nBlog findByAuthor(String author);\n}\n```\n\n在前面的示例中，我们创建了\
  \ findByAuthor() 方法，这将允许 Spring 生成查询并将参数设置为绑定参数值。一旦我们调用该方法，它将执行查询。\n\n## Spring\
  \ Data JPA 提供的存储库\n\nSpring Data JPA 提供存储库，提供不同的方法用于数据相关实现。存储库如下：\n\n- CrudRepository：接口存储库，提供创建、读取、更新和删除（CRUD）的基本操作。\n\
  - PagingAndSortingRepository：扩展 CrudRepository 并添加一个名为 findAll 的方法，可以按排序方式检索结果并分页。\n\
  - JpaRepository：添加特定 JPA 方法并具有 CrudRepository 和 PagingAndSortingRepository 的所有功能。它还添加了诸如\
  \ flush() 的方法，该方法刷新持久化上下文，以及 deleteInBatch()，该方法批量删除记录。\n\n- **Repository：** 这是我们需要用\
  \ JPA 存储库扩展以使实体具有内置操作的接口。\n\n在前面的示例中，我们有一个 Villain 实体。为了实现 CRUD 操作，我们将创建一个 VillainRepository\
  \ 接口并用 CrudRepository 扩展它，类型为 Villain 和 UUID：\n\n```\n@Repository\npublic interface\
  \ VillainRepository extends\nCrudRepository<Villain, UUID> {\n\n    // custom composite\
  \ repository here\n}\n```\n\n- **Service：** 这是我们将使用我们创建的存储库的地方。我们可以使用 @Autowired\
  \ 注解注入存储库并调用 JPA 和自定义定义的方法：\n\n```\n@Service\npublic class VillainService {\nprivate\
  \ final VillainRepository villainRepository;\n\n@Autowired\npublic VillainService\
  \ (VillainRepository\nvillainRepository) {\n    this. villainRepository = villainRepository;\n\
  }\n\n    public Iterable<Villain> findAllVillains() {\n        return villainRepository.findAll();\n\
  \    }\n\n    public Villain findVillainById(UUID id) {\n        return findOrThrow(id);\n\
  \    }\n}\n```\n\n在前面的示例中，我们可以看到我们使用 @Autowired 注解将 VillainRepository 注入到 VillainService\
  \ 中。\n\n让我们继续使用同一个文件中的以下方法：\n\n```\npublic void removeVillainById(UUID id) {\n \
  \   villainRepository.deleteById(id);\n}\n\npublic Villain addVillain(Villain villain)\
  \ {\n    return villainRepository.save(villain);\n}\n\npublic void updateVillain(UUID\
  \ id, Villain villain) {\n    findOrThrow(id);\n    villainRepository.save(villain);\n\
  }\n\nprivate Villain findOrThrow(final UUID id) {\n    return villainRepository\n\
  \        .findById(id)\n        .orElseThrow(\n            () -> new NotFoundException(\"\
  Villain by id \" +\n            id + \" was not found\")\n        );\n}\n```\n\n\
  我们还通过使用内置的 JPA 实现创建了方法，例如 save()、deleteById()、findAll() 和 findById()，这些方法在 CrudRepository\
  \ 接口中可以找到。服务现在可以注入到我们的控制器或其他服务中以使用这些方法。\n\n我们现在已经了解了 Spring Data JPA、其优势以及 Spring\
  \ JPA 上的实现概述。在下一节中，我们将学习如何向 Spring Boot 应用程序添加 Spring Data JPA 和 PostgreSQL 依赖项。\n\
  \n## 添加 Spring Data JPA 和 PostgreSQL 依赖项\n\n本节将向我们的应用程序添加 Spring Data JPA、PostgreSQL\
  \ 和其他有价值的依赖项。我们将使用 Spring Initializr 和现有 Spring Boot 项目添加依赖项。\n\n### 使用 Spring Initializr\
  \ 添加\n\n使用 Spring Initializr 创建 Spring Boot 应用程序后添加依赖项很简单。我们只需要在生成项目之前在 Initializr\
  \ 上选择依赖项即可：\n\n1. 首先要做的是前往 `https://start.spring.io/` 或打开你的 IntelliJ IDEA（适用于 Ultimate\
  \ 用户）以打开 Spring Initializr（有关 *使用 Spring Initializr* 部分的回顾，请参阅 *第 3 章，迈向 Spring\
  \ Boot*）。\n\n2. 选择你的项目是否使用 Maven 或 Gradle 并设置所需配置，即 **Group、Artifact、Name、Description、Package\
  \ name、Packaging** 以及项目的 **Java** 版本。\n\n3. 接下来，点击右上角的 **Add Dependencies** 并选择以下依赖项：\n\
  \n   - **Spring Data JPA**：此依赖项用于添加 Spring Data JPA，用于内置数据存储相关实现。\n   - **H2 Database**：这是一个支持\
  \ JDBC API 和 R2DBC 访问的内存数据库，通常用于单元测试。\n   - **PostgreSQL Driver**：这是一个 JDBC 和 R2DBC\
  \ 驱动程序，将允许 Java 应用程序连接到 PostgreSQL 数据库。\n\n![](img/7c3ddd2e5893c9b5a0220148ed886548_92_0.png)\n\
  \n图 4.9 — 在 Spring Initializr 中添加依赖项\n\n成功添加依赖项后，我们可以看到我们的依赖项已列出。\n\n4. 点击 **GENERATE**，它将下载我们已生成的项目。\n\
  \n5. 解压 ZIP 文件并在你的 IDE 上打开项目。如果你使用 Maven 开发项目，请在 `src` 文件夹中打开 `pom.xml`，或如果你使用 Gradle，请打开\
  \ `build.gradle`，它也位于 `src` 文件夹中：\n\n![](img/7c3ddd2e5893c9b5a0220148ed886548_93_0.png)\n\
  \n图 4.10 – Spring Boot 应用程序（pom.xml 的视图）\n\n在前面的示例中，我们可以看到 Spring Boot 应用程序使用 Maven\
  \ 生成，并且我们可以看到我们的 `pom.xml` 文件已包含我们在 Spring Initializr 中添加的依赖项：\n\n![](img/7c3ddd2e5893c9b5a0220148ed886548_94_0.png)\n\
  \n图 4.11 – Spring Boot 应用程序（build.gradle 的视图）\n\n现在，在前面的示例中，Spring Boot 应用程序使用 Gradle\
  \ 生成，我们可以看到依赖项列表已添加到 build.gradle 文件下。\n\n我们现在将依赖项添加到现有 Spring Boot 应用程序。\n\n###\
  \ 添加现有项目\n\n在前面的示例中，我们添加了依赖项以使用 Spring Initializr 生成 Spring Boot 应用程序。现在，我们将依赖项添加到现有应用程序。向现有\
  \ Spring 应用添加依赖项很简单；我们只需要修改 pom.xml（Maven）或 build.gradle（Gradle）文件。\n\n要使用 Maven\
  \ 安装 Spring Data JPA、H2 数据库和 PostgreSQL Driver，我们将以 XML 形式添加依赖项，如下所示：\n\n```\n<dependencies>\n\
  \    <dependency>\n        <groupId>org.springframework.boot</groupId>\n       \
  \ <artifactId>spring-boot-starter-data-jpa</artifactId>\n    </dependency>\n\n \
  \   <dependency>\n        <groupId>com.h2database</groupId>\n        <artifactId>h2</artifactId>\n\
  ```\n\n\n\n\n```\n<scope>runtime</scope>\n</dependency>\n\n<dependency>\n    <groupId>org.postgresql</groupId>\n\
  \    <artifactId>postgresql</artifactId>\n    <scope>runtime</scope>\n</dependency>\n\
  \n<dependency>\n    <groupId>org.springframework.boot</groupId>\n    <artifactId>spring-boot-starter-test</artifactId>\n\
  \    <scope>test</scope>\n</dependency>\n</dependencies>\n```\n\nAnd for a Spring\
  \ application using Gradle, we will add the dependencies as follows:\n\n```\ndependencies\
  \ {\n    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'\n\
  \    runtimeOnly 'com.h2database:h2'\n    runtimeOnly 'org.postgresql:postgresql'\n\
  }\n```\n\nIntelliJ will automatically recognize the added dependencies and install\
  \ them for the project, and we can successfully build and run the Spring Boot application\
  \ on the fly.\n\nWe have learned how to add Spring Data JPA and PostgreSQL Driver\
  \ to our Spring Boot application. In the next section, we will learn how to connect\
  \ our Spring Boot application to our PostgreSQL database.\n\n## Connecting to a\
  \ database\n\nWe have already configured our PostgreSQL database and initialized\
  \ our Spring Boot application with the needed dependencies. Now, we will learn how\
  \ to connect our PostgreSQL to our application. There are two ways we can connect\
  \ to our database – the first is through Spring JDBC, and the other is Spring Data\
  \ JPA. Spring Data JPA is the most convenient way to connect to our database, but\
  \ we will demonstrate both methods in this section.\n\n## Configuring the database\
  \ properties\n\nThe first thing we need to do is configure the database properties\
  \ in our Spring Boot application. We need to specify the server URL of the database,\
  \ the admin username, and the password by adding the following source code to the\
  \ application.properties file:\n\n```\nspring.datasource.url=jdbc:postgresql://localhost:5432/springDB\n\
  spring.datasource.username=postgres\nspring.datasource.password=password\n```\n\n\
  In the preceding example, we can see that we have configured the basic connection\
  \ settings for our PostgreSQL. springDB on the URL will be the name of the database\
  \ in PostgreSQL, which should already exist on our server.\n\n## Connecting using\
  \ Spring JDBC\n\nThe first method to connect to the database is by using Spring\
  \ JDBC. We will add an additional dependency to our application for us to use this\
  \ method.\n\nTo add JDBC, we will add the following code to our pom.xml (Maven)\
  \ or build.gradle (Gradle) files:\n\n```\n<dependency>\n    <groupId>org.springframework.boot</groupId>\n\
  \    <artifactId>spring-boot-starter-jdbc</artifactId>\n</dependency>\n```\n\nAfter\
  \ successfully adding the JDBC dependency, we can now use JdbcTemplate to execute\
  \ queries on our application:\n\n```\nimport org.springframework.beans.factory.annotation.Autowired;\n\
  import org.springframework.boot.SpringApplication;\nimport org.springframework.boot.autoconfigure.SpringBootApplication;\n\
  import org.springframework.jdbc.core.JdbcTemplate;\n\n@SpringBootApplication\npublic\
  \ class AwesomeJavaProject {\n    @Autowired\n    private JdbcTemplate jdbcTemplate;\n\
  \    public static void main(String[] args) {\n```\n\n```\nSpringApplication.run(AwesomeJavaProject.class,\n\
  \    args);\n}\n@Override\npublic void run(String... args) throws Exception {\n\
  \    String sql = \"INSERT INTO blog (title, author,\n    body) VALUES (\"+ \"'Awesome\
  \ Java Project',\n    'Seiji Villafranca', 'This is an\n    awesome blog for java')\"\
  ;\n\n    int rows = jdbcTemplate.update(sql);\n}\n}\n```\n\nIn the preceding example,\
  \ we can execute database statements such as INSERT in our application and call\
  \ the update() method to modify data in the database.\n\n## Connecting using Spring\
  \ Data JPA\n\nThe second method is by using the Spring Data JPA plugin. The first\
  \ step we need to take is to add additional details to the application.properties\
  \ file:\n\n```\nspring.jpa.hibernate.ddl-auto=update\nspring.jpa.show-sql=true\n\
  spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect\n\
  spring.jpa.properties.hibernate.format_sql=true\n```\n\nAfter adding the new settings,\
  \ we can now create Entity and Repository for a specific table in our application\
  \ – for example, we have a Blog table:\n\n```\npackage net.codejava;\nimport javax.persistence.*;\n\
  @Entity\n@Table(name = \"blog\")\npublic class Blog {\n    @Id\n    @GeneratedValue(strategy\
  \ = GenerationType.IDENTITY)\n```\n\n```\nprivate Integer id;\n\nprivate String\
  \ title;\nprivate String body;\nprivate String author;\n}\n```\n\nIn the preceding\
  \ example, we have created a Blog class and annotated it with @Entity and @Table\
  \ to indicate that this is an object connected to our database table:\n\n```\npackage\
  \ net.codejava;\nimport org.springframework.data.jpa.repository.JpaRepository;\n\
  \npublic interface BlogRepository extends JpaRepository<Blog,\nInteger> {\n}\n```\n\
  \nAfter creating our entity, we have made the repository for the blog, which can\
  \ be extended by the repositories provided by JPA. BlogRepository can now be injected\
  \ into our services or controllers to read, add, modify, or delete data on our database.\n\
  \n## Summary\n\nThat brings you to the end of this chapter. Let’s have a recap of\
  \ the valuable things you have learned. You learned how to set up PostgreSQL on\
  \ your local machine using the installer or Docker container.\n\nYou have also learned\
  \ about the concepts and advantages of Spring Data JPA in Spring Boot and how to\
  \ add it to your application, which is helpful in creating services with CRUD capabilities\
  \ with less boilerplate code.\n\nLast but not least, you learned how to connect\
  \ your Spring Boot application with the PostgreSQL database using JDBC and Spring\
  \ Data JPA.\n\nIn the next chapter, we will be learning how to start our server,\
  \ how to add controllers, models, and services in our code, and about Redis for\
  \ caching.\n"
- "## Building APIs with Spring\n\nIn the previous chapter, you learned about the\
  \ concepts and advantages of PostgreSQL and set it up on your local machine using\
  \ the installer or the Docker container. You know how to configure Spring Data Java\
  \ Persistence API (Spring Data JPA) on our project and use its provided repositories\
  \ to perform Create, Read, Update, and Delete (CRUD) operations on our database\
  \ with less boilerplate code. Lastly, you have also learned to connect your application\
  \ with PostgreSQL using the Java Database Connectivity (JDBC) driver and Spring\
  \ Data JPA.\n\nThis chapter will create your Spring Boot application programming\
  \ interface (API) project; we will focus on coding, making our models, and adding\
  \ controllers and services to develop our endpoints. We will also add Remote Dictionary\
  \ Server (Redis) for caching to help improve our application performance.\n\nIn\
  \ this chapter, we will cover the following topics:\n- Starting the server\n- Adding\
  \ models\n- Writing services\n- Adding controllers\n- Adding Redis for caching\n\
  \n## Technical requirements\n\nThere are no technical requirements for this chapter.\n\
