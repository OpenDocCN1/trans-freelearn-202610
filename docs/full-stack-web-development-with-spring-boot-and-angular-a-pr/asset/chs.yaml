  在本节中，我们将通过在 state 中添加 effects 来改进删除功能。我们当前的删除功能仅从 store 中删除数据，但不会同步数据库中的更改。这意味着如果我们刷新应用程序，我们已删除的数据将再次可用。\n\
  \n为了同步数据库中的更改，我们应该做的是创建一个 effect 来调用 delete API。让我们在以下各节中查看代码中的逐步更改。\n\n### 创建新的\
  \ action 类型\n\n我们需要做的第一步是创建新的 action 类型。NgRx 中的 effects 稍后将使用新的 action 类型用于删除功能。\n\
  \n我们将在 anti-hero/state/anti-hero.actions.ts 文件下的 AntiHeroActions 枚举中添加 REMOVE_ANTI_HERO_API。\n\
  \n让我们看一下以下代码中添加的 action：\n\n```\n```typescript\nexport enum AntiHeroActions {\n\
  \  GET_ANTI_HERO_LIST = '[Anti-Hero] Get Anti-Hero list',\n  SET_ANTI_HERO_LIST\
  \ = '[Anti-Hero] Set Anti-Hero list',\n  REMOVE_ANTI_HERO_API =\n    '[Anti-Hero]\
  \ Remove Anti-Hero (API)',\n  REMOVE_ANTI_HERO_STATE =\n    '[Anti-Hero] Remove\
  \ Anti-Hero (STATE)',\n}\n```\n```\n\n我们可以在前面的代码示例中看到，为我们的 actions 添加了一个新的 action\
  \ 类型。请注意，我们不需要为此类型创建新的 action，因为一旦分派此 action 类型，我们将调用 effect 而不是 action。\n\n\n\n\
  \n\n###### 创建删除效果\n\n我们下一步需要做的是为删除功能创建效果。在 `anti-hero/state/anti-hero.effect.ts`\
  \ 文件中，我们将添加以下代码：\n\n```typescript\n// See full code on https://github.com/PacktPublishing/Spring-Boot-and-Angular/tree/main/Chapter-13\n\
  removeAntiHero$ = createEffect(() => {\n  return this.actions$.pipe(\n    ofType(AntiHeroActions.REMOVE_ANTI_HERO_API),\n\
  \    mergeMap((data: { payload: string }) =>\n      this.antiHeroService.deleteAntiHero(data.payload)\n\
  \        .pipe(\n          map(() => ({ type:\n            AntiHeroActions.REMOVE_ANTI_HERO_STATE,\n\
  \            antiHeroId: data.payload })),\n          catchError(() => EMPTY)\n\
  \        )\n    )\n  )\n}, { dispatch: true }\n);\n```\n\n在前面的代码示例中，我们可以看到我们为删除操作创建了一个新的\
  \ effect；其类型为 `REMOVE_ANTI_HERO_API`，它会调用 `AntiHeroService` 中的 `deleteAntiHero()`\
  \ 函数，根据传入的 ID 进行数据删除，并在 API 成功后。\n\n该 effect 将派发另一个 action，`REMOVE_ANTI_HERO_STATE`，我们在上一节中创建了它，用于从\
  \ store 中移除反英雄。这意味着我们从数据库中删除的数据也会从我们的 NgRx store 中删除。\n\n###### 修改派发\n\n此功能的最后一步是修改在\
  \ `list.component.ts` 文件中派发的 action。在上一节中，我们直接在组件中调用了 `REMOVE_ANTI_HERO_STATE` action；我们将把它改为\
  \ `REMOVE_ANTI_HERO_API`，因为我们现在应该调用 effect，它将调用 API，同时也会调用 `REMOVE_ANTI_HERO_STATE`\
  \ action。\n\n让我们看一下以下代码示例：\n\n```typescript\nselectAntiHero(data: {antiHero: AntiHero,\
  \ action: TableActions}) {\n  switch(data.action) {\n    case TableActions.Delete:\
  \ {\n      this.store.dispatch({type:\n        AntiHeroActions.REMOVE_ANTI_HERO_API,\n\
  \        payload: data.antiHero.id});\n      return;\n    }\n    default: \"\"\n\
  \  }\n}\n```\n\n在前面的代码示例中，我们现在在列表组件中派发 effect。这将先调用 API，然后再在应用程序中更新我们的 store；我们\
  \ store 和数据库中的更改保持同步。\n\n在下一节中，我们将实现使用副作用向应用程序添加数据的功能。\n\n#### 使用 NgRx 添加带副作用的项目\n\
  \n在本节中，我们将使用 NgRx 实现带副作用的添加功能。步骤与我们实现删除功能时类似。我们将逐步创建构建块，并在组件中创建派发逻辑。\n\n#########\
  \ 创建 actions\n\n我们需要做的第一步是为添加功能创建所需的操作类型和 action。要实现 actions，我们可以思考我们为删除功能创建 actions\
  \ 的方式。\n\n概念是相同的。我们需要创建两种操作类型，分别是 `ADD_ANTI_HERO_API` 和 `ADD_ANTI_HERO_STATE`。第一个类型将由调用\
  \ API 的 effect 使用，第二个类型将由修改状态以添加新创建数据的 reducer 使用。\n\n创建了两个操作类型后，我们还需要使用 `createAction()`\
  \ 函数为 `ADD_ANTI_HERO_STATE` 类型创建一个 action。effect 将在 API 成功调用后派发它。\n\n让我们看一下以下代码实现：\n\
  \n```typescript\n// See full code on https://github.com/PacktPublishing/Spring-Boot-and-Angular/tree/main/Chapter-13\n\
  \nexport enum AntiHeroActions {\n    GET_ANTI_HERO_LIST = '[Anti-Hero] Get Anti-Hero\
  \ list',\n    SET_ANTI_HERO_LIST = '[Anti-Hero] Set Anti-Hero list',\n    ADD_ANTI_HERO_API\
  \ = '[Anti-Hero] Add Anti-Hero (API)',\n    ADD_ANTI_HERO_STATE = '[Anti-Hero] Add\
  \ Anti-Hero (STATE)',\n    REMOVE_ANTI_HERO_API = '[Anti-Hero] Remove Anti-Hero\
  \ (API)',\n    REMOVE_ANTI_HERO_STATE = '[Anti-Hero] Remove Anti-Hero (STATE)',\n\
  }\n\nexport const addAntiHeroState = createAction(\n    AntiHeroActions.ADD_ANTI_HERO_STATE,\n\
  \    props<{ antiHero: AntiHero }>()\n)\n```\n\n在前面的代码示例中，我们可以看到我们在 `AntiHeroActions`\
  \ 中添加了两种新的类型。我们还创建了一个新的 action，其类型为 `ADD_ANTI_HERO_STATE`，它接受一个 `antiHero` 属性，该属性将被推入反英雄状态的新项目中。\n\
  \n######### 创建 effect\n\n我们下一步需要做的是为添加功能创建 effect。在 `anti-hero/state/anti-hero.effect.ts`\
  \ 文件中，我们将添加以下代码：\n\n```typescript\n// add anti-heroes to the database\naddAntiHero$\
  \ = createEffect(() => {\n    return this.actions$.pipe(\n        ofType(AntiHeroActions.ADD_ANTI_HERO_API),\n\
  \        mergeMap((data: {type: string, payload: AntiHero}) =>\n            this.antiHeroService.addAntiHero(data.payload)\n\
  \            .pipe(\n                map(antiHeroes => ({ type:\n              \
  \      AntiHeroActions.ADD_ANTI_HERO_STATE,\n                    antiHero: data.payload\
  \ })),\n                tap(() =>\n                    this.router.navigate([\"\
  anti-heroes\"])),\n                catchError(() => EMPTY)\n            )\n    \
  \    )\n    )\n}, {dispatch: true})\n```\n\n在前面的代码示例中，我们可以看到我们创建了一个与删除功能 effect\
  \ 类似的 effect。该 effect 使用 `ADD_ANTI_HERO_API` 类型并调用 `antiHeroService` 中的 `addAntiHero()`\
  \ 函数，以调用 POST API 将新数据添加到数据库中。\n\n成功调用 POST API 后，effect 将派发 `ADD_ANTI_HERO_STATE`\
  \ action 并传递来自 API 响应的新反英雄数据，以便由 reducer 添加。我们还添加了一个 `tap` 操作符，它调用一个 `navigate`\
  \ 函数，在创建新反英雄后将导航到列表页面。\n\n######### 创建 reducer\n\n创建 effects 后，我们需要将数据库中实现的更改与我们的\
  \ store 同步，而 reducer 将执行此操作。\n\n让我们看一下以下代码实现：\n\n```typescript\nexport const antiHeroReducer\
  \ = createReducer(\n  initialState,\n  on(setAntiHeroList, (state, { antiHeroes\
  \ }) => {\n    return { ...state, antiHeroes };\n  }),\n  on(removeAntiHeroState,\
  \ (state, { antiHeroId }) => {\n    return {\n      ...state,\n      antiHeroes:\
  \ state.antiHeroes.filter(data => data.id != antiHeroId)\n    };\n  }),\n  on(addAntiHeroState,\
  \ (state, { antiHero }) => {\n    return {\n      ...state,\n      antiHeroes: [...state.antiHeroes,\
  \ antiHero]\n    };\n  }),\n);\n```\n\n在前面的代码示例中，我们可以看到我们为 *添加* 功能添加了一个新的 reducer。它接受来自\
  \ `addAntiHeroState` action 的新反英雄数据，并返回具有修改后 `antiHeroes` 值的新状态，其中新反英雄已添加到数组中。\n\
  \n如果 reducer 成功修改了 `antiHeroes` 状态的值，任何订阅此状态更改的选择器都将在组件中发出新值。\n\n######### 派发 action\n\
  \n我们需要做的最后一步是在组件中派发 action。为了实现此步骤，我们将在反英雄表单中的 **Create** 按钮被点击时调用派发 action。在 `anti-hero/components/anti-hero-form.component.ts`\
  \ 文件中，我们添加了一个 emitter，它传递表单的值和按钮标签以识别操作是创建还是更新。\n\n让我们回顾一下我们为此反英雄表单实现的代码：\n\n```typescript\n\
  export class AntiHeroFormComponent implements OnInit {\n  @Input() actionButtonLabel:\
  \ string = 'Create';\n  @Output() action = new EventEmitter();\n  form: FormGroup;\n\
  \  constructor(private fb: FormBuilder) {\n    this.form = this.fb.group({\n   \
  \   id: [''],\n      firstName: [''],\n      lastName: [''],\n      house: [''],\n\
  \      knownAs: ['']\n    })\n  }\n  emitAction() {\n    this.action.emit({value:\
  \ this.form.value,\n      action: this.actionButtonLabel})\n  }\n}\n```\n\n在前面的代码示例中，我们可以看到反英雄表单发出表单值作为反英雄对象，该对象将被传递给\
  \ effect。\n\n这也提供了当前操作，因为我们也将使用此反英雄表单组件进行更新。按钮被点击后，我们需要在 `form.component.ts` 文件中有一个函数来派发\
  \ effect。\n\n\n\n\n\n让我们来看一下下面的代码示例：\n\n```\n// form.component.html\n<app-anti-hero-form\
  \ [selectedAntiHero]=\"antiHero\"\n(action)=\"formAction($event)\"></app-anti-hero-form>\n\
  \n// form.component.ts\nformAction(data: {value: AntiHero, action: string}) {\n\
  \  switch(data.action) {\n    case \"Create\" : {\n      this.store.dispatch({type:\n\
  \        AntiHeroActions.ADD_ANTI_HERO_API,\n        payload: data.value});\n  \
  \    return;\n    }\n    default: \"\"\n  }\n}\n```\n\n在前面的代码示例中，我们可以看到我们创建了 formAction()\
  \ 函数，该函数根据从反英雄表单组件传递过来的值派发一个 action。\n\n这使用了 switch 语句，因为当 action 为 update 时也会调用它。我们现在已经成功地使用\
  \ NgRx 的构建块为我们的应用程序创建了添加功能。\n\n在下一节中，我们将实现带有副作用的数据修改。\n\n#### 使用 NgRx 带副作用更新项目\n\
  \n在本节的最后部分，我们将实现最终缺失的功能，即更新功能，我们将逐步创建构建块，并在组件中创建派发逻辑，就像我们为添加和删除功能所做的那样。\n\n#########\
  \ 创建 actions\n\n我们需要做的第一步是为我们的更新功能创建所需 action 类型和 actions。我们将首先创建我们需要的两个 action\
  \ 类型，它们是 MODIFY_ANTI_HERO_API 和 MODIFY_ANTI_HERO_STATE。第一个类型将被调用 API 的 effect 使用，第二个类型将被\
  \ reducer 使用，该 reducer 通过根据新的反英雄对象更改数据来修改状态。\n\n创建了两个 action 类型后，我们还需要使用 createAction()\
  \ 函数为 MODIFY_ANTI_HERO_STATE 类型创建一个 action。effect 将在 API 成功调用后派发它。\n\n让我们来看一下下面的代码实现：\n\
  \n```\n// See full code on https://github.com/PacktPublishing/Spring-Boot-and-Angular/tree/main/Chapter-13\n\
  \nexport enum AntiHeroActions {\n    GET_ANTI_HERO_LIST = '[Anti-Hero] Get Anti-Hero\
  \ list',\n    SET_ANTI_HERO_LIST = '[Anti-Hero] Set Anti-Hero list',\n    ADD_ANTI_HERO_API\
  \ = '[Anti-Hero] Add Anti-Hero (API',\n    ADD_ANTI_HERO_STATE =\n        '[Anti-Hero]\
  \ Add Anti-Hero (STATE)',\n    REMOVE_ANTI_HERO_API =\n        '[Anti-Hero] Remove\
  \ Anti-Hero (API)',\n    REMOVE_ANTI_HERO_STATE =\n        '[Anti-Hero] Remove Anti-Hero\
  \ (STATE)',\n    MODIFY_ANTI_HERO_API =\n        '[Anti-Hero] Modify Anti-Hero (API)',\n\
  \    MODIFY_ANTI_HERO_STATE =\n        '[Anti-Hero] Modify Anti-Hero (STATE)',\n\
  }\nexport const modifyAntiHeroState = createAction(\n    AntiHeroActions.MODIFY_ANTI_HERO_STATE,\n\
  \    props<{ antiHero: AntiHero }>()\n);\n```\n\n在前面的代码示例中，我们可以看到我们在 AntiHeroActions\
  \ 中添加了两个新的类型。我们还创建了一个新的 action，其类型为 MODIFY_ANTI_HERO_STATE，它接受一个 antiHero 属性，该属性将用于修改\
  \ store 中的当前值。\n\n######### 创建 effect\n\n我们需要做的下一步是为添加功能创建 effect。在 anti-hero/state/anti-hero.effect.ts\
  \ 文件中，我们将添加以下代码：\n\n```\n// modify anti-heroes in the database\n    modifyAntiHero$\
  \ = createEffect(() =>{\n```\n\n```\nreturn this.actions$.pipe(\n    ofType(AntiHeroActions.MODIFY_ANTI_HERO_API),\n\
  \    mergeMap((data: {type: string, payload: AntiHero}) =>\n        this.antiHeroService.updateAntiHero(\n\
  \            data.payload.id, data.payload)\n        .pipe(\n            map(antiHeroes\
  \ => ({ type:\n                AntiHeroActions.MODIFY_ANTI_HERO_STATE,\n       \
  \         antiHero: data.payload })),\n            tap(() =>\n                this.router.navigate([\"\
  anti-heroes\"])),\n            catchError(() => EMPTY)\n        )\n    }, {dispatch:\
  \ true})\n```\n\n在前面的代码示例中，我们可以看到我们创建了一个与添加和删除功能的 effect 类似的 effect。此 effect 使用\
  \ MODIFY_ANTI_HERO_API 类型并调用 antiHeroService 中的 updateAntiHero() 函数，以调用 PUT API\
  \ 来修改数据库中带有 ID 参数的反英雄。\n\n成功调用 PUT API 后，effect 将派发 MODIFY_ANTI_HERO_STATE action\
  \ 并传递来自 API 响应的修改后的反英雄数据以供 reducer 添加，与添加 effect 相同，我们还添加了一个 tap 操作符，该操作符调用 navigate\
  \ 函数，在修改反英雄后将导航到列表页面。\n\n######### 创建 reducer\n\n创建 effects 后，我们需要将数据库中实现的变化与我们的\
  \ store 同步，reducer 将执行此操作。\n\n让我们来看一下下面的代码实现：\n\n```\nexport const antiHeroReducer\
  \ = createReducer(\n    initialState,\n    on(setAntiHeroList, (state, { antiHeroes\
  \ }) => {\n        return {...state, antiHeroes}}),\n    on(removeAntiHeroState,\
  \ (state, { antiHeroId }) => {\n        return {...state, antiHeroes:\n        \
  \    state.antiHeroes.filter(data => data.id !=\n```\n\n```\nantiHeroId) }\n}),\n\
  on(addAntiHeroState, (state, {antiHero}) => {\n    return {...state, antiHeroes:\
  \ [...state.antiHeroes,\n        antiHero]}\n}),\non(modifyAntiHeroState, (state,\
  \ {antiHero}) => {\n    return {...state, antiHeroes: state.antiHeroes.map(data\n\
  \        => data.id === antiHero.id ? antiHero : data)}\n}),\n);\n```\n\n在前面的代码示例中，我们可以看到我们为更新功能添加了一个新的\
  \ reducer。它接受来自 addAntiHeroState action 的修改后的反英雄数据，并返回带有修改后的 antiHeroes 值的新状态，其中我们使用\
  \ map() 操作符用新对象替换具有给定 ID 的反英雄。\n\n如果 reducer 成功修改了 antiHeroes 状态的值，订阅此状态更改的任何 selector\
  \ 都会在组件中发出新值。\n\n######### 派发 action\n\n我们需要做的最后一步是向我们的组件派发 action。为了实现此步骤，我们将执行与为添加功能所做的相同的步骤。我们仍将使用\
  \ anti-hero/components/anti-hero-form.component.ts 文件来更新数据。\n\n这里唯一的差别是我们将在表单中绑定选定的反英雄值；反英雄表单组件应接受一个反英雄对象并应使用\
  \ patchValue() 方法在表单组中修补值。\n\n让我们来看一下下面的代码示例：\n\n```\nexport class AntiHeroFormComponent\
  \ implements OnInit {\n    @Input() actionButtonLabel: string = 'Create';\n    @Input()\
  \ selectedAntiHero: AntiHero | null = null;\n    @Output() action = new EventEmitter();\n\
  \    form: FormGroup;\n    constructor(private fb: FormBuilder) {\n        this.form\
  \ = this.fb.group({\n            id: [''],\n            firstName: [''],\n```\n\n\
  ```\nlastName: [''],\n    house: [''],\n    knownAs: ['']\n  })\n}\nngOnInit():\
  \ void {\n  this.checkAction();\n}\n\ncheckAction() {\n  if(this.selectedAntiHero)\
  \ {\n    this.actionButtonLabel = \"Update\";\n    this.patchDataValues()\n  }\n\
  }\nemitAction() {\n  this.action.emit({value: this.form.value,\n    action: this.actionButtonLabel})\n\
  }\n}\n```\n\n在前面的代码示例中，我们可以看到我们添加了 checkAction() 函数，该函数检查是否在反英雄表单组件中传递了反英雄对象。\n\n\
  这表明如果对象不为 null，这将是一个 Update action，我们必须通过使用 patchValue() 方法绑定表单，将选定的反英雄详细信息显示在每个字段中。\n\
  \n现在让我们看一下表单组件的代码实现：\n\n```\n// form.component.html\n<app-anti-hero-form [selectedAntiHero]=\"\
  antiHero\"\n(action)=\"formAction($event)\"></app-anti-hero-form>\n\n// form.component.ts\n\
  antiHero$: Observable<AntiHero | undefined>;\n  antiHero: AntiHero | null = null;\n\
  \n  constructor(private router: ActivatedRoute,\n    private store: Store<AppState>)\
  \ {\n    const id = this.router.snapshot.params['id'];\n```\n\n```\nthis.antiHero$\
  \ = this.store.select(selectAntiHero(id));\nthis.antiHero$.subscribe(d => {\n  if(d)\
  \ this.antiHero = d;\n});\n}\nformAction(data: {value: AntiHero, action: string})\
  \ {\n  switch(data.action) {\n    case \"Create\" : {\n      this.store.dispatch({type:\n\
  \        AntiHeroActions.ADD_ANTI_HERO_API,\n        payload: data.value});\n  \
  \    return;\n    }\n    case \"Update\" : {\n      this.store.dispatch({type:\n\
  \        AntiHeroActions.MODIFY_ANTI_HERO_API,\n        payload: data.value});\n\
  \      return;\n    }\n    default: \"\"\n  }\n}\n```\n\n在前面的代码示例中，我们可以看到我们在 formAction()\
  \ 函数中添加了一个新的 case，它也派发一个 action，但类型为 MODIFY_ANTI_HERO_API。\n\n我们还使用了 selectAntiHero()\
  \ selector 来使用我们在 URL 路由中的 ID 选择反英雄，该 ID 将传递到我们的 anti-hero-form.component.ts 文件中。\n\
  \n\n\n\n\n## Summary\n\n至此，本章已结束。让我们回顾一下我们学到的宝贵内容；我们已使用 NgRx 的构建块完成了应用的 CRUD 功能，并且我们学习了在状态管理中使用和不使用副作用的区别。副作用对于将\
  \ store 中的更改与数据库同步至关重要。\n\n我们还逐步学习了如何使用应用所需的不同 action 来创建 NgRx 的构建块。\n\n在下一章中，我们将学习如何在\
  \ Angular 中应用安全功能，例如添加用户登录和注销、检索用户配置文件信息、保护应用路由，以及调用受保护的端点 API。\n\n## Adding Authentication\
  \ in Angular\n\n在上一章中，我们使用 NgRx 的构建块完成了 Angular 应用的 CRUD 功能。我们还学习了在应用中编写 actions、reducers\
  \ 和 effects 的逐步流程，这些将用于修改状态的值。我们还学习了在应用中使用和不使用 effects 的区别。Effects 对于我们与外部 API 通信至关重要，从而使数据库更改能够在\
  \ NgRx store 中同步。\n\n在本章中，我们将学习如何在 Angular 应用中添加身份验证；我们将实现一个登录页面，该页面将提供有效的 JWT、保护路由，并使用\
  \ NgRx 应用 API 身份验证。\n\n在本章中，我们将涵盖以下主题：\n- Adding user authentication\n- Protecting\
  \ routes\n- Calling an API\n\n### Technical requirements\n\n本章的完整代码可在以下位置找到：https://github.com/PacktPublishing/Spring-Boot-and-Angular/tree/main/Chapter-14。\n\
  \n### Adding user authentication\n\n添加用户身份验证是开发应用的主要需求之一。此功能允许我们将页面和功能限制为未经授权的用户。我们可以通过不同方式实现用户身份验证，其中一种实现方式是提供登录页面以请求凭据。\n\
  \n让我们看一下实现身份验证功能的逐步流程。\n\n## The authentication API\n\n让我们首先回顾一下我们在 Spring Boot\
  \ 项目中创建的身份验证 API。身份验证的端点如下：\n- `{BASE_URL}/authenticate`: 身份验证的主要端点接受包含 email 和\
  \ password 字段的对象，并返回一个有效的 JWT，该 JWT 将用于调用端点。以下是该端点的示例响应对象：\n\n```\n// valid JWT\n\
  {\n  \"token\": \"eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiJOZXN0QGDtYW1sLmNvbSIImIhdCI6MTY1OTQyODk2MSwiZXhwIjIoxNjUSNDY0OTYxfQ.WU_aZjmI\
  \ fw--LCovx4cZ4_hcOTGiAgPnSaM0bjdv018\"\n}\n```\n- `{BASE_URL}/register`: 用于创建新的有效登录凭据的端点。JWT，如第\
  \ 7 章 Adding Spring Boot Security with JWT 中所述，主要用于无法维护客户端状态的 RESTful Web 服务，因为\
  \ JWT 包含与用户相关联的一些信息。这将主要用于我们将请求的端点的 headers 中。\n\n在我们的项目中，让我们在 core/services 文件夹下创建一个名为\
  \ AuthenticateService 的服务，通过执行以下命令：\n\n```\nng g core/services/authenticate\n```\n\
  \n成功创建服务后，我们将在服务中放置以下代码：\n\n```\nexport class AuthenticateService {\n\n  constructor(private\
  \ http: HttpClient) { }\n  // for login endpoint\n  login(data: {email: string,\
  \ password: string}): Observable<any> {\n    return this.http.post<any>(\n     \
  \ `${environment.authURL}/authenticate`,\n      data).pipe(\n      tap((data: any)\
  \ => data),\n      catchError(err => throwError(() => err))\n    )\n  }\n  // for\
  \ register endpoint\n  register(data: {email: string, password: string}):\n```\n\
  \n```\nObservable<any> {\n  return this.http.post<any>(\n    `${environment.authURL}/register`,\
  \ data).pipe(\n    tap((data: any) => data),\n    catchError(err => throwError(()\
  \ => err))\n  )\n}\n```\n\nAuthenticateService 将保存我们将在登录页面中使用的两个端点。现在，让我们为我们的应用创建拦截器。\n\
  \n## The HTTP interceptor\n\nHTTP 拦截器是 Angular 的功能，允许我们拦截 HTTP 请求以转换其 headers、主体或响应。这提供了\
  \ intercept() 函数，该函数将使我们能够获取传出请求并调用下一个拦截器或后端。\n\n我们主要使用拦截器来修改端点请求的 headers，这将负责为每个调用的请求添加\
  \ Authorization: Bearer {JWT} header。\n\n为了实现拦截器，我们将创建 core/interceptors/header.interceptor.ts\
  \ 文件，并在其中放置以下代码：\n\n```\n@Injectable()\nexport class HeaderInterceptor implements\
  \ HttpInterceptor {\n  intercept(httpRequest: HttpRequest<any>, next: HttpHandler):\
  \ Observable<HttpEvent<any>> {\n    const Authorization = localStorage.getItem('token')\
  \ ? `Bearer ${localStorage.getItem('token')}` : '';\n    if (httpRequest.url.includes('/api/v1'))\n\
  \      return next.handle(httpRequest.clone({ setHeaders: {\n        Authorization\
  \ }\n      }));\n    else\n      return next.handle(httpRequest);\n  }\n}\n```\n\
  \n在前面的代码示例中，我们为 intercept() 函数添加了新的实现。第一步是检索我们在本地存储中的有效 JWT，该 JWT 将用于 HTTP headers。我们仅在请求端点包含\
  \ api/v1 子字符串时使用 JWT，因为这些是受保护的端点。\n\n下一步是克隆请求并在克隆的请求中添加 Authorization: Bearer {JWT}\
  \ header，然后调用 next() 函数以使用添加的 header 调用 API。\n\n我们现在已创建拦截器；最后一步是在 AppModule 中添加拦截器。\n\
  \n让我们看一下以下代码：\n\n```\nproviders: [\n  { provide: HTTP_INTERCEPTORS, useClass:\n\
  \      HeaderInterceptor, multi: true }\n],\n```\n\n在前面的代码示例中，我们现在将拦截 anti-heroes\
  \ 端点上的每个 HTTP 调用，并将生成的 JWT 添加到请求 headers 中。\n\n## The authentication module\n\n\
  下一步是创建身份验证模块；该模块将负责保存登录和注册页面，该页面将接受用户和凭据并调用 authenticate 和 register 端点。\n\n要创建身份验证模块，我们将执行以下命令：\n\
  \n```\nng g m auth\n```\n\n成功创建身份验证模块后，我们将导入身份验证模块所需的多个模块：\n\n```\n@NgModule({\n\
  \  declarations: [\n  ],\n  imports: [\n    CommonModule,\n    MaterialModule,\n\
  \    FormsModule,\n    ReactiveFormsModule,\n    CoreModule,\n  ]\n});\n```\n\n\
  现在，我们将创建模块的不同部分。\n\n## The authentication form\n\n我们将为身份验证模块创建主要表单；这被认为是模块的 dumb\
  \ 组件，因为它将接受表单的值并将其发出到登录和注册页面。\n\n要创建身份验证表单组件，我们将执行以下命令：\n\n```\nng g c auth/components/auth-form\n\
  ```\n\n成功创建组件后，我们现在将实现表单的代码。在 auth-form 组件的 TypeScript 文件中，我们将放置以下代码：\n\n```\nexport\
  \ class AuthFormComponent {\n  @Input() error: string = \"\";\n  @Input() title:\
  \ string = \"Login\"\n  @Output() submitEmitter = new EventEmitter();\n  form: FormGroup;\n\
  \  constructor(private fb: FormBuilder) {\n    this.form = this.fb.group({\n   \
  \   email: [''],\n      password: ['']\n    })\n  }\n  submit() {\n    this.submitEmitter.emit(this.form.value);\n\
  \  }\n}\n```\n\n在前面的代码示例中，我们可以看到我们已使用 email 和 password 表单控件创建了一个响应式表单。我们还创建了一个 emitter，该\
  \ emitter 将表单的值传递到父组件，因为该组件将同时被登录和注册页面使用。现在，我们将实现 auth-form 组件的 HTML 代码和 CSS。\n\n\
  > **Note**\n> 请参阅提供的链接以获取完整的代码实现：\n> https://github.com/PacktPublishing/Spring-Boot-and-Angular/tree/main/Chapter-14/superheroes/src/app/auth/components/auth-form\n\
  \n\n\n\n\n在已实现的的代码中，我们将响应式表单与电子邮件和密码输入绑定。我们还创建了一个条件，使按钮在页面当前处于登录或注册时发生变化。\n\n我们已成功创建了我们的身份验证表单；现在，我们将创建我们的登录和注册页面。\n\
  \n## 登录和注册页面\n\n登录和注册页面被视为我们应用程序的智能组件，因为这些是会分派调用身份验证 API 的 action 的组件。\n\n要创建登录和注册页面，我们将执行以下命令：\n\
  \n```\nng g c auth/page/login auth/page/register\n```\n\n成功创建两个页面后，我们将运行登录和注册组件的代码：\n\
  \n### 登录页面\n\n```\n```typescript\n//TS File\nexport class LoginComponent{\n  constructor(private\
  \ authService: AuthenticateService,\n      private router: Router) {\n  }\n  submit(data:{email:string,\
  \ password:string}) {\n    this.authService.login(data).subscribe((data) => {\n\
  \      this.router.navigate(['/anti-heroes']);\n      localStorage.setItem('token',\
  \ data.token);\n    });\n  }\n}\n// HTML File\n<app-auth-form (submitEmitter)=\"\
  submit($event)\"></app-auth-form>\n```\n```\n\n### 注册页面\n\n```\n```typescript\n\
  // TS File\nexport class RegisterComponent {\n  error: string = \"\";\n```\n```\n\
  \n```\nconstructor(private authService: AuthenticateService) {\n}\nsubmit(data:\
  \ User) {\n    this.authService.register(data).subscribe((data) => {\n        this.router.navigate(['\
  \ /']);\n    });\n}\n// HTML File\n<app-auth-form title=\"Register\"\n(submitEmitter)=\"\
  submit($event)\"></app-auth-form>\n```\n\n在前面的代码示例中，我们可以看到登录页面和注册页面正在使用相同的身份验证表单组件。一旦表单提交，它将把表单值传递到\
  \ login() 或 register() 函数中，分别用于验证或创建用户。如果登录成功，我们将把用户重定向到反英雄列表页面，并将 API 生成的 token\
  \ 放入本地存储中。\n\n## 路由模块\n\n下一步是创建 auth-routing 模块，该模块将定义身份验证模块的路由。要创建该模块，让我们执行以下命令：\n\
  \n```\nng g m auth/auth-routing --flat\n```\n\n创建路由模块后，我们将运行以下代码：\n\n```\nconst\
  \ routes: Routes = [\n  {\n    path: \"\",\n    component: LoginComponent\n  },\n\
  \  {\n    path: \"register\",\n    component: RegisterComponent\n  }\n];\n@NgModule({\n\
  \  declarations: [],\n```\n\n```\nimports: [RouterModule.forChild(routes)],\nexports:\
  \ [RouterModule],\n})\nexport class AuthRoutingModule {}\n```\n\n我们还需要修改我们的 app-routing\
  \ 模块，因为我们需要我们的基本路径重定向到登录页面；让我们实现以下修改：\n\n```\nconst routes: Routes = [\n  {\n  \
  \  path: \"\",\n    redirectTo: \"login\",\n    pathMatch: \"full\",\n  },\n  {\n\
  \    path: \"login\",\n    loadChildren: () =>\n      import(\"./auth/auth.module\"\
  ).then((m) => m.AuthModule),\n  },\n  {\n    path: \"anti-heroes\",\n    loadChildren:\
  \ () =>\n      import(\"./anti-hero/anti-hero.module\").then((m) =>\n        m.AntiHeroModule),\n\
  \  }\n];\n```\n\n在前面已实现的代码中，我们可以看到一旦我们访问基本路径，这将现在加载 AuthModule 并将我们重定向到登录页面，如图 14.1\
  \ 所示。\n\n## Angular CRUD\n\n![](img/7c3ddd2e5893c9b5a0220148ed886548_347_0.png)\n\
  \n图 14.1 – 登录页面\n\n我们现在应该能够使用数据库中的用户登录。如果没有创建用户，我们可以使用注册页面创建一个新的用户，并且一旦登录成功，我们将被重定向到反英雄列表页面，如\
  \ *图 14.2* 所示。\n\n## Angular CRUD\n\n![](img/7c3ddd2e5893c9b5a0220148ed886548_347_1.png)\n\
  \n图 14.2 – 反英雄列表页面\n\n我们还可以观察到我们的有效 JWT 已经放置在我们的本地存储中，因为 HTTP 拦截器正在使用 JWT。当我们打开由我们的应用程序发出的请求时，我们可以看到标头中具有生成的\
  \ JWT：\n\n```\nAccept:\napplication/json, text/plain, */*\nAccept-Encoding:\ngzip,\
  \ deflate, br\nAccept-Language:\nen-AU,en-US;q=0.9,en;q=0.8,bs;q=0.7,fr-CA;q=0.6,fr;q=0.5,tl;q=0.4\n\
  Authorization:\nBearer eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiJ0ZXN0OQGdtYWlsLmNvbSIIm1hdCI6MTY1OTY5ODM2NSwiZXhwIjoxNjU5NzM0MzY1fQ.2SDLmvQcME5Be9Xj-zTeRlc6kGfQVNCMIWUBOBS5afg\n\
  ```\n\n在前面的示例标头中，我们可以看到 Authorization 标头包含应用程序调用的每个 API 请求的有效 JWT。JWT 在标头中的放置是在我们的登录成功并且我们被重定向到\
  \ AntiHeroModule 时完成的。\n\n## Token 验证\n\n我们需要做的下一步是添加 token 验证以检查我们的 token 是否已过期。要实现此功能，我们通过执行以下命令添加\
  \ @auth0/angular-jwt 库：\n\n```\nnpm install @auth0/angular-jwt --save\n```\n\n@auth0/angular-jwt\
  \ 库提供了有用的函数，例如 isTokenExpired()，用于检查 JWT 是否已过期，以及 decodeToken()，用于从 JWT 中检索信息。\n\
  \n成功安装库后，我们将向我们的 authenticate 服务添加以下代码：\n\n```\nisAuthenticated(): boolean {\n \
  \ const token = localStorage.getItem('token') ?? '';\n  // Check whether the token\
  \ is expired and return\n  // true or false\n  return !this.jwtHelper.isTokenExpired(token);\n\
  }\n```\n\n我们还需要将 JWT 模块导入到我们的 `app.module.ts` 文件中：\n\n```\n```typescript\nimports:\
  \ [\n    JwtModule.forRoot({})\n],\n```\n```\n\n我们将在我们的登录和注册页面上使用 `isAuthenticated()`\
  \ 函数来检查本地存储中是否存在 JWT。如果存在有效的 JWT，我们将把应用程序重定向到反英雄列表页面。\n\n让我们看看以下实现：\n\n```\n```typescript\n\
  //login page (TS File)\nconstructor(private authService: AuthenticateService, private\n\
  router: Router,) {\n    this.checkJWT();\n}\ncheckJWT() {\n    if(this.authService.isAuthenticated())\
  \ {\n        this.router.navigate(['/anti-heroes'])\n    }\n}\n```\n```\n\n## 注销实现\n\
  \n我们需要实现的最后一个功能是注销功能。要添加此功能，我们唯一需要添加的就是一个将 token 从存储中移除的函数。让我们按如下方式进行代码实现：\n\n###\
  \ authenticate.service.ts\n\n```\n```typescript\nexport class AuthenticateService\
  \ {\n... other functions\ndoLogout() {\n    let removeToken = localStorage.removeItem('token');\n\
  \    if (removeToken == null) {\n        this.router.navigate(['login']);\n    }\n\
  }\n}\n```\n```\n\n在前面的代码示例中，我们添加了一个 doLogout() 函数，该函数移除存储中的 token 并将应用程序重定向到登录页面。现在，让我们编辑我们的\
  \ navbar 组件以具有注销按钮：\n\n### navbar.component.html\n\n```\n<p>\n    <mat-toolbar color=\"\
  primary\">\n        <span>Angular CRUD</span>\n        <span class=\"example-spacer\"\
  ></span>\n        <button *ngIf=\"loggedIn\" (click)=\"submit('logout')\" mat-icon-button>\n\
  \            <mat-icon>logout</mat-icon>\n        </button>\n    </mat-toolbar>\n\
  </p>\n```\n\n### navbar.component.css\n\n```\n.example-spacer {\n    flex: 1 1 auto;\n\
  }\n```\n\n### navbar.component.ts\n\n```\nexport class NavbarComponent implements\
  \ OnInit{\n    @Output() actionEmitter = new EventEmitter();\n    @Input() loggedIn\
  \ = false;\n    submit(action: string) {\n        this.actionEmitter.emit(action);\n\
  \    }\n}\n```\n\n在前面的代码实现中，我们为我们的 navbar 组件创建了一个 emitter。这将发出我们在 navbar 中触发的 action，并将其传递到我们的\
  \ app 组件中。\n\n最后一步是在注销按钮被点击时在我们的 app 组件中调用 doLogout() 函数。让我们看看如下的代码实现：\n\n### app.component.html\n\
  \n```\n```html\n<app-navbar [loggedIn]=\"url != '/' && !url.includes('login')\"\n\
  (actionEmitter)=\"submit($event)\"></app-navbar>\n<div class=\"container\">\n  \
  \  <router-outlet></router-outlet>\n</div>\n```\n```\n\n### app.component.ts\n\n\
  ```\n```typescript\nexport class AppComponent {\n  title = 'superheroes';\n  url:\
  \ string = \"\";\n  constructor(private authService: AuthenticateService,\n    \
  \          private router: Router){\n    this.getRoute();\n  }\n  submit(action:\
  \ string) {\n    switch (action) {\n      case 'logout':\n        this.authService.doLogout();\n\
  \        break;\n      default:\n        break;\n    }\n  }\n  getRoute() {\n  \
  \  this.router.events.subscribe(data => {\n      if(data instanceof NavigationEnd)\
  \ {\n        this.url = data.url;\n      }\n    });\n  }\n}\n```\n\n\n\n在前面的代码实现中，我们将\
  \ authenticate 服务注入到我们的应用组件中并调用了 doLogout() 函数。如果操作是注销，我们还添加了一个路由变化的监听器来检查我们当前的路由是否在登录或注册页面，如果是，我们将移除导航栏组件上的注销按钮。\n\
  \n我们已经成功为我们的应用实现了用户认证，但在本章的后续内容中我们仍会继续改进此实现。在下一节中，我们将讨论如何在 Angular 应用中保护路由。\n\n\
  ## 保护路由\n\nAngular 的核心特性之一是路由守卫。守卫在我们想要防止未认证直接访问路由或防止用户在意外导航时丢失更改时非常有帮助。\n\n守卫是\
  \ Angular 提供的接口，允许我们通过提供的条件来控制路由的可访问性。这些守卫直接应用于我们想要保护的路由。\n\n让我们来看一下 Angular 提供的一些守卫：\n\
  \n- CanActivate：这是在我们想要阻止访问的路由上实现的。\n- 方法签名：\n\n```\ncanActivate(route:ActivatedRouteSnapshot,\n\
  state:RouterStateSnapshot):Observable<boolean | UrlTree>\n| Promise<boolean | UrlTree>\
  \ | boolean | UrlTree\n```\n\n前面的代码定义了 CanActivate 守卫的签名。该函数接受 ActivatedRouteSnapshot\
  \ 和 RouterStateSnapshot 参数，并返回一个 Observable 或 Promise，其类型可以是 Boolean 或 UrlTree。\n\
  \n- 创建守卫：\n\n```\nexport class AuthGuard implements CanActivate {\nconstructor(private\
  \ auth: AuthService, private router: Router) {}\ncanActivate(route: ActivatedRouteSnapshot,\n\
  state:RouterStateSnapshot): Observable<boolean> |\nPromise<boolean> | boolean {\n\
  // return true permitted in the route, else return\n// false\n}\n}\n```\n\n在前面的代码示例中，我们创建了一个名为\
  \ AuthGuard 的新类。我们还使用 CanActivateChild 守卫实现了它，并为所需逻辑添加了 canActivateChild() 函数。\n\
  \n- 使用守卫：\n\n```\n{\n  path: 'user',\n\n  canActivateChild: [AuthGuard],\n  component:\
  \ UserComponent,\n  children: [\n    { path: ':id', component: ProfileComponent\
  \ },\n    { path: ':id/edit', component: SettingsComponent }\n  ]\n}\n```\n\n在前面的代码示例中，我们在\
  \ user 路径中使用了新创建的 AuthGuard 类，以保护其子路由免受没有有效 JWT 的用户访问，子路由导航到 ProfileComponent 和\
  \ SettingsComponent 组件。\n\n- CanLoad：此守卫用于懒加载模块。CanActivate 守卫只能阻止用户通过路由导航；CanLoad\
  \ 守卫可同时阻止导航到懒加载模块以及下载该模块。\n\n- 方法签名：\n\n```\ncanLoad(route:Route,segments:UrlSegment[]):\n\
  Observable<boolean>|Promise<boolean>|boolean\n```\n\n前面的代码示例定义了 CanLoad 守卫的签名。该函数接受\
  \ Route 和 UrlSegment[] 参数，并返回一个 Observable 或 Promise，其类型可以是 Boolean。\n\n- 创建守卫：\n\
  \n```\nimport { CanLoad, Route, Router } from '@angular/router';\nexport class AuthGuard\
  \ implements CanLoad {\n  constructor(private router: Router) {}\n  canLoad(route:Route,segments:UrlSegment[]):Observable<boolean>|Promise<boolean>|boolean\
  \ {\n    // return true or false based on a condition to load\n    // a module or\
  \ not\n  }\n}\n```\n\n在前面的代码示例中，我们创建了一个名为 AuthGuard 的新类。我们还使用 CanLoad 守卫实现了它，并为所需逻辑添加了\
  \ canLoad() 函数。\n\n使用守卫：\n\n```\n{\n  path: \"hero\",\n  loadChildren: () =>\n \
  \   import(\"./hero/hero.module\").then((m) =>\n      m.AntiHeroModule),\n  canLoad:\
  \ [AuthGuard]\n}\n```\n\n在前面的代码示例中，我们在 hero 路由中使用了新创建的 AuthGuard 类，以防止没有有效 JWT 的用户访问和下载资源。\n\
  \nCanDeactivate：这是一个用于防止用户离开当前路由的守卫。这在填写应用中的表单等场景下很有用，以避免在意外导航时丢失更改。\n\n方法签名：\n\n\
  ```\ncanDeactivate(component: T, currentRoute: ActivatedRouteSnapshot, currentState:\
  \ RouterStateSnapshot, nextState?: RouterStateSnapshot): Observable<boolean|UrlTree>|Promise<boolean|UrlTree>|boolean\
  \ |UrlTree;\n```\n\n前面的代码示例定义了 CanDeactivate 守卫的签名。该函数接受一个泛型组件、ActivatedRouteSnapshot\
  \ 和 RouterStateSnapshot 参数，并返回一个 Observable 或 Promise，其类型可以是 Boolean 或 UrlTree。\n\
  \n创建守卫：\n\n```\n// CanDeactivateGuard service\nimport { Observable } from 'rxjs/Observable';\n\
  import { CanDeactivate, ActivatedRouteSnapshot,\nRouterStateSnapshot } from '@angular/router';\n\
  export interface CanComponentDeactivate {\ncanDeactivate: () => Observable<boolean>\
  \ |\nPromise<boolean> | boolean;\n}\n```\n\n```\nexport class CanDeactivateGuard\
  \ implements CanDeactivate<CanComponentDeactivate> {\n    canDeactivate(component:CanComponentDeactivate,currentRoute:ActivatedRouteSnapshot,\
  \ currentState:RouterStateSnapshot, nextState?: RouterStateSnapshot): Observable<boolean>\
  \ | Promise<boolean> | boolean {\n        return component.canDeactivate();\n  \
  \  }\n}\n```\n\n在前面的实现中，我们创建了一个接口，该接口将在 CanDeactivateGuard 服务的组件中使用：\n\n```\nexport\
  \ class FormComponent implements OnInit, CanComponentDeactivate {\n\ncanDeactivate():\
  \ Observable<boolean> | Promise<boolean> | boolean {\n/* return true or false depends\
  \ on a specific condition if you want to navigate away from this route or not.*/\n\
  }\n}\n```\n\n在前面的代码示例中，我们为组件实现了我们创建的接口。\n\n- 使用守卫：\n\n```\n{ path: ':id/edit', component:\
  \ FormComponent, canDeactivate: [CanDeactivateGuard] }\n```\n\n在前面的代码示例中，我们使用了新创建的\
  \ CanDeactivateGuard 来防止用户根据 canDeactivate() 函数上的应用条件离开 FormComponent。\n\n我们已经了解了可以在应用中使用的不同守卫。现在，让我们在\
  \ Angular 项目中实现它。\n\n## 项目实现\n\n我们需要在应用中应用的第一个守卫是 CanLoad 守卫。这是因为我们希望在没有有效 JWT 时保护\
  \ anti-heroes 路由不被访问。要创建 CanLoad 守卫，执行以下命令：\n\n```\nng g g core/guards/auth\n```\n\
  \n执行命令后，选择 CanLoad 选项以生成新的 AuthGuard 类。这里唯一需要更改的是 canLoad() 函数的实现。我们想要应用的条件是：如果\
  \ JWT 有效，则允许加载路由和模块。\n\n让我们来看一下以下实现：\n\n```\n@Injectable({\n  providedIn: 'root'\n\
  })\nexport class AuthGuard implements CanLoad {\n  constructor(private router: Router,\
  \ private auth: AuthenticateService) {}\n  canLoad(route: Route, segments:UrlSegment[]):\n\
  \    Observable<boolean | UrlTree> | Promise<boolean | UrlTree> | boolean | UrlTree\
  \ {\n    if (!this.auth.isAuthenticated()) {\n      this.router.navigate(['login']);\n\
  \      return false;\n    }\n    return true;\n  }\n}\n```\n\n在前面的代码示例中，我们使用了 isAuthenticated()\
  \ 函数来检查 JWT 是否有效且未过期。如果有效，它将返回 true 并允许我们导航路由。否则，它将重定向我们到登录页面。\n\n最后一步是在 anti-heroes\
  \ 路由中应用 AuthGuard 类；在 app-routing.module.ts 文件中，我们将使用以下内容：\n\n```\nconst routes:\
  \ Routes = [\n  ... other routes here\n  {\n    path: \"anti-heroes\",\n    loadChildren:\
  \ () =>\n      import(\"./anti-hero/anti-hero.module\").then(m => m.AntiHeroModule),\n\
  \    canLoad: [AuthGuard]\n  }\n];\n```\n\n\n\n\n\n我们现在已成功在我们的反英雄路由中应用了 CanLoad\
  \ 守卫。为了测试它是否有效，我们可以尝试删除本地存储中的令牌，这样应该会将我们重定向到登录页面，因为没有有效的 JWT。\n\n我们需要的最后一个路由守卫是\
  \ CanDeactivate 守卫；我们将把此守卫应用到我们的反英雄表单上，以防止用户在离开表单时丢失更改。要创建我们的 CanDeactivate 守卫，我们将执行以下命令：\n\
  \n```\nng g g core/guards/form\n```\n\n执行命令后，选择 CanDeactivate 选项，这将生成一个新的 FormGuard\
  \ 类。我们将向此类添加一个接口，我们将在表单组件中使用它。\n\n让我们看一下以下代码：\n\n```\nexport interface CanComponentDeactivate\
  \ {\n  canDeactivate: () => Observable<boolean> |\n    Promise<boolean> | boolean;\n\
  }\n@Injectable({\n  providedIn: 'root'\n})\nexport class FormGuard implements CanDeactivate<unknown>\
  \ {\n  canDeactivate(\n    component: CanComponentDeactivate,\n    currentRoute:\
  \ ActivatedRouteSnapshot,\n    currentState: RouterStateSnapshot,\n    nextState?:\
  \ RouterStateSnapshot): Observable<boolean |\n      UrlTree> | Promise<boolean |\
  \ UrlTree> | boolean |\n      UrlTree {\n    return component.canDeactivate ?\n\
  \      component.canDeactivate() : true;\n  }\n}\n```\n\n在前面的代码示例中，我们创建了 CanComponentDeactivate\
  \ 接口，表单组件将实现它。这意味着条件将放在组件中而不是守卫中。在 FormComponent 中，我们将添加以下代码：\n\n```\nexport class\
  \ FormComponent implements OnInit,\nCanComponentDeactivate {\n```\n\n```\n... other\
  \ code implementation\ncanDeactivate(): Observable<boolean> | Promise<boolean> |\n\
  \  boolean {\n  const confirmation = window.confirm('Are you sure?');\n  return\
  \ confirmation;\n}\n  ... other code implementation\n}\n```\n\n在前面的代码示例中，我们使用我们创建的\
  \ CanComponentDeactivate 接口实现了 FormComponent；我们添加了一个 window.confirm()，它会弹出一个对话框，询问用户是否要离开当前路由。这是对守卫的简单实现，因为我们也可以添加其他条件，例如如果表单中有更改时才询问这个问题。\n\
  \n最后一步是在 FormComponent 路由中应用守卫。\n\n让我们看一下以下代码：\n\n```\nconst routes: Routes = [\n\
  \  ... other routes\n  {\n    path: \"form\",\n    children: [\n      {\n      \
  \  path: \"\",\n        canDeactivate: [FormGuard],\n        component: FormComponent\n\
  \      },\n      {\n        path: \":id\",\n        canDeactivate: [FormGuard],\n\
  \        component: FormComponent\n      }\n    ]\n  },\n];\n```\n\n一旦我们应用了 CanDeactivate\
  \ 守卫，从反英雄表单导航出去时将弹出一个对话框供用户确认，如图 14.3 所示。\n\n![](img/7c3ddd2e5893c9b5a0220148ed886548_360_0.png)\n\
  \n14.3 – 离开表单时弹出的对话框\n\n我们现在已成功在我们的 Angular 应用中应用了守卫；在下一节中，我们将直接使用 NgRx 状态管理来改进我们对\
  \ API 认证的调用。\n\n## 调用 API\n\n我们在上一节中已经通过直接在组件中调用认证服务创建了用户认证。我们还使用 setItem 函数将生成的\
  \ JWT 存储在本地存储中，这也在我们的登录组件中发生。\n\n我们想要实现的是减少组件的职责，正如我们记得的，我们正在使用 NgRx 状态管理来调用 API，组件的唯一职责是分发\
  \ action，而 NgRx 将完成其余工作。\n\n在本节中，我们将通过使用 NgRx 状态管理的构建块来改进我们的 API 调用。\n\n## 创建 actions\n\
  \n我们需要的第一步是为我们的认证功能创建 actions。我们将在 auth/state 文件夹中创建一个名为 auth.actions.ts 的文件，并将有以下代码：\n\
  \n```\nimport { createAction, props } from '@ngrx/store';\n\nexport enum AuthActions\
  \ {\n  LOGIN = '[AUTH] Login',\n  SET_TOKEN = '[AUTH] Set Token',\n  CREATE_USER\
  \ = '[AUTH] Create User',\n  AUTH_ERROR = '[AUTH] AUTH_ERROR',\n}\nexport const\
  \ setToken = createAction(\n  AuthActions.SET_TOKEN,\n  props<{ token: string }>(),\n\
  );\nexport const setError = createAction(\n  AuthActions.AUTH_ERROR,\n  props<{\
  \ error: any }>(),\n);\n```\n\n在前面的代码中，我们可以看到我们创建了四种 action 类型：LOGIN 类型将用于负责调用登录\
  \ API 的 effect；CREATE_USER 类型将用于负责调用注册 API 的 effect；SET_TOKEN 类型将由 reducer 使用，在登录\
  \ API 成功后将生成的 JWT 设置到 store 中；最后，AUTH_ERROR 类型将用于在登录或注册 API 返回错误时在 store 中设置错误。\n\
  \n## 创建 effects\n\n创建 actions 后，现在我们将创建用于调用登录和注册 API 的 effects。我们将在 auth/state 文件夹中创建一个名为\
  \ auth.effects.ts 的文件，并将有以下实现：\n\n### Login Effect\n\n```\n@Injectable()\n  loginUser$\
  \ = createEffect(() => {\n    return this.actions$.pipe(\n      ofType(AuthActions.LOGIN),\n\
  ```\n\n```\nmergeMap(( (data: {type: string, payload: User}) =>\n    this.authService.login(data.payload)\n\
  \    .pipe(\n        map(data => ({ type: AuthActions.SET_TOKEN,\n            token:\
  \ data.token })),\n        tap(() =>\n            this.router.navigate([\"anti-heroes\"\
  ])),\n        catchError(async (data) => ({ type:\n            AuthActions.AUTH_ERROR,\
  \ error: data.error }))\n    ))\n}, {dispatch: true}\n```\n\n### Register Effect\n\
  \n```\ncreateUser$ = createEffect(() => {\n    return this.actions$.pipe(\n    \
  \    ofType(AuthActions.CREATE_USER),\n        mergeMap(( (data: {type: string,\
  \ payload: User}) =>\n            this.authService.register(data.payload)\n    \
  \        .pipe(\n                tap(() => this.router.navigate([\"login\"])),\n\
  \                catchError(async (data) => ({ type:\n                    AuthActions.AUTH_ERROR,\
  \ error: data.error }))\n            )\n        )\n    }, {dispatch: true}\n);\n\
  ```\n\n在前面的代码中，我们为登录和注册 API 创建了 effects。在 loginUser$ effect 中，一旦登录 API 成功，它将分发 SET_TOKEN\
  \ action 并传递生成的 JWT，并且这也将把我们重定向到反英雄页面。\n\n这是我们在上一节中实现的行为。另一方面，createUser$ effect\
  \ 一旦注册 API 成功，将再次把我们重定向到登录页面。这是一个简单的行为，你可以根据注册成功后需要发生的情况进行自定义。\n\n我们还实现了 AUTH_ERROR\
  \ action，当登录或注册 API 失败时将被调用。\n\n## 创建 reducers\n\n我们需要的下一步是创建 reducers。我们将在 auth/state\
  \ 文件夹中创建一个名为 auth.reducers.ts 的文件，并将有以下实现：\n\n```\nexport interface AuthState {\n\
  \    token: string;\n    error: any\n}\nexport const initialState: AuthState = {\n\
  \    token: \"\",\n    error: null\n}\nexport const authReducer = createReducer(\n\
  \    initialState,\n    on(setToken, (state, { token }) => { return {...state, token}}),\n\
  \    on(setError, (state, { error }) => { return {...state, error}}),\n);\n```\n\
  \n在前面的代码示例中，我们可以看到 AuthState 有两个字段，即 token 和 error。token 字段将在 setToken action 被调用时包含有效的\
  \ JWT，即认证 API 成功时，而 error 字段将在登录或注册 API 失败时包含生成的错误。\n\n## 创建 selectors\n\n创建 reducers\
  \ 后，我们现在将创建我们的 selector。在这种情况下，我们的 selector 很简单，因为我们只需要一个用于 error 字段的 selector。我们将在\
  \ auth/state 文件夹中创建一个名为 auth.selectors.ts 的文件，并将有以下实现：\n\n```\nimport { createSelector,\
  \ createFeatureSelector } from '@ngrx/store';\nimport { AppState } from 'src/app/state/app.state';\n\
  import { AuthState } from './auth.reducers';\nexport const selectAuthState = createFeatureSelector<AuthState>('authState')\n\
  export const selectError = () => createSelector(\n\n\n```\nselectAuthState,\n  \
  \  (state: AuthState) => state.error\n)\n```\n\n在前面的代码示例中，我们为 error 字段创建了一个选择器；我们将需要此选择器在组件中向用户显示错误信息。\n\
  \n## 在本地存储中同步\n\n我们将要实现的下一个功能是在本地存储中同步我们的状态。我们可以通过在应用程序中使用 localStorage.setItem()\
  \ 来实现这一点。然而，这样做将不可维护，并且存储中值的设置会在不同的地方进行。\n\n为了获得更好的实现，我们将使用 ngrx-store-localstorage\
  \ 库。要安装该库，我们将执行以下命令：\n\n```\nnpm install ngrx-store-localstorage --save\n```\n\n\
  成功安装库后，我们应该确定要与本地存储同步的状态。在我们的例子中，我们希望 auth 状态中的 token 字段得到同步。为此，我们在 auth.module.ts\
  \ 中进行以下代码更改：\n\n```\nimport { localStorageSync } from 'ngrx-store-localstorage';\n\
  export function localStorageSyncReducer(reducer: ActionReducer<any>): ActionReducer<any>\
  \ {\n  return localStorageSync({keys: ['token']})(reducer);\n}\nconst metaReducers:\
  \ Array<MetaReducer<any, any>> = [localStorageSyncReducer];\n\n@NgModule({\n  declarations:\
  \ [\n    ... declared components\n  ],\n  imports: [\n    ... other imported modules\n\
  \    StoreModule.forFeature('authState', authReducer, {metaReducers}),\n    EffectsModule.forFeature([AuthEffects]),\n\
  \  ]\n})\n```\n\n在前面的代码中，我们可以看到我们创建了一个专门的 reducer，它调用来自 ngrx-store-localstorage\
  \ 的 localStorageSync，负责在本地存储中添加值。\n\n我们还可以指定要同步的字段，在本例中，我们在 keys 数组中添加了 token。一旦\
  \ token 状态的值发生变化，新值也将被放置在我们的存储中。\n\n## 分发和选择组件\n\n最后一步是分发 action 并为登录和注册组件使用选择器。让我们看一下登录和注册组件的以下代码实现：\n\
  \n### login.component.ts\n\n```\nexport class LoginComponent{\n  error$ = this.store.select(selectError());\n\
  \  errorSub: Subscription | undefined;\n\n  constructor(private store: Store, private\
  \ authService:\n    AuthenticateService, private router: Router,\n    private _snackBar:\
  \ MatSnackBar) {\n    this.checkJWT();\n    this.getError();\n  }\n  submit(data:\
  \ User) {\n    this.store.dispatch({type: AuthActions.LOGIN,\n      payload: data})\n\
  \  }\n  ngOnDestroy(): void {\n    this.errorSub?.unsubscribe();\n  }\n  getError()\
  \ {\n    this.error$.subscribe(data => {\n      if(data) {\n        this._snackBar.open(data.message,\
  \ \"Error\");\n      }\n    })\n  }\n```\n\n```\n}\n... other code implementation\n\
  }\n```\n\n### register.component.ts\n\n```\nexport class RegisterComponent implements\
  \ OnInit, OnDestroy {\n  error$ = this.store.select(selectError());\n  errorSub:\
  \ Subscription | undefined;\n  constructor(private store: Store, private _snackBar:\n\
  \      MatSnackBar) {\n    this.getError();\n  }\n\n  ngOnDestroy(): void {\n  \
  \  this.errorSub?.unsubscribe();\n  }\n  submit(data: User) {\n    this.store.dispatch({type:\
  \ AuthActions.CREATE_USER,\n      payload: data})\n  }\n  getError() {\n    this.errorSub\
  \ = this.error$.subscribe(data => {\n      if(data) {\n        this._snackBar.open(data.message,\
  \ \"Error\");\n      }\n    })\n  }\n  ... other code implementation\n}\n```\n\n\
  我们可以在前面的代码中看到，登录和注册页面几乎具有相同的实现。我们已经移除了 submit 函数中对登录和注册服务的调用，并用 action 的分发替换了它。我们还使用了\
  \ selectError() 选择器来监听 API 是否产生错误。\n\n## 总结\n\n至此，我们已到达本章的结尾；让我们回顾一下你学到的宝贵内容。\n\n\
  我们现在知道如何在 Angular 应用程序中实现用户身份验证，并且我们使用了一个 HTTP 拦截器来拦截 HTTP 请求以转换其头并为 API 调用添加有效的\
  \ JWT。我们还了解了不同的路由守卫，它们允许我们保护路由免受未经授权的访问，或防止在从路由导航离开时意外丢失数据。最后，我们学习了如何通过改进 Angular\
  \ 中身份验证的实现方式来使用 NgRx 状态管理。\n\n下一章将教我们如何使用 Cypress 框架在 Angular 中编写端到端测试。\n"
- "## 15\n\n## 在 Angular 中编写测试\n\n在上一章中，我们学习了如何通过添加用户身份验证、检索用户信息和保护路由来保护 Angular 应用程序。\n\
  \n如果我告诉你，在前端编写测试可以很有趣和令人兴奋呢？本章将向你展示 Cypress E2E，即端到端测试的开发者体验有多好。为什么前端开发者喜欢 Cypress\
  \ 框架？\n\n本章将教你如何编写基本的 Cypress 测试以及如何为测试模拟 HTTP 请求。\n\n在本章中，我们将涵盖以下主题：\n\n- 使用 Cypress\
  \ 入门\n- 编写简单的 Cypress 测试\n- 模拟 HTTP 响应和拦截 HTTP 请求\n\n### 技术要求\n\n以下链接将带你进入本章的完成版本：https://github.com/PacktPublishing/Spring-Boot-and-Angular/tree/main/Chapter-15/superheroes。\n\
  \n## 使用 Cypress 入门\n\n在本节中，你将学习 Cypress 是什么以及如何开始使用它。\n\nCypress 是一个用于测试 Web 应用程序的端到端框架。你可以在\
  \ HTML 标签中编写测试 ID，并断言 HTML 标签是否以你期望的方式呈现。\n\n让我们定义一下端到端是什么意思。端到端是指用户在登陆你的 Web 应用程序后使用你的应用程序的方式，完成登录、注册、结账、查看个人资料、注销、填写表单等任务。\n\
  \n例如，你可以在不同的示例用例或场景中测试或检查你的 Web 应用程序的 UI：\n\n- 登陆页价值主张的句子包含单词 sale\n- 网站某个部分的组件计数是你所期望的\n\
  - 在结账页的篮子中的商品在点击 Clear 按钮后被清空\n- 当 Web 应用程序的 URL 为 domain.com/login 时，存在登录表单\n\n\
  这些场景是 Web 应用程序中需要测试的示例。Cypress 是一个测试框架，你可以在其中编写和运行设置和配置不需要花费太多时间的测试。\n\n现在，让我们看看\
  \ Cypress 如何安装。\n\n## 安装\n\n要开始使用 Cypress，我们必须从 npm 仓库安装它，运行以下命令：\n\n```\nnpm i-D\
  \ cypress @testing-library/cypress\n```\n\n前面的 npm 命令将在 dev 依赖包中安装 Cypress 和 cypress\
  \ 测试库。@testing-library 是 Web 开发中一组常见的测试实用程序，使开发者的生活更轻松\n\n在下一节中，我们将学习必须向 package.json\
  \ 文件的 npm 脚本中添加什么，以便我们可以在本章后面运行测试。\n\n## npm 脚本\n\n为了让我们以后更轻松地运行 Cypress 测试，最好在\
  \ package.json 文件中添加一个新的 npm 脚本，以帮助我们轻松运行命令。在 package.json 文件的 scripts 块中插入以下键/值对：\n\
  \n```\n\"test\": \"npx cypress open\"\n```\n\n前面的键/值对帮助你通过在终端中运行 npm run test 命令来运行测试。同时运行全栈应用程序以及终端中的\
  \ npm run test 命令以启动 Cypress。\n\n一个交互式浏览器应用将打开，你可以在其中运行你的测试。*Figure 15.1* 显示了运行\
  \ `npm run test` 命令后 Cypress 仪表板上显示的欢迎消息。在这里，我们将使用 **E2E Testing**，因此点击该框继续：\n\n\
  ![](img/7c3ddd2e5893c9b5a0220148ed886548_371_0.png)\n\nFigure 15.1 – The Cypress\
  \ dashboard\n\n*Figure 15.2* 显示了将自动添加到你的 Angular 应用程序目录中的文件夹和文件。这些是任何使用 Cypress\
  \ 的 Web 应用程序所必需的。由于我们使用 TypeScript，我们将稍后添加更多内容，但我们稍后再做。现在，只需点击 **Continue** 按钮；你将被带到以下屏幕：\n\
  \n\n\n\n\n## 配置文件\n\n我们向你的项目添加了以下文件：\n\n- `cypress.config.ts` – 用于 E2E 测试的 Cypress\
  \ 配置文件。\n- `cypress/support/e2e.ts` – 在每次 E2E 规范之前捆绑并加载的支持文件。\n- `cypress/support/commands.ts`\
  \ – 用于创建自定义 Cypress 命令和覆盖现有命令的有用支持文件。\n- `cypress/fixtures/example.json` – 添加了一个示例\
  \ fixtures 文件/文件夹。\n\n继续\n\n图 15.2 – 配置文件\n\n图 15.3 显示你可以选择不同的浏览器来运行你的 E2E 测试。你可以从\
  \ Chrome、Microsoft Edge 和 Firefox 中选择。我们将在此停止，因为我们还没有编写任何测试，并且我们仍需要帮助 Cypress 学习\
  \ TypeScript。通过在终端中按 Ctrl + C 停止 Cypress 运行：\n\n选择浏览器\n\n选择你首选的浏览器用于 E2E 测试。\n\n\
  - Chrome v105\n- Edge v105\n- Electron v102\n- Firefox v104\n\n在 Edge 中启动 E2E 测试\n\
  \n切换测试类型\n\n图 15.3 – 选择浏览器\n\n图 15.4 显示了生成的 cypress 文件夹，它们包含内部的其他文件夹，以及用于编辑 Cypress\
  \ 部分默认行为的 cypress.config.ts 文件。我们稍后会讨论 cypress.config.ts 文件：\n\n![](img/7c3ddd2e5893c9b5a0220148ed886548_373_0.png)\n\
  \n图 15.4 – Cypress 文件夹和文件\n\n## Cypress 的 TypeScript\n\n为了帮助 Cypress 理解 TypeScript，我们必须将\
  \ tsconfig.json 文件添加到 cypress 文件夹的根目录。创建一个新文件并将其命名为 tsconfig.json；然后，编写以下配置：\n\n\
  ```json\n{\n  \"extends\": \"../tsconfig.json\",\n  \"compilerOptions\": {\n   \
  \ \"types\": [\"cypress\", \"@testing-library/cypress\"],\n    \"isolatedModules\"\
  : false,\n    \"allowJs\": true,\n    \"experimentalDecorators\": true,\n    \"\
  skipLibCheck\": true\n  },\n  \"include\": [\n    \"./**/*.ts\",\n  ],\n  \"exclude\"\
  : []\n}\n```\n\n前面的代码继承了我们 Angular 应用根目录下的 tsconfig.json 文件。然后，我们将 cypress 和 @testing-library/cypress\
  \ 添加到 tsconfig.json 文件中，这将帮助 Cypress 理解 Cypress 目录中的任何 TypeScript 文件。数组显示我们正在包含目录各层级中的这些\
  \ TypeScript 文件。\n\n现在我们已经为 TypeScript 设置了 Cypress，让我们更新 Angular 应用中的 cypress.config.ts\
  \ 文件。\n\n## 更新 Cypress 配置文件\n\n什么是 Cypress 配置文件？cypress.config.ts 文件用于存储针对环境、超时、文件夹/文件、截图、视频、下载、浏览器、视口等特定于\
  \ Cypress 的任何配置。\n\n你可以通过提供想要添加的任何可选配置来修改 Cypress 的默认行为。因此，使用以下代码更新 cypress.config.ts\
  \ 文件：\n\n```ts\nimport { defineConfig } from \"cypress\";\n\nexport default defineConfig({\n\
  \  e2e: {\n    setupNodeEvents(on, config) {\n      // implement node event listeners\
  \ here\n    },\n    baseUrl: \"http://localhost:4200\",\n    video: false,\n  },\n\
  });\n```\n\n前面的代码配置了 Cypress 的基础 URL，Angular 在此运行。还有一个视频配置，用于禁用端到端测试录制。我们仅使用 baseUrl\
  \ 和 Cypress 配置的 video 属性。\n\n在下一节中，我们将开始编写一些简单的 Cypress 测试，以帮助你建立编写测试的信心，并了解在 Cypress\
  \ 中编写测试是多么容易。\n\n## 编写 Cypress 测试\n\n在本节中，我们将开始编写简单的 Cypress 测试，以了解使用 Cypress 编写测试是多么有趣和容易。我们将通过在身份验证表单的\
  \ HTML 标签中添加测试属性来开始测试。我们将编辑 auth-form.component.html 文件来编写 test-id 属性。以下是 auth-form.component.html\
  \ 行中更改的内容：\n\n```html\n<mat-card-title data-cy=\"auth-title\">{{title}}</mat-card-title>\n\
  ```\n\n你可以在前面的代码中看到我们添加的属性。data-cy 是 Cypress 将用于定位我们想要测试的 HTML 元素的测试 ID 属性。\n\n\
  现在我们添加了第一个测试 ID，让我们进入 cypress 目录中的 e2e 文件夹并创建一个新文件。文件名需要包含 `.cy`。将新文件命名为 `anti-heroes.cy.ts`\
  \ 然后添加以下代码：\n\n```ts\n/// <reference types=\"cypress\"/>\n\ndescribe(\"Anti Heroes\
  \ Page\", () => {\n  // basic test\n  it(\"should display login page\", () => {\n\
  \    cy.visit(\"/\");\n    cy.url().should(\"include\", \"/login\");\n    cy.get(\"\
  [data-cy=auth-title]\").should(\"contain\", \"Login\");\n  });\n});\n```\n\n前面的代码提供了我们测试的第一个描述。首先，我们添加对\
  \ Cypress 类型的引用，以便使用 TypeScript 获得额外的工具。\n\n然后，我们有 describe 函数，用于分组测试。describe 函数有两个参数。第一个参数是一个字符串，它传递\
  \ describe 函数将使用的名称。第二个参数是一个回调函数，将包含 describe 函数下的所有测试。\n\nit 函数也接受一个用于测试名称的字符串和一个用于测试细节的回调函数。第一个\
  \ it 函数测试未通过身份验证的用户是否可以在访问 Angular 应用 URL 的根域时看到登录页面。\n\ncy 是一个对象，你可以在其中链接不同类型的命令。我们使用\
  \ visit 命令，它允许我们在运行测试时编写我们将用于导航到 localhost:4200 的 URL。`cy.url()` 断言 URL 可以在登录子页面上找到。我们还通过\
  \ `data-cy=\"auth-title\"` 属性测试 mat-card-title，该属性在此测试中包含单词 Login。\n\n正如你所见，第一个测试很容易编写。编写测试的设置也很简单。但在运行第一个测试之前，让我们为测试创建一个用户：\n\
  \n![](img/7c3ddd2e5893c9b5a0220148ed886548_376_0.png)\n\n图 15.5 – 用于 E2E 测试的用户（Angular\
  \ 应用登录页面）\n\n在图 15.5 中，我们为 E2E 测试创建一个用户。user@cypress.com 用户名只是一个虚构的电子邮件地址，你不需要使用。你可以使用任何你想要的电子邮件地址。我们将使用\
  \ user@cypress.com 用户登录我们的应用并像真实用户一样使用 Web 应用。\n\n现在，打开你的终端并运行 `npm run test` 命令来运行\
  \ Angular 的 E2E 测试。转到 Cypress 仪表板的 Specs 部分以找到 E2E 规范列表：\n\n![](img/7c3ddd2e5893c9b5a0220148ed886548_377_0.png)\n\
  \n图 15.6 – E2E 规范\n\n图 15.6 显示了用于测试的 E2E 规范文件列表。这里只有一个规范文件；这是我们之前创建的那个。\n\n点击 anti-heroes\
  \ 规范以运行我们创建的测试并查看它是否通过或失败：\n\n![](img/7c3ddd2e5893c9b5a0220148ed886548_377_1.png)\n\
  \n图 15.7 – 通过的测试\n\n图 15.7 显示我们编写的两个断言都通过了。这意味着登录子页面是未通过身份验证的用户在登陆根域页面后被重定向到的页面。通过的测试还告诉我们用户看到的表单标题是\
  \ Login 而不是 Register。\n\n如果你将 `should(\"contain\", \"Login\");` 改为 `should(\"contain\"\
  , \"Register\");`，测试将失败，这表明测试是准确的，并且它不会只是通过我们编写的任何内容。\n\n至此，我们已经使用 Cypress 编写了一个简单的\
  \ E2E 测试，并看到我们的测试正在通过。在下一节中，我们将模拟 HTTP 响应并拦截 Angular 应用发送的 HTTP 请求，这样我们就不再需要后端应用来运行这些测试了。\n\
  \n## 模拟 HTTP 响应和拦截 HTTP 请求\n\n**模拟测试**可以帮助我们隔离和专注于测试，而不是外部依赖的状态或行为。在本节中，我们将模拟服务器的\
  \ HTTP 响应并拦截 Angular 应用的 HTTP 请求以进行测试。我们将拦截 HTTP 请求，以便我们可以向 Angular 发送伪造的响应，而不会污染我们的开发数据库。\n\
  \n我们将首先在 cypress 目录的根目录添加一个新文件。将文件命名为 `global.d.ts`。global.d.ts 文件，也称为全局库，提供了一种在\
  \ TypeScript 代码中全局可用接口和类型的方法。\n\n创建 global.d.ts 文件后，在其中写入以下代码：\n\n```ts\n/// <reference\
  \ types=\"cypress\"/>\n\ndeclare namespace Cypress {\n    interface Chainable {\n\
  \        getCommand(url: string, responseBody: Array<any>):\n            Chainable<any>;\n\
  \        deleteCommand(url: string): Chainable<any>;\n        postCommand(url: string,\
  \ requestBody: any):\n            Chainable<any>;\n    }\n}\n```\n\n前面的代码允许我们使用自定义可链式命令，这将在我们在编写\
  \ cy 后按点时为我们提供 IntelliSense。\n\n现在我们添加了 global.d.ts，让我们安装一个可以生成唯一通用 ID，也称为 UUID\
  \ 的库，并将其用作我们将创建的伪对象的临时 ID 以响应 Angular 的 HTTP 请求。\n\n\n\n\n下面的npm命令将安装一个名为uuid的npm库，帮助我们生成所需的UUID：\n\
  \n```\nnpm i uuid\n```\n\n我们还需要为安装的uuid库安装类型定义：\n\n```\nnpm i -D @types/uuid\n```\n\
  \n上面的npm命令将安装uuid的TypeScript类型。\n\n现在，我们需要一个文件来存放Cypress测试中的fixtures。fixture是对象或数组的固定状态，用作运行测试的基线：\n\
  \n+   1. 进入应用程序中cypress目录下的fixtures文件夹。创建两个JSON文件，分别命名为anti-heroes.json和user.json。\n\
  +   2. 从 https://github.com/PacktPublishing/Spring-Boot-and-Angular/blob/main/Chapter-15/superheroes/cypress/fixtures/anti-heroes.json\
  \ 复制文件内容，粘贴到anti-heroes.json文件中。\n+   3. 接着，从 https://github.com/PacktPublishing/Spring-Boot-and-Angular/blob/main/Chapter-15/superheroes/cypress/fixtures/user.json\
  \ 复制文件内容，粘贴到user.json文件中。\n\n上述JSON对象是我们将在fixtures中使用的对象。我们将把它们用作响应体，以发送模拟响应。\n\n\
  现在，让我们更新cypress目录下support文件夹中的commands.ts文件。使用以下代码：\n\n```\n// @ts-check\n///<reference\
  \ path=\"../global.d.ts\" />\n/// <reference types=\"cypress\"/>\nimport { v4 as\
  \ uuidv4 } from \"uuid\";\nCypress.Commands.add(\"getCommand\", (url: string, responseBody:\
  \ Array<any>) => {\n    cy.intercept(\"GET\", url, {\n        statusCode: 200,\n\
  \        body: responseBody,\n    });\n});\n```\n```\nCypress.Commands.add(\"deleteCommand\"\
  , (url: string) => {\n    cy.intercept(\"DELETE\", url, {\n        statusCode: 200,\n\
  \    });\n});\nCypress.Commands.add(\"postCommand\", (url: string, requestBody:\
  \ any) => {\n    requestBody.id = uuidv4();\n    cy.intercept(\"POST\", url, {\n\
  \        statusCode: 201,\n        body: requestBody,\n    });\n});\n```\n\n上面的代码实现了我们在global.d.ts文件中编写的自定义可链式命令。getCommand、deleteCommand和postCommand需要以字符串形式的URL来拦截任何HTTP请求。这些自定义可链式命令需要一个状态，该状态将是一个fixture。\n\
  \n+   5. 现在，让我们在anti-heroes.cy.ts中编写更多测试。但首先，我们必须为要编写的测试添加更多的测试ID。\n\n转到auth-form.component.html，并用以下代码进行更新：\n\
  \n```\n<mat-card>\n    <mat-card-title\n        data-cy=\"auth-title\">{{title}}</mat-card-title>\n\
  \    <mat-card-content>\n        <form [formGroup]=\"form\"\n            (ngSubmit)=\"\
  submit()\">\n            <p *ngIf=\"error\" class=\"error\">\n                {{\
  \ error }}\n            </p>\n            <p>\n                <mat-form-field>\n\
  \                    <input type=\"text\"\n                        matInput placeholder=\"\
  Username\"\n                        formControlName=\"email\"\n                \
  \        data-cy=\"email\">\n                </mat-form-field>\n```\n```\n</p>\n\
  <p>\n    <mat-form-field>\n        <input type=\"password\"\n            matInput\
  \ placeholder=\"Password\"\n            formControlName=\"password\"\n         \
  \   data-cy=\"password\">\n    </mat-form-field>\n</p>\n<div class=\"button\">\n\
  \    <button type=\"submit\"\n        mat-button data-cy=\"submit-login\">\n   \
  \     {{title}}</button>\n</div>\n<p *ngIf=\"title == 'Login'\" class=\"link\"\n\
  \    [routerLink]=\"['register']\"\n    routerLinkActive=\"router-link-active\"\
  >\n    Create account</p>\n<p *ngIf=\"title == 'Register'\"\n    class=\"link\"\
  \ [routerLink]=\"['']\"\n    routerLinkActive=\"router-link-active\">\n    Sign\
  \ In</p>\n</form>\n</mat-card-content>\n</mat-card>\n```\n\n上述代码包含四个data-cy属性，它们将用作目标选择器。你可以在mat-card-title、inputs和button元素中找到data-cy选择器。\n\
  \n6. 接下来要更新的文件是navbar.component.html。使用以下代码更新该文件：\n\n```\n<p>\n    <mat-toolbar\
  \ color=\"primary\">\n        <span data-cy=\"logo\">Angular CRUD</span>\n    </mat-toolbar>\n\
  </p>\n```\n\n上述代码包含一个data-cy属性，你可以在span元素中找到它。\n\n7. 接下来，我们需要更新anti-hero-list-component.html文件：\n\
  \n```\n<table mat-table [dataSource]=\"antiHeroes\" class=\"mat-elevation-z8\">\n\
