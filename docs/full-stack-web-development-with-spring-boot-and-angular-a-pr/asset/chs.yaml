  \n## Preface\n\nSpring Boot 为 JavaScript 用户提供了一个平台，只需几行代码即可启动应用程序。同时，Angular 是一个基于组件的框架，使构建\
  \ Web 应用的前端变得简单。本书解释了 Spring Boot 和 Angular 如何协同工作，帮助您快速有效地创建全栈应用程序。\n\n在本书中，您将首先探索\
  \ Spring Boot 和 Angular 为何是备受需求的框架，然后由专家解决方案和最佳实践指导您构建自己的 Web 应用程序。关于后端，您将看到 Spring\
  \ Boot 如何通过让 Spring Framework 和 Spring Boot 扩展来承担繁重工作，从而高效地构建应用程序，同时在项目中使用 Spring\
  \ Data JPA 和 Postgres 依赖项将数据保存或持久化到数据库中。对于前端，您将使用 Angular 构建项目架构、构建响应式表单，并添加身份验证以防止恶意用户窃取应用程序数据。\n\
  \n最后，您将看到如何使用 Mockito 测试服务，使用持续集成和持续部署部署应用程序，并将 Spring Boot 和 Angular 集成以创建一个单一包，以便到本书结束时，您将能够构建自己的全栈\
  \ Web 应用程序。\n\n## Who this book is for\n\n本书面向忙碌的 Java Web 开发者和 TypeScript 开发者，他们在开发\
  \ Angular 和 Spring Boot 应用方面经验较少，希望学习构建全栈 Web 应用的最佳实践。\n\n## What this book covers\n\
  \n*第 1 章，Spring Boot 和 Angular – 全面概览*，作为关于 Spring Boot 和 Angular 当前状态的简短回顾，为您提供\
  \ Java Spring Boot 和 Angular Web 开发未来的一个 glimpse。您还将看到 Vue.js 作为应用的稳定性和可靠性，以及编写和维护\
  \ Vue.js 框架的团队。\n\n*第 2 章，设置开发环境*，教您如何设置计算机的开发环境以构建后端和前端 Web 应用程序。我们将转向不同的 IDE 和文本编辑器来编写代码，并确保在继续应用开发之前一切都已设置好。\n\
  \n*第 3 章，进入 Spring Boot*，揭示了 Spring Boot 的内部工作原理以及如何使用 Spring Initializr 启动项目。本章还将教您依赖注入和\
  \ IoC 容器的概念。本章还将讨论 Bean 和注解的工作方式。\n\n*第 4 章，设置数据库和 Spring Data JPA*，帮助您将 Java Spring\
  \ Boot 连接到数据库。本章将描述 Spring Data JPA 以及如何在项目中添加 Spring Data JPA 和 Postgres 依赖项。本章还将展示如何使用配置文件将\
  \ Java Spring Boot 连接到 Postgres 数据库实例。\n\n*第 5 章，使用 Spring 构建 API*，向您展示如何启动和运行 Java\
  \ Spring Boot 应用程序。本章还将展示如何为应用程序添加模型，并在编写路由器和控制器时使用它们。之后，本章将解释如何使用 Redis 进行缓存以提高应用程序的性能。\n\
  \n*第 6 章，使用 OpenAPI 规范记录 API*，涵盖 Java Spring Boot 应用程序 API 的文档部分。本章还将向您展示如何在应用程序中包含\
  \ Swagger UI，以在 API 文档中提供图形界面。\n\n*第 7 章，使用 JWT 添加 Spring Boot 安全*，详细说明 CORS 是什么以及如何在\
  \ Spring Boot 应用程序中添加 CORS 策略。本章描述了 Spring 安全、身份验证和授权。本章还将演示 JSON Web Token 的工作原理以及\
  \ **身份即服务 (IaaS)** 是什么。\n\n*第 8 章，在 Spring Boot 中记录事件*，解释日志是什么以及实现日志的流行包。本章还将教您在哪里保存日志以及对日志做什么。\n\
  \n*第 9 章，在 Spring Boot 中编写测试*，全部关于为 Java Spring Boot 应用程序编写测试。本章描述了 JUnit 和 AssertJ。本章还将教您如何编写测试，如何测试存储库，以及如何使用\
  \ Mockito 测试服务。\n\n*第 10 章，设置我们的 Angular 项目和架构*，重点介绍如何组织功能和模块，如何结构化组件，以及如何添加 Angular\
  \ Material。\n\n*第 11 章，构建响应式表单*，演示如何构建响应式表单、基本表单控件和分组表单控件。本章还将解释如何使用 FormBuilder\
  \ 和验证表单输入。\n\n*第 12 章，使用 NgRx 管理状态*，涵盖复杂应用程序中的状态管理。本章还将介绍 NgRx 以及如何在 Angular 应用程序中设置和使用它。\n\
  \n*第 13 章，使用 NgRx 保存、删除和更新*，描述如何使用 NgRx 删除一项，如何使用 NgRx 添加一项，以及如何使用 NgRx 更新一项。\n\n\
  *第 14 章，在 Angular 中添加身份验证*，探讨如何添加用户登录和注销、检索用户配置文件信息、保护应用程序路由以及调用受保护端点的 API。\n\n\n\
  \n\n\n第 15 章《在 Angular 中编写测试》介绍了如何编写基本的 Cypress 测试以及如何在测试中模拟 HTTP 请求。\n\n第 16 章《使用\
  \ Maven 打包后端和前端》举例说明了如何利用 Maven frontend 插件将 Angular 和 Spring Boot 集成到一个包中。\n\n\
  第 17 章《部署 Spring Boot 和 Angular 应用》描述了 CI/CD 和 GitHub Actions。本章还将向您展示如何为 Spring\
  \ Boot 和 Angular 应用创建 CI 工作流或流水线。\n\n## 如何充分利用本书\n\n您应确保对 HTML、CSS、JavaScript、TypeScript、Java\
  \ 和 REST API 有基本了解。您不需要对上述要求具备中级或高级知识。\n\n| 书中涵盖的软件/硬件 | 操作系统要求 |\n|---|---|\n|\
