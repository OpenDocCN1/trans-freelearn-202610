  \    headerFields: string[] = [];\n\n    ngOnInit(): void {\n        this.getHeaderFields();\n\
  \    }\n    getHeaderFields() {\n        this.headerFields = this.headers.map((data)\
  \ =>\n            data.fieldName);\n    }\n```\n\n```\n```typescript\nthis.headerFields.push(\"\
  actions\");\n}\nselectAntiHero(antiHero: AntHero, action: TableActions) {\n  this.antiHero.emit({antiHero,\
  \ action});\n}\n}\n```\n```\n\n在前面的示例代码中，我们仍然在应用程序中使用相同的变量；保存反英雄列表的 `antiHeroes`\
  \ 变量现在绑定到 `dataSource` 属性，我们还迭代了 `headers` 属性以显示列名及其相关值。最后，我们创建了一个名为 `headerFields`\
