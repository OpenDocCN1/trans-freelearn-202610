  \n## 创建用户控制器\n\n用户的最后一个要求是创建控制器。我们将在带注解的服务下为 findAllUsers()、findUserById()、deleteUserById()、createUser()\
  \ 和 putUser() 创建方法，并使用特定的 HTTP 请求。\n\n让我们看一下以下代码实现：\n\n```\n@AllArgsConstructor\n\
  @RestController\npublic class UserController {\n\nprivate final UserService userService;\n\
  \n@GetMapping(\"/api/v1/users\")\n```\n\n## JWT\n\nJWT 是一种用于通信数据的 URL 安全方法。JWT 可以被视为包含大量信息的\
  \ JSON 对象的加密字符串。它包括一个额外的结构，由使用 JSON 格式的头部负载组成。JWT 可以使用消息认证码 MAC 进行加密或签名。JWT 是通过组合头部和负载\
  \ JSON 创建的，整个令牌使用 Base64-URL 编码。\n\n## 何时使用 JWT\n\nJWT 主要用于无法维护客户端状态的 RESTful Web\
  \ 服务，因为 JWT 包含与用户相关联的一些信息。它可以为每次请求向服务器提供状态信息。JWT 用于需要客户端身份验证和授权的应用程序。\n\n## JWT\
  \ 示例\n\n让我们看一下以下 JWT 示例：\n\n```\neyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZTsi6IlNlaWppIFZpbGxGxhZnJhb\
  \ mNhIiwiaWF0IjoxNTE2MjM5MDIyfQ.uhmdFM4ROwnerVam-zdYojURqrgL7WQRBRj-P8kVv6s\n```\n\
  \n给定的示例中的 JWT 由三部分组成——我们可以看到它是用点 (.) 字符分隔的。第一个字符串是编码的头部，第二个字符串是编码的负载，最后一个字符串是 JWT\
  \ 的签名。\n\n以下块是解码结构的示例：\n\n```\n// Decoded header\n{\n  \"alg\": \"HS256\",\n  \"\
  typ\": \"JWT\"\n}\n// Decoded Payload\n{\n  \"sub\": \"1234567890\",\n  \"name\"\
  : \"Seiji Villafranca\",\n  \"iat\": 1516239022\n}\n// Signature\nHMACSHA256(\n\
  \  base64UrlEncode(header) + \".\" +\n```\n\n```\nbase64UrlEncode(payload),\nsecret-key\n\
  )\n```\n\n我们可以在前面的示例中看到，三部分都是 JSON 对象，头部包含用于签名 JWT 的算法，负载包含可用于定义状态的信息，签名对头部和负载进行编码并附加了密钥。\n\
  \n## JWT 实现\n\n我们已经了解了 JWT 的概念和用途；现在，我们将在 Spring Boot 项目中实现 JWT 生成。我们希望创建一个身份验证端点，当提交有效凭据时将返回有效的\
  \ JWT。\n\n第一步是将 JWT 依赖项添加到我们的 Spring Boot 项目中。\n\n让我们将以下 XML 代码添加到 pom.xml 中：\n\n\
  ```\n<dependency>\n    <groupId>io.jsonwebtoken</groupId>\n    <artifactId>jjwt-impl</artifactId>\n\
  \    <version>0.11.2</version>\n</dependency>\n<dependency>\n    <groupId>io.jsonwebtoken</groupId>\n\
  \    <artifactId>jjwt-jackson</artifactId>\n    <version>0.11.2</version>\n</dependency>\n\
  ```\n\n接下来，我们需要在项目包下创建一个名为 jwt 的包，并在创建后创建名为 controllers、filters、models、services\
  \ 和 util 的包。我们将开始为身份验证端点创建必要的模型。\n\n## 创建身份验证模型\n\n我们需要为身份验证创建三个模型。第一个模型用于请求，下一个用于响应，最后一个包含用户信息并实现\
  \ Spring Security 中的 UserDetails。\n\n对于请求模型，在 models 包下创建一个名为 AuthenticationRequest\
  \ 的新类。模型的实现在以下代码中显示：\n\n```\n@Data\n@NoArgsConstructor\n@AllArgsConstructor\npublic\
  \ class AuthenticationRequest implements Serializable {\n\n    private String email;\n\
  \    private String password;\n}\n```\n\n请求只需要电子邮件地址和密码，因为这些是我们需要验证的凭据。\n\n然后，对于响应模型，创建一个名为\
  \ AuthenticationResponse 的新类；模型的实现在以下代码中显示：\n\n```\n@Data\n@NoArgsConstructor\n\
  @AllArgsConstructor\npublic class AuthenticationResponse implements Serializable\
  \ {\n\n    private String token;\n}\n```\n\n响应模型仅包含令牌；在凭据验证后返回 JWT。\n\n最后，对于用户主体模型，创建一个名为\
  \ UserPrincipal 的新类；模型的实现在以下代码中显示：\n\n```\n@AllArgsConstructor\npublic class UserPrincipal\
  \ implements UserDetails {\n\n    private final UserEntity userEntity;\n\n    @Override\n\
  \    public Collection<? extends GrantedAuthority>\n        getAuthorities() {\n\
  \        return null;\n```\n\n\n\n\n\n```\n\n}\n\n@Override\npublic String getPassword()\
  \ {\n    return null;\n}\n\n@Override\npublic String getUsername() {\n    return\
  \ this.userEntity.getEmail();\n}\n// Code removed for brevity. Please refer using\
  \ the\n// GitHub repo.\n@Override\npublic boolean isEnabled() {\n    return false;\n\
  }\n}\n```\n\n用户主体模型（UserPrincipal）实现了 `UserDetails`，作为我们在 Spring Security 中的自定义用户。我们重写了多个方法，例如\
  \ `getAuthorities()`（获取用户的授权列表）、`isAccountNonLocked()`（检查用户是否被锁定）、`isAccountNonExpired()`（验证用户是否有效且未过期），以及\
  \ `isEnabled()`（检查用户是否处于启用状态）。\n\n## 创建身份验证工具类\n\n我们需要为身份验证创建工具类；这些工具将负责 JWT 的生成、验证、过期检查以及信息提取。这些方法将用于验证我们的令牌。\n\
  \n我们将在 `util` 包下创建一个名为 `JwtUtil` 的类，并使用 `@Service` 注解标注该类。让我们从工具类所需的方法开始。\n\n让我们创建生成有效令牌所需的前两个方法：\n\
  \n```\nprivate String createToken(Map<String, Object> claims, String subject) {\n\
  \    Keys.\n    return Jwts\n        .builder()\n```\n\n```\n.setClaims(claims)\n\
  .setSubject(subject)\n.setIssuedAt(new Date(System.currentTimeMillis()))\n.setExpiration(new\
  \ Date(System.currentTimeMillis() +\n                1000 * 60 * 60 * 10))\n   \
  \ .signWith(SignatureAlgorithm.HS256, SECRET_KEY)\n.compact();\n}\npublic String\
  \ generateToken(UserDetails userDetails) {\n    Map<String, Object> claims = new\
  \ HashMap<>();\n    return createToken(claims, userDetails.getUsername());\n}\n\
  ```\n\n上述实现调用了 JWT 扩展中的几个方法：\n\n- `builder()` 方法：负责构建 JWT。\n- `setClaims()` 方法：设置\
  \ JWT 的声明（claims）。\n- `setSubject()` 方法：设置主题；在此处，该值为用户的电子邮件地址。\n- `setIssuedAt()`\
  \ 方法：设置 JWT 的创建时间。\n- `setExpiration()` 方法：设置 JWT 的过期时间。\n- `signWith()` 方法：使用提供的密钥和算法对\
  \ JWT 进行签名。\n\n接下来需要实现的方法是声明提取。我们将主要使用此方法来获取有用信息，例如令牌的主题和过期时间。\n\n让我们看看下面的代码实现：\n\
  \n```\npublic <T> T extractClaim(String token, Function<Claims, T> claimsResolver)\
  \ {\n    final Claims claims = extractAllClaims(token);\n    return claimsResolver.apply(claims);\n\
  }\n\nprivate Claims extractAllClaims(String token) {\n    return Jwts\n        .parserBuilder()\n\
  \        .setSigningKey(SECRET_KEY)\n```\n\n```\n.build()\n.parseClaimsJws(token)\n\
  .getBody();\n}\n```\n\n`extractAllClaims()` 方法接收令牌，并使用应用程序提供的密钥。我们调用了 `parseClaimsJWS()`\
  \ 方法来从 JWT 中提取声明。\n\n现在，我们将创建一些方法，用于提取并检查令牌是否已过期，以及使用我们已创建的 `extractClaims()` 方法提取用户名。\n\
  \n让我们看看下面的代码实现：\n\n```\npublic Date extractExpiration(String token) {\n    return\
  \ extractClaim(token, Claims::getExpiration);\n}\nprivate Boolean isTokenExpired(String\
  \ token) {\n    return extractExpiration(token).before(new Date());\n}\npublic String\
  \ extractUsername(String token) {\n    return extractClaim(token, Claims::getSubject);\n\
  }\n```\n\n我们使用了 `getExpiration` 和 `getSubject` 内置函数来从声明中获取过期时间和主题。\n\n最后，我们将创建一个方法，用于验证令牌尚未过期，或验证使用令牌的用户是否有效。\n\
  \n让我们看看下面的代码实现：\n\n```\npublic Boolean validateToken(String token,\n           \
  \             UserDetails userDetails) {\n    final String username = extractUsername(token);\n\
  \    return (\n        username.equals(userDetails.getUsername()) &&\n        !isTokenExpired(token)\n\
  \    );\n}\n```\n\n## 创建身份验证服务\n\n现在，我们将为身份验证创建服务。我们知道，服务负责应用程序的逻辑。我们将实现以下方法：使用哈希验证密码是否正确，检查用户是否拥有有效的凭据，并提供一种方法来覆盖默认的身份验证。\n\
  \n第一步是在 `service` 包下创建一个名为 `ApplicationUserDetailsService` 的新类，我们将使用 Spring Security\
  \ 中的 `UserDetailsService` 来实现该类。我们将重写 `loadUserByUsername()` 方法，并执行以下代码：\n\n```\n\
  @Override\npublic UserDetails loadUserByUsername(String email)\n    throws UsernameNotFoundException\
  \ {\n    return new UserPrincipal(\n        userService.searchByEmail(email));\n\
  }\n```\n\n上述代码调用了 `searchByEmail()` 方法，这是我们用于检查用户是否存在的自定义实现，并且我们将用户作为 `UserPrincipal`\
  \ 对象返回。\n\n下一步是创建 `verifyPasswordHash()` 方法，该方法将验证用户的密码。\n\n让我们看看下面的代码实现：\n\n```\n\
  private Boolean verifyPasswordHash(\n    String password,\n    byte[] storedHash,\n\
  \    byte[] storedSalt\n) throws NoSuchAlgorithmException {\n    // Code removed\
  \ for brevity. Please refer to the GitHub\n    // repo\n\n    for (int i = 0; i\
  \ < computedHash.length; i++) {\n        if (computedHash[i] != storedHash[i]) return\
  \ false;\n    }\n\n    // The above for loop is the same as below\n\n    return\
  \ MessageDigest.isEqual(computedHash, storedHash);\n}\n```\n\n我们创建的方法接受密码、存储的盐和用户的哈希值。我们将首先检查\
  \ `storedHash` 的长度是否为 64，以及 `storedSalt` 的大小是否为 128，以验证其是否为 64 字节。然后，我们将使用存储的盐和密码的消息摘要来计算哈希值，最后，我们将通过比较计算出的哈希值和存储的哈希值来检查密码是否匹配。\n\
  \n我们需要实现的最后一个方法是 `authenticate()` 方法。这是我们的身份验证端点将调用的主要方法。\n\n让我们看看下面的代码实现：\n\n```\n\
  public UserEntity authenticate(String email, String password)\nthrows NoSuchAlgorithmException\
  \ {\n    if (\n        email.isEmpty() || password.isEmpty()\n    ) throw new BadCredentialsException(\"\
  Unauthorized\");\n\n    var userEntity = userService.searchByEmail(email);\n\n \
  \   if (userEntity == null) throw new\n        BadCredentialsException(\"Unauthorized\"\
  );\n\n    var verified = verifyPasswordHash(\n        password,\n        userEntity.getStoredHash(),\n\
  \        userEntity.getStoredSalt()\n    );\n\n    if (!verified) throw new\n  \
  \      BadCredentialsException(\"Unauthorized\");\n\n    return userEntity;\n}\n\
  ```\n\n该方法首先使用 `searchByEmail()` 方法检查用户是否存在，并使用我们创建的 `verifyPasswordHash()` 方法检查密码是否有效。\n\
  \n## 创建身份验证控制器\n\n现在，我们将创建身份验证的控制器。这将为我们的登录创建主要端点。第一步是在 `controllers` 包下创建一个名为 `AuthenticateController`\
  \ 的类，接下来，我们将使用以下实现来编写 `authenticate()` 方法：\n\n```\n@RestController\n@AllArgsConstructor\n\
  class AuthenticateController {\n\n    private final AuthenticationManager authenticationManager;\n\
  \    private final JwtUtil jwtTokenUtil;\n    private final ApplicationUserDetailsService\
  \ userDetailsService;\n\n    @RequestMapping(value = \"/authenticate\")\n    @ResponseStatus(HttpStatus.CREATED)\n\
  \    public AuthenticationResponse authenticate(\n        @RequestBody AuthenticationRequest\
  \ req\n\n    ) throws Exception {\n        UserEntity user;\n\n        try {\n\n\
  \            user = userDetailsService.authenticate(\n                req.getEmail(),\
  \ req.getPassword());\n\n        } catch (BadCredentialsException e) {\n       \
  \     throw new Exception(\"Incorrect username or password\", e);\n        }\n \
  \   }\n```\n\n然后，我们通过调用 `userDetailsService` 中的 `loadUserByUsername` 来获取用户的详细信息，但别忘了像这样传入用户的电子邮件地址：\n\
  \n```\nvar userDetails = userDetailsService.loadUserByUsername(user.getEmail());\n\
  \nSystem.out.println(userDetails);\nvar jwt = jwtTokenUtil.generateToken(userDetails);\n\
  ```\n\n\n\n\n\n```\nreturn new AuthenticationResponse(jwt);\n}\n}\n```\n\n`authenticate()`\
  \ 方法接受一个 `AuthenticationRequest` 请求体，其中需要电子邮件地址和密码。我们将使用之前创建的 `service.authenticate()`\
  \ 来检查凭据是否有效。一旦确认，我们就可以使用工具类中的 `generateToken()` 生成令牌并返回一个 `AuthenticationResponse`\
  \ 对象。\n\n## 创建认证过滤器\n\n我们需要完成的最后一步是为我们的认证创建过滤器。我们将使用过滤器来验证每个 HTTP 请求中请求头中的有效 JWT。我们需要确保过滤器对每个请求只被调用一次。我们可以通过使用\
  \ `OncePerRequestFilter` 来实现这一点。我们将使用过滤器扩展我们的过滤器类，以确保过滤器对特定请求只执行一次。\n\n现在，让我们创建我们的认证过滤器；首先，让我们在\
  \ `filters` 包下创建一个名为 `JwtRequestFilter` 的类，并将此类的 `OncePerRequestFilter` 进行扩展，然后我们将重写\
  \ `doFilterInternal()` 方法，该方法具有 `HttpServletRequest`、`HttpServletResponse` 和 `FilterChain`\
  \ 参数。我们还将注入 `ApplicationUserDetailsService` 和 `JwtUtil` 用于凭据和令牌验证。\n\n我们的代码如下所示：\n\
  \n```\n@AllArgsConstructor\n@Component\npublic class JwtRequestFilter extends OncePerRequestFilter\
  \ {\n\n    private final ApplicationUserDetailsService\n        userDetailsService;\n\
  \n    private final JwtUtil jwtUtil;\n\n    @Override\n    protected void doFilterInternal(\n\
  \        HttpServletRequest request,\n        HttpServletResponse response,\n  \
  \      FilterChain chain\n    ) throws ServletException, IOException {\n```\n```\n\
  ```java\n}\n}\n```\n```\n\n现在，对于该方法的实现，我们需要做的第一件事是从请求头中提取 JWT。让我们实现以下代码：\n\n```\n\
  ```java\n//JWT Extraction\nfinal String authorizationHeader =\n    request.getHeader(\"\
  Authorization\");\n\nString username = null;\nString token = null;\n\nif (\n   \
  \ authorizationHeader != null &&\n        authorizationHeader.startsWith(\"Bearer\
  \ \")\n) {\n    token = authorizationHeader.substring(7);\n    username = jwtUtil.extractUsername(token);\n\
  }\n```\n```\n\n前面的代码通过 *authorization* 键从头中检索 JWT，并且当检索到令牌时，我们将提取用户名以检查用户是否存在。\n\
  \n然后，下一步是使用检索到的用户名加载用户详细信息并检查令牌是否有效且尚未过期。如果令牌有效，我们将从用户详细信息和授权用户列表创建一个 `UsernamePasswordAuthenticationToken`。\n\
  \n我们将在我们的安全上下文中设置新的已认证主体；让我们看一下以下代码实现：\n\n```\n```java\n//JWT Extraction section\n\
  // JWT Validation and Creating the new\n// UsernamePasswordAuthenticationToken\n\
  if (\n        username != null &&\n        SecurityContextHolder.getContext()\n\
  \            .getAuthentication() == null\n) {\n        UserDetails userDetails\
  \ =\n```\n```\n```\nthis.userDetailsService\n    .loadUserByUsername(username);\n\
  \nif (jwtUtil.validateToken(token, userDetails)) {\n    var usernamePasswordAuthenticationToken\
  \ =\n        new UsernamePasswordAuthenticationToken(\n            userDetails,\n\
  \            null,\n            userDetails.getAuthorities()\n        );\n    usernamePasswordAuthenticationToken.setDetails(\n\
  \        new WebAuthenticationDetailsSource()\n            .buildDetails(request)\n\
  \    );\n    SecurityContextHolder\n        .getContext()\n        .setAuthentication(\n\
  \            usernamePasswordAuthenticationToken);\n}\n}\nchain.doFilter(request,\
  \ response);\n}\n```\n\n我们已经成功为我们的请求创建了一个过滤器，并且我们的认证端点都已配置完毕。我们需要做的唯一一件事是完成我们的配置。我们希望使用我们的自定义认证修改\
  \ `UserDetailsService`。\n\n为此，我们将返回到我们的 `SecurityConfig` 文件并在我们的 `configure(AuthenticationManagerBuilder\
  \ auth)` 方法上放置以下代码实现：\n\n```\nprivate final ApplicationUserDetailsService userDetailsService;\n\
  \n@Override\nprotected void configure(AuthenticationManagerBuilder auth)\nthrows\
  \ Exception {\n    auth.userDetailsService(userDetailsService);\n}\n```\n\n下一步我们需要添加我们创建的过滤器；在\
  \ `configure (HttpSecurity http)` 方法下，我们将放置以下代码：\n\n```\nprivate final JwtRequestFilter\
  \ jwtFilter;\n\n@Override\nprotected void configure(HttpSecurity http) throws Exception\
  \ {\n    ... Http security configurations\n    http.addFilterBefore(jwtFilter,\n\
  \        UsernamePasswordAuthenticationFilter.class);\n}\n```\n\n现在我们的安全配置已完成，我们的最后一步是为我们的反英雄端点添加认证。向反英雄端点发出请求时需要有效的\
  \ JWT。\n\n为此，我们将使用 `@PreAuthorize(\"isAuthenticated()\")` 注释 `AntiHeroController`\
  \ 以将端点配置为认证过程：\n\n```\n@PreAuthorize(\"isAuthenticated()\")\npublic class AntiHeroController\
  \ {\n... methods\n}\n```\n\n我们已成功在我们的应用程序上实现了 Spring Security 和 JWT；让我们模拟创建的端点。\n\
  \n我们将发送一个 HTTP GET 请求到反英雄控制器以获取所有反英雄的列表：\n\n![](img/7c3ddd2e5893c9b5a0220148ed886548_182_0.png)\n\
  \n图 7.2 – 获取反英雄列表时出现 403 Forbidden\n\n当我们向其中一个反英雄发送示例请求时，这现在将返回 403 错误，因为它需要来自请求头的有效令牌。在这种情况下，我们需要使用\
  \ `/register` 端点创建一个新用户：\n\n![](img/7c3ddd2e5893c9b5a0220148ed886548_183_0.png)\n\
  \n图 7.3 – 用户注册\n\n成功创建用户后，这现在是一个有效凭据，我们可以使用 `/authenticate` 端点登录：\n\n![](img/7c3ddd2e5893c9b5a0220148ed886548_183_1.png)\n\
  \n图 7.4 – 新凭据登录\n\n我们可以看到在前面的示例中，我们的登录是成功的，并且 `/authenticate` 端点返回了一个有效令牌。我们现在可以在请求头中使用该令牌向反英雄端点发送请求：\n\
  \n![](img/7c3ddd2e5893c9b5a0220148ed886548_184_0.png)\n\n图 7.5 – 反英雄端点成功返回列表\n\n\
  我们可以看到在前面的示例中，我们已在授权头中使用了生成的令牌，并且我们收到了 200 响应并返回了反英雄列表。\n\n我们现在已成功为我们的 Spring Boot\
  \ 应用程序使用 Spring Security 创建了自定义认证和授权。在下一节中，我们将讨论与安全相关的另一个主题，称为 IDaaS。\n\n## IDaaS\n\
  \n在上一节中，我们使用 Spring Security 创建了自定义登录认证。我们利用了 Spring Security 的一些功能，并使用 JWT 来存储用户状态和验证凭据。然而，这个示例不足以可靠和安全地为我们的应用程序实现认证。\n\
  \n如今，大型和企业应用程序需要多种安全功能来防止可能发生的漏洞。这些功能可以包括架构和\n其他服务的实现，例如 SSO 和 **多因素认证 (MFA)**。这些功能可能很麻烦，并且可能需要多个冲刺来修改，从而导致开发时间更长。这就是\
  \ IDaaS 派上用场的地方。\n\nIDaaS 是一种交付模型，允许用户从云中连接、认证和使用身份管理服务。IDaaS 有助于加快开发过程，因为所有认证和授权流程都在后台提供。\n\
  \n它通常被大型和企业应用程序使用，因为它提供的优势和功能。IDaaS 系统利用云计算的力量来处理 **身份访问管理 (IAM)**，确保正确的用户访问资源。这非常有帮助，因为公司无需担心安全和\
  \ IAM 责任，而这些责任由于网络安全威胁的适应而要求很高。\n\n## IDaaS 类型\n\n市场上有多几种 IDaaS 可用；一些提供商仅向客户提供目录，其他提供商提供多套功能，包括\
  \ SSO 和 MFA，但我们将 IDaaS 分为两类：\n\n- 基础 IDaaS\n- 企业 IDaaS\n\n### 基础 IDaaS\n\n中小型企业通常使用基础\
  \ IDaaS。它通常提供 SSO 和 MFA 以及用于存储凭据的云目录。\n\n基础 IDaaS 提供商还打包了更简单的界面，使用户能够处理配置和管理任务。\n\
  \n### 企业 IDaaS\n\n与基础 IDaaS 相比，企业 IDaaS 更复杂，并被大型和企业企业使用。这通常用于扩展组织的 IAM 基础设施并为 Web、移动和\
  \ API 环境提供访问管理。\n\nIDaaS 应具备的五个要求：\n\n- **SSO：** 使用单次认证让用户能够访问所有平台和应用程序的能力\n- **MFA：**\
  \ 增加安全层，要求用户出示两份有效证据来证明其身份\n- **云目录：** 提供可存储数据和凭据的云目录\n- **访问安全：** 用于应用程序的基于策略的管理以提高安全性\n\
  \n\n\n\n- **预配置（Provisioning）**：提供自动化在应用程序与服务提供商之间交换用户身份的能力，使用**跨域身份管理系统（SCIM）**。\n\
  \n这些是 IDaaS 所需的五个特性。\n\n如果你想知道有哪些可以使用的 IDaaS 示例，以下是一些服务提供商：\n\n- **Google Cloud\
  \ Identity**：Google Cloud Identity 为用户提供广泛的安全功能，以实现身份验证、访问管理和授权。它是一个企业级 IDaaS，具有多项安全功能，例如\
  \ SSO、MFA、自动化用户配置和上下文感知访问。\n\n要了解更多关于 Google Cloud Identity 的信息，可以访问 https://cloud.google.com/identity。\n\
  \n- **Okta Workforce Identity**：Okta 是市场上顶级的 IDaaS 提供商之一。它也是一个企业级 IDaaS 提供商，拥有多项基本和高级功能，例如\
  \ SSO、MFA、通用目录、B2B 集成和 API 访问管理。\n\nOkta 和 Auth0 在 2021 年左右联手，提供身份平台和解决方案，例如通用登录、免密码身份验证和机器对机器通信。\n\
  \n要了解更多关于 Auth0 和 Okta 的信息，可以访问以下链接：https://auth0.com/ 和 https://www.okta.com/workforce-identity/。\n\
  \n- **Azure Active Directory**：与其他提供商一样，Azure Active Directory 也是一个企业级 IDaaS 解决方案。它为用户提供广泛的安全解决方案，具备多种功能，例如身份治理、统一身份管理和免密码身份验证，而且最棒的是，它有一个可免费使用的基础层级。\n\
  \n要了解更多关于 Azure Active Directory 的信息，可以访问 https://azure.microsoft.com/en-us/services/active-directory/。\n\
  \n## 小结\n\n至此，我们已到达本章结尾。让我们回顾一下你所学的有价值的内容。你已经了解了 CORS 的概念和重要性，以及它如何为访问资源提供安全性。我们讨论了在\
  \ Spring Boot 应用程序中实现 CORS 的不同方式，即方法级别、控制器级别，以及两种方式的组合。\n\n我们还学习了 Spring Security\
  \ 的概念和特性，并讨论了在应用程序中实现自定义身份验证和授权。最后，我们还学习了 IDaaS，这是一种允许用户从云端连接、认证并使用身份管理服务的交付模式。\n\
  \n在下一章中，我们将学习如何将事件记录器集成到我们的 Spring Boot 应用程序中。\n"
- "## 在 Spring Boot 中记录事件\n\n在上一章中，我们讨论了**跨域资源共享（CORS）**在保护应用程序方面的概念、特性和实现。我们还学习了**JSON\
  \ Web 令牌（JWT）**，以及如何通过创建身份验证端点来生成令牌。\n\n本章将重点介绍在 Spring Boot 应用程序中记录事件。我们将讨论用于日志记录和配置\
  \ Spring Boot 的流行软件包、日志保存位置，以及在开发应用程序时如何处理日志。\n\n在本章中，我们将涵盖以下主题：\n\n- 开始使用 SLF4J\
  \ 和 Log4j2\n- 设置 SLF4J 和 Log4j2\n- 使用日志\n\n### 技术要求\n\n本章代码的最终版本可参见以下链接：https://github.com/PacktPublishing/Spring-Boot-and-Angular/tree/main/Chapter-08/superheroes。\n\
  \n### 开始使用 SLF4J 和 Log4j2\n\n**日志记录**被认为是开发应用程序最重要的方面之一。它的重要性往往被低估，更糟糕的是，我们忘记了将其应用到应用程序中。\n\
  \n事件日志记录在大多数科技行业中使用，尤其是那些提供企业应用程序的行业。它按照特定标准应用，以避免复杂的调试，并让我们更容易理解所阅读的代码。编写良好且结构化的日志可以使开发人员受益，尤其是在维护或调试另一位开发人员的代码时。记录可以加快调试过程，而不是费力地搜索错误，它会提供错误发生的位置和原因，以及应用程序中发生了什么的详细信息。\n\
  \n随着语言和框架的改进，日志记录也在不断发展；在后端开发中，已经开发了多个日志框架来提供更灵活的日志记录能力。我们将讨论的一些示例框架是用于 Java Spring\
  \ Boot 的 SLF4J 和 Log4j2。在继续之前，让我们讨论日志框架的特性。\n\n### 日志框架的特性\n\n日志框架包含以下三个特性，用于我们在应用程序中显示和捕获事件：\n\
  \n- **记录器（Logger）**：获取消息和元数据\n- **格式化器（Formatter）**：格式化从记录器检索到的消息\n- **处理器（Handler）**：负责在调试控制台中打印消息，或为开发人员将它们插入数据库\n\
  \n日志框架还显示不同严重级别的消息，使开发人员能够快速识别发生了哪个事件。日志框架中的严重级别如下：\n\n- **致命（FATAL）**：级别 1；被认为是可能导致应用程序暂停或终止的关键问题\n\
  - **错误（ERROR）**：应用程序中的运行时错误\n- **警告（WARNING）**：通常显示已弃用 API 的日志\n- **信息（INFO）**：显示应用程序运行时事件的日志\n\
  - **调试（DEBUG）**：显示应用程序流程信息的日志\n- **跟踪（TRACE）**：显示应用程序流程更详细信息的日志\n\n### 使用 SLF4J\
  \ 记录日志\n\n在 Java 中使用的流行日志框架之一是**Java 简单日志门面（Simple Logging Façade for Java）**，即\
  \ **SLF4J**。它是使用最广泛的框架之一，因为它允许用户仅使用一个依赖项即可使用任何日志框架，例如 Log4j、Logback、`java.util.logging`\
  \ 包或 Java 自己的日志引擎 JUL。这意味着我们可以根据需要从一个日志框架切换到另一个日志框架。\n\n使用 SLF4J 有几个优点：\n\n- SLF4J\
  \ 使我们能够在运行时或部署时从一个框架切换到另一个框架。\n- SLF4J 有一个迁移工具，允许我们使用 Java 类库将现有项目从 Log4j 迁移到 SLF4J。\n\
  - SLF4J 支持参数化日志消息，以便为我们的日志绑定动态值。\n- SLF4J 将应用程序与日志框架解耦。在开发应用程序时，我们无需担心正在使用哪个日志框架。\n\
  \n### SLF4J 的方法和类\n\nSLF4J 提供了多个类和方法来显示带有严重级别的消息、分析执行时间，或直接返回记录器实例。让我们讨论这些提供的方法和类。\n\
  \n### Logger 接口\n\nLogger 接口主要用于显示带有严重级别的消息或日志。它也是 SLF4J API 的入口点。\n\n- `void debug(String\
  \ message)`：在 **DEBUG** 级别记录消息\n- `void error(String message)`：在 **ERROR** 级别记录消息\n\
  - `void info(String message)`：在 **INFO** 级别记录消息\n- `void trace(String message)`：在\
  \ **TRACE** 级别记录消息\n- `void warn(String message)`：在 **WARN** 级别记录消息\n\n### LoggerFactory\
  \ 类\n\nLoggerFactory 类是 SLF4J 的实用类，通常用于使用 JUL 和 Log4j 等框架创建记录器。\n\nLogger getLogger(String\
  \ name) 生成具有指定名称的记录器对象。以下示例使用了 getLogger() 方法：\n\n```\nprivate static final org.slf4j.Logger\
  \ log = org.slf4j.LoggerFactory.getLogger(LogClass.class);\n```\n\n### Profiler\
  \ 类\n\nProfiler 类主要用于识别应用程序中特定任务的执行时间，也被称为**简易分析器（poor man's profiler）**。\n\n可以使用多种方法：\n\
  \n- `void start(string name)` 创建一个具有特定名称的新子秒表，并停止之前创建的秒表。\n- `TimeInstrument stop()`\
  \ 停止最近创建的子秒表和全局秒表，并返回当前执行时间。\n\n\n\n\n\n- `void log()` 使用记录器记录当前时间仪器的详细信息。\n- `void\
  \ print()` 打印当前时间仪器的详细信息。\n\n## SLF4J 的特性\n\nSLF4J 有多个特性使其日志在调试时更有帮助。它提供了参数化日志的支持，允许我们在消息中显示动态值。另一个特性是分析概要，它常用于衡量应用程序中特定任务的内存和执行时间等不同属性。\n\
  \n让我们讨论每个特性的概念和实现。\n\n## 参数化日志\n\n要在 SLF4J 中使用参数化日志，我们将在消息中包含占位符 {}，以便在该位置传递值。\n\
  \n让我们看一下以下示例：\n\n```\npublic class LoggerExample {\n    public static void main(String[]\
  \ args) {\n\n        //Creating the Logger object\n        Logger logger =\n   \
  \         LoggerFactory.getLogger(LoggerExample.class);\n        String name = \"\
  seiji\";\n\n        //Logger using info level\n        logger.info(\"Hello {}, here\
  \ is your log\", name);\n    }\n}\n```\n\n在前面的示例中，我们在消息中创建了一个参数来显示 name 变量的值。一旦我们执行应用程序，输出将如下所示：\n\
  \n```\nINFO: Hello seiji, here is your log\n```\n\n参数化日志也支持消息中的多个参数，如以下示例所示：\n\n\
  ```\npublic class LoggerExample {\n    public static void main(String[] args) {\n\
  \n        //Creating the Logger object\n```\n\n4. **打印仪器的内容：** 我们执行 print() 方法以显示\
  \ Time 仪器的内容和信息。\n\n现在我们已经学习了 SLF4J 的概念、特性和优点，我们将讨论一个名为 Log4j2 的框架。\n\n## 使用 Log4j2\
  \ 进行日志记录\n\n**Log4j2** 是与 Java 一起使用的最常见的日志框架之一。由于 SLF4J 是日志框架的抽象，因此 Log4j2 可以与 SLF4J\
  \ 一起使用。Log4j2 非常灵活，并提供不同的方式来存储日志信息以供调试；它还支持异步日志记录并以严重性级别显示日志，以便快速识别消息的重要性。\n\n让我们讨论\
  \ Log4j2 的以下特性：\n\n- Log4j2 Logger\n- Log4j2 Appenders\n- Log4j2 Layouts\n- Log4j2\
  \ Markers\n- Log4j2 Filters\n\n## Log4j2 Logger\n\n**Logger** 是应用程序用于创建 LogRecord\
  \ 实例的主要特性。这意味着记录器负责分派消息。要创建 Log4j2 Logger，我们只需要以下代码：\n\n```\nLogger log = LogManager.getLogger(ExampleClass.class);\n\
  ```\n\n创建新的 Logger 后，我们现在可以使用它来调用多个方法，例如 info()，以分派消息。\n\n## Log4j2 Appenders\n\n\
  **Appenders** 负责放置由 Logger 分发的日志。在 Log4j2 中，有大量 Appenders 帮助我们决定在哪里存储日志。\n\n以下是\
  \ Log4j2 中可用的一些 Appenders：\n\n- ConsoleAppender: 将日志写入控制台（System.out 或 System.err）。这是默认的\
  \ Appender。\n- FileAppender: 使用 FileManager 将日志写入文件。\n- **JDBCAppender**: 使用 JDBC\
  \ 驱动程序将日志写入数据库。\n- **HTTPAppender**: 将日志写入特定的 HTTP 端点。\n- **KafkaAppender**: 将日志写入\
  \ Apache Kafka。\n- **AsyncAppender**: 封装另一个 Appender 并使用另一个线程写入日志，使其成为异步日志记录。\n\
  - **SyslogAppender**: 将日志写入 syslog 目标。\n\n您可以在以下链接访问 Log4j2 文档以了解其他可用的 Appenders：`https://logging.apache.org/log4j/2.x/manual/appenders.html`。\n\
  \n## Log4j2 Layouts\n\nAppender 使用 **Layouts** 来格式化 LogEvent 的输出。Log4j2 有不同的 Layouts\
  \ 可供选择来格式化我们的日志：\n\n- **Pattern**: Log4j2 使用的字符串模式的默认 Layout 来显示日志。例如，`%d{HH:mm:ss}\
  \ %msg%n;` 模式将给出以下结果：\n\n```\n14:25:30 Example log message\n```\n\n- **CSV**: 用于生成\
  \ CSV 格式日志的 Layout。\n- **HTML**: 用于生成 HTML 格式日志的 Layout。\n- **JSON**: 用于生成 JSON\
  \ 格式日志的 Layout。\n- **XML**: 用于生成 XML 格式日志的 Layout。\n- **YAML**: 用于生成 YML 格式日志的 Layout。\n\
  - **Syslog**: 用于生成 syslog 兼容格式日志的 Layout。\n- **Serialized**: 使用 Java 序列化将日志序列化为字节数组。\n\
  \n## Log4j2 Markers\n\n**Markers** 是通常用于标记单个日志语句以确定我们是否需要对特定日志执行某些操作的<|message|>。例如，我们可以使用\
  \ IMPORTANT Marker 标记单个日志语句，这可以指示 Appender 需要将日志存储在不同的目标中。\n\n让我们看一下如何创建和使用 Markers\
  \ 的示例：\n\n```\npublic class Log4j2Marker {\n    private static Logger LOGGER =\n\
  LoggerFactory.getLogger(Log4j2Marker.class);\nprivate static final Marker IMPORTANT\
  \ =\n    MarkerFactory.getMarker(\"IMPORTANT\");\npublic static void main(String[]\
  \ args) {\n    LOGGER.info(\"Message without a marker\");\n    LOGGER.info(IMPORTANT,\"\
  Message with marker\"\n}\n}\n```\n\n在前面的示例中，我们可以使用 MarkerFactory.getMarker() 方法创建一个新的\
  \ Marker。要使用新的 Marker，我们可以将其应用于特定的记录器，以指示对重要事件需要采取特定操作。\n\n## Log4j2 Filters\n\n\
  Log4j2 Filters 是用于显示记录器的另一个有价值的特性。这使我们能够根据给定条件控制我们想要说或发布的日日志事件。在执行 Filter 时，我们可以将其设置为\
  \ ACCEPT、DENY 或 NEUTRAL 值。以下是我们可用于显示记录器的一些 Filters：\n\n- **Threshold**: 使用严重性级别对日志事件进行过滤\n\
  - **Time**: 使用给定时间范围对日志事件进行过滤\n- **Regex**: 基于给定的正则表达式模式过滤日志事件\n- **Marker**: 基于给定的\
  \ Marker 过滤日志事件\n- **Composite**: 提供组合多个过滤器的机制\n- **Dynamic Threshold**: 使用严重性级别并包含附加属性对日志事件进行过滤\n\
  \n在以下部分，我们将在项目中配置日志框架。\n\n## 设置 SLF4J 和 Log4j2\n\n我们现在将在 Spring Boot 应用程序中实现多个日志框架，包括\
  \ **Logback** 和 **Log4j2**。请记住 SLF4J 已经包含在内。\n\n## 配置 Logback\n\n**Logback** 是 Spring\
  \ 应用程序使用的默认记录器，因此使用它无需安装依赖项。`spring-boot-starter-logging` 依赖项在我们创建 Spring Boot 应用程序时已包含在内。我们需要采取的第一步是制作\
  \ Logback 配置文件。\n\n在我们的项目中，在 `resources` 文件夹下，我们将添加 `logback-spring.xml` 文件。这就是我们放置\
  \ Logback 配置的地方。以下是一个示例配置：\n\n```\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n\
  <configuration>\n\n    <property name=\"LOGS\" value=\"./logs\" />\n    <!--Please\
  \ refer to the logback-spring.xml of\n    the GitHub repo. Thank you. -->\n    <!--\
  \ LOG everything at INFO level -->\n    <root level=\"info\">\n        <appender-ref\
  \ ref=\"RollingFile\" />\n        <appender-ref ref=\"Console\" />\n    </root>\n\
  \n    <logger name=\"com.example\" level=\"trace\"\n        additivity=\"false\"\
  >\n        <appender-ref ref=\"RollingFile\" />\n        <appender-ref ref=\"Console\"\
  \ />\n    </logger>\n\n</configuration>\n```\n\n在前面的 XML 中，定义了多个配置来格式化我们的日志事件。我们创建了两个\
  \ Appenders - `Console` 和 `RollingFile`。配置两个 appender 标签将创建 System.out 和文件输出中的日志。\n\
  \n我们还使用了一个模式来修改日志显示的外观和格式。在此示例中，我们使用了 `%black(%d{ISO8601}) %highlight(%-5level)\
  \ [%blue(%t)] %yellow(%C{1.}): %msg%n%throwable` 模式在 System.Out 中显示日志。它以黑色显示日期，以高亮显示严重性级别，以蓝色显示线程名称，以黄色显示类名，并显示分配给日志的消息。\n\
  \n\n\n\n\n成功配置 Logback 后，我们可以运行应用程序并在控制台中看到日志：\n\n```\n2022-03-29 12:04:06,487 INFO\
