  \ Angular 项目的默认页面：\n\n![](img/7c3ddd2e5893c9b5a0220148ed886548_233_0.png)\n\nFigure\
  \ 10.4 – Angular default page\n\n我们已成功在本地配置并启动了 Angular 应用程序。现在，让我们讨论构建应用程序时将使用的概念。\n\
  \n## Angular features\n\nAngular 框架是一个基于组件的框架，允许我们开发可重用的组件以促进代码的可重用性和可维护性。它提供了许多功能，使我们的前端开发更加强大。在本节中，我们将讨论\
  \ Angular 的基本特性和基础知识，它们是其构建块；请注意，我们不会在这里讨论所有功能，因为我们将更侧重于项目的组织。\n\n要了解更多关于特性的信息，您可以访问\
  \ Angular 的官方文档：https://angular.io/start。\n\n### Components\n\n组件是 Angular 中的主要构建块。它们负责定义视图的行为和外观。组件使用\
  \ @Component 装饰器进行注解，该装饰器分配多种类型的元数据，描述组件的 HTML、CSS 和选择器。\n\n以下是生成组件的命令：\n\n```\n\
  ng generate component <component-name>\nng g c <component-name>\n```\n\n以下是一个组件的代码示例：\n\
  \n```\nimport { Component } from '@angular/core';\n\n@Component({\n  selector: 'app-root',\n\
  \  templateUrl: './app.component.html',\n  styleUrls: ['./app.component.scss']\n\
  })\nexport class AppComponent {\n  title = 'superheroes';\n}\n```\n\n组件具有一个称为数据绑定的功能，允许我们将数据传递到视图中。数据绑定可用于向用户显示值、响应用户事件以及修改样式。Angular\
  \ 绑定分为两组：\n\n- One-way binding\n- Two-way binding\n\n### One-way binding\n\n顾名思义，这里的数据只在一个方向流动。它可以从组件到视图或反之亦然。\n\
  \n在 Angular 中实现单向绑定的方法有几种，最常见的两种方法是使用插值和属性绑定。\n\n#### Interpolation\n\n**Interpolation**\
  \ 是一种单向绑定技术，允许我们在 HTML 中的字符串字面量中显示表达式。插值使用 {{ }}（双大括号）在 HTML 代码中表示表达式。\n\n让我们看一下以下示例代码：\n\
  \n```\n// app.component.ts\nexport class AppComponent {\n    title = 'superheroes';\n\
  }\n\n<!--app.component.html -->\n<!-- INTERPOLATE TITLE -->\n<span> Title: {{title}}\
  \ </span>\n```\n\n在前面的示例中，我们使用插值在视图中显示 title 变量的值。使用插值，我们还可以在模板表达式中使用运算符。\n\n####\
  \ Property binding\n\n**Property binding** 允许我们在组件中绑定 HTML 元素属性。由于我们绑定了 HTML 元素属性，当绑定值发生变化时，视图也会发生变化。我们可以绑定到\
  \ HTML 元素属性，如 class、href、disabled 和 src。\n\n让我们看一下如何使用属性绑定的示例代码：\n\n```\n// app.component.ts\n\
  export class AppComponent {\n    isDisabled = true;\n}\n\n<!--app.component.html\
  \ -->\n<button [disabled]=\"isDisabled\">Can't be clicked</button>\n```\n\n在前面的示例中，我们将\
  \ isDisabled 变量绑定到按钮的 disabled 属性。由于我们将 isDisabled 的值设置为 true，按钮将被禁用。\n\n### Two-way\
  \ binding\n\n**Two-way binding** 是一种双向数据流。模型所做的任何更改都会同时反映在视图中，视图中的任何修改都会更新到组件中。双向数据绑定有助于处理表单，因为我们希望模型在表单值更新时得到更新，反之亦然。\n\
  \n要实现双向绑定，使用 ngModel 指令。\n\n#### ngModel\n\nngModel 是一个用于在 Angular 中实现双向绑定的指令。它属于\
  \ @angular/forms 中的 Forms 模块。ngModel 一旦绑定到输入字段或其他表单元素，就会为该元素提供属性绑定和事件绑定。让我们看一下以下示例代码：\n\
  \n```\n// app.component.ts\nexport class AppComponent {\n  model = 'seiji';\n}\n\
  \n<!--app.component.html -->\n<input [(ngModel)]=\"model\"/>\n```\n\n在前面的示例代码中，我们使用\
  \ ngModel 指令将 model 值绑定到输入元素。这种语法也被称为香蕉盒，它用方括号和圆括号将 ngModel 包裹起来。该指令将使用属性绑定将模型的值与输入字段绑定，并利用\
  \ ngModelChange 监听输入值变化。\n\n### Directives\n\n**Directives** 是 Angular 的一个功能，帮助我们操作\
  \ **Document Object Model (DOM)**。我们可以修改 DOM 元素的布局、行为和视图。指令分为三类：**components** 是其中一类，另外两类是\
  \ **attribute** 和 **structural** 指令。\n\n#### Structural directives\n\n**Structural\
  \ directives** 是可以修改 DOM 布局的指令，通过添加、更新或删除元素，下面列出了 Angular 中的一些结构指令：\n\n- *ngIf:\
  \ 一个用于根据条件在 DOM 中添加或删除元素的指令：\n\n```\n<div *ngIf=\"condition\">Will show if the condition\
  \ is true</div>\n```\n\n- *ngFor: 一个用于从特定列表中迭代的项目重复 HTML 元素的指令：\n\n```\n// this\
  \ will display all the users for each row\n<tr *ngFor=\"let user of users;\">\n\
  \    <td>{{user.firstName }}</td>\n    <td>{{user.lastName}}</td>\n</tr>\n```\n\n\
  - *ngSwitch: 一个允许我们使用 switch case 机制添加或删除 HTML 元素的指令。如果提供的表达式匹配，HTML 元素将被显示：\n\n\
  ```\n//evaluates the hero variable and displays the name of\nthe hero base on its\
  \ value\n<div [ngSwitch]=\"hero\">\n    <div *ngSwitchCase=\"'Dr. Strange'\">\n\
  \        Stephen Strange</div>\n    <div *ngSwitchCase=\"'Hawkeye'\">Clint Barton</div>\n\
  \    <div *ngSwitchCase=\"'Hulk'\">Bruce Banner</div>\n</div>\n```\n\n#### Attribute\
  \ directives\n\n属性指令是用于更改或修改元素外观或行为的指令。与结构指令相比，属性指令不能在 DOM 中添加或删除元素。\n\n以下是 Angular\
  \ 中一些属性指令：\n\n- ngClass: 一个用于向 HTML 元素添加 CSS 类或从中移除的指令；这使我们能够动态更改元素的外观：\n\n```\n\
  //adds an error class on the input element if the\n//control value is invalid\n\
  <input type=\"text\" [ngClass]=\"control.isInvalid ?\n'error': ''\" />\n```\n\n\
  - ngStyle: 一个允许我们更改 HTML 元素样式的指令：\n\n```\n// the color of the element will base\
  \ on the value of\n// the color variable\n<div [ngStyle]=\"{'color': color}\"> Angular\
  \ Framework </\ndiv>\n```\n\n\n\n\n## 模块\n\n**模块**是 Angular 框架的基本特性之一。随着我们的应用变得越来越复杂，它将由大量组件、指令和服务组成的大型代码块构成。这将影响应用代码库的可维护性。Angular\
  \ 框架提供了一种组织和分组代码块的方式，称为模块。\n\nAngular 框架中的模块帮助我们开发应用，并促进关注点分离。它们使我们能够根据功能对代码块进行分类和组织。Angular\
  \ 本身也是使用模块构建的；`@angular/core` 框架是主要的 Angular 模块，它提供了 Angular 的核心功能和服务。\n\n### 创建模块\n\
  \n我们将使用 `@NgModule` 装饰器来创建一个模块。它由多种类型的元数据组成，这些元数据使我们能够定义所创建模块中包含的组件、服务、管道和其他模块。\n\
  \n下面的示例代码展示了模块可用的属性：\n\n```\n@NgModule({\n  declarations: [],\n  imports: [],\n\
  \  providers: [],\n  exports: [],\n  bootstrap: [],\n  entrycomponents: []\n})\n\
  ```\n\n现在让我们讨论每个属性的功能：\n\n- **声明（Declarations）**：这是放置应用组件、指令和管道的地方。请记住，组件、指令和管道必须只在一个模块中声明。\n\
  - **提供者（Providers）**：这是放置服务的地方，以便它们可用于依赖注入。\n- **导入（Imports）**：这是放置应用中的一个或多个其他模块的地方。一旦我们导入某个特定模块，导入模块中的所有组件、管道和指令都可以使用。\n\
  - **导出（Exports）**：这是放置组件、指令和管道的地方，以便在导入后可供其他模块使用。\n- **引导（Bootstrap）**：这是放置模块主组件的地方。Bootstrap\
  \ 属性主要用于 Angular 应用的根模块（`AppModule`），因为根模块的职责是在应用启动时加载第一个视图。\n\n- **入口组件（Entry components）**：这是放置应用中应动态加载的组件的地方。\n\
  \n下图展示了 NgModule 在 Angular 应用中的工作方式：\n\n![](img/7c3ddd2e5893c9b5a0220148ed886548_239_0.png)\n\
  \n图 10.5 – Angular 模块的流程图\n\n### 服务与依赖注入\n\n**服务**也是 Angular 的宝贵特性之一。它是在应用的不同组件中可以重复使用的代码。\n\
  \n服务的主要职责如下：\n\n- 在不同组件中复用逻辑\n- 实现 API 通信和数据访问\n- 促进单一职责，因为它将组件的独立功能分离开来\n\n要在应用中创建服务，我们将创建一个类，并使用\
  \ @Injectable 装饰器对其进行注解。要在应用的根级别注册服务，我们将在 @Injectable 装饰器中添加以下内容：\n\n```\n@Injectable({\n\
  \  providedIn: 'root',\n})\n```\n\n一旦我们在根级别设置了 providedIn 元数据的值，这将在整个应用中创建该服务的单个共享实例。另一方面，如果我们想在特定模块中提供服务，我们将把服务放在\
  \ @NgModule 的 providers 元数据中：\n\n```\n@NgModule({\n  providers: [Service1]\n})\n\
  ```\n\n既然我们已经讨论了 Angular 的一些基本特性，接下来我们将重点讨论如何构建 Angular 应用的结构。\n\n### 创建 Angular\
  \ 文件夹结构\n\nAngular 框架被视为一个 MVW 框架，这意味着我们的应用有许多可能的结构方式。在这里，我们将讨论一种最佳实践或最常用的结构，它可以帮助你的\
  \ Angular 应用具有可扩展性和可维护性。\n\n在前一部分中，我们了解到 Angular 代码块可以分组并组织到模块中；模块是构建 Angular 应用结构的一个很好的起点。我们可以实施的第一步是根据功能对模块进行分组和分类。下面列出的是我们的模块分类。\n\
  \n### 根模块\n\n**根**模块是应用的主模块。这是 Angular 应用启动时加载的第一个模块。当我们搭建一个名为 `AppModule` 的 Angular\
  \ 应用时，根模块会自动生成，并位于 `src/app` 文件夹下。\n\n### 特性模块\n\n**特性**模块是我们放置应用特定功能模块的地方。这意味着我们代码使用的大部分内容都在这个模块中。我们将在模块下创建组件、管道和指令，还可以通过将带有路由的组件放在页面文件夹中来分离组件。\n\
  \n让我们来看一个名为 `AntiHeroModule` 的特性模块的示例文件夹结构：\n\n```\nsrc\n├─ app\n│  ├─ anti-hero\n\
  │  │  ├─ components\n│  │  │  ├─ shared.component.ts\n│  │  ├─ directives\n│  │\
  \  │  ├─ first.directive.ts\n│  │  │  ├─ another.directive.ts\n│  │  ├─ pages\n\
  │  │  │  ├─ form\n│  │  │  │  ├─ form.component.ts\n│  │  │  ├─ list\n│  │  │  │\
  \  ├─ list.component.ts\n│  │  │  ├─ anti-hero.component.ts\n│  │  │  ├─ anti-hero.component.html\n\
  │  │  │  ├─ anti-hero.component.css\n│  │  │  ├─ index.ts\n│  │  ├─ pipes\n│  │\
  \  │  ├─ first.pipe.ts\n│  │  ├─ anti-hero.module.ts\n│  │  ├─ anti-hero.routing.module.ts\n\
  │  │  ├─ index.ts\n```\n\n在这里的文件夹结构中，我们将 anti-hero 模块分成了几个部分。第一个文件夹是 components\
  \ 文件夹，它包含此模块中共享的所有组件。这些也可以称为哑组件（dumb components），我们将在下一节讨论。\n\n接下来的两个是 directives\
  \ 和 pipes 文件夹，它们包含 AntiHeroModule 中使用的指令和管道。最后，pages 文件夹包含 AntiHeroModule 中具有直接路由的组件。这些也可以称为智能组件（smart\
  \ components）。我们还包含了 index.ts 文件，即 barrel 文件，它将为导出组件、指令和管道提供一个集中的位置。\n\n### 共享模块\n\
  \n共享模块是在整个应用中使用和共享的模块；它由我们在应用不同部分需要使用的组件、管道和指令组成。请记住，共享模块不应依赖应用中的其他模块。\n\n共享模块创建在\
  \ src/app/shared 文件夹下。\n\n让我们看一下应用中共享模块的示例文件夹结构：\n\n```\n|— src\n| |— app\n| | |—\
  \ shared\n| | | |— layout\n| | | | |— footer\n| | | | | |— footer.component.ts\n\
  | | | | | |— footer.component.html\n| | | | |— header\n| | | | | |— header.component.ts\n\
  | | | | | |— header.component.html\n| | | | |— layout.module.ts\n| | | |— index.ts\n\
  ```\n\n### 特性模块下的代码块\n\n我们想要在特性模块下创建代码块；首先需要搭建的是 AntiHeroModule。执行 ng g m anti-hero\
  \ 命令，在 src/app 文件夹下生成该模块。\n\n现在，在 anti-hero 文件夹下，我们将创建以下文件夹：\n\n- components：将包含在此模块中共享的组件。\n\
  - pipes：将包含 anti-hero 模块使用的所有管道。\n- directives：将包含 anti-hero 模块将使用的所有指令。\n- pages：将包含具有直接路由的组件。\n\
  \n创建完这些文件夹后，我们现在将为 anti-hero 模块创建页面组件。我们将添加两个页面，第一个页面用于显示 anti-hero 列表，第二个页面是一个表单，允许我们查看、创建或修改列表中所选英雄。我们可以执行\
  \ ng g c anti-hero/pages/pages/form 和 ng g c anti-hero/pages/list 命令来创建这两个页面。这将在\
  \ pages 文件夹下创建两个新组件：form 和 list。\n\n成功创建页面组件后，我们还将为 anti-hero 模块添加一个路由模块。我们将执行 ng\
  \ g m anti-hero/anti-hero-routing --flat 命令，并将以下代码放入路由模块中：\n\n```\nimport {NgModule}\
  \ from \"@angular/core\";\nimport {RouterModule, Routes} from \"@angular/router\"\
  ;\nimport {ListComponent} from \"./pages/list/list.component\";\nimport {FormComponent}\
  \ from \"./pages/form/form.component\";\n\nconst routes: Routes = [\n  {\n    path:\
  \ \"\",\n    component: ListComponent,\n  },\n  {\n    path: \"form\",\n    component:\
  \ FormComponent,\n  },\n];\n@NgModule({\n```\n\n\n\n\n\n```\ndeclarations: [ListComponent,\
  \ FormComponent],\nimports: [RouterModule.forChild(routes)],\nexports: [RouterModule]\n\
  })\nexport class AntiHeroRoutingModule {}\n```\n\n在前面的示例代码中，我们为表单和列表页面定义了路由。这意味着页面组件将在我们的应用程序中拥有直接路由，并且我们还将\
  \ ListComponent 定义为此模块的基础路由。\n\n在成功创建页面组件并定义路由后，我们希望根模块（AppModule）拥有 AntiHeroModule\
  \ 的路由。\n\n为实现此目的，我们将在 app-routing.module.ts 中放置以下代码：\n\n```\nimport { NgModule }\
  \ from '@angular/core';\nimport { RouterModule, Routes } from '@angular/router';\n\
  const routes: Routes = [\n  {\n    path: \"\",\n    redirectTo: \"anti-heroes\"\
  ,\n    pathMatch: \"full\",\n  },\n  {\n    path: \"anti-heroes\",\n    loadChildren:\
  \ () =>\n      import(\"./anti-hero/anti-hero.module\").then((m) =>\n        m.AntiHeroModule),\n\
  \  }\n];\n@NgModule({\n  imports: [RouterModule.forRoot(routes)],\n})\nexport class\
  \ AppRoutingModule { }\n```\n\n在前面的示例代码中，我们使用懒加载为 AntiHeroModule 创建了一个路由。一旦我们访问\
  \ {baseUrl}/anti-heroes URL，这将加载 AntiHeroModule 并重定向到基础路由，即 ListComponent。我们还使用了\
  \ RouterModule.forRoot() 来导入路由，因为这是根模块。\n\n在成功为 AppModule 定义路由后，我们现在可以看到应用程序的当前结构：\n\
  \n![](img/7c3ddd2e5893c9b5a0220148ed886548_245_0.png)\n\n图 10.6 – 创建 anti-hero 功能后的文件夹结构\n\
  \n现在我们已经在 Angular 中完成了功能模块，我们只有 pages 文件夹。我们将在开发应用程序时稍后添加其他块，例如组件和指令。下一步是创建共享模块。\n\
  \n## 共享模块下的块\n\n现在，我们下一个目标是在共享模块下创建块。我们将共享模块定义为在整个应用程序中共享的组件、指令和管道，并且不得依赖于其他模块。为创建我们的共享模块，我们将执行\
  \ ng g m shared 命令。这将在新的 shared 文件夹中创建一个新的 shared 文件夹和模块文件。\n\n现在在完成共享模块后，我们可以生成将被归类到此模块中的块。在我们的应用程序中，我们可以将\
  \ navbar 和 footer 作为共享组件包含在内，因为它们将在应用程序的每个部分中使用。\n\n我们将执行 ng g c shared/layout/navbar\
  \ 和 ng g c shared/layout/footer 命令来搭建 navbar 和 footer。我们可以看到 FooterComponent 和 NavbarComponent\
  \ 已自动添加到 shared.module.ts 文件中，因为 Angular 检测到最接近组件的模块：\n\n```\n@NgModule({\n  declarations:\
  \ [\n    NavbarComponent,\n    FooterComponent\n  ],\n  imports: [CommonModule]\n\
  })\nexport class SharedModule { }\n```\n\n请记住在 NgModule 的 exports 元数据中添加 navbar\
  \ 和 footer 组件，并且我们将在不同模块中导入共享模块：\n\n```\n@NgModule({\n  declarations: [\n    NavbarComponent,\n\
  \    FooterComponent\n  ],\n  exports: [NavbarComponent, FooterComponent]\n  imports:\
  \ [CommonModule]\n})\n```\n\n我们也可以通过执行 ng g c shared/directive/directive-name 和\
  \ ng g c shared/pipes/pipe-name 命令根据应用程序的需求在 shared 文件夹下添加共享指令和管道。在成功创建块后，我们将具有以下文件夹结构：\n\
  \n![](img/7c3ddd2e5893c9b5a0220148ed886548_246_0.png)\n\n图 10.7 – 创建共享模块后的文件夹结构\n\
  \n我们还必须记住，共享模块不需要路由模块，因为它没有需要在应用程序中路由的组件。\n\n## 核心模块下的块\n\n我们需要创建的最后一个模块是核心模块。核心模块是我们共享在整个应用程序中的服务，并且它们只有一个实例。总是进入核心模块的一个服务是身份验证服务。\n\
  \n为创建我们的共享模块，我们将在完成核心模块后执行 ng g m core; 命令。我们将通过运行 ng g s core/services/authenticate\
  \ 命令来搭建 authenticate 服务。\n\n在成功创建 authenticate 服务后，我们将在 core.module.ts 文件下提供它以将服务包含在模块中。我们也可以根据应用程序的需求通过添加\
  \ models 文件夹在核心模块下添加共享模型。现在，我们具有以下文件夹结构：\n\n![](img/7c3ddd2e5893c9b5a0220148ed886548_247_0.png)\n\
  \n图 10.8 – 创建共享模块后的文件夹结构\n\n我们将在开发应用程序的过程中制作 authenticate 服务的内容，但现在我们已经创建了 Angular\
  \ 应用程序的基础结构，我们将使用此结构来构建项目的其他部分。现在，我们将讨论如何在 Angular 中构建组件的结构。\n\n## 构建组件\n\n我们已经通过根据其使用和功能对模块进行分类来构建\
  \ Angular 应用程序，这将有利于代码重用和可维护性。然而，在特定模块下可能仍会创建大量组件，这将进一步提高应用程序的可维护性。在本节中，我们将讨论在组件级别构建\
  \ Angular 架构的另一种策略。\n\n## 智能和哑或展示组件\n\n构建 Angular 应用程序最常见且推荐的 **组件级架构** 是智能和哑组件架构。在上一节中，我们根据在应用程序中使用的方式将模块拆分为不同的类别。\n\
  \n此架构也提供了相同的概念。我们将组件分为两种类型——即 **智能组件** 和 **哑** 或 **展示组件**。\n\n让我们讨论每种组件类型的特征。\n\n\
  ### 智能组件\n\n**智能组件** 也称为应用程序级组件或容器组件。这些组件的主要职责是与服务通信并从请求中消费数据。由于它们很智能，它们包含获取应用程序数据的所有依赖项和订阅。\n\
  \n智能组件可以被视为在我们的应用程序中具有直接路由的页面组件，并且它们是持有哑组件的父组件。让我们看一下创建智能组件的以下示例代码：\n\n```\n@Component({\n\
  \  selector: 'app-home',\n  template: `\n    <h2>User List</h2>\n    <div>\n   \
  \   <table class=\"table\">\n        <tbody>\n          <tr (click)=\"selectUser(user)\"\
  \ *ngFor=\"let user of users\">\n            <td>{{user.firstName}}</td>\n     \
  \       <td>\n              <span>{{user.lastName}}</span>\n            </td>\n\
  \          </tr>\n        </tbody>\n      </table>\n    </div>\n  `,\n  styleUrls:\
  \ ['./home.component.css']\n}\n```\n\n```\n})\nexport class HomeComponent implements\
  \ OnInit {\n  users: User[] = [];\n  constructor(private userService: UserService)\
  \ {\n  }\n  ngOnInit() {\n    this.userService.getUsers()\n      .subscribe(users\
  \ => this.users = users);\n  }\n  selectUser(user: User) {\n    // action\n  }\n\
  }\n```\n\n在前面的示例代码中，我们创建了一个名为 HomeComponent 的组件，它将在表格中显示用户列表。我们还注入了 UserService\
  \ 来从 HTTP 请求中获取用户。我们知道此组件将成功显示用户，但我们可以看出我们的模板很庞大，并且随着我们向此组件添加更多功能，它可能会变得过于复杂。\n\n\
  我们想要做的是省略仅用于展示目的的元素。在此场景中，我们希望从 HomeComponent 中移除表格，并且我们将具有以下代码：\n\n```\n@Component({\n\
  \  selector: 'app-home',\n  template: `\n    <h2>User List</h2>\n    <div>\n   \
  \   <!--we will place that dumb component here later-->\n    </div>\n  `,\n  styleUrls:\
  \ ['./home.component.css']\n})\nexport class HomeComponent implements OnInit {\n\
  \  users: User[] = [];\n  constructor(private userService: UserService) {\n  }\n\
  \  ngOnInit() {\n    this.userService.getUsers()\n```\n\n\n\n\n\n```\n.subscribe(users\
  \ => this.users = users);\n}\nselectUser(user: User) {\n    // action\n}\n}\n```\n\
  \n在前面的重构代码中，我们移除了显示用户列表的表格。我们只希望智能组件处理依赖注入、订阅和操作。我们现在已经成功创建了智能组件，下一步是创建展示组件。\n\n\
  ## Dumb or presentation components\n\n**Dumb components**，也称为展示组件，负责在应用中显示数据。它们不应有依赖和订阅，因为它们的唯一目的是在视图中呈现数据。\n\
  \n让我们创建之前省略的表格作为一个 dumb 组件：\n\n```\n@Component({\n  selector: 'users-list',\n  template:\
  \ `\n    <table class=\"table\">\n      <tbody>\n        <tr (click)=\"selectUser(user)\"\
  \ *ngFor=\"let user of users\">\n          <td>{{user.firstName}}</td>\n       \
  \   <td>\n            <span>{{user.lastName}}</span>\n          </td>\n        </tr>\n\
  \      </tbody>\n    </table>\n  `,\n  styleUrls: ['./users-list.component.css']\n\
  })\nexport class UsersListComponent {\n  @Input()\n  users: User[];\n```\n\n```\n\
  ```typescript\n@Output('user')\nuserEmitter = new EventEmitter<User>();\n  selectUser(user:User)\
  \ {\n        this.userEmitter.emit(user);\n  }\n}\n```\n```\n\n在前面的示例代码中，我们为显示用户列表的表格创建了一个单独的组件。由于\
  \ dumb 组件没有注入依赖，组件将需要从智能组件接收数据。为此，我们添加了一个 @Input 绑定属性来从 HomeComponent 接收用户列表；另一方面，我们还添加了一个\
  \ @Output 绑定属性将操作冒泡到父组件或智能组件。\n\n记住 dumb 组件必须没有任何逻辑或操作；在这种情况下，我们将使用 EventEmitter\
  \ 在父组件中传递事件，并且父组件将负责需要完成的步骤。在示例代码中，一旦点击一行，我们就会将用户传递给 userEmitter，而 HomeComponent\
  \ 将检索它。\n\n成功创建 UserListComponent 后，我们现在可以在 HomeComponent 中使用它，并且我们将有以下代码：\n\n```\n\
  ```typescript\n@Component({\n  selector: 'app-home',\n  template: `\n    <h2>User\
  \ List</h2>\n    <div>\n        <users-list users=\"users\"\n          (user)=\"\
  selectUser($event)\"/>\n    </div>\n  `,\n  styleUrls: ['./home.component.css']\n\
  })\nexport class HomeComponent implements OnInit {\n  users: User[] = [];\n  constructor(private\
  \ userService: UserService) {\n  }\n  ngOnInit() {\n      this.userService.getUsers()\n\
  ```\n\n```\n.subscribe(users => this.users = users);\n}\nselectUser(user: User)\
  \ {\n    // action\n}\n}\n```\n\n在前面的示例代码中，我们可以看到我们已将 UsersListComponent 用作 HomeComponent\
  \ 的子组件。它接受由 HomeComponent 检索的用户列表，并在点击特定行时发出事件。至此，我们已完成对智能组件和 dumb 组件概念的讨论。\n\n\
  ## Implementing smart and dumb components in the project\n\n让我们现在在我们的 Angular 项目中实现智能和\
  \ dumb 组件架构。我们将在 AntiHeroModule 下创建我们的组件。我们已经制作了我们的智能组件，这些是 pages 文件夹中的表单和列表组件。\n\
  \n我们始终将智能组件放在 pages 文件夹中，因为这些将是我们应用中的容器组件。下一步是创建我们的 dumb 组件。我们将创建两个 dumb 组件，即 anti-hero-form\
  \ 和 anti-hero-list 组件。要创建组件，执行 ng g c anti-hero/components/anti-hero-form anti-hero/components\
  \ anti-hero-list 命令。成功生成两个 dumb 组件后，让我们放置以下代码。\n\n对于 AntiHeroListComponent，我们将把以下代码放入\
  \ anti-hero-list.component.html 文件中：\n\n```\n<table>\n    <thead>\n        <th *ngFor=\"\
  let item of headers\">{{item.headerName}}</th>\n    </thead>\n    <tbody>\n    \
  \    <tr (click)=\"selectAntiHero(item)\" *ngFor =\"let item of antiHeroes\">\n\
  \            <ng-container *ngFor=\"let header of headers\">\n                <td>{{item[header.fieldName]}}</td>\n\
  \            </ng-container>\n\n</tr>\n</tbody>\n</table>\n```\n\n在前面的 HTML 代码中，我们创建了一个表格，其中标题和项目绑定到\
  \ antiHeroes 变量。我们还绑定了标题和反英雄的键值以动态显示值。\n\n现在，让我们在 AntiHeroList 组件中添加接收和发出数据的属性：\n\
  \n### anti-hero-list.component.ts\n\n```\nexport class AntiHeroListComponent implements\
  \ OnInit {\n  @Input() headers: Array<{headerName: string, fieldName: keyof AntiHero}>\
  \ = [];\n  @Input() antiHeroes: Array<AntiHero> = [];\n  @Output() antiHero = new\
  \ EventEmitter();\n\n  constructor() { }\n  ngOnInit(): void {\n  }\n  selectAntiHero(antiHero:\
  \ AntiHero) {\n    this.antiHero.emit(antiHero);\n  }\n}\n```\n\n现在，在反英雄组件的 TypeScript\
  \ 文件中，我们定义了三个属性，这些属性是我们 dumb 组件从智能组件接收数据并向其发出事件所必需的。\n\n第一个属性是 headers 属性，它具有 @Input\
  \ 注解。这将获取 {headerName: string, fieldName: keyof AntiHero} 类型的数组，该数组将被迭代以显示列标题并显示每个反英雄项目的字段值。第二个属性是\
  \ antiHeroes，它也具有 @Input 注解。这将接受要显示在每一行中的反英雄列表，最后是 antiHero 属性，它用 @Output 注解。这会在用户点击单行时将选定的反英雄发出到父组件。\n\
  \n我们还在 anti-hero/models/anti-hero.interface.ts 中添加了一个名为 AntiHero 的接口，该接口将用于转换对象类型。\n\
  \n我们将有以下接口代码：\n\n```\nexport interface AntiHero {\n    firstName: string;\n    lastName:\
  \ string;\n    house: string;\n    kownAs: string;\n}\n```\n\n在前面的代码示例中，我们创建了一个\
  \ AntiHero 接口，它将用作我们对象的蓝图。反英雄对象的属性与我们在 Spring 应用中定义的属性相同。\n\n在为我们的对象创建接口后，我们现在将在\
  \ AntiHeroModule 中声明并导入我们的组件和模块。\n\n让我们看一下以下代码：\n\n### anti-hero.module.ts\n\n```\n\
  @NgModule({\n  declarations: [\n    AntiHeroListComponent,\n    AntiHeroFormComponent,\n\
  \    ListComponent,\n    FormComponent\n  ],\n  imports: [\n    CommonModule,\n\
  \    AntiHeroRoutingModule,\n  ]\n})\nexport class AntiHeroModule { }\n```\n\n在我们的\
  \ anti-hero.module.ts 文件中，我们希望确保我们的智能组件和 dumb 组件都被声明；否则，我们在编译时会遇到错误。我们还希望检查是否已导入\
  \ AntiHeroRoutingModule 以使用路由。\n\n让我们现在添加额外的样式以改善应用的用户界面。让我们看一下以下代码：\n\n### anti-hero-list.component.scss\n\
  \n```\n```scss\ntable, th, td {\n    border: 1px solid;\n    border-collapse: collapse;\n\
  \    border: 1px solid;\n}\n```\n```\n\n我们还在组件中添加了简单的 CSS 代码来设置表格样式。现在，我们已成功创建了\
  \ AntiHeroListComponent。下一步是在 ListComponent 页面上使用此展示组件。让我们看一下以下代码示例：\n\n```\n```typescript\n\
  export class ListComponent implements OnInit {\n  // sample data of anti-hero\n\
  \  antiHeroes: AntiHero[] = [\n    {\n      firstName: \"Eddie\",\n      lastName:\
  \ \"Brock\",\n      house: \"New York\",\n      knownAs: \"Venom\"\n    }\n  ]\n\
  \  headers: {headerName: string, fieldName: keyof\n      AntiHero}[] = [\n    {headerName:\
  \ \"First Name\", fieldName: \"firstName\"},\n    {headerName: \"Last Name\", fieldName:\
  \ \"lastName\"},\n    {headerName: \"House\", fieldName: \"house\"},\n    {headerName:\
  \ \"Known As\", fieldName: \"knownAs\"},\n  ]\n  constructor() { }\n  ngOnInit():\
  \ void {\n  }\n  selectAntiHero(antiHero: AntiHero) { }\n}\n```\n\n\n\n在 ListComponent\
  \ 的 TypeScript 文件中，我们创建了 `headers` 的定义，以及一个用于反英雄列表显示的 `antiHeroes` 示例列表。这只是临时性的，因为我们只是想测试展示组件能否成功显示反英雄列表。我们还创建了\
  \ `selectAntiHero()` 函数，以便将来在选中某个特定反英雄时实现相应功能。\n\n现在让我们为 AntiHeroList 定义输入和输出属性。让我们看看下面的代码：\n\
  \n## anti-hero-list.component.html\n\n```\n<!-- Dumb component anti hero list -->\n\
  <app-anti-hero-list [antiHeroes]=\"antiHeroes\" [headers]=\"headers\" (antiHero)=\"\
  selectAntiHero($event)\"></app-anti-hero-list>\n```\n\n现在，在 ListComponent 的 HTML\
  \ 文件中，我们已将 `headers` 和 `antiHeroes` 绑定到 `app-anti-hero-list` 的属性上。我们还使用了 `selectAntiHero()`\
  \ 函数，以便在 `antiHero` 发出操作时捕获该事件。\n\n成功实现我们的展示组件后，我们可以运行应用程序并在浏览器中打开它。我们应该会看到以下结果：\n\
  \n![](img/7c3ddd2e5893c9b5a0220148ed886548_256_0.png)\n\n从结果中我们可以看到，展示组件已成功显示了来自父组件的数据。至于表单组件，我们将在下一章中实现其功能，因为创建表单将是另一个不同的话题。\n\
  \n现在，我们已经了解了智能组件和哑组件的概念、结构和实现。在下一节中，我们将使用一个 UI 框架来帮助我们改进 Angular 应用程序的界面。\n\n##\
  \ 添加 Angular Material\n\n我们已经使用模块级别的核心、功能和共享架构，以及组件级别的智能组件和哑组件架构，对 Angular 应用程序进行了组织。现在，我们准备通过为组件设置样式来自定义和改进外观与\
  \ UI。我们都知道，从零开始编写 CSS 代码并开发基础样式对我们开发人员来说是另一个挑战。除了操心代码的逻辑层面之外，这还会给我们带来额外的负担。而 Angular\
  \ Material 正是大显身手的地方！\n\n**Angular Material** 是由 Google 创建的一个库，为 Angular 应用程序提供了丰富的\
  \ UI 组件，例如表格、卡片、输入框和日期选择器。这意味着我们不必从头开始为组件设置样式，因为 Material 库中的组件列表已经可以直接使用。\n\nAngular\
  \ Material 在底层提供了大量且不断增长的组件。它提供了包含这些组件的模块，这些组件可用于 Angular 应用程序，并可导入到特定的应用程序模块中；这些组件是可复用的，并且由于内置了许多可供我们使用的属性，因此它们在外观和交互体验方面易于定制。\n\
  \n让我们在 Angular 项目中配置 Angular Material。\n\n## 配置 Angular Material\n\nAngular Material\
  \ 在 Angular 项目中配置起来很简单，因为它提供了一个 schematic，只需一条命令即可安装 Angular Material 的所有依赖项。要安装\
  \ Angular Material，我们将执行以下命令：\n\n```\nng add @angular/material\n```\n\n执行该命令后，在安装资源之前它会询问一些问题：\n\
  \n+   - **选择预构建主题名称，或选择“custom”作为自定义主题：** Angular Material 提供了预构建主题，你也可以配置自己的自定义主题。\n\
  +   - **设置全局 Angular Material 排版样式：** 选择“是”将应用 Angular Material 的全局排版。\n+   - **为\
  \ Angular Material 设置浏览器动画：** 选择“是”将在我们的根模块中安装 `BrowserAnimationsModule`。当我们想要使用\
  \ Angular Material 的动画时，这很重要。\n\n回答完所有问题后，它现在将安装 Angular Material。这将为我们的项目执行以下操作：\n\
  \n+   1. 将依赖项（`@angular/material` 和 `@angular/cdk`）添加到 `package.json`。\n+   2. 将\
  \ Roboto 字体添加到 `index.html` 文件：\n+   3. 将 Material Design 图标字体添加到 `index.html` 文件：\n\
  \n```\n<link href=\"https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap\"\
  \ rel=\"stylesheet\">\n```\n\n```\n<link href=\"https://fonts.googleapis.com/icon?family=Material+Icons\"\
  \ rel=\"stylesheet\">\n```\n\n+   4. 添加以下 CSS 样式：\n+     - 将 `html` 和 `body` 的高度设置为\
  \ 100%\n+     - 将 Roboto 设置为默认字体\n+     - 移除 `body` 的外边距：\n\n```\nhtml, body { height:\
  \ 100%; }\nbody { margin: 0; font-family: Roboto, \"Helvetica Neue\", sans-serif;\
  \ }\n```\n\n在我们的应用程序中成功安装 Angular Material 后，我们现在就可以在应用程序中使用这些组件了。\n\n## 实现 Angular\
  \ Material\n\n我们现在将在 Angular 项目中实现 Angular Material 组件。正如我们之前提到的，Angular Material\
  \ 提供了大量可用于构建应用程序的组件。在这个示例项目中，我们将只定义应用程序中会使用到的组件。让我们列出将要实现的组件。\n\n### 按钮组件\n\n使用\
  \ Material Design 样式增强的原生 `<button>` 或 `<a>` 元素。\n\n我们可以使用以下代码导入按钮组件：\n\n```\nimport\
  \ {MatButtonModule} from '@angular/material/button';\n```\n\n以下是按钮组件的示例：\n\n```\n\
  <div class=\"example-button-row\">\n    <button mat-raised-button>Basic</button>\n\
  \    <button mat-raised-button\n        color=\"primary\">Primary</button>\n   \
  \ <button mat-raised-button\n        color=\"accent\">Accent</button>\n    <button\
  \ mat-raised-button color=\"warn\">Warn</button>\n    <button mat-raised-button\
  \ disabled>Disabled</button>\n    <a mat-raised-button href=\"\n        https://material.angular.io/target=\"\
  \ _blank>Link</a>\n</div>\n```\n\n在上面的 Material 按钮代码示例中，我们可以看到我们正在使用 Material Design\
  \ 的内置指令来改变按钮的样式和外观。该示例代码将产生以下输出：\n\n![](img/7c3ddd2e5893c9b5a0220148ed886548_259_0.png)\n\
  \n图 10.10 – Material 按钮的示例输出\n\n### 图标组件\n\n该组件允许我们向应用程序添加基于矢量的图标，并且同时支持图标字体和 SVG\
  \ 图标。\n\n我们可以使用以下代码导入图标组件：\n\n```\nimport {MatIconModule} from '@angular/material/icon';\n\
  ```\n\n以下是图标组件的示例：\n\n```\n<mat-icon color=\"primary\">delete</mat-icon>\n<mat-icon\
  \ color=\"accent\">fiber_new</mat-icon>\n<mat-icon color=\"warn\">pageview</mat-icon>\n\
  ```\n\n在上面的代码示例中，我们可以使用 `mat-icon` 组件创建图标。它有几个输入属性（例如 `color`），允许我们自定义图标的颜色。该示例代码将产生以下输出：\n\
  \n![](img/7c3ddd2e5893c9b5a0220148ed886548_259_1.png)\n\n图 10.11 – Material 图标的示例输出\n\
  \n### 表格组件\n\n该组件允许我们添加具有 Material Design 样式的数据表格。Material 表格基于 CDK 数据表格的基础构建。有关如何实现\
  \ CDK 数据表格的更多信息，请参阅 https://material.angular.io/cdk/table/overview 上的文档。\n\n我们可以使用以下代码导入表格组件：\n\
  \n```\nimport {MatTableModule} from '@angular/material/table';\n```\n\n以下是表格组件的示例：\n\
  \n```\n```html\n<table mat-table [dataSource]=\"data\" class=\"mat-elevation-z8\"\
  >\n\n  <!-- Position Column -->\n  <ng-container matColumnDef=\"id\">\n    <th mat-header-cell\
  \ *matHeaderCellDef> ID </th>\n    <td mat-cell *matCellDef=\"let element\">\n \
  \     {{element.position}} </td>\n  </ng-container>\n\n  <!-- Name Column -->\n\
  \  <ng-container matColumnDef=\"name\">\n    <th mat-header-cell *matHeaderCellDef>\
  \ Name </th>\n    <td mat-cell *matCellDef=\"let element\">\n      {{element.name}}\
  \ </td>\n  </ng-container>\n\n  <tr mat-header-row *matHeaderRowDef=\"columns\"\
  ></tr>\n  <tr mat-row *matRowDef=\"let row; columns: columns;\"></tr>\n</table>\n\
  ```\n```\n\n在上面的示例中，我们可以看到表格使用了几个属性。第一个属性是 `dataSource` 属性，它将接受要显示的数据列表。下一个属性是 `matColumnDef`，它定义了每一列的字段名，这些字段名应包含在绑定到\
  \ `matHeaderRowDef` 属性的 `columns` 变量中。最后，`matHeaderCellDef` 和 `matCellDef` 属性会显示实际的列名和关联值，如下面的截图所示：\n\
  \n![](img/7c3ddd2e5893c9b5a0220148ed886548_260_0.png)\n\n图 10.12 – Material 表格的示例输出\n\
  \n### 工具栏组件\n\n该组件允许我们添加具有 Material Design 样式的工具栏。它通常用作页眉、标题和导航按钮的容器。\n\n\n\n\n\n\
  我们可以使用以下代码导入工具栏组件：\n\n```typescript\nimport {MatToolbarModule} from '@angular/material/toolbar';\n\
  ```\n\n以下是工具栏组件的示例：\n\n```html\n<p>\n  <mat-toolbar color=\"primary\">\n    <button\
  \ mat-icon-button class=\"example-icon\"\n      aria-label=\"Example icon-button\
  \ with menu icon\">\n      <mat-icon>menu</mat-icon>\n    </button>\n    <span>Angular\
  \ CRUD</span>\n  </mat-toolbar>\n</p>\n```\n\n在前面的代码示例中，我们使用 mat-toolbar 组件创建了一个工具栏元素。mat-toolbar\
  \ 组件使用内容投影，允许我们自定义其内容。示例代码将具有以下输出：\n\n![](img/7c3ddd2e5893c9b5a0220148ed886548_261_0.png)\n\
  \nFigure 10.13 – Example output for the Material toolbar\n\n## Form field component\n\
