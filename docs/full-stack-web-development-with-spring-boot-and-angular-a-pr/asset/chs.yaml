  ```\n```\n<input matInput formControlName=\"lastName\" placeholder=\"Ex. Stark\"\
  \ data-cy=\"lastName\"/>\n</mat-form-field>\n<mat-form-field class=\"example-full-width\"\
  \ appearance=\"fill\"><mat-label>House</mat-label>\n<input matInput formControlName=\"\
  house\" placeholder=\"Ex. California\" data-cy=\"house\"/>\n</mat-form-field><mat-form-field\
  \ class=\"example-full-width\" appearance=\"fill\">\n<mat-label>Known As</mat-label>\n\
  <input matInput formControlName=\"knownAs\" placeholder=\"Ex. Iron Man\" data-cy=\"\
  knownAs\"/>\n</mat-form-field><div class=\"button-group\">\n<button mat-raised-button\
  \ color=\"primary\" (click)=\"emitAction()\" data-cy=\"action\">{{ actionButtonLabel\
  \ }}</button>\n&nbsp;\n<button mat-raised-button color=\"warn\" (click)=\"clear()\"\
  >Clear</button>\n</div>\n</form>\n</mat-card>\n```\n\n上述代码包含五个输入，你可以在input元素和button元素中找到它们。\n\
  \n至此，我们已经为后续要测试的HTML元素添加了必要的测试ID属性。当我们开始在anti-heroes.cy.ts文件中编写测试时，将需要上述提到的data-cy测试ID。\n\
  \n10. 现在，让我们开始在anti-heroes.cy.ts中编写测试。以下是新代码：\n\n```\n/// <reference types=\"cypress\"\
  />\ndescribe(\"Login Page\", () => {\n  beforeEach(() => {\n    cy.fixture(\"anti-heroes\"\
  ).then(function (data) {\n      /* register custom commands. */\n      cy.getCommand(\"\
  /api/v1/anti-heroes\", data);\n      cy.deleteCommand(\"/api/v1/anti-heroes/*\"\
  );\n```\n\n\n\n\n```\n});\ncy.visit(\"/\");\ncy.fixture(\"user\").then((data: {\
  \ email: string;\n    password: string }) => {\n    cy.get(\"[data-cy=email]\").type(data.email);\n\
  \    cy.get(\"[data-cy=password]\")\n        .type(data.password);\n    cy.get(\"\
  [data-cy=submit-login]\").click();\n});\n});\nafterEach(() => {\n    cy.get(\"[data-cy=logout]\"\
  ).click();\n});\nit.skip(\"should display login page\", () => {\n    cy.visit(\"\
  /\");\n    cy.url().should(\"include\", \"/login\");\n    cy.get(\"[data-cy=auth-title]\"\
  ).should(\"contain\",\n        \"Login\");\n});\n});\n```\n\n前面的代码展示了一个 describe\
  \ 函数，其中包含另外两个函数。\n\ndescribe 函数中的第一个函数称为 beforeEach，它在每次测试开始运行前执行。beforeEach 函数保持其状态并在测试中使用它。此函数适用于测试必须做的事情与其他测试必须做的事情完全相同的情况——例如，访问特定\
  \ URL、登录以及使用 getCommand 和 deleteCommand 等自定义可链式命令拦截 HTTP 调用。\n\ndescribe 函数中的第二个函数称为\
  \ afterEach。afterEach 函数在每次测试结束时运行。此函数适用于清理或在测试中注销用户。beforeEach 和 afterEach 函数为我们节省了大量可重复的代码。\n\
  \n11. 现在，让我们在 anti-heroes.cy.ts 文件中添加一些测试。复制以下代码并将其放在我们编写的第一个测试下方：\n\n```\nit(\"\
  should display logo\", () => { cy.get(\"[data-cy=logo]\")\n.should(\"contain\",\
  \ \"Angular CRUD\");\n});\nit(\"should render anti-heroes\", () => {\n```\n\n```\n\
  ```javascript\ncy.fixture(\"anti-heroes\").then(function (data) {\n  cy.get(\"[data-cy=row]\"\
  ).should(\"have.length\", 24);\n});\n\nit(\"should remove a card after clicking\
  \ a delete button\", () => { const index = 1;\n  cy.get(\"[data-cy=delete]\").eq(index).click();\n\
  \  cy.get(\"[data-cy=row]\").should(\"have.length\", 20);\n});\n\nit(\"should add\
  \ a new hero\", () => { const firstName = \"Bucky\";\n  const lastName = \"Barnes\"\
  ;\n  const house = \"Marvel\";\n  const knownAs = \"The Winter Soldier\";\n  cy.get(\"\
  [data-cy=create]\").click();\n  cy.get(\"[data-cy=firstName]\").type(firstName);\n\
  \  cy.get(\"[data-cy=lastName]\").type(lastName);\n  cy.get(\"[data-cy=house]\"\
  ).type(house);\n  cy.get(\"[data-cy=knownAs]\").type(knownAs);\n  cy.postCommand(\"\
  /api/v1/anti-heroes\", {\n    firstName,lastName,house,knownAs,});\n  cy.get(\"\
  [data-cy=action]\").click();\n  cy.fixture(\"anti-heroes\").then(function (data)\
  \ {\n    cy.get(\"[data-cy=row]\").should(\"have.length\", 24);\n  });\n});\n```\n\
  ```\n\n前面的代码展示了我们将用于 Cypress 的测试。你可以看到 fixture 需要一个字符串，即 JSON 文件的名称。fixture 的数据是匿名函数的参数。\n\
  \n我们断言 24 是因为对于我们使用 data-cy=\"row\" 的每个对象都有四个元素，这是我们在用户界面上构建 HTML 元素的方式。anti-heroes.json\
  \ 文件的数组中也有六个对象。\n\n新添加的测试展示了如何使用 eq 关键字和索引号从渲染的 UI 的列表或数组中选择特定对象。\n\n新添加的测试还展示了如何通过调用\
  \ click 和 type 函数将文本写入输入字段。然后，你可以使用 postCommand 自定义可链式命令来拦截 HTTP POST 请求。\n\n+ \
  \  12. 最后，在运行测试之前，通过调用 skip 使我们之前编写的简单测试跳过，如下所示：\n\n```\nit.skip(\"should display\
  \ login page\", () => {\n```\n\n前面的代码将简单测试从运行更改为不运行。\n\nanti-heroes.cy.ts 规范文件的完整代码可以在\
  \ https://github.com/PacktPublishing/Spring-Boot-and-Angular/blob/main/Chapter-15/superheroes/cypress/e2e/anti-heroes.cy.ts\
  \ 找到。\n\n现在，我们可以运行 anti-heroes.cy.ts 规范文件来查看是否一切都会通过，如下图所示：\n\n![](img/7c3ddd2e5893c9b5a0220148ed886548_387_0.png)\n\
  \n图 15.8 – 通过的测试\n\n图 15.8 显示 should display login page 测试被跳过，而其余测试都通过了。\n\n你可以看到\
  \ beforeEach 函数内部发生了什么，如下所示：\n\n![](img/7c3ddd2e5893c9b5a0220148ed886548_388_0.png)\n\
  \n图 15.9 – BEFORE EACH DOM 快照\n\n图 15.9 显示了 beforeEach 函数所采取的步骤。这些是 Web 应用程序的 DOM\
  \ 快照。\n\n让我们也检查一下 anti-heroes.cy.ts 规范文件的测试主体。你应该会看到以下信息：\n\n![](img/7c3ddd2e5893c9b5a0220148ed886548_388_1.png)\n\
  \n图 15.10 – TEST BODY DOM 快照\n\n图 15.10 显示了在测试主体中采取的步骤。这些是你编写在 anti-heroes.cy.ts\
  \ 文件中的操作。\n\n我们还可以看到 afterEach 函数内部发生了什么。你应该能够看到以下输出：\n\n![](img/7c3ddd2e5893c9b5a0220148ed886548_389_0.png)\n\
  \n图 15.11 – AFTER EACH DOM 快照\n\n图 15.11 显示了 afterEach 函数内部的步骤。在这里，你可以看到 afterEach\
  \ 函数注销了用户并将用户重定向到应用程序的登录页面。\n\n这就是编写 Cypress 测试的方式。现在，让我们总结一下本章所涵盖的内容。\n\n## Summary\n\
  \n至此，你已到达本章的结尾。首先，你学习了 Cypress 是什么以及设置和编写端到端测试是多么容易。你还学习了如何拦截 HTTP 请求并模拟 HTTP 响应。\n\
  \n在下一章中，你将学习如何将前端和后端应用程序打包成单个可执行的 JAR 文件。\n"
- '## Part 4: 部署

  Deployment


  本部分演示了交付后端和前端应用程序的现代方式。以下章节包含在本部分中：


  +   - *Chapter 16, Packaging Backend and Frontend with Maven*

  +   - *Chapter 17, Deploying Spring Boot and the Angular App*

  '
- "## 16\nPackaging Backend and Frontend with Maven\n\n在上一章中，我们学习了 Cypress 是什么及其优势。我们还学习了如何编写\
  \ Cypress 端到端测试以及如何运行它们。最后，我们学习了如何拦截 HTTP 请求以模拟响应。\n\n本章将教你如何组合 Angular 和 Spring\
  \ Boot 应用程序，然后在本地机器上运行它们。\n\n在本章中，我们将涵盖以下主题：\n\n+   - What is frontend-maven-plugin?\n\
  +   - Adding configurations to Spring Boot and Angular's integration\n+   - Packaging\
  \ Spring Boot\n+   - Running the JAR file\n\n## Technical requirements\n\n以下链接将带你到本章代码的完成版本：https://github.com/PacktPublishing/Spring-Boot-and-Angular/tree/main/Chapter-16/superheroes。\n\
  \n## What is frontend-maven-plugin?\n\n好吧——在回答 `frontend-maven-plugin` 是什么之前，让我们看看如何打包我们的应用程序。我们可以构建\
  \ Spring Boot 以生成 JAR 文件并创建 Angular 的生产构建。\n\n但如果我们能为 Spring Boot 创建一个 JAR 文件，其中也包含\
  \ Angular 的生产构建呢？将前端和后端放在单个 JAR 文件中的方法将为我们提供一种更简单的方式将应用程序部署到测试和生产环境。\n\n它将允许我们为\
  \ API 和前端应用程序管理单一路径。为此，我们需要一个名为 `frontend-maven-plugin` 的 Maven 插件（`https://github.com/eirslett/frontend-maven-plugin`），它将帮助我们创建包含后端和前端的\
  \ JAR 文件。\n\n一些要求确保我们的后端和前端能够协同工作。在下一节中，我们将了解我们在后端和前端需要什么配置。\n\n## Adding configurations\
  \ to Spring Boot and Angular’s integration\n\n在本节中，我们将在 Spring Boot 应用程序和 Angular\
  \ 应用程序中编写一些配置，以确保 Spring Boot 在生产环境中运行，并且 Angular 渲染 Web 应用程序的用户界面。\n\n首先，让我们将 Angular\
  \ 应用移动到 Spring Boot 应用程序的目录中。\n\n## Adding the Angular app to the Spring Boot project\n\
  \n在本节中，我们将 Angular 应用移动到 Spring Boot 项目中。通过这样做，Spring Boot 项目内部将有一个 Angular 项目。\n\
  \n首先，在 Spring Boot 项目内部创建一个名为 `frontend` 的新文件夹。将 Angular 应用程序的所有文件和文件夹移动到 `frontend`\
  \ 文件夹中，如下所示：\n\n\n![](img/7c3ddd2e5893c9b5a0220148ed886548_395_0.png)\n\n图 16.1\
  \ – Spring Boot 项目中的 frontend 文件夹\n\n图 16.1 展示了 Spring Boot 项目内 frontend 文件夹中的所有\
  \ Angular 文件和文件夹。\n\n只要将 frontend 文件夹的路径映射到 Frontend Maven Plugin 的 workingDirectory\
  \ 属性和 Apache Maven AntRun Plugin 的 fileset 属性（后者允许你在 Maven 中运行 Ant 任务），你就可以随意命名\
  \ frontend 文件夹。\n\n让我们使用两个 Maven 插件：frontend-maven-plugin 和 maven-antrun-plugin，这是我们下一节需要的。\n\
  \n## 使用 frontend-maven-plugin\n\n在本节中，我们将使用 frontend-maven-plugin，它会在本地安装 npm 和\
  \ Node.js，还会在 frontend 文件夹中运行 npm build 命令，并复制 npm build 生成的构建文件。\n\n那么，我们开始吧：\n\
  \n- 1. 打开你的 pom.xml 文件，将以下代码作为 Maven pom 文件中的一个构建插件插入：\n\n```\n<plugin>\n    <groupId>com.github.eirslett</groupId>\n\
  \    <artifactId>frontend-maven-plugin</artifactId>\n    <version>1.12.1</version>\n\
  \    <configuration>\n        <workingDirectory>frontend</workingDirectory>\n  \
  \      <installDirectory>target</installDirectory>\n    </configuration>\n...\n\
  // See full code on https://github.com/PacktPublishing/Spring-Boot-and-Angular/tree/main/Chapter-16/superheroes\n\
  </plugin>\n```\n\n上述配置表明，在构建 Spring Boot 应用程序时，该插件会在 frontend 工作目录中安装 Node.js v16.17.0\
  \ 和 npm CLI 8.19.1。它还会执行 npm install 命令，以下载 Angular 应用程序的所有依赖包。\n\n在完成所有必要的安装后，该插件接下来会执行\
  \ npm run build 命令，该命令将创建 Angular 应用程序的生产构建。\n\n- 2. 接下来，我们必须使用以下代码编辑 Angular 应用程序的\
  \ package.json 文件中的 npm build 脚本：\n\n```\n\"build\": \"ng build --configuration\
  \ production\",\n```\n\n上述代码告诉 Angular，npm run build 用于生产构建。\n\n3. 我们还必须编辑 Angular\
  \ 的 environment 文件夹中的 environment.prod.ts 文件。将代码改为：\n\n```\nexport const environment\
  \ = {\n  production: true,\n  apiURL: \"http://localhost:8080/api/v1\",\n  authURL:\
  \ \"http://localhost:8080\"\n};\n```\n\napiURL 和 authURL 只是临时的。我们会在应用程序的实际部署中更改它们，并使用真实的\
  \ API URL 和 Auth URL 属性。我们需要添加上述代码，因为在开发中我们在应用里使用了 apiURL 和 authURL，但缺少生产环境的值。\n\
  \n当应用程序为生产环境构建时，Angular 应用将从 environment.prod.ts 中获取值，而不是使用 environment.ts 文件。\n\
  \n现在，让我们了解 maven-antrun-plugin，并再次配置我们的 pom 文件。\n\n## 使用 maven-antrun-plugin\n\n\
  本节将在 Spring Boot 应用程序中使用 maven-antrun-plugin。打开你的 pom.xml 文件，将以下代码插入 build 块中的某个插件内，放在\
  \ frontend-maven-plugin 配置的下方：\n\n```\n<plugin>\n  <artifactId>maven-antrun-plugin</artifactId>\n\
  \  <executions>\n    <execution>\n      <phase>generate-resources</phase>\n    \
  \  <configuration>\n        <target>\n          <copy todir=\"${project.build.directory}/classes/public\"\
  >\n            <fileset dir=\"${project.basedir}/frontend/dist/superheroes\"/>\n\
  \          </copy>\n        </target>\n      </configuration>\n      <goals>\n \
  \       <goal>run</goal>\n```\n\n```\n</goals>\n</execution>\n</executions>\n</plugin>\n\
  ```\n\n这里，maven-antrun-plugin 的配置会在运行任务之前，将 \"${project.basedir}/frontend/dist/superheroes\"\
  \ 路径中的文件和文件夹复制并粘贴到 todir=\"${project.build.directory}/classes/public\" 路径中。这会将前端应用复制到\
  \ Spring Boot 的 JAR 文件的根文件夹中。\n\n现在，让我们配置应用的 Spring MVC 配置。\n\n## 实现 WebMvcConfigurer\n\
  \n在本节中，我们将通过添加配置文件，使 Spring Boot 应用程序成为 Angular 应用程序的宿主。为此，我们必须向 Spring Boot 应用程序的\
  \ config 目录中添加一个配置类，并将其命名为 MvcConfig。\n\n创建 MvcConfig 类后，将 WebMvcConfigurer 接口添加到文件中，如下所示：\n\
  \n```\n@Configuration\npublic class MvcConfig implements WebMvcConfigurer {\n  \
  \  @Override\n    public void addResourceHandlers(ResourceHandlerRegistry registry)\
  \ {\n... //See full code on https://github.com/PacktPublishing/Spring-Boot-and-Angular/tree/main/Chapter-16/superheroes\n\
  \    }\n}\n```\n\n前面的代码也可以在本章的 GitHub 仓库中找到。\n\nMvcConfig 类实现了 WebMvcConfigurer，并重写了\
  \ addResourceHandlers 方法。\n\n将 \"/**\" 参数传入 addResourceHandler，如下所示：\n\n```\naddResourceHandler(\"\
  /**\")\n```\n\n这将使配置影响所有项目路由。这部分属于应用程序面向外部的 URI。\n\n然后，将面向外部的 URI 路径映射到资源所在的目录，如下所示：\n\
  \n```\naddResourceLocations(\"classpath:/public/\")\n```\n\n最后，添加新的 ClassPathResource(\"\
  /public/index.html\")。这会将 Spring Boot 应用程序未处理的请求重定向到 Angular 应用程序或前端应用程序。\n\n我们很快就要将两个应用程序打包成一个了。下一节我们将学习如何做到这一点。\n\
  \n## 打包 Spring Boot\n\n在本节中，我们将打包 Spring Boot 应用程序和 Angular 应用程序。其思路是将两个应用程序合并，为你提供一个可部署的单一\
  \ JAR 文件。让我们学习如何做到这一点。\n\n在完成所有配置之后，现在只需按顺序运行以下 Maven 命令即可：\n\n```\nmvn clean\n\
  mvn package\n```\n\nmvn clean 命令通过删除 target 目录来清理 Maven 项目，而 mvn package 命令则构建 Maven\
  \ 项目并创建可执行的 JAR 文件。\n\n这两个 Maven 命令足以创建一个包含 Spring Boot 和 Angular 包的可执行 JAR 文件；参见图\
  \ 16.2：\n\n![](img/7c3ddd2e5893c9b5a0220148ed886548_400_0.png)\n\n图 16.2 – 包含 JAR\
  \ 文件的 target 文件夹\n\n打包应用程序很简单，因为我们已经完成了配置 Angular 和 Spring Boot 应用程序的所有艰巨工作。\n\n\
  现在，我们有了 JAR 文件。在下一节中，我们将使用 Java 命令运行 JAR 文件，看看一切是否正常。\n\n## 运行 JAR 文件\n\n在本节中，我们将运行打包好的\
  \ JAR 文件，并确认 Angular 应用程序能与 Spring Boot 应用程序通信。请按照以下步骤操作：\n\n- 1. 要运行应用程序，你可以使用\
  \ IntelliJ IDEA 的 **运行** 按钮，也可以使用以下 java 命令：\n\n```\njava -jar superheroes-0.0.1-SNAPSHOT.jar\n\
  ```\n\n上述 Java CLI 命令将运行一个可执行的 JAR 文件。在 CLI 中，你会看到 Tomcat Web 服务器已在 8080 端口启动。\n\
  \n- 2. 访问 http://localhost:8080；你将被重定向到 http://localhost:8080/login，其中包含一个登录表单。*图\
  \ 16.3* 展示了这个登录表单：\n\n![](img/7c3ddd2e5893c9b5a0220148ed886548_401_0.png)\n\n![](img/7c3ddd2e5893c9b5a0220148ed886548_401_1.png)\n\
  \n图 16.3 – 登录表单\n\n3. 尝试登录并导航到反英雄页面，你可以在该页面使用表单创建新的英雄或反派：\n\n![](img/7c3ddd2e5893c9b5a0220148ed886548_402_0.png)\n\
  \n图 16.4 – 反英雄表单\n\n图 16.4 显示反英雄表单一切正常，从登录到使用 CRUD 操作都没问题。\n\n至此，我们已经完成了 Spring\
  \ Boot 和 Angular 应用程序的打包。现在，让我们总结一下所学的内容。\n\n## 总结\n\n在本章中，你了解到 frontend-maven-plugin\
  \ 和 antrun-maven-plugin 插件可以帮助你将 Web 客户端和 Spring Boot 应用程序打包为一个可执行的 JAR 文件，从而使部署变得简单。你还学习了如何在本地机器上运行\
  \ JAR 文件，这有助于为应用程序的部署做准备。\n\n在下一章中，你将学习如何使用 GitHub Actions 为应用程序的部署做准备。你还将学习如何使用\
  \ Heroku 为应用程序创建数据库实例，然后将应用程序部署到 Heroku。\n\n\n\n"
- "## 17\n\n## 部署 Spring Boot 和 Angular 应用\n\n在上一章中，我们学习了 `frontend-maven-plugin`\
  \ 的作用以及我们使用它的原因。然后，我们学习了在 Spring Boot 应用中运行 Angular 应用所需的配置。之后，我们学习了如何将两个应用打包成一个文件。最后，我们学习了如何运行带有\
  \ Angular 的 Spring Boot 应用。\n\n本章将教你 GitHub Actions 的基础知识、Heroku 的基础知识，以及如何使用 Heroku\
  \ 部署应用。\n\n在本章中，我们将涵盖以下主题：\n\n- 了解 GitHub Actions\n- GitHub Actions 的组件\n- 设置 Heroku\n\
  - 创建 CI 工作流或流水线\n\n## 技术要求\n\n以下链接将带你到本章的完成版本：https://github.com/PacktPublishing/Spring-Boot-and-Angular/tree/main/Chapter-17/superheroes。\n\
  \n## 了解 GitHub Actions\n\n让我们先定义 **GitHub Actions**。该平台为开发者提供工作流自动化，并为 **持续集成和持续交付\
  \ (CI/CD)** 提供运营支持。它可以在有人创建拉取请求、创建问题、作为贡献者加入、合并拉取请求等时，使用脚本运行一系列操作。简而言之，你的 GitHub\
  \ 工作流中有多个事件，你可以利用这些事件运行一组特定的操作或脚本。\n\n现在，让我们回顾一下 GitHub Actions 的一些组件。\n\n## GitHub\
  \ Actions 的组件\n\n现在我们已经了解了 GitHub Actions 是什么，让我们看看帮助我们进行 DevOps 并在事件触发时运行工作流的 GitHub\
  \ Actions 组件。\n\n以下是 GitHub Actions 的组件：\n\n- **工作流**：这是一个存储在仓库目录中的可配置 YAML 文件，例如\
  \ `.github/workflows`，它可以手动运行作业、自动触发事件，或按计划执行。\n- **事件**：事件是仓库中的活动，会导致你的工作流开始运行。在工作流文件中常见的事件有\
  \ `pull_request`、`push` 和 `schedule`。然而，根据你的需求，其他事件也可能很有用。\n- **作业**：作业是工作流中的一组步骤（脚本或操作）。特定作业在整个步骤中都在同一个运行器上执行。\n\
  - **操作**：操作执行手头的任务或你需要的任何事情，例如检出你的仓库、构建你的应用、测试你的应用、扫描你的代码是否存在漏洞，或部署你的应用。\n- **运行器**：运行器只是服务器。你可以在\
  \ GitHub Actions 中选择 Ubuntu Linux、Microsoft Windows 或 macOS 运行器。然而，你并不限于这三种操作系统。你也可以拥有自托管运行器。\n\
  \n这些是我们在 *创建 CI 工作流或流水线* 部分后面会使用的 GitHub Actions 组件。但在此之前，我们将设置 Heroku，在那里我们将部署我们的全栈应用。\n\
  \n## 设置 Heroku\n\n在本节中，我们将使用 Heroku。它是一种 **平台即服务 (PaaS)**，让我们能够在云中构建和运行应用。让我们学习如何设置\
  \ Heroku 和我们的应用。\n\n## 创建 GitHub 和 Heroku 账号\n\n在本节中，我们将为 GitHub 创建一个账号，然后创建 Heroku\
  \ 账号。\n\n首先，我们必须通过访问 https://github.com/ 创建一个 GitHub 账号。我们将使用它作为我们项目的仓库。\n\n然后，我们必须通过访问\
  \ https://www.heroku.com/ 创建一个 Heroku 账号。这就是我们将部署应用并创建数据库实例的地方。\n\n## 在 Heroku 中创建新应用\n\
  \n登录 Heroku 后，点击页面右上角的 **New** 按钮，然后点击 **Create new app** 按钮以创建一个没有流水线的应用：\n\n![](img/7c3ddd2e5893c9b5a0220148ed886548_405_0.png)\n\
  \n图 17.1 – 创建新应用\n\n*图 17.1* 是为全栈应用创建新应用的地方。为应用命名任何你喜欢的名称并选择一个区域，但不要添加流水线。\n\n接下来，我们将为我们的全栈应用添加一个数据库。\n\
  \n## 添加 Postgres 数据库\n\n现在，让我们添加一个 Postgres 数据库：\n\n1. 转到 **Resources** 选项卡并点击 **Find\
  \ more add-ons** 按钮：\n\n![](img/7c3ddd2e5893c9b5a0220148ed886548_406_0.png)\n\n\
  图 17.2 – 查找更多插件\n\n*图 17.2* 显示了可以找到 **Find more add-ons** 按钮的位置。在这里你可以找到 Heroku\
  \ 插件以及用于开发、扩展和运营应用的各种工具和服务。一个例子可以在 *图 17.3* 中看到：\n\n![](img/7c3ddd2e5893c9b5a0220148ed886548_406_1.png)\n\
  \n图 17.3 – Heroku Postgres\n\n*图 17.3 显示了 Heroku Postgres 插件，它是一种基于 PostgreSQL 的\
  \ **数据库即服务 (DaaS)**。点击它，安装它，然后选择免费计划并将 Heroku Postgres 插件配置到你之前创建的全栈应用中。然后，点击 **Submit\
  \ Order Form** 按钮。*\n\n2. 返回到应用的 **Resources** 选项卡。你应该能看到 Heroku Postgres 插件。点击\
  \ Heroku Postgres 中的 Heroku 部分；将打开一个新标签页。\n\n我们几乎完成了数据库的添加。我们只需要添加一个 Dataclip，它将让我们为数据库创建\
  \ SQL 查询。\n\n3. 继续点击 **Create Dataclip** 按钮。然后，添加以下 SQL 查询：\n\n```\nset transaction\
  \ read write;\n\nCREATE EXTENSION IF NOT EXISTS \"uuid-ossp\";\n\nCREATE TABLE user_entity\n\
  (\n    id uuid PRIMARY KEY DEFAULT uuid_generate_v4(),\n    username VARCHAR(50)\
  \ UNIQUE NOT NULL,\n    password VARCHAR(50) NOT NULL,\n    email VARCHAR(255) UNIQUE\
  \ NOT NULL\n);\n\nCREATE TABLE anti_hero_entity\n(\n    id uuid PRIMARY KEY DEFAULT\
  \ uuid_generate_v4(),\n    firstName VARCHAR(50) UNIQUE NOT NULL,\n    lastName\
  \ VARCHAR(50) UNIQUE NOT NULL,\n    house VARCHAR(50) NULL,\n    knownAs VARCHAR(50)\
  \ NULL,\n    createdAt TIMESTAMP NULL\n);\n```\n\n4. 添加这些 SQL 查询到编辑器后，点击 **Save\
  \ & Run**。\n\n这样，数据库就创建好了。现在，让我们创建一个 `system.properties` 文件，在其中声明 Java 运行时版本和 Maven\
  \ 版本。\n\n3. 添加 CLIENT_URL 作为 Key 并添加应用的 URL 作为 Value：\n\n![](img/7c3ddd2e5893c9b5a0220148ed886548_409_0.png)\n\
  \n图 17.6 – 编辑配置变量\n\n图 17.6 显示了在添加环境变量或配置变量后表单的样子。\n\n不要忘记为你的 JWT secret 添加一个值。但是，请注意你的开发环境和生产环境应该有所不同。\n\
  \n4. 现在，打开 environment.prod.ts 文件并添加以下代码：\n\n```\nexport const environment = {\n\
  \  production: true,\n  // your Spring API URL\n  apiURL: \"https://full stack\n\
  \          javaangulartestapp.herokuapp.com/api/v1\",\n  // your heroku URL\n  authURL:\
  \ \"https://full stack\n          javaangulartestapp.herokuapp.com\"\n};\n```\n\n\
  上述代码将在生产环境中将 Angular 应用中 apiURL 和 authURL 的先前 localhost:8080 地址替换掉。\n\n接下来，我们需要将全栈应用仓库发布到\
  \ GitHub，因为我们将通过 GitHub 源代码控制部署应用。\n\n## Heroku 手动部署\n\n在本节中，我们将检查应用在部署后是否能无问题运行。请按照以下步骤操作：\n\
  \n1. 为此，转到 Heroku 仪表板中应用的 **Deploy** 选项卡：\n\n![](img/7c3ddd2e5893c9b5a0220148ed886548_410_0.png)\n\
  \n图 17.7 – 部署应用\n\n*图 17.7 显示了如何通过 Heroku 仪表板手动部署应用。使用 GitHub 作为部署方法，然后搜索你的仓库。*\n\
  \n2. 选择你的全栈应用仓库后，滚动到页面底部，在那里你会找到 **Manual deploy** 部分。然后，按下 **Deploy Branch** 按钮开始在\
  \ Heroku 中部署和运行应用：\n\n![](img/7c3ddd2e5893c9b5a0220148ed886548_411_0.png)\n\n*图\
  \ 17.8* 显示了 Heroku 的 **Manual deploy** 部分。\n\n3. 要检查一切是否正常工作，请等待部署完成，然后转到应用的 URL。\n\
  \n4. 注册一个新用户并尝试登录。确保打开浏览器的 **Network** 选项卡；你会看到请求是通过应用的 URL 发送的。请注意，来自服务器的响应具有 **Status\
  \ Code** **200** 或 **201**：\n\n![](img/7c3ddd2e5893c9b5a0220148ed886548_411_1.png)\n\
  \n*图 17.9* 显示了 Google Chrome 开发者工具中的 **Network** 选项卡。在这里，你可以看到 **register** 请求返回\
  \ **Status Code 201**。Angular、Spring Boot 和 Heroku Postgres 数据库完美运行。\n\n现在我们已经完成了全栈应用的手动部署，让我们使用\
  \ GitHub Actions 中的工作流创建自动部署。\n\n\n\n\n\n## 创建 CI 工作流或流水线\n\n在本节中，我们将使用 GitHub Actions\
  \ 中的工作流来自动化部署我们的全栈应用程序。请按照以下步骤操作：\n\n- 1. 进入你项目的 GitHub 仓库，然后点击 Actions 选项卡。搜索 Publish\
  \ Java Package 并选择 Maven 工作流：\n\n![](img/7c3ddd2e5893c9b5a0220148ed886548_412_0.png)\n\
  \n图 17.10 显示了用于构建 Maven 项目的基础且现成的 Maven 工作流。\n\n- 2. 通过用以下 YAML 配置替换它来更改编辑器中 YAML\
  \ 文件的内容：\n\n```\nname: CICD\n\non:\n  push:\n```\n```\nbranches:\n  - master\n\n\
  jobs:\n  test:\n    name: Build and Test\n    runs-on: ubuntu-latest\n    steps:\n\
  \      - uses: actions/checkout@v2\n      - name: Set up JDK 17\n        uses: actions/setup-java@v2\n\
  \        with:\n          java-version: '17.0.*'\n          distribution: 'temurin'\n\
  \          cache: maven\n      - name: test with Maven\n        run: mvn test\n\n\
  \  deploy:\n    name: Deploy to Heroku\n    runs-on: ubuntu-latest\n    needs: test\n\
  \    steps:\n      - uses: actions/checkout@v2\n        # This is the action\n \
  \     - uses: akhileshns/heroku-deploy@v3.12.12\n        with:\n          heroku_api_key:\
  \ ${{secrets.HEROKU_API_KEY}}\n          heroku_app_name: \"appname\" #Must be unique\n\
  \                          #in Heroku\n          heroku_email: \"email\"\n```\n\n\
  前面的代码是我们全栈应用程序的 CI/CD 工作流。它被称为 CI CD，因为这就是该工作流的用途。\n\n工作流有一个事件 push，如果 master 分支有推送，工作流就会运行。\n\
  \n工作流还包含两个作业：test 和 deploy。test 作业的步骤是检出代码、使用 Java 17 构建应用程序并运行测试。另一方面，deploy 作业的步骤是检出代码并使用\
  \ Heroku deploy 动作，该动作需要 Heroku API 密钥、应用程序名称和 Heroku 账户的电子邮件。\n\n- 3. 对于 Heroku\
  \ API 密钥，你需要进入 Heroku 仪表板上你的个人资料的 Account settings 菜单：\n\n![](img/7c3ddd2e5893c9b5a0220148ed886548_414_0.png)\n\
  \n图 17.11 显示了 Heroku 仪表板上我的个人资料下的 Account settings 菜单。\n\n- 4. 点击 Account settings，然后进入\
  \ API Key 并生成一个 API 密钥：\n\n![](img/7c3ddd2e5893c9b5a0220148ed886548_414_1.png)\n\
  \n图 17.12 显示了你可以在哪里生成 Heroku API 密钥。\n\n复制 Heroku API 密钥，因为你需要为 GitHub Actions 创建一个新的\
  \ Actions secret。\n\n- 5. 为此，进入你应用程序的 GitHub 仓库并打开一个新浏览器标签页以打开 **Settings** 选项卡，这样你就不会丢失你的工作流配置。\n\
  - 6. 然后，在文本区域中添加 API 密钥并将其命名为 HEROKU_API_KEY。这是你在工作流的 deploy 作业中将使用的密钥：\n\n![](img/7c3ddd2e5893c9b5a0220148ed886548_415_0.png)\n\
  \n图 17.13 – Actions secrets 表单\n\n*图 17.13 显示了你可以在哪里添加新的 Actions secret，以防止你的敏感值被任何人复制或读取。*\n\
  \n7. 添加新 secret 后，返回到你开始编辑工作流的浏览器标签页。然后，提交你正在编辑的文件：\n\n![](img/7c3ddd2e5893c9b5a0220148ed886548_416_0.png)\n\
  \n图 17.14 – 提交工作流\n\n图 17.14 显示了 Start commit 下拉菜单，你可以在其中提交新的工作流。新的 YAML 文件将被添加到你的仓库中，这意味着你以后可以\
  \ git pull 它，这样它就会在你的本地机器上。\n\n8. 在你提交工作流后，CI/CD 将启动。你可以通过进入 Actions 选项卡来查看 CI/CD\
  \ 工作流的进度：\n\n## 图 17.15 – 工作流状态\n\n图 17.15 显示了 CI/CD 工作流的当前状态。你可以看到它正在运行 Build and\
  \ Test 作业。\n\n- 9. 你也可以通过点击左侧边栏菜单中的作业名称来查看特定作业中正在发生的事情：\n\n## 图 17.16 – 步骤和操作状态\n\
  \n```\n16060 [INFO]\n16061 [INFO] added 979 packages, and audited 980 packages in\
  \ 22s\n16062\n16063 [INFO] 105 packages are looking for funding\n16064 [INFO] run\
  \ 'npm fund' for details\n```\n\n图 17.16 显示了 Build and Test 作业中每个步骤的输出日志。你也可以使用\
  \ GitHub Actions 的这一部分来调试导致作业和操作失败的错误。\n\n- 10. 在运行你创建的 CI/CD 工作流中的所有作业后，你会看到工作流旁边有一个绿色勾号图标，这意味着工作流已通过，一切正常：\n\
  \n![](img/7c3ddd2e5893c9b5a0220148ed886548_418_0.png)\n\n图 17.17 – 步骤和操作状态\n\n图\
  \ 17.17 显示了仓库 Actions 选项卡上通过的 GitHub 工作流。\n\n- 11. 最后，为了检查部署自动化是否已在 Heroku 云中部署我们的应用程序，我们必须返回到\
  \ Heroku 的概览仪表板并查找最新的活动：\n\n![](img/7c3ddd2e5893c9b5a0220148ed886548_418_1.png)\n\
  \n图 17.18 – Heroku 账户中 Latest activity 区域的构建成功\n\n图 17.18 显示了由 GitHub Actions 触发的构建已成功。你可以看到应用程序正在正确运行。\n\
  \n至此，我们已经使用 GitHub Actions 自动化了我们的 CI/CD 工作流。现在，让我们总结一下本章中学到的内容。\n\n## 总结\n\n至此，我们已经到达本书的最后一章；让我们回顾一下本章中你学到的宝贵内容。\n\
  \n首先，你了解到 GitHub Actions 使自动化所有软件工作流和执行 CI/CD 变得容易。你可以直接从 GitHub 构建、测试和部署代码。你还了解到\
  \ Heroku 是一个 PaaS，让你可以在云中完全构建、运行和操作应用程序。Heroku Postgres 是 Heroku 直接提供的托管 SQL 数据库服务，你可以将其用于你的应用程序。\n\
  \n所以，你已经坚持到这里。感谢你完成本书；我为你和你对学习新工具和事物的热情感到自豪。你可以将这里学到的知识应用到一个项目中，前提是你的项目的需求与本书中你学到的关于问题和解决方案相匹配。\n\
  \n本课程教会了你如何作为一名高级开发人员构建 Spring Boot 2 应用程序和 Angular 13 应用程序，为你的公司、客户和客户带来价值。\n\n\
  作为下一步，我的建议是购买一本关于独立 Spring Boot 2 或 Spring Boot 3 的 Packt 书籍，或一本 Angular 书籍，以巩固你从本书中学到的知识。\n\
  \n代表 Packt 团队和编辑，我们祝愿你在职业生涯和生活的各个阶段一切顺利。\n"
