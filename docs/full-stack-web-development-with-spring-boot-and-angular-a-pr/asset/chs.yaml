  \ the most common ways used now in the industry. Still, first things first: let’s\
  \ proceed with running our Spring Boot application.\n\nWe assume that you have already\
  \ generated your Spring Boot application with the needed dependencies. However,\
  \ if you have missed this part or are unsure whether all dependencies are included\
