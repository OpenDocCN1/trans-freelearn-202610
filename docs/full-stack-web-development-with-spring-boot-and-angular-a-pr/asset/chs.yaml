  ![](img/7c3ddd2e5893c9b5a022014ed886548_268_0.png)\n\n图 10.18 – 列表组件页面的布局\n\n我们现在已经使用\
  \ Material Design 创建了我们的反英雄页面组件。随着后续章节的进行，我们将实现操作按钮和表单组件的功能。\n\n## Summary\n\n至此，本章已结束。让我们回顾一下你学到的宝贵内容；你已学习了\
  \ Angular 的概念和基础知识，同时也学会了如何使用 Angular CLI 脚手架搭建 Angular 项目并创建组件、指令和模块。你还学习了一些组织\
  \ Angular 组件、模块以及项目其他部分的最佳实践。这对于项目的可维护性尤其有用，特别是对于企业级应用。\n\n在下一章中，我们将学习如何构建 Reactive\
  \ 表单、基本表单控件以及在 Angular 中分组表单控件。我们还将实现 FormBuilder 并验证表单输入。\n\n## Building Reactive\
  \ Forms\n\n在上一章中，我们已经学习了如何在模块和组件级别构建 Angular 应用程序，这促进了代码的可维护性，尤其是在企业级应用中。我们已将模块组织为三类：核心模块、共享模块和功能模块。我们还将组件分为两类：智能组件和哑组件，这将检索数据并具有依赖关系的组件与仅用于展示目的的组件分开。\n\
  \n我们还讨论了如何配置和实现 Angular Material，这是一个 UI 库，为我们的 Angular 应用提供即用型组件和基础样式。\n\n在本章中，我们现在将开始学习如何在\
  \ Angular 中使用响应式表单构建表单。我们将了解表单组、表单控件和表单数组，并在表单中创建验证。\n\n在本章中，我们将涵盖以下主题：\n\n- 理解响应式表单\n\
  - 基本表单控件\n- 分组表单控件\n- 使用 FormBuilder 服务生成控件\n- 验证表单输入\n\n### Technical requirements\n\
  \n以下是本章完成版本的链接：\n\nhttps://github.com/PacktPublishing/Spring-Boot-and-Angular/tree/main/Chapter-11\n\
  \n## Understanding reactive forms\n\n**Angular framework** 的一个优势是它已经提供了其表单扩展。一旦我们创建了\
  \ Angular 应用，就可以在 `@angular/forms` 包下找到这些扩展。有两种可用的表单构建方式。这些是 **template-driven forms**\
  \ 和 **reactive forms**；它们各自拥有表单扩展，这对开发者来说是有利的，因为这不需要安装额外的包来创建表单。\n\n同时，我们可以确保每个\
  \ Angular 应用都使用单一库来构建表单。在本节中，我们将更专注于如何在应用中实现响应式表单，因为这是开发 Angular 应用表单时常用的方法，但在进入响应式表单之前，让我们先讨论一下模板驱动方法的简要介绍。\n\
  \n## The template-driven approach\n\n模板驱动表单顾名思义，是在模板（HTML）上声明和验证的表单。它使用 ngForm 指令，将\
  \ HTML 表单转换为模板驱动表单并创建顶级 FormGroup，而 ngModel 指令则为表单元素创建 FormControl。\n\n要使用模板驱动表单，我们必须将\
  \ FormsModule 导入到想要使用模板驱动表单的模块中。在以下代码示例中，我们已将 FormsModule 导入到 `app.module.ts` 文件中：\n\
  \n```\n...\nimport { FormsModule } from '@angular/forms';\n@NgModule({\n  declarations:\
  \ [\n    AppComponent\n  ],\n  imports: [\n    BrowserModule,\n    AppRoutingModule,\n\
  \    FormsModule\n  ],\n  providers: [],\n  bootstrap: [AppComponent]\n})\nexport\
  \ class AppModule { }\n```\n\n我们一定不要忘记导入 FormsModule，因为我们的应用将无法识别 ngForm 和 ngModel\
  \ 指令。\n\n```\n```html\n<input type=\"text\" name=\"firstname\" ngModel>\n</p>\n\
  <p>\n    <label for=\"lastname\">Last Name</label>\n    <input type=\"text\" name=\"\
  lastname\" ngModel>\n</p>\n<p>\n    <label for=\"email\">Email </label>\n    <input\
  \ type=\"text\" id=\"email\" name=\"email\" ngModel>\n</p>\n</form>\n```\n```\n\n\
  最后，我们将添加一个 ngSubmit 事件来提交表单组件的数据。我们将 ngSubmit 事件添加到 form 标签中，并在组件类中添加一个方法来接收数据。让我们看一下以下代码示例：\n\
  \n```\n```text\n<!--HTML template -- >\n<form #userForm=\"ngForm\" (ngSubmit)=\"\
  onSubmit(userForm)\">\n\n<!--typescript file (Component class) -- >\nonSubmit(contactForm)\
  \ {\n    console.log(userForm.value);\n}\n```\n```\n\n在前面的代码示例中，一旦用户点击表单的 **Submit**\
  \ 按钮，这将调用 onSubmit( ) 方法，并将表单控件值作为 JSON 对象显示在我们的控制台中；这现在允许我们使用表单值在实现业务逻辑时发送数据。\n\
  \n成功实施所有步骤后，我们现在将拥有模板驱动表单的最终模板：\n\n```\n```html\n<form #userForm=\"ngForm\" (ngSubmit)=\"\
  onSubmit(userForm)\">\n<p>\n    <label for=\"firstname\">First Name</label>\n  \
  \  <input type=\"text\" name=\"firstname\" ngModel>\n</p>\n<p>\n    <label for=\"\
  lastname\">Last Name</label>\n    <input type=\"text\" name=\"lastname\" ngModel>\n\
  </p>\n```\n\n```\n<p>\n    <label for=\"email\">Email </label>\n    <input type=\"\
  text\" id=\"email\" name=\"email\" ngModel>\n</p>\n<button type=\"submit\">Submit</button>\n\
  </form>\n```\n\n## When to use template-driven forms\n\n模板驱动表单在 Angular 应用中非常灵活且易于实现。然而，这种方法有一些限制，并且在可维护性方面会产生影响；以下是使用模板驱动方法构建表单的最佳场景：\n\
  \n- 当从 AngularJS 迁移到 Angular2 时，使用模板驱动表单更容易，因为两者都使用 ngModel 指令。\n- 模板驱动表单更适合简单且小的表单，这些表单不需要复杂的验证，因为验证是在模板级别应用的。这可能是一个缺点，因为在大型应用中维护验证会很困难，同时它在对表单控件应用验证方面也有局限性。\n\
  \n在上述第二个场景中，响应式表单优先于模板驱动表单，因为复杂表单可以用响应式表单更好地处理，尤其是在实现验证方面。让我们现在了解响应式表单的概念。\n\n##\
  \ The reactive approach\n\n响应式表单是在 Angular 应用中构建表单的第二种方法；这是最常用的方法，因为它比模板驱动表单更有效地处理复杂表单。响应式表单也称为模型驱动表单，我们在组件类中定义表单的结构，而不是在模板中定义。\n\
  \n我们在将其绑定到 HTML 表单之前在类中定义验证，这意味着逻辑和验证模式现在将与 HTML 模板分离，并由组件的 TypeScript 部分维护。\n\n\
  ## Using reactive forms\n\n我们使用响应式表单的第一步是导入 ReactiveFormsModule；这通常导入到应用的根模块或共享模块中。ReactiveFormsModule\
  \ 包含所有指令——例如 formGroup 和 formControlName——这些指令将允许我们实现响应式表单；它也位于 @angular/forms 包下。\n\
  \n\n\n\n\n成功导入 `ReactiveFormsModule` 后，下一步是创建我们的 HTML 表单模板，并使用 `FormGroup`、`FormControl`\
  \ 和 `FormArray` 创建一个模型。这些是响应式表单的三个构建块，我们将用它们来绑定表单模板，并在下面更详细地介绍：\n\n- `FormControl`：这代表表单中单个表单元素；它存储表单元素的值，使我们能够从每个输入中检索数据。\n\
  - `FormArray`：这是一组表单控件，允许我们动态添加和删除控件以接受表单中的更多值。\n- `FormGroup`：这是一组表单控件；它也可以包含另一个表单组或表单数组。\n\
  \n假设我们有一个 `HeroesComponent`，我们将通过在类组件中编写以下代码来创建一个 `FormGroup`：\n\n```\nuserForm\
  \ = new FormGroup({})\n```\n\n在前面的代码示例中，我们实例化了一个新的 `FormGroup` 并将其分配给 `userForm`\
  \ 变量；这只是一个表单组，我们尚未向模型添加表单控件。要添加表单控件，我们将放置以下代码：\n\n```\nuserForm = new FormGroup({\n\
  \  email: new FormControl(),\n  firstName: new FormControl(),\n  lastName: new FormControl(),\n\
  });\n```\n\n我们可以看到在前面的示例中，我们向 `FormGroup` 添加了三个表单控件；现在它可以绑定到应用程序中的 HTML 表单模板，以捕获表单元素的值和状态。\n\
  \n让我们现在使用 `formGroup` 和 `formControlName` 指令创建一个 HTML 表单模板：\n\n```\n<form [formGroup]=\"\
  userForm\" (ngSubmit)=\"onSubmit()\">\n  <p>\n    <label for=\"email\">Email </label>\n\
  \    <input type=\"text\" id=\"email\" name=\"email\"\n      formControlName=\"\
  email\">\n  </p>\n  <p>\n    <label for=\"firstname\">First Name </label>\n```\n\
  \n```\n<input type=\"text\" id=\"firstname\" name=\"firstName\" formControlName=\"\
  firstname\">\n</p>\n<p>\n<label for=\"lastname\">Last Name </label>\n<input type=\"\
  text\" id=\"lastname\" name=\"lastname\" formControlName=\"lastName\">\n</p>\n<p>\n\
  <button type=\"submit\">Submit</button>\n</p>\n</form>\n```\n\n在示例代码中，我们可以看到模板几乎与模板驱动表单的模板相同。唯一的区别是我们使用\
  \ formGroup 和 formControlName 指令来绑定我们的表单。formGroup 指令用于绑定组件类中的 userForm 表单组；另一方面，formControlName\
  \ 指令用于绑定 userForm 表单组中定义的表单控件的值和状态。最后，我们仍然使用 ngSubmit 事件在表单中的提交按钮被点击时调用一个方法。\n\n\
  我们现在已在应用程序中成功创建了一个响应式表单，但这仅涵盖了响应式表单的基本功能和概念。本章的以下部分中，我们将讨论表单控件和表单组的功能和能力。\n\n##\
  \ 基本表单控件\n\n本节将现在讨论响应式表单中表单控件的更多概念。我们已经在上一节中创建了表单控件的示例，但现在，我们将了解有关 Angular 中表单控件的功能和能力的更多信息。\n\
  \n表单控件代表表单中单个表单元素；它们存储表单元素的值，使我们能够检索每个输入的数据。这可以是输入、textarea 或任何接受值的元素。在 Angular\
  \ 中使用时，表单控件可以通过添加 new FormControl('') 代码来实例化；我们可以看到它接受一个单一参数来定义控件的值。这些值可以为空，因为表单控件可以重置。\n\
  \n表单控件就像 JSON 对象的属性一样，但与 JSON 相比，每个控件都有其方法，可帮助我们控制、修改和验证值。\n\n接下来，让我们看看表单控件的不同方法和功能。\n\
  \n- `reset()`：将表单控件从其默认值重置。它还将控件标记为 pristine 和 untouched。\n\n**参数：**\n\n- `formState`：定义控件的初始值和禁用状态。\n\
  \n- `options`：一个对象，定义控件的配置，即值更改时如何传播更改并发出事件。我们可以在表单控件中设置以下选项：\n\n- `onlySelf`：设置为\
  \ `true` 时，控件的更改不会影响其他控件。\n\n以下是使用 reset() 方法的代码：\n\n```\nreset(formState?: TValue\
  \ | FormControlState<TValue>,\noptions?: { onlySelf?: boolean; emitEvent?: boolean;\
  \ }):\nvoid\n```\n\n- `registerOnChange()`：注册一个监听器，在表单控件值更改时发出事件。\n\n**参数：**\n\n\
  - `function`：值更改时调用的方法，如下所示：\n\n```\nregisterOnChange(fn: Function): void\n```\n\
  \n- `registerOnDisabledChange()`：注册一个监听器，在控件的 isDisabled 状态更改时发出事件。\n\n**参数：**\n\
  \n- `function`：禁用状态更改时调用的方法，如下所示：\n\n```\nregisterOnDisabledChange(fn: (isDisabled:\
  \ boolean) =>\nvoid): void\n```\n\n我们现在已经了解了可以在表单控件中使用的不同方法。现在，让我们看看一些表单控件不同用法的示例。\n\
  \n## 初始化表单控件\n\n有几种方法可以初始化我们的表单控件。我们可以设置特定表单控件的值、禁用状态和验证器。让我们看看以下示例：\n\n- **使用初始值初始化表单控件：**\n\
  \n```\nconst control = new FormControl('Hero!'); console.\nlog(control.value); //\
  \ Hero\n```\n\n在前面的代码示例中，我们使用默认值 Hero 实例化了一个表单控件。我们可以通过访问从 AbstractControl 继承的 value\
  \ 属性来访问值。\n\n- 使用初始值和禁用状态初始化表单控件：\n\n```\nconst control = new FormControl({ value:\
  \ 'Hero',\n  disabled: true });\n// get the status\nconsole.log(control.value, control.status);\
  \ //Hero,\n//DISABLED\n```\n\n在前面的代码示例中，我们使用对象值实例化了一个表单控件。这初始化了表单控件的值和禁用状态。我们可以通过访问从\
  \ AbstractControl 继承的 status 属性来访问值。\n\n- 使用初始值和内置验证器数组初始化表单控件：\n\n```\nconst control\
  \ = new FormControl('', [Validators.email,\nValidators.required]);\n// get the status\n\
  console.log(control.status); // INVALID\n```\n\n我们在前面的代码示例中使用空字符串值实例化了一个表单控件。第二个参数是一个验证器数组，这将返回无效状态，因为不应该有空值并且应该是有效的电子邮件格式。\n\
  \n## 重置表单控件\n\n我们可以使用 reset() 方法重置表单控件的值和禁用状态。让我们看看不同用法的以下代码示例：\n\n- 将控件重置为特定值：\n\
  \n```\nconst control = new FormControl('Tony Stark')\nconsole.log(control.value);\
  \ // Tony Stark\ncontrol.reset('Iron Man');\nconsole.log(control.value); // Iron\
  \ Man\n```\n\n在前面的代码示例中，我们使用参数使用了 reset() 方法。参数允许我们将表单控件重置为特定值。\n\n- 将控件重置为初始值：\n\
  \n```\nconst control = new FormControl('Tony Stark')\nconsole.log(control.value);\
  \ // Tony Stark\n```\n\n在前面的代码示例中，我们调用了具有 `Observable` 类型的 `statusChanges` 属性，我们可以订阅它以监听表单控件状态的更改。在这种情况下，一旦我们禁用表单控件，它将发出新的状态，即\
  \ `DISABLED`。\n\n我们已经了解了表单控件的功能和功能；现在，我们将讨论如何使用表单组和表单数组对表单控件进行分组。\n\n## 对表单控件进行分组\n\
  \n本节将现在讨论如何在应用程序中对表单控件进行分组。表单包含几个相关的控件，因此有必要对它们进行分组以获得更好的结构。响应式表单提供两种对表单控件进行分组的方式，如下所示：\n\
  \n- **表单组：** 创建一个具有固定表单控件集的表单。表单组也可以包含另一组表单组以处理复杂表单。\n- **表单数组：** 创建一个具有动态表单控件的表单。它可以添加和删除表单控件，同时也可以包含其他表单数组以处理复杂表单。\n\
  \n## 创建表单组\n\n表单组允许我们按组控制表单控件的值和状态。我们还可以使用其名称访问表单组内的单个表单控件。要创建表单组，让我们按照以下步骤操作：\n\
  \n- 1. 假设我们有一个 `HeroComponent`；例如，第一步是从 `@angular/forms` 包中导入 `FormGroup` 和 `FormControl`\
  \ 类，如下所示：\n\n```\n```typescript\nimport { FormGroup, FormControl } from '@angular/forms';\n\
  ```\n```\n\n- 2. 下一步是创建 `FormGroup` 实例。在此示例中，我们希望使用 `firstName`、`lastName` 和 `knownAs`\
  \ 表单控件创建一个新的表单组：\n\n```\n```typescript\nexport class HeroComponent {\n  heroForm\
  \ = new FormGroup({\n    firstName: new FormControl(''),\n    lastName: new FormControl(''),\n\
  \    knownAs: new FormControl('')\n  });\n}\n```\n```\n\n在前面的代码示例中，我们创建了一个名为 `heroForm`\
  \ 的新表单组。同时，我们将三个表单控件作为对象参数添加到 `heroForm` 表单中。\n\n\n\n\n3. 下一步是将表单组实例与视图中的表单元素进行绑定：\n\
  \n```\n<form [formGroup]=\" heroForm \">\n    <label for=\"first-name\">First Name:\
  \ </label>\n    <input id=\"first-name\" type=\"text\"\n        formControlName=\"\
  firstName\">\n    <label for=\"last-name\">Last Name: </label>\n    <input id=\"\
  last-name\" type=\"text\"\n        formControlName=\"lastName\">\n    <label for=\"\
  known-as\">Known As: </label>\n    <input id=\"known-as\" type=\"text\"\n      \
  \  formControlName=\"knownAs\"> </form>\n```\n\n在上面的代码示例中，我们使用了 formGroup 指令将 heroForm\
  \ 表单绑定到表单元素中。我们还必须使用 formControlName 指令将每个表单控件与输入元素绑定。\n\n4. 最后一步是获取整个表单组的值。我们将使用\
  \ ngSubmit 事件调用一个方法，并通过访问 value 属性来获取表单值，如下所示：\n\n```\n//hero.component.html\n<form\
  \ [formGroup]=\"heroForm\" (ngSubmit)=\"onSubmit()\">\n//hero.component.ts\nonSubmit()\
  \ {\n// Will display value of form group in a form of JSON\n    console.warn(this.heroForm.value);\n\
  }\n```\n\n我们已经创建并绑定了一个示例表单组，但这只是一个简单的表单组，它引入的是控件的线性结构。现在，让我们创建一个包含表单组的表单组。\n\n##\
  \ 创建嵌套表单组\n\n表单组也可以包含另一个表单组，而不是包含一组控件。想象一个 JSON 对象，它有属性的值是另一个 JSON 对象。这种对象无法通过简单的线性表单控件来处理，我们必须创建另一组表单组来容纳这种对象。\n\
  \n让我们按以下步骤来创建嵌套表单组：\n\n- 1. 我们将使用前面的表单示例；在这种情况下，我们想向表单中添加一个新的 address 属性，但并不是将它作为表单控件的新实例，而是将它声明为表单组的新实例：\n\
  \n```\n```typescript\nexport class HeroComponent {\n  heroForm = new FormGroup({\n\
  \    firstName: new FormControl(''),\n    lastName: new FormControl(''),\n    knownAs:\
  \ new FormControl(''),\n    address: new FormGroup({\n      street: new FormControl(''),\n\
  \      city: new FormControl(''),\n      country: new FormControl('')\n    })\n\
  \  });\n}\n```\n```\n\n在上面的代码示例中，我们添加了一个 `address` 属性作为新的表单组实例。我们还在表单组内部添加了新的表单控件，分别是\
  \ `street`、`city` 和 `country`。这现在被视为一个嵌套表单组。\n\n- 2. 下一步是将嵌套表单组绑定到视图中的表单元素：\n\n\
  ```\n```html\n<div formGroupName=\"address\">\n  <label for=\"street\">Street: </label>\n\
  \  <input id=\"street\" type=\"text\"\n    formControlName=\"street\">\n  <label\
  \ for=\"city\">City: </label>\n  <input id=\"city\" type=\"text\"\n    formControlName=\"\
  city\">\n\n  <label for=\"country\">Country: </label>\n  <input id=\"country\" type=\"\
  text\"\n    formControlName=\"country\">\n</div>\n```\n```\n\n在上面的代码示例中，我们使用了 formGroupName\
  \ 指令来绑定 address 表单组。请记住，这个元素应该位于 heroForm 表单组内部；我们还使用了 formControlName 指令来绑定嵌套表单组下的控件。现在，我们也可以像前面的例子那样再次使用\
  \ ngSubmit 事件，并调用 value 属性来获取整个表单的值。\n\n我们已经使用表单组创建了简单和复杂的表单。现在，让我们讨论另一种使用表单数组来分组控件的方式。\n\
  \n## 创建表单数组\n\n表单数组非常有用，尤其是当我们希望在运行时向表单中添加或移除控件时。这使我们能够在应用程序中拥有灵活的表单，同时处理更复杂的对象集合。要创建表单数组，让我们看一下以下步骤：\n\
  \n- 1. 我们将使用前面的表单示例；在这种情况下，我们想向表单中添加一个新的 powers 属性，并将其声明为一个新的 FormArray 实例：\n\n\
  ```\nexport class HeroComponent implements OnInit {\n  powerFormArray: FormArray;\n\
  \  constructor() {\n    this.powerFormArray=\n      this.heroForm.get(\"powers\"\
  ) as FormArray;\n  }\n  ngOnInit() {\n    heroForm = new FormGroup({\n      ...\
  \ controls from previous example\n      powers: new FormArray([])\n    })\n  }\n\
  }\n```\n\n在上面的代码示例中，我们在 heroForm 表单组内部创建了一个新的 FormArray 实例。它在初始化时接受一个空数组，不包含任何表单控件。我们还将这个表单数组的实例赋值给一个变量，以便在视图中访问该数组。\n\
  \n- 2. 下一步是创建能够在表单数组中添加和移除表单控件实例的方法：\n\n```\naddPower() {\n  (this.form.get(\"powers\"\
  ) as FormArray).push(new\nFormControl();\n}\ndeletePower(i: number) {\n  (this.form.get(\"\
  powers\") as\n    FormArray).removeAt(i);\n}\n```\n\n在上面的代码示例中，我们创建了两个将要用于表单数组的方法。`addPower()`\
  \ 方法允许我们在 power 表单数组中添加一个新的表单控件实例；它按名称获取表单数组的实例，并推入一个新的表单控件实例。\n\n另一方面，`deletePower()`\
  \ 方法按名称获取表单数组的实例，并使用 `removeAt()` 方法和要删除的控件的索引来移除特定的表单控件。\n\n- 3. 最后一步是将表单数组实例与视图中的表单元素进行绑定：\n\
  \n```\n<ng-container formArrayName=\"powers\">\n  <label for=\"tags\">Tags</label>\n\
  \  <div class=\"input-group mb-3\" *ngFor=\"let _ of powerFormArray.controls; index\
  \ as i\">\n    <input type=\"text\" class=\"form-control\" [formControlName]=\"\
  i\" placeholder=\"Power Name\">\n    <button (click)=\"deletePower(i)\" class=\"\
  btn btn-danger\" type=\"button\">Delete</button>\n  </div>\n  <button class=\"btn\
  \ btn-info me-md-2\" type=\"button\" (click)=\"addPower()\">Add</button>\n</ng-container>\n\
  ```\n\n在上面的代码示例中，我们使用 formArrayName 指令将 powers 表单数组与视图绑定。我们还使用了 ngFor 指令来遍历表单数组中的所有控件；我们还需要获取每个控件的索引，以便将其传递给\
  \ `deletePower()` 方法。\n\n成功创建表单数组后，我们现在可以看到表单的视图：\n\n![](img/7c3ddd2e5893c9b5a0220148ed886548_285_0.png)\n\
  \n图 11.1 – 带有表单组和表单数组的 Hero 表单\n\n我们已经成功使用表单组和表单数组创建了响应式表单。现在，我们将使用 FormBuilder\
  \ 服务来简化应用程序中创建表单的语法。\n\n## 使用 FormBuilder 服务生成控件\n\n在上一节中，我们使用表单组、表单数组和表单控件成功创建了响应式表单。然而，从语法中可以看出，创建表单变得重复。我们总是在实例化新的表单控件、表单数组和表单组实例，这在大型表单中并不理想。FormBuilder\
  \ 为这个问题提供了解决方案。\n\n这是一个可以注入到我们的组件中的服务，用于生成组、控件和数组，而无需实例化新的实例。要使用 FormBuilder 创建响应式表单，我们将遵循以下步骤：\n\
  \n- 1. 我们将使用 FormBuilder 改造上一节中的表单。第一步是从 @angular/forms 中将 FormBuilder 服务导入到我们的组件中：\n\
  \n```\nimport { FormBuilder } from '@angular/forms';\n```\n\n- 2. 下一步是将 FormBuilder\
  \ 服务注入到我们的组件中：\n\n```\nexport class HeroComponent implements OnInit {\n  powerFormArray:\
  \ FormArray;\n  constructor(private fb: FormBuilder) {}\n  ... code implementation\n\
  }\n```\n\n- 3. 最后一步是使用 FormBuilder 服务的方法来创建并生成控件：\n\n```\nexport class HeroComponent\
  \ implements OnInit {\n  heroForm = this.fb.group({\n    firstName: [''],\n    lastName:\
  \ [''],\n    knownAs: [''],\n    address: this.fb.group({\n      street: [''],\n\
  \      city: [''],\n      country: [''],\n    }),\n    powers: this.fb.array([])\n\
  \  });\n\n  constructor(private fb: FormBuilder) {}\n  ... code implementation\n\
  }\n```\n\n在上面的示例中，我们可以看到我们的表单与上一节创建的表单具有相同的结构。主要的区别在于我们使用 FormBuilder 的方法来创建表单。我们使用了\
  \ `group()` 方法生成表单组，`array()` 方法生成表单数组，并使用一个带有空字符串值的数组来生成控件并设置其默认值。\n\n\n\n\nThe\
  \ output for this code will be the same. FormBuilder methods are mainly for making\
  \ our reactive forms clean and readable. Now, we will discuss how to add validations\
  \ to our controls.\n\n## Validating form input\n\nWe have now created and simplified\
  \ our reactive form in the previous section, but we want to make our forms accurate\
  \ in accepting data and at the same time create a user-friendly experience for the\
  \ user to let them know easily what the valid values for each control are. Now,\
  \ we will learn how to add validations to our reactive forms.\n\nIn reactive forms,\
  \ we are adding validators as parameters directly to the form controls in the component\
  \ class instead of adding them as an attribute in the template.\n\n## Built-in validators\n\
  \nAngular provides several built-in validator functions that we can use directly\
  \ in our forms. Let’s have a look at some of these:\n\n- static min(min: number)\
  \ — Requires the value of the control to be equal to or greater than the given number:\n\
  \n```\nform = this.fb.group({\n  name: [10, [Validators.min(4)]]\n});\nconsole.log(this.form.status)\
  \ // returns VALID\nstatic max(max: number) - requires the value of the control\
  \ to be equal to or less than the given number.\nform = this.fb.group({\n  name:\
  \ [3, [Validators.max (4)]]\n});\nconsole.log(this.form.status) // returns VALID\n\
  ```\n\n- static required(control: AbstractControl<any, any>) — Controls must not\
  \ have a non-empty value:\n\n```\nform = this.fb.group({\n  name: ['test value',\
  \ [Validators.required]]\n});\nconsole.log(this.form.status) // returns VALID\n\
  ```\n\n- `static requiredTrue(control: AbstractControl<any, any>)`—Controls must\
  \ have a value of true:\n\n```\nform = this.fb.group({\n  name: [true, [Validators.requiredTrue]]\n\
  });\nconsole.log(this.form.status) // returns VALID\n```\n\n- `static minLength(minLength:\
  \ number)`—Used for arrays and strings, this requires that the length of the value\
  \ should be equal to or greater than the given number:\n\n```\nform = this.fb.group({\n\
  \  name: ['test', [Validators.minLength (4)]]\n});\nconsole.log(this.form.status)\
  \ // returns VALID\n```\n\n- `static maxLength(maxLength: number)`—Used for arrays\
  \ and strings, this requires that the length of the value should be equal to or\
  \ less than the given number:\n\n```\nform = this.fb.group({\n  name: ['test', [Validators.maxLength\
  \ (4)]]\n});\nconsole.log(this.form.status) // returns VALID\n```\n\n## Custom validators\n\
  \nOther than the built-in validators, we can also create custom validators, which\
  \ is helpful if our forms require more complex verification and checking.\n\nLet’s\
  \ have a look at the following example custom validator:\n\n```\nimport { AbstractControl,\
  \ ValidationErrors, ValidatorFn } from\n\"@angular/forms\";\nexport function checkHasNumberValidator():\
  \ ValidatorFn {\n  return (control: AbstractControl): ValidationErrors |\n    null\
  \ => {\n      const error = /\\d/.test(control.value);\n      return error ? {hasNumbers:\
  \ {value: control.value}} :\n        null;\n    };\n}\n```\n\n```\n```typescript\n\
  constructor(private fb: FormBuilder) {\n  this.form = this.fb.group({\n    id: [''],\n\
  \    firstName: [''],\n    lastName: [''],\n    house: [''],\n    knownAs: ['']\n\
  \  })\n}\n<!-- Please refer to the anti-hero-form.component.ts file\nin the GitHub\
  \ repo, Thank you -->\n```\n```\n\n- 2. Then, create an HTML template, like so:\n\
  \n```\n```html\n<!-- Please refer to the anti-hero-form.component.html\nfile in\
  \ the GitHub repo, Thank you -->\n```\n```\n\nIn the implemented code in our component\
  \ class, the first thing we did was create a form group object. We have added several\
  \ controls that resemble the properties of the anti-hero object. Our goal here is\
  \ to use the same form for creating and updating an anti-hero detail. In this case,\
  \ we have also added several Input() bindings and methods to our class to help the\
  \ form identify which actions are currently being done:\n\n- `selectedId`: This\
  \ will accept the ID of the anti-hero if the actions are updated.\n- `actionButtonLabel`:\
  \ This will change depending on the action being done (Create or Update).\n- `checkAction()`:\
  \ If selectedId has a value, this will change the value of actionButtonLabel to\
  \ \"Update\".\n- `patchDataValues()`: This will be used for patching the values\
  \ of the selected anti-hero in the form controls.\n- `emitAction()`: Emits the value\
  \ of the form and the action into the parent component.\n- `clear()`: Calls the\
  \ reset() method to clean the form.\n\n- 3. The next step is to use the anti-hero\
  \ form in our form page component. Under the `anti-hero/pages/form` file, we will\
  \ place the anti-hero form in the HTML template, and at the same time, check the\
  \ current route if it has the ID of the selected anti-hero in the parameters. Here\
  \ are the steps:\n\n- i. Add the anti-hero form to the HTML template:\n\n```\n```html\n\
  <app-anti-hero-form [selectedId]=\"id\"></app-anti-hero-form>\n```\n```\n\nii. Add\
  \ the activated router to capture the ID:\n\n```\n```typescript\nexport class FormComponent\
  \ implements OnInit {\n  id = \"\";\n  constructor(private router: ActivatedRoute)\
  \ { }\n  ngOnInit(): void {\n    this.id = this.router.snapshot.params['id'];\n\
  \  }\n}\n```\n```\n\n4. The next step is now to create a route for our page form\
  \ component. In the `anti-hero-routing.module.ts` file, we will add the following\
  \ entry to our routes:\n\n```\n```typescript\n{\n  path: \"form\",\n  children:\
  \ [\n    {\n      path: \"\",\n      component: FormComponent\n    },\n    {\n \
  \     path: \":id\",\n      component: FormComponent\n    }\n  ]\n},\n```\n```\n\
  \nIn the preceding code example, we have created two routes that redirect to FormComponent.\
  \ The first route is for the create action, which has a baseURL/anti-heroes/form\
  \ route, and the second route is for the update action, which has a baseURL/anti-heroes/form/:id\
  \ route. This means that we are using the same components for our two actions, and\
  \ the id parameters act as our indicator of which action is currently being done.\n\
  \n5. The last step is to add navigations to the list component. We will add several\
  \ methods that will call navigate methods to redirect us to the form component depending\
  \ on the selected action, as follows:\n\n- `list.component.html`:\n\n```\n```html\n\
  <!-- Dumb component command bar -->\n<app-anti-hero-command-bar\n```\n```\n\n```\n\
  (action)=\"executeCommandBarAction($event)\"></app-anti-hero-command-bar>\n<!--\
  \ Dumb component anti hero list -->\n<app-anti-hero-list [antiHeroes]=\"antiHeroes\"\
  \ (antiHero)=\"selectAntiHero($event)\" [headers]=\"headers\"></app-anti-hero-list>\n\
  ```\n\n- `list.component.ts`:\n\n```\nselectAntiHero(data: {antiHero: AntiHero,\
  \ action: TableActions}) {\n<!-- Please refer to the list.component.ts file in the\
  \ GitHub repo, Thank you-->\n    this.router.navigate(['anti-heroes', 'form', data.antiHero.id]);\n\
  }\nexecuteCommandBarAction(action: CommandBarActions) {\n    switch(action) {\n\
  \        case CommandBarActions.Create: {\n            this.router.navigate([\"\
  anti-heroes\", \"form\"]);\n            return;\n        }\n        case CommandBarActions.DeleteAll:\
  \ {\n            return;\n        }\n        default: \"\"\n    }\n}\n```\n\nAfter\
  \ accomplishing all the steps, we will now have the following form output:\n\n![](img/7c3ddd2e5893c9b5a0220148ed886548_293_0.png)\n\
  \nFigure 11.2 – Form UI for creating an anti-hero\n\n## Summary\n\nWith this, we\
  \ have reached the end of this chapter; let’s have a recap of the valuable things\
  \ you have learned. You have learned about the concepts and implementation of Angular\
  \ reactive forms, and we have implemented FormGroup, FormBuilder, and formControlName\
  \ directives to bind input values to capture data in our form. We have also discussed\
  \ how to group form controls for binding nested properties and create form arrays\
  \ in our reactive forms. This is primarily useful if some objects we want to display\
  \ have array values.\n\nAt the same time, we want to accept a list of entries from\
  \ users. Lastly, we have also learned how to implement validations for form controls\
  \ to handle and verify user input, which will be beneficial for the user experience\
  \ and help avoid unexpected errors.\n\nIn the next chapter, we will learn about\
  \ the concepts and implementation of state management in Angular applications; we\
  \ will discuss the idea of the Redux pattern and the NgRx library in terms of how\
  \ they can improve the application architecture.\n\n\n\n\n\n## 12"
- "## 使用 NgRx 管理状态\n\n在上一章中，我们学习了响应式表单的概念和特性。我们实现了 `FormGroup`、`FormBuilder` 和 `formControlName`\
  \ 来在应用程序的表单元素中绑定输入值。我们还讨论了如何对表单控件进行分组以绑定嵌套属性，并在响应式表单中创建表单数组。\n\n之后，我们学习了如何为表单控件实现验证以处理和验证用户输入。这将有利于用户体验并帮助我们避免意外的错误。\n\
  \n在本章中，我们将向我们的应用程序添加一个新的食谱，并学习如何实现状态管理，特别是 **NgRx**，以处理 Angular 应用程序中的数据。\n\n在本章中，我们将涵盖以下主题：\n\
  \n- 理解管理大型应用程序状态的复杂性\n- 状态管理与全局状态\n- 开始使用并设置 NgRx\n- 编写一个 action\n- 编写一个 effect\n\
  - 编写一个 reducer\n- 编写一个 selector 并在组件中使用 selector 并分派它\n- 配置 store\n\n## 技术要求\n\n\
  以下链接将带您进入本章代码的完成版本：https://github.com/PacktPublishing/Spring-Boot-and-Angular/tree/main/Chapter-12/superheroes。\n\
  \n在前面的图形说明中，我们可以看到我们有四个不同的服务负责管理不同类型的数据；每个功能都从这些服务中检索其所需的数据。\n\n正如我们所见，检索是分散的，因为功能从不同的源或服务检索数据。这导致了多个数据流，并且随着需要更多服务和功能而变得更大。\n\
  \n这也可能导致每个组件持有的数据不一致，因为来源来自不同的服务，从而导致应用程序中出现一些意外的错误。现在，让我们来看一下使用状态管理的数据流。\n\n##\
  \ 使用状态管理的数据流\n\n在之前的数据流中，我们看到数据流未得到优化，这可能导致应用程序出现若干问题，因为数据流的方向非常复杂。在 Angular 应用程序中实现状态管理时，我们将具有以下数据流：\n\
  \n![](img/7c3ddd2e5893c9b5a0220148ed886548_297_0.png)\n\n图 12.2 – 使用状态管理的数据流\n\n\
  在前面的图形说明中，我们可以看到应用程序的所有服务都由状态管理处理。我们仍然使用服务从数据库中检索数据。这里的显著区别在于，我们的功能现在是在状态中访问所有检索到的数据，而不是直接在服务中访问它。\n\
  \n这允许数据单向流动，并且所有在应用程序中使用的数据的来源只有一个。通过这种方法，可以避免状态不一致、可能的错误和多次 API 调用。\n\n有了这些，我们已经了解了状态管理在开发应用程序，特别是在企业级应用程序中的重要性。\n\
  \n现在，让我们讨论更多关于状态管理概念和全局状态的内容。\n\n## 状态管理与全局状态\n\n正如前一节所讨论的，状态管理是一个扩展或库，它允许我们在应用程序中以单一方向管理数据的流动。\n\
  \n这是由于全局状态的存在，全局状态将包含所有数据。为了了解状态管理的工作原理，让我们讨论状态管理的每个构建块。\n\n### 全局状态/store\n\n**全局状态**，也称为\
  \ **store**，是状态管理中最关键的元素。全局状态的主要职责是存储 API 检索到的所有数据，或简单地在应用程序中使用的所有数据。\n\n这意味着 Angular\
  \ 应用程序中的所有组件都将在全局状态中检索数据。将其视为 Angular 应用程序的数据库，但以 JSON 对象的形式存在，我们可以在其中获取每个属性作为切片。\n\
  \n### Actions\n\n**Actions** 表示应用程序中的唯一事件。它们直接在我们的组件中使用 `dispatch()` 函数调用，这有助于识别应执行哪些事件，例如修改状态或调用\
  \ API 以检索数据。\n\nActions 只是简单的接口；`type` 属性标识分派了什么 action。这个简单的字符串只是 action 的定义，我们可以向\
  \ actions 添加属性以获取 API 或状态所需的数据。\n\n让我们看一个 action 接口的示例：\n\n```\n{\n  type: '[Blog]\
  \ Add Blog',\n  title: string;\n  author: string;\n  content: string;\n}\n```\n\n\
  前面的示例 action 在创建新博客时被分派。这是在点击 **Submit** 按钮时调用的，并且诸如 `title`、`author` 和 `content`\
  \ 之类的信息被添加为附加元数据以传递给 effect 或 reducer。\n\n### Reducers\n\n**Reducers** 是状态管理的决策者。它们根据\
  \ action 类型决定处理哪些 action。Reducers 也是可以更改状态值的对象。\n\nReducers 是纯函数并同步处理状态转换；让我们看一个\
  \ reducer 的示例：\n\n```\n```typescript\nexport const blogReducer = createReducer(\
  \ initialState,\n  on(BlogActions.addBlog, (state, {blog}) => ({ ...state,\n   \
  \ blogs: [...state.blogs, blog]})\n  );\n```\n```\n\n在前面的示例中，我们为 `addBlog()` action\
  \ 创建了一个 reducer。这允许我们在分派 `addBlog()` action 后在博客的状态中添加一个新的博客对象。\n\n我们将在本章的 *Writing\
  \ a reducer* 部分更详细地讨论 reducers。\n\n### Selectors\n\n**Selectors** 是纯函数，允许我们检索 store\
  \ 中的数据切片。它是一种变更检测机制，当状态的值发生变化时，它会比较状态的部分，并且只有在检测到更改时才发送状态。这是一种称为 **memorization**\
  \ 的做法。\n\nSelectors 在组件中使用以获取 UI 中使用的数据。它作为 Observable 返回，监听状态变化。\n\n让我们看一个 selector\
  \ 的示例：\n\n```\n```typescript\n// selector for list of blogs\n// blog.selector.ts\n\
  export const selectBlogList = (state: AppState) => state.blogs;\n\n// blog component\n\
  // blog.component.ts\nblogs$ = this.store.select<Array<Blog>>(selectBlogList);\n\
  \  this.blogs$.subscribe(data => {\n```\n```\n\n```\nconsole.log(data) // list of\
  \ blogs from the state;\n});\n```\n\n在前面的示例中，我们为博客切片创建了一个 selector，以及一个返回博客元数据的函数，称为\
  \ selectBlogList()。我们在博客组件中使用此函数作为 select 函数的参数以通过订阅 selector 检索数据。订阅将在博客切片的值发生变化时发出。我们将在本章的下一节更详细地讨论\
  \ selectors。\n\n### Effects\n\nEffects 是 NgRx 库使用的特定元素；这是一个由 RxJs 驱动的副作用模型，处理外部交互，例如\
  \ API 调用、WebSocket 消息和基于时间的事件。使用 effects，我们可以将组件与外部源的交互隔离并减少其职责。让我们看一下有副作用和没有副作用的应用程序之间的比较。\n\
  \n### 没有副作用的应用程序\n\n以下是没有副作用的应用程序：\n\n```\nexport class BlogPageComponent {\n  movies:\
  \ Blog[];\n  constructor(private blogService: MoviService) {}\n  ngOnInit() {\n\
  \    this.blogService\n      .getAll()\n      .subscribe(blogs => this.blogs = blogs);\n\
  \  }\n}\n```\n\n在前面的代码示例中，我们有一个组件具有以下几个职责：\n\n- 管理博客的状态（组件具有其博客状态）\n- 使用博客服务调用外部\
  \ API 以获取博客列表\n- 在组件内部修改博客的状态\n\n这意味着每个具有服务依赖的组件也都有其数据状态。现在，让我们看一个有副作用的应用程序的示例。\n\
  \n\n\n\n\n## 带有副作用的应用\n\n下面是一个带有副作用的应用：\n\n```typescript\nexport class BlogsPageComponent\
  \ {\n  blogs$: Observable<Blog[]> = this.store.select(state =>\n    state.blog);\n\
  \n  constructor(private store: Store<{ blogs: Blog[] }>) {}\n\n  ngOnInit() {\n\
  \    this.store.dispatch({ type: '[Blog Page] Load Blog' });\n  }\n}\n```\n\n在前面的代码示例中，我们可以看到博客页面组件的代码已被精简，同时其职责也变得不那么复杂。现在，组件的职责是派发一个\
  \ action，以便 effect 能够识别需要调用哪个服务来检索数据。\n\n让我们来看一个博客状态的 effect 示例：\n\n```typescript\n\
  @Injectable()\nexport class BlogEffects {\n  loadBlogs$ = createEffect(() => this.actions$.pipe(\n\
  \    ofType('[Blog Page] Load Blog'),\n    mergeMap(() => this.blogService\n   \
  \   .getAll().pipe(\n        map(blogs => ({ type: '[Blogs API] Blogs Loaded Success',\
  \ payload: blogs })),\n        catchError(() => EMPTY)\n      )\n    )\n  );\n \
  \ constructor(private actions$: Actions,\n              private blogService: BlogService)\
  \ {}\n}\n```\n\n在前面的代码示例中，我们创建了一个名为 loadBlogs$ 的新 effect。该 effect 负责调用 blog 服务中的\
  \ getAll() 方法从外部端点检索博客列表。同时，它还负责派发一个新的 action，将检索到的博客列表传递给 reducer 以修改 store。我们将在本章下一节讨论如何编写\
  \ effects。\n\n至此，我们已经看到了构成状态管理的全部构建块。让我们来看一个关于状态管理中数据流的详细图形说明：\n\n![](img/7c3ddd2e5893c9b5a0220148ed886548_302_0.png)\n\
  \n图 12.3 – 使用 NgRx 状态管理时的数据流\n\n在前面的图形说明中，我们可以看到我们的 UI 组件只有一个职责，那就是派发 action。如果\
  \ action 需要调用 API，则会调用 effect 使用服务来调用 API，并在获取到响应数据后，effect 还会派发一个 action 来调用 reducer\
  \ 修改 store。\n\n另一方面，如果从组件发送的 action 会改变状态，则不需要任何副作用，并调用与该 action 类型匹配的 reducer。store\
  \ 中的所有更改都将被 selectors 检测到，并向 UI 组件发出最新状态以供使用。\n\n至此，我们已经了解了围绕状态管理的必要概念以及数据流与状态管理的构建块。在下一节中，我们将学习如何设置和配置\
  \ Angular 中最著名的状态管理库之一：NgRx。\n\n## 开始使用并设置 NgRx\n\n要使用 NgRx 状态管理，我们必须安装 @ngrx/store\
  \ 库；它将包含允许我们配置 store 并创建 reducer 和 action 的所有函数。\n\n要安装 @ngrx/store 库，我们必须执行以下命令：\n\
  \n```\nng add @ngrx/store\n```\n\n前面的命令将执行以下步骤：\n\n- 1. 更新 package.json，通过将 @ngrx/store\
  \ 添加到依赖项中。\n- 2. 运行 npm install 以安装依赖项。\n- 3. 更新 src/app/app.module.ts，通过将 StoreModule.forRoot(reducers,\
  \ {}) 添加到 imports 数组中。\n\n在执行此命令之前，请确保 @ngrx/store 的版本与您的 Angular 版本保持一致；在我们的项目中，我们的\
  \ Angular 版本是 13.3.0，这意味着我们需要使用 @ngrx/store 的 13 版本。\n\n还提供了一些标志，允许我们使用自定义设置安装 @ngrx/store。以下是我们可以使用的一系列标志：\n\
  \n- - --path: 指定要导入 StoreModule 的模块的路径。\n- - --project: 在 angular.json 中定义项目的名称。\n\
  - - --module: 包含要导入 StoreModule 的模块的文件名。\n- - --minimal: 如果设置为 true，则提供根状态管理的最小设置。它在模块中导入\
  \ StoreModule.forRoot() 并使用空对象。\n- - --statePath: 状态将被创建的路径。\n- - --stateInterface:\
  \ 定义状态的接口。\n\n## 将 NgRx 添加到我们的 Angular 项目中\n\n现在，让我们将其添加到我们的 Angular 项目中。我们只想使用最小设置，因为我们将逐步添加\
  \ reducer 和 store。成功执行 ng add @ngrx/store 命令后，我们的项目中将有以下更改：\n\n```\n// app.module.ts\n\
  imports: [\n  ... other modules\n  StoreModule.forRoot({}, {}),\n```\n\n在前面的代码示例中，我们可以看到一个名为\
  \ `StoreDevtoolsModule` 的新模块已被添加；这将允许我们在本地运行应用程序时使用 DevTools。\n\n使用 DevTools 的下一步是向浏览器添加\
  \ Redux 扩展。要添加此扩展，请前往以下链接之一以获取您各自的浏览器：\n\n- - **Google Chrome:** `https://chrome.google.com/webstore/detail/redux-devtools/lmhkpm...`\n\
  - - **Mozilla Firefox:** `https://addons.mozilla.org/en-US/firefox/addon/reduxdevtools/`\n\
  \n在首选浏览器中添加此扩展后，使用导入的 `StoreDevToolModule` 模块运行 Angular 项目将被此扩展自动检测到。它将提供一个用于查看状态的界面：\n\
  \n![](img/7c3ddd2e5893c9b5a0220148ed886548_305_0.png)\n\n图 12.4 – Redux DevTools\
  \ 扩展的界面\n\n前面的屏幕截图显示我们的 Redux DevTools 扩展已被激活；一旦我们在浏览器标签中打开 Angular 项目，随着我们编写代码，我们将看到更多\
  \ Redux DevTools 的实际效果。\n\n现在我们已经配置了 store 并在应用程序中安装了 NgRx DevTools，我们准备好为我们的状态管理编写构建块了。\n\
  \n## 编写 action\n\n状态管理的第一个构建块是我们将编写 action。在编写 action 时，我们可以遵循一些规则，以便在应用程序中拥有良好的\
  \ action：\n\n- - **Upfront**: 编写 action 应该始终在开发功能之前进行。这为我们提供了应用程序中应实现内容的概览。\n- -\
  \ **Divide**: 我们应该始终根据事件来源和相关数据对 action 进行分类。\n- - **Many**: 编写更多数量的 action 并不是问题。它更有益，因为更多的\
  \ action 能更好地概述应用程序的流程。\n- - **Event-Driven**: 在您将事件的描述与其处理方式分开时捕获 *事件*。\n- - **Descriptive**:\
  \ 始终使用 type 元数据提供有意义的信息。这有助于调试状态。\n\n让我们来看一个将博客列表设置到我们状态中的示例 action：\n\n```\nimport\
  \ { createAction, props } from '@ngrx/store';\nexport const setBlogList = createAction(\n\
  \  '[Blog] Set Blog List',\n  props<{ blogs: ReadonlyArray<Blog> }>(),\n);\n```\n\
  \n在前面的代码示例中，我们使用了 `createAction()` 函数来创建我们的 action。`createAction()` 函数还返回一个返回 action\
  \ 接口对象的函数；在这种情况下，它将返回 \"[Blog] Set blog list\" 作为 action 类型，并将博客数组作为附加属性。\n\n要派发\
  \ action，我们将使用 `dispatch()` 函数并使用 `setBlogList` 作为参数：\n\n```\nngOnInit() {\n   \
  \ store.dispatch(setBlogList({ blogs: this.blogs }));\n}\n```\n\n## 在项目中实现 action\n\
  \n我们项目的首要目标是创建整个周期，从我们的 API 获取反英雄列表并将其放入我们的 store。第一步是获取我们需要的 action；让我们来看一下我们应该为此功能创建的两个\
  \ action：\n\n- - `getAntiHeroList`: 此 action 将从我们的 Spring 项目提供的外部 API 中检索博客列表。\n\
  - - `setAntiHeroList`: 此 action 将检索到的博客列表放入我们的 store。\n\n\n\n\n\n现在我们已经确定了要创建的操作列表，在\
  \ `anti-heroes` 文件夹中，我们将创建一个 `state/anti-hero.actions.ts` 文件，在其中放置所有操作。\n\n让我们在\
  \ `anti-hero.actions.ts` 文件中放置以下代码：\n\n```\n```typescript\nimport { createAction,\
  \ props } from '@ngrx/store';\nimport { AntiHero } from '../models/anti-hero.interface';\n\
  export enum AntiHeroActions {\n  GET_ANTI_HERO_LIST = '[Anti-Hero] Get Anti-Hero\
  \ list',\n  SET_ANTI_HERO_LIST = '[Anti-Hero] Set Anti-Hero list',\n}\nexport const\
  \ getAntiHeroList = createAction(\n  AntiHeroActions.GET_ANTI_HERO_LIST,\n);\nexport\
  \ const setAntiHeroList = createAction(\n  AntiHeroActions.SET_ANTI_HERO_LIST,\n\
  \  props<{ antiHeroes: ReadonlyArray<AntiHero> }>(),\n);\n```\n```\n\n在前面的代码示例中，我们创建了两个用于获取和设置反英雄列表的操作。第一个操作\
  \ `getAntiHeroList` 只有一个参数，即类型。这不需要任何附加属性，因为它只会调用 API 通过 effects 获取反英雄列表。\n\n另一方面，第二个操作\
  \ `setAntiHeroList` 有两个参数：类型和一个名为 `antiHero` 的附加属性。这将通过 reducers 使用检索到的反英雄列表设置 store\
  \ 的值。\n\n将我们的操作定义设为代码中的枚举也是非常优秀的做法，因为这将帮助我们在应用程序的其他部分使用定义时避免拼写错误。\n\n至此，我们已成功创建了反英雄列表功能所需的\
  \ action。现在，我们将讨论如何编写 effects 来调用 API 并检索反英雄列表。\n\n## 编写 effect\n\n我们在上一节中成功创建了操作。现在，我们将创建\
  \ effects，使其负责调用我们的外部 API。\n\nEffects 不包含在 `@ngrx/store` 库中；我们将安装一个单独的库，以便能够使用 effects\
  \ 的函数。\n\n要在我们的应用程序中安装 effects，我们必须执行以下命令：\n\n```\nng add @ngrx/effects\n```\n\n\
  前面的命令将执行以下步骤：\n\n- 1. 使用 @ngrx/effects 依赖项更新 package.json 文件。\n- 2. 运行 npm install\
  \ 以安装添加的依赖项。\n- 3. 将 EffectsModule.forRoot() 添加到 app.module.ts 文件的 imports 数组中。\n\
  \n有一些可用的标志允许我们使用自定义设置安装 @ngrx/effects；以下是我们可以使用的一系列标志：\n\n- - --path: 指定要导入 EffectsModule\
  \ 的模块的路径。\n- - --project: angular.json 中定义项目的名称。\n- - --skipTests: 当设置为 false 时，这会创建一个测试文件。\n\
  - - --module: 包含要导入 EffectsModule 的模块的文件的名称。\n- - --minimal: 如果设置为 true，则提供根 effects\
  \ 的最小设置。它在模块中导入 EffectsModule.forRoot() 并使用空对象。\n- - --group: 将 effects 文件分组到 effects\
  \ 文件夹中。\n\n在成功将 effect 的依赖项添加到我们的应用程序后，我们可以创建我们的 effects。在 anti-heroes/state 文件夹下，我们必须创建一个名为\
  \ anti-hero.effects.ts 的新文件。我们需要做的第一件事是创建一个具有 @Injectable 注解的类：\n\n```\n@Injectable()\n\
  export class AntiHeroEffects {\n  constructor(\n    private actions$: Actions,\n\
  \    private antiHeroService: AntiHeroService,\n    private router: Router\n  )\
  \ {}\n}\n```\n\n在前面的代码示例中，我们可以看到 effects 也是服务类，可以被其他服务注入；我们已将以下服务注入到 AntiHeroEffects\
  \ 中：\n\n- - Actions: 来自 @ngrx/effects 的服务，返回我们可以分配类型的可观察对象。这将在分派 action 时充当标识符。\n\
  - - **AntiHeroService**: 我们创建的服务，其中包含反英雄的外部 API，位于 `anti-hero/services/anti-hero.service.ts`\
  \ 下。\n- - **Router**: 在 API 调用后用于重定向。\n\n在创建我们的 `AntiHeroEffect` 类并注入我们的服务后，我们可以开始创建我们的\
  \ effects。我们首先需要考虑的是，由于我们有 `GET_ANTI_HERO_LIST` 和 `SET_ANTI_HERO_LIST` 操作，我们需要哪种类型的\
  \ effect 来获取反英雄。\n\n我们应该创建一个类型为 `GET_ANTI_HERO_LIST` 的 effect，并且可以调用 `AntiHeroService`\
  \ 中的 `getAntiHeroes()` 函数。\n\n要创建此 API，我们可以编写以下代码：\n\n```\n```typescript\nimport\
  \ { Actions, createEffect, ofType } from '@ngrx/effects';\ngetAntiHeroes$ = createEffect(()\
  \ => {\n    return this.actions$.pipe(\n        ofType(AntiHeroActions.GET_ANTI_HERO_LIST),\n\
  \        mergeMap(() => this.antiHeroService.getAntiHeroes()\n        )\n    },\
  \ {dispatch: true}\n);\n```\n```\n\n在前面的代码示例中，我们使用 `createEffect()` 函数创建了我们的 effects；它返回一个具有两个参数的\
  \ action：\n\n- - `ofType(AntiHeroActions.GET_ANTI_HERO_LIST)`: 第一个参数使用 `ofType`\
  \ 操作符，定义了 effect 的 action 类型。这意味着如果分派了 `GET_ANTI_HERO_LIST` action，则会调用此 effect。\n\
