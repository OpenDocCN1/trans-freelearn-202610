  selectAntiHero(element, 0)\" mat-raised-button color=\"primary\" data-cy=\"view\"\
  >\n                <mat-icon>pageview</mat-icon> View\n            </button>\n \
  \           &nbsp;\n            <button (click)=\"selectAntiHero(element, 1)\" mat-raised-button\
  \ color=\"warn\" data-cy=\"delete\">\n                <mat-icon>delete</mat-icon>\
