- pgno: 399
  md: 'This is how the Lakehouse_Storage_Account template can be deployed using Bash.
    Invoke the following commands using Azure Cloud Shell:


    ```

    RESOURCEGROUPNAME="elz_prod"

    LOCATION="eastus"

    IAC_ENVIRONMENT=prod

    FILE_PATH=~/Data-Engineering-with-Apache-Spark-Delta-Lake-and-Lakehouse/project/infra

    TEMPLATE_FILE=$FILE_PATH/storage_accounts/storage_accounts.json

    PARAMETERS_FILE=$FILE_PATH/parameters/$IAC_ENVIRONMENT/storage_accounts_parameters.json

    az group create --name $RESOURCEGROUPNAME --location $LOCATION

    az deployment group create --name Lakehouse_Storage_Account --resource-group $RESOURCEGROUPNAME
    --template-file $TEMPLATE_FILE --parameters $PARAMETERS_FILE

    ```


    As we can see, it is pretty straightforward and easy to do.


    # Deploying ARM templates containing secrets


    In the previous section, we deployed a relatively simple ARM template. The complexity
    of the template increases if the Azure resources require administrator credentials
    to be set while creating the resource itself. Since we are creating the infrastructure
    using code, it is unsafe and against security practices to leave exposed reference
    passwords in configuration files. In such cases, the security aspect of the template
    needs to be properly addressed. This security issue is frequently encountered
    when spinning up resources such as Azure SQL and Azure Synapse. Fortunately, Azure
    ARM can easily accommodate this requirement. It can retrieve secrets from Azure
    Key Vault at runtime during the deployment process. The process starts by creating
    the infrastructure secrets in Azure Key Vault. This is how it is done:


    +   1. Run the following commands in Azure Cloud Shell:


    ```

    RESOURCEGROUPNAME="elz_prod"

    LOCATION="eastus"

    KEYVAULTNAME="deploykvelz"

    az group create --name $RESOURCEGROUPNAME --location $LOCATION

    az keyvault purge -n $KEYVAULTNAME

    az config set extension.use_dynamic_install=yes_without_prompt

    ```'
  merge: -1
  img_proc: true
- pgno: 400
  md: '```

    az keyvault create --location $LOCATION --name $KEYVAULTNAME --resource-group
    $RESOURCEGROUPNAME --enabled-for-template-deployment true

    ```


    If run correctly, you should see the following output:


    ![](img/dae8a2243a3c3cbcd9c56ff3d2217672_400_0.png)


    Figure 11.16 – Output of the new Azure Key Vault creation


    2. We will now add secrets to the newly created Azure Key Vault. Using the Azure
    portal, navigate to Home | Resource group | elz_prod | deploykvelz.


    Click on Secrets. Then create two new secrets using Generate/Import:


    +   - Name: SQLUSER   Value: salesadmin


    +   - Name: SQLPASSWORD   Value: <password for Azure SQL administrator>


    ![](img/dae8a2243a3c3cbcd9c56ff3d2217672_400_1.png)


    Figure 11.17 – Checking newly created secrets in Azure Key Vault'
  merge: -1
