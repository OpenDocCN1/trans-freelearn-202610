- pgno: 123
  md: '# The pipeline design


    This is what the data pipeline design for the Electroniz lakehouse looks like.
    We will have four pipelines, as follows:


    +   - The batch ingestion pipeline – the bronze layer

    +   - The streaming ingestion pipeline – the bronze layer

    +   - The curation pipeline – the silver layer

    +   - The aggregation pipeline – the gold layer


    These pipelines can be viewed in the following diagram:


    ![](img/dae8a2243a3c3cbcd9c56ff3d2217672_123_0.png)


    Figure 5.2 – The Electroniz pipeline design


    We will explore all of the preceding components in more detail, as follows:


    +   - The batch ingestion pipeline: The batch pipeline will ingest data for four
    data sources – the sales database, currency conversion, geo-location, and website
    tracking. This pipeline is created and invoked using Azure Data Factory.

    +   - The streaming ingestion pipeline: The streaming pipeline is a continuously
    running pipeline that continuously watches for new events in the messaging layer.
    New events are promptly saved to Azure Data Lake Storage every 2 minutes using
    capture events. This pipeline is created and invoked using Azure Event Hubs.'
  merge: -1
  img_proc: true
- pgno: 124
  md: '+   - **The curation pipeline:** The curation pipeline will trigger automatically
    depending on the success of the batch ingestion pipeline. When invoked, it will
    merge data collected over the last hour from the batch and streaming pipelines
    into delta tables. In the same process, **data standardization** and data masking
    rules will be applied to the data to make it ready for consumption purposes. **Data
    masking** is essential in order to satisfy **PCI** compliance requirements.

    +   - **The aggregation pipeline:** The aggregation pipeline will be triggered
    automatically depending on the success of the curation pipeline. When invoked,
    it will aggregate data available in the silver layer for sales and inventory purposes.


    # The deployment strategy


    Following best practices, the deployment of the **Electroniz** lakehouse will
    be performed using CI/CD pipelines. Deployments are done using **Azure Pipelines**
    and **Azure Resource Manager** templates. At a high level, the CI/CD process will
    function as follows:


    +   - Developers will author and unit test the data factory pipelines in their
    respective feature branches.

    +   - On completion of the coding, the developer will generate a pull request
    for a code review by the team.

    +   - After the code review and approval by the team, the developer''s code branch
    is merged with the main branch.

    +   - When ready for deployment, the main branch is deployed in the development
    environment. This initiates the creation of the Azure Data Factory artifact branch
    (`adf_publish`). This branch is automatically created by the **Azure Data Factory**
    service.

    +   - To deploy code in UAT, a **release** is created in Azure Pipelines using
    the `adf_publish` branch. This release is deployed in the UAT environment.

    +   - After successful verification and testing, the same release is pushed to
    the production environment.


