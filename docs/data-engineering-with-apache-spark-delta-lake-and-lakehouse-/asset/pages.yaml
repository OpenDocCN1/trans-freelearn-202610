- pgno: 48
  md: 'Object storage is quickly becoming the standard for data engineering and analytics
    operations due to certain key advantages, listed here:


    +   - Object storage is highly scalable, which means the storage can grow as per
    the growing data demands within an organization.

    +   - You save money because there is no requirement to book storage capacity
    in advance.

    +   - The feature of embedding metadata within the object facilitates data classification
    and analytics workloads.

    +   - Data can easily be accessed via **HyperText Transfer Protocol (HTTP)** or
    APIs.

    +   - Very suitable for storing large files such as video, audio, images, and
    backups of data.

    +   - Suitable for write-once, read-many-times scenarios such as data analytics.


    However, there are a few drawbacks as well, as outlined here:


    +   - Performance of object storage is slower compared to block storage, particularly
    writing.

    +   - Data cannot be **appended** to objects; any change to data simply amounts
    to deleting the existing object and recreating it.

    +   - Suitable for workloads that require relatively static data.


    **Important note**

    Since each change to an object amounts to deleting it and creating a new version,
    object storage is unsuitable for **online transaction processing (OLTP)** operations
    where data changes are very frequent. However, it is very suitable for **online
    analytical processing (OLAP)** operations because data changes infrequently.'
  merge: -1
  img_proc: true
- pgno: 49
  md: '# Compute


    In the context of a data lake, compute is the ability to process (read and write)
    data for analytical operations such as wrangling, joining, and aggregating. In
    analytical computations, two resources are very critical for smooth operations,
    outlined as follows:


    +   - **Central processing unit (CPU)**—On any given computer, all calculations
    are performed in the CPU. The speed of the CPU is measured in clock speed—2.8
    **gigahertz (GHz)**, for example. This means that this CPU can perform 2.8 billion
    computations per second. The greater the CPU speed, the more the computational
    power. In the world of virtualization, this term is referred to as a **virtual
    CPU (vCPU)**.


    +   - **Random-access memory (RAM)**—RAM stores active data that is required for
    any currently ongoing computations. This is done to prevent repeated read and
    write operations from hard drives, which are typically a lot slower (a ratio of
    1:50) to respond compared to RAM. Therefore, it is generally preferred to possess
    as much RAM as possible.


    # Containers


    In analytical processing terms, resources are allocated to jobs in container units.
    The idea of a container was introduced in **Yet Another Resource Negotiator (YARN)**,
    the distributed processing framework in Hadoop.


    In simple terms, a container is a logical grouping of the two key physical resources—a
    vCPU and RAM. Since YARN works in a cluster, it maintains the total tally of RAM
    and the vCPU across the cluster.


    At processing time, YARN allocates containers based on the requirements of the
    job(s). If a cluster has enough resources to meet the demand of the job, it starts
    it immediately, else it puts it in wait mode until the resources free up. The
    different-sized containers are depicted in the following screenshot:


    ![](img/dae8a2243a3c3cbcd9c56ff3d2217672_49_0.png)


    Figure 2.6 – Varying container sizes'
  merge: -1
  img_proc: true
- pgno: 50
  md: 'The modern era''s distributed frameworks are extremely resource-hungry. Apache
    Spark and Apache Flink perform computations in memory, so at times, you need a
    lot of it. In the big data world, understanding the internals of how job resources
    are allocated and managed in a cluster goes a long way in improving the completion
    times and performance of jobs.


    > **Important note**

    > The balancing act of allocating the optimal required resources to your jobs
    is a core skill that every data engineer should carry.


    You might be wondering, *Why should I be bothered by all this? The cloud allows
    us to use practically endless amounts of resources anyway...* However, I assure
    you that I do have a point here, and a huge one...just wait for it.


    # Storage is cheap; compute is expensive


    Here it is: *Storage is cheap, yet compute is expensive.* Now, what is that supposed
    to mean?


    A few pages ago, I started this section by stating that the ability of a data
    lake to segregate (**decouple**) the storage and compute layers is perhaps one
    of the most desirable features—particularly if an organization''s infrastructure
    is in the cloud.


    I am going to support this theory by doing a very high-level estimate on **Microsoft
    Azure**. Please note that the estimate that I am going to present here is just
    an example to highlight the preceding point.


    The assumptions are as follows:


    +   - **Storage**—10 **terabytes (TB)**/month of hot tier Data Lake Storage Gen2
    in the East-US region

    +   - **Compute**—Azure Synapse Analytics for 500 **data warehouse units (DWU)**/month
    in the East-US region


    We''ll use the Microsoft Azure calculator available at https://azure.microsoft.com/en-ca/pricing/calculator/
    to make this estimate, shown in the following screenshot:


    ![](img/dae8a2243a3c3cbcd9c56ff3d2217672_50_0.png)'
  merge: -1
  img_proc: true
- pgno: 51
  md: 'I hope that proves the point that I have been trying to make—**compute is almost
    10 times more expensive than storage.**


    Now, let me ask you a question. Put yourself in the shoes of the data engineer.
    Which layer would you try to optimize the most to keep the costs in check? If
    your answer is *compute*, then I have managed to get my point across.


    > **Important note**

    > As a data engineer, while choosing storage and compute resources, it is very
    important to keep cost optimization in mind. It is a rare skill to have but is
    something that your customers will thank you for the most.


    In the pre-cloud era, big data platforms such as Hadoop were mostly installed
    on physical machines/**virtual machines (VMs)**. In this case, the storage layer
    was tightly coupled with the compute layer, as illustrated in the following diagram:


    ![](img/dae8a2243a3c3cbcd9c56ff3d2217672_51_0.png)


    Figure 2.8 – A tightly coupled data lake


    There are a few drawbacks with this setup, outlined as follows:


    +   - The required capacity for compute and storage needs to be **pre-purchased**.
    The purchased capacity is typically based on the requirements for the most complex
    job. Assuming the most complex job only runs for a fraction of time during the
    day, the unused capacity is underutilized for the rest of the day.

    +   - You need the cluster to stay up 24/7 (whether you are actively using it
    or not). Costs to keep the cluster operational, such as air conditioning, real
    estate, electricity, and administrative costs, all add up.'
  merge: -1
  img_proc: true
- pgno: 52
  md: 'In short, you are paying for something that you are not using... and no one
    likes to do that.


    In many respects, moving toward cloud computing has been a game-changer. Having
    a data lake in the cloud allows us to achieve something that was not possible
    before: we can finally decouple storage and compute!


    The following diagram shows a loosely coupled data lake:


    ![](img/dae8a2243a3c3cbcd9c56ff3d2217672_52_0.png)


    Figure 2.9 – A loosely coupled data lake


    Decoupling storage from compute offers several advantages, outlined as follows:


    With a loosely coupled data lake, the cheap (storage) layer is permanent, whereas
    the expensive (compute) layer is temporary. How does it work this way?


    Typically, during batch processing, computations are performed only for a brief
    period each day (usually just a few hours). Having your infrastructure on the
    cloud allows you to create a distributed processing cluster (Hadoop/Spark/Flink)
    every day, just before batch processing starts; all the jobs are then run and,
    finally, the cluster is deleted right after all the jobs finish. Since the storage
    portion exists outside the compute cluster, there is no data loss if the cluster
    is destroyed. This process is depicted in the following diagram:'
  merge: -1
  img_proc: true
- pgno: 53
  md: '![](img/dae8a2243a3c3cbcd9c56ff3d2217672_53_0.png)


    Figure 2.10 – Preserving compute costs


    By doing this, you make sure that the compute costs are fully optimized… you **only
    pay for what you use**.


    In *Chapter 1, The Story of Data Engineering and Analytics*, we discussed the
    journey of data and the reasons why a data engineering practice is becoming a
    core necessity for organizations that are serious about data analytics. The question
    is, how should they start this journey? In the next section, we will deep dive
    into the planning stages of creating a data lake, starting with understanding
    some well-known data lake architectures.


    # Discovering data lake architectures


    Before we start the journey of data lake creation, it is important to understand
    how we undertake a normal journey in real life. Before taking a journey—a vacation,
    for instance—we often start by doing some preparations, such as these:


    +   - **Plan**—Shortlist destinations that we want to visit during our trip.

    +   - **Reserve**—Book the best airlines and hotels that fall within our **budget**.

    +   - **Visit**—Hopefully, our preparations will make the trip both **comfortable**
    and **secure**.


    Preparing for the journey of data lake creation is no different, as we can note
    here:


    +   - **Plan**—Choose the correct data lake architecture that meets the objectives
    of the organization''s analytical needs (**destination**).

    +   - **Reserve**—Procure resources (computer and human) required to create a
    data lake within the financial restrictions (**budget**).'
  merge: -1
  img_proc: true
- pgno: 54
  md: '+   - **Create**—Create the necessary infrastructure and data pipelines based
    on a chosen architecture that helps decision makers (**comfort**) and distributes
    as per individual clearances (**security**).


    I hope it is evident from this comparison that without the correct choice of data
    lake architecture, all subsequent steps will not meet the objectives of the organization.


    A properly designed architecture should be capable of meeting the diverse needs
    of data storage and data processing, including aggregating, joining, and querying—not
    only in a batch mode but, more importantly, in a streaming mode as well.


    > **Important note**

    > In batch processing, analysis is performed using data that has been collected
    and stored over a large period (typically a few hours), whereas in stream processing,
    analysis is performed using data as soon as it is collected. After processing,
    this data may or may not be permanently stored.


    In this section, we will focus on four well-known data lake architectures that
    are very commonly used in the data lake world, listed as follows:


    +   - Traditional architecture

    +   - Lambda architecture

    +   - Kappa architecture

    +   - Lakehouse architecture


    Before we understand the various architecture types, we should know about a famous
    theorem applicable to distributed computing platforms.


    # The CAP theorem


    In the era prior to distributed computing reaching maturity, the **scalability**
    of a system was increased by adding more hardware resources. This is likely done
    by adding more memory, disk, and CPU (or a combination of) to the pre-existing
    nodes. This type of scaling is commonly referred to as **vertical scalability**,
    as shown in Figure 2.11. But there are a couple of huge drawbacks with this type
    of scaling, as detailed here:


    +   - Adding new hardware is limited to the maximum expandable in the node—for
    example, there are only a limited number of slots available on the motherboard
    for expanding memory.'
  merge: -1
  img_proc: true
- pgno: 55
  md: '+   - An existing node will eventually reach its expiration period and may
    need to be replaced entirely. Therefore, the cost of adding new hardware may not
    be justified.


    In the modern era of computing, commonly referred to as **distributed computing**,
    the scalability of the system is achieved laterally, as shown in *Figure 2.12*.
    This type of scaling is commonly referred to as **horizontal scalability**. It
    works on the principle of *just keep adding nodes.*


    Vertical scalability can be depicted as follows:


    ![](img/dae8a2243a3c3cbcd9c56ff3d2217672_55_0.png)


    Figure 2.11 – Vertical scalability


    **Important note**

    Horizontal scaling is not achieved by adding hardware to existing nodes but by
    adding new nodes whenever more power is required.'
  merge: -1
  img_proc: true
- pgno: 56
  md: 'Horizontal scalability can be depicted as follows:


    ![](img/dae8a2243a3c3cbcd9c56ff3d2217672_56_0.png)


    Figure 2.12 – Horizontal scalability


    The CAP theorem is based on three key characteristics of a distributed computing
    system, outlined as follows:


    +   - **Consistency**—All nodes should contain the same data. This means that
    a write request should successfully propagate data to all other replicated nodes
    before it becomes available for read requests. In other words, a read request
    should receive the same data irrespective of which node served it.


    +   - **Availability**—Users should be able to access the system even if a node
    goes down. This means they should always receive a **success** response to their
    read/write requests. However, this does not mean that the data that has been read
    is indeed the most recent.


    +   - **Partition tolerance**—The system should be able to tolerate network delays
    and interruptions. This means that the data replication arrangement in the distributed
    system should be done taking network failures in mind. In Hadoop, this concept
    is implemented using rack awareness.


    As per the CAP theorem, it is impossible for a distributed computing system to
    simultaneously provide all three guarantees at the same time. It can provide a
    maximum of two—you need to sacrifice the third. The concept is illustrated in
    the following diagram:'
  merge: -1
  img_proc: true
- pgno: 57
  md: '![](img/dae8a2243a3c3cbcd9c56ff3d2217672_57_0.png)


    Figure 2.13 – The CAP theorem


    The CAP theorem is important to understand in the data lake world because it makes
    you aware of trade-offs that you may need to make in your case scenarios.


    # The trade-offs


    As per Figure 2.13, for data lake operations we usually opt for AP (availability
    and partition tolerance) and sacrifice consistency. This choice covers most data
    analytics scenarios where data accuracy can be sacrificed for the greater good.
    If the data is aggregated over a large period, a few inconsistent/incorrect values
    are not going to affect the correctness to a greater degree.


    However, consider a case in IoT analytics where we are trying to monitor the temperature
    of a room using sensors in the possibility of a fire event. In this case, a missing
    or incorrect reading from a sensor could be catastrophic. Therefore, it may be
    advisable to choose CP (consistency and partition tolerance) for this situation.
    This is the reason why using a NoSQL database is a better choice for mission-critical
    streaming analytics.'
  merge: -1
  img_proc: true
- pgno: 58
  md: '# Traditional architecture


    Several years ago, Hadoop was the most popular engine for distributed data storage
    and processing systems—it was the phase of **batch processing**. Using Hadoop,
    a typical batch workflow functioned like this:


    +   - **Orchestration**—Using preconfigured tools such as **Oozie** to invoke
    workflows (pipelines) that perform the following set of operations.

    +   - **Batch collection**—Collecting and ingesting data every few hours. Initially,
    a window of 24 hours was the norm, but due to growing demands for real-time data,
    the windows started to get smaller. Data collection was performed using a variety
    of Hadoop ecosystem tools such as **Sqoop** and **Flume**. The incoming data was
    stored in HDFS for further processing. Every time new data was collected, it was
    appended to the previous dataset, usually by creating a timestamp partition.

    +   - **Batch processing**—Once the data had been saved to HDFS, processing was
    performed using the **MapReduce** engine (distributed processing framework). This
    was done using a variety of methods such as writing programs in languages such
    as **Java**, **Python**, or **Perl**, or by using frameworks such as **Pig** and
    **Hive**.


    I must admit that in those times, my customers were simply thrilled by the fact
    that I managed to ingest and process their data from various sources in Hadoop,
    even though it came with **high latency**.


    The following diagram represents the state of **SALES** data 24 hours apart:


    ![](img/dae8a2243a3c3cbcd9c56ff3d2217672_58_0.png)


    Figure 2.14 – State of data 24 hours apart'
  merge: -1
  img_proc: true
- pgno: 59
  md: '**Sales report created on February 2**—Includes all data from start (2018)
    until February 2, 2021.


    **Sales report created on February 3**—Includes all data from start (2018) until
    February 3, 2021.


    Now, here is the problem with traditional architecture:


    If the sales report is produced somewhere between the usual scheduled report generation
    times on February 2 and February 3, the report will be missing sales that are
    happening on February 3. In other words, no matter what a report generated during
    an interim period, this will always only be partially inaccurate. To address this
    problem, we started to bring the batch window down to 12/8/4 hours, but no matter
    what, there would always be a fraction of data missing in the report.


    As times changed, customers started to request data analytics over near-real-time
    data, paving the way for a better architecture that could address their growing
    demands.


    > **Important note**

    > The inability of MapReduce to process data in real time paved the way for other
    distributed frameworks such as Spark and Flink to come into existence.


    # Lambda architecture


    Lambda architecture came into existence to address the need for hybrid processing
    that can account for both batch and streaming data at the same time. Lambda architecture
    was introduced by **Nathan Marz**, who created the famous real-time processing
    engine named **Apache Storm**. Lambda architecture is comprised of three layers,
    detailed next.


    # Batch layer


    The batch layer stores the master dataset. The master dataset includes all historical
    data collected since the collection process started. In the example that we covered
    previously, the dataset in the screenshot represents the **SALES** master dataset.


    These are some of the characteristics of the master dataset:


    +   - It is immutable. Immutability of data means that existing data cannot be
    changed, and new data can only be appended.

    +   - It can be used by the serving layer to publish data.

    +   - It can incrementally merge changed data on a regular basis.'
  merge: -1
  img_proc: true
- pgno: 60
  md: 'You can see the file structure of the master dataset here:


    ![](img/dae8a2243a3c3cbcd9c56ff3d2217672_60_0.png)


    Figure 2.15 – Master dataset


    Let''s now have a brief introduction to the term change data capture, or CDC in
    short. Successfully capturing and processing changing data over time makes it
    one of the top three challenges that I have faced in my career. We will dedicate
    a whole section to CDC in a future chapter, titled Solving Data Engineering Challenges.


    A few well-known tools of the trade for creating the batch layer are Apache Hadoop,
    Apache Flink, and Apache Spark.


    # Serving layer


    The serving layer makes the master data available to the query process using batch
    views. The batch views are often the results of precomputed aggregations. Due
    to the data being largely precomputed, these views provide low latency access
    to the users.


    The following screenshot shows a batch view that aggregates SALES by quarters.
    In this view, the aggregations of quarters in 2018 till 2020 will be accurate,
    because the data is not changing for those partitions anymore. However, data for
    2021 > Q1 is still evolving and changing by the second due to currently ongoing
    sales:


    ![](img/dae8a2243a3c3cbcd9c56ff3d2217672_60_1.png)


    Batch View


    Figure 2.16 – Aggregated batch view'
  merge: -1
  img_proc: true
- pgno: 61
  md: 'Here is how we can achieve an accurate result for 2021-Q1:


    # 2021-Q1 from batch view + Aggregate (February 3 SALES)


    The latter summation of data is missing, and this is where the speed layer will
    help us.


    The tools of the trade for the serving layer are Apache Hive and Presto.


    # Speed layer


    The speed layer stores the most recent dataset (incremental) that has not yet
    been merged to batch views due to the latency of the merge process. This data
    is made available to the query process as real-time views, often created using
    stream processing. You can see a depiction of a real-time view here:


    ![](img/dae8a2243a3c3cbcd9c56ff3d2217672_61_0.png)


    Figure 2.17 – Aggregated real-time view


    In traditional architecture, this is exactly the layer that could not be handled
    by Hadoop MapReduce, and therefore advancement to newer frameworks was required.


    The tools of the trade for the speed layer are Apache Spark Streaming, Apache
    Storm, and Apache Flink.'
  merge: -1
  img_proc: true
- pgno: 62
  md: 'This is how everything comes together in Lambda architecture:


    +   - Incremental data from the source is concurrently pushed to the batch and
    speed layers.

    +   - The batch layer keeps accumulating the data over a certain period and refreshes
    the batch view after the period expires.


    You can see the various layers of a Lambda architecture here:


    ![](img/dae8a2243a3c3cbcd9c56ff3d2217672_62_0.png)


    Figure 2.18 – Various layers of a Lambda architecture


    +   - Incremental data is pushed to the speed layer where it is aggregated in
    a streaming fashion as a real-time view.

    +   - At query time, the results from the batch view are consolidated with the
    results from the real-time view to get the most recent and accurate figures.


    Lambda architecture has several benefits, including low latency due to precomputed
    views, and data accuracy due to near-real-time access to data.'
  merge: -1
  img_proc: true
- pgno: 63
  md: 'Here are some case scenarios where you might use a Lambda architecture with
    great success:


    +   - **Access to near-real-time data**—There are scenarios in which the decision-making
    process is detrimentally impacted if access to the latest data is not available.

    +   - **Large historical datasets**—There are situations in which the historical
    data is extremely large, so aggregations can take a long time to finish and cannot
    be performed frequently.

    +   - **Dynamic nature of analytics (ad hoc)**—There are cases in which the case
    scenarios for data analytics are very dynamic and vary quite frequently. In this
    case, the batch and real-time views can be created or adjusted without affecting
    the underlying master data.


    > **Important note**

    > A particular strength of the Lambda architecture is its strength to be easily
    migrated from traditional architecture. I have done several of these migrations
    in the past with great success.


    Lambda architecture provides a nice balance of performance and data freshness.
    But in recent times, requirements for streaming analytics have grown quite sharply.
    Use cases such as IoT monitoring and anomaly detection require a fast real-time
    analytics engine able to support millions of incoming requests per second.


    Despite all the advantages that Lambda architecture has, there are a few drawbacks,
    as outlined here:


    +   - In a few cases, it is sometimes complex to implement due to the multiple
    layers. More layers also translate to more costs, in resources, administration,
    and monitoring.

    +   - Each layer requires a different set of tools, services, and programming.
    Therefore, infrastructure and code management become a challenge.

    +   - In some scenarios, implementing a Lambda architecture may be overkill due
    to the nature of the analytics.


    Quite recently, a simpler architecture was introduced, the Kappa architecture,
    which many call the simplified version of the Lambda architecture.'
  merge: -1
  img_proc: true
- pgno: 64
  md: '# Kappa architecture


    **The Kappa architecture** was introduced in 2014 by **Jay Kreps**. This architecture
    eliminates the need for the batch layer altogether. Instead, all data is stored
    in a real-time layer that maintains an immutable stream of events stored in a
    stream-processing platform.


    The major components of the Kappa architecture are described in the following
    subsections.


    # Streaming layer


    The **streaming layer** stores all raw data in the form of sequential events (messages)
    sorted by the creation timestamp. Since data is not stored on a regular filesystem,
    the chosen streaming platform should include built-in features such as **fault
    tolerance (FT)** and **high availability (HA)**.


    The tools of the trade for the streaming layer storage are **Apache Kafka**, **Azure
    Event Hubs**, **Amazon Kinesis**, and **Google Pub/Sub**.


    The stream-processing engine reads event data, performs required computations,
    and publishes the transformed data as views in the serving layer.


    The tools of the trade for streaming-layer processing are **Apache Spark Streaming**,
    **Apache Flink**, and **Kafka Streams**.


    # Serving layer


    The serving layer makes event data available to the query process using precomputed
    views. These views can be recomputed at regular intervals by relaunching the view
    build code.


    The tools of the trade for the serving layer are **relational databases** and
    **data warehouses**, **cloud data warehouses**, and **cloud data storage**.


    Here is how the Kappa architecture functions:


    The stream-processing engine performs aggregations and publishes the results to
    the serving layer as precomputed views. As per Figure 2.19, at time t, the stream-processing
    code computes data from 2018 until the latest event in the sales topic.


    The computed data is published as the **AGGREGATED SALES** view, which is then
    queried for analysis.'
  merge: -1
  img_proc: true
- pgno: 65
  md: 'You can see a diagram of the process here:


    ![](img/dae8a2243a3c3cbcd9c56ff3d2217672_65_0.png)


    Figure 2.19 – State of aggregate view at time t


    At time t + 1, the stream-processing code recomputes data from 2018 up to the
    most recent event within the sales topic. Notice that new events have been added
    to the queue since the last time the computations were performed. The recomputed
    data is published as follows:


    +   - The previous version of the AGGREGATED SALES view is dropped.

    +   - A new version of the AGGREGATED SALES view is computed to take its place.

    +   - Queries are pointed to the recomputed view.'
  merge: -1
  img_proc: true
- pgno: 66
  md: 'You can see a diagram of the process here:


    ![](img/dae8a2243a3c3cbcd9c56ff3d2217672_66_0.png)


    Figure 2.20 – State of aggregate view at time t+1


    Now we know how the Kappa architecture generally functions, let''s outline some
    of the pros and cons of it, as follows:


    +   - The Kappa architecture works extremely well for use cases around IoT monitoring
    and real-time analytics with limited dependency on historical data.

    +   - Unlike Lambda architecture, a single code base is sufficient for data processing.
    This hugely simplifies infrastructure deployment and management requirements.

    +   - Since Kappa stores all data in the streaming layer for larger datasets,
    typically in the TB range, the architecture becomes extremely expensive.


    Let''s compare the costs at a very high level, as follows:


    +   - Storing 32 TB of data on Microsoft Azure Premium SSD Managed Disks will
    cost you roughly US dollars (USD) $4,194/month.

    +   - Storing 32 TB of data on Microsoft Azure Blob storage will cost you just
    $682/month.'
  merge: -1
  img_proc: true
- pgno: 67
  md: 'Many experts feel the Kappa architecture is a substitute for the Lambda architecture,
    although I see things a bit differently. To me, each one of these architectures
    solves a different purpose. Here are some case scenarios where I have used the
    Kappa architecture with great success:


    +   - **Real-time monitoring**—Monitoring of IoT sensors is a perfect use case
    for the Kappa architecture. In almost all monitoring cases, having access to historical
    data is not required.

    +   - **Live dashboarding**—I am sure you have seen dashboards that visualize
    data in a live fashion. The visual is refreshed every few seconds based on incoming
    data.

    +   - **Real-time ML**—Many companies are now exposing their ML models as microservices
    for use cases such as fraud detection.

    +   - **Real-time data monetization**—We previously discussed data monetization
    as a means for revenue diversification. More and more companies are now exposing
    their data to external companies for consumption in real time.


    **Important note**

    Before choosing a suitable architecture, data engineers should carefully evaluate
    the strength of each one based on customer requirements, the urgency of near-real-time
    analysis, and resource costs.


    Both Lambda and Kappa architectures are layered—data is collected in the storage/streaming
    layer, processed, and finally published to a warehouse. I have done several projects
    in the past using these architectures but, truthfully, implementing either one
    of them comes with a few challenges, such as the following:


    +   - Keeping data fresh and up to date in each tier is difficult. Ever-changing
    data requires a carefully designed merge process.

    +   - Infrastructure costs in both architectures can be steep at times.

    +   - More layers mean more chances of failure. Dealing with a failure is not
    only costly but also untimely because it delays the ongoing data analytics.

    +   - If the data is being published externally for data monetization purposes,
    any failures or inaccuracies can cause revenue loss and customer dissatisfaction.


    Some of the previously mentioned deficiencies of the Lambda and Kappa architectures
    have forced the experts to find a new way of thinking.'
  merge: -1
  img_proc: true
- pgno: 68
  md: 'Generally, in any data lake operation, we ingest data to storage, process it
    as per requirements, and finally publish the aggregated data to a warehouse so
    that it is available for analytics.


    Lately, a new architecture is being adopted at a fast rate that combines the power
    of a data lake and a data warehouse in one, as illustrated in the following diagram:


    ![](img/dae8a2243a3c3cbcd9c56ff3d2217672_68_0.png)


    # Data Lake and Data Warehouse are Decoupled


    ![](img/dae8a2243a3c3cbcd9c56ff3d2217672_68_1.png)


    # Data Lake and Data Warehouse are Merged


    Figure 2.21 – Rise of the Lakehouse architecture


    In this section, we learned about the Kappa and Lambda architecture, and the rise
    of the Lakehouse architecture.


    # Lakehouse architecture


    Before we discuss the Lakehouse architecture, it is important to understand what
    I refer to as the power struggle between traditional and modern data processing
    systems.


    # The give-and-take struggle


    There was a card game that I used to play when I was younger. In this game, to
    advance to the next level, you were required to sacrifice your best card.


    Through many years in the data processing world, I have seen the same give-and-take
    struggle between the traditional method of data processing (database/data warehouses)
    versus the modern one (data lakes).'
  merge: -1
  img_proc: true
- pgno: 69
  md: 'You can see this power struggle depicted in the following diagram:


    ![](img/dae8a2243a3c3cbcd9c56ff3d2217672_69_0.png)


    Figure 2.22 – The power struggle


    The decision to move toward modern data processing platforms has forced us to
    make some sacrifices; you gain some and you lose some. Let me highlight some of
    these give-and-take situations in which you must move from traditional to modern
    methods, as follows:


    +   - Sacrifice durability and consistency features such as **atomicity, consistency,
    isolation, and durability (ACID)** transactions but gain the ability to process
    on a highly scalable platform.

    +   - Sacrifice performance features such as indexing and caching but gain the
    ability to process data in multiple formats.

    +   - Sacrifice security features such as versioning and auditing but gain the
    ability to decouple storage and compute.'
  merge: -1
  img_proc: true
- pgno: 70
  md: 'The Lakehouse architecture, as depicted in the following diagram, merges the
    low-cost storage of a data lake with the **massively parallel processing (MPP)**
    power of a warehouse to serve the diverse and ever-evolving requirements of modern-era
    analytics:


    ![](img/dae8a2243a3c3cbcd9c56ff3d2217672_70_0.png)


    Figure 2.23 – Lakehouse architecture


    Here are a few important features of the Lakehouse architecture:


    +   - **Supports low-cost storage**—The Lakehouse architecture carries forward
    the support for using low-cost storage. Data can be structured, semi-structured,
    or unstructured over open formats such as Parquet.

    +   - **Supports ACID transactions**—Now, this one is big. An absence of transaction
    support hugely impacts the data integrity and quality in a data lake. Over the
    years, dealing with duplicated and deleted data has been a huge challenge. In
    the early days, I remember going through a multi-step process in Hive to deal
    with this. A few years later, Spark took over, but the challenge stayed the same.
    But the struggle is finally over.... long live **Databricks Delta Lake**!

    +   - **Metadata management**—The Lakehouse architecture offers strong metadata
    management features such as schema enforcement and evolution. Once again, the
    absence of such features in the past has forced us to perform similar checks using
    code.


    **Important note**

    Since its introduction, Delta Lake has proved to be a lifesaver for data engineers,
    not only to resolve the CDC challenge but many other ones, such as schema evolution
    and time travel. The Lakehouse architecture assumes the use of an open source
    storage engine such as Delta Lake for ACID transactions, metadata management,
    governance, and many other features.'
  merge: -1
  img_proc: true
- pgno: 71
  md: '+   - **Segregation of storage and compute**—The Lakehouse architecture preserves
    the idea of decoupling storage and compute for massive scalability and cost-saving.

    +   - **Support for BI tools**—Lakehouse architecture supports connectivity to
    all major BI tools using standard **Java Database Connectivity (JDBC)/Open Database
    Connectivity (ODBC)** connectivity.

    +   - **Native support for Structured Query Language (SQL)**—Users can easily
    utilize the power of the SQL language for performing analytics.


    > **Important note**

    > In Azure, the Lakehouse architecture is implemented using Synapse Analytics.

    > In addition to using Synapse SQL for performing analysis, it provides support
    for Apache Spark.


    +   - **Supports streaming workloads**—The Lakehouse architecture supports real-time
    analytics and reporting using streaming data.


    The tools of the trade for the Lakehouse architecture include **Azure Synapse
    Analytics**, **Amazon Redshift Spectrum**, **Google BigQuery**, and **Snowflake**.


    These sections should explain how a Lakehouse architecture provides a nice blend
    of traditional, Lambda, and Kappa architectures. The way I see it, the Lakehouse
    is the right recipe for creating a data lake—one that not only works but also
    provides the correct balance between **user experience (UX)**, scalability, and
    cost.


    # Summary


    In this chapter, we learned about a data lake and its various characteristics,
    such as multiple zones, the ability to deal with multiple formats, governance,
    and—most importantly—its ability to decouple storage and compute.


    We also learned about four key data lake architectures: traditional, Lambda, Kappa,
    and Lakehouse. We analyzed each one from their applicability to certain case scenarios,
    costing, and overall management.


    In the next chapter, I will highlight various tools and services available in
    Microsoft Azure required to build a data lake using the Lakehouse architecture.'
  merge: -1
  img_proc: true
