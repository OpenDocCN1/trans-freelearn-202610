- pgno: 225
  md: "# The process of curating raw data\n\nBy this point, hopefully, it is easy\
    \ to envision that the need for curating data is very real. Now, let's focus on\
    \ the actual process to make this happen.\n\n![](img/dae8a2243a3c3cbcd9c56ff3d2217672_225_0.png)\n\
    \n# Inspecting data\n\nThe process of data curation starts by inspecting sample\
    \ data. Typically, this is a joint effort between the data engineers and the customer\
    \ team members. You can start by visually inspecting data covering diverse data\
    \ sources, although in many cases you may need to implement programming logic\
    \ to discover data that is unstandardized, invalid, inconsistent, non-uniform,\
    \ duplicate, or insecure.\n\nDeliverable: A detailed report listing all the instances\
    \ where data curation will be required, including a plan to fix each case. Within\
    \ the report, feel free to include the pseudocode for the business logic that\
    \ addresses the specific case, as follows:\n\n```\nIF raw_data.country IN ('USA',\
    \ 'United States', 'United States of America') THEN\n    curated_data.country\
    \ = 'USA'\n```\n\n# Getting approval\n\nThe report created during the inspection\
    \ phase should be formally submitted to the customer team for review and approval.\
    \ This ensures that the customer is on board with the business logic that will\
    \ be implemented to curate the data.\n\nDeliverable: Formal approval by the customer\
    \ team."
  merge: -1
  img_proc: true
- pgno: 226
  md: '# Cleaning data


    Once the approval has been received, it is time to start the actual implementation
    of the business logic that implements data curation. As a data engineer, you are
    free to choose from a variety of frameworks, languages, and tools that can be
    used, although it is better to use something that the customer is comfortable
    with. Generally, the two most frequently used ones are Apache Spark and SQL. Once
    the curation logic has been developed, it is integrated within the curation pipeline.


    **Deliverable:** Logic that implements the curation.


    # Verifying data


    The final step of data curation is to verify that the curation logic worked as
    intended. Typically, this activity should be performed by customer team members
    because they are closer to the data and therefore more likely to understand it
    better than the data engineer.


    **Deliverable:** Formal approval by the Customer Team.


    > **Important note**

    > Going from one project to another, a data engineer learns to spot common trends
    in data that require curation. In some cases, it is tempting to start fixing data
    right away, but it is equally important to follow a well-defined curation process.


    Now that we have a fair understanding of the need for data curation and a sound
    understanding of the process, let''s build an actual curation pipeline. For the
    sake of simplicity, we are going to assume that following the curation process,
    we diligently submitted a report to Electroniz with our findings as outlined in
    the *Need for Curating Raw Data* section. The Electroniz team has reviewed the
    report and given us a final approval to proceed with the next steps. Therefore,
    we are going to start developing the curation logic using Apache Spark on **Azure
    Databricks**.


    # Developing a data curation pipeline


    We are ready to start the development of the Electroniz curation pipeline. The
    data will now take the journey from being in an unclean state to a more cleansed
    and usable state. I had previously promised to keep you updated with which area
    of the architecture diagram is being addressed, so here it is:'
  merge: -1
  img_proc: true
