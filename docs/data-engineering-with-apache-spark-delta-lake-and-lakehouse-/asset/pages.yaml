- pgno: 320
  md: 'Next, we will learn how to monitor pipelines properly.


    # Monitoring pipelines


    To monitor the hourly runs using the panel on the left-hand side, click on Monitor.
    Then, click on Trigger runs:


    ![](img/dae8a2243a3c3cbcd9c56ff3d2217672_320_0.png)


    Figure 9.13 – The first trigger run for the Electroniz master pipeline


    Notice how the master pipeline successfully runs every hour to ingest the incremental
    data and recompute the aggregations. Hopefully, this should make Electroniz a
    very happy customer. As a data engineer, you should be proud of your achievements.
    Getting this far involves a lot of work.


    In an ideal world after the deployment, pipelines should run automatically and
    seamlessly. The reality is that failures will happen, so you need to be prepared
    for them well in advance. After all, your pipelines ingest data from varying sources
    that may or may not be under your direct control. One day, the database that your
    pipeline ingests from might be down for maintenance, or a REST API that you subscribe
    to might go offline.


    > **Important**

    > A smart data engineer develops their pipeline for the best-case scenarios but
    also prepares them well for the worst-case scenarios.


    In other cases, the problem might be transient. The pipeline could not connect
    to the database or the API due to a network hiccup. Naturally, as a data engineer,
    it is impossible to predict these sorts of failures. However, there are ways in
    which to make your pipelines react and handle errors gracefully. Let’s examine
    some ways in which this can be done.'
  merge: -1
  img_proc: true
- pgno: 321
  md: '# Adding durability features


    While creating the Electroniz pipelines, we created several types of activities
    to perform specific actions. Looking closely at the properties of each activity,
    you will notice three important ones that can add durability to your pipelines:


    ![](img/dae8a2243a3c3cbcd9c56ff3d2217672_321_0.png)


    Figure 9.14 - Durability properties in an activity


    The following list explains the parameters:


    +   - **Timeout**: This property represents the maximum amount of time a particular
    activity should run for. In the Azure data factory, the value is set to 7 days
    by default. After the timeout expires, the activity is terminated whether it was
    successful or not. Now that might sound very bad, but it is not. On the contrary,
    it is highly advisable to set a timeout value to a safe value. With some initial
    monitoring performed during the development and testing phases, it is easy to
    predict how much time a particular activity usually takes. For instance, you might
    have a notebook activity in your pipeline that usually takes 5 minutes to finish.
    If you add a buffer, you might want to set the value to 15-30 minutes.'
  merge: -1
  img_proc: true
- pgno: 322
  md: 'I am sure you will be wondering what has been achieved by doing that. Well,
    the simple answer is conserving cloud resource costs. In instances where a program
    unexpectedly hangs around, would you rather accumulate for 7 days of cloud resource
    costs or just 15–30 minutes? In this case, it might be better to let the activity
    terminate and separately investigate the reason for any unexpected hangs.


    > **Important**

    > A hallmark of a smart data engineer is to effectively choose between the bad
    and the worse. In some scenarios, it is better to choose a fast-fail mechanism
    in the long term because the latter could end up costing a lot of unnecessary
    cloud resources.


    +   - **Retry**: As the name suggests, adding retries means the number of times
    the activity will be retried before calling it quits. The default for this value
    is set to 0 in the Azure data factory, which, in other words, means trying the
    activity only once. Setting a higher value for retries covers against transient
    failures that are, typically, related to network glitches and unavailability.
    In most cases, a value of 3 might be a good start. However, the behavior of retires
    is directly impacted by the retry interval.

    +   - **Retry interval**: The retry mechanism adds a delay between each retry
    attempt. The default for this value is 30 seconds in the Azure data factory. As
    mentioned earlier, this property is frequently paired with the number of retires.


    These parameters can certainly add durability to your pipelines; however, they
    don''t cover you against all failure scenarios. Some day, the failure is bound
    to happen.


    > **Important**

    > Anticipating and gracefully dealing with failure conditions in your pipelines
    should be well planned and exercised. After all, after your job is done as a data
    engineer, you will hand over the system to the operational team for future monitoring
    and support.'
  merge: -1
  img_proc: true
- pgno: 323
  md: '# Dealing with failure conditions


    As discussed earlier, a well-designed pipeline should be able to handle failure
    conditions gracefully. But the question is how? Let''s illustrate this using the
    following failure scenario.


    As part of the Electroniz pipeline, we added activities that ingest incremental
    data from the stores database. One fine day, the stored database went down for
    maintenance. As a result, the hourly triggered pipeline failed to run due to database
    unavailability. In this scenario, the Azure data factory reports the error as
    follows:


    ![](img/dae8a2243a3c3cbcd9c56ff3d2217672_323_0.png)


    Figure 9.15 – Pipeline failure due to database unavailability


    Overall, this is expected behavior. But the real question is how to deal with
    such a situation? Well, we have a few options – bypass the failed activity and
    let the remainder of the pipeline proceed as usual or terminate the entire pipeline
    and deal with the failure separately. Let''s explore both options in greater detail
    next.'
  merge: -1
  img_proc: true
- pgno: 324
  md: '# Bypassing failed activities


    In some cases, it is advisable to let the rest of the pipeline proceed even though
    an activity ran into a problem. This is how it is done:


    +   1. Within every activity in the Azure data factory, you will notice **Add
    output icon** in the lower-right corner. Clicking on it will reveal a **Conditions**
    menu, as follows:


    ![](img/dae8a2243a3c3cbcd9c56ff3d2217672_324_0.png)


    Figure 9.16 – Adding activity conditions


    +   2. Click on **Failure**. Now, chain the **Failure** condition from **Find
    SalesDB Tables** to **Find Currencies**. In this way, if the sales database is
    down, the failure condition will not terminate the entire job; instead, it will
    bypass **For Each Table** and proceed to **Find Currencies:**


    ![](img/dae8a2243a3c3cbcd9c56ff3d2217672_324_1.png)


    Figure 9.17 – Bypassing failed activities


    # Important


    The decision to bypass failed activities needs to be planned very carefully. In
    some scenarios, data ingested down the line might be directly dependent on the
    failed activity. In that case, it would be better to terminate the entire pipeline
    when any activity fails.'
  merge: -1
  img_proc: true
- pgno: 325
  md: '# Rerunning failed activities


    Another way to deal with failures is to let the entire pipeline fail as soon as
    any single activity runs into a problem. This method is frequently chosen over
    the bypassing activities method if there are strong data dependencies between
    the pipeline activities. In this method, the error messages and logs from failed
    activity runs are carefully evaluated. Once the error is discovered and fixed,
    the failing pipeline is rerun as follows:


    electroniz_batch_ingestion_pipeline


    ![](img/dae8a2243a3c3cbcd9c56ff3d2217672_325_0.png)


    Figure 9.18 – Rerunning failed activities


    The following list demonstrates the activities:


    +   1. **Rerun**: The entire pipeline can be rerun using the Rerun option. Since
    some activities might be run more than once, this method has a drawback because
    it can duplicate data in the bronze layer.

    +   2. **Rerun from failed activity**: Alternatively, if using this option, you
    will only run from the failed activity onward. While this method is safe from
    getting duplicates, it tends to ingest inconsistent data because parts of the
    data might be ingested at different time intervals.


    > **Important**

    > The decision to rerun the entire pipeline versus run from a failed activity
    needs to be carefully planned and well tested. The data engineer should seek their
    customer''s approval on the chosen method.'
  merge: -1
  img_proc: true
- pgno: 326
  md: '# Adding alerting features


    In the preceding section, we carefully planned and executed our approach regarding
    pipeline failures and restart mechanisms. To add greater durability to the pipelines,
    we should configure some alerting mechanisms. Without proper alerting mechanisms,
    administrative users might not be able to react and recover from failures in time.
    This can be catastrophic because delays in recovering from pipeline failures have
    been known to cause huge customer dissatisfaction, delays in real-time decision
    making, or, even worse, data corruption:


    ![](img/dae8a2243a3c3cbcd9c56ff3d2217672_326_0.png)


    Figure 9.19 – Adding alerts to a pipeline


    Here are the steps for creating real-time alerts:


    +   1. Consult the customer regarding the user(s) who should receive the alerts.
    Emails and SMS are two commonly chosen mechanisms. Instead of sending alerts to
    individual emails addresses, it is highly advisable that you send alerts to email
    groups such as administrators@site.com.

    +   2. In the Azure data factory, click on Monitor. Now click on Alerts and metrics.
    Then, click on New alert rule:


