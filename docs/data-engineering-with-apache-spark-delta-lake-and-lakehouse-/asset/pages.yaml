- pgno: 181
  md: '# 6

    Understanding Delta Lake


    In the previous chapter, we created the bronze layer of the lakehouse. The bronze
    layer stores raw data in the native form as collected from the data sources. The
    problem is that raw data is not in a shape that can be readily consumed for analytical
    operations.


    As a data engineer, it is your responsibility to convert raw data into a shape
    and form that becomes ready for use analytical workloads. In this chapter, we
    will further advance our learning to cleanse raw data. The process of cleansing
    data involves applying the logic that cleans and standardizes data followed by
    writing it to the silver layer of the lakehouse.


    But that is not all – the silver layer should store data in an open format that
    supports **ACID (atomicity, consistency, isolation, and durability)** transactions.
    This is done by using the **Delta Lake** engine. Before we start building the
    silver layer, we need to completely understand some critical features of Delta
    Lake and how they relate to the lakehouse architecture.'
  merge: -1
  img_proc: true
- pgno: 182
  md: 'In this chapter, we will cover the following topics:


    +   - Understanding how Delta Lake enables the lakehouse

    +   - Understanding Delta Lake

    +   - Creating a Delta Lake table

    +   - Performing upserts of data

    +   - Understanding isolation levels

    +   - Understanding concurrency control


    # Understanding how Delta Lake enables the lakehouse


    In *Chapter 2, Discovering Storage and Compute Data Lake Architectures*, we talked
    about the give-and-take struggle between traditional warehouse systems versus
    data lakes. In the last few years, many organizations have modernized their data
    engineering and analytics platforms by moving away from traditional data warehouses
    to data lakes. The move to the data lake has undoubtedly given them the flexibility
    to store and compute any format of data at a large scale. However, these advantages
    did not come without a few sacrifices along the way. The biggest one is the reliability
    of data. Like data warehouses, there is no transactional assurance available in
    a data lake. This need led to the launch of an open source storage layer known
    as Delta Lake.


    After its launch, experts came up with the idea of mixing the power of resilient
    data warehouses with the flexibility of data lakes and they called it a **lakehouse**.
    The combined power of a data lake and data warehouse provides a unique and powerful
    mix of features, as follows:


    +   - Data can be analyzed in multiple formats – structured, semi-structured,
    or unstructured.

    +   - Preserves the idea of low-cost storage and compute on demand.

    +   - Supports a variety of use cases including analysis, data science, machine
    learning, and artificial intelligence.

    +   - Preserves the sanity of data using effective techniques such as curation,
    standardization, and deduplication.

    +   - Provides a secure way to store and share data while maintaining compliance.'
  merge: -1
  img_proc: true
- pgno: 183
  md: 'The following diagram shows the data layers:


    ![](img/dae8a2243a3c3cbcd9c56ff3d2217672_183_0.png)


    Figure 6.1 – Lakehouse data layers


    In Chapter 5, Data Collection Stage – The Bronze Layer, we discussed the bronze
    layer of the lakehouse in greater detail. We are now moving our focus to the silver
    layer. While the bronze layer stores data that constantly trickles from various
    data sources in native formats, the silver layer stores data from all data sources
    in a common open format after the curation phase.


    **Data curation** is a combined term for the **cleanup**, **sanitization**, **standardization**,
    and **deduplication** of data. As per the preceding figure, the Delta Lake engine
    sits at the heart of the silver layer. It is responsible for managing and exposing
    a layer of data that is not only clean but most importantly trustworthy. It''s
    a common layer that data consumers such as data analysts, scientists, and machine
    learning engineers can freely access and use with confidence.


    # Understanding Delta Lake


    As mentioned before, modern data lakes lack some critical features such as **ACID
    transactions**, **indexing**, and **versioning**, which can negatively affect
    the reliability, quality, and performance of data.


    **Important Note**

    In data warehouse terms, ACID is the short form for atomicity, consistency, isolation,
    and durability of data. These properties are intended to make database transactions
    accurate, reliable, and permanent.'
  merge: -1
  img_proc: true
- pgno: 184
  md: 'The following diagram depicts the properties:


    ![](img/dae8a2243a3c3cbcd9c56ff3d2217672_184_0.png)


    Figure 6.2 – ACID properties in Delta Lake


    Delta Lake functions as a layer on top of the distributed computing framework
    Apache Spark. By design, Apache Spark lacks the following key principles of transaction
    management:


    +   - It does not lock previous data during edit transactions, which means data
    may become unavailable during overwrites for a very brief period.

    +   - During data overwrites, there is a chance where the old data gets deleted
    yet the new data fails the save operation. This could leave data in an inconsistent
    state.

    +   - Apache Spark does not protect against two separate transactions writing
    data to the same location at the same time.


    We are going to learn about some key features of Delta Lake through a series of
    live examples. Let''s get started by preparing the environment that will be used
    for this exercise.


    # Preparing Azure resources


    Before we deep dive into the workings of Delta Lake, we need to spin up a few
    resources as follows:


    +   1. To save data in the delta format, we will use a temporary Azure data lake
    storage namespace for this exercise. Invoke the following commands in the Azure
    Cloud Shell.


    I had mentioned earlier that storage account names in Azure are globally unique.
    Throughout this exercise, we are using the storage account name traininglakehouse.
    You will need to edit it as per the account name that you created:


    ```

    SCRATCH_NAMESPACE="scratch"

    STORAGEACCOUNTNAME="traininglakehouse"

    ```'
  merge: -1
  img_proc: true
