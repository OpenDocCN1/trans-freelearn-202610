- pgno: 337
  md: '# 10

    Solving Data Engineering Challenges


    In the past few chapters, we learned about the data lakehouse architecture. After
    covering several exercises, we learned how a data engineer builds and deploys
    the bronze, silver, and gold layers of the lakehouse. Data in the lakehouse increases
    and changes over time. As new data sources get added and the previous ones undergo
    modifications, the data engineering practice needs to keep up with this growth.
    Just like anything else in the industry, the role of the data engineer needs to
    evolve as well. In addition to building and deploying data pipelines, they need
    to cover several other complicated aspects of data engineering that were not covered
    previously. They must learn to deal with these new challenges.


    In this chapter, we will cover the following topics:


    +   - Schema evolution

    +   - Sharing data

    +   - Data governance'
  merge: -1
  img_proc: true
- pgno: 338
  md: '# Schema evolution


    **Schema evolution** can be described as a technique that''s used to adapt to
    ongoing structural changes to data. As systems mature and add more functionality,
    schema evolution is inevitable. Therefore, adapting to schema evolution is an
    extremely important requirement of modern-day pipelines.


    It is customary to start developing pipelines so that they have base schemas for
    tables at the start of the project. Frequently, by the time things move into production,
    there is a very high likelihood that the schema for some incoming file or table
    has changed. But why is this such a big problem?


    > **Important**

    > A data engineer should never make the mistake of assuming that the schema of
    incoming data will never change. Instead, prepare the pipelines so that they auto-adjust
    to this evolution.


    Let''s discuss an example scenario to illustrate this point. Let''s assume your
    pipelines have been deployed in production and that, for a while, you have been
    ingesting an inventory file in the bronze layer that contains three columns: **inventory_date**,
    **product**, and **inventory**. In the silver layer, a Delta table for the same
    file exists called `inventory`. The very next day, when the inventory file was
    ingested, it was discovered that it contained not three but four columns. The
    schema for the inventory file had evolved. Now, the problem is how this new column
    can be effectively reflected in the lakehouse, as shown here:


    ![](img/dae8a2243a3c3cbcd9c56ff3d2217672_338_0.png)


    Figure 10.1 – Schema evolution'
  merge: -1
  img_proc: true
- pgno: 339
  md: 'The real challenge is that prior data for the inventory file had fewer columns
    than the new file that was received today. How can we accommodate the new column
    in the future while preserving the sanity of the previous data? In the past, we
    dealt with this problem in one of two ways:


    +   - We would create multiple versions of the inventory table, where a new version
    of the table will be created each time the schema changes. To get aggregate results,
    we can create a **VIEW** on top of all versions. This method has serious drawbacks.
    Not only do you need to create a new version of the table each time the schema
    changes, but the encompassing view needs to be changed as well.

    +   - A simpler method is to rewrite the old data files with a dummy column that
    has a value of **NULL**. After that, you can simply alter the schema of the table
    and add a new column to it. This method is a little better than the multi-version
    approach, but it could be a problem if the prior data is extremely large.


    A similar situation could arise if a previously existing column gets deleted from
    the new incoming file. The method of dealing with this delete scenario is very
    similar to what we''ve just talked about, except the treatment is reversed. In
    this case, the previous data stays as-is but the data with the missing column
    gets defaulted to **NULL** for future data.


    > **Important**

    > Before developing the pipelines, make sure the customer is in complete agreement
    with the method that''s been chosen for dealing with schema evolution. Changing
    this method after the project is in production could prove to be very costly.


    Fortunately, there is a simpler method we can implement here, and that involves
    using Delta Lake. **Delta Lake** can not only safeguard your data by enforcing
    **schema validation** but it can also adjust the schema, without the need for
    table versioning or rewriting prior data with the dummy column. Delta Lake automatically
    compares the schema of the incoming data against prior data. If a discrepancy
    is detected in Delta Lake, an exception is raised by default. You can override
    this default behavior and force the schema changes to be merged into the table,
    without the need to rewrite prior data. Let''s take a look at schema validation
    and evolution in Delta tables with the following example:


