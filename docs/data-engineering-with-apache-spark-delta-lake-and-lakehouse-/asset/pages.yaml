  md: '3. You may recall that `electroniz_curation_pipeline` invokes `electroniz_curation_notebook`
    using the `Run Curation Notebook` activity.


    Before we move ahead and verify the notebook run, it is important to understand
    at a high level what the notebook logic does. During the data curation process,
    the notebook performs the following steps:


    +   - Processes and reads incoming parameters passed by `electroniz_curation_pipeline`.

    +   - Reads raw data from the bronze layer of the lakehouse.

    +   - Invokes PySpark logic to curate data.

    +   - If it is the first run of the pipeline, new delta tables are created. Otherwise,
    incremental data is merged into existing delta tables in the silver layer of the
    lakehouse.

    +   - Catalogs the delta tables in the Hive metastore.


    To check the status of the notebook run, navigate to the Azure Databricks workspace
    and click on Data. Since we invoked `electroniz_curation_pipeline` for the very
    first time, the following tables have been recently created and cataloged in Hive.
    They are now ready for querying.


