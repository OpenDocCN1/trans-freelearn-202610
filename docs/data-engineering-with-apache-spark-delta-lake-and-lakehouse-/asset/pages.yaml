- pgno: 120
  md: '> **Important**

    > A key recipe for the success of any project is to keep the customer involved
    in all of the major decisions. After all, they will be responsible for managing
    the solution after you leave.


    So far so good. Based on the preceding findings, we need to design some key components
    of the data lakehouse:


    +   - The cloud architecture

    +   - The pipeline design

    +   - The deployment strategy


    # The cloud architecture


    After carefully reviewing the requirements, it is evident that **Electroniz**
    will truly benefit from a data lakehouse. Recall that we discussed the benefits
    of the lakehouse in *Chapter 2, Discovering Storage and Compute Data Lake Architectures*.
    A lakehouse provides a nice balance of low-cost storage and compute layers that
    natively support ACID transactions, SQL, schema evolution, and many other features.


    This is what the architecture of the **Electroniz** lakehouse will look like.


    # Raw data – the bronze layer


    Raw data from five data sources will be ingested into the bronze layer, as follows:


    +   - Datasets from the sales database, currency conversion, geo-location, and
    website tracking will be ingested using **Azure Data Factory** into **Azure Data
    Lake Storage**.

    +   - The e-commerce transactions will be streamed to Azure Event Hubs as events.
    Azure Event Hubs Capture will save events within **Azure Data Lake Storage**.'
  merge: -1
  img_proc: true
- pgno: 121
  md: 'Important

    It is customary to store data in the bronze layer in the exact shape and form
    as it was ingested from the source. This not only helps to preserve the exact
    state of data as ingested but also goes a long way in establishing a clear data
    lineage.


    # Curated data – the silver layer


    After data has been ingested within the bronze layer, it will be curated and standardized
    using Azure Databricks. This layer will merge the incremental data from the data
    sources using Delta Lake. Curated tables will be visible to users using Azure
    Synapse. The curated (Delta) tables can be readily consumed for the purposes of
    data analytics, machine learning, and artificial intelligence. Access to the curated
    tables enables users to have the option to analyze/aggregate data beyond the standard
    set of aggregations provided in the gold layer.


    Important

    Provisioning a unified layer for both batch and streaming data is a key component
    of the lakehouse architecture. The silver layer is the "bring it all together"
    zone, where data from varying types, sources, and formats is unified within one
    single location and in a common format, called delta.'
  merge: -1
  img_proc: true
- pgno: 122
  md: '# Aggregated data – the gold layer


    Finally, data from the silver layer will be aggregated using Azure Synapse. Aggregated
    results will be stored in Azure Data Lake Storage. Aggregated tables will be visible
    to users using Azure Synapse. Aggregated tables in the gold layer can be consumed
    for data analytics, machine learning, and artificial intelligence purposes. This
    is better illustrated in the following diagram:


    ![](img/dae8a2243a3c3cbcd9c56ff3d2217672_122_0.png)


    Figure 5.1 – The Electroniz cloud architecture


    > Important

    > Automated infrastructure provisioning helps organizations spin up cloud infrastructures
    quickly and reliably. A recommended career progression for a data engineer is
    to gain DevOps skills.'
