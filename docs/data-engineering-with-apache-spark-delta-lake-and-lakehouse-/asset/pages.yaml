- pgno: 401
  md: '# Important Note


    Even though the creation of secrets in Azure Key Vault can be automated, it is
    highly recommended to perform this step manually. You can request the customer’s
    IT team to create the secrets for you. Using this method ensures confidentiality
    at their end.


    3. We are now ready to deploy the Stores_Azure_SQL_Database template. Run the
    following commands using Azure Cloud SQL. These commands will deploy an Azure
    SQL Database template while dynamically fetching database credentials using secrets
    from Azure Key Vault created previously:


    ```

    SERVERNAME="elzsql"


    DATABASESNAME="salesdb"


    VAULTNAME="deploykvelz"


    PASSWORDSECRETNAME="SQLPASSWORD"


    USERSECRETNAME="SQLUSER"


    RESOURCEGROUPNAME="elz_prod"


    LOCATION="eastus"


    TEMPLATE_FILE="~/Data-Engineering-with-Apache-Spark-Delta-Lake-and-Lakehouse/project/infra/azure_sql/azure_sql.json"


    az deployment group create --name Stores_Azure_SQL_Database --resource-group $RESOURCEGROUPNAME
    --template-file $TEMPLATE_FILE --parameters vaultName=$VAULTNAME databaseName=$DATABASESNAME
    adminPasswordsecretName=$PASSWORDSECRETNAME sqlServerName=$SERVERNAME adminLoginUsersecretName=$USERSECRETNAME
    vaultResourceGroupName=$RESOURCEGROUPNAME

    ```'
