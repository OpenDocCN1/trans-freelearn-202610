- pgno: 452
  md: 'Click on Open under Open Azure Data Factory Studio:


    ![](img/dae8a2243a3c3cbcd9c56ff3d2217672_452_0.png)


    Figure 12.62 – Confirming the data pipelines created in Azure Data Factory


    The fact that we can see the four data pipelines we created in Azure Data Factory
    is enough to prove that electroniz_code_cicd_pipeline worked well. But the job
    is not completely done yet. We just created a CI/CD pipeline for existing code.
    Now, we need to make it work for future changes and additions.


    # Creating the CI/CD life cycle


    Hopefully, we all agree that the development of new code is a continuous process.
    Previously, we discussed the drawbacks of the traditional approach of committing
    several changes to the code repository, followed by a combined testing process.
    CI/CD mitigates some of these issues by integrating code continuously and deploying
    changes automatically. At a high level, the code merge cycle for the CI/CD pipeline
    looks like this:


    +   - **Build**: After changes, developers commit code in the shared repository,
    usually under a feature branch.

    +   - **Approve**: A pull request is generated by the developer for team approval.
    If the code fails approval, the reviewers either suggest fixes or approve the
    code for merge.

    +   - **Merge**: After a successful review, the feature branch is merged with
    the main branch.

    +   - **Deploy**: A process automatically deploys the code to production:'
  merge: -1
  img_proc: true
- pgno: 453
  md: '![](img/dae8a2243a3c3cbcd9c56ff3d2217672_453_0.png)


    # Figure 12.63 – The CI/CD life cycle


    In the following steps, we’ll find out how all of this works practically. The
    following steps will walk us through an example scenario:


    +   1. A developer commits a code change and creates a pull request for the reviewer(s)
    for approval.

    +   2. The reviewer(s) approve the change and merge it in the main branch.

    +   3. An automated CI/CD pipeline deploys the code.


    Please note that the following steps will be performed by multiple team members,
    so the owner is mentioned in each step.'
  merge: -1
  img_proc: true
