  md: '# Foreword


    I don''t think it is required anymore to explain the importance data plays in
    the modern world. Many of the online services we use today are powered by data
    systems of varying complexity. Machine learning emerged as a powerful tool for
    certain tasks in big part thanks to modern data platforms that can collect, process,
    and distribute large volumes of data. These data platforms also provide a strong
    foundation for data analytics and help drive real world decisions in healthcare,
    business, and education.


    One of the challenges that I have faced when I have started working in data space,
    which I''m sure is familiar to many of you, is the lack of good books and other
    educational resources on the topic. There is a lot of documentation on specific
    tools that you can use, but knowledge of what good architectures look like and
    which patterns work in which specific cases only resides with a few experts who
    have done this type of work before. This is especially true when it comes to emerging
    cloud technologies.


    Manoj is one of such experts since he has been implementing data platforms for
    companies in different industries for the last 10 years. In this book, he will
    share his knowledge and experience on architecting and implementing modern data
    platforms using Microsoft Azure, one of the leading cloud providers for data workloads.
    You will learn practical skills on implementing data lake architectures, implementing
    data pipelines, and running them in a production environment. Books like this
    are useful because they give you a download of the knowledge and experience that
    Manoj has accumulated over the years and you know that recipes and advice he gives
    will work in a real-life implementation because he has implemented similar systems
    many times before.'
  merge: -1
  img_proc: true
