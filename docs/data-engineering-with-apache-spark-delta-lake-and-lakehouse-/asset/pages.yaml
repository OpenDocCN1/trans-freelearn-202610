    We will now look at sharing data. This is quickly becoming a necessity for organizations
    who are wanting to harness the power of data in monetary terms.


    # Sharing data


    In Chapter 1, The Story of Data Engineering and Analytics, we discussed the power
    of data. This has enabled organizations to realize revenue diversification using
    data monetization. But this dream cannot be effectively realized without sharing
    data with external parties. In the past, organizations used several data-sharing
    mechanisms such as emails, SFTP, APIs, cloud storage, and hard drives:'
  merge: -1
  img_proc: true
- pgno: 355
  md: '![](img/dae8a2243a3c3cbcd9c56ff3d2217672_355_0.png)


    Figure 10.23 – State of data sharing currently


    Unfortunately, there are several problems related to these data-sharing methods:


    +   - **Complex**: These data sharing mechanisms can be complex to set up and
    use because they may require exchanging keys/passwords and using a variety of
    different tools.


    +   - **Insecure**: These mechanisms may not be secure for data-at-rest or data-in-transit.
    This means the classic **man-in-the-middle** attack could expose data in cleartext.


    +   - **Tracking**: There is no clear method available for effectively tracking
    who shared data with whom and using which mechanism.


    +   - **Control**: You can''t control over who is using the shared data.


    +   - **Updates**: Sharing data is a continuous process, and using the mechanisms
    mentioned previously does not provide a simple way to share updates.


    Fortunately, there is an effective alternative. Azure allows organizations to
    share data both internally and externally using a simple and secure service named
    **Azure Data Share**. Using Azure Data Share, users sharing data (**providers**)
    can easily invite users they wish to share data with (**consumers**). Before the
    data is shared with the consumers, they are required to accept the data usage
    terms. Updates to data can also be shared on a set frequency that''s been configured
    by the provider. Data sharing can happen in one of two ways. We will look at both
    in the following subsections.'
  merge: -1
  img_proc: true
- pgno: 356
  md: '# In-place sharing


    In this case, data always stays in the provider''s Azure subscription, and a symbolic
    link is sent to the consumer''s Azure subscription. Consumers can read the data
    using this symbolic link, as shown here:


    ![](img/dae8a2243a3c3cbcd9c56ff3d2217672_356_0.png)


    Figure 10.24 – In-place sharing using Azure Data Share


    # Snapshot sharing


    In this case, data moves from the data provider''s Azure subscription and lands
    in the data consumer''s Azure subscription:


    ![](img/dae8a2243a3c3cbcd9c56ff3d2217672_356_1.png)


    Figure 10.25 - Snapshot sharing using Azure Data Share


    Let''s learn more about sharing data by performing a simple exercise. For this
    exercise, you will need a sharing buddy to act as the consumer. Your buddy should
    have an operational Azure account. If they don''t, they can create a new one.'
  merge: -1
  img_proc: true
