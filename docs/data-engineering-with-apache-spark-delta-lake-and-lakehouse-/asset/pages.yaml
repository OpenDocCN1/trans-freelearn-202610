    # The paradigm shift to distributed computing


    The traditional data processing approach used over the last few years was largely
    singular in nature. To process data, you had to create a program that collected
    all required data for processing—typically from a database—followed by processing
    it in a single thread. This type of processing is also referred to as **data-to-code**
    processing. Unfortunately, there are several drawbacks to this approach, as outlined
    here:


    +   - Since vast amounts of data travel to the code for processing, at times this
    causes heavy network congestion. Since a network is a shared resource, users who
    are currently active may start to complain about network slowness.'
  merge: -1
  img_proc: true
- pgno: 29
  md: '+   - Being a single-threaded operation means the execution time is directly
    proportional to the data. Therefore, the growth of data typically means the process
    will take longer to finish. This could end up significantly impacting and/or delaying
    the decision-making process, therefore rendering the data analytics useless at
    times.

    +   - Something as minor as a network glitch or machine failure requires the entire
    program cycle to be restarted, as illustrated in the following diagram:


    ![](img/dae8a2243a3c3cbcd9c56ff3d2217672_29_0.png)


    Figure 1.4 – Rise of distributed computing


    The distributed processing approach, which I refer to as the paradigm shift, largely
    takes care of the previously stated problems. Instead of taking the traditional
    data-to-code route, the paradigm is reversed to code-to-data.


    In a distributed processing approach, several resources collectively work as part
    of a cluster, all working toward a common goal. In simple terms, this approach
    can be compared to a team model where every team member takes on a portion of
    the load and executes it in parallel until completion.

    If a team member falls sick and is unable to complete their share of the workload,
    some other member automatically gets assigned their portion of the load.


    Distributed processing has several advantages over the traditional processing
    approach, outlined as follows:


    +   - The code-to-data paradigm shift ensures the network does not get clogged.
    The entire idea of distributed processing heavily relies on the assumption that
    data is stored in a distributed fashion across several machines, also referred
    to as nodes. At the time of processing, only the code portion (usually a much
    smaller footprint as compared to actual data) is sent over to each node that stores
    the portion of the data being processed. This ensures that the processing happens
    locally on the node where the data is stored.'
  merge: -1
  img_proc: true
- pgno: 30
  md: '+   - Since several nodes are collectively participating in data processing,
    the overall completion time is drastically reduced.

    +   - Program execution is immune to network and node failures. If a node failure
    is encountered, then a portion of the work is assigned to another available node
    in the cluster.


    > **Important note**

    > Distributed processing is implemented using well-known frameworks such as Hadoop,
    Spark, and Flink. Modern **massively parallel processing (MPP)**-style data warehouses
    such as Amazon Redshift, Azure Synapse, Google BigQuery, and Snowflake also implement
    a similar concept.


    Since distributed processing is a multi-machine technology, it requires sophisticated
    design, installation, and execution processes. That makes it a compelling reason
    to establish good data engineering practices within your organization.


    # Adoption of cloud computing


    The vast adoption of cloud computing allows organizations to abstract the complexities
    of managing their own data centers. Migrating their resources to the cloud offers
    faster deployments, greater flexibility, and access to a pricing model that, if
    used correctly, can result in major cost savings.


    In the previous section, we talked about distributed processing implemented as
    a cluster of multiple machines working as a group. For this reason, deploying
    a distributed processing cluster is expensive.


    In the pre-cloud era of distributed processing, clusters were created using hardware
    deployed inside on-premises data centers. Very careful planning was required before
    attempting to deploy a cluster (otherwise, the outcomes were less than desired).
    You might argue why such a level of planning is essential. Let me address this:


    +   - Since the hardware needs to be deployed in a data center, you need to physically
    procure it. The real question is how many units you would procure, and that is
    precisely what makes this process so complex.

    +   - Order more units than required and you''ll end up with unused resources,
    wasting money.

    +   - Order fewer units than required and you will have insufficient resources,
    job failures, and degraded performance.'
  merge: -1
  img_proc: true
- pgno: 31
  md: 'To order the right number of machines, you start the planning process by performing
