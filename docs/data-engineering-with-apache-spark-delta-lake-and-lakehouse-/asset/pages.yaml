    test cloud connectivity, and set up development environments.


    Before we initiate the development, I want to make sure that we clearly understand
    what the bronze layer means in a lakehouse architecture.


    # Understanding the bronze layer


    Inside a lakehouse, the bronze layer stores raw data exactly in the same shape,
    form, and format as it was collected from the data sources. The following is a
    list of some of the features of the data within the bronze layer:


    +   - **Unclean and non-standardized:** This is deemed unsuitable for consumption
    by analytical workloads.

    +   - **Support for multiple formats and types:** Data in the bronze layer might
    be structured, semi-structured, or unstructured. It can also be a combination
    of text and binary types.

    +   - **Immutable:** By definition, data in the bronze layer should not be editable.
    If data changes over time, it is stored as duplicate copies.

    +   - **Stored forever:** Data in the bronze layer is never deleted. This is less
    of a concern due to the low cost of storage. However, to save costs, some portions
    of data might be archived.


    Having data in the native format offers several advantages, as follows:


    +   - **Replayed:** Often, analysts and data scientists discover mistakes and
    oversights in coding. This requires data in the silver and gold layers to be rebuilt
    from scratch. Since original data is available, future transformations can be
    regenerated by replaying data from start to finish.

    +   - **Repurposed:** As new requirements trickle in, having access to original
    data helps data engineers create new transformations.

    +   - **Audit:** Having data in a native format is extremely important for data
    lineage and accuracy.'
  merge: -1
  img_proc: true
- pgno: 126
  md: '> **Important**

    > Here, lineage refers to the traceability of the journey that data has taken
    over time. Many compliance frameworks look at data lineage as solid proof of whether
    an organization has followed the best practices regarding data usage or not.


    Now that we have learned about the different layers of the lakehouse, let''s move
