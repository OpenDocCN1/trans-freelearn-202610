- pgno: 305
  md: '# 9

    Deploying and Monitoring Pipelines in Production


    The journey of data is fast approaching its destination. In the previous chapter,
    we learned about data aggregation and how to build the gold layer of a lakehouse.
    Data in the gold layer is the representation of summary data, which keeps changing
    every time new data gets ingested. Therefore, it is a cyclical process. Now that
    we have built and tested all of the necessary pieces of the Electroniz lakehouse,
    we need to start thinking about deploying the pipeline in production. This is
    so that it can serve the needs of the end users in the most timely and durable
    fashion.


    In this chapter, we will cover the following topics:


    +   - The deployment strategy

    +   - Developing the master pipeline

    +   - Testing the master pipeline

    +   - Scheduling the master pipeline

    +   - Monitoring pipelines'
  merge: -1
  img_proc: true
- pgno: 306
  md: '# The deployment strategy


    We have worked extremely hard to get to the point where we have three functional
    pipelines, as follows:


    +   - **The Electroniz ingestion pipeline:** `electroniz_batch_ingestion_pipeline`

    +   - **The Electroniz curation pipeline:** `electroniz_curation_pipeline`

    +   - **The Electroniz aggregation pipeline:** `electroniz_aggregation_pipeline`


    Just as a recap, in the last few chapters, we followed multiple steps in order
    to create these pipelines. After their creation, we invoked each one manually
    to unit test their functionality. Finally, we validated the data that each one
    produced to make sure it matched the expectation of the **Electroniz** use cases.
    That''s a lot of work, so we should be proud to have reached this far.


    Assuming we are happy with the outcomes of the unit tests performed on the preceding
    pipelines, it is time to start thinking about the best way to deploy these pipelines
    in production. As per best practices, the three pipelines should run as one complete
    unit. Each pipeline run, which is also referred to as a job, should work by invoking
    the ingestion pipeline to pull incremental data from various sources. This is
    followed by invoking the curation pipeline, which cleanses the data and merges
    it in **Delta Lake** tables. Finally, the aggregation pipeline summarizes data
    for use by end users.


    Typically, pipelines are deployed in two ways, as described next.


    # The time-based method


    In the **time-based method**, each pipeline is deployed separately and invoked
    according to a time-based approach. For example, you can invoke the ingestion
    pipeline at 12:00 a.m., invoke the curation pipeline at 12:20 a.m., and invoke
    the aggregation pipeline at 12:30 a.m. The following is a list of some of the
    pros and cons of this method:


    +   - **The overall deployment is simple:** You simply need to schedule each pipeline
    at a designated time.

    +   - **It requires time precision:** The invocation time of each pipeline needs
    to be carefully calculated; otherwise, they might overlap each other. You do not
    want the second pipeline to start before the first one has finished.'
  merge: -1
  img_proc: true
- pgno: 307
  md: '+   - **There is less control:** Overall, there is little control over the
    success of the pipeline because each one runs separately without any dependencies
    on each other:


    ![](img/dae8a2243a3c3cbcd9c56ff3d2217672_307_0.png)


    Figure 9.1 – The time-based method of deploying pipelines


    # The event-based approach


    In the **event-based method**, a master pipeline is created that runs all other
    pipelines bases on success and failure events. For example, first, invoke the
    ingestion pipeline. Then, on success, invoke the curation pipeline. Then, on success,
    invoke the aggregation pipeline. The following is a list of some of the pros and
    cons of this method:


    +   - **It requires a master pipeline:** In this method, a master pipeline is
    required that orchestrates the run of all other pipelines.


    +   - **Time precision is less of a concern:** In this method, only the master
    pipeline schedules other pipelines. Once invoked, the master pipeline controls
    the run of all other pipelines in a controlled manner that is driven using events.'
  merge: -1
  img_proc: true
- pgno: 308
  md: '+   - **Enhanced control**: This method offers more control in comparison to
    the time-based method. The subsequent pipeline does not start until the predecessor
    has completed:


    ![](img/dae8a2243a3c3cbcd9c56ff3d2217672_308_0.png)


    Figure 9.2 – The event-based method of deploying pipelines


    The event-based method is preferable since it offers greater control over the
    eventual success of the pipelines. For the reasons stated earlier, let’s use this
    approach to deploy the Electroniz pipeline. In the next section, we will start
    creating a master pipeline that will invoke the rest of the pipelines.


    # Developing the master pipeline


    To start the creation of the master pipeline, make sure you have the `electroniz_batch_ingestion_pipeline`,
    `electroniz_curation_pipeline`, and `electroniz_aggregation_pipeline` pipelines
    installed and in working condition in the Azure data factory:'
