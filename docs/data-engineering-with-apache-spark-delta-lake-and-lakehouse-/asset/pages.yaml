- pgno: 40
  md: '# Introducing data lakes


    Over the last few years, the markers for effective data engineering and data analytics
    have shifted. Up to now, organizational data has been dispersed over several internal
    systems (silos), each system performing analytics over its own dataset.


    Additionally, it has been difficult to interface with external datasets for extending
    the spectrum of analytic workloads. As a result, it has been difficult for these
    organizations to get a **unified** view of their data and gain **global insights**.


    In a world where organizations are seeking revenue diversification by fine-tuning
    existing processes and generating organic growth, a globally unified repository
    of data has become a core necessity. Data lakes solve this need by providing a
    unified view of data into the hands of users who can use this data to devise innovative
    techniques for the betterment of mankind.


    The following diagram outlines the characteristics of a data lake:


    ![](img/dae8a2243a3c3cbcd9c56ff3d2217672_40_0.png)


    Figure 2.1 – Characteristics of a data lake


    You will find several varying definitions of a data lake on the internet. Instead
    of defining what a data lake is, let''s focus on the benefits of having a data
    lake for a modern-day organization.


    We will also see how the storage and computations process in a data lake differs
    from traditional data storage solutions such as databases and data warehouses.


    > **Important note**

    > In the modern world, the typical **extract, transform, load (ETL)** process
    (collecting, transforming, and analyzing) is simply not enough. There are other
    aspects surrounding the ETL process—such as security, orchestration, and delivery—that
    need to be equally accounted for.'
  merge: -1
  img_proc: true
- pgno: 41
  md: '# Exploring the benefits of data lakes


    In addition to just being a simple repository, a data lake offers several benefits
    that make it stand out as a strong data management solution for modern data analytic
    needs.


    # Accommodating varying data formats


    The most advertised benefit of a data lake is its ability to store structured,
    semi-structured, and unstructured data on a large scale. The increasing variety
    of data sources that participate in the data analytics process has introduced
    a new challenge. Since there has not been an accepted standard around data exchange
    formats, it is pretty much up to the discretion of the data provider to choose
    one for you. Some commonly used data exchange formats and their common uses are
    listed as follows:


    +   - Structured—Database rows

    +   - Semi-Structured—Comma-separated values (CSV), Extensible Markup Language
    (XML), and JavaScript Object Notation (JSON).

    +   - Unstructured—Internet of things (IoT), logs, and emails


    These can be better represented as follows:


    ![](img/dae8a2243a3c3cbcd9c56ff3d2217672_41_0.png)


    Figure 2.2 – Support for varying formats in a data lake'
  merge: -1
  img_proc: true
- pgno: 42
  md: '> **Important note**

    > Data lakes do not differentiate data based on its structure, format, or size.


    The **flexibility** of a data lake to store and process varying data formats makes
    it a one-stop shop for data analytics operations capable of dealing with a variety
    of data sources in one place. Without a data lake in place, you would need to
    deal with silos of data, resulting in dispersed analytics without a unified view
    of data.


    # Storing data in zones


    A data lake is a repository of data that stores data in various zones. Although
    there are no limits or rules for how many zones are ideally required, three zones
    are generally considered the best practice: **raw**, **curated**, and **transformed**,
    as illustrated in the following diagram:


    ![](img/dae8a2243a3c3cbcd9c56ff3d2217672_42_0.png)


    Figure 2.3 – Data lake zones and maturity of data


    As data moves through each zone, it increases in maturity, becomes a lot cleaner,
    and finally achieves its true purpose for which it was originally collected: **data
    analytics**.'
  merge: -1
  img_proc: true
- pgno: 43
  md: 'Once data gets ingested from a variety of sources such as databases, files,
    **application programming interfaces (APIs)**, and IoT in the raw zone, it passes
    through a wrangling (cleaning) process to validate, standardize, and harmonize
    it—in short, bring all data to a common level in terms of format and organizational
    standards. After cleansing, data is saved to the curation zone.


    The next phase of processing is done in a **self-service model**. Various sub-groups
    within the analytics group—such as data analysts, data scientists, **machine learning
    (ML)** engineers, and **artificial intelligence (AI)** engineers—start transforming
    data as per requirements.


    > **Important note**

    > Each sub-group has different requirements and views data a little differently
    from the others, but a data lake gives everyone the opportunity to use a unified
    set of data (in the curation zone) but reach different conclusions.


    A typical set of transform operations include a combination of joining datasets,
    data aggregation, and data modeling. Finally, the results of the transformations
    are stored in the transformation zone. Now, data is ready to make the final leg
    of its journey.


    Once data is in the transformation zone, it needs to be properly cataloged and
    published. Very frequently, data gets published in a **data warehouse** where
    it can be queried by **business intelligence (BI)** engineers for creating visualizations—dashboarding,
    charting, and reporting. The data has now met its final purpose.


    # Accommodating varying data characteristics


    Data lakes can support varying characteristics of data, outlined as follows:


    +   - **Volume**—In the early days of big data, everyone was focused on dealing
    with the growing size of data. Due to the immense growth of data, resource limits
    of databases and processing platforms were being tested to the limits. It was
    at this time that **Hadoop** originated as a distributed storage (**Hadoop Distributed
    File System**, or **HDFS**) and distributed processing (**MapReduce**) platform
    capable of dealing with large amounts of data at scale.'
  merge: -1
  img_proc: true
- pgno: 44
  md: '+   - **Variety**—Once organizations started to use Hadoop, the need to store
    and process large data volumes started to slowly diminish. This was the phase
    when dealing with large varieties of data—structured, semi-structured, and unstructured—became
    the top priority. The Hadoop framework was quickly able to deal with this because
    of its ability to store any format of data in HDFS, and MapReduce was able to
    read/write data using a variety of **serializers/deserializers (SerDes)**.

    +   - **Velocity**—The rise of modern data sources such as IoT, logs, and social
    networking has created the challenge of dealing with incoming data at high speeds.
    During this phase, the Hadoop framework started to fall short due to its inability
    to deal with streaming data effectively, and other frameworks such as Spark, Kafka,
    and Flink started to take its place. We still seem to be in this phase, where
    a lot of work is going into the adoption of frameworks that are capable of accommodating
    batch and streaming workloads.

    +   - **Veracity**—As we continue to ingest, store, and process big data, a lot
    of organizations are getting concerned about the quality of data, asking: *Is
    my data precise, out-of-date, or biased?* While the other characteristics of data
    highlighted here are well defined, this one is a little more complex to handle.
    Organizations are looking for innovative methods to fix data quality, both at
    technical and operational levels.


    > **Important note**

    > While a *data lake* is a globally accepted term/concept, it may be implemented
    using a range of tools, services, and frameworks. It can be created using on-premises
    hardware, but the true power is realized when a data lake is created in the cloud.


    # Adhering to compliance frameworks


    It is becoming a standard practice to incorporate security in every layer of a
    data lake. It is safe to assume these days that a typical organization is likely
    to fall under at least one compliance framework or another, such as the **General
    Data Protection Regulation (GDPR)**, **Health Insurance Portability and Accountability
    Act (HIPAA)**, **Payment Card Industry (PCI)**, or the **Sarbanes-Oxley Act (SOX)**.


    The three pillars of data security are depicted in the following screenshot:'
  merge: -1
  img_proc: true
- pgno: 45
  md: '![](img/dae8a2243a3c3cbcd9c56ff3d2217672_45_0.png)


    Figure 2.4 – The three pillars of data security


    During a brief period of my career, I was heavily focused on data security audits.
    I still remember something that one of the customers jokingly said over 15 years
    ago, as his words have resonated several times since. He held a sales report in
    his hand and said:


    > "There will come a time when people will care less about the correctness of
    data but will care more that it was processed securely."


    Quite honestly, the sentence did not make too much sense to me at the time, but
    today, I can fully relate to it.


    Important note

    For any organization that deals with data, security is no longer a luxury—it is
    a core requirement.


    As per the CIA triad, the key pillars of security are integrity, confidentiality,
    and availability. Following these principles, security in a data lake should be
    implemented in layers: the greater number of layers, the more protection. Data
    lakes can comply with the core requirements of most compliance frameworks using
    the following techniques to cover the key pillars of the CIA triad:


    +   - Perimeter security—Access to data lake resources can be limited using a
    combination of site-to-site virtual private networks (VPNs), filtering Internet
    Protocol (IP) addresses, and blocking access to the internet.

    +   - Access control—User access in a data lake can be controlled by a combination
    of role-based access control (RBAC), policies, access control lists (ACLs), multi-factor
    authentication (MFA), and single-sign-on (SSO).'
  merge: -1
  img_proc: true
- pgno: 46
  md: '+   - **Encryption**—A key method of protecting **data-in-motion** (traveling
    from one point to another) and **data-at-rest** (in storage) is using encryption.
    Encryption can be implemented not only at the file level in the storage, but also
    any **personally identifiable information (PII)** data within a file can be encrypted.

    +   - **Authorization**—Extreme caution is desired during data distribution. The
    task becomes even more complex if data distribution includes external users. A
    data lake can comply with authorization needs by implementing a role-based access
    mechanism (RBAC) using a combination of table-, row-, and column-based security
    and data masking.


    > **Important note**

    > The CIA triad is simply a guideline for an organization''s security program.

    > The strength of security is directly proportional to the number of layers implemented
    within it.


    Next, we''ll see how storage and compute can be segregated within a data lake.


    # Segregating storage and compute in a data lake


    We saved the best for last. The ability of a data lake to segregate (decouple)
    the storage and compute layers is perhaps one of its most desirable features.
    But why is decoupling storage and computation such a big deal? To understand why,
    we should first understand the storage and compute layers.


    # Storage


    The fundamental function of storage is to store data. Briefly, this is how storage
    has evolved over the last few years:


    +   - **Direct-attached storage (DAS)**—As the name suggests, a storage device
    (**hard disk drive/solid-state drive**, or **HDD/SSD**) is physically attached
    to the computer. This type of storage mostly exists in personal computers and
    laptops.

    +   - **Network-attached storage (NAS)**—Centralized storage using multiple hard
    drives connected as an array. NAS allows quick and easy sharing of data between
    computers using regular ethernet.

    +   - **Storage area network (SAN)**—High-performance shared storage using fiber-optic
    connectivity. A SAN allows for the fast sharing of data between computers.'
  merge: -1
  img_proc: true
- pgno: 47
  md: '+   - **Cloud storage**—Cloud storage is a relatively recent addition to this
    list. In this case, the storage physically exists on the cloud-provider servers.
    Cloud storage allows users the flexibility to access it from anywhere, as well
    as an assurance that data is highly available and safe because multiple copies
    are maintained on the backend.


    > **Important note**

    > Azure Blob storage, Amazon Simple Storage Service (S3), and Google Cloud Storage
    are some of the best-known cloud storage solutions.


    # Block storage


    All storage types in the preceding list (except cloud storage) are categorized
    as file and block storage. This means data is stored on the storage device in
    small-sized blocks, usually 512 bytes in size. A group of contiguous blocks is
    deemed a file, and that is how humans relate to data.


    # Object storage


    Cloud storage is categorized as object storage. Object storage does not work like
    a traditional filesystem. Unlike block storage, every object contains the following:


    +   - **Identifier (id)**—A globally unique identifier (GUID) for each object
    in storage

    +   - **Data**—Stored as blobs all in one location (not broken into multiple blocks)

    +   - **Metadata**—Data about the data, such as author, permissions, and timestamps


    The differences between block and object storage are better illustrated as follows:


    # Block Storage


    # Object Storage


    ![](img/dae8a2243a3c3cbcd9c56ff3d2217672_47_0.png)


    Figure 2.5 – Block storage versus object storage'
  merge: -1
