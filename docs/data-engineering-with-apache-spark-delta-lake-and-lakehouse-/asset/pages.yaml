- pgno: 15
  md: '# Preface


    In the world of ever-changing data and ever-evolving schemas, it is important
    to build data pipelines that can auto-adjust to changes. This book will help you
    build scalable data platforms that managers, data scientists, and data analysts
    can rely on.


    Starting with an introduction to data engineering, along with its key concepts
    and architectures, this book will show you how to use Microsoft Azure cloud services
    effectively for data engineering. You''ll cover data lake design patterns and
    the different stages through which the data needs to flow in a typical data lake.
    Once you''ve explored the main features of Delta Lake to build data lakes with
    fast performance and governance in mind, you''ll advance to implementing the lambda
    architecture using Delta Lake. Packed with practical examples and code snippets,
    this book takes you through real-world examples based on production scenarios
    faced by the author in his 10 years of experience working with big data. Finally,
    you''ll cover data lake deployment strategies that play an important role in provisioning
    cloud resources and deploying data pipelines in a repeatable and continuous way.


    By the end of this data engineering book, you''ll have learned how to effectively
    deal with ever-changing data and create scalable data pipelines to streamline
    data science, ML, and artificial intelligence (AI) tasks.


    # Who this book is for


    This book is for aspiring data engineers and data analysts who are new to the
    world of data engineering and are looking for a practical guide to building scalable
    data platforms. If you already work with PySpark and want to use Delta Lake for
    data engineering, you''ll find this book useful. Basic knowledge of Python, Spark,
    and SQL is expected.


    # What this book covers


    *Chapter 1, The Story of Data Engineering and Analytics*, introduces the core
    concepts of data engineering. It introduces you to the two data processing architectures
    in big data – Lambda and Kappa.'
  merge: -1
  img_proc: true
- pgno: 16
  md: '*Chapter 2, Discovering Storage and Compute Data Lake Architectures,* introduces
    one of the most important concepts in data engineering – segregating storage and
    compute layers. By following this principle, you will be introduced to the idea
    of building data lakes. An understanding of this key principle will lay the foundation
    for your understanding of the modern-day data lake design patterns discussed later
    in the book.


    *Chapter 3, Data Engineering on Microsoft Azure,* introduces the world of data
    engineering on the Microsoft Azure cloud platform. It will familiarize you with
    all the Azure tools and services that play a major role in the Azure data engineering
    ecosystem. These tools and services will be used throughout the book for all practical
    examples.


    *Chapter 4, Understanding Data Pipelines,* introduces you to the idea of data
    pipelines. This chapter further enhances your knowledge of the various stages
    of data engineering and how data pipelines can enhance efficiency by integrating
    individual components together and running them in a streamlined fashion.


    *Chapter 5, Data Collection Stage – The Bronze Layer,* guides us in building a
    data lake using the Lakehouse architecture. We will start with data collection
    and the development of the bronze layer.


    *Chapter 6, Understanding Delta Lake,* introduces Delta Lake and helps you quickly
    explore the main features of Delta Lake. Understanding Delta Lake’s features is
    an integral skill for a data engineering professional who would like to build
    data lakes with data freshness, fast performance, and governance in mind. We will
    also be talking about the Lakehouse architecture in detail.


    *Chapter 7, Data Curation Stage – The Silver Layer,* continues our building of
    a data lake. The focus of this chapter will be on data cleansing, standardization,
    and building the silver layer using Delta Lake.


    *Chapter 8, Data Aggregation Stage – The Gold Layer,* continues our building a
    data lake. The focus of this chapter will be on data aggregation and building
    the gold layer.


    *Chapter 9, Deploying and Monitoring Pipelines in Production,* explains how to
    effectively manage data pipelines running in production. We will explore data
    pipeline management from an operational perspective and cover security, performance
    management, and monitoring.


    *Chapter 10, Solving Data Engineering Challenges,* lists the major challenges
    experienced by data engineering professionals. Various use cases will be covered
    in this chapter and a challenge will be offered. We will deep dive into the effective
    handling of the challenge, explaining its resolution using code snippets and examples.'
  merge: -1
  img_proc: true
- pgno: 17
