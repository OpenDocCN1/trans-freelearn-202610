  md: 'From the looks of things, the electroniz_batch_ingestion_pipeline pipeline
    worked as expected for the first run.


    # Testing the batch ingestion pipeline for incremental data


    We will now check how the pipeline reacts to incremental data inside the stores
    database. To do that, we will emulate changes to the database, including inserts,
    updates, and deletes. Following this, we will retrigger electroniz_batch_ingestion_pipeline
    three more times and validate that the newly added data has made its way through
    to the lakehouse.


    # The second run of the pipeline – inserts


    Currently, the first hour after the initial ingestion is taking place. We are
    going to assume that, at this time, the sales database is fully operational and
    new customers and orders are being inserted. To emulate the insert activity, let''s
    insert some data into the sales database:


    +   1. Return to the Azure SQL database and check the latest watermarks.


    Navigate to Home | All Resources | salesdb | Query Editor. Run the following query:


    ```

    SELECT TOP (1000) * FROM [dbo].[watermarktable]

    ```


    Notice the watermark value for each table. This timestamp represents the last
    time data was ingested by electroniz_batch_ingestion_pipeline:


    ![](img/dae8a2243a3c3cbcd9c56ff3d2217672_165_0.png)


    Figure 5.50 – The watermark values after the first run of the batch ingestion
    pipeline'
  merge: -1
  img_proc: true
- pgno: 166
  md: '2. Copy the contents of the following file in the training Git repository:

    https://raw.githubusercontent.com/PacktPublishing/Data-Engineering-with-Apache-Spark-Delta-Lake-and-Lakehouse/main/project/prep/stores/sql/incremental/1/storedb_incremental_1.sql.


    Paste the contents into the Query Editor window. Select Run. This will insert
    100 new rows in the store_customers table and 200 rows in the store_orders table:


    ![](img/dae8a2243a3c3cbcd9c56ff3d2217672_166_0.png)


    3. Additionally, we have received a new website tracking log that needs to be
    ingested. Copy each of the following commands, line by line, and paste them into
    the Cloud Shell window. Then, press Enter:


    ```

    LOGSTORAGEACCOUNTNAME="ecommercetracking"

    ```


    ```

    LOGSCONTAINER="ecommercelogs"

    ```


    ```

    RESOURCEGROUPNAME="training_rg"

    ```


    ```

    LOCATION="eastus"

    ```


    ```

    KEY=`az storage account keys list -g $RESOURCEGROUPNAME -n $LOGSTORAGEACCOUNTNAME
    | jq .[0].value`

    ```


    ```

    az storage container create -n $LOGSCONTAINER --account-name $LOGSTORAGEACCOUNTNAME
    --account-key $KEY

    ```


