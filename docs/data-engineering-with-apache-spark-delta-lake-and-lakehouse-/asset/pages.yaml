    # The need to aggregate data


    Before we deep dive into how to aggregate data and build the gold layer of the
    Electroniz lakehouse, we should quickly remind ourselves why we’re building the
    lakehouse in the first place. During the discovery phase, Electroniz had put forth
    some key business requirements, as follows:


    +   - They want to aim for a near-real-time sales analytics platform that can
    serve their customer needs faster and better.

    +   - They want to streamline their advertising budgets through intelligent analytics
    based on the number of user hits on their e-commerce website.

    +   - They want to decrease customer dissatisfaction because of interruptions
    in fulfilling orders due to inventory shortages.


    Thus far, we have been able to identify, collect, and curate data from a variety
    of sources to help us perform intelligent decision-making using modern analytics.
    At this point, we have data in the silver layer that represents the state of the
    data that has been standardized, validated, de-duplicated, and secured. But does
    it provide the answers to all the business requirements that Electroniz wanted
    us to address? In short, the answer is not yet. So, how do we go about looking
    for the right answers?


    > **Important**

    > In data terms, the silver layer of every dataset is referred to as an "observation."
    Each dataset has multiple rows that are referred to as "variables."


    The objective of creating the gold layer is to **aggregate** or **summarize**
    data. **Aggregation** is a technique that’s used to identify patterns over a collection
    of observations using a set of variables. Some common examples of aggregations
    are the total sales over a given quarter, the total number of users per month
    who visited your website, and the average salary of your employees per department.


    Largely, the structure (schema) of the data in the silver layer is very similar
    to the source where it was ingested from. On the contrary, the structure of aggregated
    data is either two-dimensional like a table or multi-dimensional like a cube:'
  merge: -1
  img_proc: true
- pgno: 263
  md: '# Sales Table


    ![](img/dae8a2243a3c3cbcd9c56ff3d2217672_263_0.png)


    # Sales Cube


    ![](img/dae8a2243a3c3cbcd9c56ff3d2217672_263_1.png)


    # Two-dimensional vs

    Multi-dimensional aggregation


    Figure 8.1 – Two-dimensional versus multi-dimensional data


    Let''s take a look at this in more detail:


    +   - **Two-dimensional aggregations** summarize data over two given variables.
    For example, what is the aggregate sales per quarter for a given product?

    +   - **Multi-dimensional aggregations** summarize data over multiple variables
    in the form of hierarchies. For example, you can find the aggregate sales per
    quarter for a given product by country.


    Now that we know why data is useful and why aggregating data is helpful, let''s
    look at the data aggregation process.


    # The process of aggregating data


    Although the objective of data aggregation is largely straightforward, you should
    follow a definitive process. The data aggregation process is a co-shared responsibility
    between the customer and the data engineer. Each entity needs to contribute toward
    the objective through a combination of business and technical knowledge:


    ![](img/dae8a2243a3c3cbcd9c56ff3d2217672_263_2.png)


    Figure 8.2 – Data aggregation process'
  merge: -1
  img_proc: true
- pgno: 264
  md: 'This process can be explained as follows:


    +   - **Define KPIs**: The process of data aggregation starts by defining the
    **key performance indicators (KPIs)**. Data engineers are not the best resources
    for making such business-oriented decisions. Therefore, it is important to seek
    customer help on this one since they are closer to the business and can make these
    decisions more accurately.


    > **Important**

    > A quantifiable metric that''s used to measure a company''s success or failure
    is called a KPI. KPIs are often used to evaluate whether the company has met its
    objectives or not. These KPIs are best defined by people who know the business
    well enough to gauge whether a certain indicator can accurately define success
    or failure criteria.


    +   - **Shortlist the Observations**: Once the KPIs have been well defined, the
    data engineer (with assistance from the customer) should shortlist the list of
    observations (datasets) that will participate in the aggregations. It is important
    to perform a detailed analysis of the datasets to fully understand the inter-dependencies,
    groupings, and filtering mechanisms.


    +   - **Summarize the Data**: This is the stage where the data engineer will develop
    the logic to perform the necessary data aggregations. Aggregation logic can be
    developed in several coding languages, although these days, the two most common
    ones are SQL and Spark. Once the logic has been developed, it needs to be integrated
    into the overall pipeline, which runs on a scheduled basis.


    +   - **Visualize the Data**: As humans, we relate well to visuals. Visualizing
    aggregated data in the form of colorful charts, maps, and dashboards is a common
    method that''s used by modern-day decision-makers. In Chapter 1, *The Story of
    Data Engineering and Analytics*, we discussed the importance of data storytelling.
    Visualizing aggregated data narrates a well-crafted story regarding an organization''s
    health and well-being.


    I started this book by stating "Every byte of data has a story to tell. The real
    question is whether the story is being narrated accurately, securely, and efficiently."
    At this point, we are ready to narrate the story of Electroniz.'
  merge: -1
  img_proc: true
