    Figure 6.24 – Transaction history of the sales_orders table after an update operation


    Note how the history has advanced and each transaction is allocated a new version.
    Version 1 was created because of issuing the update statement (operation=UPDATE).
    The atomic update to the table resulted in creating a new transaction log file
    named 00000000000000000001.json.


    The beauty of Delta Lake is that it stores previous versions of data over time.
    Now, let''s learn how to retrieve previous versions using time travel.


    # Performing time travel


    A unique feature of Delta Lake is its ability to perform time travel. By using
    this feature, you can query and restore previous snapshots of your table. Access
    to previous snapshots is granted by using the versionAsOf option.


    > Important Note

    > The time travel functionality in Delta Lake implements data lineage. Data lineage
    is an extremely critical tool for data audits and compliance purposes. The same
    feature comes in handy for data engineers who are trying to trace data anomalies.


    +   1. This is how you can query previous versions of the delta table. In this
    example, we are querying version 0 of the table – in other words, when it was
    created:


    ```

    %sql

    SELECT * FROM store_orders VERSION AS OF 0 WHERE order_number=5;

    ```'
