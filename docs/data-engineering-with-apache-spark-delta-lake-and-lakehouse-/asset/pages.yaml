- pgno: 297
  md: "We created a couple of external tables for this business requirement. The first\
    \ external table is named ext_total_website_hits, which aggregates the number\
    \ of hits per country where at least 1,000 hits were received. Electroniz has\
    \ decided that anything less than 1,000 hits is not a substantial figure that\
    \ will impact their decision making:\n\n> Important\n> Having input from a customer\
    \ like this is extremely critical for the overall success of the project. This\
    \ is why I previously mentioned that the aggregation process is a shared responsibility\
    \ between customers and data engineers.\n\n```\nSET @sqlcmd = N'CREATE EXTERNAL\
    \ TABLE ext_total_website_hits\nWITH (\n    LOCATION = ''\" + @golds + '/external/ext_total_website_hits/''',\n\
    \    DATA_SOURCE = ' + @extds + ',\n    FILE_FORMAT = ' + @format + '\n)\nAS\n\
    SELECT SUM(hits) AS total_hits FROM\n(SELECT country_name, count(*) AS hits\n\
    FROM logs\nGROUP BY country_name\nHAVING count(*) > 1000) as webhits'\nEXEC sp_executesql\
    \ @sqlcmd\n\nSET @sqlcmd = N'CREATE EXTERNAL TABLE ext_advertising_budgets\nWITH\
    \ (\n    LOCATION = ''\" + @golds + '/external/ext_advertising_budgets/''',\n\
    \    DATA_SOURCE = ' + @extds + ',\n    FILE_FORMAT = ' + @format + '\n)\nAS SELECT\
    \ country_name, hits, (hits*100/total_hits) AS advtg_budget\nFROM\n(SELECT country_name,\
    \ count(*) as hits, (SELECT total_hits from ext_total_website_hits) AS total_hits\n\
    FROM logs\nGROUP BY country_name\nHAVING count(*) > 1000) AS agg_hits '\n```\n\
    \nFigure 8.43 – SQL for aggregated advertising budgets\n\nThe second external\
    \ table, named ext_advertising_budgets, aggregates website hits by country from\
    \ the log view. These external tables are created as part of the create_gold_tables\
    \ stored procedure, which is invoked using the Create Gold Layer Tables activity\
    \ in electroniz_aggregation_pipeline:\n\n```\nSELECT TOP (100) [country_name]\n\
    , [hits]\n, [advtg_budget]\nFROM [dbo].[ext_advertising_budgets]\nORDER BY 3 DESC\n\
    ```"
