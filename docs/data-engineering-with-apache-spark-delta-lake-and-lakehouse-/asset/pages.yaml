    time. You now need to start the procurement process from the hardware vendors.
    Keeping in mind the cycle of procurement and shipping process, this could take
    weeks to months to complete.

    +   - Once the hardware arrives at your door, you need to have a team of administrators
    ready who can hook up servers, install the operating system, configure networking
    and storage, and finally install the distributed processing cluster software—this
    requires a lot of steps and a lot of planning.


    I hope you may now fully agree that the *careful planning* I spoke about earlier
