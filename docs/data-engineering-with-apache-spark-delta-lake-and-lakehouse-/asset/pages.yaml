- pgno: 109
  md: '# Shortlisting common datasets


    Collect all use-case documents created during the discovery phase and shortlist
    common datasets. This is an extremely important step, so extra focus is warranted.
    Identifying common datasets across all sub-groups helps promote data reusability
    and enforce master data management (MDM) strategies.


    The following diagram highlights a multi-pipeline design approach. Every use case
    discovered previously is represented as an individual pipeline without any dependencies
    to others. The result is that the same dataset may get ingested multiple times
    in different pipelines. Unfortunately, even though this approach seems simple
    and workable, due to unnecessary repetitions it significantly increases the storage
    and compute costs of an organization. As a result, a multi-pipeline design approach
    strategy is not recommended:


    ![](img/dae8a2243a3c3cbcd9c56ff3d2217672_109_0.png)


    Figure 4.3 – A multi-pipeline design


    # Designing a pipeline using a parent-child approach – common datasets


    You may recall that in Chapter 1, The Story of Data Engineering and Analytics,
    we learned that storage is cheap, yet compute is expensive. Here is an opportunity
    to put to good use something that you learned previously. With some extra overhead
    in the design phase, data engineers can provide a solution that follows best practices,
    promotes reusability, and minimizes both compute and costs.'
  merge: -1
  img_proc: true
- pgno: 110
  md: 'Note in the following diagram how all datasets have been moved to a parent
    pipeline, and each use case discovered previously has been created as a child
    pipeline. This approach offers several benefits over a multi-pipeline approach
    and is therefore highly recommended:


    ![](img/dae8a2243a3c3cbcd9c56ff3d2217672_110_0.png)


    Figure 4.4 – A parent-child pipeline design


    A parent-child pipeline design offers several benefits, including the following:


    +   - Each dataset is ingested only once, and every subsequent child pipeline
    can use it.

    +   - Saves on storage and compute costs.

    +   - Provides better execution control over child pipelines by enforcing dependencies
    with the parent.


    > Important note

    > Some data engineers argue that designing a well-architected solution at a low
    price is simply not possible. I think it is—you just need to go that extra mile.


    # Designing a cloud architecture


    Based on the agreed-upon discovery documents, data engineers should create a visual
    diagram that outlines the cloud resources that will be used for building the data
    pipeline. This should include services such as the network, the connection to
    on-premises and external locations, storage, compute, and orchestration.'
  merge: -1
  img_proc: true
- pgno: 111
  md: '# Designing automation and monitoring


    Based on the desired level of automation, data engineers should design **continuous
    integration/continuous deployment (CI/CD)** pipelines for infrastructure and code
    deployment on the cloud. Additionally, data engineers should also design the data
    pipeline''s monitoring and notification mechanisms.


    # Costing


    Once the high-level design has been completed, data engineers should create a
    rough estimate of cloud resources, as follows:


    +   - Estimate the monthly cost of cloud resources for various environments during
    development. Remember that the requirement for storage and compute costs in development
    is usually less than in production, therefore it is important to adjust your resources
    accordingly.

    +   - Estimate the monthly cost of cloud resources required in production. This
    estimate should factor in costs resulting from auto-scalability during peak demands.


    > **Important note**

    > When creating the costing, data engineers should properly research the variability
    of cost based on on-demand and reserved resources. There can be significant cost
    savings if a resource is reserved for several years.


    The deliverable of the design phase is a document that summarizes the following:


    +   - Cloud architecture

    +   - Detailed description about parent and child pipelines

    +   - How does the pipeline design address key compliance requirements?

    +   - How does the pipeline design address incremental data, data lag, and schema
    evolution?

    +   - How will the final data be published to end users?

    +   - How will end users be notified regarding pipeline runs?

    +   - Development strategy—development language, tools, and environments

    +   - Which cloud layer will be used: **infrastructure as a service (IaaS)**,
    **platform as a service (PaaS)**, or SaaS?

    +   - How will the infrastructure and code pipelines be deployed?'
  merge: -1
  img_proc: true
- pgno: 112
  md: '+   - How will the pipelines be monitored in production?

    +   - Costing information


    Data engineers should submit the design document to the client and arrange for
    a few walkthrough sessions. These sessions should be conducted with every sub-group
    that participated in the discovery sessions and the IT group, which will be responsible
    for deploying and managing the pipelines.


    It is advisable that the design document be reviewed and formally accepted by
    the product owner before proceeding with the next steps.


    > **Important note**

    > Having walkthrough sessions with the IT group and gaining their confidence is
    extremely important. Ultimately, they will be deploying and managing the pipelines,
    so they need to be on board with the proposed design.


    # Development phase


    If you have reached this point, chances are that the design document has been
    formally accepted by the product owner. Congratulations! I can safely tell you
    that the job is more than half done at this point. Now is the time to start the
    development phase, as follows:


    +   - Start with the focus on the **parent** pipeline.

    +   - Start by testing **connectivity** to each data source and familiarize yourself
    with the data formats and schema.

    +   - Find out how **incremental** data will be provided.

    +   - Develop a strategy to **merge** incremental data in the data lake.

    +   - Develop strategies to deal with schema **evolution** in the data lake.

    +   - Plan the intermediate and final storage **destinations**.

    +   - Develop the parent pipeline.

    +   - Pay special attention to data **security** at every step.

    +   - Once the parent pipeline has been completed, then focus on individual **child**
    pipelines.

    +   - For each child pipeline, develop the transformations in such a way that
    they minimize compute **repetitions** and promote dataset **reuse**.'
  merge: -1
  img_proc: true
- pgno: 113
  md: '# Deployment phase


    Assuming the use of an agile development approach, newly created data pipeline
    code is merged into a shared code repository and promptly deployed to different
    environments. Since this process could happen several times during the development
    life cycle, a repeatable and automated process is desired.


    This is exactly where CI/CD fits in. Using such an approach, pipeline code is
    seamlessly merged, tested, and deployed automatically. We will be focusing in
    greater detail on these topics in Chapter 11, Infrastructure Provisioning, and
    Chapter 12, Continuous Integration and Deployment (CI/CD) of Data Pipelines.


    Important note

    These days, deployments are considered an integral part of the development life
    cycle. Instead of dealing with deployment issues after completing the development
    of a project, it is becoming a standard practice to adopt CI/CD where deployment
    is done in short cycles.


    # Running a data pipeline


    Once the development and deployment have succeeded, it is time to orchestrate
    the data pipeline. Data pipeline runs are typically instantiated using the following
    three methods:


    +   - **Manually**—The simplest way to invoke a data pipeline is by doing this
    manually. This means that action needs to be taken by either using the control
    panel, command-line tools, or **REpresentational State Transfer (REST)** APIs.
    This method is suitable for development/testing or one-off executions but is unsuitable
    for production. As an example, data engineers may choose to run a pipeline manually
    while performing unit testing or may need to perform a one-off execution of the
    pipeline because the scheduled run failed.

    +   - **Scheduled**—In this method, the data pipeline is invoked using a scheduler.
    The scheduler can either be operating system-based—using schedulers in orchestration
    tools—or built into the ETL tool itself. This is the most common method of invoking
    data pipelines in production. Based on case scenarios, data pipelines are scheduled
    to run daily or hourly if more frequent data refreshes are desired. In financial
    systems, you may additionally schedule monthly runs for accounting batches.'
  merge: -1
  img_proc: true
- pgno: 114
  md: '**Important note**

    Over the years, data pipelines have been primarily invoked using operating system
    schedulers such as `cron` in Linux and Task Scheduler in Windows. In the last
    few years, orchestration tools such as Oozie and Apache Airflow have taken over.
    These tools come with built-in schedulers.


    +   - **Event-based**—There are cases where schedule-based invocations do not
    work well. This is true where the data pipeline has dependencies on something
    else, such as the availability of data or the completion of another pipeline.
    In many cases, the pipeline cannot be run until the data has been fully ingested.
    Since it is difficult to time the completion of such a process, an event-based
    mechanism is a better fit. Very frequently, curation pipelines are triggered using
    an event-based mechanism after the ingestion pipeline has been successfully completed.
    Similarly, an aggregation pipeline is triggered after a curation pipeline signals
    completion.


    **Important note**

    A parent-child pipeline is a good example to understand suitable invocations mechanisms.
    Typically, a parent pipeline should be invoked using a **schedule**, whereas child
    pipelines on **event-based** mechanisms run the child pipeline only if the parent
    is successful.


    Finally, once the pipeline has been run, data engineers need to make sure that
    data pipeline monitoring is enabled and functional. For the first few days, it
    is a good idea for a data engineer to be part of the pipeline notification group.
    Many a time, simply by looking at the run logs, the data engineer will catch what
    others may miss. The final deliverable of this phase is the runbook, which will
    help the team with operational and administrative issues in the following areas:


    +   - Running CI/CD pipelines

    +   - Monitoring data pipelines

    +   - How to deal with failures and re-evoking data pipelines after failures

    +   - Changing data pipeline schedules

    +   - Disabling data pipelines'
  merge: -1
  img_proc: true
