- pgno: 415
  md: '# The Electroniz infrastructure CI/CD pipeline


    DevOps/data engineers will develop code to spin up the necessary Azure resources
    required for the Electroniz lakehouse. You may recall that in Chapter 11, Infrastructure
    Provisioning, we used IaC to spin up the infrastructure. That was one step in
    the right direction but still not automated enough. In this chapter, we will learn
    how to automate the deployment process using the same set of code we created previously.
    The following is the structure of the code for the infrastructure pipeline:


    ![](img/dae8a2243a3c3cbcd9c56ff3d2217672_415_0.png)


    Figure 12.4 – The code structure of the Electroniz infrastructure CI/CD pipeline


    Let’s take a look at this structure in more detail:


    +   - **azure-infra-pipelines.yml**: This file contains the configuration of the
    Azure resources, defined in stages. Each stage creates a new resource by referencing
    the JSON file in each resource folder.

    +   - **Azure resource folders**: Each resource folder contains the definition
    of the resource defined as a JSON file.

    +   - **Parameters**: The global parameters for resources such as names, locations,
    and the environment are stored in the **electroniz_infra_variables** variable
    group in the Azure DevOps pipeline library.'
  merge: -1
  img_proc: true
- pgno: 416
  md: '# The Electroniz code CI/CD pipeline


    Data engineers develop code to implement the various stages of the data pipeline.
    This is done using a variety of development tools, including Azure Data Factory,
    Azure Synapse SQL scripts, and Databricks Spark notebooks. Progressively, all
    this code is integrated and deployed on different environments using the code
    CI/CD pipeline:


    ![](img/dae8a2243a3c3cbcd9c56ff3d2217672_416_0.png)


    Figure 12.5 – The code structure of the Electroniz code CI/CD pipeline


    Let''s take a look at this structure in more detail:


    +   - **azure-code-pipelines.yml**: This file contains the configuration of the
    Azure data pipelines, defined in stages. Each stage deploys code using a JSON
    file.

    +   - **Pipeline JSON files**: These files contain the definitions of each pipeline
    as a separate file stored in JSON format.

    +   - **Parameters**: The global parameters for resources such as names, locations,
    and the environment are stored under the **electroniz_code_variables** variable
    group in the Azure DevOps pipeline library.


    Both these pipelines work independently of each other. Azure Pipeline includes
    functionality to trigger independent pipelines using path include switches in
    the deployment files. Using this approach, multiple teams can concurrently develop
    code simultaneously, without interfering or depending on other teams.


    With this understanding, we are now ready to start developing CI/CD pipelines.'
  merge: -1
  img_proc: true
- pgno: 417
  md: '# Developing CI/CD pipelines


    In this section, we will learn how to create and deploy the two CI/CD pipelines
    we mentioned previously. We will create these CI/CD pipelines using Azure DevOps.
    Azure DevOps is a collection of developer services for planning, collaborating,
    developing, and deploying code. Although Azure DevOps supports a variety of developer
    services, for this exercise, we will primarily focus on Azure Repos and Azure
    Pipelines.


    I know we are eager to proceed with creating the pipelines, but there is a fair
    bit of preparation required before we can get started. The process starts with
    creating the Azure DevOps organization, which can be done in a few simple steps.
    However, to use the free tier of Azure Pipelines, you need to fill in a free parallelism
    request form for your newly created Azure DevOps organization. The approval process
