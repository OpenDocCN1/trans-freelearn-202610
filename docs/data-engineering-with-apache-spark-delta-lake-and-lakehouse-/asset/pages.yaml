  md: 'Click on **OK**. You should now be back in the **Settings** tab of **Find SalesDB
    Tables**. Input the following:


    +   - Use query: **Choose Query**

    +   - Query: SELECT QUOTENAME(table_schema)+''.''+QUOTENAME(table_name) AS Table_Name
    FROM information_Schema.tables WHERE table_name not in (''watermarktable'', ''database_firewall_rules'')


    Notice that the preceding dynamic select statement generates a list of tables
    that will be ingested inside the lakehouse. If you want to exclude some tables
    from the list, you can use the **NOT IN** clause.


    For the first row only, uncheck the boxes.


    16. From the top menu, click on **Publish all**. You should have two changes that
    are ready to be published. Click on **Publish**:


    # Publish all


    You are about to publish all pending changes to the live environment. Learn more


    Pending changes (2)


    | NAME | CHANGE | EXISTING |

    |---|---|---|

    | Pipelines |  |  |

    | electroniz_batch_ingestion... (Edited) |  | electroniz_batch_ingestion_pipeline
    |

    | Datasets |  |  |

    | salesdbds (New) |  | - |


    Figure 5.37 – The Publish all screen for the batch ingestion pipeline


    17. In the **Activities** panel, search for **ForEach**. Now, drag the **ForEach**
    activity to the panel on the right-hand side.


    The **ForEach** activity will loop through the list of tables supplied by the
    **Find SalesDB Tables** activity. For each iteration, it will perform the following
    operations:


    Look up the old watermark and set the new watermark, ingest the table from the
    old watermark to the new watermark, and finally, update the watermark in the control
    table.'
  merge: -1
  img_proc: true
- pgno: 152
  md: '+   - Name: **For Each Table**

    +   Click on **Settings**. Input the following:

    +   - Items: `@activity(''Find SalesDB Tables'').output.value`


    Notice the use of **@activity**. At runtime, each activity returns a general response
    JSON with items such as output and status. You can read the response of the items
    using the preceding convention. In the preceding example, we are reading the output
    of the **Find SalesDB Tables** activity. This will output the list of tables,
    which, in turn, is the output from the preceding SQL.


    Chain both activities together by dragging the arrow from **Find SalesDB Tables**
    to **For Each Table**. Chaining ensures that the output of the previous activity
    becomes the input of the next activity:


    ![](img/dae8a2243a3c3cbcd9c56ff3d2217672_152_0.png)


    Figure 5.38 – Chaining the two sales activities together


    18. Click on the **pencil** icon in the **Activities** section of **For Each Table.**


    In the **Activities** panel, search for **Lookup**. Now, drag the **Lookup** activity
    to the panel on the right-hand side.


    Name: `Lookup Old Watermark`


    Click on **Settings.**


    For the **Source** dataset, choose **salesdbds.**


    Use Query: **Query**


    ```

    Query: SELECT * FROM [dbo].[watermarktable] AS WatermarkValue WHERE table_name=''@{item().Table_Name}''

    ```


    Notice that the dynamic select statement selects the old watermark of the table
    being ingested from the previous iteration of the ingestion run.'
  merge: -1
  img_proc: true
- pgno: 153
  md: 'In the **Activities** panel, search for **Lookup**. Now, drag the **Lookup**
    activity to the panel on the right-hand side.


    Name: `Lookup New Watermark`


    Click on **Settings.**


    For the **Source** dataset, choose **salesdbds.**


    Use Query: **Query**


    ```

    Query: SELECT MAX(updated_at) as NewWatermarkvalue FROM @{item().Table_Name}

    ```


    Notice that the dynamic creates a new watermark of the table being ingested.


    19. In the **Activities** panel, search for **Copy data**. Now, drag the **Copy
    data** activity to the panel on the right-hand side.


    Name: `Copy Table Data`


    Click on **Source.**


    For the **Source** dataset, choose **salesdbds.**


    Use query: **Query**


    ```

    Query: SELECT * FROM @{item().Table_Name} WHERE updated_at > ''@{activity(''Lookup
    Old Watermark'').output.firstRow.watermark_value}''

    ```


    Notice this SQL is selecting records that are greater than the old watermark of
    the table being ingested. We have chosen **updated_at** as the watermark column.


    Click on **Sink.**


    A sink is a destination to which the output of the preceding SQL will be stored.


    In the **Sink** dataset, click on **New**. Then, click on **Azure Data Lake Storage
    Gen 2**. Finally, click on **Continue.**


    In Select Format, click on **DelimitedText**. Then, click on **Continue.**


    In the **Set properties** pane, input the following:


    Name: `SalesDelimitedText`


    Linked service: **traininglakehouse**


    In **File path**, input the following:


    Filesystem: `bronze`


    Click on **OK**. Next to the **Sink** dataset, click on **Open.**'
  merge: -1
  img_proc: true
