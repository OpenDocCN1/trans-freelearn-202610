- pgno: 385
  md: 'Note how the scan in Azure Purview has automatically discovered **Classifications**
    for two columns: **Email Address** and **Credit Card Number**. As you may recall
    from previous chapters, we have these columns in the store customer table. So,
    why is classifying data that important?


    **Data classification** is an important first step for meeting compliance requirements
    and data governance. Defining proper tags, labels, and metadata based on the sensitivity
    of data helps define data confidentiality at query time.


    > **Important**

    > Depending on the type of business data, classification is usually performed
    based on data content, context, and user levels.


    # Cleaning up Azure resources


    To save on costs, you may want to clean up the following Azure resources:


    +   1. Delete the Azure Purview account; that is, `trainingcatalog`.

    +   2. Delete the Azure Data Share account; that is, `trainingshare`.


    Now, let’s summarize this chapter.


    # Summary


    This was an extremely important chapter for several reasons. Using a few examples,
    we learned about the common challenges that are faced in the world of data engineering.
    Dealing with challenges such as schema evolution and governance are critical in
    modern data engineering projects. These challenges have evolved over time, and
    so have the techniques and tools that make the job of the data engineer a little
    easier.


    In the next chapter, we will look at DevOps essentials for data engineers. DevOps
    is quickly becoming an essential add-on skill for data engineers, so we will learn
    how to automatically provision cloud resources using the **Infrastructure as Code
    (IaC)** paradigm. Using the power of IaC, data engineers can spin up data pipelines
    that use cloud resources in a fast, repeatable, and secure fashion.'
