- pgno: 218
  md: '# The need for curating raw data


    Data in the bronze layer is raw by nature in that it gets collected from several
    distinct and diverse data sources. Due to the diverse sources, it is natural for
    data to be delivered in unstandardized, invalid, inconsistent, non-uniform, duplicate,
    or insecure forms. In some other cases, raw data may have PII data in clear text,
    which should be properly masked before analytical consumption.


    > **Important note**

    > In big data, one of the hotly debated topics is veracity – that is, can the
    organization put trust in the data that is being collected? And if yes, then how
    much?


    Let''s try to understand some characteristics of unclean data so that we can properly
    justify the reasons for curating data.


    # Unstandardized data


    These days, typically, data is collected using **online transaction processing
    (OLTP)** applications. The problem is that OLTP applications, such as web applications
    and mobile applications created in different countries, follow varying standards.
    During user input, some applications may accept first and last names as two separate
    fields, whereas other applications may have just one field for both. In the US,
    it is common to follow the MM/DD/YYYY format for dates, whereas many other countries
    prefer to use DD/MM/YYYY.


    Let me quote some examples from the Electroniz data that falls into this category.


    The `store_orders` data has a column named `order_date` that uses the MM/DD/YYYY
    format:


    ![](img/dae8a2243a3c3cbcd9c56ff3d2217672_218_0.png)'
  merge: -1
  img_proc: true
- pgno: 219
  md: 'And the e-commerce transactions have the order_date column that uses DD/MM/YYYY
    format:


    ![](img/dae8a2243a3c3cbcd9c56ff3d2217672_219_0.png)


    Figure 7.2 – E-commerce transaction data in the DD/MM/YYYY date format


    In another scenario, the store_customers data has a column named email with a
    mix of lowercase and uppercase characters. Ideally, emails should be stored in
    lowercase.


    ![](img/dae8a2243a3c3cbcd9c56ff3d2217672_219_1.png)


    Figure 7.3 – Customer emails in mixed case


    Before making this data available to end users, it needs to be properly standardized
    as per agreed-upon organizational policies.


    # Invalid data


    Invalid data does not conform to constraints. These constraints can be of several
    types:


    +   - **Types**: Columns should be of a specific data type, such as numeric, date,
    or floats.

    +   - **Ranges**: The data in a column needs to fall within a range of values.

    +   - **Uniqueness**: The data in the column should have unique values.

    +   - **Relational**: The column should not be an orphan – the parent should mandatorily
    exist in the parent table.'
  merge: -1
  img_proc: true
