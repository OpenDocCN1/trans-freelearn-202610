  md: '# Verifying duplicate data


    You may recall that `electroniz_batch_ingestion_pipeline` ingested not only newly
    inserted data in the source but also data that has changed over time. In the previous
    chapter, *Understanding Delta Lake*, we learned how new and changed data can be
    merged into a common delta table to establish a single source of truth.


    Even though data evolves and changes over time, end users are simply interested
    in querying the latest version. We need to understand this concept very clearly,
    so let me demonstrate it using the sequence of events for a customer name change
    as follows:


    +   1. A new customer, `Prescott Barnes`, was created in the `stores` database
    at 17:56 on April 4, 2021.

    +   2. This customer record was ingested into the Electroniz lakehouse during
    the run that happened at 18:00 on April 4, 2021.

    +   3. The customer requested his name be changed to `Prescott Barnes Jr.` at
    18:30 on April 4, 2021.

    +   4. The customer record was re-ingested in the Electroniz lakehouse during
    the run that happened at 19:00 on April 4, 2021.


    Now we have two records for the same customer in the bronze layer of the lakehouse
    – *duplicates*. Well, that’s a problem, isn’t it?


    Fortunately, the magic of Delta Lake permits us to deal with such issues and deduplicate
    data with ease. In the cell titled **Curate Sales Data - standardize, mask and
    merge**, notice the following merge clause for Delta Lake:


    ```

    deltaTable.alias("store_customers").merge(

    df_table_curated.alias("store_customers_new"),

    "store_customers.email = store_customers_new.email") \

    .whenMatchedUpdate(set = {"customer_id": "store_customers_new.customer_id", \

    "customer_name": "store_customers_new.customer_name", \

    "address": "store_customers_new.address", \

    "city": "store_customers_new.city", \

    "postalcode": "store_customers_new.postalcode", \

    "country": "store_customers_new.country", \

    "phone": "store_customers_new.phone", \

    "email": "store_customers_new.email", \

    "credit_card": "store_customers_new.credit_card", \

    "updated_at": "store_customers_new.updated_at" } )

    .whenNotMatchedInsert(values = {

    "customer_id": "store_customers_new.customer_id", \

    "customer_name": "store_customers_new.customer_name", \

    "address": "store_customers_new.address",

    ```


    Figure 7.52 – Delta Lake merge of store_customers'
