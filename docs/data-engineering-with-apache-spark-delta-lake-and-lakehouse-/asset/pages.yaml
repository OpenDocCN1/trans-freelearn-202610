- pgno: 387
  md: '# 11

    Infrastructure Provisioning


    While the demand for data analytics grows, data engineers are becoming an expensive
    and hard-to-find commodity in the marketplace. On the other hand, organizations
    that hire data engineers are finding innovative methods to do more with less so
    that they can justify the high resource costs. In a recent trend, most of these
    organizations have started to use automated infrastructure provisioning as a means
    to streamline cloud deployments. Until recently, infrastructure provisioning work
    has typically been handled by the DevOps group, but not anymore.


    In the previous chapter, we talked about the dynamic nature of the data engineer''s
    job profile. The modern data engineer needs to keep up with this latest trend
    and train themselves in a few DevOps skills. This chapter and the next are designed
    to teach the data engineer a few critical DevOps skills.


    > **Important Note**

    > In today''s job market, a data engineer who knows DevOps is a lethal combination.
    Modern organizations would rather hire one resource who has both of these skills
    than hire two.'
  merge: -1
  img_proc: true
- pgno: 388
  md: 'In this chapter, we will cover the following topics:


    +   - Infrastructure as code

    +   - Deploying infrastructure using Azure Resource Manager

    +   - Deploying multiple environments using IaC


    # Infrastructure as code


    Until recently, infrastructure deployment has been an extremely time-consuming
    and expensive process. In a typical organization, a team of system administrators
    would be responsible for deploying hardware and software on several environments
    using a series of manually executed steps. Due to its manual nature, this process
    has major deficiencies:


    +   - **Unique settings per environment**: Every individual environment can have
    unique settings. To meet these requirements, the manual steps need to be documented
    for each environment.

    +   - **Time-consuming**: The documentation and execution of manual steps are
    very time-consuming.

    +   - **Inconsistent and error-prone**: Following manual steps for infrastructure
    deployments can lead to inconsistencies and errors.


    **Infrastructure as Code (IaC)** is a practice to deploy and manage infrastructure
    components using source code. Using IaC, the system administration teams (also
    known as DevOps) are no longer bound by manual practices and documented processes.
    Instead, they can now perform automated and repeatable deployments using configuration
    files.


    ![](img/dae8a2243a3c3cbcd9c56ff3d2217672_388_0.png)


    Figure 11.1 – Benefits of using IaC'
  merge: -1
  img_proc: true
- pgno: 389
  md: 'Infrastructure that is deployed using the IaC practice is accurate, consistent,
    reusable, and fast. DevOps teams create, manage, and version control infrastructure
    configuration files in a similar way to how application teams create application
    code. The IaC practice follows the same set of protocols for bug-fixing, testing,
    and code promotions.


    There are several open source and commercially available IaC tools available on
    the market such as Ansible, Terraform, Chef, and Puppet. For infrastructure provisioning,
    Azure Resource Manager (ARM) is the native platform in Azure. Modern organizations
    are using the power of ARM to organize and standardize their cloud deployments
    for uniformity, security, and performance.


    # Deploying infrastructure using Azure Resource Manager


    Before ARM came into existence in 2014, Azure Service Manager (ASM) was used for
    infrastructure deployments. However, there were some serious drawbacks with the
    ASM approach arising due to inter-dependencies of resources. Before deploying
    resources, you had to carefully understand dependencies and sequence the operations
    accordingly in scripts.


    Thankfully, ARM has taken care of the inter-dependency problem to deploy Azure
    resources easily, uniformly, and seamlessly. ARM uses resource groups as the logical
    grouping of cloud assets. Using a resource group ensures a consistent life cycle
    for resource provisioning, security, and tear-offs. ARM uses resource groups as
    the single unit of deployment and management.


    ARM uses templates to deploy IaC. Once created, these templates become part of
    an enterprise code repository like other types of application code.


    # Creating ARM templates


    An ARM template is simply a JSON format file that embeds the configuration of
    the resource within itself. ARM templates use declarative syntax, which means
    that you can deploy multiple Azure resources within one template. During runtime,
    ARM automatically sequences the operations in the correct order and fires them
    parallelly if possible.'
  merge: -1
  img_proc: true
- pgno: 390
  md: "Before we create a new template for the IaC deployment, we need to understand\
    \ the format of an ARM template.\n\n```\n{\n  \"$schema\": \"https://schema.management.azure.com/schemas/2019-04-01/deploymentTemplate.json#\"\
    , << Version of template language\n  \"contentVersion\": \"\", << Version of template\n\
    \  \"apiProfile\": \"\",      << Collection of API versions\n  \"parameters\"\
    : { },      << External values provided to template\n  \"variables\": { },   \
    \    << Internal values created using expressions\n  \"functions\": [ ],     \
    \  << User defined functions\n  \"resources\": [ ],       << Resource types to\
    \ be deployed\n  \"outputs\": { }          << Output values returned by deployment\n\
    }\n```\n\nFigure 11.2 – Anatomy of an ARM template\n\nEvery element in the template\
    \ has several properties that can be set within it. Let me demonstrate this using\
    \ examples as follows. Throughout this chapter, we will be referencing ARM templates\
    \ from the following location in the Packt Git repository:\n\nhttps://github.com/PacktPublishing/Data-Engineering-with-Apache-Spark-Delta-Lake-and-Lakehouse/tree/main/project/infra\n\
    \nFor the following example, let’s understand a simple template that deploys the\
    \ Electroniz Azure Data Lake Storage account.\n\n# Parameters\n\nThe parameters\
    \ section of the ARM template is reserved for input values. Parameters are extremely\
    \ important to enforce the reusability of ARM templates. You may notice two parameters\
    \ named environment and project here. These parameters can be used to spin up\
    \ varying environments such as dev, test, or prod on varying projects."
  merge: -1
  img_proc: true
- pgno: 391
  md: "```\n\"$schema\": \"https://schema.management.azure.com/schemas/2019-04-01/deploymentTemplate.json\"\
    ,\n\"contentVersion\": \"1.0.0.0\",\n\"parameters\": {\n  \"environment\": {\n\
    \    \"type\": \"string\"\n  },\n  \"project\": {\n    \"type\": \"string\"\n\
    \  },\n  \"storageAccountName\": {\n    \"type\": \"string\",\n    \"metadata\"\
    : {\n      \"description\": \"The name of the storage account\"\n    }\n  },\n\
    \  \"bronzeLayer\": {\n    \"type\": \"string\"\n  },\n  \"silverLayer\": {\n\
    \    \"type\": \"string\"\n  },\n  \"goldLayer\": {\n    \"type\": \"string\"\n\
    \  },\n  \"location\": {\n    \"type\": \"string\",\n    \"defaultValue\": \"\
    [resourceGroup().location]\",\n    \"metadata\": {\n      \"description\": \"\
    The location in which the resources should be deployed.\"\n    }\n  }\n}\n```\n\
    \nFigure 11.3 – Parameters in an ARM template\n\n# Variables\n\nThe variables\
    \ section of the ARM template is reserved for creating custom values that can\
    \ be used throughout the template. The custom values are created using expressions\
    \ denoted by two square brackets ([ ]). Within the expression, you can use several\
    \ predefined functions provided by ARM, such as CONCAT, MIN, and MAX.\n\n```\n\
    \"variables\": {\n  \"storageAccountName\": \"[concat(parameters('environment'),\
    \ parameters('project'), parameters('storageAccountName'))]\"\n},\n```\n\nFigure\
    \ 11.4 – Variables in an ARM template\n\nNotice the use of the CONCAT function\
    \ in the storageAccountName variable. This expression is adding the name of project\
    \ and environment to the storageAccountName parameter. This makes it easier to\
    \ identify the Azure resource."
  merge: -1
  img_proc: true
- pgno: 392
  md: "# Resources\n\nThe resources section of the ARM template is reserved for defining\
    \ the resources (one or many) required. In the following example, a new storage\
    \ account needs to be created using the storageAccountName variable. Notice that\
    \ isHnsEnabled is set to true, which means this is Azure Data Lake Storage Gen2.\n\
    \n```\n\"resources\": [\n  {\n    \"name\": \"[variables('storageAccountName')]\"\
    ,\n    \"type\": \"Microsoft.Storage/storageAccounts\",\n    \"apiVersion\": \"\
    2021-02-01\",\n    \"sku\": {\n      \"name\": \"Standard_LRS\"\n    },\n    \"\
    kind\": \"StorageV2\",\n    \"location\": \"[parameters('location')]\",\n    \"\
    properties\": {\n      \"isHnsEnabled\": true\n    },\n    \"tags\": {\n     \
    \ \"owner\":\"data engineering\",\n      \"project\":\"lakehouse\",\n      \"\
    environment\":\"production\"\n    }\n  },\n  \"resources\": [\n    {\n      \"\
    name\": \"[concat('default/', parameters('bronzeLayer'))]\",\n      \"type\":\
    \ \"blobServices/containers\",\n      \"apiVersion\": \"2019-06-01\",\n      \"\
    dependsOn\": [\n        \"[variables('storageAccountName')]\"\n      ],\n    \
    \  \"properties\": {\n        \"publicAccess\": \"None\"\n      }\n    }\n  ]\n\
    ```\n\nFigure 11.5 – Resource definitions in an ARM template\n\nAlso, notice there\
    \ is a new sub-resource embedded within the outer resource. The sub-resource is\
    \ used to create a resource within the parent. In this instance, we are creating\
    \ a container within the given storage account. Notice the use of the dependsOn\
    \ property that is used to establish the parent-child relationship."
  merge: -1
  img_proc: true
