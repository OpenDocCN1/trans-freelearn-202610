    In the preceding output, take note of a few key items as follows:


    +   - The _delta_log folder is referred to as the Delta Lake transaction log (DeltaLog).
    DeltaLog is the central repository to store and track every transaction that happens
    on a table. By checking the transaction log each time before posting any new changes,
    Delta Lake can ensure consistency between data in the user''s session compared
    to stored data.

    +   - DeltaLog uses the principle of If the transaction does not exist in the
    log, you may assume it never happened. Using this principle can ensure atomicity.

    +   - Registering only the successful transactions in DeltaLog establishes a level
    of trust in the data. Successful transactions are persisted in Parquet files on
    storage ensuring durability.

    +   - Delta Lake performs concurrent transactions in such a way that they occur
    serially and in isolation from each other.


    The actual data has been written to storage partitioned by the currency column.
    column=key is a Hive partitioning convention that correlates folders to partitions.'
