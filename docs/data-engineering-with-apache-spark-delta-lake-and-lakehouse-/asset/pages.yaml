  md: '# Duplicate data


    In the fast-changing world, data evolves all the time, from customers changing
    demographic data such as addresses and phone numbers to orders being bought and
    returned. Capturing and processing changed data is also referred to as **change
    data capture (CDC)** and has been an ongoing challenge in the data lake world.
    Let me try to explain this using a couple of examples:


    +   - A new customer was created in the `stores` database at 17:56 on April 4,
    2021. The record was ingested in the bronze layer using the `electroniz_batch_ingestion_pipeline`
    run at 18:00 on April 4, 2021:


    | customer_id | email | customer_name | address | city | updated_at |

    |---|---|---|---|---|---|

    | 501 | Phasellus.vitae@vitae.co.uk | Prescott Barnes | 960-5386 Vel, Road | Pangnirtung
    | 2021-04-28T17:56:10.520+0000 |


    Figure 7.10 – New customer record ingested into the electroniz lakehouse


    +   - The customer discovered that his name was not properly input into the system,
    so requested the store clerk to make the change at 18:30 on April 4, 2021. The
    edited record was ingested into the bronze layer using the `electroniz_batch_ingestion_pipeline`
    run at 19:00 on April 4, 2021:


    | customer_id | email | customer_name | address | city | updated_at |

    |---|---|---|---|---|---|

    | 501 | Phasellus.vitae@vitae.co.uk | Prescott Barnes Jr. | 960-5386 Vel, Road
    | Pangnirtung | 2021-04-28T18:25:40.927+0000 |


    Figure 7.11 – Edited customer record ingested into the electroniz lakehouse creating
    duplicates


    Now, here is the problem. In the store''s database, the above record exists *only
    once*, yet there are *two* records of the same person in the data lake bronze
    layer. These are referred to as *duplicate* records.


