- pgno: 409
  md: '# 12

    Continuous Integration and Deployment (CI/CD)

    of Data Pipelines


    Our data journey is finally approaching its destination. As the new era of analytics
    takes over, the demand for data engineers will continue to grow, and so will the
    amount of code that they will produce. The ever-increasing demand for developing,
    managing, and deploying large code sets is already testing the limits of modern
    data engineers.


    Luckily, a modern trend is fast emerging that has the potential of taking a lot
    of burden off poor data engineers. In this chapter, we will learn about code delivery
    automation using CI/CD pipelines. In short, CI/CD is a collection of practices
    that''s used to integrate and deliver code faster using small atomic changes.'
  merge: -1
  img_proc: true
- pgno: 410
  md: 'In this chapter, we will cover the following topics:


    +   - Understanding CI/CD

    +   - Designing CI/CD pipelines

    +   - Developing CI/CD pipelines


    # Understanding CI/CD


    The process of data transformation is continuous. In every modern organization,
    the volume and variety of data is increasing at a very high pace. As a result,
    the need for creating new or modifying existing data pipelines is very high. This
    sudden growth in data pipeline code is testing the limits of the traditional software
    delivery cycle.


    As a result, organizations are eagerly looking forward to adopting viable methods
    that can accelerate product delivery, using a combination of best practices and
    automation. After all, streamlining the software cycle creates a clear path to
    success. Before we try to understand how CI/CD works, there is merit in understanding
    the traditional software delivery cycle.


    # Traditional software delivery cycle


    Before we start talking about the modern approach to software delivery, let''s
    understand how the traditional method has worked so far:


    ![](img/dae8a2243a3c3cbcd9c56ff3d2217672_410_0.png)


    Figure 12.1 – Traditional software delivery cycle'
  merge: -1
  img_proc: true
- pgno: 411
  md: 'The traditional software development process for a data pipeline typically
    undergoes the following phases:


    +   - **Development**: In this phase, developers (data engineers) either create
    new pipelines or modify existing ones. Changes in existing pipelines may be attributed
    to schema evolution or changes in functionality. On completion, the developer
    merges their piece of code into the existing code repository. The same process
    is repeated by other developers who may be dealing with other pipelines.

    +   - **Code Packaging**: On a pre-agreed schedule, likely at the end of the agile
    sprint cycle, the code package is released to QA for testing.

    +   - **QA Deployment**: The release is deployed in the testing/QA environment.

    +   - **Testing/QA**: The QA group performs testing for all new or modified code.
    If successful, the code is released for production deployment; otherwise, the
    release is rejected and put on hold until the pending bugs have been fixed.

    +   - **Production Deployment**: All the code that passes QA is deployed to production.


    Although **simple** by nature, there is an inherent **problem** with this process.
    In the preceding diagram, code sets from multiple developers are merged in the
    repository to formulate a **release**. During the quality assurance testing phase,
    code from all developers may successfully pass unit testing but fails one of them.
    Unfortunately, the entire release needs to be rejected due to the failure of only
    one code component. Cases like these can cause unnecessary **delays** and customer
    **dissatisfaction**. Needless to say, a better method needs to be devised.


    # Modern software delivery cycle


    The theme of the modern software delivery process is very simple – **develop**,
    **test**, and **integrate** small pieces of code frequently. Using the practice
    of **continuous integration** (CI), developers are encouraged to make small code
    adjustments, merge their code into the main code branch, and validate it by using
    automated tests. Doing this provides developers with a quick and easy feedback
    mechanism regarding inter-dependency between code components. It helps us detect
    errors quickly, making the lives of developers easier in many ways.'
  merge: -1
  img_proc: true
- pgno: 412
  md: 'Once the code is successfully validated, the practice of **continuous deployment
    (CD)** automatically deploys the code to either the testing or production environment.
    Doing this provides a quick and easy feedback mechanism for developers regarding
    the **validity** of code in a particular environment:


    ![](img/dae8a2243a3c3cbcd9c56ff3d2217672_412_0.png)


    Figure 12.2 – Modern software delivery cycle


    **CI/CD** is known to streamline and improve, as well as accelerate, software
    delivery. These days, it is common for organizations to follow the **DevOps**
    practice. DevOps promotes a culture shift, one that has a tight collaboration
    between the development and operation groups within an organization.


    Traditionally, creating and managing CI/CD pipelines has been handled by the DevOps
    group. But with the changing landscape of the industry, data engineers are being
    strongly **encouraged** (more like mandated) to add this skill set to their existing
    job profiles. As a result, it is now becoming increasingly important for data
    engineers to carry some DevOps skills.


    > **Important**

    > DevOps, short for **Developer** and **Operations**, is a practice that aims
    to accelerate software delivery using a combination of tools, best practices,
    and automation.'
  merge: -1
  img_proc: true
- pgno: 413
  md: 'There are several DevOps tools available that can implement CI/CD pipelines,
    such as **Jenkins, Chef, and CircleCI**. **Azure DevOps** is the native SaaS platform
    in Azure that supports modern developers with planning, inter-team collaboration,
    and seamless delivery of code. In this chapter, we are going to use Azure DevOps
    to create CI/CD pipelines.


    # Designing CI/CD pipelines


    Before we deep dive into the actual development and implementation of CI/CD pipelines,
    we should try to design their layout. In typical data analytics projects, the
    focus of development revolves around two key areas:


    +   - **Infrastructure Deployment**: As discussed in the previous chapter, these
    days, it is recommended to perform cloud deployments using the **Infrastructure
    as Code (IaC)** practice. Infrastructure code used to be developed by DevOps engineers,
    although recently, data engineers are being asked to share this responsibility.

    +   - **Data Pipelines**: The development of data pipelines is likely handled
    entirely by data engineers. The code that''s developed includes functionality
    to perform data collection, ingestion, curation, aggregations, governance, and
    distribution.


    Following the continuous development, integration, and deployment principles,
    the recommended approach is to create two CI/CD pipelines that we will refer to
    as the **Electroniz infrastructure CI/CD pipeline** and **Electroniz code CI/CD
    pipeline.**


    > **Important**

    > Adopting CI/CD is more of a cultural shift than a technical one. Before implementation,
    it is essential to seek the confidence of the development team and senior management.


    At a high level, the **Electroniz infrastructure CI/CD pipeline** will be utilized
    for deploying Azure resources such as Azure Key Vault, Azure Data Lake Storage,
    and Azure Synapse. Typically, the core responsibility of creating and managing
    this pipeline lies with the DevOps group.


    The **Electroniz code CI/CD pipeline** will be used to deploy pieces of code such
    as SQL scripts, data factory pipelines, and Spark notebooks. In all likelihood,
    the core responsibility of creating and managing this pipeline lies with the data
    engineering group.'
  merge: -1
  img_proc: true
- pgno: 414
  md: 'Having both these pipelines running under the same workspace promotes collaboration
    between the DevOps and data engineering teams. Instead of working in their independent
    shell, it allows both teams to work together, share ideas, and, most importantly,
    grow their **skill set**. These two pipelines are depicted in the following diagram:


    ![](img/dae8a2243a3c3cbcd9c56ff3d2217672_414_0.png)


    Figure 12.3 – Recommended design of CI/CD pipelines


    > **Important**

    > In the preceding diagram, notice how both pipelines store and fetch **secrets**
    from a common Azure Key Vault. Securely storing secrets such as database passwords
    and API keys at creation time and dynamically fetching them at runtime goes a
    long way in controlling unauthorized exposures.'
