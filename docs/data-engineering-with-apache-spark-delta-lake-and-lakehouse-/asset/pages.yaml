- pgno: 23
  md: '# 1

    The Story of Data Engineering and Analytics


    Every byte of data has a story to tell. The real question is whether the story
    is being narrated accurately, securely, and efficiently. In the modern world,
    data makes a journey of its own—from the point it gets created to the point a
    user consumes it for their analytical requirements.


    But what makes the journey of data today so special and different compared to
    before? After all, **Extract, Transform, Load (ETL)** is not something that recently
    got invented. In fact, I remember collecting and transforming data since the time
    I joined the world of **information technology (IT)** just over 25 years ago.


    In this chapter, we will discuss some reasons why an effective data engineering
    practice has a profound impact on data analytics.


    In this chapter, we will cover the following topics:


    +   - The journey of data

    +   - Exploring the evolution of data analytics

    +   - The monetary power of data'
  merge: -1
  img_proc: true
- pgno: 24
  md: '> **Remember:**

    > the road to effective data analytics leads through effective data engineering.


    # The journey of data


    **Data engineering** is the vehicle that makes the journey of data possible, secure,
    durable, and timely. A **data engineer** is the driver of this vehicle who safely
    maneuvers the vehicle around various roadblocks along the way without compromising
    the safety of its passengers. Waiting at the end of the road are **data analysts**,
    **data scientists**, and **business intelligence (BI) engineers** who are eager
    to receive this data and start narrating the **story of data**. You can see this
    reflected in the following screenshot:


    ![](img/dae8a2243a3c3cbcd9c56ff3d2217672_24_0.png)


    Figure 1.1 – Data''s journey to effective data analysis


    Traditionally, the journey of data revolved around the typical ETL process. Unfortunately,
    the traditional ETL process is simply not enough in the modern era anymore. Due
    to the immense human dependency on data, there is a greater need than ever to
    streamline the journey of data by using cutting-edge architectures, frameworks,
    and tools.'
  merge: -1
  img_proc: true
- pgno: 25
  md: 'You may also be wondering why the journey of data is even required. Gone are
    the days where datasets were limited, computing power was scarce, and the scope
    of data analytics was very limited. We now live in a fast-paced world where decision-making
    needs to be done at lightning speeds using data that is changing by the second.
    Let''s look at how the evolution of data analytics has impacted data engineering.


    # Exploring the evolution of data analytics


    Data analytics has evolved over time, enabling us to do bigger and better. For
    many years, the focus of data analytics was limited to **descriptive analysis**,
    where the focus was to gain useful **business insights** from data, in the form
    of a report. This type of analysis was useful to answer question such as "*What
    happened?*". A hypothetical scenario would be that the sales of a company sharply
    declined within the last quarter.


    Very quickly, everyone started to realize that there were several other indicators
    available for finding out *what happened*, but it was the *why it happened* that
    everyone was after. The core analytics now shifted toward **diagnostic analysis**,
    where the focus is to identify anomalies in data to ascertain the reasons for
    certain outcomes. An example scenario would be that the sales of a company sharply
    declined in the last quarter because there was a serious drop in inventory levels,
    arising due to floods in the manufacturing units of the suppliers. This form of
    analysis further enhances the decision support mechanisms for users, as illustrated
    in the following diagram:


    ![](img/dae8a2243a3c3cbcd9c56ff3d2217672_25_0.png)


    Figure 1.2 – The evolution of data analytics'
  merge: -1
  img_proc: true
- pgno: 26
  md: '**Important note**

    Both descriptive analysis and diagnostic analysis try to impact the decision-making
    process using factual data only.


    Since the advent of time, it has always been a core human desire to look beyond
    the present and try to forecast the future. If we can predict future outcomes,
    we can surely make a lot of better decisions, and so the era of **predictive analysis**
    dawned, where the focus revolves around "What will happen in the future?". Predictive
    analysis can be performed using **machine learning (ML)** algorithms—let the machine
    learn from existing and future data in a repeated fashion so that it can identify
    a pattern that enables it to predict future trends accurately.


    Now that we are well set up to forecast future outcomes, we must use and optimize
    the outcomes of this predictive analysis. Based on the results of predictive analysis,
    the aim of **prescriptive analysis** is to provide a set of prescribed actions
    that can help meet business goals.


    **Important note**

    Unlike descriptive and diagnostic analysis, predictive and prescriptive analysis
    try to impact the decision-making process, using both factual and statistical
    data.


    But how can the dreams of modern-day analysis be effectively realized? After all,
    data analysts and data scientists are not adequately skilled to collect, clean,
    and transform the vast amount of ever-increasing and changing datasets.


    The data engineering practice is commonly referred to as the **primary support**
    for modern-day data analytics'' needs.


    The following are some major reasons as to why a strong data engineering practice
    is becoming an absolutely unignorable necessity for today''s businesses:


    +   - Core capabilities of compute and storage resources

    +   - Availability of varying datasets

    +   - The paradigm shift to distributed computing

    +   - Adoption of cloud computing

    +   - Data storytelling'
  merge: -1
  img_proc: true
- pgno: 27
  md: 'We''ll explore each of these in the following subsections.


    > **Important note**

    > Having a strong data engineering practice ensures the needs of modern analytics
    are met in terms of durability, performance, and scalability.


    # Core capabilities of storage and compute resources


    25 years ago, I had an opportunity to buy a Sun Solaris server—128 **megabytes
    (MB)** **random-access memory (RAM)**, 2 **gigabytes (GB)** storage—for close
    to $ 25K. The intended use of the server was to run a client/server application
    over an Oracle database in production. Given the high price of storage and compute
    resources, I had to enforce strict countermeasures to appropriately balance the
    demands of **online transaction processing (OLTP)** and **online analytical processing
    (OLAP)** of my users. One such limitation was implementing strict timings for
    when these programs could be run; otherwise, they ended up using all available
    power and slowing down everyone else.


    Today, you can buy a server with 64 GB RAM and several **terabytes (TB)** of storage
    at one-fifth the price. The extra power available can do wonders for us. Multiple
    storage and compute units can now be procured just for data analytics workloads.
    The extra power available enables users to run their workloads whenever they like,
    however they like. In fact, it is very common these days to run analytical workloads
    on a continuous basis using data streams, also known as **stream processing.**


    The installation, management, and monitoring of multiple compute and storage units
    requires a well-designed data pipeline, which is often achieved through a data
    engineering practice.


    # Availability of varying datasets


    A few years ago, the scope of data analytics was extremely limited. Performing
    data analytics simply meant reading data from databases and/or files, denormalizing
    the joins, and making it available for descriptive analysis. The structure of
    data was largely known and rarely varied over time.'
  merge: -1
  img_proc: true
- pgno: 28
