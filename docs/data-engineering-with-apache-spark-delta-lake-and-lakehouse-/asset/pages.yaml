    Additionally, we also discovered that two orders reference product_id rows that
    do not exist in the products table. This is how we located the orphan rows in
    the table.


    > Important note

    > In relational structures, an orphan row is a record that cannot be traced back
    to a parent. In database terms, this commonly signals data corruption.


    In the cell titled Find orphan store_orders, notice the following code block that
    not only locates orphan rows, but additionally saves them to an exceptions folder
    in Azure data lake storage.


    # Find orphan store_orders


    ```

    orphan_path="wasbs://*"+SILVER_LAYER_NAMESPACE+"@"+STORAGE_ACCOUNT+".blob.core.windows.net/exceptions/orphan_orders/"+ADLS_FOLDER

    df_store_orders_orphan=spark.sql("SELECT * FROM store_orders WHERE product_id
    NOT IN (SELECT product_id FROM products)")

    df_store_orders_orphan.write.parquet(orphan_path)

    ```


