  md: "# Running the aggregation pipeline\n\nIn production, the aggregation pipeline\
    \ will be invoked automatically once the curation pipeline completes successfully.\
    \ Since we are in the unit testing phase, we will trigger it manually for now.\
    \ Let's get started:\n\n+   1. You must invoke the following commands on Azure\
    \ Cloud Shell. They will invoke **electroniz_aggregation_pipeline** based on the\
    \ parameters we pass. Please make sure you edit **EXT_TAB_LOCATION** as per the\
    \ instructions provided. Using the Azure portal, navigate to your Azure Data Lake\
    \ Storage account by going to **Home > All Resources > traininglakehouse > Endpoints.**\n\
    +   \n+   Note the URL of **Blob Service** and use this to edit EXT_TAB_LOCATION:\n\
    \n```\nRESOURCEGROUPNAME=\"training_rg\"\nDATAFACTORYNAME=\"traininglakehousedf\"\
    \nPIPELINENAME=\"electroniz_batch_aggregation_pipeline\"\naz datafactory pipeline\
    \ create-run --factory-name $DATAFACTORYNAME --name $PIPELINENAME --resource-group\
    \ $RESOURCEGROUPNAME \\\n--parameters \"{\\\"EXT_TAB_FILE_FORMAT\\\":\\\"parquetformat\\\
    \", \\\"EXT_DATA_SOURCE\\\":\\\"trainingds\\\", \\\"EXT_CREDENTIALS\\\":\\\"trainingcreds\\\
    \", \\\"EXT_TAB_LOCATION\\\":\\\"https://traininglakehouse.blob.core.windows.net\\\
    \", \\\"SILVER_LAYER_NAMESPACE\\\":\\\"silver\\\", \\\"GOLD_LAYER_NAMESPACE\\\"\
    :\\\"gold\\\" }\"\n```\n\n+   2. To verify whether the pipeline ran successfully,\
    \ you can check the status of the pipeline:\n\n+   - Using the Azure portal, navigate\
    \ to **Home > All Resources > trainingdatafactorydf.**\n+   - Click **Monitor\
    \ > Pipeline Runs.**"
  merge: -1
  img_proc: true
- pgno: 284
  md: '+   - Click **electroniz_batch_aggregation_pipeline**:


    ![](img/dae8a2243a3c3cbcd9c56ff3d2217672_284_0.png)


    Figure 8.26 – Monitoring the run of electroniz_aggregation_pipeline


    As you can see, we can safely infer that **electroniz_batch_aggregation_pipeline**
    has been completed successfully. However, this does not mean that it performed
    the job it was supposed to do. To be certain, we will need to verify the aggregated
    data in Azure Synapse.


    # Understanding data consumption


    Before we start verifying the aggregated data, we should focus on how our end
    users will be able to consume data for dashboarding, ML, and AI purposes. As per
    the laid-out architecture of the **Electroniz** lakehouse, we decided to publish
    data from both the gold and silver layers.


    Publishing data from the gold layer is necessary; otherwise, how would users be
    able to access aggregated data? But why do we need to publish data from the silver
    layer? You guessed it – analytics is an ongoing process. In the future, users
    may want to create new dashboards and ML models for the betterment of the company.


    > **Important**

    > Publishing data from the gold and silver layers is acceptable because they store
    data that is in a clean and secure state. But the same cannot be said for data
    in the bronze layer. Publishing raw/unclean data not only throws a lot of work
    around standardization, validation, and deduplication at end users, but it also
    ends up exposing classified information that should have been protected.'
  merge: -1
  img_proc: true
- pgno: 285
  md: 'The following diagram shows the lakehouse''s structure:


    ![](img/dae8a2243a3c3cbcd9c56ff3d2217672_285_0.png)


    Figure 8.27 – Electroniz data publishing points for end users


    Our promise to Electroniz was that by the end of the project, end users will not
    only be able to access the aggregated data in the gold layer but also have access
    to curated data in the silver layer for ad hoc access. Also, in the future, there
    will be new requirements for aggregations and ML models that will require access
    to the curated data.


    You may have noticed that, while creating electroniz_batch_aggregation_pipeline,
    a series of activities were defined in the pipeline. These end up creating views
    and external tables in Azure Synapse. It is important to understand how the data
    in the lakehouse is published for end users. The following data has been provided:


    +   - Access to Silver Layer Data: For access to curated data, we provided EXTERNAL
    TABLES and VIEWS in the Azure Synapse serverless SQL pool. As we mentioned previously,
    not all aggregations can be predicted initially in the project. Having access
    to the data in the silver layer will enable end users to perform ad hoc querying
    and create new aggregations in the future.'
  merge: -1
  img_proc: true
- pgno: 286
  md: '+   - **Access to Gold Layer Data:** We provided access to the aggregated tables
    in the gold layer by using **EXTERNAL TABLES** in the **Azure Synapse serverless
    SQL pool**. These external tables were created using **CREATE EXTERNAL TABLE AS
    SELECT (CETAS)**, and the query results were saved (persisted) in the gold layer
    in **Azure Data Lake Storage Gen2**. Since aggregated data is saved in the gold
    layer, this substantially improves query processing times:


    ![](img/dae8a2243a3c3cbcd9c56ff3d2217672_286_0.png)


    The preceding diagram shows how the external views and tables were created in
    **electroniz_batch_aggregation_pipeline.**


    # Accessing silver layer data


    **Create Silver Layer Views** invokes a stored procedure named **create_silver_views**
    in Azure Synapse. The code for this stored procedure is available here:


    ```

    https://github.com/PacktPublishing/Data-Engineering-with-Apache-Spark-Delta-Lake-and-Lakehouse/blob/main/project/aggregation/sql/create_silver_views.sql.

    ```'
  merge: -1
  img_proc: true
- pgno: 287
  md: 'Look at the following SQL. You will notice how the combination of external
    tables and views works:


    ```

    EXEC sp_executesql N''IF EXISTS ( SELECT * FROM sys.external_tables WHERE object_id
    = OBJECT_ID(''''store_customers'''') )

    SET @sqlcmd = ''CREATE EXTERNAL TABLE store_customers''([customer_id] INTEGER
    ,[customer_name] VARCHAR(255) ,[address] VARCHAR(255) ,

    [city] VARCHAR(255) ,[postalcode] VARCHAR(10) ,[country] VARCHAR(100) ,

    [phone] VARCHAR(100) ,[email] VARCHAR(255) ,[credit_card] VARCHAR(255) ,

    [updated_at] DATETIME)

    WITH (LOCATION = '''' + @silverns + ''''/sales/store_customers'''', data_source
    = trainingds, FILE_FORMAT = DeltaLakeFormat)'';

    EXEC sp_executesql @sqlcmd


    EXEC sp_executesql N''IF EXISTS ( SELECT * FROM sys.external_tables WHERE object_id
    = OBJECT_ID(''''ecomm_customers'''') )

    SET @sqlcmd = ''CREATE EXTERNAL TABLE ecomm_customers''([customer_id] INTEGER
    ,[customer_name] VARCHAR(255) ,[address] VARCHAR(255) ,

    [city] VARCHAR(255) ,[postalcode] VARCHAR(10) ,[country] VARCHAR(100) ,

    [phone] VARCHAR(100) ,[email] VARCHAR(255) ,[updated_at] DATETIME )

    WITH (LOCATION = '''' + @silverns + ''''/esalesns'''', data_source = trainingds,
    FILE_FORMAT = DeltaLakeFormat)'';

    EXEC sp_executesql @sqlcmd


    EXEC sp_executesql N''DROP VIEW IF EXISTS customers''

    SET @sqlcmd = ''CREATE OR ALTER VIEW customers''

    SELECT [customer_id],[customer_name] ,[address],[city],[postalcode],

    [country],[phone],[email],NULL as credit_card,[updated_at]

    FROM [dbo].[ecomm_customers]

    UNION

    SELECT [customer_id],[customer_name],[address],[city],[postalcode],

    [country],[phone],[email],[credit_card],[updated_at]

    FROM [dbo].[store_customers]''

    EXEC sp_executesql @sqlcmd

    ```


    Figure 8.29 – External tables and views in the silver layer of the lakehouse


    store_customers (customers in the stores database) is an external table that''s
    declared in the /sales/store_customers directory in the silver layer of the traininglakehouse
    Azure Data Lake Storage account. Since the silver layer is using the Delta format,
    FILE_FORMAT has been set to DeltaLakeFormat.


    ecomm_customers (the customer who brought a product online) is an external table
    that''s declared in the /esalesns directory in the silver layer of the traininglakehouse
    Azure Data Lake Storage account. Since the silver layer is using the Delta format,
    FILE_FORMAT has been set to DeltaLakeFormat.


    Notice how we cleverly combined the two types of customers in a common view named
    customers. This gives our end users the flexibility to query customers separately
    from stores versus e-commerce or have a common aggregated version.


    # Accessing gold layer data


    Create Gold Layer Tables invokes a stored procedure named create_gold_tables in
    Azure Synapse. The code for this stored procedure is available here:


    ```

    https://github.com/PacktPublishing/Data-Engineering-with-Apache-Spark-Delta-Lake-and-Lakehouse/blob/main/project/aggregation/sql/create_gold_tables.sql

    ```'
  merge: -1
  img_proc: true
- pgno: 288
  md: "Look at the following SQL. You will notice how the external tables have been\
    \ created using CTAS:\n\n```\nEXEC sp_executesql N'IF EXISTS ( SELECT * FROM sys.external_tables\
    \ WHERE object_id = OBJECT_ID(''ext_aggregated_sales'') ) DROP EXTERNAL TABLE\
    \ ext_aggregated_sales;\nSET @sqlcmd = N'CREATE EXTERNAL TABLE ext_aggregated_sales\
    \ WITH (\n    LOCATION = '' + @goldns + ''/external/ext_aggregated_sales/'',\n\
    \    DATA_SOURCE = '' + @extds + '',\n    FILE_FORMAT = '' + @format + ''\n) AS\
    \ SELECT YEAR(order_date) AS year, DATEPART(QUARTER, order_date) as quarter, round(sum(sale_price_usd),2)\
    \ as aggregated_sales_price FROM orders GROUP BY YEAR(order_date), DATEPART(QUARTER,\
    \ order_date) '\nEXEC sp_executesql @sqlcmd\n```\n\nFigure 8.30 – External tables\
    \ in the gold layer of the lakehouse\n\nNotice how ext_aggregated_sales was created\
    \ using CTAS. The query fetches aggregated data by quarter from the orders view\
    \ and the result is persisted in the gold layer in Parquet format.\n\n> **Important**\n\
    > Having a solid data consumption strategy is critical for the overall success\
    \ of data lake projects. After all, this is the point of entry for end users for\
    \ their data usage scenarios.\n\nNow that we have a solid understanding of the\
    \ data consumption patterns used by end users, we can verify the actual data.\n\
    \n# Verifying aggregated data in the gold layer\n\nAssuming the previous invocation\
    \ of electroniz_batch_aggregation_pipeline was successful, you should see the\
    \ following external tables and views in the silver container of the Azure Data\
    \ Lake Storage account:\n\n+   1. Using the Azure portal, navigate to Home > All\
    \ Resources > trainingsynapse100."
  merge: -1
