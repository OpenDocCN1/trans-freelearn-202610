- pgno: 107
  md: '+   - Any SLAs that need to be met

    +   - End-user locations—on-prem, remote, or a combination of these

    +   - How much automation is desired for infrastructure and code deployment

    +   - Whether the deployment needs to be cloud vendor-agnostic


    # Shortlisting use cases


    Create a list of individual use cases that need to be addressed by talking to
    each sub-group separately within the organization. Make sure that each use case
    has a designated owner who will act as the designated **knowledge champion** and
    has authority over matters relating to data access.


    # Conducting discovery sessions


    Data engineers should conduct discovery sessions with each sub-group to collect
    the following information:


    +   - Use-case description and end goals.

    +   - Identification of data sources—location, connectivity information, any challenges
    with establishing connectivity such as **multi-factor authentication (MFA)**,
    tokens, and firewall issues.

    +   - Identification of datasets—list of tables, files, or APIs with corresponding
    data type and schema.

    +   - What is the frequency of schema changes?

    +   - The approximate data size of historical and incremental data for each data
    source.

    +   - What is the approximate size of incremental data?

    +   - What is the tolerable data lag between **online transaction processing (OLTP)**
    and **online analytical processing (OLAP)**? Is it a day, a few hours, or near
    real time?

    +   - Details regarding data consumers—data analysts/data scientists.

    +   - Is the intended use case brand new or did the **extract, transform, load
    (ETL)** code previously exist?

    +   - If the use case did previously exist, ask for the existing ETL code. Also,
    ask for any supporting dashboards and reports.

    +   - If the use case is brand new, ask for a written document explaining the
    intended joins, aggregations, and filters.

    +   - Does **personally identifiable information (PII)** need to be masked?'
  merge: -1
  img_proc: true
- pgno: 108
  md: '+   - Are there any data classification rules?

    +   - What are the requirements for table-level, row-level, and column-level security?

    +   - Will data be encrypted using cloud-vendor encryption keys or client-supplied
    encryption keys?

    +   - What **information technology (IT)** skills does the team currently carry?
    Is the team willing to invest time in learning modern frameworks such as Spark?

    +   - Are there any data science, ad hoc reporting, and **business intelligence
