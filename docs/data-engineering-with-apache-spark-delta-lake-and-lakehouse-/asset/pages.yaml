- pgno: 73
  md: '# 3


    # Data Engineering on Microsoft Azure


    In the previous chapter, we discussed how cloud adoption offers greater flexibility
    and faster deployments for data engineering and analytical workloads. In this
    chapter, we''ll discuss the major tools and services in Microsoft Azure that may
    help us implement such a solution.


    In this chapter, we will cover the following topics:


    +   - Introduction to data engineering in Azure

    +   - Performing data engineering in Azure

    +   - How to open a free account with Azure


    # Introducing data engineering in Azure


    In recent years, Microsoft Azure has added several powerful services to its arsenal
    that seamlessly collect, store, process, and publish data for both batch and streaming
    workloads. Gone are the days where choices for storage and compute were severely
    limited among cloud vendors. As a user, you simply needed to conform with the
    supplied tools and services: now, your options are more extensive.'
  merge: -1
  img_proc: true
- pgno: 74
  md: 'Today, the cloud ecosystem looks very different from what it did previously.
    The growth of cloud services allows users to choose from a variety of storage,
    compute, and deployment options. As an example, if I want to run a Spark program,
    I can choose from at least four different options in Microsoft Azure. The real
    question is, if all four options are running Apache Spark, then why are these
    options even required?


    > **Important Note**

    > The array of options available on the cloud are not limited to compute only:
    the same variety exists for data collection, infrastructure deployments, and pipeline
    orchestration services.


    Here are some of the reasons why several options for performing similar kinds
    of operations in data engineering are available on Microsoft Azure:


    +   - **Ease of use**: The ease of use of a service is a key factor in deciding
    which option to use. As a data engineer, you may code the entire **ETL** program
    yourself or opt for a service that can auto-generate and invoke the code for you
    after creating a visual workflow.

    +   - **Data engineering team skills**: The skill level of the data engineering
    team plays a very important role in deciding which option to choose. Teams with
    skilled data engineers typically tend to choose services where data workflows
    need to be coded from scratch. Doing so offers engineers complete control over
    their programs, as well as any other dependencies.

    +   - **The desired level of administration and monitoring**: Having a skilled
    data engineering team does not automatically mean that the same team will be involved
    in administering and monitoring the operations. The choice of service may need
    to be adjusted, depending on who will be managing it in production.

    +   - **Self-serve analytics**: These days, the concept of self-serve analytics
    is on the rise. This means that end users are getting more and more involved in
    creating ETL/ELT workflows. For this specific set of users, the ability to create
    a drag-and-drop workflow in a few clicks is extremely desirable.


    > **Important Note**

    > The idea of self-serve analytics is gaining a lot of popularity these days.

    > Self-serve analytics enables fast-paced delivery of end user analytical goals.'
  merge: -1
  img_proc: true
- pgno: 75
  md: '+   - **Level of control that''s desired over the infrastructure:** The level
    of control that''s desired over the infrastructure is an important factor that
    impacts the choice of service. In some cases, the cloud-provided service may lack
    some desired functionality and does not permit changing the underlying infrastructure.
    In this case, the data engineers may want to choose a service that offers complete
    control of the infrastructure.

    +   - **Complete data isolation:** Some stringent compliance frameworks do not
    permit the use of multi-tenant services. In such cases, complete data isolation
    is mandatory, thus impacting the choices that may be suitable.


    > **Important Note**

    > There is an ongoing debate around whether cloud services are truly compliant
    with well-known frameworks such as HIPAA. The multi-tenancy nature of cloud storage
    is a huge roadblock in making that claim. It is fair to say that cloud storages
    support compliance frameworks but are not truly compliant.


    +   - **Prior familiarity with certain frameworks:** This is an extremely important
    factor for organizations migrating their analytics from on-premises to the cloud.
    Since they are already familiar with a certain tool or framework, they tend to
    choose the closest option available in the cloud.

    +   - **Cost:** Finally, the cost of the service is a major factor that impacts
    what choice should be made. Typically, the easier the usage and management of
    a particular service, the higher its cost. Therefore, before choosing a service,
    careful cost analysis is deemed necessary.


    > **Important Note**

    > As a data engineer, it is understandable to have a bias toward specific tools,
    languages, and frameworks. But once you leave, it becomes the customer''s responsibility
    to manage this. Try to keep your bias aside and provide the customer with a solution
    that uses technologies that the customer feels comfortable with.'
  merge: -1
  img_proc: true
- pgno: 76
  md: '# Performing data engineering in Microsoft Azure


    Data engineering in Microsoft Azure can be performed using the following three
    options:


    +   - Self-managed data engineering services (IaaS)

    +   - Azure-managed data engineering services (PaaS)

    +   - Data engineering as a service (SaaS):


    ![](img/dae8a2243a3c3cbcd9c56ff3d2217672_76_0.png)


    Figure 3.1 – Data engineering option in Microsoft Azure


    # Self-managed data engineering services (IaaS)


    In the early phases of data engineering, using well-known distributed frameworks
    such as Hadoop, Spark, and Kafka rose sharply. As a result, many organizations
    were deploying Hadoop/Spark/Kafka using on-premises infrastructures. Since Hadoop/Spark/Kafka
    are multi-node frameworks, this meant the installations were performed using physical
    and virtual machines hosted on either the organization''s owned or co-located
    data centers.'
  merge: -1
  img_proc: true
- pgno: 77
  md: 'Then came the period when the cloud started to become a reality and organizations
    started to move their Hadoop/Spark/Kafka clusters to the cloud. In the very early
    stages of the cloud evolution, using a self-managed service was perhaps the only
    option available for data engineering.


    # IaaS use case


    Here are a few use cases where using an IaaS layer is warranted:


    +   - An organization that has heavily **customized** Hadoop/Spark/Kafka clusters.
    This means they are tied to specific versions that are unavailable on the cloud
    PaaS equivalent service.

    +   - The organization has developed its own libraries for data engineering and
    data science that can''t easily be deployed on PaaS or SaaS offerings on the cloud.

    +   - An organization where security regulations do not permit the use of multi-tenant
    cloud services. This forces them to use single-tenant dedicated cloud resources.

    +   - An organization that cannot tolerate variability in the compute power of
    the use of shared services.


    Let''s take a look at how a typical Hadoop/Spark/Kafka deployment is performed
    using self-managed services that use the **Infrastructure as a Service (IaaS)**
    layer on Microsoft Azure.


    **Azure Virtual Machines (Azure VMs)** allows you to create on-demand compute
    resources for data processing. The following list describes some of the features
    available using Azure VMs:


    +   - Take the inventory of the on-premises Hadoop/Spark/Kafka nodes – the total
    number of nodes, aggregated CPU, and aggregated memory.

    +   - Shortlist virtual machines on Microsoft Azure that offer similar aggregated
    CPU and memory as the on-premises inventory. This step requires careful planning
    and calculations. It is not necessary to procure the same number of nodes on Microsoft
    Azure, so long as the aggregated CPU and memory meet or exceed the on-premises
    deployment. In distributed computing, horizontal scalability of nodes is preferable.
    It is highly recommended to compare different classes of virtual machines on Microsoft
    Azure; in many cases, you may be able to procure smaller class virtual machines
    that are cheaper than higher class ones, both offering the same aggregated CPU
    and memory.

    +   - Procure virtual machines on Microsoft Azure.'
  merge: -1
  img_proc: true
- pgno: 78
  md: '+   - Configure networking among nodes, open required firewall ports, and install
    operating system prerequisites.

    +   - Install and configure Hadoop/Spark/Kafka and any other ecosystem tools,
    such as Sqoop, Oozie, Hive, and so on. These steps need to be performed on multiple
    nodes.

    +   - Install and configure administration and monitoring software.


    Here are a few pros and cons of self-managed services:


    +   - Performing deployments using virtual machines provides the data engineer
    with complete freedom to choose any framework and any version, and have complete
    control over its dependencies.

    +   - It should be evident from the deployment process outlined previously that
    choosing self-managed services requires careful planning, design, and execution.

    +   - Due to the vast variety of touchpoints, the data engineering team in charge
    of the deployment needs to be skilled in several areas, including cloud deployments,
    networking, administration, and monitoring. Note that all these skills are above
    and beyond the usual expectations of a data engineering team, which would normally
    involve things such as pipeline development and data orchestration.

    +   - Scaling a cluster using a self-managed service can become a challenge.


    As we mentioned previously, deploying a Hadoop/Spark/Kafka cluster using self-managed
    services is not optional. However, there are ways you can minimize the effects
    of the limitations we have just discussed.


    # Hadoop/Spark/Kafka distributions


    The deployment process of Hadoop/Spark/Kafka clusters using VMs involves multiple
    nodes. A simpler way to deal with installing, upgrading, administrating, and monitoring
    these clusters is by using distributions such as **Cloudera**, **Hortonworks**,
    and **MapR**. Each of these distributions include software that enables cluster
    provisioning using a minimal setup. **Ambari** enables users to easily create,
    administer, and monitor a Hadoop cluster, whereas **Cloudera Manager** enables
    users to provision **Hadoop** and **Spark** clusters.


    # Infrastructure as Code


    **Infrastructure as Code (IaC)** is a practice of deploying cloud resources such
    as VMs using configuration files. Using this practice, you may either create the
    entire infrastructure or make modifications to it. Using IaC significantly decreases
    manual effort for reoccurring tasks while maintaining a high level of consistency
    and accuracy. We will discuss this practice in greater detail in *Chapter 11,
    Infrastructure Provisioning.*'
  merge: -1
  img_proc: true
- pgno: 79
  md: 'Azure Resource Manager (ARM) centralizes IaC deployments using resource templates.


    # Containerization


    **Containerization** is the practice of abstracting application code from the
    underlying infrastructure. Using containerization provides several benefits, including
    segregating the host environment, choosing a software version, and dependency
    management. This means the cluster nodes can now run in their own isolated environment
    called containers. These containers can be orchestrated using the well-known orchestration
    engine known as **Kubernetes**. **Azure Kubernetes Service (AKS)** allows you
    to easily deploy and manage containerized applications.


    > **Important Note**

    > In the cloud era, a lot of organizations are adopting technologies that keep
    them cloud-agnostic. Who knows which vendor will drop their prices and when? Containerizing
    their applications keeps them open to moving between cloud vendors as desired.


    # Azure-managed data engineering services (PaaS)


    Right after the big data wave started to gain momentum, cloud vendors such as
    Microsoft Azure started to create managed services to provide customers with fast
    deployments and easy management. Before we go into the specifics of the services,
    let’s focus on what an Azure-managed service that uses the **platform as a service
    (PaaS)** layer on Azure means:


    +   - The resource is deployed with minimal configuration and user input.

    +   - Azure takes care of monitoring the resource for downtime and recovers it
    automatically in case a failure is detected.

    +   - Globally available.

    +   - Well integrated with other Azure services.

    +   - Automatically provides data redundancy.

    +   - Contains built-in security mechanisms for data protection.'
  merge: -1
  img_proc: true
- pgno: 80
  md: '# PaaS use case


    Here are a couple of use cases where using the PaaS layer is warranted:


    +   - An organization has on-premises Hadoop/Spark/Kafka clusters and quickly
    wants to migrate to the cloud.

    +   - An organization has limited cloud skills, so they want to use services with
    low operational requirements.

    +   - An organization where security regulations permit the use of multi-tenant
    cloud services and can tolerate variability in compute power.


    Here are a few of the Azure-managed PaaS services.


    # Data storage services in Microsoft Azure


    During the big data wave, cloud vendors, including Microsoft Azure, started to
    launch storage solutions specifically targeted at storing vast volumes and varieties
    of data. To meet the high demand of storing large files at scale, object-level
    storage has become a unanimous choice among all cloud vendors. Let''s take a look
    at the storage types in Microsoft Azure that are deemed suitable for data lakes.


    # Azure Blob storage


    **Azure Blob storage** is an object storage solution that is highly optimized
    for storing large amounts of text and binary data. Azure Blob storage was built
    with a huge focus on scalability, high availability, and security. It stores data
    in three tiers: hot, cool, and archive. The hot tier is used for frequently accessed
    data, cool for infrequently accessed data, and archive for rarely accessed data.
    Depending on usage, you can choose between two performance tiers: standard and
    premium.


    Data in Azure Blob storage is protected by several authentication mechanisms such
    as **Azure Active Directory**, shared keys, and **shared access signatures (SASes)**.
    You can also protect your blobs using **role-based access control (RBAC)**. You
    may turn versioning on for extra protection against accidental changes and deletes.
    This feature maintains the previous version of the blob in case you need to recover
    it.


    Blobs in Azure Blob storage are automatically encrypted and redundant. Multiple
    copies of data are stored – three copies are stored within a single physical location
    by default, and several options exist for storing copies across zones and regions.'
  merge: -1
  img_proc: true
- pgno: 81
  md: 'Azure Blob storage organizes data as follows:


    +   - **Storage account**: The storage account holds your data. A unique namespace
    for your account is allocated in Azure. An example namespace address is `https://mydatanalytics.blob.core.windows.net`.

    +   - **Containers**: A container organizes a group of blobs. A container should
    have a valid DNS name such as `https://mydatanalytics.blob.core.windows.net/mydatacontainer`.

    +   - **Blobs**: Actual data that is stored in the containers:


    ![](img/dae8a2243a3c3cbcd9c56ff3d2217672_81_0.png)


    Figure 3.2 – Storing blobs in Azure Blob storage


    > **Important Note**

    > A particular drawback of object storage is its slow search performance.

    > In Azure Blob storage, you can speed up searches using index tags.


    # Azure Data Lake Storage Gen2


    Azure Data Lake Storage offers a significant edge over Azure Blob storage when
    it comes to suitability for analytical workloads. But before we proceed with the
    reasons why, let me make one clarification: Azure Data Lake Storage is a layer
    built on top of Azure Blob storage.'
  merge: -1
  img_proc: true
- pgno: 82
  md: 'Azure Data Lake Storage is compatible with Apache ecosystem tools such as Hadoop
    and Spark. It brings together all the great features offered by Azure Blob storage,
    plus more:


    +   - **Hierarchical namespace**: Compared to Azure Blob storage, which has a
    flat namespace, Azure Data Lake Storage organizes blobs in a hierarchy of directories.
    This method of blob organization greatly enhances the performance of search operations.

    +   - **Access control lists**: Azure Data Lake Storage supports the fine-grained
    security of blobs by using **POSIX**-style permissions.

    +   - **Designed for analytics**: Azure Data Lake Storage provides excellent support
    for major open source platforms such as Hadoop and Spark. Using the Azure Blob
    filesystem driver, the open source platforms can easily access the object storage
    without the need for explicit code:


    ![](img/dae8a2243a3c3cbcd9c56ff3d2217672_82_0.png)


    Figure 3.3 – Storing blobs in a hierarchy in Azure Data Lake Storage


    +   - **Tight integration with Azure services**: Azure Data Lake Storage integrates
    seamlessly with Azure services such as Azure Data Factory, Azure HDInsight, and
    Azure Stream Analytics.'
  merge: -1
  img_proc: true
- pgno: 83
  md: '# Azure Event Hubs


    **Azure Event Hubs** is a data streaming platform used for ingesting event data.
    The source of the event data that''s collected is usually application logs, clickstreams,
    and IoT. Azure Event Hubs can be deployed with minimal configuration.


    You can use Azure Event Hubs for both batch and real-time processing. For batch
    processing, data from Event Hubs can be captured in Azure Blob storage or Azure
    Data Lake Storage so that it can be processed later. For real-time processing,
    you may have to send data to Azure Functions, which could take further action
    based on events:


    ![](img/dae8a2243a3c3cbcd9c56ff3d2217672_83_0.png)


    Figure 3.4 – Multi-tenancy and single-tenancy in Azure Event Hubs


    Data in Azure Event Hubs is not stored permanently. By default, the queue is 1
    day, but this can be increased to 7 days in the standard edition and 90 days in
    the dedicated edition.


    Event data is stored in partitions – the higher the number of partitions, the
    higher the read and write throughput. The capacity of Azure Event Hubs is pre-purchased
    using throughput limits once the throughput limit equates to a write process (1
    MB/1,000 events) or a read process (2 MB/4,096 events). The auto-inflate feature
    can be used to automatically scale your throughput units based on peak demands.


    Azure Event Hubs replicates data within the primary data center with **automated
    failure detection** and recovery enabled. For extra protection, replication across
    availability zones can also be enabled.'
  merge: -1
  img_proc: true
- pgno: 84
  md: '# Azure Cosmos DB


    Azure Cosmos DB is a highly available and low latency NoSQL class database. Being
    a managed service, the usual administration challenges around installation, patching,
    and upgrades are taken care of by Azure. Cosmos DB stores data on SSD and the
    data is encrypted by default.


    Azure Cosmos DB is globally distributed, making it extremely suitable for applications
    requiring high responsiveness. In a globally distributed deployment, Azure Traffic
    Manager can successfully route the application request to the closest Azure region,
    all without any changes needing to be made to the code. This way, the application
    can archive fast response times for both read and write operations:


    ![](img/dae8a2243a3c3cbcd9c56ff3d2217672_84_0.png)


    Figure 3.5 – Global distribution with Azure Cosmos DB


    Due to its schema-less design, it is easy to store semi-structured and unstructured
    data at scale. Here is what the resource model of Azure Cosmos DB looks like:'
  merge: -1
  img_proc: true
- pgno: 85
  md: '![](img/dae8a2243a3c3cbcd9c56ff3d2217672_85_0.png)


    Figure 3.6 – Azure Cosmos DB resource model


    Under an Azure Cosmos DB account, you can create databases, containers, and items.
    Multiple APIs are supported in Azure Cosmos DB and the API you choose impacts
    the item''s type. Items store data in a container and have variable schemas based
    on the following mappings:


    +   - **Table API and SQL API**: Table

    +   - **Cassandra API**: Row

    +   - **MongoDB API**: Document

    +   - **Gremlin API**: Node


    Partitioning is an important aspect of getting the best performance out of Azure
    Cosmos DB. Based on a partition key, data is stored in subsets called **logical
    partitions**. Storing data in partitions hugely improves performance since all
    the items in a logical partition have the same key value.


    > **Important Note**

    > Choosing the correct partition key is an extremely important skill for data
    engineers since it affects your application''s performance in both negative and
    positive ways.


    # Data processing services in Microsoft Azure


    Right after the big data wave started to gain momentum, cloud vendors started
    to package popular open source frameworks such as Hadoop, Spark, and Kafka and
    offer them as vendor-managed services. Let''s look at a few Azure-managed data
    processing services.'
  merge: -1
  img_proc: true
- pgno: 86
  md: '# Azure HDInsight


    **Azure HDInsight** is a managed service for cloud distribution for Hadoop and
    its ecosystem. It embeds popular open source frameworks such as **Hadoop**, **Spark**,
    **Kafka**, **Hive**, and **Storm**. Azure HDInsight allows you to spin up clusters
    with ease and greater efficiency. Azure HDInsight embeds the popular **Hortonworks
    Data Platform (HDP)**. It has several benefits compared to self-managed Hadoop/Spark/Kafka
    clusters, as outlined in the following list:


    +   - **Fully managed**: Azure HDInsight clusters are fully managed by Azure.
    This means the deployment cycle is seamless and highly accelerated. A new cluster
    can be spun up literally in a matter of minutes with minimal deployment steps.

    +   - **Managed resources**: Azure HDInsight shields users from issues arising
    from underlying infrastructure problems. Underlying hardware and software components
    are monitored regularly and are self-healing.

    +   - **Azure cloud-native security**: Azure HDInsight can leverage Azure cloud-native
    security services such as VNETs, transparent encryption, and **Azure Active Directory**
    integration for RBAC.

    +   - **Azure cloud-native monitoring**: Azure HDInsight can leverage Azure cloud-native
    monitoring tools such as **Azure Monitor**.

    +   - **Seamless integration with other Azure services**: Azure HDInsight can
    seamlessly integrate with Azure services such as **Azure Data Lake Storage Gen
    2**, **Azure Data Factory**, **Azure CosmosDB**, and **Azure Synapse**.

    +   - **Decouples storage and compute**: Azure HDInsight truly segregates storage
    and compute by providing options to store data that''s external to the cluster
    on services such as **Azure Blob Storage** and **Azure Data Lake Storage Gen 2**.

    +   - **Auto-scalability**: Azure HDInsight can auto-scale nodes up and down based
    on preset triggers that are based on scheduled or, more likely, performance metrics.

    +   - **Azure marketplace extensibility**: Azure HDInsight can use several marketplace
    extensions that can further extend its power and functionality.


    # Azure Databricks


    For those of you not familiar, **Databricks** is a company that was founded by
    the original creators of **Apache Spark**, **Delta Lake**, and **MLFlow**. Databricks
    Spark can only be run on a cluster that''s been deployed on the cloud.'
  merge: -1
  img_proc: true
- pgno: 87
  md: '**Important Note**

    **Databricks Community Edition** offers a free version that can be very useful
    if you are trying to learn Spark. Here is the link: https://community.cloud.databricks.com.


    **Azure Databricks** is a data engineering and analytics platform for performing
    large-scale distributed computing on Microsoft Azure. Azure Databricks uses the
    Apache Spark framework for high-performance data processing. You may be wondering
    what is so special about the Azure Databricks version of Spark that makes it widely
    recognized as the leader in distributed computing. Here are a few reasons why:


    +   - **Performance enhanced runtime**: Azure Databricks has added several performance
    enhancements over the open source version of Apache Spark. As per a few benchmarks,
    Databricks Spark performs up to eight times better than the open source version.

    +   - **Collaborative environment**: Azure Databricks supports a collaborative
    environment between the data engineering, data analysis, and data science teams.
    Data engineers can easily share resources such as workspaces and jobs.

    +   - **Interactive development**: Azure Databricks provides an **interactive
    development environment (IDE)** using notebooks. Data engineers can manage their
    Spark code (notebooks) using popular source control tools such as GitHub and Bitbucket.

    +   - **Decouples storage and compute**: Azure Databricks decouples storage from
    compute by storing data on Azure Blob Storage and **Azure Data Lake Storage Gen2**.

    +   - **Seamless integration with other Azure services**: Azure Databricks can
    seamlessly integrate with other Azure services, including **Azure Data Factory**,
    **Azure Event Hub**, and **Azure Synapse**.

    +   - **Active Directory integration**: Azure Databricks integrates well with
    **Azure Active Directory**.

    +   - **Auto-scalability**: Azure Databricks supports autoscaling by adding or
    removing worker nodes based on workloads.

    +   - **Support for GPU instances**: Azure Databricks supports high-performance
    computing required for deep computing using **graphics processing units (GPUs)**.


    Azure Databricks offers a couple of environments for data engineering and analytics
    workloads.'
  merge: -1
  img_proc: true
- pgno: 88
  md: '# Azure Databricks SQL Analytics


    Azure Databricks SQL Analytics is a platform for performing data analytics using
    SQL. Azure Databricks uses **SQL endpoints** for computations. SQL endpoints vary
    by the size of the cluster chosen at the start of the installation. In addition
    to large-scale data processing, this service includes some other useful features
    such as alerts, which can trigger messages to tools such as Slack and **PagerDuty**
    based on the conditions that have been configured. Additionally, you can create
    visualizations such as bar and pie charts.


    # Azure Databricks workspace


    An Azure Databricks workspace is an interactive environment for data engineers,
    data scientists, and machine learning engineers to collaboratively process batch
    and real-time data. An Azure Databricks workspace contains objects such as notebooks,
    libraries, and experiments that can be shared among team members.


    Even though Azure and Databricks are two separate companies, they have provided
    a collaborative and unified data platform by structuring services in a way that
    they integrate seamlessly and securely. Azure Databricks operates using a **control
    plane** and a **data plane**:


    +   - **Control plane**: Backend services managed by Azure. Single sign-on is
    integrated with Azure Active Directory. This plane consists of management layer
    components such as cluster manager, metadata, and web UI.

    +   - **Data plane**: This plane resides in the customer''s Azure account. For
    data processing, compute resources are created within the customer''s VNET. This
    plane also stores customer data that''s been collected from external sources,
    streaming, and IoT.


    > **Important Note**

    > Having data in the data plane ensures that you have full control over and access
    to your data. Importantly, it gives you the flexibility to use any cloud vendor
    or service in the future.


    # Data engineering as a service (SaaS)


    In modern times, organizations want to be less bothered about maintaining infrastructure
    and more focused on doing things that matter. This is the reason why the concept
    of offering **software as a service (SaaS)** has gained immense popularity. In
    a typical SaaS solution infrastructure deployment, load balancing, high availability,
    and scalability are handled by the vendor. This gives their customers peace of
    mind to use the service without worrying about the underlying hardware or software.'
  merge: -1
  img_proc: true
- pgno: 89
  md: '# SaaS use case


    Here are a couple of use cases where using an SaaS layer is warranted:


    +   - An organization that wants to focus on data engineering and analytics without
    going through the hassle of managing infrastructure or code.

    +   - An organization where security regulations permit the use of multi-tenant
    cloud services and can tolerate variability in compute power.


    Microsoft Azure offers several SaaS products via its pay-per-use model. Since
    the list of Azure-offered SaaS products is long, we will focus on the ones that
    are commonly used in the world of data engineering and analytics.


    # Azure Data Factory


    **Azure Data Factory** is a managed data integration and transformation service.
    You can use over 90 built-in connectors to collect data from a vast variety of
    data sources, including databases (relational and non-relational), APIs, filesystems,
    and other SaaS applications.


    Azure Data Factory is built to handle data integration workflows using the classical
    approach of **Extract, Transform, Load (ETL)** or the modern approach of **Extract,
    Load, Transform (ELT)**. An Azure Data Factory workflow is referred to as a **pipeline**.
    A pipeline is a collection of activities that are units of work that perform actions
    on datasets. An activity uses a **linked service** to connect to external sources
    such as storage, databases, and clusters:


    ![](img/dae8a2243a3c3cbcd9c56ff3d2217672_89_0.png)


    Figure 3.7 – Interaction between the Azure Data Factory components'
  merge: -1
  img_proc: true
- pgno: 90
  md: 'An activity in Azure Data Factory can be one of the following three types:


    +   - **Data movement activity**: A data movement activity is used for copying
    data from a source data store to a sink data store. The data movement activity
    is executed on an **integration runtime** that acts as a compute environment that
    facilitates running the activity. An integration runtime can be Azure-hosted (runs
    on Azure infrastructure), self-hosted (runs on customer infrastructure), or Azure-SSIS
    (runs on an Azure-managed SSIS cluster).

    +   - **Data transformation activity**: A data transformation activity allows
    data engineers to build curation and transformation logic and execute it on a
    variety of computing environments, such as **Azure HDInsight** and **Azure Databricks**.

    +   - **Data control activity**: A data control activity allows data engineers
    to build a data workflow using programmatic operations such as if-else, parameterization,
    and iterations.


    Using Azure Data Factory, you can build, run, and monitor data-driven workflows
    without the need to write code. The following are the components of the Azure
    Data Factory service:


    +   - **Ingest**: You can ingest data from over 90 data sources from on-premises,
    Azure cloud, or other cloud vendors.

    +   - **Control flow**: You can generate code-free flows to control the execution
    of workflows using programmatic operations.

    +   - **Data flow**: You can generate code-free transformations that execute in
    Spark or use pre-existing Spark clusters.

    +   - **Schedule**: You can schedule pipelines using manual, event-based, or scheduled
    triggers.

    +   - **Monitor**: You can view the pipeline''s run history and create alerts/notifications.


    Azure Data Factory replicates pipeline metadata across paired regions to protect
    against failures. It also implements RBAC for authoring, editing, and monitoring
    pipelines.'
  merge: -1
  img_proc: true
- pgno: 91
  md: '# Azure Data Lake Analytics


    **Azure Data Lake Analytics** is a fully managed analytics job service for large-scale
    data processing. It can run massively parallel data transformation jobs. Azure
    Data Lake Analytics dynamically provisions resources based on demand.


    Azure Data Lake Analytics uses a **U-SQL** runtime engine that''s submitted as
    jobs. A job in Azure Data Lake Analytics executes in four phases, as follows:


    +   - **Preparing:** In this phase, the U-SQL script is uploaded to Azure and
    optimized for further execution.

    +   - **Queued:** A job is queued until resources are made available that can
    run the job.

    +   - **Running:** The job is started.

    +   - **Finalizing:** The job has been completed.


    Azure Data Lake Analytics divides the job into multiple sub-jobs, also known as
    **vertexes**. A vertex represents a parallelly executing portion of the job on
    the same data. The degree of parallelism is measured in **analytics units**. 1
    AU = 1 Azure VM with 2 vCPUs and 6 GB of RAM:


    ![](img/dae8a2243a3c3cbcd9c56ff3d2217672_91_0.png)


    Figure 3.8 – Distribution of Azure Data Lake Analytics Jobs using vertexes'
  merge: -1
  img_proc: true
- pgno: 92
  md: '# Azure Stream Analytics


    **Azure Stream Analytics** is a fully managed real-time data analysis service.
    It is used to process high-velocity streaming data from data sources such as IoT
    sensors, logs, and social media. Here are some use case scenarios for Azure Stream
    Analytics:


    +   - Real-time decision-making such as fraud detection and predictive analysis

    +   - IoT anomaly detection of IoT sensor data

    +   - Monitoring infrastructure and application logs

    +   - To facilitate dashboarding

    +   - Invoking workflows based on conditions

    +   - Identifying patterns and aggregating data across several data sources

    +   - Alerting based on threshold values

    +   - Performing sentiment analysis for social media posts


    An Azure Stream Analytics job is set up with an **input**, **query**, and **output**.
    The job input can stream data from Azure Event Hubs, Azure IoT Hub, or Azure Blob
    storage.


    The query engine is based on SQL and can be used in combination with **JavaScript**
    and **C#** user-defined functions to perform operations such as filtering, sorting,
    and aggregating. Finally, the output can be sent to several locations, including
    Power BI, Azure Synapse, and Azure Data Lake Storage.


    During the input and output operations, there is a chance that the Azure Stream
    Analytics job will connect to sources outside your Azure VNET. This can be securely
    accomplished using private endpoints or by setting up trusted networking services.


    By default, Azure Stream Analytics is a **multi-tenant** service. For extremely
    security-conscious organizations, there is another option called **Azure Stream
    Analytics Cluster**. Azure Stream Analytics Cluster works in **single-tenant**
    mode using isolated and dedicated hardware.


    The capacity of an Azure Stream Analytics cluster is measured in **streaming units
    (SUs)**. You may scale your SUs up and down based on traffic demands:


    > **Important Note**

    > The multi-tenancy nature of SaaS and PaaS may be a roadblock for highly regulated
    organizations due to compliance issues with shared infrastructure. Using a dedicated
    IaaS layer may be the only choice in those cases.'
  merge: -1
  img_proc: true
- pgno: 93
  md: '![](img/dae8a2243a3c3cbcd9c56ff3d2217672_93_0.png)


    Figure 3.9 – Input and output of Azure Stream Analytics


    Since Azure Stream Analytics is a fully managed service, it has built-in recovery
    mechanisms for fault tolerance. It works on the principle of at least once delivery,
    so events are never lost in case of failures. Azure Stream Analytics encrypts
    all incoming/outgoing communication and performs all computations in memory.


    # Azure Synapse Analytics


    Azure Synapse Analytics is an enterprise-grade data engineering and analytics
    service. Synapse analytics implements the lakehouse architecture by embedding
    a unique mixture of data processing services, as follows:


    +   - **Synapse SQL**: This implements a SQL-based data massively parallel processing
    data warehouse. Synapse SQL employs a couple of models:


    +   - **Dedicated SQL pools**: In the dedicated model, a set of resources is provisioned
    based on the chosen **data warehouse units (DWUs)**. A dedicated SQL pool uses
    a node-based architecture for computations. At the lowest denomination, the DW100c
    (single-node cluster) stores 60 distributions of data on a single node. At the
    highest denomination, the DW30000c (60-node cluster) stores one distribution of
    data per node. The **performance** and **concurrency** of queries increase lineary
    as more DWUs get added, and so does the cost. The cost of storage is charged separately
    based on usage.


    The compute nodes store tables in a distributed fashion in Azure Storage and uses
    the **data movement service (DMS)** to run queries in parallel. Table distribution
    can be of three types: **hash**, **round robin**, and **replicated**.'
  merge: -1
  img_proc: true
- pgno: 94
  md: 'The compute and storage layers are fully decoupled. To save on costs, you can
    pause the compute layer, at which time the billing stops for the allocated DWUs.
    On the other hand, the storage cost is permanent, regardless of whether the compute
    layer is active or has been paused.


    +   - **Serverless SQL pools**: In the serverless model, there is no need to provision
    resources or copy data to compute nodes. Instead, you can query data in Azure
    Blob storage using an external data source. Using this method, you can query data
    in several formats, including **CSV**, **JSON**, and **parquet**. For files in
    parquet format, you can infer the schema automatically. Querying data from Azure
    Cosmos DB is also supported using **Azure Synapse Link**.


    Serverless SQL pools automatically scale the resources based on the demands of
    the query. For faster execution, they utilize a **distributed query processing
    (DQP)** engine to split the query into multiple smaller queries. The cost of a
    serverless SQL pool is based on the data that''s processed by queries.


    > **Important Note**

    > Dedicated and serverless pools follow different costing methods. While the dedicated
    pool is charged by the number of DWUs, the serverless model is based on data processed.
    Generally, serverless pools will cost less than dedicated pools. But there may
    be cases involving large data scans, in which case you may be better off using
    a dedicated pool. It is highly recommended that the data engineer performs a benchmark
    test before choosing the appropriate pool.


    +   - **Synapse Spark**: Synapse Spark implements the Apache Spark engine for
    distributed computing. This process involves creating a Spark pool in Azure Synapse.
    A Spark pool is simply the definition of the resource, such as node size, autoscaling
    behavior, and the number of nodes. The actual Spark instance gets created when
    a job is submitted to the pool. To save on costs, you can use the **automatic
    pause** mechanism, which can release the Spark resources after a configurable
    idle time.


    Using a Synapse Studio notebook, a data engineer can manage data **wrangling**,
    **transformations**, and **visualizations**. Azure Synapse Analytics is compatible
    with the Delta Lake framework, which acts as the core storage component for implementing
    the lakehouse architecture.'
  merge: -1
  img_proc: true
- pgno: 95
  md: '> **Important Note**

    > The ability of Azure Synapse to share table metadata across computational engines,
    namely serverless SQL pools and Spark pools, hugely simplifies data engineering
    tasks. The principle of cataloging data once and using it multiple times also
    establishes strong master data management strategies.


    # Data cataloging and sharing services in Microsoft Azure


    Data catalogs and data sharing services are redefining the data distribution strategies
    of modern organizations. Data catalogs represent the trusted view of the data
    deemed worthy of consumption by internal and external users. Couple this with
    an easy and secure method of sharing data, and you are well on your way to providing
    your user base with a self-serve analytics platform.


    # Azure Purview


    **Azure Purview** is a fully managed service that’s used to discover, catalog,
    and consume data in a unified fashion. Azure Purview helps producers define a
    single source of truth for data that consumers may use in their downstream processes.
    It is important to understand that once the data source has been registered, only
    the metadata is stored in the data catalog; the actual data says in its original
    location. Azure Purview does not give you access to the data itself; it simply
    helps users discover data sources and their related information so that users
    can gauge their utility for their own use.


    > **Important Note**

    > Azure Purview also supports features such as data classification and end-to-end
    data lineage, which are extremely critical for data governance purposes.


    Azure Purview uses a data source registration tool to extract the following metadata
    information:


    +   - Details of the data source''s location.

    +   - Schema; that is, the structure of the table.

    +   - Data profile (object and columns); that is, the number of rows, whether
    it contains null values, the size of the table, and the last updated timestamps.


    In addition to the discovered metadata, users can add their own metadata manually.'
  merge: -1
  img_proc: true
- pgno: 96
  md: 'Azure Purview supports a variety of data sources, including Azure Blob, Azure
    Synapse, Hive, MySQL, Oracle, and many more.


    # Azure Data Share


    In Chapter 1, The Story of Data Engineering and Analytics, we had a section called
    The monetary power of data. In that section, we talked about modern methods of
    revenue diversification, including data monetization through sharing data. An
    organization can realize this dream by using Azure Data Share. Azure Data Share
    facilitates securely sharing data to other parties, including customers and partners.
    Traditionally, data sharing securely using mediums such as SFTP or APIs has been
    very expensive.


    Using Azure Data Share, organizations can add datasets and invite customers/partners
