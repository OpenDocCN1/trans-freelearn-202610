  md: 'From here onwards, I will simply ask you to run the instructions with the assumption
    that you know how to create new cells and run commands. Invoke the following instructions
    to write the store_orders delta table:


    ```

    SCRATCH_LAYER_NAMESPACE="scratch"

    DELTA_TABLE_WRITE_PATH="wasbs://"+SCRATCH_LAYER_NAMESPACE+"@"+STORAGE_ACCOUNT+".blob.core.windows.net/"+STORE_SALES_FOLDER+"/"+TABLE

    PARTITION_COLUMN="currency"

    df_read_data_hour1.write.format("delta").option("path", DELTA_TABLE_WRITE_PATH).partitionBy(PARTITION_COLUMN).saveAsTable(TABLE)

    ```


    Note the use of format=delta. Delta Lake uses versioned Parquet files to store
    data. Using the partitionBy clause, we are asking data to be written in folders
    partitioned by the currency column.


    Also, we are asking the table to be saved as store_orders in the Delta Lake metastore.


    > **Important Note**

    > All Databricks deployments include a built-in Hive metastore to persist table
    definitions.


