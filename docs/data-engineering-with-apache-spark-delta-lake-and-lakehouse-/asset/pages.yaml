    # Data governance


    I started this book by stating "Every byte of data has a story to tell. The real
    question is whether the story is being narrated accurately, securely, and efficiently."
    While organizations are busy harnessing the true power of data, data governance
    and security frequently get neglected. But it cannot be neglected for too long.
    Regulations such as GDPR and many others are enforcing legal accountability and
    strict penalties on organizations failing to meet governance policies related
    to data privacy, retention, and portability.


    An effective path to data governance often starts with an effective method for
    data discovery, classification, and tracking lineage. This can be a daunting task,
    considering the vast variety, volumes, and velocity of data. Azure Purview is
    a new, unified governance service that automates tasks such as discovery, classification,
    and lineage.'
