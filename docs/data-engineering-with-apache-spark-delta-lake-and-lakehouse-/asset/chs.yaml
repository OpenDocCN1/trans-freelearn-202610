  \      pool:\n        vmImage: ubuntu-latest\n      steps:\n        - task: AzureKeyVault@1\n\
  \          inputs:\n            azureSubscription: '$(SERVICE_CONNECTION)'\n   \
  \         keyVaultName: '$(KEY_VAULT_NAME)'\n            secretsFilter: '*'\n  \
  \      - task: CmdLine@1\n          displayName: Run Sqlcmd\n          inputs:\n\
  \            filename: sqlcmd\n            arguments: '-S $(SYNAPSE_CON_STRING)\
  \ -U $(SQLUSER) -P $(SQLPASSWORD) -i project/aggregation/sql/create_db.sql'\n  \
  \      - task: CmdLine@1\n          displayName: Run Sqlcmd\n          inputs:\n\
  \            filename: sqlcmd\n```\n\n```\narguments: '-S $(SYNAPSE_CON_STRING)\
