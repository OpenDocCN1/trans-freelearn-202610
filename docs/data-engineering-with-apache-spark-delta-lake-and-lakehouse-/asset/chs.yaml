  \n![](img/dae8a2243a3c3cbcd9c56ff3d2217672_457_0.png)\n\n图 12.68 – 创建新的拉取请求\n\n\
  点击创建。\n\n##### 审批 – 评审者\n\n可以通过执行以下步骤完成：\n\n- 1. 评审者会收到新拉取请求的通知（通常通过电子邮件）。评审者可以单独或作为一个组评审更改并添加评论。一旦代码经过评审，请添加新评论，如下所示：\n\
  \n![](img/dae8a2243a3c3cbcd9c56ff3d2217672_458_0.png)\n\n图 12.69 – 评审拉取请求\n\n#####\
  \ 合并 – 团队负责人\n\n可以通过执行以下步骤完成：\n\n- 1. 一旦所有评审者都发表了评论，团队负责人可以拒绝或批准更改。在我们的案例中，我们假设评审过程是积极的。点击批准：\n\
  \n图 12.70 – 批准拉取请求\n\n2. 注意无合并冲突。这意味着新代码已准备好合并：\n\n图 12.71 – 检查合并冲突\n\n##### 部署\
  \ – 自动化\n\n可以通过执行以下步骤完成：\n\n- 1. 从 developer1 分支向主分支合并代码后，YAML 部署文件中的触发器部分会将代码部署到指定环境。点击完成：\n\
  \n![](img/dae8a2243a3c3cbcd9c56ff3d2217672_460_0.png)\n\n图 12.72 – 将 developer1\
  \ 分支合并到主分支\n\n- 2. 合并过程成功后会收到以下确认消息：\n\n![](img/dae8a2243a3c3cbcd9c56ff3d2217672_460_1.png)\n\
  \n图 12.73 – 代码合并确认\n\n\n\n\n\n3. 这些代码合并会自动触发 CI/CD 管道。 通过 Azure DevOps 门户返回 Pipelines。\
  \ 单击 electroniz_code_cicd_pipeline。 现在，单击列表中的最新条目。 您应该会看到有关自动部署的以下确认：\n\n![](img/dae8a2243a3c3cbcd9c56ff3d2217672_461_0.png)\n\
  \n图 12.74 – 自动管道运行的确认\n\n注意自动运行已正确识别、创建并部署了 Lakehouse_Database_Scripts 阶段。\n\n>\
  \ 重要\n> 部署原子代码更改使我们能够更快地发现和修复故障。 CI/CD 促进了一种透明的代码集成和部署方法，已知这种方法可以提高效率并增强客户满意度。\n\
  \n本章就到此为止。 使用前述步骤，我们成功地使用 CI/CD 管道自动化了基础设施创建和代码交付。 我们还学习了如何在团队环境中实施 CI/CD 生命周期。\
  \ 从现在开始，Electroniz 可以安全地依赖这些管道，以最小的努力和风险交付其环境中的未来代码添加和更改。\n\n## Summary\n\n在组织力求以更少资源做更多事情的时代，自动化正迅速获得大量关注。\
  \ 随着 CI/CD 的不断发展和壮大，它正成为现代数据工程师最关键的技能之一。 在大多数情况下，数据工程师的高成本只有在他们的技能组合包含自动化时才有意义。\n\
  \n在许多方面，采用 CI/CD 等自动化实践被证明是救命稻草。 不仅自动化减轻了数据工程师的大量工作负担，而且通过可预测地执行重复迭代来降低成本。 除此之外，CI/CD\
  \ 中内置的审批和快速失败机制可确保团队的责任感和协作性。 如果明智使用，采用自动化可以确保代码和基础设施组件的可预测和无缝交付。\n\n这是本书的最后一章。\
  \ 我必须承认，在过去的 12 章中，我们涵盖了很多内容。 我们踏上了数据之旅——这是一段充满许多曲折的旅程。 我很高兴的是，最终我们成功克服了这些障碍并顺利走向成功。\
  \ 我们的旅程始于收集和存储数据，然后在湖屋的各个层中对数据进行策划和聚合。 我们还学习了如何设计、开发、监控和自动部署数据管道。 在最后，我们通过提供一些建议来涵盖数据工程师面临的一些挑战，说明如何克服这些挑战。\
  \ 但总的来说，最后一切都是值得的。\n\n每一字节的数据都有一个故事要讲，我相信我们准确、安全、高效地讲述了这个故事。\n\n## Packt>\n\nPackt.com\n\
