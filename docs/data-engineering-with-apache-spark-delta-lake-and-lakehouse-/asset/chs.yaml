  ]} |\n\n图 6.21 – sales_orders 表的事务历史\n\n使用上述指令，我们成功创建了一个 delta 表。这是一个良好的开端，但数据会随时间演变。让我们看看如何更改现有\
  \ delta 表中的现有数据。\n\n#### 在现有 Delta Lake 表中更改数据\n\n在上一节中，我们看到了如何将新数据写入 Delta Lake\
  \ 表。但 Delta Lake 中的事务不仅仅涉及新数据 – 我们可能还需要更新和删除数据。在本节中，我们将了解数据湖如何对现有数据的更改做出反应：\n\n\
  - 1. 为了突出对 Delta Lake 表的更改效果，我们将按如下方式使用 store_orders 表中的一个示例行：\n\n```\n%sql\nSELECT\
  \ * FROM store_orders WHERE order_number=5;\n```\n\n这会产生以下输出：\n\n![](img/dae8a2243a3c3cbcd9c56ff3d2217672_200_0.png)\n\
  \n图 6.22 – 检查 sales_orders 表中示例行的数据\n\n- 2. 现在，我们将更新此行并将 sale_price 值从 98.41 更改为\
  \ 90.50：\n\n```\n%sql\nUPDATE store_orders SET sale_price=90.50 WHERE order_number=5;\n\
  ```\n\n- 3. 检查 sale_price 值是否已在 store_orders 表中更新：\n\n```\n%sql\nSELECT * FROM store_orders\
  \ WHERE order_number=5;\n```\n\n这会产生以下输出：\n\n![](img/dae8a2243a3c3cbcd9c56ff3d2217672_200_1.png)\n\
  \n图 6.23 – 检查 sales_orders 表中示例行的数据\n\n4. 调用以下指令检查 store_orders 表的历史记录：\n\n```\n\
  %sql\nDESCRIBE HISTORY store_orders;\n```\n\n这会产生以下输出：\n\n```\n%sql\nDESCRIBE HISTORY\
  \ store_orders;\n```\n\n|  | version | timestamp | userId | userName | operation\
  \ |\n|---|---|---|---|---|---|\n| 1 | 1 | 2021-05-03T23:48:04.000+0000 | 2180935369918818\
  \ |  | UPDATE |\n| 2 | 0 | 2021-05-03T23:46:30.000+0000 | 2180935369918818 |  |\
  \ CREATE TABLE AS SELECT |\n\n图 6.24 – 更新操作后 sales_orders 表的事务历史\n\n注意历史记录如何推进，并且每个事务都被分配一个新版本。版本\
  \ 1 是因为执行了更新语句而创建的（operation=UPDATE）。对表的原子更新导致创建了一个名为 00000000000000000001.json\
  \ 的新事务日志文件。\n\nDelta Lake 的美妙之处在于它会随着时间推移存储数据的先前版本。现在，让我们学习如何使用时间旅行检索先前版本。\n\n####\
  \ 执行时间旅行\n\nDelta Lake 的一个独特功能是其执行时间旅行的能力。通过使用此功能，你可以查询和恢复表的先前快照。通过使用 versionAsOf\
  \ 选项授予对先前快照的访问权限。\n\n> 重要说明\n> Delta Lake 中的时间旅行功能实现了数据血缘。数据血缘是数据审计和合规目的的极其关键的工具。相同的功能对于试图追踪数据异常的数据工程师也非常有用。\n\
  \n- 1. 这就是你如何查询 delta 表的先前版本的方式。在此示例中，我们正在查询表的版本 0 – 也就是说，它被创建时：\n\n```\n%sql\n\
  SELECT * FROM store_orders VERSION AS OF 0 WHERE order_number=5;\n```\n\n这会产生以下输出：\n\
  \n```\n%sql\nSELECT * FROM store_orders VERSION AS OF 0 WHERE order_number=5;\n\
  ```\n\n![](img/dae8a2243a3c3cbcd9c56ff3d2217672_202_0.png)\n\n图 6.25 – 检查 sales_orders\
  \ 表中示例行在版本 0 的数据\n\n请注意，表的先前版本显示 sale_price 值为 98.41。\n\n- 2. 这次我们将从 store_orders\
  \ 表中删除此订单：\n\n```\n%sql\nDELETE FROM store_orders WHERE order_number=5;\nSELECT\
  \ * FROM store_orders WHERE order_number=5;\n```\n\n这会产生以下输出：\n\n```\n1 %sql\n2\
  \ DELETE FROM store_orders WHERE order_number=5;\n3\n4 SELECT * FROM store_orders\
  \ WHERE order_number=5;\n```\n\n(8) Spark Jobs\nQuery returned no results\n\n图 6.26\
  \ – 删除操作后检查 sales_orders 表中的数据\n\n请注意，SELECT 查询返回零结果，表明记录确实已被删除。\n\n- 3. 现在检查 store_orders\
  \ 表的历史记录会很有趣：\n\n```\n%sql\nDESCRIBE HISTORY store_orders;\n```\n\n这会产生以下输出：\n\n\
  ```\n%sql\nDESCRIBE HISTORY store_orders;\n```\n\n| version | timestamp | userid\
  \ | userName | operation |\n| 2 | 2021-05-04T00:07:30.000+0000 | 2180993539918818\
  \ |  | DELETE |\n| 1 | 2021-05-04T00:06:31.000+0000 | 2180993539918818 |  | UPDATE\
  \ |\n| 0 | 2021-05-04T00:06:25.000+0000 | 2180993539918818 |  | CREATE TABLE AS\
  \ SELECT |\n\n图 6.27 – 删除操作后 sales_orders 表的事务历史\n\n请注意，表的版本 2 显示 operation=DELETE。\n\
  \n- 4. 我们可能后来发现删除订单的操作员是无意中删除的。幸运的是，Delta Lake 非常宽容，支持将表恢复到任何先前版本。在以下示例中，我们将时间倒回到版本\
  \ 1 并恢复快照：\n\n```\n%sql\nRESTORE TABLE store_orders TO VERSION AS OF 1;\nSELECT\
  \ * FROM store_orders VERSION AS OF 0 WHERE order_number=5;\n```\n\n这会产生以下输出：\n\n\
  ```\n%sql\nRESTORE TABLE store_orders TO VERSION AS OF 1;\nSELECT * FROM store_orders\
  \ VERSION AS OF 0 WHERE order_number=5;\n```\n\n| order_number | customer_id | product_id\
  \ | order_date | units | sale_price | currency | order_mode | updated_at |\n| 5\
  \ | 409 | 9 | 07/05/2019 | 5 | 98.41 | INR | NEW | 2021-04-28T17:56:11.053+0000\
  \ |\n\n图 6.28 – 恢复操作后检查 sales_orders 表中的数据\n\n- 5. 再次检查 store_orders 表的历史记录现在看起来如何会很有趣：\n\
  \n```\n%sql\nDESCRIBE HISTORY store_orders;\n```\n\n\n\n这导致以下输出：\n\n```\n%sql\n\
  DESCRIBE HISTORY store_orders;\n```\n\n| version | timestamp | userid | userName\
  \ | operation |\n|---|---|---|---|---|\n| 3 | 2021-05-04T15:09:30.000+0000 | 2160993539918818\
  \ |  | RESTORE |\n| 2 | 2021-05-04T15:09:14.000+0000 | 2160993539918818 |  | DELETE\
  \ |\n| 1 | 2021-05-04T15:09:09.000+0000 | 2160993539918818 |  | UPDATE |\n| 0 |\
  \ 2021-05-04T15:09:03.000+0000 | 2160993539918818 |  | CREATE TABLE AS SELECT |\n\
  \n显示全部 4 行。\n\n图 6.29 – 还原操作后 sales_orders 表的交易历史\n\n请注意，表的版本 3 显示 operation=RESTORE，表明表已还原到之前的状态。\n\
  \n在计划的摄取过程中，数据会反复插入和更新。Delta Lake 提供了使用 upserts 在现有表中合并数据的一种便捷方式。\n\n#### 执行数据的\
  \ upsert\n\nDelta Lake 还支持使用 MERGE 子句的 upsert 操作。upsert 的思想很简单，即将现有表中的数据与源产生的新数据合并。在湖仓中，将增量数据摄取并与\
  \ Delta Lake 中预先存在的表合并是很常见的。每次摄取新数据时都会重复 MERGE 过程，并且对于在湖仓的银层中创建数据的单一事实至关重要。\n\n\
  > 重要说明\n> UPSERT 操作是同一操作中的更新和插入的混合。使用 MERGE 子句，如果记录在表中不存在则可以执行插入，或者如果记录已存在则简单地更新现有数据。\n\
  \n- 1. 在开始 MERGE 过程之前，让我们先了解 store_orders 表中当前的行数：\n\n```\n%sql\nSELECT count(*)\
  \ FROM store_orders;\n```\n\n这导致以下输出：\n\n```\n%sql\nSELECT count(*) FROM store_orders;\n\
  ```\n\n图 6.30 – 检查 sales_orders 中的行数\n\n- 2. 现在，我们将读取 electroniz_batch_ingestion_pipeline\
  \ 运行的第二次迭代中增量摄取的数据。例如，当我们在第 5 章《数据收集阶段 – 青铜层》中运行管道时，2021/04/28/19 文件夹结构存储了第二次运行的增量数据。此文件夹包含\
