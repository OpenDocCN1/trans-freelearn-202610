  \n\n\n\n\n## 配置数据目标\n\n一旦批处理和流式摄取管道被调用，它们将从数据源获取数据并将结果转储到数据目标。青铜层的 数据目标是 Azure Data\
  \ Lake Storage Gen2：\n\n+   1. 我们现在将使用 Azure 客户端创建一个 Azure Data Lake Storage 账户。逐行复制以下每个命令，并将其粘贴到\
  \ Cloud Shell 窗口中。然后，按 Enter：\n\n```\nSTORAGEACCOUNTNAME=\"traininglakehouse\"\n\
  RESOURCEGROUPNAME=\"training_rg\"\nLOCATION=\"eastus\"\naz storage account create\
  \ --name $STORAGEACCOUNTNAME --resource-group $RESOURCEGROUPNAME --kind StorageV2\
  \ --location $LOCATION --hns true --sku Standard_LRS --tags owner=data engineering\
  \ project=lakehouse environment=development\n```\n\n如果前面的命令成功，您应该会看到如下输出：\n\n![](img/dae8a2243a3c3cbcd9c56ff3d2217672_137_0.png)\n\
  \n图 5.19 – Data Lake Storage 账户的创建输出\n\n+   2. 您可以通过转到 Azure 门户来确认是否已创建 Azure Data\
  \ Lake Storage 账户。\n\n导航到 Home | All Resources | traininglakehouse：\n\n![](img/dae8a2243a3c3cbcd9c56ff3d2217672_138_0.png)\n\
  \n图 5.20 – Azure 门户上的 Azure Data Lake Storage 账户\n\n3. Azure Data Lake Storage 将以\
  \ blob 的形式存储数据。在 Azure Data Lake Storage 中，blob 组织在文件系统层次结构中。为了启用层次结构，我们需要为青铜层创建一个命名空间。逐行复制以下每个命令，并将其粘贴到\
  \ Cloud Shell 窗口中。然后，按 Enter：\n\n```\nNAMESPACE=\"bronze\"\naz storage fs create\
  \ -n $NAMESPACE --account-name $STORAGEACCOUNTNAME --metadata project=lakehouse\
  \ environment=development layer=bronze --only-show-errors\n```\n\n如果前面的命令成功，您应该会看到如下输出：\n\
  \n![](img/dae8a2243a3c3cbcd9c56ff3d2217672_138_1.png)\n\n图 5.21 – Data Lake Storage\
  \ 命名空间的创建输出\n\n至此，我们已成功为 Electroniz 湖仓的青铜层准备了数据源和数据目标。在下一节中，我们将开始构建摄取管道，该管道将从源获取数据并将其存储到目标中。\n\
  \n### 构建摄取管道\n\n您可能还记得，在之前的章节中我们决定创建两个摄取管道——批处理摄取和流式摄取。这两个管道中的每一个都将使用不同的 Azure 服务集构建。对于批处理摄取，我们将使用\
  \ Azure Data Factory，对于流式摄取，我们将使用 Azure Event Hubs Capture。因此，让我们开始吧，因为我们还有很长的路要走。\n\
  \n### 构建批处理摄取管道\n\n在继续实际创建批处理管道之前，让我提醒您 Electroniz 湖仓的一个关键要求。之前，Electroniz 表示销售数据库和在线商店中的交易在一天中非常频繁地发生。他们希望湖仓能够在最多\
  \ 1 小时的延迟内保持最新数据。\n\n为了满足这一要求，我们需要使用水印方法来构建管道。简单来说，水印是一个可以用来标识上一次摄取运行中已摄取数据的最后一点的列。通常，水印列的选择是在自增键列或时间戳列之间：\n\
  \n![](img/dae8a2243a3c3cbcd9c56ff3d2217672_139_0.png)\n\n图 5.22 – 水印在每次摄取运行时更新\n\
  \n批处理管道需要以能够加载旧水印和新水印之间更改数据的方式创建。在每次摄取运行时，将创建一个新的水印，该水印将用作下一次运行的标记：\n\n![](img/dae8a2243a3c3cbcd9c56ff3d2217672_140_0.png)\n\
  \n图 5.23 – 用于增量数据摄取的水印方法\n\n考虑到增量摄取方法，让我们开始构建批处理摄取管道：\n\n+   1. 我们将从创建 Azure 数据工厂开始。浏览到\
  \ Azure 门户上的 Home。使用屏幕顶部的搜索框，搜索数据工厂。单击服务下的 Data factories：\n\n![](img/dae8a2243a3c3cbcd9c56ff3d2217672_140_1.png)\n\
  \n图 5.24 – 在 Azure 门户上搜索 Data Factory 服务\n\n+   2. 单击 Create data factory 按钮并输入以下内容：\n\
