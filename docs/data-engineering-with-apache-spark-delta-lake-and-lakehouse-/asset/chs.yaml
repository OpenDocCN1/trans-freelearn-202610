  \n#### Creating a Delta Lake table\n\n环境设置完成后，我们准备好了解 Delta Lake 的工作原理。在我们的 Spark\
  \ 会话中，我们有一个 Spark DataFrame，其中存储了在 electroniz_batch_ingestion_pipeline 第一次运行时摄取的\
  \ store_orders 表的数据：\n\n> Important Note\n> A Spark DataFrame is an immutable distributed\
  \ collection of data. It contains rows and columns like a table in a relational\
  \ database.\n\n+   1. 此时，您应该能够舒适地在笔记本单元中运行指令。可以使用 Ctrl + Alt + N 创建新单元。每次命令后，您需要按\
  \ Shift + Enter 运行命令。\n\n从这里开始，我将简单地要求您运行指令，假设您知道如何创建新单元并运行命令。调用以下指令来写入 store_orders\
  \ delta 表：\n\n```\nSCRATCH_LAYER_NAMESPACE=\"scratch\"\nDELTA_TABLE_WRITE_PATH=\"\
  wasbs://\"+SCRATCH_LAYER_NAMESPACE+\"@\"+STORAGE_ACCOUNT+\".blob.core.windows.net/\"\
  +STORE_SALES_FOLDER+\"/\"+TABLE\nPARTITION_COLUMN=\"currency\"\ndf_read_data_hour1.write.format(\"\
  delta\").option(\"path\", DELTA_TABLE_WRITE_PATH).partitionBy(PARTITION_COLUMN).saveAsTable(TABLE)\n\
  ```\n\n注意使用 format=delta。Delta Lake 使用版本化的 Parquet 文件来存储数据。使用 partitionBy 子句，我们要求数据按\
  \ currency 列分区写入文件夹。\n\n此外，我们要求表以 store_orders 的名称保存在 Delta Lake 元存储中。\n\n> **Important\
  \ Note**\n> All Databricks deployments include a built-in Hive metastore to persist\
  \ table definitions.\n\n2. 要检查 Delta Lake 表是否已写入存储，请点击以下内容：\n\n**Home > All Resources\
  \ > traininglakehouse > scratch > sales > store_orders**\n\n表的目录结构应如下所示：\n\n![](img/dae8a2243a3c3cbcd9c56ff3d2217672_195_0.png)\n\
  \nFigure 6.15 – Checking the sales_orders table folder structure using the Azure\
  \ portal\n\n3. 或者，您也可以直接从笔记本本身调用以下命令来查看目录结构：\n\n```\ndisplay(dbutils.fs.ls(DELTA_TABLE_WRITE_PATH))\n\
  ```\n\n这会产生以下输出：\n\n![](img/dae8a2243a3c3cbcd9c56ff3d2217672_196_0.png)\n\nFigure\
  \ 6.16 – Checking the sales_orders table folder structure using the notebook\n\n\
  在前面的输出中，请注意以下几个关键项目：\n\n+   - _delta_log 文件夹被称为 Delta Lake 事务日志（DeltaLog）。DeltaLog\
  \ 是存储和跟踪表上发生的每个事务的中央存储库。通过在发布任何新更改之前每次检查事务日志，Delta Lake 可以确保用户会话中的数据与存储的数据之间的一致性。\n\
  +   - DeltaLog 使用的原则是 如果事务不存在于日志中，您可以假设它从未发生过。使用此原则可以确保原子性。\n+   - 仅在 DeltaLog 中注册成功的事务可在数据中建立信任级别。成功的事务以\
  \ Parquet 文件的形式持久化在存储中以确保耐用性。\n+   - Delta Lake 以串行且相互隔离的方式执行并发事务。\n\n实际数据已按 currency\
  \ 列分区写入存储。column=key 是 Hive 分区约定，将文件夹与分区相关联。\n\n\n\n\n\n**重要说明**\n在 Hive 中，分区列不会存储在数据文件中。相反，它作为一个虚拟列存在，在运行时使用文件夹结构进行解析。分区列的正确选择可以极大地提升查询性能。\n\
  \n- 1. 返回 Azure 门户并点击 _delta_log 文件夹。点击 00000000000000000000.json，然后点击 **编辑。**\n\
  \nDelta Lake 将已提交的事务写入以 00000000000000000000.json 开头的 **JSON** 文件。请注意 operation=CREATE\
  \ TABLE AS SELECT。第一次事务在我们写入 store_orders 表时被写入到事务日志中。在 bronze 层，store_orders 文件中有\
  \ 2,500 条记录。请注意，对于具有相同值的各个分区，numrecords 如何变化。\n\n![](img/dae8a2243a3c3cbcd9c56ff3d2217672_197_0.png)\n\
  \n图 6.17 – sales_orders 表的事务日志\n\n- 2. 进一步深入文件夹结构。浏览至 **scratch > sales > store_orders\
  \ > currency=EURO:**\n\n![](img/dae8a2243a3c3cbcd9c56ff3d2217672_197_1.png)\n\n\
