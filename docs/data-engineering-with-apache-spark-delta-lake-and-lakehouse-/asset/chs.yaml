  \n图 9.10 – 主管道手动运行的状态\n\n在之前的管道运行期间，Electroniz lakehouse 的所有层，即 bronze、silver 和\
  \ gold 都已填充。在一次运行中，最新数据从源中摄取，合并到 silver 层（Delta Lake），最后在 gold 层中进行聚合。\n\n让我提醒你，在项目的发现阶段，Electroniz\
  \ 曾表达希望在 lakehouse 中实现接近实时的数据摄取，最大延迟为 1 小时。这意味着我们应该按每小时的计划运行主管道。让我们接下来弄清楚如何实现这一点。\n\
  \n### 调度主管道\n\n要在给定时间自动执行管道，需要在 Azure 数据工厂中创建触发器。让我们了解如何操作：\n\n- 1. 使用左侧面板，点击 Manage。然后，点击\
