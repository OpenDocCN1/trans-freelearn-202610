  \ 工作区中，点击 **Workspace**。然后，点击 **Users**。\n  - 点击你用户名旁边的箭头并点击 **Import**。\n  - 选择\
  \ **URL**。\n  - 使用以下 URL：https://github.com/PacktPublishing/Data-Engineering-with-Apache-Spark-Delta-Lake-and-Lakehouse/blob/main/project/curation/delta_lake/curation_verification_notebook.ipynb。\n\
  \  - 点击 **Import**。\n- 3. 在下面的各节中，我将引用 curation notebook (`electroniz_curation_notebook.ipynb`)\
  \ 中嵌入的某些代码块（PySpark 代码）。\n\n### 验证未标准化数据\n\n在检查阶段，我们发现 `store_orders` 数据有一个名为 `order_date`\
  \ 的列，其格式使用 MM/DD/YYYY。在标题为 **Curate Sales Data - standardize, mask and merge** 的单元格中，注意以下将\
  \ `order_date` 转换为标准日期字段的代码：\n\n```\nORDERS_SCHEMA_1 = [('order_number', IntegerType()),\
  \ ('customer_id', IntegerType()), ('product_id', IntegerType()), ('order_date',\
  \ DateType()), ('units', IntegerType()), ('sale_price', FloatType()), ('currency',\
  \ StringType()), ('order_mode', StringType()), ('sale_price_usd', FloatType()),\
  \ ('updated_at', TimestampType()) ]\nfields = [StructField(f) for field in ORDERS_SCHEMA_1]\n\
  schema_stores = StructType(fields)\ndf_table_incremental = spark.read.csv(bronze_table_path,\
  \ schema=schema_stores )\n\ndf_currency=spark.sql('SELECT currency_name AS currency,\
  \ currency_value from currency')\n\ndf_table_curated = df_table_incremental.join(df_currency,\
  \ on=['currency'])\ndf_table_curated = df_table_curated.withColumn('sale_price_usd',curate_sales_price_udf('currency_value',\
  \ 'sale_price'))\ndf_table_curated=df_table_curated.withColumn('updated_at', f.lit(UPDATE))\n\
  df_table_curated = df_table_curated.withColumn('order_date_new', to_date(df_table_curated.order_date,\
  \ 'MM/dd/yyyy')).drop('order_date').withColumnRenamed('order_date_new', 'order_date')\n\
  df_table_curated = df_table_curated.drop('currency_value')\n```\n\n图 7.37 – 在 store_orders\
  \ 中标准化 order_date 的代码\n\n注意 order_date 值已被转换为 Parquet 原生日期类型 YYYY-MM-DD：\n\n####\
  \ 验证 Store Orders 中的未标准化数据\n\n```\n%sql\nSELECT order_date FROM store_orders;\n\
  ```\n\nSpark Jobs\n\n|  | order_date |\n|---|------------|\n| 1 | 2017-05-12 |\n\
  | 2 | 2020-08-14 |\n| 3 | 2021-02-26 |\n| 4 | 2019-12-21 |\n| 5 | 2019-07-12 |\n\
  | 6 | 2019-06-29 |\n| 7 | 2020-06-12 |\n\n图 7.38 – 标准化后在 store_orders 中验证 order_date\n\
  \n我们还发现电子商务交易有一个 order_date 列，其格式使用 DD/MM/YYYY。在标题为 Curate Sales Data - standardize,\
  \ mask and merge 的单元格中，注意以下解决此问题的代码：\n\n```\ndeltaTable = DeltaTable.forPath(spark,\
  \ ecomm_path)\nbronze_ecomm_path=\"wasbs://\"+BRONZE_LAYER_NAMESPACE+\"@\"+STORAGE_ACCOUNT+\"\
  .blob.core.windows.net/\"+ECOMM_FOLDER+\"/\"+ADLS_FOLDER+\"/\"\ntry:\n  df_ecomm=spark.read.format(\"\
  avro\").load(bronze_ecomm_path)\n  df_ecomm_json = df_ecomm.select(df_ecomm.Body.cast(\"\
  string\")).rdd.map(lambda x: x[0])\n  df_ecomm_data = spark.read.json(df_ecomm_json.select('data'))\n\
  \  df_data_values = df_ecomm_data.select('data.customer_name','data.address','data.city','data.country','data.currency','data','data.order_date','data.order_mode','data.order_number','data.phone','data.postalcode')\n\
  \  df_data_values = df_data_values.withColumn('updated_at', f.lit(UPDATED))\n  df_data_values\
  \ = df_data_values.withColumn('phone_masked',mask_udf('phone')).drop('phone').withColumnRenamed('phone_masked','phone')\n\
  \  df_data_values = df_data_values.withColumn('address_masked',mask_udf('address')).drop('address').withColumnRenamed('address_masked','address')\n\
  \  df_data_values = df_data_values.withColumn('order_date', from_unixtime(unix_timestamp('order_date','dd/MM/yyyy')))\n\
  \  df_data_values = df_data_values.withColumn('order_date_new', to_date(df_data_values.order_date,'yyyy-MM-dd\
  \ HH:mm:ss')).drop('order_date').withColumnRenamed('order_date_new','order_date')\n\
  ```\n\n图 7.39 – 在电子商务交易中标准化 order_date 的代码\n\n同样，order_date 值已被转换为 Parquet 原生日期类型\
  \ YYYY-MM-DD：\n\n#### 验证 ecommerce Orders 中的未标准化数据\n\n```\n%sql\nSELECT order_date\
  \ FROM esalesns;\n```\n\nSpark Jobs\n\n|  | order_date |\n|---|------------|\n|\
  \ 1 | 2021-05-18 |\n| 2 | 2021-05-18 |\n| 3 | 2021-05-18 |\n\n图 7.40 – 标准化后在电子商务交易中验证\
  \ order_date\n\n此外，我们发现 store_customers 数据有一个名为 email 的列，其中包含大小写混合的字符。在标题为 Define\
  \ functions 的单元格中，注意用于 curation emails 的 PySpark 函数：\n\n```\ndef curate_email(email):\n\
  \    curated_value = email.lower()\n    return curated_value\n```\n\n###### 重要说明\n\
  \n根据最佳实践，强烈建议为每种特定的 curation 算法添加一个模块化函数。拥有模块化函数可以促进代码重用。\n\n在标题为 Curate Currency\
  \ Data - standardize, mask and merge 的单元格中，注意以下 curation emails 的代码：\n\n```\nif\
  \ table==\"store_customers\":\n    df_table_incremental = spark.read.csv(bronze_table_path,\
  \ schema=schema_stores)\n    df_table_curated = df_table_incremental.withColumn('email_curated',curate_email_udf('email')).drop('email').withColumnRenamed('email_curated',\
  \ 'email')\n    df_table_curated = df_table_curated.withColumn('country_curated',curate_country_udf('country')).drop('country').withColumnRenamed('country_curated',\
