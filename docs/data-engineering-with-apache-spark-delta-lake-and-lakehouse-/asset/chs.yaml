  \nFigure 6.39 – Transaction history of the sales_orders table after the merge operation\
  \ of the third iteration Notice that version 5 of the store_orders table also shows\
  \ the operation=MERGE.\n\nNow that we understand upserts, we will deep dive into\
  \ other important features of Delta Lake.\n\n## Understanding isolation levels\n\
  \nIn Delta Lake, the isolation level of a table defines the degree to which the\
  \ transaction must be isolated from modifications that are being made by concurrent\
  \ transactions. There are two isolation levels, as follows:\n\n- The Serializable\
  \ isolation level is strong, which means the write and read operations exist in\
  \ a serial sequence.\n- The WriteSerializable isolation level is the default. In\
  \ this isolation level, only the write operations exist in a serial sequence.\n\n\
  We will check them out as follows:\n\n- 1. The isolation level can be queried for\
  \ every transaction in history:\n\n```\n%sql\nSELECT version, operation, isolationLevel\n\
  from (DESCRIBE HISTORY store_orders);\n```\n\nThis results in the following output:\n\
  \n![](img/dae8a2243a3c3cbcd9c56ff3d2217672_211_0.png)\n\nFigure 6.40 – Transaction\
  \ history isolationLevel\n\n- 2. Although the default isolation level for delta\
  \ tables is WriteSerializable, it can be changed as desired. We can alter the isolation\
  \ of the store_orders table to the Serializable isolation level:\n\n```\n%sql\n\
  ALTER TABLE store_orders SET TBLPROPERTIES ('delta.isolationLevel' = 'Serializable')\n\
  ```\n\nThis results in the following output:\n\n```\n%sql\nALTER TABLE store_orders\
  \ SET TBLPROPERTIES ('delta.isolationLevel' = 'Serializable')\n```\n\n(4) Spark\
  \ Jobs\nOK\n\nFigure 6.41 – Changing the isolation level of the store_orders table\n\
  \n- 3. From here onwards, all transactions on the store_orders table will use isolationLevel=Serializable.\
  \ We are going to update a row in the table to check if the isolation was appropriately\
  \ altered:\n\n```\n%sql\nUPDATE store_orders SET sale_price=100.00 WHERE order_number=500;\n\
  ```\n\n- 4. Now, check the isolation level for the latest transaction in history:\n\
  \n```\n%sql\nSELECT version, operation, isolationLevel\nfrom (DESCRIBE HISTORY store_orders);\n\
  ```\n\nThis results in the following output:\n\n```\n%sql\nSELECT version, operation,\
  \ isolationLevel\nfrom (DESCRIBE HISTORY store_orders);\n```\n\n(2) Spark Jobs\n\
  \n|  | version | operation | isolationLevel |\n|---|---|---|---|\n| 1 | 7 | UPDATE\
  \ | Serializable |\n| 2 | 6 | SET TBLPROPERTIES | SnapshotIsolation |\n| 3 | 5 |\
  \ MERGE | WriteSerializable |\n| 4 | 4 | MERGE | WriteSerializable |\n| 5 | 3 |\
  \ RESTORE | Serializable |\n| 6 | 2 | DELETE | WriteSerializable |\n| 7 | 1 | UPDATE\
  \ | WriteSerializable |\nShowing all 8 rows.\n\nFigure 6.42 – Transaction history\
  \ isolationLevel after the override\n\nNotice that the latest transaction was performed\
  \ using the Serializable isolation level. We will now check out what concurrency\
  \ control is all about.\n\n> **Important Note**\n> The Serializable isolation level\
  \ offers strong consistency, whereas WriteSerializable offers the correct balance\
  \ of availability and consistency of data.\n\n## Understanding concurrency control\n\
  \nBy now, hopefully, we have a good understanding of ACID compliance in a Delta\
  \ Lake using the transaction log. Up until now, all operations during this exercise\
  \ were performed using the same user. However, in a real case scenario, you can\
  \ have multiple users trying to read and write to the same delta table at the same\
  \ time. This is how concurrency controls are implemented in Delta Lake.\n\n![](img/dae8a2243a3c3cbcd9c56ff3d2217672_213_0.png)\n\
  \nFigure 6.43 – Concurrency control in Delta Lake\n\nThis is better represented\
  \ as follows:\n\n- Assume User 1 and User 2 perform a write operation to a delta\
  \ table at the same time.\n- Delta Lake records the version of the table before\
  \ any change has been made to the delta table.\n- The write from User 1 commits\
  \ successfully, and a success message is sent back.\n- The write from User 2 does\
  \ not fail. Instead, Delta Lake tries to silently resolve conflicts from User 2's\
  \ transaction against the previously committed data. If no conflicts are discovered,\
  \ the transactions are committed, else an error message is sent back to User 2.\n\
  \nThis type of concurrency control is also known as **optimistic concurrency control**.\
  \ Now that we are done with most of the work here, we will go ahead and clean up\
