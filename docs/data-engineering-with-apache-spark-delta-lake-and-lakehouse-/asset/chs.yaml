  - Resource group: training_rg\n- Storage accounts: <Consumers Storage Account>\n\
  \n消费者可以自由选择其订阅中的任何存储帐户来接收共享数据。\n\n- Path: goldshared:\n\n![](img/dae8a2243a3c3cbcd9c56ff3d2217672_368_0.png)\n\
