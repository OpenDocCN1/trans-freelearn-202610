  \ 部分\n\n2. 使用左侧菜单，点击 Data。现在，继续点击 Database 旁边的箭头，然后 gold (SQL) 和 External Tables。\n\
  \n你现在应该看到以下窗格：\n\n![](img/dae8a2243a3c3cbcd9c56ff3d2217672_289_1.png)\n\n图 8.32\
  \ – Synapse 无服务器 SQL 池中的银层外部表\n\n3. 同样，以下外部表和视图代表了湖仓金层中的聚合数据：\n\n图 8.33 – Synapse\
