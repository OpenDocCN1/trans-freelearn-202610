  \n图 9.9 – 将 Electroniz 摄取、整理和聚合管道链接在一起\n\nelectroniz_master_pipeline 管道的开发现已完成。接下来，我们将进行管道的单元测试。\n\
  \n\n\n\n\n## 测试主管道\n\n现在主管道的开发已经完成，我们应该验证管道是否能够成功运行。让我们手动调用它并检查运行结果：\n\n- 1. 连接到\
