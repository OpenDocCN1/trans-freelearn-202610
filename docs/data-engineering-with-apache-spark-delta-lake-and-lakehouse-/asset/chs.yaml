  \ 中生成访问令牌\n\n现在我们已经创建了所需的 Azure 资源，可以继续创建 curation 管道。\n\n### 创建银层的管道\n\n执行以下步骤以创建银层的管道：\n\
  \n- 1. 使用 Azure 门户，连接到 **Home > All Resources > traininglakehousedf**。在 **Open Azure\
  \ Data Factory Studio** 下点击 **Open**。这将打开一个新的 Azure Data Factory 工作区窗口。\n- 2. 导航到\
  \ Azure Data Factory 工作区窗口。使用左侧面板，点击 **Author** 上的菜单。在 **Factory Resources** 面板中，点击\
  \ **Pipelines** 右侧的 **三个点** 并选择 **New Pipeline**。\n  \n  在 **Properties** 面板中，输入以下内容：\n\
  \  - Name: `electroniz_curation_pipeline`。\n  - Description: `This pipeline will\
  \ curate data for the sales database, currency conversion, geo-location, and e-commerce\
  \ website tracking logs by fetching from the bronze layer and saving it in the silver\
  \ layer.`\n- 3. 现在，点击 **activities** 部分的空白区域。在下方面板中，在 **Parameters** 下创建以下参数：\n\n\
