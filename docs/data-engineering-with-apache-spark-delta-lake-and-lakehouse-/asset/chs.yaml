  \n```\n\n```\nLOGSCONTAINER=\"ecommercelogs\"\n```\n\n```\nRESOURCEGROUPNAME=\"\
  training_rg\"\n```\n\n```\nLOCATION=\"eastus\"\n```\n\n```\nKEY=`az storage account\
  \ keys list -g $RESOURCEGROUPNAME -n $LOGSTORAGEACCOUNTNAME | jq .[0].value`\n```\n\
  \n```\naz storage container create -n $LOGSCONTAINER --account-name $LOGSTORAGEACCOUNTNAME\
  \ --account-key $KEY\n```\n\n```\naz storage blob upload --container-name $LOGSCONTAINER\
  \ --account-name $LOGSTORAGEACCOUNTNAME --name electroniz_access_log_2.json --file\
  \ ~/Data-Engineering-with-Apache-Spark-Delta-Lake-and-Lakehouse/project/prep/ecommerce_logs/electroniz_access_log_2.log\
  \ --account-key $KEY\n```\n\n4. 返回 Azure Data Factory 并等待当前小时结束。在下一次迭代中，管道将仅从销售数据库中提取增量数据。当下一个小时到来时，使用以下命令重新运行管道：\n\
  \n```\nPIPELINENAME=\"electroniz_batch_ingestion_pipeline\"\nDATAFACTORYNAME=\"\
  trainingdatafactory100\"\nRESOURCEGROUPNAME=\"training_rg\"\naz datafactory pipeline\
  \ create-run --factory-name $DATAFACTORYNAME --name $PIPELINENAME --resource-group\
