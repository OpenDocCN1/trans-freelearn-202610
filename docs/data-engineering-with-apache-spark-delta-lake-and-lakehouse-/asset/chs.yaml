  Table schema:\nroot\n-- inventory_date: string (nullable = true)\n-- product: string\
  \ (nullable = true)\n-- inventory: integer (nullable = true)\n\nData schema:\nroot\n\
  -- inventory_date: string (nullable = true)\n-- product: string (nullable = true)\n\
  -- inventory: integer (nullable = true)\n-- warehouse: string (nullable = true)\n\
  ```\n\nFigure 10.17 – Schema mismatch between the 2021-04-18 and 2021-04-19 inventory\
  \ files\n\nThis is the expected behavior. The Delta table has correctly detected\
  \ a schema mismatch between the incoming data and the pre-existing Delta table.\
  \ By default, Delta Lake will throw an exception if such a mismatch is detected.\
  \ The real question is how to deal with such a situation.\n\n11. Now, run Cmd10\
  \ and Cmd11. Notice that a new option has been added in the merge command. mode=append\
  \ overrides the default behavior and instructs Delta Lake to proceed with the data\
  \ merge by adjusting the schema:\n\n```\ndf_read_inventory2.write.format(\"delta\"\
  ).mode(\"append\").option(\"mergeSchema\", \"true\").save(DELTA_TABLE_WRITE_PATH)\n\
  ```\n\n```\n%sql\nDESCRIBE inventory;\n```\n\n|  | col_name | data_type | comment\
  \ |\n|---|---|---|---|\n| 1 | inventory_date | string |  |\n| 2 | product | string\
  \ |  |\n| 3 | inventory | int |  |\n| 4 | warehouse | string |  |\n| 5 |  |  | \
  \ |\n| 6 | # Partitioning |  |  |\n| 7 | Not partitioned |  |  |\nShowing all 7\
  \ rows.\n\nFigure 10.18 – Creating the inventory Delta table using the 2021-04-19\
  \ file using mode=append\n\nNotice that this time, an exception was not raised.\
  \ Instead, Delta Lake calmly adjusted the schema of the pre-existing table by adding\
  \ a new column to it.\n\n> **Important**\n> The decision to either raise an exception\
  \ or use mode=append in the Delta table's merge commands should be discussed and\
  \ agreed upon with the customer.\n\n12. Run Cmd12. Note how Delta Lake has adjusted\
  \ the data after merging the data and schema. All data before Day 2=2021-04-19 has\
  \ been marked as NULL because the new column warehouse did not exist before:\n\n\
  ```\nCmd 12\n1   %sql\n2   SELECT * FROM inventory;\n```\n\n(2) Spark Jobs\n\n![](img/dae8a2243a3c3cbcd9c56ff3d2217672_352_0.png)\n\
  \nFigure 10.19 – Checking the data in the inventory Delta table\n\nNow, let's see\
  \ what happens when we try to merge the Day 3=2021-04-20 inventory file with the\
  \ inventory table. You may recall that on this day, a new column (city) was added\
  \ but a previous column was deleted (warehouse).\n\nRun Cmd13. These instructions\
  \ will create a Spark DataFrame named df_read_inventory3 using the Day 3=2021-04-20\
  \ inventory file:\n\n```\nBRONZE_TABLE_PATH=\"wasbs://\"+BRONZE_LAYER_NAMESPACE+\"\
  @\"+STORAGE_ACCOUNT+\".blob.core.windows.net/\"+INVENTORY_FOLDER\ndf_read_inventory3\
  \ = spark.read.csv(BRONZE_TABLE_PATH, header='True', inferSchema='True')\ndisplay(df_read_inventory3)\n\
  ```\n\n(3) Spark Jobs\n\ndf_read_inventory3: pyspark.sql.dataframe.DataFrame = [inventory_date:\
  \ string, product: string ...]\n\n| inventory_date | product | inventory | city\
  \ |\n|---|---|---|---|\n| 1 | 2021-04-20 | Watch | 100 | Phoenix |\n| 2 | 2021-04-20\
  \ | Vacuum | 500 | New York |\n| 3 | 2021-04-20 | Airconditioner | 45 | Dallas |\n\
  | 4 | 2021-04-20 | Microwave | 34 | New York |\n| 5 | 2021-04-20 | DVD | 6789 |\
  \ Dallas |\n| 6 | 2021-04-20 | TV | 43 | New York |\n| 7 | 2021-04-20 | Keyboard\
  \ | 564 | New York |\nShowing all 11 rows.\n\nFigure 10.20 – Reading the 2021-04-20\
  \ inventory file\n\n13. Run Cmd14. This instruction will try to merge df_read_inventory3\
  \ in the existing inventory Delta table.\n\nRun Cmd15. Notice how Delta Lake was\
  \ able to adjust the schema once again. Even though the warehouse column was deleted\
  \ in the incoming file, it remains in the Delta table:\n\n```\ndf_read_inventory3.write.format(\"\
  delta\").mode(\"append\").option(\"mergeSchema\", \"true\").save(DELTA_TABLE_WRITE_PATH)\n\
  ```\n\n(4) Spark Jobs\n\nCommand took 3.66 seconds -- by datauniversity.ca@gmail.com\
  \ at 2021-07-12, 9:43:51 p.m. on curationcluster\n\n```\n%sql\nDESCRIBE inventory;\n\
  ```\n\n| col_name | data_type | comment |\n|---|---|---|\n| 1 | inventory_date |\
  \ string |  |\n| 2 | product | string |  |\n| 3 | inventory | int |  |\n| 4 | warehouse\
  \ | string |  |\n| 5 | city | string |  |\n| 6 |  |  |  |\n| 7 | # Partitioning\
  \ |  |  |\nShowing all 8 rows.\n\nFigure 10.21 – Creating the inventory Delta table\
  \ using the 2021-04-20 file using mode=append\n\n14. Run Cmd16:\n\n```\n%sql\nSELECT\
  \ * FROM inventory;\n```\n\n![](img/dae8a2243a3c3cbcd9c56ff3d2217672_354_0.png)\n\
  \nFigure 10.22 – Checking the data in the inventory Delta table\n\nThis time, after\
  \ merging data from Day 3=2021-04-20, the warehouse column gets defaulted to NULL,\
  \ and the new city column has been added to the inventory table.\n\nWith that, you've\
  \ seen how Delta Lake can transparently adjust the data and schema each time a schema\
  \ change is detected. Hopefully, this example was able to effectively highlight\
  \ how schema evolution can be managed in modern data engineering pipelines. We will\
  \ now look at sharing data. This is quickly becoming a necessity for organizations\
  \ who are wanting to harness the power of data in monetary terms.\n\n##### Sharing\
  \ data\n\nIn Chapter 1, The Story of Data Engineering and Analytics, we discussed\
  \ the power of data. This has enabled organizations to realize revenue diversification\
  \ using data monetization. But this dream cannot be effectively realized without\
  \ sharing data with external parties. In the past, organizations used several data-sharing\
  \ mechanisms such as emails, SFTP, APIs, cloud storage, and hard drives:\n\n\n\n\
  ![](img/dae8a2243a3c3cbcd9c56ff3d2217672_355_0.png)\n\nFigure 10.23 – State of data\
  \ sharing currently\n\n不幸的是，这些数据共享方法存在若干问题：\n\n- **Complex**: 这些数据共享机制设置和使用起来可能很复杂，因为它们可能需要交换密钥/密码并使用多种不同的工具。\n\
  - **Insecure**: 这些机制可能不安全，无法保护静态数据或传输中数据的安全。这意味着经典的 **man-in-the-middle** 攻击可能会以明文形式泄露数据。\n\
  - **Tracking**: 目前没有有效的方法来追踪谁与谁共享了数据以及使用的是哪种机制。\n- **Control**: 你无法控制共享数据的使用者。\n\
  - **Updates**: 数据共享是一个持续的过程，而前面提到的机制并不能提供简单的方式来共享更新。\n\n幸运的是，有一种有效的替代方案。Azure 允许组织使用名为\
  \ **Azure Data Share** 的简单且安全的服务在内部和外部共享数据。使用 Azure Data Share，共享数据的用户（**providers**）可以轻松邀请他们希望共享数据的用户（**consumers**）。在数据与消费者共享之前，他们需要接受数据使用条款。数据更新也可以按照提供方配置的设定频率进行共享。数据共享可以以两种方式进行。我们将在以下小节中分别介绍这两种方式。\n\
  \n##### In-place sharing\n\n在这种情况下，数据始终保留在提供方的 Azure 订阅中，并向消费者的 Azure 订阅发送一个符号链接。消费者可以使用此符号链接读取数据，如下所示：\n\
  \n![](img/dae8a2243a3c3cbcd9c56ff3d2217672_356_0.png)\n\nFigure 10.24 – In-place\
  \ sharing using Azure Data Share\n\n##### Snapshot sharing\n\n在这种情况下，数据从数据提供方的 Azure\
  \ 订阅移动并落地到数据消费方的 Azure 订阅中：\n\n![](img/dae8a2243a3c3cbcd9c56ff3d2217672_356_1.png)\n\
  \nFigure 10.25 - Snapshot sharing using Azure Data Share\n\n让我们通过一个简单的练习来了解更多关于共享数据的信息。对于此练习，你需要一位共享伙伴来充当消费者。你的伙伴应拥有一个可操作的\
  \ Azure 账户。如果没有，他们可以创建一个新的。\n\n##### Preparing the Azure resources\n\n我们将开始准备共享数据所需的\
  \ Azure 资源：\n\n- 1. 在 Azure 门户中，搜索 Data Shares 并导航到它。\n- 2. 在 Data Shares 页面，点击\
  \ Create。\n- 3. 在 Create Data Share 页面，输入以下详细信息：\n  - Subscription: Free Tier or\
  \ Paid Subscription\n  - Resource group: training_rg\n  - Location: East US 2\n\
  \  - Name: trainingshare\n点击 Review + create：\n\n![](img/dae8a2243a3c3cbcd9c56ff3d2217672_357_0.png)\n\
  \nFigure 10.26 – Creating a new data share\n\n- 4. 注意顶部出现的 Validation Passed 消息。按下\
  \ Create。\n- 5. 新创建的数据共享现在将被部署。部署完成后，你应收到一条 Your deployment is complete 的消息。\n\n\
  6. 点击 Go to resource。这应会带你进入新创建的数据共享页面：\n\n![](img/dae8a2243a3c3cbcd9c56ff3d2217672_358_0.png)\n\
  \nFigure 10.27 – Home screen of the new data share\n\n> **Important**\n> 决定在内部或外部共享数据的决定极其敏感。作为数据工程师，你在进行数据共享之前必须强制寻求客户的书面批准。\n\
  \n##### Creating a data share\n\n现在我们已经创建了一个新的数据共享账户，可以继续共享数据：\n\n- 1. 点击 Start\
  \ sharing your data。现在，点击 Create 并提供以下值：\n  - Share name: golddata\n  - Share type:\
  \ Snapshot\n\n点击 Continue。这应会带你进入 Datasets 选项卡。从这里，点击 Add datasets 并选择 Azure Data\
  \ Lake Gen2：\n\nFigure 10.28 – Choosing a dataset type for the data share\n\n2.\
  \ 点击 Next 并提供以下值：\n  - **Subscriptions:** Free Tier or Paid Subscription\n  - **Resource\
  \ groups:** training_rg\n  - **Storage accounts:** traininglakehouse:\n\nFigure\
  \ 10.29 – Choosing an Azure Data Lake Storage account for the data share\n\n3. 点击\
  \ Next。\n\n在 Select datasets 页面，选择 gold 并点击 Next：\n\n![](img/dae8a2243a3c3cbcd9c56ff3d2217672_360_0.png)\n\
