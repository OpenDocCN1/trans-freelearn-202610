  schema = StructType(fields)\ndf_read_data_hour1 = spark.read.csv(BRONZE_TABLE_PATH,\
  \ schema=schema)\ndisplay(df_read_data_hour1)\n```\n\n注意在读取其数据到 Spark DataFrame\
  \ 之前是如何为 store_orders 表定义模式的。\n\n这会产生以下输出：\n\n```\nORDERS_SCHEMA = [\n    ('order_number',\
