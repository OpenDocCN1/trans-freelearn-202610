  \ electroniz_curation_notebook 是否能够令我们满意地 curation 数据。\n\n\n\n\n\n## 验证银层中的 curated\
  \ 数据\n\n在上一节中，我们运行了 `electroniz_curation_pipeline` 四次，每次使用不同的小时文件夹。如果一切正常运行，我们可以安全地推断\
  \ Electroniz lakehouse 的银层现在是可用的。\n\n根据 curation 流程，最后一步是验证 curated 数据。我们将使用另一个已经包含执行验证的代码的\
  \ notebook。你只需按以下步骤逐步运行它：\n\n- 1. 验证代码可在 `curation_verification_notebook.ipynb`\
  \ 中获得。\n- 2. 将 `curation_verification_notebook.ipynb` notebook 导入到 Azure Databricks。步骤与之前为\
