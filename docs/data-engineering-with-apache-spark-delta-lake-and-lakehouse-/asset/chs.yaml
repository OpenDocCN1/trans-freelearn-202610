  \n9. 在笔记本的第二个单元中复制以下命令。用 Xs 替换为 Azure 数据湖中 key1 的值（之前获取的），并确保其他参数与您在第 5 章 数据收集阶段\
  \ – 青铜层 中创建的 Azure 数据湖中的青铜层相匹配。\n\nADLS_FOLDER 是 electroniz_batch_ingestion_pipeline\
  \ 第一次运行时的时间。例如，当我们在第 5 章 数据收集阶段 – 青铜层 中运行管道时，文件夹结构如下所示截图。小时 2021/04/28/18 文件夹是第一次迭代。\n\
  \n![](img/dae8a2243a3c3cbcd9c56ff3d2217672_192_0.png)\n\nFigure 6.13 – Folder structure\
  \ of the sales_orders table in the bronze layer\n\n我们现在运行以下命令：\n\n```\nSTORAGE_ACCOUNT=\"\
  traininglakehouse\"\nADLS_KEY=\"XXXXXXXXXXXXXXXXXXXXXXXXXXXXX\"\nBRONZE_LAYER_NAMESPACE=\"\
  bronze\"\nSCRATCH_LAYER_NAMESPACE=\"scratch\"\nSTORE_SALES_FOLDER=\"sales\"\nTABLE=\"\
  store_orders\"\nADLS_FOLDER=\"2021/04/28/18\"\nBRONZE_TABLE_PATH=\"wasbs://\"+BRONZE_LAYER_NAMESPACE+\"\
  @\"+STORAGE_ACCOUNT+\".blob.core.windows.net/\"+STORE_SALES_FOLDER+\"/[dbo].[\"\
  +TABLE+\"/]\"+ADLS_FOLDER\nspark.conf.set(\"fs.azure.account.key.\"+STORAGE_ACCOUNT+\"\
  .blob.core.windows.net\", ADLS_KEY)\n```\n\n按 Shift + Enter 运行命令。\n\n10. 我们现在准备好从\
  \ Azure 数据湖存储中读取 store_orders 表。您可能还记得我们之前使用 electroniz_batch_ingestion_pipeline\
  \ 导入了此表。将以下命令复制到笔记本的第三个单元中：\n\n```\nORDERS_SCHEMA = [\n    ('order_number', IntegerType()),\n\
  \    ('customer_id', IntegerType()),\n    ('product_id', IntegerType()),\n    ('order_date',\
