  \ -g $RESOURCEGROUPNAME -n $STORAGEACCOUNTNAME | jq .[0].value`\n```\n\n```\naz\
  \ storage blob upload --container-name $STORAGECONTAINER --account-name $STORAGEACCOUNTNAME\
