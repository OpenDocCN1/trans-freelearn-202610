  \ 批处理摄取管道增量数据运行的结果\n\n### 管道的第三次运行 – 更新\n\n目前，初始摄取后的第二个小时正在进行。再次，我们假设此时销售数据库仍完全运行，但在这一小时内，数据库活动为五位客户致电帮助台**更新**他们的订单：\n\
