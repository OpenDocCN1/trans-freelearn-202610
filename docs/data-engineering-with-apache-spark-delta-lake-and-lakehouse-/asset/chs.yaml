  \n## Summary\n\n在本章中，我们学习了如何通过以云架构图和管道设计文档的形式反思用户需求来启动数据管道开发。在管道设计文档中，我们决定创建摄取、整理和聚合管道，以构建湖屋的\
  \ bronze、silver 和 gold 层。\n\n我们还更详细地了解了 bronze 层以及它与整体湖屋架构的关系。我们通过实际开发 **Electroniz**\
  \ 批处理和流式摄取管道来跟进对 bronze 层的理解。现在我们已在 bronze 层中拥有来自各种数据源的原始数据，我们将继续进行 *Chapter 6,\
  \ Understanding Delta Lake*，并了解 **Delta Lake**。了解 Delta Lake 的工作原理对于构建湖屋的 silver\
  \ 层至关重要。\n\n### 6\n理解 Delta Lake\n\n在上一章中，我们创建了湖屋的 bronze 层。bronze 层以从数据源收集的原生形式存储原始数据。问题是原始数据并不处于可直接用于分析操作的形状。\n\
  \n作为一名数据工程师，您有责任将原始数据转换为可供分析工作负载使用的形状和形式。在本章中，我们将进一步学习如何清理原始数据。清理数据的过程涉及应用清理和标准化数据的逻辑，然后将其写入湖屋的\
  \ silver 层。\n\n但这还不是全部——silver 层应以支持 **ACID（原子性、一致性、隔离性和持久性）** 事务的开放格式存储数据。这是通过使用\
  \ **Delta Lake** 引擎完成的。在开始构建 silver 层之前，我们需要完全了解 Delta Lake 的一些关键功能以及它们与湖屋架构的关系。\n\
  \n在本章中，我们将涵盖以下主题：\n\n+   - 理解 Delta Lake 如何实现湖屋\n+   - 理解 Delta Lake\n+   - 创建 Delta\
  \ Lake 表\n+   - 执行数据的 upsert\n+   - 理解隔离级别\n+   - 理解并发控制\n\n#### 理解 Delta Lake 如何实现湖屋\n\
  \n在 *Chapter 2, Discovering Storage and Compute Data Lake Architectures* 中，我们谈到了传统仓库系统与数据湖之间的取舍斗争。在过去几年中，许多组织通过远离传统数据仓库转向数据湖来现代化其数据工程和分析平台。转向数据湖无疑赋予了他们以大规模存储和计算任何格式数据的灵活性。然而，这些优势并非没有付出一些代价。最大的代价是数据的可靠性。与数据仓库一样，数据湖中没有可用的事务保证。这种需求导致了名为\
  \ Delta Lake 的开源存储层的推出。\n\n推出后，专家们提出了将弹性数据仓库的强大功能与数据湖的灵活性相结合的想法，并将其称为 **lakehouse**。数据湖和数据仓库的结合提供了独特而强大的功能组合，如下所示：\n\
  \n+   - 数据可以以多种格式进行分析——结构化、半结构化或非结构化。\n+   - 保留按需低成本存储和计算的理念。\n+   - 支持包括分析、数据科学、机器学习和人工智能在内的各种用例。\n\
  +   - 通过整理、标准化和去重等有效技术保持数据的完整性。\n+   - 提供安全存储和共享数据的方式，同时保持合规性。\n\n\n\n\n\n以下图表显示了数据层：\n\
  \n![](img/dae8a2243a3c3cbcd9c56ff3d2217672_183_0.png)\n\n图 6.1 – Lakehouse 数据层\n\
  \n在第 5 章《数据收集阶段 – Bronze 层》中，我们更详细地讨论了 lakehouse 的 bronze 层。现在我们将重点转向 silver 层。虽然\
  \ bronze 层以原生格式存储不断从各种数据源 trickle 而来的数据，但 silver 层在 curation 阶段后以通用开放格式存储来自所有数据源的数据。\n\
  \n**Data curation** 是对数据的 **cleanup**、**sanitization**、**standardization** 和 **deduplication**\
  \ 的统称。根据前述图表，Delta Lake 引擎位于 silver 层的核心。它负责管理和公开一个不仅干净而且最重要的是可信赖的数据层。这是一个通用层，数据消费者如数据分析师、科学家和机器学习工程师可以放心地自由访问和使用。\n\
  \n#### Understanding Delta Lake\n\n如前所述，现代数据湖缺乏一些关键特性，例如 **ACID transactions**、**indexing**\
  \ 和 **versioning**，这会负面影响数据的可靠性、质量和性能。\n\n**Important Note**\n在数据仓库术语中，ACID 是 atomicity、consistency、isolation\
  \ 和 durability 的缩写。这些属性旨在使数据库事务准确、可靠且永久。\n\n以下图表描述了这些属性：\n\n![](img/dae8a2243a3c3cbcd9c56ff3d2217672_184_0.png)\n\
  \n图 6.2 – Delta Lake 中的 ACID 属性\n\nDelta Lake 作为分布式计算框架 Apache Spark 的上层运行。按设计，Apache\
  \ Spark 缺少以下事务管理的关键原则：\n\n- 它在编辑事务期间不会锁定先前的数据，这意味着在覆盖期间数据可能在很短时间内变得不可用。\n- 在数据覆盖期间，存在旧数据被删除而新数据保存操作失败的可能性。这可能导致数据处于不一致状态。\n\
  - Apache Spark 不会防止两个单独的事务同时向同一位置写入数据。\n\n我们将通过一系列实时示例学习 Delta Lake 的一些关键特性。让我们先通过准备本次练习将使用的环境开始。\n\
  \n## Preparing Azure resources\n\n在深入了解 Delta Lake 的工作原理之前，我们需要按如下方式启动一些资源：\n\n\
