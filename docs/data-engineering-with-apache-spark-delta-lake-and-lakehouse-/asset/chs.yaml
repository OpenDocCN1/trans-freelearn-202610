  \n图 10.69 – 检查分类\n\n注意 Azure Purview 中的扫描如何自动为两个列发现了 **Classifications**：**Email\
  \ Address** 和 **Credit Card Number**。正如您在前几章中回忆的那样，我们在 store customer 表中有这些列。那么，为什么对数据进行分类如此重要呢？\n\
  \n**数据分类**是满足合规要求和数据治理的重要第一步。基于数据的敏感性定义适当的标签、标记和元数据有助于在查询时定义数据保密性。\n\n> **Important**\n\
  > 根据业务数据的类型，分类通常是基于数据内容、上下文和用户级别执行的。\n\n## Cleaning up Azure resources\n\n为节省成本，您可能希望清理以下\
  \ Azure 资源：\n\n+   1. 删除 Azure Purview 账户；即 `trainingcatalog`。\n+   2. 删除 Azure\
  \ Data Share 账户；即 `trainingshare`。\n\n现在，让我们总结本章。\n\n## Summary\n\n本章因以下几个原因非常重要。通过几个示例，我们了解了数据工程领域常见的挑战。处理诸如模式演变和治理等挑战对于现代数据工程项目至关重要。这些挑战随着时间的推移而演变，同样使数据工程师的工作变得更轻松的技术和工具也在不断发展。\n\
  \n在下一章中，我们将了解数据工程师的 DevOps 基础知识。DevOps 正在迅速成为数据工程师必备的附加技能，因此我们将学习如何使用 **基础设施即代码\
  \ (IaC)** 范式自动配置云资源。利用 IaC 的强大功能，数据工程师可以快速、可重复且安全地启动使用云资源的数据管道。\n\n### 11\nInfrastructure\
  \ Provisioning\n\n随着数据分析需求的增长，数据工程师在市场上正变得昂贵且难以找到。与此同时，雇用数据工程师的组织正在寻找创新方法以用更少资源做更多事情，从而证明高资源成本的合理性。在最近的趋势中，大多数这些组织开始使用自动化基础设施配置来简化云部署。直到最近，基础设施配置工作通常由\
  \ DevOps 团队处理，但现在不再如此。\n\n在上一章中，我们谈到了数据工程师工作角色的动态性。现代数据工程师需要跟上这一最新趋势，并在 DevOps 技能方面进行培训。本章和下一章旨在教授数据工程师一些关键的\
  \ DevOps 技能。\n\n> **Important Note**\n> 在当今的就业市场中，精通 DevOps 的数据工程师是致命的组合。现代组织更愿意雇用一个同时具备这两种技能的资源，而不是雇用两个。\n\
  \n在本章中，我们将涵盖以下主题：\n\n+   - Infrastructure as code\n+   - Deploying infrastructure\
  \ using Azure Resource Manager\n+   - Deploying multiple environments using IaC\n\
  \n#### Infrastructure as code\n\n直到最近，基础设施部署一直是一个极其耗时且昂贵的过程。在典型的组织中，系统管理员团队负责使用一系列手动执行步骤在多个环境中部署硬件和软件。由于其手动性质，该过程存在主要缺陷：\n\
  \n+   - **Unique settings per environment**: 每个独立环境都可能具有独特的设置。为满足这些要求，手动步骤需要为每个环境记录。\n\
  +   - **Time-consuming**: 手动步骤的记录和执行非常耗时。\n+   - **Inconsistent and error-prone**:\
  \ 遵循手动步骤进行基础设施部署可能导致不一致和错误。\n\n**基础设施即代码 (IaC)** 是一种使用源代码部署和管理基础设施组件的做法。使用 IaC，系统管理团队（也称为\
  \ DevOps）不再受限于手动实践和记录流程。相反，他们现在可以使用配置文件执行自动化和可重复的部署。\n\n![](img/dae8a2243a3c3cbcd9c56ff3d2217672_388_0.png)\n\
  \n图 11.1 – 使用 IaC 的好处\n\n\n\n\n\n使用 IaC 实践部署的基础设施是准确的、一致的、可重用的，并且速度快。DevOps 团队以与应用程序团队创建应用程序代码类似的方式创建、管理和版本控制基础设施配置文件。IaC\
  \ 实践遵循相同的错误修复、测试和代码推广协议集。\n\n市场上有多款开源和商业化的 IaC 工具可供选择，例如 Ansible、Terraform、Chef\
  \ 和 Puppet。对于基础设施配置，Azure Resource Manager（ARM）是 Azure 中的原生平台。现代组织正在利用 ARM 的强大功能来组织和标准化其云部署，以实现统一性、安全性和性能。\n\
  \n##### 使用 Azure Resource Manager 部署基础设施\n\n在 ARM 于 2014 年出现之前，Azure Service Manager（ASM）用于基础设施部署。然而，由于资源之间的相互依赖，ASM\
  \ 方法存在一些严重的缺点。在部署资源之前，你必须仔细了解依赖关系，并在脚本中相应地排序操作。\n\n值得庆幸的是，ARM 已经解决了相互依赖问题，可以轻松、统一、\
  \ seamlessly 地部署 Azure 资源。ARM 使用资源组作为云资产的逻辑分组。使用资源组可确保资源配置、安全性和拆除的一致生命周期。ARM 将资源组用作部署和管理的单一单元。\n\
  \nARM 使用模板来部署 IaC。一旦创建，这些模板就会像其他类型的应用程序代码一样成为企业代码库的一部分。\n\n##### 创建 ARM 模板\n\nARM\
  \ 模板只是一个嵌入了资源配置的 JSON 格式文件。ARM 模板使用声明式语法，这意味着你可以在一个模板中部署多个 Azure 资源。在运行时，ARM 会自动按正确顺序排列操作，并在可能的情况下并行执行。\n\
  \n在我们为 IaC 部署创建新模板之前，我们需要了解 ARM 模板的格式。\n\n```\n{\n  \"$schema\": \"https://schema.management.azure.com/schemas/2019-04-01/deploymentTemplate.json#\"\
  , << Version of template language\n  \"contentVersion\": \"\", << Version of template\n\
  \  \"apiProfile\": \"\",      << Collection of API versions\n  \"parameters\": {\
  \ },      << External values provided to template\n  \"variables\": { },       <<\
  \ Internal values created using expressions\n  \"functions\": [ ],       << User\
  \ defined functions\n  \"resources\": [ ],       << Resource types to be deployed\n\
  \  \"outputs\": { }          << Output values returned by deployment\n}\n```\n\n\
  图 11.2 – ARM 模板的解剖结构\n\n模板中的每个元素都有多个可以在其中设置的属性。让我通过以下示例来演示这一点。在本章的整个过程中，我们将引用 Packt\
  \ Git 仓库中以下位置的 ARM 模板：\n\nhttps://github.com/PacktPublishing/Data-Engineering-with-Apache-Spark-Delta-Lake-and-Lakehouse/tree/main/project/infra\n\
  \n对于以下示例，让我们了解一个部署 Electroniz Azure Data Lake Storage 账户的简单模板。\n\n###### Parameters\n\
  \nARM 模板的参数部分保留用于输入值。参数对于强制执行 ARM 模板的可重用性非常重要。你可能会注意到这里有两个名为 environment 和 project\
  \ 的参数。这些参数可用于在不同项目上启动不同的环境，例如 dev、test 或 prod。\n\n```\n\"$schema\": \"https://schema.management.azure.com/schemas/2019-04-01/deploymentTemplate.json\"\
  ,\n\"contentVersion\": \"1.0.0.0\",\n\"parameters\": {\n  \"environment\": {\n \
  \   \"type\": \"string\"\n  },\n  \"project\": {\n    \"type\": \"string\"\n  },\n\
  \  \"storageAccountName\": {\n    \"type\": \"string\",\n    \"metadata\": {\n \
  \     \"description\": \"The name of the storage account\"\n    }\n  },\n  \"bronzeLayer\"\
  : {\n    \"type\": \"string\"\n  },\n  \"silverLayer\": {\n    \"type\": \"string\"\
  \n  },\n  \"goldLayer\": {\n    \"type\": \"string\"\n  },\n  \"location\": {\n\
  \    \"type\": \"string\",\n    \"defaultValue\": \"[resourceGroup().location]\"\
  ,\n    \"metadata\": {\n      \"description\": \"The location in which the resources\
  \ should be deployed.\"\n    }\n  }\n}\n```\n\n图 11.3 – ARM 模板中的参数\n\n## Variables\n\
  \nARM 模板的变量部分保留用于创建可在整个模板中使用的自定义值。自定义值是使用两个方括号 ([ ]) 表示的表达式创建的。在表达式中，你可以使用 ARM 提供的多个预定义函数，例如\
  \ CONCAT、MIN 和 MAX。\n\n```\n\"variables\": {\n  \"storageAccountName\": \"[concat(parameters('environment'),\
  \ parameters('project'), parameters('storageAccountName'))]\"\n},\n```\n\n图 11.4\
  \ – ARM 模板中的变量\n\n注意 storageAccountName 变量中使用了 CONCAT 函数。此表达式将项目名称和环境名称添加到 storageAccountName\
  \ 参数中。这使得更容易识别 Azure 资源。\n\n###### Resources\n\nARM 模板的资源部分保留用于定义所需资源（一个或多个）。在以下示例中，需要使用\
  \ storageAccountName 变量创建一个新的存储账户。请注意 isHnsEnabled 设置为 true，这意味着这是 Azure Data Lake\
  \ Storage Gen2。\n\n```\n\"resources\": [\n  {\n    \"name\": \"[variables('storageAccountName')]\"\
  ,\n    \"type\": \"Microsoft.Storage/storageAccounts\",\n    \"apiVersion\": \"\
  2021-02-01\",\n    \"sku\": {\n      \"name\": \"Standard_LRS\"\n    },\n    \"\
  kind\": \"StorageV2\",\n    \"location\": \"[parameters('location')]\",\n    \"\
  properties\": {\n      \"isHnsEnabled\": true\n    },\n    \"tags\": {\n      \"\
  owner\":\"data engineering\",\n      \"project\":\"lakehouse\",\n      \"environment\"\
  :\"production\"\n    }\n  },\n  \"resources\": [\n    {\n      \"name\": \"[concat('default/',\
  \ parameters('bronzeLayer'))]\",\n      \"type\": \"blobServices/containers\",\n\
  \      \"apiVersion\": \"2019-06-01\",\n      \"dependsOn\": [\n        \"[variables('storageAccountName')]\"\
  \n      ],\n      \"properties\": {\n        \"publicAccess\": \"None\"\n      }\n\
  \    }\n  ]\n```\n\n图 11.5 – ARM 模板中的资源定义\n\n另外，请注意在外部资源内嵌入了一个新的子资源。子资源用于在父资源内创建资源。在此实例中，我们在给定的存储账户中创建一个容器。请注意\
  \ dependsOn 属性的使用，它用于建立父子关系。\n\n##### 使用 Azure 门户部署 ARM 模板\n\n与 Azure 中的许多其他服务一样，ARM\
  \ 模板可以从 Azure 门户和 Azure 客户端部署。在项目的初始阶段，使用 Azure 门户提供了一种方便的方法来开发、测试和部署基础设施代码。一旦模板正常工作，它们可以通过脚本使用\
  \ Azure 客户端部署。首先，我们将使用 Azure 门户部署一个模板：\n\n- 1. 在 Azure 门户上，导航到 Home。现在点击 Create\
  \ a resource 图标。\n- 2. 在搜索框中，输入 Templates，然后按 Enter。\n\n![](img/dae8a2243a3c3cbcd9c56ff3d2217672_393_0.png)\n\
  \n图 11.6 – 在 Azure 门户上使用 ARM 模板创建资源\n\n- 3. 选择 Template deployment（deploy using\
  \ custom templates）。\n\n![](img/dae8a2243a3c3cbcd9c56ff3d2217672_393_1.png)\n\n\
  图 11.7 – 创建自定义 ARM 模板\n\n点击 **Create**。\n\n- 4. 我们现在准备创建新模板。\n\n![](img/dae8a2243a3c3cbcd9c56ff3d2217672_394_0.png)\n\
  \n点击 **Build your own template in the editor**。\n\n- 5. 复制以下文件的内容并粘贴到文本框中。这与上一节中的模板相同：\n\
  \n```\nhttps://raw.githubusercontent.com/PacktPublishing/Data-Engineering-with-Apache-Spark-Delta-Lake-and-Lakehouse/main/project/infra/storage_accounts/storage_accounts.json\n\
  ```\n\n![](img/dae8a2243a3c3cbcd9c56ff3d2217672_394_1.png)\n\n\n\n\n\n注意模板的读取方式，ARM\
  \ 成功识别了此模板创建的正确参数数量、变量和资源。单击“保存”。\n\n6. 在自定义部署屏幕中，输入以下值：\n\n- **订阅：** 免费套餐或付费订阅。\n\
  - **资源组：** 单击“创建新”。\n- **名称：** `elz_prod`。\n\n单击“确定”。\n\n现在输入以下值：\n\n- **区域：** 美国东部\
  \ 2\n- **环境：** prod\n- **项目：** dlake\n\n在许多情况下，Azure 资源名称在全球范围内是唯一的。尽量使项目名称尽可能唯一。由于大量读者会使用相同的说明，具有唯一性将消除与唯一资源名称相关的不必要错误：\n\
  \n- **存储帐户名称：** elz\n- **青铜层：** bronze\n- **白银层：** silver\n- **黄金层：** gold\n- **位置：**\
  \ [resourceGroup().location]\n\n单击“查看 + 创建”。\n\n7. 检查“验证通过”消息。\n\n![](img/dae8a2243a3c3cbcd9c56ff3d2217672_396_0.png)\n\
  \n图 11.10 – 验证自定义 ARM 模板\n\n单击“创建”。\n\n8. ARM 现在将开始部署。你现在应该会看到如下的“部署进行中”屏幕：\n\n\
  ![](img/dae8a2243a3c3cbcd9c56ff3d2217672_396_1.png)\n\n图 11.11 – 部署自定义 ARM 模板\n\n\
  9. 部署完成后，你应该会看到如下的“**部署完成**”屏幕：\n\n![](img/dae8a2243a3c3cbcd9c56ff3d2217672_397_0.png)\n\
  \n图 11.12 – 部署完成确认消息\n\n单击“**转到资源组**”。\n\n10. 检查是否已创建新的存储帐户。注意存储帐户的名称嵌入了环境和项目名称。\n\
  \n![](img/dae8a2243a3c3cbcd9c56ff3d2217672_397_1.png)\n\n图 11.13 – 新创建资源组中的 Azure\
  \ 资源\n\n单击“**存储帐户名称 (proddlakeelz)**”。\n\n11. 现在单击“**容器**”。注意 ARM 模板中作为子资源创建的三个新容器。\n\
  \n![](img/dae8a2243a3c3cbcd9c56ff3d2217672_398_0.png)\n\n图 11.14 – 新创建资源组中的 Azure\
  \ 资源\n\n12. 返回到“**主页 | 资源组 | elz_prod**”。\n\n使用左侧菜单，单击“**部署**”。注意 ARM 维护了所有已执行部署的日志。\n\
  \n![](img/dae8a2243a3c3cbcd9c56ff3d2217672_398_1.png)\n\n图 11.15 – 检查新创建资源组中的部署\n\
  \n##### 使用 Azure CLI 部署 ARM 模板\n\n一旦使用 Azure 门户开发并测试了模板，就必须使用 Azure 客户端运行它。这将为我们提供模板已准备好在未来使用部署脚本使用的保证。\n\
  \n> **重要说明**\n> 尽管使用 Azure 门户部署 ARM 模板是一个相对简单的过程，但许多管理员更喜欢使用 **Azure CLI** 进行自动化部署。\n\
  \n这就是如何使用 Bash 部署 Lakehouse_Storage_Account 模板。 使用 Azure Cloud Shell 调用以下命令：\n\n\
  ```\nRESOURCEGROUPNAME=\"elz_prod\"\nLOCATION=\"eastus\"\nIAC_ENVIRONMENT=prod\n\
  FILE_PATH=~/Data-Engineering-with-Apache-Spark-Delta-Lake-and-Lakehouse/project/infra\n\
  TEMPLATE_FILE=$FILE_PATH/storage_accounts/storage_accounts.json\nPARAMETERS_FILE=$FILE_PATH/parameters/$IAC_ENVIRONMENT/storage_accounts_parameters.json\n\
  az group create --name $RESOURCEGROUPNAME --location $LOCATION\naz deployment group\
  \ create --name Lakehouse_Storage_Account --resource-group $RESOURCEGROUPNAME --template-file\
  \ $TEMPLATE_FILE --parameters $PARAMETERS_FILE\n```\n\n正如我们所见，这非常简单易行。\n\n#####\
  \ 部署包含机密的 ARM 模板\n\n在上一节中，我们部署了一个相对简单的 ARM 模板。如果 Azure 资源需要在创建资源时设置管理员凭据，则模板的复杂性会增加。由于我们使用代码创建基础设施，因此在配置文件中留下暴露的引用密码是不安全且违反安全实践的。在这种情况下，必须妥善解决模板的安全方面。此安全问题在启动\
  \ Azure SQL 和 Azure Synapse 等资源时经常遇到。幸运的是，Azure ARM 可以轻松满足此要求。它可以在部署过程中在运行时从 Azure\
  \ Key Vault 检索机密。流程始于在 Azure Key Vault 中创建基础设施机密。做法如下：\n\n- 1. 在 Azure Cloud Shell\
  \ 中运行以下命令：\n\n```\nRESOURCEGROUPNAME=\"elz_prod\"\nLOCATION=\"eastus\"\nKEYVAULTNAME=\"\
  deploykvelz\"\naz group create --name $RESOURCEGROUPNAME --location $LOCATION\n\
  az keyvault purge -n $KEYVAULTNAME\naz config set extension.use_dynamic_install=yes_without_prompt\n\
  ```\n\n```\naz keyvault create --location $LOCATION --name $KEYVAULTNAME --resource-group\
  \ $RESOURCEGROUPNAME --enabled-for-template-deployment true\n```\n\n如果运行正确，你应该会看到以下输出：\n\
  \n![](img/dae8a2243a3c3cbcd9c56ff3d2217672_400_0.png)\n\n图 11.16 – 新 Azure Key Vault\
  \ 创建的输出\n\n2. 我们现在将向新创建的 Azure Key Vault 添加机密。使用 Azure 门户，导航到“主页 | 资源组 | elz_prod\
  \ | deploykvelz”。\n\n单击“机密”。然后使用“生成/导入”创建两个新机密：\n\n- 名称：SQLUSER   值：salesadmin\n\
  - 名称：SQLPASSWORD   值：<Azure SQL 管理员的密码>\n\n![](img/dae8a2243a3c3cbcd9c56ff3d2217672_400_1.png)\n\
  \n图 11.17 – 检查 Azure Key Vault 中新创建的机密\n\n###### 重要说明\n\n尽管可以在 Azure Key Vault 中自动创建机密，但强烈建议手动执行此步骤。你可以请求客户的\
  \ IT 团队为你创建机密。使用此方法可确保他们方面的保密性。\n\n3. 我们现在准备部署 Stores_Azure_SQL_Database 模板。使用 Azure\
  \ Cloud SQL 运行以下命令。这些命令将部署 Azure SQL 数据库模板，同时使用先前创建的 Azure Key Vault 中的机密动态获取数据库凭据：\n\
  \n```\nSERVERNAME=\"elzsql\"\n\nDATABASESNAME=\"salesdb\"\n\nVAULTNAME=\"deploykvelz\"\
  \n\nPASSWORDSECRETNAME=\"SQLPASSWORD\"\n\nUSERSECRETNAME=\"SQLUSER\"\n\nRESOURCEGROUPNAME=\"\
  elz_prod\"\n\nLOCATION=\"eastus\"\n\nTEMPLATE_FILE=\"~/Data-Engineering-with-Apache-Spark-Delta-Lake-and-Lakehouse/project/infra/azure_sql/azure_sql.json\"\
  \n\naz deployment group create --name Stores_Azure_SQL_Database --resource-group\
  \ $RESOURCEGROUPNAME --template-file $TEMPLATE_FILE --parameters vaultName=$VAULTNAME\
  \ databaseName=$DATABASESNAME adminPasswordsecretName=$PASSWORDSECRETNAME sqlServerName=$SERVERNAME\
  \ adminLoginUsersecretName=$USERSECRETNAME vaultResourceGroupName=$RESOURCEGROUPNAME\n\
  ```\n\n4. 导航到“主页 | 资源组 | elz_prod”。如果前面的命令成功，你应该能够看到新创建的 SQL 服务器和数据库，如下所示：\n\n![](img/dae8a2243a3c3cbcd9c56ff3d2217672_402_0.png)\n\
  \n图 11.18 – 检查 Azure SQL 数据库的创建\n\n5. 有趣的是可以了解 ARM 中是如何实现机密的动态获取的。\n\n![](img/dae8a2243a3c3cbcd9c56ff3d2217672_402_1.png)\n\
  \n图 11.19 – ARM 从 Azure Key Vault 获取机密的过程\n\nARM 允许使用嵌套模板。使用从命令行传递的参数（vaultName、adminLoginUsersecretName、adminPasswordsecretName），父模板为机密生成\
  \ Azure Key Vault 资源 ID。\n\n```\n\"adminLoginUser\": {\n  \"reference\": {\n   \
  \ \"keyVault\": {\n      \"id\": \"[resourceId(parameters('vaultSubscription'),\
  \ parameters('vaultResourceGroupName'), 'Microsoft.KeyVault/vaults', parameters\"\
  ,\n    },\n    \"secretName\": \"[parameters('adminLoginUserSecretName')]\"\n  }\n\
  },\n\"adminPassword\": {\n  \"reference\": {\n    \"keyVault\": {\n      \"id\"\
  : \"[resourceId(parameters('vaultSubscription'), parameters('vaultResourceGroupName'),\
  \ 'Microsoft.KeyVault/vaults', parameters\",\n    },\n    \"secretName\": \"[parameters('adminPasswordSecretName')]\"\
  \n  }\n}\n```\n\n图 11.20 – 父 ARM 模板生成 Azure 密钥库资源 ID\n\n这些资源 ID 由嵌套模板用于从 Azure Key\
  \ Vault 检索机密的实际值。\n\n> **重要说明**\n> 在高度安全的项目中，将生产机密隐藏在数据工程师之外并非标准做法。在这种情况下，机密由客户的安全团队创建。创建后，这些机密在运行时动态检索，而不会暴露给未经授权的实体。\n\
  \n##### 使用 IaC 部署多个环境\n\n在上一节中，我们了解到一旦 DevOps 团队创建了 IaC 资产，就可以通过重复部署来创建不同的环境，每次都能实现一致的结果。\n\
  \n![](img/dae8a2243a3c3cbcd9c56ff3d2217672_403_0.png)\n\n图 11.21 – 使用 IaC 部署多个环境的过程\n\
  \n\n\n\n\n让我们按照以下步骤开始：\n\n+   1. 如果你的两个模板都按预期工作，就没有必要一个一个地创建下一组资源。让我们像专业人士一样操作，运行一个脚本来为我们创建剩余的资源。\n\
  \n+   2. 这就是部署脚本（electroniz_isc.sh）的样子。它为需要创建的每个 Azure 资源都有一个部分。注意部署脚本中模板文件和参数文件的使用。模板和参数文件的路径作为参数传递给此脚本。这意味着我们可以重用同一个脚本来部署多个环境。\n\
  \n![](img/dae8a2243a3c3cbcd9c56ff3d2217672_404_0.png)\n\n图 11.22 – IaC 部署脚本\n\n\
  +   3. 真相揭晓的时刻到了。在 Azure Cloud Shell 中执行以下命令并观看其运行。脚本将在几分钟内创建整个基础设施。这就是 IaC 的魔力。请确保根据你的环境将以下命令中的\
  \ <HOME_DIR> 值替换为实际值：\n\n```\nIAC_ENVIRONMENT=prod\nHOME_DIR_PATH=<HOME_DIR>\nsh\
  \ Data-Engineering-with-Apache-Spark-Delta-Lake-and-Lakehouse/project/infra/electroniz_isc.sh\
  \ IACRESOURCEGROUPNAME=elz_prod RESOURCEGROUPNAME=elz_prod LOCATION=eastus TEMPLATE_FILE_PATH=$HOME_DIR_PATH/Data-Engineering-with-Apache-Spark-Delta-Lake-and-Lakehouse/project/infra\
  \ PARAMETERS_FILE_PATH=$HOME_DIR_PATH/Data-Engineering-with-Apache-Spark-Delta-Lake-and-Lakehouse/project/infra/parameters/$IAC_ENVIRONMENT\n\
  ```\n\n注意前述命令中使用了 IAC_ENVIRONMENT 和 PARAMETERS_FILE_PATH 参数，这可以强制执行 IaC 脚本的可重用性方面。要构建多个环境，你只需在源代码管理中为每个环境创建一个文件夹，并在前述命令中引用它即可。ARM\
  \ 模板文件对每次构建都保持不变。以下是生产环境的参数文件夹示例：\n\n## 图 11.23 – IaC 环境参数\n\n坐下来，放松，让部署脚本完成它的工作。脚本完成需要几分钟时间。\n\
  \n+   4. 现在是验证脚本是否按预期完成工作的时候了。\n+      让我们通过返回 Home | Resource group | elz_prod\
  \ 来检查。\n\n## 图 11.24 – 部署后 Azure 资源列表\n\n5. 部署脚本似乎按预期工作。我们可以看到在 ez_prod 资源组下部署了多个\
  \ Azure 资源。此外，我们可以通过导航到 Home | Resource group | ez_prod | Deployments 来检查部署的状态。\n\
  \n![](img/dae8a2243a3c3cbcd9c56ff3d2217672_406_0.png)\n\n图 11.25 – 检查当前部署\n\n使用\
  \ IaC 创建云资源是实现更快、更一致且可重复部署的第一步。IaC 流程可以轻松集成到现有的企业软件开发周期中。从长远来看，它已被证明不仅可以节省时间，还可以节省大量与使用手动部署相关的不必要重复成本。\n\
  \n然而，一个巨大的问题仍然没有得到解答……快速和一致就足够了吗？与其他事物一样，云资源和管道会随着时间而演变。如果没有自动化，我们仍然需要有人在每次更改时调用这些脚本。如果更改能自动部署就太好了？我们将在下一章探讨对此可以做什么。\n\
  \n##### 清理 Azure 资源\n\n在离开之前，请确保使用以下命令清理 ez_prod 资源组。让资源闲置没有任何意义，月底会产生高额账单：\n\n\
  ```\nRESOURCEGROUPNAME=\"ez_prod\"\naz group delete --name $RESOURCEGROUPNAME\n\
  ```\n\n这会产生以下输出：\n\n```\nAzure> RESOURCEGROUPNAME=\"elz_prod\"\nAzure> az group\
  \ delete --name $RESOURCEGROUPNAME\nAre you sure you want to perform this operation?\
  \ (y/n): y\nAzure>\n```\n\n图 11.26 – 删除资源组时的确认屏幕\n\n##### 总结\n\n在本章中，我们首次体验了使用 IaC\
  \ 原则部署云资源。整体部署流程可通过此原则大幅加速。通过引入自动化，此流程可以进一步改进和简化。\n\n在最后一章，第 12 章《数据管道的持续集成和部署（CI/CD）》中，我们将学习如何自动化管道部署。使用\
  \ CI/CD 是成熟云部署的标志性实践。CI/CD 可以在保持高效率的同时大幅加速代码交付。在下一章中，我们将了解如何使用 CI/CD 自动化基础设施部署和代码交付。\n"
- "### 12\n#### 数据管道的持续集成和部署（CI/CD）\n\n我们的数据之旅终于接近目的地。随着分析新时代的到来，对数据工程师的需求将继续增长，他们所产生的代码量也会随之增加。对开发、管理和部署大量代码集的需求不断增加，已经在考验现代数据工程师的极限。\n\
  \n幸运的是，一种现代趋势正在迅速兴起，有望减轻可怜数据工程师的许多负担。在本章中，我们将学习使用 CI/CD 管道进行代码交付自动化。简而言之，CI/CD 是一组用于使用小的原子更改更快地集成和交付代码的实践。\n\
  \n在本章中，我们将涵盖以下主题：\n\n+   - 了解 CI/CD\n+   - 设计 CI/CD 管道\n+   - 开发 CI/CD 管道\n\n#####\
  \ 了解 CI/CD\n\n数据转换过程是持续的。在每个现代组织中，数据量和种类都在以非常快的速度增长。因此，创建新数据管道或修改现有数据管道的需求非常高。数据管道代码的突然增长正在考验传统软件交付周期的极限。\n\
  \n因此，组织渴望采用可行的加速产品交付的方法，结合最佳实践和自动化。毕竟，简化软件周期为成功提供了清晰的路径。在我们尝试了解 CI/CD 如何工作之前，了解传统软件交付周期是有意义的。\n\
  \n##### 传统软件交付周期\n\n在开始讨论软件交付的现代方法之前，让我们了解传统方法迄今为止是如何工作的：\n\n![](img/dae8a2243a3c3cbcd9c56ff3d2217672_410_0.png)\n\
  \n图 12.1 – 传统软件交付周期\n\n数据管道的传统软件开发流程通常经历以下阶段：\n\n+   - **开发**：在此阶段，开发人员（数据工程师）创建新的管道或修改现有管道。现有管道的更改可能归因于模式演变或功能更改。完成后，开发人员将其代码合并到现有代码仓库中。其他处理其他管道的开发人员会重复同样的过程。\n\
  +   - **代码打包**：在预先约定的时间表上，可能在敏捷冲刺周期结束时，代码包会发布给 QA 进行测试。\n+   - **QA 部署**：发布部署到测试/QA\
  \ 环境。\n+   - **测试/QA**：QA 团队对所有新代码或修改后的代码进行测试。如果成功，代码将被发布用于生产部署；否则，发布将被拒绝并搁置，直到待处理的错误得到修复。\n\
  +   - **生产部署**：所有通过 QA 的代码都会部署到生产环境。\n\n虽然本质上**简单**，但此流程存在固有**问题**。在前面的图表中，来自多个开发人员的代码集被合并到仓库中以形成**发布**。在质量保证测试阶段，所有开发人员的代码可能都成功通过单元测试，但其中一个失败。不幸的是，由于只有一个代码组件失败，整个发布都需要被拒绝。像这样的情况可能导致不必要的**延迟**和客户**不满**。毋庸置疑，需要设计更好的方法。\n\
  \n##### 现代软件交付周期\n\n现代软件交付流程的主题非常简单 – 频繁地**开发**、**测试**和**集成**小块代码。使用**持续集成**（CI）实践，鼓励开发人员进行小的代码调整，将其代码合并到主代码分支，并使用自动化测试进行验证。这样可以为开发人员提供关于代码组件之间相互依赖关系的快速而简单的反馈机制。它帮助我们快速检测错误，在许多方面使开发人员的生活更轻松。\n\
  \n\n\n\n\n一旦代码成功验证，**持续部署 (CD)** 的实践就会自动将代码部署到测试或生产环境中。这样做为开发人员提供了快速且易于使用的反馈机制，以了解代码在特定环境中的**有效性**：\n\
  \n![](img/dae8a2243a3c3cbcd9c56ff3d2217672_412_0.png)\n\n图 12.2 – 现代软件交付周期\n\n**CI/CD**\
  \ 已被证明可以简化并改善软件交付，同时加快交付速度。如今，组织普遍遵循 **DevOps** 实践。DevOps 促进了一种文化转变，即组织内部开发团队与运维团队之间进行紧密协作。\n\
  \n传统上，创建和管理 CI/CD 管道的工作由 DevOps 团队负责。但随着行业格局的变化，数据工程师正被强烈**鼓励**（更像是强制要求）将这项技能集添加到其现有工作职责中。因此，数据工程师掌握一些\
  \ DevOps 技能变得越来越重要。\n\n> **重要**\n> DevOps 是 **Developer** 和 **Operations** 的缩写，是一种旨在利用工具组合、最佳实践和自动化来加速软件交付的做法。\n\
  \n有多种 DevOps 工具可用于实现 CI/CD 管道，例如 **Jenkins, Chef, 和 CircleCI**。**Azure DevOps**\
  \ 是 Azure 中原生的 SaaS 平台，可为现代开发者提供规划、跨团队协作和无缝代码交付方面的支持。在本章中，我们将使用 Azure DevOps 来创建\
  \ CI/CD 管道。\n\n##### 设计 CI/CD 管道\n\n在深入实际开发和实施 CI/CD 管道之前，我们应先尝试设计其布局。在典型的<|message|>\
  \ 数据分析项目中，开发重点围绕两个关键领域：\n\n- **基础设施部署**：如上一章所述，如今建议使用 **基础设施即代码 (IaC)** 实践进行云部署。基础设施代码过去由\
  \ DevOps 工程师开发，但最近数据工程师也被要求分担这一责任。\n- **数据管道**：数据管道的开发很可能完全由数据工程师负责。所开发的代码包括执行数据收集、摄取、治理、聚合和分发的功能。\n\
  \n遵循持续开发、集成和部署原则，建议的做法是创建两个 CI/CD 管道，我们将其称为 **Electroniz 基础设施 CI/CD 管道** 和 **Electroniz\
  \ 代码 CI/CD 管道。**\n\n> **重要**\n> 采用 CI/CD 更多是一种文化转变而非技术转变。在实施之前，必须获得开发团队和高级管理层的认可。\n\
  \n在高层次上，**Electroniz 基础设施 CI/CD 管道** 将用于部署 Azure 资源，例如 Azure Key Vault、Azure Data\
  \ Lake Storage 和 Azure Synapse。通常，创建和管理此管道的核心责任在于 DevOps 团队。\n\n**Electroniz 代码\
  \ CI/CD 管道** 将用于部署代码片段，例如 SQL 脚本、数据工厂管道和 Spark 笔记本。很可能，创建和管理此管道的核心责任在于数据工程团队。\n\n\
  将这两个管道运行在同一工作区下可促进 DevOps 与数据工程团队之间的协作。两者无需在各自独立的 shell 中工作，而是可以共同协作、分享想法，最重要的是提升其\
  \ **技能集**。这两个管道在以下图表中有所展示：\n\n![](img/dae8a2243a3c3cbcd9c56ff3d2217672_414_0.png)\n\
  \n图 12.3 – CI/CD 管道的推荐设计\n\n> **重要**\n> 在前面的图表中，注意到两个管道如何从同一个 Azure Key Vault 存储和获取\
  \ **密钥**。在创建时安全地存储数据库密码和 API 密钥等密钥，并在运行时动态获取它们，对于控制未经授权的泄露大有裨益。\n\n##### Electroniz\
  \ 基础设施 CI/CD 管道\n\nDevOps/数据工程师将开发代码以启动 Electroniz lakehouse 所需的 Azure 资源。你可能还记得在第\
  \ 11 章《基础设施配置》中，我们使用 IaC 启动了基础设施。那是朝着正确方向迈出的一步，但自动化程度仍不够。在本章中，我们将学习如何使用之前创建的同一套代码来自动化部署过程。以下是基础设施管道的代码结构：\n\
  \n![](img/dae8a2243a3c3cbcd9c56ff3d2217672_415_0.png)\n\n图 12.4 – Electroniz 基础设施\
  \ CI/CD 管道的代码结构\n\n让我们更详细地查看此结构：\n\n- **azure-infra-pipelines.yml**：此文件包含按阶段定义的\
  \ Azure 资源配置。每个阶段通过引用每个资源文件夹中的 JSON 文件来创建新资源。\n- **Azure 资源文件夹**：每个资源文件夹包含以 JSON\
  \ 文件形式定义的资源定义。\n- **参数**：资源名称、位置和环境等全局参数存储在 Azure DevOps 管道库中的 **electroniz_infra_variables**\
  \ 变量组中。\n\n##### Electroniz 代码 CI/CD 管道\n\n数据工程师开发代码以实现数据管道的各个阶段。这使用多种开发工具完成，包括\
  \ Azure Data Factory、Azure Synapse SQL 脚本和 Databricks Spark 笔记本。逐步地，所有这些代码都通过代码\
  \ CI/CD 管道集成并部署到不同环境中：\n\n![](img/dae8a2243a3c3cbcd9c56ff3d2217672_416_0.png)\n\n\
  图 12.5 – Electroniz 代码 CI/CD 管道的代码结构\n\n让我们更详细地查看此结构：\n\n- **azure-code-pipelines.yml**：此文件包含按阶段定义的\
  \ Azure 数据管道配置。每个阶段使用 JSON 文件部署代码。\n- **管道 JSON 文件**：这些文件包含每个管道的定义，作为单独文件以 JSON\
  \ 格式存储。\n- **参数**：资源名称、位置和环境等全局参数存储在 Azure DevOps 管道库中的 **electroniz_code_variables**\
  \ 变量组下。\n\n这两个管道彼此独立运行。Azure Pipeline 包含使用部署文件中的路径包含开关触发独立管道的功能。采用这种方法，多个团队可以同时并发开发代码，而不会相互干扰或依赖。\n\
  \n有了这一理解，我们现在准备开始开发 CI/CD 管道。\n\n##### 开发 CI/CD 管道\n\n在本节中，我们将学习如何创建和部署前面提到的两个 CI/CD\
  \ 管道。我们将使用 Azure DevOps 创建这些 CI/CD 管道。Azure DevOps 是一组用于规划、协作、开发和部署代码的开发者服务。虽然 Azure\
  \ DevOps 支持多种开发者服务，但在本练习中，我们将主要关注 Azure Repos 和 Azure Pipelines。\n\n我知道我们迫不及待地想要开始创建管道，但开始之前需要做一些准备工作。该流程始于创建\
  \ Azure DevOps 组织，这可以通过几个简单的步骤完成。然而，要使用 Azure Pipelines 的免费层，你需要为新创建的 Azure DevOps\
  \ 组织填写免费并行请求表。审批过程可能需要 2-3 天才能完成。\n\n##### 创建 Azure DevOps 组织\n\n按照以下步骤创建 Azure\
