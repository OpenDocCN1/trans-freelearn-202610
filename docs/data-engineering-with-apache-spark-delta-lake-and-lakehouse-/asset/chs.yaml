  \ go!\n\n## Summary\n\nIn this chapter, we learned about Delta Lake, known to be\
  \ the driving force behind the modern lakehouse architecture – it truly enables\
  \ the lakehouse. We learned in detail about some key features of Delta Lake, such\
  \ as ACID compliance and open standards. After that, we performed common data lake\
  \ table operations and showed how Delta Lake controls data isolation and concurrency\
  \ levels.\n\nIn Chapter 7, Data Curation Stage - The Silver Layer, we will put the\
  \ knowledge gained in this chapter to good use. Using Delta Lake, we will create\
  \ the silver layer of the Electroniz lakehouse. You may recall from previous chapters\
  \ that the silver layer in the lakehouse stores the curated, deduplicated, and standardized\
  \ data. The silver layer represents the single source of truth of data, stored in\
  \ a state that is readily consumable by diverse data analytics workloads.\n\n\n\n\
  \n\n### 7\n\n#### 数据治理阶段\n– 银层\n\n数据的旅程现在已进入一个非常关键的阶段。在此阶段，驾驶员（数据工程师）需要仔细规划并操控车辆（数据管道），绕过若干障碍，以确保数据的健全性、耐久性和安全性得以保留。\n\
  \n在上一章中，我们对 Delta Lake 进行了深入探讨。理解 Delta Lake 的功能是一项关键技能，因为它使数据工程师能够设计和开发湖仓的银层。在本章中，我们将进一步加深对如何清洗原始数据的理解。我们将从学习数据治理的需求开始，然后构建一个能够持续且定期执行清洗工作的数据治理管道。\n\
  \n在本章中，我们将涵盖以下主题：\n- 治理原始数据的需求\n- 治理原始数据的流程\n- 开发数据治理管道\n- 为银层运行管道\n- 在银层中验证治理后的数据\n\
  \n##### 治理原始数据的需求\n\n青铜层中的数据本质上是原始的，因为它从多个不同且多样的数据源收集而来。由于数据源的多样性，数据自然会以非标准化、无效、不一致、非统一、重复或不安全的形式交付。在某些其他情况下，原始数据可能包含明文的\
  \ PII 数据，在分析性消费之前应正确进行掩码处理。\n\n> **重要说明**\n> 在大数据中，备受热议的话题之一是可信度——即组织能否信任所收集的数据？如果可以，那么信任程度有多高？\n\
  \n让我们尝试理解一些未清洗数据的特征，以便我们能够正确论证治理数据的理由。\n\n###### 非标准化数据\n\n如今，通常使用 **联机事务处理（OLTP）**\
  \ 应用来收集数据。问题在于，OLTP 应用，例如在不同国家创建的 Web 应用和移动应用，遵循不同的标准。在用户输入时，一些应用可能将名字和姓氏作为两个独立字段接受，而其他应用可能只有一个字段用于两者。在美国，日期格式通常遵循\
  \ MM/DD/YYYY 格式，而许多其他国家更喜欢使用 DD/MM/YYYY。\n\n让我引用一些属于此类范畴的 Electroniz 数据示例。\n\n`store_orders`\
  \ 数据中有一个名为 `order_date` 的列，使用 MM/DD/YYYY 格式：\n\n![](img/dae8a2243a3c3cbcd9c56ff3d2217672_218_0.png)\n\
  \n而电子商务交易中的 order_date 列使用 DD/MM/YYYY 格式：\n\n![](img/dae8a2243a3c3cbcd9c56ff3d2217672_219_0.png)\n\
  \n图 7.2 – DD/MM/YYYY 日期格式的电子商务交易数据\n\n在另一个场景中，store_customers 数据中有一个名为 email 的列，其中包含大小写混合的字符。理想情况下，电子邮件应以小写存储。\n\
  \n![](img/dae8a2243a3c3cbcd9c56ff3d2217672_219_1.png)\n\n图 7.3 – 混合大小写的客户电子邮件\n\n\
  在将此数据提供给终端用户之前，应根据商定的组织政策对其进行适当标准化。\n\n###### 无效数据\n\n无效数据不符合约束条件。这些约束可以有多种类型：\n\
  - **类型**：列应为特定数据类型，例如数值、日期或浮点数。\n- **范围**：列中的数据需要在值范围内。\n- **唯一性**：列中的数据应具有唯一值。\n\
  - **关系**：列不应是孤儿——父表必须存在于父表中。\n\n以下是 Electroniz 商店数据库的实体关系图（ERD）：\n\n> **重要说明**\n\
  > ERD 是数据工程师可视化数据库结构并了解所考虑业务领域知识的重要工具。这些图表还包含有关数据类型的重要信息，这将在开发治理代码时很有用。\n\n![](img/dae8a2243a3c3cbcd9c56ff3d2217672_220_0.png)\n\
  \n图 7.4 – 商店数据库的实体关系图\n\n不幸的是，对 ERD 的仔细研究会发现该数据集在许多方面都存在不足。需要强调该数据集的几个问题：\n- products\
  \ 表中的 product_code 列是 store_orders 表中 product_id 列的父列。根据最佳实践，父表和子表中的列名应相同。\n- 请注意，products.product_code\
  \ 列为字符串数据类型，但它本应与 store_orders.product_id 关联，而后者为整数类型。\n\n> **重要说明**\n> 具有不同数据类型的列相互关联可能导致查询期间出现严重的性能下降。治理阶段是追踪和修复此类问题的理想阶段。\n\
  \n- 经过对数据的仔细审查，发现以下两个订单引用了 `products` 表中不存在的 `product_id` 行。换句话说，它们是 *孤儿* 行。\n\n\
  ![](img/dae8a2243a3c3cbcd9c56ff3d2217672_221_0.png)\n\n图 7.5 – store_orders 中的孤儿行\n\
  \n在将其提供给终端用户之前，我们应排除或修复无效数据。\n\n###### 非统一数据\n\n非统一数据在不同数据集之间以不同的形式存在。我们在青铜层中发现了几个非统一数据的实例：\n\
  - 在 Electroniz `stores` 数据库中，`country` 列在 `store_customers` 表中存在如下：\n\n![](img/dae8a2243a3c3cbcd9c56ff3d2217672_221_1.png)\n\
  \n图 7.6 – store_customers 中的国家/地区数据\n\n而在电子商务交易中，它是这样存在的：\n\n![](img/dae8a2243a3c3cbcd9c56ff3d2217672_221_2.png)\n\
  \n图 7.7 – 电子商务交易中的国家/地区数据\n- 此外，我们注意到 `store_orders` 和电子商务交易使用不同的货币进行——USD、CAD、EUR\
  \ 和 INR。理想情况下，我们应将所有交易转换为统一货币。\n\n在将此数据提供给终端用户之前，我们应使其在所有数据消费层中保持统一。\n\n###### 不一致数据\n\
  \n不一致数据意味着同一数据的不同值存在于两个独立的数据集中。例如，Electroniz `stores` 数据库中的以下客户居住在名为 `Crewe` 的城市：\n\
  \n| email | city | postalcode |\n|---|---|---|\n| lorem@idmagnaet.org | Crewe |\
  \ C56 3CH |\n\n图 7.8 – 商店数据库中客户的数据\n\n同一客户在电子商务商店购买了产品，但声称居住在名为 `Milton Keynes`\
  \ 的不同城市。\n\n| email | city | postalcode |\n|---|---|---|\n| lorem@idmagnaet.org\
  \ | Milton Keynes | C4T 5H5 |\n\n图 7.9 – 电子商务交易中同一客户的数据\n\n在将此数据提供给终端用户之前，我们应使其在所有数据消费层中保持一致。\n\
  \n> **重要说明**\n> 在管道中实现治理逻辑之前，数据工程师应征得组织批准，关于使数据统一、一致、有效和标准化的规则。\n\n###### 重复数据\n\
  \n在瞬息万变的世界中，数据不断演变，从客户更改人口统计数据如地址和电话号码，到订单被购买和退回。捕获和处理更改数据也被称为 **变更数据捕获（CDC）**，一直是数据湖世界中的一个持续挑战。让我用几个例子来解释这一点：\n\
  - 2021 年 4 月 4 日 17:56 在 `stores` 数据库中创建了一个新客户。该记录使用在 2021 年 4 月 4 日 18:00 运行的 `electroniz_batch_ingestion_pipeline`\
  \ 导入到青铜层：\n\n| customer_id | email | customer_name | address | city | updated_at\
  \ |\n|---|---|---|---|---|---|\n| 501 | Phasellus.vitae@vitae.co.uk | Prescott Barnes\
  \ | 960-5386 Vel, Road | Pangnirtung | 2021-04-28T17:56:10.520+0000 |\n\n图 7.10\
  \ – 新客户记录被摄取到 electroniz 湖仓\n\n- 客户发现他的名字未正确输入系统，因此于 2021 年 4 月 4 日 18:30 请求店员进行更改。编辑后的记录使用在\
  \ 2021 年 4 月 4 日 19:00 运行的 `electroniz_batch_ingestion_pipeline` 导入到青铜层：\n\n| customer_id\
  \ | email | customer_name | address | city | updated_at |\n|---|---|---|---|---|---|\n\
  | 501 | Phasellus.vitae@vitae.co.uk | Prescott Barnes Jr. | 960-5386 Vel, Road |\
  \ Pangnirtung | 2021-04-28T18:25:40.927+0000 |\n\n图 7.11 – 编辑后的客户记录被摄取到 electroniz\
  \ 湖仓造成重复\n\n现在，这里的问题是。在商店数据库中，上述记录 *仅存在一次*，但在数据湖青铜层中，同一个人有 *两条* 记录。这些被称为 *重复* 记录。\n\
  \n- `store_orders` 也存在类似问题。以下订单在商店中下单，并使用在 2021 年 4 月 4 日 18:00 运行的 `electroniz_batch_ingestion_pipeline`\
  \ 导入到青铜层：\n\n| order_number | order_date | sale_price | order_mode | updated_at\
  \ |\n|---|---|---|---|---|\n| 500 | 02/16/2016 | 99.63 | NEW | 2021-04-28T17:56:11.093+0000\
  \ |\n| 1254 | 07/26/2016 | 33.70 | NEW | 2021-04-28T17:56:11.220+0000 |\n| 1501\
  \ | 06/23/2017 | 46.69 | NEW | 2021-04-28T17:56:11.273+0000 |\n| 2234 | 03/29/2016\
  \ | 72.15 | NEW | 2021-04-28T17:56:11.387+0000 |\n| 2345 | 10/03/2016 | 40.10 |\
  \ NEW | 2021-04-28T17:56:11.410+0000 |\n\n图 7.12 – 新订单被摄取到 electroniz 湖仓\n\n\n\n\
  \n\n+   - 在执行了某些价格调整后，相同的记录于 2021 年 4 月 4 日 20:00 使用 `electroniz_batch_ingestion_pipeline`\
  \ 运行后以如下方式被摄取到 bronze 层。\n\n| order_number | order_date | sale_price | order_mode\
  \ | updated_at |\n|---|---|---|---|---|\n| 500 | 02/16/2016 | 93.77 | EDIT | 2021-04-28T19:38:49.230+0000\
  \ |\n| 1254 | 07/26/2016 | 49.78 | EDIT | 2021-04-28T19:38:49.217+0000 |\n| 1501\
  \ | 06/23/2017 | 47.65 | EDIT | 2021-04-28T19:38:49.197+0000 |\n| 2234 | 03/29/2016\
  \ | 34.40 | EDIT | 2021-04-28T19:38:49.223+0000 |\n| 2345 | 10/03/2016 | 32.10 |\
  \ EDIT | 2021-04-28T19:38:49.207+0000 |\n\nFigure 7.13 – Edited orders ingested\
  \ into the electroniz lakehouse creating duplicates\n\n与客户类似，订单在 bronze 层中也被重复了。在此数据被使用之前，需要对其进行适当的去重，使得最终用户只能看到记录的最新版本。\n\
  \n## Insecure data\n\n在第 4 章《理解数据管道》中，在发现阶段，Electroniz 提到湖屋必须遵守 PCI 规定，因此所有 PII\
  \ 数据都需要得到适当的屏蔽和加密。在仔细审查数据后，我们发现所有 PII 列在 bronze 层中都以明文形式可见，如下所示：\n\n| customer_id\
  \ | email | customer_name | address | phone | credit_card |\n|---|---|---|---|---|---|\n\
