  \ 3 | Donec.non@dapibusrutrum.com | Bruno Hebert | 8566 Nisi Avenue | 02794 010514\
  \ | 513218470727440 |\n| 4 | nec@lectus.net | Ira Lucas | 936-3011 Convallis Road\
  \ | 1-117-676-2784 | 5164946381862809 |\n| 5 | nec@orci luctuset.co.uk | Hannah\
  \ Ferrell | P.O. Box 755, 7941 Aenean St | 1 (867) 533-2852 | 5256394502723692 |\n\
  | 6 | egestas@Sed eu eros.edu | May Bentley | P.O. Box 507, 7752 A Street | 1 (581)\
  \ 785-4024 | 5553254253392933 |\n| 7 | luctus. ut@eiusmod.com | Tario Sindh | P.O.\
  \ Box 716, 3443 Metus Ave | +61 6777750639 | 5103138625325504 |\n\nFigure 7.14 –\
  \ Unmasked data in the electroniz lakehouse\n\n在使其可供最终用户使用之前，不安全的数据需要在所有数据消费层中得到适当的屏蔽：\n\
  \n> **Important note**\n> 为了保护个人隐私，**《通用数据保护条例》(GDPR)** 强制要求所有收集、存储和处理 PII 数据的组织必须对数据进行屏蔽。\n\
  \n## The process of curating raw data\n\n到目前为止，希望大家能够很容易地想象到数据整理的需求是非常真实的。现在，让我们专注于实现这一目标的实际流程。\n\
  \n![](img/dae8a2243a3c3cbcd9c56ff3d2217672_225_0.png)\n\n## Inspecting data\n\n\
  数据整理的过程始于检查样本数据。通常，这是数据工程师和客户团队成员之间的共同努力。你可以先通过视觉方式检查涵盖多样化数据源的数据，尽管在许多情况下你可能需要实现编程逻辑来发现非标准化、无效、不一致、非统一、重复或不安全的数据。\n\
  \n交付物：详细报告，列出所有需要进行数据整理的情况，并包括修复每种情况的计划。在报告中，欢迎包含用于解决特定情况的业务逻辑的伪代码，如下所示：\n\n```\n\
  IF raw_data.country IN ('USA', 'United States', 'United States of America') THEN\n\
  \    curated_data.country = 'USA'\n```\n\n## Getting approval\n\n在检查阶段创建的报告应正式提交给客户团队进行审查和批准。这确保客户同意将实施的业务逻辑来整理数据。\n\
  \n交付物：客户团队的正式批准。\n\n## Cleaning data\n\n一旦获得批准，就该开始实际实施实现数据整理的业务逻辑了。作为数据工程师，你可以自由选择多种框架、语言和工具来使用，尽管最好使用客户熟悉的东西。一般来说，最常用的两种是\
  \ Apache Spark 和 SQL。一旦整理逻辑开发完成，它就会集成到整理管道中。\n\n**Deliverable:** Logic that implements\
  \ the curation.\n\n## Verifying data\n\n数据整理的最后一步是验证整理逻辑是否按预期工作。通常，此活动应由客户团队成员执行，因为他们更接近数据，因此比数据工程师更有可能更好地理解数据。\n\
  \n**Deliverable:** Formal approval by the Customer Team.\n\n> **Important note**\n\
  > 从一个项目到另一个项目，数据工程师学会识别需要整理的数据中的常见趋势。在某些情况下，立即开始修复数据很诱人，但同样重要的是遵循定义良好的整理流程。\n\n\
  现在我们对数据整理的需求有了充分的理解，并且对流程有了扎实的理解，让我们构建一个实际的整理管道。为简单起见，我们假设在遵循整理流程后，我们已根据 *Need for\
  \ Curating Raw Data* 部分概述的发现向 Electroniz 提交了报告。Electroniz 团队已审查了报告并给予我们最终批准继续下一步。因此，我们将使用\
  \ Apache Spark 在 **Azure Databricks** 上开始开发整理逻辑。\n\n## Developing a data curation\
  \ pipeline\n\n我们准备开始开发 Electroniz 整理管道的开发。数据现在将从未清洗的状态转变为更清洗和可用的状态。我之前承诺会让你了解架构图中的哪个区域正在被处理，这里就是：\n\
  \n![](img/dae8a2243a3c3cbcd9c56ff3d2217672_227_0.png)\n\nFigure 7.16 – Electroniz\
  \ curation pipeline\n\n在下一节中，我们将创建前面图中突出显示的整理管道。\n\n## Preparing Azure resources\n\
  \n我们将首先准备所需资源，如下所示：\n\n+   1. 我们将首先在 Azure 数据湖存储中为 silver 层创建一个新的命名空间。\n\n我之前提到过\
