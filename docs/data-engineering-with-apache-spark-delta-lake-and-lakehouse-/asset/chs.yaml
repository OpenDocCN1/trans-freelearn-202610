  \ Parquet 文件存储。\n\n> **重要说明**\n> Apache Parquet 是一种开源的列式存储格式。由于其更小的占用空间和高效的 I/O\
  \ 利用率，Parquet 对于查询来说极其高效。\n\n- 3. 返回笔记本。现在，让我们从存储中读取 delta 表。调用以下指令直接从笔记本读取 `store_orders`\
