  \ CI/CD 管道。出于明显的原因，我们选择先开发基础设施管道。原因是代码管道直接依赖于由基础设施管道创建的 Azure 资源。让我们开始吧：\n\n1. 你可能还记得，推荐的管道设计包含一个\
  \ Azure Key Vault 来存储 CI/CD 管道的密钥。在 Azure Cloud Shell 中运行以下命令来创建一个：\n\n```\nRESOURCEGROUPNAME=\"\
  elz_prod\"\nLOCATION=\"eastus\"\nIAC_ENVIRONMENT=prod\nKEYVAULTNAME=\"deploykvelz\"\
  \naz group create --name $RESOURCEGROUPNAME --location $LOCATION\naz keyvault purge\
  \ -n $KEYVAULTNAME\naz config set extension.use_dynamic_install=yes_without_prompt\n\
  az keyvault create --location $LOCATION --name $KEYVAULTNAME --resource-group $RESOURCEGROUPNAME\
  \ --enabled-for-template-deployment true\n```\n\n2. 我们现在将向新创建的 Azure Key Vault 添加几个密钥。使用\
