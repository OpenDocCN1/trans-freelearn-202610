  ### Testing the batch ingestion pipeline for incremental data\n\n我们现在将检查管道对商店数据库中增量数据的反应。为此，我们将模拟对数据库的更改，包括插入、更新和删除。之后，我们将重新触发\
  \ electroniz_batch_ingestion_pipeline 三次，并验证新添加的数据是否已成功传输到湖仓。\n\n### The second\
  \ run of the pipeline – inserts\n\n目前，初始摄取后的第一个小时正在进行。我们假设此时，sales 数据库已完全运行，并且正在插入新客户和订单。为了模拟插入活动，让我们在\
  \ sales 数据库中插入一些数据：\n\n- 1. 返回 Azure SQL 数据库并检查最新的水印。\n\n导航到 Home | All Resources\
