  \n图 8.38 – 使用 CTAS 创建的聚合表的持久化数据\n\n你可以自行查询更多外部表和视图以进一步增强信心。此时，我们可以推断 Azure Synapse\
  \ 中的数据已准备好供终端用户查询。但仍有一个问题未得到解答：湖屋中的数据是否满足 Electroniz 终端用户的需求？我们是否满足了客户的期望？我们即将揭晓！\n\
  \n#### 满足客户期望\n\n根据前一节所示的结果，我们可以安全地推断，我们可以成功地从 Electroniz 湖屋的银层和金层查询数据。这无疑是一个巨大的技术胜利；然而，真正的问题是从业务角度来看，我们是否满足了客户的期望。\n\
  \n在深入验证业务需求之前，我们需要确定是否已为终端用户，例如数据分析师、数据科学家和商业智能工程师提供了足够的访问权限。最终，终端用户将使用湖屋来满足其多样化的分析需求，因此应妥善解决他们的需求。\n\
  \n让我们重点验证项目开始时 **Electroniz** 提出的业务需求：\n\n- 1. 首先，Electroniz 希望建立一个近实时销售分析平台，能够更快、更好地满足其客户需求。\n\
  \n你可能还记得 **Electroniz** 既在店内销售产品，也在线销售。在构建青铜层时，我们从两个来源摄取了销售数据。为了提供包含 **店内** 和 **在线**\
  \ 销售数据的近实时分析，我们将销售数据聚合到一个名为 **orders** 的公共视图中。该视图是在 **create_silver_views** 存储过程中创建的，该过程通过\
  \ **electroniz_aggregation_pipeline** 中的 **Create Silver Layer Views** 活动调用：\n\n\
  ```\nEXEC sp_executesql N'DROP VIEW IF EXISTS store_orders'\nSET @sqlcmd = N'CREATE\
  \ OR ALTER VIEW store_orders AS\nSELECT * FROM openrowset(\nBULK '\" + @silverns\
  \ + '/sales/store_orders/\"', data_source = '\"trainingds\"', FORMAT = '\"delta\"\
  ')\nAS rows'\nEXEC sp_executesql @sqlcmd\n\nEXEC sp_executesql N'DROP VIEW IF EXISTS\
  \ ecomm_orders'\nSET @sqlcmd = N'CREATE OR ALTER VIEW ecomm_orders AS\nSELECT order_number,\
  \ ...\nFROM openrowset(\nBULK '\" + @silverns + '/sales/store_orders/\"', data_source\
  \ = '\"trainingds\"', FORMAT = '\"delta\"')\nWITH ( order_number INT, product_name\
  \ NVARCHAR(MAX), order_date DATE, order_mode NVARCHAR(MAX), email NVARCHAR(MAX),\
  \ sale_price FLOAT, sale_price_usd FLOAT, updated_at DATETIME )\n) AS rows'\nEXEC\
  \ sp_executesql @sqlcmd\n\nEXEC sp_executesql N'DROP VIEW IF EXISTS orders'\nSET\
  \ @sqlcmd = N'CREATE OR ALTER VIEW orders AS\nSELECT order_number, product_name,\
  \ order_date, units, sale_price, order_mode, sale_price_usd, dbo.store_orders.updated_at\n\
  FROM dbo.store_orders\nJOIN dbo.customers ON dbo.customers.customer_id = dbo.store_orders.customer_id\n\
  JOIN dbo.products ON dbo.products.product_id = dbo.store_orders.product_id\nUNION\
  \ ALL\nSELECT order_number, email, product_name, order_date, 1 AS units, sale_price,\
  \ order_mode, sale_price_usd, updated_at\nFROM dbo.ecomm_orders'\nEXEC sp_executesql\
  \ @sqlcmd\n```\n\n图 8.39 – 创建 orders 视图的 SQL\n\n同一个视图还用于按季度聚合销售数据并发布为 **ext_aggregated_sales**。该表是在\
  \ **create_gold_tables** 存储过程中创建的，该过程通过 **electroniz_aggregation_pipeline** 中的 **Create\
  \ Gold Layer Tables** 活动调用：\n\n```\nSET @sqlcmd = N'CREATE EXTERNAL TABLE ext_aggregated_sales\n\
  WITH (\nLOCATION = '\" + @goldns + '/external/ext_aggregated_sales/\"',\nDATA_SOURCE\
  \ = '\" + @extds + '\"',\nFILE_FORMAT = '\" + @format + '\"'\n)\nAS SELECT YEAR(order_date)\
  \ AS year, DATEPART(QUARTER, order_date) as quarter,\nround(sum(sale_price_usd),2)\
  \ as aggregated_sales_price\nFROM orders\nGROUP BY YEAR(order_date), DATEPART(QUARTER,\
  \ order_date) '\nEXEC sp_executesql @sqlcmd\n```\n\n图 8.40 – ext_aggregated_sales\
  \ 外部表的 SQL\n\n以下来自 ext_aggregated_sales 的查询将显示按季度汇总的销售数据：\n\n```\nSELECT [year],\
  \ [quarter], [aggregated_sales_price]\nFROM [dbo].[ext_aggregated_sales]\nORDER\
  \ BY 1 DESC, 2 ASC\n```\n\n这将产生以下输出：\n\n```\n1  SELECT [year], [quarter], [aggregated_sales_price]\n\
  2  FROM [dbo].[ext_aggregated_sales]\n3  ORDER by 1 DESC, 2 ASC\n```\n\n![](img/dae8a2243a3c3cbcd9c56ff3d2217672_295_0.png)\n\
  \n图 8.41 – 按季度汇总的销售额\n\n- 2. 让我们开心一下，将其可视化为条形图。点击 **Chart** 并根据以下截图更改变量。正如你所见，**Electroniz**\
  \ 的终端用户现在可以轻松按年/季度可视化汇总销售额，以近实时增强其决策能力：\n\n![](img/dae8a2243a3c3cbcd9c56ff3d2217672_296_0.png)\n\
  \n图 8.42 – 按季度销售额图表\n\n- 3. **Electroniz** 还希望通过基于其电子商务网站用户点击次数的智能分析来简化广告预算。他们希望\
  \ **广告** 和 **营销** 资金能够按国家/地区分配，并以其电子商务网站收到的用户点击次数为依据。\n\n我们为此业务需求创建了几个外部表。第一个外部表名为\
  \ ext_total_website_hits，它按国家/地区汇总点击次数，其中至少收到 1,000 次点击。Electroniz 已决定，少于 1,000\
  \ 次点击的数字不足以影响其决策：\n\n> 重要\n> 像这样来自客户的输入对于项目的整体成功至关重要。这就是为什么我之前提到聚合过程是客户和数据工程师共同的责任。\n\
  \n```\nSET @sqlcmd = N'CREATE EXTERNAL TABLE ext_total_website_hits\nWITH (\n  \
  \  LOCATION = ''\" + @golds + '/external/ext_total_website_hits/''',\n    DATA_SOURCE\
  \ = ' + @extds + ',\n    FILE_FORMAT = ' + @format + '\n)\nAS\nSELECT SUM(hits)\
  \ AS total_hits FROM\n(SELECT country_name, count(*) AS hits\nFROM logs\nGROUP BY\
  \ country_name\nHAVING count(*) > 1000) as webhits'\nEXEC sp_executesql @sqlcmd\n\
  \nSET @sqlcmd = N'CREATE EXTERNAL TABLE ext_advertising_budgets\nWITH (\n    LOCATION\
  \ = ''\" + @golds + '/external/ext_advertising_budgets/''',\n    DATA_SOURCE = '\
  \ + @extds + ',\n    FILE_FORMAT = ' + @format + '\n)\nAS SELECT country_name, hits,\
  \ (hits*100/total_hits) AS advtg_budget\nFROM\n(SELECT country_name, count(*) as\
  \ hits, (SELECT total_hits from ext_total_website_hits) AS total_hits\nFROM logs\n\
  GROUP BY country_name\nHAVING count(*) > 1000) AS agg_hits '\n```\n\n图 8.43 – 聚合广告预算的\
  \ SQL\n\n第二个外部表名为 ext_advertising_budgets，它根据日志视图按国家/地区汇总网站点击次数。这些外部表是在 create_gold_tables\
  \ 存储过程中创建的，该过程通过 electroniz_aggregation_pipeline 中的 Create Gold Layer Tables 活动调用：\n\
  \n```\nSELECT TOP (100) [country_name]\n, [hits]\n, [advtg_budget]\nFROM [dbo].[ext_advertising_budgets]\n\
  ORDER BY 3 DESC\n```\n\n未来，终端用户可以使用上述查询轻松分配基于用户点击次数支持的广告和营销预算百分比：\n\n```\nSELECT\
  \ TOP (100) [country_name] ,[hits] ,[advtg_budget]\nFROM [dbo].[ext_advertising_budgets]\n\
  ORDER BY 3 DESC\n```\n\n| country_name | hits | advtg_budget |\n|---|---|---|\n\
  | United States of America | 24690 | 57 |\n| China | 6936 | 16 |\n| Japan | 2272\
  \ | 5 |\n| Germany | 2323 | 5 |\n| United Kingdom of Great Britain ... | 2029 |\
  \ 4 |\n| Korea (Republic of) | 1829 | 4 |\n| France | 1585 | 3 |\n| Italy | 1063\
  \ | 2 |\n\n图 8.44 – 聚合网站点击次数和预算分配\n\n点击 Chart 并根据以下截图更改提供的变量。通过这样做，Electroniz 的终端用户可以轻松可视化广告和营销资金的按国家/地区分配：\n\
  \n\n\n```\nSELECT TOP (100) [country_name] ,[hits] ,[advtg_budget]\nFROM [dbo].[ext_advertising_budgets]\n\
  ```\n\n![](img/dae8a2243a3c3cbcd9c56ff3d2217672_299_0.png)\n\nFigure 8.45 – Chart\
  \ of advertising budget allocation per country\n\n4. Electroniz 提出的最终核心需求是减少因库存短缺导致订单履行中断而产生的客户不满。他们希望能够近乎实时地查看所售产品，以便清楚了解库存下降情况并适当地补货。\n\
  \n为满足该需求，我们创建了一个名为 ext_aggregated_products_by_quarter 的聚合外部表。该表报告每季度售出的产品数量。这些信息为决策者提供了在任何给定时间库存耗尽程度的清晰了解，以便他们能够就未来的采购和补货采取适当行动。该表是在\
  \ create_gold_tables 存储过程中创建的，该存储过程通过 electroniz_aggregation_pipeline 中的 Create\
  \ Gold Layer Tables 活动调用。\n\nElectroniz 的终端用户可以调用以下查询来显示其库存水平的当前状态：\n\n```\nSELECT\
  \ TOP (100) [product_category]\n, [product_name]\n, [year]\n, [quarter]\n, [units_sold]\n\
  FROM [dbo].[ext_aggregated_products_by_quarter]\nWHERE year=2021\nORDER BY 3 DESC,\
  \ 2 ASC\n```\n\n这将产生以下输出：\n\n![](img/dae8a2243a3c3cbcd9c56ff3d2217672_300_0.png)\n\
  \nFigure 8.46 – Aggregated products sold in the recent quarter\n\n点击 **Chart** 并根据以下屏幕截图更改提供的变量。**Electroniz**\
  \ 的终端用户可以轻松可视化每种产品的所需库存：\n\n![](img/dae8a2243a3c3cbcd9c56ff3d2217672_301_0.png)\n\
  \nFigure 8.47 – Chart of products sold in the recent quarter\n\n我认为我们的工作做得非常出色；你可以庆祝了，数据工程师先生！前述的报告和可视化足以证明我们在满足客户期望方面做得很好。这些结果应以现场演示的形式与客户管理团队共享。我们当然可以庆祝这一胜利，但我们的工作尚未完成。\n\
  \n现在，我们需要确保摄取、治理和聚合管道作为一个整体单元工作。这意味着我们现在将关注基础设施和代码部署。\n\n## Summary\n\n在本章中，我们学习了如何构建湖屋的金层，该层存储聚合数据。我们还了解到数据聚合是客户与数据工程师之间的协作工作，双方各自提供对项目整体成功至关重要的一套专业技能。本章末尾，我们尝试验证我们是否成功解决了为\
  \ **Electroniz** 构建湖屋的业务需求。\n\n在 *Chapter 9, Deploying and Monitoring Pipelines\
  \ in Production* 中，我们将依次部署本章中创建的三个管道，即 **electroniz_ingestion_pipeline**、**electroniz_curation_pipeline**\
  \ 和 **electroniz_aggregation_pipeline**。这将确保在每次调用时，它们都能作为一个整体单元工作，以实现整体目标。\n\n##\
  \ Section 3:\nData Engineering\nChallenges and Effective\nDeployment Strategies\n\
  \n本书的这一部分向您介绍数据工程专业人员面临的挑战。介绍了 Delta Lake 的概念。最后，将通过真实案例突出一系列数据工程挑战，并说明 Delta Lake\
  \ 如何有效应对这些问题。\n\n本节还向您介绍数据湖的有效部署策略。一旦构建了处理数据工程各个阶段的各个代码组件，这些策略在按可重复和持续的方式配置云资源并部署数据管道方面发挥着重要作用。\n\
  \n本节包含以下章节：\n\n+   - Chapter 9, Deploying and Monitoring Pipelines in Production\n\
  +   - Chapter 10, Solving Data Engineering Challenges\n+   - Chapter 11, Infrastructure\
  \ Provisioning\n+   - Chapter 12, Continuous Integration and Deployment (CI/CD)\
  \ of Data Pipelines\n\n### 9\nDeploying and Monitoring Pipelines in Production\n\
  \n数据的旅程即将接近目的地。在上一章中，我们学习了数据聚合以及如何构建湖屋的金层。金层中的数据是汇总数据的表示，每次摄取新数据时都会发生变化。因此，这是一个循环过程。现在我们已经构建并测试了\
  \ Electroniz 湖屋所需的所有组件，我们需要开始考虑在生产环境中部署管道，以便以最及时和持久的方式满足终端用户的需求。\n\n在本章中，我们将涵盖以下主题：\n\
  \n+   - The deployment strategy\n+   - Developing the master pipeline\n+   - Testing\
  \ the master pipeline\n+   - Scheduling the master pipeline\n+   - Monitoring pipelines\n\
  \n#### The deployment strategy\n\n我们付出了极大的努力，才达到了拥有三个功能管道的地步，如下所示：\n\n+   - **The\
  \ Electroniz ingestion pipeline:** `electroniz_batch_ingestion_pipeline`\n+   -\
  \ **The Electroniz curation pipeline:** `electroniz_curation_pipeline`\n+   - **The\
  \ Electroniz aggregation pipeline:** `electroniz_aggregation_pipeline`\n\n作为回顾，在最近几章中，我们遵循了多个步骤来创建这些管道。创建后，我们手动调用每个管道以进行单元测试其功能。最后，我们验证了每个管道产生的数据，以确保其符合\
  \ **Electroniz** 用例的预期。这是一项大量工作，因此我们应该为取得如此大的进展而感到自豪。\n\n假设我们对前述管道执行的单元测试结果感到满意，现在是时候开始思考在生产环境中部署这些管道的最佳方式了。根据最佳实践，三个管道应作为一个完整单元运行。每次管道运行，也称为作业，应通过调用摄取管道从各种源提取增量数据来工作。随后调用治理管道，对数据进行清洗并合并到\
  \ **Delta Lake** 表中。最后，聚合管道对数据进行汇总以供终端用户使用。\n\n通常，管道以以下两种方式部署，如下所述。\n\n#### The\
  \ time-based method\n\n在 **time-based method** 中，每个管道单独部署并根据时间驱动方式调用。例如，您可以在凌晨 12:00\
  \ 调用摄取管道，在凌晨 12:20 调用治理管道，在凌晨 12:30 调用聚合管道。以下是该方法的一些优缺点列表：\n\n+   - **The overall\
  \ deployment is simple:** 您只需在指定时间安排每个管道。\n+   - **It requires time precision:**\
  \ 每个管道的调用时间需要仔细计算；否则，它们可能会相互重叠。您不希望第二个管道在第一个管道完成之前就开始。\n\n+   - **There is less\
  \ control:** 总体而言，对管道成功的控制较少，因为每个管道单独运行，彼此之间没有任何依赖关系：\n\n![](img/dae8a2243a3c3cbcd9c56ff3d2217672_307_0.png)\n\
  \nFigure 9.1 – The time-based method of deploying pipelines\n\n#### The event-based\
  \ approach\n\n在 **event-based method** 中，创建一个主管道，根据成功和失败事件运行所有其他管道。例如，首先调用摄取管道。然后，在成功后调用治理管道。然后，在成功后调用聚合管道。以下是该方法的一些优缺点列表：\n\
  \n+   - **It requires a master pipeline:** 在此方法中，需要一个主管道来编排所有其他管道的运行。\n\n+   - **Time\
  \ precision is less of a concern:** 在此方法中，只有主管道安排其他管道。一旦被调用，主管道以受控的方式控制所有其他管道的运行，该方式由事件驱动。\n\
  \n\n\n\n\n- **增强控制**：与基于时间的方法相比，此方法提供更多控制。后继管道要等到前置管道完成才开始：\n\n![](img/dae8a2243a3c3cbcd9c56ff3d2217672_308_0.png)\n\
  \n图 9.2 – 基于事件的管道部署方法\n\n基于事件的方法更可取，因为它能更好地控制管道最终的成功。出于前面所述的原因，让我们使用这种方法来部署 Electroniz\
  \ 管道。在下一节中，我们将开始创建主管道，该管道将调用其余管道。\n\n##### 开发主管道\n\n要开始创建主管道，请确保 `electroniz_batch_ingestion_pipeline`、`electroniz_curation_pipeline`\
  \ 和 `electroniz_aggregation_pipeline` 管道已安装并在 Azure 数据工厂中正常运行：\n\n![](img/dae8a2243a3c3cbcd9c56ff3d2217672_309_0.png)\n\
  \n图 9.3 – Electroniz 摄取、整理和聚合管道\n\n我们将通过执行以下步骤开始：\n\n- 1. 使用 Azure 门户，导航到 Home >\
  \ All Resources > trainingdatafactory100。单击 Open Azure Data Factory Studio 下方的 Open。\n\
  - 2. 使用左侧面板，从菜单中单击 Author。在 Factory Resources 面板中，单击 Pipelines 右侧的三个点并选择 New Pipeline。\n\
  \n在 Properties 面板中输入以下内容：\n\n- - Name: electroniz_master_pipeline\n- - Description:\
  \ This pipeline runs the ingestion, curation, and aggregation pipeline.\n\n使用底部面板，单击\
  \ Parameters 并添加以下参数：\n\n- - Name: STORAGE_ACCOUNT Type: String\n- - Name: BRONZE_LAYER_NAMESPACE\
  \ Type: String\n- - Name: STORE_SALES_FOLDER Type: String\n- - Name: TABLE_LIST\
  \ Type: String\n- - Name: CURRENCY_LIST Type: String\n- - Name: CURRENCY_FOLDER\
  \ Type: String\n- - Name: GEOLOCATION_FOLDER Type: String\n- - Name: LOGS_FOLDER\
  \ Type: String\n- - Name: ECOMM_FOLDER Type: String\n- - Name: EXT_TAB_FILE_FORMAT\
  \ Type: String\n\n- - Name: EXT_DATA_SOURCE  Type: String\n- - Name: EXT_CREDENTIALS\
  \  Type: String\n- - Name: EXT_TAB_LOCATION  Type: String\n- - Name: SILVER_LAYER_NAMESPACE\
  \  Type: String\n- - Name: GOLD_LAYER_NAMESPACE  Type: String:\n\n![](img/dae8a2243a3c3cbcd9c56ff3d2217672_310_0.png)\n\
  \n图 9.4 – 主管道参数\n\n3. 现在，单击 Activities 部分中的空白区域。在 Activities 面板中搜索 Execute。现在，将\
  \ Execute Pipeline 活动拖到右侧面板：\n\n- - Name: Run electroniz_batch_ingestion_pipeline.\n\
  - - Click on Settings.\n- - For Invoked Pipeline, choose electroniz_batch_ingestion_pipeline\
  \ from the drop-down menu.\n\n- - Wait on completion: Checked:\n\n![](img/dae8a2243a3c3cbcd9c56ff3d2217672_311_0.png)\n\
  \n图 9.5 – 配置 Run electroniz_batch_ingestion_pipeline\n\n4. 在 Activities 面板中搜索 Execute。现在，将\
  \ Execute Pipeline 活动拖到右侧面板：\n\n- - Name: Run electroniz_curation_pipeline\n\n-\
  \ - Click on Settings.\n\n- - For Invoked Pipeline, choose electroniz_curation_pipeline\
  \ from the drop-down menu.\n\n- - Wait on completion: Checked\n\n在 Parameters 部分，添加以下参数：\n\
  \n- - Name: STORAGE_ACCOUNT Type: String\n  Value: @pipeline().parameters.STORAGE_ACCOUNT\n\
  \n- - Name: BRONZE_LAYER_NAMESPACE Type: String\n  Value: @pipeline().parameters.BRONZE_LAYER_NAMESPACE\n\
  \n- - Name: SILVER_LAYER_NAMESPACE Type: String\n  Value: @pipeline().parameters.SILVER_LAYER_NAMESPACE\n\
  \n- - Name: STORE_SALES_FOLDER Type: String\n  Value: @pipeline().parameters.STORE_SALES_FOLDER\n\
  \n- - Name: ADLS_FOLDER Type: String\n  Value: @{formatDateTime(utcnow(), 'yyyy')}/@{formatDateTime(utcnow(),\
  \ 'MM')}/@\n\n```\n{formatDateTime(utcnow(),'dd')}/@\n{formatDateTime(utcnow(),'HH')}\n\
  ```\n\n- - Name: TABLE_LIST  Type: String\n  Value: @pipeline().parameters.TABLE_LIST\n\
  - - Name: CURRENCY_LIST  Type: String\n  Value: @pipeline().parameters.CURRENCY_LIST\n\
  - - Name: CURRENCY_FOLDER  Type: String\n  Value: @pipeline().parameters.CURRENCY_FOLDER\n\
  - - Name: GEOLOCATION_FOLDER  Type: String\n  Value: @pipeline().parameters.GEOLOCATION_FOLDER\n\
  - - Name: LOGS_FOLDER  Type: String\n  Value: @pipeline().parameters.LOGS_FOLDER\n\
  - - Name: ECOMM_FOLDER  Type: String\n  Value: @pipeline().parameters.ECOMM_FOLDER:\n\
  \n| Parameters |  |  |  |\n|---|---|---|---|\n| Name | Type | Value | Default value\
  \ |\n| STORAGE_ACCOUNT | string | @pipeline().parameters.STORAGE_ACC... |  |\n|\
  \ BRONZE_LAYER_NAMESPACE | string | @pipeline().parameters.BRONZE_LAYE... |  |\n\
