  \n图 8.25 – 最终的 electroniz_aggregation_pipeline\n\n此时，我们已准备好对 electroniz_aggregation_pipeline\
  \ 进行单元测试。\n\n#### 运行聚合管道\n\n在生产环境中，聚合管道将在 curation pipeline 成功完成后自动调用。由于我们处于单元测试阶段，目前我们将手动触发它。让我们开始：\n\
  \n- 1. 你必须在 Azure Cloud Shell 上执行以下命令。它们将根据我们传递的参数调用 **electroniz_aggregation_pipeline**。请确保根据提供的说明编辑\
  \ **EXT_TAB_LOCATION**。使用 Azure 门户，导航到你的 Azure Data Lake Storage 账户，路径为 **Home >\
  \ All Resources > traininglakehouse > Endpoints.**\n  \n  注意 **Blob Service** 的\
  \ URL 并用此编辑 EXT_TAB_LOCATION：\n\n```\nRESOURCEGROUPNAME=\"training_rg\"\nDATAFACTORYNAME=\"\
  traininglakehousedf\"\nPIPELINENAME=\"electroniz_batch_aggregation_pipeline\"\n\
  az datafactory pipeline create-run --factory-name $DATAFACTORYNAME --name $PIPELINENAME\
  \ --resource-group $RESOURCEGROUPNAME \\\n--parameters \"{\\\"EXT_TAB_FILE_FORMAT\\\
  \":\\\"parquetformat\\\", \\\"EXT_DATA_SOURCE\\\":\\\"trainingds\\\", \\\"EXT_CREDENTIALS\\\
  \":\\\"trainingcreds\\\", \\\"EXT_TAB_LOCATION\\\":\\\"https://traininglakehouse.blob.core.windows.net\\\
  \", \\\"SILVER_LAYER_NAMESPACE\\\":\\\"silver\\\", \\\"GOLD_LAYER_NAMESPACE\\\"\
  :\\\"gold\\\" }\"\n```\n\n- 2. 要验证管道是否成功运行，你可以检查管道的状态：\n\n  - 使用 Azure 门户，导航到 **Home\
  \ > All Resources > trainingdatafactorydf.**\n  - 点击 **Monitor > Pipeline Runs.**\n\
  \  - 点击 **electroniz_batch_aggregation_pipeline**：\n\n![](img/dae8a2243a3c3cbcd9c56ff3d2217672_284_0.png)\n\
  \n图 8.26 – 监控 electroniz_aggregation_pipeline 的运行\n\n正如你所见，我们可以安全地推断 **electroniz_batch_aggregation_pipeline**\
  \ 已成功完成。然而，这并不意味着它完成了预期的工作。为了确定，我们需要验证 Azure Synapse 中的聚合数据。\n\n#### 了解数据消费\n\n\
  在开始验证聚合数据之前，我们应关注我们的终端用户将如何消费数据用于仪表板、ML 和 AI 目的。根据 **Electroniz** lakehouse 的架构，我们决定发布来自\
  \ gold 和 silver 层的数据。\n\n发布 gold 层的数据是必要的；否则，用户如何访问聚合数据？但为什么我们需要发布 silver 层的数据？你猜对了\
  \ – 分析是一个持续的过程。未来，用户可能希望为公司改进创建新的仪表板和 ML 模型。\n\n> **Important**\n> 发布 gold 和 silver\
  \ 层的数据是可以接受的，因为它们存储的数据处于干净且安全的状态。但对于 bronze 层的数据则不能这样说。发布原始/未清理的数据不仅会给终端用户带来大量关于标准化、验证和去重的工作，而且还会暴露本应受到保护的分类信息。\n\
  \n下图显示了 lakehouse 的结构：\n\n![](img/dae8a2243a3c3cbcd9c56ff3d2217672_285_0.png)\n\n\
  图 8.27 – Electroniz 为终端用户的数据发布点\n\n我们对 Electroniz 的承诺是，到项目结束时，终端用户不仅能够访问 gold 层中的聚合数据，还能访问\
  \ silver 层中的 curated 数据以便临时访问。此外，未来会有新的聚合和 ML 模型需求，这将需要访问 curated 数据。\n\n你可能已经注意到，在创建\
  \ electroniz_batch_aggregation_pipeline 时，管道中定义了一系列活动。这些活动最终会在 Azure Synapse 中创建视图和外部表。了解\
  \ lakehouse 中的数据如何为终端用户发布非常重要。提供了以下数据：\n\n- Access to Silver Layer Data: 为了访问 curated\
  \ 数据，我们在 Azure Synapse serverless SQL pool 中提供了 EXTERNAL TABLES 和 VIEWS。如前所述，并非所有聚合都能在项目初期预测。访问\
  \ silver 层中的数据将使终端用户能够执行临时查询并在未来创建新的聚合。\n\n- **Access to Gold Layer Data:** 我们通过在\
  \ **Azure Synapse serverless SQL pool** 中使用 **EXTERNAL TABLES** 为 gold 层的聚合表提供了访问权限。这些外部表是使用\
  \ **CREATE EXTERNAL TABLE AS SELECT (CETAS)** 创建的，并且查询结果被保存（持久化）在 **Azure Data Lake\
  \ Storage Gen2** 中的 gold 层。由于聚合数据保存在 gold 层，这大大提高了查询处理时间：\n\n![](img/dae8a2243a3c3cbcd9c56ff3d2217672_286_0.png)\n\
  \n上图显示了在 **electroniz_batch_aggregation_pipeline** 中外部视图和表是如何创建的。\n\n#### 访问 silver\
  \ 层数据\n\n**Create Silver Layer Views** 调用 Azure Synapse 中名为 **create_silver_views**\
  \ 的存储过程。此存储过程的代码可在以下位置获取：\n\n```\nhttps://github.com/PacktPublishing/Data-Engineering-with-Apache-Spark-Delta-Lake-and-Lakehouse/blob/main/project/aggregation/sql/create_silver_views.sql.\n\
  ```\n\n\n\n\n\n查看以下 SQL。你会注意到外部表和视图的组合是如何工作的：\n\n```\nEXEC sp_executesql N'IF EXISTS\
  \ ( SELECT * FROM sys.external_tables WHERE object_id = OBJECT_ID(''store_customers'')\
  \ )\nSET @sqlcmd = 'CREATE EXTERNAL TABLE store_customers'([customer_id] INTEGER\
  \ ,[customer_name] VARCHAR(255) ,[address] VARCHAR(255) ,\n[city] VARCHAR(255) ,[postalcode]\
  \ VARCHAR(10) ,[country] VARCHAR(100) ,\n[phone] VARCHAR(100) ,[email] VARCHAR(255)\
  \ ,[credit_card] VARCHAR(255) ,\n[updated_at] DATETIME)\nWITH (LOCATION = '' + @silverns\
  \ + ''/sales/store_customers'', data_source = trainingds, FILE_FORMAT = DeltaLakeFormat)';\n\
  EXEC sp_executesql @sqlcmd\n\nEXEC sp_executesql N'IF EXISTS ( SELECT * FROM sys.external_tables\
  \ WHERE object_id = OBJECT_ID(''ecomm_customers'') )\nSET @sqlcmd = 'CREATE EXTERNAL\
  \ TABLE ecomm_customers'([customer_id] INTEGER ,[customer_name] VARCHAR(255) ,[address]\
  \ VARCHAR(255) ,\n[city] VARCHAR(255) ,[postalcode] VARCHAR(10) ,[country] VARCHAR(100)\
  \ ,\n[phone] VARCHAR(100) ,[email] VARCHAR(255) ,[updated_at] DATETIME )\nWITH (LOCATION\
  \ = '' + @silverns + ''/esalesns'', data_source = trainingds, FILE_FORMAT = DeltaLakeFormat)';\n\
  EXEC sp_executesql @sqlcmd\n\nEXEC sp_executesql N'DROP VIEW IF EXISTS customers'\n\
  SET @sqlcmd = 'CREATE OR ALTER VIEW customers'\nSELECT [customer_id],[customer_name]\
  \ ,[address],[city],[postalcode],\n[country],[phone],[email],NULL as credit_card,[updated_at]\n\
  FROM [dbo].[ecomm_customers]\nUNION\nSELECT [customer_id],[customer_name],[address],[city],[postalcode],\n\
  [country],[phone],[email],[credit_card],[updated_at]\nFROM [dbo].[store_customers]'\n\
  EXEC sp_executesql @sqlcmd\n```\n\n图 8.29 – 湖仓银层中的外部表和视图\n\nstore_customers（商店数据库中的客户）是声明在\
  \ traininglakehouse Azure Data Lake Storage 账户银层的 /sales/store_customers 目录中的外部表。由于银层使用\
  \ Delta 格式，FILE_FORMAT 已设置为 DeltaLakeFormat。\n\necomm_customers（在线购买产品的客户）是声明在 traininglakehouse\
  \ Azure Data Lake Storage 账户银层的 /esalesns 目录中的外部表。由于银层使用 Delta 格式，FILE_FORMAT 已设置为\
  \ DeltaLakeFormat。\n\n注意我们如何巧妙地将两种类型的客户组合在一个名为 customers 的公共视图中。这为我们的终端用户提供了灵活性，可以分别查询商店与电子商务的客户，或使用一个通用的聚合版本。\n\
  \n#### 访问金层数据\n\nCreate Gold Layer Tables 调用了 Azure Synapse 中名为 create_gold_tables\
  \ 的存储过程。此存储过程的代码可在以下位置获得：\n\n```\nhttps://github.com/PacktPublishing/Data-Engineering-with-Apache-Spark-Delta-Lake-and-Lakehouse/blob/main/project/aggregation/sql/create_gold_tables.sql\n\
  ```\n\n查看以下 SQL。你会注意到外部表是如何使用 CTAS 创建的：\n\n```\nEXEC sp_executesql N'IF EXISTS (\
  \ SELECT * FROM sys.external_tables WHERE object_id = OBJECT_ID(''ext_aggregated_sales'')\
  \ ) DROP EXTERNAL TABLE ext_aggregated_sales;\nSET @sqlcmd = N'CREATE EXTERNAL TABLE\
  \ ext_aggregated_sales WITH (\n    LOCATION = '' + @goldns + ''/external/ext_aggregated_sales/'',\n\
  \    DATA_SOURCE = '' + @extds + '',\n    FILE_FORMAT = '' + @format + ''\n) AS\
  \ SELECT YEAR(order_date) AS year, DATEPART(QUARTER, order_date) as quarter, round(sum(sale_price_usd),2)\
  \ as aggregated_sales_price FROM orders GROUP BY YEAR(order_date), DATEPART(QUARTER,\
  \ order_date) '\nEXEC sp_executesql @sqlcmd\n```\n\n图 8.30 – 湖仓金层中的外部表\n\n注意 ext_aggregated_sales\
  \ 是如何使用 CTAS 创建的。该查询从 orders 视图中按季度获取聚合数据，结果以 Parquet 格式持久化在金层中。\n\n> **重要**\n>\
  \ 拥有一个可靠的数据消费策略对于数据湖项目的整体成功至关重要。毕竟，这是终端用户在其数据使用场景中进入的入口点。\n\n现在我们对终端用户使用的数据消费模式有了充分的了解，我们可以验证实际数据。\n\
  \n#### 验证金层中的聚合数据\n\n假设之前的 electroniz_batch_aggregation_pipeline 调用是成功的，你应该在 Azure\
