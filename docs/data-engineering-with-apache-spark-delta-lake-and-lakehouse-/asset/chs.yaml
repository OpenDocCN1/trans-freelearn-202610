  \n图 8.5 – gold 容器创建的确认\n\n3. 现在，让我们创建一个指向 gold 层的新的 Azure Synapse 工作区。将 SQLPASSWORD\
  \ 替换为实际密码。记住它，因为我们稍后会用到它。另外，Azure Synapse 工作区名称在全球范围内是唯一的，因此请相应地编辑 SYSNAPSEWORKSPACENAME\
