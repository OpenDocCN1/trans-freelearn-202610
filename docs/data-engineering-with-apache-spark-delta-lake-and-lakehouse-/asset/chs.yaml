  \n## 摘要\n\n在本章中，我们学习了各种部署策略，例如基于时间和基于事件的机制。此外，使用基于事件的机制，我们创建了 **Electroniz** 主管道。在手动测试主管道后，我们将其安排每小时运行一次。我们还学习了如何监控管道、添加耐久性功能以及处理故障条件。最后，我们研究了如何为管道添加警报，以便在出现故障时通知用户管理组。\n\
  \n下一章非常重要，因为它为数据工程师提供了一些关键技能。在 *第 10 章，解决数据工程挑战* 中，我们将学习现代数据工程师面临的一些常见挑战以及推荐的处理方法。\n\
  \n### 10\n解决数据工程挑战\n\n在过去几章中，我们学习了数据湖仓架构。在完成多个练习后，我们学习了数据工程师如何构建和部署湖仓的 bronze、silver\
  \ 和 gold 层。湖仓中的数据会随时间增长和变化。随着新数据源的添加和旧数据源的修改，数据工程实践需要跟上这种增长。就像行业中的任何事物一样，数据工程师的角色也需要不断发展。除了构建和部署数据管道外，他们还需要涵盖之前未涉及的多个复杂的数据工程方面。他们必须学会应对这些新挑战。\n\
  \n在本章中，我们将涵盖以下主题：\n\n+   - 模式演进\n+   - 数据共享\n+   - 数据治理\n\n#### 模式演进\n\n**模式演进**\
  \ 可以描述为一种用于适应数据结构持续变化的技术。随着系统成熟并增加更多功能，模式演进是不可避免的。因此，适应模式演进是现代管道的极其重要的要求。\n\n通常在项目开始时开发管道，使其具有表的基模式。经常在进入生产环境时，某个传入文件或表的模式已经发生变化的可能性非常高。但为什么这是个大问题？\n\
  \n> **重要**\n> 数据工程师绝不能犯下假设传入数据的模式永远不会改变的错误。相反，应准备管道使其能够自动适应这种演进。\n\n让我们讨论一个示例场景来说明这一点。假设您的管道已部署到生产环境，并且您一直在\
  \ bronze 层摄取一个库存文件，其中包含三列：**inventory_date**、**product** 和 **inventory**。在 silver\
  \ 层，存在一个名为 `inventory` 的相同文件的 Delta 表。第二天，当库存文件被摄取时，发现它包含的不是三列而是四列。库存文件的模式已经演进。现在的问题是如何有效地将这个新列反映到湖仓中，如下所示：\n\
  \n![](img/dae8a2243a3c3cbcd9c56ff3d2217672_338_0.png)\n\n图 10.1 – 模式演进\n\n真正的挑战在于，库存文件的先前数据列数少于今天收到的新文件。我们如何容纳新列，同时保持先前数据的完整性？过去，我们以两种方式处理这个问题：\n\
  \n+   - 我们会创建多个版本的库存表，每次模式更改时都会创建一个新版本的表。为了获得聚合结果，我们可以在所有版本之上创建一个 **VIEW**。这种方法有严重的缺点。不仅每次模式更改时都需要创建新版本的表，而且包含的视图也需要更改。\n\
  +   - 一个更简单的方法是使用值为 **NULL** 的虚拟列重写旧数据文件。之后，您可以简单地更改表的模式并向其中添加新列。这种方法比多版本方法稍好，但如果先前数据极大，则可能成为问题。\n\
  \n如果先前存在的列从新的传入文件中被删除，可能会出现类似情况。处理此删除场景的方法与我们刚刚讨论的非常相似，只是处理方式相反。在这种情况下，先前数据保持不变，但缺少该列的数据在未来数据中默认为\
  \ **NULL**。\n\n> **重要**\n> 在开发管道之前，请确保客户完全同意为处理模式演进而选择的方法。项目投入生产后更改此方法可能会非常昂贵。\n\
  \n幸运的是，我们可以在这里实施一个更简单的方法，这涉及使用 Delta Lake。**Delta Lake** 不仅可以通过强制执行 **模式验证** 来保护您的数据，还可以调整模式，而无需表版本控制或使用虚拟列重写先前数据。Delta\
  \ Lake 会自动将传入数据的模式与先前数据进行比较。如果在 Delta Lake 中检测到差异，则默认会引发异常。您可以覆盖此默认行为并强制将模式更改合并到表中，而无需重写先前数据。让我们通过以下示例来了解\
  \ Delta 表中的模式验证和演进：\n\n+   1. 将一些示例库存文件上传到湖仓的 `bronze` 层。逐行复制此处显示的每个命令，将其粘贴到 Azure\
  \ Cloud Shell 窗口中，然后按 *Enter*：\n\n```\nSTORAGEACCOUNTNAME=\"traininglakehouse\"\n\
  STORAGECONTAINER=\"bronze\"\n```\n\n\n\n\n```\nRESOURCEGROUPNAME=\"training_rg\"\
