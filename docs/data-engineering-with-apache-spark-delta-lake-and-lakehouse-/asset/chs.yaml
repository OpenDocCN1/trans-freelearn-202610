  \ |\n\n图 6.20 – 使用 SQL 检查 sales_orders 表中的数据\n\n- 4. 请记住，Delta Lake 将事务历史存储在以 00000000000000000000.json\
  \ 开头的 JSON 文件中。你可以使用以下 SQL 指令检查 store_orders 表的事务历史：\n\n```\n%sql\nDESCRIBE HISTORY\
