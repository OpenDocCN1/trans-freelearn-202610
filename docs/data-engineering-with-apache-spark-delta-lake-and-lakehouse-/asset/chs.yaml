  ```\ndeltaTable.delete(\"order_mode = 'DELETE'\")\n```\n\nFigure 7.56 – Delta Lake\
  \ deletion of store_orders\n\n###### 重要说明\n\n你可以通过提出一个简单问题来进一步理解因变更数据而产生的重复问题：最终用户想要查询什么？毫无疑问，只有最新版本的数据。幸运的是，Delta\
  \ Lake 允许你存储、检索和恢复数据之前的版本，但默认情况下，它只提供最新版本。\n\n## 验证不安全数据\n\n最后，我们想要验证 silver 层中的数据是否符合安全标准。在发现阶段，一个核心安全要求是对所有\
