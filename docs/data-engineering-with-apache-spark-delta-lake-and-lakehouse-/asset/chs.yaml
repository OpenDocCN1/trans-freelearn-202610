  ## 关于作者


  **Manoj Kukreja** 是 Northbay Solutions 的首席架构师，专门为银行、保险公司、大学和美国/加拿大政府机构等大型组织创建复杂的数据湖和数据分析管道。此前，他曾在大型托管服务提供商
  Pythian 工作，领导 MySQL 和 MongoDB DBA 团队，并为全球各地的企业支持大规模数据基础设施。拥有超过 25 年的 IT 经验，他使用所有主要云服务提供商包括
  AWS、Azure、GCP 和阿里云交付了数据湖解决方案。周末，他在 AWS 和 Azure 云上培训有志成为数据工程师和数据科学家的团队，教授 Hadoop、Spark、Kafka
  和数据分析。


  ## 关于审阅者


  **Rajeesh Punathil** 目前是加拿大一家知名能源公司的 Data Architect。他领导数字团队构建云数据分析解决方案，帮助企业找到正确的问题和答案。在之前的职位中，他为
  Sunlife、CIBC、City National bank、Hudsons Bay 等大型公司设计了 AWS 和 Azure 技术栈的数据分析管道。他拥有喀拉拉大学电子与电信工程学士学位，拥有超过
  15 年的 IT 经验。他认为自己是一个终身学生，不断追求知识使他成为数据分析和大数据领域的专家和领导者。他已获得 AWS 大数据分析认证。


  **Dang Trung Anh** 是一名拥有超过 15 年经验的首席工程师和软件架构师，为各个领域的客户交付大型软件系统。他职业生涯的大部分时间都在编写支持数百万用户的软件系统。他曾担任过从普通全栈开发人员到软件架构师再到工程总监等各种角色。他是
  Medium 上许多病毒式软件工程文章的作者。


