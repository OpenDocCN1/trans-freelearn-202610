- pgno: 195
  md: "The foreachBatch method of writeStream allows existing batch data sources to\
    \ be reused. This is done by specifying a function that is executed on the output\
    \ data of every micro-batch of the streaming query. This function takes two parameters:\
    \ the first parameter is the data frame that has the output data of a micro-batch,\
    \ and the second one is the unique ID of that micro-batch. The foreachBatch method\
    \ allows you to do the following:\n\n+   - Reuse existing batch data sources.\n\
    +   - Write to multiple locations.\n+   - Apply additional data frame operations.\n\
    \nIn a case where there might not be a streaming sink available in the storage\
    \ system but we can write data in batches, we can use foreachBatch to write the\
    \ data in batches.\n\nWe can also write the output of a streaming query to multiple\
    \ locations. We can do so by simply writing the output data frame into these multiple\
    \ locations, although this might lead to data being computed every time we write\
    \ into a different location and possibly having to read all the input data again.\
    \ To avoid this, we can cache the output data frame, then write to the location,\
    \ and finally uncache it.\n\nIn the following code example, we see how we can\
    \ write to different locations using foreachBatch in Scala:\n\n```\nstreaming_df.writeStream.foreachBatch\
    \ { (batchDF: DataFrame,\nbatchId: Long) =>\n  batchDF.persist()\n  batchDF.write.format(format_location_1).save(your_location_1)\n\
    \  batchDF.write.format(format_location_2).save(your_location_2)\n  batchDF.unpersist()\n\
    }\n```\n\nThe foreachBatch method helps us to overcome certain limitations regarding\
    \ operations that are available for static DataFrames but not supported in streaming\
    \ DataFrames. The foreachBatch option allows us to apply these operations to each\
    \ micro-batch output.\n\nThe foreachBatch method guarantees data to be processed\
    \ only once, although you can use the batchId parameter provided as a means to\
    \ apply deduplication methods. It is important to also notice that one of the\
    \ main differences between foreachBatch and foreach is that the former will not\
    \ work for continuous processing modes as it fundamentally relies on micro-batch\
    \ execution, while the latter gives an option to write data in continuous mode."
  merge: -1
  img_proc: true
