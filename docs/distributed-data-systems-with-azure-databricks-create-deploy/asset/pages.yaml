    Figure 2.22 – Azure Cloud Shell


    +   2. If we click on it, we will be prompted with the option of Bash or PowerShell.
    To use the CLI, we must select Bash:


    ![](img/7e45bd08916c2a17d4e75cbb898f41e8_80_1.png)


    Figure 2.23 – Azure Cloud Shell Bash'
