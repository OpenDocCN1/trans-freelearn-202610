  md: 'In the next sections, we will dive into more concrete examples of how we can
    use Horovod for distributed training of deep learning models in **central processing
    unit (CPU)** or GPU clusters.


    # Installing the horovod library


    The `horovod` library comes pre-installed in Azure Databricks Runtime for Machine
    Learning, so in most cases you won''t need to install it unless you are using
    a common Azure Databricks Runtime. Nevertheless, one thing to mention is that
    if you upgrade or downgrade one of the frameworks used to build the model—such
    as TensorFlow, Keras, or PyTorch—you will need to reinstall the `horovod` library
    and compile it again.


    In cases where we need to upgrade or downgrade one of the frameworks, we might
    encounter import errors, indicating that `horovod` was installed before the required
    framework, such as TensorFlow, Keras, or PyTorch. This is due to the fact that
    Horovod is compiled during the installation, and if the required library was not
    present during the installation, it is not compiled.


    If we have reinstalled one of the required libraries, we can overcome this problem
    by following the next steps:


    +   1. Check that the required library was correctly installed.

    +   2. Uninstall `horovod` using Python `pip`.

    +   3. Install the `CMake` Python library with `pip`.

    +   4. Reinstall `horovod` using Python `pip`.


    This way, we can ensure that the `horovod` library was compiled once the required
    framework was installed.


    Once we have the `horovod` library available to use in our environment, we will
    center our attention on which are the available features that we can leverage
    to efficiently use it for distributed training in Azure Databricks.


