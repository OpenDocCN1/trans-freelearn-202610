- pgno: 373
  md: '# 12

    Distributed Deep Learning in Azure Databricks


    In the previous chapter, we have learned how we can effectively serialize machine
    learning pipelines and manage the full development life cycle of machine learning
    models in Azure Databricks. This chapter will focus on how we can apply distributed
    training in Azure Databricks.


    Distributed training of deep learning models is a technique in which the training
    process is distributed across workers in clusters of computers. This process is
    not trivial and its implementation requires us to fine-tune the way in which the
    workers communicate and transmit data between them, otherwise distributing training
    can take longer than single-machine training. Azure Databricks Runtime for Machine
    Learning includes Horovod, a library that allows us to solve most of the issues
    that arise from distributed training of deep learning algorithms. We will also
    show how we can leverage the native Spark support of the TensorFlow machine learning
    framework to train deep learning models in Azure Databricks.'
  merge: -1
  img_proc: true
- pgno: 374
  md: 'The concepts that we will go through in the chapter are listed as follows:


    +   - Distributed training for deep learning

    +   - Using the Horovod distributed learning library in Azure Databricks

    +   - Using the Spark TensorFlow Distributor package


    Before we dive into these concepts, let''s go through the requirements in order
    to execute the examples shown here.


    # Technical requirements


    In this chapter, we will use concepts and apply tools related to common topics
    in data science and optimization tasks. We will assume that you already have a
    good understanding of concepts such as neural networks and hyperparameter tuning,
    and also general knowledge of machine learning frameworks such as TensorFlow,
    PyTorch, or Keras.


    In this chapter, we will discuss various techniques in order to distribute and
    optimize the training of deep learning models using Azure Databricks, so if you
    are not familiar with these terms, it would be advisable for you to review the
    TensorFlow documentation on how neural networks are designed and trained.


    In order to work on the examples given in this chapter, you will need to have
    the following:


    +   - An Azure Databricks subscription.

    +   - An Azure Databricks notebook attached to a running cluster with Databricks
    Runtime ML version 7.0 or higher.


    # Distributed training for deep learning


    Deep neural networks (DNNs) have driven the advancement of artificial intelligence
    (AI) in the last decades in areas such as computer vision and neural network processing.
    These are applied every day to solve challenges in diverse use cases.


    In order to scale the performance of models, it is necessary to develop complex
    model architectures with millions of trainable parameters, making the computations
    required for the training a resourceful operation. As the amount of available
    data to train models increases, we need to scale up the training pipeline of deep
    learning models in order to be able to use this available data.'
  merge: -1
  img_proc: true
- pgno: 375
  md: 'Commonly, in order to train a DNN, we need to follow three basic steps, which
    are listed here:


    +   1. Pass the data through the layers of the network to compute the model loss
    in an operation called forward propagation.

    +   2. Backpropagate this loss from the output layer to the first layer in order
    to compute the gradients.

    +   3. We use calculated gradients in order to update the model weights in the
    optimization step of the training process.


    The scalability of the training process of a DNN can be achieved in the following
    two ways:


    +   - Using data parallelization

    +   - Using model parallelization


    A data parallelization strategy involves copying the model into each one of the
    available workers and fitting them, using assigned portions of the data. Later
    on, the workers communicate with each other in order to properly update the model''s
    weights, using the average calculated gradients.


    Although it might sound simple, the implementation can be quite complex, and the
    complexities arising from tackling the operation in this way can completely erase
    the performance gain from distributing the training, if it''s not done properly.


    Modern neural networks have grown at a fast pace in the last decade. Some of the
    architectures used in image processing have millions of parameters that need to
    be trained on massive amounts of data. This computationally expensive training
    process has led to the development of techniques to parallelize the process into
    several workers.


    As the amount of data required to train the model increases, we can increase the
    number of workers to run the computations. Commonly, workers receive a copy of
    the neural network, and mini-batches are distributed to each one of them to calculate
    a gradient, based on the training batch of data. These gradients are averaged
    to recalculate the new weights of the neural network.


    When the data increases and the models have millions of trainable parameters,
    these gradients can take gigabytes (GB) of space in the memory, and the communication
    between workers starts to become a problem as we reach the maximum bandwidth of
    the network.'
  merge: -1
  img_proc: true
- pgno: 376
  md: 'The other impediment that we face is that the way in which the gradients are
    commonly calculated involves waiting until all the gradients from every worker
    have been calculated. One alternative to solve this problem is to introduce algorithms
    that run asynchronous calculations of gradients, but these tend to be very hard
    to debug.


    This is when a technique derived from high-performance computing, the *ring allreduce*
    technique, comes into play. This allows us to improve the performance of the training
    process of neural networks by making use of the optimal bandwidth ring allreduce.


    # The ring allreduce technique


    As we introduce new workers in order to handle increases in the size of the calculated
    gradients, we start to notice that the communication costs start to grow linearly.
    We can configure the communication between the workers in order to find the optimal
    strategy to make use of the available bandwidth. To do this, we use the ring all
    reduce, a communication algorithm where the communication cost is held constant
    no matter the number of workers introduced, and it''s only dependent on the slowest
    connection in the system.


    The `ring allreduce` algorithm orders the workers in a logical ring, where each
    worker can only send data to its right neighbor and receive data from the one
    at its left. The algorithm is depicted in the following diagram:


    ![](img/7e45bd08916c2a17d4e75cbb898f41e8_376_0.png)


    Figure 12.1 – How the Ring All Reduce algorithm allows communication between workers'
  merge: -1
  img_proc: true
- pgno: 377
  md: 'The ring allreduce algorithm works in two steps. First, each worker exchanges
    data so that each worker has a chink of the result, and then runs an allgather
    operation so that all the workers have a complete result.


    Another point where we can improve the communication between workers is by making
    use of the inherent calculation process of the gradients in a neural network.


    To train a neural network, we first run a forward propagation and then a backward
    propagation to compute the gradients at each of the layers of the neural network,
    starting from the output layer up to the input layer. Therefore, the first available
    gradients are the ones from the output layer. We can exploit this process by sending
    the gradients as soon as they are ready instead of waiting for all of them to
    be finished, in order to avoid spikes in bandwidth use and overlays in communication
    with the rest of the workers. This way, we overcome the inconvenience of having
    to wait for each worker to finish the gradient computation over all of the layers
    of the neural network.


    The good thing about this approach is that it is agnostic from the network architecture
    and framework used to create the model, and it allows us to better harness the
    power of parallel computing for distributed training of deep learning models.


    The horovod library applies the ring allreduce algorithm to enable distributed
    training of deep learning networks in distributed computing systems such as Azure
    Databricks. In the next sections, we will learn how we can leverage the use of
    HorovodRunner to efficiently train deep learning models.


    # Using the Horovod distributed learning library in Azure Databricks


    horovod is a library for distributed deep learning training. It supports commonly
    used frameworks such as TensorFlow, Keras, and PyTorch. As mentioned before, it
    is based on the tensorflow-allreduce library and implements the ring allreduce
    algorithm in order to ease the migration from single-graphics processing unit
    (GPU) training to parallel-GPU distributed training.


    In order to do this, we adapt a single-GPU training script of a deep learning
    model to use the horovod library during the training process. Once we have adapted
    the script, it can run on single or multiple GPUs without changes to the code.


    The horovod library uses a data parallelization strategy by allowing efficient
    distribution of the training to multiple GPUs in parallel in an optimized way,
    by implementing the ring allreduce algorithm to overcome communication limitations.'
  merge: -1
  img_proc: true
- pgno: 378
  md: 'It is implemented in a way that each GPU gets a mini-batch of data in order
    to independently calculate a gradient. For example, if we have a batch size of
    32 and two available GPUs, each one will receive a set of 16 records to calculate
    the gradient update. These gradient updates are later on synchronized and averaged
    between all the available GPUs in order to finally use this to update the model
    weights.


    In each one of the training runs over the batches of data, horovod follows the
    process outlined next in order to handle the distributed computation among GPUs:


    +   - Each worker receives a copy of the model and the dataset.

    +   - Once the go signal is received, the worker computes the gradients on an
    assigned batch of the data.

    +   - The ring allreduce algorithm is used to synchronize and average the calculated
    gradients across GPUs.

    +   - All the workers update their models'' weights using the calculated averaged
    gradient.


    One of the most crucial aspects of this operation is to maintain the same model
    across workers. If the models diverged somehow, this would render inconsistent
    gradient calculations. This is where the ring allreduce algorithm plays an important
    role in synchronizing the tensors representing the model-trainable parameters
    in an efficient way.


    In order to develop a training pipeline that can be efficiently used for distributed
    training of deep learning models, a common workflow is outlined next:


    +   - Create a training script for a single machine using one of the Horovod supported
    frameworks such as TensorFlow, Keras, or PyTorch.

    +   - Add the hvd.init() function to initialize the horovod library.

    +   - Choose one of the available GPU servers using the config.gpu_options.visible_device_list
    option.

    +   - Use hvd.DistributedOptimizer to wrap the optimizer to distribute the gradient
    descent calculation across workers.

    +   - Use hvd.BroadcastGlobalVariablesHook() to distribute initial variables''
    state to ensure consistency in the initialization of all the random weights of
    the workers'' models. Another alternative to do this is to use hvd.broadcast_global_variables()
    to broadcast global starting variables.

    +   - Set your code to save the checkpoints in the 0 worker to avoid any corruption
    of data due to overlapping read/write operations.

    +   - Use HorovodRunner to wrap a single Python function that packs the training
    procedure.'
  merge: -1
  img_proc: true
- pgno: 379
  md: 'horovod is a library available in Azure Databricks Runtime for machine learning.
    In the next sections of the chapter, we will learn how we can use it to distribute
    the training of deep learning models and to effectively parallelize the tuning
    of hyperparameters.


    As an example, we will show a construct of how we must modify our code to be able
    to run in distributed mode. We will use a toy model example with a TensorFlow
    model. This assumes that we have a TensorFlow v1 model that we want to train as
    a distributed model. The steps are:


    +   1. To do this, we would need to first make the imports of TensorFlow and Horovod
    and initialize Horovod, as follows:


    ```

    import tensorflow as tf

    import horovod.tensorflow as hvd

    hvd.init()

    ```


    +   2. Next, we will ping the GPU that will be used to process the local rank
    of the node, like this:


    ```

    config = tf.ConfigProto()

    config.gpu_options.visible_device_list = str(hvd.local_rank())

    ```


    +   3. After this point, we can start to build the model and define the loss function
    that will be utilized. We will abstract this point and assume that you already
    have a loss function to optimize.


    +   4. The next step is to apply the Horovod distributed optimizer to the selected
    optimizer in order to distribute the training of the gradient calculation. As
    an example, we will define a TensorFlow AdagradOptimizer optimizer and set the
    learning rate to be a variable dependent on the size that Horovod passes to the
    workers, a parameter used to control the learning rate. The code for this is shown
    in the following snippet:


    ```

    opt = tf.train.AdagradOptimizer(0.01 * hvd.size())

    ```


    +   5. Now, we can use the Horovod distributed optimizer in order to wrap the
    selected optimizer, as follows:


    ```

    opt = hvd.DistributedOptimizer(opt)

    ```'
