  md: 'In this example, we have defined a Keras deep learning model and trained it
    using a Parquet file that is read into batches of data to further optimize the
    process. As shown in this section, the Petastorm library provides us with efficient
    methods to use Parquet, a format natively supported in Spark and Azure Databricks,
    to train deep learning models. In the next section, we will dive into a concrete
    example of how we can train deep learning models for featurization using the Azure
    Databricks Machine Learning Runtime.


    # Data preprocessing and featurization


    Featurization is the process that we use to transform unstructured data such as
    text, images, or time-series data into numerical continuous features that are
    more easily handled by machine and deep learning models. It can be differentiated
    from featuring engineering from the fact that in featuring engineering the variables
    are already in the numerical form or have a more defined structure that leads
    us to the need to refactor or transform these variables into something that makes
    the machine or deep learning algorithm easier to extract patterns. In featurization,
    we need to first define a way in which we will extract numerical features from
    the unstructured data that we have.


    We have the need to perform featurization basically because our deep learning
    models cannot interpret unstructured data directly and therefore, we need not
    only to extract it but to do this in a computationally efficient manner. This
    process needs to be incorporated into our deep learning pipeline if we are working
    with models that need to be somehow frequently re-trained.


    Azure Databricks Machine Learning Runtime provides us with support for deep learning
    featurization models that can be used to extract the before-mentioned features
    from our data. We have available pre-trained models that can be used to compute
    features that are used in other downstream processes or models. These pre-trained
    models can be created using the already included deep learning frameworks TensorFlow
    and PyTorch, which are already included in the Azure Databricks Machine Learning
    Runtime.


    In this section, we will exemplify how we can perform the featurization of data
    in Azure Databricks by doing transfer learning, which is a deep learning method
    to reuse domain knowledge from one problem to another using featurization as the
    underlying technique. This featurization will be applied using pre-trained models
    to extract the numerical variables from the original data representation.'
  merge: -1
  img_proc: true
- pgno: 310
  md: '# Featurization using a pre-trained model for transfer learning


    In this section, we will demonstrate how we can use pre-trained models in the
    Azure Databricks Machine Learning Runtime to produce features that can be used
    for downstream models and processes. Here, we will show this by using these extracted
    features for transfer learning to be used to train a new model.


    As mentioned earlier, featurization is a technique that is used for feature encoding
    to be able to apply the domain knowledge of one model to a different but related
    problem. We can see this from the pragmatic point of view of using the patterns
    extracted to perform one task to be able to extrapolate this to a new task, with
    the potential of both improving the efficiency and reducing the amount of time
    necessary for training a new model.


    This section will demonstrate how you can extract features for transfer learning
    using a pre-trained TensorFlow model using the Azure Databricks Machine Learning
    Runtime, using the following workflow:


    +   1. We will start with a pre-trained deep learning model – in this case, an
    image classification model from `tensorflow.keras.applications`.

    +   2. We will remove the last layer of the pre-trained deep learning model for
    it to produce a tensor of numerical features as output, rather than the actual
    prediction of the model.

    +   3. We will apply this model to a different domain knowledge image dataset
    to be able to use it to encode numerical features from it.

    +   4. We can then use these encoded features to train a new downstream model,
    although we will omit this final step in this example.


    In this example, we will use the pandas library **User Defined Functions (UDFs)**
    to apply, in a distributed manner, the featurization to our dataset. The pandas
    UDF is an efficient method to apply this featurization as part of a transformation
    process of our dataset and as well as the `Scalar Iterator`, pandas UDFs provide
    us with flexible and high-performance support for deep learning applications.


    As mentioned before, in this section we will load our dataset and extract features
    from it using pandas UDFs. The steps that we will take are to load the data using
    into and Spark DataFrame reading from the binary data source, loading the pre-trained
    model that will be used for transfer learning, and finally, applying it to encode
    features from the dataset using Scalar Iterator pandas UDFs.'
  merge: -1
  img_proc: true
- pgno: 311
  md: '# Featurization using pandas UDFs


    The workflow that is used to encode new features using pandas UDFs using pre-trained
    models can be generalized as follows:


    +   1. First, we need to load our data into a DataFrame.

    +   2. Afterward, we need to prepare the pre-trained model that will be used for
    featurization.

    +   3. Next, we will define the image loading process and how we will apply the
    feature encoding.

    +   4. Finally, we extract the features by applying the pre-trained model as a
    pandas UDF.


    This workflow is a generalization and can also be applied to image preprocessing
    and custom model training pipelines. It is also efficient since it takes advantage
    of pandas UDFs to improve the performance of the feature extraction:


    +   1. Our first step is to do the necessary library imports, which include instantiating
    the ResNet50 pre-trained model, which is included in the TensorFlow framework:


    ```

    import pandas as pd

    from PIL import Image

    import numpy as np

    import io

    import tensorflow as tf

    from tensorflow.keras.applications.resnet50 import ResNet50, preprocess_input

    from tensorflow.keras.preprocessing.image import img_to_array

    from pyspark.sql.functions import col, pandas_udf, PandasUDType

    ```


    +   2. We will use for this example the flowers dataset as our example dataset.
    This dataset contains flower photos stored under five folders, each of them representing
    one type of flower. This dataset is also stored in the directory of the Azure
    Databricks dataset examples directory:


    ```

    %fs ls /databricks-datasets/flower_photos

    ```'
  merge: -1
  img_proc: true
- pgno: 312
  md: "3. After we have identified the path to our dataset, we can then load images\
    \ using the Spark API binary file as a data source. We could alternatively use\
    \ the native Spark API image data source, but the binary file data source will\
    \ provide us with more flexibility in the way in which we process the images:\n\
    \n```\nimages = spark.read.format(\"binaryFile\") \\\n    .option(\"pathGlobFilter\"\
    , \"*.jpg\") \\\n    .option(\"recursiveFileLookup\", \"true\") \\\n    .load(\"\
    /databricks-datasets/flower_photos\")\n```\n\n4. After the data has been loaded,\
    \ we can visualize it using the display function and limit the result to 5 records:\n\
    \n```\ndisplay(images.limit(5))\n```\n\n5. Here, we see the output of this process:\n\
    \n![](img/7e45bd08916c2a17d4e75cbb898f41e8_312_0.png)\n\nFig.9.4 – Binary image\
    \ files"
  merge: -1
  img_proc: true
- pgno: 313
  md: "6. Next, we will prepare the pre-trained model that we will use for featurization\
    \ by downloading it and truncating the last layer. In this example, we will use\
    \ the ResNet50 pre-trained model as discussed before. When loading the model,\
    \ there are some concepts that are good to have in mind that concern the size\
    \ of the models. If we are dealing with a moderate-sized model of less than 1\
    \ GB, it is good practice to download the model to the cluster driver and then\
    \ use it to broadcast the weights to the workers. This is the approach that will\
    \ be used in this example. The alternative approach is when we have models larger\
    \ than 1 GB. In these cases, it is better to load the model weights directly to\
    \ the distributed storage.\n\n7. We will instantiate our model and specify removing\
    \ the last layer, display the model summary to verify that the last layer was\
    \ removed, and then finally broadcast the model weights to the workers:\n\n```\n\
    model = ResNet50(include_top=False)\nmodel.summary()  # verify that the top layer\
    \ is removed\nbc_model_weights = sc.broadcast(model.get_weights())\n```\n\n8.\
    \ The next step is to define a function that returns a ResNet50 model with the\
    \ last layer truncated with the pretrained weights broadcast to the workers:\n\
    \n```\ndef model_fn():\n    model = ResNet50(weights=None, include_top=False)\n\
    \    model.set_weights(bc_model_weights.value)\n    return model\n```\n\nNow that\
    \ we have our function to instantiate the truncated and broadcast model, we can\
    \ define the pandas UDF that will be used to featurize a pd.Series array of images\
    \ using Scalar Iterator pandas UDFs to improve the performance of loading large\
    \ models on the workers.\n\n9. The next function will be used to preprocesses\
    \ raw image bytes and will be later used for prediction:\n\n```\ndef preprocess(content):\n\
    \    img = Image.open(io.BytesIO(content)).resize([224, 224])\n    arr = img_to_array(img)\n\
    \    return preprocess_input(arr)\n```"
  merge: -1
  img_proc: true
- pgno: 314
  md: "10. Next, we define another function, which in turn will be the one in charge\
    \ of featurizing a pd.Series array of raw images using the previously defined\
    \ function to decode them, applying the pre-trained model to it, and returning\
    \ a pd.Series of image features. Here, we have flattened the output multidimensional\
    \ tensors to better handle them when loading them to a Spark DataFrame:\n\n```\n\
    def featurize_series(model, content_series):\n    input = np.stack(content_series.map(preprocess))\n\
    \    preds = model.predict(input)\n    output = [p.flatten() for p in preds]\n\
    \    return pd.Series(output)\n```\n\n11. The next step is to define a Scalar\
    \ Iterator pandas UDF wrapping for our featurization function. The decorator used\
    \ here will specify that the output of this process will be the Spark DataFrame\
    \ column of type ArrayType(FloatType). The content_series_iter argument specifies\
    \ to iterate over batches of data, where each batch is a pandas Series array of\
    \ images. Using the Scalar Iterator pandas UDF allows us to load the model once\
    \ and use it several times over different batches of data, improving the performance\
    \ of the process of loading big models:\n\n```\n@pandas_udf('array<float>', PandasUDFType.SCALAR_ITER)\n\
    def featurize_udf(content_series_iter):\n    model = model_fn()\n    for content_series\
    \ in content_series_iter:\n        yield featurize_series(model, content_series)\n\
    ```\n\nThis way we have successfully registered our function that later can be\
    \ used to obtain our features based on our pre-trained model.\n\n# Applying featurization\
    \ to the DataFrame of images\n\nThe pandas UDF allows us to manage a large set\
    \ of unstructured data records, which could be, for example, large images but\
    \ can give rise to problems such as Out of Memory (OOM) errors:\n\n+   1. We can\
    \ give a hit that allows such errors in the cell below, to be handled in a more\
    \ efficient way by reducing the arrow batch size using the maxRecordsPerBatch\
    \ option:\n\n```\nspark.conf.set(\"spark.sql.execution.arrow.maxRecordsPerBatch\"\
    , \"1024\")\n```"
  merge: -1
  img_proc: true
