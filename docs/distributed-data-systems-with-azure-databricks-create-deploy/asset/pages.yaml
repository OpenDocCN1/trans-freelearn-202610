- pgno: 125
  md: '# The COPY INTO SQL command


    If we would like to copy data from a file into a delta table, we can use the COPY
    INTO command, which is an option that we can use to load files into a directory.
    Every time we run the command, it will skip files that have been already loaded.
    Let''s take a look:


    +   As an example, if we want to load data into an already created table, we can
    do the following:


    ```

    COPY INTO target_table

    FROM ''source_path''

    ```


    +   Otherwise, we can refer to the path of the table by passing the prefix delta
    to the target path:


    ```

    COPY INTO delta.`target_path`

    FROM ''source_path''

    ```


    The COPY INTO command also has several options in that we can specify a specific
    column from a file location, format options, and copy options.


    The format of the source files to load should be either CSV, JSON, AVRO, ORC,
    or PARQUET. FILES refers to a list of filenames to load and they can have a length
    up to 1000. It cannot be specified with PATTERN, which is a regex pattern that
    identifies the files to load from the source directory.


    FORMAT_OPTIONS and COPY_OPTIONS are options that can be passed to Apache Spark
    which for the latter are only ''force'', which, if enabled, they load the files
    at hand, regardless of whether they were loaded previously:


    +   We can see the use of this option in the following command. Here, we are inserting
    data into a table, selecting the key, index, textData, and constant_value columns
    from the source path, specifying CSV as the format, specifying the pattern of
    the files required, and adding a formatting option so that we can add headers:


    ```

    COPY INTO delta.`target_table_path`

    FROM (SELECT key, index, textData, ''constant_value''

    FROM ''source_path'')

    FILEFORMAT = CSV

    PATTERN = ''data_folder/file_[a-g].csv''

    FORMAT_OPTIONS(''header'' = ''true'')

    ```


    The COPY INTO command is commonly used in SQL and it''s also a supported way to
    ingest data into a Delta Lake table.'
  merge: -1
