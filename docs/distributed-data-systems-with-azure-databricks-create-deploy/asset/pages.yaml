    # Working with VNets in Azure Databricks


    Azure Databricks can be deployed within a custom virtual network. This is called
    VNet injection and is very important from a security perspective. When we deploy
    with default settings, inbound traffic is closed, but outbound traffic is open
    without restrictions. When we use VNet injection and we deploy directly to a custom
    virtual network, we can apply the same security policies around all our Azure
    Services, to meet compliance and security requirements.


    In case you are working in data science or exploratory environments, it''s good
    to leave the outbound traffic open to be able to download packages and libraries
    for Python, R, and Maven, and Ubuntu packages also.


    As we have mentioned before, Azure Databricks works on two planes of service.
    The first is the control page, which we use through the Databricks API to work
    with workspace assets. The second is the data plane where the clusters are deployed.
    It is this second plane that is deployed to your customized virtual network. The
    benefits of this are as follows:


    +   - A secure connection to other Azure services, such as Azure Storage, through
    service endpoints

    +   - A connection to on-premises data sources to be used in Azure Databricks

    +   - Connecting Azure Databricks to a network virtual appliance to monitor and
    control outbound traffic'
  merge: -1
  img_proc: true
- pgno: 70
  md: '+   - Configuring Azure Databricks to use custom DNS

    +   - Configuring network security group (NSG) rules

    +   - Deploying Azure Databricks clusters in your existing virtual network


    This is possible because of Azure Databricks delegation, which allows for joint
    control of a subnet. The owner of the network allows resources to be deployed
    in a specific subnet and exerts control by specifying conditions for this delegation
    to happen and add or modify security policies.


    # Virtual network requirements


    The VNet where you intend to deploy your Azure Databricks workspace should meet
    the following criteria in order to work:


    +   - It should have the same location as the Azure Databricks resource we are
    creating.

    +   - The VNet must belong to the same subscription as the Azure Databricks resource.

    +   - The VNet should have private and public dedicated subnets for Azure Databricks,
    to allow communication with the control plane.

    +   - Address space: A CIDR block between /16 – /24 for the virtual network, and
    a CIDR block up to /26 for the private and public subnets.


    Virtual networks allow us to enforce the same policies in all our Azure resources.


    # Deploying to your own VNet


    We will show the basics of how to deploy a cluster to a specific virtual network.
    Azure Databricks will create two subnets within this network a network security
    groups using the CIDR ranges provided by you, whitelist inbound and outbound traffic,
    and deploy once the virtual network has been updated.


    # Deployment requirements


    To deploy Azure Databricks, you will first have to configure your virtual networks
    in the following way:


    +   - The virtual network can be an existing one or a newly created one but, as
    mentioned before, the location and subscription must be the same as the Azure
    Databricks workspaces that you plan to create.

    +   - A CIDR range between /16 – /24 is required for the virtual network.'
  merge: -1
  img_proc: true
- pgno: 71
  md: '# Configuring the virtual network


    While we were *creating an Azure Databricks resource*, we were prompted with an
    options tab called Networking. In this tab, we will see the options to deploy
    to our own virtual network if we select to deploy to our own virtual network:


    ![](img/7e45bd08916c2a17d4e75cbb898f41e8_71_0.png)


