- pgno: 335
  md: "```\nsearch_space = hp.choice('a',\n    [('test_space_1', 1 + hp.lognormal('x',\
    \ 0, 1)),\n     ('test_space_2', hp.uniform('y', -5, 5))]\n)\n```\n\nHere, Hyperopt\
    \ will sample from these nested stochastic expressions according to the search\
    \ algorithm. This algorithm applies an adaptative exploration strategy rather\
    \ than just taking samples from the search space. In the preceding example, we\
    \ defined three parameters:\n\n+   - a: Selects the case to be used\n+   - test_space_1:\
    \ Generates positive values for the x parameter\n+   - test_space_2: Generates\
    \ positive values for the y parameter\n\nEach expression has the label as the\
    \ first argument, which is used internally by the algorithm to return the parameter\
    \ choice to the caller. In this example, the code works like so:\n\n+   - If the\
    \ a variable is 0, we will use x and not y.\n+   - If the a variable is 1, then\
    \ y will be used but not x.\n\nThe x and y variables are conditional parameters\
    \ that depend on the result of the value of a. If we encode the variables in this\
    \ conditional way, we are stating that the x variable has no effect on the objective\
    \ function when a is 0, which helps the search algorithm assign credit in a more\
    \ efficient way. This takes advantage of the domain knowledge that the user has\
    \ on the objective function to be analyzed.\n\nsearch_space is a variable space\
    \ that's defined as a graph expression that describes how to sample a point without\
    \ generating the search space. This optimizes both the memory and computational\
    \ use of the execution. These graph expressions are called pyll graphs and are\
    \ defined in the hyperopt.pyll class.\n\nYou can explore a sample search space\
    \ by just sampling it:\n\n```\nimport hyperopt.pyll.stochastic\nprint(hyperopt.pyll.stochastic.sample(search_space))\n\
    ```\n\nWe know now how we can define the search space where we will optimize our\
    \ objective function. It is important to note that the way we define the cases\
    \ to be tested in the search space will also impact the way the search algorithm\
    \ will work on the trials during the adaptative search. In the next section, we\
    \ will learn about some of the best practices for using Hyperopt in Azure Databricks."
