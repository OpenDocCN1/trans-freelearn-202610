  md: "```\ndataset = tf.data.TFRecordDataset(filenames)\n```\n\n4. To be able to\
    \ use the data, we need to create a decoder function to read, parse, and normalize\
    \ the data. We parse the record into tensors with the map function, which will\
    \ apply our decoder function to every sample. First, we will define the decoder\
    \ function, which will take one serialized example as a required parameter, and\
    \ the image size as an optional parameter:\n\n```\ndef decode_and_normalize(serialized_example,\
    \ image_size = 224):\n    # Parse from single example\n    feature_dataset = tf.io.parse_single_example(\n\
    \        serialized_example,\n        features={\n            'content': tf.io.FixedLenFeature([],\
    \ tf.string),\n            'label_index': tf.io.FixedLenFeature([], tf.int64),\n\
    \        })\n    # Decode the parsed data\n    image = \\\n    tf.io.decode_jpeg(feature_dataset['content'])\n\
    \    label = \\\n    tf.cast(feature_dataset['label_index'], tf.int32)\n    #\
    \ Resize the decoded data into the desired size\n    image = tf.image.resize(image,\
    \ [image_size, image_size])\n    # Finally, normalize the data\n    image = \\\
    \n    tf.cast(image, tf.float32) * (1. / 255) - 0.5\n    return image, label\n\
    ```\n\n5. Once we have defined our decoding function, we can use it to parse our\
    \ data by mapping the dataset and applying it to every sample in it:\n\n```\n\
    parsed_dataset = dataset.map(decode_and_normalize)\n```"
