    We can specify the configuration of our virtual networks in much more detail using
    Azure Resource Manager (ARM). These are templates that we can use to deploy services
    to Azure. With these templates, we can specify whether we want to use existing
    subnets, use an existing security group, and more. In the next section, we will
    take a deeper look into ARM templates for Azure Databricks.'
