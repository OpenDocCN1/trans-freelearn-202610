  md: '# Matplotlib


    The method for displaying Matplotlib figures used depends on which version of
    Databricks Runtime your cluster is running, but from Databricks Runtime 6.5 and
    above, we can directly display figures inline using the display function.


    To make the case for how easy it is to work with Matplotlib, we will create a
    simple example displaying a scatter plot. First, we will generate fake data using
    numpy:


    ```

    import numpy as np

    import matplotlib.pyplot as plt

    x = np.linspace(0, 2*np.pi, 50)

    y = np.sin(x)

    ```


    Then, we initialize the objects that will hold the plot and select to plot the
    y data over the x axis using a dashed line:


    ```

    fig, ax = plt.subplots()

    ax.plot(x, y, ''k--'')

    ```


    We can set the ticks and tick labels for both the x and y axes:


    ```

    ax.set_xlim((0, 2*np.pi))

    ax.set_xticks([0, np.pi, 2*np.pi])

    ax.set_xticklabels([''0'', ''$\pi$'', ''2$\pi$''])

    ax.set_ylim((-1.5, 1.5))

    ax.set_yticks([-1, 0, 1])

    ```


    Finally, we can use display(fig) to display our figure inline in an Azure Databricks
    notebook:


    ```

    display(fig)

    ```'
  merge: -1
  img_proc: true
