  md: '# Clusters CLI


    Clusters can be listed and created, and information about them can be retrieved
    from the Clusters CLI. If you want to create a cluster, you will have to supply
    a JSON configuration file for that cluster. You can read more about this file
    in the Azure Databricks documentation:


    +   - To list all the commands available to work with clusters, run the following
    command in your terminal:

    +     `databricks clusters -h`

    +   - We can also list all the runtime versions of our clusters:

    +     `databricks clusters spark-versions`

    +   - And we can also list all the node types that exist in our resource:

    +     `databricks clusters list-node-types`


    ```

    databricks clusters -h

    ```


    ```

    databricks clusters spark-versions

    ```


    ```

    databricks clusters list-node-types

    ```


    # Jobs CLI


    The Jobs CLI allows for creating, editing, and running jobs in Azure Databricks.
    Jobs are more complicated than other APIs available for Databricks because many
    of the commands require passing JSON configuration files, as we have seen with
    clusters creation. As we are used to, the full list of commands can be accessed
    using the -h option in the Jobs CLI:


    ```

    databricks jobs -h

    ```


    # Listing and finding jobs


    The databricks jobs list command has two output formats, JSON and TABLE. The TABLE
    format is outputted by default and returns a two-column table (job ID, job name).
    The Jobs CLI allows us to use regular expressions to find one specific job.


    To find a job by name, run the following command:


    ```

    databricks jobs list | grep "JOB_NAME"

    ```'
