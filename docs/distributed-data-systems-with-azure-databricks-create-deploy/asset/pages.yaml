  md: '# Using the Koalas API


    When working with time series, it is fairly common to perform tasks related to
    imputation and removing duplicates. These duplicated records tend to happen when
    multiple records are inserted with high frequency on the dataset. We can use the
    Koalas API to perform these operations using a very familiar Pandas-like syntax,
    as was explored in previous chapters:


    +   1. In the following code example, we will read our Delta table into a Koalas
    DataFrame and perform deduplication by grouping by the event_ts column and then
    retrieve the maximum value for that point in time:


    ```

    import databricks.koalas as ks

    kdf_src = ks.read_delta("/tmp/finserv/delta/ofi_quotes2")

    grouped_kdf = kdf_src.groupby([''event_ts''], as_index=False).max()

    grouped_kdf.sort_values(by=[''event_ts''])

    grouped_kdf.head()

    ```


    +   2. Now that we have removed the duplicates from our DataFrame, we can perform
    a shift in the data to create a lagged Koalas Data Frame that will be really helpful
    to do calculations such as moving average or other statistical trend calculations.
    As shown in the following code snippet, Koalas makes it easy to get lag or lead
    values within a window by using the shift method of the Koalas Data Frame:


    ```

    grouped_kdf.set_index(''event_ts'', inplace=True, drop=True)

    lag_grouped_kdf = grouped_kdf.shift(periods=1, fill_value=0)

    lag_grouped_kdf.head()

    ```


    +   3. Now that we have lag values computed, we are to be able to merge this dataset
    with our original DataFrame to have all the data consolidated into a single structure
    to ease the calculation of statistical trends. In the following code example,
    we demonstrate how simple it is to merge two different data frames into a single
    one:


    ```

    lagged = grouped_kdf.merge(lag_grouped_kdf, left_index=True, right_index=True,
    suffixes=['''', ''_lag''])

    lagged.head()

    ```'
