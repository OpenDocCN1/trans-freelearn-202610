- pgno: 128
  md: "# Batching table read and writes\n\nWhen performing DDL operations such as\
    \ merge and update on several large tables stored in databases with high concurrency,\
    \ the transaction log can become blocked and lead to real outages in the data\
    \ warehouse. All SQL statements are atomic, which means that modifications that\
    \ take a long time will cause data to be locked for as long as the process is\
    \ being executed, which can be a problem for real-time databases. To reduce the\
    \ computational burden of these operations, we can optimize some of them so that\
    \ they can run on smaller, easier-to-handle batches that only lock resources for\
    \ brief periods.\n\nLet's see how we can implement batch reads and writes in Delta\
    \ Lake, thanks to the options provided by the Apache Spark API.\n\n# Creating\
    \ a table\n\nWe can create Delta Lake tables either by using the Apache Spark\
    \ DataFrameWriter or by using DDL commands such as CREATE TABLE. Let's take a\
    \ look:\n\n+   - Delta Lake tables are created in the metastore, which is also\
    \ where the path of the table is saved, even though this is not the ground truth\
    \ of the table, which still lies in Delta Lake:\n+   \n+   ```\n+   CREATE TABLE\
    \ data (\n+       input_date DATE,\n+       record_id STRING,\n+       record_type\
    \ STRING,\n+       record_data STRING)\n+   USING DELTA\n+   ```\n+   - We can\
    \ also perform this operation using Python. The following command creates a table\
    \ named \"data\" in the metastore:\n+   \n+   ```\n+   df.write.format(\"delta\"\
    ).saveAsTable(\"data\")\n+   ```\n+   - We can also create this table by identifying\
    \ its path:\n+   \n+   ```\n+   df.write.format(\"delta\").save(\"/mnt/delta/data\"\
    )\n+   ```"
  merge: -1
  img_proc: true
- pgno: 129
  md: "Here, we can see that Delta tables can be created either by common SQL commands\
    \ or by simply using the PySpark API, which is convenient for reducing the changes\
    \ required in the code so that it can adapt to using Delta tables.\n\nThe next\
    \ section will show the many ways in which we can read the tables once they have\
    \ been created.\n\n# Reading a Delta table\n\nDelta tables can be loaded in two\
    \ different ways:\n\n+   - First, we can specify a table in the metastore as we\
    \ would do in any SQL environment; that is, by using SELECT:\n+   \n+     `SELECT\
    \ * FROM data`\n+   \n+     Here, data is the table that we want to read from.\n\
    \n```\nSELECT * FROM data\n```\n\nHere, data is the table that we want to read\
    \ from.\n\n+   - The other way we can load a table is to specify the path of the\
    \ Delta file. We can do this by using delta as prefix to the table’s location:\n\
    +   \n+     `SELECT * FROM delta.'/mnt/delta_tables/data'`\n+   \n+     Here,\
    \ '/mnt/delta_tables/data' is the location of the table.\n\n```\nSELECT * FROM\
    \ delta.'/mnt/delta_tables/data'\n```\n\nHere, '/mnt/delta_tables/data' is the\
    \ location of the table.\n\n+   - As usual, we can also use Python to do this.\
    \ To query a table by its name, we can run the following command:\n+   \n+   \
    \  `spark.table(\"data\")`\n+   \n+     Here, data is the table that we want to\
    \ read from.\n\n```\nspark.table(\"data\")\n```\n\nHere, data is the table that\
    \ we want to read from.\n\n+   - Also, we can query the same table by referring\
    \ to its path:\n+   \n+     `spark.read.format(\"delta\").load(\"/mnt/delta_tables/data\"\
    )`\n+   \n+     Here, '/mnt/delta_tables/data' is the location of the table.\n\
    \n```\nspark.read.format(\"delta\").load(\"/mnt/delta_tables/data\")\n```\n\n\
    Here, '/mnt/delta_tables/data' is the location of the table.\n\nOne thing to bear\
    \ in mind is that every time we read from a table, we are looking at the most\
    \ recent snapshot of a table, without the need to use the REFRESH command. You\
    \ can also specify partition statements to read data in a more efficient manner,\
    \ as we will see in the following sections."
