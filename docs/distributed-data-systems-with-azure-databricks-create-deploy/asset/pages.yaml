- pgno: 347
  md: '# 11

    Managing and Serving Models with MLflow and MLeap


    In the previous chapter, we learned how we can fine-tune models created in Azure
    Databricks. The next step is how we can effectively keep track and make use of
    the models that we train. Software development has clear methodologies for keeping
    track of code, having stages such as staging or production versions of the code
    and general code lifecycle management processes, but it''s not that common to
    see that applied to machine learning models. The reasons for this might vary,
    but one reason could be that the data science team follows its own methodologies
    that might be closer to academia than the production of software, as well as the
    fact that machine learning doesn''t have clearly defined methodologies for development
    life cycles. We can apply some of the methodologies used commonly in software
    for machine learning models in Azure Databricks.


    This chapter will focus on exploring how the models and processes we deploy can
    be used for inference. To do this, we have to provide a way to pack the used pipelines
    and work out how to deploy them to serve predictions. We will investigate this
    in more detail with the MLflow library, an open source platform integrated into
    Azure Databricks that allows us to manage the entire end-to-end machine learning
    model life cycles from training to deployment.'
  merge: -1
  img_proc: true
- pgno: 348
  md: 'MLflow allows you to keep track of the machine learning training process. The
    training process is called an *experiment* and we can access previous experiments
    to record and compare parameters, centralize model storage, and manage the deployment
    of the model as a **REpresentational State Transfer (REST) application programming
    interface (API)**. We will learn how to use MLflow in combination with the tools
    learned in the previous chapters. The examples will focus on the tracking and
    logging of the training process of machine learning algorithms and on how to deploy
    and manage models and apply version control to them.


    The concepts we will explore are listed as follows:


    +   - Managing the machine learning models

    +   - Model Registry example

    +   - Exporting machine learning pipelines using MLEap

    +   - Serving models with MLflow


    Before we dive into these concepts, let''s go through the technical requirements
    to execute the examples shown here.


    # Technical requirements


    To work on the examples given in this chapter, you need to have the following:


    +   - An Azure Databricks subscription

    +   - An Azure Databricks notebook attached to a running cluster with Databricks
    Runtime for Machine Learning (Databricks Runtime ML) with version 7.0 or higher


    # Managing machine learning models


    As we have seen before, in Azure Databricks we have at our disposal the MLflow
    Model Registry, which is an open source platform for managing the complete lifecycle
    of a machine learning or deep learning model. It allows us to directly manage
    models with a chronological linage, model versioning, and stage transition. It
    provides us with tools such as Experiments and Runs, which allow us to quickly
    visualize the results of training runs and hyperparameter optimization, and to
    maintain a proper model version control to keep track of which models we have
    available for serving and quickly update the current version if necessary.'
  merge: -1
  img_proc: true
- pgno: 349
  md: 'MLflow has in Azure Databricks a Model Repository user interface (UI) in which
    we can set our models to respond to REST API requests for inference, transition
    models between stages, and visualize metrics and unstructured data associated
    with the models, such as description and comments. It gives us the possibility
    of managing our models either from the Model Registry API or directly from the
    Model Registry UI:


    ![](img/7e45bd08916c2a17d4e75cbb898f41e8_349_0.png)


    Figure 11.1 – Models in the MLflow registry


    In this section, we will learn the core concepts of MLflow and reinforce some
    of the methods that we have seen in previous chapters.


    Before we jump into the actual way in which we can manage models in MLflow, let''s
    look at the core concepts associated with models, as follows:


    +   - **Model**: This is the actual MLflow model that is logged in to the registry
    from an experiment or run using the mlflow.[model-flavor].log_model methods, after
    which it can then be registered in the Model Registry.

    +   - **Registered Model**: This is a model that was first logged in to the Model
    Registry and then later registered in the model repository. This should have a
    unique name and has properties such as versions, lineage, and other associated
    artifacts.

    +   - **Model Stage**: Models in MLflow can be in one or more of the available
    stages that we can assign to it. The available options of the stage are None,
    Staging, Production, and Archived. Any user that has the proper read and write
    permissions can transition a model between stages.

    +   - **Model Version**: This is indicative of the number of times that a model
    was committed to the repository. This means that when we register a model it is
    assigned Version 1, and every time we register a model with the same name, the
    version will be incremented.'
  merge: -1
  img_proc: true
- pgno: 350
  md: '+   - **Activities:** Each of the events to which the model was subjected,
    such as stages transition, new versions being registered, and so on. This allows
    us to keep track of models in a more detailed way throughout all their life cycles.

    +   - **Description:** Unstructured metadata that we can add to the models to
    have a better context of what is the purpose of the model, and any other relevant
    data surrounding its development or use.


    Given this very summarized description of the basic concepts around MLflow Model
    Registry models in Azure Databricks, we can start to learn how we can register
    a model, transition it between stages, and make use of available models in the
    registry. These concepts will be shown in more detail in the next sections.


    # Using MLflow notebook experiments


    As we have seen in previous sections, using MLflow mlflow.start_run() in an Azure
    Databricks notebook logs the metrics and parameters used in the run as an active
    experiment. Each experiment has a run ID, which is a unique numerical identifier.
    We can visualize a notebook experiment and its corresponding runs by clicking
    on the Experiment button in the notebook toolbar. This will show us the run parameters
    and associated metrics. We also have the option to download all the associated
    artifacts used in the run.


    We cannot delete a notebook experiment because they are part of the notebook itself.
    This is important to note because if we use the MLflow Client.tracking.delete_experiment(),
    it will delete the notebook itself too.


    All MLflow runs will logged into into the active experiment. If there is no active
    experiment, Azure Databricks will create a new one. We can set the active experiment
    in which we want to log our artifacts in the following ways:


    +   - Using mlflow.set_experiment() to specify the experiment in which we want
    to log the run

    +   - Setting the experiment ID as a parameter of the mlflow.start_run() command

    +   - Setting environment variables named MLFLOW_EXPERIMENT_NAME or MLFLOW_EXPERIMENT_ID


    If we don''t specify any experiment, the run will be logged to the notebook experiment.'
  merge: -1
  img_proc: true
- pgno: 351
  md: 'It is useful to note that we have two types of experiment in MLflow, outlined
    as follows:


    +   - **Workspace experiment**: This is not associated with any notebook. Any
    job or notebook can log a run into one of them by specifying the workspace experiment
    ID.


    +   - **Notebook experiment**: This is associated with a specific notebook and
    it''s the default option when no experiment ID was passed as a parameter of the
    run. Only MLflow runs within that specific notebook can be logged into the Notebook
    experiment.


    Workspace experiments can be created in the Azure Databricks Workspace UI or by
    using the MLflow API:


    +   - We can use the runs of the experiments to query the metrics and parameters
    used on them. For example, if we want to query the runs in an experiment with
    an **R-squared (R2)** metric greater than 0.3, we can go to the Search Runs field
    in the Experiment tab in the Notebook toolbar and enter the following expression:


    ```

    metrics.r2 > 0.3

    ```


    +   - In a similar way, we can filter the runs that have a certain set of parameters
    using the following syntax:


    ```

    params.max_depth = 4

    ```


    ```

    params.max_depth = 4 AND metrics.accuracy > 0.8

    ```


    +   - You also have the option to filter the runs based on the state or version
    of a model by using the Filter option in the Search Runs box. You can access drop-down
    menus with the State and Linked models.


    +   - We can track the version of the Notebook or Git project used for a run in
    the following ways:


    +   a) We can click in the **Source** field of a run if this was created from
    an Azure Databricks notebook or job.


    +   b) If the run was created from a Git project, the **Source** field of the
    run will be a link to the branch of the Git project used to trigger the run.


    +   - Finally, if it''s a workspace experiment and the run was logged in to the
    experiment, the model will be displayed as an artifact that can be downloaded
    from the registered model page in the Model Registry UI.


    Now that we have learned a bit more about the concepts of experiments and runs,
    we will learn in the next sections how to register and manage the lifecycle of
    a machine or deep learning model in Azure Databricks.'
  merge: -1
  img_proc: true
- pgno: 352
  md: "# Registering a model using the MLflow API\n\nAs mentioned before, we have\
    \ many ways in which we can register a model in the MLflow Model Registry. We\
    \ can very simply use the MLflow API to register a model by using the mlflow.[model-flavor].log_model\
    \ method to log and register a model in the registry. If no other model has been\
    \ registered with the same name it will return a ModelVersion MLflow object and\
    \ will name this first model as Version 1. If we have another model with the same\
    \ name, it will increase the model version and return the new current version\
    \ of the model:\n\n+   - An example of this is shown in the following code snippet,\
    \ using the Python MLflow API in azure Databricks:\n\n```\nwith mlflow.start_run(run_name=<run-name>)\
    \ as run:\n    <train and evaluate the model>\n    mlflow.<model-flavor>.log_model(<model-flavor>=<model>,\n\
    \        artifact_path=\"<model-path>\",\n        registered_model_name=\"<model-name>\"\
    \n    )\n```\n\n+   - We can also register a model with a specified model name\
    \ once the training in the experiment is over. This is especially useful if we\
    \ have developed several models and we want to register one of them specifically\
    \ in the registry. We can do this using the mlflow.register_model() method and\
    \ passing the model path as an argument. We can do this in the following way:\n\
    \n```\nresult_model=mlflow.register_model(\n\"runs:<new_model_path>\",\n\"<model-to-update-name>\"\
    )\n```\n\nIf we already have a model with the same name, this will update the\
    \ version of the model; otherwise, it will create a new model with a name of Version\
    \ 1.\n\n+   - Also, we can use the MLflow create_registered_model() method to\
    \ create a new registered model, as illustrated in the following code snippet.\
    \ Although this approach is similar to the previous method, this will raise an\
    \ MlflowException error if the model is in the Model Registry already:\n\n```\n\
    client = MlflowClient()\nresult = client.create_registered_model(\"<model-name>\"\
    )\n```\n\nNow that we have the model registered in the MLflow Model Registry,\
    \ we can control the stage of the model. We will see how to do this in the next\
    \ section."
  merge: -1
  img_proc: true
- pgno: 353
  md: "# Transitioning a model stage\n\nWe have mentioned before that we have several\
    \ stages that can be assigned to a model. Specifically, these stages are None,\
    \ Staging, Production, and Archived. As is common in other data engineering environments,\
    \ the Staging stage is where all the models that are in an experimental or testing\
    \ phase can be found, and the Production stage is where all the models that are\
    \ already tested and are now being consumed by production processes are to be\
    \ found. Finally, the Archived stage is where we place all the models that have\
    \ been replaced by newer versions or that are scheduled to be deleted. The stages\
    \ of models are not exclusive, so a model can belong to more than one stage.\n\
    \nAny user with the proper permissions can request a model to be transitioned\
    \ to another stage, but if you have full permissions, you can do this transition\
    \ with no intermediary. If you are falling short on the permissions on that model,\
    \ the request can be reviewed by someone with higher access to it.\n\nYou can\
    \ see the requests regarding transitioning models in the Model Registry UI in\
    \ the following screenshot:\n\n![](img/7e45bd08916c2a17d4e75cbb898f41e8_353_0.png)\n\
    \nFigure 11.2 – Request to move a model to another stage\n\nWe will get started\
    \ with the transition as follows:\n\n+   1. To transition a model between stages,\
    \ we can use either the Model Registry UI or the MLflow API to do this programmatically.\
    \ To do this, we can use the transition_model_version_stage() method, as illustrated\
    \ in the following code snippet:\n\n```\nclient = MlflowClient()\nclient.transition_model_version_stage(\n\
    \    name=\"<our_model>\",\n    version=<model-version>,\n    stage=\"<target_stage>\"\
    ,\n    description=\"<description>\"\n)\n```"
  merge: -1
  img_proc: true
- pgno: 354
