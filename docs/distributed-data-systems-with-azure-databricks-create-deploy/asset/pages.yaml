- pgno: 333
  md: "```\nfrom hyperopt import fmin, tpe, hp, STATUS_OK\ndef objective(x):\n   \
    \ return {'loss': x, 'status': STATUS_OK }\nbest = fmin(objective,\n    space=hp.uniform('x',\
    \ -5, 5),\n    algo=tpe.suggest,\n    max_evals=50)\nprint(best)\n```\n\nWe can\
    \ take full advantage of being able to return dictionaries by using the Trials\
    \ object, which allows us to store much more information while executing the optimization.\
    \ In the following example, we are modifying the objective function to return\
    \ a more complex output that will, later, be stored in the Trials object. We can\
    \ do this by passing it as an argument of the Hyperopt fmin() function:\n\n```\n\
    import pickle\nimport time\nfrom hyperopt import fmin, tpe, hp, STATUS_OK, Trials\n\
    def objective(x):\n    return {\n        'loss': x,\n        'status': STATUS_OK,\n\
    \        'eval_time': time.time(),\n        'more_data': {'type': None, 'value':\
    \ [0, 1]},\n        'attachments':\n            {'time_module': pickle.dumps(time.time)}\n\
    \    }\ntrials_obj = Trials()\nbest_params = fmin(objective,\n    space=hp.uniform('x',\
    \ -5, 5),\n    algo=tpe.suggest,\n    max_evals=50,\n    trials=trials_obj)\n\
    print(best_params)\n```"
