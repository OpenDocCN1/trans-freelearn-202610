    # Building the ML model


    Here, we will use a classifier given the fact that what we are trying to predict
    is a binary output on a tabular dataset. The selected algorithm will be a Random
    Forest classifier available in the scikit-learn Python library. We will also make
    use of MLflow to keep track of the model performance, and to save the model for
    later use:


    +   1. We will start by doing all the necessary imports, as follows:


    ```

    import mlflow

    import mlflow.pyfunc

