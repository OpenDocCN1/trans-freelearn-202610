    \ icon next to the stage from the trial job. Click it and find the list of tasks.\
    \ Click the 'stderr' link for a task to view trial logs.\n100%|██████████| 32/32\
    \ [03:08<00:00, 5.88s/trial, best loss: -0.8359011627906977]\nTotal Trials: 32:\
