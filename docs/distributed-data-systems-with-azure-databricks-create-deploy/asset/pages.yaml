    \ returns a valid prediction.\n\nThe next step is to obviously consume the predictions\
    \ made by this model by making REST API requests to the available endpoints.\n\
    \nFor example, we can make a request to a model using a curl bash command. For\
    \ example, for a given model we can structure the request, as shown in the following\
    \ code snippet:\n\n```\ncurl -X POST -u token:$DATABRICKS_API_TOKEN $MODEL_VERSION_URI\
    \ \\\n  -H 'Content-Type: application/json' \\\n  -d '[\\n    {\\n        \"sepal_length\"\
    : 4.2,\\n        \"sepal_width\": 3.1,\\n        \"petal_length\": 2.1,\\n   \
    \     \"petal_width\": 0.1\\n    }\\n]'\n```\n\nIn this example, we are passing\
    \ a request to a simple classifier trained on the Iris dataset. You should replace\
    \ the DATABRICKS_API_TOKEN and MODEL_VERSION_URI placeholders in the endpoint\
    \ with your generated Databricks API token and Model URI respectively.\n\nHere,\
    \ we are passing JSON as key-value structured data and receiving the response\
    \ from the model endpoint.\n\nWe can also do this programmatically using Python.\
    \ In the next example, we will make a request to the endpoint using Pandas DataFrames\
    \ and NumPy arrays:\n\n+   1. First, we will define a function to serialize the\
    \ data into JSON, as follows:\n\n```\nimport numpy as np\nimport pandas as pd\n\
    def create_tf_serving_json(data):\n```"
