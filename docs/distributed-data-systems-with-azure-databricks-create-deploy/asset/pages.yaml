- pgno: 246
  md: "In the following sections, we will discuss the necessary libraries needed to\
    \ perform the operations introduced, as well as providing some context on how\
    \ best practices and some core concepts are related to them.\n\nWithout further\
    \ ado, let's start working with machine and deep learning models in Azure Databricks.\n\
    \n# Loading data\n\n**Comma-separated values (CSV)** are the most widely used\
    \ format for tabular data in machine learning applications. As the name suggests,\
    \ it stores data arranged in the form of rows, separated by commas or tabs.\n\n\
    This section covers information about loading data specifically for machine learning\
    \ and deep learning applications. Although we can consider these concepts covered\
    \ in the previous chapters and sections, we will reinforce concepts around how\
    \ we can read tabular data directly into Azure Databricks and which are the best\
    \ practices to do this.\n\n# Reading data from DBFS\n\nWhen training machine learning\
    \ algorithms in a distributed computing environment such as Azure Databricks,\
    \ the need to have shared storage becomes important, especially when working with\
    \ distributed deep learning applications. Azure **Databricks File System (DBFS)**\
    \ allows efficient access to data for any cluster using Spark and local file **application\
    \ programming interfaces (APIs)**:\n\nIn Azure Databricks, we have an option to\
    \ choose a Machine Learning Runtime that provides a high-performance **Filesystem\
    \ in Userspace (FUSE)** mount, which is a virtual filesystem that can be accessed\
    \ in the /dbfs location by all cluster nodes. This allows for the process that\
    \ is running in cluster nodes to read to the same location using the distributed\
    \ storage system with local file APIs.\n\n+   - For example, when we write a file\
    \ to the DBFS location, as illustrated in the following code snippet, we are using\
    \ the shared filesystem across all cluster nodes:\n\n```\nwith open(\"/dbfs/tmp/test_dbfs.txt\"\
    , 'w') as f:\n    f.write(\"This is\\n\")\n    f.write(\"in the shared\\n\")\n\
    \    f.write(\"file system.\\n\")\n```"
  merge: -1
  img_proc: true
- pgno: 247
  md: "+   - In the same way, we can read a file on the distributed filesystem using\
    \ local file APIs, as illustrated in the following code snippet:\n\n```\nwith\
    \ open(\"/dbfs/tmp/test_dbfs.txt\", \"r\") as f_read:\n    for line in f_read:\n\
    \        print(line)\n```\n\n+   - This way, we can display the output to the\
    \ console, as shown in the following screenshot:\n\n```\nCmd 1\n1 with open(\"\
    /dbfs/tmp/test_dbfs.txt\", 'w') as f:\n2     f.write(\"This is\\n\")\n3     f.write(\"\
    in the shared\\n\")\n4     f.write(\"file system.\\n\")\n5 with open(\"/dbfs/tmp/test_dbfs.txt\"\
    , \"r\") as f_read:\n6     for line in f_read:\n7         print(line)\n8\n```\n\
    \nThis is\n\nin the shared\n\nfile system.\n\nFigure 8.1 – Output of reading a\
    \ file in the shared filesystem\n\nWhen using Azure Databricks Runtime ML, we\
    \ have the option to use the dbfs:/ml folder, which is a special folder that has\
    \ been optimized to offer high-performance input/output (I/O) for deep learning\
    \ operations. This is especially handy as a workaround to the limitation of supporting\
    \ files that are smaller than 2 gigabytes (GB) in Azure Databricks, so it is recommended\
    \ to save data in this folder.\n\nWe can load data for training and inference\
    \ of machine and deep learning applications by reading from tables or local CSV\
    \ files, as we will see in the next section. Once the data has been loaded, we\
    \ have plenty of options to then convert it to Spark DataFrames, pandas DataFrames,\
    \ or NumPy arrays."
  merge: -1
  img_proc: true
- pgno: 248
  md: "In the next section, we will again go through how we can read CSV files to\
    \ work with distributed deep learning applications in Azure Databricks.\n\n# Reading\
    \ CSV files\n\nOne of the most frequent formats for machine learning data is CSV,\
    \ and it's regularly used to hold tabular data. Here, we use the term tabular\
    \ data to describe data structured as rows representing observations, which in\
    \ turn are described using variables or attributes in the form of columns.\n\n\
    As we have seen in previous chapters, we have a number of ways to load a CSV file\
    \ into Azure Databricks. The first option would be to import the data into a Spark\
    \ DataFrame using the PySpark API to parse the data. The following piece of code\
    \ will read the file stored in the specified databricks dataset folder in DBFS\
    \ into a Spark DataFrame inferring the underlying data types in the file:\n\n\
    ```\ndiamonds = spark.read.format('csv').options(header='true',\n inferSchema='true').load('/databricks-datasets/Rdatasets/data-001/csv/ggplot2/diamonds.csv')\n\
    ```\n\nIn Azure Databricks, we have also the option of using Structured Query\
    \ Language (SQL) commands to import data from a CSV file into a temporary view\
    \ that we can then query. We can do this by using %%sql magic in a cell and loading\
    \ the data in the CSV file into a temporary view, as follows:\n\n```\n%sql\nCREATE\
    \ TEMPORARY VIEW diamonds\nUSING CSV\nOPTIONS (path \"/databricks-datasets/Rdatasets/data-001/csv/ggplot2/diamonds.csv\"\
    , header \"true\", mode \"FAILFAST\")\n```\n\nPay attention to the fact that here,\
    \ we pass the FAILFAST mode to stop the parsing of the file, causing an exception\
    \ if faulty lines are found in it.\n\nOnce the data has been imported into the\
    \ view, we can use SQL commands to perform queries on the temporary view, as follows:\n\
    \n```\n%sql\nSELECT * FROM diamonds\n```"
  merge: -1
  img_proc: true
- pgno: 249
  md: 'This will show us the temporary view that we just created, as illustrated in
    the following screenshot:


    ![](img/7e45bd08916c2a17d4e75cbb898f41e8_249_0.png)


    Figure 8.2 - Using SQL to read from a CSV file


    If we read a CSV file specifying the schema, we may encounter some issues if the
    specified schema differs from what we have specified—for example, we may have
    a string value in a column that was specified as an integer data type. This could
    lead to results that differ considerably from the actual data. Therefore, it is
    always good practice to verify the correctness of the data.


    We can specify the behavior of the CSV parser by selecting one of the available
    modes in which the parser runs. The available options for this mode are outlined
    here:


    +   - **PERMISSIVE**: This is the default mode. Here, null values are inserted
    in fields that have not been parsed correctly. This allows us to inspect rows
    that have not been parsed correctly.

    +   - **DROPMALFORMED**: This mode drops lines that hold values that could not
    be parsed correctly.

    +   - **FAILFAST**: This mode aborts the reading of the file if any malformed
    data is found.


    To set the mode, use the mode option, as illustrated in the following code snippet:


    ```

    drop_wrong_schema = sqlContext.read.format("csv").

    option("mode", "FAILFAST")

    ```'
  merge: -1
  img_proc: true
- pgno: 250
  md: "In the next example, we will read a CSV file, specifying a known schema of\
    \ the data with the parser mode set to drop malformed data if its type is not\
    \ as specified. As discussed before, specifying the schema is always a good practice.\
    \ If the schema of the data is already known, it is better to avoid schema inference.\
    \ Here, we will read a file with columns for ID, name, and last name, the first\
    \ as an integer and the rest as strings:\n\n```\nfrom pyspark.sql.types import\
    \ StructType, StructField\nfrom pyspark.sql.types import DoubleType, IntegerType,\n\
    StringType\ndata_schema = StructType([\n    StructField(\"id\", IntegerType()),\n\
    \    StructField(\"name\", StringType()),\n    StructField(\"lastname\", StringType())\n\
    ])\n(sqlContext\n.read\n.format(\"com.databricks.spark.csv\")\n.schema(data_schema)\n\
    .option(\"header\", \"true\")\n.option(\"mode\", \"DROPMALFORMED\")\n.load(\"\
    some_input_file.csv\"))\n```\n\nNow that we have gone through how to read tabular\
    \ data from CSV files, we can use the data to extract features from it. These\
    \ features will allow us to accurately model our data and have more effective\
    \ machine learning and deep learning models. In the next section, we will learn\
    \ how to perform feature engineering in Azure Databricks.\n\n# Feature engineering\n\
    \nMachine learning models are trained using input data to later provide as an\
    \ outcome a prediction on unseen data. This input data is regularly composed of\
    \ features that usually come in the form of structured columns. The algorithms\
    \ use this data in order to infer patterns that may be used to infer the result.\
    \ Here, the need for feature engineering arises with two main goals, as follows:\n\
    \n+   - Refactoring the input data to make it compatible with the machine learning\
    \ algorithm we have selected for the task. For example, we need to encode categorical\
    \ values if these are not supported by the algorithm we choose for our model."
  merge: -1
  img_proc: true
- pgno: 251
  md: '+   - Improving the predictions produced by the models according to the performance
    metric we have selected for the problem at hand.


    With feature engineering, we extract relevant features from the raw input data
    to be able to accurately represent it according to the way in which the problem
    to be solved has been modeled, resulting in an improvement in the performance
    model on novel data. It''s good to keep in mind that the features used will influence
    the performance of the model more than everything else.


    Feature engineering can be considered the process of transforming the input data
    into something that is easier to interpret for the machine learning algorithm
    by making key features or patterns more transparent, although we can sometimes
    generate new features to make the data visualization more interpretable or the
    pattern inference clearer for the model algorithm.


    There are multiple strategies applied in feature engineering. Some of them are
    listed here:


    +   - Missing data imputation and management

    +   - Outlier handling

    +   - Binning

    +   - Logarithmic transformations

    +   - One-hot encoding

    +   - Normalization

    +   - Grouping and aggregation operations

    +   - Feature splitting

    +   - Scaling


    Some of these strategies have their application in just some algorithms or datasets,
    while others can be beneficial in all cases.


    It is a common belief to think that the better the features you model, the better
    the performance you will achieve. While this is true in certain circumstances,
    it can also be misleading.


    The performance of the model has many factors, with different degrees of importance.
    Among those factors are the selection of the algorithm, the available data, and
    the features extracted. You can also add to those factors the way in which the
    problem is modeled, and the objective metrics used to estimate performance. Nevertheless,
    great features are needed to effectively describe the structures inherent in your
    data and will make the job of the algorithm easier.'
  merge: -1
  img_proc: true
- pgno: 252
  md: "When working with large amounts of data, tools such as Spark SQL and MLlib\
    \ can be very effective when used in feature engineering. Some third-party libraries\
    \ are also included in Databricks Runtime ML, such as scikit-learn, which provides\
    \ useful methods to extract features from data.\n\nThis section does not intend\
    \ to go too deep into the mechanics of each algorithm, although some concepts\
    \ will be reinforced to understand how they are applied in Azure Databricks.\n\
    \n# Tokenizer\n\nTokenization can be generally described as a process in which\
    \ we transform a string of input characters into an array formed by the individual\
    \ sections that form it. These sections are called tokens and are generally individual\
    \ words, but can be a certain number of characters, or a combination of words\
    \ called n-grams. We will use these resulting tokens later on for some other form\
    \ of processing to extract or transform features. In this sense, the tokenization\
    \ process can be considered a task of feature engineering. The tokens are identified\
    \ based on the specific modes that are passed to the parser.\n\nIn PySpark, we\
    \ can use the simple Tokenizer class to tokenize a sequence of string inputs.\
    \ The following code example shows how we can split sentences into sequences of\
    \ words:\n\n```\nfrom pyspark.ml.feature import Tokenizer\nsentenceDataFrame =\
    \ sqlContext.createDataFrame([\n    (0, \"Spark is great for Data Science\"),\n\
    \    (0, \"Also for data engineering\"),\n    (1, \"Logistic regression models\
    \ are neat\")\n], [\"label\", \"sentence\"])\ntokenizer = Tokenizer(inputCol=\"\
    sentence\", outputCol=\"words\")\nwordsDataFrame = tokenizer.transform(sentenceDataFrame)\n\
