- pgno: 243
  md: "# Plotly\n\nPlotly is an interactive graphing library in Python that Azure\
    \ Databricks supports. To use Plotly, you can either install the Plotly PyPI package\
    \ and attach it to your cluster or use pip commands to install it as a notebook-scoped\
    \ library.\n\nIn Databricks notebooks, it is recommended to use Plotly on its\
    \ offline version and take into account that its performance may not be the best\
    \ when handling large datasets. Therefore, if there are performance issues, you\
    \ should try to reduce the amount of data used in the plot:\n\nTo display a Plotly\
    \ plot, we must first store the resulting plot in an object and then pass this\
    \ object to the displayHTML function. In order to exemplify this, let's first\
    \ import Plotly and Numpy and then create some fake data to create a plot out\
    \ of it:\n\n```\nfrom plotly.offline import plot\nfrom plotly.graph_objs import\
    \ *\nimport numpy as np\nThen, we can create some random data to plot:\nx = np.random.randn(1000)\n\
    y = np.random.randn(1000)\n```\n\nAfter this, we will create the plot but instead\
    \ of calling the plot function to display the visualization, we will store the\
    \ plot in an object, making sure that we pass the output_type keyword argument\
    \ set to div:\n\n```\np = plot(\n[\n    Histogram2dContour(x=x, y=y,\n    contours=Contours(coloring='heatmap')),\n\
    \    Scatter(x=x, y=y, mode='markers',\n    marker=Marker(color='white', size=3,\
    \ opacity=0.3))\n],\n    output_type='div'\n)\n```\n\nFinally, we can display\
    \ the plot by calling the displayHTML function:\n\n```\ndisplayHTML(p)\n```"
