- pgno: 126
  md: 'In the next section, we will discuss how to automatically ingest data using
    Auto Loader, which is a Delta Lake feature that automatically ingests data into
    a Delta table.


    # Auto Loader


    The problem of how to ingest data arises very frequently when working with data
    lakes. How the files are going to be read poses a problem if they are coming from
    different sources such as streams of data or IoT devices, which could lead to
    us needing to implement another service such as Event Hub and, from there, store
    it in the data lake. Another workaround would be to read the files from the data
    lake in batches or partitioned by time, which would increase complexity and hurt
    performance.


    Auto Loader is an Azure Databricks feature that helps solve these issues by loading
    files in an incremental way, as soon as they arrive in storage. It does this using
    a structured source named cloudFiles. When specifying a path to work in, this
    can be set to process files that already exist on that directory. It can also
    detect files arriving by directory listing or file notification.


    Auto Loader is a feature of Azure Databricks that allows us to process files as
    soon as they arrive in storage. This is done using a streaming source called cloudFiles,
    which reads files that arrive in a directory. We can also process existing files
    in that directory. We have two ways to detect files that are arriving in the storage
    directory: listing the files in the directory and using a file notification system.
    In both modes, Auto Loader will keep track of which files have been processed.


    The file notification option detects files that are arriving, based on notifications
    that come from an Azure Event Grid subscription, to the file events in the storage
    account. Take into account that when you select this option, all the required
    services, such as storage account selected and Azure Event Grid, are created automatically
    and need to be cleaned manually later.


    In both modes, files are processed exactly once, even if the file gets appended
    or overwritten. If a file is appended to or overwritten, it won''t be clear which
    version of the file is being processed. Therefore, it is best to only use Auto
    Loader to ingest immutable files. Let''s take a look at this:


    +   - In the following Python command, we''re reading a stream and using the useNotifications
    option, while set to true, to activate file notifications:


    ```

    df = spark.readStream.format("cloudFiles") \

    .option("cloudFiles.useNotifications","true") \

    .schema(<schema>) \

    .load(<input-path>)

    ```'
  merge: -1
  img_proc: true
- pgno: 127
  md: '+   - In a more general way, we can read a stream into a DataFrame using the
    following Python command:

    +   - Then, once we have read the stream, we can write it to a delta table by
    specifying a checkpoint location:


    ```

    df = spark.readStream.format("cloudFiles").

    option(<cloudFiles-option>, <option-value>) \

    .schema(<file_schema>) .load(<input-path>)

    ```


    ```

    df.writeStream.format("delta").

    option("checkpointLocation", <checkpoint-path>).

    start(<output-path>)

    ```


    When a new stream is created, a checkpoint is created in that directory. If the
    checkpoint is changed when the service is restarted, it will be assumed that a
    new stream has been created. The file notification process is more suitable when
    we''re dealing with large amounts of data. This is because files are processed
    just once when they arrive, with no need for us to list the entire directory,
    as well as because multiple streaming queries can run in one input directory simultaneously.


    One of the drawbacks of file notification is the need to spin up more resources
    in order to detect the files arriving in storage. It''s more suitable when we''re
    managing a large number of files, and it''s also a more scalable solution.


    Directory listing is the default mode of Auto Loader. This mode does what it says
    and lists the directory to identify files that arrive in it. It doesn''t need
    to configure new permissions and is suitable for when a small number of files
    are arriving regularly in storage. However, if the number of files increases rapidly,
    it can quickly become difficult to list the entire directory.


    If you need to change to file notification mode, you will need to restart the
    streaming process.


    In the next section, we will learn how we can optimize DDL operations that are
    being performed on the data that we just fetched by batching table operations.'
