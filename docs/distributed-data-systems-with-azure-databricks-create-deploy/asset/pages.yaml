- pgno: 317
  md: '# 10

    Model Tracking and Tuning in Azure Databricks


    In the previous chapter, we learned how to create machine learning and deep learning
    models, as well as how to load datasets during distributed training in Azure Databricks.
    Finding the right machine learning algorithm to solve a problem using machine
    learning is one thing, but finding the best hyperparameters is another equally
    or more complex task. In this chapter, we will focus on model tuning, deployment,
    and control by using MLflow as a Model Repository. We will also use Hyperopt to
    search for the best set of hyperparameters for our models. We will implement the
    use of these libraries using deep learning models that have been made using the
    scikit-learn Python library.


    More concretely, we will learn how to track runs of the machine learning model''s
    training to find the most optimal set of hyperparameters, deploy and manage version
    control for the models using MLflow, and learn how to use Hyperopt as one of the
    alternatives to operations such as random and grid search for model tuning. We
    will be covering the following topics:


    +   - Tuning hyperparameters using AutoML

    +   - Automating model tracking with MLflow'
  merge: -1
  img_proc: true
- pgno: 318
  md: '+   - Hyperparameter tuning with Hyperopt

    +   - Optimizing model selection with scikit-learn, Hyperopt, and MLflow


    Before we dive into these concepts, let’s go through the requirements for this
    chapter.


    # Technical requirements


    To work on the examples in this chapter, you must have the following:


    +   - An Azure Databricks subscription.

    +   - An Azure Databricks notebook attached to a running cluster with Databricks
    Runtime ML version 7.0 or higher.


    # Tuning hyperparameters with AutoML


    In machine learning and deep learning, hyperparameter tuning is the process in
    which we select a set of optimal hyperparameters that will be used by our learning
    algorithm. Here, hyperparameters are values that are used to control the learning
    process. In contrast, other parameters will be learned from the data. In this
    sense, a hyperparameter is a concept that follows its statistical meaning; that
    is, it’s a parameter from a prior distribution that captures the prior belief
    before we start to learn from the data.


    In machine learning and deep learning, it is also common to call hyperparameters
    the parameters that are set before we start to train our model. These parameters
    will control the training process. Some examples of hyperparameters that are used
    in deep learning are as follows:


    +   - Learning rate

    +   - Number of epochs

    +   - Hidden layers

    +   - Hidden units

    +   - Activation functions'
  merge: -1
  img_proc: true
- pgno: 319
  md: 'These parameters will directly influence the performance and training time
    of our models, and their selection plays a crucial role in the success of our
    model. For example, a neural network with a learning rate that''s too low will
    fail to accurately capture patterns in the observed data. Finding good hyperparameters
    requires us to efficiently map the search space if possible, which can be a daunting
    task. This is because to find each set of good values, we need to train a new
    model, and this is an operation that can be expensive in terms of time and computational
    resources. Some of the techniques that are used for this include common algorithms
    such as Grid Search, Random Search, and Bayesian Optimization.


    One of the techniques that we can apply to search for the best hyperparameters
    more efficiently is **AutoML**, which stands for **automated machine learning**.
    This is the process of automatically applying machine learning to solve optimization
    problems, which in our case is to optimize the hyperparameters that are used in
    our training algorithm. This helps us overcome problems that might arise from
    manually searching for the right hyperparameters or by applying techniques such
    as Grid and Random Search, which are algorithms that must be run for a long time.
    This is because they search for all the possible values in the search space without
    evaluating how promising these areas might be.


    Azure Databricks Runtime for Machine Learning (Databricks Runtime ML) provides
    us with two options to automatically map the search space of possible hyperparameters.
    These are known as MLflow and Hyperopt, two open source libraries that apply AutoML
    to automate model selection and hyperparameter tuning.


    HyperOpt is a Python library designed for large-scale Bayesian optimization for
    the hyperparameters of models. It can be used to scale the search process to several
    computing cores in a distributed manner. Although we will just focus on the hyperparameter
    optimization side of things, it can be also used to optimize pipelines, as well
    as for data preprocessing, learning algorithm selection, and, of course, hyperparameter
    tuning. To use HyperOpt, we need to define an optimizer that will be applied to
    the desired function to optimize any function, which in our case can be to maximize
    the performance metric or to minimize the loss function. In our examples, HyperOpt
    will take a search space of hyperparameters and will move according to the previous
    results, thus moving over the search space in an informed manner, differentiating
    itself from algorithms such as random search and grid search.'
  merge: -1
  img_proc: true
- pgno: 320
  md: 'The other available library in the Azure Databricks Runtime for Machine Learning
    that''s used to automatically map the search space of possible hyperparameters
    is MLflow, which we have discussed in previous chapters. MLflow is an open source
    platform that is used to manage end-to-end machine learning and deep learning
    model life cycles and supports automated model tuning tracking. This automated
    model tracking comes from its integration with the Spark MLlib library. It allows
    us to track which hyperparameters yield the best results by using CrossValidator
    and TrainValidatorSplit, which automatically log the validation metrics and hyperparameters
    to make it easier to get the best models.


    In the upcoming sections, we will learn how to apply both HyperOpt and MLflow
    to track the obtain the best hyperparameters for the models that have been trained
    with the Azure Databricks Runtime for Machine Learning.


    # Automating model tracking with MLflow


    As we mentioned previously, MLflow is an open-source platform for managing machine
    and deep learning model life cycles, which allows us to perform experiments, ensure
    reproducibility, and support easy model deployment. It also provides us with a
    centralized model registry. As a general overview, the components of MLflow are
    as follows:


    +   - MLflow Tracking: It records all data associated with an experiment, such
    as code, data, configuration, and results.

    +   - MLflow Projects: It wraps the code in a format that ensures the results
    can be reproduced between runs, regardless of the platform.

    +   - MLflow Models: This provides us with a deployment platform for our machine
    learning and deep learning models.

    +   - Model Registry: The central repository for our machine learning and deep
    learning models.'
  merge: -1
  img_proc: true
- pgno: 321
  md: 'In this section, we will focus on MLflow Tracking, which is the component that
    allows us to log and register the code, properties, hyperparameters, artifacts,
    and other components related to training deep learning and machine learning models.
    The MLflow Tracking component relies on two concepts, known as experiments and
    runs. The experiment is where we execute the training process and is the primary
    unit of organization; all runs belong to an experiment. Therefore, these experiments
    refer to a specific run and we can visualize it, compare it, and download logs
    and artifacts related to it. The following information is stored in each MLflow:


    +   - Source: This is the notebook that the experiment was run in.

    +   - Version: The notebook version or Git commit hash if the run was triggered
    from an MLflow Project.

    +   - Start and end time: The start and end time of the training process.

    +   - Parameters: A dictionary containing the model parameters that were used
    in the training process.

    +   - Metrics: A dictionary containing the model evaluation metrics. MLflow records
    and lets you visualize the performance of the model throughout the course of the
    run.

    +   - Tags: These run metadata saved as key-value pairs. You can update tags during
    and after a run completes. Both keys and values are strings.

    +   - Artifacts: These are any data files in any format that are used in the run,
    such as the model itself, the training data, or any other kind of data that''s
    used.


    In Azure Databricks Runtime for Machine Learning, every time we use CrossValidator
    or TrainValidationSplit in the code while training our algorithm, MLflow will
    store the hyperparameters and evaluating metrics to make visualizing and, ultimately,
    finding the optimal model, easier.


    In the following sections, we will learn how to use CrossValidator and TrainValidationSplit
    while training our algorithm to leverage the advantages of MLflow and visualize
    the hyperparameters that yielded the best results.'
  merge: -1
  img_proc: true
- pgno: 322
  md: "# Managing MLflow runs\n\nWhen we use CrossValidator or TrainValidationSplit\
    \ while training the model, we will have nested MLflow runs. These will be nested\
    \ as follows:\n\n+   - Main run: The information for CrossValidator or TrainValidationSplit\
    \ is logged to the main run. If there is no active run, MLflow will create a new\
    \ run and log into it, ending it before exiting the process.\n+   - Child runs:\
    \ Each hyperparameter value and its corresponding performance metrics are logged\
    \ in a child run that is dependent on the parent run.\n\nThese nested runs are\
    \ common when we are performing a hyperparameter search for multi-step processing.\
    \ For example, we can have nested runs that look as follows:\n\n```\nwith mlflow.start_run(nested=True):\n\
    \    mlflow.log_param(\"lr\", 0.05)\n    mlflow.log_param(\"batch_size\", 256)\n\
    \    with mlflow.start_run(nested=True):\n        mlflow.log_param(\"max_runs\"\
    , 16)\n        mlflow.log_param(\"epochs\", 10)\n        mlflow.log_metric(\"\
    rmse\", 98)\nmlflow.end_run()\n```\n\nThese nested runs will be shown in the MLflow\
    \ UI as a tree that can be expanded so that we can view the results in more detail.\
    \ This allows us to keep the results from different child runs organized in the\
    \ main run.\n\nWhen discussing MLflow run management, we need to be sure that\
    \ we are logging into the main run. To ensure this, when the fit() function is\
    \ called, this should be wrapped inside a mlflow.start_run() statement to log\
    \ the information into the right run. As we have seen already, this way, we can\
    \ easily place metrics and parameters inside the run. If the fit() function is\
    \ called many times in the same active run, MLflow will append unique identifiers\
    \ to the names of the parameters and metrics that are used to avoid any possible\
    \ conflicts in the naming.\n\nIn the next section, we will see an example of how\
    \ to use MLflow tracking with MLlib to find the optimal set of hyperparameters\
    \ for a machine learning model."
  merge: -1
  img_proc: true
- pgno: 323
  md: "# Automating MLflow tracking with MLlib\n\nIn this section, we will exemplify\
    \ the use of MLflow for tracking the performance of a PySpark MLlib DecisionTreeClassifier\
    \ model. MLflow will keep track of the model's learning and will also allow us\
    \ to store all the artifacts used in the process. We will center our attention\
    \ on examining the hyperparameters that yielded the best results to find the optimal\
    \ settings. The model will be trained using the MNIST dataset, which is included\
    \ in the Databricks example datasets. The dataset is in LIBVSM format and is divided\
    \ into train and test data. It contains two columns – one for the label and the\
    \ other for the image encoded in 784 features. Let's get started:\n\n+   1. First,\
    \ we will load the data while specifying the number of features and cache the\
    \ data in the worker memory:\n\n```\ntrain_data = spark.read.format(\"libsvm\"\
    ) \\\n    .option(\"numFeatures\", \"784\") \\\n    .load(\"/databricks-datasets/mnist-digits/data-001/\n\
    \    mnist-digits-train.txt\")\ntest_data = spark.read.format(\"libsvm\") \\\n\
    \    .option(\"numFeatures\", \"784\") \\\n    .load(\"/databricks-datasets/mnist-digits/data-001/\n\
    \    mnist-digits-test.txt\")\ntrain_data.cache()\ntest_data.cache()\n```\n\n\
    +   2. After this, we can display the number of records in each dataset and display\
    \ the training data:\n\n```\nprint(\"Train images:{} ; test images {}\".format(train_data.count(),\
    \ test_data.count()))\ndisplay(train_data)\n```\n\nTo pass these features to the\
    \ machine learning model, we need to do some feature engineering. We can standardize\
    \ these operations into a single pipeline using MLlib, which allows us to pack\
    \ several preprocessing operations into a single workflow. MLlib Pipelines is\
    \ very similar to the pipeline implementation in scikit-learn and has five main\
    \ components. These are as follows:\n\n+   - DataFrame: The actual DataFrame that\
    \ holds our data.\n+   - Transformer: The algorithm that will transform the data\
    \ in a features DataFrame into data for a predictions DataFrame, for example."
