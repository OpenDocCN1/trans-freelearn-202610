    # Exporting and loading pipelines with MLeap


    When we train a machine learning or deep learning model, our intention is to be
    able to use it several times to predict new observations of data. To do this,
    we must be able to not only store the model but also load it back again into one
    or more platforms. Therefore, we encounter the need to serialize the model for
    future use in scoring or predictions.


    MLEap is a commonly used format to serialize and execute machine learning and
    deep learning pipelines made in popular frameworks such as Apache Spark, scikit-learn,
    and TensorFlow. It is commonly used for making individual predictions rather than
    batch predictions. These serialized pipelines are called bundles and can be exported
    as models and later be loaded and deployed back into Azure Databricks to make
    new predictions.


    In this section, we will learn how to use MLEap to export and load back again
    a DecisionTreeClassifier MLlib model to make predictions using a saved pipeline
    in Azure Databricks. The steps that we will follow are listed here:


    +   - We will create and fit a pipeline made using an MLlib model.

    +   - We will serialize and export the pipeline using MLEap as a ZIP file and
    save it.

    +   - We will load back the serialized model again and use it to make predictions
    on new unseen data.


    It is important to note that MLEap is included with Azure Databricks Runtime ML,
    so if you are using a common runtime, you will need to install the MLEap-Spark
    package from the Maven repository at a cluster or notebook level, as well as the
    MLflow as a PyPi package to keep track of the experiment run and be able to also
    save the model in the MLflow Model Registry:


    1. The first step will be to create the pipeline that we will serialize and reuse
    later. We will create an MLlib DecisionTreeClassifier that will be used to predict
    the labels of the News example dataset available in Azure Databricks. We will
    begin by first reading the data that will be used to train the model and cache
    it into the workers'' memory, by running the following code:


    ```

    training_data = spark.read.parquet("/databricks-datasets/news20.binary/data-001/training").select("text",
    "topic")

    training_data.cache()

    ```'
