    \        optimizer = keras.optimizers.Adadelta(lr=learning_rate * hvd.size())\n\
    \        optimizer = hvd.DistributedOptimizer(optimizer)\n    model.compile(optimizer=optimizer,\n\
    \                    loss='categorical_crossentropy',\n                    metrics=['accuracy'])\n\
    \    callbacks = [\n        hvd.callbacks.BroadcastGlobalVariablesCallback(0),\n\
    \    ]\n    if hvd.rank() == 0:\n        callbacks.append(keras.callbacks.ModelCheckpoint(\n\
    \    checkpoint_path,\n    save_weights_only = True))\n    model.fit(x_train,\
    \ y_train,\n                batch_size=batch_size,\n                callbacks=callbacks,\n\
    \                epochs=epochs,\n                verbose=2,\n                validation_data=(x_test,\
    \ y_test))\n```\n\nWe will use this function in order to distribute the training\
    \ to the workers. We will set an np parameter in HorovodRunner that relates to\
    \ the specified number of parameters—a value that is dependent on the number of\
    \ available workers. So, if we specify np=1, HorovodRunner will train on the driver\
    \ node on a single-process execution.\n\nIn this example, we will set the np value\
    \ to 2:\n\n```\nfrom sparkdl import HorovodRunner\ncheckpoint_path = checkpoint_dir\
    \ + '/checkpoint-{epoch}.ckpt'\nhr = HorovodRunner(np=2)\nhr.run(train_hvd, checkpoint_path=checkpoint_path,\n\
    \    learning_rate=0.1)\n```"
  merge: -1
  img_proc: true
- pgno: 388
  md: "The process will be executed by HorovodRunner by transforming the defined functions\
    \ to get the dataset and create the model, and then transform them into pickle\
    \ files that will then be distributed to the workers, as illustrated in the following\
    \ screenshot:\n\n![](img/7e45bd08916c2a17d4e75cbb898f41e8_388_0.png)\n\nFigure\
    \ 12.4 – Dataset transformed to pickle files\n\nThe workers in turn read and deserialize\
    \ the functions and run them in order to train the model.\n\nAfter the process\
    \ has been completed, we can load the model trained by HorovodRunner and use it\
    \ to run predictions on new data. We can use the Keras model that we have previously\
    \ defined using the tf.train.latest_checkpoint() function to load the latest saved\
    \ checkpoint file, as follows:\n\n```\nimport tensorflow as tf\nhvd_model = get_model(num_classes)\n\
    hvd_model.compile(optimizer=tf.keras.optimizers.\nAdadelta(lr=learning_rate),\n\
    \                loss='categorical_crossentropy',\n                metrics=['accuracy'])\n\
    hvd_model.load_weights(tf.train.latest_checkpoint(os.path.dirname(checkpoint_path)))\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 389
  md: "We can test that the model has been correctly loaded by running predictions\
    \ on the test dataset, as follows:\n\n```\nnum_classes = 10\n_, (x_test, y_test)\
    \ = get_dataset(num_classes)\nloss, accuracy = hvd_model.evaluate(x_test, y_test,\n\
    \                                    batch_size=128)\nprint(\"loaded model loss\
    \ and accuracy:\", loss, accuracy)\n```\n\nIn this way, and by making small but\
    \ meaningful changes to the code, we have adopted a single machine-training script\
    \ in order to be able to use it for distributed learning in Azure Databricks,\
    \ running on both CPU and GPU clusters.\n\nIn the next section, we will learn\
    \ how to leverage the advantages of the horovod library in order to tune the model's\
    \ hyperparameter.\n\n# Distributing hyperparameter tuning using Horovod and Hyperopt\n\
    \nAs we have seen previously, we can improve the performance of the model by tuning\
    \ the hyperparameter using Hyperopt. Hyperopt evaluated the best hyperparameter\
    \ by generating trials for different points in the defined search space, using\
    \ an adaptive strategy. The evaluations take advantage of the distributed nature\
    \ of Azure Databricks.\n\nThe Hyperopt trials are evaluated on a single node while\
    \ HorovodRunner is launched from the driver node, and distributes the training\
    \ to the workers. We will learn how we can use HorovodRunner in order to increase\
    \ the performance of the model tuning, using distributed learning to run the trials.\n\
    \nThe first objective is to define a function that will be passed to HorovodRunner\
    \ in order to run the distributed learning. To do this, we will define a function\
    \ to minimize, specify a search space of hyperparameters, and use the Hyperopt\
    \ fmin() function to tune the model. The change compared to the example in the\
    \ previous section is that this training will be optimized to run a distribution,\
    \ using HorovodRunner. The next train function is passed to the Hyperopt fmin()\
    \ function, to be the target function to be minimized. It is configured to return\
    \ a dictionary with key values named loss and Status, as required by the Hyperopt\
    \ fmin() function."
  merge: -1
  img_proc: true
- pgno: 390
  md: "Here, we are using the previously defined train_hvd() function:\n\n```\nfrom\
    \ hyperopt import fmin, tpe, hp, Trials, STATUS_OK\nfrom sparkdl import HorovodRunner\n\
    \ndef wrap_train(params):\n    hr = HorovodRunner(np=2)\n    loss, acc = hr.run(train_hvd,\n\
    \                        learning_rate=params['learning_rate'],\n            \
    \            batch_size=params['batch_size'],\n                        checkpoint_dir=checkpoint_dir)\n\
    \    return {'loss': loss, 'status': STATUS_OK}\n```\n\nThe next step is to define\
    \ the search space over which we will scan for the best set of hyperparameters.\
    \ Here, we will use the Hyperopt optimization algorithm to tune the learning rate\
    \ and batch size:\n\n```\nimport numpy as np\nspace = {\n    'learning_rate':\
    \ hp.loguniform('learning_rate',\n                                   np.log(1e-4),\n\
    \                                   np.log(1e-1)),\n    'batch_size': hp.choice('batch_size',\
    \ [32, 64, 128]),\n}\n```\n\nNow that we have defined the objective function and\
    \ the search space that will be scanned, we can use the Hyperopt fmin() function\
    \ to run the hyperparameter optimization. While Hyperopt will take advantage of\
    \ the parallel execution on each of the workers, the horovod library will distribute\
    \ the process to each of the available workers.\n\nTo run the optimization, we\
    \ must use the max_eval parameter in order to specify the number of points that\
    \ will be evaluated for each defined test case in the search space, generating\
    \ a model as a trial, and use it to evaluate the model in that point of the search\
    \ space."
  merge: -1
  img_proc: true
- pgno: 391
  md: "In this case, we will be using as a search algorithm hyperopt.tpe.suggest,\
    \ which is the Tree of Parzen Estimator, an adaptive approach that selects the\
    \ hyperparameter to be tested based on previous results. Given this, we can find\
    \ the best parameters by running the following code block:\n\n```\nbest_param\
    \ = fmin(\n    fn=wrap_train,\n    space=space,\n    algo=tpe.suggest,\n    max_evals=8,\n\
    \    return_argmin=False,\n)\n```\n\nOnce the target function to be minimized\
    \ has been optimized, we can print out the parameters that produced the best model,\
    \ as follows:\n\n```\nprint(best_param)\n```\n\nOne important thing to notice\
    \ is that in the Hyperopt fmin() function, we are not using a trials parameter.\
    \ This is because when Hyperopt is used in conjunction with HorovodRunner, we\
    \ don't need to pass a trials argument because Hyperopt will use the default Trials\
    \ class instead of SparkTrials. This is because the SparkTrials class is not usable\
    \ in distributed training because the evaluations are done on a single node.\n\
    \nIn this simple example, we have extended the functionality of HorovodRunner\
    \ in order to use it for hyperparameter tuning of the CNN TensorFlow model that\
    \ was originally trained on a single node. To do this, we have created a target\
    \ objective function to be minimized by the hyperopt library, defined a search\
    \ space based on the hyperparameters that we want to scan, and run hyperparameter\
    \ tuning using a cluster with two workers running Azure Databricks Runtime for\
    \ Machine Learning.\n\nThe next section will introduce Spark TensorFlow Distributor,\
    \ a library that allows us to distribute train TensorFlow machine learning models\
    \ in Azure Databricks."
  merge: -1
  img_proc: true
- pgno: 392
  md: '# Using the Spark TensorFlow Distributor package


    One of the most commonly used frameworks in deep learning is the TensorFlow library,
    which also supports distributed training on both CPU and GPU clusters. We can
    use it to train deep learning models in Azure Databricks by using Spark TensorFlow
    Distributor, which is a library that aims to ease the process of training TensorFlow
    models with complex architecture and lots of trainable parameters in distributed
    computing systems with large amounts of data.


    Spark was limited to distributed training because of the standard execution mode,
    which is the Map/Reduce mode. In this mode, jobs are executed independently in
    each worker without any communication between them. In Spark 3.0, there is a new
    execution mode named barrier execution that allows us to easily train deep learning
    models in a distributed way by allowing communication between workers during the
    execution.


    Spark TensorFlow Distributor is a TensorFlow-native package that makes use of
    the barrier execution mode, allowing workers to share data between each other
    during the execution. It is already installed on Azure Databricks Runtime for
    Machine Learning, but you can also do the install using pip on a cluster, like
    this:


    ```

    pip install spark-tensorflow-distributor

    ```


    Before the implementation of the barrier execution mode, it was necessary to manage
    Map/Reduce-based jobs, which made the implementation very inefficient for distributed
    training of deep learning models.


    The Spark TensorFlow Distributor library is built around the tensorflow.distribute.Strategy
    TensorFlow API, which is designed to distribute training in GPUs or CPU clusters.
    It can be used to distribute the training while making minor changes to the training
    script. It was built in order to do the following:


    +   - Ease the transition from single machine training to distributed training
    on a cluster.

    +   - Distribute custom training scripts made using TensorFlow.


    In this section, we will demonstrate how we can implement a distributed training
    strategy for TensorFlow deep learning models using the MirroredStrategyRunner
    class of the Spark TensorFlow Distributor library.


    To use the Spark TensorFlow Distributor library, we just need to provide a train()
    function with a certain structure, and the package will handle the necessary configurations.'
  merge: -1
  img_proc: true
- pgno: 393
  md: "We will start by first making an import of the TensorFlow library and setting\
    \ the initial parameters, which are the number of workers and available GPUs.\
    \ We will assume that the driver and nodes have the same types of instances, therefore\
    \ the calculation of total available GPUs will be the number of GPUs in a worker\
    \ times the number of instances in the cluster. The code is shown in the following\
    \ snippet:\n\n```\nimport tensorflow as tf\n\nNUM_WORKERS = 2\nCLUSTER_GPUS =\
    \ len(tf.config.list_logical_devices('GPU')) * NUM_WORKERS\nUSE_GPU = CLUSTER_GPUS\
    \ > 0\n```\n\nNext, we will create a training function that will run on a single\
    \ machine before we distribute the training to the workers. It is important to\
    \ note that it is recommended to make the imports inside the function. This is\
    \ because the training function will be serialized to a pickle and this way, we\
    \ avoid any possible issue in this process. In the function, the workflows are\
    \ implemented next, as follows:\n\n+   1. We define and call a function to load\
    \ the MNIST dataset and transform it to a normalized dataset of tensors.\n+  \
    \ 2. We define and call a function to create and compile the model that will be\
    \ trained.\n+   3. We define the autoshard data policy, which is a TensorFlow\
    \ parameter used in distributed learning to specify the way in which the way.\
    \ If the option is set to FILES, the data will be distributed into the workers\
    \ partitioned by files. If the option is set to DATA, all workers receive the\
    \ full dataset but will only work on the portion assigned to them.\n+   4. We\
    \ fit the model on the train data.\n\nLet's define the training function using\
    \ a default learning rate, buffer, and batch size, as follows:\n\n```\ndef train(BUFFER_SIZE\
    \ = 5000, BATCH_SIZE = 32, learning_rate=0.005):\n    import tensorflow as tf\n\
    \    import uuid\n\n    def get_datasets():\n        (mnist_images, mnist_labels),\
    \ _ = \\\n            tf.keras.datasets.mnist.load_data(path=str(uuid.\n```"
  merge: -1
  img_proc: true
- pgno: 394
  md: "```\nuuid4()+'mnist.npz')\n\ndataset = tf.data.Dataset.from_tensor_slices((\n\
    \    tf.cast(mnist_images[..., tf.newaxis] / 255.0,\n            tf.float32),\n\
    \    tf.cast(mnist_labels, tf.int64))\n)\n\ndataset = dataset.repeat().shuffle(BUFFER_SIZE).\n\
    batch(BATCH_SIZE)\n    return dataset\n```\n\nNow that we have defined the function\
    \ that will load, preprocess, and return the training data, we can define a function\
    \ that will create the Keras CNN, as follows:\n\n```\ndef get_model():\n    model\
    \ = tf.keras.Sequential([\n        tf.keras.layers.Conv2D(32, 3, activation='relu',\n\
    \                                input_shape=(28, 28, 1)),\n        tf.keras.layers.MaxPooling2D(),\n\
    \        tf.keras.layers.Flatten(),\n        tf.keras.layers.Dense(128, activation='relu'),\n\
    \        tf.keras.layers.Dense(10, activation='softmax'),\n    ])\n    model.compile(\n\
    \        loss=tf.keras.losses.sparse_categorical_crossentropy,\n        optimizer=tf.keras.optimizers.SGD(learning_rate=learning_rate),\n\
    \        metrics=['accuracy'],\n    )\n    return model\n    train_datasets =\
    \ get_datasets()\n    worker_model = get_model()\n    options = tf.data.Options()\n\
    \    options.experimental_distribute.auto_shard_policy = \\\n        tf.data.experimental.AutoShardPolicy.DATA\n\
    \    train_datasets = train_datasets.with_options(options)\n    worker_model.fit(x=train_datasets,\
    \ epochs=3,\n                     steps_per_epoch=5)\n```"
  merge: -1
  img_proc: true
- pgno: 395
  md: "Once we have defined the function that will handle the model creation, compilation,\
    \ and training, we can run the training using the Spark TensorFlow Distributor\
    \ MirroredStrategyRunner class in local mode. This mode will train the model in\
    \ all the driver-available GPUs. The code is shown in the following snippet:\n\
    \n```\nfrom spark_tensorflow_distributor import MirroredStrategyRunner\nrunner\
    \ = MirroredStrategyRunner(num_slots=1,\n                                local_mode=True,\n\
    \                                use_gpu=USE_GPU)\nrunner.run(train)\n```\n\n\
    In this very simple way, we can execute the code in the local node by setting\
    \ the local_mode parameter to True. Now, in order to run the distributed training,\
    \ we will set the local_mode parameter to False as we want our function to run\
    \ on the workers of the Spark cluster.\n\nWe will define a number of slots that\
    \ depend on whether we have a GPU available or not. If we have a GPU available,\
    \ the number of slots will be set to the number of available GPUs. If we are using\
    \ a CPU cluster, we should set the number of slots to a reasonable number, which\
    \ in our case is 4, as can be seen in the following code snippet:\n\n```\nNUM_SLOTS\
    \ = CLUSTER_GPUS if USE_GPU else 4\nrunner = MirroredStrategyRunner(num_slots=CLUSTER_GPUS,\n\
    \                                use_gpu=USE_GPU)\nrunner.run(train)\n```\n\n\
    The MirroredStrategyRunner class is a strategy designed for nodes that have multiple\
    \ GPUs available, but we can also specify a custom strategy for the distributed\
    \ training. To do so, you need to create a tf.distribute.Strategy object within\
    \ the train() function and set use_custom_strategy to True in the MirroredStrategyRunner\
    \ function.\n\nAs an example, we can change the distributed training strategy\
    \ to make use of tf.distribute.experimental.MultiWorkerMirroredStrategy. The MultiWorkerMirroredStrategy\
    \ strategy is designed to distribute the training across workers that may or may\
    \ not have GPUs in a synchronous manner. It is similar to MirroredStrategy but\
    \ differs in the fact that it implements an All-Reduce execution mode to be able\
    \ to make the nodes work together. The code is shown here:\n\n```\ndef train_custom_strategy():\n\
    \    import tensorflow as tf\n```"
  merge: -1
  img_proc: true
- pgno: 396
  md: "```\nstrategy = tf.distribute.experimental.\nMultiWorkerMirroredStrategy(\n\
    \    tf.distribute.experimental.CollectiveCommunication.NCCL)\nwith strategy.scope():\n\
    \    import uuid\n    BUFFER_SIZE = 10000\n    BATCH_SIZE = 32\n    def make_datasets():\n\
    \        (mnist_images, mnist_labels), _ = \\\n            tf.keras.datasets.mnist.load_data(path=str(uuid.uuid4())+'mnist.npz')\n\
    \n        dataset = tf.data.Dataset.from_tensor_slices((\n            tf.cast(mnist_images[...,\
    \ tf.newaxis] / 255.0,\n                tf.float32),\n            tf.cast(mnist_labels,\
    \ tf.int64))\n        )\n        dataset = dataset.repeat().shuffle(BUFFER_SIZE).\n\
    batch(BATCH_SIZE)\n        return dataset\n\n    def get_model():\n        model\
    \ = tf.keras.Sequential([\n            tf.keras.layers.Conv2D(32, 3, activation='relu',\n\
    \                input_shape=(28, 28, 1)),\n            tf.keras.layers.MaxPooling2D(),\n\
    \            tf.keras.layers.Flatten(),\n            tf.keras.layers.Dense(138,\
    \ activation='relu'),\n            tf.keras.layers.Dense(10, activation='softmax'),\n\
    \        ])\n        model.compile(\n            loss=tf.keras.losses.sparse_categorical_crossentropy,\n\
    \            optimizer=tf.keras.optimizers.SGD(learning_rate=0.001),\n       \
    \     metrics=['accuracy'],\n        )\n        return model\n```"
  merge: -1
  img_proc: true
- pgno: 397
  md: "```\ntrain_datasets = make_datasets()\nworker_model = get_model()\noptions\
    \ = tf.data.Options()\noptions.experimental_distribute.auto_shard_policy = \\\n\
    \    tf.data.experimental.AutoShardPolicy.DATA\ntrain_datasets = train_datasets.with_options(options)\n\
    worker_model.fit(x=train_datasets, epochs=3,\n    steps_per_epoch=5)\n```\n\n\
    Now, we can distribute the training of the model by running MirroredStrategyRunner\
    \ with the local_mode and use_custom_strategy parameters set to True for local\
    \ execution of the specified training strategy, as follows:\n\n```\nrunner = MirroredStrategyRunner(num_slots=1,\n\
    \                                use_custom_strategy=True,\n                 \
    \               local_mode=True,\n                                use_gpu=USE_GPU)\n\
    runner.run(train_custom_strategy)\n```\n\nWe can run this in local mode to verify\
    \ that the script works properly before scaling the training. We can check this\
    \ by verifying that CollectiveCommunication.NCCL is printed in the logs.\n\nAs\
    \ we can see, the Spark TensorFlow Distributor is an alternative to HorovodRunner\
    \ for managing distributed training of TensorFlow deep learning models. We can\
    \ use this library to train the models both on a single node and in a cluster\
    \ in a very simple way, being able to harness the power of a GPU or CPU cluster\
    \ for distributed training of deep learning models.\n\n# Summary\n\nWe have learned\
    \ in this chapter about how we can improve the performance of our training pipelines\
    \ for deep learning algorithms, using distributed learning with Horovod and the\
    \ native TensorFlow for Spark in Azure Databricks. We have discussed the core\
    \ algorithms that drive the capability of being able to effectively distribute\
    \ key operations such as gradient descent and model weights update, how this is\
    \ implemented in the horovod library, included with Azure Databricks Runtime for\
    \ Machine Learning, and how we can use the native support now available for Spark\
    \ in the TensorFlow framework for distributed training of deep learning models."
  merge: -1
  img_proc: true
