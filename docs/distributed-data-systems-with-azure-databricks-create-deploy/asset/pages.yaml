- pgno: 232
  md: '# pandas DataFrame API (Koalas)


    Data scientists and data engineers that are Python users are very familiar with
    working with pandas DataFrames when manipulating data. pandas is a Python library
    for data manipulation and analysis but that lacks the capability to work with
    big data, therefore it is only suitable when working with small datasets. When
    we need to work with more data, the most common option is PySpark, as we have
    demonstrated in the previous section, which is a library with a very different
    syntax than pandas.


    Koalas is a library that eases the learning curve from transitioning from pandas
    to working with big data in Azure Databricks. Koalas has a syntax that is very
    similar to the pandas API but with the functionality of PySpark.


    Not all the pandas methods have been implemented and there are many small differences
    or subtleties that must be considered and might not be obvious. We cannot understand
    Koalas without understanding PySpark.


    Koalas, functionality is built around the Koalas DataFrame, which is a collection
    of data distributed across several workers and organized in rows with named columns.
    This is the main difference with the panda''s DataFrame, which is loaded into
    a single machine.


    In the next section, we will find how we can migrate from working with pandas
    and small datasets to using the Koalas API in Azure Databricks to work with large
    amounts of data.


    # Using the Koalas API


    We will describe up next how we can create different objects using the Koalas
    API that have their parallels in the pandas library. First, we will import the
    following packages, which are imported in the examples of the functionalities
    of the Koalas API and will allow us to use Koalas more flexibly:


    ```

    import numpy as np

    ```


    ```

    import pandas as pd

    ```


    ```

    import databricks.koalas as ks

    ```


    First, we will create a Koalas Series. This can be created by passing a list of
    values, in a very similar way in which we would create a pandas Series. A Koalas
    Series can also be created by a pandas Series.


    A pandas Series is created in the following way:


    ```

    pandas_series = pd.Series([1, 10, 5, np.nan, 10, 2])

    ```'
