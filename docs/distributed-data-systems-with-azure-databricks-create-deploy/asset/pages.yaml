    features\",\n    outputCol=\"normFeatures\", p=1.0)\nl1NormData = normalizer.transform(dataFrame)\n\
    # Normalize each Vector using $L^\\infty$ norm.\nlInfNormData = normalizer.transform(dataFrame,\
    \ {normalizer.p: float(\"inf\")})\n```\n\nThis normalization process is widely\
    \ used in feature engineering and will help us to standardize the data and improve\
    \ the behavior of learning algorithms.\n\n# StandardScaler\n\nIn many areas of\
    \ nature, things tend to be governed by normal or Gaussian probabilistic distribution.\
    \ Normalization is what we call in feature engineering the process of subtracting\
    \ the mean value of a feature, which allows us to center our feature around 0.\
    \ Then, we divide this by the standard deviation, which will tell us about the\
    \ spread of our feature around 0. Finally, we will obtain a variable that is centered\
    \ at 0, with a range of values between -1 and 1.\n\nIn Azure Databricks, we can\
    \ use the PySpark StandardScaler class to transform a dataset of Vector rows into\
    \ normalized features that have unit standard deviation and or 0 mean. It takes\
    \ the following parameters:\n\n+   - withStd: This parameter is set to true by\
    \ default. It scales the data to unit standard deviation, which means that we\
    \ divide by the standard deviation.\n\n+   - withMean: This parameter is set to\
    \ false by default. It will center the data with mean equal to 0 before scaling.\
    \ It creates a dense output, so this will not work on sparse input and will raise\
    \ an exception.\n\nThe PySpark StandardScaler class is a transformation that can\
    \ be fit on a dataset to produce a StandardScalerModel; this latter model can,\
    \ later on, be used to compute summary statistics on the input data. The StandardScalerModel\
    \ can then be transformed into a column Vector in a dataset with unit standard\
    \ deviation and/or 0 mean features.\n\nTaking into account that if the standard\
    \ deviation of a feature is already 0, StandardScalerModel will return as default\
    \ 0.0 as the value in the Vector for that feature."
