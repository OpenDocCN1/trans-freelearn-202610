- pgno: 156
  md: 'Running `ZORDER` multiple times will lead to multiple executions, but this
    is considered an incremental operation. Running `ZORDER` after new data has arrived
    won''t affect data that was already optimized.


    One thing to bear in mind is that running Z-Ordering does not relate to data size.
    The goal of the operation is to relocate related files but not to evenly distribute
    data as this can also lead to data skewness, an issue that we will see how to
    solve in the next sections.


    # Managing data recency


    As mentioned in the previous chapter, when querying a Delta table we are reading
    the latest state of that table unless specified otherwise, thanks to the fact
    that Delta tables are auto updated. This is a process that is run automatically,
    but in case we want to, we can modify this behavior if we don''t need it. This
    can happen when performing historical analysis, whereby we do not require tables
    to be previously updated. Doing this will yield lower latency when making queries,
    which in short means that queries will run faster.


    This behavior can be set using the `spark.databricks.delta.stalenessLimit` option,
    which takes as a parameter a `time` string value and applies this to the current
    session we are working on, so it won''t affect other users reading that table.
    The `time` parameters are expressed in **milliseconds (ms)** and can range, for
    example, from 1 hour to 1 day. If this staleness limit is surpassed, the table
    state will be updated.


    It''s good to mention that the parameter doesn''t block a table from being updated—it
    only avoids a query to wait for a table to be updated.


    # Understanding checkpoints


    We have already discussed checkpoints when talking about streaming sources on
    tables, but we haven''t completely talked about how they work.


    Delta Lake uses checkpoints to aggregate the state of a Delta table, to make this
    a starting point for a computation when we require the latest state of the table.
    Checkpoints are written by default every 10 commits and they are stored in the
    `_delta_log` directory in the path of a table.'
  merge: -1
  img_proc: true
- pgno: 157
  md: 'This mechanism saves a lot of time because otherwise, when querying a table,
    to get the latest state Delta Lake would have to read large amounts of JavaScript
    Object Notation (JSON) files that represent the transaction log of a table to
    obtain the last state.


    In a nutshell, checkpoints hold information relating to all the transactions and
    modifications made to a table until the current state, checking that previous
    actions that have been canceled out by more recent ones get removed from the checkpoint.
    These kinds of actions are called invalid actions and they are removed using a
    policy known as rules for reconciliation. This is done to reduce the overall size
    of the log and to make it more efficient to be read when reconstructing snapshots.
    As we can see, checkpoints are crucial for snapshot isolation and accessing previous
    versions of the data.


    Checkpoints are also the place where statistical information on column usage is
    stored to be used during—for example—Data Skipping.


    When looking at a log directory, we will see that it has a naming convention,
    as illustrated in the following code snippet:


    ```

    00000000000000001025.checkpoint.parquet

    ```


    We can see that the name of the checkpoint is composed by a prefix that refers
    to the version of the table that it holds and the file format of the table. In
    a more general manner, we could say that the name of the checkpoint of the n version
    of a table that has table_format would be n.checkpoint.table_format.


    Given this format and the nature of the transaction log, it would be quite difficult
    to list all the checkpoints in the directory (which can be in their thousands)
    if a user would like to access the latest checkpoint. Therefore, Delta Lake stores
    the last checkpoint in a _delta_log/_last_checkpoint file to provide easy access
    for constructing the latest snapshot of a table.'
  merge: -1
  img_proc: true
