    5. We will use this user-defined function to transform MLlib sparse vectors into
    dense arrays that we will then write as files in the Parquet format. The Petastorm
    library will sample groups of rows of the Parquet file into batches. As mentioned
    previously, the batch size is an important parameter for the utilization of I/O
    and computing performance and will yield better results if the optimized FUSE
    mount in the dfs:/ml directory is used. The parameter that controls the batch
    size is the parquet.block.size option, which is passed to the parser:


    ```

    parquet_path = os.path.join(work_dir, "parquet")

    df.selectExpr("toArray(features) AS features", "int(label) AS label") \

    .repartition(10) \

    .write.mode("overwrite") \

    .option("parquet.block.size", 1024 * 1024) \

    .parquet(parquet_path)

    ```


