  md: 'In the following code example, we first define a Structured Streaming dataframe,
    and then we use the display function to show the state of the data every 5 seconds
    of processing time, on a specific checkpoint location:


    ```

    streaming_df = spark.readStream.format("rate").load()

    display(streaming_df.groupBy().count(), processingTime = "5 seconds", checkpointLocation
    = "<checkpoint-path>")

    ```


    Specifically, these are the available parameters for this function:


    +   - The streamName parameter is the specific streaming query in question that
    we want to visualize.

    +   - The processingTime parameter defines the interval of time for how often
    the streaming query is executed. If it''s not specified, Azure Databricks will
    check for the availability of new data when the previous process has been completed—a
    behavior that could lead to undesired cost increases. Therefore, this is an option
    that is recommended to be set explicitly when possible.


    The checkpointLocation parameter is the path to where the checkpoint data is written.
    If not specified, the location will be temporary. It is recommended to set this
    parameter so that a stream can be restarted from where it was left in the case
    of any failure.


    The Azure Databricks display function supports a variety of plot types. We can
    choose different types of plots by selecting the desired type of plot from the
    drop-down menu in the top-left corner of the cell where we executed the function,
    as illustrated in the following screenshot:


