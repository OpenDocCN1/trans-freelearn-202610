- pgno: 165
  md: "# Configuring the Delta cache\n\nIt is recommended to always use Delta cache-accelerated\
    \ clusters for worker instances, which are optimized instances running SSD disks.\
    \ These instances are already configured to work with the Delta cache as default,\
    \ but you can manually configure its parameters using Apache Spark options during\
    \ the session creation:\n\n+   - To establish a maximum disk usage, which is set\
    \ by default to half of the worker local storage, you can use the maxDiskUsage\
    \ option, measured in bytes, as shown in the following example, where we set it\
    \ to 50g:\n+   \n+     ```\n+     spark.databricks.io.cache.maxDiskUsage 50g\n\
    +     ```\n+   - We can also specify the maximum allocated space measured in bytes\
    \ for metadata with the maxMetaDataCache option, as shown in the following example,\
    \ where it is set to 1g:\n+   \n+     ```\n+     spark.databricks.io.cache.maxMetaDataCache\
    \ 1g\n+     ```\n+   - We can also disable the compression, which is enabled by\
    \ default, as follows:\n+   \n+     ```\n+     spark.databricks.io.cache.compression.enabled\
    \ false\n+     ```\n+   - To disable the Delta cache, we can use the following\
    \ Scala command:\n+   \n+     ```\n+     spark.conf.set(\"spark.databricks.io.cache.enabled\"\
    ,\n+     \"false\")\n+     ```\n\nIt is good to know that when disabling the Delta\
    \ cache we will not lose data that was already stored in the worker local storage,\
    \ but we will avoid more data being added.\n\nIn the next section, you will read\
    \ about DFP, which is a Delta Lake feature that improves query performance.\n\n\
    # Optimizing queries using DFP\n\nDFP is a Delta Lake feature that automatically\
    \ skips files that are not relevant to a query. It is a default option in Azure\
    \ Databricks and works by collecting data about files in Delta Lake, without the\
    \ need to explicitly state that a file should be skipped on a query, improving\
    \ performance by making use of the granularity of the data."
  merge: -1
  img_proc: true
- pgno: 166
  md: 'The behavior of DFP concerning whether a process is enabled or not, the minimum
    size of a table, and the minimum number of files needed to trigger a process can
    be managed by the following options:


    +   - `spark.databricks.optimizer.dynamicPartitionPruning` (default is true):
    Whether DFP is enabled or not.

    +   - `spark.databricks.optimizer.deltaTableSizeThreshold` (default is 10 GB):
    The minimum size of the Delta table that activates DFP.

    +   - `spark.databricks.optimizer.deltaTableFilesThreshold` (default is 1000):
    Represents the number of files of the Delta table on the probe side of the join
    required to trigger DFP. If the number of files is low, it''s not worthwhile triggering
    the process.


    DFP can be used for non-partitioned tables, nonselective joins, and when performing
    DML operations on them.


    The improvement obtained by applying DFP is correlated with the level of granularity
    of the data. Therefore, it might be a good idea to apply Z-Ordering when working
    with DFP.


    # Using DFP


    To first understand how we apply DFP, let''s see an example of where we manually
    use literal statements and another Delta Lake feature called **dynamic partition
    pruning (DPP)**.


    During the physical planning phase, Delta Lake creates an executable plan for
    the query. This plan distributes the computation across the clusters of many workers.
    This plan is optimized to only scan files relevant to the query.


    If we were to run a query but we wanted to explicitly filter the results based
    on a condition. A more concrete example of this would be to select col1, col2,
    and col3 from our table, and apply a filtering condition on one of the columns
    based on a maximum value, as illustrated in the following code snippet:


    ```

    SELECT col1,col2,col3

    FROM our_table

    WHERE col1> max_value

    ```


    Delta Lake keeps information on the minimum and maximum value in our columns,
    so it will automatically skip files that are not relevant to our query, based
    on our filtering condition.'
  merge: -1
  img_proc: true
- pgno: 167
  md: 'This is possible because the filtering contains a literal condition (which
    in our case is a maximum value condition), so Delta Lake can plan and optimize
    the file scanning. If the filtering condition is part of a join, Delta Lake cannot
    plan which files to skip because the filtering condition is the result of another
    query. This is called DPP and is a previous feature of Delta Lake that, like DFP,
    seeks to improve the performance of our queries.


    The following kinds of queries, whereby we first join two or more tables, are
    very common when using data models based on a star schema:


    ```

    SELECT col1, col2, col3

    FROM fact_table src

    JOIN dim_table trg

    ON src.id_col=trg.id_col

    WHERE col1=our_condition

    ```


    In this case, the condition acts on the dimension table and not on the fact table.
    Delta Lake will have to scan all the files on the fact table, scan all the files
    in the dimension table, apply the filtering condition, and then perform the join.


    In this case, DPP won''t work, but if we have enabled DFP it will reorder the
    execution plan of the query to be able to check in advance the condition on both
    tables, which gives the possibility of skipping files on both tables and increasing
    the performance of the query.


    DFP is enabled by default in Azure Databricks, and it is applied to queries based
    on the following rules:


    +   - The join strategy is BROADCAST HASH JOIN.

    +   - The join type is INNER or LEFT-SEMI.

    +   - The inner table is a Delta table.

    +   - The number of files in the inner table is big enough to justify applying
    DFP.


    Depending on the selected options, DFP will be applied in a join operation.


    # Using Bloom filters


    Bloom filters are a way of efficiently filtering records in a database based on
    a condition. They have a probabilistic nature and are used to test the membership
    of an element in a set. We can encounter false positives but not false negatives.
    These filters were developed as a mathematical construct, to be applied when the
    amount of data to scan is impractical to be read, and are based on hashing techniques.'
  merge: -1
  img_proc: true
- pgno: 168
  md: 'Delta Lake provides us with the ability to apply Bloom filters on our queries
    to further improve performance. We will see how they work at a basic level and
    how they can be applied in Delta Lake.


    # Understanding Bloom filters


    As mentioned in the introduction to this section, Bloom filters are probabilistic
    data structures used to test if an element belongs to a category or not. This
    structure is a fixed-length bit array that is populated using a hash function,
    which maps the information into ones and zeros. The length of the array depends
    on the number of false positives that are tolerated. Boom filters have constant
    complexity and require very little space relative to the items.


    To map data into this probabilistic data structure, hashing functions that allow
    us to obtain a fingerprint of the data are used, meaning that this hash is (almost)
    unique and can be used to compare or identify data. These hashing functions are
    one-way operations and must always provide the same output for the same data,
    and—if possible—the output values must be uniformly and randomly distributed so
    that similar inputs won''t give the same results.


    These hashes can be later compared bitwise to check for similarity.


    In the following screenshot example, we compare if the W element belongs to the
    {x, y, z} group. To do this, we will compare the positions that have one of the
    resulting hash array of hashing W against the combined positions filled by all
    the hashes of the group. If all the 1s in the W hash are in the positions filled
    by the group''s hash, then W must be in the set. If any of the bits in the W hash
    fall into a 0, then they don''t belong to the set:


    ![](img/7e45bd08916c2a17d4e75cbb898f41e8_168_0.png)


    Figure 5.10 – Comparing hashes to check membership (image taken from https://en.wikipedia.org/wiki/Bloom_filter#/media/File:Bloom_filter.svg)


    In this case, the W element isn''t in the set since it hashes to a bit position
    containing 0.'
  merge: -1
  img_proc: true
- pgno: 169
  md: 'We can see that Bloom filters are a fast way of providing an answer if an element
    belongs to a set and that they are of great importance in data engineering. Next,
    we will see how we can implement Bloom filters in Delta Lake to ensure that our
    queries perform well.


    # Bloom filters in Azure Databricks


    Azure Databricks Delta Lake uses Bloom filters to check if a file matches a particular
    filter when running queries to enable data skipping. It does this by creating
    Bloom filter index files associated with each file, with up to five levels, which
    can quickly tell Delta Lake the probability of the file containing the required
    data or if it doesn''t match at all. These files are single-row Parquet files
    stored in a subdirectory in the path of the data file.


    If a Bloom index file doesn''t exist for a given file, this file will always be
    read. The size of the Bloom filter index files is, of course, proportional to
    the false positive rate (FPR) selected because a lower rate will always require
    more bits in the array to compare, which is—for example—5 bits for a given 10%
    FPR.


    _delta_index contains the index files, which have a naming format that is the
    same as for the data with the added index.v1.parquet suffix.


    We can enable or disable Bloom filters by setting the spark.databricks.io.skipping.bloomFilter.enabled
    session configuration to either true or false, as illustrated in the following
    screenshot. This option is already enabled by default in Azure Databricks:


    ![](img/7e45bd08916c2a17d4e75cbb898f41e8_169_0.png)


    Figure 5.11 – Setting Bloom filters as default for new Delta tables'
  merge: -1
  img_proc: true
- pgno: 170
  md: '# Creating a Bloom filter index


    We can create Bloom filters using the CREATE BLOOMFILTER INDEX command. This applies
    to all columns on a table or only a subset of them.


    The syntax to create a Bloom filter is shown in the following code snippet:


    ```

    CREATE BLOOMFILTER INDEX ON TABLE our_table

    FOR COLUMNS(col1 OPTIONS(fpp=0.1), col2 OPTIONS(fpp=0.2))]

    ```


    In the case of the COVID dataset used in the previous chapters, we can create
    a Bloom filter in the patient_id column, as shown in the following screenshot:


    ![](img/7e45bd08916c2a17d4e75cbb898f41e8_170_0.png)


    Figure 5.12 – Creating Bloom filters for a Delta table


    We can also reference the same command using the path to a Delta table, as illustrated
    in the following code snippet:


    ```

    CREATE BLOOMFILTER INDEX ON TABLE delta.''path_to_table''

    FOR COLUMNS(col1 OPTIONS(fpp=0.1), col2 OPTIONS(fpp=0.2))]

    ```


    In this case, we are creating Bloom filters for the col1 and col2 columns with
    FPRs of 10% and 20%, respectively.


    We can also pass the numItems option, which is the number of distinct items a
    file can contain, and the maxExpectedFpp option, which controls the maximum FPR
    for which a Bloom filter is not written to disk. That said, we have created a
    way to more quickly query our data written to memory, which we must compute just
    once.'
  merge: -1
  img_proc: true
- pgno: 171
  md: 'We can also drop all Bloom filters from a table using the DROP BLOOMFILTER
    INDEX command. If we would like to delete our recently created Bloom filter, we
    can run the following code:


    ```

    DROP BLOOMFILTER INDEX ON TABLE our_table

    FOR COLUMNS(col1 , col2)

    ```


    This will remove all the Bloom filters in the col1 and col2 columns. Bear in mind
    that running VACUUM on a table will also remove all Bloom filters.


    # Optimizing join performance


    Performing joins on tables can be a resource-expensive operation. To improve the
    performance of such operations, we can select a subset of the data or correct
    possible drawbacks, such as having a disproportionate distribution of file sizes
    in our data. Solving these issues can improve performance and lead to more efficient
    use of distributed computing power.


    Azure Databricks Delta Lake allows optimization of join operations by providing
    range filtering and correcting skewness in the distribution of the file size of
    the data in our tables.


    # Range join optimization


    Joins are used frequently, so optimizing these operations can lead to a great
    improvement in the performance of our queries. Range join optimization is the
    process of specifying that a join needs to be performed on a subset of data given
    by a range.


    Range join optimization is applied when join operations have a filtering condition
    whose type is either a numeric or datetime type, and can be understood as an interval
    and have a bin-size tuning number.


    An example of an interval can be seen in the following code snippet:


    ```

    SELECT * FROM data_points JOIN ranges ON data_points.p BETWEEN ranges.start_range
    and ranges.end_range;

    ```


    To use range join optimization, we need to establish the required bin size. To
    do this, we use a hint or set this up in the Spark session configuration, as it
    will not run unless specified. The bin-size number will be interpreted in days
    when using a date type and in seconds when using a timestamp.'
  merge: -1
  img_proc: true
- pgno: 172
  md: "# Enabling range join optimization\n\nWe enable range join optimization by\
    \ explicitly passing a hint with the parameter corresponding to the bin size.\
    \ The hint is called by using a specific RANGE_JOIN syntax on a SELECT statement\
    \ and receives as parameters the target table and the bin size. Besides tables,\
    \ we can also specify views and subqueries, taking into account that this might\
    \ hurt performance.\n\nIn the next example, the range join is established on a\
    \ table with a bin size of 20:\n\n```\nSELECT /*+ RANGE_JOIN(data_points, 20)\
    \ */ *\nFROM data_points JOIN ranges ON data_points.p >= ranges.start_range AND\
    \ points.p < ranges.end_range;\n```\n\nYou can also specify in range joins the\
    \ bin size as a percentile of the data. In the following case, this is 10%:\n\n\
    ```\nSELECT /*+ RANGE_JOIN(r1, 0.1) */ *\nFROM (SELECT * FROM ranges WHERE ranges.amount\
    \ < 100) r1,\nranges r2\nWHERE r1.start_range < r2.start_range + 100 AND r2.start_range\
    \ < r1.start_range + 100;\n```\n\nFinally, we can also specify the range join\
    \ in timestamps and datetime formats, as discussed before, using the BETWEEN command:\n\
    \n```\nSELECT /*+ RANGE_JOIN(data_points_c, 100) */ *\nFROM data_points_a\n  \
    \  JOIN data_points_b ON (data_points.point_id = data_points_b.point_id)\n   \
    \ JOIN data_points_c ON (data_points_a.ts BETWEEN data_points_c.start_time AND\
    \ data_points_c.end_time)\n```\n\nHow effective the optimization is will depend\
    \ on having the right bin size. A bin size that is too small in relation to the\
    \ intervals might lead to overlaps between intervals. We can choose appropriate\
    \ bin sizes by looking at the percentiles found in the column that we will be\
    \ using as a filter. This can be done using the APPROX_PERCENTILE command.\n\n\
    In the following code example, we are looking at the .25, .5, and .75 percentiles\
    \ of data_ranges with intervals between the end and start column:\n\n```\nSELECT\
    \ APPROX_PERCENTILE(CAST(end - start AS DOUBLE), ARRAY(.25, .5, .75)) FROM data_ranges\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 173
  md: 'If the length of our intervals is uniform, we can set the bin size to the most
    common interval length.


    The bin size is a parameter that is highly dependent on the distribution of data,
    so the recommendation is to test different approaches to finding the right bin
    size to leverage all the parallel processing computational advantages.


    # Skew join optimization


    We have a skewness problem when a partition of our data is much bigger than the
    rest. This can yield problems when we execute our process on that partition because
    it will take much more time to work on this partition. This is especially bad
    on distributed computation systems such as Azure Databricks because many tasks
    are run in parallel, and having one task taking longer than the rest can block
    executions that have a dependency on this task.


    This uneven workload problem affects join operations mostly because big tables
    need to be reshuffled. It is possible that this problem will affect our queries
    if some executions take longer than others.


    This issue can be tackled using skew join optimization hints in Azure Databricks
    in the same way as we have seen with range join optimization.


    Hints are specified using a /* syntax to start and /* to end in a SELECT statement,
    passing the SKEW command, which has as a parameter the column that we want to
    optimize.


    An example of this is shown in the following code snippet:


    ```

    SELECT /*+ SKEW(''orders'') */ * FROM data, users WHERE user_id = our_condition

    ```


    Delta Lake uses the information in hints to optimize the execution plan for our
    query. We can also apply it to subqueries, as shown in the following code example,
    where we run a subquery to filter our data:


    ```

    SELECT /*+ SKEW(''C1'') */ * FROM (SELECT * FROM data WHERE user_id < 100) C1,
    orders

    WHERE C1.user_id = our_condition

    ```


    We can also specify relationships and columns with the SKEW command. We will see
    how to do this in the next section.'
  merge: -1
  img_proc: true
- pgno: 174
  md: '# Relationships and columns


    Skew join optimization is a computationally intensive operation that must be run
    only when it is required. That is why the argument of SKEW is column names. When
    running joins, it is useful to then just run SKEW on the column that we are using
    to do this.


    In the following code example, we apply the skew hint to a single column, which
    is user_id:


    ```

    SELECT /*+ SKEW(''orders'', user_id) */ *

    FROM orders, users

    WHERE user_id = our_condition

    ```


    We can also apply the hint to multiple columns, as follows:


    ```

    SELECT /*+ SKEW(''orders'', (''user_id'', ''o_region_id'')) */ *

    FROM orders, users

    WHERE user_id = our_condition AND o_region_id= c_region_id

    ```


    You can also specify skew values in the hint. Depending on the query and data,
    the skew values might be known (for example, because they never change) or might
    be easy to find out. Doing this reduces the overhead of skew join optimization.
    Otherwise, Delta Lake detects them automatically.


    Values can be also specified on the hints, depending on the type of query. The
    more specific the parameters passed to SKEW, the less overhead there will be for
    the optimization task.


    In the following code example, we run a query on a single column specifying a
    single skew value:


    ```

    SELECT /*+ SKEW(''orders'', ''user_id'', 0) */ *

    FROM orders, users

    WHERE user_id = our_condition

    ```


    We can also pass several skew values, as follows:


    ```

    SELECT /*+ SKEW(''orders'', ''user_id'', (0, 1, 2)) */ *

    FROM orders, users

    WHERE user_id = our_condition

    ```'
  merge: -1
  img_proc: true
- pgno: 175
  md: 'And finally, we can also specify several columns and—respectively—several values
    to those columns, as follows:


    ```

    SELECT /*+ SKEW(''orders'', (''user_id'', o_region_id), ((0, 1001), (1, 1002)))
    */ *

    FROM orders, users

    WHERE user_id = our_condition AND o_region_id= c_region_id

    ```


    We can see that we can correct skewness in our data in a selective manner, applying
    this transformation only in columns that we select that also comply with the stated
    condition. That way, we can optimize in a more effective manner.


    # Summary


    In this chapter, we have discussed how we can apply Delta Engine features such
    as Z-Ordering, Data Skipping, and data caching, among others, to improve the layout
    structure of our data, leading to an overall improvement in query performance.
    We can leverage these tools to reorganize files into lesser, much more compact
    ones, in which data is distributed according to how frequently it is accessed.
    We can also create Bloom filters on data columns to improve the speed in which
    we run our queries.


    In the next chapter, we will deepen our knowledge of how to ingest streams of
    data in our Delta tables.'
  merge: -1
  img_proc: true
