- pgno: 329
  md: '# Hyperparameter tuning with Hyperopt


    The Azure Databricks Runtime for Machine Learning includes Hyperopt, a Python
    library that is intended to be used on distributed computing systems to facilitate
    the learning process for an optimal set of hyperparameters. At its core, it''s
    a library that receives a function that we need to either minimize or maximize,
    and a set of parameters that define the search space. With this information, Hyperopt
    will explore the search space to find the optimal set of hyperparameters. Hyperopt
    uses a stochastic search algorithm to explore the search space, which is much
    more efficient than using a traditional deterministic approach such as random
    search or grid search.


    Hyperopt is optimized for use in distributed computing environments and provides
    support for libraries such as PySpark MLlib and Horovod, the latter of which is
    a library for distributed deep learning training that we will focus on later.
    It can also be applied in single-machine environments and with other more common
    libraries such as TensorFlow and PyTorch.


    The general workflow when using Hyperopt is as follows:


    +   1. First, we must find the function that we want to optimize. This can be
    either a performance metric that we want to maximize or a loss function that we
    want to minimize.

    +   2. Next, we must define the conditional search space in which Hyperopt will
    scan for the best parameters to optimize the defined target function. Hyperopt
    supports several algorithms being used in the same run, which allows us to define
    more than one model to explore.

    +   3. After that, we must define the search algorithm that will be used to scan
    the search space.

    +   4. Finally, we can start the exploration process by running the fmin() Hyperopt
    function. This will take the objective function as an argument and the search
    space for identifying the optimal set of parameters.


    This being said, the two most crucial parts of Hyperopt are as follows:


    +   - The objective function that we will pass as the optimization target. Generally,
    this is a loss function or a performance metric.

    +   - A dictionary of hyperparameters that define the search space. We can choose
    different distributions for each set of hyperparameter values.'
  merge: -1
  img_proc: true
- pgno: 330
  md: "In the next section, we will learn how to apply Hyperopt to the Azure Databricks\
    \ Runtime for Machine Learning to find the best hyperparameters for a certain\
    \ task, regardless of the algorithm that's applied.\n\n# Hyperopt concepts\n\n\
    In this section, we will go through certain concepts of Hyperopt to identify its\
    \ core functionalities, as well as how we can use them to efficiently scan the\
    \ search space for hyperparameters that help minimize or maximize our objective\
    \ function. As we mentioned previously, when we start using Hyperopt, we must\
    \ define the following:\n\n+   - The objective function\n+   - The search space\
    \ that we will scan\n+   - The database that will be used to save the result of\
    \ evaluating the points in the search space\n+   - The search algorithm that will\
    \ be used to scan the search space\n\nHere, our main goal is to find the best\
    \ set of scalars that represent the optimal hyperparameters. Hyperopt allows us\
    \ to define the search space in detail to provide information regarding where\
    \ in the search space the target function will perform better. Other optimization\
    \ libraries regularly assume that the search space is a subset of a larger vector\
    \ space with the same distribution, which is not usually the case. The way Hyperopt\
    \ makes us define the search space allows us to perform a more efficient scan.\n\
    \nHyperopt allows us to define the objective function very simply, but it also\
    \ has an incremental complexity when we increase the number of parameters, we\
    \ want to keep track of during our execution. The simplest example is as follows,\
    \ where we find the value of x that minimizes a linear function, y(x) = x:\n\n\
    ```\nfrom hyperopt import fmin, tpe, hp\nbest_param = fmin(\n    fn=lambda x:\
    \ x,\n    space=hp.uniform('x', 0, 1),\n    algo=tpe.suggest,\n    max_evals=100)\n\
    print(best_param)\n```"
  merge: -1
  img_proc: true
- pgno: 331
  md: 'We can decompose the preceding execution by breaking down its parameters:


    +   - The Hyperopt `fmin()` function takes in the `fn` keyword argument and the
    function to minimize. In this case, we are using a very simple lambda function;
    that is, `f(y)=x`.

    +   - The space argument is used to pass the search space. Here, we are using
    the `hp` function from Hyperopt to specify a uniform search space for the x variable
    in the range of 0 to 1. `hp.uniform` is a function that''s built into the library
    that helps us specify the search space for specific variables.

    +   - The `algo` parameter is used to select the search algorithm. In this case,
    `tpe` stands for Parzen estimators. We can also set these parameters to `hyperopt.random.suggest`.
    The search algorithm is an entire subject, so we will only briefly mention this,
    but you are free to search for more details about the types of algorithms that
    Hyperopt applies to find the most suitable set of hyperparameters for you.

    +   - Lastly, the maximum number of evaluations is specified using the `max_evals`
    parameters.


    Once we have specified all the required parameters, we can start the run, which
    will return a Python dictionary of values for the specified variable that minimizes
    the objective function.


    Even though our minimum working example here looks very simple, Hyperopt has a
    complexity that increases with the number of specifications that we have when
    optimizing an objective function. Some of the questions that we can ask ourselves
    when we''re coming up with the best strategy are as follows:


    +   - What type of information is required besides the actual returned value of
    the `fmin()` function? We can obtain statistics and other data that is collected
    during the process and might be useful for us to keep.

    +   - Is it necessary for us to use an optimization algorithm that requires more
    than one input value?

    +   - Should we parallelize this process and if so, do we want communication between
    these parallel processes?


    Answering these questions will define the way in which we can implement the optimization
    strategy.'
  merge: -1
  img_proc: true
- pgno: 332
  md: 'In a parallel optimization process, communication occurs between the Hyperopt
    optimization algorithm and the objective function to obtain the actual value of
    the objective function in that specific point of the search space. In this communication,
    the value that returns the objective function in that floating-point loss, which
    is also called a negative utility, is associated with that point in the search
    space.


    The simple example shown here exemplifies how simple it is to define an objective
    function and a search space using Hyperopt. However, it still falls short in cases
    where we want to store more information than just the floating-point value that''s
    returned by the objective function in the search space. It is also an evaluation
    that doesn''t interact with the search algorithm or the concurrent function.


    To tackle the first problem, we can use an objective function that retrieves more
    than one value by returning a nested dictionary with key values for the statistics
    and diagnostics that are desired. For this, we have a set of mandatory values
    that our objective function must return:


    +   - `status`: We can choose one of the keys from `hyperopt.STATUS_STRINGS` to
    show the status of competition. This way, we can track if our evaluation was completed
    successfully or if it failed.

    +   - `loss`: This is the float value that is returned by the actual objective
    function when it is evaluated in that specific point in the search space. It must
    be present if the status of the competition is OK.


    We can also specify some additional optional arguments in the option of the objective
    function. These key values are as follows:


    +   - `loss_variance`: A float value specifying the certainty of the stochastic
    objective function.

    +   - `true_loss`: You can store the loss of the model with this name so that
    we can use the built-in plotting tool. This is especially useful when we are working
    with hyperparameter optimization because it allows us to plot the results of the
    exploration very simply.

    +   - `true_loss_variance`: The uncertainty of the loss of the model.


    This functionality allows us to store these values in databases that are JSON-compatible,
    such as MongoDB. The following code example shows us how we can define a very
    simple f(x) = x objective function that returns the status of the execution as
    a key valued dictionary:


    ```

    import pickle

    import time

    ```'
