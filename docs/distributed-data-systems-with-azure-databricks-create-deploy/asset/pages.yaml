    # Data sinks


    Sometimes, it is necessary to aggregate the receiving streams of data to be written
    into another location, which can be a data sink. Data sinks are a way in which
    we can call external sources where we store data and can be, for example, an S3
    bucket where we want to keep copies of the aggregated streams of data. In this
    section, we will go through the steps in which we can write the streams of data
    into any external data sink location.


    In Structured Streaming APIs, we have two ways to write the output of a query
    to external data sources that do not have an existing streaming sink. These options
    are the foreachBatch and foreach functions.'
