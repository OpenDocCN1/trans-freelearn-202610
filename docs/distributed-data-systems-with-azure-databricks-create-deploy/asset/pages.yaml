  md: "# VectorIndexer\n\nIn Azure Databricks, we can use the VectorIndexer class\
    \ to index categorical features as an alternative to one-hot encoding. This class\
    \ is used in data frames that contain columns of type Vector. It works by deciding\
    \ which features are categorical and converts those features' original values\
    \ into categorical indexes. The steps that it follows are outlined next:\n\n+\
    \   1. It takes as an input a column of type Vector and a maxCategories parameter,\
    \ which—as the name suggests—specifies the threshold of a maximum number of categories\
    \ for a single variable.\n+   2. It decides which features are categorical, based\
    \ on the number of distinct values that they hold. The features with at most maxCategories\
    \ will be marked as categorical.\n+   3. It computes 0-based category indices\
    \ for each feature that was declared as categorical.\n+   4. Finally, it indexes\
    \ the categorical features by transforming the original feature values into indices.\n\
    \nThis indexing of categorical features allows us to overcome the limitations\
    \ of certain algorithms such as Decision Trees and Tree Ensembles regarding handling\
    \ categorical features to improve performance or to simply be able to use algorithms\
    \ that allow just numerical features.\n\nIn the following code example, we will\
    \ read an example dataset of labeled points and use the PySpark VectorIndexer\
    \ class to decide which of the features that compose the dataset should be treated\
    \ as categorical variables. We will later transform the values of those categorical\
    \ features into indices:\n\n```\nfrom pyspark.ml.feature import VectorIndexer\n\
    from pyspark.mllib.util import MLUtils\ndata = MLUtils.loadLibSVMFile(sc, \"data/mllib/sample_libsvm_data.txt\"\
    ).toDF()\nindexer = VectorIndexer(inputCol=\"features\",\n                   \
    \     outputCol=\"indexed\",\n                        maxCategories=10)\nindexerModel\
    \ = indexer.fit(data)\n# Create new column \"indexed\" with categorical values\
    \ transformed to indices\nindexedData = indexerModel.transform(data)\n```"
