    # Summary


    Implementing a data lake is a paradigm change within an organization. Delta Lake
    provides a solution for this when we are dealing with streams of data from different
    sources, when the schema of the data might change over time, and when we need
    to have a system that is reliable against data mishandling and easy to audit.


    Delta Lake fills the gap between the functionality of a data warehouse and the
    benefits of a data lake while also overcoming most of its challenges.'
