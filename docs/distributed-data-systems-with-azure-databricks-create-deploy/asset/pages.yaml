  md: 'Aspects such as the maximum size of micro batches provided in each stream or
    the amount of data to be computed in each batch can be controlled with options
    such as `maxFilesPerTrigger` and `maxBytesPerTrigger`.


    # Managing table updates and deletes


    As we mentioned previously, if a table that is being used as a streaming source
    is updated, structured streaming will throw an exception. We can solve this issue
    by changing the `ignoreChanges` option, which will process updated tables so that
    the streaming won''t be interrupted if any deletions or updates occur on the streaming
    table. We can also use the `ignoreDeletes` option if we only want to ignore deletions
    on the source data. Finally, if none of these options work, we can always directly
    delete the outputs and checkpoints and restart the stream.


    An example of this situation would be when we''re modifying a record in one of
    our tables using the `UPDATE` command. Modifying the record will modify the file
    that contains that table. If the `ignoreChanges` option is used, the new record
    will be propagated, along with any other records contained in the same file that
    haven''t been modified.


    # Specifying an initial position


    Delta Lake allows you to specify a certain point in the streaming source, without
    the need to process all the data again. The functionality of time travel allows
    us to specify either a `startingVersion` or a specific `startingTimestamp`, which
    will be our starting point for reading our stream. These options take effect on
    new streaming queries; otherwise, they are ignored.


    The available versions can be obtained using the `DESCRIBE HISTORY` command. An
    example of this is accessing version 3 of our streaming data:


    ```

    straming_events.readStream

    .format("delta")

    .option("startingVersion", "3")

    .load("/mnt/straming_events/user_events")

    ```


    The `startingTimestamp` command specifies the point from which you will read onward
    in time. The input value can be a timestamp, a string that''s been cast in timestamp
    format, a date string, or expressions that can be cast to a timestamp or date.'
