- pgno: 75
  md: 'The Azure Databricks CLI is based on Python 3 and is installed through the
    following pip command:


    ```

    pip3 install databricks-cli

    ```


    You can confirm that the installation was successful by checking the version.
    If the installation was successful, you will see as a result the current version
    of the Azure Databricks CLI:


    ```

    databricks --version

    ```


    It''s good to bear in mind that using the Databricks CLI with firewall-enabled
    storage containers is not possible and, in that case, it is recommended to use
    Databricks Connect or AZ storage.


    To be able to install the Azure CLI, you will need to have Python 3 already installed
    and added to the path of the environment you will be working on.


    # Authentication through an access token


    Let''s set up the CLI:


    +   1. To be able to use CLI commands, we will have to authenticate ourselves
    by setting an Azure Databricks personal access token. This token is generated
    in your Azure Databricks profile, in the access token section:


    ![](img/7e45bd08916c2a17d4e75cbb898f41e8_75_0.png)'
  merge: -1
  img_proc: true
- pgno: 76
  md: '2. After this, we click on the Generate New Token button in the top-left corner.
    This will require us to complete a comment on what this access token will be used
    for and establish a lifetime period for our token:


    ![](img/7e45bd08916c2a17d4e75cbb898f41e8_76_0.png)


    Figure 2.21 – Generate New Token


    3. Next, you will see the generated token. Copy and store it in a safe place as
    this will be the only time that the token will be shown to you. Once created,
    the token will be listed in the Access Token list in your User Settings tab in
    your account.


    4. Now that we have the token, we can use it to authenticate ourselves in the
    Azure CLI. To do this, in our terminal, we can write the following command:


    ```

    databricks configure --token

    ```


    We will need to provide the host and the token. The host is the URL of the Azure
    Databricks resource we are trying to access.


    # Authentication using an Azure AD token


    The other option that we have for configuring the CLI is to use an Azure AD token:


    +   1. You can generate this access token in the Azure portal and once this is
    done, we can store it as an environment variable called DATABRICKS_AAD_TOKEN:


    ```

    export DATABRICKS_AAD_TOKEN=<azure-ad-token>

    ```


    +   2. After we have set the environment variable, we can run the next command
    to configure the Databricks CLI using the AD token. This command will require
    you to provide the URL of the Azure Databricks resource we are trying to access,
    which will have the format adb-<workspace-id>.<random-number>.azuredatabricks.net:


    ```

    databricks configure --aad-token.

    ```'
