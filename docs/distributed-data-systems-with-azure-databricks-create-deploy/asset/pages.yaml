  md: "The loc and iloc slicing methods are also available in Koalas DataFrames. For\
    \ example, to select rows from a Koalas DataFrame, we can use loc:\n\n```\nkoalas_df.loc[1:2]\n\
    ```\n\nSlicing rows and columns is also available using the iloc method by referencing\
    \ the index of rows and columns:\n\n```\nkoalas_df.iloc[:3, 1:2]\n```\n\nIn order\
    \ to prevent expensive operations, in Koalas it is disabled by default to add\
    \ columns coming from other DataFrames or Series. This is because these operations\
    \ require joins, which are expensive operations and might lead to undesired costs.\n\
    \nIn order to control this behavior, we can set compute.ops_on_diff_frames to\
    \ True if we would like to enable adding this feature. See the available options\
    \ in the docs for more detail:\n\n```\nks.get_option('compute.on_diff_frames','true')\n\
    ```\n\n```\nkoalas_series = k.Series([200, 350, 150, 400, 250],\n```\n\n```\n\
    \    index=[0, 1, 2, 3, 4])\n```\n\n```\nkoalas_df['val3'] = koalas_series\n```\n\
    \nAfter performing the column addition, we can reset this option to its default\
    \ to avoid potential undesired use later on:\n\n```\nreset_option(\"compute.ops_on_diff_frames\"\
    )\n```\n\nOne of the most useful functions in pandas is the apply method, which\
    \ is also available in Koalas DataFrames. For example, we can apply the np.cumsum\
    \ function to sum across columns:\n\n```\nkoalas_df.apply(np.cumsum)\n```\n\n\
    We can also specify the axis in which we want to apply the function, where we\
    \ can set the axis to 1 in order to work with columns. The default parameter is\
    \ 0 or index:\n\n```\nkoalas_df.apply(np.cumsum, axis=1)\n```\n\nIt is best practice\
    \ when using the apply function to specify the return datatype hint on user-defined\
    \ functions. Otherwise, the Koalas API will make a trial execution of the user-defined\
