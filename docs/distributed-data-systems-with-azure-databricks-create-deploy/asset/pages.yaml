  md: '# Accessing ADLS Gen2 from Azure Databricks


    According to the documentation, we have three ways to access ADLS Gen2 from Azure
    Databricks, outlined as follows:


    +   - Using ADLS Gen2 access keys on the notebook

    +   - Mounting the ADLS Gen2 filesystem into the Databricks file system at a cluster
    level

