- pgno: 19
  md: '# 1

    Introduction to Azure Databricks


    Modern information systems work with massive amounts of data, with a constant
    flow that increases every day at an exponential rate. This flow comes from different
    sources, including sales information, transactional data, social media, and more.
    Organizations have to work with this information in processes that include transformation
    and aggregation to develop applications that seek to extract value from this data.


    Apache Spark was developed to process this massive amount of data. Azure Databricks
    is built on top of Apache Spark, abstracting most of the complexities of implementing
    it, and with all the benefits that come with integration with other Azure services.
    This book aims to provide an introduction to Azure Databricks and explore the
    applications it has in modern data pipelines to transform, visualize, and extract
    insights from large amounts of data in a distributed computation environment.


    In this introductory chapter, we will explore these topics:


    +   - Introducing Apache Spark

    +   - Introducing Azure Databricks

    +   - Discovering core concepts and terminology

    +   - Interacting with the Azure Databricks workspace

    +   - Using Azure Databricks notebooks'
  merge: -1
  img_proc: true
- pgno: 20
  md: '+   - Exploring data management

    +   - Exploring computation management

    +   - Exploring authentication and authorization


    These concepts will help us to later understand all of the aspects of the execution
    of our jobs in Azure Databricks and to move easily between all its assets.


    # Technical requirements


    To understand the topics presented in this book, you must be familiar with data
    science and data engineering terms, and have a good understanding of Python, which
    is the main programming language used in this book, although we will also use
    SQL to make queries on views and tables.


    In terms of the resources required, to execute the steps in this section and those
    presented in this book, you will require an Azure account as well as an active
    subscription. Bear in mind that this is a service that is paid, so you will have
    to introduce your credit card details to create an account. When you create a
    new account, you will receive a certain amount of free credit, but there are certain
    options that are limited to premium users. Always remember to stop all the services
    if you are not using them.


    # Introducing Apache Spark


    To work with the huge amount of information available to modern consumers, Apache
    Spark was created. It is a distributed, cluster-based computing system and a highly
    popular framework used for big data, with capabilities that provide speed and
    ease of use, and includes APIs that support the following use cases:


    +   - Easy cluster management

    +   - Data integration and ETL procedures

    +   - Interactive advanced analytics

    +   - ML and deep learning

    +   - Real-time data processing'
  merge: -1
  img_proc: true
- pgno: 21
  md: 'It can run very quickly on large datasets thanks to its in-memory processing
    design that allows it to run with very few read/write disk operations. It has
    a SQL-like interface and its object-oriented design makes it very easy to understand
    and write code for; it also has a large support community.


    Despite its numerous benefits, Apache Spark has its limitations. These limitations
    include the following:


    +   - Users need to provide a database infrastructure to store the information
    to work with.

    +   - The in-memory processing feature makes it fast to run, but also implies
    that it has high memory requirements.

    +   - It isn''t well suited for real-time analytics.

    +   - It has an inherent complexity with a significant learning curve.

    +   - Because of its open source nature, it lacks dedicated training and customer
    support.


    Let''s look at the solution to these issues: Azure Databricks.


    # Introducing Azure Databricks


    With these and other limitations in mind, **Databricks** was designed. It is a
    cloud-based platform that uses Apache Spark as a backend and builds on top of
    it, to add features including the following:


    +   - Highly reliable data pipelines

    +   - Data science at scale

    +   - Simple data lake integration

    +   - Built-in security

    +   - Automatic cluster management'
  merge: -1
  img_proc: true
- pgno: 22
  md: 'Built as a joint effort by Microsoft and the team that started Apache Spark,
    Azure Databricks also allows easy integration with other Azure products, such
    as **Blob Storage** and **SQL databases**, alongside **AWS services**, including
    **S3 buckets**. It has a dedicated support team that assists the platform''s clients.


    Databricks streamlines and simplifies the setup and maintenance of clusters while
    supporting different languages, such as Scala and **Python**, making it easy for
    developers to create ETL pipelines. It also allows data teams to have real-time,
    cross-functional collaboration thanks to its notebook-like integrated workspace,
    while keeping a significant amount of backend services managed by Azure Databricks.
    Notebooks can be used to create jobs that can later be scheduled, meaning that
    locally developed notebooks can be deployed to production easily. Other features
    that make Azure Databricks a great tool for any data team include the following:


    +   - A high-speed connection to all Azure resources, such as storage accounts.

    +   - Clusters scale and are terminated automatically according to use.

    +   - The optimization of SQL.

    +   - Integration with BI tools such as Power BI and Tableau.


    Let''s examine the architecture of Databricks next.


    # Examining the architecture of Databricks


    Each Databricks cluster is a Databricks application composed of a set of pre-configured,
    VMs running as Azure resources managed as a single group. You can specify the
    number and type of VMs that it will use while Databricks manages other parameters
    in the backend. The managed resource group is deployed and populated with a virtual
    network called **VNet**, a security group that manages the permissions of the
    resources, and a storage account that will be used, among other things, as the
    Databricks filesystem. Once everything is deployed, users can manage these clusters
    through the Azure Databricks UI. All the metadata used is stored in a geo-replicated
    and fault-tolerant Azure database. This can all be seen in Figure 1.1:'
  merge: -1
  img_proc: true
- pgno: 23
  md: '![](img/7e45bd08916c2a17d4e75cbb898f41e8_23_0.png)


    Figure 1.1 – Databricks architecture


    The immediate benefit this architecture gives to users is that there is a seamless
    connection with Azure, allowing them to easily connect Azure Databricks to any
    resource within the same Azure account and have a centrally managed Databricks
    from the Azure control center with no additional setup.


    As mentioned previously, Azure Databricks is a managed application on the Azure
    cloud that is composed by a control plane and a data plane. The control plane
    is on the Azure cloud and hosts services such as cluster management and jobs services.
    The data plane is a component that includes the aforementioned VNet, NSG, and
    the storage account that is known as DBFS.


    You could also deploy the data plane in a customer-managed VNet to allow data
    engineering teams to build and secure the network architecture according to their
    organization policies. This is called VNet injection.


    Now that we have seen how everything is laid out under the hood, let’s discuss
    some of the core concepts behind Databricks.'
  merge: -1
  img_proc: true
- pgno: 24
  md: '# Discovering core concepts and terminology


    Before diving into the specifics of how to create our cluster and start working
    with Databricks, there are a certain number of concepts with which we must familiarize
    ourselves first. Together, these define the fundamental tools that Databricks
    provides to the user and are available both in the web application UI as well
    as the REST API:


    +   - **Workspaces:** An Azure Databricks workspace is an environment where the
    user can access all of their assets: jobs, notebooks, clusters, libraries, data,
    and models. Everything is organized into folders and this allows the user to save
    notebooks and libraries and share them with other users to collaborate. The workspace
    is used to store notebooks and libraries, but not to connect or store data.

    +   - **Data:** Data can be imported into the mounted Azure Databricks distributed
    filesystem from a variety of sources. This can be uploaded as tables directly
    into the workspace, from Azure Blob Storage or AWS S3.

    +   - **Notebooks:** Databricks notebooks are very similar to Jupyter notebooks
    in Python. They are web interface applications that are designed to run code thanks
    to runnable cells that operate on files and tables, and that also provide visualizations
    and contain narrative text. The end result is a document with code, visualizations,
    and clear text documentation that can be easily shared. Notebooks are one of the
    two ways that we can run code in Azure Databricks. The other way is through jobs.
    Notebooks have a set of cells that allow the user to execute commands and can
    hold code in languages such as Scala, Python, R, SQL, or Markdown. To be able
    to execute commands, they have to be connected to a cluster, but this connection
    is not necessarily permanent. This allows an easy way to share these notebooks
    via the web or in a local machine. Notebooks can be scheduled and triggered as
    jobs to create a data pipeline, run ML models, or update dashboards:'
  merge: -1
