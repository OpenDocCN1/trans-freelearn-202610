- pgno: 239
  md: "# Bokeh\n\nBokeh is a Python interactive data visualization library used to\
    \ create beautiful and versatile graphics, dashboards, and plots.\n\nTo use Bokeh,\
    \ you can install the Bokeh PyPI package either by installing it at the cluster\
    \ level through the libraries UI and attaching it to your cluster or by installing\
    \ it at the notebook level using pip commands.\n\nOnce we have installed the library\
    \ and we can import it into our notebook, to display a Bokeh plot in Databricks,\
    \ we must first create the plot and generate an HTML file embedded with the data\
    \ for the plot, created, for example, by using Bokeh's file_html or output_file\
    \ functions, and then pass this HTML to the Databricks displayHTML function.\n\
    \nFor example, to create a simple plot using Bokeh, we can do the following. First,\
    \ we import the required libraries from Bokeh:\n\n```\nfrom bokeh.plotting import\
    \ figure\nfrom bokeh.embed import components, file_html\nfrom bokeh.resources\
    \ import CDN\n```\n\nThen, we generate some data to visualize it. We will use\
    \ a series of x and y coordinates arranged into a list to create a simple line:\n\
    \n```\nx = [1, 2, 3, 4, 5, 6, 7, 8, 9]\ny = [2, 4, 3, 4, 5, 6, 7, 9, 8]\n```\n\
    \nThen, we can create a new object to store the line plot and add some title and\
    \ axis labels to it:\n\n```\np = figure(title=\"this simple line example\",\n\
    \           x_axis_label='x_val', y_axis_label='y_val')\n```\n\nWe will also add\
    \ a legend to the line and specify the line thickness:\n\n```\np.line(x, y, legend_label=\"\
    this line.\", line_width=2)\n```\n\nFinally, we create the HTML file with the\
    \ embedded Bokeh plot in an object:\n\n```\nhtml = file_html(p, CDN, \"my_plot\"\
    )\n```"
  merge: -1
  img_proc: true
