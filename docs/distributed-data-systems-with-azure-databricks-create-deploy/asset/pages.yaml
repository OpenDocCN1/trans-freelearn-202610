    # Exploring computation management


    In this section, we will briefly describe how to manage Azure Databricks clusters,
    the computational backbone of all of our operations. We will describe how to display
    information on clusters, as well as how to edit, start, terminate, delete, and
    monitor logs.'
  merge: -1
