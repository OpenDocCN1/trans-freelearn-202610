- pgno: 199
  md: "# Optimizing streaming queries\n\nWe can have a streaming query that makes\
    \ use of stateful operations such as streaming aggregation, streaming dropDuplicates,\
    \ mapGroupsWithState, or flatMapGroupsWithState, streaming to stream joins, and\
    \ so on. Running these operations continuously results in a need to maintain millions\
    \ of keys of the state of the data in the memory of each executor, leading to\
    \ bottlenecks.\n\nTo overcome this issue, Azure Databricks provides a solution,\
    \ which is to keep the state of the data in a RocksDB database instead of using\
    \ the executor memory. RocksDB is a library that provides a persistent key-value\
    \ store to efficiently manage the state of data in the memory and the local SSD.\
    \ Therefore, used in combination with Structured Streaming checkpoints, these\
    \ solutions guarantee safeguards against failures.\n\nYou can enable RocksDB-based\
    \ state management by setting the following configuration in SparkSession before\
    \ starting the streaming query:\n\n```\nspark.conf.set(\n  \"spark.sql.streaming.stateStore.providerClass\"\
    ,\n  \"com.databricks.sql.streaming.state.\nRocksDBStateStoreProvider\")\n```\n\
    \nRocksDB can maintain 100 times more state keys than the standard executor memory.\
    \ We can also improve the performance of our queries using compute-optimized instances\
    \ such as Azure Standard_F16s instances as workers and setting the number of shuffle\
    \ partitions to up to two times the number of cores in the cluster.\n\n# Triggering\
    \ streaming query executions\n\nTriggers are a way in which we define events that\
    \ will lead to an operation being executed on a portion of data, so they handle\
    \ the timing of streaming data processing. These triggers are defined by intervals\
    \ of time in which the system checks if new data has arrived. If this interval\
    \ of time is too small this will lead to unnecessary use of resources, so it should\
    \ always be an amount of time customized according to your specific process.\n\
    \nThe parameters of the triggers of the streaming queries will define if this\
    \ query is to be executed as a micro-batch query on a fixed batch interval or\
    \ as a continuous processing query."
  merge: -1
  img_proc: true
- pgno: 200
  md: "# Different kinds of triggers\n\nThere are different kinds of triggers available\
    \ in Azure Databricks that we can use to define when our streaming queries will\
    \ be executed. The available options are outlined here:\n\n+   - **Unspecified\
    \ trigger:** This is the default option and means that unless specified otherwise,\
    \ the query will be executed in micro-batch mode, where micro-batches are generated\
    \ when the processing previous micro-batch has already been executed successfully.\n\
    +   - **Triggers based on fixed-interval micro-batches:** The query will be executed\
    \ with micro-batches mode, where micro-batch execution will be started at specified\
    \ intervals. If the previous micro-batch execution is completed in less than the\
    \ specified interval, Azure Databricks will wait until the interval is over before\
    \ kicking off the next micro-batch. If the execution of the micro-batch takes\
    \ longer than the specified interval to complete, then the next batch will be\
    \ executed as soon as the previous one is done.\n+   \n+   If no new data is available,\
    \ no micro-batch will be executed.\n+   - **One-time micro-batch triggers:** The\
    \ query will run just once to process all the available data. This is a good option\
    \ when clusters are started and turned off to save resources, and therefore we\
    \ can just process all the new data available since the start of the cluster.\n\
    +   - **Continuous trigger with fix checkpoint interval:** The query will be kicked\
    \ off in a continuous low-latency processing mode.\n\nNext, we will see some examples\
    \ of how we can apply these different types of triggers when using Structured\
    \ Streaming for streaming data.\n\n# Trigger examples\n\nThe following code snippet\
    \ provides an example of the default trigger in Structured Streaming, which—as\
    \ mentioned before—runs the micro-batch as soon as it can:\n\n```\nstreaming_df.writeStream\
    \ \\\n.format(\"console\") \\\n.start()\n```"
  merge: -1
  img_proc: true
- pgno: 201
  md: "We can also define a specific interval of time, making use of the processingTime\
    \ trigger option. In the following code example, we set a 10-second micro-batch\
    \ interval of time:\n\n```\nstreaming_df.writeStream \\\n    .format(\"console\"\
