    a cluster.


    # Cluster information


    Detailed information on Spark jobs is displayed in the Spark UI, which can be
    accessed from the cluster list or the cluster details page. The Spark UI displays
    the cluster history for both active and terminated clusters:


    ![](img/7e45bd08916c2a17d4e75cbb898f41e8_48_1.png)


