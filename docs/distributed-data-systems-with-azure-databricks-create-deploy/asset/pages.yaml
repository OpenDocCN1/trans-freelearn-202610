    /\"))\n```\n\nAlthough it is possible to use many file formats in PySpark, in\
    \ this example we will use the MNIST dataset in LIBSVM format and load it using\
    \ Spark's built-in LIBSVM data source.\n\n2. LIBSVM is a commonly used open source\
    \ machine learning library that is optimized for use for kernelized support vector\
    \ machines. Each LIBSVM file is a text format file where each line represents\
    \ a labeled sparse feature vector using the following format:\n\n```\nlabel index1:value1\
    \ index2:value2\n```\n\n3. Where the indices are one-based and in ascending order.\
