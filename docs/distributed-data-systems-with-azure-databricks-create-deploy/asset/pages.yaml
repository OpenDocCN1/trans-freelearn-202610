  md: '# Time-series data sources


    In data science and engineering, one of the most common challenges is temporal
    data manipulation. Datasets that hold geospatial or transactional data, which
    mostly lie in the financial and economics area of an application, are some of
    the most common examples of data that is indexed by a timestamp. Working in areas
    such as finance, fraud, or even socio-economic temporal data ultimately leads
    to the need to join, aggregate, and visualize data points.


    This temporal data regularly comes in datetime formats that might vary not only
    in the format itself but in the information that it holds. One of the examples
    of this is the difference between the DD/MM/YYYY and MM/DD/YYYY format. Misunderstanding
    these different datetime formats could lead to failures or wrongly formed results
    if the formats used don''t match up. Moreover, this data doesn''t come in numerical
    format, which—as we have seen in previous sections of the chapter—can lead to
    several impediments that need to be overcome, one of them being the fact that
    this data cannot be interpreted easily by most of the learning algorithms used
    in machine and deep learning.


    This is where feature engineering comes into play, providing us with the tools
    to transform and create new features from this data. An example of this could
    be to reorganize the data in numerical features such as day, month, and year,
    and even manipulate features using techniques as dynamic time warping to compare
    time series of different lengths, as could be the case when comparing the sales
    of the months of February and March, which have 28 and 31 days respectively.


    In Azure Databricks, we have several functionalities in place that allow us to
    perform operations such as joins, aggregations, and windowing of time series,
    with the added benefit of doing this processing in parallel. Moreover, the Koalas
    API allows us to work with this data using a Pandas-like syntax that makes the
    transition from experiment to production much easier to handle.


