- pgno: 224
  md: '+   - You can also install a custom package from DBFS with the `%pip` command.
    To do this, we need to run the `%pip install` command and specify the path in
    DBFS where our custom package is located:


    ```

    %pip install /dbfs/mypackage-0.0.1-py3-none-any.whl

    ```


    +   - This option allows us to install packages locally using Python Wheels. It
    is important to notice that when files are uploaded to DBFS, this will automatically
    rename the file, replacing spaces, periods, and hyphens with underscores. This
    can be an issue because pip expects that the Wheel file will use periods to express
    the version (such as version 1.0.1) and hyphens instead of spaces or underscores.
    Therefore, to install a Python package from a Wheel uploaded to DBFS, we must
    first rename the file to make it consistent to what pip is expecting:


    ```

    %pip install /dbfs/mycustompackage-0.0.1-py3-none-any.whl

    ```


    +   - We can also use `%pip` to list all the installed libraries in a requirements
    file:


    ```

    %pip freeze > /dbfs/sub_dir/requirements.txt

    ```


    Any subdirectories included in the file path should be already created before
    running `%pip freeze`. If you run `%pip freeze` and the directory is not created
    properly with all its subfolders, the command will fail.


    +   - We can also use `%pip` to install libraries using a requirements file. A
    requirements file contains a list of Python packages to be installed using pip,
    such as the one we have just created using `%pip freeze`, and it is always a text
    file named `requirements`. An example of how we can install libraries using a
    requirements file located in DBFS is as follows:


    ```

    %pip install -r /dbfs/requirements.txt

    ```


    This way, we can install all the required libraries without having to install
    each of them manually and this helps us reproduce environments to recreate results
    and processes.


    Some final remarks about managing libraries at the notebook level are as follows:


    +   - Libraries installed using an `init` script will be accessible by all notebooks
    attached to that cluster.

    +   - Libraries installed from the cluster UI or API are available to all notebooks
    on the cluster, which are installed using pip and therefore you should use only
    `%pip` commands in those notebooks.'
