- pgno: 367
  md: 'ML\eap serialization is useful when we intend to run predictions outside of
    the Spark environment as it packs entire pipelines into serialized ZIP file format
    bundles. The applications running the predictions should be based in Scala or
    Java as ML\eap has a format that is based on its own type of data frames, called
    LeapFrames. As a final concept, we can consider ML\eap an alternative to the ML\f\low
    format for serializing machine learning models.


    The next section will cover an example of how we can use ML\f\low to serve models
    on Azure Databricks.


    # Serving models with MLflow


    One of the benefits of using MLflow in Azure Databricks as the repository of our
    machine learning models is that it allows us to simply serve predictions from
    the Model Registry as REST API endpoints. These endpoints are updated automatically
    on newer versions of the models in each one of the stages, therefore this is a
    complementary feature of keeping track of the model''s lifecycle using the MLflow
    Model Registry.


    Enabling a model to be served as a REST API endpoint can be done from the Model
    Registry UI in the Azure workspace. To enable a model to be served, go to the
    model page in the Model Registry UI and click on the Enable Serving button in
    the Serving tab.


    Once you have clicked on the button, which is shown in the following screenshot,
    you should see the status as Pending. After a couple of minutes, the status will
    change to Ready:


    ![](img/7e45bd08916c2a17d4e75cbb898f41e8_367_0.png)


    Figure 11.9 – Enabling the serving of a model


    If you want to disable a model for serving, you can click on the Stop button on
    the Serving tab on the page of the registered model.'
  merge: -1
  img_proc: true
- pgno: 368
  md: 'To make a request to the deployed model, we need to know its unique URI. The
    URI of a deployed model depends also on the version of the model, so the resulting
    URI is something like this:


    ```

    <databricks-instance>/model/<registered-model-name>/<model-version>/invocations

    ```


    If we have a model called house_classifier and we want to know the URI of version
    3 of this model, the code would look something like this:


    ```

    https://<your_databricks-instance>/model/house_classifier/3/invocations

    ```


    If this model has a particular stage assigned to it, it is also included in the
    URI of the endpoint. For example, the Production stage of the previous model will
    have an URI endpoint like this:


    ```

    https://<your_databricks-instance>/model/house_classifier/Production/invocations

    ```


    You can see a list of available URIs for the serving models at the top at the
    Model Versions tab of the Serving page of the registered model in the MLflow UI.


    You can test the deployed model either by making a REST API request to one of
    the available endpoints or using the Model Serving UI in the Azure workspace.


    Azure Databricks creates unique clusters when a registered model is enabled to
    be served and deploys all the versions of the model except the ones archived.
    If any error occurs, Azure Databricks will restart the cluster, and if you disable
    the serving it will terminate it. As mentioned before, this model serving also
    updates automatically when we update the version of a model that is being served.
    To be able to query these endpoints, we just need to authenticate ourselves using
    a generated Databricks access token.


    The MLflow model serving is indented for low throughput and is non-critical, with
    a limitation of 16 megabytes (MB) per request made. For applications that require
    higher throughput, you should consider using batch predictions. The clusters used
    are all-purpose clusters, so they will have the same configurations of scalability
    as these ones.


    Consider that a cluster is maintained even if no active versions of the model
    exist, so you should always be sure to disable the serving of a registered model
    if it''s no longer needed.'
  merge: -1
  img_proc: true
