    classifier on the **Modified National Institute of Standards and Technology (MNIST)**
    dataset using the Keras TensorFlow **application programming interface (API)**
    and then adapt the code in order for this to be trained in a distributed way.
    First, we will create two functions that will be used to create the dataset and
    to build the model.'
