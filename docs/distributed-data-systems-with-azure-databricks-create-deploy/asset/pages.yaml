  md: "# BroadcastHashJoin\n\n+   - Configuring a BroadcastHashJoin is a way to optimize\
    \ joining a large and a small table in Spark SQL.\n+   - This notebook will cover\
    \ the how to configure a BroadcastHashJoin and why to choose it over a ShuffledHashJoin.\n\
    \n# Setup: Create a large table that will be joined with a smaller table.\n\n\
    ```\nfrom pyspark.sql import Row\n\narray = []\nfor i in range(0, 1000000):\n\
    \    array.append(Row(num=1, bit = i % 2))\n\ndataFrame = sqlContext.createDataFrame(sc.parallelize(array))\n\
    dataFrame.repartition(100).registerTempTable(\"my_large_table\")\n```\n\nCommand\
    \ took 7.72s\n\n```\ndisplay(array)\n```\n\nFigure 1.2 – Azure Databricks notebook.\
    \ Source: https://databricks.com/wp-content/uploads/2015/10/notebook-example.png\n\
    \n+   - **Clusters:** A cluster is a set of connected servers that work together\
    \ collaboratively as if they are a single (much more powerful) computer. In this\
    \ environment, you can perform tasks and execute code from notebooks working with\
    \ data stored in a certain storage facility or uploaded as a table. These clusters\
    \ have the means to manage and control who can access each one of them. Clusters\
    \ are used to improve performance and availability compared to a single server,\
    \ while typically being more cost-effective than a single server of comparable\
    \ speed or availability. It is in the clusters where we run our data science jobs,\
    \ ETL pipelines, analytics, and more.\n\nThere is a distinction between all-purpose\
    \ clusters and job clusters. **All-purpose clusters** are where we work collaboratively\
    \ and interactively using notebooks, but **job clusters** are where we execute\
    \ automatic and more concrete jobs. The way of creating these clusters differs\
    \ depending on whether it is an all-purpose cluster or a job cluster. The former\
    \ can be created using the UI, CLI, or REST API, while the latter is created using\
    \ the job scheduler to run a specific job and is terminated when this is done."
  merge: -1
  img_proc: true
- pgno: 26
  md: '+   - **Jobs**: Jobs are the tasks that we run when executing a notebook, JAR,
    or Python file in a certain cluster. The execution can be created and scheduled
    manually or by the REST API.

    +   - **Apps**: Third-party apps such as Table can be used inside Azure Databricks.
    These integrations are called apps.

    +   - **Apache SparkContext/environments**: Apache SparkContext is the main application
    in Apache Spark running internal services and connecting to the Spark execution
    environment. While, historically, Apache Spark has had two core contexts available
    to the user (SparkContext and SQLContext), in the 2.X versions, there is just
    one – the **SparkSession**.

    +   - **Dashboards**: Dashboards are a way to display the output of the cells
    of a notebook without the code that is required to generate them. They can be
    created from notebooks:


    ![](img/7e45bd08916c2a17d4e75cbb898f41e8_26_0.png)


    Figure 1.3 – Azure Databricks notebook. Source: https://databricks.com/wp-content/uploads/2016/02/Databricks-dashboards-screenshot.png'
  merge: -1
  img_proc: true
- pgno: 27
  md: '+   - **Libraries**: Libraries are modules that add functionality, written
    in Scala or Python, that can be pulled from a repository or installed via package
    management systems utilities such as PyPI or Maven.

    +   - **Tables**: Tables are structured data that you can use for analysis or
    for building models that can be stored on Amazon S3 or Azure Blob Storage, or
    in the cluster that you''re currently using cached in memory. These tables can
    be either global or local, the first being available across all clusters. A local
    table cannot be accessed from other clusters.

    +   - **Experiments**: Every time we run MLflow, it belongs to a certain experiment.
    Experiments are the central way of organizing and controlling all the MLflow runs.
    In each experiment, the user can search, compare, and visualize results, as well
    as downloading artifacts or metadata for further analysis.

    +   - **Models**: While working with ML or deep learning, the models that we train
    and use to infer are registered in the Azure Databricks MLflow Model Registry.
    MLflow is an open source platform designed to manage ML life cycles, which includes
    the tracking of experiments and runs, and MLflow Model Registry is a centralized
    model store that allows users to fully control the life cycle of MLflow models.
    It has features that enable us to manage versions, transition between different
    stages, have a chronological model heritage, and control model version annotations
    and descriptions.

    +   - **Azure Databricks workspace filesystem**: Azure Databricks is deployed
    with a distributed filesystem. This system is mounted in the workspace and allows
    the user to mount storage objects and interact with them using filesystem paths.
    It allows us to persist files so the data is not lost when the cluster is terminated.


    This section focused on the core pieces of Azure Databricks. In the next section,
    you will learn how to interact with Azure Databricks through the workspace, which
    is the place where we interact with our assets.'
  merge: -1
  img_proc: true
- pgno: 28
  md: '# Interacting with the Azure Databricks workspace


    The Azure Databricks workspace is where you can manage objects such as notebooks,
    libraries, and experiments. It is organized into folders and it also provides
    access to data, clusters, and jobs:


    ![](img/7e45bd08916c2a17d4e75cbb898f41e8_28_0.png)


    Figure 1.4 – Databricks workspace. Source: https://docs.microsoft.com/en-us/azure/databricks/workspace/


    Access and control of a workspace and its assets can be made through the UI, CLI,
    or API. We will focus on using the UI.


    # Workspace assets


    In the Azure Databricks workspace, you can manage different assets, most of which
    we have discussed in the terminology. These assets are as follows:


    +   - Clusters

    +   - Notebooks

    +   - Jobs'
  merge: -1
  img_proc: true
- pgno: 29
  md: '+   - Libraries

    +   - Assets folders

    +   - Models

    +   - Experiments


    In the following sections, we will dive deeper into how to work with folders and
    other workspaces objects. The management of these objects is central to running
    our tasks in Azure Databricks.


    # Folders


    All of our static assets within a workspace are stored in folders within the workspace.
    The stored assets can be notebooks, libraries, experiments, and other folders.
    Different icons are used to represent folders, notebooks, directories, or experiments.
    Click a directory to deploy the drop-down list of items:


    ![](img/7e45bd08916c2a17d4e75cbb898f41e8_29_0.png)


    Figure 1.5 – Workspace folders


    Clicking on the drop-down arrow in the top-right corner will unfold the menu item,
    allowing the user to perform actions with that specific folder:


    ![](img/7e45bd08916c2a17d4e75cbb898f41e8_29_1.png)


    Figure 1.6 – Workspace folders drop-down menu'
  merge: -1
  img_proc: true
- pgno: 30
  md: '# Special folders


    The Azure Databricks workspace has three special folders that you cannot rename
    or move to a special folder. These special folders are as follows:


    +   - Workspace

    +   - Shared

    +   - Users


    # Workspace root folder


    The **Workspace** root folder is a folder that contains all of your static assets.
    To navigate to this folder, click the workspace or home icon and then click the
    go back icon:


    ![](img/7e45bd08916c2a17d4e75cbb898f41e8_30_0.png)


    Within the **Workspace** root folder, you either select **Shared** or **Users**.
    The former is for sharing objects with other users that belong to your organization,
    and the latter contains a folder for a specific user.


    By default, the **Workspace** root folder and all of its contents are available
    for all users, but you can control and manage access by enabling workspace access
    control and setting permissions.


    # User home folders


    Within your organization, every user has their own directory, which will be their
    root directory:'
  merge: -1
  img_proc: true
- pgno: 31
  md: '![](img/7e45bd08916c2a17d4e75cbb898f41e8_31_0.png)


    Figure 1.8 – Workspace Users folder


    Objects in a user folder will be private to a specific user if workspace access
    control is enabled. If a user''s permissions are removed, they will still be able
    to access their home folder.


    # Workspace object operations


    To perform an action on a workspace object, right-click the object or click the
    drop-down icon at the right side of an object to deploy the drop-down menu:


    ![](img/7e45bd08916c2a17d4e75cbb898f41e8_31_1.png)


    Figure 1.9 – Operations on objects in the workspace


    If the object is a folder, from this menu, the user can do the following:


    +   - Create a notebook, library, MLflow experiment, or folder.

    +   - Import a Databricks archive.'
  merge: -1
  img_proc: true
- pgno: 32
  md: 'If it is an object, the user can choose to do the following:


    +   - Clone the object.

    +   - Rename the object.

    +   - Move the object to another folder.

    +   - Move the object to Trash.

    +   - Export a folder or notebook as a Databricks archive.

    +   - If the object is a notebook, copy the notebook''s file path.

    +   - If you have Workspace access control enabled, set permissions on the object.


    When the user deletes an object, this object goes to the Trash folder, in which
    everything is deleted after 30 days. Objects can be restored from the Trash folder
    or be eliminated permanently.


    Now that you have learned how to interact with Azure Databricks assets, we can
    start working with Azure Databricks notebooks to manipulate data, create ETLs,
    ML experiments, and more.


    # Using Azure Databricks notebooks


    In this section, we will describe the basics of working with notebooks within
    Azure Databricks.


    # Creating and managing notebooks


    There are different ways to interact with notebooks in Azure Databricks. We can
    either access them through the UI using CLI commands, or by means of the workspace
    API. We will focus on the UI for now:


    +   1. By clicking on the Workspace or Home button in the sidebar, select the
    drop-down icon next to the folder in which we will create the notebook. In the
    Create Notebook dialog, we will choose a name for the notebook and select the
    default language:'
  merge: -1
  img_proc: true
- pgno: 33
  md: '![](img/7e45bd08916c2a17d4e75cbb898f41e8_33_0.png)


    Figure 1.10 – Creating a new notebook


    2. Running clusters will show notebooks attached to them. We can select one of
    them to attach the new notebook to; otherwise, we can attach it once the notebook
    has been created in a specific location.


    3. To open a notebook, in your workspace, click on the icon corresponding to the
    notebook you want to open. The notebook path will be displayed when you hover
    over the notebook title.


    > Note

    > If you have an Azure Databricks Premium plan, you can apply access control to
    the workspace assets.


    # External notebook formats


    Azure Databricks supports several notebook formats, which can be scripts in one
    of the supported languages (Python, Scala, SQL, and R), HTML documents, DBC archives
    (Databricks native file format), IPYNB Jupyter notebooks, and R Markdown documents.'
  merge: -1
  img_proc: true
- pgno: 34
  md: '# Importing a notebook


    We can import notebooks into the Azure workspace by clicking in the drop-down
    menu and selecting Import. After this, we can specify either a file or a URL that
    contains the file in one of the supported formats and then click Import:


    ![](img/7e45bd08916c2a17d4e75cbb898f41e8_34_0.png)


    Figure 1.11 – Importing a notebook into the workspace


    # Exporting a notebook


    You can export a notebook in one of the supported file formats by clicking on
    the File button in the notebook toolbar and then selecting Export. Bear in mind
    that the results of each cell will be included if you have not cleared them.


    # Notebooks and clusters


    To be able to work, a notebook needs to be attached to a running cluster. We will
    now learn about how notebooks connect to the clusters and how to manage these
    executions.


    # Execution contexts


    When a notebook is attached to a cluster, a read-eval-print-loop (REPL) environment
    is created. This environment is specific to each one of the supported languages
    and is contained in an execution context.


    There is a limit of 145 execution contexts running in a single cluster. Once that
    number is reached, you cannot attach any more notebooks to that cluster or create
    a new execution context.


    # Idle execution contexts


    If an execution context has passed a certain time threshold without any executions,
    it is considered idle and automatically detached from the notebook. This threshold
    is, by default, 25 hours.'
  merge: -1
  img_proc: true
- pgno: 35
  md: 'One thing to consider is that when a cluster reaches its maximum context limit,
    Azure Databricks will remove the least recently used idle execution contexts.
    This is called an **eviction**.


    If a notebook gets evicted from the cluster it was attached to, the UI will display
    a message:


    ![](img/7e45bd08916c2a17d4e75cbb898f41e8_35_0.png)


    Figure 1.12 – Detached notebook notification


    We can configure this behavior when creating the cluster or we can disable it
    by setting the following:


    ```

    spark.databricks.chauffeur.enableIdleContextTracking false

    ```


    # Attaching a notebook to a cluster


    Notebooks are attached to a cluster by selecting one from the drop-down menu in
    the notebook toolbar.


    A notebook attached to a running cluster has the following Spark environment variables
    by default:


    | Class | Variable Name |

    |---|---|

    | SparkContext | sc |

    | SQLContext/HiveContext | sqlContext |

    | SparkSession (Spark 2.x) | spark |


    Figure 1.13 – A table showing Spark environment variables


    We can check the Spark version running in the cluster where the notebook is attached
    by running the following Python code in one of the cells:


    ```

    spark.version

    ```'
  merge: -1
  img_proc: true
- pgno: 36
  md: 'We can also see the current Databricks runtime version with the following command:


    ```

    spark.conf.get("spark.databricks.clusterUsageTags.sparkVersion")

    ```


    These properties are required by the Clusters and Jobs APIs to communicate between
    themselves.


    On the cluster details page, the **Notebooks** tab will show all the notebooks
    attached to the cluster, as well as the status and the last time it was used:


    ![](img/7e45bd08916c2a17d4e75cbb898f41e8_36_0.png)


    Figure 1.14 – Notebooks attached to a cluster


    Attaching a notebook to a cluster is necessary in order to make them work; otherwise,
    we won''t be able to execute the code in it.


    Notebooks are detached from a cluster by clicking in the currently attached cluster
    and selecting **Detach**:


    ![](img/7e45bd08916c2a17d4e75cbb898f41e8_36_1.png)


    Figure 1.15 – Detaching a notebook from a cluster


    This causes the cluster to lose all the values stored as variables in that notebook.
    It is good practice to always detach the notebooks from the cluster once we have
    finished working on them. This prevents the autostopping of running clusters,
    in case there is a process running in the notebook (which could cause undesired
    costs).'
  merge: -1
  img_proc: true
- pgno: 37
  md: '# Scheduling a notebook


    As mentioned before, notebooks can be scheduled to be executed periodically. To
    schedule a notebook job to run periodically, click the **Schedule** button at
    the top right of the notebook toolbar.


    # A notebook''s core functionalities


    Now, we''ll look at how you can use a notebook.


    # Notebook toolbar


    Notebooks have a toolbar that contains information on the cluster to which it
    is attached, and to perform actions such as exporting the notebook or changing
    the predefined language (depending on the Databricks runtime version):


    ![](img/7e45bd08916c2a17d4e75cbb898f41e8_37_0.png)


    This toolbar helps us to navigate the general options in our notebook and makes
    it easier to manage how we interact with the computation cluster.


    # Cells


    Cells have code that can be executed:


    ![](img/7e45bd08916c2a17d4e75cbb898f41e8_37_1.png)


    At the top-left corner of a cell, in the cell actions, you have the following
    options: **Run this cell**, **Dashboard**, **Edit**, **Hide**, and **Delete**:


    +   - You can use the **Undo** keyboard shortcut to restore a deleted cell by
    selecting **Undo Delete Cell** from **Edit**.

    +   - Cells can be cut using cell actions or the **Cut** keyboard shortcut.

    +   - Cells are added by clicking on the **Plus** icon at the bottom of each cell
    or by selecting **Add Cell Above** or **Add Cell Below** from the cell menu in
    the notebook toolbar.'
  merge: -1
  img_proc: true
- pgno: 38
  md: '# Running cells


    Specific cells can be run from the cell actions toolbar. To run several cells,
    we can choose between **Run all, all above**, or **all below**. We can also select
    **Run All, Run All Above**, or **Run All Below** from the **Run** option in the
    notebook toolbar. Bear in mind that **Run All Below** includes the cells you are
    currently in.


    # Default language


    The default language for each notebook is shown in parentheses next to the notebook
    name, which, in the following example, is SQL:


    ![](img/7e45bd08916c2a17d4e75cbb898f41e8_38_0.png)


    Figure 1.18 – Cell default language


    If you click the name of the language in parentheses, you will be prompted by
    a dialog box in which you can change the default language of the notebook:


    ![](img/7e45bd08916c2a17d4e75cbb898f41e8_38_1.png)


    Figure 1.19 – Changing the default language of a cell


    When the default language is changed, magic commands will be added to the cells
    that are not in the new default language in order to keep them working.


    The language can also be specified in each cell by using the magic commands. Four
    magic commands are supported for language specification: `%python`, `%r`, `%scala`,
    and `%sql`.'
  merge: -1
  img_proc: true
- pgno: 39
  md: 'There are also other magic commands such as %sh, which allows you to run shell
    code; %fs to use dbutils filesystem commands; and %md to specify Markdown, for
    including comments and documentation. We will look at this in a bit more detail.


    # Including documentation


    Markdown is a lightweight markup language with plain text-formatting syntax, often
    used for formatting readme files, which allows the creation of rich text using
    plain text.


    As we have seen before, Azure Databricks allows Markdown to be used for documentation
    by using the %md magic command. The markup is then rendered into HTML with the
    desired formatting. For example, the next code is used to format text as a title:


    ```

    %md # Hello This is a Title

    ```


    It is rendered as an HTML title:


    ![](img/7e45bd08916c2a17d4e75cbb898f41e8_39_0.png)


    Figure 1.20 – Markdown title


    Documentation blocks are one of the most important features of Azure Databricks
    notebooks. They allow us to state the purpose of our code and how we interpret
    our results.


    # Command comments


    Users can add comments to specific portions of code by highlighting it and clicking
    on the comment button in the bottom-right corner of the cell:


    ![](img/7e45bd08916c2a17d4e75cbb898f41e8_39_1.png)


    Figure 1.21 – Selecting a portion of code'
  merge: -1
  img_proc: true
- pgno: 40
  md: 'This will prompt a textbox in which we can place comments to be reviewed by
    other users. Afterward, the commented text will be highlighted:


    ![](img/7e45bd08916c2a17d4e75cbb898f41e8_40_0.png)


    Figure 1.22 – Commenting on the selection


    Comments allow us to propose changes or require information on specific portions
    of the notebook without intervening in the content.


    # Downloading a cell result


    You can download the tabular results from a cell to your local machine by clicking
    on the download button at the bottom of a cell:


    ![](img/7e45bd08916c2a17d4e75cbb898f41e8_40_1.png)


    Figure 1.23 – Downloading full results from a cell


    By default, Azure Databricks limits you to viewing 1,000 rows of a DataFrame,
    but if there is more data present, we can click on the drop-down icon and select
    Download full results to see more.


    # Formatting SQL


    Formatting SQL code can take up a lot of time, and enforcing standards across
    notebooks can be difficult.'
  merge: -1
  img_proc: true
- pgno: 41
  md: 'Azure Databricks has a functionality for formatting SQL code in notebook cells,
    so as to reduce the amount of time dedicated to formatting code, and also to help
    in applying the same coding standards in all notebooks. To apply automatic SQL
    formatting to a cell, you can select it from the cell context menu. This is only
    applicable to SQL code cells:


    ![](img/7e45bd08916c2a17d4e75cbb898f41e8_41_0.png)


    Figure 1.24 – Automatic formatting of SQL code


    Applying the autoformatting of SQL code is a feature that can improve the readability
    of our code, and reduce possible mistakes due to bad formatting.


    # Exploring data management


    In this section, we will dive into how to manage data in Azure Databricks in order
    to perform analytics, create ETL pipelines, train ML algorithms, and more. First,
    we will briefly describe types of data in Azure Databricks.


    # Databases and tables


    In Azure Databricks, a database is composed of tables; table collections of structured
    data. Users can work with these tables, using all of the operations supported
    by Apache Spark DataFrames, and query tables using Spark API and Spark SQL.


    These tables can be either global or local, accessible to all clusters. Global
    tables are stored in the Hive metastore, while local tables are not.


    Tables can be populated using files in the DBFS or with data from all of the supported
    data sources.'
  merge: -1
  img_proc: true
- pgno: 42
  md: '# Viewing databases and tables


    Tables related to the cluster you are currently using can be viewed by clicking
    on the data icon button in the sidebar. The **Databases** folder will display
    the list of tables in each of the selected databases:


    ![](img/7e45bd08916c2a17d4e75cbb898f41e8_42_0.png)


    Figure 1.25 – Default tables


    Users can select a different cluster by clicking on the drop-down icon at the
    top of the **Databases** folder and selecting the cluster:


    ![](img/7e45bd08916c2a17d4e75cbb898f41e8_42_1.png)


    Figure 1.26 – Selecting databases in a different cluster


    We can have several queries on a cluster, each with its own filesystem. This is
    very important when we reference data in our notebooks.'
  merge: -1
  img_proc: true
- pgno: 43
  md: '# Importing data


    Local files can be uploaded to the Azure Databricks filesystem using the UI.


    Data can be imported into Azure Databricks DBFS to be stored in the FileStore
    using the UI. To do this, you can either go to the Upload Data UI and select the
    files to be uploaded as well as the DBFS target directory:


    ![](img/7e45bd08916c2a17d4e75cbb898f41e8_43_0.png)


    Figure 1.27 – Uploading the data UI


    Another option available to you for uploading data to a table is to use the Create
    Table UI, accessible in the Import & Explore Data box in the workspace:


    ![](img/7e45bd08916c2a17d4e75cbb898f41e8_43_1.png)


    Figure 1.28 – Creating a table UI in Import & Explore Data'
  merge: -1
  img_proc: true
- pgno: 44
  md: 'For production environments, it is recommended to use the DBFS CLI, DBFS API,
    or the Databricks filesystem utilities (`dbutils.fs`).


    # Creating a table


    Users can create tables either programmatically using SQL, or via the UI, which
    creates global tables. By clicking on the data icon button in the sidebar, you
    can select **Add Data** in the top-right corner of the **Databases** and **Tables**
    display:


    ![](img/7e45bd08916c2a17d4e75cbb898f41e8_44_0.png)


    Figure 1.29 – Adding data to create a new table


    After this, you will be prompted by a dialog box in which you can upload a file
    to create a new table, selecting the data source and cluster, the path to where
    it will be uploaded into the DBFS, and also be able to preview the table:


    ![](img/7e45bd08916c2a17d4e75cbb898f41e8_44_1.png)


    Figure 1.30 – Creating a new table UI


    Creating tables through the UI or the **Add data** options are two of the many
    options that we have to ingest data into Azure Databricks.'
  merge: -1
  img_proc: true
- pgno: 45
  md: '# Table details


    Users can preview the contents of a table by clicking the name of the table in
    the Tables folder. This will show a view of the table where we can see the table
