- pgno: 80
  md: '# Groups API


    The Groups API allows for the management of groups of users, whose members can
    be added and removed from it. Groups can be created, deleted, and listed. The
    following command will list all members in the admins group:


    ```

    databricks groups list-members --group-name admins

    ```


    There are five permission levels for Databricks, which are, ordered hierarchically:
    No Permissions, Read, Run, Edit, and Manage. Read allows cells to be viewed and
    comments to be made on notebooks. Run adds to this the possibility of attaching
    and detaching notebooks from clusters and running notebooks. Edit adds to the
    previous permissions the possibility to edit cells. Manage can perform all actions
    and change the permissions of others.


    # The Databricks CLI from Azure Cloud Shell


    One of the benefits that we have in Azure is that we can use the Databricks CLI
    directly from the Azure portal:


