- pgno: 130
  md: '# Partitioning data to speed up queries


    You can speed up queries and DML operations by partitioning columns during processes.
    We can also apply this to Delta tables by using the PARTITIONED BY command on
    the column that we want to use as partition, which in many cases is a date column.
    If we specify LOCATION as a path to the Databricks filesystem, this creates the
    table in the metastore. If the table is not in the metastore, dropping the table
    won''t remove the file specified in the location. Let''s take a look:


    +   - Here, we''re creating a table in the Azure Databricks metastore and partitioning
    it by the input_date column:

    +   ```

    +   CREATE TABLE data (

    +       input_date DATE,

    +       record_id STRING,

    +       record_type STRING,

    +       record_data STRING)

    +   PARTITIONED BY (date)

    +   LOCATION ''/mnt/delta_files/data''

    +   ```


    Again, we can also use Python for this operation.


    +   - The following command performs the same operation, creating a table in the
    metastore:

    +   ```

    +   df.write.format("delta").partitionBy("date").saveAsTable("data")

    +   ```


    +   - We can also perform the same operation by specifying the table''s path:

    +   ```

    +   df.write.format("delta").partitionBy("date").save("/mnt/delta_files/data")

    +   ```


    If tables are created in locations that already host a Delta table path, this
    can lead to the following scenarios. If only the table name and location are specified,
    it will be understood as if we just imported the data, and the created table will
    inherit the schema, partitioning, and properties of the table that was already
    in that path:'
  merge: -1
  img_proc: true
- pgno: 131
  md: '+   - The following example shows what would happen if `/mnt/delta/data` already
    hosted a table:


    ```

    CREATE TABLE data

    USING DELTA

    LOCATION ''/mnt/delta/data''

    ```


    This also shows how the Delta Lake''s automatic schema inference works.


    If we had specified a schema and a partitioning, the Delta table would have checked
    that the input data matches the existing data. If it doesn''t, an exception will
    be raised.


    # Querying past states of a table


    As we mentioned previously, querying the past states of a table is a feature of
    Delta Lakes that is very useful when we''re working with data that has been manipulated
    incorrectly, recovering deleted records, auditing, and in regulated industries.
    It also allows us to write queries that use different states in time, thanks to
    snapshot isolation.


    This section describes how we can use these methods to query older versions of
    tables.


    # Using time travel to query tables


    To query the previous state of a table, we can do the following:


    +   - We can use the AS OF command, using SQL syntax:


    ```

    SELECT * FROM table_name TIMESTAMP AS OF timestamp_expression

    ```


    The table_name parameter is the table''s name. We can also pass any expression
    that can be cast as a timestamp or a date string to get the exact snapshot of
    data that we require.


    +   - Another way to query the past states of a table is by using the VERSION
    AS OF command. To do this, we need to pass a specific version, which can be obtained
    from the output of DESCRIBE HISTORY. A full example of both methods is as follows:


    ```

    SELECT * FROM table_name VERSION AS OF table_version

    ```'
  merge: -1
  img_proc: true
- pgno: 132
  md: 'Here, table_version is a value that can be obtained by using DESCRIBE HISTORY
    on the table that we wish to query.


    +   If we would like to use this feature in a Python block of code in an Azure
    Databricks notebook, we can set the DataFrameReader option to one specific point
    in time or version of a table. To do this, we need to pass the timestampAsOf option:


    ```

    df = spark.read.format("delta").option("timestampAsOf", timestamp_string).load("/mnt/delta/data")

    ```


    Here, ''/mnt/delta/data'' is the location of the table.


    The same applies to accessing a specific version. We can do this by passing versionAsOf
    to the DataFrameReader option:


    ```

    df = spark.read.format("delta").option("versionAsOf", version).load("/mnt/delta/data")

    ```


    It''s easy to use time travel to select data from an earlier version of a table.
    Users can view the history of a table and see what the data looked like at that
    point by using either a version history number (as shown in the following code,
    when selecting the VERSION AS OF 0 table data), or by timestamp:


    +   We can learn how to obtain the available versions and see the history of a
    table by reading the HISTORY property of the data using DESCRIBE:


    ```

    DESCRIBE HISTORY data

    ```


    +   If we would like to access the snapshot of the table to see what the data
    looked like at a certain point in time, we can use TIMESTAMP combined with AS
    OF:


    ```

    SELECT * FROM loan_by_state_delta TIMESTAMP AS OF ''2020-07-14 16:30:00''

    ```


    Delta Lake guarantees that while querying the previous state of a table, all the
    transformations can be tracked, reproduced, and remain in a reversible state.
    This is especially useful while working with data that''s bound by GDPR or CCPA
    regulations, in which it is required to have proof of deletion. We can also use
    this method to visualize every DML operation, such as updates and merges that
    have been made on this table.'
  merge: -1
  img_proc: true
- pgno: 133
  md: 'Time travel is a safeguard against possible human mistakes or data mishandling
    and provides easy ways to debug errors, thanks to its transaction log. This allows
    us to go back in time, find the mechanism that created the error, action on that
    issue, and revert the data to an accurate state.


    If we take into account that Delta tables automatically update themselves, it''s
    good practice to set them to the latest version while executing jobs in Azure
    Databricks. Otherwise, the whole process may produce different results if the
    data gets updated during the execution process.


    +   - We can execute a SQL query to get the latest version by using the following
    Python command:


    ```

    latest_version = spark.sql("SELECT max(version).\

    FROM (DESCRIBE HISTORY delta.`/mnt/delta/events`)").collect()

    df = spark.read.format("delta").option("versionAsOf", latest_version[0][0]).load("/mnt/delta/events")

    ```


    Another way to access a specific point in history or version of a Delta table
    is by using the @ syntax. This is a way to point to a certain state of a table
    during SQL and Python executions.


    +   - An example of this is the following SQL command, in which we''re using a
    timestamp to select all the rows of a table at a point in time:


    ```

    SELECT * FROM events@20200101000000000

    ```


    +   - We can also specify a version in the same way by adding v as a prefix to
    the version:


    ```

    SELECT * FROM events@v114

    ```


    The same applies to Python, where the @ syntax is passed directly to the path
    of the table we want to load.


    +   - The following is an example of how to access a particular timestamp:


    ```

    spark.read.format("delta").load("/mnt/delta/events@20200101000000000")

    ```'
  merge: -1
  img_proc: true
- pgno: 134
  md: "+   - The same method applies to versions:\n\n```\nspark.read.format(\"delta\"\
    ).load(\"/mnt/delta/events@v114\")\n```\n\nAt this point, you might be wondering\
    \ how far back in time you can go. The default is 30 days in the past, as long\
    \ you haven't run the VACUUM command on the Delta table you want to access; otherwise,\
    \ you won't be able to go further than 7 days into the past.\n\n+   - This behavior\
    \ can be configured by setting the delta.logRetentionDuration and delta.deletedFileRetentionDuration\
    \ properties. For example, we can set delta.deletedFileRetentionDuration to 30\
    \ days by running the following command:\n\n```\ndelta.deletedFileRetentionDuration\
    \ = \"interval 30 days\".\n```\n\nThis way, we can easily establish a retention\
    \ policy for the available history of any delta table.\n\nMaking use of time travel\
    \ allow us to have a failsafe in case we have performed the wrong operation on\
    \ the data, and we want to recover the previous state. In the next section, we\
    \ will learn how to leverage this feature while storing and processing data in\
    \ Delta Lake.\n\n# Working with past and present data\n\nBeing able to access\
    \ the previous time states of a table is especially useful when we want to recover\
    \ information that has been removed or deleted, or when we want to monitor the\
    \ growth of data in time. Let's take a look:\n\n+   - The following is an example\
    \ of this functionality. Here, we're inserting records that were previously deleted\
    \ by passing the desired timestamp and merge for all the user IDs that match.\
    \ These records are all from 7 days ago:\n\n```\nMERGE INTO target_table trg\n\
    \    USING source_table TIMESTAMP AS OF date_sub(current_date(), 7) src\n    ON\
    \ src.user_id = trg.user_id\n    WHEN MATCHED THEN UPDATE SET *\n```"
  merge: -1
  img_proc: true
- pgno: 135
  md: "We can also use time travel to rapidly query the increase in the number of\
    \ users in the last 30 days:\n\n```\nSELECT count(distinct user_id) -\n  SELECT\
    \ count(distinct user_id)\n  FROM targe_table TIMESTAMP AS OF date_sub(current_date(),\
    \ 30)\n```\n\nAnother example would be to override a particular subset of data.\
    \ First, we must load the specific version that we want to use:\n\n```\ndf = spark.read.format(\"\
    delta\").option(\"versionAsOf\", version).load(\"/mnt/delta/data\")\n```\n\nThen,\
    \ we can select a particular date range, which in our case is the first 15 days\
    \ of June to be overridden by the ones in the previous version:\n\n```\ndf.write.format(\"\
    delta\").mode(\"overwrite\")\\\n  .option(\"replaceWhere\", \"insert_date >= '2020-06-15'\
    \ AND insert_date <= '2020-06-15'\")\\\n  .save(\"/mnt/delta/data\")\n```\n\n\
    You can also state why the changes in the data have been made, which you can do\
    \ by storing them as metadata in the commits that are produced when these changes\
    \ take place. This metadata can be later accessed in the operations history.\n\
    \nIn the following example, we're replacing the complete version and state that\
    \ we have made these changes to because the data was faulty:\n\n```\ndf.write.format(\"\
    delta\").mode(\"overwrite\") \\\n  .option(\"userMetadata\", \"updating-faulty-data\"\
    ).save(\"/mnt/delta/data\")\n```\n\nThe \"overwrite\" mode will replace the delta\
    \ table stored in \"/mnt/delta/data\". It will specify user metadata with the\
    \ userMetadata option to describe why the change was made, in the same way as\
    \ a Git commit message.\n\nThe same can be done in SQL by setting the spark.databricks.delta.commitInfo.userMetadata\
    \ option to the commit string:\n\n```\nSET spark.databricks.delta.commitInfo.userMetadata=updating-faulty-data\n\
    INSERT OVERWRITE data SELECT * FROM correctData\n```"
