- pgno: 336
  md: '# Applying best practices in Hyperopt


    So far, we have discussed how we can specify both the execution of the objective
    function to be minimized and the search space that we will evaluate it in. Also,
    we have seen that there is plenty of flexibility in terms of how we can define
    the way we will explore the possible values of the hyperparameters, as well as
    how we can take advantage of the domain knowledge by defining conditional parameters
    in the search space.


    We must keep some aspects of the Hyperopt library itself in mind, as well as the
    way it is executed in Azure Databricks. Here are some concepts that are important
    to remember while optimizing objective functions with Hyperopt in Azure Databricks:


    +   - The Hyperopt Tree of Parzen Estimator algorithm is a Bayesian method that''s
    much more efficient than common grid and random search approaches. It allows us
    to scan a larger set of possible hyperparameters. Apply the domain knowledge when
    defining the search space to improve the performance of the exploration.

    +   - When we use `hyperopt.choice()` and MLflow to track the progress of the
    optimization, MLflow will log the index of the choice list. We can fetch the parameter
    values using the Hyperopt `hyperopt.space_eval()` function.

    +   - When working on large datasets, it is always advisable to experiment on
    small subsets of the data to incrementally learn about the optimal search space.
    This helps us define the one that will be used on the entire dataset.

    +   - When we use the SparkTrials object, it is advisable to use CPU-only clusters.
    This is because in Azure Databricks, parallelism is reduced in the GPU clusters
    in comparison to the CPU ones.

    +   - Do not use SparkTrials on autoscaling clusters as the parallelism value
    is selected at the beginning of the execution. Therefore, if the cluster scales,
    it won''t improve the performance of the execution.


    Applying these concepts will ensure that we take advantage of the execution of
    the optimization with Hyperopt in Azure Databricks. In the next section, we will
    learn more about how to improve the inference of deep learning models in Azure
    Databricks.'
  merge: -1
  img_proc: true
