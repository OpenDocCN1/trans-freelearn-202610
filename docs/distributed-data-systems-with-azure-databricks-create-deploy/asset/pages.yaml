- pgno: 150
  md: '# Technical requirements


    To be able to work with Delta Engine in this chapter, you will need an Azure Databricks
    subscription.


    # Optimizing file management with Delta Engine


    Delta Engine allows improved management of files in Delta Lake, yielding better
    query speed, thanks to optimization in the layout of the stored data. Delta Lake
    does this by using two types of algorithms: **bin-packing** and **Z-Ordering**.
    The first algorithm is useful when merging small files into larger ones and is
    more efficient in handling the larger ones. The second algorithm is borrowed from
    mathematical analysis and is applied to the underlying structure of the data to
    map multiple dimensions into one dimension while preserving the locality of the
    data points.


    In this section, we will learn how these algorithms work, see how to implement
    them using commands that act on our data, and how to handle snapshots of data
    thanks to the time travel feature.


    It is good to remember that although there are automatic optimizations that take
    place when we use Delta Lake, most of these optimizations do not occur automatically,
    and some of them must be manually applied. We will see how—and how often—to do
    this.


    # Merging small files using bin-packing


    We have discussed in the previous chapters difficulties that may arise from working
    with several small files that arrive at our data lake from different sources.
    Delta Engine provides us a workaround for this issue by allowing us to coalesce
    small files into larger files.


    Bin-packing is, like Z-Ordering, an algorithm borrowed from mathematical analysis
    that was originally conceived to optimize how to pack objects of different volumes
    into a finite number of bins while using the smallest number of bins possible.
    We can already think of how this can be applied to the problem of packing smaller
    files into the smallest number of larger, more efficient files. They are as follows:


    +   - We can apply this algorithm to a Delta table by using the OPTIMIZE command
    on a specific table path, as shown in the following code example:


    ```

    OPTIMIZE delta.`/data/data_events`

    ```


    Running this operation in a table will show as output the path of the table affected
    by the operation, along with metrics of the number of files that were modified
    during the optimization, as illustrated in the following screenshot:'
  merge: -1
  img_proc: true
- pgno: 151
  md: '![](img/7e45bd08916c2a17d4e75cbb898f41e8_151_0.png)


