    \ greater than the mean? To discretize the values, we will compare this with the\
    \ mean and use the numpy.where() function to convert the Booleans values that\
    \ the comparison yields into 1s and 0s:\n\n```\ntarget_discrete = np.where(target\
    \ < np.median(target), 0, 1)\n```\n\nThis way, we have encoded our target variable\
    \ into a column vector with two levels, either 1 or 0. This indicates whether\
    \ the housing price is above the mean.\n\n10. Now that we have prepared our dataset,\
    \ we can start setting the stage for optimizing the hyperparameters of several\
    \ scikit-learn models that we will use to train an effective classification model.\
    \ To this end, we will use the following three scikit-learn classifier models:\n\
    \n+   a) Support Vector Machines\n+   b) Logistic Regression\n+   c) Random Forest"
  merge: -1
  img_proc: true
- pgno: 341
  md: "11. We will create an objective function to be minimized that will be passed\
    \ to Hyperopt. This will run the training and calculate the cross-validation performance\
    \ metric over several types of models, defined as 'type' parameters. One thing\
    \ to bear in mind about this function is that because we are using the fmin()\
    \ Hyperopt function, this will try to minimize the objective function. So, to\
    \ improve the performance metric – which is accuracy, in this case – we must use\
    \ the negative accuracy. Otherwise, Hyperopt will try to minimize the accuracy,\
    \ which is something that we obviously don't want to do:\n\n```\ndef objective(params):\n\
    \    classifier_type = params['type']\n    del params['type']\n    if classifier_type\
    \ == 'svm':\n        clf = SVC(**params)\n    elif classifier_type == 'rf':\n\
    \        clf = RandomForestClassifier(**params)\n    elif classifier_type == 'logreg':\n\
    \        clf = LogisticRegression(**params)\n    else:\n        return 0\n   \
    \ accuracy = cross_val_score(\n        clf,\n        scaled_features,\n      \
    \  target_discrete).mean()\n    return {'loss': -accuracy, 'status': STATUS_OK}\n\
    ```\n\nNotice that the output of this function is a key-valued dictionary with\
    \ the two required parameters. These are the 'loss', which is the negative accuracy,\
    \ and the 'status', which is defined using one of the Hyperopt status strings\
    \ that we imported previously."
  merge: -1
  img_proc: true
- pgno: 342
  md: "12. The next step is to define the search space we will use to scan all the\
    \ possible hyperparameters for each of the selected scikit-learn models. This\
    \ will help us find the one that yields the best accuracy. We will use the hyperopt.choice()\
    \ function to select the different models and specify the search space for each\
    \ classification algorithm. The label of this selection is classifier_type. It\
    \ will iterate over the previously defined types of algorithms in the objective\
    \ function based on the given labels in the search space:\n\n```\nsearch_space\
    \ = hp.choice('classifier_type', [\n    {\n        'type': 'svm',\n        'C':\
    \ hp.lognormal('SVM_C', 0, 1.0),\n        'kernel': hp.choice('kernel', ['linear',\
    \ 'rbf'])\n    },\n    {\n        'type': 'rf',\n        'max_depth': hp.quniform('max_depth',\
    \ 1, 3, 5),\n        'criterion': hp.choice('criterion', ['gini', 'entropy'])\n\
    \    },\n    {\n        'type': 'logreg',\n        'C': hp.lognormal('LR_C', 0,\
    \ 1.0),\n        'solver': hp.choice('solver', ['liblinear', 'lbfgs'])\n    },\n\
    ])\n```\n\nThe hyperopt.choice() function that is inside the search space expression\
    \ will pass the 'type' parameter to the objective function, which, in turn, creates\
    \ an internal variable named classifier_type and uses it to select the appropriate\
    \ algorithm. It then passes the remaining parameters to the model. Notice how,\
    \ in the objective function, the 'type' parameter was removed after the internal\
    \ variable was created to avoid any possible naming conflicts in the target algorithm."
  merge: -1
  img_proc: true
- pgno: 343
  md: "13. Now, we must choose the search algorithm that will be used to scan the\
    \ search space. As we have seen previously, Hyperopt provides us with two main\
    \ options for this:\n\n+   a) `hyperopt.tpe.suggest`: This is the **Tree of Parzen\
    \ Estimators (TPE)** algorithm, which is a Bayesian algorithm that adaptatively\
    \ selects hyperparameters based on the previous results.\n+   b) `hyperopt.rand.suggest`:\
    \ This is a random search algorithm that differs from the TPE algorithm in that\
    \ it is a non-adaptive approach that uses a sampling strategy over the search\
    \ space.\n\n14. In this example, we will use the TPE algorithm, so we will choose\
    \ `tpe.suggest`, as shown here:\n\n```\nsearch_algorithm = tpe.suggest\n```\n\n\
    15. The next step is to define the object that will hold the results of each of\
    \ the trials. We will use SparkTrials to keep track of the progress of the exploration\
    \ and log it in MLflow. As we mentioned previously, we will use the SparkTrials\
    \ object instead of the native `Trials` Hyperopt object because we are using algorithms\
    \ designed to be run on a single machine. If we were to use an MLlib algorithm,\
    \ we must use the MLflow API to keep track of the `Trials` result.\n\nIn turn,\
    \ SparkTrials is an object that can receive two optional arguments, as follows:\n\
    \n+   a) `parallelism`: This is the number of algorithms to fit and evaluate in\
    \ parallel. The default value of this parameter is equal to the number of available\
    \ Spark task slots.\n+   b) `timeout`: Maximum time (in seconds) that `fmin()`\
    \ can run for. There is no maximum time limit.\n\nThe default `parallelism` value\
    \ in Spark is 8. The recommended setting for this is to explicitly set this value\
    \ to a positive value, since the Spark task slots is dependent on the cluster's\
    \ size.\n\n16. The final step of preparing the optimization run is to use the\
    \ `mlflow.start_run()` MLflow wrapper. We will use it to log the results of this\
    \ exploration in the MLflow platform. This will automatically keep track of the\
    \ progress of the run, along with all the defined variables and labels in the\
    \ objective function and search space:\n\n```\nwith mlflow.start_run():\n    best_hyperparams\
    \ = fmin(\n```"
  merge: -1
  img_proc: true
- pgno: 344
  md: "```\nfn=objective,\nspace=search_space,\nalgo=search_algorithm,\nmax_evals=32,\n\
    trials= SparkTrials()\n```\n\n17. The max_evals parameter allows us to specify\
    \ the maximum number of points in the search space that will be evaluated. So,\
    \ we can consider this value to be the maximum number of models that Hyperopt\
    \ will fit and evaluate for each search space:\n\n```\nsearch_algorithm = tpe.suggest\n\
    with mlflow.start_run():\n    best_hyperparams = fmin(\n        fn=objective,\n\
    \        space=search_space,\n        algo=search_algorithm,\n        max_evals=32,\n\
