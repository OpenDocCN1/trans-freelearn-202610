  md: "# Reading a dataset\n\nReading datasets using Petastorm can be very simple.\
    \ In this section, we will demonstrate how we can easily load a Petastorm dataset\
    \ into two frequently used deep learning frameworks, which are TensorFlow and\
    \ PyTorch:\n\n+   1. To load our Petastorm datasets, we use the petastorm.reader.Reader\
    \ class, which implements the iterator interface that allows us to use plain Python\
    \ to go over the samples very efficiently. The petastorm.reader.Reader class can\
    \ be created using the petastorm.make_reader factory method:\n\n```\nfrom petastorm\
    \ import make_reader\nwith make_reader('dfs://some_dataset') as reader:\n    for\
    \ sample in reader:\n        print(sample.id)\n        plt.imshow(sample.image1)\n\
    ```\n\n+   2. The following code example shows how we can stream a dataset into\
    \ the TensorFlow Examples class, which as we have seen before is a named tuple\
    \ with the keys being the ones specified in the Unischema of the dataset, and\
    \ the values are tf.tensor objects:\n\n```\nfrom petastorm.tf_utils import tf_tensors\n\
    with Reader('dfs://some_dataset') as reader:\n    tensor = tf_tensors(reader)\n\
    \    with tf.Session() as sess:\n        sample = sess.run(tensor)\n        print(sample.id)\n\
    \        plt.imshow(sample.image1)\n```\n\nIn this way, we can read Parquet data\
    \ into TensorFlow native data structures. In the future, they will be enabled\
    \ to access the data using the tf.data.Dataset interface.\n\n+   3. Similar to\
    \ how we can load data into TensorFlow, data loaded using the Petastorm dataset\
    \ can be incorporated into PyTorch using an adapter class, petastorm.pytorch.DataLoader,\
    \ as is shown in the next Python code example:\n\n```\nfrom petastorm.pytorch\
    \ import DataLoader\nwith DataLoader(Reader('dfs://some_dataset')) as train_loader:\n\
    \    sample = next(iter(train_loader))\n```"
  merge: -1
  img_proc: true
