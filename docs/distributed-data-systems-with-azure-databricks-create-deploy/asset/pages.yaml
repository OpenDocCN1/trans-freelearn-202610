- pgno: 300
  md: 'The TFRecord file format optimizes our training pipelines when working with
    large amounts of data that need to be processed using parallel or distributed
    methods. As shown in this section, we can use native tools of TensorFlow to manipulate
    TFRecord files to leverage the advantages of distributed computing systems such
    as Azure Databricks. In the next section, we will introduce Petastorm, a library
    to enable the use of Parquet files as training data for machine and deep learning
    applications.


    # Using Petastorm for distributed learning


    Petastorm is an open source library that allows us to do single or distributed
    training of machine and deep learning algorithms using datasets stored as Apache
    Parquet files. It supports popular frameworks such as PyTorch, TensorFlow, and
    PySpark and can also be used for other Python applications. Petastorm provides
    us with a simple function to augment the functionality of the Parquet format with
    Petastorm-specific data to be able to be used in machine and deep learning model
    training. We can simply read our data by creating a reader object from Databricks
    File System and iterating over it. The underlying Petastorm library uses the PyArrow
    library to read Parquet files.


    In this section, we will discuss how we can use Petastorm to further extend the
    performance of our machine and deep learning training pipelines in Azure Databricks.


    # Introducing Petastorm


    As mentioned before, Petastorm is an open source library that enables a single
    machine or distributed training and evaluation of machine and deep learning models
    using data stored in Apache Parquet format as well as data already loaded in Spark
    DataFrames. This library supports popular data science frameworks such as TensorFlow,
    PyTorch, and PySpark. Petastorm is the best choice when we need to train machine
    and deep learning models using data stored in Parquet format.


    The Petastorm library has various features such as optimized data sharing, data
    partitioning, shuffling and row filtering, and support for time series using n-grams.


    N-grams are used when the temporal context is required for models that make use
    of observed environment variables to better understand the environment and predict
    future events in that environment.


    Petastorm can provide this temporal context when the input data is a time series.
    When an n-gram is requested from the Petastorm Reader object, sequential rows
    will be merged into a single training sample to provide the temporal context while
    keeping the data structured.'
  merge: -1
  img_proc: true
- pgno: 301
  md: "When loading data using Petastorm, we have two available options to parallelize\
    \ the data loading and decoding operations:\n\n+   - **Thread pool**: This implementation\
    \ is used when the observations are encoded data or high-resolution images. When\
    \ this mode is selected, most of the processing time is spent decoding the images\
    \ through C++ code with almost no Python code.\n+   - **Process pool**: This implementation\
    \ is appropriate when row sizes are small. When this mode is selected, most decoding\
    \ is done using only Python code in more than one process running in parallel.\n\
    \nThe options selected for parallelizing the data loading and decoding operations\
    \ will depend on the kind of data you want to read.\n\nAs we have introduced in\
    \ this section, Petastorm is an open source library that helps us leverage the\
    \ efficiency of the Parquet file format and allows us to use it to train deep\
    \ learning models in a distributed manner. In the next sections, we will learn\
    \ how to use Petastorm to create a dataset and use it to prepare image data to\
    \ train our deep learning models in the Azure Databricks Machine Learning Runtime.\n\
    \n# Generating a dataset\n\nSimilarly, as we do for other dataset file formats,\
    \ when we want to generate a dataset using Petastorm, we need to first define\
    \ a data schema, which is named Unischema. This is the only time that we need\
    \ to do this as Petastorm will then broadcast this to all supported frameworks,\
    \ such as PySpark, TensorFlow, and pure Python.\n\nThe defined Unischema is serialized\
    \ as a custom field in the Parquet store metadata, therefore it can be read by\
    \ just specifying the path to the dataset.\n\nThe following example shows how\
    \ we can create a Unischema instance that will be used to define the schema of\
    \ our dataset. To properly define the schema, the required parameters to be passed\
    \ in the field properties are the field name, the data type represented as a NumPy\
    \ data type, the shape of the array, the codec that will be used to encode and\
    \ decode the data, and whether a field is nullable or not:\n\n```\nfirst_schema\
    \ = Unischema('first_schema', [\n    UnischemaField('id', np.int32, (),\n    ScalarCodec(IntegerType()),\
    \ False),\n    UnischemaField('image1', np.uint8, (128, 256, 3)\n    CompressedImageCodec('png'),\
    \ False),\n```"
  merge: -1
  img_proc: true
- pgno: 302
  md: "```\nUnischemaField('array_4d', np.uint8, (None, 128, 30, None), Ndar rayCodec(),\
    \ False),\n]\n```\n\nWe use can also use the PySpark API to write the Petastorm\
    \ dataset. The following code example demonstrates how we can create a 10-row\
    \ dataset using Petastorm and the previously defined data schema:\n\n```\nrows_count\
    \ = 10\nwith materialize_dataset(spark, output_url, 'first_schema', rowgroup_size_mb):\n\
    \    rows_rdd = sc.parallelize(range(rows_count))\\\n    .map(row_generator)\\\
    \n    .map(lambda x: dict_to_spark_row(first_schema', x))\n    spark.createDataFrame(rows_rdd,\n\
    \                          first_schema'.as_spark_schema()) \\\n    .write \\\n\
    \    .parquet('file:///tmp/example_dataset')\n```\n\nLet's explain a bit more\
    \ about what is going on in this example. materialize_dataset is the context manager,\
    \ and it will take care of all the necessary configurations based on the specified\
    \ data schema and finally write out the Petastorm-specific metadata. The output\
    \ file path could point either locally or to a location in Databricks File System.\
    \ rowgroup_size_mb defines the target size of the Parquet row group in megabytes\
    \ and row_generator is a function that returns a Python dictionary matching the\
    \ specified data schema. The dict_to_spark_row will validate the data types according\
    \ to the specified schema and convert the dictionary into a pyspark.Row object.\n\
    \nWe can load data from Spark DataFrames using Petastorm using the Petastorm Spark\
    \ converter API, which enables us to convert Spark DataFrames to TensorFlow or\
    \ PyTorch formats. This is done by first writing the input Spark DataFrame into\
    \ a Parquet file that then can be loaded either using the tf.data.Dataset or torch.utils.data.DataLoader.\n\
    \nWhen we are distributed training deep learning models, the recommended workflow\
    \ is to load and process the data in Azure Databricks, using the Petastorm spark_dataset_converter\
    \ method to convert data from a Spark DataFrame to a TensorFlow dataset or a PyTorch\
    \ DataLoader, and finally using it to train our deep learning model."
