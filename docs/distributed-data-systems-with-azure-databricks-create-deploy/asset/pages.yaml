- pgno: 177
  md: '# 6

    Introducing

    Structured

    Streaming


    Many organizations have a need to consume large amounts of data continuously in
    their everyday processes. Therefore, in order to be able to extract insights and
    use the data, we need to be able to process this information as it arrives, resulting
    in a need for continuous data ingestion processes. These continuous applications
    create a need to overcome challenges such as creating a reliable process that
    ensures the correctness of the data, despite possible failures such as traffic
    spikes, data not arriving in time, upstream failures, and so on, which are common
    when working with continuously incoming data or transforming data without consistent
    file formats that have different structure levels or need to be aggregated before
    being used.


    The most traditional way of dealing with these issues was to work with batches
    of data executed in periodic tasks, which processed raw streams and data and stored
    them into more efficient formats to allow queries on the data, a process that
    might incur high latency.'
  merge: -1
  img_proc: true
- pgno: 178
  md: 'In this chapter, we will learn about Structured Streaming, which is the Apache
    Spark **application programming interface (API)** that allows us to make computations
    on streaming data in the same way you would express a batch computation on static
    data. Structured Streaming is a fault-tolerant engine that allows us to perform
    optimized operations for low-latency **Structured Query Language (SQL)**-like
    queries on the data thanks to the use of Spark SQL, while ensuring data consistency.


    We can use Structured Streaming when creating ETL pipelines that will allow us
    to filter, transform, and clean data as it comes in a raw structure, formatting
    data types into more efficient storage formats, applying efficient partition strategies
    based on relevant columns, and so on. Specifically, in this chapter, we will look
    at the following topics:


    +   - Using the Structured Streaming API

    +   - Using different sources available in Azure Databricks when dealing with
    continuous streams of data

    +   - Recovering from query failures

    +   - Optimizing streaming queries

    +   - Triggering streaming query executions

    +   - Visualizing data on streaming dataframes

    +   - Example on Structured Streaming


    Without further ado, we will start our discussion by talking about Structured
    Streaming models and how can we leverage their architecture to improve performance
    when working with streams of data.


    # Technical requirements


    This chapter will require you to have an Azure Databricks subscription available
    to work on the examples, as well as a notebook attached to a running cluster.


    Let''s start by looking into Structured Streaming models in more detail to find
    out which alternatives are available to work with streams of data in Azure Databricks.'
  merge: -1
  img_proc: true
- pgno: 179
  md: '# Structured Streaming model


    A Structured Streaming model is based on a simple but powerful premise: any query
    executed on the data will yield the same results as a batch job at a given time.
    This model ensures consistency and reliability by processing data as it arrives
    in the data lake, within the engine, and when working with external systems.


    As seen before in the previous chapters, to use Structured Streaming we just need
    to use Spark dataframes and the API, stating which are the I/O locations.


    Structured Streaming models work by treating all new data that arrives as a new
    row appended to an unbound table, thereby giving us the opportunity to run batch
    jobs on data as if all the input were being retained, without having to do so.
    We then can query the streaming data as a static table and output the result to
    a data sink.


    Structured Streaming is able to do this, thanks to a feature called **Incrementalization**,
    which plans a streaming execution every time that we run a query. This also helps
    to figure out which states need to remain updated every time new data arrives.


    We define when the tables will be updated using specific triggers when using Structured
    Streaming dataframes. Each time a trigger is activated, Azure Databricks will
    update the table incrementally by creating new rows for each file that arrives
    in our data source.


    Finally, the last part to be defined are the output modes. These modes allow us
    to determine how to write incrementally to external systems such as **Simple Storage
    Service (S3)** or a database in three different ways, outlined as follows:


    +   - **Append mode**: Only new rows are appended. This mode doesn''t allow changes
    to existing rows.

    +   - **Complete mode**: The entire table is rewritten to the external storage
    every time there is an update.

    +   - **Update mode**: Only rows that have changed since the last trigger are
    written to the external storage, which allows in-place updates such as SQL tables.


    Structured Streaming output tables provide consistent results based on a sequential
    stream, and failure tolerance is also ensured when working with output sinks.
    Using the Complete output mode, for example, out-of-order data will be handled
    by updating the records in a SQL table. We can establish a threshold to avoid
    overly old data updating a table.'
  merge: -1
  img_proc: true
- pgno: 180
  md: 'Structured Streaming is a fault-tolerant system that allows queries to be run
    incrementally on streaming data, as explained in the following examples:


    +   - For example, if we want to read JavaScript Object Notation (JSON) files
    that arrive continuously at an S3 location, we write the following code:

    +   ```

    +   input_df = spark.readStream.json("s3://datalogs")

    +   ```

    +   - We can operate on the Spark dataframe and do time-based aggregations to
    finally write to a SQL database, as follows:

    +   ```

    +   input_df.groupBy($"message", window("update_time", "1 hour")).count()

    +   .writeStream.format("jdbc").start(jdbc_conn_string)

    +   ```

    +   - If we run this as a batch operation, the only changes will be about how
    we write and read the data. For example, to read the data just once, run the following
    code:

    +   ```

    +   input_df = spark.read.json("s3://datalogs")

    +   ```

    +   - Then, we can do operations using the standard Spark DataFrame API and write
    to a SQL database, as illustrated in the following code snippet:

    +   ```

    +   inputDF.groupBy("message", window("update_time", "1 hour")).count()

    +   .writeStream.format("jdbc").save(jdbc_conn_string)

    +   ```


    In the next section, we will see in detail how to use the Structured Streaming
    API in more detail, including how to perform interactive queries and windowed
    aggregations, and we will discuss mapping and filtering operations.


    # Using the Structured Streaming API


    Structured Streaming is integrated into the PySpark API and embedded in the Spark
    DataFrame API. It provides ease of use when working with streaming data and, in
    most cases, it requires very small changes to migrate from a computation on static
    data to a streaming computation. It provides features to perform windowed aggregation
    and for setting the parameters of the execution model.'
  merge: -1
  img_proc: true
- pgno: 181
  md: 'As we have discussed in previous chapters, in Azure Databricks, streams of
    data are represented as Spark dataframes. We can verify that the data frame is
    a stream of data by checking that the `isStreaming` property of the data frame
    is set as `true`. In order to operate with Structured Streaming, we can summarize
    the steps as read, process, and write, as exemplified here:


    +   1. We can read streams of data that are being dumped in, for example, an S3
    bucket. The following example code shows how we can use the `readStream` method,
    specifying that we are reading a **comma-separated values (CSV)** file stored
    in the S3 **Uniform Resource Interface (URI)** passed:

    +   2. Now, you can use the usual data frame operations to transform the data
    as if it were static. For example, if we want to count action types of each hour,
    we can do this by grouping the data by `message` and 1-hour windows of time, as
    illustrated in the following code snippet:

    +   3. Finally, we write this table to a sink and start the streaming computation
    by creating a connection to a SQL database using a **Java Database Connectivity
    (JDBC)** connection string, as illustrated in the following code snippet:


    ```

    input_df=spark.readStream.csv("s3://data_stream_uri")

    ```


    The resulting PySpark dataframe, `input_df`, will be the input table, continuously
    extended with new rows as new files arrive in the input directory. We will suppose
    that this table has two columns—`update_time` and `message`.


    ```

    counts_df = input_df.groupBy($"message", window($"update_time", "1 hour")).count()

    ```


    The new dataframe, `counts_df`, is our result table, which has message, window,
    and counts columns, and will be continuously updated when the query is started.
    Note that this operation will yield the resulting hourly counts even if `input_df`
    is a static table. This is a feature that provides a safe environment to test
    a business logic on static datasets and seamlessly migrate into streaming data
    without changing the logic.


    ```

    final_query = counts_df.writeStream.format("jdbc").start("jdbc://...")

    ```


    The returned query is a `StreamingQuery` query, which is a handle to the active
    streaming execution running in the background. It can later be used to manage
    and monitor the execution of our streaming query. Beyond these basics, there are
    many more operations that can be done in Structured Streaming.'
  merge: -1
  img_proc: true
- pgno: 182
  md: '# Mapping, filtering, and running aggregations


    Structured Streaming allows the use of mapping, filtering, selection, and other
    methods to transform data. In the previous example, we used one of these features:
    time-based aggregations on data through the Spark API. As we have seen in our
    previous example, aggregations such as windowing can be expressed as a simple
    group by operations on a data frame. The use of such operations will be exemplified
    in the next section, but it is good to remember that Structured Streaming allows
    us to perform mapping, filtering, and other data-wrangling methods in the same
    way as with a common PySpark dataframe.


    In the next section, we will see some examples of how these operations are performed
    using Structured Streaming.


    # Windowed aggregations on event time


    When working with data that has a temporal dimension, compute operations often
    need to be windowed to certain periods of time, which in cases such as sliding
    windows overlap with each other. For example, we might need to perform operations
    over a window of 1 hour that slides forward every 5 minutes.


    Windows are specified using the window function in a PySpark dataframe. For example,
    change to a sliding window approach (shown in the example previously given in
    the Structured Streaming model section) by doing the following:


    ```

    input_df.groupBy("message", window("update_time", "1 hour", "5 minutes")).count()

    ```


    In the way our previous example was structured, the resulting information was
    formatted as (hour, message, count); now, it will have the form (window, message,
    count). Out-of-order data arriving late will be processed and the results will
    be updated accordingly, and if we are using an external data sink in Complete
    mode, the data will be updated there as well.'
  merge: -1
  img_proc: true
- pgno: 183
  md: '# Merging streaming and static data


    As we have mentioned before, working with Structured Streaming means working with
    Spark data frames, which is straightforward and allows us to use streaming and
    static data in combination. For example, if we have a table named users and we
    want to append it to a streaming data frame we can do the following, where we
    bring in a table called users and append it to our input_df dataframe:


    ```

    users_df = spark.table("users")

    input_df.join(users_df, "user_id").groupBy("user_name", hour("time")).count()

    ```


    We could also create this static data frame using a query and run it in the same
    batch and streaming operations.


    # Interactive queries


    In Structured Streaming, we can make use of the results from computations directly
    to interactive queries using the Spark JDBC server. There is an option to use
    a small memory sink designed for small amounts of data, whereby we can write results
    to a SQL table and then query the data in it. For example, we can create a table
    named message_counts that can be used as a small data sink that we can later query.


    We do this by creating an in-memory table, as follows:


    ```

    message_counts.writeStream.format("memory")

    .queryName("user_counts")

    .outputMode("complete")

    .start()

    ```


    And then, we use a SQL statement to query it, like this:


    ```

    %sql

    select sum(count) from message_counts where message=''warning''

    ```


    In the next section, we will discuss all the different sources from where we can
    read stream data.'
  merge: -1
  img_proc: true
- pgno: 184
  md: '# Using different sources with continous streams


    Streams of data can come from a variety of sources. Structured Streaming provides
    support from extracting data from sources such as Delta tables, publish/subscribe
    (pub/sub) systems such as Azure Event Hubs, and more. We will review some of these
    sources in the next sections to learn how we can connect these streams of data
    into our jobs running in Azure Databricks.


    # Using a Delta table as a stream source


    As mentioned in the previous chapter, you can use Structured Streaming with Delta
    Lake using the readStream and writeStream Spark methods, with a particular focus
    on overcoming issues related to handling and processing small files, managing
    batch jobs, and detecting new files efficiently.


    When a Delta table is used as a data stream source, all the queries done on that
    table will process the information on that table as well as any data that has
    arrived since the stream started.


    In the next example, we will load both the path and the tables into a dataframe,
    as follows:


    ```

    df = spark.readStream.format("delta").load("/mnt/delta/data_events")

    ```


    Or, we can do the same by referencing the Delta table, as follows:


    ```

    df = spark.readStream.format("delta").table(''data_events'')

    ```


    One of the features of Structured Streaming in Delta Lake is that we can control
    the maximum number of new files to be considered every time a trigger is activated.
    We can control this by setting the maxFilesPerTrigger option to the desired number
    of files to be considered. Another option to set is the rate limit on how much
    data gets to be processed in every micro-batch. This is controlled by using the
    maxBytesPerTrigger option, which controls the number of bytes processed each time
    the trigger is activated. The number of bytes to be processed will approximately
    match the number specified in this option, but it can slightly surpass this limit.'
  merge: -1
  img_proc: true
- pgno: 185
  md: "One thing to mention is that Structured Streaming will fail if we attempt to\
    \ append a column or modify the schema of a Delta table that is being used as\
    \ the source. If changes need to be introduced, we can approach this in two different\
    \ ways, outlined as follows:\n\n+   - After the changes are made, we can delete\
    \ the output and checkpoint and restart the stream from the start.\n+   - We can\
    \ use the `ignoreDeletes` option to ignore operations that causes the deletion\
    \ of data, or `ignoreChanges` so that the stream doesn't get interrupted by deletions\
    \ or updates in the source table.\n\nFor example, suppose that we have a table\
    \ named `user_messages` from where we stream out data that contains date, `user_email`,\
    \ and message columns partitioned by date. If we need to delete data at partition\
    \ boundaries, which means deleting using a `WHERE` clause on the partition column,\
    \ the files are already segmented by that column. Therefore, the delete operation\
    \ will just remove those files from the metadata.\n\nSo, if you just want to delete\
    \ data using a `WHERE` clause on a partition column, you can use the `ignoreDeletes`\
    \ option to avoid having your stream disrupted, as illustrated in the following\
    \ code snippet:\n\n```\ndata_events.readStream\n  .format(\"delta\").option(\"\
    ignoreDeletes\", \"true\")\n  .load(\"/mnt/delta/user_messages\")\n```\n\nHowever,\
    \ if you have to delete data based on the `user_email` column, then you will need\
    \ to use the following code:\n\n```\ndata_events.readStream\n  .format(\"delta\"\
    ).option(\"ignoreChanges\", \"true\")\n  .load(\"/mnt/delta/user_messages\")\n\
    ```\n\nIf you update a `user_email` variable with an UPDATE statement, the file\
    \ that contains that record will be rewritten. If the `ignoreChanges` option is\
    \ set to true, this file will be processed again, inserting the new record and\
    \ other already processed records into the same file, producing duplicates downstream.\
    \ Thus, it is recommended to implement some logic to handle these incoming duplicate\
    \ records.\n\nIn order to specify a starting point of the Delta Lake streaming\
    \ source without processing the entire table, we can use the following options:\n\
    \n+   - `startingVersion`: The Delta Lake version to start from\n+   - `startingTimestamp`:\
    \ The timestamp to start from"
  merge: -1
  img_proc: true
- pgno: 186
  md: "We can choose between these two options but not use both at the same time.\
    \ Also, the changes made by setting this option will only take place once a new\
    \ stream has been started. If the stream was already running and a checkpoint\
    \ was written, these options would be ignored:\n\n+   For example, suppose you\
    \ have a user_messages table. If you want to read changes since version 10, you\
    \ can use the following code:\n\n```\ndata_events.readStream\n  .format(\"delta\"\
    ).option(\"startingVersion\", \"10\")\n  .load(\"/mnt/delta/user_messages\")\n\
    ```\n\n+   If you want to read changes since 2020-10-15, you can use the following\
    \ code:\n\n```\ndata_events.readStream\n  .format(\"delta\").option(\"startingTimestamp\"\
    , \"2020-10-15\")\n  .load(\"/mnt/delta/user_messages\")\n```\n\nKeep in mind\
    \ that if you set the starting point using one of these options, the schema of\
    \ the table will still be the latest one of the Delta table, so we must avoid\
    \ creating a change that makes the schema incompatible. Otherwise, the streaming\
    \ source will either yield incorrect results or fail when reading the data.\n\n\
