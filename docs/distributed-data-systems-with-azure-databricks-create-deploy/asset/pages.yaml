- pgno: 221
  md: '# Notebook-scoped Python libraries


    We can specify libraries to be installed at the notebook level if we don''t want
    to affect all the notebooks attached to a cluster by installing, for example,
    a custom or untested library to it. Notebook-scoped allows you to manage and share
    custom Python environments running in a specific notebook. When we install a library
    at the notebook level, we only affect the notebook and any jobs associated with
    it, which will be the only ones able to access that library, and therefore, other
    notebooks attached to the same cluster will not be affected.


    All notebook-scoped libraries do not persist across sessions and must be reinstalled
    at the beginning of each session or when the notebook is disconnected from the
    computing cluster.


    There are three methods for installing notebook-scoped libraries:


    +   - Run the `%pip` magic command in a notebook. The `%pip` command is supported
    on all versions of Databricks Runtime from 7.1 and above.

    +   - The `%conda` command, which is only supported, on Databricks Runtime 6.4
    ML and above and Databricks Runtime 6.4 for Genomics and above.

    +   - We can use Databricks **Library** utilities, which allow us to install Python
    libraries and create an environment scoped to a notebook session, available both
    on the driver and on the executors. The **Library** utilities are supported only
    on Databricks Runtime, not Databricks Runtime ML or Databricks Runtime for Genomics.


    One important thing to stress is that the `%conda` magic commands are not available
    on Databricks Runtime. They are only available on Databricks Runtime ML and Databricks
    Runtime for Genomics. In these environments, we can use `%conda` in the same way
    as other Python environments, except for the following conda commands, which are
    not supported:


    +   - `activate`

    +   - `create`

    +   - `init`

    +   - `run`

    +   - `env create`

    +   - `env remove`'
  merge: -1
  img_proc: true
- pgno: 222
  md: 'Using %conda allows us to save, reuse, or share an environment. The environment
    is lost every time that a notebook is detached from a cluster, but we can use
    %conda to save it to be used or shared later on. Databricks recommends that these
    environments are executed in clusters running the same version of Databricks.
    We can save the environment as a conda YAML specification:


    ```

    %conda env export -f /dbfs/sub_dir/my_env.yml

    ```


    Import the file to another notebook using conda env update:


    ```

    %conda env update -f dbfs/sub_dir/my_env.yml

    ```


    While in Databricks Runtime 6.4 ML and above and Databricks Runtime 6.4 for Genomics,
    we can use %pip and %conda indistinctly; using them in combination can cause interactions
    between commands. To avoid conflicts, it is important to keep the next statements
    in mind when working with %pip and %conda:


    +   - If you have installed libraries using the API or the cluster UI, you should
    use only %pip commands when installing libraries at the notebook level.

    +   - If you use notebook-scoped libraries on a cluster, init scripts running
    on the cluster to which the notebook is attached can use either conda or pip commands
    to install libraries. However, if the init script uses pip commands, you should
    only use %pip commands in notebooks and not %conda to keep consistency across
    versions.

    +   - It''s always best to pick either pip commands or conda commands to manage
    libraries and not a combination of both.


    Because our focus is on Databricks Runtime, we will focus on using %pip as the
    default method to manage libraries at the notebook level.


    When we install libraries at the notebook level, the driver node in our cluster
    still needs to install these libraries across nodes. Therefore, using notebook-scoped
    libraries will create more traffic between driver and nodes, as the driver tries
    to keep the environment consistent across executor nodes. When working with clusters
    that have more than 10 nodes, the minimum specifications recommended by Databricks
    for the driver node to keep up with the orchestration are as follows:


    +   - Use Lsv2 storage-optimized instance types when using a 100-node CPU cluster.

    +   - Use accelerated compute and high-performance instance types such as NC or
    NV for a 10-node GPU cluster.

    +   - For larger clusters, use a driver node with larger processing specifications.'
