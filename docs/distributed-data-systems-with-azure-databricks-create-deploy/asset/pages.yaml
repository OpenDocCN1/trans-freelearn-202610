    # Auto Loader


    Auto Loader is an Azure Databricks feature used to incrementally process data
    as it arrives at Azure Blob storage, Azure Data Lake Storage Gen1, or Azure Data
    Lake Storage Gen2. It provides a Structured Streaming source named cloudFiles
    that, when given an input directory path on the cloud file storage, automatically
    processes files as they arrive in it, with the added option of also processing
    existing files in that directory.


    Auto Loader uses two modes for detecting files as they arrive at the storage point,
    outlined as follows:


    +   - **Directory listing**: This lists all files into the input directory. It
    might become too slow when the number of files in the storage grows too large.

    +   - **File notification**: This creates an Azure Event Hubs notification service
    to detect new files when they arrive in the input directory. This is a more scalable
    solution for large input directories.


    The file detection mode can be changed when the stream is restarted. For example,
    if the Directory listing mode starts to slow down, we can change it to File notification.
    On both modes, Auto Loader will keep track of the files to guarantee that these
    are processed only once.


    The cloudFiles option can be set in the same way as for other streaming sources,
    as follows:


    ```

    df = spark.readStream.format("cloudFiles") \

    .option(<cloudFiles-option>, <option-value>) \

    .schema(<schema>).load(<input-path>)

    ```'
