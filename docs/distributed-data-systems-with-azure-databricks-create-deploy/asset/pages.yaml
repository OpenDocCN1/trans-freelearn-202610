    \ value, which in this case has been set to 5000:\n\n```\nks.set_option('compute.shortcut_limit',\
    \ 5000)\n```\n\nWe can make line charts using the plot.line function:\n\n```\n\
    koalas_df = ks.DataFrame({'val1: [15, 18, 489, 675, 1776],\\\n    'val2': [4,\
    \ 25, 181, 600, 1900]},\\\n    index=[1, 2, 3, 4, 5])\nkoalas_df.plot.line()\n\
    ```\n\nWe can set the proportion of data being plotted using the plotting.sample_ratio\
