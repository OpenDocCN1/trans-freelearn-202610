    \    .option(\"kafka.ssl.keystore.password\", dbutils.secrets.get(scope=<certificate-scope-name>,key=<keystore-password-key-name>))\n\
    \    .option(\"kafka.ssl.truststore.password\", dbutils.secrets.get(scope=<certificate-scope-name>,key=<truststore-password-key-name>))\n\
