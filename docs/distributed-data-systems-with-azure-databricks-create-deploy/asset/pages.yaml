    the managed resource group and any other deployed resource will be deleted too.


    # Reviewing deployed resources


    You can check that the Azure Databricks workspace has been successfully deployed
    in the Azure portal, or use the following Azure CLI script to list the resource:


    ```

    echo "Enter your Azure Databricks workspace name:" &&

    read databricksWorkspaceName &&

    echo "Enter the resource group where the Azure Databricks workspace exists:" &&

    read resourcegroupName &&

    az databricks workspace show -g $resourcegroupName -n $databricksWorkspaceName

    ```


    # Cleaning up resources


    If you are following these as a tutorial and you are not planning to use the resources
    created previously, you can delete them using the next Azure CLI script:


    ```

    echo "Enter the Resource Group name:" &&

    read resourceGroupName &&

    az group delete --name $resourceGroupName &&

    echo "Press [ENTER] to continue ..."

    ```


    Let''s talk a little bit more about the Azure CLI. It''s a tool that we can use
    to interact with our resources in Azure Databricks. In the next section, we will
    describe in more detail how we can use it to manage our workspace assets.


    # Setting up the Azure Databricks CLI


    Azure Databricks comes with a CLI tool that allows us to manage our resources.
    It''s built on top of the Azure Databricks API and allows you to access the workspace,
    jobs, clusters, libraries, and more. This is an open source project hosted on
    GitHub.'
