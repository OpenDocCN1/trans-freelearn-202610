- pgno: 61
  md: '+   - Pool: This is the number of standby compute machines ready and waiting
    to be used if the computing needs increase during the process. It reduces spin-up
    time for the cluster.

    +   - Databricks Runtime Version: The version of Scala or Spark running in the
    cluster. Most available options now just allow Python 3.

    +   - Autopilot Options: Enables autoscaling of the resource up and down and terminates
