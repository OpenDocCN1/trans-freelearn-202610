- pgno: 136
  md: 'In this section, we''ve learned how to use historical data to replace faulty
    data and roll back any changes that have been wrongfully made to Delta tables.


    In the next section, we will learn how to automatically run validations and adapt
    to the schema of the data that''s used in the Delta tables.


    # Schema validation


    Changes in the schema of data can cause lots of problems, but they are also inevitable
    in cases where information has to be adapted to fit a new set of business rules,
    when tables need to be updated, and when improvements need to be introduced. Thankfully,
    Delta Lake has an adaptive schema evolution that works in combination with schema
    enforcement to fit and adapt to changes in the schema.


    We can explicitly set this option to act by using the mergeSchema option when
    writing to a table. In the following example, we''re doing this with the data
    DataFrame, which will be saved to Delta Lake:


    ```

    data.write.option("mergeSchema","true"). \

    format("delta").mode("append").save(data_lake_path)

    ```


    This option will cause every column that is present in the data but not in the
    specified Delta table to be added to the existing table. This is a good option
    when we don''t want our ETL to break in production when we know that changes will
    be made in the future.


    Delta Lake automatically checks that the schema of the data we are trying to insert
    into a table matches the schema of that table. This is done by following a set
    of rules, which are as follows:


    +   - All of the columns in the DataFrame we are trying to insert exist in the
    table and have the same data types; otherwise, this will raise an exception.

    +   - If we are using the partitionBy option while appending the data, it will
    be compared with the existing data and if any differences arise, it will exit
    with an error. Otherwise, if partitionBy is not being used, the data will be appended.

    +   - The columns that don''t exist in the data we are trying to insert are filled
    with null values.

    +   - Column naming is case sensitive.


    As we mentioned previously, if you want to update a table, you can do this by
    using the overwriteSchema option. This option allows you to change a column data
    type or drop a column, which, in turn, will require you to rewrite the table.'
  merge: -1
