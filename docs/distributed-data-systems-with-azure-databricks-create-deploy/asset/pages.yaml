    .option("path", output_path)

    .option("checkpointLocation", checkpoint_path)

    .start()

    ```


    This checkpoint location preserves all information about a query. Therefore, all
    queries must have a unique checkpoint path.


    We face limitations on the possible changes in a streaming query that are allowed
    between restarts using the same checkpoint path.


    By saying that an operation is allowed, it is understood that we can implement
    the change, but whether the semantics or its effects will be as desired will depend
    on the query and the specific change applied.


    The term not allowed means the change will likely fail when the query is restarted.


    Here is a summary of the types of changes we can make:


    +   - We are not allowed to change the number or type of input sources.

    +   - If we can change parameters of input sources, this will depend on the source
    and query.

    +   - Some changes in the type of output sink are allowed.

    +   - If we can make changes to the parameters of the output sink, this will depend
    on the type of sink and query.

    +   - Some changes are allowed on operations, such as map and filter operations.

    +   - Changes in stateful operations can lead to failure due to changes in the
    schema of state data needed to update the result.


    As we can see, Structured Streaming provides several features in order to provide
    fault tolerance for production-grade processing of streams of data.


    In the next section, we will gain knowledge on how we can optimize the performance
    of our streaming queries.'
