    We can view the MLflow experiment by clicking on the experiment icon in the top
    right of the notebook. This option will display all the results that were obtained
    during the runs and, as we mentioned previously, allow us to visualize the set
    of hyperparameters and algorithms that yielded the best results. We can also examine
