  md: 'In the next section, we will briefly see how we can make SQL queries using
    the Koalas API.


    # Using SQL in Koalas


    One of the features of Spark DataFrames is that we can query the data in many
    ways, one of them being using SQL queries to fetch data from tables.


    This feature also extends to Koalas DataFrames, where we can make SQL queries
    using the Koalas API, which supports standard SQL syntax using ks.sql. The query
    returns the result as a Koalas DataFrame:


    ```

    koalas_df = ks.DataFrame({''year'': [2010, 2011, 2012, 2013, 2014],

    ''c1'': [15, 24, 689, 575, 1376],

    ''c2'': [4, 27, 311, 720, 1650]})

    ks.sql("SELECT * FROM { koalas_df } WHERE c1 > 100")

    ```


    Using SQL statements to query the data is a feature that acts as a bridge between
    data scientists used to pandas DataFrames and data engineers or business intelligence
    analysts who commonly use SQL to query data.


    The next section will show how we can transform Koalas DataFrames into Spark DataFrames
    seamlessly.


    # Working with PySpark


    You can apply several PySpark features such as the Spark UI, the history server,
    and so on in Koalas DataFrames, mostly because Koalas is built on top of PySpark.
    For example, we can easily convert Koalas DataFrames from and to PySpark DataFrames
    using the Koalas DataFrame to_spark method, which is like the to_pandas method.
    In turn, a PySpark DataFrame can be converted into a Koalas DataFrame using the
    PySpark DataFrame to_koalas method, which is an extension of the Spark DataFrame
    class:


    ```

    koalas_df = ks.DataFrame({''c1'': [1, 2, 3, 4, 5],

    ''c2'': [10, 20, 30, 40, 50]})

    spark_df = koalas_df.to_spark()

    type(spark_df)

    spark_df.show()

    ```'
  merge: -1
  img_proc: true
- pgno: 238
  md: "It is important to notice when converting a PySpark Data Frame to Koalas that\
    \ this operation can cause an out-of-memory error when the default index type\
    \ is a sequence. The default index type can be managed using the compute.default_index_type\
    \ Koalas option, which by default is set to sequence. If we are dealing with indexes\
    \ that are the sequence of a large dataset, we should use distributed-sequence:\n\
    \n```\nfrom databricks.koalas import option_context\nwith option_context(\"compute.default_index_type\"\
    , \"distributed-sequence\"):\n    koalas_df = spark_df.to_koalas()\n```\n\nPySpark\
    \ DataFrames do not have indices while Koalas DataFrames do. Therefore, converting\
    \ a PySpark DataFrame into a Koalas DataFrame requires creating new indexes, an\
    \ operation that could cause some overhead. We can avoid this issue by specifying\
    \ the column that can be used as an index column, as in the next example:\n\n\
    ```\nspark_df.to_koalas(index_col='c1')\n```\n\nWe can also take advantage of\
    \ the PySpark caching feature, which is also available in Koalas as well. We can\
    \ use this option in order to store the results of the Koalas operations and not\
    \ have to run computations more than once, which can improve the performance of\
    \ operations where outputs need to be accessed frequently. The cache option is\
    \ applied to a Koalas DataFrame in the following way:\n\n```\nkoalas_df.cache()\n\
    ```\n\nAll of the examples presented in this section about Koalas focus on the\
    \ ease of use when migrating from pandas into distributed computing in Azure Databricks\
    \ and lack enough depth to explain all the available features, so it is always\
    \ good to take a look at the official Koalas API documentation to keep up to date\
    \ with all the available features.\n\nIn the next section of this chapter, we\
    \ will learn the basics and possibilities to visualize our data in Azure Databricks\
    \ using common Python libraries such as Bokeh, Matplotlib, and Plotly.\n\n# Visualizing\
    \ data\n\nWe can use popular Python libraries such as Bokeh, Matplotlib, and Plotly\
    \ to make visualizations in Azure Databricks. In this section, we will learn how\
    \ we can use these libraries in Azure Databricks and how we can make use of notebook\
    \ features to work with these visualizations."
