- pgno: 325
  md: "b) maxBins: This parameter determines the number of bins that will be generated\
    \ to discretize the continuous features into a finite set of numbers. It is a\
    \ parameter that trains the model in a more efficient way when the training is\
    \ done in a distributed computing environment. In this example, we will start\
