    %sql

    OPTIMIZE delta.`/delta/covid_delta/`

    WHERE province="Busan"

    ZORDER BY (date)

    ```


    Figure 5.5 – Applying ZORDER to a specific portion of data


    Columns that have many unique values, as well as columns used to filter by very
    frequently, are the most recommended columns to optimize by running ZORDER. We
    can also specify several columns by passing the column names, separated as parameters,
    to the ZORDER command.'
  merge: -1
