    # Recovering from query failures


    Failures can happen because of changes in the input data schema, changes along
    tables used in the computation, missing files, or due to many other root causes.
    When developing applications that make use of streams of data, it is necessary
    to have robust failure-handling methods. Structured Streaming guarantees that
    the results will remain valid even in the case of failure. To do this, it places
    two requirements on the input sources and output sinks, outlined as follows:


    +   - The input sources should be replayable, which means that recent data can
    be read again if the job fails.

    +   - The output sinks should allow transactional updates, meaning that these
    updates are atomic (while the update is running, the system should keep functioning)
    and can be rolled back.


    One of the previously mentioned features of Structured Streaming is checkpointing,
    which can be enabled for streaming queries. This also allows a stream to quickly
    recover from a failure by simply restarting the stream after a failure, which
    will cause the query to continue from where it was left off, while guaranteeing
    data consistency. So, it is always recommended to configure Enable Query Checkpointing
    and to configure Databricks Jobs to restart your queries automatically after a
    failure.


    To enable checkpointing, we can set the checkpointLocation option to the desired
    checkpoint path when writing the dataframe. An example of this is shown in the
    following code snippet:


    ```

    streaming_df.writeStream

    .format("parquet")

    ```'
