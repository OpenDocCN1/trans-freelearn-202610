- pgno: 291
  md: '# Using TFRecords for distributed learning


    Although it is still not such a commonly used component of TensorFlow, the TFRecord
    file format is TensorFlow''s own binary storage format used to store data for
    training our models. The binary format is an advantage when working with large
    datasets because it can significantly improve the performance of our processing
    and loading pipeline, which in turn reduces the required time to train our models.
    This binary data is more efficiently stored, occupies less space, and takes less
    time to read and write.


    The TFRecord format also allows us to take advantage of multiprocessing and distributed
    computing features of systems like Azure Databricks, which is commonly used when
    dealing with large amounts of data that are too big to be stored fully in memory.
    In these cases, when the amount of data is too big to be stored in memory, the
    binary format becomes especially useful as it reduces the memory footprint of
    the data and the time taken to process it, and then this process is done in batches.


    Another one of the features of TFRecord is that it is also optimized for storing
    sequential data such as time series or word embeddings, which is very useful in
    the case of sales trends or natural language processing applications.


    In the next sections, we will learn how we can structure TFRecords, how we use
    them to handle large amounts of data, and how we can optimize their loading process
    by specifying the schema inference, all of which allows us to efficiently train
    our models in Azure Databricks.


    # Structuring TFRecords files


    The TFRecord file format is a simple record-oriented binary format that was designed
    with the goal of more efficiently storing data for machine and deep learning model
    training. The TFRecordDataset class allows us to stream files in the TFRecord
    format as part of our training pipeline. These TFRecord files store the data as
    a sequence of binary strings, which makes it necessary to predefine the structure
    of the data before it can be read or written from a file. To specify the structure
    of the data, we can use either the tf.train.Example or the tf.train.SequenceExample
    TensorFlow class to store samples of data, after which you must serialize it,
    and then it can be written to disk using TFRecordWriter.


    One of the things that makes this library more optimized is that tf.train.Example
    is not a common Python class but a protocol buffer, which is a method to serialize
    structured data more efficiently.'
  merge: -1
  img_proc: true
- pgno: 292
  md: 'In Azure Databricks, we can use the `spark-tensorflow-connector` library to
    leverage the advantages of the TFRecord file format and use it to save Apache
    Spark DataFrames to TFRecord files. This library allows for the conversion of
    Spark data frames to TFRecords by simply using PySpark APIs and is installed by
    default in the Azure Databricks Machine Learning Runtime, which is a runtime that
    is optimized for machine and deep learning applications. If you are not using
    this version of the runtime, you will need to manually install the library from
    the Maven repository to the cluster or notebook as we have seen previously in
    other chapters.


    The `spark-tensorflow-connector` library enables us to read TFRecord files in
    distributed file systems such as Azure Databricks Spark data frames through the
    PySpark API. When we read our data, we can pass the following options to the parser:


    +   - **load**: It specifies the input path for the TFRecord file and, similar
    to Spark, it can accept standard globbing expressions.

    +   - **schema**: It is the schema of the TFRecord file. Optionally, we can define
    this schema using Spark `StructType`. If nothing is passed, the schema will be
    inferred from the TFRecord file.

    +   - **recordType**: This is the input format of the TFRecord file and accepts
    two possible options, which are `Example` and `SequenceExample`. The default option
    is `Example`.


    When we write a Spark Dataframe as a TFRecord file, we can pass the following
    options to the API:


    +   - **save**: This is the output path to where we will write the TFRecord file
    and can be either a local or distributed filesystem location.

    +   - **codec**: This is the codec that will be used to compress the TFRecord
    file. For example, if we specify the option `org.apache.hadoop.io.compress.GzipCodec`,
    it enables gzip compression. While reading compressed TFRecord files, the codec
    that was used to compress them can be inferred automatically, so this is not a
    required option.

    +   - **recordType**: This is the desired output format of the TFRecord file.
    Likewise, as when we read, the available options are `Example` and `SequenceExample`
    and the default option is `Example`.'
  merge: -1
  img_proc: true
- pgno: 293
  md: "+   - **writeLocality**: It will determine whether the TFRecord file will be\
    \ written locally on the workers or on a distributed filesystem. The possible\
    \ options are as follows:\n+     a) **distributed**: This is the default option\
    \ and determines that the file is written using Spark's default filesystem.\n\
    +     b) **local**: This option writes the file on the disks of each of the workers,\
    \ in a partitioned manner, writing a subset of data on each worker's local disk.\n\
    \nWhen we use the local mode, it will write the data onto each of the worker's\
    \ stores local disks a subset of the data. Which subset of data will be stored\
    \ on which worker will depend on how the data frame was partitioned. Later, these\
    \ subsets of data will be merged into a single TFRecord file and written on the\
    \ node where the partition lives. This is a feature that becomes useful when we\
    \ train our machine and deep learning algorithms in a distributed way, where each\
    \ worker receives a subset of data to train on. When the local mode is specified\
    \ as an option, the path given to the writer will be understood as the base path\
    \ on each of the workers where the subsets of data will be written.\n\n# Managing\
    \ data using TFRecords\n\nIn this section, we will demonstrate how to save image\
    \ data from Spark DataFrames to TFRecords and load it using TensorFlow in Azure\
