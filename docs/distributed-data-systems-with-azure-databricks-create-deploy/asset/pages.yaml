- pgno: 72
  md: '# Azure Resource Manager templates


    ARM templates are infrastructure as code and allow us to deploy resources automatically
    in an agile manner. These templates are JSON files that define infrastructure
    and configuration in a declarative way, specifying resources and properties. We
    can deploy several resources as a single resource, and modify existing configurations.
    Just like code, it can be stored in a repository and versioned, and anyone can
    run the code to deploy similar environments.


    ARM templates are then passed to the ARM API, which deploys the specified resources.
    These can include virtual networks, VMs, or an Azure Databricks workspace.


    These templates have two modes of operation, which are Complete or Incremental
    mode. When we deploy in Complete mode, this deletes any objects that are not specified
    in the template and the resource group that is being deployed to. Incremental
    deployment adds additional resources to the existing ones.


    The limitation of these templates is that they do not deploy code along with the
    resources.


    It is also important to mention that if we are deploying resources using an ARM
    template, it is good to first test it in another test subscription in Azure. That
    can help us validate whether the template is deployable through the Azure CLI
    and avoid, for example, deploying in Complete mode and then failing to create
    new resources because of a limitation on your Azure subscription quota. We will
    see how to do that in the next section.


    # Creating an Azure Databricks workspace with an ARM template


    We will see how we can create an Azure Databricks workspace using an ARM template
    and then validate that it was correctly deployed. To do this, we will use as an
    example the ARM template from Azure Quickstart Templates.


    As usual, to create an Azure Databricks workspace, we require an Azure subscription:


    +   1. Go to the Azure portal and, in the search tab, look for Deployment of Custom
    Template. From here, we can select to build our own template or use one from the
    GitHub Quickstart Template. We will select this option and look for 101-databricks-workspace,
    but there are options for using VNet injection and managed keys:'
  merge: -1
  img_proc: true
- pgno: 73
  md: '# Custom deployment


    Deploy from a custom template


    Select a template   Basics   Review + create


    Automate deploying resources with Azure Resource Manager templates in a single,
    coordinated operation. Create or select a template below to get started. Learn
    more about template deployment


    Build your own template in the editor


    # Common templates


