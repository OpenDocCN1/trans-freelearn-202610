- pgno: 216
  md: '# Technical requirements


    This chapter will require you to have an Azure Databricks subscription available
    to work on the examples in notebooks attached to running clusters.


    Without further ado, we can start by looking into the different ways in which
    we can install libraries in Azure Databricks and the differences of each method.


    # Installing libraries in Azure Databricks


    We can make use of third-party or custom code by installing libraries written
    in Python, Java, Scala, or R. These libraries will be available to notebooks and
    jobs running on your clusters depending on the level at which the libraries were
    installed.


    In Azure Databricks, installing libraries can be done in different ways, the most
    important decision being at which level we will be installing these libraries.
    The options available are at the workspace, cluster, or notebook level:


    +   - **Workspace** libraries serve as a local repository from which you create
    cluster-installed libraries. A workspace library might be custom code created
    by your organization or might be a particular version of an open-source library
    that your organization has standardized on.

    +   - **Cluster** libraries are available to be used by all notebooks attached
    to that cluster. You can install a cluster library from a public repository or
    create one from a previously installed workspace library.

    +   - **Notebook-scoped**: Python libraries allow you to install Python libraries
    and create an environment scoped to a notebook session. Notebook-scoped libraries
    will not be visible in other notebooks running on the same cluster. These libraries
    do not persist and need to be installed at the beginning of each session. Use
    notebook-scoped libraries when you need a custom Python environment for a specific
    notebook. With these libraries, it is easy to create, modify, save, reuse, and
    share Python environments. Notebook-scoped libraries are available using `%pip`
    in all Databricks Runtime instances and using the `%conda` magic commands in Databricks
    Runtime ML 6.4.'
  merge: -1
  img_proc: true
- pgno: 217
  md: 'Azure Databricks includes many popular Python libraries already installed.
    In order to check whether the library we want to install is already available,
    we can see which libraries are included in Databricks Runtime by looking at the
    System Environment subsection of the Databricks Runtime release notes for your
    Databricks Runtime version.


    # Workspace libraries


    Workspace libraries act as a local repository from where cluster-installed libraries
    can be created. These libraries can be custom code created by you or your company
    or organization; it can be a particular version of an open-source library that
    has been standardized or simply might hold features that are necessary for the
    job you are doing.


    We must first install the workspace library on a cluster before it can be made
    available to notebooks or jobs running on that cluster. We can create a workspace
    library in the Shared folder, which will be made available to all users in that
    workspace, or we can create it in a user folder, which will make the library available
    only to that user.


    To install a library, right-click on the workspace folder where you want to store
    the library and select the Create | Library option:


    ![](img/7e45bd08916c2a17d4e75cbb898f41e8_217_0.png)


    Figure 7.1 – Creating a library in a directory'
  merge: -1
  img_proc: true
- pgno: 218
  md: 'You will be prompted with the **Create Library** dialog from where you need
    to select the required library source and follow the appropriate procedure.


    ![](img/7e45bd08916c2a17d4e75cbb898f41e8_218_0.png)


    Figure 7.2 – Creating a library from the UI


    The available options are as follows:


    +   - **Upload** a library.

    +   - Reference an uploaded library.

    +   - **PyPI** package.

    +   - **Maven** package.

    +   - **CRAN** package (for R packages):


    To install a workspace library, we can use a Jar, Python egg, or Python wheel.
    To do this, drag your library''s Egg or wheel to the drop box, optionally enter
    a library name, and then click on the **Create** button. The file will be uploaded
    to **Databricks File System (DBFS)** and we can also optionally install the library
    on a cluster. You can also reference Eggs or wheels already in the workspace or
    in an S3 bucket.'
