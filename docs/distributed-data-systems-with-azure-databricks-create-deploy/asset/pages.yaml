  md: "The startingOffsets option accepts just one of these options and is only used\
    \ on queries that start from a new checkpoint. A query that is restarted from\
    \ an existing checkpoint will always resume where it was left off, except when\
    \ the data at that offset is older than the retention period.\n\nOne advantage\
    \ when using Apache Kafka in Structured Streaming is that we can manage what to\
    \ do when the stream first starts and what to do if the query is not able to pick\
    \ up from where it left off because the data is older than the retention period,\
    \ using the startingOffsets and failOnDataLoss options, respectively. This is\
    \ set with the auto.offset.reset configuration option.\n\nIn Structured Streaming,\
    \ you can express complex transformations such as one-time aggregation and output\
    \ the results to a variety of systems. As we have seen, using Structured Streaming\
    \ with Apache Kafka allows you to transform augmented streams of data read from\
    \ Apache Kafka using the same APIs as when working with batch data and integrate\
    \ data read from Kafka, along with data stored in other systems including such\
