- pgno: 219
  md: 'Installed libraries in the running clusters, along with their details and status,
    are shown in the workspace by clicking on the library details.


    If you want to remove a workspace library, you must first uninstall it before
    you can delete the directory that contains the library in the workspace by simply
    moving the library to the Trash folder after it was uninstalled from the cluster.


    # Cluster libraries


    Cluster libraries can be used by all notebooks and jobs running on that cluster.
    These libraries can be installed directly from a public repository such as PyPI
    or Maven, from a previously installed workspace library, or using an init script.


    There are three ways to install a library on a cluster:


    +   - Install a workspace library that has been already been uploaded to the workspace.

    +   - Install a library for use with a specific cluster only.

    +   - Using an init script that runs at cluster creation time.


    Bear in mind that if a library requires a custom configuration, you will need
    to install it using an init script that runs at cluster creation time. Also consider
    that when a library is installed on a cluster, notebooks and jobs attached to
    that cluster will not immediately see the new library. Therefore, you must first
    detach and then reattach the notebook to the cluster in order to make it visible.


    Azure Databricks will process all workspace libraries in the order in which they
    were installed on the cluster, so it''s also good to pay attention to these situations
    if there are dependencies between libraries and the order of installation of the
    required libraries is relevant.


    In order to install a library that already exists in the workspace, you can start
    either from the cluster UI or the library UI:


    +   - **Cluster UI**: To install using the cluster UI, click the **Clusters**
    option on the sidebar, select the cluster where you want to install the library,
    and in the **Libraries** tab, click on **Install New**. In the **Library Source**
    button list, select **Workspace**, then select a workspace library, and finally,
    click **Install**. You can also configure the library to be installed on all clusters
    by clicking on the library and using the **Install automatically on all clusters**
    checkbox option.'
  merge: -1
  img_proc: true
- pgno: 220
  md: '+   - **Library UI:** To install a library using the UI, go to the folder containing
    the library and then click on the library name and follow the steps mentioned
    in the previous section, selecting the option to install on the cluster:


    ![](img/7e45bd08916c2a17d4e75cbb898f41e8_220_0.png)


    Figure 7.3 – Installing a cluster-scoped library from the UI


    As mentioned before, if your library requires a custom configuration, you will
    need to install the library using an init script.


    To uninstall a library, you can start from a cluster or a library, go to the cluster
    UI, select the cluster where the library is, and in the Libraries tab, select
    the checkbox next to the cluster you want to uninstall the library from, then
    click Uninstall then Confirm. The status will change to Uninstall pending restart.


    To uninstall using the library UI, go to the folder containing the library, click
    the library name, and select the checkbox next to the cluster you want to uninstall
    the library from, then click Uninstall then Confirm. The status changes to Uninstall
    pending restart.


    In the same way as during the installation, to uninstall a library from a cluster,
    the library is removed only when your cluster is restarted. Until then, the status
    of the uninstalled library will be shown as Uninstall pending restart.


    To update a library installed on the cluster, you should uninstall the version
    you want to update and install the new one.'
