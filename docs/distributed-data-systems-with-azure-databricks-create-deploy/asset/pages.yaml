    # Configuring an Azure Databricks cluster


    As we have mentioned before, a cluster is where the code in our notebooks is run.
    It can be thought of as a set of VMs running in the background and balancing the
    load from our computations. This resource is billable when it''s on, so remember
    to terminate it when not in use.


    Let''s click on the Clusters icon on the left ribbon. This will open a window
    with the options to create a new cluster. The only necessary field is the name
    of the cluster, the rest of the fields have default values that we could leave
    as they are, but it''s good that we look at them more closely. The options that
    we have are as follows:


