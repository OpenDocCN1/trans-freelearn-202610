    as well as a running cluster with an attached notebook.


    # Introducing Delta Lake


    Using a data lake has become the de facto solution for many data engineering tasks.
    This storage layer is composed of files that can be arranged in a historical way
    instead of tables in a data warehouse. This has the benefit of decoupling storage
    from computing, which is the great advantage of data lakes. They are much cheaper
    than a database. The data that''s stored in the data lake has no primary and foreign
    keys, making it hard to extract the information stored on it. Therefore, data
    lakes are seen as a solution where we only append new data. When trying to query
    or delete records, we need to go through all the files in the data lake, which
    could be a very resource-intensive and slow task.


    This leads to data lakes being hard to update, and they may have problems when
    we try to use them in cases where data needs to be frequently queried. This includes
    customer or transactional data, financial applications that require robust data
    handling, or when we want changes in the data warehouse to be reflected on the
    records.


    The data lake is being seen as a change in the architecture''s paradigm, rather
    than a new technology, where we need to work on massive amounts of raw data that''s
    produced by having several input sources dropping files into the data lake, which
    then need to be ingested. These files could contain structured, semi-structured,
    or unstructured data, which, in turn, is processed in parallel by different jobs
    that work concurrently, given the parallel nature of Azure Databricks. This can
    make it hard for the files to keep their integrity.


    To tackle these limitations, Azure Databricks has introduced Delta Lake, which
    is a combination of Delta tables and a Delta Engine. Delta Engine can be used
    for the staging and processing layers, where it supports data streams, provides
    batch reads and writes to large queries, and provides analytic dashboards.'
  merge: -1
  img_proc: true
- pgno: 123
  md: 'Delta Lake is a storage layer that sits on top of the data lake, such as Azure
    Data Lake Storage (ADLS) Gen2, and seeks to overcome the data lake''s common limitations,
    such as being unable to execute SQL queries on the data or managing the ingestion
    of incoming files. It has several advantages, which includes automatically ingesting
    streams of data, data schema handling, data versioning thanks to time traveling,
    and faster processing than a conventional relational data warehouse, along with
    the benefit of being able to query the data. Delta Lake seeks to provide reliability
    for the big data lakes by ensuring data integrity with Atomicity, Consistency,
    Isolation, and Durability (ACID) transactions, allowing you to read and write
    the same file or table. The way in which Delta Lake works is very straightforward
    – you just need to change the way you store your files and specify Delta as the
    format of a table, which is a Spark proprietary file type that only works on the
    cloud.


    We will deep dive into the specifics of these methods in the upcoming sections.


    One thing to bear in mind is that Delta Lake can only be accessed from the Azure
    Databricks runtime, so we should not consider it as a replacement for a data warehouse.


    Delta Lake provides several advantages related to how we work with the data stored
    in the lake. The most prominent features that make Delta Lake a great choice are
    as follows:


    +   - **ACID transactions**: As we mentioned previously, isolation levels derived
    from ACID transactions allow different users to work concurrently with the same
    data, without them seeing inconsistencies. This is thanks to the use of transaction
    logs, which are included in the checkpoint support.

    +   - Delta Lake provides scalable processing for metadata thanks to Azure Databricks''
    distributed computing nature.

    +   - **Streaming and batch unification**: A table in Delta Lake is a batch table,
    as well as a streaming source and sink, making it a solution for a Lambda architecture.
    However, it also goes one step further since both batch and real-time data land
    in the same sink. Streaming data ingest, batch historic backfill, and interactive
    queries all just work out of the box.

    +   - **Automatically enforce schema**: Automatically handles schema variations
    to prevent bad records being inserted during ingestion.

    +   - **Time travel**: One of the most important features of Delta Lake is being
    able to access snapshots of data either as versions of a table or a specific timestamp.
    This allows us to fix any errors derived from possible bad data manipulation,
    handle auditing more easily, and provide a clear view of the changes that have
    been made to the data.'
  merge: -1
  img_proc: true
- pgno: 124
  md: '+   - **Upserts and deletes**: It supports DDL manipulations such as merges,
    delete, and updates thanks to the use of Spark APIs, enabling you to work with
    cases such as streaming data or SCD operations.

    +   - Performance is boosted thanks to automatic data optimization, such as data
    skipping to read only relevant portions of data, file compression, catching frequently
    accessed data, and Z-Ordering.


    In this section, we introduced Delta Lake and briefly mentioned what lead to its
    development, as well the tools that we can use to take full advantage of its main
    features. In the next section, we will dive into how we can start using Delta
    Lake by going through the methods used to load data into it from several sources.


    # Ingesting data using Delta Lake


    Data can be ingested into Delta Lake in several ways. Azure Databricks offers
    several integrations with Partners, which provide data sources that are loaded
    as Delta tables. We can copy a file directly into a table, use AutoLoader, or
    create a new streaming table. Let''s take a deeper look at this.


    # Partner integrations


    Azure Databricks allows us to connect to different partners that provide data
    sources. These are easy to implement and provide scalable ingestion.


    We can view the options that we have for ingesting data from **Partner Integrations**
    when creating a new table in the UI, as shown in the following screenshot:


    ![](img/7e45bd08916c2a17d4e75cbb898f41e8_124_0.png)


    Figure 4.1 – Ingesting data from Partner Integrations


    Some of these integrations, such as Qlink, allow you to get data from multiple
    data sources such as Oracle, Microsoft SQL Server, and SAP and load them into
    Delta Lake. Of course, these integrations require you to have a subscription to
    these services and in most cases, the documentation will be provided by the supplier.'
