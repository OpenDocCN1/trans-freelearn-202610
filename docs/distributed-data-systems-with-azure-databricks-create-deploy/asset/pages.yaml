  md: "As you can see, the integration of Spark with the TFRecord file format in Azure\
    \ Databricks is seamless and allows us to read and write TFRecord files directly\
    \ in Spark DataFrames.\n\n# Using TFRecordDataset to load data\n\nAnother of the\
    \ available options that we have for working with TFRecord files is to use the\
    \ TFRecordDataset TensorFlow class. This can be useful when we need to standardize\
    \ input data to improve the performance of our loading process:\n\n+   1. You\
    \ can also pass a list with the file paths we want the TFRecordDataset class to\
    \ read, as shown in the next code block:\n\n```\nfilenames = [<your_tfrecode_file_1>,...,\
    \ [<your_tfrecode_file_n>]\nraw_dataset = tf.data.TFRecordDataset(filenames)\n\
    ```\n\nraw_dataset is a TFRecordDataset class that contains serialized tf.train.Example\
    \ records. When we iterate over it, it will return these records as scalar string\
    \ tensors.\n\n+   2. In the next example, we will use the take method to only\
    \ show the first 10 records in raw_dataset:\n\n```\nfor raw_record in raw_dataset.take(10):\n\
    \    print(repr(raw_record))\n```\n\nRemember that to iterate over TFRecordDataset,\
    \ it is necessary to enable eager execution.\n\n+   3. The tf.train.Example scalar\
    \ string tensors can then be parsed using the tf.io.FixedLenFeature function.\
    \ Notice that we need to define feature_description because datasets use graph\
    \ execution, and this description is used to build their shape and type signature:\n\
    \n```\nfeature_description = {\n    'feature0': tf.io.FixedLenFeature([], tf.int64,\
    \ default_value=0),\n    'feature1': tf.io.FixedLenFeature([], tf.string, default_value=''),\n\
    \    'feature2': tf.io.FixedLenFeature([], tf.float32, default_value=0.0),\n}\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 299
  md: "feature_description is a dictionary that holds the description of the features,\
    \ which is necessary for our parsing function.\n\n4. Here, our next step will\
    \ define the parsing function, which will read the tf.train.Example class input\
    \ using the previously defined feature_description dictionary:\n\n```\ndef _parsing_function(proto_input):\n\
    \    return tf.io.parse_single_example(proto_input,\n    feature_description)\n\
    ```\n\n5. As the next step to read our TFRecord files, we will apply the parsing\
    \ function that we have defined to each item in the dataset using the tf.data.Dataset.map\
    \ method:\n\n```\nparsed_dataset = raw_dataset.map(_parsing_function)\nparsed_dataset\n\
    ```\n\nWe can also parse batches of data using the tf.io.parse_example function\
    \ as an alternative to reading them one by one.\n\n6. We can examine the data\
    \ by displaying the observations in the dataset when eager execution is enabled.\
    \ Here, regardless of the number of observations in the dataset, we will only\
    \ display the first 10 of them, which will be shown as a dictionary of features:\n\
    \n```\nfor parsed_record in parsed_dataset.take(10):\n    print(repr(parsed_record))\n\
    ```\n\nEach item shown is a tf.Tensor, which is a TensorFlow class that has as\
    \ a value the numpy element of this tensor.\n\n7. To write observations as a TFRecord\
    \ file, we need to transform each observation to a tf.train.Example class before\
    \ it is written to file. Here, we will write n_obs number of tf.train.Example\
    \ records to a TFRecord file:\n\n```\nwith tf.io.TFRecordWriter(filename) as writer:\n\
    \    for i in range(n_obs):\n        example = serialize_example(feature0[i],\n\
    \                                    feature1[i],\n                          \
    \          feature2[i])\n        writer.write(example)\n```"
