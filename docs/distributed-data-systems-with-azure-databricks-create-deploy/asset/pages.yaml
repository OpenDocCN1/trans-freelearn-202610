  md: '+   - Clusters running Databricks Runtime ML or Databricks Runtime for Genomics
    can use `init` scripts running either `conda` or `pip` commands to install libraries.
    However, if the `init` script only includes `pip` commands, then you should use
    only `%pip` commands in the notebooks.


    Managing libraries at the notebook level allow us to provide a separation of concerns
    when running experiments without affecting all the notebooks attached to a cluster.
    It is important to understand how this relates to libraries located at the cluster
    or workspace level and how we can leverage this to efficiently manage libraries.


    In the next section, we will discuss more deeply how to use the PySpark API in
    Azure Databricks.


    # PySpark API


    We have been using the PySpark API across all sections when describing the features
    of Azure Databricks without discussing too much of its functionalities and how
    we can leverage them to make reliable ETL operations when working with big data.
    PySpark is the Python API for Apache Spark, a cluster-computing framework that
    is the heart of Azure Databricks.


    # Main functionalities of PySpark


    PySpark allows you to harness the power of distributed computing with the ease
    of use of Python and it’s the default way in which we express our computations
    through this book unless stated otherwise.


    The fundamentals of PySpark lies in the functionality of its sub-packages of which
    the most central are the following:


    +   - **PySpark DataFrames**: Data stored in rows following a set of named columns.
    These DataFrames are immutable and allow us to perform lazy computations.

    +   - **The PySpark SQL module**: A higher-abstraction module for processing structured
    and semi-structured datasets from various sources and formats.

    +   - **Streaming source**: A fault-tolerant and scalable module to read streaming
    data, which is converted into batches and read in predefined intervals of time,
    processes it using complex algorithms expressed in functions such as map, reduce,
    and so on, and then finally writes to different filesystems.'
  merge: -1
  img_proc: true
