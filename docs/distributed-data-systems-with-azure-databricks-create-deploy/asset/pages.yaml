  md: "6. It is important to add a hook to broadcast the initiation variables from\
    \ rank 0 to all other processes during initialization to be able to replicate\
    \ structures that depend on random initialization parameters, such as initialization\
    \ of model weights. The code to do this is illustrated in the following snippet:\n\
    \n```\nhooks = [hvd.BroadcastGlobalVariablesHook(0)]\n```\n\n7. At this point,\
    \ we are ready to start the training operation using our predefined loss function,\
    \ as follows:\n\n```\ntrain = opt.minimize(loss)\n```\n\n8. We need to specify\
    \ the checkpoints to be saved only on worker 0 to prevent other workers from overlapping\
    \ write operations between them. We run the following code to do so:\n\n```\n\
    checkpoint_dir = '/tmp/training_logs' if hvd.rank() == 0\nelse None\n```\n\n9.\
    \ Now, we will use the MonitoredTrainingSession checkpoint to take care of the\
    \ operations required for session initialization, loading, and saving to and from\
    \ checkpoints, and closing when the operation has been completed or if any error\
    \ occurs. The code for this is shown in the following snippet:\n\n```\nwith tf.train.\\\
    \n    MonitoredTrainingSession(checkpoint_dir=checkpoint_dir,\n              \
    \              config=config,\n                            hooks=hooks) as mon_sess:\n\
    \        while not mon_sess.should_stop():\n            mon_sess.run(tr)\n```\n\
    \nThis way, we can modify a TensorFlow v1 training script to use Horovod for distributed\
    \ training. Here, Horovod will dynamically modify the batch size and the learning\
    \ rate in each one of the workers and will process the training, synchronously\
    \ scaling with the number of available workers. The hvd.DistributedOptimizer optimizer\
    \ will take care of calculating the gradients on batches of data in each one of\
    \ the workers and modifying the model parameters based on the averaged gradients.\n\
    \nFinally, we have made sure to broadcast all of the initiation variables to ensure\
    \ consistency in the models across workers, and enforced the checkpoints to be\
