    # Extracting features from text


    Extracting information from text relies on being able to capture the underlying
    language structure. This means that we intend to capture the meaning and relationship
    among tokens and the meaning they try to convey within a sentence. These sorts
    of manipulations and tasks associated with understanding the meaning in text yield
    a whole branch of an interdisciplinary field called natural language processing
    (NLP). Here, we will focus on some examples related to transforming text into
    numerical features that can be used later on the machine learning and deep learning
    algorithms using the PySpark API in Azure Databricks.


    # TF-IDF


    Term Frequency-Inverse Document Frequency (TF-IDF) is a very commonly used text
    preprocessing operation to convert sentences into features created based on the
    relative frequency of the tokens that compose them. The term frequency-inverse
    is used to create a set of numerical features that are constructed based on how
    relevant a word is to the context, not only to a document in a collection or corpus.


    In Azure Databricks ML, TF-IDF is an operation that is done in two separate parts,
    the first being the TF (+hashing), followed by the IDF:


    +   - **TF**: HashingTF is a PySpark Transformer class that takes an array of
    terms and converts them into fixed-length feature vectors. In feature engineering,
    when we refer to a "set of terms", this might imply that we are referencing a
    bag of words (BOW). The algorithm combines TF counts with the hashing trick (sometimes
    called feature hashing), in order to do a fast and efficient vectorization of
    the features into vectors or matrices, for dimensionality reduction.'
  merge: -1
  img_proc: true
- pgno: 274
  md: "+   - **IDF**: `IDF` is a PySpark Estimator class that is fitted on a dataset\
    \ and yields as a result an `IDFModel`. The `IDFModel` takes as input feature\
    \ vectors, which in this case come from the `HashingTF` class, and scales each\
    \ feature column. It will automatically lower weights applied on columns, depending\
    \ on the frequency it appears on the corpus.\n\nIn the following example, we take\
    \ as input an array of sentences. Each sentence will be split into tokens using\
    \ the PySpark `Tokenizer` class, which will yield a BOW for each sentence:\n\n\
    +   1. Later—and, as mentioned, in the following code block —we will apply the\
    \ `HashingTF` class to reduce the dimensionality of the feature vector:\n\n```\n\
    from pyspark.ml.feature import HashingTF, IDF, Tokenizer\nsentenceData = sqlContext.createDataFrame([\n\
    \    (0, \"Hi I heard about Spark\"),\n    (0, \"I wish Java could use case classes\"\
    ),\n    (1, \"Logistic regression models are neat\")\n], [\"label\", \"sentence\"\
    ])\ntokenizer = Tokenizer(inputCol=\"sentence\",\noutputCol=\"words\")\nwordsData\
    \ = tokenizer.transform(sentenceData)\nhashingTF = HashingTF(inputCol=\"words\"\
    ,\n                    outputCol=\"rawFeatures\",\n                    numFeatures=20)\n\
    ```\n\n+   2. Later, we will apply the IDF class to rescale the obtained features\
    \ as a good practice when we use this in a machine learning or deep learning algorithm\
    \ to avoid issues with gradients and generally improve the performance. The code\
    \ for this is shown in the following snippet:\n\n```\nfeaturizedData = hashingTF.transform(wordsData)\n\
    idF = IDF(inputCol=\"rawFeatures\",outputCol=\"features\")\nidFModel = idf.fit(featurizedData)\n\
    rescaledData = idfModel.transform(featurizedData)\n```\n\n+   3. Finally, we can\
    \ display the obtained features, as follows:\n\n```\nfor features_label in rescaledData.\n\
    \    select(\"features\",\"label\").take(3):\n    print(features_label)\n```"
