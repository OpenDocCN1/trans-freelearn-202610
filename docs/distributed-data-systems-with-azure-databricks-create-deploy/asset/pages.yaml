- pgno: 46
  md: '# Displaying clusters


    To display the clusters in your workspace, click the clusters icon in the sidebar.
    You will see the Cluster page, which displays clusters in two tabs: All-Purpose
    Clusters and Job Clusters:


    ![](img/7e45bd08916c2a17d4e75cbb898f41e8_46_0.png)


    Figure 1.32 – Cluster details


    On top of the common cluster information, All-Purpose Clusters displays information
    on the number of notebooks attached to them.


    Actions such as terminate, restart, clone, permissions, and delete actions can
    be accessed at the far right of an all-purpose cluster:


    ![](img/7e45bd08916c2a17d4e75cbb898f41e8_46_1.png)


    Figure 1.33 – Actions on clusters


    Cluster actions allow us to quickly operate in our clusters directly from our
    notebooks.


    # Starting a cluster


    Apart from creating a new cluster, you can also start a previously terminated
    cluster. This lets you recreate a previously terminated cluster with its original
    configuration. Clusters can be started from the Cluster list, on the cluster detail
    page of the notebook in the cluster icon attached dropdown:'
  merge: -1
  img_proc: true
- pgno: 47
  md: '# Quickstart Notebook (SQL)


    ![](img/7e45bd08916c2a17d4e75cbb898f41e8_47_0.png)


    Figure 1.34 – Starting a cluster from the notebook toolbar


    You also have the option of using the API to programmatically start a cluster.


    Each cluster is uniquely identified and when you start a terminated cluster, Azure
    Databricks automatically installs libraries and reattaches notebooks to it.


    # Terminating a cluster


    To save resources, you can terminate a cluster. The configuration of a terminated
    cluster is stored so that it can be reused later on.


    Clusters can be terminated manually or automatically following a specified period
    of inactivity:


    ![](img/7e45bd08916c2a17d4e75cbb898f41e8_47_1.png)


    Figure 1.35 – A terminated cluster


    It''s good to bear in mind that inactive clusters will be terminated automatically.'
  merge: -1
  img_proc: true
- pgno: 48
  md: '# Deleting a cluster


    Deleting a cluster terminates the cluster and removes its configuration. Use this
    carefully because this action cannot be undone.


    To delete a cluster, click the delete icon in the cluster actions on the Job Clusters
    or All-Purpose Clusters tab:


