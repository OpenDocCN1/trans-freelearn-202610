- pgno: 13
  md: '# Preface


    Microsoft Azure Databricks helps you to harness the power of distributed computing
    and apply it to create robust data pipelines, along with training and deploying
    **Machine Learning (ML)** and **Deep Learning (DL)** models. Databricks’ advanced
    features enable developers to process, transform, and explore data. Distributed
    data systems with Azure Databricks will help you to put your knowledge of Databricks
    to work to create big data pipelines.


    The book provides a hands-on approach to implementing Azure Databricks and its
    associated methodologies that will make you productive in no time. Complete with
    detailed explanations of essential concepts, practical examples, and self-assessment
    questions, you''ll begin with a quick introduction to Databricks'' core functionalities,
    before performing distributed model training and inference using TensorFlow and
    Spark MLlib. As you advance, you''ll explore MLflow Model Serving on Azure Databricks
    and distributed training pipelines using HorovodRunner in Databricks. Finally,
    you''ll discover how to transform, use, and obtain insights from massive amounts
    of data to train predictive models and create entire fully working data pipelines.


    By the end of this MS Azure book, you''ll have gained a solid understanding of
    how to work with Databricks to create and manage an entire big data pipeline.


    # Who this book is for


    This book is for software engineers, ML engineers, data scientists, and data engineers
    who are new to Azure Databricks and who want to build high-quality data pipelines
    without worrying about infrastructure. Knowledge of the basics of Azure Databricks
    is required to learn the concepts covered in this book more effectively. A basic
    understanding of ML concepts and beginner-level Python programming knowledge is
    also recommended.'
  merge: -1
  img_proc: true
- pgno: 14
  md: '# What this book covers


    *Chapter 1, Introduction to Azure Databricks*, takes you through the core functionalities
    of Databricks, including how we interact with the workspace environment, a quick
    look into the main applications, and how we will be using the tool for Python
    users. This covers topics such as workspace, interface, computation management,
    and Databricks notebooks.


    *Chapter 2, Creating an Azure Databricks Workspace*, teaches you how to apply
    all the previous concepts using the different tools that Azure has in order to
    interact with the workspace. This includes using PowerShell and the Azure CLI
    to manage all Databricks'' resources.


    *Chapter 3, Creating ETL Operations with Azure Databricks*, shows you how to manage
    different data sources, transform them, and create an entire event-driven ETL.


    *Chapter 4, Delta Lake with Azure Databricks*, explores Delta Lake and how to
    implement it for various operations.


    *Chapter 5, Introducing Delta Engine*, explores Delta Engine and also shows you
    how to use it along with Delta Lake and create efficient ETLs in Databricks.


    *Chapter 6, Introducing Structured Streaming*, provides explanations on notebooks,
    details on how to use specific types of streaming sources and sinks, how to put
    streaming into production, and notebooks demonstrating example use cases.


    *Chapter 7, Using Python Libraries in Azure Databricks*, explores all the nuances
    regarding working with Python, as well as introducing core concepts regarding
    models and data that will be studied in more detail later on.


    *Chapter 8, Databricks Runtime for Machine Learning*, acts as a deep dive for
    us in the development of classic ML algorithms to train and deploy models based
    on tabular data, all while exploring libraries and algorithms as well. The examples
    will be focused on the particularities and advantages of using Databricks for
    ML.


    *Chapter 9, Databricks Runtime for Deep Learning*, acts as a deep dive for us
    in the development of classic DL algorithms to train and deploy models based on
    unstructured data, all while exploring libraries and algorithms as well. The examples
    will be focused on the particularities and advantages of using Databricks for
    DL.


    *Chapter 10, Model Tracking and Tuning in Azure Databricks*, focuses on model
    tuning, deployment, and control using Databricks'' functionalities, such as AutoML
    and Delta Lake, while using it in conjunction with popular libraries such as TensorFlow.'
  merge: -1
  img_proc: true
- pgno: 15
  md: 'Chapter 11, Managing and Serving Models with MLflow and MLEap, explores in
    more detail the MLflow library, an open source platform for managing the end-to-end
