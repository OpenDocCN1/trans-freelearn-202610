- pgno: 223
  md: 'The notebook state is reset after any %pip or %conda command that modifies
    the environment, so it is important to consider that all these commands must be
    at the beginning of the notebook in order to not lose created variables and lose
    unsaved results. So, if we create methods, functions, or variables and then we
    execute either the %pip or %conda commands, these methods and variables won''t
    be recovered.


    Sometimes, as any experienced Python user will know, the use of %pip or %conda
    to install or uninstall packages can lead to some unstable behavior, or even cause
    some features to stop working. In order to overcome this issue, one of the simplest
    solutions is to restart the environment by detaching the notebook from the running
    cluster and then re-attaching it back. If this doesn''t solve the issue, we can
    directly restart the cluster to which the notebook is attached in order to make
    the driver and executor nodes reinstall all the libraries from a clean state:


    +   - Using %pip or %conda to install or uninstall packages is equivalent to its
    use in any other Python environment. For example, to install a specific version
    of a library, we can run the following on a cell:


    ```

    %pip install pandas==1.2.1

    ```


    +   - Or, on the other hand, we can install a Wheel package by using %pip install
    and the path to where our package is located:


    ```

    %pip install /path/to/my_package.whl

    ```


    +   - To uninstall a library, it is necessary to pass the -y option to say yes
    as the default, because there is no keyboard input when running this option:


    ```

    %pip uninstall -y pandas

    ```


    Although we can install and uninstall libraries using the %pip command, we cannot
    uninstall libraries included in the Databricks Runtime or any libraries that are
    installed at the cluster level. If you have installed in your notebook a library
    that has a version that is different from the one installed in Databricks Runtime
    or in the cluster, using %pip to uninstall it will revert the version to the one
    that is installed in Databricks Runtime or in the cluster:


    +   - We can also install a library from a repository such as GitHub with the
    %pip command, specifying options for the version or Git subdirectory:


    ```

    %pip install git+https://github.com/databricks/

    databricks-cli

    ```'
