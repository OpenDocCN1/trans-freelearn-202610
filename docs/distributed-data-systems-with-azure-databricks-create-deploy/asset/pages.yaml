- pgno: 334
  md: 'Once the execution has been completed, we can access the Trials object to inspect
    the values that were returned by the objective function during the optimization.
    We have different way we can access the values stored in the Trials object:


    +   - trials.trials: Returns a list of dictionaries with all the parameters of
    the search.

    +   - trials.results: The dictionaries that are returned by the objective function.

    +   - trials.losses(): The actual losses of all the successful trials.

    +   - trials.statuses(): The status of each of the trials.


    This Trials object can be saved as a pickle object or parsed using custom code
    so that we have a deeper understanding of the results of the trials.


    The attachments of the trials can be accessed like so:


    ```

    msg = trials.trial_attachments(trials.trials[0])[''time_module'']

    time_module = pickle.loads(msg)

    ```


    In this example, we are fetching the time_module attachment of the first trial.


    One thing that is important to note is that in Azure Databricks, we have the option
    to pass both the Trials and SparkTrials objects to the trials parameter of the
    fmin() function. The SparkTrials object is passed when we execute single-machine
    algorithms such as scikit-learn models as objective functions. Here, the Trials
    object is used in distributed training algorithms such as MLlib or Horovod models.
    The SparkTrials class allows us to distribute the execution of the optimization
    without having to introduce any custom logic. It also improves the distribution
    of the computation to the workers.


    Do not use the SparkTrials object with algorithms designed for distributed training
    as that will cause the execution to be parallelized in the cluster.


    Now that we have a clearer picture of how we can configure the basic parameters
    of the fmin() Hyperopt function, we can dive into how the search space is defined.


    # Defining a search space


    We can express the search space as a set of nested functions that define the individual
    search space for different test cases. For example, in the following code block,
    we are specifying the search space for the x parameter with two test spaces called
    test_space_1 and test_space_2:


    ```

    from hyperopt import hp

    ```'
