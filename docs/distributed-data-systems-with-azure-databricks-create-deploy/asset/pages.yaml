    +   - As we are used to doing, we can also just pass the table name, like this:


    ```

    OPTIMIZE data_events

    ```


    This table is small, so the optimization will not actually change anything on
    the files holding the table data, as can be seen in the following screenshot:


    ![](img/7e45bd08916c2a17d4e75cbb898f41e8_151_1.png)


    Figure 5.2 – Specifying a Delta table to optimize by name


    +   - If we have many files but we want to focus on a certain number of them,
    we can optimize a portion of the data by explicitly passing a WHERE clause. This
    will cause the OPTIMIZE command to just act on a subset of data, as illustrated
    in the following code snippet:


    ```

    OPTIMIZE data_events WHERE insert_date >= ''2020-06-15''

    ```


    When the OPTIMIZE command is run, we will see afterward a series of file statistics
    related to the reorganization of files that has occurred, such as removed files
    and added files, and even some Z-Ordering statistics.'
  merge: -1
