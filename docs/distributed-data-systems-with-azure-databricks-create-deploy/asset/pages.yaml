- pgno: 152
  md: 'Delta Lake will optimize the aforementioned tables, yielding better query speed,
    thanks to the fact that we will be scanning a smaller number of files to read
    our table. One thing to bear in mind is that the bin-packing optimization, triggered
    by the OPTIMIZE command, is an idempotent action, which is a fancy word for saying
    that the execution of this command will take effect only the first time that it
    is triggered on a dataset.


    When this action takes place on a table, readers of the table that is being optimized
    will not be affected, thanks to the Snapshot Isolation feature of Delta tables.
    The integrity of the table is ensured even when the underlying file structure
    is reordered by the algorithm and the transaction log is modified accordingly,
    so queries will yield the same result before and after the OPTIMIZE command has
    been run on a table. Any stream of data related to a table that is being optimized
    will not be affected by this command either.


    The goal of this algorithm is to produce a series of evenly sized files that provide
    a balance between the size and number of them in the storage.


    So, if this reorganization is so efficient and doesn''t affect the data stored
    in a table, why isn''t OPTIMIZE automatic? The answer to this question lies in
    the fact that to coalesce several files into a single larger one, you need to
    have upfront those small files in the directory, otherwise there won''t be anything
    to coalesce; therefore, OPTIMIZE can''t be run automatically. Another answer is
    that compression is also an expensive operation in terms of computational, storage,
    and time resources, so this might affect the ability of Azure Databricks to execute
    low-latency streams when a table that is being optimized is the source of a stream.


    A final point of discussion relates to how often Delta tables should be optimized.
    This, of course, is a trade-off between performance and the cost of the resource
    that is used to run the optimization. If your priority is performance, this operation
    should take place more often or at regular intervals such as daily intervals;
    otherwise, you can prioritize cost and run this less often.


    # Skipping data


    As new data arrives, Delta Lake will keep track of file-level statistics related
    to the input/output (I/O) granularity of the data. These statistics are obtained
    automatically, storing information on minimum and maximum values at query time.
    The point of this is to identify columns that have a certain level of correlation,
    plan queries accordingly, and avoid unnecessary I/O operations. During lookup
    queries, the Azure Databricks Data Skipping feature will leverage the obtained
    statistics to skip files that are not necessary to read in this operation.'
  merge: -1
  img_proc: true
- pgno: 153
  md: 'The granularity can be tuned and it integrates very well with partitioning,
    even though these are independent operations.


    Bear in mind that Data Skipping is an indexing probabilistic technique that, as
    with Bloom filters (which will be discussed later in the chapter), can lead to
    false positives.


    There is no need to configure Data Skipping because it is activated by default
    and applied whenever possible, meaning also that the performance of this operation
    is bound to the underlying structure of your data. What we can configure is how
    many columns we want to track during the statistics—which by default are the first
    32, a value that can be modified using the `dataSkippingNumIndexedCols` option.
    Consider that keeping track of columns is a resource-intensive operation, so adding
    more columns or tracking columns with long string data types will have an impact
    on the overhead when writing files.


    A workaround for these issues would be to change the type of a long string column
    using `ALTER TABLE` or move it beyond the threshold established by the `dataSkippingNumIndexedCols`
    option, to be skipped when collecting statistics.


    Thanks to Data Skipping, we can reduce the amount of data needed to be read in
    each query, yielding an increase in the performance of our ETL pipelines and reducing
    time and costs.


    In the next section, we will learn about Z-Ordering and how it can be leveraged
    to improve performance even more.


    # Using Z-order clustering


    Sometimes, data can be scattered across files, which is not practical when we
    run queries against it. This leads to an increase in the size of metadata, as
    well as problems listing directories, and file compression issues.


    To handle this problem, we can use partitioning techniques (as we will see in
    the next section) that attempt to make the distribution of our information more
    even. In turn, the performance of these techniques depends on how the information
    is scattered across files, so before running them you are advised to apply Z-Ordering.'
  merge: -1
  img_proc: true
- pgno: 154
  md: 'Z-Ordering is a feature of Delta Lake that seeks to allocate related data in
    the same location. This can improve the performance of our queries on the table
    in which we run this command because Azure Databricks can leverage it with data-skipping
    methods to read and partition files more efficiently. We can use Z-Ordering in
    Azure Databricks using the ZORDER BY command:


    +   - In the following code example, we will optimize the data table on the event_type
    column:


    ```

    OPTIMIZE data

    ZORDER BY (event_type)

    ```


    By running this operation in a Structured Query Language (SQL) cell in a notebook,
    we should get as a result the modifications made to optimize the table according
    to the specified partition. From the following screenshot example, we can see
    that our table was small and we didn’t really need to optimize the underlying
    file structure of the table:


    ![](img/7e45bd08916c2a17d4e75cbb898f41e8_154_0.png)


    Figure 5.3 – Applying ZORDER on a Delta table


    +   - We can also reference Delta tables by path, as illustrated in the following
    code snippet:


    ```

    OPTIMIZE delta.''path_to_data''

    ZORDER BY (event_type)

    ```


    By running the preceding code in a SQL cell in an Azure Databricks notebook, we
    should see the resulting metrics of the operation in the same way as before when
    the table was specified by name, as illustrated in the following screenshot:'
  merge: -1
  img_proc: true
- pgno: 155
  md: 'Figure 5.4 – Applying ZORDER on a Delta table, specifying it by path


    Z-Ordering can also be applied to a subset of data by passing a condition.


    +   - In the following code example, we will only optimize data in the event_type
    column between today and yesterday:


    ```

    OPTIMIZE data

    WHERE insert_date >= current_timestamp() - INTERVAL 1 day

    ZORDER BY (event_type)

    ```


    In the following screenshot, we can see that by running this operation in a SQL
    cell in a notebook, we will see as a result the path of the table and the metrics
    of the operation in the same way as in the previous examples:


