    \ and use it to do inference on a new observation once it has been deployed.\n\
    \n# Model Registry example\n\nIn this section, we will go through an example in\
    \ which we will develop a machine learning model and use the MLflow Model Registry\
    \ to save it, manage the stages in which it belongs, and use it to make predictions.\
    \ The model will be a Keras neural network, and we will use the Windfarm US dataset\
    \ to predict the power output of wind farms based on parameters from weather conditions\
    \ such as wind direction, speed, and air temperature. We will make use of MLflow\
