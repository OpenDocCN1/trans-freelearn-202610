  \ |\n\nFigure 10.3 - The statistical summary of the features\n\n6. 街区人口以千为单位衡量，但平均卧室数约为\
  \ 1.1。为了防止具有大值的特征被认为更重要，对特征进行缩放和归一化是一种标准做法。为了使特征归一化为相同的尺度，我们可以使用 scikit-learn StandardScaler\
  \ 函数：\n\n```\nfrom sklearn.preprocessing import StandardScaler\nscaler = StandardScaler()\n\
  scaled_features = scaler.fit_transform(features)\n```\n\n7. 现在我们已经对预测特征进行了缩放，我们可以通过在\
  \ scaled_features 数据集上调用 mean(axis=0) NumPy 方法来检查均值是否接近 0：\n\n```\nscaled_features.mean(axis=0)\n\
  ```\n\n8. 现在我们的预测特征已归一化并缩放，我们将不得不将数值目标列转换为离散值：\n\n```\nfrom sklearn.preprocessing\
  \ import StandardScaler\nscaler = StandardScaler()\nscaled_features = scaler.fit_transform(features)\n\
  print(scaled_features.mean(axis=0))\n```\n\n[ 6.60969987e-17  5.50808322e-18  6.60969987e-17\
  \ -1.06030602e-16\n -1.10161664e-17  3.44255201e-18 -1.07958431e-15 -8.52651283e-15]\n\
  \nFigure 10.4 – The scaled feature means\n\n9. 此目标列向量是每套房屋的价值，是一个连续的正标量。我们将将其转换为目标列向量，其离散值为当房屋价值大于均值时为\
  \ 1，否则为 0。这样，预测可以被表述为一个问题；例如，给定预测特征，此房屋的价值是否大于均值？为了离散化值，我们将与均值进行比较并使用 numpy.where()\
  \ 函数将比较产生的布尔值转换为 1 和 0：\n\n```\ntarget_discrete = np.where(target < np.median(target),\
  \ 0, 1)\n```\n\n这样，我们就将目标变量编码为一个具有两个水平的列向量，即 1 或 0。这表示房屋价格是否高于均值。\n\n10. 现在我们已经准备好数据集，我们可以开始为优化我们将用于训练有效分类模型的几个\
  \ scikit-learn 模型的超参数设定阶段。为此，我们将使用以下三个 scikit-learn 分类器模型：\n\n+   a) 支持向量机\n+  \
  \ b) 逻辑回归\n+   c) 随机森林\n\n11. 我们将创建一个要最小化的目标函数，将其传递给 Hyperopt。它将运行训练并计算在几种类型的模型上定义的\
  \ 'type' 参数的交叉验证性能指标。关于此函数需要注意的一点是，因为我们使用的是 fmin() Hyperopt 函数，所以它会尝试最小化目标函数。因此，为了提高性能指标——在本例中为准确率——我们必须使用负准确率。否则，Hyperopt\
  \ 将尝试最小化准确率，而这显然是我们不想做的：\n\n```\ndef objective(params):\n    classifier_type = params['type']\n\
  \    del params['type']\n    if classifier_type == 'svm':\n        clf = SVC(**params)\n\
  \    elif classifier_type == 'rf':\n        clf = RandomForestClassifier(**params)\n\
  \    elif classifier_type == 'logreg':\n        clf = LogisticRegression(**params)\n\
  \    else:\n        return 0\n    accuracy = cross_val_score(\n        clf,\n  \
  \      scaled_features,\n        target_discrete).mean()\n    return {'loss': -accuracy,\
  \ 'status': STATUS_OK}\n```\n\n请注意，此函数的输出是一个键值字典，其中包含两个必需的参数。这些是 'loss'，即负准确率，以及\
  \ 'status'，它使用我们之前导入的 Hyperopt 状态字符串之一定义。\n\n12. 下一步是定义我们将用于扫描每个选定 scikit-learn\
  \ 模型所有可能超参数的搜索空间。这将帮助我们找到产生最佳准确率的超参数。我们将使用 hyperopt.choice() 函数来选择不同的模型并为每个分类算法指定搜索空间。此选择的标签为\
  \ classifier_type。它将根据搜索空间中给出的标签在目标函数中迭代之前定义的算法类型：\n\n```\nsearch_space = hp.choice('classifier_type',\
  \ [\n    {\n        'type': 'svm',\n        'C': hp.lognormal('SVM_C', 0, 1.0),\n\
  \        'kernel': hp.choice('kernel', ['linear', 'rbf'])\n    },\n    {\n     \
  \   'type': 'rf',\n        'max_depth': hp.quniform('max_depth', 1, 3, 5),\n   \
  \     'criterion': hp.choice('criterion', ['gini', 'entropy'])\n    },\n    {\n\
  \        'type': 'logreg',\n        'C': hp.lognormal('LR_C', 0, 1.0),\n       \
  \ 'solver': hp.choice('solver', ['liblinear', 'lbfgs'])\n    },\n])\n```\n\n搜索空间表达式中内部的\
  \ hyperopt.choice() 函数将 'type' 参数传递给目标函数，后者反过来创建一个名为 classifier_type 的内部变量并使用它来选择适当的算法。然后它将剩余参数传递给模型。请注意，在目标函数中，在创建内部变量后删除了\
  \ 'type' 参数，以避免在目标算法中出现任何可能的命名冲突。\n\n13. 现在，我们必须选择将用于扫描搜索空间的搜索算法。正如我们之前所见，Hyperopt\
  \ 为此提供了两个主要选项：\n\n+   a) `hyperopt.tpe.suggest`: 这是 **Tree of Parzen Estimators\
  \ (TPE)** 算法，这是一种基于贝叶斯的算法，可根据之前的结果自适应地选择超参数。\n+   b) `hyperopt.rand.suggest`: 这是一种随机搜索算法，与\
  \ TPE 算法不同，它是一种非自适应方法，使用搜索空间上的采样策略。\n\n14. 在本示例中，我们将使用 TPE 算法，因此我们将选择 `tpe.suggest`，如下所示：\n\
  \n```\nsearch_algorithm = tpe.suggest\n```\n\n15. 下一步是定义将保存每次试验结果的对象。我们将使用 SparkTrials\
  \ 来跟踪探索的进度并将其记录在 MLflow 中。正如我们之前提到的，我们将使用 SparkTrials 对象而不是原生的 `Trials` Hyperopt\
  \ 对象，因为我们使用的是设计为在单台机器上运行的算法。如果我们使用 MLlib 算法，则必须使用 MLflow API 来跟踪 `Trials` 结果。\n\n\
  反过来，SparkTrials 是一个可以接收两个可选参数的对象，如下所示：\n\n+   a) `parallelism`: 这是并行拟合和评估的算法数量。此参数的默认值等于可用\
  \ Spark 任务槽的数量。\n+   b) `timeout`: `fmin()` 可以运行的最大时间（以秒为单位）。没有最大时间限制。\n\nSpark\
  \ 中 `parallelism` 的默认值是 8。对于此参数的推荐设置是显式将其设置为正值，因为 Spark 任务槽取决于集群的大小。\n\n16. 准备优化运行的最后一步是使用\
  \ `mlflow.start_run()` MLflow 包装器。我们将使用它在 MLflow 平台上记录此次探索的结果。这将自动跟踪运行的进度，以及目标函数和搜索空间中定义的所有变量和标签：\n\
  \n```\nwith mlflow.start_run():\n    best_hyperparams = fmin(\n\n\n```\nfn=objective,\n\
  space=search_space,\nalgo=search_algorithm,\nmax_evals=32,\ntrials= SparkTrials()\n\
  ```\n\n17. `max_evals` 参数允许我们指定将在搜索空间中评估的最大点数。因此，我们可以将此值视为 Hyperopt 将为每个搜索空间拟合和评估的最大模型数量：\n\
  \n```\nsearch_algorithm = tpe.suggest\nwith mlflow.start_run():\n    best_hyperparams\
  \ = fmin(\n        fn=objective,\n        space=search_space,\n        algo=search_algorithm,\n\
  \        max_evals=32,\n        trials= SparkTrials())\n```\n\n* (32) Spark Jobs\n\
  由于请求的并行度为 None 或非正值，并行度将被设置为 (4)，即 Spark 的默认并行度 (4)，或 1，二者中的较大者。我们建议将并行度显式设置为正值，因为\
  \ Spark 任务槽的总数取决于集群规模。\n使用 SparkTrials 的 Hyperopt 将自动在 MLflow 中跟踪试验。要查看与笔记本关联的 MLflow\
  \ 实验，请单击笔记本上下文栏右上角的“Runs”图标。在那里，您可以查看所有运行。\n要查看试验的日志，请检查 Spark executor 日志。要查看 executor\
  \ 日志，请展开上方的“Spark Jobs”，直到看到试验作业的阶段旁边的 (i) 图标。单击它并找到任务列表。单击任务的“stderr”链接以查看试验日志。\n\
  100%|██████████| 32/32 [03:08<00:00, 5.88s/trial, best loss: -0.8359011627906977]\n\
  Total Trials: 32: 32 succeeded, 0 failed, 0 cancelled.\nCommand took 3.16 minutes\
  \ -- by /2021, 14:12:16 on dplearn\n\nFigure 10.5 – Tracking the training run with\
  \ MLflow\n\n18. 执行最终确定后，我们可以检查产生最佳结果的超参数：\n\n```\nimport hyperopt\nprint(hyperopt.space_eval(search_space,\n\
  \                          best_hyperparams))\n```\n\n我们应该在控制台中看到最佳超参数集以“键值字典”的形式打印出来，并附带在搜索空间中为定义的最小化函数找到的最佳参数的名称和值：\n\
  \n```\nCmd 8\n1 import hyperopt\n2 print(hyperopt.space_eval(search_space, best_hyperparams))\n\
  \n{'C': 3.6002403259280142, 'kernel': 'rbf', 'type': 'svm'}\nCommand took 0.02 seconds\
  \ -- by at 30/03/2021, 14:12:24 on dplearn\n```\n\nFigure 10.6 – Best hyperparameters\n\
  \n我们可以通过单击笔记本右上角的实验图标来查看 MLflow 实验。此选项将显示在运行期间获得的所有结果，并且，正如我们之前提到的，允许我们可视化产生最佳结果的超参数和算法集。我们还可以检查特定参数变化的影响。\n\
  \n以这种方式，我们可以同时调整多个模型，并跟踪每个定义搜索空间中模型的性能。借助 Hyperopt 和 MLflow，我们可以轻松定义高级管道，使用 Azure\
  \ Databricks Runtime for Machine Learning 并行微调模型。\n\n## Summary\n\n在本章中，我们了解了 Azure\
  \ Databricks 的一些有价值功能，这些功能允许我们使用 MLflow Model Registry 跟踪训练运行，以及找到机器学习模型的最优超参数集。我们还学习了如何使用\
  \ Hyperopt 优化我们扫描最优参数搜索空间的方式。这是一套很棒的工具，因为我们可以微调具有完整超参数跟踪的模型，这些超参数用于训练。我们还使用自适应搜索策略探索了定义的超参数搜索空间，这比常见的网格和随机搜索策略更优化。\n\
  \n在下一章中，我们将探讨如何使用集成到 Azure Databricks 中的 MLflow Model Registry。MLflow 使跟踪机器学习模型的整个生命周期以及训练过程中使用的所有相关参数和工件变得更容易，但它也允许我们轻松部署这些模型，以便我们可以发出\
  \ REST API 请求来获取预测。MLflow 在 Azure Databricks 中的集成增强了创建和部署机器学习模型的整个工作流程。\n\n### 11"
- "Managing and Serving Models with MLflow and MLeap\n\n在上一章中，我们学习了如何在 Azure Databricks\
  \ 中微调创建的模型。下一步是如何有效地跟踪和使用我们训练的模型。软件开发有明确的方法来跟踪代码，具有暂存或生产版本代码等阶段以及通用代码生命周期管理流程，但将此应用于机器学习模型并不常见。其原因可能各不相同，但一个原因可能是数据科学团队遵循自己的方法论，这可能更接近学术界而不是软件生产，以及机器学习没有明确定义的开发生命周期方法。我们可以在\
  \ Azure Databricks 中将软件中常用的方法论应用于机器学习模型。\n\n本章将重点探讨我们部署的模型和流程如何用于推理。为此，我们必须提供一种打包所用管道的方法，并弄清如何部署它们以提供预测。我们将使用\
  \ MLflow 库更详细地研究这一点，MLflow 是一个开源平台，集成到 Azure Databricks 中，允许我们管理从训练到部署的整个端到端机器学习模型生命周期。\n\
  \nMLflow 允许您跟踪机器学习训练过程。训练过程称为 *experiment*，我们可以访问之前的实验以记录和比较参数，集中模型存储，并将模型作为 **REpresentational\
  \ State Transfer (REST) application programming interface (API)** 部署。我们将学习如何将 MLflow\
  \ 与上一章中学到的工具结合使用。示例将重点关注机器学习算法训练过程的跟踪和记录，以及如何部署和管理模型并对其应用版本控制。\n\n我们将探索的概念如下：\n\n\
  - Managing the machine learning models\n- Model Registry example\n- Exporting machine\
  \ learning pipelines using MLEap\n- Serving models with MLflow\n\n在深入这些概念之前，让我们先回顾一下执行此处所示示例的技术要求。\n\
  \n## Technical requirements\n\n要在此章中练习给出的示例，您需要以下内容：\n\n- An Azure Databricks subscription\n\
  - An Azure Databricks notebook attached to a running cluster with Databricks Runtime\
  \ for Machine Learning (Databricks Runtime ML) with version 7.0 or higher\n\n##\
  \ Managing machine learning models\n\n正如我们之前看到的，在 Azure Databricks 中我们可以使用 MLflow\
  \ Model Registry，它是一个开源平台，用于管理机器学习或深度学习模型的完整生命周期。它允许我们直接管理具有时间顺序血缘、模型版本控制和阶段转换的模型。它为我们提供了诸如\
  \ Experiments 和 Runs 等工具，允许我们快速可视化训练运行和超参数优化的结果，并维护适当的模型版本控制，以跟踪我们可用于服务的模型，并在必要时快速更新当前版本。\n\
  \nMLflow 在 Azure Databricks 中有一个 Model Repository 用户界面 (UI)，我们可以在其中设置我们的模型以响应推理的\
  \ REST API 请求，在阶段之间转换模型，并可视化与模型关联的指标和非结构化数据，例如描述和注释。它使我们能够通过 Model Registry API\
  \ 或直接从 Model Registry UI 管理我们的模型：\n\n![](img/7e45bd08916c2a17d4e75cbb898f41e8_349_0.png)\n\
  \nFigure 11.1 – Models in the MLflow registry\n\n在本节中，我们将学习 MLflow 的核心概念并强化我们在前几章中看到的一些方法。\n\
  \n在我们深入了解如何在 MLflow 中管理模型的具体方法之前，让我们先看看与模型相关的核心概念，如下：\n\n- **Model**：这是实际的 MLflow\
  \ 模型，它使用 mlflow.[model-flavor].log_model 方法从实验或运行中记录到注册表中，之后可以注册到 Model Registry。\n\
  - **Registered Model**：这是一个首先记录到 Model Registry 然后在模型存储库中注册的模型。它应具有唯一名称，并具有版本、血缘和其他相关工件等属性。\n\
  - **Model Stage**：MLflow 中的模型可以处于一个或多个可分配给它的可用阶段。阶段的可用选项为 None、Staging、Production\
  \ 和 Archived。任何具有适当读写权限的用户都可以将模型在阶段之间转换。\n- **Model Version**：这表示模型提交到存储库的次数。这意味着当我们注册模型时，它会被分配版本\
  \ 1，每次使用相同名称注册模型时，版本都会递增。\n\n\n\n\n\n- **Activities:** 模型所经历的每个事件，例如阶段转换、新版本被注册等。这使我们能够在整个生命周期中更详细地跟踪模型。\n\
  - **Description:** 我们可以添加到模型上的非结构化元数据，以便更好地了解模型的用途，以及与其开发或使用相关的任何其他数据。\n\n通过对 Azure\
  \ Databricks 中 MLflow Model Registry 模型基本概念的这一非常简要的描述，我们可以开始学习如何注册模型、在阶段之间转换它，以及如何使用注册表中的可用模型。这些概念将在下一节中更详细地展示。\n\
  \n## 使用 MLflow notebook 实验\n\n正如我们在前几节中看到的，在 Azure Databricks notebook 中使用 MLflow\
  \ `mlflow.start_run()` 会将运行中使用的指标和参数作为活动实验记录下来。每个实验都有一个 run ID，这是一个唯一的数字标识符。我们可以通过单击\
  \ notebook 工具栏中的 Experiment 按钮来可视化 notebook 实验及其对应的运行。这将向我们展示运行参数和相关指标。我们也有下载运行中使用的所有相关工件的选项。\n\
  \n我们无法删除 notebook 实验，因为它们是 notebook 本身的一部分。这一点很重要，因为如果我们使用 `MLflow Client.tracking.delete_experiment()`，它也会删除\
  \ notebook 本身。\n\n所有 MLflow 运行都将被记录到活动实验中。如果没有活动实验，Azure Databricks 将创建一个新的。我们可以通过以下方式设置要记录工件的活动实验：\n\
  \n- 使用 `mlflow.set_experiment()` 指定要记录运行的实验\n- 将实验 ID 设置为 `mlflow.start_run()` 命令的参数\n\
  - 设置名为 `MLFLOW_EXPERIMENT_NAME` 或 `MLFLOW_EXPERIMENT_ID` 的环境变量\n\n如果我们未指定任何实验，运行将被记录到\
  \ notebook 实验中。\n\n值得注意的是，MLflow 中有两种类型的实验，概述如下：\n\n- **Workspace experiment**:\
  \ 这与任何 notebook 都没有关联。任何作业或 notebook 都可以通过指定 workspace 实验 ID 将运行记录到其中一个实验中。\n- **Notebook\
  \ experiment**: 这与特定 notebook 相关联，并且是在未将实验 ID 作为运行参数传递时的默认选项。只有该特定 notebook 内的 MLflow\
  \ 运行才能记录到 Notebook 实验中。\n\nWorkspace 实验可以在 Azure Databricks Workspace UI 中创建，也可以通过使用\
  \ MLflow API 创建：\n\n- 我们可以使用实验的运行来查询其上使用的指标和参数。例如，如果我们想查询实验中 **R-squared (R2)**\
  \ 指标大于 0.3 的运行，我们可以进入 Notebook 工具栏中 Experiment 选项卡的 Search Runs 字段并输入以下表达式：\n\n\
  ```\nmetrics.r2 > 0.3\n```\n\n- 以类似的方式，我们可以使用以下语法筛选具有特定参数集的运行：\n\n```\nparams.max_depth\
  \ = 4\n```\n\n```\nparams.max_depth = 4 AND metrics.accuracy > 0.8\n```\n\n- 你也可以选择通过在\
  \ Search Runs 框中使用 Filter 选项，根据模型的状态或版本筛选运行。你可以访问包含 State 和 Linked models 的下拉菜单。\n\
  - 我们可以通过以下方式跟踪用于运行的 Notebook 或 Git 项目的版本：\n\n  a) 如果该运行是由 Azure Databricks notebook\
  \ 或作业创建的，我们可以单击运行的 **Source** 字段。\n\n  b) 如果运行是由 Git 项目创建的，运行的 **Source** 字段将是用于触发运行的\
  \ Git 项目分支的链接。\n\n- 最后，如果是 workspace 实验并且运行已记录到该实验中，模型将显示为可在 Model Registry UI 中注册模型页面下载的工件。\n\
  \n现在我们对实验和运行的概念有了更多的了解，我们将在下一节中学习如何在 Azure Databricks 中注册和管理机器学习或深度学习模型的生命周期。\n\n\
  ## 使用 MLflow API 注册模型\n\n如前所述，我们有多种方式可以在 MLflow Model Registry 中注册模型。我们可以非常简单地使用\
  \ MLflow API 通过使用 `mlflow.[model-flavor].log_model` 方法来记录并注册模型到注册表中。如果没有以相同名称注册过其他模型，它将返回一个\
  \ ModelVersion MLflow 对象，并将此第一个模型命名为 Version 1。如果我们已有同名模型，它将增加模型版本并返回模型的新当前版本：\n\
  \n- 以下代码片段中展示了一个示例，使用 Azure Databricks 中的 Python MLflow API：\n\n```\nwith mlflow.start_run(run_name=<run-name>)\
  \ as run:\n    <train and evaluate the model>\n    mlflow.<model-flavor>.log_model(<model-flavor>=<model>,\n\
  \        artifact_path=\"<model-path>\",\n        registered_model_name=\"<model-name>\"\
  \n    )\n```\n\n- 我们也可以在实验中的训练结束后，使用指定的模型名称注册模型。这在我们开发了多个模型并且想将其中一个特定模型注册到注册表时特别有用。我们可以通过使用\
  \ `mlflow.register_model()` 方法并将模型路径作为参数传递来实现。可以通过以下方式完成：\n\n```\nresult_model=mlflow.register_model(\n\
  \"runs:<new_model_path>\",\n\"<model-to-update-name>\")\n```\n\n如果我们已有同名模型，这将更新模型的版本；否则，它将创建一个新模型并命名为\
  \ Version 1。\n\n- 此外，我们还可以使用 MLflow `create_registered_model()` 方法创建新的注册模型，如以下代码片段所示。虽然这种方法与之前的方法类似，但如果模型已在\
  \ Model Registry 中存在，此方法将引发 `MlflowException` 错误：\n\n```\nclient = MlflowClient()\n\
  result = client.create_registered_model(\"<model-name>\")\n```\n\n现在我们已将模型注册到 MLflow\
  \ Model Registry 中，我们可以控制模型的状态。我们将在下一节中了解如何做到这一点。\n\n## 转换模型阶段\n\n我们之前提到过，可以为模型分配多个阶段。具体来说，这些阶段是\
  \ None、Staging、Production 和 Archived。与其他数据工程环境中常见的情况一样，Staging 阶段是所有处于实验或测试阶段的模型所在的位置，而\
  \ Production 阶段则是所有经过测试并现正被生产流程消费的模型所在的位置。最后，Archived 阶段是我们放置已被更新版本取代或计划删除的模型的位置。模型的阶段不是排他的，因此一个模型可以属于多个阶段。\n\
  \n任何具有适当权限的用户都可以请求将模型转换到另一个阶段，但如果你拥有完全权限，你可以无需中介完成此转换。如果你在此模型的权限不足，请求可以由具有更高访问权限的人进行审核。\n\
  \n你可以在 Model Registry UI 中看到有关转换模型的请求，如以下屏幕截图所示：\n\n![](img/7e45bd08916c2a17d4e75cbb898f41e8_353_0.png)\n\
  \n图 11.2 – 请求将模型移动到另一个阶段\n\n我们将按如下方式开始转换：\n\n1. 要在阶段之间转换模型，我们可以使用 Model Registry\
  \ UI 或 MLflow API 以编程方式执行此操作。为此，我们可以使用 `transition_model_version_stage()` 方法，如以下代码片段所示：\n\
  \n```\nclient = MlflowClient()\nclient.transition_model_version_stage(\n    name=\"\
  <our_model>\",\n    version=<model-version>,\n    stage=\"<target_stage>\",\n  \
  \  description=\"<description>\"\n)\n```\n\n\n\n\n\nAs mentioned before, we can\
  \ pass the next possible values in the stage argument of the transition_model_version_stage()\
  \ method:\n\n- a) staging\n- b) archived\n- c) production\n- d) none\n\n2. The description\
  \ parameter allows us to pass any relevant information regarding that model. For\
  \ example, you can include what the purpose of the development of that model was\
  \ or which kind of approach was taken when it was built, and why. We can just update\
  \ the description of the model by using the MLflow update_model_version() method,\
  \ as we can see in the following code example:\n\n```\nmlflow_client = MlflowClient()\n\
  mlflow_client.update_model_version(\n    name=\"<model-name>\",\n    version=<model-version>,\n\
  \    description=\"<updated_description>\"\n)\n```\n\n3. We can also just update\
  \ the name of a registered model, using the MLflow client.rename_registered_model()\
  \ method. Conceptually, we can do this in the following way:\n\n```\nmlflow_client=MlflowClient()\n\
  mlflow_client.rename_registered_model(\"<model-name>\", \"<new-name>\")\n```\n\n\
  4. If we are not sure about the model name and version that we want to update, we\
  \ can always get a list of all registered models in the Model Registry by calling\
  \ the MLflow client API list_model_versions() method, as is conceptually shown in\
  \ the following code snippet:\n\n```\nfrom pprint import pprint\nmlflow_client =\
  \ MlflowClient()\nall_models = [pprint(rm) for rm in mlflow_client.list_registered_models()]\n\
  ```\n\n5. If you want to find the current version of a specified model name and\
  \ fetch all the details, we can use the MLflow client search_model_version() method,\
  \ as illustrated in the following code snippet:\n\n```\nfrom pprint import pprint\n\
  ml_client= MlflowClient()\n[pprint(mv) for mv in client.search_model_versions(f\"\
  name={model_name}\")]\n```\n\n6. If we want to remove a specific model version,\
  \ we can specify a list of versions that we want to delete and use the MLflow client\
  \ delete_model_version() method. For example, if we wanted to delete versions 1\
  \ and 2 of the house_price_classifier model, we would run the following code:\n\n\
  ```\nclient = MlflowClient()\nversions = [1, 2]\nfor version in versions:\n    client.delete_model_version(name=\"\
  house_price_classifier\", version=version)\n```\n\nIn this section, we have gone\
  \ through some of the most common methods to manage the model lifecycle with MLflow.\
  \ The next section will be a full working example in which we will train a simple\
  \ model, register it on the Model Registry, and use it to do inference on a new\
  \ observation once it has been deployed.\n\n## Model Registry example\n\nIn this\
  \ section, we will go through an example in which we will develop a machine learning\
  \ model and use the MLflow Model Registry to save it, manage the stages in which\
  \ it belongs, and use it to make predictions. The model will be a Keras neural network,\
  \ and we will use the Windfarm US dataset to predict the power output of wind farms\
  \ based on parameters from weather conditions such as wind direction, speed, and\
  \ air temperature. We will make use of MLflow to keep track of the stage of the\
  \ model and be able to register and load it back again to make predictions:\n\n\
  - 1. First, we will retrieve the dataset that will be used to train the model. We\
  \ will use the pandas read_csv() function to load directly from the Uniform Resource\
  \ Identifier (URI) of the file in GitHub, as follows:\n\n```\nimport pandas as pd\n\
  wind_farm_data = pd.read_csv(\"https://github.com/dbcuzumar/model-registry-demo-notebook/raw/master/dataset/windfarm_data.csv\"\
  , index_col=0)\n```\n\nThe dataset has predictive features such as the wind speed,\
  \ direction, and air temperature taken every 8 hours, and as a target the total\
  \ daily power output over a period of 7 years. Our objective will be to train a\
  \ deep learning neural network to predict the power output of a farm given these\
  \ predictive features.\n\n2. After the data has been loaded into a Pandas DataFrame,\
  \ we will split the data into training and validation data, as follows:\n\n```\n\
  training_data = pd.DataFrame(wind_farm_data[\"2014-01-01\":\"2018-01-01\"])\ntraining_data_x\
  \ = training_data.drop(columns=\"power\")\ntraining_data_y = training_data[\"power\"\
  ]\nvalidation_data = pd.DataFrame(wind_farm_data[\"2018-01-01\":\"2019-01-01\"])\n\
  validation_x= validation_data.drop(columns=\"power\")\nvalidation_y = validation_data[\"\
  power\"]\n```\n\n3. The next step is to define a model that will be used to make\
  \ predictions on new data. We will define a simple TensorFlow Keras model that we\
  \ can use in the following way:\n\n```\nimport tensorflow as tf\nfrom tensorflow.keras.layers\
  \ import Dense\nfrom tensorflow.keras.models import Sequential\nmodel = Sequential()\n\
  model.add(Dense(120,\n    input_shape=( training_data_x.shape[-1],),\n    activation=\"\
  relu\",\n    name=\"hidden_layer\"))\nmodel.add(Dense(1))\n```\n\n4. We have defined\
  \ a simple neural network with one single hidden layer of 120 neurons with a ReLU\
  \ activation function. The output is a single dense layer of a single cumulative\
  \ neuron. The next step is to compile the model, for which we will use mean-squared\
  \ error (MSE) as the performance metric and Adam as optimizer, and fit it on the\
  \ training data. To register the model into the MLflow Model Registry, we will use\
  \ the MLflow with the mlflow.start_run() method and the mlflow.tensorflow.autolog()\
  \ method to automatically capture all the model artifacts and parameters.\n\nThe\
  \ code is shown in the following snippet:\n\n```\nimport mlflow\nimport mlflow.keras\n\
  import mlflow.tensorflow\nwith mlflow.start_run():\n    mlflow.tensorflow.autolog()\n\
  \    model.compile(loss=\"mse\", optimizer=\"adam\")\n    model.fit(training_data_x,\
  \ training_data_y,\n              epochs=100, batch_size=32,\n              validation_split=.2)\n\
  \    run_id = mlflow.active_run().info.run_id\n```\n\n5. This will start the training\
  \ process, and you will see the results of each one of the epochs in the console,\
  \ as follows:\n\n![](img/7e45bd08916c2a17d4e75cbb898f41e8_357_0.png)\n\nFigure 11.3\
  \ – Tracking the training of the model using MLflow\n\nThe model has now been logged\
  \ in to the MLflow Model Registry, and all the related artifacts and performance\
  \ metrics can be tracked there. We can now register the model using the MLflow API\
  \ or the Model Registry UI in the Azure Databricks workspace:\n\n- 1. To create\
  \ a new registered model using the API, we can use the mlflow.register_model() function.\
  \ This way, we will create a new model with a Version 1 name. We will specify a\
  \ path where the model will be stored and a model name to do this, as follows:\n\
  \n```\nmodel_path = \"wind_farm_model\"\nmodel_name = \"power_output_forecast\"\n\
  model_uri = f\"runs:/{run_id}/model\"\nmodel_details = \\\nmlflow.register_model(model_uri=model_uri,\n\
  \    name=model_name)\n```\n\n- 2. We can use MLflow not only to store the model\
  \ artifacts but also to provide valuable context relating to the development of\
  \ the model using descriptions and keeping lineage control, stating the model's\
  \ version, as illustrated in the following code snippet:\n\n```\nfrom mlflow.tracking.client\
  \ import MlflowClient\ndescription=\"This model was trained as an example for the\
  \ Azure Databricks book with data from US wind farms to predict the power output\
  \ based on wind speed, direction and air temperature.\"\nmflow_client = MlflowClient()\n\
  mflow_client.update_registered_model(\n    name=model_details.name,\n    description=\
  \ description\n)\n```\n\nProviding meaningful descriptions helps to keep track of\
  \ the purpose of the context of the development of the model, provide details about\
  \ its attributes and usage, and—particularly—explicit the algorithm that was used\
  \ and the data source used in the training. Descriptions then can be used to do\
  \ the following:\n\n- a) Provide context that drives the development of the model.\n\
  - b) Mention the methodology used and algorithm selected.\n- c) State differences\
  \ between different versions of the same model.\n- d) Provide a high-level description\
  \ of the data sources and feature engineering methods applied.\n\nNow that we have\
  \ properly described the model registered in MLflow, we can set it to one of the\
  \ available stages. To do this, you will need to have the proper permissions at\
  \ the user or model level. As mentioned before, we can choose to place our model\
  \ in the None, Staging, Production, or Archived stage.\n\n3. To transition a model\
  \ between stages, we can use the MLflow client API `update_model_version()` method.\
  \ If you don't have the appropriate level of permission, you can create a request\
  \ for a model stage transition using the REST API. We will transition our model\
  \ to the Production stage in the following code example:\n\n```\nmflow_client.transition_model_version_stage(\n\
  \    name=model_details.name,\n    version=model_details.version,\n    stage='Production',\n\
  )\n```\n\nThis results in the following output:\n\n```\nCmd 17\n1 from mlflow.tracking.client\
  \ import MlflowClient\n2\n3 mflow_client = MlflowClient()\n4\n5 mflow_client.transition_model_version_stage(\n\
  6     name=model_details.name,\n7     version=model_details.version,\n8     stage='Production',\n\
  9 )\n```\n\nOut[30]: <ModelVersion: creation_timestamp=1617109202500, current_stage='Production',\
  \ description ='', last_updated_timestamp=1617109209073, name='power_output_forecast',\
  \ run_id='23d4e110709446b48931ffe518cc6165', run_link='', source='dbfs:/databricks/mlflow-tracking/197254732634776/23d4e110709446b48931ffe518cc6165/artifacts/model',\
  \ status='READY', status_message='', tags={}, user_id='7882912336567795', version='4'>\n\
  \nFigure 11.4 – Transitioning the stage of a model\n\n\n\n\n\n4. 我们可以使用 MLflow 客户端\
  \ API 的 `get_model_version()` 方法来验证当前模型的阶段为 Production，如下所示：\n\n```\nmodel_vs =\
  \ mflow_client.get_model_version(\n    name=model_details.name,\n    version=model_details.version,\n\
  )\nprint(f\"The current model stage is: '{ model_vs.current_stage }'\"\n```\n\n\
  5. 模型现在已在 Model Registry 中处于 Production 阶段，因此我们可以使用它来利用新数据预测风电场的功率输出。我们将加载指定阶段的最新版本模型并用它在验证数据上进行预测，如下所示：\n\
  \n```\nfrom mlflow.tracking.client import MlflowClient\nmflow_client = MlflowClient()\n\
  model_name = \"power_output_forecast\"\nmodel_stage = 'Production'\nmodel_version\
  \ = mflow_client.get_latest_versions(model_name, stages=[model_stage])[0].version\n\
  model_uri = f\"models:/{model_name}/{model_stage}\"\nmodel = mlflow.pyfunc.load_model(model_uri)\n\
  power_predictions = pd.DataFrame(model.predict(validation_x))\npower_predictions.index\
  \ = pd.to_datetime(weather_data.index)\nprint(power_predictions)\n```\n\nMLflow\
  \ 注册表通过跟踪模型的版本，使我们能够对不同阶段的模型建立血缘关系。我们可以在流行的机器学习和深度学习框架（如 scikit-learn 和 TensorFlow）中训练和开发新模型，并以非常简单的方式将它们部署到\
  \ staging 或 production 环境中。此外，MLflow 库确保在我们将模型转换到不同阶段或创建新版本后，应用程序代码仍能正常工作。\n\n在本示例中，我们简要展示了如何在\
  \ Azure Databricks 中创建新的 TensorFlow Keras 模型并使用 Python 以编程方式通过 MLflow Model Registry\
  \ 管理其生命周期是多么简单。\n\n在下一节中，我们将使用流行的 scikit-learn 框架创建功率预测模型的新版本，在 Staging 中执行模型测试，并通过将新模型版本转换到\
  \ Production 来更新生产模型。\n\n## 使用 MLeap 导出和加载管道\n\n当我们训练机器学习或深度学习模型时，我们的意图是能够多次使用它来预测数据的新的观测值。为此，我们不仅必须能够存储模型，还必须能够将其重新加载到一个或多个平台中。因此，我们需要将模型序列化以供将来评分或预测使用。\n\
  \nMLEap 是用于序列化并执行在流行框架（如 Apache Spark、scikit-learn 和 TensorFlow）中创建的机器学习和深度学习管道的常用格式。它通常用于进行单次预测而不是批量预测。这些序列化管道称为\
  \ bundles，可以导出为模型，并在以后加载并部署回 Azure Databricks 以进行新的预测。\n\n在本节中，我们将学习如何使用 MLEap 导出并重新加载一个\
  \ DecisionTreeClassifier MLlib 模型，以便在 Azure Databricks 中使用保存的管道进行预测。我们将遵循的步骤如下：\n\
  \n- 我们将创建一个使用 MLlib 模型构建的管道并对其进行拟合。\n- 我们将使用 MLEap 将管道序列化并导出为 ZIP 文件并保存它。\n- 我们将重新加载序列化的模型并使用它对新的未见数据进行预测。\n\
  \n需要注意的是，MLEap 已包含在 Azure Databricks Runtime ML 中，因此如果您使用的是通用运行时，您需要在集群或笔记本级别从 Maven\
  \ 仓库安装 MLEap-Spark 包，以及作为 PyPi 包的 MLflow，以便跟踪实验运行并能够将模型也保存到 MLflow Model Registry\
  \ 中：\n\n1. 第一步将是创建我们稍后将序列化和重用的管道。我们将创建一个 MLlib DecisionTreeClassifier，用于预测可在 Azure\
  \ Databricks 中获得的 News 示例数据集的标签。我们将首先通过运行以下代码读取用于训练模型的数据并将其缓存到工作节点的内存中：\n\n```\n\
  training_data = spark.read.parquet(\"/databricks-datasets/news20.binary/data-001/training\"\
  ).select(\"text\", \"topic\")\ntraining_data.cache()\n```\n\n2. 数据缓存后，我们可以将其可视化并显示\
  \ Spark 数据帧的架构，如下所示：\n\n```\ndisplay(training_data)\n\ntraining_data.printSchema()\n\
  ```\n\n3. 我们模型的目的是根据我们拥有的训练数据推断新条目的主题。你可以在以下屏幕截图中看到架构的第一行：\n\n![](img/7e45bd08916c2a17d4e75cbb898f41e8_362_0.png)\n\
  \n图 11.5 – 训练数据架构和第一行\n\n4. 数据加载后，我们可以定义管道。我们必须应用特征工程，将作为输入的非结构化文本数据转换为 DecisionTreeClassifier\
  \ MLlib 模型可以消费的数值特征。为此特征工程，我们将使用 StringIndexer、Tokenizer 和 HashingTF PySpark 转换器，使用词频-逆文档频率（TF-IDF）方法从文本中提取特征。我们将通过定义用于提取特征的预处理函数来开始定义管道，如下所示：\n\
  \n```\nfrom pyspark.ml.feature import StringIndexer, Tokenizer, HashingTF\n\nlabel_indexer\
  \ = StringIndexer(\ninputCol=\"topic\",\noutputCol=\"label\",\nhandleInvalid=\"\
  keep\")\ntokenizer = Tokenizer(inputCol=\"text\",\n                    outputCol=\"\
  words\")\nhashing_tf = HashingTF(inputCol=\"words\",\n                       outputCol=\"\
  features\")\n```\n\n5. 接下来，我们可以定义将要使用的模型。如前所述，我们将使用 MLlib DecisionTreeClassifier，因为它支持多标签分类。以下是我们将用于定义模型的代码：\n\
  \n```\nfrom pyspark.ml.classification import DecisionTreeClassifier\nclassifier\
  \ = DecisionTreeClassifier()\n```\n\n6. 现在，我们可以非常简单地将 MLlib 管道定义为特征提取操作和我们选择的分类模型的串联，如下所示：\n\
  \n```\nfrom pyspark.ml import Pipeline\npipeline = Pipeline(stages=[label_indexer,\
  \ tokenizer,\n                           hashing_tf, dt])\n```\n\n7. 下一步是训练并调优我们刚刚定义的管道。为此，我们将使用\
  \ CrossValidator MLlib 类来微调 TF-IDF 过程中使用的特征数量。在以下代码块中，我们将为提取的特征数量定义参数网格，并定义要在管道上运行的交叉验证：\n\
  \n```\nfrom pyspark.ml.evaluation import MulticlassClassificationEvaluator\nfrom\
  \ pyspark.ml.tuning import CrossValidator, ParamGridBuilder\nhyperparam_grid = ParamGridBuilder().addGrid(\n\
  hashing_tf.numFeatures, [500, 750, 1000]).build()\ncv = CrossValidator(estimator=pipeline,\n\
  evaluator=MulticlassClassificationEvaluator(),\nestimatorParamMaps=hyperparam_grid)\n\
  ```\n\n8. 接下来，我们将在训练数据上拟合 CrossValidator 并为指定的超参数搜索空间保存找到的最佳模型，如下所示：\n\n```\ncv_model\
  \ = cv.fit(training_data)\nmodel = cv_model.bestModel\n```\n\n9. 最后，我们可以使用模型对数据进行预测，如以下屏幕截图所示：\n\
  \n![](img/7e45bd08916c2a17d4e75cbb898f41e8_364_0.png)\n\n图 11.6 – MLflow 日志显示模型正在被跟踪\n\
  \n10. 在这里，我们将模型应用于用于训练它的数据，如下所示：\n\n```\npredictions = model.transform(training_data)\n\
  display(predictions)\n```\n\n这会产生以下输出：\n\n![](img/7e45bd08916c2a17d4e75cbb898f41e8_364_1.png)\n\
  \n图 11.7 – 文本主题的预测\n\n到目前为止，我们还没有引入任何重大复杂性，我们的模型仍然只在当前环境中可用。我们仍然需要将此管道转换为可以导出到其他环境以对新数据进行预测的序列化\
  \ bundle。\n\n\n\n\n\n11. 我们将使用 MLeap 将模型序列化为单个 ZIP 文件。我们将创建一个目录来保存我们序列化的模型，如以下代码片段所示：\n\
  \n```\n%sh\nmkdir /tmp/mleap__serialized_pipeline\n```\n\n12. 目录创建完成后，我们可以使用 SimpleSparkSerializer\
  \ MLeap 函数序列化模型，如下所示：\n\n```\nimport mleap.pyspark\nfrom mleap.pyspark.spark_support\
  \ import SimpleSparkSerializer\nmodel_path=\"/tmp/mleap__serialized_pipeline\"\n\
  model_filename=\"serialized_pipeline.zip\"\nmodel_uri=f\"jar:file://{model_path}/{model_filename}\"\
  \nmodel.serializeToBundle(model_uri, predictions)\n```\n\n现在，MLlib 管道已序列化为单个 ZIP\
  \ 文件 bundle。请务必记住，当序列化 bundle 为 ZIP 文件时，模型 URI 必须以 jar:file 开头并以 zip 结尾。\n\n13.\
  \ 作为下一步，我们将把文件从临时目录复制到 Databricks 文件系统中的位置。这样，我们将模拟从诸如 MLflow 的模型注册表或 Blob 或数据湖存储中获取序列化\
  \ ZIP 文件 bundle 的情况。要将文件从临时目录复制到 Databricks 文件系统，我们可以使用 dbutils 工具，如以下代码片段所示：\n\n\
  ```\ndbutils.fs.cp(f\"file://{model_path}/{model_filename}\", f\"dbfs:/data/{model_name}\"\
  )\ndisplay(dbutils.fs.ls(\"dbfs:/data\"))\n```\n\n14. 在实现的下一部分中，我们将加载并反序列化管道。我们可以在不同的执行上下文中使用它，从而使我们能够使用序列化管道进行新的预测。我们可以加载刚刚序列化并保存在\
  \ Databricks 文件系统中的管道，如以下代码片段所示：\n\n```\nfrom pyspark.ml import PipelineModel\n\
  model_path=\"/tmp/mleap__serialized_pipeline\"\nmodel_filename=\"serialized_pipeline.zip\"\
  \n```\n\n```\nmodel_uri=f\"jar:file:{model_path}/{model_filename}\"\n\ndeserialized_pipeline\
  \ = PipelineModel.\n    deserializeFromBundle(model_uri)\n```\n\n我们已加载并反序列化了管道，现在它可用于对未见数据进行预测。这在我们使用\
  \ Spark 环境训练模型，但之后该管道需要在非 Spark 应用程序中使用时尤其有用。如果您打算仅使用 Spark 进行预测，建议使用 MLlib 内置方法来持久化和加载模型。\n\
  \n15. 让我们加载一些测试数据以使用反序列化管道进行预测。我们将加载并显示示例 News 数据集的测试部分，如下所示：\n\n```\ntest_data\
  \ = spark.read.parquet(\"/databricks-datasets/news20.binary/data-001/test\").select(\"\
  text\", \"topic\")\ntest_data.cache()\ndisplay(test_data)\n```\n\n16. 现在，我们将使用反序列化管道对测试数据进行预测，如下所示：\n\
  \n```\npredictions = deserialized_pipeline.transform(test_data)\ndisplay(predictions)\n\
  ```\n\n17. 如以下屏幕截图所示，我们能够通过传递与用于拟合管道的数据具有相同模式的新数据来获得预测：\n\n![](img/7e45bd08916c2a17d4e75cbb898f41e8_366_0.png)\n\
  \n当我们打算在 Spark 环境之外运行预测时，MLeap 序列化很有用，因为它将整个管道打包到序列化 ZIP 文件格式 bundle 中。运行预测的应用程序应基于\
  \ Scala 或 Java，因为 MLeap 具有基于其自身类型的数据帧的格式，称为 LeapFrames。作为最后一个概念，我们可以将 MLeap 视为用于序列化机器学习模型的\
  \ MLflow 格式的替代方案。\n\n下一节将介绍如何使用 MLflow 在 Azure Databricks 上提供模型示例。\n\n## 使用 MLflow\
  \ 提供模型\n\n在 Azure Databricks 中使用 MLflow 作为机器学习模型的存储库的好处之一是，它允许我们将来自模型注册表的预测作为 REST\
  \ API 端点轻松提供。这些端点会在每个阶段的模型更新时自动更新，因此这是使用 MLflow 模型注册表跟踪模型生命周期的补充功能。\n\n启用模型作为 REST\
  \ API 端点提供可以从 Azure 工作区中的模型注册表 UI 进行。要启用模型提供，请转到模型注册表 UI 中的模型页面并单击提供选项卡中的启用提供按钮。\n\
  \n单击按钮后，如以下屏幕截图所示，您应该会看到状态为待处理。几分钟后，状态将更改为就绪：\n\n![](img/7e45bd08916c2a17d4e75cbb898f41e8_367_0.png)\n\
  \n图 11.9 – 启用模型的提供\n\n如果您想禁用模型的提供，可以在注册模型的页面上的提供选项卡上单击停止按钮。\n\n要向已部署的模型发出请求，我们需要知道其唯一的\
  \ URI。已部署模型的 URI 也取决于模型的版本，因此生成的 URI 类似于这样：\n\n```\n<databricks-instance>/model/<registered-model-name>/<model-version>/invocations\n\
  ```\n\n如果我们有一个名为 house_classifier 的模型，并且我们想知道该模型版本 3 的 URI，代码将如下所示：\n\n```\nhttps://<your_databricks-instance>/model/house_classifier/3/invocations\n\
  ```\n\n如果该模型分配了特定阶段，则它也包含在端点的 URI 中。例如，前一个模型的生产阶段将具有如下的 URI 端点：\n\n```\nhttps://<your_databricks-instance>/model/house_classifier/Production/invocations\n\
  ```\n\n您可以在 MLflow UI 中注册模型的提供页面上的模型版本选项卡顶部看到提供模型的可用 URI 列表。\n\n您可以通过向其中一个可用端点发出\
  \ REST API 请求或使用 Azure 工作区中的模型提供 UI 来测试已部署的模型。\n\nAzure Databricks 在启用注册模型提供时会创建唯一的集群，并部署除已归档版本之外的所有模型版本。如果发生任何错误，Azure\
  \ Databricks 将重新启动集群，如果您禁用提供，它将终止集群。如前所述，当我们更新正在提供的模型的版本时，该模型提供也会自动更新。为了能够查询这些端点，我们只需使用生成的\
  \ Databricks 访问令牌对自己进行身份验证即可。\n\nMLflow 模型提供旨在用于低吞吐量且非关键，使用限制为每个请求 16 兆字节 (MB)。对于需要更高吞吐量的应用程序，您应考虑使用批量预测。使用的集群都是通用集群，因此它们将具有与这些集群相同的可扩展性配置。\n\
  \n请注意，即使不存在活动的模型版本，集群也会被维护，因此如果注册的模型不再需要，您应始终禁用其提供。\n\n## 对模型进行评分\n\n对 MLflow 已部署模型进行评分的最直接方法是测试模型在提供\
  \ UI 中。在那里，您可以插入结构化为 **JavaScript Object Notation (JSON)** 格式的数据并使用它通过单击发送请求按钮来测试模型。这样，我们可以确保模型返回有效的预测。\n\
  \n下一步显然是通过向可用端点发出 REST API 请求来使用此模型所做的预测。\n\n例如，我们可以使用 curl bash 命令向模型发出请求。例如，对于给定的模型，我们可以按以下代码片段所示结构化请求：\n\
  \n```\ncurl -X POST -u token:$DATABRICKS_API_TOKEN $MODEL_VERSION_URI \\\n  -H 'Content-Type:\
  \ application/json' \\\n  -d '[\\n    {\\n        \"sepal_length\": 4.2,\\n    \
  \    \"sepal_width\": 3.1,\\n        \"petal_length\": 2.1,\\n        \"petal_width\"\
  : 0.1\\n    }\\n]'\n```\n\n在此示例中，我们将请求传递给在 Iris 数据集上训练的简单分类器。您应将端点中的 DATABRICKS_API_TOKEN\
  \ 和 MODEL_VERSION_URI 占位符分别替换为您生成的 Databricks API 令牌和模型 URI。\n\n在这里，我们将 JSON 作为键值结构化数据传递并从模型端点接收响应。\n\
  \n我们也可以使用 Python 以编程方式执行此操作。在下一个示例中，我们将使用 Pandas DataFrames 和 NumPy 数组向端点发出请求：\n\
  \n- 1. 首先，我们将定义一个函数来将数据序列化为 JSON，如下所示：\n\n```\nimport numpy as np\nimport pandas\
  \ as pd\ndef create_tf_serving_json(data):\n```\n\n\n\nreturn {'inputs': {name:\
  \ data[name].tolist() for name in data.keys()} if isinstance(data, dict) else data.tolist()}\n\
  \n2. 然后，我们可以使用将传递给模型进行预测的数据创建一个 Pandas 数据框，如下所示：\n\n```\ndata = pd.DataFrame([{\n\
  \    \"sepal_length\": 4.2,\n    \"sepal_width\": 3.1,\n    \"petal_length\": 2.1,\n\
  \    \"petal_width\": 0.1\n}])\n```\n\n3. 现在，我们可以将此数据序列化为 JSON 并作为 POST 请求发送到模型端点，如下所示：\n\
  \n```\nimport requests\nheaders = {\n    \"Authorization\": f\"Bearer {databricks_token}\"\
  ,\n    \"Content-Type\": \"application/json\",\n}\ndata_json = data.to_dict(orient='records')\n\
  response = requests.request(method='POST',\n                            headers=headers,\n\
  \                            url=model_uri,\n                            json=data_json)\n\
  if response.status_code != 200:\n    raise Exception(f\"Request failed with status\
  \ {response.status_code}, {response.text}\")\nprint(response.json())\n```\n\n这样，我们就可以使用\
  \ Pandas 数据框对模型进行评分，但我们也可以使用 NumPy 数组，因为两者都具有将数据序列化为字典的方法，这些字典可以轻松转换为 JSON 格式。\n\
  \n4. 在这里，我们将数据作为 NumPy 数组传递：\n\n```\ndata = np.array([[5.1, 3.5, 1.4, 0.2]])\ndata_json\
  \ = create_tf_serving_json(data)\nresponse = requests.request(method='POST',\n \
  \                           headers=headers,\n                            url=model_uri,\n\
  \                            json=data_json)\nif response.status_code != 200:\n\
  \    raise Exception(f\"Request failed with status {response.status_code}, {response.text}\"\
  )\nprint(response.json())\n```\n\n在模型注册表 UI 的 **Serving** 选项卡中，您将被提示提供服务集群的状态以及可用的各个模型版本的数据及其\
  \ URI。您可以在 **Model Events** 选项卡中检查集群的状态，该选项卡还保存与该模型关联的所有事件的数据。您也可以在 **Model Versions**\
  \ 选项卡中查询特定版本事件。\n\n## Summary\n\n机器学习模型的开发过程可能是一项复杂的工作，因为该学科本身具有混合背景，并且通常与常见的软件开发生命周期脱节。此外，如果我们无法导出用于提取数据特征的预处理管道，在将模型从开发转移到生产时，我们将遇到问题。\n\
  \n正如本章所述，我们可以使用 MLflow 来管理模型生命周期并对使用的模型应用分级和版本控制，并有效地序列化预处理管道以用于预处理待推断的数据。\n\n在下一章中，我们将探讨分布式学习的概念，这是一种可以将深度学习模型的训练过程有效地分发给许多工作者的技术。\n"
- "## 12 Distributed Deep Learning in Azure Databricks\n\n在上一章中，我们学习了如何在 Azure Databricks\
  \ 中有效地序列化机器学习管道并管理机器学习模型的完整开发生命周期。本章将重点介绍如何在 Azure Databricks 中应用分布式训练。\n\n深度学习模型的分布式训练是一种将训练过程分布在计算机集群中的工作者中的技术。此过程并不简单，其实现需要我们微调工作者之间通信和传输数据的方式，否则分布式训练可能比单机训练花费更长时间。Azure\
  \ Databricks Runtime for Machine Learning 包含 Horovod，这是一个库，可以让我们解决分布式训练深度学习算法时出现的大多数问题。我们还将展示如何利用\
  \ TensorFlow 机器学习框架的原生 Spark 支持在 Azure Databricks 中训练深度学习模型。\n\n本章中我们将介绍的概念如下：\n\
  \n- Distributed training for deep learning\n- Using the Horovod distributed learning\
  \ library in Azure Databricks\n- Using the Spark TensorFlow Distributor package\n\
  \n在深入研究这些概念之前，让我们先了解一下执行此处所示示例的要求。\n\n## Technical requirements\n\n在本章中，我们将使用与数据科学和优化任务中的常见主题相关的概念和工具。我们假设您已经很好地理解了诸如神经网络和超参数调优之类的概念，并且对\
  \ TensorFlow、PyTorch 或 Keras 等机器学习框架也有一般了解。\n\n在本章中，我们将讨论各种技术，以便使用 Azure Databricks\
  \ 分布和优化深度学习模型的训练，因此如果您不熟悉这些术语，建议您查阅 TensorFlow 文档，了解神经网络是如何设计和训练的。\n\n为了在该章中处理给出的示例，您需要以下内容：\n\
  \n- An Azure Databricks subscription.\n- An Azure Databricks notebook attached to\
  \ a running cluster with Databricks Runtime ML version 7.0 or higher.\n\n## Distributed\
  \ training for deep learning\n\n深度神经网络（DNNs）在过去几十年里推动了人工智能（AI）在计算机视觉和神经网络处理等领域的发展。这些网络每天都被应用于解决各种用例中的挑战。\n\
  \n为了扩展模型性能，有必要开发具有数百万个可训练参数的复杂模型架构，使得训练所需的计算成为一项资源密集型操作。随着用于训练模型的可获得数据量的增加，我们需要扩展深度学习模型的训练管道，以便能够使用这些可用数据。\n\
  \n通常，为了训练 DNN，我们需要遵循以下三个基本步骤，如下所示：\n\n- 1. 将数据通过网络的层传递以计算模型损失，此操作称为前向传播。\n- 2. 将此损失从输出层反向传播到第一层以计算梯度。\n\
  - 3. 我们使用计算出的梯度来更新训练过程中模型权重的优化步骤。\n\nDNN 训练过程的可扩展性可以通过以下两种方式实现：\n\n- Using data\
  \ parallelization\n- Using model parallelization\n\n数据并行化策略涉及将模型复制到每个可用工作者中并进行拟合，使用分配的数据部分。之后，工作者之间相互通信，以便正确更新模型的权重，使用平均计算的梯度。\n\
  \n尽管听起来很简单，但实现起来可能相当复杂，如果操作不当，由这种方式带来的复杂性完全会抵消分布式训练带来的性能提升。\n\n现代神经网络在过去十年中发展迅速。图像处理中使用的一些架构具有数百万个参数，需要在大量数据上进行训练。这种计算密集型的训练过程导致了将过程并行化到多个工作者中的技术的发展。\n\
  \n随着用于训练模型的数据量的增加，我们可以增加运行计算的工作者数量。通常，工作者接收神经网络的副本，并且小批量数据被分发给每个工作者以根据训练数据批次计算梯度。这些梯度被平均以重新计算神经网络的新权重。\n\
  \n当数据增加且模型具有数百万个可训练参数时，这些梯度可能在内存中占用数 GB 的空间，并且工作者之间的通信开始成为一个问题，因为我们达到了网络的最大带宽。\n\
  \n\n\n\n\n我们面临的另一个阻碍是，梯度通常的计算方式需要等待所有工作节点的梯度都计算完毕。解决这一问题的另一种方法是引入运行梯度异步计算的算法，但这些算法通常很难调试。\n\
  \n这时，源自高性能计算的一种技术——*ring allreduce* 技术派上了用场。它允许我们通过利用最优带宽 ring allreduce 来提高神经网络训练过程的性能。\n\
  \n## The ring allreduce technique\n\n随着我们引入新的工作节点来处理计算梯度规模的增加，我们开始注意到通信成本开始线性增长。我们可以配置工作节点之间的通信，以便找到利用可用带宽的最佳策略。为此，我们使用\
  \ ring all reduce，这是一种通信算法，其中通信成本无论引入多少个工作节点都保持恒定，并且仅取决于系统中最慢的连接。\n\n`ring allreduce`\
  \ 算法将工作节点按逻辑环排列，其中每个工作节点只能向其右邻居发送数据并从其左邻居接收数据。该算法在以下图表中有所描述：\n\n![](img/7e45bd08916c2a17d4e75cbb898f41e8_376_0.png)\n\
  \nFigure 12.1 – How the Ring All Reduce algorithm allows communication between workers\n\
  \nring allreduce 算法分为两个步骤工作。首先，每个工作节点交换数据，使每个工作节点拥有结果的一部分，然后运行 allgather 操作，使所有工作节点都拥有完整的结果。\n\
  \n我们可以通过利用神经网络中梯度的固有计算过程来进一步改善工作节点之间的通信。\n\n为了训练神经网络，我们首先运行前向传播，然后运行反向传播以计算神经网络各层的梯度，从输出层开始一直到输入层。因此，最先可用的梯度是来自输出层的梯度。我们可以利用这一过程，在所有梯度完成之前就发送梯度，以避免带宽使用峰值和与其它工作节点的通信重叠。这样，我们就克服了必须等待每个工作节点完成对神经网络所有层的梯度计算的不便。\n\
  \n这种方法的优点在于它与用于创建模型的网络架构和框架无关，并且允许我们更好地利用并行计算的力量来分布式训练深度学习模型。\n\nhorovod 库应用 ring\
  \ allreduce 算法，以在 Azure Databricks 等分布式计算系统中实现深度学习网络的分布式训练。在下一节中，我们将学习如何利用 HorovodRunner\
  \ 高效地训练深度学习模型。\n\n## Using the Horovod distributed learning library in Azure Databricks\n\
  \nhorovod 是一个用于分布式深度学习训练的库。它支持常用的框架，如 TensorFlow、Keras 和 PyTorch。如前所述，它基于 tensorflow-allreduce\
  \ 库，并实现了 ring allreduce 算法，以便从单图形处理单元 GPU 训练轻松迁移到并行 GPU 分布式训练。\n\n为此，我们将单 GPU 深度学习模型的训练脚本改编为在训练过程中使用\
  \ horovod 库。一旦我们改编了脚本，它就可以在单 GPU 或多 GPU 上运行，而无需更改代码。\n\nhorovod 库使用数据并行化策略，通过以优化的方式实现\
  \ ring allreduce 算法来克服通信限制，从而允许高效地将训练分布到多个 GPU 并行处理。\n\n它以一种方式实现，即每个 GPU 获取一批数据以独立计算梯度。例如，如果我们有\
  \ 32 的批大小和两个可用 GPU，每个 GPU 将接收 16 条记录的集合来计算梯度更新。这些梯度更新随后在所有可用 GPU 之间同步并取平均值，以便最终用于更新模型权重。\n\
  \n在对数据批次的每次训练运行中，horovod 遵循以下概述的过程来处理 GPU 之间的分布式计算：\n\n- 每个工作节点接收模型的副本和数据集。\n- 一旦收到开始信号，工作节点就会在分配的数据批次上计算梯度。\n\
  - 使用 ring allreduce 算法在 GPU 之间同步和平均计算的梯度。\n- 所有工作节点使用计算出的平均梯度更新其模型的权重。\n\n此操作最关键的方面之一是保持工作节点之间模型的一致性。如果模型以某种方式分歧，这将导致梯度计算不一致。这就是\
  \ ring allreduce 算法在高效同步表示模型可训练参数的张量方面发挥重要作用的地方。\n\n为了开发可高效用于深度学习模型分布式训练的训练管道，一个常见的流程概述如下：\n\
  \n- 使用 Horovod 支持的框架之一，如 TensorFlow、Keras 或 PyTorch，为单机创建训练脚本。\n- 添加 hvd.init()\
  \ 函数以初始化 horovod 库。\n- 使用 config.gpu_options.visible_device_list 选项选择其中一个可用 GPU\
  \ 服务器。\n- 使用 hvd.DistributedOptimizer 包装优化器，以在工作节点之间分发梯度下降计算。\n- 使用 hvd.BroadcastGlobalVariablesHook()\
  \ 分发初始变量状态，以确保所有工作节点模型随机权重的初始化一致。另一种选择是使用 hvd.broadcast_global_variables() 广播全局起始变量。\n\
  - 将代码设置为在 0 号工作节点保存检查点，以避免因重叠的读写操作导致数据损坏。\n- 使用 HorovodRunner 包装一个单一的 Python 函数，该函数打包训练过程。\n\
  \nhorovod 是 Azure Databricks Runtime for machine learning 中可用的库。在本章的下一节中，我们将学习如何使用它来分发深度学习模型的训练并有效并行化超参数调优。\n\
  \n作为示例，我们将展示如何修改代码以能够以分布式模式运行的构造。我们将使用 TensorFlow 模型的玩具模型示例。这假设我们有一个 TensorFlow\
  \ v1 模型，我们希望将其作为分布式模型进行训练。步骤如下：\n\n1. 为此，我们首先需要导入 TensorFlow 和 Horovod 并初始化 Horovod，如下所示：\n\
  \n```\nimport tensorflow as tf\nimport horovod.tensorflow as hvd\nhvd.init()\n```\n\
  \n2. 接下来，我们将 ping 将用于处理节点本地 rank 的 GPU，如下所示：\n\n```\nconfig = tf.ConfigProto()\n\
  config.gpu_options.visible_device_list = str(hvd.local_rank())\n```\n\n3. 在此之后，我们可以开始构建模型并定义将使用的损失函数。我们将抽象此点并假设您已经有一个要优化的损失函数。\n\
  \n4. 下一步是应用 Horovod 分布式优化器到所选优化器，以分发梯度计算的训练。作为示例，我们将定义一个 TensorFlow AdagradOptimizer\
  \ 优化器，并将学习率设置为 Horovod 传递给工作节点的 size 大小的变量依赖项，一个用于控制学习率的参数。代码如下所示片段所示：\n\n```\n\
  opt = tf.train.AdagradOptimizer(0.01 * hvd.size())\n```\n\n5. 现在，我们可以使用 Horovod\
  \ 分布式优化器来包装所选优化器，如下所示：\n\n```\nopt = hvd.DistributedOptimizer(opt)\n```\n\n\n\n\n\
  \n6. 在初始化期间添加一个钩子以从 rank 0 广播初始化变量到所有其他进程非常重要，这样才能复制依赖于随机初始化参数的结构，例如模型权重的初始化。执行此操作的代码在以下片段中说明：\n\
  \n```\nhooks = [hvd.BroadcastGlobalVariablesHook(0)]\n```\n\n7. 此时，我们可以使用预定义的损失函数开始训练操作，如下所示：\n\
  \n```\ntrain = opt.minimize(loss)\n```\n\n8. 我们需要指定仅在 worker 0 上保存的检查点，以防止其他 worker\
  \ 之间重叠写入操作。我们运行以下代码来实现此目的：\n\n```\ncheckpoint_dir = '/tmp/training_logs' if hvd.rank()\
  \ == 0\nelse None\n```\n\n9. 现在，我们将使用 MonitoredTrainingSession 检查点来处理会话初始化、加载和保存到检查点以及在操作完成或发生任何错误时关闭所需的操作。此代码在以下片段中显示：\n\
  \n```\nwith tf.train.\\\n    MonitoredTrainingSession(checkpoint_dir=checkpoint_dir,\n\
  \                            config=config,\n                            hooks=hooks)\
  \ as mon_sess:\n        while not mon_sess.should_stop():\n            mon_sess.run(tr)\n\
  ```\n\n这样，我们就可以修改 TensorFlow v1 训练脚本以使用 Horovod 进行分布式训练。在这里，Horovod 将动态修改每个 worker\
  \ 中的批量大小和学习率，并随可用 worker 数量同步处理训练。hvd.DistributedOptimizer 优化器将负责在每个 worker 的数据批次上计算梯度，并根据平均梯度修改模型参数。\n\
  \n最后，我们确保广播所有初始化变量以确保 worker 之间模型的<|message|>一致性，并强制 rank 0 worker 写入检查点以防止检查点损坏。\n\
  \n在下一节中，我们将深入了解如何使用 Horovod 在 **中央处理单元 (CPU)** 或 GPU 集群中对深度学习模型进行分布式训练的更具体示例。\n\n\
  ## 安装 horovod 库\n\n`horovod` 库已预安装在 Azure Databricks Runtime for Machine Learning\
  \ 中，因此在大多数情况下，除非您使用的是普通的 Azure Databricks Runtime，否则您无需安装它。尽管如此，有一点需要注意的是，如果您升级或降级用于构建模型的框架之一，例如\
  \ TensorFlow、Keras 或 PyTorch，您将需要重新安装 `horovod` 库并重新编译它。\n\n在需要升级或降级其中一个框架的情况下，我们可能会遇到导入错误，表明\
  \ `horovod` 是在所需框架之前安装的，例如 TensorFlow、Keras 或 PyTorch。这是由于 Horovod 在安装期间编译，如果在安装期间未存在所需库，则不会编译。\n\
  \n如果我们重新安装了其中一个必需库，我们可以通过执行以下步骤来克服此问题：\n\n- 1. 检查所需库是否已正确安装。\n- 2. 使用 Python `pip`\
  \ 卸载 `horovod`。\n- 3. 使用 `pip` 安装 `CMake` Python 库。\n- 4. 使用 Python `pip` 重新安装 `horovod`。\n\
  \n这样，我们可以确保 `horovod` 库是在所需框架安装后编译的。\n\n一旦我们可以在环境中使用 `horovod` 库，我们将把注意力集中在可以利用的可用功能上，以便在\
  \ Azure Databricks 中高效地用于分布式训练。\n\n## 使用 horovod 库\n\n在本节中，我们将展示如何应用 `horovod` 以便在\
  \ **Modified National Institute of Standards and Technology (MNIST)** 数据集上使用 Keras\
  \ TensorFlow **应用程序编程接口 (API)** 训练一个简单的分类器，然后调整代码以便以分布式方式进行训练。首先，我们将创建两个函数，分别用于创建数据集和构建模型。\n\
  \n为了跟踪运行和进程，horovod 库使用进程 ID 和进程数作为参数。这些参数是 rank 和 size，后续将由 HorovodRunner 用于跟踪和控制进程。\n\
  \n## 在单节点上训练模型\n\n我们将创建一个函数，该函数将 rank 和 size 作为参数，并返回准备好用于训练模型的数据。此函数在单节点或分布式学习期间均有效。步骤如下：\n\
  \n- 1. 我们将使用 keras.datasets.mnist.load_data() 函数获取数据集，然后调整其大小并预处理，以便可以直接用于训练模型。请注意，在以下代码片段中，导入位于函数内部：\n\
  \n```\ndef get_dataset(num_classes, rank=0, size=1):\n    from tensorflow import\
  \ keras\n    (x_train, y_train), (x_test, y_test) = keras.datasets.\n    mnist.load_data('MNIST-data-%d'\
  \ % rank)\n    x_train, y_train = \\\n    x_train[rank:size],y_train[rank:size]\n\
  \    x_test,y_test = x_test[rank:size],y_test[rank:size]\n    x_train = x_train.reshape(x_train.shape[0],\
  \ 28, 28, 1)\n    x_test = x_test.reshape(x_test.shape[0], 28, 28, 1)\n    x_train\
  \ = x_train.astype('float32')/255\n    x_test = x_test.astype('float32')/255\n \
  \   y_train = keras.utils.to_categorical(y_train,\n        num_classes)\n    y_test\
  \ = keras.utils.to_categorical(y_test,\n        num_classes)\n    return (x_train,\
  \ y_train), (x_test, y_test)\n```\n\n此函数允许我们在节点上加载数据集并将其预处理为所需格式，以便传递给模型进行训练。\n\n\
  2. 下一步是定义一个用于创建将要训练的模型的函数。\n我们将定义一个 Keras 卷积神经网络 (CNN)，在最大池化展平后和最终 softmax 层后添加\
  \ dropout。我们将使用 64 个神经元的隐藏密集层。请注意，在以下代码片段中，我们在函数内部进行了导入，以便稍后将模块导入到 worker：\n\n```\n\
  def get_model(num_classes):\n    from tensorflow.keras import models\n    from tensorflow.keras\
  \ import layers\n    model = models.Sequential()\n    model.add(layers.Conv2D(32,\
  \ 3,\n                        activation='relu',\n                        input_shape=(28,\
  \ 28, 1)))\n    model.add(layers.MaxPooling2D())\n    model.add(layers.Dropout(0.1))\n\
  \    model.add(layers.Flatten())\n    model.add(layers.Dense(64, activation='relu'))\n\
  \    model.add(layers.Dropout(0.2))\n    model.add(layers.Dense(num_classes,\n \
  \                       activation='softmax'))\n    return model\n```\n\n3. 现在，我们可以使用刚刚定义的函数在单节点上运行训练。我们将创建一个\
  \ train 函数，该函数既可以在单节点上执行，也可以在分布式 worker 集合上执行。请考虑学习率必须是函数中的参数，以便 Horovod 在分布式训练过程中控制每个\
  \ worker 的学习率。代码在以下片段中显示：\n\n```\ndef train(learning_rate=0.1,\n          batch_size\
  \ = 64,\n          epochs = 10,\n          num_classes = 10):\n    from tensorflow\
  \ import keras\n    (x_train, y_train), (x_test, y_test) = \\\n    get_dataset(num_classes)\n\
  \    model = get_model(num_classes)\n```\n\n```\noptimizer = keras.optimizers.Adadelta(lr=learning_rate)\n\
  model.compile(optimizer=optimizer,\n                loss='categorical_crossentropy',\n\
  \                metrics=['accuracy'])\nmodel.fit(x_train, y_train,\n          batch_size=batch_size,\n\
  \          epochs=epochs,\n          verbose=2,\n          validation_data=(x_test,\
  \ y_test))\nreturn model\n```\n\n4. 现在，我们可以使用刚刚定义的函数在单节点上运行训练。为了获得训练好的模型，我们只需调用该函数并指定所需参数，如以下代码片段所示：\n\
  \n```\nmodel = train(learning_rate=0.1,\n              batch_size = 64,\n      \
  \        epochs = 10,\n              num_classes = 10)\n```\n\n5. 该过程需要几分钟进行训练，之后模型将被返回，准备好使用。一旦过程完成，我们可以通过使用之前定义的\
  \ get_dataset() 函数在测试数据上计算模型准确度来测试它，如下所示：\n\n```\n_, (x_test, y_test) = get_dataset(num_classes)\n\
  loss, accuracy = model.evaluate(x_test, y_test,\n                              \
  \  batch_size=128)\nprint(\"loss:\", loss)\nprint(\"accuracy:\", accuracy)\n```\n\
  \n我们现在可以在测试集上看到模型的损失和准确度，如以下屏幕截图所示：\n\n\n\n```\nnum_classes = 10\n_, (x_test, y_test)\
  \ = get_dataset(num_classes)\nloss, accuracy = model.evaluate(x_test, y_test, batch_size=128)\n\
  print(\"loss:\", loss)\nprint(\"accuracy:\", accuracy)\n```\n\n79/79 [==============================]\
  \ - 1s 8ms/step - loss: 0.0808 - accuracy: 0.9752\nloss: 0.08081278949975967\naccuracy:\
  \ 0.9751999974250793\n\nFigure 12.2 – The loss and accuracy of the model in the\
  \ test set\n\nThe way in which the get_dataset() and get_model() functions are designed\
  \ made it easy not only to retrain on new parameters but also to be reusable when\
  \ these are distributed to the nodes, which is what we will do in the next section.\n\
  \n## Distributing training with HorovodRunner\n\nIn order to distribute the training\
  \ to the workers, we will start by creating a checkpoint location for HorovodRunner\
  \ in the Databricks File System (DBFS) ml-fuse directory available in Azure Databricks\
  \ Runtime for Machine Learning, as follows:\n\n```\nimport os\nimport time\ncheckpoint_dir\
  \ = '/dbfs/ml/MNISTDemo/train/{ time.time() }/'\nos.makedirs(checkpoint_dir)\nprint(checkpoint_dir)\n\
  ```\n\nThis directory is available to all the workers and it's optimized for machine\
  \ learning I/O operations on training data. The directory can be seen in the following\
  \ screenshot:\n\n```\nimport os\nimport time\ncheckpoint_dir = f'/dbfs/ml/MNISTDemo/train/{\
  \ time.time() }/'\nos.makedirs(checkpoint_dir)\nprint(checkpoint_dir)\n```\n\n/dbfs/ml/MNISTDemo/train/1617111715.7711205/\n\
  \nFigure 12.3 – The ml directory\n\nThe next step is to define a function that will\
  \ adapt the training function we have previously defined to be able to be distributed\
  \ to the workers. The function itself packs a lot of operations, therefore we can\
  \ explain the steps that it follows as the following:\n\n- 1. It imports the required\
  \ modules into each of the workers.\n- 2. It initializes horovod using the horovod.tensorflow.keras.init()\
  \ function.\n- 3. It pings the GPU to be used if the run is local and if there is\
  \ a GPU available otherwise, it will skip this step.\n- 4. It uses the get_dataset()\
  \ and get_model() functions that were defined earlier for horovod to dynamically\
  \ adjust the learning rate based on the available GPUs, rank, and size.\n- 5. It\
  \ applies the Horovod distributed optimizer in order to distribute and compute the\
  \ gradients during the distributed training.\n- 6. It creates a callback process\
  \ to distribute the state variables from the rank 0 to all the other processes in\
  \ order to ensure consistency of the worker model states when the process has randomly\
  \ initiated weights.\n- 7. It enforces to save the checkpoints in the 0 worker to\
  \ prevent conflicts or corruption of data due to overlapping read/write operations.\n\
  \nWe will define the Horovod training function for distributed training, as follows:\n\
  \n```\ndef train_hvd(checkpoint_path, learning_rate=1.0):\nfrom tensorflow.keras\
  \ import backend as K\nfrom tensorflow.keras.models import Sequential\nimport tensorflow\
  \ as tf\nfrom tensorflow import keras\n    import horovod.tensorflow.keras as hvd\n\
  \    hvd.init()\n    gpus = tf.config.experimental.list_physical_devices('GPU')\n\
  \    for gpu in gpus:\n        tf.config.experimental.set_memory_growth(gpu, True)\n\
  \    if gpus:\n        tf.config.experimental.set_visible_devices(gpus[hvd.local_rank()],\
  \ 'GPU')\n    (x_train, y_train), (x_test, y_test) = get_dataset(num_\n```\n\n```\n\
  classes, hvd.rank(), hvd.size()\n    model = get_model(num_classes)\n        optimizer\
  \ = keras.optimizers.Adadelta(lr=learning_rate * hvd.size())\n        optimizer\
  \ = hvd.DistributedOptimizer(optimizer)\n    model.compile(optimizer=optimizer,\n\
  \                    loss='categorical_crossentropy',\n                    metrics=['accuracy'])\n\
  \    callbacks = [\n        hvd.callbacks.BroadcastGlobalVariablesCallback(0),\n\
  \    ]\n    if hvd.rank() == 0:\n        callbacks.append(keras.callbacks.ModelCheckpoint(\n\
  \    checkpoint_path,\n    save_weights_only = True))\n    model.fit(x_train, y_train,\n\
  \                batch_size=batch_size,\n                callbacks=callbacks,\n\
  \                epochs=epochs,\n                verbose=2,\n                validation_data=(x_test,\
  \ y_test))\n```\n\nWe will use this function in order to distribute the training\
  \ to the workers. We will set an np parameter in HorovodRunner that relates to the\
  \ specified number of parameters—a value that is dependent on the number of available\
  \ workers. So, if we specify np=1, HorovodRunner will train on the driver node on\
  \ a single-process execution.\n\nIn this example, we will set the np value to 2:\n\
  \n```\nfrom sparkdl import HorovodRunner\ncheckpoint_path = checkpoint_dir + '/checkpoint-{epoch}.ckpt'\n\
  hr = HorovodRunner(np=2)\nhr.run(train_hvd, checkpoint_path=checkpoint_path,\n \
  \   learning_rate=0.1)\n```\n\nThe process will be executed by HorovodRunner by\
  \ transforming the defined functions to get the dataset and create the model, and\
  \ then transform them into pickle files that will then be distributed to the workers,\
  \ as illustrated in the following screenshot:\n\n![](img/7e45bd08916c2a17d4e75cbb898f41e8_388_0.png)\n\
  \nFigure 12.4 – Dataset transformed to pickle files\n\nThe workers in turn read\
  \ and deserialize the functions and run them in order to train the model.\n\nAfter\
  \ the process has been completed, we can load the model trained by HorovodRunner\
  \ and use it to run predictions on new data. We can use the Keras model that we\
  \ have previously defined using the tf.train.latest_checkpoint() function to load\
  \ the latest saved checkpoint file, as follows:\n\n```\nimport tensorflow as tf\n\
  hvd_model = get_model(num_classes)\nhvd_model.compile(optimizer=tf.keras.optimizers.\n\
  Adadelta(lr=learning_rate),\n                loss='categorical_crossentropy',\n\
  \                metrics=['accuracy'])\nhvd_model.load_weights(tf.train.latest_checkpoint(os.path.dirname(checkpoint_path)))\n\
  ```\n\nWe can test that the model has been correctly loaded by running predictions\
  \ on the test dataset, as follows:\n\n```\nnum_classes = 10\n_, (x_test, y_test)\
  \ = get_dataset(num_classes)\nloss, accuracy = hvd_model.evaluate(x_test, y_test,\n\
  \                                    batch_size=128)\nprint(\"loaded model loss\
  \ and accuracy:\", loss, accuracy)\n```\n\nIn this way, and by making small but\
  \ meaningful changes to the code, we have adopted a single machine-training script\
  \ in order to be able to use it for distributed learning in Azure Databricks, running\
  \ on both CPU and GPU clusters.\n\nIn the next section, we will learn how to leverage\
  \ the advantages of the horovod library in order to tune the model's hyperparameter.\n\
  \n## Distributing hyperparameter tuning using Horovod and Hyperopt\n\nAs we have\
  \ seen previously, we can improve the performance of the model by tuning the hyperparameter\
  \ using Hyperopt. Hyperopt evaluated the best hyperparameter by generating trials\
  \ for different points in the defined search space, using an adaptive strategy.\
  \ The evaluations take advantage of the distributed nature of Azure Databricks.\n\
  \nThe Hyperopt trials are evaluated on a single node while HorovodRunner is launched\
  \ from the driver node, and distributes the training to the workers. We will learn\
  \ how we can use HorovodRunner in order to increase the performance of the model\
  \ tuning, using distributed learning to run the trials.\n\nThe first objective is\
  \ to define a function that will be passed to HorovodRunner in order to run the\
  \ distributed learning. To do this, we will define a function to minimize, specify\
  \ a search space of hyperparameters, and use the Hyperopt fmin() function to tune\
  \ the model. The change compared to the example in the previous section is that\
  \ this training will be optimized to run a distribution, using HorovodRunner. The\
  \ next train function is passed to the Hyperopt fmin() function, to be the target\
  \ function to be minimized. It is configured to return a dictionary with key values\
  \ named loss and Status, as required by the Hyperopt fmin() function.\n\nHere, we\
  \ are using the previously defined train_hvd() function:\n\n```\nfrom hyperopt import\
  \ fmin, tpe, hp, Trials, STATUS_OK\nfrom sparkdl import HorovodRunner\n\ndef wrap_train(params):\n\
  \    hr = HorovodRunner(np=2)\n    loss, acc = hr.run(train_hvd,\n             \
  \           learning_rate=params['learning_rate'],\n                        batch_size=params['batch_size'],\n\
  \                        checkpoint_dir=checkpoint_dir)\n    return {'loss': loss,\
  \ 'status': STATUS_OK}\n```\n\nThe next step is to define the search space over\
  \ which we will scan for the best set of hyperparameters. Here, we will use the\
  \ Hyperopt optimization algorithm to tune the learning rate and batch size:\n\n\
  ```\nimport numpy as np\nspace = {\n    'learning_rate': hp.loguniform('learning_rate',\n\
  \                                   np.log(1e-4),\n                            \
  \       np.log(1e-1)),\n    'batch_size': hp.choice('batch_size', [32, 64, 128]),\n\
  }\n```\n\nNow that we have defined the objective function and the search space that\
  \ will be scanned, we can use the Hyperopt fmin() function to run the hyperparameter\
  \ optimization. While Hyperopt will take advantage of the parallel execution on\
  \ each of the workers, the horovod library will distribute the process to each of\
  \ the available workers.\n\nTo run the optimization, we must use the max_eval parameter\
  \ in order to specify the number of points that will be evaluated for each defined\
  \ test case in the search space, generating a model as a trial, and use it to evaluate\
  \ the model in that point of the search space.\n\n\n\n\n\n在这种情况下，我们将使用 `hyperopt.tpe.suggest`\
  \ 作为搜索算法，它是 Tree of Parzen Estimator，一种自适应方法，会根据之前的結果选择要测试的超参数。基于此，我们可以通过运行以下代码块找到最佳参数：\n\
  \n```\nbest_param = fmin(\n    fn=wrap_train,\n    space=space,\n    algo=tpe.suggest,\n\
  \    max_evals=8,\n    return_argmin=False,\n)\n```\n\n一旦要最小化的目标函数得到优化，我们就可以打印出产生最佳模型的參數，如下所示：\n\
  \n```\nprint(best_param)\n```\n\n需要注意的一个重要点是，在 Hyperopt 的 `fmin()` 函数中，我们没有使用 `trials`\
  \ 参数。这是因为当 Hyperopt 与 HorovodRunner 结合使用时，我们不需要传递 `trials` 参数，因为 Hyperopt 将使用默认的\
  \ Trials 类而不是 SparkTrials。这是因为 SparkTrials 类在分布式训练中不可用，因为评估是在单个节点上完成的。\n\n在这个简单的示例中，我们扩展了\
  \ HorovodRunner 的功能，以便将其用于最初在单节点上训练的 CNN TensorFlow 模型的超参数调优。为此，我们创建了一个由 hyperopt\
  \ 库最小化的目标目标函数，定义了基于我们想要扫描的超参数的搜索空间，并使用运行 Azure Databricks Runtime for Machine Learning\
  \ 的两个工作节点的集群进行超参数调优。\n\n下一节将介绍 Spark TensorFlow Distributor，这是一个允许我们在 Azure Databricks\
  \ 中分发训练 TensorFlow 机器学习模型的库。\n\n# 使用 Spark TensorFlow Distributor 包\n\n深度学习中最常用的框架之一是\
  \ TensorFlow 库，它还支持在 CPU 和 GPU 集群上进行分布式训练。我们可以使用 Spark TensorFlow Distributor 在\
  \ Azure Databricks 中训练深度学习模型，它是一个旨在简化在具有大量数据的分布式计算系统中训练具有复杂架构和大量可训练参数的 TensorFlow\
  \ 模型的库。\n\n由于标准执行模式是 Map/Reduce 模式，Spark 在分布式训练方面受到限制。在此模式下，作业在每个工作器中独立执行，它们之间没有任何通信。在\
  \ Spark 3.0 中，有一种名为 barrier execution 的新执行模式，它允许我们在执行期间在工作器之间进行通信，从而轻松地以分布式方式训练深度学习模型。\n\
  \nSpark TensorFlow Distributor 是一个 TensorFlow 原生包，它利用了 barrier execution 模式，允许工作器在执行期间相互共享数据。它已预装在\
  \ Azure Databricks Runtime for Machine Learning 上，但你也可以在集群上使用 pip 安装，如下所示：\n\n```\n\
  pip install spark-tensorflow-distributor\n```\n\n在 barrier execution 模式实现之前，有必要管理基于\
  \ Map/Reduce 的作业，这使得分布式训练深度学习模型的实现非常低效。\n\nSpark TensorFlow Distributor 库围绕 `tensorflow.distribute.Strategy`\
  \ TensorFlow API 构建，该 API 旨在在 GPU 或 CPU 集群中分发训练。它可用于在对训练脚本进行少量更改的同时分发训练。它是为了实现以下目的而构建的：\n\
  \n- 简化从单机训练到集群分布式训练的过渡。\n- 分发使用 TensorFlow 制作的自定义训练脚本。\n\n在本节中，我们将演示如何使用 Spark TensorFlow\
  \ Distributor 库的 MirroredStrategyRunner 类为 TensorFlow 深度学习模型实现分布式训练策略。\n\n要使用 Spark\
  \ TensorFlow Distributor 库，我们只需要提供一个具有特定结构的 `train()` 函数，包将处理必要的配置。\n\n我们将首先导入 TensorFlow\
  \ 库并设置初始参数，即工作节点数和可用 GPU。我们假设驱动程序和节点具有相同类型的实例，因此总可用 GPU 的计算方法是工作节点中的 GPU 数量乘以集群中的实例数量。代码如下所示：\n\
  \n```\nimport tensorflow as tf\n\nNUM_WORKERS = 2\nCLUSTER_GPUS = len(tf.config.list_logical_devices('GPU'))\
  \ * NUM_WORKERS\nUSE_GPU = CLUSTER_GPUS > 0\n```\n\n接下来，我们将创建一个在分发训练到工作节点之前将在单机上运行的训练函数。需要注意的是，建议在函数内部进行导入。这是因为训练函数将被序列化为\
  \ pickle，这样可以避免此过程中的任何可能问题。在函数中，工作流程按如下方式实现：\n\n- 1. 我们定义并调用一个函数来加载 MNIST 数据集并将其转换为归一化的张量数据集。\n\
  - 2. 我们定义并调用一个函数来创建和编译将要训练的模型。\n- 3. 我们定义 autoshard 数据策略，这是在分布式学习中用于指定数据分发方式的 TensorFlow\
  \ 参数。如果选项设置为 FILES，数据将按文件分区分发到工作节点。如果选项设置为 DATA，所有工作节点都会收到完整数据集，但只会处理分配给它们的部分。\n\
  - 4. 我们在训练数据上拟合模型。\n\n让我们使用默认的学习率、缓冲区和批大小定义训练函数，如下所示：\n\n```\ndef train(BUFFER_SIZE\
  \ = 5000, BATCH_SIZE = 32, learning_rate=0.005):\n    import tensorflow as tf\n\
  \    import uuid\n\n    def get_datasets():\n        (mnist_images, mnist_labels),\
  \ _ = \\\n            tf.keras.datasets.mnist.load_data(path=str(uuid.uuid4()+'mnist.npz'))\n\
  \n        dataset = tf.data.Dataset.from_tensor_slices((\n            tf.cast(mnist_images[...,\
  \ tf.newaxis] / 255.0,\n                    tf.float32),\n            tf.cast(mnist_labels,\
  \ tf.int64))\n        )\n\n        dataset = dataset.repeat().shuffle(BUFFER_SIZE).\n\
  \        batch(BATCH_SIZE)\n        return dataset\n```\n\n现在我们已经定义了将加载、预处理并返回训练数据的函数，我们可以定义一个将创建\
  \ Keras CNN 的函数，如下所示：\n\n```\ndef get_model():\n    model = tf.keras.Sequential([\n\
  \        tf.keras.layers.Conv2D(32, 3, activation='relu',\n                    \
  \            input_shape=(28, 28, 1)),\n        tf.keras.layers.MaxPooling2D(),\n\
  \        tf.keras.layers.Flatten(),\n        tf.keras.layers.Dense(128, activation='relu'),\n\
  \        tf.keras.layers.Dense(10, activation='softmax'),\n    ])\n    model.compile(\n\
  \        loss=tf.keras.losses.sparse_categorical_crossentropy,\n        optimizer=tf.keras.optimizers.SGD(learning_rate=learning_rate),\n\
  \        metrics=['accuracy'],\n    )\n    return model\n    train_datasets = get_datasets()\n\
  \    worker_model = get_model()\n    options = tf.data.Options()\n    options.experimental_distribute.auto_shard_policy\
  \ = \\\n        tf.data.experimental.AutoShardPolicy.DATA\n    train_datasets =\
  \ train_datasets.with_options(options)\n    worker_model.fit(x=train_datasets, epochs=3,\n\
  \                     steps_per_epoch=5)\n```\n\n一旦我们定义了将处理模型创建、编译和训练的函数，我们就可以使用\
  \ Spark TensorFlow Distributor MirroredStrategyRunner 类以本地模式运行训练。此模式将在所有驱动程序可用 GPU\
  \ 上训练模型。代码如下所示：\n\n```\nfrom spark_tensorflow_distributor import MirroredStrategyRunner\n\
  runner = MirroredStrategyRunner(num_slots=1,\n                                local_mode=True,\n\
  \                                use_gpu=USE_GPU)\nrunner.run(train)\n```\n\n以这种非常简单的方式，我们可以通过将\
  \ `local_mode` 参数设置为 True 在本地节点上执行代码。现在，为了运行分布式训练，我们将 `local_mode` 参数设置为 False，因为我们希望我们的函数在\
  \ Spark 集群的工作节点上运行。\n\n我们将定义一个取决于是否可用 GPU 的槽数。如果有 GPU 可用，槽数将设置为可用 GPU 的数量。如果我们使用的是\
  \ CPU 集群，我们应该将槽数设置为合理的数字，在我们的例子中是 4，如以下代码片段所示：\n\n```\nNUM_SLOTS = CLUSTER_GPUS\
  \ if USE_GPU else 4\nrunner = MirroredStrategyRunner(num_slots=CLUSTER_GPUS,\n \
  \                               use_gpu=USE_GPU)\nrunner.run(train)\n```\n\nMirroredStrategyRunner\
  \ 类是一种为具有多个 GPU 可用的节点设计的策略，但我们也可以为分布式训练指定自定义策略。为此，你需要在 `train()` 函数内创建一个 `tf.distribute.Strategy`\
  \ 对象，并在 MirroredStrategyRunner 函数中将 `use_custom_strategy` 设置为 True。\n\n作为示例，我们可以更改分布式训练策略以使用\
  \ `tf.distribute.experimental.MultiWorkerMirroredStrategy`。MultiWorkerMirroredStrategy\
  \ 策略旨在以同步方式在可能有或没有 GPU 的工作节点之间分发训练。它类似于 MirroredStrategy，但不同之处在于它实现了 All-Reduce\
  \ 执行模式以使节点能够协同工作。代码如下所示：\n\n```\ndef train_custom_strategy():\n    import tensorflow\
  \ as tf\n```\n\n\n\nstrategy = tf.distribute.experimental.MultiWorkerMirroredStrategy(\n\
  \    tf.distribute.experimental.CollectiveCommunication.NCCL)\nwith strategy.scope():\n\
  \    import uuid\n    BUFFER_SIZE = 10000\n    BATCH_SIZE = 32\n    def make_datasets():\n\
  \        (mnist_images, mnist_labels), _ = \\\n            tf.keras.datasets.mnist.load_data(path=str(uuid.uuid4())+'mnist.npz')\n\
  \n        dataset = tf.data.Dataset.from_tensor_slices((\n            tf.cast(mnist_images[...,\
  \ tf.newaxis] / 255.0,\n                tf.float32),\n            tf.cast(mnist_labels,\
  \ tf.int64))\n        )\n        dataset = dataset.repeat().shuffle(BUFFER_SIZE).batch(BATCH_SIZE)\n\
  \        return dataset\n\n    def get_model():\n        model = tf.keras.Sequential([\n\
  \            tf.keras.layers.Conv2D(32, 3, activation='relu',\n                input_shape=(28,\
  \ 28, 1)),\n            tf.keras.layers.MaxPooling2D(),\n            tf.keras.layers.Flatten(),\n\
  \            tf.keras.layers.Dense(138, activation='relu'),\n            tf.keras.layers.Dense(10,\
  \ activation='softmax'),\n        ])\n        model.compile(\n            loss=tf.keras.losses.sparse_categorical_crossentropy,\n\
  \            optimizer=tf.keras.optimizers.SGD(learning_rate=0.001),\n         \
  \   metrics=['accuracy'],\n        )\n        return model\n\ntrain_datasets = make_datasets()\n\
  worker_model = get_model()\noptions = tf.data.Options()\noptions.experimental_distribute.auto_shard_policy\
  \ = \\\n    tf.data.experimental.AutoShardPolicy.DATA\ntrain_datasets = train_datasets.with_options(options)\n\
  worker_model.fit(x=train_datasets, epochs=3,\n    steps_per_epoch=5)\n\n现在，我们可以通过运行\
  \ MirroredStrategyRunner 并将 local_mode 和 use_custom_strategy 参数设置为 True 来在本地执行指定的训练策略，从而分发模型的训练，如下所示：\n\
  \n```\nrunner = MirroredStrategyRunner(num_slots=1,\n                          \
  \      use_custom_strategy=True,\n                                local_mode=True,\n\
  \                                use_gpu=USE_GPU)\nrunner.run(train_custom_strategy)\n\
  ```\n\n我们可以在本地模式下运行以在扩展训练之前验证脚本是否正常工作。我们可以通过验证日志中是否打印了 CollectiveCommunication.NCCL\
  \ 来检查这一点。\n\n正如我们所见，Spark TensorFlow Distributor 是 HorovodRunner 的替代方案，用于管理 TensorFlow\
  \ 深度学习模型的分布式训练。我们可以使用此库以非常简单的方式在单节点和集群上训练模型，能够利用 GPU 或 CPU 集群的强大功能进行深度学习模型的分布式训练。\n\
  \n## 摘要\n\n在本章中，我们学习了如何使用 Horovod 和 Azure Databricks 中的原生 TensorFlow for Spark 的分布式学习来提高深度学习算法训练管道的性能。我们讨论了驱动有效分发关键操作（例如梯度下降和模型权重更新）能力的核心算法，这些算法在随\
  \ Azure Databricks Runtime for Machine Learning 提供的 horovod 库中是如何实现的，以及我们如何使用 TensorFlow\
  \ 框架中现在可用的原生 Spark 支持来进行深度学习模型的分布式训练。\n\n本章结束了本书。希望它能让你更轻松地学习 Azure Databricks 中用于数据工程和数据科学的令人难以置信的众多功能。如前所述，大多数代码示例都是官方库的修改或取自\
  \ Azure Databricks 文档，以便提供有良好文档记录的示例，因此向帮助构建这些库和工具的所有开发人员致敬。\n\n![](img/7e45bd08916c2a17d4e75cbb898f41e8_399_0.png)\n\
