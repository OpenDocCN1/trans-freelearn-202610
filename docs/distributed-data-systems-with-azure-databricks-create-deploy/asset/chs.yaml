  \n索引\n\n## 前言\n\nMicrosoft Azure Databricks 帮助您利用分布式计算的强大功能，并将其应用于创建稳健的数据管道，以及训练和部署\
  \ **机器学习 (ML)** 和 **深度学习 (DL)** 模型。Databricks 的高级功能使开发人员能够处理、转换和探索数据。借助 Azure Databricks\
  \ 的分布式数据系统，您可以将对 Databricks 的知识付诸实践，以创建大数据管道。\n\n本书提供了一种实践方法来实现 Azure Databricks\
  \ 及其相关方法论，让您在短时间内变得高效。书中包含对基本概念的详细解释、实用示例和自我评估问题，您将从 Databricks 核心功能的快速介绍开始，然后使用\
  \ TensorFlow 和 Spark MLlib 进行分布式模型训练和推理。随着学习的深入，您将探索 Azure Databricks 上的 MLflow\
  \ 模型服务以及使用 Databricks 中的 HorovodRunner 进行分布式训练管道。最后，您将了解如何转换、使用并从海量数据中获得洞察，以训练预测模型并创建完整且可工作的整个数据管道。\n\
  \n在阅读完这本 MS Azure 书籍后，您将对如何使用 Databricks 创建和管理整个大数据管道有扎实的理解。\n\n## 本书适合谁阅读\n\n本书适合软件工程师、ML\
  \ 工程师、数据科学家和数据工程师，他们是 Azure Databricks 的新手，并且希望在无需担心基础设施的情况下构建高质量的数据管道。需要了解 Azure\
  \ Databricks 的基础知识才能更有效地学习本书涵盖的概念。还建议具备 ML 概念的基础理解和初级 Python 编程知识。\n\n## 本书涵盖内容\n\
  \n*第 1 章，Azure Databricks 简介*，带您了解 Databricks 的核心功能，包括我们如何与工作区环境交互、对主要应用程序的快速了解，以及我们将如何使用该工具供\
  \ Python 用户使用。这涵盖了工作区、界面、计算管理以及 Databricks 笔记本等主题。\n\n*第 2 章，创建 Azure Databricks\
  \ 工作区*，教您如何使用 Azure 提供的不同工具应用所有先前概念以与工作区交互。这包括使用 PowerShell 和 Azure CLI 管理所有 Databricks\
  \ 资源。\n\n*第 3 章，使用 Azure Databricks 创建 ETL 操作*，向您展示如何管理不同的数据源、转换它们并创建整个事件驱动的 ETL。\n\
  \n*第 4 章，Azure Databricks 中的 Delta Lake*，探索 Delta Lake 以及如何将其用于各种操作。\n\n*第 5 章，介绍\
  \ Delta Engine*，探索 Delta Engine，并展示如何将其与 Delta Lake 一起使用并在 Databricks 中创建高效的 ETL。\n\
  \n*第 6 章，介绍结构化流*，提供有关笔记本的解释，详细介绍如何使用特定类型的流源和接收器，如何将流投入生产，以及演示示例用例的笔记本。\n\n*第 7 章，在\
  \ Azure Databricks 中使用 Python 库*，探索使用 Python 的所有细微差别，并介绍稍后将更详细研究的模型和数据相关的核心概念。\n\
  \n*第 8 章，用于机器学习的 Databricks Runtime*，作为我们深入开发经典 ML 算法以基于表格数据训练和部署模型，同时探索库和算法的深入研究。示例将侧重于使用\
  \ Databricks 进行 ML 的特殊性和优势。\n\n*第 9 章，用于深度学习的 Databricks Runtime*，作为我们深入开发经典 DL\
  \ 算法以基于非结构化数据训练和部署模型，同时探索库和算法的深入研究。示例将侧重于使用 Databricks 进行 DL 的特殊性和优势。\n\n*第 10 章，在\
  \ Azure Databricks 中进行模型跟踪和调优*，重点关注使用 Databricks 的功能（如 AutoML 和 Delta Lake）进行模型调优、部署和控制，同时结合\
  \ TensorFlow 等流行库一起使用。\n\n第 11 章，使用 MLflow 和 MLEap 管理和部署模型，更详细地探索 MLflow 库，这是一个用于管理端到端\
  \ ML 生命周期的开源平台。该库允许用户跟踪实验、记录和比较参数、集中模型存储等。您将学习如何将其与之前章节中学到的内容结合使用。\n\n第 12 章，在 Azure\
  \ Databricks 中进行分布式深度学习，演示如何使用 Horovod 使分布式 DL 更快，通过将单 GPU 训练脚本扩展到并行在许多 GPU 上训练。\n\
