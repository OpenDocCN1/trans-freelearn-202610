  \ 0.889 的曲线下面积（AUC）。\n\n## Registering the model in the MLflow Model Registry\n\n\
  下一步将是在 MLflow Model Registry 中注册我们刚刚训练的模型，MLflow Model Registry 是一个集中式模型注册表，允许我们管理训练模型的完整生命周期，并可在\
  \ Azure Databricks 中的任何位置使用我们的模型。此模型存储库不仅会存储模型，还会为其提供版本控制，并允许我们添加描述和注释：\n\n- 1.\
  \ 在下一个示例中，我们将展示如何以编程方式注册我们的模型，但您也可以使用 Azure Databricks 工作区中的用户界面（UI）来完成此操作。首先，我们将存储刚刚训练的模型的最新运行的运行\
  \ ID。我们通过使用 tags.mlflow.runName 参数按模型名称进行过滤来搜索运行 ID，如下所示：\n\n```\nrun_id = mlflow.search_runs(filter_string='tags.mlflow.runName\
  \ = \"untuned_random_forest\"').iloc[0].run_id\nmodel_name = \"wine_quality\"\n\
  model_version = mlflow.register_model(f\"runs://{run_id}/random_forest_model\",\
  \ model_name)\n```\n\n如果您导航到 Azure Databricks 工作区中的 Models 页面，您将看到我们刚刚注册的模型。\n\n\
  - 2. 在我们的模型成功注册后，我们可以设置此模型的阶段。我们将把模型移至生产环境并在笔记本中加载它，如以下代码片段所示：\n\n```\nfrom mlflow.tracking\
  \ import MlflowClient\nclient = MlflowClient()\nclient.transition_model_version_stage(\n\
  name=model_name,\nversion=model_version.version,\nstage=\"Production\",\n)\n```\n\
  \n3. 我们可以在此处在单元格输出中看到模型已正确注册：\n\n```\nrun_id = mlflow.search_runs(filter_string=\"\
  tags.mlflow.runName = 'untuned_random_forest'\").iloc[0].run_id\nmodel_name = \"\
  wine_quality\"\nmodel_version = mlflow.register_model(f\"runs:/{run_id}/random_forest_model\"\
  , model_name)\n\nSuccessfully registered model 'wine_quality'.\n2021/03/15 10:14:16\
  \ INFO mlflow.tracking.model_registry.client: Waiting up to 300 seconds for model\
  \ version to finish creation.\nversion 1\nCreated version '1' of model 'wine_quality'.\n\
  ```\n\nFigure 8.14 – Correctly registered model\n\n4. 现在，我们可以通过引用使用 f\"models:/{model_name}/production\"\
  \ 路径来使用我们的模型。然后可以将模型加载到 Spark 用户定义函数（UDF）中，以便将其应用于 Delta 表以进行批量推理。以下代码将加载我们的模型并将其应用于\
  \ Delta 表：\n\n```\nimport mlflow.pyfunc\nfrom pyspark.sql.functions import struct\n\
  apply_model_udf = mlflow.pyfunc.spark_udf(spark, f\"models:/{model_name}/production\"\
  )\nnew_data = spark.read.format(\"delta\").load(table_path)\n```\n\n5. 一旦模型已加载并且数据已从\
  \ Delta 表中读取，我们就可以使用 struct 将输入变量传递给作为 UDF 注册的模型，如下所示：\n\n```\nudf_inputs = struct(*(X_train.columns.tolist()))\n\
  new_data = new_data.withColumn(\n\"prediction\",\napply_model_udf(udf_inputs)\n\
  )\ndisplay(new_data)\n```\n\n在这里，Delta 表中的每条记录现在都将有一个关联的预测。\n\n## Model serving\n\
  \n我们可以使用 MLflow 模型服务为低延迟预测提供端点，以便我们可以使用 REST API 发出请求并将预测作为响应获取。\n\n您需要您的 Databricks\
  \ 令牌才能向端点发出请求。如前几章所述，您可以在 Azure Databricks 中的 **User Settings** 页面获取您的令牌。\n\n在能够向我们的端点发出请求之前，请记住在\
  \ Azure Databricks 工作区中的模型页面上启用服务。您可以在以下屏幕截图中看到如何操作的提醒：\n\n![](img/7e45bd08916c2a17d4e75cbb898f41e8_286_0.png)\n\
  \nFigure 8.15 – Enabling model serving\n\n- 1. 最后，我们可以调用我们的模型。以下示例函数将发出一个 Pandas\
  \ 数据框，并返回数据框中每一行的推理结果：\n\n```\nimport os\nimport requests\nimport pandas as pd\n\
  def score_model(dataset: pd.DataFrame):\n    url = 'https://YOUR_DATABRICKS_URL/model/wine_quality/Production/invocations'\n\
  \    headers = {'Authorization': f'Bearer {your_databricks_token}'}\n    data_json\
  \ = dataset.to_dict(orient='split')\n    response = requests.request(method='POST',\n\
  \    headers=headers, url=url, json=data_json)\n    if response.status_code != 200:\n\
  \        raise Exception(f'Request failed with status {response.status_code}, {response.text}')\n\
  \    return response.json()\n```\n\n\n\n\n2. 我们可以通过将 X_test 数据传递给本地模型来比较我们得到的结果，如以下代码片段所示。我们应该得到相同的结果：\n\
  \n```\nnum_predictions = 5\nserved_predictions = score_model(X_test[:num_predictions])\n\
  model_evaluations = model.predict(X_test[:num_predictions])\npd.DataFrame({\n\"\
  Model Prediction\": model_evaluations,\n\"Served Model Prediction\": served_predictions,\n\
  })\n```\n\n这样，我们就可以通过将已发布的模型作为端点来发出请求，从而在较小的数据批次上实现低延迟预测。\n\n## Summary\n\n在本节中，我们涵盖了许多与如何提取和改进数据中可用的特征相关的示例，使用的方法包括分词、\
  \ polynomial expansion 和 one-hot encoding 等。这些方法使我们能够为模型的训练准备变量，并被视为特征工程的一部分。\n\n\
  接下来，我们深入探讨了如何使用 TF-IDF 和 Word2Vec 从文本中提取特征，以及如何使用 PySpark API 在 Azure Databricks\
  \ 中处理缺失数据。最后，我们以一个示例结束，展示了如何训练深度学习模型并使其准备好用于服务，并在发布 REST API 请求时获取预测。\n\n在下一章中，我们将更专注于使用\
  \ TFRecords 和 Petastorm 处理深度学习的大量数据，以及如何在 Azure Databricks 中利用现有模型从新数据中提取特征。\n\n\
  ### 9\n\n## Databricks Runtime for Deep Learning\n\n本章将深入探讨经典深度学习算法的开发，用于基于非结构化数据训练和部署模型，同时探索库和算法。示例将侧重于使用\
  \ Databricks 进行 DL 的特殊性和优势，创建 DL 模型。在本章中，我们将学习如何在 Azure Databricks 中高效训练深度学习模型以及可供使用的不同库的实现。\n\
  \n本章将介绍以下主题：\n- Loading data for deep learning\n- Managing data using TFRecords\n\
  - Automating scheme inference\n- Using Petastorm for distributed learning\n- Reading\
  \ a dataset\n- Data preprocessing and featurization\n\n本章将更侧重于深度学习模型而非机器学习模型。主要区别在于我们将更专注于处理大量非结构化数据。本章将以一个示例结束，展示如何使用\
  \ TensorFlow 中的预训练模型基于新领域数据提取特征。\n\n### Technical requirements\n\n要完成本章中的示例，您需要具备以下条件：\n\
  - An Azure Databricks subscription\n- An Azure Databricks notebook attached to a\
  \ running cluster with Databricks Runtime ML of version 7.0 or higher.\n\n### Loading\
  \ data for deep learning\n\n在本章中，我们将学习如何为分布式训练准备数据。为此，我们将学习如何高效加载数据，以创建可以利用 Azure\
  \ Databricks 分布式计算特性并处理大量数据的基于深度学习的应用。我们将描述两种用于处理分布式训练的大型数据集的方法。这两种方法分别是 Petastorm\
  \ 和 TFRecord，它们是使我们在 Azure Databricks 中将大型复杂数据集加载到深度学习算法时工作更轻松的库。\n\n快速浏览一下，Petastorm\
  \ 和 TFRecord 方法的主要特点如下：\n- **Petastorm:** 它是一个开源库，允许我们直接以 Apache Parquet 格式加载数据来训练我们的深度学习算法。这是\
  \ Azure Databricks 的一大优势，因为 Parquet 是在处理大量数据时广泛使用的格式。\n- **TFRecord:** 另一种选择是使用\
  \ TFRecord 格式作为 Azure Databricks 中分布式深度学习的数据源，该格式基于 TensorFlow 框架。TFRecord 格式是一种简单的面向记录的二进制格式，可用于存储\
  \ TensorFlow 应用的数据或存储训练数据。在 TensorFlow 库中，`tf.data.TFRecordDataset` 是一个用于此目的的类，它由\
  \ TFRecord 文件中的记录组成。\n\n在本章的以下部分中，我们将描述并说明将数据保存到 TFRecord 文件并重新加载以训练我们的深度学习 TensorFlow\
  \ 模型的推荐方法，以及如何使用 Petastorm 读取 Parquet 文件以在 Azure Databricks 中训练深度学习模型。\n\n### Using\
  \ TFRecords for distributed learning\n\n尽管它仍然不是 TensorFlow 的常用组件，但 TFRecord 文件格式是\
  \ TensorFlow 用于存储训练模型数据的专有二进制存储格式。二进制格式在处理大型数据集时具有优势，因为它可以显著提高处理和加载管道的性能，从而减少训练模型所需的时间。这种二进制数据存储更高效，占用的空间更少，读写所需的时间也更短。\n\
  \nTFRecord 格式还允许我们利用 Azure Databricks 等系统的多处理和分布式计算功能，这些系统在处理太大而无法完全存储在内存中的大量数据时常用。在这些情况下，当数据量太大而无法存储在内存中时，二进制格式变得特别有用，因为它减少了数据的内存占用和处理所需的时间，然后此过程以批处理方式进行。\n\
  \nTFRecord 的另一个特性是它也针对存储序列数据（如时间序列或词嵌入）进行了优化，这在销售趋势或自然语言处理应用中非常有用。\n\n在下一节中，我们将学习如何构建\
  \ TFRecords，如何使用它们处理大量数据，以及如何通过指定 schema inference 来优化其加载过程，所有这些都使我们能够在 Azure Databricks\
  \ 中高效训练模型。\n\n### Structuring TFRecords files\n\nTFRecord 文件格式是一种简单的面向记录的二进制格式，其设计目标是更高效地存储机器和深度学习模型训练的数据。TFRecordDataset\
  \ 类允许我们将 TFRecord 格式的文件作为训练管道的一部分进行流式传输。这些 TFRecord 文件将数据存储为二进制字符串序列，这使得在从文件读取或写入之前必须预先定义数据的结构。为了指定数据的结构，我们可以使用\
  \ tf.train.Example 或 tf.train.SequenceExample TensorFlow 类来存储数据样本，之后必须对其进行序列化，然后才能使用\
  \ TFRecordWriter 写入磁盘。\n\n使该库更优化的原因之一是 tf.train.Example 不是常见的 Python 类，而是一个 protocol\
  \ buffer，这是一种更高效地序列化结构化数据的方法。\n\n在 Azure Databricks 中，我们可以使用 `spark-tensorflow-connector`\
  \ 库来利用 TFRecord 文件格式的优势，并使用它将 Apache Spark DataFrames 保存为 TFRecord 文件。该库允许通过简单地使用\
  \ PySpark API 将 Spark 数据帧转换为 TFRecords，并且默认安装在 Azure Databricks Machine Learning\
  \ Runtime 中，这是一个针对机器和深度学习应用优化的运行时。如果您未使用此版本的运行时，则需要从 Maven 仓库手动将库安装到集群或笔记本中，如我们在之前章节中看到的那样。\n\
  \n`spark-tensorflow-connector` 库使我们能够通过 PySpark API 在分布式文件系统（如 Azure Databricks\
  \ Spark 数据帧）中读取 TFRecord 文件。当我们读取数据时，可以向解析器传递以下选项：\n- **load**: 它指定 TFRecord 文件的输入路径，并且与\
  \ Spark 类似，它可以接受标准的 globbing 表达式。\n- **schema**: 它是 TFRecord 文件的 schema。可选地，我们可以使用\
  \ Spark `StructType` 定义此 schema。如果未传递任何内容，schema 将从 TFRecord 文件中推断。\n- **recordType**:\
  \ 这是 TFRecord 文件的输入格式，接受两个可能的选项，即 `Example` 和 `SequenceExample`。默认选项是 `Example`。\n\
  \n当我们将 Spark Dataframe 写入 TFRecord 文件时，可以向 API 传递以下选项：\n- **save**: 这是写入 TFRecord\
  \ 文件的输出路径，可以是本地或分布式文件系统位置。\n- **codec**: 这是用于压缩 TFRecord 文件的 codec。例如，如果我们指定选项 `org.apache.hadoop.io.compress.GzipCodec`，它将启用\
  \ gzip 压缩。在读取压缩的 TFRecord 文件时，用于压缩它们的 codec 可以自动推断，因此这不是必需的选项。\n- **recordType**:\
  \ 这是 TFRecord 文件的期望输出格式。与读取时一样，可用选项为 `Example` 和 `SequenceExample`，默认选项为 `Example`。\n\
  \n\n\n\n\n- **writeLocality**：它将决定 TFRecord 文件是写入工作节点本地还是分布式文件系统。可选选项如下：\n  a) **distributed**：这是默认选项，决定文件使用\
  \ Spark 默认文件系统写入。\n  b) **local**：此选项以分区方式将文件写入各个工作节点的磁盘，每个工作节点本地磁盘上写入部分数据。\n\n\
  当我们使用本地模式时，它会将数据写入每个工作节点的本地磁盘上，每个工作节点存储数据的一个子集。哪个子集数据存储在哪个工作节点上取决于数据帧的分区方式。之后，这些数据子集将被合并成一个单一的\
  \ TFRecord 文件并写入分区所在的节点。这是一个在分布式方式训练机器和深度学习算法时很有用的功能，其中每个工作节点接收到一个数据子集进行训练。当指定本地模式作为选项时，传递给写入器的路径将被理解为每个工作节点上的基路径，数据子集将写入该路径。\n\
  \n## 使用 TFRecords 管理数据\n\n在本节中，我们将演示如何将 Spark DataFrames 中的图像数据保存到 TFRecords 并使用\
  \ Azure Databricks 中的 TensorFlow 加载它。我们将以 Databricks 文件系统上可用的 flowers 示例数据集为例，其中包含存储在五个子目录下的花卉照片，每个类别一个。\n\
  \n我们将加载 flowers Delta 表，该表包含使用二进制文件数据源预处理的花卉数据集并存储为 Spark DataFrame。我们将使用此数据来演示如何将\
  \ Spark DataFrames 中的数据保存到 TFRecords：\n\n- 1. 作为第一步，我们将使用 PySpark 加载数据：\n\n```\n\
  from pyspark.sql.functions import col\nimport tensorflow as tf\nspark_df = spark.read.format(\"\
  delta\").load(\"/databricks-datasets/flowers/delta\") \\\n    .select(col(\"content\"\
  ), col(\"label_index\")) \\\n    .limit(100)\n```\n\n2. 接下来，我们将把加载的数据保存为 TFRecord\
  \ 类型文件：\n\n```\npath = '/ml/flowersData/converted_data.tfrecord'\nspark_df.write.format(\"\
  tfrecords\").mode(\"overwrite\").save(path)\ndisplay(dbutils.fs.ls(path))\n```\n\
  \n正如你所见，由于底层 spark-tensorflow-connector 库的存在，我们可以轻松地将 Spark DataFrames 保存到 TFRecord\
  \ 文件，该库将 Spark 与 TensorFlow 集成：\n\n```\nfrom pyspark.sql.functions import col\n\
  import tensorflow as tf\nspark_df = spark.read.format(\"delta\").load(\"/databricks-datasets/flowers/delta\"\
  ) \\\n.select(col(\"content\"), col(\"label_index\")) \\\n.limit(100)\n```\n\nspark_df:\
  \ pyspark.sql.dataframe.DataFrame = [content: binary, label_index: long]\n\n```\n\
  path = '/ml/flowersData/converted_data.tfrecord'\nspark_df.write.format(\"tfrecords\"\
  ).mode(\"overwrite\").save(path)\ndisplay(dbutils.fs.ls(path))\n```\n\n|  | path\
  \ | name | size |\n|---|---|---|---|\n| 1 | dbfs:/ml/flowersData/converted_data.tfrecord/_SUCCESS\
  \ | _SUCCESS | 0 |\n| 2 | dbfs:/ml/flowersData/converted_data.tfrecord/part-r-00000\
  \ | part-r-00000 | 17175166 |\n\nShowing all 2 rows.\n\nFig.9.1 – Output location\
  \ of the tfrecord file\n\n3. 学习如何在 Azure Databricks 中使用 TFRecords 的下一步是加载 TFRecord\
  \ 数据到 TensorFlow。首先，我们将创建一个 TFRecordDataset 作为输入管道：\n\n```\nimport os\nfilenames\
  \ = [f\"/dbfs{path}/{name}\" for name in os.listdir(\"/dbfs\" + path) if name.startswith(\"\
  part\")]\n```\n\n```\ndataset = tf.data.TFRecordDataset(filenames)\n```\n\n4. 为了能够使用数据，我们需要创建一个解码器函数来读取、解析和规范化数据。我们使用\
  \ map 函数将记录解析为张量，该函数将把我们的解码器函数应用于每个样本。首先，我们将定义解码器函数，它将以一个序列化示例作为必需参数，图像大小作为可选参数：\n\
  \n```\ndef decode_and_normalize(serialized_example, image_size = 224):\n    # Parse\
  \ from single example\n    feature_dataset = tf.io.parse_single_example(\n     \
  \   serialized_example,\n        features={\n            'content': tf.io.FixedLenFeature([],\
  \ tf.string),\n            'label_index': tf.io.FixedLenFeature([], tf.int64),\n\
  \        })\n    # Decode the parsed data\n    image = \\\n    tf.io.decode_jpeg(feature_dataset['content'])\n\
  \    label = \\\n    tf.cast(feature_dataset['label_index'], tf.int32)\n    # Resize\
  \ the decoded data into the desired size\n    image = tf.image.resize(image, [image_size,\
  \ image_size])\n    # Finally, normalize the data\n    image = \\\n    tf.cast(image,\
  \ tf.float32) * (1. / 255) - 0.5\n    return image, label\n```\n\n5. 一旦我们定义了解码函数，我们就可以使用它通过映射数据集并将其应用于其中的每个样本来解析我们的数据：\n\
  \n```\nparsed_dataset = dataset.map(decode_and_normalize)\n```\n\n这样，我们就解析了数据集，现在它可以作为输入数据用于训练机器或深度学习模型。\n\
  \n在下一节中，我们将深入探讨如何在 Azure Databricks 中使用 TFRecord 的完整示例。\n\n## 自动模式推断\n\nspark-tensorflow-connector\
  \ 库，该库将 Spark 与 TensorFlow 集成，支持在将 TensorFlow 记录读取到 Spark DataFrames 时自动进行模式推断。模式推断是一个昂贵的操作，因为它需要额外的一次数据读取，因此最好显式指定它，这将提高我们管道的整体性能。\n\
  \n以下 Python 代码示例演示了我们如何在作为示例创建的一些测试数据上执行此操作：\n\n- 1. 我们首先要定义数据的模式：\n\n```\nfrom\
  \ pyspark.sql.types import *\npath = \"test-output.tfrecord\"\nfields = [StructField(\"\
  id\", IntegerType()),\nStructField(\"IntegerCol\", IntegerType()),\nStructField(\"\
  LongCol\", LongType()),\nStructField(\"FloatCol\", FloatType()),\nStructField(\"\
  DoubleCol\", DoubleType()),\nStructField(\"VectorCol\", ArrayType(DoubleType(),\n\
  True)),\nStructField(\"StringCol\", StringType())]\nschema = StructType(fields)\n\
  ```\n\n- 2. 接下来，我们创建一个包含测试数据的 Spark DataFrame，对其进行并行化，并将其作为 TFRecord 文件写入：\n\n```\n\
  test_rows = [[11, 1, 23, 10.0, 14.0, [1.0, 2.0], \"r1\"],\n[21, 2, 24, 12.0, 15.0,\
  \ [2.0, 2.0], \"r2\"]]\nrdd = spark.sparkContext.parallelize(test_rows)\ndf = spark.createDataFrame(rdd,\
  \ schema)\n```\n\n```\ndf.write.format(\"tfrecords\").option(\"recordType\", \"\
  Example\").save(path)\nAfter this, we can read the TFRecord file back to a Spark\
  \ Data frame in the next way:\ndf = spark.read.format(\"tfrecords\").option(\"recordType\"\
  , \"Example\").load(path)\ndf.show()\n```\n\n3. 这里，我们看到整个过程在 Azure Databricks 笔记本中运行：\n\
  \n```\nfrom pyspark.sql.types import *\npath = \"test-output.tfrecord\"\nfields\
  \ = [StructField(\"id\", IntegerType()),\nStructField(\"IntegerCol\", IntegerType()),\n\
  StructField(\"LongCol\", LongType()),\nStructField(\"FloatCol\", FloatType()),\n\
  StructField(\"DoubleCol\", DoubleType()),\nStructField(\"VectorCol\", ArrayType(DoubleType(),\
  \ True)),\nStructField(\"StringCol\", StringType())]\nschema = StructType(fields)\n\
  \ntest_rows = [[11, 1, 23, 10.0, 14.0, [1.0, 2.0], \"r1\"], [21, 2, 24, 12.0, 15.0,\
  \ [2.0, 2.0], \"r2\"]]\nrdd = spark.sparkContext.parallelize(test_rows)\ndf = spark.createDataFrame(rdd,\
  \ schema)\npath= 'dbfs:/tmp/dataset'\ndf.write.format(\"tfrecords\").option(\"recordType\"\
  , \"Example\").save(path)\ndisplay(df)\n```\n\n(3) Spark Jobs\ndf: pyspark.sql.dataframe.DataFrame\
  \ = [id: integer, IntegerCol: integer ... 5 more fields]\n\n| id | IntegerCol |\
  \ LongCol | FloatCol | DoubleCol | VectorCol | StringCol |\n|---|---|---|---|---|---|---|\n\
  | 1 | 11 | 1 | 23 | 10 | 14 | [1, 2] | r1 |\n| 2 | 21 | 2 | 24 | 12 | 15 | [2, 2]\
  \ | r2 |\n\nShowing all 2 rows.\n\nFig.9.2 – TFRecord column example data types\n\
  \n正如你所见，Spark 与 Azure Databricks 中 TFRecord 文件格式的集成是无缝的，允许我们直接在 Spark DataFrames\
  \ 中读写 TFRecord 文件。\n\n## 使用 TFRecordDataset 加载数据\n\n我们用于处理 TFRecord 文件的另一个可用选项是使用\
  \ TFRecordDataset TensorFlow 类。当我们需要标准化输入数据以提高加载过程的性能时，这很有用：\n\n- 1. 你也可以传递一个包含我们希望\
  \ TFRecordDataset 类读取的文件路径的列表，如下一代码块所示：\n\n```\nfilenames = [<your_tfrecode_file_1>,...,\
  \ [<your_tfrecode_file_n>]\nraw_dataset = tf.data.TFRecordDataset(filenames)\n```\n\
  \nraw_dataset 是一个 TFRecordDataset 类，包含序列化的 tf.train.Example 记录。当我们迭代它时，它将以标量字符串张量的形式返回这些记录。\n\
  \n- 2. 在下一个示例中，我们将使用 take 方法仅显示 raw_dataset 中的前 10 条记录：\n\n```\nfor raw_record in\
  \ raw_dataset.take(10):\n    print(repr(raw_record))\n```\n\n请记住，要迭代 TFRecordDataset，必须启用急切执行。\n\
  \n- 3. tf.train.Example 标量字符串张量然后可以使用 tf.io.FixedLenFeature 函数进行解析。请注意，我们需要定义 feature_description，因为数据集使用图执行，此描述用于构建它们的形状和类型签名：\n\
  \n```\nfeature_description = {\n    'feature0': tf.io.FixedLenFeature([], tf.int64,\
  \ default_value=0),\n    'feature1': tf.io.FixedLenFeature([], tf.string, default_value=''),\n\
  \    'feature2': tf.io.FixedLenFeature([], tf.float32, default_value=0.0),\n}\n\
  ```\n\n\n\n\n\nfeature_description 是一个字典，用于保存特征的描述，这对于我们的解析函数是必要的。\n\n4. 这里，我们下一步将定义解析函数，该函数将使用之前定义的\
  \ feature_description 字典读取 tf.train.Example 类输入：\n\n```\ndef _parsing_function(proto_input):\n\
  \    return tf.io.parse_single_example(proto_input,\n    feature_description)\n\
  ```\n\n5. 作为读取 TFRecord 文件的下一步，我们将使用 tf.data.Dataset.map 方法将我们定义的解析函数应用于数据集中的每个项目：\n\
  \n```\nparsed_dataset = raw_dataset.map(_parsing_function)\nparsed_dataset\n```\n\
  \n我们也可以使用 tf.io.parse_example 函数以批量的方式解析数据，作为逐个读取的替代方案。\n\n6. 我们可以通过在启用急切执行时显示数据集中的观测值来检查数据。这里，无论数据集中有多少个观测值，我们只会显示其中前\
  \ 10 个，它们将显示为特征的字典：\n\n```\nfor parsed_record in parsed_dataset.take(10):\n    print(repr(parsed_record))\n\
  ```\n\n显示的每个项目都是一个 tf.Tensor，它是 TensorFlow 的一个类，其值是该张量的 numpy 元素。\n\n7. 要将观测值写入\
  \ TFRecord 文件，我们需要在写入文件之前将每个观测值转换为 tf.train.Example 类。这里，我们将把 n_obs 个 tf.train.Example\
  \ 记录写入 TFRecord 文件：\n\n```\nwith tf.io.TFRecordWriter(filename) as writer:\n   \
  \ for i in range(n_obs):\n        example = serialize_example(feature0[i],\n   \
  \                                 feature1[i],\n                               \
  \     feature2[i])\n        writer.write(example)\n```\n\nTFRecord 文件格式在处理需要使用并行或分布式方法处理的大量数据时优化了我们的训练管道。如本节所示，我们可以使用\
  \ TensorFlow 的原生工具来操作 TFRecord 文件，以利用 Azure Databricks 等分布式计算系统的优势。在下一节中，我们将介绍 Petastorm，这是一个用于启用使用\
  \ Parquet 文件作为机器和深度学习应用训练数据的库。\n\n## 使用 Petastorm 进行分布式学习\n\nPetastorm 是一个开源库，允许我们使用存储为\
  \ Apache Parquet 文件的数据集对机器和深度学习算法进行单机或分布式训练。它支持流行的框架，如 PyTorch、TensorFlow 和 PySpark，也可用于其他\
  \ Python 应用。Petastorm 为我们提供了一个简单的函数，用于将 Parquet 格式的功能增强为 Petastorm 特定的数据，以便在机器和深度学习模型训练中使用。我们只需通过创建来自\
  \ Databricks 文件系统的读取器对象并对其进行迭代即可读取数据。底层 Petastorm 库使用 PyArrow 库读取 Parquet 文件。\n\n\
  在本节中，我们将讨论如何使用 Petastorm 进一步扩展 Azure Databricks 中机器和深度学习训练管道的性能。\n\n## 介绍 Petastorm\n\
  \n如前所述，Petastorm 是一个开源库，它使单机或分布式训练和评估机器和深度学习模型成为可能，使用存储在 Apache Parquet 格式中的数据以及已加载到\
  \ Spark DataFrames 中的数据。该库支持流行的科学数据框架，如 TensorFlow、PyTorch 和 PySpark。当我们需要使用存储在\
  \ Parquet 格式中的数据训练机器和深度学习模型时，Petastorm 是最佳选择。\n\nPetastorm 库具有各种功能，如优化的数据共享、数据分区、洗牌和行过滤，以及使用\
  \ n-gram 支持时间序列。\n\n当模型利用观察到的环境变量来更好地理解环境并预测该环境中的未来事件时，需要时间上下文时使用 n-gram。\n\n当输入数据是时间序列时，Petastorm\
  \ 可以提供这种时间上下文。当从 Petastorm Reader 对象请求 n-gram 时，连续的行将被合并为单个训练样本，以提供时间上下文，同时保持数据结构化。\n\
  \n使用 Petastorm 加载数据时，我们有两个可用的选项来并行化数据加载和解码操作：\n\n- **线程池**：此实现用于观测值是编码数据或高分辨率图像时。选择此模式时，大部分处理时间都花费在通过\
  \ C++ 代码解码图像，几乎没有 Python 代码。\n- **进程池**：此实现适用于行大小较小时。选择此模式时，大部分解码仅使用 Python 代码在并行运行的多个进程中完成。\n\
  \n为并行化数据加载和解码操作而选择的选项将取决于您想要读取的数据类型。\n\n正如我们在本节中介绍的，Petastorm 是一个开源库，帮助我们利用 Parquet\
  \ 文件格式的效率，并允许我们以分布式方式使用它来训练深度学习模型。在下一节中，我们将学习如何使用 Petastorm 创建数据集并使用它准备图像数据，以在 Azure\
  \ Databricks 机器学习运行时中训练我们的深度学习模型。\n\n## 生成数据集\n\n同样，我们为其他数据集文件格式所做的那样，当我们想要使用 Petastorm\
  \ 生成数据集时，我们需要首先定义一个数据模式，称为 Unischema。这是我们唯一需要这样做的时候，因为 Petastorm 然后会将其广播到所有受支持的框架，如\
  \ PySpark、TensorFlow 和纯 Python。\n\n定义的 Unischema 被序列化为 Parquet 存储元数据中的自定义字段，因此只需指定数据集的路径即可读取它。\n\
  \n以下示例展示了如何创建 Unischema 实例，该实例将用于定义数据集的模式。为了正确定义模式，需要传递到字段属性中的必需参数是字段名称、表示为 NumPy\
  \ 数据类型的数据类型、数组的形状、用于编码和解码数据的编解码器，以及字段是否可为空：\n\n```\nfirst_schema = Unischema('first_schema',\
  \ [\n    UnischemaField('id', np.int32, (),\n    ScalarCodec(IntegerType()), False),\n\
  \    UnischemaField('image1', np.uint8, (128, 256, 3)\n    CompressedImageCodec('png'),\
  \ False),\n```\n\n```\nUnischemaField('array_4d', np.uint8, (None, 128, 30, None),\
  \ Ndar rayCodec(), False),\n]\n```\n\n我们也可以使用 PySpark API 来写入 Petastorm 数据集。以下代码示例演示了如何使用\
  \ Petastorm 和之前定义的数据模式创建 10 行数据集：\n\n```\nrows_count = 10\nwith materialize_dataset(spark,\
  \ output_url, 'first_schema', rowgroup_size_mb):\n    rows_rdd = sc.parallelize(range(rows_count))\\\
  \n    .map(row_generator)\\\n    .map(lambda x: dict_to_spark_row(first_schema',\
  \ x))\n    spark.createDataFrame(rows_rdd,\n                          first_schema'.as_spark_schema())\
  \ \\\n    .write \\\n    .parquet('file:///tmp/example_dataset')\n```\n\n让我们更详细地解释一下这个示例中发生了什么。materialize_dataset\
  \ 是上下文管理器，它将根据指定的数据模式处理所有必要的配置，并最终写入 Petastorm 特定的元数据。输出文件路径可以指向本地或 Databricks 文件系统中的位置。rowgroup_size_mb\
  \ 定义 Parquet 行组的目标大小（以兆字节为单位），row_generator 是一个返回与指定数据模式匹配的 Python 字典的函数。dict_to_spark_row\
  \ 将根据指定的模式验证数据类型并将字典转换为 pyspark.Row 对象。\n\n我们可以使用 Petastorm Spark 转换器 API 从 Spark\
  \ DataFrames 加载数据，该 API 使我们能够将 Spark DataFrames 转换为 TensorFlow 或 PyTorch 格式。这是通过首先将输入\
  \ Spark DataFrame 写入 Parquet 文件，然后可以使用 tf.data.Dataset 或 torch.utils.data.DataLoader\
  \ 加载该文件来完成的。\n\n当我们进行分布式训练深度学习模型时，推荐的工作流程是在 Azure Databricks 中加载和处理数据，使用 Petastorm\
  \ spark_dataset_converter 方法将数据从 Spark DataFrame 转换为 TensorFlow 数据集或 PyTorch DataLoader，最后使用它来训练我们的深度学习模型。\n\
  \n\n\n\n\n# 读取数据集\n\n使用 Petastorm 读取数据集可以非常简单。在本节中，我们将演示如何轻松地将 Petastorm 数据集加载到两个常用的深度学习框架中，即\
  \ TensorFlow 和 PyTorch：\n\n1. 要加载我们的 Petastorm 数据集，我们使用 `petastorm.reader.Reader`\
  \ 类，它实现了迭代器接口，允许我们使用纯 Python 高效地遍历样本。`petastorm.reader.Reader` 类可以使用 `petastorm.make_reader`\
  \ 工厂方法创建：\n\n```\nfrom petastorm import make_reader\nwith make_reader('dfs://some_dataset')\
  \ as reader:\n    for sample in reader:\n        print(sample.id)\n        plt.imshow(sample.image1)\n\
  ```\n\n2. 以下代码示例展示了如何将数据集流式传输到 TensorFlow `Examples` 类中，正如我们之前所见，它是一个命名元组，其键为数据集中\
  \ Unischema 中指定的键，值是 `tf.tensor` 对象：\n\n```\nfrom petastorm.tf_utils import tf_tensors\n\
  with Reader('dfs://some_dataset') as reader:\n    tensor = tf_tensors(reader)\n\
  \    with tf.Session() as sess:\n        sample = sess.run(tensor)\n        print(sample.id)\n\
  \        plt.imshow(sample.image1)\n```\n\n通过这种方式，我们可以将 Parquet 数据读取到 TensorFlow\
  \ 原生数据结构中。未来，它们将能够使用 `tf.data.Dataset` 接口访问数据。\n\n3. 与加载数据到 TensorFlow 类似，使用 Petastorm\
  \ 数据集加载的数据可以通过适配器类 `petastorm.pytorch.DataLoader` 整合到 PyTorch 中，如下个 Python 代码示例所示：\n\
  \n```\nfrom petastorm.pytorch import DataLoader\nwith DataLoader(Reader('dfs://some_dataset'))\
  \ as train_loader:\n    sample = next(iter(train_loader))\n```\n\n```\nprint(sample['id'])\n\
  plt.plot(sample['image1'])\n```\n\nPetastorm 将数据存储在 Parquet 数据格式中，而 Parquet 数据格式由\
  \ Spark 原生支持，其优点是使我们能够使用各种 PySpark 方法来分析和处理数据集。\n\n4. 下一个 Python 代码示例展示了如何将 Petastorm\
  \ 数据集作为 Spark DataFrame 实例读取：\n\n```\nfrom petastorm.spark_utils import dataset_as_rdd\n\
  rdd = dataset_as_rdd('dfs://some_dataset', spark,\n    [first_schema.id, first_schema.image1])\n\
  print(rdd.first().id)\n```\n\n现在我们的 Petastorm 数据集已作为 Spark DataFrame 加载，它允许我们使用标准工具读取和可视化它。请注意，此数据尚未解码，并且查看具有可显示的数据类型的字段的值会很有用，例如字符串或标量。\n\
  \n5. 例如，在下面的代码中，我们展示了如何根据数据集的路径从 Parquet 文件创建一个 Spark DataFrame 对象：\n\n```\ndataframe\
  \ = spark.read.parquet(dataset_url)\n```\n\n6. 然后我们可以用任何 Spark DataFrame 的方式显示模式：\n\
  \n```\ndataframe.printSchema()\n```\n\n7. 我们也可以执行诸如计数之类的操作：\n\n```\ndataframe.count()\n\
  And do operations like show on a single column:\ndataframe.select('id').show()\n\
  We can also utilize SQL as it can be used to query a Petastorm dataset:\nnumber_of_rows\
  \ = spark.sql(\n    'SELECT count(id) '\n    'from parquet.`file:///example_dataset`').collect()\n\
  ```\n\n一旦我们能够加载 Petastorm 数据集，我们就可以将其用于为分布式深度学习训练准备数据，正如我们在下一节中将举例说明的那样。\n\n# 使用\
  \ Petastorm 为深度学习准备数据\n\n本节将演示在 Azure Databricks 上的工作流程，使用 Spark 加载和预处理数据，并使用 Parquet\
  \ 格式将数据保存到优化的 FUSE 挂载 `dbfs:/ml` 位置。然后我们将使用 Petastorm 加载数据并将其传递给深度学习框架进行训练或推理：\n\
  \n1. 首先，我们将在 `dbfs:/ml` FUSE 挂载中创建一个唯一的 working 目录，该挂载针对机器和深度学习应用进行了优化：\n\n```\n\
  import os\nimport subprocess\nimport uuid\nwork_dir = os.path.join(\"/ml/tmp/petastorm\"\
  ,\n    str(uuid.uuid4()))\ndbutils.fs.mkdirs(work_dir)\ndef get_local_path(dbfs_path):\n\
  \    return os.path.join(\"/dbfs\", dbfs_path.lstrip(\"/\"))\n```\n\n虽然可以在 PySpark\
  \ 中使用许多文件格式，但在本示例中我们将使用 LIBSVM 格式的 MNIST 数据集，并使用 Spark 内置的 LIBSVM 数据源加载它。\n\n2.\
  \ LIBSVM 是一个常用的开源机器学习库，针对核化支持向量机进行了优化。每个 LIBSVM 文件都是文本格式文件，其中每一行代表一个带标签的稀疏特征向量，使用以下格式：\n\
  \n```\nlabel index1:value1 index2:value2\n```\n\n3. 其中索引为基于一且按升序排列。加载后，特征索引将被转换为基于零。我们的第一步是下载数据，因此在下一个代码示例中，我们将从\
  \ URL 获取数据并将其作为 Spark DataFrame 加载，指定文件中特征的数量，在我们的例子中为 784：\n\n```\ndata_url = \"\
  https://www.csie.ntu.edu.tw/~cjlin/\nlibsvmtools/datasets/multiclass/mnist.bz2\"\
  \nlibsvm_path = os.path.join(work_dir, \"mnist.bz2\")\nsubprocess.check_output([\"\
  wget\", data_url, \"-O\", get_local_path(libsvm_path)])\n```\n\n```\ndf = spark.read.format(\"\
  libsvm\") \\\n.option(\"numFeatures\", \"784\") \\\n.load(libsvm_path)\n```\n\n\
  4. Petastorm 库允许我们在加载数据的 Spark DataFrame 中使用标量和数组列。在这里，我们的数据使用 MLlib 向量表示，这是一种需要特殊处理的自定义类型。我们首先需要注册一个用户定义函数，将\
  \ MLlib 向量转换为密集数组。我们可以通过在 Azure Databricks 笔记本中的单元格中运行以下 Scala 代码来做到这一点：\n\n```\n\
  %scala\nimport org.apache.spark.ml.linalg.Vector\nval toArray = udf {v: Vector =>\
  \ v.toArray }\nspark.sqlContext.udf.register(\"toArray\", toArray)\n```\n\n5. 我们将使用此用户定义函数将\
  \ MLlib 稀疏向量转换为密集数组，然后以 Parquet 格式写入文件。Petastorm 库将 Parquet 文件的行分组采样为批次。如前所述，批大小是\
  \ I/O 和计算性能利用的重要参数，如果使用 `dfs:/ml` 目录中的优化 FUSE 挂载，结果会更好。控制批大小的参数是 `parquet.block.size`\
  \ 选项，它会传递给解析器：\n\n```\nparquet_path = os.path.join(work_dir, \"parquet\")\ndf.selectExpr(\"\
  toArray(features) AS features\", \"int(label) AS label\") \\\n.repartition(10) \\\
  \n.write.mode(\"overwrite\") \\\n.option(\"parquet.block.size\", 1024 * 1024) \\\
  \n.parquet(parquet_path)\n```\n\n我们可以使用 Petastorm 库以 Parquet 格式加载数据来创建例如 `tf.data.Dataset`\
  \ 类实例，然后将其馈送到我们的深度学习框架中以训练我们的模型。在这里，我们将演示如何通过使用 Keras 创建一个简单的卷积神经网络模型来实现这一点，Keras\
  \ 是 TensorFlow 中包含的深度学习框架。\n\n6. 我们将进行所有必要的库导入并创建一个函数来检索具有所需架构的模型，在我们的例子中将是二维卷积层，后跟最大池化和\
  \ dropout 层：\n\n```\nimport tensorflow as tf\nfrom tensorflow import keras\nfrom\
  \ tensorflow.keras import models, layers\nfrom petastorm import make_batch_reader\n\
  from petastorm.tf_utils import make_petastorm_dataset\ndef get_model():\n    model\
  \ = models.Sequential()\n    model.add(layers.Conv2D(32, kernel_size=(3, 3),\n \
  \                       activation='relu',\n                        input_shape=(28,\
  \ 28, 1)))\n    model.add(layers.Conv2D(64, (3, 3),\n                        activation='relu'))\n\
  \    model.add(layers.MaxPooling2D(pool_size=(2, 2)))\n    model.add(layers.Dropout(0.25))\n\
  \    model.add(layers.Flatten())\n    model.add(layers.Dense(128, activation='relu'))\n\
  \    model.add(layers.Dropout(0.5))\n    model.add(layers.Dense(10, activation='softmax'))\n\
  \    return model\n```\n\n7. 在 Azure Databricks Machine Learning Runtime 7.0 之前的版本中，我们需要将保存为\
  \ Parquet 格式时创建的 `_*` 文件列入白名单，但现在，Azure Databricks Machine Learning Runtime 已预先安装了\
  \ `pyarrow` 库，该库会自动忽略所有 `_*` 文件。我们现在可以使用 `get_local_path` 函数定义我们的数据集的 Petastorm\
  \ 路径：\n\n```\npetastorm_dataset_url = \"file://\" + get_local_path(parquet_path)\n\
  ```\n\n8. 在下一个 Python 代码示例中，我们将使用 Petastorm `make_batch_reader` 函数以批数据加载 Parquet\
  \ 文件的行组，以训练使用先前定义的函数获得的 Keras 模型：\n\n```\nwith make_batch_reader(petastorm_dataset_url,\
  \ num_epochs=100) as reader:\n```\n\n\n\n\n\n```\ndataset = make_petastorm_dataset(reader)\
  \ \\\n.map(lambda x: (tf.reshape(x.features, [-1, 28, 28, 1]),\n tf.one_hot(x.label,\
  \ 10)))\n\nmodel = get_model()\noptimizer = keras.optimizers.Adadelta()\nmodel.compile(optimizer=optimizer,\n\
  \    loss='categorical_crossentropy',\n    metrics=['accuracy'])\nmodel.fit(dataset,\
  \ steps_per_epoch=10, epochs=10)\n```\n\n9. 在这里，我们可以看到在运行 ML Runtime 的 Azure Databricks\
  \ 笔记本中训练过程的输出：\n\n```\nCmd 16\n> 1 with make_batch_reader(petastorm_dataset_url,\
  \ num_epochs=100) as reader:\n2     dataset = make_petastorm_dataset(reader) \\\n\
  3 .map(lambda x: (tf.reshape(x.features, [-1, 28, 28, 1]), tf.one_hot(x.label, 10)))\n\
  4     model = get_model()\n5     optimizer = keras.optimizers.Adadelta()\n6    \
  \ model.compile(optimizer=optimizer,\n7         loss='categorical_crossentropy',\n\
  8         metrics=['accuracy'])\n9     model.fit(dataset, steps_per_epoch=10, epochs=10)\n\
  10\ns removed, simply drop this attribute\n    column_as_pandas = column.data.chunks[0].to_pandas()\n\
  10/10 [==============================] - 1s 149ms/step - loss: 49.8006 - accuracy:\
  \ 0.0885\nEpoch 2/10\n10/10 [==============================] - 1s 122ms/step - loss:\
  \ 46.9740 - accuracy: 0.1024\nEpoch 3/10\n10/10 [==============================]\
  \ - 1s 116ms/step - loss: 46.6869 - accuracy: 0.0794\nEpoch 4/10\n10/10 [==============================]\
  \ - 1s 125ms/step - loss: 45.8081 - accuracy: 0.0927\nEpoch 5/10\n10/10 [==============================]\
  \ - 1s 134ms/step - loss: 43.4356 - accuracy: 0.0897\nEpoch 6/10\n10/10 [==============================]\
  \ - 1s 125ms/step - loss: 40.5104 - accuracy: 0.1079\nEpoch 7/10\n10/10 [==============================]\
  \ - 1s 122ms/step - loss: 39.6522 - accuracy: 0.0952\nEpoch 8/10\n10/10 [==============================]\
  \ - 1s 121ms/step - loss: 38.5819 - accuracy: 0.0915\nEpoch 9/10\n10/10 [==============================]\
  \ - 1s 126ms/step - loss: 38.0751 - accuracy: 0.1042\nEpoch 10/10\n10/10 [==============================]\
  \ - 1s 113ms/step - loss: 37.3983 - accuracy: 0.1063\nCommand took 15.50 seconds\
  \ -- by\n```\n\n图 9.3 – 使用 Petastorm 训练模型\n\n在本例中，我们定义了一个 Keras 深度学习模型，并使用读取为数据批处理的\
  \ Parquet 文件对其进行训练，以进一步优化流程。如本节所示，Petastorm 库为我们提供了高效的方法来使用 Parquet，该格式在 Spark 和\
  \ Azure Databricks 中原生受支持，以训练深度学习模型。在下一节中，我们将深入探讨一个具体示例，说明如何使用 Azure Databricks\
  \ Machine Learning Runtime 为特征化训练深度学习模型。\n\n## 数据预处理和特征化\n\n特征化是我们用来将非结构化数据，如文本、图像或时间序列数据，转换为数值连续特征的过程，这些特征更易于机器和深度学习模型处理。它可以与特征工程区分开来，因为在特征工程中，变量已经以数值形式存在，或者具有更明确的结构，这导致我们需要重构或转换这些变量，使机器或深度学习算法更容易提取模式。在特征化中，我们需要首先定义一种方法，从我们拥有的非结构化数据中提取数值特征。\n\
  \n我们基本上需要进行特征化，因为我们的深度学习模型无法直接解释非结构化数据，因此，我们不仅需要提取它，而且需要以计算高效的方式进行。如果我们使用需要频繁重新训练的模型，此过程需要纳入我们的深度学习管道中。\n\
  \nAzure Databricks Machine Learning Runtime 为我们提供了对深度学习特征化模型的支持，可用于从数据中提取上述特征。我们有可用的预训练模型，可用于计算在其他下游流程或模型中使用的特征。这些预训练模型可以使用已包含的深度学习框架\
  \ TensorFlow 和 PyTorch 创建，这些框架已包含在 Azure Databricks Machine Learning Runtime 中。\n\
  \n在本节中，我们将举例说明如何在 Azure Databricks 中通过迁移学习进行数据特征化，迁移学习是一种深度学习方法，可使用特征化作为底层技术，将领域知识从一个问题重用到另一个问题。此特征化将使用预训练模型应用于从原始数据表示中提取数值变量。\n\
  \n## 使用预训练模型进行迁移学习的特征化\n\n在本节中，我们将演示如何在 Azure Databricks Machine Learning Runtime\
  \ 中使用预训练模型生成可用于下游模型和流程的特征。在这里，我们将通过使用这些提取的特征进行迁移学习来训练新模型来展示这一点。\n\n如前所述，特征化是一种用于特征编码的技术，以便能够将一个模型的领域知识应用于不同但相关的问题。我们可以从实用角度看到这一点，即使用提取的模式来执行一项任务，以便能够将其外推到新任务，同时有可能提高效率并减少训练新模型所需的时间。\n\
  \n本节将演示如何使用 Azure Databricks Machine Learning Runtime 使用预训练的 TensorFlow 模型提取用于迁移学习的特征，使用以下工作流程：\n\
  \n- 1. 我们将从一个预训练的深度学习模型开始——在本例中，是来自 `tensorflow.keras.applications` 的图像分类模型。\n-\
  \ 2. 我们将移除预训练深度学习模型的最后一层，使其产生数值特征张量作为输出，而不是模型的实际预测。\n- 3. 我们将把该模型应用于不同的领域知识图像数据集，以便能够用它来编码数值特征。\n\
  - 4. 然后，我们可以使用这些编码的特征来训练新的下游模型，尽管在本例中我们将省略此最后一步。\n\n在本例中，我们将使用 pandas 库的 **用户定义函数（UDFs）**\
  \ 以分布式方式将特征化应用于我们的数据集。pandas UDF 是一种高效的方法，可将此特征化作为数据集转换过程的一部分应用，并且与 `Scalar Iterator`\
  \ 一样，pandas UDF 为深度学习应用提供了灵活且高性能的支持。\n\n如前所述，在本节中我们将加载数据集并使用 pandas UDF 从中提取特征。我们将采取的步骤是使用\
  \ Spark DataFrame 从二进制数据源读取数据加载数据，加载将用于迁移学习的预训练模型，最后，使用 Scalar Iterator pandas UDF\
  \ 将其应用于从数据集中编码特征。\n\n## 使用 pandas UDF 进行特征化\n\n使用预训练模型使用 pandas UDF 编码新特征的工作流程可以概括如下：\n\
  \n- 1. 首先，我们需要将数据加载到 DataFrame 中。\n- 2. 之后，我们需要准备将用于特征化的预训练模型。\n- 3. 接下来，我们将定义图像加载过程以及如何应用特征编码。\n\
  - 4. 最后，我们通过将预训练模型作为 pandas UDF 应用来提取特征。\n\n此工作流程是一种概括，也可应用于图像预处理和自定义模型训练管道。它也很高效，因为它利用\
  \ pandas UDF 来提高特征提取的性能：\n\n- 1. 我们的第一步是进行必要的库导入，其中包括实例化 ResNet50 预训练模型，该模型包含在 TensorFlow\
  \ 框架中：\n\n```\nimport pandas as pd\nfrom PIL import Image\nimport numpy as np\n\
  import io\nimport tensorflow as tf\nfrom tensorflow.keras.applications.resnet50\
  \ import ResNet50, preprocess_input\nfrom tensorflow.keras.preprocessing.image import\
  \ img_to_array\nfrom pyspark.sql.functions import col, pandas_udf, PandasUDType\n\
  ```\n\n- 2. 我们将使用本例中的 flowers 数据集作为示例数据集。此数据集包含存储在五个文件夹下的花卉照片，每个文件夹代表一种花卉类型。此数据集也存储在\
  \ Azure Databricks 数据集示例目录中：\n\n```\n%fs ls /databricks-datasets/flower_photos\n\
  ```\n\n\n\n\n\n3. 在我们确定了数据集的路径后，就可以使用 Spark API 二进制文件作为数据源来加载图像。我们也可以选择使用原生的 Spark\
  \ API 图像数据源，但二进制文件数据源会在我们处理图像的方式上提供更大的灵活性：\n\n```\nimages = spark.read.format(\"\
  binaryFile\") \\\n    .option(\"pathGlobFilter\", \"*.jpg\") \\\n    .option(\"\
  recursiveFileLookup\", \"true\") \\\n    .load(\"/databricks-datasets/flower_photos\"\
  )\n```\n\n4. 加载数据后，我们可以使用 display 函数对其进行可视化，并将结果限制为 5 条记录：\n\n```\ndisplay(images.limit(5))\n\
  ```\n\n5. 这里，我们可以看到该过程的输出：\n\n![](img/7e45bd08916c2a17d4e75cbb898f41e8_312_0.png)\n\
  \n图 9.4 – 二进制图像文件\n\n6. 接下来，我们将准备用于特征提取的预训练模型，通过下载它并截断最后一层。在本例中，我们将使用前面讨论过的 ResNet50\
  \ 预训练模型。在加载模型时，有一些关于模型大小的概念需要牢记。如果我们处理的是小于 1 GB 的中等大小模型，良好的做法是将模型下载到集群驱动程序，然后将其权重广播到工作节点上。这就是本示例将采用的方法。另一种方法是当我们处理大于\
  \ 1 GB 的模型时。在这些情况下，最好将模型权重直接加载到分布式存储中。\n\n7. 我们将实例化我们的模型并指定移除最后一层，显示模型摘要以验证最后一层已被移除，然后最终将模型权重广播到工作节点：\n\
  \n```\nmodel = ResNet50(include_top=False)\nmodel.summary()  # verify that the top\
  \ layer is removed\nbc_model_weights = sc.broadcast(model.get_weights())\n```\n\n\
  8. 下一步是定义一个函数，该函数返回一个 ResNet50 模型，其最后一层被截断，并将预训练权重广播到工作节点：\n\n```\ndef model_fn():\n\
  \    model = ResNet50(weights=None, include_top=False)\n    model.set_weights(bc_model_weights.value)\n\
  \    return model\n```\n\n现在我们有了用于实例化截断并广播模型的函数，我们可以定义 pandas UDF，该 UDF 将用于使用 Scalar\
  \ Iterator pandas UDF 对 pd.Series 数组中的图像进行特征化，以提高在工作节点上加载大型模型的性能。\n\n9. 下一个函数将用于预处理原始图像字节，并在稍后用于预测：\n\
  \n```\ndef preprocess(content):\n    img = Image.open(io.BytesIO(content)).resize([224,\
  \ 224])\n    arr = img_to_array(img)\n    return preprocess_input(arr)\n```\n\n\
  10. 接下来，我们定义另一个函数，该函数将负责使用前面定义的函数解码原始图像的 pd.Series 数组，对其应用预训练模型，并返回图像特征的 pd.Series。在这里，我们将输出的多维张量展平，以便在加载到\
  \ Spark DataFrame 时更好地处理它们：\n\n```\ndef featurize_series(model, content_series):\n\
  \    input = np.stack(content_series.map(preprocess))\n    preds = model.predict(input)\n\
  \    output = [p.flatten() for p in preds]\n    return pd.Series(output)\n```\n\n\
  11. 下一步是为我们的特征化函数定义一个 Scalar Iterator pandas UDF 包装器。这里使用的装饰器将指定此过程的输出将是类型为 ArrayType(FloatType)\
  \ 的 Spark DataFrame 列。content_series_iter 参数指定对数据批进行迭代，其中每个批都是图像的 pandas Series\
  \ 数组。使用 Scalar Iterator pandas UDF 允许我们加载模型一次并在不同数据批上多次使用它，从而提高加载大型模型的性能：\n\n```\n\
  @pandas_udf('array<float>', PandasUDFType.SCALAR_ITER)\ndef featurize_udf(content_series_iter):\n\
  \    model = model_fn()\n    for content_series in content_series_iter:\n      \
  \  yield featurize_series(model, content_series)\n```\n\n这样我们就成功注册了我们的函数，该函数稍后可用于基于我们的预训练模型获得特征。\n\
  \n## 将特征化应用于图像的 DataFrame\n\npandas UDF 允许我们管理大量非结构化数据记录，例如大型图像，但可能导致诸如内存不足 Out\
  \ of Memory 错误等问题：\n\n- 1. 我们可以在下面的单元格中给出一个提示，以允许更有效地处理此类错误，通过使用 maxRecordsPerBatch\
  \ 选项减少箭头批大小：\n\n```\nspark.conf.set(\"spark.sql.execution.arrow.maxRecordsPerBatch\"\
  , \"1024\")\n```\n\n2. 我们现在可以在整个 Spark DataFrame 上运行特征化。请注意，此操作可能需要相当长的时间，因为它将大型模型应用于完整数据集：\n\
  \n```\nfeatures_df = images.repartition(16).select(col(\"path\"), featurize_udf(\"\
  content\").alias(\"features\"))\nfeatures_df.write.mode(\"overwrite\").parquet(\"\
  dbfs:/ml/tmp/flower_photos_features\")\n```\n\n3. 这里，我们可以看到正在运行的过程，将结果转储为 Parquet\
  \ 文件可能需要一些时间：\n\n![](img/7e45bd08916c2a17d4e75cbb898f41e8_315_0.png)\n\n图 9.5 -\
  \ 提取并写入特征\n\n最后，我们使用预训练模型计算了提取的特征，现在我们能够使用从预训练模型中提取的领域知识来训练新模型。此最后一步在此示例中未显示，因为它被视为不同的过程。\n\
  \n## 总结\n\n在本章中，我们讨论了如何使用 TFRecords 和 Petastorm 作为库来使加载大量数据以训练我们的分布式深度学习模型的过程变得更容易。这使我们了解了这些记录的结构，我们如何处理昂贵的操作，例如自动模式推断，我们如何准备记录以供使用，以及我们如何不仅在深度学习框架的上下文中使用它们，而且还用于纯\
  \ Python 应用程序。\n\n我们以一个示例结束本章，说明了如何利用预训练模型来提取新的特征，这些特征基于领域知识，后续可用于提取特征以训练新模型。\n\n\
  在下一章中，我们将学习如何在 Azure Databricks 中微调深度学习模型的参数以提高其性能。\n\n### 10\nAzure Databricks\
  \ 中的模型跟踪和调优\n\n在上一章中，我们学习了如何在 Azure Databricks 中创建机器学习和深度学习模型，以及如何在分布式训练期间加载数据集。找到使用机器学习解决问题的正确机器学习算法是一回事，但找到最佳超参数是另一项同样或更复杂的任务。在本章中，我们将重点关注使用\
  \ MLflow 作为模型存储库的模型调优、部署和控制。我们还将使用 Hyperopt 来搜索模型最佳超参数集。我们将使用使用 scikit-learn Python\
  \ 库构建的深度学习模型来实现这些库的使用。\n\n更具体地说，我们将学习如何跟踪机器学习模型训练的运行以找到最优的超参数集，使用 MLflow 部署和管理模型的版本控制，并学习如何使用\
  \ Hyperopt 作为模型调优中随机搜索和网格搜索等操作的替代方案。我们将涵盖以下主题：\n\n- - 使用 AutoML 调优超参数\n- - 使用 MLflow\
  \ 自动化模型跟踪\n\n- - 使用 Hyperopt 进行超参数调优\n- - 使用 scikit-learn、Hyperopt 和 MLflow 优化模型选择\n\
  \n在深入这些概念之前，让我们先了解一下本章的要求。\n\n## 技术要求\n\n要在本章中练习示例，您必须具备以下条件：\n\n- - 一个 Azure Databricks\
  \ 订阅。\n- - 一个附加到正在运行的集群的 Azure Databricks 笔记本，该集群使用 Databricks Runtime ML 版本 7.0\
  \ 或更高版本。\n\n## 使用 AutoML 调优超参数\n\n在机器学习和深度学习中，超参数调优是我们选择将由学习算法使用的最优超参数集的过程。在这里，超参数是用于控制学习过程的值。相比之下，其他参数将从数据中学习。从这个意义上说，超参数是一个遵循其统计含义的概念；也就是说，它是从先验分布中得出的参数，在我们开始从数据中学习之前捕获先验信念。\n\
  \n在机器学习和深度学习中，通常也将超参数称为我们在开始训练模型之前设置的参数。这些参数将控制训练过程。深度学习中使用的超参数示例如下：\n\n- - 学习率\n\
  - - 训练轮数\n- - 隐藏层\n- - 隐藏单元\n- - 激活函数\n\n\n\n\n\n这些参数将直接影响我们模型的性能和训练时间，其选择在我们模型的成功中起着至关重要的作用。例如，学习率过低的神经网络将无法准确捕捉观察数据中的模式。找到良好的超参数需要我们尽可能高效地映射搜索空间，这可能是一项艰巨的任务。这是因为为了找到每组良好的值，我们需要训练一个新模型，而这在时间和计算资源方面可能是一项昂贵的操作。用于此的一些技术包括常见的算法，如网格搜索、随机搜索和贝叶斯优化。\n\
  \n我们可以应用的一种更高效地搜索最佳超参数的技术是 **AutoML**，它代表 **自动化机器学习**。这是自动应用机器学习来解决优化问题的过程，在我们的案例中是优化训练算法中使用的超参数。这有助于我们克服手动搜索正确超参数或应用诸如网格搜索和随机搜索等技术时可能出现的问题，这些算法必须运行很长时间。这是因为它们会在不评估这些区域可能有多有希望的情况下搜索搜索空间中的所有可能值。\n\
  \nAzure Databricks Runtime for Machine Learning（Databricks Runtime ML）为我们提供了两种自动映射可能超参数搜索空间的选项。它们被称为\
  \ MLflow 和 Hyperopt，这两个开源库将 AutoML 应用于自动化模型选择和超参数调优。\n\nHyperOpt 是一个 Python 库，专为大规模贝叶斯优化模型的超参数而设计。它可以用于以分布式方式将搜索过程扩展到多个计算核心。虽然我们将只关注超参数优化方面，但它也可以用于优化管道，以及数据预处理、学习算法选择，当然还有超参数调优。要使用\
  \ HyperOpt，我们需要定义一个优化器，该优化器将应用于要优化的期望函数以优化任何函数，在我们的案例中可以是最大化性能指标或最小化损失函数。在我们的示例中，HyperOpt\
  \ 将采用超参数的搜索空间，并根据之前的结果移动，从而以一种知情的方式在搜索空间中移动，这使其与随机搜索和网格搜索等算法不同。\n\nAzure Databricks\
  \ Runtime for Machine Learning 中用于自动映射可能超参数搜索空间的另一个可用库是 MLflow，我们已在前几章中讨论过。MLflow\
  \ 是一个开源平台，用于管理端到端机器学习和深度学习模型生命周期，并支持自动化模型调优跟踪。这种自动化模型跟踪来自其与 Spark MLlib 库的集成。它允许我们通过使用\
  \ CrossValidator 和 TrainValidationSplit 来跟踪哪些超参数能产生最佳结果，这些工具会自动记录验证指标和超参数，以便更轻松地获得最佳模型。\n\
  \n在接下来的章节中，我们将学习如何将 HyperOpt 和 MLflow 应用于 Azure Databricks Runtime for Machine Learning\
  \ 训练的模型，以跟踪并获得最佳超参数。\n\n## 使用 MLflow 自动化模型跟踪\n\n正如我们之前提到的，MLflow 是一个用于管理机器和深度学习模型生命周期的开源平台，它允许我们进行实验、确保可重复性并支持轻松的模型部署。它还为我们提供了一个集中的模型注册表。总体而言，MLflow\
  \ 的组件如下：\n\n- MLflow Tracking：它记录与实验相关的所有数据，例如代码、数据、配置和结果。\n- MLflow Projects：它以确保结果可以在不同平台间运行之间重现的格式封装代码。\n\
  - MLflow Models：这为我们提供了机器学习和深度学习模型的部署平台。\n- Model Registry：我们机器学习和深度学习模型的中央存储库。\n\
  \n在本节中，我们将重点关注 MLflow Tracking，这是允许我们记录和注册代码、属性、超参数、工件以及与训练深度学习和机器学习模型相关的其他组件的组件。MLflow\
  \ Tracking 组件依赖于两个概念，即实验和运行。实验是我们执行训练过程的地方，是主要组织单元；所有运行都属于一个实验。因此，这些实验指的是特定的运行，我们可以可视化它、比较它，并下载与其相关的日志和工件。以下信息存储在每个\
  \ MLflow 中：\n\n- Source：这是实验运行所在的笔记本。\n- Version：如果运行是由 MLflow Project 触发的，则为笔记本版本或\
  \ Git 提交哈希。\n- Start and end time：训练过程的开始和结束时间。\n- Parameters：包含训练过程中使用的模型参数的字典。\n\
  - Metrics：包含模型评估指标的字典。MLflow 记录并让你可视化模型在运行过程中的性能。\n- Tags：这些作为键值对保存的运行元数据。你可以在运行完成期间和之后更新标签。键和值都是字符串。\n\
  - Artifacts：这些是运行中使用的任何格式的数据文件，例如模型本身、训练数据或使用的任何其他类型的数据。\n\n在 Azure Databricks Runtime\
  \ for Machine Learning 中，每当我们在训练算法的代码中使用 CrossValidator 或 TrainValidationSplit 时，MLflow\
  \ 都会存储超参数和评估指标，以便更轻松地可视化并最终找到最佳模型。\n\n在接下来的章节中，我们将学习如何在训练算法时使用 CrossValidator 和\
  \ TrainValidationSplit 来利用 MLflow 的优势并可视化产生最佳结果的超参数。\n\n## 管理 MLflow 运行\n\n当我们在训练模型时使用\
  \ CrossValidator 或 TrainValidationSplit 时，我们将拥有嵌套的 MLflow 运行。嵌套方式如下：\n\n- Main run：CrossValidator\
  \ 或 TrainValidationSplit 的信息记录到主运行中。如果没有活动的运行，MLflow 将创建一个新运行并记录到其中，并在退出进程前结束它。\n\
  - Child runs：每个超参数值及其对应的性能指标都记录在依赖于父运行的子运行中。\n\n当我们执行多步骤处理的超参数搜索时，这些嵌套运行很常见。例如，我们可以拥有如下所示的嵌套运行：\n\
  \n```\nwith mlflow.start_run(nested=True):\n    mlflow.log_param(\"lr\", 0.05)\n\
  \    mlflow.log_param(\"batch_size\", 256)\n    with mlflow.start_run(nested=True):\n\
  \        mlflow.log_param(\"max_runs\", 16)\n        mlflow.log_param(\"epochs\"\
  , 10)\n        mlflow.log_metric(\"rmse\", 98)\nmlflow.end_run()\n```\n\n这些嵌套运行将在\
  \ MLflow UI 中显示为可展开的树，以便我们可以更详细地查看结果。这使我们能够在主运行中保持不同子运行的结果井然有序。\n\n在讨论 MLflow 运行管理时，我们需要确保我们正在记录到主运行。为了确保这一点，当调用\
  \ fit() 函数时，它应被包裹在 mlflow.start_run() 语句中以将信息记录到正确的运行中。正如我们已经看到的，这样我们就可以轻松地将指标和参数放置在运行中。如果在同一个活动运行中多次调用\
  \ fit() 函数，MLflow 将为参数和指标的名称附加唯一标识符以避免任何可能的命名冲突。\n\n在下一节中，我们将看到一个使用 MLflow tracking\
  \ 与 MLlib 结合找到机器学习模型最佳超参数集的示例。\n\n\n\n\n\n## 使用 MLlib 自动化 MLflow 跟踪\n\n在本节中，我们将举例说明如何使用\
  \ MLflow 来跟踪 PySpark MLlib DecisionTreeClassifier 模型的性能。MLflow 将跟踪模型的训练过程，并允许我们存储整个过程中使用的所有\
  \ artifacts。我们将重点关注检查产生最佳结果的超参数以找到最佳设置。模型将使用 MNIST 数据集进行训练，该数据集包含在 Databricks 示例数据集中。数据集采用\
  \ LIBVSM 格式，并分为训练集和测试集。它包含两列——一列为标签，另一列为编码为 784 个特征的图像。让我们开始吧：\n\n- 1. 首先，我们将加载数据，同时指定特征数量并将数据缓存到\
  \ worker 内存中：\n\n```\ntrain_data = spark.read.format(\"libsvm\") \\\n    .option(\"\
  numFeatures\", \"784\") \\\n    .load(\"/databricks-datasets/mnist-digits/data-001/\n\
  \    mnist-digits-train.txt\")\ntest_data = spark.read.format(\"libsvm\") \\\n \
  \   .option(\"numFeatures\", \"784\") \\\n    .load(\"/databricks-datasets/mnist-digits/data-001/\n\
  \    mnist-digits-test.txt\")\ntrain_data.cache()\ntest_data.cache()\n```\n\n- 2.\
  \ 之后，我们可以显示每个数据集中的记录数并显示训练数据：\n\n```\nprint(\"Train images:{} ; test images {}\"\
  .format(train_data.count(), test_data.count()))\ndisplay(train_data)\n```\n\n为了将这些特征传递给机器学习模型，我们需要进行一些特征工程。我们可以使用\
  \ MLlib 将这些操作标准化为单个 pipeline，从而将多个预处理操作打包到单个工作流中。MLlib Pipelines 与 scikit-learn\
  \ 中的 pipeline 实现非常相似，具有五个主要组件。如下所示：\n\n- - DataFrame：保存我们数据的实际 DataFrame。\n- - Transformer：将数据从特征\
  \ DataFrame 转换到预测 DataFrame 的算法，例如。\n- - Estimator：这是拟合数据以生成模型的算法。\n- - Parameter：一起指定的多个\
  \ Transformer 和 Estimators 参数。\n- - Pipeline：将多个 Transformer 和 Estimators 操作组合成单个工作流。\n\
  \n在这里，我们将有一个由两个步骤组成的 pipeline，即 StringIndexer 用于将标签从数值转换为分类特征，以及 DecisionTreeClassifier\
  \ 模型，它将根据特征列中的训练数据预测标签。让我们开始吧：\n\n3. 首先，让我们进行必要的导入并创建 pipeline：\n\n```\nfrom pyspark.ml.classification\
  \ import\nDecisionTreeClassifier, DecisionTreeClassificationModel\n```\n\n```\n\
  from pyspark.ml.feature import StringIndexer\n```\n\n```\nfrom pyspark.ml import\
  \ Pipeline\n```\n\n4. 现在，我们可以实例化 StringIndexer 和 DecisionTreeClassifier：\n\n```\n\
  indexer = StringIndexer(inputCol=\"label\",\n```\n\n```\noutputCol=\"indexLabel\"\
  )\n```\n\n```\nmodel = DecisionTreeClassifier(labelCol=\"indexLabel\")\n```\n\n\
  5. 最后，我们可以将 StringIndexer 和 DecisionTreeClassifier 串联成单个工作流：\n\n```\npipeline =\
  \ Pipeline(stages=[indexer, model])\n```\n\n6. 到目前为止，我们遵循了创建普通 pipeline 的标准方法。我们现在要做的是包含\
  \ CrossValidator MLflow 类，以便我们可以运行模型的交叉验证过程。每个验证模型的评估指标都将被 MLflow 跟踪，并允许我们调查哪些超参数产生了最佳结果。\n\
  \n在本例中，我们将在 CrossValidator MLflow 类中指定两个要检查的超参数，分别是：\n\na) maxDepth：此参数决定 DecisionTreeClassifier\
  \ 中树的最大深度。更深的树可以产生更好的结果，但训练成本更高，并且产生的模型更容易过拟合。\n\nb) maxBins：此参数决定将连续特征离散化为有限数字集时生成的\
  \ bin 数。它是在分布式计算环境中以更有效的方式训练模型的<|message|> 参数。在本例中，我们将首先指定值为二，这将把灰度特征转换为 1 或 0。我们还将使用值为\
  \ 4 进行测试，以获得更大的粒度。\n\n7. 现在，我们可以定义用于衡量模型性能的评估器。我们将使用 PySpark MulticlassClassificationEvaluator，然后使用\
  \ weightedPrecision 作为指标：\n\n```\nfrom pyspark.ml.evaluation import\nMulticlassClassificationEvaluator\n\
  model_evaluator =\nMulticlassClassificationEvaluator(labelCol=\"indexLabel\",\n\
  metricName=\"weightedPrecision\")\n```\n\n8. 接下来，我们将定义要检查的参数网格：\n\n```\nfrom pyspark.ml.tuning\
  \ import CrossValidator,\nParamGridBuilder\nhyperparam_grid = ParamGridBuilder()\
  \ \\\n.addGrid(model.maxDepth, [2, 6]) \\\n.addGrid(model.maxBins, [2, 4]) \\\n\
  .build()\n```\n\n9. 现在，我们准备使用之前定义的 pipeline、评估器和超参数网格值创建 CrossValidator。正如我们之前提到的，CrossValidator\
  \ 将跟踪我们创建的模型以及我们使用的超参数：\n\n```\ncross_validator = CrossValidator(\n    estimator=pipeline,\n\
  \    evaluator=model_evaluator,\n    estimatorParamMaps=hyperparam_grid,\n    numFolds=3)\n\
  ```\n\n10. 一旦我们定义了交叉验证过程，我们就可以开始训练过程。如果有可用的 MLflow 跟踪服务器，它将开始记录我们每次运行的数据，以及当前活动运行下运行中使用的所有其他\
  \ artifacts。如果我们没有活动运行，它将创建一个新的运行：\n\n```\nimport mlflow\nimport mlflow.spark\n\
  with mlflow.start_run():\n    cv_model = cross_validator.fit(train_data)\n    test_metric\
  \ = model_evaluator.evaluate(cv_model.transform(test_data))\n    mlflow.log_metric(f'model_metric_{model_evaluator.getMetricName()}',\
  \ test_metric)\n    mlflow.spark.log_model(spark_model=cv_model.bestModel, artifact_path='best-model')\n\
  ```\n\n11. 在前面的代码中，我们创建了一个新的运行来跟踪模型。请记住，我们使用 with mlflow.start_run(): 语句是为了避免多次运行单元格时出现命名冲突。前面的步骤将保证\
  \ cv.fit() 函数返回它能够找到的最佳模型，之后我们评估其在测试数据上的性能，然后将此评估结果记录到 MLflow 中：\n\n## chapter_10\
  \ (Python)\n\n```\nfrom pyspark.ml.evaluation import MulticlassClassificationEvaluator\n\
  model_evaluator = MulticlassClassificationEvaluator(labelCol=\"indexLabel\", metricName=\"\
  weightedPrecision\")\nfrom pyspark.ml.tuning import CrossValidator, ParamGridBuilder\n\
  hyperparam_grid = ParamGridBuilder() \\\n    .addGrid(model.maxDepth, [2, 6]) \\\
  \n    .addGrid(model.maxBins, [2, 4]) \\\n    .build()\n\ncross_validator = CrossValidator(\n\
  \    estimator=pipeline,\n    evaluator=model_evaluator,\n    estimatorParamMaps=hyperparam_grid,\n\
  \    numFolds=3\n)\nimport mlflow\nimport mlflow.spark\nwith mlflow.start_run():\n\
  \    cv_model = cross_validator.fit(train_data)\n    test_metric = model_evaluator.evaluate(cv_model.transform(test_data))\n\
  \    mlflow.log_metric(f\"model_metric_{model_evaluator.getMetricName()}\", test_metric)\n\
  \    mlflow.spark.log_model(spark_model=cv_model.bestModel, artifact_path=\"best-model\"\
  )\n```\n\n* (63) Spark Jobs\nMLlib 将自动在 MLflow 中跟踪试验。完成你的 tuning fit() 调用后，查看 MLflow\
  \ UI 以查看已记录的运行。\n\n使用 MLflow 跟踪 API 从此笔记本记录运行。了解更多\n\nFigure 10.1 – 使用 MLflow 跟踪训练运行\n\
  \n12. 一旦我们完成了训练过程，我们将能够在 Azure Databricks 工作区中的 MLflow UI 的 Models 选项卡下看到结果。我们也可以通过单击我们在其中训练模型的笔记本中的实验图标来查看训练过程的结果。我们可以通过单击\
  \ Experiment Runs 轻松比较不同运行的结果，这将允许我们查看所有笔记本运行：\n\n![](img/7e45bd08916c2a17d4e75cbb898f41e8_328_0.png)\n\
  \nFigure 10.2 – MLflow Model Registry UI\n\n我们可以通过在搜索运行框中传递参数来明确查找这些运行的特定结果。例如，我们可以通过在搜索框中传递\
  \ params.maxDepth = 6 来搜索我们在 maxDepth 超参数中使用值为 6 时获得的结果。\n\n我们还可以通过创建超参数的不同值与特定性能指标的散点图来比较结果，这在我们尝试查找和比较最佳超参数集时非常有用。\n\
  \n下一节将深入探讨一种更自动化的寻找使某个函数最小化的最佳超参数集的方法。我们将使用损失函数来实现这一点。我们将使用 Hyperopt 来定义和探索搜索空间并找到使损失函数最小化的超参数。\n\
  \n\n\n\n## 使用 Hyperopt 进行超参数调优\n\nAzure Databricks Runtime for Machine Learning\
  \ 包含 Hyperopt，这是一个 Python 库，旨在在分布式计算系统上使用，以促进为一组最佳超参数学习的过程。其核心是一个接收我们需要最小化或最大化的函数，以及定义搜索空间的参数集的库。借助这些信息，Hyperopt\
  \ 将探索搜索空间以找到最佳超参数集。Hyperopt 使用随机搜索算法来探索搜索空间，这比使用随机搜索或网格搜索等传统确定性方法更有效。\n\nHyperopt\
  \ 针对分布式计算环境进行了优化，并为 PySpark MLlib 和 Horovod 等库提供支持，后者是一个用于分布式深度学习训练的库，我们稍后将重点介绍。它也可以应用于单机环境以及\
  \ TensorFlow 和 PyTorch 等更常见的库。\n\n使用 Hyperopt 的一般工作流程如下：\n\n- 1. 首先，我们必须找到我们想要优化的函数。这可以是我们想要最大化的性能指标，也可以是我们想要最小化的损失函数。\n\
  - 2. 接下来，我们必须定义 Hyperopt 将在其中扫描以优化已定义目标函数的最佳参数的条件搜索空间。Hyperopt 支持在同一运行中使用多种算法，这使我们能够定义多个模型进行探索。\n\
  - 3. 在那之后，我们必须定义将用于扫描搜索空间的搜索算法。\n- 4. 最后，我们可以通过运行 fmin() Hyperopt 函数来启动探索过程。这将把目标函数作为参数，并将搜索空间用于识别最佳参数集。\n\
  \n话虽如此，Hyperopt 的两个最关键部分如下：\n\n- 我们将作为优化目标传递的目标函数。一般来说，这是损失函数或性能指标。\n- 定义搜索空间的超参数字典。我们可以为每组超参数值选择不同的分布。\n\
  \n在下一节中，我们将学习如何将 Hyperopt 应用于 Azure Databricks Runtime for Machine Learning，以找到特定任务的最佳超参数，而不管应用了什么算法。\n\
  \n## Hyperopt 概念\n\n在本节中，我们将介绍 Hyperopt 的某些概念，以确定其核心功能，以及我们如何使用它们有效地扫描搜索空间，以找到有助于最小化或最大化我们目标函数的超参数。正如我们之前提到的，当我们开始使用\
  \ Hyperopt 时，我们必须定义以下内容：\n\n- 目标函数\n- 我们将扫描的搜索空间\n- 将用于保存搜索空间中点评估结果的数据库\n- 将用于扫描搜索空间的搜索算法\n\
  \n在这里，我们的主要目标是找到代表最佳超参数的最佳标量集。Hyperopt 允许我们详细定义搜索空间，以提供有关目标函数在搜索空间中何处表现更好的信息。其他优化库通常假设搜索空间是具有相同分布的更大向量空间的子集，这通常不是这种情况。Hyperopt\
  \ 使我们定义搜索空间的方式使我们能够进行更有效的扫描。\n\nHyperopt 允许我们非常简单地定义目标函数，但当我们增加在执行期间想要跟踪的参数数量时，它也具有递增的复杂性。最简单的示例如下，我们找到使线性函数\
  \ y(x) = x 最小化的 x 值：\n\n```\nfrom hyperopt import fmin, tpe, hp\nbest_param = fmin(\n\
  \    fn=lambda x: x,\n    space=hp.uniform('x', 0, 1),\n    algo=tpe.suggest,\n\
  \    max_evals=100)\nprint(best_param)\n```\n\n我们可以分解前面的执行，通过分解其参数：\n\n- Hyperopt\
  \ `fmin()` 函数接收 `fn` 关键字参数和要最小化的函数。在这种情况下，我们使用一个非常简单的 lambda 函数；即 `f(y)=x`。\n- space\
  \ 参数用于传递搜索空间。在这里，我们使用 Hyperopt 中的 `hp` 函数为 x 变量指定 0 到 1 范围内的均匀搜索空间。`hp.uniform`\
  \ 是库内置的一个函数，有助于我们为特定变量指定搜索空间。\n- `algo` 参数用于选择搜索算法。在这种情况下，`tpe` 代表 Parzen 估计器。我们也可以将这些参数设置为\
  \ `hyperopt.random.suggest`。搜索算法是一个完整的主题，因此我们只会简要提及这一点，但您可以自由搜索有关 Hyperopt 应用的算法类型以找到最适合您的超参数集的更多详细信息。\n\
  - 最后，使用 `max_evals` 参数指定最大评估次数。\n\n一旦我们指定了所有必需的参数，我们就可以开始运行，它将返回一个 Python 字典，其中包含使目标函数最小化的指定变量的值。\n\
  \n尽管我们这里的最小工作示例看起来非常简单，但 Hyperopt 的复杂性随着我们在优化目标函数时拥有的规范数量的增加而增加。我们在制定最佳策略时可以问自己的一些问题如下：\n\
  \n- 除了 `fmin()` 函数的实际返回值之外，还需要什么类型的信息？我们可以在过程中收集统计数据和其他数据，这对我们来说可能有用以便保留。\n- 我们是否需要使用需要一个以上输入值的优化算法？\n\
  - 我们是否应该并行化此过程，如果是这样，我们是否希望这些并行进程之间进行通信？\n\n回答这些问题将定义我们实现优化策略的方式。\n\n在并行优化过程中，Hyperopt\
  \ 优化算法与目标函数之间会进行通信，以获得搜索空间中该特定点的目标函数的实际值。在这种通信中，目标函数返回的值，即浮点损失，也称为负效用，与搜索空间中的该点相关联。\n\
  \n这里显示的简单示例说明了使用 Hyperopt 定义目标函数和搜索空间是多么简单。然而，当我们想要存储的信息不仅仅是目标函数在搜索空间中返回的浮点值时，它仍然不足。它也是一个不与搜索算法或并发函数交互的评估。\n\
  \n为了解决第一个问题，我们可以使用一个返回嵌套字典的目标函数，其中包含统计数据和诊断所需的键值。为此，我们有一组目标函数必须返回的强制值：\n\n- `status`：我们可以从\
  \ `hyperopt.STATUS_STRINGS` 中选择一个键来显示竞争的状态。这样，我们就可以跟踪我们的评估是否成功完成或失败。\n- `loss`：这是当实际目标函数在搜索空间中该特定点被评估时返回的浮点值。如果竞争状态为\
  \ OK，则必须存在。\n\n我们还可以在目标函数的选项中指定一些额外的可选参数。这些键值如下：\n\n- `loss_variance`：指定随机目标函数的确定性的浮点值。\n\
  - `true_loss`：您可以使用此名称存储模型的损失，以便我们可以使用内置绘图工具。这在我们处理超参数优化时特别有用，因为它允许我们非常简单地绘制探索结果。\n\
  - `true_loss_variance`：模型损失的不确定性。\n\n此功能允许我们将这些值存储在与 JSON 兼容的数据库中，例如 MongoDB。以下代码示例向我们展示了如何定义一个非常简单的\
  \ f(x) = x 目标函数，该函数以键值字典的形式返回执行的狀態：\n\n```\nimport pickle\nimport time\n```\n\n\n\
  \n\n\n```\nfrom hyperopt import fmin, tpe, hp, STATUS_OK\ndef objective(x):\n  \
  \  return {'loss': x, 'status': STATUS_OK }\nbest = fmin(objective,\n    space=hp.uniform('x',\
  \ -5, 5),\n    algo=tpe.suggest,\n    max_evals=50)\nprint(best)\n```\n\n我们可以通过使用\
  \ Trials 对象充分利用能够返回字典的能力，该对象允许我们在执行优化时存储更多信息。在下面的示例中，我们正在修改目标函数，使其返回更复杂的输出，该输出稍后将存储在\
  \ Trials 对象中。我们可以通过将其作为 Hyperopt fmin() 函数的参数传递来实现：\n\n```\nimport pickle\nimport\
  \ time\nfrom hyperopt import fmin, tpe, hp, STATUS_OK, Trials\ndef objective(x):\n\
  \    return {\n        'loss': x,\n        'status': STATUS_OK,\n        'eval_time':\
  \ time.time(),\n        'more_data': {'type': None, 'value': [0, 1]},\n        'attachments':\n\
  \            {'time_module': pickle.dumps(time.time)}\n    }\ntrials_obj = Trials()\n\
  best_params = fmin(objective,\n    space=hp.uniform('x', -5, 5),\n    algo=tpe.suggest,\n\
  \    max_evals=50,\n    trials=trials_obj)\nprint(best_params)\n```\n\n执行完成后，我们可以访问\
  \ Trials 对象以检查优化过程中目标函数返回的值。我们有不同的方式可以访问 Trials 对象中存储的值：\n\n- trials.trials: 返回包含搜索所有参数的字典列表。\n\
  - trials.results: 目标函数返回的字典。\n- trials.losses(): 所有成功试验的实际损失。\n- trials.statuses():\
  \ 每个试验的状态。\n\n此 Trials 对象可以保存为 pickle 对象或使用自定义代码进行解析，以便我们更深入地了解试验结果。\n\n试验的附件可以这样访问：\n\
  \n```\nmsg = trials.trial_attachments(trials.trials[0])['time_module']\ntime_module\
  \ = pickle.loads(msg)\n```\n\n在此示例中，我们正在获取第一个试验的 time_module 附件。\n\n需要注意的一点是，在 Azure\
  \ Databricks 中，我们可以选择将 Trials 和 SparkTrials 对象都传递给 fmin() 函数的 trials 参数。SparkTrials\
  \ 对象在我们执行单机算法时传递，例如将 scikit-learn 模型用作目标函数。在这里，Trials 对象用于分布式训练算法，例如 MLlib 或 Horovod\
  \ 模型。SparkTrials 类允许我们在无需引入任何自定义逻辑的情况下分发优化的执行。它还提高了计算向工作节点的分布。\n\n不要将 SparkTrials\
  \ 对象与为分布式训练设计的算法一起使用，因为这会导致执行在集群中并行化。\n\n现在我们对如何配置 fmin() Hyperopt 函数的基本参数有了更清晰的认识，我们可以深入了解搜索空间是如何定义的。\n\
  \n## 定义搜索空间\n\n我们可以将搜索空间表达为一组嵌套函数，它们定义了不同测试用例的各个搜索空间。例如，在以下代码块中，我们为 x 参数指定了搜索空间，其中包含两个测试空间\
  \ test_space_1 和 test_space_2：\n\n```\nfrom hyperopt import hp\n```\n\n```\nsearch_space\
  \ = hp.choice('a',\n    [('test_space_1', 1 + hp.lognormal('x', 0, 1)),\n     ('test_space_2',\
  \ hp.uniform('y', -5, 5))]\n)\n```\n\n这里，Hyperopt 将根据搜索算法从这些嵌套随机表达式中采样。此算法采用自适应探索策略，而不是仅从搜索空间中抽样。在前面的示例中，我们定义了三个参数：\n\
  \n- a: 选择要使用的情况\n- test_space_1: 为 x 参数生成正值\n- test_space_2: 为 y 参数生成正值\n\n每个表达式的第一个参数是标签，算法在内部使用它将参数选择返回给调用者。在此示例中，代码的工作方式如下：\n\
  \n- 如果 a 变量为 0，我们将使用 x 而不使用 y。\n- 如果 a 变量为 1，则将使用 y 而不使用 x。\n\nx 和 y 变量是条件参数，取决于\
  \ a 的结果。如果我们以这种条件方式编码变量，我们就说明当 a 为 0 时 x 变量对目标函数没有影响，这有助于搜索算法更有效地分配信用。这利用了用户对要分析的目标函数的领域知识。\n\
  \nsearch_space 是一个变量空间，其定义为图表达式，描述如何在不生成搜索空间的情况下采样一个点。这优化了执行的内存和计算使用。这些图表达式称为 pyll\
  \ 图，定义在 hyperopt.pyll 类中。\n\n你可以通过对其进行采样来探索示例搜索空间：\n\n```\nimport hyperopt.pyll.stochastic\n\
  print(hyperopt.pyll.stochastic.sample(search_space))\n```\n\n我们现在知道如何定义搜索空间，在该空间中我们将优化目标函数。需要注意的是，我们在搜索空间中定义测试用例的方式也会影响搜索算法在自适应搜索期间对试验的工作方式。在下一节中，我们将了解在\
  \ Azure Databricks 中使用 Hyperopt 的一些最佳实践。\n\n## 在 Hyperopt 中应用最佳实践\n\n到目前为止，我们已经讨论了如何指定要最小化的目标函数的执行以及我们将对其进行评估的搜索空间。此外，我们还看到在定义超参数可能值的探索方式方面有很大的灵活性，以及如何通过在搜索空间中定义条件参数来利用领域知识。\n\
  \n我们必须牢记 Hyperopt 库本身的一些方面，以及它在 Azure Databricks 中的执行方式。在 Azure Databricks 中使用 Hyperopt\
  \ 优化目标函数时，这里有一些需要记住的重要概念：\n\n- Hyperopt Tree of Parzen Estimator 算法是一种贝叶斯方法，比常见的网格和随机搜索方法更有效。它允许我们扫描更大的一组可能超参数。在定义搜索空间时应用领域知识以提高探索性能。\n\
  - 当我们使用 `hyperopt.choice()` 并使用 MLflow 跟踪优化进度时，MLflow 将记录选择列表的索引。我们可以使用 Hyperopt\
  \ 的 `hyperopt.space_eval()` 函数获取参数值。\n- 在处理大型数据集时，始终建议在数据的小子集上进行实验，以逐步了解最佳搜索空间。这有助于我们在整个数据集上定义将使用的搜索空间。\n\
  - 当我们使用 SparkTrials 对象时，建议使用仅 CPU 集群。这是因为在 Azure Databricks 中，与 CPU 集群相比，GPU 集群中的并行性会降低。\n\
  - 不要在自动缩放集群上使用 SparkTrials，因为并行值是在执行开始时选择的。因此，如果集群扩展，它不会提高执行的性能。\n\n应用这些概念将确保我们在\
  \ Azure Databricks 中使用 Hyperopt 执行优化时充分利用其优势。在下一节中，我们将了解更多关于如何在 Azure Databricks\
  \ 中改进深度学习模型的推理。\n\n## 使用 scikit-learn、Hyperopt 和 MLflow 优化模型选择\n\n正如我们在前几节中所看到的，Hyperopt\
  \ 是一个 Python 库，允许我们在分布式计算环境（如 Azure Databricks）中跟踪可用于超参数模型调优的优化运行。在本节中，我们将通过一个训练\
  \ scikit-learn 模型的示例。我们将使用 Hyperopt 跟踪调优过程并将结果记录到 MLflow，即模型生命周期管理平台。\n\n在 Azure\
  \ Databricks Runtime for Machine Learning 中，我们拥有一个经过优化的 Hyperopt 版本，可支持 MLflow 跟踪。在这里，我们可以使用\
  \ SparkTrials 对象在并行执行期间记录单机模型的调优过程结果。我们将使用这些工具为多个 scikit-learn 模型找到最佳超参数集。\n\n我们将执行以下操作：\n\
  \n- 准备训练数据集。\n- 使用 Hyperopt 定义要最小化的目标函数。\n- 定义 Hyperopt 搜索空间，我们将在其上扫描最佳超参数。\n- 定义将用于扫描搜索空间的搜索算法。\n\
  - 执行优化并在 MLflow 中跟踪最佳参数集。\n\n让我们开始：\n\n1. 首先，我们将导入我们将使用的所有必要库：\n\n```\nimport numpy\
  \ as np\nfrom sklearn.datasets import fetch_california_housing\nfrom sklearn.model_selection\
  \ import cross_val_score\nfrom sklearn.svm import SVC\nfrom sklearn.ensemble import\
  \ RandomForestClassifier\nfrom sklearn.linear_model import LogisticRegression\n\
  from hyperopt import fmin, tpe, hp, SparkTrials, STATUS_OK, Trials\nimport mlflow\n\
  ```\n\n\n\n\n\n2. 在本示例中，我们将使用加州住房数据集，该数据集作为 scikit-learn 中的示例数据集包含在内。该数据集保存了 1990\
  \ 年美国人口普查的数据，其中包含加州 20,000 套房屋的房屋价值，以及有关收入、居住人数、房间数等特征的数据。为了获取此数据集，我们将使用 fetch_california_housing()\
  \ scikit-learn 函数并将结果转储到名为 features 和 target 的变量中：\n\n```\nfeatures, target = fetch_california_housing(return_X_y=True)\n\
  ```\n\n3. 现在我们已将数据集拆分为特征和目标，我们将对预测变量进行缩放，这在机器学习和深度学习中是一种常见做法。这样，我们将确保具有缩放一致性。这将帮助我们克服当特征未离散化为缩放变量时出现的一系列问题。我们的数据集中可用的特征如下：\n\
  \n+   a) 街区人均中位家庭收入\n+   b) 房屋年龄\n+   c) 街区每户平均房间数\n+   d) 平均卧室数\n+   e) 街区总人口\n\
  +   f) 平均房屋居住人数\n+   g) 纬度\n+   h) 经度\n\n4. 通过查看各列中特征的尺度——这是一个简单的操作，可以在 pandas DataFrame\
  \ 中使用 describe() 方法完成——我们可以看到均值中的数量级差异很大：\n\n```\nimport pandas as pd\n```\n\n```\n\
  features_df = pd.DataFrame(features)\n```\n\n```\nfeatures_df.describe()\n```\n\n\
  5. 正如我们所见，这些变量的范围和尺度可能非常不同：\n\n```\nimport pandas as pd\n\nfeatures_df = pd.DataFrame(features)\n\
  features_df.describe()\n```\n\nOut[5]:\n\n|  | 0 | 1 | 2 | 3 | 4 | 5 | 6 | 7 |\n\
