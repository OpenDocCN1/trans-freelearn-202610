- "## 1 Revit 工作效率入门\n\n我们生活在信息时代（也称为数字时代），数字化转型正在通过鼓励人们快速采用新技术和新流程来改变企业和个人。\n\nRevit\
  \ 是一种用于**建筑信息建模**（**BIM**）的创作软件工具；在这里，最有价值的资产是您添加到 Revit 模型中的信息。\n\n信息为王；然而，管理信息和知识才是力量！\n\
  \n您可能已经熟悉 Revit，但信息管理原则与 Revit 最佳实践的结合可以形成强大的组合，从而提高您在 BIM 项目中的工作效率。\n\n本章将为您提供如何提高\
  \ Revit 工作效率的知识，并提升您在处理从小型到大型 BIM 项目时的表现。\n\n我们还将解释为需要执行的任务选择正确工具的重要性，介绍 BIM 实施的最佳实践，并提供如何为公司制定培训方案的策略。\n\
  \n在本章中，我们将涵盖以下主题：\n\n- 您应该了解的 Revit 工作效率知识\n- 选择正确的工具\n- Revit 实施概述\n- Revit 培训方案\n\
  \n### 您应该了解的 Revit 工作效率知识\n\n在企业发展中，工作效率是衡量公司绩效的重要因素，而提高工作效率就是在预定的时间范围内更聪明地工作，以满足项目截止日期。\n\
  \n定义工作效率并更好地理解在日常多任务处理和使用 Autodesk Revit 时如何衡量它是至关重要的。\n\n工作效率可以定义为一个流程，用于根据效率衡量产出，并将投入转化为产出。该流程适用于机器、工厂或个人，其结果可以帮助公司做出基于运营和投资的决策。\n\
  \n您可以使用多种方法来衡量工作效率；基本公式是产出除以投入，即工作效率：\n\n产出 ÷ 投入 = 工作效率\n\n用于衡量工作效率的方法取决于您公司所处的行业，下面我们列举了几个示例。\n\
  \n以下是一些工作效率衡量方法：\n\n- 时间管理\n- 员工完成的任务\n- 个人绩效\n- 产品制造比率\n\n我们将探讨时间管理方法，以提高使用 Revit\
  \ 时的工作效率和绩效。您可以将这些原则应用于任何涉及数字生产的任务中。\n\n在提高工作效率方面，关键因素是在开始使用 Revit 之前，拥有高质量且精确的投入来生成您的模型和图纸。\n\
  \n您可能在使用 Revit 完成特定任务时速度很快，但如果没有高质量的投入，您可能会面临返工的风险，这将降低整体工作效率。\n\n我们用于提高 Revit 工作效率的时间管理方法基于高质量的数字生产投入。该方法将使您在\
  \ Revit 中更加高效，并成为能赶上每一个项目截止日期的团队合作者。\n\n该方法的第一步是研究高质量的投入。这些投入可以来自您的公司、同事、项目中的多家公司，以及最终的主要利益相关者——客户。\n\
  \n一旦您确定了高质量的投入，就可以开始在 Revit 中工作，生成您的模型和图纸。以下示例将帮助我们演示这一流程。\n\n### 示例 1：设置 Revit\
  \ 项目\n\n在此示例中，**BIM 执行计划（BEP）** 定义了质量投入。然而，设置项目所需的信息往往并不完全可用，您需要研究高质量投入。\n\n此示例的质量投入包括命名标准、项目标准、协作标准、测量策略、体量策略、软件版本、交换格式、信息需求等级、BIM\
  \ 交付物、**通用数据环境（CDE）**、项目位置、坐标、标高和轴网。\n\n项目编号的变更是许多项目中常见的问题，而使用此方法，您需要在设置 Revit 文件之前向项目负责人索取此信息，并获得客户的确认。项目编号应在\
  \ BEP 中明确规定并经客户批准，以避免在设计阶段和施工阶段发生任何变更。\n\n管理信息以更聪明地工作是该方法的基本组成部分，如果您将其与 Revit 最佳实践相结合，它将把您带到工作效率的下一个层次。\n\
  \n项目编号的一个简单变更可能会影响多个不同领域同事的工作效率，例如文档管理员、信息经理以及商务和法律部门。\n\n请注意，先前图纸的旧信息将受到影响；由于项目编号变更，它将与新图纸失去关联。\n\
  \n在此示例中，您可以看到在正确的时间拥有正确信息的重要性，并且这些信息需要由主要利益相关者或客户确认。\n\n### 示例 2：定义房间编号系统\n\n在此示例中，客户需要批准房间编号系统，该系统还需要与设施管理系统保持一致，以保证数据的持续流通。\n\
  \n通过使用此方法，您可以降低房间编号系统将来被更改的可能性，这最终会提高您和团队的工作效率。\n\n如果您熟悉 Dynamo 这一 Revit 的可视化编程工具，您可能会建议使用\
  \ Dynamo 快速重命名项目中的所有房间。是的，Dynamo 可以快速重命名房间。我们的方法遵循“第一次就做对”的原则，因此您无需返工，也无需使用 Dynamo\
  \ 重命名房间，因为这在流程开始时就已经达成一致。\n\n在此示例中，您可以通过避免重复工作和浪费时间在那些项目初期就能轻松达成一致的任务上来提高工作效率。\n\
  \n### 示例 3：培训与工作效率\n\n有些项目启动时，设计团队缺乏特定软件所需的知识，这会拖慢工作效率。\n\nRevit 培训对于提高工作效率至关重要，但提供或接受培训的时间需要合理安排。\n\
  \n如果培训在项目开始前几天进行，设计师将受益匪浅，因为计算知识需要保持新鲜。否则，设计师在一段时间后只会记住要点。\n\n培训师需要了解项目何时开始的质量信息，以便确定提供培训的最佳时间框架。\n\
  \n通过使用此流程，Revit 培训师会发现要求重新参加培训的请求减少，这将证明培训的有效性以及他们在提供培训方面的工作效率。\n\nRevit 是一款直观的软件，设计师可以快速学习基本命令，这有利于公司切换平台或为新员工提供培训的战略。\n\
  \n\n\n\n\n以下图表显示了投资培训以实现快速项目实施的好处，并且它将反映实现**投资回报率 (ROI)** 所需时间量的减少。总体而言，这将导致 Revit\
  \ 和 BIM 中团队生产力的提高：\n\n![](img/1961add582dd4a589b2eac3dda140e38_23_0.png)\n\n图 1.1\
  \ – 培训投资\n\n另一个常见问题是团队成员没有时间参加 Revit 培训，或他们决定在实际项目中学习 Revit。此过程会让你产生这些团队成员已准备好在\
  \ Revit 中工作的错误感觉，并且达到最佳生产力水平所需的时间会更长。\n\n在这种情况下，培训师需要提供短时段的培训，以提高他们的 Revit 知识并避免项目中的错误。\n\
  \n在此示例中，在正确的时间提供培训可提高生产力并减少达到 ROI 的时间。\n\n## 示例 4：Revit 与 2D CAD – 生产力\n\nBIM 在**建筑、工程、施工、业主运营商\
  \ (AECOO)** 行业中推动了变革，其中信息是提高生产力的方法核心，与传统的 2D CAD 流程相比可带来诸多益处。\n\nRevit 以信息为中心，它与传统\
  \ 2D CAD 相比具有多项优势，我们可以轻松衡量生产力的显著提升。\n\nBIM 平台，例如 Revit，为我们提供了联合信息，这意味着可用于多种用途的高质量数据，这是我们使用高质量数据工作的方法的一部分。\n\
  \n当然，这一切都取决于设计师使用正确的输入信息并精确地进行 3D 建模以优化分析效益。\n\n在此示例中，我们可以理解从 2D CAD 切换到 Revit 时生产力的提升，但高质量信息对于提高生产力至关重要。\n\
  \n## 示例 5：在 Revit 中规划你的工作\n\n时间管理原则侧重于在开始任务之前规划工作的过程，无论你独自在 Revit 中工作还是在大型设计团队中工作，区别不大。\n\
  \n如果你在建模前规划任务并搜索高质量信息以避免任何返工，你的生产力将会提高。\n\n在此过程中，你可以选择对任务影响大的活动，并考虑可以推迟的其他活动。\n\n\
  以下图表显示了优先处理对项目影响大的任务的过程：\n\n![](img/1961add582dd4a589b2eac3dda140e38_25_0.png)\n\
  \n图 1.2 – 工作量与影响\n\n对于此示例，我们将利用一个流程来创建门表，该表包含许多需要检查和收集高质量信息的活动。\n\n### 高影响\n\n执行以下操作：\n\
  \n- 使用已获客户批准的门编号系统。\n- 列出防火门的等级。\n- 决定门表中将包含哪些字段。\n- 检查结构开口。\n- 检查门参数是否报告正确的数据。\n\
  \n计划以下内容：\n\n- 检查门框尺寸是否正确。\n- 检查族名称是否与项目标准相同。\n\n### 低影响\n\n考虑以下内容：\n\n- 根据项目阶段，门材料可以是通用的。\n\
  - 根据项目阶段，检查门公差。\n\n放弃以下内容：\n\n- 根据项目阶段和工作范围，团队成员可以推迟选择五金件套装。\n- 检查门板与地板之间的间隙。\n\n\
  在此示例中，我们可以在 Revit 建模过程中使用时间管理原则来提高生产力并定义对项目影响大的优先级。\n\n遵循我们的方法论，带有高质量信息的时间管理流程将提供工作效率的飞跃。\n\
  \n我们已完成示例，以定义研究的重要性并在执行任务前获取高质量信息。我们已学习如何避免仅基于即时可用数据进行操作，而这些数据可能不可靠或不完整。\n\nRevit\
  \ 中还有其他技术因素可以帮助你提高生产力并使工作更高效。让我们在下一节中探索它们。\n\n## 计算机维护\n\n为了获得最佳的 Revit 性能，进行一些维护工作是必不可少的。我们建议你每两周执行以下步骤。\n\
  \n### Revit 本地文件\n\n在工作共享环境中工作时，Revit 会在用户的计算机上的 **Documents** 文件夹中自动创建本地文件。此过程会使\
  \ Revit 本地文件（即进行中的文件）成为 Revit 中央文件的副本，并在文件名中加上你的名字。\n\n此过程的目标是删除本地文件，以便为 C:\\ 驱动器提供更多空间，从而提高性能：\n\
  \n![](img/1961add582dd4a589b2eac3dda140e38_27_0.png)\n\n图 1.3 – Revit 本地文件\n\n这些文件和文件夹位置在\
  \ Revit 选项下定义：\n\n1. 在左上角，单击 File | Options：\n\n![](img/1961add582dd4a589b2eac3dda140e38_27_1.png)\n\
  \n图 1.4 – Revit 选项\n\n为了改进此过程，建议你创建一个名为 Revit_20XX_Local_Files 的文件夹（其中 20XX 为 Revit\
  \ 版本），这样 Revit 文件就不会与 Documents 文件夹中位于的其他文件混合：\n\n```\nC:\\Users\\<username>\\Documents\\\
  Revit_20XX_Local_Files\\\n```\n\n用户文件的默认路径：\n\nC:\\Users\\username\\Documents\\\
  Revit_2021_Local_Files\n\n图 1.6 – Revit 本地文件的路径\n\n> **提示**\n> 位置可能会根据你设置的 Revit\
  \ 选项而有所不同。此信息将保存在 Revit.ini 文件中，并用于未来的 Revit 会话。\n\n### 临时 Windows 文件\n\n用户使用的应用程序通常会经常创建临时文件。因此，用户应定期删除它们。\n\
  \n在运行此过程之前，请确保所有 Revit 会话均已关闭。\n\n要访问此文件夹，请执行以下步骤：\n\n1. 打开 **Windows 资源管理器**。\n\
  2. 在顶部栏地址中，输入 `%temp%` 并按 Enter：\n3. 选择所有文件并单击 **删除**。如果出现警告窗口，请忽略所有只读文件（这些文件正被应用程序使用，当前无法删除）。\n\
  \n![](img/1961add582dd4a589b2eac3dda140e38_29_0.png)\n\n图 1.7 – 临时 Windows 文件位置\n\
  \n### 磁盘清理\n\n用户还应运行的另一项任务是 **磁盘清理** 工具。此工具还会删除不再需要的文件。\n\n要访问此工具，请执行以下步骤：\n\n1.\
  \ 在 Windows 搜索栏中，输入 `disk cleanup`。\n2. 从列表中选择你需要的工具：\n\n![](img/1961add582dd4a589b2eac3dda140e38_30_0.png)\n\
  \n图 1.8 – 磁盘清理\n\n3. 从列表中选择要删除的文件：\n\n![](img/1961add582dd4a589b2eac3dda140e38_31_0.png)\n\
  \n图 1.9 – 清理系统文件\n\n4. 单击 **清理系统文件** 按钮开始删除过程。\n\n5. 过程完成后，单击 **确定**。\n\n### 重新启动\
  \ Revit\n\n如果用户在执行高需求任务（例如导出、打印、渲染或升级模型）后遇到性能下降，Revit 应重新启动。\n\n这将允许删除内存和硬盘上缓存的所有数据。\n\
  \n### 重新启动 Windows\n\n继我们之前提到的重新启动 Revit 的内容之后，对 Windows 也应做同样的处理。此建议取决于用户处理了多少应用程序。\n\
  \n> 提示\n> 我们建议用户每天重新启动计算机，或至少每隔一天重新启动一次，以便系统清理、清除临时文件并自行更新。\n\n### 始终使用相同的 Revit\
  \ 更新版本\n\nAutodesk 经常部署带有新功能和错误修复的新更新版本。\n\n确保在与其他团队成员一起进行项目工作时，每个人都使用相同的更新版本以避免任何潜在的软件问题，这一点至关重要。\n\
  \n> 提示\n> 在同一 Revit 版本中 – 例如 Revit 2021 – 我们可以有不同的更新版本，例如以下：\n> Revit 2021.1.1 –\
  \ 发布日期：2020 年 9 月 18 日\n> Revit 2021.1 – 发布日期：2020 年 7 月 22 日\n\n要确认你安装了哪个 Revit\
  \ 更新版本，请启动 Revit。\n\nRevit 打开后，请按照以下分步指南操作：\n\n1. 在右上角，单击靠近 Help 菜单的小深色箭头：\n\n![](img/1961add582dd4a589b2eac3dda140e38_32_0.png)\n\
  \n图 1.10 – 访问 Revit 帮助\n\n\n\n\n\n你可以在以下位置找到并下载最新更新：\n\n- Autodesk 管理账户门户：\n\n![](img/1961add582dd4a589b2eac3dda140e38_34_0.png)\n\
  \n图 1.13 – Autodesk 管理账户门户\n\n- Autodesk 桌面应用：\n\n![](img/1961add582dd4a589b2eac3dda140e38_34_1.png)\n\
  \n图 1.14 – Autodesk 桌面应用\n\n> 提示\n> 不建议在新版本发布后立即更新 Revit 版本。\n\n## Revit 的推荐设置\n\
  \nRevit 在计算机资源使用方面要求很高。强烈建议将设置保持在尽可能低的需求水平。我们只会强调其中一些建议，但其他建议也可能适用，具体取决于所使用的专业领域，甚至取决于要执行的任务。\n\
  \n以下内容可通过 Revit **选项按钮**访问：\n\n![](img/1961add582dd4a589b2eac3dda140e38_35_0.png)\n\
  \n> 提示\n> 在浏览视图时、用户遇到图形相关问题时，或此功能与显卡不兼容时，应禁用此 *硬件加速* 功能。\n\n## 文件大小\n\nRevit 文件大小不仅取决于项目大小，还取决于许多其他因素，例如几何复杂性、导入的文件格式、导入族的数量以及任何警告。\n\
  \n每周审核模型将有助于保持模型处于可工作且健康的状态，而不会影响或降低 Revit 性能。\n\n作为参考，并且取决于您计算机的规格，Revit 模型不应大于\
  \ 300 MB。\n\n如果文件需要更大，用户必须决定是否应将其作为单个模型/卷保留，或是否应审查模型分离和模型卷分解。\n\n对于联合模型（即包含多个链接的文件），推荐的最大文件大小约为\
  \ 500 MB。\n\n> 提示\n> 作为良好实践，应清理项目和族文件，以通过删除任何不需要或未使用的元素和设置来减小文件大小。\n\n## 族创建\n\n\
  族创建是性能方面的重要话题之一，因为我们开发得越复杂（例如，包含多个公式、过度建模、嵌套族、阵列、空体或参数过度约束），文件就越大。\n\n创建族时，用户应注意以下几点：\n\
  \n- 应使用标准族而不是模型就地族（尤其是在重复使用时）。\n- 嵌套族必须限制在一定层级 – 尽可能保持在一层嵌套。\n- **排除元素选项：** 用户应使用排除成员功能进行少量排除。\n\
  - **设计选项：** 用户应避免在设计选项中使用组。\n- **标高约束：** 用户不应将元素约束到标高（例如，墙体的顶部约束）。\n- **系统族：** 用户应避免在组中使用系统族，因为它们被约束到特定标高。当复制到不同标高时，将保留第一个标高引用，任何进一步的编辑都会变得更加复杂（请记住，我们距离参考标高越远，性能就越低）。\n\
  - **工作集：** 在工作共享项目中，创建包含来自不同工作集元素的组时，Revit 将忽略现有工作集，并在创建组时将所有元素包含在当前工作集中 – 此工作集无法编辑。\n\
  - **链接：** 用户不应将 Revit 链接添加到组中，因为它将被复制，从而影响性能。\n\n## 就地族\n\n就地族是用户可以在项目上下文中创建的专用族。它们不应在项目中使用，因为它们会降低性能，而标准族（即可加载族）可以涵盖大多数情况：\n\
  \n![](img/1961add582dd4a589b2eac3dda140e38_39_0.png)\n\n图 1.18 – 模型就地族\n\n如果用户创建就地族以供多次使用，他们应使用标准族（可加载族）。这是因为如果就地族被复制，Revit\
  \ 将把这些实例视为不同的族。这将多次重复族，从而影响性能：\n\n![](img/1961add582dd4a589b2eac3dda140e38_40_0.png)\n\
  \n图 1.19 – 重复的就地族\n\n## 阵列\n\n使用阵列复制元素时，用户应决定元素是否应保持分组或不分组，因为这也会影响性能。组应保持关联尽可能少。否则，应取消分组：\n\
  \n![](img/1961add582dd4a589b2eac3dda140e38_40_1.png)\n\n图 1.20 – 在阵列工具中创建组\n\n##\
  \ 约束\n\n使用 **约束** 会影响模型性能。它们应在项目中谨慎使用。\n\n约束可能包括以下内容：\n\n- 几何连接约束\n- 尺寸约束\n- 锁定对齐约束\n\
  \n使用这些约束时，请记住几乎不可能看到它们的位置，因为它们可以在任何视图中放置。\n\nRevit 在 **视图控制** 栏下方有 **显示约束** 工具，可让您通过在视图顶部添加一种“筛选器”来检查尺寸和锁定对齐约束。使用该工具时，Revit\
  \ 会在视图周围应用石榴石边框，所有约束都将以相同颜色突出显示：\n\n![](img/1961add582dd4a589b2eac3dda140e38_41_0.png)\n\
  \n## 使用工作共享环境时\n\n工作共享是 Revit 中的一种工作方法，允许团队成员同时在同一模型上工作：\n\n![](img/1961add582dd4a589b2eac3dda140e38_42_0.png)\n\
  \n图 1.22 – 工作共享环境\n\n在此工作方法中，Revit 需要使用工作集来适应此类环境。\n\nRevit 中与工作共享方法相关的有几个原生工具，需要深入理解，我们将在本书的后续章节中介绍它们。\n\
  \n工作集在此工作方法中至关重要，因为用户可以保留对元素和/或视图的所有权。通常，用户将被分配到项目的特定区域，甚至是特定的功能区域进行工作。\n\n基于此管理元素或项目部分的流程，Revit\
  \ 允许用户不仅在打开文件时，还在视图中工作时打开/关闭工作集。因此，如果我们关闭工作集，Revit 会变得更快，因为它在模型中工作时不需要处理所有信息。\n\n\
  可以遵循建议，但我们认为沟通是成功的关键。重要的是让所有团队成员了解设计过程中发生的事情，以及它可能如何影响模型组织甚至工作集结构。\n\n> 提示\n> 有多种工具可用于增强团队协作和沟通，例如\
  \ Skype、Microsoft Teams、Microsoft OneNote、Microsoft Planner、Slack 等。\n\n## 打开工作共享模型\n\
  \n打开工作共享模型时，Revit 允许用户选择应打开哪些工作集。如果关闭不需要的工作集，Revit 将更快地打开文件，从而提高性能。已关闭的工作集将不可见，因此您可以仅保留所需的信息处于打开状态。\n\
  \n要选择用户可以打开或关闭的工作集，请按照以下步骤操作：\n\n1. 转到文件菜单，选择打开，然后单击项目。\n2. 选择要打开的 Revit 中央模型。\n\
  3. 在 **打开** 按钮右侧，单击下拉箭头并选择 **指定…**：\n\n![](img/1961add582dd4a589b2eac3dda140e38_44_0.png)\n\
  \n图 1.23 – 指定要打开的工作集\n\n4. 弹出 **打开工作集** 窗口。通过选择特定工作集，可以通过单击 **打开** 和/或 **关闭** 按钮按需\
  \ **打开/关闭** 它们：\n\n\n\n![](img/1961add582dd4a589b2eac3dda140e38_45_0.png)\n\n图 1.24\
  \ – 打开工作集窗口\n\n5. 点击 **OK**，Revit 将仅打开工作集中元素的模型。\n\n> **提示**\n>\n> 此过程可以在不关闭文件的情况下随时撤销，只需在打开和关闭的工作集之间切换即可。\n\
  \n不仅文件会打开得更快，而且在浏览模型、打开视图，甚至与中心模型同步时，一切都比加载所有模型和工作集时更快。\n\n作为良好实践，每当设计团队在多学科项目上工作时，强烈建议为每个链接使用单独的工作集，无论是\
  \ Revit 链接还是 CAD 链接。通过此流程，在打开文件时更容易关闭任何不需要的链接。\n\n> **提示**\n>\n> 在工作共享环境中工作时，用户**不应**双击文件打开。用户必须始终使用\
  \ **Open** 工具来创建本地文件。\n\n## 使用已打开的工作集\n\n如果在特定视图中不需要打开所有工作集，强烈建议将其关闭，因为这也会影响视图处理。工作集在模型中打开时，可以更改其可见性。\n\
  \n> **提示**\n>\n> 用户只有在工作集在 Revit 会话中打开时才能更改工作集的可见性。如果工作集未加载（即未打开），则需要将其切换为 **Open**。之后，可以在特定视图中编辑工作集可见性。\n\
  \n要选择用户可以在视图中更改可见性的工作集，请按照以下步骤操作：\n\n1. 打开要更改工作集可见性的视图。\n2. 在 **Properties** 下方，点击\
  \ **Visibility/Graphics Overrides**（也可简称为 **VV** 或 **VG**）：\n\n   ![](img/1961add582dd4a589b2eac3dda140e38_47_0.png)\n\
  \n   图 1.25 – 可见性/图形覆盖\n\n3. 在 **Worksets** 选项卡下，按需更改 **Visibility Setting**：\n\n\
  \   ![](img/1961add582dd4a589b2eac3dda140e38_47_1.png)\n\n   图 1.26 – 在视图中控制工作集的可见性\n\
  \n   可用三个选项：\n\n   - **Show**：此处工作集将在当前视图中可见。\n   - **Hide**：此处工作集将在当前视图中不可见。\n\
  \   - **Use Global Settings (Visible)**：此处工作集可见性取决于工作集是否被定义为在所有视图中可见。\n\n4. 点击 **OK**。\n\
  \n如果某个工作集在所有模型中都已关闭，可以从 **Visibility/Graphics Overrides** 窗口中确认这一点。星号 (*) 告诉您如何将工作集切换为\
  \ **Open**：\n\n![](img/1961add582dd4a589b2eac3dda140e38_48_0.png)\n\n图 1.27 – 已关闭的工作集\n\
  \n## Worksharing Monitor\n\n在工作共享环境中工作时，了解谁正在文件中工作至关重要。Worksharing Monitor 将告知您以下信息：\n\
  \n- **谁打开了模型**：取决于同时在同一文件中工作的团队成员数量，这会影响模型的性能。\n- **谁正在同步**：这会告知您谁正在同步，您可以等待此人完成该过程。\n\
  - **谁直接在中心文件中工作**：如果有人直接在中心文件中工作，该人员需要立即关闭文件且不保存。\n\n要访问 Worksharing Monitor 工具，请按照以下步骤操作：\n\
  \n1. 在 **Collaborate** 下，点击 **Worksharing Monitor** 工具：\n\n   ![](img/1961add582dd4a589b2eac3dda140e38_49_0.png)\n\
  \n   图 1.28 – Worksharing Monitor 工具\n\n2. 将打开一个新窗口，如以下屏幕截图所示：\n\n   ![](img/1961add582dd4a589b2eac3dda140e38_49_1.png)\n\
  \n   图 1.29 – 使用 Worksharing Monitor 识别模型中的用户\n\n## Splash screen\n\n通过使用 2D 视图作为启动视图，您可以在打开模型时提高性能，因为\
  \ Revit 不需要重新生成整个项目。起始视图工具可在 Manage | Starting View 下定义：\n\n![](img/1961add582dd4a589b2eac3dda140e38_50_0.png)\n\
  \n图 1.30 – 起始视图工具\n\n> **提示**\n>\n> 在启动屏幕中，您可以获取项目信息、模型问题日期、模型坐标和免责声明说明。\n\n总之，我们学习了\
  \ Revit 生产率和/或研究高质量信息的重要性。通过遵循 Revit 推荐的设置，您将提高项目的效率和生产率。\n\n在下一节中，我们将学习如何选择正确的硬件规格以提高\
  \ Revit 的性能。\n\n## 选择合适的工具\n\n生产率的另一个令人兴奋的方面是选择合适的工具来执行特定任务的过程。\n\n在概念、设计和施工阶段，设计团队有多种应用程序可供选择。在选择工具之前，我们必须考虑团队经验和培训策略。\n\
  \n必须强调的是，BIM 并不是 Revit，Revit 只是用于创建 BIM 模型的应用程序之一；BIM 流程中有多个应用程序。\n\n以下图表显示了市场上用于管理数据和模型的某些\
  \ BIM 应用程序的复杂性：\n\n- BIM Authoring\n\n  ![](img/1961add582dd4a589b2eac3dda140e38_51_0.png)\n\
  \n- 3D Visualisation & VR\n\n  ![](img/1961add582dd4a589b2eac3dda140e38_51_1.png)\n\
  \n- 3D Model Viewer - Mobile\n\n  ![](img/1961add582dd4a589b2eac3dda140e38_51_2.png)\n\
  \n- Clash Detection - Coordination\n\n  ![](img/1961add582dd4a589b2eac3dda140e38_51_3.png)\n\
  \n- Productivity\n\n  ![](img/1961add582dd4a589b2eac3dda140e38_51_4.png)\n\n- Construction\
  \ Sequencing\n\n  ![](img/1961add582dd4a589b2eac3dda140e38_51_5.png)\n\n- Costing\n\
  \n  ![](img/1961add582dd4a589b2eac3dda140e38_51_6.png)\n\n- Facilities Management\n\
  \n  ![](img/1961add582dd4a589b2eac3dda140e38_51_7.png)\n\n图 1.31 – 多个 BIM 应用程序\n\
  \n根据项目规模，Revit 将需要更多计算机资源来管理更大的模型，了解如何选择正确的硬件至关重要。\n\n如果您没有正确的硬件或公司未为设计团队提供最佳基础设施，生产率会直接受到影响。\n\
  \n根据项目要求，用户需要能够理解硬件规格并为 Revit 选择最佳工作站。\n\n### Revit 最佳工作站是什么？\n\n市场上有很多工作站选项，选择\
  \ Autodesk Revit 的最佳工作站可能具有挑战性。\n\n计算机要求需要根据用户需求定义，例如模型复杂性、渲染选项以及与多个文件协作的能力。\n\n\
  本指南将帮助您定义这些要求并为 Revit 选择最佳工作站。\n\n在研究中定义 Revit 工作站时，必须考虑以下五个关键点：\n\n- 桌面还是笔记本？\n\
  - 快速处理器\n- 最佳显卡\n- 计算机内存（RAM）\n- 快速硬盘\n\n### 桌面还是笔记本？\n\n具有相似部件的台式机往往比笔记本更快，台式机的平均使用寿命更长。台式机部件的升级过程比笔记本更简单，可以延长多个组件的整体使用寿命。\n\
  \n台式机通常易于定制，其好处是可以添加高端组件，例如显卡以提高可视化效果。在笔记本电脑中，升级选项更有限。\n\n另一方面，笔记本电脑具有便携性，非常适合会议和客户演示。\n\
  \n### 快速处理器\n\nRevit 主要是一个单线程软件，这意味着更快的处理器对 Revit 性能更好。Revit 中有一些操作是多线程的，因此 Revit\
  \ 可以在 Revit 2021 中使用多个处理器和多核处理器进行以下处理：\n\n- 以矢量方式打印以及导出 DWG 和 DWF 文件\n- 实时光线追踪\n\
  \n\n\n\n\n- 墙体连接在平面图和剖面图中的表示\n- 将元素加载到内存中的过程以减少打开时间\n- 在透视 3D 视图中导航时轮廓边缘的计算\n- 打开视图或更新视图属性时的图形表示\n\
  - 保存和打开文件\n- 点云数据的显示\n- 将 DWF 导出为单张图纸\n- 后台运行的 MEP 系统计算\n- 材料用户界面\n- 颜色填充计算\n- 在另一个进程中后台运行的结构连接几何\n\
  \n目前，这些是最常见的处理器类型选项：\n\n- Intel Xeon\n- Intel (i) 系列 i5、i7、i9 和 i10\n- AMD Ryzen\n\
  \n## 处理器 Intel Xeon\n\nIntel Xeon 主要用于商务工作站或服务器，其 CPU 通常比 Intel (i) 系列拥有更多核心。此外，与\
  \ Intel (i) 系列如 i7 或 i9 相比，其时钟速度略低。\n\n它具有良好的耐用性和韧性，这使得该处理器成为建筑和工程公司同时使用多个应用程序的良好选择。通常，Intel\
  \ Xeon 比 Intel (i) 系列更昂贵。\n\n## Intel (i) 系列 i3、i5、i7、i9 和 i10\n\nIntel (i) 系列通常更受个人电脑青睐，与\
  \ Intel Xeon 相比，处理器成本更低。\n\nIntel (i) 系列的优点在于处理器每核心的时钟速度通常比 Intel Xeon 更快，因此对 Revit\
  \ 的性能带来优势。\n\nRevit 的性能会随着每核心时钟速度高的处理器而提升，这意味着多核心处理器不一定会增强性能，因为 Revit 并非完全是多线程软件。\n\
  \n## AMD Ryzen Threadripper 处理器\n\nAMD Ryzen Threadripper 处理器是一个降低成本的选择，它可以在 Revit\
  \ 中提供良好的性能。按照之前的过程，您需要检查时钟速度和最高睿频速度。\n\n## 最高睿频频率 (GHz)\n\n目前，大多数公司在 Revit 工作站中使用\
  \ Intel 技术，选择 Revit 最佳处理器的过程基于最高频率 (GHz)，即处理器速度。\n\n选择合适处理器时的关键点是检查最高频率 (GHz) 以最大化\
  \ Revit 的性能。您需要考虑以下两个方面：\n\n- 处理器基础频率 (GHz)\n- 处理器最高睿频频率 (GHz)\n\n简单来说，处理器基础频率 (GHz)\
  \ 是基础速度，而最高睿频频率 (GHz) 是处理器最高速度。\n\n例如，我们将分析 Intel® Core™ i9-10900X X-series 处理器。\n\
  \n您可以在以下链接访问处理器规格。或者，您也可以使用手机摄像头扫描以下二维码。\n\n以下是链接：`https://intel.ly/2HhqjAV`\n\n\
  以下是二维码：\n\n![](img/1961add582dd4a589b2eac3dda140e38_54_0.png)\n\nRevit 插件，如 Enscape、Twinmotion、Lumion\
  \ 和 V-Ray，利用了 **图形处理单元 (GPU)** 渲染技术，这需要来自 NVIDIA 或 AMD 的强大的显卡。\n\n使用 GPU 可以降低渲染时间，插件如\
  \ Enscape 可以快速提供出色的渲染质量（例如，少于 1 分钟）。\n\n您可以通过以下链接查看 Enscape 360° 图像示例：\n\n`https://bit.ly/35T3FYr`\n\
  \n或者，您可以扫描此处的二维码：\n\n![](img/1961add582dd4a589b2eac3dda140e38_56_0.png)\n\n许多 Revit\
  \ 工作站使用 NVIDIA 显卡，这些显卡分为两种类型：\n\n- NVIDIA Quadro 或 NVIDIA Quadro RTX\n- NVIDIA GeForce\
  \ GTX 或 RTX\n\n通常，NVIDIA Quadro 系列基于韧性和耐用性，比 NVIDIA GeForce 系列更昂贵。\n\nNVIDIA RTX\
  \ 技术是最新发展，它改进了实时光线追踪，并将在您的渲染中提供详细的灯光效果和更好的性能。\n\n在此网站上，您可以比较多张显卡并比较性价比：\n\n`https://gpu.userbenchmark.com/`\n\
  \n为了获得最佳性能和效率，显卡应至少具有 4 GB 专用内存或 RAM。\n\n> **提示**\n> \n> 始终检查您是否使用显卡的最新可用驱动程序。\n\
  \n## 计算机内存 (RAM)\n\n根据您的项目需求，我们建议轻度用户使用 16 GB 系统内存，普通用户使用 32 GB，大型项目和日常使用的用户使用 64\
  \ GB。\n\n内存 (RAM) 的成本正在下降，如果您能负担 64 GB 内存 (RAM)，则建议使用。在中型和大型组织中，64 GB 是最低要求。\n\n\
  计算机内存 (RAM) 会提高 Revit 的性能，因为它在内存中维护模型数据。\n\n> **提示**\n> \n> 建议您经常重新启动计算机和 Revit；这将刷新内存\
  \ (RAM)。经常将 Revit 保持打开数天的用户会经历性能下降。\n\n## 快速硬盘\n\n**固态硬盘 (SSD)** 在 Revit 中提供更好的性能，并允许您的计算机启动、启动应用程序和加载文件比传统硬盘快得多。\n\
  \n设计师经常使用多个应用程序，如 Revit、AutoCAD、Rhino、Navisworks 或 Adobe Suite，以及各种插件，这些可能占用硬盘中大量空间。\n\
  \n推荐的 SSD 应至少为 500 GB。\n\n如果没有足够的空间来缓存 Revit 进程，将会出现较慢的性能。\n\n> **提示**\n> \n> 始终在硬盘中保留至少\
  \ 30 GB 的可用空间。\n\n拥有正确的软件和硬件对于提高 Revit 中的性能至关重要，以上信息将使您能够选择最佳工作站以最大化 Revit 中的性能。\n\
  \n在下一节中，我们将学习 BIM 实施的成功策略。\n\n## BIM 实施概述\n\nBIM 是一种许多公司已经实施的过程，但对成功策略有一个概述是有价值的。\n\
  \nBIM 成熟度水平对于分析公司实施情况及其交付 BIM 项目的能力至关重要。\n\nBIM 实施并不止于几个项目，而是一个需要定期维护和持续发展的过程。\n\
  \n持续发展将为提高组织的成熟度水平奠定基础，并涉及多个部门，如商业部门，它们将分析合同和任命。\n\n> **提示**\n> \n> 成功策略考虑到整体公司文化，并制定自上而下驱动的战略计划，并在实施\
  \ BIM 的决策中涉及董事。\n\n成功的 BIM 实施共享以下 10 个关键步骤：\n\n- 1. 让董事以言行参与 BIM 实施的决策。实施始于自上而下！\n\
  - 2. 创建一个人员小组来定义实施过程和整体 BIM 战略，该战略必须包括多个部门。\n- 3. 记住最终目标是更好的信息管理。\n- 4. 创建一个小型团队来开展第一个项目。\n\
  - 5. 创建或调整您的公司标准以符合当地 BIM 规范和 ISO 标准。\n- 6. 定义您将使用的软件和支持。了解实施新技术所需的人力资源等投资。\n- 7.\
  \ 培训和发展您的团队。培养一些人成为“专家”以帮助公司其他人。\n- 8. 随着时间的推移改进 BIM 流程，不要专注于技术。\n- 9. 设定切合实际的目标，因为\
  \ BIM 的好处已得到充分记录；然而，您需要投入时间和精力来实现组织真正的潜力。\n- 10. 始终记住信息管理是 BIM 流程最重要的方面。\n\n在 BIM\
  \ 实施期间，组织可以为未来发展创建特定领域并支持该过程以提高 BIM 成熟度水平。\n\n持续发展的领域包括以下内容：\n\n- 公司和行业标准、方法和程序\n\
  - 培训\n- 数字资产管理 – Revit 族、AutoCAD 块和其他文件\n- 生产力和数据分析\n\n这四个领域应持续发展，以为您的组织带来创新并提高生产力。\n\
  \n许多中型和大型公司内部拥有编程能力的人员，以提高生产力并定制工具以创建新的工作流程。\n\n如果您希望学习编程以应用于建筑和工程团队，我们推荐 Dynamo、Grasshopper、Python\
  \ 和 C#。\n\n编程技能可以开启职业生涯的大门并扩展您的设计能力，使您领先于竞争对手。\n\n此外，在 BIM 实施过程中，您还需要关注另外七个要点：\n\
  \n1. 创建一个 BEP 模板，您将用它来响应客户对 BIM 的要求。\n\n\n\n\n\n- 2. 根据所在地的框架（例如英国 BIM 框架）定义公司的\
  \ BIM 标准交付成果。\n\n英国 BIM 框架的参考资料见：\n\n```\nhttps://ukbimframework.org/standards-guidance/\n\
  ```\n\n使用手机摄像头扫描二维码，即可访问上述链接：\n\n![](img/1961add582dd4a589b2eac3dda140e38_60_0.png)\n\
  \n- 3. 定义 BIM 项目的信息需求等级。\n\n信息需求等级列出了 BIM 构件的几何和数据要求，以及项目的前提条件。应根据这些要求的用途进行定义，从而为项目创造价值。\n\
  \n在英国，PAS 1192-2:2013 中沿用的术语是模型定义等级/细节等级（LOD）/信息等级（LOI）。目前，英国采用的是 ISO 19650 系列中定义的信息需求等级。\n\
  \n在美国，BIMForum 发布了开发等级（LOD）。\n\nBIMForum 网站链接如下：https://bimforum.org/LOD\n\n使用手机摄像头扫描以下二维码，即可访问上述链接：\n\
  \n![](img/1961add582dd4a589b2eac3dda140e38_60_1.png)\n\n- 4. 定义将在多个项目中作为标准使用的典型\
  \ BIM 交付成果和模型用途。\n\n- 5. 编写内容，以便在投标过程中回答**资格预审问卷（PQQ）**，从而明确贵公司的经验水平和交付 BIM 项目的能力。\n\
  \n- 6. BIM 会影响合同和委任，因此商务部门应了解项目的 BIM 要求。\n\n- 7. 将风格和展示标准与 BIM 创作工具（例如 Revit）保持一致。\n\
  \n总而言之，BIM 实施是一个会影响 AECO 行业相关公司几乎所有部门的过程。\n\n在下一节中，我们将学习如何为公司制定 Revit 培训方案。\n\n\
  ## BIM 与 Revit 培训方案\n\n公司会使用各种需要培训才能维持生产效率的应用程序和插件，因此制定战略性的培训方案至关重要。\n\n培训方案的战略目标包括：\n\
  \n- 评估员工的知识水平。\n- 了解现有培训流程。\n- 确定培训障碍。\n- 制定培训预算。\n- 找出内部专家。\n- 建立衡量进度的流程。\n- 确定所需资源，例如计算机、培训室、培训材料、在线视频培训、公司标准等。\n\
  \n下面详细探讨这些战略目标。\n\n## 评估员工知识水平\n\n评估员工的知识水平并确定其经验程度，有助于制定培训计划。可以使用多种工具创建调查问卷，例如\
  \ SurveyMonkey、Google Forms、Microsoft Forms 等。\n\n可以根据以下因素跟踪软件使用经验：\n\n- 使用年限（少于\
  \ 1 年、1 至 2 年、3 至 4 年，以及 5 年以上）。\n- 经验水平（无经验、基本了解或具备基础知识、初学者或经验有限、中级、高级和专家）。\n-\
  \ 针对特定软件的问题。\n- 基于任务的问题。\n- 一对一面谈。\n\n## 了解现有培训流程\n\n我们需要了解当前的培训流程，以便检查其中的不足并寻找可能的改进方法。\n\
  \n在调研过程中，我们可能会发现更好的培训课程跟踪和组织方式。\n\n## 确定培训障碍\n\n培训能否成功，取决于你如何减少培训障碍并为员工提供有效培训。\n\
  \n以下列出了一些可能需要解决的障碍：\n\n- 管理变更：包括技术、预算、人员以及其他方面的变化。\n- 改变已形成的习惯：改变已经实施多年的流程可能会很有挑战性。\n\
  - 培养 BIM/Revit 骨干：需要 Revit 骨干支持实施工作并帮助员工。\n- 造成当前工作流程中断：新工作流程应提高生产效率，并尽可能减少潜在干扰。\n\
  - 调动员工积极性：培训师必须说明培训的价值和生产效率方面的优势。\n- 提供培训：语言障碍和地理限制可能会带来问题。\n- 选择合适的培训时间：在项目开始前接受培训对用户很有帮助，但要安排合适的时间可能并不容易。\n\
  - 评估培训成效：跟踪培训效果并找出改进之处至关重要。\n\n## 制定培训预算\n\n向高级管理层说明培训的价值，以及需要投入资金的活动（例如在线视频培训和制作培训材料所需的时间）非常重要。\n\
  \n## 找出内部专家\n\n内部专家会在实施过程中为员工提供支持并激励他们，是持续培训计划的重要组成部分。\n\n## 建立衡量进度的流程\n\n跟踪培训效果对于说明培训对组织的影响至关重要。培训后的技能评估有助于收集信息，而后续跟进则能帮助确定生产效率是否有所提升。\n\
  \n## 确定所需资源\n\n确定所需资源有助于了解培训需要采购哪些资源，包括技术设备、培训室、培训材料、在线视频培训，以及制作或改进公司标准所需的时间。\n\n\
  开始培训前，需要明确以下要点：\n\n**Revit 资料：**\n\n- 符合公司标准的 Revit 样板。\n- 公司 Revit 族。\n- 共享参数。\n\
  - 培训中使用的 Revit 模型。\n- Revit 重要插件的工作流程。\n- 渲染材质库。\n\n**培训计划：**\n\n- 培训议程和材料。\n- 每次培训的课程数量。\n\
  - 小组人数。\n- 培训级别，即从基础到专家级。\n\n## 培训形式\n\n- 课堂培训或在线培训。\n- 小组培训。\n- 一对一培训。\n- 按需培训。\n\
  - 视频培训。\n- 持续支持。\n- 指导。\n\n## 定制培训\n\n成功的培训策略会根据各项目角色进行定制，例如董事、项目经理、BIM 经理/BIM 协调员和信息编制人员。\n\
  \n请注意，项目角色与职位角色不同，因此建筑师可能会兼职承担建筑师和 BIM 协调员的工作。\n\n培训方案可分为四个部分：\n\n- **高级管理层和董事：**\
  \ BIM 入门知识和核心原则应覆盖整个公司，包括高级管理层和董事。\n- **项目经理：** 项目经理将了解 Revit 工作流程概况，并学习 BIM 文档，包括\
  \ BEP、**信息交换要求（EIR）**以及其他行业标准。\n- **BIM 经理/BIM 协调员：** BIM 经理和 BIM 协调员将接受深入的 Revit\
  \ 培训，以及多种软件应用程序的培训，以便管理碰撞检测流程、资产管理数据和其他基于项目的要求。\n- **信息编制人员：** 信息编制人员包括将在 Revit\
  \ 中进行建模的设计师、建筑师和工程师，因此需要接受深入的 Revit 培训。\n\n培训接近尾声时，培训师可以针对具体项目定制培训内容，进一步调动员工的参与积极性。\n\
  \n项目专项培训非常实用，可以展示团队在项目启动后将面临的挑战，例如复杂的幕墙设计或精细复杂的项目计划。\n\n总而言之，本节内容为你制定培训方案并根据不同项目角色进行定制提供了基础。\n\
  \n## 总结\n\n本章介绍了 BIM 模型中的信息是我们最宝贵的资产，而信息管理是提高 Revit 生产效率的重要流程。\n\n此外，我们现在了解了通过一种方法提升\
  \ Revit 生产效率的重要性：在开始任务前，先调研并获取高质量的信息。同时，相关的时间管理技巧也能提高你使用 Revit 的效率。\n\n我们讲解了提升生产效率的\
  \ Revit 关键技术因素，以及如何为 Revit 选择合适的工作站。最后，我们学习了成功实施 BIM 和为公司制定培训方案的策略。\n\n下一章将介绍项目数据管理，并学习启动\
  \ Revit 项目所需的关键数据、委任概述、BIM 文档、项目职能、资产管理，以及制定 BIM/Revit 项目启动行动计划。\n\n\n\n\n"
- "## 项目数据管理\n\n项目数据管理是使用 **建筑信息模型 (BIM)** 时效率和生产力的重要方面，因为作者软件以数据为中心。\n\n组织越来越多地使用基于数据分析的流程来推动其在多个领域的业务，以提高绩效和盈利能力。在使用\
  \ Revit 管理模型和数据时，数据管理的原则是相似的。\n\n数据驱动的文化正在增长，越来越多的公司注意到分析数据对促进改进和在 **建筑、工程、施工、业主运营商\
  \ (AECOO)** 行业中产生变革的业务决策的价值。\n\n公司使用 **数据管理计划 (DMP)** 来概述数据在项目完成期间和之后将如何使用。BIM 项目将通过创建类似的文件来支持项目开发，例如\
  \ **交换信息要求 (EIR)**、**BIM 执行计划 (BEP)** 等。\n\n本章将提供与 BIM 项目相关的数据管理关键点的信息。我们将学习如何在考虑这些关键点的情况下成功启动\
  \ Revit 项目。\n\n本章还将解释任命/合同的关键方面；BIM 项目中的项目职能；BIM 文档概述；**施工运营建筑信息交换 (COBie)** 的挑战；以及制定启动\
  \ BIM 项目的行动计划。\n\n- **法律方面**：分析任命中的 BIM 要求并识别法律问题。\n- **数据策展**：定义数据验证流程，通常在 **通用数据环境\
  \ (CDE)** 和数据互操作性中描述。\n- **数据存储和使用**：识别组织的内部和云数据存储以实现业务连续性。这还包括数据使用、协作和运营的程序。\n\n\
  以下三个关键文件将提供启动 BIM 项目所需的关键数据：\n\n- 任命或合同\n- 交换信息要求 (EIR)\n- BIM 执行计划 (BEP)\n\nBIM\
  \ 项目中还有其他可用文件，这些文件将在上述关键文件中引用。\n\n要启动 BIM 项目，还需要数字数据，例如勘测文件或遗留数据。\n\n## 任命或合同\n\n\
  任命或合同将定义工作范围，进一步的细节包含在 BIM 责任矩阵中。\n\n检查任命时，识别可能增加项目风险或需要额外时间完成的特定 BIM 活动至关重要。这些活动需要与商业部门提出，以在必要时调整项目费用。\n\
  \n常见的是看到提及 BIM ISO 阶段 2 的投标和任命，但未提供项目应如何交付的任何细节，这将增加项目风险。在客户未提供信息的情况下，牵头被任命方应创建一份具有标准交付成果的\
  \ BEP。\n\n> **提示**\n> \n> 定义贵公司认为 BIM ISO 阶段 2 或根据当地框架（如英国 BIM 框架）的 BIM 最低交付成果。这对于未明确其\
  \ BIM 要求的投标和任命非常有用。\n\n> **提示**\n> \n> BEP 是指导项目成功实施 BIM 的路线图。公司需要协作工作来制作 BEP，并以最终用户为出发点创建它。这是成功实施的基本原则。\n\
  \n## BIM 执行计划 (BEP) – 合同前\n\n合同前 BEP 在投标过程中使用，以证明公司有能力根据 EIR 要求交付项目。\n\n合同前 BEP\
  \ 应针对 EIR 要求作出回应，提供交付策略，并应包括协作流程、关键里程碑和 **项目实施计划 (PIP)**。\n\nPIP 是 BEP 的一部分，每个竞标项目的公司都应提供此计划以证明其交付\
  \ BIM 项目的能力、经验和胜任力。\n\n## BIM 执行计划 (BEP) – 合同后\n\n合同授予后，将与所有被任命方协作创建合同后 BEP，以就项目中使用的标准、方法和程序达成一致，并响应客户的\
  \ BIM 要求。\n\nBEP 通常分为四个领域，概述如下：\n\n**管理和商业要求**\n\n- BEP 简介和目的\n- 项目信息\n- 项目团队——职能和责任\n\
  - BIM 项目标准\n- 对 EIR 映射和差异的响应\n- BIM 战略目标\n- 模型用途\n- BIM 交付成果\n- 协调会议\n- 项目里程碑\n\
  - 主信息交付计划 (MIDP)\n- 安全要求\n- 健康与安全要求\n- BEP 中使用的术语和定义\n\n## 信息标准\n\n- 项目放样和坐标\n-\
  \ 标高、网格和阶段\n- 体量和联合策略\n- 信息需求等级或 LOD\n- 文件、图纸和模型的命名约定\n- 修订约定\n- 图纸标准\n- 特定软件要求\n\
  - 最佳实践\n\n## 信息生产、方法和程序\n\n- 协作策略\n- CDE 和交换流程\n- 建模范围和排除项\n- 审查和批准流程\n- 模型检查/验证\n\
  - 碰撞检测流程和碰撞容差策略\n- 资产信息要求和验证流程\n- 勘测策略\n- 现有遗留数据\n\n## 附录\n\n- 主信息交付计划 (MIDP)\n\
  - BIM 责任矩阵\n\n![](img/1961add582dd4a589b2eac3dda140e38_75_0.png)\n\n# 图 2.1 – OS\
  \ 地图\n\n> **提示**\n> \n> OS 地图上的网格交点提供了设置 Revit 文件的最佳坐标点。另一种选择是使用勘测文件中的勘测站点。\n\n\
  设计负责人通常会提供标高和网格以继续设置初始项目文件。\n\n总体目标是创建 Revit 主文件以分发给所有顾问，以便他们获取坐标并在正确位置启动项目。\n\n\
  Revit 主文件包含项目坐标（包括真北和项目北）、标高和网格。该文件将与体量策略一起使用，以创建和设置所有后续 Revit 文件。\n\n一旦初始 Revit\
  \ 文件设置完成，项目坐标应与其他平台（如 AutoCAD 和 Rhino）一起使用，以确保导出和导入数据的流程顺畅。\n\n在 *第 4 章，高效启动 Revit\
  \ 项目* 中，我们将展示如何逐步设置 Revit 项目坐标并启动项目的指南。\n\n总之，我们了解了启动 BIM 项目所需的关键数据，以及如何分析主要 BIM\
  \ 文档以降低风险。\n\n在下一节中，我们将介绍其他 BIM 文档并提供进一步的细节。\n\n## BIM 文档概述\n\n将 BIM 文档与项目策略保持一致对于提高效率至关重要，以便要求得到明确定义，从而提高生产力并降低成本。\n\
  \n公司必须了解他们应为设计和施工团队提供哪些信息，并定义他们期望为资产管理接收哪些信息以支持建筑维护。\n\n我们理解客户在项目开始时很难有精确的 BIM 要求。但这必须改变，以改善\
  \ AECOO 行业并确保项目团队在项目生命周期中拥有明确的要求。\n\n明确定义 BIM 文档具有明显的好处。其中一些在此概述：\n\n- 更快的 **投资回报率\
  \ (ROI)**\n- 满足客户和项目标准\n- 确保客户和项目团队的 BIM 要求保持一致\n- 更好地沟通以交付项目\n- 改进 BIM 模型和数据的质量保证和质量控制\n\
  \n我们将概述 AECOO 行业目前最常用的 BIM 文档。\n\n\n\n\n\n我们可以将BIM文档分为三类，如下所示：\n\n- 客户文档\n- 项目团队文档\n\
  - 标准文档\n\n## 客户文档\n\n至关重要的是，要确立委托书或合同是主要的合同文件，其中应包含关于BIM需求的高层级信息，同时还应包含贵组织可能认为必要的BIM细节。\n\
  \n客户和项目团队需要在项目基础上明确哪些BIM文档属于合同性文件，哪些属于非合同性文件。在项目中，BEP有时作为合同性文件，有时作为非合同性文件，这种情况很常见。\n\
  \n如果EIR未被引用到委托书或合同中，它很可能不构成合同要求。\n\n公司BIM负责人、保险组织和商务部门应进行联络，以将这些文件定义为合同要求。\n\n下面我们将概述客户方的BIM文档，这些文档包括但不限于下文所列的要求。\n\
  \n### 组织信息需求（OIR）\n\n这确立了客户在**组织层面上的资产管理系统**的信息需求，其中包括资产管理方面的战略决策和专业知识。该文档将用于生成AIR，并为创建PIR提供信息。\n\
  \n### 资产信息需求（AIR）\n\nAIR**定义了资产管理与运营的具体项目需求**，并传达了组织信息需求（OIR）的目标。它有助于为编制交换信息需求（EIR）提供信息，并明确**资产信息模型（AIM）**。\n\
  \n### 项目信息需求（PIR）\n\nPIR传达组织信息需求（OIR）中的信息，以**定义既有资产项目**。该文档将支持EIR的编制。\n\n### 交换信息需求（EIR）\n\
  \nEIR**定义了在设计和施工阶段需要交付和采用的信息、标准和流程**。它应明确规定为满足项目信息需求（PIR）所需的信息。我们在上一节中已对此进行了详细说明。\n\
  \n总而言之，客户部分列出的文档将支持项目团队编制BIM执行计划（BEP）并生成BIM模型。\n\n下图更详细地展示了各文档之间的关联，以及如何为项目团队提供足够的信息来生成BIM模型：\n\
  \n![](img/1961add582dd4a589b2eac3dda140e38_78_0.png)\n\n图2.2 – BIM文档关系图\n\n- 信息需求等级（用于定义详细程度和信息等级框架）\n\
  - 确定哪些模型元素需要交付COBie成果\n- 项目阶段\n\n## BIM和IT能力评估\n\nBIM和IT能力评估用于评估交付BIM项目的能力、IT需求和网络安全需求等方面的问题。\n\
  \n## 项目执行计划（PIP）\n\nPIP是Pre-BEP的一部分，每个参与项目投标的公司都应提供此计划，以展示其交付BIM项目的能力、经验和资质。\n\n\
  ## BIM标准与指南\n\n标准与指南对于数字化AECOO行业的发展至关重要，它们有助于企业和政府确保项目的一致性。\n\n这种一致性可以提高AECOO行业多个领域的效率和生产力。它还有其他益处，例如降低成本、改善协作、协调以及数据交换。\n\
  \n2019年1月，**英国标准欧洲规范（BS EN）** *ISO 19650-1*和*ISO 19650-2*的最终版本发布，以取代*BS 1192:2007+A2:2016*和**公开可用规范（PAS）**\
  \ *1192-2:2013*。\n\n有关*BS EN ISO 19650*系列的更多信息，请访问此链接：\n\n```\nhttps://ukbimframework.org/standards-guidance/\n\
  ```\n\n这是对应的**快速响应（QR）**码：\n\n![](img/1961add582dd4a589b2eac3dda140e38_80_0.png)\n\
  \n我们无法详细介绍所有BIM标准，但可以将其分为三个层级，如下面的截图所示：\n\n![](img/1961add582dd4a589b2eac3dda140e38_81_0.png)\n\
  \n图2.3 – BIM标准层次\n\n国家标准是针对特定国家的标准，例如英国标准、欧洲标准（**欧洲标准化委员会（CEN）/技术委员会（TC）442**）以及其他国家的标准。\n\
  \n组织标准是由组织创建的特定指南，用于定义软件和图面表达方式，例如线宽、图题等。\n\n总而言之，我们了解了面向客户和项目团队的BIM文档，并对行业标准进行了概述。\n\
  \n在下一节中，我们将了解BIM项目中的项目职能。\n\n## 项目职能\n\n*ISO 19650*系列标准已将*角色*一词替换为*职能*，但其含义相同，即定义特定个人或群体的职责。\n\
  \n交换信息需求（EIR）和BIM执行计划（BEP）将定义项目职能以明确关键职责，这可以提高生产力，因为每个团队成员都会清楚需要执行的任务。\n\n需要重点指出的是，项目职能并非职位头衔，一个人可以承担并履行多个职能。\n\
  \n编写EIR的委托方（客户）将主要定义信息管理职能。委托方可以提名本组织的人员或指定第三方公司来履行该职能。\n\n项目团队将在BEP中定义以下职能：\n\n\
  - 任务团队经理\n- 任务信息经理\n- 信息作者\n- 接口经理\n\n在以下各节中，我们将介绍每个职能的主要职责。\n\n### 委托方（客户）\n\n\
  委托方负有关键责任，即向设计团队提供高质量的信息，这包括：\n\n- 组织信息需求（OIR）\n- 资产信息需求（AIR）\n- 项目信息需求（PIR）\n-\
  \ 交换信息需求（EIR）\n\n> **重要提示**\n> \n> 通用数据环境（CDE）和项目编号必须与委托方（客户）确认。\n\n### 任务团队经理\n\
  \n任务团队经理将执行的活动包括但不限于以下内容：\n\n- 编制任务信息交付计划（TIDP）\n- 审查和批准其团队生成的信息\n- 定义适当的信息状态\n\
  - 批准在通用数据环境（CDE）中发布的信息\n\n### 任务信息经理\n\n任务信息经理将执行的活动包括但不限于以下内容：\n\n- 审查交换信息需求（EIR）\n\
  - 审查委托书并核查BIM要求\n- 创建BIM执行计划（BEP）\n- 确保任务团队能够依据项目标准、方法和程序生成信息\n- 实施项目协议和技术标准\n-\
  \ 提供支持与培训\n- 审查资产信息需求（AIR）\n\n### 信息作者\n\n信息作者将执行的活动包括但不限于以下内容：\n\n- 使用BIM软件创建模型\n\
  - 按照项目BEP生成或修改信息\n- 确保图形模型在空间上协调一致\n- 根据碰撞检测流程更新模型\n- 按照任务信息交付计划（TIDP）交付成果\n\n###\
  \ 接口经理\n\n接口经理将执行的活动包括但不限于以下内容：\n\n- 管理空间协调以避免和解决碰撞\n- 生成碰撞报告\n- 整合BIM模型\n\n\n\n\
  \n\n## 信息管理\n\n委托方（客户）将在其组织内部指定一名人员或指定第三方公司来承担信息管理职能。\n\n信息管理职能的活动清单在不同项目之间差异很大。\n\
  \n在 *BS EN ISO 19650-2* 标准中，有 *附录 A*，它是一个信息管理责任的矩阵模板。\n\n## AEC UK BIM 协议\n\n2015\
  \ 年发布的 **自动曝光控制 (AEC)**（英国）BIM 协议对于解释 AEC 行业广泛使用的实践职能仍然相关。\n\n本文件将活动分配给三个特定领域，概述如下：\n\
  \n- 战略\n- 管理\n- 生产\n\n### 战略 – BIM 管理\n\n该角色代表公司范围内的 BIM 管理员，负责定义 BIM 实施的战略决策并提供培训支持。\n\
  \n公司范围内的 BIM 管理员将执行包括但不限于以下活动：\n\n- 与 BIM 相关的公司目标\n- 技术和新流程的研究\n- 开发流程和新工作流程\n-\
  \ 开发标准和协议\n- 负责 BIM 实施\n- 为技术和新流程提供培训\n- 分析或创建 BIM 文档（BEP 及其他）\n\n### 管理 – 协调\n\n\
  该角色代表 BIM 协调员，将执行包括但不限于以下活动：\n\n- 为团队提供技术和新流程的培训\n- 分析或创建 BIM 文档（BEP 及其他）\n- 审核\
  \ BIM 模型\n- 模型协调和冲突检测\n- 内容创建\n\n### 生产 – 建模/作者\n\n该角色代表建筑师、工程师、设计师和 BIM 建模师，他们在\
  \ BIM 模型中生成信息。他们将执行包括但不限于以下活动：\n\n- 项目特定内容创建\n- 项目特定建模\n- 项目特定图纸制作\n\nAEC（英国）BIM\
  \ 协议职能可在以下表格中看到：\n\n| Strategic - BIM Management | Management - Coordination | Production\
  \ - Modelling |\n|---|---|---|\n| Corporate objectives related to BIM | Provide\
  \ team training for technology and new processes | Project-specific content creation\
  \ |\n| Research on technology and new processes | Analyze or create the BIM documentation\
  \ (BEP and others) | Project-specific modelling |\n| Develop processes and new workflows\
  \ | Audit BIM models | |\n| Develop standards and protocols | Model Coordination\
  \ & clash detection | |\n| Responsible for the BIM implementation | Content creation\
  \ | |\n| Training for technology and new processes | | |\n| Analyze or create the\
  \ BIM documentation (BEP and others) | | |\n\nFigure 2.4 – AEC (UK) BIM Protocol\
  \ functions\n\n必须强调的是，这些不是职位头衔，同一个人可以执行多个职能。\n\n总之，本节中的信息提供了 AEC 行业中常用的项目职能的详细信息，并在\
  \ BEP 中得到充分定义。\n\n在下一节中，我们将了解资产管理以及它如何最大化建筑资产的价值。\n\n## 资产管理\n\n**资产管理** 是一种流程，旨在通过提供战略和运营服务来帮助建筑业主最大化其资产价值。\n\
  \n建筑物和公用设施的使用寿命有限，而建筑物在施工阶段后的生命周期代表了房地产业主的最高成本。如果我们考虑 25 年的周期，预计运营、维护和修复建筑物的成本约占总拥有成本的\
  \ 80%。\n\n这在以下图表中有所说明：\n\n![](img/1961add582dd4a589b2eac3dda140e38_86_0.png)\n\n\
  Figure 2.5 – Total cost of ownership\n\n在建筑生命周期中资产管理的重要性很明显，但 AECOO 行业在提供可集成到资产管理和运营流程中的数字化和结构化数据方面仍有改进空间。\n\
  \n如果在设计和施工阶段创建的数据能够完美地转移到资产管理数字平台，效率和生产率将提高。\n\n目前，我们在项目阶段之间以及 **运营/维护 (O&M)** 手册向设施管理数字系统的数据转移方面仍存在问题。主要问题是可用数据未结构化，部分信息以纸质或简单的\
  \ **便携式文档格式 (PDF)** 文件形式存在。\n\n这种数据集成不足可能导致重大数据丢失，降低生产率并增加维护资产和管理数据的成本。\n\n管理数据的预期流程包括\
  \ **通用数据环境 (CDE)** 并与设施管理数字系统完全集成，如以下图表所示：\n\n![](img/1961add582dd4a589b2eac3dda140e38_87_0.png)\n\
  \nFigure 2.6 – Expected process for data integration\n\n通用数据环境将帮助在设计和施工阶段以 BIM 模型、图纸和产品数据的形式收集数据。此信息将与设施管理数字系统集成。\n\
  \n当运营/维护手册（O&M）为数字化和结构化时，这些将被集成到设施管理数字系统中，从而完成理想流程。\n\n不幸的是，在许多项目中，数据集成仍然是碎片化的，导致数据丢失和效率低下。\n\
  \n在设计阶段使用私有服务器交换数据，仅在施工阶段使用 CDE 的项目仍然很常见，这可能导致数据丢失。\n\n如果 CDE 与设施管理数字系统之间的集成未建立，也可能存在数据丢失的潜在风险，因为信息需要结构化以实现此过程。\n\
  \n当 O&M 手册不是数字化的或没有结构化数据组织时，也可能发生数据丢失，如以下图表所示：\n\n### 可能的数据丢失\n\n![](img/1961add582dd4a589b2eac3dda140e38_88_0.png)\n\
  \nFigure 2.7 – Possible data loss without data integration\n\n私人客户和英国政府共享类似的策略，通过利用\
  \ COBie 作为 BIM 要求来改善这一流程。\n\n## COBie\n\n**建设运营建筑信息交换 (COBie)** 是一项国际标准，用于支持包括空间和设备在内的资产管理流程。它在完工后提供所需信息和来自施工团队的产品数据给运营团队。\n\
  \n> Tip\n>\n> COBie 并未对典型的合同交付增加新的要求。它只是将现有交付物的格式更改为开放的国际标准格式。\n\nCOBie 是 **行业基础类\
  \ (IFC)** 的子集，最常见的表示形式是电子表格。根据设施管理系统，导入数据的流程可能不同。\n\n## COBie 电子表格信息\n\nCOBie 电子表格包含有关设施的信息，例如楼层和空间；产品清单；保修的进一步细节；以及与资产管理流程相关的其他方面。\n\
  \n每个项目上的每个设施都应提供一个 COBie 文件。也就是说，如果有多个设施，应提供额外的 COBie 文件。所有交付物应符合设施管理移交要求。\n\n典型的\
  \ COBie 电子表格如下截图所示：\n\n![](img/1961add582dd4a589b2eac3dda140e38_89_0.png)\n\nFigure\
  \ 2.8 – Typical COBie spreadsheet\n\nCOBie 的主要目标是在移交时向设施管理团队提供结构化数据，并提高管理建筑资产的效率。如果没有结构化数据，AECO\
  \ 行业将无法在数据管理方面达到高效率，这可能会影响数字孪生技术的发展。\n\n项目业主或客户有责任定义资产管理和 COBie 要求，并且需要与设施管理团队的要求和能力保持一致。\n\
  \n> **Tip**\n>\n> 在项目开始时与设施管理团队会面并参与其中，以核实资产管理和 COBie 要求至关重要。\n\n\n\n\n\n![](img/1961add582dd4a589b2eac3dda140e38_91_0.png)\n\
  \nFigure 2.9 – COBie color-coded cells\n\n需要检查并填写的选项卡包括以下内容：\n\n- **Instruction**\n\
  - **Contact**—提供相关联系数据\n\n## Requirements and Constraints\n\n这是在预期 **Royal Institute\
  \ of British Architects (RIBA)** 第 2 或 3 阶段通常需要包含的数据。这些信息主要用于确保产生的设计和规范在功能和成本方面与委托方简报一致。\n\
  \n需要填写的选项卡包括以下内容：\n\n- **Facility**—数据在 BIM 文件中手动填写\n- **Floor**—数据从楼层导出（从模型中提取）\n\
  - **Space**—数据从空间导出（从模型中提取）\n- **Zone**—数据从区域导出（从模型中提取）\n\n## Outline Solution and\
  \ lifecycle costs\n\n这是在预期 *RIBA Stage 4* 通常需要包含的数据。这些信息可用于确保整个项目在功能、成本和碳性能方面与委托方简报保持一致。\n\
  \n在此阶段，模型可用于投标，因为我们可以通过计划表直接从模型中导出数据（门、窗、设备等）。\n\n需要填写的选项卡包括以下内容：\n\n- **Type**—数据从模型中提取\n\
  - **Component**—数据从模型中提取\n- **System**—数据从模型中提取\n- **Connection**—数据从模型中提取\n- **Coordinate**—数据从模型中提取\n\
  \n**Construction Industry Council (CIC)** 工作组指出，在此阶段收集的信息可能准确度为 75%-80%，容差为 ± 20-25%。\n\
  \n## Construction information\n\n这是在预期 *RIBA Stage 5* 通常需要包含的数据。检查是为了确保上一阶段的设计和规范在功能、成本和碳性能方面与委托方简报一致。\n\
  \n模型现已完全协调，可用于施工，并且可据此生成协调的技术施工图纸。\n\n与上一阶段相比，模型现在代表可建造的技术解决方案，所有承包商的输入已纳入模型。\n\n\
  需要填写的选项卡包括以下内容：\n\n- **Type**\n- **Attribute**—类型、构件、系统、坐标、连接和文档属性的数据更新至施工级别（从模型中提取）\n\
  \nCIC 工作组指出，在此阶段收集的信息可能准确度为 85%-90%。\n\n## Operations and Maintenance Information\n\
  \n这是在预期 *RIBA Stage 6* 通常需要包含的数据。所有这些数据都与运营和管理信息相关。它与制造商和安装调试系统 的分包商提供的运营和详细功能信息相关。\n\
  \n模型现在代表已建成的建筑，并包含所有分包商提供的信息。它包括有关已安装系统和设备的所有信息。\n\n需要填写的选项卡包括以下内容：\n\n- **Job**\n\
  - **Resource**\n- **Spare**\n\n收集信息的准确度预计为 100%。\n\n## Post Occupancy Validation\
  \ Information and Ongoing O&M\n\n此后 occupancy 信息的概念是审查和检查资产实际使用情况。此阶段应用于在所有系统和程序稳定运行后，用最终且最更新的运营数据集更新后\
  \ occupancy 系统。\n\n模型现在代表正在使用的建筑，并包含来自管理团队和已实施系统的所有信息。\n\n## COBie concept\n\nCOBie\
  \ 概念很简单，但交付 COBie 的流程并不总是直接的，因为它取决于 BIM 模型的质量。\n\n组织通常使用 Solibri 或 Autodesk COBie\
  \ Extension for Revit 来生成 COBie 交付成果。Solibri Model Checker 的标志可见于此：\n\n![](img/1961add582dd4a589b2eac3dda140e38_93_0.png)\n\
  \nFigure 2.10 – Solibri Model Checker\n\n您可以在此地址访问 Solibri 网站：`https://www.solibri.com/`。\n\
  \n以下是此处的二维码：\n\n![](img/1961add582dd4a589b2eac3dda140e38_95_0.png)\n\nRevit COBie\
  \ 扩展为每个 Revit 版本提供下载，例如 Revit 2021、2020 等。示例文件和培训材料也可免费在网站上获取。\n\n> **Note**\n>\
  \ Revit COBie 扩展在从 Revit 中的模型组导出 COBie 数据时存在问题。\n\n为了增强关于资产管理的讨论，我们采访了 ActivePLAN\
  \ 的 George Stevenson，他是资产管理流程方面的专家。\n\n## Interview with George Stevenson, Managing\
  \ Director at ActivePLAN\n\nHi George, thank you for the interview.\n\n我们想听听您对资产管理以及该行业的未来的看法。\n\
  \n**您能否介绍一下您自己和您的公司？**\n\n我是受 Xerox 培训的信息管理专家，于 1982 年进入建筑行业。最初，我参与为机电承包商开发估算和计划维护软件，随后发展到数据库驱动的\
  \ CAD 和面向对象的建筑建模（Sonata 和 Reflex，后来成为 Revit）。我创立了英国首个项目外联网/CDE，BIW，现为 Oracle Aconex。\n\
  \n现在，我是 ActivePLAN 的董事总经理，这是一家 20 人的软件和信息管理公司。我们是 Autodesk 开发商，但主要专注于创建基于网络的 BIM\
  \ 应用，用于简报、信息需求，以及可在设计和施工过程中使用的应用，以为资产管理提供更好的信息。更多信息请参见 https://activeplan.co.uk/transforming-construction/。\n\
  \n我们的许多客户都是资产所有者和 FM 承包商，因此我们开发了解决方案，将移交信息转换为填充不同 FM 应用，并提供持久的数字 O&M/AIM。\n\n我们还拥有解决方案，可将现有的\
  \ O&M 转换为符合 BIM 的数据模型——通常为 2D。但如果他们选择投资点云和 3D 模型（也许是设备房），我们会通过与 Forge/BIM 360 和\
  \ 3D Repo 的 API 集成将其包含在内。\n\n数据工程是我们工作的重要部分，我是现称 BuildingSmart 的创始成员之一，并担任 FM 工作组的英国主席。我们一直与\
  \ BRE 合作开发数据字典应用，以创建和管理标准化数据集作为可重用数据模板。这构成了免费平台的基础，该平台正被产品制造商使用——Lexicon。\n\n多年来，我将\
  \ 20% 的时间投入到改善行业的公益倡议中，目前有四个：\n\n- BIM4Housing—主席\n- BIM4HA/HACT Housing Asset Data\
  \ Standards Working Group\n- Golden Thread Initiative—资产信息工作组主席\n- Constructing\
  \ Excellence Collaborative Working Champions\n\n### 建筑师和工程师在施工前和施工后阶段交付资产信息需求的挑战是什么？\n\
  \n资产信息需求很少以与其作者工具集成的形式提供（通常是 PDF 文档）。因此，这往往是手动流程。将需求作为元数据添加到 3D BIM 对象上并不理想，如果他们使用\
  \ IFC 导出数据，则会出现问题，因为他们倾向于使用 2x3，即协调 MVD，而这并非为资产信息而设计。当人们从 Revit 转换为 IFC，导入到联合 IFC\
  \ 模型中，然后再转换回 COBie 时，问题会更加严重——可能出现什么问题？正确使用时，直接从 Revit 使用 COBie 扩展进行原生输出似乎更可靠。\n\
  \n\n\n\n在COBie中建立空间模型对于确保所有资产位置被自动记录至关重要。资产类型通常会在阶段3确定，即使之后发生更改，记录更改前的信息对于资产管理者而言也是宝贵的，因为他们可能需要用设计师最初推荐的产品来替换经过“价值工程”处理但已失效的产品。\n\
  \n## 标准化的客户需求和标准化的产品数据如何提高资产信息交付过程的效率？\n\n这是基础性的。资产信息团队对水泵、风机盘管、门或外墙板的需求在不同行业（住宅、教育、零售、办公和医疗保健）中大体相同。显然，即使在这些行业内，关键程度也存在差异，客户需求需要反映每个项目中不同利益相关者群体的需求。\n\
  \n然而，如果从一套经过同行评审的标准库出发，进行这些修改所需的工作量是微不足道的。通过以机器可读的格式标准化性能要求，使用后评估可以反映设计的有效性，或许还能反映对需求的修改。\n\
  \n同样，制造商可以创建标准化的产品库，纳入客户要求的信息和性能水平，并使其产品更贴合客户需求。\n\n运营效率和环境绩效的成本可以被建模，从而创造更具可持续性的建筑。\n\
  \n简而言之，即使在今天，也很少有建筑能够交付符合目的的资产信息，因为这仍然是一个人工过程，往往被留到时间和成本即将耗尽时才进行。通过从一开始就标准化信息，专职信息经理可以将时间投入到真正需要其技能的方面，而将资产信息的交付留给流程本身。\n\
  \n## 您如何看待COBie的现状和未来发展？COBie是一个长期目标，还是未来可能被以不同方式构建数据的先进技术所取代？\n\n一切都可以改进，但当我们终于让人们理解数据在BIM中与几何体同等重要（甚至更重要）时，我对改变标准感到不安。\n\
  \nCOBie是一种数据模式，其容纳能力远超目前的使用范围。它并不完美，但通过有效利用Attributes，我们可以实现95%的需求。\n\n这里需要明确资产团队“需要”的信息是什么意思。\n\
  \n他们出于不同的原因使用不同的应用程序。例如：\n\n- **CMMS**——计算机化维护管理应用程序，主要用于生成定期/计划维护的工作指令。这通常仅包括O&M中10%的资产。\n\
  - **服务台**——这些支持响应式维护，并且目前有使用CRM应用程序来实现此目的的趋势。\n- **H&S/O&M**——通常是已安装设备的竣工记录及相关文档。虽然要求随着任何变更而保持更新，但很少做到这一点。ActivePLAN将其作为数字O&M或**资产信息模型（AIM）**交付，其中包含所有内容，包括CMMS中的资产类型。\n\
  - **调查与检查**——这些是需要非常聚焦的信息并能够将数据返回AIM的专业移动应用程序。\n- **生命周期管理**——通常在电子表格中完成。\n- **空间管理**——有时称为FM，包括房间预订，通常作为独立应用程序（或模块）与CMMS应用程序一起交付，例如IBM\
  \ Maximo和IBM Tririga。\n- **BMS/数字孪生**——我将它们联系在一起，因为它们都是使用/应用AIM中协调资产数据的方式。\n\n完整的COBie数据模型或Excel工作簿应包含上述每个应用程序/用途所需的全部信息。然而，我们不应期望这些应用程序读取完整的COBie数据模型或工作簿——甚至确实开发一个IFC模块。\n\
  \n即使是那些已经开发出处理COBie方法的大型CMMS应用程序，也会将其转换后导入自己的数据库。因此，将移交的COBie数据放入像ActivePLAN这样的资产信息模型中更有意义，该模型可以保存和管理所有必需的信息，并为不同的CMMS应用程序以及上述所有类型的应用程序生成定制输出。\n\
  \n在“数据服务”的现代世界中，通过确保符合COBie数据模式，Web服务可以提供动态互操作性，使执行防火门检查/维护的承包商——例如——能够在其CMMS应用程序中记录故障，创建“工单”进行维修，并将该资产的状态变化反馈给AIM，以便在整个建筑的背景下评估相应的风险。\n\
  \n我们与BRE正在开展的工作让我们了解了本体的使用，以及如何利用本体为确定需要收集什么以及如何使用这些数据提供背景。与我们合作的数据科学家乐于使用COBie作为数据交换机制——关键是为正确的目的获取正确的数据。\n\
  \n一直有关于从模式中删除“Coordinates（坐标）”的讨论。这确实很可惜，因为资产信息需要“定位”，而不仅仅是引用到一个空间。如果在一个空间内有20个CCTV摄像头，在数据中保存*x/y/z*坐标（即不是单独的几何模型）至关重要。\n\
  \n## 在建筑行业中，整合运营维护（O&M）和资产管理（AM）面临哪些挑战？\n\n我认为资产管理是整体流程，运营和维护是其子流程，同时还包括生命周期规划/更换、小型工程、空间管理、BMS。它们（现在和将来）都由许多应用程序支持，不同的利益相关者出于许多不同的原因使用这些应用程序。如果我们能够克服两个最大的障碍——数据质量（结构、内容、可靠性和时效性）和缺乏投资——这个问题就很容易解决。\n\
  \n后者影响前者。\n\n当资金紧张时，FM通常是第一个被削减的对象。新开发项目的资金往往比安装新的供暖或空调系统的资金更容易获得。即使在PFI项目中，投资设施的重要性已得到充分认识，签订的合同也常常使FM几乎别无选择，只能偷工减料。\n\
  \n即使到今天，也很少有项目能提供关于防火阀和防火封堵位置的可靠信息，那么FM应该如何预算和规划它们的检查、维护和更换呢？\n\n客户很少知道他们的建筑里有什么（在某些情况下，他们甚至不知道他们有多少栋建筑）。FM经常被要求对现有物业的维护进行招标，而关于他们将维护什么的数据却非常不完整。他们可能会委托进行调查（他们通常需要在全新的BIM交付建筑上这样做）。尽管如此，许多他们需要维护的项目对于调查人员来说并不容易看到和记录，因此不会被发现。\n\
  \n## 数字孪生是运营维护（O&M）和资产管理整合的未来吗？\n\n数字孪生是一个被不同的人使用并具有不同含义的术语。我参加了2019年9月在伦敦ICE举行的数字孪生活动，一位来自一级方程式赛车的资深人士解释说，他们已经使用数字孪生20年了——他们过去称之为模拟。\n\
  \n我认为这就是我们应该区分3D模型（即使是带有IoT传感器的模型）和真正的数字孪生的方式，后者能够模拟活动和场景，为更好的资产管理提供信息。\n\nBMS应用程序正变得越来越复杂，并且无疑是这个过程的一部分，人工智能也是如此。\n\
  \n自2018年以来，我们一直在试验AI，以了解如何训练智能体来响应问题或事件。我的商业伙伴Tim Aikin在他的房子里到处安装了传感器，使用ActivePLAN\
  \ AIM作为平台，为自己的数字孪生提供数据。\n\n我们还在试验图数据库，从住宅塔楼获取空间模型，将消防资产分配给系统和空间，并模拟单个资产故障对内部空间和人员的影响。我们的下一步是使用AI创建场景，模拟人们将如何响应事件，以及如何改善环境以使他们更安全。\n\
  \n事实是，所有这些过程都依赖于不断更新的更好的资产信息，并且越多的人出于不同目的连接和使用这些信息，效果就越好。\n\n## Revit和BIM创作工具如何改进以促进资产管理交付过程？云端数据是BIM工具中资产管理的未来吗？\n\
  \n所有应用程序都可以改进以促进这一过程，但我们需要理解，BIM是关于信息的，而不是关于创建信息的应用程序。将资产数据保存在一个主要用于创建3D模型的应用程序中是不明智的。\n\
  \n数据最好在数据库中管理，而云端使这变得更加容易。\n\n可以赋予不同的利益相关者使用和更新信息元素的权利，理想情况下是从他们日常任务中使用的应用程序中进行——不仅仅是3D建模应用程序。\n\
  \nRevit和其他创作应用程序支持API，因此无需将非几何数据添加到3D对象本身。与云服务的动态连接使用户在点击时感觉数据就在模型中。但实际上，它是在其他地方（通常是由对数据进行了质量保证的主题专家）进行管理（和创建）的。\n\
  \n\n\nGeorge，非常感谢您接受采访。\n\n在结束本节之前，我们了解了资产管理在建筑生命周期中的重要性，以及结构化数据对于跨多个设施管理平台集成数据的关键作用。COBie提供了结构化数据，这些数据被用于私人客户和英国政府的战略中，以支持资产管理流程。\n\
  \n在下一节中，我们将学习如何制定行动计划来启动BIM项目。\n\n## 制定行动计划以启动BIM项目\n\n行动计划帮助组织以既定的流程启动BIM项目，以管理项目数据并将目标变为现实，从而避免在设计、施工和建筑生命周期中出现问题。\n\
  \n行动计划将提供一份待完成的任务清单，以实现管理项目数据的初步目标，并且可以提高启动项目时工作流程的效率。\n\n行动计划将包括以下任务，但不限于这些：\n\n\
  - 定义管理项目数据的初始BIM目标\n- 列出为实现目标而需要完成的任务\n- 结合项目截止日期确定关键任务的优先级\n- 确定接收信息的初始项目截止日期\n\
  - 定义完成任务所需的资源\n- 根据要求衡量和评估进度，并更新行动计划\n\n有效的行动计划可以帮助您保持正轨，正确设置BIM项目，并提高管理BIM数据的生产力。\n\
  \n### 管理项目数据的行动计划\n\n该行动计划的主要目标是分析BIM合同要求、降低风险，并收集启动BIM项目所需的全部必要信息。\n\n有时，项目在BEP尚未完全定义的情况下启动，而且您的公司可能不是负责制定BEP的主导指定方。\n\
  \n当BEP完成后，所有指定方都将遵循它来交付项目。\n\n### 列出任务以实现目标\n\n以下任务将有助于确定项目目标，并为建立BIM项目的初始流程提供支持：\n\
  \n- 1. 分析BIM合同要求。\n- 2. 如果客户没有BIM要求，您的公司应在合同中定义标准的BIM交付成果。\n- 3. 与客户和资产管理团队沟通，澄清每一项BIM要求。\n\
  - 4. 向客户索取以下文件：\n    - 组织信息要求（OIR）\n    - 资产信息要求（AIR）\n    - 交换信息要求（EIR）\n- 5. 索取并分析任何遗留文件和测量文件，以及地形测量图（Ordnance\
  \ Survey maps）。\n- 6. 检查并验证收到的信息。\n- 7. 索取或制定BEP，并与其他组织协作。\n- 8. 索取或制定BIM责任矩阵。BIM责任矩阵需要根据设计/施工责任和委任书进行检查。\n\
  - 9. 检查BIM和IT能力评估。\n- 10. 在项目开始时设置或索取主坐标文件，以定义正确的项目坐标。\n- 11. 安排启动会议，详细说明交付项目的所有商定条款。\n\
  \n### 总结\n\n在本章中，我们了解了项目数据管理对于提高效率和生产率的重要性。\n\n我们解释了由客户明确BIM要求的好处，以及客户负责向项目团队提供哪些BIM文件。\n\
  \n我们概述了面向客户、项目团队和行业标准的BIM文档。\n\n您还了解了BIM项目中涉及的项目职能、资产管理的重要性，以及如何制定行动计划来启动BIM项目。\n\
  \n在下一章中，我们将介绍良好的Revit模板和制图标准如何提高生产率。\n"
- "## Revit模板与标准\n\nRevit中的生产率与项目中使用的**Revit模板**质量直接相关，包括行业和组织标准。\n\nRevit模板有助于提高在Revit中工作的效率，您的公司将受益于跨项目的一致性。\n\
  \n这些模板通过预定义标准节省了大量时间，因此Revit用户无需为每个新项目重新创建或调整Revit设置。\n\n随着行业标准的发展，Revit模板需要修订以纳入最新进展。\n\
  \n2019年1月，BS EN ISO 19650-1和BS EN ISO 19650-2发布，取代了BS 1192:2007+A2:2016和PAS 1192-2:2013。这意味着Revit模板需要做出与新的ISO\
  \ 19650系列相一致的更改。\n\nRevit模板可以针对多个专业创建，例如建筑、结构和MEP，也可以针对特定用途进行自定义，例如测量和其他用途。\n\n\
  在本章中，您将学习如何创建Revit模板并管理其图形设置，以改进在Revit中创建的图纸。这将包括关于视图模板以及如何自定义标题栏的信息。\n\n在本章中，我们将介绍以下主题：\n\
  \n- 如何创建Revit模板\n\n### 技术要求\n\n在本章中，您需要访问Autodesk Revit。用于描述所有这些练习的版本是Revit 2021，但您也可以使用其他版本进行学习。需要考虑以下重要事项：\n\
  \n- 不同版本之间可能会略有差异。\n- 较旧版本的Revit无法打开较新版本的文件。\n\n本章使用的所有数据集都可以在本书的GitHub仓库中找到：https://github.com/PacktPublishing/-Increasing-Autodesk-Revit-Productivity-for-BIM-Projects。\n\
  \n### 如何创建Revit模板\n\nRevit模板可确保项目的一致性并提高生产率。它们通过定义符合组织标准和行业标准的图形和技术设置来实现这一目标。\n\n\
  Revit模板并非一成不变；随着我们根据新标准和工作流程进行调整，它将为持续发展而不断改进。\n\n您可能已经知道，Autodesk每年发布一个新Revit版本。然而，为多个版本更新Revit模板可能非常耗时。\n\
  \n为了避免在不同Revit版本中创建和更新多个Revit模板，我们建议您在相同的Revit版本中保留模板几年；这可能在3到4年之间变化。我们还建议您每5年从头重新创建模板。\n\
  \n为了解释这个过程，假设您的公司有一个Revit 2021版本的Revit模板。这个2021版本的Revit模板将使用3到4年，在此期间根据需要更新。\n\n\
  当Autodesk发布Revit 2025时，您的公司将从头重新创建Revit模板，其中将包含过去5年的所有重大变化。\n\n在此工作流程中，您的公司将能够使用任何Revit版本（从Revit\
  \ 2021起）。但是，当新项目启动时，Revit 2021模板将升级到特定的Revit版本。\n\n在**Revit选项**中，您可以更改**Revit模板路径**并根据需要进行更新：\n\
  \n![](img/1961add582dd4a589b2eac3dda140e38_109_0.png)\n\n![](img/1961add582dd4a589b2eac3dda140e38_109_1.png)\n\
  \n图3.1 - 更改Revit模板路径\n\n在本书*第3章*的数据集中，您将找到一份需要在Revit模板上更新项的检查清单。该文件是`Revit_Template_Check_List.xlsx`：\n\
  \n![](img/1961add582dd4a589b2eac3dda140e38_110_0.png)\n\n您可以使用以下链接下载本书数据集的ZIP文件：\n\
  \n```\nhttps://github.com/PacktPublishing/-Increasing-Autodesk-Revit-Productivity-for-BIM-Projects/blob/main/Chapter%203/Revit_Template_Check_List.xlsx\n\
