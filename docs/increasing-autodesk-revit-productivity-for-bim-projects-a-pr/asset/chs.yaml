  \ Profile: linkedin.com/in/froberti\n\nTwitter: @F_Roberti_\n\n![](img/1961add582dd4a589b2eac3dda140e38_5_0.png)\n\
  \n**Decio Ferreira**\n\n**Decio Ferreira**, with over 20 years of professional experience\
