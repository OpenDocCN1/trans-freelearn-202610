  - *第 1 章，Revit 工作效率入门*

  - *第 2 章，项目数据管理*

  - *第 3 章，Revit 模板与标准*


  在这些章节中，您将了解 Revit 工作效率的基本概念，以及如何以正确的信息和良好的 Revit 模板启动 Revit 项目的最佳实践。


  将探讨以下主题：


  - 结合信息管理原则与 Revit 最佳实践

  - 推荐的 Revit 设置

  - BIM 实施概述

  - 启动 BIM 项目的关键数据

  - 委任与 BIM 文档概述

  - 制定启动 BIM 项目的行动计划

  - 创建 Revit 模板

  - 管理图形标准

