  \nhttps://www.shapespark.com\n\n总而言之，我们了解了多种管理 Revit 插件的流程，以避免出现问题并提升性能。我们还列出了一些最实用的\
  \ Revit 插件，用于提高日常任务和可视化工作的生产效率。\n\n## 总结\n\n在本章中，我们了解到 Revit 插件仅适用于完整版本的 Revit，并且易于在日常任务中实施和使用。\n\
  \n我们介绍了如何管理 Revit 插件，以完成以下任务：\n\n- 通过 Revit Autodesk App Store 访问插件\n- 安装流程\n- 检查插件的安全性\n\
  - 移除插件\n- 为 Revit 测试启用和禁用插件\n- 了解插件的创建方式\n\n插件通过新增功能增强了 Revit 的能力，可以节省大量时间。\n\n\
  我们还了解了一些出色的插件，它们被广泛用于提高生产效率和性能、实现 BIM 模型可视化，或创建精彩的渲染图和视频。我们可以从 Revit Autodesk App\
  \ Store 和开发者网站下载大量免费和付费插件。\n\n下一章将进一步介绍如何提升 Revit 的性能。\n\n\n\n\n"
- "## 10 提升性能\n\n承接自 *第1章 Revit 生产力简介* 以来我们所描述的内容，我们希望以同样的主题结束这段旅程：通过分享在 BIM 项目中使用\
  \ Revit 工作时的最佳实践，来提升生产力和性能。\n\n在所有章节提供的综合知识基础上，我们现在完成了我们的目标——改变你在 Revit 中执行日常任务时的生产力。\n\
  \n本章将提供额外的最佳实践，以提升 Revit 的性能并提高你在执行日常任务时的生产力。\n\n我们将解释管理 CAD 导入以及视图和图纸的最佳实践，以及其他提升生产力的任务。\n\
  \n本章还将提供有关 Revit 内容管理的信息以及优化 Revit 性能的额外任务，包括检查警告和审核 Revit 文件。\n\n![Figure 10.1\
  \ – Import CAD](img/1961add582dd4a589b2eac3dda140e38_441_0.png)\n\n**Tip**\n\n我们可能需要\
  \ Revit 插件或 Dynamo 脚本来查找导入的 CAD 文件。\n\n应使用以下建议以避免降低 Revit 中的性能：\n\n- 在工作共享环境中工作时，确保所有导入/链接的\
  \ CAD 文件都放置在正确的 workset 中。\n- 应避免导入 CAD 文件。\n- 链接 CAD 文件应限制在最低限度。\n- 在导入或链接 CAD\
  \ 文件之前，确保其已清理并清除，并且仅显示项目所需的內容。\n- 不建议使用大于 10 MB 的 CAD 文件。\n- 确保你保留真正需要的链接 CAD 文件。\n\
  - 确保所有文件都有正确的链接（找不到的链接会使打开、保存和同步文件花费更长时间）。在“管理链接”中，我们可以找到链接状态。\n- 在使用导入和/或链接的 CAD\
  \ 文件时，务必在 AutoCAD 中使用 Zoom Extents，以确保我们没有模型远处的元素（如果发生这种情况，应编辑 CAD 文件以删除不必要的元素）。\n\
  - 在导入和/或链接 CAD 文件之前，请确保文件中的所有对象都使用 Linetype 和 Colour 作为 ByLayer，这样可以从 Revit 编辑这些属性。\n\
  - 根据项目情况，我们建议创建一个 Revit 模型来链接所有需要的 CAD 文件。\n- 我们绝不应在 Revit 项目中炸开 DWG 文件。\n- 当在 CAD\
  \ 软件中以 **Index Colours** 设置 CAD 元素时，在导入过程中定义线宽是可能的。**Line Weight** 设置应在导入和/或链接之前通过点击\
  \ **Import Line Weights** 选项进行定义：\n\n  ![Figure 10.2 – Import Line Weights settings](img/1961add582dd4a589b2eac3dda140e38_442_0.png)\n\
  \n- 链接 DWG 时，尽可能使用 **Current view only**。将 DWG 导入 Revit 时，可以将其作为 3D 元素（在 3D 中可见）或\
  \ 2D 元素（导入或链接时仅在当前视图中可见）。通过选择此选项，链接文件将被展平到当前视图，并且对整体模型的影响会更小：\n\n  ![Figure 10.3\
  \ – Linking CAD format options](img/1961add582dd4a589b2eac3dda140e38_442_1.png)\n\
  \n- CAD 导入用于创建构件细节的 Detail Components。当创建 **Detail Items** 族时，不可能链接 CAD 文件，我们只能导入\
  \ CAD 文件。如前所述，我们可以在导入 DWG 文件之前控制线宽：\n\n  ![Figure 10.4 – Importing CAD files into\
  \ detail item families](img/1961add582dd4a589b2eac3dda140e38_442_2.png)\n\n### 关闭隐藏窗口\n\
  \n打开太多视图会影响性能。建议保持打开的视图数量最少。可以通过访问视图选项卡并点击 **Close Inactive** 来关闭视图：\n\n![Figure\
  \ 10.6 – Closing inactive views](img/1961add582dd4a589b2eac3dda140e38_444_0.png)\n\
  \n### 删除不必要的视图和图纸\n\n通过删除不必要的视图和图纸，将改善文件大小和性能。\n\n如果 Revit 文件有太多图纸且整体文件大小无法减小，我们可能需要将模型拆分为两个卷，并将模型上的图纸数量分开以减小文件大小。\n\
  \n### 远裁剪剖面和立面\n\n在处理剖面或立面时，**Far Clipping** 区域应根据需要最小化。这将提高性能，因为视图中被其他元素隐藏的几何图形在重新生成视图时不会受到影响。\n\
  \n此选项可以通过两种不同的方式控制：\n\n- 在楼层平面图上进行剖面或立面时，通过控制剖面或立面符号被选中时的深度：\n\n  ![Figure 10.7\
  \ – Section view depth controllers](img/1961add582dd4a589b2eac3dda140e38_444_1.png)\n\
  \n- 在剖面视图中，我们可以访问属性，更改 Far Clipping 设置，并定义精确的 Far Clip Offset 值：\n\n  ![](img/1961add582dd4a589b2eac3dda140e38_445_0.png)\n\
  \n### 在楼层平面图上查看范围\n\n与 Far Clipping 类似，在楼层平面图上有一个参数可以控制视图深度：View Range。\n\nView\
  \ Range 控制视图深度，影响将显示多少元素，从而影响性能：\n\n![](img/1961add582dd4a589b2eac3dda140e38_445_1.png)\n\
  \n通过点击 << Show 按钮，可以查看所有可配置的参数：\n\n![Figure 10.10 – View Range options](img/1961add582dd4a589b2eac3dda140e38_446_0.png)\n\
  \n### 3D 视图中的剖面框\n\n在 3D 视图中工作时，剖面框将减少显示区域，从而提高性能。\n\n要激活它，在属性调色板中勾选 Section Box\
  \ 参数，剖面框将变得可见：\n\n![Figure 10.11 – Section box](img/1961add582dd4a589b2eac3dda140e38_446_1.png)\n\
  \n选择后，可以使用箭头更改剖面框形状以裁剪不需要的部分：\n\n![Figure 10.12 – Manipulating a section box](img/1961add582dd4a589b2eac3dda140e38_447_0.png)\n\
  \n> **Tip**\n>\n> 如果 **Section Box** 不可见，请确保该类别是可见的。\n\n一种快速创建与特定视图对齐的剖面框的方法是右键单击视图立方体，并在\
  \ **Orient to View** 下选择要对齐的视图并制作 3D 视图：\n\n![Figure 10.13 – Aligning a 3D view\
  \ to a specific view](img/1961add582dd4a589b2eac3dda140e38_447_1.png)\n\n选择特定视图后，我们需要旋转\
  \ 3D 视图以可视化剖面框。\n\n另一种快速在特定区域或对象上创建剖面框的方法是使用 **Selection Box** 工具：\n\n1. 进入一个视图并选择要在\
  \ 3D 视图中看到的元素。\n2. 在 **Modify** 选项卡中，点击 **Selection Box**（快捷键 BX）：\n\n   ![Figure\
  \ 10.14 – The Selection Box feature](img/1961add582dd4a589b2eac3dda140e38_448_0.png)\n\
  \n3. Revit 创建一个 3D 视图，其中选中的元素位于剖面框中：\n\n   ![Figure 10.15 – 3D view with a section\
  \ box defined](img/1961add582dd4a589b2eac3dda140e38_448_1.png)\n\n### 开启/关闭不需要的类别\n\
  \n在特定视图中关闭不需要的类别将提高在打开或进行任何更新时重新生成视图的速度。建议访问 **Visibility/Graphics Overrides** 参数（快捷键\
  \ VV 或 VG）并将其切换为关闭：\n\n![Figure 10.16 – Visibility/Graphics Overrides from a view](img/1961add582dd4a589b2eac3dda140e38_449_0.png)\n\
  \n当我们需要控制多个视图的相同可见性和图形时，建议使用视图模板。\n\n视图模板可以通过访问 **Properties** 调色板并更改 **View Template**\
  \ 设置来分配给特定视图：\n\n![Figure 10.17 – Defining a view template to the view](img/1961add582dd4a589b2eac3dda140e38_449_1.png)\n\
  \n> **Tip**\n>\n> 视图模板可以通过访问 **View** 选项卡 | **View Templates** 来控制。\n\n不建议在视图中隐藏单个元素。通过这种方式进行操作将很难找到这些元素。用户应始终在视图模板中使用筛选器来隐藏它们，如果可能的话。\n\
  \n当我们分配了视图模板时，可以使用 **Temporary View Properties** 选项，因为这将允许用户在不移除已分配的视图模板的情况下更改可见性/图形设置，然后将其恢复到之前定义的状态。\n\
  \n\n\n\n\n让我们按以下步骤来更好地理解其工作原理：\n\n- 1. 打开一个已指定视图模板的视图。\n- 2. 在“视图控制”栏中，单击“临时视图属性”，然后选择“启用临时视图属性”：\n\
  - 3. 视图周围将出现一个紫色矩形框，表示“临时视图属性”已启用：\n- 4. 根据需要访问所有视图属性。\n- 5. 如需恢复原状，请在“临时视图属性”选项下，单击“恢复视图属性”。\n\
  \n![](img/1961add582dd4a589b2eac3dda140e38_450_0.png)\n\n图 10.18 – 启用临时视图属性\n\n\
  ![](img/1961add582dd4a589b2eac3dda140e38_450_1.png)\n\n图 10.19 – 临时视图属性已启用\n\n##\
  \ 图形显示选项\n\n建模时，为视图指定的详细程度会影响性能，因为 Revit 可能需要显示/隐藏更多细节以呈现视图，从而需要更多资源来重新生成任何更改或更新：\n\
  \n![](img/1961add582dd4a589b2eac3dda140e38_451_0.png)\n\n图 10.20 – 指定给视图的详细程度\n\n\
  建议在建模时使用“粗略”视图。\n\n提示\n此设置可能已指定给某个视图模板，在这种情况下，更改选项将被禁用。\n\n阴影设置也应考虑同样的原则；如果不需要，应将其关闭：\n\
  \n![](img/1961add582dd4a589b2eac3dda140e38_451_1.png)\n\n图 10.21 – 打开/关闭阴影\n\n与“视图显示设置”相关的另一个重要设置是指定的视觉样式，越简单越好：\n\
  \n![](img/1961add582dd4a589b2eac3dda140e38_451_2.png)\n\n图 10.22 – 视觉样式定义\n\n##\
  \ 光栅图像\n\n光栅图像会影响 Revit 的性能，我们可以通过两种方式找到它们：\n\n- - 在“插入”选项卡中，使用“链接图像”或“导入图像”选项：\n\
  \n![](img/1961add582dd4a589b2eac3dda140e38_452_0.png)\n\n图 10.23 – 插入或链接光栅图像\n\n\
  - - 在 Revit 中渲染视图并将视图保存到浏览器中时：\n\n![](img/1961add582dd4a589b2eac3dda140e38_452_1.png)\n\
  \n图 10.24 – 将渲染结果以图像形式保存到项目浏览器\n\n无论使用上述哪种方式导入光栅图像，都应考虑以下建议：\n\n- - 只保留所需的图像，删除其他图像。\n\
  - - 确保图像具有适中的分辨率（应考虑使用更小、更简化的图像）。\n\n通过访问“插入”选项卡下的“管理链接”，可以控制链接的内容：\n\n![](img/1961add582dd4a589b2eac3dda140e38_453_0.png)\n\
  \n图 10.25 – 管理链接 – 图像\n\n## 将启动视图设置为二维视图\n\n打开模型时，建议将较简单的视图定义为启动画面，这样可以使打开过程更轻松、更快速。\n\
  \n启动视图可以在“管理”选项卡的“管理项目”下定义；单击“启动视图”：\n\n![](img/1961add582dd4a589b2eac3dda140e38_453_1.png)\n\
  \n图 10.26 – 定义启动视图\n\nRevit 将显示模型中所有可用视图的列表。选择为启动画面创建的二维视图，该视图包含有关项目的信息：\n\n![](img/1961add582dd4a589b2eac3dda140e38_454_0.png)\n\
  \n图 10.27 – 选择启动视图\n\n建议使用一个可以显示相关项目信息的视图，例如：\n\n- - 项目名称\n- - 客户名称\n- - 设计顾问名称\n\
  - - 设计专业\n- - 项目信息管理员\n- - 任务信息管理员\n- - 合适的代码与说明\n\n这将使所有用户都能了解项目的概况。\n\n## 建模\n\
  \n在前几章中，我们已经了解了在 Revit 中提高工作效率和性能的许多方面。建模时，用户需要注意许多因素，我们重点强调了以下几个对性能和生产力影响最大的因素。\n\
  \n## 删除未使用的设计选项\n\n在设计过程中，开发多个*设计选项*是相当常见的。这些设计选项可以位于特定区域、整个幕墙或其他重要的项目区域。\n\n许多设计选项会影响\
  \ Revit 的性能，并使文件变慢。我们建议采取以下任务来避免性能下降：\n\n- - 考虑使用单独的文件来设计不同的设计选项；如果该选项代表项目中的大片区域，这一点尤为重要。\n\
  - - 不同的设计选项可以放置在不同的工作集中。\n- - 如果设计选项在项目中仍处于活动状态，请保留它们。\n- - 与顾问交换模型时，请确保删除设计选项，或仅保留所需的选项。\n\
  - - 删除设计选项时，确保删除与该选项相关的所有视图。\n\n作为良好实践，需要检查和管控设计选项。\n\n## 清理\n\n清理模型对于将文件大小降至最低至关重要。作为参考，单个模型的最大体积应约为\
  \ 250 MB/300 MB。\n\n运行清理命令后，Revit 将删除未使用的内容。要访问该命令，请执行以下步骤。\n\n- 1. 在**管理**下，单击**清理未使用项**：\n\
  \n![](img/1961add582dd4a589b2eac3dda140e38_455_0.png)\n\n图 10.28 – 清理未使用项\n\n- 2.\
  \ 单击**全部不勾选**。\n\n3. 在清理列表中，展开需要清理的类别，勾选需要删除的族和/或实例：\n\n![](img/1961add582dd4a589b2eac3dda140e38_456_0.png)\n\
  \n图 10.29 – 要删除的图元\n\n4. 单击“确定”开始清理项目中的这些项目。\n\n此命令可能需要执行多次才能完全清理项目。\n\n## 模型线\n\
  \n模型线是出现在三维空间中的线，在所有视图中都可见。应避免使用这些线，因为它们可能被误用在图纸上。当需要这些线时，建议使用详图线（仅在当前视图中可见）。\n\n\
  如果模型线需要转换为详图线（反之亦然），Revit 提供了相应的工具。选择**模型线**后，在**修改**工具下，您会看到一个名为**转换线**的功能：\n\n\
  ![](img/1961add582dd4a589b2eac3dda140e38_457_0.png)\n\n图 10.30 – 转换线\n\n根据您选择的线，Revit\
  \ 将在**模型线**和**详图线**之间切换。\n\n总而言之，我们学习了 CAD 导入、视图和图纸管理的最佳实践，以及建模过程中提高性能的其他流程。\n\n\
  在下一节中，我们将学习与 Revit 内容创建相关的最佳实践。\n\n## Revit 内容管理\n\n在开发或使用族时，应考虑若干建议，以保持 Revit 模型体积较小并提高性能。\n\
  \n在*第 1 章“Revit 中的生产力简介”*中，我们提供了族创建的建议，但这里还有其他的建议需要强调。\n\n虽然我们应该遵循这些建议，但在项目过程中有时我们并不能\
  \ 100% 遵循。如果不是，我们应该以适度的方式使用它们。\n\n## 第三方族\n\n供应商提供的 Revit 族可能包含大量公式和许多几何细节。\n\n\
  较大的族文件以及项目中放置的多个实例将影响性能，并导致 Revit 变慢。\n\n以下截图显示了一个包含许多公式和参数的 Revit 族：\n\n![](img/1961add582dd4a589b2eac3dda140e38_458_0.png)\n\
  \n图 10.31 – 族中使用的公式\n\n除了这个问题，它可能还导入了不同 CAD 格式且包含过多细节的内容，这些细节在特定项目阶段是不必要的，其中一些细节甚至在图纸中都不可见。\n\
  \n## 过度建模的族\n\n这是一个普遍存在的问题，因为供应商开发的族带有过多的大多数设计阶段都用不到的细节，例如螺钉和螺栓。\n\n以下截图显示了一个对大多数设计阶段来说包含不必要细节的族：\n\
  \n![](img/1961add582dd4a589b2eac3dda140e38_459_0.png)\n\n图 10.32 – 过度建模的天窗\n\n通常，它们被过度建模，需要简化族，因为单个文件可能达到\
  \ 5 MB、10 MB 甚至 50 MB（取决于公式、CAD 导入、详图绘制和嵌套族）。\n\n回顾*第 1 章“Revit 中的生产力简介”*，Revit\
  \ 族应遵循以下文件大小：\n\n- - Revit 族文件大小为 250 KB 到 500 KB，表示文件大小合适。\n- - Revit 族文件大小超过 1\
  \ MB（1,000 KB），应审查是否可能减小大小。\n- - Revit 族文件大小超过 2 MB（2,000 KB），绝对应审查。\n- - 嵌套族文件的大小往往更大，因此我们需要检查较大的族文件。不建议超过两级的嵌套族。\n\
  \n## 导入到族中的 CAD 格式\n\n所有导入内容都应减少到最少，因为它们会直接影响性能。其中一些几何体可以使用网格或制造软件（如 **Inventor**\
  \ 或 **SolidWorks**）创建（这些模型通常过度详细，因为它们包含制造所需的所有信息）。\n\n\n\n\n\n## 避免复杂的形体建模\n\n由“融合”“扫掠”和“融合扫掠”命令创建的复杂几何图形可能会影响项目性能和族文件大小。如有可能，请适度使用它们。\n\
  \n## 定义图元可见性设置\n\n创建族时，始终建议在几何图形上定义可见性设置，避免族在特定视图中被过度建模。这可以通过指定“粗略”“中等”和“精细”三级细节来实现：\n\
  \n![](img/1961add582dd4a589b2eac3dda140e38_460_0.png)\n\n在此窗口中，还可以在任意三维视图类型上设置所有这些细节级别：平面视图、RCP（天花板反射平面）、立面视图、剖面视图和三维视图。\n\
  \n## 族的弯曲测试\n\n在开发 Revit 族时，强烈建议在将族载入项目之前始终进行弯曲测试。通过这种方式，用户将确保添加到几何图形中的所有参数都能按预期行为运行，并且不会导致族破坏：\n\
  \n完成族的弯曲测试后，用户可以将预览可见性设置为关闭，或者直接保存并关闭族。\n\n总而言之，我们了解了 Revit 内容管理的最佳实践，以及通过保持文件较小来维持\
  \ Revit 性能的基本要点。\n\n在下一节中，我们将学习自定义 Revit 快捷键以及其他优化 Revit 性能的主题。\n\n## 优化 Revit 性能\n\
  \n尽管项目变得越来越复杂，但技术的进步速度并未同步跟上，因此我们必须采取相应措施来提升性能。\n\n在本节中，我们将学习优化 Revit 性能的其他方面，包括以下内容：\n\
  \n- 键盘快捷键\n- 警告\n- 压缩 Revit 文件\n- 审计 Revit 文件\n- 禁用 Revit 插件\n\n## 键盘快捷键\n\n使用键盘快捷键可以加快用户的工作效率，因为可以为最常用的命令自定义特定的快捷键。同一个工具可以有多个快捷键。\n\
  \n## 添加快捷键\n\n让我们通过以下步骤了解如何创建新快捷键：\n\n1. 在“视图”选项卡的“用户界面”下，单击“键盘快捷键”：\n\n![](img/1961add582dd4a589b2eac3dda140e38_463_0.png)\n\
  \n> **提示**\n> \n> 可以通过输入 KS 来访问**键盘快捷键**窗口。\n\n2. 使用**搜索**栏和**过滤器**下拉菜单，选择要为其指定新快捷键的命令。\n\
  \n3. 在“按新键”下，添加快捷键并单击“指定”：\n\n![](img/1961add582dd4a589b2eac3dda140e38_464_0.png)\n\
  \n图 10.37 – 键盘快捷键指定\n\n4. 指定完所有需要的快捷键后，单击“确定”。\n\n当为特定工具指定快捷键后，将鼠标悬停在功能区的每个工具上时，会弹出一个工具提示，显示已指定的快捷键：\n\
  \n![](img/1961add582dd4a589b2eac3dda140e38_464_1.png)\n\n图 10.38 – 键盘快捷键工具提示\n\n\
  ## 移除快捷键\n\n移除快捷键的过程与此前介绍的类似。要移除任何快捷键，请执行以下步骤：\n\n1. 选择要移除的快捷键。\n2. 选择**移除**：\n\n\
  ![](img/1961add582dd4a589b2eac3dda140e38_465_0.png)\n\n图 10.39 – 移除键盘快捷键\n\n## 导入/导出快捷键\n\
  \n当为工具指定不同的快捷键时，建议导出这些设置，以确保它们可以在任何其他计算机上使用，甚至可以在未来版本的 Revit 中导入。\n\n在上一个截图中，我们可以单击**导入...**或**导出...**按钮，导入或导出包含所有快捷键的\
  \ .xml 文件。\n\n创建快捷键后，.xml 文件将保存在 C:\\ProgramData\\Autodesk\\RVT 2021\\UserDataCache\
  \ 文件夹下。\n\n## 警告\n\n在 Revit 中工作时，常见的现象是出现多种类型的 Revit 警告。其中一些可以忽略，但另一些更可能导致性能问题，应尽可能修复。\n\
  \n一个好的策略是按优先级对 Revit 警告进行分类，并确定应首先解决哪些警告。\n\n我们可以按以下术语对 Revit 警告进行分类：\n\n- 高优先级\n\
  - 中优先级\n- 低优先级\n\n## 高优先级\n\n这将包括以下警告：\n\n- 在同一位置存在相同实例，这意味着我们有族相互重叠。\n- 一个或多个梯段的实际梯段宽度小于楼梯类型中指定的最小梯段宽度。\n\
  - 楼梯的实际踏板深度小于楼梯类型中指定的最小踏板深度。\n- 多个房间位于同一封闭区域内。\n- 图元具有重复的类型标记值。\n- 导入的几何图形延伸超过 20\
  \ 英里（33 公里）。\n\n## 中优先级\n\n这将包括以下警告：\n\n- 高亮显示的墙相互重叠。当 Revit 查找房间边界时，其中一堵墙可能会被忽略。\n\
  - 插入与连接的墙冲突。\n- 房间未处于正确封闭的区域中。\n- 房间标记位于其房间之外。\n\n## 低优先级\n\n这将包括以下警告：\n\n- 墙和房间分隔线重叠。\n\
  - 房间分隔线相互重叠。\n- 草图线略微偏离轴线，可能会导致不精确。\n- 线略微偏离轴线，可能会导致不精确。\n- 高亮显示的图元已连接但未相交。\n\n\
  警告与模型开发过程中可能发生的某些操作或建模问题相关。例如，如果在现有房间分隔线上方再建模一条，Revit 会弹出警告通知用户：\n\n![](img/1961add582dd4a589b2eac3dda140e38_467_0.png)\n\
  \n图 10.40 – Revit 警告\n\n要访问模型中的所有警告，请按照以下步骤操作：\n\n1. 在**管理**选项卡上，单击**警告**：\n\n![](img/1961add582dd4a589b2eac3dda140e38_467_1.png)\n\
  \n图 10.41 – 保存在模型中的警告\n\n2. 展开警告，可以确认模型中有多少警告：\n\n![](img/1961add582dd4a589b2eac3dda140e38_468_0.png)\n\
  \n图 10.42 – 保存在模型中的警告数量\n\n3. 选择警告后，可以选择以下选项：\n\n- **显示**：允许 Revit 打开视图以显示与警告相关的问题\n\
  - **更多信息**：允许用户获取有关警告的更多信息\n- **删除已勾选项...**：允许用户删除与问题相关的所选图元\n- **导出...**：使用户能够将所有警告列表导出到\
  \ Excel 电子表格\n\n通过访问“警告”窗口，除了删除其中一个警告图元外，无法自动修复警告。为此，用户需要关闭窗口，然后根据要求手动解决警告。\n\n\
  4. 单击“关闭”关闭窗口。\n\n在警告对话框中，我们可以找到可用于查找警告的对象 ID：\n\n![](img/1961add582dd4a589b2eac3dda140e38_469_0.png)\n\
  \n图 10.43 – 按 ID 选择图元\n\n应定期检查并修复警告。\n\n## 压缩 Revit 文件\n\n保存 Revit 模型时，可以压缩文件以减小大小，因为这会重新写入整个文件。它会尝试删除旧的过时部分，从而减小文件大小。\n\
  \n请按照以下步骤压缩文件：\n\n1. 转到“文件”并选择“另存为”。\n2. 在“另存为”下，单击“项目”：\n\n![](img/1961add582dd4a589b2eac3dda140e38_469_1.png)\n\
  \n图 10.44 – 保存 Revit 项目\n\n3. 单击**选项...**。\n4. 在**文件保存选项**下，勾选**压缩文件**：\n\n![](img/1961add582dd4a589b2eac3dda140e38_470_0.png)\n\
  \n图 10.45 – 压缩文件选项\n\n5. 单击**确定**。\n6. 单击**保存**。\n\n如果我们在工作共享环境中（中心文件和本地文件）处理 Revit\
  \ 文件，也可以压缩 Revit 文件。在同步过程中，我们可以压缩文件：\n\n![](img/1961add582dd4a589b2eac3dda140e38_471_0.png)\n\
  \n图 10.46 – 压缩文件选项\n\n## 审计 Revit 文件\n\n审计功能可以维护 Revit 模型的健康状况，因为它会尝试修复模型中的某些问题。它将扫描、检测并修复模型中损坏的图元或信息。此审计过程也可用于族。\n\
  \n我们建议每周对模型进行一次审计。如果我们将 Revit 模型升级到新版本的 Revit，则应运行审计过程。\n\n审计过程是静默的，用户不会获得有关已执行操作的任何反馈或报告。要启动该过程，请按照以下步骤操作：\n\
  \n1. 确保需要审计的模型已关闭。\n\n> **提示**\n> 如果模型位于工作共享环境中，建议指示所有用户关闭该模型。\n\n\n\n\n2. 转到“文件”并单击“打开”：\n\
  \n![](img/1961add582dd4a589b2eac3dda140e38_472_0.png)\n\n图 10.47 – 打开 Revit 模型\n\
  \n3. 选择要打开的文件。\n\n4. 勾选“审核”选项。系统会弹出一条审核警告，提示我们该操作可能需要很长时间：\n\n![](img/1961add582dd4a589b2eac3dda140e38_473_0.png)\n\
  \n图 10.48 – 审核 Revit 模型\n\n5. 单击**“是”**以确认并继续。\n6. 单击**“打开”**。\n\nRevit 开始打开模型，根据文件的大小和复杂程度，此过程可能需要一些时间。\n\
  \n## 在 Revit 中禁用插件\n\n在完成所有用于提升性能的操作后，值得检查一下 Revit 插件是否影响了性能。\n\n在第 9 章*使用插件提高工作效率*中，我们解释了如何管理\
  \ Revit 插件，以便出于测试目的安装和卸载它们。\n\n如果需要禁用插件，请参阅第 9 章*使用插件提高工作效率*，我们在该章中介绍了手动或使用插件停用它们的过程。\n\
  \n建议只使用由 Autodesk 认证的公司开发的插件。\n\n## BIM 360 最佳实践\n\nBIM 360 是由 Autodesk 开发的基于云的设计协作平台，允许项目团队和所有利益相关者使用通用平台开发项目。\n\
  \nBIM 360 是 Autodesk Construction Cloud 的一部分，包含多个具有不同功能的模块。Autodesk Construction\
  \ Cloud 是一系列应用程序的集合，可在所有设计、施工和运营阶段实现卓越的协作与协调。\n\n它集成了以下七个不同的模块：\n\n- **文档管理**：允许在实时且可访问的平台上共享、查看和管理所有施工图纸、文档和模型，确保所有文档始终可供所有设计团队访问并保持更新。\n\
  - **施工管理**：允许捕获和共享施工现场的情况，并与项目中的所有利益相关者一起查看和管理这些情况。\n- **协作**：允许用户使用集成的问题管理工作流自动执行冲突检测流程，并与所有团队成员共享所有问题。\n\
  - **协作专业版**（以前称为**设计**）：允许用户直接使用存储在云端（*文档管理*）中的 Revit（云协作）、Civil 3D 和 Plant 3D 模型，并通过创建可供项目中任何利益相关者接受的交换包来自动共享这些模型。\n\
  - **布局**：允许用户共享可在施工现场使用的项目信息，从而提高准确性、节省时间、加快执行速度、提高质量并减少错误。\n- **运维**：允许用户将 BIM\
  \ 资产数据与模型连接，以实现更好、更全面的设施管理。\n- **计划**：允许用户使用精益施工原则制定并共享生产计划。\n\n用户应考虑以下一些最佳实践：\n\
  \n- **互联网连接**应至少具有 5 Mbps（最低）至 15 Mbps（性能）的带宽，用于上传和下载。\n- 针对特定目的（查看、协调、图纸修订等），在\
  \ BIM 360 中设置要共享的适当视图，并在**“发布设置”**下定义要发布的视图。只需选择应发布的视图和图纸（如果视图过多，发布模型时会花费更多时间，因为\
  \ BIM 360 需要创建视图）。\n- 正确设置项目中心对于建立清晰易懂的工作流程至关重要。强烈建议按照 ISO 19650 进行设置，定义 WIP 区域、共享区域、已发布区域和归档区域。\n\
  - 应使用 Autodesk Desktop Connector 来链接非云端共享模型。（请注意，发布模型时，BIM 360 会将来自 Desktop Connector\
  \ 或任何本地服务器的所有链接推送到云端。）\n- 发布模型之前，请确保没有不必要的链接。\n- 交换包时，请确保采用适当的命名约定来重命名该包。它应包含 ISO\
  \ 19650 中引用的合适代码。\n\n总而言之，我们学习了如何管理快捷键、控制 Revit 警告、压缩 Revit 文件、审核模型文件以及禁用 Revit\
  \ 插件以提高性能。\n\n我们还解释了 BIM 360 平台是什么，并分享了使用 BIM 360 时的一系列最佳实践。\n\n## 总结\n\n在本章中，你学习了\
  \ Revit 建模最佳实践，包括管理 CAD 导入、管理视图和图纸，以及通过其他任务来提高工作效率，并学习了管理设计选项、清理过程和模型线。\n\n我们解释了如何管理\
  \ Revit 内容并执行其他任务以提高工作效率。我们还学习了额外的技巧，通过查看警告、压缩 Revit 文件以及审核 Revit 文件来优化 Revit 性能。\n\
  \n你了解了 Autodesk BIM 360 服务，它是 Autodesk Construction Cloud 的一部分，后者包含多个应用程序，用于在所有设计、施工和运营阶段进行协作与协调。\n\
  \n在最后一章中，我们为使用 Revit 提高 BIM 项目生产力和效率的工作流程主题画上了句号。我们希望你现在都更好地理解了在 Revit 中应该做什么、检查什么和修复什么，以优化日常工作，从而在更短的时间内完成更多工作。\n\
  \n这个主题并未就此结束。你的学习还将继续，这取决于你的项目经验，以及 Revit 和 BIM 技术在未来几年的发展。\n\n![](img/1961add582dd4a589b2eac3dda140e38_477_0.png)\n\
