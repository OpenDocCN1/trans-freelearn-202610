- pgno: 19
  md: '# 1

    Introduction to

    Productivity in Revit


    We are living in the Information Age (also known as the Digital Age), and digital
    transformation is changing businesses and people by encouraging them to rapidly
    adopt new technologies and processes.


    Revit is an authoring software tool that is used for **Building Information Modeling**
    (**BIM**); here, the most valuable asset is the information you add to the Revit
    model.


    Information is KING; however, managing information and knowledge is POWER!


    You might already be familiar with Revit, but the combination of information management
    principles along with the best Revit practices can create a powerful combination
    to improve your productivity in BIM projects.


    This chapter will provide you with knowledge of how to improve Revit productivity
    and also increase your performance when working with BIM projects from smaller
    to larger scales.


    We will also explain the importance of selecting the right tool for the task that
    you need to perform, cover the best practices of BIM implementation, and provide
    a strategy of how to for creating a training scheme for your company.'
  merge: -1
  img_proc: true
- pgno: 20
  md: 'In this chapter, we will cover the following topics:


    +   - What you should know about Revit productivity

    +   - Choosing the right tool

    +   - An overview of the Revit implementation

    +   - The Revit training scheme


    # What you should know about Revit productivity


    Productivity in business is a significant factor when it comes to the performance
    of a company, and increasing productivity is the process of working smarter in
    a predefined time frame to match your project deadline.


    It is essential to define productivity and gain a better understanding of how
    you can measure it in your daily activities when working on multiple tasks and
    utilizing Autodesk Revit, too.


    Productivity can be defined as a process to measure a production against efficiency
    and convert inputs into outputs. This process applies to a machine, factory, or
    a person, where the results can help companies to take operations-based and investment
    decisions.


    There are multiple methodologies that you can use to measure productivity; the
    basic formula is output divided by input, which is equal to productivity:


    Output ÷ Input = Productivity


    The methodologies used to measure productivity depend on which sector your company
    is involved in, and we have listed a few examples next.


    Here are some productivity methodologies:


    +   - Time management

    +   - Tasks completed by the workforce

    +   - Personal performance

    +   - The ratio to manufacture a product


    We are going the explore the time management methodology to improve productivity
    and performance when working with Revit. You can use these principles in any task
    that involves digital production.'
  merge: -1
  img_proc: true
- pgno: 21
  md: 'The critical factor when it comes to improving productivity is to have quality
    and precise inputs producing your model and sheets before you start to work in
    Revit.


    You may be quick when it comes to completing a specific task in Revit, but without
    quality inputs, there is a risk that you will have to redo the work, which will
    reduce the overall productivity.


    Our time management methodology to improve productivity in Revit is based on quality
    inputs for digital production. This methodology will allow you to be more efficient
    in Revit and become a team player who meets every single project deadline.


    The first step in this methodology is to research quality inputs. These can come
    from your company, coworkers, multiple companies within your project, and, ultimately,
    the client who is the main stakeholder.


    Once you have established your quality inputs, you can start working in Revit
    to produce your model and drawings. The following examples will help us to demonstrate
    this process.


    # Example 1: Setting up a Revit project


    In this example, the **BIM Execution Plan (BEP)** defines the quality inputs.
    However, often, the information required to set up the project is not fully available,
    and you will need to research quality inputs.


    The quality inputs for this example are the naming standards, project standards,
    collaboration standards, survey strategy, volume strategy, software versions,
    exchange formats, the level of information need, BIM deliverables, the **Common
    Data Environment (CDE)**, the project location, coordinates, levels, and grids.


    Changes in the project number are a common issue in many projects, and by using
    this methodology, you will need to request this information from your project
    lead and a confirmation from your client before setting up the Revit files. The
    project number should be defined clearly in the BEP with the client''s approval
    to avoid any changes during the design and construction phases.


    Managing information to work smarter is a fundamental part of our methodology,
    and if you combine this with Revit''s best practices, it can take you to the next
    level of productivity.


    A simple change in the project number can affect the productivity of multiple
    coworkers from different areas, such as the document controller, information manager,
    and the commercial and legal departments.


    Note that the legacy information from previous drawings will be affected; it will
    lose its connection to the new drawings because of the new project number.'
  merge: -1
  img_proc: true
- pgno: 22
  md: 'In this example, you can see the importance of having the correct information
    at the right time, and it needs to be confirmed by the main stakeholder or client.


    # Example 2: Defining the room numbering system


    In this example, the client needs to approve the room numbering system, which
    also needs to be aligned with the facility management system to guarantee a continuous
    flow of data.


    By using this methodology, you can reduce the chances that the room numbering
    system will be changed in the future, which ultimately improves your and your
    team''s productivity.


    If you are familiar with Dynamo as a visual programming tool for Revit, you might
    suggest using Dynamo to rename all of the rooms in your project quickly. Yes,
    Dynamo can rename the room quickly. Our methodology uses the principle that you
    should get it right the first time, so you don''t need to rework and use Dynamo
    to rename the room because it was agreed at the beginning of the process.


    In this example, you can improve your productivity by avoiding having to redo
    the work twice and wasting time with tasks that can be easily agreed upon at the
    beginning of the project.


    # Example 3: Training versus productivity


    Some projects start with a design team without the required knowledge of specific
    software, which will slow down productivity.


    Revit training is essential to increase productivity, but the time to provide
    or receive training needs to be adjusted.


    Designers will benefit if the training is delivered just days before starting
    the project because the computational knowledge needs to be fresh. Otherwise,
    a designer will only retain the main points over a period of time.


    The trainer needs quality information about when the projects are starting to
    be able to define the best time frame to provide training.


    By using this process, the Revit trainer will note a reduction of requests to
    reattend the training, which will demonstrate the effectiveness of the training
    and their productivity in providing the training.


    Revit is an intuitive software in which designers can learn the basic commands
    quickly, and it benefits the company strategy to switch platforms or provide training
    for new staff.'
  merge: -1
  img_proc: true
- pgno: 23
  md: 'The following graph shows the benefits of investing in training for quick project
    implementation, and it will reflect a reduction in the amount of time needed to
