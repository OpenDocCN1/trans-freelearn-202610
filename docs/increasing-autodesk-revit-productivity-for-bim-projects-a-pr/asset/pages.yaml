- pgno: 156
  md: '# Schedules


    Schedules in Revit allow you to create lists of almost all instances of the types
    of elements in the model. These schedules are automatically updated depending
    on what information can be found in the model.


    It''s possible to extract different types of schedules:


    +   - **Quantity schedules**: This allows users to extract a list of building
    elements from the model.

    +   - **Key schedules**: This allows users to define keys in order to fill the
    quantities schedule more consistently.

    +   - **Graphical column schedules**: This allows users to create column schedules
    by intersecting grid lines, including their top and bottom constraints and offsets.

    +   - **Material takeoff**: This allows users to export material information assigned
    to elements from the model.

    +   - **Sheet lists**: This allows users to list the drawing list in the project.

    +   - **Note block schedules**: This allows users to define annotation schedules
    that can be added to the model using the **Symbol** tool.

    +   - **View lists**: This allows users to list the views in the project.

    +   - **Revision schedules**: This allows users to list the revisions assigned
    to a sheet.

    +   - **Panel schedules**: This allows users to create panel schedules with information
    about electrical panels, the circuits connected to the panel, and their corresponding
    loads.


    The process to create schedules is quite simple:


    +   1. Hover your mouse over **Schedules/Quantities**, right-click, and then click
    on which schedule type you want to create:'
  merge: -1
  img_proc: true
- pgno: 157
  md: 'Figure 3.55 – Creating new schedules


    2. After creating the schedules, we recommend that you drop them into a specific
    folder, based on the View Package parameter:


