    # Installing packages


    When sharing a Dynamo script, it is vital to ensure that all users will have the
    same packages that need to be installed to run it. This is very important as any
    user can install a package available by accessing it directly from Dynamo.


    To install packages, perform the following steps:


    +   1. Open Revit and, from the Manage tab, click on Dynamo.

    +   2. From the top menu, click on Packages and select Search for a Package...:


    ![](img/1961add582dd4a589b2eac3dda140e38_329_1.png)


    Figure 6.16 – Installing a package'
  merge: -1
  img_proc: true
- pgno: 330
  md: '3. In the new window, under Search, click the package name to be searched –
    Rhythm. When typing the package name, Dynamo filters the results available:


    ![](img/1961add582dd4a589b2eac3dda140e38_330_0.png)


    Figure 6.17 – Online package available


    4. To install the package, click the arrow on the left-hand side:


    ![](img/1961add582dd4a589b2eac3dda140e38_330_1.png)


    Figure 6.18 – Package installation'
  merge: -1
  img_proc: true
- pgno: 331
  md: 'Tip

    By clicking the package’s description, it is possible to access the package’s
    history, and a specific version can be installed, if available.


    5. A window will pop up to confirm installation:


    ![](img/1961add582dd4a589b2eac3dda140e38_331_0.png)


    Figure 6.19 – Package installation


    If the package installed has dependencies, for example, Python scripts or binaries,
    a warning pops up to confirm whether it can be installed.


    Important Note

    As Python scripts may affect your computer, please ensure that the source from
    where the script is being downloaded can be trusted.


    Depending on which Dynamo version is being used, the package that the user is
    trying to install might not be compatible with the current Dynamo version:


    ![](img/1961add582dd4a589b2eac3dda140e38_331_1.png)


    Figure 6.20 – Package installation confirmation'
  merge: -1
  img_proc: true
- pgno: 332
  md: 'Once the package has been installed, Dynamo will show that information:


    ![](img/1961add582dd4a589b2eac3dda140e38_332_0.png)


    Figure 6.21 – Package installed


    Although it is possible to install as many packages as you want, it is recommended
    to keep the number of packages at the minimum required. Ensure that only trusted
    packages will be installed since, when executing them, this may corrupt the model.


    Here is a list of some excellent packages that we recommend to be installed:


    +   - Archilab.net

    +   - Clockwork

    +   - Lunchbox

    +   - Rhythm

    +   - Spring Nodes


    When installed, they will be available in the Add-ons library:'
  merge: -1
  img_proc: true
- pgno: 333
  md: '![](img/1961add582dd4a589b2eac3dda140e38_333_0.png)


    Figure 6.22 – New packages installed and available


    Using the Dynamo forum will allow you to be aware of more interesting packages
    that can be used.


    # Managing installed packages


    To manage the list of all packages installed, perform the following steps:


    +   1. Open Revit and, from the **Manage** tab, click on **Dynamo**:


    ![](img/1961add582dd4a589b2eac3dda140e38_333_1.png)


    Figure 6.23 – Opening Dynamo from Revit'
  merge: -1
  img_proc: true
- pgno: 334
  md: '+   2. From the top menu, click on **Packages** and then select **Manage Packages…**:


    ![](img/1961add582dd4a589b2eac3dda140e38_334_0.png)


    Figure 6.24 – Managing installed packages


    +   3. To uninstall a package, click the icon on the right-hand side and select
    **Uninstall…**:


    ![](img/1961add582dd4a589b2eac3dda140e38_334_1.png)


    Figure 6.25 – Uninstalling packages'
  merge: -1
  img_proc: true
- pgno: 335
  md: 'A warning pops up informing you that, after uninstalling, Dynamo needs to be
    closed and restarted:


    ![](img/1961add582dd4a589b2eac3dda140e38_335_0.png)


    Figure 6.26 – Message to restart before uninstallation is executed


    Another warning will be presented to the user to confirm whether the package should
    be uninstalled. After clicking on Yes, the package will be uninstalled:


    ![](img/1961add582dd4a589b2eac3dda140e38_335_1.png)


    Figure 6.27 – Confirmation of uninstalling


    After uninstalling a package, some of the scripts with dependencies on the packages
    installed will not be able to run.


    # Expanding Dynamo with Python


    Python is one of the most popular programming languages, and it can be used to
    develop Dynamo scripts as it is user-friendly and easy to learn.


    As mentioned before, by developing our Python scripts, we can avoid having external
    dependencies (no packages needed), and the scripts can be more optimized and quick
    to execute on a project.


    It is recommended to develop bespoke scriptings based on what the project demands
    with regard to automation. This is possible as Python can connect with the Revit
    API – a set of communication methods between various components of the software,
    to interact with Revit elements.'
  merge: -1
  img_proc: true
- pgno: 336
  md: 'By way of a summary, these are the advantages of using Python:


    +   - It does not depend on other Dynamo dependencies.

    +   - It can be more structured regarding the use of nodes.

    +   - It is much faster and objective regarding the task to be developed.


    Dynamo has a built-in editor for Python. To access it, perform the following steps:


    +   1. Search for a Python node:


    ![](img/1961add582dd4a589b2eac3dda140e38_336_0.png)


