- pgno: 76
  md: 'The Revit master file contains the project coordinates (including True and
    Project North), levels, and grids. This file will be used with the volume strategy
    to create and set up all subsequent Revit files.


    Once the initial Revit file is set up, the project coordinates should be used
    with other platforms, such as AutoCAD and Rhino, to guarantee a straightforward
    process to export and import data.


    In *Chapter 4, Starting a Revit Project Efficiently*, we will show a step-by-step
    guide on how to set up the Revit project coordinates and initiate a project.


    To conclude, we have learned about the critical data in order to start a BIM project
    and about how the primary BIM documents need to be analyzed to reduce risk.


    In the next section, we will cover other BIM documents and provide further details.


    # BIM documentation overview


    It is essential to align the BIM documentation with the project strategy to improve
    efficiency so that the requirements will be well defined, which increases productivity
    and decreases cost.


    Companies must understand which information they should provide for the Design
    and Construction teams and also define which information they expect to receive
    for Asset Management to support building maintenance.


    We understand it is difficult for clients to have precise BIM requirements at
    the beginning of the project. Still, this has to change to improve the AECOO industry
    and ensure that project teams have defined requirements during a project life
    cycle.


    There are clear benefits to having the BIM documentation well defined. Some of
    these are outlined here:


    +   - Quicker **Return on Investment (ROI)**

    +   - Client and project standards compliance

    +   - Ensures the BIM requirements from clients and the project team are aligned

    +   - Better communication to deliver the project

    +   - Improved quality assurance and quality control for BIM models and data


    We will provide an overview of the currently most used BIM documentation in the
    AECOO industry.'
  merge: -1
  img_proc: true
- pgno: 77
  md: 'We can divide the BIM documents into three categories, as follows:


    +   - Client documents

    +   - Project team documents

    +   - Standards documents


    # Client documents


    It is vital to establish that the Appointment or Contract is the primary contractual
    document, and it should also have high-level information about the BIM requirements
    but also include the BIM detail that your organization may consider necessary.


    The client and the project team need to define on a project basis which BIM documents
    are contractual or non-contractual. It is common to see in projects the BEP varying
    from being contractual or non-contractual.


    If the EIR is not referenced in the Appointment or Contract, it will likely not
    be a contractual requirement.


    Company BIM leaders, insurance organizations, and commercial departments should
    be liaising to define those as contractual requirements.


    We will now provide an overview of BIM documents for clients that include, but
    are not limited to, the requirements outlined next.


    # Organizational Information Requirements (OIR)


    This establishes the information requirements for the client''s **Asset Management
    system at an organizational level**, and it includes strategic decisions and expertise
    in Asset Management. This document will be used to generate the AIR and provide
    information to create the PIR.


    # Asset Information Requirements (AIR)


    The AIR **defines specific project needs** for Asset Management operation and
    conveys the objectives from the Organizational Information Requirements (OIR).
    It helps to inform and create Exchange Information Requirements (EIR) and specifies
    the **Asset Information Model (AIM)**.'
  merge: -1
  img_proc: true
- pgno: 78
  md: '# Project Information Requirement (PIR)


    The PIR conveys the information from the Organizational Information Requirements
    (OIR) to **define the built asset project**. This document will support the development
    of the EIR.


    # Exchange Information Requirements (EIR)


    The EIR **defines the information, standards, and processes** to be delivered
    and adopted during the design and construction stages. It should specify the information
    required to answer the Project Information Requirement (PIR). We covered this
    in detail in the previous section.


    To conclude, the documents listed in the client section will support the project
    team in developing the BIM Execution Plan (BEP) and producing BIM models.


    The following BIM documents diagram shows in more detail how the documents are
    connected to provide enough information to the project team to produce BIM models:


    ![](img/1961add582dd4a589b2eac3dda140e38_78_0.png)


    Figure 2.2 – BIM documents diagram'
  merge: -1
  img_proc: true
