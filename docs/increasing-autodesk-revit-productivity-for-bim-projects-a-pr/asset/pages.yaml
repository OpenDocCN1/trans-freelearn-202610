- pgno: 245
  md: '# Zoom IN and OUT of a Schedule


    In the latest Revit versions, we can zoom IN and OUT of schedules.


    If you open any Revit schedule, you can use Ctrl + “+” to zoom in and Ctrl + “-”
    to zoom out the schedule. However, the most practical process is to hold the Ctrl
    key and rotate the mouse wheel to zoom into the schedule.


    > Tip

    > To return to 100% zoom, just press Ctrl + 0.


    # Highlight Rows with Different Colors


    In this workflow, we can highlight alternate rows with different colors. Follow
    the steps shown in the following image:


    ![](img/1961add582dd4a589b2eac3dda140e38_245_0.png)


    Figure 5.4 – Highlighting rows with different colors


    Here, we can see rows with alternate colors that facilitate reading the schedule:


    ![](img/1961add582dd4a589b2eac3dda140e38_245_1.png)


    Figure 5.5 – Schedule rows with different colors'
  merge: -1
  img_proc: true
- pgno: 246
  md: 'We can also turn on this feature by clicking on **Stripe Rows:**


    ![](img/1961add582dd4a589b2eac3dda140e38_246_0.png)


    Figure 5.6 – Schedule – Stripe Rows


    # Highlight in Model


    This tool is useful for highlighting a particular door, room, or other Revit component
    in the model. We need to select a row and click **Highlight in Model:**


    ![](img/1961add582dd4a589b2eac3dda140e38_246_1.png)


    Figure 5.7 – Highlight in Model


    # Adding Images to Families and Display in Schedules


    We can add images of objects to be associated with Revit families and display
    them on a schedule. Follow these steps to do this:


    +   1. Select a furniture chair family in the project and click **Edit Family**.

    +   2. Click on the box to select an image file (`*.JPG`). We must use the **Type
    Image** parameter:'
  merge: -1
  img_proc: true
- pgno: 247
  md: 'Figure 5.8 – Type Image parameter


    +   3. Click ..., select the image, and click OK. Load the family back into the
    project.


    +   4. Add the Type Image parameter to the schedule:


    ![](img/1961add582dd4a589b2eac3dda140e38_247_0.png)


    ![](img/1961add582dd4a589b2eac3dda140e38_247_1.png)


    Figure 5.9 – Type Image parameter in the schedule


    +   5. Add Furniture Schedule to the sheet; you will see the product image:


    ![](img/1961add582dd4a589b2eac3dda140e38_247_2.png)


    Figure 5.10 – Furniture Schedule with product image'
  merge: -1
  img_proc: true
- pgno: 248
  md: 'We can also use the **Image** parameter to add images to be displayed in schedules:


    ![](img/1961add582dd4a589b2eac3dda140e38_248_0.png)


    Figure 5.11 – Using the Image parameter


    With this, we can control the image inside the Revit project instead of inside
    the Revit family.


    # Design Options in Schedules


    In this workflow, we can display the quantities of objects from Revit **Design
    Options** in schedules. You must have **Design Options** in your project to use
    this workflow and select which options we want to display in the schedule.


    Open the Revit schedule and follow these steps to change the specified **Design
    Option**:


    ![](img/1961add582dd4a589b2eac3dda140e38_248_1.png)


    Figure 5.12 – Design Options in Revit schedules


    # Schedules for Existing and New Phases


    We can also create schedules for specific Revit phases, such as **Existing** or
    **New Construction**.'
  merge: -1
  img_proc: true
- pgno: 249
  md: 'We can open the schedule and select the required Revit phase in Properties:


    ![](img/1961add582dd4a589b2eac3dda140e38_249_0.png)


    Figure 5.13 – Revit phases in schedules


    # Calculate Totals


    We can calculate the totals in a schedule to find the total internal area of a
    building, specific floor, or total quantities.'
  merge: -1
  img_proc: true
- pgno: 250
  md: 'To calculate totals, follow these steps:


    +   1. Let’s edit a room schedule and select the **Area** parameter to calculate
    the totals in the **Formatting** tab:


    ![](img/1961add582dd4a589b2eac3dda140e38_250_0.png)


    Figure 5.14 – Calculate totals


    +   2. In the **Sorting/Grouping** tab, select **Sort by: Level** and tick the
    **Footer** and **Grand Totals** options:'
  merge: -1
  img_proc: true
- pgno: 251
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 252
  md: 'Follow these steps to work with Conditional Formatting:


    +   1. Open a room schedule that contains the **Area** parameter.

    +   2. In the **Formatting** tab, select the **Area** parameter and click **Conditional
    Format…**:


    ![](img/1961add582dd4a589b2eac3dda140e38_252_0.png)


    Figure 5.16 – Conditional Format…'
  merge: -1
  img_proc: true
- pgno: 253
  md: '+   3. Select the **Greater Than** option, type in 100, select a **Background
    Color**, and click **OK**.


    ![](img/1961add582dd4a589b2eac3dda140e38_253_0.png)


    Figure 5.17 – Conditional Formatting options


    We will see all the areas that are greater than 100 m² highlighted in red:


    | A | B | C | D | E |

    |---|---|---|---|---|

    | Count | Level | Name | Number | Area |

    | 1 | 01 - Entry Level | Vest. | 101 | 39 m² |

    | 1 | 01 - Entry Level | Lobby | 102 | **324 m²** |

