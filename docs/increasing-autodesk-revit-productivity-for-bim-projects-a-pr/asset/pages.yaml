- pgno: 323
  md: '> Tip

    > By hovering the mouse over a subcategory, Dynamo will bring up a tip with a
    description of the tool.


    When users want to add nodes to the canvas, they usually use the search area and
    type the node-related name:


    ![](img/1961add582dd4a589b2eac3dda140e38_323_0.png)


    Figure 6.6 – Search node


    When any user needs to add a new node, it is possible (and faster) to right-click
    in the canvas and type the node’s name in the Search area.


    ![](img/1961add582dd4a589b2eac3dda140e38_323_1.png)


    Figure 6.7 – Searching a node through the context menu'
  merge: -1
