- pgno: 80
  md: '+   - Level of Information Need (Framework to define the Level of Detail and
    Level of Information)

    +   - Define which model element will require COBie deliverables

    +   - Project stage


    # BIM and IT capability assessments


    BIM and IT capability assessments are questions to evaluate the capability to
    deliver BIM projects, IT requirements, and cybersecurity requirements.


    # Project Implementation Plan (PIP)


    The PIP is part of the Pre-BEP, and each company bidding to a project should provide
    this to demonstrate their capability, experience, and competence to deliver a
    BIM project.


    # BIM standards and guidance


    Standards and guidance are imperative for the evolution of a digital AECOO industry,
    and they support companies and governments in having consistency in projects.


    This consistency can improve efficiency and productivity for multiple sectors
    in the AECOO industry. It also has other benefits, such as reducing costs and
    improving collaboration, coordination, and data exchange.


    In January 2019, the final version of the **British Standard European Norm (BS
    EN)** *ISO 19650-1* and *- 2* were published to supersede the *BS 1192:2007+A2:2016*
    and the **Publicly Available Specification (PAS)** *1192-2:2013*.


    For more information about the *BS EN ISO 19650* series, access this link:


    ```

    https://ukbimframework.org/standards-guidance/

    ```


    Here is the **Quick Response (QR)** code for this:


    ![](img/1961add582dd4a589b2eac3dda140e38_80_0.png)'
  merge: -1
  img_proc: true
- pgno: 81
  md: 'We will not be able to cover all BIM standards in detail, but they can be divided
    into three levels, as illustrated in the following screenshot:


    ![](img/1961add582dd4a589b2eac3dda140e38_81_0.png)


    Figure 2.3 – BIM standards


    National Standards are country-specific standards such as the British Standards,
    the European Standards (**European Committee for Standardization (CEN)/Technical
    Committee (TC) 442**), and other countries'' standards.


    Organization Standards are specific guides created by an organization to define
    software and graphical representations such as line weight, drawing tiles, and
    others.


    To conclude, we have learned about the BIM documents for clients and project teams
    and have had an overview of industry standards.


    In the next section, we will learn about project functions on a BIM project.


    # Project functions


    The standard *ISO 19650* series has replaced the word *roles* with *functions*,
    but the meaning is still the same, which is to define the responsibilities of
    a specific person or group of people.


    The Exchange Information Requirements (EIR) and the BIM Execution Plan (BEP) will
    define project functions to outline key responsibilities, and this can improve
    productivity as each team member will be aware of the tasks that need to be performed.


    It is essential to highlight that project functions are not job titles, and more
    than one person can take and perform multiple functions.


    The Appointing Party (Client) that writes the EIR will define the Information
    Management function primarily. The Appointing Party can nominate a person from
    their organization or appoint a third-party company to perform this function.'
  merge: -1
  img_proc: true
- pgno: 82
