- pgno: 387
  md: '# 8


    # Collaborating with Consultants


    Collaborating with consultants is an essential component of information management
    and BIM workflows, but we need to ensure effective collaboration that leads to
    increased performance across multiple organizations.


    Companies that promote collaboration share knowledge and best practices to achieve
    the project objectives. Successful collaboration is based on trust, respect, and
    active collaboration with clear communication and defined information exchange
    processes.


    In the previous chapters, we accomplished some aspects of collaboration.


    Chapter 2, Project Data Management explained project data management and BIM documentation,
    which involves companies'' collaboration.


    Chapter 4, Starting a Revit Project Efficiently discussed the importance of having
    models from consultants with the same coordinate system to import and export models
    at the correct location to gain efficiency and improve productivity.


    Chapter 5, Core Revit Functionalities presented the best practices for worksharing
    to enable Revit collaboration and the process to manage worksets from your team
    and consultants'' files.


    This chapter will overview the strategy for collaboration and provide information
    about the Revit tools to enhance Revit collaboration, such as Copy/Monitor, Coordination
    Review, and Shared Views.'
  merge: -1
  img_proc: true
- pgno: 388
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 389
  md: 'We would like to have your perspective about the strategy for collaboration
    with consultants.


    Could you please present yourself and your company?


    **Ricardo:**


    Currently, I am the Director of Technology in Sweco, Finland, since 2013. Sweco
    plans and designs the sustainable cities and communities of the future. Sweco
    has about 17,500 employees and operates mainly in the European market.


    **Marzia:**


    I am Marzia Bolpagni, Head of BIM International - Associate Director at MACE.
    MACE is a global company, and our purpose is to refine the boundaries of ambition,
    so we develop, consult, construct, operate, and these are the four engines of
    MACE. In particular, I work in the consultancy side of MACE and on the Digital
    - BIM Group.


    **May:**


    I am Head of Commercial and Legal: Cities and Digital at international engineering
    company, Buro Happold. In this role, I lead the Commercial and Legal team''s support
    of Buro Happold''s Cities and Digital businesses globally. From the Digital side,
    this includes working closely with the business to provide legal support and advice
    to the teams within Buro Happold, providing digital and BIM services, and assisting
    the development of new construction technology and digital data products, services,
    and offerings across our global business. Every day is different, and I enjoy
    the opportunity to use my knowledge and experience to help the business improve
    processes and deal with legal and commercial issues arising from construction
    technology and digitization, whether it is BIM, modular construction, software,
    or something else.


    Outside of my day job, I have been heavily involved in the development of BIM
    documentation and writing papers on this topic for some years. I speak regularly
    at conferences worldwide about legal and contractual issues of BIM and construction
    technology, and write papers and articles on these topics. I am the chair of BIM4Legal,
    which I explain more about below. I am also a Core Team Member of the international
    4D Construction Group, a member of the Working Groups for the ISO19650 Transition
    Guidance, the ISO19650 Guidance, the Centre for Digital Built Britain''s National
    Digital Twins Roadmap and the Digital Twins Toolkit. I am also an Ambassador for
    the UK BIM Alliance. I have led the teams that wrote the 2018 JCT Practice Note
    on BIM and the ISO19650-compliant Information Protocol, and consulted/commented
    on a number of other BIM guidance documents.'
  merge: -1
  img_proc: true
- pgno: 390
  md: 'Buro Happold is a global practice of engineers, consultants, and advisers.
    Through integrated thinking and a truly interdisciplinary, interconnected community
    of passionate experts, we create transformative outcomes for clients and communities
    alike. Buro Happold is committed to delivering elegant solutions that leave a
    positive, lasting legacy for the communities we work in and the environment (see,
    for example, *Global Sustainability Report 2020* – Buro Happold – https://bit.ly/2RZNGV4).
    We value human wellbeing, embrace mutual responsibility, and understand that a
    sustainable future is intrinsic to the economic and social impact of our work.
    Buro Happold is known for its forward-thinking and technologically advanced ethos,
    for example, internally implementing BIM on all projects for some years and being
    fully compliant with the new information management requirements of the ISO19650.
    We understand that technology is revolutionizing construction for the benefit
    of our client, requiring agile thinking to provide the most relevant service and
    deliverables. One of Buro Happold''s digital thought leaders, Alain Waha, put
    it that Buro Happold are "inventing the future" with clients, such as via our
    work with the Construction Innovation Hub; our computational engineering approach
    allowing us to integrate design processes with technologies forming part of the
    construction process or finish assets, or even optimizing design for offsite construction.
    Importantly, we engage with our supply chain toward full digital construction,
    as collaboration is a key part of successful digitization and BIM. Widening involvement
    in this essential digital space further, Buro Happold recently released its first
    digital product, Workplace Analytics, and continues to progress its open source,
    collaborative model platform called the BHOM (https://bit.ly/3sXDZDF), which enables
    consultants to get over the real problems of interoperability when collaborating
    on models.


    # What is your advice to build strong collaborative relationships with consultants?


    **Ricardo:**


    I think strong relationships come from trust. I have noticed we can create trust
    between all project stakeholders if we are aware of what needs to be done and
    are aware of what it takes to make things done.


    I work with customers using Agile methodology that helps our business process
    a lot because clients are fully involved in the project''s decision-making at
    all times.


    This inclusiveness of the client and other stakeholders in the project created
    a stronger bond between them and created an environment of trust that allowed
    the multiple projects done with that team to be quite successful.'
  merge: -1
  img_proc: true
- pgno: 391
  md: '**Marzia:**


    To create strong collaborative relationships, we need to consider developing soft
    skills that help communicate, create a collaborative environment, make people
    confident to innovate and make errors, and engaged in specific tasks supporting
    the strategy defined by the leadership.


    When we speak about collaboration, the contractual agreement is an important factor
    to promote a collaborative environment for the teams involved in the project.


    I''m writing a book about Industry 4.0, and it is not only about the technology
    side, but we also speak about methodologies on developing soft skills, digital
    leadership, and ensuring people feel part of a team. The book is called *Industry
    4.0 for the Built Environment: Methodologies, Technologies and Skills*, and it
    is planned to be published by Springer in 2021.


    **May:**


    Firstly, there has to be the right mindset. The construction industry is traditionally
    quite adversarial and risk-averse, with contracts seeking to pass on risk and
    liability to the other party. The Latham and Egan reports pointed out the urgent
    need to shift towards a more collaborative culture, as did the aptly titled Farmer
    report, *Modernise or Die*. Achieving this collaborative mindset definitely requires
    the correct ethos and internal principles within organizations. However, to achieve
    such collaborative mindset and indeed to build collaborative relationships, the
    following key steps could also assist:


    +   - Contract documentation that has the intent of collaboration and also contains
    collaborative procedures that parties are obliged to comply with, such as regular
    discussions and exchanges of information (being obliged to collaborate would then
    also lead to parties realizing, in complying with such steps, that it truly is
    a more efficient and better way of interaction).

    +   - Implementing and enforcing processes between the parties that ensure regular
    and open exchange of information, discussion, and mutual assistance, to support
    and build strong, collaborative relationships.

    +   - Developing strong, regular, or repeat working relationships with other parties
    would also assist as it can be difficult to fully develop close, collaborative
    relationships with parties one has just met as opposed to those one has worked
    with repeatedly.

    +   - Using technology and digital processes that make collaboration easier and
    more effective. For example, BIM modeling, exchanging information via cloud platforms,
    and exchanging data in formats that are easily viewed and understood by all.'
  merge: -1
  img_proc: true
- pgno: 392
  md: '# What is your view about the difficulties in collaboration when we have a
    segmented supply chain with a diverse set of skills?


    # Ricardo:


    Communication and knowledge sharing are problematic in this type of segmented
    supply chain environments. It decreases the success rate of the projects and often
    makes the project go over time and over budget. It is essential to provide a training
    scheme to improve technology and collaboration skills.


    # Marzia:


    It is a good question. Our industry is still on the digitalization journey, even
    after the mandate for digitalization many years ago in the UK, so the level of
    maturity in the industry is really diverse globally.


    When we select partners, it is essential to check their capabilities and not just
    rely on their CV and promises. Sometimes, it is impossible to choose the partners,
    but checking their capabilities on how they work and behave in a specific situation
    is one way of selecting the team. Another thing is providing training and understand
    their limitations and requirements as each company has different processes. It
    is also important to define clear information requirements and the different Level
    of Information Need of each actor of the supply chain to promote collaboration.
    In this case, it is clear what is needed to fulfill their requirements and be
    able to run multiple analyses and processes. The standard EN 17412-1 can be used
    to define the Level of Information Need framework.


    # May:


    Arguably the diversity of skills should promote collaboration as parties need
    to rely on others'' skillsets or knowledge, and work together to achieve a complete
    design or completed project. However, the industry is indeed very fragmented and,
    as mentioned previously, traditionally quite adversarial. However, there has been
    a clear shift and movement towards more collaborative ways of working, stimulated
    by the Government''s mandates and publications (for example, the mandates in the
    UK Government Construction Strategy 2011, and the clear ethos and principles within
    the UK Government''s 2020 Construction Playbook). We still have some way to go,
    as some within the industry may be hesitant to embrace a seeming radical shift
    towards collaboration compared to their accustomed working methods of the last
    few decades and the necessary digital tools to facilitate and speed up collaboration
    are not implemented by some within the industry. Whilst it will therefore take
    time for collaboration to be truly cemented as business as usual, it needs the
    commitment and support of people within the industry to promote and encourage
    collaborative ways of working, and take active steps to achieve this.'
  merge: -1
  img_proc: true
- pgno: 393
  md: 'Full collaboration is also arguably made difficult due to the nature of insurance
    policies, which may prevent parties being completely open when issues arise, due
    to concern of invalidating their policies. **Integrated Project Insurance (IPI)**
    is being tried by the UK Government with a view to overcoming such difficulties
    and obstacles to collaboration.


    # How can companies promote effective collaboration?


    # Ricardo:


    The best way to promote anything is by showing success stories. It has been the
    way for me to introduce several ways of working at Sweco, even though they sounded
    alien to the people I was presenting to. It is always easier to convince people
    by showing past examples.


    # Marzia:


    Collaborative contracts would be the first step to promote effective collaboration,
    but also selecting the right team members from your company. This process is not
    only about the technical skills, but it is also about the behave and soft skills
    that are so important, and at MACE, we have metrics called "Behaviours for Success"
    because we are evaluating not just how we perform technically, but we evaluated
    how we behave, interact, and work with others. It is also important from the strategic
    and leadership point of view that these behaviors are evaluated and included in
    professional appraisals in the company.


    When we are in projects, it is important to define clear information requirements
    and particularly define the Level of Information Need as stated in the ISO19650
    series. I''m the lead author of the standard EN 17412-1 on the Level of Information
    Need framework that replaces the "LOD" concept. It is really effective to define
    the requirements at the early stages of the project and automatically compare
    deliverables against initial needs.


    In addition, the use of digital tools can help collaboration in companies. But
    it is also important having regular catch-ups and meetings to understand how people
    feel, and informal talks can create a collaborative environment where people don''t
    fear making mistakes or speaking up when issues arise, but they feel supported
    to do their jobs with the right technical tools and training.


    # May:


    It has to be embedded within the culture and ethos of the organization. I am very
    proud that Buro Happold takes collaboration seriously, both externally with our
    clients, collaborators, and sub-consultants, as well as internally between teams
    and offices. There are processes, tools, and documentation which provide a good
    framework for such collaboration to take place in an easy and uniform way. Clear
    commitment by an organization in thought and action in turn encourages those within
    the organization to adopt this approach.'
  merge: -1
  img_proc: true
- pgno: 394
  md: '# What are your views about contracts types that enhance collaborative working?


    # Ricardo:


    Here in Finland (probably in other countries), we have had some different type
    of contracts: the alliance contracts. These contracts are sometimes used in big
    projects, and the idea behind them is to enhance collaboration in the project.
    In this process, all stakeholders share the risks/benefits of the projects.


    # Marzia:


    For me, it is the top one reason to enhance collaborative working, and it was
    the topic of my master thesis in 2012 regarding public procurement using building
    information modeling, and I analyzed different procurement methods, including
    the traditional and collaborative, across different countries. In the US, there
    is the **Integrated Project Delivery (IPD)**, in Australia is more the Project
    Alliancing contracting, and in the UK, the government strategy defines three ways
    for procurement methods that enhance collaboration (**Cost-Led Procurement (CLP)**,
    **Integrated Project Insurance (IPI)**, Two-Stage Open Book). Also, the work lead
    by Prof. David Mosey is really relevant, and the FAC1 framework can be used for
    alliancing contacts to promote a collaborative approach. Unfortunately, I must
    say that we don’t use so much as we want because there are many barriers to change
    the contract procurement process. We need to improve in this regard if we want
    to take the full benefits of a digital process.


    # May:


    It is helpful and important that the contract is set up to encourage and require
    collaboration, including containing processes that oblige collaboration to be
    implemented between parties as well as setting out parties’ rights and obligations
    in a manner that promotes collaboration. A contract that seeks to pass all risk
    and liability to another party, or contains terms which encourage protective or
    adversarial behavior, will have a detrimental effect to attempts at building a
    collaborative atmosphere. Terms that require parties to work in "mutual trust
    and co-operation" or similar ensure parties start out with the right intentions
    and, hopefully, progress positively from there. Contracts with collaborative ways
    of working such as BIM would usually contain or incorporate references to collaborative
    processes or technical documents, such as the BIM Execution Plan, which are created
    by mutual agreement of all parties and continually updated together. These documents
    in turn result in parties working closely together, progressing a more collaborative
    way of working than the traditional silos.'
  merge: -1
  img_proc: true
- pgno: 395
  md: '# What are the key points to define a strategy for collaboration?


    Ricardo:


    I think that you need to have the vision and the mission for any kind of strategy.
    Then you need to define the short- and long-term objectives and set the milestones
    between them to measure if you are moving in the right direction, and if you are
    not, you know where to improve. The measuring process is the key to a successful
    implementation.


    Marzia:


    The key points to define a strategy for collaboration is to select the correct
    contract type because, in the end, the collaborative contract will support the
    early involvement of contractors, multiple participants, and a clear definition
    of responsibilities. From the insurance point of view, companies will share the
    vantages and disadvantages as they are in the same "boat", so the contract is
    really vital for promoting a collaborative approach where the delivery team and
    clients share the same goals.


    Apart from that, selecting the right people with the right attitude, define the
    information requirements, and frequently check what people need to perform their
    function supports collaboration. Digital tools can facilitate collaboration, but
    we need good foundations and leaders to drive projects collaboratively. The human
    factor is key.


    May:


    Key points can be very organization- and project-specific, to be suitable for
    the circumstances and requirements; however, some key points include:


    +   - Having collaborative terms and requirements within the contractual documents

    +   - Implementing and enforcing collaborative processes internally and externally

    +   - Using digital and other tools that facilitate easier and secure collaboration


    Ricardo, Marzia, and May, thank you very much for the interview.


    Now, let''s learn about the technologies to enable collaboration between internal
    teams and consultants.


    # Technology for collaboration using Revit


    Technology for collaboration enables employees to work and collaborate in multiple
    file types in the cloud or on-premises, which is essential when working with large
    teams and various consultants.'
  merge: -1
  img_proc: true
- pgno: 396
  md: 'Your company''s IT infrastructure must define how you will be able to collaborate
    with internal teams and consultants. There are multiple options available, and
    cybersecurity should be the top priority.


    *In Chapter 5, Core Revit Functionalities* we learned about **Revit worksharing**
    and how to create a central and local file for collaboration *inside* your premises
    and IT network:


    ![](img/1961add582dd4a589b2eac3dda140e38_396_0.png)


    Figure 8.1 – Worksharing process inside of your IT network


    When you need to collaborate *outside* of your company''s IT network, such as
    when working from home or collaborating with consultants in Revit, you need a
    different solution to enable the Revit synchronization process.


    Currently, there are three main options to enable this process:


    +   - Virtual Desktop Infrastructure (VDI)

    +   - Autodesk BIM 360 and Autodesk Construction Cloud

    +   - Revit Server


    # Virtual Desktop Infrastructure (VDI)


    VDI enables users to connect to virtual machines (virtual desktop instances),
    and all processing occurs on the host server. Users can access these virtual machines
    from any location or device.'
  merge: -1
  img_proc: true
- pgno: 397
  md: 'Virtualization graphical applications, such as Revit, AutoCAD, Rhino, and Enscape,
    can be challenging as they depend on processing power and good graphics card performance.
    You also need to check whether your plugins work in the VDI environment.


    This solution can represent a substantial investment because it may involve purchasing
    hardware and software to implement VDI, but it will support multiple applications
    and not only Revit.


    VDI solutions are becoming more popular and accessible to companies. The following
