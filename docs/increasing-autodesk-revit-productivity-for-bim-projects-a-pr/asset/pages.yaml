- pgno: 190
  md: '# Model content


    Before starting a project, it''s essential that you understand the project requirements
    and the project BIM scope. All this information will be critical for aligning
    the BIM production with the BIM scope and the desired graphical results for the
    drawing production.


    All team members should be aware of the level of information required for the
    elements that need to be modeled. This information is not only graphical but also
    non-graphical, as both will impact the Revit performance.


    Some team members tend to develop complex and over-detailed models. This will
    have a critical impact in terms of performance.


    The main aspects that can affect performance are as follows:


    +   - **Linked files:** When using linked files, ensure that all files are linked
    correctly and if extreme needed. Always control whether the paths are okay because
    when Revit loses the paths, it will affect performance as well.

    +   - **Multiple constraints and parametric relationships between elements:**
    It''s common to use constraints when modeling elements, for example, lock alignments,
    lock dimensions, and parametric arrays. All of these procedures will affect performance,
    as Revit will always check for constraints prior to any update.

    +   - **Complex geometry:** When modeling the project, it''s common to over-model
    elements or when importing elements from different software (for example, Rhino)
    import complex geometry into Revit. Before importing that geometry, check whether
    it''s possible to simplify the shape of the elements.


    A Quality Assurance workflow should be part of the project to keep the model performance.
    As a reference, here are a few checks that need to be carried out:


    +   - The file size should be under 250 MB.

    +   - All links with the right file path

    +   - The number of groups is not too high (groups with system families should
    be avoided).

    +   - The number of in-place families should be reduced to the minimum (if there
    is more than one instance of the same family, the in-place family should be converted
    into a loadable family).

    +   - If the model is workshared, make sure that all elements are in the right
    workset (it will facilitate turning on/off elements).

    +   - Warnings should be kept to a minimum.'
  merge: -1
  img_proc: true
- pgno: 191
  md: '# System families


    System families do not affect Revit performance that much unless they have hosted
    standard families (loadable families).


    With these families, all constraints, formulas and shape complexities are not
    very flexible, keeping the object with low complexity.


    To create different family types, Revit only allows users to edit the hardcoded
    parameters. Therefore, it''s not possible to create complex formulas or parameters,
    which generally affect the model performance.


    # Standard families and loadable families


    Standard families (or loadable families) are those that will most affect Revit
    performance. That happens because these families are highly customizable, that
    is, they are more complex and constrained in terms of relationships between the
    different pieces of geometry.


    For example, when modeling a family with extrusions, if you are using sweeps,
    blends, sweep blends, or even revolves, families will become heavier and more
    complex as Revit needs to control more constraints apart from dimensions (the
    shape is always constant).


    Another example that affects performance is when families include non-Revit elements,
    such as imported 3D geometry from Rhino, SAT, or DWG). We should avoid using non-native
    geometries or, if they are needed, we should keep them as simple as possible.


    As a reference, loadable families should have an average size of 1 MB. If larger
    than this, ensure that they are essential and need to be used.


    # Summary


    In this chapter, we learned how to create a Revit template from scratch, along
    with the main settings that need to be included in the template to improve productivity
    at the project level.


    We explained how to organize views, sheets, schedules, and all of the information
    in the model for a faster and easier way of managing the information that is available.
    These settings are relatively important and of high priority; however, this doesn''t
    mean that these are the unique settings that need to be added to the template.


    You also learned what should be modeled and what the impact would be on the Revit
    performance and productivity.'
  merge: -1
  img_proc: true
