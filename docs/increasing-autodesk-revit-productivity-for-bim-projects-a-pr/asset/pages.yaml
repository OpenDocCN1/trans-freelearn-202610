- pgno: 205
  md: 'We advise that you always use the Survey Station Point as the primary option.


    The second option will be the Ordnance Survey Map Grid Intersection Point.


    We do not advise using the Building Coordinates Point and coordinates points from
    a structure project grid. There are two reasons not to use these points:


    +   - The building coordinates point does not have a rounded number that can cause
    software inaccuracy (X=5514291.6539, Y=181598.9381). The software might display
    a rounded number (X=5514291.7, Y=181599.0), and maybe companies will begin using
    (X=5514291.7, Y=181599.0) instead of the correct coordinate.

    +   - The structure project grid can change these positions during development.


    > Tip

    > Give preference to the survey station point or the Ordnance Survey Map grid
    intersections point when setting up the Revit project.


    In the next section, we will learn how to set up the Revit coordinates with this
    AutoCAD file. Now, let''s learn about the process of linking and importing files
    to Revit.


    We can Link or Import multiple file types in Revit, as follows:


    ![](img/1961add582dd4a589b2eac3dda140e38_205_0.png)


    Figure 4.15 – Inserting files into Revit


    +   1. Link Revit: The Link Revit files and file extension is *.RVT.

    +   2. Link IFC: Industry Foundation Classes (IFC) is a model where the components
    contain data. Currently, IFC is developed by building SMART, and BIM software
    uses the IFC format to exchange models and data for interoperability. The file
    extensions that are supported are *.IFC, *.ifcXML, and *.ifcZIP.

    +   3. Link CAD: We can link files to the following extensions: *.DWG, *.DXF,
    *.DGN, *.SAT, and *.SKP.'
  merge: -1
  img_proc: true
- pgno: 206
  md: '+   4. **Point Cloud**: A point cloud is a file that is usually provided by
    survey companies to represent an existing construction with thousands of points
    inside a space. We can link *.RCP and *.RCS files.

    +   5. **Coordination Model**: Here, we can link Navisworks files to Revit with
    two file extensions, *.NWD and *.NWC. Navisworks is used for clash detection,
    quantification, simulation, and 5D analysis.

    +   6. **Manage Links**: Here, we can manage files to **Reload From...**, **Reload**,
    **Unload**, **Add...**, and **Remove**:


    ![](img/1961add582dd4a589b2eac3dda140e38_206_0.png)


    Figure 4.16 – Manage Links


    +   7. **Import CAD**: We can import multiple file formats such as *.DWG, *DXF,
    *.DGN, *.SAT, *.SKP, and *.3DM. Remember that importing files can reduce Revit
    performance, so the best option is to link them instead of importing them.


    > **Tip**

    > In the next Revit version, we will be able to link Rhino files instead of importing
    them.'
  merge: -1
  img_proc: true
- pgno: 207
  md: 'The most common linked or imported files in Revit appear in the following formats:


    +   - Native Revit files (*.RTV)

    +   - AutoCAD files (*.DWG)

    +   - IFC files (*.IFC)

    +   - Rhino files (*.3DM)

    +   - Point cloud files (*.RCP and *.RCS)


    Suppose your project team is using any of these formats. In that case, we need
    to plan and ensure that every company can import and export files with the correct
    coordinate system to increase productivity and save time across multiple companies.


    Let''s take a look at an overview of the coordinate system of each application
    and the best practices to link files into Revit.


    # Native Revit files (*.RVT)


    We have already explained the coordinate system in Revit, so we will now show
    the process of how to link Revit files. You can follow these steps:


    +   1. Click on Insert and Link Revit:


    ![](img/1961add582dd4a589b2eac3dda140e38_207_0.png)


    Figure 4.17 – Linking Revit files'
  merge: -1
  img_proc: true
- pgno: 208
  md: '+   2. Select one of the options to position the link. The most used options
    are **Auto - By Shared Coordinates**, **Auto - Internal Origin to Internal Origin**,
    and **Auto - Project Base Point to Project Base Point**:


    ![](img/1961add582dd4a589b2eac3dda140e38_208_0.png)


    Figure 4.18 – Linking Revit files


    The other options should be avoided, such as **Auto - Center to Center**, **Manual
    - Internal Origin**, **Manual - Base Point**, and **Manual - Center**.


    We will provide more details about this in the next section, focusing on linking
    via **Auto - By Shared Coordinates**.


    # AutoCAD files (*.DWG)


    In the workflow to link AutoCAD files, we have a few options, as follows:


    ![](img/1961add582dd4a589b2eac3dda140e38_208_1.png)


    Figure 4.19 – Linking AutoCAD files'
  merge: -1
  img_proc: true
- pgno: 209
  md: 'The **Manual - Origin** and **Manual - Center** options are not commonly used,
    so we will focus on the other three options instead: **Auto - Center to Center**,
    **Auto - Origin to Internal Origin**, and **Auto - By Shared Coordinates.**


    The **Auto - Center to Center** option means that the AutoCAD geometric center
    will be linked with the Revit model center. This option is only used to link a
    DWG file if we want the workflow to acquire coordinates. In the next section,
    we will explain the workflow for acquiring coordinates in more detail.


    The **Auto - Origin to Internal Origin** option means the AutoCAD origin at the
    X=0, Y=0, and Z=0 coordinates will be positioned in the Revit internal origin.


    The **Auto - By Shared Coordinates** option means that the AutoCAD file has received
    the shared coordinates system from a Revit file, and it will be positioned at
    the correct location.


    # IFC files (*.IFC)


    IFC files are used for interoperability between different BIM software; Revit
    has only one option to import IFC files, which represents a limitation. It would
    be helpful to indicate the options to link, such as **Origin to Internal Origin**
    and **By Shared Coordinates**:


    ![](img/1961add582dd4a589b2eac3dda140e38_209_0.png)


    Figure 4.20 – Linking IFC files


    Autodesk has created the *Revit IFC manual*, which you can download for free at
    https://bit.ly/38cqf0F.'
  merge: -1
  img_proc: true
- pgno: 210
  md: 'Alternatively, you can use the following QR code:


    ![](img/1961add582dd4a589b2eac3dda140e38_210_0.png)


    If you have any problems linking IFC files at the correct location, we recommend
    that you use these two workflows instead:


    +   1. Try to correct or change the project position in the software that is creating
    the IFC files. If this is not possible, use the following workflow.

    +   2. Create a **Revit Container file** and position the IFC files manually at
    the correct location. Once you link the Revit container file using **By Shared
    Coordinates**, the IFC file will display at the correct location:


    ![](img/1961add582dd4a589b2eac3dda140e38_210_1.png)


    Figure 4.21 – Process to use the Revit Container file


    These two workflows will help us to manage issues when positioning the IFC files
    in Revit.


    # Rhino files (*.3DM)


    Many companies use Rhino to design complex geometry, and the Rhino design needs
    to be inserted in Revit for project documentation and to be part of the design
    development.


    Unlike Revit, which has two coordinates systems, Rhino has only one coordinate
    system: the software internal origin at X=0, Y=0, and Z=0.'
  merge: -1
  img_proc: true
- pgno: 211
  md: 'This means that the Rhino Origin at (X=0, Y=0, and Z=0) needs to be located
    at the Revit Internal Origin to ensure that the Rhino model is at the correct
    location:


    ![](img/1961add582dd4a589b2eac3dda140e38_211_0.png)


    Figure 4.22 – Process to use the Revit Container file


    Another possible option is to use a script in Rhino to rotate the model before
    inserting the model geometry to Revit.


    The main point to keep in mind is that the Rhino geometry must be aligned with
    Revit to avoid having to move files manually. The process to translate Rhino geometry
    into Revit has improved with Rhino 7, and the workflow with Rhino.Inside facilitates
    this process.


    There are also a few plugins available to help with the transfer of Rhino geometry
    into Revit:


    +   - BEAM: https://www.mksdtech.com/

    +   - Conveyor: https://provingground.io/tools/conveyor/

    +   - GeometryGym: https://geometrygym.wordpress.com/


    # Point cloud files (*.RCP and *.RCS)


    Point cloud files are used to represent an existing construction, and you can
    verify a Revit model''s existing conditions against the point cloud file.


    When a survey company creates a Revit file for an existing building, we need to
    request that they include the point cloud coordinate system. This will ensure
    that the point cloud is linked in Revit at the correct location without needing
    to move it manually.


    This process can save time and improve accuracy when comparing Revit geometry
    with the point cloud.'
  merge: -1
  img_proc: true
- pgno: 212
  md: 'If the survey company has provided a Revit file with a specific coordinate
    system for the point cloud, follow this process:


    +   1. Click on the Manage tab.

    +   2. Click on Location.

    +   3. Click on Site.

    +   4. Select the coordinate system provided by the survey company.

    +   5. Click on Make Current.

    +   6. Click on OK:


    ![](img/1961add582dd4a589b2eac3dda140e38_212_0.png)


    Figure 4.23 – The point cloud coordinates system'
  merge: -1
  img_proc: true
- pgno: 213
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 214
  md: 'This process improves productivity, as we will avoid having to move files manually.


    When users have the challenges of coordinate systems in mind, better and informed
    decisions will be made. Consequently, this will save time and improve efficiencies.
    Improving performance is not only connected to your company as supporting other
    organizations is essential to achieve a better outcome.


    To conclude, we have learned about the Revit survey point, project base point,
    and Revit internal origin. We have also explained the challenges of the coordinate
    system when linking files from multiple software.


    In the next section, we will learn how to start a Revit project and set up the
    project coordinates system.


    # Starting a Revit project and setting up the project coordinates


    Chapter 2, Project Data Management, described the importance of having precise
    BIM requirements to manage project data and successfully start a BIM project.
    Accordingly, the first process is to start a Revit project by analyzing the following
    documents:


    +   - Appointment or Contract

    +   - Exchange Information Requirements (EIR)

    +   - Asset Information Requirements (AIR)

    +   - BIM Execution Plan (BEP)

    +   - BIM Responsibility Matrix


    We acknowledge that not all projects will provide the preceding documentation
    at the beginning or even during the duration of the project. Nevertheless, if
    this problem appears, we suggest creating a simple BEP with the available information
    and get it agreed upon by the client and the project team.


    The second process is to use the correct Revit template to start the process to
    set up the project. You can use your company template, the template provided in
    Chapter 3, Revit Templates and Standards, or the template that comes with Revit.'
  merge: -1
  img_proc: true
- pgno: 215
  md: <!-- no content -->
  merge: -1
  img_proc: true
