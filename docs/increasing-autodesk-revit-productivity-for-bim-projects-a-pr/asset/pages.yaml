    # Keynote settings


    Keynote is a feature that allows all model elements to be classified based on
    a classification system. This classification system can be internal (that is,
    from the office and based on the internal standard) or industry standard. You
    can access Keynote as shown in the following image:


    ![](img/1961add582dd4a589b2eac3dda140e38_144_1.png)


    Figure 3.40 – Keynote


    By default, the keynote classification system provided is based on the 1995 Construction
    Specification Institute (CSI) Master format.


    Using keynotes is an easy and efficient way of linking the model elements with
    the project specifications. This is because the information will be added to the
    elements and the tag will show the information.'
  merge: -1
  img_proc: true
- pgno: 145
  md: 'This information is derived from an external * .TXT file that contains a key
    value and a description. By default, the file is saved as %ALLUSERSPROFILE%\Autodesk\RVT
    2021\Libraries\<local and language>:


    ![](img/1961add582dd4a589b2eac3dda140e38_145_0.png)


    Figure 3.41 – The keynote file structure


    A new file can be loaded into the project by accessing **Keynoting Settings**,
    on the **Annotate** tab:


    ![](img/1961add582dd4a589b2eac3dda140e38_145_1.png)


    Figure 3.42 – Keynoting Settings'
  merge: -1
  img_proc: true
- pgno: 146
  md: 'There are three different keynote types:


    +   - **The Element keynote**: This is a keynote that is assigned to an entire
    model element.

    +   - **The Material keynote**: This is a keynote that is assigned to a material
    of a model element.

    +   - **The User keynote**: This is a keynote that is assigned per user.


    # Worksets


    When working on a worksharing project (this is a modeling method that allows multiple
    users to work on the same model simultaneously), worksets become crucial as they
    work as a collection of elements.


    When worksets are created, it''s possible to open and close them to improve the
    performance of Revit.


    In the `Revit_Template_Check_List.xls` file, we can find a list of the most common
    worksets that can be used on a project:


    |  |  |

    |---|---|

    | Workset1 | Default Revit Worksets |

    | Shared Levels and Grids | Default Revit Worksets |

    | ABC_CAD_Links | Used to add CAD Links |

    | ABC_Arch_Description_Link | Each Arch file will have an individual workset |

    | ABC_MEP_Links | Used to add MEP files |

    | ABC_STR_Links | Used to add Structure files |

    | ABC_Reference_Planes | Used to add Reference Planes |

    | ABC_Cladding - Exterior | Used to model the Exterior components |

    | ABC_Interiors | Used to model the Interior components |

    | ABC_Site | Used to model the Site components |

    | ABC_FF&E | FF&E = Furniture, Fixtures, and Equipment |

    | ABC_HVAC | MEP Workset |

    | ABC_Plumbing | MEP Workset |

    | ABC_Fire_Protection | MEP Workset |

    | ABC_Electrical | MEP Workset |

    | ABC_Steel | Structure Workset |

    | ABC_Concrete | Structure Workset |

    | ABC_Foundations | Structure Workset |


    Figure 3.43 – The Revit template checklist


    Worksets can only be created on a project file (RVT), when using the worksharing
    tools and environment, and cannot be created in a template (RTE).'
  merge: -1
  img_proc: true
