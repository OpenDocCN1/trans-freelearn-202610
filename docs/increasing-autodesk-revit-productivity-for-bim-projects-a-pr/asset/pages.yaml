- pgno: 84
  md: '# # Information Management


    The Appointing Party (Client) will nominate a person within their organization
    or point to a third-party company to take the Information Management function.


    The list of activities for the Information Management function varies substantially
    from project to project.


    In the *BS EN ISO 19650-2* standard, there is *Annex A*, which is a matrix template
    for Information Management responsibilities.


    # ## AEC UK BIM Protocol


    The **Automatic Exposure Controls (AEC)** (UK) BIM Protocol released in 2015 is
    still relevant for explaining practical functions that are widely used in the
    AEC industry.


    This document assigns activities to three specific areas, outlined as follows:


    +   - Strategic

    +   - Management

    +   - Production


    # ## Strategic – BIM Management


    This role represents the company-wide BIM Manager that defines and takes strategic
    decisions on the BIM implementation and support training.


    The company-wide BIM Manager will perform activities including, but not limited
    to, the following:


    +   - Corporate objectives related to BIM

    +   - Research on technology and new processes

    +   - Developing processes and new workflows

    +   - Developing standards and protocols

    +   - Responsible for the BIM implementation

    +   - Providing training for technology and new processes

    +   - Analyzing or create the BIM documentation (BEP and others)'
  merge: -1
  img_proc: true
- pgno: 85
  md: '# Management – Coordination


    This role represents the BIM Coordinator, who will perform activities including,
    but not limited to, the following:


    +   - Providing team training for technology and new processes

    +   - Analyzing or creating the BIM documentation (BEP and others)

    +   - Auditing BIM models

    +   - Model coordination and clash detection

    +   - Content creation


    # Production – Modeling/Authoring


    This role represents the architects, engineers, designers, and BIM modelers that
    are producing information in the BIM model. They will perform activities including,
    but not limited to, the following:


    +   - Project-specific content creation

    +   - Project-specific modeling

    +   - Project-specific drawing production


    The AEC (UK) BIM Protocol functions can be seen in the following table:


    | Strategic - BIM Management | Management - Coordination | Production - Modelling
    |

    |---|---|---|

    | Corporate objectives related to BIM | Provide team training for technology and
    new processes | Project-specific content creation |

    | Research on technology and new processes | Analyze or create the BIM documentation
    (BEP and others) | Project-specific modelling |

    | Develop processes and new workflows | Audit BIM models | |

    | Develop standards and protocols | Model Coordination & clash detection | |

    | Responsible for the BIM implementation | Content creation | |

    | Training for technology and new processes | | |

    | Analyze or create the BIM documentation (BEP and others) | | |


    Figure 2.4 – AEC (UK) BIM Protocol functions


    It is essential to highlight that these are not job titles, and the same person
    can perform multiple functions.'
  merge: -1
  img_proc: true
- pgno: 86
  md: 'To conclude, the information in this section has provided details about the
    project functions commonly used in the AEC industry and fully defined in the BEP.


    In the next section, we will learn about Asset Management and how it can maximize
    the value of building assets.


    # Asset Management


    **Asset Management** is a process to support building owners to maximize the value
    of their asset by providing strategic and operational services.


    The lifespan of a building and utilities are limited, and the building life cycle
    after the construction stage represents the highest cost for real estate owners.
    If we take into consideration a period of 25 years, it is estimated that the cost
    to operate, maintain, and repair a building is around 80% of the total cost of
    ownership.


    This is illustrated in the following diagram:


    ![](img/1961add582dd4a589b2eac3dda140e38_86_0.png)


    Figure 2.5 – Total cost of ownership'
  merge: -1
  img_proc: true
- pgno: 87
  md: 'The importance of Asset Management during the building life cycle is clear,
    yet the AECOO industry still has improvements to make in providing digital and
    structured data to integrate into Asset Management and operational processes.


    Efficiency and productivity will increase if the data created during the design
    and construction stages are flawlessly transferred to the Asset Management digital
    platforms.


    Currently, we still have issues with transferring data between project stages
    and the **Operation/Maintenance (O&M)** manuals into a facility management digital
    system. The main problem is that the available data is not structured, and part
    of the information is on paper or simple **Portable Document Format (PDF)** files.


    This lack of data integration can lead to significant data loss, decreasing productivity
    and increasing the cost of maintaining assets and managing data.


    The expected process to manage data includes a **Common Data Environment (CDE)**
    and full integration with a facility management digital system, as illustrated
    in the following diagram:


    ![](img/1961add582dd4a589b2eac3dda140e38_87_0.png)


    Figure 2.6 – Expected process for data integration


    The Common Data Environment will help to collect the data during the design and
    construction stages in the form of BIM models, drawings, and product data. This
    information becomes integrated with the facility management digital system.


    When the Operation / Maintenance Manuals (O&M) are digital and structured, these
    will be integrated into the facility management digital system, which completes
    the ideal process.


    Unfortunately, the data integration is still fragmented in many projects, leading
    to data loss and inefficiencies.


    It is still common to find projects using private servers to exchange data during
    the design stage and only utilizing a CDE in the construction stage, which can
    cause data loss.'
  merge: -1
  img_proc: true
- pgno: 88
  md: 'There are also potential data losses between the CDE and the facility management
    digital system if the integration is not established, as the information needs
    to be structured to enable this process.


    Data loss can also occur when the O&M manuals are not digital or organized with
    structured data, as illustrated in the following diagram:


    # Possible Data Loss:


    ![](img/1961add582dd4a589b2eac3dda140e38_88_0.png)


    Figure 2.7 – Possible data loss without data integration


    Private clients and the UK Government share a similar strategy to improve this
    process by utilizing COBie as a BIM requirement.


    # COBie


    **Construction Operations Building Information Exchange (COBie)** is an international
    standard to support Asset Management processes that include space and equipment.
    It provides the required information post-completion and product data from the
    construction team to the operational team.


    > Tip

    > COBie doesn''t add new requirements to typical contractual delivery. It just
    changes the format of existing deliverables to an open and international standard
    format.


    COBie is a subset of **Industry Foundation Classes (IFC)**, and the most common
    representation is a spreadsheet. Depending on the facility management system,
    the process to import data can be different.'
  merge: -1
  img_proc: true
- pgno: 89
  md: "# COBie spreadsheet information\n\nA COBie spreadsheet contains information\
    \ about the facility, such as floors and spaces; a list of products; further details\
    \ on the warranties; and other aspects connected to the Asset Management process.\n\
    \nOne COBie file should be provided per each facility on the project. Having said\
    \ that, if there are multiple facilities, additional COBie files should be provided.\
    \ All deliverables should be compliant with the Facility Management handover requirements.\n\
    \nA typical COBie spreadsheet is shown in the following screenshot:\n\n![](img/1961add582dd4a589b2eac3dda140e38_89_0.png)\n\
    \nFigure 2.8 – Typical COBie spreadsheet\n\nThe main COBie objective is to provide\
    \ structured data at handover to the Facility Management team and increase efficiency\
    \ to manage building assets. Without structured data, the AECO industry will not\
    \ be able to reach a high level of efficiency in managing data, and this could\
    \ potentially affect the development of Digital Twin technologies.\n\nThe project\
    \ owner or client has the responsibility to define the Asset Management and COBie\
    \ requirements, and it needs to be aligned with the Facility Management team's\
    \ requirements and capabilities.\n\n> **Tip**\n> \n> It is essential to meet and\
    \ engage with the Facility Management team at the beginning of the project to\
    \ verify the Asset Management and COBie requirements."
  merge: -1
