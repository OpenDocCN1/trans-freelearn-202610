    of team productivity in Revit and BIM:


    ![](img/1961add582dd4a589b2eac3dda140e38_23_0.png)


    Figure 1.1 – Investment in training


    Another common issue is when a team member does not have time to attend the Revit
    training, or they decide to learn Revit on a live project. This process will give
    you the false feeling that these team members are ready to work in Revit, and
    the optimal level of productivity will take longer to achieve.


    In this situation, the trainer needs to provide short slots of training to improve
    their Revit knowledge and avoid mistakes on the project.


    In this example, providing training at the right time improves productivity and
    reduces the time to reach the ROI.'
