- pgno: 359
  md: 'In the next section, we will learn how to export data from a Revit model, import
    the data into Microsoft Power BI, and create quick and nice dashboards.


    # # Exporting and importing data from Revit to Power BI


    This chapter aims to export data from the BIM model, import it back into Microsoft
    Power BI, and produce a dashboard that will allow us to perform a proper analysis
    based on the data extracted.


    To go through this topic, we will be using the datasets available from *Chapter
    7*.


    # ## Connecting Revit to Power BI: An introduction to visualizing model data


    In Revit, it is quite simple to export data from the model without using any plugin
    or even a Dynamo graph. Exporting directly from Revit, this can basically be done
    in two steps:


    +   1. Create a schedule with all the data that needs to be exported.

    +   2. Export the schedule as a TXT file.


    If using a Dynamo graph, this can be done in two steps as well:


    +   1. Create/open a Dynamo graph.

    +   2. Export the data as an Excel file.


    After exporting this data, it can be opened with Excel or imported into Microsoft
    Power BI.


    # ### Creating schedules in Revit


    Creating schedules in Revit is simple, and as it works as a data source, we can
    extract the data related to the objects to be scheduled. Almost all objects can
    be extracted, and as they are still connected with the model, it will be updated
    if any design change is implemented in the model when opening the file or refreshing
    the data if the Microsoft Power BI report is open.'
  merge: -1
  img_proc: true
- pgno: 360
