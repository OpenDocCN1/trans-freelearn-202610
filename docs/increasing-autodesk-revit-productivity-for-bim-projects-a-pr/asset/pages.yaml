- pgno: 159
  md: '# # Graphic standards


    In this section, we will be covering the main settings that are available to control
    the graphics in Revit. This is an important topic, as it will affect both productivity
    and consistency across all construction drawings.


    We will be covering the following:


    +   - Line patterns

    +   - Line styles

    +   - Line weights

    +   - Object styles

    +   - Fill patterns

    +   - Material library

    +   - View templates

    +   - Filters

    +   - Color fill legend schemes

    +   - Phases

    +   - Exporting to DWG

    +   - Arrowheads


    # ## Line patterns


    In Revit, you can create line patterns. These line patterns are created by combining
    dashes and dots with blank spaces between them. Dashes and spaces can have specific
    dimensions.


    These line patterns can be combined with colors to define a line style (this will
    be covered later).'
  merge: -1
  img_proc: true
- pgno: 160
  md: 'Follow these steps to create a line pattern:


    +   1. From the Ribbon, click on **Manage**, and in **Additional Settings**, click
    on **Line Patterns**:


