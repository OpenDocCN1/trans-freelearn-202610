  md: '+   - **Model Objects:** With this, you can configure all model objects from
    all disciplines in the project.

    +   - **Annotation Objects:** With this, you can configure all annotation elements
    in the project.

    +   - **Analytical Objects:** With this, you can configure all analytical elements
    (including the structural disciplines and zones) of the project.

    +   - **Imported Objects:** With this, you can configure all of the imported elements
