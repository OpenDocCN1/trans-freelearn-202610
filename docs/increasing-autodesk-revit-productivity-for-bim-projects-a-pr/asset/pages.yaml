- pgno: 310
  md: 'When we have a list of drawings, the project team or the BIM coordinator can
    quickly create all the sheets with the correct names, numbers, statuses, and other
    information. **This process is essential for gaining productivity in delivering
    drawings.** We can automate this process to create multiple sheets directly in
    Revit, or we can use the Dynamo and Revit plugins to speed up this process.


    The key point is to make it clear what deliverables will be produced to the design
    team and assign team members responsibilities regarding drawing production.


    Once the drawings sheets have been created, the project team or the BIM coordinator
    can populate most of the sheets with Revit views, even if the views haven’t been
    completed or are very basic. As the project develops, the drawing sheets will
    start to take form, and the project manager can print the set of drawings to verify
    your progress.


    This initial drawing set is called **Cartoon Set**, which helps you plan project
    deliverables. The Cartoon Set increases efficiency as we can ensure that the drawing
    set includes all the necessary information to be delivered.


    As the projects are developed, the Cartoon Set will become a complete set of drawings,
    which helps ensure that we meet our deadlines smoothly and efficiently.


    > **Tip**

    > Creating multiple drawing sheets at the last minute before the deadline is a
    bad idea!


    # Work with a Good Revit Template


    The drawing''s production efficiency will depend on the Revit template''s quality,
    which will include line weight, view templates, title sheets, and other Revit
    settings.


    In *Chapter 3, Revit Templates and Standards*, we learned how to create and improve
    the Revit template.


    The industry and organization standards included in the template will promote
    consistency across the project(s) and align them with the graphical and technical
    standards.


    # Control Drawing Visibility


    We can control the drawing visibility in multiple ways, such as by using **View
    Templates** and other techniques, but a few processes can help improve productivity
    so that we can create drawings in PDF and DWG format.'
  merge: -1
  img_proc: true
- pgno: 311
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 312
  md: '+   - Shadows will increase the time to create PDF files. Turn off shadows
    if they are not required.

    +   - Check if the linked files are necessary for a specific view. Revit’s performance
    will increase if we unload the unnecessary links.

    +   - Ensure we have installed the latest printer driver or plugin installed to
    print PDF files. In *Chapter 9, Enhancing Productivity with Plugins*, we will
    learn more about Revit plugins.


    In this section, we learned about three factors that can affect productivity when
    we''re producing drawings in Revit.


    # Summary


    In this chapter, we learned about the Revit core functionalities and best practices
    to improve efficiency when working with schedules and keynotes for construction
    specifications. The schedule workflows were divided into Basic and Advanced to
    help cover the essential processes for managing schedules.


    In Revit, keynotes are used to assign construction specifications to Revit components,
    thus increasing productivity and consistency when we''re annotating drawings.


    We then explained the best practices and workflows for Design Options, Phasing,
    and Scope Boxes, which help us to be more efficient in our daily activities when
    we''re working with Revit. We also learned about workflows for Worksharing so
    that we can collaborate with multiple users working simultaneously in the same
    file.


    After that, we presented the three main factors for increasing productivity during
    drawing production, including defining the drawing list, working with a good Revit
    template, and controlling the drawing''s visibility.


    In the next chapter, we will cover visual programming with Dynamo and learn how
    to automate specific tasks in Revit.'
  merge: -1
  img_proc: true
