- pgno: 189
  md: '# View Title


    View Titles are used to provide standard information from the dropped views into
    a sheet. Normally, this provides the View Name, View Scale, and Detail Number:


    ![](img/1961add582dd4a589b2eac3dda140e38_189_0.png)


    Figure 3.94 – Symbols


    This tag will be filled in when dropping the view into a sheet along with the
    view name and view scale from the view that has been dropped.


    # Tags


    A tag is a 2D annotation element that is used to identify elements in a drawing.
    These tags are category-specific, which means every Revit category can have a
    tag to extract information from the host element.


    These elements can be added to the project from the Tag panel, under the Annotate
    tab:


    ![](img/1961add582dd4a589b2eac3dda140e38_189_1.png)


