- pgno: 177
  md: '# Phases


    The Phases feature allows you to work with refurbishment projects. This means
    that the project will be represented on different project stages: before and after
    refurbishment. With this tool, Revit will track the phase elements that are **New,
    Demolished, Existing, and Temporary.**


    This feature can only be applied to model elements. By using phase filtering,
    we can apply color-coding to objects in these four states:


    +   - **Existing:** Elements that exist in the view phase.

    +   - **New:** Elements modeled in the view phase.

    +   - **Demolished:** Existing elements demolished in the view phase (that is,
    when Phase Created and Phase Demolished are different).

    +   - **Temporary:** New elements are demolished in the same phase (that is, when
    Phase Created and Phase Demolished are the same).


    To access the Phases feature, follow these steps:


    +   1. From the ribbon, click on **Manage** and then click on **Phases:**


    ![](img/1961add582dd4a589b2eac3dda140e38_177_0.png)


    Figure 3.78 – The Phases setting'
  merge: -1
  img_proc: true
