- pgno: 57
  md: "# Computer memory (RAM)\n\nDepending on your project requirements, we recommend\
    \ 16 GB of system memory for light users, 32 GB for average users, and 64 GB for\
    \ users with large projects and everyday use.\n\nThe cost of memory (RAM) is declining,\
    \ and if you can afford 64 GB of memory (RAM), it is recommended. In medium and\
    \ large organizations, 64 GB is the minimum requirement.\n\nComputer memory (RAM)\
    \ will improve Revit's performance as it maintains model data in the memory.\n\
    \n> **Tip**\n> \n> It is recommended that you restart the computer and Revit often;\
    \ this will refresh the memory (RAM). Frequently, users who keep Revit open for\
    \ days will experience decreasing performance.\n\n# A fast hard drive\n\n**A Solid\
    \ State Drive (SSD)** provides better performance in Revit, and it allows your\
    \ computer to boot, start applications, and load files many times quicker than\
    \ a traditional hard drive.\n\nDesigners often use multiple applications, such\
    \ as Revit, AutoCAD, Rhino, Navisworks, or Adobe Suite, and various plugins that\
    \ can take up a large amount of space in the hard drive.\n\nThe recommended SSD\
    \ should have a minimum of 500 GB.\n\nIf there is not enough space to cache Revit\
    \ processes, slower performance will occur.\n\n> **Tip**\n> \n> Always keep a\
    \ minimum of 30 GB of free space in the hard drive.\n\nIt is essential to have\
    \ the correct software and hardware to improve performance in Revit, and the preceding\
    \ information will enable you to select the best workstation to maximize performance\
    \ in Revit.\n\nIn the next section, we will learn about successful strategies\
    \ for BIM implementation."
  merge: -1
  img_proc: true
- pgno: 58
  md: "# # Overview of BIM implementation\n\nBIM is a process that many companies\
    \ have already implemented, but it is valuable to have an overview of successful\
    \ strategies.\n\nThe BIM maturity level is critical to analyze the company implementation\
    \ and its capability to deliver a BIM project.\n\nThe BIM implementation does\
    \ not stop with a couple of projects, but it is a process that requires regular\
    \ maintenance and continued development.\n\nThe continuous development will create\
    \ foundations to increase the maturity level of your organization, and it goes\
    \ through multiple departments such as the commercial departments, which will\
    \ analyze contracts and appointments.\n\n> **Tip**\n> \n> Successful strategies\
    \ take the overall company culture into consideration and create a strategic plan\
    \ that is driven from the top-down and involves directors in the decision to implement\
    \ BIM.\n\nSuccessful BIM implementations share these 10 crucial steps:\n\n+  \
    \ 1. Involve directors in the decision to implement BIM with words and actions.\
    \ Implementation starts from the top down!\n+   2. Create a group of people to\
    \ define the implementation process and the overall BIM strategy, which must include\
    \ multiple departments.\n+   3. Remember that the ultimate goal is for better\
    \ information management.\n+   4. Create a small team to work on the first project.\n\
    +   5. Create or adapt your company standards to the local BIM regulations and\
    \ ISO standards.\n+   6. Define the software you will use and support. Understand\
    \ the investments required, including human resources, to implement new technologies.\n\
    +   7. Train and develop your team. Develop some people to be \"champions\" to\
    \ help other people in the company.\n+   8. Improve the BIM process over time\
    \ and don't focus on technology."
  merge: -1
  img_proc: true
- pgno: 59
  md: '9. Set realistic goals because the benefits of BIM are well documented; however,
    you need to invest time and effort to realize the true potential for your organization.


    10. Always remember that information management is the most important aspect of
    the BIM process.


    During the BIM implementation, the organization can create specific areas for
    future developments and support the process to increase the BIM maturity level.


    Areas for continued development include the following:


    +   - Company and industry standards, methods, and procedures

    +   - Training

    +   - The management of digital assets – Revit families, AutoCAD blocks, and other
    files

    +   - Productivity and data analysis


    These four areas should be in continuous development to bring innovation to and
    increase productivity in your organization.


    Many medium and large companies have staff in-house with programming capabilities
    to increase productivity and customize tools to create new workflows.


    If you wish to learn programming to apply in the architectural and engineering
    teams, we recommend Dynamo, Grasshopper, Python, and C#.


    Programming skills can open doors in a professional career and expand your design
    capabilities to get you ahead of the competition.


    Additionally, there are seven other points that you need to dedicate your attention
    to during the BIM implementation process:


    1. Create a BEP template that you will use to respond to the client''s requirements
    for BIM.'
  merge: -1
  img_proc: true
- pgno: 60
  md: '+   2. Define your company''s standard deliverables for BIM according to your
    local framework, such as the UK BIM Framework.


    The UK BIM Framework reference can be found here:


    ```

    https://ukbimframework.org/standards-guidance/

    ```


    Scan the QR code with your mobile camera to access the preceding link:


    ![](img/1961add582dd4a589b2eac3dda140e38_60_0.png)


    +   3. Define the Level of Information Need for BIM projects.


    The Level of Information Need lists the geometric and data requirements of BIM
    components and the project prerequisites. These requirements should be defined
    according to their purpose in order to bring value to the project.


    In the UK, the previous terminology defined in the PAS_1192_2_2013 was Level of
    Model Definition/Level of Detail (LOD)/Level of Information (LOI). The UK is currently
    using Level of Information Need, which is defined in the ISO 19650 series.


    In the US, the BIMForum publishes the Level of Development (LOD).


    Here is the link to the BIMForum website: https://bimforum.org/LOD.


    You can scan the following QR code with your mobile camera to access the preceding
    link:


    ![](img/1961add582dd4a589b2eac3dda140e38_60_1.png)'
  merge: -1
  img_proc: true
- pgno: 61
  md: "+   4. Define the typical BIM deliverables and model purpose that you will\
    \ use as a standard in multiple projects.\n+   \n+   5. Write content to answer\
    \ the **pre-qualification questionnaire (PQQ)** to be used during the bid process\
    \ to define your company's level of experience and capacity to deliver BIM projects.\n\
    +   \n+   6. BIM is affecting contracts and appointments, so the commercial department\
    \ should be aware of the project's BIM requirements.\n+   \n+   7. Align the style\
    \ and presentation standards with your BIM authoring tool, such as Revit.\n\n\
    To conclude, BIM implementation is a process that affects almost all departments\
    \ of companies involved in the AECO industry.\n\nIn the next section, we will\
    \ learn how to create a Revit training scheme for your company.\n\n# # BIM and\
    \ the Revit training scheme\n\nCompanies are using a variety of applications and\
    \ plugins that require training to maintain productivity, and it is essential\
    \ to have a strategic plan for your training scheme.\n\nStrategic goals for your\
    \ training scheme include the following:\n\n+   - Assess staff knowledge.\n+ \
    \  - Identify the current training process.\n+   - Determine the training obstacles.\n\
    +   - Define the training budget.\n+   - Identify in-house experts.\n+   - Establish\
    \ a process to measure progress.\n+   - Identify resources, such as computers,\
    \ training rooms, training material, online video training, company standards,\
    \ and more.\n\nLet's explore each of these strategic goals in detail."
  merge: -1
