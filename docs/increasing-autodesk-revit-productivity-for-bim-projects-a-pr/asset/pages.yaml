- pgno: 414
  md: 'To conclude, we have learned about shared views and the ability to collaborate
    with consultants. In the next section, we will learn about design coordination
    and clash management.


    # Design coordination and clash management


    Design coordination and clash management are essential aspects of consultant collaboration
    to resolve design and model issues. The BEP will define the clash detection process
    and tolerances to optimize the results based on the project design stage. The
    primary tools used to run the clash detection process are **Navisworks** from
    Autodesk and **Solibri** from Nemetschek.


    Autodesk has a cloud platform to run clash detection processes and resolve model
    issues. It is part of Autodesk Construction Cloud and is currently called BIM
    360 Coordinate.


    The clash detection process can be divided into two types:


    +   - Clash avoidance

    +   - Clash detection


    Let''s look at them in detail.


    # Clash avoidance


    Clash avoidance is the process of identifying clashes between spatial zones assigned
    for the architecture, structure, and MEP disciplines. The following diagram shows
    a volume created to define the MEP zone and use it in the clash avoidance process.


    We can also work with large clash tolerances during the clash avoidance process.


    This proactive process can run from the early stages of design and ensure that
    each discipline creates elements inside a specific zone. It will reduce the number
    of clashes when the design teams move to the clash detection process:'
  merge: -1
  img_proc: true
- pgno: 415
  md: '![](img/1961add582dd4a589b2eac3dda140e38_415_0.png)


    Figure 8.33 – Volume to define the MEP zone


    # Clash detection


    Clash detection is the process to identify clashes between two or more elements
    in the pre-construction stages. We compare building categories to run the clash
    detection process, such as structural beams versus ducts and pipes.


    This process does not prevent the clash, but it is a corrective process:


    ![](img/1961add582dd4a589b2eac3dda140e38_415_1.png)


    Figure 8.34 – Clash detection between two elements'
  merge: -1
  img_proc: true
- pgno: 416
  md: '# # Clash management


    Clash management is a collaborative process where design teams and consultants
    exchange models to coordinate and resolve multiple design issues. Communication
    between the consultants is critical to understand the priorities to model and
    resolve design issues.


    # ## Good communication will reduce the number of clashes


    First, let''s identify the common challenges for project coordination. The following
    are typical problems:


    +   - Communication of clashes and issues via email is uncoordinated.

    +   - Poor communication and no transparency to resolve design issues.

    +   - The issue resolutions don''t have a trackable history.

    +   - Identifying model issues in the clash detection software can be time-consuming.

    +   - No clear accountability to resolve model issues.

    +   - Lack of risk management associated with design issues.

    +   - Non-collaborative teams have more difficulties in resolving model issues.


    For these reasons, many companies use other software with advanced features to
    manage clashes and design issues.


    As previously mentioned, the primary tools used to run the clash detection process
    are Navisworks from Autodesk and Solibri from Nemetschek. After identifying the
    clashes, we can upload the clashes to the clash management software.


    The following list is not exhaustive, but this software can be used with Navisworks
    and Solibri for clash management:


    +   - **Revizto:** https://revizto.com/en/

    +   - **BIM Track:** https://bimtrack.co/

    +   - **BIMcollab:** https://www.bimcollab.com/en

    +   - **Autodesk BIM 360 Coordinate:** https://bit.ly/3u24Os0

    +   - **Fuzor:** https://www.kallotech.com


    This clash management software helps to *improve efficiency in managing clashes*
    and *enhance team communication* to resolve design problems.'
  merge: -1
  img_proc: true
- pgno: 417
  md: 'This software can manage not only a clash between two model elements but also
    multiple types of design issues. The following list shows the typical issues that
    can be tracked by using this software:


    +   - Add and exchange comments about the design.

    +   - Add a solution for design issues.

    +   - Add a request for changes.

    +   - Check for data validation.

    +   - Visualize and comment on the typical clash issues between model elements.

    +   - Identify components for replacement.

    +   - Identify defects in the construction.

    +   - Identify modeling errors.

    +   - Add general questions about the design and financial issues.


    When using clash management software, we need to be aware of potential commercial
    and legal issues. The following questions need to be answered to ensure that we
    make the right decisions:


    +   - Who is providing the licenses?

    +   - How many licenses are required for the design team?

    +   - Who is managing the software permissions for users and roles?

    +   - Who is responsible for implementation and training the design team?

    +   - Do we have a contractual agreement to guarantee full access to data uploaded
    to the clash management software during and after construction?

    +   - Can we download the data from this cloud software to keep a copy in our
    private servers?


    These questions are essential points to be raised before using clash management
    software.


    To conclude, clash management software is essential to increase productivity in
    managing clashes and design issues. It will also keep track of the project history
    and increase accountability.'
  merge: -1
  img_proc: true
