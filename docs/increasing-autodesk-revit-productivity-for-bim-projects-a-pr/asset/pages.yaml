    Figure 3.58 – The Line Patterns setting'
  merge: -1
  img_proc: true
- pgno: 161
  md: '2. With the **Line Patterns** window open, you can create, edit, delete, and
    rename line patterns. We recommend that you use a naming convention and create
    only the most commonly used line patterns:


    ![](img/1961add582dd4a589b2eac3dda140e38_161_0.png)


    Figure 3.59 – Line patterns available in the project


    Line patterns can only be created using dashes, spaces, and points.'
  merge: -1
  img_proc: true
