- pgno: 107
  md: '# Revit Template and

    Standards


    Productivity in Revit is directly associated with the quality of **Revit Templates**
    used in projects, including industry and organization standards.


    Revit templates can help to increase efficiency when working in Revit, and your
    company will benefit from consistency across projects.


    The templates save a lot of time by having predefined standards, so Revit users
    don''t have to recreate or adapt the Revit settings for each new project.


    As industry standards evolve, Revit templates need to be revised to include the
    latest developments.


    In January 2019, the BS EN ISO 19650-1 and 2 were published to supersede the BS
    1192:2007+A2:2016 and PAS 1192-2:2013. This implies changes to the Revit templates
    that align with the new ISO 19650 series.


    A Revit template can be created for multiple disciplines, such as architecture,
    structure, and MEP, but it can also be customized for a specific use, such as
    surveys and other usages.


    In this chapter, you will learn how to create a Revit template and manage its
    graphical settings to improve drawings created in Revit. This will include information
    about view templates and how to customize your title block.'
  merge: -1
  img_proc: true
- pgno: 108
  md: 'In this chapter, we will cover the following topic:


    +   - How to create a Revit template


    # Technical requirements


    In this chapter, you will need access to Autodesk Revit. The version used to describe
    all of these exercises is Revit 2021, but you can follow along with another version.
    It''s important to take the following into consideration:


    +   - Different versions might be slightly different from each other.

    +   - Older versions of Revit cannot open files from an earlier version.


    All datasets used for this chapter can be found in the book''s GitHub repository
    at https://github.com/PacktPublishing/-Increasing-Autodesk-Revit-Productivity-for-BIM-Projects.


    # How to create a Revit template


    Revit templates provide consistency and improve productivity in projects. They
    do so by defining graphical and technical settings that align with your organization
    and industry standards.


    The Revit template is not static; it will evolve with improvements for continuous
    development as we adjust it for new standards and workflows.


    As you might already know, Autodesk releases a new Revit version every year. However,
    updating Revit templates for multiple versions can be time-consuming.


    To avoid creating and updating multiple Revit templates in different Revit versions,
    we suggest that you keep the template in the same Revit versions for a few years;
    this could vary between 3 and 4 years. We also recommend that you recreate your
    template from scratch every 5 years.


    To explain this process, let''s assume that your company has a Revit template
    in Revit version 2021. This Revit template in the 2021 version will be used for
    3 to 4 years and updated as required during this period.


    When Autodesk releases Revit 2025, your company will recreate the Revit template
    from scratch, which will include any significant changes from the past 5 years.'
  merge: -1
  img_proc: true
