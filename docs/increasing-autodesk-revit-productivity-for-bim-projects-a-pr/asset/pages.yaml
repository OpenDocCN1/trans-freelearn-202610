- pgno: 305
  md: '+   We can find our synchronization history under the **Show History** option,
    which helps us identify the last person to synchronize the model and its comments:


    ![](img/1961add582dd4a589b2eac3dda140e38_305_0.png)


    Figure 5.88 – Show History


    +   Recreating the Central file requires all users to be out of the project. This
    can also be applied to other maintenance tasks.


    +   To open the Central Model for maintenance, untick the **Create New Local**
    option:


    ![](img/1961add582dd4a589b2eac3dda140e38_305_1.png)


    Figure 5.89 – Opening the Central file


    +   There are two options for issuing Revit models: click **Open** and select
    **Detach from Central** or select the **Transmit model(s)** tool from the **Add-ins**
    tab:


    ![](img/1961add582dd4a589b2eac3dda140e38_305_2.png)


    Figure 5.90 – Issuing Central files'
  merge: -1
  img_proc: true
- pgno: 306
  md: '# Local files


    The following points are essential for managing Local files:


    +   - We should create a new Local file every time we want to open the Revit file.

    +   - Always work from the Local file.

    +   - Never open an old Local file or use the icons on Revit''s opening screen:


    ![](img/1961add582dd4a589b2eac3dda140e38_306_0.png)


    Figure 5.91 – Recent Files – Revit opening screen


    +   - Synchronize frequently. We recommend doing so every 30 minutes or every
    time you make a significant change to the model.

    +   - Avoid keeping the Local file open and inactive for a long period of time.
    It may slow down the Local files of your team, and it will take longer to synchronize.
    If you''re going to a meeting, lunch, or leaving the company in the evening, close
    your Local file.'
  merge: -1
  img_proc: true
- pgno: 307
  md: 'Synchronize the Local file before closing it. We can also save time if we choose
    Relinquish All Mine first before choosing to Synchronize:


    ![](img/1961add582dd4a589b2eac3dda140e38_307_0.png)


    Figure 5.92 – Relinquish All Mine


    If we want to close the file without saving, select the Relinquish all elements
    and worksets option:


    ![](img/1961add582dd4a589b2eac3dda140e38_307_1.png)


    Figure 5.93 – Relinquish all elements and worksets


    Follow the Revit Recommended Settings options from Chapter 1, Introduction to
    Productivity in Revit, to model economically and keep the file sizes small.'
  merge: -1
  img_proc: true
- pgno: 308
  md: '+   Replacing the Consultants model with a new version that must **keep the
    Revit file with the same name** to avoid losing your overwriting settings. When
    you receive a new file, the filename needs to be identical and not have an issue
    date. The filename must not have been revised.


    You may be wondering, how can we identify which model revision is linked to our
    model?


    We create folders for each revision (P01, P02, and so on), and when we link the
    Revit files from these folders, we can check the revisions in the file path by
    going to Manage Links:


    # Folders


    P02 will appear in the Saved Path


    ![](img/1961add582dd4a589b2eac3dda140e38_308_0.png)


    Figure 5.94 – Identifying the Consultants model


    # Upgrading Central Files


    Before we can upgrade Revit files to a new Revit version, we need to consider
    a few factors:


    +   If the project is at a late stage or in the Construction stage, consider working
    in the same version and not upgrading. That being said, if the required version
    is not available in the Autodesk Portal to be downloaded, you may need to ask
    for dispensation from Autodesk to use an old version of Revit.


    +   Before the upgrade, you must get the agreement of the whole team.


    +   Ensure that the Revit plugins you can used in the project can work in the
    new Revit version.


    +   Upgrade a Revit Detached copy to run the tests. If the tests run without problems,
    we can upgrade the main Central file. Select the Detach from Central and Audit
    options:'
  merge: -1
  img_proc: true
