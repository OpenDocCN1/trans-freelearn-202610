    We should repeat this process to create a new Local file every time we want to
    work on a project with Worksharing enabled and Central files.


    After creating the Local file, we can work in the Revit file, but we need to **Synchronize**
    to save our work back to the Central file as necessary. There are two options
    for synchronizing, as shown in the following image:


    ![](img/1961add582dd4a589b2eac3dda140e38_292_1.png)


    Figure 5.69 – Synchronizing to the Central file


    We should **Synchronize** every 30 minutes or every time we make a significant
    change to the model. This will "relinquish" the objects that you have control
    over back to the Central file so that other users can have access to those objects.


