  md: "# View templates\n\nYou can define view templates as a collection of view properties\
    \ that can be controlled and assigned to specific views, ensuring the assigned\
    \ views will use the same view settings and keeping consistency across construction\
    \ documentation sets.\n\nBefore creating view templates, we suggest that you think\
    \ about how the views will be used in your project. For example, they can be organized\
    \ per package:\n\n+   - Site plans\n+   - Floor plans\n+   - Reflective ceiling\
    \ plans\n+   - Elevations\n\nView templates can be accessed as follows:\n\n+ \
    \  1. From the Ribbon, click on **View**. Then, click on **View Templates** and\
    \ **Manage View Templates**:\n\n![](img/1961add582dd4a589b2eac3dda140e38_172_0.png)\n\
    \nFigure 3.71 – Manage View Templates\n\nYou can duplicate existing view templates\
    \ through the new window and rename or delete existing ones.\n\n> **Tip**\n> \n\
    > Another workflow to create a view template is to configure the view as required.\
    \ Then, in the Project Browser, hover the mouse over **View Name**, right-click,\
    \ and click on **Create View Template from View…**"
