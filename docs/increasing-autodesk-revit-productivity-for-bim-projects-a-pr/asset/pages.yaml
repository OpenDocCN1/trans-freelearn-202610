- pgno: 67
  md: '# 2


    # Project Data Management


    Project data management is an essential aspect of efficiency and productivity
    when working with **Building Information Modeling (BIM)** as the authoring software
    is data-centric.


    Organizations are increasingly using processes to drive their business based on
    data analysis for multiple sectors, to improve performance and profitability.
    When using Revit to manage models and data, the principles of data management
    are similar.


    A data-driven culture is growing, and more companies are noticing the value of
    analyzing data for business decisions that promote improvements and disruption
    in the **Architecture, Engineering, Construction, Owner Operator (AECOO)** industry.


    Companies use a **data management plan (DMP)** to outline how data will be used
    during and after a project''s completion. BIM projects will start by creating
    similar documents to support the project development, such as the **Exchange Information
    Requirements (EIR)**, the **BIM Execution Plan (BEP)**, and others.


    This chapter will provide information about critical points for data management
    associated with BIM projects. We will learn how to start a Revit project successfully,
    taking these key points into consideration.


    The chapter will also explain the crucial aspects of an Appointment/Contract;
    project functions in a BIM project; an overview of BIM documentation; challenges
    with **Construction Operations Building Information Exchange (COBie)**; and establishing
    an action plan to start a BIM project.'
  merge: -1
  img_proc: true
