- pgno: 400
  md: '# Copy/Monitor and Coordination Review


    The **Copy/Monitor** command enables Revit to copy elements from a linked file
    and monitor whether these elements change.


    We can use Copy/Monitor for the following Revit categories:


    +   - Levels

    +   - Grids

    +   - Columns

    +   - Wall

    +   - Floors

    +   - Openings

    +   - Multiple MEP fixtures categories


    The main Revit categories used with Copy/Monitor are levels and grids. The other
    categories are not frequently used because we expect design changes; therefore,
    monitoring the elements is not recommended.


    Copy/Monitor has three main functions:


    +   - Identifies mistakes when levels and grids are inappropriately changed

    +   - Ensures better project coordination for levels and grids

    +   - Increases productivity to create/copy levels and grids


    We usually start a Revit project by creating the levels and grids, and often,
    this task is assigned to the design leader or project BIM lead. Once the Revit
    file is created with the correct coordinates, levels, and grids, it is sent to
    other companies or consultants to copy the levels and grids and start their files.


    Suppose you are the design lead and your project has multiple Revit models, such
    as the cladding, interior, and site models. In that case, you can copy/monitor
    the levels and grids across various models.


    Let''s learn how to use Copy/Monitor for levels and grids in the following steps
    (let''s assume that we are a consultant and we have received a Revit file with
    levels and grids from the design lead or BIM consultant to copy and coordinate):'
  merge: -1
  img_proc: true
