- pgno: 441
  md: '![](img/1961add582dd4a589b2eac3dda140e38_441_0.png)


    Figure 10.1 – Import CAD


    Tip

    We might need Revit plugins or a Dynamo script to find imported CAD files.


    The following recommendations should be used to avoid reducing performance in
    Revit:


    +   - When working in a worksharing environment, ensure that all imported/linked
    CAD files are placed in the correct workset.

    +   - Importing CAD files must be avoided.

    +   - Linking CAD files should be limited to a minimum.

    +   - Before importing or linking a CAD file, ensure it is cleaned and purged
    and only shows what is required for the project.

    +   - It''s not recommended to have CAD files bigger than 10 MB.

    +   - Make sure that you keep CAD files linked that are really needed.

    +   - Ensure that all files have the correct links (links not found take longer
    to open, save, and synchronize a file). In Manage Links, we can find the link
    status.

    +   - When working with imported and/or linked CAD files, it is essential to use
    Zoom Extents in AutoCAD to ensure that we don''t have any elements far away from
    the model (if that happens, the CAD file should be edited to delete the unnecessary
    elements).

    +   - Before importing and/or linking CAD files, make sure all objects in the
    file are using Linetype and Colour as ByLayer as this will allow editing these
    properties from Revit.

    +   - Depending on the project, we recommend creating a Revit model to link all
    the CAD files needed.

    +   - We should never explode a DWG file inside of a Revit project.'
  merge: -1
  img_proc: true
- pgno: 442
  md: '+   When setting up CAD elements with **Index Colours** in the CAD software,
    defining a line weight during the importing process is possible. The **Line Weight**
    settings should be defined before importing and/or linking by clicking the **Import
    Line Weights** option:


    ![](img/1961add582dd4a589b2eac3dda140e38_442_0.png)


    Figure 10.2 – Import Line Weights settings


    +   When linking DWGs, use **Current view only** if possible. When importing a
    DWG into Revit, it''s possible to have it as a 3D element (visible in 3D) or a
    2D element (which will be visible only in the current view when imported or linked).
    By selecting this option, the link file will be flattened into the current view,
    and it will have less impact on the overall model:


    ![](img/1961add582dd4a589b2eac3dda140e38_442_1.png)


    Figure 10.3 – Linking CAD format options


    +   CAD Import for Detail Components to create construction details. When creating
    **Detail Items** families, it is not possible to link CAD files, and we can only
    import CAD files. As mentioned previously, we can control the line weight before
    importing DWG files:


    ![](img/1961add582dd4a589b2eac3dda140e38_442_2.png)


    Figure 10.4 – Importing CAD files into detail item families'
  merge: -1
