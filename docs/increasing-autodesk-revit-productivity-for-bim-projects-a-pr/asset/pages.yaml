- pgno: 315
  md: '# 6

    Visual Programming with Dynamo


    Visual programming enables users to create a script by changing graphical elements
    rather than text programming, which is the typical process for developing a code.
    Basically, we are creating algorithms without writing code:


    ![](img/1961add582dd4a589b2eac3dda140e38_315_0.png)


    Figure 6.1 – Dynamo graphical elements


    Users don’t require any programming experience to start using visual programming
    applications, such as Dynamo, and automate Revit tasks, but it requires dedication
    to learn and master a new process.


    Dynamo is an open source software that enables visual programming for Revit, Civil
    3D, and other software.'
  merge: -1
  img_proc: true
- pgno: 316
  md: 'The principles of Dynamo follow three basic processes:


    **INPUT + FUNCTIONS AND OPERATIONS + OUTPUT**


    We will be able to increase productivity in Revit by using Dynamo to automate
    multiple workflows and complete repetitive tasks quickly.


    This chapter will provide you with a basic knowledge of Dynamo and demonstrate
    the importance of mastering this application to increase efficiency in Revit.


    The chapter will also provide you with an introduction to Dynamo, show the most
    commonly used Dynamo packages, and explain how to use certain workflows with Dynamo.


    The following topics will be covered in this chapter:


    +   - Dynamo

    +   - Expanding Dynamo

    +   - Best practices


    # Technical requirements


    In this chapter, you will need access to Autodesk Revit. The version used to describe
    all of these exercises is Revit 2021, but you can follow along with another version.
    It''s important to take the following into consideration:


    +   - Different versions might be slightly different from each other.

    +   - Older versions of Revit cannot open files from an earlier version.


    All datasets used for this chapter can be found in the book''s GitHub repository
    at

    `https://github.com/PacktPublishing/-Increasing-Autodesk-Revit-Productivity-for-BIM-Projects`.


    # Introducing Dynamo


    Productivity in business is a significant factor for a company''s performance.
    Increasing productivity is a process for working smarter in a pre-defined time
    frame to match your project deadline.'
  merge: -1
  img_proc: true
- pgno: 317
  md: 'Productivity methodologies are as follows:


    +   - Time management

    +   - Tasks completed by the workforce

    +   - Personal performance

    +   - Ratio to manufacture a product


    Dynamo will increase productivity by improving your performance to complete a
    repetitive task and work with complex geometry.


    Dynamo is an open source application that can be used as a standalone *Sandbox*
    or connected with other software, such as Revit, Maya, Civil3D, or any other application
    that has an **API** (short for **Application Programming Interface**) available.


    It is designed to expand Revit''s capability by automating processes and workflows.
    It will not add new tools to Revit, but it will help to automate existing tools
    for almost unlimited tasks and modeling processes.


    Let''s start by accessing Dynamo from Revit:


    +   1. Open a new Revit project.

    +   2. From the **Manage** tab, go to the **Visual Programming** panel.


    ![](img/1961add582dd4a589b2eac3dda140e38_317_0.png)


    Figure 6.2 – Visual Programming panel


    +   3. Click on **Dynamo.**'
  merge: -1
  img_proc: true
- pgno: 318
  md: 'After clicking, the **Dynamo** window will appear:


    ![](img/1961add582dd4a589b2eac3dda140e38_318_0.png)


    Figure 6.3 – Dynamo canvas


    For more information about Dynamo, please refer to the following link:


    ```

    https://bit.ly/3b9vxxa

    ```


    QR code:


    ![](img/1961add582dd4a589b2eac3dda140e38_318_1.png)'
  merge: -1
  img_proc: true
