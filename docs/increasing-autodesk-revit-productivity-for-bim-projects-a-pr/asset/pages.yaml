- pgno: 222
  md: 'We recommend using this process to set up all Revit projects; the methodology
    to link Revit files will be **By Shared Coordinates.**


    There are multiple options to link Revit files, but if you always use **Auto -
    By Shared Coordinates**, all of the projects will be set up in the same way. This
    will increase your performance and reduce any potential mistakes.


    # True North and Project North


    Now, we need to set up the Revit **True North** and **Project North.**


    +   - True North is the real-world North position acquired from the survey files
    or OS Maps.

    +   - Project North is the position that we want to rotate the project to facilitate
    the modeling process with walls in a 90-degree axis and that can best fit the
    drawing sheets.


    We can find True North in survey files or OS Maps, as shown in the following screenshot:


    ![](img/1961add582dd4a589b2eac3dda140e38_222_0.png)


    Figure 4.39 – True North from the Survey file'
  merge: -1
  img_proc: true
- pgno: 223
  md: 'Now, let''s learn how to select the best position to rotate Project North.


    In this process, we need to choose a line in the survey file that we want to be
    either horizontal or vertical. We will select the line in the South façade to
    be horizontal. Please refer to Line to be horizontal in the following screenshot:


    ![](img/1961add582dd4a589b2eac3dda140e38_223_0.png)


    Figure 4.40 – Survey file with a selected line to be horizontal'
  merge: -1
  img_proc: true
- pgno: 224
  md: 'Now, we can start the process to rotate Project North, as follows:


    +   1. In the **Manage** tab, select **Position**, and then click on **Rotate
    Project North**:


    ![](img/1961add582dd4a589b2eac3dda140e38_224_0.png)


    Figure 4.41 – Rotate Project North'
  merge: -1
  img_proc: true
- pgno: 225
  md: '2. We should see the following options. Select the Align selected line or plane
    option:


    ![](img/1961add582dd4a589b2eac3dda140e38_225_0.png)


    Figure 4.42 – The Align selected line or plane option


    3. Select the line, as indicated in the following screenshot:


    ![](img/1961add582dd4a589b2eac3dda140e38_225_1.png)


    Figure 4.43 – Selecting the line in the survey file'
  merge: -1
