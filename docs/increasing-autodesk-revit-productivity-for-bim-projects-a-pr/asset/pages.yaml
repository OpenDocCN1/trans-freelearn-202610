- pgno: 346
  md: 'In the next section, we will describe what should be the best practices when
    creating a graph.


    # Best practices


    When constructing a graph, it is quite common to add nodes all over the place:


    ![](img/1961add582dd4a589b2eac3dda140e38_346_0.png)


    Figure 6.41 – A disorganized Dynamo graph


    When a graph becomes more complex, it will be hard to read or even to maintain.
    For that reason, it is essential when a user is developing a script to keep it
    organized as much as possible. This becomes a critical aspect when it is distributed
    across multiple teams.


    As best practices, we recommend the following:


    +   - Organize the graph properly:

    +     a. Group the graph as much as possible into different functionalities.

    +     b. Order the script from left to right.

    +     c. When having parallel processes at the same time, order the script vertically:


    ![](img/1961add582dd4a589b2eac3dda140e38_346_1.png)


    Figure 6.42 – A properly structured Dynamo script'
  merge: -1
  img_proc: true
- pgno: 347
  md: '+   - Name everything properly:

    +     a. All groups should be named with a clear title indicating the group''s
    overall function (with a large font size to be visible when zoomed out).

    +     b. All code blocks, custom nodes, Python nodes, and other useful objects
    should be appropriately named in an informative way to help users understand the
    whole graph better.

    +     c. Name the parameters/code block variables:


    ![](img/1961add582dd4a589b2eac3dda140e38_347_0.png)


    Figure 6.43 – Groups and nodes appropriately named


    +   - Use a Color Code for the groups according to the categories used:

    +     a. Input

    +     b. Control

    +     c. Function

    +     d. Output


    ![](img/1961add582dd4a589b2eac3dda140e38_347_1.png)


    Figure 6.44 – Color code for groups'
  merge: -1
  img_proc: true
- pgno: 348
  md: '+   - Add, as many as are required:

    +     a. If required, add them as a panel or note.

    +     b. Additional information should be added when required:


    ![](img/1961add582dd4a589b2eac3dda140e38_348_0.png)


    Figure 6.45 – Notes added to the graph


    All this extra information will make the script easier to read as it will identify
    whatever should be used and whatever needs to be understood before using the script.


    As this script might be used for a large number of team members and may be shared
    across projects and teams, it is essential to add some valuable information, including
    the following:


    +   - **TITLE**: This is what the script does in general.

    +   - **AUTHOR''S NAME**: If, for some reason, there is a problem with the script
    and it needs to be amended or explained, you know who to ask.

    +   - **DESCRIPTION**: This option explains what the script will do.

    +   - **DATE**: This is when the script was developed.

    +   - **DEPENDENCIES**: This option indicates which packages are required in order
    to use the script, and which versions per package.'
  merge: -1
  img_proc: true
