- pgno: 419
  md: '# 9


    # Enhancing

    Productivity with

    Plugins


    Revit plugins can enhance productivity by providing new functionalities and can
    expand the current Revit tools. Third-party plugins work in the full Revit version,
    but unfortunately, the Revit LT version does not support them.


    Plugins are simple to implement as it does not require programming skills to develop
    or use a specific application. The installation process is straightforward, and
    we will learn how to manage Revit plugins to avoid potential conflicts and a reduction
    in Revit performance.


    We will learn how to enable and disable Revit plugins to test performance or if
    the plugin is crashing Revit projects. We will find many exciting plugins in the
    Revit Autodesk App Store to improve productivity from multiple areas and disciplines.
    We can also find plugins directly from the developer websites, which will be presented
    in this chapter.


    There are many free plugins available, but some of the paid plugins can also provide
    you with an excellent cost-benefit.'
  merge: -1
  img_proc: true
- pgno: 420
  md: 'This chapter will provide information about the most-used Revit plugins to
    increase productivity in your projects. The plugins are divided into categories,
    including productivity and visualization.


    The following topics will be covered in this chapter:


    +   - Managing Revit plugins

    +   - Revit plugins


    # Managing Revit plugins


    Autodesk tries to improve Revit every year with a new release, but third-party
    plugins are necessary to increase productivity and run essential functions, such
    as batch printing PDF files.


    We can download plugins from the Revit Autodesk App Store or directly from the
    developer website.


    The Revit Autodesk App Store can be found at https://bit.ly/3uleRbQ.


    The QR code is as follows:


    ![](img/1961add582dd4a589b2eac3dda140e38_420_0.png)'
  merge: -1
  img_proc: true
- pgno: 421
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 422
  md: 'In the Revit Autodesk App Store, we can find a menu that organizes the plugins
    by specific functionality:


    ![](img/1961add582dd4a589b2eac3dda140e38_422_0.png)


    Figure 9.2 – Revit Autodesk App Store menu


    We can also access the Revit Autodesk App Store by clicking on the icon at the
    Revit screen''s top right:


    ![](img/1961add582dd4a589b2eac3dda140e38_422_1.png)


    Figure 9.3 – Icon to access the Revit Autodesk App Store'
  merge: -1
  img_proc: true
- pgno: 423
  md: "In the Revit Autodesk App Store, we can find free and paid plugins.\n\nBefore\
    \ installing plugins, check with IT and your technology leader that the plugin\
    \ is suitable for your workflow and whether you can download or request it to\
    \ be installed on your system.\n\nWe also need to check before upgrading any project\
    \ from one version to another to ensure that all plugins used are already available\
    \ in the new version to avoid any impact on the current workflow.\n\nYou also\
    \ need to check whether the plugin is compatible with your current Revit version\
    \ and see whether it has been recently updated. Click on the Revit plugin to find\
    \ information about the release date, last updated date, and compatible Revit\
    \ versions:\n\n![](img/1961add582dd4a589b2eac3dda140e38_423_0.png)\n\nFigure 9.4\
    \ – Information about a Revit plugin\n\n> **Tip**\n> \n> It is recommended to\
    \ close Revit before the plugin installation."
  merge: -1
  img_proc: true
- pgno: 424
  md: 'When we open Revit after the plugin installation, the following message will
    appear. The **Always Load** option must be selected to avoid issues:


    ![](img/1961add582dd4a589b2eac3dda140e38_424_0.png)


    Figure 9.5 – Option to always load Revit plugins


    If we select **Do Not Load**, it will create two issues:


    +   - The app will still be installed on your PC, taking up valuable space on
    your hard drive.

    +   - If we decide to use the plugin, we first need to uninstall and then reinstall
    the plugin.


    # Let''s learn about security!


    In terms of security, we should give preference to apps that have been signed
    with a certificate provided by Microsoft and from trusted publishers.


    In the following figure, we can see a comparison between unsigned and signed plugins.
    We can identify whether the plugin has been signed with a certificate.'
  merge: -1
  img_proc: true
- pgno: 425
  md: 'The following windows will appear after the installation when you start Revit.
    Refer to the arrows pointing out the differences:


    ![](img/1961add582dd4a589b2eac3dda140e38_425_0.png)


    Figure 9.6 – Unsigned and signed plugins


    If the plugin is unsigned, we should check whether the developer is a trusted
    company.


    # Removing Revit plugins


    Plugins will slow down the Revit startup, but this slowdown is minimal, so we
    don''t need to worry about it.


    On the other hand, plugins can conflict with other plugins or affect a specific
    functionality in Revit, which will slow down and may crash projects.'
  merge: -1
  img_proc: true
- pgno: 426
  md: 'If you are experiencing problems, you can remove the plugin from Windows |
    Control Panel and test Revit without the plugin:


    ![](img/1961add582dd4a589b2eac3dda140e38_426_0.png)


    Figure 9.7 – Windows Control Panel option to remove plugins


    If the plugin removal is not successful, or the plugin does not appear in the
    list to be removed, we need to uninstall the plugin manually.


    Removing plugins manually can be challenging as you need to find them in multiple
    locations in your C:\hard drive.


    We can find Revit plugins installed in the following paths:


    +   - C:\ProgramData\Autodesk\Revit\Addins\

    +   - C:\Users\%Username%\AppData\Roaming\Autodesk\Revit\Addins\

    +   - C:\ProgramData\Autodesk\ApplicationPlugins

    +   - C:\Program Files\Autodesk\Revit 2021\AddIns


    > Note

    > You may need to select the folder based on the Revit version.


    Once we find the required plugin, we can select and delete the files to remove
    from Revit.


    If you wish to test Revit without the plugin, you can move the plugin files to
    another folder and restart Revit. After testing, you can move the plugin back
    to the same folder.'
  merge: -1
  img_proc: true
