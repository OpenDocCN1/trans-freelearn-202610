- pgno: 72
  md: "> **Tip**\n> \n> A BEP is the roadmap that guides a project to a successful\
    \ BIM implementation. Companies need to work in collaboration to produce the BEP\
    \ and create it with the end user in mind. That is an essential principle for\
    \ a successful implementation.\n\n# BIM Execution Plan (BEP) – Pre-contract\n\n\
    A pre-contract BEP is used during the tender process to demonstrate the company's\
    \ capability to deliver the project based on the EIR requirements.\n\nThe pre-contract\
    \ BEP should respond to the EIR requirements with the deliverable strategy and\
    \ should include the collaboration process, key milestones, and the **Project\
    \ Implementation Plan (PIP)**.\n\nThe PIP is part of the BEP, and each company\
    \ bidding to a project should provide this to demonstrate their capability, experience,\
    \ and competence in delivering a BIM project.\n\n# BIM Execution Plan (BEP) –\
    \ Post-contract\n\nWhen the contract is awarded, a post-contract BEP is created\
    \ in collaboration with all Appointed Parties to agree on the standards, methods,\
    \ and procedures to be used in the project and respond to the client’s BIM requirements.\n\
    \nA BEP is typically divided into four areas, outlined as follows:\n\n**Management\
    \ and commercial requirements**\n\n+   - BEP Introduction and Purpose\n+   - Project\
    \ Information\n+   - Project Teams—Function and Responsibility\n+   - BIM Project\
    \ Standards\n+   - Response to the EIR mapping and variances\n+   - BIM Strategic\
    \ Objectives\n+   - Model Purposes\n+   - BIM Deliverables\n+   - Coordination\
    \ Meetings\n+   - Project Milestones"
  merge: -1
  img_proc: true
