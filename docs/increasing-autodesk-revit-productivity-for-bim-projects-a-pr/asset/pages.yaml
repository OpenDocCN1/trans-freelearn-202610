- pgno: 444
  md: '# Close hidden windows


    When working with too many views opened, it will affect performance. It is recommended
    to keep the minimum number of views open. Views can be closed by accessing the
    View tab and clicking on **Close Inactive**:


    ![](img/1961add582dd4a589b2eac3dda140e38_444_0.png)


    Figure 10.6 – Closing inactive views


    # Delete unnecessary views and sheets


    By deleting unnecessary views and sheets, it will improve the file size and performance.


    If a Revit file has too many sheets and the overall file size can''t be reduced,
    we may need to split the model into two volumes and divide the number of sheets
    present on the models to reduce the file size.


    # Far clip sections and elevations


    When working with sections or elevations, the **Far Clipping** area should be
    minimized as required. This will improve performance as the geometry hidden by
    other elements in the view will not be affected when regenerating the view.


    This option can be controlled in two different ways:


    +   - When doing the section or elevation on a floor plan by controlling the depth
    when the section or elevation symbol is selected:


    ![](img/1961add582dd4a589b2eac3dda140e38_444_1.png)


    Figure 10.7 – Section view depth controllers'
  merge: -1
  img_proc: true
- pgno: 445
  md: '+   In a section view, we can access the properties, change the Far Clipping
    settings, and define a precise Far Clip Offset value:


    ![](img/1961add582dd4a589b2eac3dda140e38_445_0.png)


    # View the range on floor plans


    Like Far Clipping, on a floor plan, there is a parameter where we can control
    the view depth: View Range.


    View Range controls the view depth, affecting how many elements will be displayed
    and, consequently, affecting performance:


    ![](img/1961add582dd4a589b2eac3dda140e38_445_1.png)'
  merge: -1
  img_proc: true
