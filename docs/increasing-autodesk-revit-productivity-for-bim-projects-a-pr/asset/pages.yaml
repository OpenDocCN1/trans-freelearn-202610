- pgno: 69
  md: "+   - **Legal aspects**: Analyze the BIM requirements in the appointment and\
    \ identify legal issues.\n+   - **Data curation**: Define processes for data validation\
    \ usually described within the **Common Data Environment (CDE)** and data interoperability.\n\
    +   - **Data storage and usage**: Identify the organization's internal and cloud\
    \ data storage for business continuity. This also includes procedures for data\
    \ usage, collaboration, and operation.\n\nThree key documents will provide critical\
    \ data to start a BIM project, as follows:\n\n+   - Appointment or Contract\n\
    +   - Exchange Information Requirements (EIR)\n+   - BIM Execution Plan (BEP)\n\
    \nThere are other documents available in BIM projects, and these will be referenced\
    \ in the aforementioned critical documents.\n\nTo start a BIM project, digital\
    \ data will also be required, such as the survey files or legacy data.\n\n# Appointment\
    \ or Contract\n\nThe Appointment or Contract will define the scope of work, and\
    \ further details are included in the BIM Responsibility Matrix.\n\nWhen checking\
    \ the Appointment, it is essential to identify specific BIM activities that can\
    \ increase the project risk or require extra time to complete. These activities\
    \ need to be raised with the Commercial Department to adjust the project fees,\
    \ if necessary.\n\nIt is common to see Bids and Appointments that mention BIM\
    \ ISO Stage 2 but do not provide any detail on how the projects should be delivered,\
    \ which will increase the project risk. In a situation where the client does not\
    \ provide information, the lead appointed party should create a BEP with standard\
    \ deliverables.\n\n> **Tip**\n> \n> Define what your company considers the minimum\
    \ deliverables for BIM ISO Stage 2 or BIM according to a local framework, such\
    \ as the UK BIM Framework. This will be useful for Bids and Appointments that\
    \ have not specified their BIM requirements."
  merge: -1
