  md: 'To improve this process, it''s recommended that you create a folder called
    Revit_20XX_Local_Files (where 20XX is the Revit version), so the Revit files will
    not mix with any other files located in the Documents folder:


    ```

    C:\Users\<username>\Documents\ Revit_20XX_Local_Files\

    ```


    Default path for user files:


    C:\Users\username\Documents\Revit_2021_Local_Files


    Figure 1.6 – The path for Revit local files


    > **Tip**

    > The location might differ depending on the Revit Options you have set. This
    information will be saved in the Revit.ini file and used for future Revit sessions.


    # Temporary Windows files


    Applications that are being used by the user normally create temporary files and
    often. Therefore, users should delete them on a regular basis.


    Before running this process, make sure that all Revit sessions are closed.


    To access this folder, perform the following steps:


    +   1. Open **Windows Explorer**.

    +   2. In the top bar address, type in `%temp%` and press Enter:

    +   3. Select all of the files and click on **Delete**. If a warning window pops
    up, ignore all of the read-only files (these are being used by the applications
    and cannot be deleted at that moment).


    ![](img/1961add582dd4a589b2eac3dda140e38_29_0.png)


    Figure 1.7 – Temporary Windows files location'
