- pgno: 351
  md: '# 7


    # Dashboard Analyses

    with Power BI


    Data science in construction is an emerging sector with a vast potential to improve
    businesses in multiple areas, such as predicting design or construction issues,
    risk analysis, and optimizing building assets.


    Companies are using data-driven workflows to understand data and increase certainty
    in business decisions. Dashboard analyses can help us to understand data with
    graphics and support companies to make better decisions in the project environment.
    It provides an efficient way to analyze building data, and BIM software is a data
    resource that we can use for multiple analyses.


    There are many applications for producing dashboards, but we will use Microsoft
    Power BI in this book. This chapter will introduce Power BI for Revit to enable
    you to progress into more advanced workflows with Power BI.


    The chapter will also explain the process of exporting and importing data from
    Revit to Power BI and analyzing data with Power BI.


    The following topics will be covered in this chapter:


    +   - Introduction to Power BI for Revit

    +   - Exporting and importing data from Revit to Power BI

    +   - Analyzing Revit data with Power BI'
  merge: -1
  img_proc: true
- pgno: 352
  md: '# # Technical requirements


    In this chapter, you will need access to Autodesk Revit. The version used to describe
    all of these exercises is Revit 2021, but you can follow along with another version.
    It''s important to take the following into consideration:


    +   - Different versions might be slightly different from each other.

    +   - Older versions of Revit cannot open files from an earlier version.


    All datasets used for this chapter can be found in the book''s GitHub repository
    at

    `https://github.com/PacktPublishing/-Increasing-Autodesk-Revit-Productivity-for-BIM-Projects`.


    # # Introduction to Power BI for Revit


    Power BI is a software developed by Microsoft that has a vast collection of software
    services, apps, and connectors developed to work together and make sure that the
    data gathered can be shown in a coherent, visual, and interactive way through
    different dashboards. The data can be brought in in different ways, from various
    sources, and analyzed in different ways.


    As Microsoft Power BI has different versions, tools, and apps, we will be using
    the **free version**: *Microsoft Power BI Desktop*.


    All the different versions of Microsoft Power BI can be found at the following
    link:


    `https://bit.ly/3qVvi7U`


    QR code:


    ![](img/1961add582dd4a589b2eac3dda140e38_352_0.png)'
  merge: -1
  img_proc: true
- pgno: 353
  md: '# Installing Microsoft Power BI Desktop


    The process of getting the application is quite simple and straightforward. By
    accessing the Microsoft Power BI web page, it will be possible to get the software
    and version the users want to get or subscribe.


    As mentioned before, we recommend getting *Microsoft Power BI Desktop*:


    ![](img/1961add582dd4a589b2eac3dda140e38_353_0.png)


    The download can be performed by using the two links:


    +   - **Download**: This option will allow Microsoft Power BI Desktop to be installed
    automatically through the Microsoft Store in the background.

    +   - **Advanced download options**: This option will allow the Microsoft Power
    BI Desktop installer to be downloaded after selecting which language the user
    wants to use.


    When using the second option – downloading the installer – once the download is
    complete, double-click in the file to start the installation process and follow
    the steps until it is finished.


    # Starting Microsoft Power BI


    Following installation, the software can be accessed through the shortcut in the
    Desktop or by accessing the Start menu and typing in Power BI Desktop.'
  merge: -1
  img_proc: true
