    # Using Scope Boxes


    Scope Boxes can increase efficiency by applying a specific crop region to multiple
    views and control Levels and Grids extensions.


    Scope Boxes are created in the Floor or Ceiling Plan views, but they are visible
    in multiple views and can be adjusted as required.'
