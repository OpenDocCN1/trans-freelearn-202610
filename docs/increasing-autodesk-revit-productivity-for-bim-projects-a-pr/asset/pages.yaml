    # Revit''s recommended settings


    Revit is a high-demanding software in terms of using up computer resources. It
    is highly recommended that you keep the settings as least demanding as possible.
    We will only highlight a few recommendations, but others might also apply, depending
    on which discipline it is or even the task you want to do.


    The following is accessible through the Revit **Options button**:


    ![](img/1961add582dd4a589b2eac3dda140e38_35_0.png)'
