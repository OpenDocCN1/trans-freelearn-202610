    # Always use the same Revit update release


    Quite often, Autodesk deploys new update releases with some new features and bug
    fixes.


    It is essential to make sure that when working on a project with other team members,
    everyone has the same update release to avoid any potential software issues.


    > Tip

    > In the same Revit version – Revit 2021, for example – we can have different
    update releases, such as the following:

    > Revit 2021.1.1 – Release Date: 18-Sept-2020

    > Revit 2021.1 – Release Date: 22-July-2020


    To confirm which Revit update release you have installed, please start Revit.


    After Revit has opened, follow this step-by-step guide:


