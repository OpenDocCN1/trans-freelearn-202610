- pgno: 24
  md: '# Example 4: Revit versus 2D CAD – productivity


    BIM has promoted a transformation in the **Architecture, Engineering, Construction,
    Owner Operator (AECOO)** industry, where information is the core of a methodology
    that improves productivity and brings many benefits when compared with the traditional
    2D CAD process.


    Revit is information-centric in that it offers multiple advantages compared to
    traditional 2D CAD, and we can easily measure a significant increase in productivity.


    BIM platforms, such as Revit, give us federated information, which means quality
    data that can be applied for multiple uses, and this is part of our methodology
    to work with quality data.


    Of course, that all depends on the designer using the correct input information
    and modeling in 3D precisely to optimize the analysis benefits.


    In this example, we can understand the increase in productivity when switching
    from 2D CAD to Revit, but quality information is paramount to improve productivity.


    # Example 5: Planning your work in Revit


    Time management principles focus on the process of planning your work before starting
    a task, and it is not very different when you work in Revit by yourself or when
    working in a large design team.


    Your productivity will increase if you plan your task prior to modeling and search
    for quality information to avoid any rework.


    During this process, you can select activities that will have a high impact on
    your task and consider other activities that can be postponed.


    The following graph shows the process to prioritize tasks that will have a high
    impact on the project:'
  merge: -1
  img_proc: true
- pgno: 25
  md: '![](img/1961add582dd4a589b2eac3dda140e38_25_0.png)


    Figure 1.2 – Effort versus Impact


    For this example, we will utilize a process to create a door schedule that has
    many activities to check and collect quality information.


    # High impact


    Do the following:


    +   - Use a door numbering system that has been approved by the client.

    +   - List the fire door rating.

    +   - Decide which fields will be included in the door schedule.

    +   - Check the structural opening.

    +   - Check whether the door parameters are reporting the correct data.


    Plan the following:


    +   - Check whether the doorframe dimension is correct.

    +   - Check that the family name is the same as the project standard.'
  merge: -1
  img_proc: true
- pgno: 26
  md: '# Low impact


    Consider the following:


    +   - Depending on the project stage, the door material can be generic.

    +   - Depending on the project stage, check the door tolerances.


    Drop the following:


    +   - Depending on the project stage and scope of work, team members could postpone
    their selection of the ironmongery set.

    +   - Check the gap between the door panel and the floor.


    In this example, we can use time management principles in the Revit modeling process
    to improve productivity and define the priorities that will have a high impact
    on the project.


    Following our methodology, time management processes with quality information
    will provide a jump in the efficiency of your work.


    We have reached the end of our examples to define the importance of research and
    get quality information before doing a task. We have learned how to avoid proceeding
    based on the immediately available data, which may not be 100 percent reliable
    or complete.


    There are other technical factors in Revit that can help you to improve productivity
    and make your work more efficient. Let''s explore them in the next section.


    # Computer maintenance


    It is essential to do some housekeeping in order to get the best Revit performance
    possible. We recommend that you perform the following steps on a fortnightly basis.


    # Revit local files


    When working on a worksharing environment, Revit will automatically create local
    files on the user''s computers in the **Documents** folder. This process will
    make the Revit local file (that is, the work-in-progress file) a copy of the Revit
    central file with the addition of your name in the filename.'
  merge: -1
  img_proc: true
- pgno: 27
  md: 'The objective of this process is to remove the local files in order to provide
    more space on your C: \ drive and consequently improve performance:


    ![](img/1961add582dd4a589b2eac3dda140e38_27_0.png)


    Figure 1.3 – The Revit local file


    These file and folder locations are defined under Revit Options:


    +   1. In the upper-left corner, click on File | Options:


    ![](img/1961add582dd4a589b2eac3dda140e38_27_1.png)


    Figure 1.4 – Revit Options'
