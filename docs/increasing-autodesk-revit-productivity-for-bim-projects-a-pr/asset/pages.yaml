    # Working with an opened workset


    If, in a specific view, there is no need to have all of the worksets opened, it''s
    highly recommended that you turn them off as it affects the view processing as
    well. It is possible to change the workset''s visibility when the workset is open
    in the model.


    > Tip

    > Users will only be able to change a workset''s visibility if the workset is
    open in the Revit session. If the workset is not loaded (that is, open), it needs
    to be switched to **Open**. Afterward, the workset visibility can be edited in
    a specific view.


    To select which worksets users can change the visibility of in a view, follow
    these steps:


    +   1. Open the view in which you want to change the workset''s visibility.

    +   2. Underneath **Properties**, click on **Visibility/Graphics Override** (this
    can also be shortened to **VV** or **VG**):'
  merge: -1
