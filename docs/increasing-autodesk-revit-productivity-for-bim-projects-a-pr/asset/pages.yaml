- pgno: 91
  md: '![](img/1961add582dd4a589b2eac3dda140e38_91_0.png)


    Figure 2.9 – COBie color-coded cells


    Tabs that need to be checked and filled in include the following:


    +   - **Instruction**

    +   - **Contact**—provide relevant contact data


    # Requirements and Constraints


    This is data that needs to be typically included with the expected **Royal Institute
    of British Architects (RIBA)** Stage 2 or 3. This information is provided to basically
    ensure that the emergent design and specifications are consistent with the Appointing
    Party brief in terms of function and cost.


    Tabs that need to be filled in include the following:


    +   - **Facility**—data filled in manually in the BIM file

    +   - **Floor**—data exported from Floors (extracted from the model)

    +   - **Space**—data exported from Spaces (extracted from the model)

    +   - **Zone**—data exported from Zones (extracted from the model)


    # Outline Solution and lifecycle costs


    This is data that needs to be typically included with the expected *RIBA Stage
    4*. This information can be used to ensure that the whole project is aligned with
    the Appointing Party brief in terms of function, cost, and carbon performance.


    At this stage, the model can be used for bidding as we can export data straight
    from the model by using schedules (doors, windows, equipment, and so on).'
  merge: -1
  img_proc: true
- pgno: 92
  md: 'Tabs that need to be filled in include the following:


    +   - **Type**—data extracted from the model

    +   - **Component**—data extracted from the model

    +   - **System**—data extracted from the model

    +   - **Connection**—data extracted from the model

    +   - **Coordinate**—data extracted from the model


    The **Construction Industry Council (CIC)** Working Group indicates that the likely
    accuracy for information gathered at this stage is to be 75%-80%, with a tolerance
    of ± 20-25%.


    # Construction information


    This is data that needs to be typically included with the expected *RIBA Stage
    5*. The checks are there to ensure the design from the previous stage and specifications
    are consistent with the Appointing Party brief in terms of function, cost, and
    carbon performance.


    The model, now fully coordinated, can be used for construction, and coordinated
    technical drawings can now be driven for construction.


    Comparing this with the previous stage, the model now represents a technical solution
    that can be built, with all inputs from the contractor already incorporated into
    the model.


    Tabs that need to be filled in include the following:


    +   - **Type**

    +   - **Attribute**—data for type, components, systems, coordinates, connections,
    and documents attributes gets updated to the construction level (extracted from
    the model)


    The CIC Working Group indicates that the likely accuracy for information gathered
    at this stage is to be 85%-90%.


    # Operations and Maintenance Information


    This is data that needs to be typically included with the expected *RIBA Stage
    6*. All this data will be related to Operations and Management Information. It
    is related to the operational and detailed functional information supplied by
    the manufacturers and trade contractors who have installed and commissioned them
    as systems.


    The model now represents the building as built and contains all information provided
    by all subcontractors. It includes all information regarding systems and equipment
    installed.'
  merge: -1
  img_proc: true
- pgno: 93
  md: 'Tabs that need to be filled in include the following:


    +   - **Job**

    +   - **Resource**

    +   - **Spare**


    The accuracy for information gathered is expected to be 100%.


    # Post Occupancy Validation Information and Ongoing O&M


    The concept of this post-occupancy information is to review and check how the
    asset is actually being used. This stage should be used to update the post-occupancy
    system with the final and most updated operational dataset once all systems and
    procedures have settled into operation.


    The model now represents the building in use and contains all information from
    the management teams and systems implemented.


    # COBie concept


    The COBie concept is simple, but the process to deliver COBie is not always straightforward
    because it depends on the BIM model quality.


    Organizations usually use Solibri or the Autodesk COBie Extension for Revit to
    produce the COBie deliverables. The Solibri Model Checker logo can be seen here:


    ![](img/1961add582dd4a589b2eac3dda140e38_93_0.png)


    Figure 2.10 – Solibri Model Checker


    You can visit the Solibri website at this address: `https://www.solibri.com/`.'
