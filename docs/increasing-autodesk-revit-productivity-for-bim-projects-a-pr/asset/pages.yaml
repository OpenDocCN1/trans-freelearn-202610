    # Starting a Revit template


    We will start a new Revit template by using the existing `DefaultGBRENU.rte` template
    that is saved when Revit gets installed. There are multiple options for templates,
    as we will explain next.


    The templates for multiple languages can be found here:


    `C:\ProgramData\Autodesk\RVT 2021\Templates`


    Metric templates in English can be found here:


    `C:\ProgramData\Autodesk\RVT 2021\Templates\English`


    Imperial templates in English can be found here:


    `C:\ProgramData\Autodesk\RVT 2021\Templates\English-Imperial`


    We need to start a **New** project by selecting an existing template (`DefaultGBRENU.rte`)
    and selecting **Save As** to save the template inside a different folder with
    a new name. This is so that we can start editing the file:


    ![](img/1961add582dd4a589b2eac3dda140e38_111_0.png)


    Figure 3.3 – Opening a Revit template


    After opening the template, we need to save the file. To save the file, navigate
    to **File | Save As | Template** and rename the file accordingly.'
