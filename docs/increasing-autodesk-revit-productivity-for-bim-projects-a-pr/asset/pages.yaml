- pgno: 53
  md: '+   - Representation in plan and section views for wall joins

    +   - The process to load elements into memory to reduce opening times

    +   - The calculation of silhouette edges during navigation in perspective 3D
    views

    +   - Graphical representations when opening views or updating view properties

    +   - Saving and opening files

    +   - The display of point cloud data

    +   - Exporting DWF as single sheets

    +   - Calculations of MEP systems running in the background

    +   - Materials UI

    +   - Color fill calculations

    +   - The structural connection geometry running in the background on another
    process


    Currently, these are the most common options for processor types:


    +   - Intel Xeon

    +   - Intel (i) series i5, i7, i9, and i10

    +   - AMD Ryzen


    # Processor Intel Xeon


    Intel Xeon is used primarily for business workstations or servers, and the CPUs,
    typically, have more cores than the Intel (i) series. Additionally, the clock
    speed is a little inferior if you compare it with an Intel (i) series such as
    i7 or i9.


    It has good durability and resilience, which makes this processor a good option
    for architectural and engineering companies to work with multiple applications.
    Usually, the Intel Xeon is more expensive than the Intel (i) series.


    # Intel (i) series i3, i5, i7, i9, and i10


    The Intel (i) series is usually preferred for personal computers, and the processor
    cost is inferior if you compare it with Intel Xeon.


    The excellent point about the Intel (i) series is that the processor clock speed
    is typically faster per core than the Intel Xeon, so it brings advantages to Revit''s
    performance.


    Revit''s performance improves with processors that have high clock speed per core,
    which means that the multicore processor will not necessarily enhance performance,
    as Revit is not completely a multithreaded software.'
  merge: -1
  img_proc: true
- pgno: 54
  md: '# AMD Ryzen Threadripper processor


    The AMD Ryzen Threadripper processor is an option if you want to reduce costs,
    and it can provide good performance in Revit. With the same process as earlier,
    you will need to check the clock speed and the maximum turbo speed.


    # Maximum turbo frequency (GHz)


    Currently, most companies are using Intel technology for Revit workstations, and
    the process to select the best processor for Revit is based on the highest frequency
    (GHz), which is the processor speed.


    The key point when it comes to selecting the right processor is to check the highest
    frequency (GHz) that can maximize Revit''s performance. You need to consider two
    aspects, as follows:


    +   - The processor base frequency (GHz)

    +   - The processor maximum turbo frequency (GHz)


    In simple terms, the processor base frequency (GHz) is the base speed, and the
    maximum turbo frequency (GHz) is the highest processor speed.


    As an example, we will analyze the Intel® Core™ i9-10900X X-series processor.


    You can access the processor specification at the following link. Alternatively,
    you can use a mobile camera to scan the following QR code.


    Here is the link: `https://intel.ly/2HhqjAV`


    Here is the QR code:


    ![](img/1961add582dd4a589b2eac3dda140e38_54_0.png)'
