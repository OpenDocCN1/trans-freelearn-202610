- pgno: 356
  md: '# # Working with Microsoft Power BI


    Let’s have a high-level overview of the Microsoft Power BI interface, where we
    can find the main features when using the software.


    This subtopic aims not to explain Microsoft Power BI Desktop in detail, but to
    understand its main interface. We will do a high-level overview, defining some
    tools and workflows as we go along with an exercise.


    In the ribbon, we have the following tabs:


    ![](img/1961add582dd4a589b2eac3dda140e38_356_0.png)


    Figure 7.5 – Home tab


    +   - **File**: This option allows the main file management commands to be accessed
    (**Open, Save, Import, Export**, and so on).

    +   - **Home**: This option allows some of the main tools to be accessed, especially
    to bring in some data from different kinds of file types or data sources. It includes
    other tools that will allow the information to be formatted.

    +   - **Insert**: This option allows tools to be accessed that will enable users
    to insert new visuals, buttons, custom shapes, and even text and some images,
    which will help to arrange and make our dashboards more understandable.

    +   - **Modeling**: This option allows tools to be accessed that enable users
    to work with complex datasets, which contain more than one table, as those tables
    need to be related somehow.

    +   - **View**: This option allows tools to be accessed that are related to the
    visuals where we can find some themes predefined and used straight away in our
    dashboards. From here, it is possible to switch some of the panels on and off.

    +   - **Help**: This option allows some useful links to tutorials, training, and
    the Power BI community page to be accessed.'
  merge: -1
  img_proc: true
