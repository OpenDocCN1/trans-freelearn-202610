- pgno: 227
  md: 'In the Revit floor plan view, in **Properties**, we can select one of the following
    two options:


    ![](img/1961add582dd4a589b2eac3dda140e38_227_0.png)


    Figure 4.46 – Switching between Project North and True North


    We can see the project rotating between both options. These two options only appear
    in floor plans, ceiling plans, and area plans.


    Now, let’s assume that we need to rotate **Project North** to a different position.'
  merge: -1
  img_proc: true
- pgno: 228
  md: 'We can use the options to rotate 90° clockwise or 90° counterclockwise:


    ![](img/1961add582dd4a589b2eac3dda140e38_228_0.png)


    Figure 4.47 – The rotate 90° clockwise or 90° counterclockwise options


    We can use these two options to rotate Project North, as needed, until you set
    up the correct position.'
  merge: -1
