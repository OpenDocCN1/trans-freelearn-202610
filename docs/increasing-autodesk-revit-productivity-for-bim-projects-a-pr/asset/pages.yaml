    # Autodesk BIM 360 and Autodesk Construction Cloud


    Autodesk provides a cloud platform with multiple services to enhance collaboration
    between internal teams and consultants.


    Autodesk BIM 360 and Autodesk Construction Cloud enable users to work and collaborate
    in the cloud with the ability to synchronize Revit models.


    Autodesk provides cloud services for design authoring, collaboration, coordination,
    quantification, project management, facility management, and other services.'
