    \n![](img/1961add582dd4a589b2eac3dda140e38_449_1.png)\n\nFigure 10.17 – Defining\
    \ a view template to the view\n\n> **Tip**\n> \n> View templates can be controlled\
    \ by accessing the **View** tab | **View Templates**.\n\nIt is not recommended\
    \ to hide individual elements in views. By proceeding this way, it will be difficult\
    \ to find those elements. Users should always use filters in view templates to\
    \ hide them, if possible.\n\nWhen we have a view template assigned, it is possible\
    \ to use the **Temporary View Properties** options as this will allow users to\
    \ change the visibility/graphics settings without removing the view template assigned\
    \ and then restore them back to what was defined before."
  merge: -1
  img_proc: true
- pgno: 450
  md: 'Let''s follow these steps for a better understanding of how this works:


    +   1. Open a view that has a view template assigned.

    +   2. From the View Control bar, click on Temporary View Properties and select
    Enable Temporary View Properties:

    +   3. A purple rectangle will be visible wrapping the view, informing us that
    Temporary View Properties is on:

    +   4. Access to all View Properties as needed.

    +   5. To restore it to as it was, under the Temporary View Properties option,
    click Restore View Properties.


    ![](img/1961add582dd4a589b2eac3dda140e38_450_0.png)


    Figure 10.18 – Enabling temporary view properties


    ![](img/1961add582dd4a589b2eac3dda140e38_450_1.png)


    Figure 10.19 – Temporary View Properties on'
  merge: -1
  img_proc: true
- pgno: 451
  md: '# Graphic display options


    When modeling, the detail level assigned to the view will affect the performance
    as Revit might need to show/hide more detail to be viewed and consequently need
    more resources to regenerate any change or update:


    ![](img/1961add582dd4a589b2eac3dda140e38_451_0.png)


    Figure 10.20 – Detail level assigned to a view


    It is recommended to use Coarse views when modeling.


    Tip

    This setting might be assigned to a view template, in which case the option to
    change will be disabled.


    The same should be considered regarding shadows as they should be switched off
    if not required:


    ![](img/1961add582dd4a589b2eac3dda140e38_451_1.png)


    Figure 10.21 – Switching on/off shadows


    Another important setting related to Display View Settings is the visual style
    assigned, where the simpler, the better:


    ![](img/1961add582dd4a589b2eac3dda140e38_451_2.png)


    Figure 10.22 – Visual style definitions'
  merge: -1
  img_proc: true
- pgno: 452
  md: '# Raster images


    Raster images can affect Revit''s performance, and we can find them in two different
    ways:


    +   - From the Insert tab, by using the Link Image or Import Image option:


    ![](img/1961add582dd4a589b2eac3dda140e38_452_0.png)


    Figure 10.23 – Inserting or linking raster images


    +   - When rendering a view in Revit and the view is saved in the browser:


    ![](img/1961add582dd4a589b2eac3dda140e38_452_1.png)


    Figure 10.24 – Saving a render as an image to the project browser'
  merge: -1
  img_proc: true
- pgno: 453
  md: 'Whenever you have imported raster images by using any of the referred ways,
    consider the following recommendations:


    +   - Keep only the images needed and remove the others.

    +   - Ensure the images have a moderate resolution (a smaller and simplified image
    should be considered).


    By accessing Manage Links under the Insert tab, it is possible to control what
    is linked:


    ![](img/1961add582dd4a589b2eac3dda140e38_453_0.png)


    Figure 10.25 – Manage Links – images


    # Set the starting view as a 2D view


    When opening the model, it is recommended to keep a simpler view defined as a
    splash screen as this will make the opening process easier and faster.


    The starting view can be defined in the Manage tab, under Manage Project; click
    Starting View:


    ![](img/1961add582dd4a589b2eac3dda140e38_453_1.png)


    Figure 10.26 – Defining a starting view'
  merge: -1
  img_proc: true
- pgno: 454
  md: 'Revit will show a list of all the views available in the model. Select the
    2D view created to the splash screen, which contains information about the project:


    ![](img/1961add582dd4a589b2eac3dda140e38_454_0.png)


    Figure 10.27 – Selecting a starting view


    It is recommended to use a view where we can have some relevant project information,
    such as the following:


    +   - Project name

    +   - Client name

    +   - Design consultant name

    +   - Design discipline

    +   - Project information manager

    +   - Task information manager

    +   - Suitable code and description


    This will allow all users to have an overview of the project information.


    # Modeling


    In the previous chapters, we already learned about many aspects of improving productivity
    and performance in Revit. When modeling, there are many factors that users need
    to be aware of, and we have highlighted those that will affect performance and
    productivity the most as follows.'
  merge: -1
  img_proc: true
- pgno: 455
  md: '# Delete unused design options


    In the design process, it is rather common to develop more than one *design option*.
    These design options can be in a specific area, the entire cladding, or other
    significant project areas.


    Many design options will affect Revit’s performance, and they will slow down the
    file. We recommend the following tasks to avoid reduced performance:


    +   - Consider using separate files to design different design options, which
    will be important if the option represents a large area of the project.

    +   - Different design options might be placed in different worksets.

    +   - Preserve design options if they are still active in the project.

    +   - When exchanging models with consultants, make sure the design options are
    removed or keep only the required options.

    +   - When deleting design options, ensure all views related to the option are
    removed.


    As a good practice, design options need to be checked and controlled.


    # Purge


    Purging the model is crucial for dropping the file size to the minimum possible.
    As a reference, a single model should be a maximum of around 250 MB/300 MB.


    By running the purge command, Revit will delete unused content. To access the
    command, take the following steps.


    +   1. Under **Manage**, click on **Purge Unused**:


    ![](img/1961add582dd4a589b2eac3dda140e38_455_0.png)


    Figure 10.28 – Purge Unused


    +   2. Click **Check None.**'
  merge: -1
  img_proc: true
- pgno: 456
  md: '3. From the purge list, expand which categories need to be purged and tick
    the families and/or instances that need to be removed:


    ![](img/1961add582dd4a589b2eac3dda140e38_456_0.png)


    Figure 10.29 – Elements to be removed


    4. Click OK to start the purge process of removing the items.


    This command might need to be executed more than once to purge the project completely.


    # Model lines


    Model lines are lines that appear in the 3D space, and they are visible in all
    views. These lines should be avoided as they can be used by mistake on a drawing.
    It is recommended to use detail lines (visible only in the current view) when
    these lines are needed.'
  merge: -1
  img_proc: true
- pgno: 457
  md: 'If a model line needs to be converted into a detail line (or the other way
    around), Revit has a tool to do it. By selecting **Model Lines**, under the **Modify**
    tool, you will see there is a feature called **Convert Lines**:


    ![](img/1961add582dd4a589b2eac3dda140e38_457_0.png)


    Figure 10.30 – Convert Lines


    Depending on which line you are selecting, Revit will swap between **Model Lines**
    and **Detail Lines**.


    To conclude, we have learned about the best practices for CAD imports, views and
    sheet management, and additional processes to improve performance during modeling.


    In the next section, we will learn about the best practices related to Revit content
    creation.


    # Revit content management


    Several recommendations should be considered when developing or using families
    to keep Revit models lower in size and improve performance.


    In *Chapter 1, Introduction to Productivity in Revit*, we provided recommendations
    for family creation, but there are others that we would like to highlight here.


    Although we should follow these recommendations, sometimes we don''t follow them
    100% during projects. If not, we should use it in a moderated way.


    # Third-party families


    Revit families from the suppliers might be developed with lots of formulas and
    with many details in the geometry.


    Large families'' files and multiple instances placed in the project will affect
    the performance and slow down Revit.'
  merge: -1
  img_proc: true
- pgno: 458
  md: 'The following screenshot shows a Revit family with many formulas and parameters:


    ![](img/1961add582dd4a589b2eac3dda140e38_458_0.png)


    Figure 10.31 – Formulas used in a family


    Along with this problem, it may have imported different CAD formats with too much
    detail, which is unnecessary in certain project stages, and some of these details
    are not even visible in drawings.


    # Overmodeling families


    This is a widespread problem as suppliers develop their families with too many
    details that are not useful for most of the design stages, such as screws and
    bolts.'
  merge: -1
  img_proc: true
- pgno: 459
  md: 'The following screenshot shows a family with unnecessary details for most of
    the design stages:


    ![](img/1961add582dd4a589b2eac3dda140e38_459_0.png)


    Figure 10.32 – Skylight over-modeled


    Frequently, they are over-modeled, and the family needs to be simplified as a
    single file can have 5 MB, 10 MB, or even 50 MB (depending on formulas, CAD imports,
    detailing, and nested families).


    As a reminder from *Chapter 1, Introduction to Productivity in Revit*, Revit families
    should follow these file sizes:


    +   - A Revit family file from 250 KB to 500 KB indicates a suitable file size.

    +   - A Revit family file over 1 MB (1,000 KB) should be reviewed to reduce the
    size if possible.

    +   - A Revit family file over 2 MB (2,000 KB) should definitely be reviewed.

    +   - A nested family file size tends to be bigger, so we need to check the large
    family files. It is not recommended to have more than two levels of nested families.


    # CAD formats imported into families


    All imports should be reduced to the minimum as they will directly affect the
    performance. Some of these geometries can be created with meshes or fabrication
    software such as **Inventor** or **SolidWorks** (these models are generally over-detailed
    as they have all the information for fabrication).'
  merge: -1
  img_proc: true
- pgno: 460
  md: '# Avoiding complex shape modeling


    Complex geometries created from the Blends, Sweeps, and Sweep Blends commands
    may affect the project performance and the family file sizes. If possible, use
    them in a moderated way.


    # Defining element visibility settings


    When creating a family, it’s always recommended to define a visibility setting
    on the geometry, avoiding the family being over-modeled on a specific view. This
    can be done by assigning the Coarse, Medium, and Fine levels of detail:


    ![](img/1961add582dd4a589b2eac3dda140e38_460_0.png)


    On this window, it is also possible to set all these detail levels on any 3D view
    type: Floorplans, RCPs, Elevations, Sections, and 3D Views.


    # Flexing families


    When developing a Revit family, it is highly recommended to always flex the family
    before loading it into a project. With this, users will ensure that all parameters
    added into the geometry will behave as expected, and it will not cause the family
    to break:'
  merge: -1
  img_proc: true
- pgno: 461
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 462
  md: 'After flexing the family, users can set the preview visibility as off or simply
    save and close the family.


    To conclude, we have learned about the Revit content management best practices
    and essential aspects to maintain Revit''s performance by keeping the file size
    smaller.


    In the next section, we will learn about customizing Revit shortcuts and other
    topics to optimize Revit''s performance.


    # Optimizing Revit''s performance


    Although the projects are getting more and more complex, the technology is not
    advancing at the same rate, so we have to act accordingly to improve performance.


    In this section, we will learn about other aspects to optimize Revit''s performance,
    which includes the following items:


    +   - Keyboard shortcuts

    +   - Warnings

    +   - Compacting Revit files

    +   - Auditing Revit files

    +   - Disabling Revit plugins


    # Keyboard shortcuts


    Using keyboard shortcuts will speed up the user''s productivity as it is possible
    to customize specific shortcuts to the most-used commands. The same tool can have
    more than one shortcut.


    # Adding shortcuts


    Let''s learn how to create new shortcuts using the following steps:


    +   1. From the View tab, under User Interface, click on Keyboard Shortcuts:'
  merge: -1
  img_proc: true
- pgno: 463
  md: "![](img/1961add582dd4a589b2eac3dda140e38_463_0.png)\n\n> **Tip**\n> \n> It\
    \ is possible to access the **Keyboard Shortcuts** window by typing KS.\n\n+ \
    \  2. Using the **Search** bar and the **Filter** pulldown, select the command\
    \ you want to assign a new shortcut."
  merge: -1
  img_proc: true
- pgno: 464
  md: '3. Under Press new keys, add the shortcut and press Assign:


    ![](img/1961add582dd4a589b2eac3dda140e38_464_0.png)


    Figure 10.37 – Keyboard shortcut assignment


    4. After assigning all the shortcuts needed, click OK.


    When a shortcut is assigned to a specific tool, by hovering the mouse over each
    tool in the ribbon, a tooltip pops up with the assigned shortcut:


    ![](img/1961add582dd4a589b2eac3dda140e38_464_1.png)


    Figure 10.38 – Keyboard shortcut tooltip'
  merge: -1
  img_proc: true
- pgno: 465
  md: '# Removing shortcuts


    The process of removing shortcuts is similar, as explained before. To remove any
    shortcut, take the following steps:


    +   1. Select the shortcut to be removed.

    +   2. Select **Remove**:


    ![](img/1961add582dd4a589b2eac3dda140e38_465_0.png)


    Figure 10.39 – Removing a keyboard shortcut


    # Exporting/importing shortcuts


    When assigning different shortcuts to tools, it is recommended to export the settings
    to ensure that they can be used on any other computer, or even if we need to import
    them in future Revit versions.


    In the previous screenshot, we can click the **Import...** or **Export...** buttons
    to import or export an .xml file with all the shortcuts.


    When a shortcut is created, the .xml file will be saved under the C:\ProgramData\Autodesk\RVT
    2021\UserDataCache folder.


    # Warnings


    When working in Revit, it is common to have Revit warnings of multiple types.
    Some of them can be ignored, but others are more likely to cause performance issues
    and should be fixed as much as possible.'
  merge: -1
  img_proc: true
- pgno: 466
  md: 'A good strategy is to classify the Revit warnings by priorities and define
    which warning should be resolved first.


    We could classify the Revit warnings by the following terms:


    +   - High-priority

    +   - Medium-priority

    +   - Low-priority


    # High-priority


    This will include the following warnings:


    +   - There are identical instances in the same place, which means that we have
    families on top of each other.

    +   - The actual run width of one or more runs is less than the minimum run width
    specified in the stair type.

    +   - The actual tread depth of the stair is less than the minimum tread depth
    specified in the stair type.

    +   - Multiple rooms are in the same enclosed area.

    +   - Elements have duplicated type mark values.

    +   - Geometry is imported that extends greater than 20 miles (33 km).


    # Medium-priority


    This will include the following warnings:


    +   - Highlighted walls overlap. One of them may be ignored when Revit finds room
    boundaries.

    +   - Insert conflicts with joined walls.

    +   - Rooms are not in a properly enclosed region.

    +   - Room tag is outside of its room.'
  merge: -1
  img_proc: true
- pgno: 467
  md: '# Low-priority


    This will include the following warnings:


    +   - Wall and a room separation line overlapping.

    +   - Room separation lines overlapping.

    +   - A line in a sketch is slightly off axis and may cause inaccuracies.

    +   - A line is slightly off axis and may cause inaccuracies.

    +   - Highlighted elements are joined but do not intersect.


    Warnings are related to some actions or modeling issues that can occur during
    the model development. For example, if a room separation line is modeled on top
    of an existing one, Revit pops up a warning informing the user:


    ![](img/1961add582dd4a589b2eac3dda140e38_467_0.png)


    Figure 10.40 – Revit warning


    To access all warnings in the model, follow these steps:


    +   1. From the **Manage** tab, click **Warnings**:


    ![](img/1961add582dd4a589b2eac3dda140e38_467_1.png)


    Figure 10.41 – Warnings saved in the model'
  merge: -1
  img_proc: true
- pgno: 468
  md: '2. By expanding the warnings, it is possible to confirm how many we have in
    the model:


    ![](img/1961add582dd4a589b2eac3dda140e38_468_0.png)


    Figure 10.42 – Number of warnings saved in the model


    3. When selecting a warning, it''s possible to select the following options:


    +   - **Show**: Allows Revit to open views to expose the issue related to the
    warning

    +   - **More Info**: Allows users to get more information about the warning

    +   - **Delete Checked...**: Allows users to delete the element selected that
    is related to the issue

    +   - **Export...**: Enables users to export the list of all warnings to an Excel
    spreadsheet


    By accessing the Warnings window, apart from deleting one of the warning elements,
    it''s not possible to fix it automatically. To do so, users need to close the
    window and then resolve the warning manual as required.


    4. Click Close to close the window.'
  merge: -1
  img_proc: true
- pgno: 469
  md: 'In the warning dialog box, we can find the object ID that can be used to find
    the warning:


    ![](img/1961add582dd4a589b2eac3dda140e38_469_0.png)


    Figure 10.43 – Selecting elements by ID


    Warnings should be revised regularly and fixed.


    # Compacting a Revit file


    When saving a Revit model, it is possible to compact the file to reduce the size
    as this re-writes the entire file. It will try to remove old and obsolete parts,
    which leads to reducing the file size.


    Follow these steps to compact a file:


    +   1. Go to File and select Save As.


    +   2. Under Save As, click Project:


    ![](img/1961add582dd4a589b2eac3dda140e38_469_1.png)


    Figure 10.44 – Saving a Revit project'
  merge: -1
  img_proc: true
- pgno: 470
  md: '+   3. Click **Options…**.


    +   4. Under **File Save Options**, tick **Compact File**:


    ![](img/1961add582dd4a589b2eac3dda140e38_470_0.png)


    Figure 10.45 – The Compact File option


    +   5. Click **OK**.


    +   6. Click **Save**.


    If we are working with Revit files in a worksharing environment (central and local
    files), we can also compact the Revit file. In the synchronization process, we
    can compact the file:'
  merge: -1
  img_proc: true
- pgno: 471
  md: '![](img/1961add582dd4a589b2eac3dda140e38_471_0.png)


    Figure 10.46 – Compact file option


    # Auditing a Revit file


    The audit function allows maintaining the Revit model''s health as it will try
    to fix some issues within the model. It will scan, detect, and fix corrupted elements
    or information in the model. This audit process can be done with families as well.


    We recommend doing an audit of a model every week. If we upgrade the Revit model
    to a new Revit version, we should run the audit process.


    The process of doing an audit is silent as users don''t get any feedback or report
    of what has been done. To start the process, follow these steps:


    +   1. Ensure the model that needs to be audited is closed.


    > **Tip**

    > If the model is in a worksharing environment, it is recommended to instruct
    all users to close the model.'
  merge: -1
  img_proc: true
- pgno: 472
  md: '+   2. Go to File and click Open:


    ![](img/1961add582dd4a589b2eac3dda140e38_472_0.png)


    Figure 10.47 – Opening a Revit model


    +   3. Select the file to open.


    +   4. Tick the Audit option. An audit warning pops up, informing us that the
    operation might take long:'
  merge: -1
  img_proc: true
- pgno: 473
  md: '![](img/1961add582dd4a589b2eac3dda140e38_473_0.png)


    Figure 10.48 – Auditing a Revit model


    +   5. Click **Yes** to confirm to continue.

    +   6. Click **Open**.


    Revit starts the process to open the model, which may take some time depending
    on the file''s size and complexity.


    # Disabling plugins in Revit


    After doing all the tasks to improve performance, it is worth checking whether
    the Revit plugins are affecting performance.


    In Chapter 9, Enhancing Productivity with Plugins, we explained how to manage
    Revit plugins to install and uninstall for testing purposes.


    If plugins need to be disabled, refer to Chapter 9, Enhancing Productivity with
    Plugins, where we went through the process of deactivating them manually or using
    a plugin.


    It is recommended to use only plugins developed by companies certified by Autodesk.'
  merge: -1
  img_proc: true
- pgno: 474
  md: '# BIM 360 best practices


    BIM 360 is a cloud-based design collaboration platform developed by Autodesk,
    allowing project teams and all stakeholders to develop projects using a common
    platform.


    BIM 360 is part of the Autodesk Construction Cloud, and it contains multiple modules
    with different features. The Autodesk Construction Cloud is a collection of applications
    for superior collaboration and coordination across all design, construction, and
    operation phases.


    It integrates the following seven different modules:


    +   - **Document Management**: Allows sharing, viewing, and managing all construction
    drawings, documents, and models on a live and accessible platform, ensuring that
    all documents are always accessible and updated across all design teams.

    +   - **Build**: Allows capturing and sharing, viewing, and managing what’s happening
    in the site with all stakeholders involved in the project.

    +   - **Collaborate**: Allows users to automate the clash detection process and
    share all issues with all team members by using an integrated Issue Management
    workflow.

    +   - **Collaborate Pro** (previously **Design**): Allows users to work directly
    with Revit (cloud worksharing), Civil 3D, and Plant 3D models stored in the cloud
    (*Document Management*) and share those models automatically by creating an Exchange
    package to be accepted by any of the stakeholders in the project.

    +   - **Layout**: Allows users to share project information that can be used on
    the site by improving accuracy and saving time, speeding up execution, improving
    quality, and reducing errors.

    +   - **Ops**: Allows users to connect BIM asset data with the model for better
    and more integrated facilities management.

    +   - **Plan**: Allows users to produce and share production plannings using lean
    construction principles.


    There are some best practices that users should consider:


    +   - The **internet connection** should have at least a bandwidth from 5 Mbps
    (minimum) to 15 Mbps (performance) of upload and download.

    +   - Set up proper views to be shared in BIM 360 for a specific purpose (view,
    coordination, drawing revision, and so on) and define them to be published under
    **Publish Settings**. Only the views and sheets that should be published need
    to be selected (by having too many views, when publishing the models, it will
    take more time as BIM 360 needs to create the views).'
  merge: -1
  img_proc: true
- pgno: 475
  md: '+   - Setting up the project hub correctly is essential to having a clear and
    understandable workflow in place. It’s highly recommended that the setup follows
    ISO 19650 by defining the WIP area, shared area, published area, and archived
    area.

    +   - Autodesk Desktop Connector should be used to link non-cloud shared models.
    (Be aware that when the models are published, BIM 360 will push all the links
    from Desktop Connector to the cloud or from any local server.)

    +   - Before publishing a model, ensure that there are no unnecessary links.

    +   - When exchanging a package, ensure that we have a proper naming convention
    to rename the package. It should include a suitable code referred to in ISO 19650.


    To conclude, we have learned how to manage shortcuts, control Revit warnings,
    compact a Revit file, audit a model file, and disable Revit plugins to improve
    performance.


    We also explained what the BIM 360 platform is and shared a list of best practices
    when working with BIM 360.


    # Summary


    In this chapter, you have learned about Revit modeling best practices to improve
    users'' productivity by managing CAD imports, managing views and sheets, and other
    tasks to improve productivity and manage design options, the purge process, and
    model lines.


    We explained how to manage Revit content and perform additional tasks to improve
    productivity. We also learned extra tips for optimizing Revit’s performance by
    reviewing warnings as well as compacting and auditing Revit files.


    You learned about the Autodesk BIM 360 services that are part of the Autodesk
    Construction Cloud, which contains multiple applications for collaboration and
    coordination across all design, construction, and operation phases.


    With this last chapter, we wrapped up the topic of workflows for improving productivity
    and efficiency in BIM projects using Revit. We hope that you all now have a better
    understanding of what should be done, checked, and fixed to optimize your daily
    work in Revit to produce more in less time.


    This topic doesn’t end here; your learning will continue depending on your project
    experience and also how Revit and the BIM technology develop over the years ahead.'
  merge: -1
  img_proc: true
