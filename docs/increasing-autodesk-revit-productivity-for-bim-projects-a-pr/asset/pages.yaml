- pgno: 229
  md: '# The AutoCAD file position


    After rotating Project North and trying to save the Revit file, you should get
    the following message:


    ![](img/1961add582dd4a589b2eac3dda140e38_229_0.png)


    Figure 4.48 – AutoCAD position has changed


    Click on **Save**. Saves the new position back to the link. and close the Revit
    file. This option will change the DWG position.


    When you reopen the Revit files, you will not see this message again.


    # Exporting to AutoCAD with the correct orientation


    Depending on the project stage, companies may use a hybrid process and utilize
    Revit and AutoCAD simultaneously.


    In this scenario, we need to export a DWG file from Revit that contains the project
    in the correct orientation.'
  merge: -1
  img_proc: true
- pgno: 230
  md: 'The main objective of this section is to demonstrate the importance of having
    files with the correct coordinate system to improve efficiency and increase productivity
    for all of the companies involved in the project.


    We can follow these steps to export a DWG file from Revit:


    +   1. Click on **Export** to export the DWG file:


    ![](img/1961add582dd4a589b2eac3dda140e38_230_0.png)


    Figure 4.49 – Exporting the DWG file


    +   2. We need to check the DWG settings before exporting and then select the
    best option for your project:


    +   - Select the DWG units.


    +   - Select the DWG coordinates:'
  merge: -1
  img_proc: true
- pgno: 231
  md: "![](img/1961add582dd4a589b2eac3dda140e38_231_0.png)\n\nFigure 4.50 – The DWG\
    \ options before exporting\n\n> **Tip**\n> \n> If you use the **Internal Origin**\
    \ setting to export a DWG file, the DWG origin (X=0, Y=0, Z=0) coordinates will\
    \ be located in the same location as the *Revit internal origin*.\n\nWe will start\
    \ adding levels and grids in the Revit file to complete the project setup.\n\n\
    # Adding levels and grids\n\nAs we now have the project coordinates defined, the\
    \ next process is to add levels and grids to our project.\n\nIn the **Architecture**\
    \ tab, we can find the tools to add **Level** and **Grid**:\n\n![](img/1961add582dd4a589b2eac3dda140e38_231_1.png)\n\
    \nFigure 4.51 – Adding levels and grids"
  merge: -1
  img_proc: true
- pgno: 232
  md: "+   1. Create a Revit section that is parallel to the site and create more\
    \ levels:\n\n> **Tip**\n> \n> Ensure that you stretch the levels and grids to\
    \ cover the entire building site.\n\n![](img/1961add582dd4a589b2eac3dda140e38_232_0.png)\n\
    \nFigure 4.52 – Area to stretch the levels\n\n+   2. Add the project grids, ensuring\
    \ they stretch through all the levels and the building site.\n\nNow, the process\
    \ to start a Revit project and set up the project coordinates, levels, and grids\
    \ is complete. Therefore, you can save this file using the Save As option with\
    \ the Levels and Grids description. In a project environment, this file should\
    \ be shared with all consultants so that they can acquire the coordinates from\
    \ it to set up all the other Revit models from different disciplines.\n\nThis\
    \ process will guarantee that all consultants have the files with the correct\
    \ coordinate system across the project."
  merge: -1
  img_proc: true
- pgno: 233
  md: 'Depending on your project requirements, we need to learn about developing the
    Volume Strategy and guarantee that every model is linked at the correct location.


    # Volume strategy


    Volume strategy is the process of splitting the project into multiple 3D models
    to facilitate various people working simultaneously and to improve file performance:


    ![](img/1961add582dd4a589b2eac3dda140e38_233_0.png)


    Figure 4.53 – Typical volume strategy


    > Tip

    > Keep in mind that the size of the Revit files should be kept under 300 MB. If
    you suspect your files might become larger than that, you will need to consider
    splitting the model.


    The process to set up multiple Revit models is simple, and we need to use the
    Save As option for the Levels and Grids file we created earlier and use it for
    the other architectural models.


    Usually, structural and MEP teams need to link the Levels and Grids file, which
    was initially created by the architects. They should link the file using this
    option:


    ![](img/1961add582dd4a589b2eac3dda140e38_233_1.png)


    Figure 4.54 – Linking with Auto - Internal Origin to Internal Origin'
  merge: -1
  img_proc: true
- pgno: 234
  md: 'After this process, the structural and MEP teams need to acquire the coordinates
    from the Levels and Grids file:


    ![](img/1961add582dd4a589b2eac3dda140e38_234_0.png)


    Figure 4.55 – Acquire Coordinates


    Once completed, the structural and MEP teams will have their Revit models aligned
    with the architects'' coordinate systems.


    Now, we need to learn about another project variant, which is when you have multiple
    buildings on the site with different Project North and rotation points.


    # Multiple buildings on the site with different Project North


    We could have multiple buildings on the site with different Project North, so
    we need to guarantee that all buildings are aligned with the same coordinate system.


    If the new building is close to the main site where the project base point is
    located, we can follow these steps:


    +   1. Duplicate the Levels and Grids file or request the site file for your project
    team.

    +   2. Identify the desired project position for the new building.'
  merge: -1
  img_proc: true
