- pgno: 324
  md: 'After clicking the subcategory, the node will be added to the canvas. Each
    node has a structure similar to the following:


    ![](img/1961add582dd4a589b2eac3dda140e38_324_0.png)


    Figure 6.8 – Node structure


    When starting to work with Dynamo, it is essential to understand all these areas
    as they will provide important information from the node itself.


    # Creating a simple graph


    To create a graph in Dynamo, we need to fire up from one node to another by clicking
    from the node''s output to the next node''s input. When developing a graph, it
    should be read from the left-hand side to the right-hand side. The same order
    will be followed by Dynamo when we execute it.


    To start creating a new graph, perform the following steps:


    +   1. From the Dynamo Splash Screen, click **New**.

    +   2. Right-click in the canvas and search for the following:

    +      - **Number**

    +      - **Point**

    +      - **Watch**'
  merge: -1
  img_proc: true
- pgno: 325
  md: '3. For each search result, click on the following:


    +   - Number Slider

    +   - By Coordinates

    +   - Watch


    4. From the Number Slider node, click on the right-hand side arrow output and
    click again on any of the point coordinates'' input (X, Y or Z):


    ![](img/1961add582dd4a589b2eac3dda140e38_325_0.png)


    Figure 6.9 – Connecting nodes


    5. Do the same from the Point.ByCoordinates node to the Watch node.


    By default, Dynamo is set up to run automatically following any change, so you
    will be able to see the result:


    ![](img/1961add582dd4a589b2eac3dda140e38_325_1.png)


    Figure 6.10 – Connecting nodes


    The results will be automatically updated by changing which coordinate we want
    to use or by adding more sliders and assigning them to different inputs:


    ![](img/1961add582dd4a589b2eac3dda140e38_325_2.png)


    Figure 6.11 – Changing how a script will run'
  merge: -1
  img_proc: true
- pgno: 326
  md: 'As a good practice, we recommend *always* having it as manual. Otherwise, with
    every single change, the script will run automatically. By changing it, only when
    the user clicks **Run** will Dynamo execute the script.


    To conclude, we have learned how to know which Dynamo version is installed and
    how to start creating a simple graph using the nodes that are available when installing
    the software.


    In the next section, we will learn how to install and manage the already installed
    Dynamo packages and add or identify existing Python scripts. We will also cover
    how to run a script using Dynamo and the Dynamo Player.


    # Expanding Dynamo


    When working with Dynamo, some scripts will require further development by using
    the **Python** computational language. Using Python is an essential skill in becoming
    an expert in Dynamo.


    As the Dynamo community is based on an *open source* environment, many users share
    these graphs with all other users and are available to be installed at any time.
    These packages are Dynamo version-specific, and that''s why it is essential to
    always keep track of all versions that are available and have been installed.


    It is not recommended to update them in the middle of a project but, if it is
    really necessary, update them only if the design team agrees. By not doing this
    control, it may happen that the scripts developed and used during the project
    will no longer work because of these updates.


    Bear in mind that if this is an *open source* community, there is no guarantee
    that these packages shared previously will be maintained for future versions.


    Advanced users will develop their scripts as this will stop these dependencies
    of having packages developed by a third-party individual or company.


    # Dynamo packages


    One of the most important activities that needs to be done is to install and manage
    Dynamo packages.


    There is a massive list of packages available that can be used when working with
    Dynamo. It would be almost impossible to know all the available packages, and
    even knowing that, there are new scripts and packages shared on a daily basis.'
  merge: -1
  img_proc: true
- pgno: 327
  md: 'To access the list of all available packages, perform the following steps:


    +   1. Open Revit and, from the Manage tab, click on Dynamo:

    +   2. From the top menu, click on Packages and then select Manage Packages...:

    +   3. In the new window, click on the Package Manager Website button:


    ![](img/1961add582dd4a589b2eac3dda140e38_327_0.png)


    ![](img/1961add582dd4a589b2eac3dda140e38_327_1.png)


    ![](img/1961add582dd4a589b2eac3dda140e38_327_2.png)'
  merge: -1
  img_proc: true
- pgno: 328
  md: 'This will allow users to access the Dynamo Package Manager. This web page shows
    all the packages available, how many installations were performed, and how many
    registered authors have developed scripts:


    ![](img/1961add582dd4a589b2eac3dda140e38_328_0.png)


    Figure 6.15 – Dynamo Package Manager web page


    Along with this information, it is possible to see which are the newest packages
    shared with the community, which packages have been updated most recently, which
    packages have been installed the most, and which packages are depended on the
    most.


    These packages are shared by community members and should be consumed and installed
    with confidence in the community. There is a list of authors where we can see
    who has the most votes, who is the most active, and who has the most packages
    installed.'
  merge: -1
  img_proc: true
- pgno: 329
  md: 'You can access this information by referring to the following link:


    ```

    https://bit.ly/3rUP1cm

    ```


    QR code:


