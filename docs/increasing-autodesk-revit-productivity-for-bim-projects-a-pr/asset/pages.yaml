    # Section boxes in 3D views


    When working on a 3D view, a section box will reduce the displayed area, improving
    performance.


    To activate it, in the Properties palette, tick the Section Box parameter, and
    a section box will become visible:


    ![](img/1961add582dd4a589b2eac3dda140e38_446_1.png)


