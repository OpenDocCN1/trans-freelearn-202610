- pgno: 13
  md: '# Preface


    Revit enables architects, designers, engineers, modelers, **Building Information
    Modeling (BIM)** coordinators, and BIM managers to create BIM models and analyze
    intelligent data to improve design and construction. BIM has promoted a transformation
    in the engineering and construction industries where information is at the core
    of a methodology that improves productivity, providing several benefits in comparison
    to the traditional 2D CAD process. This book takes a hands-on approach to implement
    this new methodology effectively.


    Complete with step-by-step explanations of essential concepts and practical examples,
    this Revit book begins by explaining the principle of productivity in Revit and
    data management for BIM projects. You''ll then understand the primary BIM documentation
    to start a BIM project, including the contract, **Exchange Information Requirements
    (EIR)**, and the **BIM Execution Plan (BEP/BXP)**. Later, you''ll learn how to
    create a Revit template, start a Revit project, and explore the core functionalities
    of Revit to increase productivity. Once you''ve built the foundation, you''ll
    learn about Revit plugins and use Dynamo for visual programming and Power BI for
    analyzing BIM information.


    By the end of this book, you''ll have a solid understanding of how to increase
    productivity in Revit and will be able to apply multiple workflows in your project
    to manage BIM efficiently.


    # Who this book is for


    This book is for architects, designers, engineers, modelers, BIM coordinators,
    and BIM managers interested in learning Revit best practices. Increasing Autodesk
    Revit productivity for BIM projects will help you to explore a methodology that
    combines information management and research for quality inputs when working in
    Revit.


    This book is also designed for individuals who want to optimize their daily work
    in Revit to produce more in less time. The hands-on approach to improve your efficiency
    comes with useful explanations, which will step-change your productivity.'
  merge: -1
  img_proc: true
- pgno: 14
  md: '# What this book covers


    Chapter 1, Introduction to Productivity in Revit, explains how to combine information
    management principles and the best Revit practices to improve productivity. It
    also provides the Revit recommended settings and an overview of BIM implementation.


    Chapter 2, Project Data Management, covers the critical data when starting a BIM
    project and gives an overview of the appointment, BIM documentation, project functions,
    asset management, and establishing an action plan to start a BIM project.


    Chapter 3, Revit Templates and Standards, explains how to create a Revit template
    and manage graphic standards.


    Chapter 4, Starting a Revit Project Efficiently, provides an overview of Revit
    coordinate systems and explains how to start a Revit project and set up the project
    coordinates.


    Chapter 5, Core Revit Functionalities, explains how to improve productivity in
    Revit with schedule management, using keynotes for specification, design options,
    Revit phasing, scope boxes, work sharing, and drawing production best practices.


    Chapter 6, Visual Programming with Dynamo, provides a basic knowledge of Dynamo
    and demonstrates the importance of mastering this application to increase efficiency
    in Revit.


    Chapter 7, Dashboard Analyses with Power BI, explains the process of exporting
    and importing data from Revit to Power BI and analyzing data with Power BI.


    Chapter 8, Collaborating With Consultants, explores strategies for collaborating
    with consultants and provides information about the Revit tools to enhance Revit
    collaboration, such as Copy/Monitor, Coordination Review, and Shared Views.


    Chapter 9, Enhancing Productivity with Plugins, teaches how to manage Revit plugins
    and discover the most used Revit plugins to increase productivity in your projects.


    Chapter 10, Improving Performance, explores additional information for improving
    performance in Revit, including the modeling best practices, content management,
    optimizing Revit performance, and BIM 360 best practices.


    # To get the most out of this book


    You will need to have access to Revit 2021 or later versions of this software
    for most of the chapters. The information provided in this book can be applied
    to any future Revit version because the explanations cover many principles of
    productivity not based on a specific Revit version.


    Some chapters will also require you to have access to the following software:
    AutoCAD, Dynamo BIM, Microsoft Excel, and Microsoft Power BI.'
  merge: -1
  img_proc: true
