  md: '# 10

    # Improving Performance


    Following on from what we have described since *Chapter 1, Introduction to Productivity
    in Revit*, we would like to close this journey with the same subject that we started
    with: improving productivity and performance by sharing the best practices when
    working on a BIM project using Revit.


    With the combined knowledge provided across all the chapters, we now complete
    our objective – changing your productivity in carrying out daily tasks when working
    in Revit.


    This chapter will provide additional best practices to improve Revit''s performance
    and increase your productivity in carrying out daily tasks.


    We will explain the best practices to manage CAD imports and views and sheets
    as well as other tasks to improve productivity.


    This chapter will also provide information about Revit content management and
    additional tasks to optimize Revit''s performance, including reviewing warnings
    and auditing Revit files.'
