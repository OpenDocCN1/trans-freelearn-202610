  md: '# # Summary


    In this chapter, we have learned what Dynamo is and how users can work with Dynamo
    to improve performance and productivity.


    We learned that Python is one of the most common Programming languages, and it
    can be used in Dynamo together with the Revit API. This connection can enhance
