    To enhance the discussion about Asset Management, we have interviewed George Stevenson
    from ActivePLAN, who is an expert in Asset Management processes.


    # Interview with George Stevenson, Managing Director at ActivePLAN


    Hi George, thank you for the interview.


    We would like to have your views about Asset Management and the future of this
    sector.


    **Could you please present yourself and your company?**


    I am a Xerox-trained information management specialist who came into the construction
    industry in 1982. Initially, I was involved in developing estimating and planned
    maintenance software for M&E contractors, which then progressed to database-driven
    CAD and object-oriented building modeling (Sonata and Reflex, which became Revit).
    I founded the UK''s first Project Extranet/CDE, BIW, which is now Oracle Aconex.'
  merge: -1
  img_proc: true
- pgno: 96
  md: 'Now, I am Managing Director of ActivePLAN, a 20-person software and information
    management firm. We are Autodesk developers but principally focus on creating
    web-based BIM applications for briefing, information requirements, and applications
    that can be used throughout the design and construction process to deliver better
    information for asset management. See https://activeplan.co.uk/transforming-construction/
    for further information.


    Many of our clients are asset owners and FM contractors, so we have developed
    solutions to transform handover information to populate different FM applications
    and also to provide an enduring digital O&M/AIM.


    We also have solutions to take their existing O&Ms and transform them into BIM-compliant
    data models—generally 2D. Still, where they choose to invest in point clouds and
    3D models (perhaps for Plant Rooms), we include those through our API integration
    with Forge/BIM 360 and 3D Repo.


    Data engineering is a large part of what we do, and I was a founding member of
    what is now called BuildingSmart and was UK Chair of the FM working group. We
    have been working with the BRE to develop a data dictionary application to create
    and manage standardized datasets as reusable data templates. This has formed the
    basis of the free platform that is being used by product manufacturers—Lexicon.


    For many years, I have dedicated 20% of my time to working pro bono on initiatives
    to improve the industry, and the four current ones are:


    +   - BIM4Housing—Chair

    +   - BIM4HA/HACT Housing Asset Data Standards Working Group

    +   - Golden Thread Initiative—Chair of the Asset Information Working Group

    +   - Constructing Excellence Collaborative Working Champions


    # What are the challenges for architects and engineers to deliver asset information
    requirements in the pre-construction and post-construction stage?


    Asset information requirements are seldom provided in a form that integrates with
    their authoring tools (generally, they are PDF documents). So, it tends to be
    a manual process. Adding the requirements as metadata on 3D BIM objects is not
    ideal and, if they use IFC to export the data, there are problems because they
    tend to use 2x3, which is the coordination MVD, and that isn''t designed for asset
    information. This is compounded when people convert from Revit to IFC, import
    into a federated IFC model, and then convert back to COBie—what could possibly
    go wrong? Used properly, a native output, directly from Revit using COBie extensions,
    seems to be more reliable.'
  merge: -1
  img_proc: true
