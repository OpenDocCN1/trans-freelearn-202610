  md: 'Patterns can be created by importing the pattern file from AutoCAD (the PAT
    file) or created directly in Revit if they are basic patterns.


    # Material library


    Materials in Revit are not just about rendering; they also control how elements
    will be displayed in views and add specific data regarding their properties.


    From the material, we can combine five different assets:


    +   - **Identity**: This can be used to add technical information about the material.

    +   - **Graphical**: This can be used to control the color and the corresponding
    patterns to be viewed in a project view.

    +   - **Appearance**: This can be used for rendered views, realistic views, or
    ray-traced views.

    +   - **Physical**: This can be used for structural analysis.

    +   - **Thermal**: This can be used for energy analysis.


    This information can be accessed by clicking on **Manage**, under **Materials**:


    ![](img/1961add582dd4a589b2eac3dda140e38_169_0.png)


    Figure 3.68 – The Materials library'
