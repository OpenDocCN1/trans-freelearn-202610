  md: 'Figure 5.82 – Path for Revit Local files


    We recommend creating a dedicated folder to save the Local files in, such as Revit_20XX_Local_Files
    (where 20XX is the Revit version), so that the Revit files aren''t mixed up with
    other files located in the Documents folder.


    The default path for the user files is C:\Users\<username>\Documents\ Revit_20XX_Local_Files\.'
  merge: -1
  img_proc: true
- pgno: 302
  md: '# Username


    The Revit **Username** is used to identify your Local file. The Autodesk license
    that utilizes **Single Sign-On (SSO)** automatically defines this **Username**
    based on your Autodesk profile:


    ![](img/1961add582dd4a589b2eac3dda140e38_302_0.png)


    Figure 5.83 – Username


    # Worksharing Monitor


    **Worksharing Monitor** is used to identify users in the model and choose the
    best time to synchronize them. This helps save time if we''re wait for other users
    to complete this process:'
