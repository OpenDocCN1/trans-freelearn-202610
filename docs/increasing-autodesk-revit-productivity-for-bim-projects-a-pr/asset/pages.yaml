- pgno: 130
  md: 'Additional parameters are required to include in the title sheet, splash screen,
    tags, and more. The process of creating project parameters and shared parameters
    will be explained in a dedicated section:


    ![](img/1961add582dd4a589b2eac3dda140e38_130_0.png)


    Figure 3.27 – Additional Project Information parameters


    It is recommended that all information related to all of the projects should always
    be kept under the Project Information. By keeping it consistent, it''s easy to
    find the information you need.


    # Project parameters


    Project parameters are parameters that allow users to add information to specific
    Revit categories within a project. These parameters are visible in schedules but
    cannot be used in tags (as they are not shared with the external files).'
  merge: -1
  img_proc: true
- pgno: 131
  md: 'Users can add as many project parameters as needed, but they should be kept
    to a minimum. This is because it will increase the file size and become more difficult
    to maintain the unnecessary data inside the model.


    # Shared parameters


    Shared parameters are similar to project parameters. The main difference is that
    these parameters can be used in multiple families or projects. Additionally, they
    can be tagged, scheduled, and exported as ODBC.


    When working with shared parameters, it is necessary to have an external file
    (a *.TXT file) to host this information.


    Each project should have its own shared parameter (that is, a *.TXT file) where
    template parameters can be created. This includes any additional shared parameters
    that are required on a project level.


    If we create a shared parameter for a Revit family, we need to make sure that
    it is also created inside the project in order for it to work.


    The process to create a shared parameter consists of three different steps:


    +   - Create a new shared parameter file.

    +   - Create group parameters and parameters in the shared parameter file.

    +   - Add a shared parameter file to the Revit file.


