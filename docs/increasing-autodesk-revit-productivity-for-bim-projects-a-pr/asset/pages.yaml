- pgno: 196
  md: 'Revit coordinate systems in order to understand how to manage multiple elements
    such as Project North, True North, the survey point, the project base point, and
    the internal origin.


    The chapter will also explain the important aspects to consider when receiving
    Revit survey models and point cloud files with the coordinate system aligned.


    In this chapter, we will cover the following topics:


    +   - Overview of Revit coordinate systems

    +   - Challenges of coordinate systems

    +   - Starting a Revit project and setting up the project coordinates

    +   - Volume strategy and multiple buildings on site


    # Technical requirements


    In this chapter, you will need access to Autodesk Revit. The version used to describe
    all of these exercises is Revit 2021, but you can follow along with another version.
    It''s important to take the following into consideration:


    +   - Different versions might be slightly different from each other.

    +   - Older versions of Revit cannot open files from an earlier version.


    All datasets used for this chapter can be found in the book''s GitHub repository
    at https://github.com/PacktPublishing/-Increasing-Autodesk-Revit-Productivity-for-BIM-Projects.


    # Overview of Revit coordinate systems


    Understanding the Revit coordinate system will help us set up the Revit project
    correctly and avoid any rework in the future. Therefore, it should make us more
    efficient.'
  merge: -1
  img_proc: true
- pgno: 197
  md: "There are two coordinate systems in Revit, as follows:\n\n+   - The **Survey\
    \ Coordinate System**:\n+   \n+     The survey coordinate system uses a Revit\
    \ object, called a **Survey Point**, to locate the project on the Earth's surface\
    \ with a real-world coordinates system. We can acquire this information from a\
    \ survey file or **Ordnance Survey Maps (OS Maps)**:\n\n![](img/1961add582dd4a589b2eac3dda140e38_197_0.png)\n\
    \nFigure 4.1 – Survey Point\n\n+   - The **Project Coordinate System**:\n+   \n\
    +     The project coordinate system uses a Revit object, called a **Project Base\
    \ Point**, to locate a specific coordinate point near your building or site:\n\
    \n![](img/1961add582dd4a589b2eac3dda140e38_197_1.png)\n\nFigure 4.2 – Project\
    \ Base Point\n\nLet's find the survey point and the project base point in Revit:\n\
    \n+   1. Start a new Revit project or open an existing project.\n+   2. Open the\
    \ **Level 1** floor plan in the Project Browser.\n+   3. Under the View tab, click\
    \ on **Visibility/Graphics**, or use the shortcut. You can type in VG or VV if\
    \ you want to use the shortcut:\n\n![](img/1961add582dd4a589b2eac3dda140e38_197_2.png)\n\
    \nFigure 4.3 – Visibility/Graphics"
  merge: -1
  img_proc: true
- pgno: 198
  md: '4. Expand the Site category, select the Survey Point option, and then click
    on OK:


    ![](img/1961add582dd4a589b2eac3dda140e38_198_0.png)


    Figure 4.4 – Survey Point and Project Base Point'
  merge: -1
  img_proc: true
- pgno: 199
  md: 'You should see the **Survey Point**, as follows:


    ![](img/1961add582dd4a589b2eac3dda140e38_199_0.png)


    Figure 4.5 – Survey Point


    5. Repeat *Step 4* and then select the **Project Base Point** to get the following
    result:


    ![](img/1961add582dd4a589b2eac3dda140e38_199_1.png)


    Figure 4.6 – Project Base Point


    The **Survey Point** and the **Project Base Point** will be used to set up the
    coordinate system in Revit. Now, let''s find the **Revit Internal Origin**, which
    is an essential reference point in this context.


    # Revit internal origin


    The Revit internal origin helps you to identify the Revit internal coordinate
    system''s starting point, which is at the X=0, Y=0, and Z=0 coordinates.


    We should place the Revit model close to the Revit internal origin because the
    model geometry needs to be within the maximum distance from the Revit internal
    origin – a 16-kilometer (that is, 10-mile) radius.'
  merge: -1
  img_proc: true
- pgno: 200
  md: "If the geometry is too far from the internal origin, Revit becomes less accurate,\
    \ and it will display graphical issues:\n\n![](img/1961add582dd4a589b2eac3dda140e38_200_0.png)\n\
    \nFigure 4.7 – Revit Internal Origin\n\n> **Tip**\n> \n> The Revit model geometry\
    \ needs to be relatively close to the Revit internal origin.\n\nFrom Revit 2020.2\
    \ version, we can easily find the Revit internal origin and make it visible. To\
    \ do so, perform the following steps:\n\n+   1. Open the **Level 1** floor plan\
    \ in the Project Browser.\n+   2. Click on **Visibility/Graphics**, or use the\
    \ shortcut by typing in **VG** or **VV**:\n\n![](img/1961add582dd4a589b2eac3dda140e38_200_1.png)\n\
    \nFigure 4.8 – Visibility/Graphics"
  merge: -1
  img_proc: true
