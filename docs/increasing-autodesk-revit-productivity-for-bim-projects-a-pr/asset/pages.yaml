    \ of **Graphics Processing Unit (GPU)** rendering technology, which requires a\
    \ powerful graphics card from NVIDIA or AMD.\n\nUsing the GPU can lower the rendering\
    \ time, and plugins, such as Enscape, can deliver an excellent rendering quality\
    \ quickly (for instance, less than 1 minute).\n\nYou can view an example of an\
    \ Enscape 360° image from the following link:\n\n`https://bit.ly/35T3FYr`\n\n\
    Alternatively, you can scan the QR code here:\n\n![](img/1961add582dd4a589b2eac3dda140e38_56_0.png)\n\
    \nMany Revit workstations have graphics card from NVIDIA, and these are divided\
    \ into two types:\n\n+   - NVIDIA Quadro or NVIDIA Quadro RTX\n+   - NVIDIA GeForce\
    \ GTX or RTX\n\nUsually, the NVIDIA Quadro series is more expensive than the NVIDIA\
    \ GeForce series based on resilience and durability.\n\nThe NVIDIA RTX technology\
    \ is the latest development that improves real-time ray tracing, and it will provide\
    \ detailed lighting effects and better performance in your rendering.\n\nOn this\
    \ website, you can compare multiple graphics cards and compare the cost benefit:\n\
    \n`https://gpu.userbenchmark.com/`\n\nFor optimal performance and efficiency,\
    \ the graphics card should have a minimum of 4 GB dedicated memory or RAM.\n\n\
    > **Tip**\n> \n> Always check whether you are using the latest available drivers\
    \ for your graphics card."
  merge: -1
