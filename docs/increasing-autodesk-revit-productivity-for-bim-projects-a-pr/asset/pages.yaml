- pgno: 139
  md: '# Family name conventions


    Regarding naming conventions, there are many available examples around the world.
    We recommended that the family naming convention be based on and complied according
    to *BS_8541-1_2012: Library objects for architecture, engineering, and construction
    – Part 1: Identification and classification. Code of practice.*


    To get consistent results when searching for content, as a best practice, the
    following rules need to be followed:


    +   - CamelCase should be used for naming (that is, capitalized letters).

    +   - Do not use spaces.

    +   - Use _ (underscore) as a delimiter between fields.

    +   - Use full words (when, and if, possible).

    +   - Do not use special characters such as

    +     , . ! " £ $ % ^ & * ( ) { } [ ] + = < > ? | \ / @ '' ~ # ¬ ` '' .


    We recommended that you rename family files as follows:


    **<Discipline>_<Type>_<Subtype>_<Description>**


    For each field we have the following:


    +   - **<Discipline>**: This identifies the design discipline code responsible
    for developing the content: **A**.

    +   - **<Type>**: This specifies information about the purpose of the object (it
    should not be confused with the Revit family category): **A_Annotation**.

    +   - **<Subtype>**: This specifies the second level of information that will
    help you to distinguish one family from another: **A_Annotation_TitleBlock**.

    +   - **<Description>**: This allows users to add additional information to differentiate
    between subtypes (it is optional): **A_Annotation_TitleBlock_A1Metric**.


    To rename the Revit content, we can proceed in two different ways:


    +   - **Via plugins (or Dynamo)**: This can be used to export all of the existing
    Revit content names to an Excel spreadsheet. Then, we can edit them in Excel,
    and import the Excel spreadsheet back to Revit (we will look at some plugins that
    can be used to help with this task in a later chapter of this book).'
  merge: -1
  img_proc: true
- pgno: 140
  md: '+   - **Manually:** By right-clicking and selecting **Rename:**


    ![](img/1961add582dd4a589b2eac3dda140e38_140_0.png)


    Figure 3.37 – Renaming families


    # Exporting the IFC settings


    The IFC file format provides an interoperability file format that allows different
    BIM software to be imported and used by the model for coordination purposes. It
    can be used for communication, productivity, and quality throughout the build
    life cycle by reducing information loss during transmission between software.


    To enable this interoperability, there are established standards maintained by
    buildingSMART.


    The buildingSMART website can be found at `https://bit.ly/2JGIz8u`.


    Alternatively, you can refer to the following QR code:


    ![](img/1961add582dd4a589b2eac3dda140e38_140_1.png)'
  merge: -1
  img_proc: true
- pgno: 141
