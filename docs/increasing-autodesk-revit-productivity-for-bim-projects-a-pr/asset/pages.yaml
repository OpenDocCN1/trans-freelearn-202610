- pgno: 261
  md: '# Figure 5.29 – Material Keynote


    This method is useful when we want to add the specification to individual materials
    such as bricks, plasterboards, glazing, and others.


    +   - User Keynote


    The User Keynote method is not frequently used as the keynote specification is
    not associated with Revit components.


    We can still use the keynote specification list to add annotations to drawings,
    but it will lose its intelligence and connections with Revit components.


    # Annotating drawings with Keynote


    The Revit Keynote process will improve our efficiency of annotating drawings because
    the specification will be associated with objects. If we change the keynote text,
    it will automatically update in all views and drawings. Keynote’s intelligence
    is essential to increasing productivity when producing and annotating drawings.'
  merge: -1
  img_proc: true
- pgno: 262
  md: 'The process of adding Keynote is simple – we can adopt one of the three aforementioned
    methods and select a Revit component. Follow these steps to add a keynote:


    +   1. Let''s click **Element Keynote** and select a wall in a plan view.


    +   2. We will see a question mark symbol. Upon clicking a second time to place
    the annotation, we will be able to select the specification''s keynote text:


    ![](img/1961add582dd4a589b2eac3dda140e38_262_0.png)


    Figure 5.30 – Selecting the keynote text


    +   3. After clicking **OK**, we will see the Keynote assigned to the wall:


    ![](img/1961add582dd4a589b2eac3dda140e38_262_1.png)


    Figure 5.31 – Keynote assigned to the wall


    To conclude, we have learned how to improve productivity and efficiency to annotate
    drawings with Keynote. In the next section, we will learn about the best practices
    of Revit''s Design Options.'
  merge: -1
  img_proc: true
- pgno: 263
  md: '# Design Options


    Revit''s Design Options let you have more than one design solution in the same
    Revit file. We can switch between Design Options, which helps us design meetings
    and with client''s presentations.


    The process of creating Design Options is relatively simple, and we will focus
    on the best practices for managing Design Options to improve our productivity
    and efficiency. We can find the Design Options tool in the Manage tab | Design
    Options:


    ![](img/1961add582dd4a589b2eac3dda140e38_263_0.png)


    Figure 5.32 – Design Options


    > Tip

    > When using Design Options, it is better to have "hosting" and "element hosted"
    in the same Design Option; for example, a wall (hosting) and a door (hosted).


    Let''s learn about the best practices for managing Design Options in Revit.


    # Naming Design Options


    Revit Design Options should be named based on your company standards and avoid
    using the default naming conventions such as "Option 1," "Option 2," and so on.'
  merge: -1
  img_proc: true
- pgno: 264
  md: 'When we provide our Design Options with meaningful descriptions, we improve
    team communication and help team members save time identifying which Design Options
    needs to be selected or updated. We can rename an **Option Set**, as well as individual
    options:


    ![](img/1961add582dd4a589b2eac3dda140e38_264_0.png)


    Figure 5.33 – Rename – Design Options


    # Design Options Visibility


    When we want to display a specific Design Option in a Revit view, we can overwrite
    the *Primary Option* and display another Design Option. This process helps us
    print or show multiple designs.'
  merge: -1
  img_proc: true
- pgno: 265
  md: 'By working with the Enscape Revit plugin, we can show the rendering of multiple
    design options in real time very quickly.


    To select which Design Options we want to change the visibility of on a view,
    follow these steps:


    +   1. Open the view that you want to change the Design Option for.

    +   2. Under Properties, click on Visibility/Graphics Overrides (we can use the
    VV or VG shortcuts to do this):

    +   3. Under the Design Options tab, select the required Design Option:


    ![](img/1961add582dd4a589b2eac3dda140e38_265_0.png)


    Figure 5.34 – Overwrite the Primary Design Option


    ![](img/1961add582dd4a589b2eac3dda140e38_265_1.png)


    Figure 5.35 – Overwriting the primary Design Option'
  merge: -1
  img_proc: true
- pgno: 266
  md: "This process will allow us to change **Primary Option** to another **Design\
    \ Option**, such as **Extended Kitchen Area** or **Open Space**, as shown in the\
    \ preceding screenshot.\n\nIt's worth mentioning that the **<Automatic>** option\
    \ will display the Primary Option.\n\nNow, let's learn how to do the same process\
    \ when we're working with **Linked Files**. If you have multiple **Linked Files**\
    \ and you want to change the Design Option, follow these steps:\n\n+   1. Under\
    \ **Properties**, click on **Visibility/Graphics Overrides** (or type VV or VG\
    \ as a shortcut).\n+   \n+   2. We will see a new tab called **Revit Links**.\
    \ Click on **Revit Links** and then **By Host View**:\n\n![](img/1961add582dd4a589b2eac3dda140e38_266_0.png)\n\
    \nFigure 5.36 – Selecting By Host View\n\n+   3. In the **Basics** tab, select\
    \ **Custom**:"
  merge: -1
  img_proc: true
- pgno: 267
  md: 'Figure 5.37 – Selecting Custom to enable this process


    +   4. In the Design Options tab, select <Custom> from the drop - down menu and
    select <Automatic> to change the required Design Option from a Linked file:


    Figure 5.38 – Changing a Design Option from a Linked file


    # Schedule Design Options


    We can create a Revit Schedule to show the quantities that are provided in Design
    Options. If we don’t change these settings, Revit will always display the quantities
    in the Primary Option.'
  merge: -1
  img_proc: true
- pgno: 268
  md: 'To create a schedule and display a different Design Option, open the Revit
    Schedule and follow the steps highlighted in the following image:


    ![](img/1961add582dd4a589b2eac3dda140e38_268_0.png)


    Figure 5.39 – Changing the Design Options for Revit schedules


    # Empty Design Options


    We may need to create an empty Design Option when we don’t need to show new geometry
    in the Primary Option. In this situation, the Primary Option will be empty, but
    the other Designs Options will have geometry.


    # Increasing Performance With Design Options


    Multiple Design Options in a Revit file can reduce performance, and it is essential
    to remove unused Design Options and views frequently.


    We need to consider what is included in a Design Option wisely so that we have
    good Revit performance. If the Design Option is a large portion of a building,
    we may consider creating a new Revit file to link instead of creating a Design
    Option.


    Before removing Design Options, we advise that you back up the Revit file with
    all the Design Options in case the project team needs to return a specific design
    option in the future.'
  merge: -1
  img_proc: true
- pgno: 269
  md: 'After removing the unused Design Options, we recommend running the *Purge*
    command to remove unused families. This reduces the file size and improves performance.


    # Issuing Revit Models Without Design Options


    When you''re issuing Revit files to consultants, all the Design Options need to
    be removed to keep the Revit files optimized for good performance.


    If required, we can keep specific Design Options based on whether the project
    team agrees.


    In this section, we have learned about the best practices surrounding Design Options
    to gain productivity. In the next section, we will learn about Revit Phasing.


    # Revit Phasing


    Revit phases are an excellent function for working with existing buildings as
    they allow us to distinguish elements from different Phases and Phase Statuses,
    such as **Existing**, New, **Demolished**, and so on. It also helps us control
    their visibility.


    In *Chapter 3, Revit Templates and Standards*, we showed you how to implement
    Revit Phases for Revit templates. In this section, we will present the best practices
    for using Revit Phases.


    Depending on your project''s size, we advise having one Revit file for the **Existing
    Phase** and another Revit file for the **New Phase**. Although we may use just
    one Revit file with both Phases for a single house project, we can gain productivity
    by using separated files for each Phase in medium and large projects.


    # Revit File with Only the Existing Phase


    This Revit file will only contain the surveyed model for the existing building,
    and it will only be used to **demolish objects**.


    We can use the **Demolish** tool from the **Modify** tab and select objects as
    required:


    ![](img/1961add582dd4a589b2eac3dda140e38_269_0.png)


    Figure 5.40 – The Demolish tool'
  merge: -1
  img_proc: true
- pgno: 270
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 271
  md: '![](img/1961add582dd4a589b2eac3dda140e38_271_0.png)


    Figure 5.42 – Revit Phase Filters to be deleted


    We can increase productivity by recreating new Phase Filters as required in our
    project, thus facilitating usability. The Phase Filter description is essential
    to keeping things simple.


    We suggest the following naming convention:


    Sequential number + description + graphic overrides description


    Some examples are as follows:


    +   - 01-Existing-By Category

    +   - 02-New-By Category

    +   - 03-Demolition-By Category

    +   - 04-Existing and New-By Category

    +   - 05-Existing and New-Overridden

    +   - 06-Existing and Demo-Overridden

    +   - 07-New and Demo-Overridden'
  merge: -1
  img_proc: true
