    Now that we have the data extracted, let''s export this data to a TXT file.


    # Exporting data from Revit


    Exporting data from Revit is simple and straightforward. We will be using the
    built-in feature to be doing this, but as mentioned before, it is possible to
    extract data by using Dynamo or any other plugins available (some of these will
    be listed in Chapter 9). As with Power BI, it is possible to import data from
    a TXT file. We will be using this option:


    +   1. Under the File menu, click Export|Reports|Schedule:


    ![](img/1961add582dd4a589b2eac3dda140e38_364_0.png)


    Figure 7.16 – Exporting a schedule from Revit


    +   2. Rename the file as required and click Save.


    When exporting the file, it is important to understand some options:


    +   - Title should be not included, as it is not required in Microsoft Power BI.

    +   - Headers should be kept as ungrouped.'
  merge: -1
