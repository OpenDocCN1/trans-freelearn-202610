    # About the authors


    ![](img/1961add582dd4a589b2eac3dda140e38_4_0.png)


    *Fabio Roberti*


    **Fabio Roberti** is a Regional Practice Technology Leader (EMEA) and Associate
    at HKS Architects, where he develops and implements the digital strategy to consolidate
    processes and workflows to enhance project deliverables.


    He supports BIM processes in innovative ways to improve technology adoption with
    a thorough understanding of British Standards and the ISO 19650 framework and
    has many years of experience using Revit across all design stages.


    He holds a Master''s degree in Architecture, the Autodesk Revit Architecture Professional
    Certificate, and a BIM Level 2 Certificate from BRE Academy. Fabio has presented
    at multiple conferences, including Digital Construction Week and Autodesk University
    in London and Las Vegas.


    His passions for digital technology and teaching others new skills helped him
    achieve his company''s objectives and support many colleagues over the years.
    Besides BIM excellence, Fabio is interested in the rapidly advancing artificial
    intelligence sector, programming, and technologies that support superior construction
    deliverables.


