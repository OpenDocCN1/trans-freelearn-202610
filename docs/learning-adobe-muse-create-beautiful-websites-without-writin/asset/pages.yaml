    John F. Kennedy''s memorable inaugural address is famous for his use of the word
    "ask" five times in three sentences: "And so, my fellow Americans: ask not what
    your country can do for you, ask what you can do for your country. My" |


    Kerning: This is the adjustment of horizontal space between pairs of letters.
    It is used to create a perception of uniformity.


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_137_0.png)


    Tracking/Letter spacing: This is where an adjustment is applied to a whole block
    of text rather than just pairs of letters (kerning). It is used to improve legibility
    and to fit more or less text into a certain space. In the following illustration,
    the first line has tracking set to 0 (or normal), the second line has tracking
    set to -100, so all the letters are pulled tighter together, and the third line
    has tacking set to +70 so there is more space between the letters.


    Around the ragged rocks the ragged rascal ran

    Around the ragged rocks the ragged rascal ran

    Around the ragged rocks the ragged rascal ran'
