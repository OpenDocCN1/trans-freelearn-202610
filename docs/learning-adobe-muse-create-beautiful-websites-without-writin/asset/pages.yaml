    # Where are the files generated by Muse?


    When you are finished with creating your wireframes and you''re ready to share
    them with a client, you can publish them directly using Adobe Business Catalyst
    by clicking on the Publish link. To do this, you will need an Adobe ID, which
    you should have created when you first installed Muse. This is an easy way to
    get your web pages online.'
