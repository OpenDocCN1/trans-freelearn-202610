- pgno: 72
  md: 'This is the simple style, which is handy for use in wireframing. In Muse, we
    can save the settings for our rectangle as a graphic style, which we can then
    reuse for drawing our wireframes.


    # Saving the graphic style


    If you''ve used InDesign before, you will be familiar with the concept of reusable
    styles for characters and paragraphs. We use graphic styles to quickly format
    objects and maintain a consistent look in our wireframes and designs. It''s then
    really easy to update a set of site assets quickly if a client requests changes.


    +   1. While the rectangle is selected, click on the Create new style from the
    attributes applied icon at the bottom of the Graphic Styles panel. If you can''t
    see the Graphic Styles panel, choose Window | Graphic Styles to open it. The style
    is saved in the panel and is based on the formatting of the selected rectangle.


    +   2. Double-click the new graphic style to name it with a good descriptive name,
    such as Wireframe Rectangle in the Style Options dialog box. Click on OK.


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_72_0.png)


    To apply this style to any other shapes you draw later, select the shape and then
    click on the style''s name.


    +   3. Now, to continue with the header section of our wireframe, select the Type
    tool and drag out a rectangle approximately 245 x 45 pixels on the left-hand side
    inside the first rectangle.'
  merge: -1
  img_proc: true
- pgno: 73
  md: '4. When you let go of the mouse, the cursor will be flashing inside the rectangle.
    Type the word Logo. To increase the size of the type, using the Type tool, click
    and drag over the word Logo so it is highlighted in blue (indicating it is currently
    selected). On the Control Panel at the top of the page or in the Text panel, choose
