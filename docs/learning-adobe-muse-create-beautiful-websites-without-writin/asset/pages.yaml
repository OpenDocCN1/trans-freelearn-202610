  merge: -1
  img_proc: true
- pgno: 220
  md: '# 10


    # Muse, Meet the Adobe Creative Suite


    In the previous chapter we used Muse''s built-in widgets to add a slideshow to
    our pages. If you use some of Adobe''s other products, such as Photoshop, you
    will be pleased to know that Muse is tightly integrated with other products in
    the Adobe Creative Suite. Adobe Muse is not part of the Adobe Creative Suite®
    6 release, but it is available as part of the Adobe Creative Cloud membership.
    However, even if you''re using older versions of Photoshop and Fireworks, Muse
    will work well with the files you create using those programs.


    In this chapter, we''ll look at how we can use Photoshop or Fireworks to create
    graphics and easily bring them into your Muse-created websites. We will learn
    how to:


    +   - Create and add a Photoshop button

    +   - Add Photoshop or Fireworks-based graphics

    +   - Edit images with Photoshop or Fireworks using Edit Original


    # Adding a Photoshop rollover button


    A rollover button is a graphic created by a web designer, which provides interactivity
    between the page''s visitor and the page itself. The term "rollover" comes from
    the idea that when the visitor rolls their mouse over the button, something changes
    visually.'
  merge: -1
  img_proc: true
- pgno: 221
  md: 'Simple rollovers use two images. The first image is what we see when the page
    first loads. When we roll over that button, the second image is quickly swapped
    into place. When we roll our mouse off the button, the first image is swapped
    back into place. This type of interactivity is created using JavaScript, but as
    always, Muse does the work behind the scenes and writes the code for us.


    > Rollovers are sometimes referred to as mouseovers.


    Rollovers don''t have to use images; the simplest rollovers of all use only text.
    The text may simply change color or appear in bold, italic, or be underlined.
    We created some text-based rollovers when we added our menu system to the page
    in Chapter 6, Typography, Muse, and the Web. The idea behind rollovers, whether
    image-based or not, is that the interactivity gives your user some feedback and
    tells them that this is a button and something is going to happen when they roll
    over it. And usually something will happen when they click on it too.


    # States


    We can take our rollover button a step further by adding a third image. The third
    image appears when the user actually clicks on the button. There is also an option
    to use a fourth image if you want the button to appear in a certain way after
    it has been clicked.


    The way an image appears on the site may change depending on whether the mouse
    is hovered over it, clicked on it, or moved away from it. Each one of these mouse
    positions is known as a State. We can create buttons in Photoshop or Fireworks
    (or any other graphic editor) that use the following four states:


    +   - Up: The appearance of the button when the user is not interacting with it

    +   - Over: The appearance of the button as the user rolls over it

    +   - Down: The appearance of the button as the user selects (clicks on) it

    +   - Active: The appearance of the button after it has been clicked


    > You do not have to use four states, or even three if you don''t want to, just
    as long as you know the states are available to you.'
  merge: -1
  img_proc: true
- pgno: 222
  md: 'In the following screenshot, taken from the Apple website, we can see the three
    states. When the page first loads, all of the buttons on the menu look the same.
    They are all in the Up State. When the user rolls over a menu item, the button
    changes to a dark gray. When the user clicks on the button, some shading at the
    top and right side of the button image gives the impression that the button has
    been pressed down.


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_222_0.png)


    # Creating a rollover button with multiple states in Photoshop


    In this section we''ll create a similar button with three states using Photoshop.
    If you don''t have a copy of Photoshop you can skip to the next section where
    we''ll add the button to the page and you can use the provided .PSD file.


    +   1. Open Photoshop and create a new image with a width and height of 200 pixels
    x 75 pixels, respectively.

    +   2. In your Layers panel, click on the New Group icon. Click on the new group
    name in the Layers panel and rename it to Up.

    +   3. On the Tools panel, set the foreground color to red.'
  merge: -1
  img_proc: true
- pgno: 223
  md: '4. Select **Rounded Rectangle Tool** (it may be hidden under the rectangle
    shaped tool). On the tool options bar at the top of the Photoshop interface, make
    sure that the first icon, **Shape Layers**, is selected. Drag-and-drop a rounded
    rectangle to the document window.


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_223_0.png)


    A new shape layer has been added to the **Up** group. Now we''ll add some text.


    5. Select the **Type** tool on the toolbar. Set the color to white on the tool''s
    options bar at the top and choose any font you like. Click on the red rectangle
    and type in Read More. A new text layer is added above the rectangle shape layer.
    Make sure that **Read More** is centered above the rectangle.


    6. Now we need to make a similar setup for **Over** and **Down**, but rather than
    repeating the whole process, we''ll simply copy the group structure we have made
    for the **Up** state.


    7. Right-click on the **Up** folder and choose **Duplicate Group**. Name the new
    group Over and click on **OK**.


    8. The new **Over** group contains exact copies of the layers made earlier. We''re
    going to make a change to the color of the words in the text layer.


    9. Select the **Type** tool again and click on the **Read More copy** layer. Now
    in the tool''s options at the top of the screen, change the color of the text
    to black.


    10. Now let''s make one more group. Select the **Up** group you made first, then
    right-click on it and choose **Duplicate Group**. Name the new group Down and
    click on **OK**.


    11. Once again you have an exact copy of your **Up** group. This time we''ll leave
    the text white but we''ll add a layer effect so that the button looks as if it
    has been pressed.


    12. Select the **Shape 1 copy** layer in the **Down** group. Click on the **fx**
    (layer style) icon at the bottom of the layers panel. From the drop-down menu
    choose **Inner Shadow**.'
  merge: -1
  img_proc: true
- pgno: 224
  md: '13. In the Inner Shadow dialog box, set the Distance to 2 px and the Size to
    2 px. A small dark shadow will appear on the button. If we want to change the
    direction of the shadow, drag the Angle button in a circular motion. Click on
    OK.


    14. So after all that, our layers and button should look similar to the following
    screenshot:


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_224_0.png)


    15. We must merge the layers in each of our groups so that each group only contains
    one layer. Start with the top group (Down). Click on the text layer then Shift
    + Click on the shape layer so that the two layers are selected. Right-click and
    from the drop-down menu, choose Merge Layers. We''ll see that our two layers have
    become one layer.


    16. Repeat this process for the Over group and the Up group so that each group
    only contains one merged layer.


    17. For each of the merged layers, go back and rename the layers Up, Over, and
    Down as shown in a later screenshot.'
  merge: -1
  img_proc: true
- pgno: 225
  md: '18. Finally, we don''t need the white background layer. Click on the Background
    layer to select it, right-click and choose Delete Layer, or simply press the Delete/Backspace
    button on your keyboard. Our final layer setup should look similar to the following
    screenshot:


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_225_0.png)


    19. Save the file with all the other images you''ve been using for your website.
    Name it ReadMore.psd.


    # Placing the Photoshop button


    Now that we''ve done the hard work of preparing our layered file, we can place
    that button graphic onto the page. You can do so by following the given steps:


    +   1. In Muse, open your page where you want to place the button in the Design
    view.

    +   2. Choose File | Place Photoshop Button. The Place Photoshop Button dialog
    box appears. Browse to find your Photoshop file called ReadMore.psd. Click on
    Select.

    +   3. The Photoshop Import Options dialog box appears. This lets us see a preview
    of Normal State, Rollover State, Mouse Down State, and Active State (or Up, Over,
    Down, and Active as they are often referred to in web designing).'
  merge: -1
  img_proc: true
- pgno: 226
  md: 'Using the drop-down menus, we can specify which layer in the Photoshop file
    will show as the button''s Normal State (or Up state), the Rollover State (or
    Over state), and the Mouse Down State (or Down state). The three state menus display
    the names of the Photoshop layers, and the thumbnail images visually display how
    each selected layer will appear. You can use the following options:


    +   - For Normal State, choose Composite from the drop-down menu

    +   - For the Rollover State, choose the Over layer

    +   - For the Mouse Down State, choose the Down layer


    As we set up a layer for only these three states, we can leave the Active state
    as None.


    4. You''ll probably find that Muse will have correctly selected the layers for
    you anyway and there is no need to change the menu settings. Click on OK to accept
    the states as they are arranged by default.


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_226_0.png)'
  merge: -1
  img_proc: true
- pgno: 227
  md: '![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_227_0.png)


    In this example, we used very simple graphics to create three different states
    for a fairly standard-looking button. However, you are only limited by your imagination
    when it comes to creating buttons. They don’t necessarily even have to look like
    buttons. Some designers create elaborate designs using many layers for each state.
    The key to remember is to merge the layers in each group into one layer before
    finally placing it in Muse.


    5. Click once to drop the Photoshop button on the page.

    As with most objects in Muse, we can scale, rotate, and position our new Photoshop
    button as we require.


    6. Click on the Preview link to test the button. When the page first loads, the
    Normal State of the button appears. When we hover over the button with the cursor,
    the Read More text changes to black and when we click on the button, the text
    changes back to white and an inner shadow appears on the button. We can hold the
    button down for as long as we like and it will keep this appearance.


    # Adding a Photoshop image that''s not a button


    Most designers use Photoshop for more than just creating buttons. When it comes
    to creating images, Photoshop is really only limited by our imagination. When
    we looked at adding images in Chapter 7, Working with Images, we discussed the
    three main types of image format that can be used on the Web, namely JPEG, GIF,
    and PNG. So where does a layered Photoshop file (PSD) come into the equation?


    Well, the answer is that Muse lets us bring in a multi-layered PSD into our pages,
    and on saving, it will create a version of that file with a suitable file format
    to display on the Web. It''s still better to have Photoshop do the conversion
    to JPEG, GIF, or PNG as it does a better job with the compression of the image,
    but let''s have a look at how to bring in a PSD file to Muse:


    +   1. Open your page in the Design view.

    +   2. Click on File | Place.

    +   3. Browse to the folder where your PSD file is, select it and click on Open.'
  merge: -1
  img_proc: true
- pgno: 228
  md: '4. The Image Import Options box opens. You can choose to import an image as
    Composite Image or to import an individual Layer. If you choose Composite you
    will bring in a flattened version of your layered file. If you choose an individual
    layer, you can select just one layer on a transparent background. Choosing Clip
    To Layer Contents means that the image will be trimmed to remove any extra space
    around the object on that layer.


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_228_0.png)


    5. Click on OK and then position your image where you want it on the page. Again
    you can scale and rotate the image as you like.'
  merge: -1
  img_proc: true
- pgno: 229
  md: '# Editing our Photoshop file


    One of the nice features in Muse when dealing with a PSD file is that we can easily
    go back and make changes to our PSD and it will be automatically updated in our
    Muse web page. Use the following steps to do so:


    +   1. In the Assets panel you will see your new image listed as YourFilename.psd.
    Right-click on its name in the panel to see a list of menu options.


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_229_0.png)


    +   2. If you need to go back and edit your original PSD file, choose Edit Original.
    This takes you back to Photoshop where you can make as many changes as you like.


    +   3. When you are finished editing in Photoshop, choose File | Save.


    +   4. Back in Muse, you will see that the changes you made to your PSD are reflected
    immediately.


    > If your changes have not appeared, right-click on the filename in the Assets
    panel again and choose Update Asset. You should now see the update kick in.'
  merge: -1
  img_proc: true
- pgno: 230
  md: "# Paste an image from another program\n\nLet's say we've created other images\
    \ in Photoshop, Illustrator, or Fireworks and we want to take the whole or even\
    \ part of one of our images directly into Muse. Here's how to do it:\n\n+   1.\
    \ In another program, such as Adobe Illustrator, copy the image by selecting all\
    \ or part of it, then choose Ctrl + C (Windows) or Command + C (Mac OS) on the\
    \ keyboard. In this example, we're copying an image created using many paths in\
    \ Illustrator.\n\n![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_230_0.png)\n\n+   2.\
    \ Open the web page where we want to place the image in Muse's Design view and\
    \ paste the image by choosing Edit | Paste, or by using Ctrl + V (Windows) or\
    \ Command + V (Mac OS) on the keyboard.\n+   \n+   Just like that, the image appears\
    \ on the page. We can add a stroke or a link to the image, as well as scaling,\
    \ rotating, or positioning if required.\n\n+   3. Take a look at the Assets panel.\
    \ Notice there is now an object listed in there as clipboard. This is the file\
    \ we have just pasted in from the other program. When we save our site, Muse will\
    \ save this asset as part of our site."
  merge: -1
  img_proc: true
- pgno: 231
  md: '# Embedding rich media content


    If we have some rich media, such as a Flash presentation that we need to add to
    our web pages, we can do this just as easily as adding an image. Follow the given
    steps:


    +   1. Open the page you want to add the media file to in the Design view.

    +   2. Choose File | Place. In the Import dialog box, navigate to the folder with
    your media files and choose the one you need. Muse supports Adobe Flash SWF files.

    +   3. Click on OK and place the object where you want it on the page.


    If we want to add a video file to our page, it''s highly recommended to upload
    the video to a service such as YouTube. YouTube hosts the video so we don''t have
    to worry about bandwidth for our website. We can simply add the arbitrary HTML
    code provided by YouTube to our page as outlined in Chapter 9, More Widgets –
    Compositions and Slideshows.


    # Summary


    In this short chapter we examined how we can create a layered image in Photoshop
    and then place it as a Photoshop button in Muse. This allows us to create buttons
    with multiple states, which is a useful way to give feedback to our web visitors.
    We also saw how easy it is to take an image created in another program and copy-and-paste
    it into Muse.


    In the next chapter we''ll look at previewing and testing our whole site before
    publishing it.'
  merge: -1
  img_proc: true
- pgno: 232
  md: '# 11


    # Previewing and Testing Your Site


    Once you''ve done all the hard work of putting the site together, the final hurdle
    is to test, test, and test. This is a very important part of the web design process
    that involves previewing your site in various browsers to make sure it all works
    ok. You have already been doing some testing as you made your site by previewing
    your pages as you go.


    In this chapter, we''ll look at how Muse Preview uses WebKit to render previews,
    and we''ll discuss how to rigorously test your website. We''ll examine how to:


    +   - Preview a single page in Muse

    +   - Preview a single page in a browser

    +   - Preview an entire site in a browser

    +   - Export HTML and all associated assets of your Muse site

    +   - Follow a set of steps for testing your site


    # Previewing pages


    Adobe Muse uses WebKit as its rendering engine for Previews. WebKit is an open
    source layout engine, which was created to allow web browsers to render web pages.
    It powers the Apple Safari and Google Chrome browsers. It is also used as the
    basis for the experimental browser included with the Amazon Kindle eBook reader,
    as well as the default browser in the iOS, Android, BlackBerry Tablet OS, and
    webOS mobile operating systems.


    This means that when you preview your page or your site from within Muse, you''ll
    get a pretty good idea of how it will look on all the browsers mentioned previously.'
  merge: -1
  img_proc: true
- pgno: 233
  md: '# Completing the site


    To complete the site we have built so far, add text to the Home and Sails page,
    which is provided as .txt files. Add a fictional address and e-mail link to the
    Contact page.


    The completed windsurfing site is also provided as Windsurf-CompleteSite.muse,
    as shown in the following screenshot:


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_233_0.png)


    # Preview a page in Muse


    You''ve done this many times now if you''ve been following along, but here''s
    a quick refresher on how to preview a page in Muse:


    +   1. Open the page that you want to preview in the Design view.

    +   2. Click on the Preview link on the upper-left corner of the Muse interface.


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_233_1.png)'
  merge: -1
  img_proc: true
- pgno: 234
  md: '# Preview a page in a browser


    While it''s obviously very convenient and quick to preview from Muse, you should,
    as part of your testing routine, preview the web pages created in Muse in external
    browsers. Follow the given steps:


    +   1. Open the page that you want to preview in the Design view.


    +   2. Select File | Preview Page in Browser, as shown in the following screenshot:


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_234_0.png)


    # Preview the entire site in a browser


    If you want to test links while previewing, you''ll want Muse to create preview
    files for the entire site.


    To preview the entire website, beginning with the home page, select File | Preview
    Site in Browser.


    # Export HTML for browser testing


    In Chapter 12, Publishing Your Site, we''ll look at how to publish our site and
    the various options available to us. However, as part of our testing, we can export
    the HTML files and examine the assets that have been created by Muse. Exporting
    the HTML files means that the files are stored locally on our computer where we
    can access them and take a look at what has been generated by Muse.'
  merge: -1
  img_proc: true
- pgno: 235
  md: '# Previewing and Testing Your Site


    When you export your site, Muse slices and optimizes the images and creates a
    folder that holds these images, HTML, Cascading Style Sheets, and the scripts
    required to make the site work its magic.


    If you''re at all interested in code, you can open up the HTML files in any text
    editor and see the tags used to build your pages. If you''re not interested in
    the code, and most people who use Muse will not be, you can just open up index.html
    (your home page) in any of the browsers you have installed on your machine and
    test them locally.


    To export your full website as HTML, follow these steps:


    +   1. Select File | Export as HTML or press Ctrl + E (Windows) or Command + E
    (Mac).

    +   2. In the Export to HTML dialog box, specify the location on your computer
    where the files will be saved, by clicking on the folder icon, and then click
    on OK.


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_235_0.png)


    Your files will appear in the folder you specified and should look similar to
    the following screenshot:'
  merge: -1
  img_proc: true
- pgno: 236
  md: '![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_236_0.png)


    > On the computer from which this screen grab is taken, Chrome is set up as the
    default browser; that''s why the Chrome icon appears beside each of the HTML files
    that have been generated.


    # Viewing your home page on an installed browser


    You can open the home page in any browser you have installed on your computer
    by right-clicking (Windows)/ Command + click (Mac) and choosing Open With from
    the menu, and then choosing the browser in which you want to see the HTML page.


    # What to test for?


    Testing should be completed during each phase of a site''s development. Two mistakes
    new designers often make are waiting until just prior to launch before testing,
    or not testing at all.'
  merge: -1
  img_proc: true
- pgno: 237
  md: 'If you''ve been following along through the book, you''ll have done some testing
    after each page is created by clicking on the Preview link. By testing as we go
    along, we reduce the number of bugs and errors that could appear if left until
    just before the launch. The message is, keep testing and previewing throughout
    the entire Muse project.


    So what do we need to test for?


    # Test your website on multiple browsers and platforms


    Even though your website looks good and works well in Muse, doesn''t mean it will
    look as good or function as well on other browsers and/or platforms. Adobe has
    created a product that should create web pages that look good on all browsers
    and platforms but it is part of your job to check and test that they do.


    # Which browsers and platforms to test?


    In Chapter 2, The Muse Workflow, we discussed the challenge of web design compared
    to print design. The major challenge is that there are several platforms and many
    Internet browsers, which your visitors could be using to visit your site. There
    are many popular operating systems and browsers on which you might test your site.


    The following is a list of the operating systems:


    +   - Macintosh OS X

    +   - Macintosh OS 9

    +   - Windows 7

    +   - Windows XP SP1 and SP2

    +   - Windows 2000

    +   - Windows 98

    +   - Linux

    +   - Android

    +   - iOS

    +   - Windows Mobile'
  merge: -1
  img_proc: true
- pgno: 238
  md: 'The following is a list of popular browsers:


    +   - Safari

    +   - Mozilla

    +   - Firefox

    +   - Chrome

    +   - Opera

    +   - Internet Explorer

    +   - Browsers for Mobile Devices


    There are several online tools available to help with cross-browser testing, as
    it is unlikely that you would have access to all the browsers on every type of
    platform. Check out the following websites to see how you can test your site on
    multiple browsers in one go:


    +   - Browsershots: http://www.browsershots.org/

    +   - Browsercam: http://www.browsercam.com/

    +   - Browserlab: http://browserlab.adobe.com/


    Only Adobe Browserlab offers a free service.


    # Test page optimization


    Optimizing your pages right from the start can help ensure that your site design
    and images support fast page load times, and that the site''s development is smooth
    and efficient. We''ve discussed the importance of optimization of images in Chapter
    7, Working with Images, a compromise between the best quality possible with the
    lowest file size.


    There are also free online tools that calculate document weight, composition,
    and page load times, and even offer recommendations for optimizing web documents.
    Check out Website Optimization''s web page analyzer at: http://www.websiteoptimization.com/services/analyze/.'
  merge: -1
  img_proc: true
- pgno: 239
  md: '# View pages on a variety of displays


    Visitors will be accessing your site from desktop computers, laptops, tablets,
    and smartphones. Your lovely design may not stand up on each of these displays,
    so it''s important to try out your pages on as many of these displays as possible.


    # View pages on different screen resolutions


    Unlike designing for print, not everyone will be viewing your site at the same
    resolution. A useful tool for testing your site at various screen resolutions
    is Firefox''s Web Developer plug-in. This includes a customizable window-resizing
    tool.


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_239_0.png)


    # Check for adequate color contrast


    Make sure it''s easy for people to see your content by providing good contrast
    between the text and the background. A useful tool that can be helpful for checking
    your design''s color contrasts is Vischeck (http://www.vischeck.com/), which simulates
    colorblind vision, allowing you to see your pages as a colorblind user might.'
  merge: -1
  img_proc: true
- pgno: 240
  md: '# Test the functionality of all your widgets


    If you''ve added some of the handy widget functionality provided by Muse, make
    sure it works. It should work, but don''t forget to test. If there is a problem,
    it will be with older browsers, which will not support some functionality. If
    you find that a large portion of your visitors are using an older browser (and
    this is something you will discover over time by using website logs or Google
    analytics), then you may need to provide an alternative to that functionality.


    # Test all links, including navigation


    Make sure all the links work properly. Links in your main navigation are created
    automatically by Muse, so check that it includes all the pages you want, and that
    it doesn''t include any pages you don''t want.


    Check all links to external sites and check your anchor links to ensure they are
    taking the visitor to where they should be.


    # Test all downloads


    If you have added a link to a download such as a PDF file, make sure that your
    download links point to the correct files, and that the download files exist.


    # Test the site''s accessibility conformance


    Use at least two different accessibility evaluation tools. A useful list of tools
    is available on the W3C accessibility initiative website: http://www.w3.org/WAI/RC/tools/complete.


    # Proofread all content


    Spelling errors are a major turn-off for visitors to websites. Make sure you spell
    check and read through each page of your site to check that all the text is clear,
    simple, and appropriate for your website''s target audience.


    # Usability testing


    The tests and checks listed so far are something you can do yourself, but to really
    test your site, you need a fresh pair of eyes; ideally, several sets of eyes.
    The main goal of usability testing is to make sure your final version, your live
    website, is user-friendly and works well for your visitors.'
  merge: -1
  img_proc: true
- pgno: 241
  md: "You will have to test the following:\n\n+   - **Effectiveness**: Testing to\
    \ see if the user can accomplish the desired tasks\n+   - **Efficiency**: Testing\
    \ to see how much effort is involved in accomplishing the desired tasks\n+   -\
    \ **Satisfaction**: Testing to see if the user has a satisfactory experience and\
    \ will return\n\nYou may be surprised that what seemed completely obvious to you,\
    \ may leave an independent tester scratching their head, wondering what to do\
    \ on your website.\n\n> For tons of information on website usability, visit Jakob\
    \ Nielsen's website at: http://www.useit.com/.\n> \n> Mr. Nielsen is recognized\
    \ as one of the pioneers of usability testing on websites. You might also be surprised\
    \ at how plain the site is.\n\nSome of these tests will only be possible once\
    \ you upload your site to the server (which we'll cover in the next chapter),\
    \ but many of them are possible by testing locally on your machine.\n\nIf you\
    \ were creating a very large site you would need to do additional testing, but\
    \ for a small personal site created with Muse, testing everything that's been\
    \ mentioned so far would be a good start.\n\n# Creating a device-friendly website\n\
    \nWhile Adobe does not officially support mobile device designs in Version 1 of\
    \ Muse, there are a number of things you can consider when designing your site\
    \ to make it mobile friendly, as follows:\n\n+   - Adobe Flash technology is not\
    \ supported on iPhones and iPads. This was the source of some antagonism between\
    \ Apple and Adobe. If you put Flash on your website, it will not be visible to\
    \ users of iPhones or iPads.\n+   - Apple does not like pinned images either.\
    \ On the iPhone and iPad, your pinned images will not stay pinned where you want\
    \ them.\n+   - Some embedded HTML that you added to pages using Object | Insert\
    \ HTML can produce unexpected results on smart phones and tablets. You should\
    \ test the site on a mobile device and if there is a problem, you should remove\
    \ the embedded HTML to see if the rest of the page behaves normally."
  merge: -1
  img_proc: true
- pgno: 242
  md: '+   - There is no Rollover/Hover state on touch devices. On many devices, the
    first touch is treated as a hover, with the second touch acting as the Click or
    Down state. Again, testing on a mobile device is required to ensure that your
    menu widgets and other links work correctly.

    +   - Aim for a good user experience for all of your visitors. At this point,
    it is very difficult, if not impossible, to duplicate the experience on a mobile
    device as on a desktop or laptop computer. So keeping your site simple and easy-to-use
    is one way to ensure that your site performs well on a mobile device.


    # Summary


    In this short chapter, we saw how to preview your page within Muse and in a browser,
    how to preview the entire site in a browser, and how to export the site as HTML
    and its associated assets. We also discussed testing and what you as the designers
    should be checking for, and we saw some tips on making your website mobile device
    friendly.


    In the next and final chapter, we''ll learn how to publish our site on the Web.'
  merge: -1
  img_proc: true
- pgno: 243
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 244
  md: '# 12


    # Publishing Your Site


    You''ve built your site from scratch, added text, images, and interactivity, and
    now it''s time to unleash your hard work on the Web. The final (and exciting)
    step is to publish your site. In this chapter, we''ll look at how to get your
    site up there, onto the Web for all to see. There are two ways to host your site
    that you''ve created with Muse and we''ll look at both of these. In this chapter,
    you will learn the following topics:


    +   - Publishing a temporary site

    +   - Publishing your site with Business Catalyst

    +   - Publishing your site to a third-party hosting provider


    # Adobe ID


    When you first download and install Muse, you are required to create an Adobe
    ID. If you have previously created an Adobe ID (on www.adobe.com to access other
    Adobe services), you can use the same password with your Muse account. The following
    screenshot shows a Sign In window.


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_244_0.png)'
  merge: -1
  img_proc: true
- pgno: 245
  md: 'If you purchased a subscription with Adobe Creative Cloud, you''ll use the
    same password to log into Muse when you first install it.


    If you previously created a Business Catalyst account and used the same login
    email to create your Adobe ID, the system will detect that the e-mail address
    you entered matches a record in the Business Catalyst database.


    Whichever way you first set up your ID, you will need to know that username and
    password when it comes to publishing your site.


    # Publishing a temporary site


    When you use Muse, you can make and publish as many temporary sites as you wish.
    Every temporary site you create is active for 30 days. This gives you plenty of
    time to upload your sites, test them, and share them with your clients before
    going for a final launch. If you want to, you can publish one original form of
    your site, publish a second version as a temporary site, and make changes to that
    one. This allows you and your client to compare the before and after iterations
    of the same site.


    If a temporary site you''re working on is active for more than 30 days, you can
    extend its life by simply publishing the site again from your .muse file.


    # Remind me what the .muse file is again


    When you design, build, and save your site in Muse, a single file with the extension
    .muse is created. This is very different from the situation where you may have
    handcoded or used a program like Dreamweaver to create your website. In that situation,
    you would have a folder which would contain the following files:


    +   - HTML files for each page

    +   - At least one CSS file for styling your pages

    +   - All of your image files

    +   - Any other files you might use on your site, such as a Flash movie.


    The advantage of a single .muse file is that all your links, pages, styling, and
    images are in this file. If you''re working collaboratively, you can send a .muse
    file as well as the placed images to your work partner and they can open it safely
    with the knowledge that everything required for the site is in this one file.


    When you publish to a temporary site, you upload this single .muse file.


    Let''s now look at how to publish a temporary site; later we''ll learn how to
    permanently publish your site to its final spot on the Web.'
  merge: -1
  img_proc: true
- pgno: 246
  md: 'When you publish a site, it automatically takes the site name that your project
    started with, and adds the Business Catalyst domain name. So for example, the
    temporary site''s URL for our Windsurfing site would look like this:


    ```

    http://windsurfing.businesscatalyst.com

    ```


    Remember, this is only temporary, so when you are going for the final site launch,
    you can assign a domain name of your choice to it. The following steps have to
    be performed to publish a temporary site from Muse:


    +   1. Click on the **Publish** link at the top of the Muse workspace.

    +   2. The **Publish** dialog box appears. Enter the name of your temporary site
    in the **Site Name** field. This should be a descriptive name that will help you
    to identify the site. For example, you could enter My windsurfing site.


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_246_0.png)


    +   3. If they are not already visible, click on the **Options** link to see more
    options for your temporary site.

    +   4. Leave **Publish to** as **New site**....

    +   5. The site''s **URL** field in the **Options** section will automatically
    remove spaces and special characters and spaces that were entered in the **Site
    Name** field to create a suggested URL for your live temporary site. You can edit
    the contents of the **URL** field to change the automatically generated URL, if
    you want to.

    +   6. The **Data Centre** field selects the data centre where the site files
    will be hosted. Muse will detect this automatically, but if you want to be specific,
    you can choose from United States, European Union, or Australia.'
  merge: -1
  img_proc: true
- pgno: 247
  md: '7. If you don''t live in any of these three options, you can choose the Data
    Centre closest to your client''s location.


    8. When completed, the dialog box should look something like the following screenshot:


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_247_0.png)


    9. Click on OK to publish your new temporary site.


    10. Muse will upload all of your pages and assets, and when uploading is complete,
    you''ll get a confirmation message telling you that your temporary site is now
    hosted. Click on OK.


    11. Your Web browser will open automatically at the temporary site address. You
    will also simultaneously receive an email to your Adobe ID address congratulating
    you on publishing your temporary site with a link to the temporary URL.


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_247_1.png)'
  merge: -1
  img_proc: true
- pgno: 248
  md: 'If you want to make more changes to your Muse site and upload them to the same
    location, click the Publish link in Muse again. You''ll see that the link to your
    temporary site is displayed automatically below the Site Name field. Click on
    the link to launch your temporary site in a new browser window and test it.


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_248_0.png)


    The URL of the temporary site can be copied and sent to your clients for review.
    You now have an excellent opportunity to go through all of the testing we discussed
    in the previous chapter. Also, you''ll be testing a working, online website but
    without having to worry about the general public wandering onto the site.


    Once you''ve published the temporary site, the Manage link will now be available
    and active. We''ll use this shortly to publish the final site.


    # Editing and updating a site


    You have now published your site and spoken to your client, but you may find that
    there are some changes required. In order to edit and update your site, apply
    the following steps:


    +   1. Open the same .muse file in Muse.

    +   2. You have two options now:

    +      - Make changes in the existing .muse file and then choose File | Save and
    click on the Publish link again.

    +      - Choose File | Save As to create a new copy of the site. Make the changes
    required in the Muse workspace and then click on the Publish link again.'
  merge: -1
  img_proc: true
- pgno: 249
  md: '3. You can now publish over the existing temporary site by leaving the options
    as they are in the Publish dialog box, or you can create a new temporary site.
    This makes it easy for your client to compare the before and after changes.


    +   By choosing File | Save As, you are keeping your original site safe.


    4. When you''ve published a temporary site, it is listed in the Publish to menu
    in the Publish dialog box. You can select an existing site from the list, or choose
    to create a new site.


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_249_0.png)


    5. You can upload all the files, or only those that you''ve modified. If you have
    a very large website, it''s a good idea to upload only the modified files. When
    Muse is upgraded, it may be a good idea to republish the entire site.


    6. Repeat this process until you and the client are happy with the site. Hopefully
    that won''t take too many iterations.


    # Upgrading and launching


    The final steps involve "upgrading" your site and publishing it. When you get
    to this stage, you will need to pay for hosting fees. You will also need to register
    a domain name for your site and this is done through a third party.'
  merge: -1
  img_proc: true
- pgno: 250
  md: '# Register a domain name


    You will need to contact a domain registrar in order to buy the domain name that
    you want to use for your website. There are many sites offering this service online
    and you should be able to buy a .com domain for less than $10 online. Buying a
    domain name is very straightforward and is generally completed very quickly. We
    will return to the domain registrar after we complete a few more steps.


    # Upgrade to a published site


    The following steps will tell you how to upgrade your site and publish it:


    +   1. In Muse, with your previously published temporary site open, click on the
    Manage link. The Manage link is only available once you''ve published your temporary
    site.


    +   2. After clicking on the Manage link, the Business Catalyst admin console
    opens in your Web browser window. You''ll see the Dashboard where you can manage
    your Muse sites hosted by Business Catalyst. You''ll also be able to view your
    site''s statistics.


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_250_0.png)'
  merge: -1
  img_proc: true
- pgno: 251
  md: '+   3. Click the **Push Site Live** button on the **Dashboard**.

    +   4. The **Site Upgrade** window appears. Click on **Proceed to checkout**.
    You''ll need to enter your credit card information to complete the upgrade.

    +   5. Leave the default settings for the first two options:

    +      - Site hosting plan: **webBasics**

    +      - Billing option: **Invoice Me Directly**


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_251_0.png)


    +   6. Choose how frequently you want to be billed, fill in your credit card details
    and click on **Make Payment**.

    +   7. Your credit card payment is processed instantly, based on your selection.'
  merge: -1
  img_proc: true
- pgno: 252
  md: '8. You will be returned to the Dashboard and the Site Status is now Live.


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_252_0.png)


    # Associating the domain name with your Muse site


    Our temporary site is now upgraded and is hosted commercially by Business Catalyst.
    This upgrade means that we can associate our domain with the site name we bought
    from the domain registrar.


    Before an upgrade from a temporary site, the site address looks something like
    this:


    ```

    http://my_site.businesscatalyst.com

    ```


    (for example, http://mywindsurfingsite.businesscatalyst.com)


    After the upgrade and launch of a site, we can add our domain name so it looks
    more like this:


    ```

    http://my_domain_name.com

    ```


    (for example, mywindsurfingsite.com)


    In this section, you''ll use the interface in the Dashboard of the admin console.


    +   1. Click on the option in the Dashboard and then click on Add a domain.


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_252_1.png)'
  merge: -1
  img_proc: true
- pgno: 253
  md: '+   2. When the **Site Domains** dialog box appears, click on the **New Domain**
    option.

    +   3. Type in the domain name you registered in the **Domain** field. Do not
    include the www. prefix before the domain name, but do include the domain''s extension
    (such as, .com, .org, or others); for example: `my_domain_name.com`.

    +   4. Select the **Home Page** on the **Start Page** menu. Set the **Country**
    and **Culture** for the site. Leave all other default settings and click on **Save**.


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_253_0.png)


    +   5. You''ll see a confirmation message. Click on **Close** to close the **Add
    a New Domain** dialog box and return to the admin console. Your domain name that
    you added to the site is now listed.

    +   6. Click the **Dashboard** link in the left sidebar to return to the **Dashboard**.

    +   7. In the **Domains** section, the domain name you entered is now listed.


    # Re-delegating your domain name


    You are nearly there. There is only one more thing to do and that''s re-delegating
    your domain name. This just means making sure that when you type in your domain
    name in the browser, it goes to the right place.


    Unfortunately, this is not something you can do either through Muse or through
    the **Business Catalyst** dashboard. Here''s how to do it:


    +   1. Go to the website of the registrar that you bought your domain from.

    +   2. Most registrars have a Control Panel which you can use to re-delegate your
    domain. You''ll need a username and password supplied to you by the registrar.'
  merge: -1
  img_proc: true
- pgno: 254
  md: '3. Using your account information, log into the registrar''s website. You need
    to find the option to update the Domain Name System(DNS) settings. You need to
    update the name servers on the registrar to the following:


    +   - ns1.worldsecuresystems.com

    +   - ns2.worldsecuresystems.com

    +   - ns3.worldsecuresystems.com


    4. This process can vary from registrar to registrar. If you are having problems
    finding where to change the DNS settings, contact them directly.


    5. When the name servers have been changed you may need to wait for 24 hours for
    the settings to kick in. When they do, your domain name will bring you directly
    to your muse-created website. Congratulations!


    # Alternative hosting


    You are not tied to using Adobe''s Business Catalyst hosting. You can use any
    hosting service of your choice. The only difference is that firstly you will need
    to export your site as HTML, as seen in Chapter 11, Previewing and Testing your
    Site and then upload the folders and files using an FTP program to your host.


    # File Transfer Protocol (FTP)


    File Transfer Protocol (FTP) is a method of uploading files to your hosted Website.
    After you export your site as HTML, you can use the FTP software to transfer your
    files to your host.


    You will need to pay for hosting and for a domain name. There are some amazing
    offers out there for packages of hosting and domain names, so do some checking
    before buying the first hosting package you see.


    When you have arranged a host for your site, you will receive an email with FTP
    details, or a link to where you can find your FTP details on their website. As
    a minimum, you will need a username, password, and FTP address. You cannot guess
    these; they need to be provided by the hosting company. FTP is a method that verifies
    you''ve entered the correct username and password to connect to a specific site.'
  merge: -1
  img_proc: true
- pgno: 255
  md: '# FTP clients


    There are loads of free FTP clients (software) available online and they work
    perfectly. You don''t need to buy one for straightforward uploading or downloading.
    Here are a few well-known FTP clients:


    +   - FileZilla used in Linux, Mac OS X and Windows operating systems

    +   - SmartFTP used only in Windows operating system

    +   - SimpleFTP used only in Mac OS X operating system

    +   - CuteFTP used in Mac OS X and Windows operating systems


    When you use FTP, you can upload files from your local computer to the host server
    and download files from your host server to your local computer.


    When you enter your FTP details into the client, click on the Connect button.
    If all your details are correct, the FTP client will connect with the host computer.
    On one side of the FTP client''s interface, you will see the files on your local
    computer; on the other side you will see the files on your remote or host computer.


    By following the instructions from the hosting provider, you will be able to upload
    your local files (which you exported as HTML) to the remote host. Uploading is
    the same as publishing your files from the Business Catalyst dashboard.


    When your files have been uploaded, your site is live on the Internet. If you
    need to make changes to the site, make those changes in Muse and then export your
    files again. Upload only the files that have changed. When you are finished uploading,
    click on Disconnect.


    # Summary


    In this chapter, we discussed how to publish and launch your site. You can publish
    using Adobe''s own hosting with Business Catalyst or you can export your site
    as HTML and then upload it to a host of your choice.


    That ends our trip through Adobe Muse together. I hope you have enjoyed learning
    about the program and will go on to produce beautiful websites of your own.'
  merge: -1
  img_proc: true
