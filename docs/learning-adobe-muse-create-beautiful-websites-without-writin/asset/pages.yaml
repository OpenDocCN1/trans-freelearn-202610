- pgno: 84
  md: 'The alternative to Business Catalyst is to publish your Muse site to your own
    host server, which you may have already set up. To get the files for your website,
    you need to export the entire site. Muse will generate the HTML, CSS, and folder
    of images required for the site to function.


    +   1. Choose File | Export As HTML. The Export to HTML dialog box appears.

    +   2. Select the location on your computer to which you want to export the site
    files, and then click on OK as shown in the following screenshot:


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_84_0.png)


    After completing this operation, Muse exports the files and saves them in the
    local folder you specified. Navigate to the folder and open the image folder to
    access the optimized image files. You can repurpose these image files to create
    newsletters, mobile apps, social networking pages, and other related projects.


    # Exercise


    Now that we''ve created a new site and a wireframe to go with it, it''s a good
    idea for you to practice mocking up a site in Muse.


    Create a wireframe and site map for a fictitious website about your favorite movie.
    The site should include a home page, a cast page, a gallery page, a links page,
    and a contact page. A navigation bar should allow you to go to any part of the
    site with just one click.


    Create a simple wireframe of your design on paper and then recreate the wireframe
    in Muse. Preview your wireframe.'
  merge: -1
  img_proc: true
- pgno: 85
  md: '![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_85_0.png)


    # Downloading the example text and images


    You can download the example text and images files for this book you have purchased
    from your account at http://www.packtpub.com. If you purchased this book elsewhere,
    you can visit http://www.packtpub.com/support and register to have the files e-mailed
    directly to you.


    # Summary


    In this chapter we discussed some of the basic layouts used in web design. We
    looked at the idea of wireframing using pen and paper and also how to set up a
    site structure and wireframe in Muse.


    In the next chapter, we''ll look at individual and master pages.'
  merge: -1
  img_proc: true
- pgno: 86
  md: '# 4

    Powerful Pages


    Within Muse, we have two different kinds of pages – Master pages and web pages.
    In this chapter we''ll work with both types. We''ll also look at tools to help
    us layout and align the content on our pages and how to add links.


    By the end of this chapter you will know how to:


    +   - Create web pages and Master pages

    +   - Add content to the pages

    +   - Use rulers, guides, and the grid overlay to align the content

    +   - Zoom into and fit pages

    +   - Add links


    # Pages


    The vast majority of websites are made up of at least two pages, which are linked
    together. Again, in most of these websites there will be shared or consistent
    attributes across the pages that make up the site. As we saw in the previous chapter,
    Muse lets us easily create a site structure where we can organize and maintain
    our pages.


    When creating our websites, it''s a good practice to follow a style or standard
    format throughout all the pages in the site. While the content, which is the information
    you provide, will change from page to page, some elements such as the logo or
    navigation bar will remain the same, having the same size and position on the
    pages.'
  merge: -1
  img_proc: true
- pgno: 87
  md: 'In this chapter, we''ll continue building using the site structure we set up
    for the Windsurfing site and make changes to the master page, so that those design
    elements will appear on each page of our site. The following screenshot shows
    the sitemap as seen in the Muse''s Plan view:


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_87_0.png)


    Notice that the Prototype thumbnail shows us the content of that page. We can
    use the Size slider in the Plan view to zoom in and out. Our home page, often
    referred to as the Index page, contains links to the Gear page, Learning page,
    and a Contact page. The Gear page contains links to two other pages—Sails and
    Boards. This site structure lets us present the information to the users in a
    logical order, making it easy to always return to the home page from any point
    within the website.


    > Note that under each thumbnail we can see [A-Master] in blue. This tells us
    that the A-Master page (or first Master page) has been applied to each of our
    web pages.'
  merge: -1
  img_proc: true
- pgno: 88
  md: '# Master pages


    Let''s look at the Master pages and how they help us create consistency across
    our website. If you''ve used Adobe InDesign or QuarkXpress before, you will be
    familiar with the concept. Page consistency is critical for multiple-page printed
    documents too. Even if you haven''t used these sort of programs before, you have
    undoubtedly seen magazines where repeating elements such as page numbers, article
    titles, or the name of the magazine appear on the corner of each page.


    With print layout programs, items placed on Master pages appear in the exact same
    location on every document page. Changes made to a master page will ripple through
    the entire document which saves time and reduces the margin of error. This is
    exactly the same with your websites you create in Muse.


    As we saw in the previous chapter, Muse creates a blank home page and a blank
    Master Page by default, every time you create a new site. Whether you are making
    a one-page or multiple-page website, this initial setup is the starting point
    for any website and provides a useful overview or sitemap for your site.


    There are two ways to use the Master pages:


    +   - Plan out your sitemap by using blank pages (as we did in the previous chapter)
    and then apply the masters later

    +   - Apply the master to your home page at the start and then create new pages
    based on that design


    # Working with pages within your site


    In the previous chapter, we created a new site, a sitemap, and a working wireframe
    prototype using Muse''s Plan view. We quickly created six pages for our site.
    Now we''ll take a look at how to add, duplicate, delete, and rename pages quickly
    using the Plan view.


    There are two types of basic pages:


    +   - **Sibling pages**: These are pages that share the same parent page; in the
    case of our Windsurfing site, all top-level pages (Home, Gear, Learning, and Contact)
    are siblings.

    +   - **Child pages**: These pages appear below a particular page on a level of
    the site''s organization. In our example, Sails and Boards are child pages of
    Gear. Any page on any level of your site can have sibling pages or child pages.'
  merge: -1
  img_proc: true
- pgno: 89
  md: '# Adding a sibling page


    To add an extra sibling page to any level in your website, do either of the following:


    +   - In the Plan view, hover your cursor over the page thumbnail you are interested
    in. You''ll see the plus signs appear at the left or right side of the page.

    +   - Right-click (Ctrl + click) on a thumbnail of a page and choose New Sibling
    Page from the context menu that appears. Click on either the plus button to the
    right or left of the page. Type a title for the new page and press Enter (Windows)
    or Return (Mac OS).


    # Adding a child page


    To add a child page underneath any of your existing pages in your site, perform
    either of the following:


    +   - In Plan view, hover over any page''s thumbnail until you see a plus sign
    appear at the bottom of the page.

    +   - Right-click (Ctrl + click) on a thumbnail of a page and choose New Child
    Page from the context menu that appears. Click on the plus button at the bottom
    of the page. Type a title for the new page and press Enter (Windows) or Return
    (Mac OS).


    # Creating a duplicate page


    If you''ve already added some content to your page, or perhaps you have styled
    the page in a certain way that you want to re-use, you can easily make a duplicate
    page by performing the following step:


    +   - In the Plan view, either Alt + drag (Windows) or Option + drag (Mac) an
    existing page''s thumbnail'
  merge: -1
  img_proc: true
- pgno: 90
  md: '# Deleting a page


    Sometimes you''ll find that you just don''t need a page you created and you want
    to get rid of it.


    In the Plan view, hover over the page you want to delete until the delete icon
    (X) appears in the upper-right corner of the page.


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_90_0.png)


    Click on the delete icon and your page is gone.


    # Renaming a page


    Accidentally named one of your pages "Portfolio" but would prefer to call it "Gallery"?
    Muse easily takes care of any page name changes without breaking any links. To
    rename a page in the Plan view, double-click on the page title (beneath the page),
    and type the new page title.


    # Rearranging pages


    In the Plan view, drag a page to a different place in the site plan (for example,
    to the right of another page). When you see the blue drop zone, release the mouse.'
  merge: -1
  img_proc: true
- pgno: 91
  md: 'To get the full range of options we''ve discussed, just by a single click you
    can move your cursor over a page''s thumbnail, then right-click (Ctrl + click)
    and choose the option from the context menu that appears, as shown in the following
    screenshot:


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_91_0.png)


    # Editing page properties


    You''ll remember from Chapter 2, The Muse Workflow that when you first create
    your site, you fill in the Site Properties dialog box. This allows us to set up
    measurements for the page height, gutter, the number of columns, and margins.
    These values are not set in stone and you can come back to any individual page
    and make changes to those properties in the Plan view.


    First though, let''s ensure we understand the relationship between the page properties
    specified under Site Properties, properties of Master pages, and our normal web
    pages:


    +   1. The Master pages inherit their properties from the settings in the Site
    Properties — those we set up right at the start when creating our site.

    +   2. Web pages inherit their properties from the Master page that is applied.
    If a regular page has a None master applied, it inherits its properties from the
    Site Properties settings.


    To change the page properties for all pages and masters in your site, choose File
    | Site Properties.'
  merge: -1
  img_proc: true
- pgno: 92
  md: 'If you want to customize a page so that it is different from the settings in
    its applied Master page, choose Page | Page Properties. This lets you apply settings
    just to this individual page.


    For example, the Prototype page we made in the previous chapter should not be
    included in the navigation menu on each page. We''ll change the properties of
    that particular page by performing the following steps:


    +   1. In the Plan view, double-click on the Prototype page. This opens that page
    in Design view.

    +   2. Choose Page | Page Properties. The Page Properties dialog box opens up.

    +   3. On the Menu Options drop-down box, choose Exclude page from menus and click
    on OK.


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_92_0.png)


    +   4. Although they are very similar, we can notice some slight differences between
    the Site Properties and the Page Properties dialog boxes. One of the main differences
    is that there are two categories in the Page Properties dialog box: Layout and
    Metadata.'
  merge: -1
  img_proc: true
- pgno: 93
  md: '5. In the **Layout** category, let''s change the number of columns from 16
    to 2. We can see that once you make that change, the column width changes to 468
    automatically.


    6. Click on **OK** to apply the changes.


    The following list provides a brief explanation of each of the other fields in
    the **Layout** category of the **Page Properties** dialog. We''ll look at the
    **Metadata** category in the next chapter. Remember all the units are measured
    in pixels.


    +   - **Page Width** sets the width of the page.

    +   - **Minimum Height** sets the height of the page. This is not an absolute
    value because Muse supports dynamic page height based on page content. In plain
    English, that means the more content you add to your page, the longer the page
    will become.

    +   - **Center Horizontally** places the page horizontally in a browser. If this
    option is not enabled, the page is aligned to the left in the browser.


    +   - **Columns** sets the number of vertical columns on your page. Designers
    love columns! They let us create a grid, which then makes it easy to layout our
    text, images, and other content.

    +   - **Column width** sets the width of each column.

    +   - **Gutter** sets the space between the columns.

    +   - **Margins** specify a safe area of the page to place our page content. Margins,
    columns, and gutters in Muse are just like margins and columns as used in InDesign.
    You can hide margin and column guides by choosing **View | Hide Guides** or **Ctrl+:**
    (Win) or **Cmd+:** (Mac).

    +   - **Padding** controls the space (in pixels) between the edges of the browser
    window, and the edges of your web page.

    +   - **Favicon image** lets us pick an image, which is displayed as a tiny icon
    in the browser''s address bar. The Favicon can be considered part of our overall
    site branding.

    +   - **Include Page in Navigation** ensures the Include page is added in any
    menu widgets that you add to the page.


    For more information on working with widgets, see Add and edit widgets.


    +   - **Export page** includes the page when you publish or export your site as
    HTML.'
  merge: -1
  img_proc: true
- pgno: 94
  md: '# Page sizes


    Pages in Muse have a fixed width but are dynamic in height. Let''s say you have
    a header which takes up to 150 pixels and a footer which takes up to 200 pixels.
    These values are set using the page guides. Now let''s say that you set the minimum
    height to 600 pixels. If the length of your content is only 150 pixels, we get
    150 + 150 + 200 = 500 pixels. Our page is rendered as 600 pixels because that
    is the minimum height specified.


    If, however, we had content which takes up 500 pixels and add that to our values
    for the header and footer, our page will expand to display the content added to
    each page. The minimum height ensures a small level of consistency on pages which
    may not have much content.


    # Opening, saving, and closing a page


    To open any page in your site for editing, simply double-click the page in the
    Plan view. The page will spring open in the Design view. You can open as many
    pages as you want at one time. Each page appears as a tab along the top of the
    interface. The tab for the currently open page is highlighted, as shown in the
    following screenshot:


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_94_0.png)


    When you''ve made any changes to your pages, you can save them by choosing File
    | Save Site. This saves the changes to all your pages and your site plan in one
    go. It''s a good idea to be cautious and save your work regularly, just in case
    of a computer crash.


    When you''ve finished working on a page, you can close it by clicking on the Close
    icon (X) on the page''s tab.


    An asterisk in a site''s Plan tab indicates that the Muse site (.muse file) contains
    unsaved changes. You can see an example of this in the previous screenshot where
    the site name Windsurf has an asterisk beside it.'
  merge: -1
  img_proc: true
- pgno: 95
  md: '# Working with Master pages


    We''re going to open up our Master Page now and add a few simple design elements
    which will be applied to each page, by performing the following steps. Remember,
    in our plan view we could see that each page in our website had the A-Master page
    applied.


    +   1. Open the A-Master page, by double-clicking on its thumbnail in the Plan
    view.

    +   2. In the Design view, click on the swatch beside the Fill drop-down box in
    the options bar. Choose a mid blue color, with hexadecimal value # 29ABE2 and
    press Enter/Return on the keyboard.


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_95_0.png)


    Instantly, you''ll see that blue color is applied to the entire background of
    your page. The area outside the page remains dark grey.


    +   3. Now to add some type to the top of the page, select the Text tool and drag
    out a rectangle just above the Header guideline. The Header guideline is the second
    blue horizontal line.

    +   4. You''ll see your cursor flashing inside the text bounding box. Type the
    words Windsurf Wild. Then click on the Select tool on the toolbar to commit your
    text to the page. Your default text is probably small and black, and won''t stand
    out on the page, so we''ll edit it and choose a different typeface and color.'
  merge: -1
  img_proc: true
- pgno: 96
  md: '5. Choose the Text tool again and click anywhere between the text you just
    added. Your cursor will flash on and off between two letters. Double-click here
    to select both words or hit Esc on the keyboard, then click on T to select the
    entire text box to apply formatting.


    6. For the typeface choose Web Safe Fonts | Century Gothic from the Font drop-down
    box, set the Size to 48, and set the Color to white by clicking on the swatch
    drop-down box. Click on the bold icon (the first T to the right of the Size field).


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_96_0.png)


    7. Click on the Select tool to commit your type changes. To precisely position
    the text, use the Control Panel and set X to 42, Y to 20. This will place the
    bottom of each letter on the Header guideline.


    8. Let''s go back to the Plan view and take a look at how the changes in our Master
    Page have affected all of the pages in our site. Click on the Plan button at the
    top of the screen. Lo and behold, you should see all of the thumbnails appearing
    in blue with the Windsurf Wild heading appearing at the top of each page.


    # Creating a new Master page


    Now, let''s say we want some of our pages to have a blue background and some to
    have a red one. We could do this easily by creating a new Master Page with a red
    background and we''ll do it by duplicating our existing A-Master.


    +   1. In the Plan view, duplicate the Master Page by right-clicking (or Ctrl
    + clicking) on the A-Master page thumbnail. From the menu choose Duplicate page.

    +   2. A duplicate page appears with the words A-Master copy highlighted in blue
    appearing underneath.'
  merge: -1
  img_proc: true
- pgno: 97
  md: '+   3. Type a title for the new page; name it Red Background and press Enter
    (Windows) or Return (Mac OS).

    +   4. Double-click on the Red Background master page and change the background
    of the page to red using the steps outlined previously.

    +   5. Return to the Plan view. Your two Master pages'' thumbnails should now
    look different — one red and one blue.


    # Applying a Master page to a web page


    To try out our new Master page, drag the Red Background master page from the Masters
    area to the Sails page in the Document window. You''ll see the title of the Master
    page applied to the Sails page.


    Repeat the process and change the Master page applied to the Boards page. Your
    Plan view should now look similar to the following screenshot:


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_97_0.png)


    As you can see, it''s very easy to make changes to one Master and then apply it
    quickly to several pages.'
  merge: -1
  img_proc: true
- pgno: 98
  md: 'If you don''t want any Master page applied, that is, you just want to keep
    your original site settings on a particular page, right-click on the thumbnail
    of the page, and choose Masters | No Master from the drop-down menu.


    # Header and footer guides


    Muse provides an option to display a ruler along the top and along the left side
    of the workspace. The units on the ruler are in pixels and it is a useful layout
    tool. As for the rulers, Muse can display five page guides, which we''ll now take
    a look at.


    > As you hover over these guidelines on the left-hand side of the page, you''ll
    see a tool tip which describes the functionality of each guide.


    The first, fourth, and fifth guides give us our overall page size. Dragging the
    first guide upwards increases the amount of padding between the top of the page
    and the browser. Dragging the fourth guide down extends the size of the page.
    Dragging the fifth guide extends the amount of padding beneath the bottom of the
    page.


    The second guide defines the bottom of the header. As you drag this one down,
    you are increasing the height of the header.


    The third guide defines the top of the footer. If you''d like a smaller footer,
    drag this guide downwards. If you''d like a bigger or taller footer, drag this
    guide upwards.


    The header and footer guides can only be moved on Master pages. On normal pages,
    you''ll find that you can''t drag them to a new location and they are displayed
    for visual reference only.


    To show or hide header and footer guides, choose View | Show/Hide Header and Footer,
    Ctrl + Shift+: (Win), or Cmd + Shift+: (Mac OS).


    To show or hide rulers, choose View | Show/Hide Rulers, Ctrl + r (Win), or Cmd
    + r (Mac OS).


    To show or hide the grid overlay, choose View | Show/Hide Grid Overlay, Ctrl +
    '' (Win), or Cmd + '' (Mac OS).


    To show or hide page guides, choose View | Show/Hide Guides or Ctrl + ; (Win),
    or Cmd + ; (Mac OS).'
  merge: -1
  img_proc: true
- pgno: 99
  md: '# Adding text to a page


    In the next chapter, we''ll devote a lot of time to text and typography on the
    web, but for now let''s get a bit of practice with adding some text to one of
    our pages:


    +   1. Open the Learning page by double-clicking on the thumbnail in the Plan
    view.

    +   2. Turn on the grid overlay if it is not already visible by choosing View
    | Show Grid Overlay, Ctrl + ` (Win), or Cmd + ` (Mac OS).

    +   3. Turn on the rulers by choosing View | Show/Hide Rulers, Ctrl + r (Win),
    or Cmd + r (Mac OS).

    +   4. Open the text file provided by Learning.txt in a text editor of your choice.
    Select all the text and copy it.

    +   5. Return to the Learning page and choose the Text tool.

    +   6. Drag out a rectangle from the left-hand side, underneath and in line with
    the column where our title Windsurf Wild appears. As you drag, a tool tip provides
    information on the width of your text box. Drag out a box of width 631 pixels.
    While dragging across, start to drag down the page until your rectangle meets
    the footer guideline. As you drag, you will feel the edge of the rectangle snap
    onto the grid and the footer guideline.

    +   7. When you release the mouse, the cursor flashes in the top-left corner of
    the rectangle. Paste the text you copied by choosing Edit | Paste. Your text will
    now appear in the box. To precisely position the textbox when you''ve added it
    to the page, select it then use the Control Panel and set X to 42, Y to 105.


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_99_0.png)'
  merge: -1
  img_proc: true
- pgno: 100
  md: '+   8. Use the steps described previously to change the color of the newly-added
    text back to white. Set your text to Arial, color as White, and size as 12.

    +   9. Turn off the grid overlay by choosing View | Hide Grid Overlay, Ctrl +
    ` (Win), or Cmd + ` (Mac OS).

    +   10. Leave the Learning page open.


    # Creating links


    Without links the Web would simply not be a "web" but rather a huge collection
    of isolated individual pages. To connect the pages within a website, we create
    links. A link, also known as a hyperlink, is the path to another document, to
    another part of the same document, or to other media such as an image or a movie.


    Links are usually displayed as colored and/or underlined text that looks different
    from the main body of text. As well as linking from text, you can link from an
    image or another object.


    Clicking on a link opens up the corresponding document or web page in the browser
    window. Links can also open up documents such as PDF documents or they can perform
    a jump to another place within the same document.


    When you hover your cursor over a link, the cursor changes to a pointed finger
    and the web address of the link appears in the status bar at the bottom of the
    browser window.


    # Creating a link to a page in our site


    We''ll now add a couple of links to our Learning page, by performing the following
    steps:


    +   1. Select the word board in the second paragraph of text we recently added
    to the Learning page.

    +   2. In the Control Panel click on the Hyperlink pop-up menu and select the
    destination page from the list, in this case choose Gear:Boards.'
  merge: -1
  img_proc: true
- pgno: 101
  md: 'Note that as well as setting up where this link will take the visitor, you
    can use the Hyperlink drop-down menu to set the defined hyperlink to open a new
    browser window if required. In this case, do not check the Open the link in a
    new window or tab checkbox.


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_101_0.png)


    3. Repeat steps 1 and 2 and highlight the word sail in the same paragraph and
    add a link to the sails page. You now have two text links from this page to two
    other pages within your site.


    # Creating a link to an external web page


    It''s just as easy to add a link to another website. The following steps show
    how we do it:


    +   1. Select the word Kitesurfing in the first paragraph on the Learning page.

    +   2. In the Control panel, click inside the Hyperlink text box – the same one
    in which we chose the boards and sails links earlier. In here, we type the address
    of the page we are linking to.

    +   3. Type http://www.internationalkiteboarding.org/ and press Enter (Windows)
    or Return (Mac OS).

    +   4. You''ll see that a third link has now been added to our Learning page.'
  merge: -1
  img_proc: true
- pgno: 102
  md: '# Creating a link anchor


    When you add a link to another page or another website as we did in the previous
    exercises, the link opens up at the top of the page. Sometimes you may want to
    link to a specific part of a page. You''ve probably been on a long web page that
    contains a lot of text where the designer has provided a link back to the top
    at several points down the page.


    Another example where link anchors are often used is on **Frequently Asked Questions
    (FAQ)** pages where there are a number of questions at the top of the page. When
    a visitor clicks on a question, the page jumps or scrolls smoothly to the corresponding
    answer further down the page.


    You can also create links from one page to a link anchor on another page; links
    to other pages jump directly and don''t use the smooth scrolling behavior. The
    following steps show how to add a link anchor to a page:


    +   1. With your page open in the **Design** view, click on the **Link** anchor
    button in the **Control** panel. When you click on this button, it loads the gun
    with an anchor name.

    +   2. Move your cursor to the top left of the content where you want the user
    to view, then click to place the anchor.


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_102_0.png)'
  merge: -1
  img_proc: true
- pgno: 103
  md: '+   3. Enter a name for the link anchor in the **Create an Anchor** dialog
    box.

    +   4. To link to the link anchor, select any piece of text or an image that you
    want to link, and then select the correct link''s anchor name from the **Hyperlink**
    option in the Control panel, just as we did when we linked to the other pages
    in our site. If you find the small anchor icon annoying or off-putting, you can
    hide it by choosing **View | Hide Anchors.**


    # Creating an e-mail link


    An e-mail link is simply a link that, when clicked, will open the user''s e-mail
    program and populate the To field automatically with the e-mail address in the
    link. The following steps show how to add an e-mail link:


    +   1. Select some text or an image that you want to link.

    +   2. In the **Control** panel, click inside the **Hyperlink** text box.

    +   3. Type the e-mail address in the format myemail@email.com. Muse recognizes
    the @ symbol and knows it is an e-mail link rather than a regular link.


    # Understanding two different types of links


    In the exercises we''ve just completed, we dealt with two different types of link
    paths:


    +   - Absolute

    +   - Relative


    An absolute link provides the complete URL of the document you''re linking to.
    This type of link is also referred to as an external link. Absolute links generally
    contain a protocol (such as http://) and primarily are used to link to documents
    on other servers. In our example, we linked to the external site of the International
    Kiteboarding Association using the absolute address http://www.internationalkiteboarding.org/.


    A relative link is used for local links. This type of link is referred to as a
    document-relative link, or an internal link. We created relative links to the
    sail''s page and the board''s page. Muse takes care of the code for us, we just
    tell the program where we want to go when the link is clicked.


    # Changing the color of links


    The default color for a link is blue and a visited link is purple. You can easily
    make changes to these default settings and select colors that complement the background
    and other colors you are using on your web pages by performing the following steps.'
  merge: -1
  img_proc: true
- pgno: 104
  md: '1. Choose **File | Site Properties** after clicking on the **Hyperlinks** button
    or clicking on the **Hyperlink** drop-down menu. Then click on **Edit Link Styles**.


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_104_0.png)


    2. The first time you set link styles, there will be one default link style listed
    called **Link Style**.


    3. Notice there are four color swatch boxes. These represent the color and text
    style options for each link:


    +   - **Normal** defines the style for normal unvisited links.

    +   - **Hover** defines the style for hovered links. A link is hovered when the
    mouse moves over it.

    +   - **Visited** defines the style for visited links.

    +   - **Active** defines the style for active links. A link becomes active once
    you click on it.'
  merge: -1
  img_proc: true
- pgno: 105
  md: '+   4. Starting with the **Normal** link, click on the color swatch and set
    the link color to white and leave the underlined checkbox ticked.

    +   5. Set the **Hover** link to light blue with no underline.

    +   6. Set the **Visited** link to dark blue with an underline.

    +   7. Set the **Active** link to navy with an underline

    +   8. When you have finished making changes to your link colors, you can save
    the set as a link style. To add a new link style to the list, click on the **New
    Link Style** button (next to the trash can icon).


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_105_0.png)


    +   9. To rename a style, double-click on it to make it editable.

    +   10. To delete a link style, select it and click on the trash can icon.

    +   11. Your changes will be saved when you click on **OK** and close the dialog
    box. You will be able to apply the custom style to any link on any page, just
    as you would apply any character style to text.

    +   12. Click on the **Preview** tab to see your new link colors in action on
    your **Learning** page.


    # Editing and deleting links


    Web development is a constantly changing process. There are times when you''ll
    want to edit or delete a link. A URL to an external website may change, an e-mail
    address may change or you might find a link that contains an error.'
  merge: -1
  img_proc: true
- pgno: 106
  md: '# To edit a link


    Select the link, then simply re-type the correct URL or e-mail address into the
    Hyperlink field on the Options bar.


    # To delete a link


    Select the link, then highlight the URL, internal page link, or e-mail address
    in the Hyperlink field and press Delete/Backspace on the keyboard.


    # Creating a navigation bar


    Most websites include a navigation bar along the top of the page. For consistency,
    the navigation should be in the same place on every page. This avoids any confusion
    for the visitor and lets them move freely and easily through your website.


    In a traditional web design, we would manually need to link each page we wanted
    in the navigation bar by writing code and then adding the navigation bar to the
    top of each page.


    With Muse, however, we can very quickly add smart and robust site navigation that
    automatically reflects our sitemap layout.


    Let''s go back to our A-Master and use a menu widget that will automatically pick
    up the site structure and page names in our sitemap. We''ll add the menu to the
    page header. In the previous chapter, we set up a menu for our wireframe Prototype
    page. In this situation we are adding the menu to our Master page using the following
    steps, so it is repeated through every page which has that Master applied to it:


    +   1. Open your A-Master page in the Design view.

    +   2. We''ll increase the header height by dragging the header guideline down
    to the 100 pixel mark on the vertical ruler.


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_106_0.png)


    +   3. Go to the Widgets Library panel (on the right side of the screen) and click
    on Menus, or choose Object | Insert Menu. The Menus list expands and offers three
    different types of menu.'
  merge: -1
  img_proc: true
- pgno: 107
  md: '4. Choose the Horizontal widget and drag it to the header section of your page.
    You''ll see that the menu items automatically show the names of the pages in your
    sitemap.


    5. By using the Selection tool, align the horizontal menu under the Windsurf Wild
    text so that the menu text looks like it''s sitting right on the Header guideline.
    Notice the smart guides which appear to help you align the menu text with the
    Windsurf Wild text.


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_107_0.png)


    6. When the menu bar is correctly aligned and placed, click on the blue arrow
    to the right of the menu. This opens the Options panel for the horizontal menu.


    7. Set Menu Type to All Pages. This ensures that our child or submenu pages appear
    in the navigation bar.


    8. Set Item Size to Uniform Width. This will allow us to change the overall width
    of our menu while keeping the menu items evenly spread out.


    9. Move your mouse over the center handle on the right-hand side of the menu and
    drag out until the menu width matches the width of the Windsurf Wild text above
    it. Use the smart guides to help line it up nicely.


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_107_1.png)


    10. By using the Selection tool, select the menu, then click on the Type tool,
    or press T. By using the text options, set the menu typeface to Century Gothic,
    size 12, bold, and using the color picker, set the text to light blue #00FFFF.'
  merge: -1
  img_proc: true
- pgno: 108
  md: '11. Click on the **Preview** link to test how your menu looks. You should find
    that in just a matter of a few clicks you have created a fully functioning menu
    with a drop-down submenu under Gear.


    We''ll come back to our menu in the next chapter to do some further formatting.


    # Tips for navigation links


    Visitors to your website will use the links you provide to navigate around your
    site. Anyone who has been using the web for more than a week has come to expect
    the navigation to include the following:


    +   - **Links to the home page**: Most websites are organized around a home page,
    so you should always include a link to the home page from every other page on
    your site.

    +   - **Links to main topics**: For each web page that discusses a main topic,
    include links to other main-topic web pages.

    +   - **Descriptive links**: The name and text link of your pages should make
    sense to the visitors. You will have spent a lot of time working on your site
    so it will all make sense to you. Make sure it makes sense to someone who has
    been to your site earlier too. Use simple but descriptive text in your links.

    +   - **Link to a contact page**: If you''re providing a service or selling something,
    people will want to get in contact to get more information. Make it easy for them
    by providing a link to a contact page.


    # Zooming in, out, and about


    When you''re working in the **Design** view, don''t be afraid to zoom in closely
    so that you can clearly see where you are placing objects on your page. When you''re
    finished making changes, zoom out to get the full picture. The following sections
    show how you can change the magnification of your web pages in the Design view.


    # Zooming in


    It''s important to get in really close, when aligning or placing objects on your
    page, so that we zoom in. Click on the **Zoom** tool in the **Toolbox** and then
    click on the page to zoom in, or press Ctrl (Windows) or Cmd (Mac OS) + the equal/plus
    sign.'
  merge: -1
  img_proc: true
- pgno: 109
  md: '# Zooming out


    When you''re finished zooming in, you''ll need to zoom out again. Click on the
    Zoom tool in the toolbox. Press on Alt + click (Windows) or Option + click (Mac
    OS) on the page, or press Ctrl (Windows) or Cmd (Mac OS) + the minus sign.


    # Fit page to window


    When you fit a page to a window, the page resizes to the dimensions of your workspace.
    Choose View | Fit Page to Window, or press Ctrl + zero (Windows) or Cmd + zero
    (Mac OS).


    # Making page to its actual size


    If you''ve been zooming a lot, or changing the dimensions of your page in the
    workspace, you can always return the page to its actual size by choosing View
    | Actual Size or press Ctrl + 1 (Windows) or Cmd + 1 (Mac OS) on the keyboard.


    # Summary


    In this chapter we''ve looked at the concept of Master pages and how we use them
    to apply a look and feel across many pages. We learned how to add simple text
    onto individual web pages and how to add links. We used some of Muse''s layout
    tools, namely guidelines and the grid overlay to align our content.


    Congratulations, you can now build a fully-functioning website! Yes, it''s a basic
    site with just text and some links, but these are the fundamental building blocks
    of every web page.


    In the next chapter we''re going to look at another important building block in
    Muse - the rectangle.'
  merge: -1
  img_proc: true
- pgno: 110
  md: '# 5


    # The Joy of Rectangles


    In the previous chapter we looked briefly at how to add some text to our pages
    and also, how to add links to allow us to jump from page to page in the browser.
    These are an essential part of website building. In this chapter, we''re discussing
    another important fundamental building block of Muse websites - the rectangle.


    A rectangle is exactly as it sounds, that is, a shape. When we draw a rectangle,
    we''re creating a shape to layout objects in place on our pages. A rectangle can
    hold text or images, they can be filled with color and outlined with a stroke.
    And even though they are called rectangles, they can be square in shape and we
    can round their corners off to make them circular in shape.


    In this chapter we''ll learn how to do the following:


    +   - Set up a background rectangle

    +   - Create a rectangle

    +   - Select or adjust a rectangle

    +   - Cut/copy/paste rectangles

    +   - Position and rotate rectangles

    +   - Duplicate a rectangle'
  merge: -1
  img_proc: true
- pgno: 111
  md: '# Working with rectangles


    The main purpose of a rectangle in Muse is to act as a layout object on our page.
    They let us define sections on our page. Once a section or rectangle is created
    it can be filled with color and/or have a stroke applied around the edge. We can
    also fill a rectangle with a background image. Although every single web page
    is essentially made of boxes (whether you''re using Adobe Muse or some other web
    design tool), imaginative use of background images allows us to take the boxiness
    off a site. We''ll talk about images in much more detail in a future chapter.


    Another way to take the boxiness off a web page is to make the corners of a rectangle
    round. We can actually round the corners of a square so completely that it becomes
    a circle.


    In the following screenshot you can see that the rectangles on the left have straight
    corners while the rectangles on the right, which are exactly the same size, have
    round corners.


    The Grid Overlay has been turned on by choosing View | Grid Overlay to help with
    the alignment of these rectangles.


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_111_0.png)


    If you cast your mind back to Chapter 3, Planning your Site, you''ll recall that
    we created a wireframe layout on our homepage using rectangles, which represented
    the different parts of our page using rounded rectangles. We used the rectangles
    to block off areas of the page which would represent the header, a navigation
    bar, the main content area, and the footer. In a traditional web design this sort
    of setup is created using the HTML <DIV> tags. Our prototype looked similar to
    the following screenshot:'
  merge: -1
  img_proc: true
- pgno: 112
  md: 'In the previous chapter, we added text to the page by selecting the text tool
    and then clicking-and-dragging a rectangular shape out. This created a text frame.
    Text frames and other objects such as widgets and images behave very much like
    rectangles in respect to their design. For example, if you want to add a bevel
    or a stroke to a text box, you would follow the same procedure for both.


    > You can convert any rectangle into a text frame by double-clicking on it with
    the text tool.


    So let''s get started and create some rectangles on our pages. If you''ve been
    following along, open up the Windsurfing site in the Plan view so that you can
    see your site map.'
  merge: -1
  img_proc: true
- pgno: 113
  md: '# Setting up a master background rectangle


    A master background rectangle, is simply an area that we define on our master
    page. This area can hold an image or a block of color. The height of this rectangle
    is flexible and its height will vary with the amount of content which appears
    on each page. To set up a master background rectangle, perform the following steps:


    +   1. Double-click on the A-Master page to open it in the Design view. Notice
    the main section of our page is blue and around it there is an area of dark grey.
    When we originally set up our site with the width and height values of 960 x 800
    pixels, we created a container to hold our content. This container sits in the
    middle of the browser window — this is the blue area. When we first started working
    on our A-Master, we set our page color using the Fill option on the Options bar.
    The dark grey area around it is the space left on either side of our content in
    the browser. This is known as Browser Fill in Muse. Using Browser Fill, we can
    create the impression of a huge seamless background that runs the full width of
    a page on any screen, or we could create a background with distinct edges.


    +   2. We''re going to set the Browser Fill area to be the same color as our main
    content area. On the Options bar, click on the Browser Fill button. A drop-down
    menu appears. Set the color to #29ABE2. You can set the color by typing in the
    previous Hex value, or you can use the eyedropper tool to click on the blue in
    the main content area. This eliminates the possibility of a typing error and ensures
    we have picked up exactly the same color.


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_113_0.png)


    +   3. Now we''re going to change the color of the Fill area and change the corner
    radius to create a rounded rectangle, which will act as the background for our
    container. Click on the Fill button on the Options bar. On the drop-down menu,
    set the Color to white and set the Opacity to 50.'
  merge: -1
  img_proc: true
- pgno: 114
  md: '+   4. On the Options bar, set the **Stroke** value to 0. This removes any
    stroke around the main container.


    +   5. Again on the Options bar, set the **Corners** to 20. You can either type
    in the number 20 or click on the up arrow on the Options bar repeatedly until
    it gets to 20. When you''ve entered those values, your master page should look
    similar to the following screenshot:


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_114_0.png)


    As we know from the earlier discussion on master pages, the changes we''ve just
    made will now affect any of the pages in our site which have this master page
    applied. In the Plan view, notice that all of our pages, except the Red master
    pages will appear the same.


    +   6. Test how the changes affect the **Learning** page we created in the previous
    chapter by double-clicking on the **Learning** page in the Plan view. When the
    page opens in Design view, hit the **Preview** button to get a good idea of how
    the page will look in the browser.


    The really great thing about setting up our background in this way is that the
    rounded rectangle we have created will stretch to accommodate all of our content.'
  merge: -1
  img_proc: true
- pgno: 115
  md: '# Creating a rectangle on individual pages


    Now let''s take a look at how to add and manipulate rectangles to our other pages.


    +   1. From the Plan view, double-click on the Gear page to open it in Design.

    +   2. Click on the Rectangle tool in the toolbox at the top of the workspace.

    +   3. On the right-hand side of the page, drag across to draw a new rectangle.
    Drag out so the rectangle measures approximately 300 pixels across and 320 pixels
    down. Don''t worry if it''s not exactly right because we''ll fix the dimensions
    in the next section.


    We can change the dimensions using the resize handles which appear on each side
    and each corner of the rectangle. The rectangle remains adjustable until you click
    somewhere else to draw another rectangle.


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_115_0.png)


    > You can resize any rectangle by pressing Ctrl (Windows) or Cmd (Mac OS) – this
    switches to the Selection tool – then click on the rectangle and the resize handles
    reappear. Click and hold while dragging the handles to resize.'
  merge: -1
  img_proc: true
- pgno: 116
  md: '# Deleting a rectangle


    Let''s say we''ve added a rectangle to our page and then decide we don''t want
    it there anymore, it''s easy to remove it. Simply select the rectangle by clicking
    on it using the Selection tool and press Del on the keyboard.


    # Adjusting a rectangle


    Once a rectangle is added to a page, we can go back and modify it at any time,
    by performing the following steps:


    +   1. In the Design view, click on the Selection tool in the toolbox at the top
    of the workspace.

    +   2. Click on the rectangle you have just created. Once you select a rectangle,
    its dimensions become adjustable. To change the rectangle''s dimensions, click
    and drag any of the resize handles on the selected rectangle.

    +   3. To set the exact width and height of a selected rectangle, add the values
    in the Control Panel. Width is represented by W and height by H. Enter 300 for
    width and 320 for height.

    +   4. You can also specify the precise location of the rectangle on the page
    by entering the X and Y location values. X is the distance in pixels from the
    left-hand side of the page. Y is the distance in pixels from the top of the page.
    Enter a value of 610 and 130 pixels for X and Y respectively, as shown in the
    following screenshot:


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_116_0.png)


    > To create a perfect square instead of a rectangle when you are first drawing
    a rectangle, hold down the Shift key as you drag. Holding down Shift when you
    are resizing an existing rectangle constrains the proportions of the shape as
    you make the rectangle bigger or smaller.


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_116_1.png)'
  merge: -1
  img_proc: true
- pgno: 117
  md: '# Rotating a rectangle


    We can create interesting design effects by rotating rectangles. An example of
    this is where a rectangle holds an image and we rotate it slightly to give a casual
    appearance of the image having fallen onto the page. Perform the following steps
    to rotate a rectangle:


    +   1. In the Design view, select the rectangle you want to rotate.

    +   2. Move your mouse over any of the corner handles which appear around the
    rectangle. The cursor will change to a rotation icon and now you can manually
    rotate the rectangle around its center point.


    The previous steps can be performed or we can also increase or decrease the rotation
    angle in the Control Panel. The Rotation Angle option appears beside the X, Y
    coordinates and the Width and Height value field. It is the right most option
    in the Control Panel.


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_117_0.png)


    # Cutting, copying, and pasting rectangles


    So you''ve created a rectangle and now you''d like to re-use it somewhere else.
    The following steps show how to do it:


    +   1. In the Design view, select a rectangle on the page with the Selection tool.

    +   2. Copy the rectangle by choosing Edit | Copy, or press Ctrl + C (Windows),
    Cmd + C (Mac OS) to copy. Press Ctrl + X (Windows) Cmd + X (Mac OS) to cut.

    +   3. Paste the rectangle by choosing Edit | Paste or press Ctrl + V (Windows),
    Cmd + V (Mac OS). The rectangle will appear on the page. Use Edit | Paste in places
    when you want to ensure the copied object is placed in the same exact location
    while moving it from one page to another.'
  merge: -1
  img_proc: true
- pgno: 118
  md: '![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_118_0.png)


    What''s the difference between Cut and Copy?

    The Copy command makes a copy of the contents of the selection and when you paste
    it somewhere else, the original selection stays in place. The contents are now
    available in both the original location and the new location

    The Cut command removes the contents of the selection and when you paste it somewhere
    else, the original contents are gone. It will appear in the new location only.


    # Duplicating a rectangle


    An alternative to copying and pasting on the same page is to duplicate an existing
    rectangle. The following steps show us how to do it:


    +   1. In the Design view, select the rectangle you want to duplicate.

    +   2. Choose Edit | Duplicate or hold down Alt (Windows), Option (Mac OS) and
    drag to create a duplicate copy.

    +   3. To create a duplicate that remains in alignment horizontally or vertically
    with the original rectangle, hold down Alt + Shift / Option + Shift while dragging.


    # Adding color – fills and strokes


    Although we often use rectangles as "invisible" containers to hold our text or
    images, we can also apply color to them using fills and strokes.


    # Adding a stroke


    Perform the following steps to add strokes:


    +   1. In the Design view, select a rectangle.

    +   2. With the rectangle still selected, add a stroke color by clicking on the
    Stroke color picker in the Control Panel, and then choosing a stroke color. We
    can use the eye-dropper tool to select a color from the color field, or from another
    area on the web page, or you can specify RGB values. For this exercise choose
    white as the stroke color.'
  merge: -1
  img_proc: true
- pgno: 119
  md: '# Picking and Saving Colors


    Anytime you use the color picker, whether it''s for a stroke, a fill, or a browser
    fill, you can create a new color swatch in conjunction with the color picker.
    Click on the New Swatch icon next to the trash can icon in the lower-right corner
    of the color picker after specifying a new color and this will save the swatch
    for you.


    Double-clicking on a swatch in the Fill color picker allows you to assign a friendly
    name to a color, such as Lime Green, rather than #DBD820. Once you''ve given it
    a more user-friendly name, that name is displayed as a tool tip when you hover
    your mouse over that color swatch.


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_119_0.png)'
  merge: -1
  img_proc: true
- pgno: 120
  md: '+   3. Change the stroke width by increasing or decreasing the number in the
    Stroke width box to the right of the color picker. Set the stroke width to 5 pixels.

    +   4. To create round corners for this rectangle, set the Corners value to 15
    pixels.

    +   5. Optional: Click on the Stroke menu (the word Stroke in the Control Panel)
    to specify the additional options, as explained in the following sections


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_120_0.png)


    # Stroke alignment


    This option lets us choose exactly where the stroke appears on our rectangle.
    The choices are center, inside, or outside of the rectangle. Click on each one
    to see the effect it has on your rectangle stroke.


    # Stroke widths


    This allows you to specify the width of the top, bottom, left, and right strokes
    individually. By default, these numbers are grouped so that when we increase or
    decrease the stroke width, all sides of the rectangle will change together. We
    can ungroup strokes by clicking on the link icon. When the link icon looks as
    if it is broken, the strokes are ungrouped. Now we can change the width or any
    side at a time.


    # Changing rectangle fill


    Just as we can change the stroke color on a rectangle, we can change the fill
    color. The fill color covers the entire width and height of the rectangle. When
    you add text to a rectangle, the text appears in front of the fill color. The
    following steps show us how to do it:


    +   1. In the Design view, make sure your rectangle is selected.

    +   2. Change the fill of the selected rectangle by clicking on the Fill color
    picker in the Control Panel, and then selecting a fill color as described for
    choosing a stroke color. You can specify RGB values, a hexadecimal value, or select
    a color from the color field or from another area on the web page.'
  merge: -1
  img_proc: true
- pgno: 121
  md: 'If you don''t want any color fill in your rectangle, click on the None swatch.
    That''s the first swatch with the red diagonal line through it.


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_121_0.png)


    3. If you want to choose a color for your rectangle background, click on the Fill
    menu (the word Fill in the Control Panel) to specify the following options for
    solid fills:


    +   - **Opacity:** This option specifies the opacity (or how transparent the background
    color is).

    +   - **Color:** This option sets the fill color and brings up the same color
    picker as the one you can access from the Control Panel.

    +   - **Image:** This option lets you pick an image to use as a background in
    your rectangle.

    +   - **Fitting:** This option lets you fit the image within the rectangle according
    to a number of options, including Scale to Fill, Scale to Fit, and a number of
    tiling options. When you set the Fitting option to Tile, the tiled image is only
    downloaded once, reducing your page download time.

    +   - **Position:** This option specifies the position of the background image
    inside the rectangle relative to your selection.'
  merge: -1
  img_proc: true
- pgno: 122
  md: '# Setting a gradient fill


    Instead of using a solid color as a background to a rectangle, we have the option
    of using a gradient. The following steps show us how we do it:


    +   1. Click on the Fill menu on the Control Panel.

    +   2. Click on the Gradient radio button to reveal the gradient options.

    +   3. Set your start color by clicking on the color picker on the left. Choose
    a light blue similar to the main page background.

    +   4. Set your end color to a dark navy.

    +   5. Set the direction to Vertical and leave the other options as they are.
    The changes to your rectangle fill will appear as you make changes.


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_122_0.png)'
  merge: -1
  img_proc: true
- pgno: 123
  md: '6. The options for Gradient fills are somewhat similar to the options when
    we choose a solid color, The following provides a brief explanation of each:


    +   - **Opacity**: This option allows us to specify the opacity at the start and
    end of the gradient. This is very useful for gradually blending a rectangle into
    the background of the main page

    +   - **Color**: This option lets us pick the two colors which will form our gradient.

    +   - **Focal Point**: This option specifies the point in the background color
    where the gradient begins. 50% or midway is the default.

    +   - **Direction**: This option lets us choose which way our gradient will run
    – either horizontally or vertically.

    +   - **Size**: This option allows us to specify how the two colors we choose
    will blend into each other. Setting **Automatic** creates a gradient that spans
    from the start color to the end color to fit the height or width of the object
    that the gradient is filling. The alternative is to enter a pixel value which
    causes the gradient to blend from the start to end color within that specified
    number of pixels.


    # Adding an image to a rectangle


    Let''s add a picture of two windsurfers to our existing rectangle. Remember that
    the rectangle we created has dimensions of 300 x 320 pixels. We''re going to put
    an image into the rectangle which is about double this size and uses the options
    available to make it fit nicely. The following steps show us how to do it:


    +   1. With the rectangle selected on the page, click on the **Fill** menu on
    the Control Panel.

    +   2. We''re replacing our gradient fill now, so click on the **Solid** radio
    button on the **Fill** menu. This gives us options for solid colors and images
    as outlined in the information box.

    +   3. Click on the folder icon beside the word **Image** to choose a background
    image to go into the rectangle. The operating system file browser opens, so navigate
    to your images folder and choose the Gear-Windsurf.jpg file and choose **Open**.

    +   4. The image appears inside the rectangle. Notice that the image appears cropped.
    We can change how the image fits inside the rectangle by clicking on the **Fitting**
    drop-down options. Choose **Scale To Fill**.'
  merge: -1
  img_proc: true
- pgno: 124
  md: '5. Now click on the Position icon to choose how the image is positioned. Depending
    on your image there may be a certain amount of trial and error when choosing your
    positioning. Click on each of the empty points on the icon to see how the position
    of the image within the rectangle changes. For this example, the center point
    seems to work quite nicely.


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_124_0.png)


    # Adding effects to rectangles


    In Muse, you can add effects such as drop shadows, bevels, and glows to a rectangle,
    an image, a text box, or any other object. The following sections show how we
    do it.'
  merge: -1
  img_proc: true
- pgno: 125
  md: '# Adding a drop shadow


    The drop shadow is certainly one of the most popular effects used by designers.
    It allows us to add some depth to our page and give the impression that the object
    is lifting slightly off the page. As with most design effects, moderation is the
    key. The following steps show us how to do it:


    +   1. In the Design view, select the rectangle to which you want to add a drop
    shadow.

    +   2. On the Control Panel, click on the Effects menu.

    +   3. Click on the Shadow category and select On.

    +   4. Set a Color for the shadow. Remember, not every drop shadow needs to be
    black. We can create a more subtle effect by choosing a color which is a darker
    shade of the main page''s background color. Choose a dark navy color for this
    exercise.

    +   5. Set the opacity of the Shadow to 60 as shown in the following screenshot:


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_125_0.png)'
  merge: -1
  img_proc: true
- pgno: 126
  md: '+   6. Set the **Size** to 8.

    +   7. Set the **Distance** to 8 and leave the rest of the values at their default.

    +   8. The following provides a brief explanation of the options available when
    choosing a Drop Shadow:

    +       - **Color:** Sets the drop shadow''s color.

    +       - **Opacity:** Sets the drop shadow''s opacity.

    +       - **Size:** Lets you set how thick the drop shadow appears.

    +       - **Angle:** Sets the location of the drop shadow in relation to the rectangle.
    The default is a 45-degree angle and this places the drop shadow to the right
    and the bottom edges of the rectangle. The higher the angle number, the drop shadow
    moves around the rectangle.

    +       - **Distance:** Specifies the distance between the drop shadow and the
    rectangle.

    +   9. To remove the drop shadow, clear the **On** checkbox.


    # Adding a bevel effect


    The bevel effect also adds depth to an object by adding light and dark edges.
    The following steps show us how to add the effect:


    +   1. In the Design view, select the rectangle again. Note that it will be difficult
    to see the bevel in action when there is a stroke on the rectangle, so you may
    want to temporarily remove the stroke on the rectangle first.'
  merge: -1
  img_proc: true
- pgno: 127
  md: '2. In the Control Panel, click on the Effects menu to see a window as shown
    in the following screenshot:


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_127_0.png)


    3. Click on the Bevel category and select On to activate the bevel options.


    4. To remove the bevel, uncheck the On box.'
  merge: -1
  img_proc: true
- pgno: 128
  md: '# Adding a glow


    The third and final effect is the glow, which lets us apply a glowing edge to
    any rectangle. The following steps show us how to add a glow:


    +   1. In the Design view, make sure you select the rectangle to which you want
    to add a glow.

    +   2. In the Control Panel, click on the Effects menu to see a window similar
    to the following screenshot:


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_128_0.png)


    +   3. Click on the Glow category, select On to activate the options.

    +   4. To remove the glow, uncheck the On box.'
  merge: -1
  img_proc: true
- pgno: 129
  md: '# Change stacking order of rectangles


    Frequently you''ll find that you have more than one rectangle on a page. When
    you move a rectangle on top of another, you may get the unexpected result that
    the one you wanted on top is now underneath. This is because Muse creates what''s
    known as a stacking order as it creates rectangles. Luckily, it''s very easy to
    change the stacking order and this technique is applicable to other objects on
    the page too.


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_129_0.png)


    The following steps show us how to do it:


    +   1. To bring a rectangle forward in the stacking order (or put it on top),
    select the rectangle and choose Object | Bring Forward.

    +   2. To move a rectangle backward in the stacking order, select the rectangle
    and choose Object | Send Backward.

    +   3. To bring a rectangle to the top-most level of the stacking order, select
    the rectangle and choose Object | Bring to Front.

    +   4. To move a rectangle to the very bottom of the stacking order, select the
    rectangle and choose Object | Send to Back.


    > All of the stacking options above are available by right-clicking/Ctrl + clicking
    on the rectangle.'
  merge: -1
  img_proc: true
- pgno: 130
  md: '# Creating a mixture of round and square corners


    We can play around with the corner radius of individual corners on our rectangles
    to achieve some nice effects. Let''s say we want to create a shape with 3 round
    corners and one straight corner at the top right. The following steps show us
    how to do it:


    +   1. In the Design view, draw out a new rectangle or select an existing one
    on the page.

    +   2. Select round corners for the top-left, bottom-right and bottom-left corners
    on the Control Panel. Click on the top right corner on the Control Panel so a
    straight corner icon appears.

    +   3. Increase the rounding radius to 50 to get a dramatic rounding effect on
    the three round corners; this will make the straight corner stand out more.


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_130_0.png)


    We can change back from round to straight on any of the four corners and the effect
    will be apparent immediately.'
  merge: -1
  img_proc: true
- pgno: 131
  md: '# Creating full width rectangles


    Most of the time, when we create rectangles with the Rectangle tool, we specify
    the size of the rectangle by entering values in the Width and Height fields of
    the Control Panel, or by dragging the transformation handles.


    We can also set a rectangle to be displayed at the full width or 100 percent of
    the browser window. This means that the rectangle will resize itself to fill the
    page regardless of how wide the visitor has their browser window set.


    A full width rectangle can be filled with a solid color, a gradient or an image
    background fill. If you set a tiled background image fill, the tiled image will
    tile seamlessly to expand as needed to fill the 100 percent width of the page.


    The following steps show us how to set up a full width rectangle:


    +   1. On the Gear page, in the Design view, use the Rectangle tool to draw a
    rectangle near the bottom of the page.

    +   2. With the rectangle still selected, set up your Fill and Stroke options
    as described earlier.

    +   3. Use the Selection tool to drag both the left and right sides of the rectangle
    to align them with the two left and right edges of the entire page width. The
    rectangle will span the entire horizontal width of the page.

    +   4. You will notice a red highlight appear on the left and right edges of the
    page and you''ll feel the rectangle snap into place as you align each side of
    the rectangle.


    When using a tiled image, the image will repeat over and over to fill the rectangle.
    The advantage of doing this is that the browser only downloads the image once,
    reducing download speeds. With a clever choice of background image, a designer
    can create the illusion of a large image spanning the width of the page.


    # Summary


    In this chapter we have learned how to set up a flexible background rectangle.
    We''ve added rectangles to our pages and manipulated their size, fill color, and
    stroke and learned how to add effects such as drop shadows.


    In the next chapter we''re taking an in-depth look at how to work with Type in
    Muse and how to deal with typography on the Web.'
  merge: -1
  img_proc: true
- pgno: 132
  md: '# 6

    Typography, Muse,

    and the Web


    In the previous chapter we looked at how rectangles are the building blocks of
    a Muse web page and how to use them both for content and as design elements. Yet
    another absolutely fundamental element of any web page is text. Websites are all
    about communication and naturally, text is a big part of that.


    In this chapter we''ll add text and learn how to edit it, apply styles, and use
    frames to control where it appears on your web page. We''ll also discuss the role
    of typography in producing eye-catching and interesting designs, and why our choice
    of typeface for the Web is so important.


    By the end of this chapter you''ll know how to:


    +   - Create text

    +   - Edit text

    +   - Create and edit character styles

    +   - Create and edit paragraph styles

    +   - Add headings

    +   - Apply spacing and formatting to text

    +   - Wrap text around an image

    +   - Add metadata to your web pages

    +   - Choose "web-safe" fonts'
  merge: -1
  img_proc: true
- pgno: 133
  md: '# The power of text


    When we talk about text and design, we''re not just referring to the type of font
    we want to use. We need to present our text clearly and in an organized fashion
    so that our visitors can find the information they need quickly and easily.


    Typography is a huge subject in itself and something to which some designers and
    typographers will devote years of study. Although we can''t go into a huge amount
    of depth on the design of type, it''s important to be familiar with the anatomy
    and categories of type so that we can make informed choices about the typefaces
    we use.


    # Anatomy of type


    Type is a vital element in any design in which it appears. As well as being a
    piece of text to read, it can also be viewed as a shape or as a visual element.
    Before we start adding type to our designs, it''s a good idea to understand a
    little bit about typography and some typographic terms. The following image shows
    a short visual glossary of some of the terms you will come across when working
    and learning about type:


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_133_0.png)'
  merge: -1
  img_proc: true
- pgno: 134
  md: 'The following are the typographic terms along with an explanation:


    +   - **The Baseline**: This is the imaginary line that the text sits on.


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_134_0.png)


    +   - **The x-height**: Based on traditional printing methods, the x-height is
    the height of the lowercase letter x. However, as a general rule, the x-height
    can be described as the height of lowercase letters in a font excluding the ascenders
    and descenders.


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_134_1.png)


    The x-height can vary quite a bit from font to font. The x-height gives the overall
    impression of the font''s size. In the following illustration, all of the text
    is set to a point size of 21, but as you can see, each word looks quite different
    in height and weight.


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_134_2.png)


    +   - **The Ascender**: This is the stem of lowercase letters (h, b, k for example)
    that rises above the x-height of the other lowercase letters in a typeface.


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_134_3.png)'
  merge: -1
  img_proc: true
- pgno: 135
  md: '+   - **The Descender**: This is the part of a lowercase letter (g, q, y for
    example) that falls down below the baseline. Often the uppercase letters Q and
    J descend below the baseline.

    +   - **Roman/Regular**: The upright style of a typeface.

    +   - **Italic**: A slanting or script-like version of a typeface.

    +   - **Boldface**: A typeface rendered in a heavier, thicker stroke, used to
    make text stand out.

    +   - **Cap Height**: The height from the baseline to the top of the uppercase
    letters in a font. This is not always the same height as the ascenders.

    +   - **Character**: A single element such as a letter, a number, or a punctuation
    mark.

    +   - **Condensed Font**: This is a narrower version of a font. It is used to
    fit more characters into a given space.


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_135_0.png)


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_135_1.png)


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_135_2.png)


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_135_3.png)'
  merge: -1
  img_proc: true
- pgno: 136
  md: '+   - **Drop Cap**: This is a popular and effective design style in which the
    first letter (a capital letter) is set in a larger point size and aligned with
    the top of the first line. It is often used to indicate the start of a chapter
    or a new section of a document.


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_136_0.png)


    +   - **Raised Cap**: This is another design style where the first capital letter
    is set in a larger point size and aligned with the baseline of the first line
    of text.


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_136_1.png)


    +   - **Reversed Type**: This is the type that is printed or viewed on screen
    as white on black, or light-colored on a dark background.


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_136_2.png)


    +   - **Left Align Text**: Text is aligned to the left, leaving the right edge
    of the paragraph ragged.

    +   - **Centre Align Text**: Text is aligned to the center, leaving both edges
    of the paragraph ragged.

    +   - **Right Align Text**: Text is aligned to the right, leaving the left edge
    of the paragraph ragged.'
  merge: -1
  img_proc: true
- pgno: 137
