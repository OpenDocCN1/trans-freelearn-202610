    +   4. With the text added, click after the words Lorem ipsum dolor. You''ll see
    the cursor flashing. Press Enter/Return on the keyboard to push the rest of the
    text onto a new line and create a new paragraph. We''re going to use Lorem ipsum
    dolor as our main heading.

    +   5. Select all the text except Lorem ipsum dolor by clicking and dragging,
    then use the Text panel or the options in the Control Panel at the top of the
    Design view workspace to set the formatting options. You can choose the typeface,
