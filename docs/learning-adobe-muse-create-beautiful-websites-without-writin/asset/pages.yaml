    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_151_0.png)'
  merge: -1
  img_proc: true
- pgno: 152
  md: '# Text wrapping


    It''s not unusual to see boxes of information or images appearing within the text
    content of a web page. Textboxes within textboxes are sometimes referred to as
    callouts and they supplement the main text with additional information.


    Muse makes it easy to create callouts by letting us wrap text around an object
    such as a rectangle, another text frame, or an image. In the following steps we''re
    going to cut the image currently on the Gear page and paste it inside the text
    frame we created at the beginning of this chapter. We''ll then wrap the text around
    the image so it flows nicely.


    +   1. Open the Gear page in the Design view. Currently it consists of a heading,
    a text frame, and a rectangle holding an image of two windsurfers.

    +   2. Use the Selection tool to select the image on the right-hand side of the
    page.

    +   3. Choose Edit | Cut, to cut the image from the page and onto the clipboard.

    +   4. With the Selection tool, click on the text frame, then drag one of the
    handles on the right-hand side of the text frame so that the frame almost fills
    the width of the page.

    +   5. Then, use the Text tool to define a text insertion point in a text frame.
    Click once just before the word In on the first line of the first paragraph. Paste
    the element you copied previously (Edit | Paste) to insert the object as an inline
    element in the text frame.


    The image is now inside the text frame but it looks a bit awkward as all of the
    text has dropped down below it. Take a look at the Wrap options in the Control
    Panel at the top of the screen.


    +   6. Choose between the following wrap options:

    +     - Inline in text

    +     - Position left

    +     - Position right'
  merge: -1
  img_proc: true
- pgno: 153
  md: '7. Click on each of the wrap options so you can see how the position of the
    images changes and how the text wraps around it.


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_153_0.png)


    The text runs right up to the edge of the image, leaving it with no breathing
    space. In order to put a bit of padding around the inline element (the image)
    we''ll add offset values.


    8. Click on the Wrap drop-down box on the Control Panel. Add 10 pixels of padding
    to the right of the image and 5 pixels to the bottom.


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_153_1.png)'
  merge: -1
  img_proc: true
- pgno: 154
  md: '> Whenever text flows around an element, make sure that the element is not
    so wide that it makes the text area too narrow. This can make the text very difficult
    to read.


    # Web-safe fonts


    There is a list of font families that exists, and this list is known as the safe
    list. It consists of a number of font families that are supported, by default,
    on Windows PCs and Apple Mac computers.


    It is safe to use these fonts on your websites because basically almost everyone
    has them installed on their computers. This means that if you use a font such
    as Georgia (which is on the list), it is safe to assume that everyone who comes
    to your website will see your beautiful typography as you intended them to see
    it.


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_154_0.png)


    Now let''s say that you''ve created your own gorgeous font that you really, really,
    really want to use, but only you and two other people in the world have it, then
    the problem is that everyone else will not see that font when they come to your
    website. They will see a replacement or a default font (possibly something like
    Times New Roman) and all your hard work of choosing fonts will be wasted.


    So as a designer, using Muse, you have three choices. You can stick with the web-safe
    fonts and then you know your visitors will see your site type as you intended.
    You can use Typekit or (and we really want to avoid this option if possible) you
    can replace text with images. This means that if you want to use that unique font
    that no one else has, Muse will convert the text into an image which will be exported
    when you publish your site or export the HTML.


    The disadvantage of the safe list is that it is limited both in the number of
    fonts and also the variety of styles (bold, italic, regular) within each font
    category.'
  merge: -1
  img_proc: true
- pgno: 155
  md: 'The disadvantage of using images instead of type is that the search engines
    cannot read images in the same way they can read type. So if you want to use this
    method, only use it for headings. Do not use it for your main body copy.


    # Metadata – the hidden text on your page


    In the previous section we looked at the importance of headings in relation to
    SEO. Another important factor to consider is your page''s metadata.


    Metadata is data about data. In simple terms, it''s the information about the
    web page. It is invisible to your human visitors but is visible to the search
    engines that come to your site. Metadata is stored in meta tags that are hidden
    in the <head> of the HTML document. As we''re using Muse, we don''t need to worry
    about the <head> and <body> tags but we do still need to put the metadata into
    each of our pages.


    The two most important Meta tags used in SEO are description and keywords. Here''s
    how we add them:


    +   1. With the Gear page open in the Design view, choose Page | Page Properties.
    The page properties dialog box opens.

    +   2. Click on the Metadata tab to see a window similar to the following screenshot:


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_155_0.png)'
  merge: -1
  img_proc: true
- pgno: 156
  md: 'Here''s a brief explanation of the options in the Metadata category:


    +   - **Description** specifies the description of your page.

    +   - **Keywords** specifies the keywords for your page.

    +   - **HTML for <head>** allows us to place HTML code into our Muse pages. An
    example of this would be adding Google Analytics code to track how many visitors
    the page has.

    +   - **Page Name** is the name of the page as it appears in Muse.

    +   - **Page Title** is the title of the page that appears in the browser. Select
    the **Same as Page Name** option if you want Muse to use the page name for the
    page title as well. (It''s the default selection.) Using a descriptive page title
    can help with your SEO efforts while giving your visitors a quick overview of
    what the page is about.

    +   - **File Name** is the name of the file that will load in a browser. Muse
    appends the `.html` file extension to the filename by default. Select the **Same
    as Page Name** option if you want Muse to use the page name for the filename as
    well. (It''s the default selection.)

    +   - You need to add metadata to each of the pages in your website individually.
    It only takes a minute or two per page and is an important part of your overall
    SEO efforts.


    # Summary


    In this chapter we looked at how to add and style text on our web pages. We saw
    how to combine images and text, wrapped together in a text frame. We discussed
    the importance of headings both from an organizational and SEO point of view,
    and we saw how to add the hidden (to human visitors) metadata to our pages.


    In the next chapter we will learn how to work with images within Muse and how
    to bring in images from Photoshop.'
  merge: -1
  img_proc: true
- pgno: 157
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 158
  md: '# 7


    # Working with Images


    While designing web pages, we use images that are eye-catching and interesting
    focal points for visitors. Images are used for everything from background images
    to bullet points. In this chapter, we''ll add images to our website, transform
    them, change their opacity, and look at how Muse is tightly integrated with Photoshop.


    In this chapter, you will be learning the following topics:


    +   - Choosing a suitable file format for your images

    +   - Placing an image

    +   - Duplicating an image

    +   - Resizing, rotating, cropping, and positioning an image

    +   - Adding effects to an image

    +   - Setting image opacity

    +   - Pinning an image

    +   - Pasting an image from another program

    +   - Using an image as a background

    +   - Grouping multiple objects together to work with them as a single object


    Using images within your content can be a powerful way of capturing visitors''
    attention and communicating your message. Images can draw people towards parts
    of the pages they may not have looked at during a quick scan. If used effectively,
    they are a powerful tool for guiding your visitor''s eyes to where you want them.'
  merge: -1
  img_proc: true
- pgno: 159
  md: '# Hello web-friendly images


    When we''re designing our websites, it''s important to keep in mind that images
    that are destined for the Web need to be prepared accordingly. Unlike the world
    of print where we can use huge file sizes at very high resolution, on the Web
    we need to compromise between a low size of image file and a high-quality image.
    Before we even open Muse, we make that compromise by following these steps:


    +   1. Set the correct dimensions and resolution for the image: You need to decide
    how big your image should be and save it at that size before you bring it into
    Muse. While it is possible to resize an image in Muse (and we''ll take a look
    at that shortly), it''s good practice to save the image at the correct dimensions
    in Photoshop, Illustrator, or whatever graphics editor you''re using.

    +   2. Decide which file format you want to use: Image files used on the Web are
    saved as JPEG, GIF, or PNG. Almost all the web browsers recognize and are compatible
    with these file formats. (Each file format has been explained in Choosing the
    best file format section.)

    +   3. Save and compress the file: If you''re using Photoshop or Illustrator to
    create your images, choose File | Save for Web & Devices to scale your images
    down to the smallest file size possible while keeping the quality reasonably high.
    If you''re using another graphics editor, save your file in either a JPEG, GIF,
    or PNG format by choosing File | Save As.


    Following these steps will produce images that look good and download quickly.


    # Choosing the best file format


    Before we start going crazy with our images on the website, we need to understand
    some basics about the type of image file formats we can use on the Web and how
    to choose the best one for the job. As mentioned, there are three image formats
    that are supported by nearly all web browsers. The one you pick depends on how
    many colors are there in your image and whether it has any transparent areas.


    They are as follows:


    +   1. JPEG

    +   2. GIF

    +   3. PNG


    Here''s an overview of each image file format:'
  merge: -1
  img_proc: true
- pgno: 160
  md: '# JPEG


    JPEG (.jpg) stands for Joint Photographic Experts Group and was developed to store
    photographic images. This format supports millions of colors, but is known as
    a lossy format, meaning it throws away fine details to compress the image into
    a smaller file.


    The good news is that we can choose the level of compression when we save an image
    in a JPEG format. It''s possible to set the amount of compression on a scale of
    0-100 (0 is the highest compression and lowest quality; 100 is the least compression
    and highest quality).


    Unlike GIF and PNG images, JPEG images can provide fairly small file sizes at
    24-bit color. This makes them great for any type of photography or graphics with
    heavy textures or long gradients.


    In order to avoid the visual artefacts that can appear when you save a JPEG image,
    think carefully about the amount of compression that you apply. There''s no point
    in having a tiny file size if the image looks rubbish. In the next screenshot,
    you can see an image panel showing how the file looks with no compression (top
    left-hand side), 70 percent quality, 35 percent quality, and 17 percent quality.
    The lower the quality, the greater the compression. You can see how the image
    starts to look pixelated at a lower quality.


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_160_0.png)'
  merge: -1
  img_proc: true
- pgno: 161
  md: '# GIF


    Graphics Interchange Format (GIF) is a good choice when working with solid blocks
    of color, a logo for example, or with line art having no gradients. Say you want
    your logo on your website to blend seamlessly into the background of a web page,
    you could save the image with no background and save it as a GIF. JPEG won''t
    work in this situation as all graphics editors automatically stick a solid background
    behind any empty spaces in a JPEG.


    GIF only supports 256 colors so it doesn''t work very nicely with photographic
    images which require millions of colors.


    GIF can also be a lossy format if you want it to be. The strange thing is, the
    quality scale works in the opposite way to JPEG, that is, 0 is lossless and 100
    is full-on lossy. If you don''t want to use lossy compression, you can change
    the file size by limiting the number of colors included in your image between
    2 and 256 colors. Fewer colors results in a smaller file size.


    One of the most important features of the GIF format is that it supports transparency.
    This means you can see through parts of the image, removing the square look or
    surrounding white box that would appear if saved as a JPEG. In the image in the
    following screenshot, the checkerboard squares represent the transparent areas
    of the image:


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_161_0.png)


    Another nice feature of GIF is that they support animation. You could create a
    mini-slideshow or a simple advertisement using animated GIFs. An animated GIF
    is simply a file that cycles through a number of images, creating the illusion
    of animation.'
  merge: -1
  img_proc: true
- pgno: 162
  md: '# PNG


    The Portable Networks Graphics (PNG) format could almost be considered as the
    offspring of the JPEG and GIF formats. It was developed by the W3C as an alternative
    to GIF and works with both transparency and millions of colors.


    There are two types of PNG images. They are PNG 8 and PNG 24. The number reflects
    the number of bits saved in each format. PNG 24 supports millions of colors and
    produces super high-quality images, but the file size tends to be quite large.
    PNG 8 supports 256 colors. Both file formats support transparency. PNG is a relatively
    new format. If you know that your web audience is using older versions of Internet
    Explorer, then it''s best to stick with a GIF, otherwise you''re safe with PNG
    on the latest browsers.


    In the next screenshot, you can see a photographic image of a t-shirt saved in
    a PNG format with a transparent background on the left-hand side and a gradient
    background on the right-hand side:


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_162_0.png)


    # Web-safe colors – a thing of the past?


    In Chapter 6, Typography, we discussed the idea of web-safe fonts and how the
    Web has moved on a little bit from there. The concept of web-safe colors is also
    going the way of the dodo and is not really a consideration unless you know your
    target audience is using ancient monitors that can only display 256 colors.'
  merge: -1
  img_proc: true
- pgno: 163
  md: 'Just to give a very brief history lesson, web-safe colors were a small palette
    of fewer than 256 colors that would display properly on both Windows computer
    and Mac computer monitors. Today''s monitors can show literally millions of colors;
    even the phone in your pocket can handle more colors today than those old monitors.


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_163_0.png)


    If you''re using Photoshop or Illustrator to create your graphics, you''ll see
    that when you choose **Save for Web & Devices**, you can still convert the colors
    in your image to their web-safe equivalent by using the **Color Table** section.
    You can also see the web-safe color palette by using the context-sensitive menu
    on the **Swatches** panel in both of these programs. However, it is highly unlikely
    that we will ever need to use that option again for web graphics.'
  merge: -1
  img_proc: true
- pgno: 164
  md: '# Getting images onto your page


    Now that we know which kind of images are suitable for the Web, we can go about
    putting them onto our pages. In Muse, images behave in the same way as rectangles.


    # Placing an image


    In Chapter 5, The Joy of Rectangles, we saw how we could insert an image by drawing
    a rectangle and adding an image to it. Now we''ll see how to place an image into
    one of our Windsurfing pages by performing the following steps:


    +   1. Open your Windsurfing site that we''ve been working on.

    +   2. In Plan view, double-click on the Sails page to open it in Design view.
    Turn on the rulers and guidelines to help you position the image on the page.

    +   3. In Design view, choose File | Place.

    +   4. Browse and select the image or images that you want to place on the page
    and click Open (Windows) or Select (Mac OS). You can select more than one image
    at a time by holding down Ctrl button (Windows) or Cmd button (Mac OS) while you
    click. In this exercise, we''ll start by adding one image.

    +   5. Choose the sails.jpg image from the folder of this chapter.


    > Note: If you''ve been following the exercises in the book, your Sails page will
    have a red background, which we set in Chapter 4, Powerful Pages. We''ll change
    it back shortly, so it matches the blue background of the rest of the website.'
  merge: -1
  img_proc: true
- pgno: 165
  md: '6. The cursor changes to a place gun which we use to place the image or images
    on the page. If you selected multiple images as you loaded the gun, simply click
    the same number of times to place each image on the page one-by-one.


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_165_0.png)


    7. For now, click once to place your image on the page at its original size (100
    percent) so it lines up under the Windsurf Wild text at around 150 pixels from
    the top of the page. We''ll position the image more precisely in just a moment.
    As soon as you click, your image is placed on the page.


    # Adding alternative text


    It''s very important to add alternate text tags to all images on your site. It
    helps to make the site more accessible for everyone. The alternate text appears
    in the browser if an image cannot be shown and is read by screen readers. In order
    to add alternate text perform the following steps:


    +   1. Right-click or control-click the image you''ve added to the page.

    +   2. From the Context menu that appears, choose Alternate Text. The Image Properties
    dialog box opens.

    +   3. Fill in a text title and alternate text.'
  merge: -1
  img_proc: true
- pgno: 166
  md: '![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_166_0.png)


    The image Title should provide additional information about the image. The title
    pops up when you hover over an image when using some browsers.


    The Alternative Text is mainly for accessibility purposes and is read by crawlers.


    # The image context menu


    When we add an image to a page, there are a number of additional options, as well
    as Alternative Text and Add Title, available to you through the Context menu.


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_166_1.png)'
  merge: -1
  img_proc: true
- pgno: 167
  md: 'Right-click (or Control-click) an image on the page to see the Context menu
    appear. The following options are available:


    +   - **Fitting:** You have two choices here: **Fit Content Proportionally** and
    **Fill Frame Proportionally**. The **Fit Content Proportionally** option scales
    the image to retain its aspect ratio within the display area. The **Fill Frame
    Proportionally** option crops the image, if required, to ensure that the display
    area is completely filled.

    +   - **Edit Original:** This is a great option if you have used a Photoshop PSD
    file or a Fireworks PNG file on your page. These files could be considered the
    master source image file and you can click **Edit Original** and make changes
    to the master version of the file, to keep both copies in sync. This option is
    not available if you copied and pasted an image onto a page.

    +   - **Lock:** This locks the image into position on the page, meaning the image
    cannot be selected until it is unlocked. It is not the same as pinning which we''ll
    look at a little later.


    # Manipulating images


    In this section we''re going to look at how to manipulate an image once it''s
    on the page. We''ll look at resizing, rotating, positioning, duplicating, and
    cropping. All of these functions are a cinch to do in Muse.


    # Resizing an image


    Resizing an image is always best done by changing the actual size of the image
    in a graphics editor and then uploading it again to your site. However, if for
    some reason you have no access to a graphics editor, it is possible to resize
    it with Muse. The following are the steps to do it:


    +   1. In **Design** view, click on the image to select it.

    +   2. Drag the resize handles to adjust the image''s width or height. You''ll
    notice that no matter which handle you choose to drag from, Muse will constrain
    the image proportionally.'
  merge: -1
  img_proc: true
- pgno: 168
  md: '3. An alternative way to resize is to type values for the precise width and
    height of your image using the **Width** and **Height** options in the Control
    Panel.


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_168_0.png)'
  merge: -1
  img_proc: true
- pgno: 169
  md: '# Rotating an image


    It''s easy to rotate an image. There are two ways to do it. They are as follows:


    +   1. Select the image you want to rotate by clicking on it, then hover the mouse
    over the corner of the image until you see the rotation icon, and then click-and-drag
    to rotate the image manually.


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_169_0.png)


    +   2. With the image selected, increase or decrease the rotation angle in the
    Control Panel. (The Rotation Angle option is the right-most option in the Control
    Panel.)


    # Positioning an image


    Again, it''s very easy to position your image anywhere you want and once again,
    there are two ways to do it. They are as follows:


    +   1. Select the image you want to position, then simply drag the image to the
    appropriate position.


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_169_1.png)


    +   2. You can set precise X and Y coordinates for the image using the X and Y
    options in the control panel. Set the X value to 44 and the Y value to 160.'
  merge: -1
  img_proc: true
- pgno: 170
  md: '# Duplicating an image


    If you want to make an exact copy of an image, you can do it in one of the following
    two ways:


    +   1. If you are using Windows, click on the image, press the Alt button, and
    drag it. For Mac OS users, click on the image, press the Option button, and drag
    the image.


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_170_0.png)


    +   2. Choose Edit | Duplicate. If duplicating to a different page, then Copy
    and Paste is another option. If you want to put the image at the exact spot on
    the second page, choose Edit | Paste In Place.


    # Cropping an image


    In some situations, we can create a more interesting image by cropping a photograph.
    By reducing unnecessary background in an image we can create a greater sense of
    drama or, by changing the focus of the image we can make it more eye-catching.
    Ideally, you would do your cropping in a graphics editor and then bring the image
    into Muse, but sometimes as a timesaver, we can do it all in Muse.


    > In other situations, the background gives an important sense of context and
    should definitely not be removed.'
  merge: -1
  img_proc: true
- pgno: 171
  md: 'In the following exercise, we''ll add an image to the **Boards** page, then
    crop away some of the background by performing the following steps:


    +   1. Open the **Boards** page in **Design** view. Using the steps outlined in
    the section *Placing an image*, add the Boards.jpg image to the page.

    +   2. This is quite a large image and when you place it on the page, the right-hand
    side will overlap the edge of the page. You find it useful to zoom out to about
    75 percent magnification so that you can see the handles on the image when we
    use the **Crop** tool.

    +   3. With the image still selected, click on the **Crop** tool in the **Tools**
    panel.

    +   4. Drag the handles on the left and right-hand sides of the image to crop
    the original into a narrower image, about 420 pixels wide. Drag the handles on
    the top and bottom of the image to crop vertically to a height of about 600 pixels.


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_171_0.png)


    +   5. Drag the top resize handle downwards to crop away the sky above the board.
    Check the height on the control bar as you drag and crop the image to 450 pixels
    high.'
  merge: -1
  img_proc: true
- pgno: 172
  md: '6. If you want to, you can reposition the image inside the crop area. To do
    this, hover over the image until you see the circle icon at the center of the
    image. Grab the circle and move the image around within the cropped mask, till
    it looks something like the next screenshot:


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_172_0.png)


    7. Finally, position the newly cropped image at X coordinate setting of 44 and
    Y coordinate of 160 pixels using the fields in the control bar at the top of the
    screen.


    # Adding effects to an image


    You can add effects, such as drop shadows, bevels, and glows to an image in the
    same way as we added them to rectangles in Chapter 5, The Joy of Rectangle. See
    the section on Adding Effects to Rectangles.'
  merge: -1
  img_proc: true
- pgno: 173
  md: '# Pasting an image from another program


    Let''s say you''ve been working on an image in another program such as Adobe Photoshop
    or Illustrator and you want to quickly take it into Muse, it''s just a simple
    matter of copy and paste.


    You need to perform the following steps:


    +   1. In another program, such as Photoshop, copy your image using the menu options,
    or press Ctrl + C (Windows) or cmd + C (Mac OS) on your keyboard.

    +   2. Open the web page you want to put the image on in Design view in Muse and
    paste the image by choosing Edit | Paste, or by using Ctrl + V (Windows) or cmd
    + V (Mac OS) on your computer''s keyboard.


    # Working with background images


    We''re going to go back and make some changes to the blue master page and then
    apply that master to our two red gear pages. The blue master page currently contains
    the temporary logo text Windsurf Wild which we''ll replace with a semi-transparent
    logo image.


    # Adding a logo


    Most websites contain a logo in the same place at the top of each page. Usually
    the logo is also a link to the home page. In the following steps we''ll do just
    that on our site.


    +   1. In Plan view, double-click on the blue A-Master page.

    +   2. Right-click anywhere on the page and choose Show Header And Footer from
    the context sensitive menu. You''ll see additional guidelines appear horizontally
    to represent the areas at the top and bottom of the page which are the header
    and footer sections.

    +   3. Click on the words Windsurf Wild to select it, then press Delete on the
    keyboard to remove the text.

    +   4. Choose File | Place and browse to select the logo.png image. Click once
    to place the image.'
  merge: -1
  img_proc: true
- pgno: 174
  md: '5. Using the control bar, set the X position at 44 and Y position at 0.


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_174_0.png)


    # Adding a link to a logo


    We want our logo to be a link back to the home page. When someone clicks on the
    logo, they will always be brought to the home page. This provides consistency
    on every page.


    With the logo still selected, click on the drop-down menu beside the word Hyperlink
    on the control bar. Choose Home from the list of pages.


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_174_1.png)'
  merge: -1
  img_proc: true
- pgno: 175
  md: '# Using a tiled image as a background


    To use an image as a background for an object or a page, we need to set the object
    or page''s fill as an image. In this exercise, we''ll add a small gradient image
    to the background of the A-Master page. The trick here is to tile the image horizontally
    to give the appearance of a large background image. The steps are as follows:


    +   1. If it''s not already open, open the A-Master blue page in Design view.


    +   2. Make sure nothing is selected on the page. Click on the words Browser Fill
    on the control bar. On the drop-down menu, click on the folder icon and browse
    for the Background-Gradient.png image and click on Open.


    +   3. Set the Fitting option to Tile Horizontally. This causes the small image
    to be repeated the whole way across the page. The problem now is that the gradient
    image is only 400 pixels high and there is a very sudden change in color where
    the gradient image ends. To fix that, we must set the background color to be the
    same color as the bottom of the gradient.


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_175_0.png)'
  merge: -1
  img_proc: true
- pgno: 176
  md: '+   4. Click on the **Colour** swatch. The Color Picker panel opens.

    +   5. Click on the Eye Dropper tool in the top right-hand side of the panel and
    then click at the bottom of the background gradient image. As soon as you click,
    the background color changes and we get the illusion of the gradient image continuing
    down the page. The great thing about this method is that we have used a small
    image, 30 pixels wide by 400 pixels high, and now have the appearance of a much
    larger image filling the background of our page.


    # Using a photographic image as a background image


    Photographic images as backgrounds have been popular on the Web for years. As
    an additional exercise, we''ll add a large 1280 pixel wide image by performing
    the following steps:


    +   1. On the **A-Master** page, make sure nothing is selected, then click on
    the **Browser Fill** button on the Control bar.

    +   2. Click on the folder icon to choose an image. Choose the `1280RobbieNaish.jpg`
    image and click **Open**.

    +   3. Click on the centre point in the **Position** grid. Try out top-centre,
    middle-centre and bottom-centre to see how the position of the image changes.'
  merge: -1
  img_proc: true
- pgno: 177
  md: '4. If you want the image to stay in place while allowing the rest of the content
    to scroll above it, turn off the Scrolling checkbox.


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_177_0.png)


    And that''s how easy it is to add a large photographic image.


    Now that you know how to add a photographic background, as an exercise try out
    some of your own images as backgrounds and see how well they work.'
  merge: -1
  img_proc: true
- pgno: 178
  md: 'Check out the following tips on using background images:


    +   - **Make sure your background doesn''t distract from the content.** When you
    create a fixed-width design for your site (and this is currently the case for
    all sites created in Muse), part of the browser window will display a background.
    You can choose to have a solid background color or you can add a background image.

    +   - When choosing a background color make sure there is enough contrast between
    the background and the body text. That means using a fairly dark background color
    with light-colored text or using a light-colored background with very dark-colored
    text. The following chart shows examples of bad contrast on the left-hand side
    and good contrast on the right-hand side:


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_178_0.png)


    We can also set our backgrounds so they are filled completely or partially with
    an image. Unless otherwise specified, background images are automatically repeated
    over and over again by the browser. This is known as tiling, and by choosing an
    appropriate pattern or image, it lets us give the impression of a huge image filling
    the background of our website when in fact we are using a small image over and
    over again.


    If you want to use a complex image or photo for your site background, think carefully
    about how it affects the text above it. Ask yourself whether you are creating
    clutter by using an image. Patterns in the background can work well if they''re
    subtle or faded and are using only one or two tones. Full color patterns can be
    highly distracting, so use with caution.


    To keep things nice and simple for this website, replace the background image
    of the Windsurfer with the blue gradient we applied earlier.'
  merge: -1
  img_proc: true
- pgno: 179
  md: '# Pinning an image


    At some stage, you have probably visited a website that carries a little badge
    or ribbon that floats in a specific location and doesn''t move from that point.
    It sits persistently on the page. This effect is created by pinning the image
    in place. The ability to pin is a great tool in the designer''s arsenal. It allows
    us to break out of the grid and allow content to flow around the pinned image.


    To pin an image to a specific location, you use the Pin tool as explained in the
    following steps:


    +   1. In Design view, open the blue A-Master page.

    +   2. Place the PinningWind surfer.png image on the page and keep the image selected.

    +   3. On the Control Panel, click a position in the Pin tool to specify how you
    want to pin the image in relation to the browser. Selecting the top-center pin
    will pin the image in relation to the top-center of the browser. Selecting the
    bottom right-hand side pin will pin the image in relation to the bottom right-hand
    side of the browser. The best way to see how the pin works is to preview your
    content pages in the browser.


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_179_0.png)'
  merge: -1
  img_proc: true
- pgno: 180
  md: '# Taking care of site files with the Assets panel


    The Assets panel show us the filenames of any image files we are using in our
    website, not just images on the current page. You can open the Assets panel by
    choosing Window | Assets. Right-click (or press Ctrl and click) on filenames in
    the Assets panel to see the context menu appear. If you''ve used Adobe InDesign,
    this panel is called the Links Panel.


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_180_0.png)


    The Assets panel context menu contains the following options:


    +   - Relink: This option lets you reconnect files that have been moved after
    they were placed on the page. When you click on this option, use the Relink window
    that appears, to navigate to the file, and select it to specify its new location
    to Muse.

    +   - Go To Asset: Clicking on this option will take you to the page where the
    image or asset is located.

    +   - Embed Link: Adds a link icon with the path to the asset''s location on the
    local computer.'
  merge: -1
  img_proc: true
- pgno: 181
  md: '+   - **Edit Original**: This is a great option if you have used a Photoshop
    PSD file or a Fireworks PNG file on your page. These files could be considered
    the master source image file and you can click on **Edit Original** and make changes
    to the master version of the file, to keep both copies in sync. This option is
    not available if you copied and pasted an image onto a page.

    +   - **Reveal in Explorer**: This opens the **File Explorer** (Windows) or **Finder**
    (Mac) and shows the folder that contains the site''s assets, making it easy to
    locate a specific file.

    +   - **Copy Full Path**: Copies the path to the asset''s location on the local
    computer to the computer''s clipboard.


    # Group objects together to work with them as a single object


    You can group multiple selected objects (including images, rectangles, and text
    frames) as a single group to make it easy to control the placement of a set of
    items on a page.


    +   1. Use the **Selection** tool to select two or more objects. Hold down *Shift*
    key to select more than one object at a time.

    +   2. Right-click (or press Ctrl and click) and choose the **Group** option from
    the context menu. You can also choose Object | Group (or press Cmd + G for Mac
    OS).


    # Grouping objects


    Once a set of objects is grouped, a bounding box encircles the entire group. To
    ungroup the objects, right-click (or press Ctrl and click) and choose the **Ungroup**
    option from the context menu that appears. Alternatively, choose **Object | Ungroup**
    (or press Shift + Command + G).


    # Summary


    In this chapter, we learned how to add images to our pages and saw how to manipulate
    them by changing their position, rotating, duplicating, and cropping them. We
    discussed the type of image file formats that are suitable for use on the Web
    and how to choose the appropriate format.


    In the next chapter, we''ll take advantage of Muse''s widgets to add extra functionality
    to our pages.'
  merge: -1
  img_proc: true
- pgno: 182
  md: '# 8

    Customizing with Widgets—Menus and Panels


    Welcome to the world of widgets. It used to be, not so long ago, if you wanted
    to add extra functionality or interactivity to your website, you would need a
    web developer or programmer to create it for you. Things are so much easier now,
    and extra interactivity in Muse comes in the shape of a widget.


    Widgets are the reusable, customizable building blocks of interactivity. Examples
    include slideshows, panels, and menus. In this chapter, we''re looking at how
    to use widgets to add menus using the Bar, Horizontal, and Vertical menu widgets.
    We''ll also look at panels. These are space-saving panels that can work in a tabbed
    fashion or like an Accordion.


    In this chapter you will learn how to:


    +   - Add and edit widgets

    +   - Create menu bars

    +   - Create Horizontal menus

    +   - Create Vertical menus

    +   - Build an Accordion panel

    +   - Work with Tabbed Panels'
  merge: -1
  img_proc: true
- pgno: 183
  md: '# Working with widgets


    All widgets are found in the Widgets Library. Select Window | Widgets Library
    to see the full complement. The Widgets Library panel holds Compositions which
    includes Featured News and Lightbox Display. Also in the Widgets Library are Menus
    which are broken into Bar, Horizontal, and Vertical menus. The Panels options
    include Tabbed Panels and Accordion, while the Slideshow options are Basic, Blank,
    Lightbox, and Thumbnails. We''ll look at compositions and slideshows in the next
    chapter. Although each type of widget provides very different functionality, many
    of the concepts you''ll use when working with widgets are the same.


    # Adding a widget to the page


    In the Widgets Library panel, expand the widget category by clicking on the triangle
    to the left-hand side of the widget category. Select the required widget from
    the list as shown in the following screenshot and drag it onto the page in the
    Design view:


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_183_0.png)'
  merge: -1
  img_proc: true
- pgno: 184
  md: '# How menu widgets work


    Menu widgets display website navigation on a web page. We can choose to let Muse
    populate the menu with the names of each of our pages using the structure we set
    up in the Plan view, or we can add links to the menus manually. We can set the
    menu to a horizontal or vertical orientation.


    Menu items which are automatically populated appear with the same name as the
    page name displayed in the Plan view. Once we''ve created the menu we can still
    safely make changes to our website structure and those changes will automatically
    be updated in the menu to match to the website plan.


    When we populate items manually, a plus (+) symbol appears to allow us to add
    new menu items or submenu items. To delete a menu item, select it and then hit
    Delete on the keyboard. Manual menu items can be rearranged by clicking-and-dragging
    them to reposition the items within the menu.


    # Adding a menu bar


    Let''s start our widget journey by adding a menu bar. The menu bar is something
    which will appear on every page of our website, so we can add it to our Master
    Page. As we saw in the Pages section of Chapter 4, Powerful Pages, we can use
    our Master Pages to hold any image, text, or object that we want to appear consistently
    throughout the website.'
  merge: -1
  img_proc: true
- pgno: 185
  md: 'In the last chapter we made further changes to the **A-Master** panels by adding
    an image and pinning it to the top right corner of the page. In the next exercise,
    we''ll add a navigation menu with just a few clicks of the mouse. Muse keeps track
    of all of the pages we add in the Plan view and allows us to quickly add a fully
    functioning menu bar with links to each of the pages. Perform the following steps
    to add a menu bar:


    +   1. Open the **Windsurfing** panel in Muse''s Plan view:


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_185_0.png)


    +   2. Double-click on the **A-Master** thumbnail to open the Master Page in the
    Design view.'
  merge: -1
  img_proc: true
- pgno: 186
  md: '3. From the Widgets Library panel, expand the Menus list and drag out the Bar
    widget. Place it on the page with X coordinate at 410 pixels and Y coordinate
    at 62 pixels, so it looks like it''s sitting on the header guide as shown in the
    following screenshot:


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_186_0.png)


    # Selecting the widget and its subelements


    We''re going to set up and format our main menu, created using the Menu Widget
    option:


    +   1. To select the entire widget, click on it with the Selection tool. Look
    at the Control Panel and you''ll see it displaying the words Menu Widget on the
    left-hand side.


    +   2. Hover over individual menu items to see their outlines. Click again to
    select an individual menu item.


    +   3. Click again inside the widget to select the subelements and text of the
    container. Notice how the name of each subelement appears in the control panel
    as you click on it and a bounding box on the widget indicates which element is
    currently selected, as shown in the following screenshot. Each time you click,
    you are selecting additional nested subelements of the widget, allowing you to
    edit each item:


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_186_1.png)'
  merge: -1
  img_proc: true
- pgno: 187
  md: 'When a subelement of a widget is selected, you can format the contents by changing
    the text, rectangle''s color, or background within the boundaries of the widget
    itself.


    Press the Escape key to move back up through the hierarchy of nested elements.
    You can keep pressing the Escape key until you have selected the entire widget
    again. Alternatively click anywhere else on the page to deselect all subelements
    and the entire widget.


    +   4. Select the entire widget once more. We''re going to format the widget and
    give a new look-and-feel to our navigation bar.


    # Setting widget options


    There are several menu options available to us when working with widgets. Let''s
    have a look at them now:


    +   1. Click on the blue circle icon, to the right of the Menu Widget panel to
    open the widget''s Options menu as shown in the following screenshot:


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_187_0.png)'
  merge: -1
  img_proc: true
- pgno: 188
  md: '2. Set Menu Type to All Pages, set Direction to Horizontal, leave Edit Together
    checked, set Item Size to Uniform Width, and leave the rest of the options as
    their default settings.


    Here''s an explanation of each option:


    +   - Menu Type: This specifies which items the Muse will use to build the menu.
    Choosing Top Level Pages means a menu item for each page on the top level of your
    site plan will appear. Choosing All Pages means a menu item for each page on the
    top level of your site plan, as well as submenu items for any child pages will
    appear. Manual menu types allow you to add menu items manually in the Design view.

    +   - Menu Direction: This lets you pick either horizontal or vertical orientation
    for your menu.

    +   - Edit Together: When the Edit Together option is selected, any changes that
    you make will be applied to all items in the Menu Bar widget. Deselect this option
    to make changes to the Menu Bar items individually.

    +   - Item Size: The options here let you specify the type of width for the menu
    items. Fit Width sets rectangles for each menu item that are only large enough
    to contain their respective words. Uniform Width creates menu items of uniform
    size, based on the largest word in the menu bar.

    +   - Left Icon: Checking this box sets up an image frame to the left of each
    menu item. You can change the icon in the image frame by using Fill and Stroke
    or by adding a background image to it. When unchecked, the image frame is not
    displayed.

    +   - Label: When checked, the menu items label are displayed. When disabled,
    the labels are not displayed. The label is the page name of the linked button.

    +   - Right Icon: This works in the same way as the Left Icon, except that the
    image frame appears to the right of the menu item that is displayed. When disabled,
    the icon is not displayed.

    +   - Parts Positioning: This lets you specify the horizontal and vertical alignment
    of the menu items.'
  merge: -1
  img_proc: true
- pgno: 189
  md: '3. With the entire widget still selected, click on the Spacing tab. If it''s
    not visible, choose Window | Spacing. Add padding to the left and right and increase
    the size of the Gutter. The Gutter is the space between each menu item. On the
    Control Panel set the Fill color to None. The following screenshot shows how the
    changes in the Spacing panel makes the menu look:


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_189_0.png)


    # Formatting each menu item


    Now that we''ve made changes to the widget container, we need to select a menu
    item to change the background color as the current dark gray gradient is a background
    image on the menu item.


    +   1. With the widget container selected, click once more on any of the menu
    items. We''ve now drilled down a level. You''ll notice on the Control Panel, that
    the Selector changes to Menu Item. You''ll also see that the Fill for the menu
    item is set to dark gray.'
  merge: -1
  img_proc: true
- pgno: 190
  md: '2. Click on the word Fill and from the drop-down menu, set the Fill Type to
    Solid, and from the Color Swatch picker select None. This removes the background
    color:


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_190_0.png)


    3. Select the Text tool, set the Font Family to Arial, Bold, and Size to 14. Set
    the Colour to #174C78. Because we set the Menu Widget options earlier to Edit
    Together, all of the menu items change together.'
  merge: -1
  img_proc: true
- pgno: 191
  md: '# Adding states


    We can use the States panel to format the appearance of the links in the widget
    as a visitor interacts with them.


    +   1. With the menu item still selected, click on the States panel.

    +   You''ll see four states listed:

    +     - Normal: how the link looks when the page loads

    +     - Rollover: how the link looks when the mouse is rolled over it

    +     - Mouse Down: how the link looks when it is clicked

    +     - Active: how the link looks on the current page


    We''ve already set up the Normal state, next we''ll work on the Rollover state.


    +   2. Click on the Rollover state in the States panel and make changes to the
    background color and text color of the menu item. Set the background color to
    bright blue, the text color to white, remove any stroke, and set Corners to 15,
    as shown in the following screenshot:


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_191_0.png)'
  merge: -1
  img_proc: true
- pgno: 192
  md: '3. Repeat the previous step for the Mouse Down and Active states. Make each
    of the states look slightly different from each other. The point here is to provide
    visual feedback to website visitors. The following screenshot shows the Mouse
    Down and Active states:


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_192_0.png)


    4. We need to test that our menu is working. Because we applied it to a Master
    Page, it should now appear on all of our pages with that master applied. Click
    on the Preview view and test your menu system to see how each state works. You
    should be able to click through each page in your site.


    5. The Gear page has two subpages called Boards and Sails. We need to apply styles
    to the submenu for these pages. Open up the Master Page again and click once on
    the menu bar to select it, and once more on Gear to select that individual menu
    item. This will reveal the submenu items.'
  merge: -1
  img_proc: true
- pgno: 193
  md: '6. Click once on the Sails submenu item. The concept here is exactly the same
    as with the top-level menu items. We can set up four states for each submenu item.
    Notice that the Boards item changes style even though the Sails item is selected
    in the following screenshot. Again this happens because we chose Edit Together
    as an option in the Menu options:


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_193_0.png)


    7. Apply a style for each state. Use the blue, navy, and white colors we''ve worked
    with so far, to maintain consistency.


    8. Test your menu again in the Preview view.


    # Transferring a style


    When you''ve created a style, you can copy it and then apply it elsewhere. Let''s
    say for example, that you wanted to repeat the look-and-feel of the menu we''ve
    created at the top of our page, with a similar menu in the footer of the page.
    Here''s how we do it:


    When you have styled the appearance of a widget, make sure the styled widget is
    selected first, then right-click (or Ctrl + click) on the unstyled widget, and
    choose Transfer Widget Skin from the context menu that appears, as shown in the
    following screenshot. Within a second or two, the new menu will be styled in exactly
    the same way as the first menu:'
  merge: -1
  img_proc: true
- pgno: 194
  md: '![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_194_0.png)


    # Horizontal menus


    Everything we''ve looked at in relation to a Bar Menu is also applicable to Horizontal
    and Vertical menus.


    To create a horizontal menu, simply click-and-drag it out from the Menus section
    in the Widgets Library panel. Once the menu is on the page, you can style it using
    the same options as the Bar Menu.


    # Vertical menus


    To create a Vertical menu, click-and-drag it out from the Menus section in the
    Widgets Library panel. The obvious difference here is that the menu item appears
    one under the other. The submenus fly out horizontally, as shown in the following
    screenshot:


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_194_1.png)'
  merge: -1
  img_proc: true
- pgno: 195
  md: '# Accordion panels


    Next on our list of widgets is the Accordion panel. This consists of several panels
    stacked on top of one another. When the website visitor clicks on the Accordion
    tab, that tab opens a larger panel displaying the content.


    This widget allows us to display a lot of text in a small area and adds interactivity
    to our website.


    # Adding a panel


    Perform the following steps to add a panel:


    +   1. Open the Boards page in the Design view.


    +   2. On the Widgets Library panel, click-and-drag out an Accordion widget. Drop
    it underneath the Boards heading.


    +   3. Drag the right side of the panel to a width of approximately 500 pixels.
    You can set the width precisely by selecting the Accordion panel and then fill
    in the width field on the Control Panel, as shown in the following screenshot:


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_195_0.png)


    +   4. Click on the plus (+) icon that appears at the bottom of the widget. This
    adds another panel to the group. We now have three panels inside our widget.


    +   5. Click on the first panel''s name – currently Lorem 1. Using the Text tool,
    change the text to read Freeride.'
  merge: -1
  img_proc: true
- pgno: 196
  md: '6. Click in the large light-gray area underneath the panel to select it and
    add content. Again using the Text tool, draw out a rectangle. Paste in the text
    from the Boards-Panel1.txt file. In this situation, we''re adding text but we
    could add images or other types of content inside the panel either.


    7. Choose the Preview view so you can see exactly how the panel widget works.
    Click on each of the panel names and notice how each panel collapses and expands
    smoothly in an accordion fashion, as shown in the following screenshot:


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_196_0.png)


    8. Click on the second panel''s name—currently Ipsum 2. Using the Text tool, change
    the text to read Wave.


    9. Click in the large light-grey area underneath that panel to select it and add
    content. Again using the Text tool, draw out a rectangle. Paste in the text from
    the Boards-Panel2.txt file.


    10. Click on the third panel''s name—currently Ipsum 3. Using the Text tool, change
    the text to read Freestyle.


    11. Click in the large light-gray area underneath that panel to select it and
    add content. Again using the Text tool, draw out a rectangle. Paste in the text
    from the Boards-Panel3.txt file.'
  merge: -1
  img_proc: true
- pgno: 197
  md: 'So that''s our content in place. Check it out under the Preview view and watch
    the smooth action of the panels opening and closing. Widgets dynamically adjust
    their size to accommodate the content placed in them. You will have seen that
    the text frame you just placed in each panel grew as you added text. Each panel
    grew vertically to accommodate the additional content you placed inside them.


    # Editing Accordion widget elements


    You can select the entire widget, an entire panel (including its tab), or a single
    tab in order to edit it. In the following exercise, we''ll make some changes to
    the colors of the panels:


    +   1. In the Design view, click on the Accordion widget once to select the entire
    widget.

    +   2. In the States panel, click on the Active state. We''re changing the color
    of the panel tab to a medium blue to highlight the currently active panel.

    +   3. Click on the first panel''s name tab to select that panel name. Notice
    that the Control Panel selector says Text Frame. Set the Fill color to #174C78:


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_197_0.png)


    +   4. Test these changes in the Preview view. You''ll see that as you click on
    each panel it changes to blue color as it becomes active.'
  merge: -1
  img_proc: true
- pgno: 198
  md: '# Editing Accordion widget options


    There are a small number of options available for the entire Accordion widget.
    To view them, select the Accordion widget you want to edit, and then click on
    the blue editing options icon, as shown in the following screenshot:


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_198_0.png)


    Can Close All: This lets the user close all panels in one go. When this option
    is not selected, one Accordion panel always remains open.


    Edit Together: This means any changes made to one specific part of the panel will
    be reflected in the same items in the Accordion widget. Deselect this option to
    make changes to widget items individually.


    Edit Accordion widget states: This option lets you edit the various states of
    Accordion widget panels.


    # Tabbed Panels


    Tabbed Panels are similar to the Accordion panels in that they provide a way to
    put lots of information in a small area on the page. When a user clicks on a tab,
    the associated content for that tab appears in the box underneath. Perform the
    following steps to use the Tabbed Panels:


    +   1. Start by dragging out a Tabbed Panels from the Widgets Library panel. Position
    it on the page by either dragging it with the Selection tool or by using the X
    and Y coordinates on the Control Panel.'
  merge: -1
  img_proc: true
- pgno: 199
  md: '2. By default there are three tabs at the top of the content area. To change
    the name on a tab, click once to select the widget, then click again on the tab,
    and once more to edit the tab text, as shown in the following screenshot:


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_199_0.png)


    3. To add content to the large area known as the container under the tabs, select
    the container by clicking first on the widget, then click on the tab under which
    you want to add content, and then finally click on the container.


    4. We can add text by clicking on the Text tool and then typing or pasting text.


    5. We can add images by placing an image using File | Place. The image will be
    automatically resized by Muse to fit within the container.


    6. We can add slideshows by dragging them out from the Widgets Library into the
    container.


    7. To add or delete tabs, right-click/ Ctrl + click and choose from the context
    menu as shown in the following screenshot:


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_199_1.png)'
  merge: -1
  img_proc: true
- pgno: 200
  md: '# Deleting a panel


    If you''ve added a panel and you want to get rid of it entirely, just select it
    and press Delete on your computer''s keyboard.


    # Summary


    In this chapter, we looked at how to create a menu bar for our entire website.
    We styled the menu and the individual menu items which appear for each page in
    our website structure. We also used an Accordion panel as a way to put a large
    amount of text on a page without taking up too much space.


    In the next chapter we''ll again look at widgets, specifically how to use compositions
    and how to create a slideshow.'
  merge: -1
