- pgno: 138
  md: '# Creating text frames


    In Chapter 3, Planning your Site, we had our first introduction to text boxes
    when we created a wireframe mock up and added a number of rectangles, including
    one text frame, to hold our dummy text.


    In Chapter 4, Powerful Pages, we added the title of our website "Windsurf Wild"
    to our master pages and in Chapter 5, The Joy of Rectangles, we added some text
    content to our Learning page. We''re going to continue adding text content to
    our windsurfing site now.


    In Muse, if it''s not already open, open your site by choosing File | Open Site
    from the menu or click on the name of your windsurfing site on the Muse Welcome
    page.


    There is more than one way to add text to our pages. We can do any of the following:


    +   - Draw a text frame and then type directly into the frame

    +   - Draw a text frame and then copy the text from another source, for example,
    a word document or from an Internet site, and paste it into the text frame

    +   - Place a .txt (basic text file) by choosing File | Place in the menu


    We''ve already seen in Chapter 4, Powerful Pages and Chapter 5, The Joy of Rectangles,
    how we can add text by firstly drawing out a text frame, but for this exercise
    we''re going to choose the third option, that is placing a text file to add some
    text to our Gear page:


    +   1. In the Plan view, double-click on the Gear page to open it in the Design
    view. You''ll recall that in the previous chapter, we added a rectangle to hold
    an image on this page and adjusted the corner radius to create a mixture of three
    rounded corners and one straight corner.

    +   2. Choose View | Show Guides so that you can use the guides as an aid for
    aligning your images and text.

    +   3. Choose File | Place, then browse to the Chapter 6 folder and choose Gear.txt.
    You''ll immediately notice that your cursor changes to show a loaded icon - it
    looks similar to a mini-page that is attached to your cursor.


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_138_0.png)'
  merge: -1
  img_proc: true
- pgno: 139
  md: '4. Click just beneath the Windsurf Wild text and a new text frame is added
    containing the content of the Gear.txt document. Notice that the page stretches
    automatically to accommodate the text frame.


    5. In the previous chapter we saw how we could select a rectangle, add a fill
    color, add a stroke color, resize it, add round corners, and add background colors
    to it. It just so happens that text frames behave in the same fashion. We can
    do all of these to a text frame.


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_139_0.png)


    > If you create a text frame on top of a rectangle, the rectangle will resize
    for you as you add text to the text frame. This ensures that web pages created
    by Muse automatically stretch vertically to adapt to changes.


    # Clear, compelling, and correct content


    Although this chapter is about typography, it''s important to mention that the
    actual content is vitally important, no matter what your choice of font is. Many
    websites thrive despite a lack of design finesse and the reason is that their
    content is excellent. Perform the following steps to have a perfect content:


    +   - Be clear, be correct and be compelling.

    +   - Don''t make silly spelling mistakes as Muse does not have a spell checker,
    don''t make factual errors and don''t ramble off the point.


    # Editing text


    So now that we have some text in place on the Gear page, let''s go back and edit
    it. The following steps show us how to do it:


    +   1. While in the Design view, select the Text tool.

    +   2. Select the text that you want to change.'
  merge: -1
  img_proc: true
- pgno: 140
  md: "3. We can edit the text using the Control Panel at the top of the screen (once\
    \ our Text tool is selected) or in the Text panel, which we open by choosing Window\
    \ | Text, as shown in the following screenshot, if it's not already visible:\n\
    \n![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_140_0.png)\n\nThe following are the\
    \ options available in both panels:\n\n+   - **Font:** You can pick a font from\
    \ a list of web-safe fonts (we'll talk about web-safe fonts in a bit more detail\
    \ later), web fonts or from a list of system fonts. Muse exports system fonts\
    \ that are not web-safe, as an image. Web-safe fonts and web fonts are listed\
    \ with a small globe icon beside them. If you choose a font which needs to be\
    \ exported, a small image icon appears beside the font on the list in the control\
    \ or text panel and on the work area beside your text.\n+   \n+   If you want\
    \ to hide the icon in your work area, choose View | Hide Rasterized Text Frame\
    \ Indicators.\n+   - **Font size:** The font size specifies the size of the font\
    \ and is measured in pixels. There are a small number of pre-defined sizes which\
    \ you can select from, or you can enter a specific font size by typing in a number.\n\
    +   - **Bold/Italic/Underline:** Makes the selected text bold, italicized or underlined.\n\
    +   - **Align:** Sets your text paragraph to left, center, right, and justify."
  merge: -1
  img_proc: true
- pgno: 141
  md: '+   - **Color:** This lets you set the text color. To choose a text color,
    you can use the eyedropper tool, or you can select a color using the color swatches,
    or by typing in an RGB value or a hexadecimal value.

    +   - **Letter Space:** Also referred to as tracking, letter space increases or
    decreases the spacing between letters of the selected text.

    +   - **Leading:** This specifies the amount of space above and below a line of
    text. Leading is a paragraph attribute which means any changes you make here will
    affect every line in the selected paragraph. The leading field accepts either
    percentage values (a percentage of the font size) or pixel values.

    +   - **Paragraph style:** This value lets you select a pre-defined paragraph
    style to apply to the text. By using paragraph styles, we can improve consistency
    across our site and speed up text formatting.


    Most of the time, we use Paragraph styles because we tend to work with lines of
    text. However, it is possible to create character styles which can be applied
    to individual text characters or small numbers of words.


    +   - **Character style:** Lets you select a predefined character style to apply
    to the text.


    The following options are available only in the Text panel:


    +   - **Indent:** Lets you indent the first line of the selected text. It''s possible
    to use positive and negative (minus) values in this field.

    +   - **Links:** Lets you style text with a pre-defined link style.

    +   - **Left/Right margin:** Put space in the left or right margins of the selected
    text (similar to padding).

    +   - **Space before/after:** Specifies the amount of space before (above) or
    after (below) the selected paragraph.


    > It is not a good practice to export your body text as an image. Image files
    are not resizable or selectable in the same way HTML text is, and it is not search
    engine-friendly. Text exported as image files are not selectable or resizable
    when viewed in browsers.'
  merge: -1
  img_proc: true
- pgno: 142
  md: 'Web Fonts provide hundreds of extra fonts on top of the web-safe fonts. Web
    fonts let you use fonts that aren''t installed on the visitor''s computer. This
    opens up a whole extra world of typography goodness for us as designers. When
    you choose to use a web font, the Add Web Fonts dialog box opens, as in the following
    screenshot, which gives a visual overview of all the fonts available. The web
    fonts are supplied by the Typekit service.


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_142_0.png)


    # Creating and applying paragraph styles


    Using paragraph styles allows us to save a set of definitions or rules for larger
    blocks of text, which we can quickly apply to any block of text we choose.


    Let''s say for example, that you wanted your block quotes to always look the same
    way, set in Georgia, Italic, and size 12 with a color of red. You would select
    some text, apply the formatting then save it as a paragraph style. You can then
    reuse that paragraph style by applying it to other block quotes on your pages.'
  merge: -1
  img_proc: true
- pgno: 143
  md: 'Any paragraph or character styles that you create are available to use throughout
    your site, not just on the page on which you created the style. Let''s make a
    paragraph style now, which will define how our main body text will look:


    +   1. In the Design view, highlight a block of text - say one line within a paragraph
    - then set the following values in the Text panel:

