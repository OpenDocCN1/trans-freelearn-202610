    # Using placeholder images


    While you''re planning your site and creating your wireframe, you probably won''t
    have the final images for use on your website, but you can place a placeholder
    image on your wireframe.


    Let''s say that on your home page you knew you were going to have a photograph
    of a famous windsurfing champion, but at this early stage you''re not quite sure
    which one. You could make a blank image in Photoshop or Fireworks and save it
    with an appropriate name: WindsurfingChamp.jpg for example.'
  merge: -1
  img_proc: true
- pgno: 77
  md: 'For this example and layout, the image file is 300 x 170 pixels and saved in
    the Windsurfing website folder. It''s important to keep all your assets for your
    site together.


    To add the temporary placeholder image to the page, choose File | Place and browse
    to find the image. When the image is selected, it is loaded into the "gun". This
    simply means that you move your cursor to the position on the page where you want
    to place the image and then click to drop it on the page. Drop it on the right
    side of the main content area of the page.


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_77_0.png)


    This is a good point to preview our wireframe. Click on the Preview link on the
    Control Panel. Our page opens up and we see our beautiful wireframe without the
    grid overlay.


    The really nice thing about this wireframe, as opposed to one created on paper
    or in Photoshop or Illustrator, is that it is interactive. Roll your mouse over
    the navigation bar and notice the rollover states. The link on the Logo text is
    also active. When you click on the Logo link, it will take you to the Home page
    which is currently blank. This is something we could share with a client to get
    their feedback on how things are going so far. It''s much easier to fix the functionality
    at this stage than when we''ve built the entire website.'
  merge: -1
  img_proc: true
- pgno: 78
  md: '![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_78_0.png)


    When you have finished previewing your page, click on the Design view to go back
    to editing the page.


    # Updating placeholder images with final site graphics


    Let''s pretend that our client has approved the wireframe for this page and is
    so impressed that he has rushed over the correct photograph of our windsurfing
    champ. Because we used an image placeholder, it''s now easy for us to quickly
    update the site to use the actual image files:


    +   1. Open the original image in Photoshop or Fireworks and paste the photograph
    on top and, if necessary, resize so it fits into our original image. Save the
    file, replacing the original.'
  merge: -1
  img_proc: true
- pgno: 79
  md: '+   2. In Muse, select the image placeholder on the page.

    +   3. Open the Assets panel to locate the selected page element; in this case
    it''s the image called WindsurfingChamp.jpg.

    +   4. Right-click on the page element. In the menu that appears, choose Relink
    Asset. Instantly your image will be updated on your web page.


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_79_0.png)


    # Adding dummy text and paragraph styles


    As you build out a wireframe site, you can use the Text tool to create text frames
    and add placeholders or dummy text, which can easily be replaced later. After
    creating text elements, you can use the Text panel or the Control Panel to apply
    formatting to the text. Text headers and paragraph styles help you create structured
    pages and change text formatting easily.


    > What Is Lorem Ipsum?

    > Lorem Ipsum is simply dummy text used by the printing and typesetting industry.
    Lorem Ipsum has been the industry''s standard dummy text ever since the 1500s.
    It is a long established fact that a reader will be distracted by the readable
    content of a page when looking at its layout. The point of using Lorem Ipsum is
    that it has a more-or-less normal distribution of letters, as opposed to using
    "Content here, content here", making it look like readable English. Today Lorem
    Ipsum is used by web designers for the same reason.

    > Some paragraphs of Lorem Ipsum text have been supplied in a .txt file.'
  merge: -1
  img_proc: true
- pgno: 80
  md: 'Using paragraph styles, you can define header text and paragraph tags to structure
