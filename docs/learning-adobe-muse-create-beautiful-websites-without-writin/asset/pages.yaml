    14. Select and position the thumbnails under the main image area.


    15. Select and position the next and previous buttons at the top and right of
    the main image, as shown in the following screenshot:


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_213_0.png)'
  merge: -1
  img_proc: true
- pgno: 214
  md: '# Insert arbitrary HTML


    While Muse writes the HTML and CSS for everything we''ve looked at throughout
    this book, there may be times when you need to add a little bit of HTML yourself.
    Don''t worry though; you won''t have to write this code either. Let''s say for
    example you want to add a Google map to your site to show clients or interested
    parties where you are based. Google will provide you with the code, you just copy
    it and then simply paste it back into your page in Muse.


    Another example would be if you want to add a YouTube video. You don''t need to
    host the video, you just paste in some code provided by YouTube and the video
    will appear, embedded in your page. A big advantage of using a service like this
    is that you don''t need to worry about hosting the video content, it''s still
    hosted by YouTube, and it just looks as if it''s on your site.


    Working with arbitrary HTML on a page in your site allows you to set aside a window
    in your page where third-party content can appear. As you can imagine, this opens
    up huge possibilities for you in terms of what you can add to a page without the
    need to write your own code. You could let your visitors know what the weather
    is going to be, show them a map of your hometown, impress them with audio and
    video, or provide them with stock market quotes.


    # Adding a Google Map to your page


    Let''s add a map to a new page using the following steps:


    +   1. In the Plan view, click on the plus symbol (+) under the Home page to add
    a new page.

    +   2. Rename the new page as Location. Notice that the new page automatically
    takes on the A-Master page because it is a child page or a Home page which uses
    the A-Master page.

    +   3. Double-click on the new Location thumbnail to open it in the Design view.
    Add a heading to Location and style it using the Heading style you created in
    the previous exercise.

    +   4. Open an Internet browser and go to Google Maps at maps.google.com.

    +   5. Type in the address or a search term to find the location you want to appear
    on your map.

    +   6. Click on the Link button which you''ll see appear at the top left of the
    interface.

    +   7. Click on the Link button that appears in the upper-right part of the interface.
    Click once again on the option Customize And Preview Embedded Map.'
  merge: -1
  img_proc: true
- pgno: 215
  md: '8. A new Customize window appears which allows you to change the size of the
    map that you''ll embed on your page. Select the Custom radio button in Map size
    to set Width to 800 pixels and Height to 400 pixels, as shown in the following
    screenshot:


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_215_0.png)


    9. You may need to reposition the map within the window to ensure that the pin
    and address text is fully visible. You can do this by simply clicking-and-dragging
    the map around until the pin and address are where you want them to be.'
  merge: -1
  img_proc: true
- pgno: 216
  md: '+   10. Google instantly generates the code for the map, which you can select
    and copy.

    +   11. Go back to Muse. Choose Object | Insert HTML to open the HTML code window.
    Paste in the code you''ve copied using the keyboard shortcut to paste the code
    (Ctrl + V for Windows and Cmd + V for Mac).

    +   12. Use the Selection tool to position the map where you want it on the page,
    as shown in the following screenshot:


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_216_0.png)


    In the Design view, you will be able to get an idea of how the Google Map will
    appear to your visitor. In order to see how the map is working interactively,
    click on Preview to see how it will appear on the live site. You can zoom in and
    out and move around the map which is embedded on your page.'
  merge: -1
  img_proc: true
- pgno: 217
  md: '# Adding a Twitter (or any other type of) feed to your site


    Unless you''ve been living in a cave, there is a strong possibility that you have
    heard of, or use Twitter. Many Twitter users add a feed of their "tweets" to their
    site or blog and this maybe something you''d like to do with your own Muse-built
    site. Whether you''re adding a Twitter feed or an RSS feed or any other type of
    dynamic data to your site, the process is essentially the same. The following
    steps show how to do it for a Twitter feed:


    +   1. You''ll need to have a Twitter account. Twitter is free to sign-up for
    and free to use. When you''re registered, go to twitter.com/goodies/widgets where
    you can grab a widget to add to your web page.

    +   2. You can choose how you want your Twitter widget to work. You can display
    only your tweets, the tweets of your favorite Twitter profiles, your favorite
    tweets, or a stream of topical tweets about a subject of your choice.

    +   3. Once you''ve made that choice, you can then set up your widget. You can
    make changes using the Settings, Preferences, Appearance, and Dimensions menu.
    Choose a color scheme that matches or complements your own site''s color scheme.


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_217_0.png)'
  merge: -1
  img_proc: true
- pgno: 218
  md: '4. When you''ve set up your Twitter widget''s "look and feel", click on the
    Finish And Grab Code button. You''ll see a chunk of HTML code which you can copy.
    Select all the code, copy it using Ctrl + C/Cmd + C, then go back to Muse.


    5. In the Design view in Muse, choose Object | Insert HTML and paste the code
    you copied into the dialog box by pressing Ctrl + V/Cmd + V. Click on OK.


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_218_0.png)


    6. Your widget will now appear on the page. Test it by using the Preview view.'
  merge: -1
  img_proc: true
- pgno: 219
  md: '# Summary


    In this chapter we''ve discussed Composition and Slideshow widgets, which allow
    us to add some very useful interactivity and functionality to our pages without
