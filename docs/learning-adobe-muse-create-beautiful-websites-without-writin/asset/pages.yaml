- pgno: 202
  md: '# 9


    # More Widgets—Compositions and Slideshows


    In the previous chapter, we used Muse''s widgets to quickly and easily add a menu
    or navigation system to all our pages and to display a large quantity of text
    in a small area using an Accordion panel. In this chapter we''ll continue to work
    with widgets to add extra functionality and interactivity to our web pages.


    We''ll create an elegant slideshow using the Slideshow widget and use the Composition
    widget to create a simple photo gallery. As well as using widgets to add functionality,
    we''ll use arbitrary HTML to add interactive elements to our pages.


    By the end of this chapter you''ll know how to:


    +   - Use a Composition widget

    +   - Create a slideshow with a Slideshow widget

    +   - Add an interactive Google Map and feed using arbitrary HTML


    # Composition widgets


    There are several interactive widgets available in Muse which fall under the umbrella
    term of Composition widgets. They consist of a small container which is known
    as the "trigger" and a larger container called the "target". When you click on
    the trigger, something happens in the target. An example of this would be a photo
    gallery where a user clicks on a thumbnail image and a full-sized version is displayed
    in the container. For example, you can use a Basic Composition widget to create
    a photo gallery, with thumbnail triggers that display the full-sized photos when
    the user clicks on the trigger.'
  merge: -1
  img_proc: true
- pgno: 203
  md: 'The **Composition** section of the **Widget Library** menu includes the following:


    +   - **Blank**: This widget consists of a number of small thumbnails, which you
    link manually to the larger container area. When the thumbnail is clicked the
    content of the large container changes accordingly.

    +   - **Featured News**: This widget is somewhat similar to the Accordion and
    Tabbed widgets we saw in the last chapter. When the text trigger is clicked, the
    main content, which can consist of text and images, changes.

    +   - **Lightbox Display**: When a thumbnail is clicked, the rest of the page
    is dimmed while the content of the target is active.

    +   - **Presentation**: This widget consists of small numbered thumbnails linked
    to a larger slide or image. By default, the slides swipe in horizontally.

    +   - **Tooltip**: This displays text as a tool tip when the user hovers over
    the trigger.


    Each of these widget types has different display behaviors that allow you to easily
    add complex functionality to your site, as shown in the following screenshot.
    Like all of the widgets available in Muse, the Composition widgets are completely
    editable and customizable:


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_203_0.png)


    # Using Images with Widgets


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_203_1.png)


    The images added to your slideshows or composition widgets should be saved in
    a format suitable for the Web, namely GIF, JPEG, or PNG. It is also possible to
    use a native Photoshop file .psd, as Muse will convert it to the correct web format.
    Save your images in advance at the size you want to display them in the slideshow.
    Muse will generate the smaller thumbnails automatically and create an image folder
    when you''re finished with your site and ready to upload. Images can be linked
    from anywhere on your computer.'
  merge: -1
  img_proc: true
- pgno: 204
  md: '# Creating a simple photo gallery using a blank composition


    We''ll create a photo gallery consisting of three images. With a blank composition,
    we "tell" Muse which trigger matches up to the large image that will appear in
    the target area. Perform the following steps to create a simple photo gallery:


    +   1. Open your page in the Design view and drag out the Blank composition widget
    from the Widget Library menu.

    +   2. Click on the Composition widget once to select the entire widget. You can
    now position it anywhere you want on the page.

    +   3. Click on the first light-gray trigger thumbnail under the target area to
    select it.

    +   4. Click on the Fill link on the Control bar. From the drop-down menu, click
    on the Image icon and browse to choose the first Windsurfing image in the Composite
    Widgets Images panel. Set the Fitting to Scale To Fill, as shown in the following
    screenshot:


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_204_0.png)'
  merge: -1
  img_proc: true
- pgno: 205
  md: 'Notice that the thumbnails in the list of states in the States widget are now
    all the same. If you want to create a rollover effect, you could click on the
    Rollover state in this widget and then change the image as we did previously.
    For this example, we are keeping everything nice and simple, so we''ll use the
    same thumbnail for all four available states.


    +   5. Add two more thumbnail images to the remaining triggers by repeating step
    4. Choose the images from the Composition Widgets Image folder.

    +   6. If you want to add additional thumbnails, click the plus (+) icon that
    appears to the right of the trigger elements. If you want to remove a trigger,
    select it and press Delete on your computer''s keyboard.


    # Add content to a target area


    Our next step is to add the larger images to the target area using the following
    steps so that when we click on the thumbnail the correct image appears:


    +   1. In the Design view, click on the Composition widget once again to select
    the entire widget.

    +   2. Click once on the first thumbnail to select the trigger.

    +   3. Click on the larger content area to select it. By clicking first on the
    trigger and then on the target, we are telling Muse that these two are linked.

    +   4. With the content area selected, click on the drop-down Fill menu and add
    the first image. Once again, set Fitting to Scale To Fill.


    > In this example, we''re adding an image, but you can add any type of content
    that you like to the target.'
  merge: -1
  img_proc: true
- pgno: 206
  md: '5. Repeat steps 1 to 4 to add content to the target for the second and third
    thumbnails. When you''ve added the images to both trigger and target, it should
    look like the following screenshot:


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_206_0.png)


    6. Test your photo gallery in the Preview view and make sure that your large image
    matches up with your thumbnail image.


    > You can change the size of each thumbnail and each target area individually.
    Simply click once to select the entire widget, click once again to select either
    a trigger (thumbnail) or a target. Once the element is selected, a bounding box
    appears with handles in each corner. Dragging on the handles allows you to resize
    the element.


    # Changing Composition widget options


    Each Composition widget offers several options for setting up how the widget functions.
    To get to the options, click on the editing options icon—the blue arrow. In the
    following list, you''ll find an explanation of each option available for the blank
    composition we''ve just added to our page:


    +   - **Position**: This sets up where the target area is positioned on the page.
    By choosing **Stacked**, all of the content is overlapped, such as the target
    content appears in the same place on the web page. By choosing **Scattered**,
    it lets you position each target container in a different location on the page.
    Choosing **Lightbox** dims the rest of your web page and puts the focus on your
    target content.'
  merge: -1
  img_proc: true
- pgno: 207
  md: '+   - **Event**: We can choose to change the content in the target area when
    the user clicks on the thumbnail – **On Click** or when the user rolls their mouse
    over the thumbnail – **On Rollover**, as shown in the following screenshot:


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_207_0.png)


    +   - **Transition**: We can specify how the content changes when the trigger
    is clicked or rolled over. The choices of animated transitions are:


    +   - **Fading**: This fades in the new target content while simultaneously fading
    out the previous target.

    +   - **Horizontal**: This slides the new target content in, with a horizontal
    sliding motion.

    +   - **Vertical**: This slides the new target content in, with a vertical sliding
    effect.

    +   - **Speed**: The choices here specify the speed of the transition. If you
    want an instant transition, select **None**.'
  merge: -1
  img_proc: true
- pgno: 208
  md: '+   - **Auto Play**: This option creates a slideshow requiring no user interaction.

    +   - **Hide All Initially**: This option hides all target areas when the page
    is first loaded. In order to see the content, the user needs to click on the trigger.

    +   - **Parts**: If you want to add extra user interactivity, you can use these
    options to show previous, next, or close buttons with the widget.

    +   - **Show Lightbox Parts While Editing**: If you choose the **Lightbox** option
    under **Position**, you can then hide or display the contents of the target area
    while editing in the **Design** view.

    +   - **Show All in Design Mode**: This option lets you display all target content
    areas at the same time when working in the **Design** view. By default this option
    is deselected, meaning only the target content of the selected trigger element
    appears in the **Design** view.


    # Another way to create triggers and targets with multiple images


    In the previous example, we manually added images first to the trigger and then
    to the target area. We set each trigger and target individually. There is another
    way to add multiple images simultaneously to the target area and Muse automatically
    creates the corresponding trigger elements for you using the following steps:


    +   1. In the **Design** view, add a new blank **Composition** widget to the page.

    +   2. Click on the **Composition** widget once to select the entire widget.

    +   3. Click again to select the large target area.

    +   4. Choose **File | Place**.

    +   5. Select the multiple images you want to place. Hold down the *Ctrl* (Windows)/*Cmd*
    (Mac OS) key to select multiple images from the folder.

    +   6. Click on **Select** (Windows) or **Open** (Mac OS).'
  merge: -1
  img_proc: true
- pgno: 209
  md: '7. Place the image group by clicking inside the target''s content area as shown
    in the following screenshot. Muse automatically adds trigger elements for each
    image:


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_209_0.png)


    8. Unfortunately, it doesn''t add the corresponding images to the thumbnail trigger.
    If you want to do that, then select each trigger element and place images that
    match the corresponding target areas to create thumbnail image triggers.


    # Slideshow widgets


    The Slideshow widgets work in a very similar fashion to the Composition widgets,
    the main difference being the Slideshow widgets work exclusively with images while
    the Composition widgets can work with any type of content. The types of Slideshow
    widgets available in the Widgets Library menu are:


    +   - Basic: The Basic Slideshow widget consists of a large content area, surrounded
    by a dark gray border. Underneath the content area there is a caption area, the
    number of slides or images which make up the slideshow, and a next and previous
    button. When you drag out the widget, it comes preloaded with three slides.'
  merge: -1
  img_proc: true
- pgno: 210
  md: '+   - **Blank**: The **Blank Slideshow** widget is similar to the **Basic Slideshow**
    widget except that it is empty when you drag-and-drop the widget out onto the
    page.

    +   - **Lightbox**: The **Lightbox Slideshow** widget dims the rest of the page
    while the gallery element being displayed is active. This is a very popular type
    of slideshow on the web as it keeps the visitor''s focus on the gallery element
    while reducing other distractions on the page.

    +   - **Thumbnails**: The **Thumbnails Slideshow** widget shows thumbnails, which
    by default are positioned to the left of the larger content area. As the user
    clicks on the thumbnail, the image becomes bigger.


    The following screenshot shows the different types of slideshows:


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_210_0.png)


    Like the other widgets in Muse, the Slideshow widgets are completely editable
    and customizable.'
  merge: -1
  img_proc: true
- pgno: 211
  md: '# Creating a slideshow presentation


    Earlier in this chapter we created a photo gallery which required the user to
    click on a thumbnail to see the larger image. This kind of functionality is also
    available using the Lightbox Slideshow widget or the Thumbnails Slideshow widgets.
    They work in a very similar way to the photo gallery we already created so rather
    than recreate those steps, in this next example we''ll create a slideshow using
    the Blank Slideshow widget. We''ll change the settings so that the slideshow plays
    automatically, running through a series of images. We''ll specify the transition
    effects and the speed at which the slideshow plays. Perform the following steps
    to create a slideshow presentation:


    +   1. Open your page in the Design view.

    +   2. In the Widgets Library menu, choose the Blank Slideshow widget and drag
    it onto the page.

    +   3. The Blank Slideshow widget consists of a dark gray rectangle which will
    hold our large image, a caption area, an image counter, and a next and previous
    image button for navigation.

    +   4. Click on the blue arrow to access the Options menu. Click on the folder
    icon at the top, next to the Add Images... option.

    +   5. Navigate to your images folder and choose as many images as you want to
    add to your slideshow. Hold down Ctrl/Cmd to choose multiple images, and then
    click on Open.

    +   6. Your images will be added to the content area and the numbers in the image
    counter will increase to reflect the number of images in the slideshow. The default
    images from Muse remain in the slideshow. We simply delete these after adding
    our own images.'
  merge: -1
  img_proc: true
- pgno: 212
  md: '7. Click again on the blue arrow to open the widget''s Options menu, as shown
    in the following screenshot:


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_212_0.png)


    8. Set the following options:


    +   - Transition: Horizontal

    +   - Auto Play: Medium

    +   - New Hero: Fill Frame Proportionally (Hero is just a name for the main image)

    +   - New Thumbnail: Fill Frame Proportionally – this is irrelevant here because
    we''re not using thumbnails

    +   - Lightbox: Deselected

    +   - Parts: Deselect all options to hide the captions, counter, next, and previous
    buttons


    Setting these options leaves us with a single image on the page.


    9. Choose Preview to see how the slideshow will work in the browser. When all
    of the images have been displayed, the slideshow will loop around to the first
    image again and continue to play.'
  merge: -1
  img_proc: true
- pgno: 213
  md: '10. If you want to change the size of your slideshow, go back to the Design
    view and drag one of the corner handles of the Hero image frame. Hold down Shift
    as you drag to constrain the proportions of the slideshow. As you drag, you''ll
