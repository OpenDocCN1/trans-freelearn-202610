- pgno: 22
  md: '# 1


    # Welcome to Muse


    Welcome friends, to Adobe Muse! As we work our way through this book, we will
    learn how to use Adobe''s latest web design software to create eye-catching websites.
    All without writing any code.


    Examples of some of the interesting ways in which people have used Muse include
    portfolio-style websites for photographers, illustrators, and designers and interactive
    brochure style sites for all kinds of service providers. If you would like to
    see some examples of how other designers have used Muse to create their websites,
    check out Muse Showcase at http://www.adobe.com/products/muse/showcase.html.


    In this chapter, you will learn:


    +   - What Muse is

    +   - How to get around the workspace

    +   - How to save your site

    +   - How to select tools

    +   - How to work with panels


    # What is this Muse you speak of?


    Muse is a brand new offering from the software design company, Adobe. The idea
    behind it is to allow designers to create websites as easily as we can create
    layouts for print. Known as a WYSIWYG (What You See Is What You Get) web design
    tool, Muse allows us to build entire sites without worrying about HTML, CSS, JavaScript,
    or jQuery – all of which have the ability to leave a designer in a cold sweat.


    If you are a graphic designer and have used Adobe InDesign, Illustrator, or Photoshop,
    you will find that you will have a certain level of familiarity with Muse. The
    interface is similar to others from the Adobe stable and the ability to drag-and-drop
    elements into your layout is what makes Muse special. You can focus on the look
    and feel, while Muse creates the code behind the scenes.'
  merge: -1
  img_proc: true
- pgno: 23
  md: 'The following are some of Muse''s features:


    +   - **Plan, design, and publish**: Starting your website with a plan is always
    a good idea and that''s the first step in the Muse workflow.

    +   - **Easy layout of text and images**: You don''t have to worry about adding
    DIV tags, Padding, and Margin attributes in order to place your design elements
    on the page. You can drag-and-drop where you want and precisely control your layouts.

    +   - **Add interactivity**: Muse lets you add rollovers and button states created
    with the Photoshop layers. Arbitrary HTML and Muse widgets allow you to set up
    more advanced interactive features such as accordion panels, custom lightboxes,
    and menus.

    +   - **Automatically-generated menus**: As you add pages to your site, Muse will
    update the navigation menus on the fly.

    +   - **Publishing is easy**: While you focus on creating a compelling and beautifully
    designed site, Muse automatically generates all the HTML, CSS, and scripting required
    to make it function. You can publish your site from within Muse if you host it
    with Adobe, or you can export your site and host it with any service provider
    of your choice.


    So let''s get started.


    # Where to find Muse


    In order to follow along and work with the program, the first step is to download
    the software to your computer. There are two ways to buy Muse: either by paying
    monthly or yearly as part of Adobe''s Creative Suite, or you can just try it out
    as a thirty-day trial. Either way, you can download the software from http://www.adobe.com/products/muse.html
    and install it on your system. Muse is available for Mac and Windows.


    # The Muse workspace


    A good worker knows their tools, so we''re going to take a little time to find
    our way around the tools and panels that make up the Muse workspace.


    The Muse workspace lets you plan, design, preview, and publish web pages and site
    assets. The toolbars and panels allow us quick access to the most common operations
    for creating and editing documents. Multiple documents can be displayed in the
    workspace and we can jump from one page to another by clicking on the tab that
    identifies that page.'
  merge: -1
  img_proc: true
- pgno: 24
  md: '# The Welcome screen


    The very first time you open Muse you will be greeted by the Welcome screen. This
    screen provides quick access to recently opened sites and easy creation of new
    sites. It also provides a direct connection to the Adobe Muse site where you can
    learn more about the program. A link provides information on the most current
    version available.


    The Welcome screen will continue to appear every time you start Muse from the
    application icon in Windows or Mac OS. If you open a Muse file directly from a
    folder on your computer then the site will open without showing the Welcome Screen.


    +   1. To disable the Welcome screen, select **Don''t Show Again** and close it.

    +   2. To re-enable the Welcome screen, enable the **Show Welcome Screen** option
    in the **Edit** menu.


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_24_0.png)'
  merge: -1
  img_proc: true
- pgno: 25
  md: '# To open a recent site


    Click on the site name on the left-hand side of the Welcome screen. If the site
    you want to work on is not listed there, click on the Open icon and browse through
    your folders to find the Muse site.


    # To create a new site


    For creating a site, follow the given steps:


    +   1. Click on the Site icon under Create New on the Welcome Screen or choose
    File | New Site from the main menu.

    +   2. A New Site dialog box opens, which allows us to set up the dimensions of
    our site, the number of columns, and margin and padding settings.


    If you are a graphic designer used to working with units such as millimeters,
    centimeters, inches, points or picas, you may be wondering what units are used
    here. All units are in pixels as Muse is intended entirely for screen-based design
    work.


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_25_0.png)'
  merge: -1
  img_proc: true
- pgno: 26
  md: 'The fields in the screenshots can be described as follows:


    +   - **Page Width**: This specifies the width of the container that will hold
    your web page''s content.

    +   - **Min Height**: This specifies the minimum height of your page. As you add
    content, your page will stretch but this value ensures each page will always have
    a minimum height.

    +   - **Columns**: This specifies the number of columns that are used for guides
    to align objects in the design mode.

    +   - **Column Width**: This is the width of each column.

    +   - **Gutter**: This specifies the gap between columns.

    +   - **Center Horizontally**: Leave this checked so that the container, which
    holds your web page content, sits in the centre of the user''s screen regardless
    of their screen resolution. This is a standard practice when designing websites.

    +   - **Margins**: This defines the space between the edge of your page container
    and other outer elements.

    +   - **Padding**: This defines the space between the edge of the page container
    and the content inside the container.


    The settings you specify in the New Site and Site Properties dialog boxes apply
    to all pages and master pages throughout the new site. However, you can customize
    properties for individual and master pages. We''ll look at how to do that shortly.
    It is a good practice to set your site dimensions when you start a project, just
    as you would if you were designing for a printed page, but don''t worry if you
    find you need to change the settings later. You can access this dialog box at
    any time by choosing File | Site Properties or by right-clicking (Windows)/Ctrl
    + clicking (Mac) the page or master page in the Plan view.


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_26_0.png)


    +   3. For this example, we''ll set the **Width** as **960** pixels, **Height**
    as **800** pixels, all **Margins** as **20** pixels, **Top Padding** as **10**
    pixels, and **Bottom Padding** as **20** pixels. Type the numbers in the fields
    or click on the up and down arrows next to each field to increase or decrease
    the current values.

    +   4. Click on **OK** to complete your initial site''s setup.'
  merge: -1
  img_proc: true
- pgno: 27
  md: '# Views


    After clicking on OK, the next screen you''ll see is the Plan view. The Plan view
    displays your site plan — an overview of how your website is organized. When you
    first create a new site, Muse automatically generates a Home page, also called
    the index page, that is linked to the Master Page design. Plan view is the default
    view when you open a Muse site.


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_27_0.png)


    At this stage, your Plan view will only have a single page: the home page, which
    appears as a thumbnail on the upper section of the Plan view. Beneath that you
    should see your Master pages. In this case you will have one master page, named
    A-Master. The Master pages act as templates to share common design elements such
    as headers, footers and logos that are required on more than one web page.


    A Muse site has five views: Plan, Design, Preview, Publish, and Manage. You can
    switch between any of the views by clicking the links at the top of the interface.
    The fourth link, Publish, opens the Sign In window which starts the publishing
    process. We''ll talk about these views in more detail in later chapters.'
  merge: -1
  img_proc: true
- pgno: 28
  md: '# Saving your site


    Before we go any further it''s a good idea to save our site.


    +   1. Choose File | Save. The Save Muse File As dialog box opens. Type in a name
    for your site; let''s call it MyFirstWebSite.muse.

    +   2. Navigate to the location on your computer where you want to save your sample
    project and then click on Save.


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_28_0.png)


    # Opening a page in Design view


    With our site saved, we can move into the Design view and check out the rest of
    the Muse workspace. While still in the Plan view, double-click on the homepage
    thumbnail to open that page.


    > You can also switch to the Design view by clicking on Design at the top of the
    Muse window.


    The Design view is where most of the heavy lifting of the design work takes place.
    This is where we add our text, images, and multimedia widgets to our web page.'
  merge: -1
  img_proc: true
- pgno: 29
  md: 'The Design view workspace encompasses everything you see when you open or create
    a new document:


    +   - Views

    +   - Toolbox

    +   - Document window

    +   - Panels

    +   - Menus

    +   - Control panel


    With your homepage open, notice that tabs appear for your selected page and for
    your site plan. You can open multiple pages in Muse and each one will appear with
    its own tab. To jump from a page to another page or to the site plan, simply click
    on the page name tab.


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_29_0.png)'
  merge: -1
  img_proc: true
- pgno: 30
  md: 'As shown in the previous screenshot, the letters indicate the different components
    of the Muse workspace, as follows:


    +   - A: Menu

    +   - B: Views

    +   - C: Control Panel

    +   - D: Toolbar

    +   - E: Document window

    +   - F: Panels


    # The toolbar


    The toolbar contains tools for selecting objects, working with type, cropping,
    and drawing rectangles. It sits at the top of screen, to the right of the Views
    section. It contains some tools you may be familiar with if you''ve used other
    Adobe programs.


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_30_0.png)


    The following is a brief overview of the function of each tool:


    +   - **Selection tool**: It lets you select objects on a page

    +   - **Crop tool**: It lets you crop images on a page

    +   - **Text tool**: It lets you create a text area where you can add text to
    a page

    +   - **Zoom tool**: It lets you zoom in or out from the page

    +   - **Hand tool**: It lets you pan around the page by dragging

    +   - **Rectangle tool**: It lets you create rectangular, round rectangular, or
    circular objects that can be filled with colors or images'
  merge: -1
  img_proc: true
- pgno: 31
  md: '# Using the tools


    To use a tool, simply click on the tool using the mouse or press the appropriate
    shortcut key. You can find the shortcuts for each tool by positioning your mouse
    over the tool icon. A tool tip appears, revealing the tool''s name and its shortcut.
    For example, follow the given steps:


    +   1. Position your mouse over Zoom Tool.

    +   2. Click on Zoom Tool to select it, as shown in the following screenshot:


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_31_0.png)


    +   3. Roll your mouse over each of the tools and pause to see each tool''s name
    and shortcut. Make a mental note of each shortcut.


    Even at this early stage, it''s worth making an effort to remember the shortcut
    for each one (and there are only a few tools here in comparison with other Adobe
    programs). You''ll find that your workflow speeds up considerably as you work
    with one hand on your mouse and the other hand ready on the keyboard to press
    shortcuts.


    # The Control Panel


    The Control Panel (Window | Control) gives you quick access to options and commands
    related to the current page item or objects you select. The Control Panel is context-sensitive,
    so depending on which tool you have selected or which object you have clicked
    in the document window, the options displayed will vary. To get more information
    about each option, hover over an icon or the option''s label to see a tool tip.


    Click on Type Tool (T). Notice how the options on the Control Panel change.


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_31_1.png)'
  merge: -1
  img_proc: true
- pgno: 32
  md: '# Panels


    Panels give us speedy access to additional tools and features. By default, the
    panels sit together in a dock on the right-hand side of the screen. This is not
    a permanent position; the panels are actually floating and are independent of
    the document window. We can customize the workspace by changing each panel''s
    location and reorganizing them to suit our own needs. In the following screenshot,
    the Swatches, Character Styles, and Spacing panels are currently active. By clicking
    on the name in any Panel tab, that particular panel becomes active. Unlike other
    Adobe software you may have used, individual panels cannot be separated; they
    are "stuck" together.


    Click on the Text tab, the Paragraph tab, and the Wrap tab in order to activate
    them.


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_32_0.png)'
  merge: -1
  img_proc: true
- pgno: 33
  md: '# Expanding and collapsing panels


    The panels take up a small chunk of the real estate on your screen, however, you
    may not always want them to appear fully expanded. We can reduce the amount of
    space they take up by collapsing them to show icons without names. The following
    steps show how to expand and collapse all the panels in the dock:


    +   1. Click on the double arrow to the right of the panels'' names to collapse
    the panel, as shown in the following screenshot:


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_33_0.png)


    +   2. To expand the panels, click again on the double arrow at the top of the
    icons.'
  merge: -1
  img_proc: true
- pgno: 34
  md: 'Another way to save space is to collapse the panels so that only the tab and
    panel name are visible. To do this, perform the following steps:


    +   1. Click on the tab name. The tab itself will be highlighted but the controls
    and features in the panel will be hidden.


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_34_0.png)


    +   2. Click on the tab name a second time to expand the panel again.


    +   3. To resize a panel, drag the bottom edge of the expanded panel.


    # Hide all panels


    You may not want to see any panels while you''re working on your design. To hide
    all the panels choose Window | Hide Panels. When you''re ready, you can show them
    again by choosing Window | Show Panels.


    # Open a panel


    If you can''t see any particular panel in the panel groups, you can find a full
    list of panels under the Window menu. To open a panel that isn''t showing in the
    workspace, choose Window | Fill to open the Fill panel.


    If the panel name has a check mark under the Window menu, this means it is already
    active on the screen and that particular panel will appear highlighted in its
    panel group.


    # Rearranging panels


    To move a panel into another group, drag the panel''s tab. As you drag, you''ll
    see a ghosted version of the panel and a blue highlighted drop zone appears in
    the group, which indicates the area where you can drop the panel. You can move
    a panel up or down within the dock by dragging it to the narrow blue drop zone.'
  merge: -1
  img_proc: true
- pgno: 35
  md: 'As an exercise, try dragging the Fill panel downwards to join the group below
    it.


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_35_0.png)


    # The document window


    The document window is the white page in the middle of your screen and this, of
    course, is where all the action happens. We can see blue guidelines indicating
    the number of columns, the gutter size, and the margins. In the following screenshot,
    we can see a setup using three columns with space between them (known as the gutter)
    and the margin around the edge of the content area:'
  merge: -1
  img_proc: true
- pgno: 36
  md: '![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_36_0.png)


    # Rulers, guides, and grids


    Rulers and guides are a designer''s best friend, whether you are working with
    print or on the Web. By default, Muse displays rulers along the top and left side
    of the workspace. As mentioned earlier, the measurement units used are pixels.
    To show or hide rulers, choose View | Show/Hide Rulers.


    Muse also displays five guides that define the page size, the header, and the
    footer. We haven''t yet defined a header and footer height so you should see guides
    with handles for dragging the top of the page, the bottom of the page, and the
    bottom of the browser.'
  merge: -1
  img_proc: true
- pgno: 37
  md: 'When you use the mouse to hover over guides along the left side of the workspace,
    you''ll see a tool tip about the purpose and functionality of each guide.


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_37_0.png)


    The top and two bottom guides help you to determine your overall page size. If
    you want to change the size of your page without going back to the Site Properties
    dialog box, you can drag the first guide up, or the fourth guide down to extend
    the content area of your page. To show or hide page guides, choose View | Show/Hide
    Guides.


    # Header and footer guides


    The second and third guides on the page define the bottom of your header and the
    top of your footer, respectively. These guides become editable only after you
    have defined your header and footer in the master page. We''ll discuss that in
    more detail in a future chapter. On normal pages, the header and footer guides
    are displayed for visual reference, but they cannot be dragged to a new location.
    To show or hide header and footer guides, choose View | Show/Hide Header and Footer
    or Ctrl + Shift + /; Cmd + Shift + ,.


    # Grid overlay


    Many people think about web design layouts in terms of columns. Three-column and
    two-column layouts are very popular but it''s important to remember that thinking
    about rows and columns together gives us a grid — an important tool to help designers
    create elegant and attractive layouts. Muse provides a grid overlay.'
  merge: -1
  img_proc: true
- pgno: 38
  md: '![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_38_0.png)


    To show or hide the grid overlay, choose View | Show/Hide Grid Overlay or press
    Ctrl + '' / Cmd + ''.


    # Zooming


    While viewing content in the document window, it''s important that we have the
    ability to zoom in and zoom out as we work on our design.


    # Changing magnification


    There are a number of ways to change the magnification or zoom level. You can
    do any of the following:


    +   - Select the Zoom tool (Z). The cursor changes to a magnifying glass with
    a + symbol inside it. Click on the document window to zoom in at the point of
    clicking. Keep clicking to be able to zoom into a magnification of up to 4000%.

    +   - To zoom out while using the Zoom tool, hold down the Alt key (Win)/Option
    key (Mac) while clicking. The cursor will change to a magnifying glass with a
    – symbol inside it.

    +   - Choose the magnification level directly from the drop-down box beside the
    toolbar. The drop-down box offers values from 50% to 400% but you can type in
    any magnification level between 10% to 4000%.

    +   - Choose View | Zoom In or View | Zoom Out.

    +   - Use the shortcuts Ctrl + = (Win)/Cmd + = (Mac) to zoom in and Ctrl + - (Win)/Cmd
    + - (Mac) to zoom out.'
  merge: -1
  img_proc: true
- pgno: 39
  md: '+   Use Ctrl + 0 (Win)/Cmd + 0 (Mac) to fit the page inside your window and
    Ctrl + 1 (Win)/Cmd + 1 (Mac) to view the page at its actual size.


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_39_0.png)


    # Undoing actions


    In an ideal world, we could put together our websites without making any mistakes.
    Unfortunately, we do not live in that world and sometimes we need to backtrack
    or undo some of our actions. Thankfully, Muse allows us to step back and undo
    multiple actions. In fact, you are allowed to undo up to the last 20 actions.
    If you make a mistake you can do one of the following:


    +   Choose Edit | Undo (Action) or


    +   Hit Ctrl + Z (Win)/Cmd + Z (Mac)


    If you want to redo something you have just undone, you can do one of the following:


    +   Choose Edit | Redo (Action) or


    +   Hit Ctrl + Shift + Z (Win)/Cmd + Shift + Z (Mac)


    # Getting help and more resources


    For complete and up-to-date information about using Muse panels, tools, and other
    application features, visit the Adobe website. To search for information in Muse
    Help and support documents, as well as other websites relevant to Muse users,
    choose Help | Muse Help. You can narrow your search results to view only Adobe
    Help and support documents, as well.


    For additional resources, such as tips and techniques and the latest product information,
    check out the Muse Community Feedback page at http://forums.adobe.com/community/muse.'
  merge: -1
  img_proc: true
- pgno: 40
  md: '# Muse updates


    As Adobe updates the software, you will see a message on the the Muse Welcome
    screen informing you there is a new version available. This message only appears
    when you have an active Internet connection.


    # Summary


    In this chapter, we have discussed how Muse enables us to create websites without
    writing code. We have also familiarized ourselves with the Muse workspace, its
    tools, panels, and the document window and we looked at shortcuts for each of
    the tools. Remember, it is worthwhile to learn these shortcuts to speed up your
    workflow.


    In the next chapter, we''ll look at the Muse workflow, which is based on a typical
    web designer''s workflow from the initial concept to the final website. We''ll
    look at the steps of planning, creating, designing, and publishing.'
  merge: -1
  img_proc: true
- pgno: 41
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 42
  md: '# 2


    # The Muse Workflow


    In this chapter, we''ll look at the Muse workflow from the initial concept to
    the final website. The Muse workflow closely follows what could be described as
    the typical web designer''s workflow, namely Planning, Creating, Previewing and
    Testing, and finally Publishing your site.


    In this chapter we will cover:


    +   - Differences between designing for the Web and for print

    +   - Things to consider during the web design planning stage

    +   - The Muse Workflow – creating a site, setting up a site plan, designing,
    and publishing

    +   - Domain names and hosting


    In the previous chapter, we familiarized ourselves with the Muse workspace, its
    toolbars, and panels. Before we jump back into Muse, let''s begin by taking a
    look at some of the differences between designing for print and for the Web. We
    will look at the factors which can affect the user experience on the site which
    include they type of web browser used and the resolution of the user''s screen.


    # Print workflow versus web workflow


    In an ideal world, print design would retain an important pride of place forever.
    However, the reality is that in many parts of the world, people are finding their
    information and entertainment on the Web. If the audience is on the Web, designers
    will need to move with the times and follow suit. Making a smooth transition from
    paper to screen can be challenging, but that''s where Muse joins the party.'
  merge: -1
  img_proc: true
- pgno: 43
  md: 'Muse allows you to create websites in a similar fashion to how you create print
    layouts. It is aimed squarely at graphic designers and newbie designers who want
    to create eye-catching designs for the Web, but who don''t want to learn coding
    in order to create a website.


    In a print workflow, a graphic designer may begin their design with a pencil and
    paper to create a quick initial mockup. The designer would use Adobe InDesign
    (or something similar such as Quark Express) to lay out the page, and software
    such as Illustrator or Photoshop to create and edit images and graphics for the
    page content. Mixing it all up with a sprinkle of design know-how results in an
    end product that is a beautiful print creation.


    The Web workflow using Muse is comparable to that of the print workflow. Regardless
    of the medium, it''s a good idea to sketch out some ideas before turning on the
    computer. In five minutes you can have several sketches down on paper. It''s highly
    unlikely you would have the same number of ideas produced in the design software
    in the same time. That''s step one: get your ideas out of your head and onto paper.
    While the designer in each of us wants to create a visual masterpiece, the number
    one priority is to meet the needs of the visitors on the site.


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_43_0.png)'
  merge: -1
  img_proc: true
- pgno: 44
  md: '# Pre-Muse planning


    It''s important to understand that the effort spent in researching, exploring,
    and planning at the early stages (before you even double-click on the Muse icon)
    is vitally important, so that when the time comes to fire up Muse, you''ll find
    the workflow is straightforward and flexible. Many parameters influence how a
    design layout translates into an effective web design. These include the user
    environment, the resolution of the user''s computer monitor, and to a small extent,
    their Internet connection speed.


    # Browser battles


    If you''ve come from a print background, you''ll know that part of the fun of
    designing for paper-based projects is the ability to choose the size and even
    the shape of your medium. For example, you could choose heavy stock, recycled
    cardboard, flimsy tissue paper, or a woven finish. Your paper design may include
    cut-outs, embossing, or folding. The possibilities for your paper graphic designs
    are many and varied. However, the one thing you can be absolutely sure of when
    it comes to print design is that whatever size or shape you choose will be exactly
    the same for everyone who looks at it. If you print on an A4 sheet of paper, we
    all see that piece of paper the same way. This is not the case for web design,
    and this is possibly the greatest challenge for web designers.


    When we design for the Web, our design is viewed in the browser window. That browser
    may be sitting on a 28-inch monitor, a 15-inch laptop screen, or a 3-inch mobile
    phone screen and anything in-between. As you can imagine, this can lead to problems
    if we don''t consider how our site will look in these setups.


    There are many web browsers available, the most popular being Firefox, Internet
    Explorer, Safari, and Google Chrome. Each one of these display the results of
    the code differently, and as a result each one displays your web page differently.
    Most of the time, the differences are small, and as web designers we sometimes
    have to make small compromises to ensure that our designs look great and as similar
    as possible on any browser. At the time of writing, the statistics from the w3schools.com
    show the following browser usage:


    | Internet Explorer | Firefox | Chrome | Safari | Opera |

    | 16.7% | 34.4% | 41.7% | 4.1% | 2.2% |


    The data provided by W3C is collected from the W3Schools'' log files and should
    be used as a guide only.'
  merge: -1
  img_proc: true
- pgno: 45
  md: '# Resolution


    We know that visitors to our site could be using any one of a wide number of browsers
    to view our web page. The next variable to add to the web design equation is the
    resolution of their computer monitors or mobile devices. A question frequently
    asked by web designers is "What screen resolution should we design for?".


    To answer this question, it''s helpful to know what is the most common screen
    resolution in use today. Here is the breakdown from last year according to www.w3schools.com.
    Again, this information is best used as a guide, rather than being set in stone.


    | Higher | 1024x768 | 800x600 | 640x480 | Other |

    | --- | --- | --- | --- | --- |

    | 85% | 14% | 0% | 0% | 1% |


    We can see from the table that most computer resolutions are now at 1024×768 or
    higher, so that is the size we should optimize our page for.


    Usability expert Jacob Nielsen defines optimizing as ensuring:


    > "..your page should look and work the best at the most common size. It should
    still look good and work well at other sizes"


    Because many users have a screen resolution higher than 1024x768, most web designers
    will design their pages so that the content sits in a container that is centered
    on the page. A centre-aligned layout looks better on larger screens. Web designs
    tend to look better with an equal amount of white space on each side.


    # Download speed


    When designing for print, there is generally no limit to the number of graphics
    or images you can use in the piece. It may cause a certain amount of hassle when
    e-mailing to the printer because of the file size, but you could put the work
    onto a CD or DVD and post it.


    When it comes to web design, however, we need to think carefully about our use
    of images. Download speed is vitally important on the Internet and visitors will
    not wait around for a slow loading website. Google places a value on speed and
    takes site speed into account in their search rankings (http://googlewebmastercentral.blogspot.com/2010/04/using-site-speed-in-web-search-ranking.html).'
  merge: -1
  img_proc: true
- pgno: 46
  md: 'Until everyone in the world has a superfast broadband connection, we must always
    be aware of how fast our pages load. Many users are now accessing websites using
    cellular data networks, which are much slower than typical Internet connections.
    One way to increase download speed is to use optimized image files: JPG, GIF,
    and PNG, which are a compromise between image quality and file size. We''ll discuss
    these file formats in much more detail in a later chapter, but for now it''s enough
    to remember that the speed of our website is a very important factor when planning
    the design and build of the site, and even has implications for search engine
    optimization.


    # Where to find more information?


    So, how do we find out more about who''s using what? As mentioned already, the
    W3C is an Internet organization whose mission is to develop web standards. In
    addition to providing advice and tutorials on all aspects of web design, they
    keep track of statistics regarding access and usage. To find out more about browsers,
    screen resolutions, and the operating systems of web users, check out the following
    links:


    +   - www.w3schools.com/browsers/browsers_stats.asp: Gives information on browser
    statistics

    +   - www.w3schools.com/browsers/browsers_display.asp: Offers (reasonably) up-to-date
    information on screen resolutions

    +   - www.w3schools.com/browsers/browsers_os.asp: Provides a breakdown on operating
    systems


    # The Muse workflow


    Muse features five distinct views or sections. These are:


    +   - Plan

    +   - Design

    +   - Preview

    +   - Publish

    +   - Manage


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_46_0.png)'
  merge: -1
  img_proc: true
- pgno: 47
  md: 'These views are a representative of the steps a designer will take when designing
    and building a website (without Muse). We''ll take a look at each of these in
    turn, but let''s start with a quick recap on how to create your site in Muse.


    # Create a site


    In the first chapter we looked at the Muse interface and saw how to create a new
    site in Muse. Choose File | New. This process is very similar to creating a new
    document in InDesign. It creates a .muse file which is similar to an .indd (InDesign)
    file as it holds information about our web pages and the master pages.


    We can set up the width of our page, and based on our knowledge of common screen
    resolutions (1024x768), the default width of 960 pixels is suitable.


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_47_0.png)


    By entering a page width value we are creating a fixed width (sometimes called
    static width) layout. This means that the layout will not change in width even
    if the browser window is made narrower or wider. The alternative to fixed width
    is a fluid width layout. This means that the content stretches to fit the width
    of the browser window. At the time of writing, we can only choose a fixed page
    width option. By default, the container holding the content is centered on the
    page.


    Typical values for a fixed width page lie between 960 and 1010 pixels, leaving
    some space for the browser chrome, the borders of a Web browser, and scroll bars.
    When designing a web page, the browser chrome must be added to determine the width
    of the page. The most widely used width for a fixed-width web page is 960 pixels.
    That size allows the page to fit within a browser on a monitor whose screen resolution
    is 1024 by 768 pixels.'
  merge: -1
  img_proc: true
- pgno: 48
  md: '# Why 960 instead of 1024?


    Graphic designers have been using grids for layout for a far longer time than
    the Web has been around. The 960-based grid is used by web designers as a way
    to quickly prototype a layout in any number of columns: 9 x 3, 3 x 3 x 3, 4 x
    4 x 4 x 4, 10 x 2 columns and so on.


    In the following screenshot you can see, on the left, Nick Finck''s website and
    on the right, the same site with the grid overlay superimposed on it. The grid
    helps designers align objects on the page neatly.


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_48_0.png)


    To read more about the 960 pixel based grid visit http://960.gs/.


    # Plan your site


    Once you click on OK in the New Site dialog box, Muse opens the Plan view. When
    working with a page layout program such InDesign, you can set up how many pages
    you want. You can also set up master pages, which hold design elements or content
    that will appear consistently across many pages. We can do exactly the same thing
    in Muse. Every Muse site starts with a single thumbnail representing the home
    page on the top-half of the Plan view and a thumbnail representing a master page
    on the bottom-half of the Plan view. In the following screenshot you can see that
    we have added pages for About, Services, and Contact. Under the Services page
    there are three subpages called Graphic Design, Web Design, and Illustration.'
  merge: -1
  img_proc: true
- pgno: 49
  md: 'The Plan view lets us easily add and organize pages by dragging-and-dropping
    thumbnails. A sitemap describes the way in which the pages connect to each other
    and it gives us a nice overview of our site. Additionally, the layout in Plan
    mode determines the automatic layout of menus.


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_49_0.png)


    # Design your site


    After all your research, exploration, and planning, we''ve now reached the really
    fun part of the process: designing! With "traditional" website design, we''d write
    out HTML code, which holds the structure of our page. We would then style it using
    Cascading Style Sheets (CSS).


    To use the analogy of a house, we could think of HTML as being the floor, the
    walls, the roof, and the windows, while CSS could be the carpets, the wallpaper,
    and the paint on the ceilings.


    However, rather than writing the code and stylesheets ourselves, this is where
    Muse steps in and shields us from the dark underbelly of coding.'
  merge: -1
  img_proc: true
- pgno: 50
  md: 'To get to the Design view, simply double-click on any of the thumbnails in
    the preview. Your page will open and you''ll see the toolbar, panels, and the
    document window. We can add text, images, and lots of very cool functionality
    by dragging-and-dropping them onto the page.


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_50_0.png)


    If you''ve used Adobe''s Dreamweaver software, you''ll know that even though it
    attempts to be designer-friendly with a visual approach to web design, you cannot
    drag-and-drop your design elements precisely onto the document in the same way
    you can in Muse. This has been a source of frustration for people who are used
    to Photoshop, Illustrator, or InDesign.


    The ease with which you can place images and format text makes this program a
    joy to use. Muse is well integrated with Photoshop and Fireworks, making it simple
    to copy and paste graphics from those programs into your web page. Slideshows
    and lightboxes can all be added effortlessly; design elements which just a few
    years ago would have required extensive programming skills to implement.'
  merge: -1
  img_proc: true
- pgno: 51
  md: 'The following screenshot shows a vertical menu system created by dragging out
    from the widgets panel. The options for the panel allow us to customize it to
    our heart''s content, changing text and background colors, sizes, and positions.


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_51_0.png)


    # Preview your site


    As part of the design process, we need to check regularly to see how our website
    will look in the browser. We can do a check from within Muse by clicking on the
    Preview link at the top of the screen.


    Preview uses WebKit as its rendering engine. This is the same engine that powers
    the Apple Safari browser, the Google Chrome browser, and most mobile phone browsers,
    so it gives us a fairly accurate representation of how our design will look in
    most browsers.


    To preview a page in Muse:


    +   1. Open the page that you want to preview in Design view.

    +   2. Click on the Preview link on the upper-left corner of the Muse interface.


    While this gives us a handy "in-program" preview, it''s very important to test
    your pages in the real thing, that is, in as many browsers as possible. This can
    be a laborious process but it is worthwhile to ensure there are no surprises when
    your page loads up.'
  merge: -1
  img_proc: true
- pgno: 52
  md: '# Get the browsers


    In order to test in the browser, you need to make sure you have the latest versions
    installed on your computer so you can test your website. You can do so by using
    the following links:


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_52_0.png)


    +   - Firefox: http://www.getfirefox.com

    +   - Opera: http://www.opera.com

    +   - Safari: http://www.apple.com/safari/download/

    +   - Google Chrome: http://www.google.com/chrome/

    +   - Internet Explorer (IE) v7: http://www.microsoft.com/download/en/details.aspx?id=2

    +   - Internet Explorer (IE) v8: http://www.microsoft.com/download/en/details.aspx?id=43

    +   - Internet Explorer (IE) v9: http://www.beautyoftheweb.com/


    To preview a page in a browser, use the following steps:


    +   1. Open the page that you want to preview in the Design view.

    +   2. Choose File | Preview Page in Browser.


    We''ll start to build a new site in earnest in the next chapter, but for now,
    let''s move on to the next step in the Muse Workflow.


    # Publish your site


    So when all the hard work is done, it''s time to put your wonderful design work
    online for the whole world to see, but wait! There is a substep we need to consider
    before hitting the Publish button.


    # Reviewing and testing a website


    It could well be argued that reviewing and testing is something that should happen
    right from the start of the design and development process. As we''ve already
    seen, Muse offers a Preview view, which gives us a pretty good indication of how
    the site will look in the browser, but there are a number of questions you can
    ask yourself as you work through your web project:


    +   - Who is my target audience for this site?

    +   - Am I giving them what they want?

    +   - Is the page layout consistent? We''ll see in a later chapter how Muse''s
    master pages can help us with consistency.'
  merge: -1
  img_proc: true
- pgno: 53
  md: '+   - Is there a sense of balance and order? Is it easy to get around the site?

    +   - Are all links working?

    +   - Does the website function and display properly in all of the main (and older)
    browsers?

    +   - Has the website been spell-checked? Incorrect spelling and bad grammar have
    proved to be major turn-offs for visitors on e-commerce sites. Don''t lose visitors
    because of bad spellings.

    +   - If your site includes multimedia, does it work properly?

    +   - Are your contact details easy to find?


    These questions are just some of the issues you need to consider on your web design
    journey.


    Use individuals and groups to test your site. As the designer, you are too close
    to the site and everything from the design to the functionality will seem obvious
    to you. But is it obvious to a new visitor? It''s amazing what a fresh pair of
    eyes can pick out. Get as much feedback as possible.


    When you''re happy with your design and have tweaked it and tested it to a finely-tuned
    machine, you''re ready to unleash it and share it with the world. To do that,
    you need to publish the site to a host.


    Publishing a website means making it available to your visitors. This requires
    that you upload the website and all its assets to a server. Once you upload to
    a server, all your pages should be retested, just in case a file did not upload
    properly.


    There are two options available when publishing with Muse. You can have your site
    hosted by Adobe using Business Catalyst or you can export the HTML files and use
    any host of your choice.


    # Adobe Business Catalyst


    Business Catalyst is Adobe''s hosted application for building and managing online
    businesses. It is tightly integrated with Muse and could be considered the easiest
    option for getting your website online. Prices for basic hostings with Business
    Catalyst start at $5.99 per month. You can find a full pricing list at http://www.adobe.com/products/muse/buying-guide.html.
    It should be noted that in the future Muse may include Content Management System
    (CMS) features that will not be available by exporting HTML and will require the
    use of Business Catalyst.'
  merge: -1
  img_proc: true
- pgno: 54
  md: 'You can also publish your Muse-built website temporarily to Adobe Business
    Catalyst at no charge for a 30-day trial period. This allows you to send a live
    URL to your client for review. All sites in trial mode on Business Catalyst will
    include the Business Catalyst domain, for example, http://mysite.businesscatalyst.com.
    If you decide at a later stage to take the site "live" by paying for the monthly
    hosting, you can transfer it to your own domain and remove the .businesscatalyst.com
    subdomain.


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_54_0.png)


    The alternative to Business Catalyst is to export your files and use an FTP program
    to upload the site files to a host. It''s very easy to output your site as HTML
    from Muse, but this method requires using extra software such as FileZilla to
    transfer your files to the host''s server. You would also need to arrange hosting
    and buy a domain name.


    # A brief overview of publishing


    If you decide to go along the route of arranging your own hosting, there are some
    concepts you''ll need to familiarize yourself with. Your site will only become
    available for others to view online when you acquire server space, get a domain
    name, and upload the site.'
  merge: -1
  img_proc: true
- pgno: 55
  md: '# Domain names


    In order for visitors to find your site, you need to get a domain name. Your domain
    name is a bit like your postal address. It may be possible to find your house
    without the postal address but it''s much, much easier to find it with the address
    to hand. Visitors access websites by an IP address or a domain name.


    An IP address (Internet Protocol address) is a unique number, which identifies
    every computer or device connected to the Internet. A domain name is the text
    version of an IP address and is much easier for us humans to remember.


    The Domain Name System (DNS) is an Internet service, which translates domain names
    into their corresponding IP addresses.


    The Uniform Resource Locator (URL) is also a web address and it tells the browser
    on which server your web page is located. It does this using a communications
    protocol, such as Hypertext Transfer Protocol (HTTP) plus the domain name. For
    example, a typical web address would be something like http://www.nytimes.com.


    Domain names are unique. That''s why there is only one amazon.com, one microsoft.com,
    and one facebook.com. Domain names must be registered. Most hosting service providers
    will provide a domain registration service so it''s easy to get a domain name
    registered. The hard part is to find a domain you want that hasn''t already been
    registered. Domain names are cheap too. You should expect to pay between $5 and
    $30 for a domain name for one year.


    # Acquire server space


    An Internet Service Provider (ISP) hosts your website. Their business is to offer
    a connection to a host where you can keep your web pages and all the files that
    are part of your site.


    Many ISPs provide web space for free or for a fee. Some people find that free
    web space is useful while learning the ropes and it''s somewhere to upload your
    files while testing. However, many providers that provide free space put advertisements
    and pop-up windows on your site, which are intensely annoying and look very unprofessional.
    One of the advantages of using Muse is that you have access to Business Catalyst
    for publishing for free for 30 days.


    If you want to look professional and get good service, it is worth paying for
    a domain name and some decent hosting. It''s also worth doing some research to
    see which providers other developers recommend and which ISP''s they would steer
    clear of.'
  merge: -1
  img_proc: true
- pgno: 56
  md: '# Uploading your site


    Once you''ve arranged your hosting and domain name, it''s time to upload those
    web files you''ve worked so hard designing. Some ISPs provide an uploading or
    file management system to get your files up onto their server. The most efficient
    way to get your files onto the host''s server is to use File Transfer Protocol
    or FTP. Using FTP software such as FileZilla (http://filezilla-project.org/) or
    Smart FTP (http://www.smartftp.com/) you can quickly set up a link between your
    computer, where you create your web pages, and the host or remote computer, where
    visitors can see your site. Both of these applications are free to download.


    # Summary


    In this chapter we discussed some of the challenges faced by designers creating
    web pages. These include making your design look good when viewed on multiple
    browsers at a variety of resolutions, and making it fast-loading. We also looked
    at the Muse Workflow and the steps involved in taking a website from an idea to
    a published site.


    In the next chapter, we''ll use Muse''s wonderful wireframing tools to create
    a sitemap and a working prototype of a website.'
  merge: -1
  img_proc: true
- pgno: 57
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 58
  md: '# 3


    # Planning Your Site


    A site is a collection of web pages containing assets such as images or Flash.
    In this chapter, we''ll look at how to plan a new site and use Muse''s excellent
    wireframing tools to put together a mock up of our website.


    *Fail To Plan, Plan To Fail*


    Yes, that may be an old cliché, but like many clichés, this one is certainly true
    when it comes to our websites. If you spend some time planning your website upfront,
    you''ll prevent a lot of headaches later in the process.


    In the previous chapter we looked at the Muse workflow and how planning is an
    integral part of the development of the site. Now we''ll take a look at some of
    the basics of web page layout that are useful to know while planning our sites.


    # Page layouts


    The layout of your website can be a deciding factor on whether your visitors will
    stay on your website or leave with an impatient click. You could think of the
    layout as a map. If it''s easy for the visitors to "read" the map, they are more
    likely to stick around and find the content you''re providing. Let''s take a look
    at some of the typical layouts we see on the Web today.'
  merge: -1
  img_proc: true
- pgno: 59
  md: '# Bread and butter layouts


    When we''re designing a layout for a web page, there are a number of sections
    that we need to include. These sections can be broken into the following:


    +   - **Consistent content**: This does not change throughout the site. Examples
    of this type of content are logos, navigation bars, and footers.

    +   - **Changing content**: This is the part of the page that changes throughout
    the site, usually the main content. In some situations, the content of the sidebar
    may also change.


    A web designer''s job is to create a layout that keeps the visitor focused on
    the content while keeping it nice and easy to navigate around the site. Some examples
    of conventional or bread and butter site layouts are shown in the following figure:


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_59_0.png)'
  merge: -1
  img_proc: true
- pgno: 60
  md: 'You have a very short amount of time to capture a visitor''s attention. So
    by choosing one of these basic layouts, you''re using a tried and tested setup,
    which many web users will feel at home with. Don''t worry that these layouts look
    "boxy". You can use images, colors, and typefaces, which complement the purpose
    of your site to completely disguise the fact that every web page is essentially
    made up of boxes.


    > The bread and butter layouts featured previously are well-tested guides; however,
    there is absolutely no obligation for you to use one of these.


    # What appears on a typical web page?


    So we''ve seen some basic layouts. Now we''ll look at some of the elements that
    appear on (nearly) every web page.


    # Logo


    The logo is the part of a company''s overall branding and identity, and appears
    at the top of each page on the site along with the company name and tagline, just
    as it would on printed forms of marketing, such as business cards, brochures,
    and letterheads. This identity block increases brand recognition and ensures users
    know that the pages they''re viewing are part of a single site. Frequently, the
    logo is also a link back to the home page of the site.


    # Navigation bar


    The navigation for your site should be easy to use and easy to find. Just like
    the logo, it should appear near the top of the page. You may decide to use a horizontal
    menu across the top of the page, a vertical menu in a sidebar, or a combination
    of the two. Either way, your main navigation should be visible "above the fold",
    that is, any area of a web page that can be viewed without visitors having to
    scroll.


    # Content


    Content is the King. This is what your visitors have come for. If the visitors
    can''t find what they''re looking for, they will move on very quickly. The main
    content is an important focal point in your design; don''t waste time filling
    it with unnecessary "stuff".'
  merge: -1
  img_proc: true
- pgno: 61
  md: '# Footer


    Sitting at the bottom of the page, the footer usually holds copyright information,
    contact links information, and legalities of the site. Some designers have become
    very imaginative with footers and use this area to hold additional links, tweets,
    and "about me" information.


    The footer clearly separates the main content from the end of the page and indicates
    to users that they''re at the bottom of the page.


    In the following screenshot, you can see a page from the Apple website, which
    is highly regarded for its aesthetic design. Each section is clearly delineated.


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_61_0.png)


    If you keep in mind the idea of your site''s layout as a map, then you can determine
    where you want to lead your visitors on the site.'
  merge: -1
  img_proc: true
- pgno: 62
  md: '# Wireframes


    Wireframing is an important part of the design process for both simple and complex
    projects. If you''re creating a website for a client, a wireframe is a great tool
    for communicating your ideas visually at an early stage rather than just having
    a verbal description.


    If you''re creating a website for yourself, the wireframe helps to clarify what
    is required on each page of your website. It can be considered an overlap between
    the planning process and the design process.


    Creating a simple wireframe ensures that your page designs take into account all
    of the elements you''ll add to your pages and where they will be positioned. Wireframes
    are cost-effective because the time spent in the initial stages potentially saves
    you from losing much more time revising the design at a later stage.


    Wireframes can be created in several ways, including pen and paper and computer-based
    tools.


    In the previous chapter, we mentioned the use of pen and paper in the planning
    process. This is a quick and inexpensive method for producing wireframes. Many
    designers use graph paper with feint ruled squares, acting as a ready-made grid.
    The grid lines help to create elements in proportion to each other.


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_62_0.png)'
  merge: -1
  img_proc: true
- pgno: 63
  md: 'When it comes to computer-based applications for wireframing, there are many
    options available. Some designers use Photoshop, Illustrator, or even InDesign
    to put together their wireframes. Specific wireframing software packages that
    are popular with web designers include Balsamiq and OmniGraffle.


    # Wireframes and Mockups and Prototypes. Oh my!


    You may hear web designers refer to wireframes, mockups, and prototypes. Although
    these terms are sometimes used interchangeably, it''s important to understand
    that they are three different things.


    A wireframe is a basic illustration showing the structure and components of a
    web page.


    A mockup is an image file focusing on the design elements in the site. It contains
    the graphics and other page elements that make up the web page but may contain
    dummy text and images.


    A prototype is an almost-complete or semi-functional web page, constructed with
    HTML and CSS. Prototypes give the client (or yourself) the ability to click around
    and check out how the final site will work.


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_63_0.png)


    # What to include in a wireframe?


    Think about which design elements will appear on each page of your website. As
    mentioned already, most websites will have elements such as logos, navigation,
    search bars, and footers in consistent positions throughout the site.


    Next, think about any extra elements that may be specific to individual pages.
    These include graphics and dynamic widgets. Once you know what''s required, you
    can start to create your wireframe based on these elements.


    Some designers like to create their wireframes with the "big picture" in mind.
    Once the basic layout is in place, they get feedback from the client and revise
    the wireframe if necessary.'
  merge: -1
  img_proc: true
- pgno: 64
  md: 'Others like to create a very detailed wireframe for each page on the site,
    including every single design element on the list before showing it to the client.


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_64_0.png)


    Wireframes let us try out several different ideas before settling on our favorite
    design, which can then be brought forward to the mockup stage.


    Obviously our focus in this book is on using Muse, but I would urge you not to
    rule out using paper sketches. It''s a great way to quickly get ideas out of your
    head and into a tangible, visible layout.


    Web.without.words (www.webwithoutwords.com) is an interesting website dedicated
    to showing popular and well-known sites as wireframes. The text and images on
    each site are blocked out and it''s a nice way to look at web pages and see how
    they can be broken down into simple boxes without getting caught up in the content.


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_64_1.png)'
  merge: -1
  img_proc: true
- pgno: 65
  md: '# Wireframes with Muse


    So what are the advantages of using Muse to create our wireframes? Well, Muse
    not only lets you create wireframes, but it also allows you to quickly create
    prototypes using those wireframes. This means you can show clients the functionality
    of the website with the basic layout. The prototype produced by Muse can be reviewed
    on any web browser giving the client a good idea of how the site will appear.
    This kind of early testing can help alleviate time-consuming problems further
    down the line of the design process.


    We''re going to prepare a site and wireframe now for a fictitious website about
    windsurfing. First, we''ll create a new site, and then add pages in the Plan view.


    # Site structure with Plan view


    Let''s start by creating a new site.


    +   1. Open Muse. Choose File | New Site. In the New Site dialog box, set Page
    Width to 960 and Min Height to 800 pixels. Set Margins to 0 all around and Padding
    Top and Bottom to 10 pixels each. Set the number of Columns to 16. The columns
    appear as guidelines on the page and we use them to help us align the design elements
    on our layout. Note that Gutter is set to 20 by default, leave this as it is.
    The Column Width is calculated by Muse and you should see a value of 41 appear
    automatically in that field. Remember that all of these values can be changed
    later if necessary.


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_65_0.png)'
  merge: -1
  img_proc: true
- pgno: 66
  md: '+   2. Click on **OK**. The **Plan** view opens and you''ll see a thumbnail
    representing the Home page at the top left, and a thumbnail representing the A-Master
    page on the bottom pane.

    +   3. Save your site right away by selecting **File | Save Site**. Give it a
    descriptive name you''ll recognize, such as `Wind surf.muse`.

    +   4. To create new pages, click on the plus (+) sign to the right of or below
    the existing pages, and then click on the page''s name field to type its name.


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_66_0.png)


    +   5. Click on the plus sign to the right of the **Home** page and name the new
    page `Gear`. Click on the plus sign below the `Gear` page to add a subpage and
    name that page `Sails`. Click on the plus sign to the right of the Sails page
    and name the new page `Boards`.'
  merge: -1
  img_proc: true
- pgno: 67
  md: '+   6. Sails and Boards are now on the same level and are subpages of the Gear
    page.

    +   7. Click on the plus sign to the right of the Gear page and name the new page
    Learning.

    +   8. Click on the plus sign to the right of Learning and add one more page called
    Contact. Your Plan view should now look like the following screenshot:


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_67_0.png)'
  merge: -1
  img_proc: true
- pgno: 68
  md: '# Working with thumbnails in the Plan view


    It''s easy to add, delete, reposition, or duplicate pages when working in the
    Plan view. Right-click (Win) or Ctrl + click (Mac) on a thumbnail to see a contextual
    menu. This menu provides every option for managing your pages.


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_68_0.png)


    In the previous screenshot, you can see the menu that appears when you right-click/
    Ctrl + click.


    +   - **New Child Page**: This option creates a new blank page at a lower level
    as the current thumbnail.

    +   - **New Sibling Page**: This option creates a new blank page at the same level
    as the current thumbnail.

    +   - **Duplicate Page**: This option makes an exact copy of the current page.
    This is most useful when you have added content and applied some formatting.

    +   - **Delete Page**: This option gets rid of the page.

    +   - **Rename Page**: This option allows us to change the name of the page.

    +   - **Go to Page**: This option opens up the current page in the Design view.

    +   - **Page Properties**: This option opens the Page Properties dialog box allowing
    you to set properties for the current page only.

    +   - **Reset Page Properties**: This option reverts to the original settings
    for the page.'
  merge: -1
  img_proc: true
- pgno: 69
  md: '+   - **Export Page**: This option allows you to export your page as HTML and
    CSS.

    +   - **Menu Options**: This option allows you to choose how the page will be
    included (or not included) in the automatically-created menu.

    +   - **Masters**: This option lets you choose which Master design will be applied
    to the page.


    The context menu is not the only way to get to these options, for example the
    most common tasks in the **Plan** view can be completed as follows:


    +   - You can rename a page by double-clicking on the page name

    +   - You can delete a page by hovering your mouse over the thumbnail and then
    clicking on the x icon that appears in the top-right corner


    To reposition a page in your site map hierarchy, you can drag-and-drop a thumbnail
    on the same level or on a sublevel.


    Spend a couple of minutes adding, deleting, and repositioning pages so that you
    get a feel of creating the site structure. You''ll find the **Plan** view to be
    intuitive to use and extremely fast for creating site maps. You can choose **Edit
    | Undo** to undo any of the steps you''ve taken.


    Muse tracks all the page names, and later in the design process it allows us to
    create menus quickly using menu widgets. All links created in the **Plan** view
    are maintained and are updated automatically if we make a change to the site structure.
    You can come back to the **Plan** view at any point during your web design process.


    # Working with wireframes


    Now that we''ve set up the site structure and can see how the site flows, our
    next step is to use Muse''s tools to draw a simple wireframe.


    Muse provides several features to allow us to create wireframes. These include:


    +   - A rectangle tool to create graphics and text placeholders

    +   - Column grid for alignment of layout elements in the **Design** view

    +   - The Assets panel, which includes features to update placeholder images


    For the windsurfing site, we''re going to use a one-column layout with a header
    at the top, a main content area in the middle, and a footer at the bottom of the
    page. The header will include the site name with a tagline, links to Facebook,
    Twitter, and YouTube, and a navigation bar containing links to the pages on the
    top-level of our hierarchy.'
  merge: -1
  img_proc: true
- pgno: 70
  md: 'The main content area is the part of the page that will change throughout the
    site.


    The footer at the bottom of the page will hold copyright information.


    Let''s start by adding one more page to our site. This will be our wireframe prototype
    page. Follow the given steps:


    +   1. Add a new thumbnail to the right of the Contact page by clicking on the
    plus (+) icon. Name the page Prototype. This won''t be part of our final site,
    but it allows us to set aside a page where we can try out different layouts and
    produces a working wireframe.

    +   2. Double-click the Prototype page thumbnail in the Plan view. The Prototype
    page opens in the Design view. You''ll see a blank white page with a number of
    vertical guidelines. The vertical guidelines represent the number of columns we
    set earlier in the Site Properties dialog box. They are used only to help us with
    alignment and do not appear on the final web page.

    +   3. We''re going to make those columns even more obvious now by right-clicking/
    Ctrl + clicking anywhere on the page. From the pop-up menu, choose Show Grid Overlay.
    The pink areas are the columns and the white bars in between are the gutters.
    Your page should now look like the following screenshot:


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_70_0.png)


    If you find the pink overlay too distracting you can turn if off again by right-clicking/
    Ctrl + clicking and choosing Hide Grid Overlay.'
  merge: -1
  img_proc: true
- pgno: 71
  md: '4. Select the Rectangle tool and draw out a large rectangle from the left-hand
