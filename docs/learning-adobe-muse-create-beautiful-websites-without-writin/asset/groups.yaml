  mdcn: '


    使用图像代替文字的缺点是搜索引擎无法像读取文字那样读取图像。因此，如果你想使用这种方法，只使用在标题上。不要将其用于正文内容。


    ## 元数据 – 页面上的隐藏文本


    在上一节中，我们研究了标题与 SEO 相关的的重要性。另一个需要考虑的重要因素是页面的元数据。


    元数据是关于数据的数据。简单来说，它是关于网页的信息。它对你的访客不可见，但对访问你网站的搜索引擎可见。元数据存储在隐藏在 HTML 文档的 <head>
    中的 meta 标签中。由于我们使用的是 Muse，我们不需要担心 <head> 和 <body> 标签，但我们仍需要在每个页面中添加元数据。


    在 SEO 中使用的两个最重要的 Meta 标签是 description 和 keywords。以下是我们如何添加它们的方法：


    - 1. 在设计视图中打开 Gear 页面，选择 Page | Page Properties。页面属性对话框打开。

    - 2. 单击 Metadata 选项卡以查看类似于以下屏幕截图的窗口：


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_155_0.png)


    以下是 Metadata 类别中选项的简要说明：


    - - **Description** 指定页面的描述。

    - - **Keywords** 指定页面的关键词。

    - - **HTML for <head>** 允许我们将 HTML 代码放置到 Muse 页面中。一个例子是添加 Google Analytics 代码来跟踪页面的访问者数量。

    - - **Page Name** 是页面在 Muse 中显示的名称。

    - - **Page Title** 是在浏览器中显示的页面标题。如果希望 Muse 也使用页面名称作为页面标题，请选择 **Same as Page Name**
    选项。 （这是默认选择。）使用描述性的页面标题可以帮助你的 SEO 工作，同时为访客提供页面内容的快速概览。

    - - **File Name** 是在浏览器中加载的文件名。Muse 默认会在文件名后附加 `.html` 文件扩展名。如果希望 Muse 也使用页面名称作为文件名，请选择
    **Same as Page Name** 选项。 （这是默认选择。）

    - - 你需要单独为网站中的每个页面添加元数据。每个页面只需一两分钟，是整体 SEO 工作的重要组成部分。


    ## 总结


    在本章中，我们研究了如何在网页上添加和设置文本样式。我们看到了如何将图像和文本结合起来，包裹在文本框中。我们讨论了标题从组织和 SEO 角度的重要性，以及如何向页面添加对人类访客隐藏的元数据。


    在下一章中，我们将学习如何在 Muse 中处理图像以及如何从 Photoshop 导入图像。


    ## 7


    ## 处理图像


    在设计网页时，我们使用引人注目且有趣的图像作为访客的视觉焦点。图像用于从背景图像到项目符号等一切内容。在本章中，我们将向网站添加图像，转换它们，改变它们的透明度，并了解
    Muse 如何与 Photoshop 紧密集成。


    在本章中，你将学习以下主题：


    - - 为图像选择合适的格式

    - - 放置图像

    - - 复制图像

    - - 调整图像大小、旋转、裁剪和定位

    - - 为图像添加效果

    - - 设置图像不透明度

    - - 固定图像

    - - 从其他程序粘贴图像

    - - 使用图像作为背景

    - - 将多个对象组合在一起作为单个对象处理


    在内容中使用图像可以成为吸引访客注意力和传达信息的有力方式。图像可以将人们引导到他们在快速浏览时可能没有注意到的页面部分。如果使用得当，它们是引导访客视线到你希望他们关注的地方的有力工具。


    ## 你好，网页友好图像


    在设计网站时，我们需要记住， destined for the Web 的图像需要相应地准备。与印刷世界中可以使用非常大文件大小和非常高分辨率不同，在 Web
    上我们需要在图像文件的小尺寸和高质量图像之间做出权衡。在我们甚至打开 Muse 之前，我们通过以下步骤做出这种权衡：


    - 1. 设置图像的正确尺寸和分辨率：你需要决定图像应该有多大，并在将其带入 Muse 之前以该尺寸保存。虽然可以在 Muse 中调整图像大小（我们很快就会研究），但在
    Photoshop、Illustrator 或你使用的任何图形编辑器中以正确尺寸保存图像是良好的做法。

    - 2. 决定要使用的文件格式：Web 上使用的图像文件保存为 JPEG、GIF 或 PNG。几乎所有网络浏览器都识别并兼容这些文件格式。 （每个文件格式已在
    Choosing the best file format 部分中解释。）

    - 3. 保存并压缩文件：如果你使用 Photoshop 或 Illustrator 创建图像，请选择 File | Save for Web & Devices
    将图像缩放到尽可能小的同时保持质量合理地高的文件大小。如果你使用其他图形编辑器，请选择 File | Save As 以 JPEG、GIF 或 PNG 格式保存文件。


    遵循这些步骤将产生看起来不错且下载速度快的图像。


    ## 选择最佳文件格式


    在开始在网站上疯狂使用图像之前，我们需要了解一些关于可在 Web 上使用的图像文件格式类型的基础知识，以及如何为任务选择最佳格式。如前所述，有三种图像格式几乎被所有网络浏览器支持。你选择的格式取决于图像中有多少颜色以及是否具有透明区域。


    它们如下：


    - 1. JPEG

    - 2. GIF

    - 3. PNG


    以下是每种图像文件格式的概述：


    ## JPEG


    JPEG (.jpg) 代表联合摄影专家组，开发用于存储摄影图像。该格式支持数百万种颜色，但被称为有损格式，意味着它丢弃精细细节以将图像压缩为更小的文件。


    好消息是我们可以在保存图像为 JPEG 格式时选择压缩级别。可以将压缩量设置为 0-100 的比例（0 是最高压缩和最低质量；100 是最低压缩和最高质量）。


    与 GIF 和 PNG 图像不同，JPEG 图像可以在 24 位颜色下提供相当小的文件大小。这使它们非常适合任何类型的摄影或具有重质感或长渐变的图形。


    为了避免保存 JPEG 图像时可能出现的视觉伪影，请仔细考虑要应用的压缩量。如果图像看起来很糟糕，那么拥有极小的文件大小毫无意义。在下一个屏幕截图中，你可以看到一个图像面板，显示图像在无压缩时（左上角）、70%
    质量、35% 质量和 17% 质量时的外观。质量越低，压缩越大。你可以看到图像在较低质量时开始出现像素化。


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_160_0.png)


    ## GIF


    图形交换格式（GIF）是处理纯色块、例如徽标或没有渐变的线条艺术时不错的选择。假设你希望网站上的徽标无缝融入网页背景，你可以将图像保存为无背景并保存为 GIF。JPEG
    在这种情况下不起作用，因为所有图形编辑器都会在 JPEG 中任何空白处自动粘贴纯色背景。


    GIF 仅支持 256 种颜色，因此不适用于需要数百万种颜色的摄影图像。


    GIF 也可以是有损格式，如果你希望它有损的话。奇怪的是，质量刻度与 JPEG 相反，即 0 是无损，100 是完全有损。如果你不想使用有损压缩，可以通过将图像中包含的颜色数量限制在
    2 到 256 之间来改变文件大小。颜色越少，文件大小越小。


    GIF 格式最重要的功能之一是它支持透明度。这意味着你可以透过图像的某些部分，去除保存为 JPEG 时会出现的那种方形外观或周围的白色框。在以下屏幕截图中的图像中，棋盘格代表图像的透明区域：


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_161_0.png)


    GIF 的另一个不错功能是它们支持动画。你可以使用动画 GIF 创建迷你幻灯片或简单的广告。动画 GIF 只是一个循环播放一系列图像的文件，创造出动画的错觉。


    '
