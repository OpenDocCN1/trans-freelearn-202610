  mdcn: "\n\n## 在“字符和段落样式”面板中使用上下文菜单\n\n当你在操作样式面板时，可以通过右键单击或 Ctrl + 单击任意样式来查找额外选项。你会看到以下选项：\n\
    \n- New Paragraph Style\n- Duplicate Style\n- Delete Style\n- Unlink Style\n-\
    \ Clear Overrides\n- Redefine Style\n- Rename Style\n- Style Options\n- Delete\
    \ Unused Styles\n\n![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_147_0.png)\n\n## 标题\n\
    \n在网页设计中，我们使用标题有几个原因，其中一些原因如果你是新手可能并不完全明显。标题让我们能够组织内容，在每个页面上传达逻辑层次，有助于无障碍访问，并作为搜索引擎优化（SEO）的辅助。让我们逐一查看这些。\n\
    \n## 内容组织和层次结构\n\nHTML 标题标签被创建出来为网页提供结构。H1 或标题 1 是最重要的标题。它通常是页面上最大、最粗的文字。标题从 H1\
    \ 到 H6，越往后越小，从 H1 到 H6 逐渐变小。重要的是始终从 H1 开始，然后一次一个级别地向下移动。你可能会发现我们不需要超过 H3，但为了创建有组织的网页，我们可能需要这样做。这就是\
    \ HTML 标题标签被使用的特定目的——为你的文档结构化。你应该始终从 H1 元素开始，然后一次一个级别地移动到其他级别。例如：\n\n- H1\n- H2\n\
    - H2\n- H3\n- H4\n- H5\n- H6\n- H6\n- H5\n- H4\n- H3\n- H2\n\n重要的是在每个页面上使用 H1\
    \ 或标题 1。如果你认为你的网站中的每个页面都应只关注一个主题，那么该主题的名称或标题将是页面上最高级别最重要的标题。每个页面上真的只能有一个 H1。\n\
    \n## 标题与无障碍访问\n\n使我们的网页无障碍意味着使我们的网站可供残疾人士使用。这可能包括：\n\n- 使用屏幕阅读器的视力障碍人士\n- 使用无声音浏览器的听力障碍人士\n\
    - 身体障碍人士\n- 色盲人士\n\n通过正确使用标题，我们可以使使用辅助设备的用户更容易阅读页面。因为标题表示文档中重要文本的开始，屏幕阅读器使用标题作为锚点。页面变得更容易阅读，因为相关内容可以在不必阅读页面上每个单词的情况下访问。\n\
    \n## 标题与 SEO\n\n这是正确使用标题的一个经常被忽视的好处。搜索引擎对标题中的文本给予额外的强调或重要性。标题标签越高，该文本被认为越重要。H1\
    \ 标题在搜索结果中的权重高于 H6 标题。\n\n## 创建标题\n\n如前所述，我们使用标题为页面提供结构，我们可以使用段落或字符样式来定义这些标题的外观。这就是我们现在要做的：\n\
    \n1. 如果尚未打开，请在设计视图中打开 Learning 页面。\n2. 选择文本工具并在 Windsurf Wild 文本标志下方拖出一个文本框。\n\
    3. 输入文字 Learn How to Windsurf。\n4. 突出显示你刚刚输入的文字，然后通过控制面板或文本面板应用以下格式：\n5. Font:\
    \ Arial\n6. Size: 36\n7. Bold\n8. Color: Navy (#000090)。\n9. 在段落样式面板中，单击“创建新样式”按钮。\n\
    10. 双击新的段落样式并在样式选项对话框中将其命名为 Heading 1。从段落标记下拉菜单中选择 Headline (H1)。这就是我们告诉 Muse\
    \ 这段特定文本是页面上最重要的文本的方式。\n\n![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_150_0.png)\n\
    \n于是我们的标题 1 样式就创建好了。让我们在 Gear 页面上应用它：\n\n1. 在设计视图中打开 Gear 页面。\n2. 在 Windsurf Wild\
    \ 文本标志下方添加一个文本框。使用你的 X 和 Y 坐标确保新的文本框与 Learning 页面上的位置相同。\n\n> 在添加新的文本框之前，你可能需要先将正文向下移动。\n\
    \n3. 输入文字 Windsurf Gear。\n4. 突出显示文字（或文字的任何部分，因为我们正在应用段落样式），然后单击你创建的 Heading 1\
    \ 段落样式。\n\n你的文字现在应按段落样式中定义的格式完全格式化。\n\n## 更改文本大小写\n\n假设我们希望标题 1 全部为大写，我们可以按如下方式更改文本大小写：\n\
    \n1. 在设计视图中，确保已选择文本工具。\n2. 选择文字 Windsurfing Gear。\n3. 选择 Edit | Change Case |\
    \ UPPERCASE。这会将所选文本更改为全部大写，如以下屏幕截图所示，但它并未更改我们的段落样式。我们需要手动选择希望更改为大写的任何文字。\n\n![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_151_0.png)\n\
    \n## 文本环绕\n\n在网页的文本内容中看到信息框或图像出现并不罕见。文本框内的文本框有时被称为标注，它们用额外信息补充主要文本。\n\nMuse 通过让我们环绕矩形、另一个文本框或图像等对象来环绕文本，从而轻松创建标注。在以下步骤中，我们将剪切\
    \ Gear 页面上当前存在的图像并将其粘贴到本章开头创建的文本框内。然后我们将使文本环绕图像，使其流畅。\n\n1. 在设计视图中打开 Gear 页面。目前它由一个标题、一个文本框和一个包含两名风筝冲浪者图像的矩形组成。\n\
    2. 使用选择工具选择页面右侧的图像。\n3. 选择 Edit | Cut，将图像从页面剪切到剪贴板。\n4. 使用选择工具单击文本框，然后拖动文本框右侧的其中一个手柄，使框架几乎填满页面的宽度。\n\
    5. 然后，使用文本工具在文本框中定义文本插入点。在第一段第一行的单词 In 之前单击一次。粘贴之前复制的元素（Edit | Paste）以将对象作为内联元素插入文本框中。\n\
    \n图像现在位于文本框内，但看起来有点别扭，因为所有文本都已降到其下方。查看屏幕顶部控制面板中的环绕选项。\n\n6. 在以下环绕选项之间进行选择：\n \
    \  - Inline in text\n   - Position left\n   - Position right\n\n7. 单击每个环绕选项，以便你可以看到图像位置如何变化以及文本如何环绕它。\n\
    \n![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_153_0.png)\n\n文本紧贴图像边缘，使其没有呼吸空间。为了在内联元素（图像）周围留出一些填充，我们将添加偏移值。\n\
    \n8. 单击控制面板上的环绕下拉框。在图像右侧添加 10 像素的填充，在底部添加 5 像素。\n\n![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_153_1.png)\n\
    \n> 每当文本环绕元素时，请确保该元素不要太宽以至于使文本区域过窄。这会使文本变得非常难以阅读。\n\n## 网页安全字体\n\n存在一个字体族列表，这个列表被称为安全列表。它由一系列默认受\
    \ Windows PC 和 Apple Mac 计算机支持的字体族组成。\n\n使用这些字体在你的网站上是安全的，因为基本上每个人都已在他们的计算机上安装了它们。这意味着如果你使用\
    \ Georgia 等字体（在列表中），可以安全地假设访问你网站的每个人都会看到你打算让他们看到的漂亮排版。\n\n![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_154_0.png)\n\
    \n现在假设你创建了自己非常、非常、非常想使用的漂亮字体，但只有你和世界上另外两个人拥有它，那么问题是其他所有人访问你的网站时都看不到该字体。他们会看到替换字体或默认字体（可能是\
    \ Times New Roman 之类的），你选择字体的所有辛苦工作都将付诸东流。\n\n因此，作为 Muse 设计师，你有三个选择。你可以坚持使用网页安全字体，这样你就知道访客会按你预期的方式看到网站的字体。你可以使用\
    \ Typekit 或（我们真的希望尽可能避免这个选项）你可以将文本替换为图像。这意味着如果你想使用其他人没有的独特字体，Muse 会将文本转换为图像，该图像将在你发布网站或导出\
    \ HTML 时导出。\n\n安全列表的缺点是它在字体数量和每种字体类别内的样式（粗体、斜体、常规）种类方面都有限。\n\n"
