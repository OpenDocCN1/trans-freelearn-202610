    # Embedding rich media content


    If we have some rich media, such as a Flash presentation that we need to add to
    our web pages, we can do this just as easily as adding an image. Follow the given
    steps:


    +   1. Open the page you want to add the media file to in the Design view.

    +   2. Choose File | Place. In the Import dialog box, navigate to the folder with
    your media files and choose the one you need. Muse supports Adobe Flash SWF files.

    +   3. Click on OK and place the object where you want it on the page.


    If we want to add a video file to our page, it''s highly recommended to upload
    the video to a service such as YouTube. YouTube hosts the video so we don''t have
    to worry about bandwidth for our website. We can simply add the arbitrary HTML
    code provided by YouTube to our page as outlined in Chapter 9, More Widgets –
    Compositions and Slideshows.


    # Summary


    In this short chapter we examined how we can create a layered image in Photoshop
    and then place it as a Photoshop button in Muse. This allows us to create buttons
    with multiple states, which is a useful way to give feedback to our web visitors.
    We also saw how easy it is to take an image created in another program and copy-and-paste
    it into Muse.


    In the next chapter we''ll look at previewing and testing our whole site before
    publishing it.'
