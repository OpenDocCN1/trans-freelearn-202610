- raw:
  - "[PAGE 140]\n\n3. We can edit the text using the Control Panel at the top of the\
    \ screen (once our Text tool is selected) or in the Text panel, which we open\
    \ by choosing Window | Text, as shown in the following screenshot, if it's not\
    \ already visible:\n\n![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_140_0.png)\n\n\
    The following are the options available in both panels:\n\n+   - **Font:** You\
    \ can pick a font from a list of web-safe fonts (we'll talk about web-safe fonts\
    \ in a bit more detail later), web fonts or from a list of system fonts. Muse\
    \ exports system fonts that are not web-safe, as an image. Web-safe fonts and\
    \ web fonts are listed with a small globe icon beside them. If you choose a font\
    \ which needs to be exported, a small image icon appears beside the font on the\
    \ list in the control or text panel and on the work area beside your text.\n+\
    \   \n+   If you want to hide the icon in your work area, choose View | Hide Rasterized\
    \ Text Frame Indicators.\n+   - **Font size:** The font size specifies the size\
    \ of the font and is measured in pixels. There are a small number of pre-defined\
    \ sizes which you can select from, or you can enter a specific font size by typing\
    \ in a number.\n+   - **Bold/Italic/Underline:** Makes the selected text bold,\
    \ italicized or underlined.\n+   - **Align:** Sets your text paragraph to left,\
    \ center, right, and justify."
  - '[PAGE 141]


    +   - **Color:** This lets you set the text color. To choose a text color, you
    can use the eyedropper tool, or you can select a color using the color swatches,
    or by typing in an RGB value or a hexadecimal value.

    +   - **Letter Space:** Also referred to as tracking, letter space increases or
    decreases the spacing between letters of the selected text.

    +   - **Leading:** This specifies the amount of space above and below a line of
    text. Leading is a paragraph attribute which means any changes you make here will
    affect every line in the selected paragraph. The leading field accepts either
    percentage values (a percentage of the font size) or pixel values.

    +   - **Paragraph style:** This value lets you select a pre-defined paragraph
    style to apply to the text. By using paragraph styles, we can improve consistency
    across our site and speed up text formatting.


    Most of the time, we use Paragraph styles because we tend to work with lines of
    text. However, it is possible to create character styles which can be applied
    to individual text characters or small numbers of words.


    +   - **Character style:** Lets you select a predefined character style to apply
    to the text.


    The following options are available only in the Text panel:


    +   - **Indent:** Lets you indent the first line of the selected text. It''s possible
    to use positive and negative (minus) values in this field.

    +   - **Links:** Lets you style text with a pre-defined link style.

    +   - **Left/Right margin:** Put space in the left or right margins of the selected
    text (similar to padding).

    +   - **Space before/after:** Specifies the amount of space before (above) or
    after (below) the selected paragraph.


    > It is not a good practice to export your body text as an image. Image files
    are not resizable or selectable in the same way HTML text is, and it is not search
    engine-friendly. Text exported as image files are not selectable or resizable
    when viewed in browsers.'
  - '[PAGE 142]


    Web Fonts provide hundreds of extra fonts on top of the web-safe fonts. Web fonts
    let you use fonts that aren''t installed on the visitor''s computer. This opens
    up a whole extra world of typography goodness for us as designers. When you choose
    to use a web font, the Add Web Fonts dialog box opens, as in the following screenshot,
    which gives a visual overview of all the fonts available. The web fonts are supplied
    by the Typekit service.


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_142_0.png)


    # Creating and applying paragraph styles


    Using paragraph styles allows us to save a set of definitions or rules for larger
    blocks of text, which we can quickly apply to any block of text we choose.


    Let''s say for example, that you wanted your block quotes to always look the same
    way, set in Georgia, Italic, and size 12 with a color of red. You would select
    some text, apply the formatting then save it as a paragraph style. You can then
    reuse that paragraph style by applying it to other block quotes on your pages.'
  - '[PAGE 143]


    Any paragraph or character styles that you create are available to use throughout
    your site, not just on the page on which you created the style. Let''s make a
    paragraph style now, which will define how our main body text will look:


    +   1. In the Design view, highlight a block of text - say one line within a paragraph
    - then set the following values in the Text panel:

    +      - Font: Arial

    +      - Size: 12

    +      - Left Alignment

    +      - Colour: Dark Navy or Hex 000090

    +      - Line Spacing: 140%

    +   2. In the Paragraph Styles panel (choose Window | Paragraph Styles if you
    can''t see it on your set of panels), click on the Create New Styles button in
    the lower-right corner.

    +   3. Rename the new style by double-clicking on it and entering a descriptive
    name in the text box. In this case call it Body Copy.


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_143_0.png)'
  - '[PAGE 144]


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_144_0.png)


    You''ll notice that there are already some paragraph styles listed. These are
    styles we created in Chapter 3, Planning your Site, when we created our wireframe
    mockup. You can create as many styles as you want.


    +   4. To apply the paragraph style to all of the text you placed on the Gear
    page, click once anywhere on the text frame with the text tool so that your cursor
    appears flashing in the text. Then click rapidly three times to select all of
    the text in the text frame.


    > Click once on a text frame to place your cursor anywhere within that text frame.
    Click twice to select a word, click thrice to select the full line of text, and
    click four times to select all of the text in the text frame.


    +   5. Now let''s apply the new Body Copy Paragraph style to the text we added
    to our Learning page in the previous chapter. Go to the Plan view, then double-click
    on the Learning page to open it in the Design view.


    +   6. On the Learning page, using the Select tool, simply click once to select
    the text frame on the page.'
  - '[PAGE 145]


    7. With the text frame selected, click on the Body Copy style you just created
    and you will see an instant change in the text formatting on the Learning page.
    The text should appear with the same formatting you applied on the Gear page.
    Notice that the links on the Learning page are still white.


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_145_0.png)


    8. To edit a paragraph style, select the style in the Paragraphs Styles panel,
    make your edits, and click the Redefine Selected Styles button in the lower right
    corner of the panel.


    Try this out by changing the color of the text within the body copy to bright
    yellow. Notice how the text changes color on the Learning page and on the Gear
    page. Try changing the text size, line spacing, and font face. When you''ve finished
    experimenting, set the body copy back to its original settings and don''t forget
    to click the Redefine Selected Styles button at the bottom of the Paragraph Styles
    panel.


    9. If you want to remove a particular style from a block of text, you can select
    a piece of text where the style has been applied and then choose None from the
    Paragraph Styles panel.'
  - '[PAGE 146]


    # Creating and applying character styles


    As we''ve seen, paragraph styles work great with several lines or blocks of text,
    but what happens if we want to create a style and only apply it to certain words?
    Well that''s where character styles come in. Using character styles allows us
    to save a set of definitions or rules for a very specific group of characters
    or words.


    Let''s say, for example, that you wanted to highlight certain words on your page,
    this is how we do it:


    +   1. In the Design view, on the Learning page, highlight the word novice in
    the first line. Then set the following values in the Text panel:

    +      - Font: Arial

    +      - Size: 12

    +      - Bold and Italic

    +      - Color: Bright Yellow

    +   2. In the Character Styles panel (Window | Character Styles), click on the
    Create New Styles button in the lower-right corner.

    +   3. Rename the new style by double-clicking on it and entering a descriptive
    name in the textbox. Call it Bold Yellow.

    +   4. Now that you''ve created a character style, you can apply it to any other
    text on your pages. On the Learning page, find the word Beginner or Beginners.
    Highlight each instance of the word and apply the new style by clicking on its
    name in the Character Styles panel.

    +   5. To edit a character style, select the style in the Character Styles panel,
    make your changes, then click on the Redefine Selected Styles button in the lower-right
    corner of the panel.

    +   6. If you want to unlink a particular character style from a piece of text,
    click on the Unlink Style button in the lower-right corner of the Character Styles
    panel.


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_146_0.png)'
