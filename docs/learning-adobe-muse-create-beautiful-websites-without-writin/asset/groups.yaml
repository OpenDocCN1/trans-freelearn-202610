    # 12


    # Publishing Your Site


    You''ve built your site from scratch, added text, images, and interactivity, and
    now it''s time to unleash your hard work on the Web. The final (and exciting)
    step is to publish your site. In this chapter, we''ll look at how to get your
    site up there, onto the Web for all to see. There are two ways to host your site
    that you''ve created with Muse and we''ll look at both of these. In this chapter,
    you will learn the following topics:


    +   - Publishing a temporary site

    +   - Publishing your site with Business Catalyst

    +   - Publishing your site to a third-party hosting provider


    # Adobe ID


    When you first download and install Muse, you are required to create an Adobe
    ID. If you have previously created an Adobe ID (on www.adobe.com to access other
    Adobe services), you can use the same password with your Muse account. The following
    screenshot shows a Sign In window.


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_244_0.png)'
  - '[PAGE 245]


    If you purchased a subscription with Adobe Creative Cloud, you''ll use the same
    password to log into Muse when you first install it.


    If you previously created a Business Catalyst account and used the same login
    email to create your Adobe ID, the system will detect that the e-mail address
    you entered matches a record in the Business Catalyst database.


    Whichever way you first set up your ID, you will need to know that username and
    password when it comes to publishing your site.


    # Publishing a temporary site


    When you use Muse, you can make and publish as many temporary sites as you wish.
    Every temporary site you create is active for 30 days. This gives you plenty of
    time to upload your sites, test them, and share them with your clients before
    going for a final launch. If you want to, you can publish one original form of
    your site, publish a second version as a temporary site, and make changes to that
    one. This allows you and your client to compare the before and after iterations
    of the same site.


    If a temporary site you''re working on is active for more than 30 days, you can
    extend its life by simply publishing the site again from your .muse file.


    # Remind me what the .muse file is again


    When you design, build, and save your site in Muse, a single file with the extension
    .muse is created. This is very different from the situation where you may have
    handcoded or used a program like Dreamweaver to create your website. In that situation,
    you would have a folder which would contain the following files:


    +   - HTML files for each page

    +   - At least one CSS file for styling your pages

    +   - All of your image files

    +   - Any other files you might use on your site, such as a Flash movie.


    The advantage of a single .muse file is that all your links, pages, styling, and
    images are in this file. If you''re working collaboratively, you can send a .muse
    file as well as the placed images to your work partner and they can open it safely
    with the knowledge that everything required for the site is in this one file.


    When you publish to a temporary site, you upload this single .muse file.


    Let''s now look at how to publish a temporary site; later we''ll learn how to
    permanently publish your site to its final spot on the Web.'
  md: "\n## Test the functionality of all your widgets\n\nIf you've added some of\
    \ the handy widget functionality provided by Muse, make sure it works. It should\
    \ work, but don't forget to test. If there is a problem, it will be with older\
    \ browsers, which will not support some functionality. If you find that a large\
    \ portion of your visitors are using an older browser (and this is something you\
    \ will discover over time by using website logs or Google analytics), then you\
    \ may need to provide an alternative to that functionality.\n\n## Test all links,\
    \ including navigation\n\nMake sure all the links work properly. Links in your\
    \ main navigation are created automatically by Muse, so check that it includes\
    \ all the pages you want, and that it doesn't include any pages you don't want.\n\
    \nCheck all links to external sites and check your anchor links to ensure they\
    \ are taking the visitor to where they should be.\n\n## Test all downloads\n\n\
    If you have added a link to a download such as a PDF file, make sure that your\
    \ download links point to the correct files, and that the download files exist.\n\
    \n## Test the site's accessibility conformance\n\nUse at least two different accessibility\
    \ evaluation tools. A useful list of tools is available on the W3C accessibility\
    \ initiative website: http://www.w3.org/WAI/RC/tools/complete.\n\n## Proofread\
    \ all content\n\nSpelling errors are a major turn-off for visitors to websites.\
    \ Make sure you spell check and read through each page of your site to check that\
    \ all the text is clear, simple, and appropriate for your website's target audience.\n\
    \n## Usability testing\n\nThe tests and checks listed so far are something you\
    \ can do yourself, but to really test your site, you need a fresh pair of eyes;\
    \ ideally, several sets of eyes. The main goal of usability testing is to make\
    \ sure your final version, your live website, is user-friendly and works well\
    \ for your visitors.\n\nYou will have to test the following:\n\n- **Effectiveness**:\
    \ Testing to see if the user can accomplish the desired tasks\n- **Efficiency**:\
    \ Testing to see how much effort is involved in accomplishing the desired tasks\n\
    - **Satisfaction**: Testing to see if the user has a satisfactory experience and\
    \ will return\n\nYou may be surprised that what seemed completely obvious to you,\
    \ may leave an independent tester scratching their head, wondering what to do\
    \ on your website.\n\n> For tons of information on website usability, visit Jakob\
    \ Nielsen's website at: http://www.useit.com/.\n> \n> Mr. Nielsen is recognized\
    \ as one of the pioneers of usability testing on websites. You might also be surprised\
    \ at how plain the site is.\n\nSome of these tests will only be possible once\
    \ you upload your site to the server (which we'll cover in the next chapter),\
    \ but many of them are possible by testing locally on your machine.\n\nIf you\
    \ were creating a very large site you would need to do additional testing, but\
    \ for a small personal site created with Muse, testing everything that's been\
    \ mentioned so far would be a good start.\n\n## Creating a device-friendly website\n\
    \nWhile Adobe does not officially support mobile device designs in Version 1 of\
    \ Muse, there are a number of things you can consider when designing your site\
    \ to make it mobile friendly, as follows:\n\n- Adobe Flash technology is not supported\
    \ on iPhones and iPads. This was the source of some antagonism between Apple and\
    \ Adobe. If you put Flash on your website, it will not be visible to users of\
    \ iPhones or iPads.\n- Apple does not like pinned images either. On the iPhone\
    \ and iPad, your pinned images will not stay pinned where you want them.\n- Some\
    \ embedded HTML that you added to pages using Object | Insert HTML can produce\
    \ unexpected results on smart phones and tablets. You should test the site on\
    \ a mobile device and if there is a problem, you should remove the embedded HTML\
    \ to see if the rest of the page behaves normally.\n- There is no Rollover/Hover\
    \ state on touch devices. On many devices, the first touch is treated as a hover,\
    \ with the second touch acting as the Click or Down state. Again, testing on a\
    \ mobile device is required to ensure that your menu widgets and other links work\
    \ correctly.\n- Aim for a good user experience for all of your visitors. At this\
    \ point, it is very difficult, if not impossible, to duplicate the experience\
    \ on a mobile device as on a desktop or laptop computer. So keeping your site\
    \ simple and easy-to-use is one way to ensure that your site performs well on\
    \ a mobile device.\n\n## Summary\n\nIn this short chapter, we saw how to preview\
    \ your page within Muse and in a browser, how to preview the entire site in a\
    \ browser, and how to export the site as HTML and its associated assets. We also\
    \ discussed testing and what you as the designers should be checking for, and\
    \ we saw some tips on making your website mobile device friendly.\n\nIn the next\
    \ and final chapter, we'll learn how to publish our site on the Web.\n\n## 12\n\
    \n## Publishing Your Site\n\nYou've built your site from scratch, added text,\
    \ images, and interactivity, and now it's time to unleash your hard work on the\
    \ Web. The final (and exciting) step is to publish your site. In this chapter,\
    \ we'll look at how to get your site up there, onto the Web for all to see. There\
    \ are two ways to host your site that you've created with Muse and we'll look\
    \ at both of these. In this chapter, you will learn the following topics:\n\n\
    - Publishing a temporary site\n- Publishing your site with Business Catalyst\n\
    - Publishing your site to a third-party hosting provider\n\n## Adobe ID\n\nWhen\
    \ you first download and install Muse, you are required to create an Adobe ID.\
    \ If you have previously created an Adobe ID (on www.adobe.com to access other\
    \ Adobe services), you can use the same password with your Muse account. The following\
    \ screenshot shows a Sign In window.\n\n![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_244_0.png)\n\
    \nIf you purchased a subscription with Adobe Creative Cloud, you'll use the same\
    \ password to log into Muse when you first install it.\n\nIf you previously created\
    \ a Business Catalyst account and used the same login email to create your Adobe\
    \ ID, the system will detect that the e-mail address you entered matches a record\
    \ in the Business Catalyst database.\n\nWhichever way you first set up your ID,\
    \ you will need to know that username and password when it comes to publishing\
    \ your site.\n\n## Publishing a temporary site\n\nWhen you use Muse, you can make\
    \ and publish as many temporary sites as you wish. Every temporary site you create\
