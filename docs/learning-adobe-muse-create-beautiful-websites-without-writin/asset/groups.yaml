    the same options as the Bar Menu.


    # Vertical menus


    To create a Vertical menu, click-and-drag it out from the Menus section in the
    Widgets Library panel. The obvious difference here is that the menu item appears
    one under the other. The submenus fly out horizontally, as shown in the following
