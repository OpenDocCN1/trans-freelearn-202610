    \ them, and share them with your clients before going for a final launch. If you\
    \ want to, you can publish one original form of your site, publish a second version\
    \ as a temporary site, and make changes to that one. This allows you and your\
    \ client to compare the before and after iterations of the same site.\n\nIf a\
    \ temporary site you're working on is active for more than 30 days, you can extend\
    \ its life by simply publishing the site again from your .muse file.\n\n## Remind\
    \ me what the .muse file is again\n\nWhen you design, build, and save your site\
    \ in Muse, a single file with the extension .muse is created. This is very different\
    \ from the situation where you may have handcoded or used a program like Dreamweaver\
    \ to create your website. In that situation, you would have a folder which would\
    \ contain the following files:\n\n- HTML files for each page\n- At least one CSS\
    \ file for styling your pages\n- All of your image files\n- Any other files you\
    \ might use on your site, such as a Flash movie.\n\nThe advantage of a single\
    \ .muse file is that all your links, pages, styling, and images are in this file.\
    \ If you're working collaboratively, you can send a .muse file as well as the\
    \ placed images to your work partner and they can open it safely with the knowledge\
    \ that everything required for the site is in this one file.\n\nWhen you publish\
    \ to a temporary site, you upload this single .muse file.\n\nLet's now look at\
    \ how to publish a temporary site; later we'll learn how to permanently publish\
