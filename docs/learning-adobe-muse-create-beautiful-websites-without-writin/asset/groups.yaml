    first create a new site, Muse automatically generates a Home page, also called
    the index page, that is linked to the Master Page design. Plan view is the default
    view when you open a Muse site.


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_27_0.png)


    At this stage, your Plan view will only have a single page: the home page, which
    appears as a thumbnail on the upper section of the Plan view. Beneath that you
    should see your Master pages. In this case you will have one master page, named
    A-Master. The Master pages act as templates to share common design elements such
    as headers, footers and logos that are required on more than one web page.


    A Muse site has five views: Plan, Design, Preview, Publish, and Manage. You can
    switch between any of the views by clicking the links at the top of the interface.
    The fourth link, Publish, opens the Sign In window which starts the publishing
    process. We''ll talk about these views in more detail in later chapters.


    ## Saving your site


    Before we go any further it''s a good idea to save our site.


    - 1. Choose File | Save. The Save Muse File As dialog box opens. Type in a name
    for your site; let''s call it MyFirstWebSite.muse.

    - 2. Navigate to the location on your computer where you want to save your sample
    project and then click on Save.


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_28_0.png)


    ## Opening a page in Design view


    With our site saved, we can move into the Design view and check out the rest of
    the Muse workspace. While still in the Plan view, double-click on the homepage
    thumbnail to open that page.


    > You can also switch to the Design view by clicking on Design at the top of the
    Muse window.


    The Design view is where most of the heavy lifting of the design work takes place.
    This is where we add our text, images, and multimedia widgets to our web page.


    The Design view workspace encompasses everything you see when you open or create
    a new document:


    - Views

    - Toolbox

    - Document window

    - Panels

    - Menus

    - Control panel


    With your homepage open, notice that tabs appear for your selected page and for
    your site plan. You can open multiple pages in Muse and each one will appear with
    its own tab. To jump from a page to another page or to the site plan, simply click
    on the page name tab.


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_29_0.png)


    As shown in the previous screenshot, the letters indicate the different components
    of the Muse workspace, as follows:


    - A: Menu

    - B: Views

    - C: Control Panel

    - D: Toolbar

    - E: Document window

    - F: Panels


    ## The toolbar


    The toolbar contains tools for selecting objects, working with type, cropping,
    and drawing rectangles. It sits at the top of screen, to the right of the Views
    section. It contains some tools you may be familiar with if you''ve used other
    Adobe programs.


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_30_0.png)


    The following is a brief overview of the function of each tool:


    - **Selection tool**: It lets you select objects on a page

    - **Crop tool**: It lets you crop images on a page

    - **Text tool**: It lets you create a text area where you can add text to a page

    - **Zoom tool**: It lets you zoom in or out from the page

    - **Hand tool**: It lets you pan around the page by dragging

    - **Rectangle tool**: It lets you create rectangular, round rectangular, or circular
    objects that can be filled with colors or images


    ## Using the tools


    To use a tool, simply click on the tool using the mouse or press the appropriate
    shortcut key. You can find the shortcuts for each tool by positioning your mouse
    over the tool icon. A tool tip appears, revealing the tool''s name and its shortcut.
    For example, follow the given steps:


    - 1. Position your mouse over Zoom Tool.

    - 2. Click on Zoom Tool to select it, as shown in the following screenshot:


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_31_0.png)


    - 3. Roll your mouse over each of the tools and pause to see each tool''s name
    and shortcut. Make a mental note of each shortcut.


    Even at this early stage, it''s worth making an effort to remember the shortcut
    for each one (and there are only a few tools here in comparison with other Adobe
    programs). You''ll find that your workflow speeds up considerably as you work
    with one hand on your mouse and the other hand ready on the keyboard to press
    shortcuts.


    ## The Control Panel


    The Control Panel (Window | Control) gives you quick access to options and commands
    related to the current page item or objects you select. The Control Panel is context-sensitive,
    so depending on which tool you have selected or which object you have clicked
    in the document window, the options displayed will vary. To get more information
    about each option, hover over an icon or the option''s label to see a tool tip.


    Click on Type Tool (T). Notice how the options on the Control Panel change.


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_31_1.png)

