    +   2. Click once on the first thumbnail to select the trigger.

    +   3. Click on the larger content area to select it. By clicking first on the
    trigger and then on the target, we are telling Muse that these two are linked.

    +   4. With the content area selected, click on the drop-down Fill menu and add
    the first image. Once again, set Fitting to Scale To Fill.


