    我们将在下一章回到我们的菜单进行进一步的格式设置。


    ## 导航链接的技巧


    访问你网站的访客将使用你提供的链接在网站中导航。任何使用网络超过一周的人都期望导航包含以下内容：


    - **链接到主页**：大多数网站都是围绕主页组织的，因此你应该始终从网站上的每个其他页面包含一个链接到主页。

    - **链接到主要主题**：对于讨论主要主题的每个网页，请包含指向其他主要主题网页的链接。

    - **描述性链接**：你的页面名称和文本链接应该对访客有意义。你将花费大量时间在你的网站上工作，所以对你来说一切都会有意义。确保对之前访问过你网站的人也有意义。在你的链接中使用简单但描述性的文本。

    - **链接到联系页面**：如果你提供服务或销售产品，人们会想要联系以获取更多信息。通过提供指向联系页面的链接让他们更轻松。


    ## 放大、缩小和关于


    当你在 **Design** 视图中工作时，不要害怕放大，以便你能清楚地看到自己在页面上放置对象的位置。完成更改后，缩小以获得全貌。以下各节展示了如何在 Design
    视图中更改网页的放大倍率。


    ### 放大


    在对齐或放置页面上的对象时，重要的是要非常接近，因此我们需要放大。点击 **Toolbox** 中的 **Zoom** 工具，然后点击页面以放大，或按 Ctrl（Windows）或
    Cmd（Mac OS）+ 等号/加号。


    ### 缩小


    放大完成后，你需要再次缩小。点击工具箱中的缩放工具。按住 Alt + 点击（Windows）或 Option + 点击（Mac OS）页面，或按 Ctrl（Windows）或
    Cmd（Mac OS）+ 减号。


    ### 适应窗口大小


    当你将页面适应窗口时，页面会调整大小以适应你的工作区尺寸。选择 View | Fit Page to Window，或按 Ctrl + 零（Windows）或
    Cmd + 零（Mac OS）。


    ### 使页面恢复实际大小


    如果你放大了很多，或者在工作区中更改了页面的尺寸，你始终可以通过选择 View | Actual Size 或按键盘上的 Ctrl + 1（Windows）或
    Cmd + 1（Mac OS）将页面恢复到实际大小。


    ## 总结


    在本章中，我们研究了母版页面的概念以及我们如何使用它们在多个页面上应用外观和感觉。我们学习了如何在单个网页上添加简单文本以及如何添加链接。我们使用了 Muse
    的一些布局工具，即参考线和网格叠加层来对齐我们的内容。


    恭喜，你现在可以构建一个完全功能齐全的网站！是的，这是一个基本站点，只包含文本和一些链接，但这些是每个网页的基本构建块。


    在下一章中，我们将研究 Muse 中的另一个重要构建块——矩形。


    ## 5


    ## 矩形的乐趣


    在上一章中，我们简要介绍了如何向页面添加一些文本，以及如何添加链接以便在浏览器中从页面跳转到页面。这是网站构建的重要组成部分。在本章中，我们讨论 Muse
    网站的另一个重要基本构建块——矩形。


    矩形正如其名，就是一个形状。当我们绘制矩形时，我们是在页面上创建形状以布局对象。矩形可以包含文本或图像，可以填充颜色并用描边勾勒边缘。尽管它们被称为矩形，但它们可以是正方形形状，我们也可以将它们的角圆化，使其呈圆形形状。


    在本章中我们将学习如何执行以下操作：


    - 设置背景矩形

    - 创建矩形

    - 选择或调整矩形

    - 剪切/复制/粘贴矩形

    - 定位和旋转矩形

    - 复制矩形


    ## 使用矩形


    矩形在 Muse 中的主要目的是充当页面上的布局对象。它们让我们定义页面上的各个部分。一旦创建了某个部分或矩形，它就可以填充颜色和/或在边缘应用描边。我们还可以将背景图像填充到矩形中。虽然每个网页本质上都是由框组成的（无论你使用的是
    Adobe Muse 还是其他网页设计工具），但对背景图像的巧妙使用可以消除网站的方框感。我们将在未来的章节中更详细地讨论图像。


    消除网页方框感的另一种方法是使矩形的角变圆。我们实际上可以将正方形的角完全圆化，使其成为圆形。


    在下面的屏幕截图中，你可以看到左侧的矩形具有直角，而右侧的矩形大小完全相同，但具有圆角。


    网格叠加层已通过选择 View | Grid Overlay 打开，以帮助对齐这些矩形。


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_111_0.png)


    如果你回想一下第 3 章《规划你的网站》，你会记得我们在主页上使用矩形创建了一个线框布局，这些矩形代表了我们页面上的不同部分，使用了圆角矩形。我们使用矩形来划分页面的区域，这些区域将代表页眉、导航栏、主要内容区域和页脚。在传统的网页设计中，这种设置是使用
    HTML <DIV> 标签创建的。我们的原型看起来与以下屏幕截图类似：


    在上一章中，我们通过选择文本工具然后点击并拖动出一个矩形形状来向页面添加文本。这创建了一个文本框。文本框和其他对象，如小部件和图像，在设计方面与矩形非常相似。例如，如果你想为文本框添加斜面或描边，你将遵循相同的操作步骤。


    > 你可以通过使用文本工具双击它将任何矩形转换为文本框。


    那么让我们开始在页面上创建一些矩形吧。如果你一直在跟随操作，请在 Plan 视图中打开 Windsurfing 网站，以便你可以看到你的站点地图。


    '
