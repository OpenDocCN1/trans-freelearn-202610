    # Changing Composition widget options


    Each Composition widget offers several options for setting up how the widget functions.
    To get to the options, click on the editing options icon—the blue arrow. In the
    following list, you''ll find an explanation of each option available for the blank
    composition we''ve just added to our page:


    +   - **Position**: This sets up where the target area is positioned on the page.
    By choosing **Stacked**, all of the content is overlapped, such as the target
    content appears in the same place on the web page. By choosing **Scattered**,
    it lets you position each target container in a different location on the page.
    Choosing **Lightbox** dims the rest of your web page and puts the focus on your
    target content.'
