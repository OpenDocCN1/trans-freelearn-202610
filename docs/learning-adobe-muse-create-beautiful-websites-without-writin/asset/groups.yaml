    # Resolution


    We know that visitors to our site could be using any one of a wide number of browsers
    to view our web page. The next variable to add to the web design equation is the
    resolution of their computer monitors or mobile devices. A question frequently
    asked by web designers is "What screen resolution should we design for?".


    To answer this question, it''s helpful to know what is the most common screen
    resolution in use today. Here is the breakdown from last year according to www.w3schools.com.
    Again, this information is best used as a guide, rather than being set in stone.


    | Higher | 1024x768 | 800x600 | 640x480 | Other |

    | --- | --- | --- | --- | --- |

    | 85% | 14% | 0% | 0% | 1% |


    We can see from the table that most computer resolutions are now at 1024×768 or
    higher, so that is the size we should optimize our page for.


    Usability expert Jacob Nielsen defines optimizing as ensuring:


    > "..your page should look and work the best at the most common size. It should
    still look good and work well at other sizes"


    Because many users have a screen resolution higher than 1024x768, most web designers
    will design their pages so that the content sits in a container that is centered
    on the page. A centre-aligned layout looks better on larger screens. Web designs
    tend to look better with an equal amount of white space on each side.


    # Download speed


    When designing for print, there is generally no limit to the number of graphics
    or images you can use in the piece. It may cause a certain amount of hassle when
    e-mailing to the printer because of the file size, but you could put the work
    onto a CD or DVD and post it.


    When it comes to web design, however, we need to think carefully about our use
    of images. Download speed is vitally important on the Internet and visitors will
    not wait around for a slow loading website. Google places a value on speed and
    takes site speed into account in their search rankings (http://googlewebmastercentral.blogspot.com/2010/04/using-site-speed-in-web-search-ranking.html).'
