    Here''s an explanation of each option:


    +   - Menu Type: This specifies which items the Muse will use to build the menu.
    Choosing Top Level Pages means a menu item for each page on the top level of your
    site plan will appear. Choosing All Pages means a menu item for each page on the
    top level of your site plan, as well as submenu items for any child pages will
    appear. Manual menu types allow you to add menu items manually in the Design view.

    +   - Menu Direction: This lets you pick either horizontal or vertical orientation
    for your menu.

    +   - Edit Together: When the Edit Together option is selected, any changes that
    you make will be applied to all items in the Menu Bar widget. Deselect this option
    to make changes to the Menu Bar items individually.

    +   - Item Size: The options here let you specify the type of width for the menu
    items. Fit Width sets rectangles for each menu item that are only large enough
    to contain their respective words. Uniform Width creates menu items of uniform
    size, based on the largest word in the menu bar.

    +   - Left Icon: Checking this box sets up an image frame to the left of each
    menu item. You can change the icon in the image frame by using Fill and Stroke
    or by adding a background image to it. When unchecked, the image frame is not
    displayed.

    +   - Label: When checked, the menu items label are displayed. When disabled,
    the labels are not displayed. The label is the page name of the linked button.

    +   - Right Icon: This works in the same way as the Left Icon, except that the
    image frame appears to the right of the menu item that is displayed. When disabled,
    the icon is not displayed.

    +   - Parts Positioning: This lets you specify the horizontal and vertical alignment
    of the menu items.'
