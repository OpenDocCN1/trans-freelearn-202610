- raw:
  - '[PAGE 246]


    When you publish a site, it automatically takes the site name that your project
    started with, and adds the Business Catalyst domain name. So for example, the
    temporary site''s URL for our Windsurfing site would look like this:


    ```

    http://windsurfing.businesscatalyst.com

    ```


    Remember, this is only temporary, so when you are going for the final site launch,
    you can assign a domain name of your choice to it. The following steps have to
    be performed to publish a temporary site from Muse:


    +   1. Click on the **Publish** link at the top of the Muse workspace.

    +   2. The **Publish** dialog box appears. Enter the name of your temporary site
    in the **Site Name** field. This should be a descriptive name that will help you
    to identify the site. For example, you could enter My windsurfing site.


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_246_0.png)


    +   3. If they are not already visible, click on the **Options** link to see more
    options for your temporary site.

    +   4. Leave **Publish to** as **New site**....

    +   5. The site''s **URL** field in the **Options** section will automatically
    remove spaces and special characters and spaces that were entered in the **Site
    Name** field to create a suggested URL for your live temporary site. You can edit
    the contents of the **URL** field to change the automatically generated URL, if
    you want to.

    +   6. The **Data Centre** field selects the data centre where the site files
    will be hosted. Muse will detect this automatically, but if you want to be specific,
    you can choose from United States, European Union, or Australia.'
  - '[PAGE 247]


    7. If you don''t live in any of these three options, you can choose the Data Centre
    closest to your client''s location.


    8. When completed, the dialog box should look something like the following screenshot:


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_247_0.png)


    9. Click on OK to publish your new temporary site.


    10. Muse will upload all of your pages and assets, and when uploading is complete,
    you''ll get a confirmation message telling you that your temporary site is now
    hosted. Click on OK.


    11. Your Web browser will open automatically at the temporary site address. You
    will also simultaneously receive an email to your Adobe ID address congratulating
    you on publishing your temporary site with a link to the temporary URL.


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_247_1.png)'
  - '[PAGE 248]


    If you want to make more changes to your Muse site and upload them to the same
    location, click the Publish link in Muse again. You''ll see that the link to your
    temporary site is displayed automatically below the Site Name field. Click on
    the link to launch your temporary site in a new browser window and test it.


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_248_0.png)


    The URL of the temporary site can be copied and sent to your clients for review.
    You now have an excellent opportunity to go through all of the testing we discussed
    in the previous chapter. Also, you''ll be testing a working, online website but
    without having to worry about the general public wandering onto the site.


    Once you''ve published the temporary site, the Manage link will now be available
    and active. We''ll use this shortly to publish the final site.


    # Editing and updating a site


    You have now published your site and spoken to your client, but you may find that
    there are some changes required. In order to edit and update your site, apply
    the following steps:


    +   1. Open the same .muse file in Muse.

    +   2. You have two options now:

    +      - Make changes in the existing .muse file and then choose File | Save and
    click on the Publish link again.

    +      - Choose File | Save As to create a new copy of the site. Make the changes
    required in the Muse workspace and then click on the Publish link again.'
  - '[PAGE 249]


    3. You can now publish over the existing temporary site by leaving the options
    as they are in the Publish dialog box, or you can create a new temporary site.
    This makes it easy for your client to compare the before and after changes.


    +   By choosing File | Save As, you are keeping your original site safe.


    4. When you''ve published a temporary site, it is listed in the Publish to menu
    in the Publish dialog box. You can select an existing site from the list, or choose
    to create a new site.


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_249_0.png)


    5. You can upload all the files, or only those that you''ve modified. If you have
    a very large website, it''s a good idea to upload only the modified files. When
    Muse is upgraded, it may be a good idea to republish the entire site.


    6. Repeat this process until you and the client are happy with the site. Hopefully
    that won''t take too many iterations.


    # Upgrading and launching


    The final steps involve "upgrading" your site and publishing it. When you get
    to this stage, you will need to pay for hosting fees. You will also need to register
    a domain name for your site and this is done through a third party.'
  - '[PAGE 250]


    # Register a domain name


    You will need to contact a domain registrar in order to buy the domain name that
    you want to use for your website. There are many sites offering this service online
    and you should be able to buy a .com domain for less than $10 online. Buying a
    domain name is very straightforward and is generally completed very quickly. We
    will return to the domain registrar after we complete a few more steps.


    # Upgrade to a published site


    The following steps will tell you how to upgrade your site and publish it:


    +   1. In Muse, with your previously published temporary site open, click on the
    Manage link. The Manage link is only available once you''ve published your temporary
    site.


    +   2. After clicking on the Manage link, the Business Catalyst admin console
    opens in your Web browser window. You''ll see the Dashboard where you can manage
    your Muse sites hosted by Business Catalyst. You''ll also be able to view your
    site''s statistics.


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_250_0.png)'
  - '[PAGE 251]


    +   3. Click the **Push Site Live** button on the **Dashboard**.

    +   4. The **Site Upgrade** window appears. Click on **Proceed to checkout**.
    You''ll need to enter your credit card information to complete the upgrade.

    +   5. Leave the default settings for the first two options:

    +      - Site hosting plan: **webBasics**

    +      - Billing option: **Invoice Me Directly**


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_251_0.png)


    +   6. Choose how frequently you want to be billed, fill in your credit card details
    and click on **Make Payment**.

    +   7. Your credit card payment is processed instantly, based on your selection.'
  - '[PAGE 252]


    8. You will be returned to the Dashboard and the Site Status is now Live.


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_252_0.png)


    # Associating the domain name with your Muse site


    Our temporary site is now upgraded and is hosted commercially by Business Catalyst.
    This upgrade means that we can associate our domain with the site name we bought
    from the domain registrar.


    Before an upgrade from a temporary site, the site address looks something like
    this:


    ```

    http://my_site.businesscatalyst.com

    ```


    (for example, http://mywindsurfingsite.businesscatalyst.com)


    After the upgrade and launch of a site, we can add our domain name so it looks
    more like this:


    ```

    http://my_domain_name.com

    ```


    (for example, mywindsurfingsite.com)


    In this section, you''ll use the interface in the Dashboard of the admin console.


    +   1. Click on the option in the Dashboard and then click on Add a domain.


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_252_1.png)'
  - '[PAGE 253]


    +   2. When the **Site Domains** dialog box appears, click on the **New Domain**
    option.

    +   3. Type in the domain name you registered in the **Domain** field. Do not
    include the www. prefix before the domain name, but do include the domain''s extension
    (such as, .com, .org, or others); for example: `my_domain_name.com`.

    +   4. Select the **Home Page** on the **Start Page** menu. Set the **Country**
    and **Culture** for the site. Leave all other default settings and click on **Save**.


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_253_0.png)


    +   5. You''ll see a confirmation message. Click on **Close** to close the **Add
    a New Domain** dialog box and return to the admin console. Your domain name that
    you added to the site is now listed.

    +   6. Click the **Dashboard** link in the left sidebar to return to the **Dashboard**.

    +   7. In the **Domains** section, the domain name you entered is now listed.


    # Re-delegating your domain name


    You are nearly there. There is only one more thing to do and that''s re-delegating
    your domain name. This just means making sure that when you type in your domain
    name in the browser, it goes to the right place.


    Unfortunately, this is not something you can do either through Muse or through
    the **Business Catalyst** dashboard. Here''s how to do it:


    +   1. Go to the website of the registrar that you bought your domain from.

    +   2. Most registrars have a Control Panel which you can use to re-delegate your
    domain. You''ll need a username and password supplied to you by the registrar.'
  md: "\nWhen you publish a site, it automatically takes the site name that your project\
    \ started with, and adds the Business Catalyst domain name. So for example, the\
    \ temporary site's URL for our Windsurfing site would look like this:\n\n```\n\
    http://windsurfing.businesscatalyst.com\n```\n\nRemember, this is only temporary,\
    \ so when you are going for the final site launch, you can assign a domain name\
    \ of your choice to it. The following steps have to be performed to publish a\
    \ temporary site from Muse:\n\n- 1. Click on the **Publish** link at the top of\
    \ the Muse workspace.\n- 2. The **Publish** dialog box appears. Enter the name\
    \ of your temporary site in the **Site Name** field. This should be a descriptive\
    \ name that will help you to identify the site. For example, you could enter My\
    \ windsurfing site.\n\n![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_246_0.png)\n\n\
    - 3. If they are not already visible, click on the **Options** link to see more\
    \ options for your temporary site.\n- 4. Leave **Publish to** as **New site**....\n\
    - 5. The site's **URL** field in the **Options** section will automatically remove\
    \ spaces and special characters and spaces that were entered in the **Site Name**\
    \ field to create a suggested URL for your live temporary site. You can edit the\
    \ contents of the **URL** field to change the automatically generated URL, if\
    \ you want to.\n- 6. The **Data Centre** field selects the data centre where the\
    \ site files will be hosted. Muse will detect this automatically, but if you want\
    \ to be specific, you can choose from United States, European Union, or Australia.\n\
    \n7. If you don't live in any of these three options, you can choose the Data\
    \ Centre closest to your client's location.\n\n8. When completed, the dialog box\
    \ should look something like the following screenshot:\n\n![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_247_0.png)\n\
    \n9. Click on OK to publish your new temporary site.\n\n10. Muse will upload all\
    \ of your pages and assets, and when uploading is complete, you'll get a confirmation\
    \ message telling you that your temporary site is now hosted. Click on OK.\n\n\
    11. Your Web browser will open automatically at the temporary site address. You\
    \ will also simultaneously receive an email to your Adobe ID address congratulating\
    \ you on publishing your temporary site with a link to the temporary URL.\n\n\
    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_247_1.png)\n\nIf you want to make more\
    \ changes to your Muse site and upload them to the same location, click the Publish\
    \ link in Muse again. You'll see that the link to your temporary site is displayed\
    \ automatically below the Site Name field. Click on the link to launch your temporary\
    \ site in a new browser window and test it.\n\n![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_248_0.png)\n\
    \nThe URL of the temporary site can be copied and sent to your clients for review.\
    \ You now have an excellent opportunity to go through all of the testing we discussed\
    \ in the previous chapter. Also, you'll be testing a working, online website but\
    \ without having to worry about the general public wandering onto the site.\n\n\
    Once you've published the temporary site, the Manage link will now be available\
    \ and active. We'll use this shortly to publish the final site.\n\n## Editing\
    \ and updating a site\n\nYou have now published your site and spoken to your client,\
    \ but you may find that there are some changes required. In order to edit and\
    \ update your site, apply the following steps:\n\n- 1. Open the same .muse file\
    \ in Muse.\n- 2. You have two options now:\n  - Make changes in the existing .muse\
    \ file and then choose File | Save and click on the Publish link again.\n  - Choose\
    \ File | Save As to create a new copy of the site. Make the changes required in\
    \ the Muse workspace and then click on the Publish link again.\n\n3. You can now\
    \ publish over the existing temporary site by leaving the options as they are\
    \ in the Publish dialog box, or you can create a new temporary site. This makes\
    \ it easy for your client to compare the before and after changes.\n\n- By choosing\
    \ File | Save As, you are keeping your original site safe.\n\n4. When you've published\
    \ a temporary site, it is listed in the Publish to menu in the Publish dialog\
    \ box. You can select an existing site from the list, or choose to create a new\
    \ site.\n\n![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_249_0.png)\n\n5. You can upload\
    \ all the files, or only those that you've modified. If you have a very large\
    \ website, it's a good idea to upload only the modified files. When Muse is upgraded,\
    \ it may be a good idea to republish the entire site.\n\n6. Repeat this process\
    \ until you and the client are happy with the site. Hopefully that won't take\
    \ too many iterations.\n\n## Upgrading and launching\n\nThe final steps involve\
    \ \"upgrading\" your site and publishing it. When you get to this stage, you will\
    \ need to pay for hosting fees. You will also need to register a domain name for\
    \ your site and this is done through a third party.\n\n## Register a domain name\n\
    \nYou will need to contact a domain registrar in order to buy the domain name\
    \ that you want to use for your website. There are many sites offering this service\
    \ online and you should be able to buy a .com domain for less than $10 online.\
    \ Buying a domain name is very straightforward and is generally completed very\
    \ quickly. We will return to the domain registrar after we complete a few more\
    \ steps.\n\n## Upgrade to a published site\n\nThe following steps will tell you\
    \ how to upgrade your site and publish it:\n\n- 1. In Muse, with your previously\
    \ published temporary site open, click on the Manage link. The Manage link is\
    \ only available once you've published your temporary site.\n\n- 2. After clicking\
    \ on the Manage link, the Business Catalyst admin console opens in your Web browser\
    \ window. You'll see the Dashboard where you can manage your Muse sites hosted\
    \ by Business Catalyst. You'll also be able to view your site's statistics.\n\n\
    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_250_0.png)\n\n- 3. Click the **Push Site\
    \ Live** button on the **Dashboard**.\n- 4. The **Site Upgrade** window appears.\
    \ Click on **Proceed to checkout**. You'll need to enter your credit card information\
    \ to complete the upgrade.\n- 5. Leave the default settings for the first two\
    \ options:\n  - Site hosting plan: **webBasics**\n  - Billing option: **Invoice\
    \ Me Directly**\n\n![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_251_0.png)\n\n- 6.\
    \ Choose how frequently you want to be billed, fill in your credit card details\
    \ and click on **Make Payment**.\n- 7. Your credit card payment is processed instantly,\
    \ based on your selection.\n\n8. You will be returned to the Dashboard and the\
    \ Site Status is now Live.\n\n![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_252_0.png)\n\
    \n## Associating the domain name with your Muse site\n\nOur temporary site is\
    \ now upgraded and is hosted commercially by Business Catalyst. This upgrade means\
    \ that we can associate our domain with the site name we bought from the domain\
    \ registrar.\n\nBefore an upgrade from a temporary site, the site address looks\
    \ something like this:\n\n```\nhttp://my_site.businesscatalyst.com\n```\n\n(for\
    \ example, http://mywindsurfingsite.businesscatalyst.com)\n\nAfter the upgrade\
    \ and launch of a site, we can add our domain name so it looks more like this:\n\
    \n```\nhttp://my_domain_name.com\n```\n\n(for example, mywindsurfingsite.com)\n\
    \nIn this section, you'll use the interface in the Dashboard of the admin console.\n\
    \n- 1. Click on the option in the Dashboard and then click on Add a domain.\n\n\
    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_252_1.png)\n\n- 2. When the **Site Domains**\
    \ dialog box appears, click on the **New Domain** option.\n- 3. Type in the domain\
    \ name you registered in the **Domain** field. Do not include the www. prefix\
    \ before the domain name, but do include the domain's extension (such as, .com,\
    \ .org, or others); for example: `my_domain_name.com`.\n- 4. Select the **Home\
    \ Page** on the **Start Page** menu. Set the **Country** and **Culture** for the\
    \ site. Leave all other default settings and click on **Save**.\n\n![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_253_0.png)\n\
    \n- 5. You'll see a confirmation message. Click on **Close** to close the **Add\
    \ a New Domain** dialog box and return to the admin console. Your domain name\
    \ that you added to the site is now listed.\n- 6. Click the **Dashboard** link\
    \ in the left sidebar to return to the **Dashboard**.\n- 7. In the **Domains**\
    \ section, the domain name you entered is now listed.\n\n## Re-delegating your\
    \ domain name\n\nYou are nearly there. There is only one more thing to do and\
    \ that's re-delegating your domain name. This just means making sure that when\
    \ you type in your domain name in the browser, it goes to the right place.\n\n\
    Unfortunately, this is not something you can do either through Muse or through\
    \ the **Business Catalyst** dashboard. Here's how to do it:\n\n- 1. Go to the\
    \ website of the registrar that you bought your domain from.\n- 2. Most registrars\
    \ have a Control Panel which you can use to re-delegate your domain. You'll need\
    \ a username and password supplied to you by the registrar.\n"
  mdcn: "\n\n当你发布一个站点时，它会自动采用项目开始时使用的站点名称，并加上 Business Catalyst 域名。例如，我们的冲浪站点临时站点的\
    \ URL 将如下所示：\n\n```\nhttp://windsurfing.businesscatalyst.com\n```\n\n请记住，这只是临时的，因此当你准备进行最终站点发布时，你可以为其分配你选择的域名。以下步骤需要在\
    \ Muse 中发布临时站点时执行：\n\n- 1. 点击 Muse 工作区顶部 **Publish** 链接。\n- 2. **Publish** 对话框出现。在\
    \ **Site Name** 字段中输入临时站点的名称。这应该是一个描述性的名称，有助于你识别站点。例如，你可以输入 My windsurfing site。\n\
    \n![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_246_0.png)\n\n- 3. 如果尚未显示，点击 **Options**\
    \ 链接以查看临时站点的更多选项。\n- 4. 将 **Publish to** 保留为 **New site**....\n- 5. **Options**\
    \ 部分中的站点 **URL** 字段将自动删除在 **Site Name** 字段中输入的空格和特殊字符，并为你的实时临时站点创建一个建议的 URL。如果你愿意，可以编辑\
    \ **URL** 字段的内容来更改自动生成的 URL。\n- 6. **Data Centre** 字段选择站点文件将被托管的数据中心。Muse 会自动检测此项，但如果你想指定，可以从美国、欧盟或澳大利亚中选择。\n\
    \n7. 如果你不住在这三个选项中的任何一个，你可以选择离你客户位置最近的数据中心。\n\n8. 完成后，对话框应如下所示的屏幕截图：\n\n![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_247_0.png)\n\
    \n9. 点击 OK 发布你的新临时站点。\n\n10. Muse 将上传你的所有页面和资源，上传完成后，你会收到一条确认消息，告知你的临时站点现已托管。点击\
    \ OK。\n\n11. 你的 Web 浏览器将自动在临时站点地址打开。你同时也会收到一封发送到你的 Adobe ID 地址的电子邮件，祝贺你发布了临时站点，并附带临时\
    \ URL 的链接。\n\n![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_247_1.png)\n\n如果你想对 Muse\
    \ 站点进行更多更改并上传到同一位置，再次点击 Muse 中的 Publish 链接。你会看到临时站点的链接会自动显示在 Site Name 字段下方。点击该链接在新的浏览器窗口中启动你的临时站点并测试它。\n\
    \n![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_248_0.png)\n\n临时站点的 URL 可以复制并发送给你的客户以供审阅。你现在有了一个绝佳的机会，可以通过我们之前章节讨论的所有测试进行检查。而且，你将测试一个正在运行的在线网站，但无需担心公众会误入该站点。\n\
    \n一旦你发布了临时站点，Manage 链接现在将可用并处于活动状态。我们稍后将使用它来发布最终站点。\n\n## 编辑和更新站点\n\n你现在已经发布了站点并与客户进行了沟通，但你可能会发现需要进行一些更改。为了编辑和更新你的站点，请应用以下步骤：\n\
    \n- 1. 在 Muse 中打开同一个 .muse 文件。\n- 2. 你现在有两个选项：\n  - 在现有的 .muse 文件中进行更改，然后选择 File\
    \ | Save 并再次点击 Publish 链接。\n  - 选择 File | Save As 创建站点的副本。在 Muse 工作区中进行所需的更改，然后再次点击\
    \ Publish 链接。\n\n3. 你现在可以通过在 Publish 对话框中保持选项不变来覆盖现有的临时站点，也可以创建一个新的临时站点。这使得你的客户可以轻松比较更改前后的情况。\n\
    \n- 通过选择 File | Save As，你可以确保原始站点安全。\n\n4. 当你发布临时站点时，它会在 Publish 对话框中的 Publish\
    \ to 菜单中列出。你可以从列表中选择现有站点，也可以选择创建新站点。\n\n![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_249_0.png)\n\
    \n5. 你可以上传所有文件，或仅上传已修改的文件。如果你的网站非常庞大，最好只上传修改过的文件。当 Muse 升级时，最好重新发布整个站点。\n\n6.\
    \ 重复此过程，直到你和客户对站点满意为止。希望这不会花费太多迭代。\n\n## 升级和发布\n\n最后的步骤涉及“升级”你的站点并发布它。当你到达此阶段时，你需要支付托管费用。你还需要为你的站点注册一个域名，这需要通过第三方完成。\n\
    \n## 注册域名\n\n你需要联系域名注册商以购买你想要用于网站的域名。网上有许多提供此服务的网站，你应该能够以不到 10 美元的价格在线购买 .com\
    \ 域名。购买域名非常简单，通常会很快完成。我们将在完成更多步骤后返回域名注册商。\n\n## 升级为已发布站点\n\n以下步骤将告诉你如何升级站点并发布它：\n\
    \n- 1. 在 Muse 中，使用你之前发布的临时站点打开，点击 Manage 链接。Manage 链接只有在你发布临时站点后才可用。\n\n- 2. 点击\
    \ Manage 链接后，Business Catalyst 管理控制台将在你的 Web 浏览器窗口中打开。你将看到 Dashboard，在这里你可以管理由\
    \ Business Catalyst 托管的 Muse 站点。你还将能够查看站点的统计信息。\n\n![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_250_0.png)\n\
    \n- 3. 点击 **Dashboard** 上的 **Push Site Live** 按钮。\n- 4. **Site Upgrade** 窗口出现。点击\
    \ **Proceed to checkout**。你需要输入信用卡信息以完成升级。\n- 5. 保留前两个选项的默认设置：\n  - Site hosting\
    \ plan: **webBasics**\n  - Billing option: **Invoice Me Directly**\n\n![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_251_0.png)\n\
    \n- 6. 选择你希望计费的频率，填写你的信用卡详细信息并点击 **Make Payment**。\n- 7. 你的信用卡付款将根据你的选择立即处理。\n\
    \n8. 你将被返回到 Dashboard，站点状态现在为 Live。\n\n![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_252_0.png)\n\
    \n## 将域名与你的 Muse 站点关联\n\n我们的临时站点现在已升级并由 Business Catalyst 商业托管。此次升级意味着我们可以将从域名注册商购买的域名与站点名称关联。\n\
    \n在从临时站点升级之前，站点地址看起来像这样：\n\n```\nhttp://my_site.businesscatalyst.com\n```\n\n\
    例如，http://mywindsurfingsite.businesscatalyst.com\n\n在站点升级和发布后，我们可以添加我们的域名，使其看起来更像这样：\n\
    \n```\nhttp://my_domain_name.com\n```\n\n例如，mywindsurfingsite.com\n\n在本节中，你将使用管理控制台\
    \ Dashboard 中的界面。\n\n- 1. 点击 Dashboard 中的选项，然后点击 Add a domain。\n\n![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_252_1.png)\n\
    \n- 2. 当 **Site Domains** 对话框出现时，点击 **New Domain** 选项。\n- 3. 在 **Domain** 字段中输入你注册的域名。不要在域名前包含\
    \ www. 前缀，但要包含域名的扩展名（如 .com、.org 或其他）；例如：`my_domain_name.com`。\n- 4. 在 **Start\
    \ Page** 菜单上选择 **Home Page**。为站点设置 **Country** 和 **Culture**。保留所有其他默认设置并点击 **Save**。\n\
    \n![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_253_0.png)\n\n- 5. 你会看到一条确认消息。点击 **Close**\
    \ 关闭 **Add a New Domain** 对话框并返回管理控制台。你添加到站点的域名现在已列出。\n- 6. 点击左侧边栏中的 **Dashboard**\
    \ 链接返回到 **Dashboard**。\n- 7. 在 **Domains** 部分，你输入的域名现在已列出。\n\n## 重新委派你的域名\n\n\
    你几乎完成了。只剩下最后一件事，那就是重新委派你的域名。这只是意味着确保当你在浏览器中输入你的域名时，它会转到正确的位置。\n\n不幸的是，这不是你可以通过\
    \ Muse 或通过 **Business Catalyst** 仪表板完成的事情。操作方法如下：\n\n- 1. 前往你购买域名的注册商的网站。\n- 2.\
    \ 大多数注册商都有一个控制面板，你可以使用它来重新委派你的域名。你需要注册商提供的用户名和密码。\n\n"
