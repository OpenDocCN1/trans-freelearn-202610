    You can also publish your Muse-built website temporarily to Adobe Business Catalyst
    at no charge for a 30-day trial period. This allows you to send a live URL to
    your client for review. All sites in trial mode on Business Catalyst will include
    the Business Catalyst domain, for example, http://mysite.businesscatalyst.com.
    If you decide at a later stage to take the site "live" by paying for the monthly
