    +   - **Auto Play**: This option creates a slideshow requiring no user interaction.

    +   - **Hide All Initially**: This option hides all target areas when the page
    is first loaded. In order to see the content, the user needs to click on the trigger.

    +   - **Parts**: If you want to add extra user interactivity, you can use these
    options to show previous, next, or close buttons with the widget.

    +   - **Show Lightbox Parts While Editing**: If you choose the **Lightbox** option
    under **Position**, you can then hide or display the contents of the target area
    while editing in the **Design** view.

    +   - **Show All in Design Mode**: This option lets you display all target content
    areas at the same time when working in the **Design** view. By default this option
    is deselected, meaning only the target content of the selected trigger element
    appears in the **Design** view.


    # Another way to create triggers and targets with multiple images


    In the previous example, we manually added images first to the trigger and then
    to the target area. We set each trigger and target individually. There is another
    way to add multiple images simultaneously to the target area and Muse automatically
    creates the corresponding trigger elements for you using the following steps:


    +   1. In the **Design** view, add a new blank **Composition** widget to the page.

    +   2. Click on the **Composition** widget once to select the entire widget.

    +   3. Click again to select the large target area.

    +   4. Choose **File | Place**.

    +   5. Select the multiple images you want to place. Hold down the *Ctrl* (Windows)/*Cmd*
    (Mac OS) key to select multiple images from the folder.

    +   6. Click on **Select** (Windows) or **Open** (Mac OS).'
  - '[PAGE 209]


    7. Place the image group by clicking inside the target''s content area as shown
    in the following screenshot. Muse automatically adds trigger elements for each
    image:


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_209_0.png)


    8. Unfortunately, it doesn''t add the corresponding images to the thumbnail trigger.
    If you want to do that, then select each trigger element and place images that
    match the corresponding target areas to create thumbnail image triggers.


    # Slideshow widgets


    The Slideshow widgets work in a very similar fashion to the Composition widgets,
    the main difference being the Slideshow widgets work exclusively with images while
    the Composition widgets can work with any type of content. The types of Slideshow
    widgets available in the Widgets Library menu are:


    +   - Basic: The Basic Slideshow widget consists of a large content area, surrounded
    by a dark gray border. Underneath the content area there is a caption area, the
    number of slides or images which make up the slideshow, and a next and previous
    button. When you drag out the widget, it comes preloaded with three slides.'
  - '[PAGE 210]


    +   - **Blank**: The **Blank Slideshow** widget is similar to the **Basic Slideshow**
    widget except that it is empty when you drag-and-drop the widget out onto the
    page.

    +   - **Lightbox**: The **Lightbox Slideshow** widget dims the rest of the page
    while the gallery element being displayed is active. This is a very popular type
    of slideshow on the web as it keeps the visitor''s focus on the gallery element
    while reducing other distractions on the page.

    +   - **Thumbnails**: The **Thumbnails Slideshow** widget shows thumbnails, which
    by default are positioned to the left of the larger content area. As the user
    clicks on the thumbnail, the image becomes bigger.


    The following screenshot shows the different types of slideshows:


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_210_0.png)


    Like the other widgets in Muse, the Slideshow widgets are completely editable
    and customizable.'
  md: "\n## Creating a simple photo gallery using a blank composition\n\nWe'll create\
    \ a photo gallery consisting of three images. With a blank composition, we \"\
    tell\" Muse which trigger matches up to the large image that will appear in the\
    \ target area. Perform the following steps to create a simple photo gallery:\n\
    \n- 1. Open your page in the Design view and drag out the Blank composition widget\
    \ from the Widget Library menu.\n- 2. Click on the Composition widget once to\
    \ select the entire widget. You can now position it anywhere you want on the page.\n\
    - 3. Click on the first light-gray trigger thumbnail under the target area to\
    \ select it.\n- 4. Click on the Fill link on the Control bar. From the drop-down\
    \ menu, click on the Image icon and browse to choose the first Windsurfing image\
    \ in the Composite Widgets Images panel. Set the Fitting to Scale To Fill, as\
    \ shown in the following screenshot:\n\n![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_204_0.png)\n\
    \nNotice that the thumbnails in the list of states in the States widget are now\
    \ all the same. If you want to create a rollover effect, you could click on the\
    \ Rollover state in this widget and then change the image as we did previously.\
    \ For this example, we are keeping everything nice and simple, so we'll use the\
    \ same thumbnail for all four available states.\n\n- 5. Add two more thumbnail\
    \ images to the remaining triggers by repeating step 4. Choose the images from\
    \ the Composition Widgets Image folder.\n- 6. If you want to add additional thumbnails,\
    \ click the plus (+) icon that appears to the right of the trigger elements. If\
    \ you want to remove a trigger, select it and press Delete on your computer's\
    \ keyboard.\n\n## Add content to a target area\n\nOur next step is to add the\
    \ larger images to the target area using the following steps so that when we click\
    \ on the thumbnail the correct image appears:\n\n- 1. In the Design view, click\
    \ on the Composition widget once again to select the entire widget.\n- 2. Click\
    \ once on the first thumbnail to select the trigger.\n- 3. Click on the larger\
    \ content area to select it. By clicking first on the trigger and then on the\
    \ target, we are telling Muse that these two are linked.\n- 4. With the content\
    \ area selected, click on the drop-down Fill menu and add the first image. Once\
    \ again, set Fitting to Scale To Fill.\n\n> In this example, we're adding an image,\
    \ but you can add any type of content that you like to the target.\n\n5. Repeat\
    \ steps 1 to 4 to add content to the target for the second and third thumbnails.\
    \ When you've added the images to both trigger and target, it should look like\
    \ the following screenshot:\n\n![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_206_0.png)\n\
    \n6. Test your photo gallery in the Preview view and make sure that your large\
    \ image matches up with your thumbnail image.\n\n> You can change the size of\
    \ each thumbnail and each target area individually. Simply click once to select\
    \ the entire widget, click once again to select either a trigger (thumbnail) or\
    \ a target. Once the element is selected, a bounding box appears with handles\
    \ in each corner. Dragging on the handles allows you to resize the element.\n\n\
    ## Changing Composition widget options\n\nEach Composition widget offers several\
    \ options for setting up how the widget functions. To get to the options, click\
    \ on the editing options icon—the blue arrow. In the following list, you'll find\
    \ an explanation of each option available for the blank composition we've just\
    \ added to our page:\n\n- **Position**: This sets up where the target area is\
    \ positioned on the page. By choosing **Stacked**, all of the content is overlapped,\
    \ such as the target content appears in the same place on the web page. By choosing\
    \ **Scattered**, it lets you position each target container in a different location\
    \ on the page. Choosing **Lightbox** dims the rest of your web page and puts the\
    \ focus on your target content.\n\n- **Event**: We can choose to change the content\
    \ in the target area when the user clicks on the thumbnail – **On Click** or when\
    \ the user rolls their mouse over the thumbnail – **On Rollover**, as shown in\
    \ the following screenshot:\n\n![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_207_0.png)\n\
    \n- **Transition**: We can specify how the content changes when the trigger is\
    \ clicked or rolled over. The choices of animated transitions are:\n\n  - **Fading**:\
    \ This fades in the new target content while simultaneously fading out the previous\
    \ target.\n  - **Horizontal**: This slides the new target content in, with a horizontal\
    \ sliding motion.\n  - **Vertical**: This slides the new target content in, with\
    \ a vertical sliding effect.\n  - **Speed**: The choices here specify the speed\
    \ of the transition. If you want an instant transition, select **None**.\n\n-\
    \ **Auto Play**: This option creates a slideshow requiring no user interaction.\n\
    - **Hide All Initially**: This option hides all target areas when the page is\
    \ first loaded. In order to see the content, the user needs to click on the trigger.\n\
    - **Parts**: If you want to add extra user interactivity, you can use these options\
    \ to show previous, next, or close buttons with the widget.\n- **Show Lightbox\
    \ Parts While Editing**: If you choose the **Lightbox** option under **Position**,\
    \ you can then hide or display the contents of the target area while editing in\
    \ the **Design** view.\n- **Show All in Design Mode**: This option lets you display\
    \ all target content areas at the same time when working in the **Design** view.\
    \ By default this option is deselected, meaning only the target content of the\
    \ selected trigger element appears in the **Design** view.\n\n## Another way to\
    \ create triggers and targets with multiple images\n\nIn the previous example,\
    \ we manually added images first to the trigger and then to the target area. We\
    \ set each trigger and target individually. There is another way to add multiple\
    \ images simultaneously to the target area and Muse automatically creates the\
    \ corresponding trigger elements for you using the following steps:\n\n- 1. In\
    \ the **Design** view, add a new blank **Composition** widget to the page.\n-\
    \ 2. Click on the **Composition** widget once to select the entire widget.\n-\
    \ 3. Click again to select the large target area.\n- 4. Choose **File | Place**.\n\
    - 5. Select the multiple images you want to place. Hold down the *Ctrl* (Windows)/*Cmd*\
    \ (Mac OS) key to select multiple images from the folder.\n- 6. Click on **Select**\
    \ (Windows) or **Open** (Mac OS).\n\n7. Place the image group by clicking inside\
    \ the target's content area as shown in the following screenshot. Muse automatically\
    \ adds trigger elements for each image:\n\n![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_209_0.png)\n\
    \n8. Unfortunately, it doesn't add the corresponding images to the thumbnail trigger.\
    \ If you want to do that, then select each trigger element and place images that\
    \ match the corresponding target areas to create thumbnail image triggers.\n\n\
    ## Slideshow widgets\n\nThe Slideshow widgets work in a very similar fashion to\
    \ the Composition widgets, the main difference being the Slideshow widgets work\
    \ exclusively with images while the Composition widgets can work with any type\
    \ of content. The types of Slideshow widgets available in the Widgets Library\
    \ menu are:\n\n- **Basic**: The Basic Slideshow widget consists of a large content\
    \ area, surrounded by a dark gray border. Underneath the content area there is\
    \ a caption area, the number of slides or images which make up the slideshow,\
    \ and a next and previous button. When you drag out the widget, it comes preloaded\
    \ with three slides.\n\n- **Blank**: The **Blank Slideshow** widget is similar\
    \ to the **Basic Slideshow** widget except that it is empty when you drag-and-drop\
    \ the widget out onto the page.\n- **Lightbox**: The **Lightbox Slideshow** widget\
    \ dims the rest of the page while the gallery element being displayed is active.\
    \ This is a very popular type of slideshow on the web as it keeps the visitor's\
    \ focus on the gallery element while reducing other distractions on the page.\n\
    - **Thumbnails**: The **Thumbnails Slideshow** widget shows thumbnails, which\
    \ by default are positioned to the left of the larger content area. As the user\
    \ clicks on the thumbnail, the image becomes bigger.\n\nThe following screenshot\
    \ shows the different types of slideshows:\n\n![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_210_0.png)\n\
    \nLike the other widgets in Muse, the Slideshow widgets are completely editable\
    \ and customizable.\n"
  mdcn: "\n\n## 使用空白合成创建简单的照片库\n\n我们将创建一个由三张图片组成的照片库。使用空白合成，我们可以“告诉” Muse 哪个触发器对应于目标区域中出现的较大图像。按照以下步骤创建简单的照片库：\n\
    \n- 1. 在设计视图中打开页面，并从部件库菜单中拖出空白合成部件。\n- 2. 单击一次合成部件以选择整个部件。现在你可以将其放置在页面上的任何位置。\n\
    - 3. 单击目标区域下方的第一个浅灰色触发器缩略图以选择它。\n- 4. 单击控制栏上的填充链接。从下拉菜单中，单击图像图标并浏览以在合成部件图像面板中选择第一个冲浪图像。将适配设置为缩放以填充，如以下屏幕截图所示：\n\
    \n![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_204_0.png)\n\n请注意，状态部件中状态列表中的缩略图现在都相同了。如果你想创建悬停效果，可以单击该部件中的悬停状态，然后像之前那样更改图像。对于本示例，我们保持一切简单，因此我们将对所有四个可用状态使用相同的缩略图。\n\
    \n- 5. 通过重复步骤 4 向剩余的触发器添加另外两个缩略图图像。从合成部件图像文件夹中选择图像。\n- 6. 如果你想添加额外的缩略图，单击触发器元素右侧出现的加号\
    \ (+) 图标。如果你想删除一个触发器，选择它并按下计算机键盘上的 Delete 键。\n\n## 向目标区域添加内容\n\n我们的下一步是使用以下步骤将较大的图像添加到目标区域，这样当我们单击缩略图时，正确的图像就会出现：\n\
    \n- 1. 在设计视图中，再次单击一次合成部件以选择整个部件。\n- 2. 单击一次第一个缩略图以选择触发器。\n- 3. 单击较大的内容区域以选择它。通过先单击触发器然后单击目标，我们是在告诉\
    \ Muse 这两者是关联的。\n- 4. 在内容区域被选中的情况下，单击下拉填充菜单并添加第一张图像。再次将适配设置为缩放以填充。\n\n> 在本示例中，我们添加的是图像，但你可以向目标中添加任何类型的你喜欢的内容。\n\
    \n5. 重复步骤 1 到 4 为第二个和第三个缩略图的目标添加内容。当你将图像添加到触发器和目标后，它应该看起来像以下屏幕截图：\n\n![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_206_0.png)\n\
    \n6. 在预览视图中测试你的照片库，并确保大图像与缩略图图像匹配。\n\n> 你可以单独更改每个缩略图和每个目标区域的大小。只需单击一次以选择整个部件，再次单击以选择触发器（缩略图）或目标。一旦元素被选中，一个带有角落手柄的边界框就会出现。拖动手柄可以调整元素大小。\n\
    \n## 更改合成部件选项\n\n每个合成部件都提供多个设置部件功能方式的选项。要访问选项，请单击编辑选项图标——蓝色箭头。在下面的列表中，你将找到我们刚刚添加到页面上的空白合成可用的每个选项的说明：\n\
    \n- **位置**：这设置目标区域在页面上的位置。通过选择**堆叠**，所有内容都会重叠，例如目标内容出现在网页的同一位置。通过选择**分散**，可以让你将每个目标容器放置在页面上的不同位置。选择**灯箱**会使网页的其余部分变暗并将焦点放在目标内容上。\n\
    \n- **事件**：我们可以选择在用户单击缩略图时更改目标区域中的内容 – **单击时** 或在用户将鼠标悬停在缩略图上时 – **悬停时**，如以下屏幕截图所示：\n\
    \n![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_207_0.png)\n\n- **过渡**：我们可以指定在触发器被单击或悬停时内容如何变化。动画过渡的选项有：\n\
    \n  - **淡入淡出**：这会在同时淡出之前目标的同时淡入新的目标内容。\n  - **水平**：这会使新的目标内容以水平滑动的方式滑入。\n  - **垂直**：这会使新的目标内容以垂直滑动效果滑入。\n\
    \  - **速度**：这里的选项指定过渡的速度。如果你想要即时过渡，请选择**无**。\n\n- **自动播放**：此选项创建无需用户交互的幻灯片。\n\
    - **初始隐藏全部**：此选项在页面首次加载时隐藏所有目标区域。为了查看内容，用户需要单击触发器。\n- **部件**：如果你想添加额外的用户交互，可以使用这些选项在部件中显示上一个、下一个或关闭按钮。\n\
    - **编辑时显示灯箱部件**：如果你在**位置**下选择了**灯箱**选项，你就可以在**设计**视图中编辑时隐藏或显示目标区域的内容。\n- **设计模式下显示全部**：此选项让你在**设计**视图中同时显示所有目标内容区域。默认情况下此选项未选中，意味着在**设计**视图中只显示所选触发器元素的目标内容。\n\
    \n## 使用多张图片创建触发器和目标的另一种方法\n\n在之前的示例中，我们手动先将图像添加到触发器，然后添加到目标区域。我们单独设置每个触发器和目标。还有另一种方法可以同时向目标区域添加多张图像，Muse\
    \ 会自动为你创建相应的触发器元素，按以下步骤操作：\n\n- 1. 在**设计**视图中，将一个新的空白**合成**部件添加到页面。\n- 2. 单击一次**合成**部件以选择整个部件。\n\
    - 3. 再次单击以选择较大的目标区域。\n- 4. 选择**文件 | 放置**。\n- 5. 选择你想要放置的多个图像。按住 *Ctrl*（Windows）/*Cmd*（Mac\
    \ OS）键以从文件夹中选择多个图像。\n- 6. 单击**选择**（Windows）或**打开**（Mac OS）。\n\n7. 通过单击目标的内容区域内放置图像组，如以下屏幕截图所示。Muse\
    \ 会自动为每张图像添加触发器元素：\n\n![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_209_0.png)\n\n\
    8. 不幸的是，它不会将相应的图像添加到缩略图触发器中。如果你想这样做，那么选择每个触发器元素并放置与对应目标区域匹配的图像以创建缩略图图像触发器。\n\n\
    ## 幻灯片部件\n\n幻灯片部件的工作方式与合成部件非常相似，主要区别在于幻灯片部件专门用于图像，而合成部件可以处理任何类型的内容。部件库菜单中可用的幻灯片部件类型有：\n\
    \n- **基础**：基础幻灯片部件由一个大内容区域组成，四周环绕着深灰色边框。在内容区域下方有标题区域、幻灯片或图像的数量以及下一个和上一个按钮。当你拖出部件时，它预装了三张幻灯片。\n\
    \n- **空白**：**空白幻灯片**部件与**基础幻灯片**部件类似，只是当你将其拖放到页面上时它是空的。\n- **灯箱**：**灯箱幻灯片**部件会在画廊元素处于活动状态时使页面的其余部分变暗。这是网络上非常流行的一种幻灯片类型，因为它使访客的注意力集中在画廊元素上，同时减少了页面上的其他干扰。\n\
    - **缩略图**：**缩略图幻灯片**部件显示缩略图，默认情况下缩略图位于较大内容区域的左侧。随着用户单击缩略图，图像会变大。\n\n以下屏幕截图显示了不同类型的幻灯片：\n\
    \n![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_210_0.png)\n\n与 Muse 中的其他部件一样，幻灯片部件完全可编辑和可定制。\n\
    \n"
