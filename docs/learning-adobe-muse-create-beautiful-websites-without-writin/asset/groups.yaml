    +   - **The x-height**: Based on traditional printing methods, the x-height is
    the height of the lowercase letter x. However, as a general rule, the x-height
    can be described as the height of lowercase letters in a font excluding the ascenders
    and descenders.


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_134_1.png)


    The x-height can vary quite a bit from font to font. The x-height gives the overall
    impression of the font''s size. In the following illustration, all of the text
    is set to a point size of 21, but as you can see, each word looks quite different
    in height and weight.


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_134_2.png)


    +   - **The Ascender**: This is the stem of lowercase letters (h, b, k for example)
