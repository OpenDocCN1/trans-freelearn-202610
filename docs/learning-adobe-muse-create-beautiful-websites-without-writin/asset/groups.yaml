  md: '

    When a subelement of a widget is selected, you can format the contents by changing
    the text, rectangle''s color, or background within the boundaries of the widget
    itself.


    Press the Escape key to move back up through the hierarchy of nested elements.
    You can keep pressing the Escape key until you have selected the entire widget
    again. Alternatively click anywhere else on the page to deselect all subelements
    and the entire widget.


    - 4. Select the entire widget once more. We''re going to format the widget and
    give a new look-and-feel to our navigation bar.


    ## Setting widget options


    There are several menu options available to us when working with widgets. Let''s
    have a look at them now:


    - 1. Click on the blue circle icon, to the right of the Menu Widget panel to open
    the widget''s Options menu as shown in the following screenshot:


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_187_0.png)


    2. Set Menu Type to All Pages, set Direction to Horizontal, leave Edit Together
    checked, set Item Size to Uniform Width, and leave the rest of the options as
    their default settings.


    Here''s an explanation of each option:


    - - Menu Type: This specifies which items the Muse will use to build the menu.
    Choosing Top Level Pages means a menu item for each page on the top level of your
    site plan will appear. Choosing All Pages means a menu item for each page on the
    top level of your site plan, as well as submenu items for any child pages will
    appear. Manual menu types allow you to add menu items manually in the Design view.

    - - Menu Direction: This lets you pick either horizontal or vertical orientation
    for your menu.

    - - Edit Together: When the Edit Together option is selected, any changes that
    you make will be applied to all items in the Menu Bar widget. Deselect this option
    to make changes to the Menu Bar items individually.

    - - Item Size: The options here let you specify the type of width for the menu
    items. Fit Width sets rectangles for each menu item that are only large enough
    to contain their respective words. Uniform Width creates menu items of uniform
    size, based on the largest word in the menu bar.

    - - Left Icon: Checking this box sets up an image frame to the left of each menu
    item. You can change the icon in the image frame by using Fill and Stroke or by
    adding a background image to it. When unchecked, the image frame is not displayed.

    - - Label: When checked, the menu items label are displayed. When disabled, the
    labels are not displayed. The label is the page name of the linked button.

    - - Right Icon: This works in the same way as the Left Icon, except that the image
    frame appears to the right of the menu item that is displayed. When disabled,
    the icon is not displayed.

    - - Parts Positioning: This lets you specify the horizontal and vertical alignment
    of the menu items.


    3. With the entire widget still selected, click on the Spacing tab. If it''s not
    visible, choose Window | Spacing. Add padding to the left and right and increase
    the size of the Gutter. The Gutter is the space between each menu item. On the
    Control Panel set the Fill color to None. The following screenshot shows how the
    changes in the Spacing panel makes the menu look:


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_189_0.png)


    ## Formatting each menu item


    Now that we''ve made changes to the widget container, we need to select a menu
    item to change the background color as the current dark gray gradient is a background
    image on the menu item.


    - 1. With the widget container selected, click once more on any of the menu items.
    We''ve now drilled down a level. You''ll notice on the Control Panel, that the
    Selector changes to Menu Item. You''ll also see that the Fill for the menu item
    is set to dark gray.


    2. Click on the word Fill and from the drop-down menu, set the Fill Type to Solid,
    and from the Color Swatch picker select None. This removes the background color:


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_190_0.png)


    3. Select the Text tool, set the Font Family to Arial, Bold, and Size to 14. Set
    the Colour to #174C78. Because we set the Menu Widget options earlier to Edit
    Together, all of the menu items change together.


    ## Adding states


    We can use the States panel to format the appearance of the links in the widget
    as a visitor interacts with them.


    - 1. With the menu item still selected, click on the States panel.

    - You''ll see four states listed:

    - - Normal: how the link looks when the page loads

    - - Rollover: how the link looks when the mouse is rolled over it

    - - Mouse Down: how the link looks when it is clicked

    - - Active: how the link looks on the current page


    We''ve already set up the Normal state, next we''ll work on the Rollover state.


    - 2. Click on the Rollover state in the States panel and make changes to the background
    color and text color of the menu item. Set the background color to bright blue,
    the text color to white, remove any stroke, and set Corners to 15, as shown in
    the following screenshot:


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_191_0.png)


    3. Repeat the previous step for the Mouse Down and Active states. Make each of
    the states look slightly different from each other. The point here is to provide
    visual feedback to website visitors. The following screenshot shows the Mouse
    Down and Active states:


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_192_0.png)


    4. We need to test that our menu is working. Because we applied it to a Master
    Page, it should now appear on all of our pages with that master applied. Click
    on the Preview view and test your menu system to see how each state works. You
    should be able to click through each page in your site.


    5. The Gear page has two subpages called Boards and Sails. We need to apply styles
    to the submenu for these pages. Open up the Master Page again and click once on
    the menu bar to select it, and once more on Gear to select that individual menu
    item. This will reveal the submenu items.


    6. Click once on the Sails submenu item. The concept here is exactly the same
    as with the top-level menu items. We can set up four states for each submenu item.
    Notice that the Boards item changes style even though the Sails item is selected
    in the following screenshot. Again this happens because we chose Edit Together
    as an option in the Menu options:


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_193_0.png)


    7. Apply a style for each state. Use the blue, navy, and white colors we''ve worked
    with so far, to maintain consistency.


    8. Test your menu again in the Preview view.


    ## Transferring a style


    When you''ve created a style, you can copy it and then apply it elsewhere. Let''s
    say for example, that you wanted to repeat the look-and-feel of the menu we''ve
    created at the top of our page, with a similar menu in the footer of the page.
    Here''s how we do it:


    When you have styled the appearance of a widget, make sure the styled widget is
    selected first, then right-click (or Ctrl + click) on the unstyled widget, and
    choose Transfer Widget Skin from the context menu that appears, as shown in the
    following screenshot. Within a second or two, the new menu will be styled in exactly
    the same way as the first menu:


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_194_0.png)


    ## Horizontal menus


    Everything we''ve looked at in relation to a Bar Menu is also applicable to Horizontal
    and Vertical menus.


    To create a horizontal menu, simply click-and-drag it out from the Menus section
    in the Widgets Library panel. Once the menu is on the page, you can style it using
    the same options as the Bar Menu.


    ## Vertical menus


    To create a Vertical menu, click-and-drag it out from the Menus section in the
    Widgets Library panel. The obvious difference here is that the menu item appears
    one under the other. The submenus fly out horizontally, as shown in the following
    screenshot:


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_194_1.png)


    ## Accordion panels


    Next on our list of widgets is the Accordion panel. This consists of several panels
    stacked on top of one another. When the website visitor clicks on the Accordion
    tab, that tab opens a larger panel displaying the content.


    This widget allows us to display a lot of text in a small area and adds interactivity
    to our website.


    ## Adding a panel


    Perform the following steps to add a panel:


    - 1. Open the Boards page in the Design view.


    - 2. On the Widgets Library panel, click-and-drag out an Accordion widget. Drop
    it underneath the Boards heading.


    - 3. Drag the right side of the panel to a width of approximately 500 pixels.
    You can set the width precisely by selecting the Accordion panel and then fill
    in the width field on the Control Panel, as shown in the following screenshot:


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_195_0.png)


    - 4. Click on the plus (+) icon that appears at the bottom of the widget. This
    adds another panel to the group. We now have three panels inside our widget.


    - 5. Click on the first panel''s name – currently Lorem 1. Using the Text tool,
    change the text to read Freeride.

