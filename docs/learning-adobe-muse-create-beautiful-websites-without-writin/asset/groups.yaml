  - '[PAGE 32]


    # Panels


    Panels give us speedy access to additional tools and features. By default, the
    panels sit together in a dock on the right-hand side of the screen. This is not
    a permanent position; the panels are actually floating and are independent of
    the document window. We can customize the workspace by changing each panel''s
    location and reorganizing them to suit our own needs. In the following screenshot,
    the Swatches, Character Styles, and Spacing panels are currently active. By clicking
    on the name in any Panel tab, that particular panel becomes active. Unlike other
    Adobe software you may have used, individual panels cannot be separated; they
    are "stuck" together.


    Click on the Text tab, the Paragraph tab, and the Wrap tab in order to activate
    them.


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_32_0.png)'
  - '[PAGE 33]


    # Expanding and collapsing panels


    The panels take up a small chunk of the real estate on your screen, however, you
    may not always want them to appear fully expanded. We can reduce the amount of
    space they take up by collapsing them to show icons without names. The following
    steps show how to expand and collapse all the panels in the dock:


    +   1. Click on the double arrow to the right of the panels'' names to collapse
    the panel, as shown in the following screenshot:


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_33_0.png)


    +   2. To expand the panels, click again on the double arrow at the top of the
    icons.'
  - '[PAGE 34]


    Another way to save space is to collapse the panels so that only the tab and panel
    name are visible. To do this, perform the following steps:


    +   1. Click on the tab name. The tab itself will be highlighted but the controls
    and features in the panel will be hidden.


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_34_0.png)


    +   2. Click on the tab name a second time to expand the panel again.


    +   3. To resize a panel, drag the bottom edge of the expanded panel.


    # Hide all panels


    You may not want to see any panels while you''re working on your design. To hide
    all the panels choose Window | Hide Panels. When you''re ready, you can show them
    again by choosing Window | Show Panels.


    # Open a panel


    If you can''t see any particular panel in the panel groups, you can find a full
    list of panels under the Window menu. To open a panel that isn''t showing in the
    workspace, choose Window | Fill to open the Fill panel.


    If the panel name has a check mark under the Window menu, this means it is already
    active on the screen and that particular panel will appear highlighted in its
    panel group.


    # Rearranging panels


    To move a panel into another group, drag the panel''s tab. As you drag, you''ll
    see a ghosted version of the panel and a blue highlighted drop zone appears in
    the group, which indicates the area where you can drop the panel. You can move
    a panel up or down within the dock by dragging it to the narrow blue drop zone.'
  - '[PAGE 35]


    As an exercise, try dragging the Fill panel downwards to join the group below
    it.


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_35_0.png)


    # The document window


    The document window is the white page in the middle of your screen and this, of
    course, is where all the action happens. We can see blue guidelines indicating
    the number of columns, the gutter size, and the margins. In the following screenshot,
    we can see a setup using three columns with space between them (known as the gutter)
    and the margin around the edge of the content area:'
  - '[PAGE 36]


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_36_0.png)


    # Rulers, guides, and grids


    Rulers and guides are a designer''s best friend, whether you are working with
    print or on the Web. By default, Muse displays rulers along the top and left side
    of the workspace. As mentioned earlier, the measurement units used are pixels.
    To show or hide rulers, choose View | Show/Hide Rulers.


    Muse also displays five guides that define the page size, the header, and the
    footer. We haven''t yet defined a header and footer height so you should see guides
    with handles for dragging the top of the page, the bottom of the page, and the
    bottom of the browser.'
  - '[PAGE 37]


    When you use the mouse to hover over guides along the left side of the workspace,
    you''ll see a tool tip about the purpose and functionality of each guide.


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_37_0.png)


    The top and two bottom guides help you to determine your overall page size. If
    you want to change the size of your page without going back to the Site Properties
    dialog box, you can drag the first guide up, or the fourth guide down to extend
    the content area of your page. To show or hide page guides, choose View | Show/Hide
    Guides.


    # Header and footer guides


    The second and third guides on the page define the bottom of your header and the
    top of your footer, respectively. These guides become editable only after you
    have defined your header and footer in the master page. We''ll discuss that in
    more detail in a future chapter. On normal pages, the header and footer guides
    are displayed for visual reference, but they cannot be dragged to a new location.
    To show or hide header and footer guides, choose View | Show/Hide Header and Footer
    or Ctrl + Shift + /; Cmd + Shift + ,.


    # Grid overlay


    Many people think about web design layouts in terms of columns. Three-column and
    two-column layouts are very popular but it''s important to remember that thinking
    about rows and columns together gives us a grid — an important tool to help designers
    create elegant and attractive layouts. Muse provides a grid overlay.'
  - '[PAGE 38]


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_38_0.png)


    To show or hide the grid overlay, choose View | Show/Hide Grid Overlay or press
    Ctrl + '' / Cmd + ''.


    # Zooming


    While viewing content in the document window, it''s important that we have the
    ability to zoom in and zoom out as we work on our design.


    # Changing magnification


    There are a number of ways to change the magnification or zoom level. You can
    do any of the following:


    +   - Select the Zoom tool (Z). The cursor changes to a magnifying glass with
    a + symbol inside it. Click on the document window to zoom in at the point of
    clicking. Keep clicking to be able to zoom into a magnification of up to 4000%.

    +   - To zoom out while using the Zoom tool, hold down the Alt key (Win)/Option
    key (Mac) while clicking. The cursor will change to a magnifying glass with a
    – symbol inside it.

    +   - Choose the magnification level directly from the drop-down box beside the
    toolbar. The drop-down box offers values from 50% to 400% but you can type in
    any magnification level between 10% to 4000%.

    +   - Choose View | Zoom In or View | Zoom Out.

    +   - Use the shortcuts Ctrl + = (Win)/Cmd + = (Mac) to zoom in and Ctrl + - (Win)/Cmd
    + - (Mac) to zoom out.'
