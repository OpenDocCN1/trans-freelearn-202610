    # 9


    # More Widgets—Compositions and Slideshows


    In the previous chapter, we used Muse''s widgets to quickly and easily add a menu
    or navigation system to all our pages and to display a large quantity of text
    in a small area using an Accordion panel. In this chapter we''ll continue to work
    with widgets to add extra functionality and interactivity to our web pages.


    We''ll create an elegant slideshow using the Slideshow widget and use the Composition
    widget to create a simple photo gallery. As well as using widgets to add functionality,
    we''ll use arbitrary HTML to add interactive elements to our pages.


    By the end of this chapter you''ll know how to:


