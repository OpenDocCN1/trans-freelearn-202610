  mdcn: "\n\n3. 我们可以使用屏幕顶部的控制面板（在选择文本工具后）或文本面板来编辑文本，通过选择 Window | Text 打开文本面板，如下图所示，如果它尚未可见：\n\
    \n![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_140_0.png)\n\n以下是在两个面板中都可用的选项：\n\n\
    - **Font:** 你可以从网络安全字体列表（我们稍后会更详细地讨论网络安全字体）、网络字体或系统字体列表中选择一种字体。Muse 会将非网络安全的系统字体导出为图像。网络安全字体和网络字体在它们旁边会有一个小地球图标。如果选择需要导出的字体，则在控制面板或文本面板的字体列表中以及工作区中文本旁都会出现一个小图像图标。\n\
    - 如果你想在工作区中隐藏该图标，请选择 View | Hide Rasterized Text Frame Indicators。\n- **Font size:**\
    \ 字体大小指定字体的大小，以像素为单位。有少量预定义的大小可供选择，或者你可以通过输入数字来指定特定的字体大小。\n- **Bold/Italic/Underline:**\
    \ 使所选文本变为粗体、斜体或下划线。\n- **Align:** 将文本段落设置为左对齐、居中、右对齐和两端对齐。\n\n- **Color:** 这让你可以设置文本颜色。要选择文本颜色，可以使用吸管工具，也可以使用颜色色块选择颜色，或通过输入\
    \ RGB 值或十六进制值来选择。\n- **Letter Space:** 又称为跟踪，字母间距可以增加或减少所选文本字母之间的间距。\n- **Leading:**\
    \ 这指定了文本行上方和下方之间的空间。行距是一个段落属性，这意味着在此处所做的任何更改都会影响所选段落中的每一行。行距字段接受百分比值（字体大小的百分比）或像素值。\n\
    - **Paragraph style:** 此值让你可以选择要应用于文本的预定义段落样式。通过使用段落样式，我们可以在网站上实现一致性并加快文本格式化速度。\n\
    \n大多数情况下，我们使用段落样式，因为我们倾向于处理文本行。然而，创建可应用于单个文本字符或少量单词的字符样式也是可能的。\n\n- **Character\
    \ style:** 让你可以选择要应用于文本的预定义字符样式。\n\n仅在文本面板中可用的以下选项：\n\n- **Indent:** 让你缩进所选文本的第一行。此字段中可以使用正值和负值（减号）。\n\
    - **Links:** 让你使用预定义的链接样式为文本设置样式。\n- **Left/Right margin:** 在所选文本的左侧或右侧边距中留出空间（类似于填充）。\n\
    - **Space before/after:** 指定所选段落之前（上方）或之后（下方）的空间量。\n\n> 将正文文本导出为图像并不是一个好的做法。图像文件与\
    \ HTML 文本一样不可调整大小或选择，并且对搜索引擎不友好。导出为图像文件的文本在浏览器中查看时不可选择或调整大小。\n\nWeb Fonts 在网络安全字体之上提供了数百种额外的字体。网络字体让你可以使用未安装在访客计算机上的字体。这为我们设计师打开了一个全新的排版世界。当你选择使用网络字体时，Add\
    \ Web Fonts 对话框会打开，如下图所示，提供所有可用字体的视觉概览。网络字体由 Typekit 服务提供。\n\n![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_142_0.png)\n\
    \n## Creating and applying paragraph styles\n\n使用段落样式允许我们为较大的文本块保存一组定义或规则，然后可以快速将其应用于我们选择的任何文本块。\n\
    \n假设例如，你希望你的块引用始终看起来相同，使用 Georgia、斜体、大小 12 且颜色为红色。你将选择一些文本，应用格式然后将其保存为段落样式。然后你可以通过将其应用于页面上的其他块引用来重用该段落样式。\n\
    \n你在任何页面上创建的任何段落或字符样式都可在整个网站中使用，而不仅仅是在创建样式的页面上。让我们现在创建一个段落样式，它将定义我们主正文文本的外观：\n\
    \n- 1. 在 Design 视图中，突出显示一段文本——比如段落中的一行——然后在文本面板中设置以下值：\n  - Font: Arial\n  - Size:\
    \ 12\n  - Left Alignment\n  - Colour: Dark Navy or Hex 000090\n  - Line Spacing:\
    \ 140%\n- 2. 在段落样式面板中（如果看不到面板，请选择 Window | Paragraph Styles），点击右下角的 Create New\
    \ Styles 按钮。\n- 3. 通过双击它并在文本框中输入描述性名称来重命名新样式。在本例中将其命名为 Body Copy。\n\n![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_143_0.png)\n\
    \n![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_144_0.png)\n\n你会注意到已经列出了一些段落样式。这些是我们创建网站线框模型时在第\
    \ 3 章 Planning your Site 中创建的样式。你可以创建任意数量的样式。\n\n- 4. 若要将段落样式应用于你在 Gear 页面上放置的所有文本，请使用文本工具单击一次文本框中的任意位置，使光标在文本中闪烁。然后快速单击三次以选择文本框中的所有文本。\n\
    \n> 单击一次文本框即可在该文本框内的任何位置放置光标。双击可选择一个单词，三击可选择整行文本，四击可选择文本框中的所有文本。\n\n- 5. 现在让我们将新创建的\
    \ Body Copy 段落样式应用于我们在上一章中添加到 Learning 页面的文本。转到 Plan 视图，然后双击 Learning 页面以在 Design\
    \ 视图中打开它。\n- 6. 在 Learning 页面上，使用 Select 工具，简单地单击一次以选择页面上的文本框。\n\n7. 在选择文本框后，单击你刚刚创建的\
    \ Body Copy 样式，你会看到 Learning 页面上的文本格式立即发生变化。文本应显示与你在 Gear 页面上应用的格式相同的格式。请注意，Learning\
    \ 页面上的链接仍然是白色的。\n\n![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_145_0.png)\n\n8. 若要编辑段落样式，请在段落样式面板中选择该样式，进行编辑，然后单击面板右下角的\
    \ Redefine Selected Styles 按钮。\n\n试试看，将正文中的文本颜色更改为亮黄色。注意文本在 Learning 页面和 Gear\
    \ 页面上的颜色如何变化。尝试更改文本大小、行距和字体。当你完成实验后，将正文恢复到原始设置，并不要忘记单击段落样式面板底部的 Redefine Selected\
    \ Styles 按钮。\n\n9. 如果你想从一段文本中删除特定样式，可以选择已应用样式的文本片段，然后从段落样式面板中选择 None。\n\n## Creating\
    \ and applying character styles\n\n正如我们所见，段落样式非常适合多行或文本块，但如果我们想创建样式并仅将其应用于某些单词会怎样？这就是字符样式发挥作用的地方。使用字符样式允许我们为特定的一组字符或单词保存一组定义或规则。\n\
    \n假设例如，你想在页面上突出显示某些单词，我们是这样做的：\n\n- 1. 在 Design 视图中，在 Learning 页面上突出显示第一行中的单词\
    \ novice。然后在文本面板中设置以下值：\n  - Font: Arial\n  - Size: 12\n  - Bold and Italic\n\
    \  - Color: Bright Yellow\n- 2. 在字符样式面板中（Window | Character Styles），单击右下角的 Create\
    \ New Styles 按钮。\n- 3. 通过双击它并在文本框中输入描述性名称来重命名新样式。将其命名为 Bold Yellow。\n- 4. 现在你已创建字符样式，可以将其应用于页面上的任何其他文本。在\
    \ Learning 页面上，找到单词 Beginner 或 Beginners。突出显示该单词的每个实例并通过在字符样式面板中单击其名称来应用新样式。\n\
    - 5. 若要编辑字符样式，请在字符样式面板中选择该样式，进行更改，然后单击面板右下角的 Redefine Selected Styles 按钮。\n- 6.\
    \ 如果你想取消文本中特定字符样式的链接，请单击字符样式面板右下角的 Unlink Style 按钮。\n\n![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_146_0.png)\n\
    \n"
