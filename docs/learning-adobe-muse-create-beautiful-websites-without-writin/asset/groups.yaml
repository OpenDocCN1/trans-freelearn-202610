    ## 创建文本框


    在第 3 章《规划你的网站》中，我们在创建线框模型并添加多个矩形（包括一个文本框）来容纳占位文本时，首次接触到文本框。


    在第 4 章《强大的页面》中，我们将网站标题"Windsurf Wild"添加到主页面中，并在第 5 章《矩形的乐趣》中，我们向学习页面添加了一些文本内容。现在我们将继续向我们的冲浪网站添加文本内容。


    在 Muse 中，如果尚未打开，请通过从菜单中选择 文件 | 打开站点 或点击 Muse 欢迎页面上冲浪网站的名称来打开你的网站。


    添加文本到页面有多种方法。我们可以执行以下任何操作：


    - 绘制一个文本框然后直接在框中输入

    - 绘制一个文本框然后从其他来源复制文本，例如文字处理文档或互联网站点，并将其粘贴到文本框中

    - 通过从菜单中选择 文件 | 置入 来放置 .txt（基本文本文件）


    我们在第 4 章《强大的页面》和第 5 章《矩形的乐趣》中已经看到如何首先绘制文本框来添加文本，但对于此练习，我们将选择第三个选项，即放置文本文件以向我们的装备页面添加一些文本：


    - 1. 在计划视图中，双击装备页面以在设计视图中打开它。你会记得在上一章中，我们在此页面上添加了一个矩形来容纳图像，并调整了圆角以创建三种圆角和一个直角的混合。

    - 2. 选择 视图 | 显示参考线，以便你可以使用参考线作为对齐图像和文本的辅助。

    - 3. 选择 文件 | 置入，然后浏览到第 6 章文件夹并选择 Gear.txt。你会立即注意到你的光标发生变化以显示已加载图标——它看起来类似于附着在光标上的迷你页面。


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_138_0.png)


    4. 在 Windsurf Wild 文本下方单击，一个新的文本框将被添加，其中包含 Gear.txt 文档的内容。请注意页面会自动拉伸以容纳文本框。


    5. 在上一章中我们看到如何选择一个矩形，添加填充颜色，添加描边颜色，调整大小，添加圆角，并为其添加背景颜色。碰巧的是，文本框的行为方式相同。我们可以对文本框执行所有这些操作。


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_139_0.png)


    > 如果你在矩形顶部创建文本框，随着你在文本框中添加文本，矩形会为你自动调整大小。这确保了 Muse 创建的网页会自动垂直拉伸以适应变化。


    ## 清晰、有说服力且正确的內容


    虽然本章是关于排版的，但重要的是要提到实际内容至关重要，无论你选择什么字体。许多网站尽管设计精致度不足却能蓬勃发展，原因在于其内容出色。执行以下步骤以获得完美的内容：


    - 清晰、正确且有说服力。

    - 不要犯愚蠢的拼写错误，因为 Muse 没有拼写检查器，不要犯事实错误，也不要离题啰嗦。


    ## 编辑文本


    现在我们在装备页面上有了一些文本，让我们回去编辑它。以下步骤向我们展示如何操作：


    - 1. 在设计视图中，选择 文本 工具。

    - 2. 选择你想要更改的文本。


    '
