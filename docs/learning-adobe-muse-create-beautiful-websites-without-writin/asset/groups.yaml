    # Creating text frames


    In Chapter 3, Planning your Site, we had our first introduction to text boxes
    when we created a wireframe mock up and added a number of rectangles, including
    one text frame, to hold our dummy text.


    In Chapter 4, Powerful Pages, we added the title of our website "Windsurf Wild"
    to our master pages and in Chapter 5, The Joy of Rectangles, we added some text
    content to our Learning page. We''re going to continue adding text content to
    our windsurfing site now.


    In Muse, if it''s not already open, open your site by choosing File | Open Site
    from the menu or click on the name of your windsurfing site on the Muse Welcome
    page.


    There is more than one way to add text to our pages. We can do any of the following:


    +   - Draw a text frame and then type directly into the frame

    +   - Draw a text frame and then copy the text from another source, for example,
    a word document or from an Internet site, and paste it into the text frame

    +   - Place a .txt (basic text file) by choosing File | Place in the menu


    We''ve already seen in Chapter 4, Powerful Pages and Chapter 5, The Joy of Rectangles,
    how we can add text by firstly drawing out a text frame, but for this exercise
    we''re going to choose the third option, that is placing a text file to add some
    text to our Gear page:


    +   1. In the Plan view, double-click on the Gear page to open it in the Design
    view. You''ll recall that in the previous chapter, we added a rectangle to hold
    an image on this page and adjusted the corner radius to create a mixture of three
    rounded corners and one straight corner.

    +   2. Choose View | Show Guides so that you can use the guides as an aid for
    aligning your images and text.

    +   3. Choose File | Place, then browse to the Chapter 6 folder and choose Gear.txt.
    You''ll immediately notice that your cursor changes to show a loaded icon - it
    looks similar to a mini-page that is attached to your cursor.


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_138_0.png)'
  - '[PAGE 139]


    4. Click just beneath the Windsurf Wild text and a new text frame is added containing
    the content of the Gear.txt document. Notice that the page stretches automatically
    to accommodate the text frame.


    5. In the previous chapter we saw how we could select a rectangle, add a fill
    color, add a stroke color, resize it, add round corners, and add background colors
    to it. It just so happens that text frames behave in the same fashion. We can
    do all of these to a text frame.


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_139_0.png)


    > If you create a text frame on top of a rectangle, the rectangle will resize
    for you as you add text to the text frame. This ensures that web pages created
    by Muse automatically stretch vertically to adapt to changes.


    # Clear, compelling, and correct content


    Although this chapter is about typography, it''s important to mention that the
    actual content is vitally important, no matter what your choice of font is. Many
    websites thrive despite a lack of design finesse and the reason is that their
    content is excellent. Perform the following steps to have a perfect content:


    +   - Be clear, be correct and be compelling.

    +   - Don''t make silly spelling mistakes as Muse does not have a spell checker,
    don''t make factual errors and don''t ramble off the point.


    # Editing text


    So now that we have some text in place on the Gear page, let''s go back and edit
    it. The following steps show us how to do it:


    +   1. While in the Design view, select the Text tool.

    +   2. Select the text that you want to change.'
