    +   - **Event**: We can choose to change the content in the target area when the
    user clicks on the thumbnail – **On Click** or when the user rolls their mouse
    over the thumbnail – **On Rollover**, as shown in the following screenshot:


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_207_0.png)


    +   - **Transition**: We can specify how the content changes when the trigger
    is clicked or rolled over. The choices of animated transitions are:


    +   - **Fading**: This fades in the new target content while simultaneously fading
    out the previous target.

    +   - **Horizontal**: This slides the new target content in, with a horizontal
    sliding motion.

    +   - **Vertical**: This slides the new target content in, with a vertical sliding
    effect.

    +   - **Speed**: The choices here specify the speed of the transition. If you
    want an instant transition, select **None**.'
