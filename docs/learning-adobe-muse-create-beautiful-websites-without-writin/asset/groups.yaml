    # Adding alternative text


    It''s very important to add alternate text tags to all images on your site. It
    helps to make the site more accessible for everyone. The alternate text appears
    in the browser if an image cannot be shown and is read by screen readers. In order
    to add alternate text perform the following steps:


    +   1. Right-click or control-click the image you''ve added to the page.

    +   2. From the Context menu that appears, choose Alternate Text. The Image Properties
    dialog box opens.

    +   3. Fill in a text title and alternate text.'
