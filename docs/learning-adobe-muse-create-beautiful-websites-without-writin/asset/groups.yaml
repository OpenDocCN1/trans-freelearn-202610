    # Master pages


    Let''s look at the Master pages and how they help us create consistency across
    our website. If you''ve used Adobe InDesign or QuarkXpress before, you will be
    familiar with the concept. Page consistency is critical for multiple-page printed
    documents too. Even if you haven''t used these sort of programs before, you have
    undoubtedly seen magazines where repeating elements such as page numbers, article
    titles, or the name of the magazine appear on the corner of each page.


    With print layout programs, items placed on Master pages appear in the exact same
    location on every document page. Changes made to a master page will ripple through
    the entire document which saves time and reduces the margin of error. This is
    exactly the same with your websites you create in Muse.


    As we saw in the previous chapter, Muse creates a blank home page and a blank
    Master Page by default, every time you create a new site. Whether you are making
    a one-page or multiple-page website, this initial setup is the starting point
    for any website and provides a useful overview or sitemap for your site.


    There are two ways to use the Master pages:


    +   - Plan out your sitemap by using blank pages (as we did in the previous chapter)
    and then apply the masters later

    +   - Apply the master to your home page at the start and then create new pages
    based on that design


    # Working with pages within your site


    In the previous chapter, we created a new site, a sitemap, and a working wireframe
    prototype using Muse''s Plan view. We quickly created six pages for our site.
    Now we''ll take a look at how to add, duplicate, delete, and rename pages quickly
    using the Plan view.


    There are two types of basic pages:


    +   - **Sibling pages**: These are pages that share the same parent page; in the
    case of our Windsurfing site, all top-level pages (Home, Gear, Learning, and Contact)
    are siblings.

    +   - **Child pages**: These pages appear below a particular page on a level of
    the site''s organization. In our example, Sails and Boards are child pages of
    Gear. Any page on any level of your site can have sibling pages or child pages.'
