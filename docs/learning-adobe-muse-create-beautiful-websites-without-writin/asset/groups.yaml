    # Summary


    In this chapter we''ve discussed Composition and Slideshow widgets, which allow
    us to add some very useful interactivity and functionality to our pages without
    as much as a hint of coding from our end. We also saw how to take code from other
    websites (such as YouTube, Google Maps, and Twitter) and embed it into our Muse
    web pages.


    In the next chapter, we''ll look at how Muse plays nicely with other Adobe products
    such as Photoshop and Fireworks.'
  - '[PAGE 220]


    # 10


    # Muse, Meet the Adobe Creative Suite


    In the previous chapter we used Muse''s built-in widgets to add a slideshow to
    our pages. If you use some of Adobe''s other products, such as Photoshop, you
    will be pleased to know that Muse is tightly integrated with other products in
    the Adobe Creative Suite. Adobe Muse is not part of the Adobe Creative Suite®
    6 release, but it is available as part of the Adobe Creative Cloud membership.
    However, even if you''re using older versions of Photoshop and Fireworks, Muse
    will work well with the files you create using those programs.


    In this chapter, we''ll look at how we can use Photoshop or Fireworks to create
    graphics and easily bring them into your Muse-created websites. We will learn
    how to:


    +   - Create and add a Photoshop button

    +   - Add Photoshop or Fireworks-based graphics

    +   - Edit images with Photoshop or Fireworks using Edit Original


    # Adding a Photoshop rollover button


    A rollover button is a graphic created by a web designer, which provides interactivity
    between the page''s visitor and the page itself. The term "rollover" comes from
    the idea that when the visitor rolls their mouse over the button, something changes
    visually.'
  - '[PAGE 221]


    Simple rollovers use two images. The first image is what we see when the page
    first loads. When we roll over that button, the second image is quickly swapped
    into place. When we roll our mouse off the button, the first image is swapped
    back into place. This type of interactivity is created using JavaScript, but as
    always, Muse does the work behind the scenes and writes the code for us.


    > Rollovers are sometimes referred to as mouseovers.


    Rollovers don''t have to use images; the simplest rollovers of all use only text.
    The text may simply change color or appear in bold, italic, or be underlined.
    We created some text-based rollovers when we added our menu system to the page
    in Chapter 6, Typography, Muse, and the Web. The idea behind rollovers, whether
    image-based or not, is that the interactivity gives your user some feedback and
    tells them that this is a button and something is going to happen when they roll
    over it. And usually something will happen when they click on it too.


    # States


    We can take our rollover button a step further by adding a third image. The third
    image appears when the user actually clicks on the button. There is also an option
    to use a fourth image if you want the button to appear in a certain way after
    it has been clicked.


    The way an image appears on the site may change depending on whether the mouse
    is hovered over it, clicked on it, or moved away from it. Each one of these mouse
    positions is known as a State. We can create buttons in Photoshop or Fireworks
    (or any other graphic editor) that use the following four states:


    +   - Up: The appearance of the button when the user is not interacting with it

    +   - Over: The appearance of the button as the user rolls over it

    +   - Down: The appearance of the button as the user selects (clicks on) it

    +   - Active: The appearance of the button after it has been clicked


    > You do not have to use four states, or even three if you don''t want to, just
    as long as you know the states are available to you.'
  - '[PAGE 222]


    In the following screenshot, taken from the Apple website, we can see the three
    states. When the page first loads, all of the buttons on the menu look the same.
    They are all in the Up State. When the user rolls over a menu item, the button
    changes to a dark gray. When the user clicks on the button, some shading at the
    top and right side of the button image gives the impression that the button has
    been pressed down.


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_222_0.png)


    # Creating a rollover button with multiple states in Photoshop


    In this section we''ll create a similar button with three states using Photoshop.
    If you don''t have a copy of Photoshop you can skip to the next section where
    we''ll add the button to the page and you can use the provided .PSD file.


    +   1. Open Photoshop and create a new image with a width and height of 200 pixels
    x 75 pixels, respectively.

