    ## 11

    ## Previewing and Testing Your Site


    Once you''ve done all the hard work of putting the site together, the final hurdle
    is to test, test, and test. This is a very important part of the web design process
    that involves previewing your site in various browsers to make sure it all works
    ok. You have already been doing some testing as you made your site by previewing
    your pages as you go.


    In this chapter, we''ll look at how Muse Preview uses WebKit to render previews,
    and we''ll discuss how to rigorously test your website. We''ll examine how to:


    - Preview a single page in Muse

    - Preview a single page in a browser

    - Preview an entire site in a browser

    - Export HTML and all associated assets of your Muse site

    - Follow a set of steps for testing your site


    ## Previewing pages


    Adobe Muse uses WebKit as its rendering engine for Previews. WebKit is an open
    source layout engine, which was created to allow web browsers to render web pages.
    It powers the Apple Safari and Google Chrome browsers. It is also used as the
    basis for the experimental browser included with the Amazon Kindle eBook reader,
    as well as the default browser in the iOS, Android, BlackBerry Tablet OS, and
    webOS mobile operating systems.


    This means that when you preview your page or your site from within Muse, you''ll
    get a pretty good idea of how it will look on all the browsers mentioned previously.


    ## Completing the site


    To complete the site we have built so far, add text to the Home and Sails page,
    which is provided as .txt files. Add a fictional address and e-mail link to the
    Contact page.


    The completed windsurfing site is also provided as Windsurf-CompleteSite.muse,
    as shown in the following screenshot:


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_233_0.png)


    ## Preview a page in Muse


    You''ve done this many times now if you''ve been following along, but here''s
    a quick refresher on how to preview a page in Muse:


    - 1. Open the page that you want to preview in the Design view.

    - 2. Click on the Preview link on the upper-left corner of the Muse interface.


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_233_1.png)


    ## Preview a page in a browser


    While it''s obviously very convenient and quick to preview from Muse, you should,
    as part of your testing routine, preview the web pages created in Muse in external
    browsers. Follow the given steps:


    - 1. Open the page that you want to preview in the Design view.

    - 2. Select File | Preview Page in Browser, as shown in the following screenshot:


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_234_0.png)


    ## Preview the entire site in a browser


    If you want to test links while previewing, you''ll want Muse to create preview
    files for the entire site.


    To preview the entire website, beginning with the home page, select File | Preview
    Site in Browser.


    ## Export HTML for browser testing


    In Chapter 12, Publishing Your Site, we''ll look at how to publish our site and
    the various options available to us. However, as part of our testing, we can export
    the HTML files and examine the assets that have been created by Muse. Exporting
    the HTML files means that the files are stored locally on our computer where we
    can access them and take a look at what has been generated by Muse.


    ## Previewing and Testing Your Site


    When you export your site, Muse slices and optimizes the images and creates a
    folder that holds these images, HTML, Cascading Style Sheets, and the scripts
    required to make the site work its magic.


    If you''re at all interested in code, you can open up the HTML files in any text
    editor and see the tags used to build your pages. If you''re not interested in
    the code, and most people who use Muse will not be, you can just open up index.html
    (your home page) in any of the browsers you have installed on your machine and
    test them locally.


    To export your full website as HTML, follow these steps:


    - 1. Select File | Export as HTML or press Ctrl + E (Windows) or Command + E (Mac).

    - 2. In the Export to HTML dialog box, specify the location on your computer where
    the files will be saved, by clicking on the folder icon, and then click on OK.


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_235_0.png)


    Your files will appear in the folder you specified and should look similar to
    the following screenshot:


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_236_0.png)


    > On the computer from which this screen grab is taken, Chrome is set up as the
    default browser; that''s why the Chrome icon appears beside each of the HTML files
    that have been generated.


    ## Viewing your home page on an installed browser


    You can open the home page in any browser you have installed on your computer
    by right-clicking (Windows)/ Command + click (Mac) and choosing Open With from
    the menu, and then choosing the browser in which you want to see the HTML page.


    ## What to test for?


    Testing should be completed during each phase of a site''s development. Two mistakes
    new designers often make are waiting until just prior to launch before testing,
    or not testing at all.


    If you''ve been following along through the book, you''ll have done some testing
    after each page is created by clicking on the Preview link. By testing as we go
    along, we reduce the number of bugs and errors that could appear if left until
    just before the launch. The message is, keep testing and previewing throughout
    the entire Muse project.


    So what do we need to test for?


    ## Test your website on multiple browsers and platforms


    Even though your website looks good and works well in Muse, doesn''t mean it will
    look as good or function as well on other browsers and/or platforms. Adobe has
    created a product that should create web pages that look good on all browsers
    and platforms but it is part of your job to check and test that they do.


    ## Which browsers and platforms to test?


    In Chapter 2, The Muse Workflow, we discussed the challenge of web design compared
    to print design. The major challenge is that there are several platforms and many
    Internet browsers, which your visitors could be using to visit your site. There
    are many popular operating systems and browsers on which you might test your site.


    The following is a list of the operating systems:


    - Macintosh OS X

    - Macintosh OS 9

    - Windows 7

    - Windows XP SP1 and SP2

    - Windows 2000

    - Windows 98

    - Linux

    - Android

    - iOS

    - Windows Mobile


    The following is a list of popular browsers:


    - Safari

    - Mozilla

    - Firefox

    - Chrome

    - Opera

    - Internet Explorer

    - Browsers for Mobile Devices


    There are several online tools available to help with cross-browser testing, as
    it is unlikely that you would have access to all the browsers on every type of
    platform. Check out the following websites to see how you can test your site on
    multiple browsers in one go:


    - Browsershots: http://www.browsershots.org/

    - Browsercam: http://www.browsercam.com/

    - Browserlab: http://browserlab.adobe.com/


    Only Adobe Browserlab offers a free service.


    ## Test page optimization


    Optimizing your pages right from the start can help ensure that your site design
    and images support fast page load times, and that the site''s development is smooth
    and efficient. We''ve discussed the importance of optimization of images in Chapter
    7, Working with Images, a compromise between the best quality possible with the
    lowest file size.


    There are also free online tools that calculate document weight, composition,
    and page load times, and even offer recommendations for optimizing web documents.
    Check out Website Optimization''s web page analyzer at: http://www.websiteoptimization.com/services/analyze/.


    ## View pages on a variety of displays


    Visitors will be accessing your site from desktop computers, laptops, tablets,
    and smartphones. Your lovely design may not stand up on each of these displays,
    so it''s important to try out your pages on as many of these displays as possible.


    ## View pages on different screen resolutions


    Unlike designing for print, not everyone will be viewing your site at the same
    resolution. A useful tool for testing your site at various screen resolutions
    is Firefox''s Web Developer plug-in. This includes a customizable window-resizing
    tool.


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_239_0.png)


    ## Check for adequate color contrast


    Make sure it''s easy for people to see your content by providing good contrast
    between the text and the background. A useful tool that can be helpful for checking
    your design''s color contrasts is Vischeck (http://www.vischeck.com/), which simulates
    colorblind vision, allowing you to see your pages as a colorblind user might.

