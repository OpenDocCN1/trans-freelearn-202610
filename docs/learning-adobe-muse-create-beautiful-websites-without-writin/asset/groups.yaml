    # 1


    # Welcome to Muse


    Welcome friends, to Adobe Muse! As we work our way through this book, we will
    learn how to use Adobe''s latest web design software to create eye-catching websites.
    All without writing any code.


    Examples of some of the interesting ways in which people have used Muse include
    portfolio-style websites for photographers, illustrators, and designers and interactive
    brochure style sites for all kinds of service providers. If you would like to
    see some examples of how other designers have used Muse to create their websites,
    check out Muse Showcase at http://www.adobe.com/products/muse/showcase.html.


    In this chapter, you will learn:


    +   - What Muse is

    +   - How to get around the workspace

    +   - How to save your site

    +   - How to select tools

    +   - How to work with panels


    # What is this Muse you speak of?


    Muse is a brand new offering from the software design company, Adobe. The idea
    behind it is to allow designers to create websites as easily as we can create
    layouts for print. Known as a WYSIWYG (What You See Is What You Get) web design
    tool, Muse allows us to build entire sites without worrying about HTML, CSS, JavaScript,
    or jQuery – all of which have the ability to leave a designer in a cold sweat.


    If you are a graphic designer and have used Adobe InDesign, Illustrator, or Photoshop,
    you will find that you will have a certain level of familiarity with Muse. The
    interface is similar to others from the Adobe stable and the ability to drag-and-drop
    elements into your layout is what makes Muse special. You can focus on the look
    and feel, while Muse creates the code behind the scenes.'
  - '[PAGE 23]


    The following are some of Muse''s features:


    +   - **Plan, design, and publish**: Starting your website with a plan is always
    a good idea and that''s the first step in the Muse workflow.

    +   - **Easy layout of text and images**: You don''t have to worry about adding
    DIV tags, Padding, and Margin attributes in order to place your design elements
    on the page. You can drag-and-drop where you want and precisely control your layouts.

    +   - **Add interactivity**: Muse lets you add rollovers and button states created
    with the Photoshop layers. Arbitrary HTML and Muse widgets allow you to set up
    more advanced interactive features such as accordion panels, custom lightboxes,
    and menus.

    +   - **Automatically-generated menus**: As you add pages to your site, Muse will
    update the navigation menus on the fly.

    +   - **Publishing is easy**: While you focus on creating a compelling and beautifully
    designed site, Muse automatically generates all the HTML, CSS, and scripting required
    to make it function. You can publish your site from within Muse if you host it
    with Adobe, or you can export your site and host it with any service provider
    of your choice.


    So let''s get started.


    # Where to find Muse


    In order to follow along and work with the program, the first step is to download
    the software to your computer. There are two ways to buy Muse: either by paying
    monthly or yearly as part of Adobe''s Creative Suite, or you can just try it out
    as a thirty-day trial. Either way, you can download the software from http://www.adobe.com/products/muse.html
    and install it on your system. Muse is available for Mac and Windows.


    # The Muse workspace


    A good worker knows their tools, so we''re going to take a little time to find
    our way around the tools and panels that make up the Muse workspace.


    The Muse workspace lets you plan, design, preview, and publish web pages and site
    assets. The toolbars and panels allow us quick access to the most common operations
    for creating and editing documents. Multiple documents can be displayed in the
    workspace and we can jump from one page to another by clicking on the tab that
    identifies that page.'
  - '[PAGE 24]


    # The Welcome screen


    The very first time you open Muse you will be greeted by the Welcome screen. This
    screen provides quick access to recently opened sites and easy creation of new
    sites. It also provides a direct connection to the Adobe Muse site where you can
    learn more about the program. A link provides information on the most current
    version available.


    The Welcome screen will continue to appear every time you start Muse from the
    application icon in Windows or Mac OS. If you open a Muse file directly from a
    folder on your computer then the site will open without showing the Welcome Screen.


    +   1. To disable the Welcome screen, select **Don''t Show Again** and close it.

    +   2. To re-enable the Welcome screen, enable the **Show Welcome Screen** option
    in the **Edit** menu.


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_24_0.png)'
