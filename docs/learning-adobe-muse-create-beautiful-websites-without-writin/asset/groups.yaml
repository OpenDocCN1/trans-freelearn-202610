    images which require millions of colors.


    GIF can also be a lossy format if you want it to be. The strange thing is, the
    quality scale works in the opposite way to JPEG, that is, 0 is lossless and 100
    is full-on lossy. If you don''t want to use lossy compression, you can change
    the file size by limiting the number of colors included in your image between
    2 and 256 colors. Fewer colors results in a smaller file size.


    One of the most important features of the GIF format is that it supports transparency.
    This means you can see through parts of the image, removing the square look or
    surrounding white box that would appear if saved as a JPEG. In the image in the
    following screenshot, the checkerboard squares represent the transparent areas
    of the image:


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_161_0.png)


    Another nice feature of GIF is that they support animation. You could create a
    mini-slideshow or a simple advertisement using animated GIFs. An animated GIF
    is simply a file that cycles through a number of images, creating the illusion
    of animation.

