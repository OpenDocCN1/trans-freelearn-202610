    ## 10


    ## Muse，认识 Adobe Creative Suite


    在上一章中，我们使用 Muse 内置的小部件为页面添加了幻灯片。如果你使用 Adobe 的其他产品，如 Photoshop，你会很高兴知道 Muse 与 Adobe
    Creative Suite 中的其他产品紧密集成。Adobe Muse 不是 Adobe Creative Suite® 6 发行版的一部分，但它是 Adobe
    Creative Cloud 会员的一部分。然而，即使你使用的是 Photoshop 和 Fireworks 的旧版本，Muse 也能很好地处理你使用这些程序创建的文件。


    在本章中，我们将了解如何使用 Photoshop 或 Fireworks 创建图形并轻松将其带入你用 Muse 创建的网站。我们将学习如何：


    - 创建并添加一个 Photoshop 按钮

    - 添加基于 Photoshop 或 Fireworks 的图形

    - 使用 Edit Original 用 Photoshop 或 Fireworks 编辑图像


    ### 添加 Photoshop 悬停按钮


    悬停按钮是由网页设计师创建的图形，它在页面访客和页面本身之间提供交互性。“悬停”一词源于这样一个想法：当访客将鼠标移过按钮时，视觉上会发生某些变化。


    简单的悬停效果使用两张图像。第一张图像是我们首次加载页面时看到的图像。当我们将鼠标悬停在该按钮上时，第二张图像会迅速替换显示。当我们将鼠标移离按钮时，第一张图像会恢复显示。这种类型的交互性使用
    JavaScript 创建，但与往常一样，Muse 在幕后完成工作并为我们编写代码。


    > 悬停有时也被称为 mouseovers。


    悬停不一定使用图像；最简单的悬停完全使用文本。文本可能只是改变颜色或以粗体、斜体或下划线显示。我们在第 6 章《Typography, Muse, and
    the Web》中添加菜单系统到页面时创建了一些基于文本的悬停效果。悬停的想法，无论是否基于图像，都是交互性为用户提供反馈并告诉他们这是一个按钮，将鼠标移过时会发生某些事情。而且通常点击它时也会发生某些事情。


    ### States


    我们可以通过添加第三张图像来进一步扩展悬停按钮。第三张图像在用户实际点击按钮时出现。还有一个选项可以使用第四张图像，如果你希望按钮在被点击后以某种方式显示。


    图像在网站上的显示方式可能会根据鼠标是否悬停在其上、点击它或移开而改变。每一种鼠标位置都被称为一个 State。我们可以在 Photoshop 或 Fireworks（或任何其他图形编辑器）中创建使用以下四种状态的按钮：


    - Up：用户未与其交互时按钮的外观

    - Over：用户将鼠标移过它时按钮的外观

    - Down：用户选择（点击）它时按钮的外观

    - Active：按钮被点击后其外观


    > 你不必使用四种状态，甚至如果不想的话也不必使用三种，只要知道这些状态是可用的即可。


    在下面的屏幕截图中，取自 Apple 网站，我们可以看到三种状态。当页面首次加载时，菜单上的所有按钮看起来都一样。它们都处于 Up State。当用户将鼠标悬停在菜单项上时，按钮会变为深灰色。当用户点击按钮时，按钮图像顶部和右侧的一些阴影给人一种按钮被按下下来的印象。


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_222_0.png)


    ### 在 Photoshop 中创建具有多种状态的悬停按钮


    在本节中，我们将使用 Photoshop 创建一个类似的具有三种状态的按钮。如果你没有 Photoshop 的副本，可以跳到下一节，我们将在其中将按钮添加到页面，你可以使用提供的
    .PSD 文件。


    1. 打开 Photoshop 并创建一个新的图像，宽度和高度分别为 200 像素 x 75 像素。

    2. 在图层面板中，点击 New Group 图标。点击图层面板中的新组名称并将其重命名为 Up。

    3. 在工具面板上，将前景色设置为红色。


    4. 选择 **Rounded Rectangle Tool**（它可能隐藏在矩形形状工具下）。在 Photoshop 界面顶部的工具选项栏上，确保第一个图标
    **Shape Layers** 已被选中。拖放一个圆角矩形到文档窗口。


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_223_0.png)


    一个新的形状图层已添加到 **Up** 组。现在我们将添加一些文本。


    5. 在工具栏上选择 **Type** 工具。在工具顶部选项栏上将颜色设置为白色并选择你喜欢的任何字体。点击红色矩形并输入 Read More。会添加一个新的文本图层，位于矩形形状图层之上。确保
    **Read More** 居中在矩形上方。


    6. 现在我们需要为 **Over** 和 **Down** 做类似的设置，但与其重复整个过程，我们只需复制我们为 **Up** 状态制作的组结构。


    7. 右键点击 **Up** 文件夹并选择 **Duplicate Group**。将新组命名为 Over 并点击 **OK**。


    8. 新的 **Over** 组包含之前制作的图层的精确副本。我们将对文本图层中文字的颜色进行更改。


    9. 再次选择 **Type** 工具并点击 **Read More copy** 图层。现在在屏幕顶部的工具选项中，将文字颜色更改为黑色。


    10. 现在让我们再创建一个组。选择你最初创建的 **Up** 组，然后右键点击它并选择 **Duplicate Group**。将新组命名为 Down 并点击
    **OK**。


    11. 再次你拥有了 **Up** 组的精确副本。这次我们将文字保持为白色，但我们将添加一个图层效果，使按钮看起来像被按下。


    12. 在 **Down** 组中选择 **Shape 1 copy** 图层。点击图层面板底部的 **fx**（图层样式）图标。从下拉菜单中选择 **Inner
    Shadow**。


    13. 在 Inner Shadow 对话框中，将 Distance 设置为 2 px，Size 设置为 2 px。按钮上会出现一个小的暗影。如果我们想改变阴影的方向，拖动
    Angle 按钮进行圆形移动。点击 OK。


    14. 所以在所有这些之后，我们的图层和按钮应该看起来与以下屏幕截图相似：


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_224_0.png)


    15. 我们必须合并每个组中的图层，以便每个组只包含一个图层。从顶部组（Down）开始。点击文本图层然后 Shift + 点击形状图层以便两个图层都被选中。右键点击并从下拉菜单中选择
    Merge Layers。我们会看到我们的两个图层已变成一个图层。


    16. 对 Over 组和 Up 组重复此过程，以便每个组只包含一个合并的图层。


    17. 对于每个合并的图层，返回并重命名图层为 Up、Over 和 Down，如后面的屏幕截图所示。


