    # Working with thumbnails in the Plan view


    It''s easy to add, delete, reposition, or duplicate pages when working in the
    Plan view. Right-click (Win) or Ctrl + click (Mac) on a thumbnail to see a contextual
    menu. This menu provides every option for managing your pages.


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_68_0.png)


    In the previous screenshot, you can see the menu that appears when you right-click/
    Ctrl + click.


    +   - **New Child Page**: This option creates a new blank page at a lower level
    as the current thumbnail.

    +   - **New Sibling Page**: This option creates a new blank page at the same level
    as the current thumbnail.

    +   - **Duplicate Page**: This option makes an exact copy of the current page.
    This is most useful when you have added content and applied some formatting.

    +   - **Delete Page**: This option gets rid of the page.

    +   - **Rename Page**: This option allows us to change the name of the page.

    +   - **Go to Page**: This option opens up the current page in the Design view.

    +   - **Page Properties**: This option opens the Page Properties dialog box allowing
    you to set properties for the current page only.

    +   - **Reset Page Properties**: This option reverts to the original settings
    for the page.'
  - '[PAGE 69]


    +   - **Export Page**: This option allows you to export your page as HTML and
    CSS.

    +   - **Menu Options**: This option allows you to choose how the page will be
    included (or not included) in the automatically-created menu.

    +   - **Masters**: This option lets you choose which Master design will be applied
    to the page.


    The context menu is not the only way to get to these options, for example the
    most common tasks in the **Plan** view can be completed as follows:


    +   - You can rename a page by double-clicking on the page name

    +   - You can delete a page by hovering your mouse over the thumbnail and then
    clicking on the x icon that appears in the top-right corner


    To reposition a page in your site map hierarchy, you can drag-and-drop a thumbnail
    on the same level or on a sublevel.


    Spend a couple of minutes adding, deleting, and repositioning pages so that you
    get a feel of creating the site structure. You''ll find the **Plan** view to be
    intuitive to use and extremely fast for creating site maps. You can choose **Edit
    | Undo** to undo any of the steps you''ve taken.


    Muse tracks all the page names, and later in the design process it allows us to
    create menus quickly using menu widgets. All links created in the **Plan** view
    are maintained and are updated automatically if we make a change to the site structure.
    You can come back to the **Plan** view at any point during your web design process.


    # Working with wireframes


    Now that we''ve set up the site structure and can see how the site flows, our
    next step is to use Muse''s tools to draw a simple wireframe.


    Muse provides several features to allow us to create wireframes. These include:


    +   - A rectangle tool to create graphics and text placeholders

    +   - Column grid for alignment of layout elements in the **Design** view

    +   - The Assets panel, which includes features to update placeholder images


    For the windsurfing site, we''re going to use a one-column layout with a header
    at the top, a main content area in the middle, and a footer at the bottom of the
    page. The header will include the site name with a tagline, links to Facebook,
    Twitter, and YouTube, and a navigation bar containing links to the pages on the
