    字距调整：这是对字母对之间水平间距的调整。它用于创造均匀性的视觉效果。


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_137_0.png)


    字距/字母间距：这是对整块文本而不是仅字母对（字距调整）应用的调整。它用于提高可读性并在特定空间内容纳更多或更少的文本。在下面的插图中，第一行的字距设置为
