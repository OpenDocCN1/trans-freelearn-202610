  - '[PAGE 211]


    # Creating a slideshow presentation


    Earlier in this chapter we created a photo gallery which required the user to
    click on a thumbnail to see the larger image. This kind of functionality is also
    available using the Lightbox Slideshow widget or the Thumbnails Slideshow widgets.
    They work in a very similar way to the photo gallery we already created so rather
    than recreate those steps, in this next example we''ll create a slideshow using
    the Blank Slideshow widget. We''ll change the settings so that the slideshow plays
    automatically, running through a series of images. We''ll specify the transition
    effects and the speed at which the slideshow plays. Perform the following steps
    to create a slideshow presentation:


    +   1. Open your page in the Design view.

    +   2. In the Widgets Library menu, choose the Blank Slideshow widget and drag
    it onto the page.

    +   3. The Blank Slideshow widget consists of a dark gray rectangle which will
    hold our large image, a caption area, an image counter, and a next and previous
    image button for navigation.

    +   4. Click on the blue arrow to access the Options menu. Click on the folder
    icon at the top, next to the Add Images... option.

    +   5. Navigate to your images folder and choose as many images as you want to
    add to your slideshow. Hold down Ctrl/Cmd to choose multiple images, and then
    click on Open.

    +   6. Your images will be added to the content area and the numbers in the image
    counter will increase to reflect the number of images in the slideshow. The default
    images from Muse remain in the slideshow. We simply delete these after adding
    our own images.'
  - '[PAGE 212]


    7. Click again on the blue arrow to open the widget''s Options menu, as shown
    in the following screenshot:


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_212_0.png)


    8. Set the following options:


    +   - Transition: Horizontal

    +   - Auto Play: Medium

    +   - New Hero: Fill Frame Proportionally (Hero is just a name for the main image)

    +   - New Thumbnail: Fill Frame Proportionally – this is irrelevant here because
    we''re not using thumbnails

    +   - Lightbox: Deselected

    +   - Parts: Deselect all options to hide the captions, counter, next, and previous
    buttons


    Setting these options leaves us with a single image on the page.


    9. Choose Preview to see how the slideshow will work in the browser. When all
    of the images have been displayed, the slideshow will loop around to the first
    image again and continue to play.'
  - '[PAGE 213]


    10. If you want to change the size of your slideshow, go back to the Design view
    and drag one of the corner handles of the Hero image frame. Hold down Shift as
    you drag to constrain the proportions of the slideshow. As you drag, you''ll see
    the dark gray area increase in size, as well as the image itself.


    In its current setup, this slideshow requires no user interactivity. If you decide
    that you want to let the user control the slideshow, click on the blue arrow again
    to open the options for the widget.


    11. To provide thumbnails to correspond with the large images, select Thumbnails
    in the Parts section.


    12. To provide the next and previous image controller buttons, select those options
    in the Parts section.


    13. You can place each part of the widget in different parts of the page. Remember
    to click once to select the whole widget, and then click on the individual parts
    of the widget to position them where you want.


    14. Select and position the thumbnails under the main image area.


    15. Select and position the next and previous buttons at the top and right of
    the main image, as shown in the following screenshot:


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_213_0.png)'
  - '[PAGE 214]


    # Insert arbitrary HTML


    While Muse writes the HTML and CSS for everything we''ve looked at throughout
    this book, there may be times when you need to add a little bit of HTML yourself.
    Don''t worry though; you won''t have to write this code either. Let''s say for
    example you want to add a Google map to your site to show clients or interested
    parties where you are based. Google will provide you with the code, you just copy
    it and then simply paste it back into your page in Muse.


    Another example would be if you want to add a YouTube video. You don''t need to
    host the video, you just paste in some code provided by YouTube and the video
    will appear, embedded in your page. A big advantage of using a service like this
    is that you don''t need to worry about hosting the video content, it''s still
    hosted by YouTube, and it just looks as if it''s on your site.


    Working with arbitrary HTML on a page in your site allows you to set aside a window
    in your page where third-party content can appear. As you can imagine, this opens
    up huge possibilities for you in terms of what you can add to a page without the
    need to write your own code. You could let your visitors know what the weather
    is going to be, show them a map of your hometown, impress them with audio and
