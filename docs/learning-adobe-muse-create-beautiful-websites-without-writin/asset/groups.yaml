    +   - **Drop Cap**: This is a popular and effective design style in which the
    first letter (a capital letter) is set in a larger point size and aligned with
    the top of the first line. It is often used to indicate the start of a chapter
    or a new section of a document.


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_136_0.png)


    +   - **Raised Cap**: This is another design style where the first capital letter
