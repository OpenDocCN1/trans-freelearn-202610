    # Transferring a style


    When you''ve created a style, you can copy it and then apply it elsewhere. Let''s
    say for example, that you wanted to repeat the look-and-feel of the menu we''ve
    created at the top of our page, with a similar menu in the footer of the page.
    Here''s how we do it:


    When you have styled the appearance of a widget, make sure the styled widget is
    selected first, then right-click (or Ctrl + click) on the unstyled widget, and
    choose Transfer Widget Skin from the context menu that appears, as shown in the
