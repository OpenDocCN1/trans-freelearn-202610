  - '[PAGE 5]


    # About the Author


    **Jennifer Farley** has over 12 years experience working in the graphic and web
    design industry. In 2002, she became a full time educator, teaching Adobe Photoshop,
    Illustrator, Dreamweaver, and Design Theory. She runs her own design business,
    called Laughing Lion Design but now divides her time equally between teaching
    design and freelance illustration work.


    Thanks to my husband Jason for his support and love, and for sometimes staying
    up very late with me while I wrote this book.


    Thanks to my parents for their support and love and for introducing me to books
    at a very, very young age.'
  - '[PAGE 6]


    # About the Reviewers


    **Corey Gutch** has worked with various web technologies at Adobe Systems since
    1996, and is an Adobe Certified Expert in Dreamweaver and Illustrator. He is currently
    the Interactive Director for creative agency Dumb Eyes, designing and developing
    standards-compliant websites, the Lead Instructor for the Web Design with Creative
    Suite certificate program at the University of Washington, and Community Manager
    for Adobe Muse at Adobe Systems. Along with his knowledge of Adobe products, he
    is proficient in authoring HTML, XHTML, CSS, PHP, and JavaScript, and working
    with open source frameworks such as Wordpress and Drupal. He has deep knowledge
    and insight into real-world web design and development scenarios with both corporate
    and boutique clients.


    **Ben Harrison** is also known as Mr. Fuddlebunker of Kelso, WA. He is married
    to a wonderful woman, has four kids and works at Swanson Bark & Wood Products.
    His current responsibilities are Digital Marketing and Brand Management. He loves
    to play with his kids, travel with his wife, volunteer in his community, build
    websites in his spare time as Fuddlebunker Design, and when he has a free weekend,
    he plays paintball.


    **Cristian Radu** is a technically astute IT professional with strong experience
    providing support to corporate clients across diverse industries, recognized for
    his ability to coordinate special projects, his excellent analytical and problem
    solving skills, and his willingness to rise to any challenges. He started his
    career working for small local companies then moved to large corporations.'
