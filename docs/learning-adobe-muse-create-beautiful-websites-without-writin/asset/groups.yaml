    +   - Is there a sense of balance and order? Is it easy to get around the site?

    +   - Are all links working?

    +   - Does the website function and display properly in all of the main (and older)
    browsers?

    +   - Has the website been spell-checked? Incorrect spelling and bad grammar have
    proved to be major turn-offs for visitors on e-commerce sites. Don''t lose visitors
    because of bad spellings.

    +   - If your site includes multimedia, does it work properly?

    +   - Are your contact details easy to find?


    These questions are just some of the issues you need to consider on your web design
    journey.


    Use individuals and groups to test your site. As the designer, you are too close
    to the site and everything from the design to the functionality will seem obvious
    to you. But is it obvious to a new visitor? It''s amazing what a fresh pair of
    eyes can pick out. Get as much feedback as possible.


    When you''re happy with your design and have tweaked it and tested it to a finely-tuned
    machine, you''re ready to unleash it and share it with the world. To do that,
    you need to publish the site to a host.


    Publishing a website means making it available to your visitors. This requires
    that you upload the website and all its assets to a server. Once you upload to
    a server, all your pages should be retested, just in case a file did not upload
    properly.


    There are two options available when publishing with Muse. You can have your site
    hosted by Adobe using Business Catalyst or you can export the HTML files and use
    any host of your choice.


    # Adobe Business Catalyst


    Business Catalyst is Adobe''s hosted application for building and managing online
    businesses. It is tightly integrated with Muse and could be considered the easiest
    option for getting your website online. Prices for basic hostings with Business
    Catalyst start at $5.99 per month. You can find a full pricing list at http://www.adobe.com/products/muse/buying-guide.html.
    It should be noted that in the future Muse may include Content Management System
    (CMS) features that will not be available by exporting HTML and will require the
    use of Business Catalyst.'
