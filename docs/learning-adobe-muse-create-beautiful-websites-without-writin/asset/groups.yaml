  - '[PAGE 46]


    Until everyone in the world has a superfast broadband connection, we must always
    be aware of how fast our pages load. Many users are now accessing websites using
    cellular data networks, which are much slower than typical Internet connections.
    One way to increase download speed is to use optimized image files: JPG, GIF,
    and PNG, which are a compromise between image quality and file size. We''ll discuss
    these file formats in much more detail in a later chapter, but for now it''s enough
    to remember that the speed of our website is a very important factor when planning
    the design and build of the site, and even has implications for search engine
    optimization.


    # Where to find more information?


    So, how do we find out more about who''s using what? As mentioned already, the
    W3C is an Internet organization whose mission is to develop web standards. In
    addition to providing advice and tutorials on all aspects of web design, they
    keep track of statistics regarding access and usage. To find out more about browsers,
    screen resolutions, and the operating systems of web users, check out the following
    links:


    +   - www.w3schools.com/browsers/browsers_stats.asp: Gives information on browser
    statistics

    +   - www.w3schools.com/browsers/browsers_display.asp: Offers (reasonably) up-to-date
    information on screen resolutions

    +   - www.w3schools.com/browsers/browsers_os.asp: Provides a breakdown on operating
    systems


    # The Muse workflow


    Muse features five distinct views or sections. These are:


    +   - Plan

    +   - Design

    +   - Preview

    +   - Publish

    +   - Manage


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_46_0.png)'
  - '[PAGE 47]


    These views are a representative of the steps a designer will take when designing
    and building a website (without Muse). We''ll take a look at each of these in
    turn, but let''s start with a quick recap on how to create your site in Muse.


    # Create a site


    In the first chapter we looked at the Muse interface and saw how to create a new
    site in Muse. Choose File | New. This process is very similar to creating a new
    document in InDesign. It creates a .muse file which is similar to an .indd (InDesign)
    file as it holds information about our web pages and the master pages.


    We can set up the width of our page, and based on our knowledge of common screen
    resolutions (1024x768), the default width of 960 pixels is suitable.


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_47_0.png)


    By entering a page width value we are creating a fixed width (sometimes called
    static width) layout. This means that the layout will not change in width even
    if the browser window is made narrower or wider. The alternative to fixed width
    is a fluid width layout. This means that the content stretches to fit the width
    of the browser window. At the time of writing, we can only choose a fixed page
    width option. By default, the container holding the content is centered on the
    page.


    Typical values for a fixed width page lie between 960 and 1010 pixels, leaving
    some space for the browser chrome, the borders of a Web browser, and scroll bars.
    When designing a web page, the browser chrome must be added to determine the width
    of the page. The most widely used width for a fixed-width web page is 960 pixels.
    That size allows the page to fit within a browser on a monitor whose screen resolution
    is 1024 by 768 pixels.'
  - '[PAGE 48]


    # Why 960 instead of 1024?


    Graphic designers have been using grids for layout for a far longer time than
    the Web has been around. The 960-based grid is used by web designers as a way
    to quickly prototype a layout in any number of columns: 9 x 3, 3 x 3 x 3, 4 x
    4 x 4 x 4, 10 x 2 columns and so on.


    In the following screenshot you can see, on the left, Nick Finck''s website and
    on the right, the same site with the grid overlay superimposed on it. The grid
    helps designers align objects on the page neatly.


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_48_0.png)


    To read more about the 960 pixel based grid visit http://960.gs/.


    # Plan your site


    Once you click on OK in the New Site dialog box, Muse opens the Plan view. When
    working with a page layout program such InDesign, you can set up how many pages
    you want. You can also set up master pages, which hold design elements or content
    that will appear consistently across many pages. We can do exactly the same thing
    in Muse. Every Muse site starts with a single thumbnail representing the home
    page on the top-half of the Plan view and a thumbnail representing a master page
    on the bottom-half of the Plan view. In the following screenshot you can see that
    we have added pages for About, Services, and Contact. Under the Services page
    there are three subpages called Graphic Design, Web Design, and Illustration.'
  - '[PAGE 49]


    The Plan view lets us easily add and organize pages by dragging-and-dropping thumbnails.
    A sitemap describes the way in which the pages connect to each other and it gives
    us a nice overview of our site. Additionally, the layout in Plan mode determines
    the automatic layout of menus.


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_49_0.png)


    # Design your site


    After all your research, exploration, and planning, we''ve now reached the really
    fun part of the process: designing! With "traditional" website design, we''d write
    out HTML code, which holds the structure of our page. We would then style it using
    Cascading Style Sheets (CSS).


    To use the analogy of a house, we could think of HTML as being the floor, the
    walls, the roof, and the windows, while CSS could be the carpets, the wallpaper,
    and the paint on the ceilings.


    However, rather than writing the code and stylesheets ourselves, this is where
    Muse steps in and shields us from the dark underbelly of coding.'
  - '[PAGE 50]


    To get to the Design view, simply double-click on any of the thumbnails in the
    preview. Your page will open and you''ll see the toolbar, panels, and the document
    window. We can add text, images, and lots of very cool functionality by dragging-and-dropping
    them onto the page.


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_50_0.png)


    If you''ve used Adobe''s Dreamweaver software, you''ll know that even though it
    attempts to be designer-friendly with a visual approach to web design, you cannot
    drag-and-drop your design elements precisely onto the document in the same way
    you can in Muse. This has been a source of frustration for people who are used
    to Photoshop, Illustrator, or InDesign.


    The ease with which you can place images and format text makes this program a
    joy to use. Muse is well integrated with Photoshop and Fireworks, making it simple
    to copy and paste graphics from those programs into your web page. Slideshows
    and lightboxes can all be added effortlessly; design elements which just a few
    years ago would have required extensive programming skills to implement.'
  - '[PAGE 51]


    The following screenshot shows a vertical menu system created by dragging out
    from the widgets panel. The options for the panel allow us to customize it to
    our heart''s content, changing text and background colors, sizes, and positions.


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_51_0.png)


    # Preview your site


    As part of the design process, we need to check regularly to see how our website
    will look in the browser. We can do a check from within Muse by clicking on the
    Preview link at the top of the screen.


    Preview uses WebKit as its rendering engine. This is the same engine that powers
    the Apple Safari browser, the Google Chrome browser, and most mobile phone browsers,
    so it gives us a fairly accurate representation of how our design will look in
    most browsers.


    To preview a page in Muse:


    +   1. Open the page that you want to preview in Design view.

    +   2. Click on the Preview link on the upper-left corner of the Muse interface.


    While this gives us a handy "in-program" preview, it''s very important to test
    your pages in the real thing, that is, in as many browsers as possible. This can
