    ## Creating a slideshow presentation


    Earlier in this chapter we created a photo gallery which required the user to
    click on a thumbnail to see the larger image. This kind of functionality is also
    available using the Lightbox Slideshow widget or the Thumbnails Slideshow widgets.
    They work in a very similar way to the photo gallery we already created so rather
    than recreate those steps, in this next example we''ll create a slideshow using
    the Blank Slideshow widget. We''ll change the settings so that the slideshow plays
    automatically, running through a series of images. We''ll specify the transition
    effects and the speed at which the slideshow plays. Perform the following steps
    to create a slideshow presentation:


    - 1. Open your page in the Design view.

    - 2. In the Widgets Library menu, choose the Blank Slideshow widget and drag it
    onto the page.

    - 3. The Blank Slideshow widget consists of a dark gray rectangle which will hold
    our large image, a caption area, an image counter, and a next and previous image
    button for navigation.

    - 4. Click on the blue arrow to access the Options menu. Click on the folder icon
    at the top, next to the Add Images... option.

    - 5. Navigate to your images folder and choose as many images as you want to add
    to your slideshow. Hold down Ctrl/Cmd to choose multiple images, and then click
    on Open.

    - 6. Your images will be added to the content area and the numbers in the image
    counter will increase to reflect the number of images in the slideshow. The default
    images from Muse remain in the slideshow. We simply delete these after adding
    our own images.


    7. Click again on the blue arrow to open the widget''s Options menu, as shown
    in the following screenshot:


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_212_0.png)


    8. Set the following options:


    - Transition: Horizontal

    - Auto Play: Medium

    - New Hero: Fill Frame Proportionally (Hero is just a name for the main image)

    - New Thumbnail: Fill Frame Proportionally – this is irrelevant here because we''re
    not using thumbnails

    - Lightbox: Deselected

    - Parts: Deselect all options to hide the captions, counter, next, and previous
    buttons


    Setting these options leaves us with a single image on the page.


    9. Choose Preview to see how the slideshow will work in the browser. When all
    of the images have been displayed, the slideshow will loop around to the first
    image again and continue to play.


    10. If you want to change the size of your slideshow, go back to the Design view
    and drag one of the corner handles of the Hero image frame. Hold down Shift as
    you drag to constrain the proportions of the slideshow. As you drag, you''ll see
    the dark gray area increase in size, as well as the image itself.


