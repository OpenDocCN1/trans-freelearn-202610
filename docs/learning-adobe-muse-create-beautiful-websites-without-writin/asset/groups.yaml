  - '[PAGE 240]


    # Test the functionality of all your widgets


    If you''ve added some of the handy widget functionality provided by Muse, make
    sure it works. It should work, but don''t forget to test. If there is a problem,
    it will be with older browsers, which will not support some functionality. If
    you find that a large portion of your visitors are using an older browser (and
    this is something you will discover over time by using website logs or Google
    analytics), then you may need to provide an alternative to that functionality.


    # Test all links, including navigation


    Make sure all the links work properly. Links in your main navigation are created
    automatically by Muse, so check that it includes all the pages you want, and that
    it doesn''t include any pages you don''t want.


    Check all links to external sites and check your anchor links to ensure they are
    taking the visitor to where they should be.


    # Test all downloads


    If you have added a link to a download such as a PDF file, make sure that your
    download links point to the correct files, and that the download files exist.


    # Test the site''s accessibility conformance


    Use at least two different accessibility evaluation tools. A useful list of tools
    is available on the W3C accessibility initiative website: http://www.w3.org/WAI/RC/tools/complete.


    # Proofread all content


    Spelling errors are a major turn-off for visitors to websites. Make sure you spell
    check and read through each page of your site to check that all the text is clear,
    simple, and appropriate for your website''s target audience.


    # Usability testing


    The tests and checks listed so far are something you can do yourself, but to really
    test your site, you need a fresh pair of eyes; ideally, several sets of eyes.
    The main goal of usability testing is to make sure your final version, your live
    website, is user-friendly and works well for your visitors.'
  - "[PAGE 241]\n\nYou will have to test the following:\n\n+   - **Effectiveness**:\
    \ Testing to see if the user can accomplish the desired tasks\n+   - **Efficiency**:\
    \ Testing to see how much effort is involved in accomplishing the desired tasks\n\
    +   - **Satisfaction**: Testing to see if the user has a satisfactory experience\
    \ and will return\n\nYou may be surprised that what seemed completely obvious\
    \ to you, may leave an independent tester scratching their head, wondering what\
    \ to do on your website.\n\n> For tons of information on website usability, visit\
    \ Jakob Nielsen's website at: http://www.useit.com/.\n> \n> Mr. Nielsen is recognized\
    \ as one of the pioneers of usability testing on websites. You might also be surprised\
    \ at how plain the site is.\n\nSome of these tests will only be possible once\
    \ you upload your site to the server (which we'll cover in the next chapter),\
    \ but many of them are possible by testing locally on your machine.\n\nIf you\
    \ were creating a very large site you would need to do additional testing, but\
    \ for a small personal site created with Muse, testing everything that's been\
    \ mentioned so far would be a good start.\n\n# Creating a device-friendly website\n\
    \nWhile Adobe does not officially support mobile device designs in Version 1 of\
    \ Muse, there are a number of things you can consider when designing your site\
    \ to make it mobile friendly, as follows:\n\n+   - Adobe Flash technology is not\
    \ supported on iPhones and iPads. This was the source of some antagonism between\
    \ Apple and Adobe. If you put Flash on your website, it will not be visible to\
    \ users of iPhones or iPads.\n+   - Apple does not like pinned images either.\
    \ On the iPhone and iPad, your pinned images will not stay pinned where you want\
    \ them.\n+   - Some embedded HTML that you added to pages using Object | Insert\
    \ HTML can produce unexpected results on smart phones and tablets. You should\
    \ test the site on a mobile device and if there is a problem, you should remove\
    \ the embedded HTML to see if the rest of the page behaves normally."
  - '[PAGE 242]


    +   - There is no Rollover/Hover state on touch devices. On many devices, the
    first touch is treated as a hover, with the second touch acting as the Click or
    Down state. Again, testing on a mobile device is required to ensure that your
    menu widgets and other links work correctly.

    +   - Aim for a good user experience for all of your visitors. At this point,
    it is very difficult, if not impossible, to duplicate the experience on a mobile
    device as on a desktop or laptop computer. So keeping your site simple and easy-to-use
    is one way to ensure that your site performs well on a mobile device.


    # Summary


    In this short chapter, we saw how to preview your page within Muse and in a browser,
    how to preview the entire site in a browser, and how to export the site as HTML
    and its associated assets. We also discussed testing and what you as the designers
    should be checking for, and we saw some tips on making your website mobile device
    friendly.


    In the next and final chapter, we''ll learn how to publish our site on the Web.'
