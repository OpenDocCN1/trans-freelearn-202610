    # Summary


    In this chapter, we looked at how to create a menu bar for our entire website.
    We styled the menu and the individual menu items which appear for each page in
    our website structure. We also used an Accordion panel as a way to put a large
    amount of text on a page without taking up too much space.


    In the next chapter we''ll again look at widgets, specifically how to use compositions
    and how to create a slideshow.'
