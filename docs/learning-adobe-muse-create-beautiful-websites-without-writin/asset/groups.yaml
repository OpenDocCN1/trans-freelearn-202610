    ## Insert arbitrary HTML


    While Muse writes the HTML and CSS for everything we''ve looked at throughout
    this book, there may be times when you need to add a little bit of HTML yourself.
    Don''t worry though; you won''t have to write this code either. Let''s say for
    example you want to add a Google map to your site to show clients or interested
    parties where you are based. Google will provide you with the code, you just copy
    it and then simply paste it back into your page in Muse.


    Another example would be if you want to add a YouTube video. You don''t need to
    host the video, you just paste in some code provided by YouTube and the video
    will appear, embedded in your page. A big advantage of using a service like this
    is that you don''t need to worry about hosting the video content, it''s still
    hosted by YouTube, and it just looks as if it''s on your site.


    Working with arbitrary HTML on a page in your site allows you to set aside a window
    in your page where third-party content can appear. As you can imagine, this opens
    up huge possibilities for you in terms of what you can add to a page without the
    need to write your own code. You could let your visitors know what the weather
    is going to be, show them a map of your hometown, impress them with audio and
    video, or provide them with stock market quotes.


