    +     - Normal: how the link looks when the page loads

    +     - Rollover: how the link looks when the mouse is rolled over it

    +     - Mouse Down: how the link looks when it is clicked

    +     - Active: how the link looks on the current page


    We''ve already set up the Normal state, next we''ll work on the Rollover state.


