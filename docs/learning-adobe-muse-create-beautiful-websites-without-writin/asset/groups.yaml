    \ in Muse, you will see that the changes you made to your PSD are reflected immediately.\n\
    \n> If your changes have not appeared, right-click on the filename in the Assets\
    \ panel again and choose Update Asset. You should now see the update kick in.\n\
    \n## Paste an image from another program\n\nLet's say we've created other images\
