- raw:
  - '[PAGE 147]


    # Using the Context menu in the Character and Paragraph Styles panels


    When you''re working with the Styles panels, you can find extra options by right-clicking
    or Ctrl + clicking on any style. You''ll see the following options:


    +   - New Paragraph Style

    +   - Duplicate Style

    +   - Delete Style

    +   - Unlink Style

    +   - Clear Overrides

    +   - Redefine Style

    +   - Rename Style

    +   - Style Options

    +   - Delete Unused Styles


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_147_0.png)


    # Headings


    In web design, we use headings for several reasons, some of which may not be entirely
    obvious if you''re new to the field. Headings let us organize our content, convey
    a logical hierarchy on each page, help with accessibility, and work as an aid
    to Search Engine Optimization (SEO). Let''s take a look at each of these.'
  - '[PAGE 148]


    # Content organization and hierarchy


    HTML heading tags were created to provide a structure for web pages. H1 or Heading
    1 is the most important heading. It is often the largest and boldest piece of
    text on the page. Headings run from H1 to H6 and get progressively smaller as
    we move from H1 to H6. It is important to always start with H1 and move through
    each level one at a time. You may find that we don''t need to go past H3, but
    we may need this in order to create an organized web page. This is the specific
    purpose that HTML heading tags are used for—to structure your documents. You should
    always start with an H1 element and move through the other levels one at a time.
    For example:


    +   - H1

    +   - H2

    +   - H2

    +   - H3

    +   - H4

    +   - H5

    +   - H6

    +   - H6

    +   - H5

    +   - H4

    +   - H3

    +   - H2


    It''s important to use H1 or Heading 1 on each of your pages. If you consider
    that each page in your website should be focused on just one topic, then the name
    or title of that topic will be the most important heading at the top level on
    your page. There should really only be one H1 per page.


    # Headings and accessibility


    Making our web pages accessible means making our site usable by people with disabilities.
    This may include:


    +   - Visually impaired people using screen readers

    +   - Hearing impaired people using browsers with no sound

    +   - Physically impaired people

    +   - Color blind people'
  - '[PAGE 149]


    By using headings correctly, we can make pages easier to read for people using
    assistive devices. Because headings indicate the start of important text within
    a document, screen readers use headings as anchors. Pages become easier to read
    because the relevant content can be accessed without having to read every word
    on the page.


    # Headings and SEO


    This is an often-overlooked benefit of using headings correctly. Search engines
    place an extra emphasis or importance on the text within headings. The higher
    the heading tag, the more important that text is considered to be. An H1 heading
    has more weight in the search engine results than an H6 heading.


    # Creating headings


    As mentioned, we use headings to provide structure to the page and we can use
    Paragraph or Character styles to define how those headings look. That''s what
    we''ll do now:


    +   1. If it''s not already open, open the Learning page in the Design view.

    +   2. Select the Text tool and drag out a text frame under the Windsurf Wild
    text logo.

    +   3. Type in the words Learn How to Windsurf.

    +   4. Highlight the words you''ve just typed, then apply the following formatting
    either through the Control Panel or the Text panel:

    +   5. Font: Arial

    +   6. Size: 36

    +   7. Bold

    +   8. Color: Navy (#000090).

    +   9. In the Paragraph Styles panel, click on the Create New Style button.

    +   10. Double-click on the new paragraph style and name it Heading 1 in the Style
    Options dialog box. From the Paragraph Tag drop-down menu, choose Headline (H1).
    This is how we tell Muse that this particular piece of text is the most important
    text on the page.'
  - '[PAGE 150]


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_150_0.png)


    So that''s our Heading 1 style created. Let''s apply it on the Gear page:


    +   1. Open the Gear page in the Design view.


    +   2. Add a text frame under the Windsurf Wild text logo. Use your X and Y coordinates
    to ensure the new text frame is sitting in the same position as on the Learning
    page.


    > You may need to move the body text down the page before adding the new text
    frame.


    +   3. Type in the words Windsurf Gear.


    +   4. Highlight the words (or any part of the words because we are applying a
    paragraph style), then click on the Heading 1 paragraph style you created.


    Your text should now be formatted exactly as defined in the paragraph style.'
  - '[PAGE 151]


    # Change text case


    Let''s say that we want our heading size 1 to be in all uppercase, we can go and
    change the text case as follows:


    +   1. In the Design view, make sure you have the Text tool selected.

    +   2. Select the words Windsurfing Gear.

    +   3. Choose Edit | Change Case | UPPERCASE. This changes the selected text to
    all uppercase, as shown in the following screenshot, but it has not changed our
    paragraph style. We will need to manually select any words that we wish to change
    to uppercase.


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_151_0.png)'
  - '[PAGE 152]


    # Text wrapping


    It''s not unusual to see boxes of information or images appearing within the text
    content of a web page. Textboxes within textboxes are sometimes referred to as
    callouts and they supplement the main text with additional information.


    Muse makes it easy to create callouts by letting us wrap text around an object
    such as a rectangle, another text frame, or an image. In the following steps we''re
    going to cut the image currently on the Gear page and paste it inside the text
    frame we created at the beginning of this chapter. We''ll then wrap the text around
    the image so it flows nicely.


    +   1. Open the Gear page in the Design view. Currently it consists of a heading,
    a text frame, and a rectangle holding an image of two windsurfers.

    +   2. Use the Selection tool to select the image on the right-hand side of the
    page.

    +   3. Choose Edit | Cut, to cut the image from the page and onto the clipboard.

    +   4. With the Selection tool, click on the text frame, then drag one of the
    handles on the right-hand side of the text frame so that the frame almost fills
    the width of the page.

    +   5. Then, use the Text tool to define a text insertion point in a text frame.
    Click once just before the word In on the first line of the first paragraph. Paste
    the element you copied previously (Edit | Paste) to insert the object as an inline
    element in the text frame.


    The image is now inside the text frame but it looks a bit awkward as all of the
    text has dropped down below it. Take a look at the Wrap options in the Control
    Panel at the top of the screen.


    +   6. Choose between the following wrap options:

    +     - Inline in text

    +     - Position left

    +     - Position right'
  - '[PAGE 153]


    7. Click on each of the wrap options so you can see how the position of the images
    changes and how the text wraps around it.


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_153_0.png)


    The text runs right up to the edge of the image, leaving it with no breathing
    space. In order to put a bit of padding around the inline element (the image)
    we''ll add offset values.


    8. Click on the Wrap drop-down box on the Control Panel. Add 10 pixels of padding
    to the right of the image and 5 pixels to the bottom.


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_153_1.png)'
  - '[PAGE 154]


    > Whenever text flows around an element, make sure that the element is not so
    wide that it makes the text area too narrow. This can make the text very difficult
    to read.


    # Web-safe fonts


    There is a list of font families that exists, and this list is known as the safe
    list. It consists of a number of font families that are supported, by default,
    on Windows PCs and Apple Mac computers.


    It is safe to use these fonts on your websites because basically almost everyone
    has them installed on their computers. This means that if you use a font such
    as Georgia (which is on the list), it is safe to assume that everyone who comes
    to your website will see your beautiful typography as you intended them to see
    it.


    ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_154_0.png)


    Now let''s say that you''ve created your own gorgeous font that you really, really,
    really want to use, but only you and two other people in the world have it, then
    the problem is that everyone else will not see that font when they come to your
    website. They will see a replacement or a default font (possibly something like
    Times New Roman) and all your hard work of choosing fonts will be wasted.


    So as a designer, using Muse, you have three choices. You can stick with the web-safe
    fonts and then you know your visitors will see your site type as you intended.
    You can use Typekit or (and we really want to avoid this option if possible) you
    can replace text with images. This means that if you want to use that unique font
    that no one else has, Muse will convert the text into an image which will be exported
    when you publish your site or export the HTML.


    The disadvantage of the safe list is that it is limited both in the number of
    fonts and also the variety of styles (bold, italic, regular) within each font
    category.'
