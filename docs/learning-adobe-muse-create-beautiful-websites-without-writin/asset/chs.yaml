- '## 欢迎来到 Muse

  欢迎朋友们，来到 Adobe Muse！在我们学习本书的过程中，我们将学习如何使用 Adobe 最新网页设计软件创建引人注目的网站。全部无需编写任何代码。


  人们使用 Muse 的有趣方式示例包括摄影师、插画师和设计师的作品集风格网站，以及各种服务提供商的交互式宣传册风格网站。如果你想看看其他设计师如何使用 Muse
  创建他们的网站，请查看 Muse Showcase，网址为 http://www.adobe.com/products/muse/showcase.html。


  在本章中，你将学习：

  - Muse 是什么

  - 如何在工作区中导航

  - 如何保存你的网站

  - 如何选择工具

  - 如何使用面板


  ## 你说的这个 Muse 是什么？

  Muse 是软件设计公司 Adobe 的全新产品。其理念是让设计师能够像创建印刷版面一样轻松地创建网站。被称为所见即所得 WYSIWYG 网页设计工具，Muse
  允许我们在不担心 HTML、CSS、JavaScript 或 jQuery 的情况下构建整个网站——所有这些都可能让设计师冷汗直流。


  如果你是平面设计师，并且使用过 Adobe InDesign、Illustrator 或 Photoshop，你会发现自己对 Muse 有一定的熟悉程度。界面与
  Adobe 家族的其他产品相似，而能够将元素拖放到版面中的能力正是 Muse 的特别之处。你可以专注于外观和感觉，而 Muse 在幕后创建代码。


  以下是 Muse 的一些功能：

  - **规划、设计和发布**：从计划开始你的网站始终是一个好主意，而这是 Muse 工作流程的第一步。

  - **轻松布局文本和图像**：你不必担心添加 DIV 标签、Padding 和 Margin 属性以便在页面上放置设计元素。你可以拖放到想要的位置并精确控制你的版面。

  - **添加交互性**：Muse 让你可以使用 Photoshop 图层添加悬停效果和按钮状态。任意 HTML 和 Muse 小部件允许你设置更高级的交互功能，例如手风琴面板、自定义灯箱和菜单。

  - **自动生成的菜单**：当你向网站添加页面时，Muse 会即时更新导航菜单。

  - **发布很简单**：当你专注于创建引人注目且设计精美的网站时，Muse 会自动生成使其正常运行所需的所有 HTML、CSS 和脚本。如果你使用 Adobe
  主机，可以在 Muse 中发布你的网站，也可以导出网站并使用你选择的任何服务提供商托管。


  那么让我们开始吧。


  ## 在哪里找到 Muse

  为了跟上进度并使用该程序，第一步是将软件下载到你的电脑。有两种购买 Muse 的方式：要么作为 Adobe Creative Suite 的一部分按月或按年付费，要么作为三十天试用版试用。无论哪种方式，你都可以从
  http://www.adobe.com/products/muse.html 下载软件并安装到你的系统。Muse 可用于 Mac 和 Windows。


  ## Muse 工作区

  一个好的工作者了解自己的工具，所以我们将花一点时间熟悉构成 Muse 工作区的工具和面板。


  Muse 工作区让你可以规划、设计、预览和发布网页和网站资源。工具栏和面板让我们可以快速访问创建和编辑文档的最常用操作。可以在工作区中显示多个文档，我们可以通过点击标识该页面的标签在页面之间跳转。


  ## 欢迎屏幕

  第一次打开 Muse 时，你会看到欢迎屏幕。该屏幕提供对最近打开的网站的快速访问，并可轻松创建新网站。它还提供与 Adobe Muse 网站的直接连接，在那里你可以了解更多关于该程序的信息。链接提供有关最新可用版本的信息。


  每次从 Windows 或 Mac OS 中的应用程序图标启动 Muse 时，欢迎屏幕都会继续出现。如果你直接从电脑上的文件夹打开 Muse 文件，则网站将在不显示欢迎屏幕的情况下打开。


  - 1. 要禁用欢迎屏幕，请选择 **Don''t Show Again** 并关闭它。

  - 2. 要重新启用欢迎屏幕，请在 **Edit** 菜单中启用 **Show Welcome Screen** 选项。


  ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_24_0.png)






  ## 打开最近的站点


  点击欢迎屏幕左侧的站点名称。如果您要处理的站点未列在其中，请点击打开图标并浏览文件夹以找到 Muse 站点。


  ## 创建新站点


  创建站点，请按以下步骤操作：


  - 1. 在欢迎屏幕的创建新站点下点击站点图标，或从主菜单中选择文件 | 新建站点。

  - 2. 新建站点对话框打开，允许我们设置站点的尺寸、列数以及边距和内边距设置。


  如果您是一名习惯使用毫米、厘米、英寸、点或派卡等单位的平面设计师，您可能会想知道这里使用的是什么单位。所有单位均为像素，因为 Muse 完全用于屏幕设计工作。


  ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_25_0.png)


  屏幕截图中的字段可描述如下：


  - **页面宽度**：这指定了容纳网页内容的容器的宽度。

  - **最小高度**：这指定了页面的最小高度。随着您添加内容，页面会拉伸，但此值可确保每个页面始终具有最小高度。

  - **列数**：这指定了在设计模式下用于对齐对象的指南的列数。

  - **列宽**：这是每列的宽度。

  - **间距**：这指定了列之间的间隙。

  - **水平居中**：请保持选中状态，这样容纳网页内容的容器无论用户屏幕分辨率如何，都会位于用户屏幕的中央。这是设计网站时的标准做法。

  - **边距**：这定义了页面容器边缘与其他外部元素之间的空间。

  - **内边距**：这定义了页面容器边缘与容器内部内容之间的空间。


  您在新建站点和站点属性对话框中指定的设置适用于新站点中的所有页面和母版页。然而，您可以自定义单个页面和母版页的属性。我们稍后会介绍如何操作。设置站点尺寸时，最好在项目开始时就进行设置，就像您为印刷页面设计时一样，但如果您发现需要稍后更改设置也不必担心。您可以通过选择文件
  | 站点属性，或在计划视图中右键单击（Windows）/Ctrl + 单击（Mac）页面或母版页来随时访问此对话框。


  ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_26_0.png)


  - 3. 对于本示例，我们将**宽度**设为 **960** 像素，**高度**设为 **800** 像素，所有**边距**设为 **20** 像素，**顶部内边距**设为
  **10** 像素，**底部内边距**设为 **20** 像素。在字段中输入数字，或点击每个字段旁的上下箭头以增加或减少当前值。

  - 4. 点击 **确定** 完成初始站点设置。


  ## 视图


  点击确定后，您将看到的下一个屏幕是计划视图。计划视图显示您的站点计划——网站组织的概览。当您首次创建新站点时，Muse 会自动生成一个主页，也称为索引页，该页链接到母版页设计。计划视图是打开
  Muse 站点时的默认视图。


  ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_27_0.png)


  在此阶段，您的计划视图将只有一个页面：主页，它显示为计划视图上部的一个缩略图。在其下方，您应该可以看到您的母版页。在本例中，您将有一个名为 A-Master 的母版页。母版页充当模板，用于共享在多个网页上所需的通用设计元素，如页眉、页脚和标志。


  Muse 站点有五个视图：计划、设计、预览、发布和管理。您可以通过点击界面顶部的链接在任意视图之间切换。第四个链接发布会打开登录窗口，开始发布过程。我们将在后面的章节中更详细地讨论这些视图。


  ## 保存您的站点


  在继续之前，最好先保存我们的站点。


  - 1. 选择文件 | 保存。保存 Muse 文件为对话框打开。为您的站点输入一个名称；我们将其命名为 MyFirstWebSite.muse。

  - 2. 导航到计算机上要保存示例项目的[content]


