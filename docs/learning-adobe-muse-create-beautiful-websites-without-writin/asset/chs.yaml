  ## 矩形的乐趣


  在上一章中，我们简要介绍了如何向页面添加一些文本，以及如何添加链接以便在浏览器中从页面跳转到页面。这是网站构建的重要组成部分。在本章中，我们讨论 Muse 网站的另一个重要基本构建块——矩形。


  矩形正如其名，就是一个形状。当我们绘制矩形时，我们是在页面上创建形状以布局对象。矩形可以包含文本或图像，可以填充颜色并用描边勾勒边缘。尽管它们被称为矩形，但它们可以是正方形形状，我们也可以将它们的角圆化，使其呈圆形形状。


  在本章中我们将学习如何执行以下操作：


  - 设置背景矩形

  - 创建矩形

  - 选择或调整矩形

  - 剪切/复制/粘贴矩形

  - 定位和旋转矩形

  - 复制矩形


  ## 使用矩形


  矩形在 Muse 中的主要目的是充当页面上的布局对象。它们让我们定义页面上的各个部分。一旦创建了某个部分或矩形，它就可以填充颜色和/或在边缘应用描边。我们还可以将背景图像填充到矩形中。虽然每个网页本质上都是由框组成的（无论你使用的是
  Adobe Muse 还是其他网页设计工具），但对背景图像的巧妙使用可以消除网站的方框感。我们将在未来的章节中更详细地讨论图像。


  消除网页方框感的另一种方法是使矩形的角变圆。我们实际上可以将正方形的角完全圆化，使其成为圆形。


  在下面的屏幕截图中，你可以看到左侧的矩形具有直角，而右侧的矩形大小完全相同，但具有圆角。


  网格叠加层已通过选择 View | Grid Overlay 打开，以帮助对齐这些矩形。


  ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_111_0.png)


  如果你回想一下第 3 章《规划你的网站》，你会记得我们在主页上使用矩形创建了一个线框布局，这些矩形代表了我们页面上的不同部分，使用了圆角矩形。我们使用矩形来划分页面的区域，这些区域将代表页眉、导航栏、主要内容区域和页脚。在传统的网页设计中，这种设置是使用
  HTML <DIV> 标签创建的。我们的原型看起来与以下屏幕截图类似：


  在上一章中，我们通过选择文本工具然后点击并拖动出一个矩形形状来向页面添加文本。这创建了一个文本框。文本框和其他对象，如小部件和图像，在设计方面与矩形非常相似。例如，如果你想为文本框添加斜面或描边，你将遵循相同的操作步骤。


  > 你可以通过使用文本工具双击它将任何矩形转换为文本框。


  那么让我们开始在页面上创建一些矩形吧。如果你一直在跟随操作，请在 Plan 视图中打开 Windsurfing 网站，以便你可以看到你的站点地图。






  ## 设置主背景矩形


  主背景矩形，简单来说就是我们在主页面上定义的一个区域。这个区域可以容纳图像或一块颜色。该矩形的高度是灵活的，其高度会随着每个页面上出现的内容量而变化。要设置主背景矩形，请执行以下步骤：


  - 1. 双击 A-Master 页面以在设计视图中打开它。注意我们页面的主区域是蓝色的，周围有一片深灰色区域。当我们最初以 960 x 800 像素的宽度和高度值设置网站时，我们创建了一个用于容纳内容的容器。该容器位于浏览器窗口的中间——这就是蓝色区域。当我们第一次开始处理
  A-Master 时，我们使用选项栏上的填充选项设置了页面颜色。周围的深灰色区域是我们内容在浏览器中两侧留下的空间。这在 Muse 中称为浏览器填充。使用浏览器填充，我们可以营造出一个无缝的大背景的印象，该背景在任何屏幕上都贯穿页面的全宽，或者我们可以创建一个具有明显边缘的背景。


  - 2. 我们将把浏览器填充区域设置为与主内容区域相同的颜色。在选项栏上，单击浏览器填充按钮。会出现一个下拉菜单。将颜色设置为 #29ABE2。您可以通过输入之前的十六进制值来设置颜色，也可以使用吸管工具单击主内容区域中的蓝色。这消除了输入错误的可能性，并确保我们拾取了完全相同的颜色。


  ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_113_0.png)


  - 3. 现在我们将更改填充区域的颜色并更改圆角半径以创建圆角矩形，该矩形将作为容器的背景。单击选项栏上的填充按钮。在下拉菜单上，将颜色设置为白色并将不透明度设置为
  50。


  - 4. 在选项栏上，将 **Stroke** 值设置为 0。这会移除主容器周围的任何描边。


  - 5. 再次在选项栏上，将 **Corners** 设置为 20。您可以输入数字 20，也可以反复单击选项栏上的向上箭头，直到达到 20。输入这些值后，您的主页面应类似于以下屏幕截图：


  ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_114_0.png)


  正如我们从关于主页面的早期讨论中所知，我们刚刚所做的更改现在将影响应用了此主页面的网站中的任何页面。在计划视图中，注意我们所有的页面，除了红色主页面外，都将看起来相同。


  - 6. 通过在计划视图中双击我们在上一章中创建的 **Learning** 页面，测试更改如何影响该页面。当页面在设计视图中打开时，单击 **Preview**
  按钮，以很好地了解页面在浏览器中的外观。


  设置背景的真正好处是，我们创建的圆角矩形将拉伸以容纳我们所有的内容。


  ## 在单个页面上创建矩形


  现在让我们看看如何向其他页面添加和操作矩形。


  - 1. 从计划视图中，双击 Gear 页面以在设计中打开它。

  - 2. 单击工作区顶部工具箱中的矩形工具。

  - 3. 在页面的右侧，拖动以绘制一个新矩形。拖动使矩形大约宽 300 像素，高 320 像素。如果不是完全正确也没关系，因为我们在下一节中会修复尺寸。


  我们可以使用矩形每一侧和每个角上出现的调整大小手柄来更改尺寸。矩形在您单击其他位置绘制另一个矩形之前保持可调整。


  ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_115_0.png)


  > 您可以通过按 Ctrl（Windows）或 Cmd（Mac OS）来调整任何矩形的大小——这会切换到选择工具——然后单击矩形，调整大小手柄会重新出现。单击并按住拖动手柄以调整大小。


  ## 删除矩形


  假设我们向页面添加了一个矩形，然后决定不再想要它，很容易将其删除。只需使用选择工具单击矩形进行选择，然后按键盘上的 Del 键即可。


  ## 调整矩形


  一旦矩形被添加到页面，我们可以随时返回并修改它，执行以下步骤：


  - 1. 在设计视图中，单击工作区顶部工具箱中的选择工具。

  - 2. 单击您刚刚创建的矩形。一旦选择矩形，其尺寸就变得可调整。要更改矩形的尺寸，单击并拖动所选矩形上的任何调整大小手柄。

  - 3. 要设置所选矩形的确切宽度和高度，请在控制面板中添加值。宽度由 W 表示，高度由 H 表示。输入 300 作为宽度，320 作为高度。

  - 4. 您还可以通过输入 X 和 Y 位置值来指定矩形在页面上的精确位置。X 是从页面左侧的像素距离。Y 是从页面顶部的像素距离。分别输入 610 和 130
  像素作为 X 和 Y，如以下屏幕截图所示：


  ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_116_0.png)


  > 要在首次绘制矩形时创建完美的正方形而不是矩形，请在拖动时按住 Shift 键。在调整现有矩形大小时按住 Shift 会限制形状的比例，使矩形变大或变小。


  ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_116_1.png)


  ## 旋转矩形


  通过旋转矩形，我们可以创建有趣的设计效果。一个例子是矩形包含图像，我们将其稍微旋转以赋予图像随意掉落在页面上的外观。执行以下步骤以旋转矩形：


  - 1. 在设计视图中，选择要旋转的矩形。

  - 2. 将鼠标移至矩形周围的任何角手柄上。光标将变为旋转图标，现在您可以手动围绕其中心点旋转矩形。


  之前的步骤可以执行，或者我们也可以在控制面板中增加或减少旋转角度。旋转角度选项出现在 X、Y 坐标和宽度与高度值字段旁边。它是控制面板中最右边的选项。


  ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_117_0.png)


  ## 剪切、复制和粘贴矩形


  因此您创建了一个矩形，现在希望在其他地方重用它。以下步骤展示了如何操作：


  - 1. 在设计视图中，使用选择工具在页面上选择一个矩形。

  - 2. 通过选择编辑 | 复制，或按 Ctrl + C（Windows）、Cmd + C（Mac OS）复制矩形。按 Ctrl + X（Windows）Cmd
  + X（Mac OS）剪切。

  - 3. 通过选择编辑 | 粘贴或按 Ctrl + V（Windows）、Cmd + V（Mac OS）粘贴矩形。矩形将出现在页面上。使用编辑 | 粘贴在您希望确保复制的对象在从一个页面移动到另一个页面时放置在完全相同的位置时。


  ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_118_0.png)


  剪切和复制有什么区别？

  复制命令会复制所选内容的副本，当您将其粘贴到其他位置时，原来的选择会保留在原位。现在内容在原始位置和新位置都可用

  剪切命令会删除所选内容，当您将其粘贴到其他位置时，原来的内容就会消失。它只会出现在新位置。


  ## 复制矩形


  在同一页面上复制和粘贴的替代方法是复制现有矩形。以下步骤向我们展示了如何操作：


  - 1. 在设计视图中，选择要复制的矩形。

  - 2. 选择编辑 | 复制，或按住 Alt（Windows）、Option（Mac OS）并拖动以创建副本。

  - 3. 要创建在水平或垂直方向上与原始矩形保持对齐的副本，请在拖动时按住 Alt + Shift / Option + Shift。


  ## 添加颜色 – 填充和描边


  虽然我们经常将矩形用作容纳文本或图像的“不可见”容器，但我们也可以使用填充和描边为其应用颜色。


  ## 添加描边


  执行以下步骤以添加描边：


  - 1. 在设计视图中，选择一个矩形。

  - 2. 矩形仍处于选中状态时，通过单击控制面板中的描边颜色选择器，然后选择描边颜色来添加描边颜色。我们可以使用吸管工具从颜色字段、或网页上的其他区域选择颜色，或者您可以指定
  RGB 值。对于此练习，选择白色作为描边颜色。






  ## 选择和保存颜色


  无论是用于描边、填充还是浏览器填充，每当你使用颜色选择器时，都可以结合颜色选择器创建一个新的颜色样本。在指定新颜色后，点击颜色选择器右下角垃圾桶图标旁边的“新建样本”图标，即可为你保存该样本。


  在填充颜色选择器中双击一个样本，可以为颜色分配一个友好的名称，例如 Lime Green，而不是 #DBD820。一旦你为其指定了更易于用户理解的名称，该名称会在鼠标悬停在该颜色样本上时以工具提示的形式显示。


  ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_119_0.png)


  - 3. 通过增加或减少颜色选择器右侧“描边宽度”框中的数字来更改描边宽度。将描边宽度设置为 5 像素。

  - 4. 要为此矩形创建圆角，请将“圆角”值设置为 15 像素。

  - 5. 可选：点击“描边”菜单（控制面板中的“Stroke”一词）以指定其他选项，如以下各节所述


  ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_120_0.png)


  ## 描边对齐


  此选项让我们可以选择描边在矩形上的确切位置。选项为矩形的中心、内部或外部。点击每个选项以查看其对矩形描边产生的影响。


  ## 描边宽度


  这允许你单独指定顶部、底部、左侧和右侧描边的宽度。默认情况下，这些数字是分组的，因此当我们增加或减少描边宽度时，矩形的各边会一起变化。我们可以通过点击链接图标来取消分组描边。当链接图标看起来像是断开时，描边即为未分组。现在我们可以一次更改任一边的宽度。


  ## 更改矩形填充


  正如我们可以更改矩形的描边颜色一样，我们也可以更改填充颜色。填充颜色覆盖矩形的整个宽度和高度。当你向矩形添加文本时，文本会显示在填充颜色的前面。以下步骤向我们展示如何操作：


  - 1. 在设计视图中，确保你的矩形已选中。

  - 2. 通过点击控制面板中的“填充”颜色选择器，然后选择填充颜色，如选择描边颜色所述，来更改所选矩形的填充。你可以指定 RGB 值、十六进制值，或从颜色字段或网页上的其他区域选择颜色。


  如果你不想在矩形中填充任何颜色，请点击“无”样本。那是带有红色斜线的第一个样本。


  ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_121_0.png)


  3. 如果你想为矩形背景选择颜色，请点击“填充”菜单（控制面板中的“Fill”一词）以指定以下实心填充选项：


  - **不透明度：** 此选项指定不透明度（或背景颜色的透明程度）。

  - **颜色：** 此选项设置填充颜色并调出与控制面板中可访问的颜色选择器相同的颜色选择器。

  - **图像：** 此选项让你选择一个图像作为矩形的背景。

  - **适配：** 此选项让你根据多个选项将图像适配到矩形内，包括“缩放以填充”、“缩放以适应”以及多种平铺选项。当你将“适配”选项设置为“平铺”时，平铺图像仅下载一次，从而减少页面下载时间。

  - **位置：** 此选项指定背景图像在矩形内的位置，相对于你的选择。


  ## 设置渐变填充


  除了使用纯色作为矩形的背景外，我们还有使用渐变的选项。以下步骤向我们展示如何操作：


  - 1. 点击控制面板上的“填充”菜单。

  - 2. 点击“渐变”单选按钮以显示渐变选项。

  - 3. 通过点击左侧的颜色选择器设置起始颜色。选择一种与主页面背景相似的浅蓝色。

  - 4. 将结束颜色设置为深海军蓝。

  - 5. 将方向设置为垂直，并保持其他选项不变。随着你进行更改，矩形填充的变化会立即显示。


  ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_122_0.png)


  6. 渐变填充的选项与我们选择纯色时的选项有些相似。以下内容简要解释了每个选项：


  - **不透明度**：此选项允许我们在渐变的开始和结束处指定不透明度。这对于逐渐将矩形与主页面背景融合非常有用

  - **颜色**：此选项让我们选择将构成渐变的两种颜色。

  - **焦点**：此选项指定背景颜色中渐变开始的点。50% 或中间是默认值。

  - **方向**：此选项让我们选择渐变运行的方向——水平或垂直。

  - **大小**：此选项允许我们指定所选的两种颜色如何融合。设置 **自动** 会创建从起始颜色到结束颜色的渐变，以适应渐变填充的对象的高度或宽度。另一种选择是输入像素值，这会导致渐变在指定的像素数内从起始颜色融合到结束颜色。


  ## 向矩形添加图像


  让我们向现有的矩形添加一张两名风筝冲浪者的图片。请记住，我们创建的矩形尺寸为 300 x 320 像素。我们将把一张大约是此尺寸两倍的图像放入矩形中，并使用可用选项使其很好地适配。以下步骤向我们展示如何操作：


  - 1. 在页面上选中矩形后，点击控制面板上的 **填充** 菜单。

  - 2. 我们现在要替换渐变填充，因此点击 **填充** 菜单上的 **纯色** 单选按钮。这为我们提供了信息框中概述的纯色和图像选项。

  - 3. 点击“图像”一词旁边的文件夹图标以选择要放入矩形的背景图像。操作系统文件浏览器打开，因此导航到你的图像文件夹并选择 Gear-Windsurf.jpg
  文件，然后选择 **打开**。

  - 4. 图像出现在矩形内。请注意，图像看起来被裁剪了。我们可以通过点击 **适配** 下拉选项来更改图像在矩形内的适配方式。选择 **缩放以填充**。


  5. 现在点击“位置”图标以选择图像的定位方式。根据你的图像，选择定位时可能需要一定的试错。点击图标上的每个空点以查看图像在矩形内的位置如何变化。对于此示例，中心点似乎效果相当不错。


  ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_124_0.png)


  ## 向矩形添加效果


  在 Muse 中，你可以向矩形、图像、文本框或任何其他对象添加诸如投影、斜面和发光等效果。以下各节展示了我们如何操作。


  ## 添加投影


  投影无疑是设计师使用最广泛的效果之一。它允许我们为页面增添深度，并给人一种物体略微从页面上浮起的感觉。与大多数设计效果一样，适度是关键。以下步骤向我们展示如何操作：


  - 1. 在设计视图中，选择要添加投影的矩形。

  - 2. 在控制面板上，点击“效果”菜单。

  - 3. 点击“阴影”类别并选择“开”。

  - 4. 设置阴影的 **颜色**。请记住，并非每个投影都需要是黑色。我们可以通过选择与主页面背景颜色较暗的色调来创建更微妙的效果。对于本次练习，选择深海军蓝色。

  - 5. 将阴影的不透明度设置为 60，如以下屏幕截图所示：


  ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_125_0.png)






  +   6. 将 **Size** 设置为 8。

  +   7. 将 **Distance** 设置为 8 并保持其余值不变。

  +   8. 以下是对选择 Drop Shadow 时可用选项的简要说明：

  +       - **Color：** 设置投影的颜色。

  +       - **Opacity：** 设置投影的不透明度。

  +       - **Size：** 让你设置投影的厚度。

  +       - **Angle：** 设置投影相对于矩形的所在位置。默认值为 45 度角，这会将投影放置在矩形的右侧和底部边缘。角度数值越高，投影在矩形周围移动的位置就越靠后。

  +       - **Distance：** 指定投影与矩形之间的距离。

  +   9. 要移除投影，请清除 **On** 复选框。


  ## 添加斜角效果


  斜角效果通过添加明暗边缘为对象增加深度。以下步骤展示如何添加该效果：


  +   1. 在设计视图中，再次选择矩形。请注意，当矩形上有描边时，斜角效果会很难看到，因此你可能需要先暂时移除矩形的描边。


  2. 在控制面板中，点击 Effects 菜单以显示如下所示的窗口：


  ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_127_0.png)


  3. 点击 Bevel 类别并选择 On 以激活斜角选项。


  4. 要移除斜角，请取消选中 On 框。


  ## 添加发光效果


  第三个也是最后一个效果是发光，它让我们可以为任何矩形应用发光边缘。以下步骤展示如何添加发光效果：


  +   1. 在设计视图中，确保选择要添加发光效果的矩形。

  +   2. 在控制面板中，点击 Effects 菜单以显示类似以下截图的窗口：


  ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_128_0.png)


  +   3. 点击 Glow 类别，选择 On 以激活选项。

  +   4. 要移除发光效果，请取消选中 On 框。


  ## 更改矩形的堆叠顺序


  经常你会发现页面上有不止一个矩形。当你将一个矩形移动到另一个矩形上方时，你可能会得到意外的结果，即你希望在上方的矩形现在却在下方。这是因为 Muse 在创建矩形时会创建所谓的堆叠顺序。幸运的是，更改堆叠顺序非常容易，并且该技术也适用于页面上的其他对象。


  ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_129_0.png)


  以下步骤展示如何操作：


  +   1. 要将矩形在堆叠顺序中向前移动（或置于上方），选择该矩形并选择 Object | Bring Forward。

  +   2. 要将矩形在堆叠顺序中向后移动，选择该矩形并选择 Object | Send Backward。

  +   3. 要将矩形置于堆叠顺序的最顶层，选择该矩形并选择 Object | Bring to Front。

  +   4. 要将矩形移至堆叠顺序的最底层，选择该矩形并选择 Object | Send to Back。


  > 上述所有堆叠选项都可以通过右键单击/Ctrl + 单击矩形来使用。


  ## 创建圆角和直角混合的矩形


  我们可以通过调整矩形各个角的圆角半径来实现一些不错的效果。假设我们想要创建一个形状，其中有 3 个圆角和一个位于右上角的直角。以下步骤展示如何操作：


  +   1. 在设计视图中，绘制一个新的矩形或选择页面上已有的矩形。

  +   2. 在控制面板中为左上角、右下角和左下角选择圆角。点击控制面板上的右上角，使其显示直角图标。

  +   3. 将圆角半径增加到 50，以在三个圆角上获得戏剧性的圆角效果；这会使直角更加突出。


  ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_130_0.png)


  我们可以随时将任意四个角从圆角更改回直角，效果会立即显现。


  ## 创建全宽矩形


  大多数情况下，当我们使用矩形工具创建矩形时，我们通过在控制面板的 Width 和 Height 字段中输入值，或通过拖动变换手柄来指定矩形的大小。


  我们还可以将矩形设置为以浏览器窗口的 100% 全宽显示。这意味着矩形会根据访客浏览器窗口的宽度自动调整大小以填充页面。


  全宽矩形可以填充纯色、渐变或图像背景填充。如果你设置了平铺背景图像填充，平铺图像将无缝重复以扩展并填充页面的 100% 宽度。


  以下步骤展示如何设置全宽矩形：


  +   1. 在 Gear 页面，在设计视图中，使用矩形工具在页面底部附近绘制一个矩形。

  +   2. 在矩形仍被选中的情况下，设置你的 Fill 和 Stroke 选项，如前所述。

  +   3. 使用选择工具拖动矩形的左右两侧，使其与整个页面宽度的左右边缘对齐。矩形将跨越页面的整个水平宽度。

  +   4. 你会注意到页面左右边缘会出现红色高亮，并且在将矩形两侧与边缘对齐时，你会感觉到矩形被吸附到位。


  使用平铺图像时，图像会重复以填充矩形。这样做的好处是浏览器只需下载一次图像，从而减少下载速度。凭借巧妙选择的背景图像，设计师可以营造出跨越页面宽度的超大图像的错觉。


  ## 总结


  在本章中，我们学习了如何设置灵活的背景矩形。我们向页面添加了矩形并调整了其大小、填充颜色和描边，并学习了如何添加诸如投影等效果。


  在下一章中，我们将深入探讨如何在 Muse 中处理文字以及如何在网络上处理排版。

  '
- "## 6\n排版、Muse\n和网络\n\n在上一章中，我们研究了矩形如何成为 Muse 网页的构建块，以及如何将它们用于内容和设计元素。任何网页的另一个绝对基本元素是文本。网站都是关于沟通的，自然地，文本是其中的重要部分。\n\
  \n在本章中，我们将添加文本并学习如何编辑它、应用样式以及使用框架来控制其在网页上的显示位置。我们还将讨论排版在制作引人注目且有趣的设计中的作用，以及我们对网络字体选择的重要性。\n\
  \n到本章结束时，你将知道如何：\n\n+   - 创建文本\n+   - 编辑文本\n+   - 创建和编辑字符样式\n+   - 创建和编辑段落样式\n+\
  \   - 添加标题\n+   - 对文本应用间距和格式\n+   - 使文本环绕图像\n+   - 为网页添加元数据\n+   - 选择“网络安全”字体\n\n\
  ## 文本的力量\n\n当我们谈论文本和设计时，我们不仅仅是指我们想要使用的字体类型。我们需要以清晰、有条理的方式呈现文本，以便访客能够快速、轻松地找到所需的信息。\n\
  \n排版本身就是一个庞大的主题，一些设计师和排版师会花费数年时间来研究。虽然我们无法深入探讨字体的设计，但了解字体的解剖结构和类别对于我们做出明智的字体选择非常重要。\n\
  \n## 字体的解剖结构\n\n字体是任何设计中出现的至关重要的元素。它不仅是可阅读的文本，还可以被视为形状或视觉元素。在开始向设计中添加文字之前，了解一些排版知识和排版术语是个好主意。以下图像展示了一些你在学习和工作中会遇到的术语的简短视觉词汇表：\n\
  \n![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_133_0.png)\n\n\n\n\n\n以下是排版术语及其解释：\n\n\
  - **基线**：这是文本所坐的虚线。\n\n![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_134_0.png)\n\n-\
  \ **x 高度**：基于传统印刷方法，x 高度是小写字母 x 的高度。然而，作为一般规则，x 高度可以描述为字体中小写字母的高度，不包括上伸部和下伸部。\n\n\
  ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_134_1.png)\n\nx 高度在不同字体之间可能有很大差异。x 高度决定了字体大小的整体印象。在下面的插图中，所有文本都设置为\
  \ 21 磅，但正如你所见，每个词在高度和粗细上看起来都大不相同。\n\n![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_134_2.png)\n\
  \n- **上伸部**：这是小写字母的茎干（例如 h、b、k），其上伸超出字体的其他小写字母的 x 高度。\n\n![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_134_3.png)\n\
  \n- **下伸部**：这是小写字母（例如 g、q、y）的部分，其向下延伸到基线以下。通常大写字母 Q 和 J 也会下伸到基线以下。\n- **罗马/常规**：字体的直立样式。\n\
  - **斜体**：字体的倾斜或类似手写体的版本。\n- **粗体**：以更重、更粗的笔画呈现的字体，用于使文本突出。\n- **大写字母高度**：从基线到字体中大写字母顶部的高度。这并不总是与上伸部的高度相同。\n\
  - **字符**：单个元素，如字母、数字或标点符号。\n- **压缩字体**：这是字体的较窄版本。它用于在给定空间内容纳更多字符。\n\n![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_135_0.png)\n\
  \n![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_135_1.png)\n\n![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_135_2.png)\n\
  \n![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_135_3.png)\n\n- **首字放大**：这是一种流行且有效的设计风格，其中第一个字母（大写字母）以更大的磅值设置并与第一行的顶部对齐。它常用于表示章节或文档新部分的开始。\n\
  \n![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_136_0.png)\n\n- **抬高大写字母**：这是一种设计风格，其中第一个大写字母以更大的磅值设置并与第一行文本的基线对齐。\n\
  \n![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_136_1.png)\n\n- **反白字**：这是在屏幕上以白底黑字或浅色底深色背景打印或显示的文字。\n\
  \n![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_136_2.png)\n\n- **左对齐文本**：文本左对齐，段落右边缘参差不齐。\n\
  - **居中对齐文本**：文本居中对齐，段落两边缘均参差不齐。\n- **右对齐文本**：文本右对齐，段落左边缘参差不齐。\n\nJustified：文本在左右两边均齐时称为对齐。\n\
  \n| 左对齐文本 | 右对齐文本 |\n|---|---|\n| John F. Kennedy's memorable inaugural address\
  \ is famous for his use of the word \"ask\" five times in three sentences: \"And\
  \ so, my fellow Americans: ask not what your country can do for you, ask what you\
  \ can do for your country.\" | John F. Kennedy's memorable inaugural address is\
  \ famous for his use of the word \"ask\" five times in three sentences: \"And so,\
  \ my fellow Americans: ask not what your country can do for you, ask what you can\
  \ do for your country.\" |\n| Center Text\nJohn F. Kennedy's memorable inaugural\
  \ address is famous for his use of the word \"ask\" five times in three sentences:\
  \ \"And so, my fellow Americans: ask not what your country can do for you, ask what\
  \ you can do for your country.\" | Justified Text\nJohn F. Kennedy's memorable inaugural\
  \ address is famous for his use of the word \"ask\" five times in three sentences:\
  \ \"And so, my fellow Americans: ask not what your country can do for you, ask what\
  \ you can do for your country. My\" |\n\n字距调整：这是对字母对之间水平间距的调整。它用于创造均匀性的视觉效果。\n\n\
  ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_137_0.png)\n\n字距/字母间距：这是对整块文本而不是仅字母对（字距调整）应用的调整。它用于提高可读性并在特定空间内容纳更多或更少的文本。在下面的插图中，第一行的字距设置为\
  \ 0（或正常），第二行的字距设置为 -100，因此所有字母都被拉得更紧，第三行的字距设置为 +70，因此字母之间有更多空间。\n\nAround the ragged\
  \ rocks the ragged rascal ran\nAround the ragged rocks the ragged rascal ran\nAround\
  \ the ragged rocks the ragged rascal ran\n\n## 创建文本框\n\n在第 3 章《规划你的网站》中，我们在创建线框模型并添加多个矩形（包括一个文本框）来容纳占位文本时，首次接触到文本框。\n\
  \n在第 4 章《强大的页面》中，我们将网站标题\"Windsurf Wild\"添加到主页面中，并在第 5 章《矩形的乐趣》中，我们向学习页面添加了一些文本内容。现在我们将继续向我们的冲浪网站添加文本内容。\n\
  \n在 Muse 中，如果尚未打开，请通过从菜单中选择 文件 | 打开站点 或点击 Muse 欢迎页面上冲浪网站的名称来打开你的网站。\n\n添加文本到页面有多种方法。我们可以执行以下任何操作：\n\
  \n- 绘制一个文本框然后直接在框中输入\n- 绘制一个文本框然后从其他来源复制文本，例如文字处理文档或互联网站点，并将其粘贴到文本框中\n- 通过从菜单中选择\
  \ 文件 | 置入 来放置 .txt（基本文本文件）\n\n我们在第 4 章《强大的页面》和第 5 章《矩形的乐趣》中已经看到如何首先绘制文本框来添加文本，但对于此练习，我们将选择第三个选项，即放置文本文件以向我们的装备页面添加一些文本：\n\
  \n- 1. 在计划视图中，双击装备页面以在设计视图中打开它。你会记得在上一章中，我们在此页面上添加了一个矩形来容纳图像，并调整了圆角以创建三种圆角和一个直角的混合。\n\
  - 2. 选择 视图 | 显示参考线，以便你可以使用参考线作为对齐图像和文本的辅助。\n- 3. 选择 文件 | 置入，然后浏览到第 6 章文件夹并选择 Gear.txt。你会立即注意到你的光标发生变化以显示已加载图标——它看起来类似于附着在光标上的迷你页面。\n\
  \n![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_138_0.png)\n\n4. 在 Windsurf Wild 文本下方单击，一个新的文本框将被添加，其中包含\
  \ Gear.txt 文档的内容。请注意页面会自动拉伸以容纳文本框。\n\n5. 在上一章中我们看到如何选择一个矩形，添加填充颜色，添加描边颜色，调整大小，添加圆角，并为其添加背景颜色。碰巧的是，文本框的行为方式相同。我们可以对文本框执行所有这些操作。\n\
  \n![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_139_0.png)\n\n> 如果你在矩形顶部创建文本框，随着你在文本框中添加文本，矩形会为你自动调整大小。这确保了\
  \ Muse 创建的网页会自动垂直拉伸以适应变化。\n\n## 清晰、有说服力且正确的內容\n\n虽然本章是关于排版的，但重要的是要提到实际内容至关重要，无论你选择什么字体。许多网站尽管设计精致度不足却能蓬勃发展，原因在于其内容出色。执行以下步骤以获得完美的内容：\n\
  \n- 清晰、正确且有说服力。\n- 不要犯愚蠢的拼写错误，因为 Muse 没有拼写检查器，不要犯事实错误，也不要离题啰嗦。\n\n## 编辑文本\n\n现在我们在装备页面上有了一些文本，让我们回去编辑它。以下步骤向我们展示如何操作：\n\
  \n- 1. 在设计视图中，选择 文本 工具。\n- 2. 选择你想要更改的文本。\n\n\n\n\n\n3. 我们可以使用屏幕顶部的控制面板（在选择文本工具后）或文本面板来编辑文本，通过选择\
  \ Window | Text 打开文本面板，如下图所示，如果它尚未可见：\n\n![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_140_0.png)\n\
  \n以下是在两个面板中都可用的选项：\n\n- **Font:** 你可以从网络安全字体列表（我们稍后会更详细地讨论网络安全字体）、网络字体或系统字体列表中选择一种字体。Muse\
  \ 会将非网络安全的系统字体导出为图像。网络安全字体和网络字体在它们旁边会有一个小地球图标。如果选择需要导出的字体，则在控制面板或文本面板的字体列表中以及工作区中文本旁都会出现一个小图像图标。\n\
  - 如果你想在工作区中隐藏该图标，请选择 View | Hide Rasterized Text Frame Indicators。\n- **Font size:**\
  \ 字体大小指定字体的大小，以像素为单位。有少量预定义的大小可供选择，或者你可以通过输入数字来指定特定的字体大小。\n- **Bold/Italic/Underline:**\
  \ 使所选文本变为粗体、斜体或下划线。\n- **Align:** 将文本段落设置为左对齐、居中、右对齐和两端对齐。\n\n- **Color:** 这让你可以设置文本颜色。要选择文本颜色，可以使用吸管工具，也可以使用颜色色块选择颜色，或通过输入\
  \ RGB 值或十六进制值来选择。\n- **Letter Space:** 又称为跟踪，字母间距可以增加或减少所选文本字母之间的间距。\n- **Leading:**\
  \ 这指定了文本行上方和下方之间的空间。行距是一个段落属性，这意味着在此处所做的任何更改都会影响所选段落中的每一行。行距字段接受百分比值（字体大小的百分比）或像素值。\n\
  - **Paragraph style:** 此值让你可以选择要应用于文本的预定义段落样式。通过使用段落样式，我们可以在网站上实现一致性并加快文本格式化速度。\n\
  \n大多数情况下，我们使用段落样式，因为我们倾向于处理文本行。然而，创建可应用于单个文本字符或少量单词的字符样式也是可能的。\n\n- **Character\
  \ style:** 让你可以选择要应用于文本的预定义字符样式。\n\n仅在文本面板中可用的以下选项：\n\n- **Indent:** 让你缩进所选文本的第一行。此字段中可以使用正值和负值（减号）。\n\
  - **Links:** 让你使用预定义的链接样式为文本设置样式。\n- **Left/Right margin:** 在所选文本的左侧或右侧边距中留出空间（类似于填充）。\n\
  - **Space before/after:** 指定所选段落之前（上方）或之后（下方）的空间量。\n\n> 将正文文本导出为图像并不是一个好的做法。图像文件与\
  \ HTML 文本一样不可调整大小或选择，并且对搜索引擎不友好。导出为图像文件的文本在浏览器中查看时不可选择或调整大小。\n\nWeb Fonts 在网络安全字体之上提供了数百种额外的字体。网络字体让你可以使用未安装在访客计算机上的字体。这为我们设计师打开了一个全新的排版世界。当你选择使用网络字体时，Add\
  \ Web Fonts 对话框会打开，如下图所示，提供所有可用字体的视觉概览。网络字体由 Typekit 服务提供。\n\n![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_142_0.png)\n\
  \n## Creating and applying paragraph styles\n\n使用段落样式允许我们为较大的文本块保存一组定义或规则，然后可以快速将其应用于我们选择的任何文本块。\n\
  \n假设例如，你希望你的块引用始终看起来相同，使用 Georgia、斜体、大小 12 且颜色为红色。你将选择一些文本，应用格式然后将其保存为段落样式。然后你可以通过将其应用于页面上的其他块引用来重用该段落样式。\n\
  \n你在任何页面上创建的任何段落或字符样式都可在整个网站中使用，而不仅仅是在创建样式的页面上。让我们现在创建一个段落样式，它将定义我们主正文文本的外观：\n\n\
  - 1. 在 Design 视图中，突出显示一段文本——比如段落中的一行——然后在文本面板中设置以下值：\n  - Font: Arial\n  - Size:\
  \ 12\n  - Left Alignment\n  - Colour: Dark Navy or Hex 000090\n  - Line Spacing:\
  \ 140%\n- 2. 在段落样式面板中（如果看不到面板，请选择 Window | Paragraph Styles），点击右下角的 Create New Styles\
  \ 按钮。\n- 3. 通过双击它并在文本框中输入描述性名称来重命名新样式。在本例中将其命名为 Body Copy。\n\n![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_143_0.png)\n\
  \n![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_144_0.png)\n\n你会注意到已经列出了一些段落样式。这些是我们创建网站线框模型时在第\
  \ 3 章 Planning your Site 中创建的样式。你可以创建任意数量的样式。\n\n- 4. 若要将段落样式应用于你在 Gear 页面上放置的所有文本，请使用文本工具单击一次文本框中的任意位置，使光标在文本中闪烁。然后快速单击三次以选择文本框中的所有文本。\n\
  \n> 单击一次文本框即可在该文本框内的任何位置放置光标。双击可选择一个单词，三击可选择整行文本，四击可选择文本框中的所有文本。\n\n- 5. 现在让我们将新创建的\
  \ Body Copy 段落样式应用于我们在上一章中添加到 Learning 页面的文本。转到 Plan 视图，然后双击 Learning 页面以在 Design\
  \ 视图中打开它。\n- 6. 在 Learning 页面上，使用 Select 工具，简单地单击一次以选择页面上的文本框。\n\n7. 在选择文本框后，单击你刚刚创建的\
  \ Body Copy 样式，你会看到 Learning 页面上的文本格式立即发生变化。文本应显示与你在 Gear 页面上应用的格式相同的格式。请注意，Learning\
  \ 页面上的链接仍然是白色的。\n\n![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_145_0.png)\n\n8. 若要编辑段落样式，请在段落样式面板中选择该样式，进行编辑，然后单击面板右下角的\
  \ Redefine Selected Styles 按钮。\n\n试试看，将正文中的文本颜色更改为亮黄色。注意文本在 Learning 页面和 Gear 页面上的颜色如何变化。尝试更改文本大小、行距和字体。当你完成实验后，将正文恢复到原始设置，并不要忘记单击段落样式面板底部的\
  \ Redefine Selected Styles 按钮。\n\n9. 如果你想从一段文本中删除特定样式，可以选择已应用样式的文本片段，然后从段落样式面板中选择\
  \ None。\n\n## Creating and applying character styles\n\n正如我们所见，段落样式非常适合多行或文本块，但如果我们想创建样式并仅将其应用于某些单词会怎样？这就是字符样式发挥作用的地方。使用字符样式允许我们为特定的一组字符或单词保存一组定义或规则。\n\
  \n假设例如，你想在页面上突出显示某些单词，我们是这样做的：\n\n- 1. 在 Design 视图中，在 Learning 页面上突出显示第一行中的单词 novice。然后在文本面板中设置以下值：\n\
  \  - Font: Arial\n  - Size: 12\n  - Bold and Italic\n  - Color: Bright Yellow\n\
  - 2. 在字符样式面板中（Window | Character Styles），单击右下角的 Create New Styles 按钮。\n- 3. 通过双击它并在文本框中输入描述性名称来重命名新样式。将其命名为\
  \ Bold Yellow。\n- 4. 现在你已创建字符样式，可以将其应用于页面上的任何其他文本。在 Learning 页面上，找到单词 Beginner 或\
  \ Beginners。突出显示该单词的每个实例并通过在字符样式面板中单击其名称来应用新样式。\n- 5. 若要编辑字符样式，请在字符样式面板中选择该样式，进行更改，然后单击面板右下角的\
  \ Redefine Selected Styles 按钮。\n- 6. 如果你想取消文本中特定字符样式的链接，请单击字符样式面板右下角的 Unlink Style\
  \ 按钮。\n\n![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_146_0.png)\n\n\n\n\n\n## 在“字符和段落样式”面板中使用上下文菜单\n\
  \n当你在操作样式面板时，可以通过右键单击或 Ctrl + 单击任意样式来查找额外选项。你会看到以下选项：\n\n- New Paragraph Style\n\
  - Duplicate Style\n- Delete Style\n- Unlink Style\n- Clear Overrides\n- Redefine\
  \ Style\n- Rename Style\n- Style Options\n- Delete Unused Styles\n\n![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_147_0.png)\n\
  \n## 标题\n\n在网页设计中，我们使用标题有几个原因，其中一些原因如果你是新手可能并不完全明显。标题让我们能够组织内容，在每个页面上传达逻辑层次，有助于无障碍访问，并作为搜索引擎优化（SEO）的辅助。让我们逐一查看这些。\n\
  \n## 内容组织和层次结构\n\nHTML 标题标签被创建出来为网页提供结构。H1 或标题 1 是最重要的标题。它通常是页面上最大、最粗的文字。标题从 H1\
  \ 到 H6，越往后越小，从 H1 到 H6 逐渐变小。重要的是始终从 H1 开始，然后一次一个级别地向下移动。你可能会发现我们不需要超过 H3，但为了创建有组织的网页，我们可能需要这样做。这就是\
  \ HTML 标题标签被使用的特定目的——为你的文档结构化。你应该始终从 H1 元素开始，然后一次一个级别地移动到其他级别。例如：\n\n- H1\n- H2\n\
  - H2\n- H3\n- H4\n- H5\n- H6\n- H6\n- H5\n- H4\n- H3\n- H2\n\n重要的是在每个页面上使用 H1 或标题\
  \ 1。如果你认为你的网站中的每个页面都应只关注一个主题，那么该主题的名称或标题将是页面上最高级别最重要的标题。每个页面上真的只能有一个 H1。\n\n## 标题与无障碍访问\n\
  \n使我们的网页无障碍意味着使我们的网站可供残疾人士使用。这可能包括：\n\n- 使用屏幕阅读器的视力障碍人士\n- 使用无声音浏览器的听力障碍人士\n- 身体障碍人士\n\
  - 色盲人士\n\n通过正确使用标题，我们可以使使用辅助设备的用户更容易阅读页面。因为标题表示文档中重要文本的开始，屏幕阅读器使用标题作为锚点。页面变得更容易阅读，因为相关内容可以在不必阅读页面上每个单词的情况下访问。\n\
  \n## 标题与 SEO\n\n这是正确使用标题的一个经常被忽视的好处。搜索引擎对标题中的文本给予额外的强调或重要性。标题标签越高，该文本被认为越重要。H1 标题在搜索结果中的权重高于\
  \ H6 标题。\n\n## 创建标题\n\n如前所述，我们使用标题为页面提供结构，我们可以使用段落或字符样式来定义这些标题的外观。这就是我们现在要做的：\n\n\
  1. 如果尚未打开，请在设计视图中打开 Learning 页面。\n2. 选择文本工具并在 Windsurf Wild 文本标志下方拖出一个文本框。\n3. 输入文字\
  \ Learn How to Windsurf。\n4. 突出显示你刚刚输入的文字，然后通过控制面板或文本面板应用以下格式：\n5. Font: Arial\n\
  6. Size: 36\n7. Bold\n8. Color: Navy (#000090)。\n9. 在段落样式面板中，单击“创建新样式”按钮。\n10. 双击新的段落样式并在样式选项对话框中将其命名为\
  \ Heading 1。从段落标记下拉菜单中选择 Headline (H1)。这就是我们告诉 Muse 这段特定文本是页面上最重要的文本的方式。\n\n![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_150_0.png)\n\
  \n于是我们的标题 1 样式就创建好了。让我们在 Gear 页面上应用它：\n\n1. 在设计视图中打开 Gear 页面。\n2. 在 Windsurf Wild\
  \ 文本标志下方添加一个文本框。使用你的 X 和 Y 坐标确保新的文本框与 Learning 页面上的位置相同。\n\n> 在添加新的文本框之前，你可能需要先将正文向下移动。\n\
  \n3. 输入文字 Windsurf Gear。\n4. 突出显示文字（或文字的任何部分，因为我们正在应用段落样式），然后单击你创建的 Heading 1 段落样式。\n\
  \n你的文字现在应按段落样式中定义的格式完全格式化。\n\n## 更改文本大小写\n\n假设我们希望标题 1 全部为大写，我们可以按如下方式更改文本大小写：\n\
  \n1. 在设计视图中，确保已选择文本工具。\n2. 选择文字 Windsurfing Gear。\n3. 选择 Edit | Change Case | UPPERCASE。这会将所选文本更改为全部大写，如以下屏幕截图所示，但它并未更改我们的段落样式。我们需要手动选择希望更改为大写的任何文字。\n\
  \n![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_151_0.png)\n\n## 文本环绕\n\n在网页的文本内容中看到信息框或图像出现并不罕见。文本框内的文本框有时被称为标注，它们用额外信息补充主要文本。\n\
  \nMuse 通过让我们环绕矩形、另一个文本框或图像等对象来环绕文本，从而轻松创建标注。在以下步骤中，我们将剪切 Gear 页面上当前存在的图像并将其粘贴到本章开头创建的文本框内。然后我们将使文本环绕图像，使其流畅。\n\
  \n1. 在设计视图中打开 Gear 页面。目前它由一个标题、一个文本框和一个包含两名风筝冲浪者图像的矩形组成。\n2. 使用选择工具选择页面右侧的图像。\n\
  3. 选择 Edit | Cut，将图像从页面剪切到剪贴板。\n4. 使用选择工具单击文本框，然后拖动文本框右侧的其中一个手柄，使框架几乎填满页面的宽度。\n\
  5. 然后，使用文本工具在文本框中定义文本插入点。在第一段第一行的单词 In 之前单击一次。粘贴之前复制的元素（Edit | Paste）以将对象作为内联元素插入文本框中。\n\
  \n图像现在位于文本框内，但看起来有点别扭，因为所有文本都已降到其下方。查看屏幕顶部控制面板中的环绕选项。\n\n6. 在以下环绕选项之间进行选择：\n   -\
  \ Inline in text\n   - Position left\n   - Position right\n\n7. 单击每个环绕选项，以便你可以看到图像位置如何变化以及文本如何环绕它。\n\
  \n![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_153_0.png)\n\n文本紧贴图像边缘，使其没有呼吸空间。为了在内联元素（图像）周围留出一些填充，我们将添加偏移值。\n\
  \n8. 单击控制面板上的环绕下拉框。在图像右侧添加 10 像素的填充，在底部添加 5 像素。\n\n![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_153_1.png)\n\
  \n> 每当文本环绕元素时，请确保该元素不要太宽以至于使文本区域过窄。这会使文本变得非常难以阅读。\n\n## 网页安全字体\n\n存在一个字体族列表，这个列表被称为安全列表。它由一系列默认受\
  \ Windows PC 和 Apple Mac 计算机支持的字体族组成。\n\n使用这些字体在你的网站上是安全的，因为基本上每个人都已在他们的计算机上安装了它们。这意味着如果你使用\
  \ Georgia 等字体（在列表中），可以安全地假设访问你网站的每个人都会看到你打算让他们看到的漂亮排版。\n\n![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_154_0.png)\n\
  \n现在假设你创建了自己非常、非常、非常想使用的漂亮字体，但只有你和世界上另外两个人拥有它，那么问题是其他所有人访问你的网站时都看不到该字体。他们会看到替换字体或默认字体（可能是\
  \ Times New Roman 之类的），你选择字体的所有辛苦工作都将付诸东流。\n\n因此，作为 Muse 设计师，你有三个选择。你可以坚持使用网页安全字体，这样你就知道访客会按你预期的方式看到网站的字体。你可以使用\
  \ Typekit 或（我们真的希望尽可能避免这个选项）你可以将文本替换为图像。这意味着如果你想使用其他人没有的独特字体，Muse 会将文本转换为图像，该图像将在你发布网站或导出\
  \ HTML 时导出。\n\n安全列表的缺点是它在字体数量和每种字体类别内的样式（粗体、斜体、常规）种类方面都有限。\n\n\n\n\n\n使用图像代替文字的缺点是搜索引擎无法像读取文字那样读取图像。因此，如果你想使用这种方法，只使用在标题上。不要将其用于正文内容。\n\
  \n## 元数据 – 页面上的隐藏文本\n\n在上一节中，我们研究了标题与 SEO 相关的的重要性。另一个需要考虑的重要因素是页面的元数据。\n\n元数据是关于数据的数据。简单来说，它是关于网页的信息。它对你的访客不可见，但对访问你网站的搜索引擎可见。元数据存储在隐藏在\
  \ HTML 文档的 <head> 中的 meta 标签中。由于我们使用的是 Muse，我们不需要担心 <head> 和 <body> 标签，但我们仍需要在每个页面中添加元数据。\n\
  \n在 SEO 中使用的两个最重要的 Meta 标签是 description 和 keywords。以下是我们如何添加它们的方法：\n\n- 1. 在设计视图中打开\
  \ Gear 页面，选择 Page | Page Properties。页面属性对话框打开。\n- 2. 单击 Metadata 选项卡以查看类似于以下屏幕截图的窗口：\n\
  \n![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_155_0.png)\n\n以下是 Metadata 类别中选项的简要说明：\n\
  \n- - **Description** 指定页面的描述。\n- - **Keywords** 指定页面的关键词。\n- - **HTML for <head>**\
  \ 允许我们将 HTML 代码放置到 Muse 页面中。一个例子是添加 Google Analytics 代码来跟踪页面的访问者数量。\n- - **Page\
  \ Name** 是页面在 Muse 中显示的名称。\n- - **Page Title** 是在浏览器中显示的页面标题。如果希望 Muse 也使用页面名称作为页面标题，请选择\
  \ **Same as Page Name** 选项。 （这是默认选择。）使用描述性的页面标题可以帮助你的 SEO 工作，同时为访客提供页面内容的快速概览。\n\
  - - **File Name** 是在浏览器中加载的文件名。Muse 默认会在文件名后附加 `.html` 文件扩展名。如果希望 Muse 也使用页面名称作为文件名，请选择\
  \ **Same as Page Name** 选项。 （这是默认选择。）\n- - 你需要单独为网站中的每个页面添加元数据。每个页面只需一两分钟，是整体 SEO\
  \ 工作的重要组成部分。\n\n## 总结\n\n在本章中，我们研究了如何在网页上添加和设置文本样式。我们看到了如何将图像和文本结合起来，包裹在文本框中。我们讨论了标题从组织和\
  \ SEO 角度的重要性，以及如何向页面添加对人类访客隐藏的元数据。\n\n在下一章中，我们将学习如何在 Muse 中处理图像以及如何从 Photoshop 导入图像。\n"
- '## 7


  ## 处理图像


  在设计网页时，我们使用引人注目且有趣的图像作为访客的视觉焦点。图像用于从背景图像到项目符号等一切内容。在本章中，我们将向网站添加图像，转换它们，改变它们的透明度，并了解
  Muse 如何与 Photoshop 紧密集成。


  在本章中，你将学习以下主题：


  - - 为图像选择合适的格式

  - - 放置图像

  - - 复制图像

  - - 调整图像大小、旋转、裁剪和定位

  - - 为图像添加效果

  - - 设置图像不透明度

  - - 固定图像

  - - 从其他程序粘贴图像

  - - 使用图像作为背景

  - - 将多个对象组合在一起作为单个对象处理


  在内容中使用图像可以成为吸引访客注意力和传达信息的有力方式。图像可以将人们引导到他们在快速浏览时可能没有注意到的页面部分。如果使用得当，它们是引导访客视线到你希望他们关注的地方的有力工具。


  ## 你好，网页友好图像


  在设计网站时，我们需要记住， destined for the Web 的图像需要相应地准备。与印刷世界中可以使用非常大文件大小和非常高分辨率不同，在 Web
  上我们需要在图像文件的小尺寸和高质量图像之间做出权衡。在我们甚至打开 Muse 之前，我们通过以下步骤做出这种权衡：


  - 1. 设置图像的正确尺寸和分辨率：你需要决定图像应该有多大，并在将其带入 Muse 之前以该尺寸保存。虽然可以在 Muse 中调整图像大小（我们很快就会研究），但在
  Photoshop、Illustrator 或你使用的任何图形编辑器中以正确尺寸保存图像是良好的做法。

  - 2. 决定要使用的文件格式：Web 上使用的图像文件保存为 JPEG、GIF 或 PNG。几乎所有网络浏览器都识别并兼容这些文件格式。 （每个文件格式已在
  Choosing the best file format 部分中解释。）

  - 3. 保存并压缩文件：如果你使用 Photoshop 或 Illustrator 创建图像，请选择 File | Save for Web & Devices
  将图像缩放到尽可能小的同时保持质量合理地高的文件大小。如果你使用其他图形编辑器，请选择 File | Save As 以 JPEG、GIF 或 PNG 格式保存文件。


  遵循这些步骤将产生看起来不错且下载速度快的图像。


  ## 选择最佳文件格式


  在开始在网站上疯狂使用图像之前，我们需要了解一些关于可在 Web 上使用的图像文件格式类型的基础知识，以及如何为任务选择最佳格式。如前所述，有三种图像格式几乎被所有网络浏览器支持。你选择的格式取决于图像中有多少颜色以及是否具有透明区域。


  它们如下：


  - 1. JPEG

  - 2. GIF

  - 3. PNG


  以下是每种图像文件格式的概述：


  ## JPEG


  JPEG (.jpg) 代表联合摄影专家组，开发用于存储摄影图像。该格式支持数百万种颜色，但被称为有损格式，意味着它丢弃精细细节以将图像压缩为更小的文件。


  好消息是我们可以在保存图像为 JPEG 格式时选择压缩级别。可以将压缩量设置为 0-100 的比例（0 是最高压缩和最低质量；100 是最低压缩和最高质量）。


  与 GIF 和 PNG 图像不同，JPEG 图像可以在 24 位颜色下提供相当小的文件大小。这使它们非常适合任何类型的摄影或具有重质感或长渐变的图形。


  为了避免保存 JPEG 图像时可能出现的视觉伪影，请仔细考虑要应用的压缩量。如果图像看起来很糟糕，那么拥有极小的文件大小毫无意义。在下一个屏幕截图中，你可以看到一个图像面板，显示图像在无压缩时（左上角）、70%
  质量、35% 质量和 17% 质量时的外观。质量越低，压缩越大。你可以看到图像在较低质量时开始出现像素化。


  ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_160_0.png)


  ## GIF


  图形交换格式（GIF）是处理纯色块、例如徽标或没有渐变的线条艺术时不错的选择。假设你希望网站上的徽标无缝融入网页背景，你可以将图像保存为无背景并保存为 GIF。JPEG
  在这种情况下不起作用，因为所有图形编辑器都会在 JPEG 中任何空白处自动粘贴纯色背景。


  GIF 仅支持 256 种颜色，因此不适用于需要数百万种颜色的摄影图像。


  GIF 也可以是有损格式，如果你希望它有损的话。奇怪的是，质量刻度与 JPEG 相反，即 0 是无损，100 是完全有损。如果你不想使用有损压缩，可以通过将图像中包含的颜色数量限制在
  2 到 256 之间来改变文件大小。颜色越少，文件大小越小。


  GIF 格式最重要的功能之一是它支持透明度。这意味着你可以透过图像的某些部分，去除保存为 JPEG 时会出现的那种方形外观或周围的白色框。在以下屏幕截图中的图像中，棋盘格代表图像的透明区域：


  ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_161_0.png)


  GIF 的另一个不错功能是它们支持动画。你可以使用动画 GIF 创建迷你幻灯片或简单的广告。动画 GIF 只是一个循环播放一系列图像的文件，创造出动画的错觉。






  ## PNG


  便携式网络图形（PNG）格式几乎可以被视为 JPEG 和 GIF 格式的后代。它由 W3C 开发，作为 GIF 的替代方案，并且同时支持透明度和数百万种颜色。


  PNG 图像有两种类型。它们是 PNG 8 和 PNG 24。数字反映了每种格式中保存的位数。PNG 24 支持数百万种颜色并产生超高质量的图像，但文件大小往往相当大。PNG
  8 支持 256 种颜色。两种文件格式都支持透明度。PNG 是一个相对较新的格式。如果您知道您的网页受众正在使用旧版本的 Internet Explorer，那么最好坚持使用
  GIF，否则在最新的浏览器上使用 PNG 是安全的。


  在下一个屏幕截图中，您可以看到一件 T 恤的照片以 PNG 格式保存，左侧背景透明，右侧背景为渐变：


  ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_162_0.png)


  ## Web 安全颜色——过去的事物？


  在第 6 章《排版》中，我们讨论了网页安全字体这个概念以及网络在这一点上已经有所发展。网页安全颜色的概念也在走向灭绝，除非您知道目标受众使用的是只能显示 256
  种颜色的古老显示器，否则它并不是一个真正需要考虑的问题。


  为了简要地上一堂历史课，网页安全颜色是少于 256 种颜色的小调色板，可以在 Windows 电脑和 Mac 电脑显示器上正确显示。今天的显示器可以显示数百万种颜色；甚至您口袋里的手机今天处理的颜色也比那些旧显示器多。


  ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_163_0.png)


  如果您使用 Photoshop 或 Illustrator 创建图形，您会看到当您选择 **另存为 Web 所用 & 设备** 时，您仍然可以通过使用 **颜色表**
  部分将图像中的颜色转换为其网页安全等效颜色。您也可以通过在两个程序中的 **色板** 面板上使用上下文相关菜单来查看网页安全颜色调色板。然而，对于网页图形，我们几乎不可能再需要使用该选项。


  ## 将图像放到页面上


  现在我们知道了哪些类型的图像适合网页，我们就可以将它们放到我们的页面上了。在 Muse 中，图像的行为与矩形相同。


  ### 放置图像


  在第 5 章《矩形的乐趣》中，我们看到了如何通过绘制矩形并向其添加图像来插入图像。现在我们将通过执行以下步骤了解如何将图像放置到我们的 Windsurfing
  页面之一中：


  - 1. 打开我们一直在处理的 Windsurfing 网站。

  - 2. 在计划视图中，双击 Sails 页面以在设计视图中打开它。打开标尺和参考线以帮助您在页面上定位图像。

  - 3. 在设计视图中，选择 文件 | 放置。

  - 4. 浏览并选择您想要放置在页面上的图像或图像，然后单击 打开（Windows）或 选择（Mac OS）。您可以通过按住 Ctrl 键（Windows）或
  Cmd 键（Mac OS）同时单击来一次选择多个图像。在本练习中，我们将先添加一张图像。

  - 5. 从本章的文件夹中选择 sails.jpg 图像。


  > 注意：如果您一直按照书中的练习进行操作，您的 Sails 页面将具有红色背景，我们在第 4 章《强大的页面》中设置了它。我们将很快将其改回，以便与网站其余部分的蓝色背景相匹配。


  - 6. 光标变为放置枪，我们用它将图像或图像放置在页面上。如果您在装填枪时选择了多个图像，只需单击相同次数即可一次一个地将每个图像放置在页面上。


  ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_165_0.png)


  - 7. 现在，单击一次以按原始大小（100%）将图像放置在页面上，使其与 Windsurf Wild 文本下方对齐，大约距离页面顶部 150 像素。我们稍后会更精确地定位图像。一旦您单击，您的图像就会被放置在页面上。


  ### 添加替代文本


  为网站上的所有图像添加替代文本标签非常重要。它有助于使网站对每个人都更易于访问。替代文本会在浏览器无法显示图像时出现，并会被屏幕阅读器读取。为了添加替代文本，请执行以下步骤：


  - 1. 右键单击或控制单击您已添加到页面的图像。

  - 2. 从出现的上下文菜单中，选择 替代文本。图像属性对话框打开。

  - 3. 填写文本标题和替代文本。


  ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_166_0.png)


  图像标题应提供有关图像的附加信息。标题在使用某些浏览器时会在您将鼠标悬停在图像上时弹出。


  替代文本主要用于可访问性目的，并会被爬虫读取。


  ### 图像上下文菜单


  当我们将图像添加到页面时，除了替代文本和添加标题之外，您还可以通过上下文菜单获得许多其他选项。


  ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_166_1.png)


  右键单击（或 Control 单击）页面上的图像以查看上下文菜单出现。以下选项可用：


  - - **适配：** 这里有两个选择：**按比例适配内容** 和 **按比例填充框架**。**按比例适配内容** 选项按比例缩放图像，使其在显示区域内保持纵横比。**按比例填充框架**
  选项在需要时裁剪图像，以确保显示区域完全填满。

  - - **编辑原件：** 如果您在页面上使用了 Photoshop PSD 文件或 Fireworks PNG 文件，这是一个很棒的选项。这些文件可以被视为主源图像文件，您可以单击
  **编辑原件** 并对文件的主版本进行更改，以保持两个副本同步。如果您将图像复制并粘贴到页面上，则此选项不可用。

  - - **锁定：** 这会将图像锁定在页面上的位置，这意味着图像在解锁之前无法被选中。这与稍后我们将要查看的固定不同。


  ### 操作图像


  在本节中，我们将了解图像放置在页面上后如何操作它。我们将查看调整大小、旋转、定位、复制和裁剪。所有这些功能在 Muse 中都非常简单。


  ### 调整图像大小


  调整图像大小最好通过在图形编辑器中更改图像的实际大小然后再次上传到网站来完成。但是，如果由于某种原因您无法访问图形编辑器，可以使用 Muse 调整其大小。以下是执行此操作的步骤：


  - 1. 在 **设计** 视图中，单击图像以选择它。

  - 2. 拖动调整大小手柄以调整图像的宽度或高度。您会注意到无论您选择从哪个手柄拖动，Muse 都会按比例约束图像。


  - 3. 调整大小的另一种方法是使用控制面板中的 **宽度** 和 **高度** 选项输入图像的精确宽度和高度值。


  ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_168_0.png)


  ### 旋转图像


  旋转图像很容易。有两种方法可以做到。它们如下：


  - 1. 通过单击选择要旋转的图像，然后将鼠标悬停在图像角落直到看到旋转图标，然后单击并拖动以手动旋转图像。


  ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_169_0.png)


  - 2. 在选择图像的情况下，在控制面板中增加或减少旋转角度。（旋转角度选项是控制面板中最右边的选项。）


  ### 定位图像


  同样，将图像定位到您想要的任何位置也非常容易，再次有两种方法可以做到。它们如下：


  - 1. 选择要定位的图像，然后简单地将图像拖到适当的位置。


  ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_169_1.png)


  - 2. 您可以使用控制面板中的 X 和 Y 选项为图像设置精确的 X 和 Y 坐标。将 X 值设置为 44，将 Y 值设置为 160。






  ## 复制图像


  如果你想制作图像的精确副本，可以通过以下两种方法之一来完成：


  - 1. 如果你使用的是 Windows，单击图像，按住 Alt 按钮并拖动它。对于 Mac OS 用户，单击图像，按住 Option 按钮并拖动图像。


  ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_170_0.png)


  - 2. 选择 编辑 | 复制。 如果复制到不同页面，则复制并粘贴是另一个选项。 如果你想将图像放置在第二页的完全相同位置，请选择 编辑 | 放置在原位。


  ## 裁剪图像


  在某些情况下，通过裁剪照片我们可以创建更有趣的图像。通过减少图像中不必要的背景，我们可以营造出更强烈的戏剧感，或者通过改变图像的焦点使其更引人注目。理想情况下，你应该在图形编辑器中进行裁剪，然后将图像导入
  Muse，但有时为了节省时间，我们可以在 Muse 中全部完成。


  > 在其他情况下，背景提供了重要的上下文感，绝对不应被移除。


  在下面的练习中，我们将向 **Boards** 页面添加一张图像，然后通过执行以下步骤裁剪掉部分背景：


  - 1. 在 **设计** 视图中打开 **Boards** 页面。 使用 *放置图像* 部分概述的步骤，将 Boards.jpg 图像添加到页面中。

  - 2. 这是一张相当大的图像，当你将其放置在页面上时，右侧会重叠页面的边缘。 你会发现将缩放比例缩小到约 75% 放大很有用，这样当我们使用 **裁剪** 工具时可以看到图像上的手柄。

  - 3. 在图像仍处于选中的状态下，单击 **工具** 面板中的 **裁剪** 工具。

  - 4. 拖动图像左侧和右侧的手柄，将原始图像裁剪为较窄的图像，宽度约为 420 像素。 拖动图像顶部和底部的手柄，将其垂直裁剪为高度约为 600 像素。


  ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_171_0.png)


  - 5. 将顶部调整大小手柄向下拖动以裁剪掉板子上面的天空。 在拖动时检查控制栏上的高度，并将图像裁剪为高度 450 像素。


  6. 如果你愿意，可以重新定位裁剪区域内的图像。 为此，将鼠标悬停在图像上，直到在图像中心看到圆形图标。 抓住圆圈并在裁剪蒙版内移动图像，直到它看起来像下一个屏幕截图：


  ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_172_0.png)


  7. 最后，使用屏幕顶部控制栏中的字段，将新裁剪的图像定位在 X 坐标设置为 44，Y 坐标为 160 像素。


  ## 为图像添加效果


  你可以以与我们在第 5 章《矩形的乐趣》中将它们添加到矩形相同的方式，为图像添加诸如投影、浮雕和发光等效果。 请参阅有关向矩形添加效果的部分。


  ## 从其他程序粘贴图像


  假设你一直在另一个程序（如 Adobe Photoshop 或 Illustrator）中处理图像，并且想快速将其导入 Muse，这只是一个简单的复制和粘贴操作。


  你需要执行以下步骤：


  - 1. 在另一个程序中，例如 Photoshop，使用菜单选项复制你的图像，或按键盘上的 Ctrl + C（Windows）或 cmd + C（Mac OS）。

  - 2. 在 Muse 中以设计视图打开你想要放置图像的网页，并通过选择 编辑 | 粘贴，或使用计算机键盘上的 Ctrl + V（Windows）或 cmd +
  V（Mac OS）粘贴图像。


  ## 使用背景图像


  我们将返回并对蓝色母版页进行一些更改，然后将该母版应用于我们的两个红色齿轮页面。 蓝色母版页目前包含临时标志文字 Windsurf Wild，我们将用半透明的标志图像替换它。


  ## 添加标志


  大多数网站在每个页面的顶部都包含相同位置的标志。 通常标志也是通往主页的链接。 在以下步骤中，我们将在我们的网站上实现这一点。


  - 1. 在计划视图中，双击蓝色 A-Master 页面。

  - 2. 在页面上任意位置右键单击并从上下文敏感菜单中选择 显示页眉和页脚。 你会看到水平指南出现，表示页面顶部和底部的页眉和页脚区域。

  - 3. 单击文字 Windsurf Wild 以选择它，然后按键盘上的 Delete 键删除文字。

  - 4. 选择 文件 | 放置 并浏览选择 logo.png 图像。 单击一次放置图像。


  5. 使用控制栏，将 X 位置设置为 44，Y 位置设置为 0。


  ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_174_0.png)


  ## 为标志添加链接


  我们希望我们的标志成为返回主页的链接。 当有人单击标志时，他们将始终被带到主页。 这为每个页面提供了连贯性。


  在标志仍处于选中的状态下，单击控制栏上 旁边的下拉菜单。 从页面列表中选择 主页。


  ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_174_1.png)


  ## 使用平铺图像作为背景


  要将图像用作对象或页面的背景，我们需要将对象或页面的填充设置为图像。 在此练习中，我们将向 A-Master 页面的背景添加一个小的渐变图像。 这里的技巧是水平平铺图像以呈现大型背景图像的视觉效果。
  步骤如下：


  - 1. 如果尚未打开，请在设计视图中打开 A-Master 蓝色页面。


  - 2. 确保页面上没有任何内容被选中。 单击控制栏上的文字 浏览器填充。 在下拉菜单上，单击文件夹图标并浏览找到 Background-Gradient.png
  图像，然后单击 打开。


  - 3. 将 适配 选项设置为 水平平铺。 这会导致小图像在整个页面上重复。 现在的问题是渐变图像只有 400 像素高，渐变图像结束处颜色变化非常突然。 为了解决这个问题，我们必须将背景颜色设置为与渐变底部相同的颜色。


  ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_175_0.png)


  - 4. 单击 **颜色** 样本。 颜色选择器面板打开。

  - 5. 单击面板右上角的 眼滴管 工具，然后单击背景渐变图像的底部。 一旦你单击，背景颜色就会改变，我们就获得了渐变图像继续向下延伸的错觉。 这种方法的优点是，我们使用了一个小图像，宽
  30 像素，高 400 像素，现在却呈现出一个填充页面背景的更大图像的视觉效果。


  ## 使用摄影图像作为背景图像


  摄影图像作为背景在网络上已流行多年。 作为额外练习，我们将通过执行以下步骤添加一张宽 1280 像素的大图像：


  - 1. 在 **A-Master** 页面上，确保没有任何内容被选中，然后单击控制栏上的 **浏览器填充** 按钮。

  - 2. 单击文件夹图标选择图像。 选择 `1280RobbieNaish.jpg` 图像并单击 **打开**。

  - 3. 单击 **位置** 网格中的中心点。 尝试顶部居中、中间居中和底部居中，看看图像位置如何变化。


  4. 如果你希望图像保持不动，同时允许其余内容在其上方滚动，请关闭 滚动 复选框。


  ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_177_0.png)


  就这么简单地添加一张大摄影图像。


  现在你已经知道如何添加摄影背景，作为练习尝试使用你自己的一些图像作为背景，看看效果如何。


  查看以下有关使用背景图像的提示：


  - - **确保你的背景不会分散内容的注意力。** 当你为网站创建固定宽度设计时（这目前是 Muse 中创建的所有网站的情况），浏览器窗口的一部分将显示背景。
  你可以选择纯色背景或添加背景图像。

  - 选择背景颜色时，确保背景与正文文字之间有足够的对比度。 这意味着使用较暗的背景颜色配浅色文字，或使用浅色背景配非常深色的文字。 下表左侧显示了对比度不佳的示例，右侧显示了对比度良好的示例：


  ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_178_0.png)


  我们还可以设置背景，使其完全或部分填充图像。 除非另有指定，否则背景图像会自动由浏览器一遍又一遍地重复。 这称为平铺，通过选择合适的图案或图像，我们可以给人一种巨大的图像填充网站背景的印象，而实际上我们只是反复使用一个小图像。


  如果你想为网站背景使用复杂图像或照片，请仔细考虑它对上方文字的影响。 问问自己，使用图像是否会造成杂乱。 背景中的图案如果细微或褪色且仅使用一两种色调，通常效果很好。
  全彩图案可能非常分散注意力，因此请谨慎使用。


  为了让本网站保持简单明了，请将 Windsurfer 的背景图像替换为我们之前应用的蓝色渐变。






  ## 固定图像


  在某个阶段，你可能访问过一个网站，该网站上有一个小徽章或丝带浮动在特定位置并且不会移动。它会持续地停留在页面上。这种效果是通过将图像固定在原地创建的。固定功能是设计师工具箱中的一个强大工具。它使我们能够跳出网格，让内容围绕固定的图像流动。


  要将图像固定到特定位置，请使用以下步骤中解释的固定工具：


  1. 在设计视图中，打开蓝色的 A-Master 页面。

  2. 将 PinningWind surfer.png 图像放置在页面上并保持图像被选中。

  3. 在控制面板上，单击固定工具中的一个位置，以指定你希望相对于浏览器如何固定图像。选择顶部居中的固定点将使图像相对于浏览器顶部居中进行固定。选择右下角的固定点将使图像相对于浏览器右下角进行固定。预览内容页面在浏览器中的最佳方式是查看固定效果如何工作。


  ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_179_0.png)


  ## 使用资源面板管理网站文件


  资源面板显示我们在网站上使用的任何图像文件的名称，而不仅仅是当前页面上的图像。你可以通过选择窗口 | 资源来打开资源面板。右键单击（或按住 Ctrl 并单击）资源面板中的文件名以使上下文菜单出现。如果你使用过
  Adobe InDesign，此面板称为链接面板。


  ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_180_0.png)


  资源面板上下文菜单包含以下选项：


  - 重新链接：此选项允许你重新连接在页面上放置后已被移动的文件。当你单击此选项时，使用出现的重新链接窗口导航到文件，并选择它以指定其新的位置给 Muse。

  - 转到资源：单击此选项将带你到图像或资源所在的页面。

  - 嵌入链接：添加一个链接图标，其中包含资源在本地计算机上的位置路径。

  - **编辑原始文件**：如果你在页面上使用了 Photoshop PSD 文件或 Fireworks PNG 文件，这是一个很棒的选项。这些文件可以被视为主源图像文件，你可以单击**编辑原始文件**并对文件的
  master 版本进行更改，以保持两个副本同步。如果将图像复制并粘贴到页面上，则此选项不可用。

  - **在资源管理器中显示**：这将打开**文件资源管理器**（Windows）或**查找器**（Mac）并显示包含网站资源的目录，从而轻松找到特定文件。

  - **复制完整路径**：将资源在本地计算机上的路径复制到计算机的剪贴板。


  ## 将对象分组以作为单个对象一起操作


  你可以将多个选中的对象（包括图像、矩形和文本框）分组为单个组，以便轻松控制页面上一组项目的位置。


  1. 使用**选择**工具选择两个或多个对象。按住 *Shift* 键可一次选择多个对象。

  2. 右键单击（或按住 Ctrl 并单击）并从上下文菜单中选择**分组**选项。你也可以选择对象 | 分组（或按 Cmd + G 用于 Mac OS）。


  ## 分组对象


  一旦一组对象被分组，一个边界框就会围绕整个组。 要取消分组对象，请右键单击（或按住 Ctrl 并单击）并从出现的上下文菜单中选择**取消分组**选项。或者，选择**对象
  | 取消分组**（或按 Shift + Command + G）。


  ## 总结


  在本章中，我们学习了如何向页面添加图像，并了解了如何通过更改其位置、旋转、复制和裁剪来操作它们。我们讨论了适合在 Web 上使用的图像文件格式类型以及如何选择合适的格式。


  在下一章中，我们将利用 Muse 的小部件为我们的页面添加额外功能。

  '
- '## 8

  使用小部件自定义——菜单和面板


  欢迎来到小部件的世界。 不久前，如果你想为网站添加额外的功能或交互性，你需要一名网页开发人员或程序员为你创建。现在事情变得容易多了，Muse 中的额外交互性以小部件的形式出现。


  小部件是交互性的可重用、可自定义的构建块。示例包括幻灯片、面板和菜单。在本章中，我们将了解如何使用小部件添加菜单，使用 Bar、Horizontal 和 Vertical
  菜单小部件。我们还将查看面板。这些是节省空间的面板，可以以标签方式工作或像手风琴一样工作。


  在本章中你将学习如何：


  - 添加和编辑小部件

  - 创建菜单栏

  - 创建水平菜单

  - 创建垂直菜单

  - 构建手风琴面板

  - 使用标签面板


  ## 使用小部件


  所有小部件都可以在小部件库中找到。选择窗口 | 小部件库以查看完整内容。小部件库面板包含组合，其中包括特色新闻和灯箱显示。小部件库中还包括菜单，分为 Bar、Horizontal
  和垂直菜单。面板选项包括标签面板和手风琴，而幻灯片选项为基本、空白、灯箱和缩略图。我们将在下一章中查看组合和幻灯片。尽管每种类型的小部件提供非常不同的功能，但你在操作小部件时使用的许多概念是相同的。


  ## 向页面添加小部件


  在小部件库面板中，通过单击小部件类别左侧的三角形来展开小部件类别。选择列表中所需的小部件，如以下屏幕截图所示，并将其拖到设计视图中的页面上：


  ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_183_0.png)


  ## 菜单小部件的工作原理


  菜单小部件在网页上显示网站导航。我们可以选择让 Muse 使用我们在计划视图中设置的结构，用我们每个页面的名称填充菜单，也可以手动向菜单添加链接。我们可以将菜单设置为水平或垂直方向。


  自动填充的菜单项会显示与计划视图中页面名称相同的名称。一旦我们创建了菜单，我们仍然可以安全地更改网站结构，并且这些更改将自动更新到菜单中以匹配网站计划。


  当我们手动填充项目时，会出现一个加号（+）符号，允许我们添加新的菜单项或子菜单项。要删除菜单项，请选择它然后按键盘上的 Delete 键。手动菜单项可以通过单击并拖动来重新排列，以在菜单内重新定位项目。


  ## 添加菜单栏


  让我们通过添加菜单栏开始我们的 widget 之旅。菜单栏是将在我们网站的每个页面上出现的元素，因此我们可以将其添加到我们的主页面。正如我们在第 4 章《强大的页面》的页面部分所看到的，我们可以使用主页面来保存我们希望在整个网站中一致出现的任何图像、文本或对象。


  在上一章中，我们通过添加图像并将其固定到页面右上角，进一步更改了**A-Master**面板。在下一个练习中，我们将使用鼠标的几次点击添加一个导航菜单。Muse
  跟踪我们在计划视图中添加的所有页面，并允许我们快速添加一个功能齐全的菜单栏，其中包含指向每个页面的链接。执行以下步骤以添加菜单栏：


  1. 在 Muse 的计划视图中打开**Windsurfing**面板：


  ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_185_0.png)


  2. 双击**A-Master**缩略图以在设计视图中打开主页面。


  3. 从小部件库面板中，展开菜单列表并拖出 Bar 小部件。将其放置在页面上，X 坐标为 410 像素，Y 坐标为 62 像素，使其看起来像坐在标题指南上，如以下屏幕截图所示：


  ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_186_0.png)


  ## 选择小部件及其子元素


  我们将设置和格式化使用菜单小部件选项创建的主菜单：


  1. 要选择整个小部件，请使用选择工具单击它。查看控制面板，你会看到它在左侧显示“菜单小部件”字样。


  2. 将鼠标悬停在各个菜单项上以查看其轮廓。再次单击以选择单个菜单项。


  3. 再次单击小部件内部以选择容器的子元素和文本。注意，当你单击时，每个子元素的名称如何在控制面板中出现，以及小部件上的边界框指示当前选中的元素，如以下屏幕截图所示。每次单击时，你都在选择小部件的额外嵌套子元素，从而允许你编辑每个项目：


  ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_186_1.png)






  当小部件的子元素被选中时，你可以通过在小部件本身的边界内更改文本、矩形的颜色或背景来格式化其内容。


  按 Escape 键可向上返回嵌套元素层级。你可以一直按 Escape 键，直到再次选中整个小部件。或者点击页面上的任意其他位置以取消选择所有子元素和整个小部件。


  - 4. 再次选中整个小部件。我们将对小部件进行格式化，并为导航栏赋予新的外观和感觉。


  ## 设置小部件选项


  在处理小部件时，我们有多个菜单选项可用。让我们现在来看一下它们：


  - 1. 点击 Menu Widget 面板右侧的蓝色圆形图标，以打开小部件的 Options 菜单，如以下屏幕截图所示：


  ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_187_0.png)


  2. 将 Menu Type 设置为 All Pages，将 Direction 设置为 Horizontal，保留 Edit Together 勾选，将 Item
  Size 设置为 Uniform Width，其余选项保持默认设置。


  以下是每个选项的解释：


  - - Menu Type：这指定了 Muse 将用于构建菜单的项目。选择 Top Level Pages 表示站点计划顶层每个页面的菜单项都会出现。选择 All
  Pages 表示站点计划顶层每个页面的菜单项，以及任何子页面的子菜单项都会出现。手动菜单类型允许你在 Design 视图中手动添加菜单项。

  - - Menu Direction：这让你可以选择菜单的水平或垂直方向。

  - - Edit Together：当选择 Edit Together 选项时，你所做的任何更改都将应用于 Menu Bar 小部件中的所有项目。取消选择此选项以单独更改
  Menu Bar 项目。

  - - Item Size：这里的选项让你可以指定菜单项的宽度类型。Fit Width 为每个菜单项设置矩形，其大小仅足以包含各自的文字。Uniform Width
  创建大小统一的菜单项，基于菜单栏中最大的文字。

  - - Left Icon：勾选此框会在每个菜单项左侧设置一个图像框。你可以使用 Fill 和 Stroke 或向其添加背景图像来更改图像框中的图标。未勾选时，图像框不显示。

  - - Label：勾选时，菜单项标签会显示。禁用时，标签不显示。标签是链接按钮的页面名称。

  - - Right Icon：这与 Left Icon 的工作原理相同，只是图像框出现在显示的菜单项右侧。禁用时，图标不显示。

  - - Parts Positioning：这让你可以指定菜单项的水平和垂直对齐方式。


  3. 在整个小部件仍被选中的情况下，点击 Spacing 选项卡。如果不可见，请选择 Window | Spacing。向左右添加内边距并增加 Gutter 的大小。Gutter
  是每个菜单项之间的空间。在 Control Panel 将 Fill 颜色设置为 None。以下屏幕截图显示了 Spacing 面板中的更改如何使菜单看起来：


  ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_189_0.png)


  ## 格式化每个菜单项


  现在我们已经对小部件容器进行了更改，需要选择一个菜单项来更改背景颜色，因为当前的深灰色渐变是菜单项上的背景图像。


  - 1. 在小部件容器被选中的情况下，再次点击任意一个菜单项。我们现在向下钻取了一级。你会注意到在 Control Panel 上，选择器变为 Menu Item。你还会看到菜单项的
  Fill 设置为深灰色。


  2. 点击文字 Fill 并从下拉菜单中将 Fill Type 设置为 Solid，并从 Color Swatch 选择器中选择 None。这会移除背景颜色：


  ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_190_0.png)


  3. 选择 Text 工具，将 Font Family 设置为 Arial，Bold，Size 设置为 14。将 Colour 设置为 #174C78。由于我们之前将
  Menu Widget 选项设置为 Edit Together，所有菜单项会一起更改。


  ## 添加状态


  我们可以使用 States 面板来格式化小部件中链接在访客与之交互时的外观。


  - 1. 在菜单项仍被选中的情况下，点击 States 面板。

  - 你会看到列出四个状态：

  - - Normal：页面加载时链接的外观

  - - Rollover：鼠标悬停时链接的外观

  - - Mouse Down：点击时链接的外观

  - - Active：当前页面上链接的外观


  我们已经设置了 Normal 状态，接下来我们将处理 Rollover 状态。


  - 2. 在 States 面板中点击 Rollover 状态并更改菜单项的背景颜色和文字颜色。将背景颜色设置为亮蓝色，文字颜色设置为白色，移除任何描边，并将
  Corners 设置为 15，如以下屏幕截图所示：


  ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_191_0.png)


  3. 对 Mouse Down 和 Active 状态重复上一步。使每个状态看起来彼此略有不同。这里的重点是为网站访客提供视觉反馈。以下屏幕截图显示了 Mouse
  Down 和 Active 状态：


  ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_192_0.png)


  4. 我们需要测试菜单是否正常工作。由于我们将其应用于 Master Page，它现在应该出现在应用了该主版的所有页面上。点击 Preview 视图并测试你的菜单系统，查看每个状态的工作方式。你应该能够在站点中逐页点击。


  5. Gear 页面有两个子页面，称为 Boards 和 Sails。我们需要为这些页面的子菜单应用样式。再次打开 Master Page 并点击一次菜单栏以选中它，再次点击
  Gear 以选中该单个菜单项。这将显示子菜单项。


  6. 点击一次 Sails 子菜单项。这里的概念与顶级菜单项完全相同。我们可以为每个子菜单项设置四个状态。请注意，即使在以下屏幕截图中选中了 Sails 项目，Boards
  项目也会改变样式。这再次是因为我们在 Menu 选项中选择了 Edit Together：


  ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_193_0.png)


  7. 为每个状态应用样式。使用我们迄今为止使用的蓝色、海军蓝和白色颜色，以保持一致性。


  8. 在 Preview 视图中再次测试你的菜单。


  ## 转移样式


  当你创建了一种样式后，可以将其复制并在其他地方应用。假设例如，你想在页面的页脚中重复我们在页面顶部创建的菜单的外观和感觉，使用类似的菜单。以下是我们的做法：


  当你对小部件的外观进行了样式设置后，确保先选中已样式设置的小部件，然后右键单击（或 Ctrl + 单击）未样式设置的小部件，并从出现的上下文菜单中选择 Transfer
  Widget Skin，如以下屏幕截图所示。一秒或两秒内，新菜单将被样式化为与第一个菜单完全相同的方式：


  ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_194_0.png)


  ## 水平菜单


  我们关于 Bar Menu 所查看的一切也适用于 Horizontal 和 Vertical 菜单。


  要创建水平菜单，只需从 Widgets Library 面板中的 Menus 部分点击并拖拽即可。一旦菜单在页面上，你就可以使用与 Bar Menu 相同的选项对其进行样式设置。


  ## 垂直菜单


  要创建垂直菜单，请从 Widgets Library 面板中的 Menus 部分点击并拖拽。明显的差异是菜单项一个在另一个之下显示。子菜单水平弹出，如以下屏幕截图所示：


  ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_194_1.png)


  ## 手风琴面板


  我们小部件列表中的下一个是 Accordion 面板。它由多个面板堆叠在一起组成。当网站访客点击 Accordion 选项卡时，该选项卡会打开一个更大的面板显示内容。


  此小部件允许我们在小区域中显示大量文本，并为我们的网站增加交互性。


  ## 添加面板


  执行以下步骤以添加面板：


  - 1. 在 Design 视图中打开 Boards 页面。


  - 2. 在 Widgets Library 面板上，点击并拖拽出一个 Accordion 小部件。将它放置在 Boards 标题下方。


  - 3. 将面板右侧拖动到大约 500 像素的宽度。你可以通过选中 Accordion 面板然后在 Control Panel 上填写宽度字段来精确设置宽度，如以下屏幕截图所示：


  ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_195_0.png)


  - 4. 点击小部件底部出现的加号 (+) 图标。这会在组中添加另一个面板。我们现在在小部件内有三个面板。


  - 5. 点击第一个面板的名称——目前为 Lorem 1。使用 Text 工具，将文字更改为 Freeride。






  6. 在面板下方的较大浅灰色区域中单击以选择它并添加内容。再次使用文本工具，绘制一个矩形。将 Boards-Panel1.txt 文件中的文本粘贴进去。在这种情况下，我们添加的是文本，但我们也可以在面板内添加图像或其他类型的内容。


  7. 选择预览视图，以便您可以准确地看到面板小部件的工作方式。单击每个面板名称，注意每个面板如何以手风琴的方式平滑地折叠和展开，如以下屏幕截图所示：


  ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_196_0.png)


  8. 单击第二个面板的名称——目前为 Ipsum 2。使用文本工具，将文本更改为 Wave。


  9. 在该面板下方的较大浅灰色区域中单击以选择它并添加内容。再次使用文本工具，绘制一个矩形。将 Boards-Panel2.txt 文件中的文本粘贴进去。


  10. 单击第三个面板的名称——目前为 Ipsum 3。使用文本工具，将文本更改为 Freestyle。


  11. 在该面板下方的较大浅灰色区域中单击以选择它并添加内容。再次使用文本工具，绘制一个矩形。将 Boards-Panel3.txt 文件中的文本粘贴进去。


  这样我们就把内容放好了。在预览视图下查看，观看面板打开和关闭的流畅动作。小部件会动态调整其大小以适应放置其中的内容。你会看到你刚刚在每个面板中放置的文本框在你添加文本时变大了。每个面板垂直增长以容纳你放置在其中的额外内容。


  ## 编辑手风琴小部件元素


  您可以选择整个小部件、整个面板（包括其标签）或单个标签以进行编辑。在以下练习中，我们将对面板的颜色进行一些更改：


  - 1. 在设计视图中，单击一次手风琴小部件以选择整个小部件。

  - 2. 在状态面板中，单击活动状态。我们将面板标签的颜色更改为中等蓝色，以突出当前活动的面板。

  - 3. 单击第一个面板的名称标签以选择该面板名称。注意控制面板选择器显示为文本框。将填充颜色设置为 #174C78：


  ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_197_0.png)


  - 4. 在预览视图中测试这些更改。你会看到当你单击每个面板时，它会随着变为活动状态而变为蓝色。


  ## 编辑手风琴小部件选项


  整个手风琴小部件可用的选项很少。要查看它们，请选择要编辑的手风琴小部件，然后单击蓝色的编辑选项图标，如以下屏幕截图所示：


  ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_198_0.png)


  可以全部关闭：这允许用户一次性关闭所有面板。当未选择此选项时，手风琴面板始终保持一个打开。


  一起编辑：这意味着对面板特定部分的任何更改都将反映在手风琴小部件中的相同项目中。取消选择此选项以单独更改小部件项目。


  编辑手风琴小部件状态：此选项允许您编辑手风琴小部件面板的各种状态。


  ## 选项卡式面板


  选项卡式面板与手风琴面板类似，因为它们提供了一种在页面上的小区域中放置大量信息的方法。当用户单击选项卡时，该选项卡的关联内容会出现在下面的框中。执行以下步骤以使用选项卡式面板：


  - 1. 首先从小部件库面板拖出一个选项卡式面板。通过使用选择工具拖动它或使用控制面板上的 X 和 Y 坐标将其定位在页面上。


  2. 默认情况下，内容区域顶部有三个选项卡。要更改选项卡上的名称，请单击一次以选择小部件，然后再次单击选项卡，再次单击以编辑选项卡文本，如以下屏幕截图所示：


  ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_199_0.png)


  3. 要向已知为选项卡下容器的较大区域添加内容，请先单击小部件选择容器，然后单击要添加内容的选项卡，然后最后单击容器。


  4. 我们可以通过单击文本工具然后键入或粘贴文本来添加文本。


  5. 我们可以通过使用文件 | 放置放置图像来添加图像。Muse 会自动调整图像大小以适应容器内。


  6. 我们可以通过从小部件库将其拖入容器来添加幻灯片。


  7. 要添加或删除选项卡，请右键单击/ Ctrl + 单击并从上下文菜单中选择，如以下屏幕截图所示：


  ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_199_1.png)


  ## 删除面板


  如果您添加了面板并想完全删除它，只需选择它并按计算机键盘上的 Delete 键即可。


  ## 总结


  在本章中，我们研究了如何为整个网站创建菜单栏。我们设置了菜单和网站结构中每个页面出现的各个菜单项的样式。我们还使用手风琴面板作为一种方法，在页面上放置大量文本而不占用太多空间。


  在下一章中，我们将再次研究小部件，特别是如何使用组合以及如何创建幻灯片。

