  - 2. 导航到计算机上要保存示例项目的位置，然后点击保存。


  ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_28_0.png)


  ## 在设计视图中打开页面


  站点保存后，我们可以进入设计视图并查看 Muse 工作区的其余部分。在计划视图中，双击主页缩略图以打开该页面。


  > 您也可以通过点击 Muse 窗口顶部的设计来切换到设计视图。


  设计视图是进行大部分设计工作的场所。这里是我们向网页添加文本、图像和多媒体小部件的地方。


  设计视图工作区包括打开或创建新文档时看到的所有内容：


  - 视图

  - 工具箱

  - 文档窗口

  - 面板

  - 菜单

  - 控制面板


  主页打开后，注意为所选页面和站点计划出现了选项卡。您可以在 Muse 中打开多个页面，每个页面都会显示其自己的选项卡。要从一个页面跳转到另一个页面或站点计划，只需点击页面名称选项卡即可。


  ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_29_0.png)


  如上图所示的截图中，字母指示了 Muse 工作区的不同组件，如下所示：


  - A: 菜单

  - B: 视图

  - C: 控制面板

  - D: 工具栏

  - E: 文档窗口

  - F: 面板


  ## 工具栏


  工具栏包含用于选择对象、处理文字、裁剪和绘制矩形的工具。它位于屏幕顶部，视图部分右侧。它包含一些如果您使用过其他 Adobe 程序可能会熟悉的工具。


  ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_30_0.png)


  以下是每个工具功能的简要概述：


  - **选择工具**：它让您在页面上选择对象

  - **裁剪工具**：它让您在页面上裁剪图像

  - **文字工具**：它让您创建可添加文字到页面的文字区域

  - **缩放工具**：它让您放大或缩小页面

  - **手形工具**：它让您通过拖动在页面上平移

  - **矩形工具**：它让您创建可填充颜色或图像的矩形、圆角矩形或圆形对象


  ## 使用工具


  要使用工具，只需用鼠标点击工具或按相应的快捷键。您可以通过将鼠标悬停在工具图标上找到每个工具的快捷方式。会出现工具提示，显示工具的名称及其快捷方式。例如，请按以下步骤操作：


  - 1. 将鼠标悬停在缩放工具上。

  - 2. 点击缩放工具以选择它，如以下屏幕截图所示：


  ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_31_0.png)


  - 3. 将鼠标在每个工具上滚动并暂停，以查看每个工具的名称和快捷方式。记住每个快捷方式。


  即使在这个早期阶段，值得花点努力记住每个工具的快捷方式（与 Adobe 的其他程序相比，这里只有少数几个工具）。您会发现，随着您一只手在鼠标上，另一只手准备在键盘上按下快捷键，您的工作流程会显著加快。


  ## 控制面板


  控制面板（窗口 | 控制）为您提供与当前页面项目或所选对象相关的选项和命令的快速访问。控制面板是上下文相关的，因此根据您选择的工具或在文档窗口中点击的对象，显示的选项会有所不同。要获取有关每个选项的更多信息，将鼠标悬停在图标或选项标签上以查看工具提示。


  点击文字工具（T）。注意控制面板上的选项如何发生变化。


  ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_31_1.png)






  ## 面板


  面板为我们提供了快速访问额外工具和功能的途径。默认情况下，面板会一起停靠在屏幕右侧的停靠区中。这并不是永久位置；面板实际上是浮动的，并且独立于文档窗口。我们可以通过更改每个面板的位置并重新组织它们来定制工作区以满足自己的需求。在下面的屏幕截图中，色板、字符样式和间距面板当前处于活动状态。通过点击任意面板标签中的名称，该面板就会变为活动状态。与您可能使用过的其他
  Adobe 软件不同，单个面板无法分离；它们是“粘”在一起的。


  点击文本标签、段落标签和环绕标签以激活它们。


  ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_32_0.png)


  ## 展开和折叠面板


  面板占用了屏幕上的一小块空间，不过，您可能并不总是希望它们完全展开。我们可以通过将它们折叠以仅显示图标而不显示名称来减少它们占用的空间。以下步骤展示了如何展开和折叠停靠区中的所有面板：


  - 1. 点击面板名称右侧的双箭头以折叠面板，如下图所示：


  ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_33_0.png)


  - 2. 要展开面板，请再次点击图标顶部的双箭头。


  另一种节省空间的方法是将面板折叠，使其仅显示标签和面板名称。执行以下步骤即可：


  - 1. 点击标签名称。标签本身会被高亮，但面板中的控件和功能将被隐藏。


  ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_34_0.png)


  - 2. 再次点击标签名称以再次展开面板。


  - 3. 要调整面板大小，请拖动展开面板的底部边缘。


  ## 隐藏所有面板


  在设计时，您可能不想看到任何面板。要隐藏所有面板，请选择窗口 | 隐藏面板。准备好后，您可以通过选择窗口 | 显示面板再次显示它们。


  ## 打开面板


  如果您在面板组中看不到某个特定面板，可以在窗口菜单下找到完整的面板列表。要打开工作区中未显示的面板，请选择窗口 | 填充以打开填充面板。


  如果面板名称在窗口菜单下带有复选标记，这意味着它已在屏幕上处于活动状态，并且该特定面板将在其面板组中高亮显示。


  ## 重新排列面板


  要将面板移至另一组，请拖动面板的标签。在拖动时，您会看到面板的 ghosted 版本，并且在组中会出现蓝色高亮的放置区域，表示可以放置面板的区域。您可以通过将其拖动到窄的蓝色放置区域来在停靠区中上下移动面板。


  作为练习，尝试将填充面板向下拖动以加入其下方的组。


  ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_35_0.png)


  ## 文档窗口


  文档窗口是屏幕中央的白色页面，当然，这就是所有操作发生的地方。我们可以看到蓝色参考线，指示列数、栏间距和边距的大小。在下面的屏幕截图中，我们可以看到一个使用三列的设置，列之间有间隔（称为栏间距），以及内容区域边缘周围的边距：


  ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_36_0.png)


  ## 标尺、参考线和网格


  无论您从事印刷还是网页设计，标尺和参考线都是设计师的最佳助手。默认情况下，Muse 在工作区的顶部和左侧显示标尺。如前所述，所使用的度量单位为像素。要显示或隐藏标尺，请选择视图
  | 显示/隐藏标尺。


  Muse 还显示了五个参考线，用于定义页面大小、页眉和页脚。我们尚未定义页眉和页脚高度，因此您应该会看到用于拖动页面顶部、页面底部和浏览器底部的参考线的手柄。


  当您使用鼠标悬停在工作区左侧的参考线上时，您会看到有关每个参考线用途和功能的工具提示。


  ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_37_0.png)


  顶部和两个底部的参考线有助于您确定整体页面大小。如果您想在不返回站点属性对话框的情况下更改页面大小，可以将第一个参考线向上拖动，或将第四个参考线向下拖动以扩展页面的内容区域。要显示或隐藏页面参考线，请选择视图
  | 显示/隐藏参考线。


  ## 页眉和页脚参考线


  页面上的第二个和第三个参考线分别定义页眉的底部和页脚的顶部。这些参考线只有在您在母版页中定义了页眉和页脚后才可编辑。我们将在未来的章节中更详细地讨论这一点。在普通页面上，页眉和页脚参考线仅用于视觉参考，但不能拖动到新位置。要显示或隐藏页眉和页脚参考线，请选择视图
  | 显示/隐藏页眉和页脚或 Ctrl + Shift + /；Cmd + Shift + ,。


  ## 网格叠加


  许多人以列的形式思考网页设计布局。三列和两列布局非常流行，但重要的是要记住，将行和列一起思考会给我们一个网格——这是一个帮助设计师创建优雅和有吸引力的布局的重要工具。Muse
  提供了网格叠加。


  ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_38_0.png)


  要显示或隐藏网格叠加，请选择视图 | 显示/隐藏网格叠加或按 Ctrl + '' / Cmd + ''。


  ## 缩放


  在文档窗口中查看内容时，在设计时能够放大和缩小非常重要。


  ## 更改放大倍率


  有多种方法可以更改放大倍率或缩放级别。您可以执行以下任一操作：


  - - 选择缩放工具 (Z)。光标会变为带有 + 符号的放大镜。点击文档窗口以在点击点放大。继续点击以放大至最高 4000%。

  - - 使用缩放工具时要缩小，请在点击时按住 Alt 键 (Win)/Option 键 (Mac)。光标将变为带有 – 符号的放大镜。

  - - 直接从工具栏旁边的下拉框中选择放大倍率。下拉框提供 50% 到 400% 的值，但您可以输入 10% 到 4000% 之间的任意放大倍率。

  - - 选择视图 | 放大或视图 | 缩小。

  - - 使用快捷键 Ctrl + = (Win)/Cmd + = (Mac) 放大和 Ctrl + - (Win)/Cmd + - (Mac) 缩小。


  - 使用 Ctrl + 0 (Win)/Cmd + 0 (Mac) 将页面适配到窗口内，并使用 Ctrl + 1 (Win)/Cmd + 1 (Mac) 以实际大小查看页面。


  ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_39_0.png)


  ## 撤销操作


  在理想的世界里，我们可以在不犯任何错误的情况下组装网站。不幸的是，我们并不生活在那个世界，有时我们需要回溯或撤销一些操作。值得庆幸的是，Muse 允许我们后退并撤销多个操作。事实上，您可以撤销多达最后
  20 个操作。如果您犯了错误，可以执行以下任一操作：


  - 选择编辑 | 撤销 (操作) 或


  - 按 Ctrl + Z (Win)/Cmd + Z (Mac)


  如果您想重做刚刚撤销的内容，可以执行以下任一操作：


  - 选择编辑 | 重做 (操作) 或


  - 按 Ctrl + Shift + Z (Win)/Cmd + Shift + Z (Mac)


  ## 获取帮助和更多资源


  有关使用 Muse 面板、工具和其他应用程序功能的完整和最新信息，请访问 Adobe 网站。要在 Muse 帮助和支持文档以及与 Muse 用户相关的其他网站中搜索信息，请选择帮助
  | Muse 帮助。您还可以将搜索结果缩小为仅查看 Adobe 帮助和支持文档。


  有关更多资源，例如技巧和技术以及最新的产品信息，请查看位于 http://forums.adobe.com/community/muse 的 Muse 社区反馈页面。






  ## Muse 更新


  随着 Adobe 更新软件，你将在 Muse 欢迎屏幕上看到一条消息，告知有新版本可用。此消息仅在你拥有活跃的互联网连接时出现。


  ## 摘要


  在本章中，我们讨论了 Muse 如何让我们无需编写代码即可创建网站。我们还熟悉了 Muse 工作区、其工具、面板和文档窗口，并查看了每个工具的快捷键。请记住，学习这些快捷键以加快工作流程是值得的。


  在下一章中，我们将了解 Muse 工作流程，该流程基于典型的网页设计师从初始概念到最终网站的工作流程。我们将查看规划、创建、设计和发布步骤。


  ## 2

  '
- '## Muse 工作流程


  在本章中，我们将从初始概念到最终网站了解 Muse 工作流程。Muse 工作流程与可描述为典型网页设计师工作流程的内容非常接近，即规划、创建、预览和测试，最后发布你的网站。


  在本章中我们将涵盖：

  - 网页设计与印刷设计之间的差异

  - 网页设计规划阶段需要考虑的事情

  - Muse 工作流程 – 创建网站、设置网站计划、设计和发布

  - 域名和托管


  在上一章中，我们熟悉了 Muse 工作区、其工具栏和面板。在我们重新回到 Muse 之前，让我们先来看看印刷设计与网页设计之间的一些差异。我们将查看可能影响网站用户体验的因素，其中包括使用的网页浏览器类型和用户屏幕的分辨率。


  ## 印刷工作流程与网页工作流程


  在理想的世界里，印刷设计将永远占据重要的地位。然而，现实是，在世界许多地区，人们都在网上寻找信息和娱乐。如果受众在网上，设计师就需要与时俱进。 从纸张到屏幕的平稳过渡可能具有挑战性，但这正是
  Muse 登场的地方。


  Muse 允许你以与创建印刷版面相似的方式创建网站。它主要面向平面设计师和新手设计师，他们希望为网页创建引人注目的设计，但又不想学习编码来创建网站。


  在印刷工作流程中，平面设计师可能会先用铅笔和纸张制作快速的初始 mockup。设计师会使用 Adobe InDesign（或类似的 Quark Express
  等软件）来排版页面，并使用 Illustrator 或 Photoshop 等软件来创建和编辑页面内容的图像和图形。混合设计知识的调味，结果就是一个美丽的印刷品。


  使用 Muse 的网页工作流程与印刷工作流程相当。无论媒介如何，在打开电脑之前先草拟一些想法都是一个好主意。五分钟内你就可以在纸上画出几个草图。在相同的时间内，你不太可能在设计软件中产生相同数量的想法。这就是第一步：把你的想法从脑海中转移到纸上。虽然我们每个人的设计师都想创造视觉杰作，但首要任务是满足网站访客的需求。


  ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_43_0.png)


  ## Muse 前规划


  必须了解，在早期阶段（甚至在你双击 Muse 图标之前）投入在研究、探索和规划上的努力至关重要，这样当你启动 Muse 时，工作流程就会变得简单灵活。许多参数会影响设计布局如何转化为有效的网页设计。这些包括用户环境、用户计算机显示器的分辨率，以及在较小程度上，他们的互联网连接速度。


  ## 浏览器之战


  如果你来自印刷背景，你会知道为纸质项目设计的一部分乐趣在于能够选择媒介的大小甚至形状。例如，你可以选择厚纸板、再生纸板、薄纸或编织饰面。你的纸质设计可能包括镂空、压花或折叠。你的纸质图形设计的可能性多种多样。然而，当谈到印刷设计时，你可以绝对确定的是，无论你选择什么大小或形状，对所有看到它的人来说都完全相同。如果你打印在
  A4 纸上，我们所有人都以相同的方式看到那张纸。这对于网页设计来说并非如此，这可能是网页设计师面临的最大挑战。


  当我们为网页设计时，我们的设计在浏览器窗口中查看。该浏览器可能位于 28 英寸显示器、15 英寸笔记本电脑屏幕或 3 英寸手机屏幕上，或介于两者之间。如你所想，如果我们不考虑网站在这些设置下的外观，这可能会导致问题。


  有许多网页浏览器可用，最受欢迎的是 Firefox、Internet Explorer、Safari 和 Google Chrome。这些浏览器中的每一个都以不同的方式显示代码的结果，因此每个浏览器都以不同的方式显示你的网页。大多数时候，差异很小，作为网页设计师，我们有时必须做出小的妥协，以确保我们的设计在任何浏览器上看起来都很棒且尽可能相似。截至撰写本文时，w3schools.com
  的统计数据显示以下浏览器使用情况：


  | Internet Explorer | Firefox | Chrome | Safari | Opera |

  |---|---|---|---|---|

  | 16.7% | 34.4% | 41.7% | 4.1% | 2.2% |


  W3C 提供的数据收集自 W3Schools 的日志文件，仅应作为参考使用。


  ## 分辨率


  我们知道，访问我们网站的访客可能使用众多浏览器中的任何一个来查看我们的网页。添加到网页设计方程中的下一个变量是他们计算机显示器或移动设备的分辨率。网页设计师经常问的一个问题是“我们应该为哪种屏幕分辨率设计？”。


  要回答这个问题，了解当前最常用的屏幕分辨率会有所帮助。以下是根据 www.w3schools.com 去年的数据。同样，此信息最好作为参考，而不是一成不变。


  | Higher | 1024x768 | 800x600 | 640x480 | Other |

  | --- | --- | --- | --- | --- |

  | 85% | 14% | 0% | 0% | 1% |


  我们可以看到，从表中可以看出，大多数计算机分辨率现在为 1024×768 或更高，因此我们应该为此大小优化我们的页面。


  可用性专家 Jacob Nielsen 将优化定义为确保：


  > "..你的页面应在使用最常见的尺寸时看起来和工作最好。在其他尺寸下，它仍然应该看起来不错并且工作良好"


  由于许多用户具有高于 1024x768 的屏幕分辨率，大多数网页设计师会设计他们的页面，使内容位于页面居中的容器中。居中对齐的布局在大屏幕上看起来更好。网页设计通常在两侧有相等量的空白时看起来更好。


  ## 下载速度


  在为印刷设计时，通常对作品中可使用的图形或图像数量没有限制。它可能会在通过电子邮件发送给打印机时因文件大小而造成一定的麻烦，但你可以将作品放在 CD 或 DVD
  上邮寄。


  然而，当谈到网页设计时，我们需要仔细考虑图像的使用。下载速度在互联网上至关重要，访客不会等待缓慢加载的网站。Google 重视速度，并在其搜索排名中考虑网站速度（http://googlewebmastercentral.blogspot.com/2010/04/using-site-speed-in-web-search-ranking.html）。






  在全世界每个人都拥有超高速宽带连接之前，我们必须始终注意网页加载的速度。许多用户现在使用蜂窝数据网络访问网站，而这些网络比典型的互联网连接慢得多。提高下载速度的一种方法是使用优化的图像文件：JPG、GIF
  和 PNG，它们是在图像质量和文件大小之间的一种折中。我们将在后面的章节中更详细地讨论这些文件格式，但现在只需记住，我们网站的速度是在规划网站设计和构建时一个非常重要的因素，甚至对搜索引擎优化也有影响。


  ## 在哪里可以找到更多信息？


  那么，我们如何得知谁在使用什么？如前所述，W3C 是一个互联网组织，其使命是制定网络标准。除了提供有关网页设计各个方面的建议和教程外，他们还跟踪访问和使用情况的统计数据。要了解有关浏览器、屏幕分辨率和网络用户操作系统的更多信息，请查看以下链接：


  - www.w3schools.com/browsers/browsers_stats.asp：提供浏览器统计信息

  - www.w3schools.com/browsers/browsers_display.asp：提供（相对）最新的屏幕分辨率信息

  - www.w3schools.com/browsers/browsers_os.asp：提供操作系统的细分


  ## Muse 工作流程


  Muse 包含五个不同的视图或部分。它们是：


  - Plan

  - Design

  - Preview

  - Publish

  - Manage


  ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_46_0.png)


  这些视图代表了设计师在不使用 Muse 的情况下设计和构建网站时所采取的步骤。我们将依次查看这些视图，但让我们先快速回顾一下如何在 Muse 中创建网站。


  ## 创建站点


  在第一章中，我们查看了 Muse 界面并了解了如何在 Muse 中创建新站点。选择 File | New。此过程与在 InDesign 中创建新文档非常相似。它会创建一个
  .muse 文件，该文件类似于 .indd（InDesign）文件，因为它保存了有关网页和母版页的信息。


  我们可以设置页面的宽度，并且根据常见的屏幕分辨率（1024x768）的知识，默认宽度 960 像素是合适的。


  ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_47_0.png)


  通过输入页面宽度值，我们正在创建一个固定宽度（有时称为静态宽度）布局。这意味着即使浏览器窗口变窄或变宽，布局的宽度也不会改变。固定宽度的替代方案是流体宽度布局。这意味着内容会拉伸以适应浏览器窗口的宽度。在撰写本文时，我们只能选择固定页面宽度选项。默认情况下，容纳内容的容器位于页面中央。


  固定宽度页面的典型值在 960 到 1010 像素之间，留出一些空间用于浏览器 chrome、Web 浏览器的边框和滚动条。在设计网页时，必须加上浏览器 chrome
  来确定页面的宽度。固定宽度网页最常用的宽度是 960 像素。这种尺寸允许页面在屏幕分辨率为 1024 x 768 像素的显示器上的浏览器中显示。


  ## 为什么是 960 而不是 1024？


  平面设计师使用网格进行布局的时间比网络存在的时间还要长。基于 960 的网格被网页设计师用作一种方法，可以快速在任意数量的列中原型化布局：9 x 3、3 x 3
  x 3、4 x 4 x 4 x 4、10 x 2 列等等。


  在下面的屏幕截图中，你可以看到左边是 Nick Finck 的网站，右边是同一网站叠加了网格。网格有助于设计师整齐地对齐页面上的对象。


  ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_48_0.png)


  要了解有关基于 960 像素的网格的更多信息，请访问 http://960.gs/。


  ## 规划你的站点


  一旦你在“新建站点”对话框中单击“确定”，Muse 就会打开“计划”视图。在使用 InDesign 等页面布局程序时，你可以设置想要多少页。你还可以设置母版页，母版页保存设计元素或内容，这些元素或内容将在许多页面中一致出现。我们可以在
  Muse 中做完全相同的事情。每个 Muse 站点都从 Plan 视图的上半部分代表主页的单个缩略图和 Plan 视图的下半部分代表母版页的缩略图开始。在下面的屏幕截图中，我们可以看到我们已为“关于”、“服务”和“联系”添加了页面。在“服务”页面下，有三个子页面，称为“平面设计”、“网页设计”和“插图”。


  “计划”视图让我们可以通过拖放缩略图轻松添加和组织页面。站点地图描述了页面如何相互连接，并为我们提供了站点的一个很好的概览。此外，计划模式中的布局决定了菜单的自动布局。


  ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_49_0.png)


  ## 设计你的站点


  在完成所有研究、探索和规划之后，我们现在进入了过程的真正有趣的部分：设计！对于“传统”网站设计，我们会编写 HTML 代码，HTML 代码保存页面的结构。然后我们会使用层叠样式表（CSS）对其进行样式设置。


  以房屋为例，我们可以认为 HTML 是地板、墙壁、屋顶和窗户，而 CSS 可能是地毯、壁纸和天花板的油漆。


  然而，与其自己编写代码和样式表，Muse 在这里介入并保护我们免受编码黑暗底层的困扰。


  要进入“设计”视图，只需双击“预览”中的任何缩略图即可。你的页面将打开，你会看到工具栏、面板和文档窗口。我们可以通过拖放将文本、图像和大量非常酷的功能添加到页面上。


  ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_50_0.png)


  如果你使用过 Adobe 的 Dreamweaver 软件，你会知道，即使它试图通过可视化网页设计方法来迎合设计师，你也不能像在 Muse 中那样精确地将设计元素拖放到文档中。这对于习惯于
  Photoshop、Illustrator 或 InDesign 的人来说一直是一个令人沮丧的来源。


  放置图像和格式化文本的便捷性使这个程序的使用变得愉快。Muse 与 Photoshop 和 Fireworks 集成良好，使从这些程序复制和粘贴图形到网页变得简单。幻灯片和灯箱都可以毫不费力地添加；这些设计元素在几年前需要广泛的编程技能才能实现。


  下面的屏幕截图显示了一个通过从小部件面板拖出创建的垂直菜单系统。面板的选项允许我们随心所欲地自定义它，更改文本和背景颜色、大小和位置。


  ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_51_0.png)


  ## 预览你的站点


  作为设计过程的一部分，我们需要定期检查我们的网站在浏览器中会是什么样子。我们可以通过单击屏幕顶部的“预览”链接在 Muse 内部进行检查。


  预览使用 WebKit 作为其渲染引擎。这是为 Apple Safari 浏览器、Google Chrome 浏览器和大多数手机浏览器提供动力的同一引擎，因此它为我们的设计在大多数浏览器中的外观提供了相当准确的表示。


  要在 Muse 中预览页面：


  - 1. 在“设计”视图中打开你想要预览的页面。

  - 2. 单击 Muse 界面左上角的“预览”链接。


  虽然这为我们提供了方便的“程序内”预览，但非常重要的是要在真正的浏览器中测试你的页面，即尽可能多的浏览器。这可能是一个繁琐的过程，但值得确保页面加载时不会出现意外。


  ## 获取浏览器


  为了在浏览器中进行测试，你需要确保在计算机上安装了最新版本，以便测试你的网站。你可以使用以下链接进行操作：


  ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_52_0.png)


  - Firefox：http://www.getfirefox.com

  - Opera：http://www.opera.com

  - Safari：http://www.apple.com/safari/download/

  - Google Chrome：http://www.google.com/chrome/

  - Internet Explorer（IE）v7：http://www.microsoft.com/download/en/details.aspx?id=2

  - Internet Explorer（IE）v8：http://www.microsoft.com/download/en/details.aspx?id=43

  - Internet Explorer（IE）v9：http://www.beautyoftheweb.com/


  要在浏览器中预览页面，请使用以下步骤：


  - 1. 在“设计”视图中打开你想要预览的页面。

  - 2. 选择 File | Preview Page in Browser。


  我们将在下一章认真开始构建新站点，但现在，让我们继续 Muse 工作流程的下一步。


  ## 发布你的站点


  当所有艰苦的工作完成后，是时候将你精彩的设计作品在线上供全世界观看了，但等等！在点击“发布”按钮之前，我们需要考虑一个子步骤。


  ## 审查和测试网站


  可以说，审查和测试应该从设计和开发过程的开始就进行。正如我们已经看到的，Muse 提供了一个“预览”视图，它让我们对网站在浏览器中的外观有一个相当好的了解，但在你进行网页项目时，有一些问题你可以问自己：


  - 我的目标受众是谁？

  - 我是否给了他们想要的东西？

  - 页面布局是否一致？我们将在后面的章节中看到，Muse 的母版页可以帮助我们保持一致性。






  - 是否有平衡感和秩序感？网站是否易于浏览？

  - 所有链接是否都正常工作？

  - 网站是否在所有主流（以及较旧的）浏览器中都能正常运行并正确显示？

  - 网站是否已进行拼写检查？拼写错误和语法不良已被证明是电子商务网站访客的主要反感因素。不要因拼写错误而流失访客。

  - 如果你的网站包含多媒体内容，它是否能正常工作？

  - 你的联系方式是否易于找到？


  这些问题只是你在网页设计之旅中需要考虑的一些问题。


  请让个人和团体来测试你的网站。作为设计师，你对网站过于熟悉，从设计到功能的一切对你来说都显而易见。但对新访客来说显而易见吗？新鲜的目光能发现令人惊讶的问题。尽可能多地获取反馈。


  当你对设计感到满意，并且已将其调整并测试到精密运行的机器状态时，你就可以发布它并与世界分享。为此，你需要将网站发布到主机上。


  发布网站意味着让它对访客可用。这需要你将网站及其所有资源上传到服务器。一旦上传到服务器，所有页面都应重新测试，以防某个文件未正确上传。


  使用 Muse 发布时有两种选择。你可以由 Adobe 使用 Business Catalyst 来托管你的网站，也可以导出 HTML 文件并使用你选择的任何主机。


  ## Adobe Business Catalyst


  Business Catalyst 是 Adobe 用于构建和管理在线业务的托管应用程序。它与 Muse 紧密集成，可以被视为将网站上线最简单的方式。Business
  Catalyst 基础托管的价格从每月 $5.99 起。你可以在 http://www.adobe.com/products/muse/buying-guide.html
  找到完整的价格清单。需要说明的是，未来 Muse 可能会包含内容管理系统（CMS）功能，这些功能在导出 HTML 时不可用，并且需要使用 Business Catalyst。


  你也可以免费将用 Muse 构建的网站临时发布到 Adobe Business Catalyst，试用期为 30 天。这允许你向客户发送实时 URL 以供审阅。Business
  Catalyst 上所有试用模式的网站都将包含 Business Catalyst 域名，例如，http://mysite.businesscatalyst.com。如果你稍后决定通过支付月度托管费用将网站“上线”，你可以将其转移到自己的域名并移除
  .businesscatalyst.com 子域名。


  ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_54_0.png)


  Business Catalyst 的替代方案是导出文件并使用 FTP 程序将网站文件上传到主机。从 Muse 输出网站为 HTML 非常容易，但这种方法需要使用
  FileZilla 等额外软件将文件传输到主机的服务器。你还需要安排托管并购买域名。


  ## 发布简要概述


  如果你决定自行安排托管，有一些概念你需要熟悉。你的网站只有在你获取服务器空间、获得域名并上传网站后，其他人才可在网上查看。


  ## 域名


  为了让访客找到你的网站，你需要获取一个域名。你的域名有点像你的邮寄地址。没有邮寄地址也可能找到你的房子，但有了地址会容易得多。访客通过 IP 地址或域名访问网站。


  IP地址（Internet Protocol 地址）是唯一标识连接到互联网的每台计算机或设备的数字。域名是 IP 地址的文本版本，对我们人类来说更容易记住。


  域名系统（DNS）是一种互联网服务，它将域名翻译成相应的 IP 地址。


  统一资源定位符（URL）也是一种网络地址，它告诉浏览器你的网页位于哪个服务器上。它通过使用通信协议，例如超文本传输协议（HTTP）加上域名来实现。例如，一个典型的网络地址可能类似于
  http://www.nytimes.com。


  域名是唯一的。这就是为什么只有一个 amazon.com、一个 microsoft.com 和一个 facebook.com。域名必须注册。大多数托管服务提供商都会提供域名注册服务，因此很容易注册域名。困难的部分是找到一个你想要的且尚未被注册的域名。域名也很便宜。你应预期为一个域名支付
  $5 到 $30 一年。


  ## 获取服务器空间


  互联网服务提供商（ISP）托管你的网站。他们的业务是提供连接到主机以便你保存网页和网站所有文件的连接。


  许多 ISP 免费或收费提供网络空间。有些人发现免费网络空间在学习过程中很有用，并且在测试时可以上传文件。然而，许多提供免费空间的提供商会在你的网站上放置广告和弹出窗口，这非常令人厌烦且看起来很不专业。使用
  Muse 的一个优势是，你可以免费使用 Business Catalyst 发布 30 天。


  如果你想看起来专业并获得良好的服务，支付域名费用和一些体面的托管是值得的。做一些研究也很值得，看看哪些提供商是其他开发者推荐的，以及哪些 ISP 他们会避开。


  ## 上传你的网站


  一旦你安排好托管和域名，就该上传你辛苦设计的那些网页文件了。一些 ISP 提供上传或文件管理系统来将你的文件上传到其服务器。将文件上传到主机服务器最有效的方法是使用文件传输协议或
  FTP。使用 FileZilla（http://filezilla-project.org/）或 Smart FTP（http://www.smartftp.com/）等
  FTP 软件，你可以快速在创建网页的计算机与访客可以查看网站的主机或远程计算机之间建立链接。这两个应用程序都可以免费下载。


  ## 总结


  在本章中，我们讨论了设计师在创建网页时面临的一些挑战。这些包括使设计在多种浏览器和各种分辨率下看起来良好，以及使其快速加载。我们还查看了 Muse 工作流程以及将网站从想法转变为已发布网站所涉及的步骤。


  在下一章中，我们将使用 Muse 强大的线框工具来创建网站地图和网站的工作原型。


  ## 3

  '
- '## 规划你的网站


  网站是一组包含图像或 Flash 等资源网页的集合。在本章中，我们将了解如何规划新网站并使用 Muse 优秀的线框工具来制作网站的模拟图。


  *Fail To Plan, Plan To Fail*


  是的，这可能是一个老套的陈词滥调，但就我们的网站而言，这个陈词滥调确实是正确的。如果你提前花时间规划网站，你将避免在后续过程中出现很多麻烦。


  在上一章中，我们查看了 Muse 工作流程以及规划是网站开发不可或缺的一部分。现在我们将看看在规划网站时了解网页布局的一些基础知识。


  ## 页面布局


  你的网站布局可能是决定访客是否会留在你的网站上还是不耐烦地离开的关键因素。你可以把布局想象成一张地图。如果访客很容易“阅读”这张地图，他们更有可能留下并找到你提供的内容。让我们来看看我们在网络上今天看到的一些典型布局。






  ## 主食式布局


  当我们为网页设计布局时，需要包含若干部分。这些部分可以分为以下几类：


  - **一致性内容**：这在整个网站中不会改变。此类内容的示例有标志、导航栏和页脚。

  - **变化内容**：这是页面中在网站各处发生变化的部分，通常是主要内容。在某些情况下，侧边栏的内容也可能发生变化。


  网页设计师的工作是创建一种布局，使访客在浏览网站时保持对内容的关注，同时保持导航简便易行。以下图示展示了一些常规或主食式网站布局的示例：


  ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_59_0.png)


  你只有很短的时间来吸引访客的注意力。因此，选择其中一种基本布局，就等于使用了经过验证的设置，许多网页用户会感到熟悉。不要担心这些布局看起来“方方正正”。你可以使用图像、颜色和字体来配合网站的目的，完全掩盖每个网页本质上都是由方块组成的事实。


  > 之前介绍的主食式布局是经过充分测试的指南；然而，你完全没有义务使用其中一种。


  ## 典型的网页上会出现什么？


  我们已经看到了一些基本布局。现在我们来看看几乎每个网页上都会出现的一些元素。


  ## Logo


  Logo 是公司整体品牌和身份的一部分，出现在网站每个页面的顶部，与公司名称和标语一起，就像在印刷的营销材料上一样，例如名片、宣传册和信头。此身份区块提高了品牌认知度，并确保用户知道他们正在查看的页面属于同一个网站。经常，Logo
  也是一个链接回网站主页的链接。


  ## 导航栏


  你的网站导航应该易于使用且易于找到。就像 Logo 一样，它应出现在页面的顶部。你可以决定在页面顶部使用水平菜单、在侧边栏中使用垂直菜单，或两者结合。无论哪种方式，你的主要导航都应“在折叠线之上”可见，也就是说，访客无需滚动即可查看的网页区域。


  ## 内容


  内容为王。这是访客前来寻找的东西。如果访客找不到他们想要的东西，他们会很快离开。主内容是你设计中的一个重要焦点；不要浪费时间在其中填充不必要的“东西”。


  ## 页脚


  位于页面底部，页脚通常包含版权信息、联系链接信息以及网站的法律条款。一些设计师对页脚非常有创意，并利用这一区域放置额外的链接、推文和“关于我”的信息。


  页脚清楚地将主要内容与页面末尾分隔开，并提示用户他们已到达页面底部。


  在下面的屏幕截图中，你可以看到苹果网站的一个页面，该网站以其美学设计而闻名。每个部分都清晰地划分。


  ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_61_0.png)


  如果你牢记将网站布局视为地图的想法，那么你就可以确定希望在网站上引导访客前往何处。


  ## 线框图


  线框图是简单和复杂项目设计过程中的重要组成部分。如果你为客户创建网站，线框图是早期以视觉方式传达你的想法的绝佳工具，而不是仅有口头描述。


  如果你为自己创建网站，线框图有助于明确网站每个页面所需的内容。它可以被视为规划过程与设计过程之间的重叠。


  创建简单的线框图可确保你的页面设计考虑到你将添加到页面上的所有元素以及它们的位置。线框图具有成本效益，因为在初始阶段花费的时间有可能节省你在后期修改设计时花费的更多时间。


  线框图可以通过多种方式创建，包括纸笔和基于计算机的工具。


  在上一章中，我们提到了规划过程中使用纸笔。这是一种快速且经济的方法来制作线框图。许多设计师使用带有细微方格的方格纸，作为现成的网格。网格线有助于按比例创建元素。


  ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_62_0.png)


  当谈到用于线框图的计算机应用程序时，有许多选择。一些设计师使用 Photoshop、Illustrator 或甚至 InDesign 来制作他们的线框图。深受网页设计师欢迎的专用线框图软件包包括
  Balsamiq 和 OmniGraffle。


  ## 线框图、Mockup 和原型。哦天！


  你可能会听到网页设计师提到线框图、Mockup 和原型。虽然这些术语有时被互换使用，但重要的是要理解它们是三种不同的东西。


  线框图是对网页结构和组件的基本说明。


  Mockup 是一个专注于网站设计元素的图像文件。它包含构成网页的图形和其他页面元素，但可能包含占位文本和图像。


  原型是一个几乎完整或半功能的网页，使用 HTML 和 CSS 构建。原型使客户（或你自己）能够点击查看并检查最终网站的工作方式。


  ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_63_0.png)


  ## 线框图应包含什么？


  思考哪些设计元素会出现在你网站的每个页面上。如前所述，大多数网站将在整个网站中保持 Logo、导航、搜索栏和页脚等元素的一致位置。


  接下来，思考任何可能特定于单个页面的额外元素。这些包括图形和动态小部件。一旦你知道需要什么，你就可以基于这些元素开始创建线框图。


  一些设计师喜欢以“大局观”创建线框图。一旦基本布局就位，他们会从客户那里获得反馈，并在必要时修改线框图。


  其他人喜欢为网站上的每个页面创建非常详细的线框图，在向客户展示之前列出每个设计元素。


  ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_64_0.png)


  线框图让我们可以在确定最喜欢的设计之前尝试几种不同的想法，然后将其带到 Mockup 阶段。


  显然，本书的重点是使用 Muse，但我强烈建议你不要排除使用纸质草图。这是一种快速将想法从脑海中提取出来并形成有形、可视布局的好方法。


  Web.without.words (www.webwithoutwords.com) 是一个有趣的网站，专门展示流行且知名的网站的线框图。每个网站上的文本和图像都被遮挡，这是一种不错的方式来看待网页并了解它们如何被分解为简单的方块，而不会被内容所困扰。


  ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_64_1.png)


  ## 使用 Muse 的线框图


  那么使用 Muse 创建线框图的优势是什么呢？好吧，Muse 不仅让你创建线框图，还允许你使用这些线框图快速创建原型。这意味着你可以向客户展示网站的功能以及基本布局。Muse
  制作的原型可以在任何网络浏览器中查看，让客户很好地了解网站的外观。这种早期测试可以帮助缓解设计过程中后期可能耗时的难题。


  我们现在将为一个关于冲浪风帆的虚构网站准备一个网站和线框图。首先，我们将创建一个新站点，然后在 Plan 视图中添加页面。


  ## 使用 Plan 视图的站点结构


  让我们开始创建新站点。


  - 1. 打开 Muse。选择 File | New Site。在 New Site 对话框中，将 Page Width 设置为 960，Min Height
  设置为 800 像素。将 Margins 设置为四周均为 0，Padding Top 和 Bottom 各设置为 10 像素。将 Columns 数量设置为 16。列会作为页面上的指南出现，我们用它们来帮助我们对齐布局上的设计元素。请注意
  Gutter 默认设置为 20，保持不变。Column Width 由 Muse 计算，你应该会在该字段中自动看到 41 的值。记住，所有这些值如果必要以后都可以更改。


  ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_65_0.png)






  +   2. 点击 **OK**。**Plan** 视图打开，你会在左上角看到代表主页的缩略图，底部窗格中会看到代表 A-Master 页面的缩略图。

  +   3. 立即保存你的站点，选择 **File | Save Site**。为其取一个你能识别的描述性名称，例如 `Wind surf.muse`。

  +   4. 要创建新页面，点击现有页面右侧或下方的加号 (+) 标志，然后点击页面的名称字段输入其名称。


  ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_66_0.png)


  +   5. 点击 **Home** 页面右侧的加号，并将新页面命名为 `Gear`。点击 `Gear` 页面下方的加号添加一个子页面，并将该页面命名为 `Sails`。点击
  Sails 页面右侧的加号并将新页面命名为 `Boards`。


  +   6. Sails 和 Boards 现在处于同一层级，并且是 Gear 页面的子页面。

  +   7. 点击 Gear 页面右侧的加号并将新页面命名为 Learning。

  +   8. 点击 Learning 右侧的加号并添加一个名为 Contact 的页面。你的 Plan 视图现在应如下图所示：


  ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_67_0.png)


  ## 在 Plan 视图中使用缩略图


  在 Plan 视图中工作时，添加、删除、重新定位或复制页面非常容易。右键单击（Win）或 Ctrl + 单击（Mac）缩略图即可查看上下文菜单。此菜单提供了管理页面的所有选项。


  ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_68_0.png)


  在上一个屏幕截图中，你可以看到右键单击/ Ctrl + 单击时出现的菜单。


  - **New Child Page**：此选项会在当前缩略图的更低层级创建一个新的空白页面。

  - **New Sibling Page**：此选项会在与当前缩略图相同层级创建一个新的空白页面。

  - **Duplicate Page**：此选项会制作当前页面的精确副本。当你已添加内容并应用了一些格式时，这最有用。

  - **Delete Page**：此选项会删除该页面。

  - **Rename Page**：此选项允许我们更改页面的名称。

  - **Go to Page**：此选项会在 Design 视图中打开当前页面。

  - **Page Properties**：此选项会打开 Page Properties 对话框，允许你仅为当前页面设置属性。

  - **Reset Page Properties**：此选项会将页面恢复为原始设置。


  - **Export Page**：此选项允许你将页面导出为 HTML 和 CSS。

  - **Menu Options**：此选项允许你选择页面是否（或如何不）包含在自动创建的菜单中。

  - **Masters**：此选项让你选择将应用到该页面的 Master 设计。


  上下文菜单并不是获取这些选项的唯一方法，例如 **Plan** 视图中最常见的任务可以按如下方式完成：


  - 你可以通过双击页面名称来重命名页面

  - 你可以通过将鼠标悬停在缩略图上，然后点击右上角出现的 x 图标来删除页面


  要重新定位站点地图层次结构中的页面，可以将缩略图拖放到同一层级或子层级。


  花几分钟时间添加、删除和重新定位页面，以便熟悉创建站点结构。你会发现 **Plan** 视图直观易用，并且非常快速地创建站点地图。你可以选择 **Edit |
  Undo** 来撤消已采取的任何步骤。


  Muse 会跟踪所有页面名称，并在设计过程中稍后允许我们使用菜单小部件快速创建菜单。**Plan** 视图中创建的所有链接都会得到维护，如果我们更改站点结构，它们会自动更新。你可以在网页设计过程的任何时候返回到
  **Plan** 视图。


  ## 使用线框图


  现在我们已经设置了站点结构并可以看到站点如何流动，我们下一步是使用 Muse 的工具绘制简单的线框图。


  Muse 提供了多个功能来帮助我们创建线框图，包括：


  - 用于创建图形和文本占位符的矩形工具

  - 用于在 **Design** 视图中对齐布局元素的列网格

  - 资源面板，其中包含用于更新占位符图像的功能


  对于冲浪网站，我们将使用一列布局，顶部有一个页眉，中间是主要内容区域，页面底部有一个页脚。页眉将包含网站名称及标语、Facebook、Twitter 和 YouTube
  的链接，以及包含指向我们层次结构顶层页面链接的导航栏。


  主要内容区域是页面在整个站点中会发生变化的部分。


  页面底部的页脚将包含版权信息。


  让我们开始向我们的站点添加一个页面。这将是我们线框图原型页面。请按照以下步骤操作：


  +   1. 通过点击加号 (+) 图标，在 Contact 页面右侧添加一个新缩略图。将页面命名为 Prototype。这不会成为我们最终站点的一部分，但它允许我们留出一个页面，在其中尝试不同的布局并制作可工作的线框图。

  +   2. 在 Plan 视图中双击 Prototype 页面缩略图。Prototype 页面将在 Design 视图中打开。你会看到一个空白白页，上面有许多垂直参考线。垂直参考线代表我们在
  Site Properties 对话框中之前设置的列数。它们仅用于帮助我们对齐，最终网页上不会显示。

  +   3. 我们现在将使这些列更加明显，方法是右键单击/ Ctrl + 单击页面上的任意位置。从弹出菜单中选择 Show Grid Overlay。粉色区域是列，中间的白色条是间距。你的页面现在应如下图所示：


  ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_70_0.png)


  如果你发现粉色覆盖层太分散注意力，可以再次右键单击/ Ctrl + 单击并选择 Hide Grid Overlay 来关闭它。


  4. 选择 Rectangle 工具并从第一个白色条的左侧绘制一个大矩形到最后一个白色条的右侧。高度约为 150 像素。当你拖动矩形时，工具提示会告诉你形状的宽度和高度。矩形的尺寸和
  X、Y 位置也会显示在页面顶部的栏中，如下图所示：


  ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_71_0.png)


  5. 绘制矩形后，你可以通过在页面顶部的 Control Panel 中输入值来精确放置它或更改其大小。


  6. 在矩形仍处于选中的情况下，你可以设置描边颜色、填充颜色、更改不透明度，并添加发光、斜角和投影等效果。对于此练习，将矩形设置为白色填充、2 像素黑色描边，且不应用任何效果，如下图所示：


  ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_71_1.png)


  这是一种简单样式，非常适合用于线框图。在 Muse 中，我们可以将矩形的设置保存为图形样式，然后在绘制线框图时重复使用。


  ## 保存图形样式


  如果你以前使用过 InDesign，你会熟悉用于字符和段落的可重用样式的概念。我们使用图形样式来快速格式化对象并在我们的线框图和设计中保持一致的外观。如果客户要求更改，我们可以非常轻松地快速更新一组站点资源。


  +   1. 在矩形被选中的情况下，点击 Graphic Styles 面板底部的 Create new style from the attributes applied
  图标。如果看不到 Graphic Styles 面板，请选择 Window | Graphic Styles 打开它。该样式会保存在面板中，并基于所选矩形的格式。


  +   2. 双击新的图形样式以在 Style Options 对话框中为其命名一个好的描述性名称，例如 Wireframe Rectangle。点击 OK。


  ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_72_0.png)


  要将此样式应用于以后绘制的任何其他形状，请选择该形状，然后点击样式名称。


  +   3. 现在，为了继续我们线框图的页眉部分，请选择 Type 工具并在第一个矩形内部左侧拖出一个大约 245 x 45 像素的矩形。






  4. 当你松开鼠标时，光标会闪烁在矩形内部。输入单词 Logo。要增大字号，使用文字工具，点击并拖动覆盖 Logo 单词，使其以蓝色高亮显示（表示当前已选中）。在页面顶部的控制面板或文字面板中，从下拉菜单中选择
  36 号字体大小，并通过点击大小下拉框旁边的粗体 T 图标将文字样式设为粗体，如以下屏幕截图所示：


  ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_73_0.png)


  5. 再次使用文字工具，绘制出一个相同大小的第二个矩形并将其放置在 Logo 矩形下方。在此矩形中添加文字 Tagline goes here。


  6. 从工具栏中选取选择工具（黑色箭头），然后按住 Shift + 点击你绘制的两个文字矩形以选中它们。在图形样式面板中，点击我们之前创建的圆角矩形样式。这样我们的所有矩形看起来就保持一致了。


  ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_74_0.png)


  7. 我们将为 Logo 矩形添加一个链接。通过选择 编辑 | 取消全选 或如果选择工具处于活动状态，点击页面区域外，确保页面上没有任何被选中项。使用选择工具点击
  Logo 矩形，然后点击控制面板上超链接旁边的下拉菜单。从控制面板的下拉菜单中选择 Home。这会为 Logo 矩形应用到主页的链接。


  8. 下一步是添加我们的导航栏。这正是 Muse 为我们承担大部分工作的地方。点击小部件库标签以激活该面板。如果屏幕上看不到该面板，请选择 窗口 | 小部件库。在菜单下，选择水平。点击并从面板拖动到页面上。小部件会出现，其中包含我们在网站结构中创建的顶级页面的名称。


  9. 为了使菜单在页眉下方横跨整个页面，点击菜单右侧蓝色圆圈中的白色箭头。在项目大小下拉菜单中，选择统一宽度。然后将光标悬停在菜单小部件边界框的右下角手柄上，使其变为双箭头，然后拖动以增加框的宽度。


  ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_75_0.png)


  10. 再次选中菜单矩形后，点击图形样式面板并选择我们之前创建的圆角矩形图形样式。


  11. 你的线框图现在应该类似于以下屏幕截图：


  ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_75_1.png)


  使用网格叠加层使我们能够非常轻松地对齐布局中的各个元素。


  12. 继续创建一个全宽矩形来表示主要内容，并在其下方创建一个全宽文字矩形来表示页脚区域。在页脚部分添加文字 Copyright 后跟你的姓名。


  13. 通过按住 Shift + 使用选择工具点击来选择这两个矩形。应用圆角矩形图形样式。完成后，你的原型页面应类似于以下屏幕截图：


  ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_76_0.png)


  ## 使用占位图像


  在规划你的网站并创建线框图时，你可能还没有网站上使用的最终图像，但你可以在线框图上放置占位图像。


  假设在你的主页上你知道将要有一张著名风筝冲浪冠军的照片，但在早期阶段你还不确定是哪一位。你可以在 Photoshop 或 Fireworks 中制作一个空白图像并以适当的名字保存，例如
  WindsurfingChamp.jpg。


  对于此示例和布局，图像文件为 300 x 170 像素并保存在 Windsurfing 网站文件夹中。将你网站的所有资源保持在一起非常重要。


  要将临时占位图像添加到页面，请选择 文件 | 放置 并浏览找到图像。选中图像后，它将被加载到“枪”中。这仅仅意味着将光标移动到页面上你想要放置图像的位置，然后点击将其放置在页面上。将它放置在页面主要内容区域的右侧。


  ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_77_0.png)


  这是一个预览我们线框图的良好时机。点击控制面板上的预览链接。我们的页面打开，我们看到没有网格叠加层的漂亮线框图。


  与在纸上或在 Photoshop 或 Illustrator 中创建的线框图相比，此线框图的真正好处是它具有交互性。将鼠标悬停在导航栏上并注意悬停状态。Logo
  文字上的链接也是活动的。当你点击 Logo 链接时，它会带你到主页，目前该页是空白的。这是我们可以在此阶段与客户分享以获取他们对进展的反馈的东西。在此阶段修复功能比在整个网站构建完成后要容易得多。


  ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_78_0.png)


  预览页面完成后，点击设计视图返回编辑页面。


  ## 使用最终网站图形更新占位图像


  让我们假装我们的客户已经批准了此页面的线框图，并且印象深刻，于是他匆忙带来了我们风筝冲浪冠军的正确照片。由于我们使用了图像占位符，现在我们可以轻松快速地更新网站以使用实际图像文件：


  - 1. 在 Photoshop 或 Fireworks 中打开原始图像，将照片粘贴在上方，并在必要时调整大小使其适合我们的原始图像。保存文件，替换原始文件。

  - 2. 在 Muse 中，选择页面上的图像占位符。

  - 3. 打开资源面板以定位选中的页面元素；在本例中它是名为 WindsurfingChamp.jpg 的图像。

  - 4. 右键单击页面元素。在出现的菜单中，选择重新链接资源。你的图像将立即在网页上更新。


  ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_79_0.png)


  ## 添加虚拟文本和段落样式


  在构建线框图网站时，你可以使用文字工具创建文字框并添加占位符或虚拟文本，这些内容以后可以轻松替换。创建文字元素后，你可以使用文字面板或控制面板对文字应用格式。文字标题和段落样式帮助你创建结构化页面并轻松更改文字格式。


  > What Is Lorem Ipsum?

  > Lorem Ipsum is simply dummy text used by the printing and typesetting industry.
  Lorem Ipsum has been the industry''s standard dummy text ever since the 1500s. It
  is a long established fact that a reader will be distracted by the readable content
  of a page when looking at its layout. The point of using Lorem Ipsum is that it
  has a more-or-less normal distribution of letters, as opposed to using "Content
  here, content here", making it look like readable English. Today Lorem Ipsum is
  used by web designers for the same reason.

  > Some paragraphs of Lorem Ipsum text have been supplied in a .txt file.


  使用段落样式，你可以定义标题文字和段落标签来构建页面的文字内容并保持一致性。让我们向我们的原型页面添加一些文字：


  - 1. 在计算机上的文本编辑器中打开 Loremipsun.txt 文件。选择文件中的所有文字并通过选择 编辑 | 复制 复制它。

  - 2. 在 Muse 的设计视图中，选择文字工具并在页面主要内容区域的左侧拖出一个矩形文字框。确保矩形的左侧与页眉中 Logo 和标语文本框的左侧对齐。

  - 3. 你可以输入或粘贴文字到文字框中以填充它，但在我们的例子中，我们将通过选择 编辑 | 粘贴 粘贴 Lorem Ipsum 文字。

  - 4. 文字添加后，点击 Lorem ipsum dolor 之后。你会看到光标闪烁。在键盘上按 Enter/Return 将剩余文字推到新行并创建新段落。我们将使用
  Lorem ipsum dolor 作为主标题。

  - 5. 通过点击并拖动选择除 Lorem ipsum dolor 之外的所有文字，然后使用文字面板或设计视图工作区顶部控制面板中的选项设置格式选项。你可以选择字形、大小、颜色和其他与类型相关的属性。

  - 将字体设为 Arial，大小 12，深灰色，左对齐，行高为 100%。行高是行与行之间的间距。根据字形和大小，增加行高可以使文字块更易于阅读。

  - 6. 点击段落样式面板底部“从已应用的属性创建新样式”以创建新的段落样式。如果看不到段落样式面板，请选择 Windows | 段落样式 以打开它。双击新样式的名称为其指定描述性名称。对于此示例，我们称之为正文段落。


  ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_80_0.png)






  7. 我们使用段落标签菜单将段落样式设置为目标特定的 HTML 标签，例如 P、H1、H2 或 H3。在本例中我们希望使用 Default（p）：


  ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_81_0.png)


  8. 现在选择单词 Lorem ipsum dolor，我们将将其设置为标题。在文本面板中，选择此字体的属性。将字体设置为 Georgia，大小为 24 且为
  Bold，并将 Space After 设置为 10。Space After 是面板右下角的图标，它设置将应用于您正在格式化的文本下方的间距。


  9. 再次点击段落样式面板底部的 Create a new style from the attributes applied 以根据所应用的属性创建新的段落样式用于我们的标题。双击新样式的名称以赋予其描述性名称。将其命名为
  Heading H1 并将段落标签菜单设置为目标 Heading（h1），如下图所示：


  ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_82_0.png)


  10. 通过这种方式设置段落样式，您可以确保页面之间样式的一致性。这与平面设计师设置其印刷样式表的方式非常相似。


  11. 您可能希望为页眉的 Tagline 部分和页脚的 Copyright 部分设置样式。重复步骤 8 - 10，为 Tagline 和页脚文本选择您自己的字体大小、样式和颜色。


  12. 完成样式设置后，通过点击 Preview 选项卡测试线框图。


  ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_83_0.png)


  这个过程的好处在于，我们不仅创建了一个交互式线框图，而且还拥有一个可工作的原型；基础但可工作。我们还创建了许多样式，可以在整个网站中重复使用。


  ## Where are the files generated by Muse?


  当您完成线框图的创建并准备好与客户分享时，您可以通过点击 Publish 链接直接使用 Adobe Business Catalyst 发布它们。为此，您需要一个
  Adobe ID，您应该在首次安装 Muse 时已创建。这是一种轻松将网页上线的方式。


  Business Catalyst 的替代方案是将您的 Muse 网站发布到您自己的托管服务器，您可能已经设置了。要获取网站的文件，您需要导出整个站点。Muse
  将生成站点运行所需的 HTML、CSS 和图像文件夹。


  - 1. 选择 File | Export As HTML。Export to HTML 对话框出现。

  - 2. 选择要导出站点文件到的计算机上的位置，然后点击 OK，如下图所示：


  ![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_84_0.png)


  完成此操作后，Muse 会导出文件并将其保存在您指定的本地文件夹中。导航到该文件夹并打开图像文件夹以访问优化的图像文件。您可以重新利用这些图像文件来创建新闻通讯、移动应用、社交网络页面和其他相关项目。


