  \n# 为 Packt 撰稿\n\n我们欢迎所有有兴趣撰稿的人士的咨询。书稿提案请发送至 author@packtpub.com。如果您的书稿创意仍处于早期阶段，您希望在撰写正式书稿提案前先进行讨论，请联系我们；我们的约稿编辑会与您联系。\n\
