  \ Muse 是来自全球领先的软件设计公司的令人兴奋的新工具，它允许用户在不编写任何代码的情况下创建精美且功能齐全的网站。它为平面设计师提供了将印刷设计技能应用到网络上的能力。\n\
  \n本书将帮助网页设计师以及平面设计师快速掌握 Adobe Muse。它将提供逐步说明，指导您使用 Adobe Muse 构建网站。\n\n学习 Adobe Muse\
  \ 将教会您如何使用 Adobe Muse 规划、设计和发布网站。它首先介绍该程序的工具和界面，然后介绍您为布局网页所需的概念。您将学习如何使用可重用的样式格式化文本、添加图像、创建干净的导航系统，以及向页面添加面板和幻灯片等交互元素，而且这一切都不需要编写一行代码！\n\
  \n到本书结束时，您将创建一个设计精良、功能齐全的网站。\n\n## 本书涵盖内容\n\n第 1 章，欢迎来到 Muse，讨论了 Muse 如何让我们在不编写代码的情况下创建网站。我们将熟悉\
  \ Muse 工作区、其工具、面板和文档窗口。我们将查看每个工具的快捷键，值得花一些时间学习。\n\n第 2 章，Muse 工作流程，解决了设计师在创建网页时面临的一些挑战。这些包括使设计在多种浏览器和各种分辨率下看起来良好，以及使其快速加载。我们将了解\
  \ Muse 工作流程以及将网站从想法转变为已发布网站所涉及的步骤。\n\n第 3 章，规划您的网站，讨论了网页设计中使用的一些基本布局。我们将了解使用笔和纸进行线框图的想法，以及如何在\
  \ Muse 中设置网站结构和线框图。\n\n第 4 章，强大的页面，讨论了主页面概念以及我们如何使用它们在多个页面上应用外观和风格。我们将学习如何在单个网页上添加简单文本以及如何添加链接。我们使用\
  \ Muse 的一些布局工具，即指南和网格叠加层来对齐内容。\n\n第 5 章，矩形的乐趣，教授如何设置灵活的背景矩形。我们向页面添加矩形并操作其大小、填充颜色和描边，并学习如何添加诸如投影之类的效果。\n\
  \n第 6 章，排版、Muse 与网络，讨论了如何在网页上添加和设置文本样式。我们将研究如何将图像与文本框中的环绕文本结合起来。我们讨论标题从组织和 SEO 角度的重要性，并了解如何向页面添加对人类访客隐藏的元数据。\n\
  \n第 7 章，处理图像，教授如何向页面添加图像以及如何通过更改其位置、旋转、复制和裁剪来操作它们。我们讨论了适合在网络上使用的图像文件格式类型以及如何选择合适的格式。\n\
  \n第 8 章，使用小部件自定义 – 菜单和面板，讨论了如何为整个网站创建菜单栏。我们对菜单和网站结构中每个页面出现的各个菜单项进行样式设置。我们将使用手风琴面板作为一种方式，在不占用太多空间的情况下在页面上放置大量文本。\n\
  \n第 9 章，更多小部件 – 组合和幻灯片，讨论了组合和幻灯片小部件，它们允许我们在几乎没有编码的情况下向页面添加非常有用的交互性和功能。我们还将了解如何从其他网站（例如\
  \ YouTube、Google 地图或 Twitter）获取代码并将其嵌入到 Muse 网页中。\n\n第 10 章，Muse，认识 Adobe Creative\
  \ Suite，探讨了我们如何在 Photoshop 中创建分层图像，然后将其作为 Photoshop 按钮放置在 Muse 中。这使我们能够创建具有多种状态的按钮，这是一种向网站访客提供反馈的有用方法。我们还将看到将另一程序中创建的图像复制并粘贴到\
