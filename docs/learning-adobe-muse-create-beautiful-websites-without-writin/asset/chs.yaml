  \n# Mastering Adobe Captivate 6\n\nISBN: 978-1-849692-44-1        Paperback: 476\
  \ pages\n\nCreate professional SCORM-compliant eLearning content with Adobe Captivate\n\
  \n+   1. Step by step tutorial to build three projects including a demonstration,\
  \ a simulation and a random SCORM-compliant quiz featuring all possible question\
  \ slides.\n+   2. Enhance your projects by adding interactivity, animations, sound\
  \ and more\n+   3. Publish your project in a wide variety of formats enabling virtually\
  \ any desktop and mobile devices to play your e-learning content\n+   4. Deploy\
  \ your e-Learning content on a SCORM or AICC-compliant LMS\n\n![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_267_1.png)\n\
  \n# Responsive Web Design with HTML5 and CSS3\n\nISBN: 978-1-849693-18-9       \
  \ Paperback: 324 pages\n\nLearn responsive design using HTML5 and CSS3 to adapt\
  \ websites to any browser or screen size\n\n+   1. Everything needed to code websites\
  \ in HTML5 and CSS3 that are responsive to every device or screen size\n+   2. Learn\
  \ the main new features of HTML5 and use CSS3's stunning new capabilities including\
  \ animations, transitions and transformations\n+   3. Real world examples show how\
  \ to progressively enhance a responsive design while providing fall backs for older\
  \ browsers\n\n![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_268_0.png)\n\n![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_268_1.png)\n\
  \n# Dreamweaver CS5.5 Mobile and Web Development with HTML5, CSS3, and jQuery\n\n\
  ISBN: 978-1-849691-58-1        Paperback: 284 pages\n\nHarness the cutting edge\
  \ features of Dreamweaver for mobile and web development\n\n+   1. Create web pages\
  \ in Dreamweaver using the latest technology and approach\n+   2. Add multimedia\
  \ and interactivity to your websites\n+   3. Optimize your websites for a wide range\
  \ of platforms and build mobile apps with Dreamweaver\n+   4. A practical guide\
  \ filled with many examples for making the best use of Dreamweaver's latest features\n\
  \n![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_268_2.png)\n\n# Adobe Edge Quickstart\
  \ Guide\n\nISBN: 978-1-849693-30-1        Paperback: 136 pages\n\nQuickly produce\
  \ engaging motion and rich interactivity with Adobe Edge Preview 4 and above\n\n\
  +   1. Learn to use Adobe's newest application to create engaging motion and rich\
  \ interactivity\n+   2. Familiarize yourself with the Edge interface and unleash\
  \ your creativity through standard HTML, CSS, and JavaScript\n+   3. Add motion\
  \ and interactivity to your websites using Web standards\n+   4. A quickstart guide\
  \ for creating engaging content with Adobe Edge\n\n# Learning Adobe Muse\n\nAdobe\
  \ Muse 是世界领先的设计软件公司推出的一款令人兴奋的新工具，它允许用户无需编写任何代码即可创建精美且功能齐全的网站。它为平面设计师提供了将印刷设计技能应用到网络上的能力。\n\
  \n本书将帮助网页设计师以及平面设计师快速掌握 Adobe Muse。\n\n《Learning Adobe Muse》将教您如何使用 Adobe Muse 规划、设计和发布网站。它首先介绍程序的工具和界面，然后介绍您为布局网页所需理解的概念。您将学习如何使用可重用的样式格式化文本、添加图像、创建干净的导航系统，并向页面添加交互元素，如面板和幻灯片，所有这些都不需要编写一行代码！\n\
  \n到本书结束时，您将创建一个设计精良、功能齐全的网站。\n\n# 本书面向对象\n\n本书面向初级网页设计师以及有兴趣将印刷设计技能应用于网络的平面设计师。它将教您如何快速构建网站，而无需学习\
  \ HTML 或 CSS。\n\n![](img/8fa9b5d33ed7ba830d1ac29ef24477e4_275_0.png)\n\n# 您将从本书中学到什么\n\
  \n+   - 从零开始规划一个网站。\n+   - 创建一个功能性网站原型\n+   - 使用主页面在整个网站上应用统一的外观和风格\n+   - 应用诸如投影、斜面和发光等效果\n\
  +   - 向网站添加交互元素，包括图像幻灯片\n+   - 面向新设计师以及从印刷转向网络的平面设计师的设计技巧和建议\n+   - 面向新设计师的设计技巧和建议\n\
